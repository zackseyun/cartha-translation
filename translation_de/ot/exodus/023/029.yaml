  text: לֹ֧א אֲגָרְשֶׁ֛/נּוּ מִ/פָּנֶ֖י/ךָ בְּ/שָׁנָ֣ה אֶחָ֑ת פֶּן תִּהְיֶ֤ה הָ/אָ֨רֶץ֙ שְׁמָמָ֔ה וְ/רַבָּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: de
  text: Ich werde sie nicht in einem einzigen Jahr vor dir vertreiben; sonst würde das Land veröden und die wilden Tiere würden für dich zu zahlreich werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Ich werde sie nicht vertreiben
  rationale: גרש bedeutet „vertreiben“. Das Objektsuffix ist formal singularisch, bezieht sich im Zusammenhang aber kollektiv auf die zuvor genannten Bewohner; im Deutschen gibt „sie“ diesen Bezug verständlich wieder.
- source_word: מִפָּנֶיךָ
  choice: vor dir
  rationale: Die hebräische Wendung bezeichnet räumlich das Entfernen aus dem Bereich vor Israel; „vor dir vertreiben“ ist knapp, natürlich und bewahrt das Bild.
- source_word: בְּשָׁנָה אֶחָת
  choice: innerhalb eines einzigen Jahres
  rationale: Die Wendung bezeichnet hier den Zeitraum, in dem die Vertreibung nicht vollständig erfolgen wird. „Eines einzigen“ gibt die Betonung von אֶחָת natürlich wieder.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet eine befürchtete negative Folge ein. „Damit … nicht“ ist im heutigen Deutsch natürlicher als „damit nicht etwa“ oder „sonst könnte“.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: das Land verödet
  rationale: שְׁמָמָה bezeichnet einen verwüsteten beziehungsweise verlassenen Zustand; „verödet“ bringt die entstehende Unbewohntheit prägnant zum Ausdruck.
- source_word: וְרַבָּה עָלֶיךָ
  choice: zu deinem Schaden überhandnehmen
  rationale: רבה bedeutet „zahlreich werden, sich vermehren“; עָלֶיךָ markiert hier die nachteilige Wirkung auf Israel. Die Formulierung gibt diese Bedrohung idiomatisch wieder, ohne sie zu überzeichnen.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere
  rationale: Die Kollektivwendung bezeichnet die frei lebenden Landtiere. „Wilde Tiere“ ist gegenwärtiges, klares Deutsch; „Tiere des Feldes“ wäre formaler, aber missverständlicher.
theological_decisions: []
translation_notes:
