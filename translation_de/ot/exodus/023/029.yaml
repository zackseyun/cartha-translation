  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: Gott wird die Bewohner nicht in einem Jahr vertreiben, weil eine Verödung des Landes und eine bedrohliche Zunahme wilder Tiere befürchtet wird. Die pluralische Wiedergabe von אֲגָרְשֶׁנּוּ ist im Kontext als kollektiver Bezug vertretbar. Die Konstruktion „damit ... nicht“ macht פֶּן jedoch zu einem direkten Zweck und ist weniger genau als eine Warnfolge („sonst“/„damit nicht etwa“).'
