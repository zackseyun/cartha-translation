  terminology: „vertreiben“, „Land“, „veröden“ und „wilde Tiere“ sind angemessen. „Zu deinem Schaden überhandnehmen“ ist möglich, deutet die Schadensfolge aber etwas stärker aus als der hebräische Wortlaut. „Für dich zu zahlreich werden“ gibt sowohl רבה als auch die Bedrohungsrichtung von עָלֶיךָ zurück.
