  text: לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַ/עֲקָרָ֖ה בְּ/אַרְצֶ֑/ךָ אֶת מִסְפַּ֥ר יָמֶ֖י/ךָ אֲמַלֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/026.yaml
  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: de
  text: In deinem Land wird es weder Fehlgeburten noch Unfruchtbarkeit geben.[a] Ich werde die Zahl deiner Tage voll machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Kinder beraubt«. Das hebräische Wort kann allgemeiner den Verlust von Kindern oder Nachkommen bezeichnen; zusammen mit »unfruchtbar« geht es hier wahrscheinlich besonders um Fehlgeburten oder den Verlust von Nachwuchs bei der Geburt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Ich werde die Zahl deiner Tage voll machen«, das heißt: »Ich werde deine Lebenszeit zu ihrem vollen Maß bringen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: eine Fehlgeburt erleiden
  rationale: Das feminine Partizip von שׁכל bezeichnet hier, zusammen mit »unfruchtbar«, am ehesten den Verlust der Leibesfrucht. Die verbale deutsche Formulierung ist natürlich und wahrt den Bezug auf ein weibliches Subjekt, ohne ausdrücklich nur Frauen statt möglicherweise auch weiblicher Tiere zu nennen.
- source_word: עֲקָרָה
  choice: unfruchtbar
  rationale: Das feminine Adjektiv bezeichnet die Unfähigkeit, Nachkommen hervorzubringen. »Unfruchtbar« ist im heutigen Standarddeutsch klar und entspricht dem Segenskontext.
- source_word: בְּאַרְצֶךָ
  choice: in deinem Land
  rationale: אֶרֶץ meint hier das Israel zugesagte beziehungsweise von ihm bewohnte Land; »in deinem Land« bewahrt den Bundes- und Landbezug.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: die Zahl deiner Tage
  rationale: Die wörtliche Wendung bewahrt das hebräische Bild für die zugemessene Lebensdauer und bleibt auf Deutsch verständlich.
- source_word: אֲמַלֵּא
  choice: werde … voll machen
  rationale: 'מלא bedeutet »füllen, voll machen«. Die Wiedergabe erhält das Bild der Fülle: Gott bringt die zugemessene Zahl der Lebenstage zu ihrem vollen Maß.'
- source_word: לֹא תִהְיֶה
  choice: wird keine … sein
  rationale: Die Konstruktion gibt die hebräische Existenzverneinung natürlich wieder. Das substantivisch gebrauchte feminine »keine« entspricht den femininen Formen der beiden folgenden Prädikate.
theological_decisions:
- issue: Reichweite der Fruchtbarkeits- und Lebensverheißung
  choice: 'Der Vers verheißt im Rahmen des Bundes Segen im Land: Bewahrung vor dem Verlust von Nachwuchs und vor Unfruchtbarkeit sowie ein volles Lebensmaß.'
  alternative: Eine zeitlose, uneingeschränkte Zusage, dass jeder einzelne Gläubige niemals eine Fehlgeburt, Unfruchtbarkeit oder einen frühen Tod erleben werde.
  rationale: Der unmittelbare Zusammenhang betrifft JHWHs Bundesverheißungen an Israel für das Leben im Land. Die Übersetzung wahrt diese Aussage, ohne daraus ausdrücklich eine vom Bundeszusammenhang gelöste Universalgarantie zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das substantivische feminine »keine« lässt offen, ob sich die Zusage nur auf Frauen oder im landwirtschaftlich geprägten Segenskontext auch auf weibliche Tiere bezieht. Die leicht bildhafte Wendung »die Zahl deiner Tage voll machen« bewahrt bewusst die hebräische Metapher; Fußnote b erläutert sie.
