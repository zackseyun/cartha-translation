  text: כִּ֣י אִם שָׁמֹ֤עַ תִּשְׁמַע֙ בְּ/קֹל֔/וֹ וְ/עָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְ/אָֽיַבְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ וְ/צַרְתִּ֖י אֶת צֹרְרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: de
  text: Wenn du aber wirklich auf seine Stimme hörst[a] und alles tust, was ich sage[b], dann werde ich der Feind deiner Feinde und der Gegner deiner Gegner sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „seiner Stimme gewissenhaft gehorchst“. Im Hebräischen wird das Verb durch die Verbindung eines absoluten Infinitivs mit der finiten Verbform nachdrücklich verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: Der Text wechselt von „seine Stimme“ zu „was ich sage“ und bewahrt so im Zusammenhang die enge Verbindung zwischen dem Boten und dem HERRN.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Wenn du aber
  rationale: Die Verbindung leitet einen nachdrücklichen Gegensatz zur vorausgehenden Warnung ein und formuliert zugleich die Bedingung natürlich auf Deutsch.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: wirklich … hörst
  rationale: Der absolute Infinitiv zusammen mit der finiten Verbform verstärkt die Aussage. „Auf seine Stimme hören“ bewahrt sowohl den konkreten Sinn des Hörens als auch den im Zusammenhang naheliegenden Sinn des Gehorchens.
- source_word: בְּקֹלוֹ
  choice: auf seine Stimme
  rationale: Die Formulierung erhält das hebräische Bild und bindet die Aufforderung ausdrücklich an die Stimme des zuvor genannten Boten.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: und alles tust, was ich sage
  rationale: Die Übersetzung bewahrt den auffälligen Wechsel von „seine“ zur göttlichen Rede in der ersten Person. „Sage“ ist im heutigen Deutsch natürlicher als „rede“, ohne den Inhalt zu erweitern.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: werde ich der Feind deiner Feinde … sein
  rationale: Die nominale deutsche Wendung bildet die Wiederholung desselben hebräischen Wortstamms ab und drückt aktive feindliche Gegnerschaft aus.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: und der Gegner deiner Gegner
  rationale: Die parallele Formulierung bewahrt die zweite Stammwiederholung und unterscheidet sie zugleich von „Feind“ im ersten Satzglied.
theological_decisions:
- issue: Wechsel zwischen „seine Stimme“ und „was ich sage“
  choice: Der Personenwechsel bleibt unverändert stehen.
  alternative: Beide Satzteile ausdrücklich nur auf den Boten oder nur auf den HERRN beziehen und sprachlich angleichen.
  rationale: Der hebräische Text verbindet die Stimme des Boten eng mit dem Reden Gottes, ohne das Verhältnis hier ausdrücklich zu erklären. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „auf seine Stimme hören“ lässt den Zusammenhang von Hören und Gehorchen erkennen; die parallelen Ausdrücke „Feind deiner Feinde“ und „Gegner deiner Gegner“ erhalten die hebräischen Wortspiele.
