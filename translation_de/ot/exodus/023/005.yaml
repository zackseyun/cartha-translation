base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: de
  text: Wenn du siehst, dass der Esel dessen, der dich hasst, unter seiner Last am Boden liegt, und du es unterlassen willst, ihm zu helfen,[a] dann sollst du ihm unbedingt helfen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb bedeutet gewöhnlich „aufhören“ oder „unterlassen“. Die Wendung kann auch wiedergegeben werden: „und du willst davon absehen, ihm zu helfen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das abschließende hebräische Wort kann bedeuten: „mit ihm“. Das maskuline Suffix kann sich auf den Besitzer oder auf den Esel beziehen. Gemeint sein kann also, dem Besitzer bei seinem Esel zu helfen, oder dem Esel selbst zu helfen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier einen kasuistischen Rechtssatz ein; „Wenn“ gibt die Bedingung im Deutschen natürlich wieder.
- source_word: תִרְאֶה
  choice: du siehst
  rationale: Die direkte Bedeutung von ראה bleibt erhalten, ohne die Situation als zufällige Begegnung auszudeuten.
- source_word: חֲמוֹר
  choice: Esel
  rationale: „Esel“ ist die klare, gegenwärtige deutsche Entsprechung.
- source_word: שֹׂנַאֲךָ
  choice: dessen, der dich hasst
  rationale: Das substantivierte Partizip bezeichnet wörtlich jemanden, der den Angesprochenen hasst; die Wiedergabe vermeidet die Verallgemeinerung zu „Feind“.
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: unter seiner Last zusammengebrochen ist
  rationale: רבץ bezeichnet das Niederliegen eines Tieres. Im Zusammenhang mit der Last vermittelt „zusammengebrochen“ die konkrete Notlage natürlicher als das missverständliche „liegt“, ohne eine Verletzung zu behaupten.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: und du zögerst, ihm zu helfen
  rationale: Die schwierige Wendung beschreibt das Unterlassen beziehungsweise Zurückhalten der Hilfe. „Zögerst“ wahrt diesen Gedanken in natürlichem Deutsch, ohne ihn als endgültige Weigerung festzulegen.
- source_word: עָזֹב תַּעֲזֹב
  choice: musst du ihm unbedingt ... helfen
  rationale: Infinitivus absolutus und finite Verbform verstärken die Verpflichtung. עזב hat hier kontextuell den Sinn des Helfens beziehungsweise Entlastens.
- source_word: עִמּוֹ
  choice: ihm ... helfen
  rationale: Das maskuline Suffix wird im Haupttext auf den Besitzer bezogen. Die grammatisch mögliche Beziehung auf den Esel wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezug des abschließenden Pronomens עִמּוֹ
  choice: mit ihm, also mit dem Besitzer
  alternative: mit ihm, also mit dem Esel
  rationale: Das maskuline Singularsuffix kann grammatisch sowohl auf den Besitzer als auch auf den Esel zurückweisen. Der Haupttext folgt der zwischenmenschlichen Lesart, nach der man dem Hassenden bei seinem Tier hilft; die sachlich mögliche tierbezogene Lesart bleibt in der Fußnote sichtbar.
- issue: Bedeutung von עזב in der Hilfeformel
  choice: helfen beziehungsweise entlasten
  alternative: verlassen beziehungsweise sich selbst überlassen
  rationale: Obwohl עזב gewöhnlich „verlassen“ bedeutet, verlangt der Zusammenhang hier eine Hilfeleistung am unter der Last liegenden Tier. Die Übersetzung gibt die kontextuelle Funktion wieder, während die Fußnote die lexikalische Schwierigkeit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsform wird als Wenn-dann-Satz wiedergegeben. „Zusammengebrochen“ verdeutlicht die durch die Last verursachte Notlage; „beim Entlasten helfen“ macht die konkrete Handlung verständlich, während die Fußnoten die ungewöhnliche hebräische Wiederholung von עזב und den mehrdeutigen Pronomenbezug dokumentieren.
