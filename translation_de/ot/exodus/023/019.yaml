  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: de
  text: Den ersten Anteil der Erstlingsfrüchte deines Ackerbodens sollst du in das Haus Jahwes, deines Gottes, bringen.[a] Du sollst ein Zicklein[b] nicht in der Milch seiner Mutter kochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deines Landes“.'
    reason: אַדָמָה kann in diesem landwirtschaftlichen Zusammenhang „Ackerboden“ oder weiter „Land“ bezeichnen.
  - marker: b
    text: Hebräisch גְּדִי; gewöhnlich ein Zicklein, möglicherweise allgemeiner ein Jungtier.
    reason: גְּדִי meint normalerweise ein junges Ziegentier, kann in seinem Bedeutungsumfang jedoch weiter sein.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: das Erste von den Erstlingsfrüchten
  rationale: 'Die Wiedergabe erhält die auffällige Verbindung beider Ausdrücke: רֵאשִׁית bezeichnet den ersten Anteil, בִּכּוּרִים den kultisch bestimmten Erstertrag. Eine Glättung zu nur „Erstlingsfrüchte“ würde einen Bestandteil verkürzen.'
- source_word: אַדְמָתְךָ
  choice: deines Ackerbodens
  rationale: אֲדָמָה bezeichnet hier den landwirtschaftlich genutzten Boden. „Ackerboden“ wahrt den konkreten agrarischen Bezug besser als das weiter gefasste „Land“.
- source_word: תָּבִיא
  choice: sollst du … bringen
  rationale: Der Hifil-Imperfekt trägt in diesem Rechtstext verpflichtenden Weisungscharakter. Die deutsche Soll-Form gibt diesen angemessen und natürlich wieder.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: in das Haus Jahwes, deines Gottes
  rationale: בַּיִת wird als „Haus“ wiedergegeben, ohne den Text auf den späteren Tempel festzulegen. Der Gottesname יהוה erscheint als „Jahwe“.
- source_word: לֹא תְבַשֵּׁל
  choice: du sollst … nicht … kochen
  rationale: בשל kann das Garen beziehungsweise Kochen bezeichnen. Das deutsche „kochen“ ist hier natürlich und bewahrt den konkreten Vorgang, ohne eine unbelegte nähere Erklärung einzutragen.
- source_word: גְּדִי
  choice: ein Ziegenjunges
  rationale: גְּדִי bezeichnet gewöhnlich ein Ziegenjunges. Diese Formulierung ist im modernen Deutschen klar und legt das im Hebräischen nicht ausdrücklich bezeichnete Geschlecht nicht fest.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: in der Milch seiner Mutter
  rationale: Die Formulierung folgt dem konkreten Bild des Hebräischen und ist zugleich idiomatisches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen; „Jehova“ beruht auf einer späteren Mischlesung.
- issue: Sinn des Verbots, ein Ziegenjunges in der Milch seiner Mutter zu kochen
  choice: Das wörtlich ausgesprochene Verbot bleibt ohne zusätzliche Deutung stehen.
  alternative: Eine Erklärung als Abgrenzung von einem kanaanäischen Ritus, als Tierschutzgebot oder als Grundlage einer umfassenderen Speisetrennung in den Haupttext aufnehmen.
  rationale: Der Vers selbst nennt keinen Grund und beschreibt keine weitergehende Anwendung. Die Übersetzung bewahrt diese Offenheit und fügt keine bestimmte historische oder theologische Erklärung ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtssprachlicher Soll-Form. Die leicht markierte Wiederholung „das Erste von den Erstlingsfrüchten“ bewahrt die Struktur des hebräischen Ausdrucks. „Haus“ vermeidet die historische Verengung auf einen festen Tempelbau.
