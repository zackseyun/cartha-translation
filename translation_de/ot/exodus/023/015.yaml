source:
  edition: WLC
  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: de
  text: Das Fest der ungesäuerten Brote sollst du halten. Sieben Tage lang sollst du ungesäuertes Brot essen, wie ich dir geboten habe, zur festgesetzten Zeit im Monat Abib, denn in diesem Monat bist du aus Ägypten ausgezogen. Und sie sollen nicht mit leeren Händen vor mir erscheinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und niemand soll mit leeren Händen vor mir erscheinen.“ Im Hebräischen wechselt die Form hier von der Anrede in der Einzahl zu einem Verb in der dritten Person Mehrzahl.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: „Fest“ gibt חַג im kultisch-kalendarischen Zusammenhang klar wieder; „ungesäuerte Brote“ bewahrt den Plural von מַצּוֹת und ist im Deutschen als biblische Festbezeichnung geläufig.
- source_word: תִּשְׁמֹר
  choice: sollst du halten
  rationale: שׁמר bedeutet hier ein Fest vorschriftsgemäß begehen. „Halten“ wahrt den rechtlich-kultischen Ton und klingt würdig und verständlich.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Sieben Tage lang sollst du ungesäuertes Brot essen
  rationale: Die Zeitdauer wird natürlich ausgedrückt; beim zu essenden Brot ist im Deutschen der Stoffsingular idiomatischer, obwohl die Festbezeichnung den hebräischen Plural bewahrt.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: wie ich dir geboten habe
  rationale: Gibt Vergleich und vollendeten göttlichen Auftrag ohne Zusatz wieder.
- source_word: לְמוֹעֵד
  choice: zur festgesetzten Zeit
  rationale: מוֹעֵד bezeichnet hier den festgelegten kalendarischen Zeitpunkt, nicht einen Ort der Begegnung.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: im Monat Abib
  rationale: Abib wird als kalendarische Bezeichnung transliteriert; eine Bedeutungsübersetzung wie „Ährenmonat“ würde seine Funktion als Monatsname weniger deutlich machen.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: denn in diesem Monat bist du aus Ägypten ausgezogen
  rationale: Das Pronomen בוֹ bezieht sich am nächsten liegend auf den genannten Monat. Die explizite Wiederaufnahme vermeidet im Deutschen einen unklaren Bezug.
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: Und sie sollen nicht mit leeren Händen vor mir erscheinen
  rationale: Die Wiedergabe bewahrt den Wechsel vom Singular der vorherigen Anrede zum Verb in der 3. Person Plural. „Vor mir erscheinen“ gibt die Wendung mit פָנַי idiomatisch wieder; „mit leeren Händen“ lässt die Art der erwarteten Gabe offen.
theological_decisions:
- issue: Göttliche Gegenwart in der Wendung פָנַי
  choice: vor mir
  alternative: vor meinem Angesicht
  rationale: Wörtlich steht „mein Angesicht“, doch die feste Wendung bezeichnet das Erscheinen in Gottes Gegenwart. „Vor mir“ ist natürlich und bewahrt den persönlichen Gottesbezug.
- issue: Numeruswechsel im letzten Satzteil
  choice: sie sollen nicht
  alternative: niemand soll
  rationale: Der hebräische Text wechselt von der Anrede im Singular zu einem Verb in der 3. Person Plural. Die Hauptübersetzung erhält diese formale Spannung, statt sie stillschweigend zu glätten; eine idiomatische Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem rechtlich-kultischem Ton. Die Syntax bleibt quellennah, wird aber durch „in diesem Monat“ und „mit leeren Händen“ idiomatisch verständlich. Der auffällige Numeruswechsel des Hebräischen wird im Haupttext bewahrt und in einer Fußnote erläutert.
