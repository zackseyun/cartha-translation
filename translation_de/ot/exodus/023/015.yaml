  source_fidelity: 'Der deutsche Text gibt den hebräischen Wortlaut und die Satzfolge zuverlässig wieder: die Verpflichtung zur Feier, die siebentägige Dauer, die ungesäuerten Brote, die festgesetzte Zeit im Monat Abib, der Auszug aus Ägypten sowie das Verbot, leer vor Gott zu erscheinen. „In diesem Monat“ löst den im Deutschen sonst unklaren Bezug von בוֹ angemessen auf. Der Wechsel vom Singular der Anrede zur dritten Person Plural im Schlusssatz ist bewusst und korrekt bewahrt.'
