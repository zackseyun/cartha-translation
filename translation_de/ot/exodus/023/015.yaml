  terminology: Die zentralen Begriffe sind konsistent und quellengetreu wiedergegeben. „Fest“ für חַג, „halten“ für תִּשְׁמֹר, „ungesäuertes Brot“ für מַצּוֹת und „mit leeren Händen“ für רֵיקָם sind treffend. „Abib“ wahrt den Monatsnamen, ohne dessen Bedeutung unzulässig zu interpretieren. „Vor mir“ gibt die idiomatische Bedeutung von פָנַי natürlich wieder.
