  terminology: „Schuldiger“ ist im Rechtskontext eine angemessene Wiedergabe von רָשָׁע, ohne eine konfessionell geprägte Deutung einzutragen. „Gewalttätiger Zeuge“ hält die Gewalt-/Unrechtskomponente von חָמָס stärker fest als „falscher Zeuge“ und wahrt die lexikalische Offenheit gegenüber „böswillig“ oder „ungerecht“.
