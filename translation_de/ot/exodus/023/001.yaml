  source_fidelity: 'Die erste Satzhälfte gibt לֹא תִשָּׂא שֵׁמַע שָׁוְא treffend wieder. In der zweiten Satzhälfte trifft „Zeuge des Unrechts“ die Konstruktion עֵד חָמָס jedoch nicht ausreichend: Es kann im Deutschen einen Zeugen meinen, der Unrecht lediglich beobachtet hat. Der hebräische Ausdruck bezeichnet im gerichtlichen Zusammenhang vielmehr einen Zeugen, dessen Aussage Gewalt bzw. Unrecht bewirkt oder unterstützt. „Als gewalttätiger Zeuge aufzutreten“ bewahrt die stärkere, bewusst nicht auf bloße Falschaussage eingeengte Bedeutung von חָמָס.'
