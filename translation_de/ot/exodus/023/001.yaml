  yaml_path: translation/ot/exodus/023/001.yaml
  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: de
  text: Du sollst kein falsches Gerücht verbreiten.[a] Stell dich nicht auf die Seite eines Schuldigen, um als gewalttätiger Zeuge aufzutreten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „kein falsches Gerücht tragen/weitertragen“. Das hebräische Verb bedeutet „heben, tragen“ und bezeichnet hier das Verbreiten dessen, was man gehört hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Setze deine Hand nicht mit einem Schuldigen, um ein Zeuge der Gewalt zu sein.“ Die Wendung „die Hand mit jemandem setzen“ bezeichnet hier, sich mit ihm zu verbünden oder ihn zu unterstützen. „Zeuge der Gewalt“ kann im gerichtlichen Zusammenhang einen gewalttätigen, böswilligen oder ungerechten Zeugen meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: verbreiten
  rationale: נשׂא bedeutet wörtlich „heben, tragen“; in Verbindung mit שֵׁמַע bezeichnet es hier das Weitertragen beziehungsweise Verbreiten einer Nachricht oder eines Gerüchts.
- source_word: שֵׁמַע שָׁוְא
  choice: ein falsches Gerücht
  rationale: שֵׁמַע ist etwas Gehörtes, also eine Nachricht oder ein Gerücht; שָׁוְא kann Falschheit, Nichtigkeit oder Haltlosigkeit bezeichnen. „Falsches Gerücht“ ist im Deutschen klar und entspricht dem rechtlich-ethischen Zusammenhang.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: verbünde dich mit
  rationale: Die Wendung lautet wörtlich „deine Hand zu/mit jemandem setzen“ und bezeichnet hier die bewusste Zusammenarbeit oder Parteinahme. „Sich verbünden“ gibt den Sinn natürlich wieder, ohne das im Deutschen missverständliche Bild des Handreichens zu erzwingen.
- source_word: רָשָׁע
  choice: ein Frevler
  rationale: רָשָׁע bezeichnet einen schuldigen, bösen oder rechtswidrig handelnden Menschen. „Frevler“ bewahrt die moralische und rechtliche Färbung sowie die maskuline Singularform des Hebräischen.
- source_word: עֵד חָמָס
  choice: Zeuge des Unrechts
  rationale: עֵד bedeutet „Zeuge“; חָמָס umfasst Gewalt, Unrecht und rücksichtsloses rechtswidriges Handeln. „Zeuge des Unrechts“ bewahrt die kräftige Bedeutung, ohne die im Hebräischen offene Beziehung zwischen Zeuge, Aussage und Unrecht vorschnell festzulegen.
- source_word: לֹא / אַל
  choice: du sollst nicht / verbünde dich nicht
  rationale: Beide Partikeln formulieren Verbote. Der erste Satz erhält die gesetzliche Form „Du sollst nicht“, der zweite die im Deutschen natürliche direkte Aufforderung „Verbünde dich nicht“.
theological_decisions:
- issue: Bedeutung von עֵד חָמָס im gerichtlichen Zusammenhang
  choice: Zeuge des Unrechts
  alternative: gewalttätiger, böswilliger, falscher oder ungerechter Zeuge
  rationale: חָמָס ist stärker und weiter als bloße Unwahrheit und kann Gewalt ebenso wie schweres Unrecht bezeichnen. Die gewählte Fassung hält diese Spannung offen; die Fußnote nennt die naheliegenden kontextuellen Deutungen.
- issue: Maskuline Singularformen in der Rechtsanweisung
  choice: Singularische Anrede und „Frevler“ beibehalten
  alternative: Geschlechtsneutrale Plural- oder Personenbezeichnung
  rationale: Der hebräische Text spricht einen einzelnen männlich markierten Adressaten an und nennt einen männlich markierten רָשָׁע. Die deutsche Fassung bildet diese Form ab, ohne daraus eine Beschränkung des Anwendungsbereichs abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter gesetzlicher Anrede. „Frevler“ ist leicht gehoben, bewahrt aber die moralisch-rechtliche Schärfe von רָשָׁע. Die ungewöhnliche Wendung „Zeuge des Unrechts“ bleibt bewusst quellennah und wird durch die Fußnote erläutert.
