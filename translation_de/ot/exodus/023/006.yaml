  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: de
  text: Du sollst das Recht deines Armen in seinem Rechtsstreit nicht beugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du sollst deinem Armen in seinem Rechtsstreit das Recht nicht verweigern.“'
    reason: 'Lexikalische Alternative: תַטֶּה kann im gerichtlichen Zusammenhang sinngemäß das Vorenthalten beziehungsweise Verweigern des Rechts bezeichnen; die Hauptfassung bildet das Bild des „Beugens“ formnäher ab.'
lexical_decisions:
- source_word: לֹא תַטֶּה
  choice: du sollst … nicht beugen
  rationale: Die Verneinung mit der Hifil-Form von נטה formuliert ein Verbot. „Das Recht beugen“ ist im Deutschen eine natürliche und präzise juristische Wendung für das Verfälschen oder Verdrehen eines gerechten Urteils.
- source_word: מִשְׁפַּט
  choice: das Recht
  rationale: Im gerichtlichen Zusammenhang bezeichnet מִשְׁפָּט den rechtmäßigen Anspruch beziehungsweise die gerechte Entscheidung, die dem Betroffenen zusteht. „Das Recht“ bewahrt die knappe juristische Aussage.
- source_word: אֶבְיֹנְךָ
  choice: eines Armen bei dir
  rationale: אֶבְיוֹן bezeichnet einen armen oder bedürftigen Menschen. „Eines Armen“ wahrt den substantivischen Singular; „bei dir“ gibt die Zugehörigkeitsbeziehung des Suffixes der zweiten Person idiomatisch wieder, ohne Besitz am Menschen anzudeuten.
- source_word: בְּרִיבוֹ
  choice: in seinem Rechtsstreit
  rationale: רִיב kann Streit, Rechtssache oder Prozess bedeuten. Der Kontext ist ausdrücklich rechtlich; „Rechtsstreit“ bewahrt sowohl die forensische Bedeutung als auch das männliche Singularsuffix.
theological_decisions:
- issue: Richtung der geforderten Unparteilichkeit
  choice: Verbot, das einem Armen zustehende Recht in seiner Rechtssache zu beugen
  alternative: Allgemeiner Aufruf, Armen Gerechtigkeit zu gewähren, oder Verbot einer Bevorzugung des Armen
  rationale: Der hebräische Satz macht מִשְׁפַּט zum Gegenstand des Beugens und nennt den Armen als denjenigen, dessen Rechtssache betroffen ist. Daher geht es konkret darum, ihn vor Benachteiligung vor Gericht zu schützen; zugleich wird keine Bevorzugung aufgrund seiner Armut gefordert.
translation_notes:
  register: Moderne, würdevolle Rechtssprache. Die Anrede bleibt entsprechend dem hebräischen Singular bei „du“. „Eines Armen bei dir“ vermeidet das im heutigen Deutsch missverständliche „deines Armen“, bewahrt aber die lokale beziehungsweise gemeinschaftliche Zuordnung des Suffixes.
