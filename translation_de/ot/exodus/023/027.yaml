base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: de
  text: Meinen Schrecken[a] werde ich dir voraussenden und alle Völker, zu denen du kommst, in Verwirrung stürzen[b]. Ich werde alle deine Feinde dazu bringen, vor dir den Rücken zu kehren[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Grauen“ oder „meine Furcht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in Bestürzung versetzen“ oder „in panischen Aufruhr bringen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Ich werde alle deine Feinde dir als Rücken/Nacken geben“; das heißt, sie werden sich abwenden und vor dir fliehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵימָתִי
  choice: meinen Schrecken
  rationale: אֵימָה bezeichnet Schrecken, Grauen oder Furcht. „Meinen Schrecken“ bewahrt den Possessivbezug und die Vorstellung eines von Gott vorausgesandten, furchterregenden Wirkens.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: werde ich vor dir hersenden
  rationale: שׁלח mit לִפְנֵי bezeichnet das Voraussenden. „Vor dir hersenden“ gibt Richtung und zeitlichen Vorrang natürlich wieder.
- source_word: וְהַמֹּתִי
  choice: in Verwirrung stürzen
  rationale: Die Hifil-Form von המם bezeichnet das Versetzen in Verwirrung, Bestürzung oder panischen Aufruhr. Die Formulierung bewahrt die kausative Kraft, ohne bereits vollständige Niederlage auszudrücken.
- source_word: כָּל הָעָם
  choice: alle Völker
  rationale: Das singularische עָם kann distributiv-kollektiv die verschiedenen Bevölkerungsgruppen bezeichnen, denen Israel begegnen wird. Im Deutschen macht „alle Völker“ diesen Bezug klar und stimmt mit dem pluralischen Pronomen in בָהֶם überein.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: zu denen du kommst
  rationale: Die Wendung bezeichnet die Menschen beziehungsweise Völker, in deren Bereich Israel kommt. „Zu denen du kommst“ wahrt die räumliche Aussage, ohne das stärker deutende „gegen die du ziehst“ einzuführen.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: werde ich vor dir zur Flucht wenden
  rationale: Die idiomatische Wendung bedeutet, dass die Feinde Israel den Rücken beziehungsweise Nacken zukehren und fliehen. Die Übersetzung gibt die Bedeutung verständlich wieder; die Fußnote bewahrt das hebräische Bild.
theological_decisions:
- issue: Göttliches Handeln bei militärischem Sieg und ausgelöster Panik
  choice: Gottes unmittelbares Handeln bleibt durch die drei Verben in der ersten Person ausdrücklich erhalten.
  alternative: Indirekte Formulierungen, die Gottes Verursachung abschwächen.
  rationale: 'Im Hebräischen ist Gott jeweils ausdrücklich handelndes Subjekt: Er sendet den Schrecken, versetzt die Völker in Verwirrung und bewirkt die Flucht der Feinde. Diese Spannung wird nicht gemildert.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt den von Gott vorausgesandten Schrecken hervor. „Zur Flucht wenden“ ist verständlich und bewahrt durch die Fußnote zugleich das konkrete hebräische Bild von Rücken beziehungsweise Nacken.
