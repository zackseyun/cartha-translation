    issue: Die Wiedergabe „Alle deine Feinde werde ich vor dir zur Flucht wenden“ ist im Deutschen idiomatisch und syntaktisch missglückt.
    rationale: Die hebräische Wendung נתן ... עורף bezeichnet das Bewirken, dass Feinde den Rücken zuwenden bzw. fliehen. Deutsch „zur Flucht wenden“ nimmt nicht klar die Feinde als Handelnde in den Blick und bewahrt die Bildsprache nicht zuverlässig.
  - severity: low
    issue: „Vor dir hersenden“ ist weniger flüssig als „dir voraussenden“.
    rationale: Beide Formulierungen geben לְפָנֶיךָ angemessen wieder; „dir voraussenden“ entspricht jedoch dem modernen Standardgebrauch besser.
