- from: Meinen Schrecken[a] werde ich vor dir hersenden und alle Völker, zu denen du kommst, in Verwirrung stürzen[b]. Alle deine Feinde werde ich vor dir zur Flucht wenden[c].
  to: Meinen Schrecken[a] werde ich dir voraussenden und alle Völker, zu denen du kommst, in Verwirrung stürzen[b]. Ich werde alle deine Feinde dazu bringen, vor dir den Rücken zu kehren[c].
  rationale: Die Revision glättet die Richtungsangabe beim Voraussenden und ersetzt die missglückte Schlusskonstruktion durch eine moderne, klare Formulierung. Sie wahrt dabei Gottes direkte Verursachung, die feindliche Abwendung und das hebräische Rücken-/Nackenbild in der Fußnote.
