  text: הִשָּׁ֧מֶר מִ/פָּנָ֛י/ו וּ/שְׁמַ֥ע בְּ/קֹל֖/וֹ אַל תַּמֵּ֣ר בּ֑/וֹ כִּ֣י לֹ֤א יִשָּׂא֙ לְ/פִשְׁעֲ/כֶ֔ם כִּ֥י שְׁמִ֖/י בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: de
  text: Hüte dich vor ihm und höre auf seine Stimme. Widersetze dich ihm nicht, denn er wird eure Übertretung nicht vergeben; denn mein Name ist in ihm[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „mein Name ist in seinem Inneren“; sinngemäß: „Er trägt meinen Namen.“ Die Wendung weist auf göttliche Vollmacht hin, bestimmt aber das genaue Wesen des Boten nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Hüte dich vor ihm
  rationale: Der Nifal-Imperativ von שׁמר fordert zu wachsamer Vorsicht auf. Zusammen mit מִפָּנָיו ist „Hüte dich vor ihm“ natürlich, eindringlich und näher an der Warnformel als das schwächere „Sei vorsichtig in seiner Gegenwart“.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: und höre auf seine Stimme
  rationale: שׁמע mit בְּקוֹל schließt das Befolgen und Gehorchen ein. „Auf seine Stimme hören“ bewahrt das Bild des hebräischen Ausdrucks und trägt im Deutschen zugleich den Gehorsamsaspekt.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Widersetze dich ihm nicht
  rationale: מרה bezeichnet hier trotzige Auflehnung gegen Autorität. „Sich widersetzen“ gibt die Warnung idiomatisch wieder, ohne den unmittelbar folgenden Begriff פשע durch die Wiederholung von „sich auflehnen“ vorwegzunehmen.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: er wird eure Übertretung nicht vergeben
  rationale: נשא bezeichnet in Verbindung mit Schuld oder Vergehen idiomatisch deren Wegnahme beziehungsweise Vergebung. „Vergeben“ ist im modernen Deutsch klar; der kollektive Singular „Übertretung“ folgt dem Hebräischen.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: mein Name ist in ihm
  rationale: בְּקִרְבּוֹ bedeutet wörtlich „in seinem Inneren/in ihm“. Die knappe Wiedergabe erhält die starke, aber nicht näher erklärte Aussage über die Beziehung des Boten zum göttlichen Namen.
theological_decisions:
- issue: Wesen des Boten und Bedeutung des göttlichen Namens in ihm
  choice: Die Formulierung „mein Name ist in ihm“ bleibt ohne ontologische Präzisierung stehen.
  alternative: „Er trägt meinen Namen“ beziehungsweise eine ausdrückliche Deutung als bevollmächtigter geschaffener Engel oder als unmittelbare Erscheinung Gottes.
  rationale: Der Vers schreibt dem Boten göttliche Autorität zu, bestimmt aber sein genaues Wesen nicht ausdrücklich. Die Übersetzung bewahrt diese theologische Spannung.
- issue: Aussage, dass der Bote die Übertretung nicht vergeben wird
  choice: Die negative Aussage wird uneingeschränkt als „er wird eure Übertretung nicht vergeben“ wiedergegeben.
  alternative: Eine abschwächende oder erklärende Paraphrase, etwa dass Ungehorsam lediglich nicht ungestraft bleibe.
  rationale: Der hebräische Text formuliert direkt mit נשא und lässt die genaue Beziehung zwischen göttlicher Vergebung, Vollmacht des Boten und Gericht unausgeführt; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom singularischen Boten („ihm“) zum pluralischen Adressaten („eure“) entspricht dem hebräischen Text. Die Satzstruktur bleibt knapp und eindringlich.
