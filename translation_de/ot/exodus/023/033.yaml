source:
  edition: WLC
  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: de
  text: Sie sollen nicht in deinem Land wohnen, damit sie dich nicht dazu bringen, gegen mich zu sündigen.[a] Denn wenn du ihren Göttern dienst,[b] wird dir das zur Falle.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „damit sie dich nicht gegen mich sündigen lassen“ oder „damit sie dich nicht zur Sünde gegen mich verführen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Denn du würdest ihren Göttern dienen.“ Die hebräische Verknüpfung kann erklärend verstanden werden; der Satz bezeichnet dann die zu erwartende Folge statt einer ausdrücklichen Bedingung.'
    reason: alternative_reading
  - marker: c
    text: „Falle“ gibt das hebräische Wort moqesch wieder, das eigentlich eine Schlinge oder Falle bezeichnet und hier bildlich für etwas steht, das zu Abfall und Verderben führt.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: wohnen
  rationale: ישׁב bezeichnet hier das Wohnen oder dauerhafte Verbleiben im Land. „Wohnen“ ist im modernen Deutschen natürlich und legt nicht unnötig eine förmliche Ansiedlung fest.
- source_word: בְּאַרְצְךָ
  choice: in deinem Land
  rationale: אֶרֶץ bezeichnet in diesem territorialen Zusammenhang das Land; „Land“ bewahrt zugleich den Bundes- und Landkontext des Abschnitts.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet eine befürchtete, zu verhindernde Folge ein. Die deutsche Konstruktion gibt diesen warnenden Zweck- beziehungsweise Folgesinn idiomatisch wieder.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: sie dich dazu bringen, gegen mich zu sündigen
  rationale: 'Die Hifil-Form von חטא ist kausativ: Sie bringen jemanden zum Sündigen. לִי wird im ethischen Sinn als „gegen mich“ verstanden.'
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: wenn du ihren Göttern dienst
  rationale: עבד bezeichnet in Verbindung mit Göttern ihren Dienst beziehungsweise ihre Verehrung. „Dienen“ bewahrt die Sprache religiöser und bundeshafter Loyalität; die konditionale Wiedergabe passt zur folgenden Warnung, während die mögliche erklärende Lesart in der Fußnote erhalten bleibt.
- source_word: אֱלֹהֵיהֶם
  choice: ihren Göttern
  rationale: Der schlichte Plural „Götter“ ist die direkte und kontextgerechte Wiedergabe.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: wird dir das zur Falle
  rationale: מוֹקֵשׁ ist eine Schlinge oder Falle und wird hier bildlich für etwas gebraucht, das zu Abfall und Verderben führt. „Zur Falle werden“ gibt die Ergebnisaussage natürlich wieder, ohne ein im Hebräischen nicht eigens ausgedrücktes Verstärkungswort hinzuzufügen.
theological_decisions:
- issue: Art der angekündigten Sünde
  choice: Die Warnung bezieht sich konkret auf Untreue gegenüber Gott durch den Dienst an fremden Göttern.
  alternative: Eine allgemeine Warnung vor sittlicher Beeinflussung durch fremde Nachbarn.
  rationale: Der unmittelbar folgende Satz über den Dienst an ihren Göttern bestimmt die gemeinte Sünde näher. Die Übersetzung wahrt diesen Zusammenhang, ohne daraus eine allgemeine ethnische Abgrenzung abzuleiten.
- issue: Verknüpfung des Satzes über den Götterdienst
  choice: 'Konditional: „Denn wenn du ihren Göttern dienst“'
  alternative: 'Erklärend beziehungsweise als wahrscheinliche Folge: „Denn du würdest ihren Göttern dienen“'
  rationale: Die wiederholte Konjunktion כִּי lässt im Zusammenhang mehr als eine syntaktische Deutung zu. Die konditionale Fassung ergibt im Deutschen eine klare Warnung; die erklärende Lesart wird in der Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzstruktur bleibt knapp und warnend. „Dienen“ und „Falle“ bewahren die zentralen Bilder und die religiöse Loyalitätssprache des Hebräischen; syntaktische Mehrdeutigkeit wird nicht stillschweigend beseitigt, sondern in einer Fußnote dokumentiert.
