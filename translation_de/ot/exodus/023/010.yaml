translation:
  language: de
  text: Sechs Jahre lang sollst du dein Land besäen und seinen Ertrag einbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Erzeugnisse sammeln“.'
