lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Sechs Jahre lang
  rationale: Die Wendung bezeichnet idiomatisch den Zeitraum, in dem die Anweisung gilt. Das einleitende וְ muss im Deutschen nicht eigens mit „und“ wiedergegeben werden.
- source_word: תִּזְרַע
  choice: sollst du … besäen
  rationale: Das Imperfekt der 2. Person Singular hat in diesem Rechtskontext vorschreibende Kraft. „Sollst“ gibt diese angemessen wieder; „das Land besäen“ ist im Deutschen natürlicher als „das Land säen“.
- source_word: אַרְצֶךָ
  choice: dein Land
  rationale: אֶרֶץ bezeichnet hier den landwirtschaftlich genutzten Landbesitz, nicht die Erde im Allgemeinen.
- source_word: וְאָסַפְתָּ
  choice: und … einbringen
  rationale: אָסַף bedeutet sammeln beziehungsweise zusammenbringen. Im landwirtschaftlichen Zusammenhang bezeichnet „einbringen“ natürlich das Einsammeln der Ernte, ohne das folgende Substantiv auf bestimmte Feldfrüchte einzuengen.
- source_word: תְּבוּאָתָהּ
  choice: seinen Ertrag
  rationale: תְּבוּאָה bezeichnet den landwirtschaftlichen Ertrag beziehungsweise die hervorgebrachten Erzeugnisse. Das Pronomen „seinen“ bezieht sich auf „Land“.
