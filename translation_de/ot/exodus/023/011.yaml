base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: de
  text: Im siebten Jahr aber sollst du es ruhen und brachliegen lassen[a], damit die Armen deines Volkes davon essen können; und was sie übrig lassen, sollen die wilden Tiere des Feldes fressen[b]. Ebenso sollst du es mit deinem Weinberg und deinen Ölbäumen halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollst du es freigeben und sich selbst überlassen“. Die hebräischen Verben betonen, dass das Land im siebten Jahr nicht wie üblich bewirtschaftet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Tier des Feldes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Im siebten Jahr aber
  rationale: Der Ausdruck bildet einen zeitlichen Kontrast zu den sechs Jahren des vorhergehenden Verses; die Ergänzung „Jahr“ ergibt sich eindeutig aus dem Zusammenhang.
- source_word: תִּשְׁמְטֶנָּה וּנְטַשְׁתָּהּ
  choice: sollst du es ruhen und brachliegen lassen
  rationale: Die beiden Verben bezeichnen hier das Einstellen der üblichen Bewirtschaftung und das Überlassen des Landes. „Brachliegen lassen“ gibt den landwirtschaftlichen Zusammenhang natürlich wieder, ohne eine dauerhafte Aufgabe des Landes anzudeuten.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: die Armen deines Volkes
  rationale: אֶבְיוֹן bezeichnet Arme beziehungsweise Bedürftige; die Formulierung bewahrt sowohl die soziale Aussage als auch die Zugehörigkeitsangabe.
- source_word: וְיִתְרָם
  choice: was sie übrig lassen
  rationale: Das Suffix bezieht sich auf die Armen; gemeint ist der nach ihrem Essen verbleibende Ertrag.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die wilden Tiere
  rationale: Die hebräische Wendung bedeutet wörtlich „das Tier des Feldes“ und bezeichnet kollektiv die wild lebenden Tiere.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Ebenso sollst du es … halten
  rationale: Die idiomatische deutsche Wendung überträgt die verbindliche Anweisung, dieselbe Regel auf die folgenden Kulturen anzuwenden.
- source_word: לְכַרְמְךָ
  choice: mit deinem Weinberg
  rationale: Der Weinberg ist ein weiterer Bereich, auf den die Sabbatjahrregel anzuwenden ist.
- source_word: לְזֵיתֶךָ
  choice: mit deinen Ölbäumen
  rationale: זַיִת steht hier kollektiv für den Bestand an Olivenbäumen. „Ölbäume“ ist im Deutschen biblisch vertraut und lexikalisch nah am hebräischen Ausdruck.
