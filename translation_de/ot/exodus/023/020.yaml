base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: de
  text: Siehe, ich sende einen Engel[a] vor dir her, um dich auf dem Weg zu bewahren und dich an den Ort zu bringen, den ich vorbereitet habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Boten“. Das hebräische Wort מַלְאָךְ kann einen menschlichen Boten oder einen himmlischen Engel bezeichnen; hier passt „Engel“ am besten zum Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die hinweisende, Aufmerksamkeit weckende und feierliche Funktion der hebräischen Partikel; im würdevollen Bibelregister ist „Siehe“ weiterhin verständlich.
- source_word: אָנֹכִי שֹׁלֵחַ
  choice: ich sende
  rationale: Die Verbindung des selbstständigen Pronomens mit dem Partizip bezeichnet hier Gottes gegenwärtig angekündigtes beziehungsweise unmittelbar bevorstehendes Handeln. Das natürliche deutsche Präsens gibt dies angemessen wieder.
- source_word: מַלְאָךְ
  choice: einen Engel
  rationale: Das Wort kann allgemein „Bote“ oder speziell „Engel“ bedeuten. Die Schutz- und Führungsaufgabe eines von Gott vorausgesandten Wesens spricht im Kontext für „Engel“; die echte lexikalische Alternative bleibt in der Fußnote erhalten.
- source_word: לְפָנֶיךָ
  choice: vor dir her
  rationale: Gibt idiomatisch wieder, dass der Engel Israel vorausgeht, ohne mehr über die Art seiner Führung auszusagen.
- source_word: לִשְׁמָרְךָ בַּדָּרֶךְ
  choice: der dich auf dem Weg bewahren soll
  rationale: שׁמר umfasst bewahren, behüten und schützen. „Bewahren“ ist im Reisekontext klar, würdevoll und semantisch breit genug.
- source_word: וְלַהֲבִיאֲךָ
  choice: und dich … bringen soll
  rationale: Der Hifil von בוא bedeutet „kommen lassen“ beziehungsweise „bringen“. Die deutsche Relativkonstruktion verbindet die beiden Zweckangaben natürlich.
- source_word: הַמָּקוֹם אֲשֶׁר הֲכִנֹתִי
  choice: den Ort, den ich vorbereitet habe
  rationale: „Ort“ entspricht מָקוֹם direkt; „vorbereitet“ gibt das Hifil von כון als göttliches Bereitmachen des Ziels wieder, ohne es enger als „gegründet“ oder „bestimmt“ auszulegen.
theological_decisions:
- issue: Identität des מַלְאָךְ
  choice: Im Haupttext „einen Engel“, ohne seine genaue Wesensart oder Identität festzulegen.
  alternative: „einen Boten“ oder eine ausdrückliche Identifikation als besondere göttliche Erscheinung beziehungsweise als „Engel des HERRN“.
  rationale: Der Vers nennt die Gestalt lediglich מַלְאָךְ. Der weitere Zusammenhang wirft Fragen nach ihrer besonderen Autorität und Identität auf, beantwortet sie hier jedoch nicht abschließend. Die Übersetzung wahrt diese theologische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem biblischem Register. „Siehe“ ist bewusst leicht gehoben; „vor dir her“ und die Relativkonstruktion sorgen zugleich für natürlichen deutschen Satzfluss.
