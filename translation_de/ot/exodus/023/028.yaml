  text: וְ/שָׁלַחְתִּ֥י אֶת הַ/צִּרְעָ֖ה לְ/פָנֶ֑י/ךָ וְ/גֵרְשָׁ֗ה אֶת הַ/חִוִּ֧י אֶת הַֽ/כְּנַעֲנִ֛י וְ/אֶת הַ/חִתִּ֖י מִ/לְּ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: de
  text: Und ich werde dir die Hornisse vorausschicken[a]; sie wird die Hiwiter, die Kanaaniter und die Hetiter vor dir vertreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise ist dies ein Bild für Panik oder ein anderes Mittel, durch das Gott Israels Gegner unter Druck setzt; das hebräische Wort bedeutet gewöhnlich „Hornisse“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Und ich werde … hersenden
  rationale: Das Qal-Perfekt der 1. Person Singular bezeichnet im Zusammenhang eine zukünftige göttliche Zusage. „Hersenden“ gibt zugleich die auf Israel vorausgerichtete Bewegung wieder.
- source_word: הַצִּרְעָה
  choice: die Hornisse
  rationale: Das hebräische Substantiv bezeichnet gewöhnlich eine Hornisse beziehungsweise ein stechendes Insekt. Der bestimmte Singular bleibt als repräsentativer oder kollektiver Singular erhalten; eine übertragene Deutung wird nicht in den Haupttext eingetragen.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet wörtlich „vor deinem Angesicht“ und bezeichnet hier, dass etwas Israel vorausgeht. „Vor dir“ ist knapp, natürlich und bewahrt das räumliche Bild.
- source_word: וְגֵרְשָׁה
  choice: sie wird … vertreiben
  rationale: גרשׁ bedeutet „vertreiben, hinausdrängen“. Das feminine Verb bezieht sich auf die feminine „Hornisse“; das Pronomen macht diesen Bezug im Deutschen deutlich.
- source_word: הַחִוִּי
  choice: die Hiwiter
  rationale: Gebräuchliche deutsche Bezeichnung der genannten Volksgruppe; der Plural entspricht natürlichem deutschem Bibelstil bei kollektiven Ethnonymen.
- source_word: הַכְּנַעֲנִי
  choice: die Kanaaniter
  rationale: Gebräuchliche deutsche Bezeichnung der genannten Volksgruppe.
- source_word: הַחִתִּי
  choice: die Hetiter
  rationale: Gebräuchliche moderne deutsche Bezeichnung der genannten Volksgruppe.
- source_word: מִלְּפָנֶיךָ
  choice: vor dir vertreiben
  rationale: Die Präposition bezeichnet die Entfernung aus Israels Gegenwart beziehungsweise aus seinem Weg. Im Deutschen verbindet sich „vor dir vertreiben“ idiomatisch mit dem Verb und bewahrt das wiederholte räumliche Motiv.
theological_decisions:
- issue: Ob הַצִּרְעָה wörtlich oder bildlich wiederzugeben ist
  choice: Im Haupttext wörtlich als „die Hornisse“
  alternative: Bildlich als „Schrecken“, Panik oder ein anderes von Gott eingesetztes Druckmittel
  rationale: Der gewöhnliche lexikalische Sinn ist „Hornisse“ beziehungsweise ein stechendes Insekt. Da der Kontext nicht eindeutig verlangt, das Bild aufzulösen, bleibt der konkrete Ausdruck im Haupttext stehen; die mögliche übertragene Bedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Fortgang, ohne unnatürlich zu wirken. Der konkrete und möglicherweise bildhafte Ausdruck „Hornisse“ bleibt bewusst erhalten.
