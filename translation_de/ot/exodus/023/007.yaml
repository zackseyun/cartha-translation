source:
  edition: WLC
  text: מִ/דְּבַר שֶׁ֖קֶר תִּרְחָ֑ק וְ/נָקִ֤י וְ/צַדִּיק֙ אַֽל תַּהֲרֹ֔ג כִּ֥י לֹא אַצְדִּ֖יק רָשָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: de
  text: Halte dich von einer falschen Sache[a] fern. Einen Unschuldigen und einen Gerechten sollst du nicht töten; denn ich werde einen Schuldigen nicht für gerecht erklären[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »von einer falschen Anschuldigung« oder »von einer Lüge«. Das hebräische Wort kann eine Aussage, eine Angelegenheit oder einen Rechtsfall bezeichnen und hier falsches Zeugnis oder ein betrügerisches Gerichtsverfahren einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »denn ich werde den Schuldigen nicht freisprechen«. Das hebräische Verb ist ein Rechtsbegriff und kann »für gerecht erklären«, »rechtfertigen« oder »freisprechen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: von einer falschen Aussage
  rationale: דָּבָר ist weit gefasst und kann »Wort«, »Angelegenheit« oder im Rechtszusammenhang eine Aussage beziehungsweise einen Fall bezeichnen. »Falsche Aussage« klingt im Deutschen natürlich und passt zum rechtlichen Kontext; die größere Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: תִּרְחָק
  choice: Halte dich fern
  rationale: Das Qal-Imperfekt der 2. Person Singular hat hier auffordernde Kraft. Die Wendung gibt sowohl das Gebot als auch die geforderte bewusste Distanz wieder.
- source_word: וְנָקִי
  choice: einen Unschuldigen
  rationale: נָקִי bezeichnet einen Menschen, der frei von Schuld ist. »Unschuldiger« ist im rechtlich-moralischen Zusammenhang klar und gegenwärtig.
- source_word: וְצַדִּיק
  choice: einen Gerechten
  rationale: צַדִּיק bezeichnet hier einen gerechten beziehungsweise im Recht befindlichen Menschen. »Gerechter« erhält die Verbindung zur Wurzel צדק und zur folgenden Wendung »für gerecht erklären«.
- source_word: אַל תַּהֲרֹג
  choice: sollst du nicht töten
  rationale: הרג ist das allgemeine Verb für »töten«. Die Wiedergabe vermeidet die zusätzliche Festlegung auf Mord und passt zugleich zum gerichtlichen Kontext.
- source_word: לֹא אַצְדִּיק
  choice: ich werde … nicht für gerecht erklären
  rationale: 'Der Hifil von צדק ist forensisch: jemanden für gerecht erklären, rechtfertigen oder freisprechen. »Für gerecht erklären« ist verständlich, wahrt den gerichtlichen Sinn und erhält die Wortverbindung zu צַדִּיק.'
- source_word: רָשָׁע
  choice: einen Schuldigen
  rationale: רָשָׁע kann einen Frevler oder, besonders im Rechtskontext, einen Schuldigen bezeichnen. »Schuldiger« stellt den gerichtlichen Gegensatz zum Unschuldigen deutlich heraus, ohne die moralische Dimension auszuschließen.
theological_decisions:
- issue: Forensischer Sinn der Aussage Gottes
  choice: denn ich werde einen Schuldigen nicht für gerecht erklären
  alternative: denn ich werde den Schuldigen nicht freisprechen
  rationale: Die Begründung stellt menschliches Rechtshandeln unter Gottes eigenes gerechtes Urteil. »Für gerecht erklären« bewahrt sowohl den forensischen Sinn als auch die sprachliche Verbindung zwischen צַדִּיק und אַצְדִּיק; »freisprechen« ist die natürliche gerichtliche Alternative und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt im Singular. Der Rechtskontext wird klar ausgedrückt, ohne die Bedeutungsbreite der hebräischen Begriffe in den Fußnoten zu verdecken.
