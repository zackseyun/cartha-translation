  source_fidelity: 'Die Grundbedeutung wird getroffen: Der Rechtssatz betrifft das Rind oder den Esel eines Feindes, der bzw. das umherirrt, und gebietet die Rückgabe an ihn. Die Verstärkung in הָשֵׁב תְּשִׁיבֶנּוּ wird mit „unbedingt zurückbringen“ angemessen wiedergegeben.'
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. In „dem umherirrenden Rind deines Feindes oder seinem Esel“ kann das Partizip jedoch grammatisch nur auf „Rind“ bezogen werden. Auch die Fußnotenalternative „die sich verirrt haben“ setzt unpassend einen Plural voraus. Eine Wiederholung des Partizips macht den Bezug auf beide möglichen Tiere eindeutig und bleibt natürlich.
  terminology: „Feind“, „Rind“, „Esel“ und „zurückbringen“ sind sachgerecht. „Rind“ ist für שׁוֹר als umfassendere deutsche Bezeichnung vertretbar; „Esel“ gibt חֲמוֹר idiomatisch wieder. Der Personenbezug von „ihm“ bleibt erhalten.
