    rationale: Das hebräische תֹּעֶה beschreibt das jeweils genannte Tier in der Alternativverbindung („sein Rind oder sein Esel“) als umherirrend. Die deutsche Konstruktion kann den Eindruck erwecken, nur das Rind sei umherirrend.
  - severity: medium
    issue: Die Fußnotenalternative verwendet den Plural „die sich verirrt haben“.
    rationale: Im Ausgangstext steht eine disjunktive Singularverbindung, nicht eine Mehrzahl beider Tiere. Die Fußnote sollte daher keine Pluralreferenz einführen.
  revised_text: Wenn du auf das umherirrende Rind deines Feindes oder seinen umherirrenden Esel triffst,[a] sollst du es ihm unbedingt zurückbringen.
