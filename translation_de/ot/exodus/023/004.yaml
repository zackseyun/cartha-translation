  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: de
  text: Wenn du auf das umherirrende Rind deines Feindes oder seinen umherirrenden Esel triffst,[a] sollst du es ihm unbedingt zurückbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du dem Rind deines Feindes oder seinem Esel begegnest, das oder der sich verirrt hat.“'
    reason: 'Lexikalisch-syntaktische Alternative: פגע kann mit „jemandem oder etwas begegnen“ wiedergegeben werden; תעה kann das Verirrtsein statt des fortdauernden Umherirrens bezeichnen.'
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den Bedingungsfall eines Rechtssatzes ein; „wenn“ gibt diese Funktion im Deutschen natürlich wieder.
- source_word: תִפְגַּע
  choice: du … begegnest
  rationale: פגע bezeichnet hier das Zusammentreffen beziehungsweise Antreffen; „begegnen“ ist gegenwärtiges, gut verständliches Deutsch.
- source_word: שׁוֹר
  choice: Rind
  rationale: שׁוֹר bezeichnet ein Tier der Rindergattung und nicht zwingend einen kastrierten Ochsen; „Rind“ wahrt den möglichen Bedeutungsumfang.
- source_word: אֹיִבְךָ
  choice: deines Feindes
  rationale: Die ausdrückliche Bezeichnung als „Feind“ wird bewahrt und nicht zu einer neutraleren Beziehung abgeschwächt.
- source_word: חֲמֹרוֹ
  choice: seinem Esel
  rationale: חֲמוֹר ist die gewöhnliche Bezeichnung für einen Esel; das Pronomen verweist auf den Feind.
- source_word: תֹּעֶה
  choice: umherirrenden
  rationale: Das Partizip von תעה beschreibt ein Tier, das vom Weg beziehungsweise von seinem Ort abgekommen ist; „umherirrend“ lässt offen, ob es bereits als verloren gilt.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: sollst du es … unbedingt zurückbringen
  rationale: Infinitivus absolutus und finites Verb desselben Stammes verstärken die Verpflichtung. „Unbedingt“ vermittelt diese Nachdrücklichkeit in natürlichem Deutsch.
- source_word: לוֹ
  choice: ihm
  rationale: Das Pronomen bezieht sich unmittelbar auf den zuvor genannten Feind; die formale Bezugnahme wird erhalten.
theological_decisions:
- issue: Ethische Verpflichtung gegenüber einem Feind
  choice: Die Rückgabe des verirrten Tieres wird ausdrücklich auch gegenüber dem eigenen Feind geboten.
  alternative: „Feind“ durch eine neutralere Beziehungsbezeichnung wie „Mitmensch“ oder „Nächster“ ersetzen.
  rationale: אֹיִבְךָ bedeutet ausdrücklich „dein Feind“. Diese Formulierung bewahrt die ethische Spannung des Textes, der gerechtes und hilfreiches Handeln auch gegenüber einem Gegner verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält Rind und Esel als gemeinsames Objekt der Begegnung zusammen; der Fußnotenmarker steht unmittelbar nach dem entsprechenden Satzteil. Die emphatische hebräische Verbverbindung wird ohne altertümliche Verdoppelung idiomatisch mit „unbedingt“ wiedergegeben.
