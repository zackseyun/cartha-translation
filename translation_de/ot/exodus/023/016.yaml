source:
  edition: WLC
  text: וְ/חַ֤ג הַ/קָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔י/ךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּ/שָּׂדֶ֑ה וְ/חַ֤ג הָֽ/אָסִף֙ בְּ/צֵ֣את הַ/שָּׁנָ֔ה בְּ/אָסְפְּ/ךָ֥ אֶֽת מַעֲשֶׂ֖י/ךָ מִן הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: de
  text: und das Erntefest[a], mit den Erstlingen deiner Arbeit, von dem, was du auf dem Feld aussäst, und das Fest der Einbringung[c] am Ende des Jahres[b], wenn du den Ertrag deiner Arbeit vom Feld einbringst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fest“; das hebräische Wort bezeichnet in beiden Fällen eine festgesetzte religiöse Feier.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „beim Hinausgehen des Jahres“.'
    reason: lexical_alternative
  - marker: c
    text: Die „Einbringung“ bezeichnet das Einsammeln und Bergen der Erzeugnisse vom Feld.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: Fest
  rationale: „Fest“ bezeichnet im Deutschen natürlich eine festgesetzte religiöse Feier; die Zusammensetzungen „Erntefest“ und „Fest der Einbringung“ machen die beiden Festbezeichnungen klar.
- source_word: הַקָּצִיר
  choice: Ernte
  rationale: Das Substantiv kann das Ernten oder die Ernte bezeichnen. In „Erntefest“ ist die landwirtschaftliche Bedeutung knapp und idiomatisch wiedergegeben.
- source_word: בִּכּוּרֵי
  choice: Erstlinge
  rationale: „Erstlinge“ bewahrt den kultischen Sinn der ersten Erzeugnisse, die Gott dargebracht werden, und ist in diesem Zusammenhang verständlich.
- source_word: מַעֲשֶׂיךָ
  choice: deine Arbeit / Ertrag deiner Arbeit
  rationale: Wörtlich geht es um das vom Menschen Geschaffene oder Geleistete. Bei der ersten Nennung bleibt „Arbeit“ nahe an der Formulierung; bei der zweiten macht „Ertrag deiner Arbeit“ natürlich verständlich, was vom Feld eingebracht wird, ohne es auf eine bestimmte Feldfrucht einzuengen.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: von dem, was du auf dem Feld aussäst
  rationale: Die Formulierung erhält das konkrete Verb „säen“ und die direkte Anrede. „Aussäen“ ist in modernem Deutsch in diesem landwirtschaftlichen Zusammenhang besonders natürlich.
- source_word: הָאָסִף
  choice: Einbringung
  rationale: Das Wort bezeichnet das Einsammeln beziehungsweise Einbringen der Feldfrüchte. „Fest der Einbringung“ wahrt den Charakter einer Festbezeichnung, ohne eine zusätzliche Deutung wie „Ernteabschluss“ in den Haupttext einzutragen.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: beim Ausgang des Jahres
  rationale: Diese leicht gehobene, aber verständliche Wendung bildet das hebräische Bild vom Hinausgehen des Jahres ab. Eine Fußnote erläutert die zeitliche Bedeutung.
- source_word: בְּאָסְפְּךָ
  choice: wenn du … einbringst
  rationale: Der Infinitiv mit Präposition wird als temporaler Nebensatz wiedergegeben. „Einbringen“ ist für das Bergen der Feldfrüchte idiomatisch und greift zugleich die Festbezeichnung auf.
- source_word: מִן הַשָּׂדֶה
  choice: vom Feld
  rationale: Die knappe deutsche Wendung gibt den räumlichen Ursprung unmittelbar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. „Beim Ausgang des Jahres“ bewahrt bewusst das hebräische Bild; die Fußnote erklärt die idiomatische Bedeutung. Die beiden Wiedergaben von מַעֲשֶׂיךָ sind kontextgerecht variiert, weil man im Deutschen zwar von den Erstlingen der Arbeit sprechen, die Arbeit selbst aber nicht natürlich vom Feld einbringen kann.
