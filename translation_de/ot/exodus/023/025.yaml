  text: וַ/עֲבַדְתֶּ֗ם אֵ֚ת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/בֵרַ֥ךְ אֶֽת לַחְמְ/ךָ֖ וְ/אֶת מֵימֶ֑י/ךָ וַ/הֲסִרֹתִ֥י מַחֲלָ֖ה מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: de
  text: Ihr sollt Jahwe, eurem Gott, dienen, und er wird dein Brot[a] und dein Wasser segnen; und ich werde Krankheit[b] aus deiner Mitte entfernen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt die Anrede hier vom Plural („ihr“, „euer“) zum Singular („dein“). Israel wird dabei als Gemeinschaft angesprochen. „Brot“ kann außerdem für Nahrung oder Versorgung insgesamt stehen.
    reason: grammatical_and_lexical_clarification
  - marker: b
    text: 'Oder: „Erkrankung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Ihr sollt … dienen
  rationale: עבד bezeichnet hier den umfassenden Dienst für Gott, der Anbetung einschließt. „Dienen“ bewahrt diese Breite; „sollt“ gibt die auffordernde Kraft im Zusammenhang wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Bundesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eurem Gott
  rationale: Im Bezug auf Jahwe ist אֱלֹהִים eindeutig singularisch; die Form bezeichnet die Bundesbeziehung zu Israel.
- source_word: וּבֵרַךְ
  choice: Dann wird er … segnen
  rationale: Die Form drückt hier die verheißene Folge des vorangehenden Auftrags aus. Das im Hebräischen vorausgesetzte Subjekt Jahwe wird im Deutschen mit „er“ ausgedrückt.
- source_word: לַחְמְךָ
  choice: dein Brot
  rationale: לֶחֶם bedeutet wörtlich „Brot“, kann aber auch Nahrung oder Lebensunterhalt insgesamt bezeichnen. Die konkrete Grundbedeutung bleibt im Haupttext erhalten.
- source_word: מֵימֶיךָ
  choice: dein Wasser
  rationale: מַיִם ist formal pluralisch beziehungsweise kollektiv, wird im Deutschen hier aber idiomatisch als „Wasser“ wiedergegeben.
- source_word: וַהֲסִרֹתִי
  choice: und ich werde … entfernen
  rationale: Die Hifil-Form bedeutet „wegnehmen, entfernen“. Der Wechsel von „er“ zu Gottes direkter Rede „ich“ wird beibehalten.
- source_word: מַחֲלָה
  choice: Krankheit
  rationale: Der Ausdruck umfasst Krankheit beziehungsweise Erkrankung allgemein, ohne zwingend eine bestimmte Seuche zu bezeichnen.
- source_word: מִקִּרְבֶּךָ
  choice: aus deiner Mitte
  rationale: Die räumlich-gemeinschaftliche Wendung bleibt erhalten und wird nicht auf das Innere eines einzelnen Körpers verengt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. „Jahwe“ gibt ihn im modernen Standarddeutsch als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel zwischen pluralischer und singularischer Anrede
  choice: „Ihr sollt … eurem Gott“ und danach „dein Brot … dein Wasser … deiner Mitte“
  alternative: 'Durchgehend pluralische Anrede: „euer Brot … euer Wasser … eurer Mitte“'
  rationale: Der hebräische Text wechselt bewusst oder idiomatisch von der zweiten Person Plural zur zweiten Person Singular. Die Übersetzung bewahrt diesen Wechsel und lässt die singularische Anrede Israels als Kollektiv sichtbar.
- issue: Wechsel der göttlichen Rede von der dritten zur ersten Person
  choice: „er wird … segnen, und ich werde … entfernen“
  alternative: Beide Aussagen in derselben Person formulieren
  rationale: Der auffällige Personenwechsel steht im überlieferten hebräischen Text und wird nicht stillschweigend geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der hebräische Wechsel von pluralischer zu singularischer Anrede sowie von „er“ zu „ich“ bleibt sichtbar. „Dienen“ ist bewusst weiter als das engere „anbeten“.
