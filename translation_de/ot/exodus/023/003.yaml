  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: de
  text: Einen Armen darfst du in seinem Rechtsstreit nicht bevorzugen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Einen Armen darfst du in seiner Rechtssache nicht ehren.“ Das hebräische Verb kann wörtlicher „ehren“ bedeuten; im gerichtlichen Zusammenhang geht es um Begünstigung oder Parteilichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Auch
  rationale: Die Konjunktion verbindet das Verbot mit den vorausgehenden Rechtssätzen. Im Deutschen stellt „auch“ hier natürlich heraus, dass selbst zugunsten eines Armen keine Parteilichkeit erlaubt ist, ohne einen im Hebräischen nicht vorhandenen Gegensatz einzuführen.
- source_word: דָל
  choice: einen Armen
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet einen sozial oder wirtschaftlich armen, geringgestellten beziehungsweise schwachen Menschen. Der Singular wird mit „einen Armen“ knapp und geschlechtsübergreifend-generisch wiedergegeben.
- source_word: לֹא תֶהְדַּר
  choice: darfst du … nicht bevorzugen
  rationale: Das Verb הדר kann wörtlicher „ehren“ bedeuten; im gerichtlichen Zusammenhang bezeichnet es jedoch eine ungebührliche Begünstigung. Die Formulierung gibt das Verbot in natürlichem modernem Deutsch wieder.
- source_word: בְּרִיבוֹ
  choice: in seinem Rechtsstreit
  rationale: רִיב bezeichnet Streit, Rechtssache oder Rechtsstreit. Der unmittelbare Kontext handelt von Rechtsprechung; „Rechtsstreit“ wahrt sowohl den forensischen Sinn als auch das männliche Singularsuffix „seinem“.
theological_decisions:
- issue: Gerichtliche Fürsorge für Arme ohne Parteilichkeit
  choice: Der Vers verbietet, einen Armen in seiner Rechtssache zu bevorzugen.
  alternative: Der Vers gebietet allgemein, einen Armen zu ehren.
  rationale: Der Zusatz „in seinem Rechtsstreit“ verankert die Aussage in der Rechtsprechung. Das Verbot richtet sich gegen Parteilichkeit zugunsten des Armen und bestreitet nicht die an anderer Stelle gebotene Fürsorge für Bedürftige.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Darfst du nicht“ ist als klares Rechtsverbot natürlicher als das altertümliche „sollst du nicht“. Die Formulierung bleibt knapp und bewahrt die Spannung, dass Gerechtigkeit weder gegen noch zugunsten sozial Schwacher parteiisch sein darf.
