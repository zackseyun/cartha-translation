  text: שָׁלֹ֣שׁ רְגָלִ֔ים תָּחֹ֥ג לִ֖/י בַּ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/014.yaml
  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: de
  text: Dreimal im Jahr sollst du mir ein Fest feiern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »drei Füße«. Diese hebräische Wendung bezeichnet die drei Festanlässe im Jahr, zu denen man sich auf den Weg machte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: Dreimal
  rationale: Die wörtliche Verbindung lautet »drei Füße«, ist hier aber eine hebräische Wendung für drei wiederkehrende Fest- beziehungsweise Wallfahrtsanlässe. »Dreimal« gibt die Häufigkeit im Deutschen natürlich wieder; die wörtliche Bildsprache wird in der Fußnote erläutert.
- source_word: תָּחֹג
  choice: sollst du … ein Fest feiern
  rationale: Das Verb חגג bezeichnet das Feiern oder Begehen eines Festes. Die Wiedergabe bewahrt den kultisch-festlichen Sinn und entspricht dem verpflichtenden Stil des Rechtstextes.
- source_word: לִי
  choice: mir
  rationale: Die Präposition kennzeichnet das Fest als auf Gott ausgerichtet. »Mir« bewahrt die persönliche Anrede knapp und unmittelbar.
- source_word: בַּשָּׁנָה
  choice: im Jahr
  rationale: Dies entspricht wörtlich und idiomatisch »in dem Jahr«; zusammen mit »dreimal« bezeichnet es die jährlich vorgeschriebene Häufigkeit, ohne ausdrücklich zu »jedes Jahr« zu erweitern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Rechtssprache. »Ein Fest feiern« ist allgemein verständlich und bewahrt den kultischen Gehalt; die im Deutschen unverständliche wörtliche Wendung wird in einer Fußnote dokumentiert.
