base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/018.yaml
  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: de
  text: Du sollst das Blut meines Schlachtopfers nicht zusammen mit Gesäuertem opfern[a], und das Fett meines Festes[b] soll nicht bis zum Morgen liegen bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Sauerteig“ beziehungsweise wörtlich: „auf/über Gesäuertem“. Die hebräische Präposition bedeutet gewöhnlich „auf/über“; hier bezeichnet sie wahrscheinlich, dass das Opfer nicht in Verbindung mit Gesäuertem dargebracht werden darf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meines Wallfahrtsfestes“. Das hebräische Wort bezeichnet ein heiliges Fest, insbesondere ein Wallfahrtsfest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: du sollst … nicht … opfern
  rationale: Das Qal-Imperfekt der 2. Person Singular mit לֹא formuliert hier ein Verbot. „Opfern“ bewahrt den kultischen Sinn knapp und natürlich.
- source_word: עַל חָמֵץ
  choice: zusammen mit Gesäuertem
  rationale: עַל bedeutet wörtlich „auf/über“, bezeichnet hier im Opferzusammenhang aber wahrscheinlich die verbotene Verbindung mit Gesäuertem. Die Fußnote erhält die formale Alternative.
- source_word: דַּם זִבְחִי
  choice: das Blut meines Schlachtopfers
  rationale: Die Status-constructus-Verbindung mit dem Suffix der 1. Person Singular wird ausdrücklich wiedergegeben. „Schlachtopfer“ unterscheidet das kultische Opfer von einem bloßen allgemeinen Opfer.
- source_word: יָלִין
  choice: soll nicht … liegen bleiben
  rationale: לין bezeichnet das Verbleiben über Nacht. Zusammen mit „bis zum Morgen“ gibt „liegen bleiben“ den Sinn idiomatisch und ohne redundantes „über Nacht“ wieder.
- source_word: חֵלֶב
  choice: das Fett
  rationale: Die konkrete Bezeichnung „Fett“ bleibt erhalten; eine Ausweitung zu „Fettstücken“ wäre zwar sachlich möglich, aber stärker deutend.
- source_word: חַגִּי
  choice: meines Festes
  rationale: חַג bezeichnet ein heiliges Fest, besonders ein Wallfahrtsfest. „Fest“ ist im Deutschen natürlich und lässt den kultischen Zusammenhang bestehen.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die geläufige deutsche Zeitangabe entspricht der hebräischen Wendung unmittelbar.
theological_decisions:
- issue: Bezug der Suffixe der 1. Person in זִבְחִי und חַגִּי
  choice: „meines Schlachtopfers“ und „meines Festes“
  alternative: „des mir dargebrachten Schlachtopfers“ und „des Festes für den HERRN“
  rationale: Die göttliche Rede in der 1. Person wird ohne erklärende Erweiterung bewahrt. So bleibt die im Hebräischen ausgedrückte Zugehörigkeit der Opferhandlung und des Festes zu Gott erhalten.
translation_notes:
  register: Moderne, würdige Rechtssprache mit direkter Anrede im Singular. Die Formulierung bleibt nahe an den konkreten Opferbegriffen des Hebräischen, während „zusammen mit“ die im Deutschen sonst schwer verständliche Präposition kontextgerecht wiedergibt.
