  text: וְ/אָכַ֨ל אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת בְּשַׂ֣ר הָ/אַ֔יִל וְ/אֶת הַ/לֶּ֖חֶם אֲשֶׁ֣ר בַּ/סָּ֑ל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: de
  text: Aaron und seine Söhne sollen das Fleisch des Widders und das Brot, das im Korb ist, am Eingang des Zeltes der Begegnung essen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Fleisch des Widders“. Das hebräische Wort bedeutet wörtlich „Fleisch“; im Opferkontext kann es essbares Fleisch bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: sollen … essen
  rationale: Das Qal-Perfekt mit וְ hat in dieser kultischen Anweisung vorschreibende bzw. zukunftsbezogene Kraft. „Sollen … essen“ gibt diese wieder, ohne eine bereits vollzogene Handlung auszudrücken.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seine Söhne
  rationale: בָּנִים bezeichnet hier Aarons männliche Nachkommen, die an der Priesterweihe beteiligt sind; „Söhne“ entspricht dem konkreten Bezug.
- source_word: בְּשַׂר הָאַיִל
  choice: das Fleisch des Widders
  rationale: בָּשָׂר bedeutet „Fleisch“ und bezeichnet hier das essbare Fleisch des geopferten Widders. Die deutsche Wiedergabe ist zugleich wörtlich und idiomatisch.
- source_word: הַלֶּחֶם אֲשֶׁר בַּסָּל
  choice: das Brot, das im Korb ist
  rationale: Die Relativkonstruktion wird ausdrücklich wiedergegeben und bezeichnet das im Ritualkorb befindliche Brot.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet den Eingang; אֹהֶל מוֹעֵד ist das kultische Zelt, an dem Gott Israel begegnet. Die traditionelle Alternative „Zelt der Zusammenkunft“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Vorschreibende Kraft der Verbform
  choice: sollen … essen
  alternative: aßen; werden … essen
  rationale: Der Kontext der Priesterweihe verlangt eine ritualrechtliche Anweisung. „Sollen“ bewahrt den vorschreibenden Charakter, ohne die Form zu einem ausdrücklichen Imperativ zu machen.
- issue: Geschlechtsspezifische Bezeichnung der priesterlichen Beteiligten
  choice: seine Söhne
  alternative: seine Kinder
  rationale: Gemeint sind die männlichen Nachkommen Aarons, die in diesem Zusammenhang zu Priestern eingesetzt werden; eine allgemeinere Bezeichnung würde den Referenzumfang erweitern.
- issue: Bedeutung von אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  alternative: Zelt der Zusammenkunft
  rationale: Der hebräische Ausdruck kann die festgesetzte Begegnung beziehungsweise das Zusammenkommen am Heiligtum hervorheben. „Begegnung“ ist im Deutschen natürlich und lässt den Gottesbezug im Kontext erkennen; die verbreitete Alternative wird nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem Hebräischen weitgehend, bleibt aber natürlich; der abschließende Ortsausdruck bezieht sich auf das vorgeschriebene Essen. Die explizite Relativkonstruktion „das im Korb ist“ bewahrt die Struktur des Ausgangstextes.
