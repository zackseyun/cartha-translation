base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: de
  text: Aaron und seine Söhne sollst du zum Eingang des Zeltes der Begegnung bringen[a] und sie mit Wasser waschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Aaron und seine Söhne heranbringen« beziehungsweise »vorführen«. Das hebräische Verb kann im kultischen Zusammenhang das formelle Heranbringen oder Vorführen zu einer rituellen Handlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: sollst du … bringen
  rationale: Der Hifil von קרב bedeutet »heranbringen« oder im kultischen Zusammenhang »vorführen/darbringen«. Mit dem Ziel »zum Eingang« gibt »bringen« die Bewegung natürlich wieder; eine Fußnote bewahrt den möglichen formell-kultischen Sinn.
- source_word: אֶל
  choice: zum
  rationale: Die Präposition bezeichnet die Bewegung auf ein Ziel hin. Zusammen mit »Eingang« ist »zum« im Deutschen idiomatisch.
- source_word: פֶּתַח
  choice: Eingang
  rationale: פֶּתַח bezeichnet eine Öffnung oder einen Eingang und setzt keine feste Tür voraus.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Diese geläufige Wiedergabe der Heiligtumsbezeichnung wahrt den Gedanken des von Gott bestimmten Begegnungsortes.
- source_word: וְרָחַצְתָּ
  choice: und … waschen
  rationale: רחץ bedeutet »waschen/baden«. In der fortlaufenden Anweisung wird der zweite verbundene Auftrag im Deutschen natürlich mit »und« wiedergegeben; das Modalverb »sollst« gilt für beide Verben.
- source_word: בַּמָּיִם
  choice: mit Wasser
  rationale: Das ב kennzeichnet hier am natürlichsten das verwendete Mittel. »Mit Wasser waschen« ist idiomatisches Deutsch.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier die männlichen Nachkommen Aarons, die mit ihm zum Priesterdienst eingesetzt werden.
theological_decisions:
- issue: Kultische Bedeutung von קרב bei der Einsetzung der Priester
  choice: Aaron und seine Söhne … bringen
  alternative: Aaron und seine Söhne … herantreten lassen / vorführen
  rationale: »Bringen« wahrt zusammen mit der Zielangabe die konkrete Annäherung an das Heiligtum, ohne den Ritus näher auszudeuten. Die Fußnote nennt die mögliche formell-kultische Nuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem deutschen Anweisungsstil; »Zelt der Begegnung« verwendet die geläufige kultische Bezeichnung.
