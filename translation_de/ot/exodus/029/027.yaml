  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: de
  text: Und heilige die Brust des Schwingopfers und die Keule des Hebopfers[a], die geschwungen und emporgehoben wurden, vom Einsetzungswidder[b] – von dem, was Aaron zukommt, und von dem, was seinen Söhnen zukommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keule der Abgabe“ beziehungsweise „Keule des emporgehobenen Opfers“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Widder der Füllungen“. Gemeint ist der Widder, der bei der Einsetzung der Priester verwendet wurde.'
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: heilige
  rationale: Das Piel von קדשׁ bezeichnet hier das Absondern als heilig. „Heilige“ bewahrt den kultischen Gehalt und ist im Deutschen natürlich und würdig.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: Brust des Schwingopfers
  rationale: חֲזֵה bezeichnet das Bruststück des Tieres; „Schwingopfer“ gibt תְּנוּפָה wieder und hält die Verbindung zum Verb נוף sichtbar.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: Keule des Hebopfers
  rationale: שׁוֹק meint im Opferkontext die Keule beziehungsweise den oberen Schenkel. „Hebopfer“ ist ein etablierter kultischer Ausdruck und entspricht dem folgenden Verb „emporheben“.
- source_word: הוּנַף
  choice: geschwungen wurde
  rationale: Das Hophal von נוף beschreibt die rituelle Schwingbewegung und korrespondiert ausdrücklich mit „Schwingopfer“.
- source_word: הוּרָם
  choice: emporgehoben wurde
  rationale: Das Hophal von רום bezeichnet das Hochheben und bewahrt die sprachliche Beziehung zum Hebopfer.
- source_word: אֵיל הַמִּלֻּאִים
  choice: Einsetzungswidder
  rationale: Der Ausdruck bezeichnet den Widder des Rituals, durch das Aaron und seine Söhne in das Priesteramt eingesetzt werden. Die kompakte Wiedergabe ist im Kontext verständlich; die wörtliche Wendung wird in einer Fußnote erklärt.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: sowohl den Anteil für Aaron als auch den Anteil für seine Söhne
  rationale: Die elliptische Besitz- beziehungsweise Zuweisungskonstruktion wird idiomatisch verdeutlicht, ohne festzulegen, dass bereits endgültiges Eigentum gemeint ist.
theological_decisions:
- issue: Wiedergabe der kultischen Fachbegriffe
  choice: Konkrete Ritualsprache mit „Schwingopfer“, „Hebopfer“, „geschwungen“ und „emporgehoben“
  alternative: Allgemeinere Ausdrücke wie „Darbringung“ oder „heiliger Anteil“
  rationale: Die hebräischen Nomina und Verben sind bewusst miteinander verknüpft. Diese Wiedergabe erhält die rituellen Handlungen und vermeidet eine theologische Verallgemeinerung.
- issue: Bedeutung der Aaron und seinen Söhnen zugeordneten Teile
  choice: „Anteil für Aaron“ und „Anteil für seine Söhne“
  alternative: „was Aaron gehörte“ und „was seinen Söhnen gehörte“
  rationale: לְ kann Zuweisung oder Zugehörigkeit ausdrücken. „Anteil für“ bewahrt diese Offenheit und passt zur Verteilung der Opferstücke.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachwörter bleiben konkret; „Keule“ ist im deutschen Opferkontext natürlicher als das anatomisch allgemeinere „Schenkel“. Der Gedankenstrich macht die abschließende Zuordnung der Anteile lesbar.
