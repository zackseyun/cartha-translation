  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: de
  text: Dort werde ich den Söhnen Israels begegnen[a], und es wird durch meine Herrlichkeit geheiligt werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Israeliten“. Wörtlich steht im Hebräischen „den Söhnen Israels“, eine übliche Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: Das Subjekt von „es wird geheiligt werden“ wird im Hebräischen nicht ausdrücklich genannt. Gemeint sein kann allgemein der hier vorausgesetzte Heiligtumsbereich, insbesondere das Zelt der Begegnung oder der Altar.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: werde ich … begegnen
  rationale: Das Nifal von יעד bezeichnet hier im Heiligtumskontext die verabredete Begegnung. „Begegnen“ gibt dies natürlich wieder, ohne eine bloße Gegenwart oder Offenbarung hineinzulesen.
- source_word: שָׁמָּה
  choice: dort
  rationale: Das Ortsadverb verweist auf den zuvor genannten Bereich des Heiligtums.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Bei יעד bezeichnet ל die an der Begegnung Beteiligten. Die formnahe Wiedergabe bewahrt den üblichen bundesbezogenen Ausdruck; idiomatisch ist „den Israeliten“ möglich.
- source_word: וְנִקְדַּשׁ
  choice: es wird … geheiligt werden
  rationale: Das Nifal von קדש ist passiv und bedeutet, dass etwas heilig gemacht beziehungsweise geheiligt wird. Das unbestimmte „es“ bewahrt den im Hebräischen nicht ausdrücklich genannten Bezug.
- source_word: בִּכְבֹדִי
  choice: durch meine Herrlichkeit
  rationale: Die Präposition ב ist hier am besten instrumental zu verstehen; Gottes Herrlichkeit ist das Mittel beziehungsweise die wirkende Macht der Heiligung.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von וְנִקְדַּשׁ
  choice: „es wird … geheiligt werden“ mit unbestimmtem Bezug
  alternative: ausdrücklicher Bezug auf das Zelt der Begegnung, den Altar, den Heiligtumsbereich oder auf Aaron
  rationale: Das hebräische Verb steht in der 3. Person Maskulinum Singular, nennt aber kein Subjekt. Der Zusammenhang legt einen heiligen Ort oder Gegenstand nahe, bestimmt ihn jedoch nicht eindeutig. Die Übersetzung sollte diese Offenheit nicht auflösen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die formnahe Wiedergabe erhält den traditionellen bundesbezogenen Volksnamen. Eine Fußnote erklärt die im Deutschen geläufigere idiomatische Entsprechung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geheiligt werden“ bewahrt den passiven und sakralen Gehalt; die Satzstellung bleibt gut verständlich. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Formulierungen.
