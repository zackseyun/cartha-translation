base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: de
  text: Die heiligen Gewänder Aarons sollen nach ihm seinen Söhnen gehören. Darin sollen sie gesalbt und in ihr Amt eingesetzt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihnen die Hand füllen“; eine hebräische priesterliche Wendung für die Einsetzung in den Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die Wendung bezeichnet Gewänder, die für den heiligen priesterlichen Dienst ausgesondert sind. „Heilige Gewänder“ ist im Deutschen natürlich und bewahrt den kultischen Sinn.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: Aarons
  rationale: Die Präposition לְ drückt hier Zugehörigkeit aus. Der deutsche Genitiv gibt dies knapp und idiomatisch wieder.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: sollen nach ihm seinen Söhnen gehören
  rationale: Die Formulierung bezeichnet die Weitergabe der Gewänder an Aarons Söhne in der priesterlichen Nachfolge. „Nach ihm“ bewahrt den zeitlichen und nachfolgebezogenen Sinn von אַחֲרָיו.
- source_word: לְמָשְׁחָה בָהֶם
  choice: Darin sollen sie gesalbt werden
  rationale: בָהֶם bezeichnet die Gewänder als das, worin die Söhne bei der Salbung gekleidet sind, nicht als Mittel der Salbung. Die deutsche Passivkonstruktion macht den gemeinten Vorgang natürlich verständlich.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: und in ihr Amt eingesetzt werden
  rationale: מִלֵּא אֶת־הַיָּד, wörtlich „die Hand füllen“, ist eine feste priesterliche Wendung für die Einsetzung in den Dienst. Die funktionale Wiedergabe ist im Haupttext verständlich; das hebräische Bild wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe der priesterlichen Einsetzungsformel מִלֵּא אֶת־הַיָּד
  choice: in ihr Amt eingesetzt werden
  alternative: ihnen die Hand füllen; sie zum Priesterdienst weihen
  rationale: Die wörtliche Wiedergabe „die Hand füllen“ wäre im heutigen Deutschen ohne Erklärung unverständlich. „In ihr Amt einsetzen“ vermittelt die kultische Funktion, ohne die Wendung mit späteren kirchlichen Ordinationsvorstellungen gleichzusetzen; die ursprüngliche Bildsprache bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satz folgt der hebräischen Zugehörigkeits- und Nachfolgestruktur; der zweite löst die nominalen Zweckangaben in eine natürliche deutsche Passivkonstruktion auf. „Darin“ bezieht sich eindeutig auf die Gewänder.
