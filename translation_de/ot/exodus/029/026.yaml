base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: de
  text: Dann nimm die Brust vom Einsetzungswidder, der Aaron gehört, und bring sie vor Jahwe als Schwingopfer dar; sie soll dein Anteil sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶחָזֶה
  choice: das Bruststück
  rationale: Im Opferkontext bezeichnet חָזֶה den als Opferanteil bestimmten Brustbereich des Tieres. „Bruststück“ ist im Deutschen präziser als das allgemeinere „Brust“.
- source_word: אֵיל הַמִּלֻּאִים
  choice: Einsetzungswidder
  rationale: אַיִל bezeichnet einen Widder. הַמִּלֻּאִים ist hier ein Fachausdruck für die Einsetzung in das Priesteramt; „Einsetzungswidder“ gibt den rituellen und amtlichen Zusammenhang knapp wieder.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: der für Aaron bestimmt ist
  rationale: Die לְ-Konstruktion ordnet den Widder Aaron zu, ohne zwingend Eigentum auszudrücken. „Für Aaron bestimmt“ bewahrt diese relationale Bedeutung.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: und es ... als Schwingopfer hin und her bewegen
  rationale: Das Verb נוף und das verwandte Substantiv תְּנוּפָה bilden einen kultischen Ausdruck. Die Wiedergabe nennt sowohl die rituelle Opferart als auch die damit verbundene Bewegung und bleibt in modernem Deutsch verständlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet im kultischen Zusammenhang „vor“ beziehungsweise „in der Gegenwart von“. Der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: es soll dein Anteil sein
  rationale: מָנָה bezeichnet einen zugeteilten Anteil. „Dein Anteil“ ist knapp, idiomatisch und passt zur priesterlichen Zuweisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Fachausdrucks הַמִּלֻּאִים
  choice: Einsetzung
  alternative: Weihe
  rationale: Der Ritus setzt Aaron in das Priesteramt ein. „Einsetzung“ hebt diesen Amtsbezug hervor, während „Weihe“ als mögliche, weiter gefasste Wiedergabe in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Fachbegriffe „Einsetzungswidder“ und „Schwingopfer“ werden beibehalten, aber durch eine natürliche Satzform und die konkretisierende Wendung „hin und her bewegen“ verständlich gemacht.
