  text: וְ/אֶת הָ/אַ֥יִל הָ/אֶחָ֖ד תִּקָּ֑ח וְ/סָ֨מְכ֜וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/015.yaml
  text: Then you shall take the one ram[a], and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: de
  text: Dann sollst du den einen Widder[a] nehmen, und Aaron und seine Söhne sollen ihre Hände auf den Kopf des Widders legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „den einen Widder“; damit wird dieser Widder von dem anderen Widder im Einsetzungsritual unterschieden. Manche Übersetzungen geben den Ausdruck mit „den ersten Widder“ wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Dann
  rationale: Die Verbindung aus Konjunktion und Objektmarker leitet den nächsten Schritt der Anweisung ein. „Dann“ gibt diese Abfolge im Deutschen natürlich wieder.
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: den einen Widder
  rationale: אַיִל bezeichnet einen Widder; הָאֶחָד heißt hier wörtlich „der eine“ und unterscheidet dieses Tier von dem anderen Widder im Einsetzungsritual, ohne ausdrücklich eine Ordnungszahl zu setzen.
- source_word: תִּקָּח
  choice: sollst du … nehmen
  rationale: Das Imperfekt der 2. Person maskulin Singular hat im Anweisungskontext verpflichtenden Charakter und richtet sich an Mose.
- source_word: וְ/סָמְכוּ
  choice: sollen … legen
  rationale: סמך bezeichnet im Opferkontext das rituelle Auflegen beziehungsweise Aufstützen der Hände. „Die Hände auf … legen“ ist im Deutschen klar und idiomatisch.
- source_word: אַהֲרֹן וּ/בָנָיו
  choice: Aaron und seine Söhne
  rationale: בָּנִים meint hier Aarons männliche Nachkommen, die zum Priesterdienst eingesetzt werden.
- source_word: אֶת יְדֵיהֶם
  choice: ihre Hände
  rationale: Der hebräische Plural wird bewahrt und bezeichnet die Hände der gemeinsam handelnden Personen.
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: auf den Kopf des Widders
  rationale: Die Ortsangabe wird direkt und in natürlichem modernem Deutsch wiedergegeben; die Wiederholung von „Widder“ sorgt für Klarheit.
theological_decisions:
- issue: Bezeichnung der rituellen Handauflegung beim Opfer
  choice: ihre Hände auf den Kopf des Widders legen
  alternative: ihre Hände auf den Kopf des Widders stützen
  rationale: Das Verb kann ein Aufstützen oder festes Auflegen bezeichnen. Die gewählte Formulierung benennt die rituelle Handlung, ohne eine im Vers nicht ausgesprochene Deutung über Übertragung, Identifikation oder Sühne hinzuzufügen.
- issue: Deutung von הָאֶחָד
  choice: den einen Widder
  alternative: den ersten Widder
  rationale: Der hebräische Ausdruck unterscheidet den einen Widder vom anderen. Die Übersetzung bewahrt diese Formulierung und legt sich nicht unnötig auf eine ordinale Bedeutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Anweisungssyntax. Die Formulierung bleibt eng am Hebräischen, klingt jedoch natürlich; kultische Fachdeutungen, die über den Wortlaut hinausgehen, werden vermieden.
