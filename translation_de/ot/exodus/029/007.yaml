  text: Dann nimm das Salböl, gieße es auf seinen Kopf und salbe ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann nimmst du
  rationale: Das mit וְ verbundene Qal-Perfekt führt die nächste Handlung der Ritualanweisung fort. „Dann“ macht die Abfolge im modernen Deutschen deutlich; das Präsens entspricht dem natürlichen Stil deutscher Anweisungen.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die Status-constructus-Verbindung bezeichnet das für die Salbung bestimmte Öl. „Salböl“ ist die prägnante und etablierte deutsche Wiedergabe.
- source_word: וְיָצַקְתָּ
  choice: gießt es
  rationale: יצק bedeutet hier „gießen“. Das Pronomen „es“ nimmt das Salböl eindeutig auf und sorgt für einen natürlichen deutschen Satzfluss.
- source_word: עַל רֹאשׁוֹ
  choice: auf seinen Kopf
  rationale: Die Präpositionalverbindung wird direkt und idiomatisch wiedergegeben; „Kopf“ entspricht רֹאשׁ ohne unnötige Stilisierung.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: und salbst ihn
  rationale: משׁח ist der übliche Ausdruck für die rituelle Salbung. „salben“ bewahrt sowohl die konkrete Handlung als auch ihre kultische Bedeutung.
theological_decisions:
- issue: Verhältnis von Ausgießen und Salben
  choice: 'Beide Verben werden als eigene, aufeinander bezogene Handlungen wiedergegeben: „gießt es auf seinen Kopf und salbst ihn“.'
  alternative: 'Die Handlungen erklärend zusammenziehen: „salbst ihn, indem du es auf seinen Kopf gießt“.'
  rationale: Der hebräische Text koordiniert יצק und משׁח ausdrücklich. Die getrennte Wiedergabe bewahrt die sprachliche Gestalt und vermeidet, das Verhältnis beider Handlungen enger zu bestimmen, als der Text es tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anweisung wird im Präsens mit direkter Du-Anrede formuliert; dies klingt natürlich und bewahrt den verbindlichen Charakter des Ritualtextes.
