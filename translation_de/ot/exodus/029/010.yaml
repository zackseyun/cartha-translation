source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/פָּ֔ר לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הַ/פָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: de
  text: Du sollst den Stier vor das Zelt der Begegnung bringen[a]. Aaron und seine Söhne sollen ihre Hände auf den Kopf des Stieres legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »heranbringen« oder »darbringen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Du sollst … bringen
  rationale: Der Hifil von קרב bedeutet im Opferkontext »heranbringen« oder »darbringen«. »Bringen« ist natürliches modernes Deutsch; die kultische und räumliche Bedeutung bleibt durch »vor das Zelt der Begegnung« erhalten.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet einen Stier, im Opferkontext oft einen jungen Stier. »Stier« ist präzise und im Deutschen natürlich.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier die Lage vor beziehungsweise in der Gegenwart des Heiligtums. »Vor« gibt dies knapp und idiomatisch wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtumszelt. »Zelt der Begegnung« bewahrt sowohl den kultischen Charakter als auch den Gedanken der Begegnung, ohne מוֹעֵד vorschnell nur zeitlich zu deuten.
- source_word: וְסָמַךְ
  choice: sollen … legen
  rationale: סמך bezeichnet zusammen mit den Händen und dem Kopf des Opfertiers die rituelle Handauflegung. »Die Hände auf … legen« ist im Deutschen klar und konkret.
- source_word: יְדֵיהֶם
  choice: ihre Hände
  rationale: Der hebräische Text verwendet den Plural und beschreibt Aaron und seine Söhne als gemeinsam Handelnde.
- source_word: עַל רֹאשׁ הַפָּר
  choice: auf den Kopf des Stieres
  rationale: Die Formulierung gibt die konkrete körperliche Handlung eng und zugleich natürlich wieder.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seine Söhne
  rationale: בָּנָיו meint hier die männlichen Nachkommen Aarons, die für den Priesterdienst eingesetzt werden.
theological_decisions:
- issue: Bedeutung der Handauflegung auf das Opfertier
  choice: Die konkrete rituelle Handlung wird ohne Deutung wiedergegeben.
  alternative: Die Handlung ausdrücklich als Übertragung von Schuld oder als Identifikation mit dem Opfer erklären.
  rationale: Der Vers nennt die Handauflegung, erläutert aber ihre theologische Bedeutung nicht. Die Übersetzung fügt daher keine bestimmte Lehrdeutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede im Singular entspricht וְהִקְרַבְתָּ; im zweiten Satz wird der hebräische Subjektwechsel zu Aaron und seinen Söhnen beibehalten. »Zelt der Begegnung« dient als verständliche und quellennah formulierte Heiligtumsbezeichnung.
