  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: de
  text: Dazu ein Zehntel Feinmehl, vermengt mit einem Viertel Hin Öl aus zerstoßenen Oliven,[a] und als Trankopfer ein Viertel Hin Wein für das eine Lamm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Zehntel meint hier ein Zehntel eines Efa. Das Öl wurde aus zerstoßenen oder geschlagenen Oliven gewonnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für das erste Lamm“. Im Zusammenhang ist wahrscheinlich das erste der beiden täglich darzubringenden Lämmer gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹן
  choice: Dazu ein Zehntel
  rationale: עִשָּׂרוֹן bezeichnet im Opferkontext ein Zehntel Efa. Der Haupttext bewahrt wie das Hebräische die verkürzte Maßangabe; die Bezugsgröße wird in der Fußnote erläutert.
- source_word: סֹלֶת
  choice: Feinmehl
  rationale: סֹלֶת bezeichnet fein gemahlenes, für Opfer verwendetes Mehl. „Feinmehl“ ist die klare und eingebürgerte deutsche Entsprechung.
- source_word: בָּלוּל בְּשֶׁמֶן
  choice: vermengt mit … Öl
  rationale: Das passive Partizip mit ב bezeichnet das Vermischen des Mehls mit Öl. „Vermengt mit“ klingt in einer Opferanweisung natürlich und würdevoll.
- source_word: כָּתִית
  choice: Öl aus zerstoßenen Oliven
  rationale: כָּתִית beschreibt Öl, das aus geschlagenen beziehungsweise zerstoßenen Oliven gewonnen wurde. Die explizite Formulierung ist im modernen Deutsch verständlicher als das missverständliche „gestoßenes Öl“.
- source_word: רֶבַע הַהִין / רְבִעִית הַהִין
  choice: ein Viertel Hin
  rationale: Beide Ausdrücke bezeichnen ein Viertel der antiken Flüssigmaßeinheit Hin. Die Einheit bleibt unkonvertiert und wird an beiden Stellen einheitlich wiedergegeben.
- source_word: וְנֵסֶךְ
  choice: und als Trankopfer
  rationale: נֶסֶךְ ist der Fachausdruck für ein ausgegossenes Begleitopfer. „Trankopfer“ ist im Deutschen verständlicher und traditionell geläufiger als „Libation“.
- source_word: יַיִן
  choice: Wein
  rationale: Dies ist die gewöhnliche Bedeutung des hebräischen Wortes und passt unmittelbar zum Trankopfer.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: für das eine Lamm
  rationale: Die Wiedergabe erhält Artikel und Zahlwort und vermeidet, die kontextuell mögliche Bedeutung „für das erste Lamm“ stillschweigend in den Haupttext einzutragen.
theological_decisions:
- issue: Bezug von הָאֶחָד bei den beiden täglichen Lämmern
  choice: das eine Lamm
  alternative: das erste Lamm
  rationale: Der unmittelbare Kontext legt das erste der beiden täglichen Lämmer nahe; der hebräische Wortlaut sagt jedoch wörtlich „das eine Lamm“. Die Übersetzung bewahrt diese Spannung, während die Fußnote die kontextuelle Deutung nennt.
translation_notes:
  register: Moderne, klare und zugleich würdige Anweisungssprache. Die antike Maßeinheit „Hin“ bleibt erhalten. „Öl aus zerstoßenen Oliven“ gibt die Herstellungsart verständlich wieder; „das eine Lamm“ bewahrt die Formulierung und mögliche Spannung des Hebräischen.
