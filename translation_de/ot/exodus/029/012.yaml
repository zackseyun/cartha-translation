base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: de
  text: Und du sollst etwas von dem Blut des Stieres[a] nehmen und es mit deinem Finger an die Hörner[b] des Altars streichen; alles Blut sollst du an den Sockel des Altars gießen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Blut des Stieres“; gemeint ist, dass ein Teil des Blutes genommen wird.'
    reason: lexical_alternative
  - marker: b
    text: Die „Hörner“ waren hornförmige Vorsprünge an den Ecken des Altars.
    reason: cultural_note
  - marker: c
    text: 'Oder: „an die Basis des Altars“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Und du sollst … nehmen
  rationale: Das Qal-Perfekt mit וְ setzt die Anweisungsfolge fort und hat hier gebietenden Sinn; die deutsche Soll-Form bewahrt sowohl den Befehl als auch den rituellen Ablauf.
- source_word: מִדַּם הַפָּר
  choice: etwas von dem Blut des Stieres
  rationale: 'מִן ist hier partitiv: Ein Teil des Blutes wird für die Hörner genommen. Die Formulierung macht diesen Sinn deutlich und bleibt nahe am hebräischen Ausdruck.'
- source_word: וְנָתַתָּה עַל
  choice: und es … an … streichen
  rationale: נתן bedeutet allgemein „geben, setzen, tun“. Im Zusammenhang mit Blut, Finger und Altarhörnern gibt „streichen“ die konkrete rituelle Handlung natürlich wieder, ohne einen technischen Fachbegriff einzuführen.
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: die Hörner des Altars
  rationale: Die konkrete kultische Bezeichnung wird beibehalten; gemeint sind hornförmige Vorsprünge an den Altarecken.
- source_word: בְּאֶצְבָּעֶךָ
  choice: mit deinem Finger
  rationale: Die Präposition בְּ ist instrumental gebraucht; „mit“ ist die natürliche deutsche Entsprechung.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: alles übrige Blut sollst du … gießen
  rationale: שׁפך bezeichnet hier das Ausgießen. „Übrige“ verdeutlicht im Deutschen, dass nach der zuvor entnommenen Teilmenge der gesamte Rest ausgegossen wird; dies entspricht dem Ablauf des hebräischen Satzes.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: an den Sockel des Altars
  rationale: יְסוֹד bezeichnet Fundament oder Basis. „Sockel“ ist für den unteren baulichen Teil des Altars anschaulich; אֶל bezeichnet die Richtung beziehungsweise das Ziel des Gießens.
theological_decisions:
- issue: Konkretheit der kultischen Altarterminologie
  choice: „Hörner“ und „Sockel“ als konkrete Bauteile des Altars beibehalten
  alternative: „Ecken“ und „Fuß“ des Altars
  rationale: Der Vers beschreibt einen genau festgelegten Weiheritus. Die konkreten Bezeichnungen bewahren seine rituelle und theologische Eigenart, ohne sie durch verallgemeinernde oder später dogmatisch geprägte Sprache zu ersetzen.
- issue: Verhältnis der entnommenen Blutmenge zum anschließend ausgegossenen Blut
  choice: „etwas von dem Blut“ und danach „alles übrige Blut“
  alternative: Wörtlich „von dem Blut“ und „alles Blut“
  rationale: 'Die Formulierung gibt den partitiv gemeinten ersten Ausdruck und den natürlichen Ablauf wieder: Eine Teilmenge wird aufgetragen, der gesamte verbleibende Rest wird ausgegossen. Es wird keine zusätzliche symbolische Deutung eingeführt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer ritueller Anweisungsform. Konkrete Kultbegriffe bleiben erhalten; ungebräuchliche Satzstellung und unnötig technische Sprache werden vermieden.
