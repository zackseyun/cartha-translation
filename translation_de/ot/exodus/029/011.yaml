  yaml_path: translation/ot/exodus/029/011.yaml
  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: de
  text: Dann sollst du den Stier vor Jahwe[a] am Eingang des Zeltes der Begegnung schlachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; hier „Jahwe“. Traditionell wird der Name mit „der HERR“ wiedergegeben; eine weitere Wiedergabe ist „Jehova“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Dann sollst du … schlachten
  rationale: Das Qal-Perfekt mit וְ setzt die Anweisungsfolge fort und hat hier gebietenden Zukunftssinn. „Schlachten“ bezeichnet im Opferkontext präziser als „töten“ die rituelle Handlung; „dann“ gibt den Fortgang natürlich wieder.
- source_word: הַפָּר
  choice: den Stier
  rationale: פַּר bezeichnet im Opferkontext einen Stier; eine Altersangabe wie „junger Stier“ ist hier nicht ausdrücklich erforderlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet wörtlich „vor“ und kann zugleich die Gegenwart Jahwes bezeichnen. Die knappe Wiedergabe bewahrt diese Bedeutungsbreite.
- source_word: פֶּתַח
  choice: am Eingang
  rationale: פֶּתַח bezeichnet den Eingang beziehungsweise die Öffnung; „am Eingang“ ist im Deutschen die natürliche Ortsangabe.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die etablierte deutsche Bezeichnung gibt אֹהֶל als „Zelt“ und מוֹעֵד in seiner Funktion als festgesetzte Begegnung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen; die traditionelle Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. Die Satzstellung hält den engen Zusammenhang zwischen „vor Jahwe“ und dem Schlachten fest, während „am Eingang des Zeltes der Begegnung“ den Ort angibt.
