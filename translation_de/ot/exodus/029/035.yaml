base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: de
  text: Und du sollst mit Aaron und seinen Söhnen so verfahren, ganz wie ich dir geboten habe. Sieben Tage lang sollst du sie in den Priesterdienst einsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Hand füllen“; eine hebräische Wendung für die Einsetzung in den priesterlichen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und du sollst … verfahren
  rationale: Die mit וְ verbundene Perfektform führt im Anweisungskontext die verpflichtende Handlungsfolge fort. Zusammen mit כָּכָה gibt „so verfahren“ den Sinn natürlich und präzise wieder.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: mit Aaron und seinen Söhnen
  rationale: Das wiederholte ל bezeichnet hier die Personen, an denen die vorgeschriebene Handlung vollzogen wird. Im Deutschen ist „mit … verfahren“ in dieser Satzkonstruktion idiomatischer als „für … tun“.
- source_word: כָּכָה
  choice: so
  rationale: Das deiktische Adverb verweist auf das zuvor angeordnete Ritual zurück. „So“ ist knapp, gegenwärtig und verständlich.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: ganz wie ich dir geboten habe
  rationale: „Ganz wie“ bewahrt den umfassenden Gedanken von כְּכֹל und drückt die vollständige Übereinstimmung mit den vorausgehenden Anweisungen in natürlichem Deutsch aus.
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Die Zeitangabe bezeichnet die Dauer. „Sieben Tage lang“ macht diese Funktion im Deutschen ohne einen nicht vorhandenen kausalen oder erklärenden Anschluss deutlich.
- source_word: תְּמַלֵּא יָדָם
  choice: sollst du sie in den Priesterdienst einsetzen
  rationale: Die Wendung מלא יד, wörtlich „die Hand füllen“, ist hier ein priesterlicher Einsetzungsidiom. Die gewählte Formulierung gibt sowohl die Amtseinsetzung als auch ihren konkreten priesterlichen Bezug klar wieder.
theological_decisions:
- issue: Wiedergabe des priesterlichen Idioms מלא יד
  choice: sie in den Priesterdienst einsetzen
  alternative: ihre Hand füllen; sie weihen; sie in ihr Amt einsetzen
  rationale: Der Wortlaut bezeichnet in diesem kultischen Zusammenhang die förmliche Einsetzung Aarons und seiner Söhne in den priesterlichen Dienst. „In den Priesterdienst einsetzen“ vermeidet spätere konfessionelle Amtsbegriffe und macht die Funktion im unmittelbaren Kontext deutlich; die wörtliche Wendung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Anweisungsfolge, ohne unnatürlich oder altertümlich zu wirken.
