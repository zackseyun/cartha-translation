source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּעֲשֶׂ֖ה עַל הַ/מִּזְבֵּ֑חַ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנַ֥יִם לַ/יּ֖וֹם תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/038.yaml
  text: 'This is what you shall offer on the altar: two one-year-old lambs each day continually[a][b][c].'
translation:
  language: de
  text: 'Und das sollst du auf dem Altar darbringen: Tag für Tag zwei einjährige Lämmer als regelmäßige Darbringung.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was du auf dem Altar tun sollst“. Das hebräische Verb bedeutet allgemein „tun, machen“, bezeichnet hier aber das Darbringen des Opfers.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet hier eine fortlaufende, regelmäßig wiederkehrende Darbringung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר
  choice: Und dies ist es, was
  rationale: Bewahrt den hebräischen Anschluss וְ sowie die vorausweisende Relativkonstruktion und klingt zugleich in würdigem modernem Deutsch natürlich.
- source_word: תַּעֲשֶׂה עַל הַמִּזְבֵּחַ
  choice: du auf dem Altar darbringen sollst
  rationale: עָשָׂה bedeutet grundsätzlich „tun/machen“; im Opferkontext bezeichnet es hier das Vollziehen der Darbringung. „Darbringen“ gibt diesen Sinn idiomatisch wieder, ohne dem Satz eine zusätzliche Opferspezifikation hinzuzufügen.
- source_word: כְּבָשִׂים
  choice: Lämmer
  rationale: Die übliche deutsche Entsprechung; die nachfolgende Altersangabe bestimmt die Tiere näher.
- source_word: בְּנֵי שָׁנָה
  choice: einjährige
  rationale: Idiomatiche Wiedergabe der wörtlichen hebräischen Wendung „Söhne eines Jahres“.
- source_word: שְׁנַיִם לַיּוֹם
  choice: Tag für Tag zwei
  rationale: Gibt die Zahl und den distributiven Sinn von לַיּוֹם in natürlichem Deutsch wieder.
- source_word: תָּמִיד
  choice: beständig
  rationale: Bezeichnet im kultischen Zusammenhang die fortdauernde, regelmäßig wiederkehrende Durchführung und nicht zwingend eine pausenlose Einzelhandlung.
theological_decisions:
- issue: Bedeutungsumfang von תָּמִיד beim täglichen Opfer
  choice: beständig
  alternative: ununterbrochen
  rationale: Der Kontext spricht von einer regelmäßig jeden Tag wiederkehrenden Darbringung. „Beständig“ bewahrt den Fortdauerungsaspekt, ohne fälschlich eine pausenlose Opferhandlung nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Tag für Tag zwei …, beständig“ hält tägliche Frequenz und fortdauernde Regelmäßigkeit eng zusammen. Die einleitende Konjunktion וְ wird als „Und“ bewahrt.
