base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: de
  text: Dann nimmst du etwas von dem Blut, das auf dem Altar ist, und etwas von dem Salböl und sprengst es auf Aaron und auf seine Gewänder, auf seine Söhne und auf die Gewänder seiner Söhne bei ihm. Aaron wird mitsamt seinen Gewändern heilig sein, ebenso seine Söhne mitsamt den Gewändern seiner Söhne bei ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aaron wird mitsamt seinen Gewändern, ebenso seine Söhne mitsamt den Gewändern ihrer Söhne bei ihm, geweiht sein.“ Wörtlich steht im Hebräischen „heilig sein“; dies bezeichnet den durch die rituelle Handlung bewirkten heiligen Status.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann nimmst du
  rationale: Das Qal-Perfekt mit וְ führt die rituelle Anweisungsfolge fort. Das deutsche Präsens hat hier klaren Vorschriftscharakter und klingt natürlicher als ein Futur oder „du sollst nehmen“.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: etwas von dem Blut, das auf dem Altar ist
  rationale: מִן bezeichnet hier die Entnahme einer Teilmenge; „etwas von“ gibt dies präzise wieder. Der Relativsatz bleibt erhalten.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: Salböl
  rationale: Die deutsche Zusammensetzung ist die natürliche und im kultischen Zusammenhang genaue Wiedergabe der Constructusverbindung.
- source_word: וְהִזֵּיתָ
  choice: und sprengst es
  rationale: Der Hiphil von נזה bezeichnet im kultischen Kontext das Versprengen einer Flüssigkeit. Das Pronomen bezieht sich zusammenfassend auf Blut und Salböl.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: seine Gewänder / die Gewänder seiner Söhne
  rationale: „Gewänder“ wahrt den allgemeinen Sinn von בגד und passt zum priesterlichen Kontext, ohne spätere kirchliche Fachsprache einzutragen.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der maskuline Plural bezeichnet im Kontext Aarons Söhne als Priester.
- source_word: אִתּוֹ
  choice: die bei ihm sind
  rationale: Die Relativformulierung gibt die Zuordnung zu Aaron im Deutschen klar wieder und bewahrt die wiederholte hebräische Angabe.
- source_word: וְקָדַשׁ
  choice: So werden … heilig sein
  rationale: Das Verb bezeichnet als Ergebnis der rituellen Handlung einen heiligen Status. Die Wiedergabe mit „heilig“ bleibt eng an קדשׁ und vermeidet eine vorschnelle begriffliche Verengung auf „geweiht“.
theological_decisions:
- issue: Wirkung der rituellen Heiligung
  choice: werden … heilig sein
  alternative: werden geweiht sein / werden geheiligt sein
  rationale: Der hebräische Text beschreibt den resultierenden Status mit קדשׁ. „Heilig sein“ bewahrt seine eigene theologische Kategorie, während „geweiht“ stärker den Vorgang interpretiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das anweisende Präsens bildet die hebräische rituelle Abfolge natürlich ab. Die Wiederholungen des Ausgangstextes bleiben weitgehend erhalten; „ebenso“ erleichtert lediglich den deutschen Satzfluss.
