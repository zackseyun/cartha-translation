    issue: „die bei ihm sind“ bindet „bei ihm“ grammatisch an die Gewänder.
    rationale: Die hebräische Wendung אִתּוֹ steht nach „den Gewändern seiner Söhne“ und lässt ihre genaue syntaktische Reichweite knapp. Der deutsche Relativsatz macht daraus dagegen eindeutig eine Aussage über die Gewänder. Die Formulierung muss so geändert werden, dass keine zusätzliche, sachlich unplausible Zuordnung entsteht.
