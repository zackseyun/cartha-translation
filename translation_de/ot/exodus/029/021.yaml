  verdict: revise
  source_fidelity: 'Die Abfolge von Blut und Salböl, das kultische Versprengen sowie das Ergebnis „heilig“ werden zutreffend wiedergegeben. Die Relativformulierung „die bei ihm sind“ verschiebt jedoch die Anbindung von אִתּוֹ: Im Deutschen bezieht sie sich unmittelbar auf „Gewänder“ und besagt damit, die Gewänder seien bei Aaron. Der hebräische Anschluss ist knapper und in seiner genauen Reichweite nicht völlig eindeutig; diese Ambiguität soll nicht durch eine solche Relativsatzanbindung auf die Gewänder eingeengt werden.'
  naturalness: Das anweisende Präsens und „Salböl“ sind natürliches modernes Standarddeutsch. Die überarbeitete Fassung bewahrt die Wiederholung des hebräischen Textes, vermeidet aber den missverständlichen Relativsatz. „mitsamt“ fasst jeweils die Personengruppe und ihre Gewänder idiomatisch zusammen.
  terminology: „Altar“, „Salböl“, „Gewänder“, „Söhne“ und „heilig“ sind angemessen. „Heilig“ ist gegenüber „geweiht“ als Haupttext vorzuziehen, weil es die Terminologie von קדשׁ transparent erhält. Die Fußnote bietet „geweiht“ nur als mögliche kontextuelle Alternative.
  issues:
