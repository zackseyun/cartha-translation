revisions:
- from: Dann nimmst du etwas von dem Blut, das auf dem Altar ist, und etwas von dem Salböl und sprengst es auf Aaron und auf seine Gewänder, auf seine Söhne und auf die Gewänder seiner Söhne, die bei ihm sind. So werden er und seine Gewänder heilig sein, ebenso seine Söhne und die Gewänder seiner Söhne, die bei ihm sind.[a]
  to: Dann nimmst du etwas von dem Blut, das auf dem Altar ist, und etwas von dem Salböl und sprengst es auf Aaron und auf seine Gewänder, auf seine Söhne und auf die Gewänder seiner Söhne bei ihm. Aaron wird mitsamt seinen Gewändern heilig sein, ebenso seine Söhne mitsamt den Gewändern seiner Söhne bei ihm.[a]
  rationale: Die Fassung korrigiert die fehlerhafte Relativsatzanbindung von „bei ihm“. Die knappe Stellung von אִתּוֹ wird mit der ebenfalls knappen Nachstellung „bei ihm“ bewahrt, ohne seine Reichweite stärker festzulegen als der hebräische Text. Aaron wird im Ergebnissatz zur besseren deutschen Verständlichkeit ausdrücklich genannt; dies entspricht eindeutig dem vorangehenden Bezug.
