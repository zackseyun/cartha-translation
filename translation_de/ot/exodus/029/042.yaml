base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: de
  text: Es soll ein regelmäßiges Brandopfer sein für alle eure Generationen, am Eingang des Zeltes der Begegnung vor Jahwe[a]. Dort werde ich euch begegnen, um dort zu dir zu reden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein beständiges Brandopfer“ bzw. „ein fortwährendes Brandopfer“. Gemeint ist die regelmäßig wiederkehrende Darbringung.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht „euch“ im Plural, „dir“ dagegen im Singular. Der Wechsel unterscheidet wahrscheinlich die größere Gemeinschaft von Mose als dem unmittelbaren Gesprächspartner.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: ein regelmäßiges Brandopfer
  rationale: עֹלָה bezeichnet das vollständig verbrannte Opfer; תָּמִיד meint hier die regelmäßig fortgesetzte, vorgeschriebene Darbringung, nicht notwendig einen ununterbrochenen Vorgang.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die deutsche Wendung gibt die fortdauernde Geltung über die aufeinanderfolgenden Generationen hinweg natürlich wieder.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: פֶּתַח ist der Eingang; אֹהֶל מוֹעֵד bezeichnet das Zelt als den bestimmten Ort der Begegnung. Die Wiedergabe bleibt transparent und im Deutschen verständlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי hat hier räumlich-kultischen Sinn. Der Gottesname יהוה wird als Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: Dort werde ich euch begegnen
  rationale: Der Niphal von יעד bezeichnet eine verabredete bzw. bestimmte Begegnung. לָכֶם ist Plural und wird mit „euch“ erhalten; שָׁמָּה wird ausdrücklich als „dort“ wiedergegeben.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: um dort zu dir zu reden
  rationale: Der Infinitiv bezeichnet den Zweck der Begegnung. אֵלֶיךָ ist Singular und bleibt durch „zu dir“ sichtbar; שָׁם wird als „dort“ bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel vom pluralischen לָכֶם zum singularischen אֵלֶיךָ
  choice: „euch begegnen“ und „zu dir reden“
  alternative: beide Pronomen als Plural oder beide als Singular angleichen
  rationale: Der Numeruswechsel gehört zum Ausgangstext und kann die größere Gemeinschaft beim Begegnen von Mose als unmittelbarem Gesprächspartner unterscheiden. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zelt der Begegnung“ macht die Funktion des אֹהֶל מוֹעֵד verständlich. Der zweimalige Gebrauch von „dort“ bewahrt die hebräische Ortsbetonung; der auffällige Wechsel von Plural zu Singular bleibt im Haupttext erhalten.
