base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: de
  text: Dann sollst du den Widder schlachten und etwas von seinem Blut nehmen und es auf Aarons rechtes Ohrläppchen und auf das rechte Ohrläppchen seiner Söhne, auf den Daumen ihrer rechten Hand und auf die große Zehe ihres rechten Fußes tun; dann sollst du das Blut ringsum an den Altar sprengen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf die Spitze von Aarons rechtem Ohr … auf die Spitze am rechten Ohr seiner Söhne“. Das hebräische Wort kann allgemeiner das äußere Ende des Ohres bezeichnen; im Ritualzusammenhang ist wahrscheinlich das Ohrläppchen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Blut ringsum gegen den Altar schleudern“. Das hebräische Verb bezeichnet hier eher ein kräftiges rituelles Ausbringen als ein sanftes Besprengen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: schlachten
  rationale: Im Opferzusammenhang bezeichnet das Verb das rituelle Schlachten eines Tieres; „schlachten“ ist präzise und im modernen Deutsch natürlich.
- source_word: אַיִל
  choice: Widder
  rationale: „Widder“ ist die übliche und genaue Bezeichnung für das hier genannte männliche Schaf.
- source_word: מִדָּמוֹ
  choice: etwas von seinem Blut
  rationale: מִן bezeichnet hier die Entnahme eines Teils des Blutes; die gewählte Formulierung gibt diesen partitiven Sinn idiomatisch wieder.
- source_word: תְּנוּךְ אֹזֶן
  choice: Läppchen ... am Ohr
  rationale: תְּנוּךְ bezeichnet einen äußeren Teil beziehungsweise das Ende des Ohres. Im Ritualzusammenhang ist „Ohrläppchen“ wahrscheinlich, doch die genauere anatomische Bedeutung bleibt unsicher.
- source_word: הַיְמָנִית
  choice: recht-
  rationale: Das Adjektiv kennzeichnet jeweils das Körperglied auf der rechten Seite und wird im Deutschen natürlich attributiv wiedergegeben.
- source_word: בֹּהֶן יָד
  choice: Daumen
  rationale: Beim Wort für Hand bezeichnet בֹּהֶן den Daumen.
- source_word: בֹּהֶן רֶגֶל
  choice: große Zehe
  rationale: Beim Wort für Fuß bezeichnet בֹּהֶן die große Zehe.
- source_word: זָרַק
  choice: an den Altar sprengen
  rationale: Im Opferritual bezeichnet זָרַק ein kräftiges Ausbringen des Blutes gegen den Altar, nicht bloß ein feines Besprengen. „An den Altar sprengen“ ist eine knappe, würdige deutsche Ritualformulierung.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb beschreibt die Verteilung des Blutes um die Seiten des Altars herum; „ringsum“ bewahrt diesen umfassenden Sinn.
- source_word: וְ
  choice: Dann / und / ebenso
  rationale: Die aufeinanderfolgenden Waw-Formen führen die einzelnen Ritualschritte weiter. Unterschiedliche natürliche Konnektoren erhalten im Deutschen sowohl Ablauf als auch Lesbarkeit.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Ritualstil. Die wiederholten Körperangaben bleiben nahe an der hebräischen Form; „ebenso“ vermeidet zugleich eine schwerfällige Reihung. Die beiden echten lexikalischen Unsicherheiten werden durch unmittelbar passend gesetzte Fußnoten kenntlich gemacht.
