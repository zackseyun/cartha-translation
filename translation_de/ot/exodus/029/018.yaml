base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: de
  text: Du sollst den ganzen Widder auf dem Altar in Rauch aufgehen lassen. Es ist ein Brandopfer für Jahwe, ein wohlgefälliger Duft[a], ein Feueropfer für Jahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein beruhigender Duft“. Die hebräische Wendung ist eine feste Opferformel und bezeichnet ein Opfer, das Jahwes Wohlgefallen findet.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutung des hebräischen Opferbegriffs ist unsicher. Traditionell wird er als „Feueropfer“ verstanden; möglich ist auch die Vorstellung einer dargebrachten Gabe oder Speise.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: Lass … in Rauch aufgehen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen auf dem Altar, wobei das Opfer als Rauch aufsteigt. Die Formulierung gibt diesen kultischen Sinn genauer wieder als das allgemeinere „verbrennen“.
- source_word: כָּל הָאַיִל
  choice: den ganzen Widder
  rationale: כָּל hebt hervor, dass der Widder vollständig und nicht nur teilweise dargebracht wird; אַיִל bezeichnet spezifisch einen Widder.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung bezeichnet hier die Bewegung zum Altar; im Deutschen ist wegen des dort stattfindenden Verbrennens „auf dem Altar“ idiomatisch.
- source_word: עֹלָה
  choice: Brandopfer
  rationale: „Brandopfer“ ist die etablierte deutsche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer; „Aufstiegsopfer“ wäre etymologisch durchsichtig, aber weniger verständlich.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל markiert Widmung beziehungsweise Zuordnung. „Für Jahwe“ ist in diesem deutschen Satz natürlich und bewahrt den Gedanken der Darbringung an Gott.
- source_word: רֵיחַ נִיחוֹחַ
  choice: ein Duft, der Wohlgefallen weckt
  rationale: Die feste Opferformel bezeichnet einen Gott angenehmen beziehungsweise von ihm angenommenen Duft. Die Formulierung erhält das Bild, ohne eine bloß körperliche Geruchswahrnehmung in den Vordergrund zu stellen.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Das seltene kultische Wort wird traditionell und kontextgemäß als ein durch Feuer dargebrachtes Opfer verstanden. Die genaue Herleitung und Bedeutungsnuance bleiben jedoch unsicher.
- source_word: הוּא
  choice: Er ist
  rationale: Das Pronomen identifiziert den ganzen Widder beziehungsweise das dargebrachte Opfer als Brandopfer. Das zweite הוּא wird in der koordinierten deutschen Aufzählung nicht eigens wiederholt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage von רֵיחַ נִיחוֹחַ über Gott
  choice: ein Duft, der Wohlgefallen weckt
  alternative: ein beruhigender Duft; ein lieblicher Geruch
  rationale: Die Übersetzung wahrt die kultische Aussage von Gottes Annahme und Wohlgefallen, ohne festzulegen, dass das Opfer Gott im Sinne einer heidnischen Beschwichtigung besänftige.
- issue: Deutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speiseopfer; Gabe
  rationale: Der Zusammenhang mit dem Verbrennen auf dem Altar stützt „Feueropfer“. Wegen der unsicheren Etymologie wird die mögliche Deutung als dargebrachte Gabe beziehungsweise Speise in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufforderung „Lass … in Rauch aufgehen“ bildet den kultischen Vorgang anschaulich und präzise ab. Die Satzfolge bleibt nahe an der hebräischen Identifikations- und Opferformel, ohne im Deutschen unnötig schwerfällig zu wirken.
