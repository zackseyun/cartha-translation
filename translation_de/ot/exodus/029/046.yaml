  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: de
  text: Und sie werden erkennen, dass ich, Jahwe, ihr Gott, sie aus dem Land Ägypten herausgeführt habe, um in ihrer Mitte[a] zu wohnen. Ich bin Jahwe, ihr Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter ihnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und sie werden erkennen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im Zusammenhang der vorausgehenden Anweisungen und Verheißungen Zukunfts- beziehungsweise Ergebnisbedeutung. „Erkennen“ gibt das umfassende, auf Erfahrung beruhende Wissen von יָדַע angemessen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihr Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, bezeichnet es hier zusammen mit dem Gottesnamen eindeutig den einen Gott Israels.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: der sie aus dem Land Ägypten herausgeführt hat
  rationale: Die Formulierung bewahrt die typische Exodus-Sprache und gibt die Herkunftsangabe mit מִן durch „aus“ wieder.
- source_word: לְשָׁכְנִי
  choice: um … zu wohnen
  rationale: 'Der Infinitiv mit לְ bezeichnet hier den Zweck des Herausführens: Gottes Wohnen inmitten seines Volkes.'
- source_word: בְתוֹכָם
  choice: in ihrer Mitte
  rationale: Die Wendung bildet das hebräische בְּתוֹכָם präzise und zugleich in natürlichem, würdigem Deutsch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Bundesnamen. „Jahwe“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Sinn der Zweckangabe לְשָׁכְנִי
  choice: um in ihrer Mitte zu wohnen
  alternative: um unter ihnen zu wohnen; zu meinem Wohnen in ihrer Mitte
  rationale: לְ vor dem Infinitiv wird im Kontext am besten final verstanden. Die Übersetzung macht deutlich, dass das Herausführen aus Ägypten auf Gottes Gegenwart bei seinem Volk zielt, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Satzbau. Die wiederholte Bundesformel „Ich bin Jahwe, ihr Gott“ und die Zweckbeziehung des hebräischen Satzes bleiben erhalten.
