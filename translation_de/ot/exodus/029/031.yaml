base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: de
  text: Dann sollst du den Einsetzungswidder[a] nehmen und sein Fleisch an einem heiligen Ort[b] kochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Weihe-Widder“. Der hebräische Ausdruck bezeichnet den Ritus der Einsetzung der Priester in ihr Amt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „an einem geweihten Ort“. Der hebräische Ausdruck lautet wörtlich „an einem heiligen Ort“ und bezeichnet nicht zwingend den Raum „das Heilige“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: Widder
  rationale: Die übliche und präzise deutsche Bezeichnung für das männliche Schaf als Opfertier.
- source_word: הַמִּלֻּאִים
  choice: Einsetzung
  rationale: Der Ausdruck bezeichnet hier den Ritus, durch den die Priester in ihr Amt eingesetzt werden. „Einsetzung“ ist im modernen Deutsch klar und wahrt den kultischen Amtsbezug.
- source_word: תִּקָּח
  choice: sollst du nehmen
  rationale: Gibt die direktive Kraft des Imperfekts im Zusammenhang fortlaufender Anweisungen natürlich wieder.
- source_word: וּבִשַּׁלְתָּ
  choice: und … kochen
  rationale: בשׁל bezeichnet hier die Zubereitung durch Kochen; das deutsche „kochen“ ist präzise und idiomatisch.
- source_word: בְּשָׂרוֹ
  choice: sein Fleisch
  rationale: „Fleisch“ entspricht בשר und passt zur Sprache des Opferkults; das Possessivpronomen bezieht sich auf den Widder.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  rationale: Die artikellose hebräische Wortgruppe bezeichnet unmittelbar einen heiligen Ort, ohne zwingend den technisch benannten Raum „das Heilige“ festzulegen.
theological_decisions:
- issue: Technischer kultischer Ausdruck הַמִּלֻּאִים bei der Einsetzung der Priester
  choice: Einsetzungswidder
  alternative: Weihe-Widder
  rationale: „Einsetzung“ hebt die Aufnahme der Priester in ihr Amt hervor; „Weihe“ ist ebenfalls möglich und betont stärker die Heiligung. Die Hauptfassung lässt die kultische Dimension bestehen, ohne eine konfessionell geprägte Amtslehre einzutragen.
- issue: Bestimmtheit und kultische Spezifizierung von בְּמָקוֹם קָדֹשׁ
  choice: an einem heiligen Ort
  alternative: im Heiligen
  rationale: Der hebräische Ausdruck hat hier keinen Artikel und verlangt nicht die Identifikation mit dem als „das Heilige“ bezeichneten Raum des Heiligtums. Die allgemeinere Wiedergabe vermeidet eine unbelegte Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bildet den hebräischen Anweisungsstil ab; „Dann sollst du“ klingt natürlich und bewahrt die direktive Fortsetzung. „Einsetzungswidder“ dient als verständlicher kultischer Fachausdruck.
