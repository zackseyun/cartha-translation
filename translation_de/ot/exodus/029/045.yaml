  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/045.yaml
  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: de
  text: Und ich werde unter den Söhnen Israels[a][b] wohnen und ihr Gott sein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mitten unter den Söhnen Israels«.'
    reason: Lexikalische Alternative für בְּתוֹךְ, die die Vorstellung der Gegenwart in ihrer Mitte stärker hervorhebt.
  - marker: b
    text: 'Hebräisch: »Söhne Israels«; auch: »Israeliten« oder traditionell »Kinder Israels«.'
    reason: Erläutert die wörtliche, geschlechtlich markierte Familienbezeichnung; die Präposition „unter“ gehört zur Wiedergabe von בְּתוֹךְ.
  - marker: c
    text: 'Wörtlicher: »ihnen Gott sein«.'
    reason: Die Alternative bildet die hebräische Präposition לְ formal genauer ab, während der Haupttext die natürliche deutsche Bundesformel verwendet.
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Und ich werde … wohnen
  rationale: שׁכן bezeichnet das Wohnen oder Sich-Niederlassen an einem Ort. »Wohnen« ist im heutigen Deutsch natürlich und bewahrt zugleich den theologischen Klang der bleibenden Gegenwart Gottes, ohne das deutendere »im Heiligtum wohnen« einzutragen.
- source_word: בְּתוֹךְ
  choice: unter
  rationale: בְּתוֹךְ bezeichnet bei einer Personengruppe die Gegenwart innerhalb der Gemeinschaft. »Unter« gibt dies idiomatisch wieder; die räumlich stärker hervorgehobene Alternative »mitten unter« bleibt in der Fußnote erhalten.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die hebräische Wendung bedeutet wörtlich »Söhne Israels«. Die Übersetzung bewahrt das familiäre Bild und die ausdrücklich maskuline Form des Ausgangstextes; das im modernen Deutsch geläufigere »Israeliten« wird als Alternative genannt.
- source_word: וְהָיִיתִי
  choice: und … sein
  rationale: היה bezeichnet hier im Rahmen der Bundesformel ein bestehendes Verhältnis, nicht primär eine Zustandsveränderung. Daher ist »sein« gegenüber »werden« vorzuziehen.
- source_word: לָהֶם
  choice: ihr
  rationale: Die Präposition bedeutet wörtlich »ihnen/für sie«. In der deutschen Bundesformel gibt das Possessivpronomen »ihr« die relationale Bedeutung natürlich und genau wieder.
- source_word: לֵאלֹהִים
  choice: Gott
  rationale: Im Zusammenhang mit dem göttlichen Sprecher und Israel bezeichnet אֱלֹהִים eindeutig Gott. Das Fehlen eines Artikels im Hebräischen verlangt hier keine unbestimmte Wiedergabe als »ein Gott«.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: ihr Gott sein
  alternative: ihnen Gott sein
  rationale: »Ihr Gott sein« ist im Deutschen natürlich und bewahrt die relationale und bundesbezogene Kraft von וְהָיִיתִי לָהֶם לֵאלֹהִים. Die formal nähere Alternative wird in einer Fußnote dokumentiert.
- issue: Geschlechtlich markierte Bezeichnung des Volkes
  choice: Söhne Israels
  alternative: Israeliten; Kinder Israels
  rationale: Da der Ausgangstext ausdrücklich die maskuline Pluralform »Söhne« verwendet, bleibt sie im Haupttext erhalten. Die idiomatischere, geschlechtsübergreifend verstandene Bezeichnung »Israeliten« wird als Übersetzungsalternative angegeben, ohne die Form des Hebräischen zu verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt schlicht und feierlich; die anfängliche Konjunktion »Und« wahrt den Anschluss an den hebräischen Kontext. Bildhafte oder konfessionell geprägte Zusätze werden vermieden.
