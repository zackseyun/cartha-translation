  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: de
  text: Und ich werde das Zelt der Begegnung und den Altar heiligen[a]; und Aaron und seine Söhne werde ich heiligen, um mir als Priester zu dienen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weihen“; ebenso beim zweiten Vorkommen von „heiligen“ in diesem Vers.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „um für mich priesterlich zu dienen“ oder „um für mich Priesterdienst zu tun“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: werde ich heiligen
  rationale: Das Piel von קדשׁ bezeichnet hier das Absondern für einen heiligen Zweck. „Heiligen“ gibt den Leitbegriff direkt wieder und ist im Deutschen sowohl für die Heiligtumsgegenstände als auch für die Priester verwendbar.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung bezeichnet den von Gott bestimmten Ort der Begegnung. „Zelt der Begegnung“ ist verständlich, würdig und näher an der Bedeutung als eine rein traditionelle Benennung.
- source_word: הַמִּזְבֵּחַ
  choice: Altar
  rationale: Die übliche und eindeutige deutsche Bezeichnung für den Opferaltar.
- source_word: אַהֲרֹן וְאֶת בָּנָיו
  choice: Aaron und seine Söhne
  rationale: Der Personenname folgt der etablierten deutschen Form; בנים bezeichnet hier ausdrücklich Aarons Söhne und wird daher nicht verallgemeinert.
- source_word: לְכַהֵן לִי
  choice: damit sie mir als Priester dienen
  rationale: Das Verb כהן bezeichnet die Ausübung des Priesterdienstes. Die finale Wiedergabe mit „damit“ drückt den Zweck ihrer Heiligung natürlich aus; „mir“ bewahrt den Gottesbezug von לִי.
theological_decisions:
- issue: Kultische Heiligung von Gegenständen und Personen
  choice: heiligen
  alternative: weihen / für heilig erklären
  rationale: „Heiligen“ bewahrt den wiederholten hebräischen Stamm und lässt offen, wie das kultische Absondern im Einzelnen zu bestimmen ist. Die Fußnote nennt das im heutigen Deutschen geläufige „weihen“ als mögliche kontextuelle Wiedergabe.
- issue: Priesterlicher Dienst Aarons und seiner Söhne
  choice: seine Söhne; mir als Priester dienen
  alternative: seine Kinder; für mich Priester sein
  rationale: Der hebräische Text nennt ausdrücklich die Söhne und beschreibt mit כהן ihre priesterliche Tätigkeit. Die Übersetzung wahrt sowohl die geschlechtsspezifische Referenz als auch die Ausrichtung ihres Dienstes auf Gott.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „heiligen“ spiegelt bewusst die Wiederholung des hebräischen Verbs; „auch“ macht die Weiterführung von den heiligen Gegenständen zu den priesterlichen Personen natürlich deutlich.
