source:
  edition: WLC
  text: וְ/זֶ֨ה הַ/דָּבָ֜ר אֲשֶֽׁר תַּעֲשֶׂ֥ה לָ/הֶ֛ם לְ/קַדֵּ֥שׁ אֹתָ֖/ם לְ/כַהֵ֣ן לִ֑/י לְ֠קַח פַּ֣ר אֶחָ֧ד בֶּן בָּקָ֛ר וְ/אֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: de
  text: 'Und dies sollst du für sie tun, um sie zu heiligen, damit sie mir als Priester dienen: Nimm einen jungen Stier[a] und zwei fehlerlose Widder[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »einen Stier, einen Sohn des Rindes/der Rinderherde«; die hebräische Wendung bezeichnet ein männliches Tier aus der Rinderherde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ohne Makel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר תַּעֲשֶׂה
  choice: dies sollst du … tun
  rationale: Die natürliche deutsche Wendung gibt sowohl דָּבָר als auch den instruktiven Sinn des Imperfekts wieder, ohne das schwerfällige »dies ist die Sache«.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: um sie zu heiligen
  rationale: Im priesterlichen Zusammenhang bezeichnet קדשׁ das Absondern und Herrichten für den heiligen Dienst. »Heiligen« wahrt zudem die Verbindung zum deutschen Wortfeld der Heiligkeit.
- source_word: לְכַהֵן לִי
  choice: damit sie mir als Priester dienen
  rationale: Die Form von כהן bezeichnet die Ausübung des Priesteramts; die Übersetzung erhält sowohl die priesterliche Funktion als auch die Ausrichtung auf Gott.
- source_word: לְקַח
  choice: Nimm
  rationale: Der hebräische Infinitivus absolutus wird hier imperativisch gebraucht und verlangt eine direkte Aufforderung.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: einen jungen Stier
  rationale: פַּר בֶּן־בָּקָר bezeichnet idiomatisch ein männliches Rind aus der Herde, gewöhnlich einen jungen Stier. Die alternative formnähere Wiedergabe wird in der Fußnote genannt.
- source_word: אֵילִם שְׁנַיִם
  choice: zwei Widder
  rationale: Die Tierbezeichnung und die ausdrücklich genannte Anzahl werden direkt wiedergegeben.
- source_word: תְּמִימִם
  choice: fehlerlose
  rationale: Im Opferkontext bezeichnet תמים Tiere ohne körperlichen Makel; »fehlerlos« ist klar und vermeidet die missverständliche allgemeine Bedeutung von »vollkommen«.
theological_decisions:
- issue: Bedeutung der Heiligung für das Priesteramt
  choice: um sie zu heiligen, damit sie mir als Priester dienen
  alternative: um sie zu weihen, sodass sie mir Priesterdienst tun
  rationale: Die gewählte Fassung bewahrt die Zweckbeziehung zwischen Heiligung und priesterlicher Funktion, ohne über den Text hinaus eine bestimmte Ordinationstheologie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anweisung bleibt erhalten; kultische Fachsprache wird nur dort verwendet, wo sie für den Sinn erforderlich ist. Sämtliche Fußnotenmarker stehen unmittelbar nach den betreffenden Ausdrücken.
