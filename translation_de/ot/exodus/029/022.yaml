source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ מִן הָ֠/אַיִל הַ/חֵ֨לֶב וְ/הָֽ/אַלְיָ֜ה וְ/אֶת הַ/חֵ֣לֶב הַֽ/מְכַסֶּ֣ה אֶת הַ/קֶּ֗רֶב וְ/אֵ֨ת יֹתֶ֤רֶת הַ/כָּבֵד֙ וְ/אֵ֣ת שְׁתֵּ֣י הַ/כְּלָיֹ֗ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵ/הֶ֔ן וְ/אֵ֖ת שׁ֣וֹק הַ/יָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: de
  text: Dann nimm vom Widder das Fett, den Fettschwanz, das Fett, das die Eingeweide bedeckt, den Leberlappen[a], die beiden Nieren samt dem Fett, das an ihnen ist, und den rechten Schenkel; denn es ist ein Einsetzungswidder[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Anhang an der Leber. Die genaue anatomische Bezeichnung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: ein Widder zur Amtseinführung beziehungsweise ein Weihe-Widder. Gemeint ist der Widder, der bei der Einsetzung der Priester in ihren Dienst verwendet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann nimm
  rationale: Das waw mit Perfekt setzt die Folge der rituellen Anweisungen fort; ein deutscher Imperativ gibt die direkte Anweisung natürlich und präzise wieder.
- source_word: חֵלֶב
  choice: Fett
  rationale: Im Opferkontext bezeichnet das Wort die besonders für die Darbringung bestimmten Fettteile; „Fett“ ist direkt und verständlich.
- source_word: אַלְיָה
  choice: Fettschwanz
  rationale: Gemeint ist der charakteristische fettreiche Schwanz eines Schafes, nicht lediglich ein Schwanz im Allgemeinen.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: das die Eingeweide bedeckt
  rationale: Die Wendung bezeichnet das Fett, das die inneren Organe umgibt; „Eingeweide“ wahrt die konkrete anatomische Sprache.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: Leberlappen
  rationale: Die genaue anatomische Zuordnung ist umstritten; „Leberlappen“ ist eine verständliche traditionelle Wiedergabe, während die Unsicherheit in einer Fußnote erhalten bleibt.
- source_word: כְּלָיֹת
  choice: Nieren
  rationale: Das Wort bezeichnet hier eindeutig die beiden Nieren des Opfertiers.
- source_word: שׁוֹק הַיָּמִין
  choice: rechter Schenkel
  rationale: שׁוֹק bezeichnet den Schenkel beziehungsweise den entsprechenden Teil des Beins; „Schenkel“ ist im Schlacht- und Opferkontext präzise.
- source_word: אֵיל מִלֻּאִים
  choice: Einsetzungswidder
  rationale: Die Verbindung bezeichnet den Widder, der im Ritual zur Einsetzung der Priester verwendet wird. Das Kompositum ist knapp und vermeidet eine Übertragung späterer kirchlicher Amtsbegriffe.
theological_decisions:
- issue: Wiedergabe der priesterlichen Einsetzungsterminologie in אֵיל מִלֻּאִים
  choice: Einsetzungswidder
  alternative: Widder zur Amtseinführung; Weihe-Widder
  rationale: Der Kontext betrifft die rituelle Einsetzung Aarons und seiner Söhne in den Priesterdienst. „Einsetzungswidder“ bezeichnet diese Funktion, ohne die hebräische Wendung auf eine spätere Form kirchlicher Ordination festzulegen.
- issue: Anatomische Bestimmung von יֹתֶרֶת הַכָּבֵד
  choice: Leberlappen mit Fußnote
  alternative: Anhang an der Leber; Leberanhang
  rationale: Das bezeichnete Körperteil lässt sich nicht völlig sicher bestimmen. Der flüssige Haupttext verwendet die geläufige Wiedergabe, die Fußnote bewahrt jedoch die sachliche Unsicherheit.
translation_notes:
  register: Moderne, würdige Anweisungssprache. Der Imperativ entspricht natürlichem Deutsch und wahrt den fortlaufenden Ablauf des Rituals. Konkrete Opferterminologie bleibt erhalten; fachlich unsichere oder mehrdeutige Ausdrücke werden nicht stillschweigend vereindeutigt.
