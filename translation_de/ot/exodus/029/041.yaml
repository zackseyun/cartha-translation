  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: de
  text: 'Das zweite Lamm sollst du zwischen den Abenden[a] darbringen. Du sollst es mit dem Getreideopfer und dem Trankopfer darbringen, wie beim Morgenopfer: zu einem wohlgefälligen Duft[b], als Feueropfer[c] für Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen den Abenden“; ein hebräisches Zeitidiom für die Zeit am späten Nachmittag oder gegen Abend.'
    reason: Die formnahe Haupttextwiedergabe bewahrt die idiomatische und zeitlich nicht völlig präzise hebräische Angabe.
  - marker: b
    text: 'Auch: „zu einem beruhigenden Duft“.'
    reason: Die Fußnote bewahrt die wörtlichere Nuance der festen Opferformel רֵיחַ נִיחֹחַ.
  - marker: c
    text: 'Oder: „eine durch Feuer dargebrachte Opfergabe“.'
    reason: אִשֶּׁה ist ein kultischer Fachausdruck; die traditionelle Wiedergabe „Feueropfer“ ist naheliegend, die Umschreibung macht den Sinn transparent.
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: das zweite Lamm
  rationale: כֶּבֶשׂ bezeichnet hier ein für das Opfer bestimmtes Lamm beziehungsweise junges Schaf; הַשֵּׁנִי ordnet es als zweites der beiden täglichen Opfer ein.
- source_word: תַּעֲשֶׂה
  choice: sollst du darbringen
  rationale: Das Verb עשה bedeutet grundsätzlich „tun/machen“, bezeichnet im kultischen Zusammenhang aber idiomatisch die Darbringung eines Opfers.
- source_word: בֵּין הָעַרְבָּיִם
  choice: zwischen den Abenden
  rationale: Die formnahe Wiedergabe bewahrt die ungewöhnliche hebräische Zeitangabe und ihre nicht völlig eindeutige Abgrenzung; die verständliche zeitliche Einordnung steht in der Fußnote.
- source_word: מִנְחַת הַבֹּקֶר
  choice: das Speiseopfer … wie am Morgen
  rationale: מִנְחָה bezeichnet in diesem Opferkontext die pflanzliche beziehungsweise aus Getreide bestehende Opfergabe, die das Lamm begleitet.
- source_word: וּכְנִסְכָּהּ
  choice: und das dazugehörige Trankopfer
  rationale: נֶסֶךְ ist eine ausgegossene Opfergabe. „Trankopfer“ ist im Deutschen klar und kultisch passend; „dazugehörig“ gibt den pronominalen Bezug wieder.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: als wohlgefälligen Duft
  rationale: Die feste Opferformel beschreibt bildhaft die annehmliche Wirkung des Opfers vor Gott, ohne sie abstrakt als bloße „Annahme“ aufzulösen.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: אִשֶּׁה bezeichnet eine auf dem Altar verbrannte Opfergabe. „Feueropfer“ bewahrt den kultischen Charakter und den wahrscheinlichen Bezug zum Feuer deutlicher als „Speisegabe“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Wiedergabe „Jahwe“ stellt den im hebräischen Text ausdrücklich verwendeten Gottesnamen dar, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen; „der HERR“ wäre die traditionelle Ersatzlesung.
- issue: Bedeutung der Formel רֵיחַ נִיחֹחַ
  choice: wohlgefälliger Duft
  alternative: beruhigender Duft
  rationale: „Wohlgefällig“ gibt die kultische Annahmeformel natürlich wieder, ohne die Bildsprache zu beseitigen. Die wörtlichere Nuance von ניחוח wird in der Fußnote offengelegt.
- issue: Deutung von אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe
  rationale: Die traditionelle und kontextuell naheliegende Deutung bezieht das Wort auf eine durch Feuer dargebrachte Opfergabe. Die mögliche kultische Kategorie „Speisegabe“ wird nicht in den Text eingetragen, da sie hier das bereits genannte Speiseopfer missverständlich verdoppeln könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit etablierter Opferterminologie. Die Satzteilung erleichtert das Verständnis, während Wiederholung, kultische Bildsprache und die eigentümliche hebräische Zeitangabe erhalten bleiben.
