  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: de
  text: Du sollst sie in einen Korb legen[a] und sie im Korb herbeibringen[b], zusammen mit dem Stier und den beiden Widdern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf einen Korb“. Im Zusammenhang mit einem Behälter ist gemeint, dass die Backwaren in den Korb gelegt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „darbringen“ beziehungsweise „nahebringen“. Das hebräische Verb ist ein gebräuchlicher Ausdruck der Opfersprache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: Du sollst sie legen
  rationale: נתן bedeutet häufig „geben, setzen, legen“. Im Zusammenhang einer konkreten Anweisung ist „legen“ natürlich; das Pronomen verweist auf die Backwaren aus dem vorherigen Vers.
- source_word: עַל סַל אֶחָד
  choice: in einen einzigen Korb
  rationale: עַל heißt häufig „auf“, bezeichnet hier bei einem Behälter aber idiomatisch das Hineinlegen. „Einen einzigen Korb“ bewahrt die Betonung von אֶחָד.
- source_word: וְהִקְרַבְתָּ אֹתָם
  choice: und sie herbeibringen
  rationale: הקריב ist im Opferkontext das fachsprachlich geprägte „nahebringen, darbringen“. „Herbeibringen“ erhält hier die konkrete Bewegung und legt den späteren Opferakt nicht vorschnell fest.
- source_word: בַּסָּל
  choice: im Korb
  rationale: Die Präposition ב bezeichnet hier, dass sich die genannten Backwaren beim Herbeibringen im Korb befinden.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: zusammen mit dem Stier und den beiden Widdern
  rationale: Die wiederholten Akkusativmarker führen weitere Gegenstände der Anweisung ein. „Zusammen mit“ macht die Zuordnung im Deutschen klar, ohne die Satzstruktur unnötig zu belasten.
- source_word: הַפָּר
  choice: der Stier
  rationale: פַּר bezeichnet einen Stier beziehungsweise jungen Stier; „Stier“ ist die schlichte, kontextgemäße Wiedergabe.
- source_word: שְׁנֵי הָאֵילִם
  choice: die beiden Widder
  rationale: Die Verbindung aus Zahlwort und bestimmtem Substantiv wird natürlich mit „die beiden Widder“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von הקריב im Opferkontext
  choice: herbeibringen
  alternative: darbringen / als Opfer bringen
  rationale: Da der Satz sowohl die Backwaren als auch die Tiere umfasst und zunächst ihr Heranbringen beschreibt, wahrt „herbeibringen“ die kultische Färbung, ohne bereits eine spezifische Opferhandlung festzulegen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Anweisungston. „Herbeibringen“ bewahrt die konkrete und zugleich kultisch gefärbte Sprache; „einziger“ macht deutlich, dass alle zuvor genannten Backwaren in denselben Korb kommen.
