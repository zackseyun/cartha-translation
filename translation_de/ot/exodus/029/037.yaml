  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: de
  text: Sieben Tage lang sollst du für den Altar Sühne erwirken und ihn heiligen. Und der Altar wird hochheilig sein. Alles, was den Altar berührt, wird heilig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jeder, der den Altar berührt, soll heilig sein.“ Das Hebräische kann so verstanden werden, dass die Berührung Heiligkeit überträgt, oder so, dass nur Heiliges den Altar berühren darf.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: Sühne erwirken
  rationale: Im priesterschriftlichen Ritualzusammenhang bezeichnet כפר einen Sühne- beziehungsweise Reinigungsritus. „Sühne erwirken“ bewahrt den kultischen Sinn, ohne den Vorgang genauer festzulegen, als es der hebräische Ausdruck tut.
- source_word: עַל הַמִּזְבֵּחַ
  choice: für den Altar
  rationale: Bei כפר kennzeichnet עַל hier das Objekt, für das der Sühneritus vollzogen wird; „für den Altar“ gibt diese Verbindung im Deutschen natürlich wieder.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: und ihn heiligen
  rationale: „Heiligen“ drückt im kultischen Zusammenhang aus, dass der Altar als heilig ausgesondert wird, und ist zugleich verständlich und textnah.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerungsform bezeichnet den höchsten Grad kultischer Heiligkeit. „Hochheilig“ ist im Deutschen knapp, idiomatisch und für eine prädikative Aussage über den Altar geeignet.
- source_word: כָּל הַנֹּגֵעַ
  choice: Alles, was ... berührt
  rationale: Die Verbindung aus כָּל und Partizip kann Personen wie Gegenstände umfassen. „Alles, was“ erhält diese Offenheit besser als eine ausschließlich personenbezogene Formulierung.
- source_word: יִקְדָּשׁ
  choice: wird heilig werden
  rationale: 'Die Verbform lässt sich hier resultativ beziehungsweise inchoativ verstehen: Durch die Berührung tritt Heiligkeit ein. Die Formulierung erhält zugleich den futurisch-normativen Ton der Anweisung.'
theological_decisions:
- issue: Wirkung der Berührung des Altars
  choice: Die Berührung des geheiligten Altars bewirkt, dass das Berührende heilig wird.
  alternative: Nur bereits geheiligte beziehungsweise dazu befugte Personen oder Gegenstände dürfen den Altar berühren.
  rationale: Die unmittelbare Satzfolge legt eine durch Berührung eintretende Heiligkeit nahe. Da die knappe hebräische Formulierung jedoch auch als kultische Zugangsvorschrift verstanden werden kann, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Schlüsselbegriffe werden beibehalten, aber unnötig altertümliche oder konfessionell geprägte Ausdrucksweisen vermieden. Die breite Referenz von כָּל הַנֹּגֵעַ und die Deutungsambivalenz von יִקְדָּשׁ bleiben erhalten.
