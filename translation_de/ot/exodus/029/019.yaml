  yaml_path: translation/ot/exodus/029/019.yaml
  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: de
  text: Dann sollst du den zweiten Widder nehmen. Aaron und seine Söhne sollen ihre Hände auf den Kopf des Widders legen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann sollst du … nehmen
  rationale: Das Qal-Perfekt mit וְ führt die Anweisungsfolge weiter und hat hier direktiven Sinn. „Dann“ gibt den Verfahrensfortschritt in natürlichem Deutsch wieder; „sollst du“ bewahrt den Anweisungscharakter.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: den zweiten Widder
  rationale: אַיִל bezeichnet einen Widder; הַשֵּׁנִי ist die Ordnungszahl „der zweite“ und verweist auf den zweiten Widder der Einsetzungszeremonie.
- source_word: וְסָמַךְ
  choice: sollen … legen
  rationale: סמך bezeichnet im Opferkontext das rituelle Auflegen beziehungsweise Aufstützen der Hand oder Hände. „Die Hände auf … legen“ ist im Deutschen klar und sachlich, ohne die Handlung zusätzlich zu deuten.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seine Söhne
  rationale: בָּנִים meint hier Aarons männliche Nachkommen, die zum Priesterdienst eingesetzt werden; „Söhne“ ist daher kontextuell genau.
- source_word: אֶת יְדֵיהֶם
  choice: ihre Hände
  rationale: Der hebräische Text verwendet ausdrücklich den Plural „ihre Hände“, der im Deutschen beibehalten wird.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: auf den Kopf des Widders
  rationale: Die räumliche Wendung wird unmittelbar und idiomatisch wiedergegeben. „Kopf“ steht wie im Hebräischen im Singular, da von einem einzelnen Tier die Rede ist.
theological_decisions:
- issue: Wiedergabe der Handauflegung ohne nachträgliche Deutung ihrer Symbolik
  choice: ihre Hände auf den Kopf des Widders legen
  alternative: ihre Hände auf den Kopf des Widders stützen
  rationale: Der Vers beschreibt nur die rituelle Handlung und erklärt ihre Bedeutung nicht. Die Formulierung vermeidet daher Aussagen über Schuldübertragung, Identifikation oder Ordination, die an dieser Stelle nicht ausdrücklich gemacht werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei Sätze vermeiden eine schwerfällige Satzverbindung und machen die aufeinanderfolgenden Anweisungen klar. Die direkte Anrede an Mose bleibt durch „du“ erhalten.
