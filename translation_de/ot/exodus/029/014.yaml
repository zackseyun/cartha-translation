  text: וְ/אֶת בְּשַׂ֤ר הַ/פָּר֙ וְ/אֶת עֹר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ תִּשְׂרֹ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה חַטָּ֖את הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: de
  text: Das Fleisch des Stieres aber, seine Haut und seinen Kot sollst du außerhalb des Lagers verbrennen. Es ist ein Sündopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reinigungsopfer“. Das hebräische Wort חַטָּאת kann „Sünde“ oder das im Zusammenhang mit Sünde dargebrachte Opfer bezeichnen. In Opfertexten wird es meist mit „Sündopfer“ wiedergegeben; „Reinigungsopfer“ hebt stärker die reinigende Funktion des Ritus hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: das Fleisch des Stieres
  rationale: „Fleisch“ gibt den konkreten körperlichen Sinn im Opferkontext direkt wieder; פַּר wird im modernen Deutschen natürlich mit „Stier“ übersetzt.
- source_word: עֹרוֹ
  choice: seine Haut
  rationale: „Haut“ ist die geläufige und genaue deutsche Bezeichnung für die Tierhaut; „Fell“ könnte fälschlich vor allem an die Behaarung denken lassen.
- source_word: פִּרְשׁוֹ
  choice: seinen Kot
  rationale: פֶּרֶשׁ bezeichnet Ausscheidung beziehungsweise Kot, nicht allgemein die Eingeweide oder Schlachtabfälle. Die direkte Wiedergabe vermeidet eine sachliche Abschwächung.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: sollst du … verbrennen
  rationale: Die Verbform hat in diesem Anweisungskontext verpflichtende Kraft. Im Deutschen enthält „verbrennen“ bereits das Mittel Feuer, sodass ein zusätzliches „mit Feuer“ unnötig schwerfällig wäre.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: außerhalb des Lagers
  rationale: Dies ist die klare und etablierte deutsche Wiedergabe für einen Ort jenseits der Grenzen des israelitischen Lagers.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Im kultischen Zusammenhang bezeichnet das Wort das mit Sünde verbundene Opfer. „Sündopfer“ ist im Deutschen verständlich und etabliert; die funktional deutende Alternative „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: וְאֶת … וְאֶת … וְאֶת
  choice: das Fleisch …, seine Haut und seinen Kot
  rationale: Die vollständige Aufzählung bleibt erhalten; natürliche deutsche Koordination vermeidet jedoch eine stilistisch unnötige Wiederholung von „und“.
theological_decisions:
- issue: Wiedergabe von חַטָּאת in der Opfergesetzgebung
  choice: Sündopfer
  alternative: Reinigungsopfer
  rationale: Der unmittelbare Zusammenhang verlangt die Bezeichnung eines Opfers, nicht nur den abstrakten Begriff „Sünde“. „Sündopfer“ wahrt den Zusammenhang mit Sünde und ist traditionell erkennbar; „Reinigungsopfer“ hebt stärker die reinigende Funktion des Ritus hervor und wird deshalb als echte lexikalisch-theologische Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzstellung mit nachgestelltem „aber“ bewahrt den kontrastierenden Anschluss des hebräischen וְ, ohne altertümlich zu wirken.
