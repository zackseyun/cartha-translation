  source_fidelity: Die rechtlich-kultische Zuweisung an Aaron und seine Söhne sowie die dreifache Wiederaufnahme von תְּרוּמָה sind grundsätzlich getroffen. Das anaphorische „Er“ ist jedoch in einem isoliert lesbaren deutschen Vers ohne klaren Bezugsgegenstand unnötig unklar. Die Schlussfügung wird mit Komma statt Gedankenstrich enger an die hebräische Apposition gebunden.
  naturalness: „Es soll … zustehen“ ist in diesem Zusammenhang klarer und idiomatischer als das unbegründete maskuline „Er soll … zustehen“. „Dauerhafte Ordnung“ gibt לְחָק עוֹלָם in modernem Standarddeutsch natürlicher wieder als „dauerhafte Bestimmung“.
  terminology: „Heilsopfer“ ist als kultischer Terminus vertretbar. Die Fußnote sollte die semantische Spannweite von שְׁלָמִים beschreiben, ohne „wiederhergestellte Gemeinschaft“ als festgelegte Bedeutung einzutragen. „Abgabe“ bleibt als konsistente Wiedergabe von תְּרוּמָה möglich, ist aber durch den Opferkontext als kultische Gabe zu verstehen.
