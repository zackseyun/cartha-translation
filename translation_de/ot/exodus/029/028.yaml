  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: de
  text: Es soll Aaron und seinen Söhnen von den Israeliten als dauerhafte Ordnung zustehen; denn es ist eine Abgabe. Es soll eine Abgabe von den Israeliten sein, von ihren Heilsopfern[a], ihre Abgabe für den HERRN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Friedensopfer“, „Gemeinschaftsopfer“ oder „Opfer des Wohlergehens“. Das hebräische Wort kann Frieden, Wohlergehen oder Unversehrtheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: Er soll Aaron und seinen Söhnen … zustehen
  rationale: Das wörtliche „er soll sein“ bezeichnet im rechtlich-kultischen Zusammenhang die Zuweisung des zuvor genannten Anteils. „Zustehen“ gibt diesen Sinn in natürlichem Deutsch wieder.
- source_word: לְחָק עוֹלָם
  choice: als dauerhafte Bestimmung
  rationale: חָק bezeichnet eine festgesetzte Regelung oder einen zustehenden Anteil; עוֹלָם meint hier eine bleibende, generationenübergreifende Geltung, ohne zwingend philosophische Endlosigkeit auszudrücken.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: von den Israeliten
  rationale: Dies ist die natürliche moderne Wiedergabe von „Söhne Israels“ und bezeichnet das Volk Israel.
- source_word: תְרוּמָה
  choice: Abgabe
  rationale: תְרוּמָה ist eine für Gott ausgesonderte und dargebrachte Gabe, häufig ein bestimmter Anteil. „Abgabe“ bewahrt hier den geregelten Charakter und lässt sich bei allen drei Vorkommen konsequent verwenden.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: von ihren Heilsopfern
  rationale: שְׁלָמִים bezeichnet eine Opferart, deren Wortfeld Heil, Wohlergehen, Frieden und Gemeinschaft umfasst. „Heilsopfer“ ist im Deutschen eine etablierte, knappe kultische Bezeichnung; die Bedeutungsbreite wird in der Fußnote offengelegt. זִבְחֵי wird nicht eigens mit „Schlachtopfer“ verdoppelt, da „Heilsopfer“ die Opferhandlung bereits bezeichnet.
- source_word: תְּרוּמָתָם לַיהוָה
  choice: ihre Abgabe für den HERRN
  rationale: Das Possessivsuffix wird mit „ihre“ wiedergegeben. לְ bezeichnet hier Bestimmung beziehungsweise Zugehörigkeit; „für“ ist idiomatisch. Der Gottesname יהוה erscheint entsprechend der deutschen Ehrfurchtstradition als „der HERR“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: „Der HERR“ folgt der verbreiteten jüdischen und christlichen Lesetradition. Die typografische Hervorhebung zeigt an, dass im hebräischen Text der Eigenname יהוה steht.
- issue: Bedeutungsbreite von שְׁלָמִים
  choice: Heilsopfer
  alternative: Friedensopfer / Gemeinschaftsopfer / Wohlergehensopfer
  rationale: Keine einzelne deutsche Bezeichnung erfasst das gesamte Wortfeld. „Heilsopfer“ wahrt einen etablierten kultischen Terminus, während die Fußnote die möglichen Aspekte von Frieden, Wohlergehen und Gemeinschaft nennt.
- issue: Referenz des maskulinen Pronomens in כִּי תְרוּמָה הוּא
  choice: er ist eine Abgabe
  alternative: es ist eine Abgabe
  rationale: Das maskuline הוּא greift wahrscheinlich den zuvor behandelten Opferanteil auf. Das maskuline Pronomen „er“ erhält diesen Rückbezug, ohne den nicht ausdrücklich wiederholten Gegenstand im Vers einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die dreifache Wiederaufnahme von תְרוּמָה wird durch „Abgabe“ bewahrt. Der Gedankenstrich gliedert die abschließende Apposition, ohne die syntaktische Mehrdeutigkeit unnötig aufzulösen.
