  yaml_path: translation/ot/exodus/029/006.yaml
  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: de
  text: Setze ihm den Turban auf den Kopf und setze das heilige Diadem[a] auf den Turban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heilige Krone“. Das hebräische Wort kann ein geweihtes, kronenartiges Würdezeichen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Setze … auf
  rationale: שׂים bedeutet „setzen, legen, anbringen“. In Verbindung mit einer Kopfbedeckung ist „jemandem etwas aufsetzen“ im Deutschen natürlich und gibt die zeremonielle Anweisung präzise wieder.
- source_word: הַמִּצְנֶפֶת
  choice: den Turban
  rationale: מִצְנֶפֶת bezeichnet die gewickelte priesterliche Kopfbedeckung. „Turban“ ist modern und anschaulich; „Mitra“ wäre kirchlich vorgeprägt und könnte irreführen.
- source_word: עַל רֹאשׁוֹ
  choice: ihm … auf den Kopf
  rationale: Die idiomatische deutsche Konstruktion bewahrt die konkrete Angabe, dass der Turban auf seinen Kopf gesetzt wird.
- source_word: וְנָתַתָּ
  choice: und bringe … an
  rationale: נתן kann „geben, setzen, anbringen“ bedeuten. Da das Diadem am Turban positioniert wird, ist „anbringen“ im Deutschen sachlich klar und vermeidet eine unnatürliche Wiederholung von „setzen“.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: das heilige Diadem
  rationale: נֵזֶר bezeichnet hier ein geweihtes, kronenartiges Würdezeichen. „Diadem“ wahrt den Bezug zu einem kostbaren Kopfschmuck, ohne an eine vollständige Königskrone denken zu lassen; הַקֹּדֶשׁ wird idiomatisch attributiv mit „heilig“ wiedergegeben.
- source_word: עַל הַמִּצְנָפֶת
  choice: am Turban
  rationale: עַל bezeichnet hier die Lage beziehungsweise Befestigung auf oder an der Kopfbedeckung. „Am Turban anbringen“ ist im modernen Deutschen natürlicher als „auf den Turban setzen“.
