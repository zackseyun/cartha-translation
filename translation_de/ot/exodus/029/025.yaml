base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: de
  text: Dann sollst du sie aus ihren Händen nehmen und sie auf dem Altar über dem Brandopfer in Rauch aufgehen lassen, zu einem wohlgefälligen Duft vor Jahwe. Es ist ein Feueropfer für Jahwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Feuergabe“. Der hebräische Opferbegriff bezeichnet eine Gabe, die auf dem Altar im Feuer dargebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann sollst du … nehmen
  rationale: Das mit וְ angeschlossene Perfekt führt die rituelle Anweisungsfolge fort. „Dann sollst du“ gibt sowohl den Ablauf als auch den verpflichtenden Charakter natürlich wieder.
- source_word: אֹתָם מִיָּדָם
  choice: sie aus ihren Händen
  rationale: Die Pronomen verweisen auf die zuvor in die Hände der Priester gelegten Opferteile. Die konkrete Handbewegung des Rituals bleibt erhalten.
- source_word: וְהִקְטַרְתָּ
  choice: in Rauch aufgehen lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen beziehungsweise Aufsteigenlassen als Rauch. Diese Wiedergabe bildet den kultischen Vorgang genauer ab als das allgemeinere „verbrennen“.
- source_word: הַמִּזְבֵּחָה
  choice: auf dem Altar
  rationale: Die Richtungsendung bezeichnet hier das Hinaufbringen auf den Altar; im Deutschen ist die Ortsangabe „auf dem Altar“ idiomatisch.
- source_word: עַל הָעֹלָה
  choice: auf dem Brandopfer
  rationale: עַל bezeichnet die Lage auf dem bereits dargebrachten Brandopfer. Die knappe Form bewahrt die räumliche Aussage, ohne zusätzliche Einzelheiten einzutragen.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: als wohlgefälligen Duft
  rationale: Die feste Opferformel bezeichnet einen Duft, der vor Gott Wohlgefallen findet. „Wohlgefälliger Duft“ erhält Bildsprache und kultische Bedeutung in würdigem, verständlichem Deutsch.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet Gegenwart beziehungsweise Ausrichtung vor Gott; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אִשֶּׁה
  choice: Feueropfer
  rationale: Der priesterliche Opferausdruck bezeichnet eine durch Feuer dargebrachte Gabe. „Feueropfer“ ist knapp, sachlich und im Deutschen verständlich; die alternative Deutung als „Feuergabe“ wird in der Fußnote sichtbar gehalten.
- source_word: הוּא לַיהוָה
  choice: Es ist … für Jahwe
  rationale: Das ausdrückliche Pronomen wird als eigener Nominalsatz wiedergegeben; לְ kennzeichnet die Bestimmung der Gabe für Jahwe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ wahrt seinen Charakter als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Opferbegriffs אִשֶּׁה
  choice: Feueropfer
  alternative: Feuergabe; Speisegabe
  rationale: Die genaue Herleitung und Nuance des kultischen Fachworts sind umstritten. „Feueropfer“ hält den klaren Zusammenhang mit dem Verbrennen fest, ohne die weitergehende Deutung als Nahrung Gottes in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Ritualsprache. Die Satzfolge bleibt nah am Hebräischen, wird jedoch durch „Dann sollst du“ und einen eigenständigen Schlusssatz natürlich lesbar gemacht.
