  text: שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧/ם הַ/כֹּהֵ֛ן תַּחְתָּ֖י/ו מִ/בָּנָ֑י/ו אֲשֶׁ֥ר יָבֹ֛א אֶל אֹ֥הֶל מוֹעֵ֖ד לְ/שָׁרֵ֥ת בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: de
  text: Sieben Tage lang soll der Priester aus dem Kreis seiner Söhne, der ihm nachfolgt,[a] sie tragen,[b] der in das Zelt der Begegnung hineingeht, um im Heiligtum Dienst zu tun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Priester an seiner Stelle aus dem Kreis seiner Söhne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie anziehen“. Das hebräische Verb kann je nach Zusammenhang sowohl das Anziehen als auch das Tragen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „im heiligen Bereich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Der Akkusativ der Zeitdauer wird im Deutschen natürlich durch „… Tage lang“ wiedergegeben.
- source_word: יִלְבָּשָׁם
  choice: sie tragen
  rationale: לבש kann sowohl das Anziehen als auch das Tragen von Kleidung bezeichnen. Im Zusammenhang einer siebentägigen Dauer ist „tragen“ im Deutschen am natürlichsten; „sie anziehen“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: der Priester aus dem Kreis seiner Söhne, der ihm nachfolgt
  rationale: תחתיו bezeichnet hier die Amtsnachfolge, während מבניו die Auswahl aus seinen Söhnen ausdrückt. Die Formulierung gibt beides verständlich wieder, ohne über den Text hinauszugehen.
- source_word: אֲשֶׁר יָבֹא
  choice: wenn er … kommt
  rationale: Der formal relative Ausdruck erhält in diesem Zusammenhang einen zeitlich-situativen Sinn und lässt sich so idiomatisch mit dem folgenden Dienstzweck verbinden.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung bewahrt die Bedeutung des feststehenden hebräischen Namens für das Heiligtumszelt in natürlichem, gegenwärtigem Deutsch.
- source_word: לְשָׁרֵת
  choice: um … Dienst zu tun
  rationale: Die Formulierung bezeichnet den geregelten priesterlichen Dienst und vermeidet die im modernen Deutsch mögliche soziale Nebenbedeutung von „dienen“.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: קֹדֶשׁ kann hier den heiligen Bereich beziehungsweise das Heiligtum bezeichnen. „Im Heiligtum“ ist idiomatisch und wahrt den konkreten kultischen Ortsbezug.
theological_decisions:
- issue: Priesterliche Amtsnachfolge
  choice: der Priester aus dem Kreis seiner Söhne, der ihm nachfolgt
  alternative: der Priester von seinen Söhnen an seiner Stelle
  rationale: Der Zusammenhang spricht von der Nachfolge im priesterlichen Amt. Die Übersetzung macht dies verständlich, ohne spätere Aussagen über Amts- oder Erbfolgelehren einzutragen.
- issue: Bedeutung von בַּקֹּדֶשׁ
  choice: im Heiligtum
  alternative: im Heiligen
  rationale: Beide Wiedergaben sind sprachlich möglich. „Im Heiligtum“ bezeichnet den konkreten heiligen Dienstbereich klar, legt aber keine über den Kontext hinausgehende Unterteilung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gut verständlich, bewahrt aber die kultische Terminologie und die Mehrdeutigkeit des hebräischen Verbs לבש sowie von בַּקֹּדֶשׁ.
