base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: de
  text: Dann sollst du die Gewänder nehmen und Aaron das Untergewand, das Obergewand des Efods, den Efod und das Bruststück[a] anlegen. Den Efod sollst du ihm mit dem kunstvoll gewebten Band des Efods befestigen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Brustschild“. Das hebräische Wort bezeichnet ein auf der Brust getragenes Stück und muss keinen Rüstungsteil meinen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Den Efod sollst du ihm mit dem kunstvoll gewebten Band des Efods umgürten.“ Das hebräische Verb ist selten und kann das Anlegen, Umgürten oder Befestigen des Efods bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: Dann sollst du die Gewänder nehmen
  rationale: Das mit וְ eingeleitete Perfekt setzt die Folge der Anweisungen fort. „Dann“ gibt diesen Verfahrensschritt im Deutschen natürlich wieder; „Gewänder“ ist würdig und vermeidet die kirchengeschichtlich geprägte Bezeichnung „Ornate“.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: Aaron … anlegen
  rationale: Der Hifil von לבש bezeichnet das Bekleiden einer anderen Person. Die deutsche Konstruktion „Aaron … anlegen“ gibt den kausativen Sinn idiomatisch wieder.
- source_word: הַכֻּתֹּנֶת
  choice: das Untergewand
  rationale: כֻּתֹּנֶת bezeichnet hier das körpernah getragene Grundgewand. „Untergewand“ ist im Zusammenhang verständlicher als das historisierende „Leibrock“ und sachlich genauer als das allgemeinere „Gewand“.
- source_word: מְעִיל הָאֵפֹד
  choice: das Obergewand des Efods
  rationale: Die Status-constructus-Verbindung bezeichnet das zum Efod gehörende Obergewand. Die Genitivform wahrt die knappe Zuordnung des Hebräischen, ohne ausdrücklich festzulegen, dass es darunter getragen wurde.
- source_word: הָאֵפֹד
  choice: der Efod
  rationale: אֵפֹד ist die Fachbezeichnung für ein besonderes priesterliches Kleidungsstück ohne genaues modernes Gegenstück. Daher wird das Wort in der etablierten deutschen Form transliteriert.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: חֹשֶׁן bezeichnet das am Efod angebrachte Stück auf der Brust. „Brusttasche“ vermeidet die irreführende Vorstellung eines Rüstungsteils, die „Brustschild“ hervorrufen kann, lässt die genaue Bauart aber nicht unnötig festlegen.
- source_word: וְאָפַדְתָּ לוֹ
  choice: Den Efod sollst du ihm … befestigen
  rationale: Das seltene, mit אֵפֹד verwandte Verb beschreibt hier das Anlegen beziehungsweise Festmachen des Efods. Das ausdrücklich wiederholte „den Efod“ macht den im Hebräischen nur aus dem Zusammenhang erschließbaren Bezug im Deutschen klar.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: mit dessen gewebtem Gürtel
  rationale: חֵשֶׁב bezeichnet in diesem Zusammenhang das zum Efod gehörende, gewebte Band beziehungsweise den Gürtel. „Dessen“ stellt den Bezug zum Efod eindeutig und ohne schwerfällige Wiederholung her.
