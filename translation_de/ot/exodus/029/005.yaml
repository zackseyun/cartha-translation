translation_notes:
  register: Moderne, würdige Standardsprache mit verständlichen Bezeichnungen für die priesterlichen Gewänder. Der technische Ausdruck „Efod“ bleibt erhalten. Die zweite Satzhälfte wurde als eigener Satz gestaltet, damit der Bezug des seltenen Verbs auf den Efod im Deutschen klar bleibt, ohne seine lexikalische Unschärfe in der Fußnote zu verdecken.
