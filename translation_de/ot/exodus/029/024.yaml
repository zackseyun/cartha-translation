  variant: modern standard German
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: de
  text: Lege das alles auf die Handflächen Aarons und auf die Handflächen seiner Söhne[a] und schwinge sie als Schwingopfer vor Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf die Handflächen Aarons und auf die Handflächen seiner Söhne«; manche Übersetzungen geben allgemeiner »in die Hände« wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Lege
  rationale: Das Qal-Perfekt mit וְ setzt die Anweisungsfolge fort und wird im Deutschen natürlich als Imperativ wiedergegeben.
- source_word: הַכֹּל
  choice: das alles
  rationale: Der Ausdruck verweist zusammenfassend auf die zuvor genannten Opferteile.
- source_word: עַל כַּפֵּי
  choice: auf die Handflächen
  rationale: כַּף bezeichnet hier konkret die Handfläche; die Wiedergabe bewahrt das anschauliche Ritualbild.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Etablierte deutsche Namensform.
- source_word: בָנָיו
  choice: seiner Söhne
  rationale: Im Kontext sind Aarons männliche Nachkommen gemeint, die zum Priesterdienst eingesetzt werden.
- source_word: וְהֵנַפְתָּ
  choice: und schwinge
  rationale: Der Hifil von נוף bezeichnet im Opferkontext die rituelle Schwingbewegung beziehungsweise Darbringung.
- source_word: אֹתָם
  choice: es
  rationale: Das hebräische maskuline Pluralpronomen bezieht sich auf mehrere Opferteile; idiomatisches Deutsch kann diese als die zuvor mit »das alles« bezeichnete Gesamtgabe mit Singularpronomen wieder aufnehmen.
- source_word: תְּנוּפָה
  choice: als Schwingopfer
  rationale: »Schwingopfer« ist der etablierte deutsche Kultterminus und bezeichnet Art beziehungsweise Ergebnis der rituellen Handlung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי wird im Opferkontext natürlich mit »vor« wiedergegeben; der Gottesname wird als »Jahwe« dargestellt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den offenbarten Eigennamen in der im Deutschen üblichen wissenschaftlichen Form wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verständnis von תְּנוּפָה
  choice: Schwingopfer
  alternative: Darbringungsopfer; Hebopfer
  rationale: Die traditionelle kultische Bezeichnung bewahrt den Bezug zur durch נוף bezeichneten rituellen Präsentationsbewegung; »Hebopfer« könnte diese mit einem anderen Opferterminus vermischen.
translation_notes:
  register: Moderner, würdevoller Anweisungsstil. Der Imperativ entspricht einer deutschen Ritualanweisung. »Handflächen« bewahrt die konkrete Körperbezeichnung des Hebräischen; »Schwingopfer« hält den etablierten kultischen Wortschatz fest.
