base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/008.yaml
  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: de
  text: Und seine Söhne sollst du herbeibringen und sie mit Tuniken bekleiden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Söhne vorführen“ oder „präsentieren“. Das hebräische Verb kann hier das Herbeibringen zur rituellen Präsentation bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Dann
  rationale: Die Konjunktion führt zusammen mit dem unübersetzten Akkusativzeichen den nächsten koordinierten Auftrag ein; im Deutschen gibt „Dann“ die Abfolge natürlich wieder.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das Substantiv bezeichnet hier ausdrücklich Aarons männliche Nachkommen, die für den Priesterdienst eingesetzt werden.
- source_word: תַּקְרִיב
  choice: sollst du … herantreten lassen
  rationale: Der Hifil von קרב bedeutet „nahebringen“ beziehungsweise im kultischen Zusammenhang „vorführen/präsentieren“. „Herantreten lassen“ ist idiomatisches Deutsch und bewahrt sowohl die räumliche als auch die rituelle Nuance.
- source_word: וְהִלְבַּשְׁתָּם
  choice: und ihnen … anziehen
  rationale: Die Konstruktion bedeutet, jemanden zu bekleiden. „Ihnen … anziehen“ klingt im modernen Deutschen natürlicher als „sie bekleiden“ und passt zum genannten Kleidungsstück.
- source_word: כֻּתֳּנֹת
  choice: Untergewänder
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes Gewand. Im Kontext der priesterlichen Kleidung unterscheidet „Untergewänder“ dieses Kleidungsstück treffend von Mantel, Obergewand und Robe, ohne ein im Deutschen historisch missverständliches „Tuniken“ zu erzwingen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anweisungsform „sollst du“ erhält den verbindlichen Charakter. „Herantreten lassen“ bewahrt die kultische Bedeutung, während die Fußnote die mögliche Wiedergabe als rituelles Vorführen nennt.
