  text: And you shall slaughter the ram, and take its blood and throw it against the altar all around.
translation:
  language: de
  text: Dann sollst du den Widder schlachten, sein Blut nehmen und ringsum an den Altar sprengen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Dann sollst du … schlachten
  rationale: Das Verb bezeichnet das rituelle Schlachten; die deutsche Soll-Form gibt die Anweisung im Kontext natürlich wieder.
- source_word: הָאָיִל
  choice: den Widder
  rationale: אָיִל bezeichnet hier eindeutig den männlichen Schafbock.
- source_word: וְזָרַקְתָּ
  choice: sprengen
  rationale: זָרַק bezeichnet beim Opferdienst das gezielte Ausbringen des Blutes an den Altar. „Sprengen“ ist im Deutschen präziser und idiomatischer als das missverständliche „werfen“.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: ringsum an den Altar
  rationale: עַל kann hier den Zielkontakt mit dem Altar ausdrücken; סָבִיב verlangt eine Verteilung rings um ihn beziehungsweise an seinen Seiten.
theological_decisions:
- issue: Art der Blutapplikation
  choice: das Blut „ringsum an den Altar sprengen“
  alternative: das Blut „rings um den Altar gießen/werfen“
  rationale: Die Formulierung wahrt die kultische Handlung, ohne eine später konfessionell geprägte Deutung einzutragen. Sie lässt offen, auf welche einzelnen Flächen oder Seiten das Blut gelangt.
translation_notes:
  register: Moderne, würdevolle und gut verständliche Anweisungssprache. Die Satzfolge bleibt nah am Hebräischen, während „sprengen“ die kultische Handlung im Deutschen natürlich bezeichnet.
