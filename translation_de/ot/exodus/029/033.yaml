base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: de
  text: Sie sollen die Speisen essen, mit denen Sühne erwirkt wurde, um sie zum Priesterdienst einzusetzen[a] und sie zu heiligen. Doch kein Unbefugter[b] darf davon essen, denn sie sind heilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihre Hand zu füllen«; eine hebräische Wendung für die Einsetzung von Priestern in ihren Dienst.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist hier jemand, der nicht zur Teilnahme am priesterlichen Ritus berechtigt ist, nicht notwendig ein Fremder anderer Herkunft.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Sie sollen die Speisen essen
  rationale: Das Präfixverb mit וְ hat im Ablauf der Ritualanweisungen auffordernden Charakter. אֹתָם verweist auf die zuvor genannten Opferanteile; »die Speisen« macht diesen Bezug im Deutschen verständlich, ohne einen neuen Sachinhalt einzuführen.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: durch die Sühne vollzogen wurde
  rationale: Das passive כֻּפַּר mit בּ bezeichnet hier die Mittel, durch die der Sühnevorgang vollzogen wurde. Die hebräische Klausel nennt an dieser Stelle nicht ausdrücklich die Begünstigten; daher wird kein »für sie« ergänzt.
- source_word: לְמַלֵּא אֶת יָדָם
  choice: um sie in das Priesteramt einzusetzen
  rationale: Wörtlich »ihre Hand zu füllen«; im priesterlichen Ritual ist dies eine feste Wendung für die Einsetzung in den Dienst. Die Wiedergabe erschließt die Funktion, ohne eine spätere konfessionelle Amtsauffassung einzutragen.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: und sie zu heiligen
  rationale: קדשׁ bezeichnet hier die Aussonderung für den heiligen Dienst. »Heiligen« bewahrt sowohl den kultischen Sinn als auch die Verbindung zum abschließenden קֹדֶשׁ.
- source_word: וְזָר
  choice: Doch kein Unbefugter
  rationale: זָר bezeichnet im kultischen Zusammenhang eine Person außerhalb des zugelassenen Kreises, nicht notwendig einen ethnischen Fremden. »Unbefugter« gibt die rituelle Nichtberechtigung präzise wieder.
- source_word: לֹא יֹאכַל
  choice: darf davon essen
  rationale: Die verneinte Verbform drückt ein Verbot aus. »Davon« nimmt die zuvor genannten Speisen idiomatisch wieder auf.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: denn sie sind heilig
  rationale: Die Klausel begründet das Verbot; »heilig« bewahrt den gewichtigen priesterlichen Sprachgebrauch.
theological_decisions:
- issue: Bedeutung von כפר im Opferzusammenhang
  choice: Sühne vollzogen wurde
  alternative: Entsühnung bewirkt wurde / Versöhnung erwirkt wurde
  rationale: »Sühne« ist im Deutschen ein verständlicher und traditionsfähiger Oberbegriff für den kultischen Vorgang. »Entsühnung« wäre enger und technischer, während »Versöhnung« den Vorgang stärker relational deutet, als der Ausdruck hier allein festlegt.
- issue: Bezug von בָהֶם in אֲשֶׁר כֻּפַּר בָּהֶם
  choice: durch die [Speisen]
  alternative: mit denen / durch die für sie Sühne vollzogen wurde
  rationale: Das בּ wird instrumental wiedergegeben und bezieht sich auf die Opferanteile. Ein Begünstigter der Sühne ist in dieser Klausel nicht ausdrücklich markiert; der priesterliche Kontext legt ihn zwar nahe, doch die Übersetzung ergänzt ihn nicht.
- issue: Priesterliche Wendung מִלֵּא יָד
  choice: in das Priesteramt einsetzen
  alternative: ihre Hand füllen / sie zum Dienst einsetzen
  rationale: Die Wendung ist ein technischer Ausdruck für die priesterliche Amtseinsetzung. Die funktionale Wiedergabe vermittelt den Kontext, während die Fußnote die wörtliche Bildsprache erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer kultischer Terminologie. »Sie sollen« bildet den anweisenden Charakter ab; »Sühne«, »heiligen« und »heilig« bewahren das priesterlich-theologische Register. Die Satzgliederung in zwei Sätze verbessert die Lesbarkeit, ohne die argumentative Verbindung aufzulösen.
