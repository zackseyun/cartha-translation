translation:
  language: de
  text: Dann zerlege den Widder in seine Stücke, wasche seine Eingeweide und seine Beine und lege sie auf seine Stücke und auf seinen Kopf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und lege sie zu seinen Stücken und zu seinem Kopf“. Das hebräische עַל bedeutet gewöhnlich „auf“, kann hier aber das gemeinsame Anordnen der gewaschenen Teile mit den übrigen Teilen des Opfertiers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַיִל
  choice: den Widder
  rationale: אַיִל bezeichnet im Opferkontext einen männlichen Schafbock; „Widder“ ist die natürliche und sachlich genaue deutsche Bezeichnung.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: zerlege ... in seine Stücke
  rationale: Das Piel von נתח bezeichnet das Zerlegen eines Opfertiers in einzelne Stücke. Die Formulierung gibt den Verfahrensschritt klar wieder.
- source_word: קִרְבּוֹ
  choice: seine Eingeweide
  rationale: קֶרֶב kann allgemein das Innere bezeichnen, meint in Opferanweisungen jedoch konkret die inneren Organe beziehungsweise Eingeweide, die gewaschen werden.
- source_word: כְרָעָיו
  choice: seine Unterschenkel
  rationale: כְּרָעַיִם bezeichnet bei einem Tier besonders die unteren Abschnitte der Beine. „Unterschenkel“ ist genauer als das allgemeinere „Beine“ und bleibt verständlich.
- source_word: וְנָתַתָּ עַל
  choice: lege sie auf
  rationale: עַל bedeutet zunächst „auf“. Die formnahe Wiedergabe bewahrt die räumliche Aussage des Hebräischen, auch wenn im Opferablauf möglicherweise ein gemeinsames Anordnen gemeint ist.
- source_word: רֹאשׁוֹ
  choice: seinen Kopf
  rationale: Direkte und natürliche Wiedergabe des anatomischen Ausdrucks.
- source_word: וְ
  choice: Dann / und
  rationale: Das erste Waw wird als „Dann“ wiedergegeben, um die Abfolge der Anweisungen auszudrücken; die weiteren Verknüpfungen erscheinen natürlich als „und“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Verfahrenssprache. „Zerlege“ ist idiomatischer als „schneide“, „Unterschenkel“ präzisiert den anatomischen Ausdruck. Die mögliche Bedeutungsweite von עַל wird in der Fußnote offengehalten.
