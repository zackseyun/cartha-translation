id: EXO.29.23
reference: Exodus 29:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: de
  text: und einen Laib Brot, einen Brotkuchen mit Öl und einen dünnen Fladen aus dem Korb mit den ungesäuerten Broten, der vor Jahwe[a] steht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit »der HERR« wiedergegeben.'
    reason: Erläuterung zur Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: Laib Brot
  rationale: כִּכָּר bezeichnet hier einen runden Laib oder brotartigen Kuchen. »Laib Brot« ist im modernen Deutsch natürlich und unterscheidet diesen Gegenstand vom folgenden חַלָּה.
- source_word: אַחַת / אֶחָד
  choice: einen
  rationale: Die jeweils gesetzte Zahl »eins« wird bei allen drei Backwaren wiedergegeben, um die rituelle Genauigkeit des Textes zu bewahren.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: Brotkuchen mit Öl
  rationale: Die knappe hebräische Wortverbindung bezeichnet einen Brotkuchen, der mit Öl zubereitet ist. »Mit Öl« bleibt nahe am Wortlaut, ohne eine bestimmte Zubereitungsweise wie Einmischen ausdrücklich festzulegen.
- source_word: רָקִיק
  choice: dünner Fladen
  rationale: רָקִיק bezeichnet ein dünnes Gebäck. »Dünner Fladen« gibt die Form verständlich wieder und vermeidet die im Deutschen möglicherweise irreführende Vorstellung einer modernen Waffel.
- source_word: מִסַּל הַמַּצּוֹת
  choice: aus dem Korb mit den ungesäuerten Broten
  rationale: מִן bezeichnet die Herkunft aus dem Korb; מַצּוֹת wird als Sammelbezeichnung für ungesäuerte Brote wiedergegeben.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: der vor Jahwe steht
  rationale: Das Relativpronomen bezieht sich grammatisch auf den Korb. »Vor« bewahrt den räumlich-kultischen Sinn von לִפְנֵי; »steht« ergibt im Deutschen einen natürlichen Satz, ohne die Aufstellung als eigenen Handlungsschritt auszuführen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname JHWH. »Jahwe« bewahrt ihn als Namen; die traditionelle Ersetzung durch »der HERR« bleibt als bekannte Alternative in der Fußnote erkennbar.
- issue: Art der Zubereitung des Brotkuchens mit Öl
  choice: mit Öl
  alternative: mit Öl vermischt
  rationale: Die hebräische Wortfolge nennt Brot und Öl, legt aber die genaue Zubereitungsweise hier nicht ausdrücklich fest. Daher wird die mögliche Bedeutung »vermischt« nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Einzahl bleibt zur Wahrung der rituellen Präzision erhalten. Der Vers beginnt entsprechend dem hebräischen Anschluss mit »und«.
