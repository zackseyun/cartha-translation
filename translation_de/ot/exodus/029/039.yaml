source:
  edition: WLC
  text: אֶת הַ/כֶּ֥בֶשׂ הָ/אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: de
  text: Das eine Lamm sollst du am Morgen darbringen, und das zweite Lamm sollst du zwischen den Abenden[a] darbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zwischen den Abenden“; ein traditioneller hebräischer Ausdruck, der häufig als „in der Abenddämmerung“ oder als die Zeit zwischen dem späten Nachmittag und dem Sonnenuntergang verstanden wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: Lamm
  rationale: Im Opferkontext bezeichnet כֶּבֶשׂ ein junges Schaf beziehungsweise Lamm, das als Opfer dargebracht wird. „Lamm“ ist hier die natürliche und präzise deutsche Wiedergabe.
- source_word: הָאֶחָד
  choice: das eine
  rationale: Die Formulierung gibt das hebräische „das eine“ direkt wieder und bildet zusammen mit „das zweite“ eine klare Abfolge.
- source_word: תַּעֲשֶׂה
  choice: sollst du darbringen
  rationale: Obwohl עשה wörtlich „machen“ oder „tun“ bedeutet, bezeichnet es in dieser Opferanweisung das Vollziehen beziehungsweise Darbringen des Opfers. „Darbringen“ gibt den kultischen Sinn idiomatisch wieder.
- source_word: בַבֹּקֶר
  choice: am Morgen
  rationale: Dies ist die natürliche deutsche Wiedergabe der Zeitangabe.
- source_word: הַשֵּׁנִי
  choice: das zweite
  rationale: Die Ordinalzahl wird direkt wiedergegeben und wahrt die Abfolge der beiden täglichen Opfer.
- source_word: בֵּין הָעַרְבָּיִם
  choice: zwischen den Abenden
  rationale: Die wörtliche Formulierung bewahrt die echte sprachliche und zeitliche Mehrdeutigkeit des traditionellen hebräischen Ausdrucks; eine verständlichere Deutungsmöglichkeit wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Hebräischen bleibt erhalten; der fachlich-kultische Sinn von תַּעֲשֶׂה wird mit „darbringen“ ausgedrückt. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Wendung.
