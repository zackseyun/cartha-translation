base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: de
  text: Du sollst Aaron und seinen Söhnen Gürtel umbinden und ihnen Kopfbedeckungen aufsetzen. Das Priesteramt soll ihnen als dauerhafte Ordnung zustehen. So sollst du Aaron und seine Söhne in ihr Amt einsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Hand Aarons und die Hand seiner Söhne füllen“; eine hebräische Wendung für die Einsetzung in den priesterlichen Dienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: Gürtel umbinden
  rationale: חגר bezeichnet hier das Anlegen beziehungsweise Befestigen des priesterlichen Gürtels. „Gürtel umbinden“ ist im heutigen Deutsch klar und gibt die konkrete Handlung wieder.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Aaron und seinen Söhnen
  rationale: Die Namen erklären unmittelbar, auf wen sich das vorangehende Objektpronomen im Hebräischen bezieht. Im Deutschen ist die direkte Einbindung ohne zusätzliches „ihnen“ natürlicher.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: ihnen Kopfbedeckungen aufsetzen
  rationale: חבש beschreibt das Anlegen beziehungsweise Befestigen am Kopf; מִגְבָּעוֹת bezeichnet die Kopfbedeckungen der Priester, die von Aarons besonderem Kopfbund unterschieden sind. „Kopfbedeckungen“ bleibt verständlich und legt die genaue Form nicht unnötig fest.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Das Priesteramt soll ihnen ... zustehen
  rationale: כְּהֻנָּה bezeichnet hier den priesterlichen Dienst beziehungsweise das Priesteramt. „Ihnen zustehen“ gibt die hebräische Besitz- und Zuweisungskonstruktion idiomatisch wieder.
- source_word: לְחֻקַּת עוֹלָם
  choice: als dauerhafte Ordnung
  rationale: חֻקָּה ist eine festgesetzte Ordnung; עוֹלָם bezeichnet in diesem kultisch-rechtlichen Zusammenhang bleibende, unabsehbare Dauer. „Dauerhaft“ bewahrt diese Kraft, ohne ausdrücklich eine philosophisch absolute Ewigkeit festzulegen.
- source_word: וּמִלֵּאתָ יַד
  choice: in ihr Amt einsetzen
  rationale: „Die Hand füllen“ ist eine technische hebräische Wendung für die Einsetzung in den priesterlichen Dienst. Die gewählte Formulierung vermittelt die Funktion im modernen Deutschen; die wörtliche Wendung wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Dauerformel לְחֻקַּת עוֹלָם
  choice: als dauerhafte Ordnung
  alternative: als ewige Ordnung
  rationale: Die Formulierung bezeichnet die bleibende Geltung der priesterlichen Ordnung im gegebenen Bundes- und Kultzusammenhang. „Dauerhaft“ wahrt diesen Sinn, ohne spätere theologische Folgerungen über absolute Zeitlosigkeit in den Vers einzutragen.
- issue: Einsetzungsformel וּמִלֵּאתָ יַד
  choice: Aaron und seine Söhne in ihr Amt einsetzen
  alternative: die Hand Aarons und die Hand seiner Söhne füllen
  rationale: Die Wendung ist ein kultischer Fachausdruck für die Einsetzung in den Priesterdienst. Eine verständliche Wiedergabe steht im Haupttext; das konkrete hebräische Bild bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber der hebräischen Apposition leicht geglättet. „Kopfbedeckungen“ vermeidet sowohl das missverständliche „Turban“ als auch altertümliche oder regional gefärbte Bezeichnungen; die technische Einsetzungsformel wird transparent in einer Fußnote erhalten.
