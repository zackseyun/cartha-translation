id: EXO.29.34
reference: Exodus 29:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: de
  text: Wenn aber von dem Fleisch des Einweihungsopfers[a] oder von dem Brot bis zum Morgen etwas übrig bleibt, sollst du das Übriggebliebene im Feuer verbrennen. Es darf nicht gegessen werden, denn es ist heilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Opfer der Priesterweihe“. Der hebräische Ausdruck bezeichnet das Ritual, durch das die Priester in ihren Dienst eingesetzt und geheiligt wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: etwas übrig bleibt
  rationale: Das Nifal von יתר bezeichnet etwas, das zurück- oder übrigbleibt. Die deutsche Formulierung gibt den passiven Sinn natürlich wieder.
- source_word: בְּשַׂר
  choice: Fleisch
  rationale: Die konkrete kultische Bezeichnung wird im Deutschen unmittelbar und verständlich wiedergegeben.
- source_word: הַמִּלֻּאִים
  choice: Einweihungsopfer
  rationale: Im priesterlichen Kontext bezeichnet מִלֻּאִים die Einsetzung beziehungsweise Weihe der Priester. „Einweihungsopfer“ ist verständlich und bewahrt den rituellen Bezug; „Opfer“ ergibt sich aus dem Zusammenhang mit dem Opferfleisch.
- source_word: לֶּחֶם
  choice: Brot
  rationale: Direkte und natürliche Entsprechung.
- source_word: עַד הַבֹּקֶר
  choice: bis zum Morgen
  rationale: Bewahrt die durch עַד bezeichnete zeitliche Grenze.
- source_word: וְשָׂרַפְתָּ
  choice: sollst du … verbrennen
  rationale: Das Waw mit Perfekt bildet den Folgesatz der Bedingung. „Sollst“ wahrt den verbindlichen Rechtston, ohne im Deutschen schwerfällig zu wirken.
- source_word: הַנּוֹתָר
  choice: das Übriggebliebene
  rationale: Das substantivierte Partizip bezeichnet umfassend alles, was vom Fleisch oder Brot übrig geblieben ist.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Wendung gibt das Verbrennen durch Feuer idiomatisch und quellennah wieder.
- source_word: לֹא יֵאָכֵל
  choice: Es darf nicht gegessen werden
  rationale: Das passive Imperfekt hat hier verbietenden Sinn. „Darf nicht“ ist im heutigen Deutsch klar und behält die Passivform bei.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: „Heilig“ bewahrt die kultische und theologische Aussage des hebräischen Begriffs.
theological_decisions:
- issue: Wiedergabe des kultischen Ausdrucks הַמִּלֻּאִים bei der Einsetzung der Priester
  choice: Einweihungsopfer
  alternative: Opfer der Priesterweihe; Einsetzungsopfer
  rationale: Der Ausdruck bezieht sich auf das Ritual, durch das Aaron und seine Söhne in den Priesterdienst eingesetzt und geheiligt werden. „Einweihungsopfer“ ist im modernen Deutsch verständlich, ohne eine spätere konfessionelle Amtslehre in den Text einzutragen; die mögliche Nuance der Priesterweihe wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarem Rechtston. Die Bedingung und ihre Folge werden natürlich verbunden; die kultische Terminologie bleibt erkennbar, wird aber nicht unnötig archaisiert.
