  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: de
  text: Und jeden Tag sollst du einen Stier als Sündopfer zur Sühne darbringen.[a] Du sollst den Altar reinigen, wenn du an ihm Sühne vollziehst, und ihn salben, um ihn zu weihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Stier als Reinigungsopfer“. Das hebräische Wort חַטָּאת kann „Sünde“ bedeuten und bezeichnet im Opferkontext das Opfer, das der Reinigung von Sünde oder Unreinheit dient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: Stier
  rationale: פַר bezeichnet einen Stier; eine ausdrückliche Altersangabe wie „junger Stier“ ist hier nicht erforderlich.
- source_word: חַטָּאת
  choice: Sündopfer
  rationale: Im Opferkontext bezeichnet חַטָּאת das mit Sünde und ritueller Reinigung verbundene Opfer. „Sündopfer“ ist im Deutschen etabliert; die mögliche funktionale Wiedergabe „Reinigungsopfer“ wird in der Fußnote bewahrt.
- source_word: לַיּוֹם
  choice: jeden Tag
  rationale: Im Zusammenhang des wiederholten Weiherituals hat die Wendung distributiven Sinn.
- source_word: עַל הַכִּפֻּרִים
  choice: zur Sühne
  rationale: Der hebräische Plural verweist auf Sühnehandlungen beziehungsweise Entsühnungsriten; der deutsche Singular als Abstraktum ist idiomatisch.
- source_word: וְחִטֵּאתָ
  choice: du sollst entsündigen
  rationale: Das Piel von חטא bezeichnet hier die kultische Reinigung eines heiligen Gegenstands. „Entsündigen“ hält die Verbindung zu חַטָּאת sichtbar und vermeidet die Vorstellung, dem Altar werde moralisch vergeben.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Standardwiedergabe von מִזְבֵּחַ im Heiligtumskontext.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: indem du für ihn Sühne vollziehst
  rationale: בְּ mit Infinitiv kann temporal oder instrumental verstanden werden. „Indem“ gibt hier die naheliegende instrumentale Beziehung wieder; das Suffix bezieht sich am natürlichsten auf den Altar.
- source_word: וּמָשַׁחְתָּ
  choice: und ihn salben
  rationale: משׁח ist der übliche Ausdruck für die Salbung mit Öl zur Weihe.
- source_word: לְקַדְּשׁוֹ
  choice: um ihn zu heiligen
  rationale: קדשׁ bezeichnet hier das Aussondern für den heiligen Gebrauch. „Heiligen“ bewahrt die zentrale Wortfamilie und ist in diesem Zusammenhang verständlich.
theological_decisions:
- issue: Kultische Reinigung und Sühne ohne spätere Lehrsysteme in den Text einzutragen
  choice: „Sündopfer“, „entsündigen“ und „Sühne vollziehen“ werden im Sinn des Heiligtumsrituals verwendet.
  alternative: חַטָּאת als „Reinigungsopfer“ und וְחִטֵּאתָ als „reinigen“ wiedergeben.
  rationale: Der Altar wird kultisch gereinigt und geheiligt, nicht als moralisch schuldiges Wesen behandelt. Die gewählte Fassung bewahrt zugleich die hebräische Wortverbindung zwischen Opfer und Reinigung.
- issue: Beziehung von בְּכַפֶּרְךָ עָלָיו zur Entsündigung des Altars
  choice: 'Instrumental: „indem du für ihn Sühne vollziehst“.'
  alternative: 'Temporal: „wenn du für ihn Sühne vollziehst“.'
  rationale: Beides ist grammatisch möglich. Der instrumentale Sinn beschreibt prägnant, wodurch die kultische Entsündigung erfolgt, ohne die alternative zeitliche Nuance grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kultischen Fachwörter „Sündopfer“, „Sühne“, „entsündigen“, „salben“ und „heiligen“ bewahren die Zusammenhänge des hebräischen Textes; „entsündigen“ ist bewusst gewählt, obwohl es im Alltagsdeutsch selten ist, weil es die rituelle Handlung genauer bezeichnet als eine rein allgemeine „Reinigung“.
