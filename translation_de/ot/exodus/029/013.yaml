base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: de
  text: Dann nimm das ganze Fett, das die Eingeweide bedeckt, den Leberlappen[a], die beiden Nieren und das Fett auf ihnen und lass alles auf dem Altar in Rauch aufgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Fortsatz an der Leber“. Der hebräische Ausdruck bezeichnet einen bestimmten Teil, der mit der Leber verbunden ist; seine genaue anatomische Bestimmung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann nimm
  rationale: Das Qal-Perfekt mit וְ setzt die Anweisungsfolge fort und hat hier befehlenden Sinn. Der deutsche Imperativ ist natürlich und bewahrt den prozeduralen Charakter.
- source_word: כָּל הַחֵלֶב
  choice: das ganze Fett
  rationale: חֵלֶב bezeichnet hier die für das Opfer bestimmten Fettteile. „Fett“ ist im modernen Deutsch klarer und geläufiger als das fachsprachliche „Talg“.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: das die Eingeweide bedeckt
  rationale: קֶרֶב bezeichnet in diesem Opferkontext das Innere beziehungsweise die inneren Organe des Tieres; „Eingeweide“ ist konkret und idiomatisch.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: den Leberlappen[a]
  rationale: Der Ausdruck bezeichnet einen bestimmten, mit der Leber verbundenen Teil, dessen genaue moderne anatomische Zuordnung unsicher ist. „Leberlappen“ ist verständlich und etabliert; die Fußnote bewahrt die Unsicherheit.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: die beiden Nieren
  rationale: Direkte und eindeutige anatomische Entsprechung.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: das Fett auf ihnen
  rationale: Die Formulierung gibt עֲלֵיהֶן eng wieder und bleibt im Deutschen verständlich.
- source_word: וְהִקְטַרְתָּ הַמִּזְבֵּחָה
  choice: und lass alles auf dem Altar in Rauch aufgehen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen als Opfer, sodass Rauch entsteht. „In Rauch aufgehen lassen“ gibt diese kultische Bedeutung genauer wieder als bloßes „verbrennen“; „alles“ nimmt die aufgezählten Teile idiomatisch zusammen.
