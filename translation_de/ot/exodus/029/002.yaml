  text: וְ/לֶ֣חֶם מַצּ֗וֹת וְ/חַלֹּ֤ת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן סֹ֥לֶת חִטִּ֖ים תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: de
  text: und ungesäuertes Brot, ungesäuerte Brotlaibe[a], die mit Öl vermengt sind, und ungesäuerte dünne Fladen, die mit Öl bestrichen[b] sind. Du sollst sie aus feinem Weizenmehl zubereiten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ungesäuerte Brotkuchen“. Das hebräische Wort kann ein geformtes, möglicherweise rundes Brotgebäck oder einen Brotlaib bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „mit Öl gesalbt“. Das Verb ist das übliche Wort für „salben“, beschreibt hier jedoch die Zubereitung der Fladen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Die Wortverbindung bezeichnet Brot, das ungesäuert ist. Die gewählte Formulierung ist im Deutschen natürlich und bewahrt den kultischen Sachbezug.
- source_word: חַלֹּת מַצֹּת
  choice: ungesäuerte Brotlaibe
  rationale: חַלָּה bezeichnet hier ein geformtes Brotgebäck beziehungsweise einen Brotlaib. „Brotlaibe“ unterscheidet diese Stücke sowohl vom allgemeinen „Brot“ als auch von den nachfolgend genannten dünnen Fladen.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: mit Öl vermengt
  rationale: Das passive Partizip von בלל beschreibt das Vermischen des Teigs beziehungsweise Gebäcks mit Öl. „Vermengt“ gibt den Zubereitungsvorgang knapp und sachgerecht wieder.
- source_word: רְקִיקֵי מַצּוֹת
  choice: ungesäuerte dünne Fladen
  rationale: רָקִיק bezeichnet ein dünnes Brotgebäck. „Dünne Fladen“ ist verständlich und hält den Gegensatz zu den Brotlaiben erkennbar.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: mit Öl bestrichen
  rationale: משׁח bedeutet gewöhnlich „salben“, bezeichnet in diesem Zubereitungskontext aber das Auftragen von Öl auf die dünnen Fladen. „Bestrichen“ ist hier idiomatisch, während die Fußnote die engere lexikalische Entsprechung bewahrt.
- source_word: סֹלֶת חִטִּים
  choice: feines Weizenmehl
  rationale: סֹלֶת bezeichnet Feinmehl, חִטִּים bestimmt die Getreideart als Weizen. Die Formulierung gibt beide Bestandteile klar wieder.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Du sollst sie zubereiten
  rationale: Das Imperfekt hat in dieser Rechts- und Ritualanweisung vorschreibende Kraft. „Zubereiten“ passt zu den verschiedenen genannten Backwaren besser als das allgemeinere „machen“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die drei Gebäckarten werden durch „Brot“, „Brotlaibe“ und „dünne Fladen“ verständlich unterschieden. Die Satzfolge folgt dem Hebräischen, wird aber durch Relativsätze natürlich lesbar gemacht.
