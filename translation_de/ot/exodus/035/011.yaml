lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet hier das heilige Wohnheiligtum JHWHs unter Israel. „Wohnung“ gibt die Grundbedeutung wieder und bewahrt zugleich die Unterscheidung vom ausdrücklich folgenden „Zelt“.
- source_word: אָהֳלוֹ
  choice: ihr Zelt
  rationale: אָהֶל bedeutet „Zelt“; das Suffix bezieht sich grammatisch auf die Wohnung. Die Formulierung bildet die hebräische Unterscheidung zwischen der Wohnung und ihrem Zeltbestandteil ab.
- source_word: מִכְסֵהוּ
  choice: ihre Decke
  rationale: מִכְסֶה bezeichnet eine schützende Bedeckung. „Decke“ ist im baulichen Zusammenhang natürlich und legt das im Vers nicht genannte Material nicht fest.
- source_word: קְרָסָיו
  choice: ihre Klammern
  rationale: קֶרֶס bezeichnet Verbindungselemente, mit denen Teile der Zeltbahnen zusammengefügt wurden. „Klammern“ gibt ihre Funktion verständlich wieder, ohne eine moderne Spezialkonstruktion vorauszusetzen.
- source_word: קְרָשָׁיו
  choice: ihre Bretter
  rationale: קֶרֶשׁ bezeichnet in den Beschreibungen der Wohnung deren hölzerne Bauteile. „Bretter“ ist die naheliegende Wiedergabe; „Rahmen“ bleibt wegen einer möglichen offenen Rahmenbauweise als Alternative vermerkt.
- source_word: בְּרִיחָיו
  choice: ihre Riegel
  rationale: בְּרִיחַ bezeichnet waagerechte Stangen, welche die Bretter beziehungsweise Rahmen zusammenhielten. „Riegel“ ist baulich präzise und im Deutschen geläufig.
- source_word: עַמֻּדָיו
  choice: ihre Säulen
  rationale: עַמּוּד bezeichnet aufrecht stehende Stützen. „Säulen“ entspricht dem würdigen architektonischen Sprachgebrauch des Zusammenhangs.
- source_word: אֲדָנָיו
  choice: ihre Sockel
  rationale: אֶדֶן bezeichnet hier die unteren Trage- oder Aufnahmeteile der Konstruktion. „Sockel“ ist verständlich und bewahrt den baulichen Sinn; „Fußfassungen“ hebt alternativ ihre Aufnahmefunktion hervor.
