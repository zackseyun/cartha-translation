  text: You shall not kindle a fire in any of your dwellings on the Sabbath day.
translation:
  language: de
  text: Ihr dürft am Sabbattag in keiner eurer Wohnstätten ein Feuer anzünden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: anzünden
  rationale: Das Piel von בער bezeichnet hier das Entfachen eines Feuers. „Ein Feuer anzünden“ ist im modernen Deutschen natürlich und präzise.
- source_word: אֵשׁ
  choice: ein Feuer
  rationale: Das singularische אֵשׁ wird nach „anzünden“ idiomatisch mit dem unbestimmten Ausdruck „ein Feuer“ wiedergegeben.
- source_word: בְּכֹל
  choice: in keiner
  rationale: Unter der Verneinung gibt „in keiner“ den distributiven Sinn von „nicht in irgendeiner“ klar und natürlich wieder.
- source_word: מֹשְׁבֹתֵיכֶם
  choice: eurer Wohnstätten
  rationale: „Wohnstätten“ bewahrt den breiteren Umfang von מוֹשָׁב und den würdigen Ton, ohne den Begriff auf private Häuser oder öffentliche Siedlungen einzuengen.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: „Am Sabbattag“ gibt sowohl die Zeitangabe als auch das im Hebräischen ausdrücklich genannte „Tag“ knapp und idiomatisch wieder.
theological_decisions:
- issue: Umfang des Verbots von Feuer am Sabbat
  choice: Das Gebot wird unmittelbar als Verbot wiedergegeben, ein Feuer anzuzünden.
  alternative: Das Verbot weiter auf jeden Gebrauch oder jede Aufrechterhaltung von Feuer beziehungsweise auf alle Arbeiten mit Hitze ausdehnen.
  rationale: Der hebräische Text nennt ausdrücklich das Entfachen eines Feuers in den Wohnstätten am Sabbat. Weitergehende spätere Auslegungen werden nicht in die Übersetzung eingetragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Ihr dürft … nicht“ wird durch die idiomatische Negativstellung „in keiner“ ausgedrückt; die Formulierung bleibt als direktes Verbot erkennbar.
