lexical_decisions:
- source_word: תְכֵלֶת
  choice: blauen Purpur
  rationale: Der Ausdruck bezeichnet einen blau bis blauviolett gefärbten kostbaren Textilstoff beziehungsweise entsprechendes Garn. „Blauer Purpur“ ist im deutschen Bibelregister verständlich und bewahrt den Material- und Farbaspekt.
- source_word: אַרְגָּמָן
  choice: roten Purpur
  rationale: Das Wort bezeichnet purpurfarbenes, wahrscheinlich rötlich-purpurnes Textilmaterial. Die Wiedergabe unterscheidet es klar von תְכֵלֶת.
- source_word: תוֹלַעַת שָׁנִי
  choice: Karmesingarn
  rationale: Die Wendung bezeichnet mit Insektenfarbstoff scharlach- beziehungsweise karminrot gefärbtes Material. Im Zusammenhang der Webstoffe macht „Garn“ den gemeinten Materialcharakter deutlich.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: In den Anweisungen für das Heiligtum bezeichnet der Ausdruck regelmäßig hochwertigen Leinenstoff.
- source_word: עִזִּים
  choice: Ziegenhaar
  rationale: Wörtlich steht „Ziegen“; in dieser Liste von Werkstoffen ist das zum Weben der Zelttücher verwendete Ziegenhaar gemeint.
- source_word: וְ
  choice: und
  rationale: Die wiederholte Konjunktion wird beibehalten, um den aufzählenden Rhythmus des Hebräischen wiederzugeben.
