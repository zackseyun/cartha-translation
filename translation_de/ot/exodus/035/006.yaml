  register: Moderne, würdige Aufzählung mit beibehaltener polysyndetischer Struktur. Die traditionellen Farbbezeichnungen „blauer Purpur“, „roter Purpur“ und „Karmesin“ bleiben wegen ihrer Präzision im Heiligtumskontext erhalten; „Garn“ und die Fußnoten verdeutlichen den Textilbezug.
