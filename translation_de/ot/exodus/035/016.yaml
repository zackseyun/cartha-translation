  yaml_path: translation/ot/exodus/035/016.yaml
  text: the altar of burnt offering[a], and the bronze grating that belongs to it, its poles, and all its utensils[b], the basin and its stand—
translation:
  language: de
  text: den Brandopferaltar, das zu ihm gehörende Bronzegitter, seine Tragstangen und alle seine Geräte, das Becken und sein Gestell –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Die kompakte deutsche Zusammensetzung bezeichnet natürlich und eindeutig den Altar für das Ganzopfer beziehungsweise Brandopfer.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: Bronzegitter
  rationale: מִכְבָּר bezeichnet ein gitter- oder netzartiges Bauteil; »Bronzegitter« ist präzise, verständlich und lässt die genaue Bauform offen.
- source_word: אֲשֶׁר לוֹ
  choice: das zu ihm gehörende
  rationale: Die Formulierung gibt die im Hebräischen ausgedrückte Zuordnung wieder, ohne eine nicht ausdrücklich genannte räumliche Lage festzulegen.
- source_word: בַּדָּיו
  choice: seine Tragstangen
  rationale: Die Stangen dienten zum Tragen der Heiligtumsgeräte; »Tragstangen« ist im Deutschen klarer als das bloße »Stangen« und sachlich durch den Kontext gedeckt.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: כֵּלִים ist eine breite Bezeichnung für die zum Altar gehörenden Gegenstände; »Geräte« klingt im modernen Deutschen natürlich und vermeidet das altertümliche »Gerätschaften«.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: »Becken« ist die verständliche moderne Bezeichnung für das Waschbecken im Vorhof; »Waschbecken« würde seine Funktion deutlicher machen, sie hier aber ergänzend auslegen.
- source_word: כַּנּוֹ
  choice: sein Gestell
  rationale: כֵּן bezeichnet hier die tragende Unterkonstruktion beziehungsweise den Sockel des Beckens; »Gestell« ist konkret und modern.
