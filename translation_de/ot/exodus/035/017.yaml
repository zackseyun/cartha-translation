base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/017.yaml
  text: the hangings of the court[a], its pillars and its bases[c][b], and the screen for the gate of the court—
translation:
  language: de
  text: die Behänge des Vorhofs, seine Säulen und seine Sockel sowie den Vorhang für das Tor des Vorhofs —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַלְעֵי
  choice: Behänge
  rationale: Bezeichnet die Stoffbahnen, die den Vorhof umschlossen. „Behänge“ ist im Heiligtumskontext präzise und unterscheidet sie vom besonderen Eingangsvorhang.
- source_word: חָצֵר
  choice: Vorhof
  rationale: Bezeichnet den umschlossenen äußeren Bereich der Stiftshütte. „Vorhof“ ist die eingebürgerte und sachlich passende deutsche Bezeichnung.
- source_word: עַמֻּדָיו
  choice: seine Säulen
  rationale: Das Wort bezeichnet die aufrechten Träger der Einfriedung; „Säulen“ entspricht dem würdevollen architektonischen Kontext.
- source_word: אֲדָנֶיהָ
  choice: seine Sockel
  rationale: Gemeint sind die tragenden Fußstücke beziehungsweise Aufnahmen der Säulen. „Sockel“ ist im Deutschen anschaulich und in diesem Sachzusammenhang üblich.
- source_word: מָסַךְ
  choice: Vorhang
  rationale: Im Stiftshüttenkontext bezeichnet das Wort einen textilen Abschluss am Eingang. „Vorhang“ klingt im Deutschen natürlicher als „Schirm“ und bleibt von „Behänge“ unterscheidbar.
- source_word: שַׁעַר
  choice: Tor
  rationale: Bezeichnet den Zugang zur Einfriedung des Vorhofs; „Tor“ gibt die bauliche Funktion direkt wieder.
theological_decisions: []
