  text: אֶת יִתְדֹ֧ת הַ/מִּשְׁכָּ֛ן וְ/אֶת יִתְדֹ֥ת הֶ/חָצֵ֖ר וְ/אֶת מֵיתְרֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/018.yaml
  text: the pegs of the tabernacle[a], and the pegs of the courtyard, and their ropes—
translation:
  language: de
  text: die Pflöcke der Wohnung, die Pflöcke des Vorhofs und ihre Seile;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְדֹת
  choice: Pflöcke
  rationale: Das Wort bezeichnet Pflöcke zur Befestigung der Zeltkonstruktion und ihrer Behänge. „Pflöcke“ ist im Deutschen knapp und sachlich; „Zeltpflöcke“ wäre deutlicher, fügte aber eine im Ausdruck nicht eigens genannte Bestimmung hinzu.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bezeichnet in Exodus die heilige Wohnstätte Gottes. „Wohnung“ gibt die Grundbedeutung wieder und bleibt im kultischen Zusammenhang verständlich; „Stiftshütte“ ist traditionell, aber für viele heutige Leser weniger unmittelbar zugänglich.
- source_word: הֶחָצֵר
  choice: des Vorhofs
  rationale: חָצֵר bezeichnet hier den umfriedeten Außenbereich der Wohnung. „Vorhof“ ist die geläufige und präzise Bezeichnung in diesem Heiligtumskontext.
- source_word: מֵיתְרֵיהֶם
  choice: ihre Seile
  rationale: Gemeint sind die zu den Pflöcken und zur Konstruktion gehörenden Befestigungsseile. „Seile“ ist im modernen Deutsch natürlicher als „Schnüre“ und lässt den Bezug des Pluralsuffixes ebenso offen wie der hebräische Text.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: die Pflöcke ... die Pflöcke ... und ihre Seile
  rationale: Die wiederholten Objektmarker werden nicht eigens übersetzt; die aufzählende Struktur bleibt durch die parallelen Nominalgruppen erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Inventarsprache. Der Vers ist syntaktisch Teil einer fortlaufenden Aufzählung; das Semikolon signalisiert diese Fortsetzung. „Wohnung“ wird als konsistente, bedeutungsnahe Bezeichnung für das Heiligtumszelt verwendet.
