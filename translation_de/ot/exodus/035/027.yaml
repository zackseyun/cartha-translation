  text: And the leaders brought the onyx stones and the stones for setting[b][a], for the ephod and for the breastpiece.
translation:
  language: de
  text: Und die führenden Männer brachten die Onyxsteine[a] und die Steine zum Einsetzen für das Efod und für das Bruststück[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Schohamsteine“. Welche Edelsteinart genau gemeint ist, ist unsicher; „Onyx“ ist die traditionelle Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: Auch „Brusttasche“ oder „Brustschild“; gemeint ist der priesterliche Schmuckgegenstand, der auf der Brust getragen wurde, nicht ein Teil einer Rüstung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: Und die führenden Männer
  rationale: נְשִׂיאִים bezeichnet hier die leitenden Vertreter des Volkes. „Führende Männer“ ist im modernen Deutsch klar und vermeidet die monarchische Nebenbedeutung von „Fürsten“.
- source_word: הֵבִיאוּ
  choice: brachten
  rationale: Der Hifil von בוא bedeutet hier schlicht „bringen“; dies passt natürlich zum Zusammenhang der Materialgaben.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: die Onyxsteine
  rationale: „Onyx“ ist die traditionelle und geläufige Wiedergabe von שֹׁהַם, obwohl die genaue Bestimmung des Edelsteins unsicher ist; diese Unsicherheit wird in einer Fußnote bewahrt.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: die Steine zum Einsetzen
  rationale: מִלֻּאִים bezeichnet in diesem Schmuckkontext Steine, die in Fassungen eingesetzt werden. Die funktionale Wiedergabe ist verständlicher als das wörtliche, aber unklare „Steine der Füllung“.
- source_word: לָאֵפֹד
  choice: für das Efod
  rationale: אֵפֹד bezeichnet ein besonderes priesterliches Kleidungsstück ohne genaues deutsches Gegenstück; die eingebürgerte Transliteration bewahrt den Fachbegriff.
- source_word: וְלַחֹשֶׁן
  choice: und für die Brusttasche
  rationale: חֹשֶׁן bezeichnet das am Efod befestigte priesterliche Bruststück, das offenbar taschenartig gearbeitet war. „Brusttasche“ vermeidet die irreführende Vorstellung eines Rüstungsteils.
