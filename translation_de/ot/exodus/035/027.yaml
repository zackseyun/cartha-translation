translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Inventarstil, während „Steine zum Einsetzen“ die Funktion idiomatisch ausdrückt. Fachbegriffe und mineralogische Unsicherheit werden transparent behandelt.
