lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Darauf ging … weg
  rationale: Das Wayyiqtol führt die Erzählung fort. »Darauf« gibt die zeitliche Abfolge wieder; »ging … weg« entspricht dem schlichten Sinn von יצא im Zusammenhang mit מִלִּפְנֵי.
- source_word: כָּל
  choice: die ganze
  rationale: כָּל bezieht sich auf die folgende Genitivverbindung und betont die Gesamtheit der Gemeinde.
- source_word: עֲדַת
  choice: Gemeinde
  rationale: עֵדָה bezeichnet hier die als Gemeinschaft versammelte Gesamtheit Israels. »Gemeinde« ist im Deutschen verständlich und wahrt den korporativen Sinn; »Versammlung« und »Gemeinschaft« bleiben mögliche Alternativen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet das Volk Israel einschließlich aller seiner Angehörigen. Der formale Wortlaut »Söhne Israels« wird in einer Fußnote bewahrt.
- source_word: מִלִּפְנֵי
  choice: von … weg
  rationale: Die Präposition bedeutet wörtlich »von vor« beziehungsweise »aus der Gegenwart von«. Im Deutschen gibt »von Mose weg« die räumliche Bewegung natürlich wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Namensform für מֹשֶׁה.
