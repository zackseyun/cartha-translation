  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: de
  text: Und er erfüllte ihn mit dem Geist Gottes[a], mit Weisheit, mit Verständnis und mit Erkenntnis, dazu mit Geschick für jede Art von Arbeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit dem Geist von Gott«; möglicherweise auch: »mit einem göttlichen Geist«. Die hebräische Wendung kann allgemeiner verstanden werden, meint hier aber wahrscheinlich Gottes eigenen, befähigenden Geist.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: »und mit jeder Arbeit«; gemeint ist im Zusammenhang Geschick in jeder Art handwerklich-künstlerischer Arbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: Und er erfüllte
  rationale: Das Piel im fortlaufenden Erzählstil wird als vergangene Handlung wiedergegeben. Das Subjekt wird aus dem vorigen Vers übernommen und ist Gott; das Pronomen wird nach heutiger deutscher Rechtschreibung kleingeschrieben.
- source_word: אֹתוֹ
  choice: ihn
  rationale: Das direkte Objekt verweist im Kontext eindeutig auf Bezalel.
- source_word: רוּחַ אֱלֹהִים
  choice: mit dem Geist Gottes
  rationale: Im Zusammenhang der von Gott verliehenen Befähigung für den Heiligtumsbau bezeichnet die Wendung am ehesten Gottes eigenen Geist. Die Formulierung bleibt zugleich nahe an der hebräischen Genitivverbindung.
- source_word: בְּחָכְמָה
  choice: mit Weisheit
  rationale: Die Präposition ב leitet hier eine Reihe verliehener Befähigungen ein; »Weisheit« gibt חָכְמָה im handwerklich-künstlerischen Kontext angemessen wieder.
- source_word: בִּתְבוּנָה
  choice: mit Verständnis
  rationale: תְבוּנָה bezeichnet Verständnis oder Einsicht. »Verständnis« bewahrt die erkennbare Dreierfolge mit Weisheit und Erkenntnis.
- source_word: וּבְדַעַת
  choice: und mit Erkenntnis
  rationale: דַּעַת bedeutet grundlegend Wissen oder Erkenntnis. »Erkenntnis« vermeidet eine Verengung auf bloße technische Fertigkeit.
- source_word: וּבְכָל מְלָאכָה
  choice: dazu mit Geschick für jede Art von Arbeit
  rationale: מְלָאכָה kann Arbeit, Tätigkeit oder Handwerk bezeichnen. Im unmittelbaren Kontext ist qualifizierte handwerklich-künstlerische Arbeit gemeint; die deutsche Wendung drückt die Befähigung natürlich aus, ohne den Begriff auf nur ein Gewerbe einzuengen.
theological_decisions:
- issue: Ob רוּחַ אֱלֹהִים persönlich als Gottes Geist oder allgemeiner als göttlicher Geist beziehungsweise göttliche Befähigung zu verstehen ist
  choice: der Geist Gottes
  alternative: der Geist von Gott; ein göttlicher Geist
  rationale: Der unmittelbare Kontext stellt die Befähigung als Gottes Wirken für den heiligen Dienst dar. »Der Geist Gottes« wahrt dieses theologische Gewicht, während eine Fußnote die grammatisch mögliche allgemeinere Auffassung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung des Hebräischen bleibt weitgehend erhalten; der letzte Ausdruck wird idiomatisch entfaltet, damit die im Kontext gemeinte handwerkliche Befähigung verständlich wird. Sämtliche Fußnotenmarker stehen im Haupttext.
