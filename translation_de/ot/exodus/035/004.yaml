base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: de
  text: 'Dann sagte Mose zur ganzen Gemeinde[a] der Israeliten[b]: „Dies ist das Wort[c], das Jahwe geboten hat:“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Versammlung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „der Söhne Israels“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Dies ist die Sache“; sinngemäß: „Das ist, was …“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das narrative וַ־ führt die Handlung weiter. „Dann sagte“ gibt diese Abfolge in natürlichem modernem Deutsch wieder.
- source_word: עֲדַת
  choice: Gemeinde
  rationale: עֵדָה bezeichnet hier die als Gemeinschaft versammelte Gesamtheit Israels. „Gemeinde“ bewahrt sowohl den gemeinschaftlichen als auch den versammelten Sinn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die idiomatische Volksbezeichnung ist im heutigen Deutsch klar und schließt im Kontext die ganze Gemeinschaft ein; die formnähere Wiedergabe „Söhne Israels“ wird in einer Fußnote genannt.
- source_word: זֶה הַדָּבָר
  choice: Dies ist das Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. In der Einleitungsformel zu einem göttlichen Gebot bewahrt „Wort“ den Aussage- und Offenbarungscharakter, ohne die anderen möglichen Bedeutungsnuancen zu verschweigen.
- source_word: צִוָּה
  choice: geboten hat
  rationale: „Gebieten“ entspricht dem verbindlichen Charakter von צוה; das Perfekt bezeichnet im Deutschen natürlich das zuvor erteilte, nun mitzuteilende Gebot.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵאמֹר
  choice: Doppelpunkt
  rationale: Das abschließende לֵאמֹר leitet den in den folgenden Versen wiedergegebenen Inhalt ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als ein zusätzliches „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen traditionellen Titel ersetzen würde.
- issue: Umfang und grammatische Form von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Im Zusammenhang ist die gesamte Gemeinschaft Israels angesprochen. Die idiomatische Volksbezeichnung gibt diesen kollektiven Bezug natürlich wieder; die grammatisch männliche, formnähere Fassung bleibt als Fußnotenalternative sichtbar.
- issue: Bedeutungsbreite von דָּבָר
  choice: Wort
  alternative: Sache; das, was
  rationale: „Wort“ passt zur Formel, die ein göttliches Gebot einführt, legt jedoch die breite Semantik des hebräischen Ausdrucks nicht als einzig mögliche Deutung fest; die Alternativen werden deshalb in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen, während der abschließende Doppelpunkt die Einleitungsformel לֵאמֹר idiomatisch wiedergibt. Die Fußnoten dokumentieren die wesentlichen lexikalischen Alternativen und bewahren die Bedeutungsbreite des Ausgangstextes.
