  text: the balsam and the oil for the light[a], and for the anointing oil and for the incense of spices[b],
translation:
  language: de
  text: und den Balsam[a] und das Öl für die Beleuchtung sowie für das Salböl und für das Räucherwerk aus duftenden Gewürzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Gewürz“ beziehungsweise „den aromatischen Stoff“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das wohlriechende Räucherwerk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: den Balsam
  rationale: בֹּשֶׂם bezeichnet einen aromatischen Stoff beziehungsweise ein Gewürz oder Balsam. In dieser Materialliste bewahrt „Balsam“ den konkreten Sinn.
- source_word: הַשָּׁמֶן
  choice: das Öl
  rationale: שֶׁמֶן ist die allgemeine Bezeichnung für Öl; „Olivenöl“ wäre hier genauer, als der hebräische Wortlaut erlaubt.
- source_word: לְמָאוֹר
  choice: für die Beleuchtung
  rationale: מָאוֹר bezeichnet hier den Zweck des Öls, nämlich Licht zu erzeugen. „Für die Beleuchtung“ ist im Deutschen natürlich und legt sich nicht auf eine einzelne Lampe fest.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die feste Verbindung bezeichnet das für die heilige Salbung bestimmte Öl; „Salböl“ ist die übliche knappe deutsche Wiedergabe.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: das Räucherwerk aus duftenden Gewürzen
  rationale: קְטֹרֶת bezeichnet Räucherwerk, סַמִּים aromatische Gewürze. Die Wiedergabe hält beide Bestandteile sichtbar und klingt zugleich natürlich.
- source_word: וְאֶת ... וְאֶת ... וּלְ ... וְלִ
  choice: und ... und ... sowie für ... und für
  rationale: Die wiederholten Konjunktionen führen die Aufzählung aus dem vorherigen Vers fort. Das deutsche „sowie“ glättet die Liste leicht, ohne ihre Gliederung aufzulösen.
