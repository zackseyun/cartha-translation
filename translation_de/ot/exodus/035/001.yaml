id: EXO.35.1
reference: Exodus 35:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: de
  text: 'Mose versammelte die ganze Gemeinde der Söhne Israels[a] und sagte zu ihnen: „Dies sind die Dinge[b], die Jahwe zu tun geboten hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Israels“. Dies ist eine Bundesbezeichnung für das Volk Israel; hier ist die ganze Gemeinschaft gemeint, nicht nur die Männer.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Worte“ oder „Angelegenheiten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: versammelte
  rationale: Der Hifil von קהל bezeichnet hier, dass Mose das Volk als versammelte Körperschaft zusammenruft. „Versammelte“ ist im Deutschen natürlich und formnah.
- source_word: כָּל עֲדַת
  choice: die ganze Gemeinde
  rationale: עֵדָה bezeichnet die gemeinschaftlich verfasste beziehungsweise versammelte Gemeinde Israels; כָּל wird mit „ganze“ wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die grammatisch maskuline Bundesbezeichnung wird formgetreu bewahrt. Eine Fußnote stellt klar, dass hier die gesamte Volksgemeinschaft gemeint ist.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Dies sind die Dinge
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. „Dinge“ erhält die semantische Weite und passt zu den anschließend gebotenen Handlungen; die Alternativen werden in einer Fußnote genannt.
- source_word: צִוָּה יְהוָה
  choice: Jahwe … geboten hat
  rationale: Das Perfekt bezeichnet den bereits erteilten und weiterhin maßgeblichen Befehl. „Geboten hat“ gibt dies in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form der wissenschaftlichen Umschrift.
- source_word: לַעֲשֹׂת אֹתָם
  choice: die … zu tun
  rationale: Der Infinitiv mit Objektsuffix bezeichnet die Dinge beziehungsweise Handlungen, deren Ausführung geboten wurde. Die deutsche Konstruktion bewahrt den Bezug des Pluralobjekts.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Wiedergabe „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlecht und Umfang von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die Übersetzung erhält die maskuline Form der hebräischen Bundesbezeichnung, ohne ihren gemeinschaftlichen Bezug auf Männer zu beschränken; dieser wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, ohne unnatürlich zu wirken; die Mehrdeutigkeit von דְּבָרִים und der gemeinschaftliche Sinn der traditionellen Bundesbezeichnung werden durch Fußnoten offengehalten.
