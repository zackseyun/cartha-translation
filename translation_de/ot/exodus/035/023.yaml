base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: de
  text: Und jeder Mann, bei dem blaues Garn, Purpurgarn, Karmesingarn, feines Leinen, Ziegenhaar, rot gefärbte Widderfelle und Tahaschhäute[a] vorhanden waren, brachte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort Tahasch bezeichnet ein nicht sicher bestimmbares Tier oder Material. Vorgeschlagen wurden unter anderem feines Leder sowie Häute von Delfinen oder Dugongs.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Und jeder Mann
  rationale: אִישׁ ist hier grammatisch maskulin und wird mit כָל distributiv gebraucht. „Jeder Mann“ bewahrt die konkrete Formulierung des hebräischen Textes.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: bei dem … vorhanden waren
  rationale: Die passive Konstruktion von מצא bedeutet wörtlich, dass die Materialien „bei ihm gefunden wurden“. „Vorhanden waren“ gibt den Besitzsinn in natürlichem Deutsch wieder, ohne ihn auf ein schlichtes „hatte“ zu reduzieren.
- source_word: תְּכֵלֶת
  choice: blaues Garn
  rationale: Im Heiligtumskontext bezeichnet das Wort blau gefärbtes Textilmaterial. „Garn“ macht den für die Verarbeitung bestimmten Werkstoff deutlich.
- source_word: אַרְגָּמָן
  choice: Purpurgarn
  rationale: Der Ausdruck bezeichnet purpurfarbenes Textilmaterial; „Purpurgarn“ ist knapp, konkret und im Deutschen gut verständlich.
- source_word: תוֹלַעַת שָׁנִי
  choice: Karmesingarn
  rationale: Die Wendung bezeichnet karmesin- beziehungsweise scharlachrot gefärbtes Textilmaterial. „Karmesingarn“ wahrt den Farb- und Werkstoffbezug.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: In den Texten über das Heiligtum bezeichnet שֵׁשׁ hochwertiges Leinen. Die Qualitätsnuance wird mit „feines“ wiedergegeben.
- source_word: עִזִּים
  choice: Ziegenhaar
  rationale: Wörtlich steht „Ziegen“, doch in dieser Materialliste ist das aus Ziegenhaar gewonnene Webmaterial gemeint, nicht lebende Tiere.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: rot gefärbte Widderfelle
  rationale: Die Formulierung gibt sowohl das Material als auch seine rote Färbung klar und unmittelbar wieder.
- source_word: עֹרֹת תְּחָשִׁים
  choice: Tahaschhäute
  rationale: Die Bedeutung von תְּחָשׁ ist unsicher. Die Transliteration vermeidet eine spekulative Bestimmung des Tieres oder Materials; die Fußnote nennt verbreitete Deutungen.
- source_word: הֵבִיאוּ
  choice: brachte sie
  rationale: Das pluralische Verb fasst das Handeln aller genannten Männer zusammen. Im deutschen Hauptsatz stimmt das singularische „brachte“ mit „jeder Mann“ überein; „sie“ nimmt die Materialien auf.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Materialliste bleibt konkret und fachlich präzise, während der ungewisse Ausdruck תְּחָשׁ nicht vorschnell gedeutet wird. Das deutsche „oder“ macht idiomatisch deutlich, dass nicht jeder Mann sämtliche aufgezählten Materialien besitzen musste.
