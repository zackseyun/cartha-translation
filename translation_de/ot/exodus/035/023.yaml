  terminology: „Blaues Garn“, „Purpurgarn“, „Karmesingarn“, „feines Leinen“, „Ziegenhaar“ und „rot gefärbte Widderfelle“ sind sachgerecht. „Tahaschhäute“ erhält die lexikalische Unsicherheit transparent; die Fußnote vermeidet eine unbegründete Festlegung.
