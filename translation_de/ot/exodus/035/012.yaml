translation:
  language: de
  text: die Lade und ihre Tragstangen, die Deckplatte[a] und den abschirmenden Vorhang,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: die Sühneplatte; traditionell: der Gnadenthron.'
