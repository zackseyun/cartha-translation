lexical_decisions:
- source_word: הָאָרֹן
  choice: die Lade
  rationale: Im Heiligtumskontext bezeichnet אָרוֹן die heilige Bundeslade. „Lade“ ist im Deutschen die etablierte, kontextgenaue Bezeichnung; „Kasten“ wäre zu allgemein.
- source_word: בַּדָּיו
  choice: ihre Tragstangen
  rationale: בַּדִּים sind die Stangen zum Tragen der Lade. „Tragstangen“ ist modern, eindeutig und gibt ihre Funktion präziser wieder als bloß „Stangen“.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte[a]
  rationale: כַּפֹּרֶת bezeichnet die goldene Deckplatte der Lade und ist kultisch mit Sühne verbunden. „Sühneplatte“ bewahrt sowohl den Gegenstandsbezug als auch die kultische Bedeutung, ohne die traditionelle, aber bildhafte Bezeichnung „Gnadenthron“ in den Haupttext zu setzen.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: den abschirmenden Vorhang
  rationale: פָּרֹכֶת bezeichnet den inneren Trennvorhang; מָסָךְ hebt seine Funktion als Abschirmung hervor. Die attributive Wiedergabe ist im Deutschen natürlicher als „Vorhang der Abschirmung“ und bildet dennoch beide Bestandteile der hebräischen Wendung ab.
- source_word: אֶת / וְאֶת
  choice: nicht eigens wiedergegeben
  rationale: Die wiederholten direkten Objektmarker haben keine selbstständige deutsche Entsprechung; die Aufzählung und der Akkusativ bilden ihre syntaktische Funktion ab.
theological_decisions:
- issue: Wiedergabe von הַכַּפֹּרֶת im Heiligtumskontext
  choice: die Sühneplatte
  alternative: 'die Deckplatte; traditionell: der Gnadenthron'
  rationale: Der Ausdruck bezeichnet konkret die Platte auf der Lade und trägt zugleich kultische Sühnebedeutung. „Sühneplatte“ hält beide Aspekte zusammen. Die sachlichere und die traditionelle Alternative werden in der Fußnote offengelegt, damit die terminologische und theologische Spannung nicht verdeckt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt als Teil einer fortlaufenden Aufzählung kleingeschrieben und endet entsprechend der Vorlage mit einem Komma. Der Fußnotenmarker steht unmittelbar bei dem tatsächlich erläuterten Ausdruck.
