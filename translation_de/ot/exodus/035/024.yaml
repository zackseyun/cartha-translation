  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: de
  text: Jeder, der Silber oder Bronze als Abgabe darbrachte,[a] brachte die Abgabe für Jahwe. Und jeder, bei dem sich Akazienholz fand,[b] brachte es für jede Arbeit des Dienstes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Abgabe aus Silber und Bronze“. Das hebräische „und“ kann im Zusammenhang distributiv verstanden und daher mit „oder“ wiedergegeben werden: Jeder brachte das Metall dar, das er als Abgabe hatte.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „bei dem sich Akazienholz fand“ bedeutet, dass jemand Akazienholz besaß oder verfügbar hatte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Jeder, der … darbrachte
  rationale: Das Partizip von רום bezeichnet zusammen mit תְּרוּמָה idiomatisch das Darbringen beziehungsweise Bereitstellen einer Abgabe. „Darbrachte“ ist im Deutschen natürlich und bewahrt den kultischen Zusammenhang.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: Silber oder Bronze als Abgabe
  rationale: תְּרוּמָה bezeichnet eine für einen bestimmten, hier heiligen Zweck ausgesonderte Abgabe. נְחֹשֶׁת kann Kupfer oder Bronze bedeuten; im Zusammenhang der Heiligtumsmaterialien ist „Bronze“ die übliche Wiedergabe. Das hebräische „und“ wird distributiv als „oder“ verstanden, ohne die formale Alternative zu verschweigen.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: brachte die Abgabe für Jahwe
  rationale: Die Constructusverbindung kann eine Jahwe gehörende oder für ihn bestimmte Abgabe bezeichnen. „Für Jahwe“ drückt im Deutschen die Bestimmung natürlich aus; die mögliche possessive Wiedergabe wird in der theologischen Entscheidung festgehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: Und jeder, bei dem sich … fand
  rationale: Die hebräische Besitz- beziehungsweise Verfügbarkeitsformel wird in ihrer bildhaften Struktur bewahrt; ihre idiomatische Bedeutung wird in einer Fußnote erläutert.
- source_word: עֲצֵי שִׁטִּים
  choice: Akazienholz
  rationale: Dies ist die geläufige und verständliche deutsche Bezeichnung für das im Heiligtumsbau verwendete Holz.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: das für irgendeine Arbeit an dem Dienst gebraucht werden konnte
  rationale: Die Formulierung bewahrt sowohl מְלָאכָה („Arbeit, handwerkliche Tätigkeit“) als auch עֲבֹדָה („Dienst“) und gibt לְכָל in seinem distributiven Sinn wieder, ohne „Heiligtum“ ausdrücklich in den Text einzufügen.
- source_word: הֵבִיאוּ
  choice: brachte es
  rationale: Das ergänzte Pronomen nimmt das im Deutschen als Stoffbezeichnung gebrauchte Singularwort „Akazienholz“ auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname steht im Ausgangstext ausdrücklich da. „Jahwe“ bewahrt ihn als Gottes Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis der Abgabe zu Jahwe in תְּרוּמַת יְהוָה
  choice: die Abgabe für Jahwe
  alternative: Jahwes Abgabe
  rationale: Die Constructusverbindung lässt eine possessive oder eine auf die Bestimmung zielende Nuance zu. Im Zusammenhang ist die für Jahwe bestimmte Abgabe gemeint; die gewählte Formulierung ist natürlich, ohne eine weitergehende Eigentumstheologie festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Abgabe“ bildet die Wiederholung von תְּרוּמָה ab. Die etwas konkrete Wendung „bei dem sich … fand“ erhält das hebräische Idiom, während die Fußnote dessen Sinn erläutert.
