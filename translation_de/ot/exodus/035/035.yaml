  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: de
  text: Er hat sie mit Weisheit des Herzens[b] erfüllt, damit sie jede Art von Arbeit eines Kunsthandwerkers[a], eines Entwerfers, eines Stickers mit blauem, purpurfarbenem und scharlachrotem Garn sowie mit feinem Leinen und eines Webers ausführen können – als solche, die jede Art von Arbeit ausführen und Entwürfe entwerfen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: „Handwerkers“, möglicherweise auch „Graveurs“. Das hebräische Wort bezeichnet einen fachkundigen Handwerker und kann je nach Zusammenhang spezieller verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich „Weisheit des Herzens“: eine hebräische Wendung für innerlich verankertes Können, Einsicht und Urteilsvermögen.'
    reason: cultural_note
  - marker: c
    text: Wörtlich etwa „Entwürfe entwerfen“. Im Hebräischen stehen verwandte Wörter nebeneinander; die Wiederholung hebt das Planen und Gestalten hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא אֹתָם
  choice: Er hat sie … erfüllt
  rationale: Das Piel von מלא bedeutet „füllen/erfüllen“. Das maskuline Singularsubjekt bleibt wie im Hebräischen durch das Pronomen „Er“ anaphorisch; „sie“ gibt das direkte Objekt אֹתָם wieder.
- source_word: חָכְמַת לֵב
  choice: Weisheit des Herzens
  rationale: Die hebräische Wendung wird bewusst beibehalten. Sie bezeichnet nicht nur technisches Können, sondern innerlich verankerte Einsicht, Urteilsfähigkeit und handwerkliche Begabung.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: damit sie jede Art von Arbeit ausführen können
  rationale: Der Infinitiv bezeichnet hier Zweck beziehungsweise Befähigung. מלאכה meint qualifizierte Arbeit oder ein Handwerk; „jede Art von Arbeit“ gibt die umfassende Aussage natürlich wieder.
- source_word: חָרָשׁ
  choice: Kunsthandwerker
  rationale: חרש kann allgemein einen fachkundigen Handwerker oder spezieller einen Bearbeiter beziehungsweise Graveur bezeichnen. Der breitere Ausdruck vermeidet eine unbelegte Verengung.
- source_word: חֹשֵׁב
  choice: Entwerfer
  rationale: Das Partizip von חשב bezeichnet in diesem handwerklichen Zusammenhang jemanden, der kunstvolle Muster und Gestaltungen plant.
- source_word: רֹקֵם
  choice: Sticker
  rationale: רקם bezeichnet im Textilzusammenhang dekorative Stickarbeit; „Sticker“ ist die direkte moderne Berufsbezeichnung.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: blauem, purpurfarbenem und scharlachrotem Garn
  rationale: Die Farbstoff- beziehungsweise Materialbegriffe bezeichnen kostbare gefärbte Textilien. „Garn“ macht den durch den Kontext gegebenen textilen Bezug verständlich, ohne die genaue Materialform übermäßig festzulegen.
- source_word: שֵׁשׁ
  choice: feinem Leinen
  rationale: שש bezeichnet im Heiligtumskontext hochwertiges feines Leinen.
- source_word: אֹרֵג
  choice: Weber
  rationale: Das Qal-Partizip bezeichnet unmittelbar jemanden, der webt.
- source_word: עֹשֵׂי כָּל מְלָאכָה וְחֹשְׁבֵי מַחֲשָׁבֹת
  choice: So führen sie jede Art von Arbeit aus und ersinnen kunstvolle Entwürfe
  rationale: Die abschließende Zusammenfassung wahrt beide parallelen Partizipialausdrücke. „ersinnen … Entwürfe“ spiegelt die etymologische Verbindung von חשב und מחשבות, ohne im Deutschen die schwerfällige Form „Entwürfe entwerfen“ zu erzwingen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von מִלֵּא
  choice: Er
  alternative: Gott
  rationale: Der Zusammenhang weist auf Gott als Handelnden, doch der hebräische Vers nennt ihn nicht erneut. Das Pronomen bewahrt diese anaphorische Form, statt den Gottesnamen erklärend in den Text einzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit in eine Aufzählung und einen zusammenfassenden Schlusssatz gegliedert. Die fachsprachlichen Berufsbezeichnungen bleiben zugänglich; die markante hebräische Wendung „Weisheit des Herzens“ wird mit Fußnote bewahrt.
