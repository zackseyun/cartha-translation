base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: de
  text: die kunstvoll gefertigten Gewänder[a] für den Dienst im Heiligtum[b], die heiligen Gewänder für den Priester Aaron und die Gewänder seiner Söhne für den Priesterdienst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Dienstgewänder; die genaue Bedeutung des hebräischen Ausdrucks ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: im heiligen Bereich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: die kunstvoll gewebten Gewänder
  rationale: Die seltene Bezeichnung הַשְּׂרָד ist in ihrer genauen Bedeutung unsicher. Im Zusammenhang der kunstvoll angefertigten Textilien gibt diese Wiedergabe eine wahrscheinliche Bedeutung wieder; die traditionelle Deutung als Dienstgewänder wird in der Fußnote bewahrt.
- source_word: לְשָׁרֵת
  choice: für den Dienst
  rationale: Die Zweckangabe bezeichnet hier den kultischen Dienst. Die substantivische deutsche Form klingt natürlich und würdig.
- source_word: בַּקֹּדֶשׁ
  choice: im Heiligtum
  rationale: קֹדֶשׁ bezeichnet in diesem Zusammenhang den heiligen Bereich beziehungsweise das Heiligtum, nicht abstrakte Heiligkeit.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die Konstruktion bedeutet wörtlich Gewänder der Heiligkeit und bezeichnet die für den priesterlichen Dienst ausgesonderte Kleidung.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: für den Priester Aaron
  rationale: Diese Wortstellung ist im heutigen Deutsch natürlich und gibt Aarons Amt eindeutig wieder.
- source_word: בִּגְדֵי בָנָיו
  choice: die Gewänder seiner Söhne
  rationale: Die Wiedergabe folgt der hebräischen Genitivkonstruktion eng und bleibt idiomatisch.
- source_word: לְכַהֵן
  choice: für den Priesterdienst
  rationale: Der Piel-Infinitiv von כהן bedeutet, als Priester zu dienen. „Für den Priesterdienst“ gibt Funktion und Zweck knapp wieder.
theological_decisions:
- issue: Verhältnis zwischen בִּגְדֵי הַשְּׂרָד und בִּגְדֵי הַקֹּדֶשׁ
  choice: Die beiden Ausdrücke werden als aufeinanderfolgende Bestandteile der Aufzählung wiedergegeben.
  alternative: Der zweite Ausdruck kann als nähere Bestimmung des ersten verstanden werden, sodass die kunstvoll gewebten Dienstgewänder mit den heiligen Gewändern Aarons und seiner Söhne gleichgesetzt werden.
  rationale: Das wiederholte אֶת stützt eine gegliederte Aufzählung, entscheidet aber nicht zweifelsfrei gegen eine appositionelle Lesart. Die Übersetzung bildet die hebräische Reihung ab, ohne ausdrücklich eine vollständige sachliche Trennung zu behaupten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem kultischem Wortschatz. „Gewänder“ vermeidet sowohl das alltägliche „Kleider“ als auch spätere kirchliche Fachsprache; „Priesterdienst“ gibt die Funktion knapp und klar wieder.
