  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: de
  text: 'Dann sagte Mose zu den Söhnen Israels[a]: »Seht, Jahwe hat Bezalel, den Sohn Uris, des Sohnes Hurs, aus dem Stamm Juda, mit Namen berufen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »den Israeliten« oder »den Kindern Israels«. Wörtlich steht im Hebräischen »den Söhnen Israels«.
    reason: 'Lexikalische Alternative: Die hebräische Verwandtschaftsbezeichnung kann zugleich als Bezeichnung des gesamten Volkes gebraucht werden.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. »Dann sagte« gibt die zeitlich-fortschreitende Funktion in natürlichem modernem Deutsch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die ausdrücklich verwandtschaftliche und grammatisch männliche Form des Hebräischen. Die idiomatischere Volksbezeichnung »die Israeliten« wird in der Fußnote genannt.
- source_word: רְאוּ
  choice: Seht
  rationale: Der Imperativ im Plural fordert die Angesprochenen auf, auf die folgende Aussage zu achten. »Seht« ist knapp, würdig und nicht altertümlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קָרָא ... בְּשֵׁם
  choice: mit Namen berufen
  rationale: Die Formulierung bewahrt sowohl das ausdrückliche Nennen als auch den Sinn gezielter Erwählung und Beauftragung. »Berufen« passt hier besser als das bloße »gerufen« zum anschließenden Auftrag für das Heiligtum.
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: Bezalel, den Sohn Uris, den Sohn Hurs
  rationale: Die Namen folgen der üblichen deutschen Transkription. Die zweimalige Wiedergabe von בֶּן erhält die hebräische Abstammungsfolge.
- source_word: לְמַטֵּה יְהוּדָה
  choice: aus dem Stamm Juda
  rationale: Die Wendung bezeichnet Bezalels Stammeszugehörigkeit. »Aus dem Stamm Juda« ist im Deutschen natürlich und inhaltlich präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname Gottes. »Jahwe« bewahrt diesen Namen, während »der HERR« ihn durch einen Titel ersetzt.
- issue: Bedeutung von קָרָא ... בְּשֵׁם
  choice: mit Namen berufen
  alternative: beim Namen gerufen
  rationale: Im Zusammenhang wird Bezalel nicht nur angesprochen, sondern ausdrücklich für eine Aufgabe ausgewählt und befähigt. »Berufen« gibt diese Nuance wieder, ohne den im Hebräischen ausdrücklich genannten Namen zu unterschlagen.
- issue: Geschlechtlich markierte Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptübersetzung erhält die männlich und verwandtschaftlich formulierte hebräische Wendung; die Fußnote weist auf die mögliche idiomatische Wiedergabe als Bezeichnung des gesamten Volkes hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen, während Appositionen und Stammesangabe natürlich deutsch angeordnet sind. Archaische Formen werden vermieden; die markante hebräische Verwandtschaftsbezeichnung bleibt bewusst erhalten.
