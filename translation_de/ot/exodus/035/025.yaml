base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: de
  text: 'Und jede Frau, die weise im Herzen[a] war, spann mit ihren Händen. Dann brachten sie das Gesponnene: den blauen und den purpurfarbenen Stoff, das scharlachrote Garn und das feine Leinen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „weise im Herzen“; die hebräische Wendung bezeichnet praktische Geschicklichkeit, die in innerer Weisheit gründet.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das blaue, das purpurfarbene und das scharlachrote Material sowie das feine Leinen“. Der hebräische Text zählt nach „das Gesponnene“ die Materialien auf, ohne ihre textile Form jeweils ausdrücklich zu benennen.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: weise im Herzen
  rationale: Die weitgehend formale Wiedergabe bewahrt das hebräische Bild, in dem innere Weisheit und handwerkliches Können verbunden sind; das Deutsche bleibt verständlich, wenn auch bewusst idiomatisch geprägt.
- source_word: בְּיָדֶיהָ
  choice: mit ihren Händen
  rationale: Gibt das instrumentale בְּ natürlich wieder und betont die eigenhändige Arbeit.
- source_word: טָווּ
  choice: spann
  rationale: Das Verb bezeichnet das Spinnen von Fasern zu Faden oder Garn; der distributive Singular entspricht „jede Frau“.
- source_word: וַיָּבִיאוּ
  choice: Dann brachten sie
  rationale: 'Der Pluralwechsel wird sichtbar bewahrt: Nach „jede Frau“ werden die Frauen als Gruppe bezeichnet.'
- source_word: מַטְוֶה
  choice: das Gesponnene
  rationale: Bezeichnet das durch Spinnen hergestellte Material und gibt den Ausdruck knapp und sachlich wieder.
- source_word: תְּכֵלֶת
  choice: den blauen Stoff
  rationale: Bezeichnet im Heiligtumskontext kostbares blau gefärbtes Textilmaterial; „Stoff“ macht den materiellen Bezug verständlich, ohne eine exakte textile Form vorzutäuschen.
- source_word: אַרְגָּמָן
  choice: den purpurfarbenen Stoff
  rationale: Natürliche deutsche Bezeichnung für das wertvolle purpurgefärbte Textilmaterial.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: das scharlachrote Garn
  rationale: Die Wendung bezeichnet scharlachrot gefärbtes Textilmaterial; „Garn“ verdeutlicht hier den Zusammenhang mit dem Spinnen.
- source_word: שֵׁשׁ
  choice: das feine Leinen
  rationale: Im Kontext der Stiftshütte bezeichnet das Wort gewöhnlich hochwertiges feines Leinen.
