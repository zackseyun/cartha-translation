  text: the table[a], and its poles, and all its utensils, and the bread of the Presence,
translation:
  language: de
  text: den Tisch, seine Tragstangen und alle seine Geräte sowie das Brot der Gegenwart[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
