lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Das Substantiv bezeichnet schlicht den kultischen Tisch. Seine besondere Funktion ergibt sich aus dem anschließend genannten »Brot der Gegenwart«; eine Ergänzung wäre daher überbestimmt.
- source_word: בַּדָּיו
  choice: seine Tragstangen
  rationale: בַּד bezeichnet bei den heiligen Einrichtungsgegenständen die Stangen, mit denen sie getragen wurden. »Tragstangen« ist im modernen Deutschen eindeutig und natürlich.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: כְּלִי ist ein weiter Begriff für Geräte, Gegenstände oder Gefäße. »Geräte« bewahrt diese Bedeutungsbreite und passt zum Zubehör des Tisches.
- source_word: לֶחֶם הַפָּנִים
  choice: das Brot der Gegenwart
  rationale: Die Wendung bedeutet wörtlich »Brot des Angesichts/der Gegenwart«. »Brot der Gegenwart« bewahrt den kultischen Ausdruck, ohne die gemeinte Gegenwart ausdrücklich als die des HERRN auszudeuten.
theological_decisions:
- issue: Wessen Gegenwart mit הַפָּנִים gemeint ist
  choice: Die knappe Formulierung »Brot der Gegenwart« bleibt erhalten.
  alternative: »Brot vor dem HERRN«
  rationale: Der Kontext legt die Gegenwart Gottes nahe, doch der hebräische Wortlaut nennt den Gottesnamen hier nicht. Die Übersetzung vermeidet daher eine stillschweigende Explizierung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Reihung folgt dem hebräischen Listenstil; »sowie« gibt das letzte וְ natürlich wieder. Der Vers ist syntaktisch Teil der Aufzählung des weiteren Zusammenhangs.
