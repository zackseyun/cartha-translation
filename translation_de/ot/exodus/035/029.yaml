base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: de
  text: Jeder Mann und jede Frau, deren Herz sie dazu bewegte, für alle Arbeiten etwas zu bringen, die Jahwe durch Mose auszuführen geboten hatte – die Israeliten brachten Jahwe eine freiwillige Gabe[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Moses«; gemeint ist: durch Mose als Vermittler.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »eine freiwillige Opfergabe« beziehungsweise »eine aus freien Stücken dargebrachte Gabe«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Jeder Mann und jede Frau
  rationale: Gibt die ausdrückliche Nennung beider Geschlechter und die distributive Kraft von כָּל möglichst genau wieder.
- source_word: נָדַב לִבָּם אֹתָם
  choice: deren Herz sie dazu bewegte
  rationale: Die hebräische Wendung bezeichnet eine innere freiwillige Bereitschaft oder einen Antrieb; die Formulierung bleibt bildhaft und ist im Deutschen verständlich.
- source_word: לְהָבִיא
  choice: etwas … zu bringen
  rationale: Das Objekt ist im Hebräischen aus dem Zusammenhang zu ergänzen. „Etwas“ macht die deutsche Satzfügung natürlich, ohne den Inhalt näher festzulegen.
- source_word: לְכָל הַמְּלָאכָה
  choice: für all die Arbeiten
  rationale: מְלָאכָה umfasst hier die verschiedenen Arbeiten am Heiligtum und seiner Ausstattung; der Plural ist im Deutschen kontextgemäß.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: die Jahwe durch Mose auszuführen geboten hatte
  rationale: „Durch Mose“ gibt das hebräische Idiom „durch die Hand Moses“ als Vermittlungsangabe wieder; „auszuführen geboten“ bewahrt den Bezug auf die Arbeiten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: die Israeliten brachten
  rationale: בְנֵי יִשְׂרָאֵל ist hier die übliche Volksbezeichnung; „Israeliten“ ist im modernen Deutsch natürlicher als „Kinder Israel“.
- source_word: נְדָבָה
  choice: eine freiwillige Gabe
  rationale: Bezeichnet eine aus eigenem Antrieb dargebrachte Gabe; die Übersetzung vermeidet den möglichen Eindruck einer besonderen, fest definierten Opferkategorie.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname; „Jahwe“ erhält diesen Charakter, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Charakter der נְדָבָה
  choice: freiwillige Gabe
  alternative: freiwilliges Opfer
  rationale: Der Zusammenhang betrifft Beiträge für die Arbeiten am Heiligtum. „Gabe“ bewahrt die Freiwilligkeit, ohne zwingend ein kultisches Schlacht- oder Speiseopfer anzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederaufnahme mit „die Israeliten brachten“ bildet die markierte hebräische Satzstruktur ab. Die bildhafte Rede vom Herzen bleibt erhalten; erklärungsbedürftige Idiomatik und die Bedeutungsbreite von נְדָבָה werden in Fußnoten kenntlich gemacht.
