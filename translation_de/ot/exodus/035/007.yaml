- source_word: מְאָדָּמִים
  choice: rot gefärbte
  rationale: Die passive beziehungsweise resultative Form bezeichnet Felle, die rot gemacht wurden; im Materialkontext liegt das Färben nahe.
- source_word: עֹרֹת תְּחָשִׁים
  choice: Tachaschhäute
  rationale: Die Tier- oder Materialbezeichnung תְּחָשִׁים ist nicht sicher bestimmbar. Die behutsame Umschrift vermeidet eine unbelegte Festlegung und bewahrt die Ungewissheit des hebräischen Textes.
- source_word: עֲצֵי שִׂטִּים
  choice: Akazienholz
  rationale: Die Wendung bezeichnet Holz von Akazien; „Akazienholz“ ist die klare und gebräuchliche moderne Wiedergabe.
