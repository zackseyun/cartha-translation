base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: de
  text: Und er hat ihm und Oholiab, dem Sohn Ahisamachs vom Stamm Dan, die Fähigkeit zu lehren[a] ins Herz gelegt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „anzuleiten“. Der hebräische Infinitiv kann Lehren im weiteren Sinn bezeichnen, einschließlich der Anleitung zu handwerklicher Arbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: die Fähigkeit zu lehren
  rationale: Der Hifil-Infinitiv von ירה bedeutet hier „lehren“ oder „anleiten“. Die Ergänzung „die Fähigkeit“ macht die Verbindung mit נָתַן בְּלִבּוֹ im Deutschen natürlich und bringt die innere Befähigung zum Ausdruck.
- source_word: נָתַן בְּלִבּוֹ
  choice: hat ihm … ins Herz gelegt
  rationale: Die hebräische Wendung bezeichnet eine innere Befähigung oder Veranlagung. „Ins Herz gelegt“ bewahrt das biblische Bild und ist im modernen Deutschen verständlich.
- source_word: הוּא
  choice: ihm
  rationale: Das ausdrückliche Pronomen hebt Bezalel hervor und wird zusammen mit Oholiab als Empfänger der Befähigung genannt. Die deutsche Wiederaufnahme mit „ihm und Oholiab“ erhält diesen Bezug ohne unnatürliche Überbetonung.
- source_word: וְאָהֳלִיאָב
  choice: und Oholiab
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: dem Sohn Ahisamachs
  rationale: Die Filiationsangabe wird knapp und idiomatisch wiedergegeben.
- source_word: לְמַטֵּה דָן
  choice: vom Stamm Dan
  rationale: Die Präposition לְ bezeichnet hier die Stammeszugehörigkeit; „vom Stamm Dan“ ist im Deutschen präzise und geläufig.
