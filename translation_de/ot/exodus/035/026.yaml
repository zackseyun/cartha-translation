  yaml_path: translation/ot/exodus/035/026.yaml
  text: And all the women whose hearts moved them with skill spun the goats' hair[a].
translation:
  language: de
  text: Und alle Frauen, deren Herz sie dazu bewegte, spannen mit Geschick Ziegenhaar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Ziegen«; gemeint ist in dieser verkürzten Ausdrucksweise das zum Spinnen verwendete Ziegenhaar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: Und alle Frauen
  rationale: כָּל mit einem Substantiv im Plural hat hier kollektiven Sinn; »alle Frauen« ist im Deutschen natürlich und quellennah.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: deren Herz sie dazu bewegte
  rationale: Die hebräische Wendung beschreibt den inneren Antrieb beziehungsweise die Bereitschaft der Frauen. Die Einzahl »Herz« je Person bewahrt die distributive Ausdrucksweise des Hebräischen.
- source_word: בְּחָכְמָה
  choice: und die das nötige Geschick besaßen
  rationale: Im handwerklichen Zusammenhang bezeichnet חָכְמָה praktische Sachkenntnis und Fertigkeit. Die koordinierte Wiedergabe verhindert im Deutschen die missverständliche Lesart, das Herz habe sie »mit Geschick« bewegt.
- source_word: טָווּ
  choice: versponnen
  rationale: Das Verb bezeichnet die Verarbeitung von Fasern durch Spinnen; »versponnen« verbindet sich im Deutschen natürlich mit dem Material als Akkusativobjekt.
- source_word: אֶת הָעִזִּים
  choice: das Ziegenhaar
  rationale: Wörtlich steht »die Ziegen«; im Kontext der Textilherstellung ist das eine Ellipse für das Haar der Ziegen. »Ziegenhaar« gibt den gemeinten Werkstoff verständlich wieder.
