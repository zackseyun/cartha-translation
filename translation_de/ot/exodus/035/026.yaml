translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur macht sowohl den inneren Antrieb als auch die handwerkliche Befähigung sichtbar, ohne die hebräische Wendung unnatürlich wörtlich wiederzugeben.
