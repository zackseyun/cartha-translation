base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: de
  text: Sechs Tage lang darf gearbeitet werden. Aber der siebte Tag soll euch heilig sein, ein Sabbat, ein Tag völliger Ruhe für Jahwe.[a] Wer an ihm Arbeit verrichtet, soll getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Sabbat, Sabbatruhe für Jahwe“. Die hebräische Verbindung verstärkt den Gedanken vollständiger Arbeitsruhe; „für Jahwe“ kann auch „Jahwe geweiht“ oder „Jahwe gehörend“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: darf gearbeitet werden
  rationale: Das Nifal bewahrt die unpersönliche Passivkonstruktion. „Darf“ gibt die rechtliche Erlaubnis für die sechs Tage natürlich wieder, ohne einen bestimmten Handelnden einzuführen.
- source_word: קֹדֶשׁ
  choice: heiligen
  rationale: Das prädikative Substantiv bezeichnet den siebten Tag als ausgesondert und Gott geweiht; im Deutschen ist die adjektivische Wiedergabe natürlich.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: einen heiligen Sabbat … einen Tag völliger Ruhe
  rationale: Die verstärkende Verbindung hebt das vollständige Aufhören von Arbeit hervor. Die Formulierung bleibt verständlich und bewahrt zugleich den Begriff „Sabbat“.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kann Widmung, Zugehörigkeit oder Ausrichtung bezeichnen. „Für Jahwe“ ist idiomatisch und wahrt diese Beziehung, ohne sie enger festzulegen.
- source_word: כָּל הָעֹשֶׂה בוֹ מְלָאכָה
  choice: Wer an diesem Tag irgendeine Arbeit verrichtet
  rationale: „Wer“ gibt den allgemeinen Rechtsfall wieder; „an diesem Tag“ macht den Rückbezug des Pronomens im Deutschen eindeutig.
- source_word: יוּמָת
  choice: muss getötet werden
  rationale: Das Hophal bezeichnet das Verhängen der Todesstrafe im Passiv. „Muss“ gibt die feste Rechtsfolge wieder, ohne das im Hebräischen fehlende verstärkende Infinitiv-Absolutum durch „ganz gewiss“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Gottesnamen יהוה. „Jahwe“ gibt den Bundesnamen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Beziehung des Sabbats zu Jahwe in לַיהוָה
  choice: für Jahwe
  alternative: Jahwe geweiht / Jahwe gehörend
  rationale: Die knappe Formulierung wahrt die mögliche Bedeutung von Widmung beziehungsweise Ausrichtung und legt die Präposition nicht unnötig auf eine einzige Nuance fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die unpersönliche Rechtsform der ersten Aussage und die strenge passive Strafbestimmung bleiben erhalten. „Irgendeine“ verdeutlicht den umfassenden Geltungsbereich von מְלָאכָה im Verbot, ohne eine bestimmte Art von Arbeit festzulegen.
