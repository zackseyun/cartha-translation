  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: de
  text: und den Leuchter für das Licht[a] und seine Geräte und seine Lampen und das Öl für das Licht,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »den Leuchter des Lichts« und »das Öl des Lichts«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: den Leuchter für das Licht
  rationale: מְנוֹרָה bezeichnet hier den Leuchter des Heiligtums. Die Wiedergabe „für das Licht“ drückt die hebräische Genitivverbindung natürlich aus und hält zugleich die Wiederholung von מָאוֹר im Vers sichtbar.
- source_word: כֵּלֶיהָ
  choice: seinen Geräten
  rationale: כְּלִי ist eine breite Bezeichnung für Geräte, Gefäße oder Zubehör. „Geräte“ ist im Zusammenhang der Ausstattung des Heiligtums verständlich und vermeidet eine unnötige Festlegung auf Gefäße.
- source_word: נֵרֹתֶיהָ
  choice: seinen Lampen
  rationale: נֵר bezeichnet eine Lampe beziehungsweise deren Licht. Hier sind die einzelnen zum Leuchter gehörenden Lampen gemeint; „Lampen“ ist die klare und übliche Wiedergabe.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: das Öl für das Licht
  rationale: Die Formulierung bewahrt die Parallele zu מְנֹרַת הַמָּאוֹר und gibt die Zweckbeziehung im Deutschen natürlich wieder, ohne sie zum engeren Begriff „Lampenöl“ zu verdichten.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: und ... samt ... und ... und
  rationale: Die Aufzählungsstruktur bleibt deutlich erhalten. „Samt“ verbindet den Leuchter idiomatisch mit seinen zugehörigen Geräten, während die wiederholten „und“ den Inventarcharakter des Hebräischen hörbar machen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Teil der fortlaufenden Aufzählung kleingeschrieben und endet mit einem Komma. Die etwas markante Wiederholung „für das Licht“ bildet die Wiederholung des hebräischen מָאוֹר ab.
