  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: de
  text: Da kamen alle, die ihr Herz dazu antrieb[a], und alle, deren Geist sie willig machte. Sie brachten die Gabe für Jahwe[b] für die Arbeit am Zelt der Begegnung, für den gesamten Dienst daran und für die heiligen Gewänder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »deren Herz sie erhob«. Gemeint ist ein innerer Antrieb oder Impuls.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Jahwes Gabe«. Die hebräische Verbindung kann eine Jahwe gehörende oder für ihn bestimmte Gabe bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: בוא bedeutet schlicht »kommen«. Das einleitende »Da« gibt den hebräischen Erzählfortgang natürlich wieder, ohne das kontextuell mögliche, aber stärker deutende »traten vor« einzutragen.
- source_word: כָּל אִישׁ
  choice: alle
  rationale: Wörtlich steht »jeder Mann«; hier ist die Form generisch und distributiv auf alle einzelnen Beitragenden bezogen. »Alle« ist im modernen Deutschen natürlich und schließt keine unbegründete Geschlechtsbeschränkung ein.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: die ihr Herz dazu antrieb
  rationale: Die hebräische Wendung lautet bildhaft »dessen Herz ihn erhob/trug«. »Ihr Herz trieb sie dazu an« bewahrt das innere Drängen und bleibt im Deutschen verständlich; die wörtlichere Metapher wird in der Fußnote genannt.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: und alle, deren Geist sie willig machte
  rationale: נדב bezeichnet hier freiwillige Bereitschaft beziehungsweise großzügigen inneren Antrieb. Die Formulierung bewahrt sowohl den Geist als handelndes inneres Moment als auch die Freiwilligkeit.
- source_word: הֵבִיאוּ
  choice: Sie brachten
  rationale: Das einfache »brachten« entspricht dem konkreten Herbeibringen der Gaben. Ein neuer Satz macht den Wechsel von den generischen Singularformen zum pluralischen Verb im Deutschen klar.
- source_word: תְּרוּמַת יְהוָה
  choice: die Abgabe für Jahwe
  rationale: תְּרוּמָה bezeichnet eine ausgesonderte Abgabe oder Gabe. »Abgabe« passt zum materiellen Sammlungskontext; »für Jahwe« gibt die wahrscheinliche Bestimmung wieder, während die mögliche Genitivnuance in der Fußnote offengehalten wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לִמְלֶאכֶת
  choice: für die Arbeit am
  rationale: מְלָאכָה meint hier die Arbeit beziehungsweise Aufgabe bei der Herstellung und Ausstattung des Heiligtums. »Arbeit am« ist breit genug und im Deutschen idiomatisch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die feste Bezeichnung wird sachlich und verständlich als »Zelt der Begegnung« wiedergegeben.
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: für den gesamten Dienst daran
  rationale: עֲבֹדָה kann Arbeit oder Dienst bedeuten; im Heiligtumskontext ist »Dienst« angemessen. »Daran« macht den Bezug des Suffixes auf das Zelt deutlich, ohne ihn inhaltlich weiter auszulegen.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: und für die heiligen Gewänder
  rationale: Die Wendung bezeichnet die für den heiligen Dienst bestimmten priesterlichen Gewänder. »Heilige Gewänder« ist präzise, geläufig und würdig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen ausdrücklich. Die Transliteration »Jahwe« bewahrt diese Unterscheidung gegenüber dem Titel »Herr«.
- issue: Beziehung in תְּרוּמַת יְהוָה
  choice: Abgabe für Jahwe
  alternative: Jahwes Abgabe
  rationale: Der hebräische Genitiv kann Zugehörigkeit oder Bestimmung ausdrücken. Im Sammlungskontext ist eine Jahwe gewidmete Abgabe am wahrscheinlichsten; die alternative Form wird in der Fußnote bewahrt, ohne daraus eine besondere Lehrentscheidung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Wendungen über Herz und Geist bleiben erhalten. Der Vers wird zur besseren deutschen Lesbarkeit nach der Aufzählung in zwei Sätze gegliedert; die inhaltliche und syntaktische Beziehung bleibt gewahrt.
