lexical_decisions:
- source_word: וְלַחְשֹׁב מַחֲשָׁבֹת
  choice: und kunstvolle Entwürfe zu planen
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv betont schöpferische, fachkundige Planung. Eine wörtliche Nachbildung wie „Pläne zu planen“ wäre im Deutschen schwerfällig; „kunstvolle Entwürfe zu planen“ gibt den Sinn im handwerklich-künstlerischen Zusammenhang natürlich wieder.
- source_word: לַעֲשֹׂת
  choice: und sie … auszuführen
  rationale: Das allgemeine Verb עשה bezeichnet hier die handwerkliche Umsetzung der zuvor genannten Entwürfe. Das ergänzte Pronomen „sie“ stellt im Deutschen den natürlichen Bezug zu den Entwürfen her.
- source_word: בַּזָּהָב
  choice: in Gold
  rationale: Die Präposition ב bezeichnet hier das Material beziehungsweise den Bereich der handwerklichen Arbeit; „in Gold“ ist dafür idiomatisch.
- source_word: וּבַכֶּסֶף
  choice: Silber
  rationale: כֶּסֶף bezeichnet in dieser Materialliste Silber. Die Präposition wird im Deutschen für die koordinierte Reihe nicht wiederholt.
- source_word: וּבַנְּחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen. Im Zusammenhang der Stiftshütte ist „Bronze“ die geläufige und plausible Wiedergabe, ohne die stoffliche Frage völlig eindeutig zu machen.
