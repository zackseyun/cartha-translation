id: EXO.35.10
reference: Exodus 35:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל חֲכַם לֵ֖ב בָּ/כֶ֑ם יָבֹ֣אוּ וְ/יַעֲשׂ֔וּ אֵ֛ת כָּל אֲשֶׁ֥ר צִוָּ֖ה יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: de
  text: 'Und jeder Sachkundige[a][b] unter euch soll kommen und alles anfertigen, was Jahwe geboten hat:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jeder, der weisen Herzens ist“; die hebräische Redewendung bezeichnet hier jemanden mit praktischem, besonders handwerklichem Können.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „alle Sachkundigen unter euch“. Der hebräische Ausdruck steht grammatisch im maskulinen Singular, wird aber distributiv gebraucht und ist mit Verben im Plural verbunden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: Und jeder
  rationale: וְ verbindet den Vers mit der vorherigen Aufforderung; כָל vor dem singularischen Ausdruck hat hier distributive Bedeutung und wird daher mit „jeder“ wiedergegeben.
- source_word: חֲכַם לֵב
  choice: Sachkundige
  rationale: Die Wendung bedeutet wörtlich „weise am Herzen“, bezeichnet in diesem Zusammenhang jedoch praktische Befähigung und handwerkliches Können. „Sachkundige“ gibt diesen funktionalen Sinn knapp und natürlich wieder.
- source_word: בָּ/כֶם
  choice: unter euch
  rationale: Die Präposition ב mit dem Suffix der 2. Person Plural bezeichnet hier die Zugehörigkeit beziehungsweise den Ort innerhalb der Gemeinschaft.
- source_word: יָבֹאוּ
  choice: soll kommen
  rationale: Der Imperfekt steht in einer auffordernden Anweisung. Das hebräische Pluralverb folgt auf ein distributiv gebrauchtes singularisches Subjekt; im Deutschen wird die Kongruenz mit dem Singular hergestellt.
- source_word: וְ/יַעֲשׂוּ
  choice: und … anfertigen
  rationale: עָשָׂה kann „tun“ oder „machen“ bedeuten; beim Bau des Heiligtums und seiner Geräte bezeichnet „anfertigen“ die konkrete handwerkliche Tätigkeit präzise.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles …, was
  rationale: Die Verbindung aus Objektmarker, כָל und Relativpartikel umfasst die Gesamtheit der anschließend genannten Arbeiten.
- source_word: צִוָּה יְהוָה
  choice: was Jahwe geboten hat
  rationale: Das Perfekt bezeichnet das bereits ergangene Gebot. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext verwendet den Eigennamen יהוה. „Jahwe“ bewahrt ihn als Gottes offenbarten Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlecht und distributive Bedeutung von חֲכַם לֵב
  choice: jeder Sachkundige
  alternative: alle Sachkundigen / alle, die sachkundig sind
  rationale: Der hebräische Ausdruck ist grammatisch maskulin und singularisch, hat mit כָל jedoch distributive Kraft. Die deutsche Form bewahrt diese Struktur, ohne ausdrücklich „Mann“ hinzuzufügen; eine kollektiv-inklusive Wiedergabe bleibt sachlich möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sachkundige“ ist im Baukontext verständlich und vermeidet sowohl die schwer verständliche Lehnübersetzung „weisen Herzens“ als auch die ausdrückliche Beschränkung auf Männer. Der Doppelpunkt bleibt erhalten, weil in den folgenden Versen die angeordneten Werkstücke aufgezählt werden.
