lexical_decisions:
- source_word: שֶׁמֶן
  choice: Öl
  rationale: Das Substantiv bezeichnet allgemein Öl, in diesem Zusammenhang gewöhnlich Olivenöl. „Öl“ gibt den hebräischen Wortlaut wieder, ohne eine nicht ausdrücklich genannte Spezifizierung einzufügen.
- source_word: לַמָּאוֹר
  choice: für das Licht
  rationale: מָאוֹר bezeichnet Licht oder einen Lichtträger. In dieser Materialliste ist Öl zur Beleuchtung gemeint; „für das Licht“ bewahrt zugleich die nominale Form des Hebräischen.
- source_word: בְשָׂמִים
  choice: Gewürze
  rationale: Der Plural bezeichnet aromatische Stoffe für die kultische Zubereitung. „Gewürze“ ist im modernen Deutsch verständlich und hinreichend weit.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die Constructusverbindung bezeichnet das für die Salbung bestimmte, bekannte kultische Öl. „Salböl“ ist die natürliche und etablierte deutsche Entsprechung.
- source_word: קְטֹרֶת
  choice: Weihrauch
  rationale: Im Heiligtumskontext bezeichnet das Wort das als Räucherwerk verbrannte Gemisch. „Weihrauch“ ist die geläufige deutsche Wiedergabe, auch wenn es im heutigen Sprachgebrauch mitunter enger verstanden werden kann.
- source_word: הַסַּמִּים
  choice: duftenden
  rationale: קְטֹרֶת הַסַּמִּים bedeutet wörtlich etwa „Räucherwerk der Duftstoffe/Gewürze“. „Duftender Weihrauch“ gibt die aromatische Eigenschaft in natürlichem Deutsch wieder; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
