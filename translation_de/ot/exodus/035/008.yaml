translation:
  language: de
  text: Öl für die Beleuchtung und Gewürze für das Salböl und für das duftende Räucherwerk[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Räucherwerk aus Gewürzen“; auch: „aromatisches Räucherwerk“.'
