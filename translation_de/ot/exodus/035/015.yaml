source:
  edition: WLC
  text: וְ/אֶת מִזְבַּ֤ח הַ/קְּטֹ֨רֶת֙ וְ/אֶת בַּדָּ֔י/ו וְ/אֵת֙ שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וְ/אֵ֖ת קְטֹ֣רֶת הַ/סַּמִּ֑ים וְ/אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לְ/פֶ֥תַח הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: de
  text: den Räucheraltar und seine Tragstangen, das Salböl, das duftende Räucherwerk[a] und den Vorhang für den Eingang der Wohnung[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: das Räucherwerk aus Duftstoffen; auch: das Gewürzräucherwerk.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: der Stiftshütte.'
    reason: translation_tradition
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: Räucheraltar
  rationale: Die deutsche Zusammensetzung gibt die Konstruktverbindung natürlich und kultisch eindeutig wieder.
- source_word: בַּדָּיו
  choice: seine Tragstangen
  rationale: Im Kontext der Stiftshütte sind die zum Tragen der heiligen Geräte bestimmten Stangen gemeint; „Tragstangen“ ist präziser als das bloße „Stangen“.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: „Salböl“ ist die geläufige, knappe deutsche Bezeichnung für das zur rituellen Salbung bestimmte Öl.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: das duftende Räucherwerk
  rationale: סַמִּים bezeichnet hier aromatische Stoffe beziehungsweise Gewürze. Die Wiedergabe vermittelt den Duftcharakter idiomatisch, ohne eine genaue Rezeptur hinzuzufügen.
- source_word: מָסַךְ הַפֶּתַח
  choice: den Vorhang für den Eingang
  rationale: מָסָךְ bezeichnet hier einen am Eingang angebrachten textilen Abschluss; „Vorhang“ ist im modernen Deutschen natürlich und sachgerecht.
- source_word: לְפֶתַח הַמִּשְׁכָּן
  choice: für den Eingang der Wohnung
  rationale: Das ל kennzeichnet die Zuordnung beziehungsweise Bestimmung des Vorhangs für den Eingang. Die Formulierung vermeidet eine unnatürliche Wiederholung.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: „Wohnung“ bewahrt die Grundbedeutung des hebräischen Begriffs als Gottes Wohnstätte und ist in diesem Zusammenhang verständlich; traditionell wird auch „Stiftshütte“ gebraucht.
theological_decisions:
- issue: Bezeichnung des מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte
  rationale: Die Übersetzung folgt der lexikalischen Grundbedeutung und wahrt die Vorstellung von Gottes Wohnen unter Israel, ohne eine konfessionell geprägte Sonderdeutung einzutragen. Die traditionelle Benennung wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende Syntax des Hebräischen bleibt erkennbar, wird aber durch den im Deutschen natürlichen Verzicht auf wiederholtes „und“ geglättet. „Wohnung“ wird innerhalb des Exodus-Kontexts als feststehende Bezeichnung für das Heiligtum verstanden.
