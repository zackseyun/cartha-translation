  source_fidelity: 'Der Entwurf gibt sämtliche hebräischen Satzglieder vollständig und in ihrer Reihenfolge wieder: den Räucheraltar (מִזְבַּח הַקְּטֹרֶת), dessen Tragstangen, das Salböl, das Räucherwerk aus aromatischen Stoffen sowie den Eingangsvorhang der Wohnstätte. „Tragstangen“ ist kontextuell präzise. „Duftende[s] Räucherwerk“ gibt die aromatische Qualität von הַסַּמִּים angemessen wieder, ohne die Stoffe unnötig zu spezifizieren. „Für den Eingang der Wohnung“ bildet die Zuordnung durch לְפֶתַח natürlich ab.'
