  text: in the cutting of stones for setting[a], and in the carving of wood, to do every kind of skillful work.
translation:
  language: de
  text: im Bearbeiten von Steinen zum Einsetzen und im Schnitzen von Holz, um jede Art kunstvoller Arbeit auszuführen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jede Art planvoll gestalteter Arbeit“; auch „jede Art kunstfertiger Arbeit“. Das hebräische Wort bezeichnet Arbeit, die mit Planung, Gestaltung und handwerklichem Können ausgeführt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: im Bearbeiten / im Schnitzen
  rationale: חֲרֹשֶׁת bezeichnet fachkundige handwerkliche Bearbeitung. Bei Stein bleibt „Bearbeiten“ weit genug für Schneiden oder Gravieren; bei Holz gibt „Schnitzen“ den materialspezifischen Vorgang natürlich wieder.
- source_word: אֶבֶן
  choice: Steinen
  rationale: Der hebräische Singular bezeichnet hier Stein als Werkstoff beziehungsweise Steine allgemein. Der deutsche Plural klingt im Zusammenhang mit einzusetzenden Schmucksteinen natürlich.
- source_word: לְמַלֹּאת
  choice: zum Einsetzen
  rationale: Im Zusammenhang mit den Arbeiten am Heiligtum geht es darum, Steine in Fassungen einzusetzen, nicht um das allgemeine „Füllen“.
- source_word: עֵץ
  choice: Holz
  rationale: עֵץ bezeichnet hier den Werkstoff Holz und keinen lebenden Baum.
- source_word: לַעֲשׂוֹת
  choice: auszuführen
  rationale: Bei „Arbeit“ ist „ausführen“ im modernen Deutschen natürlicher als das wörtlichere „tun“, ohne den allgemeinen Sinn von עשה einzuengen.
- source_word: בְּכָל מְלֶאכֶת
  choice: jede Art ... Arbeit
  rationale: Die Formulierung gibt den umfassenden beziehungsweise distributiven Sinn idiomatisch wieder.
- source_word: מַחֲשָׁבֶת
  choice: kunstvoller
  rationale: Das Wort bezeichnet Arbeit, die geplant, entworfen und fachkundig gestaltet ist. „Kunstvoll“ passt zum handwerklich-künstlerischen Kontext, ohne nur technische Fertigkeit auszudrücken.
