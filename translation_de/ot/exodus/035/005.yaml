base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: de
  text: 'Nehmt aus eurem Besitz eine Gabe für Jahwe[a]. Jeder, dessen Herz willig ist, soll sie bringen – die Gabe für Jahwe: Gold, Silber und Bronze[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jahwe“ gibt den hebräischen Gottesnamen יהוה (JHWH) wieder, der traditionell auch mit „der HERR“ wiedergegeben wird.
    reason: divine_name
  - marker: b
    text: 'Oder: „Kupfer“. Das hebräische Wort kann Kupfer oder eine daraus hergestellte Legierung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Nehmt
  rationale: Der Qal-Imperativ Plural von לקח ist eine direkte Aufforderung an die versammelte Gemeinschaft. „Nehmt“ gibt die Grundbedeutung wieder, ohne bereits eine organisierte Sammlung vorauszusetzen.
- source_word: מֵאִתְּכֶם
  choice: aus eurer Mitte
  rationale: Die Präposition mit Suffix bezeichnet die Herkunft aus der Gemeinschaft. „Aus eurer Mitte“ bewahrt diesen gemeinschaftlichen Bezug.
- source_word: תְּרוּמָה
  choice: Abgabe
  rationale: Hier bezeichnet תְּרוּמָה eine für einen heiligen Zweck ausgesonderte freiwillige Sachgabe. „Abgabe“ passt zu den anschließend genannten Materialien und vermeidet die im Deutschen oft kultisch enger verstandene Bezeichnung „Opfer“.
- source_word: לַיהוָה / יְהוָה
  choice: für Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Präposition ל kennzeichnet die Bestimmung der Abgabe.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: Jeder, dessen Herz bereit ist
  rationale: Die Formulierung bewahrt das hebräische Bild vom Herzen und bezeichnet eine freiwillige innere Bereitschaft. „Jeder“ ist hier generisch und schränkt die angesprochene Gemeinschaft nicht auf Männer ein.
- source_word: יְבִיאֶהָ
  choice: soll sie bringen
  rationale: Das Hifil-Imperfekt mit femininem Objektsuffix verweist auf die Abgabe. „Soll sie bringen“ drückt die erwartete Handlung aus, ohne die zuvor betonte Freiwilligkeit in Zwang umzudeuten.
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: die Abgabe für Jahwe
  rationale: Die appositionelle Wendung nimmt die Abgabe erneut auf und bezeichnet ihre Bestimmung. Die Wiederholung bleibt erhalten.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: Gold, Silber und Bronze
  rationale: Gold und Silber sind eindeutig. נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen; im Zusammenhang antiker Geräte ist „Bronze“ die herkömmliche und plausible Wiedergabe, während die lexikalische Offenheit in einer Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den offenbarten Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Freiwilligkeit der Abgabe
  choice: „Jeder, dessen Herz bereit ist“
  alternative: „Jeder muss bringen“
  rationale: כֹּל נְדִיב לִבּוֹ hebt die innere Bereitwilligkeit hervor. Die Aufforderung an die Gemeinschaft darf daher nicht so formuliert werden, als müsse jedes einzelne Mitglied zwingend etwas geben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch Gedankenstrich und natürliche deutsche Wortstellung gut lesbar gemacht. Das Herzbild und die Wiederholung der Abgabe für Jahwe bleiben erhalten.
