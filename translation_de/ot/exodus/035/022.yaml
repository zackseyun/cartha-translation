  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: de
  text: Da kamen die Männer zusammen mit den Frauen.[a] Alle, deren Herz bereitwillig war, brachten Spangen, Ohrringe, Ringe und Schmuckstücke – allerlei goldenen Schmuck.[b] Auch jeder Mann brachte Jahwe Gold als Schwingopfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier etwa „die Männer über/bei den Frauen“. Gemeint ist wahrscheinlich, dass die Männer zusammen mit den Frauen kamen oder zusätzlich zu ihnen hinzukamen.
    reason: alternative_reading
  - marker: b
    text: Die genaue Bedeutung mehrerer Schmuckbezeichnungen ist unsicher. „Spangen“ kann auch Ringe oder Verschlüsse meinen; „Ohrringe“ können Nasenringe sein; bei „Schmuckstücke“ könnte es sich etwa um Anhänger oder Armreifen handeln.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Die waw-consecutive-Form führt die Erzählung weiter; „Da“ gibt die zeitlich-folgernde Verbindung im Deutschen natürlich wieder.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: die Männer zusammen mit den Frauen
  rationale: עַל ist hier nicht sinnvoll räumlich zu verstehen. Die Formulierung bezeichnet wahrscheinlich gemeinsames Kommen oder das Hinzukommen der Männer zu den Frauen; die Fußnote hält diese Mehrdeutigkeit offen.
- source_word: כֹּל נְדִיב לֵב
  choice: Alle, deren Herz bereitwillig war
  rationale: Die Wendung beschreibt eine freiwillige, freigebige innere Haltung und bewahrt zugleich das hebräische Bild des Herzens.
- source_word: חָח
  choice: Spangen
  rationale: Der genaue Schmuckgegenstand ist unsicher; „Spangen“ ist eine plausible, nicht übermäßig enge Wiedergabe.
- source_word: נֶזֶם
  choice: Ohrringe
  rationale: Das Wort kann einen am Ohr oder an der Nase getragenen Ring bezeichnen. „Ohrringe“ ist im Schmuckverzeichnis eine natürliche Hauptlesart; die Alternative steht in der Fußnote.
- source_word: טַבַּעַת
  choice: Ringe
  rationale: „Ringe“ bewahrt die sichere Grundbedeutung, ohne die nicht ausdrücklich festgelegte Funktion als Siegelring einzutragen.
- source_word: כוּמָז
  choice: Schmuckstücke
  rationale: Das seltene Wort bezeichnet offenbar einen Schmuckgegenstand, dessen genaue Art ungewiss ist. Der Oberbegriff vermeidet falsche Präzision.
- source_word: כָּל כְּלִי זָהָב
  choice: allerlei goldenen Schmuck
  rationale: כְּלִי bedeutet allgemein Gegenstand oder Gerät; im unmittelbaren Schmuckverzeichnis ist „goldener Schmuck“ eine natürliche kontextuelle Wiedergabe.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: ein Schwingopfer aus Gold darbrachte
  rationale: Die Wortgruppe verwendet kultische Sprache für ein durch Schwingen beziehungsweise Erheben dargebrachtes Opfer. „Schwingopfer“ erhält diese rituelle Besonderheit.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Die Transliteration bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Formulierung in וְכָל אִישׁ
  choice: jeder Mann
  alternative: jeder / alle
  rationale: אִישׁ bezeichnet hier ausdrücklich einen Mann. Diese Form wird nicht zu einer geschlechtsneutralen Sammelbezeichnung verallgemeinert.
- issue: Ergänzung eines Prädikats im letzten Satzteil
  choice: tat es
  alternative: ohne ergänztes Prädikat als Satzfragment
  rationale: Der hebräische Satzteil ist knapp und enthält nach „jeder Mann, der …“ kein eigenständiges Hauptverb. „Tat es“ macht die Aussage im Deutschen grammatisch vollständig, ohne eine zusätzliche Handlung einzuführen; die formale Besonderheit wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Hebräische Körper- und Kultbilder bleiben erhalten, während unsichere Schmuckbegriffe in der Fußnote erläutert werden.
