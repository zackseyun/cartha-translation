  text: onyx stones[a], and stones for setting, for the ephod and for the breastpiece.
translation:
  language: de
  text: Onyxsteine[a] und Steine zum Einsetzen für das Efod und für die Brusttasche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שֹׁהַם (Schoham) wird traditionell mit „Onyx“ wiedergegeben; welche Edelsteinart genau gemeint ist, bleibt jedoch unsicher. Möglich sind auch Beryll oder schlicht „Schoham-Stein“.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: Onyxsteine
  rationale: שֹׁהַם bezeichnet einen Edelstein, dessen genaue mineralogische Bestimmung unsicher ist. „Onyx“ ist die traditionelle und im Heiligtumskontext etablierte Wiedergabe; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: אַבְנֵי מִלֻּאִים
  choice: Steine zum Einsetzen
  rationale: מִלֻּאִים bezeichnet hier Steine, die in die priesterlichen Kleidungsstücke eingesetzt beziehungsweise gefasst werden sollen. Die funktionale Formulierung ist im modernen Deutsch klar und bleibt nah am hebräischen Sinn.
- source_word: לָאֵפֹד
  choice: für das Efod
  rationale: אֵפֹד ist ein kultischer Fachbegriff für ein priesterliches Kleidungsstück. Die eingedeutschte Transliteration „Efod“ bewahrt die sachliche Besonderheit des Begriffs.
- source_word: וְלַחֹשֶׁן
  choice: und für die Brusttasche
  rationale: חֹשֶׁן bezeichnet das mit Edelsteinen besetzte Bruststück des Hohepriesters. „Brusttasche“ vermeidet die militärische Nebenbedeutung von „Brustpanzer“ und entspricht der taschenartigen Ausführung, ohne die kultische Funktion unnötig auszudeuten.
theological_decisions: []
