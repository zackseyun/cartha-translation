  text: וְ/הִקְטִ֥יר עָלָ֛י/ו אַהֲרֹ֖ן קְטֹ֣רֶת סַמִּ֑ים בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר בְּ/הֵיטִיב֛/וֹ אֶת הַ/נֵּרֹ֖ת יַקְטִירֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: de
  text: Aaron soll darauf Morgen für Morgen[a] wohlriechendes Räucherwerk verbrennen. Wenn er die Lampen zurechtmacht[b], soll er es verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »am Morgen, am Morgen«. Die Wiederholung betont die regelmäßige tägliche Ausführung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wenn er die Lampen in Ordnung bringt«; dazu konnte insbesondere das Herrichten der Dochte gehören.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: soll … verbrennen
  rationale: Das Hifil von קטר bezeichnet im kultischen Zusammenhang das Verbrennen, bei dem Räucherwerk als Rauch aufsteigt. Die gewählte Formulierung ist natürlich und wahrt den Ritualbezug.
- source_word: עָלָיו
  choice: darauf
  rationale: Das Pronomen verweist auf den Räucheraltar im vorhergehenden Zusammenhang und bewahrt die örtliche Bedeutung.
- source_word: קְטֹרֶת סַמִּים
  choice: wohlriechendes Räucherwerk
  rationale: קְטֹרֶת bezeichnet Räucherwerk, סַמִּים dessen aromatische Bestandteile. Die Verbindung gibt den Sinn idiomatisch wieder, ohne die Zusammensetzung näher festzulegen.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die hebräische Wiederholung drückt die regelmäßige tägliche Wiederkehr aus und wird in einer ähnlich wiederholenden deutschen Wendung bewahrt.
- source_word: בְּהֵיטִיבוֹ
  choice: wenn er … zurechtmacht
  rationale: Das Hifil von יטב meint hier, die Lampen gebrauchsfertig zu machen beziehungsweise in Ordnung zu bringen. „Zurechtmacht“ wahrt die Breite des Ausdrucks, ohne ihn allein auf das Kürzen der Dochte zu beschränken.
- source_word: הַנֵּרֹת
  choice: die Lampen
  rationale: Der Ausdruck bezeichnet die bereits aus dem Zusammenhang bekannten Heiligtumslampen.
- source_word: יַקְטִירֶנָּה
  choice: soll er es verbrennen
  rationale: Das feminine Suffix nimmt קְטֹרֶת wieder auf. Das deutsche Pronomen erhält diesen Rückbezug und vermeidet unnötige Wiederholung.
theological_decisions: []
