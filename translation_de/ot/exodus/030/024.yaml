  text: וְ/קִדָּ֕ה חֲמֵ֥שׁ מֵא֖וֹת בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ וְ/שֶׁ֥מֶן זַ֖יִת הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/024.yaml
  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: de
  text: und 500 Schekel Kassia nach dem Schekel des Heiligtums sowie ein Hin Olivenöl.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Hin war ein antikes Flüssigkeitsmaß; häufig wird es auf ungefähr 3,5 bis 4 Liter geschätzt.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: Kassia
  rationale: קִדָּה bezeichnet die aromatische Kassiarinde; „Kassia“ ist im Deutschen die präzise und knappe Bezeichnung und passt zur Zutatenliste.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: '500'
  rationale: Die Kardinalzahl gibt unmittelbar die Menge der Kassia an.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: gewogen nach dem Schekel des Heiligtums
  rationale: Die Wendung bezeichnet den maßgeblichen Gewichtsstandard. Die Ergänzung „gewogen“ macht diese Funktion im Deutschen natürlich und eindeutig, ohne den Inhalt zu verändern.
- source_word: שֶׁמֶן זַיִת
  choice: Olivenöl
  rationale: Die hebräische Genitivverbindung wird im Deutschen idiomatisch mit „Olivenöl“ wiedergegeben.
- source_word: הִין
  choice: ein Hin
  rationale: Hin ist eine bestimmte antike Flüssigkeitsmaßeinheit. Ihre Beibehaltung wahrt die historische Genauigkeit; eine ungefähre moderne Entsprechung wird in der Fußnote erläutert.
- source_word: וְ
  choice: und … sowie
  rationale: Die Konjunktionen verbinden die Zutaten mit der vorausgehenden Aufzählung. Die Variation „und … sowie“ ergibt im Deutschen eine flüssige Aufzählung.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die antiken Maßeinheiten bleiben erhalten; der Gewichtsstandard wird durch „gewogen nach“ idiomatisch verdeutlicht. Der Fußnotenmarker steht nach der Maßeinheit samt zugehöriger Zutat, da sich die Anmerkung auf „Hin“ bezieht.
