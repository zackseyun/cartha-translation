  source_fidelity: 'Die Übersetzung gibt die hebräische Anweisungsfolge angemessen wieder: וְעָשִׂיתָ als fortgeführte Weisung („Und du sollst ... machen“), מִזְבֵּחַ als „Altar“, מִקְטַר קְטֹרֶת funktional und transparent als „zum Verbrennen von Räucherwerk“ sowie עֲצֵי שִׁטִּים als „Akazienholz“. Die erneute Aufforderung תַּעֲשֶׂה אֹתוֹ wird durch die Wiederholung von „machen“ sachgerecht erhalten.'
