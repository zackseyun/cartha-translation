source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ מִזְבֵּ֖חַ מִקְטַ֣ר קְטֹ֑רֶת עֲצֵ֥י שִׁטִּ֖ים תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/001.yaml
  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: de
  text: Und du sollst einen Altar zum Verbrennen von Räucherwerk[a] machen; aus Akazienholz sollst du ihn machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch kürzer: „einen Räucheraltar“. Wörtlicher lautet das Hebräische: „einen Altar zum Verbrennen von Räucherwerk“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und du sollst ... machen
  rationale: Das Qal-Perfekt 2. Person maskulin Singular mit vorangestelltem וְ führt die Anweisungsfolge weiter. Die Formulierung bewahrt sowohl den Anschluss als auch den gebietenden Charakter.
- source_word: מִזְבֵּחַ
  choice: einen Altar
  rationale: „Altar“ ist die übliche und sachlich genaue Wiedergabe; der unbestimmte Artikel entspricht der erstmaligen Einführung dieses Gegenstands.
- source_word: מִקְטַר קְטֹרֶת
  choice: zum Verbrennen von Räucherwerk
  rationale: Die Konstruktverbindung bezeichnet das Verbrennen beziehungsweise Darbringen von Räucherwerk. Die gewählte Formulierung gibt die Funktion des Altars transparent wieder, ohne die hebräische Wendung vorschnell zu einem festen Titel zu verdichten.
- source_word: עֲצֵי שִׁטִּים
  choice: Akazienholz
  rationale: Die hebräische Wendung bezeichnet Holz von Akazien und wird im Deutschen natürlich und präzise mit „Akazienholz“ wiedergegeben.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: sollst du ihn machen
  rationale: Das Imperfekt 2. Person maskulin Singular setzt die Anweisung fort und nimmt den Altar nochmals auf. Die Wiederholung von „machen“ erhält die nachdrückliche Wiederaufnahme des hebräischen Satzes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Wiederholung von „machen“. „Räucherwerk“ ist im kultischen Zusammenhang präziser als das im heutigen Deutsch oft anders verstandene „Weihrauch“.
