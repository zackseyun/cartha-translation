source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: de
  text: Wenn sie in das Zelt der Begegnung hineingehen, sollen sie sich mit Wasser waschen, damit sie nicht sterben[a]; oder wenn sie an den Altar herantreten, um dort Dienst zu tun und für Jahwe ein Feueropfer[b] in Rauch aufgehen zu lassen,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und sie werden nicht sterben“; dem Zusammenhang nach auch: „damit sie ja nicht sterben“.'
    reason: Bewahrt die formale Koordination und die mögliche Zweck- beziehungsweise Folgenuance von וְלֹא יָמֻתוּ.
  - marker: b
    text: 'Oder: „eine durch Feuer dargebrachte Opfergabe“; der genaue Sinn des hebräischen Fachbegriffs ist umstritten.'
    reason: Kennzeichnet die lexikalische Unsicherheit bei אִשֶּׁה, ohne die kultische Verbrennung zu verdecken.
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Wenn sie … hineingehen
  rationale: Die Präposition בְּ mit Infinitivus constructus und Suffix bezeichnet hier den Zeitpunkt. „Hineingehen“ gibt die Bewegung in das Zelt natürlich und präzise wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtum, an dem Gott Israel begegnet. „Zelt der Begegnung“ bewahrt diesen Sinn in verständlichem modernem Deutsch.
- source_word: יִרְחֲצוּ מַיִם
  choice: sollen sie sich mit Wasser waschen
  rationale: Das Verb bezeichnet hier die vorgeschriebene kultische Waschung. Das reflexive „sich waschen“ ist im Deutschen idiomatisch; „mit Wasser“ wird entsprechend dem Hebräischen ausdrücklich beibehalten.
- source_word: וְלֹא יָמֻתוּ
  choice: damit sie nicht sterben
  rationale: Die formal mit „und“ angeschlossene Klausel bezeichnet im Zusammenhang die durch das Waschen abzuwendende Todesfolge. Die Fußnote erhält die formnähere Alternative.
- source_word: אוֹ
  choice: oder
  rationale: Die einfache disjunktive Konjunktion leitet den zweiten Anlass ein, bei dem die Waschung erforderlich ist.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: wenn sie an den Altar herantreten
  rationale: נגשׁ bezeichnet das Näherkommen beziehungsweise Herantreten und hat hier einen kultischen Bezug.
- source_word: לְשָׁרֵת
  choice: um dort Dienst zu tun
  rationale: Die Form bezeichnet den priesterlichen Dienst. „Dienst tun“ ist würdig und verständlich, ohne eine zusätzliche Amtsbezeichnung einzutragen.
- source_word: לְהַקְטִיר
  choice: in Rauch aufgehen zu lassen
  rationale: Der Hifil von קטר bezeichnet im Opferkontext das Verbrennen, durch das die Opfergabe als Rauch aufsteigt. Diese Wiedergabe ist präziser als das allgemeinere „verbrennen“.
- source_word: אִשֶּׁה
  choice: ein Feueropfer
  rationale: Der kultische Ausdruck bezeichnet eine auf dem Altar verbrannte Opfergabe. „Feueropfer“ ist knapp und lässt die umstrittene genauere Herleitung des Wortes offen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet den Empfänger der Opfergabe; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וְלֹא יָמֻתוּ
  choice: damit sie nicht sterben
  alternative: und sie werden nicht sterben / damit sie ja nicht sterben
  rationale: Im Zusammenhang ist die reale Todesfolge bei unterlassener Waschung gemeint. Die gewählte Fassung drückt den Zweck beziehungsweise die abzuwendende Folge natürlich aus; die formale Mehrdeutigkeit wird in der Fußnote kenntlich gemacht.
- issue: Deutung des kultischen Ausdrucks אִשֶּׁה
  choice: Feueropfer
  alternative: Speisegabe / durch Feuer dargebrachte Opfergabe
  rationale: Die genaue Herleitung und Bedeutungsnuance ist umstritten. „Feueropfer“ wahrt den klaren Bezug zur Verbrennung auf dem Altar, ohne „Speise“ als sichere lexikalische Bedeutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher kultischer Terminologie. Der abschließende Beistrich zeigt, dass der Satz in Exodus 30,21 weitergeführt wird. Die beiden Fußnotenmarker [a] und [b] stehen an den jeweils erläuterten Ausdrücken im Haupttext.
