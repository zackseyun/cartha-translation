  text: וְ/עָשִׂ֤יתָ אֹתָ/הּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: de
  text: Du sollst daraus Räucherwerk machen[a], eine Duftmischung nach der Kunst eines Parfümeurs, mit Salz versetzt[b], rein und heilig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Räuchermischung“ beziehungsweise „eine aromatische Mischung“. Das Hebräische betont eine sorgfältig zusammengesetzte Duftzubereitung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „gesalzen“; auch: „mit Salz vermischt“.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische lautet wörtlich „heilig“, nicht ausdrücklich „hochheilig“.
    reason: lexical_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … machen
  rationale: Das Qal-Perfekt mit וְ steht im Zusammenhang kultischer Anweisungen und hat befehlenden Sinn. „Du sollst“ bewahrt den verbindlichen Anweisungston.
- source_word: אֹתָהּ
  choice: daraus
  rationale: Das feminine Objektpronomen verweist auf die im vorherigen Vers genannten Zutaten. „Daraus“ stellt diesen Rückbezug im Deutschen natürlich her.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Das Substantiv bezeichnet die heilige aromatische Mischung, die verbrannt wird; „Räucherwerk“ ist im kultischen Zusammenhang präzise und idiomatisch.
- source_word: רֹקַח
  choice: Duftmischung
  rationale: Das Wort bezeichnet eine sorgfältig zusammengesetzte aromatische Zubereitung. „Duftmischung“ gibt sowohl den Wohlgeruch als auch den Charakter einer Mischung wieder.
- source_word: מַעֲשֵׂה רוֹקֵחַ
  choice: nach der Kunst eines Salbenmischers
  rationale: Wörtlich geht es um das Werk eines fachkundigen Mischers beziehungsweise Salbenbereiters. Die Formulierung hebt die handwerkliche Kunst hervor und bleibt im Deutschen verständlich.
- source_word: מְמֻלָּח
  choice: mit Salz versetzt
  rationale: Das passive Partizip der mit Salz verbundenen Wurzel wird am unmittelbarsten als „gesalzen“ beziehungsweise „mit Salz vermischt“ verstanden. „Mit Salz versetzt“ ist konkret und für Räucherwerk sprachlich angemessen.
- source_word: טָהוֹר
  choice: rein
  rationale: Im kultischen und stofflichen Zusammenhang bezeichnet das Wort Reinheit; „rein“ bewahrt beide Bedeutungsebenen.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Das Wort kennzeichnet das Räucherwerk als für Gott ausgesondert. „Heilig“ ist die direkte Wiedergabe, ohne die Aussage zu „hochheilig“ zu verstärken.
theological_decisions:
- issue: Kultischer Status des Räucherwerks
  choice: heilig
  alternative: geheiligt; hochheilig
  rationale: Im hebräischen Text steht hier schlicht קֹדֶשׁ. „Heilig“ bewahrt die Aussage, während „hochheilig“ eine im Vers nicht ausdrücklich vorhandene Steigerung eintragen würde.
translation_notes:
  register: Moderne, würdige Standardsprache mit kultisch passendem Wortschatz. Der verbindliche Anweisungston bleibt erhalten; die Abfolge „rein und heilig“ folgt dem Hebräischen. Fachsprache wird auf „Salbenmischer“ begrenzt und durch den geläufigen Ausdruck „nach der Kunst“ verständlich eingebettet.
