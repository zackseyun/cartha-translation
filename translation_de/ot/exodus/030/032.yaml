  terminology: „heilig“ ist für קֹדֶשׁ richtig und die Wiederholung sollte erhalten bleiben. Die generische Bedeutung von אָדָם wird mit „menschlich“ bewahrt; die Fußnote kann die wörtliche hebräische Form und die generische Referenz erläutern.
