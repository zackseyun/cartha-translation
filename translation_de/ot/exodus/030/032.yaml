  text: עַל בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ/בְ/מַ֨תְכֻּנְתּ֔/וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑/הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: de
  text: Es soll nicht auf menschliches Fleisch[a] gegossen werden, und nach seiner Zusammensetzung dürft ihr nichts herstellen, was ihm gleichkommt. Es ist heilig; es soll euch heilig sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf das Fleisch des Menschen“. אָדָם bezeichnet hier Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיסָךְ
  choice: darf … gegossen werden
  rationale: Die passive Verbform bezeichnet hier das Ausgießen beziehungsweise Auftragen des Salböls. „Gegossen werden“ bildet die konkrete Handlung ab, ohne das Verb mit dem umfassenderen Ritualbegriff „salben“ gleichzusetzen.
- source_word: עַל בְּשַׂר אָדָם
  choice: auf den Leib eines Menschen
  rationale: בָּשָׂר bedeutet wörtlich „Fleisch“, bezeichnet hier aber den menschlichen Leib als Fläche, auf die das Öl aufgetragen würde. אָדָם ist generisch und wird daher natürlich mit „eines Menschen“ wiedergegeben.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: in derselben Zusammensetzung
  rationale: מַתְכֹּנֶת bezeichnet die festgelegte Mischung beziehungsweise das Mischungsverhältnis. „Zusammensetzung“ ist präzise und im modernen Deutschen natürlicher als „Rezeptur“.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: dürft ihr nichts herstellen, was ihm gleicht
  rationale: Die Formulierung gibt das Verbot wieder, eine gleichartige Mischung herzustellen, und bewahrt den Vergleichscharakter von כָּמֹהוּ.
- source_word: קֹדֶשׁ הוּא
  choice: Es ist heilig
  rationale: „Heilig“ bewahrt den zentralen biblisch-theologischen Begriff von קֹדֶשׁ.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: es soll euch heilig sein
  rationale: 'Die Formulierung hält die relationale Aussage von לָכֶם fest: Israel soll die Mischung als heilig behandeln und ansehen.'
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: eines Menschen
  alternative: menschlich / eines Mannes
  rationale: אָדָם bezeichnet hier nicht ausdrücklich einen männlichen Erwachsenen, sondern einen Menschen allgemein. „Eines Menschen“ wahrt diese generische Bedeutung, ohne eine geschlechtliche Einschränkung einzutragen.
- issue: Wiederholung von קֹדֶשׁ
  choice: Beide Aussagen mit „heilig“ wiedergeben
  alternative: Die zweite Aussage mit „als heilig gelten“ paraphrasieren
  rationale: Die Wiederholung betont sowohl die Heiligkeit des Öls an sich als auch seine Heiligkeit für die Angesprochenen. Diese theologische Spannung bleibt in der knappen, formnahen Wiedergabe erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leib“ ist in diesem kultischen Zusammenhang natürlicher als das wörtliche „Fleisch“, während die Fußnote die hebräische Ausdrucksweise sichtbar hält. Die kurzen Schlusssätze bewahren die feierliche Wiederholung des Originals.
