  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: Das geweihte Salböl darf nicht auf Menschen aufgetragen und nicht in einer ihm entsprechenden Mischung hergestellt werden. „Darf“ ist jedoch für die hebräische Verbotsform weniger direkt als „soll“, und „in derselben Zusammensetzung“ ist gegenüber בְּמַתְכֻּנְתּוֹ („nach/seiner Zusammensetzung entsprechend“) leicht unpräzise formuliert.'
