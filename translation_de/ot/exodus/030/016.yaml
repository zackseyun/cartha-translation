id: EXO.30.16
reference: Exodus 30:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: de
  text: Du sollst das Sühnegeld[a] von den Söhnen Israels nehmen und es für den Dienst am Zelt der Begegnung geben. Es soll den Söhnen Israels vor Jahwe als Erinnerungszeichen dienen, um Sühne für euer Leben[b] zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Silber der Sühnehandlungen“; gemeint ist das zuvor festgesetzte Löse- oder Sühnegeld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „eure Lebenswesen“ oder traditionell „eure Seelen“; hier sind eure Personen beziehungsweise euer Leben gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: Sühnegeld
  rationale: כֶּסֶף bezeichnet Silber beziehungsweise Geld; הַכִּפֻּרִים verweist auf Sühne. „Sühnegeld“ ist im Deutschen knapp und verständlich und bezeichnet hier die zuvor angeordnete Abgabe.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: von den Söhnen Israels
  rationale: Die Wiedergabe bewahrt die formale, korporative Bezeichnung des hebräischen Textes; gemeint ist das Bundesvolk Israel.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: für den Dienst am Zelt der Begegnung
  rationale: עֲבֹדָה meint hier den Dienst beziehungsweise die Arbeit am Heiligtum; עַל bezeichnet in diesem Zusammenhang die Zuweisung zu diesem Zweck.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: Es soll ... als Erinnerungszeichen dienen
  rationale: זִכָּרוֹן bezeichnet etwas, das vor Gott in Erinnerung bringt oder als bleibendes Gedenkzeichen dient. „Erinnerungszeichen“ ist natürlich und wahrt den kultischen Bezug.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet die Gegenwart Gottes; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לְכַפֵּר עַל
  choice: um Sühne ... zu erwirken
  rationale: Der Piel-Infinitiv von כפר bezeichnet im priesterlichen Zusammenhang das Schaffen beziehungsweise Erwirken von Sühne. Die Formulierung stellt das Geld nicht unnötig als selbsttätigen Akteur dar.
- source_word: נַפְשֹׁתֵיכֶם
  choice: euer Leben
  rationale: נֶפֶשׁ bezeichnet hier die Personen in ihrem gefährdeten Leben, nicht eine vom Körper getrennte Seele. Der deutsche Singular „euer Leben“ kann die distributive Aussage natürlich ausdrücken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als offenbarten Bundesnamen.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die formal maskuline Wendung wird als traditionelle korporative Bezeichnung beibehalten, ohne ihren Bezug auf das Volk Israel zu verengen.
- issue: Wirkung der Zahlung im Ausdruck לְכַפֵּר
  choice: um Sühne für euer Leben zu erwirken
  alternative: um für euer Leben Sühne zu schaffen
  rationale: Die Übersetzung erhält den kultischen Sühnegedanken, legt aber nicht näher fest, auf welche Weise das Erinnerungszeichen und die Zahlung die Sühne vermitteln.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wird jedoch in zwei gut lesbare Hauptsätze gegliedert. Kultische Schlüsselbegriffe wie „Sühne“, „Dienst“ und „Erinnerungszeichen“ bleiben erhalten.
