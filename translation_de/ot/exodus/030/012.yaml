revisions:
- from: Wenn du die Söhne Israels bei ihrer Musterung zählst[a], soll jeder Mann bei ihrer Zählung Jahwe ein Lösegeld für sein Leben[b] geben, damit bei ihrer Zählung keine Plage über sie kommt.
  to: Wenn du die Söhne Israels bei ihrer Erfassung zählst[a], soll jeder Mann Jahwe, wenn du sie erfasst, ein Lösegeld für sein Leben[b] geben, damit bei ihrer Erfassung keine Plage unter ihnen ist.
  rationale: Die Änderung ersetzt das im Deutschen semantisch engere „Musterung“ durch „Erfassung“, präzisiert die zugehörige Fußnote und gibt die Ortsbeziehung von בָהֶם mit „unter ihnen“ näher wieder. Die wiederholte Erfassungs-/Zählterminologie und die zeitliche Bedingung der Zahlung bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:43:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend: Die Zählung der Söhne Israels wird mit einer individuellen Zahlung an Jahwe und der Abwendung einer Plage verknüpft. „Musterung“ kann jedoch im modernen Deutsch primär eine militärische oder medizinische Untersuchung bezeichnen und ist für פקד hier weniger neutral als „Erfassung“. Außerdem entspricht „unter ihnen ist“ dem hebräischen בָהֶם unmittelbarer als „über sie kommt“.'
  naturalness: Der Entwurf ist insgesamt verständlich und würdevoll. Die Verbindung „bei ihrer Musterung zählst“ wirkt jedoch leicht doppelt und „Musterung“ ist kontextuell enger als der hebräische Ausdruck. Die Revision verwendet durchgängig „Erfassung“ beziehungsweise „erfasst“ und erhält dabei die im Hebräischen wiederholte Terminologie.
  terminology: „Jahwe“, „Lösegeld“ und „für sein Leben“ sind sachgerecht. Die Fußnote zu [a] sollte die hebräische Formulierung nicht mit „entsprechend ihren Gemusterten“ erklären; לִפְקֻדֵיהֶם meint ihre Erfassung/Registrierung, nicht die bereits gemusterten Personen.
  issues:
  - severity: medium
    issue: „Musterung“ als Wiedergabe von פקד
    rationale: Das Wort kann im Deutschen eine spezifisch militärische oder medizinische Konnotation tragen. Im vorliegenden Kontext ist die allgemeinere amtliche „Erfassung“ semantisch näher und moderner.
  - severity: low
    issue: „keine Plage über sie kommt“
    rationale: Das Hebräische sagt wörtlich, dass keine Plage „unter/in ihnen“ sein soll. „Keine Plage unter ihnen ist“ bewahrt diese Aussage ohne unnötige Bildverschiebung.
  - severity: medium
    issue: Ungenaue Erklärung in Fußnote [a]
    rationale: „Entsprechend ihren Gemusterten“ ist kein gutes deutsches Verständnis von לִפְקֻדֵיהֶם. Die Fußnote sollte von ihrer Erfassung beziehungsweise Registrierung sprechen.
