  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: de
  text: Wenn du die Söhne Israels bei ihrer Erfassung zählst[a], soll jeder Mann Jahwe, wenn du sie erfasst, ein Lösegeld für sein Leben[b] geben, damit bei ihrer Erfassung keine Plage unter ihnen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wenn du das Haupt der Söhne Israels zu ihrer Erfassung erhebst“; dies ist eine Wendung für das Zählen und amtliche Erfassen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für sich selbst“. Das hebräische Wort nefesch bezeichnet hier das Leben beziehungsweise die Person, nicht nur die „Seele“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier den erwarteten Anlass einer rechtlichen Anweisung ein; „wenn“ bewahrt den zeitlich-bedingenden Sinn.
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: zählst
  rationale: Wörtlich heißt die Wendung „den Kopf erheben“, idiomatisch bezeichnet sie hier das Erfassen bei einer Volkszählung. Das Verb „zählen“ ist im Deutschen natürlich und wird durch „bei ihrer Musterung“ administrativ präzisiert.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die familiäre und grammatisch maskuline Ausdrucksweise des Hebräischen, ohne sie zu „Israeliten“ zu verallgemeinern.
- source_word: לִפְקֻדֵיהֶם
  choice: bei ihrer Musterung
  rationale: Die Form vom Stamm פקד bezeichnet hier die amtliche Erfassung beziehungsweise Registrierung; „Musterung“ gibt diese administrative Nuance knapp wieder.
- source_word: וְנָתְנוּ אִישׁ
  choice: soll jeder Mann ... geben
  rationale: 'אִישׁ hat distributive Kraft: Jeder einzelne Mann aus der gezählten Gruppe ist zur Zahlung verpflichtet.'
- source_word: כֹּפֶר
  choice: Lösegeld
  rationale: Bezeichnet eine auslösende beziehungsweise schützende Zahlung, durch die drohendes Unheil abgewendet wird.
- source_word: נַפְשׁוֹ
  choice: für sein Leben
  rationale: נפש bezeichnet in diesem Zusammenhang das Leben beziehungsweise die Person selbst, nicht notwendig eine vom Körper getrennte „Seele“.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: 'Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; die Präposition gehört zur Gabe: Das Lösegeld wird Jahwe gegeben.'
- source_word: בִּפְקֹד אֹתָם
  choice: bei ihrer Zählung
  rationale: Die Infinitivkonstruktion bezeichnet den Anlass beziehungsweise Zeitpunkt der Zahlung und bewahrt die Wiederholung des Zählmotivs.
- source_word: נֶגֶף
  choice: Plage
  rationale: Im Zusammenhang göttlichen Gerichts bezeichnet נֶגֶף einen schweren, möglicherweise tödlichen Schlag; „Plage“ entspricht dem Kontext.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: damit ... keine Plage über sie kommt
  rationale: „Damit“ macht die Zweck- beziehungsweise Folgerelation der Zahlung deutlich; „über sie kommt“ ist eine natürliche deutsche Wiedergabe des drohenden Unheils.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נַפְשׁוֹ in der Lösegeldformel
  choice: für sein Leben
  alternative: für sich selbst; für seine Seele
  rationale: Der Kontext betrifft die Bewahrung der gezählten Person vor einer Plage. „Leben“ vermeidet die unbegründete Festlegung auf eine spätere Leib-Seele-Terminologie.
- issue: Geschlechtsspezifische Formulierungen בְּנֵי יִשְׂרָאֵל und אִישׁ
  choice: die Söhne Israels ... jeder Mann
  alternative: die Israeliten ... jeder Mensch
  rationale: Die Übersetzung erhält die maskulinen Formen und die distributive Einzahl des Ausgangstextes, ohne den erfassten Personenkreis über den Wortlaut hinaus zu bestimmen.
- issue: Funktion des Lösegeldes
  choice: damit ... keine Plage über sie kommt
  alternative: und dann wird keine Plage unter ihnen sein
  rationale: Die Zahlung steht im Text in einem Zweck- oder Folgezusammenhang mit der Abwendung der Plage. Die Formulierung wahrt diese Beziehung, ohne eine weitergehende Sühnetheorie einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Musterung“ bewahrt den amtlichen Charakter von פקד, während „zählst“ die hebräische Redewendung verständlich wiedergibt. Die dreifache begriffliche Wiederkehr des Zählens beziehungsweise Erfassens bleibt erkennbar; die Satzstruktur wurde für natürliches Deutsch leicht gestrafft.
