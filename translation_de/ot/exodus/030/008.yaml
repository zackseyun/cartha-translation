base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: de
  text: Und wenn Aaron die Lampen in der Abenddämmerung[a] herrichtet, soll er vor Jahwe regelmäßig Räucherwerk verbrennen, von Generation zu Generation.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwischen den Abenden“; eine hebräische Wendung für die abendliche Dämmerungszeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „beständig Räucherwerk verbrennen“. Das hebräische Wort kann sowohl die fortlaufende Regelmäßigkeit als auch die dauerhafte Geltung des vorgeschriebenen Räucheropfers betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: Und wenn … anzündet
  rationale: Die Präposition mit dem Infinitivus constructus bildet einen Temporalsatz. Der Hifil von עלה bezeichnet bei Lampen das Aufsteigenlassen der Flamme und kann daher natürlich mit „anzünden“ wiedergegeben werden; zugleich gehört das rituelle Herrichten der Lampen zum Zusammenhang.
- source_word: הַנֵּרֹת
  choice: die Lampen
  rationale: נֵרוֹת ist im Zusammenhang des Heiligtums die übliche Bezeichnung für die Lampen.
- source_word: בֵּין הָעַרְבַּיִם
  choice: in der Abenddämmerung
  rationale: Die feste hebräische Wendung bedeutet wörtlich „zwischen den Abenden“ und bezeichnet den abendlichen Dämmerungszeitraum. Die idiomatische Wiedergabe steht im Text, die wörtliche Form in der Fußnote.
- source_word: יַקְטִירֶנָּה קְטֹרֶת
  choice: soll er Räucherwerk verbrennen
  rationale: Der Hifil von קטר bezeichnet im Kult das Verbrennen beziehungsweise Aufsteigenlassen von Räucherwerk als Opfer. Das vorausweisende feminine Suffix wird im Deutschen nicht eigens wiederholt, weil sein nachfolgender Bezug קְטֹרֶת direkt genannt wird.
- source_word: קְטֹרֶת תָּמִיד
  choice: ein regelmäßiges Räucheropfer
  rationale: קְטֹרֶת bezeichnet Räucherwerk beziehungsweise das Räucheropfer. תָּמִיד betont hier die fortlaufend vorgeschriebene Wiederholung, nicht notwendig eine ohne Unterbrechung andauernde Handlung.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet die Gegenwart Gottes im Heiligtum; der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die Wendung bezeichnet die fortdauernde Geltung für die aufeinanderfolgenden Generationen Israels und wird in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. „Jahwe“ gibt ihn als persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תָּמִיד beim Räucheropfer
  choice: regelmäßig
  alternative: beständig; immerwährend
  rationale: Da das Räucherwerk zu festgelegten Zeiten am Morgen und am Abend verbrannt wird, bezeichnet תָּמִיד hier die dauerhaft vorgeschriebene Regelmäßigkeit. Die mögliche Betonung der Kontinuität bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultischen Begriffe bleiben erkennbar, werden aber ohne altertümliche Satzstellung formuliert. Die Wiederholung „Räucherwerk … Räucheropfer“ bildet die hebräische Verbindung von Verb und Nomen verständlich ab.
