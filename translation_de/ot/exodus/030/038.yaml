  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: de
  text: Wer etwas wie dieses herstellt, um daran zu riechen[a], soll aus seinem Volk ausgerottet werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um seinen Duft zu genießen“. Wörtlicher: „um daran/mit ihm zu riechen“; gemeint ist die Herstellung zum persönlichen Riechen oder Duftgenuss.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Rechtsformel „aus seinem Volk ausgerottet werden“ lässt offen, ob damit Tod, Ausschluss aus der Gemeinschaft oder Entfernung durch Gottes Gericht gemeint ist.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Wer
  rationale: Die Verbindung bezeichnet in dieser Rechtsformel allgemein jede Person, auf die die folgende Bedingung zutrifft. „Wer“ ist im Deutschen natürlich und geschlechtsübergreifend.
- source_word: יַעֲשֶׂה
  choice: herstellt
  rationale: עשה bedeutet grundsätzlich „machen/tun“; bei einer zusammengesetzten Räuchermischung gibt „herstellen“ den konkreten Vorgang idiomatisch wieder.
- source_word: כָמֹהָ
  choice: etwas Gleiches
  rationale: Das feminine Pronomen verweist auf die zuvor beschriebene Räuchermischung. „Etwas Gleiches“ bezeichnet eine entsprechende Nachbildung, ohne einen bloß ähnlichen Duft zu behaupten.
- source_word: לְהָרִיחַ בָּהּ
  choice: um seinen Duft zu genießen
  rationale: Der Infinitiv im Hifil mit ב bezeichnet den Zweck, den Duft selbst zu riechen beziehungsweise wahrzunehmen. Die Formulierung macht den persönlichen Duftgenuss deutlich, der im Kontext dem heiligen Gebrauch gegenübersteht.
- source_word: וְנִכְרַת
  choice: soll … entfernt werden
  rationale: Das Niphal von כרת bildet eine gewichtige rechtliche Strafformel. „Entfernt werden“ bewahrt die passive, nicht näher bestimmte Sanktion, ohne bildhaftes „abschneiden“ ins Deutsche zu übertragen.
- source_word: מֵעַמָּיו
  choice: aus seinem Volk
  rationale: עם mit Possessivsuffix bezeichnet die eigene Volks- und Bundesgemeinschaft. „Aus seinem Volk“ entspricht der Richtung der hebräischen Präposition מן.
theological_decisions:
- issue: Bedeutung der Strafformel וְנִכְרַת מֵעַמָּיו
  choice: „soll aus seinem Volk entfernt werden“ ohne Festlegung der Vollzugsart
  alternative: „soll getötet werden“, „soll aus der Gemeinschaft ausgeschlossen werden“ oder „soll durch Gottes Gericht beseitigt werden“
  rationale: Die hebräische Rechtsformel bezeichnet eine schwere Sanktion, legt hier aber nicht eindeutig fest, ob Tod, Ausschluss oder unmittelbares göttliches Gericht gemeint ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rechtsformel bleibt bewusst offen; „Duft genießen“ verdeutlicht den persönlichen, nicht kultischen Zweck. Beide Fußnotenmarker stehen unmittelbar an den betreffenden Aussagen im Haupttext.
