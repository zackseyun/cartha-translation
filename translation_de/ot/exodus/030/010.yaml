  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: de
  text: Aaron soll einmal im Jahr an den Hörnern des Altars Sühne vollziehen. Mit dem Blut des Sündopfers für die Sühne[a] soll er einmal im Jahr daran Sühne vollziehen, von Generation zu Generation. Er ist dem HERRN hochheilig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit dem Blut des Sündopfers der Sühnungen“.'
    reason: Die ungewöhnliche hebräische Genitivverbindung und die Pluralform von „Sühnungen“ werden transparent gemacht, während der Haupttext idiomatisches Deutsch bietet.
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: Sühne vollziehen
  rationale: כפר bezeichnet hier im priesterlich-kultischen Zusammenhang die Durchführung des Sühnritus. „Sühne vollziehen“ ist würdig und präzise und lässt offen, ob dabei besonders Entsühnung, Reinigung oder Wiedergutmachung akzentuiert wird.
- source_word: קַרְנֹתָיו
  choice: an seinen Hörnern
  rationale: Das Suffix bezieht sich auf den im Kontext genannten Räucheraltar, der im Deutschen grammatisch maskulin ist. על wird räumlich natürlich mit „an“ wiedergegeben.
- source_word: אַחַת בַּשָּׁנָה
  choice: einmal im Jahr
  rationale: Dies ist die klare, idiomatische deutsche Entsprechung der Angabe zur jährlichen Wiederholung.
- source_word: מִדַּם
  choice: mit dem Blut
  rationale: Das hebräische מן bezeichnet hier das für den Ritus verwendete Mittel beziehungsweise Material; „mit dem Blut“ ist im Deutschen natürlich.
- source_word: חַטַּאת
  choice: Sündopfer
  rationale: Im Opferkontext bezeichnet חטאת das Opfer und nicht abstrakt die Sünde. „Sündopfer“ ist der etablierte deutsche Kultterminus; „Reinigungsopfer“ bleibt eine mögliche fachsprachliche Deutung.
- source_word: הַכִּפֻּרִים
  choice: für die Sühne
  rationale: Die attributive Genitivverbindung, wörtlich etwa „Sündopfer der Sühnungen“, wird verständlich als Zweckbeziehung ausgedrückt. Die auffällige hebräische Pluralform wird in der Fußnote dokumentiert.
- source_word: לְדֹרֹתֵיכֶם
  choice: von Generation zu Generation
  rationale: Die Wendung gibt die fortdauernde Geltung über die aufeinanderfolgenden Generationen Israels natürlich wieder.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Intensiv- beziehungsweise Superlativverbindung bezeichnet den höchsten Heiligkeitsgrad. „Hochheilig“ vermeidet eine Verwechslung mit dem Allerheiligsten als Raum.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die Präposition bezeichnet hier Zugehörigkeit beziehungsweise Weihe. Der Gottesname wird gemäß der deutschsprachigen Reverenzkonvention als „HERR“ gesetzt.
theological_decisions:
- issue: Wiedergabe von יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: „HERR“ folgt der jüdischen Lesetradition und der verbreiteten deutschen Bibelkonvention; die Kapitälchen kennzeichnen, dass im Hebräischen der Gottesname יהוה steht.
- issue: Semantischer Umfang von כפר
  choice: Sühne vollziehen
  alternative: entsühnen / reinigen
  rationale: Die Übersetzung bewahrt den kultischen Sühnbegriff, ohne die Wirkung des Ritus ausschließlich als Reinigung oder Tilgung festzulegen.
- issue: Bezugswort des abschließenden הוּא
  choice: Es ist dem HERRN hochheilig
  alternative: Er ist dem HERRN hochheilig
  rationale: Das Pronomen kann grammatisch auf den Altar bezogen werden; im Deutschen nimmt das neutrale „Es“ die gesamte kultische Sache beziehungsweise den Altar im Zusammenhang auf, ohne einen unnatürlich isolierten männlichen Rückverweis zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit etablierten kultischen Begriffen. Die Wiederholung von „Sühne vollziehen“ bildet die Wiederholung des hebräischen Verbs ab. „HERR“ ist als Wiedergabe des Tetragramms in Kapitälchen vorgesehen.
