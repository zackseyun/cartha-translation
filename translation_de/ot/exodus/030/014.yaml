source:
  edition: WLC
  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: de
  text: Jeder, der bei der Zählung erfasst wird[a], soll ab zwanzig Jahren die Abgabe für Jahwe entrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „jeder, der zu/unter den Gezählten hinübergeht“. Die hebräische Wendung bewahrt möglicherweise die Vorstellung eines Vorgangs bei der Zählung; auch möglich: „der sich zu den Gezählten gesellt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: Jeder, der … hinübergeht
  rationale: כֹּל bezeichnet hier zusammen mit dem Partizip jeden Einzelnen. „Hinübergeht“ bewahrt das konkrete Bild des Verbs עבר, ohne es einfach mit „gezählt wird“ gleichzusetzen.
- source_word: עַל הַפְּקֻדִים
  choice: zu den Gemusterten
  rationale: פְּקֻדִים bezeichnet in diesem Zusammenhang die bei der Zählung Erfassten beziehungsweise Gemusterten. Die Verbindung mit עַל ist idiomatisch; „zu den Gemusterten“ gibt die Zugehörigkeit zur erfassten Gruppe wieder und lässt das Bild des Hinübergehens bestehen.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: von zwanzig Jahren an und darüber
  rationale: Die Formulierung bildet die hebräische Altersgrenze genau und in verständlichem deutschem Rechtsstil ab.
- source_word: יִתֵּן
  choice: soll … geben
  rationale: Das Imperfekt hat hier im gesetzlichen Zusammenhang anweisende Kraft. „Soll“ klingt im modernen Deutschen verbindlich, ohne unnötig altertümlich zu wirken.
- source_word: תְּרוּמַת
  choice: die Abgabe
  rationale: תְּרוּמָה meint eine ausgesonderte Gabe oder Leistung. Im Zusammenhang der Volkszählung ist „Abgabe“ genauer als das stärker kultisch klingende „Opfer“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Grad der Verdeutlichung des Zählungsidioms
  choice: zu den Gemusterten hinübergeht
  alternative: zu den Gemusterten zählt / unter den Gemusterten erfasst wird
  rationale: Die gewählte Fassung bewahrt die konkrete, möglicherweise auf das Verfahren der Zählung bezogene Bewegungssprache des Hebräischen und löst sie nicht vollständig in eine abstrakte Aussage über Registrierung auf.
- issue: Beziehung der Abgabe zu Jahwe
  choice: die Abgabe für Jahwe
  alternative: Jahwes Abgabe
  rationale: Der hebräische Genitiv kann die Jahwe zustehende beziehungsweise für ihn bestimmte Abgabe bezeichnen. „Für Jahwe“ ist im Deutschen natürlich und passt zum unmittelbaren Abgabekontext, ohne daraus ein Opfer im engeren Sinn zu machen.
translation_notes:
  register: Moderner, würdiger deutscher Gesetzesstil. Das ungewöhnliche Bild des Hinübergehens bleibt wegen seiner möglichen Bedeutung für das Zählungsverfahren erhalten; die Fußnote nennt eine natürlichere Alternative.
