  register: Modernes, würdevolles Standarddeutsch mit gesetzlich-anweisendem Ton. Die auffällige Wiederholung von „heiliges Salböl“ und die handwerkliche Formulierung „das Werk eines Salbenbereiters“ wurden bewusst erhalten.
