  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: de
  text: Du sollst daraus ein heiliges Salböl machen, eine duftende Mischung, nach der Kunst eines Salbenmischers hergestellt; ein heiliges Salböl soll es sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: Du sollst daraus … machen
  rationale: Das Qal-Perfekt mit וְ hat im Anweisungskontext verpflichtende Kraft. „Daraus“ macht den Rückbezug des Objektpronomens auf die zuvor genannten Zutaten im Deutschen natürlich deutlich.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: ein heiliges Salböl
  rationale: Die Konstruktverbindung bezeichnet Öl zur heiligen Salbung. Die gleiche Wiedergabe am Anfang und Ende erhält die bewusste Wiederholung des Hebräischen.
- source_word: רֹקַח מִרְקַחַת
  choice: eine aromatische Mischung
  rationale: Die verwandten Wörter bezeichnen eine fachgerecht zusammengesetzte, wohlriechende Zubereitung. „Aromatische Mischung“ gibt sowohl den Duftcharakter als auch das Mischen verständlich wieder; die Fußnote bewahrt weitere mögliche Nuancen.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: das Werk eines Salbenbereiters
  rationale: Die Wendung bezeichnet die fachkundige Arbeit eines Handwerkers, der aromatische Salben und Öle mischt. „Salbenbereiter“ passt zum antiken Sachzusammenhang besser als das modern enger wirkende „Parfümeur“.
- source_word: יִהְיֶה
  choice: soll es sein
  rationale: Das Imperfekt beschreibt hier im gesetzlichen Anweisungskontext den vorgeschriebenen Ergebniszustand und bewahrt den feierlichen Nachdruck des Satzschlusses.
theological_decisions: []
