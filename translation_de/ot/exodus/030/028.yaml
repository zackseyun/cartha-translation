  text: den Brandopferaltar mit all seinen Geräten und das Becken mit seinem Gestell.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Die deutsche Zusammensetzung gibt die Beziehung zwischen מִזְבַּח („Altar“) und הָעֹלָה („Brandopfer“) präzise, natürlich und in der geläufigen kultischen Terminologie wieder.
- source_word: כָּל כֵּלָיו
  choice: all seinen Geräten
  rationale: כְּלִי bezeichnet hier die zum Altar gehörenden Geräte oder Utensilien. „Geräte“ ist im Deutschen verständlich, würdig und für kultisches Zubehör ausreichend weit.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: כִּיּוֹר bezeichnet das Waschbecken des Heiligtums. „Becken“ ist gegenüber altertümlichen Ausdrücken wie „Waschkessel“ oder „ehernem Meer“ sachlich und modern.
- source_word: כַּנּוֹ
  choice: sein Gestell
  rationale: כֵּן bezeichnet hier den tragenden Unterbau des Beckens. „Gestell“ vermittelt diese Funktion genauer als das ebenfalls mögliche „Fuß“ oder „Untergestell“.
- source_word: וְאֶת
  choice: und
  rationale: Das wiederholte וְ mit dem Akkusativzeichen אֶת koordiniert die Gegenstände der Liste. Im Deutschen wird das unübersetzte Objektzeichen ausgelassen und die Verbindung durch „und“ wiedergegeben.
