lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann redete
  rationale: Das Waw mit der Verbform führt den nächsten Erzählschritt ein; „redete“ entspricht der wiederkehrenden göttlichen Redeformel mit דבר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Natürliches modernes Deutsch für den Adressaten der Rede.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den folgenden Redeinhalt ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „und sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namen; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder und bereitet die in Vers 23 folgende direkte Rede vor.
