  text: וְ/צִפִּיתָ֨ אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וְ/עָשִׂ֥יתָ לּ֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: de
  text: 'Du sollst ihn mit reinem Gold überziehen: seine Oberseite, seine Wände ringsum und seine Hörner. Außerdem sollst du ihm ringsum eine goldene Leiste[a] anbringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen goldenen Kranz«. Das hebräische Wort kann eine Einfassung, einen Rand oder eine kronenartige Leiste bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: du sollst … überziehen
  rationale: Das Verb צפה bezeichnet hier das Belegen eines Gegenstands mit Metall; »überziehen« ist im Deutschen präzise und für die Herstellung sakraler Geräte üblich.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Die Wortgruppe bezeichnet Gold von hoher Reinheit; »reines Gold« ist die natürliche und sachlich genaue deutsche Entsprechung.
- source_word: גַּגּוֹ
  choice: seine Oberseite
  rationale: גג bedeutet häufig »Dach«, bezeichnet bei dem kleinen Räucheraltar hier aber dessen obere Fläche. »Oberseite« gibt dies ohne irreführende Gebäudeterminologie wieder.
- source_word: קִירֹתָיו
  choice: seine Wände
  rationale: Die wörtliche Bedeutung ist »seine Wände«. Auch bei einem kastenförmigen Gegenstand ist diese Formulierung verständlich und bewahrt das konkrete Bild des Hebräischen.
- source_word: סָבִיב
  choice: ringsum
  rationale: »Ringsum« bringt die vollständige Umfassung knapp und idiomatisch zum Ausdruck. Die Wiederholung des Wortes im Vers bleibt erhalten.
- source_word: קַרְנֹתָיו
  choice: seine Hörner
  rationale: Die vorspringenden Altarhörner sind ein fester Bestandteil der Kultausstattung. Die wörtliche Wiedergabe bewahrt den sachlichen und kultischen Bezug.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: sollst du … für ihn anbringen
  rationale: »Für ihn« wahrt die durch ל ausgedrückte Zuordnung zum Altar; »anbringen« beschreibt im Deutschen natürlicher als bloßes »machen«, dass die Leiste am Altar hergestellt beziehungsweise befestigt werden soll.
- source_word: זֵר זָהָב
  choice: eine goldene Leiste
  rationale: זֵר bezeichnet hier eine umlaufende Einfassung beziehungsweise profilierte Leiste an einem Kultgegenstand. »Goldene Leiste« ist anschaulich, ohne eine königliche Bedeutung vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe der Fachbegriffe für die Ausstattung des Altars
  choice: »Hörner« wörtlich beibehalten und זֵר mit »Leiste« wiedergeben
  alternative: זֵר als »Kranz« oder »Krone« wiedergeben
  rationale: Der Vers beschreibt die Bauweise des Räucheraltars und macht keine ausdrückliche Aussage über Königtum. »Hörner« bewahrt den etablierten kultischen Begriff; »Leiste« bezeichnet die bauliche Form verständlich. Die mögliche Bedeutung »Kranz« wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzglieder folgen der hebräischen Aufzählung, während »Oberseite« und »anbringen« die konkrete Konstruktion für heutige Leser verständlich ausdrücken.
