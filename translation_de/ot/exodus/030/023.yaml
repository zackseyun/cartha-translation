source:
  edition: WLC
  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: de
  text: 'Du aber, nimm dir die erlesensten Duftstoffe: 500 Schekel frei fließende Myrrhe[a], halb so viel – 250 Schekel – duftenden Zimt und 250 Schekel duftendes Rohr[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „reine Myrrhe“. Der hebräische Ausdruck bezeichnet wahrscheinlich Myrrhe, die in ihrem natürlichen Zustand frei ausfließt.
    reason: lexical_alternative
  - marker: b
    text: Traditionell „wohlriechender Kalmus“. Das Hebräische bezeichnet allgemeiner ein aromatisches oder duftendes Rohr.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: die erlesensten Duftstoffe
  rationale: בְּשָׂמִים bezeichnet aromatische Stoffe; רֹאשׁ bedeutet hier idiomatisch das Vorzüglichste oder Beste. „Die erlesensten Duftstoffe“ gibt diesen qualitativen Sinn natürlich und würdig wieder.
- source_word: מָר דְּרוֹר
  choice: frei fließende Myrrhe
  rationale: מָר bedeutet „Myrrhe“; דְּרוֹר verweist wahrscheinlich auf Myrrhe, die in ihrem natürlichen Zustand frei ausfließt. Die Formulierung bleibt transparent und vermeidet die stärker deutende Wiedergabe „reine Myrrhe“.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: 500 Schekel
  rationale: Der hebräische Text nennt hier nur die Zahl; die Gewichtseinheit Schekel ergibt sich aus dem unmittelbaren Rezeptzusammenhang und wird in Vers 24 ausdrücklich genannt. Ihre Ergänzung verhindert ein Missverständnis als bloße Stückzahl.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: duftenden Zimt
  rationale: קִנְּמָן ist Zimt, und בֶּשֶׂם kennzeichnet ihn als wohlriechend beziehungsweise aromatisch. „Duftend“ ist im modernen Deutsch klarer als das traditionelle „wohlriechend“ und vermeidet die geschmackliche Nebenbedeutung von „süß“.
- source_word: מַחֲצִיתוֹ
  choice: halb so viel
  rationale: Das Suffix verweist auf die zuvor genannte Menge von 500. „Halb so viel“ drückt diesen Vergleich im Deutschen idiomatisch aus.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: 250 Schekel
  rationale: Die ausdrücklich genannte Hälfte wird als Zahlenwert wiedergegeben. Die im Kontext erschlossene Einheit wird zur Klarheit erneut genannt.
- source_word: קְנֵה בֹשֶׂם
  choice: duftendes Rohr
  rationale: קָנֶה bezeichnet Rohr oder Schilfrohr; בֹשֶׂם beschreibt es als aromatisch. „Duftendes Rohr“ bleibt näher an der allgemeinen hebräischen Bezeichnung als die botanisch spezifischere traditionelle Wiedergabe „Kalmus“.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Anweisungston. „Du aber“ bewahrt die Hervorhebung des hebräischen וְאַתָּה. Die Gedankenstriche bilden die erläuternde Mengenangabe übersichtlich ab; das abschließende Komma zeigt, dass die Zutatenliste im folgenden Vers weitergeht.
