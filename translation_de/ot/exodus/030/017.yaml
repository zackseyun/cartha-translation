  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Und … sprach
  rationale: Das Wayyiqtol führt die Erzählung fort. „Und … sprach“ entspricht der feierlichen, im Deutschen geläufigen Redeeinleitungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet hier den Adressaten des Sprechens; „zu Mose“ ist die natürliche deutsche Fügung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv „sagend/um zu sagen“ leitet die folgende direkte Rede ein. Im natürlichen modernen Deutsch übernimmt der Doppelpunkt diese Funktion, ohne Inhalt auszulassen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Gottesnamen; die traditionelle Ersatzlesung „der HERR“ wird nicht in den Haupttext übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt wiedergegeben; dadurch wird das schwerfällige „indem er sagte“ vermieden.
