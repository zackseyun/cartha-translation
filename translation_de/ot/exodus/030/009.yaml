  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: de
  text: Ihr dürft darauf kein unerlaubtes Räucherwerk[a], kein Brandopfer und kein Speiseopfer darbringen; auch dürft ihr darauf kein Trankopfer ausgießen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fremdes Räucherwerk«. Das hebräische Adjektiv kann in diesem kultischen Zusammenhang etwas bezeichnen, das außerhalb des Erlaubten oder Vorgeschriebenen liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: darbringen
  rationale: Der Hifil von עלה bedeutet wörtlich »hinaufsteigen lassen«, wird im Opferkontext aber idiomatisch für das Darbringen auf einem Altar gebraucht.
- source_word: עָלָיו
  choice: darauf
  rationale: Das Pronomen verweist im Zusammenhang auf den Räucheraltar und bewahrt die räumliche Beziehung knapp und natürlich.
- source_word: קְטֹרֶת
  choice: Räucherwerk
  rationale: Das Substantiv bezeichnet Räucherstoff beziehungsweise Räucherwerk; im Deutschen ist »Räucherwerk« im kultischen Zusammenhang klar und geläufig.
- source_word: זָרָה
  choice: unerlaubtes
  rationale: Im priesterlich-kultischen Zusammenhang bezeichnet זָר häufig etwas, das außerhalb des Vorgeschriebenen oder Erlaubten liegt. »Unerlaubt« gibt diese rechtlich-kultische Bedeutung verständlich wieder, ohne ethnische Fremdheit nahezulegen.
- source_word: וְעֹלָה
  choice: noch ein Brandopfer
  rationale: Die Konjunktion verbindet in einem negativen Gebot mehrere untersagte Opferarten. Die deutsche Konstruktion »weder … noch … oder« gibt die Aufzählung natürlich wieder; »Brandopfer« ist der etablierte Ausdruck für עֹלָה.
- source_word: וּמִנְחָה
  choice: oder Speiseopfer
  rationale: מִנְחָה bezeichnet im priesterlichen Opferkontext gewöhnlich das aus pflanzlichen Erzeugnissen bestehende Speiseopfer. Der traditionelle deutsche Fachausdruck ist präzise und verständlich.
- source_word: וְנֵסֶךְ
  choice: Trankopfer
  rationale: נֵסֶךְ bezeichnet ein durch Ausgießen dargebrachtes Flüssigkeitsopfer; »Trankopfer« ist der geläufige deutsche Kultbegriff.
- source_word: תִסְּכוּ
  choice: ausgießen
  rationale: נסך bezeichnet hier das rituelle Ausgießen eines Trankopfers. »Ausgießen« bildet die konkrete Handlung idiomatisch ab.
theological_decisions:
- issue: Kultischer Status von זָרָה als Bestimmung des Räucherwerks
  choice: unerlaubtes Räucherwerk
  alternative: fremdes Räucherwerk
  rationale: Der Vers regelt den vorgeschriebenen Gebrauch des Räucheraltars. »Unerlaubt« bewahrt den kultisch-rechtlichen Sinn dessen, was nicht gestattet oder vorgeschrieben ist, ohne die Mehrdeutigkeit zu verschweigen; die wörtlichere Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural folgt der hebräischen Verbform. Kultische Fachbegriffe wie »Brandopfer«, »Speiseopfer« und »Trankopfer« werden beibehalten, da sie präzise und weithin verständlich sind.
