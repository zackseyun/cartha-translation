  yaml_path: translation/ot/exodus/030/019.yaml
  text: Aaron and his sons shall wash their hands and their feet from it[a].
translation:
  language: de
  text: Aaron und seine Söhne sollen sich daraus[a] die Hände und die Füße waschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt ausführlicher: mit Wasser daraus; gemeint ist das im Zusammenhang erwähnte Becken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: sollen … waschen
  rationale: Das Qal Perfekt mit וְ hat im Anweisungskontext verpflichtenden beziehungsweise zukunftsbezogenen Sinn. „sollen … waschen“ gibt den rechtlich-instruktiven Ton in natürlichem Deutsch wieder.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Eingebürgerte deutsche Form des Personennamens.
- source_word: וּבָנָיו
  choice: und seine Söhne
  rationale: בנים bezeichnet hier Aarons männliche Nachkommen im Priesterdienst; „Söhne“ ist daher sachlich genauer als „Kinder“.
- source_word: מִמֶּנּוּ
  choice: daraus
  rationale: Die Präposition מן mit Suffix bedeutet wörtlich „aus/von ihm“. Das Pronomen verweist im Kontext auf das zuvor genannte Becken. „daraus“ ist im Deutschen natürlich und bewahrt den Bezug, ohne „Wasser“ ausdrücklich in den Haupttext einzufügen.
- source_word: אֶת יְדֵיהֶם
  choice: die Hände
  rationale: Die Körperteilbezeichnung ist unmittelbar; das reflexive „sich … die Hände waschen“ ist die idiomatische deutsche Konstruktion und gibt den hebräischen Possessivbezug wieder.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: und die Füße
  rationale: Die zweite koordinierte Körperteilbezeichnung wird in derselben idiomatischen deutschen Konstruktion wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der priesterlichen Nachkommen
  choice: und seine Söhne
  alternative: und seine Kinder
  rationale: Der Vers betrifft Aaron und seine männlichen Nachkommen im Priesterdienst. Die konkrete maskuline Referenz wird daher nicht verallgemeinert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die reflexive Form „sich die Hände und die Füße waschen“ ist natürlicher als eine wörtliche Nachbildung mit Possessivpronomen. „daraus“ hält die knappe Ausdrucksweise des Hebräischen fest; die kontextuelle Ergänzung „mit Wasser“ steht in der Fußnote.
