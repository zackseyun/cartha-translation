  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: de
  text: Eine Elle soll seine Länge und eine Elle seine Breite betragen; quadratisch soll er sein, und seine Höhe soll zwei Ellen betragen. Seine Hörner sollen aus einem Stück mit ihm gearbeitet sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus ihm“; die Hörner sollen mit dem Altar aus einem Stück gearbeitet und nicht gesondert angesetzt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה
  choice: eine Elle
  rationale: Die alte Maßeinheit wird beibehalten, um formale Entsprechung zu wahren und eine scheinpräzise moderne Umrechnung zu vermeiden.
- source_word: אָרְכּוֹ
  choice: seine Länge
  rationale: Das maskuline Suffix bezieht sich auf den Altar im Kontext.
- source_word: רָחְבּוֹ
  choice: seine Breite
  rationale: Natürliche moderne Bezeichnung der waagerechten Abmessung.
- source_word: רָבוּעַ
  choice: quadratisch
  rationale: Gibt die Form klar und idiomatisch wieder; altertümliche Umschreibungen wie „viereckig“ sind weniger präzise.
- source_word: יִהְיֶה
  choice: soll er sein
  rationale: Der Imperfekt formuliert hier eine verbindliche Bauvorschrift.
- source_word: אַמָּתַיִם
  choice: zwei Ellen
  rationale: Die Dualform bezeichnet ausdrücklich zwei Ellen.
- source_word: קֹמָתוֹ
  choice: seine Höhe
  rationale: Im baulichen Zusammenhang ist „Höhe“ die natürliche Entsprechung.
- source_word: מִמֶּנּוּ
  choice: aus ihm selbst hervorgehen
  rationale: Bewahrt das wörtliche Bild „aus ihm“ und vermittelt zugleich, dass die Hörner integraler Bestandteil des Altars und nicht separat angesetzt sind.
- source_word: קַרְנֹתָיו
  choice: seine Hörner
  rationale: Bewahrt den etablierten kultischen Begriff und seine innerbiblischen Bezüge.
