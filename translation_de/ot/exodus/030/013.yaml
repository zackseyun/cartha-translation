  verdict: revise
  source_fidelity: Die Mengenangabe, der Maßstab des Heiligtumsschekels, die Erläuterung von zwanzig Gera und die abschließende Abgabe an Jahwe sind zutreffend wiedergegeben. Die Zensusformel כָּל־הָעֹבֵר עַל־הַפְּקֻדִים ist idiomatisch und ihre genaue wörtliche Bildlichkeit ist nicht völlig eindeutig; eine moderne deutsche Wiedergabe sollte jedoch den Bezug auf die Erfassung bei der Zählung klar ausdrücken.
  naturalness: '„zu den Gemusterten hinübergeht“ ist im modernen Standarddeutsch unnatürlich und missverständlich: „gemustert“ bezeichnet gewöhnlich ein Muster oder eine militärische Musterung, und „hinübergeht“ suggeriert eine räumliche Bewegung. „bei der Zählung erfasst wird“ ist idiomatisch, verständlich und bewahrt den Zensusbezug.'
  terminology: „Schekel“, „Gera“, „Heiligtum“ und „Jahwe“ sind angemessen. „Abgabe an Jahwe“ gibt die Empfängerrelation von לַיהוָה präziser wieder als „für Jahwe“ und bewahrt den Charakter einer vorgeschriebenen Darbringung, ohne den technischen Opferterminus zu überladen.
