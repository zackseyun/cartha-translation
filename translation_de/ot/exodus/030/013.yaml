base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: de
  text: Das soll jeder geben, der bei der Zählung erfasst wird:[a] einen halben Schekel nach dem Schekel des Heiligtums – der Schekel hat zwanzig Gera –, einen halben Schekel als Abgabe an Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der unter die Registrierten aufgenommen wird“. Die hebräische Wendung ist im Zusammenhang einer Volkszählung eine Zensusformel für diejenigen, die in die amtliche Zählung eingehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Das soll … geben
  rationale: Die demonstrative Einleitung und der vorschreibende Sinn des Imperfekts werden in natürlichem deutschen Rechtsstil wiedergegeben.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: jeder, der zu den Gemusterten hinübergeht
  rationale: Die konkrete Bewegungssprache des Hebräischen bleibt erhalten; zugleich bezeichnet „Gemusterte“ die amtlich Erfassten einer Zählung. Eine Fußnote erläutert den idiomatischen Zensusbezug.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: einen halben Schekel
  rationale: Direkte und im Deutschen geläufige Wiedergabe der Gewichts- beziehungsweise Währungseinheit.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Präposition bezeichnet hier den maßgeblichen Gewichtsstandard; die Genitivform bewahrt die kultische Zuordnung ohne unnötige Deutung.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: der Schekel hat zwanzig Gera
  rationale: Die erklärende Nominalklausel wird knapp und verständlich wiedergegeben.
- source_word: תְּרוּמָה לַיהוָה
  choice: als Abgabe für Jahwe
  rationale: „Abgabe“ erfasst hier den vorgeschriebenen, für Gott ausgesonderten Beitrag; „für“ gibt die Bestimmung natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diese Funktion und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von תְּרוּמָה
  choice: Abgabe
  alternative: Opfergabe
  rationale: Im Zusammenhang der Volkszählung bezeichnet das Wort den für Jahwe ausgesonderten Pflichtbeitrag. „Abgabe“ wahrt den finanziellen Charakter, ohne den kultischen Zweck zu leugnen.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil mit knapper gesetzlicher Satzführung. Alte Maßeinheiten und der Gottesname bleiben erhalten; die schwer übertragbare Zensusformel wird formal wiedergegeben und in einer Fußnote erläutert.
