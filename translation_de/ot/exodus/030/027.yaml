  text: and the table and all its utensils[a], and the lampstand and its utensils, and the altar of incense,
translation:
  language: de
  text: den Tisch und alle seine Geräte, den Leuchter und seine Geräte und den Räucheraltar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Das Substantiv bezeichnet hier schlicht den Tisch. Der Zusammenhang macht deutlich, dass der heilige Tisch im Heiligtum gemeint ist; die im Hebräischen nicht wiederholte ausführlichere Bezeichnung wird nicht ergänzt.
- source_word: כָּל כֵּלָיו
  choice: mit all seinen Geräten
  rationale: כְּלִי kann Geräte, Gefäße oder sonstige zugehörige Gegenstände bezeichnen. „Geräte“ ist im Deutschen weit genug und passt zum Inventar des Heiligtums.
- source_word: הַמְּנֹרָה
  choice: den Leuchter
  rationale: „Leuchter“ gibt den gewöhnlichen hebräischen Sachbegriff verständlich und würdig wieder, ohne ihn als „Menora“ zu transliterieren.
- source_word: כֵּלֶיהָ
  choice: mit seinen Geräten
  rationale: Das Suffix bezieht sich auf den Leuchter. „Geräte“ wahrt dieselbe Wortwahl wie beim Tisch und deckt die Breite von כְּלִי ab.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: den Räucheraltar
  rationale: Die Status-constructus-Verbindung bezeichnet den für das Räucherwerk bestimmten Altar. „Räucheraltar“ ist eine natürliche und etablierte deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die koordinierte Aufzählung wird knapp wiedergegeben. Das wiederholte וְאֶת markiert die einzelnen Objekte; im Deutschen genügt die Aufzählungsstruktur. Da der Vers syntaktisch an den vorangehenden Auftrag zum Salben anschließt, beginnt die Übersetzung als Satzfragment mit Kleinschreibung.
