  text: וְ/שָֽׁחַקְתָּ֣ מִמֶּ/נָּה֮ הָדֵק֒ וְ/נָתַתָּ֨ה מִמֶּ֜/נָּה לִ/פְנֵ֤י הָ/עֵדֻת֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְ/ךָ֖ שָׁ֑מָּ/ה קֹ֥דֶשׁ קָֽדָשִׁ֖ים תִּהְיֶ֥ה לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: de
  text: Zermahle etwas davon ganz fein und lege etwas davon vor das Zeugnis im Zelt der Begegnung, wo ich dir begegnen werde. Für euch soll es hochheilig sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Heiliges der Heiligkeiten“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: Zermahle
  rationale: Das Verb bezeichnet hier das Zerkleinern der Räuchermischung zu feinem Pulver. „Zermahlen“ ist im Deutschen präzise und für diesen Gegenstand idiomatisch.
- source_word: מִמֶּנָּה
  choice: etwas davon
  rationale: 'Die Verbindung ist partitiv: Nur ein Teil der Räuchermischung wird fein zermahlen und vor das Zeugnis gelegt.'
- source_word: הָדֵק
  choice: ganz fein
  rationale: Die adverbiale Form bezeichnet beziehungsweise verstärkt den sehr feinen Mahlgrad. „Ganz fein“ gibt dies natürlich und knapp wieder.
- source_word: וְנָתַתָּה
  choice: lege
  rationale: נתן hat ein breites Bedeutungsspektrum. Bei der vorgeschriebenen rituellen Platzierung ist „legen“ im Deutschen passend.
- source_word: לִפְנֵי הָעֵדֻת
  choice: vor das Zeugnis
  rationale: Die Übersetzung bewahrt den kultischen Ausdruck des hebräischen Textes, ohne ihn deutend zur Lade oder zu den Tafeln zu erweitern.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Die Wendung gibt die kultische Bezeichnung verständlich wieder und hält zugleich die Verbindung zur folgenden Aussage über Gottes Begegnung aufrecht.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: wo ich dir begegnen werde
  rationale: Der Niphal von יעד bezeichnet hier die verabredete Begegnung. Das singularische „dir“ entspricht לְךָ.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Steigerung bezeichnet den höchsten Grad der Heiligkeit. „Hochheilig“ ist im Deutschen würdig, knapp und auf die Räuchermischung gut anwendbar.
- source_word: תִּהְיֶה לָכֶם
  choice: Für euch soll es … sein
  rationale: Diese Formulierung bewahrt die Beziehung zu der angesprochenen Gemeinschaft, ohne einen Besitzanspruch hineinzulesen.
theological_decisions:
- issue: Bezug von „das Zeugnis“
  choice: Der kultische Ausdruck „das Zeugnis“ bleibt im Haupttext stehen.
  alternative: „die Lade des Zeugnisses“ oder „die Bundestafeln“
  rationale: Der hebräische Vers nennt ausdrücklich das Zeugnis und legt dessen genaueren gegenständlichen Bezug hier nicht fest. Eine Erweiterung würde die im Ausgangstext verbleibende Offenheit einschränken.
- issue: Wiedergabe der Heiligkeitssteigerung
  choice: קֹדֶשׁ קָדָשִׁים wird im Haupttext mit „hochheilig“ wiedergegeben.
  alternative: „Heiliges der Heiligkeiten“
  rationale: „Hochheilig“ vermittelt die superlative Bedeutung in natürlichem modernem Deutsch. Die formnähere Wendung wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultischer Begrifflichkeit. Die Wiederholung „etwas davon“ folgt bewusst dem hebräischen Text. Der Fußnotenmarker steht bei der Heiligkeitsformel, auf die sich die Fußnote tatsächlich bezieht.
