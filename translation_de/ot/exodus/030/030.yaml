base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/030.yaml
  text: And you shall anoint Aaron and his sons, and you shall consecrate them to serve as priests to me.
translation:
  language: de
  text: Du sollst Aaron und seine Söhne salben und sie weihen, damit sie mir als Priester dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: sollst du salben
  rationale: משׁח bezeichnet hier das rituelle Salben mit dem heiligen Öl zur Einsetzung in den Priesterdienst. „Salben“ bewahrt sowohl den konkreten Vorgang als auch seine kultische Bedeutung; die deutsche Soll-Konstruktion gibt die Anweisung natürlich wieder.
- source_word: וְקִדַּשְׁתָּ
  choice: und sie heiligen
  rationale: קדשׁ im Piel bedeutet, Personen für den heiligen Dienst auszusondern beziehungsweise zu weihen. „Heiligen“ gibt die Grundbedeutung eng wieder und bleibt im modernen Deutschen verständlich; „weihen“ wäre im Kontext ebenfalls möglich, betonte aber stärker den Einsetzungsritus.
- source_word: לְכַהֵן
  choice: damit sie … als Priester dienen
  rationale: Das Verb כהן bedeutet, als Priester tätig zu sein beziehungsweise Priesterdienst auszuüben. „Als Priester dienen“ ist natürliches Deutsch und bewahrt sowohl Amt als auch Tätigkeit. Die finale Wiedergabe mit „damit“ macht die Zweckbeziehung des לְ mit Infinitiv deutlich.
- source_word: לִי
  choice: mir
  rationale: Die Präposition ל mit Suffix bezeichnet hier den auf JHWH ausgerichteten Dienst. „Mir dienen“ ist im Deutschen idiomatischer als „zu mir dienen“ und bleibt semantisch direkt.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Der hebräische Ausdruck ist ausdrücklich maskulin und meint in diesem priesterlichen Zusammenhang Aarons Söhne; eine geschlechtsneutrale Wiedergabe wäre sachlich ungenau.
- source_word: וְאֶת ... וְאֶת
  choice: Aaron und seine Söhne
  rationale: Die wiederholte Akkusativpartikel kennzeichnet beide koordinierten Objekte. Im Deutschen genügt die flüssige Verbindung mit „und“.
theological_decisions:
- issue: Kultischer Sinn von קדשׁ und כהן
  choice: „heiligen“ und „als Priester dienen“
  alternative: „weihen“ und „den Priesterdienst ausüben“
  rationale: Die Formulierung hält fest, dass Aaron und seine Söhne für einen heiligen, auf Gott ausgerichteten Priesterdienst ausgesondert werden. Sie wahrt die kultische Aussage, ohne spätere kirchliche Amtsvorstellungen einzutragen.
- issue: Zweckbeziehung von לְכַהֵן לִי
  choice: „damit sie mir als Priester dienen“
  alternative: „um mir als Priester zu dienen“
  rationale: Beide Wiedergaben sind möglich. „Damit sie“ bezieht den Zweck eindeutig auf Aaron und seine Söhne und vermeidet im Deutschen eine mögliche falsche Zuordnung des Infinitivs zum angesprochenen Mose.
- issue: Geschlechtsspezifische Wiedergabe von בָּנָיו
  choice: „seine Söhne“
  alternative: „seine Kinder“
  rationale: Der Ausgangstext bezeichnet konkret Aarons Söhne und damit die männliche priesterliche Linie. Diese Spezifizierung wird nicht neutralisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Die Voranstellung „Aaron und seine Söhne“ bewahrt die Hervorhebung der hebräischen Objekte; „sollst du“ entspricht dem anweisenden Kontext. Keine Fußnote ist erforderlich.
