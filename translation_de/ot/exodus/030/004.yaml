base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: de
  text: Und du sollst für ihn zwei goldene Ringe unterhalb seiner Zierleiste[a] anbringen. An seinen beiden Seitenflächen sollst du sie anbringen, auf seinen beiden Seiten[b]. Sie sollen als Halterungen für die Stangen dienen[c], mit denen man ihn trägt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »unterhalb seiner Einfassung« beziehungsweise »unter seinem Rand«; das hebräische Wort זֵר bezeichnet die Zierkante rings um den Altar.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »an seinen beiden Seitenflächen … auf seinen beiden Seiten«; die etwas wiederholende Formulierung betont die Anbringung auf beiden Seiten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Sie sollen Häuser für die Stangen sein«, das heißt Aufnahmen oder Halterungen für die Tragstangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: goldene Ringe
  rationale: Bezeichnet aus Gold gefertigte Ringe; die natürliche deutsche Wortstellung bewahrt Material und Gegenstand.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: unterhalb seiner Zierleiste
  rationale: זֵר bezeichnet hier die zuvor genannte umlaufende dekorative Einfassung; »Zierleiste« ist im handwerklichen Zusammenhang präzise und verständlich.
- source_word: צַלְעֹתָיו
  choice: seinen beiden Seitenflächen
  rationale: צֵלָע kann Seite, Rippe oder seitliches Bauteil bedeuten. »Seitenflächen« passt zu dem gefertigten Altar, ohne eine nicht ausdrücklich genannte Plattenkonstruktion vorauszusetzen.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: auf seinen beiden Seiten
  rationale: Gibt die räumliche Verteilung auf beide Seiten eng am Hebräischen wieder und erhält dessen Wiederholung.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: Sie sollen als Halterungen für die Stangen dienen
  rationale: Das wörtliche »Häuser« bezeichnet hier Aufnahmen beziehungsweise Halterungen; die Funktionsangabe ist in modernem Deutsch klar.
- source_word: בַדִּים
  choice: Stangen
  rationale: Im Zusammenhang mit dem Transport der Heiligtumsgeräte sind Tragstangen gemeint; »Stangen« ist modern und sachlich.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: mit denen man ihn trägt
  rationale: Bewahrt den Zweck und den instrumentalen Bezug auf die Stangen in natürlichem Deutsch.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: du sollst ... anbringen ... sollst du sie anbringen
  rationale: Die wiederholte Anweisung bleibt sichtbar. Bei Ringen ist »anbringen« im Deutschen sachlich natürlicher als zweimal »machen«.
