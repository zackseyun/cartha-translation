base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: de
  text: Und das Räucherwerk, das du zubereitest, dürft ihr nicht nach seiner Zusammensetzung[a] für euch selbst herstellen[b]. Es soll dir heilig sein für Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach seiner Rezeptur“ beziehungsweise „in seinen Mischungsverhältnissen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Diese heilige Räuchermischung durfte nicht für den gewöhnlichen persönlichen Gebrauch nachgemacht werden.'
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: das Räucherwerk
  rationale: Bezeichnet die im unmittelbaren Zusammenhang vorgeschriebene heilige Räuchermischung. „Räucherwerk“ ist im Deutschen natürlich und kultisch passend.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: das du zubereitest
  rationale: Gibt die Relativkonstruktion mit עשה natürlich wieder; bei einer Gewürzmischung ist „zubereiten“ idiomatischer als das wörtlichere „machen“.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: nach derselben Zusammensetzung
  rationale: מַתְכֹּנֶת bezeichnet hier die festgelegte Zusammensetzung beziehungsweise das Mischungsverhältnis. „Derselben“ macht den Bezug auf die zuvor genannte heilige Mischung deutlich, ohne den Sinn auf eine moderne chemische Formel zu verengen.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: dürft ihr keines für euch selbst herstellen
  rationale: Bewahrt den Numeruswechsel zum Plural und bringt das Verbot klar zum Ausdruck. „Für euch selbst“ hält die im Hebräischen angelegte persönliche Verwendung offen.
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Die übliche und theologisch gewichtige Wiedergabe des sakralen Status; „hochheilig“ wäre durch den Wortlaut dieses Verses nicht gedeckt.
- source_word: תִּהְיֶה לְךָ
  choice: es soll dir heilig sein
  rationale: Bewahrt den Singular des hebräischen Pronomens und die relationale Aussage, wie das Räucherwerk zu gelten hat.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition bezeichnet hier Bestimmung oder Zugehörigkeit. Der Gottesname יהוה wird entsprechend der vorgegebenen Projektentscheidung als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Heiligkeitsgrad von קֹדֶשׁ
  choice: heilig
  alternative: hochheilig
  rationale: Im Vers steht קֹדֶשׁ ohne die verstärkende Konstruktion קֹדֶשׁ קָדָשִׁים; deshalb wird kein gesteigerter Heiligkeitsgrad ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom Singular „du/dir“ zum Plural „ihr“ folgt dem hebräischen Text. Die Satzgliederung mit Doppelpunkt verhindert eine schwerfällige Verschachtelung und wahrt zugleich die Hervorhebung der vorgeschriebenen Zusammensetzung.
