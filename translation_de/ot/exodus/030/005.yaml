  text: And you shall make the poles of acacia wood and overlay them with gold.
translation:
  language: de
  text: Die Stangen sollst du aus Akazienholz anfertigen und mit Gold überziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: sollst du … anfertigen
  rationale: Das Qal-Perfekt mit וְ führt im Zusammenhang die göttliche Anweisung fort. Die deutsche Soll-Konstruktion gibt den verbindlichen, aufeinanderfolgenden Charakter natürlich wieder; „anfertigen“ passt zum handwerklichen Kontext.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּד bezeichnet hier die zum Tragen des Heiligtumsgeräts bestimmten Stangen. „Stangen“ ist im modernen Deutschen klar und sachgerecht.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet Holz der Akazie. „Akazienholz“ ist die geläufige und verständliche deutsche Bezeichnung; „aus“ entspricht natürlichem Deutsch bei der Angabe des Werkstoffs.
- source_word: וְצִפִּיתָ
  choice: und … überziehen
  rationale: צפה bezeichnet im handwerklichen Zusammenhang das Überziehen beziehungsweise Verkleiden eines Gegenstands mit einem Material. „Überziehen“ ist präzise und nicht unnötig technisch.
- source_word: אֹתָם
  choice: '[durch das mit „Stangen“ übereinstimmende Satzgefüge wiedergegeben]'
  rationale: Das Objektpronomen bezieht sich auf die Stangen. Im deutschen Satz ist der Bezug beim koordinierten Infinitiv eindeutig, sodass eine Wiederholung mit „sie“ unnatürlich wäre.
- source_word: זָהָב
  choice: mit Gold
  rationale: Das Hebräische nennt Gold unmittelbar als Material; die deutsche Präposition „mit“ ist bei „überziehen“ idiomatisch erforderlich.
