  text: וּ/מָשַׁחְתָּ֥ ב֖/וֹ אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֖ת אֲר֥וֹן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: de
  text: Damit sollst du das Zelt der Begegnung und die Lade des Zeugnisses[a] salben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Bundeslade“; im Hebräischen steht hier wörtlich „die Lade des Zeugnisses“.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: sollst du … salben
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit vorangestellter Konjunktion führt die Anweisungsfolge fort. „Sollst du … salben“ gibt den verpflichtenden Charakter natürlich wieder und bewahrt den kultischen Fachbegriff.
- source_word: בּוֹ
  choice: Damit
  rationale: Die Präposition ב mit Suffix der 3. Person maskulin Singular verweist auf das zuvor genannte Salböl. „Damit“ drückt den instrumentalen Sinn knapp und idiomatisch aus.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wiedergabe bildet die hebräische Genitivverbindung verständlich ab und bezeichnet das Heiligtumszelt als Ort der Begegnung, ohne es unnötig auszudeuten.
- source_word: אֲרוֹן
  choice: die Lade
  rationale: „Lade“ ist im Heiligtumskontext die herkömmliche und treffende deutsche Bezeichnung für den heiligen Behälter.
- source_word: הָעֵדֻת
  choice: des Zeugnisses
  rationale: Die formale Entsprechung folgt dem ausdrücklichen hebräischen Wort „Zeugnis“ und vermeidet, es im Haupttext durch „Bund“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe von אֲרוֹן הָעֵדֻת
  choice: die Lade des Zeugnisses
  alternative: die Bundeslade; die Lade des Bundes; die Lade des Zeugnisses/Wahrzeichens
  rationale: Der hebräische Text verwendet hier ausdrücklich עֵדוּת („Zeugnis“), nicht בְּרִית („Bund“). Die gewählte Fassung bewahrt diese lexikalische und theologische Eigenheit; die geläufige traditionelle Bezeichnung „Bundeslade“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich, während die kultischen Schlüsselbegriffe und die Unterscheidung zwischen „Zeugnis“ und „Bund“ erhalten bleiben.
