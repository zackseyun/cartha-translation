lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Verb דבר bezeichnet hier im narrativen Redeeinleitungssatz Gottes Sprechen; „sprach“ ist die natürliche, würdevolle deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im Hebräischen stehenden Eigennamen zu bewahren.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet den Adressaten der Rede; „zu Mose“ entspricht der üblichen deutschen Formulierung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den Inhalt der folgenden direkten Rede ein. Im heutigen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das wörtliche „und sagte“ oder „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die hebräische Redeeinleitungsformel idiomatisch wieder; „Mose“ folgt der etablierten deutschen Namensform.
