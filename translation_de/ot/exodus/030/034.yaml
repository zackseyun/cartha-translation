  text: וַ/יֹּאמֶר֩ יְהוָ֨ה אֶל מֹשֶׁ֜ה קַח לְ/ךָ֣ סַמִּ֗ים נָטָ֤ף וּ/שְׁחֵ֨לֶת֙ וְ/חֶלְבְּנָ֔ה סַמִּ֖ים וּ/לְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּ/בַ֖ד יִהְיֶֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose: »Nimm dir Duftstoffe: Stakte[a], Räucherklaue und Galbanum, Duftstoffe, und reinen Weihrauch; von jedem soll es gleich viel sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Identität von »Stakte« und »Räucherklaue« ist unsicher. Die hebräischen Wörter bezeichnen vermutlich bestimmte aromatische Zutaten für das Räucherwerk; hier stehen die traditionellen Bezeichnungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Die Erzählform führt die Handlung weiter; »Da sprach« gibt diese Abfolge in würdigem, natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Das Dativpronomen bewahrt die persönliche beziehungsweise reflexive Nuance von לְךָ.
- source_word: סַמִּים
  choice: Duftstoffe
  rationale: Der Oberbegriff bezeichnet aromatische Zutaten für das Räucherwerk; »Duftstoffe« ist im Deutschen verständlich und sachlich passend. Die Wiederholung wird durch »diese Duftstoffe« bewahrt.
- source_word: נָטָף
  choice: Stakte
  rationale: Die genaue Substanz ist unsicher; »Stakte« ist die traditionelle Bezeichnung dieser Räucherzutat. Die Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: שְׁחֵלֶת
  choice: Räucherklaue
  rationale: Die genaue Identität ist unsicher; »Räucherklaue« ist die eingebürgerte deutsche Bezeichnung für die traditionell als Onycha verstandene Räucherzutat.
- source_word: חֶלְבְּנָה
  choice: Galbanum
  rationale: Das Wort wird gewöhnlich als Galbanum, ein aromatisches Harz, identifiziert.
- source_word: לְבֹנָה זַכָּה
  choice: reinem Weihrauch
  rationale: Die Formulierung gibt sowohl den Weihrauch als auch das Merkmal seiner Reinheit wieder.
- source_word: בַּד בְּבַד
  choice: von jedem soll es gleich viel sein
  rationale: Die hebräische Wendung verlangt gleiche Mengen beziehungsweise Anteile der genannten Zutaten; die deutsche Formulierung ist klar und bewahrt den distributiven Sinn.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Verwendung des Eigennamens wahrt die Unterscheidung zwischen dem offenbarten Gottesnamen und einem ersetzenden Hoheitstitel, ohne darüber hinaus eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas auffällige Wiederholung von »Duftstoffe« bildet die Wiederaufnahme des hebräischen סַמִּים ab, wird aber durch »nämlich« und den Gedankenstrich syntaktisch gegliedert. Der Fußnotenmarker [a] steht unmittelbar bei der ersten der beiden gemeinsam erläuterten unsicheren Bezeichnungen.
