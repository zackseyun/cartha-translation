base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: de
  text: Du sollst ihn vor den Vorhang stellen, der vor der Lade des Zeugnisses steht, vor die Sühneplatte[a], die über dem Zeugnis liegt, dort, wo ich dir begegnen werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sühnedeckel; traditionell auch: Gnadenthron.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Du sollst ihn … stellen
  rationale: נתן ist weit gefasst; im Zusammenhang der räumlichen Anordnung des Räucheraltars gibt „stellen“ die Anweisung natürlich und präzise wieder. Das maskuline Pronomen verweist auf den Altar aus dem vorherigen Kontext.
- source_word: לִפְנֵי
  choice: vor
  rationale: Das zweimalige לִפְנֵי wird räumlich mit „vor“ wiedergegeben; die zweite Konstruktion verlangt im Deutschen wegen der gerichteten Platzierung den Akkusativ („vor die Sühneplatte“).
- source_word: הַפָּרֹכֶת
  choice: der Vorhang
  rationale: פרכת bezeichnet den abschirmenden inneren Vorhang des Heiligtums. „Vorhang“ ist im heutigen Deutsch klarer und natürlicher als „Schleier“.
- source_word: אֲרֹן הָעֵדֻת
  choice: die Lade des Zeugnisses
  rationale: Der hebräische Ausdruck enthält ausdrücklich עֵדוּת („Zeugnis“), nicht בְּרִית („Bund“). Die Übersetzung wahrt diese Wortwahl, statt zur geläufigeren „Bundeslade“ zu harmonisieren.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: כפרת bezeichnet die goldene Deckplatte auf der Lade und trägt eine kultische Bedeutung im Zusammenhang mit Sühne. „Sühneplatte“ benennt Gegenstand und Funktion verständlicher als das traditionelle „Gnadenthron“, ohne sie als gewöhnlichen Deckel erscheinen zu lassen.
- source_word: הָעֵדֻת
  choice: das Zeugnis
  rationale: עֵדוּת wird entsprechend dem Hebräischen auch beim zweiten Vorkommen konsequent als „Zeugnis“ wiedergegeben.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: dorthin, wo ich dir begegnen werde
  rationale: Der Nifal von יעד bezeichnet hier die verabredete Begegnung. „Dir begegnen“ gibt לְךָ idiomatisch wieder; „dorthin, wo“ bewahrt zugleich das ausdrücklich vorhandene שָׁמָּה und bezieht die Ortsangabe natürlich auf die Platzierung.
theological_decisions:
- issue: Wiedergabe des kultischen Begriffs הַכַּפֹּרֶת
  choice: Sühneplatte
  alternative: Sühnedeckel; Gnadenthron
  rationale: „Sühneplatte“ erhält sowohl den konkreten Gegenstand als auch seine kultische Bedeutung, ohne die Bildsprache von „Thron“ in den hebräischen Ausdruck einzutragen. Die sachlich mögliche Alternative „Sühnedeckel“ wird in einer Fußnote genannt.
- issue: Wiedergabe von עֵדוּת in der Bezeichnung der Lade
  choice: Zeugnis
  alternative: Bund
  rationale: Der Text verwendet zweimal עֵדוּת („Zeugnis“). „Bund“ wäre zwar aus der traditionellen Bezeichnung „Bundeslade“ vertraut, würde hier jedoch einen anderen hebräischen Begriff eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der wiederholten räumlichen Anordnung des Hebräischen, wird aber durch „dorthin, wo“ im Deutschen lesbar gegliedert. „Lade des Zeugnisses“ und „Zeugnis“ bewahren bewusst die hebräische Terminologie.
