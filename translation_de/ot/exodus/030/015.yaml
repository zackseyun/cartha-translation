base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: de
  text: Der Reiche soll nicht mehr und der Arme nicht weniger als einen halben Schekel als Abgabe für Jahwe geben, um für euer Leben[a] Sühne zu erwirken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für euch selbst“ beziehungsweise „für eure Seelen“. Das hebräische Wort nefesch kann Seele, Selbst, Person oder Leben bedeuten; im Zusammenhang dieser Zählungsabgabe sind wahrscheinlich die Personen beziehungsweise ihr Leben gemeint.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: der Reiche
  rationale: Das substantivierte Adjektiv bezeichnet repräsentativ den wohlhabenden Menschen und bildet einen klaren Gegensatz zu „der Arme“.
- source_word: יַרְבֶּה / יַמְעִיט
  choice: soll nicht mehr / nicht weniger geben
  rationale: Im Zusammenhang mit dem festgesetzten Betrag bezeichnen die Verben das Über- beziehungsweise Unterschreiten der vorgeschriebenen Abgabe; die deutsche Parallelformulierung bewahrt den ausgewogenen Rechtssatz.
- source_word: הַדַּל
  choice: der Arme
  rationale: Das Wort bezeichnet hier einen Menschen mit geringen wirtschaftlichen Mitteln und entspricht dem Gegensatz zum Reichen.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: als einen halben Schekel
  rationale: Die Präposition steht nach den negierten Vergleichsverben; im Deutschen wird der feste Bezugsbetrag idiomatisch mit „als“ ausgedrückt.
- source_word: תְּרוּמַת יְהוָה
  choice: die Abgabe für Jahwe
  rationale: תְּרוּמָה bezeichnet eine für den heiligen Zweck ausgesonderte Gabe; „Abgabe“ passt zum festgesetzten Zensusbetrag, ohne ihn vorschnell als Opfer einzuordnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname erhält die personale Bezeichnung des hebräischen Textes, statt sie durch einen Titel zu ersetzen.
- source_word: לְכַפֵּר
  choice: um Sühne … zu erwirken
  rationale: Das Verb gehört zur kultischen Sühneterminologie. Die Formulierung macht verständlich, dass die entrichtete Abgabe der Sühne dient, ohne eine bestimmte Sühnetheorie festzulegen.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: für euer Leben
  rationale: נֶפֶשׁ meint im Kontext der Zählung die konkrete Person beziehungsweise ihr Leben, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: לָתֵת
  choice: wenn ihr … entrichtet
  rationale: Der Infinitiv beschreibt den Umstand des Gebens. Der Wechsel zur zweiten Person Plural entspricht dem anschließenden Suffix „euer“ und ergibt einen natürlichen deutschen Satz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet den Eigennamen. „Jahwe“ bewahrt ihn transparent und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von נֶפֶשׁ im Sühnekontext
  choice: für euer Leben
  alternative: für eure Seelen; für euch selbst
  rationale: Im Zusammenhang mit Zählung und Lösegeld steht die Person in ihrem konkreten Leben im Vordergrund. Die Fußnote hält die lexikalische Mehrdeutigkeit offen.
- issue: Wiedergabe von כפר
  choice: Sühne erwirken
  alternative: Sühne schaffen; entsühnen; ein Lösegeld leisten
  rationale: „Sühne“ erhält den kultisch-theologischen Gehalt, ohne das Verb auf eine einzelne spätere Erklärung des Sühnevorgangs festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper rechtlicher Parallelstruktur. „Schekel“ bleibt als antike Gewichtseinheit erhalten; „Abgabe“ verdeutlicht den festgesetzten Beitrag. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
