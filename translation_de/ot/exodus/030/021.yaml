id: EXO.30.21
reference: Exodus 30:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/רָחֲצ֛וּ יְדֵי/הֶ֥ם וְ/רַגְלֵי/הֶ֖ם וְ/לֹ֣א יָמֻ֑תוּ וְ/הָיְתָ֨ה לָ/הֶ֧ם חָק עוֹלָ֛ם ל֥/וֹ וּ/לְ/זַרְע֖/וֹ לְ/דֹרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: de
  text: Sie sollen ihre Hände und Füße waschen, damit sie nicht sterben. Das soll für sie eine bleibende Ordnung sein[a], für ihn[b] und seine Nachkommen von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ewige Ordnung“, „dauerhafte Ordnung“ oder „immerwährende Ordnung“. Die hebräische Wendung חָק עוֹלָם ist eine feste Rechtsformel für eine fortdauernd geltende Vorschrift.'
    reason: lexical_alternative
  - marker: b
    text: „Ihn“ bezieht sich im unmittelbaren Zusammenhang auf Aaron.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: Sie sollen waschen
  rationale: Die Verbform hat in diesem gesetzlichen Zusammenhang anweisenden Sinn. „Sie sollen“ gibt diesen verpflichtenden Charakter in natürlichem modernem Deutsch wieder.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: ihre Hände und Füße
  rationale: Die beiden Körperteile werden wörtlich und in natürlicher deutscher Koordination wiedergegeben.
- source_word: וְלֹא יָמֻתוּ
  choice: damit sie nicht sterben
  rationale: Die Formulierung macht den im Zusammenhang liegenden Zweck beziehungsweise die Folge des Waschens deutlich, ohne die Warnung abzuschwächen.
- source_word: חָק עוֹלָם
  choice: bleibende Ordnung
  rationale: Die gesetzliche Formel bezeichnet eine dauerhaft geltende Vorschrift. „Bleibend“ bewahrt die zeitliche Tragweite, ohne die mögliche Bedeutung vorschnell auf metaphysische Endlosigkeit festzulegen.
- source_word: לָהֶם
  choice: für sie
  rationale: Das pluralische Pronomen wird beibehalten und verweist im Zusammenhang auf Aaron und seine Söhne.
- source_word: לוֹ
  choice: für ihn
  rationale: Das singularische Pronomen des Hebräischen bleibt erhalten; sein nächstliegender Bezug ist Aaron.
- source_word: וּלְזַרְעוֹ
  choice: und seine Nachkommen
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft. „Nachkommen“ ist im modernen Deutsch klarer und natürlicher als „Same“.
- source_word: לְדֹרֹתָם
  choice: von Generation zu Generation
  rationale: Die Wendung gibt die fortdauernde Geltung über die aufeinanderfolgenden Generationen idiomatisch wieder.
theological_decisions:
- issue: Geltungsdauer der kultischen Vorschrift in חָק עוֹלָם
  choice: bleibende Ordnung
  alternative: ewige Ordnung; dauerhafte Ordnung; immerwährende Ordnung
  rationale: Die hebräische Rechtsformel drückt eine fortdauernde Verpflichtung aus. „Bleibend“ wahrt diese Aussage, ohne über den vom Text bezeichneten Bundes- und Kultzusammenhang hinaus eine bestimmte systematisch-theologische Folgerung festzuschreiben.
- issue: Bezug des singularischen Pronomens לוֹ
  choice: für ihn, mit Fußnote zum Bezug auf Aaron
  alternative: für Aaron
  rationale: Die Übersetzung bewahrt den Pronomenwechsel des hebräischen Textes und erläutert lediglich den aus dem unmittelbaren Zusammenhang erschließbaren Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer gesetzlicher Aussage. Der auffällige Wechsel von „für sie“ zum singularischen „für ihn“ wird entsprechend dem Hebräischen bewahrt und durch eine knappe Fußnote erläutert.
