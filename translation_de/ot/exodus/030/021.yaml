  source_fidelity: 'Der deutsche Text gibt die hebräische Abfolge und den Sinn zuverlässig wieder: Waschung von Händen und Füßen, die Todesfolge bei Unterlassung, die dauerhafte gesetzliche Bestimmung sowie den Wechsel von Plural („für sie“) zu Singular („für ihn“) mit Bezug auf Aarons Nachkommenschaft. „Damit sie nicht sterben“ ist im gesetzlichen Kontext eine angemessene Wiedergabe von וְלֹא יָמֻתוּ.'
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Formulierung „bleibende Ordnung“ ist verständlich und trägt den rechtlich-kultischen Charakter von חָק עוֹלָם angemessen. Die Abfolge „für sie … für ihn und seine Nachkommen“ ist leicht markiert, bildet aber bewusst den hebräischen Pronomenwechsel ab und wird sinnvoll erläutert.
  terminology: „Ordnung“ ist für חָק in diesem Kontext tragfähig; „bleibend“ wahrt die intendierte fortdauernde Geltung, ohne eine über den Text hinausgehende metaphysische Aussage zu erzwingen. „Nachkommen“ gibt זַרְעוֹ idiomatisch und kollektiv wieder. Die Fußnoten sind korrekt verankert und erläutern sowohl die Dauerformel als auch den Bezug von „ihn“ sachlich.
