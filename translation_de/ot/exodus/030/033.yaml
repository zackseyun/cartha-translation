source:
  edition: WLC
  text: אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔/הוּ וַ/אֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖/נּוּ עַל זָ֑ר וְ/נִכְרַ֖ת מֵ/עַמָּֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/033.yaml
  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: de
  text: Wer eine Mischung wie diese herstellt oder etwas davon auf einen Unbefugten[a] aufträgt, soll aus seinem Volk ausgerottet werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf einen Fremden«, »auf einen Außenstehenden« oder »auf einen Laien«. Das hebräische Wort bezeichnet hier wahrscheinlich jemanden, der zum heiligen Gebrauch des Öls nicht befugt ist.'
    reason: lexical_alternative
  - marker: b
    text: »Aus seinem Volk ausgerottet werden« ist eine rechtliche Bundesformel. Auf welche Weise diese Strafe vollzogen wird, sagt der Text hier nicht ausdrücklich.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Wer
  rationale: Die wörtliche Wendung »ein Mann, der« hat hier allgemeinen rechtlichen Sinn. »Wer« gibt diesen im modernen Deutschen natürlich und geschlechtsübergreifend wieder.
- source_word: יִרְקַח
  choice: herstellt
  rationale: רקח bezeichnet das fachkundige Mischen beziehungsweise Bereiten einer wohlriechenden Substanz. Zusammen mit »in derselben Mischung« vermittelt »herstellt« den technischen Sinn klar.
- source_word: כָּמֹהוּ
  choice: in derselben Mischung
  rationale: Die Formulierung verweist auf das zuvor beschriebene heilige Salböl und verbietet eine entsprechende Nachbildung. Sie wahrt den Bezug auf die gleiche Art beziehungsweise Zusammensetzung, ohne eine vollständige stoffliche Identität ausdrücklich festzulegen.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: oder etwas davon … aufträgt
  rationale: נתן mit מן bezeichnet hier, dass ein Teil des Öls auf eine Person gebracht wird. »aufträgt« ist im Zusammenhang mit Salböl präziser und natürlicher als das allgemeinere »gibt«.
- source_word: עַל זָר
  choice: auf einen Unbefugten
  rationale: זָר meint in diesem kultischen Zusammenhang keinen ethnisch Fremden, sondern jemanden, der für den Empfang des heiligen Salböls nicht berechtigt ist.
- source_word: וְנִכְרַת
  choice: soll … ausgerottet werden
  rationale: Die deutsche biblische Rechtsformel bewahrt die Schwere und das Passiv des hebräischen Ausdrucks, ohne die konkrete Vollzugsweise festzulegen.
- source_word: מֵעַמָּיו
  choice: aus seinem Volk
  rationale: Die direkte Wiedergabe bezeichnet die Entfernung aus der eigenen Bundes- und Volksgemeinschaft.
theological_decisions:
- issue: Bedeutung von זָר im priesterlich-kultischen Gesetz
  choice: Unbefugter
  alternative: Fremder; Außenstehender; Laie
  rationale: Im Kontext liegt der Akzent auf fehlender kultischer Berechtigung, nicht auf fremder Herkunft. »Unbefugter« macht diese Heiligkeitsgrenze deutlich, ohne eine ethnische Aussage einzutragen.
- issue: Bedeutung der Rechtsformel וְנִכְרַת מֵעַמָּיו
  choice: soll aus seinem Volk ausgerottet werden
  alternative: soll aus seinem Volk ausgeschlossen werden; soll getötet werden
  rationale: Der hebräische Text nennt hier nicht ausdrücklich, ob die Sanktion durch Ausschluss, Tod oder göttliches Eingreifen vollzogen wird. Die traditionelle Rechtsformel lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die Satzstruktur bleibt knapp und parallel zum Hebräischen; die Fußnoten bewahren die lexikalische Breite und die nicht näher bestimmte Art der Sanktion.
