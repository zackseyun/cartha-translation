source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְ/כַנּ֥/וֹ נְחֹ֖שֶׁת לְ/רָחְצָ֑ה וְ/נָתַתָּ֣ אֹת֗/וֹ בֵּֽין אֹ֤הֶל מוֹעֵד֙ וּ/בֵ֣ין הַ/מִּזְבֵּ֔חַ וְ/נָתַתָּ֥ שָׁ֖מָּ/ה מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: de
  text: Du sollst ein Becken[a] aus Bronze[b] anfertigen, dazu sein Gestell[c] aus Bronze, zum Waschen. Du sollst es zwischen das Zelt der Begegnung und den Altar stellen und dort Wasser hineingeben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Waschbecken“ oder „Waschkessel“; gemeint ist ein großes Wassergefäß für die Waschungen am Heiligtum.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann je nach Zusammenhang Kupfer oder eine Kupferlegierung bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Oder „Untersatz“.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „und dort Wasser hingeben“. Der Zusammenhang legt nahe, dass das Wasser in das Becken gegeben wird.'
    reason: source_ambiguity
lexical_decisions:
- source_word: כִּיּוֹר
  choice: Becken
  rationale: Das Wort bezeichnet hier ein großes Wassergefäß für die Waschungen am Heiligtum. „Becken“ ist im heutigen Deutsch klar und vermeidet das altertümliche „Waschkessel“.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Der Metallbegriff kann Kupfer oder eine Kupferlegierung bezeichnen. Im Zusammenhang mit den Geräten des Heiligtums ist „Bronze“ die geläufige und plausible Wiedergabe; die lexikalische Alternative wird in einer Fußnote genannt.
- source_word: כַּן
  choice: Gestell
  rationale: Gemeint ist die tragende Konstruktion beziehungsweise der Unterbau des Beckens. „Gestell“ bezeichnet diese Funktion natürlich und präzise.
- source_word: לְרָחְצָה
  choice: zum Waschen
  rationale: Der Ausdruck gibt den Zweck an, ohne in diesem Vers ausdrücklich zu sagen, wer oder was gewaschen wird. Die knappe Wiedergabe bewahrt diese Offenheit.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wendung bezeichnet das Heiligtumszelt als Ort der Begegnung. Diese Wiedergabe ist verständlich und bildet beide Bestandteile des hebräischen Ausdrucks ab.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: Direkte und im Kontext eindeutige Wiedergabe.
- source_word: שָׁמָּה
  choice: dort
  rationale: Das Ortsadverb wird ausdrücklich wiedergegeben. „Hineingeben“ macht den im Zusammenhang naheliegenden Bezug zum Becken idiomatisch verständlich, während die Fußnote den knapperen hebräischen Wortlaut erkennen lässt.
- source_word: מַיִם
  choice: Wasser
  rationale: Direkte Wiedergabe des im Hebräischen pluralisch geformten, aber als Stoffbezeichnung gebrauchten Substantivs.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Du sollst ... anfertigen; du sollst ... stellen und ... hineingeben
  rationale: Die Verbfolge hat in diesem Anweisungszusammenhang verpflichtende beziehungsweise imperativische Kraft. „Du sollst“ erhält den feierlichen Weisungsstil, ohne altertümlich zu wirken.
theological_decisions:
- issue: Zweck der Waschung
  choice: „zum Waschen“ ohne ausdrückliches Objekt
  alternative: „damit Aaron und seine Söhne sich waschen“
  rationale: Der weitere Zusammenhang nennt die Priester, doch dieser Vers selbst lässt das Objekt der Waschung unausgesprochen. Die Übersetzung fügt diese kontextuelle Deutung daher nicht in den Haupttext ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die wiederholte Soll-Form bewahrt den verpflichtenden Anweisungscharakter. Fachsprachliche oder konfessionell geprägte Ausdrücke werden vermieden; lexikalische Unsicherheiten stehen in den Fußnoten.
