  source_fidelity: 'Der Entwurf trifft die wesentlichen Elemente: Adressaten, heiliges Salböl, die Bezugnahme auf Gott und die Dauer über die Generationen. Allerdings ist die Stellung von „Generation für Generation“ im Prädikativsatz stilistisch holprig; außerdem lässt „durch alle eure Generationen hindurch“ לְדֹרֹתֵיכֶם klarer erkennen.'
