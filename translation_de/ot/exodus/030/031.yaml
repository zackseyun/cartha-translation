  yaml_path: translation/ot/exodus/030/031.yaml
  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: de
  text: 'Zu den Israeliten sollst du Folgendes sagen: »Dies soll für mich heiliges Salböl sein, durch alle eure Generationen hindurch.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt wörtlich »Söhne Israels« einschließlich des gesamten Volkes wieder.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: heiliges Salböl
  rationale: Die hebräische Genitivverbindung bezeichnet Öl zur heiligen Salbung; »heiliges Salböl« ist prägnant und sachlich genau.
- source_word: לִי
  choice: für mich
  rationale: Bewahrt die Ausrichtung beziehungsweise besondere Zugehörigkeit zu Gott, ohne sie enger als »mein Eigentum« oder »mir geweiht« auszulegen.
- source_word: לְדֹרֹתֵיכֶם
  choice: Generation für Generation
  rationale: Eine natürliche deutsche Wiedergabe der fortdauernden Geltung über die aufeinanderfolgenden Generationen Israels hinweg.
theological_decisions:
- issue: Bedeutung von לִי bei der Heiligkeit des Salböls
  choice: für mich
  alternative: mir geweiht
  rationale: »Für mich« erhält die knappe und offene Formulierung des Hebräischen; »mir geweiht« würde den Gedanken der Weihe ausdrücklich ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp gehalten; »Israeliten« vermeidet das heute missverständliche generische »Söhne Israels«.
