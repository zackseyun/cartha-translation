base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/029.yaml
  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: de
  text: Du sollst sie heiligen, und sie sollen hochheilig sein. Wer sie berührt, wird heilig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist heilig“ beziehungsweise „wird geheiligt“. Das Hebräische kann hier das Heiligwerden durch die Berührung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Du sollst sie heiligen
  rationale: Das Piel von קדשׁ bezeichnet hier das Heiligen beziehungsweise kultische Aussondern. „Heiligen“ ist im Deutschen verständlich, würdig und bildet zugleich die Wiederaufnahme derselben Wortwurzel am Versende ab.
- source_word: וְהָיוּ קֹדֶשׁ קָדָשִׁים
  choice: und sie sollen hochheilig sein
  rationale: קֹדֶשׁ קָדָשִׁים ist eine hebräische Steigerungsform für den höchsten Grad der Heiligkeit. „Hochheilig“ gibt sie in prädikativer Stellung knapp und natürlich wieder.
- source_word: כָּל הַנֹּגֵעַ בָּהֶם
  choice: Alles, was sie berührt
  rationale: Die substantivierte Partizipialkonstruktion ist allgemein formuliert und legt grammatisch nicht eindeutig fest, ob Personen oder Sachen gemeint sind. Das neutrale „Alles, was“ bewahrt diesen weiten Bezug.
- source_word: יִקְדָּשׁ
  choice: wird heilig
  rationale: 'Das Qal von קדשׁ kann hier resultativ beziehungsweise inchoativ verstanden werden: Durch die Berührung tritt Heiligkeit ein. „Wird heilig“ bewahrt diese Zustandsveränderung, ohne ihre kultischen Folgen näher auszudeuten.'
theological_decisions:
- issue: Bedeutung der durch Berührung eintretenden Heiligkeit
  choice: Die Berührung führt dazu, dass das Berührende heilig wird; ob dies segensreich, gefährlich oder mit besonderen Einschränkungen verbunden ist, bleibt offen.
  alternative: Die Aussage könnte ausschließlich als positive Weihe oder als Eintritt in einen gefährlichen und beschränkten Heiligkeitsbereich erklärt werden.
  rationale: Der hebräische Text sagt lediglich יִקְדָּשׁ, „wird heilig“. Die Übersetzung bewahrt diese theologische Spannung und trägt keine weitergehende ritualtheologische Deutung ein.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem kultischem Register. Die Wiederholung von „heiligen/heilig“ spiegelt bewusst die hebräische Wortwurzel קדשׁ. „Hochheilig“ vermeidet die räumliche Assoziation von „Allerheiligstes“.
