source:
  edition: WLC
  text: וַ/יְהִ֣י בָרָ֔ד וְ/אֵ֕שׁ מִתְלַקַּ֖חַת בְּ/ת֣וֹךְ הַ/בָּרָ֑ד כָּבֵ֣ד מְאֹ֔ד אֲ֠שֶׁר לֹֽא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָ֖ז הָיְתָ֥ה לְ/גֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: de
  text: Da fiel Hagel, und Feuer flammte mitten im Hagel auf[a]. Der Hagel war überaus heftig – so etwas hatte es im ganzen Land Ägypten nicht gegeben, seit es zu einem Volk geworden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Feuer zuckte mitten im Hagel umher“. Das Hebräische spricht wörtlich von „Feuer“ und beschreibt vermutlich blitzartige Feuererscheinungen im Unwetter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: Da fiel Hagel
  rationale: Die erzählende Konstruktion führt das Ereignis ein. Im Deutschen bezeichnet „Hagel fiel“ das Wettergeschehen natürlicher als das formale „es war Hagel“.
- source_word: וְאֵשׁ
  choice: und Feuer
  rationale: Das hebräische Wort bedeutet wörtlich „Feuer“. Diese Bildsprache bleibt im Haupttext erhalten, ohne sie eindeutig als Blitz zu deuten.
- source_word: מִתְלַקַּחַת
  choice: flammte … auf
  rationale: Das Hitpael-Partizip beschreibt hier lebhaftes, sich bewegendes beziehungsweise aufleuchtendes Feuer. „flammte auf“ ist natürlich und bewahrt das Feuerbild.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: mitten im Hagel
  rationale: Die Wendung bezeichnet das Innere beziehungsweise die Mitte des Hagels und erhält das auffällige Nebeneinander von Hagel und Feuer.
- source_word: כָּבֵד מְאֹד
  choice: überaus heftig
  rationale: כבד bedeutet wörtlich „schwer“, bezeichnet bei diesem Unwetter aber dessen außergewöhnliche Stärke. „überaus heftig“ gibt den idiomatischen Sinn wieder.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: so etwas hatte es … nicht gegeben
  rationale: Die Vergleichsformel erklärt das Ereignis für beispiellos und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: im ganzen Land Ägypten
  rationale: Die territoriale Wendung wird knapp und sachgemäß wiedergegeben.
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: seit es zu einem Volk geworden war
  rationale: Das feminine Verb kann sich grammatisch auf das Land beziehungsweise Ägypten beziehen; גוי bezeichnet hier ein Volk beziehungsweise Gemeinwesen. Die Formulierung bewahrt diesen historischen Bezug, ohne moderne Vorstellungen eines Nationalstaats einzutragen.
theological_decisions:
- issue: Bezug und Bedeutung von מֵאָז הָיְתָה לְגוֹי
  choice: seit es zu einem Volk geworden war
  alternative: seit es eine Nation geworden war
  rationale: „Volk“ entspricht גוי in diesem Kontext besser als das politisch modern gefärbte „Nation“. Das Pronomen „es“ lässt den grammatisch auf Ägypten beziehungsweise das Land bezogenen Ausdruck bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne den inhaltlichen Zusammenhang zu lösen. Das wörtliche Feuerbild bleibt im Haupttext erhalten; die mögliche Deutung als blitzartiges Aufleuchten steht in der Fußnote.
