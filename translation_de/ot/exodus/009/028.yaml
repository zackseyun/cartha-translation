  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: de
  text: Bittet Jahwe inständig! Genug mit Gottes Donner[a] und dem Hagel! Dann werde ich euch ziehen lassen, und ihr werdet nicht länger bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stimmen Gottes“. Im Zusammenhang des Unwetters sind damit Donnerschläge gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Bittet … inständig
  rationale: Der Hifil-Imperativ von עתר bezeichnet hier ein eindringliches Bitten beziehungsweise Fürbitten. Die Formulierung ist im heutigen Deutsch natürlich und gibt die Dringlichkeit wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְרַב מִהְיֹת
  choice: Es ist genug mit
  rationale: Die hebräische Wendung drückt aus, dass das gegenwärtige Geschehen mehr als ausreichend gewesen ist und aufhören soll.
- source_word: קֹלֹת אֱלֹהִים
  choice: Gottes Donner
  rationale: קֹלֹת bedeutet wörtlich „Stimmen“ oder „Laute“, bezeichnet im Zusammenhang des Hagelsturms aber Donnerschläge. Der Genitiv bewahrt die ausdrückliche Zuordnung zu Gott.
- source_word: וּבָרָד
  choice: und dem Hagel
  rationale: Direkte und kontextgerechte Wiedergabe von בָּרָד.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Dann werde ich euch ziehen lassen
  rationale: שלח mit den Israeliten als Objekt bedeutet im Exoduszusammenhang, sie freizulassen beziehungsweise ziehen zu lassen. „Dann“ macht den angekündigten Zusammenhang natürlich deutlich.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: und ihr werdet nicht länger hierbleiben
  rationale: Die Wendung „nicht hinzufügen zu bleiben/stehen“ bedeutet, dass sie nicht weiter verweilen müssen. „Hierbleiben“ gibt den Bezug auf Ägypten idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Transliteration wahrt den im hebräischen Text gebrauchten persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von קֹלֹת אֱלֹהִים
  choice: Gottes Donner
  alternative: Stimmen Gottes; gewaltiger Donner
  rationale: Der Sturm- und Hagelkontext spricht eindeutig für Donner, während „Gottes“ die im Hebräischen vorhandene theologische Zuordnung bewahrt. Die mögliche wörtliche Wiedergabe wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eindringliche Bitte des Pharaos und seine anschließende Zusage werden klar voneinander abgesetzt; die hebräische Bildsprache bei „Stimmen Gottes“ bleibt durch die Fußnote sichtbar.
