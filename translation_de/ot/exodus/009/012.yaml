base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: de
  text: Doch Jahwe verhärtete das Herz des Pharaos[a], und er hörte nicht auf sie, wie Jahwe zu Mose gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte das Herz des Pharaos fest“ oder „stärkte das Herz des Pharaos“. Das hebräische Verb bedeutet wörtlicher „stark/fest machen“; in diesem Zusammenhang bezeichnet es den verfestigten Widerstand des Pharaos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: verhärtete
  rationale: חזק bedeutet im Hifil grundsätzlich „stark/fest machen“. In der wiederkehrenden Verbindung mit dem Herzen des Pharaos bezeichnet es dessen verfestigten Widerstand; „verhärtete“ gibt diesen Sinn im Deutschen natürlich wieder, ohne Jahwes ausdrücklich genannte Urheberschaft abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, damit der hebräische Eigenname erkennbar bleibt und nicht durch einen Titel ersetzt wird.
- source_word: לֵב פַּרְעֹה
  choice: das Herz des Pharaos
  rationale: Die hebräische Status-constructus-Verbindung wird idiomatisch wiedergegeben. „Herz“ bleibt erhalten und bezeichnet hier den inneren Sitz von Willen und Haltung, ohne dies im Haupttext auszudeuten.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: sodass er nicht auf sie hörte
  rationale: שמע mit אֶל bedeutet „auf jemanden hören“. Die deutsche Folgekonstruktion „sodass“ gibt den Zusammenhang zwischen der Verhärtung und dem Nicht-Hören natürlich wieder; das Pronomen „sie“ bleibt entsprechend dem Hebräischen unausgedeutet.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: genau wie Jahwe zu Mose gesprochen hatte
  rationale: כַּאֲשֶׁר drückt hier die Entsprechung zur vorausgegangenen Ankündigung aus. Das Plusquamperfekt macht im Deutschen deren zeitliche Vorordnung deutlich.
theological_decisions:
- issue: Göttliches Handeln bei der Verhärtung des Pharaos
  choice: Jahwe verhärtete das Herz des Pharaos
  alternative: Jahwe machte das Herz des Pharaos fest / stärkte das Herz des Pharaos
  rationale: Der hebräische Text nennt Jahwe ausdrücklich als Subjekt und das Herz des Pharaos als Objekt. Die direkte göttliche Urheberschaft wird daher nicht in bloßes Zulassen umgedeutet. Zugleich nennt die Fußnote die wörtlicheren Bedeutungsnuancen von חזק und bewahrt damit die sprachliche und theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, die hebräischen Pronomen und die direkte göttliche Urheberschaft bleiben erhalten. Der Gottesname wird als „Jahwe“ wiedergegeben.
