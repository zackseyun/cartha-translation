  text: רַ֚ק בְּ/אֶ֣רֶץ גֹּ֔שֶׁן אֲשֶׁר שָׁ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל לֹ֥א הָיָ֖ה בָּרָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: de
  text: Nur im Land Goschen, wo die Söhne Israels[a] waren, gab es keinen Hagel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“ beziehungsweise „die Kinder Israels“. Wörtlich steht im Hebräischen: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Nur
  rationale: Die vorangestellte Einschränkung wird im Deutschen natürlich und betont mit „Nur“ wiedergegeben.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: im Land Goschen
  rationale: Die Präposition בְּ und אֶרֶץ bezeichnen hier die Region Goschen; „im Land Goschen“ ist eine formnahe und verständliche Wiedergabe.
- source_word: אֲשֶׁר שָׁם
  choice: wo
  rationale: Relativpartikel und Ortsadverb ergeben zusammen eine lokative Beziehung, die idiomatisch mit „wo“ ausgedrückt wird.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die konkrete hebräische Familienbezeichnung; eine Fußnote nennt die im Deutschen geläufigere kollektive Alternative.
- source_word: לֹא הָיָה בָּרָד
  choice: gab es keinen Hagel
  rationale: Die negierte Existenzform von היה wird im Deutschen idiomatisch mit „gab es keinen“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: Die Hauptübersetzung erhält die ausdrücklich männliche familiäre Form des Hebräischen, ohne die kollektiv gemeinte Bedeutung auszuschließen; diese wird in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt wie der hebräische Text die Ausnahme Goschens hervor; „gab es keinen Hagel“ ist natürlicher als eine formale Nachbildung mit „war kein Hagel“.
