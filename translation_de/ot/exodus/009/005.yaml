  - severity: low
    issue: „und sagte:“ schwächt die enge Redeanbindung von לֵאמֹר leicht ab.
    rationale: 'Nach deutschem Stil und zur angemessenen Wiedergabe der hebräischen Redeeinleitung ist „setzte ... fest: »...«“ vorzuziehen; dadurch wird keine Bedeutungsnuance verändert.'
