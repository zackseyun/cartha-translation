  text: וַ/יָּ֥שֶׂם יְהוָ֖ה מוֹעֵ֣ד לֵ/אמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה הַ/דָּבָ֥ר הַ/זֶּ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/005.yaml
  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: de
  text: 'Und Jahwe setzte einen Zeitpunkt fest[a]: »Morgen wird Jahwe dies im Land tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine bestimmte Zeit“ oder „eine festgesetzte Zeit“.'
    reason: Lexikalische Alternativen für מוֹעֵד; sie verdeutlichen den Sinn des von Jahwe festgesetzten Zeitpunkts, ohne eine im Hebräischen nicht vorhandene wörtliche Wiederholung zu behaupten.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: setzte … fest
  rationale: שׂים bezeichnet hier das Festlegen oder Bestimmen; die deutsche Verbindung »einen Zeitpunkt festsetzen« gibt diesen Sinn natürlich und präzise wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im Deutschen übliche Form.
- source_word: מוֹעֵד
  choice: einen Zeitpunkt
  rationale: מוֹעֵד bezeichnet hier einen festgesetzten Zeitpunkt. »Zeitpunkt« passt zur ausdrücklichen Angabe »morgen« und klingt im modernen Deutsch natürlich.
- source_word: לֵאמֹר
  choice: und sagte
  rationale: Die hebräische Redeformel wird in natürlichem deutschem Erzählstil als Einleitung der direkten Rede wiedergegeben.
- source_word: מָחָר
  choice: Morgen
  rationale: Das Adverb bezeichnet unmittelbar den folgenden Tag und wird schlicht und wörtlich wiedergegeben.
- source_word: יַעֲשֶׂה
  choice: wird … tun
  rationale: עשה ist ein weit gefasstes Verb. »Tun« bewahrt diese Offenheit, ohne die angekündigte Handlung näher auszudeuten.
- source_word: הַדָּבָר הַזֶּה
  choice: dies
  rationale: Das substantivierte deutsche Pronomen gibt den kontextuellen Bezug auf das angekündigte Geschehen knapp und idiomatisch wieder; »diese Sache« wäre formaler, aber weniger natürlich.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Das Land ist aus dem Zusammenhang als Ägypten erkennbar. Die Übersetzung bewahrt die knappe Formulierung des Hebräischen, ohne den Namen ergänzend einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Wiedergabe als »Jahwe« bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die direkte Rede ist klar und knapp gehalten; »Jahwe« folgt der üblichen deutschen Schreibung des Gottesnamens. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Zeitangabe.
