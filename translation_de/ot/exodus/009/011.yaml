  terminology: „Magier“ ist für חַרְטֻמִּים im Exodus-Kontext etabliert und ausreichend weit. „Geschwüre“ gibt שְׁחִין als kollektive Hautplage angemessen wieder. Die Fußnote erläutert den Unterschied zwischen der räumlichen hebräischen Formulierung und dem kontextuell erschlossenen personalen Bezug.
