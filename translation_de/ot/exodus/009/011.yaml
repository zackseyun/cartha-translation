  source_fidelity: 'Der Text gibt die Satzstruktur und die wesentlichen Bezüge des Hebräischen zuverlässig wieder: Die Magier können wegen der Geschwüre nicht vor Mose stehen; die Geschwüre betreffen die Magier und reichen „in ganz Ägypten“. „In ganz Ägypten“ bewahrt die räumliche Formulierung von וּבְכָל־מִצְרָיִם, ohne den im Kontext naheliegenden Personenbezug unzulässig als alleinige Lesart in den Haupttext zu ziehen.'
