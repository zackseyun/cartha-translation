  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: de
  text: Die Magier konnten wegen der Geschwüre nicht vor Mose stehen; denn die Geschwüre waren an den Magiern und in ganz Ägypten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in ganz Ägypten“. Gemeint ist dem Zusammenhang nach, dass die Menschen im ganzen Land von den Geschwüren betroffen waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: die Magier
  rationale: Der Ausdruck bezeichnet im Exodusbuch die kultisch-rituellen Spezialisten des Pharaos. „Magier“ ist im Deutschen eine klare, etablierte Wiedergabe, ohne ihre genaue Funktion übermäßig festzulegen.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: vor Mose stehen
  rationale: Die formnahe Wendung bewahrt die mögliche Bedeutung, in Moses Gegenwart zu treten beziehungsweise sich vor ihm aufzustellen.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: wegen der Geschwüre
  rationale: מִפְּנֵי bezeichnet hier den Grund; שְׁחִין ist ein Sammelbegriff für entzündliche Hautgeschwüre und wird im Deutschen natürlich im Plural wiedergegeben.
- source_word: הַשְּׁחִין
  choice: die Geschwüre
  rationale: Die Wiederholung des Nomens wird aus Gründen der Kohärenz beibehalten; der deutsche Plural gibt den kollektiven beziehungsweise distributiven Sinn wieder.
- source_word: בַּחֲרְטֻמִּם
  choice: an den Magiern
  rationale: Das Präfix ב bezeichnet hier die körperliche Betroffenheit; „an“ ist bei Hauterscheinungen idiomatisch und wahrt die Parallelität, ohne lediglich eine Zugehörigkeit zur Gruppe auszudrücken.
- source_word: וּבְכָל מִצְרַיִם
  choice: und in ganz Ägypten
  rationale: Diese Wiedergabe folgt dem hebräischen Wortlaut und bewahrt dessen räumliche Formulierung. Der Zusammenhang legt nahe, dass die Menschen im ganzen Land betroffen waren.
