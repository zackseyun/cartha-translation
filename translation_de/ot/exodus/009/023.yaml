id: EXO.9.23
reference: Exodus 9:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: de
  text: Da streckte Mose seinen Stab zum Himmel aus, und Jahwe ließ Donner und Hagel kommen. Feuer fuhr zur Erde hinab,[a] und Jahwe ließ Hagel auf das Land Ägypten regnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Feuer bewegte sich erdwärts«; im Zusammenhang sind damit wahrscheinlich Blitze gemeint.'
    reason: Bewahrt die ungewöhnliche hebräische Bildsprache und nennt zugleich die naheliegende meteorologische Bedeutung.
lexical_decisions:
- source_word: וַיֵּט
  choice: streckte … aus
  rationale: נטה bezeichnet hier das Ausstrecken beziehungsweise Ausrichten des Stabes; die deutsche Wendung ist natürlich und entspricht der Handlung in den Plagenerzählungen.
- source_word: מַטֵּהוּ
  choice: seinen Stab
  rationale: מַטֶּה bedeutet Stab oder Stock; »Stab« ist im Deutschen die geläufige und kontextgerechte Bezeichnung für Moses Zeicheninstrument.
- source_word: עַל הַשָּׁמַיִם
  choice: zum Himmel
  rationale: Die Präposition עַל bezeichnet im Kontext die aufwärts gerichtete Bewegung. »Zum Himmel« gibt dies natürlich wieder; שָׁמַיִם kann Himmel oder Luftraum bezeichnen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: ließ Donner und Hagel kommen
  rationale: נָתַן bedeutet wörtlich »gab«, hat hier jedoch kausativen Sinn. קֹלוֹת bezeichnet im Gewitterkontext Donnerschläge; die Formulierung ist idiomatisches modernes Deutsch.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: Feuer fuhr zur Erde hinab
  rationale: Die hebräische Bildsprache nennt ausdrücklich »Feuer« und beschreibt dessen Bewegung erdwärts. »Fuhr … hinab« bewahrt die lebhafte Bewegung, ohne das Feuer im Haupttext interpretierend durch »Blitze« zu ersetzen.
- source_word: וַיַּמְטֵר
  choice: ließ … regnen
  rationale: Die Hifil-Form von מטר bedeutet »regnen lassen« beziehungsweise »herabregnen lassen«; die kausative deutsche Form gibt dies präzise wieder.
- source_word: אֶרֶץ מִצְרָיִם
  choice: das Land Ägypten
  rationale: Die ausdrückliche geografische Wendung »Land Ägypten« bleibt erhalten und zeigt den Wirkungsbereich der Plage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. »Jahwe« bewahrt ihn als Namen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
- issue: Deutung von אֵשׁ im Gewitter
  choice: Feuer im Haupttext, Hinweis auf Blitze in der Fußnote
  alternative: Blitze im Haupttext
  rationale: Obwohl im Zusammenhang sehr wahrscheinlich Blitze gemeint sind, lautet das hebräische Wort eindeutig »Feuer«. Die Übersetzung bewahrt daher das Bild und erläutert die wahrscheinliche Referenz, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt dem hebräischen Erzählfluss; »Feuer« bleibt als bewusst konkrete Bildsprache erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der erläuterten Wendung.
