  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: de
  text: 'Da sprach der HERR zu Mose: »Geh zum Pharao und sage zu ihm: So spricht der HERR, der Gott der Hebräer: Lass mein Volk ziehen, damit es mir dient.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Gibt die erzählende Fortführung des Waw-Konsekutivs knapp und würdig wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibeltradition, den Gottesnamen durch HERR wiederzugeben, und entspricht der konsultierten englischen Fassung.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Geh zum Pharao hinein
  rationale: Bewahrt die Bewegungsrichtung von בוא und die ungewöhnliche, aber im Kontext sinnvolle Vorstellung des Hineingehens zum Pharao.
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: und sage zu ihm
  rationale: Natürliches modernes Deutsch; דבר bezeichnet hier die Übermittlung der unmittelbar folgenden Botschaft.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Gibt den Piel-Imperativ als nachdrückliche Aufforderung zur Freilassung wieder und wahrt die vertraute Exodus-Formulierung.
- source_word: וְיַעַבְדֻנִי
  choice: damit es mir dient
  rationale: Die Zweckbeziehung wird ausdrücklich wiedergegeben; dienen lässt sowohl kultischen Dienst als auch umfassendere Dienstbarkeit anklingen.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle Ersatzlesung wird im Haupttext verwendet, ohne eine unsichere Aussprache festzulegen.
- issue: Bedeutungsumfang von עבד
  choice: dienen
  alternative: verehren / Gottesdienst feiern
  rationale: Dienen bewahrt den weiteren hebräischen Bedeutungsumfang und legt die Aussage nicht ausschließlich kultisch fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist klar gestaffelt; es sind keine Fußnoten erforderlich.
