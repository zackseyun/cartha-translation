  source_fidelity: 'Die Übersetzung bildet die hebräische Struktur und Aussage zuverlässig ab: הִנֵּה wird als Aufmerksamkeitssignal bewahrt, „die Hand Jahwes“ erhält die Bildsprache, und die Ankündigung wird zutreffend zukünftig wiedergegeben. „Vieh“ umfasst den Oberbegriff מִקְנֶה; die nachfolgende vollständige Aufzählung der Tiergruppen konkretisiert ihn. „Seuche“ gibt דֶּבֶר im Kontext einer schweren, tödlichen Viehkrankheit angemessen wieder. Die Intensivierung כָּבֵד מְאֹד ist mit „sehr schwere“ sachgerecht wiedergegeben.'
