  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigennamen wieder. „Rinder“ und „Kleinvieh“ entsprechen den Kollektivbezeichnungen בָּקָר und צֹאן; insbesondere vermeidet „Kleinvieh“ eine unbegründete Beschränkung auf nur Schafe oder nur Ziegen. Die Fußnote ist korrekt an „Seuche“ verankert und bietet mit „Pest“ eine mögliche, wenn auch spezifischere deutsche Alternative.
