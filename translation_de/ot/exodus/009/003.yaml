  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: de
  text: 'Siehe, die Hand Jahwes wird über dein Vieh kommen, das auf dem Feld ist – über die Pferde, die Esel, die Kamele, die Rinder und das Kleinvieh: eine sehr schwere Seuche.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Pest; das hebräische Wort bezeichnet hier eine tödliche epidemische Krankheit unter dem Vieh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die aufmerksamkeitslenkende und dringliche Funktion des hebräischen Ausdrucks in würdigem, geläufigem Bibeldeutsch.
- source_word: יַד יְהוָה
  choice: die Hand Jahwes
  rationale: Erhält das hebräische Bild für Gottes wirksame Macht und sein Gericht, statt es erklärend aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder.
- source_word: הוֹיָה
  choice: wird … kommen
  rationale: Gibt im Zusammenhang der Ankündigung den unmittelbar bevorstehenden, prädiktiven Sinn natürlich wieder.
- source_word: בְּמִקְנְךָ
  choice: über dein Vieh
  rationale: מִקְנֶה bezeichnet hier umfassend den Nutztierbestand, wie die folgende Aufzählung zeigt.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: das auf dem Feld ist
  rationale: Beschränkt die Ankündigung entsprechend dem hebräischen Relativsatz auf das Vieh im Freien.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: über die Pferde, die Esel, die Kamele, die Rinder und das Kleinvieh
  rationale: Gibt die Tiergruppen vollständig und in natürlichem modernem Deutsch wieder; צֹאן ist der Sammelbegriff für Schafe und Ziegen und wird daher als „Kleinvieh“ übersetzt.
- source_word: דֶּבֶר
  choice: Seuche
  rationale: Bezeichnet eine tödliche epidemische Krankheit und ist im Deutschen präziser als das breitere Wort „Plage“.
- source_word: כָּבֵד מְאֹד
  choice: sehr schwere
  rationale: Überträgt die hebräische Intensitätsangabe idiomatisch, ohne das Bild des Gewichts unnatürlich zu verabsolutieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ bewahrt dessen Funktion als Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bildhafte Rede von der „Hand Jahwes“
  choice: Bild wörtlich bewahren
  alternative: Jahwe wird dein Vieh schlagen
  rationale: Die Formulierung bezeichnet Gottes wirksame Macht und sein Gericht; ihre Beibehaltung wahrt die Bildsprache und vermeidet eine stärkere Festlegung als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ ist bewusst als knappe biblische Aufmerksamkeitsformel erhalten. Der Gedankenstrich gliedert die Aufzählung; der Doppelpunkt führt zur angekündigten Seuche als Wirkung der Hand Jahwes.
