  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: de
  text: Erhebst du dich noch immer über mein Volk, indem du es nicht ziehen lässt?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verhältst du dich noch immer hochmütig gegen mein Volk?“ Auch möglich: „Erhebst du dich noch immer gegen mein Volk?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדְךָ
  choice: noch immer
  rationale: עוֹד mit dem Suffix der 2. Person Singular bezeichnet den fortdauernden Zustand beziehungsweise das weiterhin anhaltende Verhalten des Pharaos; im Zusammenhang ist die Formulierung als rhetorische Frage zu verstehen.
- source_word: מִסְתּוֹלֵל
  choice: erhebst du dich
  rationale: Das Hitpolel-Partizip von סלל drückt hier selbstherrliche Erhebung oder arrogante Selbstbehauptung aus. Die reflexive Wendung bewahrt sowohl die Bildhaftigkeit als auch den Hochmutsaspekt.
- source_word: בְּעַמִּי
  choice: über mein Volk
  rationale: Die Präposition ב bezeichnet hier die überhebliche beziehungsweise feindliche Stellung gegenüber dem Volk. „Über mein Volk“ verbindet die Vorstellung der Selbsterhöhung mit der angemaßten Herrschaft; „gegen mein Volk“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: לְבִלְתִּי
  choice: indem du … nicht
  rationale: Die negative Infinitivkonstruktion erläutert, worin sich die Selbsterhöhung des Pharaos zeigt. „Indem“ gibt diesen modalen Zusammenhang im Deutschen natürlich wieder, ohne eine reine Absichtsaussage festzulegen.
- source_word: שַׁלְּחָם
  choice: es … ziehen lässt
  rationale: Das Piel von שלח bezeichnet im Plagenbericht regelmäßig die Freilassung Israels. Das singularische Pronomen „es“ nimmt das grammatisch singularische Kollektiv „Volk“ auf.
theological_decisions:
- issue: Gottes Anspruch in „mein Volk“
  choice: „mein Volk“ wird unverändert als direkte Gottesrede beibehalten.
  alternative: „das Volk“ oder „Israel“
  rationale: 'Das Suffix der ersten Person ist im Exoduszusammenhang bedeutsam: Gott beansprucht Israel als sein Volk, und der Widerstand des Pharaos richtet sich damit auch gegen Gott. Diese Aussage darf weder verallgemeinert noch abgeschwächt werden.'
- issue: Art der Selbsterhöhung des Pharaos
  choice: „über mein Volk“
  alternative: „gegen mein Volk“
  rationale: Der hebräische Ausdruck kann sowohl Überheblichkeit beziehungsweise angemaßte Überordnung als auch feindlichen Widerstand ausdrücken. Der Haupttext bewahrt das Bild des Sich-Erhebens; die Fußnote nennt die adversative Möglichkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die bildhafte reflexive Formulierung werden bewahrt. „Ziehen lassen“ entspricht dem etablierten deutschen Sprachgebrauch im Exodusbericht.
