source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: de
  text: 'Da sagte Yahweh zu Mose: »Steh früh am Morgen auf, tritt vor den Pharao und sage zu ihm: ›So spricht Yahweh, der Gott der Hebräer: Lass mein Volk ziehen, damit es mir dient.[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit es mich anbetet«. Das hebräische Verb bezeichnet den Dienst für Gott und kann dabei auch gottesdienstliche Anbetung meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Steh früh am Morgen auf
  rationale: Die Hifil-Form von שׁכם bezeichnet idiomatisch das frühe Aufstehen; zusammen mit בַּבֹּקֶר ergibt sich eine natürliche und nachdrückliche Zeitangabe.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: tritt vor
  rationale: Die Form bezeichnet das bewusste Einnehmen eines Standorts vor jemandem; »tritt vor den Pharao« ist im höfischen Zusammenhang präzise und natürlich.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Diese geläufige deutsche Botenformel bewahrt den feierlichen und autoritativen Charakter des hebräischen Ausdrucks.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: der Gott der Hebräer
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Genitivverbindung.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Im Exoduskontext gibt die Wendung die Aufforderung zur Freilassung treffend und im Deutschen idiomatisch wieder.
- source_word: וְיַעַבְדֻנִי
  choice: damit es mir dient
  rationale: Das mit וְ eingeleitete Imperfekt drückt hier den Zweck der Freilassung aus. עבד umfasst Dienst für Gott einschließlich Anbetung, ist aber weiter als ein rein kultischer Begriff.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Umschrift »Yahweh« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von וְיַעַבְדֻנִי
  choice: damit es mir dient
  alternative: damit es mich anbetet
  rationale: »Dienen« erhält den breiteren Sinn von עבד und schließt gottesdienstliche Anbetung ein, ohne die Aussage darauf zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; »So spricht« bewahrt die feierliche Botenformel. Das grammatisch singularische »Volk« wird mit »es« aufgenommen.
