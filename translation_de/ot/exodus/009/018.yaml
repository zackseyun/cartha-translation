  variant: modern standard German
source:
  edition: WLC
  text: הִנְ/נִ֤י מַמְטִיר֙ כָּ/עֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא הָיָ֤ה כָמֹ֨/הוּ֙ בְּ/מִצְרַ֔יִם לְ/מִן הַ/יּ֥וֹם הִוָּסְדָ֖/ה וְ/עַד עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: de
  text: Siehe, etwa um diese Zeit morgen[a] lasse ich sehr schweren Hagel niedergehen, wie es ihn in Ägypten seit dem Tag, an dem es gegründet wurde[b], bis heute noch nie gegeben hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: morgen um diese Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: an dem es errichtet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Die Wendung leitet eine feierliche göttliche Ankündigung mit nachdrücklichem Hinweischarakter ein. „Siehe“ bewahrt diesen Ton und ist im Zusammenhang verständlich.
- source_word: מַמְטִיר
  choice: lasse ich … niedergehen
  rationale: Der Hifil drückt verursachendes Handeln aus. Die Formulierung ist im Deutschen natürlich und hält fest, dass Gott den Hagel selbst herbeiführt.
- source_word: כָּעֵת מָחָר
  choice: etwa um diese Zeit morgen
  rationale: Die Präposition כ kann hier eine ungefähre Entsprechung bezeichnen. Die gewählte Formulierung gibt sowohl den Zeitpunkt am folgenden Tag als auch diese mögliche Annäherung wieder.
- source_word: בָּרָד
  choice: Hagel
  rationale: Dies ist die genaue und übliche deutsche Bezeichnung für das Wetterphänomen.
- source_word: כָּבֵד מְאֹד
  choice: sehr schweren
  rationale: כָּבֵד bedeutet wörtlich „schwer“ und wird durch מְאֹד verstärkt. Bei Hagel ist „sehr schwer“ sowohl quellennah als auch idiomatisch.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: wie es ihn … noch nie gegeben hat
  rationale: Die Formulierung bewahrt den Vergleich mit allen früheren Ereignissen und gibt ihn in natürlichem Deutsch wieder.
- source_word: בְּמִצְרַיִם
  choice: in Ägypten
  rationale: Direkte Ortsangabe.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: seit dem Tag, an dem es gegründet wurde
  rationale: Die Nifalform bezeichnet Ägyptens Gegründet- beziehungsweise Festgesetztwerden. Das Pronomen „es“ bezieht sich im Deutschen natürlich auf Ägypten.
- source_word: וְעַד עָתָּה
  choice: bis heute
  rationale: Die Wendung bezeichnet den gesamten Zeitraum von der Gründung Ägyptens bis zum Zeitpunkt der Ankündigung.
theological_decisions:
- issue: Göttliches Handeln bei der angekündigten Plage
  choice: „lasse ich … niedergehen“ mit Gott als ausdrücklichem Handelnden
  alternative: Eine unpersönliche Formulierung wie „wird Hagel niedergehen“
  rationale: Der Hifil mit einem Subjekt in der ersten Person schreibt das kommende Ereignis ausdrücklich Gottes Handeln zu; diese Aussage wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ erhält den feierlichen Hinweischarakter der göttlichen Ankündigung; der übrige Satzbau bleibt gegenwärtig und allgemein verständlich.
