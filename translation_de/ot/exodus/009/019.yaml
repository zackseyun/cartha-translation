  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: de
  text: 'Und nun: Schicke jemanden los und bring dein Vieh und alles, was du auf dem Feld hast, in Sicherheit.[a] Alle Menschen und Tiere, die sich auf dem Feld befinden und nicht ins Haus gebracht werden – der Hagel wird auf sie niedergehen, und sie werden sterben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische lautet wörtlich „schick“ und nennt nicht, wen oder was der Pharao schicken soll. Die Ergänzung „jemanden“ macht die im Zusammenhang naheliegende Entsendung eines Boten oder Dieners ausdrücklich.
    reason: ellipsis_and_lexical_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die Verknüpfung durch וְ als auch den unmittelbaren zeitlichen Übergang durch עַתָּה wieder.
- source_word: שְׁלַח הָעֵז
  choice: Schick hin und bring … in Sicherheit
  rationale: 'שְׁלַח ist der Imperativ „schick/sende“, während הָעֵז hier am besten als Hifil-Imperativ von עוז verstanden wird: „bring in Sicherheit“. Die deutsche Fassung bewahrt beide Aufforderungen, ohne ein im Hebräischen nicht genanntes Objekt von „schicken“ in den Haupttext einzufügen.'
- source_word: מִקְנְךָ
  choice: dein Vieh
  rationale: מִקְנֶה bezeichnet den Bestand an gehaltenen Nutztieren; „Vieh“ ist im Deutschen knapp und idiomatisch.
- source_word: וְאֵת כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: und alles, was du auf dem Feld hast
  rationale: Bewahrt den umfassenden Bezug auf alles Eigentum, das sich draußen auf dem Feld befindet.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: Jeder Mensch und jedes Tier
  rationale: אָדָם ist hier generisch und distributiv gebraucht. „Jeder Mensch“ gibt den Sinn im modernen Deutschen präzise wieder; בְּהֵמָה bezeichnet hier ein Tier, insbesondere ein Haustier oder Nutztier.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: das auf dem Feld angetroffen wird
  rationale: Gibt den passiven Nifal von מצא nahe am Ausgangstext wieder.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: und nicht ins Haus geholt wird
  rationale: Der passive Nifal von אסף bedeutet hier, dass Mensch oder Tier nicht hereingeholt beziehungsweise unter Schutz gebracht wird; die Richtungsendung an הַבַּיְתָה wird durch „ins Haus“ ausgedrückt.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: auf sie wird der Hagel niedergehen
  rationale: Bewahrt den Hagel als grammatisches Subjekt und die Abwärtsbewegung von ירד.
- source_word: וָמֵתוּ
  choice: und sie werden sterben
  rationale: Drückt die angekündigte Folge in klarem modernem Deutsch aus.
theological_decisions:
- issue: Generischer Gebrauch von אָדָם
  choice: Jeder Mensch
  alternative: Jeder Mann
  rationale: אָדָם bezeichnet in dieser Warnung Menschen allgemein, die sich auf dem Feld befinden. „Jeder Mensch“ bewahrt die distributive Aussage, ohne die Reichweite unnötig auf männliche Personen zu verengen.
- issue: Deutung von הָעֵז
  choice: bring … in Sicherheit
  alternative: beeil dich / unverzüglich
  rationale: Die Form lässt sich hier sachgerecht als Hifil-Imperativ von עוז verstehen und bezeichnet das Sichern beziehungsweise In-Sicherheit-Bringen. Eine bloße Dringlichkeitsangabe würde diesen eigenständigen verbalen Gehalt abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Warnung bleibt knapp und eindringlich; ungebräuchliche Bibelismen wie „Mensch und Vieh“ oder „in das Haus gesammelt“ werden vermieden, ohne die Struktur und die passive Form des Hebräischen einzuebnen.
