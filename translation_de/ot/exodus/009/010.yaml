base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: de
  text: Da nahmen sie Ruß aus dem Brennofen und traten vor den Pharao. Mose warf ihn zum Himmel hinauf, und es entstanden Geschwüre mit Blasen, die an Menschen und Tieren ausbrachen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  choice: Ruß
  rationale: Das Wort bezeichnet feinen schwarzen Staub beziehungsweise Ruß und nicht allgemein Asche.
- source_word: הַכִּבְשָׁן
  choice: der Brennofen
  rationale: כִּבְשָׁן bezeichnet einen Ofen zum Brennen oder einen Schmelzofen; „Brennofen“ ist konkret und im Deutschen natürlich.
- source_word: לִפְנֵי פַרְעֹה
  choice: vor den Pharao
  rationale: Die Wendung bezeichnet das Auftreten in der Gegenwart des Pharaos; mit dem Bewegungsverb „traten“ ist im Deutschen der Akkusativ idiomatisch.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: Mose warf ihn
  rationale: Das maskuline Singularsuffix nimmt den als Stoffbezeichnung aufgefassten Ruß wieder auf und lässt die Art des Werfens offen.
- source_word: הַשָּׁמָיְמָה
  choice: zum Himmel hinauf
  rationale: Die Richtungsendung bezeichnet eine Bewegung nach oben; die Formulierung bewahrt „Himmel“, ohne eine besondere theologische Deutung einzutragen.
- source_word: שְׁחִין
  choice: Geschwüre
  rationale: Das Wort bezeichnet entzündete Hautgeschwüre beziehungsweise Beulen; „Geschwüre“ passt zum Plagenkontext und ist verständlich.
- source_word: אֲבַעְבֻּעֹת
  choice: mit Blasen
  rationale: Der Ausdruck bezeichnet Blasen oder Pusteln und wird als nähere Beschreibung der Geschwüre wiedergegeben.
- source_word: פֹּרֵחַ
  choice: die … ausbrachen
  rationale: Das Partizip beschreibt ein Hervorbrechen oder Aufblühen; „ausbrechen“ ist im Deutschen für Hauterscheinungen idiomatisch.
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: bei Menschen und Tieren
  rationale: Die beiden hebräischen Kollektivsingulare bezeichnen hier Menschen und Tiere allgemein. Der deutsche Plural gibt den generischen Gegensatz natürlich und ohne männliche Einschränkung wieder.
theological_decisions:
- issue: Generische Wiedergabe von אָדָם im Gegensatz zu בְּהֵמָה
  choice: Menschen
  alternative: Mensch / Mann
  rationale: אָדָם bezeichnet hier die Menschheit beziehungsweise menschliche Betroffene allgemein. „Menschen“ bewahrt den Mensch-Tier-Gegensatz, ohne den Bezug irrtümlich auf Männer zu beschränken.
- issue: Bedeutung von הַשָּׁמָיְמָה
  choice: zum Himmel hinauf
  alternative: in die Luft
  rationale: Die Form bezeichnet die Richtung zum Himmel beziehungsweise nach oben. „Zum Himmel hinauf“ wahrt die Bildsprache, ohne festzulegen, ob hier nur der sichtbare Himmel oder zugleich eine theologisch aufgeladene Sphäre gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der hebräischen Handlungsfolge, wird aber durch einen Satzpunkt lesbarer gestaltet. „Bei Menschen und Tieren“ ist im Zusammenhang mit dem Ausbrechen von Hautgeschwüren natürlicher als das formal mögliche „an Mensch und Tier“.
