    issue: „und daraus wurden Geschwüre“
    rationale: „Daraus“ legt nahe, die Geschwüre seien materiell aus dem Ruß entstanden. Der hebräische Text sagt lediglich, dass eine Geschwürplage entstand bzw. eintrat.
  - severity: low
    issue: „die bei Menschen und Tieren ausbrachen“
    rationale: Die Präposition „bei“ ist für den Ort eines Hautausbruchs weniger präzise und weniger natürlich als „an“.
  revised_text: Da nahmen sie Ruß aus dem Brennofen und traten vor den Pharao. Mose warf ihn zum Himmel hinauf, und es entstanden Geschwüre mit Blasen, die an Menschen und Tieren ausbrachen.
