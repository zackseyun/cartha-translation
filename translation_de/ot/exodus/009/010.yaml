  to: Da nahmen sie Ruß aus dem Brennofen und traten vor den Pharao. Mose warf ihn zum Himmel hinauf, und es entstanden Geschwüre mit Blasen, die an Menschen und Tieren ausbrachen.
  rationale: Die Revision beseitigt die unbeabsichtigte kausale beziehungsweise stoffliche Aussage von „daraus wurden“ und formuliert das Ausbrechen der Hauterscheinung idiomatisch. Die hebräische Bildfolge und die lexikalischen Entscheidungen des Entwurfs bleiben erhalten.
