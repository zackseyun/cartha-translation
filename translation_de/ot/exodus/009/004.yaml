id: EXO.9.4
reference: Exodus 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: de
  text: Doch Jahwe wird einen Unterschied machen zwischen dem Vieh Israels und dem Vieh Ägyptens, und von allem, was den Israeliten[a] gehört, wird nichts sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: den Söhnen Israels.'
    reason: Die Fußnote dokumentiert die hebräische feste Wendung בְּנֵי יִשְׂרָאֵל hinter der natürlichen deutschen Volksbezeichnung „Israeliten“.
lexical_decisions:
- source_word: וְהִפְלָה
  choice: wird einen Unterschied machen
  rationale: Das Hifil von פלא bezeichnet hier das deutliche Unterscheiden beziehungsweise Trennen zweier Gruppen; die deutsche Wendung bewahrt den kausativen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּין ... וּבֵין
  choice: zwischen ... und ...
  rationale: Die korrelative Präpositionsverbindung bezeichnet den Gegensatz zwischen zwei Bezugsgrößen.
- source_word: מִקְנֵה
  choice: Vieh
  rationale: מִקְנֶה bezeichnet den Bestand an gehaltenen Nutztieren insgesamt; „Vieh“ ist im Deutschen breit genug und im Kontext natürlich.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: In der Konstruktverbindung bezeichnet der Landesname kollektiv Ägypten beziehungsweise die Ägypter.
- source_word: וְלֹא יָמוּת
  choice: und ... wird nichts sterben
  rationale: Die koordinierte Wiedergabe folgt der hebräischen Verknüpfung, ohne das Verhältnis ausdrücklich als Zweck oder Folge festzulegen.
- source_word: מִכָּל ... דָּבָר
  choice: von allem ... nichts
  rationale: Die negierte idiomatische Verbindung besagt, dass nicht ein einziges zum Besitz Israels gehörendes Tier sterben wird.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: was den Israeliten gehört
  rationale: Das לְ wird im Kontext als Zugehörigkeit verstanden; „Israeliten“ gibt die feste Volksbezeichnung בני ישראל natürlich und inklusiv wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; seine Wiedergabe als „Jahwe“ bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die Wendung ist hier eine feste Bezeichnung für das ganze Volk. „Israeliten“ ist im modernen Deutschen natürlich und vermeidet den irreführenden Eindruck, nur männliche Personen seien gemeint; die wörtliche Form wird in der Fußnote dokumentiert.
- issue: Verhältnis des letzten Satzteils zur Unterscheidung
  choice: koordinierend mit „und“
  alternative: final beziehungsweise konsekutiv mit „sodass“
  rationale: Das hebräische וְ kann eine Folge nahelegen, kennzeichnet sie hier aber nicht eindeutig. Die koordinierende Wiedergabe erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vieh“ ist als Sammelbegriff für gehaltene Nutztiere gebraucht. Die Satzstruktur bleibt quellennah, ohne im Deutschen unnötig sperrig zu wirken.
