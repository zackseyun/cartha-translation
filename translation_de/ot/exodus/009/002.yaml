lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Die Verbindung leitet eine begründende Bedingung ein und knüpft an den vorhergehenden Vers an.
- source_word: מָאֵן
  choice: dich weigerst
  rationale: Das Verb bezeichnet bewusste Weigerung, nicht bloßes Unvermögen.
- source_word: לְשַׁלֵּחַ
  choice: sie ziehen zu lassen
  rationale: Im Exoduszusammenhang bezeichnet שׁלח die Erlaubnis an Israel, fortzugehen; die deutsche Wendung ist idiomatisch und genau.
- source_word: וְעוֹדְךָ
  choice: und … weiterhin
  rationale: עוֹד mit dem Suffix der zweiten Person beschreibt das fortdauernde Verhalten des Pharaos.
- source_word: מַחֲזִיק בָּם
  choice: sie … festhältst
  rationale: Die Konstruktion bezeichnet hier das anhaltende Zurück- oder Festhalten der Israeliten. „Festhalten“ bewahrt zugleich das Bild des Ergreifens und den Sinn des Nichtfreigebens.
