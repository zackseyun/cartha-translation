  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: de
  text: 'Aber was dich und deine Diener betrifft: Ich weiß, dass ihr euch noch nicht vor Jahwe, dem Gott, fürchtet.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ihr euch weiterhin nicht vor Jahwe, dem Gott, fürchtet“; möglicherweise auch: „bevor ihr euch vor Jahwe, dem Gott, fürchtet“. Das hebräische Wort kann hier „noch nicht“ beziehungsweise „weiterhin nicht“ bedeuten oder zeitlich mit „bevor“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Aber was dich ... betrifft
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen setzt den Pharao kontrastierend vom zuvor Gesagten ab; die deutsche Wendung gibt diese adversative Hervorhebung natürlich wieder.
- source_word: וַעֲבָדֶיךָ
  choice: und deine Diener
  rationale: עֶבֶד kann Diener oder Sklave bezeichnen. Im Kontext des pharaonischen Hofes ist „Diener“ offen genug und vermeidet eine unnötige Festlegung auf einen bestimmten Status.
- source_word: יָדַעְתִּי
  choice: Ich weiß
  rationale: Das Perfekt bezeichnet hier Moses’ gegenwärtige, gefestigte Erkenntnis.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt dessen ein, was Mose weiß.
- source_word: טֶרֶם
  choice: noch nicht
  rationale: Mit dem folgenden Imperfekt bezeichnet טֶרֶם hier am natürlichsten einen bislang nicht eingetretenen Zustand. Die mögliche zeitliche Lesart „bevor“ bleibt in der Fußnote erhalten.
- source_word: תִּירְאוּן
  choice: ihr euch ... fürchtet
  rationale: ירא umfasst Furcht, Ehrfurcht und Scheu. „Sich vor ... fürchten“ wahrt im Gerichtskontext die Spannung zwischen Angst und angemessener Gottesfurcht.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bedeutet wörtlich „vom Angesicht/vor dem Angesicht“ und wird mit ירא im Deutschen idiomatisch durch „sich vor ... fürchten“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים steht bei dem Gottesnamen und wird mit „Gott“ wiedergegeben; die Zeichensetzung lässt die genaue syntaktische Beziehung offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsumfang von ירא gegenüber Gott
  choice: sich fürchten
  alternative: Ehrfurcht haben
  rationale: „Sich fürchten“ bewahrt die im Kontext göttlichen Gerichts bestehende Spannung zwischen Schrecken und ehrfürchtiger Anerkennung, statt sie einseitig aufzulösen.
- issue: Zeitliche Nuance von טֶרֶם
  choice: noch nicht
  alternative: bevor
  rationale: Im Zusammenhang ist „noch nicht“ die wahrscheinlichste idiomatische Deutung; die formell mögliche Lesart „bevor“ wird wegen der echten Mehrdeutigkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kontrastive Hervorhebung des Pharaos und seiner Diener ist erhalten. „Diener“ bleibt hinsichtlich ihres genauen gesellschaftlichen Status bewusst offen. Die Formulierung und Zeichensetzung bei „Jahwe, Gott“ vermeiden eine unnötige syntaktische Überpräzisierung.
