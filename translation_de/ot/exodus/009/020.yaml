source:
  edition: WLC
  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: de
  text: Wer von den Dienern des Pharaos das Wort Jahwes fürchtete, brachte seine Diener und sein Vieh schleunigst in die Häuser.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließ seine Diener und sein Vieh in die Häuser fliehen“; gemeint ist, dass er sie eilig in Sicherheit brachte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Wer … fürchtete
  rationale: Der substantivierte Partizipialausdruck bezeichnet denjenigen beziehungsweise jeden aus der genannten Gruppe, der so handelte. „Wer … fürchtete“ ist im Deutschen natürlich und bewahrt den offenen Klassenbezug.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר kann „Wort“ oder „Botschaft“ bedeuten. „Wort Jahwes“ bewahrt die biblische Ausdrucksweise, ohne den Inhalt enger als „Warnung“ festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: von den Dienern des Pharaos
  rationale: 'מִן ist hier partitiv: Gemeint ist jemand aus der Gruppe der Diener des Pharaos.'
- source_word: הֵנִיס
  choice: brachte … schleunigst
  rationale: Der Hifil von נוּס bedeutet wörtlich „fliehen lassen“ beziehungsweise „zur Flucht veranlassen“. Im Zusammenhang bezeichnet er das eilige Hineinbringen in Schutzräume; die dynamische Nuance wird durch „schleunigst“ bewahrt.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann „Sklave“ oder „Diener“ bedeuten. Hier steht die zum Haushalt beziehungsweise Verantwortungsbereich gehörende Personengruppe im Vordergrund; „Diener“ wahrt die lexikalische Breite.
- source_word: מִקְנֵהוּ
  choice: sein Vieh
  rationale: מִקְנֶה bezeichnet Nutz- beziehungsweise Herdentiere allgemein. „Vieh“ ist ein natürlicher deutscher Sammelbegriff und enger als das zu allgemeine „Tiere“, aber weiter als „Rinder“.
- source_word: אֶל הַבָּתִּים
  choice: in die Häuser
  rationale: Die Präposition bezeichnet hier eine Bewegung hinein; der Plural „Häuser“ wird entsprechend dem Hebräischen erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn traditionsgemäß durch einen Titel ersetzt.
- issue: Bedeutung von „das Wort Jahwes fürchten“
  choice: wörtliche Beziehungsformulierung beibehalten
  alternative: die Warnung Jahwes ernst nehmen
  rationale: „Fürchten“ kann hier ehrfürchtige Anerkennung zeigen, die zu entsprechendem Handeln führt. Die Übersetzung bewahrt diese theologische Spannung, statt sie auf bloßes Ernstnehmen einer Warnung zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schleunigst“ vermittelt die Dringlichkeit des hebräischen Kausativs, ohne unnötig Panik zu unterstellen. Der Satzbau bleibt klar und nah an der Struktur des Ausgangstextes.
