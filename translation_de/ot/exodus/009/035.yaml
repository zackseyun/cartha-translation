  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: de
  text: Das Herz des Pharaos wurde hart[a], und er ließ die Israeliten nicht ziehen, genau wie Jahwe durch Mose gesagt hatte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Herz des Pharaos wurde fest« bzw. »Das Herz des Pharaos verhärtete sich.« Das hebräische Verb kann »stark oder fest werden« bedeuten, hier im Sinn hartnäckiger Unnachgiebigkeit.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »durch die Hand Moses«; eine hebräische Wendung für »durch Mose«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: wurde ... hart
  rationale: Das Verb חזק bezeichnet hier, dass das Herz fest bzw. verhärtet wurde. Die deutsche Formulierung gibt den Verhärtungsgedanken natürlich wieder, ohne ausdrücklich Gott oder den Pharao als handelnde Ursache zu nennen.
- source_word: לֵב פַּרְעֹה
  choice: das Herz des Pharaos
  rationale: Die Wendung bewahrt das hebräische Bild vom Herzen als Sitz des Willens und der Entschlossenheit.
- source_word: שִׁלַּח
  choice: ließ ... ziehen
  rationale: Im Kontext des Exodus bezeichnet das Verb die verweigerte Erlaubnis, Israel fortziehen zu lassen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich steht »die Söhne Israels«; als Volksbezeichnung meint die Wendung hier die Israeliten insgesamt. Die kollektive Wiedergabe ist im modernen Deutsch klar und natürlich.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Formulierung kennzeichnet deutlich die Übereinstimmung des Geschehens mit dem zuvor gesprochenen Wort.
- source_word: דִּבֶּר יְהוָה
  choice: Jahwe ... gesagt hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jahwes Wort dem hier berichteten Geschehen vorausging; »gesagt« ist in diesem Satz natürliches Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּיַד מֹשֶׁה
  choice: durch Mose
  rationale: Die wörtliche Wendung »durch die Hand Moses« ist ein hebräisches Mittelbarkeitsidiom; »durch Mose« gibt ihre Bedeutung klar wieder.
theological_decisions:
- issue: Handlungsträgerschaft bei der Verhärtung
  choice: So wurde das Herz des Pharaos hart
  alternative: So verhärtete der Pharao sein Herz / So verhärtete Jahwe das Herz des Pharaos
  rationale: Der hebräische Satz sagt hier, dass das Herz stark bzw. hart wurde, nennt in dieser Klausel aber keinen ausdrücklichen Verursacher. Die Übersetzung bewahrt diese theologische Spannung und schreibt die Handlung weder ausdrücklich Gott noch ausdrücklich dem Pharao zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während feste hebräische Wendungen verständlich wiedergegeben werden. Die traditionelle Bildsprache vom »Herz« bleibt erhalten; »Israeliten« gibt die kollektive Volksbezeichnung natürlich wieder.
