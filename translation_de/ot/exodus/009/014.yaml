source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: de
  text: Denn diesmal sende ich alle meine Plagen gegen dein Herz[a], gegen deine Diener und gegen dein Volk, damit du erkennst, dass es auf der ganzen Erde niemanden gibt wie mich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu deinem Herzen«. Die Wendung kann bedeuten, dass die Plagen gegen den Pharao selbst, gegen sein innerstes Wesen, gerichtet sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »im ganzen Land«. Das hebräische Wort kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Knüpft begründend an den vorausgehenden Zusammenhang an und ist im Deutschen natürlich.
- source_word: בַּפַּעַם הַזֹּאת
  choice: diesmal
  rationale: Gibt die idiomatische Zeitangabe knapp und gegenwartsbezogen wieder.
- source_word: שֹׁלֵחַ
  choice: lasse ich … kommen
  rationale: Der Partizipialausdruck bezeichnet hier unmittelbar bevorstehendes Handeln; die deutsche Wendung klingt natürlich, ohne die Aussage auf ein bloßes Futur festzulegen.
- source_word: כָּל מַגֵּפֹתַי
  choice: alle meine Plagen
  rationale: „Plagen“ entspricht dem Erzählzusammenhang und bewahrt zugleich den Sinn göttlicher Schläge beziehungsweise Gerichte.
- source_word: אֶל לִבְּךָ
  choice: über dein Herz
  rationale: Bewahrt das ausdrücklich genannte „Herz“ und lässt die räumlich-zielgerichtete Präposition offen genug anklingen; gemeint sein kann der Pharao in seinem innersten Selbst.
- source_word: וּבַעֲבָדֶיךָ
  choice: über deine Diener
  rationale: „Diener“ bezeichnet hier passend die Amtsträger beziehungsweise Untergebenen des Pharaos, nicht notwendig Sklaven.
- source_word: וּבְעַמֶּךָ
  choice: über dein Volk
  rationale: Die aus dem Prädikat ergänzte Wendung erhält die parallele Zielrichtung der Plagen.
- source_word: בַּעֲבוּר
  choice: damit
  rationale: Drückt den Zweck klar und idiomatisch aus.
- source_word: תֵּדַע
  choice: du erkennst
  rationale: Im Zwecksatz bezeichnet die Form das beabsichtigte Ergebnis; „erkennen“ umfasst mehr als bloße Kenntnisnahme.
- source_word: אֵין כָּמֹנִי
  choice: es gibt niemanden … wie mich
  rationale: Gibt die hebräische Aussage der Unvergleichlichkeit klar und natürlich wieder.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: Im Zusammenhang der Aussage über die Unvergleichlichkeit des HERRN liegt der universale Sinn näher; die mögliche lokale Bedeutung „Land“ wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Zielrichtung der Plagen auf das Herz des Pharaos
  choice: 'Die Herzmetapher bleibt ausdrücklich erhalten: „über dein Herz“.'
  alternative: Sinngemäß verflachen zu „über dich selbst“ oder „gegen dich persönlich“.
  rationale: Der hebräische Text nennt ausdrücklich das Herz und verbindet die Aussage so mit der Spannung um das verhärtete Herz des Pharaos. Die genaue Nuance der Präposition bleibt in der Fußnote offen.
- issue: Reichweite der göttlichen Unvergleichlichkeit
  choice: 'Universal: „auf der ganzen Erde“.'
  alternative: 'Lokal: „im ganzen Land“.'
  rationale: Die Aussage hebt im Plagenbericht die einzigartige Stellung des HERRN umfassend hervor; da אֶרֶץ jedoch auch „Land“ bedeuten kann, wird diese Möglichkeit nicht verschwiegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Ton. Die ungewöhnliche Herzmetapher wird wegen ihres erzählerischen und theologischen Gewichts bewahrt; die Mehrdeutigkeit von אֶרֶץ wird durch eine Fußnote kenntlich gemacht.
