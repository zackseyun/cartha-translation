  text: וַ/יִּשְׁלַ֣ח פַּרְעֹ֔ה וְ/הִנֵּ֗ה לֹא מֵ֛ת מִ/מִּקְנֵ֥ה יִשְׂרָאֵ֖ל עַד אֶחָ֑ד וַ/יִּכְבַּד֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: de
  text: Der Pharao ließ nachforschen[a], und tatsächlich war vom Vieh der Israeliten nicht ein einziges Tier gestorben. Doch das Herz des Pharaos verhärtete sich[b], und er ließ das Volk nicht ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Der Pharao sandte“; gemeint ist, dass er die Nachricht überprüfen ließ.'
    reason: Die hebräische Form nennt weder die entsandte Person noch den Auftrag ausdrücklich.
  - marker: b
    text: 'Wörtlich: „Das Herz des Pharaos wurde schwer.“ Die hebräische Wendung bezeichnet hier, dass er hart oder unbeugsam wurde.'
    reason: Erläutert das hebräische Bild und seine idiomatische Bedeutung, ohne eine Urheberschaft der Verhärtung festzulegen.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte jemanden los
  rationale: Das Verb bedeutet wörtlich „senden“. Da das Objekt im Hebräischen unausgesprochen bleibt, gibt die unbestimmte Ergänzung „jemanden“ den Vorgang im Deutschen natürlich wieder, ohne Boten oder einen konkreten Auftrag ausdrücklich in den Text einzutragen.
- source_word: וְהִנֵּה
  choice: und tatsächlich
  rationale: Die Aufmerksamkeitspartikel hebt das überraschende Ergebnis der Nachprüfung hervor. „Tatsächlich“ wirkt im modernen Deutschen natürlich und bewahrt hier die bestätigende, präsentierende Funktion.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: vom Vieh der Israeliten war nicht ein einziges Tier gestorben
  rationale: 'Die Wendung עַד אֶחָד verstärkt die vollständige Ausnahme: Nicht einmal ein Tier war gestorben. Das Plusquamperfekt passt zur nachträglich festgestellten Lage.'
- source_word: מִקְנֶה
  choice: Vieh
  rationale: Der Sammelbegriff bezeichnet den Nutztierbestand allgemein und ist nicht auf Rinder beschränkt. „Vieh“ ist im Deutschen breit, knapp und im Kontext angemessen.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: das Herz des Pharaos wurde schwer
  rationale: Die Wiedergabe folgt dem Bild des hebräischen Verbs כבד unmittelbar. Sie vermeidet, die nicht ausdrücklich genannte handelnde Ursache festzulegen, während eine Fußnote die idiomatische Bedeutung erläutert.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: und er ließ das Volk nicht ziehen
  rationale: Mit dem Volk als Objekt bedeutet שׁלח in diesem Erzählzusammenhang, es freizugeben beziehungsweise ziehen zu lassen. Die gewählte Formulierung ist idiomatisch und würdevoll.
theological_decisions:
- issue: Handelnder Urheber der Verhärtung des Pharao
  choice: das Herz des Pharaos wurde schwer
  alternative: das Herz des Pharaos wurde verhärtet / der Pharao verhärtete sein Herz
  rationale: Im hebräischen Satz ist das Herz Subjekt des Verbs; ein äußerer Urheber wird nicht genannt. Die bildnahe Formulierung wahrt die Spannung zwischen dem Zustand des Pharao und der Frage nach dessen Urheberschaft, statt sie durch Passiv oder aktive Selbstverhärtung vorzuentscheiden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die auffällige Herzmetapher bleibt im Haupttext erhalten und wird knapp erklärt; unnötig archaische Ausdrücke werden vermieden.
