  text: וְ/הַ/חִטָּ֥ה וְ/הַ/כֻּסֶּ֖מֶת לֹ֣א נֻכּ֑וּ כִּ֥י אֲפִילֹ֖ת הֵֽנָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: de
  text: Aber der Weizen und der Emmer[a] wurden nicht niedergeschlagen, weil sie noch nicht so weit entwickelt waren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dinkel«. Das hebräische Wort bezeichnet möglicherweise Emmer oder eine verwandte alte Weizenart.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »denn sie waren spät im Entwicklungsstand«. Die genaue Bedeutung des seltenen hebräischen Ausdrucks ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Aber der Weizen
  rationale: חִטָּה bezeichnet Weizen. Das formal anknüpfende וְ wird wegen des Gegensatzes zu den im vorigen Vers zerstörten Feldfrüchten natürlich mit »Aber« wiedergegeben.
- source_word: וְהַכֻּסֶּמֶת
  choice: und der Emmer
  rationale: כֻּסֶּמֶת bezeichnet wahrscheinlich Emmer oder eine eng verwandte alte Weizenart. »Emmer« ist botanisch im altägyptischen Kontext wahrscheinlicher als Roggen; die traditionelle Wiedergabe »Dinkel« bleibt als Fußnotenalternative erhalten.
- source_word: לֹא נֻכּוּ
  choice: wurden nicht niedergeschlagen
  rationale: Die passive Form von נכה beschreibt, dass diese Getreidearten vom Hagel nicht getroffen und zu Boden geschlagen wurden. »Niedergeschlagen« bewahrt die kräftige Bildsprache, ohne bloß allgemein »beschädigt« zu sagen.
- source_word: כִּי
  choice: weil
  rationale: כִּי leitet hier den Grund dafür ein, dass die beiden Getreidearten verschont blieben.
- source_word: אֲפִילֹת הֵנָּה
  choice: sie später reifen
  rationale: Das seltene אֲפִילֹת bezeichnet in diesem landwirtschaftlichen Zusammenhang wahrscheinlich einen späten beziehungsweise noch wenig entwickelten Wachstumsstand. Die dynamische Wiedergabe erklärt knapp, weshalb der Hagel die Pflanzen nicht niederschlug, ohne die unsichere genaue Entwicklungsstufe festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Kontrast zum vorherigen Vers wird durch »Aber« verdeutlicht. Die agrarische Begründung wird verständlich formuliert; die botanische und lexikalische Unsicherheit bleibt in den Fußnoten sichtbar.
