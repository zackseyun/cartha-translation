  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: de
  text: Der Hagel traf im ganzen Land Ägypten alles, was auf dem Feld war, vom Menschen bis zum Vieh. Der Hagel traf alle Pflanzen auf dem Feld und zerschmetterte alle Bäume auf dem Feld.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: erschlug
  rationale: נכה bezeichnet ein heftiges Schlagen und kann im Zusammenhang mit Lebewesen auch Töten einschließen. „Erschlug“ gibt die tödliche Wirkung des Hagels knapp und kraftvoll wieder und bewahrt durch die Wiederholung die Struktur des Hebräischen.
- source_word: הַבָּרָד
  choice: der Hagel
  rationale: Direkte und natürliche Wiedergabe; die Wiederholung im Vers bleibt zur Hervorhebung erhalten.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: im ganzen Land Ägypten
  rationale: Gibt die umfassende räumliche Ausdehnung idiomatisch im Deutschen wieder.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: alles, was auf dem Feld war
  rationale: Bewahrt den umfassenden Ausdruck כָּל אֲשֶׁר und den landwirtschaftlichen Schauplatz. Im Deutschen ist „auf dem Feld“ natürlicher als „im Feld“.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: vom Menschen bis zum Vieh
  rationale: Die Spannweitenformel bezeichnet Menschen und Nutztiere als die betroffenen Lebewesen. „Mensch“ ist hier die natürliche generische Wiedergabe von אָדָם; בְּהֵמָה meint in diesem Kontext am ehesten Vieh.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: alle Pflanzen auf dem Feld
  rationale: עֵשֶׂב kann Gras, Kraut oder allgemein Feldgewächse bezeichnen. „Pflanzen“ ist verständlich und wahrt die begriffliche Breite.
- source_word: עֵץ הַשָּׂדֶה
  choice: alle Bäume auf dem Feld
  rationale: Direkte, moderne Wiedergabe mit Beibehaltung der wiederholten Feldformulierung.
- source_word: שִׁבֵּר
  choice: zerbrach
  rationale: Der Piel-Stamm bezeichnet ein gewaltsames Zerbrechen. „Zerbrach“ passt besonders zu Bäumen und unterscheidet das Ergebnis vom Schlagen der Pflanzen.
theological_decisions:
- issue: Wiedergabe von אָדָם in der Spannweitenformel
  choice: Mensch
  alternative: Mann; Menschen
  rationale: אָדָם bezeichnet hier nicht ausdrücklich männliche Personen, sondern den Menschen im Gegensatz zum Vieh. „Mensch“ bewahrt den generischen Singular und vermeidet eine sachlich unnötige Verengung.
- issue: Stärke von נכה im Blick auf Menschen und Vieh
  choice: erschlug
  alternative: schlug; traf
  rationale: Der unmittelbare Kontext beschreibt die verheerende Wirkung der Plage. „Erschlug“ lässt die tödliche Tragweite erkennen, ohne eine darüber hinausgehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Wiederholungen von „der Hagel“ und „auf dem Feld“ werden weitgehend bewahrt; die Verben sind dem jeweiligen Objekt entsprechend natürlich differenziert.
