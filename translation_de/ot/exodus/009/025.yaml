    issue: „erschlug“ für וַיַּךְ / הִכָּה
    rationale: „Erschlagen“ behauptet, dass alle genannten Menschen und Tiere getötet wurden. Der hebräische Wortlaut sagt lediglich, dass der Hagel sie schlug bzw. traf; eine tödliche Folge kann der Kontext nahelegen, wird in diesem Verb aber nicht ausdrücklich behauptet.
  - severity: low
    issue: Fußnotenanker und erläuternde Fußnote
    rationale: Die Fußnote bietet keine textliche Variante oder für das Verständnis notwendige Information. Ihre Einleitung „Wörtlich“ ist zudem irreführend, weil der Fußnotentext im Wesentlichen dem deutschen Haupttext entspricht. Der Zusammenhang ist im revidierten Satz ohne Anmerkung klar.
  revised_text: Der Hagel traf im ganzen Land Ägypten alles, was auf dem Feld war, vom Menschen bis zum Vieh. Der Hagel traf alle Pflanzen auf dem Feld und zerschmetterte alle Bäume auf dem Feld.
  revised_footnotes: []
