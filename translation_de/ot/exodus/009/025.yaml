revisions:
- from: Der Hagel erschlug im ganzen Land Ägypten alles, was auf dem Feld war[a], vom Menschen bis zum Vieh. Der Hagel zerschlug alle Pflanzen auf dem Feld und zerbrach alle Bäume auf dem Feld.
  to: Der Hagel traf im ganzen Land Ägypten alles, was auf dem Feld war, vom Menschen bis zum Vieh. Der Hagel traf alle Pflanzen auf dem Feld und zerschmetterte alle Bäume auf dem Feld.
  rationale: Die Revision ersetzt die nicht vom Wortlaut gedeckte Tötungsaussage „erschlug“ durch „traf“ und erhält dabei die zweifache Verbwiederholung des Hebräischen. „Zerschmetterte“ gibt die intensive gewaltsame Bedeutung von שִׁבֵּר bei Bäumen natürlich wieder. Die nicht notwendige Fußnote wird samt Anker entfernt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:50Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von אָדָם bis בְּהֵמָה als „vom Menschen bis zum Vieh“ ist sachgerecht; auch „Pflanzen“ für עֵשֶׂב und „Bäume“ für עֵץ passen zum Kontext. „Erschlug“ legt jedoch ausdrücklich eine Tötung fest, die נכה in diesem Vers nicht selbst aussagt. Das Verb bezeichnet hier zunächst das heftige Treffen/Schlagen durch den Hagel. Die Wiederholung von נכה sollte daher ohne diese Bedeutungsverengung wiedergegeben werden. שִׁבֵּר wird mit „zerschmetterte“ angemessen kräftig wiedergegeben.
  naturalness: „Der Hagel traf … alles“ ist modernes, idiomatisches Standarddeutsch. Die Wiederholung von „Der Hagel“ und die Feldangabe bewahren die hebräische Struktur, ohne unnatürlich zu wirken.
  terminology: '„Hagel“, „Land Ägypten“, „Mensch“, „Vieh“, „Pflanzen“ und „Bäume“ sind treffend und registergerecht. Eine Fußnote ist hier nicht erforderlich: Die deutsche Satzstellung macht bereits deutlich, dass „vom Menschen bis zum Vieh“ den Umfang von „alles“ bestimmt.'
  issues:
