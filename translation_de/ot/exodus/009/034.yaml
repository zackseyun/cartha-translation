  text: וַ/יַּ֣רְא פַּרְעֹ֗ה כִּֽי חָדַ֨ל הַ/מָּטָ֧ר וְ/הַ/בָּרָ֛ד וְ/הַ/קֹּלֹ֖ת וַ/יֹּ֣סֶף לַ/חֲטֹ֑א וַ/יַּכְבֵּ֥ד לִבּ֖/וֹ ה֥וּא וַ/עֲבָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: de
  text: Als der Pharao aber sah, dass Regen, Hagel und Donner[a] aufgehört hatten, sündigten er und seine Diener weiter und verhärteten ihre Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Stimmen“ oder „Laute“; im Zusammenhang dieses Unwetters ist damit Donner gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: sah
  rationale: ראה bedeutet in der Erzählung gewöhnlich „sehen“ und kann hier zugleich das Wahrnehmen der eingetretenen Lage ausdrücken.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt dessen ein, was der Pharao wahrnahm; die zeitliche Beziehung wird im Deutschen bereits durch „Als“ ausgedrückt.
- source_word: חָדַל
  choice: aufgehört hatten
  rationale: חדל bezeichnet das Aufhören. Das Plusquamperfekt entspricht der Vorzeitigkeit gegenüber dem Sehen des Pharaos.
- source_word: הַמָּטָר וְהַבָּרָד וְהַקֹּלֹת
  choice: Regen, Hagel und Donner
  rationale: „Regen“ und „Hagel“ sind direkte Entsprechungen; קֹלוֹת heißt wörtlich „Stimmen/Laute“, bezeichnet im Zusammenhang des Unwetters jedoch Donner.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: sündigte er weiter
  rationale: Die Verbindung יסף mit Infinitiv bezeichnet eine Fortsetzung oder Wiederholung. „Sündigte weiter“ ist im Deutschen natürlich und bewahrt den fortdauernden Sinn.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: verhärtete sein Herz
  rationale: כבד hat die Grundvorstellung von Schwere, bezeichnet in dieser wiederkehrenden Wendung jedoch das Verhärten beziehungsweise Unempfänglichmachen des Herzens.
- source_word: הוּא וַעֲבָדָיו
  choice: er und seine Diener
  rationale: Die nachgestellte Formulierung wird eng am Hebräischen bewahrt. עֲבָדִים kann Diener, Beamte oder Sklaven bezeichnen; im königlichen Umfeld ist „Diener“ eine angemessen offene Wiedergabe.
- source_word: וַ
  choice: aber
  rationale: Das einleitende Waw führt die Erzählung fort; „aber“ macht zugleich den Gegensatz zum vorausgehenden Bekenntnis des Pharaos deutlich.
theological_decisions:
- issue: Urheberschaft und Umfang der Herzensverhärtung
  choice: Der Vers sagt ausdrücklich, dass der Pharao sein Herz verhärtete, und fügt danach „er und seine Diener“ hinzu.
  alternative: Die Aussage könnte im Deutschen zu „er und seine Diener verhärteten ihre Herzen“ ausgeglichen werden.
  rationale: Die gewählte Fassung bewahrt die auffällige hebräische Konstruktion mit singularischem Verb und „sein Herz“ sowie der nachgestellten Beteiligung der Diener. Sie macht keine weitergehende Aussage über göttliche und menschliche Urheberschaft.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Pharao“ wird mit bestimmtem Artikel gebraucht, wie es im heutigen Standarddeutsch in diesem Kontext natürlich ist. Die etwas markierte Schlusswendung bleibt bewusst nahe an der syntaktischen und theologischen Spannung des Hebräischen.
