base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose: „Strecke deine Hand zum Himmel[a] aus, damit im ganzen Land Ägypten Hagel fällt – auf Mensch[b] und Vieh und auf alle Pflanzen des Feldes im Land Ägypten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann den sichtbaren Himmel oder den Himmel im weiteren Sinn bezeichnen; hier ist wegen des Hagels der sichtbare Himmel gemeint.
    reason: lexical_alternative
  - marker: b
    text: „Mensch“ bezeichnet hier die Menschen allgemein; der hebräische Singular wird kollektiv gebraucht und steht dem Vieh gegenüber.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Strecke deine Hand … aus
  rationale: Die Wendung gibt den Imperativ und das gewöhnliche Wort für „Hand“ genau und idiomatisch wieder.
- source_word: עַל הַשָּׁמַיִם
  choice: zum Himmel
  rationale: Die Präposition bezeichnet hier die Richtung der Geste. „Himmel“ ist im Deutschen natürlich und kann wie das hebräische Wort sowohl den sichtbaren Himmel als auch den Himmel im weiteren Sinn bezeichnen; der Wetterkontext legt den sichtbaren Himmel nahe.
- source_word: וִיהִי בָרָד
  choice: damit … Hagel fällt
  rationale: Die Form drückt hier die beabsichtigte Folge des Befehls aus. „Hagel fällt“ bezeichnet das meteorologische Geschehen im Deutschen natürlich, ohne die Aussage inhaltlich auszuweiten.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Die Wiedergabe erhält sowohl die umfassende Reichweite als auch die räumliche Bedeutung der hebräischen Fügung.
- source_word: הָאָדָם
  choice: Mensch
  rationale: Der hebräische Singular hat hier kollektive, repräsentative Bedeutung und steht in der knappen Paarung mit dem Vieh.
- source_word: הַבְּהֵמָה
  choice: Vieh
  rationale: Im Kontext der Plagen bezeichnet das Wort die gehaltenen Tiere; „Vieh“ ist präzise, geläufig und passt zur Gegenüberstellung mit „Mensch“.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: alle Pflanzen des Feldes
  rationale: עֵשֶׂב umfasst Gras, Kräuter und sonstigen Pflanzenwuchs. „Pflanzen“ ist verständlich und hinreichend weit; „des Feldes“ bewahrt die nähere Bestimmung.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die abschließende Wiederholung wird beibehalten, weil sie im Hebräischen ausdrücklich steht und den räumlichen Geltungsbereich erneut hervorhebt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen in seiner im Deutschen gebräuchlichen Form und vermeidet die Ersetzung durch einen Titel.
- issue: Kollektive Bedeutung von הָאָדָם
  choice: Mensch
  alternative: Menschen; Menschheit
  rationale: Der Singular des Ausgangstextes wird bewahrt, während eine Fußnote deutlich macht, dass Menschen allgemein gemeint sind; so bleibt auch die Gegenüberstellung „Mensch und Vieh“ erhalten.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzfolge bleibt eng am Hebräischen, wird aber durch „damit … Hagel fällt“ idiomatisch deutsch formuliert. Die Wiederholung von „Land Ägypten“ bleibt als bewusstes Merkmal des Ausgangstextes erhalten.
