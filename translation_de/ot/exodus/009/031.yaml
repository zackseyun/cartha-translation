lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: der Flachs
  rationale: פִּשְׁתָּה bezeichnet die Flachspflanze, aus der Leinen gewonnen wird. „Flachs“ ist im landwirtschaftlichen Zusammenhang die direkte und natürliche deutsche Entsprechung.
- source_word: הַשְּׂעֹרָה
  choice: die Gerste
  rationale: שְׂעֹרָה bezeichnet eindeutig die Getreideart Gerste.
- source_word: נֻכָּתָה
  choice: wurden niedergeschlagen
  rationale: Die passive Form von נכה beschreibt, dass der Hagel beide Feldfrüchte traf und zu Boden schlug. Im Deutschen steht bei dem zusammengesetzten Subjekt idiomatisch der Plural.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung dafür ein, weshalb diese Pflanzen besonders vom Hagel getroffen wurden. „Denn“ verbindet die Aussage im Deutschen natürlich mit der folgenden Erklärung.
- source_word: אָבִיב
  choice: stand in den Ähren
  rationale: אָבִיב bezeichnet Gerste in einem fortgeschrittenen, noch frischen Reifestadium, in dem die Ähren ausgebildet sind. Die Formulierung bewahrt das konkrete landwirtschaftliche Bild, ohne vollständige Reife zu behaupten.
- source_word: גִּבְעֹל
  choice: in der Blüte
  rationale: גִּבְעֹל bezeichnet beim Flachs ein fortgeschrittenes Wachstumsstadium; die genaue botanische Phase ist unsicher. „In der Blüte“ ist verständlich und entspricht einer verbreiteten Deutung, während eine Fußnote die mögliche Alternative nennt.
