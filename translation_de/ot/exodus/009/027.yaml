base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: de
  text: 'Da schickte der Pharao hin und ließ Mose und Aaron rufen. Er sagte zu ihnen: »Diesmal habe ich gesündigt. Jahwe ist im Recht[a]; mein Volk und ich aber sind die Frevler[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe ist gerecht.«'
    reason: Lexikalische Alternative für הַצַּדִּיק; der Ausdruck kann Gottes Gerechtigkeit charakterisieren und im Kontext zugleich bedeuten, dass er im Recht ist.
  - marker: b
    text: 'Oder: »mein Volk und ich sind die Schuldigen / die Bösen.«'
    reason: Lexikalische Alternativen für הָרְשָׁעִים; der Begriff bezeichnet schuldhaft und moralisch verwerflich Handelnde.
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: schickte nach ... und ließ sie rufen
  rationale: Die Formulierung gibt die Abfolge von Senden und Herbeirufen in natürlichem Deutsch wieder, ohne ausdrücklich nicht genannte Boten in den Text einzufügen.
- source_word: חָטָאתִי הַפָּעַם
  choice: Diesmal habe ich gesündigt
  rationale: Das Perfekt bezeichnet hier das eingestandene Fehlverhalten; »diesmal« gibt die zeitliche Wendung knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Hebräischen stehende Namensform wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַצַּדִּיק
  choice: ist im Recht
  rationale: Im unmittelbaren Gegensatz zu Pharao und seinem Volk hat der Ausdruck eine moralisch-rechtliche Färbung. »Ist im Recht« ist in diesem Bekenntnis natürlich; »ist gerecht« bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: הָרְשָׁעִים
  choice: die Schuldigen
  rationale: Das substantivisch gebrauchte Adjektiv steht im Plural und bezeichnet diejenigen, die moralisch und rechtlich schuldig sind. Die Übersetzung bewahrt den Gegensatz zu »im Recht« und vermeidet eine Abschwächung zu bloßem Irrtum.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt in modernem Deutsch den Unterschied zwischen Eigenname und Herrschaftstitel.
- issue: Aussage über Gottes Gerechtigkeit und die Schuld Pharaos
  choice: Jahwe ist im Recht; ich aber und mein Volk sind die Schuldigen
  alternative: Jahwe ist gerecht; ich aber und mein Volk sind die Frevler
  rationale: Die Hauptfassung verdeutlicht den gerichtlichen Gegensatz, ohne die moralische Schuld Pharaos und seines Volkes zu leugnen. Die Fußnoten bewahren die mögliche stärker charakterbezogene Wiedergabe der beiden hebräischen Adjektive.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich. »Ich aber und mein Volk« folgt der hebräischen Reihenfolge und hebt Pharaos persönliche Selbstanklage hervor.
