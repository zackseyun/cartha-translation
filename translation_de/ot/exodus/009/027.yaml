  source_fidelity: 'Die Aussage wird insgesamt treffend wiedergegeben: Pharao bekennt seine Sünde, erkennt Jahwe als den im Recht/Gerechten an und rechnet sich samt seinem Volk zu den moralisch Schuldigen. Die Wiedergabe von הָרְשָׁעִים als „die Schuldigen“ ist im Kontext möglich, aber gegenüber dem deutlich moralisch wertenden hebräischen Ausdruck etwas zu eng rechtlich gefasst. Die Kombination „schickte nach … und ließ sie rufen“ ist zudem semantisch unnötig doppelt und gibt die beiden hebräischen Verben weniger klar wieder.'
  naturalness: Der Stil ist würdig und modern verständlich. „Mein Volk und ich“ ist im heutigen Standarddeutsch idiomatischer als „ich aber und mein Volk“. „Pharao schickte hin und ließ Mose und Aaron rufen“ bewahrt den knappen Erzählstil und die Abfolge besser.
  terminology: „Jahwe“ ist als Wiedergabe von יהוה konsequent. „ist im Recht“ trifft den forensisch-moralischen Kontrast gut; „ist gerecht“ ist eine geeignete Fußnotenalternative. Für הָרְשָׁעִים ist „die Frevler“ als Haupttext angemessener, da es sowohl die moralische Verwerflichkeit als auch die pluralische substantivische Form wahrt, ohne eine bestimmte strafrechtliche Festlegung zu erzwingen.
