    rationale: Das hebräische רְשָׁעִים bezeichnet nicht nur rechtlich Schuldige, sondern gewöhnlich Frevler bzw. gottlos-böse Handelnde. „Die Schuldigen“ ist möglich, schwächt aber den moralischen Wertungsgehalt. „Die Frevler“ wahrt diesen besser.
  - severity: low
    issue: „schickte nach … und ließ sie rufen“
    rationale: Die Formulierung verbindet das Senden-nach und Herbeirufen in einer im Deutschen etwas redundanten Umschreibung. Eine knappe Formulierung mit „schickte hin“ und „ließ … rufen“ macht die im Hebräischen aufeinanderfolgenden Verben klarer.
  - severity: low
    issue: „ich aber und mein Volk“
    rationale: Die hebräische Reihenfolge kann zwar abgebildet werden, doch „mein Volk und ich“ ist modernes standardsprachliches Deutsch. Der Gegensatz bleibt durch „aber“ erhalten.
