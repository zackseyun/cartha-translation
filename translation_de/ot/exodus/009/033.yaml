  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה מֵ/עִ֤ם פַּרְעֹה֙ אֶת הָ/עִ֔יר וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו אֶל יְהוָ֑ה וַֽ/יַּחְדְּל֤וּ הַ/קֹּלוֹת֙ וְ/הַ/בָּרָ֔ד וּ/מָטָ֖ר לֹא נִתַּ֥ךְ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: de
  text: Da ging Mose vom Pharao weg, verließ die Stadt und breitete seine Hände zu Jahwe hin aus. Da hörten der Donner[a] und der Hagel auf, und kein Regen ergoss sich mehr auf die Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stimmen“ oder „die Laute“; im Zusammenhang des Unwetters ist Donner gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und Regen wurde nicht zur Erde gegossen.“ „Erde“ kann hier auch „Boden“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Da ging Mose vom Pharao weg, verließ die Stadt
  rationale: מֵעִם bezeichnet die Trennung aus der Gegenwart des Pharaos. Das ungewöhnliche אֶת הָעִיר steht bei der Bewegung aus der Stadt; die Aufteilung in zwei koordinierte Verben gibt den Bewegungsablauf im Deutschen klar und natürlich wieder.
- source_word: וַיִּפְרֹשׂ כַּפָּיו אֶל יְהוָה
  choice: und breitete seine Hände zu Jahwe hin aus
  rationale: Die konkrete Gebetsgeste bleibt erhalten. „Zu … hin“ gibt die durch אֶל bezeichnete Ausrichtung wieder, ohne die Handlung lediglich als „beten“ zu paraphrasieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: הַקֹּלוֹת
  choice: der Donner
  rationale: Das wörtlich „die Stimmen/Laute“ bedeutende Wort bezeichnet im Zusammenhang dieses Unwetters den Donner; die Fußnote bewahrt das hebräische Bild.
- source_word: וַיַּחְדְּלוּ
  choice: hörten … auf
  rationale: Das Verb חדל bezeichnet das Aufhören oder Ende eines Vorgangs. Die deutsche Wendung ist natürlich und passt zu Donner und Hagel.
- source_word: וְהַבָּרָד
  choice: und der Hagel
  rationale: Direkte und eindeutige Wiedergabe des Wetterphänomens.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: und kein Regen ergoss sich mehr auf die Erde
  rationale: Das Passiv von נתך trägt das Bild des Ausgießens. Die reflexive deutsche Form ist idiomatisch; „mehr“ macht im Zusammenhang deutlich, dass der bisherige Regen endete. אָרְצָה kann sowohl auf die Erde als auch auf den Boden zielen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Quelltext nennt den Tetragrammaton ausdrücklich. Die Namensform „Jahwe“ bewahrt den Charakter als Eigenname, ohne eine konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klaren Hauptsätzen. Die konkrete Gebetsgeste und das Bild des ausgegossenen Regens bleiben erhalten; ungebräuchliche oder missverständliche Hebraismen werden durch Fußnoten transparent gemacht.
