  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: de
  text: 'Doch gerade zu diesem Zweck habe ich dich bestehen lassen[a]: um dir meine Macht zu zeigen und damit mein Name auf der ganzen Erde verkündet wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habe ich dich aufgerichtet“ oder „habe ich dich stehen lassen“. Das Hebräische kann bedeuten, dass Gott den Pharao stehen oder weiterbestehen ließ; im Zusammenhang ist wahrscheinlich gemeint, dass er ihn nicht sofort vernichtete.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Doch
  rationale: Gibt den starken Gegensatz zum vorhergehenden Vers in natürlichem, gegenwärtigem Deutsch wieder.
- source_word: בַּעֲבוּר זֹאת
  choice: gerade zu diesem Zweck
  rationale: Kennzeichnet eine Ziel- beziehungsweise Zweckangabe; „gerade“ hebt die im Hebräischen betonte Wendung angemessen hervor.
- source_word: הֶעֱמַדְתִּיךָ
  choice: habe ich dich bestehen lassen
  rationale: 'Bewahrt das Bild des Stehenbleibens und passt zum unmittelbaren Zusammenhang: Der Pharao wurde nicht schon vernichtet, sondern durfte weiterbestehen. Zugleich wird die mögliche weiter gefasste Bedeutung nicht vollständig festgelegt.'
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: um dir … zu zeigen
  rationale: 'Gibt die Zweckkonstruktion knapp und idiomatisch wieder; das Suffix wird als persönliches Objekt verstanden: Gott zeigt dem Pharao seine Macht.'
- source_word: כֹּחִי
  choice: meine Macht
  rationale: „Macht“ bezeichnet hier treffend die in den Plagen sichtbar werdende göttliche Kraft.
- source_word: וּלְמַעַן
  choice: und damit
  rationale: Leitet den zweiten, mit dem ersten koordinierten Zweck ein und klingt in modernem Deutsch natürlich.
- source_word: סַפֵּר
  choice: verkündet wird
  rationale: Das Piel bezeichnet das Erzählen oder Bekanntmachen. Die unpersönliche passive Form erhält den im Hebräischen nicht ausdrücklich genannten menschlichen Handlungsträger.
- source_word: שְׁמִי
  choice: mein Name
  rationale: Bewahrt die zentrale hebräische Ausdrucksweise, die sowohl Gottes offenbare Identität als auch seinen Ruf umfasst.
- source_word: בְּכָל הָאָרֶץ
  choice: auf der ganzen Erde
  rationale: Der Zusammenhang zielt auf weltweite Bekanntmachung; daher ist „Erde“ hier geeigneter als das räumlich begrenztere „Land“.
theological_decisions:
- issue: Bedeutung von הֶעֱמַדְתִּיךָ in Bezug auf den Pharao
  choice: Gott hat den Pharao bestehen lassen, statt ihn bereits zu vernichten.
  alternative: Gott hat den Pharao zu diesem Zweck auftreten lassen oder ihn in seine Stellung erhoben.
  rationale: Der unmittelbare Kontext stellt Gottes mögliche sofortige Vernichtung des Pharaos dessen fortdauerndem Bestehen gegenüber. Die Formulierung wahrt zugleich die sprachliche Spannung und vermeidet die zusätzliche Festlegung, Gott habe ihn ausdrücklich in das Königsamt eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bildet die beiden göttlichen Zweckangaben klar ab; die traditionelle Bildsprache von Name, Macht und Bestehen bleibt erhalten.
