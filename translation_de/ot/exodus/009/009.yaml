  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: de
  text: Und er wird zu feinem Staub über dem ganzen Land Ägypten werden; und er wird an Menschen[a] und Tieren im ganzen Land Ägypten zu Geschwüren werden, die Blasen hervortreiben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Menschen“; das hebräische Wort bezeichnet hier die Menschen allgemein, im Gegensatz zu den Tieren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder, die Bildsprache enger nachbildend: „zu Geschwüren, die mit Blasen ausbrechen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: und er wird zu feinem Staub werden
  rationale: היה mit ל bezeichnet hier das Ergebnis beziehungsweise die Verwandlung; „zu … werden“ gibt dies im Deutschen natürlich wieder. אָבָק ist feiner Staub beziehungsweise Pulver.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: über dem ganzen Land Ägypten
  rationale: עַל beschreibt hier die räumliche Ausbreitung über das gesamte Gebiet.
- source_word: עַל הָאָדָם
  choice: an Menschen
  rationale: אָדָם bezeichnet hier kollektiv die Menschheit im Gegensatz zu den Tieren. „Menschen“ ist im modernen Deutschen eindeutig generisch und wahrt den Gegensatz.
- source_word: וְעַל הַבְּהֵמָה
  choice: und Tieren
  rationale: בְּהֵמָה steht kollektiv für Tiere; „Tiere“ ist weiter und kontextgerechter als das auf Nutztiere beschränkte „Vieh“.
- source_word: לִשְׁחִין
  choice: zu Geschwüren
  rationale: שְׁחִין bezeichnet eine eruptive Hautkrankheit beziehungsweise Geschwüre; der deutsche Plural passt natürlich zur verbreiteten Erkrankung.
- source_word: פֹּרֵחַ אֲבַעְבֻּעֹת
  choice: die als Blasen ausbrechen
  rationale: Die Formulierung bildet sowohl das partizipiale פֹּרֵחַ („ausbrechend“, wörtlich „aufsprossend“) als auch אֲבַעְבֻּעֹת („Blasen“) ab, ohne eines der Elemente zu unterschlagen.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Die Wiederholung wahrt die Betonung der vollständigen räumlichen Ausdehnung.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: Menschen
  alternative: der Mensch / die Menschheit
  rationale: Das Wort ist hier kollektiv und schließt alle betroffenen Menschen ein. „Menschen“ ist modernes, natürliches Deutsch und hält den im Hebräischen gesetzten Gegensatz zwischen Mensch und Tier aufrecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung „im/über dem ganzen Land Ägypten“ bleibt wegen der ausdrücklichen Wiederholung im Hebräischen erhalten. Das Pronomen „er“ nimmt den Ruß beziehungsweise Ofenstaub aus dem vorherigen Vers auf.
