base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: de
  text: Denn ich hätte meine Hand schon längst ausstrecken und dich und dein Volk mit der Pest schlagen können; dann wärst du von der Erde getilgt worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formaler nach den hebräischen Verbformen: „Denn jetzt habe ich meine Hand ausgestreckt und dich und dein Volk mit der Pest geschlagen, und du wurdest von der Erde getilgt.“ Die Verbformen stehen formal in der Vergangenheit; der Zusammenhang spricht jedoch stark für eine kontrafaktische Bedeutung.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung zur vorausgehenden Aussage ein und gibt den erklärend-kausalen Zusammenhang natürlich wieder.
- source_word: עַתָּה
  choice: schon längst
  rationale: Im kontrafaktischen Zusammenhang bezeichnet das Wort, was bis zu diesem Zeitpunkt bereits hätte geschehen können. „Schon längst“ ist dafür im Deutschen idiomatisch.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: ich hätte meine Hand … ausstrecken können
  rationale: Die formal perfektive Verbform wird aufgrund des Zusammenhangs kontrafaktisch verstanden. „Die Hand ausstrecken“ bewahrt das hebräische Bild für machtvolles göttliches Eingreifen.
- source_word: וָאַךְ
  choice: und … schlagen
  rationale: נכה bezeichnet hier ein vernichtendes Schlagen durch göttliches Gericht; „schlagen“ ist präzise und nicht altertümlich.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: dich und dein Volk
  rationale: Direkte, natürliche Wiedergabe der beiden Objekte des Gerichts.
- source_word: בַּדָּבֶר
  choice: mit der Pest
  rationale: דֶּבֶר bezeichnet in Gerichtszusammenhängen eine tödliche Seuche. „Pest“ ist knapp und unterscheidet diese konkrete Todesseuche von der allgemeineren Bezeichnung „Plage“.
- source_word: וַתִּכָּחֵד
  choice: dann wärst du … getilgt worden
  rationale: Der Nifal von כחד drückt Auslöschung oder Beseitigung aus. Die konditionale Folgeformulierung macht den im Kontext erforderlichen kontrafaktischen Sinn deutlich.
- source_word: מִן־הָאָרֶץ
  choice: von der Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Hier geht es um vollständige Auslöschung, nicht nur um Entfernung aus Ägypten; „Erde“ bewahrt diese umfassende Aussage.
theological_decisions:
- issue: Kontrafaktische Bedeutung der Verbfolge
  choice: 'Kontrafaktisch: „ich hätte … können; dann wärst du … worden“'
  alternative: 'Formal als Vergangenheit: „Jetzt habe ich meine Hand ausgestreckt … und du wurdest von der Erde getilgt.“'
  rationale: Der unmittelbare Kontext stellt das mögliche vollständige Gericht dem tatsächlichen Fortbestehen des Pharaos gegenüber, durch das Gottes Macht bekannt gemacht werden soll (Verse 15–16). Die kontrafaktische Wiedergabe erklärt, warum der weiterhin angesprochene Pharao nicht bereits vernichtet ist, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestaltung ist natürlich und bewahrt zugleich das hebräische Bild von der ausgestreckten Hand sowie die Spannung zwischen formaler Vergangenheitsform und kontrafaktischem Zusammenhang.
