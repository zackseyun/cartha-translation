  source_fidelity: 'Die Übersetzung gibt die im Kontext naheliegende kontrafaktische Aussage treffend wieder: Das Ausstrecken der Hand und das Schlagen mit der Pestilenz werden als nicht verwirklichte Möglichkeit dargestellt, deren Folge die Auslöschung des Pharaos gewesen wäre. „Denn“, „schon längst“, „meine Hand ausstrecken“, „dich und dein Volk“, „mit der Pest“ und „von der Erde“ entsprechen dem hebräischen Text und dem Sinnzusammenhang. Das Singularpronomen in „wärst du“ ist korrekt, obwohl zuvor auch das Volk als Objekt des Schlagens genannt wird.'
