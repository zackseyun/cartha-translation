  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: de
  text: Wer aber das Wort Jahwes nicht ernst nahm[a], ließ seine Diener und sein Vieh auf dem Feld.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Herz nicht auf das Wort Jahwes richtete“; sinngemäß auch: „sich das Wort Jahwes nicht zu Herzen nahm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Wer aber
  rationale: Die Verbindung aus waw und Relativpartikel stellt diese Gruppe der im vorigen Vers genannten gegenüber; „Wer aber“ gibt sowohl den Gegensatz als auch den unbestimmten Bezug natürlich wieder.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: nicht ernst nahm
  rationale: Die Wendung lautet wörtlich „sein Herz nicht auf … richten“ und bezeichnet hier, dass jemand Jahwes Warnung nicht beherzigte. „Nicht ernst nahm“ drückt diesen Sinn in klarem modernem Deutsch aus.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Botschaft“ bedeuten. Hier ist die zuvor ausgesprochene Warnung gemeint; „das Wort Jahwes“ bewahrt zugleich die biblische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיַּעֲזֹב
  choice: ließ
  rationale: Das Verb bezeichnet hier das Zurück- beziehungsweise Draußenlassen der Diener und Tiere angesichts des angekündigten Hagels.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann je nach Zusammenhang „Diener“ oder „Sklave“ bedeuten. Der Vers hebt ihre Funktion im Haushalt und ihr Verbleiben im Freien hervor; „Diener“ vermeidet eine unbelegte Festlegung ihres Rechtsstatus.
- source_word: מִקְנֵהוּ
  choice: sein Vieh
  rationale: Das Kollektiv bezeichnet gehaltene Nutztiere beziehungsweise Herdenbesitz. „Vieh“ ist hier die natürliche und umfassende deutsche Wiedergabe.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Die übliche deutsche Ortsangabe gibt wieder, dass Diener und Vieh dem angekündigten Unwetter draußen ausgesetzt blieben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. Die Umschrift „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Titel „der HERR“ zu ersetzen.
- issue: Bedeutung von לֹא שָׂם לִבּוֹ אֶל
  choice: nicht ernst nahm
  alternative: sein Herz nicht auf … richtete / sich nicht zu Herzen nahm
  rationale: Die Hauptfassung gibt die praktische Missachtung der göttlichen Warnung verständlich wieder; die Fußnote bewahrt das hebräische Herz-Idiom und seine mögliche idiomatische Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe erzählerische Gegensatz bleibt erhalten. Das hebräische Herz-Idiom wird im Haupttext verständlich wiedergegeben und in der Fußnote transparent gemacht.
