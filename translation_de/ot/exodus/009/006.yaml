id: EXO.9.6
reference: Exodus 9:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: de
  text: 'Und Jahwe tat dies am nächsten Tag: Der ganze Viehbestand Ägyptens starb, doch vom Vieh der Israeliten[a] starb nicht ein einziges Tier.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Söhne Israels«.'
    reason: Die Fußnote macht die formale Gestalt des hebräischen Ethnonyms בְנֵי יִשְׂרָאֵל sichtbar.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt.
- source_word: וַיַּעַשׂ ... אֶת הַדָּבָר הַזֶּה
  choice: tat dies
  rationale: Die knappe Wiedergabe entspricht der hebräischen Verbindung von עשה und דבר und klingt im modernen Deutschen natürlicher als »tat diese Sache«.
- source_word: מִמָּחֳרָת
  choice: am nächsten Tag
  rationale: Die Zeitangabe bezeichnet den folgenden Tag; diese Formulierung ist präzise und idiomatisch.
- source_word: כֹּל מִקְנֵה מִצְרָיִם
  choice: der ganze Viehbestand Ägyptens
  rationale: מִקְנֶה umfasst Nutz- und Herdentiere und ist weiter als nur »Rinder«; »Viehbestand« gibt zugleich den kollektiven Sinn wieder.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: doch vom Vieh der Israeliten
  rationale: »vom Vieh« bewahrt die Präposition מִן, während »Israeliten« die ethnonymische Funktion von בְנֵי יִשְׂרָאֵל in natürlichem Deutsch ausdrückt.
- source_word: לֹא מֵת אֶחָד
  choice: starb nicht ein einziges Tier
  rationale: Die Formulierung bewahrt die emphatische Verneinung; »Tier« macht im Deutschen den durch den Kontext bezeichneten Bezug von אֶחָד eindeutig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Ethnonym בְנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels; Kinder Israels
  rationale: Die Wendung bezeichnet hier kollektiv das Volk Israel und hebt nicht ausschließlich männliche Einzelpersonen hervor. Die wörtliche Form bleibt in der Fußnote sichtbar.
- issue: Umfang von כֹּל מִקְנֵה מִצְרָיִם
  choice: der ganze Viehbestand Ägyptens
  alternative: alles Vieh der Ägypter
  rationale: Das uneingeschränkte כֹּל wird beibehalten, auch wenn spätere Verse erneut ägyptisches Vieh erwähnen; die mögliche erzählerische Spannung wird nicht durch eine abschwächende Ergänzung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und erzählerisch; der Doppelpunkt verdeutlicht die Folge, ohne eine zusätzliche Deutung einzuführen.
