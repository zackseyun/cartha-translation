  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ קְח֤וּ לָ/כֶם֙ מְלֹ֣א חָפְנֵי/כֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּ/זְרָק֥/וֹ מֹשֶׁ֛ה הַ/שָּׁמַ֖יְמָ/ה לְ/עֵינֵ֥י פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose und Aaron: „Nehmt euch beide Hände voll Ruß aus einem Brennofen[a], und Mose soll ihn vor den Augen des Pharaos zum Himmel werfen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus einem Ofen“. Das hebräische Wort kann einen Ofen oder Brennofen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „himmelwärts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: קְחוּ לָכֶם
  choice: Nehmt euch
  rationale: Der Plural richtet sich an Mose und Aaron; „euch“ bewahrt die dativisch-reflexive Nuance von לָכֶם.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: beide Hände voll
  rationale: חֹפֶן bezeichnet die hohlen Hände beziehungsweise das, was sie fassen. Die deutsche Wendung gibt das Maß natürlich wieder; die genaue Verteilung zwischen den beiden Angeredeten bleibt wie im Hebräischen offen.
- source_word: פִּיחַ
  choice: Ruß
  rationale: Das Wort bezeichnet feinen, rußartigen Rückstand und ist spezifischer als das allgemeinere „Asche“.
- source_word: כִּבְשָׁן
  choice: Brennofen
  rationale: Der Ausdruck kann einen Ofen oder Brennofen bezeichnen. „Brennofen“ ist verständlich und vermeidet eine unbelegte Festlegung auf einen bestimmten Gewerbetyp.
- source_word: וּזְרָקוֹ מֹשֶׁה
  choice: und Mose soll ihn … hinaufwerfen
  rationale: Nach dem pluralischen Befehl wechselt der hebräische Text ausdrücklich zu Mose als einzelnem Handelnden. Das maskuline Pronomen bezieht sich grammatisch auf den Ruß.
- source_word: הַשָּׁמַיְמָה
  choice: zum Himmel hinauf
  rationale: Die Richtungsendung bezeichnet eine Bewegung himmelwärts. Die Formulierung ist im konkreten Vorgang natürlich, ohne die mögliche Bedeutung „Himmel“ auf bloß „Luft“ zu verengen.
- source_word: לְעֵינֵי פַרְעֹה
  choice: vor den Augen des Pharaos
  rationale: Die bildhafte hebräische Wendung wird direkt und im Deutschen idiomatisch bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen traditionellen Titel zu ersetzen.
- issue: Bedeutung von הַשָּׁמַיְמָה
  choice: zum Himmel hinauf
  alternative: in die Luft
  rationale: Die Übersetzung erhält die lexikalische Spannweite von שָׁמַיִם und macht zugleich durch „hinauf“ die konkrete Bewegungsrichtung deutlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom pluralischen Auftrag an Mose und Aaron zur ausdrücklich Mose zugewiesenen Handlung bleibt erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
