  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: de
  text: 'Mose sagte zu ihm: „Sobald ich die Stadt verlassen habe, werde ich meine Hände zu Jahwe hin ausbreiten. Dann wird der Donner[a] aufhören, und es wird keinen Hagel mehr geben, damit du erkennst, dass die Erde[b] Jahwe gehört.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Stimmen“ oder „die Laute“; im Zusammenhang des Unwetters ist der Donner gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Land“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי אֶת־הָעִיר
  choice: Sobald ich die Stadt verlassen habe
  rationale: כְּ mit dem Infinitiv constructus und dem Suffix der 1. Person bezeichnet hier den Zeitpunkt des Hinausgehens; „sobald“ gibt den unmittelbaren zeitlichen Zusammenhang natürlich wieder.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: werde ich meine Hände … ausbreiten
  rationale: Die Wendung bezeichnet das Ausbreiten bzw. Erheben der Hände als Gebetsgeste. Die konkrete Bildsprache bleibt erhalten.
- source_word: יְהוָה / לַיהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַקֹּלוֹת
  choice: der Donner
  rationale: Wörtlich steht der Plural „die Stimmen/Laute“; im Zusammenhang des Hagelsturms bezeichnet er Donnerschläge. Der deutsche Singular „Donner“ ist idiomatisch.
- source_word: יֶחְדָּלוּן
  choice: wird … aufhören
  rationale: חדל bedeutet aufhören oder ein Ende nehmen; „aufhören“ ist klar und gegenwärtig.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: und es wird keinen Hagel mehr geben
  rationale: Diese natürliche deutsche Formulierung gibt wieder, dass der Hagel nicht länger vorhanden sein oder auftreten wird.
- source_word: לְמַעַן תֵּדַע
  choice: So sollst du erkennen
  rationale: לְמַעַן drückt Zweck bzw. Ziel aus. „Sollst du erkennen“ bewahrt diese Zielrichtung und klingt im Deutschen natürlicher als eine mögliche Aussageform.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: dass die Erde Jahwe gehört
  rationale: Das לְ bezeichnet Zugehörigkeit bzw. Besitz. הָאָרֶץ kann „Erde“ oder „Land“ heißen; der Haupttext gibt den wahrscheinlich umfassenden Sinn wieder, während die Fußnote die örtlich engere Möglichkeit bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. „Jahwe“ bewahrt den Charakter als offenbarter Eigenname; die traditionelle Ersetzung durch „der HERR“ wird nicht in den Haupttext übernommen.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Im Zusammenhang der Konfrontation mit dem Pharao kann die Aussage Jahwes umfassende Herrschaft über die Erde bezeichnen. Da הָאָרֶץ zugleich „das Land“ bedeuten kann, wird diese echte lexikalische Mehrdeutigkeit in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und rhythmisch; konkrete hebräische Bildsprache wird erhalten, während wetterbezogene Idiomatik natürlich deutsch formuliert ist.
