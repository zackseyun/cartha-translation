  source_fidelity: 'Die Übersetzung gibt die Abfolge der hebräischen Wayyiqtol-Erzählung zutreffend wieder: Schwangerschaft, Geburt eines Sohnes, ihre Wahrnehmung des Kindes und das Verbergen für drei Monate. »Die Frau« folgt ha-ischscha, ohne die aus dem Kontext bekannte Beziehung als »seine Frau« in den Vers einzutragen. »Gut« ist die lexikalische Grundentsprechung zu טוֹב und wahrt dessen mögliche literarische Resonanz sowie die im Hebräischen bestehende Offenheit.'
