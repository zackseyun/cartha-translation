  terminology: Die zentralen Begriffe sind sachgerecht wiedergegeben. »Verbergen« entspricht צפן direkt. Die Fußnote markiert die mögliche ästhetische Bedeutung von טוֹב, ohne sie im Haupttext festzulegen oder eine theologische beziehungsweise traditionsgebundene Deutung aufzuzwingen.
