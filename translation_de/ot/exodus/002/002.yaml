source:
  edition: WLC
  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: de
  text: Die Frau wurde schwanger und brachte einen Sohn zur Welt. Als sie sah, dass er gut[a] war, verbarg sie ihn drei Monate lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »schön« beziehungsweise »wohlgestaltet«. Das hebräische Wort bedeutet wörtlich »gut«, kann in diesem Zusammenhang aber auch etwas Ansehnliches oder Schönes bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: wurde schwanger
  rationale: Das Verb הרה bezeichnet das Schwangerwerden beziehungsweise Empfangen. »Wurde schwanger« ist klares, natürliches Gegenwartsdeutsch und bewahrt die Abfolge der Ereignisse.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der hebräische Text sagt ausdrücklich »die Frau«. Die Wiedergabe übernimmt diese Bezeichnung, ohne aus dem Zusammenhang »seine Frau« einzutragen.
- source_word: וַתֵּלֶד בֵּן
  choice: brachte einen Sohn zur Welt
  rationale: ילד mit בֵּן ist eine übliche Wendung für eine Geburt. »Brachte einen Sohn zur Welt« ist im modernen Deutschen natürlich und würdig.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: Als sie sah, dass er gut war
  rationale: Die Konstruktion aus Objekt und כי-Satz bezeichnet ihre Wahrnehmung des Kindes. »Als« gibt den Erzählfluss idiomatisch wieder, ohne den Aussagegehalt zu verändern.
- source_word: כִּי טוֹב הוּא
  choice: dass er gut war
  rationale: טוֹב bedeutet grundlegend »gut«, kann hier aber auch »schön«, »wohlgestaltet« oder »prächtig« meinen. »Gut« bewahrt die lexikalische Offenheit und einen möglichen Anklang an Genesis 1; die ästhetische Deutung steht in der Fußnote.
- source_word: וַתִּצְפְּנֵהוּ
  choice: verbarg sie ihn
  rationale: צפן bedeutet »verbergen« oder »verstecken«. »Verbergen« passt zum würdigen Erzählregister und bleibt direkt.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: drei Monate lang
  rationale: יֶרַח bezeichnet einen Monat, ursprünglich im Bezug auf den Mondzyklus. Im normalen deutschen Erzähltext gibt »drei Monate lang« Dauer und Sinn genau wieder.
theological_decisions:
- issue: Beschreibung des Kindes mit טוֹב
  choice: gut
  alternative: schön; wohlgestaltet; prächtig
  rationale: Die Grundbedeutung des hebräischen Adjektivs ist »gut«. Diese Wiedergabe legt den Ausdruck nicht vorschnell auf körperliche Schönheit fest und lässt einen möglichen literarischen Anklang an die Schöpfungserzählung bestehen. Da eine ästhetische Bedeutung im Kontext möglich und in späterer Überlieferung bezeugt ist, wird sie in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in einem knappen, würdigen Erzählstil. Die wiederholten hebräischen Erzählverknüpfungen werden natürlich gegliedert; die konkrete Bezeichnung »die Frau« und die Mehrdeutigkeit von טוֹב bleiben erhalten.
