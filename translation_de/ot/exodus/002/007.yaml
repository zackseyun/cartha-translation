  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: de
  text: 'Da sagte seine Schwester zur Tochter des Pharaos: „Soll ich gehen und dir eine stillende Frau von den Hebräerinnen holen, damit sie das Kind für dich stillt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Consecutivum führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge im Deutschen natürlich wieder.
- source_word: אֲחֹתוֹ
  choice: seine Schwester
  rationale: Das maskuline Suffix bezieht sich im Kontext auf das Kind; die pronominale Form bewahrt die knappe Ausdrucksweise des Hebräischen.
- source_word: בַּת פַּרְעֹה
  choice: zur Tochter des Pharaos
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen idiomatisch mit einem Genitivattribut wiedergegeben.
- source_word: הַאֵלֵךְ
  choice: Soll ich gehen
  rationale: Die Fragepartikel mit dem Imperfekt der ersten Person drückt hier ein höfliches Angebot aus.
- source_word: וְקָרָאתִי
  choice: und ... holen
  rationale: קרא bedeutet grundsätzlich „rufen“; im vorliegenden Zusammenhang ist das Herbeirufen einer Person gemeint, wofür „holen“ im modernen Deutschen natürlich und sachlich treffend ist.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: eine stillende Frau
  rationale: Die Wendung bezeichnet wörtlich eine Frau, die stillt. Diese Wiedergabe ist transparent und vermeidet die mögliche berufliche Festlegung von „Amme“.
- source_word: מִן הָעִבְרִיֹּת
  choice: von den Hebräerinnen
  rationale: Die Präposition bezeichnet die Herkunft aus einer Gruppe; „von den Hebräerinnen“ ist knapp und im Deutschen eindeutig.
- source_word: וְתֵינִק
  choice: damit sie ... stillt
  rationale: Der Hifil von ינק bezeichnet das Säugen beziehungsweise Stillen. Im Zusammenhang des Angebots gibt „damit“ die beabsichtigte Folge natürlich wieder.
- source_word: לָךְ
  choice: für dich
  rationale: Der Dativ hebt hervor, dass die Frau im Auftrag und zum Nutzen der Tochter des Pharaos stillen soll; die Wiederholung wird wie im Hebräischen bewahrt.
- source_word: הַיָּלֶד
  choice: das Kind
  rationale: יֶלֶד kann „Kind“ oder „Junge“ bedeuten. „Das Kind“ entspricht der unmittelbaren Szene und vermeidet eine unnötige Spezifizierung.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit natürlichem Erzählfluss. „Stillende Frau“ bewahrt die konkrete Bedeutung des Hebräischen; „holen“ gibt das kontextuelle Herbeirufen idiomatisch wieder. Es ist keine Fußnote nötig, da die lexikalische Alternative „Amme“ keine für Aussage oder Auslegung wesentliche Mehrdeutigkeit darstellt.
