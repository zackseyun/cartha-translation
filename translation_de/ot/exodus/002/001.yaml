  text: וַ/יֵּ֥לֶךְ אִ֖ישׁ מִ/בֵּ֣ית לֵוִ֑י וַ/יִּקַּ֖ח אֶת בַּת לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/001.yaml
  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: de
  text: Ein Mann aus dem Haus Levi ging hin und nahm eine Tochter Levis zur Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Levitin“. Wörtlich heißt es im Hebräischen „eine Tochter Levis“, womit eine weibliche Nachfahrin Levis gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ging hin
  rationale: Das Verb הלך bezeichnet hier das Gehen als erste Handlung der Erzählfolge. „Ging hin“ ist im Deutschen natürlich und bewahrt diese Handlung, ohne sie mit „heiratete“ zu verschmelzen.
- source_word: אִישׁ
  choice: ein Mann
  rationale: אִישׁ bezeichnet hier einen männlichen Menschen und lässt ihn zunächst namenlos; „Ehemann“ würde das Ergebnis der folgenden Handlung vorwegnehmen.
- source_word: מִבֵּית לֵוִי
  choice: aus dem Haus Levi
  rationale: Die formnahe Wendung bewahrt den genealogischen Charakter von בֵּית לֵוִי. „Familie“ wäre möglich, „Stamm“ jedoch weiter gefasst als der hebräische Ausdruck.
- source_word: וַיִּקַּח
  choice: nahm … zur Frau
  rationale: לקח bedeutet wörtlich „nehmen“, wird hier aber im ehelichen Sinn gebraucht. Die deutsche Wendung „zur Frau nehmen“ gibt sowohl den lexikalischen Kern als auch den Kontext verständlich wieder.
- source_word: אֶת
  choice: '[Akkusativzeichen, unübersetzt]'
  rationale: אֶת kennzeichnet im Hebräischen das bestimmte direkte Objekt und erhält im Deutschen kein eigenes Wort.
- source_word: בַּת לֵוִי
  choice: eine Tochter Levis
  rationale: Die wörtliche genealogische Bezeichnung meint eine weibliche Nachfahrin Levis. Sie bewahrt zugleich die sprachliche Entsprechung zu „Haus Levi“; die idiomatischere Alternative steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen; „ging hin“ vermeidet ein unnötiges einleitendes „Nun“, und „nahm … zur Frau“ macht den im Kontext gemeinten ehelichen Sinn natürlich verständlich.
