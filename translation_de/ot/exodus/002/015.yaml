  text: וַ/יִּשְׁמַ֤ע פַּרְעֹה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יְבַקֵּ֖שׁ לַ/הֲרֹ֣ג אֶת מֹשֶׁ֑ה וַ/יִּבְרַ֤ח מֹשֶׁה֙ מִ/פְּנֵ֣י פַרְעֹ֔ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ מִדְיָ֖ן וַ/יֵּ֥שֶׁב עַֽל הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: de
  text: Als der Pharao von dieser Sache[a] hörte, suchte er Mose zu töten. Doch Mose floh vor dem Pharao, hielt sich im Land Midian auf[b] und setzte sich an den Brunnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von diesem Vorfall hörte“ oder „von dieser Angelegenheit erfuhr“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht hier dasselbe Verb wie anschließend bei „setzte sich“; je nach Zusammenhang kann es „sitzen“, „bleiben“ oder „wohnen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Die Grundbedeutung von שׁמע ist „hören“. Mit „von dieser Sache hörte“ wird im Deutschen natürlich ausgedrückt, dass der Pharao von dem Vorfall Kenntnis erhielt.
- source_word: הַדָּבָר הַזֶּה
  choice: diese Sache
  rationale: דבר bezeichnet hier den zuvor berichteten Vorfall. „Diese Sache“ bleibt nah am Hebräischen, ohne den Bezug stärker festzulegen als der Ausgangstext.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: versuchte, … zu töten
  rationale: בקש mit Infinitiv bezeichnet hier das Bestreben beziehungsweise den Versuch, eine Handlung auszuführen. Die Formulierung ist in modernem Deutsch klar und gibt mehr als einen bloßen Wunsch wieder.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: floh vor
  rationale: ברח mit מִפְּנֵי bezeichnet die Flucht weg aus dem Macht- oder Gegenwartsbereich einer Person. „Vor dem Pharao fliehen“ ist die natürliche deutsche Entsprechung.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: hielt sich im Land Midian auf
  rationale: ישׁב kann je nach Zusammenhang sitzen, bleiben oder wohnen bedeuten. Hier bezeichnet es Moses’ Aufenthalt in Midian; „hielt sich … auf“ vermeidet eine unnötige Festlegung auf eine sofortige dauerhafte Ansiedlung.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: setzte sich an den Brunnen
  rationale: Beim zweiten Vorkommen hat ישׁב die konkrete Bedeutung „sitzen/sich setzen“. „An den Brunnen“ ist für עַל in diesem räumlichen Zusammenhang idiomatisches Deutsch.
- source_word: הַבְּאֵר
  choice: der Brunnen
  rationale: Der bestimmte Artikel des Hebräischen wird beibehalten.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Gebräuchliche deutsche Form des Herrschertitels.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Namensform.
