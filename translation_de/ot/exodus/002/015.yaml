  naturalness: Der Text ist insgesamt flüssiges modernes Standarddeutsch. „Suchte Mose zu töten“ ist in einem sachlich-biblischen Erzählregister natürlich und präziser als „versuchte er, Mose zu töten“.
  terminology: „Pharao“, „Mose“, „Midian“ und „Brunnen“ sind etablierte deutsche Formen. „Hielt sich im Land Midian auf“ ist als kontextuelle Wiedergabe von יָשַׁב vertretbar; die Fußnote legt die lexikalische Wiederholung transparent offen.
