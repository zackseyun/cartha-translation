  to: Als der Pharao von dieser Sache[a] hörte, suchte er Mose zu töten. Doch Mose floh vor dem Pharao, hielt sich im Land Midian auf[b] und setzte sich an den Brunnen.
  rationale: Die einzige notwendige Änderung ersetzt „versuchte“ durch „suchte“, um die hebräische Aussage nicht auf einen vollzugsnahen Tötungsversuch einzuengen. Die übrigen Formulierungen sind quellennah, idiomatisch und die Fußnoten sind korrekt verankert.
