base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: de
  text: 'Am nächsten Tag ging er hinaus. Da waren zwei hebräische Männer im Streit. Er sagte zu dem, der im Unrecht war[a]: »Warum schlägst du deinen Mitmenschen[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu dem Schuldigen«; wörtlich auch: »zu dem Frevler«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »deinen Nächsten« beziehungsweise »deinen Gefährten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: ging er wieder hinaus
  rationale: Das Qal-Wayyiqtol von יצא führt die Erzählung fort. »Wieder« ist im Deutschen eine natürliche kontextuelle Verdeutlichung, weil Mose bereits am Vortag hinausgegangen war, ohne eine eigenständige lexikalische Bedeutung des Verbs zu behaupten.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Am nächsten Tag
  rationale: Wörtlich »am zweiten Tag«; im fortlaufenden deutschen Erzählzusammenhang gibt »am nächsten Tag« den zeitlichen Bezug idiomatisch wieder.
- source_word: וְהִנֵּה
  choice: Da sah er
  rationale: הִנֵּה signalisiert hier plötzliches Wahrnehmen und eine anschauliche Präsentation. »Da sah er« bewahrt diese narrative Funktion in natürlichem modernem Deutsch.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: zwei hebräische Männer
  rationale: Die Wiedergabe erhält sowohl die ausdrückliche Zahl und Personenbezeichnung als auch die ethnische Zuordnung.
- source_word: נִצִּים
  choice: miteinander kämpften
  rationale: Das Nifal-Partizip bezeichnet einen tätlichen Streit; der folgende Hinweis auf das Schlagen stützt »kämpften« gegenüber einem rein verbalen »stritten«.
- source_word: לָרָשָׁע
  choice: dem, der im Unrecht war
  rationale: רָשָׁע kann einen Frevler oder den Schuldigen beziehungsweise im Unrecht Befindlichen bezeichnen. Im konkreten Streit bezeichnet Mose den Angreifer; die kontextuelle Formulierung vermeidet, vorschnell dessen gesamten Charakter festzulegen.
- source_word: לָמָּה תַכֶּה
  choice: Warum schlägst du
  rationale: Das Imperfekt bezeichnet im Kontext die gegenwärtige beziehungsweise fortgesetzte Handlung. Die deutsche Präsensform ist dafür natürlich und direkt.
- source_word: רֵעֶךָ
  choice: deinen Mitmenschen
  rationale: רֵעַ bezeichnet je nach Zusammenhang den Nächsten, Gefährten oder Mitmenschen. »Mitmensch« bringt hier die Beziehung zwischen den beiden hebräischen Männern verständlich zum Ausdruck, ohne eine besondere Freundschaft vorauszusetzen.
theological_decisions:
- issue: Moralische Einordnung durch לָרָשָׁע
  choice: dem, der im Unrecht war
  alternative: dem Schuldigen / dem Frevler
  rationale: Die Übersetzung bewahrt Moses moralisches Urteil über den Angreifer, deutet das Wort hier aber situationsbezogen. So wird weder die Schuld neutralisiert noch aus dem einzelnen Vorfall unnötig ein abschließendes Charakterurteil gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit lebendiger Erzählführung. »Da sah er« gibt die Wahrnehmungsfunktion von וְהִנֵּה natürlicher wieder als das heute markierte »siehe«. Die direkte Rede bleibt knapp und eindringlich.
