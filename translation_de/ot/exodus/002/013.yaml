revisions:
- from: 'Am nächsten Tag ging er wieder hinaus. Da sah er, wie zwei hebräische Männer miteinander kämpften. Er sagte zu dem, der im Unrecht war[a]: »Warum schlägst du deinen Mitmenschen[b]?«'
  to: 'Am nächsten Tag ging er hinaus. Da waren zwei hebräische Männer im Streit. Er sagte zu dem, der im Unrecht war[a]: »Warum schlägst du deinen Mitmenschen[b]?«'
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext enthaltene Ergänzung »wieder« und ersetzt die körperlich stärker festgelegte Wiedergabe von נִצִּים durch »im Streit waren«. Alle übrigen Formulierungen einschließlich der korrekt verankerten Fußnoten können bestehen bleiben.
