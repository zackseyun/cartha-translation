  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: de
  text: 'Doch er erwiderte: »Wer hat dich zum Anführer und Richter über uns eingesetzt? Willst du mich etwa töten, wie du den Ägypter getötet hast?« Da bekam Mose Angst und sagte: »Die Sache ist also bekannt geworden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: Wer hat dich … eingesetzt?
  rationale: שׂים bezeichnet hier das Einsetzen in eine Autoritätsstellung; „eingesetzt“ gibt die herausfordernde Frage im Deutschen natürlich und präzise wieder.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: zum Anführer und Richter
  rationale: אִישׁ steht appositionell in der Rollenformel und muss im Deutschen nicht eigens mit „Mann“ wiedergegeben werden. שַׂר bezeichnet hier eine leitende Autorität, ohne notwendig den monarchischen Sinn von „Fürst“ zu tragen.
- source_word: עָלֵינוּ
  choice: über uns
  rationale: עַל kennzeichnet hier die beanspruchte Autorität über die Sprecher.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Willst du mich etwa töten
  rationale: Wörtlich steht eine schwierige Verbindung aus Fragepartikel, Infinitiv „mich zu töten“ und אֹמֵר „sagend“. Im Kontext kann אֹמֵר den Vorsatz oder die Absicht bezeichnen; „Willst du … etwa“ bewahrt den vorwurfsvollen Fragesinn in natürlichem Deutsch.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: wie du den Ägypter getötet hast
  rationale: Die Vergleichskonstruktion und die Bestimmtheit von הַמִּצְרִי werden direkt wiedergegeben.
- source_word: וַיִּירָא מֹשֶׁה
  choice: Da bekam Mose Angst
  rationale: Die narrative Verbform schildert Moses unmittelbare Reaktion; „bekam Angst“ ist gegenwärtiges, natürliches Deutsch.
- source_word: וַיֹּאמַר
  choice: und dachte
  rationale: אמר bedeutet grundsätzlich „sagen“, kann aber auch inneres Sprechen bezeichnen. Da kein Adressat genannt ist und der Satz Moses Erkenntnis ausdrückt, ist „dachte“ im Deutschen kontextgerecht.
- source_word: אָכֵן נוֹדַע הַדָּבָר
  choice: Die Sache ist also bekannt geworden
  rationale: אָכֵן markiert hier Moses Schlussfolgerung bzw. bestätigte Erkenntnis; der Nifal von ידע bezeichnet das Bekanntwerden der Sache.
theological_decisions:
- issue: Wiedergabe von לְאִישׁ in der Amtsformel
  choice: keine selbstständige Wiedergabe von אִישׁ; „zum Anführer und Richter“
  alternative: „zu einem Mann, einem Anführer und Richter“
  rationale: אִישׁ ist hier Teil einer appositionellen hebräischen Rollenformel. Eine wörtliche deutsche Wiedergabe mit „Mann“ wäre missverständlich und unnatürlich; sie würde keine zusätzliche theologische Aussage bewahren.
- issue: Bedeutung von אֹמֵר in der Tötungsfrage
  choice: 'als Absicht: „Willst du mich etwa töten“'
  alternative: 'als ausdrückliches Sagen: „Sagst du: ‚Ich werde dich töten‘?“'
  rationale: Die hebräische Konstruktion lässt eine Nähe zwischen „sagen“, „meinen“ und „beabsichtigen“ erkennen. Die gewählte Form gibt den kontextuellen Vorwurf natürlich wieder, ohne aus ihm eine bereits ausgesprochene Drohung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Anführer“ vermeidet den heute leicht monarchisch klingenden Titel „Fürst“; „Richter“ erhält die gerichtliche Funktion. Die direkte Rede wird knapp und mündlich glaubwürdig formuliert.
