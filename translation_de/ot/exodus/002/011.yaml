  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Aussagen des Hebräischen zutreffend wieder: Moses erreicht das Erwachsenenalter, geht zu seinen »Brüdern«, nimmt ihre Lasten wahr und beobachtet einen Ägypter, der einen Hebräer schlägt. »Brüder« bewahrt die wiederholte Verwandtschaftssprache, und »Lasten« lässt die konkrete Fronarbeit ebenso wie die weiter gefasste Bedrängnis offen.'
  naturalness: Die Abfolge mit Doppelpunkt und anschließendem »Da« ist verständlich, trennt jedoch die eng verbundene hebräische Zeit- und Haupthandlung unnötig in zwei Sätze. Ein temporaler Nebensatz bildet den Zusammenhang im modernen Standarddeutsch flüssiger und präziser ab.
  terminology: '»Mose«, »Ägypter«, »Hebräer«, »Lasten« und »Brüder« sind terminologisch stimmig. Die Fußnote sollte nicht behaupten, dass die Formulierung am Versende jeweils wörtlich »Brüder« laute: מֵאֶחָיו bedeutet idiomatisch »einer von seinen Brüdern«. Die Erklärung der wiederholten familiären Sprache bleibt jedoch richtig.'
