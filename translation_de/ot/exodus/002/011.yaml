base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: de
  text: 'Es geschah in jenen Tagen: Als Mose erwachsen geworden war, ging er zu seinen Brüdern[a] hinaus und sah ihre Lasten. Er sah, wie ein Ägypter einen Hebräer schlug, einen seiner Brüder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verwandten« oder »Landsleuten«. Das Hebräische verwendet an beiden Stellen Verwandtschaftssprache und drückt damit Moses Verbundenheit mit den Hebräern aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Es geschah in jenen Tagen
  rationale: Bewahrt die hebräische Erzählformel in würdigem, nicht altertümlichem Deutsch.
- source_word: וַיִּגְדַּל
  choice: war erwachsen geworden
  rationale: Im Zusammenhang bezeichnet das Verb Moses Heranwachsen zur Reife, nicht eine Zunahme an Rang oder Bedeutung.
- source_word: אֶל אֶחָיו
  choice: zu seinen Brüdern
  rationale: Gibt die familiäre Ausdrucksweise des Hebräischen wieder und bewahrt das Motiv von Moses Verbundenheit mit den Hebräern.
- source_word: בְּסִבְלֹתָם
  choice: ihre Lasten
  rationale: Bewahrt das konkrete Bild des Lastentragens und lässt zugleich offen, ob vor allem die Fronarbeit oder umfassender ihr Leiden im Blick ist.
- source_word: אִישׁ מִצְרִי
  choice: ein Ägypter
  rationale: Natürliches modernes Deutsch; die Personenbezeichnung איש muss hier nicht eigens mit »Mann« wiedergegeben werden.
- source_word: מַכֶּה
  choice: schlug
  rationale: Die Konstruktion »sah, wie … schlug« gibt die beobachtete, im Verlauf befindliche körperliche Misshandlung idiomatisch wieder.
- source_word: אִישׁ עִבְרִי
  choice: einen Hebräer
  rationale: Ist im Deutschen die natürliche Entsprechung und wahrt den Gegensatz zum Ägypter.
- source_word: מֵאֶחָיו
  choice: einen seiner Brüder
  rationale: Bewahrt die bewusste Wiederholung der Verwandtschaftssprache und kennzeichnet den Hebräer als einen aus Moses eigenem Volk.
theological_decisions:
- issue: Wiedergabe der Verwandtschaftssprache אֶחָיו / מֵאֶחָיו
  choice: Brüder
  alternative: Verwandte; Landsleute; Angehörige seines Volkes
  rationale: Das Hebräische verwendet ausdrücklich familiäre Sprache, um Moses Solidarität mit den Hebräern auszudrücken. Die Übersetzung bewahrt diese Spannung, während die Fußnote die gemeinte kollektive Zugehörigkeit erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzgliederung bildet den hebräischen Erzählfortgang natürlich ab; die zweimalige Verwandtschaftssprache bleibt bewusst erhalten.
