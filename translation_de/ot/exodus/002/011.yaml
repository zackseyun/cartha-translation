    rationale: Das Hebräische verbindet das Heranwachsen Moses und sein Hinausgehen unmittelbar. »Als Mose erwachsen geworden war, …« ist idiomatischer und wahrt die zeitliche Einordnung klarer.
  - severity: low
    issue: Fußnotenformulierung »hier und am Versende wörtlich ›Brüder‹«
    rationale: Während אֶחָיו direkt »seine Brüder« lautet, ist מֵאֶחָיו wörtlich eher »von seinen Brüdern« und im Kontext »einer seiner Brüder«. Die Fußnote sollte die lexikalische Wiederholung ohne diese Ungenauigkeit beschreiben.
