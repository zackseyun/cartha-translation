base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: de
  text: 'Als sie zu ihrem Vater Reguël kamen, fragte er: »Warum seid ihr heute so schnell zurückgekommen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Als sie kamen
  rationale: Das feminine Pluralverb bezieht sich auf die Töchter. Die temporale Wiedergabe mit »Als« verbindet ihr Eintreffen natürlich mit der anschließenden Frage.
- source_word: אֶל
  choice: zu
  rationale: Die Richtungspräposition wird im Deutschen bei einer Person idiomatisch mit »zu« wiedergegeben.
- source_word: רְעוּאֵל
  choice: Reguël
  rationale: Der hebräische Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben; das Trema kennzeichnet die getrennte Aussprache der Vokale.
- source_word: אֲבִיהֶן
  choice: ihrem Vater
  rationale: אָב mit dem Suffix der 3. Person feminin Plural bezeichnet hier den Vater der Töchter.
- source_word: וַיֹּאמֶר
  choice: fragte er
  rationale: אמר bedeutet wörtlich »sagen«. Da eine direkte Frage folgt, ist »fragte er« im Deutschen die natürliche und inhaltlich genaue Redeeinleitung.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Interrogativadverb fragt unmittelbar nach dem Grund.
- source_word: מִהַרְתֶּן
  choice: seid ihr so schnell
  rationale: Das Piel von מהר bezeichnet Eile oder schnelles Handeln. Zusammen mit בֹּא wird es idiomatisch als schnelles Kommen ausgedrückt.
- source_word: בֹּא
  choice: zurück
  rationale: Der Infinitiv von בוא bedeutet »kommen«. Da die Töchter zu ihrem Vater zurückkehren, gibt »zurück« die im Kontext vorausgesetzte Richtung natürlich wieder.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die bestimmte Form »der Tag« dient hier idiomatisch als Zeitangabe »heute«.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die idiomatische Frage »Warum seid ihr heute so schnell zurück?« bewahrt den Sinn der hebräischen Verbindung »eilen« + »kommen«, ohne im Deutschen schwerfällig zu wirken.
