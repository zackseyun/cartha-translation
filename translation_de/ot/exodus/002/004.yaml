  source_fidelity: 'Die Übersetzung gibt alle Satzglieder des Hebräischen zuverlässig wieder: Die Schwester nimmt bewusst Stellung, bleibt räumlich entfernt und will erfahren, was dem Jungen widerfahren bzw. an ihm getan werden würde. „Was mit ihm geschehen würde“ ist eine idiomatische deutsche Wiedergabe des hebräischen Passivs, ohne den Ausgang vorwegzunehmen.'
