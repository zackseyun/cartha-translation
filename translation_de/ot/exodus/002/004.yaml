  text: וַ/תֵּתַצַּ֥ב אֲחֹת֖/וֹ מֵ/רָחֹ֑ק לְ/דֵעָ֕ה מַה יֵּעָשֶׂ֖ה לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/004.yaml
  text: And his sister stood at a distance[b][a], to know what would be done to him.
translation:
  language: de
  text: Seine Schwester stellte sich in einiger Entfernung auf, um zu erfahren, was mit ihm geschehen würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „um zu wissen, was ihm getan würde“; auch möglich: „was man mit ihm tun würde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: stellte sich … auf
  rationale: Der Hitpael von יצב bezeichnet, dass sie selbst eine feste Beobachtungsposition einnahm. „Stellte sich … auf“ gibt dies im Deutschen natürlich und genauer als das bloße „stand“ wieder.
- source_word: אֲחֹתוֹ
  choice: seine Schwester
  rationale: Die Konstruktion mit Suffix der 3. Person maskulin Singular wird unmittelbar und eindeutig wiedergegeben.
- source_word: מֵרָחֹק
  choice: in einiger Entfernung
  rationale: Die Wendung bezeichnet räumlichen Abstand. Diese Formulierung ist modernes, idiomatisches Deutsch, ohne einen im Hebräischen nicht bestimmten genauen Abstand festzulegen.
- source_word: לְדֵעָה
  choice: um zu erfahren
  rationale: Der Infinitiv von ידע drückt den Zweck aus. Im Kontext meint er nicht einen statischen Wissenszustand, sondern das Abwarten, um Kenntnis vom Ausgang zu erhalten.
- source_word: מַה
  choice: was
  rationale: Das Interrogativpronomen leitet den Inhalt dessen ein, was die Schwester erfahren wollte.
- source_word: יֵּעָשֶׂה
  choice: geschehen würde
  rationale: Der Niphal-Imperfekt von עשה ist formal passiv („getan würde“), kann hier aber idiomatisch das bezeichnen, was mit dem Kind geschehen würde. Die Fußnote bewahrt die formnähere Möglichkeit.
- source_word: לוֹ
  choice: mit ihm
  rationale: In Verbindung mit dem passiven עשה lässt sich ל sowohl als „ihm/an ihm“ als auch idiomatisch im Deutschen mit „mit ihm“ wiedergeben. Letzteres ergibt zusammen mit „geschehen“ eine natürliche Formulierung.
