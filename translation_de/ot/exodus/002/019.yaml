base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: de
  text: 'Sie sagten: „Ein ägyptischer Mann hat uns aus der Gewalt der Hirten gerettet[a] und sogar Wasser für uns geschöpft[b] und die Herde getränkt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus der Hand der Hirten“; gemeint ist ihre Gewalt oder Macht.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt „schöpfte“ durch die Verbindung eines Infinitivs mit einer finiten Verbform desselben Stamms: wörtlich etwa „er schöpfte wirklich für uns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Sie sagten
  rationale: Das Wayyiqtol in der 3. Person feminin Plural führt den Bericht der Töchter ein. Im natürlichen Deutschen kann die Satzverbindung ohne ein ausdrückliches „und“ wiedergegeben werden.
- source_word: אִישׁ מִצְרִי
  choice: ein ägyptischer Mann
  rationale: Die Wiedergabe bewahrt sowohl אִישׁ („Mann“) als auch die Herkunftsbezeichnung מִצְרִי („ägyptisch“).
- source_word: הִצִּילָנוּ
  choice: hat uns … gerettet
  rationale: Der Hiphil von נצל bezeichnet hier die konkrete Rettung aus einer bedrängenden Situation.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die hebräische Wendung bezeichnet Macht oder Gewalt, verwendet dafür aber das anschauliche Bild der Hand, das auch im Deutschen verständlich ist.
- source_word: הָרֹעִים
  choice: der Hirten
  rationale: Das Wort bezeichnet hier die Männer, die Herden hüteten und die Frauen zuvor vertrieben hatten.
- source_word: וְגַם
  choice: Er hat sogar
  rationale: Die Formulierung hebt hervor, dass der Mann über die Rettung hinaus noch mehr für die Frauen tat.
- source_word: דָּלֹה דָלָה
  choice: selbst Wasser … geschöpft
  rationale: Infinitivus absolutus und finites Verb desselben Stammes verstärken die Aussage. „Sogar selbst“ vermittelt im Deutschen, dass er persönlich die unerwartete zusätzliche Arbeit ausführte.
- source_word: לָנוּ
  choice: für uns
  rationale: Der Dativ bezeichnet die Begünstigten der Handlung.
- source_word: וַיַּשְׁקְ
  choice: getränkt
  rationale: Der Hiphil von שקה bedeutet, Menschen oder Tieren zu trinken zu geben; bei einer Herde ist „tränken“ idiomatisch und präzise.
- source_word: אֶת־הַצֹּאן
  choice: die Herde
  rationale: צאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen. „Herde“ wahrt den kollektiven Sinn, ohne die Tierart unnötig festzulegen.
