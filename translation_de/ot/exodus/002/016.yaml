  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die Satzteilung vermeidet eine schwerfällige Reihung. „Tränkrinnen“ und „Herde“ sind allgemein verständlich und bewahren die sachliche Bildwelt des Textes.
