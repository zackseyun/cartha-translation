base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: de
  text: Der Priester von Midian[a] hatte sieben Töchter. Sie kamen, schöpften Wasser[b] und füllten die Tränkrinnen, um die Herde ihres Vaters zu tränken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ein Priester von Midian.“ Das Hebräische kann ihn als den bestimmten Priester von Midian oder als einen Priester von Midian bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „schöpften Wasser“ übersetzte Verb meint, Wasser aus einem Brunnen heraufzuholen.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: Der Priester von Midian
  rationale: Die hebräische Besitzkonstruktion wird im Deutschen natürlich mit „hatte“ wiedergegeben. „Priester von Midian“ bezeichnet seine Verbindung mit der Region; der bestimmte Artikel folgt der im Zusammenhang naheliegenden Identifizierung, während die mögliche unbestimmte Deutung in der Fußnote erhalten bleibt. Das einleitende Waw verlangt hier kein eigenes deutsches Verknüpfungswort.
- source_word: שֶׁבַע בָּנוֹת
  choice: hatte sieben Töchter
  rationale: Die hebräische Nominalkonstruktion „dem Priester … waren sieben Töchter“ wird idiomatisch als Besitz ausgedrückt.
- source_word: וַתָּבֹאנָה
  choice: Sie kamen
  rationale: Die feminine Pluralform nimmt die sieben Töchter auf und setzt die Erzählfolge schlicht fort.
- source_word: וַתִּדְלֶנָה
  choice: schöpften Wasser
  rationale: דלה bezeichnet hier das Heraufholen von Wasser aus einem Brunnen; das im Hebräischen mitgemeinte Objekt wird für klares, natürliches Deutsch ausdrücklich genannt.
- source_word: וַתְּמַלֶּאנָה אֶת הָרְהָטִים
  choice: füllten die Tränkrinnen
  rationale: רְהָטִים bezeichnet zum Tränken dienende Behälter oder Rinnen. „Tränkrinnen“ ist konkret, verständlich und lässt die genaue Bauform offen.
- source_word: לְהַשְׁקוֹת צֹאן אֲבִיהֶן
  choice: um die Herde ihres Vaters zu tränken
  rationale: Der Hifil-Infinitiv von שקה drückt den Zweck aus, Tiere trinken zu lassen. צֹאן ist eine Sammelbezeichnung für Kleinvieh, besonders Schafe und Ziegen; „Herde“ ist die natürliche deutsche Entsprechung.
