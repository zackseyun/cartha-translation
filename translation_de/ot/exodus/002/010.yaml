id: EXO.2.10
reference: Exodus 2:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: de
  text: 'Als das Kind größer geworden war, brachte sie es zur Tochter des Pharaos. Es wurde ihr Sohn.[a] Sie gab ihm den Namen Mose, denn sie sagte: »Ich habe ihn aus dem Wasser gezogen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Er wurde für sie zu einem Sohn« oder »Er war ihr wie ein Sohn.«'
    reason: lexical_alternative
  - marker: b
    text: Der Name Mose klingt im Hebräischen an den Ausdruck »ich habe ihn herausgezogen« an.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: größer geworden war
  rationale: גדל bezeichnet hier das Heranwachsen des Kindes. Die Formulierung gibt die zeitliche Entwicklung natürlich wieder, ohne zu behaupten, Mose sei bereits erwachsen gewesen.
- source_word: הַיֶּלֶד
  choice: das Kind
  rationale: יֶלֶד kann »Kind« oder »Junge« bedeuten. »Das Kind« passt zum vorausgehenden Säuglingskontext und bewahrt den weiteren Bedeutungsumfang.
- source_word: וַתְּבִאֵהוּ
  choice: brachte sie es
  rationale: Der Hifil von בוא bedeutet gewöhnlich »bringen«. Das Subjekt ist Moses Mutter aus dem vorausgehenden Zusammenhang.
- source_word: לְבַת פַּרְעֹה
  choice: zur Tochter des Pharaos
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung klar und würdig wieder.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: Es wurde ihr Sohn
  rationale: Die hebräische Wendung bezeichnet eine wirkliche Sohnschaftsbeziehung, ohne ein bestimmtes rechtliches Adoptionsverfahren zu schildern.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Sie gab ihm den Namen
  rationale: Die hebräische Benennungsformel wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Verwendet wird die im Deutschen etablierte Namensform.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung der Namensgebung ein.
- source_word: מִן הַמַּיִם
  choice: aus dem Wasser
  rationale: Die Formulierung entspricht der Rettungssituation und gibt die Präposition מן idiomatisch wieder.
- source_word: מְשִׁיתִהוּ
  choice: Ich habe ihn … gezogen
  rationale: Die Übersetzung gibt das Herausziehen aus dem Wasser wieder und hält die im Hebräischen hörbare Verbindung zum Namen Mose soweit im Deutschen erklärbar offen.
theological_decisions:
- issue: Art der Beziehung zwischen Mose und der Tochter des Pharaos in וַיְהִי לָהּ לְבֵן
  choice: Mose wurde ihr Sohn.
  alternative: Mose wurde ihr wie ein Sohn beziehungsweise wurde für sie zu einem Sohn.
  rationale: Der Wortlaut stellt eine echte Sohnschaftsbeziehung her, legt aber weder ein formelles Adoptionsverfahren noch dessen rechtliche Einzelheiten fest. Die Fußnote bewahrt diese mögliche Abstufung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die neutrale Rückverweisung »es« folgt dem grammatischen Geschlecht von »das Kind«; bei der Namensgebung wechselt der Text natürlich zum männlichen Pronomen »ihm«. Die hebräische Namensdeutung wird im Haupttext nicht künstlich im Deutschen nachgebildet, sondern in der Fußnote erläutert.
