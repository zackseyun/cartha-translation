  terminology: »Tochter des Pharaos«, »Mose« und »Sohn« entsprechen dem üblichen deutschen Bibelgebrauch und dem hebräischen Wortlaut. Die Formulierung vermeidet zu Recht die überpräzise Behauptung eines formalen Adoptionsakts.
