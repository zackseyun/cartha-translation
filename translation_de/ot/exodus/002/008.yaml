base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/008.yaml
  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: de
  text: 'Die Tochter des Pharaos sagte zu ihr: »Geh!« Da ging die junge Frau und rief die Mutter des Kindes herbei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: die Tochter des Pharaos
  rationale: Die deutsche Genitivverbindung gibt die hebräische Konstruktverbindung genau und natürlich wieder.
- source_word: לֵכִי
  choice: Geh!
  rationale: Der knappe feminine Singularimperativ wird im Deutschen ebenso knapp und unmittelbar wiedergegeben.
- source_word: הָעַלְמָה
  choice: die junge Frau
  rationale: עַלְמָה bezeichnet eine junge Frau beziehungsweise ein Mädchen im heiratsfähigen Alter. »Junge Frau« bewahrt den lexikalischen Spielraum besser als das stärker altersfestlegende »Mädchen« und vermeidet das altertümliche »Jungfrau«.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: rief die Mutter des Kindes herbei
  rationale: קרא mit direktem Objekt bedeutet hier, jemanden zu rufen beziehungsweise herbeizurufen. »Herbeirufen« macht den gemeinten Vorgang im Deutschen eindeutig, ohne den Erzählfluss auszubauen.
- source_word: הַיָּלֶד
  choice: des Kindes
  rationale: יֶלֶד wird kontextgerecht als »Kind« wiedergegeben; der Vers selbst muss das Geschlecht oder Säuglingsalter nicht erneut ausdrücklich benennen.
