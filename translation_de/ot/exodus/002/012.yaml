  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: de
  text: Er blickte sich nach beiden Seiten um, und als er sah, dass niemand da war[a], erschlug er den Ägypter und verbarg ihn im Sand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass kein Mann da war“. Das hebräische אִישׁ kann hier allgemein das Fehlen irgendeiner Person bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: Er blickte sich nach beiden Seiten um
  rationale: פנה bedeutet wörtlich „sich wenden“; zusammen mit כֹּה וָכֹה beschreibt die Wendung ein prüfendes Umschauen in verschiedene Richtungen. Die gewählte Formulierung gibt das hebräische Idiom natürlich und anschaulich wieder.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: als er sah, dass niemand da war
  rationale: אִישׁ heißt wörtlich „Mann“, kann in dieser negierten Existenzformel aber generisch für das Fehlen irgendeiner Person stehen. „Niemand“ ist im Deutschen die natürliche kontextuelle Wiedergabe; die wörtliche Form bleibt in der Fußnote erhalten.
- source_word: וַיַּךְ
  choice: erschlug er
  rationale: נכה bezeichnet das Schlagen oder Niederschlagen. Der unmittelbare Kontext setzt den Tod des Ägypters voraus; „erschlug“ verbindet den Schlag mit seinem tödlichen Ausgang, ohne die Handlung unnötig auszumalen.
- source_word: הַמִּצְרִי
  choice: den Ägypter
  rationale: Die bestimmte ethnische beziehungsweise nationale Bezeichnung wird direkt und ohne Erweiterung wiedergegeben.
- source_word: וַיִּטְמְנֵהוּ
  choice: verbarg ihn
  rationale: טמן bedeutet „verbergen, verstecken“. Dass Mose den Leichnam dabei mit Sand bedeckte, ergibt sich aus der folgenden Ortsangabe; „verbarg“ bewahrt den lexikalischen Schwerpunkt.
- source_word: בַּחוֹל
  choice: im Sand
  rationale: חוֹל bedeutet „Sand“; Präposition und Artikel werden idiomatisch mit „im“ wiedergegeben.
