base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: de
  text: Gott hörte ihr Stöhnen[a], und Gott gedachte[b] seines Bundes mit Abraham, mit Isaak und mit Jakob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Aufschrei“. Das hebräische Substantiv kann ein Stöhnen oder einen qualvollen Aufschrei unter Bedrückung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Gedachte“ ist Bundessprache. Es bedeutet nicht, dass Gott den Bund vergessen hatte, sondern weist darauf hin, dass er sich ihm in Treue zuwandte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Das Verb שׁמע bedeutet hier in der erzählenden Form am natürlichsten „hören“; im Mittelpunkt steht, dass Gott den Notlaut Israels wahrnimmt.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Obwohl die Form morphologisch plural ist, steht sie hier mit singularischen Verben und bezeichnet eindeutig den einen Gott.
- source_word: נַאֲקָתָם
  choice: ihr Stöhnen
  rationale: נַאֲקָה bezeichnet ein Stöhnen oder einen qualvollen Aufschrei unter Bedrückung. „Ihr Stöhnen“ gibt die kollektive Not natürlich wieder, ohne einen förmlichen Klagegesang anzudeuten.
- source_word: וַיִּזְכֹּר
  choice: gedachte
  rationale: „Gedachte“ bewahrt den schlichten Sinn von זכר und zugleich den würdevollen, im Deutschen geläufigen Klang der Bundessprache. Die daraus folgende Zuwendung Gottes wird nicht interpretierend in den Haupttext eingefügt.
- source_word: בְּרִיתוֹ
  choice: seines Bundes
  rationale: בְּרִית ist der übliche Ausdruck für „Bund“; das Suffix bezeichnet ihn als Gottes Bund.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: mit Abraham, mit Isaak und mit Jakob
  rationale: Die Präposition „mit“ wird im Deutschen nach „Bund“ sinnvoll ergänzt und wiederholt, um etwas von Nachdruck und Rhythmus des Hebräischen zu erhalten.
theological_decisions:
- issue: Anthropomorphe Bundessprache in „Gott gedachte“
  choice: Die Formulierung „Gott gedachte seines Bundes“ bleibt im Haupttext ohne erklärende Umschreibung stehen.
  alternative: „Gott erinnerte sich an seinen Bund“ oder „Gott handelte seinem Bund entsprechend“
  rationale: Der hebräische Text verwendet gewöhnliche anthropomorphe Bundessprache. „Handelte“ würde die Folgerung bereits auslegen; „gedachte“ bewahrt die Spannung, während die Fußnote klarstellt, dass keine vorherige Vergesslichkeit Gottes gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Stöhnen“ ist unmittelbar verständlich; „gedachte seines Bundes“ ist leicht gehoben, aber in biblischer Bundessprache natürlich und bewahrt die Nähe zur hebräischen Formulierung. Die dreifache Wiederholung von „mit“ erhält den feierlichen Rhythmus.
