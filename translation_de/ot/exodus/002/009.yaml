  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen hebräischen Ausdrücke zuverlässig wieder: Die Tochter des Pharaos beauftragt die Frau, das Kind mitzunehmen und für sie zu stillen, und sagt ihr Lohn zu. »Die Frau« wahrt die im Hebräischen verwendete, nicht weiter spezifizierte Bezeichnung. Das deutsche Neutrum in »stille es« folgt natürlich dem grammatischen Geschlecht von »Kind«, ohne die im hebräischen Kontext vorhandene männliche Referenz zu leugnen.'
  naturalness: Modernes Standarddeutsch mit angemessen knappem, würdigem Erzählton. »Nimm dieses Kind mit« und »ich werde dir deinen Lohn geben« sind idiomatisch; die Wiederholung von »Da« bildet die erzählende Satzfolge klar ab.
  terminology: »Tochter des Pharaos«, »Kind«, »stillen« und »Lohn« sind präzise und registergerecht. »Stillen« ist gegenüber einer allgemeinen Pflegehandlung die sachlich zutreffende Wiedergabe des Hifil von ינק.
