  text: וַ/תֹּ֧אמֶר לָ֣/הּ בַּת פַּרְעֹ֗ה הֵילִ֜יכִי אֶת הַ/יֶּ֤לֶד הַ/זֶּה֙ וְ/הֵינִקִ֣/הוּ לִ֔/י וַ/אֲנִ֖י אֶתֵּ֣ן אֶת שְׂכָרֵ֑/ךְ וַ/תִּקַּ֧ח הָ/אִשָּׁ֛ה הַ/יֶּ֖לֶד וַ/תְּנִיקֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: de
  text: 'Da sagte die Tochter des Pharaos zu ihr: »Nimm dieses Kind mit und stille es für mich; ich werde dir deinen Lohn geben.« Da nahm die Frau das Kind und stillte es.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: die Tochter des Pharaos
  rationale: Die deutsche Genitivkonstruktion gibt die hebräische Status-constructus-Verbindung natürlich und genau wieder.
- source_word: הֵילִיכִי
  choice: Nimm … mit
  rationale: Der Hifil-Imperativ von הלך bezeichnet hier idiomatisch das Mitnehmen beziehungsweise Wegbringen des Kindes. »Nimm … mit« ist im Deutschen klar und lässt die Bewegungsrichtung kontextgemäß offen.
- source_word: הַיֶּלֶד הַזֶּה
  choice: dieses Kind
  rationale: יֶלֶד kann Kind oder Junge bezeichnen. »Dieses Kind« bleibt nahe am Wortlaut und vermeidet eine unnötige Spezifizierung.
- source_word: וְהֵינִקִהוּ לִי
  choice: und stille es für mich
  rationale: Das Verb ינק im Hifil bezeichnet das Stillen eines Säuglings. »Für mich« bewahrt לִי und macht deutlich, dass die Frau im Auftrag der Pharaonentochter handelt.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: ich werde dir deinen Lohn geben
  rationale: שָׂכָר bezeichnet Lohn oder Entgelt. Die Formulierung folgt der hebräischen Aussage eng und ist zugleich idiomatisches Deutsch.
- source_word: הָאִשָּׁה
  choice: die Frau
  rationale: Der Vers nennt sie ausdrücklich »die Frau«, nicht »die Mutter«. Die Übersetzung wahrt diese Bezeichnung, obwohl ihre Identität aus dem Zusammenhang bekannt ist.
- source_word: וַתְּנִיקֵהוּ
  choice: und stillte es
  rationale: Die Wiedergabe entspricht dem zuvor verwendeten Verb und bezeichnet präzise das Stillen des Kindes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Neutrumpronomen »es« bezieht sich grammatisch auf »das Kind« und gibt keine Aussage über das Geschlecht auf. Die direkte Rede bleibt knapp und dem hebräischen Satzbau nah, ohne im Deutschen unnatürlich zu wirken.
