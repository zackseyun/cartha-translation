  text: וַ/יָּבֹ֥אוּ הָ/רֹעִ֖ים וַ/יְגָרְשׁ֑וּ/ם וַ/יָּ֤קָם מֹשֶׁה֙ וַ/יּ֣וֹשִׁעָ֔/ן וַ/יַּ֖שְׁקְ אֶת צֹאנָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/017.yaml
  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: de
  text: Da kamen die Hirten und vertrieben sie. Doch Mose stand auf, rettete sie[a] und tränkte ihre Herde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: befreite sie. Das hebräische Verb kann Rettung oder Befreiung bezeichnen; hier geht es darum, dass Mose die Frauen aus der Bedrängung durch die Hirten befreite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da kamen“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: הָרֹעִים
  choice: die Hirten
  rationale: Das substantivisch gebrauchte Partizip von רעה bezeichnet Menschen, die eine Herde hüten. „Hirten“ ist im Zusammenhang die naheliegende deutsche Entsprechung.
- source_word: וַיְגָרְשׁוּם
  choice: vertrieben sie
  rationale: גרש bezeichnet ein gewaltsames Wegtreiben oder Vertreiben. Die knappe Formulierung wahrt die feindselige Handlung der Hirten.
- source_word: וַיָּקָם
  choice: stand auf
  rationale: קום schildert Moses entschlossenes Aufstehen und Eingreifen; „stand auf“ bewahrt das konkrete Bild und klingt zugleich natürlich.
- source_word: וַיּוֹשִׁעָן
  choice: rettete sie
  rationale: Der Hifil von ישׁע bedeutet retten oder befreien. „Rettete“ erhält die Stärke des hebräischen Verbs, ohne im Kontext zwingend Lebensgefahr vorauszusetzen.
- source_word: וַיַּשְׁקְ
  choice: tränkte
  rationale: שקה bedeutet Wasser geben. Bei Tieren ist „tränkte“ die präzise und idiomatische deutsche Wiedergabe.
- source_word: צֹאנָם
  choice: ihre Herde
  rationale: צאן ist eine Sammelbezeichnung für Kleinvieh, häufig Schafe und Ziegen. „Herde“ bewahrt den kollektiven Sinn, ohne die Tierart unnötig einzugrenzen.
theological_decisions:
- issue: Bedeutungsstärke von ישׁע in Moses Eingreifen
  choice: rettete sie
  alternative: half ihnen / befreite sie
  rationale: „Rettete“ bildet den starken Rettungs- oder Befreiungssinn des Verbs ab. Der unmittelbare Zusammenhang bestimmt die Rettung als Befreiung von der Bedrängung durch die Hirten, ohne eine weitergehende theologische Bedeutung auszuschließen oder aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Folge. „Doch“ hebt Moses Eingreifen als Gegensatz zum Verhalten der Hirten hervor; „tränkte ihre Herde“ ist natürlich und sachlich präzise.
