  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: de
  text: Da ging die Tochter des Pharaos hinunter, um im Nil zu baden, während ihre jungen Frauen am Ufer des Nils entlanggingen. Sie sah den Korb[a] mitten im Schilf und schickte ihre Dienerin[b] aus und nahm ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit »Korb« übersetzte hebräische Wort bezeichnet in 1. Mose 6–9 auch Noahs »Arche«.
    reason: cross_reference
  - marker: b
    text: 'Hebräisch: »ihre Dienerin«. Eine traditionelle alternative Deutung versteht: »ihren Arm«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: Da ging ... hinunter
  rationale: Bewahrt die Richtungsangabe von ירד und führt die Erzählung in natürlichem Deutsch fort.
- source_word: בַּת פַּרְעֹה
  choice: die Tochter des Pharaos
  rationale: Entspricht der hebräischen Status-constructus-Verbindung und ist im Deutschen idiomatisch.
- source_word: לִרְחֹץ עַל הַיְאֹר
  choice: um im Nil zu baden
  rationale: רחץ bezeichnet hier passend das Baden; bei einem Gewässer wird die lokative Präposition על im Deutschen natürlich mit „im“ wiedergegeben.
- source_word: וְנַעֲרֹתֶיהָ הֹלְכֹת
  choice: während ihre jungen Frauen ... entlanggingen
  rationale: „Junge Frauen“ gibt Alter und Geschlecht von נערות wieder; der Partizipialsatz bezeichnet eine begleitende, andauernde Handlung.
- source_word: עַל יַד הַיְאֹר
  choice: am Ufer des Nils entlang
  rationale: Die Wendung עַל יַד bedeutet räumlich „neben/an“; im Kontext bildet das Ufer die natürliche Gehstrecke.
- source_word: הַתֵּבָה
  choice: der Korb
  rationale: Im unmittelbaren Kontext bezeichnet תבה das kleine Behältnis für das Kind. Die Wortgleichheit mit Noahs Arche wird in einer Fußnote erhalten.
- source_word: בְּתוֹךְ הַסּוּף
  choice: mitten im Schilf
  rationale: Gibt sowohl בְּתוֹךְ als auch סוּף knapp und anschaulich wieder.
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ
  choice: und schickte ihre Dienerin
  rationale: Die masoretische Lesung אֲמָתָהּ bezeichnet ihre Dienerin und passt als direktes Objekt zu „schicken“.
- source_word: וַתִּקָּחֶהָ
  choice: die ihn holte
  rationale: Formal kann das Verb „und sie nahm ihn“ bedeuten; im deutschen Satz ist der Bezug auf die ausgesandte Dienerin durch „holte“ natürlich und kontextgerecht wiedergegeben.
theological_decisions:
- issue: Wiedergabe von תבה im Mosebericht
  choice: Korb
  alternative: Arche
  rationale: „Korb“ bezeichnet den Gegenstand in dieser Szene verständlich, ohne die bewusste lexikalische Verbindung zur Noaherzählung zu verschweigen; diese wird in Fußnote [a] genannt.
- issue: Mehrdeutige beziehungsweise traditionelle Deutung von אֲמָתָהּ
  choice: ihre Dienerin
  alternative: ihren Arm
  rationale: Die masoretische Vokalisierung und die Konstruktion mit שׁלח stützen „ihre Dienerin“. Die traditionelle alternative Deutung „ihren Arm“ bleibt in Fußnote [b] sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Ereignisfolge und die begleitende Partizipialhandlung werden natürlich abgebildet; echte lexikalische Verbindungen und die traditionelle Alternativlesart stehen in den Fußnoten.
