revisions:
- from: Da ging die Tochter des Pharaos hinunter, um im Nil zu baden, während ihre jungen Frauen am Ufer des Nils entlanggingen. Sie sah den Korb[a] mitten im Schilf und schickte ihre Dienerin[b], die ihn holte.
  to: Da ging die Tochter des Pharaos hinunter, um im Nil zu baden, während ihre jungen Frauen am Ufer des Nils entlanggingen. Sie sah den Korb[a] mitten im Schilf und schickte ihre Dienerin[b] aus und nahm ihn.
  rationale: Die Revision beschränkt sich auf den Satzschluss und die Präzisierung der Alternativanmerkung. „Schickte ihre Dienerin aus und nahm ihn“ erhält die im hebräischen Text vorliegende Subjektkontinuität der Tochter des Pharaos, ohne den wahrscheinlich praktischen Beitrag der Dienerin auszuschließen oder in den Text einzutragen. Die Fußnote bewahrt die traditionelle Arm-Deutung, unterscheidet sie aber von der Bedeutung der masoretisch vokalisierten Form.
