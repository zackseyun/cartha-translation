  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Begriffe und den Handlungsrahmen zuverlässig wieder. Die Schlussformulierung „die ihn holte“ verschiebt jedoch das Subjekt von וַתִּקָּחֶהָ: Im hebräischen Satz ist weiterhin die Tochter des Pharaos Subjekt („und sie nahm ihn“), nicht ausdrücklich die Dienerin.'
  naturalness: Der Text ist modernes, flüssiges Standarddeutsch. Die koordinierte Formulierung „schickte ihre Dienerin aus und nahm ihn“ ist etwas dichter als eine explizierende Umschreibung, bewahrt aber die hebräische Satzführung und ist gut verständlich.
  terminology: „Tochter des Pharaos“, „Nil“, „junge Frauen“, „Korb“, „Schilf“ und „Dienerin“ sind treffend. Die Fußnote zu תֵּבָה bewahrt angemessen die Verbindung zur Noaherzählung. Die alternative traditionelle Deutung von אֲמָתָהּ als „Arm“ soll als Auslegung bzw. alternative Lesart, nicht als unmittelbare Bedeutung der masoretischen Vokalisierung, bezeichnet werden.
  issues:
  - severity: medium
    issue: Subjektverschiebung in „die ihn holte“
    rationale: Das Relativpronomen macht die Dienerin zur ausdrücklich handelnden Person beim Holen. Das hebräische וַתִּקָּחֶהָ steht dagegen in derselben Erzählkette mit der Tochter des Pharaos als Subjekt. Eine deutsche Koordination wahrt dies, ohne den praktischen Ablauf unnötig zu erläutern.
  - severity: low
    issue: Fußnote [b] formuliert die Arm-Deutung als Übersetzungsalternative
    rationale: Die vokalisierte hebräische Form bedeutet „ihre Dienerin“. „Ihren Arm“ ist eine alte bzw. traditionelle alternative Deutung/Lesart und sollte entsprechend genauer gekennzeichnet werden.
