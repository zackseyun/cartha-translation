base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/006.yaml
  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: de
  text: 'Sie öffnete es und sah das Kind. Da weinte ein Junge. Sie hatte Mitleid mit ihm und sagte: »Das ist eines der Kinder der Hebräer.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Sie öffnete ihn
  rationale: Das Objekt ist im Hebräischen nicht ausdrücklich genannt, ergibt sich aber aus dem Kontext als der zuvor erwähnte Kasten; das maskuline Pronomen entspricht dem deutschen Genus von »Kasten«.
- source_word: וַתִּרְאֵהוּ אֶת־הַיֶּלֶד
  choice: und sah das Kind
  rationale: Das maskuline Suffix wird durch die unmittelbar folgende Apposition »das Kind« bestimmt. Im Deutschen gibt die zusammengezogene Wiedergabe den Sinn natürlich und vollständig wieder.
- source_word: וְהִנֵּה
  choice: 'Da sah sie:'
  rationale: Die aufmerksamkeitslenkende Partikel markiert anschaulich, was sich ihrem Blick unerwartet zeigt. Diese Formulierung bewahrt die Lebendigkeit ohne das im heutigen Deutsch altertümliche »siehe«.
- source_word: נַעַר
  choice: ein kleiner Junge
  rationale: נַעַר bezeichnet hier den männlichen Säugling, nicht einen Jugendlichen. »Kleiner Junge« macht Geschlecht und junges Alter im Kontext natürlich deutlich.
- source_word: בֹּכֶה
  choice: weinte
  rationale: Das Partizip beschreibt den beim Öffnen andauernden Vorgang; im deutschen Erzählstil bringt das Präteritum dies idiomatisch zum Ausdruck.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Sie hatte Mitleid mit ihm
  rationale: חמל mit עַל bezeichnet hier mitleidige Anteilnahme. Die Wendung ist im modernen Deutsch natürlich und legt die spätere Schonung nicht bereits als Wortbedeutung fest.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: eines von den Kindern der Hebräer
  rationale: 'Die מן-Konstruktion ist partitiv: Das Kind wird als eines aus der Gruppe der hebräischen Kinder erkannt.'
- source_word: הָעִבְרִים
  choice: der Hebräer
  rationale: Dies ist die geläufige ethnische Bezeichnung und entspricht dem Plural im Ausgangstext.
- source_word: זֶה
  choice: Das ist
  rationale: Das Demonstrativpronomen weist auf das vor ihr liegende Kind; »Das ist« ist in deutscher direkter Rede idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lebendige Funktion von וְהִנֵּה wird idiomatisch statt mit dem heute feierlich-altertümlichen »siehe« wiedergegeben. Keine konfessionellen oder interpretierenden Zusätze.
