  text: וְ/לֹא יָכְלָ֣ה עוֹד֮ הַצְּפִינ/וֹ֒ וַ/תִּֽקַּֽח ל/וֹ֙ תֵּ֣בַת גֹּ֔מֶא וַ/תַּחְמְרָ֥/ה בַ/חֵמָ֖ר וּ/בַ/זָּ֑פֶת וַ/תָּ֤שֶׂם בָּ/הּ֙ אֶת הַ/יֶּ֔לֶד וַ/תָּ֥שֶׂם בַּ/סּ֖וּף עַל שְׂפַ֥ת הַ/יְאֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: de
  text: Als sie ihn aber nicht länger verbergen konnte, nahm sie für ihn einen Korb aus Papyrus[a] und bestrich ihn mit Bitumen und Pech. Dann legte sie das Kind hinein und legte den Korb ins Schilf am Ufer des Nils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Arche aus Papyrus“. Das hebräische Wort teba ist dasselbe Wort, das in Genesis für Noahs Arche gebraucht wird. So entsteht ein literarischer Anklang an Rettung durch das Wasser.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: ihn verbergen
  rationale: Der Hifil-Infinitiv von צפן mit Suffix der 3. Person Singular maskulin bezeichnet das Verbergen des Kindes. „Ihn verbergen“ ist präzise und in modernem Deutsch natürlich.
- source_word: תֵּבַת גֹּמֶא
  choice: einen Korb aus Papyrus
  rationale: תֵּבָה bezeichnet einen kasten- oder korbartigen Behälter, גֹּמֶא Papyrus. „Korb aus Papyrus“ passt zur kleinen schwimmfähigen Aufnahme für das Kind; die bedeutsame Wortverbindung zu Noahs Arche wird in der Fußnote bewahrt.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: bestrich ihn mit Asphalt
  rationale: Das Verb bezeichnet hier das Bestreichen oder Abdichten, חֵמָר natürlichen Asphalt beziehungsweise Bitumen. „Mit Asphalt bestreichen“ ist sachlich genau und gut verständlich.
- source_word: וּבַזָּפֶת
  choice: und Pech
  rationale: זֶפֶת bezeichnet Pech als Abdichtungsmaterial. Die knappe Wiedergabe erhält die Unterscheidung von חֵמָר und זֶפֶת.
- source_word: הַיֶּלֶד
  choice: das Kind
  rationale: יֶלֶד kann Kind oder Junge bedeuten. „Das Kind“ gibt den Ausdruck wieder, ohne das bereits aus dem Kontext bekannte Geschlecht nochmals hervorzuheben.
- source_word: בַּסּוּף
  choice: ins Schilf
  rationale: סוּף bezeichnet Schilf- oder Riedvegetation. „Ins Schilf“ vermittelt idiomatisch die Platzierung innerhalb dieser Vegetation.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: am Ufer des Nils
  rationale: יְאֹר bezeichnet im ägyptischen Kontext des Exodus den Nil; שָׂפָה ist hier dessen Rand oder Ufer.
- source_word: לֹא יָכְלָה עוֹד
  choice: nicht länger … konnte
  rationale: Die Wendung bezeichnet eine nun erreichte Grenze des Könnens. Die deutsche Formulierung ist knapp und idiomatisch.
- source_word: לּוֹ
  choice: für ihn
  rationale: Der Dativbezug wird ausdrücklich beibehalten und zeigt, dass der Behälter für das Kind bestimmt war.
- source_word: וַתָּשֶׂם בַּסּוּף
  choice: stellte den Korb ins Schilf
  rationale: Das Objekt ist im Hebräischen aus dem Zusammenhang zu ergänzen. Die ausdrückliche Nennung des Korbes vermeidet im Deutschen eine mögliche Verwechslung mit dem Kind.
theological_decisions:
- issue: Literarische Verbindung zwischen Moses Behälter und Noahs Arche
  choice: Im Haupttext „Korb“, mit Fußnote zur möglichen Wiedergabe „Arche“
  alternative: Im Haupttext „Arche aus Papyrus“
  rationale: Dasselbe seltene hebräische Wort תֵּבָה steht in Genesis für Noahs Arche und hier für den Behälter des Mose. „Korb“ beschreibt die konkrete Form im Deutschen verständlicher, während die Fußnote den literarischen Nachhall einer Rettung durch das Wasser sichtbar hält, ohne ihn dem Haupttext aufzuzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Konkrete Materialien und Ortsangaben werden präzise benannt; unnötig altertümliche Wörter werden vermieden.
