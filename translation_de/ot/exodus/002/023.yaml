  source_fidelity: 'Die Übersetzung gibt die hebräische Erzählabfolge und die wesentlichen Bedeutungen zuverlässig wieder: der ausgedehnte Zeitraum, der Tod des ägyptischen Königs, das Stöhnen und Schreien Israels unter der auferlegten Arbeit sowie das Aufsteigen ihres Hilfeschreis zu Gott. „In jener langen Zeit“ bewahrt die nicht abschließend festgelegte Zeitrelation; die Fußnote nennt die mögliche, stärker kontextualisierende Lesart „nach langer Zeit“. Die Wiederholung von „Sklavenarbeit“ bildet die Wiederholung von מִן־הָעֲבֹדָה angemessen nach.'
