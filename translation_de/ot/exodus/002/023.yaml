  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: de
  text: 'Und es geschah in jener langen Zeit: Der König von Ägypten starb.[a] Die Israeliten[b] seufzten unter der Sklavenarbeit[c] und schrien. Ihr Hilfeschrei stieg wegen der Sklavenarbeit zu Gott empor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Während jener langen Zeit“; deutender auch: „Nach langer Zeit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne Israels“; gemeint ist das Volk Israel insgesamt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „unter dem Frondienst“. Das hebräische Wort bezeichnet hier die bedrückende Zwangsarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die narrative Fortführung mit וַ wird sichtbar gehalten; „es geschah“ ist würdevoll und im Deutschen verständlich, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: בַיָּמִים הָרַבִּים הָהֵם
  choice: in jener langen Zeit
  rationale: Die Formulierung gibt den ausgedehnten Zeitraum natürlich wieder und vermeidet die interpretierende Festlegung auf „nach langer Zeit“.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: Der König von Ägypten starb
  rationale: Direkte und genaue Wiedergabe der erzählenden Aussage.
- source_word: וַיֵּאָנְחוּ
  choice: seufzten
  rationale: Das Verb bezeichnet den hörbaren Ausdruck von Bedrängnis; „seufzten“ ist im Deutschen natürlich und gewichtig.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung meint hier das Volk Israel insgesamt. „Israeliten“ ist im modernen Deutschen natürlicher als das missverständliche wörtliche „Söhne Israels“; die Form des Hebräischen wird in einer Fußnote erläutert.
- source_word: מִן הָעֲבֹדָה
  choice: unter der Sklavenarbeit / wegen der Sklavenarbeit
  rationale: עֲבֹדָה bezeichnet im Kontext die aufgezwungene, bedrückende Arbeit. „Sklavenarbeit“ bewahrt sowohl den Arbeitsaspekt als auch den Zwang; die unterschiedlichen Präpositionen ergeben in den beiden deutschen Satzverbindungen jeweils natürlichen Sinn.
- source_word: וַיִּזְעָקוּ
  choice: und schrien
  rationale: Das Verb bezeichnet einen starken Notschrei; das Fehlen eines ausdrücklichen Objekts bleibt gewahrt.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: Ihr Hilfeschrei stieg ... empor
  rationale: „Hilfeschrei“ erfasst שַׁוְעָה als Schrei um Hilfe, während „stieg empor“ das räumliche Bild des Hebräischen bewahrt.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Idiomatiche und genaue deutsche Wiedergabe ohne interpretierende Erweiterung.
theological_decisions:
- issue: Bedeutung von עֲבֹדָה unter der ägyptischen Unterdrückung
  choice: Sklavenarbeit
  alternative: Arbeit; Frondienst; Knechtschaft
  rationale: Der Kontext spricht von erzwungener Arbeit in einem Unterdrückungsverhältnis. „Sklavenarbeit“ vermittelt die soziale Härte, ohne den lexikalischen Arbeitsbezug aufzugeben.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels; die Kinder Israels
  rationale: Die Wendung ist hier eine kollektive Volksbezeichnung. Das moderne deutsche Ethnonym gibt den Referenten eindeutig wieder; eine Fußnote bewahrt die Transparenz zur wörtlichen Form.
- issue: Adressat des ersten Schreiens
  choice: „schrien“ ohne ergänzten Adressaten
  alternative: schrien zu Gott; schrien um Hilfe
  rationale: Erst beim Hilfeschrei nennt der Text ausdrücklich Gott als Ziel. Die Übersetzung fügt beim vorangehenden Verb keinen Adressaten ein und wahrt so die Spannung der Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bilden die hebräische Erzählfolge lesbar ab. Die Wiederholung von „Sklavenarbeit“ bewahrt die Rahmung des Verses; Doppelpunkt und Satzgrenze vermeiden eine schwerfällige deutsche Kettung.
