  yaml_path: translation/ot/exodus/002/021.yaml
  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: de
  text: Mose erklärte sich bereit, bei dem Mann zu wohnen.[a] Und der Mann gab Mose seine Tochter Zippora.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mose willigte ein, bei dem Mann zu wohnen.“ Das hebräische Verb kann Bereitschaft, Zustimmung oder Einwilligung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Und er gab Mose seine Tochter Zippora.“ Gemeint ist, dass er sie Mose zur Frau gab.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: erklärte sich bereit
  rationale: Das Verb יאל bezeichnet hier Bereitschaft oder Einwilligung. „Erklärte sich bereit“ ist im modernen Deutschen natürlich und bewahrt diesen Bedeutungsbereich, ohne eine förmliche Vereinbarung zu stark zu betonen.
- source_word: לָשֶׁבֶת
  choice: zu wohnen
  rationale: ישב bezeichnet in diesem Zusammenhang nicht bloß das Sitzen, sondern das Wohnen beziehungsweise Bleiben bei jemandem. „Wohnen“ gibt die längerfristige Niederlassung klar wieder.
- source_word: אֶת הָאִישׁ
  choice: bei dem Mann
  rationale: Nach ישב kann אֶת im Sinn von Gemeinschaft beziehungsweise Aufenthalt bei jemandem gebraucht werden. Der allgemeine Ausdruck „der Mann“ bleibt erhalten; ein im Vers nicht genannter Eigenname wird nicht eingesetzt.
- source_word: וַיִּתֵּן
  choice: gab
  rationale: נתן bedeutet wörtlich „geben“. Der Heiratszusammenhang wird im Deutschen zur Verständlichkeit durch „zur Frau“ ausdrücklich gemacht.
- source_word: צִפֹּרָה
  choice: Zippora
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: בִתּוֹ
  choice: seine Tochter
  rationale: Das Suffix verweist eindeutig auf den Mann als denjenigen, der seine Tochter gibt.
- source_word: לְמֹשֶׁה
  choice: Mose
  rationale: לְ kennzeichnet Mose als Empfänger; in der natürlichen deutschen Konstruktion „jemandem seine Tochter zur Frau geben“ steht „Mose“ im Dativ.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erklärte sich bereit“ bildet die Bedeutungsbreite von יאל idiomatisch ab. Der Haupttext macht den im kulturellen Kontext eindeutigen Heiratssinn verständlich, während die Fußnote den knapperen hebräischen Wortlaut dokumentiert.
