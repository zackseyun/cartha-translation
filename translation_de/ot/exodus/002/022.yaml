source:
  edition: WLC
  text: וַ/תֵּ֣לֶד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ גֵּרְשֹׁ֑ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּ/אֶ֖רֶץ נָכְרִיָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/022.yaml
  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: de
  text: 'Sie gebar einen Sohn und gab ihm den Namen Gerschom[a]; denn er sagte: »Als Fremder habe ich in einem fremden Land gelebt.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Gerschom klingt im Hebräischen an eine Wendung wie »ein Fremder dort« an und greift so Moses’ Erklärung des Namens auf.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich war ein Fremder in einem fremden Land.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Sie gebar einen Sohn
  rationale: Die knappe deutsche Geburtsformel gibt ילד und בן präzise, natürlich und in würdigem Erzählstil wieder.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: und gab ihm den Namen
  rationale: Dies ist die natürliche moderne deutsche Entsprechung der hebräischen Namensgebungsformel »er rief seinen Namen«.
- source_word: גֵּרְשֹׁם
  choice: Gerschom
  rationale: Die im Deutschen bibelsprachlich etablierte Umschrift wahrt den Eigennamen; eine Fußnote erläutert das hebräische Klangspiel.
- source_word: כִּי אָמַר
  choice: denn er sagte
  rationale: כִּי leitet die Begründung der Namensgebung ein; »denn« bewahrt die knappe erklärende Verknüpfung.
- source_word: גֵּר
  choice: Als Fremder
  rationale: גֵּר bezeichnet hier jemanden, der außerhalb seines Herkunftsverbands in einem anderen Land lebt. »Fremder« ist verständlich und bewahrt die lexikalische Nähe zu נָכְרִיָּה.
- source_word: הָיִיתִי
  choice: habe ich … gelebt
  rationale: Das hebräische Perfekt beschreibt Moses' bis zur Namensgebung erfahrene Lebenslage; die deutsche Perfektform lässt diesen Rückbezug natürlich anklingen.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: in einem fremden Land
  rationale: Die Wiedergabe ist präzise und erhält die Wiederholung des Fremdheitsmotivs.
theological_decisions:
- issue: Zeitlicher Bezug von הָיִיתִי
  choice: Als Fremder habe ich in einem fremden Land gelebt.
  alternative: Ich war ein Fremder in einem fremden Land.
  rationale: Das hebräische Perfekt lässt sowohl einen einfachen Vergangenheitsbezug als auch eine bis zum Sprechzeitpunkt reichende Erfahrung zu. Der Haupttext wählt idiomatisches deutsches Perfekt; die Fußnote bewahrt die alternative Lesart.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Erzählprosa. Die idiomatische Namensformel vermeidet unnötige Hebraismen; das Wortpaar »Fremder/fremd« erhält das Motiv und die Spannung des Ausgangstextes. Alle Fußnotenmarker stehen im Haupttext.
