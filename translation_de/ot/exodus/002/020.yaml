  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: de
  text: 'Da sagte er zu seinen Töchtern: »Und wo ist er? Warum habt ihr den Mann zurückgelassen? Ruft ihn, damit er Brot isst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Und wo ist er?
  rationale: Die Verbindung aus וְ und אַיּוֹ wird als unmittelbare, nachdrückliche Nachfrage wiedergegeben; »Und« entspricht dem hebräischen Anschluss natürlicher als ein deutendes »Dann«.
- source_word: לָמָּה זֶּה
  choice: Warum
  rationale: Die idiomatische Verbindung verstärkt die Frage. Im heutigen Deutsch ist schlichtes »Warum« natürlich und bewahrt den Sinn, ohne ein schwerfälliges »Warum ist es so, dass« einzuführen.
- source_word: עֲזַבְתֶּן אֶת־הָאִישׁ
  choice: habt ihr den Mann dort zurückgelassen
  rationale: עָזַב bezeichnet hier im Zusammenhang, dass die Töchter den Helfer am Ort zurückließen, ohne ihn mitzubringen oder einzuladen. »dort zurückgelassen« macht diesen situativen Sinn im Deutschen klar.
- source_word: וְיֹאכַל לָחֶם
  choice: damit er etwas isst
  rationale: Wörtlich steht »und er esse Brot«; »Brot essen« kann im Hebräischen allgemein eine Mahlzeit einnehmen bedeuten. »etwas isst« gibt die Einladung im modernen Deutsch idiomatisch wieder.
