source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: de
  text: 'Doch Mose sagte zu Gott: »Wer bin ich, dass ich zum Pharao gehen und die Israeliten[a] aus Ägypten herausführen sollte?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die Söhne Israels“; traditionell „die Kinder Israels“.
    reason: בְּנֵי יִשְׂרָאֵל ist hier die kollektive Bezeichnung für das Volk Israel. Die Fußnote bewahrt die wörtliche genealogische Ausdrucksform und nennt die traditionelle deutsche Wiedergabe.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die übliche und natürliche Wiedergabe der hebräischen Erzählform von אמר im Deutschen.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Trotz des Artikels im Hebräischen verlangt der direkte Bezug auf den Gott Israels im Deutschen idiomatisch „Gott“, nicht „der Gott“.
- source_word: מִי אָנֹכִי
  choice: Wer bin ich
  rationale: Die knappe rhetorische Frage bewahrt Moses Demut und sein Empfinden eigener Unzulänglichkeit ohne erklärenden Zusatz.
- source_word: כִּי אֵלֵךְ
  choice: dass ich … gehen … sollte
  rationale: כִּי leitet nach der rhetorischen Frage den vorgestellten Auftrag ein; der Konjunktiv mit „sollte“ gibt die erwogene beziehungsweise infrage gestellte Handlung im Deutschen natürlich wieder.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Eingebürgerte deutsche Form des ägyptischen Herrschertitels.
- source_word: וְכִי אוֹצִיא
  choice: und … herausführen sollte
  rationale: 'Der Hifil von יצא ist kausativ: jemanden hinaus- beziehungsweise herausführen. Das gemeinsame „dass ich“ und „sollte“ ergibt im Deutschen einen natürlichen Parallelbau, ohne den zweiten Auftrag abzuschwächen.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt den genealogischen und grammatisch maskulinen Ausdruck des Hebräischen; eine idiomatischere kollektive Wiedergabe wird in der Fußnote genannt.
- source_word: מִמִּצְרַיִם
  choice: aus Ägypten
  rationale: Zusammen mit „herausführen“ gibt „aus Ägypten“ Ausgangspunkt und Bewegung vollständig und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: 'die Israeliten; traditionell: die Kinder Israels'
  rationale: Der Haupttext erhält die genealogische und maskuline Form des Ausgangstextes. Die Fußnote macht zugleich die geläufige kollektive und die traditionelle deutsche Wiedergabe sichtbar, ohne die Referenz auf das Volk Israel einzuengen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, während die zweifache Dimension von Moses Einwand erhalten bleibt: vor den Pharao zu treten und Israel aus Ägypten herauszuführen. „Doch“ markiert den Einwand gegenüber dem vorausgehenden Auftrag.'
