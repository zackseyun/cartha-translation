source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: de
  text: 'Dann sagte er: »Ich bin der Gott deines Vaters, der Gott Abrahams, der Gott Isaaks und der Gott Jakobs.« Da verbarg Mose sein Gesicht, denn er fürchtete sich, Gott anzusehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte er
  rationale: Das konsekutive וַ führt die Erzählung weiter; „Dann“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: אָנֹכִי
  choice: Ich bin
  rationale: Das selbstständige Pronomen ist hervorgehoben; in diesem nominalen Identifikationssatz wird die im Hebräischen unausgesprochene Kopula im Deutschen ergänzt.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: der Gott deines Vaters
  rationale: Die Konstruktion und der singularische Suffix werden direkt bewahrt; zugleich bleibt die feierliche Identifikationsformel erhalten.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: der Gott Abrahams, der Gott Isaaks und der Gott Jakobs
  rationale: Die dreifache Wiederholung von „der Gott“ entspricht dem Hebräischen und bewahrt dessen rhetorisches und bundestheologisches Gewicht.
- source_word: וַיַּסְתֵּר
  choice: verbarg
  rationale: Die Hifil-Form bezeichnet hier das Verbergen beziehungsweise Abwenden des Gesichts; „verbarg“ ist präzise und idiomatisch.
- source_word: פָּנָיו
  choice: sein Gesicht
  rationale: Die konkrete Bedeutung passt zur körperlichen Reaktion des Mose und erfordert keine übertragene Wiedergabe.
- source_word: כִּי יָרֵא
  choice: denn er fürchtete sich
  rationale: „Denn“ bewahrt den begründenden Zusammenhang; die reflexive Form gibt den zuständlichen Sinn von יָרֵא in würdigem, natürlichem Deutsch wieder.
- source_word: מֵהַבִּיט
  choice: anzusehen
  rationale: Nach dem Verb des Fürchtens bezeichnet die Konstruktion, was Mose zu tun fürchtete; „sich fürchten, jemanden anzusehen“ ist im Deutschen natürlich.
- source_word: אֶל הָאֱלֹהִים
  choice: Gott
  rationale: Im unmittelbaren Zusammenhang bezeichnet אֱלֹהִים den Gott der Erzväter, der zu Mose spricht; mit „anzusehen“ ist kein zusätzliches „auf“ nötig.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der göttlichen Selbstvorstellung und Theophanie
  choice: Gott
  alternative: das göttliche Wesen
  rationale: Der Kontext identifiziert den Sprecher ausdrücklich als den Gott der Erzväter. „Gott“ bewahrt diesen eindeutigen Bezug, ohne über den Text hinauszugehen.
- issue: Wiederholung der patriarchalischen Gottesformel
  choice: der Gott Abrahams, der Gott Isaaks und der Gott Jakobs
  alternative: der Gott Abrahams, Isaaks und Jakobs
  rationale: Die Wiederholung steht ausdrücklich im hebräischen Text und trägt dessen feierlichen Nachdruck; sie wird daher nicht zusammengezogen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die wörtliche Wiederholung der Gottesbezeichnung bleibt erhalten; ansonsten folgt die Syntax natürlichem deutschem Erzählstil.
