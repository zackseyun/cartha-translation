base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: de
  text: 'Da sagte er: „Komm nicht näher heran! Zieh deine Sandalen von den Füßen, denn der Ort, auf dem du stehst, ist heiliger Boden[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Boden der Heiligkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter. „Da sagte er“ gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Komm nicht näher her
  rationale: Die Verneinung mit der Verbform drückt ein Verbot aus; קרב bezeichnet das Näherkommen und הֲלֹם die Bewegung an den gegenwärtigen Ort heran. Die Formulierung ist klar und idiomatisch.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Zieh deine Sandalen von den Füßen
  rationale: שַׁל fordert zum Abziehen beziehungsweise Entfernen auf. „Sandalen“ bewahrt die konkrete altorientalische Art des Schuhwerks, und „von den Füßen“ bildet die Ortsangabe ausdrücklich ab.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung des vorausgehenden Gebots ein. „Denn“ verbindet die Sätze in würdigem, natürlichem Deutsch.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: der Ort, auf dem du stehst
  rationale: Das Relativpronomen עָלָיו bezieht sich ausdrücklich auf den Ort; „auf dem“ erhält diesen räumlichen Bezug.
- source_word: אַדְמַת קֹדֶשׁ
  choice: heiliger Boden
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „Boden der Heiligkeit“. „Heiliger Boden“ ist die natürliche deutsche Entsprechung und bewahrt die Aussage über die besondere Heiligkeit des Ortes.
- source_word: הוּא
  choice: ist
  rationale: Das Pronomen dient in dem Nominalsatz der Hervorhebung beziehungsweise Kopulafunktion; im Deutschen wird dies idiomatisch mit „ist“ wiedergegeben.
theological_decisions:
- issue: Wesen der Heiligkeit des Ortes
  choice: 'Die Aussage bleibt beschreibend: Der Ort ist heiliger Boden.'
  alternative: Ausdrücklich erläutern, der Boden werde durch Gottes Gegenwart geheiligt.
  rationale: Der Vers bezeichnet den Boden eindeutig als heilig, erklärt hier aber nicht weiter, wie diese Heiligkeit zustande kommt. Die Übersetzung fügt daher keine theologische Deutung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Rede. „Komm nicht näher her“ vermeidet das altertümliche „Tritt nicht herzu“, während „heiliger Boden“ die vertraute und sachlich genaue Wendung bewahrt.
