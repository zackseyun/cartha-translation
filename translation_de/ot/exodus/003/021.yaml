id: EXO.3.21
reference: Exodus 3:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַתִּ֛י אֶת חֵ֥ן הָֽ/עָם הַ/זֶּ֖ה בְּ/עֵינֵ֣י מִצְרָ֑יִם וְ/הָיָה֙ כִּ֣י תֵֽלֵכ֔וּ/ן לֹ֥א תֵלְכ֖וּ רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: de
  text: Und ich werde diesem Volk Gunst bei den Ägyptern verschaffen[a]. Wenn ihr dann fortgeht, werdet ihr nicht mit leeren Händen gehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Augen der Ägypter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »werdet ihr nicht leer fortgehen«. Gemeint ist, dass sie nicht ohne Güter oder Vorräte aufbrechen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … verschaffen
  rationale: נתן bedeutet grundsätzlich »geben«. In Verbindung mit חֵן gibt »Gunst verschaffen« die hebräische Wendung im Deutschen natürlich wieder, ohne eine besondere theologische Bedeutung einzutragen.
- source_word: חֵן
  choice: Gunst
  rationale: חֵן bezeichnet hier Wohlwollen beziehungsweise günstige Aufnahme. »Gunst« bewahrt diesen sozialen Sinn; »Gnade« wäre in diesem Zusammenhang unnötig theologisch aufgeladen.
- source_word: הָעָם הַזֶּה
  choice: diesem Volk
  rationale: Der kollektive Singular עָם mit Demonstrativ wird formnah als »diesem Volk« wiedergegeben und bezeichnet Israel.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: bei den Ägyptern
  rationale: Wörtlich lautet die Wendung »in den Augen der Ägypter«. Das idiomatische »bei den Ägyptern« drückt im modernen Deutschen natürlich aus, wie das Volk von ihnen angesehen wird; die wörtliche Bildsprache bleibt in der Fußnote erhalten.
- source_word: וְהָיָה כִּי
  choice: Wenn … dann
  rationale: Die hebräische Zukunftsformel leitet eine erwartete künftige Situation ein. Die deutsche Konstruktion »Wenn … dann« gibt ihre Funktion klar und ohne unnötige Schwerfälligkeit wieder.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: fortgeht / gehen
  rationale: הלך bedeutet grundsätzlich »gehen«. Im Zusammenhang bezeichnet es den Aufbruch aus Ägypten; »fortgehen« macht dies im ersten Vorkommen deutlich, während »gehen« im zweiten die Wiederholung des hebräischen Verbs erkennen lässt.
- source_word: רֵיקָם
  choice: mit leeren Händen
  rationale: רֵיקָם bedeutet »leer« beziehungsweise »mit leeren Händen«. Die deutsche Redewendung vermittelt hier verständlich, dass Israel nicht ohne Besitz oder Versorgung aufbrechen wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch »Gunst verschaffen« und die Wenn-dann-Konstruktion idiomatisch gestaltet. Die Pluralformen von »ihr« entsprechen den hebräischen Verbformen.
