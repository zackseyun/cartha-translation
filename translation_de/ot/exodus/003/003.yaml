  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אָסֻֽרָה נָּ֣א וְ/אֶרְאֶ֔ה אֶת הַ/מַּרְאֶ֥ה הַ/גָּדֹ֖ל הַ/זֶּ֑ה מַדּ֖וּעַ לֹא יִבְעַ֥ר הַ/סְּנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/003.yaml
  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: de
  text: 'Da sagte Mose: »Ich will doch zur Seite gehen und mir dieses große Schauspiel ansehen: Warum verbrennt der Dornbusch nicht?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Warum brennt der Dornbusch nicht?«; im Zusammenhang auch: »Warum wird der Dornbusch nicht verzehrt?«'
    reason: »Verbrennt nicht« gibt die im Kontext naheliegende Folge des Brennens wieder. Das hebräische Verb bedeutet unmittelbar »brennen«; die Umschreibung mit »verzehrt« verdeutlicht den Kontext, ist aber nicht die engste lexikalische Wiedergabe.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; »Da« gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im Deutschen etablierte Form des Namens.
- source_word: אָסֻרָה נָּא
  choice: Ich will doch hingehen
  rationale: Der Kohortativ mit נָא drückt Moses’ Entschluss beziehungsweise eine milde Selbstaufforderung aus. »doch« bewahrt die nuancierende Partikel, ohne ein unnatürliches »bitte« an sich selbst zu richten.
- source_word: וְאֶרְאֶה
  choice: und mir … ansehen
  rationale: ראה bezeichnet hier gezieltes Hinsehen; »sich etwas ansehen« ist im Deutschen natürlicher und präziser als das bloße »sehen«.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: diese erstaunliche Erscheinung
  rationale: מַרְאֶה bezeichnet das Wahrnehmbare beziehungsweise eine Erscheinung. גָּדוֹל bedeutet wörtlich »groß«, hat hier aber im Zusammenhang den Sinn von außergewöhnlich oder erstaunlich.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Direkte Wiedergabe der Frage nach dem Grund.
- source_word: לֹא יִבְעַר
  choice: verbrennt … nicht
  rationale: בער bedeutet im Qal »brennen/verbrennen«. Im Kontext bezeichnet »verbrennen« natürlich das Ausbleiben des sonst zu erwartenden Aufzehrens, ohne ausdrücklich ein anderes hebräisches Verb für »verzehren« einzutragen.
- source_word: הַסְּנֶה
  choice: der Dornbusch
  rationale: סְנֶה bezeichnet einen vermutlich dornigen Busch; »Dornbusch« ist eine etablierte und anschauliche deutsche Wiedergabe.
theological_decisions:
- issue: Art des Feuerwunders am Dornbusch
  choice: Warum verbrennt der Dornbusch nicht?
  alternative: Warum brennt der Dornbusch nicht? / Warum wird der Dornbusch nicht verzehrt?
  rationale: 'Die Übersetzung wahrt die Spannung des Zeichens: Der Busch steht nach dem Kontext in Flammen, wird aber nicht aufgebraucht. »Verbrennt nicht« bringt dies im Deutschen zum Ausdruck, ohne eine weitergehende theologische Deutung einzuführen.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede klingt entschlossen und zugleich staunend; ungewöhnliche altertümliche Satzformen wurden vermieden.
