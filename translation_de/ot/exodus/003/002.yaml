  variant: modern standard German
source:
  edition: WLC
  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: de
  text: 'Da erschien ihm der Engel[a] Jahwes in einer Feuerflamme mitten aus dem Dornbusch. Er sah hin, und siehe: Der Dornbusch brannte im Feuer, doch der Dornbusch wurde nicht verzehrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bote Jahwes“. Das hebräische Wort kann sowohl „Engel“ als auch „Bote“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: erschien
  rationale: Das Nifal von ראה bezeichnet hier das Sichtbarwerden bzw. Erscheinen und wird im Deutschen in einem Erscheinungsbericht natürlich mit „erschien“ wiedergegeben.
- source_word: מַלְאַךְ יְהוָה
  choice: der Engel Jahwes
  rationale: מַלְאַךְ kann „Engel“ oder „Bote“ bedeuten. Im Zusammenhang dieser göttlichen Erscheinung ist „Engel“ die naheliegende Hauptübersetzung; die lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּלַבַּת אֵשׁ
  choice: in einer Feuerflamme
  rationale: Die Formulierung bewahrt das konkrete Flammenbild des hebräischen Ausdrucks in natürlichem, gehobenem Deutsch.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: mitten aus dem Dornbusch
  rationale: „Mitten aus“ gibt מִתּוֹךְ räumlich präzise wieder; סְנֶה bezeichnet den in dieser Erzählung genannten Dornbusch.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Er sah hin, und siehe
  rationale: „Er sah hin“ bildet den bewussten Blick des Mose ab; „siehe“ erhält die aufmerksamkeitslenkende und staunende Kraft von הִנֵּה.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: brannte im Feuer
  rationale: Das Partizip bezeichnet einen andauernden Vorgang; zugleich bleibt die ausdrückliche Erwähnung des Feuers erhalten.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: wurde nicht verzehrt
  rationale: Das passive Partizip von אכל bezeichnet hier das Verzehrt- bzw. Aufgebrauchtwerden durch das Feuer und bewahrt die zentrale paradoxe Beobachtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt den Tetragrammaton ausdrücklich. Die Wiedergabe als „Jahwe“ erhält den Charakter des Bundesnamens, ohne ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von מַלְאַךְ im Kontext einer Gotteserscheinung
  choice: Engel
  alternative: Bote
  rationale: „Engel“ entspricht dem übernatürlichen Erscheinungskontext, während die Fußnote die echte lexikalische Mehrdeutigkeit wahrt. Eine genauere Identifikation des Engels mit Gott oder einer bestimmten göttlichen Person wird nicht in den Text hineingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Dornbusch“ und der Aufmerksamkeitsruf „siehe“ wurden beibehalten, um Erzählrhythmus, Nachdruck und Staunen des hebräischen Textes zu bewahren.
