  terminology: „Engel Jahwes“ bewahrt die im Text verwendete Bezeichnung, ohne deren theologische Deutung festzulegen. Die Fußnote wahrt die lexikalisch mögliche Alternative „Bote“. „Jahwe“ folgt der vorliegenden Entscheidung zur Wiedergabe des Gottesnamens und ist konsequent verwendet.
