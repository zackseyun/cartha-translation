  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: de
  text: Jede Frau soll ihre Nachbarin und die Frau, die in ihrem Haus wohnt,[a] um Gegenstände aus Silber und Gold sowie um Kleidung bitten[b]. Ihr sollt sie euren Söhnen und Töchtern anlegen. So werdet ihr Ägypten ausplündern.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Beisassin“ beziehungsweise „die Fremde in ihrem Haus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von ihr verlangen“. Traditionell wird auch „ausleihen“ übersetzt; das hebräische Verb bedeutet jedoch grundsätzlich „bitten“ oder „erbitten“ und setzt keine Rückgabe voraus.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Ägypten ausrauben“ beziehungsweise „Ägypten seiner Habe berauben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: soll ... um ... bitten
  rationale: שׁאל bedeutet hier grundsätzlich „bitten, erbitten, verlangen“, nicht notwendig „ausleihen“. Die Formulierung vermeidet daher die unbelegte Vorstellung einer späteren Rückgabe.
- source_word: אִשָּׁה
  choice: Jede Frau
  rationale: Der unbestimmte Singular hat hier verteilenden Sinn; „jede Frau“ gibt diesen im Deutschen natürlich wieder.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: ihre Nachbarin
  rationale: Das hebräische Substantiv ist feminin und bezeichnet hier ausdrücklich eine weibliche Nachbarperson.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: die Frau, die in ihrem Haus wohnt
  rationale: Die feminine Partizipialform von גור bezeichnet eine Frau, die sich dort als Beisassin, Fremde oder zeitweilige Bewohnerin aufhält. Die Hauptfassung bleibt verständlich, während die Fußnote die genaue soziale Einordnung offenhält.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: Gegenstände aus Silber und Gold
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße. „Gegenstände“ vermeidet eine unbegründete Einschränkung auf Schmuck oder Gefäße.
- source_word: וּשְׂמָלֹת
  choice: Kleidung
  rationale: Der allgemeine Ausdruck bezeichnet Kleidungsstücke; „Kleidung“ ist modern und hinreichend breit.
- source_word: וְשַׂמְתֶּם עַל
  choice: sollt ihr ... anlegen
  rationale: שׂים עַל bedeutet wörtlich „auf ... legen“. Im Zusammenhang mit Kleidung und wertvollen Gegenständen drückt „anlegen“ im Deutschen die Ausstattung der Kinder natürlich aus.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: euren Söhnen und Töchtern
  rationale: Die ausdrückliche Nennung beider Gruppen bleibt erhalten und wird nicht zu „Kindern“ verallgemeinert.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: So werdet ihr Ägypten ausplündern
  rationale: Der Piel von נצל bezeichnet hier das Ausplündern, Berauben oder Entleeren. „Ausplündern“ bewahrt die starke Aussage und klingt im modernen Deutschen klar.
theological_decisions:
- issue: Mögliche moralisch-theologische Abschwächung der Mitnahme ägyptischer Güter
  choice: So werdet ihr Ägypten ausplündern
  alternative: So werdet ihr Ägypten seiner Habe berauben / ausziehen
  rationale: Der hebräische Text bezeichnet eine von Gott angekündigte Umkehr der bisherigen Unterdrückungsverhältnisse. Die Übersetzung mildert נצל nicht ab und deutet durch „leihen“ auch keine Rückgabepflicht an.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge wurde für natürliche deutsche Lesbarkeit leicht gegliedert. Die feminine Form „Nachbarin“ und die ausdrückliche Nennung von Söhnen und Töchtern bewahren die Geschlechtsangaben des Hebräischen. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
