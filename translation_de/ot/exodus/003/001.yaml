  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: de
  text: Mose hütete die Herde seines Schwiegervaters Jitro, des Priesters von Midian. Er führte die Herde über die Wüste hinaus[a] und kam zum Berg Gottes, dem Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf die andere Seite der Wüste.'
    reason: Lexikalische Alternative für die räumliche Wendung אַחַר הַמִּדְבָּר.
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: Mose
  rationale: Die einleitende Konjunktion markiert den Übergang zu einer neuen Szene. Im modernen deutschen Erzählstil ist dafür kein ausdrückliches „Und“ oder „Nun“ nötig.
- source_word: הָיָה רֹעֶה
  choice: hütete
  rationale: Die Verbindung bezeichnet eine andauernde Tätigkeit in der Vergangenheit. „Hütete“ gibt die Tätigkeit eines Hirten natürlich und präzise wieder.
- source_word: צֹאן
  choice: die Herde
  rationale: Das hebräische Kollektivwort bezeichnet Kleinvieh, gewöhnlich Schafe und Ziegen. „Herde“ ist die natürliche deutsche Sammelbezeichnung, ohne die Tierarten unnötig festzulegen.
- source_word: יִתְרוֹ
  choice: Jitro
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen, dem Hebräischen nahen Form wiedergegeben.
- source_word: חֹתְנ/וֹ
  choice: seines Schwiegervaters
  rationale: Im Zusammenhang bezeichnet das Wort Moses durch Heirat begründete Beziehung zu Jitro; „Schwiegervater“ ist die passende und verständliche Wiedergabe.
- source_word: כֹּהֵן מִדְיָן
  choice: des Priesters von Midian
  rationale: Die Apposition identifiziert Jitro näher. Der bestimmte Ausdruck wird mit „des Priesters von Midian“ direkt wiedergegeben.
- source_word: וַ/יִּנְהַג
  choice: Er führte
  rationale: Das Verb kann „treiben“, „führen“ oder „leiten“ bedeuten. „Führte“ passt natürlich zur Bewegung einer Herde und vermeidet eine nicht erforderliche Härte.
- source_word: אַחַר הַ/מִּדְבָּר
  choice: über die Wüste hinaus
  rationale: Die räumliche Wendung bezeichnet hier eine Bewegung hinter beziehungsweise auf die andere Seite der Wüste. „Über die Wüste hinaus“ ist im Deutschen natürlich und wahrt die räumliche Offenheit.
- source_word: וַ/יָּבֹא
  choice: kam
  rationale: Das Verb bezeichnet das Gelangen an einen Ort; „kam“ entspricht der schlichten hebräischen Erzählweise.
- source_word: הַר הָ/אֱלֹהִים
  choice: zum Berg Gottes
  rationale: Die Konstruktverbindung wird transparent wiedergegeben und nicht als „heiliger Berg“ ausgelegt.
- source_word: חֹרֵבָ/ה
  choice: zum Horeb
  rationale: Die Ortsendung bezeichnet eine Bewegung auf Horeb zu. Das wiederholte „zum“ macht diese Richtung im Deutschen deutlich und lässt „Horeb“ als nähere Bestimmung des Berges erkennen.
theological_decisions:
- issue: Ob הַר הָאֱלֹהִים den Berg bereits als heilig ausweist oder ihn aus späterer Erzählperspektive bezeichnet
  choice: Berg Gottes
  alternative: heiliger Berg; Gottesberg
  rationale: Die direkte Wiedergabe bewahrt die Spannung, ob die Bezeichnung vorausgreifend, rückblickend oder bereits gebräuchlich ist, und fügt keine theologische Deutung hinzu.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der fortlaufende Vergangenheitsaspekt wird idiomatisch durch das Präteritum ausgedrückt; unnötige Diskursmarker werden vermieden.
