  text: וְ/שָׁלַחְתִּ֤י אֶת יָדִ/י֙ וְ/הִכֵּיתִ֣י אֶת מִצְרַ֔יִם בְּ/כֹל֙ נִפְלְאֹתַ֔/י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּ/קִרְבּ֑/וֹ וְ/אַחֲרֵי כֵ֖ן יְשַׁלַּ֥ח אֶתְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: de
  text: Und ich werde meine Hand ausstrecken[a] und Ägypten mit all meinen Wundertaten schlagen, die ich in seiner Mitte vollbringen werde. Danach wird er euch fortschicken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Hand aussenden“. Die hebräische Wendung bezeichnet machtvolles Eingreifen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „euch ziehen lassen“. Wörtlich: „euch fortschicken“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: ich werde meine Hand ausstrecken
  rationale: Die Wendung bedeutet wörtlich, die Hand auszusenden, bezeichnet hier aber idiomatisch das machtvolle Eingreifen. „Die Hand ausstrecken“ bewahrt das konkrete hebräische Bild und klingt im Deutschen natürlich.
- source_word: וְהִכֵּיתִי
  choice: schlagen
  rationale: נכה bezeichnet hier das Schlagen beziehungsweise Heimsuchen Ägyptens. „Schlagen“ ist klar, würdevoll und legt weder Tod noch völlige Vernichtung in den Text hinein.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der hebräische Eigenname bezeichnet Ägypten als Land und politische Größe; eine Einschränkung auf „die Ägypter“ wäre unnötig interpretierend.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: mit all meinen Wundertaten
  rationale: נִפְלָאוֹת sind außergewöhnliche, Staunen hervorrufende Taten. „Wundertaten“ vermittelt im modernen Deutsch deutlicher als das mögliche, aber missverständliche „Wunder“ den Handlungscharakter.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: die ich … vollbringen werde
  rationale: „Vollbringen“ gibt עשה in Verbindung mit „Wundertaten“ idiomatisch und würdevoll wieder, ohne den Inhalt näher zu bestimmen.
- source_word: בְּקִרְבּוֹ
  choice: in seiner Mitte
  rationale: Das maskuline Singularsuffix verweist am natürlichsten auf Ägypten als kollektive beziehungsweise politische Größe. Die räumliche Bildsprache des Hebräischen bleibt erhalten.
- source_word: וְאַחֲרֵי כֵן
  choice: Danach
  rationale: Die knappe deutsche Zeitangabe gibt die Abfolge des hebräischen Ausdrucks natürlich und genau wieder.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: er wird euch ziehen lassen
  rationale: Das Verb שׁלח bedeutet grundsätzlich „senden/fortschicken“, bezeichnet in diesem Zusammenhang aber auch die Freigabe Israels. „Ziehen lassen“ ist im Deutschen natürlich und bewahrt den Gedanken des Wegsendens.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Handeln
  choice: Das körperliche Bild „meine Hand ausstrecken“ wird beibehalten.
  alternative: Abstrakt mit „meine Macht einsetzen“ wiedergeben.
  rationale: Der hebräische Text beschreibt Gottes Eingreifen mit einem konkreten körperlichen Bild. Eine abstrakte Wiedergabe würde dieses Bild auflösen und den Text stärker deuten.
- issue: Bedeutungsumfang von יְשַׁלַּח
  choice: „ziehen lassen“ im Haupttext, mit der wörtlicheren Alternative „fortschicken“ in der Fußnote
  alternative: Nur „freilassen“ oder nur „fortschicken“ schreiben.
  rationale: Im Zusammenhang geht es um Pharaos Freigabe Israels, während das Verb zugleich den Gedanken des Aussendens oder Fortschickens trägt. Haupttext und Fußnote bewahren beide Aspekte, ohne sie dogmatisch zu harmonisieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt quellennah, wird aber durch einen neuen Hauptsatz bei „Danach“ natürlich gegliedert. Beide Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
