id: EXO.3.10
reference: Exodus 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: de
  text: Und nun geh! Ich will dich zum Pharao senden. Führe mein Volk, die Söhne Israels[a], aus Ägypten heraus!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „die Israeliten“. Hebräisch: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Partikel als auch den zeitlich-diskursiven Übergang zur Beauftragung Moses und klingt im Deutschen natürlich.
- source_word: לְכָה
  choice: geh
  rationale: Der Imperativ von הלך fordert Mose hier unmittelbar zum Aufbruch und zur Ausführung seines Auftrags auf. Das deutsche „geh“ gibt die Bewegungsrichtung klarer wieder als „komm“.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Ich will dich … senden
  rationale: Gibt das göttliche Beauftragen in würdigem, gegenwärtigem Deutsch wieder. „Will“ bezeichnet hier Gottes erklärten Entschluss, nicht bloß einen Wunsch.
- source_word: אֶל־פַּרְעֹה
  choice: zum Pharao
  rationale: Natürliche deutsche Wiedergabe der Richtungsangabe und des ägyptischen Herrschertitels.
- source_word: וְהוֹצֵא
  choice: Führe … heraus
  rationale: Der Hifil-Imperativ von יצא bedeutet, jemanden hinausgehen zu lassen beziehungsweise hinauszuführen. „Herausführen“ bewahrt den kausativen Sinn und passt idiomatisch zum Volk als Objekt.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Bewahrt die direkte possessive und bundestheologisch bedeutsame Bezeichnung ohne erläuternden Zusatz.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die hebräische familiär-genealogische Bezeichnung und ihre Verbindung mit dem Stammvater Israel. Eine idiomatischere deutsche Wiedergabe wird in der Fußnote genannt.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten heraus
  rationale: In Verbindung mit dem kausativen Verb macht diese Formulierung die Bewegung aus Ägypten deutlich und entspricht natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe der Bundesvolkbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptfassung erhält die familiäre und genealogische Form des Hebräischen, ohne die Bezeichnung stillschweigend zu einer rein ethnischen Benennung zu glätten. Da im Kontext das gesamte Volk gemeint ist, nennt die Fußnote die geläufige idiomatische Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Imperative werden als eigenständige Aufforderungen gestaltet; dadurch bleibt die Dringlichkeit der göttlichen Beauftragung erhalten. Die wörtlichere Bundesvolkbezeichnung steht im Haupttext, während die allgemein verständliche ethnische Bezeichnung in der Fußnote angeboten wird.
