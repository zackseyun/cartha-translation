source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: de
  text: 'Da sagte Mose zu Gott: »Siehe, wenn ich zu den Israeliten komme und ihnen sage: ›Der Gott eurer Vorfahren hat mich zu euch gesandt‹, und sie zu mir sagen: ›Wie lautet sein Name?‹ – was soll ich ihnen dann sagen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die hebräische Erzählfolge natürlich und zugleich eng am Ausgangstext wieder.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt das hervorgehobene Aufmerksamkeitssignal des Hebräischen; im würdevollen biblischen Erzählregister verständlich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Natürliches modernes Deutsch für die kollektive Bezeichnung »Söhne/Kinder Israels«, ohne die Gruppe auf männliche Personen zu beschränken.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: der Gott eurer Vorfahren
  rationale: Gibt die genealogische Bedeutung von אבות in inklusivem, modernem Deutsch wieder; »Väter« wäre formnäher, kann heute aber enger verstanden werden.
- source_word: מַה שְּׁמוֹ
  choice: Wie lautet sein Name?
  rationale: Idiomatiche deutsche Wiedergabe der wörtlichen Frage »Was ist sein Name?«, die nach der Benennung beziehungsweise Identität fragt.
theological_decisions:
- issue: Bedeutung der Frage nach Gottes Namen
  choice: Die Frage bleibt ohne erklärende Erweiterung als »Wie lautet sein Name?« stehen.
  alternative: Eine Deutung wie »Wie heißt er wirklich?« oder »Was für ein Gott ist er?«
  rationale: Der Vers selbst lässt offen, wie stark die Frage auf Benennung, Identität, Wesen oder Autorität zielt. Diese Spannung wird nicht vorweggenommen.
- issue: Bezeichnung der Vorfahren
  choice: »Vorfahren«
  alternative: »Väter«
  rationale: Die Wahl vermeidet eine unnötige geschlechtliche Verengung, ohne eine konfessionelle oder theologische Zusatzdeutung einzuführen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist klar gegliedert; »Siehe« bewahrt die rhetorische Hervorhebung, während »Israeliten« und »Vorfahren« für heutige Leser natürlich verständlich sind.
