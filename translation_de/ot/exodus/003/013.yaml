    rationale: Die Rede der Israeliten ist eine Frage, doch der Ausgangstext verwendet אָמַר („sagen“), ebenso die englische Audit-Fassung. „und sie zu mir sagen“ ist genauer und bleibt im Deutschen gut lesbar.
