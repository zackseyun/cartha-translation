base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: de
  text: Und ich bin herabgekommen, um es aus der Hand Ägyptens[a] zu retten und es aus jenem Land hinaufzuführen[b] in ein gutes, weites Land[c], in ein Land, in dem Milch und Honig fließen, an den Ort der Kanaaniter, Hethiter, Amoriter, Perisiter, Hiwiter und Jebusiter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aus der Hand Ägyptens“ ist ein hebräisches Bild für die Macht oder Herrschaft Ägyptens.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht bei „retten“ und „hinaufführen“ jeweils ein Pronomen im Singular; Israel ist als Volk in seiner Gesamtheit gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in ein gutes, geräumiges Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Und ich bin herabgekommen
  rationale: Die räumliche und anthropomorphe Ausdrucksweise des Hebräischen bleibt erhalten. Das deutsche Perfekt vermittelt in der direkten Rede die vollzogene Handlung mit gegenwärtiger Relevanz natürlich.
- source_word: לְהַצִּילוֹ
  choice: um es … zu retten
  rationale: Das Hiphil von נצל bezeichnet hier die konkrete Befreiung aus Gefahr und Gewalt. „Retten“ ist im heutigen Deutsch klar und weniger altertümlich als „erretten“.
- source_word: מִיַּד מִצְרַיִם
  choice: aus der Hand Ägyptens
  rationale: Die hebräische Metapher für Macht beziehungsweise Gewalt wird bewahrt; eine Fußnote erläutert die idiomatische Bedeutung.
- source_word: וּלְהַעֲלֹתוֹ
  choice: und es … hinaufzuführen
  rationale: Das Hiphil von עלה enthält eine Aufwärtsbewegung. „Hinaufführen“ bewahrt dieses geografisch und erzählerisch wichtige Motiv; das singularische Suffix wird mit „es“ auf Israel als Volk bezogen.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: aus jenem Land
  rationale: „Jenem“ gibt den rückverweisenden Demonstrativausdruck präzise und in würdigem modernem Deutsch wieder.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: in ein gutes, weites Land
  rationale: רחבה bezeichnet Weite oder Geräumigkeit. „Weit“ ist natürlich und erhält die Vorstellung eines großzügigen Lebensraums.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die geläufige deutsche Wendung bildet das partizipiale Bild des Überflusses verständlich und anschaulich ab.
- source_word: אֶל מְקוֹם
  choice: an den Ort
  rationale: מקום wird seinem Grundsinn entsprechend mit „Ort“ wiedergegeben, ohne es interpretierend durch „Gebiet“ oder „Land“ zu ersetzen.
- source_word: הַכְּנַעֲנִי … הַיְבוּסִי
  choice: der Kanaaniter, Hetiter, Amoriter, Perisiter, Hiwiter und Jebusiter
  rationale: Die hebräischen singularischen Volksbezeichnungen sind kollektiv gebraucht. Im Deutschen geben Pluralformen diesen kollektiven Sinn natürlich und eindeutig wieder.
theological_decisions:
- issue: Anthropomorphe Bewegung Gottes
  choice: Die räumliche Aussage „ich bin herabgekommen“ wird beibehalten.
  alternative: Deutend paraphrasieren, etwa „ich greife nun ein“.
  rationale: Der hebräische Text schildert Gottes Handeln bewusst als Herabkommen. Eine abstrakte Umschreibung würde das lebendige Bild und seine theologische Spannung abschwächen.
- issue: Singularische Pronomen für Israel als Kollektiv
  choice: Die beiden singularischen Suffixe werden mit „es“ wiedergegeben.
  alternative: Nach dem gemeinten Volk pluralisch „sie“ verwenden.
  rationale: Der Text betrachtet Israel als kollektive Einheit. Das neutrale deutsche Pronomen „es“ kann auf Israel beziehungsweise das Volk verweisen und bewahrt den Numerus des Ausgangstextes, ohne ein männliches Einzelwesen nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschaulichen Leitbilder des hebräischen Textes – Gottes Herabkommen, Ägyptens Hand, das Hinaufführen sowie das Fließen von Milch und Honig – bleiben erhalten. Die Völkernamen stehen im Deutschen idiomatisch im Plural, obwohl das Hebräische kollektiv gebrauchte Singularformen hat.
