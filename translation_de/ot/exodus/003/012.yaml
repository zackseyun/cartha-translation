  text: וַ/יֹּ֨אמֶר֙ כִּֽי אֶֽהְיֶ֣ה עִמָּ֔/ךְ וְ/זֶה לְּ/ךָ֣ הָ/א֔וֹת כִּ֥י אָנֹכִ֖י שְׁלַחְתִּ֑י/ךָ בְּ/הוֹצִֽיאֲ/ךָ֤ אֶת הָ/עָם֙ מִ/מִּצְרַ֔יִם תַּֽעַבְדוּ/ן֙ אֶת הָ֣/אֱלֹהִ֔ים עַ֖ל הָ/הָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: de
  text: 'Er sagte: „Ich werde mit dir sein. Und dies soll für dich das Zeichen sein, dass ich dich gesandt habe: Wenn du das Volk aus Ägypten herausführst, werdet ihr Gott auf diesem Berg dienen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werdet ihr Gott auf diesem Berg anbeten“. Das hebräische Verb kann sowohl „dienen“ als auch, im Blick auf Gott, „anbeten/verehrend dienen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: Ich werde mit dir sein
  rationale: כִּי leitet hier die göttliche Zusicherung als Antwort auf Moses Einwand ein. Im Deutschen trägt die direkte Aussage die bekräftigende Funktion natürlich, ohne ein zusätzliches „gewiss“ zu benötigen. Das Imperfekt אֶהְיֶה ist in diesem Zusammenhang zukunftsbezogen und verheißt begleitende Gegenwart.
- source_word: וְזֶה לְּךָ הָאוֹת
  choice: Und dies soll für dich das Zeichen sein
  rationale: אוֹת bezeichnet ein bestätigendes Zeichen. „Soll … sein“ gibt die zukunftsgerichtete Funktion der Aussage im Deutschen idiomatisch wieder.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: dass ich dich gesandt habe
  rationale: Die Konstruktion benennt, was das Zeichen bestätigen wird. Das deutsche Perfekt wahrt die gegenwärtige Bedeutung der bereits erteilten Sendung; „ich“ gibt das ausdrücklich gesetzte אָנֹכִי wieder.
- source_word: בְּהוֹצִיאֲךָ אֶת הָעָם מִמִּצְרַיִם
  choice: Wenn du das Volk aus Ägypten herausführst
  rationale: Der Infinitiv mit ב und dem Suffix der 2. Person Maskulin Singular ist temporal zu verstehen; Mose ist der Handelnde, der das Volk herausführt.
- source_word: תַּעַבְדוּן אֶת הָאֱלֹהִים
  choice: werdet ihr Gott dienen
  rationale: Die Verbform steht im Plural und bezieht Mose samt dem herausgeführten Volk ein. עבד bedeutet „dienen“ und kann im Bezug auf Gott zugleich kultische Verehrung bezeichnen; „dienen“ bewahrt diese Bedeutungsbreite.
- source_word: עַל הָהָר הַזֶּה
  choice: auf diesem Berg
  rationale: Die Formulierung bildet die räumliche Bedeutung von עַל sowie den konkreten Erzählbezug möglichst direkt ab.
theological_decisions:
- issue: Worin das verheißene Zeichen besteht
  choice: Das künftige Dienen Gottes auf diesem Berg nach dem Auszug bildet den Inhalt des Zeichens.
  alternative: Das Zeichen ist Gottes gegenwärtige Zusage seiner Gegenwart oder umfasst sowohl die gegenwärtige Zusage als auch deren künftige Erfüllung.
  rationale: Der Satzbau weist am ehesten auf den folgenden Zukunftssatz als Inhalt des Zeichens. Die Formulierung lässt jedoch die Spannung bestehen, dass die Zusage „Ich werde mit dir sein“ eng mit diesem Zeichen verbunden ist.
translation_notes:
  register: 'Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede wechselt entsprechend dem Hebräischen sachgerecht vom Singular („du“: Mose) zum Plural („ihr“: Mose und das Volk).'
