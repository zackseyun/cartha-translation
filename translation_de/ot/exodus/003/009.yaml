revisions:
- from: 'Und nun: Sieh, das Schreien der Israeliten ist zu mir gedrungen, und ich habe auch gesehen, wie die Ägypter sie unterdrücken.'
  to: 'Und nun, sieh: Der Hilfeschrei der Israeliten ist zu mir gedrungen, und ich habe auch die Unterdrückung gesehen, mit der die Ägypter sie unterdrücken.'
  rationale: Die Revision bewahrt die natürliche deutsche Syntax, stellt aber das im Ausgangstext als Objekt von „gesehen“ stehende Substantiv „Unterdrückung“ wieder her. Die Wiederholung von „Unterdrückung/unterdrücken“ entspricht der hebräischen Verbindung הַלַּחַץ … לֹחֲצִים und ist daher trotz der stilistischen Schwere vorzuziehen. „Hilfeschrei“ verdeutlicht den Notcharakter von צַעֲקָה.
