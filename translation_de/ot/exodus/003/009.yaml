source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: de
  text: 'Und nun, sieh: Der Hilfeschrei der Israeliten ist zu mir gedrungen, und ich habe auch die Unterdrückung gesehen, mit der die Ägypter sie unterdrücken.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die fortführende Konjunktion als auch den zeitlich-folgernden Übergang und klingt im Deutschen natürlich.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Gibt die aufmerksamkeitslenkende Partikel in würdigem, verständlichem Gegenwartsdeutsch wieder; „siehe“ wäre möglich, wirkt jedoch stärker traditionell.
- source_word: צַעֲקַת
  choice: das Schreien
  rationale: Bezeichnet den aus Not erhobenen Hilferuf. „Schreien“ bewahrt die konkrete, eindringliche Bildlichkeit besser als das abstraktere „Klagegeschrei“.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Die etablierte deutsche Volksbezeichnung erfasst hier die Nachkommen beziehungsweise Angehörigen Israels natürlich und ohne den hebräischen Gemeinschaftsausdruck unnötig zu verengen.
- source_word: בָּאָה אֵלַי
  choice: ist zu mir gedrungen
  rationale: Das hebräische Verb bedeutet wörtlich „ist zu mir gekommen“. Beim Schreien ist „zu mir gedrungen“ im Deutschen idiomatisch und bewahrt das Bild, dass der Hilferuf Gott erreicht.
- source_word: וְגַם רָאִיתִי
  choice: und ich habe auch gesehen
  rationale: Erhält die additive Betonung von וְגַם und die gegenwärtige Relevanz der vollendeten Wahrnehmung.
- source_word: הַלַּחַץ
  choice: wie … unterdrücken
  rationale: Das Substantiv bezeichnet bedrückenden Zwang beziehungsweise Unterdrückung. Die deutsche Verbalkonstruktion vermeidet eine schwerfällige Wiederholung, während die Bedeutung erhalten bleibt.
- source_word: מִצְרַיִם לֹחֲצִים
  choice: die Ägypter … unterdrücken
  rationale: מִצְרַיִם bezeichnet formal „Ägypten“, steht hier aber mit einem pluralischen Partizip und meint kollektiv die Ägypter. Die Wiedergabe bewahrt sowohl den Personenbezug als auch die fortdauernde Handlung.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektpronomen verweist auf die Israeliten.
theological_decisions:
- issue: Wiedergabe der Bundes- und Volksbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: „Israeliten“ bezeichnet im Deutschen natürlich das gesamte Volk und schließt in diesem Zusammenhang Frauen und Männer ein. Die wörtliche Form „Söhne Israels“ könnte im heutigen Deutsch fälschlich nur männliche Personen nahelegen; die genealogisch-bundestheologische Zugehörigkeit bleibt durch „Israeliten“ erhalten.
- issue: Gottes Wahrnehmung des Leids
  choice: ist zu mir gedrungen … ich habe auch gesehen
  alternative: ist zu mir gekommen … ich sah
  rationale: Die Formulierungen bewahren die beiden im Hebräischen genannten Wahrnehmungsweisen – Hören beziehungsweise Erreichen des Schreies und Sehen der Unterdrückung – ohne daraus eine zusätzliche Aussage über Gottes Wissen oder Handeln abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach „Und nun“ markiert den folgernden Übergang und lässt „Sieh“ als Aufmerksamkeitsruf hervortreten. Die verbale Wiedergabe „wie die Ägypter sie unterdrücken“ ist natürlicher als die etymologisch engere, aber schwerfällige Form „die Unterdrückung, mit der … sie unterdrücken“.
