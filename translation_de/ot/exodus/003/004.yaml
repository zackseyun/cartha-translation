base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: de
  text: 'Als Jahwe[a] sah, dass er abgebogen war, um nachzusehen, rief Gott ihm aus dem Inneren des Busches[b][c] zu: »Mose, Mose!« Er antwortete: »Hier bin ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Gottesname יהוה wird hier mit »Jahwe« wiedergegeben; traditionell steht dafür »der HERR«.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: »aus der Mitte des Busches«; auch möglich: »aus dem Busch heraus«.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort für »Busch« kann genauer einen Dornbusch bezeichnen.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, damit der Eigenname erhalten bleibt und nicht durch den Titel »der HERR« ersetzt wird.
- source_word: וַיַּרְא
  choice: sah
  rationale: ראה bezeichnet hier im Erzählzusammenhang das Wahrnehmen von Moses’ Bewegung und wird schlicht mit »sah« wiedergegeben.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet den Inhalt dessen ein, was Jahwe sah. Zusammen mit »Als« für den Erzählanschluss ergibt sich natürliches Deutsch.
- source_word: סָר
  choice: abgebogen war
  rationale: סור bedeutet hier, vom bisherigen Weg abzuweichen beziehungsweise zur Seite zu gehen. Das Plusquamperfekt verdeutlicht, dass dies dem Sehen und Rufen vorausging.
- source_word: לִרְאוֹת
  choice: um nachzusehen
  rationale: Der Infinitiv bezeichnet den Zweck von Moses’ Abbiegen. »Nachzusehen« gibt sein bewusstes genaueres Betrachten im Deutschen idiomatisch wieder.
- source_word: וַיִּקְרָא אֵלָיו
  choice: rief Gott ihm … zu
  rationale: קרא mit אֶל bezeichnet den an jemanden gerichteten Ruf. Die deutsche Konstruktion mit »zurufen« bewahrt diese Richtung.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die Wiedergabe als »Gott« erhält die im Hebräischen unmittelbar nebeneinander stehenden Bezeichnungen יְהוָה und אֱלֹהִים.
- source_word: מִתּוֹךְ
  choice: mitten aus
  rationale: Die Formulierung wahrt die räumliche Vorstellung eines Rufes aus dem Inneren beziehungsweise aus der Mitte des Busches.
- source_word: הַסְּנֶה
  choice: der Busch
  rationale: »Busch« ist verständlich und botanisch zurückhaltend; die mögliche genauere Bedeutung »Dornbusch« wird in einer Fußnote genannt.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Mose, Mose!
  rationale: Die Wiederholung des Namens bleibt als eindringliche persönliche Anrede erhalten.
- source_word: הִנֵּנִי
  choice: Hier bin ich
  rationale: Dies ist die natürliche deutsche Entsprechung der festen hebräischen Antwortformel, die Anwesenheit und Bereitschaft ausdrückt, ohne Letztere übermäßig auszudeuten.
theological_decisions:
- issue: Wiedergabe von יְהוָה und אֱלֹהִים im selben Vers
  choice: יְהוָה als »Jahwe« und אֱלֹהִים als »Gott« wiedergeben
  alternative: יְהוָה traditionell als »der HERR« wiedergeben oder beide Bezeichnungen zu »Gott« vereinheitlichen
  rationale: Der hebräische Text verwendet beide Bezeichnungen in unmittelbarer Nähe. Die unterschiedliche Wiedergabe macht diese sprachliche und theologische Spannung sichtbar, ohne sie zu erklären oder einzuebnen.
- issue: Subjekt des abschließenden וַיֹּאמֶר
  choice: Mose als Antwortenden durch »Er antwortete« kenntlich machen
  alternative: Wörtlicher »Und er sagte«, wobei der Bezug aus dem Zusammenhang erschlossen werden muss
  rationale: Nach der direkten Anrede ist Mose eindeutig der Sprecher. »Er antwortete« macht den Gesprächswechsel in natürlichem Deutsch deutlich, ohne dem Inhalt etwas hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau folgt dem hebräischen Handlungsablauf, wird aber für natürliches Deutsch geglättet. Die direkte Rede verwendet deutsche Anführungszeichen.
