  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: de
  text: 'Sie werden auf deine Stimme hören. Dann wirst du zusammen mit den Ältesten Israels zum König von Ägypten gehen und zu ihm sagen: »Jahwe, der Gott der Hebräer, ist uns begegnet.[a] Nun lass uns bitte auf eine Reise von drei Tagen in die Wüste ziehen, damit wir Jahwe, unserem Gott, Opfer darbringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist auf uns zugekommen«. Die hebräische Wendung kann ausdrücken, dass Jahwe ihnen begegnet oder auf sie zugekommen ist.'
    reason: Lexikalische Alternative zu נִקְרָה עָלֵינוּ; die genaue Nuance der göttlichen Begegnung bleibt offen.
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: Sie werden auf deine Stimme hören
  rationale: Die Wiedergabe bewahrt das hebräische Bild der »Stimme« und lässt zugleich die im Verb שׁמע liegende Bedeutung des aufmerksamen und zustimmenden Hörens erkennen, ohne ausdrücklich »gehorchen« zu sagen.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: Dann wirst du zusammen mit den Ältesten Israels … gehen
  rationale: Das singularische Verb mit dem ausdrücklich genannten Mose und den Ältesten wird im Deutschen natürlich mit »zusammen mit« wiedergegeben. »Gehen« entspricht in der Situation der Bewegung zum ägyptischen König.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: König von Ägypten
  rationale: Natürliche und genaue Wiedergabe der hebräischen Genitivverbindung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen gebräuchliche Umschrift des Gottesnamens gibt das Tetragramm als Eigennamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: der Gott der Hebräer
  rationale: Die ethnische Bezeichnung und die hebräische Genitivkonstruktion bleiben unmittelbar erhalten.
- source_word: נִקְרָה עָלֵינוּ
  choice: ist uns begegnet
  rationale: Die Wendung bezeichnet hier eine Begegnung beziehungsweise ein göttliches Entgegentreten. »Ist uns begegnet« bleibt bewusst weiter als eine Deutung im Sinn einer ausdrücklichen Berufung.
- source_word: נֵלֲכָה נָּא
  choice: lass uns bitte … ziehen
  rationale: Der Kohortativ mit נָא formuliert eine höfliche Bitte an den König. »Ziehen« passt zu einer mehrtägigen Reise.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: drei Tagesreisen weit
  rationale: Die Formulierung gibt die hebräische Angabe einer dreitägigen Reisedauer beziehungsweise -strecke knapp und verständlich wieder.
- source_word: בַּמִּדְבָּר
  choice: in die Wüste
  rationale: Wegen des Bewegungsverbs ist im Deutschen die Richtungsangabe »in die« erforderlich. »Wüste« ist für מִדְבָּר in diesem Zusammenhang idiomatisch.
- source_word: וְנִזְבְּחָה לַיהוָה אֱלֹהֵינוּ
  choice: damit wir Jahwe, unserem Gott, Opfer darbringen
  rationale: Der zweite Kohortativ wird als Zweck der erbetenen Reise verstanden. »Opfer darbringen« gibt זבח würdig und allgemein verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den Gottesnamen unmittelbar. »Jahwe« bewahrt ihn als Eigennamen in einer für das Deutsche geläufigen Form.
- issue: Bedeutung von נִקְרָה עָלֵינוּ in der Aussage über Gott
  choice: ist uns begegnet
  alternative: ist auf uns zugekommen; hat uns gerufen
  rationale: Die gewählte Fassung hält den Gedanken einer göttlichen Begegnung fest, ohne die sprachlich mögliche Offenheit durch eine spezifische Berufungsformel zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert, während charakteristische hebräische Bilder wie »auf deine Stimme hören« erhalten bleiben. Der Fußnotenmarker steht bei der tatsächlich erläuterten Wendung.
