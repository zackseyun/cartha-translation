  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: de
  text: 'Gott sagte weiter zu Mose: „So sollst du zu den Israeliten sagen: Jahwe[a], der Gott eurer Väter, der Gott Abrahams, der Gott Isaaks und der Gott Jakobs, hat mich zu euch gesandt. Das ist mein Name für immer, und das ist mein Gedenkname[b] von Generation zu Generation.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH. „Jahwe“ gibt die wahrscheinlichste Aussprache wieder; die genaue antike Aussprache ist nicht völlig sicher.'
    reason: textual-linguistische Erläuterung des Gottesnamens
  - marker: b
    text: 'Hebräisch: „mein Gedenken“; gemeint kann der Name sein, durch den man Gottes gedenkt.'
    reason: lexikalische Mehrdeutigkeit von זִכְרִי
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne Israels“, bezeichnet hier jedoch idiomatisch das Volk Israel. „Israeliten“ ist im modernen Deutschen natürlich und umfasst den angesprochenen Gesamtverband.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: der Gott eurer Väter
  rationale: Die ausdrücklich männliche Verwandtschaftsbezeichnung des Hebräischen bleibt erhalten und knüpft an die anschließend genannten Erzväter an.
- source_word: שְׁלָחַנִי
  choice: hat mich zu euch gesandt
  rationale: Das hebräische Perfekt bezeichnet die vollzogene Sendung, deren Geltung in der gegenwärtigen Botschaft fortbesteht.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Das ist mein Name für immer
  rationale: לְעֹלָם bezeichnet hier unbegrenzte, fortdauernde Geltung; „für immer“ ist klar und idiomatisch.
- source_word: זִכְרִי
  choice: so soll man meiner gedenken
  rationale: Das Substantiv kann das Gedenken beziehungsweise die Bezeichnung, durch die Gott im Gedächtnis bleibt, meinen. Die verbale Formulierung gibt den Sinn im Deutschen verständlich wieder, ohne die Alternative zu verschweigen.
- source_word: לְדֹר דֹּר
  choice: von Generation zu Generation
  rationale: Die Wiederholung von דּוֹר betont die ununterbrochene Weitergabe durch alle aufeinanderfolgenden Generationen.
- source_word: כֹּה תֹאמַר
  choice: So sollst du ... sagen
  rationale: Die deutsche Weisungsformel entspricht dem hebräischen Einleitungssatz natürlich und bewahrt seinen verpflichtenden Charakter.
- source_word: עוֹד
  choice: weiter
  rationale: עוֹד kennzeichnet hier die Fortsetzung der Gottesrede. „Weiter“ vermeidet den möglichen Eindruck, Gott wiederhole lediglich das zuvor Gesagte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH; Jehova
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich als Gottes bleibenden Namen. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen; eine Fußnote nennt die hebräische Konsonantenform und weist auf die unsichere historische Aussprache hin.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels; die Kinder Israels
  rationale: Die Wendung ist eine etablierte kollektive Volksbezeichnung. „Israeliten“ gibt ihren Referenzumfang im heutigen Deutsch präziser wieder, ohne Frauen aus dem angesprochenen Volk auszuschließen.
- issue: Bedeutung von זִכְרִי
  choice: so soll man meiner gedenken
  alternative: dies ist mein Gedenkname; dies ist mein Gedächtnis
  rationale: Der hebräische Ausdruck lässt sowohl das fortdauernde Gedenken an Gott als auch den Namen, durch den seiner gedacht wird, anklingen. Die Hauptfassung ist idiomatisch; die Fußnote bewahrt die substantivische Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Redeformel bleibt feierlich, ohne altertümliches „also“ oder „auf ewig“. Die kollektive Bezeichnung „Israeliten“ ist idiomatisch; „Väter“ bewahrt dagegen bewusst die konkrete patriarchale Bezugnahme. Alle Fußnotenmarker stehen unmittelbar an den erklärten Textstellen.
