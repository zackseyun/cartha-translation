source:
  edition: WLC
  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: de
  text: Aber ich weiß, dass der König von Ägypten euch nicht ziehen lassen wird, es sei denn durch eine starke Hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der König von Ägypten wird euch auch nicht durch eine starke Hand ziehen lassen“; oder: „außer durch eine mächtige Hand“. Die hebräische Satzfügung ist verkürzt und kann hervorheben, dass nur überwältigende Macht den Pharao zum Nachgeben bringen wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Aber ich
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen markiert einen nachdrücklichen, kontrastierenden Übergang; „Aber ich“ gibt dies im Deutschen natürlich wieder.
- source_word: יָדַעְתִּי
  choice: weiß
  rationale: Das Perfekt bezeichnet hier Gottes feststehendes Wissen; das deutsche Präsens ist im Zusammenhang idiomatisch und sachgerecht.
- source_word: כִּי
  choice: dass
  rationale: Die Partikel leitet den Inhalt dessen ein, was Gott weiß.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: euch nicht ziehen lassen wird
  rationale: נתן mit Infinitiv bedeutet hier idiomatisch „erlauben/gehen lassen“. „Ziehen lassen“ ist natürlich, würdig und passt zum Auszugskontext.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Direkte und im modernen Standarddeutsch natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: es sei denn, eine starke Hand zwingt ihn dazu
  rationale: Die hebräische Wendung ist elliptisch. Die Ergänzung macht die im Kontext naheliegende instrumentale Bedeutung verständlich, bewahrt aber mit „starke Hand“ das zentrale Bild des Ausgangstextes.
theological_decisions:
- issue: Deutung der elliptischen Klausel וְלֹא בְּיָד חֲזָקָה
  choice: Der König lässt Israel nur unter dem Zwang einer starken Hand ziehen.
  alternative: 'Der König lässt Israel nicht ziehen, nicht einmal durch eine starke Hand; oder: außer durch eine mächtige Hand.'
  rationale: Vers 20 stützt die Deutung, dass erst Gottes überwältigendes Eingreifen den König zum Nachgeben bringt. Da die hebräische Syntax mehrere Auffassungen zulässt, werden die Alternativen in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Ziehen lassen“ wahrt den Exodus-Bezug; „starke Hand“ erhält das wiederkehrende hebräische Bild. Der Gedankenstrich kennzeichnet die erklärende Ergänzung der elliptischen Schlussklausel.
