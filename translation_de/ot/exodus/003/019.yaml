  source_fidelity: 'Die Hauptaussage ist zutreffend: Gottes sicheres Wissen, der König von Ägypten wird Israel nicht gehen lassen, und die elliptische Wendung von der „starken Hand“ wird kontextgemäß als Ausnahme verstanden. Die Formulierung „eine starke Hand zwingt ihn dazu“ ergänzt jedoch einen ausdrücklichen Zwangsakt und ein Objekt („ihn“), die im Hebräischen nicht stehen. Eine weniger ausgebaute Wiedergabe wahrt die Ellipse und die verbleibende Mehrdeutigkeit besser.'
