id: EXO.3.7
reference: Exodus 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: de
  text: 'Da sagte Jahwe: „Ich habe das Elend meines Volkes in Ägypten sehr wohl gesehen[a] und seinen Hilfeschrei wegen seiner Antreiber[b] gehört; denn ich kenne seine Schmerzen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit nachdrücklicher Wiederholung: „Ich habe wirklich gesehen.“'
    reason: Der hebräische Infinitivus absolutus neben dem finiten Verb verstärkt die Aussage.
  - marker: b
    text: 'Oder: „Bedrücker“ beziehungsweise „Fronaufseher“.'
    reason: Das hebräische Wort bezeichnet jemanden, der andere zur Arbeit oder zu Abgaben antreibt.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: רָאֹה רָאִיתִי
  choice: ich habe … sehr wohl gesehen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; „sehr wohl“ wahrt diese Betonung in natürlichem Deutsch.
- source_word: עֳנִי
  choice: Elend
  rationale: Bezeichnet die bedrückende Notlage des Volkes und umfasst sowohl Leiden als auch Unterdrückung.
- source_word: עַמִּי אֲשֶׁר בְּמִצְרָיִם
  choice: meines Volkes in Ägypten
  rationale: Gibt die Zugehörigkeit und Ortsangabe knapp und idiomatisch wieder, ohne den Sinn der Relativkonstruktion zu verändern.
- source_word: צַעֲקָתָם
  choice: seinen Hilfeschrei
  rationale: Bezeichnet hier den aus Bedrängnis an Gott gerichteten Schrei; der deutsche Singular stimmt mit dem Kollektiv „Volk“ überein.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: wegen seiner Antreiber
  rationale: נֹגְשִׂים sind Aufseher, die Menschen zu Arbeit oder Leistung antreiben; „Antreiber“ erhält diesen konkreten Zug, während „wegen“ die kausale Funktion von מִפְּנֵי wiedergibt.
- source_word: כִּי
  choice: denn
  rationale: Markiert den begründenden Zusammenhang mit Gottes Kenntnis des Leidens.
- source_word: יָדַעְתִּי
  choice: ich kenne
  rationale: Das Perfekt beschreibt hier Gottes gegenwärtige, persönliche Kenntnis und nicht bloß abstrakte Informiertheit.
- source_word: מַכְאֹבָיו
  choice: seine Schmerzen
  rationale: Bewahrt die konkrete Bedeutung des Plurals von מַכְאֹב und vermeidet eine unnötige Verallgemeinerung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Bundesname bleibt als Name sichtbar; „Jahwe“ ist die im modernen Deutschen übliche Form.
- issue: Gottes Kenntnis menschlichen Leidens
  choice: denn ich kenne seine Schmerzen
  alternative: denn ich weiß um seine Leiden
  rationale: „Kennen“ bewahrt die unmittelbare und persönliche Ausdrucksweise des Hebräischen, ohne die Art des göttlichen Wissens näher zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiven Singularpronomen „seinen/seine“ beziehen sich auf „mein Volk“. Die Betonung der hebräischen Verbform wird idiomatisch wiedergegeben; konkrete Leidens- und Zwangsbegriffe bleiben erhalten.
