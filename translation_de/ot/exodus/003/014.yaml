source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: de
  text: 'Da sagte Gott zu Mose: „ICH BIN, DER ICH BIN.“[a] Weiter sagte er: „So sollst du zu den Israeliten sagen:[b] ›ICH BIN hat mich zu euch gesandt.‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ICH WERDE SEIN, DER ICH SEIN WERDE“, beziehungsweise: „ICH WERDE SEIN, WAS ICH SEIN WERDE.“ Das hebräische Verb kann hier sowohl gegenwärtig als auch zukünftig verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „zu den Söhnen Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Die formal plurale Bezeichnung meint in diesem Erzählzusammenhang Israels einen Gott; „Gott“ ist daher die sachgemäße deutsche Wiedergabe.
- source_word: אֶהְיֶה
  choice: ICH BIN
  rationale: Die Qal-Imperfektform 1. Person Singular von היה kann hier gegenwärtig oder zukünftig verstanden werden. Im Haupttext gibt „ICH BIN“ die namensartige Selbstbezeichnung natürlich wieder; die Zukunftsnuance bleibt in der Fußnote erhalten.
- source_word: אֲשֶׁר
  choice: der
  rationale: Im deutschen Satz „ICH BIN, DER ICH BIN“ stellt „der“ den persönlichen Selbstbezug idiomatisch und feierlich her; das Hebräische lässt zugleich sachbezogene Wiedergaben wie „was“ zu, die in der Fußnote berücksichtigt werden.
- source_word: כֹּה תֹאמַר
  choice: So sollst du ... sagen
  rationale: כֹּה leitet die auszurichtende Botschaft ein, während das Imperfekt תֹאמַר hier auffordernde Bedeutung hat. Die Formulierung ist klar, modern und würdevoll.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: zu den Israeliten
  rationale: Die feste hebräische Gruppenbezeichnung „Söhne Israels“ bezeichnet hier das Volk Israel. „Israeliten“ gibt den gemeinten Personenkreis im modernen Deutschen natürlich wieder; die wörtliche Form steht in der Fußnote.
- source_word: שְׁלָחַנִי
  choice: hat mich ... gesandt
  rationale: Das Perfekt bezeichnet die vollzogene Sendung mit gegenwärtiger Relevanz. „Hat mich gesandt“ bewahrt zudem den würdevollen Ton.
- source_word: וַיֹּאמֶר
  choice: Da sagte / Weiter sagte
  rationale: Die beiden Wayyiqtol-Formen führen die Erzählung beziehungsweise die Rede fort. Die variierte Wiedergabe vermeidet schwerfällige Wiederholung, ohne den zweiten Redeakt zu unterschlagen.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstbezeichnung אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: ICH BIN, DER ICH BIN
  alternative: ICH WERDE SEIN, DER ICH SEIN WERDE / ICH WERDE SEIN, WAS ICH SEIN WERDE
  rationale: Die hebräische Imperfektform trägt sowohl gegenwärtige als auch zukünftige Bedeutungsmöglichkeiten. Die traditionelle Präsensform vermittelt im Haupttext die namensartige Selbstvorstellung; die Fußnote bewahrt die echte zeitliche und syntaktische Mehrdeutigkeit.
- issue: Typografische Hervorhebung von אֶהְיֶה
  choice: Großschreibung als „ICH BIN“
  alternative: „Ich bin“ oder „Ich werde sein“
  rationale: Die Großschreibung macht kenntlich, dass der Ausdruck hier als feierliche göttliche Selbstbezeichnung verwendet und anschließend allein wiederholt wird. Sie behauptet keine besondere Großschreibung im Hebräischen.
translation_notes:
  register: Modernes Standarddeutsch mit feierlichem, aber verständlichem Ton. Die traditionelle, namensartige Hauptwiedergabe wird beibehalten, während die genuine Mehrdeutigkeit des Hebräischen ausdrücklich in der Fußnote sichtbar bleibt.
