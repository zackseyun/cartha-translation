  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: de
  text: 'Geh, versammle die Ältesten Israels und sage zu ihnen: »Jahwe, der Gott eurer Väter[a], der Gott Abrahams, Isaaks und Jakobs, ist mir erschienen und hat gesagt: ›Ich habe mich eurer gewiss angenommen[b] und dessen, was euch in Ägypten angetan worden ist.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eurer Väter«; gemeint sind hier insbesondere Abraham, Isaak und Jakob, die unmittelbar danach genannt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Ich habe euch gewiss beachtet« oder traditionell »Ich habe euch gewiss heimgesucht«. Die hebräische Wendung verstärkt das Verb und bezeichnet entschlossene göttliche Zuwendung, die zum Eingreifen führt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Geh
  rationale: Der direkte Imperativ gibt den göttlichen Auftrag knapp und natürlich wieder.
- source_word: וְאָסַפְתָּ אֶת זִקְנֵי יִשְׂרָאֵל
  choice: versammle die Ältesten Israels
  rationale: אָסף bezeichnet hier das Zusammenrufen einer Gruppe; זִקְנֵי יִשְׂרָאֵל ist die etablierte Bezeichnung für die führenden Ältesten der Gemeinschaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: der Gott eurer Väter
  rationale: Die Formulierung bleibt nah am patriarchal geprägten Ausdruck, der unmittelbar durch Abraham, Isaak und Jakob erläutert wird.
- source_word: נִרְאָה אֵלַי
  choice: ist mir erschienen
  rationale: Das Nifal von ראה ist hier die übliche Ausdrucksweise für eine Gotteserscheinung.
- source_word: לֵאמֹר
  choice: und hat gesagt
  rationale: Leitet den Inhalt der göttlichen Botschaft im Deutschen natürlicher ein als eine partizipiale Konstruktion.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Ich habe sehr wohl auf euch geachtet
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage. Die Wiedergabe bezeichnet entschlossene, auf Eingreifen zielende göttliche Zuwendung, ohne sie auf einen bloßen Besuch zu verengen.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם בְּמִצְרָיִם
  choice: und auf das, was euch in Ägypten angetan worden ist
  rationale: Die passive Form bleibt erhalten; ein im Hebräischen nicht genannter Täter wird nicht ergänzt.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt diese Funktion, während „der HERR“ einen Titel an seine Stelle setzen würde.
- issue: Bedeutung von פָּקֹד פָּקַדְתִּי
  choice: Ich habe sehr wohl auf euch geachtet
  alternative: Ich habe euch gewiss heimgesucht / Ich habe mich eurer gewiss angenommen
  rationale: Das Verb kann göttliche Zuwendung, Prüfung oder Eingreifen bezeichnen. Im Kontext ist rettende Zuwendung gemeint; die Übersetzung wahrt dennoch die Grundidee wirksamer Aufmerksamkeit und die Verstärkung der hebräischen Konstruktion.
- issue: Wiedergabe von אֲבֹתֵיכֶם
  choice: eurer Väter
  alternative: eurer Vorfahren
  rationale: Die anschließende Nennung Abrahams, Isaaks und Jakobs zeigt die konkrete patriarchale Ausrichtung. „Väter“ erhält diese Verbindung.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem biblischem Ton. Die gestaffelte Gottesbezeichnung und die verschachtelte direkte Rede des Hebräischen bleiben erkennbar, werden aber durch deutsche Zeichensetzung klar gegliedert.
