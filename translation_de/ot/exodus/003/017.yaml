  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: de
  text: 'Und ich habe gesagt[a]: »Ich werde euch aus dem Elend in Ägypten[b] hinaufführen in das Land der Kanaaniter, Hetiter, Amoriter, Perisiter, Hiwiter und Jebusiter – in ein Land, in dem Milch und Honig fließen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und ich sagte: Ich werde euch hinaufführen …« Die hebräische Verbform ist formal vergangen; im Zusammenhang hat die Aussage weiterhin Geltung.'
    reason: alternative_reading
  - marker: b
    text: »Elend in Ägypten« kann auch mit »Bedrängnis in Ägypten« oder »Unterdrückung in Ägypten« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich habe gesagt
  rationale: Die hebräische Verbform bezeichnet formal eine vergangene Aussage. Das deutsche Perfekt bewahrt den Vergangenheitsbezug und lässt zugleich erkennen, dass Gottes Erklärung in der gegenwärtigen Rede weiterhin gilt.
- source_word: אַעֲלֶה אֶתְכֶם
  choice: Ich werde euch ... hinaufführen
  rationale: Das Hifil von עלה bedeutet hier »hinaufführen« beziehungsweise »hinaufbringen«. »Hinaufführen« bewahrt die Bewegungsrichtung des hebräischen Ausdrucks und klingt im Deutschen natürlich.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: aus dem Elend in Ägypten
  rationale: עֳנִי kann Elend, Bedrängnis oder Unterdrückung bezeichnen. Die Wiedergabe ist verständlich und lässt den konkreten Charakter des Leidens offen; »in Ägypten« verdeutlicht die örtliche Zuordnung des knappen hebräischen Genitivgefüges.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: in das Land der Kanaaniter, Hetiter, Amoriter, Perisiter, Hiwiter und Jebusiter
  rationale: Die Völkernamen stehen im Hebräischen grammatisch im Singular, bezeichnen aber jeweils ein Volk. Deutsche Pluralformen geben diesen Sinn idiomatisch wieder.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: in ein Land, in dem Milch und Honig fließen
  rationale: Die bekannte Metapher für Fruchtbarkeit und Überfluss bleibt vollständig erhalten; die Relativsatzform ist in modernem Deutsch flüssig und würdevoll.
theological_decisions:
- issue: Zeitliche Einordnung der göttlichen Zusage
  choice: 'Und ich habe gesagt: »Ich werde euch ...«'
  alternative: 'Und ich sagte: »Ich werde euch ...«'
  rationale: Das Perfekt gibt die formal vergangene hebräische Aussage wieder und betont zugleich ihre fortbestehende Geltung, ohne die Formulierung zu einer ausdrücklichen Verheißungsformel auszuweiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die traditionelle Bildsprache von Milch und Honig sowie die Bewegungsrichtung »hinaufführen« bleiben erhalten. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
