  text: Der Pharao wandte sich ab, ging in sein Haus und nahm sich auch dies nicht zu Herzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er achtete auch darauf nicht.“ Wörtlicher: „Er richtete sein Herz auch darauf nicht.“'
