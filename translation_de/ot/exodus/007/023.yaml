lexical_decisions:
- source_word: וַיִּפֶן
  choice: wandte sich ab
  rationale: פנה bezeichnet hier im erzählerischen Zusammenhang das Sichabwenden. Die Wiedergabe macht die Bewegung vor dem Gang ins Haus natürlich und präzise deutlich.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Im Deutschen steht der Herrschertitel gewöhnlich mit bestimmtem Artikel.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: ging in sein Haus
  rationale: בוא mit אֶל bezeichnet eine Bewegung zu einem Ort beziehungsweise hinein; aus der Erzählperspektive ist „ging in sein Haus“ idiomatisches modernes Deutsch.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: nahm er sich nicht zu Herzen
  rationale: Die Wendung שׁית לב bedeutet, etwas innerlich zu beachten oder ernst zu nehmen. „Sich etwas zu Herzen nehmen“ bewahrt das Herzbild und klingt im Deutschen natürlich.
- source_word: גַּם לָזֹאת
  choice: auch dies
  rationale: גַּם kann „auch“ oder kontextuell „sogar“ bedeuten. „Auch dies“ wahrt die Anschlussfunktion und vermeidet eine unnötige Verstärkung.
