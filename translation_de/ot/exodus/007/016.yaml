  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: de
  text: 'Und du sollst zu ihm sagen: »Jahwe, der Gott der Hebräer, hat mich zu dir gesandt und gesagt: Lass mein Volk ziehen, damit es mir in der Wüste dient[a]. Doch sieh: Bis jetzt hast du nicht darauf gehört.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit es mich in der Wüste verehrt«. Das hebräische Verb kann sowohl allgemeinen Dienst als auch Gottesverehrung bezeichnen.'
    reason: Lexikalische Alternative zu וְיַעַבְדֻנִי; die religiöse Bedeutung ist möglich, aber nicht die einzig im Verb enthaltene.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: der Gott der Hebräer
  rationale: Die ethnische Bezeichnung des hebräischen Textes bleibt erhalten und wird nicht zu »Israeliten« geglättet.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: hat mich zu dir gesandt und lässt dir sagen
  rationale: Die Formulierung gibt die abgeschlossene Sendung mit gegenwärtiger Geltung wieder; »lässt dir sagen« überträgt die hebräische Einleitungsformel natürlich ins Deutsche.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Die feste Forderungsformel verlangt die Freilassung beziehungsweise das Ziehenlassen des Volkes.
- source_word: וְיַעַבְדֻנִי
  choice: damit es mir ... dient
  rationale: Der Zwecksinn wird deutlich, während »dienen« die Bedeutungsbreite von allgemeinem Dienst bis zu kultischer Verehrung wahrt.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: »Wüste« ist die natürliche deutsche Bezeichnung für das unbewohnte Wildnisgebiet, ohne eine ausschließlich sandige Landschaft vorauszusetzen.
- source_word: וְהִנֵּה
  choice: Doch sieh
  rationale: Die aufmerksamkeitslenkende und im Zusammenhang kontrastierende Kraft des Ausdrucks bleibt in würdiger, verständlicher Sprache erhalten.
- source_word: לֹא שָׁמַעְתָּ עַד כֹּה
  choice: Bis jetzt hast du nicht darauf gehört
  rationale: Die Formulierung bewahrt den Sinn von Hören beziehungsweise Beachten, ohne ihn vollständig auf ausdrücklichen Gehorsam zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt den Gottesnamen unmittelbar; die Transliteration wahrt ihn als Eigennamen.
- issue: Bedeutung von וְיַעַבְדֻנִי
  choice: mir dienen
  alternative: mich verehren
  rationale: Das Verb kann sowohl Dienst im weiteren Sinn als auch religiöse Verehrung bezeichnen. »Dienen« bewahrt diese theologische Bedeutungsbreite.
- issue: Bedeutung von לֹא שָׁמַעְתָּ
  choice: nicht darauf gehört
  alternative: nicht gehorcht
  rationale: Pharaos fehlende Reaktion schließt Ungehorsam ein, doch die Übersetzung erhält das Bild des Hörens und legt das Verb nicht unnötig eng aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; traditionelle biblische Schlüsselbegriffe bleiben erhalten, ohne unnötig altertümliche Syntax.
