  source_fidelity: 'Die wesentlichen Entsprechungen sind zutreffend: »Jahwe«, »der Gott der Hebräer«, »Lass mein Volk ziehen«, der Zwecksinn von וְיַעַבְדֻנִי, »in der Wüste« und »Bis jetzt hast du nicht darauf gehört« geben den hebräischen Text angemessen wieder. Die Wiedergabe von לֵאמֹר als »lässt dir sagen« fügt jedoch eine kausative Nuance hinzu, die im Hebräischen nicht ausgedrückt ist.'
