  terminology: »Jahwe« bewahrt den Gottesnamen als Eigennamen. »Hebräer«, »dienen« und »Wüste« sind terminologisch passend. Die Fußnote erhält die lexikalische Offenheit von עבד, ohne die Bedeutung konfessionell zu verengen.
