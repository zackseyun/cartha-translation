base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: de
  text: Aber die ägyptischen Magier taten durch ihre geheimen Künste[a] dasselbe. Das Herz des Pharaos verhärtete sich[b], und er hörte nicht auf sie, genauso wie Jahwe gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihre Zauberkünste“ bzw. „durch ihre geheimen magischen Künste“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Das Herz des Pharaos wurde hart.“ Im Hebräischen wird in diesem Vers nicht ausdrücklich gesagt, wer oder was die Verhärtung bewirkte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: taten ... dasselbe
  rationale: Die Wendung bedeutet wörtlich „sie taten so“ und verweist auf die unmittelbar zuvor geschilderte Handlung; „taten dasselbe“ stellt diesen Bezug im Deutschen klar und natürlich her.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: die ägyptischen Magier
  rationale: Das Wort bezeichnet hier die Ritual- und Zauberkundigen am Hof des Pharaos. „Magier“ ist im heutigen Deutsch verständlich, ohne ihre genaue Funktion unnötig einzuengen.
- source_word: בְּלָטֵיהֶם
  choice: durch ihre geheimen Künste
  rationale: Die Form bezeichnet verborgene magische Praktiken; „durch“ gibt den instrumentalen Sinn der Präposition wieder, während „geheime Künste“ die Art der Praktiken benennt, ohne eine bestimmte Technik festzulegen.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: Da wurde das Herz des Pharaos hart
  rationale: Die resultative Zustandsveränderung wird wiedergegeben, ohne einen Verursacher zu nennen. Damit bleibt die im Hebräischen offene Frage nach der handelnden Instanz erhalten.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: und er hörte nicht auf sie
  rationale: שׁמע mit אֶל bedeutet hier „auf jemanden hören“ beziehungsweise „jemandem Gehör schenken“. Das Pronomen verweist im Zusammenhang auf Mose und Aaron.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: genauso wie Jahwe es angekündigt hatte
  rationale: Die Formel verweist auf Jahwes vorausgehende Aussage. „Angekündigt hatte“ macht diesen Rückbezug im Deutschen deutlich; das ergänzte „es“ hat keinen eigenständigen sachlichen Inhalt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Urheberschaft der Verhärtung des Pharao
  choice: „Da wurde das Herz des Pharaos hart“ ohne Nennung eines Verursachers
  alternative: „Der Pharao verhärtete sein Herz“ oder „Jahwe verhärtete das Herz des Pharaos“
  rationale: Der hebräische Satz nennt in diesem Vers keinen ausdrücklichen Urheber. Die Übersetzung bewahrt diese Offenheit und trägt keine Deutung aus benachbarten Stellen ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Magier“ und „geheime Künste“ sind allgemein verständlich; die traditionelle Herz-Metapher bleibt erhalten. Der Satzbau folgt dem erzählerischen Fortgang, ohne die Mehrdeutigkeit der Verhärtungsformel aufzulösen.
