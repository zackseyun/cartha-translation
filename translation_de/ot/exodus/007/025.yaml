  text: וַ/יִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת יְהוָ֖ה אֶת הַ/יְאֹֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/025.yaml
  text: And seven days were fulfilled after Yahweh struck the Nile[a][b].
translation:
  language: de
  text: Und es vergingen sieben Tage[a], nachdem Jahwe den Nil[b] geschlagen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und sieben Tage wurden voll“; gemeint ist, dass dieser Zeitraum vollständig verstrich.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „der Nil“; das Wort kann auch allgemeiner mit „der Fluss“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: Und es vergingen
  rationale: Das Nifal von מלא bezeichnet hier das Vollwerden beziehungsweise den Abschluss einer Zeitspanne. Die idiomatische deutsche Formulierung „es vergingen“ gibt den zeitlichen Sinn klar wieder; die stärker formale Ausdrucksweise wird in Fußnote [a] bewahrt.
- source_word: שִׁבְעַת יָמִים
  choice: sieben Tage
  rationale: Die Zahlwortverbindung bezeichnet unmittelbar einen Zeitraum von sieben Tagen.
- source_word: אַחֲרֵי
  choice: nachdem
  rationale: Die temporale Präposition leitet zusammen mit dem Infinitiv eine Handlung ein, nach der die sieben Tage vergingen. Im Deutschen ist ein Nebensatz mit „nachdem“ natürlich und präzise.
- source_word: הַכּוֹת
  choice: geschlagen hatte
  rationale: Der Infinitivus constructus von נכה bezeichnet Jahwes Schlag gegen den Nil. Das Plusquamperfekt ordnet diese Handlung eindeutig vor dem Vergehen der sieben Tage ein, ohne den Gerichtskontext abzuschwächen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הַיְאֹר
  choice: den Nil
  rationale: יְאֹר bezeichnet im ägyptischen Zusammenhang des Exodus konkret den Nil; „Fluss“ wäre möglich, aber weniger bestimmt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namenscharakter und folgt einer im modernen Deutschen gebräuchlichen wissenschaftlichen Umschrift.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die idiomatische Zeitangabe vermeidet eine im Deutschen sperrige Passivform; die Fußnote hält die bildhafte Form des hebräischen Verbs sichtbar.
