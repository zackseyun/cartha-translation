  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Sieh, ich habe dich für den Pharao zu Gott gemacht, und dein Bruder Aaron wird dein Prophet sein.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Wayyiqtol führt die Handlung fort; „Da sagte“ ist im modernen Deutschen natürlich und bewahrt die zeitlich-fortschreitende Funktion.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ lenkt Moses Aufmerksamkeit nachdrücklich auf die folgende Aussage; „Sieh“ erhält die knappe Bildlichkeit des Hebräischen.
- source_word: נְתַתִּיךָ
  choice: ich habe dich … gemacht
  rationale: Wörtlich steht „ich habe dich gegeben/gesetzt“; mit dem Prädikatsausdruck אֱלֹהִים bezeichnet das Verb hier die Einsetzung in eine Rolle. „gemacht“ bildet diese resultative Bedeutung natürlich ab.
- source_word: אֱלֹהִים לְפַרְעֹה
  choice: für den Pharao zu Gott
  rationale: Die direkte prädikative Formulierung bewahrt die markante Aussage des Hebräischen und die durch Aarons Rolle als Prophet erläuterte Repräsentationsstruktur, ohne durch „wie Gott“ einen im Ausgangstext nicht ausgedrückten Vergleich einzufügen.
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: und dein Bruder Aaron
  rationale: Diese deutsche Wortstellung ist natürlich und gibt sowohl die Person als auch das Verwandtschaftsverhältnis vollständig wieder.
- source_word: יִהְיֶה נְבִיאֶךָ
  choice: wird dein Prophet sein
  rationale: Das hebräische Standardwort für „Prophet“ bleibt erhalten; die Zukunftsform gibt die noch auszuübende Funktion Aarons klar wieder.
theological_decisions:
- issue: Mose wird in Bezug auf den Pharao אֱלֹהִים genannt
  choice: für den Pharao zu Gott
  alternative: für den Pharao wie Gott
  rationale: Das Hebräische enthält keine ausdrückliche Vergleichspartikel. Die ungewöhnliche, theologisch spannungsvolle Formulierung wird daher nicht abgeschwächt. Der Kontext — besonders Aaron als Moses Prophet — zeigt eine von Gott verliehene repräsentative Autorität, ohne Mose seinem Wesen nach zu Gott zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe und auffällige Rollenformulierung des Hebräischen bleibt erhalten; „für den Pharao“ klingt im Deutschen natürlicher als das formal mögliche „dem Pharao gegenüber“ und bewahrt den relationalen Sinn der Präposition.
