base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: de
  text: Der Nil wird von Fröschen wimmeln. Sie werden heraufkommen und in dein Haus kommen, in dein Schlafzimmer und auf dein Bett, in die Häuser deiner Diener und unter dein Volk, in deine Öfen und in deine Backtröge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Teigschüsseln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: wird … wimmeln
  rationale: Das Verb bezeichnet ein massenhaftes Wimmeln kleiner Lebewesen; die deutsche Wendung bewahrt das lebendige Bild. Der Zukunftsbezug ergibt sich aus der Ankündigung der Plage.
- source_word: הַיְאֹר
  choice: der Nil
  rationale: Im ägyptischen Zusammenhang des Exodus bezeichnet יְאֹר den Nil, nicht lediglich einen unbestimmten Fluss.
- source_word: צְפַרְדְּעִים
  choice: Frösche
  rationale: Direkte und eindeutige Wiedergabe des hebräischen Plurals.
- source_word: וְעָלוּ
  choice: sie werden heraufkommen
  rationale: עלה beschreibt hier die Bewegung der Frösche aus dem Nil hinauf aufs Land und in die Wohnbereiche.
- source_word: וּבָאוּ
  choice: eindringen
  rationale: בוא mit den folgenden Ortsangaben bezeichnet das Hineinkommen. „Eindringen“ gibt in natürlichem Deutsch zugleich den bedrohlichen Kontext wieder, ohne den Sinn zu überzeichnen.
- source_word: בְּבֵיתֶךָ
  choice: in dein Haus
  rationale: In der Aufzählung konkreter Orte ist das Wohnhaus des Pharaos gemeint, nicht abstrakt sein Haushalt.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: in dein Schlafzimmer
  rationale: Die wörtliche Wendung „Kammer deines Schlafens/Liegens“ wird durch das heutige, klare „Schlafzimmer“ treffend wiedergegeben.
- source_word: וְעַל מִטָּתֶךָ
  choice: auf dein Bett
  rationale: Die Präposition עַל wird ausdrücklich als „auf“ wiedergegeben und hebt so das unmittelbare Eindringen in den intimsten Bereich hervor.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: in die Häuser deiner Diener
  rationale: 'Das singularische Konstrukt בית mit pluralischem Genitiv ist hier sinnvoll distributiv zu verstehen: die jeweiligen Häuser der Diener.'
- source_word: וּבְעַמֶּךָ
  choice: zu deinem Volk
  rationale: Bei Personen wäre „in dein Volk“ im Deutschen unnatürlich. „Zu deinem Volk“ bewahrt die Reihung unter dem Bewegungsverb und bezeichnet das Vordringen zu den Menschen.
- source_word: וּבְתַנּוּרֶיךָ
  choice: in deine Öfen
  rationale: תנור bezeichnet häusliche Backöfen; „Öfen“ ist knapp, verständlich und kontextgerecht.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: in deine Backtröge
  rationale: Das Substantiv bezeichnet Gefäße zur Teigbereitung. „Backtröge“ ist anschaulich und passt zu den antiken Gefäßen; „Teigschüsseln“ ist eine verständliche Alternative.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Bewegung vom Nil bis in die privaten und häuslichen Bereiche. Die wiederholten Ortsangaben bleiben zur Wahrung der steigernden Aufzählung erhalten; die Satzteilung verbessert die Verständlichkeit, ohne die syntaktische Verbindung der Handlungen aufzugeben.
