source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: »Sag zu Aaron: ›Nimm deinen Stab und strecke deine Hand über die Gewässer Ägyptens aus – über ihre Flüsse, ihre Nilkanäle, ihre Teiche und alle ihre Wasseransammlungen –, damit sie zu Blut werden. Dann wird es im ganzen Land Ägypten Blut geben, sogar in Gefäßen aus Holz und Stein.[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und im Holz und im Stein«; vermutlich sind Gefäße oder Behälter aus diesen Materialien gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מַטְּךָ
  choice: deinen Stab
  rationale: Die natürliche und konkrete deutsche Entsprechung im Erzählzusammenhang.
- source_word: וּנְטֵה יָדְךָ
  choice: strecke deine Hand … aus
  rationale: Bewahrt das hebräische Handlungsbild und klingt im modernen Deutsch natürlich.
- source_word: מֵימֵי מִצְרַיִם
  choice: die Gewässer Ägyptens
  rationale: „Gewässer“ bezeichnet zusammenfassend die anschließend aufgezählten Arten von Wasserläufen und Wasserflächen.
- source_word: נַהֲרֹתָם
  choice: ihre Flüsse
  rationale: Gibt den breiten Begriff für Flüsse beziehungsweise größere Wasserläufe wieder.
- source_word: יְאֹרֵיהֶם
  choice: ihre Nilkanäle
  rationale: Unterscheidet die ägyptisch geprägten Nilwasserläufe von den zuvor genannten Flüssen und wahrt den örtlichen Kontext.
- source_word: אַגְמֵיהֶם
  choice: ihre Teiche
  rationale: Eine verständliche Wiedergabe für stehende oder gesammelte Wasserflächen; auch „Sümpfe“ wäre lexikalisch möglich.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: alle ihre Wasseransammlungen
  rationale: Bewahrt den umfassenden Sinn von מִקְוֶה, ohne eine bestimmte Art künstlichen Speichers vorauszusetzen.
- source_word: וְיִהְיוּ דָם
  choice: damit sie zu Blut werden
  rationale: Drückt nach den Imperativen den beabsichtigten Erfolg aus.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: sogar in Gefäßen aus Holz und Stein
  rationale: Versteht die Materialien im Kontext der Wasservorräte metonymisch als Gefäße, macht die Ergänzung jedoch durch eine Fußnote transparent.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Name wird sichtbar bewahrt; ein traditioneller Ersatztitel steht nicht im hebräischen Ausgangstext.
- issue: Deutung von וּבָעֵצִים וּבָאֲבָנִים
  choice: Gefäße aus Holz und Stein
  alternative: im Holz und im Stein
  rationale: Der unmittelbare Zusammenhang handelt von Wasser und Wasservorräten, weshalb eine metonymische Bezeichnung hölzerner und steinerner Gefäße wahrscheinlich ist. Da der hebräische Ausdruck elliptisch bleibt, wird die wörtlichere Lesart in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählung folgt eng der hebräischen Struktur, während „Gewässer“, „Nilkanäle“ und „Wasseransammlungen“ die Begriffe verständlich voneinander abgrenzen. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Ergänzung.
