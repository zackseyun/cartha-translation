base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: de
  text: Da rief auch der Pharao die Weisen und die Zauberer herbei; auch sie, die ägyptischen Magier, taten durch ihre Zauberkünste[a] dasselbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihre geheimen Künste“. Der hebräische Ausdruck kann magische oder geheime Praktiken bezeichnen; die genaue Bedeutung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ließ … rufen
  rationale: קרא bezeichnet hier das Herbeirufen an den Hof; die deutsche Wendung gibt den veranlassenden Sinn natürlich wieder.
- source_word: גַּם
  choice: auch
  rationale: Das erste גַּם kennzeichnet die Handlung des Pharaos als Reaktion auf das zuvor berichtete Zeichen.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Der substantivierte Plural bezeichnet kundige beziehungsweise gelehrte Hofleute; „die Weisen“ ist verständlich und bewahrt die allgemeine Bedeutung.
- source_word: מְכַשְּׁפִים
  choice: Zauberer
  rationale: Der Ausdruck bezeichnet Ausübende von Zauberei und bleibt damit vom folgenden חַרְטֻמִּים unterschieden.
- source_word: וַיַּעֲשׂוּ … כֵּן
  choice: taten … dasselbe
  rationale: Die feste Verbindung meint hier, dass sie die zuvor geschilderte Handlung nachahmten.
- source_word: גַם הֵם
  choice: auch sie
  rationale: Die Formulierung betont, dass die ägyptischen Fachleute das Zeichen ebenfalls nachahmten.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: die Magier Ägyptens
  rationale: חַרְטֻמִּים bezeichnet die ägyptischen Ritual- und Hofspezialisten; „Magier“ ist im Kontext klar und unterscheidet den Ausdruck von „Zauberer“.
- source_word: בְּלַהֲטֵיהֶם
  choice: durch ihre Zauberkünste
  rationale: Die Präposition bezeichnet das Mittel; לַהֲטִים verweist hier wahrscheinlich auf magisch-okkulte Praktiken, ohne deren genaue Art festzulegen.
theological_decisions:
- issue: Art der Macht der ägyptischen Magier
  choice: 'Phänomenologisch formulieren: Sie „taten … dasselbe“ durch ihre Zauberkünste.'
  alternative: Ausdrücklich ein echtes übernatürliches Wirken oder bloße Täuschung behaupten.
  rationale: Der hebräische Text berichtet die Nachahmung, erklärt aber nicht, ob sie durch übernatürliche Macht, Illusion oder Täuschung zustande kam.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „auch“ bildet die beiden Vorkommen von גַּם ab; „Zauberer“ und „Magier“ bewahren die Unterscheidung der beiden hebräischen Bezeichnungen.
