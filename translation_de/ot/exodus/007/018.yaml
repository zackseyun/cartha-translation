  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: de
  text: Die Fische im Nil[a] werden sterben, und der Nil wird stinken. Die Ägypter werden nicht in der Lage sein, Wasser aus dem Nil zu trinken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Fluss“; im Kontext ist der Nil gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Die Ägypter werden es leid sein, Wasser aus dem Nil zu trinken.“ Das hebräische Verb kann Erschöpfung oder eine dadurch verursachte Unfähigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: die Fische
  rationale: Das hebräische Singularwort bezeichnet hier kollektiv den Fischbestand; „die Fische“ ist im Deutschen natürlich und genau.
- source_word: יְאֹר
  choice: Nil
  rationale: יְאֹר bezeichnet im Kontext des Exodus den Nil. Die konkrete Benennung ist für heutige Leser klarer als das wörtlichere „Strom“.
- source_word: תָּמוּת
  choice: werden sterben
  rationale: Die einfache und direkte Wiedergabe von מות bewahrt die nüchterne Aussage des Hebräischen.
- source_word: וּבָאַשׁ
  choice: wird stinken
  rationale: באש bezeichnet das Entstehen eines üblen Geruchs. „Stinken“ gibt die anschauliche, unbeschönigte Ausdrucksweise wieder.
- source_word: וְנִלְאוּ
  choice: werden es nicht schaffen
  rationale: Das Nifal von לאה kann Erschöpfung oder eine daraus folgende Unfähigkeit ausdrücken. Im Zusammenhang bezeichnet es die praktische Unmöglichkeit, Nilwasser zu trinken; die zugrunde liegende Nuance wird in einer Fußnote bewahrt.
- source_word: לִשְׁתּוֹת מַיִם
  choice: Wasser zu trinken
  rationale: Die ausdrückliche Nennung von מַיִם wird beibehalten und entspricht natürlichem Deutsch.
- source_word: מִן הַיְאֹר
  choice: aus dem Nil
  rationale: „Aus dem Nil“ ist die idiomatische deutsche Wiedergabe der Herkunftsangabe mit מִן.
