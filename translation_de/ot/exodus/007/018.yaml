  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Erzählton. Die drastische Sinneswirkung von „stinken“ wird nicht abgeschwächt; die Mehrdeutigkeit von וְנִלְאוּ bleibt durch die Fußnote sichtbar.
