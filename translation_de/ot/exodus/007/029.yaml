  yaml_path: translation/ot/exodus/007/029.yaml
  text: The frogs will come up on you[a], on your people, and on all your servants.
translation:
  language: de
  text: Die Frösche werden über dich, über dein Volk und über alle deine Diener heraufkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im zweiten Glied: „unter deinem Volk“. Im Hebräischen steht in allen drei Wendungen dieselbe Präposition; im Zusammenhang bezeichnet sie das Überkommen der Plage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: an dir
  rationale: Die Präposition בְּ bezeichnet hier zusammen mit עָלָה das bedrängende Herankommen der Frösche an den Pharao. „An dir hochkriechen“ ist im Deutschen anschaulich und natürlich.
- source_word: וּבְעַמְּךָ
  choice: an deinem Volk
  rationale: Die Wiederholung von „an“ bewahrt die hebräische Parallelstruktur und stellt das ganze Volk als von der Plage unmittelbar betroffen dar.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: an allen deinen Dienern
  rationale: עֶבֶד kann Diener, Sklave oder königlicher Beamter bedeuten. „Diener“ bewahrt hier die Bedeutungsbreite, ohne den gesellschaftlichen Status genauer festzulegen, als es der Vers erlaubt.
- source_word: יַעֲלוּ
  choice: werden … hochkriechen
  rationale: עָלָה bedeutet „hinaufsteigen, heraufkommen“. Bei Fröschen gibt „hochkriechen“ sowohl die Aufwärtsbewegung als auch das körperliche Befallen von Menschen idiomatisch wieder.
- source_word: הַצְפַרְדְּעִים
  choice: Die Frösche
  rationale: Der bestimmte Artikel wird wiedergegeben und verweist auf die angekündigte Froschplage.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Hochkriechen“ bildet die konkrete Bewegung der Frösche natürlicher ab als das wörtlichere „heraufkommen“; die Fußnote dokumentiert die mögliche allgemeinere Wiedergabe.
