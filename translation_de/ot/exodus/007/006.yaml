  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: de
  text: Mose und Aaron taten, wie Jahwe[a] ihnen geboten hatte; so taten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: taten
  rationale: Das Verb עשה bedeutet allgemein »tun/machen«. Im Zusammenhang mit der Ausführung eines Gebots ist »taten« die natürliche deutsche Wiedergabe und nimmt zugleich die Wiederholung am Versende auf.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: וְאַהֲרֹן
  choice: und Aaron
  rationale: Einfache Verbindung der beiden Namen; »Aaron« ist die gebräuchliche deutsche Namensform.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet die Übereinstimmung zwischen dem Gebot und dessen Ausführung ein. Zusammen mit »genau so« im zweiten Satzteil bleibt der Nachdruck des Hebräischen erhalten.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: צוה bezeichnet das Erteilen eines Gebots. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass das Gebot der Ausführung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen JHWH als im Deutschen übliche wissenschaftliche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֹתָם
  choice: ihnen
  rationale: Die hebräische Akkusativmarkierung mit Suffix bezeichnet Mose und Aaron als Empfänger des Gebots. Deutsch verlangt bei »jemandem gebieten« den Dativ.
- source_word: כֵּן
  choice: genau so
  rationale: Das Adverb bekräftigt, dass ihr Handeln dem Gebot entsprach. »Genau so« bringt diesen Nachdruck idiomatisch zum Ausdruck.
- source_word: עָשׂוּ
  choice: taten sie es
  rationale: Bewahrt die auffällige Wiederholung von עשה und ergibt zugleich einen vollständigen, natürlichen deutschen Satz.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den persönlichen Gottesnamen; die traditionelle Ersatzwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Verwendung von »taten« bewahrt die betonte Wiederholung des hebräischen Textes; das abschließende »es« sorgt für natürliche deutsche Syntax.
