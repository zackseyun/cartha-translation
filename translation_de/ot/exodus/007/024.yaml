  text: וַ/יַּחְפְּר֧וּ כָל מִצְרַ֛יִם סְבִיבֹ֥ת הַ/יְאֹ֖ר מַ֣יִם לִ/שְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִ/שְׁתֹּ֔ת מִ/מֵּימֵ֖י הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: de
  text: Und alle Ägypter gruben rings um den Nil nach Trinkwasser, denn sie konnten das Wasser des Nils nicht trinken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: gruben
  rationale: חפר bezeichnet das Graben oder Ausschachten. „Gruben“ gibt die Handlung direkt wieder, ohne wie „gruben Brunnen“ ein im Hebräischen nicht ausdrücklich genanntes Objekt hinzuzufügen.
- source_word: כָל מִצְרַיִם
  choice: alle Ägypter
  rationale: Die wörtlich auch als „ganz Ägypten“ mögliche Kollektivbezeichnung meint hier die Menschen Ägyptens, die wegen des untrinkbaren Nilwassers graben.
- source_word: סְבִיבֹת הַיְאֹר
  choice: rings um den Nil
  rationale: סְבִיבֹת bezeichnet die Umgebung beziehungsweise den Bereich ringsum. „Rings um den Nil“ ist prägnant und natürlich.
- source_word: הַיְאֹר
  choice: der Nil
  rationale: יְאֹר bedeutet formal „der Strom/Fluss“, bezeichnet im Exoduskontext jedoch konkret den Nil. Die Wiedergabe mit dem Eigennamen macht den historischen Bezug unmittelbar verständlich.
- source_word: מַיִם לִשְׁתּוֹת
  choice: nach Trinkwasser
  rationale: Wörtlich steht „Wasser zum Trinken“. Nach dem deutschen Verb „graben“ drückt „nach Trinkwasser“ den Zweck idiomatisch und präzise aus.
- source_word: כִּי לֹא יָכְלוּ
  choice: denn sie konnten … nicht
  rationale: כִּי leitet hier die Begründung für das Graben ein. „Denn“ bewahrt die erklärende Verknüpfung natürlich.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: das Wasser des Nils nicht trinken
  rationale: Die Präposition מִן kann beim Trinken die Quelle bezeichnen. Natürliches Deutsch kann dies ohne ein ausdrückliches „von/aus“ wiedergeben; gemeint ist, dass das Nilwasser nicht trinkbar war.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am hebräischen Ablauf, während „nach Trinkwasser graben“ gegenüber dem wörtlicheren „Wasser zum Trinken graben“ idiomatisches Deutsch bietet. Keine Fußnote ist nötig, da „Nil“ den kontextuell eindeutigen Referenten von יְאֹר direkt nennt.
