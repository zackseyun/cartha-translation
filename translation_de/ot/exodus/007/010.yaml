base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: de
  text: So gingen Mose und Aaron zum Pharao und taten es genauso, wie Jahwe es geboten hatte. Dann warf Aaron seinen Stab vor dem Pharao und vor seinen Dienern hin, und der Stab wurde zu einer Schlange.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort tannin kann auch ein großes Reptil oder ein drachenartiges Wesen bezeichnen; in diesem Zeichenkontext ist wahrscheinlich eine Schlange gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: So gingen ... zum Pharao
  rationale: Das morphologisch singularische Verb steht vor dem zusammengesetzten Subjekt „Mose und Aaron“ und bezieht sich kollektiv auf beide. „zum Pharao gehen“ gibt die Bewegung in seine Gegenwart natürlich wieder.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: und taten es genauso
  rationale: Die idiomatische Wendung bezeichnet die genaue Ausführung des zuvor erteilten Auftrags.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: wie ... es geboten hatte
  rationale: Die Formulierung drückt Übereinstimmung mit einem vorausgegangenen Gebot aus; das Plusquamperfekt bildet dessen zeitlichen Vorrang ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: וַיַּשְׁלֵךְ
  choice: warf ... hin
  rationale: Die Wendung gibt die konkrete, demonstrative Wurfhandlung in natürlichem modernem Deutsch wieder.
- source_word: מַטֵּהוּ
  choice: seinen Stab
  rationale: „Stab“ ist die direkte und im Kontext natürliche Bezeichnung des Gegenstands.
- source_word: לִפְנֵי ... וְלִפְנֵי
  choice: vor ... und vor
  rationale: Die Wiederholung wird bewahrt und unterstreicht, dass das Zeichen öffentlich vor dem Pharao und seinem Hof geschah.
- source_word: עֲבָדָיו
  choice: dessen Dienern
  rationale: „Diener“ bewahrt die Grundbedeutung; das Pronomen „dessen“ vermeidet im Deutschen einen möglichen falschen Bezug auf Aaron.
- source_word: וַיְהִי לְתַנִּין
  choice: und er wurde zu einem schlangenartigen Wesen
  rationale: תַּנִּין bezeichnet je nach Kontext eine Schlange, ein großes Reptil oder ein drachenartiges Wesen. Die offenere Formulierung wahrt die lexikalische Breite, ohne im Zeichenkontext den Schlangenbezug zu verlieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen. Seine Wiedergabe als „Jahwe“ bewahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von תַּנִּין
  choice: schlangenartiges Wesen
  alternative: Schlange; Drache; großes Reptil
  rationale: Der Ausdruck hat eine größere Bedeutungsbreite als נָחָשׁ, das in Exodus 4,3 verwendet wird. Eine offene Wiedergabe bewahrt diesen Unterschied und die mögliche ägyptische beziehungsweise kosmische Resonanz, ohne eine bestimmte Deutung festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die Satzfolge bleibt nah am hebräischen Erzählstil. Bei תַּנִּין wird die echte lexikalische Mehrdeutigkeit im Haupttext und in der Fußnote sichtbar gehalten.
