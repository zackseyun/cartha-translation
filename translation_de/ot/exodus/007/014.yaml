source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Das Herz des Pharaos ist schwer[a]; er weigert sich, das Volk ziehen zu lassen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Herz des Pharaos ist hart.“ Das hebräische Adjektiv bedeutet wörtlich „schwer“ und bezeichnet hier bildlich seine Hartnäckigkeit oder Unzugänglichkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Präteritum mit וַ־ führt die Handlung fort; „Da sagte“ gibt die zeitliche Folge in natürlichem deutschem Erzählstil wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; der Name מֹשֶׁה wird nach deutscher Konvention als „Mose“ wiedergegeben.
- source_word: כָּבֵד לֵב פַּרְעֹה
  choice: Das Herz des Pharaos ist schwer
  rationale: כָּבֵד bedeutet wörtlich „schwer“. Die konkrete Metapher bleibt erhalten, damit die besondere Wortwahl gegenüber anderen Verben und Adjektiven der Verstockungserzählung nicht eingeebnet wird.
- source_word: מֵאֵן
  choice: er weigert sich
  rationale: Die Form beschreibt die anhaltende Weigerung des Pharaos; das deutsche Präsens gibt diesen fortbestehenden Zustand natürlich wieder.
- source_word: לְשַׁלַּח הָעָם
  choice: das Volk ziehen zu lassen
  rationale: שׁלח bezeichnet hier die Erlaubnis zum Aufbruch beziehungsweise die Freilassung. „ziehen lassen“ ist im Exoduskontext idiomatisch; הָעָם bleibt ohne erklärenden Zusatz „das Volk“.
theological_decisions:
- issue: Wiedergabe des Zustands von Pharaos Herz innerhalb des Verstockungsmotivs
  choice: Das Herz des Pharaos ist schwer
  alternative: Das Herz des Pharaos ist hart / verhärtet
  rationale: Der hebräische Text verwendet hier כָּבֵד („schwer“) und nicht einfach die übliche deutsche Kurzformel „hart“. Die wörtliche Metapher bewahrt die unterschiedliche Begrifflichkeit der Verstockungstexte und lässt deren theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber verständliche Metapher „Das Herz … ist schwer“ wird wegen ihrer Bedeutung für die hebräische Wortwahl im Haupttext bewahrt und durch eine Fußnote erläutert.
