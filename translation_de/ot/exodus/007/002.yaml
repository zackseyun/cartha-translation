  text: אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כָּל אֲשֶׁ֣ר אֲצַוֶּ֑/ךָּ וְ/אַהֲרֹ֤ן אָחִ֨י/ךָ֙ יְדַבֵּ֣ר אֶל פַּרְעֹ֔ה וְ/שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: de
  text: Du sollst alles sagen, was ich dir gebiete, und dein Bruder Aaron soll zum Pharao sprechen, damit er die Söhne Israels[a] aus seinem Land ziehen lässt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“; traditionell: „die Kinder Israels“. Wörtlich steht im Hebräischen: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: sollst … sagen
  rationale: Das Piel von דבר bezeichnet hier das mündliche Weitergeben der göttlichen Weisung. „Sollst … sagen“ gibt den verpflichtenden Charakter im heutigen Deutsch natürlich wieder.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: alles …, was ich dir gebiete
  rationale: Die Formulierung bewahrt den umfassenden Sinn von כָּל und den Weisungscharakter von צוה. Das Präsens eignet sich für den fortlaufenden Auftrag.
- source_word: וְאַהֲרֹן אָחִיךָ
  choice: und dein Bruder Aaron
  rationale: Diese im Deutschen natürliche Wortstellung gibt sowohl die Verwandtschaftsbezeichnung als auch den Eigennamen klar wieder.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: soll zum Pharao sprechen
  rationale: „Zu jemandem sprechen“ entspricht דבר אֶל, ohne den Inhalt der Rede über das Hebräische hinaus festzulegen.
- source_word: וְשִׁלַּח
  choice: damit er … ziehen lässt
  rationale: Das Piel von שׁלח bezeichnet hier das Fortschicken beziehungsweise Freilassen. „Ziehen lässt“ ist im Exoduszusammenhang idiomatisch; „damit“ gibt die beabsichtigte Folge wieder, ohne ihren tatsächlichen Eintritt vorwegzunehmen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche Wendung bewahrt das Abstammungsbild und die Quelltextur. Eine Fußnote nennt die im Deutschen geläufigere kollektive Wiedergabe.
- source_word: מֵאַרְצוֹ
  choice: aus seinem Land
  rationale: Die Präposition מִן bezeichnet die Bewegung aus dem Herrschaftsgebiet des Pharaos heraus; „aus seinem Land“ ist präzise und natürlich.
theological_decisions:
- issue: Verhältnis zwischen Aarons Rede und dem Handeln des Pharaos
  choice: damit er … ziehen lässt
  alternative: und er wird … ziehen lassen
  rationale: Die gewählte finale Formulierung lässt Ziel und erwartete Folge der Rede erkennen, behauptet aber nicht, dass der Pharao unmittelbar oder zwangsläufig gehorchen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Auftrag, während „ziehen lässt“ den kausativen Sinn idiomatisch ausdrückt.
