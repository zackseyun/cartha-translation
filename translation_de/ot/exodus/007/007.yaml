  terminology: „Mose“, „Aaron“ und „Pharao“ entsprechen dem etablierten deutschen Bibelgebrauch. Die Altersangaben sind idiomatisch; die Fußnote macht die hebräische בן-…-שנה-Altersformel sowie die ursprüngliche Zahlenreihenfolge nachvollziehbar.
