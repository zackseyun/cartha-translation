  source_fidelity: 'Der Haupttext gibt beide hebräischen Altersformeln korrekt und idiomatisch wieder: Mose ist achtzig, Aaron dreiundachtzig Jahre alt. Die temporale Wendung בְּדַבְּרָם ist treffend mit „als sie … sprachen“ wiedergegeben; אֶל wird angemessen durch „zum“ wiedergegeben. Das einleitende Waw muss im modernen Deutschen nicht mit einem satzinitialen „Und“ reproduziert werden.'
