  text: וּ/מֹשֶׁה֙ בֶּן שְׁמֹנִ֣ים שָׁנָ֔ה וְ/אַֽהֲרֹ֔ן בֶּן שָׁלֹ֥שׁ וּ/שְׁמֹנִ֖ים שָׁנָ֑ה בְּ/דַבְּרָ֖/ם אֶל פַּרְעֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: de
  text: Mose war achtzig Jahre alt[a], und Aaron war dreiundachtzig Jahre alt, als sie zum Pharao sprachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und Mose war ein Sohn von achtzig Jahren und Aaron ein Sohn von drei und achtzig Jahren, als sie zum Pharao sprachen.«'
    reason: Die Fußnote macht die bildhafte hebräische Altersformel und die ursprüngliche Zahlenfolge sichtbar, ohne sie in den Haupttext zu übertragen.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: war … Jahre alt
  rationale: Die hebräische Altersangabe lautet wörtlich »Sohn von … Jahren«; im modernen Deutschen wird sie idiomatisch mit »… Jahre alt sein« wiedergegeben.
- source_word: שְׁמֹנִים שָׁנָה
  choice: achtzig Jahre alt
  rationale: Die Kardinalzahl bezeichnet hier das Lebensalter Moses und wird im Deutschen in der üblichen Altersformel wiedergegeben.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: dreiundachtzig Jahre alt
  rationale: Das Hebräische ordnet die Zahl als »drei und achtzig«; die deutsche Zahlbildung »dreiundachtzig« entspricht sowohl dem Wert als auch natürlichem Sprachgebrauch.
- source_word: בְּדַבְּרָם
  choice: als sie … sprachen
  rationale: Die Präposition בְּ mit Infinitivus constructus und Suffix bezeichnet hier den zeitlichen Umstand des Sprechens.
- source_word: אֶל
  choice: zu
  rationale: Bei an eine Person gerichteter Rede entspricht »zu jemandem sprechen« dem hebräischen אֶל natürlich und genau.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Dies ist die etablierte deutsche Wiedergabe des ägyptischen Herrschertitels.
- source_word: וּ
  choice: und
  rationale: Das einleitende Waw verbindet den Satz mit dem vorhergehenden Erzählzusammenhang. Da deutsches »und« am Satzanfang hier entbehrlich und schwerfällig wäre, wird die Verbindung zwischen Mose und Aaron ausdrücklich wiedergegeben, ohne ein nicht vorhandenes »nun« einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Sprachen« bewahrt gegenüber »redeten« einen leicht gehobenen, aber weiterhin natürlichen biblischen Ton. Die Altersangaben werden zur Klarheit bei beiden Personen vollständig formuliert.
