  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לְ/שַׁלֵּ֑חַ הִנֵּ֣ה אָנֹכִ֗י נֹגֵ֛ף אֶת כָּל גְּבוּלְ/ךָ֖ בַּֽ/צְפַרְדְּעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/027.yaml
  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: de
  text: Doch wenn du dich weigerst, sie ziehen zu lassen, siehe, dann werde ich dein ganzes Gebiet mit Fröschen schlagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und wenn du dich weigerst, sie ziehen zu lassen, siehe, dann bin ich im Begriff, dein ganzes Land mit Fröschen zu schlagen.“ Das hebräische Partizip kann eine unmittelbar bevorstehende Handlung oder schlicht die Zukunft ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die Verbindung leitet eine Bedingung ein, die der zuvor erhobenen Forderung Gottes entgegensteht. „Doch wenn“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: מָאֵן
  choice: dich weigerst
  rationale: Das Verb bezeichnet eine willentliche Weigerung und nicht bloß Unvermögen oder Zögern.
- source_word: לְשַׁלֵּחַ
  choice: sie ziehen zu lassen
  rationale: Im Exoduszusammenhang bezeichnet die Wendung die Freilassung Israels. „Ziehen lassen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: הִנֵּה
  choice: siehe
  rationale: Die Aufmerksamkeitspartikel unterstreicht die Unmittelbarkeit und den feierlichen Ernst der angekündigten Strafe. Das gehobene, aber verständliche „siehe“ bewahrt diesen Ton.
- source_word: אָנֹכִי
  choice: ich
  rationale: Das selbstständige Pronomen hebt den Handelnden hervor. Das ausdrücklich gesetzte „ich“ gibt diese Betonung hinreichend wieder.
- source_word: נֹגֵף
  choice: werde … schlagen
  rationale: Das Partizip bezeichnet hier die angekündigte, unmittelbar bevorstehende Handlung. Die Zukunftsform ist im Deutschen idiomatisch; „schlagen“ bewahrt das Bild eines göttlichen Strafschlags.
- source_word: כָּל גְּבוּלְךָ
  choice: dein ganzes Gebiet
  rationale: גְּבוּל meint hier nicht nur die Grenzlinie, sondern das gesamte Herrschaftsgebiet des Pharaos.
- source_word: בַּצְפַרְדְּעִים
  choice: mit Fröschen
  rationale: Die Präposition bezeichnet die Frösche als Mittel des angekündigten Strafschlags.
