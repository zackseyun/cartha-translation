base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: de
  text: Geh am Morgen zum Pharao. Sieh, er geht zum Wasser hinaus. Tritt ihm am Ufer des Nils[a] entgegen und nimm den Stab in deine Hand, der zu einer Schlange geworden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Flusses“. Das hebräische Wort יְאֹר bezeichnet im Exodusbuch gewöhnlich den Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה בַּבֹּקֶר
  choice: Geh am Morgen zum Pharao
  rationale: Der Qal-Imperativ wird als direkte, natürliche Aufforderung wiedergegeben; die Zeitangabe bleibt eng beim hebräischen Wortlaut.
- source_word: הִנֵּה יֹצֵא הַמַּיְמָה
  choice: Er wird dann gerade zum Wasser hinausgehen
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf den zu erwartenden Vorgang; das Partizip bezeichnet hier eine unmittelbar bevorstehende beziehungsweise dann ablaufende Handlung. „Dann gerade“ gibt diese Funktion im modernen Deutschen natürlicher wieder als das isolierte „Siehe“.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: Stell dich ihm entgegen
  rationale: נצב im Nifal bezeichnet das Einnehmen einer Position; לקראת kann eine Begegnung oder Konfrontation ausdrücken. „Sich jemandem entgegenstellen“ wahrt beides knapp und idiomatisch.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: am Ufer des Nils
  rationale: שׂפה bezeichnet hier den Rand beziehungsweise das Ufer. יְאֹר bezieht sich im Exoduskontext konkret auf den Nil.
- source_word: וְהַמַּטֶּה ... תִּקַּח בְּיָדֶךָ
  choice: und nimm den Stab in die Hand
  rationale: Der injunktiv gebrauchte Imperfekt wird als deutscher Imperativ wiedergegeben; die konkrete Wendung „in die Hand“ bleibt erhalten.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: der sich in eine Schlange verwandelt hat
  rationale: נהפך beschreibt die eingetretene Verwandlung. „Schlange“ ist die gewöhnliche und verständliche deutsche Entsprechung für נָחָשׁ; „Schlangenwesen“ wäre unnötig deutend und „Serpent“ im Deutschen unnatürlich.
theological_decisions:
- issue: Bestimmung von יְאֹר
  choice: Nil
  alternative: Fluss
  rationale: Im ägyptischen Erzählkontext bezeichnet יְאֹר den Nil. Die konkrete Benennung schafft historische Klarheit, ohne eine theologische Deutung hinzuzufügen.
- issue: Wiedergabe von נָחָשׁ
  choice: Schlange
  alternative: Schlangenwesen
  rationale: Der hebräische Ausdruck lässt sich regulär mit „Schlange“ wiedergeben. Die Übersetzung legt weder zoologische Einzelheiten noch eine zusätzliche symbolische Bedeutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Befehlsfolge wird durch klare Imperative wiedergegeben; ein altertümliches „Siehe“ wird vermieden, während die aufmerksamkeitslenkende Funktion von הִנֵּה durch „dann gerade“ erhalten bleibt.
