  terminology: „Pharao“, „Nil“, „Stab“ und „Schlange“ sind angemessene, etablierte Begriffe. „Schlangenwesen“ ist keine sachgerechte lexikalische Alternative zu נָחָשׁ und soll entfallen. Die Fußnote zum Nil wird als tatsächliche Alternative formuliert, nicht fälschlich als wörtliche Übersetzung.
