  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/008.yaml
  text: Then the LORD said to Moses and to Aaron, saying,
translation:
  language: de
  text: 'Da sprach der HERR zu Mose und Aaron:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sprach
  rationale: Die hebräische Erzählungsform führt das nächste Geschehen fort; „Da sprach“ ist idiomatisch, würdevoll und bewahrt den narrativen Anschluss.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens mit „HERR“ in Kapitälchen entspricht der konsultierten Fassung und macht zugleich kenntlich, dass im Hebräischen JHWH steht.
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: zu Mose und Aaron
  rationale: Das wiederholte אֶל wird im natürlichen Deutschen nicht wiederholt; beide Personen bleiben gleichrangige Adressaten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Vor einer unmittelbar folgenden direkten Rede erfüllt der Doppelpunkt im Deutschen die Einleitungsfunktion von לֵאמֹר natürlicher als das formelhafte „folgendermaßen“ oder „indem er sagte“.
theological_decisions:
- issue: Wiedergabe des Tetragramms JHWH
  choice: der HERR
  alternative: Jahwe
  rationale: „der HERR“ folgt der etablierten deutschen Bibelkonvention, ohne dem Vers eine konfessionelle Sonderdeutung hinzuzufügen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die knappe hebräische Redeeinleitung wird durch einen Doppelpunkt natürlich wiedergegeben; der Inhalt der Rede folgt in Vers 9.
