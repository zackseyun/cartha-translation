  text: וַ/אֲנִ֥י אַקְשֶׁ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/הִרְבֵּיתִ֧י אֶת אֹתֹתַ֛/י וְ/אֶת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: de
  text: Ich aber werde das Herz des Pharaos verhärten[a] und meine Zeichen und Wunder im Land Ägypten zahlreich werden lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Herz des Pharaos hart machen“ oder „das Herz des Pharaos halsstarrig machen“. Das hebräische Verb steht in einer kausativen Form und stellt die Verhärtung als direktes Handeln dar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das Waw mit dem ausdrücklich gesetzten Pronomen hebt Gottes Handeln gegenüber dem vorausgehenden Auftrag hervor. „Ich aber“ gibt diesen Kontrast im Deutschen natürlich wieder.
- source_word: אַקְשֶׁה
  choice: werde … verhärten
  rationale: Der Hifil von קשׁה bezeichnet ein aktives Hartmachen. „Verhärten“ bewahrt die direkte kausative Aussage und die im Deutschen geläufige Verbindung mit „Herz“.
- source_word: לֵב פַּרְעֹה
  choice: das Herz des Pharaos
  rationale: Die hebräische Status-constructus-Verbindung wird idiomatisch wiedergegeben. „Herz“ bleibt als Bild für das innere Wollen und Denken erhalten, statt im Haupttext ausgedeutet zu werden.
- source_word: וְהִרְבֵּיתִי
  choice: und … zahlreich werden lassen
  rationale: Der Hifil von רבה hat hier im Erzählzusammenhang zukünftigen Sinn und bezeichnet eine Vermehrung. Die Formulierung klingt mit den zählbaren „Zeichen und Wundern“ im modernen Deutsch natürlicher als „vervielfachen“.
- source_word: אֹתֹתַי
  choice: meine Zeichen
  rationale: אוֹת bedeutet hier „Zeichen“ und bezeichnet göttliche Taten mit hinweisender Bedeutung.
- source_word: מוֹפְתַי
  choice: meine … Wunder
  rationale: מוֹפֵת kann „Wunder“ oder „Wunderzeichen“ bedeuten. „Wunder“ bildet mit „Zeichen“ die eingebürgerte, klare Wortverbindung, ohne den Begriff auf ein Vorzeichen einzuengen.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ („Land“) bei und ist zugleich natürliches Standarddeutsch.
theological_decisions:
- issue: Gottes Handeln bei der Verhärtung des Pharaos
  choice: Ich aber werde das Herz des Pharaos verhärten
  alternative: Ich werde zulassen, dass das Herz des Pharaos hart wird
  rationale: Der hebräische Hifil stellt Gottes aktives Verursachen unmittelbar dar. Die Übersetzung bewahrt diese theologische Spannung und schwächt die Aussage nicht zu einem bloßen Zulassen ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Herz-Metapher und die direkte Aussage über Gottes Handeln bleiben erhalten; der Satzbau ist klar und für heutige Leser gut verständlich.
