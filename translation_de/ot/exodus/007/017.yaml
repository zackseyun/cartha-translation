  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: de
  text: 'So spricht Jahwe: Daran wirst du erkennen, dass ich Jahwe bin: Sieh, ich schlage mit dem Stab in meiner Hand auf das Wasser im Nil, und es wird sich in Blut verwandeln.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch steht im Plural: „die Wasser … und sie werden zu Blut verwandelt“. Im Deutschen wird „Wasser“ hier gewöhnlich als Kollektivsingular gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Botenformel bewahrt den feierlichen Charakter des Hebräischen; der Gottesname wird als Eigenname wiedergegeben.
- source_word: בְּזֹאת תֵּדַע
  choice: Daran wirst du erkennen
  rationale: Das instrumentale בְּ wird idiomatisch mit „daran“ ausgedrückt; das Imperfekt bezeichnet hier die künftige Erkenntnis infolge des Zeichens.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich Jahwe bin
  rationale: Die Selbstidentifikation und die Wiederholung des Gottesnamens bleiben ausdrücklich erhalten.
- source_word: הִנֵּה
  choice: Sieh
  rationale: „Sieh“ markiert die dramatische Ankündigung in verständlichem, leicht gehobenem Gegenwartsdeutsch.
- source_word: אָנֹכִי מַכֶּה
  choice: ich schlage
  rationale: Das Pronomen mit Partizip stellt die unmittelbar bevorstehende Handlung anschaulich dar; das deutsche Präsens kann diese imminente Kraft im Ankündigungskontext tragen.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: mit dem Stab in meiner Hand
  rationale: „Stab“ ist die natürliche Entsprechung für מַטֶּה; die kompakte Form gibt die instrumentale und räumliche Aussage klar wieder.
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: auf das Wasser im Nil
  rationale: „Auf ... schlagen“ bildet עַל ab; יְאֹר bezeichnet in diesem Kontext den Nil. Der hebräische Plural „Wasser“ wird im Deutschen idiomatisch als Kollektivsingular formuliert.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: und es wird zu Blut werden
  rationale: Die Form bezeichnet das eintretende Ergebnis der Verwandlung. Der deutsche Singular stimmt mit dem Kollektivwort „Wasser“ überein; der hebräische Plural wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Sprecher und Ausführender der angekündigten Handlung
  choice: 'Die erste Person bleibt wörtlich erhalten: „ich schlage“'
  alternative: Mose schlägt im Auftrag Jahwes
  rationale: Der Vers lässt Jahwe in der ersten Person sprechen, obwohl der Stab erzählerisch in Moses Hand ist. Diese Spannung wird nicht erklärend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlicher Botenformel. Die Syntax bleibt quellennah, wird aber idiomatisch geglättet. Der Fußnotenmarker steht unmittelbar nach der davon betroffenen Aussage.
