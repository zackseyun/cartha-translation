  text: כִּי֩ יְדַבֵּ֨ר אֲלֵ/כֶ֤ם פַּרְעֹה֙ לֵ/אמֹ֔ר תְּנ֥וּ לָ/כֶ֖ם מוֹפֵ֑ת וְ/אָמַרְתָּ֣ אֶֽל אַהֲרֹ֗ן קַ֧ח אֶֽת מַטְּ/ךָ֛ וְ/הַשְׁלֵ֥ךְ לִ/פְנֵֽי פַרְעֹ֖ה יְהִ֥י לְ/תַנִּֽין־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: de
  text: 'Wenn der Pharao zu euch sagt: »Weist euch durch ein Zeichen aus!«, dann sag zu Aaron: »Nimm deinen Stab und wirf ihn vor dem Pharao hin; er soll zu einer Schlange[a] werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann je nach Zusammenhang auch ein großes Reptil, ein Seeungeheuer oder ein drachenartiges Wesen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Konjunktion leitet hier eine erwartete zukünftige Situation ein, nicht eine Begründung.
- source_word: יְדַבֵּר אֲלֵיכֶם
  choice: zu euch sagt
  rationale: Der Plural von אֲלֵיכֶם wird mit „euch“ bewahrt; gemeint sind Mose und Aaron. Im Deutschen ist „sagt“ mit dem folgenden Zitat natürlicher als „spricht“.
- source_word: תְּנוּ לָכֶם מוֹפֵת
  choice: Gebt ein Zeichen, das euch ausweist
  rationale: „Gebt ein Zeichen“ gibt die Aufforderung idiomatisch wieder; der Zusatz „das euch ausweist“ macht die durch לָכֶם bezeichnete Rückbeziehung verständlich, ohne sie als bloßes „für euch selbst“ misszuverstehen.
- source_word: וְאָמַרְתָּ אֶל־אַהֲרֹן
  choice: dann sag zu Aaron
  rationale: Der Singular „sag“ bewahrt den Wechsel vom vorausgehenden pluralischen „euch“ zur an Mose gerichteten Einzelanweisung. „Dann“ verdeutlicht den Handlungsablauf.
- source_word: מַטְּךָ
  choice: deinen Stab
  rationale: „Stab“ ist die natürliche moderne Wiedergabe und entspricht dem Gegenstand der Erzählung.
- source_word: וְהַשְׁלֵךְ לִפְנֵי פַרְעֹה
  choice: wirf ihn vor dem Pharao hin
  rationale: Die Formulierung gibt die konkrete Wurfbewegung und den öffentlichen Vollzug in der Gegenwart des Pharaos wieder.
- source_word: יְהִי לְתַנִּין
  choice: er soll zu einer Schlange werden
  rationale: „Er soll … werden“ bewahrt den jussivischen Sinn. „Schlange“ passt zum unmittelbaren Erzählzusammenhang, während die größere Bedeutungsbreite von תַנִּין in einer Fußnote offengelegt wird.
theological_decisions:
- issue: Bedeutungsumfang von תַנִּין beim Stabzeichen
  choice: Schlange
  alternative: Drachenwesen, großes Reptil oder Ungeheuer
  rationale: Im Zusammenhang der Verwandlung eines Stabes vor dem Pharao ist „Schlange“ die verständlichste Wiedergabe. Da תַנִּין jedoch weiter gefasst ist als das gewöhnliche Wort für Schlange und auch große Reptilien beziehungsweise drachenartige Wesen bezeichnen kann, wird diese Spannung nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel zwischen dem pluralischen „euch“ und dem singularischen „sag“ wurde bewusst erhalten. Die direkte Rede ist klar und mündlich verständlich formuliert.
