translation:
  language: de
  text: Jeder von ihnen warf seinen Stab hin, und die Stäbe wurden zu Schlangen[a]. Doch Aarons Stab verschlang ihre Stäbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Drachen“ oder „große Reptilien“. Das hebräische Wort tannin kann ein Wesen bezeichnen, das weiter gefasst ist als das gewöhnliche Wort für „Schlange“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: warf … hin
  rationale: שׁלך bezeichnet hier das Hinwerfen eines Gegenstands; „hinwerfen“ ist natürliches modernes Deutsch und gibt die gerichtete Bewegung wieder.
- source_word: אִישׁ מַטֵּהוּ
  choice: Jeder von ihnen … seinen Stab
  rationale: 'אִישׁ ist distributiv gebraucht: Jeder Einzelne wirft seinen eigenen Stab. Die Formulierung vermeidet ein unnötig geschlechtsspezifisches „jeder Mann“, ohne den Sinn zu verändern.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: Stab / Stab / Stäbe
  rationale: מַטֶּה kann „Stab“ oder „Rute“ bedeuten. „Stab“ passt zum konkreten Gegenstand der Erzählung und bewahrt Singular und Plural.
- source_word: וַיִּהְיוּ
  choice: wurden zu
  rationale: היה beschreibt hier das Ergebnis einer Verwandlung. „wurden zu“ gibt dies knapp und idiomatisch wieder.
- source_word: לְתַנִּינִם
  choice: Schlangen
  rationale: תַּנִּין kann je nach Kontext schlangenartige Wesen, große Reptilien oder Ungeheuer bezeichnen. Im Zusammenhang des Zeichens ist „Schlangen“ die verständlichste Wiedergabe; die größere Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: וַיִּבְלַע
  choice: verschlang
  rationale: בלע bedeutet „verschlingen“ oder „hinunterschlucken“. „verschlang“ ist im Deutschen prägnant und vermittelt die vollständige Aufnahme.
- source_word: אֶת
  choice: '[nicht eigens wiedergegeben]'
  rationale: אֶת kennzeichnet im Hebräischen das bestimmte direkte Objekt und hat im Deutschen keine eigene lexikalische Entsprechung.
