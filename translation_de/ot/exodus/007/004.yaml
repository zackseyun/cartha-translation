    rationale: Das Hebräische verwendet hier das Verb „geben/legen“ mit „Hand“ und der Präposition בְ, nicht ein Verb des Richtens „gegen“ Ägypten. „Meine Hand auf Ägypten legen“ bewahrt die Metapher und lässt den gerichtlichen Sinn im Kontext stehen.
