base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: de
  text: Doch der Pharao wird nicht auf euch hören. Dann werde ich meine Hand auf Ägypten legen und meine Heerscharen, mein Volk, die Söhne Israels,[a] durch große Gerichtsakte[b] aus dem Land Ägypten herausführen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Israeliten“. Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit großen Gerichten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: auf euch hören
  rationale: שׁמע mit אֶל bedeutet hier „auf jemanden hören“ bzw. „ihn beachten“. Die Wiedergabe lässt offen, ob der Schwerpunkt auf Zuhören oder Befolgen liegt.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרָיִם
  choice: meine Hand gegen Ägypten richten
  rationale: Die wörtliche Wendung „meine Hand in/an Ägypten setzen“ bezeichnet Gottes machtvolles Eingreifen zum Gericht. „Gegen Ägypten richten“ gibt die gerichtliche Stoßrichtung natürlich wieder, ohne das im Hebräischen nicht stehende Verb „ausstrecken“ einzuführen.
- source_word: צִבְאֹתַי
  choice: meine Heerscharen
  rationale: צָבָא bezeichnet ein geordnetes Aufgebot oder Heer. „Heerscharen“ bewahrt die korporative und militärische Bildsprache, ohne Israel ausschließlich als kämpfende Armee darzustellen.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: mein Volk, die Söhne Israels
  rationale: Die Apposition und die wörtliche familiäre Bezeichnung בְנֵי יִשְׂרָאֵל bleiben erhalten; eine idiomatischere Alternative steht in der Fußnote.
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: durch große Gerichtsakte
  rationale: Der Plural bezeichnet von Gott vollzogene Gerichtshandlungen. „Gerichtsakte“ macht den ereignishaften Sinn im Deutschen deutlicher als das möglicherweise bloß als Urteile verstandene „Gerichte“.
theological_decisions:
- issue: Bezeichnung Israels als צִבְאֹתַי
  choice: meine Heerscharen
  alternative: meine Heerhaufen / meine aufgebotenen Verbände
  rationale: Die Übersetzung erhält die Vorstellung von Israel als Gottes geordnetem Aufgebot, ohne die Aussage auf eine reguläre kämpfende Armee einzuengen.
- issue: Wiedergabe von בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die wörtliche Bundes- und Abstammungsbezeichnung wird im Haupttext bewahrt; die geläufigere ethnische Bezeichnung wird als Alternative kenntlich gemacht.
- issue: Art der göttlichen שְׁפָטִים
  choice: Gerichtsakte
  alternative: Gerichte
  rationale: Die Formulierung bezeichnet Gottes machtvolle Gerichtshandlungen gegen Ägypten. Sie wird nicht auf bloße Rechtssprüche reduziert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der Abfolge des Hebräischen, bleibt aber gut verständlich. „Heerscharen“ ist bewusst leicht gehoben, da es die geordnete, möglicherweise militärische Konnotation von צִבְאֹתַי besser bewahrt als neutralere Ausdrücke.
