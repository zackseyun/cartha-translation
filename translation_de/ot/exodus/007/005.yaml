source:
  edition: WLC
  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: de
  text: Und die Ägypter werden erkennen, dass ich Jahwe bin, wenn ich meine Hand gegen Ägypten ausstrecke und die Israeliten aus der Mitte der Ägypter herausführe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«. Der Ausdruck bezeichnet hier die Israeliten als Volk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Und ... werden erkennen
  rationale: Das Qal-Perfekt mit וְ hat hier in der Ankündigung zukünftigen Sinn. »Erkennen« gibt die durch Gottes Handeln herbeigeführte Einsicht treffender wieder als das rein kognitive »wissen«.
- source_word: מִצְרַיִם
  choice: die Ägypter / Ägypten
  rationale: Beim ersten Vorkommen bezeichnet die Form wegen des pluralischen Prädikats die Menschen; beim zweiten ist Ägypten als Land beziehungsweise Reich Ziel des göttlichen Handelns.
- source_word: כִּי
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was die Ägypter erkennen werden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּנְטֹתִי
  choice: wenn ich ... ausstrecke
  rationale: ב mit Infinitivus constructus ist hier temporal zu verstehen. »Die Hand ausstrecken« bewahrt das konkrete hebräische Bild.
- source_word: עַל מִצְרָיִם
  choice: gegen Ägypten
  rationale: עַל bezeichnet im Gerichtskontext die gegen Ägypten gerichtete Handlung.
- source_word: וְהוֹצֵאתִי
  choice: und ... herausführe
  rationale: Die Hifil-Form von יצא ist kausativ. »Herausführen« passt zum Exoduskontext und bewahrt diese Bedeutung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet wörtlich »Söhne Israels«; im heutigen Deutschen bezeichnet »die Israeliten« natürlich und eindeutig das gesamte Volk.
- source_word: מִתּוֹכָם
  choice: aus ihrer Mitte
  rationale: Die Form bezeichnet das Herausführen aus dem Inneren beziehungsweise aus der Gemeinschaft der Ägypter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. »Jahwe« macht diesen sichtbar, während »der HERR« die traditionelle Ersatzlesung wiedergibt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die idiomatische Volksbezeichnung schließt hier das ganze Volk ein. Die natürliche deutsche Wiedergabe vermeidet die mögliche Fehldeutung, nur männliche Nachkommen seien gemeint; die wörtliche Form wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben »ausstrecke« und »herausführe« bleiben im temporalen wenn-Satz verbunden; das konkrete Bild der ausgestreckten Hand wird bewahrt.
