source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: »Geh zum Pharao und sag ihm: ›So spricht Jahwe: Lass mein Volk ziehen, damit es mir dient.[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit es mich verehrt«. Das hebräische Verb bezeichnet den Dienst, der Gott geleistet wird, und kann dabei auch gottesdienstliche Verehrung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel wie »der HERR« ersetzt.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die Form führt die Erzählung weiter; »Und … sagte« bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Geh zum Pharao
  rationale: בוא kann je nach Perspektive »kommen«, »gehen« oder »eintreten« bedeuten. Hier bezeichnet es den Gang in die Gegenwart des Pharaos; die natürliche deutsche Formulierung gibt dies ohne unnötige räumliche Festlegung wieder.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: und sag ihm
  rationale: Die koordinierte Aufforderung wird knapp und idiomatisch wiedergegeben, wobei ihre Befehlswirkung erhalten bleibt.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Diese feste Botenformel bewahrt den feierlichen und autoritativen Ton des Hebräischen.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Lass mein Volk ziehen
  rationale: Die geläufige deutsche Wendung drückt die verlangte Freilassung treffend aus und bewahrt Gottes Anspruch auf Israel.
- source_word: וְיַעַבְדֻנִי
  choice: damit es mir dient
  rationale: Die Verbform bezeichnet hier wahrscheinlich den Zweck der Freilassung. »Dienen« bewahrt die weitere Bedeutung von עבד, die im Gottesbezug auch gottesdienstliche Verehrung einschließen kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וְיַעַבְדֻנִי für den Zweck von Israels Freilassung
  choice: damit es mir dient
  alternative: damit es mich anbetet
  rationale: עבד kann im Verhältnis zu Gott kultische Verehrung einschließen, ist aber weiter als »anbeten«. »Dienen« erhält sowohl diese Bedeutungsbreite als auch den Kontrast zwischen dem Dienst für den Pharao und dem Dienst für Jahwe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; »So spricht Jahwe« erhält den formellen Klang der Botenformel, während »Geh … und sag ihm« natürlich und allgemein verständlich bleibt.
