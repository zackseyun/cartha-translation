  text: וְ/הַ/דָּגָ֨ה אֲשֶׁר בַּ/יְאֹ֥ר מֵ֨תָה֙ וַ/יִּבְאַ֣שׁ הַ/יְאֹ֔ר וְ/לֹא יָכְל֣וּ מִצְרַ֔יִם לִ/שְׁתּ֥וֹת מַ֖יִם מִן הַ/יְאֹ֑ר וַ/יְהִ֥י הַ/דָּ֖ם בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/021.yaml
  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: de
  text: Und die Fische im Nil starben, und der Nil stank, und die Ägypter konnten kein Wasser aus dem Nil trinken. Und im ganzen Land Ägypten war Blut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּגָה
  choice: die Fische
  rationale: Das singularische Kollektiv bezeichnet den Fischbestand des Flusses; »die Fische« ist im Deutschen natürlich und bleibt nah am Bild des Ausgangstextes.
- source_word: יְאֹר
  choice: Nil
  rationale: יְאֹר kann allgemein einen Strom oder Fluss bezeichnen, meint im Exoduskontext jedoch den Nil; die konkrete Bezeichnung ist für heutige Leser eindeutig.
- source_word: מֵתָה
  choice: starben
  rationale: Das finite Verb beschreibt das Sterben als Ereignis in der Erzählfolge; das deutsche Präteritum gibt dies angemessen wieder.
- source_word: וַיִּבְאַשׁ
  choice: stank
  rationale: Das Verb bezeichnet einen üblen Geruch beziehungsweise das Faulwerden. »Stank« ist knapp, anschaulich und entspricht der Härte der Plagenerzählung.
- source_word: וְלֹא יָכְלוּ
  choice: konnten … nicht
  rationale: Dies ist die natürliche deutsche Wiedergabe der ausgedrückten Unfähigkeit.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: kein Wasser aus dem Nil trinken
  rationale: Die Formulierung hält sowohl »Wasser« als auch die Herkunft aus dem Nil ausdrücklich fest und gibt die hebräische Verneinung idiomatisch mit »kein« wieder.
- source_word: וַיְהִי הַדָּם
  choice: war Blut
  rationale: In Verbindung mit der Ortsangabe ist »im ganzen Land Ägypten war Blut« eine natürliche existentielle Wiedergabe, ohne dem Text eine zusätzliche Handlung hinzuzufügen.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: im ganzen Land Ägypten
  rationale: Die Wendung gibt die umfassende räumliche Ausdehnung klar und würdig wieder.
