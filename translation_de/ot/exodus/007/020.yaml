revisions:
- from: Mose und Aaron taten es, genau wie Jahwe es geboten hatte. Dann erhob er den Stab und schlug vor den Augen des Pharaos und seiner Diener auf das Wasser im Nil[a]. Da verwandelte sich alles Wasser im Nil in Blut.
  to: Mose und Aaron taten es, genau wie Jahwe es geboten hatte. Und er erhob den Stab und schlug das Wasser, das im Nil[a] war, vor den Augen des Pharaos und vor den Augen seiner Diener. Da verwandelte sich alles Wasser im Nil in Blut.
  rationale: Die Revision korrigiert die nicht idiomatische und potenziell missverständliche Verbindung „schlug ... auf das Wasser“ zu „schlug das Wasser“. Außerdem stellt sie die im Hebräischen wiederholte Wendung „vor den Augen“ wieder her. Die unaufgelöste Singularreferenz von „er“ bleibt bewusst erhalten.
