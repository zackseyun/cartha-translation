  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: de
  text: Mose und Aaron taten es, genau wie Jahwe es geboten hatte. Und er erhob den Stab und schlug das Wasser, das im Nil[a] war, vor den Augen des Pharaos und vor den Augen seiner Diener. Da verwandelte sich alles Wasser im Nil in Blut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Strom“; im Buch Exodus bezeichnet das hebräische Wort gewöhnlich den Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: taten es
  rationale: Gibt die idiomatische Wendung für die Ausführung des zuvor erteilten Befehls natürlich und knapp wieder.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: genau wie ... geboten hatte
  rationale: Bewahrt den vergleichenden Nachdruck und macht deutlich, dass das Gebot der Ausführung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: וַיָּרֶם
  choice: erhob er
  rationale: Entspricht dem singularischen Verb und bewahrt, ohne erklärenden Zusatz, die im Hebräischen nicht ausdrücklich aufgelöste Bezugsperson.
- source_word: בַּמַּטֶּה
  choice: den Stab
  rationale: „Stab“ ist die natürliche moderne Bezeichnung in diesem Erzählzusammenhang.
- source_word: וַיַּךְ אֶת הַמַּיִם
  choice: schlug ... auf das Wasser
  rationale: Gibt die konkrete Schlaghandlung idiomatisch im Deutschen wieder.
- source_word: הַיְאֹר
  choice: der Nil
  rationale: יְאֹר bezeichnet im Exoduskontext gewöhnlich den Nil; eine Fußnote bewahrt die wörtliche lexikalische Alternative.
- source_word: לְעֵינֵי פַרְעֹה וּלְעֵינֵי עֲבָדָיו
  choice: vor den Augen des Pharaos und seiner Diener
  rationale: Bewahrt das Bild der sichtbaren, öffentlichen Handlung und die Grundbedeutung von עֲבָדִים.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: Da verwandelte sich ... in Blut
  rationale: Gibt den Zustandswechsel und das narrative Ergebnis in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen; „Jahwe“ macht diesen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Identität des singularischen Handelnden bei „erhob“ und „schlug“
  choice: Das unbestimmte Pronomen „er“ bleibt stehen
  alternative: Aaron ausdrücklich nennen
  rationale: Der hebräische Vers nennt Mose und Aaron gemeinsam, wechselt dann aber ohne ausdrückliches Subjekt in den Singular. Der Kontext legt Aaron nahe, doch die Übersetzung löst die grammatische Offenheit nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt erzählerisch klar; die Wiederholung von „vor den Augen“ wird im Deutschen einmal zusammengezogen, ohne den Gedanken öffentlicher Sichtbarkeit zu verlieren.
