    issue: „schlug ... auf das Wasser“
    rationale: Das Deutsche verlangt hier „schlug das Wasser“ (gegebenenfalls „schlug mit dem Stab auf das Wasser“). Die vorliegende Konstruktion bildet die hebräische Handlung nicht idiomatisch und potenziell missverständlich ab.
  - severity: low
    issue: Zusammenziehung der Wiederholung „vor den Augen“
    rationale: Der hebräische Text wiederholt לְעֵינֵי ausdrücklich für Pharao und dessen Diener. Die Wiederholung ist im Deutschen ohne Härte möglich und wahrt den Nachdruck der öffentlichen Sichtbarkeit.
