  text: וַ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שָׁמַ֖ע אֲלֵ/הֶ֑ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/013.yaml
  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: de
  text: Doch das Herz des Pharaos verhärtete sich[a], und er hörte nicht auf sie, wie Jahwe gesagt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Herz des Pharaos wurde fest.« Das hebräische Verb bedeutet grundlegend »stark/fest werden« und bezeichnet hier ein Hartwerden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: wurde hart
  rationale: Das Verb חזק bedeutet hier, dass das Herz fest beziehungsweise hart wurde. Die deutsche Formulierung gibt den resultierenden Zustand natürlich wieder, ohne einen Handelnden ausdrücklich zu benennen.
- source_word: לֵב פַּרְעֹה
  choice: das Herz des Pharaos
  rationale: לֵב bezeichnet hier das innere Denken, Wollen und Entscheiden; »Herz« bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: und er hörte nicht auf sie
  rationale: שׁמע mit אֶל bezeichnet hier nicht bloß akustisches Hören, sondern das Beachten oder Befolgen. »Auf jemanden hören« ist dafür eine natürliche deutsche Wendung.
- source_word: כַּאֲשֶׁר
  choice: ganz wie
  rationale: Die Wendung kennzeichnet die genaue Entsprechung zum zuvor angekündigten Wort Jahwes.
- source_word: דִּבֶּר
  choice: es gesagt hatte
  rationale: Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass Jahwes Aussage vorausging; das Pronomen »es« bezieht sich auf das nun eingetroffene Geschehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wer das Herz des Pharaos verhärtet
  choice: »das Herz des Pharaos wurde hart« ohne genannten Verursacher
  alternative: »Pharaos Herz verhärtete sich« oder »Pharao verhärtete sein Herz«
  rationale: Die hebräische Verbform bezeichnet hier ein Fest- beziehungsweise Hartwerden, nennt aber keinen äußeren Handelnden. Die Übersetzung schreibt daher weder Gott noch Pharao ausdrücklich die unmittelbare Verursachung zu und bewahrt die Spannung der verschiedenen Aussagen im Exodusbuch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Doch« stellt den Gegensatz zum vorausgehenden Zeichen heraus; »ganz wie« wahrt den Erfüllungsbezug. Die Formulierung vermeidet eine im Hebräischen nicht ausdrücklich genannte handelnde Ursache.
