  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Schwere Sünde“ überträgt die Bedeutung von חֲטָאָה גְדֹלָה idiomatisch; die Fußnote dokumentiert zutreffend die hebräische Verstärkungsfigur. „Sühne“ bewahrt den zentralen theologischen Begriff, ohne konfessionelle Deutung hinzuzufügen.
