source:
  edition: WLC
  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: de
  text: 'Am nächsten Tag sagte Mose zum Volk: „Ihr habt eine schwere Sünde begangen.[a] Nun will ich zu Jahwe hinaufsteigen; vielleicht kann ich Sühne für eure Sünde erwirken.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ihr habt eine große Sünde gesündigt.“ Im Hebräischen verstärkt die Verbindung verwandter Wörter den Ernst der Schuld.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die hebräische Erzählungsformel leitet das nächste Ereignis ein. Im modernen Deutschen gibt die knappe Zeitangabe den Erzählungsfortgang natürlich wieder, ohne ein schwerfälliges „Und es geschah“.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: sagte Mose zum Volk
  rationale: אמר mit אל bezeichnet hier schlicht eine an jemanden gerichtete Äußerung; „sagte … zum Volk“ ist direkt und idiomatisch.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: Ihr habt eine schwere Sünde begangen
  rationale: Das ausdrücklich gesetzte אַתֶּם bleibt durch „Ihr“ hervorgehoben. Die deutsche Verbindung „eine Sünde begehen“ wahrt den Ernst und teilweise auch die Wortwiederholung des hebräischen verwandten Ausdrucks; „schwere“ klingt natürlicher als „große“ und bezeichnet die Schwere des Vergehens.
- source_word: וְעַתָּה
  choice: Nun
  rationale: Kennzeichnet den Übergang von der Feststellung der Schuld zu Moses beabsichtigtem Handeln. „Nun“ ist im Deutschen flüssig und bewahrt die zeitlich-folgernde Funktion.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: will ich zu Jahwe hinaufsteigen
  rationale: עלה bezeichnet das Hinaufgehen, hier zum Berg beziehungsweise in Gottes Gegenwart. „hinaufsteigen“ bewahrt die räumliche Bewegung. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אוּלַי
  choice: vielleicht
  rationale: Drückt Hoffnung und Ungewissheit hinsichtlich des Ausgangs von Moses Fürbitte aus.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: kann ich Sühne für eure Sünde erwirken
  rationale: Das Piel von כפר bezeichnet hier sühnendes Handeln zugunsten des Volkes. „Sühne … erwirken“ ist würdig und idiomatisch und lässt offen, ob Mose selbst die Sühne vollzieht oder ihre Gewährung erreicht; zusammen mit „vielleicht“ bleibt der Ausgang ungewiss.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussage über Moses Möglichkeit, Sühne zu bewirken
  choice: vielleicht kann ich Sühne für eure Sünde erwirken
  alternative: vielleicht kann ich für eure Sünde Sühne leisten
  rationale: אוּלַי hält den Erfolg ausdrücklich offen. „Sühne erwirken“ wahrt diese Spannung und vermeidet die stärkere Behauptung, Mose könne aus eigener Vollmacht sicher Sühne leisten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und eindringlich; unnötig altertümliche Erzählungsformeln werden vermieden. Der Fußnotenmarker [a] steht unmittelbar nach der betreffenden Aussage.
