base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/022.yaml
  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: de
  text: 'Da sagte Aaron: »Der Zorn meines Herrn möge nicht entbrennen. Du kennst das Volk: Es ist dem Bösen zugeneigt.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es ist auf Böses aus« oder: »Es ist vom Bösen geprägt.« Die hebräische Wendung ist idiomatisch und beschreibt das Volk als durch Böses gekennzeichnet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Die deutsche Erzählform gibt den fortlaufenden hebräischen Narrativanschluss natürlich wieder und leitet Aarons Antwort ein.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Form.
- source_word: אַל יִחַר אַף אֲדֹנִי
  choice: Der Zorn meines Herrn soll nicht entbrennen
  rationale: Bewahrt das hebräische Bild vom entbrennenden Zorn und kennzeichnet zugleich die respektvolle Anrede an Mose, nicht einen Gottesnamen.
- source_word: אַתָּה יָדַעְתָּ
  choice: Du kennst doch
  rationale: Das selbstständige Pronomen setzt den Angeredeten leicht ins Gewicht; „doch“ vermittelt im Deutschen Aarons Berufung auf Moses eigene Kenntnis, ohne ein zusätzliches „selbst“ zu erzwingen.
- source_word: הָעָם
  choice: das Volk
  rationale: Entspricht dem kollektiven Substantiv mit Artikel und ist im Kontext Israels die natürliche deutsche Wiedergabe.
- source_word: כִּי בְרָע הוּא
  choice: Es ist dem Bösen zugeneigt
  rationale: Die idiomatische Wendung, wörtlich etwa „es ist im Bösen“, beschreibt das Volk kollektiv als vom Bösen geprägt beziehungsweise dazu geneigt, ohne die Mehrdeutigkeit unnötig zu verengen.
theological_decisions:
- issue: אֲדֹנִי als menschliche Anrede
  choice: meines Herrn
  alternative: mein Gebieter; mein Herr (direkte Anrede)
  rationale: Aaron redet Mose ehrerbietig an. Die Schreibung „Herrn“ ist im Deutschen auch bei menschlicher Anrede regulär groß, während der Zusatz „meines“ und der Kontext eine Verwechslung mit dem Gottesnamen vermeiden.
- issue: Moralische Charakterisierung des Volkes in בְרָע הוּא
  choice: dem Bösen zugeneigt
  alternative: auf Böses aus; vom Bösen geprägt
  rationale: Die Formulierung lässt offen, ob vor allem eine gegenwärtige Ausrichtung oder eine allgemeine Neigung gemeint ist, und bewahrt damit die Spannung der idiomatischen hebräischen Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Zornesmetapher bleibt erhalten; Aarons entschuldigender und ehrerbietiger Ton wird durch „doch“ und „meines Herrn“ hörbar. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
