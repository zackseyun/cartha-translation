  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: de
  text: 'Sie sind schnell von dem Weg abgewichen, den ich ihnen geboten habe. Sie haben sich ein gegossenes Kalbsbild gemacht, sich vor ihm niedergeworfen, ihm Opfer dargebracht und gesagt: »Das sind deine Götter[a], Israel, die dich aus dem Land Ägypten heraufgeführt haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das ist dein Gott, Israel, der dich aus dem Land Ägypten heraufgeführt hat.« Wörtlich steht im Hebräischen: »Das sind deine Götter«, obwohl im Zusammenhang nur ein einziges Kalbsbild gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: Sie sind schnell … abgewichen
  rationale: Bewahrt sowohl die rasche Abkehr als auch das Bild des Abweichens von einem vorgegebenen Weg.
- source_word: הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: von dem Weg, den ich ihnen geboten habe
  rationale: Erhält die Wegmetapher und gibt צוה in natürlichem, würdigem Deutsch wieder.
- source_word: עָשׂוּ לָהֶם
  choice: Sie haben sich … gemacht
  rationale: Das reflexive לָהֶם wird knapp und idiomatisch wiedergegeben.
- source_word: עֵגֶל מַסֵּכָה
  choice: ein gegossenes Kalbsbild
  rationale: מַסֵּכָה bezeichnet ein gegossenes Kultbild; „Kalbsbild“ verdeutlicht, dass es sich um ein Bild in Kalbsgestalt handelt.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: sich vor ihm niedergeworfen
  rationale: Gibt den körperlichen Akt der Prostration wieder, ohne ihn vorschnell unter den allgemeineren Begriff „anbeten“ zu fassen.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: ihm Opfer dargebracht
  rationale: Natürliche deutsche Wiedergabe des kultisch bestimmten Opferns.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Das sind deine Götter
  rationale: Bewahrt die ausdrücklich pluralische Form des Hebräischen trotz des einzelnen Kalbsbildes.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרַיִם
  choice: die dich aus dem Land Ägypten heraufgeführt haben
  rationale: „Heraufgeführt“ erhält die Bedeutung des Hifil von עלה und die wiederkehrende Exodusformel.
theological_decisions:
- issue: Numerus in אֵלֶּה אֱלֹהֶיךָ bei einem einzelnen Kalbsbild
  choice: 'Plural im Haupttext: „Das sind deine Götter“'
  alternative: 'Singular: „Das ist dein Gott“'
  rationale: Die hebräische Grammatik ist deutlich pluralisch. Die Spannung zum einzelnen Bild wird nicht aufgelöst; die kontextuell mögliche singularische Wiedergabe steht in der Fußnote.
- issue: Bedeutung von וַיִּשְׁתַּחֲווּ
  choice: „sich vor ihm niedergeworfen“
  alternative: „es angebetet“
  rationale: Die konkretere körperliche Handlung wird bewahrt und bleibt von dem folgenden Opferakt unterschieden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge des Hebräischen bleibt erkennbar, wird aber durch deutsche Zeichensetzung und idiomatische Verbformen natürlich gestaltet.
