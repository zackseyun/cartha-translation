source:
  edition: WLC
  text: וְ/עַתָּה֙ הַנִּ֣יחָ/ה לִּ֔/י וְ/יִֽחַר אַפִּ֥/י בָ/הֶ֖ם וַ/אֲכַלֵּ֑/ם וְ/אֶֽעֱשֶׂ֥ה אוֹתְ/ךָ֖ לְ/ג֥וֹי גָּדֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: de
  text: Nun lass mich[a], damit mein Zorn gegen sie entbrennt und ich sie vernichte[b]. Dich aber will ich zu einem großen Volk machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lass mich gewähren.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und ich sie verzehre“ beziehungsweise „und ich ihnen ein Ende mache“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Nun
  rationale: Der Diskursmarker leitet den unmittelbar folgenden Befehl ein. „Nun“ ist im modernen Deutschen knapp und natürlich.
- source_word: הַנִּיחָה לִּי
  choice: lass mich
  rationale: Das Hifil von נוח bedeutet in dieser Wendung, jemanden gewähren bzw. unbehelligt zu lassen. „Lass mich“ bewahrt die direkte Kraft des Imperativs und bleibt im Deutschen idiomatisch.
- source_word: וְיִחַר אַפִּי
  choice: damit mein Zorn … entbrennt
  rationale: Die hebräische Wendung bezeichnet aufflammenden Zorn. „Entbrennt“ erhält das Bild des Brennens; „damit“ gibt den nach dem Imperativ naheliegenden Zweck- bzw. Folgebezug wieder.
- source_word: בָהֶם
  choice: gegen sie
  rationale: Im Zusammenhang mit Zorn bezeichnet die Präposition dessen Ausrichtung; „gegen sie“ ist die natürliche deutsche Entsprechung.
- source_word: וַאֲכַלֵּם
  choice: und ich sie vernichte
  rationale: כלה im Piel bedeutet hier, jemanden vollständig zu beseitigen bzw. zu vernichten. Das deutsche „verzehren“ würde zwar ein Bild bewahren, könnte hier jedoch missverständlich klingen; die Fußnote nennt es als formnähere Alternative.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: Dich aber will ich … machen
  rationale: Die Konstruktion bezeichnet, dass Mose zu einem großen Volk gemacht bzw. zum Ursprung eines solchen Volkes werden soll. Die Voranstellung von „Dich“ und „aber“ bildet den Gegensatz zu Israels Vernichtung natürlich ab, ohne zusätzlichen Sachgehalt einzuführen.
- source_word: לְגוֹי גָּדוֹל
  choice: zu einem großen Volk
  rationale: גוי bezeichnet ein Volk beziehungsweise eine Nation. „Volk“ klingt in diesem patriarchalisch-bundestheologischen Zusammenhang im Deutschen natürlicher und bewahrt den Anklang an die Verheißung, ohne ihn auszudeuten.
theological_decisions:
- issue: Anthropopathische Rede vom göttlichen Zorn
  choice: Das Bild vom entbrennenden Zorn bleibt erhalten.
  alternative: 'Abstrakter: „damit ich ihnen zürne“ oder „damit ich auf sie zornig werde“.'
  rationale: Der hebräische Text verwendet bewusst eine körperlich-bildhafte Zorneswendung. Die Übersetzung glättet diese Spannung nicht zu einer abstrakten Aussage.
- issue: Bedeutung des Imperativs im Blick auf Moses Fürbitte
  choice: Der Imperativ wird als wirklicher, direkter Befehl wiedergegeben.
  alternative: Den Satz bereits als indirekte Einladung zur Fürbitte deuten.
  rationale: Ob der Befehl zugleich eine Einladung zur Fürbitte darstellt, ist eine Auslegungsfrage. Die Übersetzung lässt diese Frage offen.
- issue: Zweck- oder Folgebezug von וְיִחַר
  choice: „damit“ gibt einen Zweck- beziehungsweise beabsichtigten Folgebezug wieder.
  alternative: 'Reihend: „und mein Zorn wird gegen sie entbrennen“.'
  rationale: Nach dem Imperativ ist ein finaler oder konsekutiver Anschluss syntaktisch und kontextuell naheliegend; die genaue Nuance wird nicht weiter dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt kraftvoll und knapp. „Zorn … entbrennt“ erhält das hebräische Bild; die Deutung des Befehls als mögliche Einladung zur Fürbitte wird nicht in den Wortlaut aufgenommen.
