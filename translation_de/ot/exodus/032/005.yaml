base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: de
  text: 'Als Aaron das sah, baute er davor[a] einen Altar. Dann verkündete Aaron: »Morgen ist ein Fest für Jahwe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor sich«. Das hebräische Pronomen kann sich grammatisch auf Aaron beziehen; der Zusammenhang spricht jedoch eher für das Kalb.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Als Aaron das sah
  rationale: Das Verb bedeutet »sehen«. Das im Deutschen nötige Objekt »das« wird aus dem Zusammenhang ergänzt und bezieht sich auf das unmittelbar zuvor angefertigte Kalb. »Als« gibt die zeitliche Abfolge natürlich wieder.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: baute er … einen Altar
  rationale: Direkte und idiomatische Wiedergabe von בנה mit מזבח; der kultische Sinn bleibt erhalten.
- source_word: לְפָנָיו
  choice: davor
  rationale: Das maskuline Singularsuffix kann grammatisch auf Aaron oder auf das Kalb zurückweisen. Der Erzählzusammenhang legt nahe, dass der Altar vor dem Kalb errichtet wurde; »davor« nimmt im Deutschen auf das grammatisch neutrale »Kalb« Bezug, ohne das Bild als Person zu bezeichnen.
- source_word: וַיִּקְרָא … וַיֹּאמַר
  choice: Dann rief Aaron aus
  rationale: Die beiden Verben bezeichnen hier eine öffentliche mündliche Bekanntmachung. »rief … aus« ist im Deutschen natürlich und bewahrt den öffentlichen Charakter, ohne die hebräische Doppelung schwerfällig nachzuahmen.
- source_word: חַג
  choice: ein Fest
  rationale: חג bezeichnet ein kultisches Fest. »Fest« ist prägnant und legt nicht unnötig fest, dass es sich um ein Wallfahrtsfest handelt.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier Widmung oder Zuordnung. »für Jahwe« ist in einer Festankündigung natürlich und gibt den ausdrücklich verwendeten Gottesnamen wieder.
- source_word: מָחָר
  choice: Morgen ist
  rationale: Die hebräische Nominalkonstruktion enthält keine ausdrückliche Kopula. Das deutsche Präsens eignet sich idiomatisch für eine feststehende Ankündigung des folgenden Tages.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Bundesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezugswort des Suffixes in לְפָנָיו
  choice: Der Altar wurde vor dem Kalb errichtet.
  alternative: Der Altar wurde vor Aaron selbst errichtet.
  rationale: Das Suffix ist grammatisch mehrdeutig. Im unmittelbaren Erzählzusammenhang ist das gerade angefertigte Kalb jedoch das naheliegende Bezugswort. Die alternative syntaktische Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die öffentliche Ankündigung wird knapp und natürlich formuliert; die echte grammatische Mehrdeutigkeit des Pronomens bleibt durch die Fußnote sichtbar.
