base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: de
  text: Am nächsten Morgen standen sie früh auf, brachten Brandopfer dar und brachten Heilsopfer dar. Dann setzte sich das Volk hin, um zu essen und zu trinken. Danach standen sie auf, um ausgelassen zu feiern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um zu spielen“ oder „um sich zu vergnügen“. Das hebräische Verb kann „spielen“, „feiern“ oder „ausgelassen feiern“ bedeuten. Hier deutet der Zusammenhang eher auf ungeordnetes Feiern als auf harmloses Spielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: Am nächsten Morgen standen sie früh auf
  rationale: Die Hifil-Form von שׁכם bezeichnet frühes Aufstehen; מִמָּחֳרָת verweist auf den folgenden Tag. Die deutsche Formulierung gibt beides natürlich und präzise wieder.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: brachten Brandopfer dar
  rationale: עלה zusammen mit עֹלָה ist eine feste kultische Verbindung für das Darbringen von Brandopfern.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: legten Heilsopfer vor
  rationale: נגשׁ bezeichnet hier das Heranbringen beziehungsweise Vorlegen einer Opfergabe. „Heilsopfer“ ist eine etablierte deutsche Bezeichnung für שְׁלָמִים und lässt dessen Bedeutungsfeld von Wohlergehen, Frieden und Gemeinschaft offen.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: Dann setzte sich das Volk hin, um zu essen und zu trinken
  rationale: Die Formulierung bildet die erzählerische Abfolge und die Zweckangabe der hebräischen Infinitive in natürlichem Deutsch ab.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: Danach standen sie auf, um ausgelassen zu feiern
  rationale: צחק kann spielen, sich vergnügen oder ausgelassen feiern bedeuten. Im Zusammenhang des Götzenfestes ist eine ungeordnete Feststimmung wahrscheinlich; die Wiedergabe vermeidet jedoch eine nicht ausdrücklich geforderte sexuelle Deutung.
theological_decisions:
- issue: Bedeutungsnuance von לְצַחֵק beim Fest um das goldene Kalb
  choice: um ausgelassen zu feiern
  alternative: um zu spielen / um sich zu vergnügen
  rationale: Der Zusammenhang mit Opfermahl, Götzendienst und anschließendem Gericht spricht gegen bloß harmloses Spielen. Zugleich legt der Vers allein keine bestimmte sexuelle Handlung eindeutig fest; diese Spannung bleibt durch die Hauptübersetzung und die Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Opferterminologie. Die Satzfolge bleibt nah am hebräischen Erzählrhythmus; eine übermäßig konkrete Deutung des letzten Verbs wird vermieden.
