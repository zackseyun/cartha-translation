  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: de
  text: 'Und sie sagten zu mir: »Fertige uns Götter[a] an, die vor uns hergehen! Denn dieser Mose, der Mann, der uns aus dem Land Ägypten heraufgeführt hat – wir wissen nicht, was mit ihm geschehen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fertige uns einen Gott an, der vor uns hergeht!« Obwohl hier ein pluralisches Substantiv mit einem pluralischen Verb steht (»Götter … hergehen«), geben manche die Aussage angesichts des Kalbsbildes im Zusammenhang singularisch wieder.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Und sie sagten zu mir
  rationale: Das Wayyiqtol führt die Erzählung fort; »Und sie sagten zu mir« gibt die Abfolge natürlich und ohne zusätzliche Deutung wieder.
- source_word: עֲשֵׂה לָנוּ
  choice: Mach uns
  rationale: Die Wendung bezeichnet hier das Herstellen für die Sprecher; das im Deutschen natürliche »Mach uns« bewahrt Imperativ und Nutznießerbezug.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Obwohl אֱלֹהִים auch singularisch gebraucht werden kann, spricht das zugehörige pluralische Verb יֵלְכוּ in diesem Vers deutlich für den Plural.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: die vor uns herziehen
  rationale: Die Formulierung bezeichnet führendes Vorangehen. »Vor uns herziehen« passt zum Zug des Volkes und gibt den Plural des Verbs wieder.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung für die Forderung ein; »Denn« verbindet sie im Deutschen idiomatisch mit dem vorausgehenden Ausruf.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: dieser Mose, der Mann
  rationale: Die bewusst markierte und leicht distanzierende Formulierung des Hebräischen bleibt erhalten.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: der uns aus dem Land Ägypten heraufgeführt hat
  rationale: Der Hifil von עלה bedeutet im Exoduszusammenhang »heraufführen«. »Aus dem Land Ägypten« bildet den hebräischen Ausdruck vollständig ab.
- source_word: לֹא יָדַעְנוּ מֶה הָיָה לוֹ
  choice: wir wissen nicht, was mit ihm geschehen ist
  rationale: Die hebräische Wendung fragt nach Moses Schicksal beziehungsweise Verbleib; das Perfekt bezeichnet hier einen gegenwärtigen Wissensstand.
theological_decisions:
- issue: Singularische oder pluralische Wiedergabe von אֱלֹהִים in Aarons Bericht
  choice: 'Plural: »Götter«'
  alternative: 'Singular: »einen Gott«'
  rationale: Das pluralische Verb יֵלְכוּ stützt in diesem Vers nachdrücklich die pluralische Wiedergabe. Die Spannung zum einzelnen Kalbsbild im Kontext wird nicht harmonisierend aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich bildet den hervorgehobenen Nachsatz der direkten Rede ab. Die grammatische Mehrzahl wird im Haupttext bewahrt; die kontextuell mögliche singularische Deutung steht in der Fußnote.
