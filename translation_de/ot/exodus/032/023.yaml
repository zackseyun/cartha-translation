  source_fidelity: Die Pluralwiedergabe »Götter« mit pluralischem Relativsatz entspricht אֱלֹהִים und יֵלְכוּ. Die übrigen Elemente geben die kausale Begründung, die demonstrativ-distanzierende Bezugnahme auf Mose und die idiomatische Frage nach seinem Schicksal zuverlässig wieder.
  naturalness: »Mach uns Götter« ist im Deutschen missverständlich, da es auch »Mach aus uns Götter« bedeuten kann. »Fertige uns Götter an« macht den im Hebräischen gemeinten Herstellungsauftrag eindeutig. »Vor uns hergehen« ist dafür ein natürlicheres allgemeines Deutsch als das stärker auf einen Zug bezogene »herziehen«.
  terminology: »Götter« bewahrt die grammatische Mehrzahl ohne Harmonisierung mit dem Kalbsbild des Kontextes. Die Fußnote hält die kontextuell vertretene Singularlesart als Alternative fest.
