  - severity: low
    issue: Die Fußnote erklärt die Alternativformulierung nicht ganz einheitlich.
    rationale: Wenn die Alternative mit dem pluralischen Imperativ „Reißt es ab!“ zitiert wird, sollte auch die wörtliche Annäherung diesen Imperativ beibehalten, statt zu „Legt es ab!“ zu wechseln.
