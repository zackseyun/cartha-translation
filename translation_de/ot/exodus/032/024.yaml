  text: וָ/אֹמַ֤ר לָ/הֶם֙ לְ/מִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַ/יִּתְּנוּ לִ֑/י וָ/אַשְׁלִכֵ֣/הוּ בָ/אֵ֔שׁ וַ/יֵּצֵ֖א הָ/עֵ֥גֶל הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: de
  text: 'Und ich sagte zu ihnen[a]: »Wer Gold hat, nehmt es ab!« Da gaben sie es mir, und ich warf es ins Feuer, und dieses Kalb kam heraus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wer hat Gold? Reißt es ab!« Wörtlich lautet das Hebräische etwa: »Wem ist Gold? Reißt es ab!«'
    reason: Die knappe hebräische Besitzformel kann als allgemeine Aufforderung oder als Frage mit anschließendem pluralischem Imperativ verstanden werden. Das Verb kann kräftiger als »abnehmen« wiedergegeben werden.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Und ich sagte
  rationale: Der Wayyiqtol von אמר führt Aarons wiedergegebene Rede ein und setzt die Erzählfolge schlicht fort.
- source_word: לְמִי זָהָב
  choice: Wer Gold hat
  rationale: Die wörtliche Besitzkonstruktion »wem ist Gold?« wird im modernen Deutschen natürlich mit »wer Gold hat« wiedergegeben; der Bezug bleibt allgemein.
- source_word: הִתְפָּרָקוּ
  choice: soll es abnehmen
  rationale: Der Hitpael von פרק bezeichnet hier das Ablegen beziehungsweise Abnehmen von Goldschmuck am eigenen Körper. Das singularische »es« nimmt Gold als Sammelbegriff auf.
- source_word: וַיִּתְּנוּ לִי
  choice: Da gaben sie es mir
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen aus dem zuvor genannten Gold ergänzt; »Da« gibt die erzählerische Folge idiomatisch wieder.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: und ich warf es ins Feuer
  rationale: שלך bedeutet werfen; die Richtung wird im Deutschen mit »ins Feuer« natürlich ausgedrückt. Das Suffix bezieht sich auf das Gold.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: und dieses Kalb kam heraus
  rationale: Die schlichte Formulierung bewahrt Aarons ausweichende Darstellung, ohne sie durch erklärende oder wertende Zusätze aufzulösen.
theological_decisions:
- issue: Aarons ausweichende Darstellung der Entstehung des Götzenbildes
  choice: Seine Aussage wird ohne deutende Zusätze wie »angeblich« oder »wie durch ein Wunder« wiedergegeben.
  alternative: Die Täuschung oder Ironie bereits im Haupttext ausdrücklich kenntlich machen.
  rationale: Der Vers gibt Aarons Worte wieder; die Übersetzung lässt die Spannung und die durch den Kontext erkennbare Ausflucht bestehen, statt sie kommentierend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und natürlich; Aarons auffällig vereinfachende Erklärung wird ohne zusätzliche Wertung bewahrt.
