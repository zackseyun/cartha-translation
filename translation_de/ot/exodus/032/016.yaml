base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: de
  text: Die Tafeln waren Gottes Werk[a], und die Schrift war Gottes Schrift, eingraviert auf den Tafeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gottes Werk … Gottes Inschrift«. Im Hebräischen werden die Wörter für »Werk« und »Schrift« jeweils wiederholt und dadurch hervorgehoben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: die Tafeln
  rationale: לֻחֹת bezeichnet hier die bereits aus dem Zusammenhang bekannten Bundestafeln. »Tafeln« ist natürlich und präzise; dass sie aus Stein bestehen, wird in diesem Vers nicht eigens gesagt.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: Gottes Werk
  rationale: Die nominale Konstruktion bezeichnet ein Werk oder Erzeugnis Gottes. »Gottes Werk« bewahrt die knappe Form und die ausdrückliche Zuschreibung an Gott.
- source_word: הֵמָּה
  choice: waren
  rationale: Das selbstständige Pronomen wirkt im Hebräischen hervorhebend. Im Deutschen wird die Aussage idiomatisch durch die Kopulakonstruktion wiedergegeben, ohne ein zusätzliches »sie« einzufügen.
- source_word: הַמִּכְתָּב
  choice: die Schrift
  rationale: מִכְתָּב bezeichnet hier die Schrift beziehungsweise Inschrift. »Schrift« ermöglicht es, die bedeutsame Wiederholung des Nomens im Deutschen beizubehalten.
- source_word: מִכְתַּב אֱלֹהִים
  choice: Gottes Schrift
  rationale: Die Wiederholung von מִכְתָּב hebt hervor, dass die Schrift selbst Gott zugeschrieben wird. »Gottes Schrift« bewahrt diese rhetorische Struktur.
- source_word: הוּא
  choice: war
  rationale: Das Pronomen nimmt das Satzthema hervorhebend wieder auf. Im natürlichen Deutschen genügt die Kopula; ein ausdrückliches »sie« ist nicht nötig.
- source_word: חָרוּת
  choice: eingraviert
  rationale: חָרוּת beschreibt etwas, das durch Einschneiden angebracht ist. »Eingraviert« passt präzise zu einer Schrift auf Tafeln.
- source_word: עַל הַלֻּחֹת
  choice: auf den Tafeln
  rationale: עַל ist hier örtlich zu verstehen und wird unmittelbar mit »auf« wiedergegeben.
- source_word: וְ
  choice: unmarkierter Satzanschluss; innerhalb des Verses »und«
  rationale: Das erste וְ verbindet den Vers mit dem Erzählzusammenhang, verlangt im Deutschen aber keinen eigenen Zeit- oder Diskursmarker. Das zweite wird natürlich mit »und« wiedergegeben.
theological_decisions:
- issue: Urheberschaft der Tafeln und der Schrift
  choice: Sowohl die Tafeln selbst als auch die darauf befindliche Schrift werden ausdrücklich Gott zugeschrieben.
  alternative: 'Dynamischer wäre: »Die Tafeln waren von Gott gemacht, und die Schrift war von Gott geschrieben.«'
  rationale: Der hebräische Text verwendet nominale Wendungen (»Gottes Werk«, »Gottes Schrift«). Ihre Beibehaltung wahrt die pointierte doppelte Zuschreibung, ohne die Art der göttlichen Urheberschaft näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die nominale Ausdrucksweise des Hebräischen bleiben erhalten; ein nicht ausdrücklich vorhandenes »Nun« wird nicht ergänzt.
