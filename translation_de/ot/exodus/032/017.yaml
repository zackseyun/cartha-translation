  text: When Joshua heard the sound of the people as they shouted[a], he said to Moses, “There is the sound of war in the camp.”
translation:
  language: de
  text: 'Als Josua das Geschrei des Volkes hörte[a], sagte er zu Mose: »Im Lager ist Kriegslärm!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Geräusch des Volkes bei seinem Geschrei«. Der hebräische Ausdruck bezeichnet den hörbaren Laut des Volkes, der durch lautes Rufen oder Geschrei entsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Das Qal-Wayyiqtol von שׁמע bezeichnet hier in der fortlaufenden Erzählung die schlichte Wahrnehmung durch das Gehör.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: קוֹל הָעָם
  choice: das laute Rufen des Volkes
  rationale: קוֹל bezeichnet hier den hörbaren Laut beziehungsweise Lärm der Volksmenge. Zusammen mit בְּרֵעֹה wird die gemeinte lautstarke Äußerung natürlich als »lautes Rufen« wiedergegeben.
- source_word: בְּרֵעֹה
  choice: lautes Rufen
  rationale: Der Ausdruck bezeichnet das Erheben eines lauten Rufes oder Geschreis. Das maskuline Singularsuffix entspricht dem kollektiven Singular הָעָם; die deutsche Formulierung wahrt diesen kollektiven Bezug.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: sagte er zu Mose
  rationale: Natürliche Wiedergabe der hebräischen Erzählformel; »Mose« ist die etablierte deutsche Namensform.
- source_word: קוֹל מִלְחָמָה
  choice: Kriegslärm
  rationale: Die kompakte deutsche Zusammensetzung gibt die Konstruktverbindung »Laut/Lärm des Krieges« prägnant wieder und lässt Josuas irrtümliche Deutung der Geräusche erkennen.
- source_word: בַּמַּחֲנֶה
  choice: im Lager
  rationale: Direkte und idiomatische Wiedergabe des Israelitenlagers.
