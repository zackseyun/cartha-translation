  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: de
  text: Aber nun geh und führe das Volk zu dem Ort, von dem ich dir gesagt habe. Sieh, mein Engel wird vor dir hergehen. Doch an dem Tag, an dem ich sie zur Rechenschaft ziehe, werde ich sie für ihre Sünde zur Rechenschaft ziehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Doch am Tag meines Heimsuchens werde ich ihre Sünde an ihnen heimsuchen.« Das zweimal verwendete hebräische Verb kann je nach Zusammenhang »aufsuchen«, »sich um etwas kümmern«, »zur Rechenschaft ziehen« oder »strafend heimsuchen« bedeuten.'
    reason: Die Fußnote bewahrt das Wortspiel der wiederholten hebräischen Wurzel פקד und zeigt die Bedeutungsspanne, ohne die Übersetzung auf eine bestimmte Art der Ahndung festzulegen.
lexical_decisions:
- source_word: נְחֵה
  choice: führe
  rationale: Der Hifil-Imperativ bezeichnet hier das Führen oder Leiten des Volkes.
- source_word: מַלְאָכִי
  choice: mein Engel
  rationale: מַלְאָךְ kann »Bote« oder »Engel« bedeuten; im Kontext des göttlichen Begleiters Israels entspricht »Engel« dem natürlichen und traditionsoffenen deutschen Ausdruck.
- source_word: פָּקְדִי / וּפָקַדְתִּי
  choice: wenn ich Rechenschaft fordere / werde ich ... zur Rechenschaft ziehen
  rationale: Die wiederholte Wurzel פקד bezeichnet hier ein zur Verantwortung ziehendes Heimsuchen. Die Formulierung bewahrt die Wiederholung und vermeidet eine unnötige Festlegung auf eine bestimmte Strafart.
- source_word: חַטָּאתָם
  choice: ihre Sünde
  rationale: Der Singular bezeichnet die gemeinsame konkrete Schuld des Volkes im Zusammenhang mit dem goldenen Kalb.
theological_decisions:
- issue: Zeitpunkt und Art der göttlichen Ahndung
  choice: »an dem Tag, an dem ich Rechenschaft fordere«
  alternative: »am Tag meiner Heimsuchung« oder »wenn ich sie bestrafe«
  rationale: Die Übersetzung gibt den angekündigten göttlichen Vollzug ernst wieder, ohne Zeitpunkt, Form oder Ausmaß der Ahndung über den hebräischen Text hinaus festzulegen.
- issue: Identität des göttlichen Boten
  choice: »mein Engel« ohne nähere Identifizierung
  alternative: »mein Bote« oder eine christologische Identifizierung
  rationale: Der Vers selbst nennt ihn lediglich Gottes מַלְאָךְ; eine weitergehende Identifizierung würde die im Text verbleibende Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sieh« erhält den aufmerksamkeitslenkenden Charakter von הִנֵּה, ohne das altertümlichere »siehe«. Die Wiederholung des Rechenschaftsmotivs bildet die hebräische Wurzelwiederholung idiomatisch nach.
