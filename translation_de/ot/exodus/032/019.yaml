base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: de
  text: Als Mose sich dem Lager näherte und das Kalb und das Tanzen[a] sah, entbrannte sein Zorn. Er warf die Tafeln aus seiner Hand und zerschmetterte sie am Fuß des Berges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Tänze“. Der hebräische Plural kann die einzelnen Tänze oder das Tanzen als Geschehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Als
  rationale: Die hebräische Erzählungsformel leitet den folgenden zeitlichen Zusammenhang ein. Im modernen Deutschen gibt „Als“ diesen Übergang natürlich wieder, ohne das nicht ausdrücklich markierte „sobald“ einzutragen.
- source_word: קָרַב אֶל הַמַּחֲנֶה
  choice: sich dem Lager näherte
  rationale: קָרַב bezeichnet das Näherkommen. Die reflexive deutsche Wendung ist präzise und idiomatisch.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: das Kalb … sah
  rationale: רָאָה ist das gewöhnliche Verb für „sehen“; der bestimmte Artikel verweist auf das bereits im Zusammenhang bekannte Kalb.
- source_word: וּמְחֹלֹת
  choice: und das Tanzen
  rationale: Das hebräische Substantiv steht im Plural und bezeichnet Tänze beziehungsweise das Tanzen. „Das Tanzen“ ist nach „sah“ im Deutschen natürlich und vermeidet die stärker deutende Wiedergabe „Ausgelassenheit“.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: entbrannte sein Zorn
  rationale: Die Wiedergabe bewahrt das anschauliche hebräische Bild vom brennenden Zorn und klingt zugleich würdig und gegenwärtig.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ אֶת הַלֻּחֹת
  choice: Er warf die Tafeln aus seinen Händen
  rationale: שׁלך bedeutet „werfen“ oder „schleudern“. Obwohl das Hebräische grammatisch den Singular „aus seiner Hand“ hat, ist der Plural bei zwei getragenen Tafeln im Deutschen die natürliche Zahlangleichung.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: und zerschmetterte sie
  rationale: שׁבר bezeichnet das Zerbrechen; „zerschmetterte“ vermittelt hier die Wucht der Handlung, ohne umgangssprachlich zu wirken.
- source_word: תַּחַת הָהָר
  choice: am Fuß des Berges
  rationale: תַּחַת bedeutet grundsätzlich „unter“ oder „unten an“. In diesem topografischen Zusammenhang ist „am Fuß des Berges“ die natürliche deutsche Entsprechung.
