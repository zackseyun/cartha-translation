  text: וַ/יִּגֹּ֥ף יְהוָ֖ה אֶת הָ/עָ֑ם עַ֚ל אֲשֶׁ֣ר עָשׂ֣וּ אֶת הָ/עֵ֔גֶל אֲשֶׁ֥ר עָשָׂ֖ה אַהֲרֹֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/035.yaml
  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: de
  text: Da schlug Jahwe das Volk, weil sie das Kalb gemacht hatten, das Aaron angefertigt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann allgemein „schlagen“ bedeuten und kann in diesem Zusammenhang auch ein Heimsuchen durch eine Plage bezeichnen.
    reason: Lexikalische Erläuterung zu וַיִּגֹּף; eine Plage wird im Hebräischen nicht als eigenes Substantiv genannt.
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: Da schlug ... mit einer Plage
  rationale: Das Verb נָגַף bezeichnet ein Schlagen oder Heimsuchen, häufig als göttliche Plage. Die Formulierung gibt diesen wahrscheinlichen Gerichtssinn wieder, ohne Todesfälle ausdrücklich zu behaupten; die allgemeinere Wiedergabe wird in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bezeichnet hier kollektiv das Volk Israel; „das Volk“ ist die natürliche deutsche Entsprechung.
- source_word: עַל אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet hier den Grund für das Gericht ein; „weil“ gibt den kausalen Sinn knapp und idiomatisch wieder.
- source_word: עָשׂוּ אֶת הָעֵגֶל
  choice: sie das Kalb gemacht hatten
  rationale: Die Wiedergabe bewahrt den ausdrücklichen Plural von עָשׂוּ sowie das direkte Objekt „das Kalb“ und damit die im Hebräischen ausgesprochene Verantwortung des Volkes.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: das Aaron angefertigt hatte
  rationale: Der Relativsatz schreibt zugleich Aaron die Herstellung des Kalbes zu. „angefertigt“ vermeidet eine schwerfällige unmittelbare Wiederholung von „gemacht“, ohne den Sinn zu verändern.
theological_decisions:
- issue: Art des göttlichen Gerichts in וַיִּגֹּף
  choice: „schlug ... mit einer Plage“
  alternative: „schlug“ oder „suchte ... heim“
  rationale: Das Verb kann allgemein „schlagen“ bedeuten, wird aber häufig für eine plageartige göttliche Heimsuchung gebraucht. Der Haupttext macht diesen wahrscheinlichen Sinn verständlich; die Fußnote bewahrt die allgemeinere lexikalische Möglichkeit.
- issue: Verantwortung des Volkes und Aarons für das Kalb
  choice: 'Beide Aussagen werden ausdrücklich beibehalten: Das Volk machte das Kalb, das Aaron anfertigte.'
  alternative: „wegen dessen, was sie mit dem Kalb getan hatten“
  rationale: Die hebräische Formulierung verwendet עשה sowohl für das Volk im Plural als auch für Aaron im Singular. Die Übersetzung glättet diese Spannung nicht, sondern lässt die geteilte beziehungsweise unterschiedlich beschriebene Verantwortung stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst auffällige doppelte Zuschreibung der Herstellung des Kalbes an das Volk und an Aaron folgt dem hebräischen Wortlaut und bewahrt dessen Spannung.
