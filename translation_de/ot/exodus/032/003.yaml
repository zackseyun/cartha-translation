  terminology: „Goldene Ringe“ bewahrt die lexikalische Offenheit von נזמי הזהב; Fußnote b benennt „goldene Ohrringe“ angemessen als kontextuelle Alternative. Fußnote a hält die mögliche stärkere Nuance des Verbs fest, ohne sie dem Haupttext aufzuzwingen. Der Name Aaron ist korrekt.
