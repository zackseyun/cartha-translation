  source_fidelity: 'Der Entwurf gibt alle Satzglieder des Hebräischen zuverlässig wieder: die Gesamtheit des Volkes, das Ablegen der goldenen Ringe, ihren Trageort an den Ohren und das Bringen zu Aaron. „Nahm ... ab“ trifft den reflexiven Hitpael-Sinn idiomatisch. Die Wiedergabe „an den Ohren trugen“ ist eine natürliche Kontextumschreibung von „in ihren Ohren“ und legt die Ringe zutreffend als Ohrschmuck aus, ohne die Grundbedeutung von נזם im Haupttext zu verengen.'
