  yaml_path: translation/ot/exodus/032/003.yaml
  text: So all the people took off the gold rings that were in their ears and brought them to Aaron[a][b].
translation:
  language: de
  text: Da nahm das ganze Volk die goldenen Ringe ab, die sie an den Ohren trugen, und brachte sie zu Aaron.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „riss … ab“ beziehungsweise „streifte … ab“. Das hebräische Verb kann ein nachdrückliches Abnehmen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die goldenen Ohrringe“. Das hebräische Wort bezeichnet einen Schmuckring; hier weist der Zusammenhang auf Ohrschmuck.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: nahm … ab
  rationale: Der Hitpael von פרק bezeichnet hier das Ablegen beziehungsweise Abnehmen des eigenen Schmucks. „nahm … ab“ gibt den reflexiven Sinn natürlich wieder; eine nachdrücklichere oder gewaltsamere Nuance bleibt als Alternative in der Fußnote erhalten.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Die Wendung bezeichnet die versammelte Gemeinschaft als Gesamtheit. „das ganze Volk“ ist im Deutschen idiomatisch und bewahrt den kollektiven Singular des Hebräischen.
- source_word: נִזְמֵי הַזָּהָב
  choice: die goldenen Ringe
  rationale: נֶזֶם bezeichnet einen als Schmuck getragenen Ring, je nach Zusammenhang am Ohr oder an der Nase. „goldene Ringe“ wahrt diese lexikalische Breite; der folgende Relativsatz bestimmt hier den Trageort.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: die sie an den Ohren trugen
  rationale: Diese natürliche deutsche Formulierung gibt die Lage der Ringe wieder, ohne das schwerfällige „die in ihren Ohren waren“.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: und brachte sie zu Aaron
  rationale: Das Verb bedeutet „bringen“. Das im Deutschen ergänzte Pronomen „sie“ bezieht sich eindeutig auf die zuvor genannten Ringe; der Singular „brachte“ entspricht dem kollektiven Subjekt „das ganze Volk“.
