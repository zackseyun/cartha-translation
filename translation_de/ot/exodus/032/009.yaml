id: EXO.32.9
reference: Exodus 32:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Ich habe dieses Volk gesehen, und siehe, es ist ein halsstarriges Volk.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „widerspenstig“. Die hebräische Wendung bezeichnet wörtlich einen starren oder harten Nacken und ist ein Bild für hartnäckigen Widerstand.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Bewahrt die fortlaufende hebräische Erzählverknüpfung, ohne eine stärkere zeitliche Deutung einzutragen.
- source_word: רָאִיתִי
  choice: Ich habe … gesehen
  rationale: Das hebräische Perfekt bezeichnet hier eine abgeschlossene Wahrnehmung, deren Ergebnis für das folgende Urteil gegenwärtig maßgeblich ist.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Bewahrt den kollektiven Singular und den demonstrativen, möglicherweise distanzierenden Ton.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Erhält die aufmerksamkeitslenkende und rhetorisch gewichtige Funktion der hebräischen Partikel in würdigem, verständlichem Deutsch.
- source_word: קְשֵׁה עֹרֶף
  choice: halsstarrig
  rationale: Die geläufige deutsche Wendung bewahrt das Bild des unbeugsamen Nackens und bezeichnet zugleich verständlich hartnäckigen Widerstand.
- source_word: הוּא
  choice: es ist
  rationale: Das Pronomen nimmt den kollektiven Singular „Volk“ wieder auf; die deutsche Formulierung entspricht diesem grammatischen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Umschrift wahrt den Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Bildhafte Beschreibung des Volkes
  choice: halsstarrig
  alternative: widerspenstig
  rationale: Die bildhafte Rede vom starren Nacken bleibt erhalten, ohne die Aussage auf eine rein abstrakte Charakterisierung zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst leicht gehobenem „siehe“. „Halsstarrig“ ist traditionell geprägt, aber weiterhin verständlich und bewahrt die konkrete hebräische Metapher.
