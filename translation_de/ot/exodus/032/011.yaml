source:
  edition: WLC
  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: de
  text: 'Doch Mose flehte Jahwe, seinem Gott, inständig zu[a] und sagte: „Warum, Jahwe, soll dein Zorn gegen dein Volk entbrennen, das du mit großer Kraft und starker Hand[b] aus dem Land Ägypten herausgeführt hast?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch eine Wendung mit „das Angesicht Jahwes“; sie bedeutet, seine Gunst zu suchen oder ihn inständig zu bitten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mächtiger Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל … אֶת־פְּנֵי
  choice: flehte … inständig an
  rationale: Die Verbindung von חלה im Piel mit „Angesicht“ ist eine feste Wendung für das eindringliche Suchen von Gunst. Die Übersetzung gibt den idiomatischen Sinn natürlich wieder; die wörtliche Bildsprache wird in Fußnote [a] dokumentiert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des persönlichen Gottesnamens wahrt den Unterschied zwischen dem Namen und einem bloßen Titel.
- source_word: אֱלֹהָיו
  choice: seinen Gott
  rationale: Der Singular mit Possessivsuffix bezeichnet hier eindeutig Moses’ Gott und bewahrt die im Text ausgedrückte persönliche Bundesbeziehung.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: soll dein Zorn … entbrennen
  rationale: Diese Formulierung erhält das hebräische Bild des brennenden Zorns, ohne die Körpermetapher vom „Brennen der Nase“ unverständlich wörtlich wiederzugeben.
- source_word: בְּעַמֶּךָ
  choice: gegen dein Volk
  rationale: Bei einem Ausdruck des Zorns bezeichnet בְּ das Ziel des Zorns. „Dein Volk“ bewahrt den argumentativen Nachdruck von Moses’ Fürbitte.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: das du … herausgeführt hast
  rationale: Das Relativpronomen bezieht sich auf das Volk; „herausgeführt“ entspricht der charakteristischen Exodus-Sprache.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die vollständige Formulierung bewahrt die geografische Bestimmtheit und den feierlichen Klang des Hebräischen.
- source_word: בְּכֹחַ גָּדוֹל
  choice: mit großer Kraft
  rationale: Die instrumentale Präposition und die Grundbedeutung der Wörter werden klar und idiomatisch wiedergegeben.
- source_word: וּבְיָד חֲזָקָה
  choice: und starker Hand
  rationale: Die Übersetzung bleibt dem konventionellen Exodus-Ausdruck eng verbunden; „mächtiger Hand“ ist ebenfalls möglich und wird in Fußnote [b] genannt.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Zorn
  choice: soll dein Zorn … entbrennen
  alternative: solltest du … zornig sein
  rationale: Die gewählte Form bewahrt die Hitze-Metapher und damit die rhetorische und theologische Spannung des hebräischen Textes, ohne sie grob zu vergegenständlichen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Name wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Moses’ Bitte an Gott
  choice: flehte Jahwe … inständig an
  alternative: suchte Jahwes Gunst
  rationale: Die Übersetzung stellt Moses als eindringlich Bittenden dar, ohne vorwegzunehmen, wie das Verhältnis zwischen Fürbitte, Gottes Zorn und Gottes Beschluss systematisch zu erklären ist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem hebräischen Gedankengang, während feste Wendungen idiomatisch wiedergegeben werden. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
