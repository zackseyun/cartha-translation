  source_fidelity: 'Der Vers wird insgesamt präzise wiedergegeben: Moses richtet eine eindringliche Bitte an Jahwe, der Zorn richtet sich gegen „dein Volk“, und die Befreiung aus Ägypten geschieht durch große Kraft und starke Hand. Die Fußnote [a] bezeichnet ihre Paraphrase jedoch unzutreffend als wörtlich; das Verb וַיְחַל bedeutet nicht einfach „suchte“.'
  naturalness: „Mose flehte Jahwe, seinem Gott, inständig an“ ist modernes, natürliches Standarddeutsch. Die Dativ-Apposition „seinem Gott“ bei „Jahwe“ ist idiomatischer als die bisherige Akkusativ-Apposition und macht die Bezugnahme auf Mose klar.
  terminology: „Jahwe“, „Zorn entbrennen“, „dein Volk“, „große Kraft“ und „starke Hand“ sind angemessen, quellennah und registergerecht. Die Alternative „mächtiger Hand“ in [b] ist sinnvoll.
