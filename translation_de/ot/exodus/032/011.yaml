  rationale: 'Die Übersetzung wird nur behutsam angepasst: „jemandem zuflehen“ bildet die idiomatische Bedeutung der hebräischen Wendung natürlich ab und erlaubt die klare Apposition „seinem Gott“. Fußnote [a] wird von einer ungenauen angeblich wörtlichen Übersetzung zu einer sachgerechten Erklärung der hebräischen Wendung korrigiert. Aussage, Bildsprache, Gottesname und Fußnotenanker bleiben erhalten.'
