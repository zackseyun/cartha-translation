  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: de
  text: Er nahm das Kalb, das sie gemacht hatten, verbrannte es im Feuer, zermahlte es, bis es ganz fein war, streute es auf die Oberfläche des Wassers und ließ die Israeliten davon trinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ließ die Söhne Israels trinken“. Die hebräische Wendung ist eine feste Bezeichnung für das Volk Israel als Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵגֶל
  choice: das Kalb
  rationale: עֵגֶל bezeichnet ein Kalb beziehungsweise junges Rind; im Kontext ist die vertraute Bezeichnung „das Kalb“ klar und angemessen.
- source_word: אֲשֶׁר עָשׂוּ
  choice: das sie gemacht hatten
  rationale: Das Plusquamperfekt gibt die gegenüber den erzählten Handlungen vorausliegende Herstellung des Kalbes im Deutschen natürlich wieder.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: verbrannte es im Feuer
  rationale: Die konkrete Wendung gibt Verb und Präpositionalphrase eng am Hebräischen und zugleich idiomatisch wieder.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: zermahlte es, bis es ganz fein war
  rationale: טחן bezeichnet Mahlen oder Zermahlen; דק beschreibt das feine Ergebnis, ohne ausdrücklich „Pulver“ zu verlangen.
- source_word: וַיִּזֶר
  choice: streute es
  rationale: Das Verb bezeichnet hier das Ausstreuen beziehungsweise Verteilen der fein gemahlenen Überreste.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: auf die Oberfläche des Wassers
  rationale: Die Wiedergabe bewahrt das Bild von פְּנֵי als Oberfläche und klingt im modernen Deutsch natürlich.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: ließ die Israeliten davon trinken
  rationale: Der Hifil von שׁקה ist kausativ. „Ließ ... trinken“ gibt dies idiomatisch wieder; „davon“ verdeutlicht den im Hebräischen kontextuell erschlossenen Bezug auf das Wasser.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die hebräische Wendung bedeutet wörtlich „Söhne Israels“, dient aber als feste Bezeichnung für das Volk insgesamt. „Die Israeliten“ vermittelt diese korporative Bedeutung im Deutschen klar, ohne eine ausschließlich männliche Teilgruppe nahezulegen; die formale Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Erzählsprache mit enger Bindung an die hebräische Handlungsfolge. Die Reihung der Verben bleibt erhalten; übermäßig altertümliche Formen wie „tränkte“ oder „zerstäubte“ werden vermieden.
