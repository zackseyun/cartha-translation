source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: de
  text: 'Denk an Abraham, Isaak und Israel[a], deine Diener, denen du bei dir selbst geschworen und zu denen du gesagt hast: »Ich werde eure Nachkommen so zahlreich machen wie die Sterne am Himmel. Dieses ganze Land, von dem ich gesprochen habe, werde ich euren Nachkommen geben, und sie werden es für immer als Erbe besitzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Israel ist Jakob, der später diesen Namen erhielt. Im hebräischen Text steht hier ausdrücklich »Israel«.
    reason: Namensklärung und Bewahrung der ausdrücklichen hebräischen Lesart.
lexical_decisions:
- source_word: זְכֹר
  choice: Denk an
  rationale: Der Imperativ richtet sich in Moses Fürbitte an Gott. »Denk an« ist im modernen Deutsch natürlich und bewahrt den Charakter des Bundesappells, ohne ihn erklärend zu erweitern.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: Abraham, Isaak und Israel
  rationale: Die Eigennamen werden in ihren geläufigen deutschen Formen wiedergegeben. Der hebräische Text nennt den dritten Stammvater ausdrücklich »Israel«, nicht »Jakob«.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: עבד kann auch einen Sklaven bezeichnen; hier steht jedoch die Zugehörigkeit der Stammväter zu Gott als seine Bundesdiener im Vordergrund.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: denen du bei dir selbst geschworen hast
  rationale: Die Formulierung bewahrt, dass Gott selbst der Bürge seines Eides ist. »Bei dir selbst« gibt die reflexive Kraft von בָּךְ idiomatisch wieder.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: und zu denen du gesagt hast
  rationale: Vor direkter Rede ist »sagen« im Deutschen natürlicher als das formalere »sprechen«, ohne den Sinn zu verändern.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Ich werde eure Nachkommen so zahlreich machen
  rationale: Die Hifil-Form von רבה bezeichnet das Vermehren. זרע ist hier kollektiv und wird verständlich mit »Nachkommen« wiedergegeben.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: wie die Sterne am Himmel
  rationale: Dies ist die natürliche deutsche Wiedergabe des hebräischen Vergleichs und erhält dessen feierlichen Klang.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: Dieses ganze Land
  rationale: Die Formulierung bewahrt sowohl den demonstrativen Bezug als auch den umfassenden Sinn von כָּל.
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: von dem ich gesprochen habe
  rationale: Die Wiedergabe lässt den Relativsatz eigenständig und zieht das folgende Versprechen אֶתֵּן nicht vorzeitig in ihn hinein.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: werde ich euren Nachkommen geben
  rationale: Das Imperfekt drückt innerhalb der zitierten Verheißung die künftige Gabe des Landes aus; »Nachkommen« gibt זרע konsistent kollektiv wieder.
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: und sie werden es für immer als Erbe besitzen
  rationale: נחל bezeichnet das Empfangen beziehungsweise Besitzen als Erbe. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch »es« aus dem Zusammenhang aufgenommen.
theological_decisions:
- issue: Bezeichnung des Stammvaters als Israel statt Jakob
  choice: Israel im Haupttext beibehalten
  alternative: Jakob
  rationale: Der hebräische Text nennt den Stammvater ausdrücklich »Israel«. Eine Ersetzung durch »Jakob« würde die mit dem Bundesnamen verbundene Resonanz abschwächen.
- issue: Eidesformel בָּךְ
  choice: bei dir selbst
  alternative: bei deinem eigenen Selbst
  rationale: Die gewählte Formulierung macht verständlich, dass Gott bei sich selbst schwört, ohne die theologische Aussage auszubauen oder abzuschwächen.
- issue: Verhältnis von אֲשֶׁר אָמַרְתִּי und אֶתֵּן
  choice: von dem ich gesprochen habe, werde ich … geben
  alternative: von dem ich sagte, dass ich es … geben werde
  rationale: Die gewählte Fassung hält Relativsatz und folgende Verheißung getrennt und wahrt damit die offenere hebräische Satzfügung, statt den Inhalt des nächsten Satzglieds in den Relativsatz zu verlagern.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht feierlichem Klang. Die direkte Rede bleibt klar gegliedert; unnötige Archaismen und konfessionell geprägte Sonderbegriffe werden vermieden.
