  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֖ה אִם תִּשָּׂ֣א חַטָּאתָ֑/ם וְ/אִם אַ֕יִן מְחֵ֣/נִי נָ֔א מִֽ/סִּפְרְ/ךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: de
  text: Doch nun, wenn du ihre Sünde vergibst[a] — wenn aber nicht, dann tilge mich doch aus deinem Buch, das du geschrieben hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine Wendung mit „heben/tragen“ und „Sünde“; sie kann auch als „ihre Sünde wegträgst“ oder „ihnen ihre Sünde verzeihst“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Mit „deinem Buch“ kann ein göttliches Verzeichnis der Lebenden oder, weiter gefasst, das Buch des Lebens gemeint sein; der hebräische Text legt dies nicht näher fest.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Doch nun
  rationale: Leitet nach Moses Fürbitte eine dringliche, im Kontext kontrastierende Bitte ein; „Doch nun“ gibt diesen Diskurswechsel natürlich wieder.
- source_word: תִּשָּׂא
  choice: vergibst
  rationale: נשׂא bedeutet wörtlich „heben/tragen“; mit „Sünde“ als Objekt bezeichnet die Wendung das Wegnehmen beziehungsweise Vergeben von Schuld.
- source_word: חַטָּאתָם
  choice: ihre Sünde
  rationale: Bewahrt den Singular mit dem Suffix der 3. Person Plural und die volle religiös-ethische Bedeutung des Ausdrucks.
- source_word: וְאִם אַיִן
  choice: wenn aber nicht
  rationale: Gibt die elliptische negative Bedingung und ihren Gegensatz zur ersten Satzhälfte idiomatisch wieder.
- source_word: מְחֵנִי נָא
  choice: dann tilge mich doch
  rationale: מחה bezeichnet im Bild eines Buches das Auslöschen eines Eintrags; „doch“ gibt hier die flehentliche Partikel נָא natürlich wieder.
- source_word: מִסִּפְרְךָ
  choice: aus deinem Buch
  rationale: ספר kann Buch, Schriftrolle oder Verzeichnis bedeuten. „Buch“ bleibt offen genug und bewahrt zugleich das Bild des geschriebenen göttlichen Registers.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: das du geschrieben hast
  rationale: Die Relativkonstruktion bezeichnet das Buch als von Gott selbst geschrieben; das Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Relevanz wieder.
theological_decisions:
- issue: Bedeutung von „deinem Buch“
  choice: deinem Buch
  alternative: deiner Schriftrolle / deinem Verzeichnis / dem Buch des Lebens
  rationale: Der hebräische Text bestimmt den Gegenstand nicht näher. Die schlichte Wiedergabe bewahrt die Offenheit zwischen einem göttlichen Verzeichnis der Lebenden, dem sogenannten Buch des Lebens und einem anderen göttlichen Register.
- issue: Unvollständiger erster Bedingungssatz
  choice: Gedankenstrich nach „vergibst“ ohne ergänzten Hauptsatz
  alternative: eine Ergänzung wie „dann vergib ihnen“ oder „so sei es“
  rationale: Auch der hebräische Satz bricht nach der ersten Bedingung ab. Die syntaktische Spannung wird bewahrt, statt eine nicht ausdrücklich genannte Folgerung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der abgebrochene erste Bedingungssatz und die nicht näher bestimmte Bedeutung des göttlichen Buches bleiben erhalten. „Tilge“ ist leicht gehoben, aber im Bild eines geschriebenen Eintrags klar und angemessen.
