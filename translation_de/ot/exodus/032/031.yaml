  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: de
  text: 'Da kehrte Mose zu Jahwe zurück und sagte: „Ach, dieses Volk hat eine große Sünde begangen und sich Götter aus Gold[a] gemacht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Gott aus Gold“. Im Hebräischen steht formal der Plural „Götter aus Gold“; wegen des goldenen Kalbes im unmittelbaren Zusammenhang wird die Wendung jedoch teilweise singularisch verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kehrte … zurück
  rationale: שׁוב bezeichnet hier Moses Rückkehr zu Jahwe nach seiner Begegnung mit dem Volk; die deutsche Wendung ist natürlich und wahrt die Bewegungsrichtung.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition אֶל ist direktional; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אָנָּא
  choice: Ach
  rationale: Die Partikel leitet hier Moses eindringliche, von Bestürzung geprägte Bitte beziehungsweise Fürsprache ein. „Ach“ gibt diesen Ton im Deutschen natürlicher wieder als ein isoliertes „Bitte“ vor einer Feststellung.
- source_word: חָטָא הָעָם הַזֶּה חֲטָאָה גְדֹלָה
  choice: dieses Volk hat eine große Sünde begangen
  rationale: Die Übersetzung bewahrt das kollektive Singularwort „Volk“ und gibt die figura etymologica aus Verb und Substantiv mit einer idiomatischen deutschen Verbindung wieder.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: sie haben sich … gemacht
  rationale: Das reflexiv-benefaktive לָהֶם wird durch „sich“ ausgedrückt; das Perfekt wahrt den abgeschlossenen Vorgang mit fortdauernder Relevanz.
- source_word: אֱלֹהֵי זָהָב
  choice: Götter aus Gold
  rationale: Die hebräische Konstruktion steht formal im Plural und bezeichnet das Material. Der Plural bleibt im Haupttext erhalten; die kontextuell mögliche singularische Deutung wird in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottes offenbarter Bundesname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Numerus von אֱלֹהֵי זָהָב
  choice: Götter aus Gold
  alternative: ein Gott aus Gold
  rationale: Die Form ist grammatisch pluralisch. Obwohl der weitere Erzählzusammenhang das eine goldene Kalb in den Mittelpunkt stellt, wird diese Spannung nicht stillschweigend zugunsten des Singulars aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der hebräischen Satzstruktur, vermeidet aber unnatürliche Wörtlichkeit. „Ach“ vermittelt Moses bestürzten und flehenden Ton.
