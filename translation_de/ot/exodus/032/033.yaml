  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא לִ֔/י אֶמְחֶ֖/נּוּ מִ/סִּפְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Wer gegen mich gesündigt hat, den werde ich aus meinem Buch auslöschen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „den werde ich aus meinem Buch wegwischen“. Was mit Gottes „Buch“ genau gemeint ist, bleibt im Hebräischen offen; manche verstehen darunter das „Buch des Lebens“.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Da sagte“ gibt diesen Fortgang im modernen Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „Mose“ ist die übliche deutsche Namensform.
- source_word: מִי אֲשֶׁר
  choice: Wer
  rationale: Die indefinite Relativkonstruktion wird im Deutschen idiomatisch mit „Wer …, den …“ ausgedrückt.
- source_word: חָטָא לִי
  choice: gegen mich gesündigt hat
  rationale: חטא mit ל bezeichnet eine gegen jemanden gerichtete Sünde; das Perfekt beschreibt hier die bereits begangene Verfehlung.
- source_word: אֶמְחֶנּוּ
  choice: den werde ich … auslöschen
  rationale: מחה bezeichnet das Wegwischen oder Auslöschen; zusammen mit „aus meinem Buch“ bleibt das Bild des Tilgens eines Eintrags erhalten. Das Pronomen wird durch die natürliche deutsche Korrelativkonstruktion „Wer …, den …“ wiedergegeben.
- source_word: מִסִּפְרִי
  choice: aus meinem Buch
  rationale: סֵפֶר bedeutet hier „Buch“ beziehungsweise schriftliches Verzeichnis; מן bezeichnet die Entfernung daraus.
theological_decisions:
- issue: Bedeutung von „meinem Buch“
  choice: Die offene Metapher „meinem Buch“ bleibt im Haupttext erhalten.
  alternative: „Buch des Lebens“, „Verzeichnis der Lebenden“ oder „Bundesregister“
  rationale: Der hebräische Text bestimmt die Art des Buches nicht näher. Eine Präzisierung würde eine umstrittene theologische Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Korrelativkonstruktion „Wer …, den …“ ist natürlich und bewahrt den generalisierenden Sinn sowie den maskulinen Singular des hebräischen Suffixes. Der Fußnotenmarker steht nach dem vollständigen Zitat, da die Anmerkung sowohl „auslöschen“ als auch „mein Buch“ erläutert.
