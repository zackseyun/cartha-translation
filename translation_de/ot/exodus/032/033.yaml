  terminology: „Jahwe“ entspricht der festgelegten Wiedergabe des Tetragramms; „Mose“ ist die deutsche Standardnamensform. Die Metapher „mein Buch“ bleibt ausdrücklich offen. Die Fußnote bietet mit „wegwischen“ eine vertretbare lexikalische Alternative und kennzeichnet „Buch des Lebens“ klar als bloßes Verständnis mancher Ausleger, nicht als Textaussage.
