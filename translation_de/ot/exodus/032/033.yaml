  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und den Sinn präzise wieder: Narrativfortgang („Da sagte“), Gottesname („Jahwe“), Adressat („zu Mose“), die verallgemeinernde Relativkonstruktion („Wer …, den …“), das vollendete Vergehen („gesündigt hat“) sowie das Tilgen aus Gottes Buch. „Aus meinem Buch auslöschen“ bildet אֶמְחֶנּוּ מִסִּפְרִי angemessen ab, ohne den Referenten des Buches einzuengen.'
