  text: וַ/יַּעֲמֹ֤ד מֹשֶׁה֙ בְּ/שַׁ֣עַר הַֽ/מַּחֲנֶ֔ה וַ/יֹּ֕אמֶר מִ֥י לַ/יהוָ֖ה אֵלָ֑/י וַ/יֵּאָסְפ֥וּ אֵלָ֖י/ו כָּל בְּנֵ֥י לֵוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: de
  text: 'Da stellte sich Mose an das Tor des Lagers und sagte: »Wer für Jahwe ist, zu mir!« Da versammelten sich alle Söhne Levis[a] zu ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Leviten«. Wörtlich: »alle Söhne Levis«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: stellte sich
  rationale: עמד bezeichnet hier, dass Mose eine stehende Position einnimmt. »Stellte sich« klingt im deutschen Erzählzusammenhang natürlicher und zielgerichteter als das bloße »stand«, ohne eine förmliche oder militärische Haltung hinzuzufügen.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: an das Tor des Lagers
  rationale: שַׁעַר bezeichnet das Tor beziehungsweise den Torbereich. Mit dem Bewegungsverb »stellte sich« ist im Deutschen »an das Tor« idiomatisch; das konkrete Bild des Tores bleibt erhalten.
- source_word: מִי לַיהוָה
  choice: Wer für Jahwe ist
  rationale: Wörtlich lautet die elliptische Frage »Wer [ist] für Jahwe?« Die Wiedergabe bewahrt sowohl die Frageform als auch den Sinn der Parteinahme beziehungsweise Loyalität.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, der im modernen Deutschen üblichen Transkription des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: אֵלָי
  choice: zu mir
  rationale: Das Hebräische enthält nur die knappe Richtungsangabe »zu mir!« ohne ausdrückliches Bewegungsverb. Die deutsche Ellipse ist verständlich und bewahrt die markante Kürze des Aufrufs.
- source_word: וַיֵּאָסְפוּ
  choice: versammelten sich
  rationale: Die Niphalform von אסף bezeichnet hier das Zusammenkommen beziehungsweise Sichversammeln. »Versammelten sich« gibt die mediale Bedeutung natürlich wieder, ohne militärische Färbung.
- source_word: אֵלָיו
  choice: bei ihm
  rationale: Die Präposition bezeichnet die Bewegung auf Mose zu; im Ergebnis haben sie sich bei ihm versammelt. »Bei ihm« ist zusammen mit »versammelten sich« natürliches Deutsch.
- source_word: כָּל בְּנֵי לֵוִי
  choice: alle Söhne Levis
  rationale: Dies bildet die wörtliche Stammesbezeichnung »alle Söhne Levis« ab. Die geläufigere funktionale Wiedergabe »alle Leviten« wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt den Eigennamen, statt ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Bedeutung von מִי לַיהוָה
  choice: Wer für Jahwe ist
  alternative: Wer gehört Jahwe?
  rationale: Das ל kann Zugehörigkeit oder Parteinahme ausdrücken. Im Zusammenhang der Aufforderung steht Loyalität im Vordergrund; »für Jahwe« wahrt jedoch die knappe Mehrdeutigkeit besser als das eindeutigere »gehört Jahwe«.
- issue: Stammesbezeichnung בְּנֵי לֵוִי
  choice: alle Söhne Levis
  alternative: alle Leviten
  rationale: Die konkrete Verwandtschafts- und Stammesformulierung des Hebräischen bleibt im Haupttext erhalten; die idiomatische Gruppenbezeichnung steht als Alternative in der Fußnote.
translation_notes:
  register: 'Moderne, würdevolle Erzählsprache. Moses Aufruf bleibt entsprechend dem Hebräischen knapp und elliptisch: »Wer für Jahwe ist, zu mir!« Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.'
