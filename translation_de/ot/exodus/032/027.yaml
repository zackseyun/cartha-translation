revisions:
- from: 'Und er sagte zu ihnen: »So spricht Jahwe, der Gott Israels: Jeder soll sein Schwert an seine Hüfte legen. Zieht durch das Lager, kehrt um und geht von Tor zu Tor, und jeder töte seinen Bruder, jeder seinen Gefährten und jeder seinen Nächsten[a].«'
  to: 'Und er sagte zu ihnen: »So spricht Jahwe, der Gott Israels: Jeder lege sein Schwert an seine Hüfte. Geht im Lager von Tor zu Tor hin und her, und jeder töte seinen Bruder, und jeder seinen Gefährten, und jeder seinen Nahestehenden[a].«'
  rationale: Die Revision ersetzt die im Deutschen semantisch zu allgemeine Wiedergabe »Nächsten« durch »Nahestehenden« und erhält die mögliche Verwandtschaftsbedeutung in der Fußnote. Die Bewegungsanweisung wird idiomatisch als wiederholtes Gehen im Lager formuliert. Die wiederholte distributive Struktur von אִישׁ und die direkte Befehlsform bleiben erhalten.
