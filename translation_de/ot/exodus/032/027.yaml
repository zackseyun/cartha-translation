  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: de
  text: 'Und er sagte zu ihnen: »So spricht Jahwe, der Gott Israels: Jeder lege sein Schwert an seine Hüfte. Geht im Lager von Tor zu Tor hin und her, und jeder töte seinen Bruder, und jeder seinen Gefährten, und jeder seinen Nahestehenden[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »seinen Nahestehenden«; auch möglich: »seinen nahen Verwandten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Und er sagte zu ihnen
  rationale: Bewahrt den hebräischen Erzählanschluss und gibt die Redeanleitung natürlich wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird in ihrer autoritativen, im Deutschen vertrauten Form erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen etablierte Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Jeder soll sein Schwert an seine Hüfte legen
  rationale: Erhält die konkrete Körperangabe und den distributiven Sinn von אִישׁ; die deutsche Soll-Konstruktion gibt den Wechsel von der Pluralaufforderung zum distributiven Singular verständlich wieder.
- source_word: עִבְרוּ וָשׁוּבוּ מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: Zieht durch das Lager, kehrt um und geht von Tor zu Tor
  rationale: Gibt beide Imperative wieder, ohne die Bewegungsrichtung übermäßig festzulegen; die räumliche Wendung wird idiomatisch in den Satz eingebunden.
- source_word: וְהִרְגוּ
  choice: und ... töte
  rationale: Töten ist die klare, unmittelbare Bedeutung; die distributive Singularform folgt dem wiederholten אִישׁ.
- source_word: רֵעֵהוּ
  choice: seinen Gefährten
  rationale: Gefährte deckt einen persönlichen Mitmenschen oder Zugehörigen ab, ohne zwingend enge Freundschaft vorauszusetzen.
- source_word: קְרֹבוֹ
  choice: seinen Nächsten
  rationale: Bewahrt den Grundgedanken räumlicher oder verwandtschaftlicher Nähe und lässt die im Hebräischen vorhandene Bedeutungsbreite offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Eigennamen; die Umschrift bewahrt diese Unterscheidung gegenüber dem Titel אֲדֹנָי.
- issue: Distributives אִישׁ in der Tötungsanweisung
  choice: Jeder ... jeder ... jeder
  alternative: Alle ... ihre Brüder, Gefährten und Nächsten
  rationale: Die Wiederholung hebt die individuelle Verpflichtung und die erschütternde Nähe der Betroffenen hervor; sie wird daher nicht geglättet.
- issue: Bedeutungsweite von קְרֹבוֹ
  choice: Nächsten mit Fußnote
  alternative: nahen Verwandten
  rationale: Das Wort kann einen Nahestehenden oder nahen Verwandten bezeichnen. Die Hauptfassung wahrt die Weite, während die Fußnote die mögliche Verwandtschaftsbedeutung nennt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Redeformel bleibt bewusst feierlich; archaische Formen wie »gürten« oder »erschlagen« werden vermieden. Die harte Direktheit der Anweisung und die dreifache distributive Wiederholung bleiben erhalten.
