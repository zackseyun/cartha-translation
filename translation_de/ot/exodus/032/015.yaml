  text: וַ/יִּ֜פֶן וַ/יֵּ֤רֶד מֹשֶׁה֙ מִן הָ/הָ֔ר וּ/שְׁנֵ֛י לֻחֹ֥ת הָ/עֵדֻ֖ת בְּ/יָד֑/וֹ לֻחֹ֗ת כְּתֻבִים֙ מִ/שְּׁנֵ֣י עֶבְרֵי/הֶ֔ם מִ/זֶּ֥ה וּ/מִ/זֶּ֖ה הֵ֥ם כְּתֻבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: de
  text: Da wandte sich Mose um und stieg vom Berg hinab. In seiner Hand hielt er die beiden Tafeln des Zeugnisses, Tafeln, die auf beiden Seiten beschrieben waren; auf der einen wie auf der anderen Seite waren sie beschrieben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: wandte sich ... um
  rationale: פנה bezeichnet hier im Erzählablauf Moses Richtungswechsel vor dem Abstieg. „Sich umwenden“ ist im Deutschen natürlich und gibt den Vorgang klar wieder.
- source_word: וַיֵּרֶד
  choice: stieg ... hinab
  rationale: ירד bedeutet „hinabgehen, hinabsteigen“. In Verbindung mit einem Berg ist „hinabsteigen“ idiomatisch und wahrt die Erzählperspektive.
- source_word: הָהָר
  choice: der Berg
  rationale: הַר kann Berg oder Anhöhe bedeuten; im Sinaikontext ist „der Berg“ sachlich und kontextuell angemessen.
- source_word: שְׁנֵי לֻחֹת
  choice: die beiden Tafeln
  rationale: לֻחֹת bezeichnet Tafeln. Das Material Stein wird in diesem Vers nicht ausdrücklich genannt und daher nicht ergänzt.
- source_word: הָעֵדֻת
  choice: des Zeugnisses
  rationale: עֵדוּת bedeutet „Zeugnis“ und dient als geprägte Bezeichnung für die Tafeln. Die Wiedergabe wahrt den theologischen Klang, ohne den Ausdruck auf „Bundesurkunde“ einzuengen.
- source_word: בְּיָדוֹ
  choice: In seiner Hand hielt er
  rationale: Der hebräische Ausdruck steht im Singular. Die deutsche Formulierung behält diesen bei und macht zugleich die Begleitumstandsangabe natürlich verständlich.
- source_word: לֻחֹת כְּתֻבִים
  choice: Tafeln, die ... beschrieben waren
  rationale: Das passive Partizip von כתב bezeichnet die Tafeln als beschrieben. „Beschrieben“ passt im Deutschen besser zu Flächen als das missverständliche „geschrieben“.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: auf beiden Seiten
  rationale: Die Wendung besagt, dass sich die Schrift auf den beiden Seiten beziehungsweise Flächen der Tafeln befand. Die Übersetzung ist knapp und idiomatisch.
- source_word: מִזֶּה וּמִזֶּה
  choice: auf der einen wie auf der anderen Seite
  rationale: Die distributive Wendung hebt beide Seiten einzeln hervor. Diese Formulierung bewahrt die Ausgewogenheit und den Nachdruck des Hebräischen.
- source_word: הֵם כְּתֻבִים
  choice: waren sie beschrieben
  rationale: Die Wiederholung der Aussage über die Beschriftung wird beibehalten, statt sie stilistisch zu tilgen.
theological_decisions:
- issue: Wiedergabe von עֵדוּת in „Tafeln des Zeugnisses“
  choice: des Zeugnisses
  alternative: des Bundes / der Urkunde
  rationale: „Zeugnis“ entspricht dem hebräischen Ausdruck und bewahrt seine geprägte bundestheologische Bedeutung, ohne eine stärker deutende Paraphrase in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung zur beidseitigen Beschriftung bleibt erhalten. Der Satz wurde zur besseren deutschen Lesbarkeit nach „hinab“ geteilt; dabei bleibt der fortlaufende Erzählzusammenhang gewahrt.
