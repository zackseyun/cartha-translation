  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: de
  text: Da ließ sich Jahwe das Unheil leid sein, das er seinem Volk angedroht hatte.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da änderte Jahwe seine Absicht in Bezug auf das Unheil.“ Das hebräische Verb kann auch „bereuen“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht hier „das Böse/Unheil“. Gemeint ist die angedrohte Katastrophe, nicht ein moralisch böses Handeln Gottes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: ließ sich … leid sein
  rationale: Das Nifal von נחם bezeichnet hier, dass Jahwe von dem angekündigten Handeln absieht. Die traditionelle, noch verständliche deutsche Wendung bewahrt die anthropopathische Spannung, ohne sie als Irrtum oder bloßes Bedauern festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל הָרָעָה
  choice: das Unheil
  rationale: רָעָה meint in diesem Gerichtskontext das angedrohte Unheil, nicht moralisch Böses in Gott. Die Konstruktion נחם על wird in der deutschen Wendung idiomatisch ausgedrückt.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת
  choice: das er … angedroht hatte
  rationale: Die Wiedergabe fasst die zuvor ausgesprochene Absicht, Unheil zu tun, in natürlichem Deutsch zusammen; der Kontext macht den drohenden Charakter der Rede deutlich.
- source_word: לְעַמּוֹ
  choice: seinem Volk
  rationale: Das Volk ist von dem angekündigten Unheil betroffen; im Deutschen wird diese Beziehung bei „androhen“ mit dem Dativ natürlich ausgedrückt.
theological_decisions:
- issue: Anthropopathische Rede über Gott in וַיִּנָּחֶם
  choice: „ließ sich … leid sein“ im Haupttext
  alternative: „änderte seine Absicht“ oder „bereute“
  rationale: Die Formulierung zeigt einen wirklichen Wechsel des angekündigten Handelns als Reaktion auf Moses Fürbitte, ohne die Spannung durch eine dogmatische Erklärung über Gottes Veränderlichkeit aufzulösen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. „Sich etwas leid sein lassen“ ist bewusst gewählt: Es ist idiomatisch, bibelsprachlich vertraut und lässt die Bedeutungsbreite von נחם sowie die theologische Spannung bestehen.'
