  text: וַ/יֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְ/אֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/018.yaml
  text: And he said[a], “It is not the sound of a cry of victory, and it is not the sound of a cry of defeat; I hear the sound of singing.”
translation:
  language: de
  text: 'Da sagte er: »Das ist weder der Klang von Siegesgeschrei noch der Klang von Niederlagengeschrei; den Klang von Gesang[a] höre ich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rufen« beziehungsweise »Geschrei«. Die hebräischen Formen von ענה können stimmliche Erwiderung, Rufen oder Geschrei bezeichnen; der letzte Satz kann daher auch allgemeiner lauten: »Den Klang von Geschrei höre ich.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹת / עַנּוֹת
  choice: Geschrei / Wechselgesang
  rationale: Die Formen von ענה bezeichnen hier einen vernehmbaren menschlichen Laut. In den ersten beiden Gliedern legt die Verbindung mit Stärke beziehungsweise Schwäche Kampfgeschrei nahe. Im Schlussglied kann die Form responsorisches Singen bezeichnen; „Wechselgesang“ bewahrt diese mögliche Nuance, während die Fußnote die allgemeinere Deutung „Rufen/Geschrei“ festhält.
- source_word: גְּבוּרָה
  choice: Sieg
  rationale: Das Wort bezeichnet häufig Stärke oder Macht; im Gegensatz zu חֲלוּשָׁה und beim vermeintlichen Schlachtenlärm ist funktional das triumphierende Geschrei eines Sieges gemeint.
- source_word: חֲלוּשָׁה
  choice: Niederlage
  rationale: Das Wort ist mit Schwäche verbunden, bezeichnet im militärischen Kontrast hier aber das Geschrei der Unterlegenen.
- source_word: קוֹל
  choice: Klang
  rationale: „Klang“ lässt sich in allen drei Wiederholungen natürlich verwenden und ist neutraler als „Stimme“ oder „Lärm“.
- source_word: אֵין
  choice: weder … noch
  rationale: Die doppelte Negation wird im Deutschen idiomatisch als korrelative Fügung wiedergegeben, ohne den Gegensatz abzuschwächen.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: höre ich
  rationale: Pronomen und Partizip drücken gegenwärtiges Wahrnehmen aus; die nachgestellte Form bewahrt die Hervorhebung des wahrgenommenen Klangs.
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Die Form führt im hebräischen Erzählfluss die Antwort ein; „Da sagte er“ ist dafür eine natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Klang-Wiederholung und der militärische Gegensatz bleiben erhalten. „Wechselgesang“ gibt die mögliche responsorische Nuance des letzten Ausdrucks wieder, ohne die lexikalische Mehrdeutigkeit zu verdecken.
