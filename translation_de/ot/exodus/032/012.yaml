  to: 'Warum sollen die Ägypter sagen[a]: »In böser Absicht hat er sie herausgeführt, um sie im Gebirge zu töten und sie vom Erdboden zu vertilgen[b]«? Lass ab von deinem glühenden Zorn und nimm Abstand von dem Unheil[c], das du deinem Volk zugedacht hast.'
  rationale: Nur der Schlusssatz wird überarbeitet. »Nimm Abstand von dem Unheil« gibt die Bitte um ein Absehen vom angekündigten Unheil in natürlichem modernem Deutsch wieder. Der Relativsatz »das du deinem Volk zugedacht hast« macht den prospektiven Charakter deutlich, ohne die Deutung als bereits verwirklichte Tat nahezulegen. Die Fußnote wird entsprechend an die neue Formulierung angepasst; alle Marker bleiben korrekt verankert.
