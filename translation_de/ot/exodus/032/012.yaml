base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: de
  text: 'Warum sollen die Ägypter sagen[a]: »In böser Absicht hat er sie herausgeführt, um sie im Gebirge zu töten und sie vom Erdboden zu vertilgen[b]«? Lass ab von deinem glühenden Zorn und nimm Abstand von dem Unheil[c], das du deinem Volk zugedacht hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Warum sollen die Ägypter sagen: Er hat sie zum Bösen herausgeführt …?« Die hebräische Wendung bezeichnet hier wahrscheinlich die böse Absicht, die sie Gott unterstellen würden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sie vollständig zu vernichten«. Das hebräische Verb bezeichnet ein vollständiges Ende beziehungsweise eine vollständige Vernichtung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »lass dich wegen des Unheils für dein Volk umstimmen« beziehungsweise »ändere deinen Entschluss zum Unheil für dein Volk«. Mose spricht hier in menschlich-relationaler Weise von Gott.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Warum sollen die Ägypter sagen
  rationale: Die rhetorische Frage und der imperfektive Verbgebrauch werden im Deutschen natürlich mit »Warum sollen … sagen« wiedergegeben; מִצְרַיִם bezeichnet hier die Ägypter als Volk.
- source_word: בְּרָעָה
  choice: in böser Absicht
  rationale: Die Wendung bezeichnet den böswilligen Beweggrund, den die Ägypter Gott unterstellen würden, nicht bloß eine schädliche Folge.
- source_word: הוֹצִיאָם
  choice: hat er sie herausgeführt
  rationale: Gibt den Hifil von יצא im Exoduszusammenhang direkt und idiomatisch wieder.
- source_word: לַהֲרֹג אֹתָם בֶּהָרִים
  choice: um sie im Gebirge zu töten
  rationale: Die Infinitivkonstruktion drückt den unterstellten Zweck aus; der hebräische Plural kann kollektiv als Bergland beziehungsweise Gebirge verstanden werden.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: und sie vom Erdboden zu vertilgen
  rationale: כלה im Piel bezeichnet vollständige Vernichtung; »vom Erdboden vertilgen« bewahrt das räumliche Bild und ist im Deutschen idiomatisch.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Lass ab von deinem glühenden Zorn
  rationale: Der Imperativ fordert zur Abkehr vom Zorn auf; »glühend« erhält das hebräische Bild der Zorneshitze.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: und lass dich das Unheil gereuen, das du über dein Volk bringen willst
  rationale: נחם im Nifal bezeichnet hier ein Abstandnehmen von angekündigtem Handeln; רעה meint das drohende Unheil. Der Relativsatz macht im Deutschen deutlich, dass es um die angekündigte Maßnahme gegen das Volk geht.
theological_decisions:
- issue: Anthropopathische Rede von Gott in וְהִנָּחֵם
  choice: lass dich … gereuen
  alternative: nimm Abstand; ändere deinen Entschluss; lass dich umstimmen
  rationale: Die gewählte Formulierung bewahrt die anstößige und relationale Kraft von Moses Bitte, ohne moralische Schuld Gottes zu behaupten. Eine Fußnote nennt weniger anthropomorph klingende Möglichkeiten.
- issue: Bedeutung von הָרָעָה bei Gottes angekündigtem Handeln
  choice: Unheil
  alternative: Unglück; Schaden; Böses
  rationale: »Unheil« bezeichnet die angedrohte vernichtende Folge, ohne Gottes Handeln als moralisch böse zu qualifizieren. Zugleich bleibt der Wortklang zur vorherigen »bösen Absicht« erkennbar, ohne beide Verwendungen gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und eindringlich; »Gebirge«, »Erdboden« und »glühender Zorn« bewahren die Bildsprache, ohne unnötig altertümlich zu wirken. Sämtliche Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
