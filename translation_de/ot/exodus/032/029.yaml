source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה מִלְא֨וּ יֶדְ/כֶ֤ם הַ/יּוֹם֙ לַֽ/יהוָ֔ה כִּ֛י אִ֥ישׁ בִּ/בְנ֖/וֹ וּ/בְ/אָחִ֑י/ו וְ/לָ/תֵ֧ת עֲלֵי/כֶ֛ם הַ/יּ֖וֹם בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: de
  text: 'Und Mose sagte: „Weiht euch heute dem HERRN[a]; denn jeder von euch hat sich gegen seinen Sohn und seinen Bruder gestellt, damit euch heute Segen zuteilwird.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Füllt heute eure Hand für den HERRN“; dies ist eine hebräische Wendung für die Weihe oder Einsetzung zu einem Dienst.'
    reason: Erklärt das zugrunde liegende Idiom und bewahrt den Zugang zur ungewöhnlichen Bildsprache des Hebräischen.
  - marker: b
    text: Im Hebräischen ist nicht ausdrücklich gesagt, wer den Segen gibt; außerdem kann die Formulierung sowohl Zweck als auch Folge ausdrücken.
    reason: Macht die grammatische und semantische Mehrdeutigkeit des abschließenden Infinitivs sichtbar.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: Weiht euch
  rationale: Wörtlich „füllt eure Hand“; die feste hebräische Wendung bezeichnet die Einsetzung beziehungsweise Weihe zu einem Dienst. „Weiht euch“ gibt das Idiom verständlich wieder, ohne einen bestimmten späteren Ordinationsritus einzutragen.
- source_word: לַיהוָה
  choice: dem HERRN
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Weihe auf JHWH; der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit „HERR“ wiedergegeben.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: denn jeder von euch hat sich gegen seinen Sohn und seinen Bruder gestellt
  rationale: Der hebräische Satz ist stark verkürzt und enthält kein ausdrückliches Verb. Aus dem unmittelbaren Zusammenhang ergibt sich das entschlossene Vorgehen selbst gegen engste Angehörige; „hat sich gegen … gestellt“ bewahrt dabei die Härte und die relative Offenheit der Formulierung.
- source_word: וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה
  choice: damit euch heute Segen zuteilwird
  rationale: Die unpersönliche Formulierung gibt den Zweck beziehungsweise das Ergebnis wieder, ohne das im Hebräischen nicht ausdrücklich genannte Subjekt des Segnens festzulegen.
theological_decisions:
- issue: Wer den Segen gibt
  choice: 'Unpersönlich: „damit euch heute Segen zuteilwird“'
  alternative: „damit er euch heute Segen gibt“
  rationale: Im hebräischen Infinitiv ist das Subjekt nicht ausdrücklich genannt. Die Übersetzung vermeidet es, Mose oder den HERRN grammatisch eindeutig als Geber festzulegen.
- issue: Bedeutung der Weihe nach dem Gericht an den Angehörigen
  choice: Die Weihe und das Sich-Stellen gegen Sohn und Bruder werden eng verbunden, ohne den Verlust eines Angehörigen ausdrücklich als Preis oder Opfer zu deuten.
  alternative: „jeder auf Kosten seines Sohnes oder Bruders“
  rationale: „Auf Kosten von“ ist eine mögliche kontextuelle Deutung, steht jedoch nicht ausdrücklich im hebräischen Wortlaut und würde die theologische Spannung stärker auslegen als übersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Weiht euch“ ist allgemein verständlich und weniger institutionell verengt als „lasst euch ordinieren“. Die drastische familiäre Gegenüberstellung bleibt erhalten; die Ellipse des Hebräischen wird nur so weit ergänzt, wie es für natürliches Deutsch nötig ist.
