  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַ/זָּהָ֔ב אֲשֶׁר֙ בְּ/אָזְנֵ֣י נְשֵׁי/כֶ֔ם בְּנֵי/כֶ֖ם וּ/בְנֹתֵי/כֶ֑ם וְ/הָבִ֖יאוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: de
  text: 'Und Aaron sagte zu ihnen: „Nehmt die goldenen Ringe ab[a], die eure Frauen, eure Söhne und eure Töchter an den Ohren tragen, und bringt sie zu mir.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reißt die goldenen Ringe ab“. Das hebräische Verb kann ein gewaltsames Abnehmen oder Abreißen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der Erzählform führt die Handlung weiter; „Und … sagte“ bewahrt den hebräischen Erzählfluss in natürlichem Deutsch.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Das ausdrückliche Pronomen wird beibehalten und nicht durch eine deutende Bezeichnung wie „zum Volk“ ersetzt.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: פָּרְקוּ
  choice: Nehmt … ab
  rationale: Das Verb kann ein kräftiges Abreißen oder Losbrechen bezeichnen; beim Schmuck ist „abnehmen“ die natürliche Hauptwiedergabe. Die stärkere Bedeutung wird in einer Fußnote bewahrt.
- source_word: נִזְמֵי הַזָּהָב
  choice: die goldenen Ringe
  rationale: Die Wendung bezeichnet aus Gold gefertigte Ringe. „Goldene Ringe“ ist im Deutschen natürlich und lässt die folgende Ortsangabe „an den Ohren“ ihre Art näher bestimmen.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: die … an den Ohren tragen
  rationale: Die relative Ortsangabe wird im Deutschen idiomatisch verbal wiedergegeben; der Sinn, dass sich die Ringe an den Ohren befinden, bleibt erhalten.
- source_word: נְשֵׁיכֶם
  choice: eure Frauen
  rationale: In diesem Haushaltszusammenhang sind Ehefrauen gemeint; „eure Frauen“ ist die natürliche moderne deutsche Bezeichnung.
- source_word: בְּנֵיכֶם
  choice: eure Söhne
  rationale: Das Hebräische nennt ausdrücklich die Söhne und nicht allgemein die Kinder.
- source_word: וּבְנֹתֵיכֶם
  choice: und eure Töchter
  rationale: Die Töchter werden ausdrücklich parallel zu den Söhnen genannt.
- source_word: וְהָבִיאוּ אֵלָי
  choice: und bringt sie zu mir
  rationale: Das Objektpronomen „sie“ wird im Deutschen zur Klarheit ergänzt und bezieht sich auf die Ringe.
