  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן מֶֽה עָשָׂ֥ה לְ/ךָ֖ הָ/עָ֣ם הַ/זֶּ֑ה כִּֽי הֵבֵ֥אתָ עָלָ֖י/ו חֲטָאָ֥ה גְדֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/021.yaml
  text: Moses said to Aaron[a], “What did this people do to you, that you have brought a great sin upon them?”
translation:
  language: de
  text: 'Mose sagte zu Aaron: „Was hat dir dieses Volk getan, dass du eine große Sünde über es gebracht hast?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das Wayyiqtol führt die Erzählung fort; im natürlichen deutschen Erzählstil genügt das Präteritum ohne ein ausdrückliches „und“.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Was hat dir dieses Volk getan
  rationale: עשה mit ל bezeichnet hier, was jemand einem anderen antut. „Dieses Volk“ bewahrt den Demonstrativcharakter und den distanzierenden Ton.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier die Folge beziehungsweise den Inhalt der vorwurfsvollen Frage ein; „dass“ ist im Deutschen idiomatisch.
- source_word: הֵבֵאתָ
  choice: du ... gebracht hast
  rationale: Der Hifil von בוא bedeutet gewöhnlich „bringen“. Das Perfekt passt in der direkten Rede zu der vollendeten Handlung mit gegenwärtigen Folgen.
- source_word: עָלָיו
  choice: über es
  rationale: Das maskuline Singularpronomen bezieht sich grammatisch auf das kollektive Singularwort „Volk“. Anders als im Englischen lässt sich dieser Numerusbezug im Deutschen unmittelbar bewahren.
- source_word: חֲטָאָה גְדֹלָה
  choice: so große Sünde
  rationale: חטאה bezeichnet Sünde beziehungsweise Verfehlung. In der deutschen Konstruktion „dass du so große Sünde ...“ gibt „so“ die durch die Frage ausgedrückte Folge wieder, ohne die moralische Aussage abzuschwächen.
theological_decisions:
- issue: Aarons Verantwortung
  choice: Aaron wird ausdrücklich zugeschrieben, große Sünde über das Volk gebracht zu haben.
  alternative: „du hast sie zu einer großen Sünde verführt“ oder „du hast große Schuld über sie gebracht“
  rationale: Die Formulierung bewahrt den direkten moralischen Vorwurf des Hebräischen, ohne die Art der Verursachung näher auszudeuten oder חטאה auf „Schuld“ einzuengen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wörtlich mögliche und im Deutschen verständliche kollektive Rückbeziehung „über es“ bewahrt den Singular des hebräischen Pronomens; der Satz bleibt knapp und vorwurfsvoll.
