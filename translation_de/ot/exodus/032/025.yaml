source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: de
  text: Als Mose sah, dass das Volk außer Kontrolle geraten war – denn Aaron hatte es außer Kontrolle geraten lassen, sodass es bei seinen Gegnern zum Gespött wurde[a] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sodass es zum Gespött unter seinen Gegnern wurde“ beziehungsweise „zur Schande vor seinen Gegnern“. Das Hebräische kann Spott, Schmach oder höhnisches Gerede bezeichnen. Für „außer Kontrolle geraten“ steht zweimal dieselbe hebräische Wortwurzel: zunächst für den Zustand des Volkes, dann für Aarons Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא מֹשֶׁה
  choice: Als Mose sah
  rationale: Die Erzählform führt die Handlung weiter; die temporale Wiedergabe verbindet Moses Wahrnehmung natürlich mit seiner folgenden Reaktion.
- source_word: הָעָם
  choice: das Volk
  rationale: Gemeint ist hier die versammelte Gemeinschaft Israels.
- source_word: כִּי פָרֻעַ הוּא
  choice: dass das Volk außer Kontrolle geraten war
  rationale: Die Form von פרע bezeichnet gelöste Zügel beziehungsweise fehlende Beherrschung. Die Wendung gibt den sozialen und moralischen Kontrollverlust in heutigem Deutsch wieder.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: denn Aaron hatte es außer Kontrolle geraten lassen
  rationale: Das Hebräische wiederholt die Wurzel פרע und nennt Aaron als Verantwortlichen. Die deutsche Wiederholung bewahrt diese Verbindung, ohne Absicht über den Text hinaus zu behaupten.
- source_word: לְשִׁמְצָה
  choice: sodass … es verhöhnten
  rationale: Das seltene Wort bezeichnet Schmach, Spott oder höhnisches Reden. Eine verbale Fassung klingt im Deutschen natürlich und gibt die resultative Bedeutung des לְ wieder.
- source_word: בְּקָמֵיהֶם
  choice: seine Gegner
  rationale: Die substantivierte Form von קום bezeichnet diejenigen, die sich gegen Israel erheben, also seine Gegner.
theological_decisions:
- issue: Bedeutungsumfang von פרע
  choice: außer Kontrolle geraten
  alternative: ungezügelt sein; sich gehen lassen; entblößt sein
  rationale: Im Zusammenhang liegt der Schwerpunkt auf dem Verlust von Ordnung und Zurückhaltung. „Entblößt“ wäre zu eng und würde eine im Vers nicht eindeutig festgelegte körperliche Bedeutung vorziehen.
- issue: Bezug von לְשִׁמְצָה בְּקָמֵיהֶם
  choice: 'Folge des von Aaron zugelassenen Kontrollverlusts: Die Gegner verhöhnen Israel'
  alternative: zum Gespött unter ihren Gegnern; zur Schande vor ihren Gegnern
  rationale: Die Konstruktion lässt unterschiedliche Nuancen zwischen Spott, Schmach und übler Nachrede zu. Der Haupttext wählt eine natürliche deutsche Formulierung; die Fußnote erhält die Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Formulierung „außer Kontrolle geraten“ bildet die Wiederholung der hebräischen Wurzel ab. Der Gedankenstrich bleibt offen, weil der Vers syntaktisch in die folgende Handlung überleitet.
