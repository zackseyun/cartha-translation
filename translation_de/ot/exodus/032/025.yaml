  terminology: „Mose“, „Volk“, „Aaron“ und „Gegner“ sind angemessen. Der Singular „seinen Gegnern“ kann sich kollektiv auf das Volk beziehen; die Fußnote erläutert die mögliche Nuance von Spott und Schmach ausreichend.
