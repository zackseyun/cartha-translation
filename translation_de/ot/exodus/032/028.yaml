  text: וַ/יַּֽעֲשׂ֥וּ בְנֵֽי לֵוִ֖י כִּ/דְבַ֣ר מֹשֶׁ֑ה וַ/יִּפֹּ֤ל מִן הָ/עָם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּ/שְׁלֹ֥שֶׁת אַלְפֵ֖י אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: de
  text: Und die Söhne Levis handelten nach dem Wort des Mose. An jenem Tag fielen[a] aus dem Volk etwa dreitausend Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich »fielen«; eine häufige hebräische Wendung für das Sterben oder Erschlagenwerden. Möglich ist auch: »wurden getötet«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: handelten
  rationale: Das Verb עשה bezeichnet hier das Ausführen der zuvor gegebenen Anweisung. »Handelten« ist im Deutschen natürlicher als das wörtliche »taten« und bleibt dennoch nah am allgemeinen Aussagegehalt des hebräischen Verbs.
- source_word: בְנֵי לֵוִי
  choice: die Söhne Levis
  rationale: Die Wiedergabe bewahrt den familiären hebräischen Ausdruck wörtlicher als »die Leviten«, ohne im Deutschen unverständlich zu sein.
- source_word: כִּדְבַר מֹשֶׁה
  choice: nach dem Wort des Mose
  rationale: Diese Formulierung bildet die hebräische Konstruktion eng ab. »Wort« bezeichnet im Zusammenhang die Anweisung beziehungsweise den Befehl des Mose, ohne dies im Haupttext enger auszudeuten.
- source_word: וַיִּפֹּל
  choice: fielen
  rationale: Das hebräische Verb bedeutet wörtlich »fallen« und wird hier als Ausdruck für den gewaltsamen Tod gebraucht. »Fielen« bewahrt das Bild und vermeidet eine ausdrücklichere Kausalbestimmung, als das Verb selbst enthält.
- source_word: מִן הָעָם
  choice: aus dem Volk
  rationale: 'Die Wendung gibt den partitiven Sinn von מן knapp und idiomatisch wieder: Die Gefallenen waren ein Teil des Volkes.'
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist eine natürliche, zugleich würdige Wiedergabe der zeitlichen Bestimmung.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: etwa dreitausend Männer
  rationale: Das Präfix כ bezeichnet eine ungefähre Zahl. »Männer« entspricht איש und erhält die geschlechtsspezifische Aussage des Ausgangstextes.
theological_decisions:
- issue: Wiedergabe der Todesangabe im Zusammenhang des Gerichts
  choice: fielen
  alternative: wurden getötet; starben
  rationale: Der hebräische Text verwendet das Bild des Fallens und kein ausdrückliches Verb für »töten«. Die gewählte Fassung bewahrt die Schwere des Geschehens und die idiomatische Offenheit, ohne die handelnde Ursache sprachlich stärker festzulegen als der Ausgangstext.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Die zwei kurzen Hauptsätze vermeiden eine schwerfällige Satzverbindung. »Söhne Levis« und »Wort des Mose« bewahren markante Formulierungen des hebräischen Textes; die Fußnote erläutert die Todeswendung, ohne sie im Haupttext auszudeuten.
