  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: de
  text: 'Als das Volk sah, dass Mose lange brauchte, um vom Berg herabzukommen, versammelte es sich um Aaron und sagte zu ihm: »Auf, mach uns Götter[a], die vor uns herziehen! Denn dieser Mose, der Mann, der uns aus dem Land Ägypten heraufgeführt hat – wir wissen nicht, was mit ihm geschehen ist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Gott, der vor uns herzieht«. Manche verstehen אֱלֹהִים hier singularisch, weil die weitere Erzählung ein einziges Kalbsbild in den Mittelpunkt stellt. Die hebräische Wortform und das folgende Verb stehen jedoch im Plural.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: lange brauchte
  rationale: Das Verb bezeichnet ein verzögertes oder als zu langsam empfundenes Eintreffen. „Lange brauchte“ gibt die Wahrnehmung des Volkes in natürlichem modernem Deutsch wieder.
- source_word: לָרֶדֶת
  choice: um ... herabzukommen
  rationale: Die Infinitivkonstruktion bezeichnet Moses Rückkehr vom Berg nach unten; „herabzukommen“ bewahrt die räumliche Perspektive.
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: versammelte es sich um Aaron
  rationale: Die Wendung beschreibt das Zusammenkommen des Volkes bei beziehungsweise um Aaron. Sie lässt den im Kontext vorhandenen Druck erkennen, ohne durch „gegen Aaron“ offene Feindseligkeit vorwegzunehmen.
- source_word: קוּם
  choice: Auf
  rationale: Der knappe Imperativ ist ein energischer Handlungsanstoß. „Auf“ wirkt im Deutschen bestimmt und würdevoll, ohne altertümlich zu sein.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Das Wort ist der Form nach pluralisch, und auch das folgende Verb יֵלְכוּ steht im Plural. Daher wird die grammatisch naheliegende Mehrzahl im Haupttext bewahrt.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: die vor uns herziehen
  rationale: Der Relativsatz beschreibt die verlangte Führungsfunktion; „herziehen“ passt zum bevorstehenden Weiterzug des Volkes und erhält den Plural.
- source_word: הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: der uns aus dem Land Ägypten heraufgeführt hat
  rationale: „Heraufgeführt“ bewahrt das Exodus-Idiom der Hiphilform von עלה; „aus dem Land Ägypten“ gibt die volle hebräische Wendung wieder.
- source_word: מֶה הָיָה לוֹ
  choice: was mit ihm geschehen ist
  rationale: Die hebräische Redewendung fragt nach Moses Schicksal. Diese Formulierung ist im modernen Deutschen natürlich und bedeutungsgenau.
theological_decisions:
- issue: Ob אֱלֹהִים an dieser Stelle singularisch oder pluralisch wiederzugeben ist
  choice: 'Plural: „Götter“'
  alternative: 'Singular: „einen Gott“'
  rationale: 'Die unmittelbare Grammatik spricht für den Plural: אֱלֹהִים ist pluralisch geformt, und יֵלְכוּ („sie sollen/werden gehen“) steht ebenfalls im Plural. Da die weitere Erzählung jedoch ein einzelnes Kalbsbild in den Mittelpunkt stellt, wird die mögliche singularische Auffassung in einer Fußnote offengehalten.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das kollektive „Volk“ wird grammatisch mit dem Singularpronomen „es“ aufgenommen. Die abwertend-distanzierende Wendung „dieser Mose, der Mann“ bleibt erhalten. Der Gedankenstrich bildet den abrupten Übergang zur Ungewissheit über Moses Schicksal ab.
