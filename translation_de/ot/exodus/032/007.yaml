base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: de
  text: 'Da sprach Jahwe zu Mose: »Geh, steig hinab! Denn dein Volk, das du aus dem Land Ägypten heraufgeführt hast, hat sich verdorben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hat sich verderblich verhalten«. Das hebräische Verb kann stärker das verwerfliche Handeln als den daraus entstandenen Zustand der Selbstverderbnis hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da sprach
  rationale: Das narrative וַ führt die Handlung fort; »Da sprach« ist im Deutschen natürlich und bewahrt den feierlichen Erzählton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֶךְ רֵד
  choice: Geh, steig hinab!
  rationale: Die beiden Imperative werden getrennt wiedergegeben. לֶךְ dient hier als dringlicher Bewegungsbefehl, während רֵד die Richtung bezeichnet.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung des Befehls ein; »Denn« verbindet sie in diesem Redekontext klar und würdig.
- source_word: שִׁחֵת
  choice: hat sich verdorben
  rationale: Die Form bezeichnet hier schuldhafte Verderbnis im Verhalten des Volkes. Die reflexive deutsche Wendung bringt die daraus entstandene Selbstverderbnis zum Ausdruck, ohne das alternative Verständnis als korruptes Handeln auszuschließen.
- source_word: עַמְּךָ
  choice: dein Volk
  rationale: Die Anrede an Mose als »dein Volk« ist rhetorisch bedeutsam und wird unverändert bewahrt.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: das du ... heraufgeführt hast
  rationale: Das kausative Verb bezeichnet, dass Mose das Volk aus Ägypten heraufführte; »heraufgeführt« bewahrt sowohl die Bewegung als auch Moses leitende Rolle.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe erhält אֶרֶץ ausdrücklich und klingt zugleich in modernem Deutsch natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von שִׁחֵת
  choice: hat sich verdorben
  alternative: hat verdorben gehandelt
  rationale: Der Kontext spricht von der schuldhaften moralischen Verderbnis Israels. Die gewählte Fassung gibt deren zerstörerisches Ergebnis wieder; die Fußnote bewahrt die mögliche stärkere Betonung des verwerflichen Handelns.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Dringlichkeit der zwei hebräischen Imperative bleibt erhalten; die rhetorisch auffällige Bezeichnung Israels als »dein Volk« wird nicht geglättet.
