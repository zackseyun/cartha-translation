base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: de
  text: 'Und er nahm es aus ihren Händen und formte es mit einem Gravierwerkzeug[a] und machte daraus ein gegossenes Kalb. Da sagten sie[b]: »Das sind deine Götter, Israel[c], die dich aus dem Land Ägypten heraufgeführt haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit einem Griffel«, »mit einem Meißel« beziehungsweise »mit einem Ritzwerkzeug«; die genaue Bedeutung des hebräischen Werkzeugbegriffs ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Textüberlieferungen lesen: »Da sagte er« statt »Da sagten sie«.'
    reason: textual_variant
  - marker: c
    text: 'Im Hebräischen stehen Pluralformen: »Das sind deine Götter …, die dich … heraufgeführt haben.« Wegen des einzelnen Kalbs wird traditionell oft übersetzt: »Das ist dein Gott …, der dich … heraufgeführt hat.«'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: er nahm es aus ihrer Hand
  rationale: לקח bezeichnet hier das Nehmen bzw. Entgegennehmen; der Singular »Hand« entspricht dem kollektiven hebräischen Ausdruck, während das Objekt aus dem Zusammenhang ergänzt wird.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: formte es mit einem Ritzwerkzeug
  rationale: יצר bezeichnet bewusstes handwerkliches Formen. חֶרֶט ist ein umstrittener Werkzeugbegriff; »Ritzwerkzeug« wahrt den handwerklichen Sinn, ohne das Instrument zu genau festzulegen.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: so machte er daraus ein gegossenes Kalb
  rationale: Die Formulierung gibt Aarons unmittelbare Tätigkeit und das Ergebnis wieder. »Gegossen« entspricht מַסֵּכָה als Metallgussbild; »so« verbindet die hebräischen Satzreihen natürlich, ohne ihre Reihenfolge umzukehren.
- source_word: וַיֹּאמְרוּ
  choice: da sagten sie
  rationale: Der masoretische Text hat eindeutig die Pluralform. Die abweichende Singularüberlieferung wird in einer Fußnote genannt.
- source_word: אֵלֶּה אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: Das sind deine Götter, Israel
  rationale: אֵלֶּה und אֱלֹהֶיךָ sind formal pluralisch. Die Übersetzung erhält diese auffällige Spannung zum einzelnen Kalb, statt sie stillschweigend aufzulösen.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: die dich aus dem Land Ägypten heraufgeführt haben
  rationale: Die Pluralform des Verbs stimmt mit »Götter« überein. »Heraufgeführt« bewahrt das Exodus-Idiom des Hifil von עלה, und »aus dem Land Ägypten« folgt der vollen hebräischen Wendung.
theological_decisions:
- issue: Plural oder Singular im Zuruf an das Götzenbild
  choice: »Das sind deine Götter, Israel«
  alternative: »Das ist dein Gott, Israel«
  rationale: Der masoretische Text verwendet beim Demonstrativ, beim Substantiv in der Anredeform und beim folgenden Verb Pluralformen. Diese grammatische Spannung zum einzelnen Kalb bleibt erhalten.
- issue: Aarons Verantwortung bei der Herstellung
  choice: Aaron bleibt Subjekt sowohl des Formens als auch des Machens
  alternative: Eine Formulierung, die Aaron nur als Empfänger oder Aufseher erscheinen lässt
  rationale: Die aufeinanderfolgenden hebräischen Verben schreiben Aaron die Handlungen unmittelbar zu; die Übersetzung mildert diese Aussage nicht ab.
- issue: Verhältnis von Formen und Gießen
  choice: Die hebräische Handlungsfolge wird beibehalten und durch »so« natürlich verbunden
  alternative: Die Reihenfolge umstellen oder das Formen lediglich als untergeordneten Begleitumstand des Gießens darstellen
  rationale: Die genaue Herstellungstechnik bleibt im Hebräischen schwierig. Die Übersetzung sollte weder eine technisch eindeutige Abfolge konstruieren noch die parataktische Aussage des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. Der auffällige Plural des Hebräischen und die unklare Bezeichnung des Werkzeugs werden nicht harmonisiert; notwendige Alternativen stehen knapp in den Fußnoten.
