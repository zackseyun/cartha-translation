  verdict: revise
  source_fidelity: 'Der Grundsinn ist zutreffend: Verkauf der Tochter in den Status einer אָמָה und ein gegenüber den עבדים abweichender Ausgang aus diesem Dienstverhältnis. „Männlichen Sklaven“ ist im unmittelbaren Kontext (21,2–6) als explizierende Wiedergabe vertretbar. Das Modalverb „darf“ kann im Deutschen jedoch nahelegen, dass der Frau selbst etwas untersagt wird, während die hebräische Rechtsform ihre Entlassung beziehungsweise ihren Ausgang regelt.'
  naturalness: Der Satz ist modern und klar. „Freikommen“ ist verständlich, hat aber einen eher umgangssprachlichen Klang; „freigelassen werden“ ist in diesem Rechtstext präziser und registergerechter.
  terminology: „Sklavin“ und „Sklaven“ geben den rechtlich gebundenen Status ohne Euphemismus wieder. Die Formulierung „wie die männlichen Sklaven“ wahrt den im Kontext bestehenden Kontrast.
  issues:
