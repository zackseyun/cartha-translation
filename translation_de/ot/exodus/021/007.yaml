    issue: „darf sie nicht … freikommen“
    rationale: „Darf“ formuliert primär ein an die Tochter gerichtetes Verbot. לֹא תֵצֵא beschreibt in diesem kasuistischen Rechtssatz, dass sie nicht in derselben Weise entlassen wird beziehungsweise aus dem Dienstverhältnis ausgeht. Eine passivische, rechtssprachliche Formulierung bildet dies klarer ab.
