  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: de
  text: Und wenn ein Mann seine Tochter als Sklavin verkauft, soll sie nicht so freigelassen werden wie die männlichen Sklaven.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vergleich besagt, dass ihre Freilassung nicht nach derselben Regelung erfolgt wie die der männlichen Sklaven.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Und wenn
  rationale: Leitet einen weiteren bedingten Rechtsfall ein und bewahrt zugleich die verbindende Funktion von ו.
- source_word: יִמְכֹּר
  choice: verkauft
  rationale: Das Präsens gibt den allgemein geltenden Fall kasuistischen Rechts im Deutschen natürlich wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Entspricht der grammatisch männlichen Einzahl und bezeichnet hier den Vater beziehungsweise männlichen Haushaltsvorstand.
- source_word: בִּתּוֹ
  choice: seine Tochter
  rationale: Direkte Wiedergabe des eindeutigen Verwandtschaftsbegriffs mit Suffix der dritten Person Maskulinum Singular.
- source_word: לְאָמָה
  choice: als Sklavin
  rationale: אָמָה bezeichnet hier eine Frau beziehungsweise ein Mädchen in rechtlich gebundener Dienststellung; „Sklavin“ macht den durch Verkauf bestimmten Status deutlich, ohne ihn durch „Magd“ abzuschwächen.
- source_word: לֹא תֵצֵא
  choice: darf sie nicht … freikommen
  rationale: יצא ist hier der rechtliche Ausdruck für das Ausscheiden aus dem Dienst. „Freikommen“ vermittelt diese Bedeutung im Deutschen natürlicher als das wörtliche „hinausgehen“; das Modalverb gibt die Rechtsbestimmung wieder.
- source_word: כְּצֵאת הָעֲבָדִים
  choice: so freikommen wie die männlichen Sklaven
  rationale: Die Vergleichskonstruktion bezeichnet die Art beziehungsweise Bedingungen der Freilassung. „Männlichen“ verdeutlicht den im Kontext vorausgesetzten Gegensatz zur als אָמָה verkauften Tochter.
theological_decisions:
- issue: Wiedergabe der Sklavereibegriffe im Bundesrecht
  choice: „Sklavin“ und „männliche Sklaven“
  alternative: „Magd“ und „Knechte/Diener“
  rationale: Da Verkauf und Freilassung den rechtlichen Status bestimmen, soll die Übersetzung die bestehende Unfreiheit nicht durch traditionelle, weichere Begriffe verschleiern.
- issue: Bedeutung des Verbots לֹא תֵצֵא
  choice: Sie kommt nicht auf dieselbe Weise beziehungsweise zu denselben Bedingungen frei wie die männlichen Sklaven.
  alternative: Sie wird überhaupt nicht freigelassen.
  rationale: Der Vergleich כְּצֵאת begrenzt die Aussage auf die Art oder Bedingungen des Freikommens; er schließt eine Freilassung unter anderen Bestimmungen nicht aus, wie der folgende Kontext zeigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Freikommen“ gibt den juristischen Sinn des hebräischen „hinausgehen“ verständlich wieder; die Sklavereiterminologie bleibt ausdrücklich und wird nicht euphemistisch abgeschwächt.
