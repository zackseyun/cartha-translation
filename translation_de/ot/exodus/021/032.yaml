  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: de
  text: Wenn der Stier einen Sklaven oder eine Sklavin[a] mit den Hörnern stößt, muss der Besitzer des Stiers deren Herrn dreißig Schekel Silber geben; der Stier muss gesteinigt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräischen Wörter unterscheiden ausdrücklich zwischen einem männlichen Sklaven (עֶבֶד) und einer weiblichen Sklavin (אָמָה). Traditionell auch: „einen Knecht oder eine Magd“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: Sklave
  rationale: Im Zusammenhang dieses Rechtsfalls bezeichnet das Wort einen Menschen in rechtlich gebundener Unfreiheit. „Sklave“ gibt diesen sozialen und rechtlichen Status deutlicher wieder als das mildere „Knecht“.
- source_word: אָמָה
  choice: Sklavin
  rationale: Das Wort steht als weibliche Entsprechung zu עֶבֶד. „Sklavin“ bewahrt sowohl das Geschlecht als auch den rechtlichen Status.
- source_word: יִגַּח
  choice: mit den Hörnern stößt
  rationale: נגח bezeichnet in den Rechtsbestimmungen über Rinder gezielt das Stoßen mit den Hörnern. Die Formulierung ist im Deutschen klarer und natürlicher als das seltene „aufspießt“.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: dreißig Schekel Silber
  rationale: Die Wendung nennt eine nach Schekelgewicht bemessene Silbermenge. Diese knappe Form entspricht dem hebräischen Ausdruck und bleibt im Deutschen verständlich.
- source_word: יִתֵּן
  choice: muss … geben
  rationale: Das Imperfekt formuliert in diesem kasuistischen Gesetz eine verbindliche Rechtsfolge. „Muss“ drückt die Verpflichtung in modernem Deutsch natürlicher aus als ein futurisches „wird“.
- source_word: לַאדֹנָיו
  choice: deren Herrn
  rationale: Der Suffixbezug gilt dem zuvor genannten Sklaven beziehungsweise der Sklavin. „Deren Herrn“ hält diesen Bezug geschlechtsübergreifend fest; „Herr“ bildet zugleich das damalige Herrschafts- und Besitzverhältnis ab.
- source_word: יִסָּקֵל
  choice: muss gesteinigt werden
  rationale: Der Nifal von סקל bezeichnet die Hinrichtung durch Steinigung. Wie im knappen Hebräisch wird der Tod nicht zusätzlich ausdrücklich genannt.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Gesetzesstil. „Muss“ gibt die rechtliche Verpflichtung natürlich wieder. Der im hebräischen Satz nicht ausdrücklich bezeichnete Zahlende wird aus dem unmittelbaren Rechtszusammenhang als Besitzer des Stiers benannt, um einen unklaren Pronomenbezug im Deutschen zu vermeiden.
