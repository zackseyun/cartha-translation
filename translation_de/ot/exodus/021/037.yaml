base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: de
  text: Wenn ein Mann ein Rind oder ein Stück Kleinvieh[a] stiehlt und es schlachtet oder verkauft, soll er als Ersatz für das Rind fünf Rinder und dafür vier Stück Kleinvieh leisten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann ein einzelnes Schaf oder eine einzelne Ziege bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Leitet einen kasuistischen Rechtssatz ein; „wenn“ bildet die Bedingung im modernen deutschen Rechtsstil natürlich ab.
- source_word: יִגְנֹב
  choice: stiehlt
  rationale: Gibt גנב im rechtlichen Zusammenhang direkt und idiomatisch wieder.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Bewahrt die grammatisch männliche, hier repräsentativ gebrauchte Bezeichnung des hebräischen Textes.
- source_word: שׁוֹר
  choice: ein Rind
  rationale: „Rind“ bezeichnet das einzelne Tier, ohne wie „Stier“ ein bestimmtes Geschlecht oder wie „Ochse“ zwingend ein kastriertes männliches Tier nahezulegen.
- source_word: שֶׂה
  choice: ein Stück Kleinvieh
  rationale: שׂה kann ein einzelnes Schaf oder eine einzelne Ziege bezeichnen. „Stück Kleinvieh“ bewahrt diesen weiteren Bedeutungsumfang.
- source_word: וּטְבָחוֹ
  choice: und es schlachtet
  rationale: טבח bezeichnet das Schlachten beziehungsweise Zerlegen eines Tieres und nicht bloß ein allgemeines Töten.
- source_word: מְכָרוֹ
  choice: oder verkauft
  rationale: Direkte Wiedergabe von מכר mit dem Objektsuffix; das Präsens passt zum deutschen Bedingungssatz.
- source_word: חֲמִשָּׁה בָקָר
  choice: fünf Rinder
  rationale: בקר ist eine Kollektivbezeichnung für Großvieh; im Deutschen ist „fünf Rinder“ die natürliche zählbare Form.
- source_word: יְשַׁלֵּם
  choice: soll … erstatten
  rationale: שלם bezeichnet hier die rechtlich geschuldete Ersatzleistung. „Erstatten“ macht diesen Sinn knapp und verständlich deutlich.
- source_word: תַּחַת
  choice: für
  rationale: Drückt in der Ersatzformel die Leistung anstelle des entwendeten Tieres idiomatisch aus.
- source_word: וְאַרְבַּע צֹאן
  choice: vier Stück Kleinvieh
  rationale: צאן bezeichnet kollektiv Schafe und Ziegen; „vier Stück Kleinvieh“ erhält die Kategorienentsprechung und vermeidet eine unbegründete Beschränkung auf Schafe.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Rechtssatz in klarer Standardsprache. Die fachsprachlich leicht geprägte Wendung „Stück Kleinvieh“ dient dazu, den weiteren Bedeutungsumfang des Hebräischen zu bewahren.
