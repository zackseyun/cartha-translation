base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/030.yaml
  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: de
  text: Wenn ihm ein Lösegeld auferlegt wird[a], muss er den Auslösungspreis für sein Leben zahlen, gemäß allem, was ihm auferlegt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ihm eine Lösegeldzahlung auferlegt wird ... muss er den Preis für die Auslösung seines Lebens zahlen.“ Im Hebräischen stehen zwei verwandte, aber unterschiedliche Begriffe: כֹּפֶר (Lösegeld) und פִּדְיֹן (Auslösungspreis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet den bedingten Rechtsfall ein; „wenn“ gibt die Konditionalität unmittelbar und natürlich wieder.
- source_word: כֹּפֶר
  choice: Lösegeld
  rationale: Bezeichnet hier eine Zahlung, durch die die sonst drohende Strafe abgewendet wird; „Lösegeld“ bewahrt den rechtlich-redemptiven Sinn ohne kultische Überdeutung.
- source_word: יוּשַׁת עָלָיו
  choice: ihm auferlegt wird
  rationale: Das Passiv von שׁית mit עַל bezeichnet eine rechtlich auferlegte Verpflichtung.
- source_word: וְנָתַן
  choice: muss er … zahlen
  rationale: Gibt die verbindliche Rechtsfolge idiomatisch im modernen Deutschen wieder; „zahlen“ passt zu dem festgesetzten Geldbetrag.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: als Preis für sein Leben
  rationale: פִּדְיֹן bezeichnet den Preis der Auslösung; נֶפֶשׁ meint in diesem Rechtszusammenhang das Leben. Die Formulierung bleibt verständlich und unterscheidet sich sprachlich von כֹּפֶר.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: alles …, was ihm auferlegt wird
  rationale: Bewahrt die umfassende Bedeutung von כֹּל und wiederholt wie das Hebräische die Wendung für die rechtliche Festsetzung.
theological_decisions:
- issue: Art der Zahlung bei grundsätzlich bestehender Todeshaftung
  choice: Die Zahlung wird als „Lösegeld“ und „Preis für sein Leben“ wiedergegeben.
  alternative: Beide Begriffe könnten vereinfachend als „Geldbuße“ oder mit stärker kultisch geprägter Sühneterminologie übersetzt werden.
  rationale: Der Text beschreibt eine rechtlich festgesetzte Zahlung, durch die das Leben des Haftenden ausgelöst wird. Die Wiedergabe erhält die zwei verwandten, aber verschiedenen hebräischen Begriffe, ohne moralische Unschuld oder kultische Sühne in den Vers hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. „Jedoch“ macht den Anschluss an die zuvor genannte Todesfolge deutlich, ohne die Bedingung inhaltlich zu verändern. Die lexikalische Unterscheidung zwischen כֹּפֶר und פִּדְיֹן wird durch „Lösegeld“ und „Preis“ gewahrt.
