base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: de
  text: Und wenn er seinem Sklaven oder seiner Sklavin einen Zahn ausschlägt, soll er ihn oder sie[a] als Entschädigung für den Zahn freilassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihn“. Die hebräische Rechtsformel verwendet ein maskulines Singularsuffix; die Regel bezieht sich nach dem vorangehenden Ausdruck jedoch auf den Sklaven oder die Sklavin.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Leitet einen weiteren Rechtsfall in Fortsetzung des vorangehenden Verses ein und bewahrt die verbindende Funktion des hebräischen Ausdrucks.
- source_word: שֵׁן
  choice: einen Zahn
  rationale: Entspricht dem anatomischen Singular des hebräischen Textes; der unbestimmte Artikel ist im Deutschen idiomatisch.
- source_word: עַבְדּוֹ
  choice: seinem Sklaven
  rationale: Im Kontext des Bundesbuchs bezeichnet עבד eine rechtlich gebundene Person; „Sklave“ bildet diesen sozialen und rechtlichen Status genauer ab als „Diener“.
- source_word: אֲמָתוֹ
  choice: seiner Sklavin
  rationale: Gibt die ausdrücklich feminine Entsprechung zu עבד knapp, modern und eindeutig wieder.
- source_word: יַפִּיל
  choice: ausschlägt
  rationale: Der Hifil von נפל bedeutet hier, den Zahn zum Ausfallen zu bringen; „einen Zahn ausschlagen“ ist die natürliche deutsche Formulierung.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: soll er die betroffene Person als Entschädigung für den Zahn freilassen
  rationale: שלח mit לַחָפְשִׁי bezeichnet die Entlassung in die Freiheit. „Freilassen“ ist im deutschen Rechtszusammenhang klar; „die betroffene Person“ gibt die Anwendung auf Sklave oder Sklavin wieder, während die Fußnote die grammatische Form erläutert.
- source_word: תַּחַת שִׁנּוֹ
  choice: als Entschädigung für den Zahn
  rationale: תחת bezeichnet hier den Ausgleich für die erlittene Verletzung; die Formulierung macht den rechtlichen Sinn natürlich verständlich.
theological_decisions:
- issue: Wiedergabe der Sklavereibegriffe im Bundesbuch
  choice: Sklave / Sklavin
  alternative: Diener / Magd
  rationale: Der rechtlich gebundene Status ist in diesem Gesetz wesentlich. „Sklave/Sklavin“ benennt die soziale Realität deutlicher, ohne sie abzuschwächen oder konfessionell zu deuten.
- issue: Geschlecht des freizulassenden Menschen
  choice: die betroffene Person mit erläuternder Fußnote
  alternative: 'ihn; oder: ihn beziehungsweise sie'
  rationale: Die Rechtsbestimmung nennt ausdrücklich einen Sklaven oder eine Sklavin, verwendet im Folgesatz aber ein maskulines Singularsuffix. Die Übersetzung wahrt die Anwendung auf beide Fälle und dokumentiert die grammatische Spannung in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Formulierung benennt den Sklavenstatus ungeschönt und vermeidet zugleich unnötig altertümliche Ausdrücke.
