  text: Whoever strikes a man so that he dies shall surely be put to death[a].
translation:
  language: de
  text: Wer einen Mann schlägt, sodass er stirbt, muss unbedingt getötet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wer einen Mann schlägt und er stirbt, soll gewiss getötet werden.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: schlägt
  rationale: 'Das Partizip von נכה eröffnet einen kasuistischen Rechtssatz: »wer schlägt«. »Schlägt« ist im heutigen Deutsch natürlich und legt den tödlichen Ausgang nicht bereits in das Verb hinein.'
- source_word: אִישׁ
  choice: einen Mann
  rationale: אִישׁ bezeichnet hier den männlichen Menschen, der Opfer des Schlages wird. »Einen Mann« bewahrt diese lexikalische Geschlechtsangabe, während »wer« den Täter allgemein bezeichnet.
- source_word: וָמֵת
  choice: sodass er stirbt
  rationale: Die Verbindung aus Konjunktion und Verb bezeichnet hier die Folge des Schlages. »Sodass er stirbt« gibt diesen Ergebniszusammenhang im Deutschen klar und idiomatisch wieder.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Infinitivus absolutus und passives Präfixverb verstärken die verbindliche Todesstrafe. Die Formulierung bewahrt den passiven Rechtscharakter und gibt die Nachdrücklichkeit im modernen Deutsch natürlich wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Gesetzesstil. Der kasuistische Aufbau und die nachdrückliche passive Strafbestimmung bleiben erhalten; die Fußnote dokumentiert die formnähere Satzverknüpfung und Intensivierung.
