    rationale: Die Konstruktion Infinitivus absolutus plus Hofal bedeutet wörtlich etwa „soll gewiss/unter allen Umständen getötet werden“. Die revidierte Formulierung bewahrt Nachdruck, Passiv und gerichtlichen Charakter ohne die Bedeutung zu verändern.
  - severity: low
    issue: Die Fußnote erklärt die Konsequenz paraphrastisch statt vorrangig die formale Konjunktion und ihren rechtlichen Sinn zu dokumentieren.
    rationale: Die Anmerkung sollte transparent machen, dass im Hebräischen „und“ steht, während „oder“ im Deutschen den Sinn erfasst, dass jeder einzelne Fall gemeint ist.
