  source_fidelity: Der Entwurf gibt die beiden ausdrücklich genannten Elternteile korrekt wieder und gibt die koordinierende hebräische Form im rechtlichen Sinn idiomatisch mit „oder“ wieder. מוֹת יוּמָת ist jedoch eine nachdrückliche Todesstrafenformel. „muss mit dem Tod bestraft werden“ ist verständlich, aber weniger präzise und weniger direkt als die etablierte rechtssprachliche passive Wiedergabe „soll unbedingt getötet werden“ bzw. „soll gewiss getötet werden“.
  naturalness: „Wer seinen Vater oder seine Mutter schlägt“ ist natürliches modernes Standarddeutsch. „Soll unbedingt getötet werden“ ist in einer knappen Gesetzesformel klar, würdig und im Kontext einer antiken Rechtsvorschrift idiomatisch; es beschreibt keine bloße Todesfolge, sondern den angeordneten Vollzug.
  terminology: „Vater“, „Mutter“ und „schlägt“ sind treffend. Für מוֹת יוּמָת wahrt „soll unbedingt getötet werden“ die hebräische Intensivierung und die passive Vollzugsform genauer als „muss mit dem Tod bestraft werden“. Die Fußnote soll die formale Bedeutung von וְ nicht durch die weitergehende Auslegung „verfällt dieser Strafe“ paraphrasieren, sondern knapp den distributiven Rechtssinn erläutern.
