base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/015.yaml
  text: Whoever strikes his father or his mother shall surely be put to death[a].
translation:
  language: de
  text: Wer seinen Vater oder seine Mutter schlägt, soll unbedingt getötet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und seine Mutter“. Im rechtlichen Zusammenhang bezeichnet die Verbindung beide Fälle einzeln; daher „oder“ im Deutschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: schlägt
  rationale: Das Partizip von נכה bezeichnet hier denjenigen, der einen körperlichen Schlag ausführt. „schlägt“ ist gegenwärtiges, klares Deutsch und legt weder wiederholtes Schlagen noch einen Waffenangriff nahe.
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Der hebräische Text nennt ausdrücklich den Vater im Singular; die konkrete Elternbezeichnung bleibt erhalten.
- source_word: אִמּוֹ
  choice: seine Mutter
  rationale: Der hebräische Text nennt ausdrücklich die Mutter; die parallele Nennung beider Elternteile bleibt erhalten.
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Hofal drückt nachdrücklich die gerichtlich zu vollziehende Todesstrafe aus. Die passive deutsche Formulierung bewahrt den rechtlichen Charakter und klingt zugleich natürlich.
- source_word: וּ / וְ
  choice: oder
  rationale: 'Die Konjunktion lautet formal „und“, hat in dieser Rechtsbestimmung jedoch distributiven Sinn: Schon das Schlagen eines der beiden Elternteile zieht die genannte Strafe nach sich. „oder“ gibt diesen Rechtssinn im Deutschen unmissverständlich wieder.'
theological_decisions:
- issue: Wiedergabe der rechtlichen Strafformel
  choice: muss mit dem Tod bestraft werden
  alternative: soll unbedingt getötet werden
  rationale: Die gewählte Fassung macht deutlich, dass eine gerichtlich verhängte Strafe gemeint ist, nicht lediglich der Eintritt des Todes. Zugleich bewahrt sie den passiven Vollzug und die zwingende Geltung der Formel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in knapper Rechtssprache. „Wer …, muss …“ gibt die kasuistische Gesetzesform natürlich wieder; „mit dem Tod bestraft werden“ wahrt den gerichtlichen und passiven Charakter der hebräischen Strafformel.
