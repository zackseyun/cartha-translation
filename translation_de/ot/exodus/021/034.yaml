base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/034.yaml
  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: de
  text: 'Der Besitzer der Grube muss Ersatz leisten: Er muss dem Besitzer des Tieres Geld zahlen, und das tote Tier gehört dem Besitzer der Grube.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und der Kadaver gehört dem Besitzer der Grube.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבּוֹר
  choice: der Besitzer der Grube
  rationale: Die Verbindung bezeichnet in diesem Rechtsfall den Besitzer beziehungsweise Verantwortlichen der Grube. »Besitzer der Grube« ist klar und natürlich.
- source_word: יְשַׁלֵּם
  choice: muss Ersatz leisten
  rationale: Das Piel von שׁלם bezeichnet im Rechtskontext die Leistung von Ersatz oder Entschädigung. Die deutsche Formulierung gibt den verpflichtenden Charakter wieder.
- source_word: כֶּסֶף יָשִׁיב
  choice: muss den entsprechenden Geldbetrag zahlen
  rationale: כֶּסֶף bedeutet wörtlich »Silber«, bezeichnet hier aber Geld; יָשִׁיב hat den Sinn, dem Geschädigten den Wert zu erstatten. »entsprechenden« verdeutlicht den aus dem Kontext erschließbaren Ersatzwert, ohne eine bestimmte Berechnung festzulegen.
- source_word: לִבְעָלָיו
  choice: dem Besitzer des Tieres
  rationale: Das Suffix verweist auf den Besitzer des verendeten Tieres. Die ausdrückliche Nennung vermeidet im Deutschen eine unklare Pronomenreferenz.
- source_word: וְהַמֵּת
  choice: das tote Tier
  rationale: Wörtlich steht substantivisch »das Tote«; aus dem Zusammenhang ist das verendete Tier gemeint. Die Ergänzung »Tier« macht den Bezug natürlich verständlich.
- source_word: יִהְיֶה לוֹ
  choice: fällt ihm zu
  rationale: Die Wendung weist dem Besitzer der Grube das tote Tier als Besitz zu. »fällt ihm zu« ist eine natürliche, rechtssprachlich passende Wiedergabe, lässt aber offen, welchen wirtschaftlichen Nutzen der Kadaver noch hat.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Rechtssprache. Der verpflichtende Charakter der Vorschrift wird mit »muss« ausgedrückt; unnötig altertümliches »soll« wird vermieden.
