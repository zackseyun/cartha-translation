id: EXO.21.23
reference: Exodus 21:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם אָס֖וֹן יִהְיֶ֑ה וְ/נָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: de
  text: Wenn aber ein Unglück geschieht[a], sollst du Leben für Leben geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine schwere Schädigung“ oder „ein Todesfall“. Das hebräische Wort kann schweres Unheil oder eine gravierende Schädigung bezeichnen. Umstritten ist, ob hier allgemein eine Verletzung oder speziell ein tödlicher Ausgang gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet eine Bedingung ein und markiert zugleich den Gegensatz zum vorherigen Fall; im Deutschen ist „wenn aber“ natürlich und textnah.
- source_word: אָסוֹן
  choice: Unglück
  rationale: Der Ausdruck bezeichnet schweres Unheil beziehungsweise eine gravierende Schädigung, ohne hier für sich genommen eindeutig festzulegen, ob ausschließlich ein Todesfall gemeint ist.
- source_word: יִהְיֶה
  choice: geschieht
  rationale: 'Gibt die einfache Ereignisaussage idiomatisch wieder: Falls ein solches Unglück eintritt.'
- source_word: וְנָתַתָּה
  choice: sollst du … geben
  rationale: Bewahrt die Grundbedeutung von נתן und den verpflichtenden Ton der Rechtsbestimmung, ohne die Folge vorschnell als Geldzahlung zu deuten.
- source_word: נֶפֶשׁ
  choice: Leben
  rationale: In der Rechtsformel bezeichnet נֶפֶשׁ das Leben, nicht eine vom Körper getrennt gedachte Seele.
- source_word: תַּחַת
  choice: für
  rationale: Kennzeichnet in der Vergeltungsformel Entsprechung beziehungsweise Ersatz und wird im Deutschen prägnant mit „für“ wiedergegeben.
- source_word: נָפֶשׁ
  choice: Leben
  rationale: Die Wiederholung erhält die lexikalische und rechtliche Symmetrie der hebräischen Formel.
theological_decisions:
- issue: Reichweite und Bezug des mit אָסוֹן bezeichneten Schadens
  choice: Breit mit „Unglück“ wiedergeben und im Haupttext weder den Betroffenen noch einen zwingend tödlichen Ausgang festlegen.
  alternative: „schwere Verletzung“ oder „Todesfall“
  rationale: Der hebräische Ausdruck kann schweres Unheil bezeichnen, doch dieser Vers allein bestimmt weder seinen genauen Bezug noch eindeutig, ob ausschließlich ein Todesfall gemeint ist. Die offene Wiedergabe bewahrt die Auslegungsspannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und verständliche Rechtsformel „Leben für Leben“ bleibt erhalten; „Unglück“ wahrt die Mehrdeutigkeit des hebräischen Ausdrucks.
