base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: de
  text: Und wenn jemand[b] eine Grube öffnet[a] oder wenn jemand eine Grube gräbt und sie nicht abdeckt und ein Rind oder ein Esel hineinfällt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „eine Grube aufdeckt“. Das hebräische Verb bedeutet wörtlich „öffnet“ und kann sich darauf beziehen, dass eine bereits vorhandene Grube geöffnet beziehungsweise freigelegt wird, statt eine neue zu graben.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „jemand“ wiedergegebene hebräische Wort אִישׁ ist eine maskuline Singularform, die in dieser kasuistischen Rechtsformel allgemein gebraucht wird.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Und wenn
  rationale: Leitet einen kasuistischen Rechtsfall ein und bewahrt zugleich mit „und“ die Verbindung zu den vorangehenden Bestimmungen.
- source_word: יִפְתַּח
  choice: öffnet
  rationale: Gibt die Grundbedeutung des Verbs wieder und unterscheidet das Öffnen beziehungsweise Freilegen einer vorhandenen Grube vom anschließenden Graben einer neuen.
- source_word: אִישׁ
  choice: jemand
  rationale: Die maskuline singularische Rechtsformel bezeichnet hier allgemein die verantwortliche Person; „jemand“ ist im modernen Deutschen natürlich und lässt den generischen Rechtscharakter erkennen.
- source_word: בּוֹר
  choice: eine Grube
  rationale: „Grube“ ist der breite, kontextgerechte Ausdruck für eine Vertiefung, die unbedeckt eine Gefahr für Vieh darstellt; „Zisterne“ wäre möglich, ist hier aber unnötig spezifisch.
- source_word: א֠וֹ כִּי
  choice: oder
  rationale: Kennzeichnet knapp und natürlich den parallelen alternativen Rechtsfall; das konditionale „wenn“ gilt im Deutschen sinngemäß für beide Glieder.
- source_word: יִכְרֶה
  choice: gräbt
  rationale: Bezeichnet klar das Ausheben einer Grube und wahrt den Gegensatz zu „öffnet“.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: und sie nicht abdeckt
  rationale: Das Verb bezeichnet hier das physische Bedecken; das feminine Pronomen richtet sich im Deutschen nach „Grube“.
- source_word: וְ/נָפַל
  choice: und ... hineinfällt
  rationale: Setzt im kasuistischen Satzgefüge den angenommenen Fall fort; das Präsens ist dafür im Deutschen idiomatisch.
- source_word: שָׁמָּה
  choice: hinein
  rationale: Gibt die gerichtete Ortsangabe im Deutschen idiomatisch als Bewegung in die zuvor genannte Grube wieder.
- source_word: שּׁוֹר
  choice: ein Rind
  rationale: Der hebräische Ausdruck kann ein einzelnes Tier der Rindergattung bezeichnen. „Rind“ ist breiter und im modernen deutschen Rechtston natürlicher als das enger wirkende „Ochse“.
- source_word: א֥וֹ חֲמוֹר
  choice: oder ein Esel
  rationale: Klare und gegenwärtige Bezeichnung des genannten Haustiers.
