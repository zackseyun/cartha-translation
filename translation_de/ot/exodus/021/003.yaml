  text: If he comes in by himself[a], he shall go out by himself; if he is married[b], then his wife shall go out with him.
translation:
  language: de
  text: Wenn er allein[a] in den Dienst tritt, soll er auch allein freikommen; wenn er verheiratet[b] ist, soll seine Frau mit ihm freikommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende hebräische Wort steht in einer seltenen Wendung und meint hier, dass er allein beziehungsweise unbegleitet in den Dienst tritt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wenn er Ehemann einer Frau ist“. Die hebräische Wendung bedeutet idiomatisch „wenn er verheiratet ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: allein
  rationale: Die seltene hebräische Wendung bezeichnet hier, dass der Mann ohne Ehefrau beziehungsweise unbegleitet in den Dienst tritt. „Allein“ gibt den rechtlichen Sinn natürlich und knapp wieder.
- source_word: יָבֹא
  choice: in den Dienst tritt
  rationale: Wörtlich bedeutet das Verb „kommen“. Im Zusammenhang der Dienstknechtschaft ist der Eintritt in den Dienst gemeint; die ausdrückliche Wiedergabe vermeidet im Deutschen ein unbestimmtes „kommen“.
- source_word: יֵצֵא
  choice: freikommen
  rationale: Das Verb bedeutet grundsätzlich „hinausgehen“. In diesem Freilassungsgesetz bezeichnet es das Ausscheiden aus dem Dienst und den Übergang in die Freiheit; „freikommen“ macht diesen Kontext verständlich.
- source_word: בַּעַל אִשָּׁה
  choice: verheiratet
  rationale: Die Verbindung bedeutet idiomatisch, dass der Mann Ehemann beziehungsweise verheiratet ist. „Verheiratet“ ist im modernen Deutschen natürlich und entspricht dem rechtlichen Gegensatz zu „allein“.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: soll seine Frau mit ihm freikommen
  rationale: Das feminine Verb bezieht sich auf seine Frau. Die Formulierung bewahrt die gemeinsame Bewegung aus dem Dienst und verwendet für יצא dieselbe kontextuelle Wiedergabe wie im ersten Satzteil.
