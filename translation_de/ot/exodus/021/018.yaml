base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: de
  text: Wenn Männer miteinander streiten und einer den anderen mit einem Stein oder mit der Faust schlägt, dieser aber nicht stirbt, sondern bettlägerig wird[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu Bett fällt“; gemeint ist, dass er wegen seiner Verletzung bettlägerig wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Die Wendung leitet einen kasuistischen Rechtsfall ein; „wenn“ ist dafür im Deutschen natürlich und präzise.
- source_word: יְרִיבֻן
  choice: miteinander streiten
  rationale: ריב bezeichnet Streit oder Auseinandersetzung. Die Formulierung lässt offen, ob der Streit zunächst nur mit Worten oder bereits handgreiflich geführt wird.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Das hebräische Substantiv ist maskulin pluralisch und bezeichnet hier die männlichen Beteiligten des Rechtsfalls.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: und einer den anderen … schlägt
  rationale: Die idiomatische deutsche Wendung gibt die wechselseitige Beziehung von אִישׁ und רֵעֵהוּ klar wieder, ohne רֵעַ in diesem Rechtszusammenhang unnötig auf „Nächster“ oder „Freund“ festzulegen.
- source_word: בְּאֶבֶן
  choice: mit einem Stein
  rationale: Das Präfix בְּ bezeichnet hier das Tatmittel; „Stein“ entspricht dem einfachen Wortsinn.
- source_word: אוֹ בְאֶגְרֹף
  choice: oder mit der Faust
  rationale: אֶגְרֹף bedeutet „Faust“. Der bestimmte Artikel ist im Deutschen bei Körperteilen idiomatisch.
- source_word: וְלֹא יָמוּת
  choice: und dieser nicht stirbt
  rationale: „Dieser“ kennzeichnet eindeutig den Geschlagenen als Subjekt; die beiordnende Struktur des Hebräischen bleibt erhalten.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: aber ans Bett gefesselt ist
  rationale: Wörtlich steht „ins/aufs Bett fällt“. Gemeint ist, dass der Verletzte infolge des Schlags bettlägerig ist; die adversative Verbindung bildet den Gegensatz zwischen Überleben und schwerer Beeinträchtigung natürlich ab.
