source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: de
  text: Wenn du einen hebräischen Sklaven[a] kaufst, soll er sechs Jahre dienen; im siebten Jahr aber soll er ohne Bezahlung als freier Mann fortgehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen hebräischen Knecht“. Das hebräische Wort bezeichnet hier einen gekauften Menschen in rechtlich gebundener Dienststellung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „soll er unentgeltlich in die Freiheit hinausgehen“.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: Die Partikel leitet hier einen kasuistischen Rechtssatz ein. „Wenn“ ist im modernen deutschen Rechtsstil natürlich; „Falls“ wäre ebenfalls möglich.
- source_word: תִקְנֶה
  choice: du … kaufst
  rationale: Das Qal von קנה bezeichnet hier angesichts des Rechts- und Erwerbskontexts den Kauf einer Person in gebundener Stellung.
- source_word: עֶבֶד עִבְרִי
  choice: einen hebräischen Sklaven
  rationale: „Sklave“ macht die gekaufte und rechtlich gebundene Stellung deutlich, ohne sie durch „Diener“ abzuschwächen. עִבְרִי wird spezifisch mit „hebräisch“ wiedergegeben.
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: soll er sechs Jahre dienen
  rationale: „Dienen“ gibt עבד idiomatisch wieder; die Soll-Form entspricht dem normativen Charakter des Rechtssatzes.
- source_word: וּבַשְּׁבִעִת
  choice: im siebten Jahr aber
  rationale: „Aber“ bringt den sachlichen Gegensatz zwischen Dienstzeit und Freilassung natürlich zum Ausdruck; „Jahr“ wird zur Klarheit ergänzt.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: soll er … als freier Mann fortgehen
  rationale: Die Formulierung bewahrt das Bild des Hinausgehens und gibt zugleich das Ziel bzw. den neuen Status der Freiheit wieder.
- source_word: חִנָּם
  choice: ohne Bezahlung
  rationale: Im Kontext bezeichnet das Wort die Freilassung ohne dafür zu entrichtende Zahlung oder Ablösesumme.
theological_decisions:
- issue: Wiedergabe von עֶבֶד im Kontext gekaufter, gebundener Arbeit
  choice: Sklave
  alternative: Diener; Knecht
  rationale: Der Text spricht ausdrücklich vom Kauf eines Menschen und von einer festgelegten Dienstzeit. „Sklave“ legt die Härte des rechtlichen Status offen, ohne die im Text geregelte zeitliche Begrenzung zu verschweigen.
- issue: Art der Freilassung
  choice: ohne Bezahlung als freier Mann fortgehen
  alternative: umsonst in die Freiheit hinausgehen
  rationale: Die Übersetzung lässt sowohl den Statuswechsel zur Freiheit als auch das Fehlen einer Ablösezahlung erkennen und macht keine weitergehende Aussage darüber, wer andernfalls hätte zahlen müssen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssatzstruktur. „Sklave“ wird bewusst nicht beschönigt; die Fußnote nennt die traditionelle Alternative „Knecht“. Die Semantik des Hinausgehens, der Freiheit und der fehlenden Zahlung bleibt erkennbar.
