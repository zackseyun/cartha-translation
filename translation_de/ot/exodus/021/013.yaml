source:
  edition: WLC
  text: וַ/אֲשֶׁר֙ לֹ֣א צָדָ֔ה וְ/הָ/אֱלֹהִ֖ים אִנָּ֣ה לְ/יָד֑/וֹ וְ/שַׂמְתִּ֤י לְ/ךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: de
  text: Wenn er ihm aber nicht aufgelauert hat und Gott es durch seine Hand geschehen ließ[a], dann werde ich dir einen Ort bestimmen, an den er fliehen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Gott ließ es zu seiner Hand geschehen.“ Die hebräische Wendung beschreibt ein Geschehen durch die Hand des Betreffenden, das nicht auf vorsätzlichem Auflauern beruht und zugleich unter Gottes Fügung steht.'
    reason: Die Anmerkung erläutert die ungewöhnliche Wendung אִנָּה לְיָדוֹ, ohne die göttliche Fügung oder die menschliche Beteiligung abzuschwächen und ohne eine unzutreffende scheinwörtliche Wiedergabe zu verwenden.
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Hat er aber
  rationale: Die Wendung führt im Gegensatz zum vorsätzlichen Mord des vorherigen Verses einen bedingten Fall ein. Die deutsche Satzstellung gibt diesen Rechtsfall natürlich wieder.
- source_word: לֹא צָדָה
  choice: ihm nicht aufgelauert
  rationale: צדה bezeichnet hier das Auflauern beziehungsweise die vorsätzliche Planung, nicht eine gewöhnliche Jagd. „Aufgelauert“ erhält das konkrete Bild und den rechtlichen Gegensatz zur Absichtstat.
- source_word: וְהָאֱלֹהִים
  choice: sondern Gott
  rationale: אֱלֹהִים bezeichnet hier am wahrscheinlichsten Gott als den, unter dessen Fügung das nicht vorsätzlich herbeigeführte Geschehen eintritt. „Sondern“ macht den sachlichen Gegensatz im Deutschen deutlich.
- source_word: אִנָּה לְיָדוֹ
  choice: ließ es durch seine Hand geschehen
  rationale: Die Formulierung bewahrt sowohl Gottes Fügung als auch die menschliche Hand als Mittel des Geschehens. Sie ist im Deutschen verständlicher als eine wörtliche Wiedergabe der hebräischen Wendung.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: werde ich dir einen Ort bestimmen
  rationale: „Bestimmen“ gibt die autoritative Festlegung eines Zufluchtsortes knapp und natürlich wieder.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: an den er fliehen kann
  rationale: Die Übersetzung erhält die Richtungsangabe von שָׁמָּה und beschreibt den vorgesehenen Ort als mögliche Zuflucht.
theological_decisions:
- issue: Göttliche Mitwirkung bei einer nicht vorsätzlichen Tötung
  choice: Gott ließ es durch seine Hand geschehen
  alternative: Gott ließ es seiner Hand begegnen
  rationale: 'Die Übersetzung lässt die Spannung des hebräischen Textes bestehen: Die Tötung war nicht vorsätzlich, wird aber dennoch ausdrücklich unter Gottes Fügung beschrieben. Sie spricht Gott nicht aus dem Geschehen heraus und macht ihn zugleich nicht zum Täter eines vorsätzlichen Mordes.'
- issue: Bedeutung von אֱלֹהִים
  choice: Gott
  alternative: die Richter
  rationale: Der Zusammenhang einer unvorhergesehenen Tötung und die Wendung אִנָּה לְיָדוֹ sprechen hier für göttliche Fügung; die andernorts mögliche Bedeutung „Richter“ passt weniger gut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich klarer Satzführung. Das konkrete „aufgelauert“ hält den Gegensatz zur vorsätzlichen Tat fest; die Fußnote erläutert die ungewöhnliche hebräische Wendung, ohne ihre theologische Spannung aufzulösen.
