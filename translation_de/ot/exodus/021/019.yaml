base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: de
  text: Wenn der Verletzte aufsteht und draußen auf seinen Stock gestützt umhergeht[a], ist derjenige, der ihn geschlagen hat, von Strafe frei. Er muss jedoch für den Ausfall während seiner Arbeitsunfähigkeit aufkommen[b] und dafür sorgen, dass er vollständig geheilt wird[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf seinem Stock«. Gemeint ist, dass er sich beim Gehen auf den Stock stützt; dies gilt als Zeichen seiner Genesung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Ausfall während der Zeit, in der der Verletzte seiner gewöhnlichen Arbeit nicht nachgehen kann.
    reason: cultural_note
  - marker: c
    text: 'Im Hebräischen steht eine verstärkende Wendung, wörtlich etwa: »heilen soll er heilen«. Sie verpflichtet den Täter, für die vollständige Genesung beziehungsweise die erforderliche Behandlung zu sorgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: Wenn der Verletzte wieder aufsteht
  rationale: Die Bedingung beschreibt, dass der zuvor Verletzte sich wieder erheben kann. Das im Deutschen ergänzte „der Verletzte“ macht den Bezug eindeutig, ohne den Sinn zu erweitern.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: und draußen … umhergeht
  rationale: Der Hitpael von הלך bezeichnet hier selbstständige beziehungsweise wiederholte Fortbewegung; „umhergeht“ gibt dies natürlicher wieder als ein bloßes „geht“.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: auf seinen Stock gestützt
  rationale: Die Präposition עַל bedeutet wörtlich „auf“; im Zusammenhang dient der Stock als Stütze und ist ein Zeichen teilweiser Genesung.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: bleibt derjenige, der ihn geschlagen hat, straffrei
  rationale: Das Nifal von נקה bezeichnet im rechtlichen Zusammenhang Freiheit von der sonst drohenden Strafe oder Haftung. „Straffrei“ wahrt den juristischen Sinn, während die anschließend ausdrücklich verlangte Entschädigung bestehen bleibt.
- source_word: רַק
  choice: jedoch
  rationale: Die restriktive Partikel grenzt die verbleibenden Pflichten des Täters ein. In der deutschen Satzverknüpfung bringt „jedoch“ den Gegensatz zwischen Straffreiheit und fortbestehender Ersatzpflicht natürlich zum Ausdruck.
- source_word: שִׁבְתּוֹ יִתֵּן
  choice: den Verdienstausfall ersetzen
  rationale: שִׁבְתּוֹ bezeichnet hier die durch Arbeitsunfähigkeit verlorene Zeit beziehungsweise deren wirtschaftlichen Ausfall; נתן hat im Entschädigungsrecht den Sinn von „leisten, bezahlen“.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: und dafür sorgen, dass er vollständig geheilt wird
  rationale: Infinitivus absolutus und finite Verbform verstärken die Heilungsverpflichtung. Die Formulierung lässt offen, ob der Täter selbst behandelt oder für Behandlung und Genesung aufkommt, und gibt zugleich den emphatischen Charakter wieder.
