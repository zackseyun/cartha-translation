base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/010.yaml
  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: de
  text: Wenn er eine weitere Frau heiratet, darf er ihre Nahrung, ihre Kleidung und ihren Anspruch auf eheliche Gemeinschaft[a] nicht mindern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihren Anspruch auf ehelichen Verkehr“. Der seltene hebräische Ausdruck bezeichnet wahrscheinlich die Verpflichtung des Mannes zur ehelichen Intimität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Die Konditionalpartikel leitet den Tatbestand des kasuistischen Rechtssatzes ein; „wenn“ bewahrt diese Form im Deutschen natürlich.
- source_word: אַחֶרֶת
  choice: eine andere Frau
  rationale: Wörtlich steht „eine andere“; im Zusammenhang ist eine weitere Frau als Ehefrau gemeint. „Frau“ gibt dies knapp wieder, ohne „zweite“ zu unterstellen.
- source_word: יִקַּח לוֹ
  choice: er sich … nimmt
  rationale: Die Verbindung von לקח mit einer Frau kann im ehelichen Zusammenhang „zur Frau nehmen“ bedeuten. Das reflexive „sich“ bildet לוֹ idiomatisch ab.
- source_word: שְׁאֵרָהּ
  choice: ihre Nahrung
  rationale: Das seltene Wort ist hier als materielle Versorgung, besonders Nahrung, zu verstehen; diese Bedeutung passt zur Aufzählung ehelicher Unterhaltspflichten.
- source_word: כְּסוּתָהּ
  choice: ihre Kleidung
  rationale: Das Substantiv bezeichnet Bedeckung beziehungsweise Kleidung; „Kleidung“ ist im rechtlichen Zusammenhang klar und natürlich.
- source_word: וְעֹנָתָהּ
  choice: ihr Recht auf eheliche Gemeinschaft
  rationale: Der schwierige Ausdruck bezeichnet wahrscheinlich den Anspruch auf eheliche Intimität. Die Formulierung wahrt den Rechtscharakter und bleibt zugleich würdig und verständlich.
- source_word: לֹא יִגְרָע
  choice: darf … nicht schmälern
  rationale: Das Verb bedeutet vermindern oder kürzen. „Nicht schmälern“ lässt sich im Deutschen auf alle drei genannten Ansprüche beziehen und gibt das rechtliche Verbot natürlich wieder.
theological_decisions:
- issue: Reichweite von עֹנָה
  choice: Recht auf eheliche Gemeinschaft
  alternative: ehelicher Verkehr; eheliche Rechte
  rationale: Die Übersetzung macht die wahrscheinlich gemeinte Verpflichtung zu ehelicher Intimität kenntlich, ohne sie klinisch auszudrücken oder über den schwierigen hebräischen Begriff hinaus näher zu bestimmen.
translation_notes:
  register: Moderner, würdiger Rechtsstil. „Darf … nicht“ formuliert das Verbot idiomatisch; „schmälern“ hält die drei Versorgungs- und Eheansprüche unter einem gemeinsamen Verb zusammen.
