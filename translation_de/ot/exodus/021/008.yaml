  variant: modern standard German
source:
  edition: WLC
  text: אִם רָעָ֞ה בְּ/עֵינֵ֧י אֲדֹנֶ֛י/הָ אֲשֶׁר לא יְעָדָ֖/הּ וְ/הֶפְדָּ֑/הּ לְ/עַ֥ם נָכְרִ֛י לֹא יִמְשֹׁ֥ל לְ/מָכְרָ֖/הּ בְּ/בִגְד/וֹ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: de
  text: Wenn sie ihrem Herrn nicht gefällt und er sie nicht für sich bestimmt hat[a], soll er ihre Auslösung gestatten. Er hat nicht das Recht, sie an ein fremdes Volk zu verkaufen, denn er hat treulos an ihr gehandelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und er sie für sich bestimmt/verlobt hat“. Der hebräische Satz ist textlich und in seiner Deutung schwierig.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „denn er hat verräterisch an ihr gehandelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: ihrem Herrn nicht gefällt
  rationale: Die hebräische Wendung bezeichnet, dass jemand in den Augen eines anderen missfällt oder für ihn nicht annehmbar ist; die natürliche deutsche Formulierung gibt den Sinn klar wieder.
- source_word: אֲדֹנֶיהָ
  choice: ihrem Herrn
  rationale: Im rechtlichen Zusammenhang bezeichnet das Wort den männlichen Verfügungsberechtigten beziehungsweise Käufer. „Herr“ bewahrt die soziale Rangbeziehung, ohne hier einen göttlichen Titel zu meinen.
- source_word: יְעָדָהּ
  choice: er sie nicht für sich bestimmt hat
  rationale: Das Verb bezeichnet hier ihre Bestimmung für eine eheliche Verbindung. „Für sich bestimmt“ erhält eine gewisse lexikalische Breite; die textlich schwierige abweichende Lesart wird in der Fußnote genannt.
- source_word: וְהֶפְדָּהּ
  choice: soll er ihre Auslösung gestatten
  rationale: Der Hifil kann hier das Ermöglichen beziehungsweise Zulassen der Auslösung ausdrücken, ohne festzulegen, dass der Herr selbst den Preis bezahlt.
- source_word: לְעַם נָכְרִי
  choice: an ein fremdes Volk
  rationale: Die kollektive Formulierung des Hebräischen wird bewahrt und bezeichnet Menschen außerhalb der eigenen Gemeinschaft.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: Er hat nicht das Recht, sie … zu verkaufen
  rationale: משל drückt hier rechtliche Verfügungsgewalt aus; „nicht das Recht haben“ gibt diese juristische Aussage in heutigem Deutsch natürlich wieder.
- source_word: בְּבִגְדוֹ בָהּ
  choice: denn er hat treulos an ihr gehandelt
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln. Die Formulierung bewahrt den rechtlich-moralischen Vorwurf und bleibt idiomatisch.
theological_decisions:
- issue: Deutung von יְעָדָהּ und der masoretischen Lese- beziehungsweise Textschwierigkeit
  choice: „er sie nicht für sich bestimmt hat“ im Haupttext
  alternative: „er sie für sich bestimmt/verlobt hat“
  rationale: Die masoretische Überlieferung bietet an dieser Stelle eine bekannte Schwierigkeit; Lesetraditionen und alte Textzeugen unterscheiden sich hinsichtlich der Verneinung und der genaueren Bedeutung „bestimmen“ oder „verloben“. Der Haupttext folgt der vorgelegten Lesung mit Verneinung, während die Alternative in einer Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Formulierung ist verständlich, wahrt aber die historische soziale Beziehung und lässt die echte Text- und Deutungsunsicherheit ausdrücklich bestehen.
