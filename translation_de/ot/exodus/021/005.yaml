id: EXO.21.5
reference: Exodus 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם אָמֹ֤ר יֹאמַר֙ הָ/עֶ֔בֶד אָהַ֨בְתִּי֙ אֶת אֲדֹנִ֔/י אֶת אִשְׁתִּ֖/י וְ/אֶת בָּנָ֑/י לֹ֥א אֵצֵ֖א חָפְשִֽׁי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: de
  text: 'Wenn aber der Sklave ausdrücklich erklärt[a]: »Ich liebe meinen Herrn, meine Frau und meine Kinder[b]; ich will nicht als freier Mann fortgehen«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nachdrücklich sagt« beziehungsweise »mit Bestimmtheit erklärt«; im Hebräischen wird die Verbalaussage durch einen Infinitivus absolutus verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »meine Söhne«; der maskuline Plural kann hier auch Kinder allgemein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn aber
  rationale: Leitet eine bedingte Ausnahme zum vorausgehenden Rechtsfall ein und gibt den kontrastiven Zusammenhang im Deutschen natürlich wieder.
- source_word: אָמֹר יֹאמַר
  choice: ausdrücklich erklärt
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; die deutsche Wendung vermittelt eine nachdrückliche, bewusste Erklärung.
- source_word: הָעֶבֶד
  choice: der Sklave
  rationale: Im rechtlichen Zusammenhang steht der gebundene Status und die mögliche Freilassung im Mittelpunkt; »Sklave« macht dieses Abhängigkeitsverhältnis deutlich.
- source_word: אָהַבְתִּי
  choice: Ich liebe
  rationale: Das Perfekt bezeichnet hier eine bestehende, gefestigte Zuneigung beziehungsweise Bindung; das deutsche Präsens ist in direkter Rede natürlich.
- source_word: אֲדֹנִי
  choice: meinen Herrn
  rationale: »Herr« ist im Deutschen die natürliche Bezeichnung für den Haushaltsvorstand, dem der Sklave untersteht; der Kontext verhindert eine göttliche Deutung.
- source_word: אִשְׁתִּי
  choice: meine Frau
  rationale: Direkte und idiomatische Wiedergabe der Possessivform.
- source_word: בָּנָי
  choice: meine Kinder
  rationale: Der maskuline Plural kann im familiären Zusammenhang die Nachkommen allgemein bezeichnen; das Geschlecht wird im Vers nicht ausdrücklich hervorgehoben.
- source_word: לֹא אֵצֵא
  choice: ich will nicht ... fortgehen
  rationale: Das Verb bezeichnet hier das Verlassen des Dienstverhältnisses; mit »will nicht« wird die erklärte Entscheidung im Zusammenhang natürlich ausgedrückt.
- source_word: חָפְשִׁי
  choice: als freier Mann
  rationale: Gibt das prädikative Adjektiv und den rechtlichen Status beim Weggang im Deutschen eindeutig wieder.
theological_decisions:
- issue: Wiedergabe von עבד im israelitischen Dienstbarkeitsrecht
  choice: Sklave
  alternative: Diener; Schuldknecht
  rationale: Da es um die Entlassung aus rechtlich gebundener Arbeit und deren Ablehnung geht, ist der unfreie Status wesentlich. »Sklave« benennt ihn ohne beschönigende Auflösung.
- issue: Bedeutungsumfang von בָּנַי
  choice: meine Kinder
  alternative: meine Söhne
  rationale: Die Form ist grammatisch maskulin, kann jedoch Nachkommen allgemein einschließen. Der Kontext entscheidet nicht sicher, ob ausschließlich männliche Kinder gemeint sind; diese Spannung wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch in juristisch erzählendem Register. Die direkte Rede bleibt klar und mündlich. »Sklave« wahrt die Härte des rechtlichen Status; »Herr« ist im deutschen Haushaltskontext idiomatischer als »Meister«. Alle Fußnotenmarker stehen unmittelbar an den betreffenden Ausdrücken.
