translation:
  language: de
  text: Auge um Auge[a], Zahn um Zahn, Hand um Hand, Fuß um Fuß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auge anstelle von Auge, Zahn anstelle von Zahn, Hand anstelle von Hand, Fuß anstelle von Fuß.“'
    reason: Lexikalische Alternative für תַּחַת; sie macht den Gedanken des Ersatzes ausdrücklich, klingt im deutschen Haupttext jedoch weniger formelhaft.
lexical_decisions:
- source_word: עַיִן
  choice: Auge
  rationale: Das Substantiv bezeichnet hier eindeutig das körperliche Auge. Die artikellose Form bewahrt die knappe Rechtssatzformel des Hebräischen.
- source_word: תַּחַת
  choice: um
  rationale: In diesem Rechtskontext bezeichnet תַּחַת eine entsprechende Ersatzleistung oder Vergeltung, nicht die räumliche Lage „unter“. Die feste deutsche Wendung „Auge um Auge“ gibt die knappe Zuordnung natürlich wieder; „anstelle von“ bleibt als lexikalische Alternative in der Fußnote erhalten.
- source_word: שֵׁן
  choice: Zahn
  rationale: Das Wort bedeutet „Zahn“. Die artikellose Wiedergabe erhält Parallelismus und Prägnanz.
- source_word: יָד
  choice: Hand
  rationale: Gemeint ist die körperliche Hand. Die direkte Entsprechung wahrt Rhythmus und Struktur der hebräischen Reihe.
- source_word: רֶגֶל
  choice: Fuß
  rationale: רֶגֶל kann je nach Kontext auch einen größeren Bereich des Beins bezeichnen; in dieser festen Körperteilfolge ist „Fuß“ die präziseste und natürlichste Entsprechung.
theological_decisions:
- issue: Art der Rechtsformel
  choice: 'Knappe Aussage entsprechender Vergeltung beziehungsweise Ersatzleistung: „Auge um Auge … Fuß um Fuß“.'
  alternative: Eine auslegende Wiedergabe wie „Die Strafe soll der Verletzung entsprechen“.
  rationale: Der hebräische Text besteht ausschließlich aus paarweise angeordneten Körperteilbezeichnungen mit תַּחַת. Eine erklärende Paraphrase würde die rechtliche Anwendung stärker festlegen, als es der Wortlaut dieses Verses tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle und allgemein verständliche Rechtsformel wird beibehalten; der viergliedrige Parallelismus und die Kürze des Hebräischen bleiben erhalten.
