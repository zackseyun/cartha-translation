  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: de
  text: Wenn Männer miteinander kämpfen und dabei eine schwangere Frau stoßen, sodass ihre Kinder herauskommen[a], aber kein schwerer Schaden entsteht[b], dann muss der Schuldige eine Geldstrafe zahlen, wie der Ehemann der Frau sie ihm auferlegt; er soll sie nach dem Urteil der Richter entrichten[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sodass ihre Kinder herauskommen“. Gemeint sein kann eine vorzeitige Geburt; andere verstehen den Ausdruck als Fehlgeburt.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text sagt in diesem Vers nicht ausdrücklich, ob der schwere Schaden die Frau, das Kind beziehungsweise die Kinder oder beide betrifft.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „vor Gericht“ beziehungsweise „gemäß richterlicher Entscheidung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Leitet einen kasuistischen Rechtsfall ein; „Wenn“ entspricht natürlichem deutschem Gesetzesstil.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: Männer miteinander kämpfen
  rationale: Bewahrt den ausdrücklich maskulinen Plural und gibt die körperliche Auseinandersetzung natürlich wieder.
- source_word: וְנָגְפוּ
  choice: stoßen
  rationale: Das Verb bezeichnet einen körperlichen Stoß oder Schlag. „Stoßen“ bleibt konkret, ohne eine bereits eingetretene Verletzung vorwegzunehmen.
- source_word: אִשָּׁה הָרָה
  choice: eine schwangere Frau
  rationale: Klare, moderne und genaue Wiedergabe.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: sodass ihre Kinder herauskommen
  rationale: Folgt der ungewöhnlichen, aber bewusst offenen hebräischen Formulierung und entscheidet nicht zwischen Frühgeburt, Fehlgeburt und allgemeinem Ausstoßen.
- source_word: אָסוֹן
  choice: schwerer Schaden
  rationale: Gibt die Vorstellung ernsten Unheils wieder, ohne sie auf Tod oder auf eine bestimmte betroffene Person zu beschränken.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: muss ... eine Geldstrafe zahlen
  rationale: Die verstärkende Konstruktion fordert sicher eine Strafe; der folgende Zahlungszusammenhang weist auf eine Geldstrafe.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: wie der Ehemann der Frau sie ihm auferlegt
  rationale: Bewahrt die unmittelbare syntaktische Aussage, dass der Ehemann die Forderung festsetzt, ohne die anschließende richterliche Kontrolle auszublenden.
- source_word: וְנָתַן בִּפְלִלִים
  choice: er soll sie nach dem Urteil der Richter entrichten
  rationale: Versteht פְּלִלִים als richterliche Instanz beziehungsweise Entscheidung und formuliert den Zahlungsvorgang in natürlichem deutschem Rechtsstil.
theological_decisions:
- issue: Bedeutung des Herauskommens der Kinder
  choice: Die wörtlich offene Formulierung „ihre Kinder herauskommen“ bleibt im Haupttext erhalten.
  alternative: „eine Fehlgeburt haben“ oder „vorzeitig gebären“
  rationale: Der hebräische Ausdruck legt für sich allein weder Fehlgeburt noch lebende Frühgeburt eindeutig fest; eine Präzisierung würde die ethische und theologische Spannung unzulässig auflösen.
- issue: Bezug von אָסוֹן
  choice: „schwerer Schaden“ ohne ausdrückliche Zuordnung zu Mutter oder Kindern
  alternative: Bezug ausschließlich auf die Frau oder ausdrücklich auf Frau und Kinder
  rationale: Der Vers nennt nicht ausdrücklich, wen der Schaden trifft. Die deutsche Fassung erhält diese Mehrdeutigkeit.
- issue: Verhältnis von Forderung des Ehemanns und richterlicher Entscheidung
  choice: Die Geldstrafe wird vom Ehemann auferlegt und nach dem Urteil der Richter entrichtet.
  alternative: Die Höhe wird ausschließlich gerichtlich festgesetzt.
  rationale: Beide Satzglieder werden abgebildet, ohne ihre rechtliche Beziehung stärker zu bestimmen, als der knappe hebräische Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht rechtssprachlichem Ton. Die ungewöhnliche Wendung „ihre Kinder herauskommen“ ist absichtlich quellennah, da eine glattere Formulierung eine umstrittene Deutung festlegen würde.
