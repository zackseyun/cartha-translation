base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: de
  text: Dann soll sein Herr ihn vor Gott[a] bringen. Er soll ihn an die Tür oder an den Türpfosten bringen, und sein Herr soll ihm das Ohr mit einem Pfriem durchbohren. Dann soll er ihm für immer dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor die Richter“ beziehungsweise „vor das Gericht“. Das hebräische Wort אֱלֹהִים kann in bestimmten rechtlichen Zusammenhängen menschliche Richter oder eine Gerichtsinstanz bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגִּישׁוֹ
  choice: soll ihn … bringen
  rationale: Der Hifil von נגשׁ bezeichnet hier das Heranbringen beziehungsweise Vorführen einer Person; „bringen“ gibt den rechtlichen Vorgang natürlich und direkt wieder.
- source_word: אֲדֹנָיו
  choice: sein Herr
  rationale: „Herr“ bezeichnet im rechtlichen Kontext denjenigen, dem der betreffende Diener untersteht, und entspricht der wiederholten Beziehungsangabe des Hebräischen.
- source_word: הָאֱלֹהִים
  choice: vor Gott
  rationale: אֱלֹהִים bezeichnet am unmittelbarsten Gott. Die Präposition אֶל wird im Deutschen bei einer Vorführung idiomatisch mit „vor“ wiedergegeben; die mögliche Deutung als Richter beziehungsweise Gerichtsinstanz bleibt in der Fußnote erhalten.
- source_word: הַדֶּלֶת
  choice: die Tür
  rationale: Schlichte und konkrete Wiedergabe des architektonischen Ausdrucks.
- source_word: הַמְּזוּזָה
  choice: der Türpfosten
  rationale: „Türpfosten“ ist die präzise, geläufige Bezeichnung für מְזוּזָה in diesem baulichen Zusammenhang.
- source_word: רָצַע
  choice: durchbohren
  rationale: Das Verb bezeichnet das Durchstechen beziehungsweise Durchbohren des Ohres mit einem spitzen Werkzeug; „durchbohren“ bildet den konkreten Vorgang präzise ab.
- source_word: אָזְנוֹ
  choice: ihm das Ohr
  rationale: Die deutsche Dativkonstruktion gibt den hebräischen Possessivbezug natürlich wieder, ohne den wörtlichen Körperteilbezug abzuschwächen.
- source_word: בַּמַּרְצֵעַ
  choice: mit einem Pfriem
  rationale: Ein Pfriem ist ein spitzes Werkzeug zum Durchbohren und damit die präzise deutsche Entsprechung für מַרְצֵעַ.
- source_word: וַעֲבָדוֹ
  choice: Dann soll er ihm … dienen
  rationale: עבד bezeichnet hier den fortdauernden Dienst. „Dienen“ bewahrt die verbale Form, statt den Mann erneut mit einer Statusbezeichnung zu benennen.
- source_word: לְעֹלָם
  choice: für immer
  rationale: Die direkte Wendung wahrt die zeitliche Weite von עוֹלָם. Im Rechtszusammenhang ist damit dauerhafter, praktisch lebenslanger Dienst gemeint, doch die Übersetzung legt diese kontextuelle Begrenzung nicht ausdrücklich in den Haupttext hinein.
theological_decisions:
- issue: Bedeutung von הָאֱלֹהִים im rechtlichen Zusammenhang
  choice: Gott
  alternative: die Richter / das Gericht
  rationale: Die Grundbedeutung ist „Gott“, und die Formulierung kann eine Vorführung vor Gott im Rahmen eines sakral-rechtlichen Vorgangs bezeichnen. Da im Rechtskontext auch eine menschliche Gerichtsinstanz gemeint sein kann, wird diese plausible Alternative in einer Fußnote offengelegt.
- issue: Reichweite von לְעֹלָם
  choice: für immer
  alternative: auf Lebenszeit / dauerhaft
  rationale: „Für immer“ entspricht der offenen hebräischen Zeitangabe formal am besten. Der rechtliche Kontext legt einen lebenslangen beziehungsweise dauerhaften Dienst nahe, doch diese Präzisierung wird nicht stillschweigend in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die Wiederholung von „bringen“ bildet die zweistufige Formulierung des Hebräischen ab. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
