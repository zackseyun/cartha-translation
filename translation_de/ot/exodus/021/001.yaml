id: EXO.21.1
reference: Exodus 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר תָּשִׂ֖ים לִ/פְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/001.yaml
  text: These are the judgments that you shall set before them:[a]
translation:
  language: de
  text: Und dies sind die Rechtsbestimmungen, die du ihnen vorlegen sollst:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Rechtssprüche“, „Satzungen“ oder „Vorschriften“. Das hebräische Wort bezeichnet rechtliche Entscheidungen oder fallbezogene Bestimmungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das einleitende וְ verbindet den neuen Abschnitt mit dem Vorhergehenden; „Und dies sind“ gibt diese Verknüpfung ohne einen nicht ausdrücklich vorhandenen Zeitbegriff wieder.
- source_word: הַמִּשְׁפָּטִים
  choice: die Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet hier rechtliche Entscheidungen beziehungsweise fallbezogene Vorschriften. „Rechtsbestimmungen“ bewahrt den juristischen Sinn und klingt im modernen Deutschen natürlicher als „Gerichte“ oder „Rechtssprüche“.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen wird im Deutschen passend zu „Rechtsbestimmungen“ mit „die“ wiedergegeben.
- source_word: תָּשִׂים
  choice: du ... vorlegen sollst
  rationale: שׂים bedeutet wörtlich „setzen, stellen, legen“. Zusammen mit לִפְנֵיהֶם bezeichnet es hier das verbindliche Vorlegen der Bestimmungen; „sollst“ gibt den anweisenden Charakter natürlich wieder.
- source_word: לִפְנֵיהֶם
  choice: ihnen vorlegen
  rationale: Die Wendung bedeutet wörtlich „vor sie/vor ihnen“. Im deutschen Rechts- und Unterweisungskontext gibt „ihnen vorlegen“ den gemeinten Vorgang idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von מִשְׁפָּטִים im Zusammenhang des Bundesrechts
  choice: Rechtsbestimmungen
  alternative: Rechtssprüche; Satzungen; Vorschriften
  rationale: Die Übersetzung hält die rechtlich-richterliche und fallbezogene Nuance offen, ohne den Ausdruck auf allgemeine Gesetze zu verengen oder ihm eine konfessionell geprägte Bedeutung zu geben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverbindung mit dem vorausgehenden Abschnitt bleibt durch „Und“ sichtbar; „vorlegen“ ist idiomatisch und wahrt zugleich das Bild des hebräischen Ausdrucks.
