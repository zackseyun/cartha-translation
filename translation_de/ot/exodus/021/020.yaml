  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: de
  text: Und wenn ein Mann seinen Sklaven oder seine Sklavin mit einem Stock schlägt und der Sklave oder die Sklavin unter seiner Hand stirbt, muss unbedingt Vergeltung geübt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er muss unbedingt bestraft werden.« Wörtlicher: »Es soll unbedingt Vergeltung geübt werden«; die verdoppelte Verbform ist eine nachdrückliche Rechtsformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Leitet im Zusammenhang einen kasuistischen Rechtssatz ein und bewahrt sowohl die Verknüpfung durch וְ als auch die Bedingung durch כִּי.
- source_word: יַכֶּה
  choice: schlägt
  rationale: נכה bezeichnet allgemein das Schlagen; die Art wird durch das folgende Werkzeug näher bestimmt.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Gibt die grammatisch männliche Einzahl des hebräischen Rechtssatzes unmittelbar wieder.
- source_word: עַבְדּוֹ / אֲמָתוֹ
  choice: seinen Sklaven oder seine Sklavin
  rationale: Beide Wörter bezeichnen hier Menschen in einem rechtlich gebundenen Abhängigkeitsverhältnis. Die parallele männliche und weibliche Bezeichnung bleibt ausdrücklich erhalten.
- source_word: בַּשֵּׁבֶט
  choice: mit einem Stock
  rationale: שֵׁבֶט kann Stock, Stab oder Zepter bedeuten; als Schlagwerkzeug passt im Deutschen hier »Stock« am natürlichsten.
- source_word: וּמֵת תַּחַת יָדוֹ
  choice: und der Sklave oder die Sklavin unter seiner Hand stirbt
  rationale: Die Wiederholung beseitigt eine im Deutschen störende Genusmehrdeutigkeit. »Unter seiner Hand« bewahrt das markante hebräische Bild, ohne es auf eine einzige Deutung einzuengen.
- source_word: נָקֹם יִנָּקֵם
  choice: muss das Opfer unbedingt gerächt werden
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Verbindlichkeit. Das Passiv von נקם wird lexikalisch transparent als »gerächt werden« wiedergegeben; »das Opfer« klärt den Bezug, ohne die konkrete gerichtliche Sanktion festzulegen.
theological_decisions:
- issue: Art der Rechtsfolge in נָקֹם יִנָּקֵם
  choice: muss das Opfer unbedingt gerächt werden
  alternative: der Täter muss unbedingt bestraft werden
  rationale: Der hebräische Wortlaut fordert mit Nachdruck Vergeltung beziehungsweise Ahndung, nennt in diesem Vers aber nicht ausdrücklich deren genaue gerichtliche Form. Die Hauptfassung bewahrt diese Offenheit; die verständlichere, aber deutendere Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Sklave/Sklavin« macht den rechtlich gebundenen Status deutlicher als »Diener/Dienerin«. Die ungewöhnliche Wendung »unter seiner Hand« wurde bewusst beibehalten, während die Wiederholung »der Sklave oder die Sklavin« den Bezug für heutige Leser klärt.
