base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: de
  text: Und wenn das Rind eines Mannes das Rind seines Nächsten stößt, sodass es stirbt,[a] sollen sie das lebende Rind verkaufen und den Erlös[b] unter sich teilen; auch das tote Rind sollen sie unter sich teilen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Hörnern stößt“. Das hebräische Verb bezeichnet einen heftigen Stoß und kann bei einem Rind das Stoßen mit den Hörnern meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Silber/Geld“; gemeint ist der Erlös aus dem Verkauf des lebenden Rindes.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „der Tote“; gemeint ist das tote Rind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Bewahrt sowohl die Verknüpfung mit dem vorausgehenden Gesetz als auch die konditionale Funktion der kasuistischen Rechtsformel.
- source_word: יִגֹּף
  choice: stößt
  rationale: Das Verb bezeichnet einen heftigen Stoß und kann bei einem Rind auch das Stoßen mit den Hörnern meinen. „Stößt“ lässt den genaueren Vorgang wie im Hebräischen offen.
- source_word: שׁוֹר אִישׁ
  choice: das Rind eines Mannes
  rationale: Gibt die Besitzangabe klar wieder und wahrt die singularische Rechtsformulierung des Hebräischen.
- source_word: שׁוֹר רֵעֵהוּ
  choice: das Rind seines Nächsten
  rationale: רֵעַ bezeichnet hier den Mitmenschen beziehungsweise den anderen Beteiligten; „seines Nächsten“ ist würdig, verständlich und textnah.
- source_word: וָמֵת
  choice: sodass es stirbt
  rationale: Macht den im Zusammenhang gemeinten tödlichen Ausgang des Stoßes idiomatisch deutlich, ohne zusätzliche Kausalität einzutragen.
- source_word: וּמָכְרוּ
  choice: sollen sie ... verkaufen
  rationale: Gibt die im Gesetzesfall folgende verbindliche Rechtsfolge natürlich wieder.
- source_word: הַשּׁוֹר הַחַי
  choice: das lebende Rind
  rationale: Bezeichnet präzise das überlebende Tier und entspricht der substantivierten hebräischen Beschreibung.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: den Erlös unter sich teilen
  rationale: כַּסְפּוֹ lautet wörtlich „sein Silber/Geld“ und meint im Anschluss an den Verkauf den erzielten Geldbetrag. „Erlös“ ist im Deutschen die klare kontextuelle Wiedergabe.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: auch das tote Tier sollen sie unter sich teilen
  rationale: Das Hebräische sagt wörtlich „auch das Tote/den Toten“. „Das tote Tier“ klärt den Bezug auf das verendete Rind, ohne den Text enger als „Kadaver“ zu bestimmen.
