  text: וּ/מְקַלֵּ֥ל אָבִ֛י/ו וְ/אִמּ֖/וֹ מ֥וֹת יוּמָֽת׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/017.yaml
  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: de
  text: Wer seinen Vater oder seine Mutter verflucht, muss mit dem Tod bestraft werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „und seine Mutter“; in dieser Rechtsformel ist die Aussage distributiv gemeint und bezieht sich auf das Verfluchen des Vaters oder der Mutter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Wer … verflucht
  rationale: Das substantivisch gebrauchte Partizip bezeichnet im Rechtssatz allgemein den Täter. „Wer … verflucht“ gibt diese Funktion in natürlichem Deutsch wieder und bewahrt gegenüber dem weiteren „schmäht“ die Bedeutung eines ausgesprochenen Fluches.
- source_word: אָבִיו
  choice: seinen Vater
  rationale: Das Substantiv mit Suffix der 3. Person maskulin Singular bezieht sich auf den generisch bezeichneten Täter.
- source_word: וְאִמּוֹ
  choice: oder seine Mutter
  rationale: 'Das hebräische Waw bedeutet formal „und“, hat hier aber im Elternpaar distributive Kraft: Schon das Verfluchen eines Elternteils fällt unter die Bestimmung. Im deutschen Rechtssatz drückt „oder“ diesen Sinn eindeutig aus.'
- source_word: מוֹת יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Infinitivus absolutus plus finite Hofal-Form verstärkt die vorgeschriebene passive Todesstrafe. Die Formulierung kennzeichnet eine verhängte rechtliche Sanktion und nicht lediglich die Feststellung, dass der Täter sterben werde.
theological_decisions:
- issue: Geltungsbereich des Elternpaares
  choice: '„seinen Vater oder seine Mutter“: Die Bestimmung gilt für das Verfluchen jedes einzelnen Elternteils.'
  alternative: 'Formal enger am Wortlaut: „seinen Vater und seine Mutter“.'
  rationale: Obwohl im Hebräischen Waw steht, ist die Aufzählung im kasuistischen Recht distributiv zu verstehen. „Oder“ wahrt den Umfang der Bestimmung und vermeidet den falschen Eindruck, nur das Verfluchen beider Eltern gemeinsam sei gemeint.
- issue: Wiedergabe der Todesstrafenformel
  choice: „muss mit dem Tod bestraft werden“ als gerichtliche Strafbestimmung.
  alternative: „muss unbedingt getötet werden“ oder „soll gewiss sterben“.
  rationale: Die passive Kausativform mit verstärkendem Infinitiv bezeichnet eine auferlegte Todesstrafe. Die gewählte Formulierung erhält den juristischen Charakter und die Nachdrücklichkeit, ohne bloß einen künftigen Tod auszusagen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer juristischer Aussage. „Mit dem Tod bestraft werden“ ist idiomatischer als „des Todes sterben“ und präziser als das möglicherweise ereignishafte „sterben müssen“.
