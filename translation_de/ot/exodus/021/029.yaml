id: EXO.21.29
reference: Exodus 21:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: de
  text: Wenn aber das Rind schon seit Längerem[a] zum Stoßen neigte und sein Besitzer gewarnt worden war, es aber nicht bewachte, und es einen Mann oder eine Frau tötet, dann soll das Rind gesteinigt und auch sein Besitzer getötet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seit gestern und vorgestern“; eine hebräische Wendung für ein bereits zuvor bekanntes, wiederholtes Verhalten.'
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: Rind
  rationale: Der Rechtsfall bezeichnet ein einzelnes Hausrind, ohne dass das Geschlecht des Tieres hervorgehoben wird. „Rind“ ist daher genauer als „Stier“ und im modernen Deutschen natürlicher als „Ochse“.
- source_word: נַגָּח
  choice: zum Stoßen neigte
  rationale: Das Partizip beschreibt eine bekannte, wiederholte Neigung des Tieres, nicht nur einen einzelnen Vorfall.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: schon seit Längerem
  rationale: Die wörtliche Wendung „seit gestern und vorgestern“ ist ein hebräisches Idiom für bereits früher festgestelltes beziehungsweise wiederholtes Verhalten. Eine Fußnote bewahrt die konkrete Bildsprache.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: sein Besitzer gewarnt worden war
  rationale: Im rechtlichen Zusammenhang bezeichnet die Passivform eine dem Besitzer erteilte Warnung beziehungsweise förmliche Mitteilung über die Gefahr.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: es aber nicht bewachte
  rationale: שׁמר bedeutet bewachen, hüten oder unter Kontrolle halten. „Nicht bewachte“ wahrt die Grundbedeutung, ohne eine bestimmte Art der Sicherung hinzuzufügen.
- source_word: וְהֵמִית
  choice: es ... tötet
  rationale: Die Verbform bezeichnet unmittelbar, dass das Tier den Tod eines Menschen verursacht.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: einen Mann oder eine Frau
  rationale: Die ausdrückliche Nennung beider Geschlechter wird entsprechend dem hebräischen Text beibehalten.
- source_word: יִסָּקֵל
  choice: soll ... gesteinigt ... werden
  rationale: Die Passivform schreibt im Rechtsfall die Tötung durch Steinigung vor.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: auch sein Besitzer getötet werden
  rationale: Die Hophal-Form von מות ist eine rechtliche Formel für eine verhängte Tötung, nicht lediglich die Aussage, der Besitzer werde sterben.
theological_decisions:
- issue: Rechtlicher Charakter der Strafe für den Besitzer
  choice: auch sein Besitzer getötet werden
  alternative: auch sein Besitzer soll sterben
  rationale: Die hebräische Passiv-Kausativform bezeichnet eine auferlegte Todesstrafe. Die Übersetzung wahrt diesen gerichtlichen Sinn, ohne eine nicht genannte Vollstreckungsart anzugeben.
- issue: Geschlechtsbezogene Bezeichnung des Opfers
  choice: einen Mann oder eine Frau
  alternative: einen Menschen
  rationale: Der Ausgangstext nennt ausdrücklich Mann und Frau; diese rechtliche Gleichstellung wird nicht verallgemeinernd eingeebnet.
translation_notes:
  register: Moderne, würdevolle Rechtssprache. „Rind“ vermeidet die im Deutschen geschlechtsspezifische Bedeutung von „Ochse“; „soll“ gibt die Vorschrift des hebräischen Fallrechts wieder. Der einzige Fußnotenmarker [a] steht unmittelbar bei der idiomatisch wiedergegebenen Zeitangabe.
