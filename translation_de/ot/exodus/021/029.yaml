  source_fidelity: 'Der deutsche Text gibt die rechtlichen Bedingungen und Folgen des Hebräischen vollständig wieder: ein bereits als stoßgefährlich bekanntes Rind, die Warnung an den Besitzer, dessen Unterlassen der Bewachung, die Tötung eines Mannes oder einer Frau sowie die vorgesehenen Strafen. „Schon seit Längerem“ legt die hebräische Idiomatik angemessen aus; die Fußnote bewahrt die wörtliche Zeitformel und ihren Aspekt des vorher bekannten wiederholten Verhaltens.'
  naturalness: Die Formulierung ist klares, modernes Standarddeutsch mit passendem würdigem Rechtsregister. Die Satzstruktur bleibt trotz der kasuistischen Reihung gut verständlich. „Zum Stoßen neigte“ und „nicht bewachte“ sind in diesem Kontext natürlich und präzise.
  terminology: „Rind“ ist als geschlechtsneutrale Bezeichnung für שׁוֹר sachgerecht. Die explizite Opferformel „einen Mann oder eine Frau“ wahrt den Wortlaut. „Gesteinigt“ und „getötet werden“ geben die rechtlichen Passivformen wieder, ohne eine beim Besitzer nicht genannte Hinrichtungsart zu ergänzen. Der Fußnotenanker [a] steht unmittelbar bei der idiomatisch übertragenen Wendung.
