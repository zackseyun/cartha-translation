  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: de
  text: Doch wenn ein Mann vorsätzlich gegen seinen Nächsten vorgeht, um ihn heimtückisch zu töten, sollst du ihn von meinem Altar wegholen, um ihn zu töten.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eigenmächtig gegen seinen Nächsten handelt“. Das hebräische Verb bezeichnet bewusstes, vorsätzliches Handeln.'
    reason: lexical_alternative
  - marker: b
    text: Der Altar konnte als Zufluchtsort aufgesucht werden. Ein vorsätzlicher Täter sollte jedoch auch von dort weggeholt werden.
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: Doch wenn
  rationale: Leitet im Zusammenhang einen kontrastierenden Fall ein und bewahrt zugleich die konditionale Funktion.
- source_word: יָזִד
  choice: vorsätzlich … vorgeht
  rationale: Das Hifil von זיד bezeichnet hier ein bewusstes, eigenmächtiges Handeln. „Vorsätzlich“ bringt im deutschen Rechtston die Abgrenzung zur unbeabsichtigten Tötung klar zum Ausdruck, ohne zwingend einen ausgearbeiteten Plan vorauszusetzen.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Gibt die grammatisch maskuline Singularform im kasuistischen Rechtsstil unmittelbar wieder.
- source_word: עַל רֵעֵהוּ
  choice: gegen seinen Nächsten
  rationale: Bezeichnet die feindselige Handlung gegen einen Mitmenschen beziehungsweise ein Mitglied der Gemeinschaft; „Nächster“ bewahrt die etablierte biblisch-rechtliche Ausdrucksweise.
- source_word: לְהָרְגוֹ
  choice: um ihn … zu töten
  rationale: Gibt den Zweck des Vorgehens wieder. „Töten“ entspricht הרג, während die Rechtswidrigkeit durch Vorsatz und Heimtücke ausgedrückt wird.
- source_word: בְעָרְמָה
  choice: heimtückisch
  rationale: Bezeichnet ein listiges, arglistiges oder betrügerisches Vorgehen. „Heimtückisch“ ist im Kontext verständlich und gewichtig, ohne das allgemeinere Bedeutungsspektrum zu verschweigen.
- source_word: מֵעִם מִזְבְּחִי
  choice: von meinem Altar wegholen
  rationale: מֵעִם bezeichnet das Entfernen aus der Nähe beziehungsweise vom Schutzbereich des Altars. Das Deutsche macht die räumliche Entfernung deutlich, ohne ein im Hebräischen nicht markiertes „sogar“ einzufügen.
- source_word: תִּקָּחֶנּוּ
  choice: sollst du ihn … wegholen
  rationale: Bewahrt die direkte Anweisung in der zweiten Person Singular und gibt im Zusammenhang des Altars die Entfernung idiomatisch wieder.
- source_word: לָמוּת
  choice: damit er stirbt
  rationale: Gibt den Zweck beziehungsweise das Ergebnis formal nah wieder; „zur Hinrichtung“ wäre eindeutiger, aber stärker auslegend.
theological_decisions:
- issue: Gewährt der Altar einem vorsätzlichen Täter Schutz?
  choice: Der Täter soll aus dem Bereich des Altars entfernt werden und sterben; der heilige Ort schützt ihn in diesem Fall nicht.
  alternative: Der Altar könnte lediglich als Ort genannt sein, von dem der Täter zur Verhandlung abgeführt wird.
  rationale: Die ausdrückliche Anweisung, ihn vom Altar wegzuholen, legt einen versuchten Schutz im Heiligtum nahe. Der Haupttext lässt den genauen institutionellen Hintergrund offen; die Fußnote erklärt die wahrscheinliche kulturelle Bedeutung.
translation_notes:
  register: 'Moderner, würdevoller deutscher Rechtsstil. „Doch wenn … sollst du“ bildet die kasuistische Gesetzesform natürlich ab. Die Marker stehen in der Reihenfolge ihres Bezugs: [a] nach der Aussage zum vorsätzlichen Vorgehen, [b] nach der Aussage über den Altar.'
