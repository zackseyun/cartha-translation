  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: de
  text: Doch wenn er noch einen oder zwei Tage am Leben bleibt, soll er nicht gerächt werden[a], denn er ist sein Geld[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bezogen auf den Herrn: „soll er nicht bestraft werden“. Das Hebräische spricht genauer davon, dass für den Sklaven keine Rache beziehungsweise rechtliche Vergeltung gegen den Herrn vollzogen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „denn er ist sein Geld“. Damit wird der wirtschaftliche Wert des Sklaven für seinen Herrn ausgedrückt.'
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Kennzeichnet die Einschränkung beziehungsweise Ausnahme gegenüber dem unmittelbar vorausgehenden Rechtssatz und klingt in modernem deutschem Rechtsstil natürlich.
- source_word: יוֹם אוֹ יוֹמַיִם
  choice: einen oder zwei Tage
  rationale: Gibt die hebräische Zeitangabe unmittelbar und idiomatisch wieder, ohne sie zu verallgemeinern.
- source_word: יַעֲמֹד
  choice: noch … am Leben bleibt
  rationale: Das Verb bedeutet wörtlich „steht/besteht“, bezeichnet hier aber im Zusammenhang das Weiterleben nach der Misshandlung. Die Formulierung behauptet keine vollständige Genesung.
- source_word: לֹא יֻקַּם
  choice: soll er nicht gerächt werden
  rationale: Bewahrt den gerichtlichen Vergeltungssinn der Wurzel נקם und den passiven Bezug auf das Opfer, statt allgemein von einer Bestrafung zu sprechen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die im Text genannte Begründung des Rechtssatzes ein.
- source_word: כַסְפּוֹ
  choice: sein Geld
  rationale: Entspricht der wörtlichen wirtschaftlichen Bezeichnung „sein Silber/Geld“. „Eigentum“ wäre glatter, aber stärker auslegend.
- source_word: הוּא
  choice: er ist
  rationale: Bewahrt den maskulinen Singular und damit den persönlichen Bezug auf den misshandelten Sklaven trotz der unmittelbar folgenden wirtschaftlichen Einordnung.
theological_decisions:
- issue: Gerichtliche Vergeltung im Sklavenrecht
  choice: „soll er nicht gerächt werden“
  alternative: „soll er nicht bestraft werden“
  rationale: Der hebräische Ausdruck bezeichnet spezifischer Rache beziehungsweise rechtliche Vergeltung. Die Übersetzung lässt offen, wie diese Sanktion genau vollzogen würde, und verengt sie nicht auf eine bestimmte Strafart.
- issue: Wirtschaftliche Begründung des Rechtssatzes
  choice: „denn er ist sein Geld“
  alternative: „denn er ist sein Eigentum“ oder „denn der Verlust trifft ihn selbst“
  rationale: Die schroffe wirtschaftliche Aussage des hebräischen Textes wird weder ethisch abgemildert noch erklärend umformuliert. So bleibt die Spannung zwischen der persönlichen Bezeichnung „er“ und der ökonomischen Bewertung erhalten.
translation_notes:
  register: Moderne, würdevolle und gut verständliche Rechtssprache. Die knappe, harte Ausdrucksweise des hebräischen Fallrechts bleibt erhalten; weder „gerächt“ noch „sein Geld“ wird durch eine konfessionelle oder ethisch beschönigende Deutung ersetzt.
