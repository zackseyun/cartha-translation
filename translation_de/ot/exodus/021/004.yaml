  text: אִם אֲדֹנָי/ו֙ יִתֶּן ל֣/וֹ אִשָּׁ֔ה וְ/יָלְדָה ל֥/וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָ/אִשָּׁ֣ה וִ/ילָדֶ֗י/הָ תִּהְיֶה֙ לַֽ/אדֹנֶ֔י/הָ וְ/ה֖וּא יֵצֵ֥א בְ/גַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: de
  text: Wenn sein Herr ihm eine Frau gibt und sie ihm Söhne oder Töchter gebiert, sollen die Frau und ihre Kinder ihrem Herrn gehören[a]; er selbst aber soll allein fortgehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sollen bei ihrem Herrn bleiben. Wörtlich steht eine Zugehörigkeitskonstruktion: „werden ihrem Herrn sein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Er geht ohne die Frau fort, die ihm sein Herr während seiner Dienstzeit gegeben hat, und ohne die Kinder, die sie ihm geboren hat.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Wenn
  rationale: Leitet im kasuistischen Recht einen Bedingungsfall ein.
- source_word: אֲדֹנָיו
  choice: sein Herr
  rationale: Bezeichnet hier den Haushalts- und Rechts Herrn des hebräischen Sklaven. „Herr“ ist im Deutschen die natürliche Bezeichnung für dieses Autoritätsverhältnis; der Kontext verhindert eine Verwechslung mit einem Gottestitel.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: ihm eine Frau gibt
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Die Wendung beschreibt eine vom Herrn zugewiesene eheliche Verbindung; „eine Frau gibt“ bewahrt zugleich die knappe und rechtlich geprägte Ausdrucksweise des Hebräischen.
- source_word: וְיָלְדָה לוֹ
  choice: und sie ihm … gebiert
  rationale: Gibt das Verb ילד und den indirekten Bezug auf den Mann präzise wieder und bleibt in gehobenem, verständlichem Rechtsstil.
- source_word: בָנִים אוֹ בָנוֹת
  choice: Söhne oder Töchter
  rationale: Bewahrt die ausdrückliche Nennung beider Geschlechter im hebräischen Text.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: die Frau und ihre Kinder
  rationale: „Frau“ bleibt mit der ersten Nennung von אִשָּׁה konsistent; יְלָדִים wird natürlich mit „Kinder“ wiedergegeben.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: sollen … ihrem Herrn gehören
  rationale: Die Konstruktion mit היה und ל bezeichnet hier den rechtlichen Zugehörigkeitsstatus. Die deutsche Mehrzahl richtet sich idiomatisch nach dem zusammengesetzten Subjekt.
- source_word: וְהוּא יֵצֵא
  choice: er selbst aber soll … fortgehen
  rationale: יצא bedeutet wörtlich „hinausgehen“. „Fortgehen“ ist im Deutschen natürlich und bewahrt die konkrete Aussage, ohne bereits paraphrastisch „freigelassen werden“ zu setzen; „aber“ macht den im Hebräischen durch das betonte Pronomen hervorgehobenen Gegensatz deutlich.
- source_word: בְגַפּוֹ
  choice: allein
  rationale: Das seltene Idiom bezeichnet hier das Fortgehen ohne Begleitung, im Gegensatz zum gemeinsamen Fortgehen mit einer bereits eingebrachten Frau in Vers 3.
theological_decisions:
- issue: Bezeichnung des Sklavereiverhältnisses und rechtliche Zugehörigkeit
  choice: „Herr“ und ausdrücklich „gehören“
  alternative: „Dienstherr“ beziehungsweise „bei ihrem Herrn bleiben“
  rationale: Der Vers regelt ein antikes Sklavereiverhältnis. Die Übersetzung soll die im Text ausgesagte rechtliche Verfügung und Zugehörigkeit weder beschönigen noch durch modernere Arbeitsbegriffe umdeuten.
- issue: Art des Fortgehens
  choice: „soll allein fortgehen“
  alternative: „soll allein freigelassen werden“
  rationale: Die gewählte Fassung hält sich an das konkrete Verb יצא und bewahrt die Spannung zwischen dem Fortgehen des Mannes und dem Zurückbleiben der ihm gegebenen Frau samt Kindern. Die rechtliche Freilassung ergibt sich aus dem Kontext, wird aber nicht in das Verb hineingetragen.
translation_notes:
  register: Moderner, würdiger deutscher Rechtsstil. Die Satzstruktur bleibt nahe am hebräischen Bedingungssatz, während „aber“ und „er selbst“ den sachlichen Gegensatz idiomatisch verdeutlichen. Die harte rechtliche Realität des Textes wird nicht abgeschwächt.
