  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: de
  text: Wenn er sie aber für seinen Sohn bestimmt, soll er mit ihr nach dem für Töchter geltenden Recht verfahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll er sie so behandeln, wie es für Töchter üblich ist“. Die hebräische Wendung kann sowohl das für Töchter festgelegte Recht als auch die übliche Ordnung oder Behandlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Leitet einen weiteren bedingten Rechtsfall ein und markiert zugleich den Gegensatz zum vorherigen Fall.
- source_word: לִבְנוֹ
  choice: für seinen Sohn
  rationale: Die Präposition ל bezeichnet hier die Zuordnung im Rahmen einer vorgesehenen Eheverbindung; „für seinen Sohn“ ist im Deutschen natürlich und hinreichend offen.
- source_word: יִיעָדֶנָּה
  choice: sie … bestimmt
  rationale: Das Verb יעד bezeichnet hier eine rechtlich relevante Bestimmung für eine Eheverbindung. „Bestimmt“ bewahrt den formellen Sinn, ohne ihn enger als ausdrücklich „verlobt“ wiederzugeben.
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  choice: die Rechte einer Tochter
  rationale: מִשְׁפָּט kann eine festgelegte Rechtsstellung oder den zustehenden Anspruch bezeichnen. Die idiomatische deutsche Formulierung bringt den rechtlichen Gehalt zum Ausdruck; die mögliche Bedeutung als übliche Behandlung wird in der Fußnote bewahrt.
- source_word: יַעֲשֶׂה לָּהּ
  choice: soll er ihr … gewähren
  rationale: Die wörtlich breite Wendung „für sie tun“ wird zusammen mit מִשְׁפָּט idiomatisch als Gewährung der ihr zustehenden Rechte wiedergegeben.
theological_decisions:
- issue: Art der Verpflichtung gegenüber der für den Sohn bestimmten jungen Frau
  choice: Sie erhält die Rechtsstellung und Ansprüche einer Tochter.
  alternative: Sie ist lediglich nach dem üblichen Brauch für Töchter zu behandeln.
  rationale: Der juristische Kontext stützt eine Wiedergabe als zustehendes Recht. Da מִשְׁפָּט zugleich festgelegte Sitte oder übliche Ordnung bezeichnen kann, wird diese echte Bedeutungsbreite in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die Formulierung ist verständlich, ohne die eheliche Bestimmung mit einem spezifischen späteren Rechtsbegriff zu überpräzisieren.
