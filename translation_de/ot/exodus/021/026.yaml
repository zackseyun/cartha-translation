  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: de
  text: Und wenn ein Mann seinem Sklaven oder seiner Sklavin ins Auge schlägt und es unbrauchbar macht[a], soll er ihn oder sie als Entschädigung für das Auge[b] freilassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und es zerstört« beziehungsweise »und ihn oder sie erblinden lässt«. Das hebräische Verb bezeichnet hier eine dauerhafte Schädigung des Auges.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »für sein Auge« oder »anstelle seines Auges«. Gemeint ist die Freilassung als Ausgleich für die Verletzung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Leitet einen weiteren kasuistischen Rechtssatz ein und bewahrt die verbindende Funktion von וְ.
- source_word: יַכֶּה
  choice: schlägt
  rationale: נכה bezeichnet hier einen Schlag; die einfache Form vermeidet die unbelegte Vorstellung wiederholten Schlagens.
- source_word: אִישׁ
  choice: ein Mann
  rationale: Gibt das grammatisch und lexikalisch männliche אִישׁ genau wieder.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: seinem Sklaven oder seiner Sklavin
  rationale: Im Rechtszusammenhang stehen die Wörter für Menschen in einem Besitz- und Abhängigkeitsverhältnis; »Sklave/Sklavin« bildet diese soziale Wirklichkeit deutlicher ab als »Diener/Dienerin«.
- source_word: וְשִׁחֲתָהּ
  choice: und es zerstört
  rationale: שחת bezeichnet die dauerhafte Schädigung beziehungsweise Zerstörung des Auges, ohne den Sinn unnötig auf vollständige Erblindung einzuengen.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: soll er ihn ... freilassen
  rationale: Die Verbindung bezeichnet die rechtlich gebotene Entlassung in die Freiheit; »freilassen« ist im Deutschen knapp und idiomatisch.
- source_word: תַּחַת עֵינוֹ
  choice: als Entschädigung für sein Auge
  rationale: תחת drückt hier im rechtlichen Zusammenhang Ersatz beziehungsweise Ausgleich aus.
theological_decisions:
- issue: Bezeichnung des unfreien Status
  choice: Sklave / Sklavin
  alternative: Diener / Magd
  rationale: Die Vorschrift setzt Verfügungsgewalt und Freilassung voraus. Die direkte Bezeichnung wahrt den historischen und rechtlichen Ernst des Textes, ohne ihn zu beschönigen.
- issue: Geschlecht des Rechtssubjekts
  choice: ein Mann
  alternative: jemand / eine Person
  rationale: אִישׁ ist ausdrücklich männlich; die Übersetzung bewahrt diese Form, statt sie stillschweigend zu neutralisieren.
- issue: Maskulines Objektpronomen bei zwei möglichen Betroffenen
  choice: ihn
  alternative: ihn oder sie
  rationale: Das Hebräische verwendet in יְשַׁלְּחֶנּוּ die maskuline Singularform als Rückbezug auf den Sklaven oder die Sklavin. Die deutsche Wiedergabe bewahrt die Form; der vorangehende Parallelismus macht deutlich, dass die Vorschrift für beide gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Rechtssprache. Die historische Sklavereiterminologie wird nicht beschönigt. Der kompakte Satzbau folgt dem kasuistischen Charakter des hebräischen Rechtssatzes.
