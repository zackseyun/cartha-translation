base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/011.yaml
  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: de
  text: Und wenn er ihr diese drei Dinge nicht gewährt[a], soll sie unentgeltlich freigelassen werden, ohne dass Geld gezahlt wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn er diese drei nicht für sie tut“. Gemeint sind die im vorherigen Vers genannten Verpflichtungen bezüglich Nahrung, Kleidung und ehelicher Rechte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Führt die bedingte Fortsetzung des vorherigen Rechtssatzes ein und bewahrt die verbindende Kraft von ו.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: diese drei Dinge
  rationale: Verweist auf die drei im vorherigen Vers genannten Verpflichtungen; „Dinge“ wird für natürliches Deutsch ergänzt.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: er ihr … nicht gewährt
  rationale: Das allgemeine עשה bezeichnet hier die Erfüllung der drei Verpflichtungen ihr gegenüber. „Gewährt“ ist im Deutschen natürlicher als das wörtliche „tut“, bleibt aber auslegungsbedürftig und wird in der Fußnote erläutert.
- source_word: וְיָצְאָה
  choice: soll sie … ausgehen
  rationale: Bewahrt die in den Sklavenrechtsbestimmungen verwendete Ausgangsformel und ihren rechtlichen Sollcharakter.
- source_word: חִנָּם
  choice: frei
  rationale: Bezeichnet in diesem Zusammenhang die unentgeltliche Entlassung aus dem Abhängigkeitsverhältnis.
- source_word: אֵין כָּסֶף
  choice: ohne dafür Geld zu zahlen
  rationale: Gibt idiomatisch wieder, dass für ihre Freilassung keine Geldzahlung zu leisten ist; wer genau zahlen würde, lässt der hebräische Ausdruck unausgesprochen.
