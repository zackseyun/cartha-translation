- from: Wer einen Mann entführt und ihn verkauft[a] oder bei wem er noch in der Gewalt gefunden wird[b], muss mit dem Tod bestraft werden.
  to: Wer einen Mann entführt und ihn verkauft[a] oder bei dem der Entführte in seiner Gewalt gefunden wird[b], muss mit dem Tod bestraft werden.
  rationale: Die Revision beseitigt die deutsche Bezugsunklarheit, indem sie den Entführten ausdrücklich nennt und den Täter durch „bei dem“ eindeutig markiert. Sie entfernt das nicht ausdrücklich im Hebräischen stehende „noch“. Die mögliche Lesart des hebräischen Bindeworts bleibt in der Fußnote dokumentiert, während „oder“ im Haupttext die naheliegende rechtliche Fallalternative idiomatisch wiedergibt.
