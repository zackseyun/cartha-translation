  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: de
  text: Wer einen Mann entführt und ihn verkauft[a] oder bei dem der Entführte in seiner Gewalt gefunden wird[b], muss mit dem Tod bestraft werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einen Mann stiehlt“. Gemeint ist Menschenraub beziehungsweise Entführung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und er wird in seiner Hand gefunden“. „In seiner Hand“ bedeutet hier: in seinem Besitz oder unter seiner Verfügungsgewalt. Das hebräische Bindewort kann auch fortsetzend mit „und“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב אִישׁ
  choice: einen Mann entführt
  rationale: Das Verb bedeutet wörtlich „stehlen“. Mit einem Menschen als Objekt und im Zusammenhang mit Verkauf oder Festhalten bezeichnet es Menschenraub beziehungsweise Entführung. „Entführt“ gibt den Rechtstatbestand im heutigen Deutsch klar wieder; „einen Mann“ bewahrt die maskuline Singularform אִישׁ.
- source_word: וּמְכָרוֹ
  choice: und ihn verkauft
  rationale: Das Verb מכר mit maskulinem Objektsuffix bezeichnet den Verkauf des entführten Mannes. Die direkte Formulierung entspricht der hebräischen Struktur.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: oder bei wem er noch in der Gewalt gefunden wird
  rationale: נמצא ist passivisch „wird gefunden“; בידו lautet wörtlich „in seiner Hand“ und bezeichnet idiomatisch Besitz oder Verfügungsgewalt. Die deutsche Fassung macht deutlich, dass sich „er“ auf das Opfer und „wem“ auf den Entführer bezieht. „Noch“ verdeutlicht den Gegensatz zum bereits erfolgten Verkauf, ohne den Rechtssinn zu verändern.
- source_word: מֹות יוּמָת
  choice: muss mit dem Tod bestraft werden
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die verbindliche Todesstrafe. Die passive deutsche Rechtsformulierung gibt den gerichtlichen Vollzug natürlicher wieder als eine bloße Todesvorhersage.
theological_decisions:
- issue: Umfang des Rechtstatbestands
  choice: Die Todesstrafe gilt für Menschenraub sowohl dann, wenn das Opfer verkauft wurde, als auch dann, wenn es noch in der Gewalt des Entführers gefunden wird.
  alternative: 'Das zweite וְ kann schlicht fortsetzend als „und“ verstanden werden: „und er wird in seiner Hand gefunden“.'
  rationale: 'Im kasuistischen Rechtszusammenhang liegt eine alternative Fallbeschreibung nahe: Der Täter hat das Opfer entweder bereits verkauft oder hält es noch fest. Da וְ beide Verknüpfungen zulässt, wird die echte syntaktische Alternative in einer Fußnote offengelegt.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Rechtssprache. Die idiomatische Wendung „in seiner Hand“ wird verständlich als „in der Gewalt“ wiedergegeben; die wörtliche Form und die mögliche koordinierende Lesart bleiben in der Fußnote sichtbar.
