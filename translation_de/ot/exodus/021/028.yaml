source:
  edition: WLC
  text: וְ/כִֽי יִגַּ֨ח שׁ֥וֹר אֶת אִ֛ישׁ א֥וֹ אֶת אִשָּׁ֖ה וָ/מֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַ/שּׁ֗וֹר וְ/לֹ֤א יֵאָכֵל֙ אֶת בְּשָׂר֔/וֹ וּ/בַ֥עַל הַ/שּׁ֖וֹר נָקִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: de
  text: Wenn ein Rind einen Mann oder eine Frau mit den Hörnern stößt und der Mensch stirbt, muss das Rind gesteinigt werden; sein Fleisch darf nicht gegessen werden. Doch der Besitzer des Rindes geht frei aus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist schuldlos“ oder „haftet nicht“. Das hebräische Wort נָקִי bezeichnet hier, dass der Besitzer frei von Schuld, Haftung oder Strafe ist, ohne die genaue rechtliche Reichweite näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn
  rationale: Die Wendung leitet einen kasuistischen Rechtssatz ein. Im modernen deutschen Gesetzesstil gibt „Wenn“ die Bedingung natürlich wieder; der verbindende Charakter von ו ergibt sich aus dem fortlaufenden Zusammenhang.
- source_word: יִגַּח
  choice: mit den Hörnern stößt
  rationale: Das Verb bezeichnet gezielt das Stoßen eines Horntiers. Die ausdrückliche Wendung ist im Deutschen klarer und präziser als das alleinstehende „stößt“.
- source_word: שׁוֹר
  choice: Rind
  rationale: „Rind“ bezeichnet das Tier, ohne dessen Geschlecht oder Kastrationsstatus unnötig festzulegen. „Ochse“ könnte im heutigen Deutsch enger verstanden werden, „Stier“ wäre zu spezifisch.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: einen Mann oder eine Frau
  rationale: Die Übersetzung bewahrt die ausdrückliche Nennung beider Geschlechter.
- source_word: וָמֵת
  choice: und der Mensch stirbt
  rationale: Das hebräische Verb steht im Singular und meint das zuvor genannte Opfer. „Der Mensch“ vermeidet ein männliches Pronomen, das nach „Mann oder Frau“ im Deutschen missverständlich wäre.
- source_word: סָקוֹל יִסָּקֵל
  choice: muss gesteinigt werden
  rationale: Infinitivus absolutus und finite Verbform verleihen der Anordnung Nachdruck. Das deutsche „muss“ gibt die zwingende Rechtsfolge idiomatisch wieder.
- source_word: וְלֹא יֵאָכֵל אֶת־בְּשָׂרוֹ
  choice: sein Fleisch darf nicht gegessen werden
  rationale: Die passive Form und das Verbot werden eng am Hebräischen und zugleich in natürlichem Deutsch wiedergegeben.
- source_word: וּבַעַל הַשּׁוֹר
  choice: Doch der Besitzer des Rindes
  rationale: בעל bezeichnet hier den rechtlichen Besitzer. „Doch“ macht den sachlichen Gegensatz zwischen dem Schicksal des Tieres und dem des Besitzers deutlich.
- source_word: נָקִי
  choice: geht frei aus
  rationale: Die Formulierung gibt den rechtlichen Sinn von Freiheit von Strafe oder Haftung verständlich wieder, ohne den Ausdruck ausschließlich als moralische Unschuld zu deuten.
theological_decisions:
- issue: Rechtsstellung des Besitzers im Schlusssatz
  choice: Der Besitzer geht in diesem Grundfall frei aus.
  alternative: 'Der Besitzer ist unschuldig; oder: Der Besitzer haftet nicht.'
  rationale: נָקִי lässt offen, ob vor allem Straflosigkeit, fehlende Haftung oder Unschuld bezeichnet wird. Der folgende Kontext behandelt erst anschließend den Fall vorhersehbarer Gefahr. Die Übersetzung wahrt deshalb die Breite der Aussage, statt sie auf moralische Unschuld oder eine bestimmte Haftungsart einzuengen.
translation_notes:
  register: Moderner, würdiger Rechtssatz in allgemein verständlichem Standarddeutsch. „Rind“ vermeidet eine nicht im Hebräischen festgelegte Geschlechtsangabe; „mit den Hörnern stößt“ macht die konkrete Verletzungsweise deutlich. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Rechtsformel.
