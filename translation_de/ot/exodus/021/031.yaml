id: EXO.21.31
reference: Exodus 21:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוֹ בֵ֥ן יִגָּ֖ח אוֹ בַ֣ת יִגָּ֑ח כַּ/מִּשְׁפָּ֥ט הַ/זֶּ֖ה יֵעָ֥שֶׂה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/031.yaml
  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: de
  text: Wenn der Stier einen Sohn oder eine Tochter mit den Hörnern stößt, soll mit seinem Besitzer nach derselben Rechtsbestimmung verfahren werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Die im vorherigen Vers genannte Rechtsfolge gilt ebenso, wenn der Stier einen Sohn oder eine Tochter stößt.'
    reason: cross_reference
  - marker: b
    text: Für „Rechtsbestimmung“ sind auch „Rechtsentscheid“ oder „Vorschrift“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Wenn
  rationale: Im kasuistischen Rechtszusammenhang führt אוֹ einen weiteren möglichen Fall ein. Deutsch gibt diesen Anschluss natürlich mit „Wenn“ wieder.
- source_word: בֵן ... בַת
  choice: einen Sohn oder eine Tochter
  rationale: Die geschlechtsspezifische Paarung des Hebräischen bleibt erhalten. „Sohn“ und „Tochter“ sind genauer als die allgemeineren Wörter „Junge“ und „Mädchen“.
- source_word: יִגָּח
  choice: mit den Hörnern stößt
  rationale: Das Verb נגח bezeichnet das Stoßen beziehungsweise Verwunden mit den Hörnern. Die ausgeschriebene Wendung ist im heutigen Deutsch klarer als das seltene „aufspießen“ und benennt die Art des Stoßes präzise.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: nach derselben Rechtsbestimmung
  rationale: מִשְׁפָּט bezeichnet hier die im vorherigen Vers festgelegte rechtliche Regelung. „Derselben“ macht den Rückverweis idiomatisch deutlich, ohne den Inhalt der Strafe neu auszulegen.
- source_word: יֵעָשֶׂה לּוֹ
  choice: soll mit seinem Besitzer ... verfahren werden
  rationale: Die passive Rechtsformulierung wird bewahrt. Der Besitzer ist der im vorherigen Vers genannte männliche Bezug von לּוֹ; seine ausdrückliche Nennung verhindert im Deutschen eine mögliche falsche Zuordnung zu Sohn oder Tochter.
theological_decisions:
- issue: Anwendung der zuvor genannten Rechtsfolge auf Sohn oder Tochter
  choice: Der Vers verweist auf dieselbe Rechtsbestimmung wie der vorherige Fall.
  alternative: Die konkrete Strafe im Vers erneut ausschreiben.
  rationale: Der hebräische Text nennt die Rechtsfolge nicht erneut, sondern verweist mit כַּמִּשְׁפָּט הַזֶּה zurück. Die Übersetzung sollte diesen Rückverweis und damit die knappe juristische Form wahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper juristischer Satzform. „Der Stier“ nimmt das im Kontext vorausgesetzte Tier ausdrücklich auf; „mit den Hörnern stößt“ verdeutlicht die genaue Bedeutung des hebräischen Verbs.
