  text: burn for burn[a], wound for wound, bruise for bruise.
translation:
  language: de
  text: Verbrennung für Verbrennung, Wunde für Wunde, Strieme für Strieme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bluterguss für Bluterguss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: Verbrennung
  rationale: Das Substantiv bezeichnet eine Verbrennung oder Brandverletzung. »Verbrennung« ist im heutigen Deutsch klar und wahrt die knappe Rechtsformel.
- source_word: תַּחַת
  choice: für
  rationale: In diesem Rechtszusammenhang drückt תַּחַת Entsprechung beziehungsweise Ausgleich aus. »Für« gibt die knappe, dreigliedrige Formel natürlich wieder.
- source_word: פֶּצַע
  choice: Wunde
  rationale: Das Wort bezeichnet allgemein eine körperliche Wunde. »Wunde« bleibt konkret, ohne die Art der Verletzung unnötig einzuengen.
- source_word: חַבּוּרָה
  choice: Strieme
  rationale: Das Wort bezeichnet die sichtbare Verletzung oder Spur, die ein Schlag hinterlässt, etwa eine Strieme, Schwellung oder einen Bluterguss. »Strieme« bewahrt den Bezug zu einem Schlag und passt zum konkreten Verletzungsvokabular.
theological_decisions: []
