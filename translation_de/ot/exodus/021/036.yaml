  - severity: low
    issue: „Zum Stoßen neigte“ schwächt die charakterisierende Aussage von נַגָּח etwas ab.
    rationale: Das Wort beschreibt ein als stoßgefährlich bzw. stößig bekanntes Tier, nicht bloß eine gelegentliche Neigung.
