  to: Oder wenn bekannt war, dass das Rind schon seit Längerem[a] stößig war und sein Besitzer es nicht bewachte, muss er als Ersatz ein Rind anstelle des anderen geben; das tote Tier fällt ihm zu.
  rationale: Die Revision ersetzt die zu enge Tierbezeichnung „Stier“ durch „Rind“ und präzisiert die dauerhafte Gefährlichkeit mit „stößig“. Die Ersatzformel bleibt inhaltlich äquivalent, wird aber im modernen Deutschen klarer formuliert. Die Fußnote erhält die wörtliche Zeitformel und erklärt sie zurückhaltend.
