  source_fidelity: 'Der Entwurf gibt den alternativen Rechtsfall, die Kenntnis von der Gefährlichkeit, das Versäumnis des Besitzers, die Ersatzpflicht und den Übergang des toten Tieres zutreffend wieder. „Stier“ ist für שׁוֹר jedoch zu eng: Das hebräische Wort bezeichnet hier ein Rind und legt weder die zoologische Kategorie eines unkastrierten männlichen Tieres noch dessen Geschlecht eindeutig fest.'
  naturalness: Die Rechtssprache ist insgesamt verständlich. „Zum Stoßen neigte“ ist weniger präzise als das im Deutschen für Tiere gebräuchliche „stößig“. Die Ersatzformel lässt sich zudem mit „anstelle des anderen“ natürlicher ausdrücken.
  terminology: „Rind“ bewahrt die Breite von שׁוֹר und bleibt im rechtlichen Kontext idiomatisch. „Stößig“ gibt נַגָּח als dauerhafte Neigung zum Stoßen bzw. Goren treffend wieder. Die Fußnote bewahrt das hebräische Zeitidiom, ohne dessen Aussage auf ein bestimmtes Ausmaß der Vorzeit festzulegen.
