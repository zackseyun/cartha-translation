source:
  edition: WLC
  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: de
  text: Oder wenn bekannt war, dass das Rind schon seit Längerem[a] stößig war und sein Besitzer es nicht bewachte, muss er als Ersatz ein Rind anstelle des anderen geben; das tote Tier fällt ihm zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „seit gestern und vorgestern“; eine hebräische Wendung für ein bereits früher erkennbares Verhalten.'
    reason: cultural_note
lexical_decisions:
- source_word: אוֹ
  choice: Oder wenn
  rationale: אוֹ führt den alternativen Rechtsfall ein; im Deutschen macht „wenn“ den konditionalen Zusammenhang natürlich deutlich.
- source_word: נוֹדַע כִּי
  choice: bekannt war, dass
  rationale: Die unpersönlich-passive Bedeutung von נוֹדַע und die Inhaltseinleitung durch כִּי werden knapp und quellennah wiedergegeben.
- source_word: שׁוֹר
  choice: Stier
  rationale: שׁוֹר bezeichnet hier ein einzelnes männliches Rind; „Stier“ ist im modernen Deutschen verständlicher und präziser als das heute missverständliche „Ochse“.
- source_word: נַגָּח
  choice: zum Stoßen neigte
  rationale: Das Adjektiv bezeichnet eine bereits erkennbare, anhaltende Neigung des Tieres, mit den Hörnern anzugreifen.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: schon seit Längerem
  rationale: Die wörtliche Wendung „seit gestern und vorgestern“ ist ein hebräisches Idiom für ein schon früher festgestelltes Verhalten; die Fußnote bewahrt die Ausgangsform.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: ihn nicht bewachte
  rationale: שׁמר bezeichnet das Beaufsichtigen beziehungsweise Sichern des gefährlichen Tieres. „Bewachte“ hält die Grundbedeutung fest, ohne eine bestimmte Sicherungsart hinzuzufügen.
- source_word: בְּעָלָיו
  choice: sein Besitzer
  rationale: Gemeint ist der rechtlich verantwortliche Eigentümer des Tieres.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: muss dieser als vollständigen Ersatz … leisten
  rationale: Infinitivus absolutus plus finite Verbform verstärkt die verbindliche Ersatzpflicht. „Vollständigen Ersatz leisten“ gibt diese emphatische Rechtsformel natürlich wieder.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: einen Stier für den anderen
  rationale: 'תַּחַת bezeichnet hier Ersatz beziehungsweise Austausch: Ein lebendes Tier ist für das getötete zu leisten.'
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: das tote Tier fällt ihm zu
  rationale: Die Formulierung wahrt den Eigentumsübergang und lässt den Bezug des Pronomens entsprechend der hebräischen Satzfolge beim ersatzpflichtigen Besitzer.
theological_decisions:
- issue: Bezug von לּוֹ („ihm“)
  choice: Bezug auf den Besitzer des stoßenden Stiers
  alternative: Bezug auf den Besitzer des getöteten Stiers
  rationale: 'Der nächstliegende grammatische Bezug ist das Subjekt der Ersatzpflicht: Wer den Ersatzstier leistet, erhält das tote Tier. Die Formulierung folgt diesem syntaktischen Bezug, ohne weitergehende rechtstheologische Folgerungen einzutragen.'
translation_notes:
  register: Moderne, würdige Rechtssprache. „Stier“ vermeidet die im heutigen Deutschen fachlich falsche Assoziation eines kastrierten „Ochsen“. Das hebräische Zeitidiom wird verständlich im Text und wörtlich in der Fußnote wiedergegeben.
