revisions:
- from: 'Und nun: Wenn ich Gunst in deinen Augen gefunden habe, lass mich doch deine Wege erkennen, damit ich dich erkenne und weiterhin Gunst in deinen Augen finde. Bedenke auch, dass dieses Volk deine Nation ist.[a]'
  to: 'Und nun: Wenn ich Gunst in deinen Augen gefunden habe, mach mir doch deine Wege bekannt, damit ich dich erkenne, damit ich Gunst in deinen Augen finde. Bedenke auch, dass diese Nation dein Volk ist.'
  rationale: Die Revision bewahrt die hebräischen Pluralform »Wege«, die Wiederholung von »Gunst in deinen Augen« und den idiomatischen Sinn von וּרְאֵה. Sie korrigiert die vertauschte Aussage im Schlusssatz, entfernt die nicht ausdrücklich markierte Ergänzung »weiterhin« und kennzeichnet beide Zweckbeziehungen. Die nicht belastbare Fußnote entfällt.
