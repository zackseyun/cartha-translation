base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: de
  text: 'Und nun: Wenn ich Gunst in deinen Augen gefunden habe, mach mir doch deine Wege bekannt, damit ich dich erkenne, damit ich Gunst in deinen Augen finde. Bedenke auch, dass diese Nation dein Volk ist.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl den Anschluss an das Vorhergehende als auch den Übergang zur Bitte knapp und natürlich wieder.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: ich Gunst in deinen Augen gefunden habe
  rationale: Bewahrt das verständliche hebräische Bild und vermeidet, »Gnade« hier vorschnell als theologischen Fachbegriff zu lesen.
- source_word: הוֹדִעֵנִי נָא אֶת־דְּרָכֶךָ
  choice: lass mich doch deine Wege erkennen
  rationale: Das Hifil von ידע bezeichnet ein Bekanntmachen; »doch« gibt die höflich-bittende Partikel נָא wieder. דְּרָכֶךָ ist morphologisch Plural.
- source_word: וְאֵדָעֲךָ
  choice: damit ich dich erkenne
  rationale: Gibt die wahrscheinliche Zweckbeziehung wieder und wahrt den persönlichen, relationalen Sinn von ידע.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: und weiterhin Gunst in deinen Augen finde
  rationale: לְמַעַן drückt einen Zweck aus. »Weiterhin« verdeutlicht den kontextuell naheliegenden Gedanken, dass die bereits erfahrene Gunst fortbestehen möge, ohne die Wiederholung des hebräischen Ausdrucks aufzugeben.
- source_word: וּרְאֵה
  choice: Bedenke auch
  rationale: ראה ist hier idiomatisch als Aufforderung zu verstehen, etwas zu beachten oder zu berücksichtigen, nicht bloß körperlich zu sehen.
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: dass dieses Volk deine Nation ist
  rationale: Ordnet die Prädikatsstruktur des Hebräischen so zu, dass עַמְּךָ als »dein Volk« und הַגּוֹי הַזֶּה als »diese Nation« unterschieden bleiben; im Deutschen klingt die gewählte Wortfolge jedoch erklärungsbedürftig und wird daher mit einer Fußnote versehen.
theological_decisions:
- issue: Zuordnung von עַמְּךָ und הַגּוֹי הַזֶּה im Schlusssatz
  choice: dass dieses Volk deine Nation ist
  alternative: dass diese Nation dein Volk ist
  rationale: Die knappe Nominalkonstruktion erlaubt im Deutschen unterschiedliche Zuordnungen. Inhaltlich ist im Kontext vor allem Moses’ Berufung darauf klar, dass die betreffende Gemeinschaft Gott zugehört. Die Alternative ist sprachlich natürlicher und wohl kontextuell vorzuziehen; die Mehrdeutigkeit wird offengelegt.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit erkennbarer Nähe zur hebräischen Ausdrucksweise. Die Wiederholung von »Gunst in deinen Augen« bleibt erhalten. Hinweis zur Schlussklausel: Für eine Veröffentlichung wäre »dass diese Nation dein Volk ist« im Haupttext die natürlichere und kontextuell stärkere Fassung; die vorliegende Form wurde gewählt, um die formale Zuordnung sichtbar zu halten.'
