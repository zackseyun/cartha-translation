base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: de
  text: Mose nahm gewöhnlich das Zelt[a] und schlug es für sich außerhalb des Lagers auf, weit vom Lager entfernt. Er nannte es »Zelt der Begegnung«. Jeder, der Jahwe suchte, ging zum Zelt der Begegnung hinaus, das außerhalb des Lagers stand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Zelt«. Der hebräische Text nennt es nicht ausdrücklich Moses eigenes Zelt. Gemeint sein kann sein Zelt oder ein besonderes Zelt, das er zu diesem Zweck benutzte.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräischen Verbformen beschreiben hier wahrscheinlich ein gewohnheitsmäßiges Geschehen; möglich ist auch die schlichtere Wiedergabe: »Mose nahm ... und jeder, der Jahwe suchte, ging ... hinaus.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח ... יֵצֵא
  choice: nahm immer wieder ... ging ... hinaus
  rationale: Die Yiqtol-Formen haben im erzählenden Zusammenhang wahrscheinlich gewohnheitsmäßige beziehungsweise wiederholte Bedeutung. »Immer wieder« macht dies bei der ersten Form deutlich; bei der zweiten ergibt sich der entsprechende Sinn aus »Jeder, der ...« und dem Zusammenhang.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: Der hebräische Text hat den bestimmten Artikel, bezeichnet es aber nicht ausdrücklich als Moses eigenes Zelt. Die Übersetzung lässt seine genaue Identität daher offen.
- source_word: וְנָטָה לוֹ
  choice: und schlug es für sich ... auf
  rationale: נטה bezeichnet in Verbindung mit einem Zelt dessen Aufschlagen. Das Pronomen לוֹ wird mit »für sich« wiedergegeben und kann Moses Gebrauch oder Zweck anzeigen.
- source_word: מִחוּץ לַמַּחֲנֶה ... הַרְחֵק מִן הַמַּחֲנֶה
  choice: außerhalb des Lagers ... weit vom Lager entfernt
  rationale: Die Formulierung bewahrt sowohl die Ortsangabe als auch die nachdrückliche Aussage über die Entfernung.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: מוֹעֵד kann einen festgesetzten Zeitpunkt oder Ort der Begegnung bezeichnen. »Zelt der Begegnung« ist im Deutschen verständlich und lässt diese sachliche Verbindung erkennen.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: Jeder, der Jahwe suchte
  rationale: בקש kann hier sowohl das Suchen nach Gott als auch das Befragen Gottes umfassen. Das allgemeinere »suchte« bewahrt diese Bedeutungsweite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben statt durch einen Titel ersetzt zu werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Namen wieder, während »der HERR« ihn durch einen traditionellen Titel ersetzen würde.
- issue: Identität des Zeltes
  choice: das Zelt, ohne nähere Festlegung
  alternative: Moses eigenes Zelt
  rationale: Der Text sagt הָאֹהֶל, »das Zelt«, aber nicht ausdrücklich »sein Zelt«. Daher wird keine bestimmte Deutung in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Handlung wird natürlich mit »immer wieder« ausgedrückt. Die genaue Identität des Zeltes und die Bedeutungsweite von »Jahwe suchen« bleiben offen; der Gottesname erscheint als »Jahwe«.
