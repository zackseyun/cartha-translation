  text: וַ/יֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כָּל טוּבִ/י֙ עַל פָּנֶ֔י/ךָ וְ/קָרָ֧אתִֽי בְ/שֵׁ֛ם יְהוָ֖ה לְ/פָנֶ֑י/ךָ וְ/חַנֹּתִי֙ אֶת אֲשֶׁ֣ר אָחֹ֔ן וְ/רִחַמְתִּ֖י אֶת אֲשֶׁ֥ר אֲרַחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: de
  text: 'Da sagte er: „Ich selbst werde all meine Güte an dir vorüberziehen lassen und den Namen Jahwes vor dir ausrufen. Ich werde gnädig sein, wem ich gnädig sein werde, und ich werde mich erbarmen, über wen ich mich erbarmen werde.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Mitgefühl haben mit wem ich Mitgefühl haben werde.“'
    reason: Lexikalische Alternative zu רחם, das sowohl Erbarmen als auch Mitgefühl ausdrücken kann.
lexical_decisions:
- source_word: אֲנִי אַעֲבִיר
  choice: Ich selbst werde … vorüberziehen lassen
  rationale: Das ausdrücklich gesetzte אֲנִי betont das Subjekt; „ich selbst“ gibt diese Hervorhebung wieder. Die Hifil-Form von עבר ist kausativ und wird daher mit „vorüberziehen lassen“ übersetzt.
- source_word: כָּל טוּבִי
  choice: all meine Güte
  rationale: טוּב bezeichnet hier Gottes Güte in ihrer umfassenden, wohltätigen Bedeutung; „Güte“ wahrt den Bezug zu Gottes Selbstoffenbarung, ohne ihn auf Schönheit oder Gaben einzuengen.
- source_word: עַל־פָּנֶיךָ
  choice: an dir
  rationale: Die räumliche Wendung wird im Zusammenhang mit dem Vorüberziehen idiomatisch als „an dir“ wiedergegeben; eine wörtliche Übersetzung mit „über deinem Gesicht“ wäre im Deutschen irreführend.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: und den Namen Jahwes vor dir ausrufen
  rationale: קרא בשם bezeichnet hier die öffentliche Bekanntgabe beziehungsweise Verkündigung des göttlichen Namens, nicht das Anrufen Gottes. „Ausrufen“ passt zur folgenden Selbstoffenbarung in Exodus 34.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Ich werde gnädig sein, wem ich gnädig sein werde
  rationale: Die Wiederholung desselben hebräischen Wortstamms wird bewusst beibehalten. Die etwas feierliche Formulierung bewahrt sowohl den Nachdruck als auch die Offenheit der Aussage.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: und mich erbarmen, über wen ich mich erbarmen werde
  rationale: „Sich erbarmen“ gibt רחם treffend wieder und erhält die betonte Wiederholung des hebräischen Verbs. Die alternative Nuance „Mitgefühl haben“ wird in einer Fußnote genannt.
theological_decisions:
- issue: Gottes Freiheit, Gnade und Erbarmen zu erweisen
  choice: Die wiederholten Ich-Aussagen werden ohne Abschwächung oder dogmatische Ausdeutung beibehalten.
  alternative: Die Aussage als allgemeines Prinzip göttlicher Güte zu paraphrasieren oder sie mit einer späteren deterministischen Lehrformel zu erklären.
  rationale: Der hebräische Text betont durch die Wiederholung Gottes freie Selbstbestimmung und lässt zugleich die theologische Spannung stehen. Die Übersetzung entscheidet spätere Lehrdebatten nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholungsfiguren des Hebräischen bleiben trotz ihrer leicht feierlichen Wirkung erhalten. Der Fußnotenmarker steht unmittelbar bei der Formulierung, auf die sich die lexikalische Alternative bezieht.
