  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: de
  text: 'Da sagte der HERR: »Sieh, bei mir ist ein Platz, und du sollst auf dem Felsen stehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt die fortschreitende Erzählung natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibelkonvention für den Gottesnamen JHWH.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der hebräischen Partikel in natürlichem Deutsch.
- source_word: מָקוֹם אִתִּי
  choice: hier bei mir ist ein Platz
  rationale: אִתִּי bedeutet wörtlich »bei mir«; »hier« macht die deiktische Aussage im Deutschen idiomatisch, ohne die räumliche Nähe aufzulösen.
- source_word: וְנִצַּבְתָּ
  choice: Stell dich
  rationale: Die Verbform bezeichnet hier das Einnehmen einer festen stehenden Position und hat im Zusammenhang auffordernden beziehungsweise anweisenden Sinn.
- source_word: עַל הַצּוּר
  choice: auf den Felsen
  rationale: Bewahrt die bestimmte, konkrete Ortsangabe des Hebräischen.
theological_decisions:
- issue: Räumliche Rede von Gottes Gegenwart
  choice: »bei mir« bleibt erhalten
  alternative: »in meiner Nähe« oder eine abstraktere Umschreibung
  rationale: Die konkrete räumliche Ausdrucksweise des Textes soll nicht vorschnell metaphorisiert oder systematisch erklärt werden.
- issue: Modalität von וְנִצַּבְתָּ
  choice: 'Imperativisch: »Stell dich«'
  alternative: 'Futurisch: »du wirst dich stellen/stehen«'
  rationale: Im unmittelbaren Redekontext wirkt die Form als göttliche Anweisung; die mögliche formale Zukunftsnuance wird nicht durch eine zusätzliche Fußnote belastet, da der Sinn kontextuell klar ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Rede. Die traditionelle Wiedergabe »der HERR« steht für den Gottesnamen JHWH. Keine Fußnoten erforderlich.
