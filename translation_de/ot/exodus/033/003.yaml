  rationale: Die Revision ersetzt die modal abgeschwächte Wiedergabe von פֶּן durch eine deutsche Finalverneinung, die die befürchtete Folge wahrt, und formuliert בְּקִרְבְּךָ idiomatischer als „in deiner Mitte“. Die Aussage bleibt bewusst als göttliche Begründung und Warnung stehen, ohne deren theologische Spannung weiter auszudeuten.
