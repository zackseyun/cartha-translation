base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: de
  text: in ein Land, in dem Milch und Honig fließen. Denn ich werde nicht in deiner Mitte hinaufziehen[a], weil du ein halsstarriges Volk bist, damit ich dich nicht unterwegs vernichte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter euch“ oder „mit euch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vertilge“ oder „aufreibe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: in ein Land
  rationale: Bei einem Bewegungsverb gibt אֶל das Ziel an; im Deutschen ist „in ein Land“ natürlich und bewahrt die unbestimmte Form, obwohl das verheißene Land aus dem Kontext bekannt ist.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: in dem Milch und Honig fließen
  rationale: Die geläufige deutsche Wendung bewahrt das Bild überreicher Fruchtbarkeit.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Denn ich werde nicht … hinaufziehen
  rationale: כִּי leitet hier eine Begründung ein. „Hinaufziehen“ bewahrt sowohl die Bewegungsrichtung von עלה als auch den gemeinschaftlichen Reisecharakter.
- source_word: בְּקִרְבְּךָ
  choice: mitten unter dir
  rationale: Die Form bezeichnet Gottes Gegenwart innerhalb des Volkes; das singularische „dir“ bewahrt die kollektive Anrede Israels.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: halsstarriges Volk
  rationale: „Halsstarrig“ ist verständliches, würdiges Deutsch und erhält das hebräische Bild hartnäckigen Widerstands.
- source_word: פֶּן אֲכֶלְךָ
  choice: sonst könnte ich dich … vertilgen
  rationale: פֶּן bezeichnet eine zu befürchtende Folge. „Könnte“ erhält den warnenden Möglichkeitscharakter, während „vertilgen“ die Schwere von כלה im Piel wiedergibt.
- source_word: בַּדָּרֶךְ
  choice: unterwegs
  rationale: Die knappe idiomatische Wiedergabe bezeichnet den Verlauf der Reise.
theological_decisions:
- issue: Aussage über Gottes Gegenwart
  choice: ich werde nicht mitten unter dir hinaufziehen
  alternative: ich werde nicht unter euch / mit dir hinaufziehen
  rationale: '„Mitten unter dir“ bewahrt die räumliche und bundestheologische Spannung: Gottes heilige Gegenwart innerhalb des widerspenstigen Volkes wäre für dieses gefährlich.'
- issue: Schwere des angedrohten Gerichts
  choice: sonst könnte ich dich unterwegs vertilgen
  alternative: damit ich dich unterwegs nicht vernichte / aufreibe
  rationale: Die Formulierung lässt die Warnung als mögliche Folge stehen und schwächt das vollständige Zu-Ende-Bringen, das כלה ausdrücken kann, nicht ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive singularische Anrede wird entsprechend dem Hebräischen beibehalten. „Halsstarrig“ und „vertilgen“ sind leicht gehoben, aber weiterhin allgemein verständlich und erhalten Bildkraft sowie Ernst des Ausgangstextes.
