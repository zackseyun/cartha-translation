source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִ/רְאֹ֣ת אֶת פָּנָ֑/י כִּ֛י לֹֽא יִרְאַ֥/נִי הָ/אָדָ֖ם וָ/חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: de
  text: 'Doch er sagte: „Du kannst mein Angesicht[a] nicht sehen; denn kein Mensch kann mich sehen und am Leben bleiben.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Gegenwart“. Hebräisch wörtlich: „mein Angesicht“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist jeder Mensch; die Aussage gilt der Menschheit allgemein.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch er sagte
  rationale: Das Waw führt die Erzählung fort; „doch“ gibt zugleich den Gegensatz zu Moses Bitte im vorhergehenden Vers natürlich wieder.
- source_word: לֹא תוּכַל
  choice: du kannst … nicht
  rationale: יכל bezeichnet hier Unvermögen, nicht ein Verbot.
- source_word: לִרְאֹת
  choice: sehen
  rationale: ראה bezeichnet hier unmittelbar das Sehen und wird klar und modern wiedergegeben.
- source_word: אֶת־פָּנַי
  choice: mein Angesicht
  rationale: פנים bedeutet wörtlich „Gesicht/Angesicht“. „Angesicht“ bewahrt das konkrete Bild in einer würdigen, im Gottesbezug geläufigen Form, ohne es zu „Gegenwart“ aufzulösen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der vorausgehenden Aussage ein.
- source_word: לֹא יִרְאַנִי הָאָדָם
  choice: kein Mensch kann mich sehen
  rationale: Der generische Singular bezeichnet jeden Menschen beziehungsweise die Menschheit allgemein. Die deutsche Formulierung gibt den allgemeinen Grundsatz idiomatisch wieder.
- source_word: וָחָי
  choice: und am Leben bleiben
  rationale: Die Form bezeichnet hier die Folge beziehungsweise das Weiterleben nach dem Sehen; „am Leben bleiben“ macht diesen Sinn im Deutschen deutlich.
theological_decisions:
- issue: Anthropomorphe Redeweise in „mein Angesicht“
  choice: Das konkrete Bild „mein Angesicht“ bleibt im Haupttext erhalten.
  alternative: meine Gegenwart
  rationale: Der hebräische Text spricht konkret vom Angesicht Gottes. Die Übersetzung soll diese Spannung nicht durch eine abstrakte Deutung beseitigen; die mögliche Bedeutung „Gegenwart“ wird in der Fußnote genannt.
- issue: Allgemeine Bedeutung von הָאָדָם
  choice: „kein Mensch“
  alternative: „der Mensch“ / „ein Mensch“ / „die Menschheit“
  rationale: Der bestimmte Singular hat hier generische Bedeutung. „Kein Mensch“ ist im Deutschen natürlich und stellt klar, dass die Aussage für jeden Menschen gilt, ohne sie geschlechtsspezifisch einzuengen.
- issue: Modalität von לֹא יִרְאַנִי … וָחָי
  choice: „kann mich sehen und am Leben bleiben“
  alternative: „wird mich sehen und leben“
  rationale: Im Zusammenhang formuliert der Satz die Unvereinbarkeit des unmittelbaren Sehens Gottes mit dem Weiterleben. Die gewählte Form wahrt den allgemeinen Grundsatz und klingt im modernen Deutschen natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ ist bewusst etwas gehobener als „Gesicht“, bewahrt aber die biblische Bildsprache verständlich. Beide Fußnotenmarker stehen im Haupttext.
