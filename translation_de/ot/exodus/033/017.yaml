base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Auch das[a], was du gesagt hast, werde ich tun; denn du hast Gunst in meinen Augen gefunden[b], und ich kenne dich mit Namen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „diese Sache“, „diese Angelegenheit“ oder „dieses Wort“; das hebräische Wort kann eine Sache, eine Angelegenheit oder ein Wort bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Gunst in meinen Augen gefunden“; eine Redewendung für wohlwollende Annahme.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: גַּם
  choice: auch
  rationale: Die Partikel knüpft diese Zusage ergänzend an die vorausgehende Bitte des Mose an.
- source_word: הַדָּבָר הַזֶּה
  choice: diese Sache
  rationale: דָּבָר kann Wort, Angelegenheit oder Sache bedeuten. Hier bezeichnet es die von Mose vorgebrachte Bitte; „Sache“ bewahrt die Bedeutungsbreite.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: von der du gesprochen hast
  rationale: Die Formulierung erhält den Bezug auf Moses Äußerung und klingt zusammen mit „Sache“ natürlich.
- source_word: אֶעֱשֶׂה
  choice: werde ich tun
  rationale: Die schlichte Zukunftswiedergabe entspricht dem gewöhnlichen Sinn von עשה und Gottes Zusage, entsprechend zu handeln.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: du hast Gunst in meinen Augen gefunden
  rationale: Die Wiedergabe bewahrt sowohl חֵן als „Gunst“ als auch das anschauliche hebräische Idiom „in meinen Augen“.
- source_word: וָאֵדָעֲךָ
  choice: und ich kenne dich
  rationale: ידע bezeichnet hier persönliche Kenntnis und Anerkennung; das deutsche Präsens gibt diese fortdauernde Beziehung angemessen wieder.
- source_word: בְּשֵׁם
  choice: mit Namen
  rationale: Die feste deutsche Wendung bringt die konkrete, persönliche Kenntnis zum Ausdruck, ohne sie auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt ihn sichtbar und vermeidet die Ersetzung durch einen Hoheitstitel.
- issue: Bedeutung von Gottes Kenntnis des Mose
  choice: „ich kenne dich mit Namen“
  alternative: „ich habe dich erwählt“
  rationale: Die Übersetzung bleibt bei der ausdrücklichen Aussage persönlicher Kenntnis und Anerkennung, ohne eine weitergehende theologische Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Hebräischen, wurde aber für flüssiges Deutsch leicht gegliedert. Das traditionelle Bild „in meinen Augen“ und die persönliche Wendung „mit Namen“ bleiben erhalten.
