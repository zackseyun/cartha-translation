  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: de
  text: Und sooft Mose in das Zelt hineinging, kam die Wolkensäule herab und stand am Eingang des Zeltes, und er redete mit Mose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausdrücklich: „und der HERR redete mit Mose“. Im Hebräischen bleibt das Subjekt dieses Satzteils unausgesprochen; der Zusammenhang weist jedoch auf den HERRN als Sprecher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: Und sooft … hineinging
  rationale: Die Verbindung aus וְהָיָה und dem mit כְּ gebildeten Zeitausdruck beschreibt hier einen wiederkehrenden Vorgang. „Sooft“ gibt diesen iterativen Sinn im Deutschen natürlich wieder.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: in das Zelt / des Zeltes
  rationale: Der hebräische Text nennt hier schlicht „das Zelt“, nicht ausdrücklich das „Zelt der Begegnung“. Die Kleinschreibung vermeidet zusätzliche interpretative Gewichtung.
- source_word: יֵרֵד
  choice: kam … herab
  rationale: Das Yiqtol steht im Rahmen der geschilderten Gewohnheit für eine wiederholte Handlung. Das deutsche Präteritum ist zusammen mit „sooft“ idiomatisch und eindeutig iterativ.
- source_word: עַמּוּד הֶעָנָן
  choice: die Wolkensäule
  rationale: „Wolkensäule“ ist die natürliche und bildgetreue deutsche Wiedergabe der hebräischen Konstruktverbindung.
- source_word: וְעָמַד
  choice: und blieb … stehen
  rationale: Das Verb bezeichnet das Einnehmen beziehungsweise Beibehalten eines Standorts. „Blieb … stehen“ passt im Deutschen natürlich zur herabkommenden Wolkensäule, ohne den wiederholten Charakter zu verlieren.
- source_word: פֶּתַח הָאֹהֶל
  choice: am Eingang des Zeltes
  rationale: „Eingang“ gibt פֶּתַח in diesem räumlichen Zusammenhang klar und in modernem Standarddeutsch wieder.
- source_word: וְדִבֶּר
  choice: und er redete
  rationale: Das Verb ist maskulin Singular, doch sein Subjekt wird im hebräischen Satz nicht ausdrücklich genannt. Das Pronomen bewahrt diese Form; der Kontext weist auf den HERRN als Sprecher.
- source_word: עִם מֹשֶׁה
  choice: mit Mose
  rationale: „Mit“ entspricht עִם und bewahrt den wechselseitig-persönlichen Klang der Formulierung besser als „zu Mose“.
theological_decisions:
- issue: Unausgesprochenes Subjekt von וְדִבֶּר („und er redete“)
  choice: Das maskuline Singularsubjekt bleibt als „er“ unausgesprochen beziehungsweise nur pronominal bezeichnet.
  alternative: „Und der HERR redete mit Mose.“
  rationale: Aus dem Zusammenhang ist der HERR als Sprecher zu verstehen; der hebräische Satz nennt ihn an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese sprachliche Offenheit, statt den Namen ergänzend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die iterative Erzählweise wird mit „sooft“ und Präteritum natürlich wiedergegeben. „Mose“ folgt der geläufigen deutschen Bibelnamensform. Der Fußnotenmarker steht unmittelbar nach dem Satzteil, auf den sich die Erläuterung zum unausgesprochenen Subjekt bezieht.
