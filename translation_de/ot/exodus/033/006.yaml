  text: וַ/יִּֽתְנַצְּל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת עֶדְיָ֖/ם מֵ/הַ֥ר חוֹרֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: de
  text: Da legten die Israeliten vom Berg Horeb an ihren Schmuck ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Da legten die Israeliten am Berg Horeb ihren Schmuck ab.“ Der hebräische Ausdruck kann entweder den Ort bezeichnen oder den Ausgangspunkt, von dem an sie keinen Schmuck mehr trugen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: legten … ab
  rationale: Das reflexive Hitpael von נצל bezeichnet hier das Ablegen des am eigenen Körper getragenen Schmucks. „legten … ab“ ist im modernen Deutschen natürlich und gibt die bewusste Entfernung angemessen wieder.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: „Die Israeliten“ ist die natürliche deutsche Bezeichnung für die Angehörigen Israels und gibt den hebräischen Ausdruck בְּנֵי יִשְׂרָאֵל ohne unzeitgemäße geschlechtliche Verengung wieder.
- source_word: עֶדְיָם
  choice: ihren Schmuck
  rationale: עֲדִי bezeichnet Schmuck beziehungsweise Zierde. Das deutsche Kollektivwort „Schmuck“ bleibt ebenso weit und passt zum Zusammenhang.
- source_word: מֵהַר חוֹרֵב
  choice: vom Berg Horeb an
  rationale: 'Die Formulierung bewahrt die mögliche zeitlich-räumliche Bedeutung des hebräischen מִן: Horeb ist der Ausgangspunkt, von dem an die Israeliten den Schmuck nicht mehr trugen.'
theological_decisions:
- issue: Bedeutung von מֵהַר חוֹרֵב
  choice: „vom Berg Horeb an“ als Ausgangspunkt eines fortdauernden Zustands
  alternative: „am Berg Horeb“ als bloße Ortsangabe
  rationale: Der hebräische Ausdruck lässt beide Deutungen zu. Im Haupttext steht die im Kontext gut passende Bedeutung „von da an“; die örtliche Deutung wird in einer Fußnote ausdrücklich bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ verbindet den Vers folgernd mit dem vorherigen Zusammenhang; „vom Berg Horeb an“ ist idiomatisch, während die echte syntaktische Mehrdeutigkeit durch die Fußnote erhalten bleibt.
