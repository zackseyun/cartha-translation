source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Sag zu den Israeliten[a]: Ihr seid ein halsstarriges Volk. Wenn ich einen einzigen Augenblick mitten unter euch hinaufzöge, würde ich euch vernichten.[b] Legt nun euren Schmuck ab[c]; dann will ich wissen, was ich mit euch tun soll.[d]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu den Söhnen Israels“; gemeint ist das Volk Israel insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Bedingungssinn ist aus dem Zusammenhang erschlossen; im Hebräischen ist er nicht ausdrücklich durch eine Konditionalpartikel markiert. Näher an der Satzfolge des Hebräischen: „Einen einzigen Augenblick zöge ich mitten unter euch hinauf und würde euch vernichten.“'
    reason: source_ambiguity
  - marker: c
    text: 'Hebräisch steht die Aufforderung im Singular, weil Israel als eine gemeinsame Person angeredet wird: „Leg nun deinen Schmuck ab.“'
    reason: grammatical_clarification
  - marker: d
    text: 'Wörtlich bleibt die spannungsvolle Aussage erhalten: „Dann will ich wissen, was ich mit dir tun soll.“ Das Verb bedeutet „wissen“, nicht ausdrücklich „entscheiden“.'
    reason: theological_tension
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen gebräuchlichen Form wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier das ganze Volk; „Israeliten“ ist im modernen Deutsch natürlich und schließt die gesamte Gemeinschaft ein.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: ein halsstarriges Volk
  rationale: „Halsstarrig“ bewahrt das hebräische Bild eines Volkes, das seinen Nacken nicht beugen will, und vermittelt zugleich dessen Widerspenstigkeit.
- source_word: רֶגַע אֶחָד
  choice: auch nur einen Augenblick
  rationale: Die Formulierung betont, dass schon eine sehr kurze Gegenwart Jahwes in ihrer Mitte angesichts ihrer Widerspenstigkeit zum Gericht führen würde.
- source_word: אֶעֱלֶה בְקִרְבְּךָ
  choice: mitten unter euch hinaufziehen
  rationale: „Hinaufziehen“ erhält die räumliche Bewegung des Verbs עלה und „mitten unter euch“ die Sprache der göttlichen Gegenwart im Volk.
- source_word: וְכִלִּיתִיךָ
  choice: würde ich euch vernichten
  rationale: כלה bezeichnet hier das vollständige Aufreiben beziehungsweise Beenden im Gericht; „vernichten“ ist klar und gegenwärtig, ohne die Art des Gerichts näher festzulegen.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: Legt nun euren Schmuck ab
  rationale: עֲדִי bezeichnet Schmuck oder Zierat. Die idiomatische deutsche Wendung gibt die Aufforderung präzise wieder.
- source_word: וְאֵדְעָה
  choice: dann will ich wissen
  rationale: Die Übersetzung bewahrt ausdrücklich das hebräische Verb „wissen“ und gibt die voluntative Nuance der Form wieder.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: was ich mit euch tun soll
  rationale: „Mit euch tun“ lässt offen, ob die folgende Handlung strafend, schonend oder andersartig sein wird; „soll“ gibt die noch offene Erwägung natürlich wieder.
theological_decisions:
- issue: Anthropomorphe Rede vom Wissen Gottes
  choice: „dann will ich wissen“ bleibt im Haupttext erhalten
  alternative: „dann werde ich entscheiden“ oder „damit ich bestimme“
  rationale: Der hebräische Text spricht vom Wissen und nicht ausdrücklich vom Entscheiden. Die relationale und theologisch spannungsvolle Ausdrucksweise wird daher nicht rationalisierend aufgelöst.
- issue: Korporativer Singular in der Anrede Israels
  choice: Im Deutschen wird das Volk überwiegend mit dem Plural „ihr/euch“ angeredet
  alternative: Wechsel zum Singular „du/dir“ entsprechend den hebräischen Suffixen
  rationale: Das Hebräische beginnt mit einer pluralischen Anrede und behandelt Israel danach als kollektive Einheit im Singular. Der deutsche Plural hält den Bezug auf das Volk verständlich; eine Fußnote weist auf den Formwechsel hin.
- issue: Bedingter Sinn der Gerichtsankündigung
  choice: „Würde ich …, würde ich …“
  alternative: „Einen Augenblick ziehe ich … und vernichte euch“
  rationale: Im Kontext begründet die Aussage, weshalb Jahwe nicht in Israels Mitte mitzieht. Der Konditionalsatz bringt diesen syntaktisch nicht ausdrücklich markierten, aber kontextuell naheliegenden Sinn zur Geltung, ohne ihn als einzig mögliche Form zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Halsstarrig“ und „hinaufziehen“ bewahren zentrale Bilder des Ausgangstextes, während „Israeliten“ und „Schmuck ablegen“ für heutige Leser natürlich bleiben. Die direkte Rede ist klar gegliedert; der korporative Singular und die anthropomorphe Rede werden nicht verdeckt, sondern durch Fußnoten erläutert.
