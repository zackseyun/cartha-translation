  to: 'Dann sagte Jahwe[a] zu Mose: »Zieh von hier hinauf, du und das Volk, das du aus dem Land Ägypten heraufgeführt hast, in das Land, das ich Abraham, Isaak und Jakob zugeschworen habe: ›Deinen Nachkommen[b] werde ich es geben.‹«'
