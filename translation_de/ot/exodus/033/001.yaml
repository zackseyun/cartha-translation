source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: de
  text: 'Dann sagte Jahwe[a] zu Mose: »Zieh von hier hinauf, du und das Volk, das du aus dem Land Ägypten heraufgeführt hast, in das Land, das ich Abraham, Isaak und Jakob zugeschworen habe: ›Deinen Nachkommen[b] werde ich es geben.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „deinem Samen“. Das hebräische Wort steht im kollektiven Singular und kann die Nachkommenschaft beziehungsweise die Nachfahren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sagte
  rationale: Das narrative וַ führt die Handlung fort. „Dann sagte“ ist im modernen Deutschen eine natürliche Einleitung direkter Rede; „redete“ wäre hier unnötig formelhaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch den traditionellen Titel „der HERR“ ersetzt.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Zieh von hier hinauf
  rationale: Die beiden Imperative bezeichnen Aufbruch und Aufstieg. Die Formulierung gibt beide Aspekte knapp und idiomatisch wieder.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: das du … heraufgeführt hast
  rationale: Der Hifil von עלה bedeutet „heraufführen/heraufbringen“. „Heraufgeführt“ wahrt zudem die sprachliche Verbindung zum anschließenden Hinaufziehen.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die Wendung bildet die hebräische Bezeichnung direkt und in verständlichem Deutsch ab.
- source_word: נִשְׁבַּעְתִּי
  choice: zugeschworen habe
  rationale: Das Verb bezeichnet eine eidliche Zusage. „Zugeschworen“ macht sowohl den Eid als auch die Empfänger der Verheißung deutlich.
- source_word: לֵאמֹר
  choice: mit den Worten
  rationale: Die deutsche Wendung leitet den Inhalt des Eides natürlich ein und entspricht der Funktion des hebräischen Infinitivs.
- source_word: לְזַרְעֲךָ
  choice: deinen Nachkommen
  rationale: זֶרַע steht im kollektiven Singular und kann die gesamte Nachkommenschaft bezeichnen. „Nachkommen“ ist im heutigen Deutsch natürlicher als das wörtliche „Samen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen JHWH. Die Transliteration „Jahwe“ bewahrt seinen Charakter als Eigenname; die traditionelle Ersatzlesung wird in einer Fußnote genannt.
- issue: Kollektiver Singular זֶרַע
  choice: Nachkommen
  alternative: Samen
  rationale: Die Übersetzung bewahrt den kollektiven Sinn, ohne die grammatische Form künstlich auf einen einzelnen Nachkommen festzulegen. Die wörtliche Alternative wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählführung und die feierliche Eidesformel bleiben erhalten; altertümliche oder konfessionell geprägte Formulierungen werden vermieden.
