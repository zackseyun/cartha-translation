source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: de
  text: 'Da sagte er: »Meine Gegenwart[a] wird mitgehen, und ich werde dir Ruhe geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »mein Angesicht«. Der Ausdruck bezeichnet Gottes persönliche Gegenwart, also dass der HERR selbst mitgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Da sagte er
  rationale: Die Wayyiqtol-Form führt die direkte Rede im Erzählfluss fort. »Da sagte er« ist im Deutschen natürlich, ohne eine stärkere zeitliche Abfolge festzulegen.
- source_word: פָּנַי
  choice: Meine Gegenwart
  rationale: Wörtlich steht »mein Angesicht«; idiomatisch bezeichnet der Ausdruck Gottes persönliche Gegenwart. »Meine Gegenwart« gibt den Sinn verständlich wieder, während die hebräische Bildsprache in der Fußnote erhalten bleibt.
- source_word: יֵלֵכוּ
  choice: wird mitgehen
  rationale: Das Verb bedeutet grundsätzlich »gehen«. Im Zusammenhang geht es um Gottes Begleitung; »mitgehen« macht diesen kontextuellen Bezug im Deutschen knapp und natürlich deutlich.
- source_word: וַהֲנִחֹתִי
  choice: und ich werde dir Ruhe geben
  rationale: 'Der Hifil von נוח hat kausativen Sinn: zur Ruhe bringen beziehungsweise Ruhe verschaffen. Die gewählte Formulierung ist idiomatisch und bewahrt den Verheißungscharakter.'
- source_word: לָךְ
  choice: dir
  rationale: Die Präposition mit Suffix bezeichnet die zweite Person Singular. Bei »Ruhe geben« ist »dir« die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des anthropomorphen Ausdrucks פָּנַי
  choice: Meine Gegenwart
  alternative: Mein Angesicht; ich selbst
  rationale: Der hebräische Ausdruck verwendet »Angesicht«, um die persönliche Gegenwart Gottes auszudrücken. »Gegenwart« vermittelt den idiomatischen Sinn, ohne Gottes Begleitung zu einer unpersönlichen Wirkung zu machen; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
- issue: Bezugsweite der Zusage לָךְ
  choice: dir (Singular)
  alternative: euch
  rationale: Die hebräische Form ist grammatisch Singular und richtet die Zusage unmittelbar an Mose. Ob die verheißene Ruhe mittelbar auch das Volk umfasst, wird durch die Übersetzung nicht ausdrücklich entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und feierlich. Der Singular »dir« bewahrt die grammatische Anrede an Mose; die Fußnote erhält die bedeutungsvolle hebräische Bildsprache.
