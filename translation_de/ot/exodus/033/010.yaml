    rationale: Das hebräische אִישׁ („jeder/ein jeder“) bezieht die Niederwerfung einzeln auf die Angehörigen des Volkes. Nach „das ganze Volk ... warf sich nieder“ wirkt das nachgestellte „jeder“ im Deutschen etwas angehängt. „… und jeder warf sich … nieder“ macht die Verteilung eindeutig und flüssig.
