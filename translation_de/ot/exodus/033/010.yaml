  text: וְ/רָאָ֤ה כָל הָ/עָם֙ אֶת עַמּ֣וּד הֶֽ/עָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/קָ֤ם כָּל הָ/עָם֙ וְ/הִֽשְׁתַּחֲוּ֔וּ אִ֖ישׁ פֶּ֥תַח אָהֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: de
  text: Als das ganze Volk die Wolkensäule am Eingang des Zeltes stehen sah, stand das ganze Volk auf, und jeder warf sich am Eingang seines Zeltes nieder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete an“. Das hebräische Verb bezeichnet eine körperliche Niederwerfung als Ausdruck der Ehrfurcht und kann eine Handlung der Anbetung meinen.'
    reason: lexikalische Alternative und Bewahrung der körperlichen wie kultischen Bedeutung
lexical_decisions:
- source_word: וְרָאָה
  choice: Als ... sah
  rationale: Das Narrativ wird fortgeführt; zusammen mit den folgenden Handlungen ergibt sich im Deutschen natürlich ein temporaler Nebensatz.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Die Wendung bezeichnet kollektiv die versammelte Gemeinschaft, ohne die im Vers nicht ausdrücklich genannte Ergänzung „Israel“ einzufügen.
- source_word: עַמּוּד הֶעָנָן
  choice: die Wolkensäule
  rationale: Die geläufige deutsche Wiedergabe bewahrt das konkrete Bild des sichtbaren Zeichens der göttlichen Gegenwart.
- source_word: עֹמֵד
  choice: stehen
  rationale: Das Partizip beschreibt die Stellung der Säule; „stehen“ ist die direkte und natürliche Wiedergabe.
- source_word: פֶּתַח הָאֹהֶל
  choice: am Eingang des Zeltes
  rationale: Die Formulierung gibt den Ort präzise wieder. Aus dem Kontext ist das Zelt der Begegnung gemeint, doch die Kurzform des hebräischen Verses bleibt erhalten.
- source_word: וְקָם
  choice: stand ... auf
  rationale: Das Verb bezeichnet das Sich-Erheben; „aufstehen“ ist in modernem Deutsch klar und würdevoll.
- source_word: וְהִשְׁתַּחֲווּ
  choice: warf sich nieder
  rationale: Die Wiedergabe bewahrt den im hebräischen Verb enthaltenen körperlichen Akt der Ehrfurcht, ohne seine kultische Bedeutung auf ein rein inneres „Anbeten“ zu verengen.
- source_word: אִישׁ
  choice: jeder
  rationale: Das distributive אִישׁ wird idiomatisch als „jeder“ wiedergegeben; der anschließende maskuline Possessivbezug bleibt durch „seines“ sichtbar.
- source_word: פֶּתַח אָהֳלוֹ
  choice: am Eingang seines Zeltes
  rationale: 'Die Formulierung bewahrt das distributive Bild: Jeder befindet sich am Eingang des eigenen Zeltes.'
theological_decisions:
- issue: Wiedergabe der Reaktion des Volkes auf das sichtbare Zeichen der göttlichen Gegenwart
  choice: warf sich nieder
  alternative: betete an
  rationale: Das hebräische Verb bezeichnet zunächst eine körperliche Niederwerfung und kann im Kontext Anbetung ausdrücken. Die Hauptübersetzung bewahrt die konkrete Handlung; die Fußnote nennt ausdrücklich ihre mögliche bzw. hier naheliegende Funktion als Anbetung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „das ganze Volk“ folgt der hebräischen Hervorhebung. Der konkrete körperliche Sinn von וְהִשְׁתַּחֲווּ bleibt im Haupttext erhalten, während die religiöse Deutung in der Fußnote ausdrücklich benannt wird.
