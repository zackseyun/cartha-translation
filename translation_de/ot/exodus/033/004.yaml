  text: וַ/יִּשְׁמַ֣ע הָ/עָ֗ם אֶת הַ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה וַ/יִּתְאַבָּ֑לוּ וְ/לֹא שָׁ֛תוּ אִ֥ישׁ עֶדְי֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: de
  text: Als das Volk diese schlimme Nachricht[a] hörte, trauerte es, und niemand legte seinen Schmuck[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dieses schlimme Wort“; auch „diese schlimme Mitteilung“. Das hebräische Wort kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen Zierat“. Der hebräische Ausdruck bezeichnet allgemein Schmuck oder schmückende Gegenstände.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: Als das Volk … hörte
  rationale: Das singularische Verb stimmt mit dem Kollektivnomen הָעָם überein. Im Deutschen ist der Singular „das Volk … hörte“ natürlich und formnah.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: diese schlimme Nachricht
  rationale: דָּבָר bezeichnet hier die zuvor ergangene Äußerung beziehungsweise Mitteilung. „Nachricht“ gibt den kontextuellen Sinn idiomatisch wieder; „schlimm“ vermittelt רָע, ohne moralisches Bösesein festzulegen. Die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: וַיִּתְאַבָּלוּ
  choice: trauerte es
  rationale: Die Hitpael-Form von אבל bezeichnet Trauern beziehungsweise das Eintreten in Trauer. Das Pronomen greift das kollektive Singularwort „Volk“ auf.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: und niemand legte … an
  rationale: 'אִישׁ steht distributiv: Kein Einzelner tat es. „Niemand“ drückt dies im modernen Deutschen natürlicher aus als „kein Mann“, ohne den Umfang der Aussage zu verengen.'
- source_word: עֶדְיוֹ עָלָיו
  choice: seinen Schmuck an
  rationale: עֲדִי ist ein Sammelbegriff für Schmuck beziehungsweise Zierat. Zusammen mit שׂים und עַל ergibt sich im Deutschen idiomatisch „Schmuck anlegen“.
theological_decisions:
- issue: Bedeutung von רָע in der zurückverweisenden Mitteilung
  choice: schlimme Nachricht
  alternative: böses Wort / schlimme Mitteilung
  rationale: Der Kontext beschreibt die Nachricht als bedrückend oder unheilvoll; die Übersetzung entscheidet nicht, dass Gottes Wort moralisch „böse“ sei. Die lexikalische Offenheit der hebräischen Wendung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive Konstruktion „das Volk … trauerte es“ folgt der deutschen Numeruskongruenz; „niemand“ gibt den distributiven Sinn von אִישׁ natürlich wieder. Die beiden Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
