source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: de
  text: 'Da sagte Mose zu Jahwe: „Sieh, du sagst zu mir: ‚Führe dieses Volk hinauf!‘ Aber du hast mir nicht mitgeteilt, wen du mit mir senden wirst. Du aber hast gesagt: ‚Ich kenne dich mit Namen[a], und du hast auch Gunst in meinen Augen gefunden[b].‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Ich kenne dich mit Namen“ – eine Wendung für persönliche Kenntnis und besondere Zuwendung.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „du hast auch Gnade in meinen Augen gefunden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: רְאֵה
  choice: Sieh
  rationale: Bewahrt die direkte Aufforderung, mit der Mose seinen Einwand einleitet; die knappe Form ist im gehobenen modernen Deutsch verständlich.
- source_word: הַעַל
  choice: Führe ... hinauf
  rationale: Der Hifil von עלה bezeichnet das Hinaufführen; diese Wiedergabe erhält sowohl die kausative als auch die räumliche Nuance des Aufbruchs.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Entspricht der singularischen hebräischen Wendung und bewahrt ihren leicht distanzierenden Ton.
- source_word: לֹא הוֹדַעְתַּנִי
  choice: du hast mich nicht wissen lassen
  rationale: Gibt den kausativen Sinn des Hifil von ידע natürlich wieder, ohne ihn auf ein bloßes Mitteilen zu verengen.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: wen du mit mir senden wirst
  rationale: אֲשֶׁר ist hier durch אֵת als Objekt der Sendung markiert und bezieht sich im Zusammenhang am natürlichsten auf eine begleitende Person; עִמִּי bedeutet schlicht „mit mir“.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Ich kenne dich mit Namen
  rationale: Bewahrt das hebräische Beziehungsidiom und seine Aussage persönlicher Kenntnis, ohne es interpretierend zu erweitern.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: du hast Gunst in meinen Augen gefunden
  rationale: Erhält das hebräische Bild und gibt חֵן hier kontextgerecht mit „Gunst“ wieder.
- source_word: וְגַם
  choice: und ... auch
  rationale: Bewahrt die additive Hervorhebung der zweiten Zusage.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: Aber du ... Dabei hast du gesagt
  rationale: Macht den durch die wiederholten Pronomen hervorgehobenen Gegensatz in natürlichem Deutsch deutlich, ohne Moses Argument zu verschärfen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen, und ist die im Deutschen geläufige Form.
- issue: Aussagekraft von „Ich kenne dich mit Namen“
  choice: Das relationale Idiom wörtlich beibehalten
  alternative: Ich kenne dich persönlich; Ich habe dich erwählt
  rationale: Die Formulierung drückt persönliche Kenntnis und Anerkennung aus, sagt aber nicht ausdrücklich „erwählt“. Die Übersetzung lässt dieses theologische Gewicht stehen, ohne es dogmatisch auszuweiten.
- issue: Bedeutung von חֵן
  choice: Gunst
  alternative: Gnade
  rationale: Beide Wiedergaben sind lexikalisch möglich. „Gunst“ bezeichnet hier klar die wohlwollende Zuwendung im konkreten Verhältnis zu Mose und vermeidet eine unnötige dogmatische Verengung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede und erhaltener hebräischer Bildsprache. „Dabei“ stellt den argumentativen Gegensatz natürlich heraus. Die Gottesnamensform „Jahwe“ folgt deutscher Konvention; alle Fußnotenmarker stehen unmittelbar an den betreffenden Wendungen.
