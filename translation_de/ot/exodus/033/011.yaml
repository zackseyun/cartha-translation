source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: de
  text: Jahwe sprach mit Mose von Angesicht zu Angesicht[a], wie ein Mann mit seinem Freund spricht. Danach kehrte Mose ins Lager zurück; doch sein Diener Josua, der Sohn Nuns, ein junger Mann, verließ das Zelt[b] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unmittelbar“ beziehungsweise „persönlich“. Die hebräische Wendung bezeichnet eine außergewöhnlich direkte Begegnung.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist das Zelt der Begegnung.
    reason: cross_reference
lexical_decisions:
- source_word: וְדִבֶּר
  choice: sprach
  rationale: Das Piel von דבר bezeichnet hier im Zusammenhang den wiederkehrenden Vorgang am Zelt. Das deutsche Präteritum lässt diesen erzählerisch-gewohnheitsmäßigen Sinn natürlich aus dem Kontext hervorgehen, ohne eine zusätzliche Umschreibung in den Text einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: פָּנִים אֶל־פָּנִים
  choice: von Angesicht zu Angesicht
  rationale: Die hebräische Wendung wird bewahrt. Sie bezeichnet hier eine außergewöhnlich unmittelbare, persönliche Verständigung, ohne ausdrücklich festzulegen, ob damit ein buchstäbliches Sehen gemeint ist.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: wie ein Mann mit seinem Freund spricht
  rationale: Die konkrete Vergleichsform des Hebräischen bleibt erhalten; „Freund“ gibt רֵעַ in diesem persönlichen Gesprächszusammenhang natürlich wieder.
- source_word: וְשָׁב
  choice: Danach kehrte Mose ... zurück
  rationale: Das Subjekt wird zur Klarheit wiederholt. Die Verbform setzt den beschriebenen Ablauf fort und bezeichnet Moses Rückkehr nach dem Gespräch.
- source_word: וּמְשָׁרְתוֹ
  choice: sein Diener
  rationale: Das Partizip bezeichnet Josua als denjenigen, der Mose in einer zugeordneten Dienst- und Hilfsfunktion begleitet.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: Josua, der Sohn Nuns
  rationale: Die traditionelle deutsche Namensform wird verwendet; die Abstammungsangabe wird idiomatisch wiedergegeben.
- source_word: נַעַר
  choice: ein junger Mann
  rationale: נַעַר kann einen Jungen, Jugendlichen oder jüngeren Mann bezeichnen. Im Zusammenhang mit Josua ist „ein junger Mann“ natürlich und vermeidet es, die bereits genannte Dienerrolle nochmals in das Wort hineinzulesen.
- source_word: לֹא יָמִישׁ מִתּוֹךְ הָאֹהֶל
  choice: verließ das Zelt nicht
  rationale: Die Wendung bedeutet, dass Josua nicht aus dem Inneren des Zeltes fortging. Die deutsche Form ist klar und natürlich, ohne den räumlichen Sinn zu verändern.
theological_decisions:
- issue: Anthropomorphe Aussage, Jahwe habe mit Mose „von Angesicht zu Angesicht“ gesprochen
  choice: Die hebräische Wendung bleibt im Haupttext stehen und bezeichnet eine unmittelbare persönliche Begegnung.
  alternative: Dynamisch mit „unmittelbar“ oder „persönlich“ übersetzen.
  rationale: Der Ausgangstext formuliert bewusst konkret. Die Übersetzung soll die Spannung zu Aussagen über die Unsichtbarkeit beziehungsweise Unanschaubarkeit Gottes nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die feste Wendung „von Angesicht zu Angesicht“ bewahrt das Bild des Hebräischen; sonst werden schwerfällige Hebraismen vermieden.
