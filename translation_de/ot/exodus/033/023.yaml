  text: וַ/הֲסִרֹתִי֙ אֶת כַּפִּ֔/י וְ/רָאִ֖יתָ אֶת אֲחֹרָ֑/י וּ/פָנַ֖/י לֹ֥א יֵרָאֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/023.yaml
  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: de
  text: Dann werde ich meine Hand wegnehmen, und du wirst meinen Rücken[a] sehen; aber mein Angesicht wird nicht gesehen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das, was hinter mir ist“ beziehungsweise „meine Rückseite“. Das hebräische Wort kann den Rücken oder die rückwärtige Seite bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Dann werde ich … wegnehmen
  rationale: Die Hifil-Form von סור bedeutet hier „wegnehmen/entfernen“. Das vorangestellte ו setzt die Abfolge aus dem vorigen Vers fort; „Dann“ gibt diesen zeitlich-folgernden Zusammenhang natürlich wieder.
- source_word: כַּפִּי
  choice: meine Hand
  rationale: כַּף kann „Handfläche“ oder „Hand“ bedeuten. Im Bild des schützenden Bedeckens aus dem vorigen Vers ist „Hand“ im Deutschen idiomatisch und bewahrt die konkrete anthropomorphe Sprache.
- source_word: וְרָאִיתָ
  choice: und du wirst … sehen
  rationale: 'Die Verbform bezeichnet in diesem fortlaufenden Zukunftszusammenhang die anschließende Folge: Mose wird sehen.'
- source_word: אֲחֹרָי
  choice: meinen Rücken
  rationale: Das Wort bezeichnet die Rückseite beziehungsweise das, was hinten ist. „Meinen Rücken“ ist die klare, natürliche Wiedergabe, ohne die Bildsprache zu abstrahieren; die mögliche weitere Bedeutung wird in der Fußnote genannt.
- source_word: וּפָנַי
  choice: aber mein Angesicht
  rationale: Das ו wird wegen des Gegensatzes zwischen dem, was Mose sehen darf, und dem, was nicht gesehen wird, adversativ als „aber“ wiedergegeben. „Angesicht“ bewahrt hier den würdevollen, konkreten Ausdruck von פָּנִים.
- source_word: לֹא יֵרָאוּ
  choice: wird nicht gesehen werden
  rationale: 'Der Nifal von ראה ist passiv: „gesehen werden“. Obwohl פָּנִים formal pluralisch ist, bezeichnet es hier Gottes Angesicht als Singular; entsprechend steht im Deutschen der Singular.'
theological_decisions:
- issue: Anthropomorphe Rede von Gott
  choice: Die konkreten Körperbegriffe „Hand“, „Rücken“ und „Angesicht“ bleiben erhalten.
  alternative: Abstrakte Umschreibungen wie „Gegenwart“, „Nachglanz“ oder „Spur“ verwenden.
  rationale: Der hebräische Text gebraucht bewusst konkrete Bildsprache. Eine Abstraktion würde die Spannung der göttlichen Selbstoffenbarung deuten statt übersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Angesicht“ ist gegenüber „Gesicht“ leicht gehoben, bleibt aber allgemein verständlich und passt zur feierlichen Gottesrede. Die Satzstruktur hält den Gegensatz und das Passiv des hebräischen Textes fest.
