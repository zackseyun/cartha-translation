source:
  edition: WLC
  text: וְ/הָיָ֗ה כְּ/צֵ֤את מֹשֶׁה֙ אֶל הָ/אֹ֔הֶל יָק֨וּמוּ֙ כָּל הָ/עָ֔ם וְ/נִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אָהֳל֑/וֹ וְ/הִבִּ֨יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד בֹּא֖/וֹ הָ/אֹֽהֱלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: de
  text: Und sooft Mose zum Zelt[a] hinausging, stand das ganze Volk auf; jeder stellte sich an den Eingang seines Zeltes[b], und sie blickten Mose nach, bis er in das Zelt hineinging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist im Zusammenhang das zuvor genannte Zelt der Begegnung; im Hebräischen steht hier nur „das Zelt“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Mann am Eingang seines Zeltes“; die männliche Einzahl wird hier verteilend gebraucht: Jeder aus dem Volk stellte sich an den Eingang seines eigenen Zeltes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und sooft
  rationale: Die Konstruktion leitet in diesem Erzählzusammenhang einen regelmäßig wiederkehrenden Vorgang ein. „Sooft“ gibt diesen iterativen Sinn natürlich und knapp wieder.
- source_word: כְּצֵאת מֹשֶׁה אֶל הָאֹהֶל
  choice: Mose zum Zelt hinausging
  rationale: Der Infinitiv mit כְּ bezeichnet den Zeitpunkt bzw. Begleitumstand; יצא bewahrt die Bewegung „hinaus“, und אֶל bezeichnet das Ziel.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: Im Hebräischen steht schlicht „das Zelt“. Der Kontext identifiziert es mit dem zuvor genannten Zelt der Begegnung, ohne dass die volle Bezeichnung hier wiederholt wird.
- source_word: יָקוּמוּ כָּל הָעָם
  choice: stand das ganze Volk auf
  rationale: Das Imperfekt beschreibt innerhalb des wiederholten Ablaufs die gewohnheitsmäßige Handlung. Deutsches Präteritum nach „sooft“ drückt dies idiomatisch aus.
- source_word: וְנִצְּבוּ אִישׁ פֶּתַח אָהֳלוֹ
  choice: jeder blieb am Eingang seines Zeltes stehen
  rationale: נצב bezeichnet das feste Stehen bzw. Sichhinstellen. „Blieb … stehen“ unterscheidet dies natürlich vom vorangehenden Aufstehen; אִישׁ wird distributiv mit „jeder“ wiedergegeben.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: und sie blickten Mose nach
  rationale: '„Jemandem nachblicken“ bildet die Verbindung von הביט mit אַחֲרֵי präzise und idiomatisch ab: Das Volk verfolgt den weggehenden Mose mit den Augen.'
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: bis er in das Zelt hineinging
  rationale: Die Konstruktion bezeichnet den Endpunkt des Beobachtens; das Richtungssuffix הָ- an „Zelt“ zeigt die Bewegung hinein an.
theological_decisions:
- issue: Bezeichnung des besonderen Zeltes
  choice: Im Haupttext „das Zelt“, mit kontextklärender Fußnote
  alternative: „das Zelt der Begegnung“ direkt im Haupttext
  rationale: Der Kontext legt das Zelt der Begegnung nahe, doch der Vers selbst sagt nur הָאֹהֶל. Die Übersetzung ergänzt die volle Bezeichnung daher nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sooft“ kennzeichnet den wiederholten Ablauf; „Mose nachblicken“ bewahrt die Bewegungsrichtung des hebräischen Ausdrucks. Die Satzgliederung mit Semikolon verhindert eine schwerfällige Reihung.
