  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אִם אֵ֤ין פָּנֶ֨י/ךָ֙ הֹלְכִ֔ים אַֽל תַּעֲלֵ֖/נוּ מִ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: de
  text: 'Da sagte er zu ihm: „Wenn deine Gegenwart[a] nicht mitgeht, dann führe uns nicht von hier hinauf.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dein Angesicht“. Im Hebräischen kann „Angesicht“ die persönliche Gegenwart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Das narrative וַ־ mit Imperfekt führt die Handlung fort; „Da sagte er“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Die Präposition mit Pronominalsuffix bezeichnet den Adressaten der Rede.
- source_word: אִם אֵין
  choice: Wenn ... nicht
  rationale: Die Bedingungspartikel mit negativer Existenzaussage bildet hier einen realen negativen Bedingungssatz.
- source_word: פָּנֶיךָ
  choice: deine Gegenwart
  rationale: Wörtlich steht „dein Angesicht“; im Zusammenhang bezeichnet die Wendung Gottes persönliche, begleitende Gegenwart. Die Bildsprache bleibt in der Fußnote sichtbar.
- source_word: הֹלְכִים
  choice: mitgeht
  rationale: Das Partizip beschreibt begleitendes Gehen. „Mitgeht“ macht im Deutschen den kontextuell gemeinten Begleitaspekt deutlich; der Singular richtet sich nach „Gegenwart“.
- source_word: אַל תַּעֲלֵנוּ
  choice: dann führe uns nicht hinauf
  rationale: אַל mit der Verbform drückt eine nachdrückliche Bitte beziehungsweise ein Verbot aus. Der Hifil von עלה ist kausativ („hinaufführen/hinaufbringen“); „führe ... hinauf“ ist hier idiomatisch und bewahrt die Bewegungsrichtung.
- source_word: מִזֶּה
  choice: von hier
  rationale: Die Präposition mit Demonstrativ verweist auf den gegenwärtigen Ort.
theological_decisions:
- issue: Wiedergabe von פָּנֶיךָ in Bezug auf Gott
  choice: deine Gegenwart
  alternative: dein Angesicht
  rationale: „Gegenwart“ vermittelt den idiomatischen Sinn, dass Gott Israel persönlich begleitet, ohne die Aussage auf ein körperliches Gesicht zu verengen. Die wörtliche Bildform wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mitgeht“ klingt natürlich und bringt das begleitende Gehen zum Ausdruck; „hinaufführen“ bewahrt die kausative Bewegungsrichtung des hebräischen Verbs.
