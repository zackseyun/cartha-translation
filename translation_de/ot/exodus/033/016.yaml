base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: de
  text: Woran wird man denn erkennen, dass ich Gunst in deinen Augen gefunden habe – ich und dein Volk? Wird man es nicht daran erkennen, dass du mit uns gehst und wir – ich und dein Volk – dadurch von allen Völkern auf der Erde unterschieden werden[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „herausgehoben“ oder „abgesondert“. Das hebräische Verb kann ausdrücken, dass jemand als außergewöhnlich oder von anderen getrennt erkennbar gemacht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה יִוָּדַע אֵפוֹא
  choice: Woran soll man denn erkennen
  rationale: Die Formulierung gibt die Verknüpfung, die Frage nach dem Erkennungsmerkmal, das passive יִוָּדַע und die folgernde Partikel אֵפוֹא in natürlichem modernem Deutsch wieder.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: dass ich Gunst in deinen Augen gefunden habe
  rationale: Die geläufige hebräische Wendung wird nah am Bild des Ausgangstextes wiedergegeben; „Gunst“ bezeichnet hier wohlwollende Zuwendung, ohne zusätzliche dogmatische Festlegung.
- source_word: אֲנִי וְעַמֶּךָ
  choice: ich und dein Volk
  rationale: Die auffällige ausdrückliche Verbindung von Mose und dem Volk bleibt an beiden Stellen erhalten.
- source_word: הֲלוֹא בְּלֶכְתְּךָ עִמָּנוּ
  choice: Doch wohl daran, dass du mit uns gehst
  rationale: הֲלוֹא leitet eine rhetorische Frage ein, die Zustimmung erwartet; die Präposition ב wird als Angabe des entscheidenden Erkennungsgrundes wiedergegeben.
- source_word: וְנִפְלֵינוּ
  choice: und wir … dadurch … unterschieden sind
  rationale: Die Niphal-Form von פלא bezeichnet hier das erkennbare Herausgehobensein beziehungsweise die Unterschiedenheit des Volkes. „Unterschieden“ bewahrt den Bezug zu den anderen Völkern, ohne die Nuance auf bloße räumliche Trennung einzuengen.
- source_word: מִכָּל הָעָם אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: von allen Völkern auf der Erde
  rationale: Das kollektiv-distributive הָעָם wird im Deutschen idiomatisch mit dem Plural „allen Völkern“ ausgedrückt; „auf der Erde“ gibt die umfassende geographische Wendung verständlich wieder.
theological_decisions:
- issue: Grund der besonderen Stellung Israels
  choice: Gottes Mitgehen wird als das erkennbare Merkmal dargestellt, das Mose und das Volk von allen anderen Völkern unterscheidet.
  alternative: Israels besondere Stellung wird hier vorrangig durch Gesetz, Land oder Abstammung begründet.
  rationale: Der Vers selbst verbindet das Unterschiedensein unmittelbar mit Gottes Gegenwart und Mitgehen. Die Übersetzung lässt diese Verbindung bestehen, ohne weitere theologische Gründe auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt erhalten. Gedankenstriche markieren die im Hebräischen auffällig wiederholte Verbindung „ich und dein Volk“, ohne sie stilistisch zu glätten. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Aussage.
