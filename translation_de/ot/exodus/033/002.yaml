  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: de
  text: Und ich werde einen Engel[a] vor dir hersenden und die Kanaaniter, Amoriter, Hetiter, Perisiter, Hiwiter und Jebusiter vertreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen Boten«. Das hebräische Wort kann sowohl einen himmlischen Engel als auch einen menschlichen Boten bezeichnen; hier passt »Engel« am besten zum Zusammenhang.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Und ich werde … hersenden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat in dieser göttlichen Zusage Zukunftsbedeutung. „Hersenden“ verbindet sich im Deutschen natürlich mit „vor dir“ und wahrt den Gedanken des Vorausgehens.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die Wendung bedeutet idiomatisch „vor dir“ beziehungsweise „dir voraus“. „Vor dir“ ist knapp und wahrt die Bildlichkeit des Hebräischen.
- source_word: מַלְאָךְ
  choice: einen Engel
  rationale: מַלְאָךְ kann einen menschlichen Boten oder einen himmlischen Engel bezeichnen. Im Zusammenhang der göttlichen Führung passt „Engel“ am besten; die lexikalische Alternative bleibt in einer Fußnote sichtbar.
- source_word: וְגֵרַשְׁתִּי
  choice: und … vertreiben
  rationale: גרשׁ bezeichnet hier das gewaltsame Forttreiben beziehungsweise Verdrängen der ansässigen Völker. „Vertreiben“ ist im modernen Deutschen klar und treffend.
- source_word: אֶת
  choice: '[Akkusativzeichen, nicht eigens übersetzt]'
  rationale: Die Partikel kennzeichnet das bestimmte direkte Objekt und besitzt hier keine eigenständige deutsche Entsprechung.
- source_word: הַכְּנַעֲנִי הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: die Kanaaniter, Amoriter, Hetiter, Perisiter, Hiwiter und Jebusiter
  rationale: Die singularischen hebräischen Volksbezeichnungen sind kollektiv gebraucht. Im natürlichen modernen Deutsch werden solche Völkernamen im Plural wiedergegeben.
theological_decisions:
- issue: Identität von מַלְאָךְ in diesem Vers
  choice: „einen Engel“, ohne ihn näher als den Engel des HERRN oder als einen bestimmten geschaffenen Engel zu identifizieren
  alternative: „einen Boten“ oder „den Engel“
  rationale: Der Vers selbst bestimmt die Identität des מַלְאָךְ nicht näher. Der unbestimmte Ausdruck bewahrt diese Offenheit und vermeidet eine nicht ausdrücklich genannte theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiv gebrauchten singularischen Ethnonyme werden nach natürlichem deutschem Sprachgebrauch im Plural wiedergegeben. Der Fußnotenmarker [a] steht unmittelbar beim mehrdeutigen Ausdruck.
