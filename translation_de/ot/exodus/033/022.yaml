source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: de
  text: Und wenn meine Herrlichkeit vorüberzieht, werde ich dich in eine Felsspalte stellen und meine Hand schützend über dich halten, bis ich vorübergegangen bin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: Und wenn … vorüberzieht
  rationale: Die Verbindung aus וְהָיָה und ב mit dem Infinitiv constructus leitet idiomatisch den zeitlichen Umstand der folgenden Handlung ein.
- source_word: כְּבֹדִי
  choice: meine Herrlichkeit
  rationale: Im Kontext der Gotteserscheinung bezeichnet כָּבוֹד die offenbar werdende göttliche Herrlichkeit; die geläufige deutsche Entsprechung bewahrt diesen Sinn.
- source_word: וְשַׂמְתִּיךָ
  choice: werde ich dich … stellen
  rationale: שׂים bedeutet setzen, stellen oder platzieren. „Stellen“ ist im Deutschen mit dem Ortsausdruck natürlich und konkret.
- source_word: בְּנִקְרַת הַצּוּר
  choice: in eine Felsspalte
  rationale: נִקְרָה bezeichnet eine Spalte oder Kluft. Die idiomatische Zusammensetzung „Felsspalte“ gibt die Constructusverbindung prägnant wieder, ohne eine im Deutschen unnötig schwerfällige Artikelentscheidung einzuführen.
- source_word: וְשַׂכֹּתִי כַפִּי עָלֶיךָ
  choice: und meine Hand schützend über dich halten
  rationale: סכך bezeichnet bedecken, abschirmen oder schützen; כף wird im Zusammenhang natürlich mit „Hand“ wiedergegeben. Die Formulierung bewahrt das konkrete Bild und drückt zugleich die räumliche Funktion von עַל aus.
- source_word: עַד עָבְרִי
  choice: bis ich vorübergegangen bin
  rationale: עַד mit dem Infinitiv constructus und Suffix markiert den Endpunkt des Schutzes; das Perfekt macht im Deutschen die abgeschlossene Handlung relativ zu diesem Endpunkt deutlich.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Hand
  choice: Das konkrete Bild „meine Hand“ bleibt im Haupttext erhalten.
  alternative: meinen Schutz / meine Macht
  rationale: Der hebräische Text verwendet ausdrücklich körperliche Bildsprache. Eine abstrakte Umschreibung würde das Bild deuten und die Spannung der Gotteserscheinung abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich und flüssig, bewahrt aber die konkrete Bildsprache und den feierlichen Charakter der Gotteserscheinung.
