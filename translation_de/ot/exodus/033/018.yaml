  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: de
  text: 'Da sagte er: »Zeige mir doch deine Herrlichkeit.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lass mich doch deine Herrlichkeit sehen.« Das hebräische Verb bedeutet wörtlich „bewirke, dass ich sehe“; „Herrlichkeit“ kann auch sichtbar hervortretenden Glanz oder Ehre bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Da sagte er
  rationale: Das Waw consecutivum führt die Erzählung weiter. „Da sagte er“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: הַרְאֵנִי
  choice: Zeige mir
  rationale: Der Hifil-Imperativ von ראה mit Suffix der 1. Person Singular bedeutet wörtlich „bewirke, dass ich sehe“. „Zeige mir“ drückt diese Veranlassung im Deutschen knapp und idiomatisch aus.
- source_word: נָא
  choice: doch
  rationale: Die Partikel kennzeichnet hier eine eindringliche, höfliche Bitte. Das deutsche Modalpartikel „doch“ bewahrt den bittenden Ton natürlicher als das förmlichere „bitte“ in dieser Wortstellung.
- source_word: אֶת
  choice: '[Akkusativzeichen, nicht eigens übersetzt]'
  rationale: אֶת kennzeichnet das bestimmte direkte Objekt und hat im Deutschen keine eigene lexikalische Entsprechung.
- source_word: כְּבֹדֶךָ
  choice: deine Herrlichkeit
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder sichtbar hervortretenden Glanz bezeichnen. „Herrlichkeit“ wahrt hier die semantische und theologische Breite, ohne die Bitte auf sichtbaren Glanz zu verengen.
theological_decisions:
- issue: Bedeutung von „deine Herrlichkeit“ in Moses Bitte
  choice: deine Herrlichkeit
  alternative: deinen Glanz; die Fülle deiner Gegenwart
  rationale: Der hebräische Text legt nicht eindeutig fest, ob Mose sichtbaren Glanz, göttliche Majestät oder eine Offenbarung von Gottes Gegenwart sehen möchte. „Herrlichkeit“ erhält diese Spannung, statt sie deutend aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Da“ führt die Erzählung flüssig weiter; „doch“ gibt die bittende Nuance von נָא wieder. Die traditionelle Bezeichnung „Herrlichkeit“ bleibt wegen ihrer inhaltlichen Breite erhalten.
