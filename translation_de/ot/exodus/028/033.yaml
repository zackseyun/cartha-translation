  text: וְ/עָשִׂ֣יתָ עַל שׁוּלָ֗י/ו רִמֹּנֵי֙ תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תוֹלַ֣עַת שָׁנִ֔י עַל שׁוּלָ֖י/ו סָבִ֑יב וּ/פַעֲמֹנֵ֥י זָהָ֛ב בְּ/תוֹכָ֖/ם סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/033.yaml
  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: de
  text: An seinem Saum sollst du ringsum Granatäpfel aus blauem, purpurfarbenem und scharlachrotem Garn[a] anbringen und dazwischen ringsum goldene Glocken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »granatapfelförmige Verzierungen«. Im Hebräischen steht wörtlich »Granatäpfel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: sollst du … anbringen
  rationale: Das Qal-Perfekt mit וְ hat im kultischen Anweisungskontext gebietende Bedeutung. »Anbringen« klingt bei Schmuckelementen an einem bereits beschriebenen Gewand natürlicher als das wörtlichere »machen«.
- source_word: שׁוּלָיו
  choice: an seinem Saum
  rationale: שׁוּל bezeichnet hier den unteren Rand des Obergewands; »Saum« ist die geläufige und genaue deutsche Bezeichnung.
- source_word: רִמֹּנֵי
  choice: Granatäpfel
  rationale: Der hebräische Text nennt wörtlich Granatäpfel. Dass damit granatapfelförmige Verzierungen gemeint sind, wird als mögliche Erläuterung in der Fußnote bewahrt.
- source_word: תְּכֵלֶת
  choice: violettblauem
  rationale: Der Ausdruck bezeichnet einen kostbaren blau bis blauvioletten Farbstoff beziehungsweise entsprechend gefärbtes Textilmaterial. »Violettblau« hält die historische Farbunschärfe besser offen als schlichtes »Blau«.
- source_word: אַרְגָּמָן
  choice: purpurrotem
  rationale: Das Wort bezeichnet purpurgefärbtes Material; »purpurrot« unterscheidet es verständlich vom violettblauen תְּכֵלֶת.
- source_word: תוֹלַעַת שָׁנִי
  choice: scharlachrotem Garn
  rationale: Die feste Wendung bezeichnet scharlachfarbenes Textilmaterial. »Garn« macht den in diesem Zusammenhang vorausgesetzten Werkstoff ausdrücklich und gilt für die gesamte Farbreihe.
- source_word: סָבִיב
  choice: ringsum
  rationale: »Ringsum« gibt die vollständige Anordnung entlang des Saums knapp und idiomatisch wieder.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: und … goldene Glöckchen
  rationale: Die Wortgruppe bezeichnet kleine Glocken aus Gold. »Glöckchen« passt zur Größe von Gewandschmuck und bewahrt die additive Verknüpfung.
- source_word: בְּתוֹכָם
  choice: zwischen ihnen
  rationale: Wörtlich bedeutet die Form »in ihrer Mitte/unter ihnen«; im räumlichen Zusammenhang bezeichnet sie die zwischen den Granatäpfeln angeordneten Glöckchen, ohne ausdrücklich ein striktes Wechselmuster festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstellung hält beide ringsum angeordneten Schmuckelemente klar zusammen; die Farbbezeichnungen sind präzise, ohne eine wissenschaftlich nicht völlig sichere historische Farbnuance als eindeutig auszugeben.
