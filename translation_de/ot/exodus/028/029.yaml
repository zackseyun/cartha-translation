source:
  edition: WLC
  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: de
  text: Aaron soll die Namen der Söhne Israels[a] in der Brusttasche des Rechts[b] über seinem Herzen tragen, wenn er in das Heiligtum hineingeht – stets zum Gedenken vor Jahwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“; gemeint sind in diesem Zusammenhang die von Israel abstammenden Stämme.'
    reason: lexical_clarification
  - marker: b
    text: 'Oder: „Brusttasche der Entscheidung“. Die hebräische Bezeichnung kann Recht, Urteil oder Entscheidung vor Gott bezeichnen, ohne die genaue Funktion des priesterlichen Kleidungsstücks näher festzulegen.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „als beständiges Gedenkzeichen vor Jahwe“. Der hebräische Ausdruck legt nicht ausdrücklich fest, wer sich erinnern soll.'
    reason: ambiguity_note
lexical_decisions:
- source_word: וְנָשָׂא
  choice: soll … tragen
  rationale: נשׂא bezeichnet hier das Tragen eines Gegenstands am Körper. Die deutsche Formulierung ist natürlich und bewahrt zugleich den konkreten priesterlichen Vorgang.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: Die eingravierten Namen sind ausdrücklich gemeint; der Plural wird direkt wiedergegeben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die genealogische Formulierung des Hebräischen wird bewahrt. Im Zusammenhang stehen die von Israel abstammenden Stämme im Blick.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: in der Brusttasche des Rechtsspruchs
  rationale: חֹשֶׁן bezeichnet das priesterliche, an der Brust getragene Behältnis. „Rechtsspruch“ wahrt das Bedeutungsfeld von מִשְׁפָּט, ohne die genaue Art der göttlichen Entscheidung vorschnell festzulegen.
- source_word: עַל לִבּוֹ
  choice: über seinem Herzen
  rationale: Die räumliche Lage des Kleidungsstücks und ihre symbolische Bedeutung werden gleichermaßen erhalten.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: wenn er in das Heiligtum hineingeht
  rationale: Die Präposition mit dem Infinitiv bezeichnet den Zeitpunkt. הַקֹּדֶשׁ meint hier den heiligen Bereich des Heiligtums; die Wiedergabe vermeidet eine unnötig enge räumliche Festlegung.
- source_word: לְזִכָּרוֹן
  choice: zum Gedenken
  rationale: Die Wendung drückt den Zweck als bleibendes Erinnerungszeichen vor Gott aus und klingt im Deutschen würdig und natürlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי wird idiomatisch mit „vor“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: תָּמִיד
  choice: stets
  rationale: Das Wort bezeichnet die fortdauernde beziehungsweise regelmäßig wiederkehrende Geltung im kultischen Dienst.
theological_decisions:
- issue: Bedeutung der kultischen Bezeichnung חֹשֶׁן הַמִּשְׁפָּט
  choice: Brusttasche des Rechtsspruchs
  alternative: Brusttasche der Entscheidung; Brustschild des Gerichts
  rationale: Die gewählte Form lässt die Spannung zwischen Recht, Urteil und göttlicher Entscheidung bestehen und benennt den Gegenstand als Brusttasche, ohne seine Funktion über den Kontext hinaus zu erklären.
- issue: Genealogische Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Nachkommen Israels
  rationale: Die konkrete genealogische Ausdrucksweise des Ausgangstextes wird nicht in eine rein ethnische Sammelbezeichnung aufgelöst.
- issue: Räumlicher Bezug von הַקֹּדֶשׁ
  choice: das Heiligtum
  alternative: das Heilige; der heilige Bereich
  rationale: Der Ausdruck bezeichnet im Kontext den sakralen Bereich. „Heiligtum“ ist verständlich, ohne sicherer als der hebräische Text zwischen einzelnen Bereichen des Zeltheiligtums zu unterscheiden.
- issue: Funktion von לְזִכָּרוֹן לִפְנֵי יְהוָה
  choice: zum Gedenken vor Jahwe
  alternative: als Gedenkzeichen vor Jahwe
  rationale: Die knappe Zweckangabe bleibt erhalten. Es wird nicht näher festgelegt, ob das Gedenken primär Gottes Erinnern, Israels Erinnern oder die repräsentative Vergegenwärtigung der Stämme bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Kultische Fachbegriffe werden verständlich wiedergegeben; echte semantische Mehrdeutigkeiten stehen in den Fußnoten. Der Gottesname יהוה wird entsprechend der Projektvorgabe als „Jahwe“ wiedergegeben.
