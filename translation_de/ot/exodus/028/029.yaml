  rationale: Die Revision ersetzt die zu enge Wiedergabe „Rechtsspruch“ durch „Rechts“, wodurch der etablierte kultische Titel formnah und zugleich semantisch offen bleibt. Die überflüssige Fußnote zu „tragen“ wird entfernt; die übrigen Anmerkungen werden neu verankert und bewahren die sachlich relevanten Mehrdeutigkeiten.
