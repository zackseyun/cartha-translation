  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: de
  text: 'Und du, führe deinen Bruder Aaron und seine Söhne mit ihm aus der Mitte der Söhne Israels[b] zu dir heran, damit er mir als Priester dient[a]: Aaron, Nadab und Abihu, Eleasar und Itamar, die Söhne Aarons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Einzahl: »damit er mir als Priester dient«. Im Zusammenhang werden auch Aarons Söhne zusammen mit ihm herangeführt und anschließend namentlich genannt.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: »aus der Mitte der Israeliten«. Wörtlich: »aus der Mitte der Söhne Israels«, eine feste Bezeichnung für das Bundesvolk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Und du
  rationale: Das ausdrücklich gesetzte Pronomen hebt Mose hervor und markiert den Übergang zu einem unmittelbar an ihn gerichteten Auftrag.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: lass … zu dir herantreten
  rationale: Der Hifil von קרב bezeichnet das Heranbringen beziehungsweise Herantretenlassen. Die Formulierung bewahrt die räumliche und kultische Bildhaftigkeit, ohne bereits eine vollständige Einsetzung auszudrücken.
- source_word: אָחִיךָ
  choice: deinen Bruder
  rationale: Die ausdrücklich genannte familiäre Beziehung zwischen Mose und Aaron bleibt erhalten.
- source_word: בָּנָיו אִתּוֹ
  choice: mit ihm seine Söhne
  rationale: אִתּוֹ kennzeichnet die Söhne als gemeinsam mit Aaron Herantretende und wird daher ausdrücklich wiedergegeben.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: aus der Mitte der Söhne Israels
  rationale: Die quellnahe Bundesvolkbezeichnung bleibt im Haupttext erhalten; die heute geläufigere Wiedergabe steht in einer Fußnote.
- source_word: לְכַהֲנוֹ לִי
  choice: damit er mir als Priester dient
  rationale: Die hebräische Form ist grammatisch singularisch und wird trotz der zuvor genannten Gruppe nicht stillschweigend in den Plural geändert. כהן bezeichnet den Dienst als Priester, לִי dessen Ausrichtung auf Gott.
- source_word: בְּנֵי אַהֲרֹן
  choice: die Söhne Aarons
  rationale: Die abschließende genealogische Bestimmung der genannten Männer wird ausdrücklich beibehalten.
theological_decisions:
- issue: Singular in לְכַהֲנוֹ לִי nach der Nennung Aarons und seiner Söhne
  choice: damit er mir als Priester dient
  alternative: damit sie mir als Priester dienen
  rationale: Der Singular kann Aaron als den im Vordergrund stehenden Priester hervorheben, obwohl seine Söhne mit ihm berufen und anschließend namentlich genannt werden. Eine pluralische Glättung würde diese Spannung des hebräischen Wortlauts beseitigen; deshalb bleibt sie im Text erhalten und wird erläutert.
- issue: Bundesvolkbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten
  rationale: Die wörtliche Bezeichnung bewahrt die quellsprachliche Bundes- und Abstammungssprache. Die übliche kollektive Bedeutung wird durch die Fußnote klargestellt, ohne den Haupttext zu neutralisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Herantreten lassen« erhält den konkreten und kultischen Klang des hebräischen Verbs. Die ungewöhnliche Einzahl beim Priesterdienst wurde bewusst nicht geglättet; eine Fußnote macht die grammatische und sachliche Spannung transparent.
