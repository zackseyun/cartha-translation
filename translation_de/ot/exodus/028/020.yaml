  text: 'And the fourth row: beryl[a], onyx, and jasper; they shall be set in gold in their settings.'
translation:
  language: de
  text: 'Und die vierte Reihe: Beryll[a], Onyx und Jaspis. Sie sollen in ihre Goldfassungen eingesetzt sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer Edelsteine am Brustschild des Hohenpriesters ist unsicher. תַּרְשִׁישׁ wird traditionell unter anderem mit „Beryll“ und שֹׁהַם mit „Onyx“ wiedergegeben; auch andere Zuordnungen wurden vorgeschlagen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: Und die vierte Reihe
  rationale: טּוּר bezeichnet im Zusammenhang der geordneten Edelsteine eine Reihe; הָרְבִיעִי ist das entsprechende Ordinalzahlwort.
- source_word: תַּרְשִׁישׁ
  choice: Beryll
  rationale: Die genaue Bestimmung des antiken Edelsteins ist unsicher. „Beryll“ ist eine verbreitete traditionelle Wiedergabe und wird durch eine Fußnote als nicht abschließend gekennzeichnet.
- source_word: וְשֹׁהַם
  choice: Onyx
  rationale: „Onyx“ ist die geläufige traditionelle Entsprechung, obwohl auch bei diesem Stein die mineralogische Identifikation umstritten ist.
- source_word: וְיָשְׁפֵה
  choice: und Jaspis
  rationale: „Jaspis“ ist die übliche deutsche Bezeichnung für den hier genannten Edelstein.
- source_word: מְשֻׁבָּצִים זָהָב
  choice: in Gold eingefasst
  rationale: Das passive Partizip beschreibt die kunsthandwerkliche Einfassung der Steine; „in Gold eingefasst“ gibt Material und Passivbedeutung natürlich wieder.
- source_word: יִהְיוּ בְּמִלּוּאֹתָם
  choice: sollen … in ihren Fassungen sitzen
  rationale: Das Imperfekt hat hier vorschreibende Bedeutung. מִלּוּאֹת bezeichnet in diesem kunsthandwerklichen Kontext die Fassungen, in die die Steine eingesetzt werden.
