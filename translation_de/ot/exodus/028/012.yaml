id: EXO.28.12
reference: Exodus 28:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: de
  text: Du sollst die beiden Steine auf die Schulterstücke des Efods setzen, als Erinnerungssteine für die Söhne Israels[a]. Aaron soll ihre Namen auf seinen beiden Schultern vor Jahwe tragen, zur Erinnerung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Söhne Israels“ ist eine familiäre Bundesbezeichnung und meint hier das Volk Israel beziehungsweise seine Stämme als Ganzes.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Du sollst … setzen
  rationale: שׂים bedeutet „setzen, legen, anbringen“. Die deutsche Soll-Form gibt die Anweisung in diesem Kontext natürlich und verbindlich wieder.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: die beiden Steine
  rationale: Gibt Numerale und bestimmten Ausdruck direkt wieder; die Steinart ist bereits aus dem Kontext bekannt und wird hier nicht erneut genannt.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: die Schulterstücke des Efods
  rationale: כָּתֵף bezeichnet wörtlich die Schulter; beim priesterlichen Gewand sind hier dessen Schulterpartien beziehungsweise Schulterstücke gemeint.
- source_word: אַבְנֵי זִכָּרֹן
  choice: Erinnerungssteine
  rationale: Der deutsche Ausdruck bewahrt die Funktion des hebräischen Konstrukts „Steine der Erinnerung“ und klingt zugleich natürlich.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: für die Söhne Israels
  rationale: Bewahrt die familiäre Bundesbezeichnung des Hebräischen; sie bezeichnet hier die von Israel abstammende Gemeinschaft beziehungsweise ihre Stämme.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Aaron soll ihre Namen … tragen
  rationale: נשׂא heißt „tragen“. Die konkrete und repräsentative Bildsprache des Priesterdienstes bleibt erhalten.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet „vor, in der Gegenwart von“; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: auf seinen beiden Schultern
  rationale: Anders als zu Beginn des Verses sind hier ausdrücklich Aarons eigene Schultern gemeint. Die konkrete Wiederholung wird beibehalten.
- source_word: לְזִכָּרֹן
  choice: zur Erinnerung
  rationale: Die Zweck- beziehungsweise Funktionsangabe wahrt die lexikalische Verbindung zu אַבְנֵי זִכָּרֹן, ohne festzulegen, wessen Erinnern gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottes Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Volk Israel
  rationale: Die Übersetzung bewahrt die familiäre Formulierung des Ausgangstextes. Eine Fußnote verdeutlicht, dass die Wendung hier kollektiv das Volk beziehungsweise die Stämme Israels bezeichnet.
- issue: Bezug von לְזִכָּרֹן
  choice: zur Erinnerung, ohne den Erinnernden zu bestimmen
  alternative: damit Jahwe sich erinnert / als Gedenkzeichen für Israel
  rationale: Der hebräische Ausdruck nennt nicht ausdrücklich, wer sich erinnert. Die Übersetzung lässt diese theologisch bedeutsame Offenheit bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Efod“ bleibt als eingeführter Fachbegriff für das priesterliche Gewand erhalten. Die Satzstruktur wurde für natürliche deutsche Lesbarkeit leicht gegliedert; die Wiederholung von „Schulter“ und „Erinnerung“ bewahrt zentrale Verknüpfungen des Hebräischen.
