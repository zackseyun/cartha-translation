  language: de
  text: 'und die dritte Reihe: ein Hyazinth[a], ein Achat[b] und ein Amethyst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Steine mit den hier verwendeten antiken Namen genau gemeint sind, ist unsicher. „Hyazinth“ gibt לֶשֶׁם wieder; traditionell wird es auch mit „Ligur“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Für שְׁבוֹ ist möglicherweise auch „Onyx“ gemeint; antike Edelsteinnamen lassen sich nicht immer eindeutig modernen Mineralbezeichnungen zuordnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: und die ... Reihe
  rationale: טוּר bezeichnet im Zusammenhang mit den Edelsteinen des Brustschilds eine Reihe; וְ führt die Aufzählung aus dem vorherigen Vers fort.
- source_word: הַשְּׁלִישִׁי
  choice: dritte
  rationale: Das Ordinalzahlwort bestimmt diese Reihe eindeutig als die dritte.
- source_word: לֶשֶׁם
  choice: Hyazinth
  rationale: Die genaue Bestimmung des antiken Edelsteinnamens ist unsicher. „Hyazinth“ ist eine geläufige moderne Annäherung; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: שְׁבוֹ
  choice: Achat
  rationale: „Achat“ ist die traditionelle und plausible Wiedergabe, doch die genaue mineralogische Zuordnung bleibt unsicher; „Onyx“ wird daher als Möglichkeit genannt.
- source_word: וְאַחְלָמָה
  choice: und ein Amethyst
  rationale: אַחְלָמָה wird weithin und plausibel als Amethyst bestimmt; die Wiedergabe ist klar und geläufig.
