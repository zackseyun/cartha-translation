  naturalness: „Wie den Efod“ ist im Deutschen elliptisch und kann nahelegen, die Brusttasche solle dem Efod selbst gleichen. „In der Machart des Efods“ ist klar, natürlich und präziser. „Kunstvolle Musterarbeit“ gibt die fachmännisch entworfene Textilarbeit idiomatisch wieder.
