  to: 'Du sollst eine Brusttasche des Rechtsentscheids[a] in kunstvoller Musterarbeit anfertigen; in der Machart des Efods sollst du sie anfertigen: aus Gold, violettblauem, purpurrotem und scharlachrotem Garn sowie gezwirntem feinem Leinen sollst du sie anfertigen.'
  rationale: Die Vergleichsphrase wurde zu „in der Machart des Efods“ präzisiert, damit ausdrücklich die entsprechende handwerkliche Ausführung gemeint ist. „Kunstvolle Musterarbeit“ wahrt den Bezug auf fachmännisch entworfene Textilarbeit, ohne die Tätigkeit enger als bloßes Weben festzulegen. Die wiederholte Anweisung „sollst du sie anfertigen“ und die sachlich offene Bezeichnung des Rechtsentscheids bleiben erhalten.
