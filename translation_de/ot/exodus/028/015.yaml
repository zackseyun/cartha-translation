  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: de
  text: 'Du sollst eine Brusttasche des Rechtsentscheids[a] in kunstvoller Musterarbeit anfertigen; in der Machart des Efods sollst du sie anfertigen: aus Gold, violettblauem, purpurrotem und scharlachrotem Garn sowie gezwirntem feinem Leinen sollst du sie anfertigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Brusttasche für Entscheidungen“ oder „Brusttasche des Rechts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: Brusttasche
  rationale: Bezeichnet das am Brustbereich getragene priesterliche Stück; „Brusttasche“ vermeidet die irreführende Vorstellung eines Rüstungsteils und passt zu seiner Ausführung und Funktion.
- source_word: מִשְׁפָּט
  choice: des Rechtsentscheids
  rationale: Bewahrt die formale Genitivverbindung und den Bezug auf richterliche beziehungsweise kultische Entscheidung, ohne die genaue Funktion festzulegen.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: als kunstvolle Webarbeit
  rationale: Gibt fachmännisch entworfene, gemusterte Textilarbeit wieder; der textile Kontext legt „Webarbeit“ nahe, während „kunstvoll“ die besondere handwerkliche Gestaltung ausdrückt.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: Wie den Efod
  rationale: Drückt knapp aus, dass Herstellungsart und handwerkliche Ausführung derjenigen des Efods entsprechen.
- source_word: אֵפֹד
  choice: Efod
  rationale: Der etablierte Fachbegriff wird transliteriert, da kein kurzes deutsches Wort das besondere priesterliche Kleidungsstück eindeutig bezeichnet.
- source_word: זָהָב
  choice: Gold
  rationale: Direkte Wiedergabe des Materials.
- source_word: תְּכֵלֶת
  choice: violettblaues Garn
  rationale: Die historische Färbung lässt sich nicht völlig sicher auf eine moderne Farbbezeichnung reduzieren; „violettblau“ gibt das Farbspektrum im Textilkontext angemessen wieder.
- source_word: אַרְגָּמָן
  choice: purpurrotes Garn
  rationale: Bezeichnet einen kostbaren Purpurfarbstoff; „purpurrot“ unterscheidet ihn verständlich vom violettblauen Material.
- source_word: תוֹלַעַת שָׁנִי
  choice: scharlachrotes Garn
  rationale: Macht den textilen Materialbezug der scharlachfarbenen Färbung ausdrücklich.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes feines Leinen
  rationale: Bewahrt sowohl die Qualität des Leinens als auch die ausdrücklich genannte gezwirnte Verarbeitung.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: sollst du sie anfertigen ... sollst du sie anfertigen
  rationale: Die Wiederholung des hebräischen Verbs bleibt als Merkmal des nachdrücklichen Anweisungsstils erhalten.
theological_decisions:
- issue: Funktion von חֹשֶׁן מִשְׁפָּט
  choice: Brusttasche des Rechtsentscheids
  alternative: Brusttasche für Entscheidungen; Brusttasche des Rechts
  rationale: Die Genitivform wahrt die kultisch-rechtliche Bedeutung, ohne zu behaupten, auf welche konkrete Weise durch dieses Stück Entscheidungen ermittelt oder verkündet wurden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sachlichem Anweisungsstil. Der Fachbegriff „Efod“ bleibt erhalten. Die Materialliste ist idiomatisch formuliert, während die verbale Wiederholung des Hebräischen bewusst bewahrt wird.
