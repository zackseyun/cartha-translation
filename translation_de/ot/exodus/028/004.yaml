  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: de
  text: 'Und dies sind die Gewänder, die sie anfertigen sollen: ein Bruststück[a], ein Efod[b], ein Obergewand, ein gemustertes Untergewand[c], einen Turban und eine Schärpe. Sie sollen heilige Gewänder[d] für deinen Bruder Aaron und für seine Söhne anfertigen, damit er mir als Priester dient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell auch „Brustschild“. Gemeint ist ein besonderes priesterliches Stück, das auf der Brust getragen wurde; es war kein Rüstungsteil.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch Efod: ein besonderes priesterliches Kleidungsstück, für das es keine genaue deutsche Entsprechung gibt.'
    reason: cultural_note
  - marker: c
    text: Oder „kunstvoll gewebtes Untergewand“. Das hebräische Wort bezeichnet wahrscheinlich eine gemusterte oder besonders gearbeitete Webart.
    reason: lexical_alternative
  - marker: d
    text: Oder „geheiligte Gewänder“.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: Gewänder
  rationale: „Gewänder“ ist im Zusammenhang priesterlicher Kleidung natürlich und würdevoll, ohne den späteren kirchlichen Fachklang von „Ornate“ einzutragen.
- source_word: יַעֲשׂוּ
  choice: sie sollen anfertigen
  rationale: Der Imperfekt hat im Zusammenhang der göttlichen Anweisungen auffordernde Bedeutung; „sollen anfertigen“ gibt dies in aktuellem Deutsch wieder.
- source_word: חֹשֶׁן
  choice: Brusttasche
  rationale: Das kultische Kleidungsstück wurde auf der Brust getragen und war kein Rüstungsteil. „Brusttasche“ vermeidet die militärische Nebenbedeutung von „Brustschild“, legt die genaue Gestalt jedoch nicht ohne Fußnote fest.
- source_word: אֵפוֹד
  choice: Efod
  rationale: Für dieses besondere priesterliche Kleidungsstück gibt es keine genaue deutsche Entsprechung; deshalb wird der hebräische Fachbegriff übernommen.
- source_word: מְעִיל
  choice: Obergewand
  rationale: Das Wort bezeichnet hier das unter dem Efod getragene längere Gewand; „Obergewand“ ist verständlich und kontextgerecht.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: gemustertes Untergewand
  rationale: כְתֹנֶת bezeichnet ein körpernah getragenes Gewand; תַּשְׁבֵּץ weist wahrscheinlich auf eine besondere gemusterte oder kunstvolle Webarbeit hin. Die Formulierung wahrt diese gewisse Unschärfe.
- source_word: מִצְנֶפֶת
  choice: Turban
  rationale: „Turban“ ist die klare, übliche Bezeichnung für die gewickelte priesterliche Kopfbedeckung.
- source_word: אַבְנֵט
  choice: Schärpe
  rationale: Gemeint ist ein um den Körper gelegtes Stoffband; „Schärpe“ passt besser zum zeremoniellen Zusammenhang als das allgemeinere „Gürtel“.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: heilige Gewänder
  rationale: Die wörtliche Formulierung bewahrt die für den Abschnitt zentrale Heiligkeitssprache.
- source_word: לְאַהֲרֹן אָחִיךָ וּלְבָנָיו
  choice: für deinen Bruder Aaron und für seine Söhne
  rationale: Die Übersetzung erhält sowohl die direkte Anrede an Mose als auch die ausdrücklich männliche Bezeichnung der priesterlichen Söhne Aarons.
- source_word: לְכַהֲנוֹ לִי
  choice: damit er mir als Priester dient
  rationale: Die Zweckangabe und das singularische Suffix werden ausdrücklich wiedergegeben, ohne es stillschweigend in einen Plural umzudeuten.
theological_decisions:
- issue: Kultische Fachbegriffe der Priesterkleidung
  choice: Geläufige deutsche Bezeichnungen verwenden und den nicht genau entsprechenden Begriff אֵפוֹד als „Efod“ übernehmen.
  alternative: Alle Gegenstände beschreibend übersetzen oder traditionelle kirchliche Fachwörter verwenden.
  rationale: So bleibt die besondere israelitische Kultkleidung erkennbar, ohne spätere kirchliche Vorstellungen in den Text einzutragen.
- issue: Singular in לְכַהֲנוֹ nach der Nennung Aarons und seiner Söhne
  choice: „damit er mir als Priester dient“
  alternative: „damit sie mir als Priester dienen“
  rationale: Der hebräische Text hat ein Suffix der dritten Person Singular. Die Übersetzung bewahrt diese Spannung, statt sie wegen der zuvor genannten Söhne grammatisch auszugleichen.
- issue: Geschlechtsspezifische Bezeichnung von Aarons Nachkommen
  choice: „seine Söhne“
  alternative: „seine Kinder“ oder „seine Nachkommen“
  rationale: בָּנָיו bezeichnet an dieser Stelle ausdrücklich Aarons Söhne im priesterlichen Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der aufzählenden Struktur des Hebräischen, verwendet aber idiomatisches „anfertigen sollen“. Technische Kultsprache wird nur dort transliteriert, wo eine genaue deutsche Entsprechung fehlt. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
