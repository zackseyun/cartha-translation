base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: de
  text: Für Aarons Söhne sollst du Tuniken anfertigen. Du sollst für sie Schärpen und Kopfbedeckungen[a] anfertigen, zur Ehre und zur Zierde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kappen, Turbane oder Hauben.'
    reason: Die genaue Gestalt der mit מִגְבָּעוֹת bezeichneten priesterlichen Kopfbedeckungen ist unsicher.
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: für Aarons Söhne
  rationale: Die Formulierung bewahrt den direkten Bezug auf Aarons Söhne und klingt im modernen Deutschen natürlicher als „für die Söhne Aarons“.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: sollst du … anfertigen
  rationale: Die Formen haben im Anweisungskontext gebietenden Charakter. „Anfertigen“ passt zu eigens hergestellter Kleidung und „sollst du“ wahrt den würdevollen Weisungston.
- source_word: כֻתֳּנֹת
  choice: Tuniken
  rationale: Das Wort bezeichnet ein am Körper getragenes Grundgewand. „Tuniken“ ist präzise und vermeidet die modernen Fehlvorstellungen, die „Mäntel“ oder „Hemden“ hervorrufen könnten.
- source_word: אַבְנֵטִים
  choice: Schärpen
  rationale: Gemeint sind um den Leib gelegte textile Gürtel. „Schärpen“ gibt Material und Form im priesterlichen Kleidungskontext besser wieder als das modern und starr wirkende „Gürtel“.
- source_word: מִגְבָּעוֹת
  choice: Kopfbedeckungen
  rationale: Die genaue Form dieser priesterlichen Kopfbedeckungen ist nicht sicher. Der Oberbegriff wahrt diese Unbestimmtheit, ohne eine bestimmte Gestalt wie Kappe oder Turban festzulegen.
- source_word: לְכָבוֹד
  choice: zur Ehre
  rationale: כָּבוֹד kann Ehre, Herrlichkeit oder Würde bezeichnen. Im Zweckausdruck für Kleidung ist „zur Ehre“ verständlich und gehoben, ohne den Sinn unnötig einzuengen.
- source_word: וּלְתִפְאָרֶת
  choice: und zur Zierde
  rationale: תִּפְאֶרֶת bezeichnet Schönheit, Pracht oder schmückende Herrlichkeit. „Zierde“ erfasst hier die ästhetische und repräsentative Funktion der Gewänder.
theological_decisions:
- issue: Zweckbestimmung der priesterlichen Kleidung
  choice: zur Ehre und zur Zierde
  alternative: zur Herrlichkeit und zur Schönheit; zu Würde und Pracht
  rationale: Die Wiedergabe lässt die Kleidung sowohl ehrwürdig als auch ästhetisch-repräsentativ erscheinen, ohne eine spätere symbolische oder konfessionelle Deutung in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „anfertigen“ spiegelt den anweisenden Charakter des Hebräischen, während zwei deutsche Sätze die lange Reihung gut lesbar machen.
