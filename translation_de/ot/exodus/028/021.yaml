base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: de
  text: 'Und die Steine sollen den Namen der Söhne Israels entsprechen[a]: zwölf nach ihren Namen. Sie sollen mit Siegelgravuren versehen sein[b], jeder mit seinem Namen, für die zwölf Stämme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Namen der Söhne Israels tragen“. Wörtlich steht eine Wendung mit „sein“ und „auf/nach den Namen der Söhne Israels“, die hier die Zuordnung der Steine zu den Namen ausdrückt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie Siegelgravuren eingraviert sein“ beziehungsweise „mit der Gravur eines Siegels versehen sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Und die Steine
  rationale: Bewahrt die verbindende Konjunktion und die durch den Zusammenhang bestimmte Form.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: sollen den Namen der Söhne Israels entsprechen
  rationale: Das Verb bedeutet wörtlich „sein“; zusammen mit עַל und „Namen“ bezeichnet die Wendung hier die Zuordnung der Steine zu den Namen. „Entsprechen“ gibt diese Beziehung in natürlichem Deutsch wieder.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: zwölf nach ihren Namen
  rationale: Gibt sowohl die Zahl als auch die erneute Zuordnung zu den Namen knapp und quellennah wieder.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: wie ein Siegel graviert
  rationale: Die substantivische Verbindung bezeichnet eine Gravur in der Art einer Siegelgravur; die gewählte Formulierung ist im Deutschen verständlich und bewahrt das Siegelbild.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: jeder mit seinem Namen
  rationale: אִישׁ wird distributiv gebraucht. Die Formulierung macht deutlich, dass jeder Stein einen einzelnen Namen trägt.
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: für die zwölf Stämme
  rationale: Bewahrt die knappe Zweck- beziehungsweise Bezugsangabe des Schlusses.
theological_decisions:
- issue: Geschlechtsspezifische Bundesformel בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels; Israeliten
  rationale: Die hebräische Formulierung lautet wörtlich „Söhne Israels“. Sie wird als traditionelle, genealogische Bezeichnung beibehalten, ohne die zwölf Stämme auf ausschließlich männliche Angehörige zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, während „entsprechen“ und „mit seinem Namen“ unnatürliche wörtliche Wendungen vermeiden. Die Wiederholung von „Namen“ und die formelhafte Bezeichnung „Söhne Israels“ bleiben erhalten.
