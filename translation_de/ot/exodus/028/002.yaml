  text: וְ/עָשִׂ֥יתָ בִגְדֵי קֹ֖דֶשׁ לְ/אַהֲרֹ֣ן אָחִ֑י/ךָ לְ/כָב֖וֹד וּ/לְ/תִפְאָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/002.yaml
  text: And you shall make holy garments for Aaron your brother[a], for glory and for beauty.
translation:
  language: de
  text: Und du sollst für deinen Bruder Aaron heilige Gewänder anfertigen, zur Ehre und zum Schmuck.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zur Ehre und zur Schönheit; auch: zu Herrlichkeit und Pracht.'
    reason: Die Wörter כָּבוֹד und תִּפְאֶרֶת können je nach Zusammenhang Ehre beziehungsweise Herrlichkeit sowie Schönheit, Schmuck oder Pracht bezeichnen.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und du sollst … anfertigen
  rationale: Das Qal Perfekt 2. Person maskulin Singular mit וְ hat im Anweisungskontext gebietende Bedeutung. „Du sollst … anfertigen“ gibt den verbindlichen Auftrag natürlich und würdig wieder.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: heilige Gewänder
  rationale: Die Konstruktverbindung bezeichnet für den heiligen Dienst ausgesonderte Kleidung. „Gewänder“ passt zum feierlichen priesterlichen Kontext, ohne spätere kirchliche Fachsprache einzutragen.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: für deinen Bruder Aaron
  rationale: Die natürliche deutsche Wortstellung bewahrt sowohl die Zweckbestimmung für Aaron als auch seine ausdrücklich genannte familiäre Beziehung zu Mose.
- source_word: לְכָבוֹד
  choice: zu Ehre
  rationale: כָּבוֹד umfasst Ehre, Würde, Herrlichkeit und Pracht. In Bezug auf die Priestergewänder bezeichnet „Ehre“ verständlich ihre würdevolle Wirkung, ohne den Ausdruck ausschließlich auf göttliche Herrlichkeit festzulegen.
- source_word: וּלְתִפְאָרֶת
  choice: und Schmuck
  rationale: תִּפְאֶרֶת kann Schönheit, Pracht, Zierde oder Schmuck bezeichnen. „Schmuck“ ist hier idiomatisch und lässt neben ästhetischer Schönheit auch die repräsentative Zierwirkung der Gewänder anklingen.
theological_decisions:
- issue: Zweck beziehungsweise Wirkung der priesterlichen Gewänder
  choice: „zu Ehre und Schmuck“ beschreibt ihre würdevolle und schmückende Wirkung, ohne festzulegen, ob die Ehre vor allem Aaron, seinem Amt oder Gott gilt.
  alternative: „zu Herrlichkeit und Pracht“ beziehungsweise „zur Ehre und zur Schönheit“
  rationale: Die hebräischen Begriffe besitzen einen breiten Bedeutungsumfang. Die Übersetzung wahrt diese Offenheit und vermeidet es, die Aussage auf bloß menschliche Anerkennung oder ausschließlich göttliche Herrlichkeit zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Gewänder“ trägt den priesterlichen Kontext, „anfertigen“ bezeichnet die bewusste Herstellung. Die Fußnote erhält die echte lexikalische Spannweite des abschließenden Begriffspaars.
