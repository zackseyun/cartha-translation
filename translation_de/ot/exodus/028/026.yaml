  text: וְ/עָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְ/שַׂמְתָּ֣ אֹתָ֔/ם עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: de
  text: Du sollst zwei goldene Ringe anfertigen und sie an den beiden Enden des Brustschilds anbringen, an dessen Rand auf der dem Efod zugewandten Innenseite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an dessen Rand, der zum Efod hin nach innen liegt“. Wörtlich: „an seinem Rand, der zur Seite des Efods nach innen [liegt]“.'
    reason: Die genaue räumliche Zuordnung von „nach innen“ (hebräisch בָּיְתָה) bleibt in der knappen technischen Anweisung offen.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit וְ in der fortlaufenden Anweisungsreihe hat Gebotscharakter. „Du sollst … anfertigen“ ist im Deutschen würdig, klar und für eine handwerkliche Herstellung genauer als bloß „machen“.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: zwei goldene Ringe
  rationale: Die natürliche deutsche Form gibt Zahl, Gegenstand und Material ohne Bedeutungsverlust wieder.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: und sie … befestigen
  rationale: שׂים bedeutet grundsätzlich „setzen, legen, anbringen“. Da die Ringe an einem textilen Gegenstand angebracht werden, drückt „befestigen“ die kontextuelle Handlung natürlich aus, ohne eine besondere Befestigungstechnik festzulegen.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: an den beiden Enden der Brusttasche
  rationale: קָצֶה bezeichnet Ende oder äußersten Bereich. חֹשֶׁן wird im priesterlichen Gewandkontext als „Brusttasche“ wiedergegeben, da das Stück nach Exodus 28,16 doppelt gelegt und zur Aufnahme der Lose bestimmt ist.
- source_word: עַל שְׂפָתוֹ
  choice: an ihrem Rand
  rationale: שָׂפָה kann „Lippe, Kante, Rand“ bedeuten. Bei einem textilen Werkstück ist „Rand“ die natürlichste deutsche Bezeichnung.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: der auf der Innenseite dem Efod zugewandt ist
  rationale: 'עֵבֶר bezeichnet die Seite bzw. Ausrichtung, und בָּיְתָה bedeutet „nach innen“. Die Formulierung wahrt die räumliche Zuordnung: Gemeint ist der nach innen zum Efod weisende Rand.'
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, verständlichem Anweisungsstil. „Efod“ bleibt als etablierter kultischer Fachbegriff erhalten; „Brusttasche“ wird gegenüber dem weniger anschaulichen „Brustschild“ bevorzugt. Die räumlich schwierige Schlussformulierung wird klar wiedergegeben, ohne eine über den hebräischen Wortlaut hinausgehende Konstruktionsweise festzulegen.
