  yaml_path: translation/ot/exodus/028/031.yaml
  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: de
  text: Du sollst das Obergewand zum Efod vollständig aus blauem Purpur anfertigen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ganz aus blauem Purpur«; gemeint ist, dass das Obergewand vollständig aus diesem Material gefertigt wird.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck bezeichnet einen kostbaren gefärbten Stoff beziehungsweise Faden in einem Farbton von Blau bis Blauviolett.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Das Qal-Perfekt mit וְ führt die Anweisungsfolge fort und hat hier gebietenden Sinn. Die Formulierung bewahrt den verbindlichen Ton und ist im Deutschen natürlich.
- source_word: מְעִיל
  choice: Obergewand
  rationale: Bezeichnet ein priesterliches Gewand; »Obergewand« ist verständlich und gibt die Kleidungsart genauer wieder als das allgemeinere »Gewand«.
- source_word: הָאֵפֹד
  choice: zum Efod
  rationale: »Efod« bleibt als technischer Name des priesterlichen Kleidungsstücks erhalten. Das deutsche »zum Efod« gibt die konstruktartige Zuordnung des Obergewands zum Efod natürlich wieder.
- source_word: כְּלִיל
  choice: vollständig
  rationale: Das Wort bezeichnet Ganzheit beziehungsweise Vollständigkeit und wird hier idiomatisch adverbial wiedergegeben.
- source_word: תְּכֵלֶת
  choice: blauer Purpur
  rationale: Der Ausdruck bezeichnet einen kostbaren, blau bis blauviolett gefärbten Stoff beziehungsweise Faden. »Blauer Purpur« ist im deutschen Bibelregister verständlich und unterscheidet den Farbstoff vom bloßen Farbadjektiv »blau«.
