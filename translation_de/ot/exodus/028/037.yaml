  yaml_path: translation/ot/exodus/028/037.yaml
  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: de
  text: Du sollst es an einer blauen Schnur[a] befestigen. Es soll am Turban sein, vorn am Turban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an einem blauen Faden« oder »an einer blauen Kordel«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »zur Vorderseite des Turbans hin«; die Formulierung beschreibt die Ausrichtung zur Vorderseite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Du sollst es … befestigen
  rationale: שׂים bedeutet grundsätzlich »setzen, legen, anbringen«. Im Zusammenhang mit der Schnur gibt »befestigen« die beabsichtigte Handlung im natürlichen Deutschen präzise wieder.
- source_word: פְּתִיל
  choice: Schnur
  rationale: פְּתִיל bezeichnet einen Faden oder eine Schnur zum Anbringen beziehungsweise Befestigen. »Schnur« passt hier zur Funktion am goldenen Stirnblatt.
- source_word: תְּכֵלֶת
  choice: blau
  rationale: תְּכֵלֶת bezeichnet den kostbaren blauen Farbstoff beziehungsweise die entsprechend gefärbte Textilie. Der genaue Farbton ist nicht sicher bestimmbar; »blau« ist klar und zurückhaltend.
- source_word: מִצְנֶפֶת
  choice: Turban
  rationale: מִצְנֶפֶת ist die gewundene Kopfbedeckung des Hohenpriesters; »Turban« ist dafür im modernen Deutschen treffend und verständlich.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: vorn am Turban
  rationale: Die Wendung bezeichnet die Ausrichtung beziehungsweise Lage gegenüber der Vorderseite. »Vorn am Turban« gibt die räumliche Anweisung idiomatisch wieder.
- source_word: יִהְיֶה
  choice: es soll … sein
  rationale: Der Imperfekt setzt die Anweisung fort und wiederholt nachdrücklich die vorgeschriebene Lage.
