revisions:
- from: Und du sollst mit allen sprechen, die ein weises Herz haben[a] und die ich mit einem Geist der Weisheit[b] erfüllt habe. Sie sollen Aarons Gewänder anfertigen, um ihn zu heiligen, damit er mir als Priester dient.
  to: Und du sollst zu allen sprechen, die weisen Herzens sind[a] und die ich mit einem Geist der Weisheit[b] erfüllt habe; sie sollen Aarons Gewänder anfertigen, um ihn zu weihen, damit er mir als Priester dient.
  rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: Die Rede wird wie im Hebräischen an die Begabten gerichtet, und Aarons kultische Einsetzung wird mit „weihen“ statt des im Deutschen weniger passenden „heiligen“ bezeichnet. Die Ambiguität von רוּחַ חָכְמָה bleibt im Haupttext und in der Fußnote erhalten; die Fußnotenanker sind korrekt gesetzt.'
