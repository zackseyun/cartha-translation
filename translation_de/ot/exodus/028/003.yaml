  source_fidelity: 'Die Grundstruktur und die wesentlichen Begriffe sind zutreffend wiedergegeben: die Weisheit bzw. Befähigung der angesprochenen Personen, Gottes Erfüllen mit einem Geist der Weisheit, Aarons Gewänder sowie sein Dienst für Gott als Priester. Für לְקַדְּשׁוֹ ist im Kontext der Amtseinsetzung jedoch „weihen“ die präzisere und im heutigen Deutsch natürlichere Wiedergabe als „heiligen“.'
  naturalness: Der Text ist insgesamt verständlich und würdig. „Zu allen sprechen“ gibt die mit אֶל markierte Ausrichtung der Rede genauer wieder als „mit allen sprechen“, das eher ein wechselseitiges Gespräch nahelegen kann. „Weisen Herzens“ bewahrt das hebräische Idiom in einer im biblisch-würdigen Standardregister geläufigen deutschen Form.
  terminology: „Ein Geist der Weisheit“ wahrt die fehlende Bestimmtheit des Hebräischen und vermeidet eine dogmatisch verengende Festlegung. „Weihen“ trifft die kultisch-priesterliche Bedeutung von קדשׁ hier, ohne die Aussage zu erweitern. Aaron und „als Priester dienen“ sind korrekt.
