  text: וְ/אַתָּ֗ה תְּדַבֵּר֙ אֶל כָּל חַכְמֵי לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖י/ו ר֣וּחַ חָכְמָ֑ה וְ/עָשׂ֞וּ אֶת בִּגְדֵ֧י אַהֲרֹ֛ן לְ/קַדְּשׁ֖/וֹ לְ/כַהֲנ/וֹ לִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: de
  text: Und du sollst zu allen sprechen, die weisen Herzens sind[a] und die ich mit einem Geist der Weisheit[b] erfüllt habe; sie sollen Aarons Gewänder anfertigen, um ihn zu weihen, damit er mir als Priester dient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alle Weisen des Herzens“; gemeint sind Menschen, denen Weisheit, Verständnis und insbesondere handwerkliches Können gegeben ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Geist der Weisheit“. Der hebräische Ausdruck kann einen von Gott verliehenen Geist beziehungsweise eine Befähigung zur Weisheit bezeichnen, ohne die Beziehung zu Gottes Geist genauer festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: du sollst ... sprechen
  rationale: Das Piel-Imperfekt steht hier in einem Anweisungszusammenhang; „sollst“ gibt den verpflichtenden Charakter in natürlichem Deutsch wieder.
- source_word: חַכְמֵי לֵב
  choice: die ein weises Herz haben
  rationale: Die Formulierung bewahrt das hebräische Bild vom Herzen als Sitz des Verstehens und Könnens; im Zusammenhang schließt die Weisheit handwerkliche Befähigung ein.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: die ich mit einem Geist der Weisheit erfüllt habe
  rationale: „Erfüllt“ bewahrt das Bild von מלא; der unbestimmte Ausdruck „ein Geist der Weisheit“ legt nicht ausdrücklich fest, ob unmittelbar Gottes Geist oder eine von Gott verliehene Befähigung gemeint ist. Das singularische Suffix wird seinem kollektiven Bezugswort entsprechend im Deutschen pluralisch wiedergegeben.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: Aarons Gewänder
  rationale: Die Genitivverbindung wird knapp und genau wiedergegeben; „priesterlich“ wird nicht ergänzt, da es in dieser Wortgruppe nicht ausdrücklich steht.
- source_word: לְקַדְּשׁוֹ
  choice: um ihn zu heiligen
  rationale: „Heiligen“ erhält die Grundbedeutung von קדשׁ und bezeichnet hier die Aussonderung und Weihe Aarons für den heiligen Dienst.
- source_word: לְכַהֲנוֹ לִי
  choice: damit er mir als Priester dient
  rationale: Das Verb כהן bezeichnet das Dienen beziehungsweise Wirken als Priester; „mir“ bewahrt לִי als den auf Gott ausgerichteten Dienst.
- source_word: וְעָשׂוּ
  choice: Sie sollen ... anfertigen
  rationale: Das Perfekt mit ו setzt im Anweisungszusammenhang die Aufforderung fort. „Anfertigen“ ist für Gewänder idiomatisch und bewahrt den Sinn von עשׂה.
theological_decisions:
- issue: Ob רוּחַ חָכְמָה ausdrücklich als Bezeichnung des Heiligen Geistes zu verstehen ist
  choice: ein Geist der Weisheit
  alternative: der Geist der Weisheit
  rationale: Der hebräische Ausdruck hat keinen Artikel und kann sowohl eine von Gott verliehene innere Befähigung als auch Gottes wirkenden Geist bezeichnen. Die Übersetzung bewahrt diese Offenheit und vermeidet eine über den Wortlaut hinausgehende trinitarische Festlegung.
- issue: Bedeutung von קדשׁ bei Aarons Einsetzung
  choice: heiligen
  alternative: weihen
  rationale: „Heiligen“ bewahrt die lexikalische und theologische Verbindung zur Heiligkeit, während der Kontext deutlich macht, dass es um die Aussonderung für den Priesterdienst geht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Herzmetapher bleibt erhalten, wird aber durch eine natürliche deutsche Relativkonstruktion verständlich gemacht. Die zwei hebräischen Zweckangaben werden als „um ... damit ...“ wiedergegeben, sodass ihre enge Folge klar bleibt.
