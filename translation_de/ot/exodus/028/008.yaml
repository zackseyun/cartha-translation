  text: וְ/חֵ֤שֶׁב אֲפֻדָּת/וֹ֙ אֲשֶׁ֣ר עָלָ֔י/ו כְּ/מַעֲשֵׂ֖/הוּ מִמֶּ֣/נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֥שׁ מָשְׁזָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: de
  text: 'Der kunstvoll gewebte Gurt des Efods[a], der sich daran befindet, soll in derselben Machart gefertigt sein und mit ihm eine Einheit bilden[b]: aus Gold, blauem und purpurfarbenem Garn, Karmesingarn und gezwirntem feinem Leinen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Efod war ein besonderes priesterliches Kleidungsstück, das über anderen Gewändern getragen wurde.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich etwa: „wie seine Machart; aus ihm soll er sein“. Das Hebräische betont, dass der Gurt in seiner Ausführung zum Efod passte und eng zu ihm gehörte; die genaue technische Herstellungsweise wird nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: c
    text: „Blau“, „Purpur“ und „Karmesin“ bezeichnen hier gefärbte Textilmaterialien, die für das Heiligtum und die Priesterkleidung verwendet wurden.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב
  choice: kunstvoll gewebter Gurt
  rationale: Im Zusammenhang der priesterlichen Kleidung bezeichnet das Wort ein gearbeitetes textiles Band beziehungsweise einen Gurt; die Wiedergabe macht Funktion und handwerkliche Ausführung deutlich.
- source_word: אֲפֻדָּתוֹ
  choice: des Efods
  rationale: „Efod“ ist die etablierte Bezeichnung für das priesterliche Kleidungsstück; der Possessivbezug wird im Deutschen durch den Genitiv gewahrt.
- source_word: אֲשֶׁר עָלָיו
  choice: der sich daran befindet
  rationale: Das Suffix bezieht sich im unmittelbaren Sachzusammenhang am ehesten auf den Efod. „Daran“ wahrt den räumlichen Bezug, ohne eine bestimmte Befestigungsweise zu behaupten.
- source_word: כְּמַעֲשֵׂהוּ
  choice: in derselben Machart
  rationale: Die Formulierung bezeichnet die Übereinstimmung der handwerklichen Ausführung des Gurtes mit der des Efods.
- source_word: מִמֶּנּוּ יִהְיֶה
  choice: mit ihm aus einem Stück gefertigt sein
  rationale: 'Wörtlich heißt es etwa: „aus/von ihm soll er sein“. Im Textilkontext wird damit die Einheit mit dem Efod betont; die Fußnote bewahrt die wörtlichere Ausdrucksweise und deren Spielraum.'
- source_word: זָהָב
  choice: Gold
  rationale: Direkte Wiedergabe der Materialangabe.
- source_word: תְּכֵלֶת
  choice: blauem Garn
  rationale: Der traditionelle Farb- und Textilbegriff wird im Kontext der aufgezählten Garne als blaues Garn wiedergegeben.
- source_word: אַרְגָּמָן
  choice: purpurfarbenem Garn
  rationale: Die Wiedergabe bezeichnet die Purpurfärbung und macht den textilen Charakter der Materialliste deutlich.
- source_word: תוֹלַעַת שָׁנִי
  choice: Karmesingarn
  rationale: Der Ausdruck bezeichnet mit Karmesin beziehungsweise Scharlach gefärbtes Textilmaterial; „Karmesingarn“ ist präzise und gut verständlich.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntem Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte beziehungsweise verzwirnte Verarbeitung.
