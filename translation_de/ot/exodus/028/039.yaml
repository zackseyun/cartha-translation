  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: de
  text: Das Untergewand sollst du aus feinem Leinen mit einem eingewebten Muster anfertigen[a]. Auch einen Turban sollst du aus feinem Leinen anfertigen, und eine Schärpe sollst du in kunstvoller Stickarbeit herstellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Untergewand sollst du aus feinem Leinen mit einem Karomuster anfertigen.“ Das hebräische Verb bezeichnet wahrscheinlich die Herstellung eines gemusterten Gewebes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ הַכְּתֹנֶת
  choice: Das Untergewand sollst du … mit einem eingewebten Muster anfertigen
  rationale: שׁבץ bezeichnet hier wahrscheinlich die Herstellung eines gemusterten Textils. Die Formulierung gibt sowohl das textile Verfahren als auch das Ergebnis natürlich wieder, ohne ein bestimmtes Karomuster als sicher vorauszusetzen. כְּתֹנֶת ist im Zusammenhang der Priesterkleidung das unter der Oberbekleidung getragene Gewand.
- source_word: שֵׁשׁ
  choice: feines Leinen
  rationale: Im Zusammenhang mit Heiligtum und Priesterkleidung bezeichnet שֵׁשׁ hochwertiges Leinen; „feines Leinen“ bewahrt Material und gehobene Qualität.
- source_word: מִצְנֶפֶת
  choice: Turban
  rationale: Das Wort bezeichnet die um den Kopf gewundene priesterliche Kopfbedeckung; „Turban“ ist im modernen Deutschen klar und etabliert.
- source_word: אַבְנֵט
  choice: Schärpe
  rationale: Gemeint ist ein langes, schmückendes Kleidungsstück für die Taille. „Schärpe“ ist präziser als „Gürtel“ und weniger altertümlich als „Gurt“.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: als Kunststickerarbeit
  rationale: Die Wendung bezeichnet kunstvolle textile Arbeit eines spezialisierten Handwerkers. „Kunststickerarbeit“ ist knapp, würdig und bewahrt den handwerklichen Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Verpflichtungsform „sollst du“ bildet die hebräischen Verbformen ab; bei שׁבץ bleibt offen, ob ausdrücklich ein Karomuster oder allgemeiner ein eingewebtes Muster gemeint ist.
