base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: de
  text: Sie sollen den Efod aus Gold[a], blauem und purpurfarbenem Garn, karmesinrotem Garn und feinem gezwirntem Leinen anfertigen, in kunstvoller Musterarbeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Goldfäden“. Im Hebräischen steht hier nur „Gold“; im Zusammenhang kann Gold gemeint sein, das in den Stoff eingearbeitet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Werk eines kunstfertigen Gestalters“. Die hebräische Wendung bezeichnet kunstvoll geplante, gemusterte Arbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Sie sollen … anfertigen
  rationale: Das Qal-Perfekt mit וְ setzt die Anweisungsfolge fort und hat hier auffordernden Sinn. „Sollen … anfertigen“ gibt den verbindlichen Auftrag in natürlichem modernem Deutsch wieder.
- source_word: הָאֵפֹד
  choice: den Efod
  rationale: „Efod“ ist die etablierte Umschrift für ein besonderes priesterliches Kleidungsstück; eine beschreibende Übersetzung würde seine genaue Gestalt stärker festlegen, als der Ausdruck erlaubt.
- source_word: זָהָב
  choice: Gold
  rationale: Der hebräische Text nennt ausdrücklich nur „Gold“. Dass es für die Verarbeitung zu Fäden geschnitten wurde, ergibt sich näher aus Exodus 39,3, wird hier aber nicht in den Haupttext eingetragen.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: blauem und purpurfarbenem Garn
  rationale: Die Farbbezeichnungen stehen in einer Liste von Textilmaterialien. „Garn“ verdeutlicht im Deutschen den sachlichen Zusammenhang, ohne eine bestimmte moderne Farbnuance übermäßig festzulegen.
- source_word: תּוֹלַעַת שָׁנִי
  choice: karmesinrotem Garn
  rationale: Die feste Wendung bezeichnet mit Karmesin gefärbtes Material. Die Wiedergabe benennt Farbe und textile Verwendung verständlich.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: feinem gezwirntem Leinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte beziehungsweise gedrehte Verarbeitung.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: in kunstvoller Webarbeit
  rationale: Die Wendung bezeichnet geplante, kunstfertige Musterarbeit. „Webarbeit“ passt zum textilen Kontext und vermeidet die zu enge Festlegung auf Stickerei.
