revisions:
- from: Man soll die Brusttasche mit einer Schnur aus blauem Purpur[a] an ihren Ringen mit den Ringen des Efods verbinden. So liegt sie auf der kunstvoll gewebten Binde des Efods und kann sich nicht vom Efod lösen.
  to: Sie sollen das Bruststück mit einer Schnur aus blauem Purpur[a] durch seine Ringe mit den Ringen des Efods verbinden, damit es auf der kunstvoll gewebten Binde des Efods aufliegt und nicht vom Efod verrutscht.
  rationale: Die Revision stellt den imperativischen Vorschriftscharakter und den Zweck der Befestigung wieder her. „Bruststück“ ist im modernen Standarddeutsch eine neutralere Bezeichnung für das priesterliche Kleidungsstück als „Brusttasche“. „Verrutscht“ bildet die Aussage über das Wegbewegen von seiner Lage auf dem Efod präziser ab. Die vorhandene Fußnote wird unverändert beibehalten, da sie die umstrittene Farbbezeichnung angemessen erläutert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:43:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbezüge sind richtig erfasst: Das Bruststück wird mittels seiner Ringe mit den Ringen des Efods und einer blauen Schnur befestigt. Die indikativische Folgerung „So liegt sie … und kann sich nicht … lösen“ gibt jedoch den hebräischen Zweckausdruck לִהְיוֹת sowie die Vorschrift וְלֹא יִזַּח weniger genau wieder.'
  naturalness: Die Formulierung ist überwiegend klar. „Brusttasche“ klingt im heutigen Deutsch allerdings leicht nach einer Tasche an einem Kleidungsstück; „Bruststück“ ist für das selbstständige priesterliche Kleidungsstück neutraler. Eine einheitliche Pluralanweisung und ein damit-Satz sind idiomatisch und näher am Satzbau der Anweisung.
  terminology: „Efod“ ist als Fachbezeichnung angemessen. „Binde“ für חֵשֶׁב ist vertretbar; „kunstvoll gewebt“ entspricht dem Kontext. Die Fußnote zu תְּכֵלֶת wahrt zutreffend die Farbunsicherheit, ohne sie einseitig festzulegen.
  issues:
  - severity: medium
    issue: Der Zweck- und Anweisungssinn wird zu einer Tatsachenfeststellung abgeschwächt.
    rationale: לִהְיוֹת עַל leitet den Zweck der Befestigung ein, und וְלֹא יִזַּח ist Teil der Anweisung. „So liegt sie … und kann sich nicht … lösen“ ist indikativisch und modal faktisch. „damit es … aufliegt und nicht … verrutscht“ bewahrt Zweck und Vorschrift.
  - severity: low
    issue: „Brusttasche“ ist im modernen Deutsch potenziell missverständlich.
    rationale: Das hebräische חֹשֶׁן bezeichnet hier ein eigenständiges priesterliches Bruststück, nicht eine an einem Gewand angebrachte Tasche. „Bruststück“ bleibt sachlich und vermeidet eine unnötige Festlegung der genauen Form.
  - severity: low
    issue: „sich … lösen“ ist enger als der räumliche Bezug des hebräischen Ausdrucks.
    rationale: יִזַּח מֵעַל bezeichnet, dass das Bruststück von seiner Lage auf dem Efod wegbewegt bzw. verrückt wird. „vom Efod verrutschen“ gibt dies im Kleidungskontext natürlich wieder, ohne vollständiges Ablösen zu behaupten.
  revised_text: Sie sollen das Bruststück mit einer Schnur aus blauem Purpur[a] durch seine Ringe mit den Ringen des Efods verbinden, damit es auf der kunstvoll gewebten Binde des Efods aufliegt und nicht vom Efod verrutscht.
