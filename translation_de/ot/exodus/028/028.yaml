base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: de
  text: Sie sollen das Bruststück mit einer Schnur aus blauem Purpur[a] durch seine Ringe mit den Ringen des Efods verbinden, damit es auf der kunstvoll gewebten Binde des Efods aufliegt und nicht vom Efod verrutscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer blauen Schnur“. Das hebräische Wort bezeichnet einen blau bis blauviolett gefärbten Textilstoff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: Man soll … verbinden
  rationale: Das Verb bezeichnet das Zusammenfügen beziehungsweise sichere Befestigen. „Verbinden“ passt zu den Ringen und der Schnur, ohne die genaue Bindetechnik festzulegen.
- source_word: הַחֹשֶׁן
  choice: die Brusttasche
  rationale: Im Zusammenhang der Priesterkleidung ist ein am Efod befestigtes, taschenartiges Bruststück gemeint, keine Rüstung. „Brusttasche“ gibt Form und Funktion verständlich wieder.
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: an ihren Ringen mit den Ringen des Efods
  rationale: Die Präpositionen markieren die Befestigung von den Ringen der Brusttasche zu denen des Efods; die deutsche Formulierung beschreibt diese Verbindung natürlich.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: mit einer Schnur aus blauem Purpur
  rationale: פְּתִיל ist eine Schnur oder Kordel. תְּכֵלֶת bezeichnet den wertvollen blau bis blauviolett gefärbten Textilstoff der Heiligtumstexte; „blauer Purpur“ ist dafür ein etablierter deutscher Ausdruck.
- source_word: לִהְיוֹת עַל
  choice: So liegt sie auf
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise Ergebnis der Befestigung. „liegt … auf“ wahrt die räumliche Aussage, ohne das Verhältnis näher auszudeuten.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: die kunstvoll gewebte Binde des Efods
  rationale: חֵשֶׁב bezeichnet hier die zum Efod gehörende gewebte Binde beziehungsweise den Gurt; „kunstvoll gewebt“ entspricht der Beschreibung dieses Bestandteils im Kontext.
- source_word: וְלֹא יִזַּח
  choice: kann sich nicht … lösen
  rationale: Die Nifalform bezeichnet ein Verrutschen, Ablösen oder Entferntwerden. Im konkreten Befestigungszusammenhang ist „sich nicht lösen“ natürlich und lässt offen, ob Verrutschen oder vollständiges Ablösen im Vordergrund steht.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdevolle Anweisungssprache. „Man soll“ gibt die unpersönliche dritte Person Plural des hebräischen Vorschriftstils im Deutschen natürlich wieder. Die Satzteilung erleichtert das Verständnis der komplexen Kleidungsanweisung.
