  to: Es soll auf Aarons Stirn sein, und Aaron soll die Schuld tragen, die mit allen heiligen Gaben verbunden ist, welche die Söhne Israels weihen.[a] Es soll beständig auf seiner Stirn sein, damit sie vor Jahwe Annahme finden.[b]
