  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: de
  text: Es soll auf Aarons Stirn sein, und Aaron soll die Schuld tragen, die mit allen heiligen Gaben verbunden ist, welche die Söhne Israels weihen.[a] Es soll beständig auf seiner Stirn sein, damit sie vor Jahwe Annahme finden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Aaron soll die Schuld der heiligen Dinge tragen, die die Söhne Israels weihen, bei allen Gaben ihrer heiligen Dinge“. Die hebräische Formulierung ist syntaktisch gedrängt. „Schuld tragen“ kann auch das Tragen der mit den geheiligten Gaben verbundenen Schuldhaftung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit sie vor Jahwe Wohlgefallen finden“; der Zusammenhang kann auch die Annahme ihrer Gaben einschließen.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: Stirn
  rationale: Das Wort bezeichnet die Stirn beziehungsweise die Vorderseite des Kopfes; „Stirn“ ist im Deutschen klar und natürlich.
- source_word: נָשָׂא ... עֲוֺן
  choice: die Schuld tragen
  rationale: Die priesterliche Wendung bezeichnet das Tragen von Schuld beziehungsweise Schuldhaftung. Die Formulierung bewahrt den rechtlich-kultischen Sinn, ohne bereits zu erklären, wie diese Schuld behandelt wird.
- source_word: הַקֳּדָשִׁים
  choice: die heiligen Gaben
  rationale: Der substantivierte Plural bezeichnet hier die geheiligten Opfergaben beziehungsweise Dinge. „Heilige Gaben“ macht den kultischen Bezug verständlich, ohne ihn unnötig einzuengen.
- source_word: יַקְדִּישׁוּ
  choice: heiligen
  rationale: Das Verb bezeichnet das Aussondern beziehungsweise Weihen für Gott. „Heiligen“ wahrt die Wortverbindung mit den „heiligen Gaben“ und passt zum gehobenen biblischen Register.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Bundesbezeichnung wird entsprechend dem hebräischen Wortlaut beibehalten; sie bezeichnet das Volk Israel als Ganzes.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: an allen ihren heiligen Gaben
  rationale: Die syntaktisch schwierige Präpositionalphrase wird auf die Schuld bezogen, die den Gaben anhaften kann. Diese deutsche Formulierung bleibt knapp und vermeidet die unnatürliche Doppelung „Gaben ihrer heiligen Dinge“.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort fordert eine fortdauernde Präsenz. „Beständig“ ist würdig und bezeichnet hier klar das ununterbrochene Tragen.
- source_word: לְרָצוֹן לָהֶם
  choice: damit sie Annahme finden
  rationale: Die Zweck- beziehungsweise Ergebnisangabe wird idiomatisch wiedergegeben. Das Pronomen bleibt auf die Israeliten bezogen, ohne den Zusammenhang mit ihren Gaben auszuschließen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
theological_decisions:
- issue: Bedeutung davon, dass Aaron die Schuld der heiligen Gaben trägt
  choice: Aaron trägt die mit den heiligen Gaben verbundene Schuld beziehungsweise Schuldhaftung.
  alternative: Aaron beseitigt unmittelbar die Sünde der Gaben oder trägt lediglich symbolisch die Erinnerung an Israels Sünden.
  rationale: Die Wendung נָשָׂא עָוֺן kann in priesterlichen Texten das Tragen von Schuld oder Haftung bezeichnen. Die Übersetzung bewahrt diese Spannung und legt keine umfassende Sühnetheorie in den Vers hinein.
- issue: Bezug von „damit sie Annahme finden“
  choice: Das Pronomen bezieht sich vorrangig auf die Söhne Israels, und zwar im Zusammenhang mit ihren geheiligten Gaben.
  alternative: Nur die Gaben selbst finden Annahme.
  rationale: Das hebräische לָהֶם („für sie“) weist grammatisch auf die Menschen zurück; der unmittelbare Opferkontext lässt jedoch ihre Gaben mitgemeint sein. Die Übersetzung verengt den Bezug nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kultisch-rechtliche Charakter bleibt erhalten; schwer verständliche hebräische Nominalverbindungen werden maßvoll geglättet. „Jahwe“ gibt das Tetragramm als Gottesnamen wieder.
