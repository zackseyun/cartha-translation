  naturalness: „Er soll auf Aarons Stirn sein“ ist im Deutschen ohne ausdrücklich genanntes Bezugswort unnötig unklar; „Es“ ist hier die neutrale und verständliche anaphorische Form. Die Neufassung ordnet die Satzglieder klarer, ohne die kultisch-rechtliche Aussage zu paraphrasieren.
