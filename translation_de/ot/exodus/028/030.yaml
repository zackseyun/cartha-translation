source:
  edition: WLC
  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: de
  text: Du sollst die Urim und die Tummim[a] in die Brusttasche des Rechtsspruchs[b] legen. Sie sollen auf Aarons Herzen sein, wenn er vor Jahwe tritt. Und Aaron soll den Rechtsspruch der Söhne Israels[c] beständig auf seinem Herzen vor Jahwe tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urim und Tummim sind die hebräischen Namen heiliger Gegenstände, die mit priesterlichen Rechtssprüchen beziehungsweise Entscheidungen verbunden waren. Ihre genaue Gestalt und Funktionsweise sind nicht sicher bekannt. Mögliche etymologische Wiedergaben lauten „Lichter“ und „Vollkommenheiten“.
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Brusttasche für Entscheidungen“ oder „Brusttasche des Rechts“. Das hebräische Wort מִשְׁפָּט kann je nach Zusammenhang Rechtsspruch, Entscheidung, Recht oder Gerechtigkeit bezeichnen.'
    reason: alternative_reading
  - marker: c
    text: „Söhne Israels“ entspricht dem hebräischen Ausdruck und bezeichnet hier das Bundesvolk Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: die Brusttasche des Rechtsspruchs
  rationale: חֹשֶׁן bezeichnet das priesterliche Bruststück, das hier als Behältnis für Urim und Tummim dient; „Brusttasche“ gibt diese Funktion im Deutschen anschaulich wieder. „Rechtsspruch“ bewahrt die Verbindung beider Vorkommen von מִשְׁפָּט und lässt dessen richterlich-entscheidenden Sinn erkennen.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: die Urim und die Tummim
  rationale: Die Bezeichnungen werden als Namen besonderer priesterlicher Gegenstände transkribiert, da Gestalt, Gebrauch und Etymologie nicht sicher bestimmt werden können.
- source_word: אֶל
  choice: in
  rationale: In Verbindung mit נתן und der als Behältnis dienenden Brusttasche bezeichnet die Präposition das Hineinlegen.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: Sie sollen auf Aarons Herzen sein
  rationale: Die konkrete Lage des getragenen Bruststücks und die sinnbildliche Bedeutung des Herzens bleiben gleichermaßen erhalten.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: wenn er vor Jahwe tritt
  rationale: Die deutsche Wendung gibt Aarons Eintritt beziehungsweise sein Herantreten in die Gegenwart Jahwes natürlich wieder, ohne den Heiligtumskontext unnötig auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְנָשָׂא
  choice: soll … tragen
  rationale: „Tragen“ umfasst sowohl das körperliche Tragen des Bruststücks als auch Aarons stellvertretende Verantwortung.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: den Rechtsspruch der Söhne Israels
  rationale: „Rechtsspruch“ bewahrt die lexikalische Wiederholung von מִשְׁפָּט und dessen Sinn als maßgebliche Entscheidung, ohne den schwer eindeutigen Genitiv näher festzulegen.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche Bundesbezeichnung wird bewahrt; eine Fußnote verdeutlicht, dass damit das Bundesvolk Israel gemeint ist.
- source_word: תָּמִיד
  choice: beständig
  rationale: Das Wort bezeichnet im priesterlichen Zusammenhang eine fortdauernde beziehungsweise regelmäßig aufrechterhaltene Aufgabe, nicht zwingend eine in jedem Augenblick ausgeführte Handlung.
theological_decisions:
- issue: Semantische Übersetzung oder Transkription von אוּרִים und תֻּמִּים
  choice: Urim und Tummim
  alternative: Lichter und Vollkommenheiten
  rationale: Eine Übersetzung nach möglichen Etymologien würde umstrittene Herleitungen als gesicherte Bedeutung erscheinen lassen. Die Transkription wahrt die Unsicherheit über Art und Funktion der Gegenstände.
- issue: Bedeutung von מִשְׁפָּט an beiden Stellen
  choice: Rechtsspruch
  alternative: Entscheidung; Recht; Gerechtigkeit
  rationale: „Rechtsspruch“ wahrt die Wiederholung und den Gedanken einer maßgeblichen priesterlichen Entscheidung, ohne den Begriff ausschließlich auf Orakelentscheidung oder abstrakte Gerechtigkeit festzulegen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten; Volk Israel
  rationale: Die hebräische Form wird als traditionelle Bundesbezeichnung beibehalten. Die Fußnote erklärt ihren kollektiven Bezug, ohne den Haupttext stillschweigend zu neutralisieren.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt, dass im hebräischen Text der persönliche Gottesname steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die Satzstruktur folgt den hebräischen Hauptsätzen, ohne unnatürliche Wörtlichkeit. „Brusttasche“ ist für heutige Leser anschaulicher als „Brustschild“ und passt zur Aufnahme von Urim und Tummim; „Rechtsspruch“ hält die zentrale Wortwiederholung sichtbar.
