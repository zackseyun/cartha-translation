base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: de
  text: Sie sollen von Aaron und seinen Söhnen getragen werden, wenn sie in das Zelt der Begegnung hineingehen oder an den Altar herantreten, um im Heiligtum Dienst zu verrichten, damit sie nicht Schuld auf sich laden[a] und sterben. Das soll für ihn und seine Nachkommen nach ihm eine bleibende Ordnung sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Schuld tragen“; die hebräische Wendung kann auch „Schuld auf sich ziehen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine ewige Ordnung“; traditionell auch „eine immerwährende Satzung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: Sie sollen … tragen
  rationale: Die wörtliche Wendung „sie sollen auf Aaron und seinen Söhnen sein“ bezeichnet im Zusammenhang das Tragen der zuvor genannten Beinkleider. Die deutsche Formulierung macht diesen Bezug natürlich verständlich, ohne den Gegenstand neu zu benennen.
- source_word: בְּבֹאָם אֶל אֹהֶל מוֹעֵד
  choice: wenn sie in das Zelt der Begegnung hineingehen
  rationale: Die Infinitivkonstruktion bezeichnet den Zeitpunkt des Eintretens. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד sachlich und verständlich wieder.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: wenn sie … an den Altar herantreten
  rationale: נגשׁ bezeichnet hier das kultische Nahen; „herantreten“ bewahrt diesen feierlich-sachlichen Sinn.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: um im Heiligtum Dienst zu tun
  rationale: שרת bezeichnet den priesterlichen Dienst. בַּקֹּדֶשׁ kann den heiligen Bereich beziehungsweise das Heiligtum meinen; „im Heiligtum“ ist im Kontext natürlich, ohne den Bereich enger festzulegen.
- source_word: וְלֹא יִשְׂאוּ עָוֺן
  choice: damit sie nicht Schuld auf sich laden
  rationale: Die rechtlich-kultische Wendung נשׂא עון wird möglichst bildnah wiedergegeben. Der deutsche Zwecksatz bringt die vorbeugende Funktion der Kleidervorschrift zum Ausdruck.
- source_word: וָמֵתוּ
  choice: und sterben
  rationale: Die harte Folge des schuldhaften Verstoßes bleibt entsprechend dem hebräischen Text ausdrücklich stehen.
- source_word: חֻקַּת עוֹלָם
  choice: eine bleibende Ordnung
  rationale: Die Wendung bezeichnet eine dauerhaft geltende Vorschrift. „Bleibend“ ist modernes Deutsch und vermeidet, עוֹלָם ohne Kontextprüfung metaphysisch als absolute Ewigkeit festzulegen.
- source_word: זַרְעוֹ אַחֲרָיו
  choice: seine Nachkommen nach ihm
  rationale: זֶרַע ist hier eine kollektive Bezeichnung für Aarons Nachkommenschaft; „Nachkommen“ ist im modernen Deutschen klar und idiomatisch.
theological_decisions:
- issue: Folge eines unvorschriftsmäßigen priesterlichen Zutritts
  choice: Die vorgeschriebenen Kleidungsstücke sollen getragen werden, damit die Priester nicht Schuld auf sich laden und sterben.
  alternative: „damit sie nicht schuldig werden und sterben“
  rationale: Die gewählte Fassung bewahrt sowohl das rechtlich-kultische Bild des Schuldtragens als auch die im Text ausdrücklich genannte Todesfolge und schwächt die Spannung der Heiligkeitsforderung nicht ab.
- issue: Zeitliche Reichweite von חֻקַּת עוֹלָם
  choice: bleibende Ordnung
  alternative: „ewige Ordnung“ oder „immerwährende Satzung“
  rationale: עולם bezeichnet in gesetzlichen Formeln eine fortdauernde, unabsehbar gültige Ordnung. „Bleibend“ wahrt diese Dauer, ohne eine über den Text hinausgehende systematische Festlegung zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultisch-sachlichem Ton. „Dienst tun“ und „herantreten“ erhalten die priesterliche Färbung, ohne altertümlich zu wirken. Die Pronomen beziehen sich auf die im vorangehenden Vers genannten Beinkleider.
