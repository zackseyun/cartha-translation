base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: de
  text: Das Gewand soll in seiner Mitte eine Öffnung für den Kopf haben. Rings um diese Öffnung soll ein gewebter Rand sein, wie die Öffnung eines Panzerhemds[a], damit das Gewand nicht einreißt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie die Öffnung einer Rüstung« beziehungsweise »eines Brustpanzers«. Das hebräische Wort תַּחְרָא ist selten. Der Vergleich bezieht sich wahrscheinlich auf eine verstärkte Öffnung, die nicht leicht einreißt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: die Öffnung für den Kopf
  rationale: פֶּה bedeutet wörtlich »Mund«, bezeichnet bei einem Kleidungsstück aber dessen Öffnung; רֹאשׁוֹ gibt hier den Kopf als Zweck der Öffnung an.
- source_word: בְּתוֹכוֹ
  choice: in seiner Mitte
  rationale: Die Formulierung bezeichnet die Lage der Kopföffnung innerhalb beziehungsweise in der Mitte des Gewandes.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: einen gewebten Rand
  rationale: שָׂפָה ist hier der Rand oder Saum der Öffnung; מַעֲשֵׂה אֹרֵג beschreibt ihn als Weberarbeit. »Gewebter Rand« ist sachlich und im Deutschen natürlich.
- source_word: לְפִיו סָבִיב
  choice: rings um seine Öffnung
  rationale: פֶּה bezeichnet erneut die Gewandöffnung, während סָבִיב den vollständig umlaufenden Rand ausdrückt.
- source_word: כְּפִי תַחְרָא
  choice: wie die Öffnung eines Panzerhemds
  rationale: Das seltene תַחְרָא bezeichnet wahrscheinlich ein schützendes, verstärktes Gewand beziehungsweise eine Rüstung. »Panzerhemd« bewahrt den wahrscheinlichen antiken Vergleich, ohne die lexikalische Unsicherheit zu verschweigen.
- source_word: יִהְיֶה לּוֹ
  choice: soll es ... haben
  rationale: Die hebräische Dativkonstruktion wird als natürliche deutsche Besitzkonstruktion wiedergegeben.
- source_word: לֹא יִקָּרֵעַ
  choice: damit es nicht einreißt
  rationale: Der Nifal kann passiv mit »zerrissen werden« wiedergegeben werden; im Zusammenhang bezeichnet die Formulierung Zweck beziehungsweise Ergebnis der Verstärkung. »Nicht einreißt« ist bei einem Gewand idiomatisch.
