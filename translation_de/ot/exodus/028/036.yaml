review_pass:
  verdict: revise
  source_fidelity: Die Anweisung, eine goldene Platte anzufertigen und die Formel קֹדֶשׁ לַיהוָה darauf einzugravieren, wird zutreffend wiedergegeben. „Jahwe“ entspricht dem Tetragramm. Die hebräische Wendung פִּתּוּחֵי חֹתָם bezeichnet jedoch die Art der Gravur („nach Art einer Siegelgravur“), nicht das Eingravieren in einen Siegelstein.
  naturalness: '„wie in einen Siegelstein eingravieren“ ist im Deutschen syntaktisch und sachlich missverständlich: Es legt nahe, dass die Inschrift in einen Siegelstein statt auf die Goldplatte graviert wird. „nach Art einer Siegelgravur“ ist idiomatisch und präzise.'
  terminology: „Platte aus reinem Gold“ ist für צִּיץ angemessen, ohne die Gestalt übermäßig festzulegen. Die knappe Inschrift „Heilig für Jahwe“ ist als mögliche Wiedergabe vertretbar; die substantivische Alternative bleibt sinnvoll in der Fußnote erhalten.
  issues:
  - severity: medium
    issue: Wiedergabe von פִּתּוּחֵי חֹתָם
    rationale: Die Formulierung „wie in einen Siegelstein“ verschiebt den Bezug der Gravur und macht aus der Vergleichsangabe zur Gravurtechnik einen Ort bzw. Gegenstand der Gravur. Der hebräische Ausdruck verlangt eine Formulierung wie „nach Art einer Siegelgravur“.
  revised_text: 'Du sollst eine Platte aus reinem Gold[a] anfertigen und darauf nach Art einer Siegelgravur eingravieren: »Heilig für Jahwe.«[b]'
  revised_footnotes:
  - marker: a
    text: Das hebräische Wort kann auch eine Blüte oder Rosette bezeichnen; hier ist ein goldener Schmuck an der Kopfbedeckung des Hohepriesters gemeint.
    reason: lexical_alternative
