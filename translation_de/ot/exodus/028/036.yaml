source:
  edition: WLC
  text: וְ/עָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּ/פִתַּחְתָּ֤ עָלָי/ו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: de
  text: 'Du sollst eine Platte aus reinem Gold[a] anfertigen und darauf nach Art einer Siegelgravur eingravieren: »Heilig für Jahwe.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch eine Blüte oder Rosette bezeichnen; hier ist ein goldener Schmuck an der Kopfbedeckung des Hohepriesters gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Heiligkeit für Jahwe.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anfertigen
  rationale: Die Verbform mit וְ führt die Reihe verbindlicher Anweisungen fort; „sollst“ wahrt den direktiven Charakter, „anfertigen“ passt zum kunsthandwerklichen Zusammenhang.
- source_word: צִּיץ
  choice: Platte
  rationale: Das Wort kann sonst eine Blüte oder Rosette bezeichnen, meint hier jedoch den goldenen Schmuck an der Kopfbedeckung des Hohepriesters. „Platte“ ist im Deutschen verständlich, ohne die genaue Form stärker festzulegen als der Text.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Die Formulierung gibt Material und Qualität des Gegenstands natürlich und genau wieder.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: und darauf … eingravieren
  rationale: פתח bezeichnet hier das Einschneiden einer Inschrift in Metall; „eingravieren“ trifft die handwerkliche Tätigkeit.
- source_word: פִּתּוּחֵי חֹתָם
  choice: wie in einen Siegelstein
  rationale: Der hebräische Plural bezeichnet Gravurarbeiten beziehungsweise die Art einer Siegelgravur. Die deutsche Formulierung gibt die Herstellungsweise anschaulich wieder und vermeidet die missverständliche Vorstellung, das Siegel selbst werde graviert.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Heilig für Jahwe
  rationale: Die knappe Inschriftenformel kann substantivisch oder prädikativ verstanden werden. „Heilig für Jahwe“ bewahrt ihre Kürze und drückt die Zugehörigkeit beziehungsweise Weihe aus, ohne sie unnötig auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den persönlichen Gottesnamen.
- issue: Deutung der Inschrift קֹדֶשׁ לַיהוָה
  choice: Heilig für Jahwe
  alternative: Heiligkeit für Jahwe
  rationale: קֹדֶשׁ kann hier als abstraktes Substantiv „Heiligkeit“ oder in der knappen Inschrift mit prädikativ-adjektivischem Sinn verstanden werden. Der Haupttext wahrt die prägnante Widmungsformel; die substantivische Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und der verbindliche Anweisungston bleiben erhalten. Die Inschrift ist bewusst knapp formuliert; „Jahwe“ gibt den hebräischen Gottesnamen wieder.
