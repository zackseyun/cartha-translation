base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: de
  text: Aaron soll es tragen, wenn er seinen Dienst verrichtet. Der Klang davon soll zu hören sein, wenn er vor Jahwe das Heiligtum betritt und wenn er es verlässt, damit er nicht stirbt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er wird nicht sterben“; die Verbindung kann hier auch Zweck oder verhinderte Folge ausdrücken: „damit er nicht stirbt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Aaron soll es tragen
  rationale: Die Vorschrift bezieht sich auf das zuvor beschriebene Obergewand. Die natürliche deutsche Formulierung macht das Tragen deutlich, ohne den Sinn zu erweitern.
- source_word: לְשָׁרֵת
  choice: wenn er seinen Dienst verrichtet
  rationale: Der Infinitiv mit ל kann Zweck oder begleitenden Umstand ausdrücken; hier passt eine temporale Wiedergabe im Zusammenhang des Priesterdienstes.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: Sein Klang soll zu hören sein
  rationale: Das Suffix bezieht sich im unmittelbaren Zusammenhang am ehesten auf das Obergewand mit seinen Glöckchen. „Klang“ bezeichnet ihr hörbares Läuten natürlich.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: wenn er … das Heiligtum betritt
  rationale: Der temporale Infinitiv bezeichnet Aarons Hineingehen; הַקֹּדֶשׁ benennt hier den heiligen Bereich des Zeltheiligtums.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet die Gegenwart Jahwes; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וּבְצֵאתוֹ
  choice: und wenn er wieder herauskommt
  rationale: Die Form steht parallel zu בְּבֹאוֹ und bezeichnet den Zeitpunkt des Hinausgehens. „Wieder“ markiert im Deutschen natürlich die Gegenbewegung.
- source_word: וְלֹא יָמוּת
  choice: damit er nicht stirbt
  rationale: Im kultisch-rechtlichen Zusammenhang drückt die koordinierte Klausel die verhinderte Folge beziehungsweise den Zweck der Vorschrift aus.
theological_decisions:
- issue: Bezug des hörbaren Klangs
  choice: Der Klang ist der des Obergewands beziehungsweise seiner Glöckchen.
  alternative: Der Klang bezeichnet allgemeiner Aarons Bewegung oder Anwesenheit.
  rationale: Die unmittelbar vorausgehenden Verse beschreiben Glöckchen am Saum des Obergewands; sie sind daher der naheliegendste Bezug.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe mit „Jahwe“ lässt den persönlichen Gottesnamen im deutschen Text erkennbar bleiben.
- issue: Funktion der Schlussklausel
  choice: 'Zweck beziehungsweise verhinderte Folge: „damit er nicht stirbt“'
  alternative: 'Parataktische Folge: „und er wird nicht sterben“; Warnung: „sonst muss er sterben“'
  rationale: Die gewählte Fassung ist in modernem Deutsch klar und bewahrt den lebensschützenden Zusammenhang der Vorschrift, ohne den genauen Wirkmechanismus zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Heiligtum“ vermeidet eine möglicherweise zu enge Gleichsetzung von הַקֹּדֶשׁ mit einem bestimmten Innenraum, während der Kontext den heiligen Bereich des Zeltheiligtums erkennen lässt.
