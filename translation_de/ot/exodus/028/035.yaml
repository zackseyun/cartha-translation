  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: das zuvor beschriebene Gewand soll Aaron beim Dienst tragen; sein Klang wird beim Eintreten vor Jahwe und beim Hinausgehen gehört; dies steht mit dem Nichtsterben Aarons in Zusammenhang. „Wieder“ in „wieder herauskommt“ ist jedoch nicht ausdrücklich im Hebräischen markiert. Die Fußnote bietet zudem mit „sonst muss er sterben“ keine angemessene Alternative zum hebräischen וְלֹא יָמוּת.'
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „Der Klang davon“ stellt den Bezug auf das Gewand klarer her als „Sein Klang“, das nach dem unmittelbar vorangehenden „Aaron“ missverständlich auf Aaron bezogen werden kann. „Es verlässt“ ist präzise und vermeidet die nicht markierte Ergänzung „wieder“.
  terminology: „Heiligtum“, „Dienst verrichtet“ und „Jahwe“ sind im Kontext angemessen. Die Wiedergabe des Gottesnamens stimmt mit der englischen POB-Entscheidung überein. Die Schlusswendung „damit er nicht stirbt“ ist als kontextuelle Zweck-/Folgewiedergabe möglich, sollte aber durch eine präzise Fußnote als nicht rein wörtliche Satzverknüpfung kenntlich bleiben.
  issues:
  - severity: medium
    issue: Der possessive Bezug in „Sein Klang“ ist im Deutschen potenziell mehrdeutig.
    rationale: Das Hebräische bezieht das Suffix im unmittelbaren Kontext am wahrscheinlichsten auf das Gewand beziehungsweise dessen Glöckchen. Nach „Aaron“ kann deutsches „sein“ jedoch leicht als Aarons Klang verstanden werden. „Der Klang davon“ klärt den wahrscheinlichen Bezug, ohne den Text weiter auszudeuten.
  - severity: low
    issue: „Wieder“ in „wenn er wieder herauskommt“ ist eine nicht ausdrücklich markierte Ergänzung.
    rationale: וּבְצֵאתוֹ bedeutet schlicht „und bei seinem Hinausgehen“. Zwar ist die Gegenbewegung kontextuell naheliegend, doch „wenn er es verlässt“ ist genauer.
  - severity: medium
    issue: Die Fußnote paraphrasiert die Schlussklausel mit „sonst muss er sterben“.
    rationale: Der hebräische Wortlaut lautet formal „und er wird nicht sterben“. Eine Warnungsnuance kann kontextuell erschlossen werden, aber „muss“ ist nicht im Text ausgedrückt und sollte nicht als gleichwertige Übersetzungsalternative ausgegeben werden.
  revised_text: Aaron soll es tragen, wenn er seinen Dienst verrichtet. Der Klang davon soll zu hören sein, wenn er vor Jahwe das Heiligtum betritt und wenn er es verlässt, damit er nicht stirbt.[a]
  revised_footnotes:
