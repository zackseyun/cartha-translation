source:
  edition: WLC
  text: וְ/עָשִׂיתָ֮ שְׁתֵּ֣י טַבְּע֣וֹת זָהָב֒ וְ/נָתַתָּ֣ה אֹתָ֡/ם עַל שְׁתֵּי֩ כִתְפ֨וֹת הָ/אֵפ֤וֹד מִ/לְּ/מַ֨טָּה֙ מִ/מּ֣וּל פָּנָ֔י/ו לְ/עֻמַּ֖ת מֶחְבַּרְתּ֑/וֹ מִ/מַּ֕עַל לְ/חֵ֖שֶׁב הָ/אֵפֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: de
  text: Du sollst zwei goldene Ringe anfertigen und sie an den beiden Schulterstücken des Efods anbringen, unten an seiner Vorderseite, gegenüber seiner Verbindungsstelle[a], oberhalb der kunstvoll gewebten Binde des Efods[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „seiner Naht“, „seiner Verbindung“ oder „seinem Ansatzpunkt“. Das hebräische Wort bezeichnet allgemein die Stelle, an der der Efod zusammengefügt ist.
    reason: lexical_alternative
  - marker: b
    text: Oder „des gewebten Gürtels des Efods“. Das hebräische Wort חֵשֶׁב bezeichnet das eigens gefertigte band- oder gürtelartige Teil des Efods.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעוֹת
  choice: Ringe
  rationale: Das Substantiv bezeichnet hier Metallringe, die zur Befestigung an der priesterlichen Kleidung dienen.
- source_word: כִתְפוֹת
  choice: Schulterstücke
  rationale: Im Zusammenhang mit der Herstellung eines Kleidungsstücks sind die Schulterpartien beziehungsweise gefertigten Schulterstücke des Efods gemeint.
- source_word: הָאֵפוֹד
  choice: der Efod
  rationale: „Efod“ ist die eingebürgerte Bezeichnung für dieses besondere priesterliche Kleidungsstück; eine knappe deutsche Entsprechung gibt es nicht.
- source_word: מִלְּמַטָּה
  choice: unten
  rationale: Die Wendung bezeichnet die tiefer gelegene Stelle an den Schulterstücken; „unten“ ist räumlich klar und natürlich.
- source_word: מִמּוּל פָּנָיו
  choice: an seiner Vorderseite
  rationale: Die wörtliche Rede von seinem „Angesicht“ bezeichnet bei einem Gegenstand dessen Vorderseite.
- source_word: לְעֻמַּת
  choice: gegenüber
  rationale: Die Präposition bezeichnet eine räumliche Entsprechung oder Ausrichtung zu der folgenden Stelle.
- source_word: מֶחְבַּרְתּוֹ
  choice: seiner Verbindungsstelle
  rationale: Das Wort bezeichnet allgemein die Stelle, an der Teile zusammengefügt oder verbunden sind; „Verbindungsstelle“ bewahrt diese Breite besser als das engere „Naht“.
- source_word: מִמַּעַל
  choice: oberhalb
  rationale: Das Wort gibt die Lage über dem anschließend genannten Bezugspunkt an.
- source_word: לְחֵשֶׁב הָאֵפוֹד
  choice: der kunstvoll gewebten Binde des Efods
  rationale: חֵשֶׁב bezeichnet hier das besonders gefertigte, band- oder gürtelartige Teil des Efods. „Binde“ vermeidet die Festlegung auf einen modernen Gürtel, während „kunstvoll gewebt“ den handwerklichen Zusammenhang wiedergibt.
theological_decisions: []
