  yaml_path: translation/ot/exodus/028/007.yaml
  text: It shall have two shoulder pieces joined to its two ends[b][a], so that it may be joined together.
translation:
  language: de
  text: Es soll zwei Schulterstücke haben, die an seinen beiden Enden befestigt sind[a]; dadurch wird es zusammengefügt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwei Schulterbänder“. Das hebräische Wort bezeichnet hier schulterbezogene Teile des Kleidungsstücks, nicht körperliche Schultern.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „und es wird zusammengefügt“. Die Verbindung kann im Zusammenhang auch als Folge oder Zweck verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: zwei Schulterstücke
  rationale: כְתֵפֹת bezeichnet hier keine Körperteile, sondern die über den Schultern liegenden Teile des Efods. „Schulterstücke“ ist im Deutschen sachlich und verständlich.
- source_word: חֹבְרֹת
  choice: miteinander verbunden
  rationale: Das Partizip von חבר beschreibt die Schulterstücke als verbindende beziehungsweise verbundene Teile. Die Wiedergabe bewahrt den Zusammenhang mit dem abschließenden Verb derselben Wurzel.
- source_word: יִהְיֶה לּוֹ
  choice: Es soll … haben
  rationale: Die hebräische Besitzkonstruktion mit היה und ל wird im Deutschen idiomatisch mit „haben“ wiedergegeben; das Pronomen bezieht sich auf den Efod aus dem vorhergehenden Vers.
- source_word: אֶל שְׁנֵי קְצוֹתָיו
  choice: an seinen beiden Enden
  rationale: אֶל bezeichnet hier die Verbindung mit den beiden Enden; קָצֶה meint die jeweiligen Enden beziehungsweise äußersten Ränder des Kleidungsstücks.
- source_word: וְחֻבָּר
  choice: sodass es zusammengefügt wird
  rationale: Das passive Verb von חבר beschreibt das Ergebnis der Verbindung. „Sodass“ gibt den im Zusammenhang naheliegenden Folgesinn der Konjunktion wieder, ohne die passive Aussage aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der hebräischen Wurzel חבר wird durch „verbunden“ und „zusammengefügt“ erkennbar gehalten; die technische Beschreibung bleibt dennoch natürlich verständlich.
