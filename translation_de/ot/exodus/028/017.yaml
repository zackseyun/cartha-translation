  text: וּ/מִלֵּאתָ֥ ב/וֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: de
  text: 'Und du sollst es mit eingefassten Edelsteinen besetzen,[a] mit vier Reihen von Steinen: In der ersten Reihe sollen ein Rubin, ein Topas und ein Smaragd sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung dieser Edelsteine ist unsicher. Mit „Rubin“ könnte auch „Karneol“, mit „Topas“ auch „Chrysolith“ oder „Peridot“ und mit „Smaragd“ auch „Beryll“ gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: du sollst es mit eingefassten Edelsteinen besetzen
  rationale: מלא bedeutet grundsätzlich „füllen“, bezeichnet hier im kunsthandwerklichen Zusammenhang aber das Besetzen des Brustschilds mit eingefassten Steinen. Die deutsche Formulierung gibt diesen Vorgang natürlich wieder.
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: vier Reihen von Steinen
  rationale: טוּר bezeichnet hier eine geordnete Reihe; das singularische אֶבֶן ist kollektiv gebraucht.
- source_word: טוּר ... הָאֶחָד
  choice: in der ersten Reihe
  rationale: Die Wendung kennzeichnet die erste von vier aufeinanderfolgenden Reihen.
- source_word: אֹדֶם
  choice: Rubin
  rationale: Die genaue Bestimmung ist unsicher. „Rubin“ ist eine verständliche traditionelle Wiedergabe; „Karneol“ bleibt als Alternative in der Fußnote erhalten.
- source_word: פִּטְדָה
  choice: Topas
  rationale: Die Mineralart ist nicht sicher bestimmbar. „Topas“ folgt der verbreiteten Übersetzungstradition; mögliche Alternativen werden in der Fußnote genannt.
- source_word: בָרֶקֶת
  choice: Smaragd
  rationale: Das Wort hängt wohl mit Glanz oder Funkeln zusammen, doch die genaue Mineralart ist umstritten. Die herkömmliche Wiedergabe „Smaragd“ wird mit einer Fußnote abgesichert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die handwerkliche Aussage wird idiomatisch wiedergegeben, während die Unsicherheit bei der Bestimmung der antiken Edelsteine ausdrücklich bewahrt bleibt.
