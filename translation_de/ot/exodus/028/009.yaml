  text: וְ/לָ֣קַחְתָּ֔ אֶת שְׁתֵּ֖י אַבְנֵי שֹׁ֑הַם וּ/פִתַּחְתָּ֣ עֲלֵי/הֶ֔ם שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/009.yaml
  text: And you shall take two onyx stones and engrave on them the names of the sons of Israel[a].
translation:
  language: de
  text: Dann nimm zwei Onyxsteine[a] und graviere die Namen der Söhne Israels darauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort schoham bezeichnet einen Edelstein, der traditionell als „Onyx“ wiedergegeben wird. Seine genaue Bestimmung ist unsicher; vorgeschlagen wurden unter anderem Sardonyx und Beryll.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann nimm
  rationale: Das Qal-Perfekt mit vorangestelltem Waw setzt die Anweisungsfolge fort und hat hier Befehlscharakter. „Dann nimm“ gibt sowohl die Abfolge als auch die direktive Funktion in natürlichem modernem Deutsch wieder.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: zwei Onyxsteine
  rationale: שֹׁהַם bezeichnet einen Edelstein, dessen genaue mineralogische Bestimmung unsicher ist. „Onyx“ entspricht der verbreiteten traditionellen Wiedergabe; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: וּפִתַּחְתָּ
  choice: und graviere
  rationale: Im Zusammenhang mit Namen, die in Edelsteine eingeschnitten werden, bezeichnet „gravieren“ den Vorgang präzise und idiomatisch.
- source_word: עֲלֵיהֶם
  choice: darauf
  rationale: Das Pronomen bezieht sich auf die beiden Steine. „Darauf“ ist die natürliche deutsche Wiedergabe der räumlichen Beziehung.
- source_word: שְׁמוֹת
  choice: die Namen
  rationale: Gemeint sind die bestimmten, aus dem Zusammenhang bekannten Namen; daher steht im Deutschen der bestimmte Artikel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Hier sind die namentlich festgehaltenen Stammväter gemeint, nicht allgemein das Volk Israel. Die wörtlich präzise Wiedergabe „Söhne Israels“ bewahrt diesen Bezug.
