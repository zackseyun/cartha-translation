  yaml_path: translation/ot/exodus/028/016.yaml
  text: It shall be square and doubled[a], a span its length and a span its width.
translation:
  language: de
  text: Es soll quadratisch und doppelt sein, eine Spanne lang und eine Spanne breit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָבוּעַ
  choice: quadratisch
  rationale: Das Adjektiv bezeichnet hier eine quadratische Form; „quadratisch“ ist im modernen Deutschen präzise und natürlich.
- source_word: יִהְיֶה
  choice: Es soll … sein
  rationale: Das Imperfekt formuliert in diesem Zusammenhang eine verbindliche Anweisung zur Herstellung.
- source_word: כָּפוּל
  choice: doppelt gelegt
  rationale: Das passive Partizip beschreibt das Stück als gedoppelt beziehungsweise übereinandergelegt, ohne ausdrücklich festzulegen, auf welche Weise dies geschieht.
- source_word: זֶרֶת
  choice: Spanne
  rationale: Das Wort bezeichnet ein Längenmaß, das der Breite einer ausgespannten Hand entspricht; „Spanne“ ist die sachlich passende deutsche Bezeichnung.
- source_word: אָרְכּוֹ
  choice: lang
  rationale: 'Die idiomatische deutsche Maßangabe „eine Spanne lang“ gibt die wörtliche Konstruktion „seine Länge: eine Spanne“ natürlich wieder.'
- source_word: וְזֶרֶת
  choice: und eine Spanne
  rationale: Die Wiederholung der Maßeinheit wird im Deutschen klar und natürlich beibehalten.
- source_word: רָחְבּוֹ
  choice: breit
  rationale: „Eine Spanne breit“ ist die natürliche deutsche Entsprechung der Maßformel und wahrt den Gegensatz zur Länge.
