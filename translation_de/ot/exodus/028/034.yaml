  text: a gold bell and a pomegranate[a], a gold bell and a pomegranate[b], around the hem of the robe all around.
translation:
  language: de
  text: eine goldene Schelle und ein Granatapfel, eine goldene Schelle und ein Granatapfel[b], ringsum am Saum des Obergewands[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „am Saum des Obergewands ringsum“. Das Hebräische verbindet die Präposition „an/auf“ mit einem Adverb im Sinn von „ringsum“.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Granatapfel“ ist hier wahrscheinlich ein granatapfelförmiger Besatz zwischen den Schellen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: Schelle
  rationale: Das Wort bezeichnet hier eine kleine, am priesterlichen Gewand befestigte Glocke. „Schelle“ ist im Deutschen für eine kleine, an Kleidung angebrachte Glocke besonders passend.
- source_word: זָהָב
  choice: golden
  rationale: Die attributive Wiedergabe „goldene Schelle“ ist natürliches Deutsch und bezeichnet wie das Hebräische das Material.
- source_word: רִמּוֹן
  choice: Granatapfel
  rationale: Die Grundbedeutung wird im Haupttext bewahrt; im Zusammenhang ist wahrscheinlich ein granatapfelförmiger Besatz gemeint.
- source_word: עַל ... סָבִיב
  choice: ringsum am
  rationale: Die Verbindung aus der Präposition „an/auf“ und dem Adverb „ringsum“ beschreibt idiomatisch die den ganzen Saum umlaufende Anordnung.
- source_word: שׁוּלֵי
  choice: Saum
  rationale: Im Zusammenhang eines Kleidungsstücks bezeichnet der Ausdruck dessen unteren Rand beziehungsweise Saum.
- source_word: מְעִיל
  choice: Obergewand
  rationale: „Obergewand“ gibt das priesterliche Kleidungsstück genauer wieder als das allgemeinere „Gewand“ und ist in modernem Standarddeutsch verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung des Musters wird entsprechend dem Hebräischen beibehalten; „ringsum“ gibt die vollständig umlaufende Anordnung knapp und natürlich wieder.
