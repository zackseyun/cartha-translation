  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen wieder: fachmännische Steinbearbeitung, Gravur nach Art von Siegelgravuren, die beiden Steine, die Namen der Söhne Israels und goldene Fassungen. Die Abfolge „Wie bei der Arbeit eines Steingraveurs, als Siegelgravuren“ ist jedoch syntaktisch nicht tragfähig und bildet die beiden technischen Vergleichsangaben nicht idiomatisch ab.'
  naturalness: „Als Siegelgravuren“ lässt im Deutschen offen bzw. nahe, die Steine selbst seien Siegelgravuren; gemeint ist vielmehr die Art der Ausführung. „Nach der Kunst eines Steingraveurs, in der Art von Siegelgravuren“ ist verständliches, würdevolles modernes Standarddeutsch und wahrt den handwerklichen Registerton.
  terminology: „Söhne Israels“, „gravieren“ und „goldene Fassungen“ sind treffend. „Einfassen“ gibt die umgebenden bzw. montierenden Goldfassungen angemessen wieder, ohne die genaue antike Fassungstechnik zu überbestimmen. Die Anmerkung ist sachlich zutreffend und ihr Anker bleibt bei „Söhne Israels“.
