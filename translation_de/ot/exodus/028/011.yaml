  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: de
  text: Nach der Kunst eines Steingraveurs, in der Art von Siegelgravuren, sollst du die beiden Steine mit den Namen der Söhne Israels[a] gravieren; du sollst sie in goldene Fassungen einfassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint sind die zwölf Söhne Jakobs, der auch Israel genannt wurde, als Stammväter der Stämme Israels.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: wie bei der Arbeit eines Steingraveurs
  rationale: Die Wendung bezeichnet die fachgerechte Ausführung durch einen Steinhandwerker; wegen des unmittelbaren Zusammenhangs mit eingravierten Namen ist „Steingraveur“ präziser als das allgemeinere „Steinmetz“.
- source_word: פִּתּוּחֵי חֹתָם
  choice: als Siegelgravuren
  rationale: Die Constructusverbindung beschreibt Gravuren in der Art eines Siegels. Die knappe Formulierung gibt sowohl die Technik als auch den Vergleichscharakter wieder.
- source_word: תְּפַתַּח
  choice: sollst du … gravieren
  rationale: Das Verb bezeichnet hier das Einschneiden einer Inschrift in die Steine; „gravieren“ ist im Deutschen die sachlich und idiomatisch passende Entsprechung.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: die beiden Steine
  rationale: „Steine“ bewahrt die allgemeine Bezeichnung des Hebräischen, ohne die Art der Schmucksteine über den Text hinaus näher festzulegen.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: mit den Namen der Söhne Israels
  rationale: Die Präposition bezeichnet hier den Inhalt der Gravur. „Mit den Namen“ ist natürliches Deutsch; „Söhne Israels“ bewahrt die genealogische Formulierung des Ausgangstextes.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: in goldene Fassungen einfassen
  rationale: Die Formulierung beschreibt von goldenen Schmuckfassungen umgebene beziehungsweise darin eingesetzte Steine. „Einfassen“ vermeidet die schwerfällige Wiederholung „in Fassungen fassen“ und lässt die genaue antike Technik offen.
theological_decisions:
- issue: Geschlechtsspezifische Familienbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels / Israeliten
  rationale: Im unmittelbaren Zusammenhang sind die namensgebenden Stammväter gemeint. Die konkrete männliche und genealogische Bezeichnung des Hebräischen wird daher bewahrt, ohne die Formulierung auf das gesamte Volk umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die handwerkliche Fachsprache bleibt verständlich; der zweimalige Auftrag wird zur natürlichen deutschen Satzführung in zwei Sätze gegliedert. Die mögliche Nuance von Siegel beziehungsweise Siegelring wird nicht unnötig verengt.
