base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: de
  text: Du sollst deinen Bruder Aaron und mit ihm seine Söhne bekleiden. Du sollst sie salben, sie in ihr Amt einsetzen[a] und sie heiligen, und sie sollen mir als Priester dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Hand füllen“; eine hebräische Wendung für die Einsetzung in den Priesterdienst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Du sollst … bekleiden
  rationale: Das Hifil von לבשׁ bezeichnet hier das Anlegen der zuvor beschriebenen Priestergewänder. „Bekleiden“ bewahrt den kausativen Sinn knapp und in gehobenem, verständlichem Deutsch.
- source_word: אֹתָם אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: deinen Bruder Aaron und mit ihm seine Söhne
  rationale: Die namentliche Angabe erläutert das vorangestellte Objektpronomen. Im Deutschen kann das Pronomen ohne Bedeutungsverlust entfallen; „mit ihm“ bewahrt die Zuordnung der Söhne zu Aaron.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Du sollst sie salben
  rationale: משׁח ist im Zusammenhang der priesterlichen Einsetzung der sachgemäße Ritualbegriff „salben“.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: sie in ihr Amt einsetzen
  rationale: Die wörtliche Wendung „ihre Hand füllen“ ist ein hebräisches Idiom für die förmliche Einsetzung in den Priesterdienst. Die gewählte Formulierung gibt die Funktion wieder, ohne einen späteren konfessionellen Ordinationsbegriff einzutragen.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: und sie heiligen
  rationale: קדשׁ bezeichnet hier das Absondern für den heiligen Dienst. „Heiligen“ wahrt die eigenständige Aussage neben der Amtseinsetzung.
- source_word: וְכִהֲנוּ לִי
  choice: damit sie mir als Priester dienen
  rationale: Das Piel von כהן bedeutet, als Priester zu wirken oder zu dienen. Der Zwecksatz gibt im Deutschen die sachliche Folge der vorausgehenden Einsetzung natürlich wieder; „mir“ bewahrt den Bezug von לִי.
theological_decisions:
- issue: Wiedergabe der priesterlichen Einsetzungsformel מִלֵּא אֶת־יָד
  choice: idiomatisch mit „in ihr Amt einsetzen“
  alternative: wörtlich „ihre Hand füllen“; auch „sie ordinieren“
  rationale: Die Wendung meint die Einsetzung in den priesterlichen Dienst, nicht das buchstäbliche Füllen von Händen. „In ihr Amt einsetzen“ ist verständlich und vermeidet, spätere konfessionelle Vorstellungen von Ordination in den Text hineinzutragen. Die wörtliche Gestalt bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Sätze machen die Folge der rituellen Handlungen klar. „Heiligen“ bleibt bewusst neben „in ihr Amt einsetzen“ stehen, damit die im Hebräischen unterschiedenen Handlungen nicht miteinander verschmolzen werden.
