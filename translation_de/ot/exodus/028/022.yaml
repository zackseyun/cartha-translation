  text: And you shall make on the breastpiece chains of pure gold[a], braided work like cords.
translation:
  language: de
  text: Und du sollst am Brustschild Ketten aus reinem Gold machen, in geflochtener, schnurartiger Arbeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: als gedrehte beziehungsweise schnurartig gearbeitete Ketten; der seltene hebräische Ausdruck beschreibt eine geflochtene, gedrehte oder seilartige Machart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Und du sollst … machen
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die Folge der Anweisungen fort und hat hier gebietenden Sinn. „Du sollst … machen“ gibt diesen Vorschriftscharakter natürlich wieder.
- source_word: עַל הַחֹשֶׁן
  choice: am Brustschild
  rationale: עַל bezeichnet hier die Zuordnung beziehungsweise Anbringung am Brustschild. „Am Brustschild“ ist im Deutschen natürlicher als das räumlich engere „auf dem Brustschild“, ohne die Verbindung zum Brustschild aufzugeben.
- source_word: שַׁרְשֹׁת
  choice: Ketten
  rationale: Das Substantiv bezeichnet Ketten; „Ketten“ ist im Zusammenhang der kunsthandwerklichen Ausstattung klar und sachgerecht.
- source_word: גַּבְלֻת
  choice: in Flechtarbeit
  rationale: Der seltene Ausdruck beschreibt wahrscheinlich eine verflochtene, gedrehte oder schnurartige Ausführung. „In Flechtarbeit“ vermittelt die Herstellungsart, während die Fußnote die lexikalische Unsicherheit offenlegt.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: wie Schnüre
  rationale: Die Wendung bezeichnet eine schnur- oder seilartige Arbeit. „Wie Schnüre“ bewahrt das konkrete Vergleichsbild in verständlichem Deutsch.
- source_word: זָהָב טָהוֹר
  choice: aus reinem Gold
  rationale: Dies ist die übliche und idiomatische deutsche Wiedergabe der Materialangabe.
