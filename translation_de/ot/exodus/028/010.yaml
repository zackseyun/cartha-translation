  text: six of their names on the one stone[a], and the names of the remaining six on the second stone, according to their birth order.
translation:
  language: de
  text: sechs ihrer Namen auf den einen Stein und die Namen der übrigen sechs auf den zweiten Stein, in der Reihenfolge ihrer Geburt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach ihren Abstammungen“; der hebräische Ausdruck kann die genealogische Abstammung oder die sich daraus ergebende Geburtsreihenfolge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: sechs von ihren Namen
  rationale: Die partitive Präposition מִן bezeichnet sechs Namen aus der Gesamtzahl; die Formulierung bleibt nahe am Hebräischen und ist im Deutschen verständlich.
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: auf den einen Stein
  rationale: אֶחָת bedeutet wörtlich „einen“ und steht im Gegensatz zum anschließend genannten „zweiten“ Stein; die Wiedergabe vermeidet die unnötige Festlegung auf „ersten“.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: die übrigen sechs
  rationale: נוֹתָרִים bezeichnet die verbleibenden Namen; „die übrigen sechs“ ist knapp und natürlich.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: auf den zweiten Stein
  rationale: שֵׁנִית ist hier eindeutig ordinal und wird direkt mit „zweiten“ wiedergegeben.
- source_word: כְּתוֹלְדֹתָם
  choice: in der Reihenfolge ihrer Geburt
  rationale: תּוֹלְדוֹת kann Herkunft, Abstammung oder Hervorbringungen bezeichnen; bei den Namen der Söhne Israels bezeichnet die Wendung im Kontext am wahrscheinlichsten die durch ihre Geburt bestimmte Reihenfolge.
