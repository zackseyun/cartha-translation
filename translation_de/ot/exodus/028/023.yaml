  text: You shall make two gold rings on the breastpiece[b][a], and put the two rings on the two ends of the breastpiece.
translation:
  language: de
  text: Du sollst zwei goldene Ringe anfertigen und die beiden Ringe an den beiden Enden des Brustschilds anbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Du sollst … anbringen
  rationale: Das Qal-Perfekt mit וְ führt die Anweisungsfolge fort und hat gebietende Kraft. Zusammen mit עַל bezeichnet עשה hier sachgerecht das Herstellen beziehungsweise Anbringen der Ringe am Brustschild.
- source_word: הַחֹשֶׁן
  choice: das Brustschild
  rationale: חֹשֶׁן bezeichnet in Exodus 28 das zur hohepriesterlichen Kleidung gehörende Brustschild; die längere Bezeichnung „Brustschild der Rechtsprechung“ steht hier nicht ausdrücklich.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: zwei goldene Ringe
  rationale: Die Materialangabe זָהָב wird im Deutschen natürlich und genau durch das Adjektiv „goldene“ wiedergegeben.
- source_word: וְנָתַתָּ
  choice: und … befestigen
  rationale: נתן bedeutet grundsätzlich „geben, setzen, anbringen“. Im Zusammenhang mit den Ringen, die am Brustschild angebracht werden, gibt „befestigen“ den konkreten Vorgang idiomatisch wieder, ohne zusätzliche technische Einzelheiten einzutragen.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: an den zwei Enden des Brustschilds
  rationale: עַל kann an einer Befestigungsstelle natürlich mit „an“ wiedergegeben werden; קָצֶה bezeichnet die Enden beziehungsweise äußersten Ränder. „Zwei Enden“ bewahrt die ausdrückliche Zahl des Hebräischen.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Anweisungssprache. „Brustschild“ entspricht dem etablierten Gegenstandsbegriff; „anbringen“ und „befestigen“ vermeiden im Deutschen die schwerfällige Wiederholung einer wörtlichen Formulierung mit „machen“ und „setzen“.
