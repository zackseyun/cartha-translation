  text: וְ/נָתַתָּ֗ה אֶת שְׁתֵּי֙ עֲבֹתֹ֣ת הַ/זָּהָ֔ב עַל שְׁתֵּ֖י הַ/טַּבָּעֹ֑ת אֶל קְצ֖וֹת הַ/חֹֽשֶׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/024.yaml
  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: de
  text: Befestige die beiden geflochtenen Goldketten an den beiden Ringen an den Enden des Bruststücks.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird חֹשֶׁן oft mit »Brustschild« wiedergegeben; auch »Brusttasche« ist möglich. Gemeint ist ein priesterliches Bruststück, das offenbar taschenartig gearbeitet war.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Befestige
  rationale: Die Verbform führt die Anweisungsfolge fort und hat hier gebietenden Sinn. Da die Ketten an Ringen angebracht werden, gibt »befestige« den Vorgang im Deutschen präziser wieder als das allgemeinere »lege« oder »setze«.
- source_word: עֲבֹתֹת הַזָּהָב
  choice: geflochtenen Goldketten
  rationale: עֲבֹתֹת bezeichnet in diesem Zusammenhang kordelartig verflochtene oder gedrehte Kettenarbeit; »geflochtene Goldketten« verbindet Material, Form und Funktion in natürlichem Deutsch.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: an den beiden Ringen
  rationale: עַל bezeichnet hier die Stelle der Anbringung. Bei einer Befestigung an Ringen ist »an« im Deutschen idiomatisch und sachlich passend.
- source_word: אֶל קְצ֖וֹת הַחֹשֶׁן
  choice: an den Enden der Brusttasche
  rationale: קְצוֹת bezeichnet die Enden oder äußersten Stellen. חֹשֶׁן ist das am Oberkörper getragene, taschenartig gearbeitete priesterliche Stück und kein metallener Brustpanzer; »Brusttasche« ist anschaulich und funktional.
