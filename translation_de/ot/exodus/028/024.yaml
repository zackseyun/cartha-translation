  naturalness: Die Formulierung ist modernes, gut verständliches Deutsch. Die Wiederholung von »an« ist zwar zulässig, lässt sich aber durch die Wahl eines neutraleren Begriffs für das Kleidungsstück nicht weiter problematisch machen.
