  source_fidelity: 'Die Abfolge des Hebräischen ist grundsätzlich getroffen: Zuerst werden die Enden der beiden עֲבֹתֹת auf die beiden מִשְׁבְּצוֹת gesetzt, anschließend werden diese an den Schulterstücken des Efods an dessen Vorderseite angebracht. Im Entwurf bleibt das Bezugswort von »diese« jedoch unnötig unklar; zudem gibt »vorn an den Schulterstücken« die Zuordnung zu der Vorderseite des Efods weniger eindeutig wieder.'
