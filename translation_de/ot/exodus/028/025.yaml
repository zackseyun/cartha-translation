  terminology: »Kordeln«, »Fassungen«, »Schulterstücke« und »Efod« sind tragfähige Wiedergaben. Die Fußnote bewahrt angemessen die lexikalische Möglichkeit von Ketten bzw. Kettenwerk, ohne die unsichere technische Gestalt zu stark festzulegen.
