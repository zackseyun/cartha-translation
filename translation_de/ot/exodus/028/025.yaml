  text: וְ/אֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָ/עֲבֹתֹ֔ת תִּתֵּ֖ן עַל שְׁתֵּ֣י הַֽ/מִּשְׁבְּצ֑וֹת וְ/נָתַתָּ֛ה עַל כִּתְפ֥וֹת הָ/אֵפֹ֖ד אֶל מ֥וּל פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: de
  text: Die beiden Enden der beiden Kordeln sollst du auf die beiden Fassungen setzen[a] und die Fassungen auf den Schulterstücken des Efods an dessen Vorderseite anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die beiden Enden der beiden Ketten sollst du auf die beiden Fassungen setzen.« Das hebräische Wort kann verflochtene Kordeln oder Kettenwerk bezeichnen; der Zusammenhang mit Goldarbeiten spricht eher für eine kettenartige Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: Enden
  rationale: Das Wort bezeichnet hier die Endpunkte der Kordeln beziehungsweise Ketten; »Enden« ist im Deutschen natürlich und präzise.
- source_word: הָעֲבֹתֹת
  choice: Kordeln
  rationale: Der Ausdruck kann dicke beziehungsweise verflochtene Schnüre oder Kettenwerk bezeichnen. »Kordeln« bewahrt das Grundbild; wegen des Goldkontexts wird »Ketten« als Alternative in der Fußnote genannt.
- source_word: הַמִּשְׁבְּצֹת
  choice: Fassungen
  rationale: Gemeint sind goldene Einfassungen oder Halterungen. »Fassungen« ist verständlich und vermeidet eine nicht sicher belegte nähere Bestimmung ihrer Zierform.
- source_word: כִתְפֹת
  choice: Schulterstücke
  rationale: Im Zusammenhang der Herstellung eines Gewandes sind die Schulterpartien des Efods gemeint, nicht unmittelbar die anatomischen Schultern.
- source_word: אֵפֹד
  choice: Efod
  rationale: Der Fachbegriff für dieses priesterliche Kleidungsstück hat keine genaue deutsche Entsprechung; die etablierte Transliteration bleibt erhalten.
- source_word: אֶל מוּל פָּנָיו
  choice: vorn
  rationale: Die Wendung bezeichnet die nach vorn gerichtete Seite des Efods. »vorn« gibt die räumliche Anweisung natürlich und knapp wieder.
- source_word: וְנָתַתָּה
  choice: anbringen
  rationale: Das wiederholte נתן bezeichnet hier das Platzieren beziehungsweise Befestigen der betreffenden Teile. Die Variation ist im Deutschen natürlich, ohne den Handlungssinn zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit handwerklich verständlicher Ausdrucksweise. Die Fachbezeichnung »Efod« bleibt erhalten. Das Pronomen »diese« bezieht sich im Deutschen am natürlichsten auf die Fassungen mitsamt den daran befestigten Enden und gibt die konstruktive Abfolge wieder.
