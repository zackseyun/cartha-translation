  text: And make two chains of pure gold[a], braided like cords[b]; and put the braided chains on the settings.
translation:
  language: de
  text: Fertige auch zwei Ketten aus reinem Gold an, kordelartig gedreht[a], und bring die gedrehten Ketten an den Fassungen[b] an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formulierung verwendet zwei verwandte Ausdrücke für eine gedrehte oder kordelartige Arbeit. Auch möglich: »wie Schnüre geflochten« oder »in Kordelarbeit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Einfassungen« oder »Halterungen«; gemeint sind die goldenen Schmuckfassungen am priesterlichen Gewand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרֹת
  choice: Ketten
  rationale: Das Wort bezeichnet hier die goldene Kettenarbeit am priesterlichen Gewand; »Ketten« passt sowohl zum Material als auch zum Schmuckkontext.
- source_word: זָהָב טָהוֹר
  choice: reines Gold
  rationale: Die übliche und sachgerechte Wiedergabe der Materialangabe für hochwertigen Goldschmuck im Heiligtumskontext.
- source_word: מִגְבָּלֹת … מַעֲשֵׂה עֲבֹת
  choice: kordelartig gedreht
  rationale: Die schwierige Formulierung beschreibt wahrscheinlich eine gedrehte oder schnurähnliche Arbeitsweise. Die deutsche Wendung gibt die Form verständlich wieder, ohne eine technisch zu genaue Herstellungsweise festzulegen.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: die gedrehten Ketten
  rationale: Die wiederholte Bezeichnung hebt die gedrehte beziehungsweise kordelartige Gestaltung der Ketten hervor.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: an den Fassungen
  rationale: מִשְׁבְּצוֹת bezeichnet die goldenen Einfassungen oder Halterungen, an denen die Ketten angebracht werden.
