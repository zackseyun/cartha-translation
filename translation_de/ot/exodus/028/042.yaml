source:
  edition: WLC
  text: וַ/עֲשֵׂ֤ה לָ/הֶם֙ מִכְנְסֵי בָ֔ד לְ/כַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִ/מָּתְנַ֥יִם וְ/עַד יְרֵכַ֖יִם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: de
  text: Und fertige für sie Unterhosen aus Leinen an, damit sie ihre Scham bedecken.[a] Sie sollen von den Hüften bis zu den Oberschenkeln reichen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Fleisch der Blöße“. Gemeint ist der Intimbereich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den Lenden bis zu den Oberschenkeln“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Und fertige … an
  rationale: Der Imperativ mit einleitendem Waw setzt die vorangehenden Anweisungen fort; die Formulierung ist direkt, natürlich und würdig.
- source_word: לָהֶם
  choice: für sie
  rationale: Der Dativ bezeichnet die zuvor genannten Priester als Empfänger der Kleidungsstücke.
- source_word: מִכְנְסֵי בָד
  choice: Unterhosen aus Leinen
  rationale: מִכְנְסֵי bezeichnet ein unter den priesterlichen Gewändern getragenes Kleidungsstück für den Unterkörper; „Unterhosen“ ist im heutigen Deutsch verständlich, während „Beinkleider“ altertümlich wäre. בָד bezeichnet hier Leinen.
- source_word: לְכַסּוֹת
  choice: damit sie … bedecken
  rationale: Der Infinitiv drückt den Zweck aus; ein deutscher Finalsatz gibt diesen Zusammenhang natürlich wieder.
- source_word: בְּשַׂר עֶרְוָה
  choice: ihre Scham
  rationale: Wörtlich etwa „Fleisch der Blöße“. „Ihre Scham“ bezeichnet im Deutschen knapp und würdig den zu bedeckenden Intimbereich, ohne die Aussage unnötig zu vergröbern.
- source_word: מִמָּתְנַיִם
  choice: von den Hüften
  rationale: מָתְנַיִם kann Lenden, Taille oder Hüften bezeichnen. „Hüften“ ist in der Beschreibung des oberen Ansatzpunkts des Kleidungsstücks natürlich und vermeidet das altertümliche „Lenden“.
- source_word: וְעַד יְרֵכַיִם
  choice: bis zu den Oberschenkeln
  rationale: יָרֵךְ bezeichnet hier die Oberschenkel und damit die untere Ausdehnung des Kleidungsstücks.
- source_word: יִהְיוּ
  choice: Sie sollen … reichen
  rationale: Das Verb bedeutet formal „sie sollen sein“; zusammen mit „von … bis“ gibt „reichen“ die räumliche Ausdehnung im Deutschen idiomatisch wieder.
