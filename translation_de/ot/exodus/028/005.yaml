base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/005.yaml
  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: de
  text: Sie sollen das Gold, den blauen Stoff, den Purpurstoff, das scharlachrote Garn[a] und das feine Leinen nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa »Wurm/Laus des Scharlachs«; eine hebräische Wendung für scharlachfarbenes Textilmaterial, das mit einem aus Schildläusen gewonnenen Farbstoff gefärbt wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Sie
  rationale: Das selbstständige Pronomen bezeichnet ausdrücklich die zuvor genannten kunstfertigen Handwerker; im Deutschen genügt das betonte Satzsubjekt ohne ein verstärkendes »selbst«.
- source_word: יִקְחוּ
  choice: sollen … nehmen
  rationale: Der Imperfekt hat im Zusammenhang der Anweisungen direktiven Sinn; »sollen« gibt diesen natürlich und würdig wieder.
- source_word: הַזָּהָב
  choice: das Gold
  rationale: Der Artikel und der Bezug auf die für die Priesterkleider bestimmten Materialien werden bewahrt.
- source_word: הַתְּכֵלֶת
  choice: den blauen … Stoff
  rationale: תְּכֵלֶת bezeichnet hier nicht bloß eine abstrakte Farbe, sondern blau gefärbtes Textilmaterial; »Stoff« macht den Sachbezug im Kleidungskontext deutlich.
- source_word: הָאַרְגָּמָן
  choice: den purpurroten Stoff
  rationale: אַרְגָּמָן bezeichnet purpurfarbenes Textilmaterial. »Purpurrot« ist im modernen Deutschen anschaulicher als das substantivierte Farbadjektiv allein.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: das karmesinrote Garn
  rationale: Die Wendung bezeichnet mit Insektenfarbstoff karmesinrot gefärbtes Textilmaterial; im Herstellungskontext ist »Garn« sachgerecht.
- source_word: הַשֵּׁשׁ
  choice: das feine Leinen
  rationale: שֵׁשׁ bezeichnet in den Heiligtumstexten hochwertiges Leinen; »feines Leinen« bewahrt diese Qualitätsangabe.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Anweisungston. Die elliptische hebräische Aufzählung von Farbbezeichnungen wird als Aufzählung konkreter Textilmaterialien wiedergegeben; das gemeinsame Substantiv »Stoff« steht bei Blau und Purpur, während die traditionelle Materialangabe »feines Leinen« erhalten bleibt.
