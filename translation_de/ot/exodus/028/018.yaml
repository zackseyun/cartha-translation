translation:
  language: de
  text: 'und die zweite Reihe: Türkis[a], Saphir und Diamant.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung mehrerer antiker Edelsteine ist unsicher. נֹפֶךְ kann auch „Smaragd“ oder „Karfunkel“ bedeuten, סַפִּיר möglicherweise „Lapislazuli“ und יָהֲלֹם vielleicht „Hyazinth“ oder „Jaspis“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: und die … Reihe
  rationale: טוּר bezeichnet im Zusammenhang mit den Steinen der Brusttasche eine Reihe; וְ wird als „und“ wiedergegeben.
- source_word: הַ/שֵּׁנִי
  choice: die zweite
  rationale: Das Ordinalzahlwort bestimmt „Reihe“ näher und wird direkt wiedergegeben.
- source_word: נֹפֶךְ
  choice: Türkis
  rationale: Die genaue Bestimmung des antiken Edelsteins ist unsicher. „Türkis“ ist eine plausible moderne Entsprechung; wichtige Alternativen werden in der Fußnote genannt.
- source_word: סַפִּיר
  choice: Saphir
  rationale: Die traditionelle und verständliche Wiedergabe lautet „Saphir“, obwohl wahrscheinlich auch Lapislazuli gemeint sein kann.
- source_word: וְ/יָהֲלֹם
  choice: und Diamant
  rationale: „Diamant“ ist eine verbreitete traditionelle Wiedergabe des nicht sicher identifizierten Edelsteins; Alternativen bleiben in der Fußnote erhalten.
