base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: de
  text: Und am Ende von 430 Jahren geschah es, dass an eben diesem Tag alle Heerscharen[a] Jahwes aus dem Land Ägypten auszogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Truppenverbände“. Das hebräische Wort kann geordnete Scharen, Verbände oder Heere bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: nach Ablauf von
  rationale: Die Verbindung bezeichnet den Abschluss eines Zeitraums. „Nach Ablauf von“ ist im Deutschen natürlich und gibt den zeitlichen Endpunkt präzise wieder.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 430 Jahren
  rationale: Die im Hebräischen als dreißig plus vierhundert ausgedrückte Zahl wird nach deutscher Konvention als Gesamtsumme wiedergegeben.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: genau an diesem Tag
  rationale: Die Formulierung bewahrt die nachdrückliche zeitliche Genauigkeit des hebräischen Ausdrucks.
- source_word: יָצְאוּ
  choice: zogen … aus
  rationale: יצא bezeichnet hier das Hinausgehen aus Ägypten; das trennbare Verb „ausziehen“ passt natürlich zur geschilderten gemeinsamen Abreise.
- source_word: צִבְאוֹת
  choice: Heerscharen
  rationale: Der Begriff kann Heere, geordnete Verbände oder Scharen bezeichnen. „Heerscharen“ erhält den kollektiven und militärisch geprägten Beiklang, ohne die Gruppen ausschließlich als kämpfende Armee festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Übersetzung bewahrt das ausdrücklich vorhandene אֶרֶץ und damit die geografisch-nationale Aussage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von צִבְאוֹת יְהוָה
  choice: Heerscharen Jahwes
  alternative: Truppenverbände Jahwes
  rationale: Die gewählte Formulierung erhält den Gedanken geordneter Verbände und zugleich die lexikalische Weite; sie legt nicht fest, dass Israel hier bereits als kämpfendes Heer auftrat.
- issue: Doppelte Erzählformel וַיְהִי
  choice: es geschah … es geschah
  alternative: nach Ablauf … genau an diesem Tag
  rationale: Die Wiederholung wird beibehalten, weil sie den Abschluss der 430 Jahre und die taggenaue Erfüllung feierlich hervorhebt, auch wenn die deutsche Form dadurch markierter klingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die betonte Wiederholung „es geschah“ folgt bewusst der hebräischen Erzählstruktur; die Ziffernschreibung „430“ hält den langen Zahlenausdruck gut erfassbar. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Begriff „Heerscharen“.
