revisions:
- from: 'Sprecht zur ganzen Gemeinde Israel: »Am zehnten Tag dieses Monats soll sich jeder ein Jungtier aus der Herde[a] nehmen, und zwar für jede Großfamilie ein Tier, für jeden Haushalt ein Tier.«'
  to: 'Sprecht zur ganzen Gemeinde Israels: »Am zehnten Tag dieses Monats soll sich jeder ein Tier vom Kleinvieh[a] nehmen: je eines für das Vaterhaus[b], je eines für den Haushalt.«'
  rationale: Die Revision ersetzt die interpretierende Verallgemeinerung »Großfamilie« durch das quellennahe, im Deutschen verständliche »Vaterhaus« und erläutert den historischen Sozialbegriff in einer Fußnote. »Tier vom Kleinvieh« gibt שֶׂה offen und präzise wieder; die Wiederholung »je eines« wahrt die knappe Verteilungsstruktur des Hebräischen.
