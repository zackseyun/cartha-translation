base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: de
  text: 'Sprecht zur ganzen Gemeinde Israels: »Am zehnten Tag dieses Monats soll sich jeder ein Tier vom Kleinvieh[a] nehmen: je eines für das Vaterhaus[b], je eines für den Haushalt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet ein einzelnes Tier vom Kleinvieh; es kann ein Schaf oder eine Ziege sein (siehe Vers 5). Traditionell wird hier oft mit »Lamm« übersetzt.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Haus der Väter«; gemeint ist ein nach väterlicher Abstammung gegliederter Familienverband, nicht lediglich ein Gebäude.'
    reason: historical_social_term
lexical_decisions:
- source_word: דַּבְּרוּ אֶל כָּל עֲדַת יִשְׂרָאֵל
  choice: Sprecht zur ganzen Gemeinde Israel
  rationale: Der Piel-Imperativ richtet einen formellen Auftrag an mehrere Angesprochene. עֵדָה bezeichnet hier die versammelte Gemeinschaft Israels; „Gemeinde“ ist im Deutschen verständlich und bewahrt den kollektiven Charakter.
- source_word: לֵאמֹר
  choice: durch einen Doppelpunkt wiedergegeben
  rationale: Der formelhafte hebräische Redeintroduktor wird im natürlichen modernen Deutsch am klarsten typografisch durch einen Doppelpunkt ausgedrückt.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: Am zehnten Tag dieses Monats
  rationale: „Tag“ wird zur idiomatischen Verdeutlichung ergänzt; gemeint ist der zehnte Kalendertag des genannten Monats.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: soll sich jeder ... nehmen
  rationale: Das Präfixverb hat in diesem Anweisungskontext direktiven Sinn. אִישׁ ist distributiv; „jeder“ gibt die Einzelzuweisung natürlich wieder, ohne unnötig ein ausschließlich männliches Substantiv einzutragen.
- source_word: שֶׂה
  choice: Jungtier aus der Herde
  rationale: שֶׂה bezeichnet ein einzelnes Tier vom Kleinvieh und kann ein Schaf oder eine Ziege sein. Die Übersetzung bewahrt diese im Kontext ausdrücklich relevante Breite, statt sie auf „Lamm“ zu verengen.
- source_word: לְבֵית אָבֹת
  choice: für jede Großfamilie
  rationale: בֵּית אָבוֹת bezeichnet die patrilineal gegliederte größere Familieneinheit. „Großfamilie“ vermittelt die soziale Ebene im modernen Deutsch verständlicher als das wörtliche, missverständliche „Vaterhaus“.
- source_word: שֶׂה לַבָּיִת
  choice: für jeden Haushalt ein Tier
  rationale: בַּיִת meint hier die häusliche Gemeinschaft, nicht das Gebäude. Die Wiederholung von „ein Tier“ spiegelt die knappe Zuordnung im Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Anweisungsstruktur und die Wiederholung des Ausgangstextes bleiben erhalten; die soziale Terminologie wird verständlich wiedergegeben, und die lexikalische Offenheit von שֶׂה wird nicht vorschnell auf ein Lamm beschränkt.
