  naturalness: Die vorgeschlagene Fassung ist überwiegend modernes, verständliches Deutsch. Die Konstruktion mit »und zwar« ist aber eine nicht erforderliche Umformung. Die knappe distributive Wiederholung lässt sich mit »je eines« natürlich und näher am Ausgangstext wiedergeben.
  terminology: »Gemeinde Israels«, »Kleinvieh«, »Vaterhaus« und »Haushalt« sind hier angemessen. Eine kurze Fußnote zu »Vaterhaus« verhindert, dass der Ausdruck als bloßes Gebäude missverstanden wird, ohne die soziale Struktur im Text zu nivellieren.
