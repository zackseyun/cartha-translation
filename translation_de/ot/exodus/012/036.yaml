id: EXO.12.36
reference: Exodus 12:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: de
  text: Und Jahwe verschaffte dem Volk die Gunst der Ägypter, sodass sie ihnen gaben, worum sie gebeten hatten[a]. So plünderten sie Ägypten aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach traditioneller Auffassung: „sie liehen ihnen das Erbetene“. Das hebräische Verb kann hier entweder im Sinn des Verleihens oder des Gewährens einer Bitte verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Form.
- source_word: נָתַן אֶת־חֵן הָעָם בְּעֵינֵי מִצְרַיִם
  choice: verschaffte dem Volk die Gunst der Ägypter
  rationale: Die natürliche deutsche Wendung gibt das hebräische Bild vom Gewähren von Gunst „in den Augen“ der Ägypter sinngenau wieder, ohne den im Deutschen schwerfälligen Idiomwortlaut zu übernehmen.
- source_word: וַיַּשְׁאִלוּם
  choice: sie gaben ihnen, worum sie gebeten hatten
  rationale: Im Zusammenhang bezeichnet die Hifil-Form von שאל die positive Erfüllung der Bitte. Die Formulierung vermeidet die unbegründete Festlegung auf ein rückzahlbares Darlehen; die traditionelle Deutung wird in der Fußnote bewahrt.
- source_word: וַיְנַצְּלוּ
  choice: So plünderten sie … aus
  rationale: Das Piel von נצל bezeichnet hier das Ausplündern beziehungsweise Berauben. „ausplündern“ ist im heutigen Deutsch klar und bewahrt die starke Aussage des hebräischen Verbs.
- source_word: אֶת־מִצְרָיִם
  choice: Ägypten
  rationale: Der hebräische Text nennt Ägypten als kollektives Objekt; die Wiedergabe hält diese nationale und erzählerische Perspektive fest.
theological_decisions:
- issue: 'Bedeutung von וַיַּשְׁאִלוּם: Gewährung des Erbetenen oder Verleihen'
  choice: sie gaben ihnen, worum sie gebeten hatten
  alternative: sie liehen ihnen das Erbetene
  rationale: Der unmittelbare Zusammenhang betont, dass die Ägypter wegen der von Jahwe bewirkten Gunst auf die Bitten der Israeliten eingingen. „Leihen“ ist lexikalisch möglich und traditionell verbreitet, könnte jedoch ein gewöhnliches Darlehen mit erwarteter Rückgabe nahelegen. Deshalb steht diese Möglichkeit in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung „die Gunst der Ägypter“ ersetzt das im Deutschen weniger natürliche „Gunst in den Augen der Ägypter“. Der abschließende Satz bleibt bewusst kräftig und gibt das Ergebnis als Ausplünderung Ägyptens wieder.
