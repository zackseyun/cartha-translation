id: EXO.12.10
reference: Exodus 12:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹא תוֹתִ֥ירוּ מִמֶּ֖/נּוּ עַד בֹּ֑קֶר וְ/הַ/נֹּתָ֥ר מִמֶּ֛/נּוּ עַד בֹּ֖קֶר בָּ/אֵ֥שׁ תִּשְׂרֹֽפוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/010.yaml
  text: You shall not leave any of it until morning[a], and what remains of it until morning you shall burn with fire.
translation:
  language: de
  text: Ihr sollt nichts davon bis zum Morgen übrig lassen[a]; was davon bis zum Morgen übrig bleibt, sollt ihr im Feuer verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nichts davon bis zum Morgen zurückbehalten«.'
    reason: Lexikalische Alternative für תוֹתִירוּ; »zurückbehalten« betont das bewusste Aufbewahren, während »übrig lassen« den unmittelbaren Zusammenhang natürlicher wiedergibt.
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: übrig lassen
  rationale: Das Hifil von יתר bezeichnet hier das Zurück- oder Übriglassen. »Übrig lassen« ist im modernen Deutschen natürlich und passt zum Verbot, einen Teil bis zum Morgen aufzubewahren.
- source_word: מִמֶּנּוּ
  choice: davon
  rationale: Die Präposition מן mit Suffix wird in diesem Zusammenhang idiomatisch mit »davon« wiedergegeben. Zusammen mit der Verneinung drückt »nichts davon« aus, dass kein Anteil zurückbleiben soll.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die Wendung bezeichnet die zeitliche Grenze. »Bis zum Morgen« gibt sie klar und ohne zusätzliche Festlegung wieder.
- source_word: הַנֹּתָר
  choice: was … übrig bleibt
  rationale: Das Nifal-Partizip von יתר bezeichnet das, was verbleibt. Die Relativkonstruktion ist im Deutschen natürlich und wahrt den Bezug auf jeden etwaigen Rest.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition ב bezeichnet hier das Mittel beziehungsweise den Bereich des Verbrennens. »Im Feuer verbrennen« ist die natürliche deutsche Ausdrucksweise.
- source_word: תִּשְׂרֹפוּ
  choice: sollt ihr … verbrennen
  rationale: Das Imperfekt hat in dieser gesetzlichen Anweisung direktiven Charakter. Die Wiedergabe mit »sollt« bewahrt den verbindlichen Gebotsstil und bleibt gut verständlich.
theological_decisions:
- issue: Charakter der Anweisung über die Reste des Passahmahls
  choice: Ein unmittelbares Verbot mit anschließendem verbindlichem Gebot zur Beseitigung
  alternative: Eine lediglich praktische, rechtlich unverbindliche Anweisung
  rationale: 'Der Vers formuliert zwei kultische Anweisungen: Bis zum Morgen darf nichts übrig gelassen werden; ein dennoch verbleibender Rest ist zu verbrennen. Die Übersetzung gibt beide direkt wieder, ohne eine im Vers nicht erklärte symbolische Deutung hinzuzufügen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verbindlichem Gebotsstil. Die Pluralanrede des Hebräischen wird durch »ihr« bewahrt; die Satzstruktur folgt den beiden aufeinander bezogenen Anweisungen des Ausgangstextes.
