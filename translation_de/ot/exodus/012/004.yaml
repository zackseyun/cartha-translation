  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem hebräischen Gedankengang nahe, wird aber für flüssige Verständlichkeit in zwei Sätze gegliedert. Die seltene Schlussformulierung wird bewusst als Berechnung der teilnehmenden Personen wiedergegeben; ihre ungewöhnliche Ausdrucksweise und die mögliche Nuance einer Zuteilung werden nicht konfessionell zugespitzt.
