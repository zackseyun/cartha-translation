base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: de
  text: Wenn aber ein Haushalt zu klein ist, um ein Lamm[a] zu essen, sollen er und sein nächster Nachbar gemeinsam eines nehmen, entsprechend der Zahl der Personen. Je nachdem, wie viel jeder essen kann[b], sollt ihr die Zahl der Personen für das Lamm berechnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann allgemeiner ein Stück Kleinvieh bezeichnen, also ein Tier von den Schafen oder Ziegen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jeder entsprechend seinem Essen“. Gemeint ist die Bemessung nach der Menge, die jeder essen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: ein Haushalt zu klein für ein Lamm ist
  rationale: הַבַּיִת bezeichnet hier den Haushalt, nicht nur das Gebäude. Die Konstruktion mit יִמְעַט und מִהְיֹת drückt aus, dass der Haushalt zahlenmäßig nicht ausreicht, um ein ganzes Tier zu verzehren.
- source_word: שֶׂה
  choice: Lamm
  rationale: שֶׂה bezeichnet allgemeiner ein Stück Kleinvieh und kann ein Schaf oder eine Ziege meinen. „Lamm“ ist im Passakontext natürlich und geläufig; die größere Bedeutungsbreite wird in einer Fußnote offengelegt.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: sollen er und sein nächster Nachbar gemeinsam eines nehmen
  rationale: Der Singular „er“ greift den Haushaltsvorstand als grammatischen Bezugspunkt auf. „Sein nächster Nachbar“ gibt den Nachbarn nahe bei seinem Haus natürlich wieder; „gemeinsam“ verdeutlicht die im hebräischen Satz angelegte gemeinsame Teilnahme, ohne einen neuen Sachgehalt einzuführen.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: entsprechend der Zahl der Personen
  rationale: מִכְסָה bezeichnet hier Anzahl oder Bemessung, נְפָשׁוֹת konkrete Menschen. „Personen“ vermeidet die missverständliche Wiedergabe „Seelen“.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: je nachdem, wie viel jeder essen kann
  rationale: Das distributive אִישׁ wird im Deutschen kontextgerecht mit „jeder“ wiedergegeben. לְפִי אָכְלוֹ bemisst die Beteiligung nach der jeweiligen Essmenge beziehungsweise dem Verzehrvermögen.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: sollt ihr die Personen für das Lamm berechnen
  rationale: Das seltene Verb bezeichnet hier ein Berechnen oder Bemessen im Hinblick auf das Tier. Das ergänzte Objekt „die Personen“ ergibt sich aus בְּמִכְסַת נְפָשֹׁת und macht die Aussage im Deutschen verständlich, ohne die Verteilung des Fleisches als allein mögliche Deutung festzulegen.
