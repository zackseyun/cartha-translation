  naturalness: Der Entwurf ist insgesamt klar. „Ein Haushalt zu klein für ein Lamm“ kann jedoch körperliche Größe nahelegen; „zu klein, um ein Lamm zu essen“ macht die im Kontext gemeinte unzureichende Personenzahl idiomatisch deutlich. Die revidierte Schlussformulierung ist flüssiger und bewahrt den Bezug zur zuvor genannten Zahl.
