  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: de
  text: 'Sie backten den Teig, den sie aus Ägypten mitgenommen hatten, zu ungesäuerten Fladen, denn er war nicht gesäuert: Sie waren aus Ägypten vertrieben worden, konnten sich nicht aufhalten und hatten sich auch keine Reiseverpflegung vorbereitet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: Sie backten
  rationale: Das narrative Verb wird im modernen Standarddeutsch natürlich mit dem Präteritum wiedergegeben; das einleitende ו muss im Einzelvers nicht eigens mit „und“ abgebildet werden.
- source_word: הַבָּצֵק
  choice: den Teig
  rationale: בצק bezeichnet Teig; die einfache deutsche Entsprechung ist klar und sachgerecht.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: den sie aus Ägypten mitgenommen hatten
  rationale: Das Plusquamperfekt wahrt die zeitliche Vorordnung. „Mitgenommen“ gibt im Deutschen idiomatisch wieder, dass sie den Teig beim Auszug aus Ägypten herausgebracht hatten.
- source_word: עֻגֹת מַצּוֹת
  choice: zu ungesäuerten Fladen
  rationale: עֻגֹת bezeichnet flache beziehungsweise runde Brote oder Fladen, מַצּוֹת deren ungesäuerten Charakter. „Fladen“ vermeidet die im heutigen Deutsch irreführende Vorstellung süßen Kuchens.
- source_word: כִּי לֹא חָמֵץ
  choice: denn er war nicht durchsäuert
  rationale: חמץ beschreibt hier, dass der Teig nicht in einen gesäuerten Zustand gelangt war. „Nicht durchsäuert“ bewahrt diesen Zustandsaspekt, ohne das moderne Backtriebmittel „Hefe“ in den Text einzutragen.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: Sie waren aus Ägypten vertrieben worden
  rationale: Das passive גֹרְשׁוּ bezeichnet eine erzwungene Vertreibung; das Plusquamperfekt stellt sie als Grund der Eile dar.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: und konnten nicht warten
  rationale: התמהמה bedeutet zögern, verweilen oder sich aufhalten. „Nicht warten“ ist gegenwärtig und verständlich und bringt den fehlenden zeitlichen Spielraum zum Ausdruck.
- source_word: וְגַם צֵדָה לֹא עָשׂוּ לָהֶם
  choice: Auch Reiseverpflegung hatten sie sich nicht vorbereitet
  rationale: צֵדָה meint Vorrat beziehungsweise Verpflegung für unterwegs. „Reiseverpflegung“ macht den situationsbezogenen Sinn deutlich; „sich“ entspricht לָהֶם.
