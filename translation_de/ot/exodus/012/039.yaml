  - severity: low
    issue: „Auch Reiseverpflegung hatten sie sich nicht vorbereitet.“
    rationale: Die Formulierung ist zwar verständlich, aber stilistisch schwerfällig. „hatten sich auch keine Reiseverpflegung vorbereitet“ ist natürlicher und stellt die Verneinung eindeutig her.
