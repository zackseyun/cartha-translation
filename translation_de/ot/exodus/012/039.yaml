  rationale: Die Revision ersetzt die ungenaue Formulierung „durchsäuert“ durch „gesäuert“, glättet die deutsche Syntax und bewahrt die kausale Abfolge sowie den Umfang der Aussagen des hebräischen Textes. Es werden keine zusätzlichen Deutungen oder theologischen Festlegungen eingeführt.
