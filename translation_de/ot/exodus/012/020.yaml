  text: You shall not eat anything leavened[b][a]; in all your dwellings you shall eat unleavened bread.
translation:
  language: de
  text: Ihr dürft nichts Gesäuertes essen[a]. Überall, wo ihr wohnt[b], sollt ihr ungesäuertes Brot essen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Keinerlei Gesäuertes dürft ihr essen.« Der hebräische Ausdruck ist weiter gefasst als Brot allein und bezeichnet alles, was gesäuert ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in allen euren Wohnorten« beziehungsweise »in allen euren Siedlungen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: nichts Gesäuertes
  rationale: Im verneinten Satz bezeichnet die Verbindung umfassend alles, was gesäuert ist. Die substantivierte Formulierung ist im Deutschen natürlich und verengt den Gegenstand nicht auf Brot.
- source_word: לֹא תֹאכֵלוּ
  choice: ihr dürft ... nicht essen
  rationale: Die Formulierung gibt das rechtlich verbindliche Verbot in klarem, modernem Deutsch wieder, ohne den Sinn abzuschwächen.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: überall, wo ihr wohnt
  rationale: Die Wendung erstreckt die Anweisung auf sämtliche Wohnorte beziehungsweise Siedlungen Israels. Die gewählte Fassung ist verständlich und bewahrt den umfassenden Ortsbezug.
- source_word: תֹּאכְלוּ
  choice: sollt ihr ... essen
  rationale: Das Imperfekt hat hier gebietenden Sinn. „Sollt“ wahrt den verbindlichen Ton und bildet einen natürlichen Gegensatz zum vorausgehenden Verbot.
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Der Ausdruck bezeichnet ohne Sauerteig bereitetes Brot. Dies ist die geläufige und allgemein verständliche deutsche Wiedergabe.
