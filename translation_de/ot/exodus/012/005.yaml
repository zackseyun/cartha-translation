  text: שֶׂ֥ה תָמִ֛ים זָכָ֥ר בֶּן שָׁנָ֖ה יִהְיֶ֣ה לָ/כֶ֑ם מִן הַ/כְּבָשִׂ֥ים וּ/מִן הָ/עִזִּ֖ים תִּקָּֽחוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: de
  text: Euer Tier aus der Herde[a] soll fehlerlos, männlich und ein Jahr alt sein. Ihr sollt es von den Schafen oder von den Ziegen nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort שֶׂה bezeichnet allgemein ein einzelnes Tier des Kleinviehs und kann ein Lamm oder ein Zicklein meinen; der folgende Satz stellt ausdrücklich klar, dass es von den Schafen oder von den Ziegen genommen werden kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: Tier aus der Herde
  rationale: Das hebräische Wort bezeichnet ein einzelnes Tier des Kleinviehs und kann sowohl ein Schaf beziehungsweise Lamm als auch eine Ziege beziehungsweise ein Zicklein meinen. Die breitere Wiedergabe vermeidet eine vorschnelle Festlegung, da der folgende Satz ausdrücklich beide Möglichkeiten nennt.
- source_word: תָמִים
  choice: fehlerlos
  rationale: Im Zusammenhang mit Opfertieren bezeichnet das Wort ein Tier ohne körperlichen Makel oder Defekt. „Fehlerlos“ ist klar, würdig und weniger missverständlich als das allgemeinere „vollkommen“.
- source_word: זָכָר
  choice: männlich
  rationale: Die Form bezeichnet eindeutig das biologische Geschlecht des Tieres.
- source_word: בֶּן שָׁנָה
  choice: ein Jahr alt
  rationale: Die hebräische Wendung lautet wörtlich „Sohn eines Jahres“ und bezeichnet hier das vorgeschriebene Alter des Tieres; die deutsche Formulierung ist natürlich und verständlich.
- source_word: יִהְיֶה לָכֶם
  choice: Euer … soll … sein
  rationale: Die Formulierung gibt die für Israel geltende Vorschrift wieder. Das vorangestellte „Euer“ nimmt den Dativ לָכֶם idiomatisch auf, während „soll“ den verpflichtenden Sinn ausdrückt.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: von den Schafen oder von den Ziegen
  rationale: Die beiden Tiergruppen sind alternative zulässige Quellen. Daher gibt „oder“ den disjunktiven Sinn im Deutschen natürlicher wieder als ein formales „und“.
- source_word: תִּקָּחוּ
  choice: Ihr sollt es … nehmen
  rationale: Die zweite Person Plural erteilt eine verbindliche Anweisung. Das Pronomen „es“ wird im Deutschen aus dem zuvor genannten Einzeltier ergänzt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. „Tier aus der Herde“ bewahrt den weiteren Bedeutungsumfang des hebräischen שֶׂה; die Wiederholung „von den … oder von den …“ folgt der betonten hebräischen Struktur.
