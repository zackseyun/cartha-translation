source:
  edition: WLC
  text: וְ/כָל עֶ֥בֶד אִ֖ישׁ מִקְנַת כָּ֑סֶף וּ/מַלְתָּ֣ה אֹת֔/וֹ אָ֖ז יֹ֥אכַל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: de
  text: Doch jeder Sklave eines Mannes, der für Geld gekauft wurde – wenn du ihn beschnitten hast, dann darf er davon essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל
  choice: Doch jeder
  rationale: Die Wendung führt im Anschluss an den Ausschluss im vorigen Vers eine gegensätzliche Regel ein; „doch“ gibt diese Verknüpfung im Deutschen natürlich wieder, während „jeder“ die distributive Kraft von כָּל bewahrt.
- source_word: עֶבֶד
  choice: Sklave
  rationale: Da ausdrücklich vom Kauf die Rede ist, bezeichnet das Wort hier einen Menschen in rechtlich gebundener, besitzähnlicher Stellung. „Sklave“ bildet diese soziale Wirklichkeit genauer ab als das mildere „Diener“.
- source_word: אִישׁ
  choice: eines Mannes
  rationale: Das maskuline Singularwort bezeichnet hier den Eigentümer. Die Übersetzung bewahrt die Form des hebräischen Rechtssatzes, ohne das interpretierende „Hausherrn“ einzuführen.
- source_word: מִקְנַת כָּסֶף
  choice: der für Geld gekauft wurde
  rationale: כֶּסֶף bedeutet wörtlich „Silber“, bezeichnet in Kaufzusammenhängen aber idiomatisch Geld. Die Relativkonstruktion ist im Deutschen klar und natürlich.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: wenn du ihn beschnitten hast
  rationale: Die abgeschlossene Handlung ist Voraussetzung für die danach erlaubte Teilnahme. Die zweite Person Singular und das männliche Objekt bleiben erhalten.
- source_word: אָז
  choice: dann
  rationale: Das Adverb kennzeichnet unmittelbar die Folge nach der Beschneidung.
- source_word: יֹאכַל בּוֹ
  choice: darf er davon essen
  rationale: Der Imperfekt bezeichnet im Rechtssatz die nun gewährte Erlaubnis. „Davon“ gibt die Präposition בְּ wieder und verweist auf das Passamahl beziehungsweise das Passalamm.
theological_decisions:
- issue: Bezeichnung eines gekauften und gebundenen Menschen
  choice: Sklave
  alternative: Diener
  rationale: Der ausdrückliche Kauf für Geld macht den Status der Versklavung zum wesentlichen Bestandteil des Satzes. „Diener“ würde die im Ausgangstext benannte soziale Wirklichkeit abschwächen.
- issue: Wiedergabe des maskulinen אִישׁ
  choice: eines Mannes
  alternative: einer Person
  rationale: Der Ausgangstext verwendet den maskulinen Singular für den Eigentümer. Die Übersetzung erhält diese Form, statt sie ohne sachliche Notwendigkeit zu neutralisieren.
- issue: Bedingung für die Teilnahme am Passamahl
  choice: Beschneidung als vorherige Voraussetzung
  alternative: bloße zeitliche Abfolge ohne ausgedrückte Zulassungsbedingung
  rationale: Die Folge aus וּמַלְתָּה und אָז יֹאכַל stellt die Beschneidung als Voraussetzung für die anschließend erlaubte Teilnahme dar, ohne darüber hinausgehende theologische Folgerungen einzutragen.
translation_notes:
  register: Moderner, würdiger deutscher Rechtsstil. „Sklave“ ist bewusst sachlich und unbeschönigend; „für Geld“ gibt den damaligen idiomatischen Gebrauch von „Silber“ verständlich wieder. Der Gedankenstrich markiert die Bedingungs-Folge-Struktur, ohne zusätzliche Auslegung einzuführen.
