id: EXO.12.11
reference: Exodus 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: de
  text: 'Und so sollt ihr es essen: mit gegürteten Hüften[a], mit Sandalen an euren Füßen und mit eurem Stab in eurer Hand. Ihr sollt es in Eile essen. Es ist das Passa für Jahwe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eure Hüften gegürtet“. Gemeint ist, dass sie angekleidet und zum sofortigen Aufbruch bereit sein sollen.'
    reason: Erläuterung eines hebräischen Bereitschaftsidioms.
  - marker: b
    text: 'Oder: „Es ist Jahwes Passa“ beziehungsweise „das Passa Jahwes“.'
    reason: Die hebräische Verbindung kann sowohl Widmung als auch Zugehörigkeit ausdrücken.
lexical_decisions:
- source_word: וְכָכָה
  choice: Und so
  rationale: Leitet in natürlichem Deutsch die vorgeschriebene Art und Weise des Essens ein.
- source_word: תֹּאכְלוּ
  choice: sollt ihr es essen
  rationale: Gibt den direktiven Sinn des Imperfekts im gesetzlichen Kontext klar und würdig wieder.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: Eure Hüften sollen gegürtet sein
  rationale: Bewahrt das konkrete Bild des hebräischen Ausdrucks und bezeichnet die Bereitschaft zum sofortigen Aufbruch; die Fußnote erläutert die Wendung.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: eure Sandalen an euren Füßen
  rationale: „Sandalen“ entspricht dem antiken Sachbezug von נַעַל genauer als das allgemeinere „Schuhe“.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: und euer Stab in eurer Hand
  rationale: „Stab“ passt zum Kontext einer unmittelbar bevorstehenden Reise und wahrt das konkrete Bild.
- source_word: בְּחִפָּזוֹן
  choice: in Eile
  rationale: Drückt die Dringlichkeit und Aufbruchsbereitschaft knapp und idiomatisch aus, ohne über den hebräischen Wortlaut hinaus „Flucht“ ausdrücklich einzutragen.
- source_word: פֶּסַח
  choice: Passa
  rationale: „Passa“ ist im Deutschen die etablierte Bezeichnung für das hier eingesetzte Fest beziehungsweise Opfermahl und bewahrt den Bezug zum hebräischen Namen.
- source_word: הוּא לַיהוָה
  choice: Es ist das Passa für Jahwe
  rationale: Das לְ wird mit „für“ wiedergegeben und lässt die Beziehung der Feier zu Jahwe offen genug; mögliche possessive Wiedergaben werden in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt diesen Namen und vermeidet die Ersetzung durch den traditionellen Titel.
- issue: Beziehung in פֶּסַח הוּא לַיהוָה
  choice: das Passa für Jahwe
  alternative: Jahwes Passa / das Passa Jahwes
  rationale: Die Präposition לְ kann hier Widmung oder Zugehörigkeit ausdrücken. Die Hauptfassung bewahrt den Widmungsaspekt, während die Fußnote die mögliche possessive Auffassung sichtbar hält.
- issue: Bedeutung von פֶּסַח im unmittelbaren Kontext
  choice: Passa
  alternative: Passaopfer
  rationale: Der Ausdruck kann das Opfer, das Mahl oder die Feier bezeichnen. Die allgemeinere Benennung „Passa“ löst diese kontextuelle Mehrschichtigkeit nicht unnötig auf.
translation_notes:
  register: Modernes, standarddeutsches und würdiges Anweisungsregister. Die konkrete Reiseszene bleibt erhalten; altertümliche Formen wie „Lenden umgürtet“ werden vermieden, ohne das hebräische Bild aufzugeben.
