  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: de
  text: 'Da rief Mose alle Ältesten Israels zusammen und sagte zu ihnen: »Sondert euch für eure Sippen Kleinvieh aus[a] und nehmt es; schlachtet das Passaopfer[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann wörtlich »herausziehen« bedeuten und im Zusammenhang auch »auswählen« oder »aussondern«. Das Wort für »Kleinvieh« umfasst Schafe und Ziegen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das Passa«; gemeint ist hier das Tier, das für das Passa geschlachtet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zusammen
  rationale: קרא bezeichnet hier das Zusammenrufen der Ältesten, damit Mose ihnen Anweisungen geben kann. Die deutsche Wendung gibt diesen Sinn natürlich wieder.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: Ältesten Israels
  rationale: Übliche und sachlich genaue Wiedergabe der anerkannten Repräsentanten beziehungsweise führenden Männer Israels.
- source_word: מִשְׁכוּ
  choice: Zieht los
  rationale: Die Grundbedeutung ist »ziehen«. Im Zusammenhang kann die Form auch das Herausziehen beziehungsweise Auswählen eines Tieres meinen; »zieht los« bewahrt den eigenständigen Imperativ, ohne eine nicht ausdrücklich genannte Herde einzufügen.
- source_word: וּקְחוּ לָכֶם
  choice: nehmt euch
  rationale: Gibt sowohl לקח als auch das reflexiv wirkende לָכֶם knapp und idiomatisch wieder.
- source_word: צֹאן
  choice: je ein Tier vom Kleinvieh
  rationale: צֹאן bezeichnet Kleinvieh und umfasst Schafe wie Ziegen. Der Singular »ein Tier« ergibt sich aus dem distributiven Zusammenhang und vermeidet die sachlich zu enge Festlegung auf ein Lamm.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: für eure Sippen
  rationale: מִשְׁפָּחָה kann eine größere Familien- oder Sippengruppe bezeichnen. »Für« gibt hier die Zuordnung der Tiere zu diesen Gruppen natürlich wieder.
- source_word: וְשַׁחֲטוּ
  choice: schlachtet
  rationale: Präzise Wiedergabe des üblichen Verbs für das Schlachten eines Tieres, auch im Opferzusammenhang.
- source_word: הַפָּסַח
  choice: das Passaopfer
  rationale: Wörtlich steht »das Passa«; hier bezeichnet der Ausdruck metonymisch das zu schlachtende Passatier. »Passaopfer« macht den Bezug verständlich, ohne das Tier entgegen Exodus 12,5 auf ein Lamm zu beschränken.
theological_decisions:
- issue: Referent von הַפָּסַח
  choice: das Passaopfer
  alternative: das Passa; das Passalamm
  rationale: Im unmittelbaren Satz ist das Passatier gemeint. »Passalamm« wäre vertraut, würde jedoch die in Exodus 12,5 zugelassene Ziege ausschließen; »Passaopfer« wahrt den Opferbezug und den weiteren Umfang.
- issue: Tierart bei צֹאן
  choice: Tier vom Kleinvieh
  alternative: Schaf; Lamm
  rationale: Der hebräische Sammelbegriff umfasst Schafe und Ziegen. Die Übersetzung erhält diese für den Kontext bedeutsame Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. »Sippen« ist verständlich und bildet die größere Familiengruppe genauer ab als das möglicherweise zu enge »Familien«. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
