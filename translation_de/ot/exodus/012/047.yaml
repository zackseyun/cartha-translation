  text: All the congregation of Israel shall do it[a].
translation:
  language: de
  text: Die ganze Gemeinschaft Israels soll es tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die ganze Versammlung Israels soll es vollziehen.“'
    reason: Lexikalische Alternativen für עֲדָה und kontextbezogene Wiedergabe von עשה.
lexical_decisions:
- source_word: כָּל עֲדַת
  choice: die ganze Gemeinschaft
  rationale: כָּל bezeichnet zusammen mit dem singularischen Kollektiv עֲדָה die Gemeinschaft in ihrer Gesamtheit. „Die ganze Gemeinschaft“ ist im heutigen Deutsch natürlich und bewahrt den korporativen Sinn.
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Der Eigenname wird in der üblichen deutschen Form wiedergegeben; der Genitiv entspricht der hebräischen Statusverbindung.
- source_word: יַעֲשׂוּ
  choice: soll … tun
  rationale: Die Präformativkonjugation hat hier gebietenden beziehungsweise normativen Sinn. „Soll … tun“ bewahrt die breite Grundbedeutung von עשה, ohne die Handlung bereits als „feiern“ oder „halten“ auszulegen.
- source_word: אֹתוֹ
  choice: es
  rationale: Das maskuline Objektpronomen verweist im Zusammenhang auf das Passa beziehungsweise dessen Vollzug. „Es“ wahrt die knappe und nicht völlig ausformulierte Referenz des Hebräischen.
theological_decisions:
- issue: Korporatives Subjekt des Passagebots
  choice: Die Gemeinschaft Israels als Ganze ist angesprochen.
  alternative: Jeder einzelne Israelit muss es tun.
  rationale: Das singularische Kollektiv עֲדַת mit der Gesamtangabe כָּל bezeichnet Israel gemeinschaftlich. Die Übersetzung vermeidet es, daraus ausdrücklich eine individualisierende Forderung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gemeinschaft“ ist allgemein verständlich und gibt den kollektiven Charakter wieder; die Fußnote bietet die stärker versammlungsbezogene und kultisch-kontextuelle Alternative.
