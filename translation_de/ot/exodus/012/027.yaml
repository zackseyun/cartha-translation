  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: de
  text: 'Ihr sollt sagen: »Es ist das Passaopfer für Jahwe, der an den Häusern der Israeliten in Ägypten vorüberging[a], als er Ägypten schlug und unsere Häuser rettete.« Da verneigte sich das Volk und betete an.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb ist mit dem Wort »Passa« verwandt und kann hier auch bedeuten, dass Jahwe die Häuser verschonte oder beschützte.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: Passaopfer
  rationale: Die knappe deutsche Zusammensetzung gibt die hebräische Konstruktverbindung natürlich wieder und bewahrt ausdrücklich den Opfercharakter.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל bezeichnet hier die Widmung bzw. Zuordnung des Opfers; „für“ ist im heutigen Deutschen idiomatischer als „Jahwe“ mit „zu“.
- source_word: פָּסַח
  choice: vorüberging
  rationale: Die Wiedergabe hält die sprachliche Verbindung zu „Passa“ erkennbar; zugleich kann das Verb im Kontext auch das Verschonen oder schützende Vorübergehen bezeichnen, was die Fußnote festhält.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: Häuser der Israeliten
  rationale: „Israeliten“ ist modernes, natürliches Deutsch und bezeichnet hier die Angehörigen Israels insgesamt, ohne den hebräischen Bundesausdruck unnötig schwerfällig wiederzugeben.
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: als er Ägypten schlug
  rationale: Die mit ב gebildete Infinitivkonstruktion ist temporal; „schlug“ bewahrt die Breite und Härte von נגף, ohne das Verb auf die Plagen einzuengen.
- source_word: הִצִּיל
  choice: rettete
  rationale: נצל im Hifil bezeichnet das Herausreißen bzw. Retten aus Gefahr. „Rettete“ ist präziser als bloßes „verschonte“, auch wenn im Kontext Verschonung mitgemeint ist.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: verneigte sich ... und betete an
  rationale: 'Die beiden Verben bleiben als unterschiedliche Handlungen erkennbar: körperliches Niederbeugen und verehrende Anbetung.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פָּסַח
  choice: vorüberging
  alternative: verschonte / beschützte
  rationale: Die Hauptfassung bewahrt das Wortspiel mit „Passa“, während die Fußnote die im Kontext mögliche Schutz- und Verschonungsnuance offenhält.
- issue: בְנֵי יִשְׂרָאֵל als Bundesbezeichnung
  choice: Israeliten
  alternative: Söhne Israels / Kinder Israels
  rationale: Die idiomatische Volksbezeichnung erfasst den kollektiven Bezug im modernen Deutschen, ohne eine ausschließlich männliche Referenz zu behaupten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber verständlich. Der Gegensatz zwischen dem Schlagen Ägyptens und dem Retten der israelitischen Häuser wird durch „aber“ verdeutlicht, ohne eine zusätzliche theologische Aussage einzuführen.
