  text: תּוֹרָ֣ה אַחַ֔ת יִהְיֶ֖ה לָֽ/אֶזְרָ֑ח וְ/לַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/049.yaml
  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: de
  text: Ein und dasselbe Gesetz soll für den Einheimischen und für den Fremden gelten, der unter euch lebt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Weisung soll für den Einheimischen und für den ansässigen Fremden gelten, der in eurer Mitte wohnt.“'
    reason: Lexikalische Alternativen für תּוֹרָה und גֵּר sowie eine formellere Wiedergabe von בְּתוֹכְכֶם.
lexical_decisions:
- source_word: תּוֹרָה
  choice: Gesetz
  rationale: Im unmittelbaren Rechtskontext der Passafeier bezeichnet תּוֹרָה eine verbindliche Regelung. „Gesetz“ gibt diesen Sinn im Deutschen klar wieder; „Weisung“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: אַחַת
  choice: ein und dasselbe
  rationale: Die feminine Zahlform stimmt mit תּוֹרָה überein und betont einen einheitlichen Rechtsmaßstab für beide Gruppen. „Ein und dasselbe“ ist im modernen Deutschen idiomatischer als „ein Gesetz“, ohne die Aussage zu verstärken.
- source_word: יִהְיֶה
  choice: soll … gelten
  rationale: Wörtlich steht „soll sein“. In einem deutschen Rechtssatz drückt „soll … gelten“ natürlich und präzise aus, dass diese Regelung auf beide Gruppen bezogen ist.
- source_word: אֶזְרָח
  choice: der Einheimische
  rationale: אֶזְרָח bezeichnet ein einheimisches Mitglied der Gemeinschaft. „Einheimischer“ vermeidet die modernen staatsrechtlichen Nebenbedeutungen von „Bürger“.
- source_word: גֵּר
  choice: der Fremde
  rationale: גֵּר meint hier einen nicht einheimischen Menschen, der dauerhaft innerhalb der Gemeinschaft lebt. „Fremder“ ist verständlich und würdig; die nähere Bestimmung „der unter euch lebt“ macht den Status als ansässiger Fremder deutlich.
- source_word: הַגָּר
  choice: der … lebt
  rationale: Das Partizip von גור erläutert גֵּר als einen Fremden, der sich innerhalb der Gemeinschaft aufhält bzw. dort wohnt. Eine Wiederholung wie „der als Fremder fremdlebt“ wäre im Deutschen unnatürlich.
- source_word: בְּתוֹכְכֶם
  choice: unter euch
  rationale: „Unter euch“ ist eine natürliche moderne Wiedergabe des gemeinschaftlichen Sinnes von בְּתוֹכְכֶם.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rechtliche Aussage bleibt knapp; „ein und dasselbe“ verdeutlicht die im Hebräischen durch אַחַת ausgedrückte Einheit des Maßstabs. Die Fußnote bewahrt die Alternativen „Weisung“ und „ansässiger Fremder“.
