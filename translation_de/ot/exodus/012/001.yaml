  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹ֔ן בְּ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/001.yaml
  text: The LORD said to Moses and to Aaron in the land of Egypt, saying,
translation:
  language: de
  text: 'Der HERR[a] sagte zu Mose und zu Aaron im Land Ägypten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: Die Übersetzung »HERR« soll den im Ausgangstext verwendeten Eigennamen nicht verdecken.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche deutsche Erzählform gibt das hebräische wayyiqtol natürlich wieder, ohne ein nicht ausdrücklich vorhandenes »nun« einzufügen.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: zu Mose und zu Aaron
  rationale: Die Wiederholung der hebräischen Präposition wird im Deutschen bewahrt und hebt beide Angesprochenen klar hervor.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Dies entspricht der Ortsangabe des Hebräischen und wahrt ihren Bezug zur folgenden Rede.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im natürlichen modernen Deutsch die unmittelbar folgende wörtliche Rede ein und erfüllt hier die Funktion der hebräischen Redeformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen bleibt im Haupttext gut verständlich; die Fußnote macht transparent, dass im Hebräischen der Eigenname JHWH steht.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Redeformel wird nicht hölzern mit »indem er sagte« wiedergegeben, sondern durch einen Doppelpunkt natürlich markiert.
