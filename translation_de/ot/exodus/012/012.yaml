  source_fidelity: 'Der deutsche Text gibt sämtliche hebräischen Satzglieder sachgerecht wieder: das Durchziehen durch das Land in dieser Nacht, das Schlagen jedes Erstgeborenen von Mensch bis Vieh sowie die gegen Ägyptens Götter gerichteten Gerichte. „Schlagen“ vermeidet eine über den Wortlaut hinausgehende Explikation des Todes. Die Wiedergabe von וּבְכָל als „an allen“ ist im Zusammenhang mit dem gerichtlichen Vollzug treffend.'
  naturalness: Modernes, gut lesbares und zugleich würdiges Standarddeutsch. Die Dreisatzgliederung ist natürlich und beeinträchtigt weder Nachdruck noch Sinnzusammenhang. „Strafgerichte vollstrecken“ ist eine etablierte, dem gehobenen Register angemessene Formulierung.
  terminology: „Jahwe“ gibt den Gottesnamen direkt wieder; die Fußnote nennt transparent die traditionelle Wiedergabe „der HERR“. „Götter Ägyptens“ folgt dem hebräischen Wortlaut und vermeidet sowohl eine entmythologisierende als auch eine konfessionell vorentscheidende Umdeutung. „Vieh“ ist für בְּהֵמָה in der Mensch-Tier-Spannweite passend.
