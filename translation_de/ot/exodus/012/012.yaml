reference: Exodus 12:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: de
  text: Denn in dieser Nacht werde ich durch das Land Ägypten ziehen[a] und jeden Erstgeborenen im Land Ägypten schlagen, vom Menschen bis zum Vieh. An allen Göttern Ägyptens werde ich Strafgerichte vollstrecken. Ich bin Jahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch das Land Ägypten gehen“. Das Verb bezeichnet hier das Durchqueren des Landes, nicht ein verschonendes Vorübergehen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: werde ich durch … ziehen
  rationale: עבר mit בְּאֶרֶץ bezeichnet hier die Bewegung durch das Land. Die Wiedergabe vermeidet die irreführende Bedeutung „verschonend vorübergehen“, die erst beim Zeichen an den Häusern thematisch wird.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: durch das Land Ägypten
  rationale: Die ausdrückliche Gebietsbezeichnung אֶרֶץ bleibt erhalten und bezeichnet den räumlichen Umfang des Handelns.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: in dieser Nacht
  rationale: Natürliches modernes Deutsch, das den demonstrativen Nachdruck von הַזֶּה bewahrt.
- source_word: וְהִכֵּיתִי
  choice: werde ich … schlagen
  rationale: „Schlagen“ gibt נכה direkt wieder, ohne das im Kontext vorausgesetzte tödliche Ergebnis zusätzlich auszudeuten.
- source_word: כָּל בְּכוֹר
  choice: jeden Erstgeborenen
  rationale: Die singularische Kollektivform wird idiomatisch wiedergegeben. Eine Ergänzung wie „männlich“ steht nicht ausdrücklich im hebräischen Text.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: vom Menschen bis zum Vieh
  rationale: Die umfassende Spannweite zwischen Mensch und Tier wird gewahrt; בְּהֵמָה bezeichnet in diesem Kontext passend das Vieh.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: An allen Göttern Ägyptens
  rationale: Die Götter werden als Ziel des gerichtlichen Handelns benannt; der Text wird weder zu „Götzen“ noch zu menschlichen Herrschern umgedeutet.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: werde ich Strafgerichte vollstrecken
  rationale: Die Wendung bewahrt sowohl den gerichtlichen Charakter von שְׁפָטִים als auch ihren strafenden Vollzug und klingt im Deutschen würdevoll und verständlich.
- source_word: אֲנִי יְהוָה
  choice: Ich bin Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben; eine Fußnote nennt die traditionelle deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird im Haupttext sichtbar bewahrt. Die traditionelle Wiedergabe „der HERR“ wird als Alternative in der Fußnote genannt.
- issue: Status der אֱלֹהֵי מִצְרַיִם
  choice: Götter Ägyptens
  alternative: Götzen Ägyptens
  rationale: Der hebräische Ausdruck wird ohne ontologische Vorentscheidung oder polemische Umdeutung wiedergegeben. So bleibt die Aussage bestehen, dass Gottes Gerichte auch gegen die ägyptischen Gottheiten gerichtet sind.
- issue: Art der Gerichte über Ägyptens Götter
  choice: Strafgerichte vollstrecken
  alternative: Gerichte halten
  rationale: Die Übersetzung erhält die forensische und strafende Spannung der idiomatischen Wendung, ohne näher festzulegen, auf welche Weise die Götter getroffen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen weitgehend der hebräischen Abfolge, werden aber für natürlichen deutschen Lesefluss in drei Sätze gegliedert. „Strafgerichte vollstrecken“ hält den feierlich-juridischen Ton, ohne altertümlich zu wirken.
