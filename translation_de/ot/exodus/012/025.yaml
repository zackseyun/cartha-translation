source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: de
  text: Wenn ihr in das Land kommt, das Jahwe euch geben wird, wie er es zugesagt hat[a], sollt ihr diesen Gottesdienst halten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wie er gesagt hat“. Im Zusammenhang hat das Gesagte den Sinn einer vorherigen Zusage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „diesen Ritus“, „diese Feier“ oder „diesen Dienst“. Gemeint ist der vorgeschriebene gottesdienstliche Vollzug des Passafestes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Wenn
  rationale: Die hebräische Wendung führt einen künftigen Zeitpunkt beziehungsweise Umstand ein. „Wenn“ gibt dies im Deutschen natürlich wieder, ohne die wörtliche Konstruktion „Und es wird geschehen“ nachzuahmen.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: ihr in das Land kommt
  rationale: בוא kann „kommen“ oder „hineingehen“ bedeuten. Mit אֶל הָאָרֶץ ist „in das Land kommen“ idiomatisch und bewahrt den Bezug auf das verheißene Land.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: das Jahwe euch geben wird
  rationale: Das Präfixverb יִתֵּן bezeichnet hier im Zusammenhang eine zukünftige Gabe. Die Satzstellung ist im modernen Deutschen klar und natürlich.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: wie er es zugesagt hat
  rationale: דבר bedeutet wörtlich „reden/sagen“; im Zusammenhang verweist es auf Jahwes vorherige Zusage. „Zugesagt“ bringt diesen Sinn idiomatisch zum Ausdruck, während die wörtlichere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: וּשְׁמַרְתֶּם
  choice: sollt ihr … halten
  rationale: שׁמר bezeichnet bei einer kultischen Vorschrift das Beachten oder Einhalten. „Sollt … halten“ bewahrt den verpflichtenden Charakter und ist im Deutschen verständlich.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: diesen Gottesdienst
  rationale: עֲבֹדָה bezeichnet Dienst oder Arbeit und hier konkret den vorgeschriebenen kultischen Dienst des Passafestes. „Gottesdienst“ wahrt den kultischen Bezug; alternative Wiedergaben werden in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Verheißungscharakter von כַּאֲשֶׁר דִּבֵּר
  choice: wie er es zugesagt hat
  alternative: wie er gesagt hat
  rationale: Der Kontext der Landgabe lässt die vorausgehende Rede als Zusage erkennen. Da דבר selbst jedoch lediglich „reden/sagen“ bedeutet, wird die weniger deutende Alternative in der Fußnote bewahrt.
- issue: Kultische Bedeutung von עֲבֹדָה
  choice: Gottesdienst
  alternative: Ritus / Feier / Dienst
  rationale: Im unmittelbaren Passakontext bezeichnet das Wort nicht allgemein Arbeit oder Knechtschaft, sondern den angeordneten kultischen Vollzug. „Gottesdienst“ macht dies deutlich, ohne eine bestimmte spätere liturgische Form festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist bewusst knapp und mündlich verständlich. „Gottesdienst“ wird kultisch gebraucht; die Fußnote verhindert eine Verengung auf den heutigen christlichen Sonntagsgottesdienst.
