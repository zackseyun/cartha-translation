review_pass:
  verdict: revise
  source_fidelity: Der Satz gibt die hebräische Ereignisfolge, den Zeitpunkt, den Gottesnamen, die Spannweite „vom ... bis ...“ und die Einbeziehung des Viehs insgesamt zuverlässig wieder. Die Relativbestimmung הַיֹּשֵׁב עַל־כִּסְאוֹ bezeichnet im Satzbau am naheliegendsten den Pharao, nicht dessen Erstgeborenen. Eine als gleichwertig dargestellte Mehrdeutigkeit ist daher nicht erforderlich.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. „Um Mitternacht“ und „schlug ... nieder“ sind idiomatisch. Der Einschub „auch“ vor dem letzten Glied ist möglich, aber für die schlichte hebräische Anreihung nicht nötig.
  terminology: „Jahwe“, „Erstgeborener“, „Gefangener“, „Kerker“ und „Vieh“ sind treffend. Die Erläuterung zu בֵּית הַבּוֹר als kerkerartigem Gefängnis ist sachgerecht.
  issues:
  - severity: medium
    issue: Fußnote a stellt den Bezug von „der auf seinem Thron saß“ als gleichwertig mehrdeutig dar.
    rationale: Die hebräische Partizipialgruppe folgt auf „Pharao“ und beschreibt in diesem Kontext naheliegend den regierenden Pharao. Der Bezug auf dessen Erstgeborenen ist nicht die naheliegende Lesart und sollte nicht als gleichrangige Bedeutungsoption in einer Fußnote eingeführt werden.
  revised_text: 'Und um Mitternacht schlug Jahwe jeden Erstgeborenen im Land Ägypten nieder: vom Erstgeborenen des Pharao, der auf seinem Thron saß, bis zum Erstgeborenen des Gefangenen, der im Kerker war, und jeden Erstgeborenen des Viehs.'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich etwa: „der im Haus der Grube war“; gemeint ist ein kerkerartiges Gefängnis.'
    reason: lexical_cultural_clarification
  revision_rationale: Die nicht notwendige Ambiguitätsfußnote zum thronenden Pharao wird entfernt. Die verbliebene Fußnote wird am Ausdruck „im Kerker war“ verankert; ihre Markierung wird entsprechend von b zu a angepasst. Das überinterpretierende „auch“ wird gestrichen, ohne den Sinn zu verändern.
