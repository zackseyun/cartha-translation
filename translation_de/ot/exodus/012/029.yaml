  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: de
  text: 'Und um Mitternacht schlug Jahwe jeden Erstgeborenen im Land Ägypten nieder: vom Erstgeborenen des Pharao, der auf seinem Thron saß, bis zum Erstgeborenen des Gefangenen, der im Kerker war, und jeden Erstgeborenen des Viehs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und
  rationale: Die Erzählform führt das Ereignis in der fortlaufenden Handlung ein. Das schlichte „Und“ wahrt den Anschluss, ohne die altertümliche Formel „Und es geschah“ zu verwenden.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: um Mitternacht
  rationale: Die Wendung bezeichnet wörtlich die Mitte der Nacht; „um Mitternacht“ ist die natürliche deutsche Entsprechung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִכָּה
  choice: schlug ... nieder
  rationale: נכה bezeichnet das Schlagen; hier ist der Tod die Folge. „Niederschlagen“ bewahrt das Bild und macht im Kontext den tödlichen Ausgang deutlich.
- source_word: כָל בְּכוֹר
  choice: jeden Erstgeborenen
  rationale: Die distributive Wiedergabe entspricht כָל mit dem Singular בְּכוֹר und ist im Deutschen natürlich.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die formale geografische Wendung wird knapp und idiomatisch bewahrt.
- source_word: מִבְּכֹר ... עַד בְּכוֹר
  choice: vom Erstgeborenen ... bis zum Erstgeborenen
  rationale: Die Konstruktion מִן ... עַד markiert die gesamte Spannweite der Betroffenen und wird direkt mit „von ... bis“ wiedergegeben.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: der auf seinem Thron saß
  rationale: Das Partizip beschreibt eine Person in königlicher Stellung. Die deutsche Relativkonstruktion bewahrt zugleich die grammatische Möglichkeit, den Bezug entweder bei Pharao oder bei seinem Erstgeborenen zu sehen.
- source_word: בְּכוֹר הַשְּׁבִי
  choice: der Erstgeborene des Gefangenen
  rationale: שְׁבִי bezeichnet einen Gefangenen oder Verschleppten. „Gefangener“ ist im gegebenen Kerkerkontext verständlich, ohne unnötig auf Kriegsgefangenschaft festzulegen.
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: der im Kerker war
  rationale: Die wörtliche Wendung „Haus der Grube“ bezeichnet hier einen kerkerartigen Haftort. „Kerker“ vermittelt die Funktion und die düstere räumliche Vorstellung natürlich.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: und auch jeden Erstgeborenen des Viehs
  rationale: בְּהֵמָה meint hier die domestizierten Tiere insgesamt. „Vieh“ ist die treffende deutsche Sammelbezeichnung; „auch“ verdeutlicht den anschließenden Zusatz, ohne seinen Sinn zu verändern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt diesen Namen und ersetzt ihn nicht durch den Titel „Herr“.
- issue: Bezug von הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: Eine im Deutschen grammatisch mehrdeutige Relativkonstruktion
  alternative: Eindeutige Zuordnung entweder zu Pharao oder zu seinem Erstgeborenen
  rationale: Sowohl „Pharao“ als auch „Erstgeborener“ sind maskulin Singular, sodass der hebräische Ausdruck formal auf beide bezogen werden kann. Da eine eindeutige Festlegung exegetische Folgen für die Thronfolge haben kann, wird die Mehrdeutigkeit nicht stillschweigend aufgelöst.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Der Doppelpunkt macht die anschließende Spannweite von der höchsten bis zur niedrigsten gesellschaftlichen Stellung gut erfassbar. „Jahwe“ steht als persönlicher Gottesname; altertümliche Formen wie „es begab sich“ oder „erschlug“ werden vermieden.
