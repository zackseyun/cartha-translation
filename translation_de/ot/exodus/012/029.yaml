  to: 'Und um Mitternacht schlug Jahwe jeden Erstgeborenen im Land Ägypten nieder: vom Erstgeborenen des Pharao, der auf seinem Thron saß, bis zum Erstgeborenen des Gefangenen, der im Kerker war, und jeden Erstgeborenen des Viehs.'
