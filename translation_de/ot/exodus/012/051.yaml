source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: de
  text: Und genau an diesem Tag brachte Jahwe die Söhne Israels[a] aus dem Land Ägypten heraus, nach ihren Heerscharen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „die Kinder Israels“ oder „die Israeliten“. Im Hebräischen steht wörtlich „die Söhne Israels“, eine familiäre Bezeichnung für das Volk als Ganzes.
    reason: lexical_alternative
  - marker: b
    text: Auch „in ihren Verbänden“ oder „nach ihren geordneten Gruppen“. Das hebräische Wort kann Heerscharen, Heere oder organisierte Verbände bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und
  rationale: Die Erzählungsverknüpfung und die Einleitung des Zeitrahmens werden im heutigen Deutsch knapp und natürlich mit „Und“ wiedergegeben; eine ausgeschriebene Formel wie „Und es geschah“ wäre hier unnötig schwerfällig.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: genau an diesem Tag
  rationale: Die Wendung betont, dass das Ereignis exakt an dem genannten Tag geschah. „Genau an diesem Tag“ bewahrt sowohl den demonstrativen Bezug als auch die emphatische Kraft.
- source_word: הוֹצִיא
  choice: brachte … heraus
  rationale: Der Hifil von יצא bezeichnet das Veranlassen des Herausgehens. „Brachte … heraus“ gibt diesen kausativen Sinn wieder, ohne die Art des Vorgangs näher festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner geläufigen wissenschaftlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Übersetzung bewahrt den wörtlichen familiären und gemeinschaftlichen Ausdruck des Hebräischen. Eine Fußnote nennt geläufigere deutsche Alternativen.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten heraus
  rationale: Die Wiedergabe erhält das ausdrücklich genannte „Land“ und macht zugleich die gerichtete Bewegung aus Ägypten heraus deutlich.
- source_word: עַל צִבְאֹתָם
  choice: nach ihren Heerscharen
  rationale: צָבָא kann Heerschar, Heer oder organisierter Verband bedeuten. Die traditionelle, quellennahe Formulierung bewahrt die mögliche militärisch-organisatorische Färbung, ohne sie im Haupttext aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Seine Wiedergabe als „Jahwe“ erhält den Unterschied zwischen Name und Titel.
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: „Söhne Israels“ bewahrt die genealogisch-familiäre Ausdrucksweise der Quelle; die Formulierung bezeichnet hier das Volk als Ganzes und wird durch eine Fußnote erläutert.
- issue: Bedeutungsumfang von עַל צִבְאֹתָם
  choice: nach ihren Heerscharen
  alternative: in ihren Verbänden
  rationale: Die gewählte Form lässt offen, ob der Ausdruck stärker militärisch oder allgemein organisatorisch verstanden werden soll, statt die Spannung zugunsten nur einer Deutung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am knappen hebräischen Erzählduktus. „Heerscharen“ ist bewusst etwas gehoben, da es den Bedeutungsumfang und die mögliche militärische Färbung von צְבָאוֹת besser offenhält als eine ausschließlich zivile Umschreibung.
