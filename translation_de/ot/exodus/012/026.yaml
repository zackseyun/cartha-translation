  text: וְ/הָיָ֕ה כִּֽי יֹאמְר֥וּ אֲלֵי/כֶ֖ם בְּנֵי/כֶ֑ם מָ֛ה הָ/עֲבֹדָ֥ה הַ/זֹּ֖את לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/026.yaml
  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: de
  text: 'Und wenn eure Söhne zu euch sagen: »Was bedeutet dieser Dienst für euch?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Was ist dieser Dienst für euch?«'
    reason: Die hebräische Wendung מָה ... לָכֶם lautet formal „Was ist ... für euch?“ und fragt im Kontext nach der Bedeutung beziehungsweise dem Stellenwert dieses Dienstes für die Angesprochenen.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die hebräische Formel leitet hier einen künftig eintretenden Fall ein. »Und wenn« gibt sie im Deutschen natürlich und knapp wieder.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: zu euch sagen
  rationale: אמר bedeutet grundsätzlich »sagen«. Obwohl der folgende Inhalt eine Frage ist, bewahrt diese Wiedergabe die Formulierung des Ausgangstextes.
- source_word: בְּנֵיכֶם
  choice: eure Söhne
  rationale: Das hebräische Substantiv steht ausdrücklich im maskulinen Plural und bezeichnet hier die Söhne der Angesprochenen.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: dieser Dienst
  rationale: עֲבֹדָה kann Arbeit oder Dienst, im Kontext auch kultischen Dienst, bezeichnen. »Dienst« bewahrt diese Bedeutungsbreite, ohne vorschnell »Ritual« oder »Gottesdienst« festzulegen.
- source_word: מָה ... לָכֶם
  choice: Was bedeutet euch ...?
  rationale: Die wörtliche Struktur lautet »Was ist ... euch/für euch?«. Die gewählte deutsche Form gibt idiomatisch die Frage nach Bedeutung oder Stellenwert wieder; die formalere Fassung wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt im Plural; »Söhne« und »Dienst« bewahren die konkrete beziehungsweise semantisch breite Ausdrucksweise des Hebräischen.
