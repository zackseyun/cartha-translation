reference: Exodus 12:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: de
  text: Sieben Tage lang sollt ihr ungesäuertes Brot essen. Doch am ersten Tag sollt ihr den Sauerteig aus euren Häusern entfernen[a]. Denn jeder, der vom ersten bis zum siebten Tag etwas Gesäuertes isst, soll aus Israel abgeschnitten werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Sauerteig aufhören lassen“; gemeint ist, ihn zu beseitigen. Auch die Wiedergabe „vernichten“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: „Abgeschnitten werden“ ist eine hebräische Rechtsformel. Sie kann den Ausschluss aus der Gemeinschaft, den Tod oder ein göttliches Gericht bezeichnen; wie die Sanktion vollzogen wird, sagt dieser Vers nicht.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: ungesäuertes Brot
  rationale: Das Substantiv bezeichnet ohne Sauerteig zubereitetes Brot. Diese Wiedergabe ist im Deutschen klar und entspricht dem Festkontext.
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel leitet hier eine nachdrückliche besondere Anweisung ein; „Doch“ gibt diesen Übergang natürlich wieder.
- source_word: תַּשְׁבִּיתוּ
  choice: sollt ihr … entfernen
  rationale: Der Hifil von שׁבת bedeutet hier, den Sauerteig aufhören beziehungsweise verschwinden zu lassen. „Entfernen“ gibt die praktische Forderung idiomatisch wieder, ohne unnötig eine Vernichtung festzulegen.
- source_word: שְּׂאֹר
  choice: Sauerteig
  rationale: Das Wort bezeichnet ein Gär- oder Triebmittel, wahrscheinlich fermentierten Teig. „Sauerteig“ ist im Deutschen konkret, verständlich und für den antiken Kontext geeigneter als das modernere „Hefe“.
- source_word: חָמֵץ
  choice: etwas Gesäuertes
  rationale: Der Ausdruck bezeichnet allgemein Gesäuertes und ist nicht ausdrücklich auf Brot beschränkt.
- source_word: וְנִכְרְתָה
  choice: soll … abgeschnitten werden
  rationale: Die bewusst formale Wiedergabe bewahrt das hebräische Rechts- und Bundesidiom, ohne festzulegen, ob Ausschluss, Tod oder göttliches Gericht gemeint ist.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: jeder, der …, soll
  rationale: נֶפֶשׁ bezeichnet in dieser Rechtsformel die betreffende Person. Die deutsche Konstruktion gibt den Personenbezug natürlich wieder und vermeidet das missverständliche „Seele“.
- source_word: מִיִּשְׂרָאֵל
  choice: aus Israel
  rationale: Die knappe Formulierung bewahrt den Wortlaut und seinen Bezug auf das Bundesvolk.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: vom ersten bis zum siebten Tag
  rationale: Die Zeitangabe bestimmt im Zusammenhang den Zeitraum, in dem das Essen von Gesäuertem unter die genannte Sanktion fällt.
theological_decisions:
- issue: Bedeutung der Sanktion וְנִכְרְתָה („abgeschnitten werden“)
  choice: Das formale Rechtsidiom „aus Israel abgeschnitten werden“ bleibt im Haupttext erhalten.
  alternative: „aus der Gemeinschaft ausgeschlossen“, „getötet“ oder „durch göttliches Gericht beseitigt werden“
  rationale: Der Vers nennt die genaue Vollzugsweise nicht. Die formale Wiedergabe bewahrt das bundesrechtliche Gewicht und die echte Deutungsoffenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sauerteig“ und „Gesäuertes“ unterscheiden das Gärmittel von den damit zubereiteten Speisen. Die markierte Formulierung „aus Israel abgeschnitten werden“ ist absichtlich etwas formal, damit die rechtlich-theologische Mehrdeutigkeit des Hebräischen erhalten bleibt.
