base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/024.yaml
  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: de
  text: Ihr sollt dies[a] als Satzung für dich und deine Söhne[b] auf ewig einhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „diese Sache“ oder „dieses Wort“. Das hebräische Wort kann eine Angelegenheit, eine Sache oder ein gesprochenes Wort bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „deine Kinder“ oder „deine Nachkommen“. Im Hebräischen steht „deine Söhne“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Ihr sollt … einhalten
  rationale: שׁמר bezeichnet hier im rechtlich-bundestheologischen Zusammenhang das Beachten und fortdauernde Befolgen einer Vorschrift. „Einhalten“ ist im modernen Deutschen natürlich und bewahrt den verpflichtenden Sinn.
- source_word: הַדָּבָר הַזֶּה
  choice: dies
  rationale: דָּבָר kann Sache, Angelegenheit oder Wort bedeuten. Das neutrale „dies“ verweist natürlich auf die zuvor angeordnete Passafeier, ohne den Ausdruck unnötig auf eine einzelne Bedeutung einzuengen.
- source_word: לְחָק
  choice: als Satzung
  rationale: חֹק bezeichnet eine festgesetzte, verbindliche Ordnung. „Satzung“ erhält den rechtlich-bundeshaften Charakter und entspricht dem gehobenen biblischen Register.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: für dich und deine Söhne
  rationale: Der hebräische Text wechselt vom pluralischen „ihr“ zum singularischen „dich“ und nennt ausdrücklich „deine Söhne“. Diese Formen werden bewahrt, statt die auffällige Numerusfolge zu glätten oder „Söhne“ im Haupttext zu verallgemeinern.
- source_word: עַד עוֹלָם
  choice: auf ewig
  rationale: Die Verbindung bezeichnet eine unbegrenzte beziehungsweise fortdauernde Geltung. „Auf ewig“ gibt diesen starken Dauerbezug knapp und würdig wieder.
theological_decisions:
- issue: Umfang der Nachfolgebezeichnung „deine Söhne“
  choice: Die konkrete Formulierung „deine Söhne“ bleibt im Haupttext erhalten.
  alternative: „deine Kinder“ oder „deine Nachkommen“
  rationale: בָנֶיךָ bedeutet hier wörtlich „deine Söhne“. Der Ausdruck kann im Zusammenhang die Weitergabe innerhalb der kommenden Generationen vertreten, doch diese mögliche Reichweite soll die konkrete Ausgangsformulierung nicht stillschweigend ersetzen.
- issue: Wechsel von pluralischer Anrede zu singularischem Besitzbezug
  choice: „Ihr sollt … für dich und deine Söhne“
  alternative: 'Durchgehend pluralisch: „für euch und eure Söhne“'
  rationale: Der masoretische Text hat zunächst die zweite Person Plural, danach aber לְךָ und בָנֶיךָ in der zweiten Person Singular. Die Übersetzung bewahrt diese echte Spannung, auch wenn sie im Deutschen auffällig klingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Satzung“ trägt den rechtlich-bundeshaften Ton; „dies“ vermeidet das im Deutschen schwerfällige „diese Sache“. Der auffällige Wechsel von pluralischer zu singularischer Anrede wird als Merkmal des hebräischen Textes bewusst nicht harmonisiert.
