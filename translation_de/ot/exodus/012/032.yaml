  yaml_path: translation/ot/exodus/012/032.yaml
  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: de
  text: Nehmt sowohl eure Schafe und Ziegen als auch eure Rinder mit, wie ihr gesagt habt, und geht! Segnet auch mich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Segnet sogar mich.« Die Formulierung kann hervorheben, dass auch der Pharao beim Aufbruch Israels Segen sucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: auch eure Schafe und Ziegen und eure Rinder
  rationale: Die wiederholte Partikel גַּם verbindet und betont beide Viehgruppen. צֹאן bezeichnet kollektiv vor allem Schafe und Ziegen, בָּקָר Rinder; die konkrete Wiedergabe ist im heutigen Deutsch klar und natürlich.
- source_word: קְחוּ
  choice: Nehmt … mit
  rationale: Der pluralische Imperativ von לקח fordert im Zusammenhang dazu auf, das Vieh beim Weggang mitzunehmen. Die trennbare deutsche Wendung gibt dies idiomatisch wieder.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: wie ihr gesagt habt
  rationale: Die Formulierung verweist auf die zuvor vorgetragene Forderung und bewahrt den vergleichenden Sinn ohne unnötige Verstärkung.
- source_word: וָלֵכוּ
  choice: und geht
  rationale: Der Imperativ von הלך ist direkt wiedergegeben; im Kontext bezeichnet er Israels Aufbruch.
- source_word: וּבֵרַכְתֶּם גַּם אֹתִי
  choice: Segnet auch mich
  rationale: ברך bedeutet hier „segnen“. גַּם אֹתִי fügt den Pharao selbst als Empfänger hinzu; die deutsche Wortstellung ist natürlich und erhält die Betonungsmöglichkeit.
theological_decisions:
- issue: Art der vom Pharao erbetenen Segnung
  choice: Die Bitte wird schlicht als „Segnet auch mich“ wiedergegeben.
  alternative: „Bittet auch für mich um Segen“ oder eine bloße Segensformel zum Abschied.
  rationale: Der hebräische Text nennt weder ausdrücklich eine Fürbitte noch einen bloßen Abschiedsgruß. Die direkte Wiedergabe bewahrt diese theologische und pragmatische Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Erzählton. Die Tierarten werden konkret benannt; die knappen Imperative und die Mehrdeutigkeit der Segensbitte bleiben erhalten.
