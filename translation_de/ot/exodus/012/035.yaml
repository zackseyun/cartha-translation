base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: de
  text: Die Israeliten taten, was Mose gesagt hatte, und baten[a] die Ägypter um Gegenstände aus Silber, Gegenstände aus Gold sowie um Kleidung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb bedeutet gewöhnlich »bitten« oder »erbitten«. Ältere Übersetzungen geben es teilweise mit »leihen« oder »borgen« wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt die korporative Bedeutung der hebräischen Wendung »Söhne Israels« klar wieder, ohne unnötig wörtlich oder missverständlich zu klingen.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: taten, was Mose gesagt hatte
  rationale: Die Formulierung gibt die Wendung wörtlichkeitsnah und zugleich idiomatisch wieder. דָּבָר bleibt im Sinn des von Mose Gesagten erhalten, ohne es enger als »Befehl« oder »Anweisung« festzulegen.
- source_word: וַיִּשְׁאֲלוּ
  choice: baten … um
  rationale: שׁאל bedeutet hier grundlegend »bitten, erfragen, verlangen«. »Baten … um« ist im Deutschen natürlich und vermeidet die nicht vom Verb selbst geforderte Deutung »liehen«.
- source_word: מִמִּצְרַיִם
  choice: die Ägypter
  rationale: Die Form lautet wörtlich »von Ägypten«, bezeichnet im Kontext aber die Menschen, von denen die Gegenstände erbeten wurden. »Die Ägypter« macht diesen Bezug im Deutschen natürlich deutlich.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: Gegenstände aus Silber und Gold
  rationale: כְּלִי ist ein weiter Begriff für Gegenstände, Geräte oder Gefäße. »Gegenstände« vermeidet eine unbegründete Einschränkung auf Gefäße; die zusammengezogene deutsche Form bewahrt beide Materialien klar.
- source_word: וּשְׂמָלֹת
  choice: sowie um Kleidung
  rationale: שִׂמְלָה bezeichnet allgemein Kleidung oder Kleidungsstücke. »Kleidung« ist modern, verständlich und semantisch breit.
theological_decisions:
- issue: Mögliche moralisch oder theologisch aufgeladene Wiedergabe von וַיִּשְׁאֲלוּ im Zusammenhang mit dem Auszug
  choice: baten … um
  alternative: liehen; forderten; nahmen als Beute
  rationale: Die Übersetzung hält am gewöhnlichen lexikalischen Sinn »bitten/erbitten« fest. Sie liest weder die ältere Vorstellung eines Darlehens noch das im weiteren Kontext beschriebene Ergebnis der Plünderung in dieses einzelne Verb hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Die Israeliten« ist natürlicher als das formalere »die Söhne Israels«; »taten, was Mose gesagt hatte« vermeidet eine schwerfällige Nachbildung und bewahrt zugleich den Sinn von דָּבָר. Der Fußnotenmarker steht nach dem ganzen Satz, bezieht sich aber auf »baten«.
