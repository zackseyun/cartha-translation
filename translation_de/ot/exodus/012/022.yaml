  to: Und nehmt ein Bündel Ysop, taucht es in das Blut, das sich in der Schüssel[a] befindet, und bringt etwas von dem Blut aus der Schüssel an den Türsturz und die beiden Türpfosten. Keiner von euch darf bis zum Morgen durch die Tür seines Hauses hinausgehen.
