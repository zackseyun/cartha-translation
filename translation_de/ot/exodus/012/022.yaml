base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: de
  text: Und nehmt ein Bündel Ysop, taucht es in das Blut, das sich in der Schüssel[a] befindet, und bringt etwas von dem Blut aus der Schüssel an den Türsturz und die beiden Türpfosten. Keiner von euch darf bis zum Morgen durch die Tür seines Hauses hinausgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schwelle“. Das hebräische Wort סַף kann beides bezeichnen. Hier ist „Schüssel“ vorzuziehen, weil das Blut darin ist und der Ysop hineingetaucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: ein Bündel Ysop
  rationale: אֲגֻדָּה bezeichnet ein zusammengebundenes Büschel. „Ein Bündel Ysop“ ist im Deutschen konkret und natürlich; die genaue botanische Bestimmung von אֵזוֹב bleibt dabei offen.
- source_word: וּטְבַלְתֶּם בַּדָּם
  choice: taucht es in das Blut
  rationale: Bei טבל bezeichnet ב das Medium, in das etwas eingetaucht wird. Das im Deutschen nötige Pronomen „es“ bezieht sich auf das Ysopbündel.
- source_word: הַסַּף
  choice: die Schüssel
  rationale: Dass das Blut „in“ dem סַף ist und der Ysop hineingetaucht wird, spricht hier deutlich für ein Gefäß. „Schüssel“ ist allgemeinverständlich und vermeidet die heute oft technisch oder kirchlich wirkenden Bedeutungen von „Becken“.
- source_word: וְהִגַּעְתֶּם ... מִן הַדָּם
  choice: bringt etwas von dem Blut ... an
  rationale: Der Hifil von נגע bezeichnet hier das Herstellen eines Kontakts; מִן weist auf einen Teil des Blutes hin. „Etwas von dem Blut anbringen“ gibt den Vorgang natürlich wieder, ohne eine Schlagbewegung hinzuzufügen.
- source_word: הַמַּשְׁקוֹף
  choice: der Türsturz
  rationale: Der Ausdruck bezeichnet den oberen waagerechten Teil der Türöffnung. „Türsturz“ ist der präzise und gebräuchliche deutsche Architekturbegriff.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: die beiden Türpfosten
  rationale: מְזוּזוֹת sind die senkrechten Seitenpfosten der Türöffnung; „die beiden Türpfosten“ ist präzise und verständlich.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: Keiner von euch darf ... hinausgehen
  rationale: אִישׁ hat nach der pluralischen Verneinung distributive Bedeutung. Die Formulierung gibt das individuelle Verbot in natürlichem Deutsch wieder.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: aus der Tür seines Hauses
  rationale: פֶּתַח bezeichnet die Türöffnung beziehungsweise den Eingang. „Aus der Tür ... hinausgehen“ ist idiomatisch und bewahrt mit „seines Hauses“ die distributive Singularform des Hebräischen.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Dies ist die direkte und natürliche Wiedergabe der zeitlichen Begrenzung.
theological_decisions:
- issue: Bedeutung von הַסַּף an dieser Stelle
  choice: Schüssel
  alternative: Schwelle
  rationale: Der unmittelbare Zusammenhang – Blut befindet sich darin, und der Ysop wird hineingetaucht – stützt die Gefäßbedeutung. Da „Schwelle“ lexikalisch möglich ist und die Deutung des Rituals beeinflussen kann, wird die Alternative in einer Fußnote bewahrt.
- issue: Distributive maskuline Form אִישׁ ... בֵּיתוֹ
  choice: Keiner von euch ... aus der Tür seines Hauses
  alternative: Niemand von euch ... aus der Tür eurer Häuser
  rationale: Die Übersetzung erhält den distributiven Singular und dessen grammatisches Geschlecht. Die Anweisung ist repräsentativ auf jedes Mitglied der angesprochenen Gruppe bezogen und nicht als Beschränkung auf Männer zu verstehen.
translation_notes:
  register: Moderne, würdige Standardsprache mit konkreten Ritual- und Architekturbegriffen. Die Imperative geben die hebräischen Anweisungen direkt wieder; „darf“ formuliert das anschließende Verbot in natürlichem Deutsch. Die Satzstruktur bleibt nah am Handlungsablauf des Ausgangstextes, ohne hebraistische Unbeholfenheit.
