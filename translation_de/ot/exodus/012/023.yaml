source:
  edition: WLC
  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: de
  text: Denn Jahwe wird hindurchziehen, um Ägypten zu schlagen. Wenn er das Blut am Türsturz und an den beiden Türpfosten sieht, wird Jahwe an der Türöffnung vorübergehen[a] und dem Verderber[b] nicht erlauben, in eure Häuser einzudringen, um dort zuzuschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird die Türöffnung verschonen“ beziehungsweise „wird die Türöffnung schützen“. Das hebräische Verb פסח ist das für das Passafest kennzeichnende Wort; seine genaue Nuance ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: Wer oder was mit „dem Verderber“ gemeint ist, wird im Hebräischen nicht näher bestimmt; manche verstehen darunter einen Engel als Vollstrecker des Gerichts.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden persönlichen Gottesnamen in der im Deutschen üblichen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְעָבַר
  choice: wird hindurchziehen
  rationale: עבר bezeichnet hier Jahwes Bewegung durch Ägypten zum Gericht; die Wiedergabe unterscheidet das Verb bewusst von פסח im folgenden Satzteil.
- source_word: לִנְגֹּף
  choice: um … zu schlagen
  rationale: נגף bezeichnet hier das tödliche Gericht. „Schlagen“ ist gegenwärtiges, würdevolles Deutsch und bewahrt die Härte des Ausdrucks.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Standardwiedergabe des Ortsnamens; im Zusammenhang kann zugleich das Land beziehungsweise seine Bevölkerung als Ziel des Gerichts gemeint sein.
- source_word: וְרָאָה
  choice: Wenn er … sieht
  rationale: Das Waw mit Perfekt führt die zukunftsbezogene Handlung fort und hat im Zusammenhang einen natürlichen temporalen Sinn.
- source_word: הַדָּם
  choice: das Blut
  rationale: Der bestimmte Ausdruck verweist auf das zuvor angebrachte Blut.
- source_word: הַמַּשְׁקוֹף
  choice: Türsturz
  rationale: Bezeichnet den oberen waagerechten Teil des Türrahmens; „Türsturz“ ist präzises und verständliches Standarddeutsch.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: die beiden Türpfosten
  rationale: Bezeichnet die zwei senkrechten seitlichen Teile des Türrahmens.
- source_word: וּפָסַח
  choice: wird … vorübergehen
  rationale: Bewahrt die Bewegungsmetapher des für das Passafest zentralen Verbs פסח, ohne die ebenfalls möglichen Nuancen „verschonen“ oder „schützen“ im Haupttext festzuschreiben.
- source_word: עַל הַפֶּתַח
  choice: an der Türöffnung
  rationale: פתח meint hier den Eingang beziehungsweise die Öffnung des Hauses. „Türöffnung“ unterscheidet diese von Türsturz und Türpfosten.
- source_word: וְלֹא יִתֵּן
  choice: wird … nicht erlauben
  rationale: נתן mit Infinitiv bedeutet hier idiomatisch „zulassen/erlauben“.
- source_word: הַמַּשְׁחִית
  choice: der Verderber
  rationale: Gibt den substantivierten Ausdruck als handelnden Vernichter wieder, ohne seine im Hebräischen nicht näher bestimmte Identität als Engel festzulegen.
- source_word: לָבֹא אֶל בָּתֵּיכֶם
  choice: in eure Häuser einzudringen
  rationale: Gibt das Eintreten des feindlichen Vernichters in diesem Zusammenhang natürlich und anschaulich wieder.
theological_decisions:
- issue: Verhältnis zwischen Jahwe und dem Verderber
  choice: Jahwe und „der Verderber“ werden im Text sprachlich unterschieden; Jahwe vollzieht das Gericht und hindert den Verderber am Eindringen.
  alternative: Den Verderber als bloße andere Bezeichnung für Jahwe behandeln oder ihn ausdrücklich als „Würgeengel“ beziehungsweise „Engel des Verderbens“ bezeichnen.
  rationale: Der hebräische Satz nennt יְהוָה und הַמַּשְׁחִית unterscheidbar. Die Übersetzung bewahrt diese Spannung und legt die Identität des Verderbers nicht über den Wortlaut hinaus fest.
- issue: Bedeutung von פסח
  choice: Im Haupttext mit „vorübergehen“ wiedergeben und die mögliche Schutz- beziehungsweise Verschonungsnuance in einer Fußnote nennen.
  alternative: „verschonen“ oder „schützend abschirmen“ direkt in den Haupttext setzen.
  rationale: Das Verb ist für die Passaerzählung lexikalisch prägend. „Vorübergehen“ erhält die Bildsprache, während der unmittelbare Kontext die schützende Wirkung durch das Abhalten des Verderbers bereits ausdrücklich beschreibt.
- issue: Objekt des abschließenden לִנְגֹּף
  choice: „euch zu schlagen“ als im Deutschen erforderliche, kontextuelle Ergänzung.
  alternative: 'Das Verb ohne ausgesprochenes Objekt wiedergeben: „um zu schlagen“.'
  rationale: Im Hebräischen bleibt das Objekt unausgesprochen. Im Deutschen macht „euch“ den aus „eure Häuser“ naheliegenden Bezug verständlich, ohne eine zusätzliche Gruppe oder eine besondere Art des Schlages einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, wird aber durch einen Punkt und einen temporalen Nebensatz natürlich gegliedert. „Jahwe“ bewahrt den Gottesnamen; „Verderber“ lässt die Identität des Gerichtsagenten offen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
