  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: de
  text: Haltet das Fest der ungesäuerten Brote[a]; denn genau an diesem Tag habe ich eure Heerscharen[b] aus Ägypten herausgeführt. Haltet diesen Tag über alle eure Generationen hinweg als eine immerwährende Ordnung[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die ungesäuerten Brote“ beziehungsweise „die ungesäuerten Dinge“; der Ausdruck kann hier auch die damit verbundene Festfeier bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eure Scharen“, „eure Abteilungen“ beziehungsweise „eure Verbände“. Das hebräische Wort stellt Israel als geordnet ausziehende Gemeinschaft dar.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „als eine Ordnung für immer“ beziehungsweise „als eine dauerhafte Satzung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Haltet
  rationale: שׁמר bezeichnet hier das gewissenhafte Einhalten einer kultischen Vorschrift. „Haltet“ bewahrt in beiden Satzhälften die Wiederholung des Hebräischen und klingt im Deutschen würdig und verständlich.
- source_word: הַמַּצּוֹת
  choice: das Fest der ungesäuerten Brote
  rationale: Wörtlich sind „die ungesäuerten Brote/Dinge“ gemeint; im Zusammenhang bezeichnet der Ausdruck metonymisch die Festfeier. Die Haupttextfassung macht den kultischen Sinn natürlich verständlich, während die Fußnote die wörtlichere Möglichkeit erhält.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: genau an diesem Tag
  rationale: Die Wendung hebt den betreffenden Tag nachdrücklich und präzise hervor. „Genau an diesem Tag“ gibt diesen idiomatischen Nachdruck in heutigem Deutsch wieder.
- source_word: הוֹצֵאתִי
  choice: habe ich … herausgeführt
  rationale: Der Hifil von יצא bedeutet „hinausführen/herausführen“. Das Perfekt wird im deutschen Begründungssatz natürlich mit dem Perfekt wiedergegeben.
- source_word: צִבְאוֹתֵיכֶם
  choice: eure Heerscharen
  rationale: צָבָא kann Heer, Schar oder geordnete Abteilung bezeichnen. „Heerscharen“ bewahrt das Bild Israels als geordnet ausziehende Verbände, ohne sie ausdrücklich als kämpfendes Heer festzulegen.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus Ägypten
  rationale: מִן bezeichnet den Ausgangspunkt. Im Deutschen bezeichnet „Ägypten“ natürlich sowohl das Land als auch das Staatsgebiet; das ergänzte „Land“ ist für die Bedeutung nicht nötig.
- source_word: לְדֹרֹתֵיכֶם
  choice: über alle eure Generationen hinweg
  rationale: Die Wendung bezeichnet die fortlaufende Beachtung durch die aufeinanderfolgenden Generationen. Die gewählte Form ist klar und erhält den generationenübergreifenden Sinn.
- source_word: חֻקַּת עוֹלָם
  choice: als eine immerwährende Ordnung
  rationale: חֻקָּה ist eine festgesetzte Vorschrift oder Ordnung; עוֹלָם bezeichnet hier unbestimmte, fortdauernde Geltung. „Immerwährende Ordnung“ erhält die starke Dauerformulierung, ohne sie erläuternd einzuschränken.
theological_decisions:
- issue: Bezeichnet הַמַּצּוֹת die Speise selbst oder das Fest?
  choice: Im Haupttext „das Fest der ungesäuerten Brote“
  alternative: „die ungesäuerten Brote“
  rationale: Das Verb „halten“ und der unmittelbare Festkontext sprechen für die metonymische Bezeichnung der Feier. Da das Hebräische das Wort „Fest“ nicht ausdrücklich enthält, wird die wörtlichere Lesart in einer Fußnote bewahrt.
- issue: Reichweite von חֻקַּת עוֹלָם
  choice: „als eine immerwährende Ordnung“
  alternative: „als eine dauerhafte Satzung“ oder „als eine Ordnung für immer“
  rationale: Die Übersetzung erhält die im hebräischen Ausdruck liegende starke, fortdauernde Verpflichtung und vermeidet zugleich eine konfessionelle Festlegung darüber, wie diese Vorschrift heilsgeschichtlich anzuwenden ist.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, öffentlich lesbarem Satzbau. Die Wiederholung von „Haltet“ bildet die hebräische Wiederaufnahme ab. „Heerscharen“ ist bewusst leicht gehoben, weil es die organisatorisch-militärische Bildkomponente des Ausgangstextes besser wahrt als das allgemeinere „Scharen“.
