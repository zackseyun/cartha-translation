  source_fidelity: Der Text gibt die syntaktische Gliederung, die zweimalige Aufforderung mit שׁמר, die Betonung von בְּעֶצֶם („genau an diesem Tag“), das Herausführen aus Ägypten, die generationenübergreifende Geltung und חֻקַּת עוֹלָם zuverlässig wieder. „Das Fest der ungesäuerten Brote“ ist eine kontextuell tragfähige metonymische Wiedergabe von הַמַּצּוֹת; die Fußnote wahrt die wörtlichere, weniger festgelegte Lesart. „Heerscharen“ gibt die organisierte, potentiell militärisch geprägte Nuance von צִבְאוֹתֵיכֶם angemessen wieder, ohne eine zusätzliche Aussage über Kampfhandlungen einzutragen.
