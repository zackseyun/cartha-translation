  terminology: Die Benennung des Festes ist im Deutschen etabliert; die kleingeschriebene Form „ungesäuerten Brote“ ist ebenfalls orthographisch vertretbar, weil sie hier als Sachbezeichnung und nicht zwingend als amtlicher Festtitel verwendet wird. Die Fußnoten erläutern die relevanten lexikalischen Alternativen sachlich und ohne konfessionelle Festlegung. Alle Fußnotenmarker sind vorhanden und an den jeweils einschlägigen Stellen korrekt verankert.
