  text: וּ/בַ/יּ֤וֹם הָ/רִאשׁוֹן֙ מִקְרָא קֹ֔דֶשׁ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י מִקְרָא קֹ֖דֶשׁ יִהְיֶ֣ה לָ/כֶ֑ם כָּל מְלָאכָה֙ לֹא יֵעָשֶׂ֣ה בָ/הֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְ/כָל נֶ֔פֶשׁ ה֥וּא לְ/בַדּ֖/וֹ יֵעָשֶׂ֥ה לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: de
  text: Am ersten Tag sollt ihr eine heilige Versammlung[a] halten, und am siebten Tag ebenfalls eine heilige Versammlung. An diesen Tagen darf keinerlei Arbeit verrichtet werden; nur was jeder zum Essen braucht, das allein darf für euch zubereitet werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine heilige Einberufung“; traditionell: „eine heilige Zusammenkunft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „was von jeder Person gegessen wird, das allein soll für euch getan werden“. „Person“ gibt hier das hebräische nefesch wieder; gemeint ist die für das Essen nötige Zubereitung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: heilige Versammlung
  rationale: Die Wendung bezeichnet eine einberufene, dem Heiligen vorbehaltene Zusammenkunft. „Heilige Versammlung“ ist im modernen Deutschen klar und würdevoll; die Einberufung ist im Begriff „Versammlung“ hinreichend erkennbar.
- source_word: יִהְיֶה לָכֶם
  choice: sollt ihr ... halten
  rationale: Die idiomatische deutsche Form gibt die Existenz beziehungsweise Anordnung einer Versammlung für die Angesprochenen natürlich wieder, ohne den hebräischen Dativ schwerfällig nachzubilden.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה בָהֶם
  choice: An diesen Tagen darf keinerlei Arbeit verrichtet werden
  rationale: „Keinerlei Arbeit“ bildet die umfassende Verneinung von כָּל מְלָאכָה ab. Das Passiv des Hebräischen und der zeitliche Bezug des Suffixes auf beide genannten Tage bleiben erhalten.
- source_word: אַךְ
  choice: nur
  rationale: Das Wort grenzt hier die einzige Ausnahme vom Arbeitsverbot ab; „nur“ verbindet diese Ausnahme im Deutschen knapp und eindeutig mit der folgenden Exklusivformel.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: was jeder zum Essen braucht
  rationale: נֶפֶשׁ bezeichnet hier jede einzelne Person, nicht eine vom Körper unterschiedene „Seele“. „Braucht“ macht den praktischen Bezug auf die erforderliche Speise deutlich, ohne eine bestimmte Speiseart festzulegen.
- source_word: הוּא לְבַדּוֹ
  choice: das allein
  rationale: Die betonte Ausschließlichkeit von Pronomen und לְבַדּוֹ wird unmittelbar bewahrt.
- source_word: יֵעָשֶׂה לָכֶם
  choice: darf für euch zubereitet werden
  rationale: Das passive „darf ... werden“ gibt im Zusammenhang die erlaubte Ausnahme wieder. „Zubereitet“ erschließt den durch den vorangehenden Essensbezug bestimmten Sinn von עשׂה; „für euch“ bildet לָכֶם ab.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gesetzesstil. Der Satzbau macht deutlich, dass das Arbeitsverbot für den ersten und den siebten Tag gilt. „Keinerlei“ wahrt die umfassende Formulierung; „heilige Versammlung“ vermeidet sowohl Archaismus als auch konfessionell geprägte Terminologie.
