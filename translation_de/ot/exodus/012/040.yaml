  language: en
  yaml_path: translation/ot/exodus/012/040.yaml
  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: de
  text: Die Aufenthaltszeit der Söhne Israels[a], die in Ägypten wohnten, betrug 430 Jahre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige alte Textzeugen lesen: „Die Aufenthaltszeit, die die Söhne Israels und ihre Vorfahren in Ägypten und in Kanaan verbrachten, betrug 430 Jahre.“'
    reason: Textvariante
lexical_decisions:
- source_word: מוֹשַׁב
  choice: Aufenthaltszeit
  rationale: Das Substantiv bezeichnet hier den Aufenthalt beziehungsweise dessen Dauer. „Aufenthaltszeit“ macht den zeitlichen Sinn im Deutschen klar und bewahrt die nominale Ausdrucksweise.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formnahe Wiedergabe erhält die traditionelle Bundesbezeichnung und bleibt im Deutschen verständlich.
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: die … wohnten
  rationale: Der Relativsatz wird unmittelbar wiedergegeben; „wohnten“ entspricht ישׁב in diesem Zusammenhang natürlich und präzise.
- source_word: בְּמִצְרָיִם
  choice: in Ägypten
  rationale: Direkte lokative Wiedergabe der Präposition mit dem Ortsnamen.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 430 Jahre
  rationale: Die Ziffernschreibung ist im modernen Deutschen für eine genaue chronologische Angabe klar und gibt die hebräische Gesamtzahl unverändert wieder.
theological_decisions:
- issue: Bezieht sich die Zeitspanne von 430 Jahren allein auf Ägypten oder auf einen umfassenderen Aufenthalt der Erzväter und Israels?
  choice: Der Haupttext folgt dem masoretischen Wortlaut und bezieht die Aufenthaltszeit der Söhne Israels auf Ägypten.
  alternative: Einige alte Textzeugen beziehen die Zeit auf Ägypten und Kanaan und erwähnen zudem die Vorfahren.
  rationale: Da die vorgelegte hebräische Quelle ausdrücklich nur Ägypten nennt, steht diese Lesart im Haupttext. Die chronologisch bedeutsame alte Variante wird in einer Fußnote dokumentiert, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Aufenthaltszeit“ ist natürlicher und semantisch genauer als das abstraktere „Wohnen“; „Söhne Israels“ bewahrt bewusst die formale Bundesbezeichnung.
