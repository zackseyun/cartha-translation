  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: de
  text: Es soll in einem Haus[a] gegessen werden. Ihr sollt nichts von dem Fleisch aus dem Haus hinausbringen, und ihr sollt an ihm keinen Knochen zerbrechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in einem Haushalt. Das hebräische Wort kann sowohl das Gebäude als auch die darin versammelte Hausgemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: in einem einzigen Haus
  rationale: בַּיִת kann sowohl das konkrete Gebäude als auch die darin versammelte Hausgemeinschaft bezeichnen. Der anschließende Gegensatz zum Hinausbringen aus dem Haus spricht hier vorrangig für die räumliche Bedeutung; „einzigen“ gibt אֶחָד im Sinn einer ungeteilten Örtlichkeit wieder.
- source_word: יֵאָכֵל
  choice: Es soll … gegessen werden
  rationale: Das Nifal Imperfekt ist eine passive Anweisung. „Soll … gegessen werden“ bewahrt sowohl die Passivform als auch den verbindlichen Charakter.
- source_word: לֹא תוֹצִיא מִן הַבַּיִת … חוּצָה
  choice: Ihr sollt … nicht aus dem Haus hinausbringen
  rationale: Das Hifil von יצא bezeichnet das Herausbringen; חוּצָה gibt die Bewegung nach draußen an. „Aus dem Haus hinausbringen“ bildet beides natürlich und präzise ab.
- source_word: מִן הַבָּשָׂר
  choice: nichts von dem Fleisch
  rationale: בָּשָׂר bedeutet hier im Speisekontext „Fleisch“. Das partitive מִן wird durch „von dem“ ausgedrückt; zusammen mit der Verneinung bezeichnet „nichts“ auch nicht den geringsten Anteil.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: und ihr sollt keinen Knochen an ihm zerbrechen
  rationale: 'Das singularische עֶצֶם steht distributiv: Kein Knochen darf gebrochen werden. „An ihm“ wahrt den maskulinen Singularbezug von בוֹ auf das Passaopfer, ohne im Vers selbst ausdrücklich „Lamm“ einzusetzen.'
theological_decisions:
- issue: Bezugswort des abschließenden Pronomens בוֹ
  choice: Bezug auf das Passaopfer als Ganzes („an ihm“)
  alternative: ausdrücklicher Bezug auf „das Lamm“
  rationale: Das maskuline Singularpronomen verweist auf das zuvor behandelte Passaopfer. Die Wiedergabe „an ihm“ erhält diesen unmittelbaren Bezug, ohne eine im Vers nicht wiederholte Bezeichnung einzufügen.
translation_notes:
  register: Moderner, würdiger Regelungsstil. Die wiederholte Formulierung „ihr sollt … nicht“ bewahrt den verbindlichen Ton und den Wechsel vom unpersönlichen Passiv zur direkten Anrede im Plural.
