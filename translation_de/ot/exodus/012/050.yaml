source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: de
  text: Und alle Söhne Israels[b] taten, wie Jahwe[a] Mose und Aaron geboten hatte; so taten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: „Söhne Israels“ kann auch mit „Israeliten“ oder „Kinder Israels“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Und … taten
  rationale: עשה bedeutet häufig „tun/machen“. Im Zusammenhang des Gehorsams gegenüber einem Gebot ist „taten“ natürlich und bewahrt die Wiederholung am Versende.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: alle Söhne Israels
  rationale: Die formale familienbezogene Wendung „Söhne Israels“ wird beibehalten; כָּל bezeichnet die Gesamtheit der Gruppe.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion drückt Übereinstimmung mit dem Gebot aus; „wie“ ist knapp und idiomatisch.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass das Gebot dem Handeln vorausging, ohne dem hebräischen Perfekt eine zusätzliche Bedeutung aufzuzwingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben statt durch den traditionellen Ersatztitel „der HERR“.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Mose und Aaron
  rationale: Die Akkusativmarker weisen Mose und Aaron als diejenigen aus, denen Jahwe geboten hatte; das Deutsche benötigt hier keine Präposition.
- source_word: כֵּן עָשׂוּ
  choice: genau so taten sie
  rationale: כֵּן nimmt die zuvor beschriebene Übereinstimmung nachdrücklich wieder auf. „Genau so“ macht diesen Nachdruck deutlich und bewahrt zugleich die Wiederholung von עשה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder; die traditionelle Ersetzung durch „der HERR“ wird in einer Fußnote genannt.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Israeliten / Kinder Israels
  rationale: Die wörtliche, grammatisch maskuline und familienbezogene Bezeichnung bleibt im Haupttext erhalten. Die idiomatischen deutschen Sammelbezeichnungen werden als Übersetzungsalternativen angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Wiederholung von „tun“ und die Betonung der genauen Übereinstimmung mit dem Gebot bleiben erhalten. Die Fußnotenmarker stehen jeweils an der für ihre Aussage passenden Stelle.
