review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Bedingung zur Teilnahme am Passa, die Beschneidung aller dem ansässigen Fremden zugehörigen Männer, die anschließende Gleichstellung mit dem Einheimischen sowie den Ausschluss Unbeschnittener sachgerecht wieder. „will“ ist im konditionalen und prospektiven Zusammenhang vertretbar. „Passa“ ist jedoch näher am hebräischen פֶּסַח als „Passafest“, das im Deutschen auch den weiteren Festzeitraum bezeichnen kann.
  naturalness: „Alles Männliche, das zu ihm gehört“ ist zwar verständlich, klingt im modernen Standarddeutsch aber unidiomatisch und unpersönlich. „Alle seine männlichen Angehörigen“ gibt den kollektivischen Umfang natürlich wieder, ohne einen konkreten Haushalt oder eine sonstige institutionelle Einheit zu ergänzen. „Dann darf er hinzutreten“ ist möglich, aber „darf er teilnehmen“ macht die im Kontext gemeinte kultische Berechtigung klar und natürlich.
  terminology: „Jahwe“, „Passa“, „beschnitten“, „Einheimischer“ und „Unbeschnittener“ sind angemessen. Die Formulierung „wie ein Einheimischer des Landes sein“ bewahrt die prädikative Aussage des Hebräischen unmittelbarer als das leicht interpretierende „gelten“.
  issues:
  - severity: low
    issue: „Passafest“ kann weiter gefasst sein als פֶּסַח.
    rationale: In diesem Vers steht פֶּסַח für die konkrete Passaobservanz bzw. -mahlzeit. „Passa“ erhält die terminologische Verbindung zu „davon essen“ deutlicher.
  - severity: medium
    issue: „alles Männliche, das zu ihm gehört“ ist sprachlich holprig.
    rationale: Die Wendung ist eine zu wörtliche Nachbildung des hebräischen Kollektivausdrucks und wirkt im heutigen Deutsch objektivierend. „alle seine männlichen Angehörigen“ ist idiomatisch und bewahrt den geforderten Umfang.
  revised_text: Wenn ein Fremder bei dir lebt und das Passa für Jahwe feiern will, müssen alle seine männlichen Angehörigen beschnitten werden. Dann darf er teilnehmen, um es zu feiern, und wird wie ein Einheimischer des Landes sein. Doch kein Unbeschnittener darf davon essen.
