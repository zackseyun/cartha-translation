  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: de
  text: Wenn ein Fremder bei dir lebt und das Passa für Jahwe feiern will, müssen alle seine männlichen Angehörigen beschnitten werden. Dann darf er teilnehmen, um es zu feiern, und wird wie ein Einheimischer des Landes sein. Doch kein Unbeschnittener darf davon essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֵּר
  choice: Fremder
  rationale: Bezeichnet hier keinen Durchreisenden, sondern einen nichtisraelitischen Menschen, der dauerhaft unter Israel lebt. Im Zusammenhang verdeutlicht „bei dir lebt“ diesen rechtlichen Status.
- source_word: יָגוּר אִתְּךָ
  choice: bei dir lebt
  rationale: Gibt das dauerhafte Wohnen als Fremder in natürlichem modernem Deutsch wieder.
- source_word: וְעָשָׂה פֶסַח
  choice: das Passafest feiern will
  rationale: „Passa machen/halten“ bezeichnet die rituelle Begehung. Im Bedingungssatz drückt die Wendung den beabsichtigten Vollzug aus, auf den die folgende Voraussetzung bezogen ist.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kennzeichnet die Ausrichtung bzw. Widmung der Feier; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: soll alles Männliche, das zu ihm gehört, beschnitten werden
  rationale: Bewahrt den kollektiven Ausdruck „alles Männliche“ und gibt die verpflichtende Kraft der hebräischen Konstruktion wieder, ohne ausdrücklich einen Haushalt zu ergänzen.
- source_word: וְאָז יִקְרַב
  choice: Dann darf er herantreten
  rationale: Das Herantreten bezeichnet hier die nach erfüllter Voraussetzung eröffnete Teilnahme am Ritus.
- source_word: לַעֲשֹׂתוֹ
  choice: um es zu feiern
  rationale: Das Suffix verweist auf das Passa zurück; „feiern“ ist im Deutschen idiomatischer als das wörtliche „machen“.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: wie ein Einheimischer des Landes gelten
  rationale: אֶזְרָח bezeichnet den einheimischen Angehörigen des Landes bzw. der Gemeinschaft. „gelten“ macht den rechtlichen Vergleich im Kontext verständlich.
- source_word: עָרֵל
  choice: Unbeschnittener
  rationale: Die substantivierte maskuline Form entspricht der unmittelbaren Beschneidungsthematik und wahrt die knappe Allgemeinaussage.
- source_word: לֹא יֹאכַל בּוֹ
  choice: darf davon nicht essen
  rationale: Gibt das Verbot bzw. die fehlende Teilnahmeberechtigung und den Bezug auf das Passa-Mahl idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ macht den offenbarten Bundesnamen im Haupttext sichtbar.
- issue: Teilnahme des ansässigen Fremden am Passa
  choice: Teilnahme nach Beschneidung alles zu ihm gehörenden Männlichen; danach Gleichstellung mit einem Einheimischen für diesen Zusammenhang
  alternative: ethnischer Ausschluss oder uneingeschränkte Gleichstellung ohne die genannte Voraussetzung
  rationale: 'Der Vers verbindet Aufnahme und Abgrenzung: Der Fremde darf teilnehmen, sofern die Beschneidungsforderung erfüllt ist. Weitergehende spätere theologische Kategorien werden nicht in den Text eingetragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der rechtlich-kultische Ton bleibt erhalten; unnötige Fachsprache und konfessionelle Sonderformulierungen werden vermieden.
