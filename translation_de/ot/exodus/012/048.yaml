  to: Wenn ein Fremder bei dir lebt und das Passa für Jahwe feiern will, müssen alle seine männlichen Angehörigen beschnitten werden. Dann darf er teilnehmen, um es zu feiern, und wird wie ein Einheimischer des Landes sein. Doch kein Unbeschnittener darf davon essen.
