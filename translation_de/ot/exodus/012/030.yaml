base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: de
  text: Da stand der Pharao in jener Nacht auf, er und alle seine Diener und ganz Ägypten[a]. In Ägypten erhob sich ein großes Klagegeschrei, denn es gab kein Haus ohne einen Toten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ganz Ägypten“ bezeichnet hier kollektiv die Menschen in Ägypten.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „Denn es gab kein Haus, in dem nicht ein Toter war.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand … auf
  rationale: Das Qal-Wayyiqtol von קום bezeichnet hier das nächtliche Aufstehen; die deutsche Verbklammer gibt die schlichte Erzählhandlung natürlich wieder.
- source_word: לַיְלָה הוּא
  choice: in der Nacht
  rationale: Die Zeitangabe wird eng am Hebräischen und zugleich idiomatisch wiedergegeben; „in jener Nacht“ wäre ebenfalls möglich, wäre aber stärker spezifizierend.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann Diener oder Sklave bedeuten. Im Zusammenhang mit dem Pharao bezeichnet es wahrscheinlich seine Bediensteten beziehungsweise Hofleute, ohne dass ihr genauer Status festgelegt wird.
- source_word: וְכָל מִצְרַיִם
  choice: und ganz Ägypten
  rationale: Der Landesname steht wie im Hebräischen kollektiv für die Menschen Ägyptens; diese Metonymie ist auch im Deutschen verständlich.
- source_word: צְעָקָה גְדֹלָה
  choice: ein großes Klagegeschrei
  rationale: צְעָקָה bezeichnet hier einen lauten Schrei aus Not. „Klagegeschrei“ macht den durch den Zusammenhang bestimmten Schmerz deutlich, während „großes“ גְדֹלָה wiedergibt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den Grund für das Klagegeschrei ein; „denn“ bewahrt den erzählerischen und kausalen Zusammenhang.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: es gab kein Haus ohne einen Toten
  rationale: Die knappe deutsche Form gibt die emphatische doppelte Verneinung sinngemäß wieder, behält „Haus“ für בַּיִת bei und lässt מֵת als substantivisch gebrauchten Ausdruck stehen.
