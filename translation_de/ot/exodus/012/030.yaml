translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die Satzfolge bleibt nahe am Hebräischen, wird jedoch für natürliches Deutsch leicht gegliedert. Die kollektive Ortsbezeichnung und die umfassende Aussage über jedes Haus werden nicht abgeschwächt.
