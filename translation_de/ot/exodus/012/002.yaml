  yaml_path: translation/ot/exodus/012/002.yaml
  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: de
  text: Dieser Monat soll für euch der Anfang der Monate sein[a]; er soll für euch der erste Monat des Jahres sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieser Neumond“. Das hebräische Wort kann mit dem Neumondzyklus verbunden sein; hier bezeichnet es den kalendarischen Monat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Dieser Monat
  rationale: חֹדֶשׁ bezeichnet in diesem kalendarisch-rechtlichen Zusammenhang gewöhnlich einen Monat. Das Wort kann auch mit dem Neumond verbunden sein; diese Bedeutungsnähe wird in der Fußnote bewahrt.
- source_word: לָכֶם
  choice: für euch
  rationale: Die Präposition bezeichnet hier die Beziehung auf Israel als angesprochene Gemeinschaft. „Für euch“ ist im Deutschen natürlich und erhält diesen Bezug.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: der Anfang der Monate
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet in zeitlicher Ordnung aber idiomatisch den Anfang. Die Formulierung bildet zudem die hebräische Genitivverbindung angemessen ab.
- source_word: רִאשׁוֹן הוּא לָכֶם לְחָדְשֵׁי הַשָּׁנָה
  choice: er soll für euch der erste von den Monaten des Jahres sein
  rationale: רִאשׁוֹן bezeichnet den ersten Rang in einer Reihenfolge. „Der erste von den Monaten des Jahres“ gibt den Bezugsbereich des Hebräischen ausdrücklich und natürlich wieder, ohne ein zusätzliches Kalendersystem vorauszusetzen.
theological_decisions:
- issue: Aussagekraft der verblosen hebräischen Sätze im gesetzgebenden Kontext
  choice: mit einsetzender beziehungsweise normativer Kraft als „soll ... sein“ wiedergegeben
  alternative: als einfache Gegenwart „ist“
  rationale: Im Hebräischen steht keine ausdrückliche Kopula. Der Kontext ist jedoch eine göttliche Anordnung zur Zeitrechnung Israels; „soll ... sein“ vermittelt diese instit uierende Kraft, ohne die Aussage dogmatisch zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „für euch“ und die zweigliedrige Satzstruktur wurden beibehalten, weil sie der Hervorhebung und Parallelität des Hebräischen entsprechen.
