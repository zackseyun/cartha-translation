source:
  edition: WLC
  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: de
  text: Es war eine Nacht des Wachens für Jahwe[a], als er sie aus dem Land Ägypten herausführte. Eben diese Nacht ist für Jahwe eine Nacht des Wachens für alle Kinder Israels, von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Nacht des Wachens« oder »eine Nacht des Einhaltens«. Das hebräische Wort kann Wachen, Bewahren und auch das feierliche Einhalten einer Gedenknacht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: eine Nacht des Wachens
  rationale: Die Konstruktverbindung bezeichnet eine durch Wachen, Bewahren oder Einhalten geprägte Nacht. Die Formulierung bleibt nah am Hebräischen und bewahrt zugleich die mögliche kultische Bedeutung.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל kennzeichnet hier die besondere Beziehung beziehungsweise Widmung der Nacht an Jahwe, ohne genauer festzulegen, ob vor allem Jahwes Wachen oder Israels Einhalten gemeint ist.
- source_word: לְהוֹצִיאָם
  choice: um sie ... herauszuführen
  rationale: Der Infinitiv mit ל wird als Zweck- beziehungsweise Zielangabe wiedergegeben und lässt Jahwe als handelndes Subjekt aus dem Zusammenhang hervorgehen.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die ausdrückliche Nennung von אֶרֶץ, »Land«, bleibt erhalten.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: Eben diese Nacht
  rationale: »Eben« gibt die nachdrückliche Identifizierung durch Pronomen und Demonstrativum in natürlichem Deutsch wieder.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: für alle Kinder Israels
  rationale: Die familiär-bundestheologische Ausdrucksweise בְּנֵי יִשְׂרָאֵל wird bewahrt, statt sie zum bloßen Volksnamen »Israeliten« abzuflachen.
- source_word: לְדֹרֹתָם
  choice: von Generation zu Generation
  rationale: Die idiomatische deutsche Wendung drückt die fortdauernde Geltung über die aufeinanderfolgenden Generationen aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im hebräischen Text ausdrücklich stehende Bundesname wird als Eigenname wiedergegeben.
- issue: Bedeutungsumfang von שִׁמֻּרִים
  choice: Nacht des Wachens
  alternative: Nachtwache; Nacht der Bewahrung; Nacht der Feier
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen Wachsamkeit, göttlichem Bewahren und dem erinnernden Einhalten dieser Nacht, ohne sich einseitig auf eine Deutung festzulegen.
- issue: Bezug von לַיהוָה
  choice: für Jahwe
  alternative: Jahwe zu Ehren; in der Jahwe wachte
  rationale: Die knappe relationale Formulierung erhält die Mehrdeutigkeit, ob die Nacht besonders Jahwes rettendem Wachen zugeordnet oder von Israel für ihn einzuhalten ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Nacht des Wachens« bildet die auffällige Wiederholung des hebräischen Schlüsselworts ab; die leicht feierliche Wendung »Kinder Israels« erhält den biblischen Bundesausdruck.
