  to: Es war eine Nacht des Wachens für Jahwe[a], als er sie aus dem Land Ägypten herausführte. Eben diese Nacht ist für Jahwe eine Nacht des Wachens für alle Kinder Israels, von Generation zu Generation.
  rationale: Die Satzstellung wurde zu natürlichem modernem Standarddeutsch geglättet. Der Infinitiv לְהוֹצִיאָם wird kontextgerecht mit „als er ... herausführte“ wiedergegeben, ohne den Bezug der Nacht auf Jahwes Exodus-Handeln als bloße Zweckangabe zu verengen. Die Schlüsselwortwiederholung und die Mehrdeutigkeit von שִׁמֻּרִים bleiben erhalten.
