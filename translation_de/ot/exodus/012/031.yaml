  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: de
  text: 'In der Nacht ließ der Pharao Mose und Aaron rufen und sagte: »Steht auf, zieht aus meinem Volk hinaus, sowohl ihr als auch die Israeliten! Geht und dient Jahwe, wie ihr gesagt habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ließ der Pharao … rufen
  rationale: Das Subjekt ist aus dem unmittelbaren Zusammenhang als der Pharao zu erschließen. Die deutsche Wendung gibt den veranlassten, dringlichen Ruf natürlich wieder.
- source_word: לַיְלָה
  choice: noch in derselben Nacht
  rationale: Der adverbiale Akkusativ bezeichnet den Zeitpunkt. „Noch in derselben Nacht“ ist im Deutschen idiomatisch und hebt die unmittelbare nächtliche Reaktion hervor.
- source_word: קוּמוּ צְּאוּ
  choice: Steht auf, zieht fort
  rationale: Die aufeinanderfolgenden Imperative behalten ihre Dringlichkeit und räumliche Bewegung. „Zieht fort“ klingt würdig, aber weiterhin verständlich.
- source_word: מִתּוֹךְ עַמִּי
  choice: aus der Mitte meines Volkes
  rationale: Die Formulierung bildet die räumliche Bedeutung von מִתּוֹךְ eng ab, ohne sie auf das Land Ägypten umzudeuten.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: sowohl ihr als auch die Israeliten
  rationale: „Sowohl … als auch“ bildet die wiederholte Einschlusspartikel גַּם … גַּם ab. „Die Israeliten“ gibt den etablierten hebräischen Volksnamen natürlich wieder.
- source_word: עִבְדוּ
  choice: dient
  rationale: „Dienen“ bewahrt die volle Bedeutungsbreite von עבד, die hier Gottesdienst und Dienst für Gott umfasst, ohne sie allein auf kultische Anbetung zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּדַבֶּרְכֶם
  choice: wie ihr gesagt habt
  rationale: Die Wendung bezeichnet die Übereinstimmung mit der zuvor von Mose und Aaron geäußerten Forderung und wird im Deutschen direkt und natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottes persönlichen Namen. „Jahwe“ bewahrt diese Namensfunktion, während „der HERR“ sie durch einen traditionellen Ersatztitel wiedergibt.
- issue: Bedeutungsumfang von עִבְדוּ
  choice: dient
  alternative: betet … an
  rationale: Das Verb kann im Zusammenhang den Gottesdienst einschließen, besitzt aber den weiteren Sinn „dienen“. Die Übersetzung vermeidet daher eine unnötige Verengung.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Pharao wird zur Klarheit aus dem Kontext ausdrücklich genannt. Die kurzen Imperative und der Gedankenstrich erhalten die Dringlichkeit der Szene. Die fehlerhaft zugeordneten englischen Fußnoten wurden nicht übernommen: „sons of Israel“ gehört sachlich zur dortigen Haupttextformulierung, und „at night“ ist eine Alternative zu „by night“, nicht zu „said“.'
