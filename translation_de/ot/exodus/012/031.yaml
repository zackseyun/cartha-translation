review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Imperativfolge, die Einschlussformel und den Gottesnamen grundsätzlich treffend wieder. „Noch in derselben Nacht“ fügt jedoch gegenüber לַיְלָה („in der Nacht / nachts“) die nicht ausdrücklich markierte Nuance „derselben“ hinzu. Außerdem ist das zweite וּלְכוּ ein eigenständiger Imperativ und sollte nicht im vorangehenden „zieht fort“ aufgehen.
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. „Aus der Mitte meines Volkes“ ist verständlich, aber „aus meinem Volk hinaus“ ist im Deutschen natürlicher und bewahrt den Sinn von מִתּוֹךְ. Die Folge kurzer Imperative bleibt dadurch klar und dringlich.
  terminology: „Jahwe“ gibt יהוה angemessen als Eigenname wieder. „Dient“ bewahrt den breiten Bedeutungsumfang von עבד. „Israeliten“ ist eine natürliche Wiedergabe von בני ישראל; keine Fußnote ist erforderlich.
  issues:
  - severity: medium
    issue: Zeitangabe „noch in derselben Nacht“
    rationale: לַיְלָה bezeichnet hier schlicht die Nacht beziehungsweise einen nächtlichen Zeitpunkt. „Derselben“ ist eine kontextuell plausible, aber im hebräischen Wortlaut nicht ausgedrückte Spezifizierung; „in der Nacht“ bewahrt die knappe Zeitangabe.
  - severity: medium
    issue: Eigenständiger Imperativ וּלְכוּ nicht sichtbar
    rationale: Nach „Steht auf, zieht fort“ steht im Hebräischen nochmals וּלְכוּ („und geht“), gefolgt von „dient Jahwe“. Die Übersetzung sollte diese Imperativfolge nicht zusammenziehen.
