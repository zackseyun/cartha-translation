  to: 'In der Nacht ließ der Pharao Mose und Aaron rufen und sagte: »Steht auf, zieht aus meinem Volk hinaus, sowohl ihr als auch die Israeliten! Geht und dient Jahwe, wie ihr gesagt habt.«'
  rationale: Die Zeitangabe wird ohne zusätzliche Spezifizierung wiedergegeben, die doppelte Imperativfolge wird erhalten, und die räumliche Aussage wird in natürlichem modernem Deutsch formuliert. Bedeutung, Register und die offene Reichweite von „dient“ bleiben gewahrt.
