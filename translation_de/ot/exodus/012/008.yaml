translation:
  language: de
  text: Sie sollen das Fleisch in dieser Nacht[a] essen, am Feuer gebraten[b]; mit ungesäuertem Brot und bitteren Kräutern sollen sie es essen.
  philosophy: optimal-equivalence
  footnotes:
