lexical_decisions:
- source_word: וְאָכְלוּ
  choice: Sie sollen essen
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im rituellen Anweisungskontext vorschreibende Bedeutung. „Sie sollen“ gibt diese verbindliche Weisung in modernem Deutsch klar wieder.
- source_word: הַבָּשָׂר
  choice: das Fleisch
  rationale: Im Speisekontext ist „Fleisch“ die natürliche deutsche Entsprechung und bezeichnet hier das Fleisch des Passatieres.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: in dieser Nacht
  rationale: Die Präposition בְּ mit dem bestimmten Ausdruck bedeutet wörtlich „in dieser Nacht“. Die deiktische Nähe von הַזֶּה bleibt erhalten.
- source_word: צְלִי אֵשׁ
  choice: über dem Feuer gebraten
  rationale: Die Wendung bezeichnet das Garen durch Rösten am Feuer. Diese Formulierung nennt das Feuer ausdrücklich und unterscheidet die Zubereitung vom Kochen in Vers 9.
- source_word: וּמַצּוֹת
  choice: mit ungesäuertem Brot
  rationale: מַצּוֹת bezeichnet ungesäuerte Brote beziehungsweise Fladen. Der Singular „Brot“ ist im Deutschen als Sammelbezeichnung natürlich.
- source_word: עַל
  choice: zusammen mit
  rationale: עַל bezeichnet hier die Beigabe oder Begleitung beim Essen, nicht eine räumliche Lage. „Zusammen mit“ macht diesen kulinarischen Zusammenhang deutlich.
- source_word: מְרֹרִים
  choice: bitteren Kräutern
  rationale: Das substantivierte Pluralwort bezeichnet im Passakontext bittere Pflanzen oder Kräuter. „Bittere Kräuter“ ist verständlich und traditionsübergreifend.
- source_word: יֹאכְלֻהוּ
  choice: sollen sie es essen
  rationale: Das Imperfekt mit Objektsuffix nimmt das Fleisch beziehungsweise das Passatier wieder auf. Die Wiederholung bewahrt den Nachdruck und die Struktur des Hebräischen.
