    issue: Fußnote b ist im Deutschen semantisch und syntaktisch unklar.
    rationale: „Kein Schlag wird unter euch sein durch einen Verderber“ verbindet „unter euch“ ungeschickt mit einem durch-Agenten und ist keine klare alternative Lesart. Die substantivische Deutung kann als „für den Verderber“ bzw. als Bezug auf einen „Verderber“ benannt werden, ohne die Hauptübersetzung zu verändern.
