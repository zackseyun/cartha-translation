base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: de
  text: Und das Blut soll euch an den Häusern, in denen ihr seid, als Zeichen dienen. Wenn ich das Blut sehe, werde ich an euch vorübergehen[a], und keine Plage wird euch zum Verderben treffen, wenn ich das Land Ägypten schlage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich euch verschonen“ oder „werde ich euch schützen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „und keine Plage wird unter euch zum Verderben sein“. Oder: „… für den Verderber“, wenn das hebräische Wort substantivisch als „Verderber“ verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: Und das Blut soll euch … als Zeichen dienen
  rationale: Die verbundene Perfektform hat hier zukunftsbezogene beziehungsweise anweisend-verheißende Kraft. „Als Zeichen dienen“ gibt die prädikative Konstruktion im natürlichen Deutschen wieder.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: an den Häusern, in denen ihr seid
  rationale: „An den Häusern“ bezeichnet passend die sichtbare Anbringung des Blutes; der Relativsatz wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: Wenn ich das Blut sehe
  rationale: Die formal beigeordnete Aussage bezeichnet im Ablauf den zeitlichen Umstand und wird daher als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: werde ich an euch vorübergehen
  rationale: Die Wiedergabe bewahrt das Bild des Vorübergehens und die sprachliche Verbindung zum Passafest, ohne die mögliche Bedeutung „verschonen“ oder „schützend übergehen“ festzuschreiben.
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: und keine Plage wird unter euch sein
  rationale: נֶגֶף bezeichnet einen Schlag beziehungsweise eine Plage; בָכֶם wird örtlich als „unter euch“ wiedergegeben.
- source_word: לְמַשְׁחִית
  choice: die Verderben bringt
  rationale: Die schwierige Form wird als Zweck- beziehungsweise Wirkungsangabe zur Plage verstanden. Diese Formulierung wahrt den zerstörerischen Sinn, ohne zwingend einen eigenständigen personalen „Verderber“ anzunehmen.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: wenn ich das Land Ägypten schlage
  rationale: Der Infinitiv mit בְּ bezeichnet den zeitlichen Umstand. Im Deutschen ist das Land selbst idiomatisch das Objekt von „schlagen“.
theological_decisions:
- issue: Bedeutung von וּפָסַחְתִּי עֲלֵכֶם bei der Einsetzung des Passafestes
  choice: werde ich an euch vorübergehen
  alternative: werde ich euch verschonen; werde ich euch schützen
  rationale: Der Haupttext bewahrt die bildhafte und kanonisch bedeutsame Verbindung zum Passa. Die möglichen Wirkungsnuancen „verschonen“ und „schützen“ werden in der Fußnote offengehalten.
- issue: Ob לְמַשְׁחִית unpersönliches Verderben oder einen personalen Verderber bezeichnet
  choice: die Verderben bringt
  alternative: durch einen Verderber; sodass ein Verderber kommt
  rationale: Die hebräische Form kann zweck- beziehungsweise wirkungsbezogen oder substantivisch verstanden werden. Der Haupttext vermeidet eine nicht zwingende Personifizierung, während die substantivische Lesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. „Plage“ und „Verderben“ bewahren den ernsten biblischen Ton, ohne altertümliche Formen wie „Heimsuchung“ oder „verderbenbringend“ zu verwenden. Sämtliche Fußnotenmarker stehen an den sachlich zugehörigen Stellen im Haupttext.
