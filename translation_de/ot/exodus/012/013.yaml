revisions:
- from: Und das Blut soll euch an den Häusern, in denen ihr seid, als Zeichen dienen. Wenn ich das Blut sehe, werde ich an euch vorübergehen[a], und keine Plage wird unter euch sein, die Verderben bringt[b], wenn ich das Land Ägypten schlage.
  to: Und das Blut soll euch an den Häusern, in denen ihr seid, als Zeichen dienen. Wenn ich das Blut sehe, werde ich an euch vorübergehen[a], und keine Plage wird euch zum Verderben treffen, wenn ich das Land Ägypten schlage[b].
  rationale: Die Revision ersetzt die missverständliche Relativsatzlösung durch eine natürliche deutsche Aussage über eine Plage, die die Israeliten nicht zum Verderben treffen wird. Die alternative substantivische Deutung von לְמַשְׁחִית bleibt ausdrücklich in der Fußnote erhalten; der Haupttext personifiziert den Ausdruck nicht.
