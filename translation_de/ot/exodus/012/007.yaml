base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: de
  text: Und sie sollen etwas von dem Blut nehmen und es an die beiden Türpfosten und an den Türsturz der Häuser streichen, in denen sie es essen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in denen sie es essen“. Das hebräische Imperfekt kann in dieser Anweisung auch ohne ausdrückliche Zukunftsform wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Und sie sollen … nehmen
  rationale: Die Form trägt in der Abfolge der Anweisungen auffordernd-zukünftige Bedeutung. „Sollen“ bewahrt den verbindlichen Anweisungston in natürlichem Deutsch.
- source_word: מִן הַדָּם
  choice: etwas von dem Blut
  rationale: 'מִן ist hier partitiv: Es wird ein Teil des Blutes genommen, nicht das gesamte Blut.'
- source_word: וְנָתְנוּ
  choice: und es … streichen
  rationale: נתן bedeutet allgemein „geben, setzen, anbringen“. Beim Auftragen von Blut auf Bauteile ist „streichen“ im Deutschen konkret und idiomatisch, ohne die Art des Auftragens unnötig genauer festzulegen.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: an die beiden Türpfosten
  rationale: מְזוּזוֹת bezeichnet die beiden senkrechten Pfosten eines Türeingangs; „Türpfosten“ ist die präzise und geläufige Entsprechung.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: und an den Türsturz
  rationale: מַשְׁקוֹף bezeichnet den oberen waagerechten Abschluss des Türeingangs. „Türsturz“ ist im modernen Deutschen der genaue architektonische Ausdruck.
- source_word: עַל הַבָּתִּים
  choice: der Häuser
  rationale: Die Präpositionalgruppe bestimmt hier, zu welchen Häusern die genannten Türpfosten und Türstürze gehören. Der deutsche Genitiv gibt diese Beziehung natürlicher wieder als eine erneute Übersetzung mit „an“.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: in denen sie es essen werden
  rationale: Der Relativsatz bezieht sich auf die Häuser. Das Imperfekt יֹאכְלוּ erhält im Zusammenhang der bevorstehenden Ausführung eine natürliche Zukunftsnuance; das Pronomen „es“ bezieht sich auf das Passalamm.
