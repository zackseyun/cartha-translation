  - severity: low
    issue: Zweite Satzhälfte mit doppeltem Prädikat
    rationale: Das Hebräische beschreibt die Gefäße als in Gewänder gebunden und auf den Schultern befindlich. Die Fassung mit „waren … eingebunden und lagen“ ist verständlich, aber stilistisch schwerer als eine knappe Partizipialfügung.
  revised_text: Da trug das Volk seinen Teig fort, noch bevor er gesäuert war, und seine Teigschüsseln[a] waren in ihre Mäntel eingebunden auf ihren Schultern.
