  source_fidelity: 'Der Satz gibt die Abfolge und die zentralen Gegenstände des Hebräischen zutreffend wieder: Das Volk nimmt den noch nicht gesäuerten Teig mit; die Teiggefäße sind in Obergewänder gebunden und werden auf den Schultern getragen. Die kollektiv-singuläre Wiedergabe „das Volk seinen Teig“ ist möglich. „Durchsäuert“ legt jedoch eher einen vollständig erfolgten Zustand nahe und ist für יֶחְמָץ weniger unmittelbar als „gesäuert“.'
  naturalness: Die Formulierung ist überwiegend modernes, verständliches Standarddeutsch. „waren … eingebunden und lagen auf ihren Schultern“ ist allerdings unnötig schwerfällig; eine Partizipialfügung bildet die hebräische Nominalphrase natürlicher und enger ab.
  terminology: „Teigschüsseln“ ist als moderne, vorsichtige Wahl für מִשְׁאֲרֹתָם vertretbar; die Fußnote bewahrt mit „Backtröge“ eine wesentliche lexikalische Alternative. „Mäntel“ ist in diesem Kontext als Wiedergabe des Obergewands ausreichend.
