  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: de
  text: Da trug das Volk seinen Teig fort, noch bevor er gesäuert war, und seine Teigschüsseln[a] waren in ihre Mäntel eingebunden auf ihren Schultern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Backtröge“. Das hebräische Wort bezeichnet Behälter, die zur Zubereitung von Teig dienten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: Da trug … fort
  rationale: נשׂא bezeichnet hier das Aufnehmen und Mitführen beim Aufbruch. „forttragen“ gibt den Zusammenhang der Abreise natürlich wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet in diesem Erzählzusammenhang das israelitische Volk als Kollektiv.
- source_word: בְּצֵקוֹ
  choice: seinen Teig
  rationale: Das hebräische Suffix steht im Singular und bezieht sich grammatisch auf das kollektive Subjekt „das Volk“; der deutsche Singular bewahrt diese Form natürlich.
- source_word: טֶרֶם יֶחְמָץ
  choice: noch bevor er durchsäuert war
  rationale: Die Wendung besagt, dass der Teig den Säuerungsvorgang noch nicht durchlaufen hatte. „durchsäuert“ ist im Passahzusammenhang präzise und verständlich.
- source_word: מִשְׁאֲרֹתָם
  choice: ihre Teigschüsseln
  rationale: Das Substantiv bezeichnet Behälter, in denen Teig zubereitet beziehungsweise geknetet wurde. „Teigschüsseln“ ist im modernen Deutsch anschaulich; Form und Größe der Gefäße bleiben jedoch unsicher.
- source_word: צְרֻרֹת
  choice: eingebunden
  rationale: Das passive Partizip von צרר beschreibt zum Transport verschnürte oder gebündelte Gegenstände. „eingebunden“ passt zur Verwendung der Mäntel als Umhüllung.
- source_word: בְּשִׂמְלֹתָם
  choice: in ihre Mäntel
  rationale: שִׂמְלָה bezeichnet gewöhnlich ein Obergewand beziehungsweise einen Mantel. „Mäntel“ vermittelt die konkrete Reiseszene.
- source_word: עַל שִׁכְמָם
  choice: auf ihren Schultern
  rationale: Der deutsche Plural gibt den kollektiven Bezug auf die einzelnen Angehörigen des Volkes idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive Singularform bei „das Volk/seinen Teig“ wurde bewahrt, während die persönlichen Ausrüstungsstücke idiomatisch im Plural stehen. Das Semikolon erhält den engen Zusammenhang der beiden hebräischen Satzteile.
