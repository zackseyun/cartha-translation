- from: Da trug das Volk seinen Teig fort, noch bevor er durchsäuert war; ihre Teigschüsseln[a] waren in ihre Mäntel eingebunden und lagen auf ihren Schultern.
  to: Da trug das Volk seinen Teig fort, noch bevor er gesäuert war, und seine Teigschüsseln[a] waren in ihre Mäntel eingebunden auf ihren Schultern.
  rationale: Die Revision ersetzt „durchsäuert“ durch das quellennähere „gesäuert“ und glättet die Beschreibung der transportierten Gefäße, ohne deren Funktion, die unsichere Gefäßform oder den kollektiven Bezug zu verändern. Die Fußnotenmarkierung bleibt unmittelbar an dem lexikalisch unsicheren Ausdruck verankert.
