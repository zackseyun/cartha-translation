source:
  edition: WLC
  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מֵ/רַעְמְסֵ֖ס סֻכֹּ֑תָ/ה כְּ/שֵׁשׁ מֵא֨וֹת אֶ֧לֶף רַגְלִ֛י הַ/גְּבָרִ֖ים לְ/בַ֥ד מִ/טָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: de
  text: 'Die Israeliten brachen von Ramses nach Sukkot auf: etwa sechshunderttausend Männer zu Fuß, die Kinder nicht mitgezählt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „außer den Kleinen“. Das hebräische Wort bezeichnet Kinder beziehungsweise kleine Angehörige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brachen … auf
  rationale: נסע bezeichnet hier das Aufbrechen beziehungsweise den Beginn einer Reise; „brachen … auf“ ist im modernen Deutschen natürlich und bildet den Reisebeginn präzise ab.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die wörtliche Form „Söhne Israels“ ist im heutigen Deutschen missverständlich und könnte Frauen ausschließen; als Volksbezeichnung gibt „die Israeliten“ den Sinn des hebräischen Ausdrucks natürlich wieder.
- source_word: מֵרַעְמְסֵס
  choice: von Ramses
  rationale: „Ramses“ ist die geläufige deutsche Schreibung des Ortsnamens; מִן bezeichnet den Ausgangspunkt.
- source_word: סֻכֹּתָה
  choice: nach Sukkot
  rationale: Das direktionale ה am Ortsnamen bezeichnet die Bewegung auf das Ziel zu und wird idiomatisch mit „nach“ wiedergegeben.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: etwa sechshunderttausend
  rationale: Das vorangestellte כְּ kennzeichnet die Zahl als Näherungsangabe.
- source_word: רַגְלִי הַגְּבָרִים
  choice: Männer zu Fuß
  rationale: רַגְלִי bezeichnet hier Fußgänger beziehungsweise zu Fuß ziehende Personen; הַגְּבָרִים spezifiziert sie als Männer.
- source_word: לְבַד מִטָּף
  choice: die Kinder nicht mitgezählt
  rationale: טַף bezeichnet Kinder beziehungsweise die Kleinen; die Formulierung macht klar, dass sie in der genannten Zahl nicht enthalten sind, ohne den Begriff unnötig auf alle Abhängigen auszuweiten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Volksbezeichnung „Israeliten“ vermeidet die im Deutschen missverständliche wörtliche Form „Söhne Israels“. Der Doppelpunkt gliedert den Aufbruch und die anschließende Zahlenangabe klar. Der Fußnotenmarker steht unmittelbar bei der Aussage, auf die er sich bezieht.
