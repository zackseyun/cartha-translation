  text: אַל תֹּאכְל֤וּ מִמֶּ֨/נּוּ֙ נָ֔א וּ/בָשֵׁ֥ל מְבֻשָּׁ֖ל בַּ/מָּ֑יִם כִּ֣י אִם צְלִי אֵ֔שׁ רֹאשׁ֥/וֹ עַל כְּרָעָ֖י/ו וְ/עַל קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/009.yaml
  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: de
  text: Esst nichts davon roh oder in Wasser gekocht, sondern nur über dem Feuer gebraten, mit seinem Kopf, seinen Beinen und seinen Innereien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָא
  choice: roh
  rationale: Im kulinarischen Zusammenhang bezeichnet das Wort Fleisch, das weder durch Braten noch durch Kochen gegart wurde. „Roh“ ist die klare und natürliche deutsche Entsprechung; „halbgar“ wäre ebenfalls denkbar, aber enger.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: oder in Wasser gekocht
  rationale: Die verstärkte Form von בשל zusammen mit „in Wasser“ bezeichnet ausdrücklich das Kochen in Wasser. Die deutsche Formulierung gibt die Zubereitungsart idiomatisch wieder.
- source_word: כִּי אִם
  choice: sondern nur
  rationale: Die Wendung setzt eine ausschließende Alternative zu den zuvor untersagten Zubereitungsarten und wird im Deutschen klar durch „sondern nur“ ausgedrückt.
- source_word: צְלִי אֵשׁ
  choice: über dem Feuer gebraten
  rationale: Die Verbindung bezeichnet mit Feuer gebratenes Fleisch. „Über dem Feuer gebraten“ ist natürlich und wahrt die ausdrücklich vorgeschriebene Zubereitungsweise.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: den Kopf samt den Beinen und den Innereien
  rationale: Das wiederholte עַל verbindet hier die genannten Körperteile und zeigt, dass das Tier einschließlich dieser Teile gebraten werden soll. „Samt“ bringt diese Zusammengehörigkeit knapp und natürlich zum Ausdruck.
- source_word: מִמֶּנּוּ
  choice: nichts davon
  rationale: Die partitive Bedeutung wird im Deutschen in Verbindung mit dem Verbot idiomatisch durch „nichts davon“ ausgedrückt.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem, knappem Gebotsstil. „Beine“ ist im Deutschen geläufiger als das anatomisch engere „Unterschenkel“; „Innereien“ ist verständlich und weniger archaisch als „Eingeweide“.
