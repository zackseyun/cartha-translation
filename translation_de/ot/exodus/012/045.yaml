  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: de
  text: Weder ein ansässiger Fremder noch ein Lohnarbeiter darf davon essen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „ein Beisasse“ oder „ein vorübergehend Ansässiger“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: vom Passamahl; enger gefasst: vom Passalamm.'
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: ansässiger Fremder
  rationale: Die Bezeichnung meint hier einen Nichtisraeliten, der auf Dauer oder vorübergehend unter Israel lebt, ohne vollständig in die Bundesgemeinschaft aufgenommen zu sein. „Ansässiger Fremder“ verbindet Wohnsitz und Außenseiterstatus in verständlichem modernem Deutsch.
- source_word: שָׂכִיר
  choice: Lohnarbeiter
  rationale: Das Wort bezeichnet jemanden, der gegen Lohn arbeitet. „Lohnarbeiter“ ist prägnant und vermeidet die heute missverständlichen Bezeichnungen „Mietling“ oder „Tagelöhner“, da die Beschäftigungsdauer nicht festgelegt ist.
- source_word: לֹא יֹאכַל
  choice: dürfen nicht essen
  rationale: Der negierte Imperfekt formuliert in diesem Rechtstext ein Verbot. „Dürfen nicht“ gibt dessen normative Kraft in natürlichem modernem Deutsch wieder.
- source_word: בּוֹ
  choice: davon
  rationale: Die Präposition bei „essen“ hat hier partitive Bedeutung. „Davon essen“ bewahrt den knappen Rückverweis auf das Passa und klingt im Deutschen idiomatisch.
theological_decisions:
- issue: Bezugswort des Pronomens in בּוֹ
  choice: „davon“ verweist auf das Passamahl beziehungsweise das Passatier im unmittelbaren Zusammenhang
  alternative: Der Bezug wird ausschließlich auf das Passalamm eingeengt
  rationale: Der hebräische Text nennt das Bezugswort in diesem Satz nicht ausdrücklich. Die knappe Wiedergabe „davon“ erhält diese kontextuell erschließbare Offenheit, während eine Fußnote den Bezug erläutert.
- issue: Verknüpfung von תּוֹשָׁב und שָׂכִיר
  choice: „und“
  alternative: „oder“ als distributive Wiedergabe der beiden ausgeschlossenen Personengruppen
  rationale: Das hebräische וְ ist formal „und“. Auch wenn das Verbot selbstverständlich für jede der beiden Gruppen einzeln gilt, bewahrt „und“ die ausdrückliche Verknüpfung des Ausgangstextes.
translation_notes:
  register: Moderne, würdige Rechtssprache. „Ansässiger Fremder“ ist verständlicher als das fachsprachlich-altertümliche „Beisasse“; „dürfen nicht“ formuliert das Verbot natürlich und bestimmt.
