    rationale: Obwohl dies die formale hebräische Konjunktion abbildet, kann Deutsch dadurch eine gemeinsame statt einer je einzelnen Ausschlussregel nahelegen. Die distributive Aussage des Rechtstextes wird mit „weder … noch“ präzise und idiomatich wiedergegeben.
  - severity: low
