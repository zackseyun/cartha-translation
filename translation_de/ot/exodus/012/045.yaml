  source_fidelity: Die beiden in Exodus 12,45 genannten Personengruppen sind jeweils vom Essen ausgeschlossen. Die hebräische Verbindung mit וְ steht in dieser rechtlichen Aufzählung distributiv; eine deutsche Formulierung mit „weder … noch“ gibt dies eindeutig wieder. „Davon essen“ bewahrt den knappen, kontextabhängigen Bezug von בּוֹ.
  naturalness: „Weder ein ansässiger Fremder noch ein Lohnarbeiter darf davon essen“ ist modernes, klares Deutsch mit angemessenem Rechtston. Es vermeidet, dass „und“ so verstanden werden könnte, als sei nur die gemeinsame Konstellation beider Personen gemeint.
  terminology: „Ansässiger Fremder“ und „Lohnarbeiter“ sind tragfähige moderne Wiedergaben. In der erklärenden Fußnote ist „Passalamm“ im heutigen Deutsch deutlich geläufiger und verständlicher als „Passatier“; die Fußnote wahrt dabei die weitere Deutung als Passamahl.
