  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: de
  text: Auch eine große gemischte Gruppe[a] zog mit ihnen hinauf, dazu Kleinvieh und Rinder – sehr viel Vieh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große gemischte Menschenmenge“; der hebräische Ausdruck bezeichnet eine große, unterschiedlich zusammengesetzte Gruppe, die Israel begleitete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/גַם
  choice: Auch
  rationale: Die Verbindung aus Konjunktion und Adverb ergänzt die vorangehende Erzählung; „Auch“ gibt diese additive Funktion knapp und natürlich wieder.
- source_word: עֵרֶב רַב
  choice: eine große gemischte Gruppe
  rationale: Die Wendung bezeichnet eine zahlreiche, heterogen zusammengesetzte Gruppe, ohne ihre ethnische oder soziale Zusammensetzung genauer festzulegen. „Große“ bewahrt die quantitative Bedeutung von רַב.
- source_word: עָלָה
  choice: zog … hinauf
  rationale: „Hinaufziehen“ bewahrt die übliche hebräische Bewegungsformulierung im Auszugsbericht und klingt im Deutschen erzählerisch natürlich.
- source_word: אִתָּם
  choice: mit ihnen
  rationale: Direkte Wiedergabe der komitativen Präposition mit Suffix; der Bezug gilt den Israeliten im Kontext.
- source_word: וְ/צֹאן וּ/בָקָר
  choice: dazu Schafe, Ziegen und Rinder
  rationale: צֹאן bezeichnet Kleinvieh, insbesondere Schafe und Ziegen, בָקָר Rinder. Die ausdrückliche Nennung macht die hebräische Unterscheidung für heutige Leser klar; „dazu“ bildet die koordinierende Fortführung natürlich ab.
- source_word: מִקְנֶה
  choice: Vieh
  rationale: Der Sammelbegriff fasst die zuvor genannten domestizierten Tiere zusammen; „Vieh“ ist in diesem Kontext eine natürliche deutsche Gesamtbezeichnung.
- source_word: כָּבֵד מְאֹד
  choice: sehr viel
  rationale: Wörtlich „sehr schwer“, bezeichnet die Verbindung bei Vieh idiomatisch eine außerordentlich große Menge. „Sehr viel Vieh“ vermittelt diesen Sinn knapp und natürlich.
theological_decisions:
- issue: Zusammensetzung der Gruppe עֵרֶב רַב
  choice: Keine ethnische oder religiöse Identität näher bestimmt
  alternative: Die Gruppe ausdrücklich als Nichtisraeliten oder Angehörige bestimmter Völker bezeichnen
  rationale: Der hebräische Ausdruck kennzeichnet die Gruppe als gemischt und zahlreich, legt ihre genaue Zusammensetzung aber nicht fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zog … hinauf“ erhält die biblische Reiseformulierung ohne unnötige Altertümlichkeit; Gedankenstrich und abschließende Zusammenfassung bilden die hebräische Nachstellung idiomatisch ab.
