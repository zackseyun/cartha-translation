source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַ/פָּ֑סַח כָּל בֶּן נֵכָ֖ר לֹא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose und Aaron: „Dies ist die Satzung des Passa: Kein Fremder darf davon essen.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sohn der Fremde“. Die Wendung bezeichnet einen Fremden; der Zusammenhang behandelt Zugehörigkeitsgrenzen.'
    reason: Macht die hebräische Ausdrucksweise sichtbar und bietet knappe Kontextorientierung, ohne eine im Vers nicht ausdrücklich genannte Einschränkung als Teil der Wortbedeutung festzulegen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die gewöhnliche hebräische Erzählform von אמר wird in natürlicher deutscher Prosa mit „sagte“ wiedergegeben.
- source_word: חֻקַּת
  choice: Satzung
  rationale: „Satzung“ bewahrt den rechtlich-verbindlichen Ton von חֻקָּה und ist im modernen Deutschen verständlich.
- source_word: הַפָּסַח
  choice: Passafest
  rationale: פֶּסַח kann das Passa beziehungsweise seine Feier und Opfermahlzeit bezeichnen. „Passafest“ ist hier verständlich, ohne die Bedeutung ausschließlich auf das Opfer oder die Mahlzeit zu verengen.
- source_word: כָּל ... לֹא
  choice: kein ... darf
  rationale: Die Verbindung von כָּל mit dem verneinten Verb wird als allgemeines Verbot idiomatisch wiedergegeben.
- source_word: בֶּן נֵכָר
  choice: Fremder
  rationale: Die wörtliche Wendung „Sohn der Fremde“ bezeichnet einen Fremden. Die Übersetzung fügt keine im Ausdruck selbst nicht ausdrücklich genannte nähere Kategorie hinzu.
- source_word: לֹא יֹאכַל בּוֹ
  choice: darf davon nicht essen
  rationale: Im rechtlichen Kontext drückt „darf ... nicht“ das Verbot natürlich aus; בּוֹ bei „essen“ wird idiomatisch mit „davon“ wiedergegeben.
theological_decisions:
- issue: Identität der vom Passamahl Ausgeschlossenen
  choice: „Fremder“ ohne einschränkenden Zusatz
  alternative: „ein Fremder außerhalb der Bundesgemeinschaft“ oder „ein Unbeschnittener“
  rationale: בֶּן־נֵכָר bezeichnet hier unmittelbar einen Fremden. Der weitere Zusammenhang erläutert die Zugehörigkeitsgrenzen, doch diese werden nicht in den Wortlaut dieses Verses hineingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klar erkennbarem Rechtston. „Jahwe“ gibt den persönlichen Gottesnamen wieder; „Passafest“ vermeidet eine Verwechslung mit dem späteren christlichen Osterfest.
