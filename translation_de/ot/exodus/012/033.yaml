base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: de
  text: 'Die Ägypter drängten darauf, das Volk so schnell wie möglich aus dem Land fortzuschicken; denn sie sagten: »Wir alle sterben!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wir alle sind Tote.« Die hebräische Partizipform kann hier die unmittelbar drohende Todeslage ausdrücken: »Wir alle sterben« oder »Wir werden alle sterben.«'
    reason: Das Hebräische verwendet eine knappe, im Deutschen missverständliche Formulierung; die Anmerkung erläutert die wörtliche Form und bewahrt die mögliche Nuance von unmittelbar drohendem Tod.
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל הָעָם
  choice: Die Ägypter drängten das Volk
  rationale: חזק mit עַל bezeichnet hier starken, nachdrücklichen Druck. מִצְרַיִם steht als kollektive Bezeichnung für die Ägypter; die persönliche Wiedergabe ist im Deutschen natürlich.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: es so schnell wie möglich … fortzuschicken
  rationale: Die aufeinanderfolgenden Infinitive drücken den Zweck und die große Eile aus. Die deutsche Formulierung verbindet beides flüssig, ohne die Dringlichkeit abzuschwächen.
- source_word: מִן הָאָרֶץ
  choice: aus dem Land
  rationale: Bewahrt die konkrete Bezeichnung »das Land«, die sich im Zusammenhang auf Ägypten bezieht.
- source_word: כִּי אָמְרוּ
  choice: denn sie sagten
  rationale: כִּי führt die Begründung für das Drängen ein; »denn« entspricht dem erzählerischen Zusammenhang knapp und natürlich.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Wir sind alle des Todes!
  rationale: Die nominale Aussage mit dem Partizip מֵתִים bringt im Kontext die Überzeugung zum Ausdruck, dass nun alle dem Tod verfallen beziehungsweise vom Tod bedroht sind. Die deutsche Wendung bewahrt diese zugespitzte Todesgewissheit, ohne unlogisch zu behaupten, die Sprechenden seien bereits tot.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Drängten« vermittelt den starken Druck; »so schnell wie möglich« macht die durch die Infinitivfolge ausgedrückte Eile verständlich. »Des Todes sein« ist leicht gehoben, aber geläufig und für die dramatische direkte Rede passend.
