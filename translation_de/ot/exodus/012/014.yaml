  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: de
  text: Dieser Tag soll für euch ein Gedenktag sein. Ihr sollt ihn als Fest für Jahwe feiern. Von Generation zu Generation sollt ihr ihn als bleibende Ordnung feiern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ewige Ordnung« beziehungsweise »immerwährende Satzung«. Die hebräische Wendung חֻקַּת עוֹלָם bezeichnet häufig eine dauerhaft geltende, fortlaufend zu beachtende Vorschrift.'
    reason: lexikalische Alternative und Bedeutungsumfang
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה
  choice: Dieser Tag soll … sein
  rationale: Die Verbform hat in diesem anweisenden Kontext Zukunfts- und Vorschriftscharakter. „Soll … sein“ gibt dies in natürlichem, rechtlich geprägtem Deutsch wieder.
- source_word: לָכֶם לְזִכָּרוֹן
  choice: für euch ein Gedenktag
  rationale: זִכָּרוֹן bezeichnet hier ein erinnerndes Gedenken beziehungsweise dessen kultischen Anlass. „Gedenktag“ ist im Deutschen klarer und natürlicher als das abstraktere „zum Gedächtnis“.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: Ihr sollt ihn als Fest … feiern
  rationale: Die Verbindung von „Fest“ und „feiern“ bildet die hebräische figura etymologica aus חַג und חגג natürlich nach.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition kennzeichnet das Fest als Jahwe zugeordnet. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לְדֹרֹתֵיכֶם
  choice: Von Generation zu Generation
  rationale: Die Wendung bezeichnet die fortdauernde Beachtung durch die aufeinanderfolgenden Generationen und wird idiomatisch wiedergegeben.
- source_word: חֻקַּת עוֹלָם
  choice: bleibende Ordnung
  rationale: חֻקָּה ist eine verbindliche Festsetzung oder Ordnung; עוֹלָם hebt ihre fortdauernde Geltung hervor, ohne zwingend eine philosophisch absolute Endlosigkeit festzulegen.
- source_word: תְּחָגֻּהוּ
  choice: sollt ihr ihn … feiern
  rationale: Die Wiederholung von חגג bekräftigt die vorgeschriebene Feier; die wiederholte deutsche Wiedergabe mit „feiern“ bewahrt diesen Nachdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitliche Tragweite von חֻקַּת עוֹלָם
  choice: bleibende Ordnung
  alternative: ewige Ordnung; immerwährende Satzung
  rationale: Die Formulierung verlangt eine fortdauernde Befolgung über Israels Generationen hinweg. „Bleibend“ wahrt diese rechtliche Dauer, ohne die mögliche Reichweite des idiomatischen עוֹלָם stillschweigend metaphysisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „feiern“ folgt dem hebräischen Nachdruck; „Fest feiern“ bewahrt zugleich das Wortspiel zwischen Verb und verwandtem Substantiv. Der Fußnotenmarker steht bei der Wendung, auf die sich die lexikalische Erläuterung tatsächlich bezieht.
