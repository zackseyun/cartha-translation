  text: וְ/הָיָ֤ה לָ/כֶם֙ לְ/מִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/שָׁחֲט֣וּ אֹת֗/וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת יִשְׂרָאֵ֖ל בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: de
  text: Ihr sollt es bis zum vierzehnten Tag dieses Monats in Obhut halten. Und die ganze Versammlung der Gemeinde Israels soll es zwischen den Abenden[a] schlachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zwischen den Abenden«; die hebräische Wendung wird gewöhnlich als die Zeit um Sonnenuntergang oder in der Abenddämmerung verstanden.'
    reason: Die wörtliche Formulierung bewahrt eine mehrdeutige hebräische Zeitangabe und erläutert deren verbreitete Deutung.
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: Ihr sollt es … in Obhut halten
  rationale: Die Verbindung bezeichnet, dass das Tier bis zum festgesetzten Tag fürsorglich verwahrt wird. Die aktive deutsche Form gibt die Verantwortung der Angesprochenen natürlich wieder.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: bis zum vierzehnten Tag dieses Monats
  rationale: Dies entspricht der hebräischen Datumsangabe und ist im modernen Deutschen klar und idiomatisch.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: es … schlachten
  rationale: שׁחט bezeichnet spezifisch das Schlachten eines Tieres; das Pronomen verweist auf das zuvor ausgewählte Schaf- oder Ziegentier.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: die ganze Versammlung der Gemeinde Israel
  rationale: Die doppelte Kollektivbezeichnung des Hebräischen bleibt erhalten, ohne sie zu einer bloßen Haushaltsangabe zu verengen.
- source_word: בֵּין הָעַרְבָּיִם
  choice: zwischen den Abenden
  rationale: Die wörtliche Wiedergabe bewahrt die zeitliche Mehrdeutigkeit der hebräischen Wendung; eine geläufige Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Kollektives Subjekt des Schlachtgebots
  choice: die ganze Versammlung der Gemeinde Israel soll es schlachten
  alternative: Jeder Haushalt soll sein eigenes Tier schlachten
  rationale: Der hebräische Text nennt Israel in kollektiver Sprache als handelndes Subjekt. Die Übersetzung bewahrt diese Aussage, obwohl der nähere Zusammenhang eine Ausführung durch die einzelnen Haushalte nahelegt.
- issue: Zeitpunkt des Schlachtens
  choice: zwischen den Abenden
  alternative: in der Abenddämmerung
  rationale: Die genaue zeitliche Bestimmung der hebräischen Redewendung ist umstritten. Die Übersetzung legt sich daher im Haupttext nicht auf eine einzelne Auslegung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die aktive Form »Ihr sollt … halten« vermeidet eine schwerfällige Passivkonstruktion; »Versammlung der Gemeinde« erhält bewusst die feierliche doppelte Kollektivbezeichnung des Ausgangstextes.
