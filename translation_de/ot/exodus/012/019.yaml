id: EXO.12.19
reference: Exodus 12:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: de
  text: Sieben Tage lang darf sich kein Sauerteig in euren Häusern befinden. Denn jeder, der etwas Gesäuertes isst, soll von der Gemeinschaft Israels[a] abgeschnitten werden[b], gleich ob er ein ansässiger Fremder[c] oder ein Einheimischer des Landes ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinde“ beziehungsweise „Versammlung Israels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „soll jene Person abgeschnitten werden“. Die hebräische Bundesstrafenformel kann je nach Zusammenhang Ausschluss, Tod oder göttliches Gericht bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Schutzbürger“; gemeint ist ein dauerhaft unter Israel lebender Nicht-Einheimischer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Sieben Tage lang
  rationale: Der temporale Akkusativ bezeichnet die Dauer; diese Formulierung ist im modernen Deutsch natürlich und genau.
- source_word: שְׂאֹר
  choice: Sauerteig
  rationale: Gemeint ist ein Gär- beziehungsweise Triebmittel, nicht allgemein gesäuerte Speise. „Sauerteig“ passt zum antiken häuslichen und rituellen Kontext besser als das engere moderne „Hefe“.
- source_word: לֹא יִמָּצֵא
  choice: darf sich ... nicht befinden
  rationale: Das Niphal bezeichnet hier den verbotenen Zustand, dass Sauerteig im Haus vorhanden ist. Die deutsche Fassung gibt die rechtliche Verbindlichkeit idiomatisch wieder.
- source_word: בְּבָתֵּיכֶם
  choice: in euren Häusern
  rationale: Der konkrete Plural des Hebräischen bleibt erhalten und bezeichnet die Wohnstätten beziehungsweise Haushalte.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für das vorausgehende Verbot ein.
- source_word: כָּל אֹכֵל
  choice: jeder, der ... isst
  rationale: Die Verbindung von כָּל mit dem Partizip hat allgemeine, umfassende Bedeutung.
- source_word: מַחְמֶצֶת
  choice: etwas Gesäuertes
  rationale: Der Ausdruck ist weiter als „gesäuertes Brot“ und umfasst grundsätzlich jede mit Sauerteig versetzte Speise.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: soll als Mensch ... abgeschnitten werden
  rationale: נֶפֶשׁ bezeichnet hier die betreffende Person, nicht eigens eine vom Körper getrennte Seele. „Abgeschnitten werden“ bewahrt die Bundesstraf-Formel, ohne ihre genaue Vollzugsweise festzulegen.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: von der Gemeinschaft Israels
  rationale: עֵדָה bezeichnet die versammelte beziehungsweise verbundene Gemeinschaft Israels. „Gemeinschaft“ ist verständlich und vermeidet eine unnötige Verengung auf eine moderne Organisationsform.
- source_word: בַּגֵּר
  choice: ein ansässiger Fremder
  rationale: גֵּר meint einen Nicht-Einheimischen, der dauerhaft unter Israel lebt; die Wiedergabe drückt sowohl Fremdstatus als auch Ansässigkeit aus.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: ein Einheimischer des Landes
  rationale: Die Wendung bezeichnet im Gegensatz zum גֵּר den im Land beheimateten Angehörigen, ohne moderne staatsbürgerliche Kategorien einzutragen.
theological_decisions:
- issue: Bedeutung der Bundesstrafe כרת („abschneiden“)
  choice: Die Wendung „von der Gemeinschaft Israels abgeschnitten werden“ wird als offene Rechts- und Bundesformel beibehalten.
  alternative: „aus der Gemeinschaft ausgeschlossen werden“ oder „getötet werden“
  rationale: Der hebräische Ausdruck kann je nach Zusammenhang Ausschluss, Tod oder ein göttliches Gericht bezeichnen. Die Übersetzung legt die im Vers nicht ausdrücklich bestimmte Vollzugsweise nicht fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-ritueller Klarheit. Die Satzstruktur wurde leicht geglättet; zentrale hebräische Unterscheidungen und die Mehrdeutigkeit der Strafandrohung bleiben erhalten.
