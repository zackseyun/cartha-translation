  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: de
  text: Da gingen die Söhne Israels[a] hin und taten es; wie Jahwe es Mose und Aaron geboten hatte, so taten sie es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „die Israeliten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Da gingen … hin
  rationale: Die Erzählform führt die Handlung weiter. „Gingen … hin“ gibt das schlichte הלך wieder, ohne den im Zusammenhang naheliegenden Zweck ausdrücklich in das Verb hineinzulesen.
- source_word: וַיַּעֲשׂוּ
  choice: und taten es
  rationale: עשה verweist hier auf die zuvor angeordneten Passahhandlungen. „Taten es“ bewahrt diesen Rückbezug, ohne einzelne Handlungen ergänzend auszuschreiben.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche familiäre und maskuline Ausdrucksweise des Hebräischen bleibt im Haupttext sichtbar; die im Deutschen idiomatischere Bezeichnung steht in der Fußnote.
- source_word: כַּאֲשֶׁר
  choice: Genauso, wie
  rationale: Die Formulierung hebt die genaue Übereinstimmung zwischen dem Gebot und seiner Ausführung hervor.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Jahwes Gebot der Ausführung vorausging, ohne den Sinn des hebräischen Perfekts zu verändern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen übliche Form.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Die beiden Namen sind durch אֶת als direkte Objekte von „gebieten“ gekennzeichnet. Daher wird weder „durch“ noch „zu“ ergänzt.
- source_word: כֵּן עָשׂוּ
  choice: so taten sie es
  rationale: Die abschließende Wiederaufnahme bewahrt die nachdrückliche Aussage, dass sie genau dem Gebot entsprechend handelten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ erhält den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Der Haupttext bewahrt die ausdrücklich maskuline familiäre Wendung. Die natürliche kollektive Bedeutung wird als idiomatische Alternative in der Fußnote angegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „tun“ bildet die Wiederholung von עשה ab; die leicht feierliche Satzstruktur bewahrt den Nachdruck auf Israels genauem Gehorsam.
