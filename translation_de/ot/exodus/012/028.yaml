revisions:
- from: Da gingen die Söhne Israels[a] hin und taten es. Genauso, wie Jahwe Mose und Aaron geboten hatte, so taten sie es.
  to: Da gingen die Söhne Israels[a] hin und taten es; wie Jahwe es Mose und Aaron geboten hatte, so taten sie es.
  rationale: 'Die Ergänzung von „es“ vor „Mose und Aaron“ ermöglicht die im Deutschen erforderliche Dativkonstruktion bei „gebieten“, ohne den hebräischen Sinn zu verändern: Jahwe gebot Mose und Aaron die betreffenden Handlungen. Das Semikolon und „Wie …, so …“ verbinden die beiden hebräischen Satzglieder und bewahren die betonte Wiederholung von „taten es“.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:39:22Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge „gingen und taten“ sowie die nachdrückliche Schlusswiederholung von עשה sachgerecht wieder. Auch Jahwe, Mose und Aaron sowie die wörtliche Wiedergabe von בְּנֵי יִשְׂרָאֵל sind quellentreu. Bei „gebieten“ ist im modernen Deutschen jedoch der Bezug auf die Personen als Dativ erforderlich; die hebräische Akkusativmarkierung lässt sich nicht mit einem deutschen Akkusativ nachbilden.
  naturalness: Die gegenwärtige Satztrennung macht den anaphorischen Bezug von „taten es“ zunächst etwas abrupt. Eine Satzverbindung mit Semikolon und der deutschen Korrelativform „Wie …, so …“ bildet den hebräischen Nachdruck klarer und natürlicher ab.
  terminology: „Jahwe“ ist die übliche deutsche Form des Tetragramms. „Söhne Israels“ bewahrt die formale, maskuline Familienbezeichnung; die Fußnote bietet zutreffend die idiomatische deutsche Alternative.
  issues:
  - severity: medium
    issue: Kasus bei „gebieten“
    rationale: '„Jahwe Mose und Aaron geboten hatte“ behandelt Mose und Aaron formal als Akkusativobjekte. Im modernen Standarddeutsch lautet die Konstruktion „jemandem gebieten“; daher: „Jahwe Mose und Aaron geboten hatte“ ist durch „Jahwe Mose und Aaron geboten hatte“ nicht sicher auflösbar, weil die Eigennamen keine sichtbare Kasusmarkierung tragen. Die Konstruktion sollte mit „Jahwe Mose und Aaron geboten hatte“ vermieden und durch „Jahwe Mose und Aaron geboten hatte“? Nein: Eindeutig und idiomatisch ist „wie Jahwe es Mose und Aaron geboten hatte“.'
  revised_text: Da gingen die Söhne Israels[a] hin und taten es; wie Jahwe es Mose und Aaron geboten hatte, so taten sie es.
  revised_footnotes:
  - marker: a
    text: 'Oder idiomatischer: „die Israeliten“.'
    reason: lexical_alternative
  revision_rationale: 'Die Ergänzung von „es“ vor „Mose und Aaron“ ermöglicht die im Deutschen erforderliche Dativkonstruktion bei „gebieten“, ohne den hebräischen Sinn zu verändern: Jahwe gebot Mose und Aaron die betreffenden Handlungen. Das Semikolon und „Wie …, so …“ verbinden die beiden hebräischen Satzglieder und bewahren die betonte Wiederholung von „taten es“.'
