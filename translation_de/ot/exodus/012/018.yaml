  text: בָּ/רִאשֹׁ֡ן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַ/חֹ֨דֶשׁ֙ בָּ/עֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָ/אֶחָ֧ד וְ/עֶשְׂרִ֛ים לַ/חֹ֖דֶשׁ בָּ/עָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: de
  text: Im ersten Monat, am vierzehnten Tag des Monats, am Abend[a], sollt ihr ungesäuertes Brot essen, bis zum einundzwanzigsten Tag des Monats am Abend.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder an beiden Stellen: »zur Abendzeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: Im ersten Monat
  rationale: Die Monatsangabe ergibt sich aus der später im Satz ausdrücklich genannten Datumsformel לַחֹדֶשׁ. Im Deutschen wird »Monat« zur natürlichen und eindeutigen Wiedergabe ergänzt.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: am vierzehnten Tag
  rationale: Die hebräische Datumsangabe verwendet eine Kardinalzahl mit יוֹם; die idiomatische deutsche Ordinalform gibt ihre kalendarische Funktion genau wieder.
- source_word: לַחֹדֶשׁ
  choice: des Monats
  rationale: חֹדֶשׁ kann »Monat« oder »Neumond« bezeichnen, meint in dieser Datumsformel jedoch den Monat.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: am Abend
  rationale: Die Wendung bezeichnet an beiden Stellen die abendliche zeitliche Grenze. »Am Abend« ist im Deutschen knapp, natürlich und weniger einengend als »bei Einbruch der Dämmerung«.
- source_word: תֹּאכְלוּ
  choice: sollt ihr … essen
  rationale: Das Imperfekt hat in diesem rechtlich-anweisenden Zusammenhang verpflichtenden Charakter; »sollt ihr« gibt diesen angemessen und in modernem Deutsch wieder.
- source_word: מַצֹּת
  choice: ungesäuertes Brot
  rationale: Der Plural bezeichnet hier Brot ohne Sauerteig. Die etablierte Sachbezeichnung ist verständlicher als eine Transliteration und vermeidet die unnötige Festlegung auf einzelne Brotfladen.
- source_word: עַד
  choice: bis
  rationale: Die Präposition kennzeichnet die zeitliche Schlussgrenze des genannten Zeitraums.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: zum einundzwanzigsten Tag
  rationale: Die hebräische Zahlenverbindung wird als natürliche deutsche Ordinalzahl wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Datumsformel. Die Wiederholung von »des Monats« und »am Abend« bleibt erhalten, weil sie die beiden zeitlichen Grenzen ausdrücklich markiert.
