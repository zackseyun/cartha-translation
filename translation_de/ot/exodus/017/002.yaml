language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: de
  text: 'Da stritt das Volk mit Mose und sagte: „Gebt uns Wasser, damit wir trinken können.“ Mose sagte zu ihnen: „Warum streitet ihr mit mir? Warum stellt ihr Jahwe[a] auf die Probe[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „Jahwe prüfen“ oder „Jahwe versuchen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶב
  choice: stritt
  rationale: Das Verb ריב bezeichnet einen Streit oder eine Auseinandersetzung. „stritt mit“ gibt die gegnerische Haltung natürlich wieder und bewahrt zusammen mit תְּרִיבוּן die Wortwiederholung.
- source_word: הָעָם
  choice: das Volk
  rationale: Der bestimmte hebräische Ausdruck bedeutet schlicht „das Volk“; eine Ergänzung wie „Israel“ steht in diesem Vers nicht ausdrücklich.
- source_word: עִם מֹשֶׁה
  choice: mit Mose
  rationale: עִם bedeutet formal „mit“. Die deutsche Verbindung „mit jemandem streiten“ drückt den Widerstreit idiomatisch aus.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: Gebt uns Wasser
  rationale: Der hebräische Imperativ steht im Plural. Die Übersetzung bewahrt diese auffällige Form, obwohl unmittelbar Mose angesprochen wird.
- source_word: וְנִשְׁתֶּה
  choice: damit wir trinken können
  rationale: Die Kohortativform bezeichnet hier den beabsichtigten Zweck beziehungsweise das gewünschte Ergebnis der Forderung.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Warum streitet ihr mit mir?
  rationale: מַה hat in dieser tadelnden Frage den Sinn „warum“. „streitet“ wahrt den lexikalischen Zusammenhang mit וַיָּרֶב.
- source_word: מַה תְּנַסּוּן
  choice: Warum stellt ihr … auf die Probe?
  rationale: נסה im Piel bedeutet „prüfen, erproben, auf die Probe stellen“. Die Wendung ist im modernen Deutsch natürlich und behält die Schärfe des Vorwurfs bei.
- source_word: אֶת יְהוָה
  choice: Jahwe
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen יהוה. „Jahwe“ ist dessen gebräuchliche deutsche Wiedergabe und macht den Eigennamen sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. Die Hauptübersetzung gibt ihn daher als „Jahwe“ wieder; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Bedeutung des Prüfens Gottes
  choice: Jahwe auf die Probe stellen
  alternative: Jahwe versuchen / Jahwe prüfen
  rationale: 'Die Formulierung wahrt die theologische Spannung: Der Streit um Wasser wird als Herausforderung an Gott bezeichnet, ohne die Art oder Absicht dieser Prüfung weiter auszudeuten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise und die wiederholte Streit-Terminologie des Hebräischen bleiben erhalten. Der ungewöhnliche pluralische Imperativ „Gebt“ wird nicht stillschweigend in einen Singular umgeformt.
