  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֨ר יָרִ֥ים מֹשֶׁ֛ה יָד֖/וֹ וְ/גָבַ֣ר יִשְׂרָאֵ֑ל וְ/כַ/אֲשֶׁ֥ר יָנִ֛יחַ יָד֖/וֹ וְ/גָבַ֥ר עֲמָלֵֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: de
  text: Und sooft Mose seine Hand erhob[a], hatte Israel die Oberhand; und sooft er seine Hand sinken ließ[b], hatte Amalek die Oberhand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wenn Mose seine Hand erhob … wenn er seine Hand sinken ließ“. Der Zusammenhang zeigt, dass dies während der Schlacht wiederholt geschah; daher „sooft“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann auch „ruhen lassen“ oder „niederlassen“ bedeuten. Der Gegensatz zu „seine Hand erhob“ spricht hier für „sinken ließ“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: und sooft
  rationale: Die Konstruktion bezeichnet hier einen wiederholt eintretenden Umstand während der Schlacht. „Sooft“ gibt diesen iterativen Sinn im Deutschen knapp und natürlich wieder.
- source_word: יָרִים
  choice: erhob
  rationale: Der Hifil von רום bedeutet „erheben/hochheben“. „Erhob“ bleibt nah am Wortlaut, ohne eine ausdrücklich nicht bezeichnete Dauer des Hochhaltens hinzuzufügen.
- source_word: יָדוֹ
  choice: seine Hand
  rationale: יָד bezeichnet ausdrücklich die Hand; eine Wiedergabe mit „Arm“ wäre zwar gestisch denkbar, aber weniger quellennah.
- source_word: וְגָבַר
  choice: war stärker
  rationale: גבר bezeichnet hier das Stark- bzw. Überlegensein im wechselnden Kampfgeschehen. „War stärker“ bewahrt diesen relativen, vorläufigen Sinn besser als eine Formulierung, die bereits einen endgültigen Sieg nahelegt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Volksnamens.
- source_word: וְכַאֲשֶׁר
  choice: doch sooft
  rationale: „Sooft“ bewahrt die Wiederholung; „doch“ macht den im Hebräischen durch die koordinierten Gegensätze entstehenden Kontrast natürlich deutlich.
- source_word: יָנִיחַ
  choice: sinken ließ
  rationale: Der Hifil von נוח kann „ruhen lassen“, „niederlassen“ oder „absenken“ bedeuten. Im Gegensatz zum Erheben der Hand bezeichnet „sinken ließ“ idiomatisch deren Absenken, ohne das Verb auf ein bewusstes Ablegen festzulegen.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Übliche Wiedergabe des Volksnamens.
