  source_fidelity: 'Die koordinierte Fassung „Josua tat … und kämpfte“ stellt Josuas Kampf als bereits vollzogene Folgehandlung dar. Das hebräische לְהִלָּחֵם ist jedoch ein Infinitiv mit finaler/auftragsbezogener Funktion: Josua führte Moses’ Anweisung aus, um gegen Amalek zu kämpfen. Eine finale deutsche Formulierung bildet dies genauer ab. Die übrigen Satzglieder, einschließlich der drei Personen, die auf den Hügel hinaufgehen, sind sachgerecht wiedergegeben.'
