base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: de
  text: Josua tat, wie Mose ihm gesagt hatte, um gegen Amalek[a] zu kämpfen. Und Mose, Aaron und Hur stiegen zur Spitze des Hügels hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Amalek“; damit können die von Amalek abstammenden Menschen, also die Amalekiter, gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: Josua tat, was Mose ihm gesagt hatte
  rationale: Die Konstruktion bezeichnet die Ausführung der zuvor erteilten Anweisung. Das deutsche Plusquamperfekt macht den zeitlichen Rückbezug natürlich deutlich.
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  choice: und kämpfte gegen Amalek
  rationale: Das Präfix לְ bezeichnet hier die beabsichtigte beziehungsweise beauftragte Handlung. Im Deutschen gibt die koordinierte Verbform den Zusammenhang idiomatisch wieder; בְּ bezeichnet beim Verb לחם den Gegner.
- source_word: בַּעֲמָלֵק
  choice: gegen Amalek
  rationale: Die Wiedergabe bewahrt den Eigennamen des hebräischen Textes und lässt offen, ob damit Amalek kollektiv, also das Volk der Amalekiter, gemeint ist.
- source_word: עָלוּ
  choice: stiegen auf
  rationale: עלה bezeichnet eine Aufwärtsbewegung. „Stiegen auf“ ist im Zusammenhang mit einem Hügel natürlich und präzise.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: den Gipfel des Hügels
  rationale: Wörtlich „Kopf des Hügels“; gemeint ist dessen höchster Punkt. „Gipfel“ ist eine natürliche, würdige deutsche Wiedergabe.
- source_word: יְהוֹשֻׁעַ / מֹשֶׁה / אַהֲרֹן / חוּר
  choice: Josua / Mose / Aaron / Hur
  rationale: Die Personennamen werden in ihren etablierten deutschen Bibelformen wiedergegeben.
