  naturalness: »Dort dürstete das Volk nach Wasser« und »murrte ... gegen Mose« sind natürlich und angemessen. Eine einzige rhetorische Frage mit »Warum ist es so, dass ...« bildet die hebräische Konstruktion klarer und bleibt dabei modernes Standarddeutsch.
  terminology: »Mose«, »Ägypten« und »Vieh« sind passend. »vor Durst sterben zu lassen« gibt בַּצָּמָא idiomatisch und präzise wieder.
