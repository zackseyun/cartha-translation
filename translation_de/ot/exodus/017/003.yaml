base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: de
  text: 'Dort dürstete das Volk nach Wasser. Da murrte das Volk gegen Mose und sagte: »Warum ist es so, dass du uns aus Ägypten heraufgeführt hast, um mich, meine Kinder und mein Vieh vor Durst sterben zu lassen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... לַמַּיִם
  choice: dürstete ... nach Wasser
  rationale: Gibt den körperlichen Durst und den Bezug auf Wasser direkt und natürlich wieder.
- source_word: וַיָּלֶן ... עַל־מֹשֶׁה
  choice: murrte ... gegen Mose
  rationale: Das Verb bezeichnet hier missmutiges Klagen beziehungsweise Aufbegehren; »murren gegen« bewahrt den erzählerischen und wertenden Ton.
- source_word: הֶעֱלִיתָנוּ מִמִּצְרַיִם
  choice: hast du uns aus Ägypten heraufgeführt
  rationale: Bewahrt die im Hebräischen übliche räumlich-theologische Rede vom Heraufführen aus Ägypten.
- source_word: לְהָמִית ... בַּצָּמָא
  choice: um ... verdursten zu lassen
  rationale: Natürliches Deutsch für das Sterbenlassen durch Durst; der vorwurfsvolle Zweckgedanke bleibt erhalten.
- source_word: מִקְנַי
  choice: mein Vieh
  rationale: Bezeichnet den Viehbestand beziehungsweise die Nutztiere; »Vieh« ist hier prägnant und registergerecht.
theological_decisions:
- issue: Wechsel von »uns« zu »mich, meine Kinder und mein Vieh«
  choice: Den Numeruswechsel wörtlich bewahren
  alternative: 'Durchgehend den Plural verwenden: »uns, unsere Kinder und unser Vieh«'
  rationale: Der masoretische Text wechselt ausdrücklich vom pluralischen »uns« zum singularischen »mich/meine«; diese auffällige kollektive Rede soll nicht geglättet werden.
- issue: Funktion von לָמָּה זֶּה ... לְהָמִית
  choice: Als zwei eng verbundene rhetorische Fragen wiedergeben
  alternative: »Warum ist es so, dass du uns ... heraufgeführt hast, um ...?«
  rationale: Die deutsche Fragefolge vermittelt den anklagenden Sinn klar, ohne den im Hebräischen möglichen Zweckvorwurf abzuschwächen oder als tatsächliche Absicht Moses zu bestätigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Syntax. Die Wiederholung von »das Volk« und der auffällige Wechsel vom kollektiven »uns« zum singularischen »mich/meine« bleiben erhalten.
