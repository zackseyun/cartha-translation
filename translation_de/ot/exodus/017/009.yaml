  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: Moses’ Anrede an Josua, die Auswahl von Männern „für uns“, das Hinausziehen und Kämpfen gegen Amalek, den auf den folgenden Tag bezogenen Standort auf der Hügelhöhe sowie den Stab Gottes in Moses’ Hand. Die Zukunftswiedergabe von נִצָּב im Zusammenhang mit „morgen“ ist angemessen.'
