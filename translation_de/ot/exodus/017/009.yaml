id: EXO.17.9
reference: Exodus 17:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: de
  text: 'Da sagte Mose zu Josua: »Wähle Männer für uns aus und zieh hinaus, um gegen Amalek zu kämpfen.[a] Morgen werde ich auf der Höhe des Hügels stehen,[b] mit dem Stab Gottes in meiner Hand.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und führe Krieg gegen Amalek«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf dem Kopf des Hügels«; gemeint ist dessen Höhe oder Gipfel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt den erzählenden Fortgang des Wayyiqtol in natürlichem modernem Deutsch wieder, ohne eine streng zeitliche Folgerung zu erzwingen.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Verwendet die im Deutschen etablierte biblische Namensform.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Wähle Männer für uns aus
  rationale: Bewahrt die konkrete Bedeutung von בחר und אֲנָשִׁים; im militärischen Zusammenhang sind kampffähige Männer gemeint, ohne dass der Text sie ausdrücklich als Soldaten bezeichnet.
- source_word: וְצֵא
  choice: und zieh hinaus
  rationale: „Hinausziehen“ gibt יצא im militärischen Zusammenhang idiomatisch wieder und bewahrt die Bewegungsrichtung.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: um gegen Amalek zu kämpfen
  rationale: Der Niphal-Imperativ bezeichnet das Kämpfen beziehungsweise Kriegführen gegen einen Gegner; die deutsche Infinitivkonstruktion verbindet den Auftrag natürlich mit dem Hinausziehen.
- source_word: מָחָר אָנֹכִי נִצָּב
  choice: Morgen werde ich … stehen
  rationale: Das vorangestellte מָחָר verleiht dem formal partizipialen נִצָּב hier Zukunftsbezug.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: auf der Höhe des Hügels
  rationale: Gibt das hebräische Bild vom „Kopf“ des Hügels verständlich und würdig wieder, ohne es unnatürlich wörtlich zu übersetzen.
- source_word: וּמַטֵּה הָאֱלֹהִים
  choice: mit dem Stab Gottes
  rationale: Verbindet die verblos angeschlossene Nominalphrase adverbial mit Moses’ Stehen und bewahrt die hebräische Genitivverbindung.
- source_word: בְּיָדִי
  choice: in meiner Hand
  rationale: Direkte und natürliche Wiedergabe der Präpositionalphrase.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים in מַטֵּה הָאֱלֹהִים
  choice: der Stab Gottes
  alternative: Gottes Stab
  rationale: Die Formulierung bewahrt die Konstruktion des Hebräischen und den in Exodus wiederkehrenden Ausdruck, ohne zusätzliche Besitz- oder Wirkungsnuancen einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und befehlsartig; traditionelle, aber weiterhin geläufige biblische Begriffe und Namensformen werden beibehalten.
