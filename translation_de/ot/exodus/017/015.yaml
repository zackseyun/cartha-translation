source:
  edition: WLC
  text: וַ/יִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַ/יִּקְרָ֥א שְׁמ֖/וֹ יְהוָ֥ה נִסִּֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: de
  text: 'Und Mose baute einen Altar und gab ihm den Namen: »Jahwe ist mein Banner.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »JHWH, mein Banner«; auch möglich: »Jahwe, mein Feldzeichen«. Das Wort kann ein Banner, Feldzeichen oder Signalzeichen bezeichnen, um das sich Israel sammelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: baute
  rationale: Das narrative Verb בנה bezeichnet hier konkret das Bauen oder Errichten; »baute« ist die natürliche und direkte deutsche Entsprechung.
- source_word: מִזְבֵּחַ
  choice: Altar
  rationale: מִזְבֵּחַ ist die übliche Bezeichnung für einen Altar und wird im Deutschen eindeutig und traditionsübergreifend so wiedergegeben.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: gab ihm den Namen
  rationale: Die hebräische Wendung bedeutet wörtlich »rief seinen Namen«. »Gab ihm den Namen« gibt die Benennungsformel in natürlichem modernem Deutsch wieder, ohne den Bezug auf den Altar zu verlieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname »Jahwe« wiedergegeben, statt es durch den Titel »der HERR« zu ersetzen.
- source_word: נִסִּי
  choice: ist mein Feldzeichen
  rationale: נֵס kann ein weithin sichtbares Feld-, Sammel- oder Signalzeichen bezeichnen. »Feldzeichen« bewahrt hier den militärischen Zusammenhang und die Vorstellung eines Zeichens, um das sich das Volk sammelt; das im Hebräischen unausgedrückte »ist« ist im Deutschen für den Namenssatz erforderlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה im Namen des Altars
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Seine Wiedergabe als »Jahwe« bewahrt den Charakter als Eigenname und vermeidet die Ersetzung durch einen Titel.
- issue: Deutung der nominalen Wortfolge יְהוָה נִסִּי
  choice: Jahwe ist mein Feldzeichen
  alternative: Jahwe, mein Feldzeichen
  rationale: Die hebräische Nominalkonstruktion enthält keine ausdrücklich gesetzte Kopula. »Ist« ergibt im Deutschen einen natürlichen Titelsatz, ohne festzulegen, auf welche konkrete Weise Jahwe als Feldzeichen verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Feldzeichen« ist im Deutschen weniger alltäglich als »Banner«, bildet jedoch den militärischen Kontext und die Sammelfunktion von נֵס genauer ab. Die Fußnote nennt die geläufigere Alternative und bewahrt die knappe Mehrdeutigkeit des hebräischen Altarnamens.
