  terminology: „Jahwe“ wahrt den Gottesnamen. „Massa“ und „Meriba“ sind in deutscher Bibeltransliteration etablierte Formen; die Fußnote erläutert die semantische Namensgebung. „Söhne Israels“ bewahrt die formale hebräische Kollektivbezeichnung, ohne eine sachlich falsche Einschränkung zu erzeugen.
