source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: de
  text: 'Und er nannte den Ort Massa und Meriba[a], weil die Söhne Israels gestritten und Jahwe auf die Probe gestellt hatten, indem sie sagten: „Ist Jahwe in unserer Mitte oder nicht?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Massa klingt im Hebräischen wie das Wort für „Prüfung“ oder „Auf-die-Probe-Stellen“, Meriba wie das Wort für „Streit“ oder „Auseinandersetzung“.
    reason: Die Namensgebung beruht auf hebräischen Wortspielen, die in der Transliteration nicht erkennbar sind.
  - marker: b
    text: Wörtlich kann die Frage auch mit „Ist Jahwe unter uns oder nicht?“ wiedergegeben werden.
    reason: Die Fußnote bewahrt die Bedeutungsbreite von בְּקִרְבֵּנוּ zwischen räumlich-gemeinschaftlicher Mitte und Gegenwart unter dem Volk.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Und er nannte den Ort
  rationale: Die Verbindung von קרא mit שֵׁם bezeichnet die Namensgebung. Natürliches Deutsch gibt die hebräische Formel treffend mit „den Ort nennen“ wieder, ohne ihren Sinn zu verändern.
- source_word: מַסָּה וּמְרִיבָה
  choice: Massa und Meriba
  rationale: Die Ortsnamen werden transliteriert; ihre für die Erzählung wichtigen Wortspiele werden in einer Fußnote erläutert.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: weil die Söhne Israels gestritten ... hatten
  rationale: עַל bezeichnet hier den Grund der Namensgebung; רִיב meint Streit oder Hadern. Die verbale Formulierung ist im Deutschen klar und bewahrt den Bezug zum Namen Meriba.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die formale Wendung wird bewahrt. Sie bezeichnet hier kollektiv das Volk Israel und nicht ausschließlich männliche Einzelpersonen.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: und Jahwe auf die Probe gestellt hatten
  rationale: נסה im Piel bedeutet „prüfen, erproben, auf die Probe stellen“. Die deutsche Wendung bringt den herausfordernden Charakter des Handelns natürlich zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֵאמֹר
  choice: indem sie sagten
  rationale: Die Formulierung führt nicht nur direkte Rede ein, sondern verdeutlicht hier, worin das Auf-die-Probe-Stellen bestand.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Ist Jahwe in unserer Mitte oder nicht?
  rationale: בקרבנו bezeichnet die Gegenwart innerhalb der Gemeinschaft; „in unserer Mitte“ ist idiomatisch und nah am hebräischen Bild. אם אין bildet den knappen Abschluss der Alternativfrage.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Kollektivbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die gewählte Form bewahrt die hebräische Verwandtschaftsbezeichnung und ihre heilsgeschichtliche Prägung; im Kontext ist das ganze Volk gemeint.
- issue: Art der Herausforderung Gottes
  choice: Jahwe auf die Probe gestellt
  alternative: Jahwe geprüft
  rationale: „Auf die Probe stellen“ bewahrt die negative, herausfordernde Spannung des Kontextes, ohne über den hebräischen Ausdruck hinaus eine bestimmte dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax wurde gegenüber der hebräischen Nominalkonstruktion leicht verbalisiert, der kausale Aufbau und die beiden namensgebenden Motive bleiben jedoch erhalten. Die Ortsnamen und der Gottesname stehen als Eigennamen im Haupttext; die hebräischen Wortspiele werden knapp erklärt.
