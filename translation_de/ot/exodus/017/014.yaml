base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Schreib dies zum Gedenken in das Buch[a] und lass es Josua hören[b]; denn ich werde die Erinnerung an Amalek unter dem Himmel ganz gewiss auslöschen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in einem Buch“ oder „in einer Schriftrolle“; wörtlich steht im Hebräischen „in dem Buch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Lege es in die Ohren Josuas“, das heißt: Lass Josua es hören oder trage es ihm vor.'
    reason: lexical_alternative
  - marker: c
    text: Die hebräische Formulierung für „ich werde … auslöschen“ ist nachdrücklich und kann auch mit „völlig auslöschen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der gebräuchlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כְּתֹב זֹאת זִכָּרוֹן
  choice: Schreib dies zum Gedenken
  rationale: Die Formulierung gibt sowohl den direkten Schreibbefehl als auch den Zweck dauernder Erinnerung natürlich und würdig wieder.
- source_word: בַּסֵּפֶר
  choice: in das Buch
  rationale: Der hebräische Text hat den bestimmten Artikel. Im Deutschen verlangt die Richtungsangabe nach „schreiben“ hier idiomatisch den Akkusativ; mögliche Alternativen werden in der Fußnote genannt.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: und präge es Josua ein
  rationale: Wörtlich steht „lege es in die Ohren Josuas“. „Präge es Josua ein“ bewahrt den Gedanken gezielter, nachhaltiger mündlicher Vermittlung, ohne im Deutschen befremdlich zu klingen.
- source_word: מָחֹה אֶמְחֶה
  choice: ich werde … völlig auslöschen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Völlig“ vermittelt diese Emphase in natürlichem Deutsch.
- source_word: זֵכֶר עֲמָלֵק
  choice: die Erinnerung an Amalek
  rationale: „Erinnerung“ entspricht dem Bedeutungsfeld von זֵכֶר und erhält den bewussten Gegensatz zum zuvor angeordneten Gedenken.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: unter dem Himmel
  rationale: Die feste hebräische Wendung wird in natürlichem Deutsch wiedergegeben und bezeichnet umfassende Tilgung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm יְהוָה. Die Wiedergabe als Eigenname wahrt diese Textgestalt, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang und Gewissheit der angekündigten Tilgung
  choice: „völlig auslöschen“ als emphatische göttliche Ankündigung
  alternative: „gewiss auslöschen“
  rationale: Die hebräische Verbkonstruktion ist emphatisch. „Völlig“ betont die umfassende Tilgung; „gewiss“ würde stärker die Sicherheit des Eintretens hervorheben. Der Text lässt beide Nuancen anklingen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und bestimmt. „Präge es Josua ein“ gibt das hebräische Ohren-Bild idiomatisch wieder; die wörtliche Form steht in der Fußnote. Die Marker [a], [b] und [c] erscheinen jeweils unmittelbar an der betreffenden Textstelle.
