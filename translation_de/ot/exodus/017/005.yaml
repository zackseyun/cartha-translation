source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲבֹר֙ לִ/פְנֵ֣י הָ/עָ֔ם וְ/קַ֥ח אִתְּ/ךָ֖ מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וּ/מַטְּ/ךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּ/וֹ֙ אֶת הַ/יְאֹ֔ר קַ֥ח בְּ/יָדְ/ךָ֖ וְ/הָלָֽכְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Geh vor dem Volk her und nimm einige von den Ältesten Israels mit. Nimm deinen Stab in die Hand, mit dem du den Nil[a] geschlagen hast, und geh.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Strom“; im Buch Exodus bezeichnet das hebräische Wort gewöhnlich den Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Geh vor dem Volk her
  rationale: Gibt die räumliche Bedeutung des Vorangehens natürlich und verständlich wieder.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: und nimm einige von den Ältesten Israels mit
  rationale: Das partitive מִן bezeichnet eine Auswahl aus der Gruppe der Ältesten.
- source_word: וּמַטְּךָ
  choice: deinen Stab
  rationale: „Stab“ ist im modernen Deutschen die natürliche Bezeichnung für Moses Werkzeug und Amtszeichen.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: mit dem du den Nil geschlagen hast
  rationale: בּוֹ ist instrumental; הַיְאֹר bezeichnet im Kontext des Exodus den Nil.
- source_word: קַח בְּיָדְךָ
  choice: Nimm ... in die Hand
  rationale: Bewahrt die Wiederholung des Befehls קַח und formuliert sie idiomatisch auf Deutsch.
- source_word: וְהָלָכְתָּ
  choice: und geh
  rationale: Die Verbform setzt die Befehlsfolge fort und wird im Deutschen als knapper Imperativ wiedergegeben.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Markiert die Fortführung der Erzählung in natürlichem deutschem Erzählstil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens JHWH
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen und entspricht der im Deutschen üblichen Transkription, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Auswahl aus den Ältesten wird im Haupttext ausdrücklich wiedergegeben; daher ist hierfür keine Fußnote nötig. Die Befehlsfolge und die Wiederholung von „nimm“ bleiben erhalten.
