  text: וַ/יַּחֲלֹ֧שׁ יְהוֹשֻׁ֛עַ אֶת עֲמָלֵ֥ק וְ/אֶת עַמּ֖/וֹ לְ/פִי חָֽרֶב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/013.yaml
  text: And Joshua overcame Amalek and his people with the sword[a].
translation:
  language: de
  text: Und Josua besiegte Amalek und sein Volk mit dem Schwert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »durch die Schärfe des Schwertes«. Im Hebräischen steht »durch den Mund des Schwertes«, eine feste Wendung für Niederlage oder Tötung im bewaffneten Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: besiegte
  rationale: Das Verb חָלַשׁ kann hier »schwächen«, »überwältigen« oder »besiegen« bedeuten. Im Zusammenhang der Schlacht gibt »besiegte« den militärischen Erfolg natürlich wieder, ohne eine vollständige Vernichtung auszusagen.
- source_word: יְהוֹשֻׁעַ
  choice: Josua
  rationale: Der Personenname wird gemäß der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Eigenname bezeichnet hier Amalek beziehungsweise die unter diesem Namen auftretende Streitmacht; die singularische Form des Hebräischen bleibt erhalten.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: עַם bedeutet gewöhnlich »Volk«. Im Schlachtzusammenhang sind besonders die Kämpfer gemeint, doch »sein Volk« bewahrt die Ausdrucksweise des Hebräischen.
- source_word: לְפִי חָרֶב
  choice: mit dem Schwert
  rationale: Die Wendung bedeutet wörtlich »durch den Mund des Schwertes« und bezeichnet eine Niederlage im bewaffneten Kampf. »Mit dem Schwert« gibt das Idiom in modernem Deutsch klar wieder; die wörtlichere Bildsprache wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah am hebräischen Satzbau, löst das für heutige Leser unverständliche Idiom jedoch im Haupttext natürlich auf.
