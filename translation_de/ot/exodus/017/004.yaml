source:
  edition: WLC
  text: וַ/יִּצְעַ֤ק מֹשֶׁה֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָ/עָ֣ם הַ/זֶּ֑ה ע֥וֹד מְעַ֖ט וּ/סְקָלֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: de
  text: 'Da schrie Mose zu Jahwe: „Was soll ich mit diesem Volk tun? Nur noch ein wenig[a], dann steinigen sie mich!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Noch ein Weniges, und sie werden mich steinigen.“ Die Formulierung bezeichnet eine unmittelbar bevorstehende Gefahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: schrie
  rationale: צעק bezeichnet hier einen dringlichen Hilferuf aus Bedrängnis; „schrie“ gibt die Intensität knapp und natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: לֵאמֹר
  choice: Direkte Rede nach Doppelpunkt
  rationale: Die hebräische Redeeinleitung lässt sich im modernen Deutschen natürlicher durch einen Doppelpunkt als durch ein zusätzliches „und sagte“ ausdrücken.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: Was soll ich mit diesem Volk tun?
  rationale: Die Wendung fragt dringlich danach, wie Mose diesem Volk gegenüber handeln soll; „mit diesem Volk tun“ ist im Deutschen idiomatisch und bewahrt den deliberativen Sinn.
- source_word: עֹוד מְעַט
  choice: Nur noch ein wenig
  rationale: Die Formulierung bleibt nahe am hebräischen Ausdruck „noch ein Weniges“ und signalisiert, dass die Gewalttat unmittelbar bevorsteht.
- source_word: וּסְקָלֻנִי
  choice: dann steinigen sie mich
  rationale: סקל bezeichnet das Bewerfen beziehungsweise Töten mit Steinen. Im Zusammenhang mit עֹוד מְעַט hat die Form unmittelbar bevorstehende Bedeutung; das deutsche Präsens wirkt hier natürlich und eindringlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der gängigen deutschen Form, ohne ihn durch einen Hoheitstitel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Dringlichkeit des Hilferufs und die knappe, zugespitzte Form der direkten Rede bleiben erhalten.
