base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: de
  text: Siehe, ich werde dort vor dir auf dem Felsen am Horeb stehen[a]. Du sollst auf den Felsen schlagen; dann wird Wasser aus ihm herauskommen, und das Volk wird trinken. Mose tat es so vor den Augen der Ältesten Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, ich stehe dort vor dir auf dem Felsen am Horeb.“ Das hebräische Partizip kann auch präsentisch wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Die feierliche, Aufmerksamkeit weckende göttliche Selbstankündigung wird bewahrt; „Siehe“ ist im heutigen Deutsch gehoben, aber weiterhin verständlich.
- source_word: עֹמֵד
  choice: ich werde … stehen
  rationale: Das Partizip bezeichnet hier im Ablauf der Anweisung am natürlichsten eine unmittelbar bevorstehende Handlung. Die mögliche präsentische Wiedergabe wird in der Fußnote erhalten.
- source_word: לְפָנֶיךָ
  choice: vor dir
  rationale: Die knappe deutsche Entsprechung gibt die räumliche Stellung gegenüber Mose wieder, ohne zusätzliche Deutung einzutragen.
- source_word: הַצּוּר
  choice: der Felsen
  rationale: „Felsen“ bezeichnet passend eine Felsmasse und ermöglicht die Wiederholung desselben Ausdrucks im Vers.
- source_word: בְּחֹרֵב
  choice: am Horeb
  rationale: Bei dieser Ortsbezeichnung ist „am Horeb“ im Deutschen idiomatisch und räumlich offen genug.
- source_word: וְהִכִּיתָ
  choice: du sollst … schlagen
  rationale: Die Form hat im Anweisungskontext auffordernde Kraft. „Schlagen“ bewahrt die Stärke des Verbs.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: dann wird Wasser aus ihm herauskommen
  rationale: Die Formulierung gibt das Herauskommen des Wassers direkt wieder; „fließen“ würde ein nicht ausdrücklich genanntes Bild ergänzen.
- source_word: וְשָׁתָה הָעָם
  choice: und das Volk wird trinken
  rationale: Die einfache Zukunfts- beziehungsweise Folgeaussage erhält den hebräischen Ablauf, ohne sie ausdrücklich als Zweckangabe auszulegen.
- source_word: וַיַּעַשׂ כֵּן
  choice: Mose tat es … genauso
  rationale: Natürliche deutsche Wiedergabe der hebräischen Erfüllungsformel.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die Wendung bewahrt den Nachdruck auf der sichtbaren, öffentlich bezeugten Handlung.
theological_decisions:
- issue: Zeitbezug der göttlichen Selbstankündigung mit einem Partizip
  choice: ich werde dort vor dir … stehen
  alternative: ich stehe dort vor dir …
  rationale: Der Anweisungskontext legt eine unmittelbar bevorstehende Handlung nahe; da das hebräische Partizip auch präsentisch verstanden werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengelegt.
- issue: Bezug der Ortsangabe auf Gottes Stehen
  choice: Gott wird vor Mose dort auf dem Felsen am Horeb stehen
  alternative: Gott wird dort vor Mose bei dem Felsen am Horeb stehen
  rationale: Die Syntax verbindet „auf dem Felsen am Horeb“ am natürlichsten mit Gottes Stehen. Die auffällige Aussage wird nicht abgeschwächt oder theologisch weiter ausgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ erhält den feierlichen deiktischen Ton; der übrige Satzbau bleibt klar und gegenwärtig. Die Wiederholung von „Felsen“ und die sichtbare Zeugenschaft der Ältesten werden bewahrt.
