base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: de
  text: Doch Moses’ Hände wurden schwer. Da nahmen sie einen Stein, legten ihn unter ihn und er setzte sich darauf. Aaron und Hur stützten seine Hände, der eine auf dieser, der andere auf jener Seite. So blieben seine Hände fest[a], bis die Sonne unterging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beständig“ beziehungsweise „standhaft“. Das hebräische Nomen kann auch „Zuverlässigkeit“ oder „Treue“ bedeuten; hier bezeichnet es im unmittelbaren Zusammenhang die feste, gleichbleibende Haltung von Moses’ Händen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה
  choice: Moses’ Hände
  rationale: יָד bezeichnet wörtlich die Hand; die Wiederholung von „Hände“ bewahrt das konkrete Leitbild des Verses.
- source_word: כְּבֵדִים
  choice: wurden schwer
  rationale: Das Adjektiv bedeutet „schwer“ und beschreibt im Zusammenhang die zunehmende körperliche Ermüdung, ohne sie paraphrasierend vorwegzunehmen.
- source_word: וַיִּקְחוּ
  choice: Da nahmen sie
  rationale: Die dritte Person Plural lässt das Subjekt ungenannt. „Sie“ bewahrt diese Unbestimmtheit, auch wenn der Zusammenhang Aaron und Hur nahelegt.
- source_word: אֶבֶן
  choice: einen Stein
  rationale: אֶבֶן ist das gewöhnliche Wort für „Stein“ und passt zu dem Gegenstand, der Mose als Sitz dient.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: legten ihn unter ihn
  rationale: Die Formulierung gibt die Platzierung des Steins unter Mose direkt wieder; der folgende Satz erklärt, dass er sich daraufsetzt.
- source_word: וַיֵּשֶׁב עָלֶיהָ
  choice: er setzte sich darauf
  rationale: Im Deutschen bezeichnet „sich daraufsetzen“ die natürliche Abfolge der Handlung klarer als ein statisches „darauf sitzen“.
- source_word: תָּמְכוּ בְיָדָיו
  choice: stützten seine Hände
  rationale: תמך bedeutet stützen oder aufrechterhalten. Die Wiedergabe wahrt sowohl die körperliche Hilfe als auch das wiederholte Wort „Hände“.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: einer auf dieser, einer auf jener Seite
  rationale: Die distributive Formulierung und die anschauliche Gegenüberstellung beider Seiten bleiben erhalten.
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: So blieben seine Hände fest
  rationale: אֱמוּנָה kann Festigkeit, Beständigkeit, Zuverlässigkeit oder Treue bezeichnen. Im unmittelbaren körperlichen Zusammenhang ist „fest“ natürlich, ohne den weiteren Bedeutungsraum ganz zu verdecken.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: bis die Sonne unterging
  rationale: Dies ist eine natürliche deutsche Wiedergabe der hebräischen Konstruktion „bis zum Kommen/Untergehen der Sonne“.
theological_decisions:
- issue: Bedeutung von אֱמוּנָה in Bezug auf Moses Hände
  choice: körperliche Festigkeit bzw. Beständigkeit
  alternative: Treue, Zuverlässigkeit oder Standhaftigkeit
  rationale: Die Ermüdung Moses und die körperliche Stütze durch Aaron und Hur sprechen unmittelbar von der stabilen Haltung seiner Hände. Die Fußnote hält zugleich den weiteren, auch theologisch bedeutsamen Bedeutungsraum des Nomens offen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit kurzer, klarer Satzfolge. Die konkrete hebräische Bildsprache („Hände wurden schwer“, „Stein“, „fest“) bleibt erhalten; weder die unbestimmte Mehrzahl „sie“ noch die Bedeutungsbreite von אֱמוּנָה wird stillschweigend vereindeutigt.
