source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: de
  text: Die ganze Gemeinschaft der Israeliten brach aus der Wüste Sin auf, Etappe um Etappe nach Jahwes Weisung,[a] und schlug in Refidim ihr Lager auf. Doch das Volk hatte kein Wasser zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach dem Mund Jahwes“; eine hebräische Redewendung für das Handeln nach seiner Weisung oder seinem Befehl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: brach … auf und zog … weiter
  rationale: נסע bezeichnet im Kontext der Wüstenwanderung das Abbrechen des Lagers und den anschließenden Aufbruch. Die zweiteilige deutsche Formulierung gibt diesen Bewegungsvorgang natürlich wieder.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die ganze Gemeinschaft der Israeliten
  rationale: עֵדָה bezeichnet hier das Volk als zusammengehörige Gemeinschaft. „Israeliten“ gibt die feste hebräische Wendung בְּנֵי יִשְׂרָאֵל im heutigen Deutsch natürlich und inklusiv wieder.
- source_word: מִמִּדְבַּר סִין
  choice: aus der Wüste Sin
  rationale: מִדְבָּר kann „Wüste“ oder „Wildnis“ bedeuten; für dieses geografische Gebiet ist „Wüste“ im Deutschen klar und üblich. Sin bleibt als Ortsname unübersetzt.
- source_word: לְמַסְעֵיהֶם
  choice: etappenweise
  rationale: מַסָּע bezeichnet eine Reiseetappe beziehungsweise einen Aufbruch von einem Lagerplatz. „Etappenweise“ drückt die Abfolge mehrerer Wegabschnitte knapp und idiomatisch aus.
- source_word: עַל פִּי יְהוָה
  choice: wie Jahwe es befohlen hatte
  rationale: Die Wendung bedeutet wörtlich „nach dem Mund Jahwes“, ist hier jedoch ein Idiom für das Handeln auf seinen Befehl oder seine Weisung hin. Die gewählte Formulierung macht dies in natürlichem Deutsch deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen etablierte Form der wissenschaftlichen Umschrift.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: Sie schlugen ihr Lager in Refidim auf
  rationale: חנה bezeichnet das Lagern beziehungsweise Aufschlagen eines Lagers. „In Refidim“ gibt den Ort des Lagerplatzes natürlich wieder.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: doch es gab kein Wasser, das das Volk trinken konnte
  rationale: „Doch“ bringt den im Zusammenhang liegenden Gegensatz zur planmäßigen Ankunft zum Ausdruck. Der Relativsatz ist im Deutschen natürlich und bewahrt den Sinn, dass dem Volk kein Trinkwasser zur Verfügung stand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ bewahrt diese Funktion, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Leitung der Reise
  choice: wie Jahwe es befohlen hatte
  alternative: nach dem Wort Jahwes
  rationale: עַל־פִּי bezeichnet hier eine maßgebliche Weisung. „Befohlen“ wahrt die Autorität der göttlichen Leitung, ohne über den Text hinaus festzulegen, auf welche Weise der Befehl vermittelt wurde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Gemeinschaft“ vermeidet einen ausschließlich kultischen Klang von „Gemeinde“, während „Israeliten“ die gesamte Volksgemeinschaft natürlich bezeichnet. Die zwei hebräischen Hauptsätze werden zur besseren Lesbarkeit auf zwei deutsche Sätze verteilt.
