revisions:
- from: Die ganze Gemeinschaft der Israeliten brach aus der Wüste Sin auf und zog etappenweise weiter, wie Jahwe es befohlen hatte.[a] Sie schlugen ihr Lager in Refidim auf, doch es gab kein Wasser, das das Volk trinken konnte.
  to: Die ganze Gemeinschaft der Israeliten brach aus der Wüste Sin auf, Etappe um Etappe nach Jahwes Weisung,[a] und schlug in Refidim ihr Lager auf. Doch das Volk hatte kein Wasser zu trinken.
  rationale: Die Überarbeitung erhält Inhalt, Erzählregister und Satzgliederung des Entwurfs, formuliert das hebräische Leitungsidiom unmittelbarer und ersetzt die unidiomatische Wasserformulierung durch eine natürliche deutsche Entsprechung. Der Fußnotenanker bleibt an der idiomatischen Wiedergabe von עַל־פִּי יְהוָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des Hebräischen zutreffend wieder: die gesamte israelitische Gemeinschaft, den Aufbruch aus der Wüste Sin, die Reise in Etappen, die Leitung durch Jahwes Weisung, das Lager in Refidim und den Wassermangel. Die Wiedergabe von יְהוָה als „Jahwe“ ist korrekt und konsistent. „Wie Jahwe es befohlen hatte“ ist sinngemäß möglich, aber „nach Jahwes Weisung“ bildet עַל־פִּי יְהוָה unmittelbarer und ohne die im Deutschen stärker vergangenheitsbezogene Nuance des Plusquamperfekts ab.'
  naturalness: Die Formulierung „es gab kein Wasser, das das Volk trinken konnte“ ist verständlich, aber weniger idiomatisch und kann den Eindruck einer Fähigkeitseinschränkung erwecken. „Das Volk hatte kein Wasser zu trinken“ ist im modernen Standarddeutsch natürlicher und gibt die hebräische Zweckangabe präzise wieder. „Etappe um Etappe“ ist eine flüssige, verständliche Wiedergabe von לְמַסְעֵיהֶם.
  terminology: „Gemeinschaft der Israeliten“, „Wüste Sin“, „Jahwe“ und „Refidim“ sind angemessen. „Weisung“ deckt die autoritative, aber in ihrer genauen Form nicht näher bestimmte Bedeutung des Idioms עַל־פִּי יְהוָה gut ab und vermeidet eine unnötige Festlegung auf einen ausdrücklich formulierten Befehl.
  issues:
  - severity: low
    issue: Die Wendung „wie Jahwe es befohlen hatte“ ist etwas stärker interpretierend als nötig.
    rationale: עַל־פִּי יְהוָה bedeutet idiomatisch „nach/auf Weisung Jahwes“. Eine nominale Wiedergabe folgt dem hebräischen Ausdruck enger und vermeidet die zusätzliche zeitliche Nuance von „hatte“.
  - severity: medium
    issue: „Kein Wasser, das das Volk trinken konnte“ ist im Deutschen stilistisch und semantisch weniger präzise.
    rationale: Der hebräische Text besagt, dass kein Wasser zum Trinken für das Volk vorhanden war, nicht primär, dass das Volk zu einer Trinkhandlung unfähig war. „Das Volk hatte kein Wasser zu trinken“ gibt den Mangel idiomatisch wieder.
  revised_text: Die ganze Gemeinschaft der Israeliten brach aus der Wüste Sin auf, Etappe um Etappe nach Jahwes Weisung,[a] und schlug in Refidim ihr Lager auf. Doch das Volk hatte kein Wasser zu trinken.
  revised_footnotes:
