  text: וַ/יָּבֹ֖א עֲמָלֵ֑ק וַ/יִּלָּ֥חֶם עִם יִשְׂרָאֵ֖ל בִּ/רְפִידִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/008.yaml
  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: de
  text: Da kam Amalek und kämpfte bei Refidim gegen Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da kam“ gibt die zeitliche Abfolge in natürlichem, knappem Deutsch wieder.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Der Eigenname wird in der im Deutschen üblichen biblischen Form wiedergegeben und bezeichnet hier kollektiv das amalekitische Volk.
- source_word: וַיִּלָּחֶם
  choice: kämpfte
  rationale: Der Niphal von לחם bedeutet hier „kämpfen“ beziehungsweise „in den Kampf treten“; „kämpfte“ passt zum schlichten Erzählstil.
- source_word: עִם
  choice: gegen
  rationale: עִם bedeutet wörtlich „mit“, bezeichnet bei einem Kampf jedoch die gegnerische Partei. Im Deutschen drückt „gegen Israel kämpfen“ den gemeinten adversativen Sinn eindeutig und idiomatisch aus.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Die übliche deutsche Form des Namens für das Volk Israel.
- source_word: בִּרְפִידִם
  choice: bei Refidim
  rationale: Die Präposition בְּ markiert den Ort. „Bei Refidim“ ist für einen Lager- oder Schauplatz natürlich und bewahrt, dass nicht zwingend eine Stadt als umschlossener Ort gemeint ist.
theological_decisions: []
translation_notes:
  register: Knappes, modernes Standarddeutsch mit würdigem Erzählton. Die Satzfolge und die kollektive Verwendung von „Amalek“ bleiben erhalten; die Kampfbeziehung wird im Deutschen idiomatisch mit „gegen“ ausgedrückt.
