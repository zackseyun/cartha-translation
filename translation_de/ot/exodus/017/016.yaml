source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר כִּֽי יָד֙ עַל כֵּ֣ס יָ֔הּ מִלְחָמָ֥ה לַ/יהוָ֖ה בַּֽ/עֲמָלֵ֑ק מִ/דֹּ֖ר דֹּֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: de
  text: 'Und er sagte: »Eine Hand ist auf dem Thron Jahs[a]. Jahwe führt Krieg gegen Amalek von Generation zu Generation.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig und elliptisch, wörtlich: »Eine Hand auf dem Thron Jahs.« Möglich ist auch: »Eine Hand gegen den Thron Jahs«; weniger wahrscheinlich wird כֵּס als »Banner« verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Gibt die erzählende Wayyiqtol-Fortsetzung wieder; das im Hebräischen nur implizite männliche Subjekt bleibt als Pronomen stehen.
- source_word: כִּי
  choice: durch die Einleitung der direkten Rede wiedergegeben
  rationale: Die Partikel führt hier den Inhalt der Rede ein. Ein ausdrückliches „denn“ oder „weil“ würde den schwierigen syntaktischen Zusammenhang stärker festlegen, als der hebräische Text erlaubt.
- source_word: יָד
  choice: Eine Hand
  rationale: Das Substantiv steht ohne Artikel. Die unbestimmte Wiedergabe bewahrt zudem die Ellipse und legt nicht fest, wessen Hand gemeint ist.
- source_word: עַל
  choice: auf
  rationale: Dies ist die naheliegende räumliche Bedeutung. Die mögliche adversative Deutung „gegen“ wird in der Fußnote genannt.
- source_word: כֵּס
  choice: Thron
  rationale: Die ungewöhnliche Form wird am wahrscheinlichsten als verkürzte beziehungsweise defektive Form zu כִּסֵּא verstanden. „Banner“ ist lexikalisch weniger wahrscheinlich.
- source_word: יָהּ
  choice: Jah
  rationale: Bewahrt die Kurzform des Gottesnamens und unterscheidet sie von יהוה im folgenden Satzteil.
- source_word: מִלְחָמָה לַיהוָה
  choice: Jahwe führt Krieg
  rationale: Die deutsche Verbalkonstruktion gibt die nominale Aussage idiomatisch wieder, ohne die fortdauernde Feindschaft zu verwischen.
- source_word: בַּעֲמָלֵק
  choice: gegen Amalek
  rationale: ב bezeichnet hier den Gegner in einer kriegerischen Auseinandersetzung; im Deutschen ist „Krieg gegen“ die natürliche Formulierung.
- source_word: מִדֹּר דֹּר
  choice: von Generation zu Generation
  rationale: Entspricht transparent dem hebräischen Idiom für eine über aufeinanderfolgende Generationen fortdauernde Wirklichkeit.
theological_decisions:
- issue: Wiedergabe von יָהּ und יהוה im selben Vers
  choice: יָהּ als „Jah“ und יהוה als „Jahwe“
  alternative: Beide Namen als „der HERR“ wiedergeben
  rationale: Die unterschiedlichen Formen des Gottesnamens im Ausgangstext bleiben sichtbar; insbesondere wird die Kurzform יָהּ nicht mit dem Tetragramm gleichgesetzt.
- issue: Die schwierige Ellipse כִּי יָד עַל כֵּס יָהּ
  choice: „Eine Hand ist auf dem Thron Jahs“ mit Fußnote
  alternative: „Eine Hand ist gegen den Thron Jahs“ oder „Eine Hand ist auf dem Banner Jahs“
  rationale: Die Hauptfassung folgt den naheliegenden lexikalischen Bedeutungen und wahrt die Kürze des Hebräischen. Da Syntax und Aussage umstritten sind, werden mögliche andere Deutungen nicht stillschweigend ausgeschlossen.
- issue: Zeit- und Aktionswert von מִלְחָמָה לַיהוָה
  choice: „Jahwe führt Krieg“
  alternative: „Jahwe wird Krieg führen“ oder „Jahwe hat Krieg“
  rationale: Das Hebräische ist ein verbloser Nominalsatz. Das deutsche Präsens kann die im Kontext dauerhaft geltende Feindschaft ausdrücken, ohne eine im Ausgangstext nicht markierte Futurform einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, rätselhafte Form des ersten Ausspruchs wird bewusst bewahrt; die zweite Aussage wird für natürliches Deutsch verbal formuliert.
