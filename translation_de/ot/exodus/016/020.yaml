base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/020.yaml
  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: de
  text: Doch sie hörten nicht auf Mose[a]. Einige Männer ließen etwas davon bis zum Morgen übrig; da entstanden Würmer darin, und es stank[b]. Mose wurde zornig auf sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beachteten Mose nicht“. Die hebräische Wendung kann ein Nicht-Hören bezeichnen, das Ungehorsam einschließt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Würmer entstanden darin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: hörten nicht auf Mose
  rationale: שׁמע mit אֶל bedeutet hier, auf jemanden zu hören bzw. ihn zu beachten. Die Wendung bewahrt den Bezug zum Hören und lässt die im Kontext erkennbare Ungehorsamkeit mitschwingen.
- source_word: וַיּוֹתִרוּ אֲנָשִׁים מִמֶּנּוּ
  choice: Einige Männer ließen etwas davon … übrig
  rationale: יתר im Hifil bezeichnet das Übriglassen; אֲנָשִׁים ist ausdrücklich maskulin plural und bezeichnet hier eine unbestimmte Teilgruppe.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Natürliche und genaue Wiedergabe der Zeitangabe.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: da entstanden Würmer darin
  rationale: Die ungewöhnliche Verbindung beschreibt, dass sich in dem aufbewahrten Manna Würmer bildeten. Die Wiedergabe ist verständlich und bleibt näher am Bild des hebräischen Ausdrucks als eine kausativ wirkende Formulierung.
- source_word: וַיִּבְאַשׁ
  choice: es stank
  rationale: Direkte, anschauliche Wiedergabe des Verbs für übel riechen oder stinken.
- source_word: וַיִּקְצֹף עֲלֵהֶם מֹשֶׁה
  choice: Mose wurde zornig auf sie
  rationale: קצף bezeichnet starken Ärger oder Zorn; die deutsche Konstruktion „zornig auf“ gibt auch die Relation von עַל natürlich wieder.
theological_decisions:
- issue: Bedeutungsumfang von שׁמע אֶל
  choice: hörten nicht auf Mose
  alternative: gehorchten Mose nicht
  rationale: Die Hauptfassung bewahrt die hebräische Hörmetaphorik und zugleich den kontextuellen Sinn mangelnder Befolgung, ohne die Aussage ausdrücklich auf „gehorchen“ festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze bilden den lebhaften hebräischen Erzählstil natürlich ab; „Männer“ wahrt die ausdrücklich maskuline Form des Ausgangstextes.
