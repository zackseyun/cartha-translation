source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: de
  text: 'Dies ist, was Jahwe geboten hat: »Sammelt davon, jeder so viel, wie er zum Essen braucht: ein Omer für jeden Menschen[a], entsprechend eurer Personenzahl. Jeder soll davon für die nehmen, die in seinem Zelt sind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Omer pro Kopf«.'
    reason: Die Fußnote bewahrt die konkrete Ausdrucksweise von לַגֻּלְגֹּלֶת, während der Haupttext ihre gemeinte Zählbedeutung natürlich wiedergibt.
lexical_decisions:
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Dies ist, was … geboten hat
  rationale: Die deutsche Formulierung gibt die hebräische Befehlsformel natürlich wieder. הַדָּבָר bezeichnet hier den ausgesprochenen Inhalt des Gebots; ein wörtliches „Dies ist das Wort“ wäre im heutigen Deutsch unnötig steif.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen etablierte Umschrift.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Sammelt davon
  rationale: לקט bezeichnet das Auflesen oder Einsammeln von Nahrungsmitteln; „davon“ bezieht sich im Zusammenhang auf das Manna.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: jeder so viel, wie er zum Essen braucht
  rationale: Die distributive Bedeutung von אִישׁ bleibt mit „jeder“ erhalten. Die wörtliche Wendung „nach Maß seines Essens“ wird idiomatisch als benötigte Essensmenge ausgedrückt, ohne eine feste, für alle gleiche Menge zu unterstellen.
- source_word: עֹמֶר
  choice: ein Omer
  rationale: Omer ist eine bestimmte antike Trockenmaßeinheit. Die Umschrift vermeidet eine unsichere Umrechnung in moderne Maße.
- source_word: לַגֻּלְגֹּלֶת
  choice: für jeden Menschen
  rationale: Wörtlich steht „pro Kopf“. Gemeint ist die Zählung einzelner Personen; die natürliche Bedeutung steht im Text, die konkrete hebräische Ausdrucksweise in der Fußnote.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: entsprechend der Zahl der Personen bei euch
  rationale: נֶפֶשׁ bezeichnet hier zählbare Personen, nicht eine vom Körper getrennte „Seele“. „Bei euch“ wahrt den Bezug der zweiten Person Plural, ohne den deutschen Ausdruck „eurer Personen“ zu erzwingen.
- source_word: אִישׁ לַאֲשֶׁר בְּאָהֳלוֹ תִּקָּחוּ
  choice: Jeder soll für die nehmen, die in seinem Zelt sind
  rationale: Die Übersetzung bewahrt das konkrete Zeltbild und den distributiven Singular. Sie legt nicht enger fest, ob ausschließlich Familien- beziehungsweise Haushaltsmitglieder gemeint sind.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname Gottes. Die Wiedergabe „Jahwe“ bewahrt ihn als Namen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Bedeutung von נֶפֶשׁ in einer Zählformel
  choice: Personen
  alternative: Seelen
  rationale: Der Kontext zählt die Menschen, für die Manna gesammelt werden soll. „Seelen“ könnte im Deutschen eine hier nicht ausgedrückte anthropologische Trennung nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Der Satzbau ist lesbar gehalten, bewahrt aber die wiederholte distributive Anweisung „jeder“. Das konkrete „Zelt“ bleibt stehen; eine vereindeutigende Auslegung als „Haushalt“ wurde vermieden.
