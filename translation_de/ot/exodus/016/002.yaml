  text: ו/ילינו כָּל עֲדַ֧ת בְּנֵי יִשְׂרָאֵ֛ל עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/002.yaml
  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: de
  text: Und die ganze Gemeinde der Israeliten[a] murrte gegen Mose und Aaron in der Wüste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“; traditionell: „der Kinder Israels“.'
    reason: Die Fußnote dokumentiert die formale hebräische Wendung בְּנֵי יִשְׂרָאֵל, während der Haupttext ihre korporative Bedeutung im modernen Deutschen wiedergibt.
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: murrte
  rationale: Das Verb לוּן bezeichnet hier das unzufriedene, gemeinschaftliche Aufbegehren gegen die Führenden. „Murrte“ gibt diesen negativen Sinn prägnant und in bibelsprachlich vertrautem, weiterhin verständlichem Deutsch wieder.
- source_word: כָּל עֲדַת
  choice: die ganze Gemeinde
  rationale: כָּל betont die Gesamtheit, während עֵדָה die als Gemeinschaft versammelte Körperschaft bezeichnet. „Die ganze Gemeinde“ bewahrt sowohl den kollektiven als auch den umfassenden Sinn.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  rationale: Die Wiedergabe bildet die maskuline hebräische Fügung formal ab und lässt zugleich durch eine Fußnote erkennen, dass sie als Bezeichnung des Volkes Israel gebraucht wird.
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: gegen Mose und Aaron
  rationale: עַל bezeichnet in diesem Beschwerdekontext die Personen, gegen die sich das Murren richtet. „Gegen“ gibt die oppositionelle Bedeutung natürlich wieder.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, unwirtliches Land. „Wüste“ ist im Deutschen die geläufige und kontextgerechte Wiedergabe, ohne auf eine reine Sandwüste beschränkt zu sein.
theological_decisions:
- issue: Wiedergabe der korporativen Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: der Söhne Israels
  alternative: der Israeliten / der Kinder Israels
  rationale: Die Hauptlesart bewahrt die grammatisch maskuline Form des Hebräischen. Die Fußnote macht deutlich, dass die Wendung zugleich als korporative Volksbezeichnung verstanden werden kann, ohne diese Spannung im Haupttext stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderater Nähe zur vertrauten Bibelsprache. Die Satzstellung ist natürlich; „murrte“ und „Gemeinde“ bewahren den erzählerischen und gemeinschaftlichen Charakter des Ausgangstextes.
