  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: de
  text: 'Und Mose sagte: „Wenn Jahwe euch am Abend Fleisch zu essen und am Morgen Brot gibt, bis ihr satt seid, weil Jahwe euer Murren hört, mit dem ihr gegen ihn murrt[a] – was sind wir? Euer Murren richtet sich nicht gegen uns, sondern gegen Jahwe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen stehen „euer Murren“ und „ihr murrt“ als Substantiv und stammverwandtes Verb nebeneinander; die Wiederholung verstärkt den Vorwurf.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתֵת
  choice: Wenn ... gibt
  rationale: Die Präposition ב mit dem Infinitivus constructus bezeichnet hier einen zeitlichen Umstand; die Wiedergabe ist im Deutschen natürlich und lässt den vorausblickenden Charakter der Aussage erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּשָׂר
  choice: Fleisch
  rationale: Im Speisekontext ist „Fleisch“ die natürliche und konkrete deutsche Entsprechung.
- source_word: לֶחֶם
  choice: Brot
  rationale: Die konkrete Grundbedeutung passt zum Kontext und bleibt gegenüber dem allgemeineren „Nahrung“ erhalten.
- source_word: לִשְׂבֹּעַ
  choice: bis ihr satt seid
  rationale: Die Form bezeichnet Sättigung; diese idiomatische Wendung vermittelt den Sinn klar und natürlich.
- source_word: בִּשְׁמֹעַ
  choice: weil ... hört
  rationale: 'Der Infinitiv mit ב hat im Satzgefüge am ehesten begründende Kraft: Jahwes Versorgung erfolgt angesichts des von ihm gehörten Murrens.'
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: euer Murren ... mit dem ihr ... murrt
  rationale: „Murren“ bewahrt die Wortstammwiederholung von Substantiv und verwandtem Verb sowie den vorwurfsvollen Ton des Wüstenmotivs.
- source_word: עָלָיו
  choice: gegen ihn
  rationale: Die Präposition bezeichnet hier die feindselige Zielrichtung der Klage.
- source_word: וְנַחְנוּ מָה
  choice: was sind wir schon?
  rationale: „Was“ bewahrt die hebräische Formulierung und betont die geringe Bedeutung von Mose und Aaron als Ziel des Murrens; „schon“ macht diese pragmatische Nuance im Deutschen hörbar.
- source_word: לֹא עָלֵינוּ תְלֻנֹּתֵיכֶם כִּי עַל יְהוָה
  choice: Euer Murren richtet sich nicht gegen uns, sondern gegen Jahwe
  rationale: Das ergänzte Verb „richtet sich“ ergibt einen klaren deutschen Satz; „sondern“ bringt den hebräischen Kontrast präzise zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namenscharakter, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug des Murrens
  choice: Das gegen Mose und Aaron gerichtete Murren richtet sich letztlich gegen Jahwe
  alternative: Das Murren betrifft lediglich Mose und Aaron als menschliche Leiter
  rationale: Der Vers zieht selbst den ausdrücklichen Gegensatz „nicht gegen uns, sondern gegen Jahwe“; die Übersetzung erhält diese theologische Zuspitzung, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax wurde für gute Verständlichkeit geglättet, während der Gottesname, die konkrete Speisesprache, die rhetorische Frage und die betonte Wortwiederholung beim Murren erhalten bleiben.
