base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: de
  text: Wie Yahweh Mose geboten hatte, so legte Aaron es vor dem Zeugnis[a] zur Aufbewahrung nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Bundeszeugnis«. Der hebräische Ausdruck »Zeugnis« ist ein Fachbegriff aus dem Zusammenhang des Heiligtums und kann genauer die Bundestafeln oder das bezeichnen, was mit ihnen verbunden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Wie … so
  rationale: Die deutsche Vergleichskonstruktion gibt die Übereinstimmung von göttlichem Gebot und Aarons Ausführung natürlich und präzise wieder.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: „Gebieten“ bewahrt die verbindliche Autorität des göttlichen Befehls; das Plusquamperfekt verdeutlicht im Deutschen, dass das Gebot der Ausführung vorausging.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: Mose
  rationale: Beim deutschen Verb „gebieten“ wird die angesprochene Person idiomatisch ohne die hebräische Präposition wiedergegeben.
- source_word: וַיַּנִּיחֵהוּ
  choice: stellte Aaron es
  rationale: Das Verb bezeichnet hier das Platzieren beziehungsweise Niederlegen des zuvor genannten Gefäßes; „stellte … es“ ist in diesem Zusammenhang klar und natürlich.
- source_word: לִפְנֵי
  choice: vor
  rationale: Bewahrt die räumliche beziehungsweise kultische Beziehung, ohne sie näher zu bestimmen.
- source_word: הָעֵדֻת
  choice: das Zeugnis
  rationale: Die traditionelle technische Bezeichnung bleibt erhalten und legt nicht vorschnell fest, ob speziell die Bundestafeln oder der damit verbundene Heiligtumsbereich gemeint ist.
- source_word: לְמִשְׁמָרֶת
  choice: damit es dort aufbewahrt wurde
  rationale: Gibt den Zweck der Platzierung in natürlichem modernem Deutsch wieder, ohne den im Vers nicht ausdrücklich genannten Gedanken eines Erinnerungszeichens hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt den Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von הָעֵדֻת im Heiligtumskontext
  choice: das Zeugnis
  alternative: das Bundeszeugnis; die Bundestafeln
  rationale: Der technische Ausdruck kann insbesondere auf die Bundestafeln oder auf das mit ihnen verbundene Heiligtumsinventar weisen. Die Hauptübersetzung bewahrt diese Bedeutungsbreite; die Fußnote erläutert die mögliche Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist gut verständlich, behält aber mit „das Zeugnis“ den kultischen Fachbegriff und seine echte Bedeutungsbreite bei.
