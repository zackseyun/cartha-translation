  text: Da ruhte das Volk am siebten Tag[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hörte auf“. Das Verb steht in Zusammenhang mit dem Sabbat; „hielt den Sabbat“ wäre eine interpretierende Erweiterung.'
