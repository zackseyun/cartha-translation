lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: So ruhte
  rationale: Das Qal-Wayyiqtol von שׁבת bezeichnet hier das Aufhören beziehungsweise Ruhen. „Ruhte“ ist im Deutschen natürlich und bewahrt den Bezug zur Sabbatruhe, ohne interpretierend zu „hielt den Sabbat“ zu erweitern. „So“ gibt den folgernden Erzählzusammenhang wieder.
- source_word: הָעָם
  choice: das Volk
  rationale: עָם bezeichnet kollektiv das Volk; „das Volk“ ist im Zusammenhang der Wüstenerzählung die natürliche deutsche Wiedergabe.
- source_word: בַּיּוֹם הַשְּׁבִעִי
  choice: am siebten Tag
  rationale: Die Präposition בְּ bei einer bestimmten Tagesangabe wird idiomatisch mit „an“, zusammengezogen zu „am“, wiedergegeben; das Ordinaladjektiv bestimmt „Tag“.
theological_decisions:
- issue: Soll der Sabbatbezug ausdrücklich in das Verb aufgenommen werden?
  choice: „ruhte“
  alternative: „hörte auf“ oder „hielt den Sabbat“
  rationale: Das hebräische Verb sagt, dass das Volk aufhörte beziehungsweise ruhte. Der Sabbatbezug ergibt sich bereits aus dem Kontext und aus „am siebten Tag“; „hielt den Sabbat“ wäre eine interpretierende Erweiterung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der knappe hebräische Erzählsatz bleibt erhalten; „So“ macht den folgernden Zusammenhang natürlich sichtbar.
