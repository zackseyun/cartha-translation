base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: de
  text: Am sechsten Tag sammelten sie doppelt so viel Brot[a], zwei Omer für jeden. Da kamen alle führenden Männer der Gemeinde und berichteten Mose davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Omer war ein Trockenmaß im alten Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשִּׁשִּׁי
  choice: Am sechsten Tag aber
  rationale: Die hebräische Ereignisformel leitet den nächsten Vorgang ein. Im modernen deutschen Erzählstil gibt „aber“ den Übergang und den auffälligen Gegensatz zu den vorangehenden Tagen natürlich wieder, ohne die archaische Wendung „und es geschah“ zu erzwingen.
- source_word: לָקְטוּ
  choice: sammelten sie
  rationale: לקט bezeichnet hier das Einsammeln des Mannas; „sammeln“ ist unmittelbar und kontextgerecht.
- source_word: לֶחֶם מִשְׁנֶה
  choice: doppelt so viel Brot
  rationale: לֶחֶם bleibt als „Brot“ erhalten, obwohl konkret das Manna gemeint ist. מִשְׁנֶה bezeichnet die doppelte Menge; die gewählte Formulierung ist im Deutschen natürlich und wird durch die folgende Mengenangabe erläutert.
- source_word: שְׁנֵי הָעֹמֶר
  choice: zwei Omer
  rationale: Die antike Maßeinheit wird transliteriert, da eine moderne Umrechnung die im Text gegebene Genauigkeit nur vortäuschen würde.
- source_word: לָאֶחָד
  choice: für jeden
  rationale: 'Wörtlich „für einen“, hier jedoch distributiv gebraucht: zwei Omer je Person. „Für jeden“ gibt diesen Sinn knapp und idiomatisch wieder.'
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: alle führenden Männer der Gemeinde
  rationale: נְשִׂיאִים bezeichnet anerkannte Oberhäupter bzw. Verantwortungsträger; „führende Männer“ gibt die männliche Pluralform und die Funktion wieder. עֵדָה wird in diesem Kontext natürlich mit „Gemeinde“ übersetzt.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: Da kamen ... und berichteten es Mose
  rationale: Die Abfolge beider Verben bleibt erhalten. Das ergänzte „es“ macht im Deutschen deutlich, dass sie Mose den ungewöhnlichen Fund meldeten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die konkrete Bezeichnung „Brot“ und die antike Maßeinheit „Omer“ bleiben erhalten; unnötig archaische Formeln werden vermieden.
