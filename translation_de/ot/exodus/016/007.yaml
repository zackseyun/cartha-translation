  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: de
  text: Und am Morgen werdet ihr die Herrlichkeit Jahwes sehen, weil er euer Murren gegen Jahwe gehört hat.[a] Und was sind wir, dass ihr gegen uns murrt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er euer Murren gegen Jahwe hört“. Die hebräische Konstruktion kann sowohl zeitlich als auch begründend verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֹקֶר
  choice: Und am Morgen
  rationale: Die Konjunktion mit dem Substantiv bezeichnet hier adverbial den Zeitpunkt und führt zugleich den Gedankengang des vorherigen Verses fort.
- source_word: וּרְאִיתֶם
  choice: werdet ihr sehen
  rationale: Die Verbform hat in der Abfolge von Ankündigungen futurischen Sinn; die deutsche Form ist natürlich und präzise.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die machtvoll wahrnehmbare Gegenwart bzw. Erscheinung Gottes; „Herrlichkeit“ bewahrt den theologischen Gehalt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בְּשָׁמְעוֹ
  choice: weil er ... gehört hat
  rationale: Die Präposition ב mit Infinitivus constructus kann kausal oder temporal verstanden werden. Im Zusammenhang erklärt die Wendung am ehesten den Grund für die angekündigte Wahrnehmung der Herrlichkeit; die zeitliche Möglichkeit bleibt in der Fußnote erhalten.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: euer Murren
  rationale: Das Substantiv bezeichnet unzufriedenes, widerstrebendes Klagen. „Murren“ ist im Deutschen treffend, verständlich und ermöglicht den Gleichklang mit dem folgenden Verb.
- source_word: עַל יְהוָה
  choice: gegen Jahwe
  rationale: עַל bezeichnet bei diesem Wortfeld die Richtung des Murrens im Sinne von Widerstand, nicht lediglich dessen Thema.
- source_word: וְנַחְנוּ מָה
  choice: Denn was sind wir
  rationale: Die rhetorische Frage hebt die geringe Bedeutung von Mose und Aaron gegenüber Jahwe hervor. „Denn“ verbindet sie idiomatisch als Begründung mit der vorangehenden Aussage.
- source_word: כִּי תלונו עָלֵינוּ
  choice: dass ihr gegen uns murrt
  rationale: כִּי führt hier den Inhalt bzw. die Folge der rhetorischen Frage ein; die Formulierung wahrt zugleich die lexikalische Verbindung zum vorherigen „Murren“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Kausale oder temporale Bedeutung von בְּשָׁמְעוֹ
  choice: weil er euer Murren ... gehört hat
  alternative: wenn er euer Murren ... hört
  rationale: 'Der Kontext legt eine Begründung nahe: Jahwes Herrlichkeit wird sichtbar, weil er das Murren wahrgenommen hat. Da die hebräische Konstruktion auch temporal gelesen werden kann, wird diese echte Mehrdeutigkeit in einer Fußnote dokumentiert.'
- issue: Bezug des Murrens
  choice: gegen Jahwe; gegen uns
  alternative: über Jahwe; über uns
  rationale: Die Präposition עַל trägt in Verbindung mit dem Murren adversative Kraft. Die parallele Wiedergabe erhält die Aussage, dass das gegen Mose und Aaron gerichtete Murren letztlich Jahwe gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Murren“ bewahrt den negativen Ton sowie die Wortverbindung zwischen Substantiv und Verb. Der Fußnotenmarker steht unmittelbar nach dem Satzteil, auf dessen kausale beziehungsweise temporale Deutung sich die Anmerkung bezieht.
