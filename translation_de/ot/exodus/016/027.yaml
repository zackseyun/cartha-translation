  source_fidelity: Die Übersetzung gibt die hebräische Erzählfolge, die Zeitangabe, die partitive Aussage von מִן־הָעָם, den Zweck des Hinausgehens und das erfolglose Ergebnis zuverlässig wieder. „Einige aus dem Volk“ bringt die im Hebräischen markierte Teilmenge klar zum Ausdruck, ohne den Sinn zu erweitern.
