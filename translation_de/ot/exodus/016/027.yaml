  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י יָצְא֥וּ מִן הָ/עָ֖ם לִ/לְקֹ֑ט וְ/לֹ֖א מָצָֽאוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: de
  text: Und es geschah am siebten Tag, dass einige aus dem Volk hinausgingen, um zu sammeln; doch sie fanden nichts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die übliche hebräische Erzählungsform führt das nächste Geschehen in der Abfolge ein; die deutsche Wendung bewahrt den erzählerischen Anschluss und einen würdigen Ton.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: am siebten Tag
  rationale: Die Zeitangabe wird ohne den im Hebräischen nicht ausdrücklich genannten Zusatz „der Woche“ wiedergegeben.
- source_word: יָצְאוּ
  choice: hinausgingen
  rationale: יצא bezeichnet hier die Bewegung aus dem Lager beziehungsweise Wohnbereich hinaus.
- source_word: מִן הָעָם
  choice: einige aus dem Volk
  rationale: 'Die Präposition מן hat hier partitive Bedeutung: Nicht das gesamte Volk, sondern ein Teil davon handelte.'
- source_word: לִלְקֹט
  choice: um zu sammeln
  rationale: לקט bedeutet „sammeln/auflesen“. Das Manna ist aus dem Zusammenhang als Gegenstand des Sammelns verständlich und wird daher nicht ergänzt.
- source_word: וְלֹא מָצָאוּ
  choice: doch sie fanden nichts
  rationale: Wörtlich steht „und sie fanden nicht“; „doch“ macht den im Zusammenhang liegenden Gegensatz zwischen Absicht und erfolgloser Suche natürlich deutlich, während „nichts“ das im Deutschen nötige Objekt ausdrückt.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die partitive Bedeutung von מִן הָעָם ist im Haupttext natürlich und eindeutig ausgedrückt; daher ist keine Fußnote erforderlich.
