  text: וַ/יְהִ֗י כְּ/דַבֵּ֤ר אַהֲרֹן֙ אֶל כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל וַ/יִּפְנ֖וּ אֶל הַ/מִּדְבָּ֑ר וְ/הִנֵּה֙ כְּב֣וֹד יְהוָ֔ה נִרְאָ֖ה בֶּ/עָנָֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: de
  text: Und es geschah, während Aaron zur ganzen Gemeinde der Israeliten[a] sprach, wandten sie sich der Wüste zu, und siehe, die Herrlichkeit Jahwes erschien in der Wolke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählungsform führt das nächste Geschehen ein. Die Wendung bewahrt diese Funktion und den würdevollen Erzählton, ohne unnötig altertümlich zu wirken.
- source_word: כְּדַבֵּר אַהֲרֹן
  choice: während Aaron … sprach
  rationale: כְּ mit dem Infinitivus constructus bezeichnet hier zeitliche Gleichzeitigkeit; „während“ gibt die Überschneidung der Handlungen klar wieder.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: zur ganzen Gemeinde der Israeliten
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft. „Gemeinde der Israeliten“ ist im Deutschen natürlich und verständlich; die wörtliche Form von בְּנֵי יִשְׂרָאֵל wird in einer Fußnote kenntlich gemacht.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: Sie wandten sich der Wüste zu
  rationale: פנה mit אֶל beschreibt die Hinwendung in eine Richtung. „Sich … zuwenden“ trifft diese Bewegung idiomatisch, ohne eine dauerhafte Blickrichtung zu unterstellen.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: Die Aufmerksamkeitspartikel hebt die überraschende sichtbare Erscheinung hervor. „Siehe“ bewahrt ihre rhetorische Kraft und passt zum würdevollen biblischen Register.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: כָּבוֹד bezeichnet hier die sichtbar hervortretende göttliche Herrlichkeit; der Genitiv wird direkt wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen etablierte Form.
- source_word: נִרְאָה
  choice: erschien
  rationale: Der Nifal von ראה bezeichnet hier das Sichtbarwerden beziehungsweise Erscheinen und wird mit dem idiomatischen deutschen Verb „erscheinen“ wiedergegeben.
- source_word: בֶּעָנָן
  choice: in der Wolke
  rationale: Der Artikel kennzeichnet eine bestimmte Wolke; „in der Wolke“ wahrt diese Bestimmtheit und lässt offen, wie genau sich Herrlichkeit und Wolke räumlich zueinander verhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt den Charakter als Eigenname, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: Israeliten im Haupttext, mit wörtlicher Form in der Fußnote
  alternative: Söhne Israels
  rationale: „Israeliten“ bezeichnet im heutigen Deutsch natürlich das gesamte Volk. Die Fußnote bewahrt zugleich die ausdrücklich verwandtschaftliche Formulierung des Hebräischen, ohne im Haupttext nur männliche Personen nahezulegen.
- issue: Art der sichtbaren Offenbarung
  choice: die Herrlichkeit Jahwes erschien in der Wolke
  alternative: die Herrlichkeit Jahwes wurde in der Wolke gesehen
  rationale: „Erschien“ beschreibt das Sichtbarwerden, ohne näher festzulegen, ob die Herrlichkeit mit der Wolke identisch, von ihr umgeben oder in ihr wahrnehmbar war.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erzählerische Formel „Und es geschah“ und die Aufmerksamkeitspartikel „siehe“ bewahren den feierlichen Charakter des hebräischen Textes; die übrige Syntax bleibt klar und gegenwärtig verständlich.
