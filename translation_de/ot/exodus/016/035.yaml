  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: de
  text: Und die Israeliten[a] aßen vierzig Jahre lang das Manna, bis sie in ein bewohntes Land[b] kamen. Sie aßen das Manna, bis sie an die Grenze[c] des Landes Kanaan kamen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die Söhne Israels«; eine feste Bezeichnung für das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in besiedeltes Land«; gemeint ist Land, das im Gegensatz zur Wüste bewohnt oder besiedelt ist.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »an den Rand des Landes Kanaan«; das hebräische Wort kann »Ende«, »Rand« oder »Grenze« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Und die Israeliten
  rationale: Die hebräische Wendung bedeutet wörtlich »die Söhne Israels«, dient hier aber als feste Bezeichnung für das ganze Volk. »Die Israeliten« gibt diesen umfassenden Sinn im heutigen Deutsch natürlich und präzise wieder; das einleitende וּ wird mit »Und« wiedergegeben.
- source_word: אָכְלוּ
  choice: aßen
  rationale: Das Qal Perfekt fasst rückblickend einen lang andauernden Vorgang zusammen. Das deutsche Präteritum passt zu diesem erzählenden Rückblick.
- source_word: הַמָּן
  choice: das Manna
  rationale: Der bestimmte Artikel des Hebräischen wird beibehalten; »Manna« ist die etablierte deutsche Bezeichnung.
- source_word: אַרְבָּעִים שָׁנָה
  choice: vierzig Jahre lang
  rationale: »Lang« macht die Zeitdauer im Deutschen idiomatisch deutlich, ohne den Inhalt zu erweitern.
- source_word: עַד בֹּאָם
  choice: bis sie … kamen
  rationale: Die Verbindung aus עַד und Infinitiv mit Suffix bezeichnet die zeitliche Grenze. »Bis sie kamen« bleibt näher am allgemeinen Verb בוא als das stärker deutende »bis sie einzogen«.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: in bewohntes Land
  rationale: Das Niphal-Partizip von ישׁב bezeichnet bewohntes beziehungsweise besiedeltes Land und bildet den Gegensatz zur Wüste.
- source_word: אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: an die Grenze des Landes Kanaan
  rationale: קְצֵה kann Ende, Rand oder Grenze bezeichnen. Im geografischen Zusammenhang ist »Grenze« eine natürliche Wiedergabe, wobei die Alternative »Rand« in einer Fußnote erhalten bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Sie aßen das Manna« bleibt als bewusste Struktur des hebräischen Textes erhalten. »Israeliten« vermeidet die im heutigen Deutsch missverständliche Beschränkung auf männliche Nachkommen, während die wörtliche Form in der Fußnote dokumentiert wird.
