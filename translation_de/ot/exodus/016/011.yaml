lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: sprach
  rationale: Das Wayyiqtol von דבר führt ein neues Erzählereignis ein; „sprach“ ist hier die natürliche, würdige deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל מֹשֶׁה
  choice: zu Mose
  rationale: אֶל bezeichnet den Adressaten der Rede; „zu Mose“ entspricht idiomatischem Standarddeutsch.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeformel leitet die im folgenden Vers beginnende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das wörtliche „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Einleitungsformel wird idiomatisch mit einem Doppelpunkt wiedergegeben, da die direkte Rede in Vers 12 folgt.
