source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: de
  text: 'Ich habe das Murren der Israeliten[a] gehört. Rede zu ihnen und sag: »In der Abenddämmerung[b] werdet ihr Fleisch essen, und am Morgen werdet ihr von Brot satt werden. Und ihr werdet erkennen, dass ich Jahwe, euer Gott, bin.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Söhne Israels«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »zwischen den Abenden«; die Wendung bezeichnet die abendliche Dämmerungszeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ich habe … gehört
  rationale: Das hebräische Perfekt bezeichnet hier eine abgeschlossene Wahrnehmung mit unmittelbarer Bedeutung für Gottes nun folgende Antwort; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: תְּלוּנֹּת
  choice: das Murren
  rationale: Der Plural bezeichnet die wiederholten unzufriedenen Klagen des Volkes. Das deutsche Kollektivwort »Murren« bewahrt diesen vorwurfsvollen Klang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische Volksbezeichnung ist im modernen Deutschen klar und natürlich; die wörtliche Form »Söhne Israels« wird in einer Fußnote dokumentiert.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Rede zu ihnen und sag
  rationale: Die Formulierung bildet den hebräischen Redeeinleitungsrahmen ab, ohne im Deutschen unnötig steif zu wirken.
- source_word: בֵּין הָעַרְבַּיִם
  choice: in der Abenddämmerung
  rationale: Die Wendung bedeutet wörtlich »zwischen den Abenden« und bezeichnet eine abendliche Dämmerungszeit. Die verständliche Sinnwiedergabe steht im Text, die formale Mehrdeutigkeit in der Fußnote.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: werdet ihr Fleisch essen
  rationale: Im Speisekontext ist בָשָׂר natürlich mit »Fleisch« wiederzugeben; der Imperfekt drückt hier die zugesagte künftige Versorgung aus.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: werdet ihr euch an Brot satt essen
  rationale: Die Wendung bezeichnet das Sattwerden durch Brot. »Sich an Brot satt essen« ist konkret, idiomatisch und bewahrt den Gedanken ausreichender Versorgung.
- source_word: וִידַעְתֶּם
  choice: Dann werdet ihr erkennen
  rationale: Die mit ו verbundene Form bezeichnet hier die Erkenntnis als Folge des angekündigten Handelns Gottes. »Erkennen« trägt stärker als bloßes »wissen« den erfahrungsbezogenen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die etablierte deutsche Form.
- source_word: אֱלֹהֵיכֶם
  choice: euer Gott
  rationale: Obwohl אֱלֹהִים formal pluralisch aussieht, bezeichnet es hier eindeutig den einen Gott Israels; das Suffix ist zweite Person Plural.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich den Gottesnamen. Die Wiedergabe als »Jahwe« bewahrt den Charakter als Eigenname, ohne ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung fungiert hier als Bezeichnung des gesamten Volkes. »Die Israeliten« ist im Deutschen die natürliche Entsprechung; die wörtliche Form wird transparent in der Fußnote angegeben, ohne daraus eine Aussage nur über männliche Personen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich, ohne Umgangssprache. »Murren« wahrt den biblischen Wüstenkontext; »Abenddämmerung« vermittelt die idiomatische Bedeutung, während die Fußnote den ungewöhnlichen hebräischen Wortlaut offenlegt.
