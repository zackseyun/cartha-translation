  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: de
  text: 'Da sagten Mose und Aaron zu allen Israeliten: „Am Abend werdet ihr erkennen, dass Jahwe euch aus dem Land Ägypten herausgeführt hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagten
  rationale: Das narrative Wayyiqtol führt die Handlung weiter. „Da sagten“ gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder; der hebräische Singular steht trotz des zusammengesetzten Subjekts idiomatisch.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Verwendet die im Deutschen etablierten Namensformen.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: zu allen Israeliten
  rationale: Die wörtliche Wendung „Söhne Israels“ bezeichnet hier das gesamte Volk. „Israeliten“ ist im modernen Deutschen natürlich, inklusiv und sachlich genau, ohne eine reine Männergruppe nahezulegen.
- source_word: עֶרֶב
  choice: Heute Abend
  rationale: Das adverbial gebrauchte Substantiv bezeichnet im unmittelbaren Ankündigungskontext den bevorstehenden Abend. „Heute Abend“ gibt den zeitlichen Bezug im Deutschen idiomatisch wieder.
- source_word: וִידַעְתֶּם
  choice: werdet ihr erkennen
  rationale: Das Verb ידע meint hier ein durch das angekündigte Geschehen bestätigtes Erkennen, nicht bloß den Besitz einer Information.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Israel erkennen wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die etablierte deutsche Form.
- source_word: הוֹצִיא אֶתְכֶם
  choice: euch ... herausgeführt hat
  rationale: Der Hifil von יצא bedeutet „herausführen“. Das deutsche Perfekt bezeichnet idiomatisch die bereits vollzogene Herausführung, deren Urheber am Abend erkannt werden soll.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Wiedergabe behält אֶרֶץ ausdrücklich bei und formuliert die Herkunftsangabe in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname. Seine Wiedergabe als „Jahwe“ bewahrt den Eigenname-Charakter, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Volksbezeichnung „Israeliten“ vermeidet eine im Deutschen missverständliche Beschränkung auf männliche Nachkommen. Der Satz bleibt knapp und entspricht dem erzählenden Stil des hebräischen Textes.
