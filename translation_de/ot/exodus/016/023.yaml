source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: de
  text: 'Da sagte er zu ihnen: „Das ist es, was Jahwe gesagt hat: Morgen ist ein feierlicher Ruhetag, ein heiliger Sabbat für Jahwe[a]. Was ihr backen wollt, backt[b], und was ihr kochen wollt, kocht. Alles, was übrig bleibt, legt für euch zurück, damit es bis zum Morgen aufbewahrt wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Sabbat, der Jahwe heilig ist“.'
    reason: Die hebräische Verbindung שַׁבַּת קֹדֶשׁ לַיהוָה kann die Heiligkeit des Sabbats besonders eng auf Jahwe beziehen.
  - marker: b
    text: 'Im Hebräischen werden die Verben wiederholt: „Was ihr backen wollt, backt; und was ihr kochen wollt, kocht.“'
    reason: Die Wiederholung ist im deutschen Text beibehalten; die Anmerkung weist auf die entsprechende hebräische Stilfigur hin.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Da sagte er zu ihnen
  rationale: Das narrative Wayyiqtol wird in natürlichem deutschem Erzählstil mit „Da sagte“ wiedergegeben; das direkte Sprechen und der Bezug auf die Angeredeten bleiben erhalten.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Das ist es, was Jahwe gesagt hat
  rationale: Die fokussierende Konstruktion הוּא אֲשֶׁר wird ausdrücklich bewahrt; das Perfekt „gesagt hat“ bezeichnet die bereits ergangene, weiterhin maßgebliche Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שַׁבָּתוֹן שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: ein Ruhetag, ein heiliger Sabbat für Jahwe
  rationale: שַׁבָּתוֹן bezeichnet hier feierliche Arbeitsruhe; die appositionelle Bestimmung „ein heiliger Sabbat“ und seine Ausrichtung auf Jahwe werden erhalten.
- source_word: מָחָר
  choice: Morgen ist
  rationale: Die verblosen hebräischen Nominalsätze werden im Deutschen natürlich mit „ist“ ergänzt.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Was ihr backen wollt, backt
  rationale: Die Wiederholung des Verbstamms und die imperativische Zuspitzung bleiben erhalten; „wollt“ gibt hier die zur Zubereitung vorgesehene Menge idiomatisch wieder, nicht bloß einen Wunsch.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: und was ihr kochen wollt, kocht
  rationale: בשל kann „kochen“ beziehungsweise „sieden“ bedeuten. „Kochen“ wahrt die lexikalische Breite und bildet mit „backen“ ein natürliches deutsches Paar; die emphatische Wiederholung bleibt bestehen.
- source_word: כָּל הָעֹדֵף
  choice: Alles, was übrig bleibt
  rationale: Die partizipiale Form bezeichnet den verbleibenden Überschuss; die Wendung ist im modernen Deutschen klar und idiomatisch.
- source_word: הַנִּיחוּ לָכֶם
  choice: legt für euch zurück
  rationale: Der Hifil von נוח bezeichnet hier das gezielte Beiseitelegen; לָכֶם wird mit „für euch“ ausdrücklich bewahrt.
- source_word: לְמִשְׁמֶרֶת עַד הַבֹּקֶר
  choice: damit es bis zum Morgen aufbewahrt wird
  rationale: לְמִשְׁמֶרֶת drückt den Zweck des Verwahrens aus. Der deutsche Zwecksatz gibt diese Funktion verständlich wieder und erhält die Zeitgrenze.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, während „der HERR“ die traditionelle jüdische Leseersetzung widerspiegelt.
- issue: Verhältnis von שַׁבָּתוֹן und שַׁבַּת קֹדֶשׁ
  choice: ein Ruhetag, ein heiliger Sabbat für Jahwe
  alternative: eine feierliche Ruhe, ein Jahwe heiliger Sabbat
  rationale: Die beiden Bezeichnungen werden appositionell nebeneinandergestellt, ohne sie zu einer einzigen technischen Definition zu verschmelzen; sowohl die Ruhe als auch die Heiligkeit und Ausrichtung auf Jahwe bleiben sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Satzführung. Die emphatischen Verbwiederholungen des Hebräischen wurden beibehalten. „Kochen“ wurde gegenüber dem engeren „sieden“ gewählt, weil בשל beide Nuancen zulässt und „kochen“ im Deutschen natürlicher ist.
