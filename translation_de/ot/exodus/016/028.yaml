source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Wie lange wollt ihr euch noch weigern, meine Gebote und meine Weisungen[a] zu befolgen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Gesetze“. Das hebräische Wort torot (Plural von tora) kann sowohl verbindliche Unterweisungen als auch Gesetze bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativpräteritum führt die Handlung weiter. „Da sagte“ gibt die zeitliche Folge im modernen Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: עַד אָנָה
  choice: Wie lange … noch
  rationale: Die hebräische Wendung fragt vorwurfsvoll nach der Dauer eines anhaltenden Verhaltens. Das deutsche „noch“ bringt diesen Aspekt idiomatisch zum Ausdruck.
- source_word: מֵאַנְתֶּם
  choice: wollt ihr euch … weigern
  rationale: Das Verb bezeichnet Weigerung oder Unwilligkeit. In der rhetorischen Frage gibt „wollt ihr euch … weigern“ den fortgesetzten, willentlichen Widerstand natürlich wieder.
- source_word: לִשְׁמֹר
  choice: zu befolgen
  rationale: שׁמר bedeutet bei Geboten, sie einzuhalten oder zu beachten. „Befolgen“ passt im Deutschen zugleich zu „Gebote“ und „Weisungen“.
- source_word: מִצְוֺתַי
  choice: meine Gebote
  rationale: „Gebote“ bewahrt den verbindlichen, bundesrechtlichen Klang des hebräischen Ausdrucks.
- source_word: וְתוֹרֹתָי
  choice: und meine Weisungen
  rationale: Der Plural von תּוֹרָה bezeichnet hier verbindliche göttliche Unterweisungen. „Weisungen“ bewahrt sowohl den lehrenden als auch den normativen Sinn; die mögliche Wiedergabe „Gesetze“ wird in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Wiedergabe als „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von תּוֹרָה im Plural
  choice: Weisungen
  alternative: Gesetze
  rationale: תּוֹרָה kann autoritative Unterweisung ebenso wie rechtlich verbindliche Satzung bezeichnen. „Weisungen“ hält diesen Bedeutungsumfang offen; die gesetzliche Nuance wird durch den Zusammenhang mit „Gebote“ und durch die Fußnote gewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Plural, wie das hebräische Verb zeigt. Die rhetorische Schärfe des göttlichen Vorwurfs bleibt erhalten.
