base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: de
  text: Da ließen sie es bis zum Morgen liegen, wie Mose es befohlen hatte. Es stank nicht, und es waren auch keine Würmer[a] darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Maden. Das hebräische Wort kann allgemein wurmartige Tiere bezeichnen, die bei Fäulnis auftreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: Da ließen sie es … liegen
  rationale: Das Hifil von נוח bezeichnet hier das Liegenlassen beziehungsweise Aufbewahren des Mannas. Die deutsche Wendung ist natürlich und bewahrt das singularische Pronomen אֹתוֹ.
- source_word: עַד הַבֹּקֶר
  choice: bis zum Morgen
  rationale: Entspricht der hebräischen Zeitangabe idiomatisch und präzise.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: wie Mose es befohlen hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass Moses Anweisung der Handlung vorausging; das ergänzte „es“ sorgt für einen natürlichen Satzbau.
- source_word: הִבְאִישׁ
  choice: Es stank nicht
  rationale: Das Verb bezeichnet das Stinken beziehungsweise Übelriechen und knüpft an den Verderb des am Vortag aufbewahrten Mannas an.
- source_word: רִמָּה
  choice: Würmer
  rationale: Das Substantiv kann Würmer oder Maden bezeichnen. „Würmer“ wahrt die allgemeinere Bedeutung; die spezifischere Möglichkeit wird in der Fußnote genannt.
- source_word: לֹא הָיְתָה בּוֹ
  choice: es waren auch keine … darin
  rationale: Die existenzielle Aussage wird in natürlichem Deutsch wiedergegeben. „Auch“ verbindet die zweite Verneinung klar mit der ersten.
