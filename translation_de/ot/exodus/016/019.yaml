base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/019.yaml
  text: And Moses said to them[a], “Let no one leave any of it until morning.”
translation:
  language: de
  text: 'Und Mose sagte zu ihnen: »Niemand soll etwas davon bis zum Morgen übrig lassen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der narrativen Verbform führt die Erzählung fort; »Und … sagte« gibt dies im Deutschen schlicht und angemessen wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Die im Deutschen übliche Form des Personennamens.
- source_word: אֲלֵהֶם
  choice: zu ihnen
  rationale: Die Präposition אֶל mit dem Suffix der 3. Person maskulin Plural bedeutet unmittelbar »zu ihnen«; eine ausdrückliche Benennung der Angesprochenen wäre interpretierend.
- source_word: אִישׁ אַל
  choice: Niemand soll
  rationale: אִישׁ ist hier distributiv gebraucht, während אַל das Verbot ausdrückt. »Niemand soll« ist im heutigen Deutsch natürlich und bezieht das Verbot eindeutig auf jede einzelne Person.
- source_word: יוֹתֵר
  choice: übrig lassen
  rationale: Das Verb יתר bezeichnet in diesem Zusammenhang das Zurück- oder Übriglassen eines Teils des Mannas.
- source_word: מִמֶּנּוּ
  choice: etwas davon
  rationale: Die Präposition מן mit dem Suffix verweist auf das zuvor genannte Manna; »etwas davon« ist die natürliche deutsche Ergänzung zu »übrig lassen«.
- source_word: עַד בֹּקֶר
  choice: bis zum Morgen
  rationale: Die Wendung bezeichnet die zeitliche Grenze, bis zu der nichts aufbewahrt werden sollte.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die distributive Bedeutung von אִישׁ wird durch »Niemand« direkt im Haupttext ausgedrückt, sodass keine Fußnote erforderlich ist.
