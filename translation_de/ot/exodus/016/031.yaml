base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: de
  text: Das Haus Israel nannte es Manna[a]. Es war wie weißer Koriandersamen[b], und sein Geschmack war wie Honiggebäck[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch man; im Deutschen traditionell »Manna«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wie der Samen des weißen Korianders«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »wie ein Fladen mit Honig« bzw. »wie dünnes Gebäck mit Honig«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל אֶת־שְׁמוֹ
  choice: Das Haus Israel nannte es
  rationale: Die Wiedergabe bewahrt die korporative hebräische Bezeichnung »Haus Israel«. Das natürliche deutsche »nannte es« gibt die Namensformel wieder, ohne das im Deutschen schwerfällige »nannte seinen Namen« nachzubilden.
- source_word: מָן
  choice: Manna
  rationale: »Manna« ist die im Deutschen eingebürgerte biblische Form des hebräischen מָן (man).
- source_word: כְּזֶרַע גַּד לָבָן
  choice: wie weißer Koriandersamen
  rationale: גַּד wird gewöhnlich als Koriander bestimmt; לָבָן beschreibt das Vergleichsobjekt als weiß. Die Formulierung ist knapp und im Deutschen natürlich, während eine alternative syntaktische Zuordnung in der Fußnote vermerkt wird.
- source_word: וְטַעְמוֹ
  choice: und sein Geschmack
  rationale: טַעַם bezeichnet hier den Geschmack der Speise; »Geschmack« ist die direkte und geläufige deutsche Entsprechung.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: wie Honiggebäck
  rationale: צַפִּיחִת bezeichnet wahrscheinlich ein flaches oder dünnes Gebäckstück; בִּדְבָשׁ beschreibt dessen Verbindung mit Honig. »Honiggebäck« liest sich natürlich, ohne die nicht völlig sichere Form des Gebäcks im Haupttext zu stark festzulegen.
