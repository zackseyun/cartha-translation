translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die korporative Wendung »Haus Israel« bleibt erhalten; bei der Beschreibung von Gestalt und Zubereitung des Gebäcks werden die lexikalischen Unsicherheiten durch Fußnoten kenntlich gemacht.
