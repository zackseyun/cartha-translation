  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְ/נִ֨י מַמְטִ֥יר לָ/כֶ֛ם לֶ֖חֶם מִן הַ/שָּׁמָ֑יִם וְ/יָצָ֨א הָ/עָ֤ם וְ/לָֽקְטוּ֙ דְּבַר י֣וֹם בְּ/יוֹמ֔/וֹ לְמַ֧עַן אֲנַסֶּ֛/נּוּ הֲ/יֵלֵ֥ךְ בְּ/תוֹרָתִ֖/י אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Sieh, ich lasse für euch Brot vom Himmel regnen[a]. Das Volk soll hinausgehen und jeden Tag die für diesen Tag benötigte Menge sammeln[b]. Damit will ich es auf die Probe stellen, ob es nach meiner Weisung lebt[c] oder nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sieh, ich werde für euch Brot vom Himmel regnen lassen.“ Das hebräische Partizip kann eine unmittelbar bevorstehende Handlung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Sache eines Tages an seinem Tag“; gemeint ist die jeweils für einen Tag benötigte Menge.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „ob es in meiner Weisung geht“. Für „Weisung“ kann das hebräische Wort auch mit „Unterweisung“ oder „Gesetz“ wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנְנִי מַמְטִיר
  choice: Sieh, ich lasse … regnen
  rationale: „Sieh“ bewahrt das aufmerksamkeitslenkende הִנְנִי; die präsentische Form gibt die unmittelbar bevorstehende Handlung des Partizips anschaulich wieder.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: Brot vom Himmel
  rationale: Bewahrt das konkrete „Brot“ und die räumliche Herkunftsangabe, ohne zu „Nahrung“ zu verallgemeinern.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: Tag für Tag den jeweiligen Tagesbedarf
  rationale: Gibt die idiomatische Bedeutung der wörtlichen Wendung „die Sache eines Tages an seinem Tag“ natürlich wieder und betont die jeweils für einen Tag bestimmte Menge.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: So will ich es auf die Probe stellen
  rationale: Das singularische Suffix nimmt das kollektiv verstandene „Volk“ auf; „auf die Probe stellen“ bezeichnet eine Prüfung, nicht eine Verführung.
- source_word: הֲיֵלֵךְ בְּתוֹרָתִי
  choice: ob es nach meiner Weisung lebt
  rationale: „Nach meiner Weisung“ gibt die Verhaltensnorm von תּוֹרָה im unmittelbaren, vorsinaitischen Zusammenhang wieder; „lebt“ vermittelt die hebräische Wegmetapher verständlich.
- source_word: אִם לֹא
  choice: oder nicht
  rationale: Schließt die indirekte Entscheidungsfrage im Deutschen idiomatisch ab.
theological_decisions:
- issue: Bedeutung von תּוֹרָה vor der Sinaigesetzgebung
  choice: meine Weisung
  alternative: mein Gesetz / meine Unterweisung
  rationale: „Weisung“ bewahrt die Breite von תּוֹרָה und passt zur konkreten göttlichen Anordnung dieses Abschnitts, ohne die spätere Sinaigesetzgebung vorschnell vollständig vorauszusetzen.
- issue: Metapher „in meiner Tora gehen“
  choice: nach meiner Weisung leben
  alternative: in meiner Weisung gehen
  rationale: Die natürliche deutsche Formulierung vermittelt die Lebensführung, die das hebräische „gehen“ bezeichnet; die zugrunde liegende Metapher wird in der Fußnote offengelegt.
- issue: Singularische Bezugnahme auf das Kollektiv הָעָם
  choice: das Volk … es
  alternative: die Leute … sie
  rationale: Die grammatische Einzahl des hebräischen Kollektivnomens und der folgenden Formen bleibt im Deutschen sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gottesname wird als „Jahwe“ wiedergegeben. Kollektive Singularformen bleiben erhalten; schwer verständliche hebräische Idiome werden natürlich formuliert und in Fußnoten transparent gemacht.
