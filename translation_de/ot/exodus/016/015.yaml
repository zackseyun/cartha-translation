  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּרְא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יֹּ֨אמְר֜וּ אִ֤ישׁ אֶל אָחִי/ו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה ה֑וּא וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֲלֵ/הֶ֔ם ה֣וּא הַ/לֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם לְ/אָכְלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: de
  text: 'Als die Israeliten es sahen, sagten sie zueinander[a]: »Was ist das?«[b] Denn sie wussten nicht, was es war. Mose sagte zu ihnen: »Das ist das Brot, das Jahwe euch zu essen gegeben hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Mann zu seinem Bruder«; eine hebräische Wendung für »zueinander«.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck für »Was ist das?« wird traditionell mit dem Namen »Manna« in Verbindung gebracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die natürliche moderne deutsche Bezeichnung gibt die Zugehörigkeit zum Volk Israel präzise wieder; die wörtliche Form »Söhne Israels« wäre hier unnötig steif und könnte enger verstanden werden als der erzählerische Bezug auf das Volk.
- source_word: אִישׁ אֶל אָחִיו
  choice: zueinander
  rationale: Die wörtliche Wendung »ein Mann zu seinem Bruder« ist ein hebräisches Idiom für wechselseitiges Sprechen. »Zueinander« gibt dessen Sinn im heutigen Deutsch natürlich wieder.
- source_word: מָן הוּא
  choice: Was ist das?
  rationale: Im Zusammenhang ist מָן als Frageausdruck zu verstehen, wie der folgende Begründungssatz bestätigt. Die Übersetzung bewahrt zugleich die erzählerische Grundlage für die spätere Bezeichnung »Manna«.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: sie wussten nicht, was es war
  rationale: Die Formulierung bildet die erklärende Aussage des Hebräischen direkt und idiomatisch ab.
- source_word: הוּא הַלֶּחֶם
  choice: Das ist das Brot
  rationale: Das Demonstrativpronomen »das« identifiziert im Deutschen natürlich den unmittelbar wahrgenommenen Stoff als das von Gott gegebene Brot.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den im Ausgangstext ausdrücklich verwendeten Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: לְאָכְלָה
  choice: zu essen
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck der Gabe; »zu essen« ist knapp, klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als Eigennamen. »Jahwe« bewahrt diesen Namen in der im Deutschen geläufigen Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von מָן als Frage oder bereits als Eigenname
  choice: 'Als Frage: »Was ist das?«'
  alternative: 'Als Eigenname: »Manna«'
  rationale: Der anschließende Satz — sie wussten nicht, was es war — kennzeichnet die Wendung hier als Frage. Die Übersetzung als »Manna« würde die spätere Benennung vorwegnehmen und das Wortspiel verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. »Israeliten« vermeidet die im heutigen Deutsch missverständliche oder unnötig enge Form »Söhne Israels«. Die direkte Rede wird klar und schlicht gehalten; die Fußnoten sichern die hebräische Bildlichkeit und das Wortspiel.
