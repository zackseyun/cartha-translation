  text: Ein Omer ist ein Zehntel eines Efa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Omer und Efa sind althebräische Trockenmaße; dieser Vers bestimmt ein Omer als ein Zehntel eines Efa.
