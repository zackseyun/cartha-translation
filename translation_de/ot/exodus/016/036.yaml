lexical_decisions:
- source_word: הָעֹמֶר
  choice: ein Omer
  rationale: עֹמֶר bezeichnet ein althebräisches Trockenmaß. Die Transliteration bewahrt die historische Maßeinheit; in einer allgemeinen Definition ist der unbestimmte Artikel im Deutschen natürlich.
- source_word: עֲשִׂרִית
  choice: ein Zehntel
  rationale: Das Wort bezeichnet hier den zehnten Teil einer Maßeinheit; „ein Zehntel“ gibt das Verhältnis knapp und genau wieder.
- source_word: הָאֵיפָה
  choice: Efa
  rationale: אֵיפָה ist ein weiteres althebräisches Trockenmaß und wird transliteriert, statt durch einen ungenauen modernen Wert ersetzt zu werden.
- source_word: הוּא
  choice: entspricht
  rationale: Das Pronomen dient in diesem Nominalsatz als Kopula. „Entspricht“ formuliert die definierte Maßrelation im Deutschen klar und natürlich.
- source_word: וְ
  choice: nicht eigens wiedergegeben
  rationale: Die Konjunktion leitet hier eine erklärende Maßangabe ein. Im Deutschen wäre ein vorangestelltes „Und“ schwerfällig; der erklärende Anschluss ergibt sich aus dem Kontext.
