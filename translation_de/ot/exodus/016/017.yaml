  source_fidelity: Die Übersetzung gibt וַיַּעֲשׂוּ כֵן zutreffend mit „taten es so“ wieder und bewahrt damit den Rückverweis auf die vorausgehende Anweisung. „Die Israeliten“ ist für בְּנֵי יִשְׂרָאֵל eine idiomatische und kontextgerechte deutsche Volksbezeichnung. „Sammelten“ trifft לקט im Mannakontext. Die Gegenüberstellung „der eine viel, der andere wenig“ gibt die substantivierten Partizipien הַמַּרְבֶּה und הַמַּמְעִיט angemessen als distributive Ellipse wieder.
