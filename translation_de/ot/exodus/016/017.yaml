  text: וַ/יַּעֲשׂוּ כֵ֖ן בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יִּלְקְט֔וּ הַ/מַּרְבֶּ֖ה וְ/הַ/מַּמְעִֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/017.yaml
  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: de
  text: 'Die Israeliten taten es so und sammelten: der eine viel, der andere wenig.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: taten es so
  rationale: Die Verbindung aus עשה und כן verweist auf die vorausgehende Anweisung. „Taten es so“ gibt diesen Rückbezug im Deutschen natürlich und genau wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Wörtlich „Söhne Israels“; hier bezeichnet die feste hebräische Wendung das Volk insgesamt. „Die Israeliten“ ist im modernen Deutschen natürlich, präzise und schließt Frauen und Männer ein.
- source_word: וַיִּלְקְטוּ
  choice: sammelten
  rationale: לקט bezeichnet das Auflesen oder Einsammeln, besonders von Nahrung. „Sammelten“ passt zum Manna-Kontext und bewahrt den einfachen Erzählstil.
- source_word: הַמַּרְבֶּה
  choice: der eine viel
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der viel sammelt. In Verbindung mit dem Gegenstück bildet „der eine viel“ eine natürliche deutsche distributive Formulierung.
- source_word: הַמַּמְעִיט
  choice: der andere wenig
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der wenig sammelt. „Der andere wenig“ gibt den Gegensatz zu הַמַּרְבֶּה knapp und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die idiomatische Volksbezeichnung „Israeliten“ vermeidet das im heutigen Deutschen missverständliche, männlich verengte „Söhne Israels“. Der elliptische Schluss bewahrt die knappe Gegenüberstellung des Hebräischen.
