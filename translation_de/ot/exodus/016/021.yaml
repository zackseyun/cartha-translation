  text: וַ/יִּלְקְט֤וּ אֹת/וֹ֙ בַּ/בֹּ֣קֶר בַּ/בֹּ֔קֶר אִ֖ישׁ כְּ/פִ֣י אָכְל֑/וֹ וְ/חַ֥ם הַ/שֶּׁ֖מֶשׁ וְ/נָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/021.yaml
  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: de
  text: Sie sammelten es Morgen für Morgen, jeder so viel, wie er essen konnte. Wenn die Sonne heiß wurde, schmolz es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: sie sammelten
  rationale: לקט bezeichnet besonders beim Auflesen von Nahrung das Sammeln; „sammelten“ ist im Deutschen natürlich und sachlich.
- source_word: אֹתוֹ
  choice: es
  rationale: Das direkte Objektpronomen verweist auf die Speise im vorausgehenden Zusammenhang; das Pronomen wird ohne erläuternde Einfügung beibehalten.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Morgen für Morgen
  rationale: Die Wiederholung wirkt distributiv und bezeichnet das regelmäßig wiederkehrende Sammeln; „Morgen für Morgen“ bildet sie im Deutschen idiomatisch nach.
- source_word: אִישׁ כְּפִי אָכְלוֹ
  choice: jeder so viel, wie er essen konnte
  rationale: אִישׁ ist hier distributiv, und die Wendung כְּפִי אָכְלוֹ bedeutet sinngemäß eine der jeweiligen Essmenge entsprechende Menge. Die Fassung ist verständlich und bewahrt mit „er“ die maskuline Form des Hebräischen.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: Doch als die Sonne heiß wurde
  rationale: חמם bezeichnet hier das Heißwerden der Sonne. „Als“ gibt die im Erzählzusammenhang zeitliche Beziehung natürlich wieder; „doch“ markiert den Gegensatz zwischen Sammeln und Schmelzen.
- source_word: וְנָמָס
  choice: schmolz es
  rationale: מסס bedeutet schmelzen beziehungsweise sich auflösen; bei der Wirkung der Sonnenwärme ist „schmolz“ die naheliegende deutsche Entsprechung.
theological_decisions: []
