base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: de
  text: Als sie es mit dem Omer maßen, hatte der, der viel gesammelt hatte, keinen Überschuss, und dem, der wenig gesammelt hatte, fehlte nichts. Jeder hatte so viel gesammelt, wie viel er zu essen brauchte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֹדּוּ בָעֹמֶר
  choice: Als sie es mit dem Omer maßen
  rationale: Die Erzählform führt die Handlung fort; als temporaler Auftakt gibt „Als“ den Zusammenhang im Deutschen natürlich wieder. Omer bleibt als konkrete Maßeinheit erhalten.
- source_word: הֶעְדִּיף הַמַּרְבֶּה
  choice: hatte der, der viel gesammelt hatte, keinen Überschuss
  rationale: הֶעְדִּיף bezeichnet einen Überschuss; das im Partizip implizierte Sammeln wird aus dem Kontext verdeutlicht.
- source_word: וְהַמַּמְעִיט לֹא הֶחְסִיר
  choice: dem, der wenig gesammelt hatte, fehlte nichts
  rationale: Die deutsche Konstruktion gibt den knappen Gegensatz von Überfluss und Mangel idiomatisch wieder und ergänzt „gesammelt“ aus dem unmittelbaren Zusammenhang.
- source_word: אִישׁ
  choice: Jeder
  rationale: Das Wort ist hier distributiv gebraucht und bezieht sich auf jede einzelne Person, nicht ausschließlich auf erwachsene Männer.
- source_word: לְפִי אָכְלוֹ לָקָטוּ
  choice: hatte so viel gesammelt, wie er essen konnte
  rationale: Die wörtliche Wendung „nach dem Maß seines Essens“ bezeichnet die für den eigenen Verzehr passende Menge. Die Übersetzung ist klar und bewahrt den individuellen Bedarf als Maßstab.
theological_decisions:
- issue: Distributiver maskuliner Singular in אִישׁ ... אָכְלוֹ
  choice: Jeder ... wie er essen konnte
  alternative: Alle ... wie viel sie essen konnten
  rationale: Der Singular des Hebräischen bleibt erhalten, während „Jeder“ den inklusiven distributiven Sinn natürlich ausdrückt und keine Beschränkung auf Männer einführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Bezug zur hebräischen Satzstruktur. „Omer“ wird als biblische Maßeinheit unübersetzt beibehalten. Der parallele Gegensatz zwischen viel und wenig sowie Überschuss und Mangel bleibt deutlich.
