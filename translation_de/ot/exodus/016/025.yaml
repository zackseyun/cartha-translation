  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אִכְלֻ֣/הוּ הַ/יּ֔וֹם כִּֽי שַׁבָּ֥ת הַ/יּ֖וֹם לַ/יהוָ֑ה הַ/יּ֕וֹם לֹ֥א תִמְצָאֻ֖/הוּ בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: de
  text: 'Und Mose sagte: »Esst es heute, denn heute ist ein Sabbat für den HERRN. Heute werdet ihr es auf dem Feld nicht finden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Esst es
  rationale: Der maskuline Singular des Imperativs mit pluralischem Subjekt wird im Deutschen natürlich als »Esst es« wiedergegeben; das Pronomen verweist auf das zuvor erwähnte Manna.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die Aufforderung und wird in diesem Zusammenhang idiomatisch und präzise mit »denn« wiedergegeben.
- source_word: שַׁבָּת
  choice: Sabbat
  rationale: »Sabbat« bewahrt den konkreten israelitischen Ruhetag und vermeidet die Verallgemeinerung zu bloßer »Ruhe«.
- source_word: לַיהוָה
  choice: für den HERRN
  rationale: Die Präposition ל bezeichnet hier die Ausrichtung beziehungsweise Zugehörigkeit des Sabbats zu JHWH; »für den HERRN« gibt dies knapp wieder. Die traditionelle deutsche Wiedergabe des Gottesnamens lautet »HERR«.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Die Form bezeichnet den offenen Bereich außerhalb des Lagers, wo das Manna gesammelt wurde; »auf dem Feld« entspricht dem deutschen Sprachgebrauch.
theological_decisions:
- issue: Beziehung des Sabbats zu JHWH
  choice: ein Sabbat für den HERRN
  alternative: ein Sabbat des HERRN
  rationale: Das hebräische לַיהוָה lässt sich als Widmung oder Ausrichtung verstehen. »Für den HERRN« wahrt diese Nuance, ohne darüber hinaus eine bestimmte theologische Deutung festzulegen.
- issue: Wiedergabe des Tetragramms יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: »HERR« folgt der etablierten deutschsprachigen Bibeltradition und kennzeichnet den Gottesnamen typografisch, ohne eine unsichere Aussprache festzuschreiben.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die dreifache Hervorhebung von »heute« im Hebräischen bleibt vollständig erhalten. Die direkte Rede ist rhythmisch in zwei Sätze gegliedert.
