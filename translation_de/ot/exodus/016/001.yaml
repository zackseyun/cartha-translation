  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: de
  text: Sie brachen von Elim auf, und die ganze Gemeinschaft der Israeliten[a] kam in die Wüste Sin[b], die zwischen Elim und Sinai liegt, am fünfzehnten Tag des zweiten Monats nach ihrem Auszug aus dem Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Söhne Israels“. Dies ist die übliche Bezeichnung für das ganze Volk Israel, nicht nur für die Männer.'
    reason: lexical_alternative
  - marker: b
    text: „Sin“ ist hier ein Ortsname und bezeichnet die Wüste Sin; der Name ist nicht mit „Sinai“ gleichzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen … auf
  rationale: נסע bezeichnet in Berichten über die Wüstenwanderung gewöhnlich das Aufbrechen eines Lagers und den anschließenden Weitermarsch. „aufbrechen“ gibt diesen Sinn natürlich wieder.
- source_word: מֵאֵילִם
  choice: von Elim
  rationale: אֵילִם ist ein Ortsname und wird in der üblichen deutschen Form „Elim“ wiedergegeben.
- source_word: וַיָּבֹאוּ
  choice: kam
  rationale: בוא ist ein allgemeines Verb der Bewegung. Der Singular richtet sich im Deutschen nach dem Kollektivsubjekt „die ganze Gemeinschaft“.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: die ganze Gemeinschaft der Israeliten
  rationale: עֵדָה bezeichnet hier die versammelte Volksgemeinschaft. בְּנֵי יִשְׂרָאֵל lautet formal „Söhne/Kinder Israels“, fungiert aber als nationale Bezeichnung; „Israeliten“ ist im modernen Deutschen klar, inklusiv und idiomatisch.
- source_word: אֶל מִדְבַּר סִין
  choice: in die Wüste Sin
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppengebiet. Bei einem Bewegungsverb gibt „in die Wüste“ das Ziel natürlich wieder; סִין bleibt als Ortsname transliteriert.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: die zwischen Elim und Sinai liegt
  rationale: Die Relativkonstruktion lokalisiert die Wüste. Das ergänzte „liegt“ ist im Deutschen idiomatisch und fügt keine sachliche Bestimmung hinzu.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: am fünfzehnten Tag des zweiten Monats
  rationale: Dies ist die natürliche deutsche Wiedergabe der hebräischen Datumsangabe.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: nach ihrem Auszug aus dem Land Ägypten
  rationale: Der Infinitiv mit לְ setzt den Auszug als zeitlichen Bezugspunkt. Die substantivische Form „nach ihrem Auszug“ ist knapp und bewahrt das zentrale Exodus-Motiv.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Reisebericht, wird aber durch idiomatische deutsche Wendungen wie „brachen … auf“ und „nach ihrem Auszug“ flüssig gehalten. Ortsnamen erscheinen in ihren etablierten deutschen Formen.
