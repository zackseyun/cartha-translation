source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: de
  text: 'Da sagten die Israeliten zu ihnen: „Wären wir doch im Land Ägypten durch die Hand Jahwes gestorben, als wir bei den Fleischtöpfen saßen und uns an Brot satt aßen! Denn ihr habt uns in diese Wüste hinausgeführt, um diese ganze Versammlung verhungern zu lassen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die idiomatische deutsche Volksbezeichnung gibt die hebräische Wendung natürlich wieder; das wörtliche „Söhne Israels“ wäre hier im heutigen Deutsch missverständlich und könnte Frauen und Kinder unnötig auszuschließen scheinen.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Wären wir doch ... gestorben
  rationale: מִי יִתֵּן leitet hier keinen echten Fragesatz, sondern einen unerfüllten Wunsch ein. Der deutsche Irrealis mit „doch“ bildet diese Klage idiomatisch ab.
- source_word: בְיַד יְהוָה
  choice: durch die Hand Jahwes
  rationale: Bewahrt das konkrete hebräische Bild und bezeichnet Jahwe als den Handelnden beziehungsweise Urheber des Todes.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: als wir bei den Fleischtöpfen saßen
  rationale: Die traditionelle, weiterhin verständliche Wendung bewahrt das konkrete Bild von Kochtöpfen mit Fleisch; עַל wird kontextgemäß mit „bei“ wiedergegeben.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: als wir ... uns an Brot satt aßen
  rationale: Gibt den temporalen Parallelismus sowie לָשֹׂבַע als Essen bis zur Sättigung in natürlichem Deutsch wieder.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: diese Wüste
  rationale: „Wüste“ ist für מִדְבָּר in diesem geografischen Kontext die geläufige und klare deutsche Entsprechung.
- source_word: לְהָמִית ... בָּרָעָב
  choice: um ... verhungern zu lassen
  rationale: Die Hifil-Konstruktion „sterben machen“ zusammen mit „durch Hunger“ wird prägnant und bedeutungsgetreu als „verhungern lassen“ ausgedrückt.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: diese ganze Versammlung
  rationale: „Versammlung“ erhält den kollektiven Charakter von קָהָל, ohne eine spätere kirchliche Bedeutung ausdrücklich einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ macht den Namen im Haupttext sichtbar; „der HERR“ wäre die traditionelle Ersatzlesung, ist aber kein lexikalisch identischer Titel.
- issue: Reichweite der Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die feste hebräische Abstammungs- und Volksbezeichnung meint hier die israelitische Gemeinschaft. Die idiomatische Übersetzung wahrt diese inklusive Referenz, ohne aus dem grammatischen Maskulinum eine Beschränkung auf Männer abzuleiten.
- issue: Art des behaupteten Todes durch Hunger
  choice: verhungern zu lassen
  alternative: durch Hunger zu töten
  rationale: Die Formulierung erhält die scharfe Anklage der Israeliten, lässt sie aber als deren direkte Rede stehen und bestätigt ihre Deutung der Absicht von Mose und Aaron nicht als Erzählerurteil.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter und emotionaler Klagerede. Der Parallelismus der beiden temporalen Sätze bleibt erhalten. Keine Fußnoten sind erforderlich, da die wesentlichen Bedeutungen ohne unnatürliche Wörtlichkeit im Haupttext wiedergegeben werden.
