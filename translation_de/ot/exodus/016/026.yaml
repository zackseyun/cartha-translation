  source_fidelity: Die Übersetzung gibt die zeitliche Angabe, die Pluralanrede mit dem pronominalen Objekt, den kontrastierenden Anschluss und die prädikativ-appositionelle Benennung des siebten Tages zutreffend wieder. „Nichts davon“ erschließt den im Kontext gegebenen, im letzten hebräischen Teilsatz jedoch nicht erneut genannten Bezug, ohne im Haupttext ausdrücklich „Manna“ einzusetzen. Das „da“ bezieht sich nachvollziehbar auf den siebten Tag und entspricht funktional בּוֹ.
  naturalness: „Sechs Tage lang sollt ihr es sammeln; aber am siebten Tag ist Sabbat“ ist modernes, würdiges und gut verständliches Standarddeutsch. Auch „da wird nichts davon da sein“ ist im Kontext verständlich; es hält die knappe, elliptische Ausdrucksweise eher fest als eine explizitere Umschreibung mit „Manna“.
  terminology: „Sabbat“ ist für שַׁבָּת die sachgerechte, nicht konfessionell überformende Wiedergabe. Die Formulierung „ist Sabbat“ ist im Deutschen idiomatisch und bildet die artikellose, knappe hebräische Prädikation angemessen ab. Die Fußnoten sind korrekt verankert und erläutern Apposition beziehungsweise Kontextbezug, ohne den Haupttext zu überladen.
