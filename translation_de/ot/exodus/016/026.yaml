  text: שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑/הוּ וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: de
  text: Sechs Tage lang sollt ihr es sammeln; aber am siebten Tag ist Sabbat[a] – da wird nichts davon da sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „am siebten Tag: Sabbat“.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist: Am siebten Tag wird kein Manna da sein. Das Hebräische lautet wörtlich etwa: „es wird nicht an ihm sein“.'
    reason: clarification
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Sechs Tage lang
  rationale: Die Zeitangabe wird im Deutschen idiomatisch als Dauer ausgedrückt und bleibt eng am hebräischen Wortlaut.
- source_word: תִּלְקְטֻהוּ
  choice: sollt ihr es sammeln
  rationale: Die Form bezeichnet die 2. Person Plural mit einem maskulinen Objektsuffix; „sollt“ gibt im Zusammenhang den anweisenden Zukunftssinn wieder.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: aber am siebten Tag
  rationale: Das Waw kann „und“ bedeuten, stellt hier jedoch den siebten Tag den sechs Sammeltagen gegenüber; „aber“ gibt diesen Kontrast natürlich wieder.
- source_word: שַׁבָּת
  choice: ist Sabbat
  rationale: Das artikellose Nomen steht appositionell beziehungsweise als Bezeichnung des siebten Tages. Die prädikative deutsche Form vermeidet den unnatürlichen Ausdruck „ein Sabbat“ und bewahrt den knappen Nominalstil.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: da wird nichts davon da sein
  rationale: Wörtlich lautet die Wendung etwa „es wird nicht an/auf ihm sein“. Das Objektsuffix von „sammeln“ liefert den Bezug auf das Manna; „davon“ macht diesen im Deutschen notwendigen Bezug deutlich, ohne das Nomen ausdrücklich in den Haupttext einzufügen. „da“ bezieht sich auf den siebten Tag.
theological_decisions:
- issue: Wiedergabe von שַׁבָּת vor der Sinaioffenbarung
  choice: Sabbat
  alternative: Ruhetag; ein Sabbat; der Sabbat
  rationale: „Sabbat“ bewahrt den spezifischen hebräischen Begriff, ohne ihn zu „Ruhetag“ auszudeuten. Der deutsche Nullartikel in „ist Sabbat“ entspricht dem artikellosen hebräischen Nomen besser als „der Sabbat“ und klingt natürlicher als „ein Sabbat“.
- issue: Unausgesprochener Gegenstand in לֹא יִהְיֶה בּוֹ
  choice: nichts davon
  alternative: kein Manna; es wird nichts da sein
  rationale: Der Kontext verweist auf das zu sammelnde Manna, doch das Hebräische nennt es in diesem Satzteil nicht ausdrücklich. „Davon“ wahrt diese Ellipse weitgehend und verhindert zugleich einen unklaren deutschen Satz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Pluralanrede wird mit „ihr“ ausdrücklich wiedergegeben. Der Gedankenstrich bildet die knappe Folgerung des hebräischen Satzes ab; alle Fußnotenmarker stehen im Haupttext.
