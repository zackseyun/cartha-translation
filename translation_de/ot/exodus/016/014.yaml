  text: וַ/תַּ֖עַל שִׁכְבַ֣ת הַ/טָּ֑ל וְ/הִנֵּ֞ה עַל פְּנֵ֤י הַ/מִּדְבָּר֙ דַּ֣ק מְחֻסְפָּ֔ס דַּ֥ק כַּ/כְּפֹ֖ר עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: de
  text: Als die Tauschicht aufgestiegen war, siehe, da lag auf der Fläche der Wüste etwas Feines, Flockiges[a], fein wie Reif auf dem Boden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »etwas Feines, Schuppenartiges«. Das seltene hebräische Wort ist in seiner genauen Bedeutung unsicher und kann die Beschaffenheit oder das Aussehen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: sich gehoben hatte
  rationale: Das Verb עלה bedeutet wörtlich »hinaufgehen/aufsteigen«. Die Formulierung bewahrt dieses Bild, ohne den Vorgang ausdrücklich als Verdunstung zu erklären.
- source_word: שִׁכְבַת הַטָּל
  choice: die Tauschicht
  rationale: שִׁכְבָה bezeichnet eine Schicht oder lagernde Masse; »Tauschicht« gibt die Wendung knapp und anschaulich wieder.
- source_word: וְהִנֵּה
  choice: siehe, da lag
  rationale: »Siehe« bewahrt die aufmerksamkeitslenkende und überraschende Wirkung von הִנֵּה; »da lag« fügt sich dabei natürlich in den deutschen Satz ein.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: auf der Oberfläche der Wüste
  rationale: פְּנֵי bezeichnet hier die Fläche beziehungsweise Oberfläche; מִדְבָּר wird im Exodus-Kontext angemessen mit »Wüste« wiedergegeben.
- source_word: דַּק
  choice: fein
  rationale: Das Adjektiv kann »fein« oder »dünn« bedeuten. »Fein« passt an beiden Stellen zur sichtbaren Beschaffenheit und erhält die Wiederholung.
- source_word: מְחֻסְפָּס
  choice: Schuppenartiges
  rationale: Das seltene Wort ist in seiner genauen Bedeutung unsicher und beschreibt wohl Aussehen oder Beschaffenheit. »Schuppenartiges« bleibt als substantivierte Beschreibung vorsichtig; »etwas« ergänzt das im Hebräischen nur implizite Bezugswort.
- source_word: דַּק כַּכְּפֹר
  choice: fein wie Reif
  rationale: כְּפֹר bezeichnet Reif beziehungsweise Frost. »Reif« ist im Deutschen für den sichtbaren Belag besonders anschaulich und bewahrt den Vergleich.
- source_word: עַל הָאָרֶץ
  choice: auf dem Boden
  rationale: אֶרֶץ meint in diesem unmittelbaren räumlichen Zusammenhang den Erdboden.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Partikel »siehe« erhält die Lebendigkeit des hebräischen Erzählstils; die zweimalige Wiedergabe von דַּק mit »fein« bewahrt die Wiederholung des Ausgangstextes.
