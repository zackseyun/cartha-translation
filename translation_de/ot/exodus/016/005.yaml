  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/שִּׁשִּׁ֔י וְ/הֵכִ֖ינוּ אֵ֣ת אֲשֶׁר יָבִ֑יאוּ וְ/הָיָ֣ה מִשְׁנֶ֔ה עַ֥ל אֲשֶֽׁר יִלְקְט֖וּ י֥וֹם יֽוֹם־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: de
  text: Am sechsten Tag sollen sie zubereiten, was sie hereinbringen; es wird doppelt so viel sein wie das, was sie Tag für Tag sammeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formnäher: »Es wird eine doppelte Menge gegenüber dem sein, was sie Tag für Tag sammeln.«'
    reason: Die hebräische Vergleichskonstruktion עַל אֲשֶׁר kann idiomatisch mit »doppelt so viel wie« oder formnäher mit »eine doppelte Menge gegenüber dem« wiedergegeben werden.
lexical_decisions:
- source_word: וְהָיָה ... בַּיּוֹם הַשִּׁשִּׁי
  choice: Am sechsten Tag aber sollen sie ...; dann wird es ... sein
  rationale: Die Konstruktion führt eine zukünftige Anweisung samt Ergebnis ein. Die deutsche Gliederung mit »aber« und »dann« gibt den Zusammenhang natürlich wieder, ohne »der Woche« hinzuzufügen.
- source_word: וְהֵכִינוּ
  choice: sollen sie ... zubereiten
  rationale: Das Verb כון im Hifil bezeichnet hier das Vorbereiten beziehungsweise Zubereiten des Eingebrachten. Die Soll-Form entspricht dem anweisenden Zukunftskontext.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: das, was sie nach Hause bringen
  rationale: Die Relativkonstruktion bezeichnet das gesammelte und hereingebrachte Manna. »Nach Hause bringen« macht die Zielrichtung von בוא im Kontext verständlich, ohne einen bestimmten Ort wie das Zelt ausdrücklich einzutragen.
- source_word: וְהָיָה מִשְׁנֶה
  choice: dann wird es doppelt so viel sein
  rationale: מִשְׁנֶה bezeichnet eine doppelte Menge. Diese Formulierung ist im heutigen Deutsch klarer als das wörtlichere »es wird doppelt sein«.
- source_word: עַל אֲשֶׁר יִלְקְטוּ
  choice: wie das, was sie sonst ... sammeln
  rationale: עַל drückt hier den Maßvergleich aus. »Sonst« verdeutlicht, dass die doppelte Menge mit der gewöhnlichen Tagesmenge verglichen wird; dies ergibt sich aus dem distributiven יוֹם יוֹם.
- source_word: יוֹם יוֹם
  choice: Tag für Tag
  rationale: Die Wiederholung hat distributive Bedeutung. »Tag für Tag« bewahrt sowohl den Sinn als auch etwas vom Rhythmus des Hebräischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem hebräischen Ablauf von sechstem Tag, Zubereitung und doppelter Menge, wird jedoch zur besseren Verständlichkeit mit einem Semikolon gegliedert. Der Fußnotenmarker steht unmittelbar nach dem gesamten Satz, da die Alternative die Mengenangabe und nicht »sechster Tag« betrifft.
