revisions:
- from: 'Und Mose sagte: »Dies hat Jahwe geboten: Ein volles Omer davon soll als Erinnerungsstück für alle eure Generationen aufbewahrt werden, damit sie das Brot sehen, mit dem ich euch in der Wüste ernährt habe, als ich euch aus dem Land Ägypten herausführte.«'
  to: 'Und Mose sagte: »Dies ist die Anweisung, die Jahwe geboten hat: Ein volles Omer davon soll für eure Generationen zur Aufbewahrung aufbewahrt werden, damit sie das Brot sehen, mit dem ich euch in der Wüste ernährt habe, als ich euch aus dem Land Ägypten herausführte.«'
  rationale: Die Formulierung für לְמִשְׁמֶרֶת wird von der interpretierenden Wiedergabe »als Erinnerungsstück« zu »zur Aufbewahrung« berichtigt. »Dies ist die Anweisung, die Jahwe geboten hat« bildet זֶה הַדָּבָר אֲשֶׁר צִוָּה angemessen und natürlich ab. Im Übrigen bleibt der Entwurf in seinem Sinngehalt erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:40:19Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Satzbau, Gottesnamen, Maßangabe, Zweckbestimmung und den Gotteswortlaut insgesamt treffend wieder. »Als Erinnerungsstück« für לְמִשְׁמֶרֶת fügt jedoch einen Gegenstandscharakter und eine ausdrücklich erinnernde Funktion hinzu, die das hebräische Wort selbst nicht ausdrückt; es bezeichnet zunächst die Aufbewahrung/Verwahrung.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. »zur Aufbewahrung« ist idiomatisch und genauer als »als Erinnerungsstück«.
  terminology: »Jahwe«, »Omer«, »Brot«, »Wüste« und »Land Ägypten« sind angemessen. Das antike Maß bleibt sinnvoll unübersetzt; »volles Omer« macht die Menge im laufenden Text ausreichend deutlich.
  issues:
