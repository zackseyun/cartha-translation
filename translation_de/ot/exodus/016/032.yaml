  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: de
  text: 'Und Mose sagte: »Dies ist die Anweisung, die Jahwe geboten hat: Ein volles Omer davon soll für eure Generationen zur Aufbewahrung aufbewahrt werden, damit sie das Brot sehen, mit dem ich euch in der Wüste ernährt habe, als ich euch aus dem Land Ägypten herausführte.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Und Mose sagte
  rationale: Gibt die hebräische Erzählfolge natürlich und zugleich formnah wieder.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה
  choice: Dies hat … geboten
  rationale: Das idiomatische deutsche »Dies« gibt den Inhalt der folgenden Anweisung wieder, ohne דָּבָר unnötig wörtlich als »Sache« oder »Wort« festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: Ein volles Omer davon
  rationale: Bewahrt das antike Hohlmaß und gibt מְלֹא als volle Maßeinheit wieder.
- source_word: לְמִשְׁמֶרֶת
  choice: als Erinnerungsstück … aufbewahrt werden
  rationale: Der Ausdruck bezeichnet etwas, das dauerhaft verwahrt wird; im Zusammenhang dient die Aufbewahrung ausdrücklich der Anschauung und Erinnerung künftiger Generationen.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Bezeichnet die fortdauernde Bewahrung über die aufeinanderfolgenden Generationen Israels hinweg.
- source_word: לְמַעַן יִרְאוּ
  choice: damit sie … sehen
  rationale: Bewahrt den finalen Sinn; das unausgesprochene Subjekt sind die zuvor genannten Generationen.
- source_word: הַלֶּחֶם
  choice: das Brot
  rationale: Bewahrt die konkrete Bezeichnung לֶחֶם statt sie allgemein als »Nahrung« wiederzugeben.
- source_word: אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: mit dem ich euch … ernährt habe
  rationale: Gibt den kausativen Stamm von אכל natürlich als Gottes Versorgung mit Nahrung wieder.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Übliche und kontextgerechte deutsche Wiedergabe des biblischen מִדְבָּר.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: als ich euch aus dem Land Ägypten herausführte
  rationale: Gibt die temporale Infinitivkonstruktion und den Exodusbezug klar wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; »Jahwe« bewahrt hier den Charakter eines persönlichen Bundesnamens.
- issue: Bezug des göttlichen Ichs in »ich euch … ernährt habe«
  choice: Der direkte Gotteswortlaut bleibt in der ersten Person stehen
  alternative: mit dem Jahwe euch ernährt hat
  rationale: Mose zitiert den von Jahwe gebotenen Wortlaut; die erste Person wahrt den Übergang innerhalb der direkten Rede und löst die Spannung nicht durch Umformulierung auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das antike Maß »Omer« bleibt unübersetzt; da der Vers selbst keine Umrechnung bietet und die Bedeutung »volles Maß« im Text klar ausgedrückt wird, ist keine Fußnote nötig.
