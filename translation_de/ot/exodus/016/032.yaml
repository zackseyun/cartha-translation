    issue: »als Erinnerungsstück« für לְמִשְׁמֶרֶת
    rationale: Das hebräische לְמִשְׁמֶרֶת bedeutet „zur Aufbewahrung/Verwahrung“. Zwar dient die Bewahrung im folgenden Zweckzusammenhang dem Sehen künftiger Generationen, aber „Erinnerungsstück“ ist eine zusätzliche, spezifischere Deutung und sollte nicht in die Übersetzung eingetragen werden.
  revised_text: 'Und Mose sagte: »Dies ist die Anweisung, die Jahwe geboten hat: Ein volles Omer davon soll für eure Generationen zur Aufbewahrung aufbewahrt werden, damit sie das Brot sehen, mit dem ich euch in der Wüste ernährt habe, als ich euch aus dem Land Ägypten herausführte.«'
