  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: de
  text: 'Und Mose sagte zu Aaron: „Nimm ein Gefäß[a] und gib ein volles Omer Manna hinein. Stell es vor Jahwe, damit es über eure Generationen hinweg aufbewahrt wird.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Krug“ beziehungsweise „einen Topf“. Die genaue Art des hier bezeichneten Gefäßes ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: Gefäß
  rationale: Das seltene Substantiv bezeichnet allgemein ein Behältnis. „Gefäß“ ist im Deutschen natürlich und legt weder Material noch eine Verwendung als Kochgeschirr fest.
- source_word: מְלֹא הָעֹמֶר
  choice: ein volles Omer
  rationale: מְלֹא bezeichnet die volle Menge, עֹמֶר ein Trockenmaß. „Ein volles Omer“ bewahrt Maßangabe und Füllgedanken.
- source_word: מָן
  choice: Manna
  rationale: Die im Deutschen etablierte Bezeichnung für die in diesem Zusammenhang genannte Speise.
- source_word: וְתֶן שָׁמָּה
  choice: fülle ... hinein
  rationale: Wörtlich steht „gib/lege dorthin“; der Zielbezug gilt dem zuvor genannten Gefäß. Die deutsche Formulierung gibt diesen Bezug klar und idiomatisch wieder.
- source_word: וְהַנַּח אֹתוֹ
  choice: Stell es
  rationale: Das Verb bedeutet, etwas hinzulegen, hinzustellen oder zu platzieren. Bei einem Gefäß ist „stell es“ natürlich.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bedeutet hier „vor“ beziehungsweise „in der Gegenwart von“; die knappe räumlich-kultische Wendung bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, entsprechend dem hebräischen Tetragramm.
- source_word: לְמִשְׁמֶרֶת
  choice: damit es ... aufbewahrt wird
  rationale: Das Substantiv bezeichnet Verwahrung oder Bewahrung. Der Zwecksatz gibt die Funktion im Deutschen natürlich wieder.
- source_word: לְדֹרֹתֵיכֶם
  choice: für alle eure Generationen
  rationale: Die Wendung bezeichnet die fortdauernde Bewahrung über die aufeinanderfolgenden Generationen Israels hinweg.
- source_word: קַח ... אַחַת
  choice: Nimm ein Gefäß
  rationale: Das Zahlwort steht beim femininen Substantiv und bezeichnet ein einzelnes Gefäß; im Deutschen genügt der unbestimmte Artikel, ohne den Sinn zu verändern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ wahrt dessen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Imperativkette. „Omer“ bleibt als antikes Maß erhalten; „Gefäß“ bewahrt die lexikalische Unbestimmtheit.
