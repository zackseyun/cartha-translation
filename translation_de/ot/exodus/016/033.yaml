  naturalness: Modernes Standarddeutsch und ein passender würdevoller Register. „Fülle ... hinein“ ist verständlich, legt jedoch stärker eine Tätigkeit des Füllens nahe, während der hebräische Text schlicht das Hineingeben der abgemessenen Menge ausdrückt. „Gib ... hinein“ ist genauer und ebenso idiomatisch.
  terminology: „Omer“, „Manna“ und „Jahwe“ sind konsistent und sachgerecht. Die Fußnote zu „Gefäß“ ist hilfreich und vorsichtig formuliert.
