source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: de
  text: 'Seht: Jahwe hat euch den Sabbat gegeben. Darum gibt er euch am sechsten Tag Brot für zwei Tage. Jeder soll bleiben, wo er ist; niemand soll am siebten Tag seinen Platz verlassen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: Seht
  rationale: Der Imperativ Plural kann zum Sehen wie auch zum Erkennen auffordern. „Seht“ bewahrt die unmittelbare Aufforderung; der folgende Satz erschließt ihren Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: hat euch den Sabbat gegeben
  rationale: Die Form bezeichnet hier eine vollzogene Gabe; die deutsche Wortfolge ist natürlich und bewahrt den Gedanken, dass der Sabbat Israel geschenkt wurde.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die Wendung kennzeichnet eine Folgerung. „Darum“ gibt den logischen Zusammenhang klar und idiomatisch wieder.
- source_word: נֹתֵן
  choice: gibt
  rationale: Das Partizip beschreibt die gegenwärtige beziehungsweise regelmäßig geltende Versorgung am sechsten Tag.
- source_word: לֶחֶם יוֹמָיִם
  choice: Brot für zwei Tage
  rationale: Die konkrete Bezeichnung „Brot“ bleibt erhalten; „für zwei Tage“ gibt die knappe hebräische Verbindung verständlich wieder.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Jeder soll bleiben, wo er ist
  rationale: ישב bedeutet im Zusammenhang „bleiben“, und תַּחְתָּיו ist idiomatisch als „wo er ist“ zu verstehen. Die Wiedergabe ist natürlich und vermeidet die im Deutschen missverständliche räumliche Vorstellung von „an seinem Platz“.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: niemand soll seinen Platz verlassen
  rationale: Die negative Jussivkonstruktion ist ein Verbot. „Niemand“ erfasst den distributiven Sinn von אִישׁ im heutigen Deutschen, während „seinen Platz“ die Wiederaufnahme der Ortsangabe bewahrt.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: am siebten Tag
  rationale: Die Zeitangabe wird ohne erklärenden Zusatz eng am Hebräischen wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Distributiver Gebrauch von אִישׁ
  choice: Jeder / niemand
  alternative: jeder Mann / kein Mann
  rationale: אִישׁ steht hier in Anweisungen an die ganze Gemeinschaft distributiv. Die geschlechtsübergreifenden deutschen Indefinitpronomen geben diesen tatsächlichen Umfang natürlich wieder, ohne aus dem grammatischen Maskulinum eine Beschränkung auf Männer abzuleiten.
- issue: Reichweite des Verbots, den eigenen Ort zu verlassen
  choice: Textnah ohne nähere räumliche Definition
  alternative: Niemand soll sein Zelt beziehungsweise Lager verlassen
  rationale: מְקוֹמוֹ bedeutet „sein Ort/Platz“; der Vers bestimmt nicht ausdrücklich, ob damit Zelt, Lagerstelle oder ein weiterer Aufenthaltsbereich gemeint ist. Die Übersetzung löst diese Unbestimmtheit nicht auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Kurze Hauptsätze entsprechen dem nachdrücklichen Weisungscharakter. Der Doppelpunkt nach „Seht“ lässt die folgende Aussage als Inhalt der geforderten Erkenntnis hervortreten; der Satzpunkt vor „Darum“ vermeidet im Deutschen eine schwerfällige Verknüpfung. Keine Fußnote ist nötig, da die distributive Bedeutung von אִישׁ durch „jeder/niemand“ unmittelbar und sachgerecht ausgedrückt wird.
