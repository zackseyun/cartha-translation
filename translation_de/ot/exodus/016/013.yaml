  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: de
  text: Am Abend kamen die Wachteln herauf und bedeckten das Lager, und am Morgen lag rings um das Lager eine Schicht Tau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Am Abend
  rationale: Die Erzählform mit היה führt das nächste Geschehen ein; im modernen Deutschen gibt die schlichte Zeitangabe den Sinn natürlich wieder.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: kamen die Wachteln herauf
  rationale: עלה bezeichnet ein Hinauf- oder Heraufkommen. Der Plural „Wachteln“ gibt das hebräische Kollektiv im Deutschen idiomatisch wieder und bewahrt zugleich das Bewegungsbild.
- source_word: וַתְּכַס אֶת הַמַּחֲנֶה
  choice: und bedeckten das Lager
  rationale: כסה bedeutet „bedecken“; „Lager“ ist die natürliche Entsprechung von מַחֲנֶה. Das deutsche Verb steht wegen des pluralischen „Wachteln“ im Plural.
- source_word: וּבַבֹּקֶר
  choice: und am Morgen
  rationale: Die Formulierung bewahrt die parallele zeitliche Gliederung des hebräischen Satzes.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: lag eine Schicht Tau
  rationale: שִׁכְבַת bezeichnet eine liegende Schicht. „Eine Schicht Tau lag“ ist im Deutschen anschaulich und natürlicher als eine rein kopulative Wiedergabe mit „war“.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: rings um das Lager
  rationale: Die Wendung bezeichnet die Umgebung des Lagers; „rings um“ gibt den umlaufenden räumlichen Sinn prägnant wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Die beiden Zeitangaben „Am Abend“ und „am Morgen“ spiegeln den hebräischen Parallelismus; unnötige altertümliche Formulierungen wurden vermieden.
