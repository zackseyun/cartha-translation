  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: de
  text: 'Da sagte Mose zu Aaron: „Sag zur ganzen Gemeinschaft der Israeliten: ‚Tretet vor Jahwe, denn er hat euer Murren gehört.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Narrativ-Waw führt die Handlung weiter. „Da sagte“ gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: zur ganzen Gemeinschaft der Israeliten
  rationale: עֵדָה bezeichnet die versammelte Gemeinschaft; „Gemeinschaft“ bewahrt den kollektiven Sinn. בְּנֵי יִשְׂרָאֵל wird idiomatisch und inklusiv als „Israeliten“ wiedergegeben.
- source_word: קִרְבוּ לִפְנֵי
  choice: Tretet vor
  rationale: Die Verbindung fordert dazu auf, sich in die Gegenwart Jahwes zu begeben. „Tretet vor“ ist knapp, würdig und bewahrt sowohl die räumliche Annäherung als auch den Bezug auf seine Gegenwart.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner verbreiteten wissenschaftlichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי שָׁמַע
  choice: denn er hat ... gehört
  rationale: כִּי begründet die Aufforderung; das Perfekt שָׁמַע bezeichnet ein abgeschlossenes Hören mit unmittelbarer Bedeutung für die gegenwärtige Situation.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: euer Murren
  rationale: „Murren“ bezeichnet nicht nur sachliche Beschwerden, sondern gibt auch den im Kontext vorhandenen Unterton missmutigen, widersetzlichen Klagens wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich der Eigenname Gottes. „Jahwe“ bewahrt diesen Namen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede und die darin eingebettete Botschaft Aarons bleiben klar voneinander abgegrenzt.
