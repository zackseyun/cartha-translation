  text: And you shall set up the courtyard all around[a], and put up the screen for the gate of the courtyard.
translation:
  language: de
  text: Du sollst den Vorhof ringsum errichten und den Vorhang[a] am Tor des Vorhofs anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Vorhang am Eingang des Vorhofs«; das hebräische Wort מָסָךְ bezeichnet einen aufgehängten Abschluss am Eingang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Dann sollst du … errichten
  rationale: שׂים bedeutet grundsätzlich »setzen, stellen, anbringen«. Im Zusammenhang mit der Aufrichtung des Heiligtums gibt »errichten« die Anordnung des Vorhofs natürlich und konkret wieder; וְ setzt hier die Folge der Anweisungen fort.
- source_word: הֶחָצֵר
  choice: den Vorhof
  rationale: חָצֵר bezeichnet hier den das Heiligtum umgebenden Hof. »Vorhof« ist im Deutschen die geläufige und sachlich passende Bezeichnung für diesen Bereich.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet eine umfassende, umgebende Anordnung. »Ringsum« ist knapp, idiomatisch und bewahrt diesen Sinn.
- source_word: וְנָתַתָּ
  choice: und … anbringen
  rationale: נתן hat das breite Bedeutungsspektrum »geben, setzen, anbringen«. Bei einem textilen Abschluss am Eingang bezeichnet »anbringen« die konkrete Installation treffend.
- source_word: מָסַךְ
  choice: den Vorhang
  rationale: מָסָךְ bezeichnet im Heiligtumskontext einen aufgehängten textilen Abschluss beziehungsweise Sichtschutz an einem Eingang. »Vorhang« ist im modernen Deutschen klar und vermeidet die mögliche Fehlvorstellung eines festen Schirms.
- source_word: שַׁעַר
  choice: am Tor
  rationale: שַׁעַר bezeichnet den Tor- oder Eingangsbereich. »Am Tor« bewahrt das konkrete Bild, obwohl der Abschluss selbst aus Stoff besteht.
- source_word: שַׁעַר הֶחָצֵר
  choice: am Tor des Vorhofs
  rationale: Die Constructusverbindung bestimmt das Tor als dasjenige des Vorhofs; die deutsche Genitivverbindung gibt dies direkt wieder.
