translation_notes:
  register: Moderne, würdige Anweisungssprache. »Vorhof«, »Tor« und »Vorhang« bleiben anschaulich und entsprechen dem kultischen Baukontext. Der Fußnotenmarker steht unmittelbar nach dem Satz, auf den sich die lexikalische Alternative bezieht.
