revisions:
- from: Mose tat alles so, wie Jahwe es ihm geboten hatte[a]; genauso tat er es.
  to: Mose tat alles, was Jahwe ihm geboten hatte[a]; so tat er es.
  rationale: Die Umformulierung gibt כְּכֹל אֲשֶׁר unmittelbar als „alles, was“ wieder und erhält mit „so tat er es“ die emphatische Wiederholung von עשה am Versschluss. Bedeutung, Register, Gottesname und Fußnotenanker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T07:15:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Aussage wird im Wesentlichen richtig wiedergegeben: Mose führt vollständig aus, was Jahwe ihm geboten hat; die abschließende Wiederholung betont dies. Die Konstruktion „alles so, wie“ ist jedoch gegenüber כְּכֹל אֲשֶׁר weniger unmittelbar und erzeugt zusammen mit „genauso“ eine unnötige doppelte Vergleichsformel.'
  naturalness: „Mose tat alles, was Jahwe ihm geboten hatte; so tat er es“ ist modernes, würdiges und idiomatisches Standarddeutsch. Es bewahrt zugleich die im Hebräischen absichtlich wiederholte Formel.
  terminology: „Mose“ und „Jahwe“ sind angemessen. „Geboten hatte“ gibt צִוָּה samt dem im Deutschen natürlichen zeitlichen Vorverhältnis treffend wieder. Die Fußnote zum Tetragramm ist sachlich und korrekt verankert.
  issues:
  - severity: low
    issue: Doppelte Vergleichsformel in „Mose tat alles so, wie …; genauso tat er es“
    rationale: Das Hebräische sagt zunächst „gemäß allem, was“ und schließt dann mit „so tat er“. Die deutsche Fassung häuft mit „so, wie“ und „genauso“ Vergleichsausdrücke an. „Alles, was …; so tat er es“ bildet die Syntax und die Schlussbetonung klarer ab.
  revised_text: Mose tat alles, was Jahwe ihm geboten hatte[a]; so tat er es.
  revised_footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  revision_rationale: Die Umformulierung gibt כְּכֹל אֲשֶׁר unmittelbar als „alles, was“ wieder und erhält mit „so tat er es“ die emphatische Wiederholung von עשה am Versschluss. Bedeutung, Register, Gottesname und Fußnotenanker bleiben erhalten.
