  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: de
  text: Mose tat alles, was Jahwe ihm geboten hatte[a]; so tat er es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: tat
  rationale: עשה bezeichnet hier die Ausführung des Gebotenen; „tat“ gibt den allgemeinen Vollzug wieder und ermöglicht zugleich die bewusste Wiederholung am Versende.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im modernen Standarddeutsch übliche Form des Personennamens.
- source_word: כְּכֹל
  choice: alles so, wie
  rationale: Die Formulierung drückt vollständige Übereinstimmung mit allem Gebotenen aus und klingt im Deutschen natürlich.
- source_word: אֲשֶׁר
  choice: wie
  rationale: Leitet zusammen mit der Vergleichspartikel die Aussage ein, an deren Inhalt Moses Handeln ausgerichtet ist.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: „Gebieten“ passt zum verbindlichen göttlichen Auftrag; das Plusquamperfekt verdeutlicht im Deutschen natürlich, dass das Gebot dem Handeln vorausging, ohne den Sinn zu verändern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֹתוֹ
  choice: ihm
  rationale: Das hebräische Objekt bezeichnet Mose als Empfänger des Gebots; beim deutschen Verb „gebieten“ ist dafür der Dativ idiomatisch.
- source_word: כֵּן
  choice: genauso
  rationale: Greift die zuvor beschriebene Übereinstimmung nachdrücklich wieder auf.
- source_word: עָשָׂה
  choice: tat er es
  rationale: Bewahrt die rhetorische Wiederholung von עשה und unterstreicht Moses genaue Ausführung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; die traditionelle Ersatzwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Natürliches, würdiges modernes Standarddeutsch. Die Wiederholung des Verbs „tun“ wird trotz leichter stilistischer Schwere beibehalten, weil sie die nachdrückliche Schlussformel des Hebräischen wiedergibt.
