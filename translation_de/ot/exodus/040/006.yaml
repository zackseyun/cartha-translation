  text: וְ/נָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה לִ/פְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: de
  text: Und du sollst den Brandopferaltar vor dem Eingang der Wohnung, des Zeltes der Begegnung, aufstellen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָתַתָּה
  choice: Und du sollst … stellen
  rationale: נתן kann »geben, setzen, stellen« bedeuten. Bei der Anordnung von Einrichtungsgegenständen bezeichnet »stellen« im Deutschen die räumliche Platzierung natürlich und genau.
- source_word: מִזְבַּח הָ/עֹלָה
  choice: den Brandopferaltar
  rationale: Die deutsche Zusammensetzung »Brandopferaltar« gibt die Konstruktverbindung idiomatisch wieder und bezeichnet den für Brandopfer bestimmten Altar.
- source_word: לִ/פְנֵי
  choice: vor
  rationale: לִפְנֵי bezeichnet hier eine räumliche Lage vor beziehungsweise gegenüber dem Eingang; »vor« ist prägnant und bewahrt diese Relation.
- source_word: פֶּתַח
  choice: den Eingang
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Zugang. »Eingang« ist hier die klarste heutige Formulierung.
- source_word: מִשְׁכַּן
  choice: der Wohnung
  rationale: מִשְׁכָּן ist von der Vorstellung des Wohnens abgeleitet und bezeichnet in Exodus das Heiligtum als Gottes Wohnung. »Wohnung« bewahrt diese Bedeutung und ist im Kontext verständlich.
- source_word: אֹהֶל מוֹעֵד
  choice: des Zeltes der Begegnung
  rationale: Die feste Bezeichnung wird wörtlich und zugleich natürlich als »Zelt der Begegnung« wiedergegeben; sie lässt offen, dass מוֹעֵד sowohl die festgesetzte Zusammenkunft als auch den Begegnungsort bezeichnet.
theological_decisions:
- issue: Verhältnis von מִשְׁכַּן und אֹהֶל מוֹעֵד
  choice: »der Wohnung, des Zeltes der Begegnung« als appositionelle Bezeichnung
  alternative: »der Wohnung des Zeltes der Begegnung« als engere Genitivverbindung
  rationale: Die hebräische Folge kann knapp mehrere Heiligtumsbezeichnungen aneinanderreihen. Die Apposition bewahrt die Spannung, ohne eine bauliche oder theologische Beziehung stärker festzulegen, als der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute kultische Bezeichnung »Brandopferaltar« wird beibehalten; »Wohnung« macht den Bedeutungsgehalt von מִשְׁכָּן sichtbar. Keine Fußnote ist nötig, da die räumliche Alternative »vor/in front of« im Deutschen durch »vor« abgedeckt ist.
