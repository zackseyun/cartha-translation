lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Und er brachte … an
  rationale: שׂוּם bedeutet „setzen, stellen, anbringen“. Bei einem Vorhang am Eingang gibt „anbringen“ die Installation im natürlichen modernen Deutsch präzise wieder.
- source_word: מָסַךְ
  choice: Vorhang
  rationale: מָסָךְ bezeichnet hier den als Sicht- und Zugangsabschluss dienenden Stoffbehang am Eingang. „Vorhang“ ist im Deutschen natürlicher als „Schirm“ und bleibt von פָּרֹכֶת als innerem Vorhang sachlich durch den Kontext unterschieden.
- source_word: הַפֶּתַח
  choice: am Eingang
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang. Die Wendung „am Eingang“ gibt die räumliche Zuordnung idiomatisch wieder.
- source_word: לַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן ist wörtlich die „Wohnung“ beziehungsweise „Wohnstätte“. „Wohnung“ bewahrt den Bezug zum Wohnen Gottes und ist in diesem kultischen Kontext verständlich; das ל wird zusammen mit הַפֶּתַח als „Eingang der Wohnung“ wiedergegeben.
