lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Erzählform von היה mit vorangestelltem ו führt das nächste Ereignis ein. „Und es geschah“ bewahrt den hebräischen Erzählfluss in würdigem, verständlichem Deutsch.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: im ersten Monat
  rationale: חֹדֶשׁ bezeichnet in dieser kalendarischen Datumsangabe einen Monat; der bestimmte Artikel und die Ordnungszahl ergeben „im ersten Monat“.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: des zweiten Jahres
  rationale: Die Wendung bestimmt das Jahr der Datumsangabe näher. Im Zusammenhang mit „im ersten Monat“ ist der deutsche Genitiv natürlich und präzise.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des Monats
  rationale: Die wörtlich ungewöhnliche hebräische Datumsformel „am Eins des Monats“ bezeichnet idiomatisch den ersten Tag des Monats.
- source_word: הוּקַם
  choice: aufgerichtet wurde
  rationale: Der Hofal von קום ist passiv und bedeutet hier, dass die Stiftshütte aufgestellt beziehungsweise errichtet wurde. „Aufgerichtet“ passt sachlich zum Aufbau des Heiligtums.
- source_word: הַמִּשְׁכָּן
  choice: die Stiftshütte
  rationale: מִשְׁכָּן bezeichnet hier das tragbare Heiligtum Israels. „Stiftshütte“ ist der etablierte deutsche Bibelbegriff und wahrt die kultische Spezifik.
