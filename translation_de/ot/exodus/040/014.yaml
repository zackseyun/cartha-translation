  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: de
  text: Und seine Söhne sollst du herbeiführen[a] und sie mit Tuniken bekleiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vorführen“ oder „nahe bringen“. Das hebräische Verb kann im kultischen Zusammenhang ein förmliches Heranführen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Auch
  rationale: Die Konjunktion führt zusammen mit dem Akkusativzeichen den nächsten Gegenstand der fortlaufenden Anweisung ein. Im Deutschen gibt „Auch“ den Anschluss an Aarons zuvor genannte Einkleidung natürlich wieder.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: Das Substantiv bezeichnet hier männliche Nachkommen und bezieht sich im priesterlichen Zusammenhang auf Aarons Söhne.
- source_word: תַּקְרִיב
  choice: sollst du herantreten lassen
  rationale: Der Hifil von קרב bedeutet, jemanden nahe heranzubringen beziehungsweise vortreten zu lassen. Die Formulierung bewahrt den förmlichen kultischen Klang, ohne eine über den Wortlaut hinausgehende Deutung einzutragen.
- source_word: וְהִלְבַּשְׁתָּ
  choice: und ihnen … anziehen
  rationale: Die Kausativform bezeichnet das Bekleiden einer Person. Die deutsche Wendung „jemandem etwas anziehen“ ist natürlich und gibt diesen Sinn präzise wieder.
- source_word: אֹתָם
  choice: ihnen
  rationale: Das Objektpronomen verweist auf die Söhne; wegen der deutschen Konstruktion „jemandem ein Kleidungsstück anziehen“ steht es idiomatisch im Dativ.
- source_word: כֻּתֳּנֹת
  choice: Untergewänder
  rationale: כֻּתֹּנֶת bezeichnet ein am Körper getragenes Kleidungsstück. Im Zusammenhang der Priesterkleidung ist „Untergewänder“ präziser als das im modernen Deutschen missverständliche „Tuniken“; Leinen wird in diesem Vers nicht ausdrücklich genannt.
theological_decisions:
- issue: Priesterlich-kultische Nuance von קרב
  choice: herantreten lassen
  alternative: vorführen / nahe bringen
  rationale: Die Anweisung gehört zur Einsetzung und Einkleidung der Priester. „Herantreten lassen“ erhält die mögliche kultische Förmlichkeit und bleibt zugleich im heutigen Deutsch verständlich, ohne ausdrücklich eine Darbringung oder Weihe in das Verb hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt „seine Söhne“ als nächsten Gegenstand der Anweisung hervor. „Untergewänder“ entspricht dem priesterlichen Kleidungskontext, ohne nicht ausdrücklich genanntes Material hinzuzufügen.
