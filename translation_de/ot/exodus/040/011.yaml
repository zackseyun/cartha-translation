lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Du sollst … salben
  rationale: משׁח bezeichnet hier die rituelle Salbung mit Öl. „Salben“ ist im Deutschen geläufig und gibt den kultischen Vorgang präzise wieder; das vorangestellte ו wird innerhalb der fortlaufenden Anweisung natürlich durch die Satzverknüpfung wiedergegeben.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: כִּיּוֹר bezeichnet das Waschbecken am Heiligtum. „Becken“ ist modernes, verständliches Deutsch und gegenüber dem altertümlichen „Waschfass“ vorzuziehen.
- source_word: כַּנּוֹ
  choice: sein Gestell
  rationale: כֵּן bezeichnet hier die tragende Konstruktion des Beckens. „Gestell“ ist anschaulich und kontextgerecht; „Sockel“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: und es heiligen
  rationale: קדשׁ im Piel bedeutet, etwas für den heiligen Gebrauch auszusondern. „Heiligen“ bewahrt die direkte Verbindung zum Begriff der Heiligkeit; das singularische „es“ nimmt das Becken samt zugehörigem Gestell als Einheit auf.
theological_decisions:
- issue: Wiedergabe von קדשׁ im kultischen Zusammenhang des Heiligtums
  choice: heiligen
  alternative: weihen
  rationale: „Heiligen“ wahrt die konkrete Aussage, dass der Gegenstand für den heiligen Gebrauch ausgesondert wird, ohne eine moralische Veränderung zu unterstellen. „Weihen“ ist idiomatischer möglich, aber etwas interpretierender.
- issue: Bezug des singularischen אֹתוֹ
  choice: es bezieht sich auf das Becken mitsamt seinem zugehörigen Gestell als Ausstattungseinheit
  alternative: es bezieht sich ausschließlich auf das Becken
  rationale: Nach der zusammengesetzten Objektgruppe steht ein singularisches Pronomen. Die Übersetzung erhält diese grammatische Spannung, statt sie durch einen Plural oder eine Wiederholung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Anweisungsform und die kultische Begrifflichkeit des Hebräischen bleiben erhalten; altertümliche Ausdrücke werden vermieden.
