source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: de
  text: Da bedeckte die Wolke das Zelt der Begegnung, und die Herrlichkeit Jahwes[a] erfüllte die Stiftshütte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; die genaue ursprüngliche Aussprache des Gottesnamens ist nicht sicher. Traditionell wird er auch mit „der HERR“ wiedergegeben.
    reason: Erläuterung zur Wiedergabe des Tetragramms
lexical_decisions:
- source_word: וַיְכַס
  choice: Da bedeckte
  rationale: Das Verb כסה bedeutet hier konkret „bedecken“. „Da“ gibt den erzählenden Anschluss des Waw-Konsekutivs natürlich wieder.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Artikel wird beibehalten; gemeint ist die aus dem bisherigen Erzählzusammenhang bekannte Wolke.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die Wendung gibt die Funktion des Zeltes als Ort der Begegnung transparent wieder und ist im modernen Deutschen verständlich.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: „Herrlichkeit“ bewahrt den gewichtigen theologischen Gehalt von כָּבוֹד, während „Jahwes“ den im Text stehenden Gottesnamen wiedergibt.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Das Verb beschreibt, dass die Herrlichkeit die Wohnstätte ganz einnahm. „Erfüllte“ ist im Deutschen idiomatisch und bewahrt die transitive Satzstruktur.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnstätte
  rationale: „Wohnstätte“ bildet die Grundbedeutung von מִשְׁכָּן ab, bleibt würdevoll und unterscheidet diesen Ausdruck vom unmittelbar zuvor genannten „Zelt der Begegnung“, ohne das heute erklärungsbedürftige „Stiftshütte“ zu verwenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH, nicht den Titel „Herr“. „Jahwe“ wahrt diese Unterscheidung; die Fußnote weist auf die sprachgeschichtlich nicht völlig gesicherte Aussprache hin.
- issue: Verhältnis von Gottes Herrlichkeit zur Wohnstätte
  choice: „die Herrlichkeit Jahwes erfüllte die Wohnstätte“
  alternative: Gottes Gegenwart erfüllte die Wohnstätte
  rationale: Die konkrete Aussage des Textes über כְבוֹד („Herrlichkeit“) wird nicht deutend zu „Gegenwart“ aufgelöst. So bleibt die Bildsprache und ihre theologische Spannung erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Zelt der Begegnung“ und „Wohnstätte“ halten die beiden unterschiedlichen hebräischen Bezeichnungen auseinander; „Stiftshütte“ wurde wegen seiner heutigen Unklarheit vermieden.
