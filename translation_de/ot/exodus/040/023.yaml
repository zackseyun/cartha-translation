  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Dann legte er darauf das Brot in geordneter Anordnung[a] vor Jahwe aus, genauso wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Anordnung des Brotes“; traditionell: „die Schaubrote“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: legte … aus
  rationale: Das Verb ערך bezeichnet hier das geordnete Auflegen beziehungsweise Anordnen des Brotes auf dem Tisch. „Auslegen“ ist im Deutschen natürlich und lässt zusammen mit „geordnet“ den kultischen Ordnungssinn erkennen.
- source_word: עָלָיו
  choice: darauf
  rationale: Das Pronomen verweist auf den Tisch aus dem vorhergehenden Vers. „Darauf“ gibt den räumlichen Bezug knapp und idiomatisch wieder.
- source_word: עֵרֶךְ לֶחֶם
  choice: das Brot geordnet
  rationale: Die Wendung bezeichnet wörtlich eine geordnete Anordnung von Brot. Die adverbiale Wiedergabe ist verständliches Deutsch und vermeidet die unbelegte Festlegung auf nur eine Reihe.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die kultische Wendung bedeutet „vor“ beziehungsweise „in der Gegenwart“ Jahwes. „Vor Jahwe“ ist knapp und wahrt den räumlich-kultischen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: genauso wie Jahwe Mose geboten hatte
  rationale: „Genauso wie“ hebt die genaue Übereinstimmung mit der zuvor erteilten Anweisung hervor; das Plusquamperfekt entspricht diesem zeitlichen Rückbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den Charakter als persönlicher Gottesname, ohne ihn durch einen Titel zu ersetzen.
- issue: Kultische Bezeichnung des Brotes
  choice: das Brot geordnet
  alternative: die Schaubrote
  rationale: Der Vers verwendet עֵרֶךְ לֶחֶם, nicht die sonst gebräuchliche feste Wendung לֶחֶם הַפָּנִים. Daher wird die konkrete Anordnung beschrieben, ohne die traditionelle Deutung zum Haupttext zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt leicht feierlich, aber verständlich; „darauf“ stellt den Zusammenhang mit dem Tisch im vorhergehenden Vers her.
