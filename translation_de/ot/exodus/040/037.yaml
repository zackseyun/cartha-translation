  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: de
  text: Doch wenn die Wolke nicht aufstieg, brachen sie nicht auf bis zu dem Tag, an dem sie aufstieg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „bis zum Tag ihres Aufsteigens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die Verbindung aus Konjunktion und Bedingungspartikel führt den Gegensatz zum vorherigen Vers ein; „Doch wenn“ gibt diesen Zusammenhang natürlich wieder.
- source_word: לֹא יֵעָלֶה
  choice: nicht aufstieg
  rationale: Das Imperfekt bezeichnet hier im erzählenden Zusammenhang den wiederholten Fall in der Vergangenheit. „Aufsteigen“ wahrt die Grundbedeutung von עלה, ohne eine nicht zwingende passive Bedeutung einzutragen.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Die bestimmte Form verweist auf die bereits eingeführte Wolke der göttlichen Gegenwart.
- source_word: וְלֹא יִסְעוּ
  choice: brachen sie nicht auf
  rationale: נסע bezeichnet im Zusammenhang von Lager und Wanderung den Aufbruch; „aufbrechen“ ist im Deutschen präzise und idiomatisch.
- source_word: עַד יוֹם
  choice: bis zu dem Tag
  rationale: Die Wiedergabe bewahrt das ausdrücklich genannte „Tag“ und den zeitlichen Grenzpunkt.
- source_word: הֵעָלֹתוֹ
  choice: an dem sie aufstieg
  rationale: Der Infinitivus constructus mit Suffix bedeutet wörtlich „ihres Aufsteigens“; ein Relativsatz ist im modernen Deutschen natürlicher. Das feminine Pronomen bezieht sich eindeutig auf „die Wolke“.
