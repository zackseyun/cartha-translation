  source_fidelity: Die Übersetzung gibt die beiden temporalen Infinitivkonstruktionen mit possessivem Suffix angemessen iterativ wieder („Sooft …“), bewahrt die Parallelität der Satzglieder und gibt das habituale Imperfekt יִרְחָצוּ idiomatisch als vergangene wiederholte Handlung wieder. „wuschen sie sich“ ergänzt keinen im Vers genannten Körperteil und wahrt damit die Knappheit des Hebräischen. Die Relation zu dem zuvor ergangenen Befehl wird mit „geboten hatte“ zutreffend ausgedrückt.
  naturalness: Der Satz ist klares, modernes und zugleich würdiges Standarddeutsch. Die doppelte Verwendung von „sooft“ ist stilistisch vertretbar und macht den wiederholten Vollzug sowie die hebräische Parallelstruktur deutlich. „in das Zelt der Begegnung hineingingen“ und „an den Altar herantraten“ unterscheiden die beiden Bewegungen präzise.
  terminology: „Zelt der Begegnung“, „Altar“, „Mose“ und „Jahwe“ sind im gegebenen Übersetzungsrahmen konsistent und sachgerecht. „Jahwe“ gibt das Tetragramm als Eigenname wieder. „ganz wie“ entspricht כַּאֲשֶׁר natürlich und ohne zusätzliche Auslegung.
