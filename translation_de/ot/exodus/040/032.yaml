  text: בְּ/בֹאָ֞/ם אֶל אֹ֣הֶל מוֹעֵ֗ד וּ/בְ/קָרְבָתָ֛/ם אֶל הַ/מִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Sooft sie in das Zelt der Begegnung hineingingen und sooft sie an den Altar herantraten, wuschen sie sich, ganz wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Sooft sie … hineingingen
  rationale: ב mit Infinitivus constructus und Suffix bezeichnet einen zeitlichen Umstand. „Sooft“ gibt im erzählenden Rückblick den wiederholten priesterlichen Vollzug natürlich wieder.
- source_word: אֹהֶל מוֹעֵד
  choice: das Zelt der Begegnung
  rationale: Die etablierte deutsche Wiedergabe bewahrt den Gedanken des bestimmten Ortes, an dem Jahwe Israel begegnet.
- source_word: וּבְקָרְבָתָם
  choice: und sooft sie … herantraten
  rationale: Die parallele Konstruktion bezeichnet wiederum einen wiederholten zeitlichen Umstand; „herantreten“ entspricht dem kultischen Nahen an den Altar.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: Der bestimmte Artikel wird wiedergegeben; im Kontext ist der betreffende Altar eindeutig.
- source_word: יִרְחָצוּ
  choice: wuschen sie sich
  rationale: Das Imperfekt beschreibt hier gewohnheitsmäßiges Handeln in einem vergangenen Erzählzusammenhang. Das reflexive „sich waschen“ ist im Deutschen idiomatisch und lässt den im Kontext bekannten Umfang der Waschung offen.
- source_word: כַּאֲשֶׁר
  choice: ganz wie
  rationale: Die Formulierung bringt die genaue Übereinstimmung des Handelns mit dem zuvor erteilten Gebot klar und natürlich zum Ausdruck.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Jahwes Gebot dem beschriebenen Vollzug vorausging; „gebieten“ wahrt den würdigen biblischen Registerton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die geläufige deutsche Transkription.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: Bei צוה bezeichnet אֶת die beauftragte Person. Im Deutschen lautet die natürliche Konstruktion „Mose gebieten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Gegenstand und Umfang der Waschung
  choice: wuschen sie sich
  alternative: wuschen sie ihre Hände und Füße
  rationale: Der Vers nennt das Objekt nicht ausdrücklich. Obwohl der Kontext Hände und Füße bestimmt, wird diese Erläuterung hier nicht in den Vers importiert; die knappe Formulierung bewahrt die Ausdrucksweise des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Formulierung „sooft“ erhält die Parallelität und den iterativen Sinn der beiden temporalen Infinitivkonstruktionen. „Hineingehen“ unterscheidet den Eintritt in das Zelt vom Herantreten an den Altar.
