  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Dann breitete er das Zelt über die Wohnung aus und legte die Decke des Zeltes von oben darauf, ganz wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: breitete … aus
  rationale: פרשׂ bezeichnet hier das Ausbreiten beziehungsweise Ausspannen einer Bedeckung. Die deutsche Verbklammer gibt die konkrete Handlung natürlich und quellennah wieder.
- source_word: הָאֹהֶל
  choice: das Zelt
  rationale: אֹהֶל bedeutet gewöhnlich „Zelt“ und bezeichnet hier die über der Wohnung ausgebreitete Zeltlage. Die Wiedergabe wahrt den Unterschied zu מִכְסֶה, der äußeren Decke.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet die heilige Wohnstätte Gottes. „Wohnung“ bildet die Wortbedeutung transparent ab und unterscheidet das Bauwerk von dem darüberliegenden „Zelt“.
- source_word: וַיָּשֶׂם
  choice: legte
  rationale: שׂים bedeutet „setzen, legen, anbringen“. Bei einer Decke ist „legte“ im Deutschen konkreter und natürlicher als das allgemeinere „setzte“.
- source_word: מִכְסֵה הָאֹהֶל
  choice: die Decke des Zeltes
  rationale: מִכְסֶה ist eine Bedeckung oder Decke. Die Konstruktion „Decke des Zeltes“ bewahrt die Unterscheidung zwischen dem Zelt und seiner äußeren Schutzdecke.
- source_word: עָלָיו מִלְמָעְלָה
  choice: oben darauf
  rationale: Die knappe deutsche Wendung gibt sowohl die Lage über dem zuvor genannten Bau als auch מִלְמָעְלָה („oben, von oben her“) wieder, ohne die im Deutschen schwerfällige Doppelung „darüber von oben“.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ganz wie Jahwe Mose geboten hatte
  rationale: „Ganz wie“ bringt die genaue Entsprechung von כַּאֲשֶׁר zur Geltung. Das Plusquamperfekt verweist natürlich auf das zuvor ergangene Gebot.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen geläufige Umschrift des göttlichen Eigennamens und gibt das Tetragramm als Namen statt durch einen Titel wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ bewahrt ihn als Eigennamen; „der HERR“ wäre die traditionelle Ersetzung durch einen Titel.
- issue: Bezeichnung des מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte
  rationale: „Wohnung“ macht die Bedeutung des hebräischen Wortes sichtbar und erhält in diesem Satz die sachlich wichtige Unterscheidung zwischen מִשְׁכָּן („Wohnung“) und אֹהֶל („Zelt“), ohne eine konfessionelle Sonderdeutung einzutragen.
