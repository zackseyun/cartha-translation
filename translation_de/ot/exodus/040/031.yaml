lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: wuschen sich
  rationale: Der Qal-Wayyiqtol von רחץ schildert im Erzählzusammenhang eine vergangene Handlung. Das reflexive deutsche Verb ist bei der Reinigung von Körperteilen idiomatisch.
- source_word: מִמֶּנּוּ
  choice: daraus
  rationale: Die Präposition מן mit Suffix bezeichnet hier am natürlichsten die Quelle des Wassers und verweist auf das zuvor genannte Becken.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Form des Personennamens.
- source_word: וְאַהֲרֹן
  choice: Aaron
  rationale: Übliche deutsche Form des Personennamens; die Verbindung mit Mose wird durch die Aufzählung gewahrt.
- source_word: וּבָנָיו
  choice: und dessen Söhne
  rationale: בנים bezeichnet im priesterlichen Zusammenhang Aarons männliche Nachkommen. „Dessen“ macht im Deutschen eindeutig, dass sich das singularische Suffix auf Aaron bezieht.
- source_word: אֶת יְדֵיהֶם
  choice: die Hände
  rationale: Das Körperteilobjekt wird in der idiomatischen reflexiven deutschen Konstruktion mit bestimmtem Artikel wiedergegeben.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: und die Füße
  rationale: Die im Hebräischen ausdrücklich genannte Paarung der Körperteile bleibt erhalten; der Besitzbezug ergibt sich aus „sich“.
