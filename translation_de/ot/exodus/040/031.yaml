  text: From it Moses and Aaron and his sons washed their hands and their feet[a].
translation:
  language: de
  text: Mose, Aaron und dessen Söhne wuschen sich daraus die Hände und die Füße.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit“; wörtlicher heißt es im Hebräischen „daraus“, bezogen auf das Becken.'
