  text: וְ/נָֽתַתָּ֙ אֶת הַ/כִּיֹּ֔ר בֵּֽין אֹ֥הֶל מוֹעֵ֖ד וּ/בֵ֣ין הַ/מִּזְבֵּ֑חַ וְ/נָתַתָּ֥ שָׁ֖ם מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: de
  text: Stell das Becken[a] zwischen das Zelt der Begegnung und den Altar und gib dort Wasser hinein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird das hebräische Wort כִּיּוֹר auch mit „Waschbecken“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Stell
  rationale: נתן ist ein weit gefasstes Verb („geben, setzen, stellen“). Bei der gezielten räumlichen Aufstellung eines Kultgeräts ist „stell“ im Deutschen natürlich und sachgerecht.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: כִּיּוֹר bezeichnet hier das für Waschungen am Heiligtum verwendete Becken. „Becken“ ist modern und verständlich; das traditionelle „Waschbecken“ wäre erklärender, ist aber nicht zwingend im Lexem selbst enthalten.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: zwischen das Zelt der Begegnung und den Altar
  rationale: בֵּין ... וּבֵין bezeichnet den Raum zwischen zwei Gegenständen. „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent wieder; der Akkusativ nach „stellen“ entspricht der gerichteten Platzierung.
- source_word: הַמִּזְבֵּחַ
  choice: den Altar
  rationale: מִזְבֵּחַ bedeutet eindeutig „Altar“. Der Vers selbst enthält keine nähere Bestimmung, daher wird keine ergänzt.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: und füll dort Wasser hinein
  rationale: Wörtlich steht „und du sollst dort Wasser hineingeben/setzen“. Im Deutschen drückt „Wasser hineinfüllen“ den gemeinten Vorgang natürlich aus. „Dort“ bewahrt שָׁם und verweist auf den zuvor festgelegten Standort; „hinein“ macht den im Kontext klaren Bezug zum Becken idiomatisch sichtbar.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache in direkter Anrede. Der hebräische Gebrauch des konsekutiven Perfekts innerhalb der göttlichen Anweisung wird als deutscher Imperativ wiedergegeben. Die Kleinschreibung der Sachbezeichnungen vermeidet eine unnötige Stilisierung als Eigennamen.
