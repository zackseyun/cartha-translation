  text: וַ/יַּ֥עַל הַ/נֵּרֹ֖ת לִ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/025.yaml
  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Dann ordnete er die Lampen vor Jahwe an[a], so, wie Jahwe Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließ die Lampen hinaufsteigen“; die hebräische Wendung kann hier das Anordnen beziehungsweise Einsetzen oder das Entzünden der Lampen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: brachte … an
  rationale: Die Hifil-Form von עלה bedeutet wörtlich „hinaufbringen/aufsteigen lassen“. Im Zusammenhang mit den Lampen des Leuchters bezeichnet sie deren rituelle Inbetriebnahme, möglicherweise das Anbringen bzw. Einsetzen oder das Entzünden. „brachte … an“ ist im Deutschen natürlich und legt sich weniger eindeutig auf das Entzünden fest.
- source_word: הַנֵּרֹת
  choice: die Lampen
  rationale: נֵר bezeichnet hier die einzelnen Lampen des Leuchters, nicht das abstrakte Licht.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: Die räumlich-kultische Wendung לִפְנֵי bedeutet „vor“ beziehungsweise „in der Gegenwart von“. „vor Jahwe“ bewahrt diese knappe Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Konjunktion bezeichnet die Übereinstimmung der Handlung mit dem vorausgegangenen Gebot; „genau wie“ drückt diese Entsprechung klar aus.
- source_word: צִוָּה
  choice: es … geboten hatte
  rationale: Das Perfekt verweist hier auf das bereits zuvor erteilte Gebot. Das deutsche Plusquamperfekt macht diese zeitliche Abfolge deutlich.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: אֶת kennzeichnet Mose als direktes Objekt des Verbs „gebieten“. Die Formulierung „es Mose geboten hatte“ ist idiomatisches Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen יהוה. „Jahwe“ bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Wendung וַיַּעַל הַנֵּרֹת
  choice: brachte die Lampen an
  alternative: zündete die Lampen an
  rationale: Die Wendung kann im Kontext des Leuchters das Einsetzen bzw. Anbringen oder das Entzünden der Lampen bezeichnen. Der Haupttext vermeidet eine zu enge Festlegung; die Fußnote hält die echte lexikalische Mehrdeutigkeit fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dann“ führt die fortlaufende Erzählung natürlich weiter; „genau wie“ gibt die vollständige Übereinstimmung mit dem göttlichen Gebot verständlich wieder.
