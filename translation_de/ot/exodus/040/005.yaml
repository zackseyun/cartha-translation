base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: de
  text: Und du sollst den goldenen Altar für das Räucherwerk vor die Lade des Zeugnisses[a] stellen und den Vorhang für den Eingang der Wohnung anbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lade des Zeugnisses“; traditionell häufig: „Bundeslade“.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: du sollst … stellen
  rationale: נתן bezeichnet hier das Aufstellen bzw. Platzieren eines Einrichtungsgegenstands; „stellen“ ist im Deutschen natürlich und räumlich präzise.
- source_word: מִזְבַּח הַזָּהָב
  choice: den goldenen Altar
  rationale: Die Wortgruppe bezeichnet den aus Gold gefertigten bzw. goldenen Altar. „Goldener Altar“ ist die geläufige und natürliche deutsche Formulierung.
- source_word: לִקְטֹרֶת
  choice: für das Räucherwerk
  rationale: Die Präposition ל kennzeichnet Zweck oder Bestimmung. „Für das Räucherwerk“ bewahrt dies deutlicher als das traditionelle Kompositum „Räucheraltar“.
- source_word: לִפְנֵי
  choice: vor
  rationale: לִפְנֵי hat hier eine räumliche Bedeutung und wird idiomatisch mit „vor“ wiedergegeben.
- source_word: אֲרוֹן הָעֵדֻת
  choice: die Lade des Zeugnisses
  rationale: עֵדֻת bedeutet ausdrücklich „Zeugnis“. Die Wiedergabe folgt dem hebräischen Titel und ersetzt ihn nicht durch die traditionell vertrautere „Bundeslade“.
- source_word: וְשַׂמְתָּ
  choice: anbringen
  rationale: שׂים bedeutet setzen, stellen oder anbringen. Bei einem Vorhang am Eingang ist „anbringen“ im modernen Deutschen sachgerecht und vermeidet eine unbeholfene Wiederholung von „stellen“.
- source_word: מָסַךְ הַפֶּתַח
  choice: den Vorhang am Eingang
  rationale: מָסַךְ bezeichnet im Heiligtumskontext einen verhüllenden Eingangsvorhang. „Am Eingang“ gibt die funktionale Beziehung natürlich wieder.
- source_word: לַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן ist wörtlich die „Wohnung“ bzw. „Wohnstätte“. „Wohnung“ erhält die hebräische Bildsprache und ist als Bezeichnung des Zeltheiligtums im Kontext verständlich.
theological_decisions:
- issue: Bezeichnung der Lade mit עֵדֻת
  choice: Lade des Zeugnisses
  alternative: Bundeslade
  rationale: Der hebräische Text nennt hier das „Zeugnis“, nicht ausdrücklich den „Bund“. Die genauere Bezeichnung wahrt die Wortwahl des Verses, ohne die sachliche Beziehung zum Bund zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der hebräischen Anweisung, während „anbringen“ beim Eingangsvorhang natürliches Deutsch gewährleistet. „Wohnung“ gibt מִשְׁכָּן quellennah wieder.
