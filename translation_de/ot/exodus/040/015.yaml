source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: de
  text: Du sollst sie salben, wie du ihren Vater gesalbt hast, damit sie mir als Priester dienen. Und ihre Salbung soll ihnen ein ewiges[a] Priestertum verleihen, durch alle ihre Generationen hindurch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein immerwährendes“ beziehungsweise „ein dauerhaftes Priestertum“. Das hebräische Wort kann im Bundes- und Gesetzeskontext eine fortdauernde Geltung über die Generationen hinweg bezeichnen.'
    reason: lexikalische Alternative und Wahrung der zeitlichen Bedeutungsbreite von עוֹלָם
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Du sollst sie salben
  rationale: Das Qal-Perfekt mit ו setzt die Anweisungsfolge fort und hat hier gebietenden Zukunftssinn. „Du sollst … salben“ gibt diesen direkt und natürlich wieder.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: wie du ihren Vater gesalbt hast
  rationale: כַּאֲשֶׁר kennzeichnet die genaue Entsprechung zur bereits vollzogenen Salbung Aarons; אֲבִיהֶם bezeichnet Aaron als den Vater der Söhne.
- source_word: וְכִהֲנוּ לִי
  choice: damit sie mir als Priester dienen
  rationale: Das Verb כהן bezeichnet den Dienst beziehungsweise die Amtsausübung als Priester. Die finale Wiedergabe „damit“ drückt den Zweck der Salbung im Zusammenhang klar aus.
- source_word: מָשְׁחָתָם
  choice: ihre Salbung
  rationale: Das Substantiv bezeichnet hier die Salbung beziehungsweise die durch Salbung vollzogene Einsetzung; ausdrücklich von Salböl ist an dieser Stelle nicht die Rede.
- source_word: וְהָיְתָה לִהְיוֹת לָהֶם
  choice: soll ihnen … sichern
  rationale: Die ungewöhnliche Konstruktion beschreibt den bleibenden Status beziehungsweise die Folge ihrer Salbung. „Sichern“ ist im Deutschen idiomatisch, ohne die Salbung vom Priestertum zu lösen.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: ein ewiges Priestertum
  rationale: כְּהֻנָּה bedeutet „Priestertum“; עוֹלָם bezeichnet eine unabsehbare beziehungsweise fortdauernde Geltung. „Ewig“ wahrt die starke, traditionelle Aussage, während die Fußnote die kontextuelle Bedeutungsbreite nennt.
- source_word: לְדֹרֹתָם
  choice: durch alle ihre Generationen hindurch
  rationale: Die Wendung betont die Fortdauer in den aufeinanderfolgenden Generationen von Aarons Nachkommen.
theological_decisions:
- issue: Zeitliche Tragweite von עוֹלָם in der priesterlichen Rechts- und Bundessprache
  choice: ewiges Priestertum
  alternative: immerwährendes oder dauerhaftes Priestertum
  rationale: Die starke Zeitangabe des Hebräischen bleibt im Haupttext erhalten. Zugleich wird nicht stillschweigend entschieden, ob עוֹלָם hier philosophisch absolute Endlosigkeit oder die ununterbrochene Geltung innerhalb der genannten Generationen bezeichnet; die Fußnote hält diese Spannung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die kultische Fachsprache „salben“, „Priester“ und „Priestertum“ bleibt erhalten; schwerfällige hebräische Satzstrukturen werden behutsam idiomatisiert.
