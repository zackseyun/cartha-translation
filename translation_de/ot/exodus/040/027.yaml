base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/027.yaml
  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Und er verbrannte darauf wohlriechendes Räucherwerk[a], genau wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Räucherwerk aus Duftstoffen“ beziehungsweise „Gewürzräucherwerk“; die hebräische Wendung bezeichnet Räucherwerk, das aus wohlriechenden Gewürzstoffen hergestellt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: Und er verbrannte
  rationale: Der Hifil von קטר bezeichnet im kultischen Zusammenhang das Verbrennen beziehungsweise Aufsteigenlassen einer Opfergabe in Rauch. Mit dem ausdrücklich genannten Räucherwerk ist „verbrannte“ im Deutschen klar und natürlich.
- source_word: עָלָיו
  choice: darauf
  rationale: Das Suffix bezieht sich auf den zuvor genannten Räucheraltar. „Darauf“ gibt den räumlichen Bezug knapp und idiomatisch wieder.
- source_word: קְטֹרֶת סַמִּים
  choice: wohlriechendes Räucherwerk
  rationale: Die Wortverbindung bezeichnet Räucherwerk aus aromatischen Gewürzstoffen. „Wohlriechendes Räucherwerk“ vermittelt den Sinn in natürlichem, gehobenem Standarddeutsch; die möglichen Nuancen werden in der Fußnote bewahrt.
- source_word: כַּאֲשֶׁר
  choice: genau wie
  rationale: Die Wendung kennzeichnet die genaue Übereinstimmung der Handlung mit dem göttlichen Gebot.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass das Gebot der hier berichteten Ausführung vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: „Mose“ ist die im Deutschen etablierte Form des Namens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen als Namen, statt ihn durch den traditionellen Ersatztitel „der HERR“ wiederzugeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, ohne Bestandteile des hebräischen Textes auszulassen; „genau wie“ betont die vollständige Übereinstimmung mit dem vorausgegangenen Gebot.
