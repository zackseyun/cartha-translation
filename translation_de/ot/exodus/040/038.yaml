  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: de
  text: Denn die Wolke Jahwes war bei Tag über der Stiftshütte, und bei Nacht war Feuer darin[a], vor den Augen des ganzen Hauses Israel auf allen ihren Wanderungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Darin“ kann sich auf die Wolke beziehen; möglicherweise ist aber die Stiftshütte gemeint.
    reason: referential_ambiguity
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet einen abschließenden erklärenden Rückblick auf die zuvor geschilderte Führung ein.
- source_word: עֲנַן יְהוָה
  choice: die Wolke Jahwes
  rationale: Die Genitivverbindung bewahrt die enge Zuordnung der Wolke zu Jahwes Gegenwart, ohne sie weiter auszudeuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: הַמִּשְׁכָּן
  choice: die Stiftshütte
  rationale: Der im deutschen Bibelwortschatz geläufige Ausdruck bezeichnet hier das tragbare Heiligtum Israels.
- source_word: יוֹמָם
  choice: bei Tag
  rationale: Die knappe Zeitangabe entspricht dem parallelen Ausdruck „bei Nacht“.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: und bei Nacht war Feuer darin
  rationale: Das Suffix in בּוֹ wird auf die Wolke bezogen; „war“ gibt den zusammenfassenden Erzählzusammenhang natürlich wieder.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die konkrete hebräische Wendung bleibt erhalten und ist im Deutschen verständlich.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die gemeinschaftliche Bundesbezeichnung „Haus Israel“ wird bewahrt.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: auf allen ihren Wanderungen
  rationale: מַסָּע bezeichnet Reiseabschnitte beziehungsweise Wanderungen; die Formulierung umfasst Israels gesamten Weg durch die Wüste.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst; die Transliteration bewahrt ihn als Eigennamen.
- issue: Bezug von בּוֹ („darin“)
  choice: auf die Wolke bezogen
  alternative: auf die Stiftshütte bezogen
  rationale: Grammatisch kann das maskuline Suffix auf עָנָן („Wolke“) zurückverweisen; wegen der zwischenstehenden Stiftshütte bleibt der Bezug jedoch nicht völlig eindeutig und wird deshalb in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll bewahrten biblischen Wendungen. „Stiftshütte“ und „Haus Israel“ sichern die begriffliche Kontinuität; die Satzstellung bleibt klar und gut lesbar.
