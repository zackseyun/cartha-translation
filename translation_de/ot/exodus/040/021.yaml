base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: de
  text: Er brachte die Lade in die Wohnung, brachte den verhüllenden Vorhang[a] an und schirmte die Lade des Zeugnisses ab[b], ganz wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Vorhang als Sichtschutz“. Das Hebräische verbindet die Bezeichnung des inneren Vorhangs mit seiner verhüllenden Funktion.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verhüllte die Lade des Zeugnisses“ beziehungsweise „schirmte sie durch den Vorhang ab“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Er brachte … hinein
  rationale: Der Hifil von בוא bezeichnet hier das Hineinbringen der Lade; die deutsche Konstruktion mit „in“ und dem trennbaren Verb gibt Ziel und Bewegung natürlich wieder.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: Im Heiligtumskontext ist „Lade“ die etablierte Bezeichnung für die heilige Bundeslade, nicht eine gewöhnliche Truhe.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet wörtlich die Wohnstätte Gottes und im Exodus das transportable Heiligtum. „Wohnung“ bewahrt diesen für das Buch wichtigen Wortbezug; „Stiftshütte“ wäre traditioneller, aber weniger unmittelbar verständlich.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: den verhüllenden Vorhang
  rationale: פָּרֹכֶת bezeichnet den inneren Vorhang, מָסָךְ hebt seine Funktion als Sichtschutz beziehungsweise Verhüllung hervor. Die attributive Wiedergabe bewahrt beides in natürlichem Deutsch.
- source_word: וַיָּשֶׂם
  choice: brachte … an
  rationale: שׂים bedeutet grundsätzlich „setzen, stellen, anbringen“; beim Installieren des Vorhangs ist „anbringen“ im Deutschen sachlich und idiomatisch.
- source_word: וַיָּסֶךְ עַל
  choice: schirmte … ab
  rationale: Das Verb bezeichnet hier das Verhüllen beziehungsweise Abschirmen durch den Vorhang. „Abschirmen“ bewahrt zudem den Wortklang und Funktionsbezug zu מָסָךְ.
- source_word: אֲרוֹן הָעֵדוּת
  choice: die Lade des Zeugnisses
  rationale: Die formal nahe Wiedergabe erhält die kultische Bezeichnung und legt הָעֵדוּת nicht ausdrücklich auf „Bundesurkunde“ oder „Gesetzestafeln“ fest.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ganz wie Jahwe es Mose geboten hatte
  rationale: „Ganz wie“ hebt die genaue Entsprechung zwischen Gebot und Ausführung hervor; das Plusquamperfekt passt im Deutschen zur vorausliegenden Anweisung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Umschrift gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ wahrt den Charakter als persönlichen Gottesnamen; die Schreibweise ist im Deutschen geläufig.
- issue: Bedeutung von הָעֵדוּת
  choice: Zeugnis
  alternative: Bundesurkunde / Gesetzestafeln
  rationale: „Zeugnis“ bewahrt die semantische Offenheit der kultischen Bezeichnung und vermeidet eine im Vers selbst nicht ausdrücklich vorgenommene Identifikation.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wohnung“ hält die Bedeutung und den Leitwortcharakter von מִשְׁכָּן fest; die Fußnoten erläutern die ungewöhnliche hebräische Verbindung beim Vorhang und die räumlich-funktionale Aussage des Verbs.
