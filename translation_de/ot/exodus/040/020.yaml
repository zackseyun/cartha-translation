source:
  edition: WLC
  text: וַ/יִּקַּ֞ח וַ/יִּתֵּ֤ן אֶת הָ/עֵדֻת֙ אֶל הָ֣/אָרֹ֔ן וַ/יָּ֥שֶׂם אֶת הַ/בַּדִּ֖ים עַל הָ/אָרֹ֑ן וַ/יִּתֵּ֧ן אֶת הַ/כַּפֹּ֛רֶת עַל הָ/אָרֹ֖ן מִ/לְ/מָֽעְלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: de
  text: Dann nahm er das Zeugnis[a] und legte es in die Lade. Er brachte die Stangen an der Lade an und legte die Sühneplatte[b] oben auf die Lade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Tafeln des Zeugnisses“. Das hebräische „das Zeugnis“ ist hier die feststehende Bezeichnung für das, was in die Lade gelegt wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „Deckplatte“; traditionell „Gnadenthron“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: das Zeugnis
  rationale: עֵדוּת ist hier die feststehende kultische Bezeichnung für das in die Lade gelegte Bundeszeugnis, wahrscheinlich die steinernen Tafeln. „Das Zeugnis“ bewahrt die Ausdrucksweise und die knappe Bestimmtheit des Hebräischen.
- source_word: הָאָרֹן
  choice: die Lade
  rationale: אָרוֹן bezeichnet hier die heilige Lade. „Die Lade“ ist im Deutschen die geläufige kontextuelle Bezeichnung, ohne den im Vers nicht ausdrücklich stehenden Zusatz „des Bundes“ einzufügen.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים sind die zum Tragen der Lade bestimmten Stangen. „Stangen“ ist klar, modern und sachlich.
- source_word: הַכַּפֹּרֶת
  choice: die Sühneplatte
  rationale: כַּפֹּרֶת bezeichnet die goldene Deckplatte der Lade als besonderen kultischen Gegenstand. „Sühneplatte“ gibt sowohl die Gestalt als auch die kultische Bedeutung wieder, ohne den Ausdruck auf einen gewöhnlichen Deckel zu reduzieren.
- source_word: מִלְמָעְלָה
  choice: oben auf die Lade
  rationale: Der Ausdruck bezeichnet hier die Lage auf der Oberseite der Lade. Die deutsche Formulierung gibt dies natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Pronomen hinzuzufügen.
- source_word: וַיִּתֵּן ... אֶל
  choice: legte ... in
  rationale: נתן mit אֶל beschreibt hier das konkrete Hineinlegen eines Gegenstands und wird im Deutschen idiomatisch mit „legte ... in“ wiedergegeben.
- source_word: וַיָּשֶׂם ... עַל
  choice: brachte ... an ... an
  rationale: שים mit עַל beschreibt die sachgemäße Anbringung der Tragstangen an der Lade. „An der Lade anbringen“ ist im Deutschen klarer als das missverständliche „auf die Lade legen“.
theological_decisions:
- issue: Bezug von „das Zeugnis“
  choice: Die kultische Bezeichnung wird beibehalten und nicht im Haupttext ausdrücklich mit den steinernen Tafeln gleichgesetzt.
  alternative: „die Tafeln des Zeugnisses“ oder „die Bundestafeln“
  rationale: Der Vorgang setzt einen konkreten Gegenstand voraus, wahrscheinlich die Tafeln; der hebräische Text nennt jedoch lediglich עֵדוּת. Die Übersetzung bewahrt diese Spannung und erläutert den wahrscheinlichen Bezug nur in der Fußnote.
- issue: Wiedergabe von כַּפֹּרֶת
  choice: Sühneplatte
  alternative: Deckplatte; traditionell „Gnadenthron“
  rationale: Der Ausdruck bezeichnet den besonderen kultischen Gegenstand auf der Lade. „Sühneplatte“ wahrt seine Funktion und konkrete Gestalt; „Deckplatte“ wäre funktional enger, „Gnadenthron“ stärker traditionsgeprägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Terminologie. Die Satzfolge bleibt eng am hebräischen Handlungsablauf; zwei deutsche Sätze vermeiden eine schwerfällige Reihung. Fachbegriffe werden durch knappe Fußnoten zugänglich gemacht.
