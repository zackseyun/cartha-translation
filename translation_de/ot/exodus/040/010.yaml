  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: de
  text: Du sollst den Brandopferaltar und alle seine Geräte salben. Du sollst den Altar heiligen, und der Altar soll hochheilig sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Heiliges der Heiligkeiten“; eine hebräische Ausdrucksweise für den höchsten Grad der Heiligkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Du sollst … salben
  rationale: משׁח bezeichnet im kultischen Zusammenhang die Salbung mit Öl zur heiligen Bestimmung. „Salben“ ist die präzise und geläufige deutsche Entsprechung.
- source_word: מִזְבַּח הָעֹלָה
  choice: den Brandopferaltar
  rationale: Die Status-constructus-Verbindung bezeichnet den Altar, auf dem Brandopfer dargebracht werden. „Brandopferaltar“ ist im Deutschen knapp, eindeutig und natürlich.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: כֵּלִים ist ein weiter Begriff für zugehörige Gegenstände und Ausrüstung. „Geräte“ umfasst die verschiedenen kultischen Arbeitsmittel des Altars, ohne sie unnötig einzuengen.
- source_word: וְקִדַּשְׁתָּ
  choice: Du sollst … heiligen
  rationale: קדשׁ bedeutet hier, den Altar für den heiligen Gebrauch auszusondern. „Heiligen“ bewahrt die Verbindung zum anschließenden Ausdruck der Heiligkeit und ist verständliches, würdiges Deutsch.
- source_word: וְהָיָה
  choice: und … soll … sein
  rationale: Die Form bezeichnet den aus der Heiligung hervorgehenden Zustand. Die deutsche Soll-Konstruktion passt zur göttlichen Anweisung und gibt die resultierende Bestimmung wieder.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  rationale: Die hebräische Genitivverbindung drückt den höchsten Grad der Heiligkeit aus. „Hochheilig“ gibt diesen Superlativ idiomatisch wieder, ohne den Ausdruck räumlich auf das Allerheiligste zu beziehen.
theological_decisions:
- issue: Wiedergabe der kultischen Heiligkeitsformel קֹדֶשׁ קָדָשִׁים
  choice: hochheilig
  alternative: ein Heiliges der Heiligkeiten
  rationale: Der Ausdruck kennzeichnet hier den höchsten Grad kultischer Heiligkeit und verweist nicht zwingend auf den innersten Raum des Heiligtums. Die Übersetzung „hochheilig“ wahrt diese Aussage, während die Fußnote die konkrete hebräische Ausdrucksweise sichtbar macht.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem kultischem Wortschatz. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Der Fußnotenmarker steht bei „hochheilig“, da sich die Anmerkung auf קֹדֶשׁ קָדָשִׁים bezieht; seine Position in der englischen Konsultationsfassung nach „utensils“ war inhaltlich nicht passend.
