base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: de
  text: Immer wenn sich die Wolke von über der Wohnstätte erhob, brachen die Israeliten[a] bei all ihren Wanderungen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהֵעָלֹת הֶעָנָן
  choice: Immer wenn sich die Wolke … erhob
  rationale: Die Verbindung aus Konjunktion, Präposition und Infinitiv leitet eine temporale, im Zusammenhang wiederholt eintretende Bedingung ein. Das reflexive „sich erhob“ gibt die Bewegung der Wolke natürlich wieder, ohne einen nicht genannten Handelnden einzuführen.
- source_word: מֵעַל הַמִּשְׁכָּן
  choice: über der Wohnung
  rationale: מֵעַל bezeichnet hier die Bewegung weg von der Position oberhalb des Heiligtums. „Wohnung“ bildet die Grundbedeutung von מִשְׁכָּן ab und ist im Exoduskontext eine würdige, verständliche Bezeichnung für das tragbare Heiligtum.
- source_word: יִסְעוּ
  choice: brachen … auf
  rationale: נסע bezeichnet hier das Aufbrechen zur Weiterreise. Das deutsche Präteritum erhält zusammen mit „immer wenn“ den wiederholten, gewohnheitsmäßigen Sinn des Imperfekts.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die feste hebräische Volksbezeichnung bedeutet wörtlich „Söhne Israels“, bezeichnet hier jedoch das Volk als Ganzes. „Die Israeliten“ ist im modernen Deutschen natürlich und schließt in diesem korporativen Zusammenhang Frauen und Männer ein; die wörtliche Form wird in der Fußnote bewahrt.
- source_word: בְּכֹל מַסְעֵיהֶם
  choice: auf allen ihren Wegstrecken
  rationale: מַסָּע bezeichnet sowohl Reise beziehungsweise Aufbruch als auch eine Etappe oder Wegstrecke. Die Formulierung fasst die einzelnen Stationen der Wüstenwanderung distributiv zusammen.
theological_decisions:
- issue: Korporative Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Die Wendung ist grammatisch maskulin und wörtlich „Söhne Israels“, fungiert hier aber als etablierte Bezeichnung des ganzen Volkes. Die natürliche deutsche Volksbezeichnung vermeidet den möglichen Fehlschluss, nur männliche Personen seien gemeint, während die Fußnote die Form des Hebräischen offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wohnung“ folgt der hebräischen Grundbedeutung und passt zum kultischen Kontext; „Wegstrecken“ stellt den Etappencharakter der Wanderung heraus. Der Gedankenstrich macht die zusammenfassende Angabe am Versende gut lesbar, ohne den Sinn zu verändern.
