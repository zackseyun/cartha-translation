revisions:
- from: Immer wenn sich die Wolke über der Wohnung erhob, brachen die Israeliten[a] auf – auf allen ihren Wegstrecken.
  to: Immer wenn sich die Wolke von über der Wohnstätte erhob, brachen die Israeliten[a] bei all ihren Wanderungen auf.
  rationale: Die Präposition „von über“ stellt die im hebräischen מֵעַל ausgedrückte Ausgangsposition wieder her. Die Schlussformel wird ohne interpretativ einengende oder typografisch abgesetzte Ergänzung natürlich und quellennah wiedergegeben.
