review_pass:
  verdict: revise
  source_fidelity: Die temporale Wiederholung („Immer wenn“), die Erhebungsbewegung der Wolke und das wiederholte Aufbrechen sind zutreffend wiedergegeben. Jedoch lässt „über der Wohnung erhob“ die mit מֵעַל ausdrücklich bezeichnete Ausgangsposition der Bewegung („von über“) aus und kann bedeuten, dass die Wolke sich lediglich innerhalb eines Raums über der Wohnung erhob.
  naturalness: Die Revision ist modernes, würdiges Standarddeutsch. „Bei all ihren Wanderungen“ gibt die zusammenfassend-distributive Schlussformel idiomatischer wieder als der durch Gedankenstrich abgesetzte Nachtrag „auf allen ihren Wegstrecken“.
  terminology: „Israeliten“ ist als korporative Volksbezeichnung angemessen; die Fußnote dokumentiert die wörtliche hebräische Form. „Wohnstätte“ wahrt den Bezug zu מִשְׁכָּן und vermeidet die im heutigen Deutsch mögliche alltagsweltliche Nebenbedeutung von „Wohnung“.
  issues:
  - severity: medium
    issue: Die Bewegungspräposition מֵעַל ist nicht vollständig wiedergegeben.
    rationale: Das Hebräische beschreibt das Aufsteigen der Wolke von ihrer Position über der Wohnstätte weg. „sich die Wolke über der Wohnung erhob“ gibt nur den Ort während des Aufsteigens an, nicht den Ausgangspunkt der Bewegung.
  - severity: low
    issue: Der Schlussteil ist unnötig stark abgesetzt und semantisch enger formuliert.
    rationale: „– auf allen ihren Wegstrecken“ wirkt im Deutschen wie ein nachgetragener Zusatz und reduziert מַסָּע auf räumliche Wegstrecken. „bei all ihren Wanderungen“ lässt die Reiseetappen bzw. Aufbrüche angemessen offen.
  revised_text: Immer wenn sich die Wolke von über der Wohnstätte erhob, brachen die Israeliten[a] bei all ihren Wanderungen auf.
