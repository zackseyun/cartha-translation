  text: Then you shall bring in the table and arrange what belongs on it[a], and you shall bring in the lampstand and set up its lamps.
translation:
  language: de
  text: Dann sollst du den Tisch hineinbringen und darauf anordnen, was darauf gehört; und du sollst den Leuchter hineinbringen und seine Lampen aufsetzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Lampen anzünden“. Das hebräische Verb bedeutet wörtlich „aufsteigen lassen“ und kann hier auch das Aufsteigenlassen der Flammen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: sollst du … hineinbringen
  rationale: Der Hifil von בוא bezeichnet hier das Hineinbringen der Einrichtungsgegenstände in das Heiligtum. „Hineinbringen“ gibt die im Kontext klare Bewegungsrichtung natürlich wieder.
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Das Substantiv bedeutet schlicht „Tisch“. Seine kultische Funktion ist aus dem Zusammenhang bekannt, wird in diesem Vers aber nicht eigens genannt.
- source_word: וְעָרַכְתָּ אֶת עֶרְכּוֹ
  choice: darauf anordnen, was auf ihn gehört
  rationale: Die figura etymologica aus ערך und dem verwandten Substantiv bezeichnet die vorgeschriebene Anordnung beziehungsweise das auf dem Tisch Anzuordnende. Die Wiedergabe vermeidet eine unnatürliche Formulierung wie „seine Anordnung anordnen“.
- source_word: הַמְּנֹרָה
  choice: den Leuchter
  rationale: „Leuchter“ ist die natürliche deutsche Sachbezeichnung; eine Transliteration als „Menora“ würde den allgemein verständlichen Bedeutungsgehalt weniger direkt wiedergeben.
- source_word: וְהַעֲלֵיתָ
  choice: aufsetzen
  rationale: Der Hifil von עלה bedeutet wörtlich „hinaufbringen/aufsteigen lassen“. Im Zusammenhang mit der Aufstellung des Heiligtums kann er das Anbringen beziehungsweise Aufsetzen der Lampen bezeichnen; zugleich ist die Deutung „anzünden“ möglich und wird in der Fußnote bewahrt.
- source_word: נֵרֹתֶיהָ
  choice: seine Lampen
  rationale: נֵר bezeichnet eine Lampe oder ihr Licht. Hier sind die einzelnen Lampen des Leuchters gemeint.
