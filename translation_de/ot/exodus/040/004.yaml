translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Verpflichtungsform „sollst du“ und die Abfolge der Einrichtungsarbeiten bleiben erhalten; die hebräische Mehrdeutigkeit beim Aufsetzen beziehungsweise Anzünden der Lampen wird nicht stillschweigend aufgelöst.
