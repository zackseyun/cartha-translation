lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Dann sprach
  rationale: Das Narrativ-Waw führt die Handlung weiter; „Dann sprach“ gibt sowohl die zeitliche Folge als auch die formelhafte Einleitung göttlicher Rede natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֶל־מֹשֶׁה
  choice: zu Mose
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Mose“ ist die natürliche deutsche Fügung.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der formelhafte Infinitiv leitet den Inhalt der folgenden direkten Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das wörtliche „und sagte“ oder „folgendermaßen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: 'JHWH; traditionell: der HERR'
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn als Namen; die Fußnote weist transparent auf die hebräische Schreibung und die traditionelle Wiedergabe hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Redeeinleitungsformel wird idiomatisch mit einem Doppelpunkt wiedergegeben.
