source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן אֶת הַ/שֻּׁלְחָן֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד עַ֛ל יֶ֥רֶךְ הַ/מִּשְׁכָּ֖ן צָפֹ֑נָ/ה מִ/ח֖וּץ לַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/022.yaml
  text: He put the table in the tent of meeting[a], on the north side of the tabernacle, outside the veil.
translation:
  language: de
  text: Er stellte den Tisch im Zelt der Begegnung an der Nordseite der Wohnung auf, außerhalb des Vorhangs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck bezeichnet den inneren Trennvorhang, der das Allerheiligste abschirmte.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: stellte … auf
  rationale: נתן kann „geben“, „setzen“ oder „stellen“ bedeuten. Bei der räumlichen Anordnung eines Einrichtungsgegenstands ist „aufstellen“ im Deutschen natürlich und präzise.
- source_word: הַשֻּׁלְחָן
  choice: den Tisch
  rationale: Der hebräische Text nennt hier schlicht „den Tisch“. Seine nähere kultische Funktion wird nicht erklärend in den Vers eingetragen.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: im Zelt der Begegnung
  rationale: Die Wendung gibt die feste Heiligtumsbezeichnung transparent wieder und bleibt in modernem Deutsch verständlich.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: an der Nordseite der Wohnung
  rationale: יֶרֶךְ bezeichnet hier die Seite oder Flanke; zusammen mit צָפֹנָה ist „an der Nordseite“ die natürliche räumliche Wiedergabe.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: „Wohnung“ bewahrt die Bedeutung von מִשְׁכָּן als Wohnstätte und unterscheidet den Begriff vom „Zelt der Begegnung“, ohne einen zusätzlichen technischen Fremdbegriff einzuführen.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: außerhalb des Vorhangs
  rationale: מִחוּץ bezeichnet die Lage außerhalb; פָּרֹכֶת ist der innere Trennvorhang vor dem Allerheiligsten. „Vorhang“ ist im heutigen Deutsch klarer als „Schleier“.
