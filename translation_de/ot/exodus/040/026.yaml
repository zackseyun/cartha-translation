  text: וַ/יָּ֛שֶׂם אֶת מִזְבַּ֥ח הַ/זָּהָ֖ב בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵ֖י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: de
  text: Und er stellte den goldenen Altar in das Zelt der Begegnung, vor den Vorhang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der innere Trennvorhang der Stiftshütte; traditionell auch „Schleier“ genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Und er stellte
  rationale: Das Wayyiqtol von שׂוּם führt die Erzählfolge in der Vergangenheit fort. „Stellte“ bezeichnet im Deutschen natürlich und präzise das Aufstellen eines Einrichtungsgegenstands.
- source_word: מִזְבַּח הַזָּהָב
  choice: den goldenen Altar
  rationale: Die Konstruktion bedeutet wörtlich „Altar des Goldes“. „Goldener Altar“ ist im Deutschen idiomatisch und gibt Material beziehungsweise Ausstattung knapp wieder.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: in das Zelt der Begegnung
  rationale: אֹהֶל מוֹעֵד ist die feste Bezeichnung für das Heiligtumszelt. Wegen des Verbs der Platzierung ist nach deutschem Sprachgebrauch der Akkusativ „in das Zelt“ angemessen; „Zelt der Begegnung“ bewahrt den Sinn des göttlich-menschlichen Zusammentreffens.
- source_word: לִפְנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier die räumliche Lage des Altars im Verhältnis zum inneren Vorhang.
- source_word: הַפָּרֹכֶת
  choice: den Vorhang
  rationale: פָּרֹכֶת bezeichnet den inneren Trennvorhang der Stiftshütte. „Vorhang“ ist im modernen Deutsch klar und sachlich; die Fußnote erläutert seine besondere Funktion.
theological_decisions:
- issue: Kultische Bezeichnung הַפָּרֹכֶת
  choice: den Vorhang
  alternative: den Schleier
  rationale: „Vorhang“ gibt die konkrete Bedeutung des hebräischen Wortes natürlich wieder, ohne seine spätere theologische Bedeutung vorwegzunehmen. „Schleier“ kann traditionelle intertextuelle Anklänge stärker hervorrufen, ist für eine räumliche Trennwand im heutigen Deutsch jedoch weniger unmittelbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die kultischen Begriffe bleiben konkret und werden nicht konfessionell ausgedeutet.
