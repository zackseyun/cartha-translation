id: EXO.40.35
reference: Exodus 40:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹא יָכֹ֣ל מֹשֶׁ֗ה לָ/בוֹא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד כִּֽי שָׁכַ֥ן עָלָ֖י/ו הֶ/עָנָ֑ן וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: de
  text: Und Mose konnte nicht in das Zelt der Begegnung hineingehen, weil die Wolke darauf ruhte[a] und die Herrlichkeit Jahwes die Wohnung erfüllte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich darauf niedergelassen hatte“ oder „darauf wohnte“. Das hebräische Verb kann sowohl das Ruhen oder Sichniederlassen als auch das Bleiben oder Wohnen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל
  choice: Und Mose konnte nicht
  rationale: Die Verbindung aus Konjunktion und Verneinung führt die Erzählung schlicht fort; „konnte nicht“ gibt die Aussage über Moses Unvermögen natürlich und genau wieder.
- source_word: לָבוֹא אֶל
  choice: in … hineingehen
  rationale: Im Zusammenhang mit einem Zelt bezeichnet die Wendung das Betreten; „hineingehen“ ist im modernen Deutschen anschaulich und idiomatisch.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Die Wiedergabe bewahrt sowohl das konkrete „Zelt“ als auch die Funktion als Ort der Begegnung, ohne den Ausdruck mit מִשְׁכָּן gleichzusetzen.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion nennt hier den Grund dafür, dass Mose nicht hineingehen konnte.
- source_word: שָׁכַן
  choice: sich niedergelassen hatte
  rationale: Das Verb kann ein Sichniederlassen, Ruhen oder Wohnen bezeichnen. Im unmittelbaren Bild kommt die Wolke auf der Wohnung zur Ruhe; das Plusquamperfekt macht deutlich, dass dieser Zustand den verhinderten Eintritt begründet.
- source_word: עָלָיו
  choice: darauf
  rationale: Das Pronomen verweist am natürlichsten auf das Heiligtum beziehungsweise Zelt; „darauf“ erhält die räumliche Aussage knapp.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Artikel wird bewahrt; gemeint ist die aus dem Zusammenhang bekannte Wolke.
- source_word: כְבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: „Herrlichkeit“ bewahrt das Gewicht von כָּבוֹד, während der hebräische Gottesname als persönlicher Name wiedergegeben wird.
- source_word: מָלֵא
  choice: erfüllte
  rationale: Das Verb bezeichnet, dass die Herrlichkeit den gesamten Raum einnahm; das Präteritum passt zur fortlaufenden Erzählung.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: „Wohnung“ gibt die vom Stamm שׁכן geprägte Bezeichnung des transportablen Heiligtums wieder und unterscheidet sie vom unmittelbar zuvor genannten „Zelt der Begegnung“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsbreite von שָׁכַן und die Vorstellung göttlichen Wohnens
  choice: sich niedergelassen hatte
  alternative: darauf ruhte; darauf wohnte
  rationale: Die Hauptfassung stellt das konkrete Bild der auf dem Heiligtum niedergelassenen Wolke heraus. Die Fußnote bewahrt die mögliche Resonanz des Wohnens, ohne sie im Haupttext einseitig festzulegen.
- issue: Unterscheidung von אֹהֶל מוֹעֵד und מִשְׁכָּן
  choice: Zelt der Begegnung … Wohnung
  alternative: Begegnungszelt … Stiftshütte
  rationale: Die unterschiedlichen hebräischen Bezeichnungen bleiben auch auf Deutsch unterscheidbar. Zugleich wird keine über den Vers hinausgehende Aussage über ihr genaues räumliches Verhältnis hinzugefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Begründungsgefüge, bleibt aber idiomatisch. „Wohnung“ ist bewusst als sachliche Kultbezeichnung gewählt; der Gottesname erscheint in der deutschen Form „Jahwe“.
