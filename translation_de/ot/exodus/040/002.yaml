  text: בְּ/יוֹם הַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ תָּקִ֕ים אֶת מִשְׁכַּ֖ן אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/002.yaml
  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: de
  text: Am ersten Tag des ersten Monats sollst du die Wohnstätte[a], das Zelt der Begegnung, aufrichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder formaler: „die Wohnstätte des Zeltes der Begegnung“. Das Hebräische verbindet hier zwei Bezeichnungen für das Heiligtum; sie können als gleichsetzende Benennungen oder als engere, konstruktionsartige Verbindung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם
  choice: Am … Tag
  rationale: Die Präposition בְּ mit יוֹם bezeichnet hier einen Zeitpunkt; „am … Tag“ ist die natürliche deutsche Datumsformel.
- source_word: הַחֹדֶשׁ הָרִאשׁוֹן
  choice: des ersten Monats
  rationale: חֹדֶשׁ bezeichnet in diesem kalendarischen Zusammenhang einen Monat, הָרִאשׁוֹן dessen Stellung als ersten im Jahreslauf.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: am ersten Tag des … Monats
  rationale: Die hebräische Datumsformel lautet wörtlich etwa „am Eins des Monats“, bezeichnet aber idiomatisch den ersten Monatstag.
- source_word: תָּקִים
  choice: sollst du … aufrichten
  rationale: Der Hifil von קום bedeutet hier, etwas zum Stehen zu bringen, also den Heiligtumsbau aufzurichten. „Aufrichten“ ist natürlich und bewahrt den konkreten Bildgehalt.
- source_word: מִשְׁכַּן
  choice: Wohnung
  rationale: מִשְׁכָּן bezeichnet die transportable heilige Wohnstätte. „Wohnung“ bewahrt den sprachlichen Bezug zum Wohnen und vermeidet, den Ausdruck lediglich durch einen traditionellen Sonderbegriff zu ersetzen.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: אֹהֶל ist „Zelt“; מוֹעֵד kann eine festgesetzte Zeit, Zusammenkunft oder Begegnung bezeichnen. Im Heiligtumskontext gibt „Zelt der Begegnung“ die Funktion als Ort der Begegnung verständlich wieder.
theological_decisions:
- issue: Verhältnis von מִשְׁכַּן und אֹהֶל מוֹעֵד
  choice: 'Apposition: „die Wohnung, das Zelt der Begegnung“'
  alternative: 'Engere, konstruktionsartige Verbindung: „die Wohnung des Zeltes der Begegnung“'
  rationale: Die beiden Heiligtumsbezeichnungen stehen unmittelbar nebeneinander. Eine appositionelle Wiedergabe lässt beide dasselbe Heiligtum aus unterschiedlicher Perspektive benennen, ohne die im Hebräischen mögliche engere Verbindung zu verschweigen; diese wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt natürlichem Deutsch; „Wohnung“ und „Zelt der Begegnung“ halten die beiden hebräischen Heiligtumsbegriffe sichtbar auseinander. Die Fußnotenmarke steht unmittelbar bei der mehrdeutigen Wortverbindung.
