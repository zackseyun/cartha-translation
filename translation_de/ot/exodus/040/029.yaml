  text: וְ/אֵת֙ מִזְבַּ֣ח הָ/עֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל מוֹעֵ֑ד וַ/יַּ֣עַל עָלָ֗י/ו אֶת הָ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: de
  text: Er stellte den Brandopferaltar am Eingang der Wohnung, des Zeltes der Begegnung, auf und brachte darauf das Brandopfer und das Speiseopfer dar, genauso wie Jahwe es Mose geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: Brandopferaltar
  rationale: Die deutsche Zusammensetzung gibt die kultische Funktion des Altars präzise und natürlich wieder.
- source_word: שָׂם
  choice: stellte … auf
  rationale: Im Zusammenhang mit der Errichtung des Heiligtums bezeichnet das Verb das Aufstellen beziehungsweise Platzieren des Altars.
- source_word: פֶּתַח
  choice: am Eingang
  rationale: Gibt die räumliche Angabe knapp und idiomatisch wieder.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: zur Wohnung, zum Zelt der Begegnung
  rationale: Bewahrt beide hebräischen Bezeichnungen und versteht die zweite als erläuternde Apposition, ohne sie zu einer einzigen Benennung zu verschmelzen.
- source_word: וַיַּעַל עָלָיו
  choice: brachte darauf … dar
  rationale: Das Verb עלה bezeichnet im Opferkontext das Darbringen; „darbringen“ ist im Deutschen die sachgerechte kultische Ausdrucksweise.
- source_word: הָעֹלָה
  choice: das Brandopfer
  rationale: Etablierte und präzise Wiedergabe der vollständig verbrannten Opfergabe.
- source_word: הַמִּנְחָה
  choice: das Speiseopfer
  rationale: Im priesterschriftlichen Opferkontext ist dies die geläufige deutsche Bezeichnung für die unblutige, überwiegend aus Getreide bestehende Opfergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: genauso wie Jahwe es Mose geboten hatte
  rationale: „Genauso wie“ hebt die genaue Entsprechung zur Weisung hervor; das Plusquamperfekt markiert, dass das Gebot dem Vollzug vorausging.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Umschrift wahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von מִשְׁכַּן und אֹהֶל מוֹעֵד
  choice: 'appositionell: „zur Wohnung, zum Zelt der Begegnung“'
  alternative: „zur Wohnung des Zeltes der Begegnung“
  rationale: Die knappe hebräische Wortfolge lässt syntaktische Spannung zu. Die appositionelle Wiedergabe bewahrt beide Bezeichnungen und ergibt im Deutschen einen verständlichen Ortsbezug, ohne die Begriffe theologisch zu verschmelzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit geläufiger kultischer Terminologie. „Wohnung“ hält das Wohnmotiv von מִשְׁכָּן sichtbar; „Zelt der Begegnung“ gibt מוֹעֵד funktional und verständlich wieder.
