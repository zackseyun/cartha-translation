base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: de
  text: 'So richtete Mose die Wohnstätte[a] auf: Er setzte ihre Sockel ein, stellte ihre Bretter[b] auf, brachte ihre Riegel an und richtete ihre Säulen[c] auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Stiftshütte“; gemeint ist das tragbare Heiligtum, wörtlich eine „Wohnstätte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bohlen“; das hebräische Wort bezeichnet hier die aufrechten Bauteile der Wohnstätte.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Pfosten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: richtete … auf
  rationale: Das Hifil von קום bedeutet hier, etwas zum Stehen zu bringen bzw. aufzurichten. „aufrichten“ ist im Deutschen natürlich und passt sowohl zur Wohnung als Ganzem als auch zu den Säulen.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet wörtlich eine Wohnstätte und in Exodus das tragbare Heiligtum. „Wohnung“ bewahrt die Wortbedeutung und den theologischen Zusammenhang mit Gottes Wohnen unter Israel; die traditionelle Alternative wird in der Fußnote genannt.
- source_word: אֲדָנָיו
  choice: ihre Sockel
  rationale: אֶדֶן bezeichnet hier die Fundamentstücke mit Aufnahmen für die aufrechten Bauteile. „Sockel“ gibt ihre tragende Funktion klar und knapp wieder.
- source_word: קְרָשָׁיו
  choice: ihre Rahmen
  rationale: קֶרֶשׁ kann Bretter oder Bohlen bezeichnen, doch die betreffenden Teile fungieren als aufrechte Konstruktionselemente. „Rahmen“ folgt dem baulichen Zusammenhang, ohne die mögliche Form als Bretter endgültig festzulegen.
- source_word: בְּרִיחָיו
  choice: ihre Riegel
  rationale: בְּרִיחַ bezeichnet die waagerechten Verbindungselemente, welche die Rahmenteile zusammenhielten. „Riegel“ ist sachlich und im Deutschen für solche Bauteile verständlich.
- source_word: עַמּוּדָיו
  choice: ihre Säulen
  rationale: עַמּוּד bezeichnet aufrechte Stützen. „Säulen“ ist die geläufige und würdige Wiedergabe im Heiligtumskontext.
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: setzte ein / stellte auf / brachte an
  rationale: נתן und שׂים sind allgemeine Verben des Setzens und Platzierens. Die variierenden deutschen Verben richten sich idiomatisch nach den jeweiligen Bauteilen und bewahren die Abfolge der Montage.
theological_decisions:
- issue: Bezeichnung des מִשְׁכָּן
  choice: Wohnung
  alternative: Stiftshütte / Heiligtum
  rationale: „Wohnung“ gibt die hebräische Benennung unmittelbar wieder und hält den Gedanken des göttlichen Wohnens präsent. „Stiftshütte“ ist traditionell, aber im heutigen Deutsch erklärungsbedürftig; „Heiligtum“ bezeichnet eher die Funktion als die Wortbedeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bildet die einzelnen Montageschritte deutlich ab. Fachlich verständliche Baubegriffe werden verwendet; traditionelle oder formbezogene Alternativen stehen in den Fußnoten.
