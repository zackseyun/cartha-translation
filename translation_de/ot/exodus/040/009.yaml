base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: de
  text: Dann nimm das Salböl, salbe die Stiftshütte und alles, was sich darin befindet, und weihe sie und alle ihre Geräte. Dann wird sie heilig sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier „heilig“, nicht „hochheilig“ oder „allerheiligst“.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Dann nimm
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt die Anweisungsfolge fort. „Dann“ macht die Abfolge deutlich, während der deutsche Imperativ die gebietende Kraft natürlich wiedergibt.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: das Salböl
  rationale: Die deutsche Zusammensetzung ist die natürliche und kultisch präzise Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: וּמָשַׁחְתָּ
  choice: salbe
  rationale: משׁח bezeichnet hier die kultische Salbung mit Öl zur heiligen Bestimmung. Der koordinierte Imperativ entspricht natürlichem deutschem Anweisungsstil.
- source_word: הַמִּשְׁכָּן
  choice: die Stiftshütte
  rationale: „Stiftshütte“ ist im Deutschen die etablierte Bezeichnung für das transportable Heiligtum Israels und in diesem Zusammenhang präziser als die etymologischere Wiedergabe „Wohnstätte“.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: alles, was sich darin befindet
  rationale: Die Formulierung gibt den umfassenden Bezug auf den Inhalt der Stiftshütte klar und in würdigem modernem Deutsch wieder.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: und heilige sie
  rationale: Das Piel von קדשׁ bedeutet hier, etwas für den heiligen Gebrauch auszusondern beziehungsweise in den heiligen Stand zu versetzen. „Heiligen“ bewahrt zugleich die Wortverbindung zu קֹדֶשׁ am Versende.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: samt all ihren Geräten
  rationale: כֵּלִים ist ein weiter Begriff für die zum Heiligtum gehörenden Gegenstände und Geräte. „Geräte“ ist weniger eng als „Gefäße“ und im Deutschen sachlich verständlich.
- source_word: וְהָיָה קֹדֶשׁ
  choice: So wird sie heilig sein
  rationale: Die Formulierung gibt die resultative Aussage wieder und bezieht das feminine Pronomen auf die Stiftshütte. קֹדֶשׁ bezeichnet hier Heiligkeit ohne ausdrücklichen Superlativ.
theological_decisions:
- issue: Kultischer Status nach Salbung und Heiligung
  choice: Die Stiftshütte wird als heilig bezeichnet, ohne Steigerung.
  alternative: Die Stiftshütte wird hochheilig beziehungsweise allerheiligst.
  rationale: Der hebräische Text hat lediglich קֹדֶשׁ („heilig“), nicht die ausdrückliche Verbindung קֹדֶשׁ קָדָשִׁים („hochheilig“). Die Übersetzung fügt daher keine aus Parallelstellen oder Tradition abgeleitete Steigerung ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Anweisungsfolge. Die etablierten kultischen Begriffe „Salböl“ und „Stiftshütte“ bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser verständlich.
