  text: וְ/הִקְרַבְתָּ֤ אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֔י/ו אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/012.yaml
  text: Then bring Aaron and his sons near to the entrance of the tent of meeting, and wash them with water.
translation:
  language: de
  text: Dann sollst du Aaron und seine Söhne an den Eingang des Zeltes der Begegnung heranbringen und sie mit Wasser waschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Dann sollst du … heranbringen
  rationale: Der Hifil von קרב bezeichnet das Veranlassen einer Annäherung. „Heranbringen“ bewahrt sowohl den kausativen Sinn als auch den kultischen Zusammenhang; das einleitende וְ wird im fortlaufenden Anweisungszusammenhang natürlich mit „Dann“ wiedergegeben.
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: בָּנָיו
  choice: seine Söhne
  rationale: בנים bezeichnet hier Aarons männliche Nachkommen, die gemeinsam mit ihm für den Priesterdienst eingesetzt werden.
- source_word: פֶּתַח
  choice: Eingang
  rationale: „Eingang“ ist eine natürliche und genaue Bezeichnung für den Zugang zum Zelt.
- source_word: אֹהֶל מוֹעֵד
  choice: Zelt der Begegnung
  rationale: Diese Wiedergabe bringt den Charakter des Zeltes als Ort der Begegnung zum Ausdruck und ist im modernen deutschen Bibelstil verständlich und würdevoll.
- source_word: וְרָחַצְתָּ
  choice: und … waschen
  rationale: רחץ bedeutet allgemein „waschen“. Die Formulierung legt die genaue Art oder den Umfang der Waschung nicht näher fest und bleibt daher bewusst unspezifisch.
- source_word: אֹתָם
  choice: sie
  rationale: Das Pronomen bezieht sich gemeinsam auf Aaron und seine Söhne.
- source_word: בַּמָּיִם
  choice: mit Wasser
  rationale: 'Die Präposition ב wird hier am natürlichsten instrumental verstanden: Wasser ist das Mittel der Waschung. „Im Wasser“ wäre grammatisch möglich, würde jedoch die Durchführung stärker festlegen.'
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in einem klaren, würdevollen Anweisungsstil. Die Konstruktion „sollst du“ gibt die göttliche Handlungsanweisung im Kontext natürlich wieder; „heranbringen“ bewahrt die kultische Annäherung, ohne zusätzliche theologische Deutung einzutragen.
