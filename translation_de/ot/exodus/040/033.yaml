base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: de
  text: Dann errichtete er den Vorhof rings um das Heiligtumszelt und den Altar und brachte den Vorhang am Tor des Vorhofs an.[a] Mose vollendete die Arbeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Behang« oder »Schirm«; gemeint ist die textile Abdeckung am Eingang des Vorhofs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: errichtete
  rationale: Das Hifil von קום bezeichnet hier das Aufstellen beziehungsweise Errichten der Vorhofanlage; »errichtete« ist präzise und würdevoll.
- source_word: הֶחָצֵר
  choice: den Vorhof
  rationale: חָצֵר bezeichnet den eingefriedeten äußeren Bereich des Heiligtums. »Vorhof« ist im Deutschen der geläufige sachliche Ausdruck.
- source_word: סָבִיב
  choice: rings um
  rationale: Das Adverb bezeichnet die räumliche Umschließung von Wohnstätte und Altar.
- source_word: לַמִּשְׁכָּן
  choice: um die Wohnstätte
  rationale: מִשְׁכָּן bedeutet wörtlich »Wohnstätte« und bezeichnet hier das tragbare Heiligtum. Die Wiedergabe erhält den theologischen Bezug auf Gottes Wohnen, ohne den technischen Sinn zu verlieren.
- source_word: וְלַמִּזְבֵּחַ
  choice: und den Altar
  rationale: Direkte und eindeutige Wiedergabe von מִזְבֵּחַ.
- source_word: וַיִּתֵּן
  choice: brachte … an
  rationale: נתן bedeutet grundsätzlich »setzen/stellen/geben«; bei einem textilen Bauteil bezeichnet es hier idiomatisch dessen Anbringung.
- source_word: מָסַךְ
  choice: den Vorhang
  rationale: מָסַךְ bezeichnet hier die textile Abdeckung des Vorhoftors. »Vorhang« ist im modernen Deutschen klarer und natürlicher als »Abschirmung«.
- source_word: שַׁעַר הֶחָצֵר
  choice: am Tor des Vorhofs
  rationale: Die Konstruktverbindung bezeichnet den Zugang zum Vorhof; »Tor« bewahrt die konkrete räumliche Bezeichnung des Hebräischen.
- source_word: וַיְכַל
  choice: vollendete
  rationale: כלה bezeichnet den erfolgreichen Abschluss des gesamten Auftrags; »vollendete« gibt das Abschlussmotiv prägnant wieder.
- source_word: הַמְּלָאכָה
  choice: die Arbeit
  rationale: מְלָאכָה fasst die gesamte ausgeführte Bau- und Einrichtungsarbeit zusammen.
theological_decisions:
- issue: Wiedergabe von מִשְׁכָּן
  choice: Wohnstätte
  alternative: Stiftshütte
  rationale: »Wohnstätte« bildet die hebräische Wortbedeutung transparent ab und bewahrt den Gedanken des göttlichen Wohnens. »Stiftshütte« ist traditionell, im heutigen Deutsch jedoch weniger unmittelbar verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt nahe an der knappen hebräischen Erzählfolge; etablierte Kultbegriffe wie »Vorhof« und »Altar« werden beibehalten.
