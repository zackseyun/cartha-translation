  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: de
  text: Er stellte das Becken zwischen das Zelt der Begegnung und den Altar und tat Wasser zum Waschen hinein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Er stellte
  rationale: שׂוּם bezeichnet hier das Aufstellen beziehungsweise Platzieren an einem bestimmten Ort; „stellte“ ist im Deutschen bei einem Becken natürlich.
- source_word: הַכִּיֹּר
  choice: das Becken
  rationale: כִּיּוֹר bezeichnet das große Waschbecken für den Dienst am Heiligtum. „Becken“ ist klar und gegenwartssprachlich; „Waschbecken“ würde den Zweck verdeutlichen, der im folgenden Satzteil jedoch bereits genannt wird.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: zwischen das Zelt der Begegnung und den Altar
  rationale: אֹהֶל מוֹעֵד wird sachnah mit „Zelt der Begegnung“ wiedergegeben. Die hebräische Wiederholung von בֵּין wird entsprechend natürlichem Deutsch als „zwischen … und …“ ausgedrückt; wegen der gerichteten Aufstellung steht der Akkusativ.
- source_word: וַיִּתֵּן
  choice: und füllte … ein
  rationale: נָתַן bedeutet grundsätzlich „geben, setzen, hineintun“. Mit Wasser und einem aus dem Kontext erschließbaren Gefäß ist „einfüllen“ idiomatisches Deutsch, ohne einen neuen Handlungsträger einzuführen.
- source_word: שָׁמָּה
  choice: dort
  rationale: Das lokative Adverb bedeutet „dort/dorthin“. „Dort“ bewahrt die Ausdrucksweise des Hebräischen, statt ausdrücklich „in das Becken“ zu ergänzen.
- source_word: מַיִם
  choice: Wasser
  rationale: Direkte Wiedergabe des hebräischen Massennomens.
- source_word: לְרָחְצָה
  choice: zum Waschen
  rationale: Der Infinitiv von רָחַץ bezeichnet den Zweck. „Zum Waschen“ lässt wie der hebräische Text offen, wer sich beziehungsweise was gewaschen wird.
