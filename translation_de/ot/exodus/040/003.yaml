source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָ/עֵד֑וּת וְ/סַכֹּתָ֥ עַל הָ/אָרֹ֖ן אֶת הַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: de
  text: Dort sollst du die Lade des Zeugnisses aufstellen und die Lade durch den Vorhang[a] abschirmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der innere Vorhang der Stiftshütte, der die Lade abschirmte; traditionell auch »Schleier« genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: sollst du … aufstellen
  rationale: Das Qal-Perfekt mit וְ führt die Anweisungsfolge fort und hat hier gebietenden Sinn. »Aufstellen« ist für einen Kultgegenstand natürlich und präzise.
- source_word: שָׁם
  choice: dort
  rationale: Bewahrt den deiktischen Ortsbezug auf die zuvor erwähnte Wohnung beziehungsweise das Zelt, ohne ihn im Vers ausdrücklich zu ergänzen.
- source_word: אֲרוֹן הָעֵדוּת
  choice: die Lade des Zeugnisses
  rationale: Gibt die hebräische Genitivverbindung wörtlich und traditionsnah wieder. עֵדוּת bedeutet hier »Zeugnis«, nicht ausdrücklich »Bund«.
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: die Lade … abschirmen
  rationale: סכך bezeichnet ein Bedecken oder Abschirmen. Da der Vorhang als räumliche Trennung dient und nicht auf die Lade gelegt wird, vermittelt »abschirmen« die Funktion im Heiligtum treffend.
- source_word: הַפָּרֹכֶת
  choice: der Vorhang
  rationale: פָּרֹכֶת bezeichnet den inneren Vorhang der Stiftshütte, der den Bereich mit der Lade abtrennte. »Vorhang« ist im modernen Deutschen verständlich und sachlich genau.
theological_decisions:
- issue: Bezeichnung der Lade
  choice: Lade des Zeugnisses
  alternative: Bundeslade
  rationale: Der Ausgangstext hat ausdrücklich הָעֵדוּת, »das Zeugnis«. Die vertraute Bezeichnung »Bundeslade« würde den Wortlaut an dieser Stelle harmonisierend verändern.
- issue: Wiedergabe von פָּרֹכֶת
  choice: Vorhang
  alternative: Schleier
  rationale: »Vorhang« bezeichnet die bauliche und abschirmende Funktion natürlicher. »Schleier« ist zwar traditionell möglich, kann im heutigen Deutsch jedoch irreführend an einen getragenen Gesichtsschleier denken lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Singular. Die Satzstellung setzt »dort« an den Anfang und bildet die hebräische Anweisungsfolge natürlich ab. Der spezifische Ausdruck »Zeugnis« bleibt gegenüber der geläufigeren, aber hier nicht wörtlichen Bezeichnung »Bundeslade« erhalten.
