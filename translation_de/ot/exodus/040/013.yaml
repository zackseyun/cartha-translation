base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/013.yaml
  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: de
  text: Du sollst Aaron die heiligen Gewänder anlegen, ihn salben und ihn weihen, und er soll mir als Priester dienen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: damit er mir als Priester dient. Das hebräische Verb bezeichnet die Ausübung des Priesteramtes beziehungsweise den Dienst als Priester.'
    reason: Die Verbindung kann als Folge oder Ziel der vorausgehenden Einsetzungshandlungen verstanden werden; der Haupttext bewahrt mit der koordinierten Formulierung die nähere syntaktische Wiedergabe.
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: du sollst … anlegen
  rationale: 'Der Hifil von לבשׁ ist hier kausativ: Mose soll Aaron die Gewänder anlegen. Diese Formulierung ist im Deutschen natürlicher als »bekleiden« und passt zur priesterlichen Einkleidung.'
- source_word: אַהֲרֹן
  choice: Aaron
  rationale: Der Personenname wird nach der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: die heiligen Gewänder
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich »Gewänder der Heiligkeit«. »Die heiligen Gewänder« ist natürlich, würdig und bewahrt den kultischen Sinn.
- source_word: וּמָשַׁחְתָּ
  choice: ihn salben
  rationale: »Salben« ist die übliche und sachlich genaue Wiedergabe von משׁח bei der Einsetzung in das Priesteramt.
- source_word: וְקִדַּשְׁתָּ
  choice: ihn für den heiligen Dienst weihen
  rationale: Das Piel von קדשׁ bezeichnet hier das Aussondern und Bestimmen zum heiligen Dienst. Die Erweiterung macht den kultischen Sinn für heutige Leser verständlich, ohne Salbung und Weihe zusammenzuziehen.
- source_word: וְכִהֵן
  choice: damit er … als Priester dient
  rationale: כהן bedeutet, als Priester zu wirken oder zu dienen. Nach den Verben in der zweiten Person lässt sich die Form in der dritten Person natürlich als Ziel oder Folge der Einsetzungsakte verstehen; die mögliche koordinierte Lesart wird in der Fußnote erhalten.
- source_word: לִי
  choice: mir
  rationale: Der hebräische Dativ bezeichnet denjenigen, dem der priesterliche Dienst gilt. »Mir dienen« ist im Deutschen idiomatisch und bildet die persönliche Ausrichtung auf Gott präzise ab.
theological_decisions:
- issue: Wiedergabe der priesterlichen Einsetzung
  choice: Einkleidung, Salbung und Weihe werden als unterscheidbare, aufeinanderfolgende Handlungen wiedergegeben.
  alternative: Die Abfolge unter einem Oberbegriff wie »ins Priesteramt einsetzen« zusammenfassen.
  rationale: Der hebräische Text nennt die einzelnen rituellen Handlungen ausdrücklich. Ihre getrennte Wiedergabe bewahrt die kultische Genauigkeit und vermeidet spätere kirchliche Kategorien.
- issue: Syntaktische Funktion von וְכִהֵן לִי
  choice: 'Als Ziel beziehungsweise Ergebnis: »damit er mir als Priester dient«.'
  alternative: 'Als koordinierte Soll-Aussage: »und er soll mir als Priester dienen«.'
  rationale: Der Wechsel von den an Mose gerichteten Formen in der zweiten Person zur dritten Person bezeichnet plausibel das Ergebnis oder Ziel der vorausgehenden Handlungen. Da die hebräische Verknüpfung auch koordinierend verstanden werden kann, wird diese Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede mit »du sollst« bewahrt den Weisungscharakter. »Für den heiligen Dienst weihen« verdeutlicht den kultischen Sinn, ohne die einzelnen Einsetzungsakte miteinander zu verschmelzen.
