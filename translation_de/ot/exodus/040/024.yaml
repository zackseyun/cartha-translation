  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: de
  text: Er stellte den Leuchter im Zelt der Begegnung gegenüber dem Tisch[a] an der Südseite der Wohnung auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem Tisch“; das hebräische Wort kann eine Lage gegenüber oder vor etwas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Er stellte
  rationale: Das Verb שׂים bezeichnet hier im fortlaufenden Erzählbericht das gezielte Aufstellen eines Einrichtungsgegenstands.
- source_word: הַמְּנֹרָה
  choice: den Leuchter
  rationale: מְנוֹרָה bezeichnet den kultischen Leuchter; „Leuchter“ ist im Deutschen klar und traditionsgemäß, ohne lediglich eine einzelne Lampe anzudeuten.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: in das Zelt der Begegnung
  rationale: אֹהֶל מוֹעֵד ist die feste Bezeichnung des Heiligtums als Ort der Begegnung. Wegen des Verbs des Aufstellens ist im Deutschen der Akkusativ natürlich.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: gegenüber dem Tisch
  rationale: נֹכַח beschreibt die räumliche Lage vor beziehungsweise gegenüber etwas. „Gegenüber“ passt hier am besten zur Anordnung der Einrichtungsgegenstände.
- source_word: הַשֻּׁלְחָן
  choice: dem Tisch
  rationale: Der hebräische Text nennt schlicht „den Tisch“; seine kultische Funktion wird nicht ergänzend in die Übersetzung eingetragen.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: an die Südseite der Wohnung
  rationale: יֶרֶךְ bezeichnet die Seite oder Flanke. Zusammen mit נֶגְבָּה ergibt sich idiomatisch die Platzierung an der Südseite.
- source_word: נֶגְבָּה
  choice: Südseite
  rationale: Die Richtungsform bezeichnet die Lage nach Süden hin; in Verbindung mit יֶרֶךְ ist „Südseite“ natürlich.
- source_word: הַמִּשְׁכָּן
  choice: der Wohnung
  rationale: מִשְׁכָּן bedeutet wörtlich „Wohnung“ beziehungsweise „Wohnstätte“ und bezeichnet hier das Heiligtum als Gottes Wohnort. Die Übersetzung wahrt zugleich die Unterscheidung zum „Zelt der Begegnung“.
