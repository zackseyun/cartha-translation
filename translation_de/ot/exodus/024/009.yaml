  text: וַ/יַּ֥עַל מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן נָדָב֙ וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/009.yaml
  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: de
  text: Dann stiegen Mose und Aaron, Nadab und Abihu sowie siebzig von den Ältesten Israels hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: stiegen … hinauf
  rationale: Das Verb עלה bezeichnet eine Aufwärtsbewegung. Der deutsche Plural folgt natürlich dem zusammengesetzten Subjekt; „hinaufsteigen“ bewahrt die Richtung, ohne den im Vers nicht ausdrücklich genannten Berg zu ergänzen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Namensform.
- source_word: וְאַהֲרֹן
  choice: und Aaron
  rationale: Die Konjunktion und die eingebürgerte deutsche Namensform werden beibehalten.
- source_word: נָדָב
  choice: Nadab
  rationale: Übliche deutsche Wiedergabe des Eigennamens.
- source_word: וַאֲבִיהוּא
  choice: und Abihu
  rationale: Die hebräische Koordination wird in natürlichem Deutsch wiedergegeben; der Eigenname bleibt in seiner üblichen Form.
- source_word: וְשִׁבְעִים
  choice: sowie siebzig
  rationale: „Sowie“ ordnet die abschließende größere Gruppe natürlich in die Aufzählung ein und gibt das hebräische וְ wieder.
- source_word: מִזִּקְנֵי
  choice: von den Ältesten
  rationale: 'Die Präposition מן ist hier partitiv: Die siebzig gehören zur Gruppe der Ältesten Israels.'
- source_word: יִשְׂרָאֵל
  choice: Israels
  rationale: Der deutsche Genitiv bezeichnet knapp und idiomatisch die Zugehörigkeit der Ältesten zu Israel.
