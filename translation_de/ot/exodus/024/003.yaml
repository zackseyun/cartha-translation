source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: de
  text: 'Dann kam Mose und teilte dem Volk alle Worte Jahwes und alle Rechtsbestimmungen[a] mit. Das ganze Volk antwortete einstimmig: »Alles, was Jahwe gesagt hat, wollen wir tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Rechtssprüche« bzw. »Ordnungen«. Das hebräische Wort mischpatim bezeichnet hier verbindliche rechtliche Regelungen im Rahmen des Bundes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann kam Mose
  rationale: Das Waw consecutivum führt die Erzählung weiter; בוא wird in seiner gewöhnlichen Bedeutung »kommen« wiedergegeben.
- source_word: וַיְסַפֵּר
  choice: berichtete
  rationale: Das Piel von ספר bedeutet hier, etwas mitzuteilen oder ausführlich wiederzugeben. »Berichtete« ist natürlich und wahrt den Gedanken des Übermittelns.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: alle Worte Jahwes
  rationale: »Worte« bewahrt die konkrete Ausdrucksweise des Hebräischen und die Verbindung zur Antwort des Volkes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in der geläufigen wissenschaftlichen Form »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: הַמִּשְׁפָּטִים
  choice: Rechtsbestimmungen
  rationale: מִשְׁפָּטִים bezeichnet in diesem Bundes- und Gesetzeskontext rechtliche Entscheidungen beziehungsweise verbindliche Regelungen. »Rechtsbestimmungen« ist präzise und im modernen Deutsch verständlich.
- source_word: וַיַּעַן כָּל הָעָם קוֹל אֶחָד
  choice: Das ganze Volk antwortete wie mit einer Stimme
  rationale: Die Wendung קוֹל אֶחָד drückt die einmütige gemeinsame Antwort aus; die deutsche Redensart »wie mit einer Stimme« gibt diesen Sinn natürlich wieder.
- source_word: כָּל הַדְּבָרִים אֲשֶׁר דִּבֶּר יְהוָה
  choice: Alles, was Jahwe gesagt hat
  rationale: Im Deutschen vermeidet »Alles, was ... gesagt hat« eine schwerfällige Wiederholung, während Umfang und Aussage des Hebräischen erhalten bleiben.
- source_word: נַעֲשֶׂה
  choice: wollen wir tun
  rationale: עשה bedeutet wörtlich »tun«. Die Formulierung drückt die verbindliche Absicht des Volkes aus, ohne das Verb deutend zu »gehorchen« zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt diesen als Namen und ersetzt ihn nicht durch den Titel »der HERR«.
- issue: Charakter der מִשְׁפָּטִים
  choice: Rechtsbestimmungen
  alternative: Rechtssprüche / Ordnungen
  rationale: Der Kontext verweist auf verbindliche Rechtsregelungen des Bundes. Die gewählte Formulierung hält den rechtlichen Sinn fest, ohne eine bestimmte systematisch-theologische Einordnung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung macht den langen hebräischen Satz gut lesbar. »Wie mit einer Stimme« vermittelt die Einmütigkeit idiomatisch; »wollen wir tun« bewahrt die wörtliche und bundestheologisch offene Aussage von נַעֲשֶׂה.
