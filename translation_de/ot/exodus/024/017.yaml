source:
  edition: WLC
  text: וּ/מַרְאֵה֙ כְּב֣וֹד יְהוָ֔ה כְּ/אֵ֥שׁ אֹכֶ֖לֶת בְּ/רֹ֣אשׁ הָ/הָ֑ר לְ/עֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: de
  text: Der Anblick der Herrlichkeit Jahwes war vor den Augen der Israeliten[a] wie ein verzehrendes Feuer auf dem Gipfel des Berges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Israels“; gemeint ist das Volk Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: Anblick
  rationale: Das Substantiv bezeichnet hier die sichtbare Erscheinungsform beziehungsweise das, was wahrgenommen wurde. „Anblick“ bewahrt den visuellen Akzent, ohne eine prophetische Vision anzudeuten.
- source_word: כְּבוֹד
  choice: Herrlichkeit
  rationale: Bei Jahwe bezeichnet das Wort hier seine sichtbar offenbarte, ehrfurchtgebietende Gegenwart; „Herrlichkeit“ ist dafür die sachlich und sprachlich passende Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: wie ein verzehrendes Feuer
  rationale: כְּ kennzeichnet ausdrücklich einen Vergleich. Das Partizip von אכל bedeutet bei Feuer idiomatisch „verzehrend“ und vermittelt dessen intensive, vernichtende Wirkung.
- source_word: בְּרֹאשׁ הָהָר
  choice: auf dem Gipfel des Berges
  rationale: Die Wendung bezeichnet den obersten Teil des Berges; „Gipfel“ ist im Deutschen präzise und natürlich.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die hebräische Wendung betont, dass etwas sichtbar und offen wahrgenommen wird. Die wörtlich nahe deutsche Form bewahrt diesen visuellen Akzent.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  rationale: Die feste hebräische Volksbezeichnung umfasst hier das Volk Israel insgesamt. „Israeliten“ gibt diesen kollektiven Sinn im heutigen Deutsch klar wieder; die formnahe Wiedergabe steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Art der Erscheinung der Herrlichkeit
  choice: Anblick der Herrlichkeit … wie ein verzehrendes Feuer
  alternative: Die Herrlichkeit Jahwes war ein verzehrendes Feuer
  rationale: Die Vergleichspartikel כְּ stellt eine Ähnlichkeit her. Die Übersetzung identifiziert Jahwes Herrlichkeit daher nicht ohne Weiteres mit Feuer, sondern bewahrt den Vergleich und die damit verbundene theologische Spannung.
- issue: Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels
  rationale: Die maskuline Form ist eine herkömmliche Bezeichnung für das ganze Volk und meint im Kontext nicht ausschließlich Männer. Die idiomatische Wiedergabe vermeidet diese mögliche Fehlinterpretation, während die Fußnote die Form des Hebräischen sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, ist aber idiomatisch; der doppelte visuelle Akzent von מַרְאֵה und לְעֵינֵי wird bewusst erhalten.
