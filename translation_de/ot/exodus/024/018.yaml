  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: de
  text: Mose ging mitten in die Wolke hinein und stieg auf den Berg. Und Mose war vierzig Tage und vierzig Nächte auf dem Berg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ging … hinein
  rationale: בוא bezeichnet hier Moses Bewegung in die Wolke hinein. Die deutsche Verbklammer mit „hineingehen“ gibt Richtung und Eintritt natürlich wieder.
- source_word: בְּתוֹךְ
  choice: mitten in
  rationale: תּוֹךְ bezeichnet das Innere beziehungsweise die Mitte. „Mitten in die Wolke hinein“ betont, dass Mose in die Wolke selbst eintrat.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Direkte Wiedergabe des bestimmten Substantivs עָנָן; ein Zusatz wie „dicht“ steht nicht im hebräischen Text.
- source_word: וַיַּעַל
  choice: stieg … auf
  rationale: עלה bezeichnet die Aufwärtsbewegung. „auf den Berg steigen“ ist im Deutschen natürlich und präzise.
- source_word: אֶל הָהָר
  choice: auf den Berg
  rationale: אֶל bezeichnet hier zusammen mit עלה das Ziel des Aufstiegs. Der Akkusativ mit „auf“ gibt die gerichtete Bewegung idiomatisch wieder.
- source_word: וַיְהִי
  choice: war
  rationale: היה beschreibt hier Moses Aufenthalt beziehungsweise Zustand während der genannten Zeit, ohne ausdrücklich die Zusatznuance „blieb“ einzuführen.
- source_word: בָּהָר
  choice: auf dem Berg
  rationale: Die Präposition ב bezeichnet in diesem Zusammenhang den Ort; im Deutschen ist „auf dem Berg“ die natürliche Wiedergabe.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: vierzig Tage und vierzig Nächte
  rationale: Natürliche und genaue deutsche Wiedergabe der hebräischen Zeitangabe.
theological_decisions:
- issue: Wolkenbild als Zeichen der göttlichen Gegenwart
  choice: die Wolke
  alternative: die dichte Wolke
  rationale: Der hebräische Text verwendet hier עָנָן ohne ein Adjektiv für „dicht“. Die Übersetzung bewahrt das theophanische Bild, ohne es deutend zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „mitten in die Wolke hinein“ bewahrt die besondere Betonung des hebräischen בְּתוֹךְ; die koordinierende Satzstruktur mit „Und“ spiegelt den hebräischen Erzählfluss.
