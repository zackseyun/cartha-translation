source:
  edition: WLC
  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: de
  text: 'Dann nahm er das Buch des Bundes und las es dem Volk vor. Sie sagten: »Alles, was Jahwe gesagt hat, wollen wir tun und darauf hören.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und gehorchen«. Das hebräische Verb kann »hören/auf etwas hören« und im Zusammenhang eines Bundes auch »gehorchen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm er
  rationale: Das Wayyiqtol führt die Erzählung fort; »Dann« gibt die zeitliche Abfolge im Deutschen natürlich wieder.
- source_word: סֵפֶר הַבְּרִית
  choice: das Buch des Bundes
  rationale: Die konkrete Vorstellung eines schriftlich festgehaltenen Bundesdokuments bleibt erhalten; »Buch« ist hier verständlich und würdevoll.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: las es dem Volk vor
  rationale: Bei einem schriftlichen Dokument bedeutet קרא hier »lesen«; die Wendung בְּאָזְנֵי bezeichnet hörbares, öffentliches Vorlesen. Das deutsche »vorlesen« bildet beides idiomatisch ab.
- source_word: הָעָם
  choice: das Volk
  rationale: Der hebräische Text nennt schlicht »das Volk«; Israel muss nicht erläuternd ergänzt werden.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: Alles, was Jahwe gesagt hat
  rationale: Die umfassende Aussage von כֹּל אֲשֶׁר bleibt erhalten; das Perfekt wird im Zusammenhang natürlich mit dem deutschen Perfekt wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נַעֲשֶׂה
  choice: wollen wir tun
  rationale: עשה ist konkret und weit gefasst; »tun« vermeidet eine vorzeitige Deutung als »gehorchen«.
- source_word: וְנִשְׁמָע
  choice: und darauf hören
  rationale: שׁמע umfasst Hören, Aufmerken und im Bundeskontext Gehorchen. »Darauf hören« ist im Deutschen natürlich, nimmt den vorausgehenden Bundesinhalt auf und bewahrt beide Bedeutungsrichtungen.
theological_decisions:
- issue: Bedeutungsumfang der Bundesantwort וְנִשְׁמָע
  choice: und darauf hören
  alternative: und gehorchen
  rationale: Das Verb שׁמע kann sowohl aufmerksames Hören als auch daraus folgendes Gehorchen bezeichnen. Im unmittelbaren Kontext wurde der Bund vorgelesen, während die Bundesverpflichtung zugleich Gehorsam einschließt. Die Hauptfassung bewahrt diese Spannung; die Fußnote nennt die stärker deutende Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. »Las es dem Volk vor« ist natürlicher als eine wörtliche Wiedergabe von »in die Ohren des Volkes«. Die Formulierung »darauf hören« hält die hörbezogene und die gehorsamsbezogene Bedeutung zusammen.
