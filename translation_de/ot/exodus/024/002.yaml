id: EXO.24.2
reference: Exodus 24:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: de
  text: Mose allein soll sich Jahwe[a] nähern; sie aber sollen sich nicht nähern, und das Volk soll nicht mit ihm hinaufsteigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: Erläuterung des Gottesnamens und seiner traditionellen Wiedergabe.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: soll sich nähern
  rationale: נגשׁ bezeichnet das Herantreten oder Sichnähern. Die Soll-Form gibt den anweisenden Zusammenhang natürlich und würdevoll wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im modernen Standarddeutsch gebräuchliche Form des Namens.
- source_word: לְבַדּוֹ
  choice: allein
  rationale: Drückt knapp aus, dass ausschließlich Mose herantreten darf.
- source_word: אֶל יְהוָה
  choice: Jahwe
  rationale: Die Präposition אֶל bezeichnet die Bewegung auf jemanden zu; der Gottesname יהוה wird als Jahwe wiedergegeben.
- source_word: וְהֵם
  choice: sie aber
  rationale: Das Pronomen verweist auf die zuvor genannte Gruppe. „Aber“ macht den im Hebräischen durch die Satzfolge ausgedrückten Gegensatz zu Mose deutlich.
- source_word: לֹא יִגָּשׁוּ
  choice: sollen sich nicht nähern
  rationale: Die Wiederholung von נגשׁ wird lexikalisch beibehalten und steht im direkten Gegensatz zu Moses erlaubtem Herantreten.
- source_word: וְהָעָם
  choice: und das Volk
  rationale: Gibt עָם ohne die im Vers nicht ausdrücklich genannte Ergänzung „Israel“ wieder.
- source_word: לֹא יַעֲלוּ
  choice: soll nicht hinaufsteigen
  rationale: עלה bezeichnet hier die räumliche Bewegung auf den Berg hinauf; „hinaufsteigen“ ist im Deutschen präzise und natürlich.
- source_word: עִמּוֹ
  choice: mit ihm
  rationale: Die Pronominalform bezieht sich auf Mose.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht den offenbarten Bundesnamen im Haupttext sichtbar; die traditionelle Wiedergabe „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „sich nähern“ bewahrt die Struktur und den Kontrast des Hebräischen; die Soll-Form entspricht dem anweisenden Kontext.
