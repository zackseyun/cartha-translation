source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: de
  text: 'Dann sagte er zu Mose[a]: »Steig hinauf zu Jahwe, du gemeinsam mit Aaron, Nadab und Abihu und siebzig von den Ältesten Israels, und werft euch aus der Ferne nieder.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich setzt der hebräische Text ein: »Und zu Mose sagte er: Steig hinauf zu Jahwe.« Obwohl offenbar Jahwe spricht, steht hier »zu Jahwe« und nicht »zu mir«; manche Übersetzungen glätten die Formulierung entsprechend.'
    reason: Die auffällige dritte Person und das im Hebräischen unausgesprochene Subjekt sollen transparent bleiben.
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Dann sagte er zu Mose
  rationale: Die vorangestellte Verbindung eröffnet, an den vorherigen Zusammenhang anknüpfend, einen neuen Redeabschnitt. Das Subjekt des Verbs ist im Hebräischen nicht ausdrücklich genannt; im Deutschen ist daher das kontextuell erschlossene »er« nötig.
- source_word: עֲלֵה
  choice: Steig hinauf
  rationale: Der Imperativ von עלה bezeichnet das Hinaufgehen. »Steig hinauf« ist natürliches, gegenwärtiges Deutsch und bewahrt die räumliche Bewegung.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition אֶל bezeichnet hier die Bewegung auf jemanden zu. Der Gottesname יהוה wird als »Jahwe« wiedergegeben; die auffällige Rede von Jahwe in der dritten Person bleibt erhalten.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: du und Aaron, Nadab und Abihu
  rationale: Das ausdrücklich gesetzte Pronomen eröffnet und betont die Aufzählung der Hinaufgerufenen. Die Eigennamen werden in ihrer etablierten deutschen Form wiedergegeben.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: sowie siebzig von den Ältesten Israels
  rationale: 'Die Konstruktion mit מן ist partitiv: Gemeint sind siebzig aus der Gruppe der Ältesten. »Von den Ältesten« bewahrt diese Nuance.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: und werft euch nieder
  rationale: Das Verb bezeichnet eine ehrerbietige körperliche Niederwerfung. Diese Wiedergabe wahrt den sichtbaren Vorgang, ohne ihn ausschließlich mit dem abstrakteren Begriff »anbeten« auszulegen.
- source_word: מֵ/רָחֹק
  choice: aus der Ferne
  rationale: Die Wendung bezeichnet räumliche Distanz. »Aus der Ferne« ist klar, idiomatisch und würdevoll.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich den Tetragrammaton. »Jahwe« gibt den persönlichen Bundesnamen erkennbar wieder, ohne einen anderen Titel in den Haupttext einzusetzen.
- issue: Ungewöhnliche Formulierung, dass der offenbar göttliche Sprecher »zu Jahwe« sagt
  choice: Die Formulierung »zu Jahwe« im Haupttext beibehalten
  alternative: »zu mir« oder »vor Jahwe«
  rationale: Der Ausgangstext sagt ausdrücklich אֶל־יְהוָה. Eine Glättung würde die vorhandene sprachliche und theologische Spannung eigenmächtig auflösen; eine Fußnote macht sie transparent.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede folgt deutscher Zeichensetzung. »Werft euch nieder« bewahrt die körperliche Bildhaftigkeit; »sowie« gliedert die längere Personenliste, ohne ihren Sinn zu verändern.
