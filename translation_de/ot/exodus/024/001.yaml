revisions:
- from: 'Dann sagte er zu Mose[a]: »Steig hinauf zu Jahwe, du und Aaron, Nadab und Abihu sowie siebzig von den Ältesten Israels, und werft euch aus der Ferne nieder.«'
  to: 'Dann sagte er zu Mose[a]: »Steig hinauf zu Jahwe, du gemeinsam mit Aaron, Nadab und Abihu und siebzig von den Ältesten Israels, und werft euch aus der Ferne nieder.«'
  rationale: 'Die einzige Änderung glättet eine im Deutschen problematische Verbindung von Singularimperativ und koordiniertem »du und ...«. Sie ergänzt keine sachliche Information: Mose bleibt der singularisch Angeredete, Aaron, Nadab, Abihu und die siebzig Ältesten bleiben die mit ihm genannten Beteiligten; der anschließende Plural »werft euch« bleibt erhalten. Fußnotenanker und Fußnotentext sind sachlich korrekt und unverändert.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:41:49Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Abfolge, die ausdrücklich genannte Gruppe, die partitive Wendung »siebzig von den Ältesten Israels«, die körperliche Niederwerfung und die räumliche Distanz zutreffend wieder. Besonders wichtig ist, dass אֶל־יהוה mit »zu Jahwe« unverändert stehen bleibt; die auffällige Redeweise wird nicht zu »zu mir« harmonisiert.
  naturalness: Der Text ist insgesamt modernes, verständliches Standarddeutsch. Die Verbindung eines singularischen Imperativs (»Steig«) mit der nachfolgenden koordinierten Gruppe »du und Aaron ...« wirkt jedoch im Deutschen syntaktisch uneinheitlich, weil bei »du und Aaron« normalerweise ein Pluralimperativ erwartet wird. »du gemeinsam mit ...« bewahrt die Singularadressierung an Mose und macht zugleich die Mitbeteiligten idiomatisch deutlich.
  terminology: »Jahwe«, »Mose«, »Nadab«, »Abihu« und »Älteste Israels« sind angemessen und konsistent. »Sich niederwerfen« gibt השתחוה konkret und ohne konfessionell einengende Deutung wieder. Die Fußnote erläutert die textliche Besonderheit sachlich und bewahrt die Ambiguität bezüglich des unausgedrückten Subjekts.
  issues:
  - severity: low
    issue: Singularischer Imperativ vor einer koordinierten Personenliste
    rationale: »Steig hinauf ..., du und Aaron ...« ist im modernen Deutschen grammatisch bzw. stilistisch holprig, da die Koordination »du und Aaron« einen Plural nahelegt, während das Hebräische zunächst Mose im Singular anspricht und später zum Plural wechselt. Eine Umschreibung mit »du gemeinsam mit« wahrt diese Struktur ohne den deutschen Satzbau zu belasten.
