source:
  edition: WLC
  text: וְ/אֶל הַ/זְּקֵנִ֤ים אָמַר֙ שְׁבוּ לָ֣/נוּ בָ/זֶ֔ה עַ֥ד אֲשֶׁר נָשׁ֖וּב אֲלֵי/כֶ֑ם וְ/הִנֵּ֨ה אַהֲרֹ֤ן וְ/חוּר֙ עִמָּ/כֶ֔ם מִי בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: de
  text: 'Zu den Ältesten sagte er: »Wartet hier auf uns, bis wir zu euch zurückkehren. Seht, Aaron und Hur sind bei euch. Wer einen Streitfall[a] hat, soll sich an sie wenden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Rechtssache.'
    reason: Das hebräische Idiom בַעַל דְּבָרִים kann sowohl einen Streitfall als auch allgemeiner eine zur Entscheidung stehende Rechtssache bezeichnen.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: die Ältesten
  rationale: Der Ausdruck bezeichnet hier die anerkannten Ältesten und Leiter des Volkes, nicht lediglich ältere Männer.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Wartet hier auf uns
  rationale: ישׁב bedeutet wörtlich »sitzen, bleiben, sich aufhalten«; zusammen mit לָנוּ und der folgenden Zeitangabe ergibt sich im Deutschen natürlich die Aufforderung, an diesem Ort auf Moses und seinen Begleiter zu warten.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: bis wir zu euch zurückkehren
  rationale: Die Wendung gibt die zeitliche Grenze des Wartens an; שוב bezeichnet hier die Rückkehr zu den Ältesten.
- source_word: וְהִנֵּה
  choice: Seht
  rationale: הִנֵּה lenkt die Aufmerksamkeit auf Aaron und Hur. »Seht« bewahrt diese Funktion in würdigem, verständlichem Deutsch, ohne das altertümliche »siehe« zu verwenden.
- source_word: עִמָּכֶם
  choice: sind bei euch
  rationale: עִם bezeichnet die Anwesenheit und Gemeinschaft Aarons und Hurs bei den Ältesten.
- source_word: מִי בַעַל דְּבָרִים
  choice: Wer einen Streitfall hat
  rationale: Die idiomatische Verbindung bezeichnet jemanden mit einer strittigen beziehungsweise rechtlichen Angelegenheit. »Streitfall« macht den gerichtlichen Zusammenhang deutlich, ohne ihn unnötig einzuengen.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: soll sich an sie wenden
  rationale: Das Imperfekt hat hier auffordernden beziehungsweise anweisenden Sinn. Die deutsche Wendung gibt das Herantreten an Aaron und Hur als zuständige Ansprechpartner natürlich wieder.
theological_decisions:
- issue: Generischer Singular in einer rechtlichen Anweisung
  choice: Wer einen Streitfall hat, soll sich an sie wenden
  alternative: Wer Streitfälle hat, soll sich an sie wenden
  rationale: Das Hebräische verwendet mit מִי und יִגַּשׁ eine generische Singularform. Die deutsche Konstruktion mit »wer« bewahrt den Singular, ohne ein Geschlecht festzulegen.
- issue: Funktion Aarons und Hurs während Moses Abwesenheit
  choice: soll sich an sie wenden
  alternative: soll vor sie treten
  rationale: Der Text setzt Aaron und Hur als erreichbare Ansprechpartner für Streitfälle ein, bestimmt hier aber nicht näher Art oder Umfang ihrer richterlichen Vollmacht. Die Übersetzung lässt diese Frage offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und anweisend. »Seht« bildet den hebräischen Aufmerksamkeitsmarker ab; »sich an sie wenden« gibt die praktische Funktion von יִגַּשׁ idiomatisch wieder.
