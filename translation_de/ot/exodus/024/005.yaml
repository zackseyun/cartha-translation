  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: de
  text: Dann sandte er die jungen Männer der Israeliten aus. Sie brachten Brandopfer dar und opferten Jahwe Stiere als Friedensopfer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Gemeinschaftsopfer oder Heilsopfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Dann sandte er … aus
  rationale: Das narrative wayyiqtol führt die Handlung fort; „aussenden“ gibt שׁלח in diesem Zusammenhang natürlich wieder. Das Subjekt bleibt wie im Hebräischen unausgesprochen und ist aus dem Kontext zu erschließen.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: die jungen Männer der Israeliten
  rationale: נַעַר bezeichnet hier junge Männer; „der Israeliten“ gibt die Zugehörigkeit idiomatisch wieder, ohne das natürliche Deutsche durch „Söhne Israels“ unnötig zu erschweren.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: sie brachten Brandopfer dar
  rationale: Die feste kultische Verbindung von עלה und עֹלָה wird im Deutschen sachgerecht und idiomatisch mit „Brandopfer darbringen“ wiedergegeben.
- source_word: וַיִּזְבְּחוּ
  choice: schlachteten … als … Opfer
  rationale: זבח bezeichnet das kultische Schlachten beziehungsweise Opfern. Die Formulierung wahrt den konkreten Schlachtvorgang und zugleich seinen Opfercharakter.
- source_word: זְבָחִים שְׁלָמִים
  choice: Friedensopfer
  rationale: „Friedensopfer“ ist die geläufige deutsche Bezeichnung dieser Opferart; andere mögliche Sinnakzente werden in der Fußnote erhalten.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Die Präposition ל markiert den Empfänger beziehungsweise die Widmung der Opfer. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: פָּרִים
  choice: Stiere
  rationale: פָּרִים nennt die als Schlachtopfer dargebrachten Tiere. Die deutsche Satzstellung macht klar, dass die Stiere die Friedensopfer bilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Bundesname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutung von זְבָחִים שְׁלָמִים
  choice: Friedensopfer
  alternative: Gemeinschaftsopfer oder Heilsopfer
  rationale: Die genaue Bedeutungsnuance von שְׁלָמִים ist umstritten. Der Haupttext verwendet den etablierten Opferbegriff, während die Fußnote die anderen sachlich möglichen Deutungen offenhält.
- issue: Referenz des unausgesprochenen Subjekts in וַיִּשְׁלַח
  choice: er
  alternative: Mose
  rationale: Das Hebräische enthält nur die maskuline Verbform; „er“ bewahrt die an den Kontext gebundene Referenz, ohne den Namen ausdrücklich in den Vers einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kultische Fachbegriffe bleiben erkennbar; der Satzbau ist gegenüber der hebräischen Reihung maßvoll gegliedert. Der Fußnotenmarker [a] steht unmittelbar beim erklärten Ausdruck.
