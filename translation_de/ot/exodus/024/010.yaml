base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: de
  text: Und sie sahen den Gott Israels. Unter seinen Füßen war etwas wie ein Pflaster aus Saphir[a], so klar wie der Himmel selbst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder möglicherweise „Lapislazuli“; welche Mineralart סַפִּיר in der Antike genau bezeichnete, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wie die Arbeit eines Saphirpflasters, wie der Himmel selbst an Klarheit“. Das Bild beschreibt eine gefertigte, ziegel- oder fliesenartige Fläche unter seinen Füßen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: sie sahen
  rationale: Das Qal-Wayyiqtol von ראה bezeichnet unmittelbar visuelles Wahrnehmen. Die schlichte Wiedergabe bewahrt die Aussagekraft des hebräischen Textes.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: den Gott Israels
  rationale: Die Akkusativpartikel und die Status-constructus-Verbindung bestimmen den Gott Israels ausdrücklich als das Gesehene.
- source_word: וְתַחַת רַגְלָיו
  choice: Unter seinen Füßen war
  rationale: תַּחַת bedeutet „unter“ beziehungsweise „unterhalb“. Für den im Hebräischen verblosen Satz wird im Deutschen „war“ ergänzt; die körperbezogene Bildsprache bleibt unverändert erhalten.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: etwas wie ein Pflaster
  rationale: מַעֲשֶׂה bezeichnet Werk oder Ausführung, לִבְנָה Ziegel beziehungsweise ziegelartige Arbeit. „Etwas wie ein Pflaster“ gibt die Vergleichspartikel und den Eindruck einer gefertigten, flächigen Struktur natürlich wieder.
- source_word: הַסַּפִּיר
  choice: Saphir
  rationale: Die traditionelle Entsprechung ist „Saphir“; da in der Antike möglicherweise Lapislazuli gemeint war, wird die mineralogische Unsicherheit in einer Fußnote bewahrt.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: wie der Himmel selbst
  rationale: עֶצֶם wirkt hier verstärkend. „Der Himmel selbst“ gibt den Vergleich idiomatisch wieder, ohne das Wort unpassend wörtlich als „Knochen“ zu übersetzen.
- source_word: לָטֹהַר
  choice: so klar
  rationale: טֹהַר bezeichnet Reinheit oder Klarheit. Im visuellen Zusammenhang bringt „klar“ die optische Qualität verständlich zum Ausdruck.
theological_decisions:
- issue: Anthropomorphe Gottesschau
  choice: Die direkte Aussage „sie sahen den Gott Israels“ und die Wendung „unter seinen Füßen“ bleiben stehen.
  alternative: „Sie sahen eine Erscheinung des Gottes Israels“ oder „sie sahen den Ort, an dem der Gott Israels stand“.
  rationale: Der hebräische Text spricht ausdrücklich vom Sehen Gottes und von seinen Füßen. Eine erklärende Abschwächung würde die theologische Spannung des Textes eigenmächtig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kurze erste Satz hebt die unmittelbare Aussage der Gottesschau hervor. „Pflaster“ ist allgemein verständlich und vermittelt eine zusammenhängende, gefertigte Fläche; die Fußnote bewahrt die wörtlichere Struktur und die lexikalische Unsicherheit.
