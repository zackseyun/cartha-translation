source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: de
  text: Mose schrieb alle Worte Jahwes auf. Früh am Morgen stand er auf und baute am Fuß des Berges[a] einen Altar sowie zwölf aufgerichtete Steine[b] für die zwölf Stämme Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „unter dem Berg“, das heißt an seinem unteren Rand oder Fuß.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zwölf Steinpfeiler“; das hebräische Wort bezeichnet aufrecht hingestellte Steine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb … auf
  rationale: כתב bedeutet „schreiben“; das trennbare Verb „aufschreiben“ gibt natürlich wieder, dass Mose die zuvor gesprochenen Worte schriftlich festhielt.
- source_word: דִּבְרֵי
  choice: Worte
  rationale: דבר bezeichnet hier die von Jahwe gesprochenen Worte. „Worte“ wahrt den direkten Sinn, ohne den gesamten Inhalt auf Gebote zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen יהוה. Die gebräuchliche deutsche Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Früh am Morgen stand er auf
  rationale: Die Hifil-Form von שׁכם bedeutet idiomatisch „früh aufstehen“; בַּבֹּקֶר wird ausdrücklich mit „am Morgen“ wiedergegeben.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: baute … einen Altar
  rationale: Dies ist eine direkte und im Deutschen natürliche Wiedergabe von בנה mit מזבח.
- source_word: תַּחַת הָהָר
  choice: am Fuß des Berges
  rationale: Wörtlich steht „unter dem Berg“. Im räumlichen Zusammenhang bezeichnet die Wendung den unteren Bereich beziehungsweise Fuß des Berges.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: sowie zwölf aufgerichtete Steine
  rationale: מַצֵּבָה bezeichnet einen aufrecht hingestellten Stein oder Steinpfeiler. „Aufgerichtete Steine“ bewahrt den konkreten Sinn und vermeidet eine vorschnelle Festlegung auf eine bestimmte Bauform oder Gedenkfunktion.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: für die zwölf Stämme Israels
  rationale: ל kann hier Zuordnung oder Repräsentation ausdrücken. „Für“ wahrt diese Offenheit, ohne ausdrücklich „als Darstellung“ hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Vers verwendet das Tetragramm יהוה als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen in üblicher deutscher Form wieder, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bedeutung der zwölf aufgerichteten Steine
  choice: Die Zuordnung zu den zwölf Stämmen wird mit „für“ ausgedrückt.
  alternative: „als Sinnbilder für“ oder „entsprechend den zwölf Stämmen“
  rationale: Der Text ordnet die zwölf Steine durch ל den zwölf Stämmen zu, erklärt aber nicht ausdrücklich, ob ihre Funktion repräsentativ, erinnernd oder anderweitig kultisch war. Die Übersetzung lässt diese theologische und funktionale Offenheit bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge bleibt eng am Hebräischen; „sowie“ macht deutlich, dass Mose sowohl den Altar als auch die zwölf Steine errichtete. Die Fußnotenmarker [a] und [b] stehen unmittelbar bei den jeweils erläuterten Wendungen.
