source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Komm zu mir auf den Berg herauf und bleib dort. Ich werde dir die Steintafeln geben, das Gesetz[a] und das Gebot[b], die ich geschrieben habe, um sie zu unterweisen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Weisung und das Gebot“. Das hebräische Wort Tora bezeichnet häufig Unterweisung oder Lehre und nicht nur ein Gesetz im engeren Sinn.'
    reason: lexical_alternative
  - marker: b
    text: „Das Gesetz und das Gebot“ können als weitere Bundesweisung neben den Steintafeln oder als nähere Bezeichnung dessen verstanden werden, was auf ihnen geschrieben steht.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt; „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Komm zu mir auf den Berg herauf
  rationale: Der Imperativ mit אֵלַי bezeichnet die Bewegung hin zu Gott; die Richtungsform הָהָרָה wird im Deutschen idiomatisch durch „auf den Berg herauf“ ausgedrückt.
- source_word: וֶהְיֵה שָׁם
  choice: und bleib dort
  rationale: Wörtlich steht „und sei dort“; im Zusammenhang bezeichnet die Wendung einen fortdauernden Aufenthalt, den „bleib dort“ natürlich wiedergibt.
- source_word: וְאֶתְּנָה לְךָ
  choice: Ich werde dir … geben
  rationale: Die Kohortativform drückt hier Gottes angekündigte Absicht beziehungsweise Zusage aus.
- source_word: לֻחֹת הָאֶבֶן
  choice: die Steintafeln
  rationale: Die deutsche Zusammensetzung ist knapp, natürlich und bewahrt die Materialangabe.
- source_word: וְהַתּוֹרָה
  choice: das Gesetz
  rationale: Im Sinaibund ist „Gesetz“ die geläufige Wiedergabe; der weitere Bedeutungsumfang von תּוֹרָה als Weisung oder Lehre wird in einer Fußnote offengehalten.
- source_word: וְהַמִּצְוָה
  choice: das Gebot
  rationale: Die grammatische Einzahl des Hebräischen bleibt erhalten, ohne sie zu einer Mehrzahl oder Sammelbezeichnung aufzulösen.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: die ich geschrieben habe
  rationale: Das Perfekt bezeichnet die als abgeschlossen dargestellte göttliche Schreibtätigkeit; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: לְהוֹרֹתָם
  choice: um sie zu unterweisen
  rationale: Der Hifil-Infinitiv von ירה drückt den Zweck des Lehrens oder Unterweisens aus; das Suffix der dritten Person Plural bezieht sich auf das Volk Israel.
theological_decisions:
- issue: Verhältnis von „Gesetz und Gebot“ zu den Steintafeln
  choice: Die koordinierten Ausdrücke bleiben im Haupttext nebeneinander stehen.
  alternative: „Gesetz und Gebot“ könnten als nähere Erklärung dessen verstanden werden, was auf den Tafeln steht, oder alle Ausdrücke könnten ausschließlich auf den Dekalog bezogen werden.
  rationale: Die hebräische Reihung entscheidet nicht eindeutig, ob weitere Bundesweisung neben den Tafeln gemeint ist oder ob Gesetz und Gebot deren Inhalt näher bestimmen. Die Übersetzung löst diese Spannung nicht auf.
- issue: Bezugswort des Relativsatzes אֲשֶׁר כָּתַבְתִּי
  choice: Die deutsche Formulierung lässt den Relativsatz auf die gesamte vorausgehende Gabe beziehungsweise auf deren Inhalt bezogen sein.
  alternative: Der Relativsatz kann enger nur auf „das Gesetz und das Gebot“ oder appositionell auf den Inhalt der Tafeln bezogen werden.
  rationale: Das hebräische Relativpronomen ist unveränderlich und legt den grammatischen Bezug nicht eindeutig fest; eine Fußnote macht die Deutungsmöglichkeiten sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Jahwe“ bewahrt den Gottesnamen; „Gebot“ bleibt entsprechend dem Hebräischen im Singular. Die Satzgliederung vermeidet unnötig altertümliche Formen und erhält zugleich die offene Beziehung zwischen Tafeln, Gesetz und Gebot.
