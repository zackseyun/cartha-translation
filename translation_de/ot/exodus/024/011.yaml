  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: de
  text: Doch er streckte seine Hand nicht gegen die Vornehmen der Israeliten aus. Sie sahen Gott[a] und aßen und tranken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie schauten Gott.“ Das Verb kann ein bewusstes, betrachtendes Schauen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: Doch gegen
  rationale: In Verbindung mit der Handbewegung bezeichnet אֶל hier die feindlich gerichtete Handlung; „gegen“ gibt diese Bedeutung natürlich wieder. Das einleitende וְ markiert im Zusammenhang einen Gegensatz.
- source_word: אֲצִילֵי בְּנֵי יִשְׂרָאֵל
  choice: die Vornehmen der Israeliten
  rationale: אֲצִילֵי bezeichnet herausgehobene, angesehene Vertreter des Volkes. „Vornehmen“ bewahrt diesen Rangbezug, während „der Israeliten“ die hebräische Abstammungsformel im heutigen Deutsch verständlich wiedergibt.
- source_word: לֹא שָׁלַח יָדוֹ
  choice: erhob er seine Hand nicht
  rationale: Die Wendung bezeichnet hier eine gegen jemanden gerichtete, strafende oder gewaltsame Handlung. „Die Hand gegen jemanden erheben“ ist im Deutschen idiomatisch und bewahrt zugleich das Bild der Hand.
- source_word: וַיֶּחֱזוּ
  choice: Sie sahen
  rationale: Das Verb bezeichnet Sehen und kann zugleich ein bewusstes Schauen oder Betrachten ausdrücken. „Sahen“ ist klar und direkt; die mögliche stärkere Nuance wird in der Fußnote genannt.
- source_word: אֶת הָאֱלֹהִים
  choice: Gott
  rationale: Die bestimmte Form bezeichnet hier den Gott Israels. Im Deutschen steht der Eigenname „Gott“ ohne Artikel.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: und aßen und tranken
  rationale: Die beiden aufeinanderfolgenden Verben werden schlicht und unverstärkt wiedergegeben; so bleibt die auffällige Normalität des Essens und Trinkens nach der Gottesbegegnung erhalten.
theological_decisions:
- issue: Subjekt von „erhob ... seine Hand nicht“
  choice: Das im Hebräischen unausgesprochene Subjekt wird mit „er“ wiedergegeben und bezieht sich im Zusammenhang auf Gott.
  alternative: Eine unpersönliche oder passivische Formulierung ohne ausdrückliches Subjekt.
  rationale: Der Kontext weist eindeutig auf Gott als Handelnden. Das Pronomen klärt die deutsche Syntax, ohne eine zusätzliche theologische Aussage einzuführen.
- issue: Art der Gottesbegegnung
  choice: „Sie sahen Gott“
  alternative: „Sie sahen eine Erscheinung Gottes“ oder „Sie schauten Gott“.
  rationale: Der hebräische Text spricht unmittelbar davon, dass sie Gott sahen. Eine erklärende Abschwächung zu einer bloßen Erscheinung würde die Spannung zu anderen Aussagen über die Unsichtbarkeit beziehungsweise Unanschaubarkeit Gottes vorschnell auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah am hebräischen Bild, vermeidet jedoch unnatürliche Wortstellung. Die direkte Aussage über das Sehen Gottes wird nicht harmonisierend abgeschwächt.
