  text: וַ/יָּ֣קָם מֹשֶׁ֔ה וִ/יהוֹשֻׁ֖עַ מְשָׁרְת֑/וֹ וַ/יַּ֥עַל מֹשֶׁ֖ה אֶל הַ֥ר הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: de
  text: Da stand Mose mit Josua, seinem Diener[a], auf, und Mose stieg auf den Berg Gottes hinauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinem persönlichen Begleiter« beziehungsweise »seinem Assistenten«. Das hebräische Wort bezeichnet jemanden, der einer Person dient oder ihr aufwartet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: stand ... auf
  rationale: Das Qal wayyiqtol von קום bezeichnet hier das Aufstehen als nächsten Schritt der Erzählung; die deutsche Wendung bleibt natürlich und legt nicht schon ausdrücklich ein Aufbrechen fest.
- source_word: וִיהוֹשֻׁעַ
  choice: mit Josua
  rationale: Die mit ו koordinierte Nominalgruppe nennt Josua als denjenigen, der zusammen mit Mose aufsteht. Die übliche deutsche Namensform ist Josua.
- source_word: מְשָׁרְתוֹ
  choice: seinem Diener
  rationale: Das Wort von שׁרת bezeichnet jemanden, der einer Person aufwartet oder ihr dient. »Diener« wahrt die lexikalische Breite; eine Fußnote erläutert, dass hier ein persönlicher Begleiter oder Assistent gemeint sein kann.
- source_word: וַיַּעַל
  choice: stieg ... hinauf
  rationale: עלה bezeichnet die Aufwärtsbewegung zum Berg. »stieg ... hinauf« gibt diese räumliche Bedeutung idiomatisch wieder.
- source_word: הַר הָאֱלֹהִים
  choice: den Berg Gottes
  rationale: Die Wendung wird eng und ohne erklärende Paraphrase wiedergegeben; so bleibt ihre sakrale Bedeutung erhalten.
theological_decisions:
- issue: Verhältnis Josuas zu Mose in מְשָׁרְתוֹ
  choice: Josua wird als Moses »Diener« bezeichnet, mit Erläuterung der möglichen Bedeutung »persönlicher Begleiter oder Assistent«.
  alternative: »sein Assistent«, »sein Begleiter« oder »sein Amtsträger«
  rationale: »Diener« bewahrt die Bedeutungsbreite des hebräischen Ausdrucks, ohne Sklaverei oder ein späteres kultisches beziehungsweise kirchliches Amt zu behaupten. Die Fußnote verhindert zugleich ein unnötig enges Verständnis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »Mose« folgt dem hebräischen Satzbau und macht deutlich, dass ausdrücklich Mose auf den Berg Gottes hinaufstieg.
