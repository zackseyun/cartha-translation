translation:
  language: de
  text: Mose nahm die Hälfte des Blutes und tat sie in Schalen. Die Hälfte des Blutes sprengte er auf den Altar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „spritzte er auf den Altar“ oder „warf er gegen den Altar“. Das hebräische Verb kann im Opferkontext unterschiedlich wiedergegeben werden und bezeichnet wahrscheinlich ein kräftiges Ausbringen des Blutes.'
