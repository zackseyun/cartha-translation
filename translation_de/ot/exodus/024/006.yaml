lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: Die gewöhnliche erzählende Bedeutung von לקח; „nahm“ ist im Deutschen klar und natürlich.
- source_word: חֲצִי הַדָּם
  choice: die Hälfte des Blutes
  rationale: Gibt die partitive Konstruktion eindeutig und idiomatisch wieder.
- source_word: וַיָּשֶׂם בָּאַגָּנֹת
  choice: füllte sie in Schalen
  rationale: שׂים bezeichnet allgemein das Platzieren; zusammen mit Blut und Gefäßen drückt „füllte … in Schalen“ den Vorgang im Deutschen natürlich aus. Das Pronomen bezieht sich auf die Hälfte des Blutes.
- source_word: בָּאַגָּנֹת
  choice: in Schalen
  rationale: אַגָּנֹת bezeichnet Gefäße zur Aufnahme von Flüssigkeit; „Schalen“ ist verständlich und für den Opferkontext passend.
- source_word: זָרַק
  choice: sprengte
  rationale: Das Verb bezeichnet im Opferkontext das kräftige Ausbringen beziehungsweise Werfen von Blut, nicht notwendig ein feines Besprengen. „Sprengte“ ist eine etablierte, knappe deutsche Ritualbezeichnung, deren mögliche Bedeutungsbreite in der Fußnote erläutert wird.
- source_word: עַל הַמִּזְבֵּחַ
  choice: an den Altar
  rationale: עַל kann hier die Fläche beziehungsweise das Ziel der Blutapplikation bezeichnen; mit „sprengte“ gibt „an den Altar“ die gerichtete Handlung natürlich wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Übliche deutsche Form des hebräischen Personennamens.
theological_decisions:
- issue: Rituelle Anwendung des Blutes
  choice: „sprengte er an den Altar“
  alternative: „spritzte er auf den Altar“ oder „warf er gegen den Altar“
  rationale: Die Übersetzung bewahrt den kräftigen Charakter von זָרַק im Opferkontext, ohne die Handlung als feines Besprengen festzulegen. Die sachlich möglichen Wiedergaben werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Wiederholung, während die zweimalige Nennung des Blutes und die symmetrische Aufteilung erhalten bleiben. Der Fußnotenmarker steht unmittelbar nach der strittigen Ritualformulierung.
