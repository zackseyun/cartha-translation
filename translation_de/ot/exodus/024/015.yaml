  yaml_path: translation/ot/exodus/024/015.yaml
  text: Then Moses went up onto the mountain[a], and the cloud covered the mountain.
translation:
  language: de
  text: Dann stieg Mose auf den Berg[a], und die Wolke bedeckte den Berg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Mose stieg zu dem Berg hinauf.“ Die hebräische Erzählungsverknüpfung kann schlicht mit „und“ wiedergegeben werden; die Präposition kann „zu“ bedeuten oder hier zusammen mit „hinaufsteigen“ als Bewegung auf den Berg verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: stieg … auf
  rationale: עלה bezeichnet hier die Aufwärtsbewegung. „stieg … auf“ ist im Deutschen natürlich und bewahrt die Richtung, ohne unnötig feierlich zu klingen.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Eingebürgerte deutsche Namensform.
- source_word: אֶל
  choice: auf
  rationale: In Verbindung mit עלה und dem Berg bezeichnet אֶל die Bewegung hinauf auf den Berg. Die Alternative „zu“ bleibt grammatisch möglich und wird in der Fußnote genannt.
- source_word: הָהָר
  choice: den Berg
  rationale: הַר bedeutet „Berg“ oder „Hügel“; im Sinai-Kontext ist „Berg“ die sachlich und traditionell passende Wiedergabe.
- source_word: וַיְכַס
  choice: bedeckte
  rationale: כסה bedeutet unmittelbar „bedecken“. Die Wiedergabe vermeidet die stärker deutende Alternative „hüllte … ein“.
- source_word: הֶעָנָן
  choice: die Wolke
  rationale: Der bestimmte Ausdruck wird schlicht als „die Wolke“ wiedergegeben, ohne ihre Bedeutung im weiteren Kontext ausdrücklich in den Vers einzutragen.
- source_word: אֶת
  choice: '[Akkusativ durch die deutsche Syntax ausgedrückt]'
  rationale: Der hebräische Kennzeichner des bestimmten direkten Objekts hat kein eigenes deutsches Gegenstück.
- source_word: וַ
  choice: Dann / und
  rationale: Das erste narrative Waw wird zur Verdeutlichung der Abfolge mit „Dann“, das zweite als verbindendes „und“ wiedergegeben.
theological_decisions:
- issue: Wesen und Bedeutung der Wolke
  choice: Die Wolke
  alternative: die Herrlichkeitswolke / die Wolke des HERRN
  rationale: Der hebräische Vers nennt lediglich „die Wolke“. Obwohl der Zusammenhang sie mit Gottes Gegenwart verbindet, wird diese Deutung nicht ausdrücklich in den Vers aufgenommen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von „Berg“ bleibt entsprechend dem hebräischen Text erhalten.
