base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: de
  text: Da ließ sich die Herrlichkeit Jahwes auf dem Berg Sinai nieder, und die Wolke bedeckte ihn[a] sechs Tage lang. Am siebten Tag rief Jahwe Mose aus der Mitte der Wolke zu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Wolke bedeckte die Herrlichkeit Jahwes“, wenn sich das hebräische Suffix auf die Herrlichkeit Jahwes statt auf den Berg Sinai bezieht.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „aus dem Inneren der Wolke“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: ließ sich … nieder
  rationale: Das Verb שכן bezeichnet hier das Einnehmen einer bleibenden oder ruhenden Gegenwart. „Ließ sich nieder“ gibt die konkrete Bewegung und das anschließende Verweilen natürlich wieder.
- source_word: כְּבוֹד יְהוָה
  choice: die Herrlichkeit Jahwes
  rationale: „Herrlichkeit“ ist die etablierte und sachgerechte Wiedergabe von כָּבוֹד für die machtvolle, wahrnehmbare Gegenwart und Hoheit Gottes; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עַל הַר סִינַי
  choice: auf dem Berg Sinai
  rationale: Die Formulierung bewahrt die räumliche Aussage und entspricht natürlichem modernem Deutsch.
- source_word: וַיְכַסֵּהוּ
  choice: bedeckte ihn
  rationale: Das maskuline Suffix wird im Haupttext auf den ebenfalls maskulinen „Berg“ bezogen. Da auch כָּבוֹד im Hebräischen maskulin ist, bleibt die alternative Zuordnung in einer Fußnote erhalten.
- source_word: שֵׁשֶׁת יָמִים
  choice: sechs Tage lang
  rationale: Die Wendung gibt den hebräischen Akkusativ der Zeitdauer idiomatisch und präzise wieder.
- source_word: וַיִּקְרָא אֶל מֹשֶׁה
  choice: rief er Mose … zu
  rationale: „Jemandem zurufen“ ist eine natürliche Wiedergabe von קרא אל. Das Pronomen bewahrt den hebräischen Erzählfluss, ohne den unausgesprochenen Handlungsträger ausdrücklich einzusetzen.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Am siebten Tag
  rationale: Natürliche deutsche Zeitangabe, die den bestimmten hebräischen Ordinalausdruck genau wiedergibt.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: aus der Mitte der Wolke
  rationale: 'Die Wiedergabe erhält die räumliche Bildhaftigkeit von מִתּוֹךְ: Der Ruf kommt aus dem Inneren der Wolke.'
theological_decisions:
- issue: Unausgesprochenes Subjekt von וַיִּקְרָא („er rief“)
  choice: Das Pronomen „er“ bleibt stehen; im Zusammenhang ist Jahwe der Rufende.
  alternative: „Jahwe rief Mose … zu“ oder die Herrlichkeit Jahwes als metonymisches Subjekt verstehen.
  rationale: Der hebräische Text nennt an dieser Stelle kein neues Subjekt. Das Pronomen erhält diese Erzählweise und vermeidet eine unnötige ausdrückliche Festlegung, während der Kontext Jahwe als Rufenden nahelegt.
- issue: Bezugswort des Objektsuffixes in וַיְכַסֵּהוּ
  choice: Die Wolke bedeckte den Berg Sinai.
  alternative: Die Wolke bedeckte die Herrlichkeit Jahwes.
  rationale: Beide möglichen Bezugswörter sind im Hebräischen maskulin. Das Szenenbild und der naheliegende räumliche Bezug sprechen für den Berg; die echte grammatische Mehrdeutigkeit wird in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der hebräischen Erzählfolge, vermeidet altertümliche Wendungen und bewahrt die echte Mehrdeutigkeit beim Bezugswort des Objektsuffixes.
