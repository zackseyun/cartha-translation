base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: de
  text: 'Da nahm Mose das Blut und sprengte es auf das Volk[a] und sagte: »Seht, das Blut des Bundes, den Jahwe mit euch in Bezug auf all diese Worte geschlossen hat.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »warf es auf das Volk«. Das hebräische Verb bedeutet grundsätzlich »werfen« oder »schleudern« und kann im Opferdienst die rituelle Anwendung des Blutes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »den Jahwe mit euch geschnitten hat«. »Einen Bund schneiden« ist ein hebräisches Idiom für »einen Bund schließen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: Das narrative Wayyiqtol wird im Deutschen natürlich mit »Da nahm« wiedergegeben und führt die Handlung fort.
- source_word: הַדָּם
  choice: das Blut
  rationale: Der bestimmte Artikel verweist auf das zuvor genannte Opferblut.
- source_word: וַיִּזְרֹק
  choice: sprengte
  rationale: זרק bezeichnet ein Werfen oder Schleudern und kann im Opferkontext die rituelle Anwendung von Blut ausdrücken. »Sprengte« ist im Deutschen sachgerecht und weniger missverständlich als »warf«.
- source_word: עַל הָעָם
  choice: auf das Volk
  rationale: Die räumliche Bedeutung von עַל bleibt unmittelbar erhalten.
- source_word: הִנֵּה
  choice: Seht, das ist
  rationale: Die deiktische Partikel präsentiert das Blut feierlich und nachdrücklich; die Formulierung ist zugleich würdig und in modernem Deutsch verständlich.
- source_word: דַם הַבְּרִית
  choice: das Blut des Bundes
  rationale: Die hebräische Status-constructus-Verbindung wird formal bewahrt, auch wegen ihrer theologischen und innerbiblischen Bedeutung.
- source_word: כָּרַת
  choice: geschlossen hat
  rationale: Wörtlich steht »geschnitten hat«, doch im Deutschen lautet die etablierte und natürliche Entsprechung des hebräischen Bundesidioms »einen Bund schließen«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die übliche deutsche Form.
- source_word: עִמָּכֶם
  choice: mit euch
  rationale: Die Präposition mit dem Suffix der zweiten Person Plural wird direkt wiedergegeben.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: aufgrund all dieser Worte
  rationale: עַל verknüpft den Bund mit den vorausgehenden Worten als Grundlage seiner Schließung. »Worte« bewahrt die konkrete Lexik von דְּבָרִים, ohne sie vorschnell auf »Bestimmungen« zu verengen.
theological_decisions:
- issue: Wiedergabe des Bundesidioms כָּרַת ... בְּרִית
  choice: den Bund ... geschlossen hat
  alternative: den Bund ... geschnitten hat
  rationale: Das hebräische Idiom spricht wörtlich vom Schneiden eines Bundes, möglicherweise vor dem Hintergrund eines Opferritus. Die deutsche Wendung »einen Bund schließen« gibt die Bedeutung natürlich wieder, während die Fußnote die Bildlichkeit des Ausgangstextes offenlegt.
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der persönliche Gottesname. Seine Wiedergabe als »Jahwe« erhält diese Unterscheidung gegenüber einem Titel.
- issue: Bezug von עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: aufgrund all dieser Worte
  alternative: in Bezug auf all diese Worte
  rationale: Die Präposition kann den Bund auf die gesprochenen Worte beziehen oder diese als seine Grundlage bezeichnen. »Aufgrund« passt zum Ratifikationszusammenhang, ohne »Worte« als bloße Vertragsbestimmungen zu paraphrasieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Sprengte« wahrt den rituellen Zusammenhang, während eine Fußnote die konkrete Grundbedeutung des hebräischen Verbs erhält. Das traditionelle deutsche Bundesidiom »einen Bund schließen« vermeidet die unnatürliche Lehnwendung »einen Bund schneiden«.
