  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: de
  text: Und der Vorhang für das Tor des Vorhofs war in kunstvoller Stickarbeit gefertigt, aus blauem, purpurfarbenem und scharlachrotem Garn sowie aus feinem gezwirntem Leinen. Er war zwanzig Ellen lang und fünf Ellen hoch[b], wie die Behänge des Vorhofs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Buntwirkarbeit“ oder „Arbeit eines Buntwirkers“. Die genaue Textiltechnik ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und die Höhe in der Breite fünf Ellen“. Die ungewöhnliche hebräische Maßangabe besagt wahrscheinlich, dass der Torvorhang ebenso hoch war wie die Behänge des Vorhofs.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: Vorhang für das Tor des Vorhofs
  rationale: מָסַךְ bezeichnet hier einen textilen Abschluss am Zugang. „Vorhang“ ist im Deutschen natürlich und unterscheidet ihn von den umlaufenden Behängen; שַׁעַר bleibt mit „Tor“ räumlich konkret.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: Arbeit eines Kunstwebers
  rationale: Die Wendung bezeichnet die Arbeit eines spezialisierten Textilhandwerkers, vermutlich mit farbigen Mustern. „Kunstweber“ wahrt den Handwerkerbezug, ohne die nicht völlig sichere Technik auf bloße Stickerei festzulegen.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: blaues und purpurfarbenes und scharlachrotes Garn
  rationale: Die Farbbezeichnungen stehen in einer Textilmaterialliste. „Garn“ wird zur natürlichen deutschen Verständlichkeit einmal für die koordinierte Reihe ergänzt; die wiederholten „und“ bewahren den hebräischen Aufzählungsstil.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: gezwirntes feines Leinen
  rationale: Die Wiedergabe erhält sowohl die hohe Qualität des Leinens als auch die Aussage, dass seine Fäden gezwirnt beziehungsweise mehrfach zusammengedreht waren.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: zwanzig Ellen lang
  rationale: Die antike Maßeinheit wird als „Elle“ bewahrt, statt durch einen unsicheren modernen Näherungswert ersetzt zu werden.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת
  choice: fünf Ellen hoch
  rationale: קוֹמָה bezeichnet die Höhe. Die ungewöhnliche Verbindung mit בְרֹחַב wird im Haupttext natürlich dimensional wiedergegeben und in einer Fußnote transparent gemacht.
- source_word: לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: entsprechend der Breite der Behänge des Vorhofs
  rationale: לְעֻמַּת drückt eine Entsprechung aus. Im Kontext bezieht sich die Fünf-Ellen-Angabe wahrscheinlich auf dieselbe vertikale Abmessung wie bei den Behängen; die deutsche Formulierung wahrt dabei die im Hebräischen ausdrücklich genannte „Breite“.
