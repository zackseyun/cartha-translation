- from: Und der Vorhang für das Tor des Vorhofs war eine Arbeit eines Kunstwebers[a], aus blauem und purpurfarbenem und scharlachrotem Garn sowie gezwirntem feinem Leinen. Er war zwanzig Ellen lang und fünf Ellen hoch[b], entsprechend der Breite der Behänge des Vorhofs.
  to: Und der Vorhang für das Tor des Vorhofs war in kunstvoller Stickarbeit gefertigt, aus blauem, purpurfarbenem und scharlachrotem Garn sowie aus feinem gezwirntem Leinen. Er war zwanzig Ellen lang und fünf Ellen hoch[b], wie die Behänge des Vorhofs.[a]
  rationale: Die Schlussphrase wird so gefasst, dass sie die Entsprechung des Torvorhangs zu den Behängen ausdrückt, ohne „Breite“ fälschlich als Vergleichsmaß der Höhe auszugeben. Die wörtliche, textkritisch schwierige Maßformel bleibt in der Fußnote dokumentiert. Die Textiltechnik wird im Haupttext mit der naheliegenden Bedeutung von רֹקֵם wiedergegeben und durch eine alternative Fußnote abgesichert.
