language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֗עַשׂ אֵ֚ת הַ/כִּיּ֣וֹר נְחֹ֔שֶׁת וְ/אֵ֖ת כַּנּ֣/וֹ נְחֹ֑שֶׁת בְּ/מַרְאֹת֙ הַ/צֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: de
  text: Er machte das Becken aus Bronze und sein Gestell aus Bronze, und zwar aus den Spiegeln der Frauen, die am Eingang des Zeltes der Begegnung Dienst taten[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die sich am Eingang des Zeltes der Begegnung versammelten«. Das Hebräische kann sowohl ein geordnetes Zusammenkommen als auch einen Dienst hervorheben.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind Spiegel aus poliertem Metall. In der Antike bestanden Spiegel gewöhnlich aus polierter Bronze und nicht aus Glas.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: Becken
  rationale: Bezeichnet das große Waschbecken für den Dienst am Heiligtum; »Becken« ist im heutigen Deutsch klar und natürlich.
- source_word: כַּן
  choice: Gestell
  rationale: Bezeichnet die tragende Vorrichtung beziehungsweise den Sockel des Beckens; »Gestell« gibt die Funktion verständlich wieder.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Im Zusammenhang mit den Geräten des Heiligtums ist »Bronze« die übliche und sachlich plausible Wiedergabe, auch wenn das hebräische Wort Kupfer beziehungsweise Kupferlegierungen weiter fassen kann.
- source_word: בְּמַרְאֹת
  choice: aus den Spiegeln
  rationale: 'Die Präposition wird hier am besten als Angabe des Materials beziehungsweise der Herkunft verstanden: Becken und Gestell wurden aus den Spiegeln gefertigt.'
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: die Frauen, die … Dienst taten
  rationale: Die Wortgruppe aus der Wurzel צבא kann ein geordnetes Zusammenkommen oder einen geregelten Dienst bezeichnen. »Dienst taten« drückt die zielgerichtete Tätigkeit aus, ohne ein priesterliches Amt vorauszusetzen.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: am Eingang des Zeltes der Begegnung
  rationale: Gibt die räumliche Aussage klar wieder und verwendet für אֹהֶל מוֹעֵד die verständliche, bedeutungsnahe Bezeichnung »Zelt der Begegnung«.
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Entspricht der fortlaufenden hebräischen Erzählform in natürlichem deutschem Präteritum; das einleitende ו muss nicht eigens mit »und« wiedergegeben werden.
theological_decisions:
- issue: Identität und Aufgabe der הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: Frauen, die am Eingang des Zeltes der Begegnung Dienst taten
  alternative: Frauen, die sich am Eingang des Zeltes der Begegnung versammelten
  rationale: Die Wurzel צבא kann sowohl geordnetes Sichversammeln als auch Dienstleistung ausdrücken. Der Kontext legt eine zielgerichtete Tätigkeit nahe, nennt jedoch kein bestimmtes priesterliches oder liturgisches Amt. Die Hauptfassung bewahrt diese Zurückhaltung; die Fußnote erhält die echte sprachliche Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Dienst taten« ist verständlich und vermeidet sowohl das altertümliche »dienten« in amtlichem Sinn als auch eine unbelegte Festlegung auf einen priesterlichen Dienst. Die Wiederholung »aus Bronze« bewahrt die Hervorhebung des hebräischen Textes.
