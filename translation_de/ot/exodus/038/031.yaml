translation:
  language: de
  text: die Sockel[a] des Vorhofs ringsum, die Sockel des Tores des Vorhofs, alle Pflöcke[b] der Stiftshütte und alle Pflöcke des Vorhofs ringsum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Fußstücke oder Fassungen.'
