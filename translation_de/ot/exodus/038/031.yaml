lexical_decisions:
- source_word: אַדְנֵי
  choice: Sockel
  rationale: Das Wort bezeichnet hier die metallenen Fundament- oder Aufnahmeteile für Pfosten. „Sockel“ ist im Deutschen klar, konkret und für Vorhof und Tor gleichermaßen passend.
- source_word: חָצֵר
  choice: Vorhof
  rationale: „Vorhof“ ist die geläufige deutsche Bezeichnung für den umschlossenen Außenbereich des Heiligtums und gibt den räumlichen Sinn präzise wieder.
- source_word: סָבִיב
  choice: ringsum
  rationale: „Ringsum“ bewahrt den Umfangssinn des hebräischen Ausdrucks und lässt sich an beiden Stellen natürlich wiedergeben.
- source_word: שַׁעַר
  choice: Tor
  rationale: Das Wort bezeichnet den Tor- beziehungsweise Eingangsbereich des Vorhofs; „Tor“ ist die direkte und traditionelle Entsprechung.
- source_word: יִתְדֹת
  choice: Pflöcke
  rationale: Gemeint sind Pflöcke zur Befestigung der tragbaren Heiligtumsanlage. „Pflöcke“ ist knapp und im Deutschen anschaulich.
- source_word: מִּשְׁכָּן
  choice: Wohnstätte
  rationale: „Wohnstätte“ gibt die Grundbedeutung des hebräischen Namens für das tragbare Heiligtum wieder und bewahrt dessen theologische Bildsprache, ohne sie durch eine konfessionell geprägte Benennung festzulegen.
- source_word: כָּל
  choice: alle
  rationale: „Alle“ erfasst bei den pluralischen Pflöcken den umfassenden Sinn des hebräischen Ausdrucks.
- source_word: וְאֵת / וְאֶת
  choice: und
  rationale: Die Verbindung mit dem direkten Objektmarker führt die Aufzählung fort. Im Deutschen wird dies natürlich durch die Reihung und vor dem letzten Glied durch „und“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe von מִשְׁכָּן als Bezeichnung des Heiligtums
  choice: Wohnstätte
  alternative: Stiftshütte / Heiligtumszelt
  rationale: „Wohnstätte“ hält die im hebräischen Wort enthaltene Vorstellung des Wohnens Gottes offen und vermeidet sowohl eine altertümliche Fachbezeichnung als auch eine erklärende Erweiterung.
translation_notes:
  register: Moderner, würdiger Inventarstil. Der Vers bleibt als Fortsetzung der vorausgehenden Aufzählung ohne ergänztes Prädikat stehen. Die Wiederholung von „ringsum“ folgt dem hebräischen Text.
