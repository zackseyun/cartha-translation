- from: Und bei ihm war Oholiab, der Sohn Ahisamachs[a], vom Stamm Dan, ein Kunsthandwerker, Musterweber und Sticker in blauem und purpurfarbenem Garn, in Karmesin[b] und in feinem Leinen.
