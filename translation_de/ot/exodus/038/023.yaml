  rationale: Die Revision ersetzt die zu spezifische Berufsbezeichnung „Musterweber“ durch „Musterentwerfer“, glättet die Einleitung und gibt die textilen Farb- und Materialbezeichnungen parallel wieder. Die Namensfußnote wird an die im Audit bezeugte alternative Umschrift des Namens Oholiab angeglichen. Die Wiedergabe vermeidet eine nicht gesicherte Festlegung darauf, ob die Farbbezeichnungen jeweils Garn oder ein anderes Textilmaterial meinen.
