base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: de
  text: Und mit ihm war Oholiab[a], Sohn Ahisamachs, vom Stamm Dan, ein Kunsthandwerker, Musterentwerfer und Sticker in Blau, Purpur, Scharlach[b] und feinem Leinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Aholiab.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch eine Bezeichnung für scharlachrot gefärbtes Textilmaterial; auch einfach: Scharlachrot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Und bei ihm war
  rationale: Die verblos formulierte hebräische Wendung stellt Oholiab als Mitarbeiter des zuvor genannten Bezalel vor; „war“ wird für natürliches Deutsch ergänzt.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Oholiab, der Sohn Ahisamachs
  rationale: Die Eigennamen werden nach geläufiger deutscher Bibeltradition transkribiert; der Genitiv gibt das Patronym natürlich und genau wieder.
- source_word: לְמַטֵּה דָן
  choice: vom Stamm Dan
  rationale: Die Wendung bezeichnet die Stammeszugehörigkeit.
- source_word: חָרָשׁ
  choice: Kunsthandwerker
  rationale: Das Wort bezeichnet hier einen fachkundigen Handwerker; eine Festlegung auf „Graveur“ wäre angesichts des anschließenden Textilkontexts unnötig eng.
- source_word: חֹשֵׁב
  choice: Musterweber
  rationale: Im Heiligtumskontext bezeichnet das Wort einen Kunsthandwerker, der kunstvolle textile Muster gestaltet; „Musterweber“ unterscheidet diese Tätigkeit verständlich vom Sticken.
- source_word: רֹקֵם
  choice: Sticker
  rationale: Die Bezeichnung meint einen Handwerker, der farbige Stickarbeiten ausführt.
- source_word: תְּכֵלֶת ... אַרְגָּמָן
  choice: blauem und purpurfarbenem Garn
  rationale: Die Farbbezeichnungen stehen im Kontext textiler Arbeiten. „Garn“ wird zur natürlichen Verdeutlichung des Materials gemeinsam auf beide bezogen.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: Karmesin
  rationale: Die hebräische Fügung bezeichnet karmesinrotes, gefärbtes Textilmaterial; die knappe Wiedergabe lässt offen, ob Garn oder Stoff gemeint ist.
- source_word: שֵּׁשׁ
  choice: feinem Leinen
  rationale: Im Heiligtumskontext ist feines Leinen gemeint.
