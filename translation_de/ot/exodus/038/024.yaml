  text: כָּל הַ/זָּהָ֗ב הֶֽ/עָשׂוּי֙ לַ/מְּלָאכָ֔ה בְּ/כֹ֖ל מְלֶ֣אכֶת הַ/קֹּ֑דֶשׁ וַ/יְהִ֣י זְהַ֣ב הַ/תְּנוּפָ֗ה תֵּ֤שַׁע וְ/עֶשְׂרִים֙ כִּכָּ֔ר וּ/שְׁבַ֨ע מֵא֧וֹת וּ/שְׁלֹשִׁ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: de
  text: Das gesamte Gold, das bei sämtlichen Arbeiten am Heiligtum verwendet wurde – das Gold der Schwinggabe[a] –, betrug 29 Talente und 730 Schekel[b], nach dem Schekel des Heiligtums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Schwinggabe« wird ein hebräischer Ausdruck für eine Gabe wiedergegeben, die dem HERRN in einer rituellen Handlung dargebracht wurde.
    reason: cultural_note
  - marker: b
    text: Talent und Schekel sind antike Gewichtseinheiten; hier gilt der Gewichtsstandard des Heiligtums.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי
  choice: verwendet wurde
  rationale: Das passive Partizip bezeichnet hier das Gold, das beim Bau und bei der Anfertigung der heiligen Gegenstände eingesetzt wurde. »Verwendet« vermeidet den missverständlichen Eindruck, das Gold selbst sei hergestellt worden.
- source_word: לַמְּלָאכָה
  choice: für die Arbeiten
  rationale: מְלָאכָה bezeichnet in diesem Abrechnungszusammenhang die handwerklichen Arbeiten am Heiligtum.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: für alle Arbeiten am Heiligtum
  rationale: Die Wendung fasst den gesamten heiligen Bau- und Ausstattungsauftrag zusammen. »Heiligtum« gibt הַקֹּדֶשׁ hier kontextgerecht wieder.
- source_word: זְהַב הַתְּנוּפָה
  choice: das Gold der Schwinggabe
  rationale: »Schwinggabe« bewahrt den kultischen Fachbegriff und deutet zugleich an, dass die Gabe in einer rituellen Bewegung vor Gott dargebracht wurde.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר
  choice: 29 Talente
  rationale: Die hebräische Zahl wird in der üblichen deutschen Reihenfolge wiedergegeben; »Talent« ist die etablierte Bezeichnung der antiken Gewichtseinheit כִּכָּר.
- source_word: וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: und 730 Schekel
  rationale: Die Zahlenangabe wird klar und idiomatisch wiedergegeben; »Schekel« bezeichnet hier eine Gewichtseinheit.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Präposition בְּ bezeichnet den für die Gewichtsberechnung maßgeblichen Standard. Die Formulierung bleibt nahe am Hebräischen und ist im Deutschen verständlich.
theological_decisions:
- issue: Bedeutung von תְּנוּפָה
  choice: Schwinggabe
  alternative: Darbringungsgabe
  rationale: Der traditionelle kultische Ausdruck bewahrt den Hinweis auf die rituelle Darbietung, ohne eine über den Text hinausgehende genaue Bewegungsform festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »für die Arbeiten, für alle Arbeiten« spiegelt die betonte Gesamtangabe des Hebräischen, ohne sie völlig einzuebnen. Die antiken Maßeinheiten bleiben erhalten, da ihre exakte Umrechnung umstritten ist.
