lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: Und für die …seite
  rationale: פֵּאָה bezeichnet eine Seite, einen Rand oder eine Begrenzung. Im Zusammenhang mit den Maßangaben des Vorhofs ist „Seite“ natürlich; וְ und לְ werden durch „Und für“ wiedergegeben.
- source_word: קֵדְמָה
  choice: Ostseite
  rationale: Das Wort kann „nach Osten“ oder „vorn“ bezeichnen. Zusammen mit מִזְרָחָה ist eindeutig die östliche Seite gemeint.
- source_word: מִזְרָחָה
  choice: nach Sonnenaufgang hin
  rationale: מִזְרָח bezeichnet die Richtung beziehungsweise den Ort des Sonnenaufgangs und damit den Osten. Die Wiedergabe bewahrt den doppelten Richtungsausdruck des Hebräischen, ohne ihn auf ein bloßes „östlich“ zu reduzieren.
- source_word: חֲמִשִּׁים
  choice: fünfzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: אַמָּה
  choice: Ellen
  rationale: אַמָּה ist das übliche antike Längenmaß „Elle“; nach der Zahl ist im Deutschen der Plural „Ellen“ angebracht.
