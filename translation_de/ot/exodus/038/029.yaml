  yaml_path: translation/ot/exodus/038/029.yaml
  text: And the bronze of the wave offering was seventy talents and 2,400 shekels[a][b].
translation:
  language: de
  text: Und die Bronze des Schwingopfers[a][b] betrug siebzig Talente und 2.400 Schekel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kupfer«; das hebräische Wort נְחֹשֶׁת kann je nach Zusammenhang Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Schwingopfer« ist ein Fachbegriff für eine Gabe, die dem HERRN mit einer rituellen Schwingbewegung dargebracht wurde. Allgemeiner könnte man auch »dargebrachte Gabe« oder »Abgabe« übersetzen.
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Das Wort bezeichnet je nach Zusammenhang Kupfer oder Bronze. Im Inventar des Heiligtums ist »Bronze« für das verarbeitete Metall die herkömmliche und wahrscheinlich passende Wiedergabe.
- source_word: הַתְּנוּפָה
  choice: des Schwingopfers
  rationale: תְּנוּפָה ist ein kultischer Fachbegriff für eine Gabe, die dem HERRN durch eine rituelle Schwingbewegung dargebracht wurde. Der Genitiv gibt wieder, dass die Bronze zu dieser Gabe gehörte.
- source_word: שִׁבְעִים כִּכָּר
  choice: siebzig Talente
  rationale: כִּכָּר bezeichnet eine große antike Gewichtseinheit. Die Beibehaltung als »Talent« vermeidet eine unsichere Umrechnung im Haupttext.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: und 2.400 Schekel
  rationale: שֶׁקֶל ist eine antike Gewichtseinheit und wird transparent als »Schekel« beibehalten; die Ziffernschreibung erhöht die Lesbarkeit.
- source_word: וְ
  choice: Und
  rationale: Die Konjunktion verbindet den Vers unmittelbar mit den vorhergehenden Inventarangaben.
