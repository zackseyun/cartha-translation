source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: de
  text: Dies sind die Aufzeichnungen[a] über die Stiftshütte, die Stiftshütte des Zeugnisses[b]. Sie wurden auf Befehl Moses durch den Dienst der Leviten unter der Leitung Itamars[c], des Sohnes Aarons, des Priesters, angefertigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Bestandsaufnahme“ oder „Abrechnung“. Das hebräische Wort bezeichnet eine amtliche Erfassung und Abrechnung.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Zeugnis“ ist wahrscheinlich das Bundeszeugnis gemeint, besonders die Tafeln, die in der Lade aufbewahrt wurden.
    reason: cultural_note
  - marker: c
    text: Wörtlich lautet die Wendung „durch die Hand Itamars“; gemeint ist seine ausführende oder beaufsichtigende Zuständigkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: Abrechnung
  rationale: Das Nomen bezeichnet hier die amtliche Erfassung bzw. Rechenschaft über die für die Wohnung verwendeten Materialien. „Abrechnung“ passt zum folgenden Inventar- und Rechenschaftsbericht und bewahrt den Verwaltungssinn.
- source_word: הַמִּשְׁכָּן
  choice: die Wohnung
  rationale: מִשְׁכָּן bezeichnet das tragbare Heiligtum als Ort des Wohnens Gottes. „Wohnung“ gibt die Wortbedeutung transparent wieder und ist im Exoduskontext würdig und verständlich.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: die Wohnung des Zeugnisses
  rationale: Die appositionelle Wiederholung wird bewahrt. „Zeugnis“ lässt offen, wie weit der Ausdruck hier auf die Bundesurkunde beziehungsweise besonders auf die Tafeln zu beziehen ist.
- source_word: פֻּקַּד עַל־פִּי מֹשֶׁה
  choice: die auf Befehl Moses vorgenommen wurde
  rationale: Das passive Verb greift den Gedanken der amtlichen Abrechnung auf; עַל־פִּי ist idiomatisch „auf Befehl“. Der deutsche Relativsatz folgt dem Singular des Hebräischen und ergibt einen natürlichen Verwaltungssatz.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: der Dienst der Leviten
  rationale: עֲבֹדָה bezeichnet hier die zugewiesene Arbeit der Leviten. „Dienst“ umfasst sowohl praktische als auch kultische Tätigkeit, ohne spätere kirchliche Amtsvorstellungen einzutragen.
- source_word: בְּיַד אִיתָמָר
  choice: unter der Aufsicht Itamars
  rationale: Die Wendung bedeutet wörtlich „durch die Hand Itamars“ und bezeichnet in diesem Zusammenhang seine leitende oder beaufsichtigende Zuständigkeit.
- source_word: הַכֹּהֵן
  choice: des Priesters
  rationale: Die Apposition identifiziert Aaron als den Priester. Die deutsche Genitivkonstruktion bindet die Bezeichnung eindeutig an Aaron.
theological_decisions:
- issue: Bedeutung von הָעֵדֻת („Zeugnis“)
  choice: Zeugnis im Haupttext beibehalten
  alternative: Bundesurkunde oder Gesetzestafeln
  rationale: Der Ausdruck dürfte besonders auf die in der Lade verwahrten Tafeln des Bundeszeugnisses weisen, doch der hebräische Wortlaut nennt sie hier nicht ausdrücklich. Die offenere Wiedergabe bewahrt diese Spannung.
- issue: Syntaktische Beziehung von עֲבֹדַת הַלְוִיִּם
  choice: Als nachgestellte Erläuterung der vorgenommenen Abrechnung wiedergegeben
  alternative: Als eigenes Prädikat oder mit einem ergänzten „durch den Dienst“ an den Relativsatz angeschlossen
  rationale: Der hebräische Nominalsatz ist knapp und lässt die genaue syntaktische Einbindung offen. Der Doppelpunkt erhält diese erläuternde Funktion, ohne eine im Ausgangstext nicht ausdrücklich markierte Präposition zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die knappe hebräische Nominalfügung ab und vermeidet eine überdeutliche syntaktische Festlegung. „Wohnung“ macht die Grundbedeutung von מִשְׁכָּן sichtbar; „Abrechnung“ passt zum administrativen Kontext des Abschnitts.
