  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: de
  text: Er machte den Brandopferaltar aus Akazienholz. Er war fünf Ellen lang und fünf Ellen breit, quadratisch[a], und drei Ellen hoch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: viereckig.'
    reason: Lexikalische Alternative zu רָבוּעַ. „Quadratisch“ gibt die beabsichtigte Form im Maßkontext präzise wieder; „viereckig“ ist eine weiter gefasste mögliche Wiedergabe.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Waw-Konsekutiv mit עשה führt die Erzählung in der Vergangenheit fort. „Er machte“ ist schlicht, natürlich und inhaltlich eng am Hebräischen.
- source_word: מִזְבַּח הָעֹלָה
  choice: den Brandopferaltar
  rationale: Die Constructusverbindung bezeichnet den Altar für das עֹלָה, das vollständig verbrannte Opfer. Das zusammengesetzte deutsche Substantiv ist geläufig und präzise.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: שִׁטִּים bezeichnet Akazien. „Akazienholz“ ist die verständliche moderne Bezeichnung und vermeidet die überholte Transliteration „Sittimholz“.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: אַמָּה ist die Elle. Die antike Maßeinheit bleibt erhalten, damit die Maßangaben des Heiligtums einheitlich wiedergegeben werden.
- source_word: אָרְכּוֹ / רָחְבּוֹ / קֹמָתוֹ
  choice: lang / breit / hoch
  rationale: Die substantivischen Maßangaben werden im Deutschen idiomatisch als prädikative Adjektive formuliert; alle drei Dimensionen bleiben unverändert erhalten.
- source_word: רָבוּעַ
  choice: quadratisch
  rationale: Das Wort beschreibt eine quadratische beziehungsweise gleichseitig-vierseitige Grundform. „Quadratisch“ ist im heutigen Deutsch die klarste räumliche Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Maßangaben sind idiomatisch formuliert, ohne sie in moderne Einheiten umzurechnen. Der Fußnotenmarker wurde sachgerecht bei „quadratisch“ gesetzt; in der englischen Konsultationsfassung stand er offenbar versehentlich bei „acacia wood“.
