  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: de
  text: Daraus machte er die Sockel für den Eingang des Zeltes der Begegnung, den Bronzealtar, sein Bronzegitter[a] und alle Geräte des Altars.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Bronzenetz“ beziehungsweise „das Bronzegitter, das zu ihm gehörte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: machte er
  rationale: Das gewöhnliche Verb עשה bezeichnet hier im erzählenden Zusammenhang die Herstellung der genannten Gegenstände; „machte“ ist schlicht, nah am Hebräischen und gut verständlich.
- source_word: בָּהּ
  choice: Daraus
  rationale: Das Suffix bezieht sich auf die im vorherigen Vers genannte Bronze. „Daraus“ gibt hier den Stoffbezug im Deutschen natürlicher wieder als ein wörtlicheres „damit“.
- source_word: אַדְנֵי
  choice: Sockel
  rationale: אַדֶן bezeichnet im Heiligtumskontext tragende, mit Einlassungen versehene Basisteile. „Sockel“ ist im Deutschen verständlich und zugleich sachlich passend.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: den Eingang des Zeltes der Begegnung
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingang; „Zelt der Begegnung“ gibt אֹהֶל מוֹעֵד transparent und würdig wieder.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: den Bronzealtar
  rationale: Die kompakte Zusammensetzung ist im Deutschen natürlich und bezeichnet den aus Bronze gefertigten Altar.
- source_word: מִכְבַּר הַנְּחֹשֶׁת אֲשֶׁר לוֹ
  choice: sein Bronzegitter[a]
  rationale: מִכְבָּר bezeichnet ein gitter- oder netzartiges Bauteil. Das Possessiv „sein“ gibt die knappe Zuordnung אֲשֶׁר לוֹ zum Altar wieder, ohne dessen genaue Lage festzulegen.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: alle Geräte des Altars
  rationale: כְּלִים ist ein weiter Sammelbegriff für Geräte, Werkzeuge oder Gefäße; „Geräte“ bewahrt diese Breite und klingt im Deutschen natürlich.
