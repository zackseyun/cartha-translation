  variant: modern standard German
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: de
  text: Und Bezalel, der Sohn Uris, des Sohnes Hurs, vom Stamm Juda, fertigte alles an, was Jahwe[a] Mose geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְצַלְאֵל
  choice: Und Bezalel
  rationale: Die vorangestellte Konjunktion wahrt mit »Und« den erzählerischen Anschluss; der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: der Sohn Uris, des Sohnes Hurs
  rationale: Die zweimalige genealogische Angabe mit בֶּן bezeichnet hier am natürlichsten die unmittelbare Abstammung. Die deutschen Genitivformen vermeiden eine schwerfällige Wiederholung von »von«.
- source_word: לְ/מַטֵּה יְהוּדָה
  choice: vom Stamm Juda
  rationale: מַטֶּה bezeichnet in diesem Zusammenhang einen israelitischen Stamm; die Präposition לְ drückt Zugehörigkeit aus.
- source_word: עָשָׂה
  choice: fertigte … an
  rationale: Das breite Verb עשה kann »tun« oder »machen« bedeuten. Im Zusammenhang mit der Herstellung des Heiligtums gibt »anfertigen« die konkrete handwerkliche Tätigkeit natürlich wieder.
- source_word: אֵת כָּל אֲשֶׁר
  choice: alles, was
  rationale: Die Wendung bezeichnet umfassend die Gesamtheit dessen, was im folgenden Relativsatz genannt wird.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: 'Das Plusquamperfekt verdeutlicht im Deutschen die zeitliche Abfolge: Jahwes Gebot an Mose ging Bezalels Ausführung voraus, ohne den Inhalt des hebräischen Perfekts zu verändern.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶת מֹשֶׁה
  choice: Mose
  rationale: אֵת kennzeichnet Mose als direktes Objekt von »gebieten« und wird im Deutschen nicht eigens übersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen JHWH. »Jahwe« bewahrt ihn als Eigennamen; die traditionelle Ersetzung durch den Titel »der HERR« wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Apposition bleibt formal erkennbar, während »fertigte … an« den handwerklichen Zusammenhang natürlich ausdrückt.
