  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und Aussage zuverlässig wieder: Bezalel wird als Sohn Uris und Enkel Hurs aus dem Stamm Juda bezeichnet und als derjenige, der alles ausführte, was Jahwe Mose geboten hatte. Das deutsche Plusquamperfekt ist eine zulässige idiomatische Verdeutlichung der zeitlichen Abfolge, ohne eine unzulässige zusätzliche Aussage einzutragen.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die genealogische Apposition ist etwas formal, aber für den biblisch-genealogischen Kontext natürlich. »fertigte alles an« passt zum handwerklichen Kontext und bleibt dem weiten hebräischen Verb עשה angemessen.
  terminology: »Jahwe« gibt יהוה als Eigenname konsistent wieder; »Stamm Juda« ist die sachgerechte Wiedergabe von לְמַטֵּה יְהוּדָה. Die Namen Bezalel, Uri, Hur und Mose sind in üblichen deutschen Formen wiedergegeben. Die Fußnote erläutert die traditionelle Alternativwiedergabe korrekt.
