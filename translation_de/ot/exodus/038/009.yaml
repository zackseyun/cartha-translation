  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: de
  text: Er machte den Vorhof. An der Südseite, nach Süden hin, bestanden die Behänge[a] des Vorhofs aus gezwirntem Feinleinen und waren hundert Ellen lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Vorhänge des Vorhofs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Wayyiqtol von עשה führt die Erzählung fort. „Er machte“ gibt den schlichten Handlungssinn in natürlichem Deutsch wieder.
- source_word: הֶחָצֵר
  choice: den Vorhof
  rationale: חָצֵר bezeichnet hier den umgrenzten Außenbereich der Stiftshütte. „Vorhof“ ist die geläufige und sachlich passende deutsche Bezeichnung.
- source_word: לִפְאַת
  choice: An der …seite
  rationale: Die Wendung bezeichnet die betreffende Seite beziehungsweise Himmelsrichtung; „an der …seite“ ist im Deutschen idiomatisch.
- source_word: נֶגֶב תֵּימָנָה
  choice: der Südseite, nach Süden hin
  rationale: Beide südbezogenen Richtungsangaben werden wiedergegeben, ohne sie zu einer einzigen Angabe zusammenzuziehen.
- source_word: קַלְעֵי הֶחָצֵר
  choice: die Behänge des Vorhofs
  rationale: קְלָעִים bezeichnet hier die aufgehängten Stoffbahnen, welche die Begrenzung des Vorhofs bildeten. „Behänge“ ist knapp und sachlich; „Vorhänge“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: aus gezwirntem Feinleinen
  rationale: שֵׁשׁ bezeichnet feines Leinen, מָשְׁזָר dessen gezwirnte Verarbeitung. „Gezwirntes Feinleinen“ bildet beide Merkmale präzise und gut lesbar ab.
- source_word: מֵאָה בָּאַמָּה
  choice: hundert Ellen lang
  rationale: Die hebräische Maßangabe nennt hundert Ellen; „lang“ verdeutlicht im Deutschen die hier gemeinte Ausdehnung.
