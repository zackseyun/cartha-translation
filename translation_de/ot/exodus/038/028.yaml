  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: de
  text: Mit den 1775 Schekel machte er Haken für die Säulen, überzog ihre oberen Enden und versah sie mit Bändern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und verband sie mit Bändern“. Das hebräische Verb bezeichnet hier wahrscheinlich das Ausstatten oder Verbinden der Säulen mit Bändern beziehungsweise Metallreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: Mit den 1775 Schekel
  rationale: Die Zahlenangabe setzt die Silberabrechnung aus dem vorhergehenden Vers fort. „Mit“ gibt den verwendeten Betrag idiomatisch wieder; die im unmittelbaren Kontext genannte Einheit Schekel wird zur Verständlichkeit ergänzt.
- source_word: עָשָׂה
  choice: machte er
  rationale: Die schlichte Vergangenheitsform entspricht dem sachlichen Bericht über die Herstellung.
- source_word: וָוִים
  choice: Haken
  rationale: Im Zusammenhang des Heiligtums bezeichnet das Wort die an den Säulen angebrachten Metallhaken.
- source_word: לָעַמּוּדִים
  choice: für die Säulen
  rationale: „Säulen“ ist hier eine natürliche und etablierte Bezeichnung für die tragenden Pfosten der Umfriedung.
- source_word: וְצִפָּה
  choice: überzog
  rationale: Das Verb bezeichnet das Überziehen beziehungsweise Beschlagen mit Metall; das Material Silber ergibt sich aus dem Kontext.
- source_word: רָאשֵׁיהֶם
  choice: ihre oberen Enden
  rationale: Wörtlich steht „ihre Köpfe“. Gemeint sind die oberen Teile der Säulen; „obere Enden“ ist klar, ohne technisch zu präzisieren.
- source_word: וְחִשַּׁק אֹתָם
  choice: und versah sie mit Bändern
  rationale: Das Verb bezeichnet in diesem Bauzusammenhang wahrscheinlich das Anbringen von Bändern oder verbindenden Metallreifen. Die Formulierung bleibt verständlich und bewahrt den Gegenstandsbezug des hebräischen Pronomens.
