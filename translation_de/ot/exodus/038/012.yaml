  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: de
  text: An der Westseite waren fünfzig Ellen lange Behänge, dazu zehn Pfosten und zehn Sockel. Die Haken der Pfosten und ihre Verbindungsstücke[a] waren aus Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bänder“ beziehungsweise „Verbindungsstäbe“. Der hebräische Fachausdruck bezeichnet Beschlag- oder Verbindungsteile der Pfosten; ihre genaue Form ist unklar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: An der Westseite
  rationale: יָם bedeutet wörtlich „Meer“, bezeichnet in dieser Baubeschreibung aber idiomatisch den Westen; פֵּאָה bezeichnet die Seite beziehungsweise Kante.
- source_word: קְלָעִים חֲמִשִּׁים בָּאַמָּה
  choice: fünfzig Ellen lange Behänge
  rationale: קְלָעִים bezeichnet hier die textilen Umhänge des Vorhofs. Die im Hebräischen knapp angegebene Länge wird im Deutschen natürlich als „fünfzig Ellen lange“ ausgedrückt.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: dazu zehn Pfosten
  rationale: עַמּוּדִים sind die tragenden Pfosten der Vorhofeinfassung. „Dazu“ gibt die aufzählende, appositionelle Struktur verständlich wieder, ohne eine im Ausgangstext nicht ausdrücklich bezeichnete Verbindung zu behaupten.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: und zehn Sockel
  rationale: אֲדָנִים bezeichnet im Heiligtumsbau die Sockel beziehungsweise Fußstücke, in denen die Pfosten standen. „Sockel“ ist präzise und allgemein verständlich.
- source_word: וָוֵי הָעַמֻּדִים
  choice: die Haken der Pfosten
  rationale: וָוִים bezeichnet in diesem Zusammenhang an den Pfosten angebrachte Haken.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: und ihre Verbindungsstücke
  rationale: Der technische Ausdruck bezeichnet metallene Teile an oder zwischen den Pfosten; ihre genaue Form ist unsicher. „Verbindungsstücke“ bleibt verständlich, ohne sie eindeutig als Bänder oder Stäbe festzulegen.
- source_word: כָּסֶף
  choice: waren aus Silber
  rationale: Das Nomen steht prädikativ und bezeichnet das Material der Haken und Verbindungsstücke.
