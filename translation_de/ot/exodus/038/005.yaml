  text: וַ/יִּצֹ֞ק אַרְבַּ֧ע טַבָּעֹ֛ת בְּ/אַרְבַּ֥ע הַ/קְּצָוֺ֖ת לְ/מִכְבַּ֣ר הַ/נְּחֹ֑שֶׁת בָּתִּ֖ים לַ/בַּדִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/005.yaml
  text: He cast four rings on the four corners of the bronze grating as holders for the poles[a][b].
translation:
  language: de
  text: Er goss vier Ringe an den vier Ecken[a] des bronzenen Gitters als Halterungen für die Tragstangen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an den vier Enden« des bronzenen Gitters.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »als Häuser für die Tragstangen«, das heißt als Aufnahmen oder Beschläge, in die sie eingeführt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Er goss
  rationale: יצק bezeichnet hier das Gießen von Metall. „Er goss“ ist im Deutschen für die Herstellung metallener Beschläge natürlich und nah am hebräischen Ausdruck.
- source_word: אַרְבַּע טַבָּעֹת
  choice: vier Ringe
  rationale: טַבָּעוֹת bezeichnet metallene Ringe, die hier zur Aufnahme der Tragstangen dienen.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: an den vier Ecken
  rationale: קָצֶה kann Ende, Rand oder äußersten Punkt bezeichnen. Bei dem viereckigen Gitter gibt „Ecken“ die wahrscheinliche räumliche Anordnung verständlich wieder; die allgemeinere Alternative wird in der Fußnote bewahrt.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: des bronzenen Gitters
  rationale: מִכְבָּר bezeichnet ein Gitter- oder Flechtwerk. נְחֹשֶׁת wird im Kontext der Heiligtumsgeräte sachgerecht mit „Bronze“ wiedergegeben.
- source_word: בָּתִּים
  choice: Halterungen
  rationale: Wörtlich bedeutet בָּתִּים „Häuser“; funktional sind hier Aufnahmen oder Beschläge gemeint, welche die Tragstangen halten.
- source_word: לַבַּדִּים
  choice: für die Tragstangen
  rationale: בַּדִּים sind die Stangen, mit denen die Heiligtumsgeräte getragen wurden. „Tragstangen“ macht ihre Funktion ohne altertümliche Ausdrucksweise deutlich.
