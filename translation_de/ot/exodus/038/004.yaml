  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: de
  text: Er fertigte für den Altar ein bronzenes Gitter in Netzform an, unterhalb seiner Leiste[b], von unten bis zur halben Höhe des Altars[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Das hebräische Wort für dieses Bauteil des Altars kann auch mit „Rand“, „Einfassung“ oder „Vorsprung“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „von unten bis zu seiner Mitte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Wayyiqtol führt die Erzählung fort; „fertigte … an“ ist für die Herstellung eines Bauteils natürlich und würdevoll.
- source_word: לַמִּזְבֵּחַ
  choice: für den Altar
  rationale: ל bezeichnet hier Zweck beziehungsweise Zuordnung, nicht den Ort der Anbringung.
- source_word: מִכְבָּר
  choice: ein Gitter
  rationale: Das Wort bezeichnet eine gitter- oder rostförmige Vorrichtung; „Gitter“ ist im Deutschen klar und passt zur folgenden Beschreibung als Netzarbeit.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: in Netzarbeit
  rationale: Die Wendung bedeutet wörtlich etwa „Arbeit eines Netzes“ und beschreibt die netzartige Ausführung des Gitters.
- source_word: נְחֹשֶׁת
  choice: aus Bronze
  rationale: Im Zusammenhang der Stiftshütte ist „Bronze“ die sachlich und traditionell angemessene Wiedergabe; „Kupfer“ bleibt lexikalisch möglich.
- source_word: תַּחַת כַּרְכֻּבּוֹ
  choice: unterhalb seiner Leiste
  rationale: תַּחַת ist räumlich; כַּרְכֻּב bezeichnet ein vorspringendes oder umlaufendes Bauteil, wofür „Leiste“ verständlich ist, ohne seine genaue Form festzulegen.
- source_word: מִלְּמַטָּה עַד חֶצְיוֹ
  choice: von unten bis zu seiner halben Höhe
  rationale: Die Formulierung bewahrt den Ausgangspunkt „von unten“ und die räumliche Erstreckung bis zur Mitte des Altars.
