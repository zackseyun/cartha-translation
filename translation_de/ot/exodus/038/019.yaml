  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: de
  text: Ihre vier Säulen und ihre vier bronzenen Sockel[a], ihre silbernen Haken sowie der silberne Überzug ihrer Köpfe[b] und ihre silbernen Bänder[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fußstücke“. Gemeint sind die tragenden Metallteile am Fuß der Säulen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Versilberung ihrer Köpfe“. Wörtlich: „der Überzug ihrer Köpfe“; „Köpfe“ bezeichnet die oberen Enden der Säulen.'
    reason: lexical_alternative
  - marker: c
    text: Die genaue Form dieser silbernen Bauteile ist nicht sicher. Traditionell werden sie auch „Bindestäbe“ genannt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: ihre vier Säulen
  rationale: עַמּוּד bezeichnet im Zusammenhang des Heiligtums eine tragende Säule. „Säulen“ ist im Deutschen der übliche und verständliche Ausdruck.
- source_word: אַדְנֵיהֶם
  choice: ihre vier Sockel
  rationale: אֶדֶן bezeichnet hier die tragenden Metallstücke am Fuß der Säulen. „Sockel“ ist im modernen Deutschen anschaulich; „Fußstücke“ bleibt als mögliche Alternative in der Fußnote.
- source_word: נְחֹשֶׁת
  choice: aus Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen. Im Zusammenhang der Ausstattung des Heiligtums ist „Bronze“ die etablierte und sachlich passende Wiedergabe.
- source_word: וָוֵיהֶם
  choice: ihre Haken
  rationale: וָו bezeichnet Befestigungsteile am Säulengerüst; „Haken“ gibt ihre wahrscheinliche Funktion klar wieder, ohne die genaue Form näher festzulegen.
- source_word: כֶּסֶף
  choice: aus Silber
  rationale: כֶּסֶף bezeichnet hier eindeutig das Material Silber und bezieht sich sowohl auf die Haken als auch auf die Verkleidung und die Verbindungsstäbe.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: die Verkleidung ihrer oberen Enden
  rationale: צִפּוּי ist ein Überzug beziehungsweise eine Verkleidung; רָאשֵׁיהֶם bedeutet wörtlich „ihre Köpfe“. „Obere Enden“ gibt die räumliche Bedeutung bei Säulen natürlich wieder.
- source_word: חֲשֻׁקֵיהֶם
  choice: ihre Verbindungsstäbe
  rationale: Die genaue Gestalt der mit חֲשֻׁקִים bezeichneten silbernen Bauteile ist unsicher. „Verbindungsstäbe“ ist im Bauzusammenhang verständlich, wird aber wegen der lexikalischen Unsicherheit in einer Fußnote erläutert.
