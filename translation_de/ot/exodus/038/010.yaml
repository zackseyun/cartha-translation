  text: עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: de
  text: Ihre Säulen waren zwanzig, und ihre zwanzig Sockel waren aus Bronze[a]; die Haken der Säulen und ihre Bänder[b] waren aus Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: aus Kupfer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Verbindungsstangen. Die genaue Form und Funktion der so bezeichneten Teile ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: ihre Säulen
  rationale: עַמּוּדִים bezeichnet hier die tragenden Säulen beziehungsweise Pfosten des Vorhofs. „Säulen“ entspricht der üblichen und verständlichen Terminologie; das Suffix wird mit „ihre“ wiedergegeben.
- source_word: עֶשְׂרִים
  choice: zwanzig
  rationale: Die Kardinalzahl wird an beiden Stellen direkt mit „zwanzig“ wiedergegeben.
- source_word: אַדְנֵיהֶם
  choice: ihre zwanzig Sockel
  rationale: אֶדֶן bezeichnet im Heiligtumskontext den Fuß beziehungsweise die Aufnahme einer Säule. „Sockel“ ist im heutigen Deutsch anschaulich und präzise.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Für die Ausstattung des Heiligtums ist „Bronze“ die herkömmliche und sachlich plausible Wiedergabe; die stoffliche Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: וָוֵי הָעַמֻּדִים
  choice: die Haken der Säulen
  rationale: וָוִים bezeichnet hier Haken oder ähnliche Befestigungsteile an den Säulen. „Haken“ gibt die wahrscheinliche Funktion klar wieder.
- source_word: חֲשֻׁקֵיהֶם
  choice: ihre Bänder
  rationale: Die genaue Bauform der חֲשֻׁקִים ist unsicher; gemeint sind an den Säulen angebrachte oder sie verbindende Teile. „Bänder“ bewahrt den konkreten Grundsinn, ohne eine bestimmte Konstruktion vorzutäuschen.
- source_word: כָּסֶף
  choice: Silber
  rationale: Die Materialbezeichnung wird unmittelbar mit „Silber“ wiedergegeben.
