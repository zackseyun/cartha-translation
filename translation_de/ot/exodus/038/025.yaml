lexical_decisions:
- source_word: כֶסֶף
  choice: Silber
  rationale: Im Zusammenhang der Abrechnung ist das eingesammelte Metall gemeint, nicht Geld im abstrakten Sinn.
- source_word: פְּקוּדֵי
  choice: die Gemusterten
  rationale: Das Wort bezeichnet die im Rahmen der Zählung amtlich erfassten Personen. „Gemusterte“ wahrt den administrativen Sinn knapp und würdig.
- source_word: הָעֵדָה
  choice: die Gemeinschaft
  rationale: Der Ausdruck bezeichnet hier das versammelte Volk als Gemeinschaft; die Wiedergabe ist im heutigen Standarddeutsch verständlich und weniger konfessionell geprägt als „Gemeinde“.
- source_word: מְאַת כִּכָּר
  choice: hundert Talente
  rationale: „Talent“ ist die herkömmliche deutsche Bezeichnung für die hier genannte große antike Gewichtseinheit.
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: und eintausendsiebenhundertfünfundsiebzig Schekel
  rationale: Die additive hebräische Zahlenfolge wird als Gesamtzahl 1.775 in natürlichem Deutsch wiedergegeben.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Präposition bezeichnet den zugrunde gelegten Gewichtsstandard. „Schekel des Heiligtums“ bleibt nahe an der hebräischen Genitivverbindung und ist idiomatisch.
