  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: de
  text: Und das Silber der gezählten Personen aus der Gemeinschaft betrug hundert Talente und eintausendsiebenhundertfünfundsiebzig Schekel nach dem Schekel des Heiligtums[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: gewogen nach dem im Heiligtum geltenden Standardgewicht.'
