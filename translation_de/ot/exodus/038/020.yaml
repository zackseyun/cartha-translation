  text: וְֽ/כָל הַ/יְתֵדֹ֞ת לַ/מִּשְׁכָּ֧ן וְ/לֶ/חָצֵ֛ר סָבִ֖יב נְחֹֽשֶׁת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: de
  text: Und alle Pflöcke für die Wohnung und für den Vorhof ringsum waren aus Bronze[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kupfer«. Das hebräische Wort נְחֹשֶׁת kann je nach Zusammenhang Kupfer oder Bronze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Und alle
  rationale: 'Die Verbindung aus ו und כָּל bezeichnet zusammen mit dem pluralischen Substantiv natürlich die Gesamtheit: »und alle«.'
- source_word: הַיְתֵדֹת
  choice: die Pflöcke
  rationale: יָתֵד bezeichnet hier Pflöcke zur Befestigung der Anlage. »Pflöcke« ist im Deutschen präzise und benötigt wegen der folgenden Zweckangaben keinen Zusatz wie »Zelt-«.
- source_word: לַמִּשְׁכָּן
  choice: für die Wohnung
  rationale: מִשְׁכָּן bedeutet wörtlich »Wohnung« beziehungsweise »Wohnstätte« und ist in Exodus die Bezeichnung für das Heiligtum. »Wohnung« bewahrt diese Bedeutung in natürlichem, würdigem Deutsch.
- source_word: וְלֶחָצֵר סָבִיב
  choice: und für den Vorhof ringsum
  rationale: חָצֵר bezeichnet den eingefriedeten Vorhof; סָבִיב gibt dessen Lage rings um die Wohnung an. Die Formulierung folgt der hebräischen Struktur, ohne das nicht ausdrücklich genannte Bezugswort durch »um sie herum« zu ergänzen.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Im Zusammenhang mit den Materialien der Wohnung ist »Bronze« die geläufige und sachlich plausible Wiedergabe; die echte lexikalische Alternative wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wohnung« gibt den hebräischen Leitbegriff מִשְׁכָּן transparent wieder; »Vorhof« ist die etablierte und weiterhin verständliche Bezeichnung des eingefriedeten Bereichs. Die knappe Satzform entspricht dem inventarisierenden Kontext.
