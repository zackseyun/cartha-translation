lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er fertigte … an
  rationale: Das Qal-Wayyiqtol von עשה führt die Erzählfolge fort. „Fertigte … an“ ist im handwerklichen Zusammenhang natürlich und präzise; das einleitende ו wird im Deutschen nicht eigens wiedergegeben, da die Abfolge aus dem Kontext hervorgeht.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים bezeichnet hier die zum Tragen bestimmten Stangen. „Stangen“ ist im Deutschen knapp und eindeutig; „Tragstangen“ wäre erklärender, ist im unmittelbaren Zusammenhang aber nicht nötig.
- source_word: עֲצֵי שִׁטִּים
  choice: aus Akazienholz
  rationale: Die Konstruktverbindung bezeichnet das Holz der Akazie. „Akazienholz“ ist die übliche, verständliche moderne Wiedergabe.
- source_word: וַיְצַף
  choice: und überzog
  rationale: צפה bedeutet in diesem handwerklichen Kontext, einen Gegenstand mit einer Metallschicht zu versehen. „Überzog“ gibt dies natürlich und sachlich wieder.
- source_word: אֹתָם
  choice: sie
  rationale: Das Objektsuffix im Plural bezieht sich auf die Stangen.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann je nach Kontext Kupfer oder Bronze bezeichnen. „Bronze“ entspricht der üblichen Wiedergabe bei den Materialien des Heiligtums; „Kupfer“ bleibt lexikalisch möglich und wird in der Fußnote genannt.
