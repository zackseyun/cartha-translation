  - severity: medium
    issue: Der Fußnotenanker steht am Satzende statt beim Wort „Sockeln“, auf das sich die lexikalische Alternative bezieht.
    rationale: 'Die Anmerkung „Oder: Fußplatten“ erläutert אַדְנֵיהֶם bzw. „Sockel“ und soll unmittelbar an diesem Wort verankert werden.'
