  text: Fifteen cubits of hangings were for one side; their pillars were three[a], and their bases were three.
translation:
  language: de
  text: Für die eine Seite waren Behänge von fünfzehn Ellen vorgesehen, dazu drei Säulen und drei Sockel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
