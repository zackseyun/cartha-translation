  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend: Für einen seitlichen Abschnitt waren Behänge von fünfzehn Ellen sowie drei Säulen und drei zugehörige Sockel vorgesehen. Die Formulierung „standen auf“ macht jedoch eine räumlich-konstruktive Aussage explizit, die der knappe hebräische Nominalsatz hier nicht ausdrücklich formuliert.'
  naturalness: „Behänge“, „Ellen“, „Säulen“ und „Sockel“ sind im modernen Standarddeutsch in diesem sachlich-würdigen Beschreibungsstil verständlich. Eine knappe Aufzählung ist hier natürlicher und näher am hebräischen Stil als „standen auf“.
  terminology: „Behänge“ gibt קְלָעִים im Kontext der Vorhofumgrenzung passend wieder. „Sockel“ ist eine geeignete Wiedergabe von אַדָנִים; „Fußplatten“ kann als lexikalische Alternative in der Anmerkung stehen. Der Anker muss dabei unmittelbar bei „Sockel“ stehen, nicht am Satzende.
