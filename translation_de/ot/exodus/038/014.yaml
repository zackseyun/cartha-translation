lexical_decisions:
- source_word: קְלָעִים
  choice: Behänge
  rationale: Im Zusammenhang des Vorhofs bezeichnet das Wort die Stoffbahnen, die dessen Umgrenzung bildeten. »Behänge« ist sachlich passend und unterscheidet sie von den inneren Vorhängen.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: von fünfzehn Ellen
  rationale: Die Maßangabe steht im Hebräischen ohne ausdrückliches Wort für Länge; die deutsche Fügung gibt sie knapp und verständlich wieder.
- source_word: אֶל הַכָּתֵף
  choice: für die eine Seite
  rationale: כָּתֵף bedeutet wörtlich »Schulter« und bezeichnet hier einen seitlichen Abschnitt beim Eingang des Vorhofs. »Für die eine Seite« wahrt den räumlichen Bezug, ohne das Bild unnatürlich zu übertragen.
- source_word: עַמּוּדֵיהֶם
  choice: ihre drei Säulen
  rationale: »Säulen« ist in der Beschreibung des Heiligtums die übliche architektonische Wiedergabe; das Suffix bezieht sich auf den genannten Abschnitt beziehungsweise seine Behänge.
- source_word: אַדְנֵיהֶם
  choice: drei Sockel
  rationale: Das Wort bezeichnet die tragenden Fußteile beziehungsweise Aufnahmen, in denen die Säulen standen. »Sockel« ist im Deutschen anschaulich und architektonisch passend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische hebräische Aufzählung wird durch »standen auf« leicht geglättet, ohne sachliche Angaben hinzuzufügen. Die Maßbezeichnung »Elle« bleibt als historischer Terminus erhalten.
