  yaml_path: translation/ot/exodus/038/002.yaml
  text: He made its horns on its four corners[a]; its horns were of one piece with it[b], and he overlaid it with bronze.
translation:
  language: de
  text: Er machte an seinen vier Ecken Hörner. Die Hörner waren mit ihm[a] aus einem Stück, und er überzog ihn mit Bronze[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Aus ihm waren seine Hörner.“ Gemeint ist, dass sie nicht getrennt hergestellt und anschließend angesetzt wurden.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann Bronze oder Kupfer bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Er machte
  rationale: Das Wayyiqtol von עשה bezeichnet hier schlicht die Herstellung; „machte“ ist nah am Hebräischen und im Deutschen natürlich.
- source_word: קַרְנֹתָיו
  choice: seine Hörner
  rationale: קֶרֶן bedeutet wörtlich „Horn“ und bezeichnet hier die hornartigen Vorsprünge des Altars. Der konkrete kultische Fachausdruck bleibt erhalten.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: an seinen vier Ecken
  rationale: „An“ gibt die räumliche Zuordnung der Hörner zu den vier Ecken im Deutschen idiomatisch wieder.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Die Hörner waren aus einem Stück mit ihm
  rationale: 'Wörtlich heißt es: „Aus ihm waren seine Hörner.“ Die gewählte Formulierung vermittelt den baulichen Sinn, dass die Hörner zum Altarkörper gehörten und nicht separat angesetzt waren.'
- source_word: וַיְצַף אֹתוֹ
  choice: und er überzog ihn
  rationale: צפה bezeichnet im Zusammenhang mit dem Heiligtum das Überziehen beziehungsweise Verkleiden eines Gegenstands mit Metall.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. In den Beschreibungen der Heiligtumsgeräte ist „Bronze“ die herkömmliche und kontextuell passende Wiedergabe.
