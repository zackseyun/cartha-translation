  text: וַ/יַּ֜עַשׂ אֶֽת כָּל כְּלֵ֣י הַ/מִּזְבֵּ֗חַ אֶת הַ/סִּירֹ֤ת וְ/אֶת הַ/יָּעִים֙ וְ/אֶת הַ/מִּזְרָקֹ֔ת אֶת הַ/מִּזְלָגֹ֖ת וְ/אֶת הַ/מַּחְתֹּ֑ת כָּל כֵּלָ֖י/ו עָשָׂ֥ה נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: de
  text: 'Er fertigte alle Geräte des Altars an: die Töpfe[a], die Schaufeln, die Becken, die Gabeln und die Feuerpfannen. Alle seine Geräte fertigte er aus Bronze[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Töpfe waren möglicherweise speziell zum Entfernen der Asche bestimmt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: aus Kupfer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: Geräte des Altars
  rationale: כְּלִי ist ein weiter Begriff für Gerät, Gefäß oder Werkzeug. „Geräte“ umfasst die anschließend genannten unterschiedlichen Gegenstände natürlich und präzise.
- source_word: הַסִּירֹת
  choice: Töpfe
  rationale: סִירוֹת bezeichnet gewöhnlich Töpfe; im Zusammenhang des Altars können damit insbesondere Gefäße zum Entfernen der Asche gemeint sein, doch wird die Asche im hebräischen Text nicht ausdrücklich genannt.
- source_word: הַיָּעִים
  choice: Schaufeln
  rationale: יַע bezeichnet ein Werkzeug zum Schaufeln oder Ausschöpfen; „Schaufeln“ passt zum Altardienst und ist allgemein verständlich.
- source_word: הַמִּזְרָקֹת
  choice: Becken
  rationale: מִזְרָקוֹת sind Gefäße, die im Kult unter anderem für Flüssigkeiten beziehungsweise Blut gebraucht wurden. „Becken“ bewahrt die funktionale Weite, ohne den konkreten Gebrauch hinzuzufügen.
- source_word: הַמִּזְלָגֹת
  choice: Gabeln
  rationale: Das Wort bezeichnet gabelartige Geräte. „Gabeln“ gibt die Form wieder, ohne die nicht ausdrücklich genannte Verwendung als Fleischhaken festzulegen.
- source_word: הַמַּחְתֹּת
  choice: Feuerpfannen
  rationale: מַחְתָּה bezeichnet eine Pfanne zum Aufnehmen oder Tragen von Glut beziehungsweise Feuer. „Feuerpfannen“ ist in diesem Zusammenhang klarer als das möglicherweise mit Räucherwerk verengte „Räucherpfannen“.
- source_word: כָּל כֵּלָיו
  choice: alle seine Geräte
  rationale: Das Suffix bezieht sich auf den Altar. Die Wiederholung von „Geräte“ entspricht der Wiederaufnahme des Wortes כְּלִי im Hebräischen.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen. „Bronze“ ist für die Ausstattung des Heiligtums die etablierte und historisch plausible Wiedergabe; die lexikalische Alternative wird in einer Fußnote bewahrt.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Er fertigte ... an ... fertigte er an
  rationale: Die zweimalige Verwendung von עשה wird entsprechend der hebräischen Struktur bewahrt. „Anfertigen“ klingt bei hergestellten Kultgeräten im Deutschen natürlicher und genauer als das allgemeinere „machen“.
