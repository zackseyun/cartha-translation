base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: de
  text: 'ein Beka pro Kopf[a], das heißt ein halber Schekel nach dem Schekel des Heiligtums, für jeden bei der Zählung Erfassten[b], von zwanzig Jahren an und darüber: 603.550.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Beka entsprach einem halben Schekel nach dem Standardgewicht des Heiligtums.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich etwa: »für jeden, der zu den Gezählten hinübergeht«. Die hebräische Wendung verbindet die Sprache der Zählung mit einem Bild des Hinübergehens und kann auch als Aufnahme in die Registrierung verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: Beka
  rationale: Die Bezeichnung einer bestimmten Gewichtseinheit wird transliteriert; der folgende Zusatz erklärt ihren Wert als einen halben Schekel.
- source_word: לַגֻּלְגֹּלֶת
  choice: pro Kopf
  rationale: Wörtlich »für den Schädel«; »pro Kopf« bewahrt die hebräische Zählredeweise in natürlichem modernem Deutsch.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: ein halber Schekel
  rationale: Die Wendung gibt den Wert des Beka unmittelbar an.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: nach dem Schekel des Heiligtums
  rationale: Die Präposition bezeichnet hier den maßgeblichen Gewichtsstandard; die kultische Bezugnahme bleibt ausdrücklich erhalten.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: für jeden, der zu den Gemusterten hinüberging
  rationale: Die Formulierung bewahrt sowohl das Bild des Hinübergehens als auch den Zusammenhang der Erfassung bei einer Musterung.
- source_word: הַפְּקֻדִים
  choice: die Gemusterten
  rationale: Der Ausdruck bezeichnet hier die im Rahmen der Zählung erfassten Männer; »Gemusterte« ist knapp und passt zum militärisch-volkszählenden Kontext.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: von zwanzig Jahren an aufwärts
  rationale: Die traditionelle Altersformel wird genau und verständlich wiedergegeben.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: '603.550'
  rationale: Die ausgeschriebene hebräische Gesamtzahl wird nach deutscher Schreibkonvention als Ziffernfolge dargestellt.
