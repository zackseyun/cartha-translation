- from: Und für die andere Seite[a] – diesseits und jenseits vom Tor des Vorhofs – waren die Behänge fünfzehn Ellen lang; dazu gehörten drei Säulen und drei Sockel[b].
  to: Für den anderen Seitenabschnitt am Tor des Vorhofs gab es Behänge von fünfzehn Ellen Länge, mit drei Säulen und drei Sockeln[b].
  rationale: Die problematische Wendung „diesseits und jenseits“ wird nicht in einer Weise wiedergegeben, die eine Innen-Außen-Relation nahelegt. „Seitenabschnitt am Tor“ gibt כָּתֵף im architektonischen Zusammenhang idiomatisch wieder; die erhaltene Formulierung lässt die schwierige räumliche Syntax offen, statt sie überzuinterpretieren. Die Bestandsangaben bleiben vollständig erhalten. Da die räumliche Nuance nicht sicher als eigenständige deutsche Satzphrase wiedergegeben werden kann, wird kein irreführender Alternativhinweis zu Marker a beibehalten.
