base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: de
  text: Für den anderen Seitenabschnitt am Tor des Vorhofs gab es Behänge von fünfzehn Ellen Länge, mit drei Säulen und drei Sockeln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „Basen“; gemeint sind die tragenden Unterteile beziehungsweise Aufnahmen der Säulen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: für die andere Seite
  rationale: כָּתֵף bedeutet wörtlich „Schulter“, bezeichnet hier aber einen seitlichen Abschnitt neben dem Eingang. „Andere Seite“ gibt den räumlichen Bezug in natürlichem Deutsch wieder, ohne die ungewöhnliche Formulierung des Hebräischen ganz aufzulösen.
- source_word: מִזֶּה וּמִזֶּה
  choice: diesseits und jenseits
  rationale: Die Wendung bezeichnet die beiden flankierenden Bereiche am Tor. „Diesseits und jenseits“ bewahrt die paarige räumliche Ausdrucksweise des Hebräischen.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: vom Tor des Vorhofs
  rationale: Die Präposition לְ stellt hier die räumliche Beziehung der seitlichen Abschnitte zum Eingang des Vorhofs her. „Vom Tor des Vorhofs“ ist im Deutschen verständlich und lässt sich gut mit „diesseits und jenseits“ verbinden.
- source_word: קְלָעִים
  choice: Behänge
  rationale: Das Wort bezeichnet in diesem Bauzusammenhang die textilen Abgrenzungen des Vorhofs. „Behänge“ ist präziser als das allgemeinere „Vorhänge“ und vermeidet die Vorstellung von Innenraumgardinen.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: fünfzehn Ellen lang
  rationale: Die antike Maßeinheit „Elle“ bleibt erhalten. Das ergänzte „lang“ macht die im Hebräischen knappe Maßangabe im Deutschen eindeutig.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: dazu gehörten drei Säulen
  rationale: Die verblos-inventarartige hebräische Form wird in natürliches Deutsch überführt. „Säulen“ entspricht der üblichen Bedeutung von עַמּוּד in der Beschreibung des Heiligtums.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: und drei Sockel
  rationale: אֶדֶן bezeichnet die tragenden Aufnahmen beziehungsweise Unterbauten der Säulen. „Sockel“ ist im modernen Deutsch anschaulich; „Fußgestelle“ bleibt eine mögliche Alternative.
