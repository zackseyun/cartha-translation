  text: וְ/הָ/אֲדָנִ֣ים לָֽ/עַמֻּדִים֮ נְחֹשֶׁת֒ וָוֵ֨י הָֽ/עַמּוּדִ֜ים וַ/חֲשׁוּקֵי/הֶם֙ כֶּ֔סֶף וְ/צִפּ֥וּי רָאשֵׁי/הֶ֖ם כָּ֑סֶף וְ/הֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: de
  text: Die Sockel[a] der Säulen waren aus Bronze, die Haken der Säulen und ihre Bänder[b] aus Silber; der Überzug ihrer oberen Enden war aus Silber. Alle Säulen des Vorhofs waren mit Silberbändern versehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fußstücke« beziehungsweise »Aufnahmen«.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Gestalt der so bezeichneten Bauteile ist nicht sicher; möglicherweise waren es Einfassungen oder verbindende Stäbe.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: Sockel
  rationale: Im Zusammenhang mit dem Heiligtumsbau bezeichnet das Wort die tragenden Fußteile beziehungsweise Aufnahmen der Säulen. »Sockel« ist im heutigen Deutsch klar und architektonisch passend.
- source_word: עַמֻּדִים
  choice: Säulen
  rationale: Das Wort bezeichnet aufrechte tragende Elemente; »Säulen« entspricht dem würdigen architektonischen Kontext und der üblichen deutschen Terminologie.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Für dieses Metall ist im Zusammenhang mit dem Heiligtum »Bronze« die herkömmliche und sachlich plausible Wiedergabe, auch wenn das hebräische Wort grundsätzlich auch Kupfer bezeichnen kann.
- source_word: וָוֵי
  choice: Haken
  rationale: Gemeint sind die an den Säulen angebrachten Haken; »Haken« gibt ihre Funktion knapp und verständlich wieder.
- source_word: חֲשׁוּקֵיהֶם
  choice: ihre Bänder
  rationale: Die genaue Form dieser silbernen Bauteile ist unsicher. »Bänder« wahrt den Bezug zum Umfassen oder Verbinden, ohne die Konstruktion zu stark festzulegen.
- source_word: צִפּוּי
  choice: Überzug
  rationale: Das Substantiv bezeichnet eine aufgebrachte Deck- oder Metallschicht. »Überzug« ist präzise und allgemein verständlich.
- source_word: רָאשֵׁיהֶם
  choice: ihre oberen Enden
  rationale: Wörtlich steht »ihre Köpfe«; bezogen auf die Säulen sind deren obere Enden gemeint. Die Übersetzung vermeidet die möglicherweise zu spezielle Bezeichnung »Kapitelle«.
- source_word: מְחֻשָּׁקִים
  choice: mit Silberbändern versehen
  rationale: Das Partizip gehört zum selben Wortstamm wie חֲשׁוּקֵיהֶם. Die Formulierung bewahrt diese Verbindung und bleibt hinsichtlich der genauen Gestalt der Beschläge zurückhaltend.
- source_word: חָצֵר
  choice: Vorhof
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Wort den umschlossenen äußeren Hof. »Vorhof« ist die etablierte und präzise deutsche Bezeichnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung folgt eng der hebräischen Satzstruktur, wird jedoch zur besseren Lesbarkeit in zwei Sätze gegliedert. Das wiederholte Silbermotiv und die Wortverwandtschaft zwischen »Bänder« und »mit Silberbändern versehen« bleiben erkennbar.
