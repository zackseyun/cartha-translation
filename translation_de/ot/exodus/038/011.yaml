  text: וְ/לִ/פְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽ/אַמָּ֔ה עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽ/עַמּוּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: de
  text: Auf der Nordseite waren es hundert Ellen. Dazu gehörten zwanzig Säulen und zwanzig Sockel aus Bronze; die Haken der Säulen und ihre Beschläge[a] waren aus Silber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Bänder«. Das hebräische Wort bezeichnet silberne Bauteile an den Säulen; ihre genaue Form ist nicht sicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: Auf der Nordseite
  rationale: פֵּאָה bezeichnet hier die Seite des Vorhofs; die deutsche Ortsangabe gibt die Funktion der Präpositionalverbindung natürlich wieder.
- source_word: מֵאָה בָאַמָּה
  choice: hundert Ellen
  rationale: Die Wendung nennt die Länge der Nordseite. »Elle« ist die geläufige deutsche Bezeichnung für אַמָּה.
- source_word: עַמּוּדֵיהֶם
  choice: zwanzig Säulen
  rationale: עַמּוּד bezeichnet die tragenden beziehungsweise aufrecht stehenden Elemente der Umfriedung. Die umständliche hebräische Suffixkonstruktion wird im Deutschen durch »Dazu gehörten« eindeutig aufgenommen.
- source_word: אַדְנֵיהֶם
  choice: zwanzig Sockel
  rationale: אֶדֶן bezeichnet hier die Aufnahme- oder Standstücke der Säulen; »Sockel« ist verständlich und im Heiligtumskontext präziser als das allgemeinere »Füße«.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder eine Kupferlegierung bezeichnen; »Bronze« ist in den Beschreibungen des Heiligtums die etablierte und sachlich plausible Wiedergabe.
- source_word: וָוֵי הָעַמּוּדִים
  choice: die Haken der Säulen
  rationale: וָוִים bezeichnet in diesem Bauzusammenhang an den Säulen angebrachte Haken.
- source_word: חֲשֻׁקֵיהֶם
  choice: ihre Beschläge
  rationale: Das Wort bezeichnet silberne Bauteile an den Säulen, doch ihre genaue Form ist unsicher. »Beschläge« bleibt bewusst allgemein und ist im modernen Deutsch verständlich.
- source_word: כָּסֶף
  choice: Silber
  rationale: כֶּסֶף ist die eindeutige Materialbezeichnung für die Haken und Beschläge.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Inventarsprache. Die sperrige hebräische Reihung und die pluralischen Suffixe werden durch »Dazu gehörten« idiomatisch verdeutlicht, ohne zusätzliche Sachinformation einzuführen. Die technische Unsicherheit bei חֲשֻׁקֵיהֶם bleibt durch eine Fußnote erhalten.
