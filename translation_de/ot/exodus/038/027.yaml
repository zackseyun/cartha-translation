  text: וַ/יְהִ֗י מְאַת֙ כִּכַּ֣ר הַ/כֶּ֔סֶף לָ/צֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת אַדְנֵ֣י הַ/פָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִ/מְאַ֥ת הַ/כִּכָּ֖ר כִּכָּ֥ר לָ/אָֽדֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: de
  text: 'Die hundert Talente Silber wurden verwendet, um die Sockel des Heiligtums und die Sockel des Vorhangs[a] zu gießen: hundert Sockel für die hundert Talente, ein Talent je Sockel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der innere Vorhang, der das Heilige vom Allerheiligsten trennte.
    reason: cultural_note
  - marker: b
    text: Ein Talent war eine antike Gewichtseinheit; sein genauer Wert konnte je nach Zeit und Ort variieren.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: wurden verwendet
  rationale: Im Zusammenhang der Abrechnung bezeichnet die Form die Verwendung des Silbers; die gewählte Wiedergabe ist im Deutschen natürlich und macht den Zweckzusammenhang deutlich.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: die hundert Talente Silber
  rationale: Die bestimmte Mengenangabe wird präzise und idiomatisch wiedergegeben; »Talent« bleibt als antike Gewichtseinheit erhalten.
- source_word: לָצֶקֶת
  choice: um … zu gießen
  rationale: Der Infinitiv bezeichnet den Zweck; im Zusammenhang mit Metallarbeiten bedeutet יצק das Gießen von Werkstücken.
- source_word: אַדְנֵי
  choice: Sockel
  rationale: Gemeint sind die metallenen Fundament- beziehungsweise Fußstücke unter den Bauteilen des Heiligtums. »Sockel« ist verständlich und sachlich passend.
- source_word: הַקֹּדֶשׁ
  choice: des Heiligtums
  rationale: Hier bezeichnet der Ausdruck die heilige Zeltanlage beziehungsweise deren Konstruktion, nicht ausschließlich einen einzelnen Innenraum.
- source_word: הַפָּרֹכֶת
  choice: des Vorhangs
  rationale: Der Ausdruck bezeichnet den inneren Trennvorhang; »Vorhang« ist im modernen Deutschen natürlicher als »Schleier«, während die Fußnote seine besondere Funktion erklärt.
- source_word: לִמְאַת הַכִּכָּר
  choice: aus hundert Talenten
  rationale: Die Präposition beschreibt hier die Zuordnung der hundert Sockel zur verwendeten Gesamtmenge. »Aus« gibt im Deutschen den Material- und Mengenbezug knapp wieder.
- source_word: כִּכָּר לָאָדֶן
  choice: ein Talent für jeden Sockel
  rationale: Die distributive Aussage wird idiomatisch als Verhältnis von einem Talent je Sockel ausgedrückt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der sachlichen Abrechnung des Hebräischen, wird jedoch für heutige Leser leicht geglättet. »Sockel« hält die konkrete bauliche Bedeutung fest; die kultische Funktion des Vorhangs wird in einer Fußnote erläutert.
