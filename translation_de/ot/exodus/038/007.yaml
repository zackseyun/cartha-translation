    issue: »Er schob die Stangen durch die Ringe«
    rationale: Das Hebräische sagt, dass die Stangen in die Ringe gebracht wurden. »Durch« kann zwar den praktischen Vorgang nahelegen, geht aber semantisch über die ausdrücklich bezeichnete Lage hinaus.
  - severity: medium
    issue: »als einen hohlen Kasten aus Brettern«
    rationale: Die Bezeichnung »Kasten« ist eine konkrete Bauform, die der knappe hebräische Ausdruck „hohl, Bretter“ nicht nennt. Die Konstruktion aus Brettern ist wahrscheinlich, aber die Form sollte nicht weiter festgelegt werden.
  - severity: low
    issue: Unpersönliches »damit man ihn damit tragen konnte«
    rationale: Die Formulierung ist verständlich, gibt den zweckbestimmenden Infinitiv aber weniger unmittelbar wieder als »um ihn damit zu tragen«.
