revisions:
- from: Er schob die Stangen durch die Ringe an den Seiten des Altars[a], damit man ihn damit tragen konnte. Er fertigte ihn als einen hohlen Kasten aus Brettern an[b].
  to: Er brachte die Stangen in die Ringe an den Seiten des Altars, um ihn damit zu tragen. Er fertigte ihn hohl aus Brettern an[b].
  rationale: Die Revision gibt die räumliche Angabe mit »in die Ringe« wieder, ohne den Ablauf als Hindurchschieben zu spezifizieren. Sie entfernt außerdem die nicht ausdrücklich im Ausgangstext genannte Bauform eines Kastens. Die Fußnote zu der elliptischen Schlussformulierung bleibt erhalten; eine Fußnote zu »brachte« ist nicht nötig, weil dies nun die naheliegende wörtliche Wiedergabe ist.
