  verdict: revise
  source_fidelity: Die Wiedergabe der Stangen, Ringe, Seiten und des Tragezwecks trifft den hebräischen Text. »Durch die Ringe schob« ist jedoch stärker als בַּטַּבָּעֹת („in die Ringe“), da es ein vollständiges Hindurchschieben ausdrücken kann. »Kasten« ergänzt eine im Hebräischen nicht ausdrücklich genannte Bauform.
  naturalness: Die Revision ist modernes, klares Standarddeutsch. »um ihn damit zu tragen« ist direkter und natürlicher als die unpersönliche Konstruktion »damit man ihn damit tragen konnte«.
  terminology: »Stangen«, »Ringe«, »Altar« und »Bretter« sind angemessen. Die elliptische Formulierung נְבוּב לֻחֹת wird ohne die zusätzliche Festlegung auf einen „Kasten“ wiedergegeben und in einer Fußnote erläutert.
