  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: de
  text: Er brachte die Stangen in die Ringe an den Seiten des Altars, um ihn damit zu tragen. Er fertigte ihn hohl aus Brettern an[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich: »hohl, Bretter«. Die knappe hebräische Formulierung meint wahrscheinlich, dass der Altar als hohle Konstruktion aus Brettern angefertigt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Er schob … durch
  rationale: Der Hifil von בוא bezeichnet hier das Einbringen der Stangen in die Ringe. »Durch die Ringe schieben« beschreibt den Vorgang im Deutschen natürlich und anschaulich.
- source_word: הַבַּדִּים
  choice: die Stangen
  rationale: בַּדִּים bezeichnet im Heiligtumskontext die zum Tragen verwendeten Stangen; »Stangen« ist modern und präzise.
- source_word: בַּטַּבָּעֹת
  choice: durch die Ringe
  rationale: ב mit »Ringe« bezeichnet hier die Führung beziehungsweise Lage der Stangen in den Ringen; nach »schieben« ist »durch« idiomatisch.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: an den Seiten des Altars
  rationale: צלעות meint die Seiten oder Seitenteile; »an den Seiten« gibt die Lage der Ringe ohne unnötige Präzisierung wieder.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: damit man ihn damit tragen konnte
  rationale: Der Infinitiv drückt den Zweck aus. Das zweite »damit« bezieht sich auf die Stangen und bildet בָּהֶם funktional ab.
- source_word: נְבוּב לֻחֹת
  choice: als einen hohlen Kasten aus Brettern
  rationale: Die knappe, elliptische Verbindung bedeutet wahrscheinlich eine hohle Konstruktion aus Brettern. »Kasten« macht die Bauform verständlich, wird aber wegen der Ellipse in einer Fußnote kenntlich gemacht.
- source_word: עָשָׂה אֹתוֹ
  choice: Er fertigte ihn … an
  rationale: עשה bezeichnet hier die handwerkliche Herstellung; »anfertigen« passt zum Baukontext und bewahrt das männliche Bezugswort »Altar«.
