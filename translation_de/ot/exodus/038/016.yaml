  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: de
  text: Alle Behänge des Vorhofs ringsum waren aus feinem gezwirntem Leinen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle Stoffbahnen des Vorhofs ringsum waren aus feinem gezwirntem Leinen.“'
    reason: 'Lexikalische Alternative: קַלְעֵי kann auch mit „Stoffbahnen“ wiedergegeben werden.'
lexical_decisions:
- source_word: כָּל
  choice: Alle
  rationale: Der Quantor bezeichnet die Gesamtheit der Behänge und wird im Deutschen natürlich kollektiv mit „alle“ wiedergegeben.
- source_word: קַלְעֵי
  choice: Behänge
  rationale: Gemeint sind die Stoffbahnen, die den Vorhof umgaben. „Behänge“ passt zum kultisch-architektonischen Zusammenhang und vermeidet die stärkere Assoziation von „Vorhängen“ mit Innenräumen.
- source_word: הֶחָצֵר
  choice: des Vorhofs
  rationale: חָצֵר bezeichnet hier den umschlossenen äußeren Bereich der Stiftshütte; „Vorhof“ ist die etablierte und sachlich passende deutsche Bezeichnung.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet die gesamte umlaufende Einfriedung; „ringsum“ gibt dies knapp und idiomatisch wieder.
- source_word: שֵׁשׁ
  choice: Leinen
  rationale: Im Kontext der Stiftshütte bezeichnet שֵׁשׁ Leinenstoff, wahrscheinlich von hoher Qualität. „Leinen“ wahrt den Materialbezug, ohne eine im Ausdruck nicht ausdrücklich getrennte Qualitätsangabe hinzuzufügen.
- source_word: מָשְׁזָר
  choice: gezwirntem
  rationale: Das Wort beschreibt aus gedrehten beziehungsweise miteinander verzwirnten Fäden gearbeitetes Material. „Gezwirnt“ ist im Deutschen die präzise textile Fachbezeichnung.
