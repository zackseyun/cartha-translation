  text: וַ/יֵּ֧רֶד יְהוָ֛ה עַל הַ֥ר סִינַ֖י אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/יִּקְרָ֨א יְהוָ֧ה לְ/מֹשֶׁ֛ה אֶל רֹ֥אשׁ הָ/הָ֖ר וַ/יַּ֥עַל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: de
  text: Da kam Jahwe auf den Berg Sinai herab, auf den Gipfel des Berges. Dann rief Jahwe Mose auf den Gipfel des Berges, und Mose stieg hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: kam … herab
  rationale: ירד bezeichnet eine Abwärtsbewegung. „kam … herab“ ist im Deutschen natürlich und gibt die auf den Schauplatz bezogene Bewegung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הַר סִינַי
  choice: Berg Sinai
  rationale: Dies ist die übliche und klare deutsche Bezeichnung des Ortes.
- source_word: אֶל רֹאשׁ הָהָר
  choice: auf den Gipfel des Berges
  rationale: רֹאשׁ bedeutet wörtlich „Kopf“, bezeichnet hier aber idiomatisch den höchsten Teil des Berges. „Gipfel“ gibt das räumliche Ziel präzise und natürlich wieder.
- source_word: וַיִּקְרָא
  choice: rief
  rationale: קרא bedeutet hier, jemanden zu rufen. „rief“ bewahrt die direkte Aussage, ohne sie stärker als förmliche Vorladung zu deuten.
- source_word: לְמֹשֶׁה
  choice: Mose
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
- source_word: וַיַּעַל
  choice: stieg hinauf
  rationale: עלה bezeichnet die Aufwärtsbewegung. „stieg hinauf“ entspricht dem Bergkontext und bildet einen natürlichen Kontrast zu „kam … herab“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Im hebräischen Text steht der Eigenname יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit schlichtem Erzählrhythmus. Die Wiederholung von „auf den Gipfel des Berges“ folgt der Wiederholung im Hebräischen; die Bewegungsverben „herabkommen“ und „hinaufsteigen“ bewahren den gezielten Kontrast.
