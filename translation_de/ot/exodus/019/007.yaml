base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: de
  text: Da kam Mose, rief die Ältesten des Volkes zusammen[a] und legte ihnen alle diese Worte[b] vor, die Jahwe ihm aufgetragen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rief nach den Ältesten des Volkes“ beziehungsweise „berief die Ältesten des Volkes ein“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle diese Angelegenheiten“ oder „alle diese Dinge“. Das hebräische Wort kann sowohl gesprochene Worte als auch Sachverhalte bezeichnen; hier passt „Worte“, weil Mose Jahwes Botschaft weitergibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam Mose zurück
  rationale: בוא kann je nach Blickrichtung „kommen“ oder „gehen“ bedeuten. Der Kontext beschreibt Moses Rückkehr von Jahwe zum Volk; „kam … zurück“ macht diese Bewegung im Deutschen natürlich deutlich.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: rief die Ältesten des Volkes zusammen
  rationale: קרא mit ל kann „rufen“ oder „herbeirufen“ bedeuten. Im Kontext versammelt Mose die anerkannten Vertreter des Volkes; „zusammenrufen“ gibt dies wieder, ohne die Stärke eines obrigkeitlichen „vorladen“ anzunehmen.
- source_word: זִקְנֵי הָעָם
  choice: die Ältesten des Volkes
  rationale: זְקֵנִים bezeichnet hier anerkannte ältere Repräsentanten. „Älteste“ bewahrt die gesellschaftliche und politische Funktion genauer als das allgemeinere „Anführer“.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: legte ihnen … vor
  rationale: שׂים לפני bedeutet wörtlich „vor jemanden legen/stellen“. Die deutsche Wendung „jemandem etwas vorlegen“ ist natürlich und bewahrt das Bild der geordneten Darlegung.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דְּבָרִים kann „Worte“, „Angelegenheiten“ oder „Dinge“ bedeuten. Da Mose die unmittelbar zuvor empfangene Botschaft weitergibt, passt „Worte“ am besten; die weitere Bedeutungsbreite wird in einer Fußnote erhalten.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: die Jahwe ihm aufgetragen hatte
  rationale: צוה bezeichnet ein verbindliches Anweisen oder Gebieten. „Aufgetragen hatte“ passt hier idiomatisch zur Weitergabe einer Botschaft und wahrt ihre göttliche Autorität; das Plusquamperfekt verdeutlicht, dass der Auftrag zuvor ergangen war.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben, um den im hebräischen Text ausdrücklich gebrauchten Bundesnamen zu bewahren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Stärke von צִוָּהוּ
  choice: ihm aufgetragen hatte
  alternative: ihm geboten hatte
  rationale: „Aufgetragen“ bewahrt den verbindlichen Charakter des göttlichen Befehls und klingt bei der Beauftragung zur Übermittlung dieser Worte im modernen Deutschen natürlich. „Geboten“ wäre ebenfalls möglich, könnte hier aber stärker nach einem einzelnen Gebot an Mose klingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt der hebräischen Erzählstruktur, während „kam … zurück“, „rief … zusammen“ und „legte … vor“ idiomatisches Deutsch bieten. Alle sachlich relevanten Mehrdeutigkeiten werden durch Fußnoten offengehalten.
