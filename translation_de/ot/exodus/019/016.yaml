base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: de
  text: Am dritten Tag, als es Morgen wurde, gab es Donnerschläge[a] und Blitze. Eine dichte Wolke lag auf dem Berg, und ein sehr lauter[b] Schofarklang[c] war zu hören. Da zitterte das ganze Volk im Lager.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Laute“ oder „Stimmen“ bedeuten; zusammen mit den Blitzen sind hier wahrscheinlich Donnerschläge gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sehr stark“. Im Zusammenhang beschreibt dies die Stärke, also die Lautstärke, des Klangs.'
    reason: lexical_alternative
  - marker: c
    text: Ein Schofar ist ein trompetenähnliches Instrument aus einem Tierhorn.
    reason: cultural_clarification
lexical_decisions:
- source_word: וַיְהִי ... בַיּוֹם הַשְּׁלִישִׁי
  choice: Am dritten Tag
  rationale: Die einleitende Form von היה führt das Geschehen narrativ fort; im Deutschen braucht sie nicht eigens mit „es geschah“ wiedergegeben zu werden, da die Zeitangabe einen natürlichen Satzanfang bildet.
- source_word: בִּהְיֹת הַבֹּקֶר
  choice: als es Morgen wurde
  rationale: Der Infinitivus constructus hat temporale Funktion. Die Formulierung ist gegenwärtiges, würdiges Deutsch und wahrt den Verlauf zum Morgen hin.
- source_word: קֹלֹת
  choice: Donnerschläge
  rationale: קוֹל kann Stimmen oder allgemein Geräusche bezeichnen; zusammen mit den Blitzen bezeichnet der Plural hier am wahrscheinlichsten einzelne Donnerschläge. Die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: וּבְרָקִים
  choice: und Blitze
  rationale: Gibt den hebräischen Plural direkt und natürlich wieder.
- source_word: עָנָן כָּבֵד
  choice: eine dichte Wolke
  rationale: כָּבֵד bedeutet wörtlich „schwer“; bei einer Wolke bezeichnet es hier ihre Dichte oder Mächtigkeit. „Dicht“ ist im modernen Deutschen die natürliche kontextuelle Entsprechung.
- source_word: עַל הָהָר
  choice: lag auf dem Berg
  rationale: עַל lässt „auf“ oder „über“ zu. „Auf dem Berg“ bewahrt die räumliche Unbestimmtheit des Ausgangstextes besser als eine Festlegung allein auf „über“.
- source_word: קֹל שֹׁפָר
  choice: ein Schofarton
  rationale: Die Verbindung bezeichnet den hörbaren Klang eines Schofars. Das Lehnwort bewahrt die konkrete Benennung des Instruments; eine Fußnote erklärt es allgemeinverständlich.
- source_word: חָזָק מְאֹד
  choice: sehr laut
  rationale: Wörtlich „sehr stark“; auf einen Ton bezogen gibt „sehr laut“ die gemeinte Intensität im natürlichen Deutschen wieder. Die wörtliche Möglichkeit wird vermerkt.
- source_word: וַיֶּחֱרַד
  choice: zitterte
  rationale: Das Verb bezeichnet körperliches Beben oder Zittern unter Erschrecken und Ehrfurcht, ohne ausdrücklich nur ein inneres Gefühl zu benennen.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: das ganze Volk im Lager
  rationale: Die attributive Wendung gibt die hebräische Relativkonstruktion knapp und idiomatisch wieder, ohne ihren Umfang zu verändern.
theological_decisions:
- issue: Theophanische Erscheinungen am Sinai
  choice: Die sinnlich wahrnehmbaren Phänomene werden beschreibend wiedergegeben; קֹלֹת erscheint im Kontext als „Donnerschläge“.
  alternative: קֹלֹת könnte allgemeiner mit „Laute“ oder „Stimmen“ wiedergegeben und als himmlische Stimmen verstanden werden.
  rationale: Die Verbindung mit Blitzen legt Donner nahe, doch der weitere Bedeutungsumfang des Wortes wird nicht dogmatisch ausgeschlossen, sondern in der Fußnote genannt.
- issue: Art des Schofars
  choice: „Schofar“ wird als Horninstrument erklärt, ohne das Tiermaterial festzulegen.
  alternative: „Widderhorn“ oder „Posaune“.
  rationale: Ein Schofar ist ein Horninstrument, aber das hebräische Wort legt in diesem Vers nicht ausdrücklich ein Widderhorn als Material fest. „Posaune“ könnte dagegen ein modernes Metallinstrument nahelegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die Reihung des Hebräischen wird lesbar gegliedert, während die dramatische Abfolge von Donner, Blitzen, Wolke, Schofarton und dem Zittern des Volkes erhalten bleibt. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
