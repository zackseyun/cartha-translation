source:
  edition: WLC
  text: וְ/הָי֥וּ נְכֹנִ֖ים לַ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כִּ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י יֵרֵ֧ד יְהוָ֛ה לְ/עֵינֵ֥י כָל הָ/עָ֖ם עַל הַ֥ר סִינָֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: de
  text: Sie sollen für den dritten Tag bereit sein, denn am dritten Tag wird Jahwe vor den Augen des ganzen Volkes auf den Berg Sinai herabkommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיוּ
  choice: Sie sollen sein
  rationale: Das formal perfektive Verb erhält im Zusammenhang der vorausgehenden Anweisungen auffordernden Charakter; „sie sollen“ gibt diesen im Deutschen natürlich wieder.
- source_word: נְכֹנִים
  choice: bereit
  rationale: Das Adjektiv bezeichnet hier die Vorbereitung auf die bevorstehende Gotteserscheinung.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: für den dritten Tag
  rationale: Die Präposition bezeichnet den Tag, auf den die Bereitschaft ausgerichtet ist, ohne ihn bloß als Frist zu verstehen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet die Begründung der Anweisung ein; „denn“ verbindet die beiden Hauptsätze in einem würdigen, natürlichen Register.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: am dritten Tag
  rationale: Dies ist die übliche deutsche Wiedergabe der temporalen Präposition בְּ bei einer Tagesangabe.
- source_word: יֵרֵד
  choice: wird … herabkommen
  rationale: Das Verb ירד bezeichnet eine Abwärtsbewegung. „Herabkommen“ bewahrt das räumliche Bild und passt zur Bewegung Gottes hin zum Berg und zum Volk.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: 'Die Wendung gibt das bildhafte hebräische Idiom eng und zugleich verständlich wieder: Das ganze Volk wird die Gotteserscheinung wahrnehmen.'
- source_word: כָל הָעָם
  choice: des ganzen Volkes
  rationale: Die Formulierung bezeichnet das Volk in seiner Gesamtheit und ist im Deutschen in Verbindung mit „vor den Augen“ idiomatisch.
- source_word: עַל הַר סִינָי
  choice: auf den Berg Sinai
  rationale: Mit dem Bewegungsverb „herabkommen“ gibt der Akkusativ die Zielrichtung auf den Berg wieder; dadurch bleibt die im Hebräischen mögliche dynamische Nuance von עַל erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Sichtbarkeit der Gotteserscheinung
  choice: vor den Augen des ganzen Volkes
  alternative: in Gegenwart des ganzen Volkes
  rationale: לְעֵינֵי betont die wahrnehmbare Erscheinung, ohne näher festzulegen, in welcher Gestalt Jahwe gesehen wird. Die bildhafte Wendung erhält diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt dem Hebräischen, ohne unnötig hölzern zu wirken. Keine Fußnote ist erforderlich; die im englischen Konsultationstext angegebene Fußnote passt inhaltlich nicht zu ihrer Markierung und wird daher nicht übernommen.
