source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: de
  text: 'Das ganze Volk antwortete gemeinsam: „Alles, was Jahwe gesagt hat, wollen wir tun.“ Darauf brachte Mose die Worte des Volkes zu Jahwe zurück.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Darauf berichtete Mose Jahwe die Worte des Volkes.'
    reason: וַיָּשֶׁב kann in diesem Zusammenhang sowohl mit dem Bild des Zurückbringens als auch mit der Bedeutung „zurückmelden/berichten“ verstanden werden.
lexical_decisions:
- source_word: וַיַּעֲנוּ כָל־הָעָם יַחְדָּו וַיֹּאמְרוּ
  choice: Das ganze Volk antwortete gemeinsam
  rationale: Die Formulierung gibt die gemeinsame, einmütige mündliche Antwort des gesamten Volkes natürlich wieder. Das im Hebräischen übliche „antworteten und sagten“ wird im Deutschen ohne Bedeutungsverlust zu „antwortete“ zusammengezogen.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: Alles, was Jahwe gesagt hat
  rationale: „Alles, was“ entspricht כֹּל אֲשֶׁר; das deutsche Perfekt stellt die zuvor ergangene Rede natürlich in Beziehung zur gegenwärtigen Zusage.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נַעֲשֶׂה
  choice: wollen wir tun
  rationale: Das Verb bedeutet hier wörtlich „tun/ausführen“. „Wollen wir tun“ bewahrt die Selbstverpflichtung, ohne die interpretierende Wiedergabe „gehorchen“ einzusetzen.
- source_word: וַיָּשֶׁב מֹשֶׁה אֶת־דִּבְרֵי הָעָם אֶל־יְהוָה
  choice: Darauf brachte Mose die Worte des Volkes zu Jahwe zurück
  rationale: Die Wiedergabe bewahrt sowohl das konkrete Bild des Zurückbringens als auch „die Worte des Volkes“ und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Ob נַעֲשֶׂה ausdrücklich als Gehorsamssprache wiederzugeben ist
  choice: wollen wir tun
  alternative: wollen wir befolgen / ihm wollen wir gehorchen
  rationale: Der Bundeskontext schließt Gehorsam ein, doch das hebräische Verb sagt unmittelbar „tun“. Die gewählte Fassung vermeidet eine stärkere Auslegung im Haupttext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Doppelung „antworteten und sagten“ wird idiomatisch gebündelt; die konkrete Wendung „die Worte … zurückbringen“ bleibt erhalten und wird durch eine Fußnote erläutert.
