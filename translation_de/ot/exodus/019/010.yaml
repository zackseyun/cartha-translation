  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: de
  text: 'Da sagte Jahwe zu Mose: „Geh zum Volk und heilige es[a] heute und morgen. Sie sollen ihre Gewänder waschen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weihe es“ oder „sondere es als heilig aus“; gemeint ist die rituelle Vorbereitung des Volkes für die Begegnung mit Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche wissenschaftliche Form.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ klingt im Deutschen natürlich und wahrt die zeitliche Abfolge.
- source_word: לֵךְ אֶל הָעָם
  choice: Geh zum Volk
  rationale: Die knappe Imperativform und das kollektive עָם werden unmittelbar und idiomatisch wiedergegeben.
- source_word: וְקִדַּשְׁתָּם
  choice: heilige es
  rationale: Das Piel von קדשׁ bezeichnet hier die rituelle Zurüstung des Volkes für die Begegnung mit Gott. „Heiligen“ wahrt den sakralen Gehalt und ist im Deutschen verständlich.
- source_word: הַיּוֹם וּמָחָר
  choice: heute und morgen
  rationale: Die beiden Zeitangaben werden direkt und idiomatisch wiedergegeben.
- source_word: וְכִבְּסוּ שִׂמְלֹתָם
  choice: Sie sollen ihre Gewänder waschen
  rationale: Der Wechsel zum pluralischen Verb wird mit einem neuen deutschen Satz sichtbar gemacht. „Gewänder“ entspricht dem feierlich-rituellen Kontext besser als „Kleider“.
theological_decisions:
- issue: Bedeutung von קדשׁ bei der Vorbereitung am Sinai
  choice: heilige es
  alternative: bereite es zur Heiligung vor; weihe es
  rationale: Die Formulierung bezeichnet die Absonderung und rituelle Vorbereitung des Volkes für die Gottesbegegnung, ohne sie auf eine rein innerlich-moralische Veränderung festzulegen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das kollektive Singularwort „Volk“ wird zunächst mit „es“ aufgenommen; beim pluralischen וְכִבְּסוּ folgt entsprechend dem Hebräischen der Wechsel zu „Sie sollen“. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Heiligungsformulierung.
