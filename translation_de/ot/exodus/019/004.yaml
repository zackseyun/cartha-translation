source:
  edition: WLC
  text: אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/מִצְרָ֑יִם וָ/אֶשָּׂ֤א אֶתְ/כֶם֙ עַל כַּנְפֵ֣י נְשָׁרִ֔ים וָ/אָבִ֥א אֶתְ/כֶ֖ם אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/004.yaml
  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: de
  text: Ihr habt selbst gesehen, was ich Ägypten angetan habe und wie ich euch auf Adlerflügeln[a][b] getragen und zu mir[c] gebracht habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Flügeln von Adlern“. Das hebräische Bild beschreibt eine machtvolle, schützende Rettung.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Adler“ wiedergegebene hebräische Wort kann allgemeiner große Greifvögel bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu mir selbst“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם רְאִיתֶם
  choice: Ihr habt selbst gesehen
  rationale: Das selbstständige Pronomen אַתֶּם hebt die Angeredeten hervor; „selbst“ gibt diese Betonung im natürlichen Deutschen wieder. Das Perfekt bezeichnet eine abgeschlossene Erfahrung mit gegenwärtiger Bedeutung.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: was ich Ägypten angetan habe
  rationale: Die Präposition לְ bezeichnet hier den von Gottes Handeln betroffenen Adressaten. „Ägypten angetan“ bewahrt den kollektiven Bezug und drückt die Gerichtshandlungen idiomatisch aus.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: ich euch … getragen habe
  rationale: נשא bedeutet hier „tragen“ und passt zu dem Bild einer machtvollen, schützenden Rettung.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: auf Adlerflügeln
  rationale: Die kompakte deutsche Zusammensetzung gibt die hebräische Konstruktverbindung natürlich wieder. נְשָׁרִים wird kontextgemäß traditionell als „Adler“ verstanden, kann aber allgemeiner große Greifvögel bezeichnen.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: und zu mir gebracht habe
  rationale: „Zu mir“ entspricht אֵלָי unmittelbar und lässt die im Kontext erkennbare relationale beziehungsweise bundesbezogene Bedeutung bestehen, ohne sie im Haupttext stärker auszudeuten.
theological_decisions:
- issue: Relationale Bedeutung der Befreiung
  choice: zu mir gebracht
  alternative: zu mir selbst gebracht
  rationale: Der Exodus führt Israel in die Nähe und Bundesbeziehung zu Gott. Die wörtlich-nahe Formulierung „zu mir“ bewahrt diesen Sinn, ohne die relationale Nuance ausdrücklich zu verstärken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt gut verständlich und bewahrt zugleich die Bildkraft und die hervorgehobene direkte Anrede des Hebräischen.
