  source_fidelity: 'Der deutsche Text gibt alle Satzglieder des Hebräischen angemessen wieder: Die hervorgehobene Anrede ist in „Ihr habt selbst gesehen“ erkennbar; לְמִצְרַיִם wird idiomatisch und dem Gerichtskontext entsprechend mit „Ägypten angetan“ wiedergegeben; נשא ist zutreffend „getragen“, und אֵלַי bleibt mit „zu mir“ direkt und ohne zusätzliche theologische Ausdeutung erhalten. Die Vergangenheitsformen sind im Deutschen natürlich als Perfekt umgesetzt.'
  naturalness: Der Satz ist flüssiges, modernes Standarddeutsch und behält zugleich den würdevollen, bildhaften Ton der Gottesrede. Die Verbindung „was ich Ägypten angetan habe und wie ich euch … getragen und zu mir gebracht habe“ ist klar und gut lesbar.
  terminology: „Adlerflügeln“ ist eine natürliche, knappe Wiedergabe von עַל־כַּנְפֵי נְשָׁרִים. Die Fußnoten sichern sowohl die wörtlichere Formulierung als auch die lexikalische Weite von נְשָׁרִים ab. „Zu mir“ entspricht dem hebräischen אֵלַי genauer als die im englischen Audittext bevorzugte, interpretativ etwas stärkere Form „zu mir selbst“.
