base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: de
  text: 'Du sollst rings um das Volk eine Grenze ziehen und sagen: »Hütet euch davor, auf den Berg zu steigen oder seinen Rand zu berühren. Jeder, der den Berg berührt, wird gewiss getötet werden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wird gewiss sterben«. Die hebräische Wendung ist eine nachdrückliche Todesformel. Sie wird hier wegen der passiven Verbform und der im folgenden Vers näher beschriebenen Vollstreckung mit »wird gewiss getötet werden« wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Du sollst … eine Grenze ziehen
  rationale: Das Hifil von גבל bezeichnet das Festlegen oder Markieren einer Grenze. Die deutsche Wendung ist konkret, verständlich und passt zum abgesperrten Bereich um den Berg.
- source_word: אֶת־הָעָם סָבִיב
  choice: rings um das Volk
  rationale: סָבִיב beschreibt die umlaufende Begrenzung; im Deutschen verbindet sich dies natürlich mit »eine Grenze rings um das Volk ziehen«.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Hütet euch
  rationale: Der Nifal-Imperativ mit לָכֶם ist eine eindringliche Warnformel. »Hütet euch« bewahrt den Nachdruck und bleibt in würdigem modernem Deutsch verständlich.
- source_word: עֲלוֹת בָּהָר
  choice: auf den Berg zu steigen
  rationale: עלה mit ב bezeichnet hier das Hinaufsteigen auf den Berg.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: oder auch nur seinen Rand zu berühren
  rationale: קָצֶה bezeichnet Rand oder äußerstes Ende. »Auch nur« verdeutlicht idiomatisch, dass bereits die Berührung des Randes untersagt ist, ohne den sachlichen Umfang des Verbots zu erweitern.
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Wer den Berg berührt
  rationale: Die substantivierte Partizipialkonstruktion ist allgemein und distributiv; »Wer …« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: מוֹת יוּמָת
  choice: muss unbedingt getötet werden
  rationale: Der Infinitivus absolutus mit dem passiven Hofal drückt nachdrückliche Gewissheit aus. Die passive deutsche Form wahrt, dass die Person getötet wird; »unbedingt« gibt die Verstärkung wieder.
theological_decisions:
- issue: Bedeutung der emphatischen Todesformel מוֹת יוּמָת
  choice: muss unbedingt getötet werden
  alternative: muss unbedingt sterben
  rationale: Die hebräische Verbform ist passiv und der folgende Vers beschreibt die Vollstreckung durch andere. Dennoch kann die Formel allgemeiner als sichere Todesankündigung verstanden werden; diese Möglichkeit wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede erhält den eindringlichen Warncharakter; die Formulierung vermeidet unnötig altertümliche oder konfessionell geprägte Sprache.
