  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: de
  text: Und auch die Priester, die sich Jahwe nähern, sollen sich heiligen[a], damit Jahwe nicht gegen sie losbricht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sollen sich weihen“ beziehungsweise „sich als heilig bereit machen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „gegen sie hervorbricht“. Das hebräische Verb beschreibt einen plötzlichen Ausbruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Und auch
  rationale: 'Gibt die anknüpfende und zugleich hervorhebende Funktion wieder: Auch die Priester sind in die Warnung einbezogen.'
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und sachlich genaue Wiedergabe im kultischen Zusammenhang; der bestimmte Artikel bleibt erhalten.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: die sich Jahwe nähern
  rationale: Das Partizip von נגשׁ bezeichnet hier das Herantreten an Gottes Gegenwart, wahrscheinlich im Zusammenhang mit priesterlichem Dienst; die Formulierung bewahrt diesen kultischen Sinn, ohne ihn weiter festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich verwendeten Gottesnamen wieder und erhält seine Wiederholung am Versende.
- source_word: יִתְקַדָּשׁוּ
  choice: sollen sich heiligen
  rationale: Bewahrt die reflexive Bedeutung des Hitpael und den Zusammenhang von Heiligkeit und Vorbereitung; „sollen“ drückt die verpflichtende Anweisung natürlich aus.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Natürliches modernes Deutsch für eine Warnung vor einer möglichen negativen Folge.
- source_word: יִפְרֹץ בָּהֶם
  choice: gegen sie losbricht
  rationale: Bewahrt das anschauliche Bild eines plötzlichen, gegen sie gerichteten göttlichen Ausbruchs, ohne eine bestimmte Strafart hinzuzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich zweimal. „Jahwe“ bewahrt den offenbarten Eigennamen und die betonte Wiederholung.
- issue: Sinn von יִפְרֹץ בָּהֶם יְהוָה
  choice: Warnung vor einem plötzlichen göttlichen Vorgehen gegen die Priester
  alternative: Jahwe könnte zu ihnen durchbrechen
  rationale: Verb, Präposition und Sinai-Kontext weisen auf eine gefährliche, gegen sie gerichtete Reaktion hin. Die Übersetzung lässt die genaue Form des Gerichts offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kultische Sprache bleibt erkennbar, ist aber ohne unnötige Fachbegriffe verständlich. Die Satzstellung erhält die ausdrückliche Wiederholung des Gottesnamens und die eindringliche Warnung.
