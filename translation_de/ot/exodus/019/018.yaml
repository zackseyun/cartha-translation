  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: de
  text: Der Berg Sinai war ganz in Rauch gehüllt, weil Jahwe im Feuer auf ihn herabgestiegen war. Sein Rauch stieg auf wie der Rauch eines Ofens[a], und der ganze Berg bebte heftig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eines Brennofens“; auch: „eines Schmelzofens“.'
    reason: כִּבְשָׁן bezeichnet einen Ofen beziehungsweise eine Feuerungsanlage; die genaue Art ist im Kontext nicht festgelegt.
lexical_decisions:
- source_word: וְהַר סִינַי
  choice: Der Berg Sinai
  rationale: הַר סִינַי bezeichnet den Berg Sinai. Das vorangestellte וְ verbindet den Satz mit dem Kontext, muss im natürlichen deutschen Erzählstil hier aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: עָשַׁן כֻּלּוֹ
  choice: war ganz in Rauch gehüllt
  rationale: Das Verb עָשַׁן bezeichnet das Rauchen beziehungsweise Erfülltsein mit Rauch; כֻּלּוֹ betont, dass der gesamte Berg betroffen war. Die Formulierung gibt den Zustand anschaulich und idiomatisch wieder.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: weil
  rationale: Die Wendung leitet den Grund für den Rauch ein.
- source_word: יָרַד עָלָיו יְהוָה
  choice: Jahwe … auf ihn herabgestiegen war
  rationale: יָרַד bedeutet „herabsteigen“. Das Plusquamperfekt verdeutlicht im Deutschen das im Kausalsatz vorausgesetzte Geschehen; das Pronomen bezieht sich auf den Berg.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition בְּ beschreibt hier die Weise beziehungsweise Erscheinungsform des Herabsteigens.
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: Sein Rauch stieg auf
  rationale: Das Suffix bezieht sich grammatisch auf den Berg; עָלָה bezeichnet die Aufwärtsbewegung.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: wie der Rauch eines Schmelzofens
  rationale: כִּבְשָׁן kann einen großen Ofen beziehungsweise Brenn- oder Schmelzofen bezeichnen. „Schmelzofen“ vermittelt das Bild von dichtem, aufsteigendem Rauch; die mögliche Wiedergabe „Brennofen“ bleibt in der Fußnote erhalten.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: und der ganze Berg bebte heftig
  rationale: חרד bezeichnet hier ein starkes Erzittern oder Beben des Berges; מְאֹד verstärkt den Vorgang. „heftig“ klingt im Deutschen natürlicher als „sehr“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlich erschlossenen Aussprache und bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. „In Rauch gehüllt“ und „bebte heftig“ sind allgemein verständlich, ohne die eindringliche Bildsprache des hebräischen Textes abzuschwächen.
