  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Steig hinab und warne das Volk; sonst durchbrechen sie zu Jahwe hin, um ihn zu sehen[a], und viele von ihnen fallen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um zu schauen“. Das hebräische Verb kann sowohl das Sehen als auch das bewusste Hinschauen bezeichnen; gemeint ist hier der Versuch, Jahwes Erscheinung anzuschauen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und viele aus ihrer Mitte fallen“. Im Zusammenhang kann „fallen“ den Tod bezeichnen, doch der hebräische Text sagt dies nicht ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: רֵד
  choice: Steig hinab
  rationale: Der Imperativ von ירד bezeichnet die Bewegung vom Berg hinunter; „steig hinab“ ist natürlich und bewahrt die räumliche Richtung.
- source_word: הָעֵד בָּעָם
  choice: warne das Volk
  rationale: Die Hifil-Form von עוד bezeichnet hier eine nachdrückliche Warnung angesichts der gesetzten Grenze.
- source_word: פֶּן
  choice: damit … nicht
  rationale: Die Wendung leitet die zu verhindernde Handlung ein und lässt sich im modernen Deutschen natürlich mit „damit … nicht“ ausdrücken.
- source_word: יֶהֶרְסוּ
  choice: durchbrechen
  rationale: Im Zusammenhang geht es um das gewaltsame Überschreiten der abgesperrten Grenze am Berg.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Die Präposition bezeichnet die Bewegung auf die offenbarte Gegenwart Jahwes zu.
- source_word: לִרְאוֹת
  choice: um zu schauen
  rationale: Der Infinitiv bezeichnet den Zweck des Durchbrechens. „Schauen“ bewahrt die mögliche Bedeutung von bewusstem Hinsehen, ohne das Verb zu überdeuten.
- source_word: וְנָפַל מִמֶּנּוּ רָב
  choice: und viele von ihnen fallen
  rationale: Die Wiedergabe erhält das allgemeine Verb „fallen“ und die Mengenangabe, ohne den im Kontext wahrscheinlichen Tod ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt den persönlichen Bundesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Folge des unerlaubten Durchbrechens
  choice: fallen
  alternative: sterben / umkommen
  rationale: Im Zusammenhang dürfte „fallen“ den Tod als göttliches Gericht einschließen; da der hebräische Text dies jedoch nicht ausdrücklich formuliert, bleibt die allgemeinere Ausdrucksweise im Haupttext erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappen Imperative und die Warnstruktur des Hebräischen bleiben erhalten; mögliche Todesbedeutung und Bedeutungsbreite von ראה werden nicht stillschweigend vereindeutigt.
