  to: 'Und Jahwe sagte zu Mose: „Steig hinab und warne das Volk; sonst durchbrechen sie zu Jahwe hin, um ihn zu sehen[a], und viele von ihnen fallen[b].“'
  rationale: Die Revision beseitigt die missverständliche Satzverknüpfung, indem sie die Warnungsfolge mit „sonst“ ausdrückt. Der Bezug des Sehens auf Jahwe wird mit dem kontextuell eindeutigen Pronomen „ihn“ im Deutschen lesbar gemacht. Die offene Bedeutung von „fallen“ sowie die Bedeutungsbreite von ראה bleiben im Text und in den Fußnoten gewahrt.
