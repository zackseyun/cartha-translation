source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: de
  text: 'Und Mose sagte zu Jahwe: „Das Volk kann nicht auf den Berg Sinai hinaufsteigen, denn du selbst hast uns eindringlich gewarnt[a]: ‚Zieh eine Grenze um den Berg und heilige ihn.‘[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hast es uns feierlich eingeschärft“ beziehungsweise „hast uns gegenüber bezeugt“. Das hebräische Verb kann eine förmliche Warnung oder Bezeugung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Setze dem Berg eine Grenze und sondere ihn als heilig aus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen des hebräischen Textes, statt ihn durch einen Titel zu ersetzen.
- source_word: לֹא יוּכַל
  choice: kann nicht
  rationale: Das Imperfekt von יכל bezeichnet hier Unvermögen unter der bestehenden Einschränkung; die Formulierung ist natürlich und eindeutig.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: auf den Berg Sinai hinaufsteigen
  rationale: Gibt die Aufwärtsbewegung von עלה wieder und bezeichnet das Ziel im Deutschen idiomatisch.
- source_word: כִּי אַתָּה
  choice: denn du selbst
  rationale: כִּי leitet die Begründung ein; das ausdrücklich gesetzte Pronomen אַתָּה wird durch „du selbst“ hervorgehoben.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: hast uns eindringlich gewarnt
  rationale: Die Hifil-Form von עוד kann eine förmliche Bezeugung, Einschärfung oder Warnung ausdrücken; im Zusammenhang der gefährlichen Grenze trifft „eindringlich gewarnt“ die Funktion, ohne den feierlichen Nachdruck ganz zu verlieren.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Zieh eine Grenze um den Berg
  rationale: Die Hifil-Aufforderung von גבל verlangt das Setzen beziehungsweise Markieren einer Grenze; „um den Berg“ macht deren räumliche Schutzfunktion verständlich.
- source_word: וְקִדַּשְׁתּוֹ
  choice: und heilige ihn
  rationale: Die Piel-Form von קדשׁ bezeichnet das Absondern als heilig. „Heilige ihn“ wahrt den kultischen Gehalt und bleibt in würdigem Gegenwartsdeutsch verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen und verwendet die im modernen Deutschen verbreitete Form.
- issue: Bedeutung von הַעֵדֹתָה בָּנוּ
  choice: hast uns eindringlich gewarnt
  alternative: hast uns feierlich eingeschärft; hast uns gegenüber bezeugt
  rationale: Im Kontext erinnert Mose an die verbindliche Anweisung zur Grenzziehung. Die Hauptfassung gibt diese pragmatische Warnfunktion wieder; die Fußnote erhält die förmlich-rechtliche Bedeutungsnuance des Verbs.
- issue: Bedeutung von וְקִדַּשְׁתּוֹ
  choice: und heilige ihn
  alternative: und sondere ihn als heilig aus
  rationale: Die knappe Hauptfassung wahrt die Heiligkeitssprache des Textes, ohne näher festzulegen, durch welche Handlung die Heiligung vollzogen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mündlich nachvollziehbar. „Jahwe“ gibt den Gottesnamen wieder; „heilige“ bewahrt die kultische Spannung, während die Fußnoten echte lexikalische Alternativen offenhalten.
