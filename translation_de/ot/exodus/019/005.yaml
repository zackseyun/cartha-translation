  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: de
  text: 'Und nun: Wenn ihr wirklich auf meine Stimme hört[a] und meinen Bund haltet, dann werdet ihr aus der Mitte aller Völker mein kostbarer Besitz sein[b][c]; denn die ganze Erde gehört mir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr meiner Stimme wirklich gehorcht“. Im Hebräischen steht wörtlich eine verstärkende Form: „wenn ihr hörend hört“; gemeint ist aufmerksames, gehorsames Hören.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein besonderer Besitz“ beziehungsweise „mein Eigentum von besonderem Wert“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: aus der Mitte aller Völker. Der folgende Satz stellt klar, dass dennoch die ganze Erde Gott gehört.'
    reason: clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung durch ו als auch den zeitlich-folgernden Übergang עַתָּה aus dem vorausgehenden Zusammenhang.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ בְּקֹלִי
  choice: wirklich auf meine Stimme hört
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage. „Wirklich“ gibt diese Betonung wieder; „auf meine Stimme hört“ bewahrt das konkrete hebräische Bild und schließt gehorsames Hören ein.
- source_word: וּשְׁמַרְתֶּם אֶת־בְּרִיתִי
  choice: und meinen Bund haltet
  rationale: שׁמר bezeichnet im Bundeskontext treues Bewahren und Befolgen; „den Bund halten“ ist im Deutschen natürlich und sachgerecht.
- source_word: וִהְיִיתֶם לִי
  choice: dann werdet ihr ... mein ... sein
  rationale: „Dann“ kennzeichnet im Deutschen klar den Folgesatz der Bedingung, während die Zugehörigkeit zu Gott erhalten bleibt.
- source_word: סְגֻלָּה
  choice: kostbarer Besitz
  rationale: Das Wort bezeichnet wertvollen, besonders zugehörigen Besitz. „Kostbarer Besitz“ vermittelt sowohl Wertschätzung als auch Zugehörigkeit, ohne den Ausdruck auf bloßes Eigentum zu reduzieren.
- source_word: מִכָּל הָעַמִּים
  choice: unter allen Völkern
  rationale: מן bezeichnet hier die Auswahl aus der Gesamtheit der Völker. „Unter allen Völkern“ drückt die besondere Stellung Israels aus, ohne zu behaupten, die übrigen Völker gehörten Gott nicht.
- source_word: כִּי לִי כָּל־הָאָרֶץ
  choice: denn die ganze Erde gehört mir
  rationale: כִּי begründet die vorausgehende Aussage. Der universale Zusammenhang mit allen Völkern spricht für „Erde“ statt „Land“; „gehört mir“ gibt לִי idiomatisch wieder.
theological_decisions:
- issue: Ob שׁמע im Bundeskontext mit „hören“ oder „gehorchen“ wiederzugeben ist
  choice: auf meine Stimme hört
  alternative: mir gehorcht
  rationale: Das Idiom schließt Gehorsam ein, stellt sprachlich aber das Hören auf Gottes Stimme in den Vordergrund. Der folgende Ausdruck „meinen Bund haltet“ macht die praktische Gehorsamsdimension ausdrücklich sichtbar.
- issue: Wie Israels Stellung als סְגֻלָּה auszudrücken ist, ohne Gottes universalen Besitzanspruch einzuschränken
  choice: unter allen Völkern mein kostbarer Besitz
  alternative: mehr als alle Völker mein besonderer Besitz
  rationale: Die gewählte Formulierung bezeichnet Israel als aus den Völkern besonders zugehörig und bewahrt zugleich die Spannung zur Begründung, dass die ganze Erde Gott gehört.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am hebräischen Bedingungsgefüge, wird aber durch Doppelpunkt und „dann“ transparent gegliedert. Das konkrete Bild vom Hören auf Gottes Stimme sowie die Spannung zwischen Israels besonderer Erwählung und Gottes Anspruch auf die ganze Erde bleiben erhalten.
