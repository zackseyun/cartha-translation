source:
  edition: WLC
  text: לֹא תִגַּ֨ע בּ֜/וֹ יָ֗ד כִּֽי סָק֤וֹל יִסָּקֵל֙ אוֹ יָרֹ֣ה יִיָּרֶ֔ה אִם בְּהֵמָ֥ה אִם אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּ/מְשֹׁךְ֙ הַ/יֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָ/הָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: de
  text: 'Keine Hand darf ihn berühren[a]; er muss gesteinigt oder erschossen[b] werden. Ob Tier oder Mensch: Er darf nicht am Leben bleiben. Erst wenn das Widderhorn lang ertönt[c], dürfen sie auf den Berg steigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keine Hand darf es berühren.“ Das maskuline Pronomen kann allgemeiner verstanden werden. Gemeint ist jedenfalls, dass der Übertreter nicht unmittelbar angefasst, sondern aus der Entfernung getötet werden soll.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „durchbohrt“. Das hebräische Verb kann das Beschießen, wahrscheinlich mit Pfeilen, bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „wenn der Jobel lang gezogen wird“. Gemeint ist wahrscheinlich ein lang anhaltender Ton auf einem Widderhorn.'
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Keine Hand darf ihn berühren
  rationale: Bewahrt die unpersönliche Rechtsformel und bezieht das maskuline Suffix am natürlichsten auf denjenigen, der die Grenze überschritten hat. Zugleich wird deutlich, dass der Verurteilte nicht unmittelbar angefasst werden darf.
- source_word: סָקוֹל יִסָּקֵל
  choice: er muss gesteinigt werden
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Verbindlichkeit und Gewissheit der Strafe; „muss“ gibt dies in natürlichem Deutsch wieder.
- source_word: יָרֹה יִיָּרֶה
  choice: erschossen werden
  rationale: ירה kann hier das Beschießen, wahrscheinlich mit Pfeilen, bezeichnen. „Erschossen“ ist im Deutschen klar, ohne das im Hebräischen nicht ausdrücklich genannte Geschoss in den Haupttext einzutragen.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Ob Tier oder Mensch
  rationale: Gibt die beide Kategorien umfassende Alternative knapp und idiomatisch wieder.
- source_word: לֹא יִחְיֶה
  choice: Er darf nicht am Leben bleiben
  rationale: Vermittelt die zwingende Rechtsfolge in gegenwärtigem Deutsch und lässt den Singular nach der Alternative „Tier oder Mensch“ generisch stehen.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: wenn das Widderhorn lang ertönt
  rationale: Das wörtliche „wenn der Jobel lang gezogen wird“ bezeichnet wahrscheinlich einen lang anhaltenden Ton des Widderhorns. Die Übersetzung macht das kulturelle Idiom verständlich.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: dürfen sie auf den Berg steigen
  rationale: Im Zusammenhang markiert das Signal die Aufhebung des zuvor geltenden Verbots; „dürfen“ drückt diese Erlaubnis natürlich aus.
theological_decisions:
- issue: Bezugswort des maskulinen Singularsuffixes in בּוֹ
  choice: Das Suffix bezieht sich auf den Menschen beziehungsweise das Lebewesen, das die Grenze überschritten hat.
  alternative: Das Suffix kann allgemeiner auf das durch Berührung dem Bann Verfallene bezogen werden.
  rationale: Der unmittelbare Zusammenhang handelt von Mensch oder Tier, die den Berg berühren und aus der Entfernung getötet werden sollen. Der personale Bezug entspricht daher am besten der Rechtslogik, ohne die grammatische Alternative zu verschweigen.
translation_notes:
  register: Moderne, würdige Rechtssprache mit kurzen, klaren Sätzen. Die Wiederholungsformen des Hebräischen werden durch modale Verbindlichkeit wiedergegeben. „Erst“ verdeutlicht die zeitliche Freigabe im Kontext, ohne eine konfessionelle Deutung einzutragen.
