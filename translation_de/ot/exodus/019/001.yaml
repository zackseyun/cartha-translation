reference: Exodus 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/חֹ֨דֶשׁ֙ הַ/שְּׁלִישִׁ֔י לְ/צֵ֥את בְּנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בַּ/יּ֣וֹם הַ/זֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: de
  text: Im dritten Monat nach dem Auszug der Israeliten[a] aus dem Land Ägypten kamen sie an eben diesem Tag[b] in die Wüste Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne Israels“; auch „Kinder Israels“. Gemeint ist das Volk Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „an diesem Tag“. Die Formulierung kann den genauen Tag der Ankunft hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: Im dritten Monat
  rationale: חֹדֶשׁ bezeichnet in dieser Zeitangabe einen Monat; die deutsche Wendung gibt die Datierung natürlich und genau wieder.
- source_word: לְצֵאת
  choice: nach dem Auszug
  rationale: Der Infinitivus constructus mit לְ setzt den Auszug als zeitlichen Bezugspunkt. „Nach dem Auszug“ ist im Deutschen knapp und idiomatisch.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: der Israeliten
  rationale: Wörtlich steht „Söhne Israels“. Als feste Bezeichnung des gesamten Volkes wird die Wendung im modernen Deutschen mit „Israeliten“ klar und ohne irreführende Beschränkung auf männliche Personen wiedergegeben; die Form des Hebräischen bleibt in der Fußnote sichtbar.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: אֶרֶץ ist ausdrücklich vorhanden. „Land Ägypten“ bewahrt den vollen Ausdruck und klingt im Deutschen würdig und verständlich.
- source_word: בַּיּוֹם הַזֶּה
  choice: an eben diesem Tag
  rationale: Der Demonstrativausdruck bedeutet wörtlich „an diesem Tag“. „Eben“ bringt die mögliche Hervorhebung des bestimmten Tages zum Ausdruck, ohne dessen Datum zu ergänzen.
- source_word: בָּאוּ
  choice: kamen sie
  rationale: בוא ist das gewöhnliche Verb für „kommen“ beziehungsweise „hineingehen“. „Kamen“ bleibt nahe am Wortlaut und passt zur Zielangabe.
- source_word: מִדְבַּר סִינָי
  choice: in die Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppenland. „Wüste Sinai“ ist die geläufige deutsche Wiedergabe der hebräischen Genitivverbindung.
theological_decisions:
- issue: Bezeichnung des Bundesvolkes בְּנֵי יִשְׂרָאֵל
  choice: Israeliten
  alternative: Söhne Israels / Kinder Israels
  rationale: Die hebräische Wendung ist eine konventionelle Bezeichnung für das ganze Volk. „Israeliten“ vermittelt diese Bedeutung im heutigen Deutsch eindeutig; die wörtliche Form wird in der Fußnote dokumentiert, ohne eine Aussage nur über Männer nahezulegen.
- issue: Zeitlicher Nachdruck in בַּיּוֹם הַזֶּה
  choice: an eben diesem Tag
  alternative: an diesem Tag
  rationale: Der Text kann den genauen Ankunftstag hervorheben. Die Übersetzung lässt diese Hervorhebung erkennen, ohne aus dem Vers ein nicht ausdrücklich genanntes Kalenderdatum abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung hält die beiden Zeitangaben zusammen, ohne die hebräische Struktur unnötig zu verkomplizieren. „Israeliten“ vermeidet im Deutschen eine missverständliche Beschränkung auf Männer; „Wüste Sinai“ folgt dem etablierten biblischen Sprachgebrauch.
