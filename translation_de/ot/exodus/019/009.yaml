  source_fidelity: 'Der Text gibt die hebräische Satzstruktur und die wesentlichen Bedeutungen zuverlässig wieder: Jahwes Kommen in einer dichten Wolke, der Zweck des hörbaren Redens mit Mose, das dauerhafte Vertrauen des Volkes in Mose sowie Moses anschließende Mitteilung an Jahwe. „Dir vertraut“ ist für וְגַם בְּךָ יַאֲמִינוּ eine idiomatische deutsche Wiedergabe und vermeidet eine unnötig kultisch klingende Übertragung.'
