  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Mose“, „Volk“, „Worte“ und „vertrauen“ sind terminologisch passend. Die Fußnote dokumentiert sachgerecht die mögliche Alternative „an dich glaubt“ und erklärt die kontextuelle Bedeutung als Anerkennung Moses als beglaubigten Sprecher.
