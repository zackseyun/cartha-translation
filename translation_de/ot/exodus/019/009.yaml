source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶי/ךָ֮ בְּ/עַ֣ב הֶֽ/עָנָן֒ בַּ/עֲב֞וּר יִשְׁמַ֤ע הָ/עָם֙ בְּ/דַבְּרִ֣/י עִמָּ֔/ךְ וְ/גַם בְּ/ךָ֖ יַאֲמִ֣ינוּ לְ/עוֹלָ֑ם וַ/יַּגֵּ֥ד מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Sieh, ich komme zu dir in einer dichten Wolke, damit das Volk hört, wenn ich mit dir rede, und auch dir für immer vertraut.[a]“ Darauf berichtete Mose Jahwe die Worte des Volkes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „an dich glaubt“ oder „dir Glauben schenkt“. Das Hebräische bezeichnet Vertrauen in Mose als den von Gott beglaubigten Sprecher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner etablierten wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die aufmerksamkeitslenkende und feierliche Funktion des hebräischen Ausdrucks in natürlichem modernem Deutsch.
- source_word: בָּא
  choice: ich komme
  rationale: Das Partizip bezeichnet hier ein unmittelbar bevorstehendes, anschaulich dargestelltes Kommen; das deutsche Präsens gibt dies natürlich wieder.
- source_word: בְּעַב הֶעָנָן
  choice: in einer dichten Wolke
  rationale: Gibt das Bild einer massiven, undurchsichtigen Wolke klar und idiomatisch wieder.
- source_word: בַּעֲבוּר
  choice: damit
  rationale: Leitet in diesem Zusammenhang einen Zwecksatz ein.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: wenn ich mit dir rede
  rationale: Gibt die temporale Funktion der Infinitivkonstruktion und das wechselseitige 'mit dir' natürlich wieder.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: und auch dir … vertraut
  rationale: Das Hifil von אמן mit ב bezeichnet Vertrauen beziehungsweise Glauben an die Verlässlichkeit einer Person. Im Kontext geht es um Moses Beglaubigung als Gottes Sprecher; 'dir vertrauen' ist im Deutschen natürlich, ohne die Aussage kultisch zu überhöhen.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: Bewahrt die Aussage einer unbegrenzten beziehungsweise dauerhaften Geltung in verständlicher Sprache.
- source_word: וַיַּגֵּד
  choice: Darauf berichtete
  rationale: Markiert den Fortgang der Erzählung und gibt den Sinn des Mitteilens oder Berichtens präzise wieder.
- source_word: דִּבְרֵי הָעָם
  choice: die Worte des Volkes
  rationale: Bewahrt die konkrete lexikalische Formulierung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. 'Jahwe' bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von בְּךָ יַאֲמִינוּ in Bezug auf Mose
  choice: dir vertrauen
  alternative: an dich glauben / dir Glauben schenken
  rationale: Der Zusammenhang betrifft die dauerhafte Anerkennung Moses als von Gott beglaubigten Sprecher. 'Dir vertrauen' bewahrt den Vertrauenssinn, ohne Verehrung Moses anzudeuten; die Fußnote hält die weitere mögliche Nuance offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt feierlich, aber verständlich; 'Sieh' erhält den hebräischen Aufmerksamkeitsruf, und 'Darauf berichtete' führt die Erzählung flüssig weiter.
