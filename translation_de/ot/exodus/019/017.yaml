  text: וַ/יּוֹצֵ֨א מֹשֶׁ֧ה אֶת הָ/עָ֛ם לִ/קְרַ֥את הָֽ/אֱלֹהִ֖ים מִן הַֽ/מַּחֲנֶ֑ה וַ/יִּֽתְיַצְּב֖וּ בְּ/תַחְתִּ֥ית הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: de
  text: Dann brachte Mose das Volk aus dem Lager hinaus, Gott entgegen, und sie stellten sich am Fuß des Berges[a] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am unteren Teil des Berges“. Der hebräische Ausdruck bezeichnet den unteren Bereich beziehungsweise den Fuß des Berges.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: brachte … hinaus
  rationale: Der Hifil von יצא bezeichnet das Veranlassen des Hinausgehens. „Brachte … hinaus“ bewahrt den kausativen Sinn, ohne eine bestimmte Art der Führung hinzuzufügen.
- source_word: לִקְרַאת
  choice: entgegen
  rationale: Die Wendung bezeichnet eine Bewegung auf eine Begegnung hin. „Gott entgegen“ ist im Deutschen knapp und idiomatisch und bewahrt diese räumlich-begegnungsbezogene Bedeutung.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte hebräische Ausdruck verweist hier auf den Gott Israels. Im Deutschen ist „Gott“ die natürliche Wiedergabe; „der Gott“ wäre ohne nähere Bestimmung unidiomatisch.
- source_word: מִן הַמַּחֲנֶה
  choice: aus dem Lager hinaus
  rationale: Die Formulierung gibt sowohl den Ausgangsort als auch die Bewegung aus dem Lager wieder und verbindet sich natürlich mit „brachte“.
- source_word: וַיִּתְיַצְּבוּ
  choice: sie stellten sich … auf
  rationale: Der Hitpael von יצב beschreibt ein bewusstes Einnehmen einer Position. „Sich aufstellen“ gibt dies genauer wieder als das schlichtere „stehen“.
- source_word: בְּתַחְתִּית
  choice: am Fuß
  rationale: Im Zusammenhang mit einem Berg bezeichnet das Wort dessen unteren Bereich oder Basis. „Am Fuß des Berges“ ist die natürliche deutsche Ortsangabe und vermeidet die missverständliche Vorstellung, das Volk habe sich unter dem Berg befunden.
- source_word: הָהָר
  choice: des Berges
  rationale: Im Sinaikontext bezeichnet הַר den bestimmten, bereits bekannten Berg; die deutsche Form wahrt diese Bestimmtheit.
theological_decisions:
- issue: Wiedergabe von הָאֱלֹהִים in der Gotteserscheinung am Sinai
  choice: Gott
  alternative: der Gott
  rationale: „Gott“ entspricht dem bestimmten Referenten im Kontext und ist zugleich natürliches modernes Deutsch. Die Übersetzung legt keine weitergehende dogmatische Deutung in den Ausdruck hinein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; „Gott entgegen“ bewahrt die gerichtete Bewegung, und „stellten sich … auf“ gibt die bewusste Positionierung wieder.
