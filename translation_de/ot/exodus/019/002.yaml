source:
  edition: WLC
  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: de
  text: Sie brachen von Refidim auf und kamen in die Wüste Sinai. Sie schlugen ihr Lager in der Wüste auf. Dort lagerte Israel vor dem Berg.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dem Berg gegenüber. Die hebräische Präposition kann eine Lage vor oder gegenüber von etwas bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Sie brachen auf
  rationale: נסע bezeichnet in Reiseberichten häufig das Abbrechen des Lagers und den anschließenden Aufbruch. „aufbrechen“ gibt diese Bewegung in natürlichem modernem Deutsch wieder.
- source_word: מֵרְפִידִים
  choice: von Refidim
  rationale: Der Ortsname wird nach gängiger deutscher Schreibweise transliteriert; die Präposition מֵ wird mit „von“ wiedergegeben.
- source_word: וַיָּבֹאוּ
  choice: und kamen
  rationale: בוא kann „kommen“, „eintreten“ oder „ankommen“ bedeuten. Zusammen mit der Zielangabe ist „kamen“ eine schlichte, genaue Wiedergabe.
- source_word: מִדְבַּר סִינַי
  choice: in die Wüste Sinai
  rationale: מִדְבָּר bezeichnet unbesiedeltes Wüsten- oder Steppenland. „Wüste Sinai“ ist im Deutschen die geläufige und kontextgerechte Form der Konstruktverbindung.
- source_word: וַיַּחֲנוּ
  choice: Sie schlugen ihr Lager auf
  rationale: חנה bedeutet „lagern“ oder „sein Lager aufschlagen“. Die gewählte Form ist natürlich und verdeutlicht den Beginn des Lagerns.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: Die Wiederholung von מִדְבָּר im Hebräischen wird auch im Deutschen beibehalten.
- source_word: וַיִּחַן שָׁם יִשְׂרָאֵל
  choice: Dort lagerte Israel
  rationale: Der Singular des Verbs behandelt Israel als kollektive Einheit. Die Voranstellung von „Dort“ bewahrt die örtliche Hervorhebung von שָׁם.
- source_word: נֶגֶד הָהָר
  choice: vor dem Berg
  rationale: נֶגֶד bezeichnet eine Lage vor, gegenüber oder angesichts von etwas. „vor dem Berg“ wahrt die räumliche Aussage, ohne die genaue Ausrichtung stärker festzulegen als der hebräische Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Nennung der Wüste und der Wechsel vom pluralischen Volk zum kollektiven Singular „Israel“ bleiben erhalten.
