source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: de
  text: 'Und Mose stieg zu Gott hinauf. Da rief Jahwe ihm vom Berg aus zu: »So sollst du zum Haus Jakobs sagen und den Söhnen Israels[a] verkünden:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »den Kindern Israels« beziehungsweise »dem Volk Israel«. Im Hebräischen steht »Söhne Israels«, eine maskuline Kollektivbezeichnung.
    reason: Lexikalische Alternative und Erläuterung des kollektiven Sprachgebrauchs.
lexical_decisions:
- source_word: עָלָה
  choice: stieg … hinauf
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung. »stieg … hinauf« gibt den räumlichen Sinn im Deutschen natürlich wieder.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der Ausdruck mit Artikel bezeichnet hier Israels Gott; idiomatisches Deutsch verwendet dafür den Eigennamencharakter tragenden Ausdruck »Gott« statt »der Gott«.
- source_word: וַיִּקְרָא אֵלָיו
  choice: rief … ihm … zu
  rationale: קרא mit אֶל bezeichnet ein Rufen zu jemandem hin. »ihm … zu« bewahrt diese Richtung und klingt im Deutschen natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als »Jahwe« lässt den persönlichen Gottesnamen als Namen erkennen, statt ihn durch einen Titel zu ersetzen.
- source_word: מִן הָהָר
  choice: vom Berg aus
  rationale: הַר meint im Zusammenhang den Berg Sinai. »vom Berg aus« bildet sowohl den Ort als auch die Richtung des Rufens klar ab.
- source_word: לֵאמֹר
  choice: 'zu:'
  rationale: Der Infinitiv leitet direkte Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt diese Funktion, ohne ein schwerfälliges »indem er sagte« einzufügen.
- source_word: כֹּה תֹאמַר
  choice: So sollst du … sagen
  rationale: Die Formulierung bewahrt den formelhaften, verbindlichen Charakter der göttlichen Botschaft und bleibt zugleich gut verständlich.
- source_word: לְבֵית יַעֲקֹב
  choice: zum Haus Jakobs
  rationale: »Haus Jakobs« erhält die kollektive und bundestheologische Bezeichnung, während der deutsche Genitiv die Zugehörigkeit natürlich ausdrückt.
- source_word: וְתַגֵּיד
  choice: und … verkünden
  rationale: Der Hifil von נגד bedeutet, etwas bekannt zu machen oder mitzuteilen. »verkünden« passt zum feierlichen Auftrag und erhält die Parallelität zu »sagen«.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: den Söhnen Israels
  rationale: Die wörtliche Wiedergabe erhält die maskuline hebräische Kollektivform und die Parallele zum »Haus Jakobs«; eine Fußnote nennt geläufige inklusive Sinnwiedergaben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. »Jahwe« bewahrt den Charakter als persönlicher Bundesname, ohne einen Titel einzusetzen.
- issue: Maskuline Kollektivbezeichnung לִבְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Kinder Israels; das Volk Israel
  rationale: »Söhne Israels« bildet die Form des Hebräischen formal ab. Die Fußnote macht deutlich, dass die Wendung kollektiv gebraucht wird, ohne ihre genaue sprachliche Gestalt im Haupttext einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton für die göttliche Rede. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt; die Satzstellung bleibt klar und mündlich verständlich. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
