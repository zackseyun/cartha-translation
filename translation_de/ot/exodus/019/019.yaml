source:
  edition: WLC
  text: וַ/יְהִי֙ ק֣וֹל הַ/שּׁוֹפָ֔ר הוֹלֵ֖ךְ וְ/חָזֵ֣ק מְאֹ֑ד מֹשֶׁ֣ה יְדַבֵּ֔ר וְ/הָ/אֱלֹהִ֖ים יַעֲנֶ֥/נּוּ בְ/קֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/019.yaml
  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: de
  text: Und der Klang des Horns wurde immer stärker[a]. Mose redete, und Gott antwortete ihm mit einer Stimme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde immer lauter«. Wörtlich beschreibt das Hebräische den Klang des Horns als »gehend und sehr stark werdend«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »antwortete ihm im Donner« beziehungsweise »antwortete ihm hörbar«. Das Hebräische sagt: »mit einer Stimme« oder »mit einem Klang«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … wurde
  rationale: Die Erzählungsform leitet die weitere Entwicklung der Szene ein. Im Deutschen lässt sie sich natürlich zusammen mit der folgenden Verlaufsangabe wiedergeben.
- source_word: קוֹל הַשּׁוֹפָר
  choice: der Klang des Horns
  rationale: קוֹל bezeichnet hier beim שׁוֹפָר dessen Klang. „Horn“ gibt das als Blasinstrument verwendete Horn verständlich wieder, ohne das moderne Bild eines Blechblasinstruments nahezulegen.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: wurde immer stärker
  rationale: Die Verbindung beschreibt eine fortschreitende starke Zunahme. „Immer stärker“ bewahrt die allgemeinere Aussage des Hebräischen; „immer lauter“ wäre eine naheliegende, aber engere Deutung.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Mose redete
  rationale: Die Imperfektform schildert Moses’ Reden innerhalb der fortlaufenden Szene. Das deutsche Präteritum ist im Erzählzusammenhang natürlich, ohne eine nicht ausdrücklich markierte direkte Rede einzuführen.
- source_word: וְהָאֱלֹהִים
  choice: und Gott
  rationale: Der Ausdruck bezeichnet im Kontext eindeutig Gott; der hebräische Artikel wird im Deutschen bei „Gott“ idiomatisch nicht wiedergegeben.
- source_word: יַעֲנֶנּוּ
  choice: antwortete ihm
  rationale: Das Verb ענה mit Objektsuffix bedeutet „ihm antworten“. Das Präteritum entspricht dem deutschen Erzählstil und hält die Zuordnung zu Moses fest.
- source_word: בְקוֹל
  choice: mit einer Stimme
  rationale: Die Formulierung bewahrt die lexikalische Breite von קוֹל als „Stimme/Klang“, statt sie vorschnell als Donner oder lediglich als Hörbarkeit auszulegen.
theological_decisions:
- issue: Art von Gottes Antwort am Sinai
  choice: Gott antwortete ihm „mit einer Stimme“
  alternative: Gott antwortete ihm im Donner / hörbar / laut
  rationale: בְקוֹל nennt eine Stimme beziehungsweise einen Klang, legt hier aber nicht ausdrücklich fest, dass Donner gemeint ist. Die wörtlich nahe Formulierung lässt diese Spannung bestehen; mögliche Deutungen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt knapp und erzählerisch. „Horn“ vermeidet die mögliche moderne Fehlvorstellung bei „Trompete“ oder „Posaune“, während die Fußnoten echte lexikalische und theologische Mehrdeutigkeit offenhalten.
