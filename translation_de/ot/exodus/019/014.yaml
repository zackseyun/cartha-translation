source:
  edition: WLC
  text: וַ/יֵּ֧רֶד מֹשֶׁ֛ה מִן הָ/הָ֖ר אֶל הָ/עָ֑ם וַ/יְקַדֵּשׁ֙ אֶת הָ/עָ֔ם וַֽ/יְכַבְּס֖וּ שִׂמְלֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: de
  text: Da stieg Mose vom Berg zum Volk hinab und heiligte das Volk[a]; dann wuschen sie ihre Gewänder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weihte das Volk“ beziehungsweise „sonderte das Volk als heilig aus“. Gemeint ist die rituelle Vorbereitung auf die Begegnung mit Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: stieg … hinab
  rationale: ירד bezeichnet eine Abwärtsbewegung. „stieg … hinab“ ist im Deutschen natürlich und gibt Moses Bewegung vom Berg zum Volk präzise wieder.
- source_word: מִן הָהָר
  choice: vom Berg
  rationale: הַר bezeichnet hier im unmittelbaren Zusammenhang den Sinai; „Berg“ ist die klare und übliche Wiedergabe.
- source_word: אֶל הָעָם
  choice: zum Volk
  rationale: עָם bedeutet gewöhnlich „Volk“. Diese Wiedergabe vermeidet die enger bestimmte Vorstellung einer förmlichen Versammlung.
- source_word: וַיְקַדֵּשׁ
  choice: heiligte
  rationale: Die Piel-Form von קדשׁ bezeichnet hier die rituelle Vorbereitung beziehungsweise Aussonderung des Volkes für die Begegnung mit Gott. „heiligte“ bewahrt die zentrale Heiligkeitssprache des Hebräischen; die Fußnote erläutert die kontextuelle Bedeutung.
- source_word: הָעָם
  choice: das Volk
  rationale: Die Wiederholung des Substantivs wird entsprechend dem Hebräischen beibehalten und sorgt für Klarheit.
- source_word: וַיְכַבְּסוּ
  choice: wuschen
  rationale: כבס bezeichnet besonders das Waschen von Textilien. In Verbindung mit „Gewänder“ ist „wuschen“ eindeutig und idiomatisch.
- source_word: שִׂמְלֹתָם
  choice: ihre Gewänder
  rationale: שִׂמְלָה bezeichnet Kleidung beziehungsweise Gewänder. „Gewänder“ entspricht dem würdigen, rituellen Kontext, ohne veraltet zu wirken.
theological_decisions:
- issue: Wiedergabe der rituellen Heiligkeitssprache vor der Gotteserscheinung am Sinai
  choice: heiligte das Volk
  alternative: weihte das Volk; sonderte das Volk als heilig aus
  rationale: „heiligte“ bewahrt die direkte Verbindung zur hebräischen Wurzel קדשׁ und lässt offen, wie genau die rituelle Vorbereitung vollzogen wurde. Die Fußnote macht deutlich, dass hier Aussonderung und Vorbereitung für die Begegnung mit Gott gemeint sind, ohne eine spätere dogmatische Kategorie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am Hebräischen; „dann“ gibt den erzählerischen Fortgang natürlich wieder. Die Heiligkeitssprache wird im Haupttext bewahrt und in der Fußnote verständlich erläutert.
