  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: de
  text: 'Und Jahwe sagte zu ihm: „Geh hinunter und komm herauf, du und Aaron mit dir. Aber die Priester und das Volk dürfen nicht durchbrechen, um zu Jahwe heraufzukommen, sonst bricht er gegen sie los.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Die Priester und das Volk dürfen sich nicht gewaltsam einen Weg bahnen, um zu Jahwe heraufzukommen, sonst bricht er gegen sie hervor.“ Im Hebräischen wird sowohl ihr unerlaubtes Eindringen als auch Jahwes Gericht mit verwandter Bildsprache des Durchbrechens beschrieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erhalten bleibt und nicht durch einen Titel ersetzt wird.
- source_word: לֶךְ רֵד
  choice: Geh hinunter
  rationale: Die beiden Imperative bilden zusammen eine nachdrückliche Aufforderung zum Hinabsteigen; die deutsche Formulierung ist natürlich und bewahrt die Bewegungsrichtung.
- source_word: וְעָלִיתָ
  choice: Dann sollst du wieder heraufkommen
  rationale: Die Perfektform hat im Anschluss an die Imperative auffordernden beziehungsweise zukunftsbezogenen Sinn. „wieder“ verdeutlicht die durch den Kontext vorausgesetzte Rückkehr auf den Berg, ohne die Abfolge umzudeuten.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: du und Aaron mit dir
  rationale: Die ausdrückliche Nennung des Pronomens und die Begleitformel werden bewahrt; dadurch bleibt die Betonung auf Mose und Aarons Begleitung erhalten.
- source_word: הַכֹּהֲנִים וְהָעָם
  choice: die Priester und das Volk
  rationale: Dies entspricht den üblichen Bezeichnungen und wahrt die Unterscheidung zwischen den Priestern und dem übrigen Volk.
- source_word: אַל יֶהֶרְסוּ
  choice: dürfen nicht durchbrechen
  rationale: Das Verb bezeichnet hier das gewaltsame Überschreiten beziehungsweise Durchbrechen einer gesetzten Grenze. Die konkrete Bildsprache bleibt erhalten.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: um zu Jahwe heraufzukommen
  rationale: Die Formulierung bewahrt sowohl die aufwärtsgerichtete Bewegung als auch das gefährliche Nahen an Jahwes Gegenwart.
- source_word: פֶּן יִפְרָץ בָּם
  choice: sonst bricht er gegen sie los
  rationale: Das Verb zeichnet ein plötzliches, zerstörerisches Hervorbrechen göttlichen Gerichts. Die Wendung nimmt zugleich die Durchbruchssprache des vorangehenden Verbots auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname des hebräischen Textes wird sichtbar bewahrt, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt von יִפְרָץ
  choice: „er“ bezieht sich auf Jahwe
  alternative: 'unpersönliche Umschreibung: „sonst trifft sie ein vernichtender Ausbruch“'
  rationale: Das im unmittelbaren Zusammenhang genannte Jahwe ist das natürliche Subjekt des singularischen Verbs; die Übersetzung lässt die Schärfe des angekündigten göttlichen Gerichts stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Befehlssätze spiegeln die Dringlichkeit des Hebräischen. Die konkrete Durchbruchsmetaphorik wurde im Haupttext und in der Fußnote erhalten.
