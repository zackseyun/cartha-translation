  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: de
  text: 'Und er sagte zum Volk: »Haltet euch für drei Tage bereit. Nähert euch keiner Frau.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Nähert euch keiner Frau.« Im Zusammenhang ist dies eine verhüllende Aufforderung, während der Vorbereitungszeit auf Geschlechtsverkehr zu verzichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und er sagte
  rationale: Das narrative Wayyiqtol von אמר führt Moses Rede fort. „Und er sagte“ bewahrt den hebräischen Erzählfluss, ohne eine stärkere zeitliche Nuance einzutragen.
- source_word: הָעָם
  choice: zum Volk
  rationale: עַם bezeichnet hier die versammelten Israeliten als Gemeinschaft; „Volk“ ist im Deutschen die natürliche kollektive Bezeichnung.
- source_word: הֱיוּ נְכֹנִים
  choice: Haltet euch bereit
  rationale: Die Verbindung aus Imperativ von היה und נָכוֹן fordert zur Bereitschaft beziehungsweise Vorbereitung auf. „Haltet euch bereit“ ist natürlich und gibt den andauernden Vorbereitungszustand gut wieder.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: für drei Tage
  rationale: Die Präpositionalphrase bezeichnet am ehesten einen Zeitraum von drei Tagen. Die Formulierung bewahrt diese Lesart, ohne sie mit dem kontextuell möglichen Zielpunkt „für den dritten Tag“ gleichzusetzen.
- source_word: אַל תִּגְּשׁוּ
  choice: Nähert euch nicht
  rationale: אַל mit dem Verb bildet ein Verbot; נגשׁ bedeutet „sich nähern/herantreten“. In Verbindung mit dem Objekt wird dies im Deutschen idiomatisch als „Nähert euch keiner …“ formuliert.
- source_word: אֶל אִשָּׁה
  choice: keiner Frau
  rationale: Wörtlich steht „zu einer Frau“. Die deutsche Negativkonstruktion „keiner Frau“ erhält die verhüllende Ausdrucksweise, ohne den sexuellen Bezug im Haupttext ausdrücklich zu machen.
theological_decisions:
- issue: Ob das Verbot sexueller Beziehungen während der Vorbereitung ausdrücklich formuliert werden soll
  choice: 'Die hebräische Umschreibung im Haupttext bewahren: „Nähert euch keiner Frau.“'
  alternative: „Habt keinen Geschlechtsverkehr mit einer Frau“ oder „Nähert euch euren Frauen nicht“
  rationale: Der Ausgangstext verwendet eine verhüllende Wendung und kein ausdrückliches Verb für Geschlechtsverkehr. Die Übersetzung wahrt diese sprachliche Form; eine Fußnote erläutert den kontextuellen Sinn, ohne ihn als zusätzliche Explizitheit in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und knapp; die traditionelle Euphemie wird bewahrt und durch die Fußnote transparent erläutert.
