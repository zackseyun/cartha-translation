id: EXO.19.6
reference: Exodus 19:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: de
  text: Ihr aber sollt mir ein Königreich von Priestern[a] und ein heiliges Volk sein. Das sind die Worte, die du zu den Israeliten[b] sprechen sollst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein priesterliches Königreich“. Die hebräische Wortverbindung kann ein Königreich aus Priestern oder ein durch priesterlichen Charakter geprägtes Königreich bezeichnen. Vergleiche 1. Petrus 2,9 mit der verwandten Wendung „königliche Priesterschaft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Söhne Israels“. Die hebräische Wendung bezeichnet hier das Volk Israel insgesamt, nicht nur die Männer.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: sollt … sein
  rationale: Das Qal-Imperfekt bezeichnet hier im Rahmen der Bundeserklärung die künftige beziehungsweise bestimmte Stellung Israels; „sollt … sein“ bewahrt im Deutschen sowohl Zusage als auch Auftrag, ohne einseitig festzulegen.
- source_word: לִי
  choice: mir
  rationale: Das ל mit Suffix bezeichnet Zugehörigkeit und Ausrichtung auf Gott. Das deutsche „mir“ ist knapp, natürlich und wahrt diese Bundesbeziehung.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: ein Königreich von Priestern
  rationale: Die Status-constructus-Verbindung wird unmittelbar wiedergegeben und lässt offen, ob ein aus Priestern bestehendes oder priesterlich geprägtes Königreich gemeint ist.
- source_word: גּוֹי קָדוֹשׁ
  choice: ein heiliges Volk
  rationale: „Volk“ ist im Deutschen für eine gemeinschaftliche ethnisch-politische Größe natürlicher als „Nation“ und gibt גּוֹי in diesem Kontext angemessen wieder; „heilig“ bewahrt die theologische Bedeutung von Absonderung und Zugehörigkeit zu Gott.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Das sind die Worte
  rationale: דְּבָרִים bezeichnet hier die auszurichtenden Worte. „Das sind“ nimmt im Deutschen den vorangehenden Ausspruch natürlich zusammen.
- source_word: תְּדַבֵּר
  choice: sprechen sollst
  rationale: Das Piel-Imperfekt richtet eine verbindliche Weisung an Mose. Die deutsche Konstruktion mit „sollst“ ist würdig und idiomatisch.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: Die hebräische Wendung lautet wörtlich „Söhne Israels“, bezeichnet hier jedoch idiomatisch das ganze Volk Israel. „Israeliten“ gibt den gemeinten Referenten in modernem Standarddeutsch präzise wieder; die Form des hebräischen Ausdrucks wird in einer Fußnote transparent gemacht.
theological_decisions:
- issue: Bundesberufung Israels als מַמְלֶכֶת כֹּהֲנִים
  choice: ein Königreich von Priestern
  alternative: ein priesterliches Königreich
  rationale: Die Hauptfassung bewahrt die nominale Struktur und die echte Mehrdeutigkeit der hebräischen Verbindung, ohne die spätere Formulierung „königliche Priesterschaft“ aus 1. Petrus 2,9 in den Exodus-Text einzutragen.
- issue: Verhältnis von Zusage und Auftrag in תִּהְיוּ
  choice: sollt … sein
  alternative: werdet … sein
  rationale: Der Kontext der Bundeserklärung trägt sowohl bestimmende Zusage als auch Berufung in sich. „Sollt … sein“ hält diese Spannung im Deutschen eher offen als eine rein futurische oder rein imperative Wiedergabe.
- issue: Geschlechtlich markierte Bundesbezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels
  rationale: Der hebräische Ausdruck ist formal maskulin und filial, fungiert aber als feste Gesamtbezeichnung für das Volk. Die idiomatische Hauptfassung vermeidet im Deutschen das Missverständnis, nur männliche Israeliten seien angesprochen; die Fußnote dokumentiert die wörtliche Form.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Bundesrede wird mit „sollt … sein“ bewahrt; unnötig altertümliche Formen werden vermieden. Die Satzstellung setzt durch „Ihr aber“ einen natürlichen Nachdruck auf Israel.
