source:
  edition: WLC
  text: וְ/הָֽיְתָ֛ה צְעָקָ֥ה גְדֹלָ֖ה בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֤ר כָּמֹ֨/הוּ֙ לֹ֣א נִהְיָ֔תָה וְ/כָמֹ֖/הוּ לֹ֥א תֹסִֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/006.yaml
  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: de
  text: Dann wird sich im ganzen Land Ägypten ein großes Wehgeschrei erheben[a], wie es noch nie eines gegeben hat und auch nie wieder eines geben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein großes Klagegeschrei“ oder „ein großer Notschrei“. Das hebräische Wort bezeichnet einen lauten Schrei aus großer Not.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Dann wird sich … erheben
  rationale: Das Qal-Perfekt mit וְ hat in dieser prophetischen Ankündigung Zukunftsbezug. Zusammen mit צְעָקָה ist „sich erheben“ im Deutschen eine natürliche Ereignisformulierung.
- source_word: צְעָקָה
  choice: Wehgeschrei
  rationale: Das Substantiv bezeichnet hier einen lauten Schrei aus großer Not. „Wehgeschrei“ gibt angesichts des bevorstehenden Todes die emotionale Färbung wieder, ohne den Ausdruck auf bloße Lautstärke zu reduzieren.
- source_word: גְדֹלָה
  choice: großes
  rationale: „Groß“ bewahrt die allgemeine Intensivierung des hebräischen Adjektivs und legt sie nicht ausschließlich als „laut“ aus.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: im ganzen Land Ägypten
  rationale: Die Formulierung gibt die umfassende räumliche Ausdehnung idiomatisch und vollständig wieder.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: wie es noch nie eines gegeben hat
  rationale: Die Vergleichskonstruktion besagt, dass ein solches Wehgeschrei bislang nie eingetreten ist. „Gegeben hat“ bleibt nahe am Verb היה und klingt im Deutschen natürlich.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: und auch nie wieder eines geben wird
  rationale: יסף mit Negation drückt hier aus, dass etwas Vergleichbares künftig nicht erneut eintreten wird; „nie wieder“ vermittelt den absoluten zeitlichen Vergleich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wehgeschrei“ ist ausdrucksstark, aber allgemein verständlich; die Fußnote erhält die lexikalische Spannweite. Die Wiederholung „eines … eines“ wahrt den ausdrücklichen Vergleich des Hebräischen.
