id: EXO.11.4
reference: Exodus 11:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: de
  text: 'Da sagte Mose: „So spricht Jahwe: Etwa um Mitternacht[a] werde ich mitten durch Ägypten ziehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Um Mitternacht“. Das hebräische Präfix kann hier eine ungefähre Zeitangabe ausdrücken, daher „etwa um Mitternacht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw consecutivum führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: מֹשֶׁה
  choice: Mose
  rationale: Im Deutschen übliche Form des Personennamens.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste Botenformel; das deutsche Präsens ist in dieser direkten Verkündigungsformel idiomatisch, obwohl das hebräische Verb formal im Perfekt steht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Gegen Mitternacht
  rationale: Das vorangestellte כ kann eine ungefähre Zeitangabe bezeichnen. „Gegen Mitternacht“ ist im Deutschen natürlich und wahrt diese Annäherung.
- source_word: אֲנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Personalpronomen bleibt erhalten und trägt den Nachdruck der göttlichen Selbstaussage.
- source_word: יוֹצֵא
  choice: werde … ziehen
  rationale: Das Partizip kündigt hier eine unmittelbar bevorstehende Handlung an. „Werde … ziehen“ gibt diesen Zukunftsbezug natürlich wieder, ohne die Bewegung statisch zu formulieren.
- source_word: בְּתוֹךְ מִצְרָיִם
  choice: mitten durch Ägypten
  rationale: Gibt Bewegung innerhalb beziehungsweise durch das Land in verständlichem Deutsch wieder. Die Wendung vermeidet das missverständliche deutsche „aus Ägypten ausziehen“, das eine Bewegung aus dem Land heraus nahelegen könnte.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. „Jahwe“ bewahrt dessen Funktion als Eigenname und ersetzt ihn nicht durch einen Herrschaftstitel.
- issue: Zeitliche Nuance von כַּחֲצֹת הַלַּיְלָה
  choice: Gegen Mitternacht
  alternative: Um Mitternacht
  rationale: Das Präfix כ lässt eine ungefähre Zeitbestimmung zu. Diese Nuance wird im Haupttext bewahrt, während die punktuelle traditionelle Wiedergabe als Alternative vermerkt wird.
- issue: Bewegungsrichtung von יוֹצֵא בְּתוֹךְ מִצְרָיִם
  choice: werde ich mitten durch Ägypten ziehen
  alternative: werde ich inmitten Ägyptens ausgehen
  rationale: Die hebräische Formulierung verbindet eine Bewegungsangabe mit „inmitten Ägyptens“. Die gewählte deutsche Fassung wahrt die Bewegung und vermeidet zugleich den falschen Eindruck, Jahwe verlasse Ägypten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel bleibt knapp und formell; der Gottesname wird als „Jahwe“ wiedergegeben. Die Formulierung „mitten durch Ägypten ziehen“ ist bewusst idiomatisch und vermeidet die im Deutschen mögliche Fehlbedeutung von „ausziehen“.
