  source_fidelity: 'Der Entwurf gibt die hebräischen Aussagen vollständig und in ihrer Reihenfolge wieder: Jahwe verleiht dem Volk Gunst bei den Ägyptern; Mose ist in Ägypten sehr bedeutend, sowohl bei den Dienern des Pharaos als auch beim Volk. Die nicht ausdrücklich spezifizierte Referenz von הָעָם am Versende bleibt im Haupttext offen. Die Wiedergabe „sehr bedeutend“ vermittelt גָּדוֹל מְאֹד im gegebenen Kontext angemessen, ohne auf körperliche Größe zu deuten oder die Aussage unnötig einzuengen.'
