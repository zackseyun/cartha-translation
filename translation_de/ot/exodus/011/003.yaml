  terminology: „Jahwe“ entspricht der festgelegten Wiedergabe des Gottesnamens. „Diener des Pharaos“ wahrt den hebräischen Wortlaut; die Fußnote erläutert sachgerecht die mögliche höfisch-administrative Nuance. Die Fußnoten sind korrekt am jeweiligen Bezugsausdruck verankert und die Markierungen stimmen mit dem Text überein.
