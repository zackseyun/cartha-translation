reference: Exodus 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: de
  text: Und Jahwe verschaffte dem Volk Gunst bei den Ägyptern.[a] Auch war der Mann Mose[b] im Land Ägypten sehr bedeutend, sowohl in den Augen der Diener des Pharaos[c] als auch in den Augen des Volkes.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in den Augen der Ägypter«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Mann, Mose«; die ungewöhnliche Formulierung bewahrt die Hervorhebung des Hebräischen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »der Amtsträger des Pharaos«; das hebräische Wort bedeutet wörtlich »Diener«.'
    reason: lexical_alternative
  - marker: d
    text: Mit »dem Volk« ist hier wahrscheinlich die breitere Bevölkerung Ägyptens im Unterschied zu den Dienern des Pharaos gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיִּתֵּן ... חֵן
  choice: verschaffte ... Gunst
  rationale: Die Verbindung bezeichnet, dass Jahwe dem Volk günstige Aufnahme beziehungsweise Wohlwollen bei den Ägyptern zuteilwerden ließ. „Gunst verschaffen“ gibt den Sinn im Deutschen natürlich wieder, ohne חֵן unnötig theologisch aufzuladen.
- source_word: הָעָם
  choice: dem Volk
  rationale: Der hebräische Text sagt lediglich „das Volk“. Der Kontext weist auf Israel, doch die Übersetzung ergänzt die Bezeichnung „Israeliten“ nicht.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: bei den Ägyptern
  rationale: Die hebräische Wendung lautet wörtlich „in den Augen der Ägypter“ und bezeichnet hier deren wohlwollende Haltung. Nach „Gunst“ ist „bei den Ägyptern“ idiomatisches Deutsch; die wörtlichere Form bleibt in der Fußnote erhalten.
- source_word: גַּם
  choice: Auch
  rationale: Das Wort fügt die Aussage über Moses Stellung als weiteren Gesichtspunkt hinzu.
- source_word: הָאִישׁ מֹשֶׁה
  choice: der Mann Mose
  rationale: Die auffällige hebräische Formulierung mit אִישׁ vor dem Namen bleibt erhalten, obwohl sie im Deutschen markierter klingt als schlicht „Mose“.
- source_word: גָּדוֹל מְאֹד
  choice: sehr bedeutend
  rationale: „Sehr groß“ wäre zwar formnäher, könnte im Deutschen jedoch missverständlich auf Körpergröße bezogen werden. „Sehr bedeutend“ bewahrt den offenen Sinn von hoher Stellung und Größe, ohne ihn ausschließlich auf Beliebtheit zu verengen.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die volle Ortsangabe des Hebräischen wird bewahrt und nicht zu „in Ägypten“ verkürzt.
- source_word: בְּעֵינֵי עַבְדֵי פַרְעֹה
  choice: in den Augen der Diener des Pharaos
  rationale: Die bildhafte Wendung wird hier natürlich verständlich und zugleich formnah wiedergegeben. עֲבָדִים bedeutet wörtlich „Diener“, kann im höfischen Zusammenhang aber Amtsträger bezeichnen.
- source_word: וּבְעֵינֵי הָעָם
  choice: als auch in den Augen des Volkes
  rationale: Die Wiederholung der Perspektivformel bleibt erhalten. „Das Volk“ wird nicht ausdrücklich als ägyptische Bevölkerung präzisiert, da der hebräische Wortlaut dies offenlässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den traditionellen Ersatztitel „der HERR“ ersetzt.
- issue: Bezug von הָעָם am Versende
  choice: das Volk
  alternative: die ägyptische Bevölkerung
  rationale: Der Zusammenhang legt als Gegenüber zu den Dienern des Pharaos die breitere Bevölkerung Ägyptens nahe. Weil der hebräische Text jedoch nur „das Volk“ sagt, bleibt diese Zuordnung in einer Fußnote und wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Wendung „der Mann Mose“ wurde trotz ihrer Ungewöhnlichkeit beibehalten; ansonsten wurden hebräische Perspektividiome dort idiomatisch übertragen, wo eine wörtliche Wiedergabe den deutschen Satz unnötig schwerfällig gemacht hätte.
