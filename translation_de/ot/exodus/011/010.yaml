  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: de
  text: Und Mose und Aaron vollbrachten vor dem Pharao alle diese Zeichen[a]. Und Jahwe verhärtete das Herz des Pharaos[b], und er ließ die Söhne Israels[c] nicht aus seinem Land ziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle diese Wunderzeichen“. Das hebräische Wort kann machtvolle Zeichen oder Wunder bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Jahwe machte das Herz des Pharaos stark“ oder „fest“. Im Zusammenhang bezeichnet dies seinen gefestigten Widerstand.'
    reason: lexical_alternative
  - marker: c
    text: 'Gemeint sind die Israeliten, das Volk Israel. Wörtlich: „die Söhne Israels“; traditionell auch: „die Kinder Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Mose und Aaron
  rationale: Die im Deutschen üblichen Formen der beiden Eigennamen.
- source_word: עָשׂוּ
  choice: vollbrachten
  rationale: Das allgemeine Verb עשה bedeutet „tun/machen“; mit מֹפְתִים gibt „vollbrachten“ die Handlung im Deutschen natürlich wieder, ohne ihre Wunderwirkung zusätzlich auszudeuten.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: alle diese Zeichen
  rationale: מוֹפֵת kann ein machtvolles Zeichen oder Wunder bezeichnen. „Zeichen“ bewahrt hier die hinweisende und beglaubigende Funktion; „Wunderzeichen“ ist als Alternative in der Fußnote genannt.
- source_word: לִפְנֵי פַרְעֹה
  choice: vor dem Pharao
  rationale: Direkte und im Deutschen idiomatische Wiedergabe von לִפְנֵי im Sinn von „in der Gegenwart des Pharaos“.
- source_word: וַיְחַזֵּק
  choice: verhärtete
  rationale: חזק bezeichnet grundsätzlich ein Stark- oder Festmachen. In der wiederkehrenden Formel vom Herzen des Pharaos drückt „verhärtete“ verständlich dessen gefestigten Widerstand aus; die wörtlichere Bildsprache bleibt in der Fußnote sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift des göttlichen Eigennamens bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
- source_word: לֵב פַּרְעֹה
  choice: das Herz des Pharaos
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: שִׁלַּח
  choice: ließ … ziehen
  rationale: שלח bedeutet „senden, fortschicken, freilassen“. Im Exoduszusammenhang gibt „ziehen lassen“ die verweigerte Entlassung Israels idiomatisch wieder.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die konkrete Formulierung des Hebräischen. Da sie zugleich als Bezeichnung des gesamten Volkes dient, wird „die Israeliten“ als verständliche Alternative vermerkt.
- source_word: מֵאַרְצוֹ
  choice: aus seinem Land
  rationale: Gibt sowohl die Bewegung aus dem Herrschaftsgebiet als auch den maskulinen Rückbezug auf den Pharao knapp wieder.
theological_decisions:
- issue: Gottes Einwirken auf das Herz des Pharaos
  choice: Jahwe verhärtete das Herz des Pharaos
  alternative: Jahwe machte das Herz des Pharaos stark/fest
  rationale: Die Formulierung lässt die im Text bestehende Spannung zwischen Gottes Handeln und der Verantwortung des Pharaos stehen. „Verhärtete“ gibt die Wirkung im Erzählzusammenhang wieder; die lexikalisch wörtlichere Möglichkeit wird nicht verschwiegen.
- issue: Bezeichnung des Volkes mit בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / die Kinder Israels
  rationale: Die Übersetzung bewahrt die wörtliche Gestalt des Ausdrucks, während die Fußnote klarstellt, dass er hier kollektiv das Volk Israel bezeichnet.
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift wahrt den persönlichen Gottesnamen des Ausgangstextes und vermeidet eine stillschweigende Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzverbindung mit „und“ folgt dem schlichten hebräischen Erzählfluss. „Vollbrachten“ vermeidet die im Deutschen unnatürliche Verbindung „taten Zeichen“, während die übrigen Satzglieder eng an der hebräischen Form bleiben.
