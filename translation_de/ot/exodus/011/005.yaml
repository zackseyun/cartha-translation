base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: de
  text: Und jeder Erstgeborene im Land Ägypten wird sterben, vom Erstgeborenen des Pharaos, der auf seinem Thron sitzt, bis zum Erstgeborenen der Sklavin[a] hinter den Mühlsteinen und jeder Erstgeborene des Viehs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Magd“ beziehungsweise „Dienerin“. Das hebräische Wort bezeichnet eine Frau in unfreier, dienender Stellung; die Wendung „hinter den Mühlsteinen“ schildert die mit niedrigem Status verbundene Mahlarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: Und ... wird sterben
  rationale: Das Qal-Perfekt mit vorangestellter Konjunktion steht in einer prophetischen Ankündigung und bezeichnet hier das sicher bevorstehende Geschehen.
- source_word: כָּל בְּכוֹר
  choice: jeder Erstgeborene
  rationale: Die distributive Bedeutung von כָּל mit dem singularischen בְּכוֹר wird im Deutschen natürlich mit „jeder Erstgeborene“ wiedergegeben.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die Formulierung bewahrt den geografischen Ausdruck des Hebräischen und entspricht einem würdigen, geläufigen biblischen Register.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: vom Erstgeborenen ... bis zum Erstgeborenen
  rationale: Die Konstruktion bezeichnet die gesamte soziale Spannweite der Betroffenen und wird klar durch „von ... bis ...“ wiedergegeben.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: des Pharaos, der auf seinem Thron sitzt
  rationale: Der Relativsatz gibt die partizipiale Beschreibung natürlich wieder und hebt den königlichen Rang des Pharaos hervor.
- source_word: הַשִּׁפְחָה
  choice: der Sklavin
  rationale: Der Ausdruck bezeichnet eine Frau in unfreier, dienender Stellung. „Sklavin“ wahrt den deutlichen sozialen Gegensatz zum Pharao, ohne ihn abzuschwächen.
- source_word: אֲשֶׁר אַחַר הָרֵחָיִם
  choice: die hinter den Mühlsteinen arbeitet
  rationale: „Hinter den Mühlsteinen“ bewahrt das konkrete Bild; das ergänzte „arbeitet“ macht im Deutschen verständlich, dass die Frau dort Mahlarbeit verrichtet.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: und ebenso jeder Erstgeborene des Viehs
  rationale: בְּהֵמָה bezeichnet hier allgemein domestizierte Tiere. „Vieh“ ist dafür ein prägnanter deutscher Sammelbegriff; „ebenso“ verdeutlicht die Anfügung, ohne den Sinn zu verändern.
theological_decisions:
- issue: Wiedergabe der sozialen Stellung in שִׁפְחָה
  choice: Sklavin
  alternative: Magd / Dienerin
  rationale: Die Aussage spannt den Bogen vom höchsten Herrscher bis zu einer unfreien Arbeiterin. „Sklavin“ erhält diesen rhetorischen und sozialen Kontrast und vermeidet eine beschönigende Wiedergabe.
- issue: Geschlechtliche Bestimmung von בְּכוֹר
  choice: Erstgeborener
  alternative: erstgeborener Sohn
  rationale: Der hebräische Text sagt nicht ausdrücklich „Sohn“. Die allgemeinere Wiedergabe wahrt die Formulierung der Quelle und passt zugleich zur anschließenden Erwähnung der Erstgeburt beim Vieh.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bewahrt die feierliche Spannweite vom Pharaonenhof bis zur niedrig gestellten Zwangsarbeiterin. Das konkrete Bild der Mühlsteine bleibt erhalten; „arbeitet“ dient der natürlichen deutschen Verständlichkeit.
