id: EXO.11.9
reference: Exodus 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: de
  text: 'Und Jahwe sagte zu Mose: „Der Pharao wird nicht auf euch hören[a], damit meine Wunder[b] im Land Ägypten zahlreich werden.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht auf euch hören wollen“, „wird euch kein Gehör schenken“ oder „wird euch nicht beachten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meine Zeichen“. Das hebräische Wort kann Wunder, Zeichen oder Machterweise bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Manche Übersetzungen geben den Anfang mit „Jahwe hatte zu Mose gesagt“ wieder, um die Aussage in den vorausgehenden Erzählzusammenhang einzuordnen. Die hebräische Verbform ist jedoch die übliche erzählende Vergangenheitsform.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Die Wayyiqtol-Form ist die gewöhnliche erzählende Vergangenheitsform. Das Plusquamperfekt „hatte gesagt“ ist aus Kontextgründen möglich, wird von der Form selbst aber nicht verlangt.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: wird nicht auf euch hören
  rationale: שׁמע mit אֶל bezeichnet hier das Hören auf beziehungsweise Beachten einer Person. „Auf euch hören“ bewahrt die idiomatische Bedeutung, ohne sie auf „gehorchen“ zu verengen; „euch“ gibt den hebräischen Plural wieder und bezieht Mose und Aaron ein.
- source_word: לְמַעַן
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Zielaussage knapp und natürlich wieder.
- source_word: רְבוֹת
  choice: zahlreich werden
  rationale: Der Infinitiv von רבה bezeichnet hier die Vermehrung der folgenden Größe. „Zahlreich werden“ ist im Deutschen natürlicher als ein Passiv wie „vermehrt werden“ und lässt offen, wie dies bewirkt wird.
- source_word: מוֹפְתַי
  choice: meine Wunder
  rationale: מוֹפֵת kann Wunder, Zeichen oder Machterweis bezeichnen. „Wunder“ passt zum Zusammenhang der außergewöhnlichen Taten in Ägypten.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die Wiedergabe behält das ausdrücklich genannte אֶרֶץ bei und ist zugleich idiomatisches modernes Deutsch.
theological_decisions:
- issue: Göttlicher Zweck im Zusammenhang mit der Weigerung des Pharaos
  choice: Die Weigerung des Pharaos steht in einem mit „damit“ bezeichneten Zusammenhang mit dem Zweck, dass Jahwes Wunder in Ägypten zahlreich werden.
  alternative: „Sodass“ könnte die Aussage schwächer als bloße Folge wiedergeben.
  rationale: לְמַעַן bezeichnet hier am natürlichsten einen Zweck. Die Übersetzung bewahrt die Spannung zwischen der Weigerung des Pharaos und Gottes Absicht, ohne eine weitergehende Lehre über die Verhärtung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural „euch“ wird entsprechend dem hebräischen Text ausdrücklich bewahrt. Die Fußnoten halten sowohl die Bedeutungsbreite von שׁמע und מוֹפֵת als auch die mögliche kontextuelle Deutung der Verbzeit offen.
