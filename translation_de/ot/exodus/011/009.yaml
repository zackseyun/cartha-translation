  source_fidelity: 'Die Übersetzung gibt die hebräische Satzstruktur und die zentralen Bedeutungen zuverlässig wieder: Jahwe spricht zu Mose; der Pharao wird auf den im Hebräischen pluralischen Adressatenkreis nicht hören; dies steht unter einem mit לְמַעַן ausgedrückten Zweckzusammenhang; Jahwes מוֹפְתִים werden im Land Ägypten zahlreich. „Euch“ bewahrt den hebräischen Plural, ohne den erzählerischen Bezug auf Mose und Aaron zu verwischen.'
  naturalness: '„Und Jahwe sagte zu Mose: ‚Der Pharao wird nicht auf euch hören, damit meine Wunder im Land Ägypten zahlreich werden.‘“ ist modernes, würdiges und gut verständliches Standarddeutsch. „Zahlreich werden“ ist eine natürliche Wiedergabe der Vermehrung, ohne eine über den Text hinausgehende Aussage über das genaue Bewirken zu treffen.'
  terminology: „Jahwe“ ist eine konsistente Wiedergabe des Tetragramms. „Wunder“ ist für מוֹפְתַי im Exoduskontext treffend; die Fußnote bewahrt „Zeichen“ und „Machterweise“ als mögliche Nuancen. Die Wiedergabe von שׁמע mit „auf euch hören“ und die Zweckangabe „damit“ sind sachgerecht.
