  text: דַּבֶּר נָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/יִשְׁאֲל֞וּ אִ֣ישׁ מֵ/אֵ֣ת רֵעֵ֗/הוּ וְ/אִשָּׁה֙ מֵ/אֵ֣ת רְעוּתָ֔/הּ כְּלֵי כֶ֖סֶף וּ/כְלֵ֥י זָהָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: de
  text: Sprich doch vor dem Volk, und jeder Mann soll seinen Nachbarn und jede Frau ihre Nachbarin um Gegenstände aus Silber und Gegenstände aus Gold bitten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und jeder Mann soll sich von seinem Nachbarn und jede Frau von ihrer Nachbarin Gegenstände aus Silber und Gegenstände aus Gold leihen.“ Das hebräische Verb bedeutet „bitten“ oder „erbitten“ und besagt für sich genommen nicht, dass die Gegenstände zurückgegeben werden sollten.'
    reason: Lexikalische Alternative; bewahrt eine traditionelle Wiedergabe, ohne eine Rückgabepflicht dem hebräischen Wort zwingend zuzuschreiben.
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Rede nun
  rationale: Der Piël-Imperativ fordert zum Reden auf; נָא verleiht der Aufforderung Nachdruck oder Unmittelbarkeit. „Nun“ gibt dies wieder, ohne Gottes Anrede unnötig höflich klingen zu lassen.
- source_word: בְּאָזְנֵי הָעָם
  choice: vor den Ohren des Volkes
  rationale: Die bewusst bildhafte Wendung bewahrt das hebräische Ohren-Idiom und bedeutet, dass Mose für das Volk hörbar sprechen soll.
- source_word: וְיִשְׁאֲלוּ
  choice: soll … bitten
  rationale: Die Jussivform nach dem Imperativ hat auffordernden Charakter. שאל bedeutet hier „bitten“ oder „erbitten“ und bezeichnet nicht aus sich heraus ein Ausleihen mit Rückgabepflicht.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: jeder Mann … seinen Nachbarn
  rationale: אִישׁ ist distributiv und steht parallel zu „jede Frau“; רֵעַ bezeichnet einen Nächsten, Gefährten oder Nachbarn. Im Zusammenhang passt „Nachbar“ gut.
- source_word: וְאִשָּׁה מֵאֵת רְעוּתָהּ
  choice: jede Frau ihre Nachbarin
  rationale: Die feminine Parallelform wird ausdrücklich beibehalten. Die deutsche Akkusativkonstruktion mit „um etwas bitten“ gibt die Ausgangsbeziehung idiomatisch wieder.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: Gegenstände aus Silber und Gegenstände aus Gold
  rationale: כְּלִי ist ein weiter Begriff für Gerät, Gefäß oder Gegenstand. „Gegenstände“ vermeidet eine unbelegte Festlegung etwa auf Gefäße oder Schmuck; die Wiederholung bildet den hebräischen Parallelismus ab.
theological_decisions:
- issue: Bedeutung von שאל beim Empfang der Kostbarkeiten von den Ägyptern
  choice: bitten
  alternative: ausleihen
  rationale: Das hebräische Verb bezeichnet das Bitten oder Erbitten, ohne für sich genommen eine spätere Rückgabe auszudrücken. Die traditionelle Deutung als Ausleihen wird daher nicht in den Haupttext aufgenommen, aber wegen ihrer Auslegungsrelevanz in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „vor den Ohren des Volkes“ ist bewusst leicht quellensprachlich geprägt, bleibt aber verständlich. Die geschlechtlich parallele und distributive Formulierung des Hebräischen wird erhalten.
