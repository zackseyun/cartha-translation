revisions:
- from: Aber gegen keinen von den Israeliten wird auch nur ein Hund seine Zunge regen, weder gegen einen Menschen noch gegen ein Tier. Daran sollt ihr erkennen, dass Jahwe zwischen Ägypten und Israel einen Unterschied macht.
  to: Doch gegen keinen Israeliten wird auch nur ein Hund knurren, weder gegen Mensch noch Tier, damit ihr erkennt, dass Jahwe zwischen Ägypten und Israel unterscheidet.
  rationale: Die Haupttextformulierung „knurren“ gibt die kontextuelle Funktion der schwierigen Hunde-Redensart in natürlichem Deutsch wieder. Die Fußnote dokumentiert die wörtliche hebräische Bildsprache und kennzeichnet die idiomatische Deutung mit „vermutlich“, sodass die lexikalische Unsicherheit nicht verdeckt wird. Die übrigen Aussagen des Entwurfs bleiben inhaltlich erhalten.
