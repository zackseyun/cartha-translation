base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: de
  text: Doch gegen keinen Israeliten wird auch nur ein Hund knurren, weder gegen Mensch noch Tier, damit ihr erkennt, dass Jahwe zwischen Ägypten und Israel unterscheidet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Aber gegen keinen von den Israeliten
  rationale: Der Satz steht im Gegensatz zum angekündigten Unheil über Ägypten. Zusammen mit der Verneinung wird der umfassende Sinn im Deutschen natürlich durch „gegen keinen“ wiedergegeben; „Israeliten“ bezeichnet die בני ישראל idiomatisch und inklusiv.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: wird auch nur ein Hund seine Zunge regen
  rationale: Die seltene Wendung bezeichnet ein feindseliges Lautgeben oder Drohen eines Hundes. „Seine Zunge regen“ bewahrt das Bild des hebräischen Ausdrucks, ohne das im Deutschen unverständliche wörtliche „seine Zunge schärfen“ zu verwenden; „auch nur“ unterstreicht die völlige Ruhe.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: weder gegen einen Menschen noch gegen ein Tier
  rationale: Die Wendung gibt die vollständige Reichweite an. Die korrelative deutsche Form ist klarer als ein steifes „vom Menschen bis zum Vieh“ und bewahrt, dass weder Menschen noch Tiere bedroht werden.
- source_word: לְמַעַן תֵּדְעוּן
  choice: Daran sollt ihr erkennen
  rationale: Die Zweckangabe wird im heutigen Deutsch natürlich ausgedrückt. „Daran“ bezieht die Erkenntnis auf das soeben angekündigte Zeichen; „sollt“ bewahrt den finalen Sinn, ohne bloß eine Zukunftsaussage daraus zu machen.
- source_word: יַפְלֶה
  choice: einen Unterschied macht
  rationale: Der Hifil bezeichnet hier das unterscheidende Absondern beziehungsweise die unterschiedliche Behandlung Ägyptens und Israels, nicht primär ein Wunderwirken.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: zwischen Ägypten und Israel
  rationale: Die beiden kollektiven Landes- und Volksbezeichnungen werden entsprechend dem Hebräischen beibehalten und bilden den zentralen Kontrast des Verses.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Art der Unterscheidung zwischen Ägypten und Israel
  choice: einen Unterschied macht
  alternative: wunderbar handelt
  rationale: Im unmittelbaren Zusammenhang geht es um die unterschiedliche Behandlung und Bewahrung Israels gegenüber Ägypten. Die Übersetzung lässt offen, wie diese göttliche Unterscheidung theologisch systematisiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der schwer verständliche Hebraismus „die Zunge schärfen“ wird bildnah, aber verständlich als „die Zunge regen“ wiedergegeben. Keine Fußnote ist nötig, da die Formulierung im Haupttext sowohl das Hundebild als auch den Sinn völliger Sicherheit erkennen lässt.
