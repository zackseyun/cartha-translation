  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: de
  text: 'Dann sagte Yahweh zu Mose: „Noch eine Plage[a] werde ich über den Pharao und über Ägypten bringen. Danach wird er euch von hier fortschicken. Wenn er euch fortschickt, wird er euch ganz und gar von hier vertreiben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schlag“, „Heimsuchung“ oder „Leiden“. Das hebräische Wort kann einen Schlag, eine Plage oder ein Leiden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung ist nachdrücklich; wörtlich etwa: „vertreibend wird er euch vertreiben“. „Ganz und gar“ gibt die vollständige Vertreibung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Dann“ gibt diese zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עוֹד נֶגַע אֶחָד
  choice: noch eine Plage
  rationale: עוֹד bezeichnet hier einen zusätzlichen, noch bevorstehenden Schlag; „Plage“ entspricht dem Kontext der Gerichte über Ägypten.
- source_word: אָבִיא עַל־פַּרְעֹה וְעַל־מִצְרַיִם
  choice: werde ich über den Pharao und über Ägypten bringen
  rationale: Die Hifil-Form von בוא bedeutet „bringen“; die Wiederholung von „über“ bewahrt den Parallelismus und die Gerichtsaussage.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: wird er euch von hier fortschicken
  rationale: שׁלח kann „fortschicken“ oder „ziehen lassen“ bedeuten. „Fortschicken“ hält die Verbindung zur nachfolgenden, stärkeren Aussage des Vertreibens fest.
- source_word: כְּשַׁלְּחוֹ
  choice: Wenn er euch fortschickt
  rationale: Die Präposition כְּ hat hier zeitlichen Sinn; die Wiederaufnahme desselben Verbs spiegelt den hebräischen Zusammenhang.
- source_word: כָּלָה
  choice: ganz und gar
  rationale: Das adverbial gebrauchte Wort verstärkt die Vollständigkeit der Vertreibung. „Ganz und gar“ ist idiomatisch und lässt offen, ob vor allem die Endgültigkeit oder die Gesamtheit der Betroffenen betont wird.
- source_word: גָּרֵשׁ יְגָרֵשׁ
  choice: wird er euch … vertreiben
  rationale: Infinitivus absolutus und finite Verbform desselben Stammes verstärken die Aussage. Zusammen mit „ganz und gar“ wird der Nachdruck natürlich deutsch wiedergegeben.
- source_word: מִזֶּה
  choice: von hier
  rationale: Die deiktische Wendung verweist auf Ägypten beziehungsweise den gegenwärtigen Aufenthaltsort.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Yahweh“ bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Stärke der angekündigten Entlassung
  choice: fortschicken … ganz und gar vertreiben
  alternative: ziehen lassen … vollständig hinausjagen
  rationale: Der Text steigert sich von שׁלח zu dem emphatischen גָּרֵשׁ יְגָרֵשׁ. Die Übersetzung erhält den Unterschied zwischen Entlassung und nachdrücklicher Vertreibung, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe am hebräischen Aufbau; zugleich werden unnatürliche Hebraismen vermieden. Die Wiederholung von „fortschicken“ und die Steigerung zu „vertreiben“ sind bewusst erhalten.
