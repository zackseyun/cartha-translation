base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: de
  text: 'Dann werden alle diese deine Diener[a] zu mir herabkommen, sich vor mir niederwerfen und sagen: »Zieh aus, du und das ganze Volk, das dir folgt[b]!« Danach werde ich ausziehen.« Und er ging in glühendem Zorn vom Pharao fort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Beamten«. Das hebräische Wort kann in diesem höfischen Zusammenhang die königlichen Amtsträger bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das an deinen Füßen ist«; eine hebräische Wendung für Menschen, die jemanden begleiten oder ihm folgen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: werden … zu mir herabkommen
  rationale: Das Verb ירד bezeichnet ein Hinabgehen. »Zu mir herabkommen« bewahrt sowohl die räumliche Vorstellung als auch die Perspektive des Sprechers.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: עבד kann Diener, Sklave oder im höfischen Zusammenhang königlicher Amtsträger bedeuten. »Diener« lässt diese Bedeutungsbreite offen; die mögliche höfische Nuance wird in einer Fußnote genannt.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: sich vor mir niederwerfen
  rationale: Die Form von שׁחה bezeichnet eine tiefe Verbeugung oder Prostration. Die Wiedergabe beschreibt die körperliche Unterwerfung, ohne hier ausdrücklich eine gottesdienstliche Bedeutung einzutragen.
- source_word: צֵא אַתָּה
  choice: Zieh aus, du
  rationale: »Zieh aus« gibt den Imperativ von יצא wieder und greift zugleich das zentrale Auszugsmotiv auf. Das ausdrücklich gesetzte »du« bildet das betonte Pronomen אַתָּה ab.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: und das ganze Volk, das dir folgt
  rationale: Wörtlich steht hier »das an deinen Füßen ist«. »Das dir folgt« vermittelt die idiomatische Bedeutung im heutigen Deutsch; der Wortlaut des Bildes bleibt in der Fußnote sichtbar.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Danach werde ich ausziehen
  rationale: Die Wiedergabe bewahrt die zeitliche Abfolge und verwendet für יצא dasselbe deutsche Verb wie im vorausgehenden Befehl.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Und er ging … vom Pharao fort
  rationale: Der hebräische Erzähltext setzt mit einem nicht eigens benannten männlichen Subjekt fort, das aus dem Zusammenhang Mose ist. »Vom Pharao fortgehen« gibt מֵעִם natürlich wieder, ohne den Namen ergänzend als Subjekt einzusetzen.
- source_word: בָּחֳרִי אָף
  choice: in glühendem Zorn
  rationale: Die Wendung beschreibt die entflammte Hitze des Zorns. »Glühender Zorn« bewahrt dieses Bild und seine Intensität in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »ausziehen« bildet das hebräische יצא und das Auszugsmotiv ab; konkrete Bildsprache und lexikalische Mehrdeutigkeit werden soweit möglich im Text oder in den Fußnoten bewahrt.
