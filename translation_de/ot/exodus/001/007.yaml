base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: de
  text: Doch[a] die Israeliten waren fruchtbar, wimmelten[b], vermehrten sich und wurden überaus stark, und das Land füllte sich mit ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und die Israeliten“. Das hebräische Bindewort kann schlicht „und“ bedeuten; „doch“ hebt den Gegensatz zum vorherigen Vers hervor.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „breiteten sich in großer Fülle aus“. Das hebräische Verb zeichnet das Bild einer wimmelnden, überreichen Menge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Doch die Söhne Israels
  rationale: „Söhne Israels“ bewahrt die hebräische familiäre und nationale Bezeichnung. Das einleitende וּ kann schlicht „und“ heißen; „doch“ bringt hier den Gegensatz zum Tod der vorherigen Generation zum Ausdruck.
- source_word: פָּרוּ
  choice: waren fruchtbar
  rationale: Die Wendung gibt die Bedeutung von פרה wieder und bewahrt zugleich den möglichen Anklang an die Fruchtbarkeits- und Segenssprache der Genesis.
- source_word: וַיִּשְׁרְצוּ
  choice: wimmelten
  rationale: Das Verb שׁרץ bezeichnet ein massenhaftes Wimmeln oder Gewimmel. Die bewusst kräftige Bildsprache des Hebräischen bleibt erhalten.
- source_word: וַיִּרְבּוּ
  choice: vermehrten sich
  rationale: רבה bezeichnet hier das starke Anwachsen der Zahl und passt natürlich in die Abfolge der Vermehrungsaussagen.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: wurden außerordentlich stark
  rationale: עצם bezeichnet ein Stark- oder Mächtigwerden; das doppelte מְאֹד verstärkt die Aussage nachdrücklich. Der Kontext schließt zahlenmäßige Stärke ein, ohne die Bedeutung darauf zu beschränken.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: sodass das Land von ihnen erfüllt war
  rationale: Die passive Form mit „das Land“ als Subjekt wird gewahrt. „Sodass“ gibt den naheliegenden resultativen Zusammenhang idiomatisch wieder; „Land“ bezeichnet hier das bewohnte Gebiet, nicht die gesamte Erde.
theological_decisions:
- issue: Möglicher Anklang an die Schöpfungs- und Segenssprache der Genesis
  choice: Die Folge „waren fruchtbar … vermehrten sich“ bleibt erhalten, ohne den Anklang im Haupttext ausdrücklich zu erklären.
  alternative: Den Bezug auf den Schöpfungssegen durch deutende Zusätze ausdrücklich hervorheben.
  rationale: Die hebräische Wortwahl dürfte frühere Segensformulierungen anklingen lassen. Dieser Zusammenhang soll durch entsprechende Lexik erkennbar bleiben, ohne eine im Text nicht ausgesprochene theologische Erklärung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlich anschauliche Aussage „wimmelten“ wurde bewusst beibehalten, weil sie die markante Bildsprache des hebräischen Verbs wiedergibt. Die Satzstruktur bleibt nah am kumulativen Rhythmus des Ausgangstextes.
