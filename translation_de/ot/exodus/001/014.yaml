  text: וַ/יְמָרְר֨וּ אֶת חַיֵּי/הֶ֜ם בַּ/עֲבֹדָ֣ה קָשָׁ֗ה בְּ/חֹ֨מֶר֙ וּ/בִ/לְבֵנִ֔ים וּ/בְ/כָל עֲבֹדָ֖ה בַּ/שָּׂדֶ֑ה אֵ֚ת כָּל עֲבֹ֣דָתָ֔/ם אֲשֶׁר עָבְד֥וּ בָ/הֶ֖ם בְּ/פָֽרֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: de
  text: Sie machten ihnen das Leben bitter durch harte Arbeit mit Lehm und Ziegeln und durch jede Art von Feldarbeit – all die Arbeit, zu der sie sie mit Härte zwangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „rücksichtslos“. Das hebräische Wort bezeichnet eine harte, niederdrückende Behandlung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: Sie machten ihnen das Leben bitter
  rationale: Bewahrt das hebräische Bild des Bittermachens und gibt die Wendung mit חַיִּים im Deutschen idiomatisch wieder.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: durch harte Arbeit
  rationale: עֲבֹדָה bezeichnet Arbeit oder Dienst, קָשָׁה deren Härte; die Formulierung ist natürlich und erhält den bedrückenden Sinn.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: mit Lehm und Ziegeln
  rationale: חֹמֶר kann in diesem Baukontext Lehm beziehungsweise Mörtel bezeichnen; „Lehm“ passt sachlich zur Herstellung der ausdrücklich pluralischen „Ziegel“.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: und durch jede Art von Feldarbeit
  rationale: Gibt die umfassende Aussage von כָּל wieder und klingt im modernen Deutschen natürlicher als „jede Arbeit auf dem Feld“.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: all die Arbeit, zu der sie sie zwangen
  rationale: Die hebräische Wiederaufnahme ist schwerfällig und bezeichnet die Arbeit, welche die Ägypter den Israeliten abverlangten; die deutsche Fassung glättet die Syntax, ohne den Zwang abzuschwächen.
- source_word: בְּפָרֶךְ
  choice: mit Härte
  rationale: Die Wendung bezeichnet schonungslose, niederdrückende Strenge. „Mit Härte“ ist zurückhaltend und textnah; die stärkere mögliche Wiedergabe wird in der Fußnote genannt.
