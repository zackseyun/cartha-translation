source:
  edition: WLC
  text: וְ/כַ/אֲשֶׁר֙ יְעַנּ֣וּ אֹת֔/וֹ כֵּ֥ן יִרְבֶּ֖ה וְ/כֵ֣ן יִפְרֹ֑ץ וַ/יָּקֻ֕צוּ מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: de
  text: Aber je mehr man sie unterdrückte, desto zahlreicher wurden sie und desto mehr breiteten sie sich aus. Da graute es den Ägyptern vor den Israeliten[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: die Söhne Israels; auch: die Kinder Israels.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann sowohl angstvolles Grauen als auch Abscheu ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶׁר ... כֵּן ... וְכֵן
  choice: Aber je mehr ... desto ... desto
  rationale: Die deutsche Korrelativkonstruktion gibt die proportionale Steigerung wieder; „Aber“ markiert den Gegensatz zwischen Unterdrückung und Wachstum.
- source_word: יְעַנּוּ אֹתוֹ
  choice: man sie unterdrückte
  rationale: Das Piel von ענה bezeichnet hier bedrücken bzw. unterdrücken. Das singularische Objekt bezieht sich kollektiv auf Israel und wird im Deutschen natürlich pluralisch wiedergegeben; unpersönliches „man“ wahrt den im Vers nicht ausdrücklich genannten Täter.
- source_word: יִרְבֶּה
  choice: wurden sie zahlreicher
  rationale: רבה bezeichnet hier die zahlenmäßige Vermehrung des kollektiv verstandenen Israel.
- source_word: יִפְרֹץ
  choice: breiteten sie sich aus
  rationale: פרץ vermittelt in diesem Zusammenhang ein kraftvolles Anwachsen und Ausbreiten, ohne das Bild unnötig zu konkretisieren.
- source_word: וַיָּקֻצוּ
  choice: empfanden sie ... Grauen
  rationale: קוץ kann Abscheu wie auch angstvolles Grauen ausdrücken. „Grauen empfinden“ erhält diese Spannung besser als eine eindeutige Festlegung auf bloße Furcht oder Ekel.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Mit קוץ bezeichnet die Präposition den Gegenstand bzw. Anlass des Grauens.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: den Israeliten
  rationale: Die feste Volksbezeichnung wird im modernen Deutschen natürlich als „Israeliten“ wiedergegeben; die formnähere Alternative steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe von בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  alternative: die Söhne Israels / die Kinder Israels
  rationale: Hier fungiert die Wendung als Volksbezeichnung und umfasst das ganze Volk. „Israeliten“ ist im heutigen Deutsch klar und natürlich, ohne den Ausdruck auf männliche Nachkommen einzuengen.
- issue: Bedeutung von קוץ
  choice: Grauen empfinden
  alternative: sich ekeln vor / voller Furcht sein vor
  rationale: Das hebräische Verb lässt Abscheu und angstvolles Grauen anklingen. Die Übersetzung vermeidet eine unnötige dogmatische oder psychologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die je-desto-Konstruktion bildet die hebräische proportionale Aussage idiomatisch ab. Der Wechsel von unpersönlichem „man“ zu „sie“ lässt den im unmittelbaren Vers nicht ausdrücklich genannten Täter offen, während der Zusammenhang die Ägypter erkennen lässt.
