    rationale: „Es graute den Ägyptern vor den Israeliten“ ist im modernen Standarddeutsch natürlicher und bewahrt die offene, intensive Reaktion des hebräischen Verbs ohne sie auf bloße Angst oder bloßen Ekel festzulegen.
