lexical_decisions:
- source_word: וַיָּמָת
  choice: Dann starben
  rationale: Das Waw-Consecutiv führt die Erzählung mit einem vergangenen Ereignis weiter. Der deutsche Plural ist wegen des zusammengesetzten Subjekts natürlich und grammatisch erforderlich.
- source_word: יוֹסֵף
  choice: Josef
  rationale: Der Personenname folgt der etablierten deutschen Bibeltradition.
- source_word: וְכָל אֶחָיו
  choice: alle seine Brüder
  rationale: כֹּל ist hier kollektiv gebraucht; אֶחָיו bezeichnet im Erzählzusammenhang Josefs Brüder und nicht allgemein seine Geschwister.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: und jene ganze Generation
  rationale: Die Wiederholung von כֹּל wird durch „ganze“ ausdrücklich wiedergegeben; הַהוּא verweist auf die damalige Generation und wird würdevoll und natürlich mit „jene“ übersetzt.
