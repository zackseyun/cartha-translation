source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: de
  text: 'Da sagte der König von Ägypten zu den hebräischen Hebammen[a], von denen die eine Schifra und die andere Pua hieß:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Hebammen der Hebräerinnen“. Die hebräische Wendung kann entweder bedeuten, dass die Hebammen selbst Hebräerinnen waren, oder dass sie den hebräischen Frauen bei der Geburt halfen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw setzt die Handlung fort. „Da sagte“ gibt diese Abfolge in natürlichem, gehobenem Deutsch wieder.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Entspricht der hebräischen Status-constructus-Verbindung, ohne den hier nicht ausdrücklich stehenden Titel „Pharao“ einzuführen.
- source_word: לַמְיַלְּדֹת
  choice: zu den … Hebammen
  rationale: Die feminine Partizipialform von ילד bezeichnet Frauen, die bei Geburten helfen; „Hebammen“ ist die klare und übliche deutsche Entsprechung.
- source_word: הָעִבְרִיֹּת
  choice: hebräischen
  rationale: Die Form wird im Haupttext attributiv auf die Hebammen bezogen. Da sie auch als Bezeichnung der von ihnen betreuten Hebräerinnen verstanden werden kann, bleibt diese echte Mehrdeutigkeit in einer Fußnote erhalten.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: von denen die eine … und die andere … hieß
  rationale: Eine natürliche deutsche Wiedergabe, die die unterscheidende Zuordnung „die eine … die zweite/andere“ bewahrt.
- source_word: שִׁפְרָה
  choice: Schifra
  rationale: Gebräuchliche deutsche Transliteration des hebräischen Personennamens.
- source_word: פּוּעָה
  choice: Pua
  rationale: Direkte, im Deutschen geläufige Transliteration des hebräischen Personennamens.
