source:
  edition: WLC
  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל הַ/בָּאִ֖ים מִצְרָ֑יְמָ/ה אֵ֣ת יַעֲקֹ֔ב אִ֥ישׁ וּ/בֵית֖/וֹ בָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/001.yaml
  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: de
  text: 'Und dies sind die Namen der Söhne Israels, die mit Jakob nach Ägypten kamen: Jeder kam mit seinem Haushalt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Und dies sind
  rationale: Das einleitende וְ wird als „Und“ wiedergegeben und wahrt so die ausdrückliche Verbindung zur vorausgehenden Erzählung; „dies sind“ leitet zugleich natürlich die folgende Namensliste ein.
- source_word: שְׁמוֹת
  choice: Namen
  rationale: Die direkte Wiedergabe bewahrt zugleich den Bezug zum hebräischen Buchtitel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  rationale: Die Formulierung entspricht dem hebräischen Ausdruck präzise und passt zu den im Anschluss genannten männlichen Familienoberhäuptern.
- source_word: הַבָּאִים מִצְרָיְמָה
  choice: die … nach Ägypten kamen
  rationale: Das Partizip wird im historischen Zusammenhang als deutscher Relativsatz wiedergegeben; die Richtungsendung wird durch „nach“ ausgedrückt.
- source_word: אֵת יַעֲקֹב
  choice: mit Jakob
  rationale: אֵת bezeichnet hier Begleitung, nicht ein direktes Objekt.
- source_word: אִישׁ וּבֵיתוֹ
  choice: Jeder … mit seinem Haushalt
  rationale: אִישׁ hat hier verteilenden Sinn. „Haushalt“ umfasst die zum Haus gehörende familiäre Einheit, ohne sie auf das Gebäude zu reduzieren.
- source_word: בָּאוּ
  choice: kam
  rationale: Das abschließende Verb wird entgegen einer glättenden Auslassung ausdrücklich wiedergegeben. Der distributive Singular „Jeder kam“ bildet die hebräische Wiederaufnahme verständlich nach.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „kamen/kam“ bewahrt die Struktur und Betonung des Hebräischen, bleibt im Deutschen aber verständlich und natürlich.
