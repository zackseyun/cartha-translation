base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: de
  text: 'Die Hebammen sagten zum Pharao: „Denn die Hebräerinnen sind nicht wie die Ägypterinnen. Sie sind nämlich kräftig[a] und haben bereits geboren, bevor die Hebamme zu ihnen kommt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lebenskräftig“ bzw. „robust“. Das hebräische Wort kann Stärke und Schnelligkeit bei der Geburt hervorheben. Manche verstehen es wörtlicher im Sinn von „wie Tiere“, doch diese Deutung ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: sagten
  rationale: Das narrative Wayyiqtol von אמר leitet hier direkte Rede ein; „sagten“ ist im Deutschen natürlich und genau.
- source_word: הַמְיַלְּדֹת
  choice: die Hebammen
  rationale: Die substantivierte Partizipialform von ילד bezeichnet in diesem Zusammenhang Frauen, die bei Geburten helfen; „Hebammen“ ist die übliche moderne Bezeichnung.
- source_word: אֶל־פַּרְעֹה
  choice: zum Pharao
  rationale: אֶל bezeichnet hier den Adressaten der Rede; „zum Pharao“ ist idiomatisches Deutsch.
- source_word: כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: Die Hebräerinnen sind nicht wie die Ägypterinnen
  rationale: Der erste כִּי-Satz gibt die Erklärung der Hebammen wieder. Im Deutschen kann die direkte Antwort ohne ein vorangestelltes „weil“ natürlich als vollständiger Satz formuliert werden; der Vergleich bleibt erhalten.
- source_word: כִּי חָיוֹת הֵנָּה
  choice: Sie sind nämlich kräftig
  rationale: Das zweite כִּי begründet den Unterschied und wird idiomatisch mit „nämlich“ wiedergegeben. חָיוֹת beschreibt wahrscheinlich Lebenskraft, Robustheit oder Schnelligkeit bei der Geburt; „kräftig“ wahrt diesen Sinn, ohne die mögliche Bildsprache zu überdehnen.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: bevor die Hebamme zu ihnen kommt
  rationale: בטרם bezeichnet Vorzeitigkeit. Der Singular „die Hebamme“ ist generisch gebraucht und wird entsprechend beibehalten.
- source_word: וְיָלָדוּ
  choice: haben schon geboren
  rationale: Die Verbform bezeichnet den bereits abgeschlossenen Geburtsvorgang vor dem Eintreffen der Hebamme; „schon“ macht diese zeitliche Abfolge im Deutschen klar.
