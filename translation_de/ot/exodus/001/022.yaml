source:
  edition: WLC
  text: וַ/יְצַ֣ו פַּרְעֹ֔ה לְ/כָל עַמּ֖/וֹ לֵ/אמֹ֑ר כָּל הַ/בֵּ֣ן הַ/יִּלּ֗וֹד הַ/יְאֹ֨רָ/ה֙ תַּשְׁלִיכֻ֔/הוּ וְ/כָל הַ/בַּ֖ת תְּחַיּֽוּ/ן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: de
  text: 'Da befahl der Pharao seinem ganzen Volk: „Jeden Sohn, der geboren wird, sollt ihr in den Nil werfen, aber jede Tochter sollt ihr am Leben lassen.“[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Strom“. Im Buch Exodus bezeichnet das hebräische Wort gewöhnlich den Nil.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich beginnt der zweite Satzteil mit „und jede Tochter“; „aber“ verdeutlicht hier den Gegensatz.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: befahl
  rationale: צוה bezeichnet das Erteilen eines verbindlichen Befehls; „befahl“ ist im Kontext eines königlichen Erlasses natürlich und präzise.
- source_word: פַּרְעֹה
  choice: der Pharao
  rationale: Die im Deutschen übliche Wiedergabe des ägyptischen Herrschertitels; der bestimmte Artikel entspricht dem natürlichen deutschen Sprachgebrauch.
- source_word: לְכָל עַמּוֹ
  choice: seinem ganzen Volk
  rationale: עַם bedeutet gewöhnlich „Volk“. Die Formulierung bewahrt die umfassende Reichweite des Befehls, ohne das interpretierendere „Untertanen“ einzusetzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeintroduktor wird im natürlichen modernen Deutsch durch einen Doppelpunkt vor der direkten Rede ausgedrückt; ein zusätzliches „indem er sagte“ wäre unnötig schwerfällig.
- source_word: כָּל הַבֵּן
  choice: Jeden Sohn
  rationale: בֵּן bedeutet wörtlich „Sohn“ und bezeichnet hier männlichen Nachwuchs allgemein. „Sohn“ erhält die konkrete familiäre Ausdrucksweise und die Härte des Befehls.
- source_word: הַיִּלּוֹד
  choice: der geboren wird
  rationale: Die Form von ילד beschreibt den Geborenen beziehungsweise das zur Welt kommende Kind. Die passive deutsche Formulierung gibt dies klar wieder, ohne auf „neugeboren“ einzuengen.
- source_word: הַיְאֹרָה
  choice: in den Nil
  rationale: יְאֹר bezeichnet im Exoduskontext den Nil. Die konkrete Benennung ist für heutige Leser klarer als das formal nähere „in den Strom“.
- source_word: תַּשְׁלִיכֻהוּ
  choice: sollt ihr ... werfen
  rationale: Die Verbform richtet einen verbindlichen Befehl an eine Mehrzahl. „sollt ihr werfen“ vermittelt den Erlasscharakter in würdigem, natürlichem Deutsch; das männliche Objektsuffix ist durch „jeden Sohn“ aufgenommen.
- source_word: וְכָל הַבַּת
  choice: aber jede Tochter
  rationale: וְ bedeutet formal „und“, trägt hier jedoch im Gegenüber der beiden Anweisungen eine klare Kontrastfunktion. „aber“ macht diesen Zusammenhang idiomatisch sichtbar; die formale Möglichkeit wird in einer Fußnote bewahrt.
- source_word: תְּחַיּוּן
  choice: sollt ihr am Leben lassen
  rationale: Das Piel von חיה bedeutet hier „am Leben erhalten/leben lassen“. „am Leben lassen“ bildet den Gegensatz zum Tötungsbefehl klar und natürlich ab.
