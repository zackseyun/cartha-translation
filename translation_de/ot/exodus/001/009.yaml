  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: de
  text: 'Da sagte er zu seinem Volk: „Seht, das Volk der Söhne Israels ist zahlreicher und stärker als wir.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „das israelitische Volk“. Wörtlich steht im Hebräischen: „das Volk der Söhne Israels“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte er
  rationale: Die Wayyiqtol-Form führt die Erzählung weiter. „Da sagte er“ gibt den Fortgang in natürlichem modernem Deutsch wieder, ohne eine genauere zeitliche Beziehung festzulegen.
- source_word: אֶל עַמּוֹ
  choice: zu seinem Volk
  rationale: עַם bezeichnet hier das eigene Volk des Pharaos als politisches beziehungsweise ethnisches Kollektiv; „zu seinem Volk“ ist knapp und kontextgemäß.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel הִנֵּה hebt die folgende Feststellung hervor. „Seht“ bewahrt diesen auffordernden Charakter in würdigem, verständlichem Deutsch.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: das Volk der Söhne Israels
  rationale: Die Wiedergabe erhält die hebräische Konstruktverbindung und die familiär-ethnische Bezeichnung בְּנֵי יִשְׂרָאֵל, statt sie im Haupttext zu „Israeliten“ zu verkürzen.
- source_word: רַב
  choice: zahlreicher
  rationale: Im Zusammenhang beschreibt רַב die zahlenmäßige Größe Israels. Zusammen mit מִמֶּנּוּ hat das Adjektiv vergleichende Bedeutung.
- source_word: וְעָצוּם
  choice: und stärker
  rationale: עָצוּם bezeichnet Stärke beziehungsweise Macht. „Stärker“ führt die durch מִמֶּנּוּ markierte Gegenüberstellung natürlich fort.
- source_word: מִמֶּנּוּ
  choice: als wir
  rationale: Die Präposition מִן mit dem Suffix der ersten Person Plural markiert hier den Vergleich. „Als wir“ ist die natürliche deutsche Entsprechung.
