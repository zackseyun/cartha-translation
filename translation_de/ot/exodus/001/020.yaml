  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: de
  text: Da erwies Gott den Hebammen Gutes[a], und das Volk vermehrte sich und wurde sehr stark.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gott war gut zu den Hebammen; oder: Gott segnete die Hebammen.'
    reason: Lexikalische Alternativen für וַיֵּיטֶב; „segnete“ gibt den Sinn deutender wieder.
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: erwies … Gutes
  rationale: Der Hifil von יטב mit ל bezeichnet hier, dass jemandem Gutes getan wird. Die Formulierung gibt den wohltätigen Sinn wieder, ohne die Art der göttlichen Zuwendung näher zu bestimmen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Im Erzählzusammenhang bezeichnet אֱלֹהִים den Gott Israels; die singularische Wiedergabe entspricht Kontext und Verbform.
- source_word: לַמְיַלְּדֹת
  choice: den Hebammen
  rationale: Das vorangestellte ל kennzeichnet die Empfängerinnen der guten Zuwendung und wird im Deutschen idiomatisch durch den Dativ ausgedrückt.
- source_word: וַיִּרֶב
  choice: vermehrte sich
  rationale: רבה beschreibt hier das zahlenmäßige Anwachsen des Volkes; „vermehrte sich“ bewahrt diesen Sinn präzise und natürlich.
- source_word: הָעָם
  choice: das Volk
  rationale: Die schlichte Wiedergabe bewahrt die Formulierung des Hebräischen; aus dem Zusammenhang ist klar, welches Volk gemeint ist.
- source_word: וַיַּעַצְמוּ
  choice: wurde … stark
  rationale: עצם bezeichnet hier eine Zunahme an Stärke oder Macht. Der deutsche Singular richtet sich grammatisch nach „das Volk“, obwohl das hebräische Verb im Plural steht.
- source_word: מְאֹד
  choice: sehr
  rationale: מְאֹד verstärkt die Aussage; „sehr“ ist die natürliche moderne Entsprechung.
theological_decisions:
- issue: Ob Gottes Handeln ausdrücklich als Segnen bezeichnet werden soll
  choice: erwies Gott den Hebammen Gutes
  alternative: Gott segnete die Hebammen
  rationale: יטב spricht davon, Gutes zu tun oder sich gut zu erweisen, legt aber die konkrete Form der göttlichen Zuwendung nicht fest. Die neutralere Wiedergabe vermeidet eine interpretierende Präzisierung und lässt Vers 21 die Folge erläutern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erwies … Gutes“ ist leicht gehoben, aber allgemein verständlich und bildet die benefaktive Konstruktion des Hebräischen treffend ab.
