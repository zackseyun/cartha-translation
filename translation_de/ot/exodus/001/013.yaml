  text: And the Egyptians made the sons of Israel serve harshly[a][b].
translation:
  language: de
  text: Und die Ägypter zwangen die Söhne Israels[a] mit erbarmungsloser Härte zur Arbeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: die Israeliten, das ganze Volk Israel; traditionell: die Kinder Israels.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: mit schonungsloser Härte. Das hebräische Wort bezeichnet die niederdrückende Härte der Zwangsarbeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: zwangen … zu arbeiten
  rationale: 'Der Hifil von עבד ist hier kausativ: Die Ägypter veranlassten Israel unter Zwang zu dienen beziehungsweise zu arbeiten. Die Formulierung gibt diese Kausalität natürlich wieder, ohne den einzelnen Verbstamm isoliert mit dem weiter reichenden Begriff „versklaven“ gleichzusetzen.'
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Die Form kann das Land oder seine Bevölkerung bezeichnen; als handelndes Subjekt sind hier die Ägypter gemeint.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die Wiedergabe bewahrt die genealogische und gemeinschaftliche Gestalt der hebräischen Bezeichnung. Im Kontext bezeichnet sie das ganze Volk, nicht nur männliche Personen oder Minderjährige.
- source_word: בְּפָרֶךְ
  choice: unter erbarmungsloser Härte
  rationale: פָּרֶךְ bezeichnet rücksichtslose, niederdrückende Härte, besonders bei Zwangsarbeit. Die Formulierung bringt die Intensität des seltenen hebräischen Wortes in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Wiedergabe der korporativen Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten; die Kinder Israels
  rationale: „Söhne Israels“ erhält den genealogischen und korporativen Anklang des Bundesvolknamens. Eine Fußnote verdeutlicht, dass die gesamte Volksgemeinschaft gemeint ist, und verhindert ein rein männliches Missverständnis.
- issue: Stärke der Aussage über die ägyptische Herrschaft
  choice: zwangen … zu arbeiten
  alternative: versklavten; ließen … arbeiten
  rationale: Die gewählte Formulierung bewahrt die kausative Bedeutung des Verbs und macht den Zwang des Kontextes sichtbar, ohne die Klausel mit einem umfassenderen theologischen oder rechtlichen Begriff zu überfrachten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Söhne Israels“ wahrt bewusst die Form des hebräischen Volksnamens; „unter erbarmungsloser Härte zu arbeiten“ klingt natürlich und macht zugleich die durch בְּפָרֶךְ bezeichnete rücksichtslose Zwangsarbeit deutlich.
