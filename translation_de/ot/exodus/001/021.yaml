  text: וַ/יְהִ֕י כִּֽי יָֽרְא֥וּ הַֽ/מְיַלְּדֹ֖ת אֶת הָ/אֱלֹהִ֑ים וַ/יַּ֥עַשׂ לָ/הֶ֖ם בָּתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: de
  text: Und weil die Hebammen Gott fürchteten, schuf er ihnen Hausstände[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „machte er ihnen Häuser“. Das Hebräische kann hier die Begründung von Hausständen oder Familien meinen, nicht unbedingt die Errichtung von Gebäuden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Und weil
  rationale: Die Wendung leitet hier den Grund für das folgende göttliche Handeln ein. „Und weil“ gibt den Zusammenhang natürlich und knapp wieder.
- source_word: יָרְאוּ
  choice: fürchteten
  rationale: Das Verb bezeichnet gegenüber Gott sowohl Furcht als auch ehrfürchtige Achtung. „Fürchteten“ bewahrt die gewichtige biblische Ausdrucksweise und lässt diese Bedeutungsbreite bestehen.
- source_word: הַמְיַלְּדֹת
  choice: die Hebammen
  rationale: Die substantivierte Form mit Artikel verweist auf die bereits genannten Hebammen.
- source_word: הָאֱלֹהִים
  choice: Gott
  rationale: Der bestimmte hebräische Ausdruck bezeichnet hier den wahren Gott; im Deutschen ist „Gott“ die idiomatische Wiedergabe.
- source_word: וַיַּעַשׂ
  choice: gründete
  rationale: In Verbindung mit „Familien/Häuser“ kann עשה das Begründen oder Entstehenlassen von Hausständen bezeichnen. „Gründete“ vermittelt diesen Sinn im Deutschen natürlicher als das wörtliche „machte“.
- source_word: לָהֶם
  choice: ihnen
  rationale: Obwohl das hebräische Suffix formal maskulin plural ist, bezieht es sich im Kontext auf die Hebammen; das Deutsche „ihnen“ ist geschlechtsneutral.
- source_word: בָּתִּים
  choice: Familien
  rationale: Das wörtliche „Häuser“ kann metonymisch für Hausstände oder Familienlinien stehen. „Familien“ gibt den im Kontext wahrscheinlichen Sinn klar wieder; die konkrete Lesart bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Bedeutung von וַיַּעַשׂ לָהֶם בָּתִּים
  choice: Gott gründete den Hebammen Familien beziehungsweise gab ihnen eigene Familienlinien.
  alternative: Gott machte oder baute ihnen Häuser.
  rationale: „Haus“ kann im Hebräischen eine Familie, einen Hausstand oder eine Nachkommenschaft bezeichnen. Der Kontext legt eine göttliche Segnung der Hebammen nahe, doch die wörtlich-konkrete Deutung wird nicht ausgeschlossen und deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung „Gott fürchten“ bleibt wegen ihrer theologischen Bedeutungsbreite erhalten. „Gründete er ihnen Familien“ ist leicht gehoben, bewahrt aber die knappe Struktur und vermeidet eine übermäßig erklärende Paraphrase.
