source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: de
  text: Doch die Hebammen fürchteten Gott und taten nicht, was der König von Ägypten ihnen gesagt hatte, sondern ließen die Kinder am Leben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hielten die Kinder am Leben“.'
    reason: 'Lexikalische Alternative: Die Piel-Form von חיה kann sowohl das Am-Leben-Lassen als auch das aktive Am-Leben-Erhalten ausdrücken.'
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: fürchteten
  rationale: Das Verb ירא bezeichnet hier Furcht beziehungsweise ehrfürchtige Scheu vor Gott. „Gott fürchten“ bewahrt die geläufige biblische Ausdrucksweise, ohne sie auf bloßen Respekt abzuschwächen.
- source_word: הַמְיַלְּדֹת
  choice: die Hebammen
  rationale: Die substantivisch gebrauchte Partizipialform von ילד bezeichnet Frauen, die bei Geburten helfen; „Hebammen“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: אֶת־הָאֱלֹהִים
  choice: Gott
  rationale: Nach dem direkten Objektmarker bedeutet die Wortgruppe „Gott fürchten“. Der hebräische Artikel wird beim Eigennamengebrauch im Deutschen nicht wiedergegeben.
- source_word: וְלֹא עָשׂוּ
  choice: und taten nicht
  rationale: Die schlichte Verneinung von עשׂה wird eng am Hebräischen wiedergegeben und führt natürlich in den folgenden Inhaltssatz.
- source_word: כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: was ... ihnen befohlen hatte
  rationale: דבר bedeutet wörtlich „reden“, doch im Kontext des königlichen Tötungsbefehls gibt „befohlen hatte“ die pragmatische Kraft präzise und idiomatisch wieder.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: der König von Ägypten
  rationale: Dies ist die klare und übliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: וַתְּחַיֶּיןָ
  choice: ließen ... am Leben
  rationale: Die Piel-Form von חיה hat kausative beziehungsweise lebenserhaltende Bedeutung. „Am Leben lassen“ bildet den Gegensatz zum vorausgehenden Tötungsbefehl natürlich ab; die ebenfalls mögliche Nuance „am Leben erhalten“ wird in der Fußnote bewahrt.
- source_word: הַיְלָדִים
  choice: die Kinder
  rationale: יְלָדִים ist lexikalisch weiter als „Jungen“, auch wenn der Kontext männliche Neugeborene meint. „Kinder“ wahrt die Wortwahl des Verses; der Kontext bestimmt den Bezug.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים in der Wendung „Gott fürchten“
  choice: Gott
  alternative: der Gott
  rationale: Gemeint ist in der Erzählung der wahre Gott. Im modernen Deutschen steht „Gott“ in diesem Gebrauch ohne Artikel; dadurch wird keine zusätzliche konfessionelle Aussage eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Doch“ markiert den Gegensatz zum Befehl des Pharaos; „sondern“ stellt das tatsächliche Handeln der Hebammen klar gegenüber. Der Satz bleibt nah an der hebräischen Struktur, ohne im Deutschen steif zu wirken.
