base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: de
  text: 'Und er sagte: „Wenn ihr den Hebräerinnen bei der Geburt helft und auf den Gebärstuhl[a] schaut: Ist es ein Sohn, dann sollt ihr ihn töten; ist es aber eine Tochter, soll sie am Leben bleiben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf die beiden Steine“; wahrscheinlich ist ein Gebärstuhl oder Geburtssitz gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: wenn ihr … bei der Geburt helft
  rationale: Die Piel-Form von ילד bezeichnet hier die Hilfe bei der Entbindung. Die Formulierung ist im modernen Deutschen natürlich und gibt die Tätigkeit der Hebammen direkt wieder.
- source_word: הָעִבְרִיּוֹת
  choice: den Hebräerinnen
  rationale: Das feminine Pluralwort bezeichnet die hebräischen Frauen; der Dativ ergibt sich im Deutschen aus der Wendung „bei der Geburt helfen“.
- source_word: וּרְאִיתֶן עַל הָאָבְנָיִם
  choice: und auf den Gebärstuhl seht
  rationale: ראה wird unmittelbar mit „sehen“ wiedergegeben. אָבְנָיִם bedeutet wörtlich „die beiden Steine“, bezeichnet im Geburtskontext aber wahrscheinlich einen Gebärstuhl oder Geburtssitz.
- source_word: אִם בֵּן הוּא
  choice: Ist es ein Sohn
  rationale: „Sohn“ bewahrt die Entsprechung zu בן und den Gegensatz zur Tochter. Die deutsche Satzstellung formuliert die Bedingung klar und würdevoll.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: dann sollt ihr ihn töten
  rationale: Die Hifil-Form von מות bedeutet „zu Tode bringen/töten“. „Sollt ihr ihn töten“ gibt die verbindliche Anweisung direkt wieder, ohne ihren Inhalt abzuschwächen.
- source_word: וְאִם בַּת הִיא
  choice: ist es aber eine Tochter
  rationale: „Tochter“ erhält die lexikalische Paarung Sohn/Tochter; „aber“ bringt den Gegensatz im Deutschen natürlich zum Ausdruck.
- source_word: וָחָיָה
  choice: soll sie am Leben bleiben
  rationale: Die Form bedeutet hier, dass das Mädchen leben gelassen beziehungsweise verschont werden soll. „Am Leben bleiben“ gibt diesen kontextuellen Sinn natürlich wieder.
