  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satz bleibt als direkte Rede gestaltet. Kollektive hebräische Singularformen werden im Deutschen natürlich pluralisch wiedergegeben; echte lexikalische Mehrdeutigkeiten werden durch Fußnoten offengehalten.
