  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: de
  text: „Auf, lasst uns klug[a] mit ihnen verfahren[b], damit sie nicht zahlreicher werden. Wenn es zum Krieg kommt, könnten auch sie sich unseren Feinden anschließen, gegen uns kämpfen und aus dem Land hinaufziehen[c].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „listig“. Das hebräische Wort kann kluges oder geschicktes Handeln bezeichnen; hier hat es im Zusammenhang einen berechnenden, bedrohlichen Beiklang.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen „mit ihm“ beziehungsweise „ihm gegenüber“. Der Singular bezieht sich kollektiv auf Israel als Volk.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Land verlassen“. Wörtlich: „aus dem Land hinaufziehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Auf
  rationale: Die auffordernde Interjektion lädt zu sofortigem gemeinsamen Handeln ein. „Auf“ ist knapp, würdig und im Deutschen idiomatisch.
- source_word: נִתְחַכְּמָה
  choice: lasst uns klug … vorgehen
  rationale: Die Hitpael-Form von חכם bezeichnet hier ein überlegtes, strategisches Vorgehen. „Klug vorgehen“ wahrt die mögliche Bedeutung „weise handeln“, während der bedrohliche Zusammenhang eine listige oder berechnende Färbung erkennen lässt.
- source_word: לוֹ
  choice: gegen sie
  rationale: Das hebräische Pronomen steht im Singular und bezieht sich kollektiv auf Israel als Volk. Im natürlichen Deutschen wird der kollektive Bezug pluralisch wiedergegeben; „gegen“ entspricht dem feindseligen Vorgehen im Kontext.
- source_word: פֶּן יִרְבֶּה
  choice: damit sie nicht noch zahlreicher werden
  rationale: פֶּן leitet die befürchtete Entwicklung ein. Der hebräische Singular folgt dem kollektiven Bezug auf Israel; im Deutschen ist der Plural natürlich. „Noch zahlreicher werden“ gibt den Gedanken zunehmender Volksstärke verständlich wieder.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: Wenn es nämlich zum Krieg kommt
  rationale: Die Wendung beschreibt den möglichen Eintritt eines Krieges. Diese deutsche Formulierung ist natürlich und erhält den kontingenten Charakter.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: könnten auch sie sich unseren Feinden anschließen
  rationale: יסף mit עַל bezeichnet hier das Hinzukommen zu einer Partei. Der Modalverbgebrauch gibt die im Zusammenhang befürchtete Möglichkeit wieder; der Plural entspricht dem kollektiven Volk im Deutschen.
- source_word: וְנִלְחַם בָּנוּ
  choice: gegen uns kämpfen
  rationale: Die Formulierung gibt die feindliche Kampfhandlung und die adversative Kraft der Präposition בְּ klar und direkt wieder.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: und aus dem Land hinaufziehen
  rationale: „Hinaufziehen“ bewahrt die Richtungsbedeutung von עלה und damit das hebräische Bild. Die glattere Deutung „das Land verlassen“ wird in einer Fußnote genannt, ohne die mögliche Bildhaftigkeit im Haupttext aufzulösen.
