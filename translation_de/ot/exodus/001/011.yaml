  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: de
  text: Da setzten sie Fronaufseher über Israel, um es mit ihren Fronlasten zu bedrücken. So baute Israel[a] für den Pharao die Vorratsstädte[b] Pitom und Ramses[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische gebraucht hier Singularformen und stellt Israel damit als ein einziges Volk dar. Sinngemäß kann man auch übersetzen: „über sie … sie zu bedrücken … so bauten sie“.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: „Lagerstädte“ oder „Speicherstädte“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch näher: „Raamses“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: sie setzten
  rationale: Das Verb bezeichnet hier das Einsetzen beziehungsweise Bestellen von Amtsträgern; „setzten … über“ ist knapp, natürlich und sachlich passend.
- source_word: עָלָיו
  choice: über Israel
  rationale: Der maskuline Singular bezieht sich kollektiv auf Israel. Die ausdrückliche Wiederaufnahme des Namens bewahrt den kollektiven Bezug, ohne im Deutschen ein missverständliches Pronomen zu erzwingen.
- source_word: שָׂרֵי מִסִּים
  choice: Fronaufseher
  rationale: Die Wendung bezeichnet Verantwortliche für Frondienst beziehungsweise Zwangsarbeit. „Fronaufseher“ gibt Funktion und Unterdrückungscharakter prägnant wieder.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: um es … zu bedrücken
  rationale: Das Piel von ענה bedeutet hier bedrücken, demütigen oder schwer behandeln. „Bedrücken“ entspricht dem Zusammenhang, ohne die Aussage unnötig einzuengen.
- source_word: בְּסִבְלֹתָם
  choice: mit ihren Fronlasten
  rationale: סבלות kann Lasten wie auch belastende Arbeitsdienste bezeichnen. „Fronlasten“ hält beide Aspekte zusammen; das Possessivpronomen bewahrt die Form des Hebräischen.
- source_word: וַיִּבֶן
  choice: So baute Israel
  rationale: Das Verb steht im maskulinen Singular und behandelt Israel als kollektive Einheit. Die Nennung Israels macht diese hebräische Konstruktion in natürlichem Deutsch verständlich.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: Vorratsstädte
  rationale: Gemeint sind Städte als Lager- oder Versorgungszentren. „Vorratsstädte“ ist im modernen Deutschen verständlich und liegt nahe am hebräischen Ausdruck.
- source_word: לְפַרְעֹה
  choice: für den Pharao
  rationale: Im Deutschen steht bei dem Herrschertitel idiomatisch der bestimmte Artikel.
- source_word: פִּתֹם
  choice: Pitom
  rationale: Übliche deutsche Umschrift des Ortsnamens.
- source_word: רַעַמְסֵס
  choice: Ramses
  rationale: „Ramses“ ist die geläufige deutsche Form; eine engere Umschrift wird in der Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der kollektive Singular des Hebräischen wird durch die ausdrückliche Bezeichnung „Israel“ bewahrt; die mögliche pluralische Wiedergabe wird transparent in einer Fußnote genannt.
