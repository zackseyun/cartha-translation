  text: וַֽ/יְהִ֗י כָּל נֶ֛פֶשׁ יֹצְאֵ֥י יֶֽרֶךְ יַעֲקֹ֖ב שִׁבְעִ֣ים נָ֑פֶשׁ וְ/יוֹסֵ֖ף הָיָ֥ה בְ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/005.yaml
  text: And all the persons who came from Jacob’s loins were seventy persons[a], and Joseph was already in Egypt.
translation:
  language: de
  text: Alle Nachkommen Jakobs waren zusammen siebzig Personen[a], und Josef war bereits in Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alle Personen, die aus Jakobs Hüfte hervorgingen.“ Das ist eine hebräische Redewendung für seine leiblichen Nachkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל נֶפֶשׁ
  choice: Alle … zusammen waren … Personen
  rationale: Die hebräische Erzählformel wird in natürlichem modernem Deutsch durch eine finite Aussage wiedergegeben. נֶפֶשׁ bezeichnet hier beim Zählen einzelne Personen, nicht „Seelen“ im fachlich-anthropologischen Sinn.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: Nachkommen Jakobs
  rationale: Die wörtliche Wendung „die aus Jakobs Hüfte hervorgingen“ ist ein Abstammungsidiom. „Nachkommen Jakobs“ gibt ihre Bedeutung klar und würdig wieder; die konkrete Bildsprache wird in der Fußnote bewahrt.
- source_word: שִׁבְעִים נָפֶשׁ
  choice: siebzig Personen
  rationale: Der Kardinalwert und die Zählfunktion von נֶפֶשׁ werden direkt wiedergegeben.
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: Josef aber war bereits in Ägypten
  rationale: '„Aber“ markiert den sachlichen Kontrast: Josef gehörte zur genannten Familie, befand sich jedoch schon in Ägypten. „Bereits“ macht diese im Zusammenhang vorausgesetzte frühere Anwesenheit idiomatisch deutlich.'
theological_decisions:
- issue: Umfang der Zahl siebzig
  choice: Der Vers nennt siebzig Nachkommen Jakobs und stellt Josefs vorherige Anwesenheit anschließend gesondert fest.
  alternative: Josef ausdrücklich in die Zahl einrechnen oder von ihr ausschließen.
  rationale: Die hebräische Syntax nennt die Gesamtzahl und fügt dann eine eigene Aussage über Josef an. Die Übersetzung lässt die daraus entstehende rechnerische Frage offen, statt sie dogmatisch oder harmonisierend zu entscheiden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die semitische Körpermetapher wird zugunsten natürlicher Verständlichkeit im Haupttext aufgelöst und in der Fußnote transparent gemacht.
