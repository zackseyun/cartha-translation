base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: de
  text: 'Da ließ der König von Ägypten die Hebammen rufen und sagte zu ihnen: »Warum habt ihr das getan und die Kinder am Leben gelassen[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Jungen am Leben erhalten«. Das hebräische Verb kann hier bedeuten, jemanden leben zu lassen, lebendig zu erhalten oder am Leben zu bewahren; im Zusammenhang sind die männlichen Kinder gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לַמְיַלְּדֹת
  choice: ließ ... die Hebammen rufen
  rationale: קרא mit ל bei Personen bezeichnet hier das Herbeirufen oder Vorladen. Die kausative deutsche Wendung gibt natürlich wieder, dass der König sie zu sich kommen ließ.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: der König von Ägypten
  rationale: Die Constructusverbindung wird klar und formnah wiedergegeben.
- source_word: וַיֹּאמֶר לָהֶן
  choice: und sagte zu ihnen
  rationale: Die übliche Einleitung direkter Rede bewahrt den schlichten Sinn von אמר und den weiblichen Plural der Bezugsgruppe im Pronomen nicht eigens, da dieser im Deutschen nicht markiert wird.
- source_word: מַדּוּעַ עֲשִׂיתֶן הַדָּבָר הַזֶּה
  choice: Warum habt ihr das getan
  rationale: Die idiomatische deutsche Frage gibt das Fragewort, den femininen Plural der Verbform durch „ihr“ und die konkrete Handlung von הַדָּבָר הַזֶּה knapp wieder.
- source_word: וַתְּחַיֶּיןָ
  choice: am Leben gelassen
  rationale: Die Form von חיה kann hier bedeuten, Leben zu erhalten, lebendig zu bewahren oder leben zu lassen. „Am Leben gelassen“ ist im Vorwurf des Königs natürlich und bewahrt die wesentliche Bedeutungsbreite.
- source_word: הַיְלָדִים
  choice: die Kinder
  rationale: Das Substantiv bedeutet grundsätzlich „Kinder“. Der unmittelbare Kontext betrifft zwar die Jungen, doch die allgemeinere lexikalische Form des vorliegenden Verses bleibt im Haupttext erhalten.
