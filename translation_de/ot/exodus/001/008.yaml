base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: de
  text: Ein neuer[a] König trat die Herrschaft über Ägypten an, der Josef nicht kannte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein anderer König“. Das hebräische Adjektiv bedeutet wörtlich „neu“; manche verstehen es als Hinweis auf einen anderen Herrscher, eine andere Dynastie oder ein neues Regime.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Josef nicht anerkannte“. „Kennen“ kann hier bedeuten, dass der König Josef und dessen Bedeutung nicht anerkannte oder nicht berücksichtigte, nicht nur, dass ihm Informationen über ihn fehlten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: erhob sich
  rationale: Das Wayyiqtol von קום führt die Erzählung weiter. „Erhob sich“ bewahrt das hebräische Verbbild und kann im Deutschen den Aufstieg eines Herrschers bezeichnen, ohne einen im Ausgangstext nicht ausdrücklich vorhandenen Zeitmarker hinzuzufügen.
- source_word: מֶלֶךְ
  choice: König
  rationale: Das Substantiv bezeichnet hier eindeutig einen König; „Herrscher“ wäre allgemeiner.
- source_word: חָדָשׁ
  choice: neu
  rationale: Die Grundbedeutung des Adjektivs ist „neu“. Ob damit auch ein anderer Herrscher oder eine neue Dynastie gemeint ist, bleibt Auslegung und wird in der Fußnote offengehalten.
- source_word: עַל מִצְרָיִם
  choice: über Ägypten
  rationale: עַל bezeichnet bei einem König seine Herrschaft über ein Gebiet. „Über Ägypten“ bildet diese Beziehung genauer ab als „in Ägypten“.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: der ... nicht kannte
  rationale: ידע bedeutet gewöhnlich „kennen/wissen“. Bei einer Person ist „nicht kannte“ natürliches Deutsch und lässt offen, ob bloße Unkenntnis oder fehlende Anerkennung gemeint ist.
- source_word: יוֹסֵף
  choice: Josef
  rationale: „Josef“ ist die im modernen Standarddeutsch geläufige, direkt auf die hebräische Namensform zurückgehende Schreibweise.
theological_decisions:
- issue: Ob ein Dynastiewechsel oder bewusste Missachtung angedeutet werden soll
  choice: Die schlichte Formulierung „Ein neuer König ... der Josef nicht kannte“ bleibt im Haupttext erhalten.
  alternative: „Ein anderer König kam an die Macht“ beziehungsweise „der Josef nicht anerkannte“.
  rationale: Der hebräische Vers nennt einen neuen König und sagt, dass er Josef nicht kannte. Ein Dynastiewechsel oder eine absichtliche Missachtung ist möglich, wird aber nicht ausdrücklich festgestellt; deshalb bleibt diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt nah am Hebräischen, ohne unnatürlich zu wirken. Die Fußnotenmarker stehen jeweils unmittelbar nach der betreffenden Wendung.
