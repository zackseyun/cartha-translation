base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: de
  text: Da kam Jitro, Moses Schwiegervater, mit den Söhnen und der Frau[b] zu Mose in die Wüste, wo Mose am Berg Gottes[a] lagerte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bezeichnung „Berg Gottes“ wird mit Sinai beziehungsweise Horeb in Verbindung gebracht.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: „seinen Söhnen und seiner Frau“. Der Kontext legt nahe, dass Mose und seine Familie gemeint sind; die hebräischen Possessivsuffixe nennen den Bezug jedoch nicht ausdrücklich.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Da kam
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יִתְרוֹ
  choice: Jitro
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: חֹתֵן מֹשֶׁה
  choice: Moses Schwiegervater
  rationale: Die Status-constructus-Verbindung bezeichnet Jitros Verwandtschaftsverhältnis zu Mose; die deutsche Form ist knapp und eindeutig.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: mit dessen Söhnen und dessen Frau
  rationale: Die Konjunktionen bezeichnen hier die mitkommenden Personen. „Dessen“ macht im Deutschen den durch den Kontext gestützten Bezug auf Mose deutlich, ohne ihre Namen einzutragen.
- source_word: אֶל מֹשֶׁה אֶל הַמִּדְבָּר
  choice: zu Mose in die Wüste
  rationale: Das erste אֶל bezeichnet das Ziel bei Mose, das zweite den Zielraum der Reise. „In die Wüste“ bewahrt hier die Bewegungsrichtung.
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: wo dieser … sein Lager aufgeschlagen hatte
  rationale: Der Relativsatz beschreibt Moses Aufenthaltsort. „Dieser“ verhindert einen falschen Bezug auf Jitro; das Plusquamperfekt gibt den bereits bestehenden Lagerzustand idiomatisch wieder.
- source_word: הַר הָאֱלֹהִים
  choice: Berg Gottes
  rationale: Die hebräische Genitivverbindung bleibt als Bezeichnung erhalten, ohne Sinai oder Horeb in den Text einzutragen.
theological_decisions:
- issue: Bezug der Suffixe in „seine Söhne“ und „seine Frau“
  choice: Die Suffixe werden auf Mose bezogen und mit „dessen“ verdeutlicht.
  alternative: Die Suffixe könnten rein grammatisch auf den unmittelbar genannten Jitro bezogen werden.
  rationale: Der unmittelbare Zusammenhang in Exodus 18,2–4 nennt Zippora als Moses Frau und ihre beiden Söhne; Vers 5 nimmt diese Personen wieder auf. Das Deutsche benötigt zur Vermeidung eines Missverständnisses eine deutlichere Referenz als das Hebräische.
- issue: Identität des „Berges Gottes“
  choice: Die beschreibende Bezeichnung „Berg Gottes“ wird beibehalten.
  alternative: Sinai oder Horeb
  rationale: Der hebräische Vers nennt keinen Eigennamen. Eine Ersetzung würde eine kontextuelle Identifikation in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung folgt dem hebräischen Ablauf, bleibt aber durch „dessen“ und „dieser“ trotz der mehreren männlichen Bezugspersonen eindeutig.
