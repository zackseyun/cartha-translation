  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: de
  text: Sie sprachen dem Volk jederzeit Recht. Jede schwierige Sache brachten sie zu Mose[a], aber jede kleinere Sache entschieden sie selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jeden schwierigen Fall … jeden kleineren Fall“. Das Hebräische stellt in einem gerichtlichen Zusammenhang schwierige Sachen kleineren Sachen gegenüber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: So sprachen sie … Recht
  rationale: Das Qal von שׁפט bezeichnet hier die fortlaufende richterliche Tätigkeit. „Recht sprechen“ ist im Deutschen natürlich und wahrt den gerichtlichen Zusammenhang.
- source_word: אֶת הָעָם
  choice: dem Volk
  rationale: עַם bezeichnet hier die Gemeinschaft Israels. Die deutsche Wendung „jemandem Recht sprechen“ verlangt den Dativ.
- source_word: בְּכָל עֵת
  choice: jederzeit
  rationale: Die Wendung bezeichnet ihre beständige Verfügbarkeit für Rechtssachen; „jederzeit“ gibt dies knapp und idiomatisch wieder.
- source_word: אֶת הַדָּבָר הַקָּשֶׁה
  choice: jede schwierige Sache
  rationale: דָּבָר meint im gerichtlichen Zusammenhang eine Sache oder einen Fall. „Schwierige Sache“ erhält die allgemeine Ausdrucksweise und den Gegensatz zu kleineren Sachen.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: brachten sie zu Mose
  rationale: Die Form beschreibt das wiederholte Vorgehen innerhalb der eingerichteten Ordnung. Im narrativen Zusammenhang kann das deutsche Präteritum diesen gewohnheitsmäßigen Sinn tragen.
- source_word: וְכָל הַדָּבָר הַקָּטֹן
  choice: aber jede kleinere Sache
  rationale: קָטֹן steht im Gegensatz zu קָשֶׁה und bezeichnet weniger gewichtige oder einfachere Fälle. Der Komparativ „kleinere“ macht den relativen Gegensatz im Deutschen natürlich kenntlich, ohne ihn auf nur eine Deutung festzulegen.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: entschieden sie selbst
  rationale: Das selbstständige Pronomen הֵם ist betont. „Sie selbst“ erhält diese Hervorhebung; „entschieden“ passt idiomatisch zu den zuvor genannten Rechtssachen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz fasst die dauerhafte richterliche Tätigkeit zusammen; die folgenden Sätze beschreiben das wiederholte Verfahren. Die Formulierung bewahrt den lexikalischen Gegensatz zwischen „schwierig“ und „kleiner“, während die Fußnote die im Rechtszusammenhang naheliegende Wiedergabe mit „Fall“ nennt.
