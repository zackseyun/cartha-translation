  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: de
  text: Jetzt weiß ich, dass Jahwe größer ist als alle Götter; denn in der Sache, in der sie vermessen gegen sie vorgingen, erwies er sich ihnen überlegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Schlussklausel ist knapp und mehrdeutig; etwa: „Denn in der Sache, in der sie vermessen gegen sie handelten.“ Die Pronomenbezüge bleiben offen; gemeint sein kann besonders das vermessene Vorgehen der Ägypter gegen Israel. „Erwies er sich ihnen überlegen“ ist eine aus dem Zusammenhang erschlossene Ergänzung.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Jetzt weiß ich
  rationale: Das Qal-Perfekt bezeichnet hier den gegenwärtigen Erkenntnisstand, zu dem Jitro aufgrund der jüngsten Ereignisse gelangt ist. Die Formulierung ist natürlich und bewahrt sowohl den zeitlichen Akzent als auch das Ergebnis des Erkennens.
- source_word: גָדוֹל ... מִכָּל
  choice: größer ... als alle
  rationale: Die Verbindung mit מִן und כֹּל hat vergleichende Bedeutung; der deutsche Komparativ gibt sie klar wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָאֱלֹהִים
  choice: die Götter
  rationale: Der bestimmte Plural bezeichnet im Zusammenhang die Gottheiten, mit denen Jitro Jahwe vergleicht.
- source_word: בַדָּבָר אֲשֶׁר
  choice: gerade in dem, worin
  rationale: דָּבָר bezeichnet hier die Sache beziehungsweise den Bereich des Geschehens. „Gerade“ bringt den pointierten Gedanken zum Ausdruck, dass sich Jahwes Überlegenheit in ebendem Handeln zeigte, das von Vermessenheit geprägt war.
- source_word: זָדוּ
  choice: vermessen ... vorgingen
  rationale: Das Verb bezeichnet stolzes, anmaßendes oder vermessenes Handeln. „Vermessen vorgingen“ ist im Deutschen würdig und verständlich.
- source_word: עֲלֵיהֶם
  choice: gegen sie
  rationale: עַל bezeichnet hier am ehesten die feindliche Ausrichtung des vermessenen Handelns gegen die Israeliten; der Bezug bleibt durch das Pronomen so offen wie im Kontext möglich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Elliptische Schlussklausel כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם
  choice: Denn gerade in dem, worin sie vermessen gegen sie vorgingen, erwies er sich ihnen überlegen.
  alternative: Denn gerade in der Sache, in der sie vermessen gegen sie handelten.
  rationale: Die hebräische Klausel ist stark verkürzt und enthält kein ausdrückliches Verb für Jahwes Überlegenheit. Die gewählte Fassung ergänzt den aus „größer als alle Götter“ naheliegenden Sinn, kennzeichnet die Schwierigkeit jedoch in einer Fußnote und legt die Pronomenbezüge nicht namentlich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am hebräischen Gedankengang, während die elliptische Schlussklausel für gewöhnliche Leser behutsam verständlich gemacht wird.
