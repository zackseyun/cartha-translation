  text: עַתָּ֞ה שְׁמַ֤ע בְּ/קֹלִ/י֙ אִיעָ֣צְ/ךָ֔ וִ/יהִ֥י אֱלֹהִ֖ים עִמָּ֑/ךְ הֱיֵ֧ה אַתָּ֣ה לָ/עָ֗ם מ֚וּל הָֽ/אֱלֹהִ֔ים וְ/הֵבֵאתָ֥ אַתָּ֛ה אֶת הַ/דְּבָרִ֖ים אֶל הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: de
  text: 'Nun hör auf mich: Ich will dir raten, und Gott sei mit dir.[a] Tritt du für das Volk vor Gott ein[b] und bring du die Angelegenheiten[c] zu Gott.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Möge Gott mit dir sein.« Die hebräische Form drückt einen Wunsch oder Segen aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Vertrete du das Volk vor Gott.«'
    reason: alternative_reading
  - marker: c
    text: Mit den »Angelegenheiten« sind hier die Anliegen oder Streitfälle des Volkes gemeint, die zur Entscheidung vorgebracht werden.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Nun
  rationale: Kennzeichnet den Übergang zu Jitros konkretem Rat und klingt im heutigen Deutschen natürlich.
- source_word: שְׁמַע בְּקֹלִי
  choice: hör auf mich
  rationale: Die hebräische Wendung bedeutet wörtlich »höre auf meine Stimme«. Im Deutschen gibt »hör auf mich« den Sinn idiomatisch wieder, ohne ihn zu einem strikten Gehorsamsbefehl zu verschärfen.
- source_word: אִיעָצְךָ
  choice: Ich will dir raten
  rationale: Gibt das Verb יעץ klar, würdig und in modernem Deutsch wieder.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: und Gott sei mit dir
  rationale: Der deutsche Konjunktiv bewahrt den Wunsch- beziehungsweise Segenscharakter der hebräischen Jussivform.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Tritt du für das Volk vor Gott ein
  rationale: Gibt Moses repräsentative Aufgabe natürlich wieder. Das betonte אַתָּה wird durch »du« erhalten; »vor Gott« entspricht מוּל הָאֱלֹהִים.
- source_word: וְהֵבֵאתָ
  choice: bring du
  rationale: Der mit וְ verbundene Perfekt steht hier in einer Anweisungsfolge. Der deutsche Imperativ gibt diese Funktion natürlich wieder und bewahrt durch »du« die Hervorhebung des hebräischen אַתָּה.
- source_word: הַדְּבָרִים
  choice: die Angelegenheiten
  rationale: דבר ist weit gefasst; im Zusammenhang sind die zur Entscheidung vorgebrachten Anliegen oder Streitfälle gemeint. »Angelegenheiten« bewahrt diese Bedeutungsbreite.
- source_word: אֶל הָאֱלֹהִים
  choice: zu Gott
  rationale: Gibt die Zielrichtung der Präposition אֶל knapp und genau wieder.
theological_decisions:
- issue: Wiedergabe von אֱלֹהִים im Erzählzusammenhang
  choice: Gott
  alternative: der wahre Gott
  rationale: Obwohl אֱלֹהִים der Form nach ein Plural ist, bezeichnet es hier eindeutig den Gott Israels. »Gott« ist die sachgemäße und nicht unnötig erweiternde Wiedergabe.
- issue: Grad der Ausdeutung von Moses vermittelnder Rolle
  choice: Tritt du für das Volk vor Gott ein
  alternative: Sei du für das Volk vor Gott da
  rationale: Die gewählte Formulierung macht die im Kontext erkennbare repräsentative Funktion verständlich, ohne daraus ein weitergehendes theologisches Amtssystem abzuleiten. Die formalere Alternative bleibt in der Fußnote sichtbar.
- issue: Modalität von וִיהִי אֱלֹהִים עִמָּךְ
  choice: Gott sei mit dir
  alternative: Möge Gott mit dir sein
  rationale: Beide Fassungen drücken einen Wunsch oder Segen aus. »Gott sei mit dir« ist knapp, würdig und bewahrt die offene Spannung zwischen Wunsch und Segenswort.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau folgt der hebräischen Anweisungsfolge, vermeidet aber unnatürliche wörtliche Nachbildung. Die Wiederholung von »Gott« und die Hervorhebung »du« bleiben erhalten.
