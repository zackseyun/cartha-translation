base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: de
  text: Und schärfe ihnen die Ordnungen und Weisungen[a] ein und zeige ihnen den Weg, auf dem sie gehen sollen, und die Aufgabe, die sie erfüllen sollen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gesetze“. Das hebräische Wort torot kann sowohl rechtliche Bestimmungen als auch Weisungen im weiteren Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: Und schärfe ihnen … ein
  rationale: Der Hifil von זהר bezeichnet hier eindringliches Unterweisen beziehungsweise Ermahnen. „Einschärfen“ verbindet Belehrung mit Verbindlichkeit, ohne den Kontext auf eine Warnung vor Gefahr zu verengen.
- source_word: הַחֻקִּים
  choice: die Ordnungen
  rationale: חֻקִּים bezeichnet festgesetzte Vorschriften. „Ordnungen“ ist würdig und verständlich und wahrt die rechtliche Nuance.
- source_word: הַתּוֹרֹת
  choice: Weisungen
  rationale: Der Plural תּוֹרֹת kann Gesetze, Unterweisungen oder Lehrentscheidungen bezeichnen. „Weisungen“ erhält diese semantische Breite und passt zum rechtlichen Zusammenhang.
- source_word: וְהוֹדַעְתָּ
  choice: zeige ihnen
  rationale: Der Hifil von ידע bedeutet wörtlich „wissen lassen“. Im Deutschen gibt „zeige ihnen“ das Bekanntmachen eines einzuschlagenden Weges natürlich wieder.
- source_word: הַדֶּרֶךְ … יֵלְכוּ בָהּ
  choice: den Weg, auf dem sie gehen sollen
  rationale: Die hebräische Weg- und Gehmetapher für die Lebensführung bleibt vollständig erhalten; „sollen“ gibt den normativen Zusammenhang wieder.
- source_word: הַמַּעֲשֶׂה אֲשֶׁר יַעֲשׂוּן
  choice: die Taten, die sie tun sollen
  rationale: מַעֲשֶׂה bezeichnet das Getane beziehungsweise konkrete Handeln. „Taten“ bewahrt die Parallelität zwischen Lebensweg und praktischem Tun; „sollen“ drückt die geforderte Handlung aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die biblische Metapher vom Weg, auf dem Menschen gehen, wurde bewahrt. „Einschärfen“ trägt der feierlichen und verbindlichen Unterweisung im richterlich-administrativen Kontext Rechnung.
