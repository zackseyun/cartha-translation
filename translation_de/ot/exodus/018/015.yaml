base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/015.yaml
  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: de
  text: 'Mose sagte zu seinem Schwiegervater: „Weil das Volk zu mir kommt, um Gott zu suchen[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gott zu befragen“ oder „bei Gott eine Entscheidung zu suchen“. Die hebräische Wendung kann einschließen, dass man Gott um Weisung oder ein Urteil bittet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das Wayyiqtol von אמר führt Moses Antwort ein; „sagte“ ist die natürliche deutsche Erzählform.
- source_word: לְחֹתְנוֹ
  choice: zu seinem Schwiegervater
  rationale: חֹתֵן bezeichnet hier im Kontext Jitro als Moses Schwiegervater.
- source_word: כִּי
  choice: Weil
  rationale: Die Konjunktion leitet als Antwort auf Jitros Frage den Grund für Moses Tätigkeit ein.
- source_word: יָבֹא אֵלַי הָעָם
  choice: das Volk zu mir kommt
  rationale: בוא mit אֶל bezeichnet die Bewegung hin zu Mose; das Präsens gibt den wiederkehrenden Vorgang in seiner Erklärung natürlich wieder.
- source_word: לִדְרֹשׁ
  choice: um … zu suchen
  rationale: דרש kann in Verbindung mit Gott sowohl „suchen“ als auch „befragen“ bedeuten. „Gott suchen“ bewahrt im Haupttext die weitere Bedeutung des hebräischen Ausdrucks.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: Das ausdrückliche Objekt ist „Gott“; die Übersetzung ersetzt es nicht durch eine Deutung wie „Gottes Willen“ oder „einen göttlichen Rechtsspruch“.
theological_decisions:
- issue: Wiedergabe der Wendung לִדְרֹשׁ אֱלֹהִים
  choice: Gott zu suchen
  alternative: Gott zu befragen; bei Gott eine Entscheidung zu suchen
  rationale: Die hebräische Wendung kann allgemein das Suchen Gottes oder konkreter die Befragung Gottes um Weisung beziehungsweise Entscheidung bezeichnen. Der Haupttext bewahrt die weitere Formulierung; die kontextuell mögliche gerichtliche Nuance steht in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kausale Antwortform bleibt erhalten; die Mehrdeutigkeit des Idioms wird nicht im Haupttext auf eine ausschließlich gerichtliche Bedeutung verengt.
