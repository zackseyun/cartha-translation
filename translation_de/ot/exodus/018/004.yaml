id: EXO.18.4
reference: Exodus 18:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: de
  text: Und der andere hieß Elieser[a], denn der Gott meines Vaters war meine Hilfe und rettete mich vor dem Schwert des Pharaos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Elieser bedeutet: »Mein Gott ist Hilfe.«'
    reason: Das hebräische Wortspiel zwischen dem Namen אֱלִיעֶזֶר und der anschließenden Aussage »der Gott meines Vaters war meine Hilfe« ist in der deutschen Namensform nicht unmittelbar erkennbar.
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: Und der andere hieß
  rationale: Die idiomatische deutsche Form gibt die hebräische Namensformel natürlich wieder. הָאֶחָד bezeichnet nach der Nennung des ersten Sohnes im vorigen Vers hier den anderen.
- source_word: אֱלִיעֶזֶר
  choice: Eliëser
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben; seine Bedeutung »Mein Gott ist Hilfe« klingt in der anschließenden Begründung an.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die Namensgebung ein.
- source_word: אֱלֹהֵי אָבִי
  choice: der Gott meines Vaters
  rationale: Die Wiedergabe bleibt eng an der hebräischen Genitivverbindung und bewahrt deren persönliche und heilsgeschichtliche Aussage.
- source_word: בְּעֶזְרִי
  choice: war meine Hilfe
  rationale: Das Substantiv עֵזֶר mit Suffix bedeutet wörtlich »meine Hilfe«; »war« entspricht dem rückblickenden Zusammenhang.
- source_word: וַיַּצִּלֵנִי
  choice: und rettete mich
  rationale: נצל bezeichnet hier die Rettung aus tödlicher Gefahr; »rettete« ist klar, gegenwärtig und würdevoll.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: vor dem Schwert des Pharaos
  rationale: »Vor ... retten« ist im Deutschen idiomatisch. Das Schwert steht konkret oder metonymisch für die tödliche Gewalt des Pharaos.
theological_decisions:
- issue: Nicht ausdrücklich markierte Rede in der Namenserklärung
  choice: Kein »sagte er« ergänzen
  alternative: '»denn er sagte: Der Gott meines Vaters ...«'
  rationale: Im Hebräischen steht kein Redeverb. Die Ergänzung würde die Erklärung ausdrücklich Mose als direkte Rede zuweisen; der Ausgangstext lässt sie dagegen als unmarkierte Begründung der Namensgebung stehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung ist idiomatisch, bleibt aber in Satzbau und theologischer Aussage eng am Hebräischen.
