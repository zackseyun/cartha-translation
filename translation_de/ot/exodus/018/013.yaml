  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: de
  text: Am nächsten Tag setzte sich Mose, um dem Volk Recht zu sprechen. Das Volk stand vom Morgen bis zum Abend vor Mose.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um Mose herum«. Die hebräische Präposition kann räumlich wörtlicher verstanden werden; im Zusammenhang geht es vermutlich darum, dass das Volk vor ihm auf Rechtssprüche wartete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Am nächsten Tag
  rationale: Die hebräische Erzählungsformel führt das nächste Ereignis ein. Im modernen Deutschen gibt die knappe Zeitangabe den natürlichen Fortgang der Erzählung wieder, ohne eine schwerfällige Formel wie »Und es geschah« zu benötigen.
- source_word: וַיֵּשֶׁב מֹשֶׁה
  choice: setzte sich Mose
  rationale: ישׁב bezeichnet hier das Einnehmen einer sitzenden Haltung zur Ausübung der richterlichen Aufgabe. »Setzte sich« bewahrt das konkrete Bild und passt zum folgenden Zwecksatz.
- source_word: לִשְׁפֹּט אֶת־הָעָם
  choice: um dem Volk Recht zu sprechen
  rationale: שׁפט meint in diesem Zusammenhang das Entscheiden von Streitfällen. »Recht sprechen« ist im Deutschen idiomatischer als »das Volk richten« und bewahrt den gerichtlichen Sinn.
- source_word: וַיַּעֲמֹד הָעָם
  choice: Das Volk stand
  rationale: עמד bezeichnet wörtlich das Stehen; die Formulierung bewahrt die Körperhaltung der Wartenden.
- source_word: עַל מֹשֶׁה
  choice: vor Mose
  rationale: Die Präposition על kann örtlich wörtlicher verstanden werden, bezeichnet mit עמד hier aber wahrscheinlich die Stellung der Menschen, die bei Mose auf Entscheidungen warteten. »Vor Mose« gibt diesen Zusammenhang natürlich wieder.
- source_word: מִן־הַבֹּקֶר עַד־הָעָרֶב
  choice: vom Morgen bis zum Abend
  rationale: Die Wendung bezeichnet die gesamte Tagesdauer und wird im Deutschen direkt und idiomatisch wiedergegeben.
