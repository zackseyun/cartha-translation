id: EXO.18.9
reference: Exodus 18:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: de
  text: 'Jitro freute sich[a] über all das Gute, das Jahwe für Israel getan hatte: Er hatte es aus der Gewalt Ägyptens[b] gerettet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „war froh“. Das hebräische Verb kann Freude oder Frohsein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus der Hand Ägyptens“; gemeint ist die Macht oder Herrschaft Ägyptens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: freute sich
  rationale: Das seltene Verb bezeichnet hier Freude bzw. Frohsein. „Freute sich“ ist im modernen Deutsch natürlich und gibt die positive Reaktion Jitros klar wieder; „jubelte“ wäre stärker als der Kontext zwingend verlangt.
- source_word: יִתְרוֹ
  choice: Jitro
  rationale: Die im Deutschen etablierte biblische Namensform wird verwendet.
- source_word: עַל כָּל הַטּוֹבָה
  choice: über all das Gute
  rationale: עַל bezeichnet bei einem Gefühlsverb den Anlass der Freude. Der substantivierte Singular הַטּוֹבָה wird als kollektives „all das Gute“ wiedergegeben.
- source_word: אֲשֶׁר עָשָׂה
  choice: das … getan hatte
  rationale: Der Relativsatz wird erhalten; das Plusquamperfekt macht deutlich, dass Jahwes Handeln Jitros Freude vorausging.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben; „Jahwe“ ist die übliche deutsche Transkription.
- source_word: לְיִשְׂרָאֵל
  choice: für Israel
  rationale: Die Präposition ל bezeichnet hier den Begünstigten von Jahwes Handeln.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: Er hatte es … gerettet
  rationale: Das Suffix der 3. Person maskulin Singular bezieht sich am natürlichsten auf Israel als kollektive Einheit. Ein selbstständiger Erklärungssatz vermeidet im Deutschen eine schwerfällige Folge zweier Relativsätze, ohne den Bezug zu verändern.
- source_word: מִיַּד מִצְרָיִם
  choice: aus der Gewalt Ägyptens
  rationale: Die hebräische Wendung „aus der Hand“ bezeichnet die Macht oder Herrschaft Ägyptens. „Aus der Gewalt Ägyptens“ gibt den idiomatischen Sinn in natürlichem Deutsch wieder; die Bildsprache wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des singularischen Pronomens in הִצִּילוֹ
  choice: Israel als kollektive Einheit („es“)
  alternative: 'kausale Wiedergabe: „weil er Israel gerettet hatte“'
  rationale: Das maskuline Singularsuffix kann auf Israel als Kollektiv zurückweisen. Die gewählte Fassung bewahrt diesen Bezug, ohne das Verhältnis des zweiten אֲשֶׁר ausdrücklich kausal festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt löst die im Deutschen schwerfällige Relativsatzfolge auf und lässt den zweiten Satz das zuvor genannte Gute erläutern. Die Metapher „Hand Ägyptens“ wird im Haupttext idiomatisch als „Gewalt Ägyptens“ und in der Fußnote wörtlich wiedergegeben.
