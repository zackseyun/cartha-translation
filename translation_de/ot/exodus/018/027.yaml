  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: de
  text: Dann entließ Mose seinen Schwiegervater[a], und dieser ging in sein Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann ließ Mose seinen Schwiegervater ziehen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: entließ
  rationale: Das Piel von שׁלח mit einer Person als Objekt bezeichnet hier, jemanden zu entlassen beziehungsweise ziehen zu lassen. „Entließ“ gibt den formellen Abschied knapp und natürlich wieder.
- source_word: חֹתְנוֹ
  choice: seinen Schwiegervater
  rationale: חֹתֵן bezeichnet in diesem Zusammenhang Jitro, den Vater von Moses Frau; daher ist „Schwiegervater“ die klare kontextuelle Wiedergabe.
- source_word: וַיֵּלֶךְ לוֹ
  choice: und dieser kehrte … zurück
  rationale: Die Wendung berichtet idiomatisch von Jitros Weggang. Im Zusammenhang mit dem Ziel „sein Land“ drückt „kehrte zurück“ den natürlichen deutschen Sinn aus; „dieser“ verdeutlicht ohne inhaltlichen Zusatz den Subjektwechsel zu Jitro.
- source_word: אֶל אַרְצוֹ
  choice: in sein Land
  rationale: אֶרֶץ bedeutet hier das Herkunftsland beziehungsweise Heimatgebiet. „Sein Land“ bewahrt die schlichte Ausdrucksweise und vermeidet die moderne politische Färbung von „Staat“.
