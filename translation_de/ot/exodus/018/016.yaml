  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: de
  text: Wenn sie einen Streitfall[a] haben, kommt er zu mir. Dann entscheide ich zwischen einem Mann und seinem Nächsten[b] und mache die Satzungen Gottes und seine Gesetze[c] bekannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: eine Angelegenheit; auch: eine Rechtssache.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zwischen einem Mann und seinem Nächsten“; die Einzahl ist repräsentativ gebraucht.'
    reason: cultural_note
  - marker: c
    text: 'Oder: seine Weisungen. Das hebräische Wort kann allgemein Unterweisung bezeichnen, steht hier jedoch in einem rechtlichen Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Wenn
  rationale: כִּי leitet hier den wiederkehrenden Umstand ein, unter dem Mose tätig wird. „Wenn“ gibt diesen konditional-temporalen Sinn im Deutschen natürlich wieder.
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: sie einen Streitfall haben
  rationale: דָּבָר hat ein breites Bedeutungsspektrum, bezeichnet im richterlichen Zusammenhang aber eine strittige Angelegenheit oder einen Rechtsfall. „Streitfall“ macht den Kontext deutlich; die breitere Alternative wird in der Fußnote genannt.
- source_word: בָּא אֵלַי
  choice: kommt er zu mir
  rationale: Das Verb steht im maskulinen Singular und bezieht sich am naheliegendsten auf דָּבָר, hier mit „Streitfall“ wiedergegeben. Die Formulierung bewahrt das Bild, dass der Fall zu Mose kommt, statt ausdrücklich ein nicht genanntes Passiv einzuführen.
- source_word: וְשָׁפַטְתִּי
  choice: Dann entscheide ich
  rationale: שׁפט bezeichnet hier Moses richterliche Entscheidung. „Entscheide“ ist in diesem Zusammenhang natürlich und vermeidet die im modernen Deutschen mögliche Mehrdeutigkeit von „richten“.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: zwischen einem Mann und seinem Nächsten
  rationale: Die Wiedergabe erhält die grammatisch maskuline repräsentative Einzahl und übersetzt רֵעַ im sozialen und rechtlichen Verhältnis mit „Nächster“.
- source_word: וְהוֹדַעְתִּי
  choice: mache ... bekannt
  rationale: Der Hifil von ידע bedeutet „wissen lassen, bekannt machen“. Die deutsche Formulierung bewahrt diese kausative Bedeutung.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: die Satzungen Gottes
  rationale: חֻקִּים bezeichnet festgesetzte Ordnungen oder Vorschriften. „Satzungen“ ist eine präzise, würdige Wiedergabe.
- source_word: תּוֹרֹתָיו
  choice: seine Gesetze
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten; im Parallelismus mit „Satzungen“ und im Kontext der Rechtsprechung tritt die normative, rechtliche Bedeutung hervor. Die breitere Lesart bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Repräsentative maskuline Einzahl in אִישׁ ... רֵעֵהוּ
  choice: zwischen einem Mann und seinem Nächsten
  alternative: zwischen einem Menschen und seinem Mitmenschen
  rationale: Der hebräische Wortlaut verwendet maskuline Singularformen als repräsentative Rechtsformel. Die Übersetzung bewahrt diese Form, während die Fußnote ihren repräsentativen Charakter erklärt.
- issue: Bedeutungsumfang von תּוֹרֹתָיו im rechtlichen Zusammenhang
  choice: seine Gesetze
  alternative: seine Weisungen
  rationale: Der unmittelbare Zusammenhang handelt von Streitentscheidung und verbindlicher Orientierung. „Gesetze“ gibt diese normative Funktion wieder; „Weisungen“ bleibt als semantisch breitere Möglichkeit ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze folgen der hebräischen Abfolge, ohne unnatürlich altertümlich zu wirken. „Entscheide“ verdeutlicht die richterliche Funktion, und die Fußnoten bewahren die lexikalische Breite der zentralen Rechtsbegriffe.
