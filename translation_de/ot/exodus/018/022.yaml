base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: de
  text: Sie sollen dem Volk jederzeit Recht sprechen. Jede große Rechtssache sollen sie dir vorlegen, doch jede kleine Rechtssache sollen sie selbst entscheiden. So erleichtere dir die Last[a], und sie werden sie mit dir tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So mache es dir leichter.“ Gemeint ist die Last, dem Volk Recht zu sprechen; das Wort „Last“ steht nicht ausdrücklich im Hebräischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Sie sollen dem Volk Recht sprechen
  rationale: שׁפט bezeichnet hier das Richten beziehungsweise Entscheiden von Streitfällen. Die deutsche Wendung „Recht sprechen“ ist natürlich und bewahrt den richterlichen Sinn; die Soll-Form gibt die anweisende Funktion im Zusammenhang wieder.
- source_word: בְּכָל־עֵת
  choice: jederzeit
  rationale: Die knappe Zeitangabe bedeutet wörtlich „zu jeder Zeit“ und bezeichnet die ständige Verfügbarkeit der Richter.
- source_word: כָּל־הַדָּבָר הַגָּדֹל
  choice: jede große Rechtssache
  rationale: דָּבָר meint im gerichtlichen Kontext eine Angelegenheit oder einen Fall. „Rechtssache“ verdeutlicht diesen Kontext, während „große“ die hebräische Wortwahl bewahrt.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: sollen sie dir vorlegen
  rationale: Das Hifil von בוא bedeutet „bringen“. Bei einer Rechtssache ist „jemandem vorlegen“ im Deutschen idiomatisch und drückt die Überweisung an Mose aus.
- source_word: כָּל־הַדָּבָר הַקָּטֹן יִשְׁפְּטוּ הֵם
  choice: jede kleine Rechtssache sollen sie selbst entscheiden
  rationale: „Kleine“ wahrt den Gegensatz zu „große“; das ausdrückliche Pronomen הֵם wird durch „selbst“ betont wiedergegeben. „Entscheiden“ vermeidet im Deutschen die schwerfällige Wiederholung von „Recht sprechen“.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: So erleichtere dir die Last
  rationale: 'וְהָקֵל ist ein Hifil-Imperativ: „mach leicht/erleichtere“. Die Last ist im Hebräischen nicht als Substantiv genannt, wird aber durch מֵעָלֶיךָ („von dir herab“) und den folgenden Gedanken des Mittragens klar vorausgesetzt.'
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: und sie werden sie mit dir tragen
  rationale: נשׂא bedeutet „tragen“. Das Pronomen „sie“ nimmt die zuvor zur Verständlichkeit ausdrücklich gemachte Last auf und erhält das Bild des gemeinsamen Tragens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Rechtssache“ macht den gerichtlichen Zusammenhang deutlich, ohne den Text unnötig zu verrechtlichen. Die Wortpaare „große/kleine“ und „erleichtern/tragen“ bewahren die Bildsprache und Struktur des Hebräischen.
