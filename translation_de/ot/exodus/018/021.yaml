source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: de
  text: Du aber sollst unter dem ganzen Volk tüchtige Männer auswählen[a], die Gott fürchten, zuverlässige Männer[b], die unrechtmäßigen Gewinn hassen[c]. Setze sie über das Volk als Oberste über Tausend, über Hundert, über Fünfzig und über Zehn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fähige Männer“ beziehungsweise „tapfere Männer“. Das hebräische Wort kann je nach Zusammenhang Stärke, Befähigung, Tüchtigkeit oder Tapferkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Männer der Wahrheit“; gemeint sein können wahrhaftige, verlässliche oder treue Männer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die unehrlichen Gewinn hassen“. Gemeint ist die entschiedene Ablehnung eigennützigen oder korrupten Gewinns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: sollst … auswählen
  rationale: Das Verb bedeutet seinem Grundsinn nach „sehen/schauen“, bezeichnet hier aber das prüfende Aussuchen geeigneter Amtsträger.
- source_word: אַנְשֵׁי חַיִל
  choice: tüchtige Männer
  rationale: חַיִל kann Stärke, Tüchtigkeit, Befähigung oder Tapferkeit bezeichnen. Im richterlich-administrativen Zusammenhang steht die Eignung im Vordergrund; „tüchtig“ hält zugleich die Bedeutungsbreite offen.
- source_word: יִרְאֵי אֱלֹהִים
  choice: die Gott fürchten
  rationale: Die Wendung bezeichnet ehrfürchtige Bindung an Gott als sittliche Voraussetzung.
- source_word: אַנְשֵׁי אֱמֶת
  choice: zuverlässige Männer
  rationale: Wörtlich „Männer der Wahrheit“; אֱמֶת umfasst hier Wahrhaftigkeit, Verlässlichkeit und Treue. „Zuverlässig“ gibt die personenbezogene Bedeutung natürlich wieder.
- source_word: שֹׂנְאֵי בָצַע
  choice: die unrechtmäßigen Gewinn hassen
  rationale: בֶּצַע bezeichnet besonders eigennützigen oder unrechtmäßig erlangten Gewinn. Die Formulierung bewahrt die starke Haltung des im Hebräischen verwendeten Verbs „hassen“.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: Setze sie über das Volk
  rationale: Das zweite Pronomen verweist auf das Volk. Die ausdrückliche Wiederaufnahme vermeidet im Deutschen eine missverständliche Pronomenfolge.
- source_word: שָׂרֵי
  choice: Oberste über
  rationale: שַׂר bezeichnet einen Vorsteher oder Amtsträger. „Oberste“ wahrt den formellen Rang, ohne die Funktion unnötig auf das Militärische einzuengen.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: über Tausend, über Hundert, über Fünfzig und über Zehn
  rationale: Die Zahlen bezeichnen abgestufte Einheiten der Aufsicht. Die substantivierten Zahlwörter bilden die knappe hebräische Reihung im Deutschen nach.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der ausgewählten Amtsträger
  choice: tüchtige Männer … zuverlässige Männer
  alternative: tüchtige Menschen … zuverlässige Personen
  rationale: Das Hebräische verwendet ausdrücklich maskuline Personenbezeichnungen. Die Übersetzung bildet diese Form ab, ohne daraus eine über den Vers hinausgehende Lehrentscheidung abzuleiten.
- issue: Bedeutung von „Gott fürchten“
  choice: die Gott fürchten
  alternative: gottesfürchtige Männer
  rationale: Die verbale Form bewahrt die unmittelbare hebräische Aussage und lässt den biblischen Bedeutungsumfang von Ehrfurcht und sittlicher Bindung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber der langen hebräischen Reihung leicht gegliedert. „Oberste“ hält den amtlichen Charakter fest; „über das Volk“ klärt den pronominalen Bezug. Alle im Text gesetzten Fußnotenmarker sind in der Fußnotenliste enthalten.
