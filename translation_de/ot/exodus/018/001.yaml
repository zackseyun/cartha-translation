source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: de
  text: Jitro, der Priester von Midian und Schwiegervater des Mose, hörte alles, was Gott für Mose und für Israel, sein Volk,[a] getan hatte, dass Jahwe Israel aus Ägypten herausgeführt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Israel, das Volk des Mose“. Das Pronomen in „sein Volk“ kann sich grammatisch auf Mose beziehen; im Zusammenhang ist jedoch wahrscheinlich Gott gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Das Wayyiqtol führt die Erzählung fort; im Deutschen ist kein zusätzliches „nun“ oder „da“ nötig.
- source_word: כֹהֵן מִדְיָן
  choice: der Priester von Midian
  rationale: Die Status-constructus-Verbindung bezeichnet Jitros Amt und seine Zugehörigkeit zu Midian; die bestimmte Form passt zur konkreten Identifikation.
- source_word: חֹתֵן מֹשֶׁה
  choice: Schwiegervater des Mose
  rationale: Im Kontext bezeichnet חֹתֵן eindeutig das durch Moses Ehe mit Zippora begründete Verhältnis.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: alles, was Gott … getan hatte
  rationale: „Alles, was“ bewahrt die umfassende Bedeutung; das Plusquamperfekt gibt den Rückblick aus Jitros Perspektive natürlich wieder.
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: für Mose und für Israel
  rationale: Das ל bezeichnet hier am plausibelsten das Handeln zugunsten von Mose und Israel.
- source_word: עַמּוֹ
  choice: sein Volk
  rationale: Das maskuline Singularsuffix wird unverdeckt wiedergegeben. Am wahrscheinlichsten bezieht es sich auf Gott, kann grammatisch jedoch auch auf Mose bezogen werden; die Fußnote wahrt diese Mehrdeutigkeit.
- source_word: כִּי
  choice: ':'
  rationale: כִּי erläutert hier inhaltlich, was Jitro gehört hatte. Ein Doppelpunkt stellt diese erklärende Beziehung im Deutschen klar und idiomatisch dar, ohne sie kausal festzulegen.
- source_word: הוֹצִיא
  choice: hatte … herausgeführt
  rationale: Der Hifil von יצא bedeutet „hinausführen/herausführen“; die Formulierung bewahrt sowohl die verursachende Bedeutung als auch die Bewegung aus Ägypten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִמִּצְרָיִם
  choice: aus Ägypten
  rationale: Zusammen mit הוֹצִיא bezeichnet die Präposition die Bewegung aus dem Land heraus.
theological_decisions:
- issue: Bezugswort des Pronominalsuffixes in עַמּוֹ
  choice: „Israel, sein Volk“ wird im Haupttext beibehalten; wahrscheinlich ist Gott der Bezugspunkt.
  alternative: 'Das Suffix kann grammatisch auch auf Mose bezogen werden: „Israel, das Volk des Mose“.'
  rationale: Gott ist das sachlich naheliegende Bezugswort, und der folgende Satz nennt Jahwe als Israels Befreier. Da die hebräische Grammatik den Bezug auf Mose dennoch zulässt, wird die Spannung nicht im Haupttext aufgelöst, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Mose“ und „Jitro“ folgen geläufigen deutschen Namensformen; der Gottesname erscheint als „Jahwe“. Der Doppelpunkt gibt die erläuternde Funktion von כִּי natürlicher wieder als ein schwerfälliges zweites „dass“.
