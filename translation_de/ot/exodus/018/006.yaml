base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/006.yaml
  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: de
  text: 'Er sagte zu Mose: „Ich, dein Schwiegervater Jitro, komme zu dir, zusammen mit deiner Frau und ihren beiden Söhnen, die sie begleiten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre beiden Söhne mit ihr“. Manche Übersetzungen geben sinngemäß „deine beiden Söhne“ wieder; der masoretische hebräische Text hat jedoch ein Suffix der 3. Person feminin Singular, das sich auf die Frau des Mose bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: Er sagte zu Mose
  rationale: Das Waw-Consecutiv führt die Erzählung weiter; im natürlichen modernen Deutsch muss ein einleitendes „Und“ nicht eigens wiedergegeben werden.
- source_word: אֲנִי
  choice: Ich
  rationale: Das selbstständige Personalpronomen bleibt erhalten, weil es Jitros Selbstvorstellung betont.
- source_word: חֹתֶנְךָ יִתְרוֹ
  choice: dein Schwiegervater Jitro
  rationale: חֹתֵן bezeichnet hier konkret den Vater von Moses Frau; die deutsche Apposition gibt die Beziehung klar und idiomatisch wieder.
- source_word: בָּא אֵלֶיךָ
  choice: komme zu dir
  rationale: Das Partizip beschreibt ein gegenwärtiges beziehungsweise unmittelbar bevorstehendes Kommen und wird daher nicht als abgeschlossene Ankunft wiedergegeben.
- source_word: וְאִשְׁתְּךָ
  choice: zusammen mit deiner Frau
  rationale: Die Konjunktion verbindet die mitkommenden Personen; „zusammen mit“ macht das Begleitverhältnis im Deutschen deutlich.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: und ihren beiden Söhnen
  rationale: Das Suffix ist feminin Singular und bezieht sich ausdrücklich auf Moses Frau; der masoretische Text sagt daher „ihre“, nicht „deine“ Söhne.
- source_word: עִמָּהּ
  choice: die bei ihr sind
  rationale: Die ausdrückliche Angabe, dass die Söhne bei ihr sind, bleibt erhalten, ohne im Deutschen die schwerfällige Wiederholung „mit ihr“ unmittelbar nach „zusammen mit“ zu erzeugen.
theological_decisions:
- issue: Bezug des pronominalen Suffixes in בָנֶיהָ
  choice: „ihren beiden Söhnen“ mit Bezug auf Moses Frau
  alternative: „deinen beiden Söhnen“ mit Bezug auf Mose
  rationale: Der masoretische Text hat eindeutig ein Suffix der 3. Person feminin Singular. Die Übersetzung harmonisiert diese Formulierung nicht stillschweigend mit der familiären Beziehung zu Mose.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die betonte Selbstvorstellung und der feminine Bezug von „ihren“ werden bewahrt; die letzte Begleitangabe wird natürlich, aber quellennah formuliert.
