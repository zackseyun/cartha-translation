  yaml_path: translation/ot/exodus/018/017.yaml
  text: Moses' father-in-law said to him[a], “What you are doing is not good.”
translation:
  language: de
  text: 'Moses’ Schwiegervater sagte zu ihm: „Es ist nicht gut, was du da tust.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das Narrativ-Waw führt die Handlung fort; im natürlichen modernen Deutsch muss das einleitende וַ nicht eigens mit „und“ wiedergegeben werden.
- source_word: חֹתֵן מֹשֶׁה
  choice: Moses’ Schwiegervater
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Moses’ Schwiegervater; die possessive Form ist im Deutschen natürlich und präzise.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das Pronomen verweist eindeutig auf Mose zurück und wird ohne unnötige Wiederholung des Namens direkt wiedergegeben.
- source_word: לֹא טוֹב
  choice: Es ist nicht gut
  rationale: Die direkte Wertung „nicht gut“ bewahrt die breite Bedeutung von טוֹב, ohne sie auf „falsch“ oder „unvorteilhaft“ zu verengen.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: was du da tust
  rationale: Die nominale hebräische Wendung „die Sache, die du tust“ wird idiomatisch als Relativsatz wiedergegeben. „Da“ verweist natürlich auf Moses’ gegenwärtige, beobachtete Handlungsweise, ohne zusätzliche Sachinformation einzuführen.
