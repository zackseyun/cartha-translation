  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: de
  text: Dann nahm Jitro, der Schwiegervater von Mose, ein Brandopfer und Schlachtopfer für Gott. Aaron und alle Ältesten Israels kamen, um mit Moses Schwiegervater vor Gott Brot zu essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Brot zu essen“; die hebräische Wendung kann bedeuten, gemeinsam eine Mahlzeit einzunehmen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet zunächst „nehmen“. Die Opferbedeutung ergibt sich aus den Objekten und dem Zusammenhang; „nahm“ vermeidet eine stillschweigende Präzisierung zu „brachte“ oder „opferte“.
- source_word: חֹתֵן מֹשֶׁה
  choice: der Schwiegervater von Mose / Moses Schwiegervater
  rationale: חֹתֵן bezeichnet in diesem Erzählzusammenhang den Schwiegervater. Die Wiederholung der Verwandtschaftsbezeichnung im Hebräischen bleibt erhalten.
- source_word: עֹלָה
  choice: ein Brandopfer
  rationale: עֹלָה ist der übliche Opferbegriff für ein vollständig verbranntes Opfer; „Brandopfer“ ist die verständliche und etablierte deutsche Entsprechung.
- source_word: זְבָחִים
  choice: Schlachtopfer
  rationale: זְבָחִים bezeichnet geschlachtete Opfer und steht hier neben dem spezifischen Brandopfer. „Schlachtopfer“ bewahrt diese Unterscheidung deutlicher als das allgemeinere „Opfer“.
- source_word: לֵאלֹהִים
  choice: für Gott
  rationale: Die Präposition ל kennzeichnet hier die Ausrichtung bzw. Widmung der Opfer. „Für Gott“ ist natürliches Deutsch und bewahrt diese Bedeutung.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: Aaron und alle Ältesten Israels kamen
  rationale: Obwohl das vorangestellte Verb im Hebräischen Singular ist, umfasst das koordinierte Subjekt Aaron und die Ältesten; im Deutschen ist daher der Plural erforderlich.
- source_word: לֶאֱכָל לֶחֶם
  choice: um … Brot zu essen
  rationale: Die konkrete hebräische Wendung „Brot essen“ bleibt im Haupttext erhalten. Sie kann idiomatisch die Teilnahme an einer Mahlzeit bezeichnen, was die Fußnote erläutert.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: mit Moses Schwiegervater
  rationale: Die Übersetzung erhält die erneute relationale Bezeichnung, statt sie durch den Eigennamen zu ersetzen.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: vor Gott
  rationale: „Vor Gott“ gibt לִפְנֵי knapp und würdig wieder und lässt den sakralen Rahmen erkennen, ohne ihn weiter auszudeuten.
theological_decisions:
- issue: Bedeutung der Mahlzeit im Opferzusammenhang
  choice: Der Wortlaut „Brot essen“ bleibt stehen; der Zusammenhang lässt eine gemeinsame Opfermahlzeit vor Gott erkennen.
  alternative: Die Formulierung bezeichnet lediglich das gemeinsame Essen gewöhnlichen Brotes.
  rationale: Opferterminologie, gemeinschaftliche Teilnahme und „vor Gott“ sprechen für eine sakrale Mahlzeit. Die Übersetzung bezeichnet sie dennoch nicht ausdrücklich als Bundes- oder Opfermahlzeit, sondern bewahrt die Spannung des Wortlauts.
- issue: Referent von אֱלֹהִים
  choice: Gott
  alternative: Götter
  rationale: Der narrative Zusammenhang verlangt den singularischen Bezug auf Israels Gott; eine polytheistische Mehrdeutigkeit ist hier nicht angezeigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge des hebräischen Textes zu verändern. „Jitro“ und „Mose“ folgen geläufigen modernen deutschen Namensformen; „Brandopfer“ und „Schlachtopfer“ bewahren die kultische Terminologie.
