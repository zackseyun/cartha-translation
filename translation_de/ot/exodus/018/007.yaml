source:
  edition: WLC
  text: וַ/יֵּצֵ֨א מֹשֶׁ֜ה לִ/קְרַ֣את חֹֽתְנ֗/וֹ וַ/יִּשְׁתַּ֨חוּ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יִּשְׁאֲל֥וּ אִישׁ לְ/רֵעֵ֖/הוּ לְ/שָׁל֑וֹם וַ/יָּבֹ֖אוּ הָ/אֹֽהֱלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: de
  text: Mose ging hinaus, seinem Schwiegervater entgegen. Er verneigte sich vor ihm und küsste ihn. Dann erkundigte sich jeder beim anderen nach dessen Wohlergehen[a], und sie gingen in das Zelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich ist vom Fragen „nach Frieden“ die Rede; die hebräische Wendung meint, sich nach dem Befinden oder Wohlergehen des anderen zu erkundigen.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  choice: entgegen
  rationale: In Verbindung mit „hinausgehen“ bezeichnet die Form das Entgegengehen, um einen Ankommenden zu empfangen; die knappe deutsche Wendung ist natürlich und kontextgerecht.
- source_word: חֹתְנוֹ
  choice: seinem Schwiegervater
  rationale: חֹתֵן bezeichnet hier im Erzählzusammenhang Jitro als Moses Schwiegervater; die konkrete Verwandtschaftsbezeichnung ist daher vorzuziehen.
- source_word: וַיִּשְׁתַּחוּ
  choice: Er verneigte sich vor ihm
  rationale: Das Verb bezeichnet ein tiefes Sich-Niederbeugen. „Verneigte sich“ gibt die körperliche Ehrenbezeugung wieder, ohne sie als Anbetung auszulegen.
- source_word: וַיִּשַּׁק לוֹ
  choice: und küsste ihn
  rationale: Die Wendung beschreibt den üblichen Begrüßungskuss und lässt sich im Deutschen unmittelbar und natürlich so wiedergeben.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: Dann erkundigte sich jeder beim anderen nach dessen Wohlergehen
  rationale: Die distributive Wendung אִישׁ לְרֵעֵהוּ bedeutet „jeder beim anderen“, während שאל לשלום idiomatisch das Erkundigen nach dem Wohlergehen bezeichnet.
- source_word: הָאֹהֱלָה
  choice: in das Zelt
  rationale: Die Richtungsendung bezeichnet die Bewegung hinein. Der Artikel rechtfertigt „das Zelt“; ein Besitzer wird im Hebräischen nicht ausdrücklich genannt.
theological_decisions:
- issue: Bedeutung von Moses Verneigung vor Jitro
  choice: körperliche Ehrenbezeugung, ohne ausdrückliche Deutung als Anbetung
  alternative: Niederwerfung als Akt der Anbetung
  rationale: Das Verb kann in anderen Zusammenhängen Anbetung bezeichnen. Hier sprechen jedoch das menschliche Gegenüber und die Abfolge der Begrüßung für eine respektvolle Ehrenbezeugung; „verneigte sich“ bewahrt die Handlung, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt eng am Hebräischen; unnötige Besitzangaben wie „sein Zelt“ werden vermieden.
