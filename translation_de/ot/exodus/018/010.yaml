  text: וַ/יֹּאמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְ/כֶ֛ם מִ/יַּ֥ד מִצְרַ֖יִם וּ/מִ/יַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת הָ/עָ֔ם מִ/תַּ֖חַת יַד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: de
  text: 'Und Jitro sagte: »Gepriesen sei Jahwe[a], der euch aus der Gewalt der Ägypter und aus der Gewalt des Pharaos[b] befreit hat und der das Volk aus der Herrschaft der Ägypter befreit hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Gepriesen ist Jahwe.« Die hebräische Segensformel kann sowohl als Lobpreiswunsch als auch als Feststellung verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich stehen drei Wendungen mit »Hand«: »aus der Hand Ägyptens«, »aus der Hand des Pharaos« und »unter der Hand Ägyptens«. Gemeint sind Macht, Verfügungsgewalt und Unterordnung unter bedrückende Herrschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die waw-konsekutive Form führt die Erzählung weiter. „Und … sagte“ bewahrt den hebräischen Erzählfluss, ohne eine stärkere zeitliche Nuance einzutragen.
- source_word: יִתְרוֹ
  choice: Jitro
  rationale: „Jitro“ gibt die hebräische Namensform in einer für das Deutsche üblichen Umschrift unmittelbar wieder.
- source_word: בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  rationale: Die deutsche Segens- und Lobpreisformel gibt den passiven hebräischen Ausdruck natürlich und würdevoll wieder; seine mögliche Nuance zwischen Feststellung und Wunsch wird in einer Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הִצִּיל
  choice: befreit hat
  rationale: Der Hifil von נצל bezeichnet hier die Rettung aus feindlicher Gewalt. „Befreit“ ist im Exoduszusammenhang klar, natürlich und in beiden Satzteilen passend.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Das Objektpronomen steht in der zweiten Person maskulin Plural; „euch“ ist die unmittelbare deutsche Entsprechung.
- source_word: מִיַּד
  choice: aus der Gewalt
  rationale: Das hebräische Bild „aus der Hand“ bezeichnet hier Macht und Verfügungsgewalt. „Aus der Gewalt“ vermittelt die Bedeutung im modernen Deutschen natürlich.
- source_word: מִצְרַיִם
  choice: die Ägypter
  rationale: Im Zusammenhang mit der „Hand“ beziehungsweise Gewalt ist der kollektive Bezug auf die Ägypter gemeint und im Deutschen so idiomatisch.
- source_word: פַּרְעֹה
  choice: Pharao
  rationale: Dies ist die übliche deutsche Form des ägyptischen Herrschertitels.
- source_word: הָעָם
  choice: das Volk
  rationale: עַם bezeichnet hier Israel als Gemeinschaft; „das Volk“ ist die natürliche kontextuelle Wiedergabe.
- source_word: מִתַּחַת יַד
  choice: aus der Herrschaft
  rationale: Die erweiterte Wendung bezeichnet Unterordnung unter ägyptische Macht. „Aus der Herrschaft“ bewahrt gegenüber dem vorangehenden „aus der Gewalt“ die verstärkte Vorstellung des Darunterseins.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Nuance der Segensformel בָּרוּךְ יְהוָה
  choice: Gepriesen sei Jahwe
  alternative: Gepriesen ist Jahwe
  rationale: Die hebräische Nominalformel kann im Deutschen als Lobpreis oder als feststellende Aussage formuliert werden. Der Haupttext verwendet die geläufige doxologische Form, während die Fußnote die andere mögliche Nuance nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkreten hebräischen Hand-Metaphern werden wegen der im Deutschen unnatürlichen letzten Wendung sinngemäß als „Gewalt“ und „Herrschaft“ wiedergegeben; eine Fußnote dokumentiert den Wortlaut und die Abstufung.
