translation:
  language: de
  text: Mose hörte auf seinen Schwiegervater und tat alles, was dieser gesagt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mose gehorchte seinem Schwiegervater.“ Die hebräische Wendung wörtlich „auf die Stimme hören“ kann ein Hören bezeichnen, das zum Gehorsam führt; der folgende Satzteil macht dieses Befolgen ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bedeutet im Ausdruck שׁמע לְקוֹל nicht nur akustisches Hören, sondern aufmerksames und folgebereites Hören. „Hörte auf“ bewahrt im Deutschen sowohl das Bild des Hörens als auch den Sinn des Befolgens.
- source_word: לְקוֹל
  choice: auf die Stimme
  rationale: קוֹל bedeutet wörtlich „Stimme“. Die Wendung „auf die Stimme … hören“ bildet das hebräische Idiom verständlich und mit seiner Bildhaftigkeit ab.
- source_word: חֹתְנוֹ
  choice: seines Schwiegervaters
  rationale: Im Zusammenhang bezeichnet das Wort Jitro als Moses Schwiegervater; dies ist hier die klare, übliche Wiedergabe.
- source_word: וַיַּעַשׂ
  choice: und tat
  rationale: עשה ist das gewöhnliche Verb für „tun/machen“. „Tat“ gibt die anschließende Umsetzung des Gehörten knapp und unmittelbar wieder.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: alles, was er gesagt hatte
  rationale: Die Wiedergabe bewahrt den umfassenden Sinn von כֹּל und gibt die im Erzählzusammenhang vorausgehende Rede im natürlichen deutschen Plusquamperfekt wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bildhafte Wendung „auf die Stimme … hören“ bewahrt die hebräische Ausdrucksweise, bleibt aber im Deutschen verständlich; „tat alles“ macht die daraus folgende Umsetzung ausdrücklich.
