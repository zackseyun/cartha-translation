  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: Mose reagiert auf den Rat seines Schwiegervaters und setzt ihn vollständig um. Das hebräische Idiom שׁמע לְקוֹל bezeichnet hier mehr als bloßes akustisches Hören; die nachfolgende Handlung konkretisiert das Befolgen. Im deutschen Entwurf ist jedoch „was er gesagt hatte“ mehrdeutig, während sich אָמָר im Kontext auf den Schwiegervater bezieht.'
