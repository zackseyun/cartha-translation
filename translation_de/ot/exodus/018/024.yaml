  terminology: „Schwiegervater“ ist im Kontext eindeutig und angemessen. „Tat alles“ gibt כֹּל אֲשֶׁר אָמָר prägnant wieder. Die Fußnote erhält die mögliche Nuance des Gehorchens, ohne sie im Haupttext vorzuziehen.
