source:
  edition: WLC
  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: de
  text: Jitro, Moses Schwiegervater, nahm Zippora, die Frau des Mose, mit, nachdem sie fortgeschickt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach ihrem Wegschicken“ oder „nach ihrem Fortgeschicktwerden“. Wer sie fortschickte, wird im Hebräischen nicht ausdrücklich gesagt.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm … zu sich
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im Zusammenhang klingt „zu sich nehmen“ im Deutschen natürlich und lässt offen, ob Jitro Zippora in seine Obhut nahm oder sie anschließend mitbrachte.
- source_word: חֹתֵן מֹשֶׁה
  choice: Moses’ Schwiegervater
  rationale: חֹתֵן bezeichnet hier Jitros Verwandtschaftsverhältnis zu Mose durch Heirat. Die possessive Form ist knapp und idiomatisch.
- source_word: צִפֹּרָה
  choice: Zippora
  rationale: Der Personenname wird in der im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: die Frau von Mose
  rationale: Die Constructusverbindung bezeichnet Zippora eindeutig als Moses Frau. Die Formulierung vermeidet unmittelbar aufeinanderfolgendes „Moses’“ und bleibt natürlich.
- source_word: אַחַר
  choice: nachdem
  rationale: Die zeitliche Abfolge wird im deutschen Nebensatz idiomatisch mit „nachdem“ ausgedrückt.
- source_word: שִׁלּוּחֶיהָ
  choice: Mose sie fortgeschickt hatte
  rationale: Das Substantiv mit Suffix bedeutet wörtlich „nach ihrem Fortgeschicktwerden/ihrem Wegschicken“, ohne den Handelnden zu nennen. Mose ist im Kontext der wahrscheinlichste implizite Urheber; die formale Offenheit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Nicht genannter Urheber bei שִׁלּוּחֶיהָ („ihrem Wegschicken“)
  choice: 'Mose wird im Haupttext als impliziter Urheber genannt: „nachdem Mose sie fortgeschickt hatte“.'
  alternative: „nachdem sie fortgeschickt worden war“ beziehungsweise „nach ihrem Wegschicken“
  rationale: Die hebräische Nominalform nennt keinen Urheber. Der Kontext legt Mose nahe, doch die passive Alternative bleibt grammatisch möglich und wird deshalb in einer Fußnote ausdrücklich festgehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu sich nehmen“ gibt das offene לקח natürlicher wieder als ein isoliertes „nahm“. Die im Hebräischen bestehende Unbestimmtheit des Handelnden wird im Haupttext kontextgemäß ausgelegt und durch die Fußnote bewahrt.
