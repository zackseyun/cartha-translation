  terminology: Jitro, Zippora und Mose entsprechen geläufigem deutschem Bibelgebrauch. Die Genitivformen „Moses Schwiegervater“ und „die Frau des Mose“ sind idiomatischer als die im Entwurf verwendeten Apostroph- bzw. von-Konstruktionen.
