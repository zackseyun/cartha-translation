source:
  edition: WLC
  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: de
  text: 'Mose wählte aus ganz Israel tüchtige Männer[a] und setzte sie als Leiter[b] über das Volk ein: als Vorsteher über tausend, über hundert, über fünfzig und über zehn.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich auch „Männer von Kraft“; die hebräische Wendung kann Stärke, Befähigung oder bewährte Tauglichkeit bezeichnen. Hier sind für Leitungsaufgaben geeignete Männer gemeint.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Häupter“; das Hebräische gebraucht den Ausdruck bildlich für Menschen in einer Autoritätsstellung. Oder „Vorsteher“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Vorsteher über Tausende, über Hunderte, über Fünfziger und über Zehner“. Das Bezugswort zu den Zahlen wird im Hebräischen nicht ausdrücklich genannt.'
    reason: clarification
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: wählte … aus
  rationale: בחר bedeutet hier schlicht „wählen, auswählen“. Die trennbare deutsche Formulierung gibt den Auswahlvorgang natürlich wieder.
- source_word: אַנְשֵׁי חַיִל
  choice: tüchtige Männer
  rationale: Die Wendung bezeichnet Männer von Kraft, Befähigung oder bewährter Tauglichkeit. Im verwaltungsmäßigen Zusammenhang steht ihre Eignung für Leitungsaufgaben im Vordergrund, nicht militärische Tapferkeit.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: aus ganz Israel
  rationale: Die Formulierung macht deutlich, dass die Männer aus dem gesamten Volk ausgewählt wurden.
- source_word: וַיִּתֵּן אֹתָם
  choice: setzte sie … ein
  rationale: נתן bedeutet wörtlich „geben, setzen“, bezeichnet hier aber idiomatisch die Einsetzung in ein Amt.
- source_word: רָאשִׁים
  choice: Oberhäupter
  rationale: Die Wiedergabe bewahrt das hebräische Bild vom „Haupt“ als einer Person in leitender Stellung und ist im Deutschen verständlich.
- source_word: עַל הָעָם
  choice: über das Volk
  rationale: עַל bezeichnet in diesem Zusammenhang die Leitungs- und Aufsichtsstellung gegenüber dem Volk.
- source_word: שָׂרֵי
  choice: Vorsteher
  rationale: שַׂר bezeichnet einen Amtsträger mit übertragener Autorität. „Vorsteher“ passt zur zivilen und richterlichen Ordnung, ohne unnötig eine militärische Funktion festzulegen.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: über tausend, über hundert, über fünfzig und über zehn
  rationale: Die Zahlen werden direkt wiedergegeben. Wie im Hebräischen bleibt das Bezugswort unausgesprochen; aus dem Zusammenhang sind Gruppen von Menschen gemeint.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Tüchtige Männer“ ist allgemein verständlich und kontextgemäß; „Oberhäupter“ bewahrt das hebräische Bild, während „Vorsteher“ die abgestufte zivile Leitungsstruktur ohne militärische Überdeutung ausdrückt.
