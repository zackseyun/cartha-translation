translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers wird als syntaktische Fortsetzung von Vers 2 eröffnet. Die Namensbegründung bleibt knapp und enthält durch die Wiederholung »Fremder/fremd« das hebräische Wortspiel auf der Bedeutungsebene, ohne eine nicht ausdrücklich im Text erklärte Etymologie zu ergänzen.
