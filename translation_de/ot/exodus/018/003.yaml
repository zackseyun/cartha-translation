  source_fidelity: 'Die Hauptaussage ist zutreffend: Zippora hat zwei Söhne; einer heißt Gerschom, und die Namensbegründung verweist auf Moses'' Fremdsein in einem fremden Land. »gelebt« fügt jedoch gegenüber הָיִיתִי („ich war / ich bin gewesen“) einen Aspekt hinzu, den der hebräische Text nicht ausdrücklich formuliert. Das Plusquamperfekt in »er hatte gesagt« ist ebenfalls nicht verlangt.'
  naturalness: »Der eine hieß Gerschom« ist natürliches modernes Standarddeutsch. »Ich war ein Fremder in einem fremden Land« ist idiomatisch, klar und erhält die im Hebräischen bewusst wiederholte Wortgruppe. Die einleitende Konjunktion bewahrt angemessen die Fortsetzung des Satzes aus Vers 2.
  terminology: '»Fremder« ist für גֵּר hier eine gute, verständliche Haupttextlösung. Die bisherige Fußnote ist dagegen problematisch: »Beisasse« ist veraltet, und »ansässiger Schutzbürger« ist eine zu spezifische sozialrechtliche Einordnung, die der Ausdruck im vorliegenden Kontext nicht zwingend trägt. Gerschom ist als Namensform angemessen.'
