base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: de
  text: 'und ihre beiden Söhne. Der eine hieß[a] Gerschom, denn er sagte: »Ich war ein Fremder in einem fremden Land.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der Name des einen war«.'
    reason: Dokumentiert die formellere hebräische Wendung; der Haupttext gibt sie idiomatisch wieder.
  - marker: b
    text: 'Oder: »Ich war ein Fremdling in einem fremden Land.« Das hebräische Wort גֵּר kann einen Fremden oder einen außerhalb seiner Heimat lebenden ansässigen Einwohner bezeichnen.'
    reason: Bewahrt die lexikalische Spannweite von גֵּר, ohne eine bestimmte historische oder rechtliche Stellung festzulegen.
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: und ihre beiden Söhne
  rationale: Die Konjunktion führt die Objektfolge aus dem vorhergehenden Vers weiter; אֵת bleibt als Akkusativmarker unübersetzt. »Ihre beiden Söhne« gibt den hebräischen Ausdruck natürlich und genau wieder.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: Der eine hieß
  rationale: Die idiomatische deutsche Form bewahrt die Unterscheidung zwischen den beiden Söhnen, ohne הָאֶחָד als zeitliche Reihenfolge im Sinn von »der erste« zu deuten.
- source_word: גֵּרְשֹׁם
  choice: Gerschom
  rationale: Der Personenname wird in einer im Deutschen etablierten, hebräischen Aussprache nahen Form wiedergegeben.
- source_word: כִּי אָמַר
  choice: denn er hatte gesagt
  rationale: כִּי erklärt die Namensgebung. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass Moses diese Aussage zuvor bei der Namensgebung gemacht hatte.
- source_word: גֵּר
  choice: Als Fremder
  rationale: גֵּר bezeichnet einen außerhalb seiner Heimat lebenden Fremden beziehungsweise Beisassen. »Fremder« ist verständlich und bewahrt die Verbindung zu נָכְרִיָּה.
- source_word: הָיִיתִי
  choice: habe ich ... gelebt
  rationale: Das hebräische Qatal beschreibt Moses' Dasein als Fremder. Die Formulierung ist im Deutschen natürlicher als »bin ich gewesen« und lässt die genaue Dauer offen.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: in einem fremden Land
  rationale: Die Wendung gibt sowohl אֶרֶץ als auch נָכְרִיָּה direkt und idiomatisch wieder.
