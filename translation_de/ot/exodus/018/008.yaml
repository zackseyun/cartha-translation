source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: de
  text: Mose erzählte seinem Schwiegervater alles, was Jahwe dem Pharao und Ägypten um Israels willen[a] angetan hatte, ferner all die Mühsal, die ihnen unterwegs widerfahren war[b], und wie Jahwe sie gerettet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen Israel“ beziehungsweise „Israel zuliebe“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all die Not, die sie auf dem Weg getroffen hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: erzählte
  rationale: Das Piel von ספר bedeutet hier, Geschehenes ausführlich zu erzählen oder zu berichten. „Erzählte“ ist natürlich und wahrt den berichtenden Charakter.
- source_word: חֹתְנוֹ
  choice: seinem Schwiegervater
  rationale: Im Zusammenhang ist Jitro, Moses Schwiegervater, gemeint; die allgemeinere Bedeutung eines angeheirateten Verwandten ist hier nicht erforderlich.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: alles, was Jahwe dem Pharao und Ägypten angetan hatte
  rationale: Das Verb עשה mit ל bezeichnet in diesem Gerichtskontext, was Jahwe dem Pharao und Ägypten widerfahren ließ. „Angetan hatte“ gibt die nachteilige Wirkung idiomatisch wieder, ohne ein zusätzliches Verb wie „kämpfen“ einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen. „Jahwe“ ist die im Deutschen übliche wissenschaftlich begründete Form.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: um Israels willen
  rationale: Die Wendung bezeichnet Israel als Anlass beziehungsweise Begünstigten des Handelns Jahwes. „Um Israels willen“ bewahrt diese Bedeutungsweite.
- source_word: הַתְּלָאָה
  choice: die Mühsal
  rationale: Das Substantiv bezeichnet Mühe, Not oder Beschwernis. „Mühsal“ ist prägnant, würdig und kann die Gesamtheit der unterwegs erlebten Belastungen kollektiv bezeichnen.
- source_word: מְצָאָתַם
  choice: ihnen widerfahren war
  rationale: Wörtlich hat die Mühsal sie „gefunden“. Die deutsche Wendung „ihnen widerfahren“ vermittelt das Eintreffen von Not natürlich, ohne die Aussage abzuschwächen.
- source_word: בַּדֶּרֶךְ
  choice: unterwegs
  rationale: Die knappe Wiedergabe bezeichnet den Verlauf der Reise und entspricht natürlichem modernem Deutsch.
- source_word: וַיַּצִּלֵם
  choice: sie gerettet hatte
  rationale: נצל bezeichnet die Befreiung oder Rettung aus Gefahr. „Gerettet“ ist im heutigen Deutsch klar und trägt hier keine notwendige dogmatische Zusatzbedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen als Namen und folgt der im modernen Deutschen üblichen Transkription, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug von עַל אֹדוֹת יִשְׂרָאֵל
  choice: um Israels willen
  alternative: wegen Israel; Israel zuliebe
  rationale: Die Formulierung lässt sowohl Anlass als auch fürsorgliche Zielrichtung anklingen. „Um Israels willen“ hält diese Spannung offen und legt die Wendung nicht ausschließlich kausal oder final fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Ferner“ verdeutlicht, dass Mose sowohl Jahwes Handeln in Ägypten als auch die Mühsal des Weges berichtete. Die Fußnoten bewahren die bildhaftere Formulierung von מְצָאָתַם und die Bedeutungsbreite von עַל אֹדוֹת.
