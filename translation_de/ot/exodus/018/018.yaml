  text: נָבֹ֣ל תִּבֹּ֔ל גַּם אַתָּ֕ה גַּם הָ/עָ֥ם הַ/זֶּ֖ה אֲשֶׁ֣ר עִמָּ֑/ךְ כִּֽי כָבֵ֤ד מִמְּ/ךָ֙ הַ/דָּבָ֔ר לֹא תוּכַ֥ל עֲשֹׂ֖/הוּ לְ/בַדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: de
  text: Du wirst dich völlig erschöpfen[a], ebenso wie dieses Volk, das bei dir ist. Denn die Sache ist zu schwer für dich; du kannst sie nicht allein tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du wirst völlig ermüden.« Im Hebräischen verstärkt ein vorangestellter Infinitiv das Verb: wörtlich etwa »Erschöpfen wirst du dich erschöpfen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: du wirst dich völlig erschöpfen
  rationale: Der Infinitivus absolutus mit dem Imperfekt verstärkt die Aussage. Im Zusammenhang bezeichnet נבל das Erschöpfen durch Überlastung; »völlig« gibt die hebräische Hervorhebung in natürlichem Deutsch wieder.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: du ebenso wie dieses Volk
  rationale: Das wiederholte גַּם schließt Mose und das Volk gleichermaßen ein; »dieses Volk« bewahrt den kollektiven Singular.
- source_word: אֲשֶׁר עִמָּךְ
  choice: das bei dir ist
  rationale: Die Formulierung folgt dem grammatischen Singular des Kollektivnomens עָם und klingt im modernen Standarddeutsch natürlich.
- source_word: כִּי כָבֵד מִמְּךָ הַדָּבָר
  choice: Denn die Aufgabe ist zu schwer für dich
  rationale: כָבֵד bezeichnet bildlich eine übermäßige Belastung. Im Kontext meint דָּבָר die von Mose ausgeübte Aufgabe; »Aufgabe« ist hier klarer als das unspezifische »Ding« oder »Angelegenheit«.
- source_word: לֹא תוּכַל עֲשֹׂהוּ לְבַדֶּךָ
  choice: du kannst sie nicht allein bewältigen
  rationale: Die Wendung drückt aus, dass Mose die Aufgabe ohne Hilfe nicht ausführen kann. »Bewältigen« vermittelt die Belastung des Zusammenhangs idiomatisch, ohne die Tätigkeit enger festzulegen.
