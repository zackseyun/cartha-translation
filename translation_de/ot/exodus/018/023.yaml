  text: אִ֣ם אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ תַּעֲשֶׂ֔ה וְ/צִוְּ/ךָ֣ אֱלֹהִ֔ים וְ/יָֽכָלְתָּ֖ עֲמֹ֑ד וְ/גַם֙ כָּל הָ/עָ֣ם הַ/זֶּ֔ה עַל מְקֹמ֖/וֹ יָבֹ֥א בְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: de
  text: Wenn du so handelst und Gott es dir gebietet, wirst du standhalten können; und auch dieses ganze Volk wird in Frieden an seinen Ort kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird an seinen Ort kommen“. Mit dem kollektiv gebrauchten „Volk“ kann gemeint sein: Alle werden jeweils in Frieden an den ihnen zukommenden Ort gelangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם אֶת־הַדָּבָר הַזֶּה תַּעֲשֶׂה
  choice: Wenn du so handelst
  rationale: Die Wendung bezeichnet bedingt die zuvor vorgeschlagene Vorgehensweise. „So handelst“ gibt den Rückbezug im Deutschen natürlicher wieder als das wörtlichere „diese Sache tust“.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: und Gott es dir gebietet
  rationale: 'צוה bedeutet hier „gebieten/befehlen“. Die koordinierte Klausel wird als zusätzliche Bedingung verstanden: Der Rat steht unter Gottes Weisung.'
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: wirst du standhalten können
  rationale: יכל mit Infinitiv bezeichnet Fähigkeit; עמד heißt wörtlich „stehen“, meint im Zusammenhang aber, der Belastung gewachsen zu bleiben. „Standhalten“ bewahrt das Bild und vermittelt die idiomatische Bedeutung.
- source_word: כָּל־הָעָם הַזֶּה
  choice: dieses ganze Volk
  rationale: Bewahrt den kollektiven Singular und den hinweisenden Charakter der hebräischen Formulierung in idiomatischem Deutsch.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: wird an seinen Ort kommen
  rationale: Die singularischen Formen stimmen mit dem Kollektiv „Volk“ überein. בוא wird formal als „kommen“ wiedergegeben; gemeint sein kann distributiv, dass alle jeweils an den ihnen zukommenden Ort gelangen.
- source_word: בְשָׁלוֹם
  choice: in Frieden
  rationale: 'Die feste deutsche Wendung wahrt das breite Bedeutungsspektrum von שָׁלוֹם: Frieden, Wohlergehen und unversehrtes Ankommen.'
theological_decisions:
- issue: Bedingtheit von Jitros Rat durch Gottes Weisung
  choice: „Wenn du so handelst und Gott es dir gebietet“ stellt Handeln und göttliches Gebot als zusammengehörige Bedingungen dar.
  alternative: „Wenn du so handelst, wird Gott es dir gebieten“ oder „und möge Gott es dir gebieten“.
  rationale: Im Zusammenhang ist Gottes Gebot keine von Jitros Rat unabhängig zugesicherte Folge. Die Übersetzung wahrt, dass Mose den Vorschlag nicht ohne göttliche Weisung umsetzen soll.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Standhalten“ erhält das hebräische Bild des Stehens, ohne im Deutschen unverständlich zu wirken. Der kollektive Singular wird bewusst beibehalten.
