  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: de
  text: 'Als Moses’ Schwiegervater sah, was Mose alles für das Volk tat, sagte er: »Was ist das, was du da für das Volk tust? Warum sitzt du allein da, während das ganze Volk vom Morgen bis zum Abend vor dir steht?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: Moses’ Schwiegervater
  rationale: חֹתֵן bezeichnet hier eindeutig Moses’ Schwiegervater; die deutsche Genitivfügung ist natürlich und präzise.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה לָעָם
  choice: was Mose alles für das Volk tat
  rationale: כָּל אֲשֶׁר erfasst die Gesamtheit der fortlaufenden Tätigkeit; die Wiederaufnahme des Namens beseitigt im Deutschen eine mögliche Mehrdeutigkeit des Pronomens, ohne zusätzliche Information einzuführen.
- source_word: מָה הַדָּבָר הַזֶּה
  choice: Was ist das
  rationale: דָּבָר meint hier die Sache beziehungsweise Vorgehensweise. Die knappe deutsche Frage klingt natürlich und bewahrt den offenen Bezug.
- source_word: לָעָם
  choice: für das Volk
  rationale: ל bezeichnet hier am plausibelsten eine Tätigkeit zugunsten des Volkes, nicht eine gegen das Volk gerichtete Handlung.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: du allein dasitzt
  rationale: ישׁב bezeichnet das Sitzen, im Zusammenhang wohl auch das Sitzen zur Rechtsprechung; die Übersetzung hält die räumliche und funktionale Bedeutung offen.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: während das ganze Volk vor dir steht
  rationale: נצב bedeutet »stehen«; עַל wird in dieser Audienz- oder Gerichtsszene idiomatisch mit »vor« wiedergegeben.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: vom Morgen bis zum Abend
  rationale: Die feste Zeitangabe bezeichnet die gesamte Dauer des Tages und wird im Deutschen idiomatisch wiedergegeben.
