source:
  edition: WLC
  text: כֹּ֣ה תֹּאמַ֣ר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֤ה אֲשֶׁר בָּנִ֨יתִי֙ אֲנִ֣י הֹרֵ֔ס וְ/אֵ֥ת אֲשֶׁר נָטַ֖עְתִּי אֲנִ֣י נֹתֵ֑שׁ וְ/אֶת כָּל הָ/אָ֖רֶץ הִֽיא׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/004.yaml
  text: 'This is what you shall say to him: ‘This is what Yahweh says: Behold[a], what I have built I am tearing down, and what I have planted I am uprooting, that is, the whole land.’'
translation:
  language: de
  text: 'So sollst du zu ihm sagen: »So spricht Jahwe: Sieh, was ich gebaut habe, reiße ich nieder, und was ich gepflanzt habe, reiße ich aus – und zwar das ganze Land[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze Erde«. Das hebräische Wort kann sowohl »Land« als auch »Erde« bedeuten; wegen des unmittelbaren Zusammenhangs des Gerichts über Juda ist hier »Land« wahrscheinlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹּאמַר אֵלָיו
  choice: So sollst du zu ihm sagen
  rationale: כֹּה leitet die vorgegebene Rede ein; der Imperfekt hat hier anweisenden Sinn. Die deutsche Formulierung ist natürlich und bewahrt den verpflichtenden Charakter.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch mit »So spricht« wiedergegeben. Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Das Aufmerksamkeitssignal wird in gegenwärtigem, würdigem Deutsch wiedergegeben. »Siehe« wäre traditionssprachlich, klingt heute jedoch deutlich altertümlicher.
- source_word: אֲשֶׁר בָּנִיתִי אֲנִי הֹרֵס
  choice: was ich gebaut habe, reiße ich nieder
  rationale: Die Bau-Metaphorik bleibt erhalten; das Partizip הֹרֵס bezeichnet die im Gang befindliche beziehungsweise unmittelbar bevorstehende Handlung.
- source_word: וְאֵת אֲשֶׁר נָטַעְתִּי אֲנִי נֹתֵשׁ
  choice: und was ich gepflanzt habe, reiße ich aus
  rationale: »AUSREISSEN« bewahrt das Bild des Pflanzens und Entwurzelns sowie Jeremias wiederkehrendes Gegensatzpaar von Bauen/Pflanzen und Niederreißen/Ausreißen.
- source_word: וְאֶת כָּל הָאָרֶץ הִיא
  choice: – und zwar das ganze Land
  rationale: Die hebräische Wendung ist elliptisch und wahrscheinlich appositionell beziehungsweise verdeutlichend. »Und zwar« macht diese Funktion verständlich, ohne sie als neuen selbstständigen Satz auszugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Transliteration bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: das ganze Land
  alternative: die ganze Erde
  rationale: אֶרֶץ kann »Land« oder »Erde« bedeuten. Im unmittelbaren Gerichtskontext Jeremias liegt das Land, insbesondere Juda, näher; die lexikalisch mögliche weitere Bedeutung wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Botenformel bleibt formell; »Sieh« vermeidet das unnötig altertümliche »Siehe«. Die elliptische Schlusswendung wird mit einem Gedankenstrich und »und zwar« lesbar gemacht, ohne ihre appositionelle Funktion zu überdeuten.
