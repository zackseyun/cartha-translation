source:
  edition: WLC
  text: הַ/דָּבָ֗ר אֲשֶׁ֤ר דִּבֶּר֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֶל בָּר֖וּךְ בֶּֽן נֵֽרִיָּ֑ה בְּ/כָתְב/וֹ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֤לֶּה עַל סֵ֨פֶר֙ מִ/פִּ֣י יִרְמְיָ֔הוּ בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/001.yaml
  text: 'The word that Jeremiah the prophet spoke to Baruch son of Neriah when he wrote these words in a scroll at the mouth of Jeremiah[a], in the fourth year of Jehoiakim son of Josiah, king of Judah, saying:'
translation:
  language: de
  text: 'Das Wort, das der Prophet Jeremia zu Baruch, dem Sohn Nerijas, sprach, als dieser im vierten Jahr Jojakims, des Sohnes Josias, des Königs von Juda, diese Worte nach Jeremias Diktat[a] auf eine Schriftrolle schrieb:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »aus dem Mund Jeremias«.'
    reason: Das hebräische Sprachbild wird im Haupttext sinngemäß als mündliches Diktat wiedergegeben und hier wörtlich dokumentiert.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. In dieser prophetischen Einleitung bewahrt »das Wort« den geprägten, würdevollen Sprachgebrauch.
- source_word: דִּבֶּר
  choice: sprach
  rationale: דבר ist das gewöhnliche Verb für »sprechen«; »sprach zu« gibt die Konstruktion mit אֶל natürlich wieder.
- source_word: בְּכָתְבוֹ
  choice: als dieser … schrieb
  rationale: Die Präposition ב mit Infinitiv und Suffix bezeichnet hier den Zeitpunkt. Das Demonstrativpronomen »dieser« macht eindeutig, dass Baruch der Schreibende ist.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Im Zusammenhang von mündlicher Vorgabe und Niederschrift ist die textbezogene Bedeutung »Worte« am treffendsten.
- source_word: עַל־סֵפֶר
  choice: auf eine Schriftrolle
  rationale: סֵפֶר bezeichnet hier ein Schriftstück, wahrscheinlich eine Rolle. »Schriftrolle« vermeidet die moderne Vorstellung eines gebundenen Buches; עַל wird mit »auf« wiedergegeben.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: nach Jeremias Diktat
  rationale: Die Wendung bedeutet wörtlich »aus dem Mund Jeremias« und bezeichnet hier die mündliche Vorgabe. Die idiomatische deutsche Formulierung nennt diesen Vorgang klar; die Fußnote bewahrt das hebräische Bild.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: im vierten Jahr Jojakims
  rationale: Dies gibt die übliche hebräische Formel zur Datierung nach der Regierungszeit knapp und sachgerecht wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Formel leitet den folgenden Wortlaut ein. Im Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als ein angehängtes »indem er sagte«.
theological_decisions: []
