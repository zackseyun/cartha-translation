lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird mit der im Deutschen geläufigen und würdevollen Präsensform wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: עָלֶיךָ
  choice: über dich
  rationale: Die Präposition עַל bezeichnet hier am ehesten den Inhalt beziehungsweise Gegenstand der Botschaft, ohne eine feindselige Bedeutung festzulegen.
- source_word: בָּרוּךְ
  choice: Baruch
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als persönlichen Namen.
- issue: Bezug der Botschaft in עָלֶיךָ
  choice: über dich
  alternative: zu dir; gegen dich
  rationale: „Über dich“ bewahrt den naheliegenden sachlichen Bezug und legt die Präposition weder ausschließlich als direkte Anrede noch als feindselige Aussage aus.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dem würdevollen Klang der traditionellen prophetischen Botenformel. Die Mehrdeutigkeit der Präposition עַל wird in einer Fußnote offengehalten.
