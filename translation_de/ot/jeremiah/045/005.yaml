  text: וְ/אַתָּ֛ה תְּבַקֶּשׁ לְ/ךָ֥ גְדֹל֖וֹת אַל תְּבַקֵּ֑שׁ כִּ֡י הִנְ/נִי֩ מֵבִ֨יא רָעָ֤ה עַל כָּל בָּשָׂר֙ נְאֻם יְהוָ֔ה וְ/נָתַתִּ֨י לְ/ךָ֤ אֶֽת נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל עַ֥ל כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁ֥ר תֵּֽלֶךְ שָֽׁם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/005.yaml
  text: And you—are you seeking great things for yourself? Do not seek them, for behold, I am bringing disaster on all flesh, declares the LORD. But I will give you your life as plunder in every place where you go.
translation:
  language: de
  text: Und du – suchst du Großes für dich? Suche es nicht! Denn ich werde Unheil über alle Menschen bringen, spricht der HERR. Dir aber werde ich dein Leben als Beute geben an allen Orten, wohin du gehst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְדֹלוֹת
  choice: Großes
  rationale: Bewahrt die bewusst offene Mehrzahlform als substantivierten Sammelbegriff und legt nicht fest, ob Ansehen, Erfolg oder andere Vorteile gemeint sind.
- source_word: רָעָה
  choice: Unheil
  rationale: Bezeichnet hier das von Gott angekündigte Verderben beziehungsweise Unglück, nicht moralische Bosheit.
- source_word: כָּל־בָּשָׂר
  choice: alle Menschen
  rationale: Die idiomatische Wendung meint in diesem Zusammenhang die gesamte betroffene Menschheit; die natürliche deutsche Wiedergabe vermeidet das missverständliche wörtliche „alles Fleisch“.
- source_word: אֶת־נַפְשְׁךָ לְשָׁלָל
  choice: dein Leben als Beute
  rationale: 'Erhält das markante Bild: Baruch wird nicht umfassender Erfolg, sondern das nackte Überleben zugesagt.'
- source_word: עַל כָּל־הַמְּקֹמוֹת אֲשֶׁר תֵּלֶךְ־שָׁם
  choice: wohin du auch gehst
  rationale: Gibt die distributive Bedeutung idiomatisch und vollständig wieder.
theological_decisions:
- issue: Geltungsbereich von כָּל־בָּשָׂר
  choice: alle Menschen
  alternative: alles Fleisch
  rationale: Der anthropologische Bezug ist im Kontext naheliegend; dennoch wird keine Aussage über individuelles Endgericht oder ausnahmslose Tötung hinzugefügt.
- issue: Gottesname יהוה
  choice: der HERR
  alternative: Jahwe
  rationale: Folgt der etablierten deutschen Bibelkonvention und kennzeichnet den Eigennamen durch Kapitälchen, ohne eine unsichere Aussprache in den Haupttext zu setzen.
- issue: Charakter der Zusage an Baruch
  choice: dein Leben als Beute
  alternative: du wirst mit dem Leben davonkommen
  rationale: 'Die bildhafte und theologisch spannungsreiche Formulierung des Hebräischen bleibt erhalten: Bewahrung geschieht mitten im angekündigten Unheil, nicht als Zusage von Größe oder Wohlstand.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der eröffnende Kontrast wird mit Gedankenstrich und rhetorischer Frage wiedergegeben. „Suche es nicht!“ ist knapp und eindringlich; die Schlusswendung ist natürlich formuliert, ohne das Beutebild abzuschwächen.
