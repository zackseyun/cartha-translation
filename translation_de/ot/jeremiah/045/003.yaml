source:
  edition: WLC
  text: אָמַ֨רְתָּ֙ אֽוֹי נָ֣א לִ֔/י כִּֽי יָסַ֧ף יְהוָ֛ה יָג֖וֹן עַל מַכְאֹבִ֑/י יָגַ֨עְתִּי֙ בְּ/אַנְחָתִ֔/י וּ/מְנוּחָ֖ה לֹ֥א מָצָֽאתִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/045/003.yaml
  text: You said[a], ‘Woe is me now, for Yahweh has added sorrow to my pain. I am weary with my groaning, and I have found no rest.’
translation:
  language: de
  text: 'Du hast gesagt: »Weh mir! Denn Jahwe hat zu meinem Schmerz noch Kummer hinzugefügt. Ich bin müde von meinem Seufzen und habe keine Ruhe gefunden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: Du hast gesagt
  rationale: Das Qal Perfekt 2. Person Singular leitet Baruchs zuvor geäußerte Klage ein; im Deutschen gibt das Perfekt dies natürlich wieder.
- source_word: אֽוֹי נָא לִי
  choice: Weh mir!
  rationale: אוי ist ein Klageruf. נָא verstärkt hier wahrscheinlich den emotionalen Ausruf; eine gesonderte Wiedergabe mit »nun« wäre im Deutschen weniger natürlich und ist semantisch nicht zwingend.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für den Klageruf ein.
- source_word: יָסַף ... עַל
  choice: hat ... noch ... hinzugefügt
  rationale: יסף mit עַל bezeichnet, dass zu einer bereits bestehenden Belastung etwas Weiteres hinzukommt; »noch« macht diesen additiven Sinn natürlich deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָגוֹן
  choice: Kummer
  rationale: Das Wort bezeichnet Gram oder seelischen Kummer und bleibt so von מַכְאוֹב, »Schmerz«, unterschieden.
- source_word: מַכְאֹבִי
  choice: meinem Schmerz
  rationale: Die Singularform bezeichnet Baruchs bereits vorhandenen Schmerz oder sein Leiden; »Schmerz« wahrt die knappe Bildlichkeit.
- source_word: יָגַעְתִּי
  choice: Ich bin müde
  rationale: Das Perfekt beschreibt hier den eingetretenen und fortdauernden Zustand der Erschöpfung.
- source_word: בְּאַנְחָתִי
  choice: von meinem Seufzen
  rationale: אַנְחָה bezeichnet Seufzen oder Stöhnen. Die Präposition ב kann die begleitende Tätigkeit oder Ursache der Ermüdung ausdrücken; »von« ist im Deutschen idiomatisch.
- source_word: וּמְנוּחָה לֹא מָצָאתִי
  choice: und finde keine Ruhe
  rationale: Die deutsche Gegenwartsform gibt den aus dem Perfekt resultierenden, weiterhin bestehenden Mangel an Ruhe natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. »Jahwe« bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von Kummer und Schmerz
  choice: »zu meinem Schmerz noch Kummer hinzugefügt«
  alternative: »meinen Schmerz durch Kummer vermehrt«
  rationale: Die gewählte Fassung bewahrt das konkrete Bild des Hinzufügens und unterscheidet die beiden hebräischen Leidensbegriffe, ohne ihre genaue psychische oder körperliche Zuordnung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Klageruf bleibt knapp und eindringlich; die poetische Parallelität der Leidensbegriffe sowie der Übergang von zurückblickender Aussage zu gegenwärtig empfundener Erschöpfung werden gewahrt.
