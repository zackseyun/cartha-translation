translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer dringlichen Folge von Imperativen. Die direkte Rede bündelt den ausgerufenen Alarm. „Schofarhorn“ erhält den kulturgeschichtlich konkreten Gegenstand, während eine Fußnote ihn allgemein verständlich erklärt; die schwierige Ellipse קִרְאוּ מַלְאוּ wird im Haupttext idiomatisch, in der Fußnote jedoch als mehrdeutig kenntlich gemacht.
