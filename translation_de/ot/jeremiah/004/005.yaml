base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/005.yaml
  text: 'Declare it in Judah[a], and proclaim it in Jerusalem, and say: Blow the trumpet in the land. Cry aloud, fill the air, and say: Gather yourselves[d][c][b], and let us go into the fortified cities.'
translation:
  language: de
  text: 'Verkündet es in Juda, macht es in Jerusalem bekannt und sagt: »Blast im Land das Schofarhorn[a]! Ruft aus voller Kehle[b] und sagt: Sammelt euch! Lasst uns in die befestigten Städte gehen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schofar ist ein meist aus einem Widderhorn gefertigtes Blasinstrument, das unter anderem als Alarmsignal diente.
    reason: cultural_note
  - marker: b
    text: 'Die hebräische Wendung ist knapp und wörtlich etwa „ruft, füllt“. Gemeint sein kann: „Ruft mit voller Stimme“ oder „lasst den Alarmruf weithin erschallen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ בִיהוּדָה
  choice: Verkündet es in Juda
  rationale: Der Hifil-Imperativ von נגד fordert zu einer öffentlichen Bekanntmachung auf. Das im Hebräischen unausgesprochene Objekt wird im Deutschen natürlich mit „es“ ergänzt.
- source_word: וּבִירוּשָׁלִַם הַשְׁמִיעוּ
  choice: macht es in Jerusalem bekannt
  rationale: Der Hifil von שמע bedeutet wörtlich „lasst es hören“. „Macht es … bekannt“ gibt den kausativen Sinn in natürlichem Deutsch wieder und bewahrt die Parallele zwischen Juda und Jerusalem.
- source_word: וְתִקְעוּ שׁוֹפָר בָּאָרֶץ
  choice: Blast im Land das Schofarhorn
  rationale: שׁוֹפָר bezeichnet das als Signal- und Alarmhorn verwendete Schofar. „Blast“ erhält die konkrete Handlung, „im Land“ die lokale Weite von בָּאָרֶץ.
- source_word: קִרְאוּ מַלְאוּ
  choice: Ruft aus voller Kehle
  rationale: Die knappe, elliptische Verbindung aus „ruft“ und „füllt“ verstärkt wahrscheinlich die Lautstärke beziehungsweise Fülle des Rufes. Die deutsche Wendung gibt diese Funktion wieder, ohne ein im Hebräischen nicht genanntes Objekt wie „die Luft“ oder „das Land“ einzusetzen.
- source_word: הֵאָסְפוּ
  choice: Sammelt euch
  rationale: Der Nifal-Imperativ von אסף ist hier eine Aufforderung, sich zusammenzufinden; die reflexive Formulierung ist im Deutschen direkt und idiomatisch.
- source_word: וְנָבוֹאָה אֶל עָרֵי הַמִּבְצָר
  choice: Lasst uns in die befestigten Städte ziehen
  rationale: Der Kohortativ der ersten Person Plural drückt eine gemeinsame Aufforderung aus. בוא bezeichnet hier die Bewegung zu einem Zufluchtsort; „in … ziehen“ bringt das Aufsuchen des Schutzes innerhalb der befestigten Städte natürlich zum Ausdruck.
