source:
  edition: WLC
  text: עַל זֹ֛את חִגְר֥וּ שַׂקִּ֖ים סִפְד֣וּ וְ/הֵילִ֑ילוּ כִּ֥י לֹא שָׁ֛ב חֲר֥וֹן אַף יְהֹוָ֖ה מִמֶּֽ/נּוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/008.yaml
  text: Because of this[a], put on sackcloth; mourn and wail[b], for the burning anger of Yahweh has not turned away from us.
translation:
  language: de
  text: Darum legt Sacktuch an[a], klagt und heult! Denn Jahwes glühender Zorn hat sich nicht von uns abgewandt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Gürtet euch mit Sacktuch.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Denn Jahwes heftiger Zorn ist nicht von uns gewichen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Darum
  rationale: Die Wendung bezeichnet den Anlass beziehungsweise Grund der folgenden Aufforderungen. „Darum“ gibt diesen Zusammenhang knapp und idiomatisch wieder.
- source_word: חִגְרוּ שַׂקִּים
  choice: legt Sacktuch an
  rationale: חגר bezeichnet das Umbinden oder Anlegen, hier von Sacktuch als Zeichen der Trauer. Die Formulierung ist im heutigen Deutsch verständlich und bewahrt das konkrete Trauerzeichen.
- source_word: סִפְדוּ וְהֵילִילוּ
  choice: klagt und jammert
  rationale: ספד bezeichnet die Trauerklage, während ילל lautes Klagen oder Jammern ausdrückt. Die zwei Verben bleiben als gesteigerte Folge erhalten.
- source_word: חֲרוֹן אַף
  choice: glühender Zorn
  rationale: Die feste Verbindung bezeichnet heftigen, entbrannten Zorn. „Glühender Zorn“ bewahrt das im Hebräischen enthaltene Bild der Hitze.
- source_word: לֹא שָׁב ... מִמֶּנּוּ
  choice: hat sich nicht von uns abgewandt
  rationale: שוב bedeutet grundsätzlich „umkehren, sich wenden“. In Verbindung mit dem Zorn und מן bezeichnet es hier, dass der Zorn nicht von der Gemeinschaft gewichen ist; die Bildsprache des Sich-Abwendens bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname Gottes wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt diesen Eigennamen, während „der HERR“ ihn traditionsgemäß durch einen Titel ersetzt.
- issue: Subjekt und Reichweite der nicht abgewandten Zornglut
  choice: Jahwes Zorn hat sich nicht von „uns“ abgewandt
  alternative: Jahwe hat seinen Zorn nicht von uns abgewandt
  rationale: Im Hebräischen ist חֲרוֹן אַף יְהוָה, „Jahwes glühender Zorn“, grammatisch das Subjekt von שָׁב. Die Übersetzung erhält diese Konstruktion und macht Jahwe nicht ausdrücklich zum handelnden Subjekt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Imperative bewahren die Dringlichkeit des hebräischen Aufrufs; „Sacktuch“ erhält das antike Trauerbild, und „glühender Zorn“ die bildhafte Intensität der hebräischen Wendung.
