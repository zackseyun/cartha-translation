base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/023.yaml
  text: I looked at the earth[a], and behold, it was formless and empty; and at the heavens, and they had no light.
translation:
  language: de
  text: 'Ich schaute auf die Erde, und siehe: Sie war wüst und leer[a]; und auf den Himmel: Da war kein Licht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch tohu wabohu; auch: „öde und leer“ oder „formlos und leer“. Die Wendung greift 1. Mose 1,2 auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das Qal-Perfekt 1. Person Singular von ראה bezeichnet hier die wiederholte prophetische Wahrnehmung. „Ich sah“ ist im Deutschen natürlich und lässt sowohl Sehen als auch betrachtendes Hinschauen anklingen.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die Verbindung mit dem Himmel und der deutliche Anklang an 1. Mose 1,2 sprechen hier für die kosmische Bedeutung „Erde“, ohne den historischen Bezug auf das verwüstete Land auszuschließen.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: „Siehe“ bewahrt die hinweisende und visionäre Unmittelbarkeit von הִנֵּה. Es ist gehoben, aber im biblisch-prophetischen Sprachgebrauch weiterhin verständlich.
- source_word: תֹהוּ וָבֹהוּ
  choice: wüst und leer
  rationale: Die feststehende deutsche Wiedergabe stellt den erkennbaren Bezug zu 1. Mose 1,2 her und vermittelt zugleich Verwüstung, Leere und den Eindruck rückgängig gemachter Schöpfungsordnung.
- source_word: הַשָּׁמַיִם
  choice: zum Himmel
  rationale: Das hebräische שָׁמַיִם ist formal pluralisch, wird im modernen Standarddeutsch in dieser kosmischen Bedeutung jedoch idiomatisch als Singular „Himmel“ wiedergegeben.
- source_word: וְאֵין אוֹרָם
  choice: doch sein Licht war nicht da
  rationale: Das Suffix an אוֹרָם bezieht sich auf den Himmel. Die Formulierung gibt die Abwesenheit seines Lichts wieder, ohne zusätzlich festzulegen, ob es erloschen, entzogen oder von Anfang an nicht vorhanden war.
theological_decisions:
- issue: Anklang an 1. Mose 1,2 innerhalb einer Gerichtsankündigung
  choice: Die kosmische Entschöpfungsbildsprache wird durch „Erde“, „wüst und leer“ sowie den lichtlosen Himmel bewahrt.
  alternative: Eine ausschließlich örtliche Wiedergabe mit „Land“ und einer bloß verwüsteten Landschaft.
  rationale: תֹהוּ וָבֹהוּ und die Paarung von Erde und Himmel rufen 1. Mose 1,2 auf und stellen das Gericht als Umkehrung der Schöpfungsordnung dar. Zugleich wird nicht bestritten, dass die Vision im Zusammenhang des Kapitels die geschichtliche Verwüstung Judas betrifft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem „Siehe“. Die Satzglieder bilden die wiederholte Blickbewegung des hebräischen Textes ab; die traditionelle Wendung „wüst und leer“ macht den Schöpfungsanklang für deutschsprachige Leser unmittelbar hörbar.
