base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/019.yaml
  text: My inward parts[a], my inward parts! I writhe in pain! O walls of my heart! My heart pounds within me; I cannot keep silent, for you, my soul, have heard the sound of the trumpet[c][b], the battle cry.
translation:
  language: de
  text: Mein Inneres, mein Inneres![a] Ich winde mich vor Schmerz! O Wände meines Herzens![b] Mein Herz rast in mir; ich kann nicht schweigen. Denn du, meine Seele,[c] hast den Klang des Schofarhorns gehört, den Kriegsalarm.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „meine Eingeweide“; gemeint ist der innerste Ort der Qual.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Wände meines Herzens“; das Hebräische gebraucht ein ungewöhnliches körperliches Bild, das auch als „die Kammern meines Herzens“ gedeutet wird.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Qere-Lesung lautet: „Du hast gehört, meine Seele.“ Das Ketiv lautet: „Ich habe gehört.“'
    reason: textual_ambiguity
  - marker: d
    text: 'Oder: „den Schlachtruf“, „das Kriegsgeschrei“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעַי
  choice: mein Inneres
  rationale: Das Wort bezeichnet wörtlich die inneren Organe beziehungsweise Eingeweide und steht poetisch für den Ort tiefster körperlicher und seelischer Qual. „Mein Inneres“ bewahrt den körperlichen Bezug, ohne im heutigen Deutsch unnötig derb oder altertümlich zu wirken; die Wiederholung bleibt erhalten.
- source_word: אחולה
  choice: ich winde mich vor Schmerz
  rationale: Die Form bezeichnet qualvolles Sichwinden, teils mit dem Bild von Geburtswehen. Die Wiedergabe bringt die körperliche Heftigkeit deutlicher zum Ausdruck als das allgemeinere „ich leide“.
- source_word: קִירוֹת לִבִּי
  choice: O Wände meines Herzens
  rationale: קִירוֹת bedeutet wörtlich „Wände“. Das ungewöhnliche Körperbild wird bewusst nicht zu „Herzkammern“ geglättet; „O“ kennzeichnet den abrupten Ausruf.
- source_word: הֹמֶה לִּי לִבִּי
  choice: mein Herz rast in mir
  rationale: המה bezeichnet lärmende Unruhe, Aufruhr oder heftige Bewegung. Im Zusammenhang körperlicher Angst gibt „rast“ die innere Erregung natürlich und anschaulich wieder.
- source_word: לֹא אַחֲרִישׁ
  choice: ich kann nicht schweigen
  rationale: Die Form kann sowohl fehlende Fähigkeit als auch fehlende Bereitschaft zum Schweigen ausdrücken. Hier legt der leidenschaftliche Klageruf die situationsbedingte Unmöglichkeit nahe.
- source_word: קוֹל שׁוֹפָר
  choice: der Klang des Schofarhorns
  rationale: קוֹל ist „Stimme, Laut, Klang“, שׁוֹפָר das als Signalhorn verwendete Widderhorn. „Schofarhorn“ erhält den konkreten kulturellen Gegenstand und vermeidet die ungenaue Gleichsetzung mit einer modernen Trompete.
- source_word: שמעתי נַפְשִׁי
  choice: du, meine Seele, hast … gehört
  rationale: Die überlieferte Lesetradition versteht die Verbform als zweite Person feminin und נַפְשִׁי als angeredete „Seele“. So bleibt die abrupte Selbstanrede erhalten; die alternative Auffassung als betontes Subjekt wird in der Fußnote genannt.
- source_word: תְּרוּעַת מִלְחָמָה
  choice: den Kriegsalarm
  rationale: תְּרוּעָה kann einen lauten Ruf, ein Signal oder einen Alarm bezeichnen. In Verbindung mit Krieg passt „Kriegsalarm“ eng zum vorausgehenden Schofarhorn; „Schlachtruf“ bleibt eine mögliche Alternative.
