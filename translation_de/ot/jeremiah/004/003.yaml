    issue: „unbestellter Boden“ ist semantisch etwas zu weit.
    rationale: Die Formulierung kann Boden bezeichnen, der bloß nicht bestellt bzw. nicht besät ist; נִיר zielt im Kontext auf brachliegendes bzw. erst noch aufzubrechendes Land. „Brachland“ macht die erforderliche Bodenvorbereitung klarer, ohne die Metapher auszudeuten.
  - severity: low
    issue: „Männer von Juda“ ist weniger idiomatisch als „Männer Judas“.
    rationale: Beide Formulierungen sind verständlich und quellentreu, doch der Genitiv ist im Deutschen bei der Bezeichnung des Landes bzw. Gebietes Juda natürlicher.
