  text: כִּי כֹ֣ה אָמַ֣ר יְהֹוָ֗ה לְ/אִ֤ישׁ יְהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם נִ֥ירוּ לָ/כֶ֖ם נִ֑יר וְ/אַֽל תִּזְרְע֖וּ אֶל קוֹצִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/003.yaml
  text: 'For thus says Yahweh to the men of Judah and to Jerusalem: Break up for yourselves unplowed ground[a], and do not sow among thorns.'
translation:
  language: de
  text: 'Denn so spricht der HERR zu den Männern Judas und zu Jerusalem: Brecht euch Brachland um[a] und sät nicht unter Dornen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Brecht euch unbestellten Boden um.“ Das Hebräische bezeichnet Boden, der vor der Aussaat erst aufgebrochen werden muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: der HERR
  rationale: Die Wiedergabe mit „der HERR“ folgt der im Deutschen verbreiteten ehrfürchtigen Lesetradition für den Gottesnamen JHWH; die Großschreibung kennzeichnet den besonderen Namen.
- source_word: לְאִישׁ יְהוּדָה
  choice: zu den Männern von Juda
  rationale: Das formal singularische אִישׁ ist hier kollektiv gebraucht. „Männer von Juda“ bewahrt diese Form und die männliche Bezeichnung, ohne einen einzelnen Mann anzunehmen.
- source_word: וְלִירוּשָׁלִַם
  choice: und zu Jerusalem
  rationale: Die Stadt wird wie im Hebräischen unmittelbar angeredet und steht metonymisch für ihre Bewohner; eine erklärende Erweiterung ist nicht nötig.
- source_word: נִירוּ
  choice: Brecht … um
  rationale: Das Verb bezeichnet das Aufbrechen beziehungsweise Bearbeiten von Boden. „Umbrechen“ ist im Deutschen eine natürliche landwirtschaftliche Bezeichnung und erhält den Imperativ.
- source_word: נִיר
  choice: unbestellten Boden
  rationale: Das Substantiv bezeichnet Boden, der vor der Aussaat erst aufgebrochen beziehungsweise bearbeitet werden muss. „Unbestellter Boden“ ist verständlich und hält die landwirtschaftliche Bildsprache fest.
- source_word: לָכֶם
  choice: euch
  rationale: Das Dativpronomen wird mit „euch“ ausdrücklich wiedergegeben und bewahrt den Bezug auf die Angeredeten, ohne im Deutschen das stärkere „für euch selbst“ erzwingen zu müssen.
- source_word: וְאַל תִּזְרְעוּ
  choice: und sät nicht
  rationale: זָרַע bezeichnet spezifisch das Säen; die deutsche Form bewahrt sowohl die landwirtschaftliche Bedeutung als auch das Verbot.
- source_word: אֶל קוֹצִים
  choice: unter Dornen
  rationale: Bei der Aussaat bezeichnet אֶל hier die Richtung in einen von Dornen bewachsenen Bereich. „Unter Dornen“ ist idiomatisch und erhält das Bild.
theological_decisions:
- issue: Metaphorische Bedeutung der landwirtschaftlichen Aufforderungen
  choice: Die landwirtschaftliche Bildsprache bleibt im Haupttext ohne ausdrückliche Deutung stehen.
  alternative: Die Aufforderungen als Umkehr oder innere Vorbereitung paraphrasieren.
  rationale: Der hebräische Text formuliert das Bild selbst, nicht dessen geistliche Auslegung. Die direkte Wiedergabe bewahrt die Offenheit und vermeidet eine in den Vers eingefügte theologische Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede Jerusalems und die knappe prophetische Befehlsform bleiben erhalten; die Fußnote erklärt die mögliche landwirtschaftliche Fachbezeichnung.
