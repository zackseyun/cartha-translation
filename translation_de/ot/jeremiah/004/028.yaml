id: JER.4.28
reference: Jeremiah 4:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל זֹאת֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/קָדְר֥וּ הַ/שָּׁמַ֖יִם מִ/מָּ֑עַל עַ֤ל כִּי דִבַּ֨רְתִּי֙ זַמֹּ֔תִי וְ/לֹ֥א נִחַ֖מְתִּי וְ/לֹא אָשׁ֥וּב מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/028.yaml
  text: Because of this the earth will mourn[a], and the heavens above will grow dark, because I have spoken, I have purposed, and I have not relented[c][b], nor will I turn back from it.
translation:
  language: de
  text: Darum wird die Erde trauern[a], und der Himmel droben wird sich verfinstern. Denn ich habe gesprochen und es beschlossen[b]; ich habe es mir nicht anders überlegt[c] und werde nicht davon abrücken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land wird trauern“. Das hebräische Wort kann sowohl „Erde“ als auch „Land“ bedeuten; der parallele Hinweis auf den Himmel spricht hier für die weitere Bedeutung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „es geplant“ beziehungsweise „es fest vorgehabt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ich habe nicht eingelenkt“ beziehungsweise „es hat mich nicht gereut“. Gemeint ist hier, dass Gott von dem angekündigten Gericht nicht Abstand nimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Darum
  rationale: Die Wendung bezeichnet hier den Grund beziehungsweise die Folge des angekündigten Gerichts. „Darum“ gibt diesen Zusammenhang im Deutschen knapp und natürlich wieder.
- source_word: תֶּאֱבַל
  choice: wird … trauern
  rationale: אבל bezeichnet Trauer oder Klage. Die Wiedergabe bewahrt die poetische Personifikation der Erde.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Der Parallelismus mit dem Himmel legt hier die weitere, kosmische Bedeutung nahe, ohne den Bezug auf Juda auszuschließen.
- source_word: וְקָדְרוּ
  choice: wird sich verfinstern
  rationale: קדר beschreibt hier das Dunkelwerden. „Sich verfinstern“ ist idiomatisch und erhält das kosmische Bild.
- source_word: הַשָּׁמַיִם מִמָּעַל
  choice: der Himmel droben
  rationale: Der deutsche Kollektivsingular „Himmel“ gibt שָׁמַיִם natürlich wieder; „droben“ bewahrt die Ortsangabe מִמָּעַל und den gehobenen poetischen Ton.
- source_word: דִבַּרְתִּי
  choice: ich habe gesprochen
  rationale: Die Formulierung wahrt die feierliche Sprache einer verbindlichen göttlichen Erklärung.
- source_word: זַמֹּתִי
  choice: es beschlossen
  rationale: זמם bezeichnet einen gefassten Plan oder festen Entschluss. „Beschlossen“ bringt die Entschiedenheit im gegenwärtigen Kontext prägnant zum Ausdruck.
- source_word: וְלֹא נִחַמְתִּי
  choice: ich habe es mir nicht anders überlegt
  rationale: נחם bezeichnet hier das Abstandnehmen von einem angekündigten Handeln, nicht moralische Reue. Die Formulierung ist modernes Deutsch und bewahrt den Gedanken eines unveränderten Entschlusses.
- source_word: וְלֹא אָשׁוּב מִמֶּנָּה
  choice: und werde nicht davon abrücken
  rationale: שׁוב mit מן bezeichnet das Zurückkehren oder Abgehen von einem eingeschlagenen Weg. „Davon abrücken“ wahrt das Bild eines feststehenden Vorhabens, ohne den Bezug des femininen Suffixes enger festzulegen.
theological_decisions:
- issue: Bedeutung von נחם in Bezug auf Gottes angekündigtes Gericht
  choice: ich habe es mir nicht anders überlegt
  alternative: ich habe nicht eingelenkt / es hat mich nicht gereut
  rationale: Im Zusammenhang geht es darum, dass Gott von dem angekündigten Gericht nicht Abstand nimmt. Die gewählte Fassung vermeidet die irreführende Vorstellung eines Eingeständnisses moralischer Schuld, ohne die Aussage zu einer abstrakten Lehre über Gottes Wesen auszubauen.
- issue: Reichweite von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Der unmittelbare Kontext betrifft Juda, doch die Gegenüberstellung von Erde und Himmel gibt der poetischen Darstellung kosmische Weite. Eine Fußnote erhält die engere lexikalische Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Bildsprache. „Droben“ ist bewusst leicht gehoben, aber allgemein verständlich. Die Satzglieder folgen eng der hebräischen Steigerung von göttlichem Wort, Entschluss und unwiderrufenem Handeln.
