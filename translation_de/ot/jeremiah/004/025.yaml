source:
  edition: WLC
  text: רָאִ֕יתִי וְ/הִנֵּ֖ה אֵ֣ין הָ/אָדָ֑ם וְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם נָדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/025.yaml
  text: I looked[a], and behold, there was no man, and all the birds of the heavens had fled.
translation:
  language: de
  text: 'Ich schaute, und siehe: Kein Mensch war da, und alle Vögel des Himmels waren geflohen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich schaute
  rationale: Das Qal Perfekt 1. Person Singular von ראה kann „ich sah“ oder „ich schaute“ bedeuten. Im wiederkehrenden visionären Ablauf bringt „ich schaute“ das aufmerksame Betrachten der Szene natürlich zum Ausdruck.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit unmittelbar auf das Wahrgenommene. „Und siehe“ bewahrt die lebendige, prophetische Ausdrucksweise und bleibt im Deutschen verständlich.
- source_word: אֵין הָאָדָם
  choice: Kein Mensch war da
  rationale: אֵין verneint die Existenz beziehungsweise Anwesenheit; הָאָדָם steht hier als generischer Singular. „Kein Mensch war da“ gibt diesen Sinn idiomatisch wieder, ohne ihn auf einen Mann zu beschränken.
- source_word: וְכָל עוֹף הַשָּׁמַיִם
  choice: und alle Vögel des Himmels
  rationale: עוֹף bezeichnet hier kollektiv die Vögel; die traditionelle Wendung „Vögel des Himmels“ bildet den hebräischen Ausdruck prägnant und würdig ab.
- source_word: נָדָדוּ
  choice: waren geflohen
  rationale: נדד bezeichnet das Fortziehen, Umherwandern oder Fliehen. In der geschilderten verwüsteten Landschaft vermittelt „waren geflohen“ klar, dass die Vögel den Ort bereits verlassen hatten.
theological_decisions:
- issue: Generischer Sinn von הָאָדָם
  choice: Kein Mensch war da
  alternative: Die Menschheit war nicht mehr da
  rationale: Der hebräische Ausdruck ist ein generischer Singular. Das deutsche „kein Mensch“ bewahrt sowohl die Einzahlform als auch den umfassenden Sinn und ist nicht männlich exklusiv; „die Menschheit“ wäre abstrakter und würde die Bildhaftigkeit abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und siehe“ erhält bewusst den prophetisch-visionären Ton; die übrige Formulierung ist schlicht und unmittelbar.
