  terminology: „Mensch“ ist hier gegenüber einem männlich verengenden „Mann“ sachgerecht, da הָאָדָם generisch gebraucht wird. „Vögel des Himmels“ bewahrt die bildhafte hebräische Wendung ohne unnatürlich zu wirken. Es sind keine theologisch belasteten oder konfessionell lenkenden Begriffe eingeführt.
