source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יֵאָמֵ֤ר לָֽ/עָם הַ/זֶּה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם ר֣וּחַ צַ֤ח שְׁפָיִים֙ בַּ/מִּדְבָּ֔ר דֶּ֖רֶךְ בַּת עַמִּ֑/י ל֥וֹא לִ/זְר֖וֹת וְ/ל֥וֹא לְ/הָבַֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/011.yaml
  text: 'At that time it will be said to this people and to Jerusalem: “A scorching wind from the bare heights in the wilderness comes toward the daughter of my people—not for winnowing and not for cleansing.”'
translation:
  language: de
  text: 'Zu jener Zeit wird man zu diesem Volk und zu Jerusalem sagen: »Ein glühend heißer Wind kommt von den kahlen Höhen in der Wüste auf die Tochter meines Volkes zu – nicht zum Worfeln und nicht zum Reinigen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רוּחַ צַח
  choice: ein glühend heißer Wind
  rationale: רוּחַ bezeichnet hier einen Wind; צַח beschreibt ihn als ausgedörrt, trocken bzw. sengend. »Glühend heiß« gibt die bedrohliche Wüstenhitze natürlich und anschaulich wieder.
- source_word: שְׁפָיִים
  choice: kahle Höhen
  rationale: Das Wort bezeichnet unbewachsene, exponierte Höhen oder Hügel und wird deshalb nicht verallgemeinernd nur mit »Höhen« wiedergegeben.
- source_word: דֶּרֶךְ בַּת עַמִּי
  choice: kommt … auf die Tochter meines Volkes zu
  rationale: דֶּרֶךְ kann eine Richtung bzw. Bewegung auf etwas zu ausdrücken. Die poetische Personifikation »Tochter meines Volkes« bleibt erhalten.
- source_word: לִזְרוֹת
  choice: zum Worfeln
  rationale: Gemeint ist das Aussieben von Getreide mithilfe des Windes. Der sachlich genaue traditionelle Ausdruck ist im Zusammenhang verständlich.
- source_word: לְהָבַר
  choice: zum Reinigen
  rationale: Die Form bezeichnet das Säubern bzw. Reinigen des Getreides. Die Übersetzung wahrt den landwirtschaftlichen Bildbereich und die Parallelität.
theological_decisions:
- issue: Funktion des Windes als Gerichtsbild
  choice: 'Die Aussage bleibt bildhaft: Der Wind dient ausdrücklich weder dem Worfeln noch dem Reinigen.'
  alternative: Den Wind unmittelbar als vernichtendes göttliches Gericht auszudeuten.
  rationale: Der Vers selbst entfaltet die Deutung noch nicht vollständig. Die Übersetzung bewahrt daher die Spannung zwischen dem landwirtschaftlichen Bild und der angekündigten Bedrohung.
- issue: »Tochter meines Volkes«
  choice: Die Personifikation wird wörtlich bewahrt.
  alternative: »mein Volk« oder »die Bewohner meines Volkes«.
  rationale: Die ungewöhnliche poetische Formulierung ist theologisch und rhetorisch bedeutsam und sollte nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Bewegung des Hebräischen wird natürlich wiedergegeben, während die poetischen Bilder und die doppelte Verneinung erhalten bleiben.
