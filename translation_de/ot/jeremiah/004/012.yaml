source:
  edition: WLC
  text: ר֧וּחַ מָלֵ֛א מֵ/אֵ֖לֶּה יָ֣בוֹא לִ֑/י עַתָּ֕ה גַּם אֲנִ֛י אֲדַבֵּ֥ר מִשְׁפָּטִ֖ים אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/012.yaml
  text: A wind too full for these will come for me[b][a]; now I myself will also speak judgments against them.
translation:
  language: de
  text: Ein Wind, der dafür zu stark ist, wird zu mir kommen[a]. Nun werde auch ich Urteile über sie verkünden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein voller/starker Wind wird von diesen her zu mir kommen«; auch »wird für mich kommen«. Die knappe hebräische Formulierung lässt offen, ob der Ausdruck einen Vergleich (»zu stark dafür«), Herkunft oder Bezug/Zugehörigkeit bezeichnet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Nun werde auch ich Rechtssprüche gegen sie aussprechen«; sinngemäß: »Nun werde auch ich mit ihnen ins Gericht gehen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: Wind
  rationale: Der unmittelbare Zusammenhang beschreibt einen von den kahlen Höhen kommenden Wind; daher ist hier die meteorologische Bedeutung gemeint, nicht »Geist« oder »Atem«.
- source_word: מָלֵא
  choice: zu gewaltig
  rationale: Wörtlich bedeutet das Adjektiv »voll«. Im Zusammenhang bezeichnet es einen Wind, dessen Stärke über das zum Worfeln oder Reinigen geeignete Maß hinausgeht. »Zu gewaltig« gibt diese implizite Intensität in natürlichem Deutsch wieder.
- source_word: מֵאֵלֶּה
  choice: für all das
  rationale: Die knappe Verbindung von מִן mit dem Demonstrativ kann Vergleich, Herkunft oder Bezug ausdrücken. Im Kontext verweist sie wahrscheinlich auf die im vorigen Vers genannten Zwecke; die Formulierung bleibt bewusst allgemein.
- source_word: יָבוֹא לִי
  choice: wird in meinem Auftrag kommen
  rationale: Wörtlich heißt die Wendung »wird zu/für mich kommen«. Im Zusammenhang göttlicher Gerichtsankündigung liegt nahe, dass der Wind Gott zur Verfügung steht oder in seinem Auftrag kommt. Eine Fußnote bewahrt die wörtlich-direktionale Alternative.
- source_word: עַתָּה
  choice: Nun
  rationale: Das gewöhnliche Zeitadverb markiert den Übergang von der Windmetapher zur ausdrücklichen Gerichtsankündigung.
- source_word: גַּם אֲנִי
  choice: auch ich
  rationale: Die Verbindung betont den Sprecher und enthält zugleich einen hinzufügenden Sinn. »Auch ich« gibt beides knapp und idiomatisch wieder.
- source_word: אֲדַבֵּר
  choice: werde … verkünden
  rationale: Das Verb bedeutet grundsätzlich »reden/sprechen«. Mit »Gerichtsurteile« als Objekt ist »verkünden« im Deutschen natürlicher, ohne den gerichtlichen Gehalt über das Objekt hinaus wesentlich zu verstärken.
- source_word: מִשְׁפָּטִים
  choice: Gerichtsurteile
  rationale: Der Plural bezeichnet hier konkrete richterliche Entscheidungen beziehungsweise Strafurteile, nicht die abstrakte »Gerechtigkeit«.
- source_word: אוֹתָם
  choice: gegen sie
  rationale: Formal steht der Akkusativmarker mit dem Pronomen »sie«. Bei der deutschen Verbindung »Gerichtsurteile verkünden« macht »gegen sie« die im Kontext eindeutige nachteilige Ausrichtung idiomatisch deutlich.
theological_decisions:
- issue: Bezug des Sprechers bei לִי und גַּם אֲנִי
  choice: 'Der HERR spricht: Der vernichtende Wind kommt in seinem Auftrag, und er selbst kündigt die Gerichtsurteile an.'
  alternative: Der Prophet könnte in einem Teil des Verses in der ersten Person sprechen; außerdem kann לִי rein direktional als »zu mir« verstanden werden.
  rationale: Der größere Zusammenhang setzt die göttliche Gerichtsrede fort. Der Text fügt jedoch keine ausdrückliche Sprecherbezeichnung ein; deshalb wird auch in der Übersetzung kein erläuterndes »spricht der HERR« ergänzt.
- issue: Gerichtliche Bedeutung von אֲדַבֵּר מִשְׁפָּטִים
  choice: »Gerichtsurteile … verkünden«
  alternative: »mit ihnen ins Gericht gehen« oder »Rechtssprüche gegen sie aussprechen«
  rationale: Die gewählte Formulierung bewahrt das Sprechen als ausdrücklichen Akt und gibt zugleich den konkreten gerichtlichen Sinn des Plurals מִשְׁפָּטִים wieder, ohne das Bild in eine bestimmte juristische Szene umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlich knappe Windformulierung des Hebräischen wird im Haupttext verständlich wiedergegeben, während die echte syntaktische und semantische Mehrdeutigkeit in Fußnote [a] erhalten bleibt. »Gerichtsurteile« wahrt den konkreten forensischen Ton des Plurals.
