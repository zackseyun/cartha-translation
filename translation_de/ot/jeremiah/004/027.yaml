source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה שְׁמָמָ֥ה תִהְיֶ֖ה כָּל הָ/אָ֑רֶץ וְ/כָלָ֖ה לֹ֥א אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/027.yaml
  text: 'For thus says Yahweh: The whole land will be a desolation[b][a], yet I will not make a full end.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Das ganze Land[a] wird zur Einöde; doch ich werde es nicht völlig vernichten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Erde“. Das hebräische אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Hier ist wegen des Gerichts über Juda „Land“ bevorzugt; die umgebende Bildsprache kann jedoch eine umfassendere, kosmische Verwüstung anklingen lassen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „doch ich werde kein vollständiges Ende machen/bereiten“. Das Hebräische hält die Spannung zwischen verheerendem Gericht und Jahwes Weigerung fest, eine vollständige Vernichtung herbeizuführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die göttliche Begründung der vorausgehenden Vision ein und entspricht dem hebräischen Zusammenhang natürlich.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Bewahrt die geläufige prophetische Botenformel in würdigem, verständlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שְׁמָמָה תִהְיֶה
  choice: wird zur Einöde werden
  rationale: Gibt das prädikative Substantiv שְׁמָמָה und den zukünftigen Eintritt des Zustands idiomatisch wieder.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: Der unmittelbare Kontext betrifft das Gericht über Juda; zugleich bleibt die mögliche weitere Bedeutung von אֶרֶץ in einer Fußnote erhalten.
- source_word: וְכָלָה לֹא אֶעֱשֶׂה
  choice: doch ich werde ihm kein völliges Ende bereiten
  rationale: Bewahrt die Spannung zwischen umfassender Verwüstung und der Verneinung einer vollständigen Vernichtung; das ergänzte Pronomen macht den deutschen Bezug verständlich.
theological_decisions:
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Im unmittelbaren Zusammenhang steht Juda unter Gericht. Die kosmisch anmutende Bildsprache des Abschnitts lässt jedoch auch die weitere Lesart „Erde“ anklingen, die deshalb in der Fußnote genannt wird.
- issue: Aussage von וְכָלָה לֹא אֶעֱשֶׂה
  choice: doch ich werde ihm kein völliges Ende bereiten
  alternative: doch ich werde es nicht völlig vernichten
  rationale: Die gewählte Fassung bleibt nahe am hebräischen Idiom und löst die theologische Spannung zwischen schwerem Gericht und verweigerter Totalvernichtung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt bewusst gehoben; „Einöde“ ist anschaulich und geläufig. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Aussage.
