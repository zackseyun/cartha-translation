id: JER.4.20
reference: Jeremiah 4:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שֶׁ֤בֶר עַל שֶׁ֨בֶר֙ נִקְרָ֔א כִּ֥י שֻׁדְּדָ֖ה כָּל הָ/אָ֑רֶץ פִּתְאֹם֙ שֻׁדְּד֣וּ אֹהָלַ֔/י רֶ֖גַע יְרִיעֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/020.yaml
  text: Disaster upon disaster is proclaimed[a], for the whole land is devastated. Suddenly my tents are devastated[b], my curtains in a moment.
translation:
  language: de
  text: Unheil über Unheil wird ausgerufen, denn das ganze Land[a] ist verwüstet. Plötzlich sind meine Zelte verwüstet, in einem Augenblick meine Zeltbahnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ganze Erde“. Das hebräische Wort אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten; hier spricht der Zusammenhang eher für das vom Gericht betroffene Land.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind die Stoffbahnen beziehungsweise Behänge der Zelte; das Bild zeigt eine Wohnstätte, die in kürzester Zeit zerstört wird.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁבֶר עַל שֶׁבֶר
  choice: Unheil über Unheil
  rationale: Die Wiederholung bezeichnet eine Häufung schwerer Unglücksfälle beziehungsweise Verwüstungen. „Unheil über Unheil“ gibt diese Steigerung natürlich wieder, ohne עַל rein zeitlich als „nach“ festzulegen.
- source_word: נִקְרָא
  choice: wird ausgerufen
  rationale: Der Niphal von קרא bezeichnet hier das öffentliche Ausrufen oder Bekanntwerden der Unglücksbotschaft. Die passive Form des Hebräischen bleibt erhalten.
- source_word: שֻׁדְּדָה / שֻׁדְּדוּ
  choice: ist/sind verwüstet
  rationale: שׁדד kann Plünderung und gewaltsame Verheerung bezeichnen. Im Blick auf Land und Zelte deckt „verwüstet“ die gemeinsame Folge ab und wahrt die Wiederholung desselben Verbs.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Zusammenhang von Jeremia 4 legt das von Gericht betroffene Land nahe; die weitere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Die übliche adverbiale Wiedergabe bringt die unvermittelte Zerstörung klar zum Ausdruck.
- source_word: אֹהָלַי
  choice: meine Zelte
  rationale: Die konkrete Wohnbildsprache des hebräischen Textes bleibt unverändert stehen.
- source_word: רֶגַע
  choice: in einem Augenblick
  rationale: Der Ausdruck bezeichnet hier eine äußerst kurze Zeitspanne und verstärkt das vorausgehende „plötzlich“.
- source_word: יְרִיעֹתַי
  choice: meine Zeltbahnen
  rationale: יְרִיעוֹת sind die Stoffbahnen beziehungsweise Behänge eines Zeltes. „Zeltbahnen“ macht den sachlichen Bezug im Deutschen unmittelbar verständlich.
theological_decisions:
- issue: Bedeutungsumfang von הָאָרֶץ
  choice: das ganze Land
  alternative: die ganze Erde
  rationale: Das unmittelbare Umfeld handelt vom Gericht über Juda und Jerusalem, weshalb „Land“ wahrscheinlich ist. Da die hebräische Bezeichnung auch „Erde“ bedeuten und im Kapitel umfassendere Anklänge haben kann, wird diese Möglichkeit nicht ausgeschlossen, sondern angemerkt.
- issue: Bezug der ersten Person in „meine Zelte / meine Zeltbahnen“
  choice: Die Bildsprache und die grammatische erste Person bleiben ohne ausdrückliche Identifizierung stehen.
  alternative: Explizite Deutung als Wohnungen des Volkes, Judas oder des Propheten
  rationale: Der Vers selbst benennt den Sprecher beziehungsweise den genauen bildlichen Bezug nicht eindeutig. Eine Präzisierung im Haupttext würde die poetische und theologische Spannung unnötig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit dichterischer Würde. Die knappe Parallelstruktur und die Wiederholung von „verwüstet“ bilden die hebräische Klage nach; „Zeltbahnen“ ist präziser und im Zusammenhang verständlicher als das missverständliche allgemeine „Vorhänge“.
