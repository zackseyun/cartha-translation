source:
  edition: WLC
  text: כִּ֛י ק֥וֹל מַגִּ֖יד מִ/דָּ֑ן וּ/מַשְׁמִ֥יעַ אָ֖וֶן מֵ/הַ֥ר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/015.yaml
  text: For a voice is declaring from Dan[b][a], and proclaiming disaster from the hill country of Ephraim.
translation:
  language: de
  text: Denn eine Stimme meldet aus Dan und kündigt Unheil[a] vom Bergland Ephraim[b] her an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Not“ oder „Unglück“; das hebräische Wort kann in anderen Zusammenhängen auch „Bosheit“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „vom Berg Ephraim“; wahrscheinlich ist das Bergland der Region Ephraim gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung beziehungsweise Erklärung zur vorausgehenden Warnung ein.
- source_word: קוֹל
  choice: eine Stimme
  rationale: Die wörtliche Bildhaftigkeit des Hebräischen bleibt erhalten; gemeint ist die hörbare Stimme einer Botschaft.
- source_word: מַגִּיד
  choice: meldet
  rationale: Das Partizip beschreibt anschaulich ein gegenwärtiges Verkünden. Das finite Präsens gibt diese Unmittelbarkeit im Deutschen natürlich wieder.
- source_word: מִדָּן
  choice: aus Dan
  rationale: Dan ist ein Ortsname; „aus“ bezeichnet idiomatisch den Ausgangsort der Meldung.
- source_word: וּמַשְׁמִיעַ
  choice: kündigt … an
  rationale: Die Kausativform bedeutet wörtlich „hören lassen“ und bezeichnet hier eine öffentliche Bekanntmachung. „ankündigen“ bildet zusammen mit „Unheil“ eine natürliche deutsche Wendung.
- source_word: אָוֶן
  choice: Unheil
  rationale: Das Wort kann je nach Zusammenhang auch Mühsal, Not oder Bosheit bezeichnen. Im Kontext der herannahenden militärischen Bedrohung steht die Bedeutung Unheil beziehungsweise Katastrophe im Vordergrund.
- source_word: מֵהַר אֶפְרָיִם
  choice: vom Bergland Ephraim her
  rationale: Die singularische geografische Wendung bezeichnet wahrscheinlich die Bergregion Ephraims; „Bergland“ ist im Deutschen klarer als die missverständliche Wiedergabe als einzelner Berg.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Partizipien werden als anschauliche Präsensformen wiedergegeben; der Parallelismus zwischen „meldet“ und „kündigt … an“ bleibt erhalten.
