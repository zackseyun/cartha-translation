  text: עַד מָתַ֖י אֶרְאֶה נֵּ֑ס אֶשְׁמְעָ֖ה ק֥וֹל שׁוֹפָֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/021.yaml
  text: How long must I see the signal flag and hear the sound of the trumpet?[a][b]
translation:
  language: de
  text: Wie lange muss ich noch das Signalzeichen sehen und den Klang des Schofarhorns hören?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Banner“, „Feldzeichen“ oder einfach „Signal“. Das hebräische Wort bezeichnet ein weithin sichtbares, erhöhtes Zeichen, häufig ein militärisches Signal.
    reason: lexical_alternative
  - marker: b
    text: Ein Schofar ist ein Horn, oft ein Widderhorn, das unter anderem als Warn- oder Versammlungssignal verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Klagefrage; sie bewahrt deren rhetorische Dringlichkeit.
- source_word: אֶרְאֶה
  choice: muss ich noch … sehen
  rationale: Der Imperfekt bezeichnet im Klagezusammenhang ein anhaltend ertragenes Geschehen. „muss ich noch“ gibt Belastung und Fortdauer idiomatisch wieder.
- source_word: נֵּס
  choice: Signalzeichen
  rationale: נֵס bezeichnet hier ein erhöhtes sichtbares Zeichen, besonders ein militärisches Signal. „Signalzeichen“ stellt die Funktion heraus, ohne die konkrete Form vorschnell auf Fahne oder Banner festzulegen.
- source_word: אֶשְׁמְעָה
  choice: und … hören
  rationale: Das Modalverb „muss“ gilt im Deutschen gemeinsam für beide koordinierten Verben; so bleibt die fortdauernde Bedrängnis erkennbar, ohne schwerfällige Wiederholung.
- source_word: קוֹל
  choice: den Klang
  rationale: In Verbindung mit שׁוֹפָר bezeichnet קוֹל den hörbaren Ton beziehungsweise Schall.
- source_word: שׁוֹפָר
  choice: Schofarhorn
  rationale: Die kulturgeschichtlich konkrete Bezeichnung vermeidet die mögliche moderne Assoziation einer metallenen Trompete und bleibt dennoch für heutige Leser verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Klagefrage und die parallele Wahrnehmung des sichtbaren und hörbaren Kriegssignals bleiben erhalten.
