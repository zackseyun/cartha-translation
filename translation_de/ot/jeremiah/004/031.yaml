source:
  edition: WLC
  text: כִּי֩ ק֨וֹל כְּ/חוֹלָ֜ה שָׁמַ֗עְתִּי צָרָה֙ כְּ/מַבְכִּירָ֔ה ק֧וֹל בַּת צִיּ֛וֹן תִּתְיַפֵּ֖חַ תְּפָרֵ֣שׂ כַּפֶּ֑י/הָ אֽוֹי נָ֣א לִ֔/י כִּֽי עָיְפָ֥ה נַפְשִׁ֖/י לְ/הֹרְגִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/031.yaml
  text: 'For I have heard a sound like a woman in labor[a], distress like one giving birth to her first child— the sound of Daughter Zion gasping for breath, spreading out her hands: “Woe is me[c][b], for my life is faint before killers.”'
translation:
  language: de
  text: 'Denn ich höre einen Laut[a] wie von einer Frau in den Wehen, eine Bedrängnis wie bei einer Frau, die ihr erstes Kind zur Welt bringt[b] – die Stimme der Tochter Zion, die nach Atem ringt und ihre Hände ausbreitet: »Weh mir! Mein Leben[c] erlahmt vor den Mördern.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier dasselbe Wort wie später bei „Stimme“; es kann „Laut“, „Stimme“ oder „Schrei“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie eine, die zum ersten Mal gebiert“; die erste Geburt steht hier für besonders heftige Wehen.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „Meine Seele ist erschöpft.“ Das hebräische Wort kann „Seele“, „Selbst“ oder „Leben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Laut / Stimme
  rationale: Die erste Nennung bezeichnet zunächst das Gehörte und wird daher mit „Laut“ wiedergegeben; bei der personifizierten Tochter Zion ist „Stimme“ im Deutschen natürlicher. Eine Fußnote weist auf die Wiederholung desselben hebräischen Wortes hin.
- source_word: כְחוֹלָה
  choice: wie von einer Frau in den Wehen
  rationale: Im prophetischen Zusammenhang bezeichnet die Form das Sichwinden in Geburtswehen und wird durch die folgende Erstgeburt eindeutig in diese Bildwelt gestellt.
- source_word: צָרָה
  choice: Angst
  rationale: Das Wort umfasst Bedrängnis und qualvolle Not. „Angst“ fügt sich natürlich in das Geburtsbild ein, ohne die körperliche und seelische Not voneinander zu trennen.
- source_word: כְמַבְכִּירָה
  choice: wie bei einer Frau, die ihr erstes Kind zur Welt bringt
  rationale: Die Form bezeichnet eine Frau bei ihrer ersten Geburt. Die explizite Wiedergabe bewahrt die Steigerung des Wehenbildes und ist in modernem Deutsch klar.
- source_word: בַּת צִיּוֹן
  choice: Tochter Zion
  rationale: Die knappe traditionelle Bezeichnung bewahrt die poetische Personifikation Zions beziehungsweise Jerusalems.
- source_word: תִּתְיַפֵּחַ
  choice: sie ringt nach Atem
  rationale: Das Verb schildert keuchendes, mühsames Atmen. „Nach Atem ringen“ ist anschaulich und im Deutschen idiomatisch.
- source_word: תְּפָרֵשׂ כַּפֶּיהָ
  choice: breitet ihre Hände aus
  rationale: Die Geste wird konkret wiedergegeben, ohne sie ausdrücklich als Gebet, Flehen oder Verzweiflung zu deuten.
- source_word: אוֹי נָא לִי
  choice: Weh mir!
  rationale: Die knappe Klageformel gibt den dringlichen Ausruf würdig und natürlich wieder; die eindringliche Partikel נָא wird durch den Ausruf mitgetragen.
- source_word: עָיְפָה נַפְשִׁי
  choice: Mein Leben erlahmt
  rationale: נפש bezeichnet hier die bedrohte lebendige Person beziehungsweise ihr Leben, nicht zwingend eine vom Körper unterschiedene Seele. „Erlahmt“ bewahrt das Bild des Schwindens und Erschöpfens.
- source_word: לְהֹרְגִים
  choice: vor den Mördern
  rationale: Das substantivierte Partizip bezeichnet Menschen, die töten. „Vor“ gibt die bedrohliche Gegenwart beziehungsweise Gewalt dieser Mörder knapp wieder.
theological_decisions:
- issue: Personifikation Zions
  choice: Tochter Zion spricht als personifiziertes Zion beziehungsweise Jerusalem
  alternative: Tochter von Zion
  rationale: „Tochter Zion“ erhält die poetische Personifikation, ohne sie allegorisch oder konfessionell weiterzudeuten.
- issue: Bedeutung von נֶפֶשׁ in unmittelbarer Todesgefahr
  choice: mein Leben
  alternative: meine Seele
  rationale: „Leben“ entspricht hier der bedrohten Person als lebendigem Selbst und vermeidet eine anthropologische Trennung von Seele und Körper, die der hebräische Ausdruck nicht verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Rhythmus. Das Geburtsbild und die Personifikation bleiben deutlich; ungewohnte hebräische Bedeutungsbreiten werden in Fußnoten offengehalten.
