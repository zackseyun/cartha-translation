  text: רָאִ֕יתִי וְ/הִנֵּ֥ה הַ/כַּרְמֶ֖ל הַ/מִּדְבָּ֑ר וְ/כָל עָרָ֗י/ו נִתְּצוּ֙ מִ/פְּנֵ֣י יְהוָ֔ה מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/026.yaml
  text: I looked[a], and behold, the fruitful land was a wilderness, and all its cities were torn down before Yahweh[b], before his fierce anger.
translation:
  language: de
  text: 'Ich sah, und siehe: Das fruchtbare Land[a] war zur Wüste geworden, und alle seine Städte waren niedergerissen vor Jahwe[b], vor der Glut seines Zorns.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Karmel; hier wahrscheinlich im weiteren Sinn „fruchtbares“ oder „kultiviertes Land“, nicht unbedingt die Region Karmel.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wegen Jahwes, wegen der Glut seines Zorns“. Im Hebräischen steht zweimal מִפְּנֵי, wörtlich etwa „von/vor dem Angesicht (her)“.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich sah hin
  rationale: ראה bezeichnet hier die Wahrnehmung in einer prophetischen Schau. „Ich sah hin“ fügt sich in die wiederholte Visionsformel des Zusammenhangs und klingt im Deutschen natürlich.
- source_word: וְהִנֵּה
  choice: und siehe
  rationale: הִנֵּה lenkt die Aufmerksamkeit unvermittelt auf das Wahrgenommene. „Und siehe“ bewahrt diese lebendige, feierliche Signalwirkung.
- source_word: הַכַּרְמֶל
  choice: das fruchtbare Land
  rationale: כַּרְמֶל kann den Karmel als Gebiet oder allgemein fruchtbares, kultiviertes Land bezeichnen. Der Gegensatz zur Wüste legt hier die allgemeine Bedeutung nahe.
- source_word: הַמִּדְבָּר
  choice: zur Wüste geworden
  rationale: מִדְבָּר bezeichnet unbewohntes, ödes Land und nicht zwingend eine Sandwüste. Die Formulierung macht den resultativen Kontrast im Deutschen deutlich.
- source_word: וְכָל עָרָיו
  choice: und alle seine Städte
  rationale: Das maskuline Suffix bezieht sich am ehesten auf das zuvor genannte Land beziehungsweise Gebiet; „seine“ bewahrt die grammatische Form des Hebräischen.
- source_word: נִתְּצוּ
  choice: waren niedergerissen
  rationale: Der Niphal von נתץ bezeichnet das Niederreißen oder Zerstören von Bauwerken. „Niedergerissen“ ist anschaulich und idiomatisch.
- source_word: מִפְּנֵי יְהוָה
  choice: vor Jahwe
  rationale: מִפְּנֵי bedeutet wörtlich „vom Angesicht/vor dem Angesicht“ und kann hier zugleich Gegenwart und Ursache des Gerichts ausdrücken. „Vor“ erhält diese Offenheit.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname יהוה wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִפְּנֵי חֲרוֹן אַפּוֹ
  choice: vor der Glut seines Zorns
  rationale: חֲרוֹן אַף ist ein starkes Bild für brennenden, heftigen Zorn. „Glut seines Zorns“ bewahrt das Bild und die Intensität sowie die Wiederholung von מִפְּנֵי.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen. Die Transliteration „Jahwe“ macht dies sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִפְּנֵי in der Gerichtsaussage
  choice: vor Jahwe, vor der Glut seines Zorns
  alternative: wegen Jahwes, wegen seines glühenden Zorns
  rationale: Die Präposition kann in diesem Zusammenhang kausal verstanden werden, bezeichnet wörtlich jedoch ein Geschehen „vor dem Angesicht“ beziehungsweise „von ... her“. Die Hauptfassung bewahrt die räumlich-kausale Spannung; die Fußnote nennt die kausale Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Visionsformel „und siehe“. Die Bildsprache von der „Glut“ des Zorns und die doppelte Präposition „vor“ spiegeln die hebräische Intensität und Parallelität.
