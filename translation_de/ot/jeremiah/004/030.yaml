id: JER.4.30
reference: Jeremiah 4:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ו/אתי שָׁד֜וּד מַֽה תַּעֲשִׂ֗י כִּֽי תִלְבְּשִׁ֨י שָׁנִ֜י כִּי תַעְדִּ֣י עֲדִי זָהָ֗ב כִּֽי תִקְרְעִ֤י בַ/פּוּךְ֙ עֵינַ֔יִ/ךְ לַ/שָּׁ֖וְא תִּתְיַפִּ֑י מָאֲסוּ בָ֥/ךְ עֹגְבִ֖ים נַפְשֵׁ֥/ךְ יְבַקֵּֽשׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/030.yaml
  text: And you[a], devastated one, what will you do? Though you dress in scarlet, though you adorn yourself with ornaments of gold, though you enlarge your eyes with paint, you beautify yourself in vain. Your lovers despise you[b]; they seek your life.
translation:
  language: de
  text: Und du, Verwüstete[a], was wirst du tun? Auch wenn du dich in Scharlach kleidest, auch wenn du dich mit Goldschmuck schmückst, auch wenn du deine Augen mit dunkler Schminke größer erscheinen lässt[b] – vergeblich machst du dich schön. Deine Liebhaber verachten dich; sie trachten dir nach dem Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ausgeplünderte“ beziehungsweise „Zerstörte“. Im Hebräischen wird eine weibliche Einzelfigur angeredet, wahrscheinlich das personifizierte Jerusalem beziehungsweise Zion.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auch wenn du deine Augen mit Puch aufreißt“. „Puch“ bezeichnet eine dunkle Augenschminke, häufig Kajal oder Antimon, mit der die Augen hervorgehoben wurden.'
    reason: cultural_note
lexical_decisions:
- source_word: שָׁדוּד
  choice: Verwüstete
  rationale: Das Wort bezeichnet jemanden, der verwüstet, zerstört oder ausgeplündert worden ist. „Verwüstete“ erfasst den umfassenden Zustand des Unheils, ohne ihn auf Plünderung zu verengen. Die feminine deutsche Form folgt der durchgängigen Anrede an eine weibliche Einzelfigur.
- source_word: מַה תַּעֲשִׂי
  choice: was wirst du tun?
  rationale: Das Imperfekt in der rhetorischen Frage lässt sich natürlich futurisch wiedergeben und verweist auf die ausweglose bevorstehende Lage.
- source_word: שָׁנִי
  choice: Scharlach
  rationale: Bezeichnet scharlachrot gefärbten Stoff beziehungsweise die entsprechende Farbe; „Scharlach“ ist präzise und im Deutschen geläufig.
- source_word: תַעְדִּי עֲדִי זָהָב
  choice: dich mit Goldschmuck schmückst
  rationale: Gibt das Wortspiel aus dem Verb „sich schmücken“ und dem Substantiv „Schmuck“ natürlich wieder, ohne die Aussage unnötig auszubauen.
- source_word: תִקְרְעִי בַפּוּךְ עֵינַיִךְ
  choice: deine Augen mit dunkler Schminke größer erscheinen lässt
  rationale: Die wörtliche Wendung „die Augen mit Puch aufreißen“ bezeichnet das optische Vergrößern beziehungsweise Hervorheben der Augen durch dunkle Augenschminke. Die Wiedergabe vermittelt die gemeinte kosmetische Handlung verständlich; die Bildlichkeit und der Kulturbegriff werden in der Fußnote erläutert.
- source_word: לַשָּׁוְא תִּתְיַפִּי
  choice: vergeblich machst du dich schön
  rationale: Bewahrt sowohl den Gedanken der Zwecklosigkeit als auch die reflexive Bedeutung des Verbs.
- source_word: מָאֲסוּ בָךְ עֹגְבִים
  choice: Deine Liebhaber verachten dich
  rationale: „Liebhaber“ passt zur prophetischen Metapher politischer beziehungsweise treuloser Beziehungen; „verachten“ gibt die entschiedene Zurückweisung deutlich wieder.
- source_word: נַפְשֵׁךְ יְבַקֵּשׁוּ
  choice: sie trachten dir nach dem Leben
  rationale: Die deutsche Redewendung gibt die hebräische Verbindung „dein Leben suchen“ idiomatisch und präzise als Tötungsabsicht wieder.
theological_decisions:
- issue: Personifikation Jerusalems beziehungsweise Zions als weibliche Gestalt
  choice: Die feminine Einzelanrede wird durch „Verwüstete“ und die Du-Form bewahrt, ohne Jerusalem oder Zion ausdrücklich in den Vers einzusetzen.
  alternative: „Jerusalem“ oder „Tochter Zion“ ausdrücklich ergänzen oder die Personifikation neutralisieren.
  rationale: Die hebräischen Verbformen richten sich an eine weibliche Einzelfigur, doch ihr Name steht in diesem Vers nicht ausdrücklich. Die Übersetzung wahrt daher die Personifikation, ohne die wahrscheinlich gemeinte Identität als Zusatz in den Haupttext einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die dreifache Wiederholung von „auch wenn“ bildet die rhetorische Steigerung der drei כִּי-Sätze ab. Der Gedankenstrich markiert den Umschlag von den aufwendigen Verschönerungsversuchen zu ihrem vergeblichen Ergebnis.
