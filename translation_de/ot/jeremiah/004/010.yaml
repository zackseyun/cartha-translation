  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה אָכֵן֩ הַשֵּׁ֨א הִשֵּׁ֜אתָ לָ/עָ֤ם הַ/זֶּה֙ וְ/לִ/ירוּשָׁלִַ֣ם לֵ/אמֹ֔ר שָׁל֖וֹם יִהְיֶ֣ה לָ/כֶ֑ם וְ/נָגְעָ֥ה חֶ֖רֶב עַד הַ/נָּֽפֶשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/010.yaml
  text: Then I said[a], “Ah, Lord Yahweh, surely you have greatly deceived this people and Jerusalem, saying[b], ‘You will have peace,’ while the sword has reached to the soul.”
translation:
  language: de
  text: 'Da sagte ich: „Ach, Herr Jahwe! Wahrhaftig hast du dieses Volk und Jerusalem ganz und gar getäuscht[a], indem du sagtest: ‚Ihr werdet Frieden haben.‘ Doch das Schwert ist bis an die Kehle vorgedrungen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „völlig getäuscht“ oder „schwer irregeführt“. Im Hebräischen wird die Verbform durch einen absoluten Infinitiv desselben Verbs verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann „Leben“, „Seele“ oder „Kehle“ bezeichnen. Im Zusammenhang mit dem Schwert ist wahrscheinlich die Kehle beziehungsweise unmittelbare Todesgefahr gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Gibt die erzählerische Fortführung mit anschließendem Bericht direkter Rede natürlich und textnah wieder.
- source_word: אֲהָהּ
  choice: Ach
  rationale: Bewahrt den unvermittelten Ausruf von Bestürzung oder Klage in würdigem, weiterhin gebräuchlichem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Jahwe
  rationale: Gibt den zusammengesetzten Gottesnamen transparent wieder und vermeidet das im Deutschen missverständliche „Herr HERR“.
- source_word: אָכֵן הַשֵּׁא הִשֵּׁאתָ
  choice: Ganz gewiss hast du … gründlich getäuscht
  rationale: „Ganz gewiss“ gibt אָכֵן wieder; „gründlich“ bildet zusätzlich die Verstärkung durch den absoluten Infinitiv neben dem finiten Verb ab. Die direkte Aussage „getäuscht“ wird nicht theologisch abgeschwächt.
- source_word: לָעָם הַזֶּה וְלִירוּשָׁלִַם
  choice: dieses Volk und Jerusalem
  rationale: Bewahrt beide koordinierten Objekte; Jerusalem wird wie im Hebräischen neben dem Volk als betroffene Größe genannt.
- source_word: לֵאמֹר
  choice: mit den Worten
  rationale: Leitet den Inhalt der Aussage idiomatisch ein und lässt erkennen, worin die behauptete Täuschung bestand.
- source_word: שָׁלוֹם יִהְיֶה לָכֶם
  choice: Ihr werdet Frieden haben
  rationale: Ist eine direkte, natürliche Wiedergabe; „Frieden“ umfasst hier auch Wohlergehen und Sicherheit.
- source_word: וְנָגְעָה חֶרֶב
  choice: Doch das Schwert ist … vorgedrungen
  rationale: „Doch“ markiert den scharfen Gegensatz zur Friedenszusage. „Vorgedrungen“ gibt das Erreichen beziehungsweise Herankommen des Schwertes im Kontext drohender Todesgefahr wieder.
- source_word: עַד הַנָּפֶשׁ
  choice: bis an ihr Leben
  rationale: נֶפֶשׁ bezeichnet hier wahrscheinlich das bedrohte Leben selbst; die Formulierung bewahrt zugleich die körperlich-räumliche Bildhaftigkeit der hebräischen Wendung.
theological_decisions:
- issue: Ob die Aussage, Gott habe das Volk getäuscht, abgeschwächt werden soll
  choice: Die direkte Anrede „du … hast … getäuscht“ bleibt im Haupttext stehen.
  alternative: „du hast zugelassen, dass dieses Volk getäuscht wurde“ oder „du hast dieses Volk irregehen lassen“
  rationale: Die hebräische Konstruktion schreibt das Täuschen unmittelbar Gott zu. Da der Vers Jeremias bestürzte Klage wiedergibt, ist die theologische Spannung zu bewahren und nicht durch eine erklärende Übersetzung aufzulösen.
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: Frieden
  alternative: Wohlergehen oder Sicherheit
  rationale: „Frieden“ ist die etablierte, umfassende Wiedergabe und kann im Zusammenhang sowohl Unversehrtheit als auch Sicherheit einschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Klage bleibt scharf und unmittelbar; altertümliche Formen werden vermieden. Die beiden Fußnotenmarker stehen jeweils direkt an der Wendung, die sie erläutern.
