  text: שְׂאוּ נֵ֣ס צִיּ֔וֹנָ/ה הָעִ֖יזוּ אַֽל תַּעֲמֹ֑דוּ כִּ֣י רָעָ֗ה אָנֹכִ֛י מֵבִ֥יא מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/006.yaml
  text: Raise a signal toward Zion[a]. Take refuge; do not stand still, for I am bringing disaster from the north[c][b], and great destruction.
translation:
  language: de
  text: Richtet ein Feldzeichen in Richtung Zion auf![a] Bringt euch in Sicherheit; bleibt nicht stehen![b] Denn ich bringe Unheil[c] aus dem Norden und große Zerstörung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Erhebt ein Banner in Richtung Zion!“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Flieht in Sicherheit; haltet euch nicht auf!“'
    reason: lexical_alternative
  - marker: c
    text: „Unheil“ bezeichnet hier eine Katastrophe beziehungsweise ein Gericht, nicht moralische Bosheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Richtet ein Signal … auf
  rationale: Die Verbindung bezeichnet das Aufrichten eines weithin sichtbaren Sammel- oder Warnzeichens. „Signal“ macht dessen Funktion im heutigen Deutsch deutlich.
- source_word: צִיּוֹנָה
  choice: in Richtung Zion
  rationale: Das angefügte Richtungs-he bezeichnet die Ausrichtung beziehungsweise Bewegung auf Zion zu.
- source_word: הָעִיזוּ
  choice: Bringt euch in Sicherheit
  rationale: Der Hifil-Imperativ von עוז fordert hier in dringlichem Ton dazu auf, Schutz beziehungsweise Sicherheit zu suchen; die Wiedergabe wahrt diese Bedeutung, ohne eine bestimmte Fluchtrichtung hinzuzufügen.
- source_word: אַל תַּעֲמֹדוּ
  choice: bleibt nicht stehen
  rationale: Das Verbot warnt im Zusammenhang vor Stillstand und Zögern.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Gerichtskontext bezeichnet das Wort eine hereinbrechende Katastrophe, nicht moralische Bosheit. „Unheil“ ist natürlich, würdevoll und lässt den Gerichtscharakter bestehen.
- source_word: אָנֹכִי מֵבִיא
  choice: ich bringe
  rationale: Das ausdrücklich gesetzte Pronomen und das Partizip betonen Gottes unmittelbares Handeln; das deutsche Präsens bewahrt die lebendige, unmittelbar bevorstehende Aussage.
- source_word: מִצָּפוֹן
  choice: aus dem Norden
  rationale: Die Präposition bezeichnet die Richtung, aus der das angekündigte Unheil kommt.
- source_word: שֶׁבֶר גָּדוֹל
  choice: große Zerstörung
  rationale: שֶׁבֶר bezeichnet hier schweren Zusammenbruch, Ruin oder Zerstörung; die gewählte Formulierung ist idiomatisch und entspricht der Intensivierung durch גָּדוֹל.
theological_decisions:
- issue: Bedeutung von רָעָה bei göttlichem Handeln
  choice: Unheil
  alternative: Böses; Katastrophe
  rationale: Der Kontext spricht von dem durch Gott angekündigten Gericht aus dem Norden. „Unheil“ wahrt die ausdrückliche göttliche Verursachung, ohne רָעָה hier als moralisch Böses festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit dringlichem prophetischem Ton. Die kurzen Imperative bilden die Warn- und Fluchtsituation ab; das ausdrücklich betonte göttliche „ich“ bleibt erhalten.
