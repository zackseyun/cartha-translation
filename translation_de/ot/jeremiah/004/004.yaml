id: JER.4.4
reference: Jeremiah 4:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִמֹּ֣לוּ לַ/יהֹוָ֗ה וְ/הָסִ֨רוּ֙ עָרְל֣וֹת לְבַבְ/כֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/004.yaml
  text: Circumcise yourselves to Yahweh[a], and remove the foreskins of your hearts, men of Judah and inhabitants of Jerusalem, lest my wrath go out like fire and burn, with no one to quench it[b], because of the evil of your deeds.
translation:
  language: de
  text: Beschneidet euch für Jahwe und entfernt die Vorhäute eurer Herzen[a], ihr Männer von Juda und Bewohner Jerusalems! Sonst bricht mein Zorn wie Feuer hervor[b] und brennt, ohne dass jemand ihn löschen kann, wegen der Bosheit eurer Taten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier „die Vorhäute eurer Herzen“: Das äußere Bundeszeichen der Beschneidung wird als Bild für innere Umkehr und Bundestreue gebraucht.'
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: „Sonst fährt mein Grimm wie Feuer heraus.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִמֹּלוּ לַיהוָה
  choice: Beschneidet euch für Jahwe
  rationale: Der pluralische Imperativ wird reflexiv wiedergegeben. „Für Jahwe“ bringt die durch לְ bezeichnete Ausrichtung beziehungsweise Hingabe in natürlichem Deutsch zum Ausdruck, ohne das Bundeszeichen umzudeuten.
- source_word: וְהָסִרוּ עָרְלוֹת לְבַבְכֶם
  choice: und entfernt die Vorhäute eurer Herzen
  rationale: Die konkrete, absichtlich anstößige Körpermetapher des Hebräischen bleibt erhalten; der Plural von „Herzen“ entspricht der hebräischen Form.
- source_word: אִישׁ יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: ihr Männer von Juda und Bewohner Jerusalems
  rationale: אִישׁ ist hier kollektiv beziehungsweise distributiv gebraucht. Die direkte Anrede mit „ihr“ ist im Deutschen klar und bewahrt die maskuline Form des Ausgangstextes.
- source_word: פֶּן תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: Sonst bricht mein Zorn wie Feuer hervor
  rationale: פֶּן leitet die angedrohte Folge ein. „Bricht … hervor“ gibt das Bild eines ausgehenden Feuers idiomatisch wieder; חֵמָה wird mit dem im prophetischen Gerichtskontext passenden „Zorn“ übersetzt.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: und brennt, ohne dass jemand ihn löschen kann
  rationale: Die Feuerbildsprache bleibt bestehen. Die deutsche Formulierung drückt aus, dass niemand vorhanden beziehungsweise imstande ist, das Feuer zu löschen.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיכֶם
  choice: wegen der Bosheit eurer Taten
  rationale: מִפְּנֵי bezeichnet hier den Grund; die Wiedergabe bewahrt sowohl die moralische Bewertung רֹעַ als auch die konkreten Handlungen מַעַלְלִים.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der ausdrücklich gebrauchte Bundesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Beschneidung des Herzens
  choice: Die konkrete Metapher bleibt im Haupttext erhalten.
  alternative: Reinigt eure Herzen.
  rationale: Die Verbindung des Bundeszeichens mit dem Herzen trägt die theologische Spannung des Verses. Eine deutende Paraphrase würde diese Verbindung abschwächen.
- issue: Maskuline Anrede אִישׁ יְהוּדָה
  choice: Männer von Juda
  alternative: Menschen von Juda
  rationale: Die grammatisch maskuline, kollektiv gebrauchte Anrede wird sichtbar gehalten, statt sie ohne zwingenden Kontextgrund zu neutralisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Schärfe. Die ungewöhnliche Herzmetapher wird bewusst nicht geglättet; veraltete Wendungen wie „auf dass nicht“ oder „niemand lösche“ werden vermieden.
