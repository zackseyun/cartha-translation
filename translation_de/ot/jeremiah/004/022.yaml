id: JER.4.22
reference: Jeremiah 4:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אֱוִ֣יל עַמִּ֗/י אוֹתִ/י֙ לֹ֣א יָדָ֔עוּ בָּנִ֤ים סְכָלִים֙ הֵ֔מָּה וְ/לֹ֥א נְבוֹנִ֖ים הֵ֑מָּה חֲכָמִ֥ים הֵ֨מָּה֙ לְ/הָרַ֔ע וּ/לְ/הֵיטִ֖יב לֹ֥א יָדָֽעוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/022.yaml
  text: For my people are foolish; they do not know me. They are foolish children[a], and they have no understanding. They are wise to do evil, but they do not know how to do good.
translation:
  language: de
  text: Denn mein Volk ist töricht; mich kennen sie nicht. Unverständige Kinder[a] sind sie, ohne Einsicht sind sie. Weise sind sie darin, Böses zu tun, doch Gutes zu tun verstehen sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Söhne“; hier ist das Wort eine kollektive Bezeichnung für die Angehörigen des Volkes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Gerichtsschilderung ein und gibt die erklärende beziehungsweise kausale Funktion natürlich wieder.
- source_word: אֱוִיל
  choice: töricht
  rationale: Bezeichnet nicht bloß mangelnde Intelligenz, sondern moralische und geistliche Verblendung; „töricht“ bewahrt diesen ethischen Klang in würdigem Deutsch.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die Possessivform wird bewahrt; sie unterstreicht die tragische Spannung, dass Gottes eigenes Volk ihn nicht kennt.
- source_word: אוֹתִי לֹא יָדָעוּ
  choice: mich kennen sie nicht
  rationale: יָדַע bezeichnet hier persönliche und bundeshafte Erkenntnis, nicht nur intellektuelles Wissen. Die einfache Formulierung lässt diese Bedeutungstiefe bestehen, ohne sie erklärend in den Text einzutragen.
- source_word: בָּנִים סְכָלִים
  choice: unverständige Kinder
  rationale: בָּנִים bezeichnet hier kollektiv die Angehörigen des Volkes. „Unverständig“ gibt die scharfe Bezeichnung סְכָלִים wieder und ermöglicht zugleich den anschließenden Ausdruck „ohne Einsicht“ für נְבוֹנִים.
- source_word: וְלֹא נְבוֹנִים הֵמָּה
  choice: ohne Einsicht sind sie
  rationale: נבון bezeichnet Einsicht und Urteilsvermögen. Die Formulierung wahrt den parallelen, nachdrücklichen Satzbau des Hebräischen.
- source_word: חֲכָמִים הֵמָּה לְהָרַע
  choice: Weise sind sie darin, Böses zu tun
  rationale: 'Die beinahe paradoxe Aussage wird beibehalten: Praktische Klugheit besitzen sie ausgerechnet zum Bösen. „Darin“ macht die Beziehung des לְ-Infinitivs im Deutschen verständlich, ohne sie zu einer bloßen Fertigkeit abzuschwächen.'
- source_word: וּלְהֵיטִיב לֹא יָדָעוּ
  choice: doch Gutes zu tun verstehen sie nicht
  rationale: In Verbindung mit dem Infinitiv bezeichnet יָדַע praktisches Verstehen beziehungsweise Können. Die vorangestellte Wendung „Gutes zu tun“ bewahrt den deutlichen Gegensatz zum Bösen.
theological_decisions:
- issue: Bedeutung des Kennens Gottes
  choice: Als persönliche und bundeshafte Beziehung verstanden, im Text jedoch schlicht mit „kennen“ wiedergegeben.
  alternative: Bloße Kenntnis oder intellektuelles Wissen um Gott.
  rationale: Im prophetischen Sprachgebrauch schließt das Kennen Gottes Anerkennung, Beziehung und entsprechenden Gehorsam ein. Die knappe Übersetzung bewahrt diese Bedeutungsweite, ohne sie dogmatisch festzulegen.
- issue: Wiedergabe von בָּנִים
  choice: Kinder
  alternative: Söhne
  rationale: Der maskuline Plural bezeichnet hier kollektiv das Volk und beschränkt die Aussage nicht auf männliche Personen. Die Fußnote dokumentiert dennoch die wörtlichere Form.
- issue: Ironische Weisheit zum Bösen
  choice: Die Bezeichnung „weise“ bleibt trotz ihrer positiven Grundbedeutung erhalten.
  alternative: „geschickt“ oder „geübt“ im Bösen
  rationale: Das Hebräische erzeugt eine theologische und rhetorische Spannung, indem es Weisheit ausdrücklich auf das Böse richtet. Diese Ironie soll nicht durch eine eindeutig negative Umschreibung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter prophetischer Schärfe. Die wiederholte Nachstellung „sind sie“ nimmt den emphatischen hebräischen Parallelismus auf, ohne unnatürlich archaisch zu wirken.
