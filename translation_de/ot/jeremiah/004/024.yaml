base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/024.yaml
  text: I looked at the mountains[a], and behold, they were quaking, and all the hills were shaken.
translation:
  language: de
  text: 'Ich sah die Berge: Sie bebten, und alle Hügel schwankten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich blickte auf die Berge, und siehe, sie zitterten, und alle Hügel gerieten ins Wanken.“'
    reason: Lexikalische und stilistische Alternativen für רָאִיתִי, וְהִנֵּה, רֹעֲשִׁים und הִתְקַלְקָלוּ.
lexical_decisions:
- source_word: רָאִיתִי
  choice: Ich sah
  rationale: Das Qal Perfekt 1. Person Singular von ראה bezeichnet unmittelbares Wahrnehmen. Im Deutschen setzt „Ich sah“ die prophetische Schau natürlich fort.
- source_word: הֶהָרִים
  choice: die Berge
  rationale: הָרִים bezeichnet hier Berge und bleibt dadurch von den folgenden גְּבָעוֹת, den Hügeln, unterschieden.
- source_word: וְהִנֵּה
  choice: ': Sie'
  rationale: הִנֵּה lenkt die Aufmerksamkeit unvermittelt auf das Wahrgenommene. Ein Doppelpunkt gibt diese präsentierende Funktion in modernem Deutsch natürlich wieder, ohne das altertümlich wirkende „siehe“ zu erzwingen.
- source_word: רֹעֲשִׁים
  choice: bebten
  rationale: Das Partizip von רעשׁ bezeichnet heftige, oft erdbebenartige Bewegung. „bebten“ vermittelt diese Stärke knapp und idiomatisch.
- source_word: וְכָל הַגְּבָעוֹת
  choice: und alle Hügel
  rationale: כָּל mit dem pluralischen Substantiv wird kollektiv als „alle“ wiedergegeben; גְּבָעוֹת bezeichnet Hügel im Unterschied zu den Bergen.
- source_word: הִתְקַלְקָלוּ
  choice: schwankten
  rationale: Die seltene Hitpael-Form beschreibt eine erschütterte, instabile oder taumelnde Bewegung. „schwankten“ wahrt die Abgrenzung zu „bebten“ und vermeidet eine im Hebräischen nicht eindeutig angelegte Passivauflösung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt gibt die deiktische Funktion von וְהִנֵּה idiomatisch wieder; die Fußnote bewahrt die formnähere Alternative „und siehe“. Die parallelen, aber nicht identischen Bewegungsverben werden mit „bebten“ und „schwankten“ unterschieden.
