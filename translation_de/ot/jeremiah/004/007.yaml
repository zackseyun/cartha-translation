  text: עָלָ֤ה אַרְיֵה֙ מִֽ/סֻּבְּכ֔/וֹ וּ/מַשְׁחִ֣ית גּוֹיִ֔ם נָסַ֖ע יָצָ֣א מִ/מְּקֹמ֑/וֹ לָ/שׂ֤וּם אַרְצֵ/ךְ֙ לְ/שַׁמָּ֔ה עָרַ֥יִ/ךְ תִּצֶּ֖ינָה מֵ/אֵ֥ין יוֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/007.yaml
  text: A lion has come up from his thicket[a], and a destroyer of nations has set out; he has gone out from his place to make your land a desolation. Your cities will be laid waste[b], without inhabitant.
translation:
  language: de
  text: Ein Löwe ist aus seinem Dickicht[a] heraufgekommen, ein Vernichter von Völkern ist aufgebrochen. Er ist von seinem Ort ausgezogen, um dein Land zur Einöde zu machen. Deine Städte werden verwüstet daliegen[b], ohne Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus seinem Versteck“. Das hebräische Wort bezeichnet dichtes, verworrenes Buschwerk, das einem Löwen Deckung bietet.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Deine Städte werden zu Ruinen“; auch möglich: „Deine Städte werden veröden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: ist … heraufgekommen
  rationale: Das Qal-Perfekt bezeichnet ein Heraufkommen; im Bild des aus der Deckung hervortretenden und gegen das Land vorrückenden Löwen bewahrt „heraufgekommen“ Richtung und Anschaulichkeit.
- source_word: אַרְיֵה
  choice: Löwe
  rationale: Die konkrete Metapher für den angreifenden Feind bleibt unverändert erhalten.
- source_word: מִסֻּבְּכוֹ
  choice: aus seinem Dickicht
  rationale: סֹבֶךְ bezeichnet dichtes, verworrenes Buschwerk. „Dickicht“ bildet dieses Versteck natürlicher und genauer ab als das allgemeinere „Lager“.
- source_word: מַשְׁחִית גּוֹיִם
  choice: ein Vernichter von Völkern
  rationale: Die partizipiale Apposition beschreibt den Löwen beziehungsweise Angreifer nach seiner Wirkung, ohne ihn über den hebräischen Text hinaus näher zu bestimmen.
- source_word: נָסַע
  choice: ist aufgebrochen
  rationale: Das Verb kann das Abbrechen eines Lagers und den anschließenden Aufbruch bezeichnen; „aufgebrochen“ passt zum militärischen Vorrücken.
- source_word: יָצָא מִמְּקוֹמוֹ
  choice: Er ist von seinem Ort ausgezogen
  rationale: Die eigenständige Bewegungsaussage und ihre Verstärkung des vorhergehenden Aufbruchs bleiben erhalten.
- source_word: לָשׂוּם אַרְצֵךְ לְשַׁמָּה
  choice: um dein Land zur Einöde zu machen
  rationale: Die Infinitivkonstruktion wird als Zweck des Ausziehens wiedergegeben; „Einöde“ wahrt den prophetischen Klang von שַׁמָּה.
- source_word: עָרַיִךְ תִּצֶּינָה
  choice: Deine Städte werden verwüstet daliegen
  rationale: Die Form bezeichnet den Zustand der Verödung beziehungsweise Verwüstung. „Verwüstet daliegen“ ist im Deutschen natürlich und vermeidet die unnötig enge Festlegung auf bauliche Ruinen.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ohne Bewohner
  rationale: Die knappe hebräische Wendung bezeichnet das völlige Fehlen eines Bewohners; der kollektive Singular bleibt im Deutschen möglich.
theological_decisions:
- issue: Identität des Löwen beziehungsweise Vernichters
  choice: Die Gestalt bleibt im Vers unbenannt und wird nur metaphorisch sowie nach ihrer Wirkung beschrieben.
  alternative: Sie ausdrücklich mit einem bestimmten Herrscher oder Reich gleichzusetzen.
  rationale: Der vorliegende hebräische Vers nennt keinen Namen; eine historische Identifizierung im Haupttext würde die Aussage überpräzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Satzglieder folgen weitgehend der hebräischen Steigerung, werden aber durch zwei Hauptsätze natürlich gegliedert. Sämtliche Fußnotenmarker stehen im Haupttext.
