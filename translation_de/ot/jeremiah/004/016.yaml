  text: הַזְכִּ֣ירוּ לַ/גּוֹיִ֗ם הִנֵּה֙ הַשְׁמִ֣יעוּ עַל יְרוּשָׁלִַ֔ם נֹצְרִ֥ים בָּאִ֖ים מֵ/אֶ֣רֶץ הַ/מֶּרְחָ֑ק וַֽ/יִּתְּנ֛וּ עַל עָרֵ֥י יְהוּדָ֖ה קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/016.yaml
  text: 'Declare it to the nations: ‘Look[a], proclaim it concerning Jerusalem: Watchers are coming from a distant land, and they raise their voice against the cities of Judah.’'
translation:
  language: de
  text: 'Macht es den Nationen bekannt: Seht, verkündet es über Jerusalem: Wächter kommen aus einem fernen Land und erheben ihre Stimme gegen die Städte Judas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזְכִּירוּ
  choice: Macht es bekannt
  rationale: Der Hifil-Imperativ von זכר kann hier das öffentliche Bekanntmachen oder Verkünden bezeichnen. Die Formulierung ist im modernen Deutschen natürlich und bewahrt den Aufforderungscharakter.
- source_word: לַגּוֹיִם
  choice: den Nationen
  rationale: Die Präposition ל wird als Empfängerangabe wiedergegeben; גּוֹיִם bezeichnet Nationen beziehungsweise Völker. „Nationen“ vermeidet eine unnötig neutestamentlich geprägte Wiedergabe als „Heiden“.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel markiert Dringlichkeit. „Seht“ ist würdig und gegenwärtig, ohne das altertümliche „Siehe“ zu verwenden.
- source_word: הַשְׁמִיעוּ עַל יְרוּשָׁלִַם
  choice: verkündet über Jerusalem
  rationale: Der Hifil von שמע bedeutet „hören lassen, verkünden“. עַל kann den Gegenstand der Botschaft bezeichnen; „über Jerusalem“ erhält diese Beziehung, ohne die Zielrichtung vorschnell als „an“ oder „gegen“ festzulegen.
- source_word: נֹצְרִים
  choice: Wächter
  rationale: Das Wort bezeichnet wörtlich Menschen, die wachen oder bewachen. Im Zusammenhang sind offenbar feindliche Kräfte gemeint; die wörtliche Bildsprache bleibt im Text erhalten, während die mögliche kontextuelle Bedeutung „Belagerer“ in der Fußnote genannt wird.
- source_word: בָּאִים
  choice: kommen
  rationale: Das Partizip beschreibt das gegenwärtige beziehungsweise unmittelbar bevorstehende Herankommen.
- source_word: מֵאֶרֶץ הַמֶּרְחָק
  choice: aus einem fernen Land
  rationale: Die Wendung bezeichnet geografische Ferne und bleibt in Zahl und Bild nahe am Hebräischen.
- source_word: וַיִּתְּנוּ ... קוֹלָם
  choice: und erheben ihre Stimme
  rationale: Die hebräische Redewendung „ihre Stimme geben“ bezeichnet lautes Rufen. „Ihre Stimme erheben“ ist idiomatisches Deutsch und bewahrt das Bild.
- source_word: עַל עָרֵי יְהוּדָה
  choice: gegen die Städte Judas
  rationale: Im militärischen Bedrohungszusammenhang hat עַל adversative Kraft; „gegen“ macht diese Ausrichtung deutlich.
theological_decisions:
- issue: Identität und Funktion der נֹצְרִים
  choice: Wächter im Haupttext, mit „Belagerer“ als Fußnotenalternative
  alternative: Belagerer im Haupttext
  rationale: Die Übersetzung bewahrt die lexikalische Bildsprache, ohne den feindlichen Kontext zu verdecken oder eine mögliche militärische Deutung als einzig sichere Bedeutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist als dringender öffentlicher Aufruf gestaltet. „Seht“ vermeidet das archaische „Siehe“, während „Wächter“ die echte lexikalische Spannung des hebräischen Ausdrucks erhält.
