source:
  edition: WLC
  text: דַּרְכֵּ/ךְ֙ וּ/מַ֣עֲלָלַ֔יִ/ךְ עָשׂ֥וֹ אֵ֖לֶּה לָ֑/ךְ זֹ֤את רָעָתֵ/ךְ֙ כִּ֣י מָ֔ר כִּ֥י נָגַ֖ע עַד לִבֵּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/018.yaml
  text: Your way and your deeds have brought these things upon you. This is your evil[a]—how bitter it is! For it has reached your heart.
translation:
  language: de
  text: Dein Weg und deine Taten haben dir das alles eingebracht. Das ist dein Unheil[a] – wie bitter ist es! Denn es ist bis zu deinem Herzen vorgedrungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das ist deine Bosheit“ oder „das ist dein böses Tun“. Das hebräische Wort kann sowohl moralisches Böses als auch das daraus entstehende Unheil bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵּךְ
  choice: Dein Weg
  rationale: Bewahrt die hebräische Metapher für Judas Lebenswandel und bildet zusammen mit „deine Taten“ die Parallelstruktur des Ausgangstextes ab.
- source_word: וּמַעֲלָלַיִךְ
  choice: und deine Taten
  rationale: „Taten“ gibt die moralisch gefärbten Handlungen im prophetischen Kontext knapp und natürlich wieder.
- source_word: עָשׂוֹ אֵלֶּה לָךְ
  choice: haben dir dies eingebracht
  rationale: Die idiomatische deutsche Formulierung drückt aus, dass Judas Verhalten diese Folgen verursacht hat, ohne den Kausalzusammenhang weiter auszudeuten.
- source_word: זֹאת רָעָתֵךְ
  choice: Das ist dein Unheil
  rationale: רָעָה kann sowohl moralisches Böses als auch daraus entstehendes Unheil bezeichnen. „Unheil“ passt zum bitteren, bis ans Herz dringenden Ergebnis; die Fußnote hält die moralische Lesart ausdrücklich offen.
- source_word: כִּי מָר
  choice: wie bitter ist es!
  rationale: Die Ausrufung gibt die expressive Kraft der knappen hebräischen Wendung in natürlichem Deutsch wieder.
- source_word: כִּי נָגַע עַד לִבֵּךְ
  choice: Denn es dringt bis an dein Herz
  rationale: „Dringt bis an“ bewahrt das Bild einer Wirkung, die das innere Zentrum des Menschen erreicht; das deutsche Präsens kann den resultativen Zustand der hebräischen Perfektform natürlich ausdrücken.
theological_decisions:
- issue: Bedeutung von רָעָה in זֹאת רָעָתֵךְ
  choice: „dein Unheil“ im Haupttext, mit „deine Bosheit/dein Böses“ als Fußnotenalternative
  alternative: „deine Bosheit“ oder „dein Böses“ im Haupttext
  rationale: Der unmittelbare Satz spricht von dem bitteren Ergebnis, das bis ans Herz dringt, während der erste Satz Judas Schuld und Verursachung festhält. Da רָעָה beides bezeichnen kann, bewahrt die Fußnote die moralisch-kausale Spannung, statt sie auf nur eine Seite festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Singular und die Metaphern „Weg“, „bitter“ und „Herz“ bleiben erhalten; die Formulierung ist zugleich für heutige Leser verständlich.
