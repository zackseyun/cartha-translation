revisions:
- from: Dein Weg und deine Taten haben dir dies eingebracht. Das ist dein Unheil[a] – wie bitter ist es! Denn es dringt bis an dein Herz.
  to: Dein Weg und deine Taten haben dir das alles eingebracht. Das ist dein Unheil[a] – wie bitter ist es! Denn es ist bis zu deinem Herzen vorgedrungen.
  rationale: Die Revision erhält die im Kontext gut mögliche Hauptlesart „Unheil“ und die ausdrückliche, natürliche Ausrufsform bei כִּי מָר. Sie verbessert lediglich die Wiedergabe der pluralischen Rückverweisung und des perfektischen, bis zum Herzen reichenden נָגַע. Die Fußnote bewahrt die moralische Bedeutung von רָעָה mit modernem deutschem Ausdruck.
  reviewer_model: gpt-5.6-terra
