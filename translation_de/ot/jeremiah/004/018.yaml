review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Anrede im Singular sind zutreffend wiedergegeben. „Unheil“ ist für רָעָה im vorliegenden Zusammenhang eine vertretbare Hauptlesart, sofern die moralische Bedeutung in der Anmerkung erhalten bleibt. Das hebräische Perfekt נָגַע bezeichnet jedoch eher eine bereits eingetretene, bis zum Herzen reichende Wirkung als ein gegenwärtiges „dringt“; außerdem gibt „bis zu deinem Herzen vorgedrungen“ die räumlich-bildhafte Wendung עַד לִבֵּךְ klarer wieder.
  naturalness: „Es dringt bis an dein Herz“ ist verständlich, klingt im modernen Standarddeutsch aber weniger idiomatisch und verschiebt die Aspektwirkung. „Es ist bis zu deinem Herzen vorgedrungen“ ist natürlich, würdevoll und bewahrt das Bild. „Das alles“ macht die pluralische Rückverweisung אֵלֶּה idiomatisch sichtbar.
  terminology: „Weg“ und „Taten“ bewahren die Metapher und den prophetischen Vorwurf. „Unheil“ ist als Folgebezeichnung möglich; die Fußnote muss die ebenso mögliche Bedeutung „Bosheit/böses Tun“ ohne theologische Festlegung ausweisen. „Dein Böses“ ist im modernen Deutsch weniger natürlich und wird besser durch „deine Bosheit“ bzw. „dein böses Tun“ ersetzt.
  issues:
  - severity: medium
    issue: Aspekt und Idiom bei „es dringt bis an dein Herz“
    rationale: נָגַע steht im Perfekt. Das deutsche Präsens lässt die Wirkung fortdauernd erscheinen, während „ist ... vorgedrungen“ die erreichte, gegenwärtig wirksame Folge ausdrückt. Zugleich ist „bis zu deinem Herzen“ idiomatischer als „bis an dein Herz“.
  - severity: low
    issue: Rückverweisung auf אֵלֶּה
    rationale: „Dies“ kann kollektiv verstanden werden, aber „das alles“ gibt die pluralische Bezugnahme auf „diese Dinge“ im Deutschen deutlicher und natürlicher wieder.
  - severity: low
    issue: Fußnotenalternative „dein Böses“
    rationale: Die Formulierung ist zwar semantisch möglich, aber im modernen Standarddeutsch unnatürlich. „Deine Bosheit“ oder „dein böses Tun“ vermittelt die moralische Lesart klarer.
  revised_text: Dein Weg und deine Taten haben dir das alles eingebracht. Das ist dein Unheil[a] – wie bitter ist es! Denn es ist bis zu deinem Herzen vorgedrungen.
