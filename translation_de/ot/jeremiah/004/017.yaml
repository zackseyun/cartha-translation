source:
  edition: WLC
  text: כְּ/שֹׁמְרֵ֣י שָׂדַ֔י הָי֥וּ עָלֶ֖י/הָ מִ/סָּבִ֑יב כִּי אֹתִ֥/י מָרָ֖תָה נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/017.yaml
  text: Like watchmen of a field[a], they are against her all around, because she has rebelled against me, declares Yahweh.
translation:
  language: de
  text: Wie Wächter eines Feldes[a] stehen sie ringsum gegen sie, denn sie hat sich gegen mich aufgelehnt – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie Hüter des offenen Landes“ bzw. „Wie Bewacher eines Feldes“. Das Bild zeigt Wächter, die ein Feld ringsum bewachen; hier wird es auf die Feinde übertragen, die die Stadt einkreisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּשֹׁמְרֵי
  choice: Wie Wächter
  rationale: Das Präfix כְּ kennzeichnet den Vergleich; das substantivierte Partizip von שׁמר bezeichnet Menschen, die wachen oder bewachen. „Wächter“ ist im Deutschen natürlich und passt zum Bild der Belagerung.
- source_word: שָׂדַי
  choice: eines Feldes
  rationale: שׂדה bedeutet gewöhnlich „Feld“. Die Singularform und das Bild von Wächtern, die um ein Feld postiert sind, bleiben erhalten.
- source_word: הָיוּ
  choice: stehen
  rationale: Formal liegt ein Qatal („waren/sind geworden“) vor. Im prophetischen Zusammenhang vergegenwärtigt es die feindliche Umringung; „stehen“ ergibt zusammen mit „ringsum gegen sie“ ein idiomatisches deutsches Bild, ohne die Aussage als bloß vergangen erscheinen zu lassen.
- source_word: עָלֶיהָ
  choice: gegen sie
  rationale: עַל trägt im feindlichen Zusammenhang adversative Bedeutung. Das feminine Pronomen bleibt unaufgelöst erhalten.
- source_word: מִסָּבִיב
  choice: ringsum
  rationale: Das Wort bezeichnet die Umzingelung von allen Seiten. „Ringsum“ ist knapp, modern und bildhaft.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung des Gerichts ein. „Denn“ verbindet die beiden Aussagen würdig und natürlich.
- source_word: אֹתִי מָרָתָה
  choice: sie hat sich gegen mich aufgelehnt
  rationale: מרה bezeichnet Auflehnung, Widersetzlichkeit oder Rebellion gegen jemanden. „Sich gegen mich auflehnen“ wahrt das Gewicht bewusster Missachtung und klingt in modernem Deutsch natürlich.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Offenbarungsformel. „Ausspruch Jahwes“ bleibt nahe an ihrer nominalen Gestalt und gibt den Gottesnamen als „Jahwe“ wieder.
theological_decisions:
- issue: Bezug des femininen Singularpronomens
  choice: Das Pronomen wird als „sie“ wiedergegeben, ohne den Bezug im Haupttext ausdrücklich als Jerusalem, Juda oder Zion festzulegen.
  alternative: „Jerusalem“, „Tochter Zion“ oder „Juda/das Land“ ausdrücklich einsetzen.
  rationale: Der hebräische Vers lässt den Bezug unausgesprochen. Die feminine Personifikation wird bewahrt, damit die im Kontext bestehende Offenheit nicht stillschweigend aufgelöst wird.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen יהוה. „Jahwe“ gibt ihn in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bewahrt das eindringliche Vergleichsbild und die feminine Personifikation. Der Gedankenstrich hebt die feierliche Schlussformel ab.
