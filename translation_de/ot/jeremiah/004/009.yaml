source:
  edition: WLC
  text: וְ/הָיָ֤ה בַ/יּוֹם הַ/הוּא֙ נְאֻם יְהוָ֔ה יֹאבַ֥ד לֵב הַ/מֶּ֖לֶךְ וְ/לֵ֣ב הַ/שָּׂרִ֑ים וְ/נָשַׁ֨מּוּ֙ הַ/כֹּ֣הֲנִ֔ים וְ/הַ/נְּבִיאִ֖ים יִתְמָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/009.yaml
  text: And it will happen on that day[a], declares Yahweh, that the heart of the king and the heart of the officials will perish, and the priests will be appalled, and the prophets will be astonished.
translation:
  language: de
  text: An jenem Tag wird es geschehen – Spruch Jahwes –, dass dem König und den Obersten der Mut vergeht[a]. Die Priester werden entsetzt sein, und die Propheten werden bestürzt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Das Herz des Königs und das Herz der Obersten gehen zugrunde.« Gemeint sein kann auch, dass ihnen ihre innere Entschlossenheit oder Urteilskraft abhandenkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: An jenem Tag wird es geschehen
  rationale: Gibt die prophetische Zukunftsformel in natürlichem, würdigem Deutsch wieder und bewahrt den zeitlichen Ausdruck.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die feste Prophetenformel נְאֻם wird knapp und feierlich mit „Spruch“ wiedergegeben; der Gottesname erscheint als „Jahwe“.
- source_word: יֹאבַד לֵב הַמֶּלֶךְ וְלֵב הַשָּׂרִים
  choice: dem König und den führenden Männern der Mut vergeht
  rationale: לֵב bezeichnet hier im Zusammenhang mit drohendem Schrecken wahrscheinlich Mut beziehungsweise innere Entschlossenheit; אבד drückt deren völliges Versagen aus. Die idiomatische Formulierung macht den Sinn verständlich, während die wörtliche Bildsprache in der Fußnote erhalten bleibt.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet die politisch und militärisch Führenden. „Führende Männer“ ist in diesem monarchischen Zusammenhang verständlich, ohne erblichen Adel vorauszusetzen.
- source_word: וְנָשַׁמּוּ הַכֹּהֲנִים
  choice: Die Priester werden entsetzt sein
  rationale: Das Nifal von שמם bezeichnet hier erschrockenes, bestürztes Erstarren; „entsetzt sein“ ist natürlich und trifft die starke Reaktion.
- source_word: וְהַנְּבִיאִים יִתְמָהוּ
  choice: und die Propheten werden fassungslos dastehen
  rationale: תמה bezeichnet Staunen, Verwirrung oder Fassungslosigkeit. Die Wendung erhält die Abgrenzung zum Entsetzen der Priester und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von לֵב in der Gerichtsszene
  choice: Mut
  alternative: Herz
  rationale: „Mut“ erschließt die wahrscheinliche kontextuelle Bedeutung von לֵב als innere Entschlossenheit. Da das Hebräische wörtlich „Herz“ sagt und auch die innere Urteilskraft mitschwingen kann, wird die Bildsprache in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Gedankenstrich hebt die eingeschobene Gotteswortformel ab; die Reaktionen der Priester und Propheten bleiben in ihrer unterschiedlichen Wortwahl erkennbar.
