base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/013.yaml
  text: Look[a], he comes up like clouds, and his chariots are like the whirlwind; his horses are swifter than eagles. Woe to us, for we are ruined!
translation:
  language: de
  text: Sieh, er zieht wie Wolken herauf; seine Streitwagen sind wie ein Wirbelsturm. Seine Pferde sind schneller als Adler[a]. Wehe uns, denn wir sind zugrunde gerichtet!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geier“. Das hebräische Wort נְשָׁרִים kann allgemein große Greif- oder Aasvögel bezeichnen; „Adler“ ist hier die traditionelle Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die dringliche deiktische Aufforderung wird in knapper, heutiger und zugleich würdevoller Sprache wiedergegeben.
- source_word: כַּעֲנָנִים
  choice: wie Wolken
  rationale: Das pluralische Bild einer heranziehenden Wolkenmasse bleibt erhalten.
- source_word: יַעֲלֶה
  choice: zieht er herauf
  rationale: Die Wendung bewahrt die Richtungsbedeutung von עלה und bezeichnet im Zusammenhang das bedrohliche Herannahen des Angreifers.
- source_word: וְכַסּוּפָה
  choice: wie ein Wirbelsturm
  rationale: סוּפָה bezeichnet einen heftigen Sturm oder Wirbelsturm; die gewählte Formulierung erhält das anschauliche Vergleichsbild.
- source_word: מַרְכְּבוֹתָיו
  choice: seine Streitwagen
  rationale: Im militärischen Zusammenhang macht „Streitwagen“ die hier gemeinte Art von Wagen natürlich und eindeutig kenntlich.
- source_word: קַלּוּ
  choice: sind schneller
  rationale: Die Bedeutung „leicht/schnell sein“ wird durch den anschließenden Vergleich mit מן komparativ wiedergegeben.
- source_word: מִנְּשָׁרִים
  choice: als Adler
  rationale: „Adler“ ist die traditionelle und im Geschwindigkeitsvergleich gut passende Wiedergabe; die mögliche zoologische Alternative wird in einer Fußnote bewahrt.
- source_word: סוּסָיו
  choice: seine Pferde
  rationale: Die einfache Possessivkonstruktion wird direkt wiedergegeben.
- source_word: אוֹי לָנוּ
  choice: Wehe uns
  rationale: Die Formulierung bewahrt den Ausruf des Entsetzens und den prophetischen Klageklang.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet hier den Grund für den Klageruf ein.
- source_word: שֻׁדָּדְנוּ
  choice: wir sind verwüstet
  rationale: Die Passivform von שׁדד bezeichnet gewaltsame Verheerung oder Ausplünderung; „verwüstet“ erhält sowohl die Gewalt als auch den resultativen Sinn.
theological_decisions:
- issue: Identität des unausgesprochenen Subjekts von יַעֲלֶה
  choice: Das maskuline Pronomen „er“ bleibt ohne ergänzende Benennung stehen.
  alternative: Den Angreifer oder Feind ausdrücklich benennen.
  rationale: Der hebräische Vers setzt ein maskulines Subjekt voraus, nennt es hier jedoch nicht. Eine erklärende Identifizierung würde den Text überbestimmen.
