source:
  edition: WLC
  text: כַּבְּסִ֨י מֵ/רָעָ֤ה לִבֵּ/ךְ֙ יְר֣וּשָׁלִַ֔ם לְמַ֖עַן תִּוָּשֵׁ֑עִי עַד מָתַ֛י תָּלִ֥ין בְּ/קִרְבֵּ֖/ךְ מַחְשְׁב֥וֹת אוֹנֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/014.yaml
  text: Wash your heart from evil[a], Jerusalem, so that you may be saved. How long will wicked thoughts lodge within you?
translation:
  language: de
  text: Wasche dein Herz vom Bösen rein, Jerusalem, damit du gerettet wirst. Wie lange noch werden deine bösen Gedanken[a] in dir weilen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine bösen Pläne«.'
    reason: Das hebräische מַחְשְׁבוֹת kann sowohl Gedanken als auch Absichten oder Pläne bezeichnen.
lexical_decisions:
- source_word: כַּבְּסִי
  choice: Wasche ... rein
  rationale: Das Verb bezeichnet wörtlich das Waschen beziehungsweise Reinigen von Kleidung. Die Formulierung bewahrt das konkrete Bild; »rein« macht die Verbindung mit »vom Bösen« im heutigen Deutsch idiomatisch.
- source_word: מֵרָעָה
  choice: vom Bösen
  rationale: Im Zusammenhang mit dem Herzen ist die moralische Bedeutung »Böses/Bosheit« gegenüber »Unheil« vorzuziehen. Die Präposition bezeichnet die Entfernung beziehungsweise Trennung.
- source_word: לִבֵּךְ
  choice: dein Herz
  rationale: »Herz« bezeichnet hier den inneren Menschen einschließlich Denken und Wollen. Die Wiedergabe erhält das hebräische Bild.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Die Stadt wird als weibliche Einzahl direkt angeredet.
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt die Zweckbeziehung knapp und natürlich wieder.
- source_word: תִּוָּשֵׁעִי
  choice: du gerettet wirst
  rationale: Der Niphal von ישׁע kann Rettung oder Befreiung bezeichnen. »Gerettet wirst« wahrt die Bedeutungsbreite, ohne die Art der Rettung festzulegen.
- source_word: עַד מָתַי
  choice: Wie lange noch
  rationale: Natürliche deutsche Entsprechung der hebräischen Zeitfrage; »noch« verdeutlicht die vorausgesetzte Dauer.
- source_word: תָּלִין
  choice: werden ... wohnen
  rationale: Das Verb bezeichnet eigentlich das Übernachten oder Verweilen. »Wohnen« erhält das Bild, dass die Gedanken im Inneren Aufenthalt genommen haben, ohne im Deutschen befremdlich zu klingen.
- source_word: בְּקִרְבֵּךְ
  choice: in dir
  rationale: Bei der personifiziert angeredeten Stadt und den Gedanken als Subjekt gibt dies den inneren Ort natürlich wieder.
- source_word: מַחְשְׁבוֹת אוֹנֵךְ
  choice: deine bösen Gedanken
  rationale: Die Wortgruppe kann Gedanken, Absichten oder Pläne der Bosheit bezeichnen. »Deine bösen Gedanken« ist im Zusammenhang mit dem Herzen natürlich, bewahrt aber durch eine Fußnote die mögliche planende Bedeutung.
theological_decisions:
- issue: Bedeutungsumfang von תִּוָּשֵׁעִי im prophetischen Zusammenhang
  choice: damit du gerettet wirst
  alternative: damit du befreit wirst
  rationale: Der Zusammenhang betrifft das drohende Gericht und mögliche Rettung infolge der Umkehr. »Gerettet« lässt offen, ob vor allem konkrete Befreiung oder der weitere biblisch-theologische Sinn von Rettung im Blick ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weiblichen hebräischen Anredeformen werden im Deutschen durch die direkte Anrede Jerusalems erkennbar. Das Waschbild und das räumliche Bild der im Inneren wohnenden Gedanken bleiben erhalten.
