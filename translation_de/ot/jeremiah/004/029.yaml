source:
  edition: WLC
  text: מִ/קּ֨וֹל פָּרָ֜שׁ וְ/רֹ֣מֵה קֶ֗שֶׁת בֹּרַ֨חַת֙ כָּל הָ/עִ֔יר בָּ֚אוּ בֶּ/עָבִ֔ים וּ/בַ/כֵּפִ֖ים עָל֑וּ כָּל הָ/עִ֣יר עֲזוּבָ֔ה וְ/אֵין יוֹשֵׁ֥ב בָּ/הֵ֖ן אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/029.yaml
  text: At the sound of the horseman and the archer[a], every city flees; they go into the thickets and climb up among the rocks. Every city is abandoned[d][c][b], and no man dwells in them.
translation:
  language: de
  text: Beim Lärm des Reiters und des Bogenschützen[a] flieht jede Stadt[b]. Sie gehen ins Dickicht[c] und steigen auf die Felsen. Jede Stadt liegt verlassen; kein Mensch wohnt darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wegen des Lärms des Reiters und des Bogenschützen.“ Die hebräische Präposition kann sowohl den Anlass als auch die Ursache angeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „die ganze Stadt flieht“. Die hebräische Form kann entweder jede Stadt einzeln oder die gesamte Stadtbevölkerung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das hier mit „Dickicht“ wiedergegebene hebräische Wort ist unsicher. Es kann auch „Wolken“ bedeuten; der Zusammenhang legt jedoch ein dicht bewachsenes Versteck nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Beim Lärm
  rationale: מִן mit קוֹל kann Anlass oder Ursache bezeichnen. „Beim Lärm“ erhält die unmittelbare Wirkung des herannahenden Angriffs, ohne die kausale Nuance festzulegen.
- source_word: פָּרָשׁ וְרֹמֵה קֶשֶׁת
  choice: des Reiters und des Bogenschützen
  rationale: Der hebräische Singular hat hier repräsentativen beziehungsweise kollektiven militärischen Sinn. „Bogenschütze“ gibt die Wendung „einer, der den Bogen schießt“ idiomatisch wieder.
- source_word: בֹּרַחַת כָּל הָעִיר
  choice: flieht jede Stadt
  rationale: Die personifizierende Aussage des Hebräischen bleibt erhalten. כָּל mit singularischem עִיר kann distributiv („jede Stadt“) oder kollektiv („die ganze Stadt“) verstanden werden.
- source_word: בָּאוּ בֶּעָבִים
  choice: Sie gehen ins Dickicht
  rationale: בָּאוּ bezeichnet hier die Bewegung der fliehenden Bevölkerung in ein Versteck. עָבִים wird aufgrund des Zusammenhangs als dichtes Pflanzenwachstum verstanden, obwohl die Form auch mit „Wolken“ verbunden werden kann.
- source_word: וּבַכֵּפִים עָלוּ
  choice: und steigen auf die Felsen
  rationale: כֵּפִים bezeichnet Felsen oder Felsklippen; עָלוּ wird mit der räumlichen Aufwärtsbewegung wiedergegeben.
- source_word: עֲזוּבָה
  choice: liegt verlassen
  rationale: Die resultative Aussage über die vollständig geräumte Stadt wird in natürlichem Deutsch ausgedrückt.
- source_word: וְאֵין יוֹשֵׁב בָּהֵן אִישׁ
  choice: kein Mensch wohnt mehr darin
  rationale: „Kein Mensch“ gibt das generisch gebrauchte אִישׁ treffend wieder. „Darin“ bezieht sich im Deutschen natürlich auf jede einzelne der zuvor genannten Städte; „mehr“ verdeutlicht den durch die Flucht entstandenen Zustand.
