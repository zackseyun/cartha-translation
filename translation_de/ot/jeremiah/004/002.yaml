  text: וְ/נִשְׁבַּ֨עְתָּ֙ חַי יְהוָ֔ה בֶּ/אֱמֶ֖ת בְּ/מִשְׁפָּ֣ט וּ/בִ/צְדָקָ֑ה וְ/הִתְבָּ֥רְכוּ ב֛/וֹ גּוֹיִ֖ם וּ/ב֥/וֹ יִתְהַלָּֽלוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/002.yaml
  text: and if you swear[a], ‘As Yahweh lives,’ in truth, in justice, and in righteousness, then nations will bless themselves in him[c][b], and in him they will boast.
translation:
  language: de
  text: 'Und wenn du schwörst: »So wahr Jahwe lebt!«[a] – in Wahrheit, nach Recht und in Gerechtigkeit –, dann werden die Völker sich mit ihm segnen[b] und sich seiner rühmen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Schwurformel: wörtlich »Jahwe lebt«.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »Dann werden die Völker durch ihn gesegnet werden.« Die hebräische Verbform kann reflexiv verstanden werden, hier weniger wahrscheinlich auch in passivischer Bedeutung.'
    reason: lexical_alternative
  - marker: c
    text: 'Worauf sich »ihm/seiner« bezieht, bleibt im Zusammenhang mehrdeutig: Gemeint sein kann das wiederhergestellte Israel beziehungsweise Juda, möglicherweise aber auch Jahwe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִשְׁבַּעְתָּ
  choice: und wenn du schwörst
  rationale: Das Waw mit dem Niphal-Perfekt 2. Person Singular setzt im Zusammenhang die Bedingungsfolge aus dem vorhergehenden Vers fort. Die konditionale Wiedergabe macht diesen syntaktischen Zusammenhang im Deutschen deutlich.
- source_word: חַי יְהוָה
  choice: »So wahr Jahwe lebt!«
  rationale: Dies ist die übliche hebräische Schwurformel. »So wahr … lebt« ist ihre natürliche und zugleich würdevolle deutsche Entsprechung; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: בֶּאֱמֶת בְּמִשְׁפָּט וּבִצְדָקָה
  choice: in Wahrheit, nach Recht und in Gerechtigkeit
  rationale: Die drei ethischen Bestimmungen des Schwurs bleiben unterschieden. »Nach Recht« ist bei מִשְׁפָּט im Deutschen idiomatischer als dreimaliges »in« und bezeichnet ein dem Recht entsprechendes Handeln.
- source_word: וְהִתְבָּרְכוּ
  choice: dann werden … sich … Segen wünschen
  rationale: Der Hitpael von ברך wird reflexiv verstanden. Die deutsche Wendung gibt den Gedanken wieder, jemanden in einer Segensformel als Maßstab oder Grundlage des erhofften Segens anzuführen, ohne das Verb vorschnell passiv aufzulösen.
- source_word: בּוֹ
  choice: mit ihm / seiner
  rationale: Die beiden Vorkommen desselben hebräischen Ausdrucks werden entsprechend den deutschen Verbindungen idiomatisch wiedergegeben. Das maskuline Singularpronomen bleibt erhalten, ohne seinen Bezug ausdrücklich festzulegen.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Die allgemeine Bezeichnung für die nicht näher bestimmten Nationen wird im prophetischen Zusammenhang am natürlichsten mit »Völker« wiedergegeben.
- source_word: יִתְהַלָּלוּ
  choice: sich seiner rühmen
  rationale: Der Hitpael von הלל bezeichnet hier das Rühmen oder Sich-Rühmen. Die genitivische deutsche Verbindung mit »seiner« ist idiomatisch und bewahrt den pronominalen Bezug.
theological_decisions:
- issue: Bezug des maskulinen Singularpronomens בּוֹ
  choice: Das Pronomen bleibt mit »ihm/seiner« unaufgelöst.
  alternative: Ausdrückliche Festlegung auf Jahwe oder auf das wiederhergestellte Israel/Juda.
  rationale: Der hebräische Text nennt an dieser Stelle keinen neuen Bezugsgegenstand. Sowohl Jahwe als auch Israel kommen im Kontext als Bezug infrage; eine ausdrückliche Benennung würde die echte Mehrdeutigkeit beseitigen.
- issue: Bedeutung des Hitpael וְהִתְבָּרְכוּ
  choice: 'reflexiv: »sich mit ihm Segen wünschen«'
  alternative: 'passivisch: »durch ihn gesegnet werden«'
  rationale: Die reflexive Bedeutung entspricht der Verbform und dem Gebrauch vergleichbarer Segensformeln. Die passive Deutung bleibt sprachlich möglich und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Gedankenstriche gliedern die drei Bedingungen für einen rechtmäßigen Schwur, ohne die Satzfolge des Hebräischen aufzulösen. Ungewöhnliche hebräische Idiomatik wird im Haupttext verständlich wiedergegeben und in den Fußnoten transparent erläutert.
