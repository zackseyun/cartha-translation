source:
  edition: WLC
  text: אִם תָּשׁ֨וּב יִשְׂרָאֵ֧ל נְאֻם יְהוָ֛ה אֵלַ֖/י תָּשׁ֑וּב וְ/אִם תָּסִ֧יר שִׁקּוּצֶ֛י/ךָ מִ/פָּנַ֖/י וְ/לֹ֥א תָנֽוּד־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/004/001.yaml
  text: If you return[a], O Israel, declares Yahweh, to me you should return; if you remove your detestable things from before me and do not wander about[c][b],
translation:
  language: de
  text: Wenn du umkehrst, Israel – Spruch Jahwes –, dann kehre zu mir um.[a] Wenn du deine abscheulichen Dinge[b] aus meiner Gegenwart entfernst und nicht umherirrst,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn du umkehrst, Israel – Spruch Jahwes –, wirst du zu mir zurückkehren.“ Das Hebräische wiederholt dasselbe Verb; die zweite Form kann als Aufforderung oder als Folgesatz verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Gemeint sind besonders verabscheute Gegenstände des Götzendienstes; möglich ist daher auch: „deine Götzenbilder“ oder „deine Abscheulichkeiten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und nicht schwankst“ beziehungsweise „nicht abirrst“. Das hebräische Verb kann unstetes Umherziehen, Abirren oder Schwanken bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: wenn
  rationale: Leitet eine reale Bedingung ein. „Wenn“ bewahrt den konditionalen Charakter und klingt in einem prophetischen Aufruf natürlicher als „falls“.
- source_word: תָּשׁוּב ... תָּשׁוּב
  choice: du umkehrst ... kehre zu mir um
  rationale: Die Wiederholung von שוב bleibt sichtbar. „Umkehren“ trägt sowohl die räumliche Grundbedeutung als auch den Kontext der Hinwendung zu Gott; die zweite Form wird aufgrund des exhortativen Zusammenhangs als Aufforderung wiedergegeben.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Die Stellung kennzeichnet die direkte Anrede; im modernen Deutschen ist dafür kein zusätzliches „O“ nötig.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Gibt die feierliche prophetische Botenformel knapp wieder und bewahrt den Gottesnamen als Eigennamen.
- source_word: אֵלַי
  choice: zu mir
  rationale: Natürliche deutsche Wiedergabe der auf den Sprecher gerichteten Bewegung.
- source_word: תָּסִיר
  choice: entfernst
  rationale: Das Hifil bezeichnet hier das Wegschaffen oder Beseitigen der verwerflichen Gegenstände.
- source_word: שִׁקּוּצֶיךָ
  choice: deine abscheulichen Dinge
  rationale: Bewahrt die starke Wertung des hebräischen Ausdrucks, ohne ihn im Haupttext ausschließlich auf Götzenbilder einzuengen.
- source_word: מִפָּנַי
  choice: aus meiner Gegenwart
  rationale: Gibt die räumlich-personale Wendung „von meinem Angesicht/vor mir weg“ in verständlichem Deutsch wieder.
- source_word: וְלֹא תָנוּד
  choice: und nicht mehr umherirrst
  rationale: נוד kann unstetes Umherziehen, Abirren oder Schwanken bezeichnen. „Umherirren“ passt zum Umkehrmotiv, ohne die mögliche Bedeutung des Schwankens auszuschließen; „mehr“ verdeutlicht idiomatisch das Ende des bisherigen Verhaltens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Aussageweise des zweiten תָּשׁוּב
  choice: 'exhortativ: „dann kehre zu mir um“'
  alternative: 'indikativ: „wirst du zu mir zurückkehren“'
  rationale: Die Verbform kann im Zusammenhang als nachdrückliche Aufforderung oder als Folgesatz verstanden werden. Der prophetische Umkehrruf spricht für die exhortative Wiedergabe; die indikativische Möglichkeit wird in der Fußnote bewahrt.
- issue: Bezug von שִׁקּוּצֶיךָ
  choice: 'lexikalisch offen: „abscheuliche Dinge“'
  alternative: 'konkretisierend: „Götzenbilder“'
  rationale: Der Ausdruck bezeichnet häufig kultisch verabscheute Gegenstände, besonders Götzen. Der Haupttext wahrt jedoch die begriffliche Breite und erläutert den wahrscheinlichen Bezug in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „umkehren“ bildet die hebräische Rhetorik bewusst nach. Gedankenstriche markieren die eingeschobene Botenformel. Das abschließende Komma wahrt den syntaktischen Anschluss an den folgenden Vers.
