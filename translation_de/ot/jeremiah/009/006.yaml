base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/006.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Behold, I am refining them and testing them[b], for how else can I act because of the daughter of my people?'
translation:
  language: de
  text: 'Darum, so spricht Jahwe der Heerscharen: Siehe, ich läutere sie und prüfe sie; denn wie sollte ich handeln angesichts der Tochter meines Volkes?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „mein Volk“. Wörtlich steht im Hebräischen „die Tochter meines Volkes“, eine prophetische Wendung mit familiärem und emotionalem Klang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn was sollte ich tun?“'
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und idiomatisch wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Bewahrt den Gottesnamen und gibt צְבָאוֹת mit dem etablierten, semantisch weiten Ausdruck „Heerscharen“ wieder.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Erhält die hinweisende und nachdrückliche Kraft der hebräischen Wendung in einem würdigen prophetischen Register.
- source_word: צוֹרְפָם
  choice: ich läutere sie
  rationale: „Läutern“ bewahrt das Bild der Metallveredelung und gibt die durch הִנְנִי hervorgehobene, unmittelbar einsetzende Handlung wieder.
- source_word: וּבְחַנְתִּים
  choice: und prüfe sie
  rationale: Die koordinierte Wiedergabe mit Präsens verbindet das Prüfen eng mit dem Läutern und folgt dem aspektuellen Zusammenhang, ohne die Metallmetaphorik zu überdehnen.
- source_word: כִּי אֵיךְ אֶעֱשֶׂה
  choice: denn wie sonst sollte ich handeln
  rationale: Bewahrt die rhetorische Frage und macht im Deutschen deutlich, dass nach einer anderen möglichen Handlungsweise gefragt wird, ohne eine zusätzliche Erklärung einzutragen.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Gibt hier den Grund oder Anlass der Handlung natürlich und knapp wieder.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Bewahrt die ungewöhnliche prophetische Familienmetapher und damit ihre emotionale sowie gemeinschaftsbezogene Spannung.
theological_decisions:
- issue: Prophetische Wendung בַּת עַמִּי
  choice: die Tochter meines Volkes
  alternative: mein Volk / mein geliebtes Volk
  rationale: Die wörtlichere Wiedergabe erhält die familiäre Metapher und legt ihre genaue emotionale oder bundestheologische Nuance nicht vorschnell fest; die idiomatischen Möglichkeiten stehen in der Fußnote.
- issue: Rhetorische Kraft von כִּי אֵיךְ אֶעֱשֶׂה
  choice: denn wie sonst sollte ich handeln
  alternative: denn wie könnte ich anders handeln? / denn was sollte ich sonst tun?
  rationale: Die Formulierung erhält den rhetorischen Zwang der Frage, ohne eine weitergehende Lehre über göttliche Notwendigkeit in den Text einzutragen.
- issue: Zeit- und Aspektbezug von הִנְנִי צוֹרְפָם וּבְחַנְתִּים
  choice: Siehe, ich läutere sie und prüfe sie
  alternative: Siehe, ich werde sie läutern und prüfen
  rationale: Das Präsens bildet die durch הִנְנִי mit Partizip hervorgehobene, unmittelbar bevorstehende beziehungsweise bereits einsetzende Handlung ab. Die koordinierte zweite Verbform wird im Deutschen aus Gründen des Zusammenhangs gleichgeordnet wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem Bildwortschatz. „Siehe“ und „Heerscharen“ tragen den feierlichen Ton, ohne die Syntax unnötig zu archaisieren. Die Fußnotenmarker stehen jeweils unmittelbar bei der Wendung, auf die sie sich beziehen.
