  source_fidelity: Die Grundwiedergabe ist eng am Hebräischen. Das hinzugefügte „sonst“ in „wie sonst sollte ich handeln“ steht jedoch nicht ausdrücklich im Text und verstärkt eine zwar mögliche, aber nicht notwendige Implikation. „Angesichts“ gibt מִפְּנֵי („vor/angesichts; aufgrund von“) hier angemessener und weniger kausal verengt wieder als „wegen“.
  naturalness: „Darum, so spricht …“ sowie „Siehe“ und „Heerscharen“ sind im würdigen modernen Bibelregister natürlich. Die Verbindung „handeln wegen der Tochter meines Volkes“ wirkt im Deutschen jedoch sperrig; „angesichts der Tochter meines Volkes“ ist idiomatischer und näher an der räumlich-bildlichen Grundbedeutung von מִפְּנֵי.
  terminology: „Jahwe“, „der Heerscharen“, „läutere“ und „prüfe“ sind sachgerecht. „Tochter meines Volkes“ bewahrt die absichtlich ungewöhnliche prophetische Metapher, ohne sie im Text auszudeuten. Die Fußnote erläutert sie hilfreich, sollte aber die nicht im Hebräischen stehende Nuance „geliebtes“ nicht als gleichwertige direkte Alternative nahelegen.
