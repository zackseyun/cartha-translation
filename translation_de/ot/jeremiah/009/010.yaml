id: JER.9.10
reference: Jeremiah 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַתִּ֧י אֶת יְרוּשָׁלִַ֛ם לְ/גַלִּ֖ים מְע֣וֹן תַּנִּ֑ים וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מִ/בְּלִ֖י יוֹשֵֽׁב־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/010.yaml
  text: And I will make Jerusalem a heap of ruins[a], a haunt of jackals; and I will make the cities of Judah a desolation[c][b], without inhabitant.
translation:
  language: de
  text: Und ich werde Jerusalem zu Trümmerhaufen[a] machen, zu einer Behausung für Schakale[b]; und die Städte Judas werde ich zur Einöde machen, ohne dass jemand dort wohnt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zu Schutthaufen“ oder „zu Ruinenhaufen“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch tannim; traditionell auch mit „Drachen“ wiedergegeben, in diesem Zusammenhang verlassener Ruinen jedoch wahrscheinlich „Schakale“.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „ohne Bewohner“ oder „ohne einen dort Wohnenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי / אֶתֵּן
  choice: werde … machen
  rationale: נתן bedeutet grundsätzlich „geben/setzen“, hat hier mit den folgenden Ergebnisbezeichnungen jedoch resultative Bedeutung. „Zu … machen“ gibt diese im Deutschen natürlich und präzise wieder.
- source_word: לְגַלִּים
  choice: zu Trümmerhaufen
  rationale: Der Plural bezeichnet Haufen, hier insbesondere Schutt- oder Ruinenhaufen einer zerstörten Stadt. Der deutsche Plural bewahrt die Form und das konkrete Bild des Hebräischen.
- source_word: מְעוֹן
  choice: Behausung
  rationale: Das Wort bezeichnet einen Wohn- oder Aufenthaltsort. „Behausung“ passt zum gehobenen prophetischen Register und zum Bild wilder Tiere in verlassenen Ruinen.
- source_word: תַּנִּים
  choice: Schakale
  rationale: In prophetischen Schilderungen verwüsteter Orte bezeichnet der Ausdruck wahrscheinlich Schakale oder ähnliche Wildtiere. Die traditionelle Wiedergabe „Drachen“ ist in diesem Zusammenhang weniger wahrscheinlich.
- source_word: עָרֵי יְהוּדָה
  choice: die Städte Judas
  rationale: Die Genitivkonstruktion gibt den hebräischen Constructus knapp und eindeutig wieder.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen verwüsteten, menschenleeren Zustand oder Ort. „Einöde“ erhält die nominale Bildsprache und klingt im Deutschen natürlich.
- source_word: מִבְּלִי יוֹשֵׁב
  choice: ohne dass jemand dort wohnt
  rationale: Die idiomatische Formulierung gibt den Sinn „ohne Bewohner / ohne einen dort Wohnenden“ in verständlichem modernem Deutsch wieder.
theological_decisions:
- issue: Göttliche Verursachung des angekündigten Gerichts durch das wiederholte נתן
  choice: „werde … machen“ als Ausdruck des von Gott herbeigeführten Ergebnisses
  alternative: Wörtlicher „werde … geben“ oder „werde … setzen“
  rationale: Der Vers stellt Gottes Handeln als Ursache der Verwüstung dar. Die resultative Wiedergabe macht diese Aussage deutlich, ohne über den hebräischen Text hinaus eine Art oder ein Mittel des Gerichts festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Satzstruktur und die wiederholte göttliche Handlungsankündigung bleiben erhalten; konkrete Verwüstungsbilder werden nicht verallgemeinert.
