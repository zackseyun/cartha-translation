  text: וַ/יֹּ֣אמֶר יְהוָ֔ה עַל עָזְבָ/ם֙ אֶת תּ֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/הֶ֑ם וְ/לֹא שָׁמְע֥וּ בְ/קוֹלִ֖/י וְ/לֹא הָ֥לְכוּ בָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/012.yaml
  text: And Yahweh said[a], "Because they have forsaken my law that I set before them[b], and have not obeyed my voice or walked in it,"
translation:
  language: de
  text: 'Und Jahwe sagte: „Weil sie mein Gesetz[a] verlassen haben, das ich ihnen vorgelegt habe, und nicht auf meine Stimme gehört[b] haben und nicht danach gelebt haben,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Weisung“. Das hebräische Wort Tora kann allgemein eine Unterweisung oder Weisung bezeichnen; hier hat es zugleich die verbindliche Kraft des Bundes.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meiner Stimme nicht gehorcht“. Die hebräische Wendung „auf meine Stimme hören“ schließt häufig Gehorsam ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen in seiner geläufigen Form wieder und bewahrt seinen Charakter als Bundesname.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Narrativ wird mit der hebräischen Fortsetzungsform weitergeführt; „Und … sagte“ bildet dies schlicht und natürlich ab.
- source_word: עַל עָזְבָם
  choice: Weil sie … verlassen haben
  rationale: עַל führt hier den Grund an; „verlassen“ bewahrt das Gewicht des Bundesbruchs, ohne unnötig altertümlich zu klingen.
- source_word: תּוֹרָתִי
  choice: mein Gesetz
  rationale: תּוֹרָה kann allgemein „Weisung“ bedeuten, hat hier jedoch im Zusammenhang des Bundesbruchs rechtlich-bundestheologisches Gewicht.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיהֶם
  choice: das ich ihnen vorgelegt habe
  rationale: Die Wendung bezeichnet etwas, das Menschen zur Beachtung vor Augen gestellt wird; „vorgelegt“ ist im Deutschen idiomatisch und sachlich genau.
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: und nicht auf meine Stimme gehört haben
  rationale: Die deutsche Wendung erhält sowohl das Bild des Hörens als auch den darin liegenden Sinn des Gehorchens, ohne diesen ausdrücklich festzulegen.
- source_word: וְלֹא הָלְכוּ בָהּ
  choice: und nicht danach gelebt haben
  rationale: Das hebräische Bild des Gehens beschreibt die Lebensführung nach einem Maßstab. Die gewählte Formulierung gibt diesen Sinn in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im Bundeskontext
  choice: mein Gesetz
  alternative: meine Weisung
  rationale: „Gesetz“ bringt die rechtliche und bundestheologische Verbindlichkeit zur Geltung; die breitere Bedeutung „Weisung“ bleibt in der Fußnote sichtbar.
- issue: Ausdrückliche Wiedergabe des Gehorsams in שׁמע בְּקוֹל
  choice: nicht auf meine Stimme gehört
  alternative: meiner Stimme nicht gehorcht
  rationale: Die hebräische Redewendung schließt Gehorsam ein, formuliert aber mit dem Bild des Hörens. Die Übersetzung bewahrt diese Spannung.
- issue: Metapher des Gehens in הָלְכוּ בָהּ
  choice: nicht danach gelebt
  alternative: nicht darin gegangen
  rationale: Die wörtliche deutsche Form wäre unnatürlich und missverständlich. „Danach gelebt“ vermittelt die Aussage über die Lebensführung, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die unvollständige Begründungskonstruktion und das abschließende Komma werden beibehalten, weil der Satz im folgenden Vers weitergeführt wird. Das idiomatische „danach gelebt“ vermeidet das im heutigen Deutsch unnatürliche „darin gegangen“.
