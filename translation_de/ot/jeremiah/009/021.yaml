id: JER.9.21
reference: Jeremiah 9:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דַּבֵּ֗ר כֹּ֚ה נְאֻם יְהוָ֔ה וְ/נָֽפְלָה֙ נִבְלַ֣ת הָֽ/אָדָ֔ם כְּ/דֹ֖מֶן עַל פְּנֵ֣י הַ/שָּׂדֶ֑ה וּ/כְ/עָמִ֛יר מֵ/אַחֲרֵ֥י הַ/קֹּצֵ֖ר וְ/אֵ֥ין מְאַסֵּֽף־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/021.yaml
  text: 'Speak: Thus says Yahweh[a], “The corpse of man will fall like dung on the face of the field, and like a sheaf behind the reaper, with no one to gather it.”'
translation:
  language: de
  text: 'Sprich: So lautet der Spruch Jahwes: »Der Leichnam des Menschen[a] wird wie Mist auf die Fläche des Feldes fallen, wie eine Garbe hinter dem Schnitter, und niemand wird ihn einsammeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der menschliche Leichnam« beziehungsweise sinngemäß »die Leichname der Menschen«. Das hebräische Wort אָדָם steht im Singular, kann hier aber allgemein für den Menschen beziehungsweise die Menschheit gebraucht sein.'
    reason: Die singularische Form lässt eine individuelle wie auch eine generische Deutung zu.
lexical_decisions:
- source_word: דַּבֵּר
  choice: Sprich
  rationale: Der Imperativ in der 2. Person Singular leitet den prophetischen Auftrag unmittelbar ein.
- source_word: כֹּה נְאֻם יְהוָה
  choice: So lautet der Spruch Jahwes
  rationale: Die ungewöhnliche Verbindung wird nicht einfach in die geläufigere Botenformel »So spricht Jahwe« umgeformt. »Spruch Jahwes« gibt נְאֻם יְהוָה erkennbar wieder und bleibt im Deutschen verständlich.
- source_word: וְנָפְלָה
  choice: wird … fallen
  rationale: Das Perfekt kündigt im prophetischen Gerichtswort ein zukünftiges, als gewiss dargestelltes Geschehen an.
- source_word: נִבְלַת הָאָדָם
  choice: der Leichnam des Menschen
  rationale: »Leichnam« bewahrt die drastische Aussage, während der singularische Ausdruck »des Menschen« die generische beziehungsweise repräsentative Verwendung von אָדָם offenhält.
- source_word: כְּדֹמֶן
  choice: wie Mist
  rationale: Die knappe, erniedrigende Bildsprache des landwirtschaftlichen Vergleichs bleibt erhalten.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: auf das Feld
  rationale: Die deutsche Formulierung gibt die offene Lage auf der Feldfläche natürlich wieder, ohne die hebräische Wendung »auf dem Angesicht des Feldes« unidiomatisch nachzubilden.
- source_word: וּכְעָמִיר מֵאַחֲרֵי הַקֹּצֵר
  choice: wie eine Garbe hinter dem Schnitter
  rationale: »Garbe« passt zum Erntebild; »hinter dem Schnitter« bewahrt den räumlichen Eindruck dessen, was nach der Arbeit zurückbleibt.
- source_word: וְאֵין מְאַסֵּף
  choice: und niemand wird ihn einsammeln
  rationale: Die unpersönliche hebräische Existenzkonstruktion wird idiomatisch wiedergegeben. Das Einsammeln verbindet das Erntebild mit dem Ausbleiben der Bestattung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Generische Bedeutung von הָאָדָם
  choice: des Menschen
  alternative: der Menschheit
  rationale: Die singularische Gestalt des Hebräischen bleibt erhalten, ohne festzulegen, ob eine einzelne repräsentative Person oder die Menschheit als Ganze im Blick ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst drastischer Gerichtssprache. Die ungewöhnliche prophetische Einleitungsformel wird quellenah als »So lautet der Spruch Jahwes« wiedergegeben; unnötige Archaismen werden vermieden.
