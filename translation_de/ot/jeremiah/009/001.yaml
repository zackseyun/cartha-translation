  text: מִֽי יִתְּנֵ֣/נִי בַ/מִּדְבָּ֗ר מְלוֹן֙ אֹֽרְחִ֔ים וְ/אֶֽעֶזְבָה֙ אֶת עַמִּ֔/י וְ/אֵלְכָ֖ה מֵֽ/אִתָּ֑/ם כִּ֤י כֻלָּ/ם֙ מְנָ֣אֲפִ֔ים עֲצֶ֖רֶת בֹּגְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/001.yaml
  text: Oh[a], that I had a travelers' lodging place in the wilderness, so that I might leave my people and go away from them! For all of them are adulterers[d][c][b], an assembly of traitors.
translation:
  language: de
  text: Ach, hätte ich doch eine Herberge für Reisende in der Wüste,[a] damit ich mein Volk verlassen und von ihnen fortgehen könnte! Denn sie alle sind Ehebrecher[b] – eine Versammlung von Treulosen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wer gäbe mir in der Wüste eine Herberge für Reisende?“ Die hebräische Frage drückt hier einen Wunsch aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Menschen, die Ehebruch begehen“. Im prophetischen Zusammenhang kann auch die Untreue gegenüber Gott und seinem Bund mitschwingen.'
    reason: alternative_reading
  - marker: c
    text: 'Oder: „eine Schar von Treulosen“ beziehungsweise „eine Gemeinschaft von Verrätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתְּנֵנִי
  choice: Ach, hätte ich doch
  rationale: Die wörtliche Frage „Wer gäbe mir …?“ ist hier eine hebräische Wunschformel. Die gewählte Fassung gibt ihren sehnsüchtig-klagenden Sinn in natürlichem Deutsch wieder.
- source_word: בַמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbebautes, dünn besiedeltes Land beziehungsweise die Wüste. „Wüste“ ist im prophetischen Sprachgebrauch klar und geläufig.
- source_word: מְלוֹן אֹרְחִים
  choice: eine Herberge für Reisende
  rationale: מְלוֹן ist eine Unterkunft oder ein Nachtlager, אֹרְחִים sind Reisende. „Herberge für Reisende“ bewahrt das Bild eines vorübergehenden Aufenthaltsortes, ohne einen dauerhaften Wohnsitz anzudeuten.
- source_word: וְאֶעֶזְבָה … וְאֵלְכָה
  choice: damit ich … verlassen und … fortgehen könnte
  rationale: Die Kohortativformen drücken die ersehnte Folge beziehungsweise Absicht des vorausgehenden Wunsches aus. Der deutsche Konjunktiv bewahrt diesen irrealen Wunschcharakter.
- source_word: מְנָאֲפִים
  choice: Ehebrecher
  rationale: Das Partizip bezeichnet unmittelbar Menschen, die Ehebruch begehen. Die konkrete Benennung bleibt erhalten und lässt zugleich den im prophetischen Kontext möglichen übertragenen Bezug auf Bundestreue offen.
- source_word: עֲצֶרֶת בֹּגְדִים
  choice: eine Versammlung von Treulosen
  rationale: עֲצֶרֶת bezeichnet eine Versammlung oder Zusammenkunft; בֹּגְדִים sind treulos oder verräterisch Handelnde. Die Fassung erhält sowohl das Kollektivbild als auch den scharfen Vorwurf.
theological_decisions:
- issue: Ob מְנָאֲפִים ausschließlich wörtlich oder als Bild für Untreue gegenüber Gott zu verstehen ist
  choice: Das konkrete Wort „Ehebrecher“ steht im Haupttext; eine Fußnote weist auf den möglichen prophetischen Beiklang der Bunduntreue hin.
  alternative: „Untreue“ oder „Menschen, die Gott untreu sind“
  rationale: Der hebräische Ausdruck benennt Ehebruch konkret, kann in prophetischer Rede aber zugleich Bunduntreue anklingen lassen. Die Übersetzung bewahrt diese Spannung, statt sie auf nur eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Klage. „Ach, hätte ich doch“ gibt die hebräische Wunschformel idiomatisch wieder; „Versammlung von Treulosen“ bewahrt die kollektive und anklagende Schärfe des Schlusses.
