source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מַאֲכִילָ֛/ם אֶת הָ/עָ֥ם הַ/זֶּ֖ה לַֽעֲנָ֑ה וְ/הִשְׁקִיתִ֖י/ם מֵי רֹֽאשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/014.yaml
  text: 'Therefore thus says Yahweh of Armies[a], the God of Israel: Behold, I am feeding this people wormwood[b], and I will make them drink poisoned water.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe der Heerscharen, der Gott Israels: Siehe, ich gebe diesem Volk Wermut zu essen[a] und lasse sie giftiges Wasser trinken[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bitterkraut“. Das hebräische Wort bezeichnet eine stark bittere Pflanze und dient häufig als Bild für bitteres Leid und Gericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wasser des Gifts“; traditionell auch „Gallenwasser“. Das hebräische Wort kann Gift oder eine giftige beziehungsweise stark bittere Pflanze bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן כֹּה אָמַר
  choice: Darum, so spricht
  rationale: Gibt die folgernde Verknüpfung und die feste prophetische Botenformel knapp und würdig wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Bewahrt den Gottesnamen und übersetzt צְבָאוֹת mit der im Deutschen verständlichen, traditionsnahen Bezeichnung, ohne die Art der Heerscharen näher festzulegen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Entspricht unmittelbar der hebräischen Genitivverbindung.
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Erhält den nachdrücklichen Hinweischarakter der Ankündigungsformel in natürlichem modernem Deutsch.
- source_word: מַאֲכִילָם אֶת הָעָם הַזֶּה לַעֲנָה
  choice: ich gebe diesem Volk Wermut zu essen
  rationale: Gibt den kausativen Sinn von אכל wieder und behält mit „Wermut“ das konkrete Bild einer bitteren Pflanze bei.
- source_word: וְהִשְׁקִיתִים מֵי רֹאשׁ
  choice: und lasse sie giftiges Wasser trinken
  rationale: „Lasse ... trinken“ bildet den Kausativ ab; „giftiges Wasser“ gibt die mehrdeutige, auf Gift beziehungsweise bittere Giftpflanze weisende Verbindung verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: Der Eigenname wird als „Jahwe“ erkennbar erhalten. „Heerscharen“ wahrt die Weite des Titels besser als eine einschränkende Ergänzung wie „himmlische Heere“.
- issue: Bildsprache des angekündigten Gerichts
  choice: Wermut zu essen und giftiges Wasser zu trinken
  alternative: Bitterkeit zu essen und Giftwasser zu trinken
  rationale: Die konkreten hebräischen Bilder werden nicht vorschnell zu abstrakter „Bitterkeit“ aufgelöst; ihre Bedeutung als Gerichtsbilder bleibt dennoch klar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. „Heerscharen“ ist bewusst traditionsnah, weil eine modernisierende Präzisierung die Mehrdeutigkeit des Titels einschränken würde. Sämtliche Fußnotenmarker stehen an den jeweils erläuterten Ausdrücken.
