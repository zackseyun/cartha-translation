source:
  edition: WLC
  text: כִּ֣י ק֥וֹל נְהִ֛י נִשְׁמַ֥ע מִ/צִּיּ֖וֹן אֵ֣יךְ שֻׁדָּ֑דְנוּ בֹּ֤שְׁנֽוּ מְאֹד֙ כִּֽי עָזַ֣בְנוּ אָ֔רֶץ כִּ֥י הִשְׁלִ֖יכוּ מִשְׁכְּנוֹתֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/018.yaml
  text: 'For the sound of wailing is heard from Zion: “How we are devastated! We are utterly ashamed[a], because we have left the land[c][b], because they have cast down our dwellings.”'
translation:
  language: de
  text: 'Denn aus Zion ist Klagegeschrei zu hören:


    „Wie sind wir verwüstet![a]


    Wir sind zutiefst beschämt,


    denn wir haben das Land verlassen;[b]


    denn sie haben unsere Wohnstätten niedergeworfen.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie sind wir ausgeplündert!“ Das hebräische Verb kann sowohl allgemeine Verwüstung als auch die Plünderung durch einen Feind bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn wir haben das Land aufgegeben“. Das Hebräische kann sowohl das Verlassen als auch das Aufgeben des Landes ausdrücken; im Zusammenhang der Klage liegt ein Weggang unter dem Gericht nahe.'
    reason: lexical_alternative
  - marker: c
    text: „Wohnstätten“ kann auch mit „Wohnungen“ oder „Behausungen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet den vorausgehenden Aufruf zur Klage und stellt im Deutschen einen natürlichen Zusammenhang her.
- source_word: קוֹל נְהִי
  choice: lautes Klagen
  rationale: קוֹל bezeichnet Stimme oder Laut, נְהִי Klage beziehungsweise Wehgeschrei. Die Wiedergabe ist idiomatisch und bewahrt den hörbaren Charakter.
- source_word: נִשְׁמַע
  choice: ist … zu hören
  rationale: Das Nifal hat passive Bedeutung. Die deutsche Form gibt den lebendigen prophetischen Gegenwartscharakter wieder, ohne den Aspekt unnötig festzulegen.
- source_word: מִצִּיּוֹן
  choice: aus Zion
  rationale: Die Präposition bezeichnet den Ursprung des Klagegeschreis; der Ortsname Zion bleibt mit seiner poetischen und theologischen Resonanz erhalten.
- source_word: אֵיךְ שֻׁדָּדְנוּ
  choice: Wie sind wir verwüstet!
  rationale: אֵיךְ leitet den Klageruf ein. Das passive שֻׁדָּדְנוּ kann allgemeine Verwüstung oder feindliche Ausplünderung bezeichnen; „verwüstet“ hält den umfassenderen Sinn im Haupttext fest.
- source_word: בֹּשְׁנוּ מְאֹד
  choice: Wir sind zutiefst beschämt
  rationale: בושׁ bezeichnet Scham oder Schande, מְאֹד verstärkt die Aussage. „Zutiefst beschämt“ ist gegenwärtig, verständlich und gibt die Intensität wieder.
- source_word: כִּי עָזַבְנוּ אָרֶץ
  choice: denn wir haben das Land verlassen
  rationale: עזב kann „verlassen“, „aufgeben“ oder „im Stich lassen“ bedeuten. Die neutrale Formulierung bewahrt die Möglichkeit eines erzwungenen Weggangs, ohne die mögliche Bedeutung des Preisgebens auszuschließen.
- source_word: אָרֶץ
  choice: das Land
  rationale: Gemeint ist in diesem Zusammenhang das Heimatland, nicht die gesamte Erde.
- source_word: כִּי הִשְׁלִיכוּ
  choice: denn sie haben … niedergeworfen
  rationale: השליך bedeutet werfen oder schleudern. Mit Wohnstätten als Objekt bezeichnet es hier deren gewaltsame Niederwerfung; das unbestimmte Subjekt der dritten Person Plural bleibt als „sie“ erhalten.
- source_word: מִשְׁכְּנוֹתֵינוּ
  choice: unsere Wohnstätten
  rationale: מִשְׁכָּן bezeichnet einen Wohnort oder eine Behausung. „Wohnstätten“ wahrt den kollektiven und leicht feierlichen Ton der Klage.
theological_decisions:
- issue: Ob das Verlassen des Landes freiwilliges Aufgeben oder erzwungene Vertreibung bezeichnet
  choice: „wir haben das Land verlassen“ bleibt im Haupttext neutral
  alternative: „wir haben das Land preisgegeben“ beziehungsweise „wir mussten das Land verlassen“
  rationale: Die Verbform selbst nennt keinen ausdrücklichen Zwang, während der Klage- und Gerichtskontext einen erzwungenen Weggang nahelegen kann. Die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischer Zeilenführung. „Lautes Klagen“ ist verständlicher als das altertümlichere „Wehklage“, während „Wohnstätten“ den gehobenen Ton des Klagegesangs bewahrt. Die Wiederholung von „denn“ folgt der hebräischen Begründungsstruktur.
