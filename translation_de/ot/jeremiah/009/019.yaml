id: JER.9.19
reference: Jeremiah 9:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי שְׁמַ֤עְנָה נָשִׁים֙ דְּבַר יְהוָ֔ה וְ/תִקַּ֥ח אָזְנְ/כֶ֖ם דְּבַר פִּ֑י/ו וְ/לַמֵּ֤דְנָה בְנֽוֹתֵי/כֶם֙ נֶ֔הִי וְ/אִשָּׁ֥ה רְעוּתָ֖/הּ קִינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/019.yaml
  text: For hear the word of Yahweh[a], O women, and let your ear receive the word of his mouth; teach your daughters a lament[c][b], and each woman her neighbor a dirge.
translation:
  language: de
  text: Denn hört[a], ihr Frauen, das Wort Jahwes, und lasst euer Ohr das Wort aus seinem Mund aufnehmen[b]! Lehrt eure Töchter die Wehklage[c], und jede von euch lehre ihre Gefährtin das Klagelied!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hört zu, ihr Frauen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Lasst euer Ohr das Wort aus seinem Mund aufnehmen“; dies ist ein Bild für aufmerksames Hören.'
    reason: lexical_alternative
  - marker: c
    text: 'Die beiden hebräischen Wörter für Traueräußerungen sind verwandt, aber nicht gleichbedeutend: „Wehklage“ und „Klagelied“ bezeichnen hier förmliche Ausdrucksweisen der Trauer.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende beziehungsweise anschließende Funktion der Partikel im Zusammenhang, ohne sie zu einem bloßen Verstärkungswort zu machen.
- source_word: שְׁמַעְנָה נָשִׁים
  choice: hört, ihr Frauen
  rationale: Der feminine Pluralimperativ und die ausdrücklich weibliche Anrede werden genau wiedergegeben; die Wortstellung ist natürliches modernes Deutsch.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Wendung sowie den im Hebräischen ausdrücklich stehenden Gottesnamen.
- source_word: וְתִקַּח אָזְנְכֶם
  choice: und lasst euer Ohr … aufnehmen
  rationale: Die konkrete hebräische Rede vom aufnehmenden Ohr bleibt erhalten; die deutsche Konstruktion macht zugleich den Sinn aufmerksamen Hörens verständlich. Der Singular „Ohr“ wird bewahrt.
- source_word: דְּבַר פִּיו
  choice: das Wort aus seinem Mund
  rationale: Bewahrt das konkrete Bild göttlicher Rede aus seinem Mund und klingt im Deutschen natürlicher als „das Wort seines Mundes“.
- source_word: וְלַמֵּדְנָה בְנוֹתֵיכֶם
  choice: Lehrt eure Töchter
  rationale: Der feminine Pluralimperativ und die ausdrückliche Nennung der Töchter bleiben erhalten.
- source_word: נֶהִי
  choice: die Wehklage
  rationale: Bezeichnet Klagen beziehungsweise Weinen als eingeübten Ausdruck der Trauer und lässt sich von קִינָה sprachlich unterscheiden.
- source_word: וְאִשָּׁה רְעוּתָהּ
  choice: und jede von euch lehre ihre Gefährtin
  rationale: Die Ellipse des Hebräischen wird im Deutschen durch die Wiederaufnahme des Verbs verständlich gemacht; der distributive Sinn und die weibliche Bezugsperson bleiben erhalten.
- source_word: קִינָה
  choice: das Klagelied
  rationale: Gibt die formale, oft gesungene Toten- oder Trauerklage wieder und bewahrt den Unterschied zum verwandten נֶהִי.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der Eigenname wird als solcher wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige wissenschaftliche Form und vermeidet die Ersetzung durch einen Titel.
- issue: Geschlechtsspezifische Anrede
  choice: Frauen / eure Töchter / jede von euch / ihre Gefährtin
  alternative: Menschen / eure Kinder / jeder Mensch
  rationale: Die femininen Imperativformen und die weiblichen Bezeichnungen des hebräischen Textes werden nicht verallgemeinert.
- issue: Verhältnis von נֶהִי und קִינָה
  choice: Wehklage / Klagelied
  alternative: Klage / Totenklage
  rationale: Beide Wörter gehören zum Trauerwortfeld, sind aber nicht identisch; zwei verwandte, doch unterscheidbare deutsche Ausdrücke erhalten diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. Die direkte Frauenanrede, das Bild des aufnehmenden Ohres und die beiden unterschiedlichen Trauerbegriffe bleiben sichtbar; die hebräische Ellipse im letzten Satzglied wird zur Verständlichkeit behutsam ergänzt.
