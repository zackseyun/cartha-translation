  text: אִ֤ישׁ מֵ/רֵעֵ֨/הוּ֙ הִשָּׁמֵ֔רוּ וְ/עַל כָּל אָ֖ח אַל תִּבְטָ֑חוּ כִּ֤י כָל אָח֙ עָק֣וֹב יַעְקֹ֔ב וְ/כָל רֵ֖עַ רָכִ֥יל יַהֲלֹֽךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/003.yaml
  text: Each man[a], beware of his neighbor, and do not trust any brother; for every brother surely deceives[c][b], and every neighbor goes about as a slanderer.
translation:
  language: de
  text: Hütet euch, jeder vor seinem Nächsten[a], und vertraut keinem Bruder[b]; denn jeder Bruder betrügt fortwährend[c], und jeder Nächste geht als Verleumder umher[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor seinem Freund“ beziehungsweise „vor seinem Gefährten“.'
    reason: lexical_alternative
  - marker: b
    text: „Bruder“ kann den leiblichen Bruder oder allgemeiner ein Mitglied derselben Gemeinschaft bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ist durch und durch hinterlistig“ beziehungsweise „übervorteilt fortwährend“. Das Hebräische verstärkt die Wurzel עקב, die hinterlistiges Übervorteilen oder Verdrängen bezeichnen kann; ein Objekt ist nicht ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „geht als Klatschredner umher“ oder „geht umher und verbreitet üble Nachrede“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מֵרֵעֵהוּ הִשָּׁמֵרוּ
  choice: Jeder hüte sich vor seinem Nächsten
  rationale: אִישׁ hat hier verteilenden Sinn. Die deutsche Einzahl gibt die an jeden Einzelnen gerichtete Warnung natürlich wieder; מִן bezeichnet bei הִשָּׁמֵר die Person, vor der man sich hüten soll.
- source_word: רֵעַ
  choice: Nächster
  rationale: רֵעַ kann einen Freund, Gefährten oder Mitmenschen bezeichnen. „Nächster“ bewahrt die soziale Weite des Ausdrucks und wird an beiden Stellen einheitlich wiedergegeben.
- source_word: וְעַל כָּל אָח אַל תִּבְטָחוּ
  choice: und keinem Bruder sollt ihr vertrauen
  rationale: בּטח bezeichnet Vertrauen oder Sichverlassen auf jemanden. Im verneinten Satz wird כָּל idiomatisch mit „keinem“ wiedergegeben; „Bruder“ lässt sowohl die wörtliche als auch die gemeinschaftsbezogene Bedeutung offen.
- source_word: עָקוֹב יַעְקֹב
  choice: hintergeht den anderen auf jede Weise
  rationale: Die Verbindung aus Intensivierung und finitem Verb derselben Wurzel verstärkt die Vorstellung hinterlistigen Übervorteilens. „Auf jede Weise“ macht diese Verstärkung in natürlichem Deutsch sichtbar; „den anderen“ ist das aus dem Zusammenhang erschlossene Objekt.
- source_word: רָכִיל יַהֲלֹךְ
  choice: geht als Verleumder umher
  rationale: רָכִיל bezeichnet jemanden, der üble Nachrede oder verleumderische Geschichten verbreitet. הלך beschreibt hier ein gewohnheitsmäßiges Umhergehen bzw. Verhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verteilende Warnung wird in der Einzahl formuliert, während „sollt ihr“ den pluralischen Imperativ des Hebräischen erkennen lässt. Die Wiederholung von „Nächster“ und „Bruder“ bewahrt die soziale Zuspitzung des Ausgangstextes.
