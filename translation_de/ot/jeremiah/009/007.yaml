  terminology: „Trug“ trifft מִרְמָה prägnant; „Nächster“ ist für רֵעֵהוּ eine tragfähige, traditionsfähige Wiedergabe. „Freundlich“ entfaltet die idiomatische Bedeutung von „Frieden reden“, ohne eine unnatürliche deutsche Konstruktion zu erzwingen. Die Fußnoten markieren die wesentlichen lexikalischen und syntaktischen Spielräume, insbesondere die nicht ausgedrückte Zielperson des Hinterhalts.
