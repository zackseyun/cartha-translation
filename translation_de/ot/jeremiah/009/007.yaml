  source_fidelity: Die Übersetzung gibt die Metapher von der tödlichen Zunge, ihren Trug sowie den Kontrast zwischen äußerlich freundlicher Rede und innerlich vorbereitetem Hinterhalt zuverlässig wieder. Der kollektive Singular „ihre Zunge“ und die singularische Beschreibung des einzelnen Handelnden entsprechen dem Hebräischen angemessen. Das Ziel des Hinterhalts bleibt im Haupttext, wie im Ausgangstext, offen.
