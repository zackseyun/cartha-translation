id: JER.9.7
reference: Jeremiah 9:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חֵ֥ץ שוחט לְשׁוֹנָ֖/ם מִרְמָ֣ה דִבֵּ֑ר בְּ/פִ֗י/ו שָׁל֤וֹם אֶת רֵעֵ֨/הוּ֙ יְדַבֵּ֔ר וּ/בְ/קִרְבּ֖/וֹ יָשִׂ֥ים אָרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/007.yaml
  text: Their tongue is a slaughtering arrow[a]; it speaks deceit. With his mouth each man speaks peace to his neighbor[c][b], but within himself he sets his ambush.
translation:
  language: de
  text: Ihre Zunge ist ein todbringender Pfeil[a]; sie redet Trug. Mit seinem Mund redet jeder freundlich mit seinem Nächsten[b], doch in seinem Innern legt er seinen Hinterhalt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein mörderischer Pfeil“, „ein Pfeil zum Schlachten“ oder „ein geschärfter Pfeil“. Das hebräische Wort hebt wahrscheinlich die tödliche Bestimmung des Pfeils hervor; daneben ist auch die Deutung „geschärft“ möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „redet Frieden mit seinem Nächsten“ – gemeint ist eine freundlich oder friedfertig klingende Rede, hinter der sich eine schädliche Absicht verbirgt.'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „legt er ihm einen Hinterhalt“ oder „lauert er ihm auf“. Im Hebräischen bleibt unausgesprochen, gegen wen der Hinterhalt gerichtet ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵץ שוחט
  choice: todbringender Pfeil
  rationale: חֵץ bezeichnet einen Pfeil; das Partizip שוחט beschreibt ihn als zum Töten bzw. Schlachten bestimmt. „Todbringend“ bewahrt die tödliche Gewalt des Bildes, ohne im Deutschen unnatürlich zu klingen.
- source_word: לְשׁוֹנָם
  choice: ihre Zunge
  rationale: Der kollektive Singular wird im Deutschen als „ihre Zunge“ beibehalten und fasst die gemeinsame Anklage prägnant zusammen.
- source_word: מִרְמָה דִבֵּר
  choice: sie redet Trug
  rationale: מִרְמָה bezeichnet Täuschung oder Trug. Die knappe Formulierung erhält die Personifikation der Zunge und den nominalen Charakter des Hebräischen.
- source_word: בְּפִיו
  choice: mit seinem Mund
  rationale: Die Präposition wird instrumental wiedergegeben. So bleibt der Gegensatz zwischen äußerer Rede und innerer Absicht deutlich.
- source_word: שָׁלוֹם אֶת רֵעֵהוּ יְדַבֵּר
  choice: redet jeder freundlich mit seinem Nächsten
  rationale: Wörtlich wird „Frieden“ mit dem Nächsten geredet. „Freundlich reden“ gibt in natürlichem Deutsch die friedfertig klingende Rede wieder; „jeder“ macht den im singularischen Satz vorausgesetzten einzelnen Täter deutlich.
- source_word: וּבְקִרְבּוֹ
  choice: doch in seinem Innern
  rationale: Die Wendung bezeichnet das Innere eines Menschen und bildet den bewussten Gegensatz zu „mit seinem Mund“.
- source_word: יָשִׂים אָרְבּוֹ
  choice: legt er seinen Hinterhalt
  rationale: שים bedeutet „setzen, legen, platzieren“, und ארב bezeichnet einen Hinterhalt beziehungsweise das Auflauern. Die Wiedergabe wahrt das Possessivsuffix und lässt wie der hebräische Text offen, gegen wen der Hinterhalt gerichtet ist.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Ton. „Trug“ bewahrt die poetische Verdichtung; „todbringender Pfeil“ und „freundlich reden“ vermeiden unnatürliche Wörtlichkeit, ohne Bild oder Gegensatz abzuschwächen.
