  text: שִׁבְתְּ/ךָ֖ בְּ/ת֣וֹךְ מִרְמָ֑ה בְּ/מִרְמָ֛ה מֵאֲנ֥וּ דַֽעַת אוֹתִ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/005.yaml
  text: Your dwelling is in the midst of deceit[a]; through deceit they refuse to know me[b], declares Yahweh.
translation:
  language: de
  text: Deine Wohnstätte ist inmitten von Betrug[a]; durch Betrug weigern sie sich, mich zu kennen[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht zunächst eine Anrede im Singular („deine Wohnstätte“), danach folgt ein Verb im Plural („sie weigern sich“). Angeredet sein kann das Volk oder die Stadt als Ganzes, während der Plural ihre Bewohner bezeichnet.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Durch Betrug haben sie sich geweigert, mich zu kennen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְתְּךָ
  choice: Du wohnst
  rationale: Die Form bezeichnet mit Suffix der 2. Person maskulin Singular das Wohnen bzw. den Wohnsitz. Die verbale Wiedergabe ist im heutigen Deutsch natürlicher als „dein Wohnen“ oder „dein Sitz“ und bewahrt die singularische Anrede.
- source_word: בְּתוֹךְ מִרְמָה
  choice: mitten im Betrug
  rationale: בְּתוֹךְ bezeichnet das Befinden inmitten einer umgebenden Wirklichkeit; מִרְמָה meint Täuschung, Falschheit oder Betrug. „Mitten im Betrug“ erhält sowohl das räumliche Bild als auch die moralische Schärfe.
- source_word: בְּמִרְמָה
  choice: durch Betrug
  rationale: Die Präposition בְּ kann hier instrumental verstanden werden. Die Wiederholung von „Betrug“ bildet die auffällige Wiederholung des hebräischen מִרְמָה ab.
- source_word: מֵאֲנוּ
  choice: sie weigern sich
  rationale: Das Verb מאן bedeutet „sich weigern“ oder „nicht bereit sein“. Das Perfekt beschreibt hier passend eine bestehende, charakteristische Haltung; die Pluralform wird gegenüber der vorherigen singularischen Anrede beibehalten.
- source_word: דַעַת אוֹתִי
  choice: mich zu erkennen
  rationale: Der Infinitiv von ידע bezeichnet das Kennen bzw. Erkennen. „Mich zu erkennen“ ist idiomatisches, würdevolles Deutsch und lässt die relationale Tragweite offen, ohne sie auszudeuten.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und feierlich wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Wechsel vom Singular zum Plural
  choice: Singularische Anrede „Du wohnst“ und anschließend pluralisches „sie weigern sich“
  alternative: Durchgehend singularische oder pluralische Wiedergabe
  rationale: Der unvermittelte Numeruswechsel steht im hebräischen Text und kann die Gemeinschaft oder Stadt als Einheit anreden und danach ihre Bewohner bezeichnen. Die Übersetzung glättet diese Spannung nicht.
- issue: Zeitwert von מֵאֲנוּ
  choice: Präsens „sie weigern sich“
  alternative: Perfekt „sie haben sich geweigert“
  rationale: Das hebräische Perfekt kann in prophetischer Rede eine feststehende, gegenwärtig wirksame Haltung ausdrücken. Da auch eine stärker vergangenheitsbezogene Wiedergabe möglich ist, wird sie in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholung von „Betrug“, der Numeruswechsel und die knappe Schlussformel werden bewusst bewahrt.
