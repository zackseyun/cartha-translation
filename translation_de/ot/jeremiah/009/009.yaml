source:
  edition: WLC
  text: עַל הֶ֨/הָרִ֜ים אֶשָּׂ֧א בְכִ֣י וָ/נֶ֗הִי וְ/עַל נְא֤וֹת מִדְבָּר֙ קִינָ֔ה כִּ֤י נִצְּתוּ֙ מִ/בְּלִי אִ֣ישׁ עֹבֵ֔ר וְ/לֹ֥א שָׁמְע֖וּ ק֣וֹל מִקְנֶ֑ה מֵ/ע֤וֹף הַ/שָּׁמַ֨יִם֙ וְ/עַד בְּהֵמָ֔ה נָדְד֖וּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/009.yaml
  text: Over the mountains I will lift up weeping and wailing[a], and over the pastures of the wilderness a lament, because they are laid waste so that no man passes through, and they do not hear the sound of livestock. From the birds of the heavens to the beasts, they have fled[c][b]; they are gone.
translation:
  language: de
  text: 'Über die Berge erhebe ich Weinen und Wehklage,

    über die Weideplätze der Steppe ein Klagelied;

    denn sie sind verbrannt[a],

    sodass niemand hindurchzieht

    und kein Laut von Vieh zu hören ist.

    Von den Vögeln des Himmels bis zum Vieh:

    Sie sind fortgezogen, sie sind verschwunden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verwüstet“. Das hebräische Verb kann allgemein die Verheerung bezeichnen, wahrscheinlich schwingt jedoch das Bild des Verbrennens mit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: erhebe ich
  rationale: נשׂא bedeutet wörtlich „heben/erheben“ und bezeichnet zusammen mit Begriffen des Trauerns das Anstimmen einer Klage. „Erhebe ich“ bewahrt das hebräische Bild und klingt im poetischen Zusammenhang würdig.
- source_word: בְכִי וָנֶהִי
  choice: Weinen und Wehklage
  rationale: Die beiden Substantive bezeichnen Weinen und laute Trauer. Die Wiedergabe unterscheidet sie zugleich von dem folgenden קִינָה, dem förmlichen Klagelied.
- source_word: נְאוֹת מִדְבָּר
  choice: Weideplätze der Steppe
  rationale: נְאוֹת bezeichnet hier Weide- oder Grasplätze; מִדְבָּר ist unbewohntes, trockenes Land und kann in diesem Zusammenhang natürlich mit „Steppe“ wiedergegeben werden.
- source_word: קִינָה
  choice: Klagelied
  rationale: קִינָה bezeichnet eine förmliche Toten- oder Trauerklage. „Klagelied“ ist im Deutschen klar und bewahrt den poetischen Charakter.
- source_word: נִצְּתוּ
  choice: sie sind verbrannt
  rationale: Das passive Verb bezeichnet ein Inbrandgesetzt- oder Verbranntsein. Die konkrete Brandvorstellung wird im Haupttext bewahrt; die mögliche allgemeinere Bedeutung wird in einer Fußnote genannt.
- source_word: מִבְּלִי אִישׁ עֹבֵר
  choice: sodass niemand mehr hindurchzieht
  rationale: Die Wendung beschreibt völlige Verlassenheit. Das generisch gebrauchte אִישׁ wird im heutigen Deutsch natürlich mit „niemand“ wiedergegeben.
- source_word: קוֹל מִקְנֶה
  choice: Laut von Vieh
  rationale: קוֹל kann Stimme oder Laut bedeuten, מִקְנֶה den Viehbestand. „Laut von Vieh“ ist knapp und passt zur menschenleeren Landschaft.
- source_word: מֵעוֹף הַשָּׁמַיִם וְעַד בְּהֵמָה
  choice: Von den Vögeln des Himmels bis zum Vieh
  rationale: Die Konstruktion „von … bis …“ umfasst die Tierwelt vom Vogel bis zu den Land- beziehungsweise Nutztieren und bewahrt die Spannweite des Hebräischen.
- source_word: נָדְדוּ הָלָכוּ
  choice: Sie sind fortgezogen, sie sind verschwunden
  rationale: Die zwei aufeinanderfolgenden Verben verstärken das Bild vollständiger Entvölkerung. „Fortgezogen“ gibt נָדְדוּ wieder; „verschwunden“ vermittelt idiomatisch das abschließende הָלָכוּ, ohne die Doppelung einzuebnen.
theological_decisions: []
translation_notes:
  register: Poetisch gegliederte, moderne Standardsprache mit würdigem Klageklang. Die Parallelismen und die verstärkende Doppelung am Versende bleiben erkennbar; unnötig altertümliche Formulierungen wurden vermieden.
