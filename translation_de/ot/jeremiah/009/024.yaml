base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/024.yaml
  text: Look[a], days are coming, declares Yahweh[b], when I will punish everyone circumcised only in foreskin.
translation:
  language: de
  text: Siehe, es kommen Tage, spricht Jahwe, da werde ich alle bestrafen, die beschnitten und doch unbeschnitten sind[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „jeden Beschnittenen in/mit Vorhaut“. Die paradoxe hebräische Formulierung kann auch formaler mit „alle Beschnittenen in Unbeschnittenheit“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: Gemeint sind wahrscheinlich Menschen, die äußerlich das Zeichen der Beschneidung tragen, in einem tieferen, den Bund betreffenden Sinn aber unbeschnitten bleiben; vergleiche den folgenden Vers und Jeremia 4,4.
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die einleitende Hinweispartikel kündigt betont ein kommendes Geschehen an. „Siehe“ bewahrt diese Funktion in knapper, würdiger prophetischer Sprache.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Die Formulierung gibt die geläufige prophetische Zukunftsankündigung eng und zugleich idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste Prophetenformel kennzeichnet einen feierlichen göttlichen Ausspruch; „spricht Jahwe“ ist im Deutschen natürlich und bewahrt den Gottesnamen.
- source_word: וּפָקַדְתִּי עַל
  choice: da werde ich … bestrafen
  rationale: פקד mit עַל bezeichnet im Gerichtszusammenhang ein strafendes Einschreiten. „Bestrafen“ macht diesen Sinn klar; „da“ verbindet die angekündigten Tage mit dem folgenden Handeln.
- source_word: כָּל מוּל
  choice: jeden, der … beschnitten ist
  rationale: Das substantivisch gebrauchte מוּל bezeichnet hier einen Beschnittenen; die Relativkonstruktion klingt in modernem Deutsch natürlich.
- source_word: בְּעָרְלָה
  choice: nur an der Vorhaut
  rationale: Die Wendung ist bewusst paradox. Diese Wiedergabe bezeichnet die körperliche Beschneidung, lässt aber durch „nur“ erkennen, dass sie allein nicht genügt, ohne die im Folgevers ausdrücklich genannte Unbeschnittenheit des Herzens vorwegzunehmen.
theological_decisions:
- issue: Wiedergabe der paradoxen Wendung מוּל בְּעָרְלָה
  choice: jeden, der nur an der Vorhaut beschnitten ist
  alternative: alle Beschnittenen samt den Unbeschnittenen
  rationale: Die Hauptfassung macht in natürlichem Deutsch verständlich, dass eine rein äußerliche Beschneidung gemeint ist, ohne die Aussage ausdrücklich auf das Herz festzulegen. Die stärker formale alternative Deutung wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem prophetischem Ton. „Siehe“ ist bewusst leicht gehoben; der Schluss wahrt die Schärfe und Spannung des hebräischen Paradoxons, ohne sie konfessionell auszudeuten.
