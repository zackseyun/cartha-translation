  source_fidelity: 'Die Gerichtsankündigung, die Zukunftsformel und פקד על als strafendes Eingreifen sind zutreffend wiedergegeben. Der Schluss „nur an der Vorhaut beschnitten“ ist jedoch im Deutschen semantisch und idiomatisch missverständlich: Beschneidung geschieht gerade an der Vorhaut und die Formulierung bringt das hebräische Paradox nicht angemessen zum Ausdruck. „Beschnitten und doch unbeschnitten“ bewahrt die gezielte Spannung von מוּל בְּעָרְלָה, ohne die im Kontext nahegelegte Deutung ausdrücklich in den Text einzutragen.'
  naturalness: „Siehe, es kommen Tage, spricht Jahwe“ ist als leicht gehobene prophetische Standardsprache gut verständlich. „Da werde ich“ ist natürlich. Die revidierte Schlussformulierung ist deutlich idiomatischer als „nur an der Vorhaut beschnitten“ und behält den knappen, scharfen Charakter der Aussage.
  terminology: „Jahwe“ ist konsequent zum vorgegebenen Namensgebrauch. „Bestrafen“ ist im Gerichtskontext für פקד על angemessen. Die Fußnote sollte die formale Mehrdeutigkeit genauer beschreiben, statt „samt den Unbeschnittenen“ als gleichwertige Übersetzung darzustellen, denn dies ergänzt eine im Hebräischen nicht ausdrücklich vorhandene Verbindung.
