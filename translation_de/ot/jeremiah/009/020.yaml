id: JER.9.20
reference: Jeremiah 9:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי עָ֤לָה מָ֨וֶת֙ בְּ/חַלּוֹנֵ֔י/נוּ בָּ֖א בְּ/אַרְמְנוֹתֵ֑י/נוּ לְ/הַכְרִ֤ית עוֹלָל֙ מִ/ח֔וּץ בַּחוּרִ֖ים מֵ/רְחֹבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/020.yaml
  text: For death has climbed in through our windows[a]; it has entered our palaces, to cut off the child from outside[b], the young men from the streets.
translation:
  language: de
  text: Denn der Tod ist durch unsere Fenster heraufgestiegen; er ist in unsere Paläste eingedrungen, um das Kind[a] draußen wegzuraffen, die jungen Männer von den Plätzen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Säugling“. Das hebräische Wort עוֹלָל kann ein sehr junges Kind bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den Straßen“. Das hebräische Wort kann breite öffentliche Flächen innerhalb einer Stadt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erklärung für den vorausgehenden Aufruf zur Klage ein und gibt diese Funktion im Deutschen natürlich wieder.
- source_word: עָלָה
  choice: ist … heraufgestiegen
  rationale: Bewahrt das konkrete Bild des Hinaufsteigens zu den Fenstern; zusammen mit „durch“ wird zugleich das Eindringen verständlich.
- source_word: מָוֶת
  choice: der Tod
  rationale: Gibt das Substantiv direkt wieder und erhält die Personifikation des Todes als eindringenden Feind.
- source_word: בְּחַלּוֹנֵינוּ
  choice: durch unsere Fenster
  rationale: Die Präposition bezeichnet hier den Weg, auf dem der Tod eindringt.
- source_word: בָּא
  choice: ist … eingedrungen
  rationale: Gibt das Hineinkommen in die Paläste idiomatisch wieder und führt das Bild einer feindlichen Invasion fort.
- source_word: בְּאַרְמְנוֹתֵינוּ
  choice: in unsere Paläste
  rationale: אַרְמוֹן bezeichnet einen Palast oder befestigten herrschaftlichen Wohnsitz; „Paläste“ ist hier klar und traditionsnah.
- source_word: לְהַכְרִית
  choice: um … wegzuraffen
  rationale: Das Verb bezeichnet das Abschneiden oder Beseitigen. In Verbindung mit dem personifizierten Tod vermittelt „wegraffen“ die tödliche Wirkung natürlich und eindringlich.
- source_word: עוֹלָל
  choice: das Kind
  rationale: Das singularische Substantiv bezeichnet ein sehr junges Kind und kann im poetischen Zusammenhang kollektiv stehen; die Übersetzung bewahrt den Singular, ohne das Alter enger als nötig festzulegen.
- source_word: מִחוּץ
  choice: draußen
  rationale: חוּץ bezeichnet den Außenbereich beziehungsweise den öffentlichen Raum. „Draußen“ erhält den Gegensatz zu den geschützten Innenräumen und vermeidet eine zu enge Festlegung auf eine bestimmte Art öffentlicher Fläche.
- source_word: בַּחוּרִים
  choice: die jungen Männer
  rationale: Bezeichnet junge Männer im heirats- oder wehrfähigen Alter und wird dem maskulinen Plural gerecht.
- source_word: מֵרְחֹבוֹת
  choice: von den Plätzen
  rationale: רְחֹבוֹת bezeichnet breite öffentliche Flächen einer Stadt, besonders Plätze, kann aber auch Straßen meinen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter poetischer Personifikation. „Heraufgestiegen“ erhält das ungewöhnliche hebräische Bild; „wegzuraffen“ verbindet die Vernichtungsaussage idiomatisch mit dem handelnd dargestellten Tod. Die elliptische Parallelkonstruktion im letzten Satzteil folgt der knappen hebräischen Dichtung.
