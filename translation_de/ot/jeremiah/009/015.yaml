  text: וַ/הֲפִֽצוֹתִי/ם֙ בַּ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יָֽדְע֔וּ הֵ֖מָּה וַֽ/אֲבוֹתָ֑/ם וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/015.yaml
  text: And I will scatter them among the nations that neither they nor their fathers have known[c][b][a], and I will send the sword after them until I have consumed them.
translation:
  language: de
  text: Und ich werde sie unter die Völker zerstreuen, die weder sie noch ihre Väter[a] gekannt haben. Und ich werde das Schwert[b] hinter ihnen her senden, bis ich sie vernichtet habe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Vorfahren“. Wörtlich steht im Hebräischen „ihre Väter“.'
    reason: lexical_alternative
  - marker: b
    text: „Das Schwert“ steht in der Bibel häufig als Bild für Krieg oder tödliches Gericht.
    reason: cultural_note
  - marker: c
    text: 'Oder: „bis ich ihnen ein Ende gemacht habe“ oder „bis ich sie aufgerieben habe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲפִצוֹתִים
  choice: Und ich werde sie … zerstreuen
  rationale: Die Hifil-Form von פוץ bezeichnet das Zerstreuen bzw. Auseinandertreiben; „zerstreuen“ ist im Deutschen natürlich und wahrt den Gerichtskontext.
- source_word: בַּגּוֹיִם
  choice: unter Völker
  rationale: גּוֹיִם bezeichnet hier fremde Völker bzw. Nationen. „Unter Völker“ gibt die Verteilung auf mehrere Völker idiomatisch wieder, ohne den späteren Gegensatz „Juden/Heiden“ einzutragen.
- source_word: אֲשֶׁר לֹא יָדְעוּ הֵמָּה וַאֲבוֹתָם
  choice: die weder sie noch ihre Väter gekannt haben
  rationale: ידע meint hier erfahrungsbezogene Bekanntschaft. „Weder … noch“ macht den Geltungsbereich der Verneinung im Deutschen eindeutig; „Väter“ bewahrt die konkrete hebräische Familienbezeichnung.
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת־הַחֶרֶב
  choice: Und ich werde das Schwert hinter ihnen herschicken
  rationale: „Das Schwert“ erhält das konkrete biblische Bild; „hinter ihnen herschicken“ bewahrt אַחֲרֵיהֶם und vermittelt zugleich die Verfolgung.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: bis ich sie vernichtet habe
  rationale: כלה bedeutet in dieser Konstruktion, etwas vollständig zu Ende zu bringen. Im Kontext tödlichen Gerichts drückt „vernichten“ die Folge klar und natürlich aus; die mögliche Nuance „ein Ende machen“ wird in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von וַאֲבוֹתָם
  choice: ihre Väter
  alternative: ihre Vorfahren
  rationale: „Väter“ entspricht der maskulinen konkreten Bezeichnung des hebräischen Textes; „Vorfahren“ ist als idiomatische Bedeutungsalternative vermerkt.
- issue: Bildhafte Bedeutung von הַחֶרֶב
  choice: das Schwert
  alternative: Krieg oder tödliches Gericht
  rationale: Der Haupttext bewahrt das konkrete Bild und legt nicht fest, ob ausschließlich Krieg, Hinrichtung oder allgemeiner tödliches Gericht gemeint ist.
- issue: Reichweite von עַד כַּלּוֹתִי אוֹתָם
  choice: bis ich sie vernichtet habe
  alternative: bis ich ihnen ein Ende gemacht habe
  rationale: Der Kontext verlangt eine sehr schwere Gerichtsaussage. Die Alternative hält die formellere Grundbedeutung von כלה sichtbar, ohne die Spannung im Haupttext abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Parallelismus, bleibt aber gut verständlich. Konkrete Bilder wie „Väter“ und „Schwert“ werden im Haupttext bewahrt; Fußnoten erläutern idiomatische beziehungsweise metonymische Alternativen.
