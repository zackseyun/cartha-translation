  text: מִֽי הָ/אִ֤ישׁ הֶֽ/חָכָם֙ וְ/יָבֵ֣ן אֶת זֹ֔את וַ/אֲשֶׁ֨ר דִּבֶּ֧ר פִּֽי יְהוָ֛ה אֵלָ֖י/ו וְ/יַגִּדָ֑/הּ עַל מָה֙ אָבְדָ֣ה הָ/אָ֔רֶץ נִצְּתָ֥ה כַ/מִּדְבָּ֖ר מִ/בְּלִ֖י עֹבֵֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/011.yaml
  text: Who is the wise man who can understand this? To whom has the mouth of Yahweh spoken[a], that he may declare it? Why has the land perished, laid waste like the wilderness[c][b], with no one passing through?
translation:
  language: de
  text: Wer ist der weise Mann, der dies verstehen kann? Zu wem hat der Mund Yahwehs gesprochen[a], damit er es verkündet? Warum ist das Land zugrunde gegangen und verwüstet wie die Wüste[b], ohne dass jemand hindurchzieht?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Mund Yahwehs“; eine prophetische Wendung für Yahwehs unmittelbares Reden.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „verbrannt wie die Wüste“. Das hebräische Verb kann Brand oder Versengung bezeichnen, meint im Zusammenhang jedoch auch den Zustand der Verwüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ הֶחָכָם
  choice: Wer ist der weise Mann
  rationale: Die ausdrücklich maskuline Singularform wird bewahrt; die Formulierung bleibt im Deutschen natürlich und würdevoll.
- source_word: וְיָבֵן אֶת זֹאת
  choice: der dies verstehen kann
  rationale: Das Imperfekt hat im Zusammenhang modalen Sinn und fragt nach einem Menschen, der fähig ist, die Ursache des Geschehens zu begreifen.
- source_word: וַאֲשֶׁר דִּבֶּר פִּי יְהוָה אֵלָיו
  choice: Zu wem hat der Mund Yahwehs gesprochen
  rationale: Die auffällige hebräische Wendung „Mund Yahwehs“ wird als Bild für unmittelbare göttliche Rede beibehalten.
- source_word: וְיַגִּדָהּ
  choice: damit er es verkündet
  rationale: Das Hifil bezeichnet das Bekanntmachen oder öffentliche Verkünden; das Pronomen greift den zu verstehenden Sachverhalt auf.
- source_word: עַל מָה
  choice: Warum
  rationale: Die idiomatische Frage nach dem Grund wird im modernen Deutschen am natürlichsten mit „Warum“ wiedergegeben.
- source_word: אָבְדָה הָאָרֶץ
  choice: ist das Land zugrunde gegangen
  rationale: „Zugrunde gegangen“ bewahrt die starke verbale Aussage von אבד, ohne eine vollständige Vernichtung des Landes zu behaupten.
- source_word: נִצְּתָה כַמִּדְבָּר
  choice: verbrannt wie die Wüste
  rationale: Die Form kann auf Verbrennung oder Versengung weisen; „verbrannt“ gibt diese konkrete Bildsprache wieder, während die mögliche allgemeinere Bedeutung in der Fußnote genannt wird.
- source_word: מִבְּלִי עֹבֵר
  choice: sodass niemand mehr hindurchzieht
  rationale: Die Wendung beschreibt die völlige Verödung durch das Ausbleiben aller Durchreisenden; „mehr“ macht den resultierenden Zustand im Deutschen deutlich.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen; die Transliteration bewahrt diesen als solchen.
- issue: Anthropomorphe Wendung „Mund Yahwehs“
  choice: im Haupttext beibehalten
  alternative: zu wem Yahweh gesprochen hat
  rationale: Das ausdrücklich verwendete Bild betont die unmittelbare göttliche Rede und soll nicht stillschweigend geglättet werden.
- issue: Maskuline Form הָאִישׁ הֶחָכָם
  choice: der weise Mann
  alternative: der weise Mensch
  rationale: Die grammatisch und lexikalisch maskuline Einzelform des Ausgangstextes wird bewahrt, ohne über ihre mögliche repräsentative Funktion hinauszugehen.
- issue: Bedeutung von נִצְּתָה
  choice: verbrannt
  alternative: verwüstet
  rationale: Die konkrete Bedeutung des Verbrennens ist lexikalisch gut begründet; da im Zusammenhang auch der Zustand der Verwüstung gemeint sein kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem prophetischem Ton. Die drei Fragen und die markante Bildsprache des Hebräischen bleiben erhalten; unnötige altertümliche Formen werden vermieden.
