id: JER.9.8
reference: Jeremiah 9:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה לֹֽא אֶפְקָד בָּ֖/ם נְאֻם יְהוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/008.yaml
  text: Shall I not punish them for these things? declares Yahweh[a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: de
  text: Sollte ich sie dafür nicht zur Rechenschaft ziehen? – Ausspruch Jahwes. Sollte meine Seele nicht Rache nehmen an einem Volk wie diesem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier „meine Seele“, eine bildhafte menschliche Redeweise über Gott; möglich wäre auch: „ich selbst“ oder „mein ganzes Wesen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקָד בָּם
  choice: Sollte ich sie dafür nicht zur Rechenschaft ziehen?
  rationale: Die Verbindung aus Fragepartikel und עַל bildet eine rhetorische Frage mit kausaler Bedeutung. פקד bezeichnet hier im Gerichtskontext ein strafendes Einschreiten; „zur Rechenschaft ziehen“ gibt dies natürlich und würdevoll wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und feierlich wiedergegeben. Der Gottesname יהוה erscheint als „Jahwe“, nicht als ersetzender Titel.
- source_word: אִם ... לֹא
  choice: Sollte ... nicht
  rationale: אִם leitet hier parallel zur ersten Satzhälfte eine rhetorische Frage ein und keinen Bedingungssatz.
- source_word: תִתְנַקֵּם נַפְשִׁי
  choice: Sollte meine Seele nicht Rache nehmen
  rationale: Die Wiedergabe bewahrt sowohl den reflexiv-medialen Sinn von נקם als auch die auffällige, bildhafte göttliche Selbstbezeichnung נַפְשִׁי.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: an einem Volk wie diesem
  rationale: Die Formulierung erhält die demonstrative Betonung und ist zugleich idiomatisches modernes Deutsch.
theological_decisions:
- issue: Göttliche Selbstbezeichnung נַפְשִׁי im Zusammenhang des Gerichts
  choice: meine Seele
  alternative: ich selbst / mein ganzes Wesen
  rationale: „Meine Seele“ bewahrt den anthropopathischen Ausdruck sowie seine emotionale und theologische Spannung, statt ihn durch eine erklärende Umschreibung einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen rhetorischen Fragen und die markante Wendung „meine Seele“ bleiben erhalten. „Ausspruch Jahwes“ gibt die prophetische Formel knapp und feierlich wieder.
