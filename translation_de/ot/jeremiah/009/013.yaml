  text: וַ/יֵּ֣לְכ֔וּ אַחֲרֵ֖י שְׁרִר֣וּת לִבָּ֑/ם וְ/אַחֲרֵי֙ הַ/בְּעָלִ֔ים אֲשֶׁ֥ר לִמְּד֖וּ/ם אֲבוֹתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/013.yaml
  text: They went after the stubbornness of their heart and after the Baals[a], which their fathers taught them.
translation:
  language: de
  text: Sie gingen dem Starrsinn ihres Herzens und den Baalen nach, die ihre Väter[a] sie gelehrt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Vorfahren“. Wörtlich steht im Hebräischen „ihre Väter“; gemeint sind hier frühere Generationen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: sie gingen … nach
  rationale: Die Verbindung von הלך mit אַחֲרֵי bedeutet „jemandem oder etwas nachgehen, folgen“. „Gingen … nach“ bewahrt das hebräische Bewegungsbild und ist im Deutschen verständlich.
- source_word: שְׁרִרוּת
  choice: Starrsinn
  rationale: Das Wort bezeichnet eigensinnige, trotzige Verhärtung. „Starrsinn“ gibt den moralischen Sinn im Jeremiabuch knapp und in modernem Deutsch wieder.
- source_word: לִבָּם
  choice: ihres Herzens
  rationale: Der hebräische Singular mit pluralischem Possessivsuffix bezeichnet kollektiv die innere Haltung und den Willen der Menschen. Der Singular bleibt im Deutschen erhalten.
- source_word: הַבְּעָלִים
  choice: den Baalen
  rationale: Der Plural bezeichnet verschiedene örtliche Erscheinungsformen oder Kultbilder des kanaanäischen Gottes Baal. Der eingedeutschte Plural „Baalen“ ist eindeutig und verständlich.
- source_word: אֲשֶׁר לִמְּדוּם
  choice: wie … es ihnen beigebracht hatten
  rationale: Der Relativanschluss ist knapp und kann sinngemäß die von den Vätern vermittelte Praxis des Nachfolgens bezeichnen. Die Formulierung wahrt diese Unbestimmtheit, ohne ausdrücklich „verehren“ oder „anbeten“ einzufügen.
- source_word: אֲבוֹתָם
  choice: ihre Väter
  rationale: Die wörtliche Bedeutung ist „ihre Väter“; im Zusammenhang sind die Vorväter beziehungsweise frühere Generationen gemeint. Die Hauptübersetzung erhält die konkrete hebräische Form, während die weitere Bedeutung in der Fußnote steht.
theological_decisions:
- issue: Bedeutung von אֲבוֹתָם
  choice: ihre Väter
  alternative: ihre Vorfahren
  rationale: Der ausdrücklich maskuline Plural des Ausgangstextes wird beibehalten. Dass damit frühere Generationen insgesamt gemeint sein können, wird offengelegt, aber nicht stillschweigend in den Haupttext eingetragen.
- issue: Gegenstand der väterlichen Unterweisung
  choice: wie ihre Väter es ihnen beigebracht hatten
  alternative: deren Verehrung ihre Väter sie gelehrt hatten
  rationale: Der hebräische Text nennt „Verehrung“ oder „Anbetung“ nicht ausdrücklich. Das neutrale „es“ verweist auf das Nachgehen hinter den Baalen und vermeidet eine unnötige theologische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Bildsprache des Nachgehens bleibt erhalten; die doppelte hebräische Präposition wird im Deutschen natürlich zusammengezogen. Die Formulierung vermeidet sowohl altertümliche Syntax als auch eine über den Ausgangstext hinausgehende ausdrückliche Benennung von Baalsverehrung.
