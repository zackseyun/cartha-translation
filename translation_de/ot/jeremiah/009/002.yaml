id: JER.9.2
reference: Jeremiah 9:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יַּדְרְכ֤וּ אֶת לְשׁוֹנָ/ם֙ קַשְׁתָּ֣/ם שֶׁ֔קֶר וְ/לֹ֥א לֶ/אֱמוּנָ֖ה גָּבְר֣וּ בָ/אָ֑רֶץ כִּי֩ מֵ/רָעָ֨ה אֶל רָעָ֧ה יָצָ֛אוּ וְ/אֹתִ֥/י לֹֽא יָדָ֖עוּ נְאֻם יְהוָֽה־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/002.yaml
  text: They bend their tongue[a] like their bow for falsehood, and not for faithfulness have they grown strong in the land; for from evil to evil they go out, and they do not know me[b], declares Yahweh.
translation:
  language: de
  text: Sie spannen ihre Zunge wie ihren Bogen für die Lüge; nicht in Treue sind sie im Land stark geworden. Denn von Bösem zu Bösem schreiten sie fort[a], und mich kennen sie nicht[b] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von einer Bosheit zur nächsten«.'
    reason: lexical_alternative
  - marker: b
    text: »Mich kennen« kann hier auch bedeuten, Jahwe in einer persönlichen Bundesbeziehung anzuerkennen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרְכוּ
  choice: sie spannen
  rationale: דרך bezeichnet beim Bogen das Spannen bzw. Schussfertigmachen. »Spannen« bewahrt das Waffenbild und ist im Deutschen idiomatisch.
- source_word: לְשׁוֹנָם קַשְׁתָּם
  choice: ihre Zunge wie ihren Bogen
  rationale: Die knappe hebräische Fügung setzt Zunge und Bogen bildhaft zueinander. Das ergänzte »wie« macht den Vergleich im Deutschen verständlich, ohne das Bild auszudeuten.
- source_word: שֶׁקֶר
  choice: für die Lüge
  rationale: שׁקר bezeichnet Lüge, Falschheit oder Täuschung. Der substantivische Ausdruck erhält den Gegensatz zur Treue im folgenden Satzteil.
- source_word: לֶאֱמוּנָה
  choice: durch Treue
  rationale: אֱמוּנָה umfasst Beständigkeit, Verlässlichkeit und Treue. »Durch Treue« gibt den ethischen Gegensatz zur Lüge klar wieder; die Präposition wird im Deutschen dem gemeinten Zusammenhang entsprechend idiomatisch gefasst.
- source_word: גָּבְרוּ בָאָרֶץ
  choice: sind sie im Land stark geworden
  rationale: גבר bedeutet stark oder mächtig werden; בארץ meint im Jeremiakontext vorrangig das Land, nicht die gesamte Erde.
- source_word: מֵרָעָה אֶל רָעָה יָצָאוּ
  choice: von Bösem zu Bösem schreiten sie fort
  rationale: Die Wendung beschreibt ein fortgesetztes Voranschreiten im Bösen. »Schreiten … fort« gibt die Bewegungsbedeutung von יצא in natürlichem Deutsch wieder.
- source_word: וְאֹתִי לֹא יָדָעוּ
  choice: und mich kennen sie nicht
  rationale: ידע kann sowohl Kenntnis als auch relationale und bundeshafte Anerkennung bezeichnen. »Kennen« bewahrt diese Bedeutungsweite.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die feste prophetische Formel wird würdig und knapp wiedergegeben; »Jahwe« ist die im Deutschen geläufige Wiedergabe des Gottesnamens.
theological_decisions:
- issue: Bundesbezogene Bedeutung von ידע
  choice: mich kennen sie nicht
  alternative: sie erkennen mich nicht an
  rationale: Der Haupttext soll die Aussage nicht auf bloßes Wissen und ebenso wenig ausschließlich auf ausdrückliche Anerkennung verengen. »Kennen« erhält die relationale und bundeshafte Spannung.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« entspricht der etablierten deutschen Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild von Zunge und Bogen sowie der knappe Gegensatz zwischen Lüge und Treue bleiben erhalten. Die Satzgliederung folgt dem hebräischen Gedankengang, vermeidet jedoch unnatürliche deutsche Wortstellung.
