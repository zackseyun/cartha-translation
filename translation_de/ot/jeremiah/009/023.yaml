id: JER.9.23
reference: Jeremiah 9:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם בְּ/זֹ֞את יִתְהַלֵּ֣ל הַ/מִּתְהַלֵּ֗ל הַשְׂכֵּל֮ וְ/יָדֹ֣עַ אוֹתִ/י֒ כִּ֚י אֲנִ֣י יְהוָ֔ה עֹ֥שֶׂה חֶ֛סֶד מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָ֑רֶץ כִּֽי בְ/אֵ֥לֶּה חָפַ֖צְתִּי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/023.yaml
  text: 'But let the one who boasts boast in this: that he understands and knows me[a], that I am Yahweh, who practices steadfast love, justice, and righteousness in the earth; for in these I delight[b], declares Yahweh.'
translation:
  language: de
  text: 'Sondern wer sich rühmt, soll sich dessen rühmen: dass er Einsicht hat und mich kennt; dass ich, Jahwe, auf der Erde Güte[a], Recht und Gerechtigkeit übe. Denn daran habe ich Gefallen, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische חֶסֶד bezeichnet eine beständige, loyale Zuwendung und kann je nach Zusammenhang auch mit »treue Liebe«, »Barmherzigkeit« oder »Bundestreue« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: Die Wendung stellt dem inhaltlichen Zusammenhang zufolge den einzig angemessenen Grund zum Rühmen den zuvor verworfenen Gründen gegenüber.
- source_word: בְּזֹאת
  choice: dessen
  rationale: Das deutsche Korrelat verweist natürlich auf den folgenden Inhaltssatz und gibt die Bedeutung von »darin/dessen« wieder.
- source_word: יִתְהַלֵּל / הַמִּתְהַלֵּל
  choice: wer sich rühmt, soll sich dessen rühmen
  rationale: Die Wiederholung des Verbs הלל im Hitpael bleibt erhalten; »soll« gibt den auffordernden Jussiv idiomatisch wieder.
- source_word: הַשְׂכֵּל
  choice: Einsicht hat
  rationale: שׂכל bezeichnet hier im Zusammenhang mit dem Erkennen Jahwes verständige Einsicht; die Formulierung vermeidet eine Reduktion auf bloßes Faktenwissen.
- source_word: וְיָדֹעַ אוֹתִי
  choice: und mich kennt
  rationale: ידע bezeichnet hier persönliches und relationales Erkennen; die direkte Wiedergabe bewahrt diese Bedeutungsweite.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֹשֶׂה
  choice: übt
  rationale: Das Partizip beschreibt Jahwes kennzeichnendes, fortdauerndes Handeln; »übt« passt im Deutschen zu allen drei folgenden Begriffen.
- source_word: חֶסֶד
  choice: treue Liebe
  rationale: Die Wendung verbindet Zuwendung mit Beständigkeit und Loyalität und bewahrt so die beziehungs- und bundesorientierte Bedeutungsfülle von חֶסֶד.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Im Dreiklang bezeichnet מִשְׁפָּט gerechtes Ordnen und Entscheiden; »Recht« hält den Begriff von צְדָקָה unterscheidbar.
- source_word: וּצְדָקָה
  choice: und Gerechtigkeit
  rationale: »Gerechtigkeit« gibt den ethischen Begriff wieder und erhält zugleich die begriffliche Spannung zu »Recht«.
- source_word: בָּאָרֶץ
  choice: auf der Erde
  rationale: אֶרֶץ kann die ganze Erde oder ein bestimmtes Land bezeichnen. Im Haupttext steht die mögliche universale Reichweite, während die engere Lesart in der Fußnote erhalten bleibt.
- source_word: כִּי בְאֵלֶּה חָפַצְתִּי
  choice: Denn daran habe ich Gefallen
  rationale: חפץ drückt Wohlgefallen und Freude aus, nicht nur eine sachliche Vorliebe; »daran« bezieht sich gesammelt auf die drei genannten Handlungsweisen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die etablierte prophetische Botenformel wird knapp und würdig wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration wahrt dessen Funktion als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von בָּאָרֶץ
  choice: auf der Erde
  alternative: im Land
  rationale: Der Satz beschreibt Jahwes charakteristisches Handeln in grundsätzlich weiter Perspektive; zugleich lässt das hebräische אֶרֶץ auch die örtlich engere Deutung »Land« zu, die deshalb ausdrücklich vermerkt wird.
- issue: Verhältnis von Einsicht und Gotteserkenntnis
  choice: dass er Einsicht hat und mich kennt
  alternative: dass er einsichtig ist, indem er mich erkennt
  rationale: Die Übersetzung bewahrt die Koordination der hebräischen Ausdrücke und legt nicht fest, ob der zweite Ausdruck den ersten näher erklärt oder beide unterscheidbare Aspekte benennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »sich rühmen« und der Dreiklang »treue Liebe, Recht und Gerechtigkeit« bewahren die rhetorische Gestalt des Hebräischen. Der Doppelpunkt und das Semikolon gliedern den dichten Ausspruch lesefreundlich, ohne seine inhaltlichen Beziehungen festzulegen.
