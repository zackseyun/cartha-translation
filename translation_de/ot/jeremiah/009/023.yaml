revisions:
- from: 'Sondern wer sich rühmt, soll sich dessen rühmen: dass er Einsicht hat und mich kennt; dass ich Jahwe bin, der treue Liebe[a], Recht und Gerechtigkeit auf der Erde[b] übt. Denn daran habe ich Gefallen, spricht Jahwe.'
  to: 'Sondern wer sich rühmt, soll sich dessen rühmen: dass er Einsicht hat und mich kennt; dass ich, Jahwe, auf der Erde Güte[a], Recht und Gerechtigkeit übe. Denn daran habe ich Gefallen, spricht Jahwe.'
  rationale: Die Änderung ersetzt allein die im Deutschen unnatürliche Verbindung »treue Liebe üben« durch »Güte üben«. Die Aussage bleibt offen genug für die volle Bedeutungsbreite von חֶסֶד, die in der Fußnote erläutert wird. Die Fußnote zu אֶרֶץ bleibt als legitime lexikalische Alternative erhalten, benötigt im revidierten Haupttext aber ihren Anker direkt bei »Erde«.
