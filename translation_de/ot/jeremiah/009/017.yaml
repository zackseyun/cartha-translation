    issue: »Klagelied« ist enger als נֶהִי
    rationale: נֶהִי bezeichnet Klage bzw. Wehklage und muss kein Lied im engeren Sinn sein. »Eine Klage anstimmen« ist idiomatisch und wahrt die lexikalische Offenheit.
  - severity: low
    issue: Fußnote formuliert den poetischen Sinn zu definitiv
    rationale: Die Fußnote sollte primär die wörtliche hebräische Lesart »Wasser« und deren Parallelismus zu »Tränen« dokumentieren, ohne den Ausdruck vollständig in einen bloßen Ersatzbegriff aufzulösen.
