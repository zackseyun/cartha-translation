    issue: Unnatürliche aktive Konstruktion mit den Lidern
    rationale: »Unsere Lider Wasser verströmen« ist im Deutschen semantisch und stilistisch unerquicklich. Der hebräische Parallelismus lässt sich natürlicher als aus den Lidern strömendes Wasser ausdrücken, ohne das Bild zu verlieren.
