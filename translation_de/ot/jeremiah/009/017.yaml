base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/017.yaml
  text: Let them hurry and raise a lament over us[a], so that our eyes may run down with tears and our eyelids flow with water.
translation:
  language: de
  text: Sie sollen sich beeilen und über uns eine Klage anstimmen, damit Tränen aus unseren Augen fließen und Wasser aus unseren Lidern strömt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Wasser“; im poetischen Parallelismus zu „Tränen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְמַהֵרְנָה
  choice: Sie sollen sich beeilen
  rationale: Die Form hat hier auffordernden Charakter und bezeichnet angesichts der herbeigerufenen Klagefrauen dringliches Handeln.
- source_word: וְתִשֶּׂנָה עָלֵינוּ נֶהִי
  choice: und über uns ein Klagelied anstimmen
  rationale: Die Verbindung von נשׂא mit נֶהִי bezeichnet idiomatisch das Erheben beziehungsweise Anstimmen einer Totenklage; die deutsche Wendung ist natürlich und bewahrt den feierlichen Ton.
- source_word: נֶהִי
  choice: Klagelied
  rationale: Das Wort bezeichnet Klage oder Wehklage. „Klagelied“ passt zur Handlung der professionellen Klagefrauen, ohne die Aussage unnötig einzuengen.
- source_word: וְתֵרַדְנָה עֵינֵינוּ דִּמְעָה
  choice: damit unsere Augen von Tränen überströmen
  rationale: Die poetische Verbindung beschreibt reichlich herabfließende Tränen. „Von Tränen überströmen“ gibt das Bild in verständlichem, gehobenem Deutsch wieder; der hebräische Singular דִּמְעָה ist kollektiv verstanden.
- source_word: וְעַפְעַפֵּינוּ יִזְּלוּ מָיִם
  choice: und unsere Lider Wasser verströmen
  rationale: Die Wiedergabe erhält sowohl die Lider als Satzgegenstand als auch das ausdrücklich genannte „Wasser“ und bewahrt so den poetischen Parallelismus.
- source_word: מָיִם
  choice: Wasser
  rationale: Der konkrete Ausdruck des Hebräischen bleibt im Haupttext erhalten; im Parallelismus ist damit poetisch Tränenwasser gemeint.
