- from: Sie sollen sich beeilen und über uns ein Klagelied anstimmen, damit unsere Augen von Tränen überströmen und unsere Lider Wasser[a] verströmen.
  to: Sie sollen sich beeilen und über uns eine Klage anstimmen, damit Tränen aus unseren Augen fließen und Wasser aus unseren Lidern strömt.[a]
  rationale: Die Revision ersetzt die unidiomatische Formulierung, nach der Lider selbst Wasser »verströmen«, durch ein im Deutschen natürliches Bild des aus Augen und Lidern fließenden Wassers. Sie bewahrt die Reihenfolge und den poetischen Parallelismus des Hebräischen. »Klage« vermeidet die unbegründete Einengung auf ein Lied; die Fußnote dokumentiert die wörtliche hebräische Wortwahl zurückhaltend.
