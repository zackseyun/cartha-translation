  verdict: revise
  source_fidelity: Der Text gibt die Botenformel, den Gottesnamen, den Titel »der Heerscharen«, die Abfolge der Imperative und die zweimalige Aufforderung zum Kommen sachgerecht wieder. »Kundigen Frauen« ist als kontextuelle Wiedergabe von הַחֲכָמוֹת vertretbar und wird durch die Fußnote angemessen mit der wörtlicheren Lesart »weise Frauen« verbunden.
  naturalness: »Ruft die Klagefrauen herbei« macht im modernen Standarddeutsch klarer als das bloße »Ruft die Klagefrauen«, dass die Frauen bestellt bzw. herbeigerufen werden sollen. Die übrige knappe, eindringliche Satzfolge ist natürlich und dem Register angemessen.
  terminology: »Jahwe der Heerscharen« ist eine etablierte, quellennah verständliche Wiedergabe. »Klagefrauen« ist neutral und passend. Die bisherige Fußnotenalternative »Klageweiber« ist im heutigen Deutsch abwertend bzw. veraltet und sollte nicht als lexikalische Alternative angeboten werden.
