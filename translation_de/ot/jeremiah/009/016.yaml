source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִתְבּֽוֹנְנ֛וּ וְ/קִרְא֥וּ לַ/מְקוֹנְנ֖וֹת וּ/תְבוֹאֶ֑ינָה וְ/אֶל הַ/חֲכָמ֥וֹת שִׁלְח֖וּ וְ/תָבֽוֹאנָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/016.yaml
  text: 'Thus says Yahweh of hosts: Consider[a], and call for the mourning women, that they may come; and send for the skillful women[b], that they may come.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Gebt acht! Ruft die Klagefrauen herbei, damit sie kommen! Schickt nach den kundigen Frauen, damit sie kommen!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die etablierte deutsche Wiedergabe bewahrt die umfassende Bedeutung des Titels, ohne ihn auf irdische Armeen zu verengen.
- source_word: הִתְבּוֹנְנוּ
  choice: Gebt acht!
  rationale: Der Imperativ fordert zu aufmerksamer Wahrnehmung und Besinnung auf; die objektlose deutsche Form bleibt ebenso offen wie der hebräische Ausdruck.
- source_word: וְקִרְאוּ לַמְקוֹנְנוֹת
  choice: Ruft die Klagefrauen
  rationale: Das feminine Partizip bezeichnet Frauen, die Totenklagen anstimmen; „Klagefrauen“ ist knapp und lässt offen, ob ihre berufsmäßige Tätigkeit ausdrücklich hervorgehoben werden soll.
- source_word: וּתְבוֹאֶינָה
  choice: damit sie kommen
  rationale: Nach dem Imperativ drückt die Verbform die beabsichtigte Folge aus.
- source_word: הַחֲכָמוֹת
  choice: die kundigen Frauen
  rationale: חכמות kann wörtlich „weise Frauen“ bedeuten, bezeichnet hier im Parallelismus aber wahrscheinlich Frauen mit Erfahrung und Können in der Totenklage.
- source_word: שִׁלְחוּ
  choice: Schickt nach
  rationale: Die deutsche Wendung gibt idiomatisch wieder, dass Boten ausgesandt werden sollen, um die Frauen herbeizuholen.
- source_word: וְתָבֹאנָה
  choice: damit sie kommen
  rationale: Die Wiederholung erhält den Parallelismus und die beabsichtigte Folge der Aufforderung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich; die Umschrift wahrt dessen Charakter als Eigenname.
- issue: Bedeutung von הַחֲכָמוֹת im Zusammenhang der Klage
  choice: die kundigen Frauen
  alternative: die weisen Frauen
  rationale: Der unmittelbare Parallelismus mit den Klagefrauen legt besondere Sachkunde im Klagen nahe, ohne die Grundbedeutung „weise“ vollständig auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Aufforderungssätze bewahren den eindringlichen Rhythmus und den Parallelismus des Hebräischen. „Heerscharen“ bleibt als etablierter Ausdruck des prophetischen Gottesnamens erhalten.
