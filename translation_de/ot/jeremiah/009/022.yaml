source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל יִתְהַלֵּ֤ל חָכָם֙ בְּ/חָכְמָת֔/וֹ וְ/אַל יִתְהַלֵּ֥ל הַ/גִּבּ֖וֹר בִּ/גְבֽוּרָת֑/וֹ אַל יִתְהַלֵּ֥ל עָשִׁ֖יר בְּ/עָשְׁרֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/022.yaml
  text: 'Thus says Yahweh: Let not the wise man boast in his wisdom[a], and let not the mighty man boast in his might; let not the rich man boast in his riches.'
translation:
  language: de
  text: 'So spricht Jahwe[a]: Der Weise rühme sich nicht seiner Weisheit, und der Starke rühme sich nicht seiner Stärke; der Reiche rühme sich nicht seines Reichtums.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die prophetische Botenformel wird in natürlichem, feierlichem Deutsch mit Präsens wiedergegeben; der Gottesname יְהוָה bleibt als Eigenname erhalten.
- source_word: אַל יִתְהַלֵּל
  choice: rühme sich nicht
  rationale: Der Hitpael von הלל bezeichnet hier das Sich-Rühmen bzw. die Selbsterhebung. Der deutsche Konjunktiv bewahrt den Charakter der jussivischen Untersagung und den gehobenen prophetischen Ton.
- source_word: חָכָם
  choice: der Weise
  rationale: Das substantivierte maskuline Singularadjektiv wird als repräsentative Einzahl wiedergegeben.
- source_word: בְּחָכְמָתוֹ
  choice: seiner Weisheit
  rationale: Beim Verb „sich rühmen“ gibt der Genitiv den Bereich oder Grund des Rühmens idiomatisch und prägnant wieder.
- source_word: הַגִּבּוֹר
  choice: der Starke
  rationale: גִּבּוֹר kann einen starken, mächtigen oder kriegstüchtigen Mann bezeichnen. Im Dreiklang menschlicher Vorzüge ist „der Starke“ bewusst allgemein und verengt die Aussage nicht auf einen Krieger.
- source_word: בִּגְבוּרָתוֹ
  choice: seiner Stärke
  rationale: „Stärke“ bewahrt die Wortverwandtschaft mit „der Starke“ und bezeichnet hier menschliche Kraft oder Macht.
- source_word: עָשִׁיר
  choice: der Reiche
  rationale: Das substantivierte Adjektiv in repräsentativer männlicher Einzahl entspricht parallel „der Weise“ und „der Starke“.
- source_word: בְּעָשְׁרוֹ
  choice: seines Reichtums
  rationale: „Reichtum“ ist die natürliche deutsche Entsprechung für materiellen Besitz und wahrt die parallele Satzstruktur.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder; die traditionelle Ersatzlesung wird in der Fußnote genannt.
- issue: Bedeutungsumfang von גִּבּוֹר
  choice: der Starke
  alternative: der Mächtige / der Krieger
  rationale: Der unmittelbare Zusammenhang stellt Weisheit, Stärke und Reichtum als Gründe menschlichen Rühmens nebeneinander. „Der Starke“ erhält diesen allgemeinen Sinn, ohne ausschließlich politische oder militärische Macht anzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst prophetischem Sprachrhythmus. Der Konjunktiv „rühme sich nicht“ bildet die dreifache jussivische Mahnung knapp und parallel ab.
