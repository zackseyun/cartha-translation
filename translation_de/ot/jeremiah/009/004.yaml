  terminology: „Wahrheit“, „Lügen“ und „Unrecht“ sind klare und registergerechte Entsprechungen. Die Fußnoten bewahren die lexikalischen Spielräume bei יְהָתֵלּוּ und der Schlusswendung. Es sind keine theologischen Fachbegriffe oder konfessionell lenkenden Formulierungen eingeführt.
