  text: וְ/אִ֤ישׁ בְּ/רֵעֵ֨/הוּ֙ יְהָתֵ֔לּוּ וֶ/אֱמֶ֖ת לֹ֣א יְדַבֵּ֑רוּ לִמְּד֧וּ לְשׁוֹנָ֛/ם דַּבֶּר שֶׁ֖קֶר הַעֲוֵ֥ה נִלְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/004.yaml
  text: And each man deceives his neighbor[a], and they do not speak truth; they have taught their tongue to speak falsehood[b]; they weary themselves committing iniquity.
translation:
  language: de
  text: Jeder täuscht seinen Nächsten[a], und sie sagen nicht die Wahrheit. Sie haben ihre Zunge darin geschult, Lügen zu reden; sie mühen sich ab, Unrecht zu tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treibt mit seinem Nächsten Spott“; auch: „geht hinterlistig mit seinem Nächsten um“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Sie erschöpfen sich damit, verkehrt zu handeln.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: jeder
  rationale: Der Singular hat hier distributive Bedeutung. „Jeder“ gibt diese allgemein-repräsentative Aussage im heutigen Deutsch natürlich wieder.
- source_word: בְּרֵעֵהוּ
  choice: seinen Nächsten
  rationale: רֵעַ bezeichnet hier den Mitmenschen im sozialen Nahbereich; „Nächster“ bewahrt den ethischen Klang, ohne besondere Freundschaft vorauszusetzen.
- source_word: יְהָתֵלּוּ
  choice: täuscht
  rationale: Im Zusammenhang mit unwahrer Rede steht das Irreführen im Vordergrund. Die mögliche Nuance des Spottens oder eines hinterlistigen Umgangs wird in einer Fußnote offengehalten.
- source_word: אֱמֶת לֹא יְדַבֵּרוּ
  choice: sie sagen nicht die Wahrheit
  rationale: Diese natürliche deutsche Wendung gibt den Gegensatz zwischen אֱמֶת und שֶׁקֶר klar wieder.
- source_word: לִמְּדוּ לְשׁוֹנָם
  choice: sie haben ihre Zunge darauf abgerichtet
  rationale: „Abgerichtet“ bewahrt das eindringliche Bild einer bewusst eingeübten und verfestigten Gewohnheit, klingt im Deutschen jedoch idiomatischer als „ihre Zunge gelehrt“.
- source_word: דַּבֶּר שֶׁקֶר
  choice: Lügen zu reden
  rationale: שֶׁקֶר bezeichnet hier lügnerische Rede. „Lügen reden“ ist verständlich und behält den gehobenen prophetischen Ton.
- source_word: הַעֲוֵה נִלְאוּ
  choice: sie mühen sich ab, Unrecht zu tun
  rationale: Die Formulierung verbindet das Ermatten beziehungsweise Sich-Abmühen mit verkehrtem Handeln. Die deutsche Fassung erhält das zugespitzte Bild, dass sie selbst das Unrecht mit Anstrengung betreiben.
theological_decisions:
- issue: Art und Grad der bewussten Einübung falscher Rede
  choice: „darauf abgerichtet“ stellt die verfestigte, eingeübte Gewohnheit heraus
  alternative: „gelehrt“ oder „daran gewöhnt“
  rationale: Der Text beschreibt keine bloße einzelne Lüge, sondern eine kultivierte Praxis, ohne darüber hinaus eine besondere Lehre über Willensfreiheit oder Verderbtheit festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die anschauliche Rede von der abgerichteten Zunge und die ungewöhnliche Zuspitzung des Sich-Abmühens im Unrecht bleiben erhalten.
