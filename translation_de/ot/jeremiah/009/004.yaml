  to: Jeder täuscht seinen Nächsten[a], und sie sagen nicht die Wahrheit. Sie haben ihre Zunge darin geschult, Lügen zu reden; sie mühen sich ab, Unrecht zu tun.[b]
  rationale: Die Revision beschränkt sich auf eine stilistisch und semantisch sichere Verbesserung von „darauf abgerichtet“ zu „darin geschult“. Dadurch bleibt die im Hebräischen ausgedrückte bewusst kultivierte Praxis falscher Rede erhalten, während eine im Deutschen unpassende Tiertrainingsassoziation vermieden wird. Fußnotenanker und Fußnotentexte bleiben vollständig und korrekt zugeordnet.
