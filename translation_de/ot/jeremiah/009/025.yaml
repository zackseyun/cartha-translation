source:
  edition: WLC
  text: עַל מִצְרַ֣יִם וְ/עַל יְהוּדָ֗ה וְ/עַל אֱד֞וֹם וְ/עַל בְּנֵ֤י עַמּוֹן֙ וְ/עַל מוֹאָ֔ב וְ/עַל֙ כָּל קְצוּצֵ֣י פֵאָ֔ה הַ/יֹּשְׁבִ֖ים בַּ/מִּדְבָּ֑ר כִּ֤י כָל הַ/גּוֹיִם֙ עֲרֵלִ֔ים וְ/כָל בֵּ֥ית יִשְׂרָאֵ֖ל עַרְלֵי לֵֽב־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/009/025.yaml
  text: against Egypt[a], and against Judah, and against Edom, and against the sons of Ammon, and against Moab, and against all those with the corners of their hair cut off, who dwell in the wilderness; for all the nations are uncircumcised, and all the house of Israel are uncircumcised in heart.
translation:
  language: de
  text: über Ägypten, über Juda, über Edom, über die Söhne Ammons, über Moab und über alle, die am Rand gestutzt sind[a], die in der Wüste wohnen. Denn alle Völker sind unbeschnitten, und das ganze Haus Israel ist am Herzen unbeschnitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „alle, die am Rand gestutzt sind“. Wahrscheinlich ist eine besondere Haartracht von Wüstenvölkern gemeint; möglicherweise waren die Schläfen betroffen.'
    reason: Die hebräische Wendung ist konkret, doch ihre genaue ethnografische und körperliche Bezugnahme bleibt unsicher.
lexical_decisions:
- source_word: עַל
  choice: über
  rationale: Die Präposition setzt die in Vers 24 begonnene Aufzählung der vom Gericht Betroffenen fort. Im Deutschen fügt sich „über“ natürlich in die vorausgesetzte Wendung „Heimsuchung bringen über“ ein, ohne den Satz künstlich neu zu beginnen.
- source_word: בְּנֵי עַמּוֹן
  choice: die Söhne Ammons
  rationale: Die Formulierung bildet die hebräische Kollektivbezeichnung transparent ab und bewahrt ihre grammatisch maskuline Gestalt.
- source_word: כָּל קְצוּצֵי פֵאָה
  choice: alle, deren Haar an den Schläfen gestutzt ist
  rationale: Die Wendung bezeichnet wörtlich an Rand oder Ecke Beschnittene und wahrscheinlich eine kennzeichnende Haartracht von Wüstenvölkern. „An den Schläfen“ vermittelt das konkrete Bild, ohne eine genauere ethnografische Rekonstruktion zu behaupten.
- source_word: הַיֹּשְׁבִים בַּמִּדְבָּר
  choice: die in der Wüste wohnen
  rationale: „Wüste“ gibt מִדְבָּר hier im Zusammenhang mit den genannten Wüstenvölkern klar und idiomatisch wieder; „wohnen“ erhält den würdevollen prophetischen Ton.
- source_word: כָל הַגּוֹיִם
  choice: alle diese Völker
  rationale: Der bestimmte Ausdruck nimmt im Kontext die gerade aufgezählten fremden Völker auf. „Diese“ macht diesen Bezug im Deutschen verständlich, ohne daraus einen allgemeinen Juden-Heiden-Gegensatz zu machen.
- source_word: עֲרֵלִים
  choice: unbeschnitten
  rationale: Die wörtliche Wiedergabe bewahrt die bundesbezogene und polemische Kraft des Ausdrucks.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: das ganze Haus Israel
  rationale: Die kollektive hebräische Wendung bleibt in einer geläufigen, würdevollen deutschen Form erhalten.
- source_word: עַרְלֵי לֵב
  choice: am Herzen unbeschnitten
  rationale: Die Formulierung erhält das körperlich-bundesbezogene Bild und ist zugleich als Aussage über Israels inneren Zustand verständlich.
theological_decisions:
- issue: Metaphorische Beschreibung des Zustands Israels
  choice: am Herzen unbeschnitten
  alternative: innerlich unbeschnitten; hartherzig
  rationale: Der hebräische Text stellt die äußere Beschneidung Israels spannungsvoll seinem inneren Zustand gegenüber. Die Metapher wird deshalb nicht in eine rein deutende Umschreibung aufgelöst.
- issue: Bezeichnung der Ammoniter
  choice: die Söhne Ammons
  alternative: die Ammoniter
  rationale: Die quellensprachliche Form bleibt sichtbar und fungiert kollektiv, ohne über ihre ethnische Bedeutung hinaus eine Lehrentscheidung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. Da der Vers syntaktisch die Gerichtsaussage aus Vers 24 fortsetzt, beginnt die Übersetzung bewusst mit „über“. Die Wiederholung wird maßvoll gestrafft, während die Aufzählung und die abschließende Gegenüberstellung der Völker mit Israel erhalten bleiben.
