source:
  edition: WLC
  text: בַּ/חֹ֤דֶשׁ הָֽ/רְבִיעִי֙ בְּ/תִשְׁעָ֣ה לַ/חֹ֔דֶשׁ וַ/יֶּחֱזַ֥ק הָ/רָעָ֖ב בָּ/עִ֑יר וְ/לֹא הָיָ֥ה לֶ֖חֶם לְ/עַ֥ם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/006.yaml
  text: In the fourth month[a], on the ninth day of the month, the famine became severe in the city, and there was no bread for the people of the land.
translation:
  language: de
  text: Im vierten Monat, am neunten Tag des Monats, wurde die Hungersnot in der Stadt immer schlimmer, und es gab kein Brot für das Volk des Landes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die einfachen Leute“. Die hebräische Wendung kann je nach Zusammenhang die Bevölkerung des Landes oder genauer die einfachen Leute bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרְבִיעִי
  choice: Im vierten Monat
  rationale: Die bestimmte Ordnungszahl bildet eine Datumsangabe. „Des Jahres“ steht nicht ausdrücklich im Hebräischen und wird daher nicht ergänzt.
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: am neunten Tag des Monats
  rationale: Die Ergänzung „Tag“ gibt die übliche hebräische Datierungsformel im Deutschen natürlich und eindeutig wieder.
- source_word: וַיֶּחֱזַק הָרָעָב
  choice: wurde die Hungersnot … immer schlimmer
  rationale: חזק bedeutet grundsätzlich „stark sein/werden“; mit Hungersnot als Subjekt bezeichnet es hier deren zunehmende Schwere. Die Formulierung ist idiomatisches modernes Deutsch.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Die einfache Ortsangabe bleibt erhalten; aus dem Zusammenhang ist Jerusalem gemeint, ohne dass der Name im Vers ergänzt werden muss.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: hatte kein Brot mehr
  rationale: לֶחֶם wird konkret als „Brot“ wiedergegeben. Die deutsche Besitzkonstruktion entspricht hier idiomatisch dem hebräischen Existenzsatz mit לְ; „mehr“ verdeutlicht im Zusammenhang die eingetretene Versorgungslosigkeit.
- source_word: לְעַם הָאָרֶץ
  choice: das Volk des Landes
  rationale: Die wörtliche Wiedergabe bewahrt die mögliche Spannweite der Wendung, die je nach Kontext die Landesbevölkerung beziehungsweise die einfachen Leute bezeichnen kann.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Datumsformel bleibt eng am Hebräischen; die Zunahme der Hungersnot und der Brotmangel werden idiomatisch ausgedrückt. Die soziale Bedeutung von עַם הָאָרֶץ wird nicht im Haupttext festgelegt, sondern in der Fußnote offengehalten.
