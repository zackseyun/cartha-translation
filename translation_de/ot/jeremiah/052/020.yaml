source:
  edition: WLC
  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם אֶחָד֙ וְ/הַ/בָּקָ֞ר שְׁנֵים עָשָׂ֤ר נְחֹ֨שֶׁת֙ אֲשֶׁר תַּ֣חַת הַ/מְּכֹנ֔וֹת אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֻשְׁתָּ֖/ם כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/020.yaml
  text: As for the two pillars[a], the one Sea, and the twelve bronze oxen that were under the stands[b], which King Solomon had made for the house of Yahweh—there was no weighing the bronze of all these vessels.
translation:
  language: de
  text: Die beiden Säulen, das eine »Meer«[a] und die zwölf bronzenen Rinder[b] unter den Gestellen, die König Salomo für das Haus Jahwes gemacht hatte – die Bronze all dieser Geräte war nicht zu wiegen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Meer« war das große bronzene Wasserbecken des Tempels.
    reason: Sachklärung des technischen Ausdrucks יָם.
  - marker: b
    text: 'Auch möglich: »Stiere aus Bronze« oder »Rinder aus Bronze«.'
    reason: בָּקָר ist eine Sammelbezeichnung für Rinder; das Geschlecht der dargestellten Tiere wird hier nicht eindeutig bezeichnet.
  - marker: c
    text: 'Wörtlich: »Für ihre Bronze gab es kein Gewicht.« Gemeint sein kann, dass sie nicht gewogen wurde oder dass ihr Gewicht nicht mehr zu erfassen war.'
    reason: Die hebräische Wendung lässt offen, ob keine Wägung vorgenommen wurde oder ob die Menge als unermesslich galt.
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: die beiden Säulen
  rationale: עַמּוּדִים bezeichnet tragende oder freistehende Säulen; im Zusammenhang der Tempelausstattung ist »Säulen« die geläufige und präzise Wiedergabe.
- source_word: הַיָּם אֶחָד
  choice: das eine »Meer«
  rationale: יָם ist hier die Bezeichnung des großen bronzenen Wasserbeckens des Tempels. Die Anführungszeichen kennzeichnen den Ausdruck als Namen eines Kultgeräts; »eine« bewahrt den aufzählenden Stil.
- source_word: וְהַבָּקָר שְׁנֵים עָשָׂר נְחֹשֶׁת
  choice: und die zwölf bronzenen Rinder
  rationale: בָּקָר bezeichnet Rinder beziehungsweise Rinderfiguren; נְחֹשֶׁת wird dem heutigen Sprachgebrauch entsprechend als Bronze wiedergegeben.
- source_word: אֲשֶׁר תַּחַת הַמְּכֹנוֹת
  choice: unter den Gestellen
  rationale: מְכֹנוֹת bezeichnet die fahrbaren Gestelle oder Unterbauten der Tempelgeräte. »Gestelle« ist im Deutschen verständlich und wahrt die gegenständliche Bedeutung.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: die König Salomo … hatte anfertigen lassen
  rationale: Die Formulierung gibt Salomo als Veranlasser der Herstellung wieder und ordnet die Herstellung zeitlich vor den erzählten Ereignissen ein. Der Bezug des Relativpronomens bleibt im Deutschen ähnlich offen wie im Hebräischen.
- source_word: לְבֵית יְהוָה
  choice: für das Haus Jahwes
  rationale: בֵית bewahrt das hebräische Bild vom Tempel als »Haus«; der Gottesname יהוה wird als »Jahwe« wiedergegeben.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֻשְׁתָּם
  choice: die Bronze … war nicht zu wiegen
  rationale: Die knappe hebräische Wendung lautet wörtlich, es habe für ihre Bronze »kein Gewicht« gegeben. Die deutsche Fassung wahrt die Aussage einer nicht angegebenen beziehungsweise nicht mehr feststellbaren oder unermesslichen Gewichtsmenge, ohne eine exakte Zahl zu ergänzen.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: all dieser Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Geräte, Gegenstände oder Gefäße. »Geräte« umfasst hier auch Säulen, Becken, Figuren und Gestelle angemessen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. »Jahwe« gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des zweiten אֲשֶׁר
  choice: relativischer Anschluss, der im Deutschen vorrangig auf die Gestelle weist, aber nicht ausdrücklich eingeengt wird
  alternative: ausdrücklicher Bezug auf sämtliche aufgezählten Gegenstände
  rationale: Der hebräische Relativsatz steht unmittelbar nach הַמְּכֹנוֹת, kann im größeren Satzgefüge jedoch die von Salomo angefertigte Tempelausstattung kennzeichnen. Die Übersetzung vermeidet eine erklärende Festlegung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem aufzählenden Charakter eines Tempelinventars. Der Gedankenstrich bildet den Übergang von der Gegenstandsliste zur Aussage über die unbestimmbare Bronzemenge ab. Fachausdrücke werden im Haupttext knapp gehalten und in den Fußnoten erläutert.
