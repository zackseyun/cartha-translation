source:
  edition: WLC
  text: וְ/אֶת הַ֠/סִּרוֹת וְ/אֶת הַ/יָּעִ֨ים וְ/אֶת הַֽ/מְזַמְּר֜וֹת וְ/אֶת הַ/מִּזְרָקֹ֣ת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁר יְשָׁרְת֥וּ בָ/הֶ֖ם לָקָֽחוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/018.yaml
  text: They took away the pots[a], the shovels, the snuffers, the basins, the dishes[c][b], and all the bronze vessels with which they ministered.
translation:
  language: de
  text: Die Töpfe, die Schaufeln, die Dochtscheren[a], die Becken, die Schalen[b] und alle Geräte aus Bronze, mit denen der Dienst verrichtet wurde[c], nahmen sie mit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schneidewerkzeuge zum Zurichten der Lampen. Die genaue Art dieser Geräte ist nicht sicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Löffel beziehungsweise kleine Gefäße.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der Dienst im Tempel.
    reason: clarification
lexical_decisions:
- source_word: הַסִּרוֹת
  choice: die Töpfe
  rationale: סִיר bezeichnet gewöhnlich einen Topf oder Kochkessel. „Töpfe“ ist in dieser Inventarliste natürlich und vermeidet eine unnötige Festlegung auf eine bestimmte Verwendung.
- source_word: הַיָּעִים
  choice: die Schaufeln
  rationale: יָעִים sind Geräte zum Aufnehmen beziehungsweise Entfernen von Asche oder Kohlen; „Schaufeln“ ist dafür die klare, übliche Bezeichnung.
- source_word: הַמְזַמְּרוֹת
  choice: die Dochtscheren
  rationale: Das Wort bezeichnet Schneide- oder Trimmgeräte und wird in Listen von Tempelgeräten meist auf die Pflege der Lampendochte bezogen. „Dochtscheren“ gibt diese wahrscheinliche Funktion knapp wieder; die lexikalische Unsicherheit bleibt in der Fußnote sichtbar.
- source_word: הַמִּזְרָקֹת
  choice: die Becken
  rationale: מִזְרָק bezeichnet ein Gefäß, das unter anderem für Flüssigkeiten im Opferdienst verwendet wurde. „Becken“ wahrt den kultischen Zusammenhang, ohne die genaue Funktion zu eng zu bestimmen.
- source_word: הַכַּפּוֹת
  choice: die Schalen
  rationale: כַּפּוֹת kann kleine schalen-, löffel- oder pfannenartige Gefäße bezeichnen. „Schalen“ ist eine verständliche, hinreichend offene Wiedergabe.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: alle Geräte aus Bronze
  rationale: כְּלֵי bezeichnet hier die Gesamtheit der Geräte beziehungsweise Gefäße; נְחֹשֶׁת ist bei den Tempelgeräten sachgerecht mit „Bronze“ wiederzugeben.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: mit denen der Dienst verrichtet wurde
  rationale: שרת bezeichnet in diesem Zusammenhang den kultischen Dienst. Die deutsche Passivform bewahrt den instrumentalen Bezug der Geräte und lässt wie der Zusammenhang offen, welche Tempeldiener jeweils handelten.
- source_word: לָקָחוּ
  choice: nahmen sie mit
  rationale: לקח bedeutet „nehmen“. Im Zusammenhang der Wegführung von Tempelgerät drückt „nahmen sie mit“ die Entfernung natürlich aus, ohne ein stärkeres Verb wie „rauben“ in den Text einzutragen.
theological_decisions:
- issue: Kultische Bedeutung von שרת
  choice: „der Dienst verrichtet wurde“ mit Fußnotenhinweis auf den Tempeldienst
  alternative: „mit denen sie dienten“
  rationale: Die Formulierung erhält den sakralen Dienstbezug, vermeidet aber ein im Deutschen unklares „sie“ und legt nicht fest, welche Gruppe von Tempeldienern gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Inventarliste folgt der hebräischen Satzstruktur, während das abschließende „nahmen sie mit“ den erzählerischen Vorgang idiomatisch ausdrückt. Fachbegriffe werden nur dort verwendet, wo der Tempelkontext sie trägt; sachliche Unsicherheiten stehen in den Fußnoten.
