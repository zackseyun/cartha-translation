base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/021.yaml
  text: As for the pillars[a], the height of each pillar was eighteen cubits, and a line of twelve cubits would go around it; its thickness was four fingers, and it was hollow.
translation:
  language: de
  text: 'Die Säulen: Jede einzelne war achtzehn Ellen hoch. Eine zwölf Ellen lange Schnur umspannte jede von ihnen. Die Wand jeder Säule war vier Fingerbreit[a] dick, und die Säulen waren hohl.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vier Finger“; gemeint ist ein körperbezogenes Längenmaß.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעַמּוּדִים
  choice: Die Säulen
  rationale: Die bestimmte Pluralform nimmt beide Säulen als Thema des beschreibenden Inventars auf; im Deutschen ist keine ausdrückliche Wendung wie „Was die Säulen betrifft“ nötig.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה קומה הָעַמֻּד הָאֶחָד
  choice: waren achtzehn Ellen hoch, jede einzelne
  rationale: Die hebräische Formulierung misst ausdrücklich „die eine Säule“; „jede einzelne“ macht im Deutschen klar, dass die Höhenangabe für jede der beiden Säulen gilt.
- source_word: חוּט
  choice: Schnur
  rationale: חוּט bezeichnet hier eine Schnur beziehungsweise Messschnur, deren Länge den Umfang der Säule angibt.
- source_word: שְׁתֵּים עֶשְׂרֵה אַמָּה יְסֻבֶּנּוּ
  choice: Eine zwölf Ellen lange Schnur umspannte sie
  rationale: Die aktive deutsche Form bewahrt das konkrete Bild einer Schnur, die um die Säule herumreicht, und gibt damit ihren Umfang an.
- source_word: עָבְיוֹ
  choice: Ihre Wand ... dick
  rationale: Da die Säule hohl war, bezeichnet die Dicke sinnvollerweise die Material- beziehungsweise Wandstärke; „Wand“ verdeutlicht diesen räumlichen Bezug natürlich.
- source_word: אַרְבַּע אַצְבָּעוֹת
  choice: vier Fingerbreit
  rationale: Die wörtliche Körpermaßangabe „vier Finger“ wird mit dem im Deutschen verständlichen Maßausdruck „Fingerbreit“ wiedergegeben.
- source_word: נָבוּב
  choice: innen hohl
  rationale: Das Wort beschreibt die Säule als hohl; „innen hohl“ macht den Gegensatz zur angegebenen Wandstärke deutlich, ohne zusätzliche technische Einzelheiten einzutragen.
