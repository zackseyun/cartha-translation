    rationale: 'Der hebräische Text beschreibt die Maße einer einzelnen Säule: Eine Schnur von zwölf Ellen umschließt „sie“ im Singular. Im Deutschen kann das pluralische „sie“ unmittelbar nach „Die Säulen“ so verstanden werden, als umspanne die Schnur beide Säulen zusammen.'
  - severity: low
    issue: Die Pronomen in „Ihre Wand ... und sie war innen hohl“ sind mehrdeutig.
    rationale: „Ihre“ kann sich auf die Säulen oder auf eine einzelne Säule beziehen; das abschließende Singularpronomen verlangt dann einen Wechsel der Bezugsgröße. Die explizite Nennung jeder Säule beseitigt dies.
