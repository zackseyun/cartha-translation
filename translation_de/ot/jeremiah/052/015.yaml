translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Aufzählung und die abschließende Stellung des Verbs orientieren sich an der hebräischen Satzbewegung, werden aber durch „dazu“ und den Gedankenstrich lesbar gegliedert. Die genuine Unsicherheit bei אָמֹון wird nicht im Haupttext ausgebreitet, sondern ausdrücklich in einer Fußnote bewahrt.
