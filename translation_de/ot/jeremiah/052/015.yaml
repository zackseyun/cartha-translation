base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/015.yaml
  text: And some of the poorest of the people[a], and the rest of the people who remained in the city, and the deserters who had defected to the king of Babylon, and the rest of the craftsmen—Nebuzaradan, the captain of the guard[c][b], carried into exile.
translation:
  language: de
  text: Und einige der Ärmsten des Volkes[a], den Rest des Volkes, der in der Stadt geblieben war, die Überläufer, die zum König von Babylon übergelaufen waren[b], und den Rest der Handwerker[c] führte Nebusaradan, der Befehlshaber der Leibwache[d], in die Verbannung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einige aus den niedrigen Schichten des Volkes“. Der hebräische Ausdruck bezeichnet Arme oder sozial Niedrige.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „diejenigen, die zum König von Babylon gefallen waren“; dies ist eine Wendung für das Überlaufen zu ihm.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Rest der Menge“ oder „den Rest des Volkes“. Der hebräische Ausdruck ist unsicher; im Zusammenhang und angesichts der Parallelstelle in 2. Könige 25,11 wird er häufig als Bezeichnung für Handwerker oder Fachleute verstanden.'
    reason: lexical_alternative
  - marker: d
    text: Vergleiche 2. Könige 25,11, den Parallelbericht über diese Verschleppung.
    reason: cross_reference
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָעָם
  choice: einige von den Ärmsten des Volkes
  rationale: Die Präposition מִן hat hier partitive Bedeutung; דַּלּוֹת bezeichnet sozial Niedrige beziehungsweise Arme. Die Formulierung gibt beides in natürlichem Deutsch wieder.
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים בָּעִיר
  choice: den Rest des Volkes, der in der Stadt geblieben war
  rationale: Die Wiedergabe bewahrt sowohl יֶתֶר („Rest“) als auch das Partizip הַנִּשְׁאָרִים („die Gebliebenen“), ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ אֶל מֶלֶךְ בָּבֶל
  choice: die Überläufer, die zum König von Babylon übergelaufen waren
  rationale: נפל אל ist in diesem militärisch-politischen Zusammenhang ein Idiom für das Überlaufen zur Gegenseite. Die Wiederholung bildet Partizip und finites Verb des Hebräischen ab.
- source_word: יֶתֶר הָאָמֹון
  choice: den Rest der Handwerker
  rationale: אָמֹון ist an dieser Stelle unsicher. „Handwerker“ entspricht einer verbreiteten kontextuellen Deutung im Licht der Parallelüberlieferung; die mögliche Bedeutung „Volksmenge“ bleibt in der Fußnote erhalten.
- source_word: הֶגְלָה
  choice: führte ... in die Verbannung
  rationale: Der Hifil von גלה bezeichnet das Deportieren beziehungsweise In-die-Verbannung-Führen. Die gewählte Formulierung passt zum würdigen historischen Register.
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der Leibwache
  rationale: Der Titel bedeutet wörtlich etwa „Oberster der Schlächter/Henker“, bezeichnet im königlichen Verwaltungszusammenhang jedoch den leitenden Offizier der Leibwache, der auch Hinrichtungen verantwortete.
