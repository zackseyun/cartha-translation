source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אוֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אוֹתָ֛/ם אֶל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/026.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: de
  text: Nebusaradan, der Oberste der Leibwache,[a] nahm sie und führte sie zum König von Babel nach Ribla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »der Oberste der Schlächter«; der Titel bezeichnet hier den Befehlshaber der königlichen Leibwache und kann auch Aufgaben bei Hinrichtungen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und brachte sie zum König von Babel nach Ribla«; auch möglich: »zum König von Babel in Ribla«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: nahm sie fest
  rationale: לקח bedeutet zunächst »nehmen«. Im Zusammenhang mit den zuvor genannten Amtsträgern, die dem babylonischen König zugeführt werden, gibt »nahm sie fest« die Gefangennahme im Deutschen natürlich wieder, ohne die Gewaltkomponente stärker als nötig auszumalen.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibeltradition transliteriert.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Wörtlich bezeichnet der Titel den Obersten der »Schlächter« beziehungsweise Hinrichter; im königlichen Umfeld ist damit ein hoher Befehlshaber der Leibwache gemeint. Diese Wiedergabe ist verständlich und wahrt in einer Fußnote die wörtliche Bedeutung.
- source_word: וַיֹּלֶךְ
  choice: brachte
  rationale: Die Kausativform von הלך bezeichnet hier das Hinführen der Gefangenen zu einem Ziel. »Brachte« ist dafür im Deutschen idiomatisch; »führte« bleibt als mögliche Nuance erhalten.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: zum König von Babel
  rationale: אֶל bezeichnet die Bewegung zu einer Person hin. »Zum« gibt dies direkt wieder, ohne das interpretierende »vor den König« einzuführen.
- source_word: רִבְלָתָה
  choice: nach Ribla
  rationale: Die Ortsendung ה־ zeigt eine Richtung an. Daher gibt »nach Ribla« die Form genauer wieder; syntaktisch kann die Angabe zugleich als Ort verstanden werden, an dem sich der König befand.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Babel« folgt der im Deutschen etablierten biblischen Wiedergabe des hebräischen בָּבֶל. Die kurze Erzählstruktur des Hebräischen bleibt erhalten; die Mehrdeutigkeit von וַיֹּלֶךְ und der Ortsform רִבְלָתָה wird in der Fußnote kenntlich gemacht.
