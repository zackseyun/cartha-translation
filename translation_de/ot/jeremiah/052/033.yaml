  text: And he changed out of his prison clothes and ate bread before him continually all the days of his life[a][b].
translation:
  language: de
  text: Und er legte seine Gefängniskleidung[a] ab und aß stets Brot vor ihm[b], solange er lebte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er wechselte die Kleider seiner Gefangenschaft.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er aß Brot vor ihm“; gemeint ist wahrscheinlich, dass er seine Mahlzeiten in der Gegenwart des Königs einnahm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּה אֵת בִּגְדֵי כִלְאוֹ
  choice: Und er wechselte seine Gefängniskleidung
  rationale: שׁנה bedeutet hier „wechseln/ändern“; בִּגְדֵי כִלְאוֹ bezeichnet die Kleidung seiner Gefangenschaft. „Gefängniskleidung“ ist im modernen Deutsch knapp und verständlich, ohne ausdrücklich festzulegen, welche neue Kleidung er anzog.
- source_word: וְאָכַל לֶחֶם
  choice: und aß
  rationale: „Brot essen“ ist hier eine hebräische Wendung für das Einnehmen von Mahlzeiten. Im deutschen Haupttext genügt „aß“; die wörtliche Bildlichkeit wird in der Fußnote dokumentiert.
- source_word: לְפָנָיו
  choice: in seiner Gegenwart
  rationale: Die Wendung bedeutet wörtlich „vor ihm“. „In seiner Gegenwart“ gibt den höfischen Zusammenhang natürlich wieder, ohne das im Hebräischen nicht ausdrücklich genannte Sitzen am Tisch einzutragen.
- source_word: תָּמִיד
  choice: regelmäßig
  rationale: תָּמִיד bezeichnet hier fortdauernde beziehungsweise wiederkehrende Regelmäßigkeit. „Regelmäßig“ vermeidet den missverständlichen Eindruck ununterbrochenen Essens.
- source_word: כָּל יְמֵי חַיָּו
  choice: solange er lebte
  rationale: Die geläufige deutsche Wendung gibt „alle Tage seines Lebens“ präzise und natürlich wieder.
theological_decisions:
- issue: Bezug des Pronomens in לְפָנָיו
  choice: „in seiner Gegenwart“ ohne namentliche Auflösung
  alternative: „in der Gegenwart des Königs“
  rationale: Der unmittelbare Zusammenhang legt den König als Bezug nahe, doch der hebräische Text verwendet lediglich ein Pronomen. Die Übersetzung bewahrt diese Form und vermeidet eine unnötige Explizierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist flüssig, bewahrt aber durch die Fußnoten die wörtliche Struktur und die leichte Unbestimmtheit des hebräischen Textes.
