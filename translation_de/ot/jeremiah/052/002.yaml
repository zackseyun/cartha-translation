id: JER.52.2
reference: Jeremiah 52:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה יְהוֹיָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/002.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that Jehoiakim had done.
translation:
  language: de
  text: Und er tat, was in den Augen Jahwes[a] böse war, ganz so, wie Jojakim es getan hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In den Augen Jahwes“ ist eine hebräische Ausdrucksweise und bedeutet „nach Jahwes Urteil“ oder „vor Jahwe“.
    reason: Erläuterung einer hebräischen Redewendung bei Bewahrung ihres Bildes im Haupttext.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Und er tat
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Und er tat“ bewahrt diesen fortschreitenden Zusammenhang.
- source_word: הָרַע
  choice: was … böse war
  rationale: Die hebräische Wendung עשה הרע wird im Deutschen natürlich als „tun, was böse war“ wiedergegeben.
- source_word: בְּעֵינֵי
  choice: in den Augen
  rationale: Die bildhafte hebräische Bewertungsformel bleibt erhalten und ist im Deutschen verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּכֹל אֲשֶׁר
  choice: ganz so, wie
  rationale: Die Formulierung drückt aus, dass sein Verhalten dem gesamten Vorbild Jojakims entsprach, ohne im Deutschen unnötig schwerfällig zu wirken.
- source_word: עָשָׂה
  choice: es getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass Jojakims Handeln zeitlich vorauslag; „es“ greift das zuvor genannte böse Tun auf.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Bildsprache bleibt erhalten; der Vergleich mit Jojakim wird natürlich und ohne zusätzliche Deutung formuliert.
