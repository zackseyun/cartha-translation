lexical_decisions:
- source_word: בִּשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: Im achtzehnten Jahr
  rationale: Die Verbindung bezeichnet eine Zeitangabe; die Kardinalzahl hat beim Wort „Jahr“ ordinale Funktion. Die deutsche Formulierung ist natürlich und präzise.
- source_word: לִנְבוּכַדְרֶאצַּר
  choice: Nebukadnezars
  rationale: Das vorangestellte ל kennzeichnet hier das Bezugsverhältnis bei einer Regierungsjahresangabe. Der deutsche Genitiv gibt dies knapp und idiomatisch wieder.
- source_word: מִירוּשָׁלִַם
  choice: aus Jerusalem
  rationale: Die Präposition מִן bezeichnet den Ausgangsort der Wegführung. „Aus Jerusalem“ wahrt diese räumliche Bedeutung.
- source_word: נֶפֶשׁ
  choice: Menschen
  rationale: נֶפֶשׁ dient hier als Zählbegriff für einzelne Personen. „Menschen“ ist im modernen Deutsch verständlich und vermeidet das irreführend wörtliche „Seelen“.
- source_word: שְׁמֹנֶה מֵאוֹת שְׁלֹשִׁים וּשְׁנָיִם
  choice: '832'
  rationale: Die additive Zahlenfolge ergibt 800 + 30 + 2. Ziffern sind in dieser statistischen Aufzählung gut lesbar.
