source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר לְ/בֵית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת כָּל נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/017.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze Sea that was in the house of Yahweh[b], and carried all their bronze to Babylon.
translation:
  language: de
  text: Und die Chaldäer[b] zerbrachen die bronzenen Säulen, die zum Haus Jahwes gehörten, sowie die Gestelle[a] und das bronzene Meer, das im Haus Jahwes war. Das gesamte Bronzematerial dieser Gegenstände brachten sie nach Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Sockel. Gemeint sind die fahrbaren Untergestelle der Tempelausstattung.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: Chaldäer; gemeint sind hier die babylonischen Truppen.'
    reason: historical_clarification
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: die bronzenen Säulen
  rationale: Die Konstruktion bezeichnet Säulen aus נְחֹשֶׁת; im Zusammenhang der Tempelausstattung ist „Bronze“ die übliche und sachgerechte Wiedergabe.
- source_word: אֲשֶׁר לְבֵית יְהוָה
  choice: die zum Haus Jahwes gehörten
  rationale: Das לְ drückt hier am ehesten Zugehörigkeit oder Beziehung aus. So bleibt der Unterschied zum späteren בְּ („im Haus“) erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הַמְּכֹנוֹת
  choice: die Gestelle
  rationale: Gemeint sind die fahrbaren Untergestelle der Tempelausstattung. „Gestelle“ ist im modernen Deutsch konkret und verständlich; „Sockel“ bleibt als Alternative in der Fußnote.
- source_word: יָם הַנְּחֹשֶׁת
  choice: das bronzene Meer
  rationale: Dies ist die Bezeichnung für das große Wasserbecken des Tempels. „Meer“ bewahrt den überlieferten Namen des Gegenstands.
- source_word: אֲשֶׁר בְּבֵית יְהוָה
  choice: das im Haus Jahwes war
  rationale: Numerus und unmittelbarer Anschluss beziehen den Relativsatz am natürlichsten auf das singularische „bronzene Meer“; die Formulierung bewahrt außerdem das örtliche בְּ.
- source_word: שִׁבְּרוּ
  choice: zerbrachen
  rationale: Das Verb beschreibt das Zerteilen der großen Bronzegegenstände, offenbar um das Metall abtransportieren zu können.
- source_word: כַשְׂדִּים
  choice: die Chaldäer
  rationale: Die Wiedergabe bewahrt die ausdrückliche historische Bezeichnung des hebräischen Textes; gemeint sind hier die babylonischen Truppen.
- source_word: וַיִּשְׂאוּ
  choice: brachten
  rationale: Im Zusammenhang mit der Richtungsangabe nach Babel bezeichnet נשׂא das Wegtragen beziehungsweise den Abtransport; „brachten“ klingt im Deutschen natürlich.
- source_word: כָּל נְחֻשְׁתָּם
  choice: das gesamte Bronzematerial dieser Gegenstände
  rationale: Das Suffix verweist auf die aufgezählten Gegenstände. Die explizite Formulierung verhindert das im Deutschen missverständliche „all ihre Bronze“.
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Die Richtungsendung bezeichnet eine Bewegung nach Babel; „nach“ ist bei Ortsnamen die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Seine Wiedergabe als Eigenname erhält diesen Charakter, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parataktische Struktur des Hebräischen bleibt erkennbar, wird aber durch die Satzteilung und die explizite Rückverweisung „dieser Gegenstände“ verständlich gemacht. „Haus Jahwes“ bewahrt die biblische Tempelbezeichnung; „Babel“ entspricht der üblichen deutschen Namensform im alttestamentlichen Kontext.
