  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֣י הַ/מִּלְחָמָ֡ה יִבְרְחוּ֩ וַ/יֵּצְא֨וּ מֵ/הָ/עִ֜יר לַ֗יְלָה דֶּ֜רֶךְ שַׁ֤עַר בֵּין הַ/חֹמֹתַ֨יִם֙ אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּלְכ֖וּ דֶּ֥רֶךְ הָ/עֲרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/007.yaml
  text: Then the city was breached[a], and all the men of war fled and went out of the city by night by way of the gate between the two walls, which was by the king’s garden, while the Chaldeans were all around the city[c][b]; and they went by way of the Arabah.
translation:
  language: de
  text: Da wurde eine Bresche in die Stadt geschlagen, und alle Krieger flohen. Sie verließen die Stadt bei Nacht durch das Tor zwischen den beiden Mauern beim Garten des Königs, während die Chaldäer[a] rings um die Stadt standen. Sie nahmen den Weg zur Araba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Chaldäer“ ist die hebräische Volksbezeichnung, die häufig für die babylonischen Truppen gebraucht wird.
    reason: cultural_note
  - marker: b
    text: Die „Araba“ bezeichnet hier das Gebiet des Jordangrabens; manche Übersetzungen geben den Namen mit „Ebene“ wieder.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: Da wurde eine Bresche in die Stadt geschlagen
  rationale: Das Nifal bezeichnet im Belagerungskontext das gewaltsame Aufbrechen der Stadt beziehungsweise ihrer Befestigung. Die deutsche Wendung ist militärisch idiomatisch, ohne das im Hebräischen nicht ausdrücklich genannte Wort „Mauer“ in den Haupttext einzufügen.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: alle Krieger
  rationale: Gibt die kampffähigen Männer knapp und natürlich wieder; „Krieger“ bewahrt den ausdrücklichen Bezug auf den Krieg besser als das allgemeinere „Männer“.
- source_word: יִבְרְחוּ וַיֵּצְאוּ
  choice: flohen. Sie verließen
  rationale: Die Verbfolge wird als vergangenes Erzählgeschehen wiedergegeben. Die Satzteilung sorgt im Deutschen für Klarheit, ohne den Ablauf zu verändern.
- source_word: לַיְלָה דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: bei Nacht durch das Tor zwischen den beiden Mauern
  rationale: „Durch“ ist hier die natürliche deutsche Wiedergabe des als Route gebrauchten דֶּרֶךְ. Der Dual הַחֹמֹתַיִם wird ausdrücklich mit „den beiden Mauern“ wiedergegeben.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: beim Garten des Königs
  rationale: עַל hat hier eine örtliche Bedeutung der Nähe. Die kompakte Formulierung bezieht den Relativsatz eindeutig auf das Tor.
- source_word: וְכַשְׂדִּים עַל הָעִיר סָבִיב
  choice: während die Chaldäer die Stadt ringsum eingeschlossen hatten
  rationale: Die Nominalkonstruktion schildert den begleitenden Umstand. „Ringsum eingeschlossen“ vermittelt die vollständige Umzingelung in natürlichem Deutsch.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: Dann zogen sie den Weg zur Araba
  rationale: Die Formulierung lässt דֶּרֶךְ als Weg beziehungsweise Route erkennen. „Araba“ bleibt als geografische Bezeichnung erhalten; der Kontext spricht für die Richtung in dieses Gebiet.
