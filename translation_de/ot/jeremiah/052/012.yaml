id: JER.52.12
reference: Jeremiah 52:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בֶּ/עָשׂ֣וֹר לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֗א נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים עָמַ֛ד לִ/פְנֵ֥י מֶֽלֶךְ בָּבֶ֖ל בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/012.yaml
  text: In the fifth month[a], on the tenth day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan the captain of the guard, who stood before the king of Babylon[c][b], came to Jerusalem.
translation:
  language: de
  text: Im fünften Monat, am zehnten Tag des Monats – es war das neunzehnte Regierungsjahr König Nebukadnezars, des Königs von Babylon – kam Nebusaradan, der Befehlshaber der Leibwache[a], der vor dem König von Babylon stand[b], nach Jerusalem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Oberste der Schlächter“ oder „der Oberste der Henker“; der Titel bezeichnet wahrscheinlich einen hohen königlichen Beamten, der die Leibwache befehligte.'
    reason: lexical_alternative
  - marker: b
    text: „Vor dem König stehen“ ist eine höfische Wendung für den Dienst in der Gegenwart des Königs.
    reason: cultural_note
  - marker: c
    text: Wörtlich steht im Hebräischen „in Jerusalem“; in Verbindung mit „kam“ heißt es im Deutschen natürlicherweise „nach Jerusalem“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: Im fünften Monat
  rationale: Die einleitende Konjunktion setzt die Erzählung fort, muss im natürlichen deutschen Erzählstil hier aber nicht eigens mit „und“ wiedergegeben werden.
- source_word: בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: am zehnten Tag des Monats
  rationale: Die hebräische Datumsformel wird im Deutschen zur besseren Verständlichkeit mit „Tag“ ausgedrückt.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבוּכַדְרֶאצַּר
  choice: es war das neunzehnte Regierungsjahr König Nebukadnezars
  rationale: „Regierungsjahr“ macht die durch לַמֶּלֶךְ bezeichnete Königsdatierung idiomatisch deutlich; der Gedankenstrich bewahrt den erläuternden Einschub.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: רַב טַבָּחִים
  choice: der Befehlshaber der Leibwache
  rationale: Der Titel bezeichnet im neu-babylonischen Hofzusammenhang einen hohen königlichen Beamten. Die idiomatische Wiedergabe bleibt verständlich; die wörtlichere Bedeutung wird in einer Fußnote bewahrt.
- source_word: עָמַד לִפְנֵי מֶלֶךְ בָּבֶל
  choice: der vor dem König von Babylon stand
  rationale: Die formnahe Wiedergabe bewahrt die höfische Ausdrucksweise, die hier Dienst in der Gegenwart des Königs bezeichnet.
- source_word: בִּירוּשָׁלִָם
  choice: nach Jerusalem
  rationale: Obwohl die Präposition wörtlich „in Jerusalem“ lautet, verlangt das deutsche Bewegungsverb „kam“ in diesem Zusammenhang idiomatisch die Zielangabe „nach Jerusalem“.
