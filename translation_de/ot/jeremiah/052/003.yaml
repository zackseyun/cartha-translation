source:
  edition: WLC
  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָֽיְתָה֙ בִּ/ירוּשָׁלִַ֣ם וִֽ/יהוּדָ֔ה עַד הִשְׁלִיכ֥/וֹ אוֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/003.yaml
  text: For because of the anger of Yahweh it came to pass in Jerusalem and Judah[a], until he cast them out from before his face[b]; and Zedekiah rebelled against the king of Babylon.
translation:
  language: de
  text: Denn wegen des Zorns Jahwes geschah es in Jerusalem und Juda, bis er sie aus seiner Gegenwart verstieß.[a] Und Zedekia rebellierte gegen den König von Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von vor seinem Angesicht“.'
    reason: Die Fußnote bewahrt das konkrete hebräische Bild hinter der idiomatischen Wiedergabe „aus seiner Gegenwart“.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung ein und verbindet den Vers mit dem vorausgehenden Bericht.
- source_word: עַל אַף יְהוָה
  choice: wegen des Zorns Jahwes
  rationale: Gibt die kausale Wendung und die starke Bedeutung von אַף natürlich wieder; der Gottesname יהוה wird im Deutschen als „Jahwe“ wiedergegeben.
- source_word: הָיְתָה
  choice: geschah dies
  rationale: Das feminine Verb steht ohne ausdrücklich genanntes Subjekt. „Dies“ verweist zurückhaltend auf das zuvor geschilderte Geschehen, ohne dessen Inhalt näher festzulegen.
- source_word: בִּירוּשָׁלִַם וִיהוּדָה
  choice: in Jerusalem und Juda
  rationale: Bewahrt die Ortsangaben des hebräischen Textes unmittelbar.
- source_word: עַד הִשְׁלִיכוֹ אוֹתָם
  choice: bis er sie … verstieß
  rationale: Bewahrt die zeitlich beziehungsweise ergebnisbezogen deutbare Verknüpfung mit עַד; „verstieß“ bringt die gewaltsame Entfernung durch die Hifil-Form zum Ausdruck.
- source_word: מֵעַל פָּנָיו
  choice: aus seiner Gegenwart
  rationale: Gibt den Sinn der hebräischen Wendung im natürlichen Deutschen wieder; das konkrete Bild „von vor seinem Angesicht“ wird in einer Fußnote erhalten.
- source_word: וַיִּמְרֹד
  choice: Und … rebellierte
  rationale: Bezeichnet Zedekias politischen Aufstand gegen die babylonische Oberherrschaft, ohne zusätzliche Deutung.
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: gegen den König von Babylon
  rationale: Bei מרד bezeichnet ב idiomatisch die Person, gegen die sich die Rebellion richtet.
theological_decisions:
- issue: Göttlicher Zorn als Ursache des Geschehens
  choice: „wegen des Zorns Jahwes“
  alternative: Das Geschehen lediglich historisch zu berichten oder „Zorn“ zu „Missfallen“ abzuschwächen
  rationale: Der hebräische Text stellt ausdrücklich einen kausalen Zusammenhang mit Jahwes Zorn her; die Übersetzung erhält diese Aussage, ohne sie weiter auszudeuten.
- issue: Vertreibung aus Gottes Gegenwart
  choice: „bis er sie aus seiner Gegenwart verstieß“
  alternative: „bis er sie von vor seinem Angesicht wegwarf“
  rationale: Die gewählte Fassung macht den Sinn verständlich und bewahrt die Härte des Gerichts. Die bildhafte wörtliche Form bleibt in der Fußnote sichtbar.
- issue: Unausgesprochenes Subjekt von הָיְתָה
  choice: „geschah dies“
  alternative: „es geschah“ oder „es kam so weit“
  rationale: „Dies“ stellt den Rückbezug auf den Kontext her, ohne einen im Hebräischen nicht ausdrücklich genannten Sachverhalt dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch „geschah dies“ und „aus seiner Gegenwart“ für heutige Leser verständlich gehalten. „Jahwe“ gibt den Gottesnamen יהוה wieder.
