  text: וַ/יְהִי֩ בַ/שָּׁנָ֨ה הַ/תְּשִׁעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבוּכַדְרֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֤וּא וְ/כָל חֵיל/וֹ֙ עַל יְר֣וּשָׁלִַ֔ם וַֽ/יַּחֲנ֖וּ עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֛י/הָ דָּיֵ֖ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/004.yaml
  text: And in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, Nebuchadnezzar king of Babylon came—he and all his army—against Jerusalem[b], and they encamped against it and built a siege wall around it.
translation:
  language: de
  text: Und im neunten Jahr seiner Herrschaft, im zehnten Monat, am zehnten Tag des Monats, kam Nebukadnezar[a], der König von Babel – er selbst und sein ganzes Heer –, gegen Jerusalem. Sie schlugen ihr Lager vor der Stadt auf und errichteten rings um sie einen Belagerungswall[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensform an dieser Stelle entspricht genauer „Nebukadrezar“; traditionell wird im Deutschen meist „Nebukadnezar“ verwendet.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch mit „Belagerungsanlagen“ oder „Belagerungsrampe“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und im
  rationale: Die fortschreitende Erzählform wird im Deutschen natürlich durch „Und“ mit der folgenden Zeitangabe wiedergegeben; ein ausdrückliches „es geschah“ wäre hier unnötig schwerfällig.
- source_word: בַשָּׁנָה הַתְּשִׁעִית לְמָלְכוֹ
  choice: im neunten Jahr seiner Herrschaft
  rationale: Dies entspricht der üblichen Formel zur Angabe eines Regierungsjahres und lässt den im Vers selbst nicht genannten Bezug des Pronomens offen.
- source_word: בַחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: im zehnten Monat, am zehnten Tag des Monats
  rationale: Die hebräische Kalenderangabe wird ohne nachträgliche Benennung des Monats präzise und verständlich wiedergegeben.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im Deutschen geläufige Namensform gewährleistet Wiedererkennbarkeit; die abweichende hebräische Schreibung wird in einer Fußnote kenntlich gemacht.
- source_word: הוּא וְכָל חֵילוֹ
  choice: mit seinem ganzen Heer
  rationale: Im Deutschen gibt „mit“ die gemeinsame militärische Bewegung idiomatisch wieder. חַיִל bezeichnet hier das Heer beziehungsweise die Streitmacht.
- source_word: עַל יְרוּשָׁלַםִ
  choice: gegen Jerusalem
  rationale: Im Zusammenhang des Feldzugs und der Belagerung bezeichnet עַל eine feindliche Bewegung gegen die Stadt.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: Sie schlugen ihr Lager vor der Stadt auf
  rationale: Das feminine Pronomen bezieht sich auf Jerusalem. „Vor der Stadt“ gibt die feindliche Lagerung natürlich wieder und vermeidet das im Deutschen unklare „gegen sie“.
- source_word: דָּיֵק
  choice: Belagerungswall
  rationale: Das Wort bezeichnet eine zur Einschließung beziehungsweise Erstürmung dienende Belagerungsanlage; „Belagerungswall“ ist konkret und im Kontext gut verständlich.
- source_word: סָבִיב
  choice: rings um sie
  rationale: Die Formulierung bewahrt das Bild der vollständigen Einschließung Jerusalems.
