- from: Doch das Heer der Chaldäer verfolgte den König und holte Zedekia in den Ebenen von Jericho[a] ein. Sein ganzes Heer zerstreute sich und verließ ihn.[b]
  to: Doch das Heer der Chaldäer verfolgte den König und holte Zedekia in den Ebenen von Jericho[a] ein. Sein ganzes Heer zerstreute sich von ihm.[b]
  rationale: Die Revision entfernt die nicht ausdrücklich belegte Ergänzung „verließ ihn“ und gibt מֵעָלָיו direkt mit „von ihm“ wieder. Dadurch bleibt die Aussage offen dafür, ob die Trennung als Flucht, militärische Auflösung oder beides zu verstehen ist. Die übrigen Formulierungen werden beibehalten.
