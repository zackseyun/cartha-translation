  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥יגוּ אֶת צִדְקִיָּ֖הוּ בְּ/עַֽרְבֹ֣ת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/008.yaml
  text: But the army of the Chaldeans pursued the king and overtook Zedekiah in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: de
  text: Doch das Heer der Chaldäer verfolgte den König und holte Zedekia in den Ebenen von Jericho[a] ein. Sein ganzes Heer zerstreute sich von ihm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Steppe von Jericho“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sein ganzes Heer zerstreute sich von ihm.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: das Heer der Chaldäer
  rationale: חֵיל bezeichnet hier eine militärische Streitmacht; כַּשְׂדִּים wird entsprechend der ethnisch-politischen Bezeichnung des hebräischen Textes mit „Chaldäer“ wiedergegeben.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי הַמֶּלֶךְ
  choice: verfolgte den König
  rationale: רדף bedeutet im militärischen Erzählzusammenhang „verfolgen“. Das deutsche Verb nimmt die Bedeutung von אַחֲרֵי idiomatisch in sich auf.
- source_word: וַיַּשִּׂיגוּ אֶת־צִדְקִיָּהוּ
  choice: holte Zedekia … ein
  rationale: נשׂג bezeichnet hier das Einholen eines Verfolgten und nicht nur ein neutrales Erreichen.
- source_word: בְּעַרְבֹת יְרֵחוֹ
  choice: in den Ebenen von Jericho
  rationale: עֲרָבוֹת bezeichnet offene, ebene Steppenlandschaft. „Ebenen“ ist im modernen Deutsch verständlich; die genauere landschaftliche Alternative wird in der Fußnote genannt.
- source_word: וְכָל־חֵילוֹ נָפֹצוּ
  choice: Sein ganzes Heer zerstreute sich
  rationale: Das pluralische Verb נָפֹצוּ bezieht sich sinngemäß auf die Angehörigen des kollektiv bezeichneten Heeres. Im Deutschen ist das singularische „Heer zerstreute sich“ natürlich und inhaltlich treu.
- source_word: מֵעָלָיו
  choice: und verließ ihn
  rationale: מֵעָלָיו drückt die Trennung von Zedekia aus. Zusammen mit נָפֹצוּ wird dies im Deutschen natürlich als Zerstreuung und Verlassen des Königs formuliert; die formnähere Wiedergabe steht in der Fußnote.
