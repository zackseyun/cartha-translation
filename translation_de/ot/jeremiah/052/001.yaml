  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירֽוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/001.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem[b]. His mother’s name was Hamutal the daughter of Jeremiah of Libnah.
translation:
  language: de
  text: Zedekia war einundzwanzig Jahre alt, als er König wurde,[a] und er regierte elf Jahre in Jerusalem. Seine Mutter hieß Hamutal; sie war eine Tochter Jeremias aus Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als er zu regieren begann“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: war einundzwanzig Jahre alt
  rationale: Die hebräische Altersangabe ist eine feste Wendung. Die idiomatische deutsche Wiedergabe vermittelt ihren Sinn klarer als das wörtliche „ein Sohn von einundzwanzig Jahren“.
- source_word: בְמָלְכוֹ
  choice: als er König wurde
  rationale: Die Präposition ב mit dem Infinitiv von מלך bezeichnet hier den Zeitpunkt seines Regierungsantritts. Die Formulierung ist natürliches modernes Deutsch und wahrt den zeitlichen Sinn.
- source_word: מָלַךְ
  choice: regierte er
  rationale: Das Verb bezeichnet das Ausüben der Königsherrschaft und wird im Deutschen präzise mit „regieren“ wiedergegeben.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Präposition ב wird hier eindeutig örtlich gebraucht.
- source_word: וְשֵׁם אִמּוֹ
  choice: Seine Mutter hieß
  rationale: Diese natürliche deutsche Formulierung gibt die genealogische Namensangabe vollständig wieder, ohne die hebräische Satzstruktur unnötig nachzuahmen.
- source_word: חמיטל
  choice: Hamutal
  rationale: Der Personenname wird nach seiner herkömmlichen deutschsprachigen Form transliteriert.
- source_word: בַּת יִרְמְיָהוּ
  choice: eine Tochter Jeremias
  rationale: Die hebräische Abstammungsangabe wird in geläufigem genealogischem Deutsch wiedergegeben; „Jeremias“ ist die traditionelle deutsche Namensform in diesem Zusammenhang.
- source_word: מִלִּבְנָה
  choice: aus Libna
  rationale: Die Präposition מן kennzeichnet Herkunft oder örtliche Zugehörigkeit. „Aus Libna“ gibt diesen Sinn im Deutschen unmittelbar wieder.
