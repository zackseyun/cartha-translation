  text: So the city came under siege until the eleventh year of King Zedekiah.
translation:
  language: de
  text: So blieb die Stadt bis zum elften Regierungsjahr des Königs Zedekia belagert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: So blieb die Stadt … belagert
  rationale: Die hebräische Wendung lautet wörtlich etwa „die Stadt kam in die Belagerung“, bezeichnet im Zusammenhang aber den fortdauernden Zustand der eingeschlossenen Stadt. Natürliches modernes Deutsch gibt dies mit „blieb … belagert“ wieder; „So“ wahrt den erzählerischen Anschluss.
- source_word: עַד עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ צִדְקִיָּהוּ
  choice: bis zum elften Regierungsjahr König Zedekias
  rationale: Die Jahresangabe zählt nach der Regierungszeit des Königs. „Regierungsjahr“ macht diesen im Hebräischen knappen Bezug im Deutschen klar, ohne zusätzliche Datierung einzuführen.
