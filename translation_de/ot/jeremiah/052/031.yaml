  to: 'Es geschah im siebenunddreißigsten Jahr der Verbannung Jojachins, des Königs von Juda, im zwölften Monat, am fünfundzwanzigsten Tag des Monats: Ewil-Merodach, der König von Babylon,[a] erhob im Jahr seiner Herrschaft[b] das Haupt Jojachins, des Königs von Juda,[c] und holte ihn aus dem Gefängnis.'
