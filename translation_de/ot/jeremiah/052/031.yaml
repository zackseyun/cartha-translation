reference: Jeremiah 52:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ן מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מַלְכֻת֗/וֹ אֶת רֹאשׁ֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּצֵ֥א אוֹת֖/וֹ מִ/בֵּ֥ית ה/כליא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/031.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-fifth day of the month, that Evil-merodach king of Babylon, in the first year of his reign[b], lifted up the head of Jehoiachin king of Judah and brought him out from the prison.
translation:
  language: de
  text: 'Es geschah im siebenunddreißigsten Jahr der Verbannung Jojachins, des Königs von Juda, im zwölften Monat, am fünfundzwanzigsten Tag des Monats: Ewil-Merodach, der König von Babylon,[a] erhob im Jahr seiner Herrschaft[b] das Haupt Jojachins, des Königs von Juda,[c] und holte ihn aus dem Gefängnis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ewil-Merodach ist historisch auch unter der akkadischen Namensform Amel-Marduk bekannt.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „im Jahr seiner Herrschaft“. Die Parallelstelle in 2. Könige 25,27 legt nahe, dass sein erstes Regierungsjahr gemeint ist.'
    reason: source_transparency
  - marker: c
    text: 'Das heißt, er erwies Jojachin Gunst; wörtlich: „erhob das Haupt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Es geschah
  rationale: Die geläufige, würdige deutsche Erzählformel gibt die episodenöffnende Funktion des hebräischen Wayyiqtol wieder, ohne unnötig altertümlich zu wirken.
- source_word: לְגָלוּת
  choice: der Verbannung
  rationale: Das Substantiv bezeichnet hier den durch die Deportation begründeten Zustand beziehungsweise Zeitraum. „Verbannung“ ist in diesem historischen Zusammenhang natürlich und präzise.
- source_word: יְהוֹיָכִין
  choice: Jojachin
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: im zwölften Monat
  rationale: Idiomatiche Wiedergabe der hebräischen Datumsformel.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לַחֹדֶשׁ
  choice: am fünfundzwanzigsten Tag des Monats
  rationale: „Tag“ wird für eine natürliche deutsche Datumsangabe ergänzt; es ist in der hebräischen Konstruktion sinngemäß enthalten.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Ewil-Merodach
  rationale: Die traditionelle deutsche biblische Namensform bleibt im Haupttext erhalten; die historisch-akkadische Form wird in einer Fußnote genannt.
- source_word: בִּשְׁנַת מַלְכֻתוֹ
  choice: im ersten Jahr seiner Herrschaft
  rationale: Die Wendung bezeichnet hier sehr wahrscheinlich das Thronbesteigungsjahr beziehungsweise erste Regierungsjahr, wie auch die Parallele in 2. Könige 25,27 verdeutlicht. Da „ersten“ im vorliegenden hebräischen Wortlaut nicht ausdrücklich steht, wird dies in einer Fußnote offengelegt.
- source_word: נָשָׂא אֶת־רֹאשׁ
  choice: erhob … das Haupt
  rationale: Die bildhafte hebräische Wendung wird transparent bewahrt. Sie bezeichnet hier die Erhöhung des Standes beziehungsweise eine Gunstbezeugung; die Bedeutung wird in einer Fußnote erklärt.
- source_word: וַיֹּצֵא אֹתוֹ
  choice: und holte ihn heraus
  rationale: Der Hifil von יצא bedeutet „hinausführen/herausholen“. Zusammen mit der Herkunftsangabe wird im deutschen Satz natürlich „holte ihn aus dem Gefängnis“ formuliert; „ließ ihn frei“ wäre stärker deutend.
- source_word: מִבֵּית הַכְּלִיא
  choice: aus dem Gefängnis
  rationale: Die wörtliche „Haus der Haft“-Formulierung wird mit dem natürlichen modernen deutschen Begriff „Gefängnis“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der Wendung „das Haupt erheben“
  choice: Das hebräische Bild bleibt im Haupttext stehen und wird als Standeserhöhung beziehungsweise Gunstbezeugung erläutert.
  alternative: Direkt „Jojachin seine Gunst erwies“ übersetzen.
  rationale: Die bildhafte Ausdrucksweise des Ausgangstextes soll erhalten bleiben, ohne ihre idiomatische Bedeutung für heutige Leserinnen und Leser zu verschleiern.
- issue: Zählung des Regierungsjahres Ewil-Merodachs
  choice: „im ersten Jahr seiner Herrschaft“ mit textnaher Fußnote
  alternative: Nur „im Jahr seiner Herrschaft“
  rationale: Der Kontext und 2. Könige 25,27 sprechen für das erste beziehungsweise das Thronbesteigungsjahr. Die Fußnote wahrt zugleich die formale Offenheit des vorliegenden hebräischen Wortlauts.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem historischem Erzählton. Die lange Datumsformel des Hebräischen bleibt als zusammenhängender Satz erhalten; ein Doppelpunkt gliedert sie lesefreundlich. Traditionelle deutsche biblische Namensformen werden verwendet, während sachlich wichtige Alternativen und interpretative Ergänzungen in Fußnoten transparent gemacht werden.
