  naturalness: Der Satz ist gut verständliches modernes Standarddeutsch und die Satzgliederung durch den Doppelpunkt ist gelungen. „Erhob ... das Haupt“ bewahrt bewusst die hebräische Bildsprache und wird durch eine Fußnote hinreichend erläutert.
  terminology: „Jojachin“, „Juda“, „Babylon“, „Ewil-Merodach“, „Verbannung“ und „Gefängnis“ sind passend. Die akkadische Namensvariante Amel-Marduk ist sachlich korrekt. Die Erklärung der Wendung „das Haupt erheben“ sollte auf Gunstbezeugung beschränkt bleiben, da eine konkrete Rangsteigerung hier noch nicht ausdrücklich formuliert ist.
