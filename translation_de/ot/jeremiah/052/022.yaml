base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/022.yaml
  text: And on it was a bronze capital[a], and the height of the one capital was five cubits, with latticework and pomegranates on the capital all around, all of bronze. And the second pillar had the same[b], with pomegranates.
translation:
  language: de
  text: Auf ihm befand sich ein Kapitell aus Bronze. Das eine Kapitell war fünf Ellen hoch. Rings um das Kapitell waren ein Flechtwerk[a] und Granatäpfel[b] angebracht, alles aus Bronze. Die zweite Säule hatte das Gleiche, einschließlich der Granatäpfel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gitterwerk; wörtlich: Netzwerk.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind wahrscheinlich granatapfelförmige Verzierungen am Kapitell.
    reason: cultural_note
lexical_decisions:
- source_word: כֹתֶרֶת
  choice: Kapitell
  rationale: Im Zusammenhang mit Säulen bezeichnet das Wort den ornamentierten oberen Abschluss; „Kapitell“ ist der präzise und im Deutschen geläufige architektonische Begriff.
- source_word: עָלָיו
  choice: auf ihm
  rationale: Das maskuline Suffix verweist im vorausgehenden Zusammenhang auf den Pfeiler beziehungsweise die Säule und bewahrt die räumliche Beziehung.
- source_word: נְחֹשֶׁת
  choice: Bronze
  rationale: Bei biblischen Metallgegenständen bezeichnet der Ausdruck häufig Bronze; „Messing“ wäre historisch weniger passend, „Kupfer“ bleibt grundsätzlich möglich.
- source_word: קוֹמַת
  choice: war … hoch
  rationale: Die deutsche Prädikativkonstruktion gibt die gemessene Höhe natürlich und klar wieder.
- source_word: הָאַחַת
  choice: das eine
  rationale: Die Form unterscheidet eines der beiden Kapitelle, ohne es unnötig als das zeitlich oder räumlich erste festzulegen.
- source_word: חָמֵשׁ אַמּוֹת
  choice: fünf Ellen
  rationale: Die antike Maßeinheit wird entsprechend der Vorlage beibehalten und nicht auf ein modernes Maß festgelegt.
- source_word: שְׂבָכָה
  choice: Flechtwerk
  rationale: Der Ausdruck bezeichnet eine netz- oder gitterartige ornamentale Arbeit; „Flechtwerk“ ist anschaulich und natürlich.
- source_word: רִמּוֹנִים
  choice: Granatäpfel
  rationale: Die wörtliche Bezeichnung meint im architektonischen Kontext offenbar granatapfelförmige Zierelemente; diese Auslegung wird in einer Fußnote erläutert.
- source_word: סָבִיב
  choice: rings um
  rationale: Die Formulierung gibt die umlaufende Anordnung knapp und idiomatisch wieder.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: alles aus Bronze
  rationale: Die Wendung fasst den Werkstoff der genannten Schmuckelemente natürlich zusammen.
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי
  choice: Ebenso war es bei der zweiten Säule
  rationale: Die hebräische elliptische Vergleichsform wird im Deutschen zu einem vollständigen Satz ergänzt, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die architektonischen Fachwörter „Säule“ und „Kapitell“ bleiben erhalten; kurze Hauptsätze machen die dichte Aufzählung verständlich. Die etwas schwierige Schlussformulierung wird als Vergleich mit der zweiten Säule wiedergegeben, während „samt den Granatäpfeln“ das ausdrücklich wiederholte Schlusswort der hebräischen Vorlage bewahrt.
