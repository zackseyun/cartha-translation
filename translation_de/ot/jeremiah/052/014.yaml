id: JER.52.14
reference: Jeremiah 52:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת כָּל חֹמ֥וֹת יְרוּשָׁלִַ֖ם סָבִ֑יב נָֽתְצוּ֙ כָּל חֵ֣יל כַּשְׂדִּ֔ים אֲשֶׁ֖ר אֶת רַב טַבָּחִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/014.yaml
  text: And all the walls around Jerusalem were broken down by all the army of the Chaldeans that was with the captain of the guard[a][b].
translation:
  language: de
  text: Und das gesamte Heer der Chaldäer[a], das beim Befehlshaber der Leibwache[b] war, riss alle Mauern rings um Jerusalem nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Oberster der Schlächter“; gemeint ist wahrscheinlich der Befehlshaber der königlichen Leibwache.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹמוֹת
  choice: Mauern
  rationale: Der Plural von חוֹמָה bezeichnet hier die Befestigungsmauern Jerusalems; im Deutschen ist „Mauern“ im Zusammenhang eindeutig und natürlich.
- source_word: סָבִיב
  choice: rings um
  rationale: Die Wendung gibt die umlaufende beziehungsweise allseitige Ausdehnung der Mauern knapp und idiomatisch wieder.
- source_word: נָתְצוּ
  choice: riss ... nieder
  rationale: נתץ bezeichnet das Niederreißen oder Zerstören eines Bauwerks. Die aktive Form folgt der hebräischen Verbform und ist im Deutschen natürlich.
- source_word: חֵיל
  choice: Heer
  rationale: חֵיל bezeichnet hier die militärische Streitmacht; „Heer“ ist eine klare, würdige Wiedergabe.
- source_word: כַּשְׂדִּים
  choice: Chaldäer
  rationale: „Chaldäer“ gibt das hebräische Ethnonym direkt wieder; im historischen Kontext sind damit die Babylonier gemeint.
- source_word: אֲשֶׁר אֶת
  choice: das beim ... war
  rationale: Die Konstruktion bezeichnet die Zuordnung beziehungsweise Begleitung des Heeres zu dem genannten Amtsträger. „beim“ ist hier natürliches Deutsch und bewahrt die Relation.
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der Leibwache
  rationale: Der Titel bezeichnet einen hohen babylonischen Amtsträger, der die königliche Leibwache befehligte. Die wörtliche Bedeutung bleibt in einer Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Voranstellung des handelnden Heeres vermeidet eine schwerfällige Passivkonstruktion, ohne den Inhalt oder die vollständige Reichweite von „alle Mauern“ und „das gesamte Heer“ abzuschwächen.
