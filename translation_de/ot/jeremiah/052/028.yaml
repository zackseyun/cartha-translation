base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/028.yaml
  text: 'These are the people whom Nebuchadnezzar carried away captive: in the seventh year[b][a], 3,023 Judeans.'
translation:
  language: de
  text: 'Dies sind die Menschen, die Nebukadnezar ins Exil führte[a]: im siebten Jahr 3.023 Judäer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verschleppte“ oder „deportierte“.'
    reason: lexical_alternative
  - marker: b
    text: '„Judäer“ bezeichnet hier Menschen aus dem Königreich beziehungsweise dem Gebiet Juda; traditionell: „Juden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הָעָם
  choice: Das sind die Menschen
  rationale: Die hebräische Wendung steht formal im Singular („dieses Volk“), führt hier aber eine zahlenmäßige Aufstellung ein. Die pluralische deutsche Form gibt diese Funktion natürlich wieder, ohne eine im Ausgangstext nicht ausdrücklich genannte Bezeichnung wie „Zahl“ oder „Bevölkerung“ einzufügen.
- source_word: אֲשֶׁר
  choice: die
  rationale: Das Relativpronomen bezieht sich auf Menschen und wird im Deutschen idiomatisch mit „die“ wiedergegeben.
- source_word: הֶגְלָה
  choice: in die Verbannung führte
  rationale: Der Hifil von גלה bezeichnet hier das erzwungene Fortführen ins Exil. Die Formulierung bewahrt sowohl die Verursachung als auch das Ziel der Handlung; knappere Alternativen werden in der Fußnote genannt.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die im modernen Deutschen etablierte Namensform des babylonischen Königs.
- source_word: בִּשְׁנַת שֶׁבַע
  choice: im siebten Jahr
  rationale: Die Kardinalzahl wird in dieser Jahresangabe ordinal verstanden; „im siebten Jahr“ ist die natürliche deutsche Wiedergabe.
- source_word: יְהוּדִים
  choice: Judäer
  rationale: Im exilisch-historischen Zusammenhang bezeichnet das Wort Menschen aus Juda. „Judäer“ hält den geografisch-politischen Bezug deutlicher fest als das traditionellere „Juden“.
- source_word: שְׁלֹשֶׁת אֲלָפִים וְעֶשְׂרִים וּשְׁלֹשָׁה
  choice: '3.023'
  rationale: Die additive hebräische Zahlenangabe bedeutet 3.023. Ziffern sind in einer listenartigen historischen Notiz gut lesbar; der Punkt entspricht der deutschen Schreibweise für Tausendergruppen.
