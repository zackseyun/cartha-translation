  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית הַ/גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/013.yaml
  text: He burned the house of Yahweh[a], the house of the king, and all the houses of Jerusalem[c][b]; every great house he burned with fire.
translation:
  language: de
  text: Er verbrannte das Haus Jahwes[a] und das Haus des Königs[b] sowie alle Häuser Jerusalems; jedes große Haus[c] verbrannte er mit Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den Tempel Jahwes“. Wörtlich: „das Haus Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „den Königspalast“. Wörtlich: „das Haus des Königs“.'
    reason: lexical_alternative
  - marker: c
    text: „Groß“ kann hier sowohl „groß“ als auch „bedeutend“ meinen.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Er verbrannte
  rationale: Das Qal-Wayyiqtol von שׂרף führt die nächste Handlung der Erzählung fort. Im natürlichen deutschen Erzählstil kann das vorangestellte וַ ohne ein ausdrückliches „und“ wiedergegeben werden.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt das hebräische Bild und die Parallele zu „Haus des Königs“; sachlich ist der Tempel gemeint.
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Haus des Königs
  rationale: Die formnahe Wiedergabe erhält die Wiederholung von בֵּית und den Parallelismus mit dem Haus Jahwes. Gemeint ist der Königspalast.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: alle Häuser Jerusalems
  rationale: Die Genitivverbindung gibt die Häuser in beziehungsweise von Jerusalem knapp und würdig wieder.
- source_word: כָּל בֵּית הַגָּדוֹל
  choice: jedes große Haus
  rationale: Das Singularwort nach כָּל ist distributiv zu verstehen. „Groß“ wahrt die Mehrdeutigkeit von גָּדוֹל zwischen räumlicher Größe und gesellschaftlicher Bedeutung.
- source_word: שָׂרַף בָּאֵשׁ
  choice: verbrannte er mit Feuer
  rationale: Die ausdrückliche Nennung des Feuers neben dem wiederholten Verb entspricht der emphatischen hebräischen Formulierung, auch wenn sie im Deutschen markiert klingt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Konsonantentext enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Haus-Terminologie und die emphatische Schlussformulierung wurden trotz ihrer leichten Markiertheit bewahrt; das Semikolon macht die zusammenfassende Wiederaufnahme im letzten Satzteil verständlich.
