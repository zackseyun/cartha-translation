  text: וּ/מִ/דַּלּ֣וֹת הָ/אָ֔רֶץ הִשְׁאִ֕יר נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים לְ/כֹרְמִ֖ים וּ/לְ/יֹגְבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/016.yaml
  text: But some of the poorest of the land Nebuzaradan[a], the captain of the guard[b], left as vinedressers and farmers.
translation:
  language: de
  text: Doch einige von den Armen im Land ließ Nebusaradan, der Befehlshaber der Leibwache,[a] als Weingärtner und Feldarbeiter[b] zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »der Oberste der Schlachter« oder »der Oberste der Henker«; gemeint ist wahrscheinlich ein babylonischer Hof- oder Militärtitel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Pflüger« beziehungsweise »Ackerbauern«; das seltene hebräische Wort bezeichnet Arbeiter, die den Boden bestellen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלּוֹת הָאָרֶץ
  choice: Doch einige von den Ärmsten im Land
  rationale: 'Die Präposition מִן hat hier partitive Bedeutung: Nebusaradan ließ einen Teil der armen beziehungsweise niedrigen Bevölkerung zurück. „Doch“ gibt im Zusammenhang den Gegensatz zur vorausgehenden Wegführung wieder, ohne ihn überzubetonen.'
- source_word: הִשְׁאִיר
  choice: ließ … zurück
  rationale: Der Hifil von שׁאר bedeutet, jemanden oder etwas zurückzulassen beziehungsweise übrig zu lassen. Die gewählte Formulierung passt unmittelbar zum Kontext der Wegführung.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird in einer im Deutschen etablierten Form wiedergegeben.
- source_word: רַב טַבָּחִים
  choice: der Befehlshaber der Leibwache
  rationale: Die wörtlich ungewöhnliche Bezeichnung „Oberster der Schlachter/Henker“ bezeichnet hier ein babylonisches Hof- oder Militäramt. „Befehlshaber der Leibwache“ vermittelt die Funktion verständlich; die wörtlichere Bedeutung wird in der Fußnote bewahrt.
- source_word: לְכֹרְמִים
  choice: als Weingärtner
  rationale: כֹרְמִים bezeichnet Menschen, die Weinberge anlegen oder bearbeiten; לְ kennzeichnet hier die ihnen zugewiesene Tätigkeit.
- source_word: וּלְיֹגְבִים
  choice: und Feldarbeiter
  rationale: Das seltene landwirtschaftliche Wort bezeichnet Bearbeiter des Bodens, möglicherweise besonders Pflüger. „Feldarbeiter“ wahrt den landwirtschaftlichen Sinn, ohne die unsichere Spezialisierung auf das Pflügen im Haupttext festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bewahrt die Hervorhebung der zurückgelassenen armen Bevölkerung, bleibt aber gut lesbar. Seltene Amts- und Berufsbezeichnungen werden im Haupttext funktional und in den Fußnoten formnäher wiedergegeben.
