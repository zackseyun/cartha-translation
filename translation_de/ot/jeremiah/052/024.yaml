base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/024.yaml
  text: And the captain of the guard took Seraiah the chief priest[a], and Zephaniah the second priest[c][b], and the three keepers of the threshold.
translation:
  language: de
  text: Und der Befehlshaber der Leibwache nahm Seraja, den obersten Priester[a], Zefanja, den zweiten Priester[b], und die drei Hüter der Schwelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Hohepriester«. Der hebräische Titel lautet wörtlich »der oberste Priester« beziehungsweise »der Hauptpriester«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »den stellvertretenden Priester« beziehungsweise »den Priester zweiten Ranges«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »die drei Torhüter«. Wörtlich: »die drei Hüter der Schwelle«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der Leibwache
  rationale: Die Wendung bedeutet wörtlich etwa »Oberster der Schlächter«, bezeichnet im neubabylonischen Herrschaftskontext jedoch den Befehlshaber der königlichen Leibwache. Die gewählte Fassung gibt die amtliche Funktion natürlich und sachgerecht wieder.
- source_word: וַיִּקַּח
  choice: nahm
  rationale: לקח bedeutet grundsätzlich »nehmen«. Der Zusammenhang legt eine Ingewahrsamnahme nahe, doch die schlichte Wiedergabe »nahm« fügt dem hebräischen Wort keine ausdrücklich genannte Deutung hinzu.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Der Personenname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: der oberste Priester
  rationale: Die Bezeichnung lautet wörtlich »der Priester, das Haupt/der Oberste«. »Oberster Priester« bildet diese Formulierung transparent ab, ohne sie stillschweigend auf den geläufigeren Titel »Hohepriester« festzulegen.
- source_word: צְפַנְיָה
  choice: Zefanja
  rationale: Der Personenname wird in einer im Deutschen geläufigen biblischen Form wiedergegeben.
- source_word: כֹּהֵן הַמִּשְׁנֶה
  choice: der zweite Priester
  rationale: מִשְׁנֶה bezeichnet den zweiten Rang oder eine Stellvertreterstellung. »Der zweite Priester« bewahrt die knappe Amtsbezeichnung und lässt offen, ob vor allem Rangfolge oder Stellvertretung gemeint ist.
- source_word: שְׁלֹשֶׁת
  choice: die drei
  rationale: Die Konstruktform der Zahl wird vor der folgenden Amtsbezeichnung natürlich mit »die drei« wiedergegeben.
- source_word: שֹׁמְרֵי הַסַּף
  choice: Hüter der Schwelle
  rationale: Die Wendung bedeutet wörtlich »Hüter/Wächter der Schwelle« und bezeichnet vermutlich Tempeltorhüter. Die bildhafte und amtliche Ausdrucksweise des Hebräischen bleibt erhalten.
