translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer bewusst leicht formellen Färbung. Die lange Aufzählungsstruktur des hebräischen Satzes bleibt erkennbar, wird aber durch „dazu“, „ferner“ und „sowie“ lesbar gegliedert. Die Wiederholung „die sich noch … befanden“ entspricht dem Quellenwortlaut; „noch“ verdeutlicht im Kontext den resultativen Sinn, ohne zusätzliche Sachinformation einzuführen.
