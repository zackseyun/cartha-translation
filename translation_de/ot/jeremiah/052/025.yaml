  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר הָיָ֥ה פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/שִׁבְעָ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת סֹפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בְּ/ת֥וֹךְ הָ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/025.yaml
  text: And from the city he took one court official who had been appointed over the men of war[a], and seven men from those who saw the king’s face, who were found in the city, and the scribe of the commander of the army, who mustered the people of the land, and sixty men from the people of the land who were found within the city.
translation:
  language: de
  text: Aus der Stadt nahm er einen Hofbeamten mit, der über die Kriegsleute eingesetzt war, dazu sieben Männer aus dem Kreis derer, die das Angesicht des Königs sahen[a] und sich in der Stadt befanden, ferner den Schreiber des Heerführers, der das Volk des Landes zum Kriegsdienst aufbot, sowie sechzig Männer aus dem Volk des Landes, die sich innerhalb der Stadt befanden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Kreis der persönlichen Diener des Königs“; die Wendung „das Angesicht des Königs sehen“ bezeichnet am Hof Personen, die unmittelbaren Zugang zu ihm hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: Hofbeamter
  rationale: Das Wort kann einen Eunuchen oder allgemeiner einen königlichen Amtsträger bezeichnen. „Hofbeamter“ wahrt die administrative Bedeutung, ohne einen körperlichen Status vorauszusetzen.
- source_word: פָקִיד עַל
  choice: die Aufsicht über … hatte
  rationale: Die Wendung bezeichnet eine Person, der Verantwortung und Aufsicht übertragen worden waren; die deutsche Formulierung ist natürlich und gibt die delegierte Zuständigkeit wieder.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: Kriegsleute
  rationale: Die Bezeichnung bleibt nahe am hebräischen Ausdruck und ist im militärischen Zusammenhang verständlich, ohne den Personenkreis stärker als reguläre Soldaten festzulegen.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: aus dem Kreis derer, die das Angesicht des Königs sahen
  rationale: Die bildhafte Hofrede wird im Haupttext bewahrt. Sie bezeichnet wahrscheinlich Personen mit unmittelbarem Zugang zum König; diese idiomatische Bedeutung wird in der Fußnote erläutert.
- source_word: סֹפֵר שַׂר הַצָּבָא
  choice: den Schreiber des Heerführers
  rationale: Die Konstruktverbindung bezeichnet am natürlichsten den Schreiber beziehungsweise Sekretär, der dem Heerführer zugeordnet war. „Schreiber“ bewahrt die lexikalische Gestalt.
- source_word: הַמַּצְבִּא
  choice: der … zum Kriegsdienst aufbot
  rationale: Das Hifil-Partizip von צבא bezeichnet hier das militärische Aufbieten beziehungsweise Einziehen. Die Formulierung macht diese administrative Aufgabe im modernen Deutsch klar.
- source_word: עַם הָאָרֶץ
  choice: Volk des Landes
  rationale: Die relativ wörtliche Wiedergabe erhält die mögliche gesellschaftlich-politische Nuance der festen Wendung und legt sie nicht vorschnell auf „einfache Leute“ fest.
- source_word: בְּתוֹךְ הָעִיר
  choice: mitten in der Stadt
  rationale: Die Wendung gibt den räumlichen Nachdruck des Hebräischen idiomatisch und verständlich wieder.
