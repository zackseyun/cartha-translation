base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/010.yaml
  text: Then the king of Babylon slaughtered the sons of Zedekiah before his eyes[a], and he also slaughtered all the officials of Judah at Riblah.
translation:
  language: de
  text: Da schlachtete der König von Babylon die Söhne Zedekias vor den Augen Zedekias ab. Auch alle führenden Amtsträger Judas[a] schlachtete er in Ribla ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Fürsten Judas“; das hebräische Wort kann hochrangige Herrscher, Amtsträger oder Fürsten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחַט
  choice: Da ließ ... abschlachten
  rationale: שׁחט bezeichnet ein gewaltsames Schlachten oder Töten. „Abschlachten“ bewahrt hier die Härte der Hinrichtung; die Konstruktion mit „ließ“ entspricht im Deutschen natürlich dem Handeln eines Königs durch seine Vollstrecker. „Da“ führt die Erzählfolge fort.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Die hebräische Status-constructus-Verbindung wird klar und idiomatisch wiedergegeben.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: die Söhne Zedekias
  rationale: בְּנֵי bezeichnet hier ausdrücklich die männlichen Nachkommen; „Söhne“ ist präziser als „Kinder“.
- source_word: לְעֵינָיו
  choice: vor dessen Augen
  rationale: Die Wendung bewahrt die Anschaulichkeit des hebräischen Idioms und macht den Rückbezug auf Zedekia eindeutig.
- source_word: וְגַם
  choice: Auch
  rationale: „Auch“ erhält die additive und hervorhebende Kraft der hebräischen Verbindung in natürlichem Deutsch.
- source_word: כָּל שָׂרֵי יְהוּדָה
  choice: alle führenden Männer Judas
  rationale: שָׂרֵי kann hochrangige Amtsträger, Befehlshaber oder Fürsten bezeichnen. „Führende Männer“ gibt den gesellschaftlich-politischen Rang verständlich wieder, ohne eine erbliche Fürstenwürde vorauszusetzen.
- source_word: שָׁחַט
  choice: ließ ... abschlachten
  rationale: Die Wiederholung bewahrt die lexikalische Wiederaufnahme und die brutale Aussage des Hebräischen.
- source_word: בְּרִבְלָתָה
  choice: in Ribla
  rationale: Die Ortsangabe wird im Deutschen bei einer Stadt natürlich mit „in“ wiedergegeben.
