source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה אוֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/027.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[a]. So Judah was taken into exile from its land.
translation:
  language: de
  text: Und der König von Babel schlug sie und ließ sie in Ribla im Land Hamat töten. So wurde Juda aus seinem Land[a] verschleppt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen „von über seinem Erdboden“. Das maskuline „seinem“ bezieht sich grammatisch auf Juda.
    reason: Die Fußnote macht die ungewöhnliche hebräische Präposition und den maskulinen Singularbezug sichtbar, ohne den Haupttext unnatürlich zu formulieren.
lexical_decisions:
- source_word: וַיַּכֶּה אוֹתָם
  choice: schlug sie
  rationale: נכה bezeichnet hier eine gewaltsame Strafhandlung. Die knappe Wiedergabe lässt den folgenden, ausdrücklich genannten Tod als eigenen Handlungsschritt stehen.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung; „Babel“ entspricht der etablierten biblischen Form des Orts- und Reichsnamens.
- source_word: וַיְמִתֵם
  choice: ließ sie töten
  rationale: Der Hifil von מות bedeutet wörtlich, den Tod zu verursachen. „ließ sie töten“ bewahrt die kausative Bedeutung, ohne ein im Hebräischen nicht ausdrücklich genanntes förmliches Gerichtsverfahren vorauszusetzen.
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: in Ribla im Land Hamat
  rationale: Die beiden mit ב eingeleiteten Ortsangaben werden im Deutschen klar und idiomatisch lokal wiedergegeben.
- source_word: וַיִּגֶל יְהוּדָה
  choice: So wurde Juda … verschleppt
  rationale: גלה bezeichnet hier die erzwungene Wegführung ins Exil. Das Passiv bringt im Deutschen den erlittenen Charakter der Deportation natürlich zum Ausdruck; „Juda“ bewahrt die metonymische Kürze des Hebräischen.
- source_word: מֵעַל אַדְמָתוֹ
  choice: aus seinem Land
  rationale: אַדָמָה bezeichnet hier das eigene Land. Das maskuline Singularsuffix wird entsprechend dem grammatisch maskulinen Namen Juda mit „seinem“ wiedergegeben.
theological_decisions:
- issue: Maskulines Pronominalsuffix bei Juda in מֵעַל אַדְמָתוֹ
  choice: aus seinem Land
  alternative: aus dem eigenen Land / aus seinem Boden
  rationale: Die Form bewahrt den grammatischen Bezug des maskulinen Singularsuffixes auf Juda. Sie trifft keine Aussage über biologisches Geschlecht und löst den kollektiven Bezug des Namens nicht erläuternd auf.
- issue: Handelndes oder erleidendes Verständnis von וַיִּגֶל
  choice: wurde … verschleppt
  alternative: ging ins Exil
  rationale: Obwohl die hebräische Form morphologisch aktiv ist, bezeichnet der Kontext die von Babylon erzwungene Deportation. Die passive deutsche Form vermittelt diesen Zusammenhang, ohne eine freiwillige Auswanderung anzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper erzählerischer Satzstruktur. „Babel“, „Ribla“ und „Hamat“ folgen den im deutschen Bibelgebrauch etablierten Namensformen. Die beiden hebräischen Verben für Schlagen und Töten bleiben als getrennte Handlungen erhalten.
