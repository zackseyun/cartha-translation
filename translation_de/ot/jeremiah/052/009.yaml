  text: וַֽ/יִּתְפְּשׂוּ֙ אֶת הַ/מֶּ֔לֶךְ וַ/יַּעֲל֨וּ אֹת֜/וֹ אֶל מֶ֧לֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/009.yaml
  text: They captured the king and brought him up to the king of Babylon at Riblah in the land of Hamath[a], and he passed sentence on him.
translation:
  language: de
  text: Sie nahmen den König gefangen und führten ihn hinauf zum König von Babylon nach Ribla im Land Hamat. Der König von Babylon fällte Urteile über ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er sprach Urteile mit ihm“; gemeint ist, dass der König von Babylon richterliche Entscheidungen über ihn verkündete.'
    reason: Die Fußnote bewahrt die ungewöhnliche hebräische Formulierung und den Plural „Urteile“, während der Haupttext die gerichtliche Bedeutung idiomatisch wiedergibt.
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ אֶת הַמֶּלֶךְ
  choice: Sie nahmen den König gefangen
  rationale: תפשׂ bezeichnet hier im militärischen Zusammenhang das Ergreifen beziehungsweise Gefangennehmen; die deutsche Wendung ist natürlich und eindeutig.
- source_word: וַיַּעֲלוּ אֹתוֹ אֶל
  choice: und führten ihn hinauf zu
  rationale: Die kausative Bedeutung von עלה wird mit „hinaufführen“ wiedergegeben; so bleibt die hebräische Richtungsangabe erhalten, ohne im Deutschen unverständlich zu wirken.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Die Konstruktion wird idiomatisch wiedergegeben. „Babylon“ ist im modernen Standarddeutsch als Orts- und Reichsname allgemein verständlich.
- source_word: רִבְלָתָה
  choice: nach Ribla
  rationale: Die Ortsbezeichnung mit lokativem ה wird im Deutschen natürlich durch „nach“ ausgedrückt.
- source_word: בְּאֶרֶץ חֲמָת
  choice: im Land Hamat
  rationale: אֶרֶץ bezeichnet hier das Land beziehungsweise Gebiet von Hamat; „im Land Hamat“ wahrt die geografische Formulierung knapp und verständlich.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: Dort hielt der König von Babylon Gericht über ihn
  rationale: Die wörtliche Wendung „Urteile mit/zu ihm sprechen“ ist eine gerichtliche Formulierung. „Gericht über ihn halten“ gibt ihre Funktion natürlich wieder. Die Wiederholung des Subjekts vermeidet im Deutschen eine mögliche Verwechslung der beiden Könige.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen erscheinen in den geläufigen Formen „Babylon“, „Ribla“ und „Hamat“. Die Wiederholung „der König von Babylon“ schafft klare Bezüge; „Dort“ bindet die Gerichtsverhandlung ausdrücklich an Ribla.
