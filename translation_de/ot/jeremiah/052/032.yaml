  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a].
translation:
  language: de
  text: Er sprach freundlich mit ihm und erhob dessen Thron über die Throne der Könige, die bei ihm in Babylon waren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Er sprach Gutes mit ihm«, das heißt, er sprach freundlich oder wohlwollend mit ihm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Er redete freundlich mit ihm
  rationale: דבר mit אֵת bedeutet hier »mit jemandem reden«; das adverbial gebrauchte טֹבוֹת bezeichnet eine freundliche oder wohlwollende Art des Redens. Die Formulierung ist natürlich und bewahrt den Sinn des Hebräischen.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: und setzte seinen Thron
  rationale: נתן bezeichnet in diesem höfischen Zusammenhang das Zuweisen beziehungsweise Platzieren des Thrones und damit zugleich die Verleihung eines höheren Ranges. »Setzte seinen Thron« erhält das konkrete Bild.
- source_word: כִּסְאוֹ
  choice: seinen Thron
  rationale: כִּסֵּא kann Sitz oder Thron bedeuten; wegen des königlichen Zusammenhangs und des Rangvergleichs ist »Thron« hier passend.
- source_word: מִמַּעַל לְכִסֵּא מְלָכִים
  choice: über die Throne der Könige
  rationale: Die Wendung drückt eine höhere Stellung oder Platzierung gegenüber den übrigen Königen aus. Der deutsche Plural macht den distributiven Sinn verständlich.
- source_word: אֲשֶׁר אִתּוֹ בְּבָבֶל
  choice: die bei ihm in Babylon waren
  rationale: Der Relativsatz bezeichnet die Könige, die sich beim babylonischen Herrscher in Babylon befanden. »Bei ihm« gibt אִתּוֹ natürlich wieder.
