  text: וַ/יִּֽהְיוּ֙ הָֽ/רִמֹּנִ֔ים תִּשְׁעִ֥ים וְ/שִׁשָּׁ֖ה ר֑וּחָ/ה כָּל הָ/רִמּוֹנִ֥ים מֵאָ֛ה עַל הַ/שְּׂבָכָ֖ה סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/023.yaml
  text: There were ninety-six pomegranates toward the outside[a]; all the pomegranates on the lattice all around were one hundred.
translation:
  language: de
  text: Nach außen hin[a] waren es sechsundneunzig Granatäpfel; insgesamt waren es hundert Granatäpfel ringsum auf dem Gitterwerk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist schwer zu deuten; auch möglich sind »nach einer Seite hin«, »auf der sichtbaren Seite« oder »windwärts«. Gemeint ist wahrscheinlich, dass sechsundneunzig von einer Seite aus gezählt wurden, während die Gesamtzahl rings um das Gitterwerk hundert betrug.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִמֹּנִים
  choice: Granatäpfel
  rationale: Das Wort bezeichnet wörtlich Granatäpfel, hier die granatapfelförmigen Verzierungen an den Säulen. Die konkrete Bildbezeichnung bleibt im Haupttext erhalten.
- source_word: תִּשְׁעִים וְשִׁשָּׁה
  choice: sechsundneunzig
  rationale: Direkte Wiedergabe der Kardinalzahl.
- source_word: רוּחָה
  choice: nach außen hin
  rationale: Die Richtungsform zu רוּחַ ist an dieser Stelle schwer zu deuten. Im architektonischen Zusammenhang gibt »nach außen hin« eine wahrscheinliche räumliche Bedeutung wieder, ohne die Unsicherheit durch eine zu genaue Festlegung zu verdecken.
- source_word: כָּל הָרִמּוֹנִים מֵאָה
  choice: insgesamt waren es hundert Granatäpfel
  rationale: כָּל und die Zahl bezeichnen hier den Gesamtbestand. Die idiomatische deutsche Formulierung macht den Gegensatz zwischen den sechsundneunzig und der Gesamtzahl hundert deutlich.
- source_word: הַשְּׂבָכָה
  choice: Gitterwerk
  rationale: שְׂבָכָה bezeichnet das netz- oder gitterartige Zierwerk an den Säulenkapitellen. »Gitterwerk« ist im Deutschen präzise und natürlich.
- source_word: סָבִיב
  choice: ringsum
  rationale: Das Adverb bezeichnet die gesamte Umfassung und wird knapp und idiomatisch mit »ringsum« wiedergegeben.
