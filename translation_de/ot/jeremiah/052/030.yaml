  text: בִּ/שְׁנַ֨ת שָׁלֹ֣שׁ וְ/עֶשְׂרִים֮ לִ/נְבֽוּכַדְרֶאצַּר֒ הֶגְלָ֗ה נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים יְהוּדִ֕ים נֶ֕פֶשׁ שְׁבַ֥ע מֵא֖וֹת אַרְבָּעִ֣ים וַ/חֲמִשָּׁ֑ה כָּל נֶ֕פֶשׁ אַרְבַּ֥עַת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/030.yaml
  text: In the twenty-third year of Nebuchadnezzar[a], Nebuzaradan the captain of the guard carried away 745 Judeans[c][b]. All the persons were 4,600.
translation:
  language: de
  text: Im 23. Regierungsjahr Nebukadnezars führte Nebusaradan, der Oberste der Leibwache, 745 Judäer in die Verbannung[a]. Insgesamt waren es 4.600 Personen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ließ ins Exil gehen“; auch: „deportierte“.'
    reason: lexical_alternative
  - marker: b
    text: Die Gesamtzahl 4.600 fasst die in den Versen 28–30 genannten Weggeführten zusammen. Das Hebräische verwendet in beiden Zahlenangaben das Wort „Seele“ (נֶפֶשׁ) im Sinn von „Person“.
    reason: cross_reference
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ וְעֶשְׂרִים לִנְבוּכַדְרֶאצַּר
  choice: Im 23. Regierungsjahr Nebukadnezars
  rationale: Die Ergänzung „Regierungsjahr“ macht die durch לְ ausgedrückte Herrscherära im Deutschen eindeutig und gibt die hebräische Datierungsformel natürlich wieder.
- source_word: הֶגְלָה
  choice: führte … in die Verbannung
  rationale: Der Hifil von גלה bezeichnet hier das Veranlassen des Exils. Die Formulierung ist historisch angemessen und weniger verwaltungssprachlich als „deportierte“.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird nach einer im Deutschen geläufigen biblischen Umschrift wiedergegeben.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Im Kontext bezeichnet die Wendung ein babylonisches Hof- beziehungsweise Militäramt; die rein wörtliche Wiedergabe „Oberster der Schlächter“ wäre irreführend.
- source_word: יְהוּדִים
  choice: Judäer
  rationale: Hier steht die ethnogeografische Zugehörigkeit zu Juda im Vordergrund; „Judäer“ bewahrt diese historische Nuance.
- source_word: נֶפֶשׁ
  choice: Personen
  rationale: נֶפֶשׁ dient in beiden Zahlenangaben als Zählbegriff für Menschen, nicht als metaphysische Bezeichnung der Seele.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: '745'
  rationale: Arabische Ziffern geben die exakte Zahl übersichtlich wieder.
- source_word: כָּל נֶפֶשׁ
  choice: Insgesamt waren es … Personen
  rationale: Die natürliche deutsche Summenformel verdeutlicht, dass die Schlusszahl die in den vorausgehenden Versen aufgeführten Weggeführten zusammenfasst.
- source_word: אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: '4.600'
  rationale: Die deutsche Ziffernschreibung wahrt die genaue Gesamtzahl und verbessert die Lesbarkeit.
