source:
  edition: WLC
  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַת֩ תָּמִ֨יד נִתְּנָה לּ֜/וֹ מֵ/אֵ֧ת מֶֽלֶךְ בָּבֶ֛ל דְּבַר י֥וֹם בְּ/יוֹמ֖/וֹ עַד י֣וֹם מוֹת֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/034.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king of Babylon, a daily portion day by day, until the day of his death, all the days of his life.
translation:
  language: de
  text: 'Und seine Versorgung[a] – eine ständige Versorgung – wurde ihm vom König von Babylon gegeben: die tägliche Zuteilung, Tag für Tag, bis zum Tag seines Todes, alle Tage seines Lebens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Zuteilung“, „Ration“ oder „Unterhalt“. Gemeint ist die dem Jojachin vom König zugewiesene Versorgung.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: Unterhalt
  rationale: Das Substantiv bezeichnet hier die dem Jojachin zugewiesene Versorgung durch den König. „Unterhalt“ gibt diesen administrativen und fortlaufenden Versorgungscharakter natürlicher wieder als das enger auf Lebensmittel bezogene „Ration“.
- source_word: תָּמִיד
  choice: regelmäßig
  rationale: Das Wort bezeichnet hier die beständige, fortlaufend gewährte Versorgung. „Regelmäßig“ verbindet die zeitliche Dauer mit der im Folgenden genannten täglichen Zuteilung.
- source_word: נִתְּנָה
  choice: wurde gewährt
  rationale: Die Passivform des hebräischen Verbs wird bewahrt. „Gewährt“ entspricht im Deutschen dem Kontext einer königlichen Zuweisung besser als das allgemeinere „gegeben“.
- source_word: מֵאֵת מֶלֶךְ בָּבֶל
  choice: vom König von Babylon
  rationale: Die Wendung bezeichnet den König als Ursprung der Zuwendung. Das deutsche „vom“ kann sowohl Herkunft als auch Urheberschaft ausdrücken; „Babylon“ ist die heute allgemein verständliche Orts- und Reichsbezeichnung.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: Tag für Tag der jeweilige Tagesbedarf
  rationale: Die idiomatische Wendung meint die für jeden einzelnen Tag festgesetzte Menge. Die Übersetzung bewahrt sowohl den distributiven Sinn als auch die betonte tägliche Wiederholung.
- source_word: עַד יוֹם מוֹתוֹ
  choice: bis zum Tag seines Todes
  rationale: Die volle hebräische Formulierung wird beibehalten und nicht zu „bis zu seinem Tod“ verkürzt.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: alle Tage seines Lebens
  rationale: Die wörtlich-nahe Wiedergabe erhält die abschließende, feierliche Zeitangabe und ihre Verstärkung der vorherigen Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Unterhalt“ sowie die abschließende Zeitformel wurden zur Wahrung des hebräischen Nachdrucks beibehalten; der Gedankenstrich und der Doppelpunkt machen die appositionelle und erläuternde Struktur im Deutschen verständlich.
