  source_fidelity: 'Die Abfolge und die zentralen Aussagen werden zutreffend wiedergegeben: Zedekia wird geblendet, mit bronzenen Fesseln gebunden, nach Babylon gebracht und dort bis zu seinem Tod in Haft gehalten. Die explizite Nennung seiner Augen kann im Deutschen idiomatisch durch „Zedekia blind machte“ wiedergegeben werden. „Gewahrsamshaus“ ist jedoch keine geläufige oder klar etablierte deutsche Bezeichnung und verdeckt die bewusst zurückhaltende Bedeutung von בֵּית הַפְּקֻדֹּת eher, als dass sie sie bewahrt.'
  naturalness: Der Satzbau mit „und der König von Babylon“ ist verständlich, aber eine Wiederaufnahme mit „Dort ließ er ihn“ schwächt die direkte Verbalfolge des Hebräischen. „Haus des Gewahrsams“ ist als bewusst formale, verständliche Wiedergabe natürlicher als das künstlich wirkende Kompositum „Gewahrsamshaus“.
  terminology: „Bronzene Fesseln“ ist angemessen. „Haus des Gewahrsams“ wahrt die lexikalische Zurückhaltung gegenüber dem möglichen, aber engeren „Gefängnis“. Die Fußnote kann die geläufige Alternative nennen.
