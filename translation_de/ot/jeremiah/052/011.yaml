revisions:
- from: Dann blendete er Zedekia, legte ihn in bronzene Fesseln, und der König von Babylon brachte ihn nach Babylon. Dort ließ er ihn bis zum Tag seines Todes im Gewahrsamshaus[a].
  to: Dann machte er Zedekia blind, legte ihn in bronzene Fesseln, und der König von Babylon brachte ihn nach Babylon und setzte ihn bis zum Tag seines Todes in das Haus des Gewahrsams[a].
  rationale: Die Revision ersetzt das unidiomatische „Gewahrsamshaus“ durch die transparente, quellennahe Wendung „Haus des Gewahrsams“ und stellt die direkte hebräische Handlungsfolge wieder her. „Machte … blind“ ist modernes, sachliches Deutsch und gibt die ausdrückliche Aussage über Zedekias Erblindung wieder, ohne eine nicht im Verb selbst festgelegte Methode zu behaupten.
