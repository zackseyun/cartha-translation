base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/011.yaml
  text: Then he blinded Zedekiah’s eyes[a], bound him with bronze shackles, and the king of Babylon brought him to Babylon and put him in the house of custody until the day of his death.
translation:
  language: de
  text: Dann machte er Zedekia blind, legte ihn in bronzene Fesseln, und der König von Babylon brachte ihn nach Babylon und setzte ihn bis zum Tag seines Todes in das Haus des Gewahrsams[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in das Gefängnis«. Wörtlich: »in das Haus des Gewahrsams«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: blendete er Zedekia
  rationale: Das Hebräische sagt wörtlich, dass er »die Augen Zedekias blind machte«. Das deutsche Verb »blenden« bezeichnet diesen Vorgang idiomatisch und bewahrt die konkrete Gewalttat, ohne die im Deutschen schwerfällige Wendung »blendete seine Augen«.
- source_word: וַיַּאַסְרֵהוּ
  choice: legte ihn in … Fesseln
  rationale: אסר bedeutet hier »binden, fesseln«; zusammen mit der folgenden Angabe der Fesseln ist »legte ihn in … Fesseln« natürliches modernes Deutsch.
- source_word: בַנְחֻשְׁתַּיִם
  choice: in bronzene Fesseln
  rationale: Die Form bezeichnet paarige beziehungsweise mehrere Haftfesseln aus Bronze. »Fesseln« ist allgemeinverständlich und legt nicht unnötig fest, ob Ketten oder Fußschellen gemeint sind.
- source_word: וַיְבִאֵהוּ ... בָּבֶלָה
  choice: brachte ihn nach Babylon
  rationale: Die Kausativform von בוא bedeutet »bringen«; die Richtungsendung an בבל wird im Deutschen mit »nach Babylon« wiedergegeben.
- source_word: בֵּית הַפְּקֻדֹּת
  choice: Gewahrsamshaus
  rationale: Die seltene Bezeichnung meint ein Haus der Verwahrung oder Haft. »Gewahrsamshaus« bewahrt die bildhafte Nominalfügung und vermeidet die nicht völlig sichere Verengung auf »Gefängnis«; die geläufigere Alternative steht in der Fußnote.
- source_word: עַד יוֹם מוֹתוֹ
  choice: bis zum Tag seines Todes
  rationale: Die ausdrückliche und feierlich klingende Zeitangabe des Hebräischen wird formal bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »Babylon … Babylon« und der ausdrückliche Titel »der König von Babylon« bleiben erhalten. »Dort« verdeutlicht im Deutschen den Ortsbezug des folgenden Satzes, ohne neue Sachinformation einzuführen.
