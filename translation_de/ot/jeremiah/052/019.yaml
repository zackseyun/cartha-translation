base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/052/019.yaml
  text: And the bowls[a], the firepans, the basins, the pots, the lampstands, the cups, and the vessels for pouring—whatever was gold, gold, and whatever was silver[d][c][b], silver—the captain of the guard took.
translation:
  language: de
  text: Die Schalen[a], die Kohlenpfannen[b], die Becken, die Töpfe, die Leuchter, die Becher und die Gießgefäße – was aus Gold war, aus Gold, und was aus Silber war, aus Silber[c] – nahm der Befehlshaber der Leibwache[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Becher“. Die genaue Abgrenzung mehrerer Bezeichnungen für Tempelgefäße in dieser Aufzählung ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Räuchergefäße“.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische wiederholt die Materialangaben betont: „was aus Gold war, aus Gold, und was aus Silber war, aus Silber“.'
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „Oberster der Scharfrichter“; gemeint ist ein hoher babylonischer Hof- und Militäroffizier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפִּים
  choice: die Schalen
  rationale: Das Wort bezeichnet wahrscheinlich schalen- oder becherartige Tempelgefäße. „Schalen“ ist verständlich und hält es von הַכַּפּוֹת („Becher“) auseinander.
- source_word: הַמַּחְתּוֹת
  choice: die Kohlenpfannen
  rationale: Gemeint sind Pfannen zum Tragen glühender Kohlen, wohl auch im Zusammenhang mit Räucherwerk. „Kohlenpfannen“ ist konkret und weniger deutend als „Räuchergefäße“.
- source_word: הַמִּזְרָקוֹת
  choice: die Becken
  rationale: Der Ausdruck bezeichnet kultische Schalen oder Becken, die unter anderem beim Opferdienst verwendet wurden. „Becken“ gibt die Gefäßart wieder, ohne eine unsichere Einzelfunktion festzulegen.
- source_word: הַסִּירוֹת
  choice: die Töpfe
  rationale: Die Grundbedeutung ist „Töpfe“ beziehungsweise Behälter; eine genauere Verwendung wird im Vers nicht angegeben.
- source_word: הַמְּנֹרוֹת
  choice: die Leuchter
  rationale: מְנוֹרָה bezeichnet gewöhnlich einen Leuchter beziehungsweise Lampenständer und nicht bloß eine einzelne Lampe.
- source_word: הַכַּפּוֹת
  choice: die Becher
  rationale: In Tempelinventaren kann das Wort kleine Gefäße, Schalen oder auch löffelartige Geräte bezeichnen. „Becher“ ist hier plausibel und unterscheidet den Gegenstand von den zuvor genannten Schalen und Becken.
- source_word: הַמְּנַקִיּוֹת
  choice: die Gießgefäße
  rationale: Das seltene Wort bezeichnet wahrscheinlich Gefäße zum Ausgießen. Die funktionale Wiedergabe wahrt die Unsicherheit besser als ein veralteter oder zu enger Fachausdruck.
- source_word: אֲשֶׁר זָהָב זָהָב וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: was aus Gold war, aus Gold, und was aus Silber war, aus Silber
  rationale: Die ungewöhnliche Wiederholung von „Gold“ und „Silber“ wird beibehalten, damit der emphatische, inventarartige Stil des Hebräischen nicht geglättet wird.
- source_word: לָקַח
  choice: nahm
  rationale: „Nahm“ entspricht der schlichten Grundbedeutung des Verbs. Der Zusammenhang macht deutlich, dass die Gegenstände als Beute weggenommen wurden.
- source_word: רַב טַבָּחִים
  choice: der Befehlshaber der Leibwache
  rationale: Dies ist im babylonischen Hof- und Militärkontext eine verständliche Amtsbezeichnung. Die wörtlichere Deutung „Oberster der Scharfrichter“ bleibt als mögliche Alternative in der Fußnote erhalten.
