  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. Alte babylonische Namen und nicht sicher bestimmbare Amtstitel bleiben in Umschrift erhalten; erklärungsbedürftige historische und textliche Fragen stehen in den Fußnoten. „Babylon“ wurde als allgemein verständliche moderne Ortsbezeichnung gewählt.
