source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ כֹּ֚ל שָׂרֵ֣י מֶֽלֶךְ בָּבֶ֔ל וַ/יֵּשְׁב֖וּ בְּ/שַׁ֣עַר הַ/תָּ֑וֶךְ נֵרְגַ֣ל שַׂר אֶ֠צֶר סַֽמְגַּר נְב֞וּ שַׂר סְכִ֣ים רַב סָרִ֗יס נֵרְגַ֤ל שַׂר אֶ֨צֶר֙ רַב מָ֔ג וְ/כָל שְׁאֵרִ֔ית שָׂרֵ֖י מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
translation:
  language: de
  text: 'Da kamen alle Amtsträger des Königs von Babylon herein und setzten sich im Mittleren Tor[a] nieder: Nergal-Sarezer, Samgar-Nebu, Sarsechim[b], der Rab-Saris[c], Nergal-Sarezer, der Rab-Mag[d], und alle übrigen Amtsträger des Königs von Babylon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „am Mittleren Tor“. Die hebräische Präposition kann in diesem Zusammenhang räumlich mit „im“ oder „am“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: Die Abfolge „Samgar-Nebu, Sarsechim, der Rab-Saris“ ist schwer zu deuten. Namen und Titel werden teilweise anders voneinander abgegrenzt; so kann etwa „Samgar“ als Titel oder „Sarsechim“ als Amtsbezeichnung verstanden werden.
    reason: alternative_reading
  - marker: c
    text: „Rab-Saris“ ist ein babylonischer Amtstitel, der traditionell etwa als „oberster Eunuch“ oder „oberster Hofbeamter“ verstanden wird.
    reason: cultural_note
  - marker: d
    text: „Rab-Mag“ ist ein babylonischer Titel. Er bedeutet möglicherweise „Obermagier“ und könnte einen hochrangigen Kult- oder Ritualbeamten bezeichnet haben.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: kamen … herein
  rationale: בוא bezeichnet hier im Erzählzusammenhang das Hineinkommen der babylonischen Amtsträger in die eroberte Stadt. „Kamen herein“ gibt die Bewegung natürlich wieder, ohne sie militärisch stärker auszudeuten.
- source_word: כֹּל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: alle Amtsträger des Königs von Babylon
  rationale: שָׂרִים kann hochrangige Beamte, Würdenträger oder Befehlshaber bezeichnen. „Amtsträger“ passt zum höfisch-militärischen Zusammenhang, ohne sie auf Prinzen oder ausschließlich militärische Führer festzulegen.
- source_word: וַיֵּשְׁבוּ
  choice: setzten sich … nieder
  rationale: ישׁב bedeutet hier wörtlich „sich setzen“. Die Formulierung ist im Deutschen natürlich und lässt die möglicherweise mitschwingende Inbesitznahme beziehungsweise Ausübung von Autorität unausgesprochen.
- source_word: בְּשַׁעַר הַתָּוֶךְ
  choice: im Mittleren Tor
  rationale: שַׁעַר bezeichnet das Tor beziehungsweise den Torbereich, תָּוֶךְ die Mitte. Die Großschreibung behandelt die Wendung als wahrscheinliche Ortsbezeichnung. „Im“ gibt ב räumlich wieder; „am“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: נֵרְגַל שַׂר אֶצֶר
  choice: Nergal-Sarezer
  rationale: Der babylonische Personenname wird in einer im Deutschen gut lesbaren, an der hebräischen Form orientierten Umschrift wiedergegeben.
- source_word: סַמְגַּר נְבוּ
  choice: Samgar-Nebu
  rationale: Die masoretisch überlieferte Namensform wird transliteriert, statt spekulativ übersetzt oder als Titel umgedeutet zu werden.
- source_word: שַׂר סְכִים
  choice: Sarsechim
  rationale: Die masoretische Punktierung legt eine Wiedergabe als Eigenname nahe. Wegen der schwierigen Abgrenzung der Namen und Titel wird die Unsicherheit in einer Fußnote ausdrücklich bewahrt.
- source_word: רַב סָרִיס
  choice: der Rab-Saris
  rationale: Der babylonische Amtstitel wird transliteriert. So wird weder festgelegt, dass der Amtsinhaber notwendig ein Eunuch war, noch der spezifische Rang durch das allgemeinere „Oberbeamter“ eingeebnet.
- source_word: רַב מָג
  choice: der Rab-Mag
  rationale: Der babylonische Titel wird transliteriert, weil seine genaue Amtsbedeutung unsicher ist und Übersetzungen wie „Obermagier“ spätere Vorstellungen eintragen könnten.
- source_word: וְכָל שְׁאֵרִית שָׂרֵי מֶלֶךְ בָּבֶל
  choice: und alle übrigen Amtsträger des Königs von Babylon
  rationale: שְׁאֵרִית bezeichnet hier den Rest beziehungsweise die verbleibenden, nicht einzeln genannten Amtsträger. „Alle übrigen“ ist eine natürliche und genaue deutsche Wiedergabe.
