id: JER.39.11
reference: Jeremiah 39:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְצַ֛ו נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַֽל יִרְמְיָ֑הוּ בְּ/יַ֛ד נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/011.yaml
  text: Nebuchadnezzar king of Babylon gave orders concerning Jeremiah through Nebuzaradan[a], the captain of the guard, saying,
translation:
  language: de
  text: 'Nebukadnezar, der König von Babel, erteilte durch Nebusaradan[a], den Obersten der Leibwache, in Bezug auf Jeremia folgenden Befehl:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Obersten der Scharfrichter«; wörtlich: »den Obersten der Schlachter/Metzger«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: erteilte … folgenden Befehl
  rationale: צוה bezeichnet das Geben eines Befehls. Die deutsche Formulierung ist natürlich und leitet zugleich den im nächsten Vers folgenden Befehlsinhalt ein; das Präfix וַ wird im fortlaufenden Erzählzusammenhang nicht eigens mit „nun“ wiedergegeben.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Gebräuchliche deutsche Namensform, auch wenn die hebräische Schreibung an dieser Stelle der Form „Nebukadrezar“ nähersteht.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Direkte und im Deutschen vertraute Wiedergabe der Status- und Herrschaftsbezeichnung.
- source_word: עַל יִרְמְיָהוּ
  choice: in Bezug auf Jeremia
  rationale: עַל bezeichnet bei צוה die Person, auf die sich der Befehl bezieht; der Befehl wird nicht an Jeremia selbst gerichtet.
- source_word: בְּיַד
  choice: durch
  rationale: Die Wendung „durch die Hand von“ bezeichnet Vermittlung oder Beauftragung. „Durch“ gibt dieses Verhältnis in aktuellem Deutsch knapp wieder.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Gebräuchliche deutsche Umschrift des Personennamens.
- source_word: רַב טַבָּחִים
  choice: den Obersten der Leibwache
  rationale: Der Amtstitel bezeichnet im königlich-militärischen Zusammenhang den ranghohen Befehlshaber der Leibwache beziehungsweise der mit Hinrichtungen betrauten Männer. Die idiomatische Haupttextfassung wird durch eine wörtlichere Fußnote ergänzt.
- source_word: לֵאמֹר
  choice: 'folgenden Befehl:'
  rationale: Der zitierenden Infinitiv leitet den Inhalt des Befehls im nächsten Vers ein. Ein Doppelpunkt mit „folgenden Befehl“ ist dafür im Deutschen natürlicher als das formelhafte „indem er sagte“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt Nebusaradans vermittelnde Rolle und vermeidet ein nicht ausdrücklich vorhandenes einleitendes „Nun“.
