base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/014.yaml
  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: de
  text: Da ließen sie Jeremia aus dem Wachhof holen und übergaben ihn Gedalja, dem Sohn Ahikams und Enkel Schafans, damit er ihn nach Hause bringen sollte.[a] So lebte Jeremia mitten unter dem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „um ihn zu dem Haus hinauszubringen“; wessen Haus gemeint ist, wird im Hebräischen nicht ausdrücklich gesagt.'
    reason: „Nach Hause“ ist im Deutschen idiomatisch, kann aber eine im hebräischen Text nicht explizit genannte Zugehörigkeit des Hauses nahelegen.
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְחוּ
  choice: Da ließen sie … holen
  rationale: Die beiden koordinierten Verben bedeuten wörtlich „sie sandten und nahmen“. Im Deutschen gibt „ließen … holen“ den veranlassten Vorgang natürlich und vollständig wieder.
- source_word: חֲצַר הַמַּטָּרָה
  choice: Wachhof
  rationale: Bezeichnet den bewachten Hof beziehungsweise den Hof der Wache, in dem Jeremia festgehalten wurde; „Wachhof“ ist knapp und im Jeremiabuch verständlich.
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל־גְּדַלְיָהוּ
  choice: übergaben ihn Gedalja
  rationale: נתן אל bezeichnet hier die Übergabe in Gedaljas Obhut, nicht lediglich eine räumliche Bewegung zu ihm.
- source_word: בֶּן־אֲחִיקָם בֶּן־שָׁפָן
  choice: dem Sohn Ahikams und Enkel Schafans
  rationale: Das zweite בֶּן markiert die nächste Abstammungsgeneration. „Enkel“ macht die Genealogie im Deutschen eindeutig.
- source_word: לְהוֹצִאֵהוּ אֶל־הַבָּיִת
  choice: damit er ihn nach Hause brachte
  rationale: הוציא beschreibt das Hinausbringen aus dem Wachhof; אֶל־הַבָּיִת weist auf das Haus beziehungsweise den häuslichen Bereich als Ziel. „Nach Hause brachte“ ist natürlich, während die im Hebräischen nicht ausdrücklich bestimmte Zugehörigkeit des Hauses in einer Fußnote offengehalten wird.
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  choice: So lebte Jeremia mitten unter dem Volk
  rationale: ישׁב kann „wohnen“ oder „leben“ bedeuten. „Mitten unter dem Volk leben“ bezeichnet hier verständlich seine Rückkehr aus der Haft in die Gemeinschaft. Der Name verdeutlicht den möglichen Subjektwechsel nach dem vorangehenden „er“.
theological_decisions:
- issue: Wessen Haus mit הַבָּיִת gemeint ist
  choice: Im Haupttext allgemein „nach Hause“, ohne einen Besitzer zu nennen
  alternative: „in sein Haus“ beziehungsweise „in Gedaljas Haus“
  rationale: Der hebräische Text hat den bestimmten Ausdruck „das Haus“, aber kein Possessivpronomen. Eine ausdrückliche Zuordnung zu Jeremia oder Gedalja würde die genuine Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählfolge wird flüssig wiedergegeben; „mitten unter dem Volk“ bewahrt die anschauliche räumlich-soziale Aussage des Hebräischen.
