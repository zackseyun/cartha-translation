source:
  edition: WLC
  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
translation:
  language: de
  text: Doch ich werde dich an jenem Tag retten[a], spricht Jahwe, und du wirst nicht in die Hand der Männer gegeben werden, vor denen du dich fürchtest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »befreien«. Das hebräische Verb bezeichnet die Rettung aus einer Gefahr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Doch ich werde dich … retten
  rationale: Das Hifil von נצל bezeichnet die Rettung oder Befreiung aus einer Gefahr. „Retten“ ist im modernen Deutsch natürlich und lässt den konkreten Zusammenhang erkennen; וְ wird wegen des Kontrasts zum Kontext mit „Doch“ wiedergegeben.
- source_word: בַיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der temporalen Wendung; „jenem“ wahrt den rück- beziehungsweise vorausweisenden Charakter von הַהוּא.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird im Deutschen würdig und idiomatisch mit „spricht Jahwe“ wiedergegeben.
- source_word: וְלֹא תִנָּתֵן
  choice: und du wirst nicht … gegeben werden
  rationale: Das Nifal von נתן ist hier passiv. Die Formulierung bewahrt diese grammatische Gestalt und verbindet sich mit dem folgenden Bild von der Hand als Machtbereich.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Metapher für das Ausgeliefertsein an fremde Gewalt bleibt erhalten und ist im Deutschen verständlich.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Der bestimmte maskuline Plural bezeichnet im Kontext konkrete Männer; daher wird nicht verallgemeinernd mit „Menschen“ übersetzt.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: vor denen du dich fürchtest
  rationale: גור mit מִפְּנֵי bezeichnet hier Furcht vor Personen. Die deutsche Wendung gibt sowohl den Sinn als auch die Präposition „vor“ natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Metapher „in die Hand“ und das Passiv bleiben erhalten; die Satzstellung ist zugleich natürlich deutsch.
