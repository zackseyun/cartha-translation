  text: וַ/יִּרְדְּפ֨וּ חֵיל כַּשְׂדִּ֜ים אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֣גוּ אֶת צִדְקִיָּהוּ֮ בְּ/עַֽרְב֣וֹת יְרֵחוֹ֒ וַ/יִּקְח֣וּ אֹת֗/וֹ וַֽ֠/יַּעֲלֻ/הוּ אֶל נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל רִבְלָ֖תָ/ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יְדַבֵּ֥ר אִתּ֖/וֹ מִשְׁפָּטִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
translation:
  language: de
  text: Und das Heer der Chaldäer verfolgte sie und holte Zedekia in den Ebenen von Jericho ein. Sie ergriffen ihn und brachten ihn hinauf zu Nebukadnezar[a], dem König von Babel, nach Ribla im Land Hamat. Er fällte Urteile über ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Nebukadrezar“; im Haupttext steht die im Deutschen geläufigere Form „Nebukadnezar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: das Heer der Chaldäer
  rationale: חֵיל bezeichnet hier eine militärische Streitmacht; „Heer“ ist im Deutschen klar und würdevoll. „Chaldäer“ bewahrt die ethnisch-politische Bezeichnung des Ausgangstextes, statt sie kontextuell durch „Babylonier“ zu ersetzen.
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  choice: verfolgte sie
  rationale: רדף mit אַחֲרֵי bezeichnet die Verfolgung fliehender Personen. Die deutsche Form ist idiomatisch und entspricht dem militärischen Zusammenhang.
- source_word: וַיַּשִּׂגוּ
  choice: holte ... ein
  rationale: נשׂג bedeutet in diesem Zusammenhang, Flüchtende einzuholen. „holte ... ein“ ist im modernen Deutschen natürlicher als „erreichte“ und gibt den Verlauf der Verfolgung präzise wieder.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: in den Ebenen von Jericho
  rationale: עֲרָבוֹת bezeichnet die offenen Ebenen beziehungsweise Steppengebiete im Jordangraben. „Ebenen“ ist allgemein verständlich und vermeidet das im Deutschen stärker technisch oder klimatisch wirkende „Steppen“.
- source_word: וַיִּקְחוּ אֹתוֹ
  choice: Sie ergriffen ihn
  rationale: לקח bedeutet wörtlich „nehmen“, bezeichnet hier aber im militärischen Zusammenhang die gewaltsame Festnahme. „ergriffen“ bringt dies ohne unnötige Ausdeutung zum Ausdruck.
- source_word: וַיַּעֲלֻהוּ אֶל
  choice: brachten ihn hinauf zu
  rationale: Die Hifilform von עלה enthält eine Aufwärts- beziehungsweise Reiserichtung. „hinauf“ bewahrt diese Nuance, die bei einem bloßen „brachten ihn zu“ verloren ginge.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Im Haupttext steht die im Deutschen geläufige Namensform. Die dem hebräischen Konsonantenbestand dieser Stelle näherstehende Form „Nebukadrezar“ wird in einer Fußnote dokumentiert.
- source_word: רִבְלָתָה
  choice: nach Ribla
  rationale: Die hebräische Ortsbezeichnung mit direktionalem ה bezeichnet das Ziel der Bewegung. Daher ist nach dem Verb des Bringens „nach Ribla“ im Deutschen genauer und natürlicher als „bei Ribla“.
- source_word: בְּאֶרֶץ חֲמָת
  choice: im Land Hamat
  rationale: אֶרֶץ wird direkt mit „Land“ wiedergegeben; Hamat bleibt als geografische Bezeichnung erhalten.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  choice: Dort sprach er das Urteil über ihn
  rationale: Die Wendung lautet wörtlich ungefähr „er sprach Rechtssprüche mit/gegen ihn“, bezeichnet hier aber das gerichtliche Verhängen eines Urteils. „sprach das Urteil über ihn“ ist natürliches, gehobenes Deutsch und belässt Nebukadnezar als naheliegendes Subjekt. „Dort“ macht den Ortsbezug idiomatisch deutlich, ohne neue Sachinformation einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die koordinierte hebräische Satzfolge wird zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert. „Babel“ bewahrt die biblische Orts- und Reichsbezeichnung, während „Chaldäer“ den Ausgangstext eng abbildet.
