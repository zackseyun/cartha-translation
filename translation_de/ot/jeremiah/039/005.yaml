  terminology: „Heer der Chaldäer“, „Zedekia“, „Nebukadnezar“, „Babel“, „Ribla“ und „Hamat“ sind konsistent und im deutschen Bibelregister angemessen. Die Fußnote dokumentiert die hebräische Namensform nachvollziehbar.
