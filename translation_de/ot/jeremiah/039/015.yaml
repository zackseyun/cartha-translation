  text: וְ/אֶֽל יִרְמְיָ֖הוּ הָיָ֣ה דְבַר יְהוָ֑ה בִּֽ/הְיֹת֣/וֹ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/015.yaml
  text: The word of Yahweh had come to Jeremiah while he was confined in the court of the guard[a], saying,
translation:
  language: de
  text: 'Das Wort Jahwes war an Jeremia ergangen, während er im Wachhof festgehalten wurde:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶל יִרְמְיָהוּ
  choice: Und an Jeremia
  rationale: Die Wendung bewahrt sowohl den hebräischen Anschluss mit וְ als auch die durch אֶל bezeichnete Ausrichtung auf Jeremia. Die markierte Wortstellung passt zur würdevollen deutschen Erzählsprache.
- source_word: הָיָה דְבַר יְהוָה
  choice: war das Wort Jahwes ergangen
  rationale: Die deutsche prophetische Formel „das Wort … erging“ gibt הָיָה mit דְבַר idiomatisch und zugleich formnah wieder. Das Plusquamperfekt entspricht dem rückblickenden Erzählzusammenhang.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner verbreiteten wissenschaftlichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בִּ/הְיֹת/וֹ עָצוּר
  choice: als er … festgehalten wurde
  rationale: Die Infinitivkonstruktion bezeichnet den zeitlichen Umstand. „Festgehalten“ drückt Gewahrsam aus, ohne eine bestimmte Rechtsform der Haft vorauszusetzen.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  choice: im Wachhof
  rationale: חָצֵר bezeichnet einen Hof; מַטָּרָה meint hier den bewachten Gewahrsamsbereich. „Wachhof“ ist knapp und im Jeremiakontext verständlich.
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die in Vers 16 folgende direkte Rede im natürlichen Deutschen ein und erfüllt hier die Funktion des formelhaften „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ bewahrt ihn, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Prophetische Offenbarungsformel דְבַר יְהוָה הָיָה
  choice: das Wort Jahwes war ergangen
  alternative: die Botschaft Jahwes war gekommen
  rationale: „Wort“ erhält die traditionelle und theologisch gewichtige Offenbarungsformel; „ergangen“ ist dafür im Deutschen idiomatisch. Das Plusquamperfekt gibt die Vorzeitigkeit im erzählerischen Rückblick wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Anfangsstellung „Und an Jeremia“ hält den hebräischen Anschluss und die Zielrichtung sichtbar. Der Doppelpunkt vermeidet das im Deutschen schwerfällige „mit den Worten“ am Ende eines Satzes, dessen direkte Rede erst im Folgevers beginnt.
