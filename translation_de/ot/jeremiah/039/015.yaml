- from: 'Und an Jeremia war das Wort Jahwes ergangen, als er im Wachhof festgehalten wurde:'
  to: 'Das Wort Jahwes war an Jeremia ergangen, während er im Wachhof festgehalten wurde:'
  rationale: 'Die Revision glättet ausschließlich die deutsche Satzstellung und macht den fortdauernden zeitlichen Umstand deutlicher. Sie bewahrt die Vorzeitigkeit, die Adressierung an Jeremia, den Gottesnamen, den Gewahrsamsort und die offene Redeeinleitung. Gegenüber dem englischen Audit Trail besteht kein sachlicher Konflikt: „war … ergangen“ entspricht „had come“, und der Doppelpunkt erfüllt die Funktion von „saying“.'
