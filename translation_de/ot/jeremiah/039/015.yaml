    issue: Unnatürliche Voranstellung von „Und an Jeremia“
    rationale: 'Die Wortfolge ist im Deutschen nicht idiomatisch. Sie muss nicht beibehalten werden, um die Bedeutung von וְאֶל zu erhalten: Die Formel „Das Wort Jahwes war an Jeremia ergangen“ gibt die Adressierung präzise wieder und vermeidet einen fremdsprachlich wirkenden Satzanfang.'
  - severity: low
    issue: „als“ schwächt den durativen Umstand ab
    rationale: Die Konstruktion בִּהְיֹתוֹ עָצוּר bezeichnet Jeremias fortdauernden Zustand zur Zeit des Ergehens des Wortes. „Während er … festgehalten wurde“ bildet dies genauer und natürlich ab.
  revised_text: 'Das Wort Jahwes war an Jeremia ergangen, während er im Wachhof festgehalten wurde:'
