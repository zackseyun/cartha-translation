  text: בַּ/שָּׁנָ֣ה הַ֠/תְּשִׁעִית לְ/צִדְקִיָּ֨הוּ מֶלֶךְ יְהוּדָ֜ה בַּ/חֹ֣דֶשׁ הָ/עֲשִׂרִ֗י בָּ֠א נְבוּכַדְרֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֤ל וְ/כָל חֵיל/וֹ֙ אֶל יְר֣וּשָׁלִַ֔ם וַ/יָּצֻ֖רוּ עָלֶֽי/הָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
translation:
  language: de
  text: Im neunten Jahr Zedekias, des Königs von Juda, im zehnten Monat, kam Nebukadnezar[a], der König von Babylon, mit seinem ganzen Heer nach Jerusalem, und sie belagerten die Stadt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Nebukadrezar“; traditionell im Deutschen „Nebukadnezar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית לְצִדְקִיָּהוּ
  choice: Im neunten Regierungsjahr Zedekias
  rationale: Das Hebräische bezeichnet das neunte Jahr, auf Zedekia bezogen; „Regierungsjahr“ macht die übliche königliche Datierungsweise im Deutschen klar, ohne einen neuen Zeitbezug einzuführen.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die hebräische Statusangabe wird als deutsche Apposition wiedergegeben.
- source_word: בַּחֹדֶשׁ הָעֲשִׂרִי
  choice: im zehnten Monat
  rationale: Formnahe und natürliche Wiedergabe der zweiten Zeitangabe; ein Monatsname steht im Ausgangstext nicht.
- source_word: בָּא
  choice: kam
  rationale: Bewahrt die Grundbedeutung des Verbs בוא und legt die Art der militärischen Bewegung nicht näher fest.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im modernen deutschen Bibelgebrauch geläufige Namensform ist gut verständlich; die hebräische Schreibform dieser Stelle ist eine bekannte Namensvariante.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Natürliche Wiedergabe der hebräischen Statusangabe als Apposition.
- source_word: וְכָל חֵילוֹ
  choice: mit seinem ganzen Heer
  rationale: חַיִל bezeichnet hier die gesamte militärische Streitmacht; „mit“ drückt die im Kontext gemeinte Begleitung idiomatisch aus.
- source_word: אֶל יְרוּשָׁלִַם
  choice: nach Jerusalem
  rationale: Gibt die Zielrichtung von אֶל wieder; die feindliche Absicht wird erst durch das anschließende Belagern ausdrücklich.
- source_word: וַיָּצֻרוּ עָלֶיהָ
  choice: und sie belagerten die Stadt
  rationale: צור bezeichnet hier das Belagern. Das feminine Pronomen bezieht sich auf Jerusalem; „die Stadt“ vermeidet im Deutschen das missverständliche Neutrum „es“ und bleibt referenziell eindeutig.
theological_decisions: []
