    rationale: Der Text bietet נְבוּכַדְרֶאצַּר, entsprechend „Nebukadrezar“, während die deutsche Standardform „Nebukadnezar“ lautet. Die englische Auditspur dokumentiert diese Variante ebenfalls; eine deutsche Fußnote erhält die Transparenz.
  revised_text: Im neunten Jahr Zedekias, des Königs von Juda, im zehnten Monat, kam Nebukadnezar[a], der König von Babylon, mit seinem ganzen Heer nach Jerusalem, und sie belagerten die Stadt.
