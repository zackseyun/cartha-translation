    rationale: Die Datierungsformel lautet wörtlich „im neunten Jahr Zedekias“. Da der Königstitel folgt, ist ein Regierungsjahr sehr wahrscheinlich gemeint, aber die kürzere Form lässt den Wortlaut enger erkennen.
  - severity: low
