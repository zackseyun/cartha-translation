  register: Modernes, würdiges Standarddeutsch mit klarer historischer Datierung. Die Satzstruktur bleibt nahe am hebräischen Ablauf, wird aber durch Appositionen und die ausdrückliche Wiederaufnahme „die Stadt“ idiomatisch und eindeutig gestaltet.
