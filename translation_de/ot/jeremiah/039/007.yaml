  yaml_path: translation/ot/jeremiah/039/007.yaml
  text: He blinded Zedekiah’s eyes and bound him with bronze shackles to bring him to Babylon[a].
translation:
  language: de
  text: Er blendete Zedekias Augen und fesselte ihn mit bronzenen Fesseln[a], um ihn nach Babel zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit bronzenen Ketten« oder »mit bronzenen Fesseln«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי צִדְקִיָּהוּ עִוֵּר
  choice: ließ er Zedekia blenden
  rationale: Die deutsche Wendung gibt das konkrete Blenden Zedekias natürlich und präzise wieder; dass seine Augen betroffen waren, ist im Verb bereits enthalten.
- source_word: וַיַּאַסְרֵהוּ
  choice: legte ihn in … Fesseln
  rationale: אסר bezeichnet hier angesichts der folgenden Angabe des Fesselmaterials das körperliche Binden beziehungsweise Fesseln.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: in bronzene Fesseln
  rationale: Der Ausdruck bezeichnet aus Bronze gefertigte Haftfesseln. „Fesseln“ ist im heutigen Deutsch klar und lässt offen, ob Ketten oder Fußfesseln gemeint sind.
- source_word: לָבִיא אֹתוֹ
  choice: um ihn … zu bringen
  rationale: Der Infinitiv bezeichnet den Zweck der Fesselung; die deutsche Konstruktion mit „um … zu“ macht diese Beziehung eindeutig.
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Das direktive He bezeichnet die Bewegung auf Babel zu; bei Städtenamen ist „nach“ die natürliche deutsche Entsprechung.
