source:
  edition: WLC
  text: הָל֣וֹךְ וְ/אָמַרְתָּ֡ לְ/עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י לֵ/אמֹ֗ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֩ מבי אֶת דְּבָרַ֜/י אֶל הָ/עִ֥יר הַ/זֹּ֛את לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/הָי֥וּ לְ/פָנֶ֖י/ךָ בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
translation:
  language: de
  text: 'Geh und sage zu Ebed-Melech, dem Kuschiten[a]: »So spricht Jahwe der Heerscharen, der Gott Israels: Siehe, ich lasse meine Worte über diese Stadt kommen – zum Unheil und nicht zum Guten[b]. An jenem Tag werden sie sich vor deinen Augen erfüllen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dem Äthiopier«. Im Hebräischen steht »dem Kuschiten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zum Unglück und nicht zum Wohl«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ
  choice: Geh und sage
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aufforderung; die knappe deutsche Wendung gibt deren Nachdruck natürlich wieder.
- source_word: לְעֶבֶד מֶלֶךְ
  choice: zu Ebed-Melech
  rationale: Die Wortfolge bezeichnet hier einen Eigennamen und wird daher transliteriert, nicht als »Diener des Königs« übersetzt.
- source_word: הַכּוּשִׁי
  choice: dem Kuschiten
  rationale: »Kuschit« gibt das hebräische Ethnonym direkt wieder, ohne es vorschnell mit späteren geografischen Bezeichnungen gleichzusetzen.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige und würdige deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, weiterhin verständliche Form bewahrt die Weite des Titels, der himmlische wie irdische Mächte unter Gottes Befehl umfassen kann.
- source_word: הִנְנִי מֵבִיא
  choice: Siehe, ich lasse ... kommen
  rationale: »Siehe« wahrt die feierliche Unmittelbarkeit von הִנְנִי; die Kausativform von בוא wird mit »lassen ... kommen« quellennah wiedergegeben.
- source_word: אֶת דְּבָרַי אֶל הָעִיר הַזֹּאת
  choice: meine Worte über diese Stadt kommen
  rationale: Die Formulierung hält sowohl den Plural »Worte« als auch die gerichtete Bewegung von אֶל fest und vermeidet eine unnötige Festlegung auf »gegen« oder »auf«.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: zum Unheil und nicht zum Guten
  rationale: רָעָה bezeichnet im Gerichtszusammenhang Unheil bzw. Unglück, nicht notwendig moralisch Böses; zugleich bleibt der ausdrückliche Gegensatz zu »Gutem« erhalten.
- source_word: וְהָיוּ לְפָנֶיךָ בַּיּוֹם הַהוּא
  choice: An jenem Tag werden sie vor deinen Augen eintreffen
  rationale: Das wörtliche »werden vor dir sein« bezeichnet hier das sichtbare Wirklichwerden der angekündigten Worte. »Vor deinen Augen eintreffen« macht diesen Sinn verständlich, ohne die persönliche Zeugenschaft aufzugeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« wahrt ihn als persönlichen Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug und Erfüllung der göttlichen »Worte«
  choice: Die angekündigten Worte treffen vor Ebed-Melechs Augen ein
  alternative: Die Worte werden an jenem Tag lediglich »vor ihm sein«
  rationale: Die Aussage bewahrt den Plural und Ebed-Melechs Augenzeugenschaft, gibt הָיוּ im Zusammenhang der angekündigten Gerichtsereignisse jedoch idiomatisch als deren Eintreffen wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der etablierten prophetischen Formel »So spricht«. »Siehe« und »Heerscharen« sind bewusst leicht gehoben, aber allgemein verständlich. Der Satzbau bleibt nah am Hebräischen, ohne im Deutschen schwerfällig zu wirken.
