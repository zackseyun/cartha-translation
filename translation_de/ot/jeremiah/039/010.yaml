base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
translation:
  language: de
  text: Doch Nebusaradan, der Oberste der Leibwache, ließ einige von den Ärmsten des Volkes, die gar nichts besaßen, im Land Juda zurück. An jenem Tag gab er ihnen Weinberge und Felder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bedeutung des hebräischen Wortes ist unsicher; möglich sind auch „Zisternen“ oder „Keltern“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים
  choice: Doch … einige von den Ärmsten des Volkes
  rationale: 'מִן hat partitive Bedeutung: Nebusaradan ließ einen Teil dieser Bevölkerungsgruppe zurück. „Doch“ gibt den Kontrast zum vorausgehenden Geschehen wieder; „einige von den Ärmsten des Volkes“ ist im Deutschen natürlich und bewahrt den sozialen Sinn von דַּלִּים.'
- source_word: אֲשֶׁר אֵין לָהֶם מְאוּמָה
  choice: die gar nichts besaßen
  rationale: Die Wendung bezeichnet vollständige Besitzlosigkeit. „Gar nichts“ erhält die emphatische Kraft von מְאוּמָה, während „besaßen“ den gemeinten wirtschaftlichen Zustand idiomatisch ausdrückt.
- source_word: הִשְׁאִיר
  choice: ließ … zurück
  rationale: Der Hifil von שׁאר bedeutet hier, Menschen im Land zurückzulassen. Die deutsche Verbklammer verlangt die Trennung von „ließ“ und „zurück“.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird nach gebräuchlicher deutscher Bibelnamenkonvention wiedergegeben.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Der Ausdruck ist ein babylonischer Amtstitel. „Oberster der Leibwache“ gibt die Funktion verständlich wieder, ohne die wörtlich möglichen, aber im Kontext irreführenden Bezeichnungen „Schlächter“ oder „Henker“ in den Vordergrund zu stellen.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: Die Wiedergabe erhält den ausdrücklich territorialen Sinn von אֶרֶץ.
- source_word: כְּרָמִים
  choice: Weinberge
  rationale: Die übliche und eindeutige Bedeutung des hebräischen Nomens.
- source_word: וִיגֵבִים
  choice: Felder
  rationale: Das seltene und textlich schwierige Wort bezeichnet im Zusammenhang wahrscheinlich landwirtschaftlichen Grundbesitz. „Felder“ passt zur Zuteilung an die Besitzlosen; andere mögliche Deutungen werden in der Fußnote genannt.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche moderne Wiedergabe der üblichen hebräischen Zeitangabe.
