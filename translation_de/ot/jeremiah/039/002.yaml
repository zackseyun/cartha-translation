  text: בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֤ה שָׁנָה֙ לְ/צִדְקִיָּ֔הוּ בַּ/חֹ֥דֶשׁ הָ/רְבִיעִ֖י בְּ/תִשְׁעָ֣ה לַ/חֹ֑דֶשׁ הָבְקְעָ֖ה הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/002.yaml
  text: In the eleventh year of Zedekiah[a], in the fourth month, on the ninth day of the month, the city was breached.
translation:
  language: de
  text: Im elften Regierungsjahr Zedekias, im vierten Monat, am neunten Tag des Monats[a], wurde die Stadtmauer durchbrochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Neunten des Monats“.'
    reason: Die Ergänzung „Tag“ dient der natürlichen deutschen Datumsangabe, steht aber nicht ausdrücklich im Hebräischen.
lexical_decisions:
- source_word: בְּ/עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְ/צִדְקִיָּהוּ
  choice: im elften Regierungsjahr Zedekias
  rationale: Die Präposition בְּ leitet die Zeitangabe ein, und לְ bezeichnet den König, nach dessen Regierungszeit datiert wird. „Regierungsjahr“ macht den im Hebräischen vorausgesetzten Bezug im Deutschen klar.
- source_word: בַּ/חֹדֶשׁ הָ/רְבִיעִי
  choice: im vierten Monat
  rationale: Die Ordnungszahl des hebräischen Kalenders wird beibehalten und nicht in einen modernen Monatsnamen umgerechnet.
- source_word: בְּ/תִשְׁעָה לַ/חֹדֶשׁ
  choice: am neunten Tag des Monats
  rationale: Die hebräische Datumsformel nennt wörtlich den „Neunten des Monats“; „Tag“ wird für natürliches und eindeutiges Deutsch ergänzt.
- source_word: הָבְקְעָה הָ/עִיר
  choice: wurde die Stadtmauer durchbrochen
  rationale: Das Nifal von בקע bezeichnet hier das militärische Durchbrechen der Stadtbefestigung. Da „die Stadt wurde durchbrochen“ im Deutschen unnatürlich wäre, wird die im hebräischen Ausdruck metonymisch vorausgesetzte Stadtmauer ausdrücklich genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe chronologische Satzform des Hebräischen bleibt erhalten; „Regierungsjahr“ und „Stadtmauer“ verdeutlichen zwei im Ausgangstext kontextuell vorausgesetzte Bezüge.
