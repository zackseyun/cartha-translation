  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר רָ֠אָ/ם צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כֹ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַֽ֠/יִּבְרְחוּ וַ/יֵּצְא֨וּ לַ֤יְלָה מִן הָ/עִיר֙ דֶּ֚רֶךְ גַּ֣ן הַ/מֶּ֔לֶךְ בְּ/שַׁ֖עַר בֵּ֣ין הַ/חֹמֹתָ֑יִם וַ/יֵּצֵ֖א דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
translation:
  language: de
  text: Als Zedekia, der König von Juda, und alle Krieger sie sahen, flohen sie. Bei Nacht verließen sie die Stadt auf dem Weg beim Garten des Königs, durch das Tor zwischen den beiden Mauern. Und er[a] zog auf dem Weg zur Araba[b] hinaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier die Einzahl „er“, nachdem zuvor von mehreren Personen die Rede war. Manche Übersetzungen gleichen den Satz an und geben „sie“ wieder.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „der Tiefebene“ beziehungsweise „dem Jordantal“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָם
  choice: sie sahen
  rationale: Das Suffix der 3. Person Plural wird ausdrücklich mit „sie“ wiedergegeben und bezieht sich im Zusammenhang auf die zuvor genannten babylonischen Machthaber beziehungsweise Streitkräfte.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: Krieger
  rationale: „Krieger“ gibt den militärischen Sinn knapp und in verständlichem modernem Deutsch wieder, ohne den Ausdruck unnötig zu umschreiben.
- source_word: וַיִּבְרְחוּ
  choice: flohen sie
  rationale: „Fliehen“ ist die direkte und im erzählenden Zusammenhang natürliche Entsprechung von ברח.
- source_word: וַיֵּצְאוּ לַיְלָה
  choice: Bei Nacht verließen sie die Stadt
  rationale: Die Formulierung bewahrt die nächtliche Zeitangabe und gibt das Hinausgehen aus der Stadt in natürlichem Deutsch als „verließen“ wieder.
- source_word: דֶּרֶךְ גַּן הַמֶּלֶךְ
  choice: über den Garten des Königs
  rationale: דֶּרֶךְ bezeichnet hier die Route. „Über“ bringt zum Ausdruck, dass der Fluchtweg am beziehungsweise durch den Königsgarten entlangführte, ohne daraus ein Ziel zu machen.
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  choice: durch das Tor zwischen den beiden Mauern
  rationale: Die Bewegungsrichtung legt „durch das Tor“ nahe; der hebräische Dual wird mit „den beiden Mauern“ ausdrücklich bewahrt.
- source_word: וַיֵּצֵא
  choice: Dann zog er weiter
  rationale: Die masoretische Form ist Singular. Die Übersetzung erhält den auffälligen Wechsel vom Plural zum Singular, statt ihn stillschweigend anzugleichen.
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Der geografische Name wird als „Araba“ wiedergegeben, da hier wahrscheinlich die Senke des Jordangrabens gemeint ist und das allgemeinere „Ebene“ den Ortsbezug abschwächen würde.
