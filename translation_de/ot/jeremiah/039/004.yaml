  terminology: „Zedekia“, „König von Juda“, „Krieger“ und „Araba“ sind angemessen. Die Fußnote zur Singularform ist erforderlich und zutreffend. Die alternative geografische Erklärung kann beibehalten werden, wobei „Jordantal“ als mögliche Einordnung kenntlich bleibt.
