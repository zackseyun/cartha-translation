revisions:
- from: Als Zedekia, der König von Juda, und alle Krieger sie sahen, flohen sie. Bei Nacht verließen sie die Stadt über den Garten des Königs und durch das Tor zwischen den beiden Mauern. Dann zog er[a] in Richtung der Araba[b] weiter.
  to: Als Zedekia, der König von Juda, und alle Krieger sie sahen, flohen sie. Bei Nacht verließen sie die Stadt auf dem Weg beim Garten des Königs, durch das Tor zwischen den beiden Mauern. Und er[a] zog auf dem Weg zur Araba[b] hinaus.
  rationale: Die Revision ersetzt die ungenaue Wiedergabe „zog … weiter“ durch „zog … hinaus“, um das zweite hebräische Verb für das Hinausgehen abzubilden. Zugleich wird die Wegangabe beim Königsgarten so formuliert, dass sie keine im Hebräischen nicht ausdrücklich festgelegte Bewegungsroute durch den Garten behauptet. Der Singular im Schlusssatz und beide Fußnotenanker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:16:17Z'
