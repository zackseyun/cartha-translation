source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית הַ/מֶּ֨לֶךְ֙ וְ/אֶת בֵּ֣ית הָ/עָ֔ם שָׂרְפ֥וּ הַ/כַּשְׂדִּ֖ים בָּ/אֵ֑שׁ וְ/אֶת חֹמ֥וֹת יְרוּשָׁלִַ֖ם נָתָֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
translation:
  language: de
  text: Die Chaldäer[b] verbrannten das Haus des Königs[a] und die Häuser des Volkes mit Feuer und rissen die Mauern Jerusalems nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den Palast« statt »das Haus des Königs«.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Chaldäern« sind hier die babylonischen Streitkräfte gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: das Haus des Königs
  rationale: Die Wiedergabe bewahrt den hebräischen Ausdruck durchsichtig. Im königlichen Zusammenhang ist damit der Palast gemeint, doch »Palast« wäre bereits stärker auslegend.
- source_word: בֵּית הָעָם
  choice: die Häuser des Volkes
  rationale: Der Singular בֵּית kann vor dem Kollektivbegriff »Volk« distributiv verstanden werden. Der deutsche Plural bezeichnet hier natürlich die Wohnhäuser der Bevölkerung, ohne eine im Hebräischen nicht ausdrücklich enthaltene soziale Abstufung einzuführen.
- source_word: שָׂרְפוּ ... בָּאֵשׁ
  choice: verbrannten
  rationale: Das Verb bezeichnet das Verbrennen; der Zusatz »mit Feuer« benennt im Hebräischen das Mittel. Im Deutschen enthält »verbrannten« diesen Gedanken bereits vollständig, während »mit Feuer verbrannten« unnötig schwerfällig klänge.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Dies entspricht der konkreten hebräischen Bezeichnung. Eine Fußnote erläutert, dass hier die babylonischen Streitkräfte gemeint sind.
- source_word: חֹמוֹת יְרוּשָׁלִַם
  choice: die Mauern Jerusalems
  rationale: Die direkte Genitivverbindung gibt die hebräische Konstruktverbindung klar und natürlich wieder.
- source_word: נָתָצוּ
  choice: rissen ... nieder
  rationale: Das Verb bezeichnet das gezielte Niederreißen eines Bauwerks. »Niederreißen« ist anschaulich, gegenwärtig verständlich und weniger technisch als »demolieren«.
theological_decisions: []
translation_notes:
  register: Moderne, würdige deutsche Erzählsprache. Die semikolongetrennte Satzführung vermeidet eine schwerfällige Wiederholung und lässt zugleich beide Zerstörungshandlungen klar hervortreten. Die traditionelle Herkunftsbezeichnung »Chaldäer« bleibt erhalten und wird erläutert.
