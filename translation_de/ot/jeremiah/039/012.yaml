base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/012.yaml
  text: Take him, keep your eyes on him, and do him no harm; rather, do with him just as he speaks to you.
translation:
  language: de
  text: »Nimm ihn in deine Obhut, achte gut auf ihn und tu ihm nichts Böses. Tu vielmehr mit ihm genau so, wie er es dir sagt.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָחֶנּוּ
  choice: Nimm ihn in deine Obhut
  rationale: Das Verb bedeutet wörtlich »nimm ihn«; im Zusammenhang bezeichnet es die Übernahme persönlicher Fürsorge und Aufsicht.
- source_word: וְעֵינֶיךָ שִׂים עָלָיו
  choice: achte gut auf ihn
  rationale: Die wörtliche Wendung »richte deine Augen auf ihn« ist ein Idiom für aufmerksame Fürsorge beziehungsweise Bewachung.
- source_word: מְאוּמָה רָע
  choice: nichts Böses
  rationale: Gibt die umfassende Verneinung und das substantivisch gebrauchte Adjektiv knapp und idiomatisch wieder.
- source_word: כִּי אִם
  choice: vielmehr
  rationale: 'Markiert nach der Verneinung den positiven Gegensatz: Statt ihm Böses zu tun, soll der Angesprochene seinen Wünschen entsprechen.'
- source_word: כַּאֲשֶׁר יְדַבֵּר אֵלֶיךָ
  choice: worum er dich bittet
  rationale: Wörtlich »entsprechend dem, was er zu dir reden wird«; im gegebenen Anweisungskontext ist gemeint, dass seinen geäußerten Anliegen entsprochen werden soll.
theological_decisions: []
