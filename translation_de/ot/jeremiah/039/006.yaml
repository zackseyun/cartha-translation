  text: וַ/יִּשְׁחַט֩ מֶ֨לֶךְ בָּבֶ֜ל אֶת בְּנֵ֧י צִדְקִיָּ֛הוּ בְּ/רִבְלָ֖ה לְ/עֵינָ֑י/ו וְ/אֵת֙ כָּל חֹרֵ֣י יְהוּדָ֔ה שָׁחַ֖ט מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/006.yaml
  text: The king of Babylon slaughtered the sons of Zedekiah at Riblah before his eyes[a], and the king of Babylon slaughtered all the nobles of Judah.
translation:
  language: de
  text: Der König von Babel schlachtete die Söhne Zedekias in Ribla vor seinen Augen ab, und der König von Babel schlachtete alle Vornehmen Judas[a] ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Amtsträger Judas“.'
    reason: Lexikalische Alternative für חֹרֵי יְהוּדָה; das Wort kann hochgestellte Personen beziehungsweise führende Amtsträger bezeichnen.
lexical_decisions:
- source_word: וַיִּשְׁחַט / שָׁחַט
  choice: schlachtete … ab
  rationale: Das Verb bezeichnet ein Schlachten und lässt in diesem Hinrichtungskontext die brutale Gewalt deutlicher hervortreten als das allgemeinere „tötete“.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Die Genitivverbindung wird direkt wiedergegeben. Auch die Wiederholung am Versende bleibt entsprechend dem Hebräischen erhalten.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: die Söhne Zedekias
  rationale: „Söhne“ gibt die männliche Bezeichnung בְּנֵי in diesem Zusammenhang präzise wieder.
- source_word: בְּרִבְלָה
  choice: in Ribla
  rationale: Die Präposition בְּ bezeichnet hier den Ort des Geschehens; im Deutschen ist „in Ribla“ die natürliche Ortsangabe.
- source_word: לְעֵינָיו
  choice: vor seinen Augen
  rationale: Die hebräische Wendung besagt anschaulich, dass Zedekia die Tötung mit ansehen musste.
- source_word: כָּל
  choice: alle
  rationale: „Alle“ passt zur kollektiv bezeichneten Gruppe der Vornehmen Judas.
- source_word: חֹרֵי יְהוּדָה
  choice: die Vornehmen Judas
  rationale: חֹרִים bezeichnet hier hochgestellte Angehörige der gesellschaftlich-politischen Führung. „Vornehme“ wahrt diese soziale Bedeutung; „Amtsträger“ ist als mögliche, aber engere Deutung in der Fußnote genannt.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Die im modernen deutschen Bibelgebrauch übliche Form des Gebiets- und Volksnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „der König von Babel“ und die auffällige Voranstellung von „alle Vornehmen Judas“ im zweiten Satzteil spiegeln die hebräische Gestaltung; „schlachtete … ab“ bewahrt die Härte des Geschehens.
