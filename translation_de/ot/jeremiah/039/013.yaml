  text: וַ/יִּשְׁלַ֞ח נְבֽוּזַרְאֲדָ֣ן רַב טַבָּחִ֗ים וּ/נְבֽוּשַׁזְבָּ רַב סָרִ֔יס וְ/נֵרְגַ֥ל שַׂר אֶ֖צֶר רַב מָ֑ג וְ/כֹ֖ל רַבֵּ֥י מֶֽלֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
translation:
  language: de
  text: Da sandten[c] Nebusaradan, der Befehlshaber der Leibwache, Nebuschasban, der oberste Hofbeamte[a], Nergal-Sarezer, der Oberste der Magier[b], und alle hohen Beamten des Königs von Babylon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Titel kann auch mit „oberster Eunuch“ oder „oberster Amtsträger“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: „Oberster der Magier“ gibt einen babylonischen Hoftitel wieder; traditionell wird er bisweilen unübersetzt als „Rab-Mag“ übernommen.
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische lautet hier nur „sandten“ beziehungsweise „schickten“ und nennt nicht, wen oder was sie sandten; der folgende Vers führt die Handlung weiter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da schickten … Leute los
  rationale: Das Verb bedeutet schlicht „senden, schicken“, hat hier aber kein ausdrücklich genanntes Objekt; Vers 14 führt die eingeleitete Handlung weiter. „Leute loszuschicken“ gibt die Ellipse im Deutschen natürlich wieder, ohne den Zweck vorwegzunehmen.
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der Leibwache
  rationale: Der akkadisch geprägte Amtstitel bezeichnet den Leiter der königlichen Garde beziehungsweise Leibwache, nicht wörtlich einen für das Schlachten zuständigen Mann.
- source_word: רַב סָרִיס
  choice: oberster Hofbeamter
  rationale: סָרִיס kann sowohl einen Eunuchen als auch einen hohen Hofbeamten bezeichnen. Die gewählte Wiedergabe bezeichnet sicher die amtliche Stellung, ohne eine körperliche Eigenschaft als gewiss hinzustellen.
- source_word: נְבוּשַׁזְבָּ
  choice: Nebuschасban
  rationale: Der Personenname wird nach gebräuchlicher deutscher Form transliteriert.
- source_word: וְנֵרְגַל שַׂר אֶצֶר
  choice: Nergal-Sarezer
  rationale: Die Wortfolge ist ein babylonischer Personenname; die Form folgt einer im Deutschen verständlichen Transliteration.
- source_word: רַב מָג
  choice: Oberste der Magier
  rationale: Der babylonische Hoftitel wird sinngemäß wiedergegeben, statt unübersetzt als „Rab-Mag“ stehen zu bleiben.
- source_word: וְכֹל רַבֵּי מֶלֶךְ בָּבֶל
  choice: und alle übrigen hohen Beamten des Königs von Babylon
  rationale: רַבֵּי bezeichnet hier führende Amtsträger. „Übrigen“ verdeutlicht natürlich, dass die zuvor Genannten zu dieser Gruppe gehören.
theological_decisions: []
