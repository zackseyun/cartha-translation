  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֣ר נָפְל֣וּ עָלָ֔י/ו וְ/אֵ֛ת יֶ֥תֶר הָ/עָ֖ם הַ/נִּשְׁאָרִ֑ים הֶגְלָ֛ה נְבֽוּזַר אֲדָ֥ן רַב טַבָּחִ֖ים בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
translation:
  language: de
  text: Den Rest des Volkes, der in der Stadt übrig geblieben war, die Überläufer, die zu ihm übergelaufen waren[a], und den Rest des Volkes, der übrig geblieben war[b], führte Nebusaradan, der Befehlshaber der Leibwache[c], nach Babylon in die Verbannung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine Wendung mit „fallen“: „die zu ihm gefallen waren“. Im militärischen Zusammenhang bedeutet sie, zur gegnerischen Seite überzulaufen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen wird „der Rest des Volkes, der übrig geblieben war“ wiederholt. Diese Wiederholung ist im Text beibehalten.
    reason: lexical_alternative
  - marker: c
    text: Die Amtsbezeichnung hängt wörtlich mit „Oberster der Schlächter“ zusammen, bezeichnet hier aber einen hohen babylonischen Hof- und Militärbeamten, den Befehlshaber der königlichen Leibwache.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: den Rest des Volkes
  rationale: יֶתֶר bezeichnet das Übriggebliebene. „Den Rest des Volkes“ ist im Deutschen natürlich und bewahrt den kollektiven Sinn.
- source_word: הַנִּשְׁאָרִים
  choice: der übrig geblieben war
  rationale: Das Nifal-Partizip von שׁאר bezeichnet die Zurück- beziehungsweise Übriggebliebenen. Wegen des deutschen singularischen Bezugsworts „Rest“ steht der Relativsatz im Singular.
- source_word: בָּעִיר
  choice: in der Stadt
  rationale: Die einfache Ortsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  choice: die Überläufer, die zu ihm übergelaufen waren
  rationale: נפל על bezeichnet hier im militärisch-politischen Zusammenhang den Seitenwechsel zum Gegner. Die Wiederholung von נפל wird durch „Überläufer/übergelaufen“ erkennbar gehalten; das nicht ausdrücklich identifizierte „ihm“ bleibt erhalten.
- source_word: וְאֵת יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: und den Rest des Volkes, der übrig geblieben war
  rationale: Die im Hebräischen wiederholte Wendung wird nicht geglättet oder ausgelassen.
- source_word: הֶגְלָה
  choice: führte … in die Verbannung
  rationale: Das Hifil von גלה bezeichnet das erzwungene Wegführen ins Exil. Die Formulierung macht sowohl die Bewegung nach Babylon als auch den Verbannungscharakter deutlich.
- source_word: נְבוּזַר אֲדָן
  choice: Nebusaradan
  rationale: Der Personenname wird in der im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: רַב טַבָּחִים
  choice: der Befehlshaber der Leibwache
  rationale: Die feste babylonische Amtsbezeichnung wird funktionsgerecht wiedergegeben; eine wörtliche Übersetzung mit „Schlächter“ oder „Henker“ wäre im Deutschen irreführend.
- source_word: בָּבֶל
  choice: Babylon
  rationale: „Babylon“ ist die geläufige moderne deutsche Form des Ortsnamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Aufzählung und die auffällige Wiederholung des hebräischen Textes bleiben erhalten. „In die Verbannung führen“ ist verständlich, ohne den Vorgang mit moderner Verwaltungssprache als „Deportation“ zu bezeichnen.
