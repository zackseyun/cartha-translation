  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
translation:
  language: de
  text: Denn ich werde dich ganz gewiss retten[a], und du wirst nicht durch das Schwert fallen. Dein Leben wird dir als Beute bleiben[b], weil du mir vertraut hast, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wird die Verbform durch einen vorangestellten Infinitiv verstärkt: »Ich werde dich ganz gewiss retten.«'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Dein Leben wird dir zur Beute werden.« Das ist ein Bild aus dem Krieg: Er wird mit dem Leben davonkommen.'
    reason: cultural_note
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  choice: ich werde dich ganz gewiss retten
  rationale: Der vorangestellte Infinitivus absolutus verstärkt die finite Verbform. »Ganz gewiss« gibt diese nachdrückliche Zusage in natürlichem Deutsch wieder; »retten« bezeichnet hier die konkrete Befreiung aus Lebensgefahr.
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  choice: und du wirst nicht durch das Schwert fallen
  rationale: Die Wiedergabe bewahrt das hebräische Bild des Fallens im Kampf; »durch das Schwert« bezeichnet das gewaltsame Umkommen.
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  choice: Dein Leben wird dir als Beute bleiben
  rationale: Die Formulierung erhält das Kriegsbild der Beute und macht zugleich verständlich, dass dem Angesprochenen wenigstens sein Leben erhalten bleibt.
- source_word: נַפְשְׁךָ
  choice: dein Leben
  rationale: נֶפֶשׁ bezeichnet in diesem Zusammenhang das leibliche Leben des Bedrohten, nicht ausdrücklich eine vom Körper unterschiedene Seele.
- source_word: כִּי בָטַחְתָּ בִּי
  choice: weil du mir vertraut hast
  rationale: בטח bezeichnet vertrauensvolles Sichverlassen auf jemanden. Das deutsche Perfekt stellt das bereits erwiesene Vertrauen als Grund der Zusage dar.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: »Spricht« ist eine würdige und geläufige Wiedergabe der prophetischen Botenformel; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נֶפֶשׁ in der Beuteformel
  choice: Leben
  alternative: Seele
  rationale: Die kriegerische Situation und die parallele Zusage, nicht durch das Schwert zu fallen, zeigen, dass die Bewahrung des Lebens gemeint ist. Damit wird keine weitergehende anthropologische Aussage in den Text hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die nachdrückliche Rettungszusage und das kriegerische Beutebild bleiben erhalten; die ungewohnte hebräische Redewendung wird im Haupttext behutsam verständlich gemacht und in der Fußnote wörtlicher erläutert.
