id: JER.1.15
reference: Jeremiah 1:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
translation:
  language: de
  text: Denn siehe, ich rufe alle Sippen[a] der Königreiche des Nordens, spricht Jahwe. Sie werden kommen, und jeder wird seinen Thron am Eingang der Tore Jerusalems aufstellen[b], gegen alle ihre Mauern ringsum und gegen alle Städte Judas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Großfamilien der Königreiche des Nordens“. Das hebräische Wort kann Großfamilien, Sippen oder vergleichbare gesellschaftliche Gruppen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Dass jeder seinen Thron aufstellt, stellt bildhaft dar, wie eindringende Herrscher an Jerusalems Toren Plätze der Herrschaft und des Gerichts einnehmen.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הִנְנִי
  choice: 'Denn sieh: Ich'
  rationale: 'כִּי führt die Begründung der vorausgehenden Ankündigung ein; הִנְנִי lenkt nachdrücklich die Aufmerksamkeit auf Jahwes unmittelbar bevorstehendes Handeln. „Denn sieh: Ich“ bewahrt beides in natürlichem Deutsch.'
- source_word: קֹרֵא
  choice: rufe
  rationale: Das Partizip bezeichnet hier ein gegenwärtig einsetzendes bzw. unmittelbar bevorstehendes, autoritatives Herbeirufen. „Rufe“ bleibt näher am Grundverb als „lasse aufmarschieren“ und ist im Zusammenhang eindeutig.
- source_word: לְכָל מִשְׁפְּחוֹת מַמְלְכוֹת צָפוֹנָה
  choice: alle Sippen der Königreiche des Nordens
  rationale: מִשְׁפְּחוֹת bezeichnet verwandtschaftlich oder gesellschaftlich verbundene Großgruppen. „Sippen“ vermeidet den häuslichen Klang von „Familien“; der hebräische Plural „Königreiche“ bleibt erhalten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Bibeldeutsch wiedergegeben; der Gottesname selbst bleibt als „Jahwe“ erkennbar.
- source_word: וּבָאוּ
  choice: Sie werden kommen
  rationale: Im Zusammenhang kündigt die Verbform das künftige Eintreffen der herbeigerufenen Gruppen an.
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  choice: jeder wird seinen Thron … aufstellen
  rationale: אִישׁ ist distributiv gebraucht („jeder“). „Thron“ bewahrt das königliche und richterliche Bild, während „aufstellen“ das konkrete Positionieren wiedergibt.
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  choice: am Eingang der Tore Jerusalems
  rationale: Die Formulierung erhält sowohl פֶּתַח („Eingang“) als auch den Plural שַׁעֲרֵי („Tore“) und vermeidet eine unnötige Vereinfachung zu „am Stadttor“.
- source_word: וְעַל כָּל חוֹמֹתֶיהָ סָבִיב
  choice: gegen alle ihre Mauern ringsum
  rationale: עַל hat im militärischen Zusammenhang gegnerische Richtung; סָבִיב bezeichnet die umfassende Umzingelung. Die feminine Rückverweisung auf Jerusalem wird mit „ihre“ erhalten.
- source_word: וְעַל כָּל עָרֵי יְהוּדָה
  choice: gegen alle Städte Judas
  rationale: „Gegen“ setzt den militärisch-feindlichen Sinn von עַל fort; „Städte Judas“ gibt die hebräische Genitivverbindung knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung des Aufstellens der Throne
  choice: Das Bild bleibt als „seinen Thron … aufstellen“ im Haupttext erhalten und wird nur in der Fußnote erläutert.
  alternative: Die Herrscher werden Jerusalem belagern und richten.
  rationale: Der Ausgangstext verbindet königliche Autorität, Gericht und militärische Besetzung in einem Bild. Eine rein erklärende Übersetzung würde diese Mehrdeutigkeit vorschnell auflösen.
- issue: Distributives אִישׁ mit maskulinem Suffix
  choice: jeder wird seinen Thron
  alternative: alle werden ihre Throne
  rationale: Die singularische, distributive Form des Hebräischen wird bewahrt. Im Kontext sind die jeweiligen Herrscher oder Anführer der herbeigerufenen Gruppen im Blick.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Sprachführung. Der Doppelpunkt nach „sieh“ gibt den aufmerksamkeitslenkenden Charakter von הִנְנִי natürlich wieder. Die Bildsprache und die Reihung des hebräischen Textes bleiben erhalten, ohne die deutsche Syntax unnötig zu veralten.
