source:
  edition: WLC
  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
translation:
  language: de
  text: Sie werden gegen dich kämpfen, aber sie werden dich nicht überwältigen; denn ich bin bei dir, spricht Jahwe, um dich zu retten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Sie werden gegen dich kämpfen
  rationale: Das Nifal von לחם bezeichnet hier den Kampf gegen jemanden; אֶל gibt in dieser Verbindung die feindliche Ausrichtung an. Die deutsche Formulierung ist natürlich und wahrt die Stärke des Ausdrucks, ohne einen umfassenden Krieg vorauszusetzen.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: aber sie werden dich nicht überwältigen
  rationale: יכל mit ל drückt hier aus, dass die Gegner gegen Jeremia keinen Erfolg haben werden. „Nicht überwältigen“ gibt dies idiomatisch wieder und lässt zugleich offen, dass Jeremia dennoch Widerstand und Leid erfahren kann.
- source_word: כִּי אִתְּךָ אֲנִי
  choice: denn ich bin bei dir
  rationale: כִּי leitet die Begründung ein; die betonte Wortstellung אִתְּךָ אֲנִי ist als Zusage der göttlichen Gegenwart natürlich und würdig wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird mit der im Deutschen vertrauten, knappen Formel „spricht Jahwe“ wiedergegeben; der Gottesname wird als persönlicher Name wiedergegeben.
- source_word: לְהַצִּילֶךָ
  choice: um dich zu retten
  rationale: Der Hifil-Infinitiv von נצל bezeichnet das Herausreißen beziehungsweise Retten aus Gefahr. Die finale Wendung „um dich zu retten“ bewahrt die Zweckbeziehung und ist im heutigen Deutsch klar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite der Schutzzusage
  choice: sie werden dich nicht überwältigen
  alternative: sie werden nichts gegen dich ausrichten können
  rationale: Die Aussage verheißt, dass Jeremias Gegner letztlich keinen Erfolg gegen ihn haben. Sie besagt nicht, dass er keinen Kampf, keine Verletzung oder kein Leiden erfahren wird; diese Spannung bleibt erhalten.
- issue: Funktion von לְהַצִּילֶךָ
  choice: um dich zu retten
  alternative: und dich zu retten
  rationale: Das ל am Infinitiv kann hier die Absicht beziehungsweise den Zweck der göttlichen Gegenwart ausdrücken. Die finale Wiedergabe folgt der hebräischen Konstruktion, ohne die Art der Rettung näher festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Das Semikolon gliedert Verheißung und Begründung. Keine Fußnoten sind nötig, da die sachlich relevanten Bedeutungsnuancen im Haupttext gewahrt bleiben.
