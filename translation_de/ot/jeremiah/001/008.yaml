id: JER.1.8
reference: Jeremiah 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּירָ֖א מִ/פְּנֵי/הֶ֑ם כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הַצִּלֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/008.yaml
  text: Do not be afraid of them[a], for I am with you to deliver you[b], declares Yahweh.
translation:
  language: de
  text: Fürchte dich nicht vor ihnen[a], denn ich bin bei dir, um dich zu retten[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von ihrem Angesicht“ beziehungsweise „aus ihrer Gegenwart“; gemeint ist: „vor ihnen“ oder „ihretwegen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu befreien“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Fürchte dich nicht
  rationale: Die Negationspartikel אַל mit der Imperfekt-/Jussivform formuliert ein Verbot. „Fürchte dich nicht“ ist im Deutschen klar, würdevoll und idiomatisch.
- source_word: מִפְּנֵיהֶם
  choice: vor ihnen
  rationale: Wörtlich bezeichnet die Wendung ihre Gegenwart beziehungsweise ihr Angesicht. In Verbindung mit ירא wird das Gegenüber, vor dem man Angst hat, im Deutschen natürlich mit „vor“ ausgedrückt.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für das vorausgehende Verbot ein. „Denn“ bildet diesen Zusammenhang knapp und natürlich ab.
- source_word: אִתְּךָ אֲנִי
  choice: ich bin bei dir
  rationale: Die hebräische Wortstellung hebt Gottes persönliche Gegenwart hervor. Die deutsche Formulierung gibt die Zusage direkt und natürlich wieder.
- source_word: לְהַצִּילְךָ
  choice: um dich zu retten
  rationale: Das Hifil von נצל bezeichnet das Herausreißen aus einer Gefahr, also retten oder befreien. „Retten“ ist im unmittelbaren Zusammenhang natürlich, ohne die Art der Bedrohung unnötig einzuengen.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: Das Substantiv gehört zu einer feierlichen prophetischen Botenformel. „Ausspruch“ bewahrt ihren formelhaften Charakter besser als das schlichtere „sagt“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen, nicht einen Titel. „Jahwe“ gibt das Tetragramm in gebräuchlicher deutscher Form wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. Die Transliteration bewahrt den Unterschied zwischen Eigenname und Titel.
- issue: Bedeutungsumfang von לְהַצִּילְךָ
  choice: um dich zu retten
  alternative: um dich zu befreien
  rationale: Die Zusage betrifft Gottes schützendes Eingreifen in Jeremias Auftrag. „Retten“ lässt den genauen Charakter dieses Eingreifens offen und zwingt dem Vers weder eine ausschließlich körperliche noch eine spezifisch heilsgeschichtliche Bedeutung auf.
- issue: Funktion von נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  alternative: spricht Jahwe
  rationale: Die nominale Wiedergabe erhält die feierliche prophetische Formel des Hebräischen; die verbale Alternative wäre flüssiger, würde ihre Form jedoch stärker angleichen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die traditionelle Wendung „Fürchte dich nicht“ bleibt wegen ihrer Prägnanz und natürlichen Verständlichkeit erhalten. Der Gedankenstrich kennzeichnet die abschließende prophetische Formel, ohne dem Hebräischen ein zusätzliches Verb hinzuzufügen.
