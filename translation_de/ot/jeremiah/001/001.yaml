  source_fidelity: 'Der Text gibt die hebräische Überschrift vollständig und zutreffend wieder: דִּבְרֵי als »Die Worte«, die genealogische Angabe, die partitive Zugehörigkeit zu den Priestern sowie die Orts- und Gebietsangaben. Die knappe Fügung »eines der Priester in Anatot« gibt den Relativbezug von אֲשֶׁר בַּעֲנָתוֹת idiomatisch wieder, ohne über das Hebräische hinauszugehen.'
