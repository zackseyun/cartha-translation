id: JER.1.1
reference: Jeremiah 1:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: דִּבְרֵ֥י יִרְמְיָ֖הוּ בֶּן חִלְקִיָּ֑הוּ מִן הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת בְּ/אֶ֖רֶץ בִּנְיָמִֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/001.yaml
  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
translation:
  language: de
  text: Die Worte Jeremias, des Sohnes Hilkijas, eines der Priester in Anatot im Land Benjamin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Die Worte
  rationale: Der Status constructus im Plural dient als Buchüberschrift. »Die Worte« ist im Deutschen natürlich und bewahrt die semantische Weite von דָּבָר.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Die im Deutschen eingebürgerte biblische Namensform ist für gewöhnliche Leser klar und würdig, während sie den hebräischen Namen eindeutig wiedergibt.
- source_word: בֶּן חִלְקִיָּהוּ
  choice: des Sohnes Hilkijas
  rationale: Die Apposition mit Genitiv bildet die genealogische Angabe natürlich und präzise ab; »Hilkija« ist die geläufige deutsche Form des hebräischen Namens.
- source_word: מִן הַכֹּהֲנִים
  choice: eines der Priester
  rationale: מִן bezeichnet hier partitiv Jeremias Zugehörigkeit zur Gruppe der Priester.
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: in Anatot
  rationale: Die knappe deutsche Ortsangabe bezieht sich entsprechend dem hebräischen Relativsatz auf die Priester; ein zusätzliches »die waren« wäre unnötig schwerfällig.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: im Land Benjamin
  rationale: אֶרֶץ bezeichnet hier das Stammesgebiet; »Land Benjamin« bewahrt die traditionelle territoriale Formulierung ohne eine Besitzrelation zu erzwingen.
theological_decisions:
- issue: Bezug von »eines der Priester«
  choice: Jeremia wird als einer der in Anatot ansässigen Priester bezeichnet.
  alternative: Die Herkunftsangabe könnte weniger ausdrücklich nur eine Verbindung mit der Priestergruppe anzeigen.
  rationale: Die partitive Konstruktion מִן הַכֹּהֲנִים identifiziert Jeremia am natürlichsten als Mitglied dieser Gruppe; weitergehende Aussagen über sein Amt werden nicht ergänzt.
translation_notes:
  register: Moderne, würdige Standardsprache in der Form einer knappen Buchüberschrift. Die geläufigen deutschen Namensformen fördern Verständlichkeit; die hebräische Syntax bleibt in natürlicher deutscher Apposition erkennbar.
