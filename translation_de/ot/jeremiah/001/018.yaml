source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נְתַתִּ֣י/ךָ הַ/יּ֗וֹם לְ/עִ֨יר מִבְצָ֜ר וּ/לְ/עַמּ֥וּד בַּרְזֶ֛ל וּ/לְ/חֹמ֥וֹת נְחֹ֖שֶׁת עַל כָּל הָ/אָ֑רֶץ לְ/מַלְכֵ֤י יְהוּדָה֙ לְ/שָׂרֶ֔י/הָ לְ/כֹהֲנֶ֖י/הָ וּ/לְ/עַ֥ם הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
translation:
  language: de
  text: 'Und ich – sieh, ich habe dich heute zu einer befestigten Stadt gemacht, zu einer eisernen Säule und zu bronzenen Mauern gegen das ganze Land: gegen die Könige von Juda, seine Amtsträger, seine Priester und das Volk des Landes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das Volk des Landes“ kann je nach Zusammenhang die einfache Bevölkerung im Unterschied zu den führenden Gruppen bezeichnen; hier kann die Wendung auch umfassender die Bevölkerung des Landes meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Und ich
  rationale: Die Konjunktion mit dem selbstständigen Pronomen hebt den Sprecher hervor. „Und ich“ wahrt den hebräischen Fortgang, ohne den Zusammenhang ausdrücklich adversativ festzulegen.
- source_word: הִנֵּה
  choice: sieh
  rationale: „Sieh“ gibt die aufmerksamkeitslenkende und emphatische Kraft der Partikel in verständlichem, gehobenem Gegenwartsdeutsch wieder.
- source_word: נְתַתִּיךָ
  choice: ich habe dich … gemacht
  rationale: נתן bedeutet wörtlich „geben/setzen“, bezeichnet hier mit den durch לְ eingeleiteten Prädikatsausdrücken aber das Einsetzen beziehungsweise Machen zu etwas.
- source_word: הַיּוֹם
  choice: heute
  rationale: Bewahrt die zeitliche Unmittelbarkeit der Beauftragung.
- source_word: לְעִיר מִבְצָר
  choice: zu einer befestigten Stadt
  rationale: Das לְ kennzeichnet hier das Ergebnis beziehungsweise Prädikat nach נתן. Die Formulierung erhält das Bild einer widerstandsfähigen Stadt.
- source_word: וּלְעַמּוּד בַּרְזֶל
  choice: zu einer eisernen Säule
  rationale: Direkte und natürliche Wiedergabe des Bildes; die parallele Konstruktion mit „zu“ bleibt sichtbar.
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  choice: und zu bronzenen Mauern
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen; „bronzen“ entspricht hier dem Bild eines festen, widerstandsfähigen Metalls. Der Plural „Mauern“ wird erhalten.
- source_word: עַל כָּל הָאָרֶץ
  choice: gegen das ganze Land
  rationale: Im Konfliktzusammenhang bezeichnet עַל Widerstand beziehungsweise Gegenüberstellung. Die anschließende Aufzählung weist auf Juda als das gemeinte Land.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: gegen die Könige von Juda
  rationale: Das wiederholte „gegen“ verdeutlicht im Deutschen, dass die folgende Aufzählung die Gruppen innerhalb des Landes nennt, denen Jeremia standhalten soll.
- source_word: לְשָׂרֶיהָ
  choice: seine führenden Männer
  rationale: שָׂרִים bezeichnet leitende Amtsträger, Fürsten oder Machthaber. „Führende Männer“ ist verständlich und bewahrt den damaligen politischen und gesellschaftlichen Charakter der Gruppe.
- source_word: לְכֹהֲנֶיהָ
  choice: seine Priester
  rationale: Entspricht der üblichen und eindeutigen Bedeutung von כֹּהֲנִים.
- source_word: וּלְעַם הָאָרֶץ
  choice: und das Volk des Landes
  rationale: Die wörtliche Wendung bewahrt die mögliche Spannung zwischen der allgemeinen Bevölkerung und einer engeren gesellschaftlichen Bezeichnung; eine Fußnote erläutert die Bandbreite.
theological_decisions:
- issue: Reichweite von „das Land“
  choice: das ganze Land, im Zusammenhang auf Juda bezogen
  alternative: die ganze Erde
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die unmittelbar folgende Nennung der Könige Judas sowie seiner führenden Männer, Priester und Bevölkerung spricht hier für den nationalen Bezug, ohne die umfassende Gegnerschaft innerhalb Judas abzuschwächen.
- issue: Bildhafte Einsetzung Jeremias
  choice: „zu … gemacht“ als metaphorische Beauftragung
  alternative: wörtlicher „gesetzt“ oder „gegeben“
  rationale: Der Text beschreibt keine körperliche Verwandlung, sondern Gottes Einsetzung Jeremias zu standhafter Widerstandskraft. Die Bildspannung von Stadt, Säule und Mauern bleibt vollständig erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. „Sieh“ ist bewusst leicht gehoben, aber allgemein verständlich. Die Reihung „zu einer …, zu einer … und zu …“ bildet die hebräische Parallelität ab; der Doppelpunkt gliedert die nähere Bestimmung der Gegner.
