id: JER.1.14
reference: Jeremiah 1:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י מִ/צָּפוֹן֙ תִּפָּתַ֣ח הָ/רָעָ֔ה עַ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: »Vom Norden her wird das Unheil[a] über alle Bewohner des Landes[b] hereinbrechen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Unglück“. Wörtlicher: „wird das Böse geöffnet werden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Mit „dem Land“ ist hier wahrscheinlich das Land Juda gemeint; möglich ist auch: „der Erde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das vorangestellte וַ führt die Erzählung fort; „Und … sagte“ bildet diese Abfolge in natürlichem Deutsch ab.
- source_word: אֵלָי
  choice: zu mir
  rationale: Direkte und idiomatische Wiedergabe der Präposition mit dem Suffix der ersten Person Singular.
- source_word: מִצָּפוֹן
  choice: Vom Norden her
  rationale: Gibt sowohl die nördliche Richtung als auch den Ausgangspunkt des angekündigten Unheils klar wieder.
- source_word: תִּפָּתַח
  choice: wird … hereinbrechen
  rationale: Die Nifal-Form bedeutet wörtlich „wird geöffnet werden“. Zusammen mit הָרָעָה bezeichnet sie hier bildhaft das Losbrechen beziehungsweise Hereinbrechen des angekündigten Unheils. Die deutsche Formulierung bewahrt die Bildkraft, ohne unnatürlich zu klingen.
- source_word: הָרָעָה
  choice: das Unheil
  rationale: רָעָה kann moralisch Böses oder erfahrbares Unglück bezeichnen. Im Zusammenhang der angekündigten Heimsuchung ist „Unheil“ treffend und lässt den Charakter sowie den Umfang des Geschehens offen.
- source_word: עַל
  choice: über
  rationale: „Über“ bewahrt die räumlich-bildhafte Aussage der hebräischen Präposition und passt idiomatisch zu „hereinbrechen“.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: alle Bewohner des Landes
  rationale: Die Wendung bezeichnet alle, die in dem betreffenden Land wohnen. Der unmittelbare Zusammenhang legt Juda nahe, während „Land“ die lexikalisch mögliche Weite des Ausdrucks wahrt.
theological_decisions:
- issue: Bedeutung von הָרָעָה im angekündigten Gericht
  choice: „das Unheil“
  alternative: „das Böse“ oder „das Unglück“
  rationale: Der Kontext spricht von einer hereinbrechenden Heimsuchung. „Unheil“ bezeichnet deren verheerende Wirkung, ohne aus dem Wort eine Aussage über die Urheberschaft moralischen Bösen abzuleiten.
- issue: Bezugsbereich von הָאָרֶץ
  choice: „das Land“, wahrscheinlich Juda
  alternative: „die Erde“
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Die angekündigte Gefahr aus dem Norden und der Zusammenhang des Jeremiabuchs sprechen hier für das Land Juda; die Übersetzung nennt Juda jedoch nicht ausdrücklich, da es im Vers selbst nicht genannt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem prophetischem Ton. „Hereinbrechen“ gibt die ungewöhnliche hebräische Verbindung von „geöffnet werden“ und „Unheil“ idiomatisch wieder; die wörtlichere Form bleibt in der Fußnote sichtbar.
