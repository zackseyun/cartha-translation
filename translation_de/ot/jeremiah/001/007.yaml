source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
translation:
  language: de
  text: 'Doch Jahwe sagte zu mir: „Sag nicht: ‚Ich bin jung[a].‘ Denn zu allen, zu denen ich dich sende[b], sollst du gehen, und alles, was ich dir gebiete, sollst du sagen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann bezeichnen; hier kann auch mangelnde Erfahrung mitschwingen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wohin auch immer ich dich sende“. Die hebräische Wendung kann allgemein jedes Ziel oder jeden Auftrag bezeichnen, zu dem Jahwe Jeremia sendet.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Doch … sagte
  rationale: אמר wird in erzählender Rede idiomatisch mit „sagte“ wiedergegeben. „Doch“ macht den sachlichen Gegensatz zu Jeremias Einwand im vorherigen Vers deutlich, ohne den Inhalt zu erweitern.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die gebräuchliche deutsche Wiedergabe des im hebräischen Text stehenden Gottesnamens bewahrt dessen Charakter als Eigenname.
- source_word: אַל תֹּאמַר
  choice: Sag nicht
  rationale: אַל mit der Verbform drückt hier ein Verbot aus. „Sag nicht“ ist unmittelbar, natürlich und dem direkten Redestil angemessen.
- source_word: נַעַר אָנֹכִי
  choice: Ich bin noch jung
  rationale: נַעַר bezeichnet je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann und kann zugleich mangelnde Erfahrung anklingen lassen. „Ich bin noch jung“ lässt das genaue Alter offen und klingt im modernen Deutschen natürlich.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet die Begründung für Gottes Zurückweisung des Einwands ein.
- source_word: עַל כָּל אֲשֶׁר אֶשְׁלָחֲךָ
  choice: zu allen, zu denen ich dich sende
  rationale: Die Formulierung bewahrt den möglichen Personenbezug und die umfassende Aussage des Hebräischen. Die ebenfalls mögliche allgemeinere Deutung als Ziel oder Auftrag wird in einer Fußnote genannt.
- source_word: תֵּלֵךְ
  choice: sollst du gehen
  rationale: Die Verbform hat im Zusammenhang der göttlichen Beauftragung verpflichtenden Zukunftssinn. „Sollst“ gibt diese Autorität im Deutschen klar wieder.
- source_word: וְאֵת כָּל אֲשֶׁר אֲצַוְּךָ
  choice: und alles, was ich dir gebiete
  rationale: „Alles“ erhält den umfassenden Sinn von כָּל; „gebieten“ gibt die verbindliche Kraft von צוה wieder und passt zum würdevollen Register.
- source_word: תְּדַבֵּר
  choice: sollst du sagen
  rationale: Im Deutschen verbindet sich der angekündigte Inhalt „alles, was …“ natürlich mit „sagen“. Die Formulierung steht parallel zu „sollst du gehen“ und bewahrt den verpflichtenden Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält das Tetragramm als Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite des göttlichen Auftrags
  choice: zu allen, zu denen ich dich sende
  alternative: wohin auch immer ich dich sende
  rationale: Die Hauptübersetzung lässt den möglichen Bezug auf die Menschen erkennen, zu denen Jeremia gesandt wird. Da die hebräische Wendung auch allgemeiner auf Ziele oder Aufträge bezogen werden kann, bleibt diese Möglichkeit in der Fußnote ausdrücklich erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt knapp und nachdrücklich; die parallelen Formulierungen „sollst du gehen“ und „sollst du sagen“ bilden den verpflichtenden Charakter der Beauftragung ab.
