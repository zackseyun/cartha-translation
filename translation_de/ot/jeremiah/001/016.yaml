  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
translation:
  language: de
  text: Und ich werde meine Urteile gegen sie verkünden wegen all ihrer Bosheit, weil sie mich verlassen, anderen Göttern Räucheropfer dargebracht und sich vor den Werken ihrer eigenen Hände[b] niedergeworfen haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich werde meine Urteile gegen sie wegen all ihrer Bosheit aussprechen.“ Das hebräische Verb bedeutet wörtlich „reden“ bzw. „sprechen“, hat hier im gerichtlichen Zusammenhang aber wahrscheinlich den Sinn einer förmlichen Urteilsverkündung.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Werken ihrer eigenen Hände“ sind Götzenbilder gemeint, die sie selbst angefertigt haben.
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי מִשְׁפָּטַי אוֹתָם
  choice: Und ich werde ihnen … meine Urteile verkünden
  rationale: דבר bedeutet wörtlich „reden“, bezeichnet zusammen mit משפט hier jedoch die förmliche Verkündung göttlicher Gerichtsurteile. „Ihnen … verkünden“ gibt אוֹתָם in natürlichem Deutsch als Bezug auf die Betroffenen wieder.
- source_word: עַל כָּל רָעָתָם
  choice: wegen all ihrer Bosheit
  rationale: עַל bezeichnet hier den Grund des Gerichts. „Bosheit“ bewahrt die umfassende moralische Bedeutung von רָעָה, ohne die einzelnen Vergehen vorwegzunehmen.
- source_word: אֲשֶׁר עֲזָבוּנִי
  choice: Sie haben mich verlassen
  rationale: אֲשֶׁר leitet hier die nähere Entfaltung der Bosheit und damit den Anklagegrund ein. Der Doppelpunkt bildet diesen Zusammenhang natürlicher ab als ein schwerfälliges „insofern als“.
- source_word: וַיְקַטְּרוּ לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern Räucheropfer dargebracht
  rationale: Das Piel von קטר bezeichnet im kultischen Zusammenhang das Verbrennen von Räucherwerk beziehungsweise Rauchopfern. „Räucheropfer dargebracht“ ist im Deutschen klar und kultisch präzise.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sich … niedergeworfen
  rationale: Die Form bezeichnet körperliches Niederwerfen, das hier als Verehrung gilt. Die konkrete Handlung bleibt erhalten, statt sie nur mit „angebetet“ zusammenzufassen.
- source_word: לְמַעֲשֵׂי יְדֵיהֶם
  choice: vor den Werken ihrer eigenen Hände
  rationale: 'Die bildhafte Mehrzahl des Hebräischen bleibt gewahrt. „Eigenen“ verdeutlicht die prophetische Ironie: Sie verehren, was sie selbst hergestellt haben.'
theological_decisions:
- issue: Art des göttlichen Handelns in וְדִבַּרְתִּי מִשְׁפָּטַי
  choice: Gott verkündet förmlich seine Urteile über die Angesprochenen.
  alternative: Gott spricht lediglich mit ihnen über seine Rechtsordnungen oder vollstreckt Gericht, ohne dass die Verkündung betont wird.
  rationale: Die Verbindung von דבר und משפט im prophetisch-juristischen Kontext weist auf die Verkündung von Gerichtsurteilen. Die Formulierung wahrt den gerichtlichen Charakter, ohne die Aussage mit späteren Lehrbegriffen anzureichern.
- issue: Darstellung des Götzendienstes
  choice: 'Die drei konkreten Vergehen bleiben einzeln genannt: Gott verlassen, anderen Göttern Räucheropfer darbringen und sich vor selbst gefertigten Werken niederwerfen.'
  alternative: Die Handlungen verallgemeinernd als „Götzen verehren“ zusammenfassen.
  rationale: Der hebräische Text entfaltet die Anklage in konkreten Handlungen. Ihre getrennte Wiedergabe erhält sowohl die Bundesuntreue als auch die Ironie der Verehrung selbst gemachter Gegenstände.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die juristische Sprache von „Urteile verkünden“ und die konkreten kultischen Handlungen bleiben erhalten. Der Satz wird durch einen Doppelpunkt gegliedert, damit der Anklagegrund klar und natürlich lesbar ist.
