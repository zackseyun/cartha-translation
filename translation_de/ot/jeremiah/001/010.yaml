id: JER.1.10
reference: Jeremiah 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
translation:
  language: de
  text: Sieh, heute habe ich dich über die Völker und über die Königreiche eingesetzt[a], um auszureißen und niederzureißen, zu vernichten und abzubrechen[b], aufzubauen und einzupflanzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Einsetzung „über“ Völker und Königreiche bezeichnet Jeremias prophetischen Auftrag in Bezug auf sie, nicht eine unmittelbare politische Herrschaft. Möglich ist daher auch: „im Blick auf die Völker und die Königreiche eingesetzt“.'
    reason: cultural_note
  - marker: b
    text: Für „abzubrechen“ ist auch „einzureißen“ oder „zu zerstören“ möglich. Das hebräische Verb wird besonders vom Zerstören beziehungsweise Einreißen von Bauwerken gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Sieh
  rationale: Der Imperativ von ראה dient hier als unmittelbarer Aufmerksamkeitsruf. „Sieh“ ist knapp, würdevoll und bewahrt die direkte Anrede, ohne das altertümlichere „Siehe“ zu verlangen.
- source_word: הִפְקַדְתִּיךָ
  choice: habe ich dich … eingesetzt
  rationale: Der Hifil von פקד bezeichnet hier die Beauftragung beziehungsweise Einsetzung Jeremias. Das Perfekt wird als vollzogene göttliche Einsetzung wiedergegeben.
- source_word: הַיּוֹם הַזֶּה
  choice: heute
  rationale: Die wörtlich stärker markierte Wendung „diesen Tag“ entspricht im modernen Deutschen idiomatisch „heute“ und bewahrt die Unmittelbarkeit der Berufung.
- source_word: עַל הַגּוֹיִם וְעַל הַמַּמְלָכוֹת
  choice: über die Völker und über die Königreiche
  rationale: עַל bezeichnet mit פקד am ehesten den Bereich des erteilten Auftrags. „Über“ erhält diese Aussage, ohne die Art der Autorität im Haupttext vorschnell als bloß politisch oder ausschließlich adversativ festzulegen.
- source_word: לִנְתוֹשׁ
  choice: auszureißen
  rationale: Das Verb bezeichnet das Herausreißen, besonders von Pflanzen samt Wurzel, und bildet so den bildlichen Gegenpol zum abschließenden „einzupflanzen“.
- source_word: לִנְתוֹץ
  choice: niederzureißen
  rationale: נתץ bezeichnet das Niederreißen oder Zerbrechen von Bauwerken. „Niederreißen“ ist im Deutschen anschaulich und bleibt vom folgenden Vernichtungsverb unterscheidbar.
- source_word: וּלְהַאֲבִיד
  choice: zu vernichten
  rationale: Der Hifil von אבד hat kausative Bedeutung („zugrunde gehen lassen“). „Vernichten“ gibt dies in der Reihe der Gerichtsverben knapp und natürlich wieder.
- source_word: וְלַהֲרוֹס
  choice: abzubrechen
  rationale: הרס bezeichnet das Einreißen oder Zerstören eines Bauwerks. „Abbrechen“ bewahrt das bauliche Bild und unterscheidet das Verb soweit möglich von נתץ.
- source_word: לִבְנוֹת
  choice: aufzubauen
  rationale: Das Verb wird bildhaft und zugleich unmittelbar mit „aufbauen“ wiedergegeben; es eröffnet den Umschlag von Gericht zu Wiederherstellung.
- source_word: וְלִנְטוֹעַ
  choice: einzupflanzen
  rationale: Die wörtliche Pflanzenmetapher wird erhalten und steht in bewusster Entsprechung zu „ausreißen“.
theological_decisions:
- issue: Art von Jeremias Stellung über Völkern und Königreichen
  choice: Die Formulierung „über die Völker und über die Königreiche eingesetzt“ wird beibehalten und durch eine Fußnote als prophetischer Auftrag erläutert.
  alternative: „im Blick auf die Völker und die Königreiche eingesetzt“ oder „gegen die Völker und die Königreiche bestellt“
  rationale: עַל mit פקד kann einen anvertrauten Zuständigkeitsbereich bezeichnen. Die folgenden Infinitive zeigen, dass Jeremia diesen Auftrag durch Gottes prophetisches Wort über Gericht und Wiederherstellung ausübt; eine unmittelbare politische Herrschaft wird nicht behauptet.
- issue: Spannung zwischen Gericht und Wiederherstellung
  choice: Alle vier zerstörenden und beide wiederherstellenden Verben werden in ihrer Reihenfolge und Bildlichkeit bewahrt.
  alternative: Die Verben zu allgemeineren Aussagen über Gericht und Heil zusammenzufassen
  rationale: Die auffällige Häufung der Verben und der abschließende Wechsel zu „aufbauen“ und „einpflanzen“ gehören zur theologischen und rhetorischen Spannung des hebräischen Textes und dürfen nicht geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sechs Infinitive bleiben als rhythmische Reihe erhalten; die vier Gerichtsverben werden nicht zusammengezogen. „Sieh“ vermeidet sowohl umgangssprachliches „Schau“ als auch das stärker archaische „Siehe“.
