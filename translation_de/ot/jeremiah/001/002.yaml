  text: אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֣לֶךְ יְהוּדָ֑ה בִּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה לְ/מָלְכֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/002.yaml
  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: de
  text: Zu dem das Wort Jahwes erging in den Tagen Joschijas, des Sohnes Amons, des Königs von Juda, im dreizehnten Jahr seiner Regierung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר ... אֵלָיו
  choice: zu dem
  rationale: Der Relativsatz bezieht sich auf Jeremia in Vers 1. „Zu dem“ gibt die Verbindung von אֲשֶׁר und אֵלָיו im Deutschen natürlich und richtungsgetreu wieder.
- source_word: הָיָה דְבַר יְהוָה אֵלָיו
  choice: das Wort Jahwes erging
  rationale: Die feste prophetische Formel wird im Deutschen idiomatisch mit „das Wort … erging“ wiedergegeben; so bleiben sowohl דָּבָר als „Wort“ als auch der Offenbarungscharakter der Aussage erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: בִּימֵי יֹאשִׁיָּהוּ
  choice: als Joschija … König von Juda war
  rationale: Die hebräische Zeitangabe „in den Tagen Joschijas“ wird in natürliches modernes Deutsch übertragen; der folgende Königstitel macht den zeitlichen Sinn eindeutig.
- source_word: יֹאשִׁיָּהוּ בֶן אָמוֹן
  choice: Joschija, der Sohn Amons
  rationale: Verwendet die im Deutschen gebräuchlichen biblischen Namensformen und gibt die Abstammungsangabe klar wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Direkte und idiomatische Wiedergabe von Titel und Herrschaftsgebiet.
- source_word: בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  choice: im dreizehnten Jahr seiner Herrschaft
  rationale: Gibt die Datierung nach dem Regierungsjahr präzise und in geläufigem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Eigenname-Charakter und entspricht der üblichen deutschen Transkription.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Relativsatz bewusst an Vers 1 angeschlossen. „Und zwar“ verdeutlicht, dass das dreizehnte Regierungsjahr die allgemeinere Zeitangabe präzisiert, ohne zusätzliche Sachinformation einzuführen.
