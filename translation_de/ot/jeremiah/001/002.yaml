  - severity: low
    issue: „und zwar“ ergänzt eine explizierende Diskursmarkierung.
    rationale: Das dreizehnte Jahr steht im Hebräischen schlicht als weitere Datierung neben der Angabe „in den Tagen“. Eine unmarkierte appositionale Zeitangabe ist quellentreuer.
  revised_text: Zu dem das Wort Jahwes erging in den Tagen Joschijas, des Sohnes Amons, des Königs von Juda, im dreizehnten Jahr seiner Regierung.
