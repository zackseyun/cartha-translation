  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהֹוִ֔ה הִנֵּ֥ה לֹא יָדַ֖עְתִּי דַּבֵּ֑ר כִּי נַ֖עַר אָנֹֽכִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
translation:
  language: de
  text: 'Da sagte ich: »Ach, Herr Yahweh![a] Sieh doch, ich weiß nicht, wie ich reden soll,[b] denn ich bin noch jung.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: אֲדֹנָי יְהוִה (Adonaj JHWH), eine Verbindung von Titel und Gottesnamen; auch „Herr, HERR“ nach traditioneller Ersatzschreibung.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „Ich weiß nicht zu reden.“ Gemeint sein kann fehlende Fähigkeit oder Erfahrung im Reden.'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Wort נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da sagte ich“ gibt die zeitliche Abfolge natürlich wieder, ohne dem schlichten Verb zusätzliche Bedeutung aufzuerlegen.
- source_word: אֲהָהּ
  choice: Ach
  rationale: Der Ausruf bringt Bestürzung oder Einwand zum Ausdruck. „Ach“ ist im Deutschen natürlich und passt zu Jeremias zögernder Reaktion.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Die Wiedergabe bildet sowohl אֲדֹנָי („Herr“) als auch den Gottesnamen יהוה („Yahweh“) ab und vermeidet die unnatürliche Verdoppelung „Herr HERR“.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Die hinweisende Partikel lenkt nachdrücklich die Aufmerksamkeit auf Jeremias Einwand. „Sieh doch“ bewahrt diesen auffordernden Ton in natürlichem Deutsch.
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  choice: ich weiß nicht zu reden
  rationale: Die hebräische Wendung lautet wörtlich etwa „ich weiß nicht reden“ und bezeichnet fehlende Fähigkeit oder Erfahrung. Die gewählte Form bleibt nahe am Wortlaut, ohne völlige Sprachunfähigkeit festzulegen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für Jeremias Einwand ein.
- source_word: נַעַר
  choice: noch jung
  rationale: נַעַר kann je nach Zusammenhang einen Jungen, Jugendlichen oder jungen Mann bezeichnen. Die adjektivische Wiedergabe bewahrt diese Altersspanne besser als eine engere deutsche Personenbezeichnung.
- source_word: אָנֹכִי
  choice: ich bin
  rationale: Das selbstständige Pronomen hebt Jeremia hervor; im Deutschen wird dies in der Prädikatskonstruktion natürlich mit „ich bin“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Herr HERR / Herr, der HERR
  rationale: Der Ausgangstext enthält neben dem Titel אֲדֹנָי ausdrücklich das Tetragramm יהוה. „Herr Yahweh“ macht beide Bestandteile sichtbar, während die traditionelle Ersatzlesung „Herr HERR“ den Eigennamen verhüllt.
- issue: Art von Jeremias Unvermögen zu reden
  choice: Keine nähere Festlegung über „ich weiß nicht zu reden“ hinaus
  alternative: Ich bin kein guter Redner / ich kann nicht öffentlich reden
  rationale: Der Satz kann mangelnde Erfahrung oder Befähigung ausdrücken, bezeichnet aber nicht eindeutig ein rhetorisches Defizit oder eine bestimmte Form öffentlichen Redens. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht gehobenem Klang. „Ach“ und „Sieh doch“ erhalten die Eindringlichkeit des Einwands; die Formulierung vermeidet sowohl archaisches Deutsch als auch umgangssprachliche Glättung.
