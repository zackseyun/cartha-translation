  source_fidelity: Die zeitliche Abfolge wird grundsätzlich richtig wiedergegeben. „Und es erging weiter“ ist jedoch im Deutschen keine natürliche Wiedergabe von וַיְהִי und legt die aus Vers 2 erschlossene Fortdauer stärker fest, als der elliptische hebräische Wortlaut verlangt. „Und es geschah“ bildet die hebräische Einleitung idiomatisch und ohne zusätzliche Festlegung ab. Die Umformung zu „als die Stadt fiel“ in der Anmerkung geht über den Wortlaut hinaus und ist zudem zeitlich problematisch.
  naturalness: „Es erging weiter“ klingt ohne ein ausdrücklich genanntes Subjekt im modernen Standarddeutsch unidiomatisch. Die revidierte Fassung wahrt die feierliche, knappe Satzführung und ist zugleich gut verständlich.
  terminology: Die etablierten deutschen Namensformen Jojakim, Josia und Zedekia sind passend. „Wegführung Jerusalems“ gibt die metonymische Wendung גְּלוֹת יְרוּשָׁלִַם nahe wieder; die Anmerkung erläutert die Metonymie, ohne ein im Vers nicht genanntes Detail hinzuzufügen.
