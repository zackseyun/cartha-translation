  - severity: medium
    issue: Die Fußnote fügt den Stadtfall hinzu.
    rationale: Der hebräische Vers nennt die Wegführung/Verbannung Jerusalems im fünften Monat, nicht den Fall der Stadt. Die historische Präzisierung ist für die Übersetzung nicht nötig und kann eine nicht im Text enthaltene zeitliche Gleichsetzung nahelegen.
