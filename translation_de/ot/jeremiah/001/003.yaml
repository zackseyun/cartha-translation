  text: וַ/יְהִ֗י בִּ/ימֵ֨י יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַד תֹּם֙ עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/צִדְקִיָּ֥הוּ בֶן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה עַד גְּל֥וֹת יְרוּשָׁלִַ֖ם בַּ/חֹ֥דֶשׁ הַ/חֲמִישִֽׁי־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
translation:
  language: de
  text: Und es geschah in den Tagen Jojakims, des Sohnes Josias, des Königs von Juda, bis zum Ende des elften Jahres Zedekias, des Sohnes Josias, des Königs von Juda, bis zur Wegführung Jerusalems[a] im fünften Monat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jerusalem“ bezeichnet hier metonymisch seine Bevölkerung; gemeint ist ihre Wegführung in die Verbannung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es erging weiter
  rationale: Die Wendung knüpft an das in Vers 2 genannte Ergehen des Wortes des HERRN an und bezeichnet dessen Fortdauer über mehrere Regierungszeiten. „Erging weiter“ macht diesen Zusammenhang in natürlichem Deutsch deutlich, ohne ein neues, unbestimmtes Ereignis einzuführen.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Die übliche hebräische Zeitangabe wird nah am Wortlaut und zugleich verständlich wiedergegeben.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: Sohn Josias
  rationale: Direkte Wiedergabe der Abstammungsangabe mit der gebräuchlichen deutschen Namensform.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Natürliche deutsche Wiedergabe des Königstitels.
- source_word: עַד תֹּם
  choice: bis zum Ende
  rationale: Bezeichnet das Erreichen des zeitlichen Endpunkts; „bis zum Ende“ ist im Deutschen natürlicher als „bis zur Vollendung“ und wahrt den Sinn.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה לְצִדְקִיָּהוּ
  choice: des elften Jahres Zedekias
  rationale: 'Der Zusammenhang verlangt eine Regierungsdatierung: das elfte Jahr der Herrschaft Zedekias.'
- source_word: גְּלוֹת יְרוּשָׁלַם
  choice: bis Jerusalem in die Verbannung geführt wurde
  rationale: Das hebräische Verbalsubstantiv bezeichnet die Wegführung ins Exil. „Jerusalem“ steht metonymisch für seine Bevölkerung; die passive Formulierung bildet das Ereignis in klarem, heutigem Deutsch ab.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: im fünften Monat
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
