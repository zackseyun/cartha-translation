source:
  edition: WLC
  text: וְ/אַתָּה֙ תֶּאְזֹ֣ר מָתְנֶ֔י/ךָ וְ/קַמְתָּ֙ וְ/דִבַּרְתָּ֣ אֲלֵי/הֶ֔ם אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י אֲצַוֶּ֑/ךָּ אַל תֵּחַת֙ מִ/פְּנֵי/הֶ֔ם פֶּֽן אֲחִתְּ/ךָ֖ לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
translation:
  language: de
  text: Du aber, gürte deine Lenden[a], steh auf und sprich zu ihnen alles, was ich dir gebiete. Erschrick nicht vor ihnen, damit ich dich nicht vor ihnen erschrecke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräische Redewendung: Gemeint ist, das Gewand an der Hüfte festzubinden und sich so zum Handeln bereit zu machen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Verbindung aus Konjunktion und betontem Pronomen markiert den Übergang zur direkten Beauftragung Jeremias und hebt ihn kontrastierend hervor.
- source_word: תֶּאְזֹר מָתְנֶיךָ
  choice: gürte deine Hüften
  rationale: Die bildhafte hebräische Wendung bezeichnet das Zusammenbinden der Kleidung an der Hüfte, um zum Handeln bereit zu sein. Die wörtliche Bildsprache bleibt im Haupttext erhalten und wird in der Fußnote erklärt.
- source_word: וְקַמְתָּ
  choice: steh auf
  rationale: Das Qal von קום gehört hier zu einer imperativisch gebrauchten Auftragsfolge. „Steh auf“ ist im modernen Deutsch natürlich und bewahrt den auffordernden Ton.
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: sag ihnen
  rationale: In Verbindung mit „alles, was …“ gibt „sag ihnen“ den einfachen Sinn von דבר mit אל idiomatisch und direkt wieder, ohne den Grundverb stärker als nötig zu „verkünden“ zu erweitern.
- source_word: אֵת כָּל אֲשֶׁר אָנֹכִי אֲצַוֶּךָּ
  choice: alles, was ich dir gebiete
  rationale: „Alles“ bewahrt die Forderung vollständiger Treue zum göttlichen Auftrag. Das Präsens gibt den in diesem Weisungszusammenhang modal gebrauchten Imperfekt natürlich wieder, ohne ihn ausdrücklich auf einen einzigen zukünftigen Zeitpunkt festzulegen.
- source_word: אַל תֵּחַת מִפְּנֵיהֶם
  choice: Erschrick nicht vor ihnen
  rationale: Das Nifal von חתת bezeichnet hier das Erschrecken, Verzagen oder Eingeschüchtertwerden angesichts anderer. „Vor ihnen“ bewahrt zugleich die räumliche und konfrontative Nuance von מִפְּנֵיהֶם.
- source_word: פֶּן אֲחִתְּךָ לִפְנֵיהֶם
  choice: sonst versetze ich dich vor ihnen in Schrecken
  rationale: Das Hifil von חתת ist kausativ. Die Wiederaufnahme von „Schrecken“ wahrt den hebräischen Wortklang zum vorhergehenden „Erschrick“, während „vor ihnen“ die Wiederholung der entsprechenden Präpositionalwendung erhält.
theological_decisions:
- issue: Beibehaltung der körperlich-konkreten Redewendung im prophetischen Auftrag
  choice: Das Bild „gürte deine Hüften“ bleibt im Haupttext erhalten.
  alternative: „Mach dich bereit“ oder „Bereite dich zum Handeln vor“
  rationale: Das konkrete Bild trägt Feierlichkeit, Handlungsbereitschaft und Mut zusammen und gehört zur sprachlichen Gestalt des Auftrags. Die Erklärung in der Fußnote gewährleistet dennoch unmittelbare Verständlichkeit.
- issue: Wahrung des Wortspiels und der Spannung in der abschließenden Warnung
  choice: „Erschrick … versetze ich dich … in Schrecken“ gibt Nifal und Hifil derselben hebräischen Wurzel erkennbar wieder.
  alternative: „Lass dich nicht einschüchtern, sonst werde ich dich vor ihnen erschrecken“
  rationale: Die gewählte Form bewahrt sowohl die kausative Steigerung als auch die ernste, nicht abgeschwächte Warnung, ohne festzulegen, auf welche konkrete Weise Gott den angekündigten Schrecken bewirkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der drängenden Auftragsfolge des Hebräischen; das ungewohnte Körperbild wird bewusst bewahrt und knapp erläutert.
