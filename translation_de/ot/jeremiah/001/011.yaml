source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֵלַ֣/י לֵ/אמֹ֔ר מָה אַתָּ֥ה רֹאֶ֖ה יִרְמְיָ֑הוּ וָ/אֹמַ֕ר מַקֵּ֥ל שָׁקֵ֖ד אֲנִ֥י רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
translation:
  language: de
  text: 'Und das Wort Jahwes erging an mich: „Was siehst du, Jeremia?“ Ich antwortete: „Ich sehe einen Mandelzweig[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Stab aus Mandelholz“. Das hebräische Wort kann sowohl einen Stab beziehungsweise Stock als auch einen Zweig bezeichnen. Zugleich bereitet „Mandelbaum“ (schāqēd) das Wortspiel mit „wachend/überwachend“ (schōqēd) im nächsten Vers vor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  choice: Und das Wort Jahwes erging an mich
  rationale: Die geläufige prophetische Offenbarungsformel wird in natürlichem, würdevollem Deutsch wiedergegeben; „Wort“ bewahrt die formale Verbindung zu anderen Berufungs- und Offenbarungstexten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: לֵאמֹר
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: Das hebräische „sprechend“ dient zur Einführung der folgenden Rede. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als eine wörtliche Wiedergabe.
- source_word: מָה אַתָּה רֹאֶה
  choice: Was siehst du
  rationale: Die direkte Frage gibt das hebräische Partizip im Deutschen idiomatisch im Präsens wieder.
- source_word: וָאֹמַר
  choice: Ich antwortete
  rationale: Im Frage-und-Antwort-Zusammenhang ist „antwortete“ natürlicher als das formal mögliche „sagte“, ohne den Aussagegehalt zu verändern.
- source_word: מַקֵּל שָׁקֵד
  choice: einen Mandelzweig
  rationale: מַקֵּל kann einen Stock, Stab oder Zweig bezeichnen. Im Zusammenhang der Baumbezeichnung ist „Mandelzweig“ anschaulich und knapp; die mögliche Bedeutung „Stab aus Mandelholz“ bleibt in der Fußnote erhalten.
- source_word: אֲנִי רֹאֶה
  choice: Ich sehe
  rationale: Die ausdrückliche hebräische Subjektangabe wird durch das im Deutschen notwendige Pronomen natürlich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Gottesnamen. Die Wiedergabe als „Jahwe“ bewahrt seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung des gesehenen Gegenstands
  choice: Mandelzweig
  alternative: Stab aus Mandelholz
  rationale: Der Kontext legt einen Zweig nahe, doch die lexikalische Spannweite von מַקֵּל erlaubt auch einen Stab. Diese Mehrdeutigkeit wird nicht dogmatisch aufgelöst, sondern durch eine Fußnote sichtbar gehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die traditionelle Offenbarungsformel bleibt erkennbar, während unnötig wörtliche hebräische Redeformeln idiomatisch wiedergegeben werden.
