  variant: modern standard German
source:
  edition: WLC
  text: בְּ/טֶ֨רֶם אצור/ך בַ/בֶּ֨טֶן֙ יְדַעְתִּ֔י/ךָ וּ/בְ/טֶ֛רֶם תֵּצֵ֥א מֵ/רֶ֖חֶם הִקְדַּשְׁתִּ֑י/ךָ נָבִ֥יא לַ/גּוֹיִ֖ם נְתַתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/005.yaml
  text: Before I formed you in the womb[a], I knew you, and before you came out from the womb, I set you apart[b]; I appointed you as a prophet to the nations.
translation:
  language: de
  text: Bevor ich dich im Mutterleib formte, kannte ich dich[a], und bevor du aus dem Mutterleib hervorkamst, sonderte ich dich aus[b]. Zum Propheten für die Völker bestimmte ich dich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für »kennen« kann hier auch persönliche Zuwendung oder Erwählung anklingen lassen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »weihte ich dich«; auch: »heiligte ich dich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Die temporale Konjunktion gibt die Vorzeitigkeit schlicht und natürlich wieder, ohne eine im Hebräischen nicht ausdrücklich markierte Verstärkung hinzuzufügen.
- source_word: אצור/ך (יצר)
  choice: ich dich … formte
  rationale: יצר bezeichnet ein konkretes Formen oder Gestalten. »Formte« bewahrt dieses Bild besser als das allgemeinere »erschuf«.
- source_word: בַבֶּטֶן
  choice: im Mutterleib
  rationale: בטן kann Bauch oder Mutterleib bedeuten; im vorgeburtlichen Zusammenhang ist »Mutterleib« eindeutig und idiomatisch.
- source_word: יְדַעְתִּיךָ (ידע)
  choice: kannte ich dich
  rationale: Die Grundbedeutung »kennen« bleibt erhalten und lässt die mögliche relationale Bedeutung sowie den Anklang an Erwählung offen, statt sie im Haupttext festzulegen.
- source_word: תֵּצֵא (יצא)
  choice: du … hervorkamst
  rationale: Die konkrete Bewegung des hebräischen Verbs »hinausgehen/hervorkommen« wird bewahrt; zugleich ist im Zusammenhang die Geburt klar.
- source_word: מֵרֶחֶם
  choice: aus dem Mutterleib
  rationale: רחם bezeichnet hier den Mutterleib. Die Wiederholung entspricht der parallelen Struktur des Hebräischen und bleibt im Deutschen verständlich.
- source_word: הִקְדַּשְׁתִּיךָ (קדשׁ, Hifil)
  choice: sonderte ich dich aus
  rationale: Die Form bezeichnet das Heiligen beziehungsweise Aussondern für einen heiligen Zweck. »Aussondern« vermittelt die Widmung zugänglich, ohne den Sinn auf eine innere moralische Veränderung zu verengen.
- source_word: נָבִיא
  choice: Propheten
  rationale: »Prophet« ist die übliche und kontextuell eindeutige Wiedergabe von נביא.
- source_word: לַגּוֹיִם
  choice: für die Völker
  rationale: גוים bezeichnet Völker beziehungsweise Nationen. »Für die Völker« gibt den Wirkungsbereich Jeremias natürlich wieder, ohne die neutestamentlich geprägte Bezeichnung »Heiden« einzutragen.
- source_word: נְתַתִּיךָ (נתן)
  choice: habe ich dich bestimmt
  rationale: נתן bedeutet grundsätzlich »geben«, kann in einer Beauftragungskonstruktion aber »einsetzen/bestimmen« bedeuten. »Bestimmt« ist im Deutschen mit »zum Propheten« natürlich und bewahrt den Gedanken göttlicher Berufung.
theological_decisions:
- issue: Bedeutung von יְדַעְתִּיךָ im Blick auf Vorherwissen und Erwählung
  choice: »kannte ich dich« bleibt im Haupttext stehen.
  alternative: »erwählte ich dich« oder »nahm ich dich an«
  rationale: ידע kann persönliches, beziehungsbezogenes Kennen und im Kontext auch Erwählung anklingen lassen. Das hebräische Verb lautet jedoch »kennen«; die breitere Formulierung bewahrt die theologische Spannung, während die anschließende Berufung die besondere Bestimmung Jeremias deutlich macht.
- issue: Bedeutung von הִקְדַּשְׁתִּיךָ
  choice: »sonderte ich dich aus«
  alternative: »heiligte ich dich« oder »weihte ich dich«
  rationale: Die Aussage betrifft Jeremias Aussonderung und Widmung für Gottes Auftrag. Die gewählte Formulierung ist allgemein verständlich; die wörtlichere kultisch-theologische Alternative wird in der Fußnote offengehalten.
- issue: Reichweite von לַגּוֹיִם
  choice: »für die Völker«
  alternative: »für die Nationen« oder »zu den Völkern«
  rationale: Die Formulierung lässt offen, auf welche Weise Jeremias prophetischer Dienst die Völker erreicht. Sie vermeidet eine unnötige Beschränkung auf Nichtjuden im späteren theologischen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die konkreten Bilder des Hebräischen bleiben erhalten. Die Voranstellung »Zum Propheten für die Völker« spiegelt die Hervorhebung im hebräischen Schlusssatz; Perfekt statt Präteritum sorgt dort für natürliches gegenwärtiges Deutsch.
