base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/004.yaml
  text: The word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH, traditionell mit »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: Die Wayyiqtol-Form von היה führt das nächste Geschehen ein. Zusammen mit דְבַר יְהוָה wird sie im Deutschen idiomatisch durch die feste prophetische Wendung »das Wort … erging« wiedergegeben; ein zusätzliches »und« oder »da« ist in diesem Einzelvers nicht erforderlich.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel bezeichnet דְבַר יְהוָה die von Gott kommende Mitteilung. »Das Wort« wahrt den formalen und theologischen Zusammenhang besser als das freiere »die Botschaft«.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und wegen der deutschen Satzkonstruktion in den Genitiv gesetzt.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der deutschen Wendung »das Wort erging« entspricht »an mich« dem hebräischen אֶל mit Suffix der ersten Person Singular natürlich und genau.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das schwerfällige »indem er sprach« oder »mit den Worten«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen יהוה. »Jahwe« macht diesen Namen sichtbar, während »der HERR« die traditionelle Ersatzlesung wiedergibt; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel »Das Wort … erging an mich« bleibt erhalten. Der Doppelpunkt kündigt die in Vers 5 folgende Gottesrede an.
