  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
translation:
  language: de
  text: 'Und das Wort Jahwes erging zum zweiten Mal an mich: „Was siehst du?“ Ich sagte: „Ich sehe einen siedenden Topf[a], und seine Vorderseite ist nach Norden hin ausgerichtet[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „einen angeblasenen“ oder „angefachten Topf“. Das hebräische Partizip kann an ein angeblasenes oder angefachtes Feuer denken lassen, das den Topf zum Sieden bringt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „und seine Vorderseite ist vom Angesicht des Nordens her“. Gemeint ist offenbar die Ausrichtung der sichtbaren Seite oder Öffnung des Topfes in Bezug auf den Norden; die genaue räumliche Vorstellung bleibt unklar.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Bewahrt die feste prophetische Wortereignisformel; „erging an mich“ gibt וַיְהִי ... אֵלַי in natürlichem, würdevollem Deutsch wieder.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Gibt die ausdrücklich bezeichnete Abfolge genauer wieder als das allgemeinere „wieder“.
- source_word: מָה אַתָּה רֹאֶה
  choice: Was siehst du?
  rationale: Der deutsche Präsenssatz entspricht dem hebräischen Partizip in direkter Rede idiomatisch.
- source_word: סִיר נָפוּחַ
  choice: einen siedenden Topf
  rationale: סִיר bezeichnet ein Kochgefäß; נָפוּחַ kann auf das Anblasen beziehungsweise Anfachen des Feuers und damit auf einen siedenden Topf weisen. „Siedend“ vermittelt das Bild knapp und natürlich, während die Fußnote die wörtlichere Möglichkeit bewahrt.
- source_word: וּפָנָיו
  choice: und seine Vorderseite
  rationale: פָּנִים bedeutet wörtlich „Gesicht“ und bezeichnet hier wohl die zugewandte Seite oder Öffnung des Topfes. „Vorderseite“ erhält das konkrete Bild, ohne die genaue Gestalt als „Öffnung“ festzulegen.
- source_word: מִפְּנֵי צָפוֹנָה
  choice: von Norden her
  rationale: Die schwierige Wendung bedeutet wörtlich etwa „von der Vorderseite des Nordens her“. Die knappe Formulierung wahrt den Bezug zum Norden, ohne die genaue Ausrichtung des Topfes vorschnell festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ gibt den Eigennamen erkennbar wieder und entspricht der projektspezifischen Entscheidung, ohne einen Titel an seine Stelle zu setzen.
- issue: Ausrichtung des Topfes
  choice: seine Vorderseite ist von Norden her
  alternative: seine Öffnung ist vom Norden weg geneigt
  rationale: Der hebräische Ausdruck ist räumlich mehrdeutig. Die gewählte, bewusst bildhafte Form wahrt den eindeutigen Nordbezug, legt aber weder „zum Norden hin“ noch „vom Norden weg“ als Geometrie der Vision fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt erkennbar, während übermäßig altertümliche Wendungen vermieden werden. Die ungewöhnliche Richtungsangabe wird im Haupttext bewusst nicht geglättet, da der hebräische Wortlaut mehrdeutig ist; die Fußnote erläutert die Spannung.
