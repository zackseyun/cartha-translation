  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יָד֔/וֹ וַ/יַּגַּ֖ע עַל פִּ֑/י וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י הִנֵּ֛ה נָתַ֥תִּי דְבָרַ֖/י בְּ/פִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/009.yaml
  text: Then the LORD stretched out his hand and touched my mouth, and the LORD said to me, “Look, I have put my words in your mouth.”
translation:
  language: de
  text: 'Da streckte der HERR seine Hand aus und berührte meinen Mund. Und der HERR sagte zu mir: »Sieh, ich habe meine Worte in deinen Mund gelegt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da streckte … aus
  rationale: Gibt die erzählerische Abfolge und die konkrete Bewegung der ausgestreckten Hand natürlich wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Entspricht der im Deutschen etablierten Wiedergabe des Gottesnamens mit HERR in Kapitälchen und der vorgegebenen redaktionellen Ausrichtung.
- source_word: וַיַּגַּע עַל־פִּי
  choice: berührte meinen Mund
  rationale: Das Verb נגע mit עַל bezeichnet hier das Berühren; die knappe konkrete Formulierung bewahrt das prophetische Zeichen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der hebräischen Partikel in würdiger, verständlicher Sprache.
- source_word: נָתַתִּי דְבָרַי בְּפִיךָ
  choice: ich lege meine Worte in deinen Mund
  rationale: Das hebräische Perfekt kann in der unmittelbaren Zeichenhandlung als wirksame gegenwärtige Einsetzung wiedergegeben werden; die deutsche Präsensform klingt natürlich und erhält die performative Kraft.
theological_decisions:
- issue: Zeitwert von נָתַתִּי
  choice: ich lege
  alternative: ich habe gelegt / ich habe gegeben
  rationale: Die Berührung und die folgende Erklärung bilden eine gegenwärtig vollzogene Beauftragung. Das Präsens gibt diese performative Handlung idiomatisch wieder, ohne eine zusätzliche Lehrentscheidung einzutragen.
- issue: Bildsprache »Worte in den Mund legen«
  choice: wörtliche Bildsprache beibehalten
  alternative: zum Sprechen bevollmächtigen
  rationale: Die konkrete Formulierung verbindet göttliche Offenbarung und Jeremias Verkündigungsauftrag, ohne das Verhältnis auslegend zu verengen.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die Wiederholung von »der HERR« bleibt wie im Hebräischen erhalten. »Sieh« bewahrt den Signalcharakter von הִנֵּה; die Satzteilung verbessert die deutsche Lesbarkeit.
