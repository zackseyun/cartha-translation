  rationale: Die einzige Änderung ersetzt die bei „Wort“ weniger idiomatische Wendung „ausführen“ durch „verwirklichen“. Der Text bleibt bei der Aussage, dass Jahwe wachsam über seinem Wort steht, damit er es selbst zustande bringt. Das Wortspiel und die alternative, stärker formnahe Wiedergabe der Bestätigung bleiben in der Fußnote erhalten.
