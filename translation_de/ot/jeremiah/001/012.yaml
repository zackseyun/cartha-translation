  terminology: „Jahwe“ und „mein Wort“ sind angemessen und vermeiden eine unnötige Einengung auf „Verheißung“ oder „Botschaft“. Die Fußnote erklärt das im Deutschen nicht reproduzierbare Wortspiel zutreffend; ihr Anker steht bei der bestätigenden Antwort und ist sinnvoll.
