source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלַ֖/י הֵיטַ֣בְתָּ לִ/רְא֑וֹת כִּֽי שֹׁקֵ֥ד אֲנִ֛י עַל דְּבָרִ֖/י לַ/עֲשֹׂתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/012.yaml
  text: Then Yahweh said to me[a], “You have seen well[c][b], for I am watching over my word to perform it.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Du hast richtig gesehen,[a] denn ich wache über mein Wort, um es zu verwirklichen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen besteht ein Wortspiel zwischen „Mandelzweig“ (שָׁקֵד, schaked) in Vers 11 und „ich wache“ (שֹׁקֵד, schoked) hier. „Du hast richtig gesehen“ kann wörtlicher auch mit „Du hast gut gesehen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative wayyiqtol führt die Handlung fort; „Da sagte“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֵיטַבְתָּ לִרְאוֹת
  choice: Du hast richtig gesehen
  rationale: Die hebräische Wendung bedeutet hier, dass Jeremia die Vision zutreffend erkannt hat. „Richtig gesehen“ ist idiomatisches modernes Deutsch; wörtlicher wäre „gut gesehen“.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für Jahwes Bestätigung der Wahrnehmung Jeremias ein.
- source_word: שֹׁקֵד
  choice: ich wache über
  rationale: Das Partizip bezeichnet wachsame Aufmerksamkeit. Die Lautbeziehung zu שָׁקֵד („Mandelzweig“) aus Vers 11 lässt sich im Deutschen nicht unmittelbar nachbilden und wird in der Fußnote erklärt.
- source_word: דְּבָרִי
  choice: mein Wort
  rationale: Bewahrt den Singular und die breite Bedeutung des hebräischen דָּבָר, ohne ihn auf „Verheißung“ oder „Botschaft“ einzuengen.
- source_word: לַעֲשֹׂתוֹ
  choice: um es auszuführen
  rationale: Der Infinitiv mit Suffix gibt Ziel beziehungsweise Absicht an. „Ausführen“ bezeichnet natürlich das Wirksamwerden des angekündigten Wortes.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen; „Jahwe“ bewahrt ihn als solchen.
- issue: Bedeutungsumfang von דְּבָרִי
  choice: mein Wort
  alternative: meine Verheißung; meine Botschaft
  rationale: „Mein Wort“ wahrt die Offenheit des hebräischen Ausdrucks und legt nicht fest, ob besonders Verheißung, Ankündigung oder Botschaft gemeint ist.
- issue: Zielangabe לַעֲשֹׂתוֹ
  choice: um es auszuführen
  alternative: um es zu tun; um es zu verwirklichen
  rationale: Die Formulierung hält fest, dass Jahwe selbst sein Wort zur Ausführung bringt, ohne die genaue Art der Erfüllung näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am Hebräischen, ohne unnatürlich zu wirken. Das nicht übertragbare hebräische Wortspiel wird durch eine Fußnote sichtbar gemacht.
