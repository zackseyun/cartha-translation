source:
  edition: WLC
  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
translation:
  language: de
  text: Warum solltest du wie ein fassungsloser Mann sein, wie ein Krieger, der nicht retten kann? Doch du bist mitten unter uns, Jahwe, und dein Name ist über uns genannt[a]. Verlass uns nicht!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Wir sind nach deinem Namen genannt.“ Wörtlich: „Dein Name ist über uns genannt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  choice: Warum solltest du … sein?
  rationale: Das Fragewort mit dem Imperfekt drückt in diesem Klagegebet einen protestierenden, bittenden Modalton aus, nicht lediglich eine zukünftige Handlung.
- source_word: כְּאִישׁ נִדְהָם
  choice: wie ein fassungsloser Mann
  rationale: Das Nifal-Partizip bezeichnet einen Menschen, der vor Bestürzung wie gelähmt oder handlungsunfähig wirkt. „Fassungslos“ bewahrt diese Spannung und klingt im Deutschen natürlich.
- source_word: כְּגִבּוֹר
  choice: wie ein Krieger
  rationale: גִּבּוֹר bezeichnet hier aufgrund des anschließenden Rettungsunvermögens am besten einen starken Kämpfer beziehungsweise Krieger.
- source_word: לֹא יוּכַל לְהוֹשִׁיעַ
  choice: der nicht retten kann
  rationale: יכול mit Infinitiv bezeichnet Unvermögen; הושיע wird knapp und quellennah mit „retten“ wiedergegeben.
- source_word: וְאַתָּה בְקִרְבֵּנוּ
  choice: Doch du bist mitten unter uns
  rationale: Das Waw hat im Zusammenhang kontrastierende Kraft. בְּקֶרֶב bezeichnet die reale Gegenwart in der Mitte des Volkes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: und dein Name ist über uns ausgerufen
  rationale: Die Wiedergabe erhält das hebräische Bild des über einer Gemeinschaft ausgerufenen Namens und damit die Aussage von Zugehörigkeit und Anspruch; eine idiomatischere Fassung steht in der Fußnote.
- source_word: אַל תַּנִּחֵנוּ
  choice: Verlass uns nicht!
  rationale: Die verneinte Jussivform ist eine dringliche Bitte. „Verlassen“ gibt den Sinn von im Stich lassen beziehungsweise preisgeben würdig und gegenwärtig wieder.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Die Transliteration bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Bundes- und Zugehörigkeitsformel וְשִׁמְךָ עָלֵינוּ נִקְרָא
  choice: dein Name ist über uns ausgerufen
  alternative: wir sind nach deinem Namen genannt
  rationale: Der Haupttext bewahrt das konkrete und theologisch offene Bild des Hebräischen. Die Fußnote erschließt den idiomatischen Sinn, ohne die Metapher stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dem eindringlichen Ton eines Klagegebets. Die Parallelstruktur und das Bild vom hilflosen Krieger bleiben erhalten; der abschließende Imperativ ist bewusst knapp und dringlich.
