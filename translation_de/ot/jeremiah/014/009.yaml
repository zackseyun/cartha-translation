  to: Warum solltest du wie ein fassungsloser Mann sein, wie ein Krieger, der nicht retten kann? Doch du bist mitten unter uns, Jahwe, und dein Name ist über uns genannt[a]. Verlass uns nicht!
  rationale: Die Änderung beschränkt sich auf die Bundes- und Zugehörigkeitsformel. „Genannt“ gibt נִקְרָא genauer und weniger interpretierend wieder als „ausgerufen“, während die Fußnote die idiomatische Bedeutung erschließt. Alle übrigen Formulierungen können bleiben.
