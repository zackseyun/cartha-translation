id: JER.14.10
reference: Jeremiah 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
translation:
  language: de
  text: 'So spricht Jahwe über dieses Volk: So gern schweifen sie umher[a]; ihre Füße halten sie nicht zurück. Darum hat Jahwe kein Gefallen an ihnen[b]. Jetzt wird er ihrer Schuld gedenken und ihre Sünden ahnden[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »So sehr lieben sie es umherzuschweifen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Darum nimmt Jahwe sie nicht an.«'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »und ihre Sünden heimsuchen«; gemeint ist, dass Gott sie wegen ihrer Sünden zur Rechenschaft zieht.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָעָם הַזֶּה
  choice: über dieses Volk
  rationale: Die Präposition ל bezeichnet hier das Volk, über das Jahwes Aussage ergeht; »über« ist im Deutschen natürlich.
- source_word: כֵּן אָהֲבוּ לָנוּעַ
  choice: So gern schweifen sie umher
  rationale: אָהַב mit Infinitiv drückt eine Vorliebe aus. »So gern« bewahrt diesen affektiven Zug, während »umherschweifen« die ruhelose und im Kontext treulose Bewegung ausdrückt.
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  choice: ihre Füße halten sie nicht zurück
  rationale: Die Formulierung erhält das hebräische Bild der Füße und bleibt zugleich im modernen Deutschen verständlich.
- source_word: לֹא רָצָם
  choice: hat kein Gefallen an ihnen
  rationale: רצה kann sowohl günstige Annahme als auch Wohlgefallen bezeichnen. Diese Wiedergabe wahrt den Beziehungsaspekt, ohne eine technische Annahmelehre einzutragen.
- source_word: עַתָּה יִזְכֹּר עֲוֺנָם
  choice: Jetzt wird er ihrer Schuld gedenken
  rationale: »Gedenken« bewahrt die gerichtliche Bedeutung von זכר; עָוֺן wird hier treffend als »Schuld« wiedergegeben.
- source_word: וְיִפְקֹד חַטֹּאתָם
  choice: und ihre Sünden ahnden
  rationale: פקד bezeichnet im Gerichtskontext das zur Rechenschaft Ziehen. »Ahnden« gibt diesen Sinn knapp wieder, ohne das hebräische Idiom unverständlich wörtlich abzubilden.
theological_decisions:
- issue: Bedeutung von לֹא רָצָם
  choice: hat kein Gefallen an ihnen
  alternative: nimmt sie nicht an
  rationale: Beide Bedeutungsnuancen sind möglich. Der Haupttext wahrt die Aussage göttlichen Missfallens; die Alternative wird in der Fußnote genannt.
- issue: Gerichtssprache im Schlussglied
  choice: Jetzt wird er ihrer Schuld gedenken und ihre Sünden ahnden
  alternative: Jetzt wird er ihrer Schuld gedenken und ihre Sünden heimsuchen
  rationale: Der Text spricht von aktivem göttlichem Gericht. »Ahnden« vermittelt die gerichtliche Funktion von פקד, ohne über den Wortlaut hinaus eine bestimmte Art der Strafe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild der ungebremsten Füße und die gerichtliche Sprache bleiben erhalten; altertümliche oder konfessionell festgelegte Formulierungen werden vermieden.
