  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י אַל תִּתְפַּלֵּ֛ל בְּעַד הָ/עָ֥ם הַ/זֶּ֖ה לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/011.yaml
  text: Then Yahweh said to me[a], “Do not pray for the welfare of this people.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Bete nicht für das Wohlergehen dieses Volkes[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bete nicht für dieses Volk, damit es ihm gut geht.«'
    reason: Die knappe Verbindung von בְּעַד und לְטוֹבָה kann im Deutschen auch so gegliedert werden, dass zunächst das Volk als Gegenstand der Fürbitte und anschließend sein Wohlergehen als deren Ziel genannt wird.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ führt die Handlung weiter. »Da sagte« gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלָי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person Singular bedeutet hier schlicht »zu mir«.
- source_word: אַל תִּתְפַּלֵּל
  choice: Bete nicht
  rationale: אַל mit der entsprechenden Verbform drückt ein Verbot aus; das Hitpael von פלל bedeutet gewöhnlich »beten«.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: für ... dieses Volkes
  rationale: בְּעַד bezeichnet hier das Eintreten zugunsten anderer. In Verbindung mit »Wohlergehen« lässt sich die Aussage im Deutschen natürlich als »für das Wohlergehen dieses Volkes« formulieren.
- source_word: לְטוֹבָה
  choice: für das Wohlergehen
  rationale: Die Wendung bezeichnet das Gute beziehungsweise das Wohlergehen, auf das das Gebet gerichtet wäre. »Wohlergehen« ist idiomatisch und bewahrt den Gedanken des Nutzens für das Volk.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Bezug von לְטוֹבָה
  choice: für das Wohlergehen dieses Volkes
  alternative: für dieses Volk, damit es ihm gut geht
  rationale: Die knappe hebräische Fügung kann entweder als Ziel beziehungsweise Inhalt der Fürbitte oder enger mit dem Volk als dessen Nutzen ausgedrückt werden. Der Haupttext bietet eine natürliche deutsche Formulierung; die Fußnote erhält die mögliche alternative Gliederung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und nachdrücklich; »dieses Volk« bewahrt den singularischen Kollektivausdruck des Hebräischen.
