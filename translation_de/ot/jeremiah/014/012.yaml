  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
translation:
  language: de
  text: Auch wenn sie fasten, höre ich nicht auf ihren Hilferuf; und auch wenn sie Brandopfer und Speisopfer darbringen, finde ich an ihnen keinen Gefallen. Denn durch Schwert, Hungersnot und Seuche reibe ich sie auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יָצֻמוּ
  choice: Auch wenn sie fasten
  rationale: 'כִּי leitet hier im Zusammenhang einen konzessiven Satz ein: Selbst ihr Fasten ändert Gottes angekündigte Reaktion nicht.'
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל רִנָּתָם
  choice: höre ich nicht auf ihren Hilferuf
  rationale: שׁמע אֶל bezeichnet hier nicht bloß akustisches Hören, sondern das Erhören beziehungsweise Beachten eines Rufes. „Auf … hören“ bewahrt dieses Moment; „Hilferuf“ gibt רִנָּה im Gerichtskontext natürlich wieder.
- source_word: יַעֲלוּ עֹלָה וּמִנְחָה
  choice: sie Brandopfer und Speisopfer darbringen
  rationale: Die Hifilform von עלה ist im Opferkontext mit „darbringen“ angemessen wiedergegeben. עֹלָה bezeichnet das Brandopfer; מִנְחָה ist hier der kultische Fachausdruck für das Speisopfer.
- source_word: אֵינֶנִּי רֹצָם
  choice: nehme ich sie nicht an
  rationale: רצה bedeutet im Opferkontext „wohlgefällig annehmen“. Das Pronomen bleibt wie im Hebräischen formal mehrdeutig und kann unmittelbar auf die Opfer, dem weiteren Sinn nach aber auch auf die Opfernden bezogen werden.
- source_word: כִּי
  choice: Vielmehr
  rationale: Das zweite כִּי stellt der vergeblichen religiösen Reaktion das tatsächlich bevorstehende Gericht gegenüber; „vielmehr“ gibt diese kontrastierende Kraft idiomatisch wieder.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: durch Schwert, Hunger und Seuche
  rationale: Die feste Gerichtsreihe wird knapp und parallel wiedergegeben. רָעָב kann sowohl Hunger als Zustand wie auch Hungersnot bezeichnen; „Hunger“ bewahrt die Breite des Ausdrucks. דֶּבֶר meint eine verheerende Seuche.
- source_word: מְכַלֶּה אוֹתָם
  choice: werde ich sie vernichten
  rationale: Das Piel-Partizip von כלה bezeichnet hier das vollständige Aufreiben beziehungsweise Vernichten. Die deutsche Futurform passt zur angekündigten, feststehenden Gerichtshandlung.
theological_decisions:
- issue: Gottes Ablehnung von Fasten, Ruf und Opfern während des Gerichts
  choice: Der Vers erklärt, dass Gott diese religiösen Handlungen in der gegenwärtigen Situation nicht erhört oder annimmt, sondern das angekündigte Gericht vollzieht.
  alternative: Die Aussage könnte als allgemeine Verwerfung von Fasten oder Opferdienst verstanden werden.
  rationale: Der unmittelbare Kontext begrenzt die Aussage auf dieses Volk in der beschriebenen Gerichtslage; daraus wird keine allgemeine Lehre gegen Fasten oder Opfer abgeleitet.
- issue: Bezugswort des Suffixes in רֹצָם
  choice: „sie“ bleibt bewusst mehrdeutig.
  alternative: Das Pronomen kann ausschließlich auf die Brand- und Speisopfer oder ausschließlich auf die Menschen bezogen werden.
  rationale: Die Opfer sind die nächsten grammatischen Bezugspunkte, doch das maskuline Pluralsuffix und die weitere Aussage über das Volk lassen auch einen Bezug auf die Opfernden zu. Die deutsche Form erhält diese Spannung.
- issue: Zeitwert von מְכַלֶּה
  choice: „werde ich … vernichten“ gibt das bevorstehende, entschiedene Gericht wieder.
  alternative: „bin ich dabei, sie zu vernichten“ betont stärker den bereits laufenden Vollzug.
  rationale: Das hebräische Partizip kann eine im Vollzug begriffene oder feststehende Handlung ausdrücken. Im prophetischen Zusammenhang ist die Zukunftsform natürlich, ohne die Gewissheit des Gerichts abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hilferuf“, „darbringen“, „Brandopfer“ und „Speisopfer“ sind verständlich und zugleich dem kultischen beziehungsweise prophetischen Register angemessen. Die dreigliedrige Gerichtsformel bleibt knapp und rhythmisch.
