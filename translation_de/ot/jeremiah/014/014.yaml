base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Die Propheten weissagen Lüge in meinem Namen. Ich habe sie weder gesandt noch ihnen nichts befohlen noch zu ihnen geredet. Eine falsche Vision, Wahrsagerei, Nichtiges[a] und den Trug ihres eigenen Herzens weissagen sie euch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wertloses«; das hebräische Wort kann in anderen Zusammenhängen auch »Götze« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form des Gottesnamens gibt das Tetragramm als Eigennamen wieder.
- source_word: שֶׁקֶר / חֲזוֹן שֶׁקֶר
  choice: Lüge / Lügenvision
  rationale: Bewahrt das gemeinsame Bedeutungsfeld von Falschheit und Täuschung sowie die zugespitzte Wiederholung im Hebräischen.
- source_word: הַנְּבִאִים נִבְּאִים
  choice: Die Propheten weissagen
  rationale: Erhält die Wortwiederholung des hebräischen Nomens und Verbs in einer geläufigen deutschen Form.
- source_word: בִּשְׁמִי
  choice: in meinem Namen
  rationale: Bewahrt den Anspruch der Propheten, mit göttlicher Bevollmächtigung zu sprechen.
- source_word: לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים וְלֹא דִבַּרְתִּי אֲלֵיהֶם
  choice: Ich habe sie weder gesandt noch ihnen etwas geboten noch zu ihnen geredet
  rationale: Gibt die dreifache Verneinung göttlicher Sendung, Beauftragung und Rede knapp und parallel wieder.
- source_word: קֶסֶם
  choice: Wahrsagerei
  rationale: Bezeichnet verständlich eine mantische Praxis, die hier als Quelle falscher Prophetie erscheint.
- source_word: אֱלִיל
  choice: Nichtiges
  rationale: Passt zur Bedeutung von Leere oder Wertlosigkeit und zur Aufzählung trügerischer Botschaftsinhalte, ohne vorschnell einen konkreten Götzen anzunehmen.
- source_word: תַּרְמוּת לִבָּם
  choice: den Trug ihres eigenen Herzens
  rationale: Drückt die aus ihrem Inneren hervorgebrachte Täuschung aus und stellt sie der wirklichen Rede Jahwes gegenüber.
- source_word: הֵמָּה מִתְנַבְּאִים לָכֶם
  choice: weissagen sie euch
  rationale: Die Nachstellung erhält den zusammenfassenden Nachdruck des hebräischen Satzschlusses und nennt die Angesprochenen ausdrücklich.
theological_decisions:
- issue: Ursprung und Art der falschen prophetischen Botschaft
  choice: Die Übersetzung bestreitet jede göttliche Beauftragung und stellt mehrere trügerische Quellen oder Beschreibungen der Botschaft nebeneinander.
  alternative: Die vier Ausdrücke könnten als nahezu gleichbedeutende Häufung verstanden werden, nicht als klar getrennte Kategorien.
  rationale: Die Aufzählung bleibt ohne technische Einteilung stehen; so wird weder ihre mögliche Vielfalt noch ihre rhetorische Häufung ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Weissagen« bewahrt die markante Wiederholung von Prophet und prophetischem Reden; die parallele Dreierformel bleibt knapp. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck, auf den er sich bezieht.
