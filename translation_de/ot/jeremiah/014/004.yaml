source:
  edition: WLC
  text: בַּ/עֲב֤וּר הָ/אֲדָמָה֙ חַ֔תָּה כִּ֛י לֹא הָיָ֥ה גֶ֖שֶׁם בָּ/אָ֑רֶץ בֹּ֥שׁוּ אִכָּרִ֖ים חָפ֥וּ רֹאשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
translation:
  language: de
  text: Weil der Ackerboden aufgerissen ist[a] und im Land kein Regen gefallen ist, schämen sich die Bauern und verhüllen ihre Köpfe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil der Ackerboden bestürzt ist“ beziehungsweise „zerbrochen ist“. Das hebräische Verb kann Zerbrechen oder Bestürzung bezeichnen; im Zusammenhang der Dürre ist wahrscheinlich der rissig aufgebrochene Boden gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das Verhüllen des Kopfes war ein Zeichen von Scham, Trauer oder Klage.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Weil
  rationale: Gibt die einleitende kausale Beziehung natürlich und knapp wieder.
- source_word: הָאֲדָמָה
  choice: der Ackerboden
  rationale: Bezeichnet hier den von der Dürre betroffenen, landwirtschaftlich genutzten Boden; die Wiedergabe grenzt ihn vom folgenden בָּאָרֶץ, dem Land, ab.
- source_word: חַתָּה
  choice: aufgerissen ist
  rationale: Das Verb kann Zerbrechen oder Bestürzung ausdrücken. Im Dürrekontext bezeichnet es wahrscheinlich den rissig aufgebrochenen Boden, ohne die zugrunde liegende Bildsprache völlig aufzugeben.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Erklärung für den Zustand des Bodens ein und vermeidet eine unmittelbare Wiederholung von „weil“.
- source_word: גֶשֶׁם
  choice: Regen
  rationale: Direkte und geläufige Wiedergabe der Niederschlagsbezeichnung.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Bewahrt den regionalen Bezug auf das betroffene Land, ohne es im Text ausdrücklich mit Juda gleichzusetzen.
- source_word: בֹּשׁוּ
  choice: stehen ... beschämt da
  rationale: Gibt die Scham und erfahrene Demütigung idiomatisch wieder und verbindet sie natürlich mit der folgenden Trauergeste.
- source_word: אִכָּרִים
  choice: die Bauern
  rationale: Moderne, allgemein verständliche Bezeichnung für die Landarbeiter beziehungsweise Ackerbauern.
- source_word: חָפוּ רֹאשָׁם
  choice: sie verhüllen ihren Kopf
  rationale: Bewahrt die konkrete kulturelle Geste. Der hebräische Singular „ihren Kopf“ wird kollektiv auf die Mehrzahl der Bauern bezogen.
theological_decisions: []
