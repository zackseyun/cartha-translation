  register: Modernes, würdiges Standarddeutsch mit verständlicher landwirtschaftlicher Bildsprache. Die Personifikation beziehungsweise Mehrdeutigkeit von חַתָּה wird durch eine Fußnote bewahrt; die semitische Kollektivform „ihren Kopf“ bleibt im Haupttext erhalten.
