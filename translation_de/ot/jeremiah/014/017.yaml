reference: Jeremiah 14:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
translation:
  language: de
  text: 'Und du sollst ihnen dieses Wort sagen: »Meine Augen sollen Nacht und Tag von Tränen überströmen[a] und nicht zur Ruhe kommen; denn die Jungfrau, die Tochter meines Volkes[b], ist schwer zerbrochen[c], ihre Wunde ist überaus schlimm.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Meine Augen sollen Nacht und Tag von Tränen herabfließen und nicht still werden.“ Das hebräische Verb kann „still werden“, „ruhen“ oder „aufhören“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „die Jungfrau, die Tochter meines Volkes“ – eine poetische Darstellung des Volkes als junge Frau.'
    reason: cultural_note
  - marker: c
    text: 'Das Hebräische gebraucht zur Verstärkung ein Hauptwort und ein verwandtes Verb: wörtlich etwa „mit einem großen Bruch zerbrochen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם אֶת־הַדָּבָר הַזֶּה
  choice: Und du sollst ihnen dieses Wort sagen
  rationale: Die Verbform mit וְ hat hier in der prophetischen Anweisung auffordernde Bedeutung. „Dieses Wort“ bewahrt den Singular דָּבָר und den feierlichen Ton.
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה
  choice: Meine Augen sollen … von Tränen überströmen
  rationale: Die Form ist als jussivische Aufforderung verstanden. „Überströmen“ gibt das Bild der herabfließenden Tränen natürlich und anschaulich wieder.
- source_word: לַיְלָה וְיוֹמָם
  choice: Nacht und Tag
  rationale: Die feste Wendung bezeichnet ununterbrochene Dauer und klingt im Deutschen natürlich.
- source_word: וְאַל תִּדְמֶינָה
  choice: und nicht zur Ruhe kommen
  rationale: דמה kann hier „still werden“, „aufhören“ oder „ruhen“ bedeuten. Mit den Augen als Subjekt bezeichnet die Wendung das unablässige Weinen, ohne die Bildsprache aufzulösen.
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  choice: ist schwer zerbrochen
  rationale: Das Deutsche kann die hebräische figura etymologica („mit großem Bruch zerbrochen“) nicht elegant wörtlich nachbilden. „Schwer zerbrochen“ bewahrt Verb und Intensität; die formale Besonderheit wird in einer Fußnote erläutert.
- source_word: בְּתוּלַת בַּת־עַמִּי
  choice: die Jungfrau, die Tochter meines Volkes
  rationale: Die poetische Personifikation bleibt erhalten. Die Apposition mit Komma ist im modernen Deutschen verständlicher als die ungewöhnliche Zusammensetzung „Jungfrau-Tochter“.
- source_word: מַכָּה נַחְלָה מְאֹד
  choice: ihre Wunde ist überaus schlimm
  rationale: נַחְלָה beschreibt die Wunde als äußerst schwer oder leidvoll und kann auch den Beiklang „unheilbar“ tragen. Die gewählte Form wahrt die Intensität, ohne diese mögliche Nuance im Haupttext festzuschreiben.
theological_decisions:
- issue: Die Personifikation בְּתוּלַת בַּת־עַמִּי
  choice: Als „die Jungfrau, die Tochter meines Volkes“ beibehalten
  alternative: Paraphrase als „mein Volk Juda“ oder Deutung als ausdrückliche Bezeichnung Zions
  rationale: Der hebräische Text gestaltet das Volk poetisch als junge Frau. Die Metapher wird weder beseitigt noch über den Vers hinaus eindeutig mit Zion identifiziert.
- issue: Sprecherbezug von „meine Augen“
  choice: Das Pronomen der ersten Person ohne ausdrückliche Identifizierung beibehalten
  alternative: Ausdrückliche Zuordnung der Tränen zu Jeremia oder zu Gott
  rationale: Der Vers lässt im unmittelbaren Wortlaut offen, ob die Klage als Stimme des Propheten oder als vermittelte Rede Gottes gehört wird. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung von נַחְלָה bei der Wunde
  choice: „überaus schlimm“
  alternative: „unheilbar“
  rationale: „Unheilbar“ ist lexikalisch möglich, würde aber eine stärkere Festlegung vornehmen. Die allgemeinere Wiedergabe bewahrt die Schwere und lässt die Nuance offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Syntax ist leicht geglättet, während Personifikation, Intensität und echte lexikalische beziehungsweise theologische Mehrdeutigkeiten erhalten bleiben.
