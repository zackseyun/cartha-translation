source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
translation:
  language: de
  text: Auch wenn unsere Schuld gegen uns zeugt[a], Jahwe, handle um deines Namens willen! Denn wir haben uns oft abgewandt[b]; gegen dich haben wir gesündigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn unsere Schuld gegen uns zeugt“. Das hebräische אִם kann hier konditional („wenn“) oder konzessiv („auch wenn“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Denn zahlreich sind unsere Abkehrungen.“ Das hebräische Wort bezeichnet wiederholte Abkehr und Untreue gegenüber Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Auch wenn
  rationale: אִם kann eine Bedingung oder ein Zugeständnis einleiten. Im Gebetszusammenhang wird die Schuld eingeräumt, ohne die Bitte aufzugeben; daher passt die konzessive Wiedergabe „Auch wenn“. Die konditionale Möglichkeit bleibt in Fußnote [a] erhalten.
- source_word: עֲוֺנֵינוּ
  choice: unsere Schuld
  rationale: עָוֹן bezeichnet sowohl schuldhafte Verfehlung als auch die daraus erwachsende Schuld. „Schuld“ ist im modernen Deutsch gewichtig und natürlich, ohne den Ausdruck auf einzelne Sündentaten zu verengen.
- source_word: עָנוּ בָנוּ
  choice: gegen uns zeugt
  rationale: ענה mit ב kann hier forensisch das Antworten beziehungsweise Zeugnisablegen gegen jemanden ausdrücken. „gegen uns zeugt“ bewahrt dieses Bild prägnant.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲשֵׂה
  choice: handle
  rationale: Der Imperativ ist bewusst allgemein. „Handle“ bringt die Bitte um Gottes Eingreifen zum Ausdruck, ohne dessen konkrete Gestalt über den Ausgangstext hinaus festzulegen.
- source_word: לְמַעַן שְׁמֶךָ
  choice: um deines Namens willen
  rationale: Die feste Wendung appelliert an Gottes Namen, also an seine offenbare Identität und sein Ansehen. Die traditionelle deutsche Formulierung ist verständlich und würdevoll.
- source_word: כִּי רַבּוּ
  choice: Denn zahlreich sind
  rationale: כִּי begründet die Bitte beziehungsweise das Bekenntnis; רַבּוּ beschreibt die große Zahl oder das Anwachsen der Abwendungen. „Denn zahlreich sind“ erhält die Satzverknüpfung und den Nachdruck.
- source_word: מְשׁוּבֹתֵינוּ
  choice: die Male, die wir uns von dir abgewandt haben
  rationale: Das Nomen bezeichnet wiederholte Abkehr oder Untreue. Die verbale Wendung ist im heutigen Deutsch natürlicher als „Abtrünnigkeiten“ oder „Rückfälle“ und erhält durch „die Male“ den Plural.
- source_word: לְךָ חָטָאנוּ
  choice: gegen dich haben wir gesündigt
  rationale: Bei חטא bezeichnet לְךָ die betroffene beziehungsweise verletzte Person. Die deutsche Verbindung „gegen jemanden sündigen“ gibt dies idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname steht ausdrücklich im Ausgangstext. Seine Wiedergabe als „Jahwe“ bewahrt den Unterschied zwischen Name und Titel.
- issue: Bedeutung von מְשׁוּבֹתֵינוּ
  choice: die Male, die wir uns von dir abgewandt haben
  alternative: unsere Abtrünnigkeiten
  rationale: Die Formulierung stellt die wiederholte Abkehr von Gott heraus, ohne einen späteren technischen Begriff von Apostasie aufzuzwingen. Das ergänzte „von dir“ wird durch das unmittelbar folgende לְךָ und den Zusammenhang der Bundesuntreue gestützt.
- issue: Logische Kraft von אִם
  choice: 'konzessiv: „Auch wenn“'
  alternative: 'konditional: „Wenn“'
  rationale: Der Zusammenhang ist ein Schuldbekenntnis mit gleichzeitiger Bitte um Eingreifen. Eine konzessive Lesart entspricht diesem Gedankengang, doch die echte grammatische Mehrdeutigkeit wird in Fußnote [a] offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung „Denn zahlreich sind …“ bewahrt den feierlichen Nachdruck, während die verbale Wiedergabe von מְשׁוּבֹתֵינוּ auch ohne theologisches Fachvokabular verständlich bleibt. Beide Fußnotenmarker [a] und [b] stehen im Haupttext.
