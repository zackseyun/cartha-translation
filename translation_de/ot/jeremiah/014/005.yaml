source:
  edition: WLC
  text: כִּ֤י גַם אַיֶּ֨לֶת֙ בַּ/שָּׂדֶ֔ה יָלְדָ֖ה וְ/עָז֑וֹב כִּ֥י לֹֽא הָיָ֖ה דֶּֽשֶׁא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/005.yaml
  text: For even the doe in the field gives birth and abandons her young[a], because there is no grass.
translation:
  language: de
  text: Denn selbst die Hirschkuh auf dem Feld bringt ihr Junges zur Welt und verlässt es[a], weil es kein Gras gibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und verlässt [es]“. Das Objekt wird im Hebräischen nicht ausdrücklich genannt; gemeint ist das neugeborene Junge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Klage ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: גַם
  choice: selbst
  rationale: Betont, dass die Dürre sogar wild lebende Tiere zu widernatürlichem Verhalten zwingt.
- source_word: אַיֶּלֶת
  choice: die Hirschkuh
  rationale: Bezeichnet ein weibliches Tier der Hirschfamilie; „Hirschkuh“ ist im modernen Deutschen präzise und verständlich.
- source_word: בַּשָּׂדֶה
  choice: auf dem Feld
  rationale: Bewahrt das konkrete Bild des offenen Landes; bei „Feld“ ist im Deutschen die Präposition „auf“ idiomatisch.
- source_word: יָלְדָה
  choice: bringt ihr Junges zur Welt
  rationale: Gibt das Gebären eines Jungtiers natürlich wieder. Das Präsens unterstützt die anschauliche poetische Schilderung.
- source_word: וְעָזוֹב
  choice: und verlässt es
  rationale: Das ungewöhnliche Infinitiv-Absolutus-Gefüge steht hier im Zusammenhang als Fortsetzung der finiten Verbform. Der hebräische Text nennt kein Objekt; „es“ verweist zurückhaltend auf das geborene Junge.
- source_word: כִּי לֹא הָיָה
  choice: weil es kein ... gibt
  rationale: Nennt den Grund für das Verlassen. Das deutsche Präsens passt zur lebendigen Darstellung der gegenwärtigen Dürre.
- source_word: דֶּשֶׁא
  choice: Gras
  rationale: Bezeichnet frisches Grün beziehungsweise jungen Graswuchs; „Gras“ ist hier die klare und knappe Entsprechung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter Bildsprache. Die implizite Objektangabe des Hebräischen wird nur durch das Pronomen „es“ ergänzt und in der Fußnote offengelegt.
