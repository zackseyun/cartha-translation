  text: אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ עַל דִּבְרֵ֖י הַ/בַּצָּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/001.yaml
  text: The word of Yahweh that came to Jeremiah concerning the droughts[a].
translation:
  language: de
  text: Das Wort Jahwes, das an Jeremia erging, über die Dürren[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die mit der Dürre zusammenhängenden Ereignisse“ oder: „über die Dürre“. Im Hebräischen steht die Mehrzahl; sie kann wiederholte Dürreperioden oder mehrere durch die Dürre ausgelöste Notlagen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: Das Wort Jahwes, das an Jeremia erging
  rationale: Die geläufige prophetische Formel wird im Deutschen idiomatisch mit „erging an“ wiedergegeben; „Wort“ bewahrt dabei die unmittelbare Verbindung zu דָּבָר.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: עַל דִּבְרֵי
  choice: über
  rationale: Die Verbindung bezeichnet hier das Thema der folgenden Botschaft. „Über“ gibt dies knapp und natürlich wieder, ohne das darin enthaltene דִּבְרֵי unnatürlich als „Worte“ zu verdoppeln.
- source_word: הַבַּצָּרוֹת
  choice: die Dürren
  rationale: „Dürren“ bezeichnet Trockenheitsperioden und bewahrt den hebräischen Plural; „Hungersnöte“ wäre stärker deutend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Eigennamen, während „der HERR“ ihn durch einen traditionellen Titel ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Wendung „das Wort … erging an“ bleibt verständlich und wahrt den formelhaften Charakter der Überschrift. Der ungewöhnliche Plural „Dürren“ wird aus Texttreue beibehalten und in der Fußnote erläutert.
