  text: וָ/אֹמַ֞ר אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה הִנֵּ֨ה הַ/נְּבִאִ֜ים אֹמְרִ֤ים לָ/הֶם֙ לֹֽא תִרְא֣וּ חֶ֔רֶב וְ/רָעָ֖ב לֹֽא יִהְיֶ֣ה לָ/כֶ֑ם כִּֽי שְׁל֤וֹם אֱמֶת֙ אֶתֵּ֣ן לָ/כֶ֔ם בַּ/מָּק֖וֹם הַ/זֶּֽה׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/013.yaml
  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: de
  text: 'Da sagte ich: »Ach, Herr, HERR! Sieh doch: Die Propheten sagen zu ihnen: ›Ihr werdet kein Schwert sehen, und keine Hungersnot wird über euch kommen; vielmehr werde ich euch an diesem Ort wirklichen Frieden geben.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Herr, HERR
  rationale: Gibt die Verbindung aus Herrentitel und Gottesnamen wieder; die Kapitälchenkonvention für JHWH wird in Klartext als HERR dargestellt.
- source_word: לֹא תִרְאוּ חֶרֶב
  choice: Ihr werdet kein Schwert sehen
  rationale: Bewahrt das konkrete Bild und die hebräische Ausdrucksweise, die das Erleben von Krieg bezeichnet.
- source_word: וְרָעָב לֹא יִהְיֶה לָכֶם
  choice: und keine Hungersnot wird über euch kommen
  rationale: Natürliches modernes Deutsch für die idiomatische Aussage, dass sie keine Hungersnot treffen werde.
- source_word: שְׁלוֹם אֱמֶת
  choice: dauerhaften Frieden
  rationale: אֱמֶת bezeichnet hier wahrscheinlich verlässlichen, beständigen Frieden, nicht bloß Frieden im Gegensatz zu Unwahrheit.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Der Gottesname in אֲדֹנָי יְהוִה
  choice: Herr, HERR
  alternative: Herr JHWH / Herr, Jahwe
  rationale: Die traditionelle deutsche Kennzeichnung des Tetragramms als HERR bleibt erkennbar, ohne eine bestimmte Rekonstruktion seiner Aussprache festzulegen.
- issue: Status der Friedensverheißung
  choice: Als direkte Rede der Propheten wiedergegeben
  alternative: Sprachlich als tatsächliche göttliche Verheißung markieren
  rationale: Der Vers berichtet Jeremias Einwand und zitiert die prophetische Behauptung; ob sie wahr ist, wird hier nicht vorweggenommen oder harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Klageruf »Ach« und die Aufforderung »Sieh doch« erhalten Jeremias eindringlichen Ton; die verschachtelte direkte Rede bleibt klar gekennzeichnet.
