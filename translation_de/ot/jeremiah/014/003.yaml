base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
translation:
  language: de
  text: Ihre Vornehmen schicken ihre Diener nach Wasser[a]. Sie kommen zu den Zisternen[b], finden aber kein Wasser. Mit leeren Gefäßen kehren sie zurück. Sie schämen sich und sind gedemütigt; sie verhüllen ihre Köpfe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre jungen Leute“, „ihre Kinder“ oder „ihre Untergebenen“. Der Zusammenhang legt nahe, dass hier gesellschaftlich niedriger Gestellte gemeint sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gruben“, „Wasserbecken“ oder „Sammelbecken“.'
    reason: lexical_alternative
  - marker: c
    text: Das Verhüllen des Kopfes war ein Zeichen von Scham, Trauer oder großer Not.
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  choice: ihre Vornehmen
  rationale: Das Wort bezeichnet einflussreiche, mächtige oder vornehme Personen. „Vornehme“ gibt hier den gesellschaftlichen Rang natürlich wieder.
- source_word: צְעוּרֵיהֶם
  choice: ihre Diener
  rationale: Der Ausdruck kann wörtlich die Jungen oder Geringen bezeichnen; im Zusammenhang senden ranghohe Personen Untergebene aus. „Diener“ gibt dieses soziale Verhältnis verständlich wieder, während die Altersdeutung in der Fußnote erhalten bleibt.
- source_word: לַמָּיִם
  choice: nach Wasser
  rationale: In Verbindung mit „schicken“ bezeichnet die Wendung den Zweck des Auftrags. „Nach Wasser schicken“ ist idiomatisches Deutsch.
- source_word: גֵּבִים
  choice: Zisternen
  rationale: Gemeint sind Vertiefungen oder Sammelbecken, in denen Wasser aufgefangen wird. Im Kontext der Dürre ist „Zisternen“ eine präzise und verständliche Wiedergabe.
- source_word: שָׁבוּ כְלֵיהֶם רֵיקָם
  choice: Mit leeren Gefäßen kehren sie zurück
  rationale: Die Formulierung bewahrt sowohl die Rückkehr als auch den leeren Zustand der nicht näher bestimmten Wassergefäße und klingt im Deutschen natürlich.
- source_word: בֹּשׁוּ וְהָכְלְמוּ
  choice: Sie schämen sich und sind gedemütigt
  rationale: Zwei verwandte, aber unterscheidbare Ausdrücke geben die verstärkende hebräische Wortpaarung wieder, ohne altertümlich zu klingen.
- source_word: וְחָפוּ רֹאשָׁם
  choice: sie verhüllen ihre Köpfe
  rationale: Die direkte Wiedergabe bewahrt die konkrete kulturelle Geste, statt ihre Bedeutung bereits im Haupttext auszudeuten.
