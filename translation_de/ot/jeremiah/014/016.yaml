  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
translation:
  language: de
  text: 'Und das Volk, dem sie weissagen, wird wegen des Hungers und des Schwertes in die Straßen Jerusalems geworfen werden. Niemand wird sie begraben: sie selbst, ihre Frauen, ihre Söhne und ihre Töchter. Und Ich werde ihr Unheil über sie ausgießen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Bosheit«; auch möglich: »das ihnen gebührende Unheil«. Das hebräische Wort kann sowohl moralisch Böses als auch das daraus entstehende Unheil bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִבְּאִים לָהֶם
  choice: dem sie weissagen
  rationale: Die partizipiale Form bezeichnet das an das Volk gerichtete prophetische Reden. Die deutsche Präsensform gibt den fortdauernden Vorgang natürlich wieder.
- source_word: מֻשְׁלָכִים בְּחֻצוֹת יְרוּשָׁלִַם
  choice: in den Straßen Jerusalems hingeworfen daliegen
  rationale: Der Hophal-Partizip bezeichnet das Geworfensein; im Zusammenhang mit der ausbleibenden Bestattung sind offenbar unbeerdigte Leichname gemeint. „Hingeworfen daliegen“ bewahrt sowohl das gewaltsame Ablegen als auch den resultierenden Zustand.
- source_word: מִפְּנֵי הָרָעָב וְהַחֶרֶב
  choice: wegen des Hungers und des Schwertes
  rationale: מִפְּנֵי drückt hier die Ursache aus. „Schwert“ erhält das konkrete hebräische Gerichtsbild, statt es zu „Krieg“ zu verallgemeinern.
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  choice: Niemand wird sie begraben
  rationale: Die Existenzverneinung mit Partizip besagt, dass niemand da ist, der die Toten bestattet. Das Futur passt im Deutschen zur prophetischen Ankündigung.
- source_word: הֵמָּה נְשֵׁיהֶם וּבְנֵיהֶם וּבְנֹתֵיהֶם
  choice: sie selbst, ihre Frauen, ihre Söhne und ihre Töchter
  rationale: Das wiederaufgenommene, betonte Pronomen wird mit „sie selbst“ wiedergegeben; die anschließende Aufzählung macht den umfassenden Charakter des Gerichts deutlich.
- source_word: וְשָׁפַכְתִּי עֲלֵיהֶם
  choice: ich werde … über sie ausgießen
  rationale: Die konkrete Metapher des Ausgießens wird bewahrt, da sie die Wucht des angekündigten Gerichts trägt.
- source_word: אֶת רָעָתָם
  choice: ihr Unheil
  rationale: רָעָה kann moralische Bosheit oder das daraus folgende Unheil bezeichnen. Im Gerichtsbild des Ausgießens ist „Unheil“ im Haupttext natürlich, während die mögliche Rückbeziehung auf ihre eigene Bosheit in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Bedeutung von רָעָתָם in der Gerichtsankündigung
  choice: ihr Unheil
  alternative: ihre Bosheit; das ihnen gebührende Unheil
  rationale: Der Ausdruck kann entweder ihre moralische Schuld oder das als Vergeltung über sie kommende Unheil bezeichnen. Der Haupttext folgt dem im Kontext naheliegenden Unheilssinn, ohne die echte Mehrdeutigkeit zu verschweigen; die Alternativen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weissagen“ erhält den prophetischen Bezug; „hingeworfen daliegen“ vermeidet das im Deutschen missverständliche „hinausgeworfen werden“ und verdeutlicht den Zustand unbestatteter Toter. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
