  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und Bilder des Hebräischen insgesamt zutreffend wieder: Juda trauert, seine Tore verfallen, die Tore werden/dunkeln schwarz in Verbindung mit dem Boden, und Jerusalems Notgeschrei steigt auf. Die Wendung קָדְרוּ לָאָרֶץ ist semantisch und syntaktisch umstritten; eine Übersetzung darf weder eine Sitzhaltung noch die Trauerhandlung als alleinigen Sinn festlegen.'
  naturalness: „Sie sind bis zur Erde verdunkelt“ ist im modernen Standarddeutsch unidiomatisch und bleibt in seiner räumlichen Aussage schwer verständlich. „Sie werden schwarz am Boden“ ist als bewusst knappes poetisches Bild verständlich und bewahrt die Offenheit der hebräischen Formulierung. „Verkümmern“ ist für personifizierte Tore natürlicher als „welken dahin“.
  terminology: „Juda“, „Tore“, „Klageschrei“ und „Jerusalem“ sind angemessen. „Schwarz werden“ spiegelt קדר genauer als ein bloß passives „verdunkelt“ und wahrt die mögliche Trauerkonnotation ohne sie im Haupttext auszudeuten.
