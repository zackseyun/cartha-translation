base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/002.yaml
  text: Judah mourns[a], and her gates languish; they grow dark on the ground, and the cry of Jerusalem goes up.
translation:
  language: de
  text: Juda trauert, und seine Tore verkümmern; sie werden schwarz am Boden, und Jerusalems Klageschrei steigt empor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבְלָה
  choice: trauert
  rationale: Das Qal-Perfekt von אבל bezeichnet Trauer oder Klage. Das deutsche Präsens gibt die dichterisch-prophetische Schilderung natürlich wieder.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Übliche deutsche Form des Namens für Land und Volk.
- source_word: שְׁעָרֶיהָ
  choice: seine Tore
  rationale: שׁער bezeichnet konkret die Tore, die zugleich für das öffentliche Leben der Städte stehen können. Das grammatisch feminine Suffix wird im Deutschen dem Neutrum des Namens Juda entsprechend mit „seine“ wiedergegeben.
- source_word: אֻמְלְלוּ
  choice: welken dahin
  rationale: Das Verb bezeichnet ein kraftloses, elendes Dahinschwinden. „Welken dahin“ bewahrt das starke poetische Bild und lässt sich auf die personifizierten Tore beziehen.
- source_word: קָדְרוּ
  choice: sind verdunkelt
  rationale: קדר bezeichnet Dunkel- oder Schwarzwerden und kann Trauer ausdrücken. Die Wiedergabe bleibt beim Zustand der Verdunkelung und fügt keine im Hebräischen unausgesprochene Sitzhaltung hinzu.
- source_word: לָאָרֶץ
  choice: bis zur Erde
  rationale: Die gerichtete Form לָאָרֶץ wird möglichst eng wiedergegeben. Zusammen mit קָדְרוּ entsteht ein Bild tiefster Niedergeschlagenheit, dessen genaue räumliche Beziehung im Hebräischen knapp und mehrdeutig bleibt.
- source_word: צִוְחַת
  choice: Klageschrei
  rationale: Das Substantiv bezeichnet einen lauten Schrei aus Not; „Klageschrei“ macht diese Funktion im Deutschen deutlich.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Namensform.
- source_word: עָלָתָה
  choice: steigt empor
  rationale: עלה bezeichnet das Hinaufsteigen. „Steigt empor“ erhält die räumliche Bildsprache und passt zum gehobenen poetischen Register.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle poetische Standardsprache. Die Parallelismen und die personifizierten Tore bleiben erhalten. Wegen des grammatischen Geschlechts von „Juda“ steht im Deutschen „seine Tore“. Die schwierige Verbindung קָדְרוּ לָאָרֶץ wird im Haupttext quellennah und in der Fußnote mit ihren wichtigsten Deutungsmöglichkeiten wiedergegeben.
