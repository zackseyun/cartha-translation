source:
  edition: WLC
  text: יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖/נוּ עֲוֺ֣ן אֲבוֹתֵ֑י/נוּ כִּ֥י חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
translation:
  language: de
  text: Wir erkennen an, Jahwe, unsere Bosheit und die Schuld unserer Väter[a]; denn wir haben gegen dich gesündigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unserer Vorfahren“. Wörtlich steht im Hebräischen: „unserer Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְנוּ
  choice: Wir erkennen
  rationale: ידע bedeutet wörtlich „wissen/kennen“, hat hier im Bußgebet jedoch die Kraft eines schuldeingestehenden Anerkennens. „Erkennen“ bewahrt sowohl den kognitiven als auch den bekennenden Aspekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רִשְׁעֵנוּ
  choice: unsere Bosheit
  rationale: רֶשַׁע bezeichnet Bosheit beziehungsweise schuldhaftes Unrecht. „Bosheit“ erhält den abstrakten Charakter und steht passend neben „Schuld“.
- source_word: עֲוֺן
  choice: die Schuld
  rationale: עָוֹן kann Vergehen, Schuld oder Schuldfolge bezeichnen. Hier gibt „Schuld“ den moralischen Gehalt natürlich wieder, ohne das Wort mit dem anschließenden „gesündigt“ gleichzusetzen.
- source_word: אֲבוֹתֵינוּ
  choice: unserer Väter
  rationale: Der hebräische Ausdruck lautet ausdrücklich „unsere Väter“ und bezeichnet hier die Vorväter des Volkes; die Formulierung bleibt im Haupttext erhalten.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung des Eingeständnisses ein. „Denn“ entspricht dem Gebetsstil und dem logischen Zusammenhang.
- source_word: חָטָאנוּ
  choice: wir haben gesündigt
  rationale: Das Perfekt bezeichnet begangene Sünde mit fortdauernder Bedeutung für das gegenwärtige Bekenntnis.
- source_word: לָךְ
  choice: gegen dich
  rationale: Bei חטא bezeichnet die Präposition die Person, gegen die sich die Sünde richtet; idiomatisches Deutsch verlangt „gegen dich sündigen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von אֲבוֹתֵינוּ
  choice: unserer Väter
  alternative: unserer Vorfahren
  rationale: Der Ausgangstext verwendet die grammatisch und lexikalisch männliche Bezeichnung „Väter“. Die mögliche umfassendere Bedeutung wird in der Fußnote kenntlich gemacht, nicht stillschweigend in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Gebetsrhythmus. Die Anrede „Jahwe“ steht ohne „o“, da dies im heutigen Deutschen feierlich, aber weniger altertümlich klingt. Die unterschiedlichen Schuldbegriffe des Hebräischen werden mit „Bosheit“ und „Schuld“ erkennbar auseinandergehalten.
