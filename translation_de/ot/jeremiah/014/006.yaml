id: JER.14.6
reference: Jeremiah 14:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פְרָאִים֙ עָמְד֣וּ עַל שְׁפָיִ֔ם שָׁאֲפ֥וּ ר֖וּחַ כַּ/תַּנִּ֑ים כָּל֥וּ עֵינֵי/הֶ֖ם כִּי אֵ֥ין עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/006.yaml
  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
translation:
  language: de
  text: Auch die Wildesel[a] stehen auf den kahlen Höhen. Sie schnappen nach Luft[b] wie Schakale[c]. Ihre Augen versagen, denn es gibt kein Gras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halbesel“. Gemeint sind wild lebende Esel, nicht verwilderte Haustiere.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Sie ziehen Wind ein“; möglich ist auch: „Sie keuchen nach Luft“.'
    reason: lexical_alternative
  - marker: c
    text: Ältere Übersetzungen geben das hebräische Wort teils mit „Drachen“ wieder; in diesem Wüstenkontext sind sehr wahrscheinlich Schakale gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְרָאִים
  choice: Auch die Wildesel
  rationale: פְרָאִים bezeichnet wild lebende Esel bzw. Halbesel. „Wildesel“ ist im modernen Deutschen verständlich und unterscheidet sie von domestizierten Eseln. Das וּ wird im Zusammenhang der umfassenden Dürre passend mit „auch“ wiedergegeben.
- source_word: עָמְדוּ עַל שְׁפָיִם
  choice: stehen auf den kahlen Höhen
  rationale: שְׁפָיִם meint kahle, unbewachsene Anhöhen. Das Präsens stellt die geschilderte Dürreszene anschaulich als gegenwärtigen Zustand dar.
- source_word: שָׁאֲפוּ רוּחַ
  choice: Sie schnappen nach Luft
  rationale: Die Wendung bedeutet wörtlich, Wind bzw. Luft einzuziehen. „Nach Luft schnappen“ vermittelt im Dürrekontext die verzweifelte Atmung der Tiere natürlich und präzise.
- source_word: כַּתַּנִּים
  choice: wie Schakale
  rationale: In diesem irdischen Wüstenkontext bezeichnet תַּנִּים am wahrscheinlichsten Schakale, die in prophetischen Texten mit verwüsteten Gegenden verbunden sind.
- source_word: כָּלוּ עֵינֵיהֶם
  choice: Ihre Augen versagen
  rationale: כלה in Verbindung mit den Augen beschreibt deren Schwinden oder Versagen infolge völliger Erschöpfung. Die Formulierung bewahrt die starke körperliche Bildsprache.
- source_word: כִּי אֵין עֵשֶׂב
  choice: denn es gibt kein Gras
  rationale: עֵשֶׂב bezeichnet hier die für Weidetiere verfügbare Gras- und Krautvegetation. „Gras“ ist im Zusammenhang knapp und idiomatisch.
