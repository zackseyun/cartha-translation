    rationale: Die hebräische Verbindung kann konkrete Hungerleidende meinen, bezeichnet aber Leid bzw. Krankheit infolge der Hungersnot breiter. „Hungerkranke“ ist idiomatischer und wahrt diese Breite.
  - severity: low
    issue: Die Fußnote formuliert die letzte Alternative mit „verstehen nicht“ statt „wissen nicht“.
    rationale: ידע ist hier objektlos. „Wissen nicht“ entspricht dem Haupttext und erhält die Auslassung eines Objekts; „verstehen nicht“ legt eher ein intellektuelles Erfassen nahe.
