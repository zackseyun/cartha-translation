source:
  edition: WLC
  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
translation:
  language: de
  text: 'Wenn ich aufs Feld hinausgehe: Sieh da, vom Schwert Erschlagene! Und wenn ich in die Stadt komme: Sieh da, Hungerkranke! Denn sowohl Prophet als auch Priester ziehen im Land umher und wissen nicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Schlusssatz ist schwer zu deuten. Möglich ist auch: „Denn sowohl Prophet als auch Priester treiben Handel im Land und wissen nicht“, oder: „Sie sind in ein Land gezogen, das sie nicht kennen.“'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם יָצָאתִי הַשָּׂדֶה
  choice: Wenn ich aufs Feld hinausgehe
  rationale: אִם mit der Perfektform stellt hier anschaulich zwei mögliche Blickrichtungen gegenüber. Das deutsche Präsens gibt diese lebendige Beobachtung natürlich wieder; „Feld“ bewahrt den Gegensatz zur Stadt.
- source_word: וְהִנֵּה
  choice: Sieh da
  rationale: Die deiktische Partikel lenkt den Blick unvermittelt auf das erschütternde Bild. „Sieh da“ ist würdig, verständlich und weniger altertümlich als „siehe“.
- source_word: חַלְלֵי חֶרֶב
  choice: vom Schwert Erschlagene
  rationale: Die Genitivverbindung bezeichnet Menschen, die durch das Schwert beziehungsweise im Krieg getötet wurden.
- source_word: וְאִם בָּאתִי הָעִיר
  choice: Und wenn ich in die Stadt komme
  rationale: בוא mit einem Ziel bezeichnet das Hineinkommen; die Formulierung bildet einen natürlichen Gegensatz zum Hinausgehen aufs Feld.
- source_word: תַּחֲלוּאֵי רָעָב
  choice: vom Hunger Erkrankte
  rationale: Die schwierige Verbindung bezeichnet wahrscheinlich Menschen, die durch die Hungersnot krank geworden sind, und steht parallel zu den Erschlagenen.
- source_word: כִּי גַם נָבִיא גַם כֹּהֵן
  choice: Denn sowohl Prophet als auch Priester
  rationale: כִּי führt eine Erklärung an; die Wiederholung von גַם schließt beide Gruppen nachdrücklich ein.
- source_word: סָחֲרוּ אֶל אֶרֶץ
  choice: ziehen im Land umher
  rationale: סחר kann das Umherziehen und auch Handelstätigkeit bezeichnen. Die neutrale Bewegungsformulierung passt zur Orientierungslosigkeit, ohne die mögliche Handelsbedeutung auszuschließen.
- source_word: וְלֹא יָדָעוּ
  choice: und wissen nicht
  rationale: Die objektlose hebräische Aussage bleibt bewusst objektlos. So wird weder „was sie tun sollen“ ergänzt noch die Wendung sicher mit einem unbekannten Land verbunden.
theological_decisions:
- issue: Darstellung von Prophet und Priester im Gericht
  choice: Auch Prophet und Priester erscheinen als umherziehend und unwissend.
  alternative: Sie könnten Handel treiben oder in ein ihnen unbekanntes Land gelangt sein.
  rationale: Der schwierige hebräische Schluss erlaubt mehrere Deutungen. Die Übersetzung macht weder eine bestimmte Schuld noch Exil oder Handel ausdrücklich und bewahrt die Spannung des Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Ausrufe erhalten die unmittelbare Schau des hebräischen Textes; der schwierige Schlusssatz wird im Haupttext eng und bewusst offen wiedergegeben.
