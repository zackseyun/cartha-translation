  to: 'Wenn ich aufs Feld hinausgehe: Sieh da, vom Schwert Erschlagene! Und wenn ich in die Stadt komme: Sieh da, Hungerkranke! Denn sowohl Prophet als auch Priester ziehen im Land umher und wissen nicht.[a]'
  rationale: Die Revision verbessert allein die idiomatische deutsche Wiedergabe der Hungeropfer und gleicht die Fußnote an die bewusst offene, objektlose Formulierung des hebräischen Verbs „wissen“ an. Die schwierige Aussage über Prophet und Priester bleibt im Haupttext wie in der Anmerkung ausdrücklich offen.
