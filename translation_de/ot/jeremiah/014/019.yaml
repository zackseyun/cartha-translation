source:
  edition: WLC
  text: הֲ/מָאֹ֨ס מָאַ֜סְתָּ אֶת יְהוּדָ֗ה אִם בְּ/צִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔/ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔/נוּ וְ/אֵ֥ין לָ֖/נוּ מַרְפֵּ֑א קַוֵּ֤ה לְ/שָׁלוֹם֙ וְ/אֵ֣ין ט֔וֹב וּ/לְ/עֵ֥ת מַרְפֵּ֖א וְ/הִנֵּ֥ה בְעָתָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
translation:
  language: de
  text: 'Hast du Juda ganz und gar verworfen? Oder[a] verabscheut deine Seele[b] Zion? Warum hast du uns geschlagen, und es gibt für uns keine Heilung? Wir hofften auf Frieden, doch da war nichts Gutes, und auf eine Zeit der Heilung, doch siehe: Entsetzen!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier mit »oder« wiedergegebene hebräische Wort kann auch lediglich die zweite Frage einleiten: »Verabscheut deine Seele Zion?«'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch »deine Seele«; gemeint sein kann das innerste Selbst oder die ganze Person.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/מָאֹס מָאַסְתָּ
  choice: Hast du ... wirklich völlig verworfen?
  rationale: Der Infinitivus absolutus zusammen mit der finiten Verbform verstärkt מָאַס. »Wirklich völlig verworfen« gibt sowohl die emphatische Frage als auch die Intensivierung in natürlichem Deutsch wieder.
- source_word: אִם
  choice: Oder
  rationale: אִם kann hier die zweite Frage disjunktiv an die erste anschließen. »Oder« bewahrt diese mögliche Verknüpfung, ohne die beiden Fragen zu einer Alternative mit eindeutig festgelegter Logik zu verengen.
- source_word: גָּעֲלָה נַפְשֶׁךָ
  choice: verabscheut deine Seele
  rationale: געל bezeichnet starke Abscheu; die vergleichsweise formnahe Wiedergabe von נֶפֶשׁ als »Seele« erhält das eindringliche hebräische Bild vom innersten beziehungsweise ganzen Selbst.
- source_word: הִכִּיתָנוּ
  choice: hast du uns geschlagen
  rationale: »Geschlagen« bewahrt die konkrete Bedeutung von נכה und den Zusammenhang mit der unmittelbar folgenden fehlenden Heilung.
- source_word: מַרְפֵּא
  choice: Heilung
  rationale: Das Substantiv erscheint zweimal. Die einheitliche Wiedergabe als »Heilung« erhält das Bild der Genesung von einem Schlag oder einer Wunde.
- source_word: קַוֵּה לְשָׁלוֹם
  choice: Wir hofften auf Frieden
  rationale: Die ungewöhnliche masoretische Formulierung drückt im Zusammenhang eine enttäuschte Erwartung aus. Die finite deutsche Form gibt den Klagezusammenhang verständlich wieder.
- source_word: וְאֵין טוֹב
  choice: doch es kam nichts Gutes
  rationale: טוֹב bleibt mit »Gutes« bewusst allgemein. »Es kam« macht im Deutschen die enttäuschte Erwartung idiomatisch deutlich, ohne sie auf Wohlstand oder Sicherheit einzuengen.
- source_word: וְהִנֵּה בְעָתָה
  choice: 'doch siehe: Entsetzen!'
  rationale: »Siehe« bewahrt den abrupten deiktischen Ausruf הִנֵּה; »Entsetzen« gibt בְּעָתָה als plötzlich erfahrenen Schrecken wieder.
theological_decisions:
- issue: Gottes mögliche Verwerfung Judas und Abscheu gegenüber Zion
  choice: Die direkten, scharfen Fragen der Klage bleiben ungemildert stehen.
  alternative: Die Aussagen als bloße zeitweilige Züchtigung oder als scheinbare Verlassenheit auslegen.
  rationale: Der hebräische Text formuliert die bedrängende Frage nach Gottes Verwerfung ausdrücklich. Die Übersetzung soll diese bundestheologische Spannung bewahren und keine im Vers selbst nicht gegebene Auflösung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der eindringlichen Sprache eines Gebets in der Not. Die konkreten Bilder von Schlagen und Heilung sowie das anthropomorphe »deine Seele« bleiben erhalten; der Schluss ist entsprechend dem abrupten hebräischen Ausruf knapp und erschütternd formuliert.
