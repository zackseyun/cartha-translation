source:
  edition: WLC
  text: אַל תִּנְאַץ֙ לְמַ֣עַן שִׁמְ/ךָ֔ אַל תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑/ךָ זְכֹ֕ר אַל תָּפֵ֥ר בְּרִֽיתְ/ךָ֖ אִתָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
translation:
  language: de
  text: Verachte uns nicht um deines Namens willen; entehre nicht den Thron deiner Herrlichkeit. Denk daran; brich deinen Bund mit uns nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּנְאַץ
  choice: Verachte uns nicht
  rationale: Das Verb נאץ bezeichnet eine von Verachtung geprägte Zurückweisung. „Verachte“ bewahrt diese stärkere emotionale Färbung; „uns“ ist im Gebetszusammenhang und durch „mit uns“ am Versende impliziert.
- source_word: לְמַעַן שִׁמְךָ
  choice: um deines Namens willen
  rationale: Die feste deutsche Wendung gibt den Appell an Gottes Namen, also an seine Ehre und sein offenbartes Wesen, knapp und würdig wieder.
- source_word: תְּנַבֵּל
  choice: entehre
  rationale: Das Piel von נבל bedeutet hier, etwas schändlich zu behandeln oder seiner Ehre zu berauben. „Entehre“ passt zum Thron und legt nicht unnötig eine kultische Verunreinigung nahe.
- source_word: כִּסֵּא כְבוֹדֶךָ
  choice: den Thron deiner Herrlichkeit
  rationale: Die deutsche Genitivverbindung bildet die hebräische Konstruktverbindung eng ab und bleibt zugleich verständlich und würdig.
- source_word: זְכֹר
  choice: Denk daran
  rationale: Der direkte Imperativ wird in heutigem Deutsch natürlich wiedergegeben. „Daran“ verweist ohne zusätzliche inhaltliche Festlegung auf den Bund beziehungsweise die vorgebrachte Bitte.
- source_word: תָּפֵר
  choice: brich ... nicht
  rationale: פרר ist eine übliche Verbindung mit בְּרִית und bedeutet, einen Bund zu brechen oder ungültig zu machen. „Brechen“ ist im Deutschen die klare, etablierte Bundessprache.
- source_word: בְּרִיתְךָ אִתָּנוּ
  choice: deinen Bund mit uns
  rationale: Die Formulierung gibt sowohl das Possessivsuffix als auch אִתָּנוּ direkt wieder, ohne die nicht ausdrücklich genannten Worte „geschlossen hast“ einzufügen.
theological_decisions:
- issue: Bezug des „Throns deiner Herrlichkeit“
  choice: Die bildhafte Wendung bleibt ohne nähere Bestimmung stehen.
  alternative: Der Tempel beziehungsweise Zion als irdischer Thron Gottes oder Gottes himmlischer Thron.
  rationale: Der hebräische Ausdruck lässt einen mehrschichtigen Bezug zu. Die Übersetzung entscheidet nicht zwischen Tempel, Zion und himmlischem Thron.
- issue: Ergänzung des Objekts „uns“ beim ersten Verb
  choice: „uns“ wird aus dem Gebetszusammenhang ergänzt.
  alternative: Objektlose Wiedergabe wie „Verachte nicht“ oder Ergänzung eines anderen Bezugs.
  rationale: Im Deutschen verlangt die Aussage für natürliche Verständlichkeit ein Objekt; der abschließende Ausdruck „deinen Bund mit uns“ macht die betende Gemeinschaft als gemeinten Bezug deutlich, ohne die theologische Aussage weiter einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Imperativen. „Um deines Namens willen“ und „Bund brechen“ sind etablierte, gut verständliche religiöse Wendungen. Das Semikolon nach „Denk daran“ bewahrt die markante Folge der hebräischen Imperative.
