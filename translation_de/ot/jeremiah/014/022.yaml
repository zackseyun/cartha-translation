source:
  edition: WLC
  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
translation:
  language: de
  text: Gibt es unter den nichtigen Götzen[a] der Völker solche, die Regen bringen? Oder kann der Himmel Regenschauer geben? Bist nicht du es, Jahwe, unser Gott? Und auf dich warten wir[b], denn du hast dies alles gemacht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Nichtigkeiten der Völker“; gemeint sind deren Götter oder Götzen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und auf dich hoffen wir.“ Das hebräische Verb bezeichnet ein Warten in erwartungsvoller Hoffnung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „du hast dies alles getan.“'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיֵשׁ
  choice: Gibt es … welche
  rationale: Gibt die rhetorische Existenzfrage in natürlichem Deutsch wieder; „welche“ nimmt den pluralischen Zusammenhang auf.
- source_word: הַבְלֵי הַגּוֹיִם
  choice: die nichtigen Götzen der Völker
  rationale: הֶבֶל bezeichnet wörtlich etwas Hauchhaftes, Nichtiges oder Wertloses und meint hier polemisch die Götter beziehungsweise Götzen der Völker. „Nichtige Götzen“ bewahrt sowohl Wertung als auch Referenz.
- source_word: מַגְשִׁמִים
  choice: die Regen bringen
  rationale: Die Kausativform bezeichnet das Hervorbringen von Regen; die gewählte Formulierung ist präzise und idiomatisch.
- source_word: וְאִם
  choice: Oder
  rationale: Leitet den zweiten Teil der rhetorischen Alternative ein und wird im Deutschen am natürlichsten mit „Oder“ wiedergegeben.
- source_word: הַשָּׁמַיִם
  choice: der Himmel
  rationale: Das morphologisch pluralische hebräische Wort bezeichnet hier den Himmel als den Bereich, aus dem Regen kommt; im Deutschen ist der Singular idiomatisch.
- source_word: יִתְּנוּ רְבִבִים
  choice: Regenschauer geben
  rationale: Folgt dem Verb נתן („geben“) eng und gibt רְבִבִים als „Regenschauer“ wieder.
- source_word: הֲלֹא אַתָּה הוּא
  choice: Bist nicht du es
  rationale: Bewahrt die emphatische rhetorische Identifikation und hebt „du“ als alleinige Antwort hervor.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Direkte und natürliche Wiedergabe der Possessivverbindung.
- source_word: וּנְקַוֶּה לָּךְ
  choice: Und auf dich warten wir
  rationale: קוה verbindet Warten mit erwartungsvoller Hoffnung. Die Voranstellung von „auf dich“ bewahrt den Nachdruck des Gebets, ohne die Bedeutungsbreite auf bloßes Hoffen zu verengen.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für das erwartungsvolle Warten ein.
- source_word: עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: du hast dies alles gemacht
  rationale: עשה kann sowohl „tun“ als auch „machen“ bedeuten. Im Zusammenhang mit Himmel und Regen bringt „gemacht“ Gottes wirksame Urheberschaft zum Ausdruck, ohne die Alternative auszuschließen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Bedeutung von עָשִׂיתָ אֶת כָּל אֵלֶּה
  choice: du hast dies alles gemacht
  alternative: du hast dies alles getan
  rationale: „Gemacht“ passt zum unmittelbaren Zusammenhang von Himmel und Regen und betont Gottes Urheberschaft; da עשה auch „tun“ bedeuten kann, wird die Alternative in einer Fußnote bewahrt.
- issue: Bedeutung von קוה
  choice: auf dich warten
  alternative: auf dich hoffen
  rationale: Das Verb umfasst erwartungsvolles Warten und Hoffen. Die Hauptfassung bewahrt das konkrete Bild des Wartens, die Fußnote dessen Hoffnungskomponente.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die rhetorischen Fragen und die emphatische Stellung von „du“ beziehungsweise „auf dich“ bleiben erhalten. Fachsprachliche oder konfessionell geprägte Formulierungen werden vermieden.
