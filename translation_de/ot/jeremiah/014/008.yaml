source:
  edition: WLC
  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
translation:
  language: de
  text: Du Hoffnung Israels, sein Retter zur Zeit der Not, warum solltest du wie ein Fremder im Land sein[a], wie ein Reisender, der einkehrt, um zu übernachten?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein ansässiger Fremder im Land“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wie ein Reisender, der nur für die Nacht Halt macht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה
  choice: Hoffnung
  rationale: Im unmittelbaren Gebetszusammenhang bezeichnet das Substantiv den, auf den Israel hofft. „Hoffnung“ ist im Deutschen natürlich und bewahrt die Kraft der direkten Anrede; konkrete Bedeutungen wie „Sammelbecken“ passen hier nicht.
- source_word: מוֹשִׁיעוֹ
  choice: sein Retter
  rationale: Das Suffix der 3. Person maskulin Singular bezieht sich auf Israel als Kollektivsingular. „Sein Retter“ gibt diese grammatische Beziehung knapp und verständlich wieder.
- source_word: בְּעֵת צָרָה
  choice: in der Zeit der Not
  rationale: Die Wendung bezeichnet eine Krisen- und Bedrängniszeit. „In der Zeit der Not“ ist geläufig, würdig und inhaltlich präzise.
- source_word: לָמָּה תִהְיֶה
  choice: warum solltest du … sein
  rationale: Der Imperfekt steht in einer klagenden rhetorischen Frage. Die modale Formulierung wahrt den protestierenden Ton, ohne ihn als bloße Zukunftsaussage wiederzugeben.
- source_word: כְּגֵר בָּאָרֶץ
  choice: wie ein Fremder im Land
  rationale: גֵר bezeichnet einen Menschen, der nicht zur einheimischen Bevölkerung gehört und als Fremder im Land lebt. „Fremder“ ist verständlich und lässt die genauere soziale Stellung offen.
- source_word: וּכְאֹרֵחַ
  choice: wie ein Reisender
  rationale: Das Wort bezeichnet jemanden, der unterwegs ist. „Reisender“ ist modernes Standarddeutsch und vermeidet das altertümliche „Wandersmann“.
- source_word: נָטָה לָלוּן
  choice: der einkehrt, um zu übernachten
  rationale: Die Formulierung beschreibt das Abbiegen beziehungsweise Einkehren zu einer nur vorübergehenden Übernachtung. Die gewählte Wiedergabe klingt natürlich und bewahrt den Gedanken eines kurzen Aufenthalts.
theological_decisions:
- issue: Direkte Anrede Gottes und titelartige Prädikate
  choice: „Du Hoffnung Israels, sein Retter in der Zeit der Not!“ als unmittelbare Anrede Gottes
  alternative: „Hoffnung Israels und sein Retter in der Zeit der Not“ ohne ausdrücklich markierten Anredepartikel
  rationale: Der Vers gehört zu einem Gebet an den HERRN; die Nominalgruppen bezeichnen Gott in direkter Anrede. „Du“ macht diese syntaktische Funktion im Deutschen klar, ohne zusätzliche dogmatische Aussagen einzutragen.
- issue: Klagende Frage nach Gottes scheinbarer Fremdheit
  choice: Das Bild wird als rhetorische Frage mit „warum solltest du … sein“ bewahrt.
  alternative: „Warum verhältst du dich wie …“
  rationale: Die Alternative erklärt das Bild bereits als Verhalten. Die gewählte Fassung bleibt näher am hebräischen „sein“ und erhält die theologische Spannung der Klage über Gottes scheinbare Abwesenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gebetssprache. Die Ausrufung am Anfang markiert die direkte Anrede; die anschließende Frage bewahrt den klagenden Ton. Altertümliche oder stark fachsprachliche Wörter werden vermieden.
