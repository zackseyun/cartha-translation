  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַֽל הַ/נְּבִאִ֞ים הַ/נִּבְּאִ֣ים בִּ/שְׁמִ/י֮ וַ/אֲנִ֣י לֹֽא שְׁלַחְתִּי/ם֒ וְ/הֵ֨מָּה֙ אֹֽמְרִ֔ים חֶ֣רֶב וְ/רָעָ֔ב לֹ֥א יִהְיֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את בַּ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִתַּ֔מּוּ הַ/נְּבִאִ֖ים הָ/הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
translation:
  language: de
  text: 'Darum, so spricht Yahweh über die Propheten, die in meinem Namen weissagen, obwohl ich sie nicht gesandt habe, und die sagen: »Schwert und Hunger wird es in diesem Land nicht geben«[a]: Durch Schwert und Hunger werden diese Propheten umkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Krieg und Hunger werden nicht über dieses Land kommen.« Wörtlich: »Schwert und Hunger wird es in diesem Land nicht geben.«'
    reason: Lexikalische und idiomatische Übersetzungsalternative für חֶרֶב und den hebräischen Existenzsatz.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang klar und natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: spricht Yahweh
  rationale: Bewahrt die würdige prophetische Botenformel in geläufigem biblischem Deutsch und gibt den Gottesnamen als Yahweh wieder.
- source_word: עַל
  choice: über
  rationale: Führt die Propheten als Gegenstand des göttlichen Ausspruchs ein, ohne die wertende Bedeutung von „gegen“ in die Präposition hineinzulesen.
- source_word: הַנְּבִאִים הַנִּבְּאִים
  choice: die Propheten, die … weissagen
  rationale: Erhält die hebräische Verbindung des Nomens „Propheten“ mit dem verwandten Verb „weissagen“.
- source_word: בִּשְׁמִי
  choice: in meinem Namen
  rationale: Gibt den Anspruch wieder, mit Gottes Autorität und als sein Beauftragter zu sprechen.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּים
  choice: obwohl ich sie nicht gesandt habe
  rationale: Macht den Gegensatz zwischen ihrem Autoritätsanspruch und Gottes fehlender Sendung deutlich.
- source_word: וְהֵמָּה אֹמְרִים
  choice: und die sagen
  rationale: Gibt das Partizip direkt wieder, ohne eine nicht zwingend ausgedrückte iterative Nuance hinzuzufügen.
- source_word: חֶרֶב וְרָעָב
  choice: Schwert und Hunger
  rationale: Bewahrt „Schwert“ als wörtliches und prophetisch geprägtes Bild für Krieg sowie den parallelen Ausdruck „Hunger“.
- source_word: לֹא יִהְיֶה בָּאָרֶץ הַזֹּאת
  choice: wird es in diesem Land nicht geben
  rationale: Gibt den hebräischen Existenzsatz in natürlichem modernem Deutsch eng wieder.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: Durch Schwert und Hunger
  rationale: Versteht die Präposition instrumentell und bewahrt die Wiederaufnahme der angekündigten Gerichte.
- source_word: יִתַּמּוּ
  choice: werden … umkommen
  rationale: Drückt im Gerichtskontext das völlige Ende beziehungsweise Verderben der Propheten idiomatisch aus.
- source_word: הַנְּבִאִים הָהֵמָּה
  choice: diese Propheten
  rationale: Verweist nachdrücklich auf genau die zuvor beschriebenen Propheten zurück.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH; „Yahweh“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חֶרֶב
  choice: Schwert
  alternative: Krieg
  rationale: „Schwert“ bewahrt das konkrete prophetische Gerichtsbild, während die übertragene Bedeutung Krieg im Zusammenhang erkennbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und engem Anschluss an den hebräischen Satzbau. „Weissagen“ erhält das Wortspiel zwischen Prophet und prophetischem Reden; „umkommen“ vermeidet das im Deutschen missverständliche „verzehrt werden“.
