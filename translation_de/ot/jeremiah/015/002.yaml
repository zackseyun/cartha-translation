source:
  edition: WLC
  text: וְ/הָיָ֛ה כִּֽי יֹאמְר֥וּ אֵלֶ֖י/ךָ אָ֣נָה נֵצֵ֑א וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה אֲשֶׁ֨ר לַ/מָּ֤וֶת לַ/מָּ֨וֶת֙ וַ/אֲשֶׁ֤ר לַ/חֶ֨רֶב֙ לַ/חֶ֔רֶב וַ/אֲשֶׁ֤ר לָֽ/רָעָב֙ לָֽ/רָעָ֔ב וַ/אֲשֶׁ֥ר לַ/שְּׁבִ֖י לַ/שֶּֽׁבִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
translation:
  language: de
  text: 'Und es wird geschehen: Wenn sie zu dir sagen: »Wohin sollen wir gehen?«, dann sollst du ihnen sagen: »So spricht Jahwe: Wer dem Tod bestimmt ist[a] – zum Tod; wer dem Schwert bestimmt ist – zum Schwert; wer der Hungersnot bestimmt ist – zur Hungersnot; und wer der Gefangenschaft[b] bestimmt ist – zur Gefangenschaft.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: »wer zum Tod – zum Tod«. Die hebräische Wendung lässt die Art der Zuordnung unausgesprochen; auch eine Wiedergabe wie »wer dem Tod verfallen ist« ist möglich.'
    reason: Die elliptische Zuweisungsformel wird erläutert, ohne eine irreführende deutsche Formulierung wie »für den Tod sein« zu verwenden.
  - marker: b
    text: 'Oder: »Verbannung« beziehungsweise »Exil«.'
    reason: Das hebräische Wort kann im Zusammenhang sowohl Gefangenschaft als auch die Wegführung ins Exil bezeichnen.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Verbindung leitet einen erwarteten künftigen Fall ein. Im Deutschen gibt „Und wenn“ den zeitlich-konditionalen Zusammenhang natürlich wieder, ohne ein zusätzliches unpersönliches „es wird geschehen“ einzufügen.
- source_word: אָנָה נֵצֵא
  choice: Wohin sollen wir gehen?
  rationale: אָנָה fragt nach dem Ziel, und נֵצֵא bezeichnet das Weg- beziehungsweise Hinausgehen. Das natürliche deutsche „Wohin sollen wir gehen?“ bewahrt die Zielrichtung, ohne ein im Kontext unnötig schwerfälliges „hinausgehen“ zu erzwingen.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird würdig und knapp wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“ statt als ersetzender Titel.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: Die für den Tod – zum Tod
  rationale: Die elliptische und wiederholende Formulierung des Hebräischen bleibt bewusst stehen. Der Gedankenstrich macht die Zuordnung im Deutschen lesbar, ohne „bestimmt“ oder „verurteilt“ in den Haupttext einzutragen.
- source_word: חֶרֶב
  choice: Schwert
  rationale: Das konkrete Bild bezeichnet hier tödliche Gewalt, besonders Krieg; „Schwert“ bewahrt die prophetische Bildsprache besser als das abstraktere „Krieg“.
- source_word: רָעָב
  choice: Hungersnot
  rationale: Gemeint ist nicht bloß persönlicher Hunger, sondern die Hungersnot als Gerichtskategorie.
- source_word: שְׁבִי / שֶּׁבִי
  choice: Gefangenschaft
  rationale: Das Substantiv bezeichnet Gefangenschaft beziehungsweise Wegführung als Schicksal. „Gefangenschaft“ erhält die Parallelstruktur; „Verbannung“ oder „Exil“ sind kontextuell mögliche Alternativen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Transliteration bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Elliptische Wiederholung der Gerichtskategorien
  choice: Die für den Tod – zum Tod; die für das Schwert – zum Schwert …
  alternative: Die zum Tod bestimmt sind, sollen sterben; die für das Schwert bestimmt sind, sollen durch das Schwert fallen …
  rationale: Der Ausgangstext formuliert auffallend knapp und wiederholt jede Kategorie. Die gewählte Fassung erhält diese Härte und lässt offen, ob die erste Wendung Bestimmung, Zugehörigkeit oder Zuweisung betont, statt die Aussage erklärend aufzulösen.
- issue: Gefangenschaft oder Exil
  choice: Gefangenschaft
  alternative: Exil
  rationale: „Gefangenschaft“ entspricht der unmittelbaren lexikalischen Bedeutung und passt zur wiederholten Gerichtsformel. „Exil“ wäre im historischen Zusammenhang möglich, würde die Bedeutung jedoch stärker auf Verbannung eingrenzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vierteilige, unerbittliche Gerichtsformel und ihre Wiederholungen bleiben erhalten. Gedankenstriche bilden die hebräische Ellipse ab; die erläuternde Ergänzung „bestimmt“ wird nur in der Fußnote genannt.
