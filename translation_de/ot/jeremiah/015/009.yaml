  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
translation:
  language: de
  text: Die, die sieben Kinder geboren hat, welkt dahin[a]; sie haucht ihr Leben aus[b]. Ihre Sonne geht noch bei Tag unter[c]. Sie wird beschämt und gedemütigt. Und was von ihnen übrig bleibt, gebe ich dem Schwert preis vor ihren Feinden – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Mutter von sieben Kindern verkümmert.“ Sieben Kinder galten als Bild besonderer Fruchtbarkeit und eines als glücklich geltenden Zustands.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie haucht ihre Seele aus“; gemeint ist, dass sie stirbt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Ihre Sonne geht unter, während es noch Tag ist“ – ein poetisches Bild für ein vorzeitiges Ende.'
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  choice: welkt dahin
  rationale: Das Verb bezeichnet ein kraftloses Dahinschwinden. „Welkt dahin“ bewahrt das poetische Bild und klingt im Deutschen natürlich.
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  choice: Die sieben Kinder geboren hat
  rationale: Die substantivierte Wendung bezeichnet eine Frau, die sieben geboren hat. „Kinder“ wird zur natürlichen Verständlichkeit ergänzt, ohne den Sinn enger festzulegen.
- source_word: נָפְחָה נַפְשָׁהּ
  choice: sie haucht ihr Leben aus
  rationale: Die deutsche Wendung bewahrt das konkrete Bild von Atem und schwindendem Leben; נֶפֶשׁ bezeichnet hier das Leben beziehungsweise die Lebenskraft.
- source_word: באה שִׁמְשָׁהּ בְּעוֹד יוֹמָם
  choice: Ihre Sonne geht unter, obwohl es noch Tag ist
  rationale: Die Formulierung erhält das hebräische Bild eines vorzeitigen Endes und gibt den konzessiven Zusammenhang idiomatisch wieder.
- source_word: בּוֹשָׁה וְחָפֵרָה
  choice: Sie wird beschämt und gedemütigt
  rationale: Das Verbpaar beschreibt Schande und tiefe öffentliche Demütigung. Die beiden deutschen Begriffe erhalten die Steigerung.
- source_word: וּשְׁאֵרִיתָם
  choice: was von ihnen übrig bleibt
  rationale: Diese Formulierung gibt den verbleibenden Rest beziehungsweise die Überlebenden in allgemein verständlichem Deutsch wieder.
- source_word: לַחֶרֶב אֶתֵּן
  choice: gebe ich dem Schwert preis
  rationale: Die feste deutsche Wendung bewahrt das Gerichtsmotiv des Auslieferns an gewaltsamen Tod.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: vor ihren Feinden
  rationale: Die Wiedergabe bleibt eng bei der räumlich-relationalen Bedeutung „vor/im Angesicht ihrer Feinde“, ohne sie lediglich als indirektes Objekt umzudeuten.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: „Spruch“ entspricht der prophetischen Botenformel נְאֻם; „Jahwe“ gibt den im Text stehenden Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ macht den Eigennamen sichtbar und folgt der angegebenen aktuellen Entscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der Frau, die sieben geboren hat
  choice: Das weibliche Bild bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Ausdrückliche Identifizierung mit Jerusalem/Juda oder einer konkreten Mutter
  rationale: Der Vers nennt die Frau nicht ausdrücklich. Die Übersetzung bewahrt daher die poetische und möglicherweise kollektive Mehrdeutigkeit.
- issue: Bedeutung von נֶפֶשׁ in נָפְחָה נַפְשָׁהּ
  choice: Leben
  alternative: Seele
  rationale: Im Sterbekontext bezeichnet נֶפֶשׁ das Leben beziehungsweise die Lebenskraft. „Leben“ vermeidet eine unbeabsichtigte dogmatische Festlegung auf ein bestimmtes Leib-Seele-Modell.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Bildsprache. Der Satzbau bleibt eng am Hebräischen, wird aber für heutige Leser geglättet. Die weibliche Bildfigur und der Wechsel zum männlichen Plural „ihnen/ihren“ werden nicht harmonisiert, da sie im Ausgangstext stehen.
