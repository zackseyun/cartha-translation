id: JER.15.18
reference: Jeremiah 15:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֣/מָּה הָיָ֤ה כְאֵבִ/י֙ נֶ֔צַח וּ/מַכָּתִ֖/י אֲנוּשָׁ֑ה֙ מֵֽאֲנָה֙ הֵֽרָפֵ֔א הָי֨וֹ תִֽהְיֶ֥ה לִ/י֙ כְּמ֣וֹ אַכְזָ֔ב מַ֖יִם לֹ֥א נֶאֱמָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
translation:
  language: de
  text: Warum ist mein Schmerz ohne Ende und meine Wunde unheilbar? Sie will einfach nicht heilen. Willst du denn wirklich für mich wie ein trügerischer Bach[a] sein, wie Wasser, auf das kein Verlass ist?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein versiegender Bach“. Gemeint ist ein Wasserlauf, der Wasser erwarten lässt, sich aber als unzuverlässig erweist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֵבִי נֶצַח
  choice: mein Schmerz ohne Ende
  rationale: כְּאֵבִי bezeichnet Jeremias Schmerz oder Leiden; נֶצַח drückt hier dessen anhaltende Dauer aus. „Ohne Ende“ gibt die Klage natürlich und eindringlich wieder, ohne abstrakte Ewigkeit zu behaupten.
- source_word: מַכָּתִי אֲנוּשָׁה
  choice: meine Wunde unheilbar
  rationale: מַכָּה bezeichnet im Zusammenhang mit dem folgenden Heilungsmotiv eine Wunde; אֲנוּשָׁה beschreibt sie als schwer beziehungsweise nicht heilbar. „Unheilbar“ bewahrt das medizinische Bild und den unmittelbaren Kontext.
- source_word: מֵאֲנָה הֵרָפֵא
  choice: Sie will einfach nicht heilen
  rationale: Die hebräische Wendung personifiziert die Wunde als eine, die sich zu heilen weigert. Die deutsche Formulierung erhält dieses lebendige Bild; „einfach“ bringt die nachdrückliche Klage idiomatisch zum Ausdruck.
- source_word: הָיוֹ תִהְיֶה לִי
  choice: Willst du denn wirklich für mich … sein
  rationale: Infinitivus absolutus und finite Verbform verstärken die rhetorische Frage. „Denn wirklich“ vermittelt Jeremias ungläubig-anklagenden Ton, während „für mich“ לִי wiedergibt.
- source_word: אַכְזָב
  choice: trügerischer Bach
  rationale: אַכְזָב bezeichnet etwas Täuschendes oder Enttäuschendes und kann das Bild eines Wasserlaufs aufrufen, der gerade dann versiegt, wenn Wasser erwartet wird. „Trügerischer Bach“ bewahrt sowohl Bild als auch Vorwurf.
- source_word: מַיִם לֹא נֶאֱמָנוּ
  choice: Wasser, auf das kein Verlass ist
  rationale: Die Wendung beschreibt Wasser, das sich nicht als beständig oder zuverlässig erweist. Die idiomatische Formulierung erhält die Bedeutungsnuance von אמן im Nifal.
theological_decisions:
- issue: Anklagende direkte Rede zu Gott
  choice: Die rhetorische Frage wird als direkte und scharfe Anrede an Gott wiedergegeben.
  alternative: Die Aussage abschwächen, damit sie Gott nicht mit einem unzuverlässigen Wasserlauf zu vergleichen scheint.
  rationale: Die zweite Person Singular und das Bild des trügerischen Baches richten die Klage unverkennbar an Gott. Die Übersetzung bewahrt diese theologische Spannung, ohne Jeremias Vorwurf zu mildern oder zu erklären.
- issue: Personifikation der unheilbaren Wunde
  choice: Die Wunde wird als etwas dargestellt, das nicht heilen will.
  alternative: 'Die Personifikation auflösen: „Sie kann nicht geheilt werden.“'
  rationale: מֵאֲנָה („sie weigert sich“) gestaltet die Klage bewusst bildhaft. Das deutsche „will … nicht heilen“ erhält diese Spannung zwischen Unheilbarkeit und verweigerter Heilung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Klagesprache. Die kurzen Sätze verstärken Jeremias Schmerz, ohne pathetische oder konfessionell geprägte Zusätze. Das Gottespronomen „du“ bleibt entsprechend heutiger deutscher Rechtschreibung kleingeschrieben.
