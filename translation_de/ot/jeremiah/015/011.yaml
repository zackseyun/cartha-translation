id: JER.15.11
reference: Jeremiah 15:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָמַ֣ר יְהוָ֔ה אִם לֹ֥א שרות/ך לְ/ט֑וֹב אִם ל֣וֹא הִפְגַּ֣עְתִּֽי בְ/ךָ֗ בְּ/עֵ֥ת רָעָ֛ה וּ/בְ/עֵ֥ת צָרָ֖ה אֶת הָ/אֹיֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
translation:
  language: de
  text: 'Jahwe sagte: »Ganz gewiss habe ich dich zu deinem Besten freigelassen[a]. Ganz gewiss habe ich den Feind dazu gebracht, dich in einer Zeit des Unheils und in einer Zeit der Not anzuflehen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut dieser Aussage ist unsicher. Möglich ist auch: »Ganz gewiss habe ich dich zu deinem Besten befreit.« Bei einem anderen Verständnis der Form kann die Aussage lauten: »Ganz gewiss habe ich den Rest zum Guten gestärkt.«'
    reason: textual_variant
  - marker: b
    text: 'Oder: »Ganz gewiss bin ich in einer Zeit des Unheils und in einer Zeit der Not beim Feind für dich eingetreten.«'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִם לֹא ... אִם לוא
  choice: ganz gewiss ... ganz gewiss
  rationale: Die Verbindung dient hier nicht als gewöhnliche Bedingung, sondern als nachdrückliche, eidartige Bekräftigung. Die Wiederholung bleibt erhalten.
- source_word: שרותך
  choice: ich habe dich ... freigelassen
  rationale: Die schwierige und möglicherweise gestörte Form wird im wahrscheinlichen Sinn einer Freilassung oder Befreiung Jeremias verstanden. Die erhebliche Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: לְטוֹב
  choice: zu deinem Besten
  rationale: Die Wendung bezeichnet einen für Jeremia günstigen Zweck oder Ausgang und klingt so im modernen Deutschen natürlich.
- source_word: הִפְגַּעְתִּי בְךָ
  choice: ich habe ... dazu gebracht, dich ... anzuflehen
  rationale: 'Der Hifil von פגע wird kausativ verstanden: Gott veranlasst den Feind, sich flehend an Jeremia zu wenden. Eine syntaktisch mögliche andere Deutung wird in Fußnote [b] bewahrt.'
- source_word: אֶת הָאֹיֵב
  choice: den Feind
  rationale: Der bestimmte Singular wird als kollektive oder konkrete Bezeichnung des Gegners ohne ergänztes Possessivpronomen wiedergegeben.
- source_word: בְּעֵת רָעָה
  choice: in einer Zeit des Unheils
  rationale: רָעָה bezeichnet hier widrige Umstände beziehungsweise eine Katastrophe, nicht moralische Bosheit.
- source_word: וּבְעֵת צָרָה
  choice: und in einer Zeit der Not
  rationale: Die parallele Zeitangabe und die Wiederholung von בְעֵת werden bewahrt; „Not“ gibt צָרָה klar und würdig wieder.
theological_decisions:
- issue: Deutung der textlich und sprachlich schwierigen Zusage an Jeremia
  choice: Die Aussage wird als Gottes Zusicherung verstanden, Jeremia zu seinem Besten freizulassen und den Feind in der Not dazu zu bringen, ihn anzuflehen.
  alternative: Die erste Aussage kann sich auf die Stärkung eines Restes beziehen; die zweite kann bedeuten, dass Gott beim Feind für Jeremia eintritt.
  rationale: Der gewählte Sinn passt zum Zusammenhang von Jeremias Bewahrung und späterer Anerkennung durch seine Gegner. Da der hebräische Wortlaut echte Unsicherheiten enthält, werden die wichtigen Alternativen ausdrücklich genannt und nicht dogmatisch entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Bekräftigung und die parallelen Zeitangaben des Hebräischen bleiben hörbar. Ungewöhnliche oder konfessionell geprägte Fachsprache wird vermieden; die genuine textliche Mehrdeutigkeit erscheint in den Fußnoten.
