source:
  edition: WLC
  text: וּ/פָקַדְתִּ֨י עֲלֵי/הֶ֜ם אַרְבַּ֤ע מִשְׁפָּחוֹת֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֣רֶב לַֽ/הֲרֹ֔ג וְ/אֶת הַ/כְּלָבִ֖ים לִ/סְחֹ֑ב וְ/אֶת ע֧וֹף הַ/שָּׁמַ֛יִם וְ/אֶת בֶּהֱמַ֥ת הָ/אָ֖רֶץ לֶ/אֱכֹ֥ל וּ/לְ/הַשְׁחִֽית־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/003.yaml
  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
translation:
  language: de
  text: 'Und ich werde vier Arten[a] gegen sie aufbieten, spricht Jahwe: das Schwert zum Töten, die Hunde zum Wegschleppen und die Vögel des Himmels und die Tiere der Erde zum Fressen und Vernichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vier Familien“ oder „vier Sippen“; das Wort bezeichnet hier bildlich vier Arten von Gerichtsagenten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  choice: Und ich werde … über sie bestellen
  rationale: פקד mit עַל bezeichnet hier das Einsetzen beziehungsweise Beauftragen feindlicher Gerichtsagenten. „Über sie bestellen“ bewahrt diese leitende Bedeutung, ohne das allgemeinere „heimsuchen“ oder das deutende „bestrafen“ vorzuziehen.
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  choice: vier Arten
  rationale: מִשְׁפָּחוֹת bedeutet gewöhnlich „Familien/Sippen“, wird hier aber bildlich für vier Kategorien von Gerichtsagenten gebraucht. „Arten“ gibt diese klassifizierende Funktion natürlich wieder, ohne „Verderber“ ergänzend in den Haupttext einzutragen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Formel wird in würdigem, geläufigem Deutsch wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: הַחֶרֶב לַהֲרֹג
  choice: das Schwert zum Töten
  rationale: Der Zweckinfinitiv wird direkt und in modernem Deutsch wiedergegeben.
- source_word: הַכְּלָבִים לִסְחֹב
  choice: die Hunde zum Wegschleppen
  rationale: סחב bedeutet ziehen oder schleppen. „Wegschleppen“ trifft im Zusammenhang mit den Getöteten die Richtung, ohne ein Zerreißen ausdrücklich hineinzulesen.
- source_word: עוֹף הַשָּׁמַיִם
  choice: die Vögel des Himmels
  rationale: Die Formulierung bleibt nahe am hebräischen Ausdruck und wahrt den prophetischen Ton; gemeint sind im Kontext aasfressende Vögel, ohne dass dies lexikalisch ausdrücklich gesagt wird.
- source_word: בֶּהֱמַת הָאָרֶץ
  choice: die Tiere der Erde
  rationale: בְּהֵמָה ist eine breite Bezeichnung für Tiere. „Tiere der Erde“ vermeidet die unbelegte Einschränkung auf wilde oder bestimmte Raubtiere.
- source_word: לֶאֱכֹל וּלְהַשְׁחִית
  choice: zum Fressen und Vernichten
  rationale: Bei Tieren ist „fressen“ die natürliche Wiedergabe von אכל. „Vernichten“ erhält die zusätzliche, steigernde Aussage von השחית; die gemeinsame Konstruktion mit „zum“ gibt beide koordinierten Infinitive knapp wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter der vier Gerichtsmächte
  choice: vier Arten
  alternative: vier Familien/Sippen
  rationale: Die ungewöhnliche Bildsprache wird durch eine Fußnote offengelegt. Im Haupttext bezeichnet „Arten“ die vier Kategorien, ohne sie über den Wortlaut hinaus ausdrücklich „Verderber“ zu nennen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die harte Gerichtssprache des Ausgangstextes bleibt ungemildert. Nur eine textlich begründete Fußnote wird gesetzt; der englische Fußnotenhinweis bei „dogs to drag away“ passt inhaltlich nicht zu seiner dort angegebenen Alternative und wurde daher nicht übernommen.
