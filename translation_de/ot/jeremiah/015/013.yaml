  text: חֵילְ/ךָ֧ וְ/אוֹצְרוֹתֶ֛י/ךָ לָ/בַ֥ז אֶתֵּ֖ן לֹ֣א בִ/מְחִ֑יר וּ/בְ/כָל חַטֹּאותֶ֖י/ךָ וּ/בְ/כָל גְּבוּלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
translation:
  language: de
  text: Dein Vermögen[a] und deine Schätze werde ich als Beute preisgeben, ohne Entschädigung, wegen all deiner Sünden, in deinem ganzen Gebiet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Macht“ oder „deine Streitmacht“. Das hebräische Wort kann auch Stärke oder Heer bedeuten; neben „Schätze“ liegt hier „Vermögen“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „nicht für einen Preis, und in/bei all deinen Sünden und in all deinen Grenzen“. Die Übersetzung versteht die erste der beiden abschließenden Wendungen im Zusammenhang als Angabe des Grundes und die zweite als Angabe der räumlichen Reichweite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  choice: dein Vermögen
  rationale: חַיִל/חֵיל kann Stärke, Heer oder Vermögen bezeichnen. Die Parallele zu „deine Schätze“ und der Zusammenhang der Ausplünderung sprechen hier für den wirtschaftlichen Sinn.
- source_word: וְאוֹצְרוֹתֶיךָ
  choice: und deine Schätze
  rationale: Das Wort bezeichnet aufgehäufte Kostbarkeiten oder Schatzkammern. Als Gegenstand der Beute ist „Schätze“ im Deutschen natürlich und treffend.
- source_word: לָבַז אֶתֵּן
  choice: gebe ich als Beute preis
  rationale: Die Verbindung von נתן mit לָבַז bedeutet, etwas der Plünderung zu überlassen. „Als Beute preisgeben“ gibt diesen Sinn idiomatisch wieder.
- source_word: לֹא בִמְחִיר
  choice: ohne Gegenleistung
  rationale: Wörtlich steht „nicht für einen Preis“. Gemeint ist, dass das Vermögen ohne Kaufpreis oder Entschädigung ausgeliefert wird.
- source_word: וּבְכָל חַטֹּאותֶיךָ
  choice: wegen all deiner Sünden
  rationale: Die Präposition ב wird im Zusammenhang des Gerichtswortes kausal verstanden. „Wegen“ macht den im Kontext liegenden Grund der angekündigten Auslieferung deutlich.
- source_word: וּבְכָל גְּבוּלֶיךָ
  choice: überall in deinem Gebiet
  rationale: גְּבוּל kann Grenze oder das innerhalb der Grenzen liegende Gebiet bezeichnen. Die Formulierung gibt den räumlich umfassenden Sinn natürlich wieder.
theological_decisions:
- issue: Funktion der beiden abschließenden Präpositionalgruppen im Gerichtswort
  choice: Die Sünden werden als Grund der Auslieferung verstanden; „überall in deinem Gebiet“ bezeichnet deren räumliche Reichweite.
  alternative: 'Eine formalere Wiedergabe wäre: „und bei all deinen Sünden und in all deinen Grenzen“, ohne den kausalen und distributiven Zusammenhang ausdrücklich zu machen.'
  rationale: Der Kontext spricht von Gottes Gericht. Die kausale Deutung von ב bei „Sünden“ und die räumlich-distributive Deutung bei „Gebiet“ machen den wahrscheinlichen Sinn verständlich, ohne eine zusätzliche dogmatische Aussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede bleibt entsprechend dem Hebräischen im Singular. Der Gedankenstrich gliedert die Gerichtsankündigung und hebt ihre Begründung hervor.
