  source_fidelity: 'Die Übersetzung gibt die hebräische Konstruktion korrekt wieder: נתן mit לְ als „zu etwas machen“, die feste/uneinnehmbare bronzene Mauer, den Angriff der Gegner, ihr fehlendes Überwältigen sowie die begründende Gegenwart Jahwes zum Retten und Befreien. „Für dieses Volk“ ist als idiomatische Wiedergabe von לָעָם הַזֶּה vertretbar und legt keine unzulässige Feindschaftsrichtung fest.'
