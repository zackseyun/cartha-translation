id: JER.15.20
reference: Jeremiah 15:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
translation:
  language: de
  text: Und ich mache dich für dieses Volk zu einer befestigten Mauer aus Bronze. Sie werden gegen dich kämpfen, aber sie werden dich nicht überwältigen; denn ich bin mit dir, um dich zu retten und dich zu befreien – so spricht Jahwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: Und ich mache dich
  rationale: נתן bedeutet wörtlich „geben, setzen, stellen“, bezeichnet hier aber mit לְ und einem Prädikatsnomen idiomatisch das Machen zu etwas.
- source_word: לָעָם הַזֶּה
  choice: für dieses Volk
  rationale: Das לְ bezeichnet Jeremias Zuordnung beziehungsweise Verhältnis zu diesem Volk; „für“ ist im Deutschen natürlicher als „diesem Volk zu“ und legt nicht unnötig „gegen“ fest.
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  choice: zu einer befestigten Mauer aus Bronze
  rationale: Die Formulierung bewahrt sowohl das Material נְחֹשֶׁת („Bronze/Kupfer“) als auch die Eigenschaft בְּצוּרָה („befestigt, unzugänglich“).
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  choice: Sie werden gegen dich kämpfen
  rationale: לחם mit אֶל bezeichnet hier feindliches Kämpfen gegen eine Person.
- source_word: וְלֹא יוּכְלוּ לָךְ
  choice: aber sie werden dich nicht überwältigen
  rationale: יכל mit לְ drückt hier aus, dass die Gegner gegen Jeremia keinen Erfolg haben werden; „überwältigen“ gibt diese idiomatische Bedeutung klar wieder.
- source_word: כִּי אִתְּךָ אֲנִי
  choice: denn ich bin mit dir
  rationale: כִּי begründet, weshalb die Gegner nicht siegen werden; die knappe Beistandszusage bleibt erhalten.
- source_word: לְהוֹשִׁיעֲךָ וּלְהַצִּילֶךָ
  choice: um dich zu retten und dich zu befreien
  rationale: Die beiden nah verwandten Verben ישע und נצל werden mit zwei unterscheidbaren deutschen Verben wiedergegeben, ohne ihre Parallelität aufzulösen.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: נְאֻם ist eine feierliche prophetische Botenformel; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Bewahrung Jeremias
  choice: nicht überwältigen; retten und befreien
  alternative: nicht schaden können; dauerhaft vor jedem Leiden bewahren
  rationale: Der Text verheißt, dass die Gegner nicht über Jeremia siegen werden, und Gottes rettendes Eingreifen. Er sagt nicht, dass Jeremia keinerlei Widerstand oder Leid erfahren wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Mauer-Metapher und die parallelen Rettungsverben bleiben erhalten; der Satzbau ist für heutige Leser geglättet, ohne die inhaltliche Spannung zwischen Angriff und Bewahrung aufzulösen.
