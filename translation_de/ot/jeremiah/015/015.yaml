base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
translation:
  language: de
  text: 'Jahwe, du weißt: Denk an mich und nimm dich meiner an[a]; räche mich an meinen Verfolgern[b]. Nimm mich in deiner Langmut nicht hinweg[c]. Erkenne, dass ich um deinetwillen Schmach ertrage[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „suche mich auf“, „achte auf mich“ oder „kümmere dich um mich“. Das hebräische פקד kann sowohl aufmerksames Wahrnehmen als auch wirksames Eingreifen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „übe für mich Vergeltung an denen, die mich verfolgen“ beziehungsweise „verschaffe mir Recht gegenüber meinen Verfolgern“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Nimm mich nicht weg wegen der Länge deines Zorns.“ „Länge des Zorns“ bezeichnet, dass Gott langsam zum Zorn und langmütig ist. Gemeint sein kann: Lass deine Geduld mit meinen Verfolgern nicht dazu führen, dass ich hinweggenommen werde.'
    reason: idiom_and_ambiguity
  - marker: d
    text: 'Oder: „Erkenne, dass ich deinetwegen Schmach ertrage“ beziehungsweise „dass ich auf dein Konto hin Schmach trage“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen in seiner im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: זָכְרֵנִי
  choice: Denk an mich
  rationale: Bewahrt die direkte Bitte des Imperativs; im Gebetszusammenhang schließt das Erinnern ein entsprechendes Handeln ein, ohne dieses auszuformulieren.
- source_word: וּפָקְדֵנִי
  choice: nimm dich meiner an
  rationale: פקד bezeichnet hier im Parallelismus mit „Denk an mich“ eine aufmerksame, eingreifende Zuwendung. Die Formulierung ist im heutigen Deutsch natürlich und lässt offen, wie dieses Eingreifen geschieht.
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  choice: räche mich an meinen Verfolgern
  rationale: Der Niphal-Imperativ von נקם fordert Gott ausdrücklich zu Vergeltung beziehungsweise Rechtsdurchsetzung zugunsten Jeremias auf. „Räche mich“ bewahrt diese Schärfe, ohne sie auszubauen.
- source_word: מֵרֹדְפַי
  choice: meinen Verfolgern
  rationale: רדף bedeutet wörtlich „verfolgen, nachjagen“; „Verfolger“ gibt hier die feindselige Verfolgung treffend und knapp wieder.
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  choice: Nimm mich in deiner Langmut nicht hinweg
  rationale: „Langmut“ gibt das Idiom אֶרֶךְ אַף („langsam zum Zorn“) wieder; „hinwegnehmen“ wahrt die direkte Aussage mit Gott als Subjekt und legt nicht fest, ob Tod oder eine andere Beseitigung gemeint ist.
- source_word: דַּע
  choice: Erkenne
  rationale: Gibt den direkten Imperativ wieder und knüpft semantisch an das einleitende „Du weißt es“ an, ohne im Deutschen unnatürlich „Wisse“ zu formulieren.
- source_word: שְׂאֵתִי
  choice: ich … Schmach ertrage
  rationale: Die Form von נשׂא bezeichnet hier das Tragen beziehungsweise Erdulden von Schmach; der finite deutsche Satz gibt dies idiomatisch wieder.
- source_word: עָלֶיךָ חֶרְפָּה
  choice: um deinetwillen Schmach
  rationale: עָלֶיךָ verbindet die erlittene Schmach mit Jeremias Bindung an Jahwe. „Um deinetwillen“ wahrt diesen Bezug, ohne ihn dogmatisch näher zu bestimmen.
theological_decisions:
- issue: Jeremias Bitte um göttliche Vergeltung
  choice: „Räche mich an meinen Verfolgern“
  alternative: „Verschaffe mir Recht gegenüber meinen Verfolgern“
  rationale: נקם enthält ausdrücklich den Gedanken göttlicher Rache beziehungsweise Vergeltung. Die Übersetzung bewahrt die theologische Spannung der Bitte, statt sie zu einer allgemeineren Bitte um Trost oder Rechtsschutz abzuschwächen.
- issue: Bedeutung der göttlichen Langmut für Jeremia
  choice: Gott wird direkt gebeten, Jeremia in seiner Langmut nicht hinwegzunehmen.
  alternative: „Lass nicht zu, dass ich wegen deiner Langmut hinweggenommen werde.“
  rationale: Der hebräische Satz lässt Gott grammatisch Subjekt von לקח sein, während der Zusammenhang nahelegt, dass seine Langmut gegenüber den Verfolgern Jeremia gefährdet. Die Hauptfassung erhält die auffällige Formulierung und erklärt die mögliche Beziehung in der Fußnote, statt die Spannung durch einen Wechsel zur passiven Fremdeinwirkung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gebetssprache und die Härte der Vergeltungsbitte bleiben erhalten. „Langmut“ ist leicht gehoben, aber in diesem theologischen Zusammenhang verständlich und bildet das hebräische Idiom prägnanter ab als eine erklärende Paraphrase.
