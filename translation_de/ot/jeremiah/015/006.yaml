base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
translation:
  language: de
  text: Du hast mich verlassen[a] – Ausspruch Jahwes – und gehst immer weiter zurück. Darum habe ich meine Hand gegen dich ausgestreckt und dich vernichtet; ich bin es müde, nachsichtig zu sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du hast mich aufgegeben.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich bin es müde, es mir anders zu überlegen.“ Das hebräische Verb kann hier bedeuten, von angekündigtem Gericht abzusehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ
  choice: du hast mich verlassen
  rationale: Das Verb bezeichnet das Verlassen oder Aufgeben einer Person und bewahrt hier den relationalen und bundesbezogenen Vorwurfscharakter.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird in einem würdigen, formnahen Register wiedergegeben; der Gottesname erscheint als Jahwe.
- source_word: אָחוֹר תֵּלֵכִי
  choice: du gehst immer weiter zurück
  rationale: Die räumliche Bewegungsmetapher bleibt erhalten; der Imperfekt beschreibt ein fortgesetztes beziehungsweise charakteristisches Verhalten.
- source_word: וָאַט אֶת יָדִי עָלַיִךְ
  choice: Darum habe ich meine Hand gegen dich ausgestreckt
  rationale: Die Konjunktion wird im Zusammenhang folgernd verstanden; „gegen dich“ gibt die feindliche Gerichtsrichtung der ausgestreckten Hand wieder.
- source_word: וָאַשְׁחִיתֵךְ
  choice: und dich vernichtet
  rationale: Der Hifil von שׁחת bezeichnet hier schweres zerstörerisches Gericht; „vernichtet“ bewahrt dessen Schärfe.
- source_word: נִלְאֵיתִי הִנָּחֵם
  choice: ich bin es müde, nachzugeben
  rationale: לאה drückt Ermüdung aus; נחם bezeichnet in diesem Gerichtskontext das Ablassen oder Nachgeben hinsichtlich angekündigten Gerichts, nicht moralische Reue.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Wiedergabe von הִנָּחֵם in Bezug auf Gott
  choice: nachzugeben
  alternative: es sich anders überlegen / bereuen
  rationale: „Nachzugeben“ hält den Bezug auf das Zurücknehmen beziehungsweise Aussetzen des Gerichts fest, ohne moralische Schuld Gottes anzudeuten; die Spannung zwischen Gericht und Erbarmen bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Singularanrede des Hebräischen bezieht sich im Kontext auf Jerusalem beziehungsweise Juda, ist im Deutschen jedoch formal nicht eigens markiert. Die Bewegungsmetapher „zurückgehen“ und die theologische Spannung von Gericht und Nachgeben bleiben erhalten.
