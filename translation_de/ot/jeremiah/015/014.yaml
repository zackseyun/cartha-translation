  text: וְ/הַֽעֲבַרְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ בְּ/אֶ֖רֶץ לֹ֣א יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קָדְחָ֥ה בְ/אַפִּ֖/י עֲלֵי/כֶ֥ם תּוּקָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
translation:
  language: de
  text: Und ich werde deine Feinde in ein Land hinüberbringen, das du nicht kennst.[a] Denn in meinem Zorn ist ein Feuer entbrannt; es wird gegen euch brennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einigen alten Übersetzungen und der Parallele in Jeremia 17,4: „Und ich werde dich deinen Feinden in einem Land dienen lassen, das du nicht kennst.“ Der hebräische Konsonantentext an dieser Stelle lautet jedoch „deine Feinde“; der abweichenden Lesart könnte eine andere Vokalisierung oder Textvorlage zugrunde liegen.'
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  choice: Und ich werde … hinüberbringen
  rationale: Der Hifil von עבר bezeichnet hier ein Veranlassen des Hinübergehens. „Hinüberbringen“ gibt diesen kausativen Bewegungssinn im Deutschen natürlich wieder.
- source_word: אֶת אֹיְבֶיךָ
  choice: deine Feinde
  rationale: Die direkte Objektmarkierung mit dem Plural und dem Suffix der 2. Person Singular ergibt nach dem masoretischen Text eindeutig „deine Feinde“.
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  choice: in ein Land, das du nicht kennst
  rationale: Bei einem Bewegungsverb kann בְּ das Ziel bezeichnen. Das deutsche Präsens „nicht kennst“ drückt den gemeinten fehlenden Erfahrungsbezug idiomatisch aus.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die angekündigte Gerichtshandlung ein.
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: in meinem Zorn ist ein Feuer entbrannt
  rationale: Die konkrete Feuerbildsprache bleibt erhalten. אַף wird idiomatisch mit „Zorn“ wiedergegeben; „ist … entbrannt“ entspricht dem vollendeten Einsetzen des Feuers.
- source_word: עֲלֵיכֶם תּוּקָד
  choice: es wird gegen euch brennen
  rationale: „Brennen“ vermeidet eine unnötige Wiederholung von „entbrannt“. „Euch“ bewahrt den Wechsel vom Singular zum Plural im hebräischen Text.
theological_decisions:
- issue: Wechsel von singularischen Anredeformen zu עֲלֵיכֶם im Plural
  choice: „deine … du“ im ersten Satzteil und „gegen euch“ im letzten Satzteil
  alternative: Alle Anredeformen entweder als Singular oder als Plural vereinheitlichen
  rationale: Der hebräische Text wechselt vom Singular zum Plural, möglicherweise von Jeremia beziehungsweise einer repräsentativen Einzelperson zur Gemeinschaft. Die Übersetzung bewahrt diese Spannung, statt sie interpretierend zu glätten.
- issue: Textvariante im ersten Satzteil
  choice: Der masoretische Wortlaut „deine Feinde“ steht im Haupttext
  alternative: „Ich werde dich deinen Feinden dienen lassen“ nach alten Übersetzungen und der Parallele in Jeremia 17,4
  rationale: Der vorliegende hebräische Text stützt unmittelbar „deine Feinde“. Die gut bezeugte alternative Überlieferung wird wegen ihres erheblich anderen Sinns in einer Fußnote dokumentiert, aber nicht in den Haupttext übernommen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Hinüberbringen“ hält die ungewöhnliche Aussage des masoretischen Textes erkennbar, ohne sie zu erklären oder an die alternative Überlieferung anzugleichen. Der Wechsel von „du“ zu „euch“ bleibt bewusst sichtbar.
