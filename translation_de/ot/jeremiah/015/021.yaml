base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
translation:
  language: de
  text: Und ich werde dich aus der Hand böser Menschen retten und dich aus dem Griff der Gewalttätigen erlösen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „loskaufen“ oder „befreien“ statt „erlösen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  choice: Und ich werde dich … retten
  rationale: Das Hifil von נצל bezeichnet das Herausreißen oder Retten aus einer Gefahr. „Retten“ ist im modernen Deutsch natürlich und passt zur folgenden Herkunftsangabe.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: יָד bedeutet wörtlich „Hand“ und bezeichnet hier bildhaft Macht oder Gewalt. Die konkrete hebräische Metapher ist auch im Deutschen verständlich.
- source_word: רָעִים
  choice: böser Menschen
  rationale: Das substantivierte maskuline Pluraladjektiv bezeichnet moralisch böse menschliche Gegner. „Böse Menschen“ gibt den Personenbezug klar wieder, ohne das grammatische Maskulinum unnötig auf Männer zu verengen.
- source_word: וּפְדִתִיךָ
  choice: und dich … befreien
  rationale: פדה bezeichnet das Loskaufen, Auslösen oder Befreien aus fremder Gewalt. Im unmittelbaren Parallelismus mit „retten“ gibt „befreien“ den konkreten Sinn natürlich wieder; die mögliche Lösegeldnuance wird in der Fußnote bewahrt.
- source_word: מִכַּף
  choice: aus dem Griff
  rationale: כַּף bedeutet wörtlich „Handfläche“ und bezeichnet idiomatisch die Gewalt oder den festen Zugriff eines Gegners. „Griff“ bewahrt das körperliche Bild in idiomatischem Deutsch.
- source_word: עָרִצִים
  choice: der Gewalttätigen
  rationale: עָרִיץ bezeichnet gewalttätige, rücksichtslose und Schrecken verbreitende Unterdrücker. „Gewalttätige“ erfasst den Kern, ohne die politische Bedeutung „Tyrannen“ festzulegen.
theological_decisions:
- issue: Personenbezug des maskulinen Plurals רָעִים
  choice: böse Menschen
  alternative: böse Männer; die Bösen
  rationale: Die Form ist grammatisch maskulin plural, doch das Hebräische legt nicht zwingend fest, dass ausschließlich männliche Gegner gemeint sind. „Menschen“ bewahrt den menschlichen Bezug, ohne eine sachlich nicht gesicherte Geschlechtsaussage einzutragen.
- issue: Wiedergabe von פדה
  choice: befreien
  alternative: erlösen; loskaufen
  rationale: Der Kontext spricht unmittelbar von Rettung aus der Gewalt feindlicher Menschen. „Befreien“ gibt diesen Sinn klar wieder, während die lexikalisch mögliche Lösegeld- oder Erlösungsnuance durch die Fußnote offenbleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus sowie die unterschiedlichen Körperbilder „Hand“ und „Griff“ bleiben erhalten. Die Versschlussmarkierung der masoretischen Textüberlieferung wird nicht übersetzt.
