  text: כִּ֠י מִֽי יַחְמֹ֤ל עָלַ֨יִ/ךְ֙ יְר֣וּשָׁלִַ֔ם וּ/מִ֖י יָנ֣וּד לָ֑/ךְ וּ/מִ֣י יָס֔וּר לִ/שְׁאֹ֥ל לְ/שָׁלֹ֖ם לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
translation:
  language: de
  text: Denn wer wird Erbarmen mit dir haben, Jerusalem? Wer wird dir sein Mitgefühl zeigen? Und wer wird von seinem Weg abweichen, um nach deinem Wohlergehen zu fragen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung des vorausgehenden Gerichtswortes ein und wahrt dessen kausale Kraft in natürlichem Deutsch.
- source_word: מִי
  choice: wer
  rationale: Das dreimal wiederholte Fragepronomen bildet eine rhetorische Folge; es wird jeweils einheitlich mit „wer“ wiedergegeben.
- source_word: יַחְמֹל עָלַיִךְ
  choice: wird Erbarmen mit dir haben
  rationale: חמל mit על bezeichnet hier Erbarmen oder Mitleid gegenüber Jerusalem. „Erbarmen mit dir haben“ gibt den emotionalen Sinn idiomatisch wieder, ohne vorschnell die mögliche Bedeutung „verschonen“ einzutragen.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der Eigenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: יָנוּד לָךְ
  choice: wird dir sein Mitgefühl zeigen
  rationale: נוד kann eine Geste des Beileids, Mitgefühls oder der Klage bezeichnen. Die Wiedergabe macht die gemeinte Anteilnahme verständlich, ohne die im Deutschen missverständliche Formulierung „den Kopf schütteln“ zu verwenden.
- source_word: יָסוּר
  choice: wird bei dir Halt machen
  rationale: סור zeichnet das Bild eines Menschen, der von seinem Weg abweicht beziehungsweise anhält. Im Zusammenhang des Erkundigens klingt „bei dir Halt machen“ natürlich und bewahrt das Bild.
- source_word: לִשְׁאֹל לְשָׁלֹם לָךְ
  choice: um nach deinem Wohlergehen zu fragen
  rationale: Die hebräische Wendung „nach dem Schalom fragen“ meint hier die erkundigende Frage nach dem Befinden beziehungsweise Wohlergehen, nicht lediglich nach Frieden im engeren Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei rhetorischen Fragen und ihre Steigerung bleiben erhalten. Die feminine Anrede Jerusalems ist im Deutschen nur durch „dir“ erkennbar; eine zusätzliche Personifikation wurde nicht eingefügt.
