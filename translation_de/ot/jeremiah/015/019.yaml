  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אִם תָּשׁ֤וּב וַ/אֲשִֽׁיבְ/ךָ֙ לְ/פָנַ֣/י תַּֽעֲמֹ֔ד וְ/אִם תּוֹצִ֥יא יָקָ֛ר מִ/זּוֹלֵ֖ל כְּ/פִ֣/י תִֽהְיֶ֑ה יָשֻׁ֤בוּ הֵ֨מָּה֙ אֵלֶ֔י/ךָ וְ/אַתָּ֖ה לֹֽא תָשׁ֥וּב אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
translation:
  language: de
  text: 'Darum spricht Jahwe: Wenn du umkehrst, werde ich dich zurückbringen[a], und du wirst vor mir stehen. Wenn du das Kostbare aus dem Wertlosen hervorholst[b], wirst du wie mein Mund sein[c]. Sie werden sich dir zuwenden[d]; du aber sollst dich ihnen nicht zuwenden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich eng miteinander verbunden: „Wenn du umkehrst, werde ich dich zurückbringen.“ Das Hebräische verwendet in beiden Satzteilen dasselbe Verb. Gemeint sein können Umkehr, Rückkehr oder Wiederherstellung.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild meint wahrscheinlich, dass Jeremia aus seiner Rede das Wertlose ausscheidet und nur das Kostbare vorbringt; wegen der folgenden Worte „wie mein Mund“ liegt ein Bezug auf sein prophetisches Reden nahe.
    reason: interpretive_ambiguity
  - marker: c
    text: 'Das heißt wahrscheinlich: „Du wirst mein bevollmächtigter Sprecher sein.“ Wörtlich steht: „Du wirst wie mein Mund sein.“'
    reason: lexical_alternative
  - marker: d
    text: 'Oder als Aufforderung: „Sie sollen sich dir zuwenden.“'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit Jeremias vorausgehender Klage knapp und natürlich wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die feierliche prophetische Botenformel in geläufigem biblischem Deutsch und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אִם תָּשׁוּב וַאֲשִׁיבְךָ
  choice: Wenn du umkehrst, werde ich dich zurückbringen
  rationale: Die verwandten deutschen Verben bewahren möglichst weitgehend die Wiederholung von שׁוב; „umkehren“ lässt den möglichen Ruf zur Reue erkennen, ohne ihn darauf zu verengen, während „zurückbringen“ die kausative Form wiedergibt.
- source_word: לְפָנַי תַּעֲמֹד
  choice: sodass du vor mir stehen kannst
  rationale: Bewahrt das konkrete Bild des Stehens vor Gott. Die deutsche Verknüpfung drückt aus, dass das Zurückbringen dieses erneute Stehen ermöglicht, ohne dessen dienstlichen Sinn ausdrücklich auszudeuten.
- source_word: וְאִם תּוֹצִיא יָקָר מִזּוֹלֵל
  choice: Wenn du das Kostbare aus dem Wertlosen hervorholst
  rationale: „Hervorholen“ folgt dem Grundbild von „herausbringen“ und erhält den Gegensatz zwischen Kostbarem und Wertlosem; der wahrscheinlich auf Jeremias Rede bezogene Sinn bleibt offen.
- source_word: כְּפִי תִהְיֶה
  choice: wirst du wie mein Mund sein
  rationale: Bewahrt die auffällige hebräische Metapher statt sie im Haupttext mit „mein Sprecher“ auszudeuten.
- source_word: יָשֻׁבוּ הֵמָּה אֵלֶיךָ
  choice: Sie werden sich dir zuwenden
  rationale: Liest die Imperfektform im Zusammenhang als Zusage und gibt die relationale bzw. richtungsbezogene Bedeutung von שׁוב idiomatisch wieder.
- source_word: וְאַתָּה לֹא תָשׁוּב אֲלֵיהֶם
  choice: du aber sollst dich ihnen nicht zuwenden
  rationale: Die Kontraststellung wird ausdrücklich markiert; „sollst nicht“ gibt die warnende bzw. gebietende Kraft natürlich wieder.
theological_decisions:
- issue: Jeremias Umkehr und Wiederherstellung
  choice: Der Haupttext spricht von Jeremias Umkehr und Gottes Zurückbringen, ohne festzulegen, ob vor allem Reue, eine innere Neuausrichtung oder die Erneuerung seines prophetischen Dienstes gemeint ist.
  alternative: Die Aussage ausdrücklich als Bußruf oder ausschließlich als erneute Beauftragung deuten.
  rationale: Die Wiederholung von שׁוב, das anschließende Stehen vor Gott und das Bild vom Mund Gottes lassen mehrere eng verbundene Aspekte zu; die Übersetzung wahrt diese Spannung.
- issue: Das Kostbare aus dem Wertlosen hervorholen
  choice: Das Bild bleibt im Haupttext erhalten; eine mögliche Beziehung auf geläuterte, würdige prophetische Rede wird in der Fußnote genannt.
  alternative: 'Direkt paraphrasieren: „Wenn du nur Wertvolles und nichts Wertloses sagst“ oder die Worte auf die Trennung von Menschen beziehen.'
  rationale: Der folgende Ausdruck „wie mein Mund“ legt einen Bezug zum Reden nahe, doch die hebräische Bildsprache ist weiter und soll nicht unnötig eingeengt werden.
- issue: „Wie mein Mund“ als prophetische Bevollmächtigung
  choice: Die Metapher wird wörtlich-nah beibehalten.
  alternative: „Du wirst mein Sprecher sein.“
  rationale: Die Auslegung als bevollmächtigtes Reden ist sehr wahrscheinlich, doch das konkrete Bild besitzt eigenes theologisches Gewicht.
- issue: Aussage oder Aufforderung bei יָשֻׁבוּ
  choice: 'Im Haupttext steht die indikativische Zusage: „Sie werden sich dir zuwenden.“'
  alternative: „Sie sollen sich dir zuwenden“ oder „Mögen sie sich dir zuwenden“.
  rationale: Der Zusammenhang unterstützt eine Zusage, doch die Form kann auch auffordernd verstanden werden; die Alternative wird deshalb vermerkt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Botenformel bleibt bewusst feierlich. Konkrete hebräische Bilder und das wiederholte Motiv des Sich-Zuwendens bzw. Umkehrens werden erhalten; erklärende Deutungen stehen in den Fußnoten.
