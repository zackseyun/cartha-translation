source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: „Selbst wenn Mose und Samuel vor mir stünden, würde ich mich diesem Volk nicht zuwenden.[a] Schick sie von mir fort,[b] und sie sollen hinausgehen!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Meine Seele wäre diesem Volk nicht zugewandt.“ Gemeint ist: Ich hätte keine Zuneigung oder kein Wohlwollen für dieses Volk.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „weg von vor meinem Angesicht“; also: „aus meiner Gegenwart“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da“ gibt die zeitlich-fortschreitende Erzählweise natürlich wieder.
- source_word: אִם יַעֲמֹד
  choice: Selbst wenn … vor mich träten
  rationale: אִם hat hier konzessiv-hypothetische Kraft. Der deutsche Konjunktiv kennzeichnet den nachdrücklichen hypothetischen Fall.
- source_word: יַעֲמֹד ... לְפָנַי
  choice: vor mich träten
  rationale: Die räumliche Wendung bleibt erhalten und lässt die im Zusammenhang naheliegende Fürbitte anklingen, ohne sie ausdrücklich in den Text einzutragen.
- source_word: מֹשֶׁה וּשְׁמוּאֵל
  choice: Mose und Samuel
  rationale: Verwendet die etablierten deutschen Namensformen.
- source_word: אֵין נַפְשִׁי אֶל־הָעָם הַזֶּה
  choice: würde ich mich diesem Volk nicht zuwenden
  rationale: Die Wendung bezeichnet die persönliche innere Hinwendung beziehungsweise Geneigtheit. Die idiomatische deutsche Formulierung bewahrt diese relationale Bildrichtung; die wörtlichere anthropomorphe Ausdrucksweise steht in der Fußnote.
- source_word: הָעָם הַזֶּה
  choice: diesem Volk
  rationale: Der kollektive Singular bewahrt den nationalen und gemeinschaftlichen Bezug.
- source_word: שַׁלַּח
  choice: Schick es fort
  rationale: Der Imperativ richtet sich an Jeremia; das im Hebräischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen zur Klarheit mit dem singularischen Kollektivpronomen aufgenommen.
- source_word: מֵעַל פָּנַי
  choice: von meinem Angesicht
  rationale: Die konkrete hebräische Redeweise wird im Haupttext bewahrt; ihre idiomatische Bedeutung wird in der Fußnote erläutert.
- source_word: וְיֵצֵאוּ
  choice: und es soll hinausgehen
  rationale: Die jussivische Fortsetzung nach dem Imperativ wird mit „soll“ wiedergegeben. Der Plural des hebräischen Verbs bezieht sich sinngemäß auf die Angehörigen des kollektivischen „Volkes“; im Deutschen wird der grammatische Singular fortgeführt.
theological_decisions:
- issue: Anthropomorphe Wendung נַפְשִׁי („meine Seele“) in Bezug auf Jahwe
  choice: Im Haupttext idiomatisch „würde ich mich diesem Volk nicht zuwenden“, mit wörtlicherer Wiedergabe in der Fußnote
  alternative: „Meine Seele wäre diesem Volk nicht zugeneigt“
  rationale: Die Übersetzung bewahrt die persönliche, relationale Ausrichtung der hebräischen Aussage, ohne „Seele“ im modernen Deutschen missverständlich als abtrennbaren Wesensbestandteil Gottes erscheinen zu lassen. Die Fußnote macht die Bildsprache transparent.
- issue: Fürbittende Bedeutung des Stehens von Mose und Samuel vor Jahwe
  choice: „vor mich träten“
  alternative: „vor mir Fürbitte einlegten“
  rationale: Mose und Samuel sind als Fürbitter bekannt, doch der hebräische Text nennt ausdrücklich nur das Stehen vor Gott. Die Übersetzung lässt diese theologische Anspielung offen, statt sie auszudeuten.
- issue: Bezug von וְיֵצֵאוּ
  choice: „und es soll hinausgehen“ ohne nähere Bestimmung des Zieles
  alternative: „und es soll mein Land verlassen“
  rationale: Der Text nennt weder Land noch konkretes Ziel. Die offene Formulierung bewahrt die mögliche Beziehung auf Gottes Gegenwart und auf das bevorstehende Gericht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jahwe“ folgt der geläufigen deutschen Form des Gottesnamens. Die Satzfolge bleibt knapp und eindringlich; die konkreten Bilder „vor mich treten“, „von meinem Angesicht“ und „hinausgehen“ werden soweit möglich erhalten.
