  text: Can iron break iron from the north[b][a], and bronze?
translation:
  language: de
  text: Kann Eisen Eisen aus dem Norden[a] und Bronze[b] zerbrechen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kann Eisen Eisen aus dem Norden und Bronze zerschlagen?“ Der hebräische Satz ist knapp formuliert; „Eisen aus dem Norden“ kann als feste Bezeichnung für besonders hartes Eisen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: „Bronze“ kann auch mit „Kupfer“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָרֹעַ
  choice: Kann … zerbrechen
  rationale: Die Fragepartikel הֲ und das Verb רעע bilden hier eine rhetorische Frage. Bei Metallen bezeichnet das Verb ein physisches Zerbrechen oder Zerschlagen; „zerbrechen“ ist im Deutschen natürlich und bewahrt die Bildkraft.
- source_word: בַּרְזֶל
  choice: Eisen
  rationale: Die übliche und eindeutige deutsche Bezeichnung für das Metall.
- source_word: בַּרְזֶל מִצָּפוֹן
  choice: Eisen aus dem Norden
  rationale: Die analytische Wiedergabe bleibt eng am hebräischen Ausdruck und lässt offen, ob damit eine besonders harte, mit dem Norden verbundene Eisensorte gemeint ist.
- source_word: וּנְחֹשֶׁת
  choice: und Bronze
  rationale: נְחֹשֶׁת kann Kupfer oder Bronze bezeichnen. Im Zusammenhang mit widerstandsfähigen Metallen ist „Bronze“ wahrscheinlich; die Konjunktion und die knappe hebräische Reihung bleiben erhalten.
