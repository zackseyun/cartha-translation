source:
  edition: WLC
  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
translation:
  language: de
  text: Weh mir, meine Mutter, dass du mich geboren hast – einen Mann, der mit dem ganzen Land in Streit und Zwist liegt![a] Ich habe niemandem etwas geliehen, und niemand hat mir etwas geliehen,[b] doch sie alle verfluchen mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit der ganzen Erde“.'
    reason: alternative_reading
  - marker: b
    text: Im Hebräischen geht es wahrscheinlich um Leihen und Borgen im Zusammenhang mit Schulden. Jeremia sagt damit, dass er keinen gewöhnlichen gesellschaftlichen Anlass für eine solche Feindseligkeit gegeben hat.
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי לִי
  choice: Weh mir
  rationale: Die Klageformel bringt Jeremias schmerzlichen Ausruf knapp, kräftig und in würdigem modernem Deutsch zum Ausdruck.
- source_word: אִמִּי
  choice: meine Mutter
  rationale: Die direkte Anrede bleibt erhalten und bewahrt die persönliche und emotionale Schärfe der Klage.
- source_word: כִּי יְלִדְתִּנִי
  choice: dass du mich geboren hast
  rationale: Nach „Weh mir“ gibt „dass“ den Anlass der Klage im Deutschen natürlich wieder, ohne die mögliche kausale Nuance auszuschließen.
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  choice: einen Mann, der … in Streit und Zwist liegt
  rationale: Die beiden weitgehend parallelen Konfliktbegriffe werden als „Streit und Zwist“ unterschieden. Die Formulierung beschreibt Jeremia als Gegenstand beziehungsweise Beteiligten allgegenwärtiger Auseinandersetzungen, ohne ihm stillschweigend Streitsucht zuzuschreiben.
- source_word: לְכָל הָאָרֶץ
  choice: mit dem ganzen Land
  rationale: Die Präposition wird entsprechend der durch ריב und מדון bezeichneten Konfliktbeziehung idiomatisch mit „mit“ wiedergegeben. הָאָרֶץ meint im Kontext wahrscheinlich das Land beziehungsweise dessen Bevölkerung, nicht den gesamten Erdkreis.
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  choice: Ich habe niemandem etwas geliehen, und niemand hat mir etwas geliehen
  rationale: Die symmetrische Wiedergabe bewahrt das Wortspiel um Kredit- und Schuldverhältnisse und macht im Deutschen verständlich, dass Jeremia weder Gläubiger noch Schuldner war.
- source_word: כֻּלֹּה מְקַלְלַוּנִי
  choice: doch sie alle verfluchen mich
  rationale: „Sie alle“ gibt die Gesamtheit der Gegner wieder; das Präsens drückt die fortdauernde beziehungsweise allgemeine Feindseligkeit des Partizips aus.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: das Land
  alternative: die ganze Erde
  rationale: Der Zusammenhang im Jeremiabuch weist eher auf Juda beziehungsweise seine Bevölkerung. Die alternative, sprachlich mögliche weitere Bedeutung wird in der Fußnote offengehalten.
- issue: Jeremias Verhältnis zum Streit
  choice: der mit dem ganzen Land in Streit und Zwist liegt
  alternative: ein Mann des Streits und ein Mann des Zwists für das ganze Land
  rationale: Die idiomatische Fassung wahrt die Spannung, ob Jeremia selbst streitet oder aufgrund seiner prophetischen Sendung überall zum Gegenstand von Streit wird, und vermeidet eine unnötige Festlegung auf persönliche Streitsucht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Klageklang. Die Paarung „Streit und Zwist“ erhält die rhetorische Verstärkung des Hebräischen; die Kreditsprache wird bewusst schlicht und parallel formuliert.
