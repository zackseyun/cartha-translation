source:
  edition: WLC
  text: וָ/אֶזְרֵ֥/ם בְּ/מִזְרֶ֖ה בְּ/שַׁעֲרֵ֣י הָ/אָ֑רֶץ שִׁכַּ֤לְתִּי אִבַּ֨דְתִּי֙ אֶת עַמִּ֔/י מִ/דַּרְכֵי/הֶ֖ם לוֹא שָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
translation:
  language: de
  text: Ich streute sie mit der Worfschaufel auseinander an den Toren des Landes[a]. Ich ließ sie kinderlos zurück, ich vernichtete mein Volk; sie kehrten nicht von ihren Wegen um[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den Toren der Erde“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten; im unmittelbaren Zusammenhang ist wahrscheinlich das Land Juda gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische „umkehren“ kann in prophetischen Texten auch die Bedeutung „bereuen“ oder „Buße tun“ tragen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶזְרֵם
  choice: Ich streute sie … auseinander
  rationale: Das Verb זרה bezeichnet hier das Worfeln beziehungsweise Zerstreuen. Die Formulierung bewahrt sowohl die Bewegung des Auseinanderstreuens als auch, zusammen mit dem genannten Gerät, das landwirtschaftliche Bild, ohne das heute wenig geläufige Verb „worfeln“ vorauszusetzen.
- source_word: בְּמִזְרֶה
  choice: mit der Worfschaufel
  rationale: מִזְרֶה bezeichnet ein Gerät zum Worfeln. „Worfschaufel“ ist eine konkrete und im Zusammenhang verständliche deutsche Bezeichnung.
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  choice: an den Toren des Landes
  rationale: „An den Toren“ gibt die Ortsangabe idiomatisch wieder. הָאָרֶץ kann „Land“ oder „Erde“ bedeuten; im Kontext des Gerichts über Juda liegt „Land“ näher, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: שִׁכַּלְתִּי
  choice: Ich ließ sie kinderlos zurück
  rationale: Das Verb bezeichnet das Verursachen von Kinderlosigkeit beziehungsweise Trauer um verlorene Kinder. Diese Formulierung ist im Deutschen natürlich und erhält die Härte des Gerichtswortes.
- source_word: אִבַּדְתִּי אֶת עַמִּי
  choice: ich vernichtete mein Volk
  rationale: Die kausative Bedeutung von אבד wird direkt mit „vernichtete“ wiedergegeben; עַמִּי bleibt als die gewichtige Bezeichnung „mein Volk“ erhalten.
- source_word: מִדַּרְכֵיהֶם לֹא שָׁבוּ
  choice: sie kehrten nicht um von ihren Wegen
  rationale: Die Wortstellung klingt im Deutschen feierlich, bleibt aber verständlich. „Umkehren“ erhält das Bewegungsbild von שׁוּב und lässt zugleich dessen moralisch-penitentiale Bedeutung anklingen, ohne sie auf einen Fachbegriff zu verengen.
theological_decisions:
- issue: Soll שׁוּב ausdrücklich als Buße bezeichnet werden?
  choice: sie kehrten nicht um von ihren Wegen
  alternative: sie bereuten ihre Wege nicht
  rationale: שׁוּב kann im prophetischen Sprachgebrauch Umkehr im Sinn von Reue und Buße bezeichnen, bedeutet wörtlich jedoch „zurückkehren/umkehren“. Die gewählte Fassung bewahrt das Bild und seine theologische Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Das seltenere Fachwort „Worfschaufel“ ist wegen des konkreten landwirtschaftlichen Bildes beibehalten; das weniger geläufige Verb „worfeln“ wird dagegen durch die verständlichere Wendung „auseinanderstreuen“ ersetzt. Die wiederholten Ich-Aussagen und der abschließende Vorwurf bleiben in ihrer schroffen Wirkung erhalten.
