source:
  edition: WLC
  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
translation:
  language: de
  text: Ich saß nicht im Kreis der Lachenden[a] und jubelte nicht. Wegen deiner Hand[b] saß ich allein, denn du hast mich mit Zorn[c] erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Gemeinschaft derer, die sich vergnügen“; auch „im Kreis der Scherzenden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor deiner Hand“; die Wendung kann auch bedeuten: „unter dem Druck deiner Hand“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Grimm“, „Unwille“ oder „Empörung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: ich saß
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Das konkrete „saß“ passt zu בְסוֹד und bewahrt die Wiederholung im zweiten Halbvers.
- source_word: בְסוֹד
  choice: im Kreis
  rationale: סוֹד bezeichnet einen vertrauten Kreis, eine Gemeinschaft oder einen Rat. Hier legt der gesellschaftliche Gegensatz zu Jeremias Einsamkeit „im Kreis“ nahe, ohne einen förmlichen Rat vorauszusetzen.
- source_word: מְשַׂחֲקִים
  choice: der Lachenden
  rationale: Das Partizip von שׂחק kann Menschen bezeichnen, die lachen, scherzen oder sich vergnügen. „der Lachenden“ bleibt nah am Wortlaut und legt nicht vorschnell Spott als Motiv fest.
- source_word: וָאֶעְלֹז
  choice: und jubelte nicht
  rationale: עלז bezeichnet freudiges Jubeln oder Frohlocken. Die Negation aus dem ersten Satzglied gilt sinngemäß auch hier und wird im Deutschen zur Klarheit wiederholt.
- source_word: מִפְּנֵי יָדְךָ
  choice: wegen deiner Hand
  rationale: Die Wendung lautet wörtlich etwa „vor deiner Hand her“. „Wegen deiner Hand“ gibt den wahrscheinlichen kausalen Sinn wieder und erhält zugleich das Bild der göttlichen Hand.
- source_word: בָּדָד
  choice: allein
  rationale: בָּדָד bezeichnet Absonderung oder Einsamkeit. „allein“ ist knapp, natürlich und wahrt die emotionale Kraft.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für Jeremias abgesondertes Sitzen ein.
- source_word: זַעַם
  choice: Empörung
  rationale: זַעַם kann Zorn, Grimm oder Empörung bezeichnen, häufig im Zusammenhang mit göttlichem Zorn. „Empörung“ bewahrt den Ernst, ohne eindeutig festzulegen, ob vor allem Gottes Zorn oder die dadurch in Jeremia hervorgerufene Empörung gemeint ist.
- source_word: מִלֵּאתָנִי
  choice: du hast mich erfüllt
  rationale: מלא bedeutet „füllen, erfüllen“. Das deutsche Perfekt gibt die abgeschlossene Handlung natürlich wieder und behält Gott als handelndes Subjekt bei.
theological_decisions:
- issue: Bedeutung der göttlichen „Hand“ für Jeremias Einsamkeit
  choice: Das Bild der Hand bleibt erhalten; „wegen“ kennzeichnet sie als Ursache seiner Absonderung.
  alternative: „unter dem Druck deiner Hand“ oder Deutung als Schutz beziehungsweise bloße Gegenwart Gottes
  rationale: Der Zusammenhang weist auf Gottes wirksame Macht und den Druck des prophetischen Auftrags hin. Die bildhafte Formulierung bleibt jedoch offen genug, um die Metapher nicht auf eine einzige dogmatische Deutung zu verengen.
- issue: Bedeutungsumfang von זַעַם
  choice: „Empörung“
  alternative: „Zorn“, „Grimm“ oder „Unwille“
  rationale: Da Gott Jeremia damit erfüllt, entsteht eine gewollte Spannung zwischen Gottes Gerichtszorn und Jeremias eigener, von Gott bewirkter Reaktion. „Empörung“ lässt diese Zuordnung offen, statt sie stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Wiedergabe von יָשַׁבְתִּי mit „saß“ erhält die poetische Wiederholung. Die kurzen Hauptsätze und die direkte Anrede bewahren den persönlichen Klagecharakter.
