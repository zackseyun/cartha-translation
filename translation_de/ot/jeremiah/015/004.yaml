  text: וּ/נְתַתִּ֣י/ם ל/זועה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ בִּ֠/גְלַל מְנַשֶּׁ֤ה בֶן יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַ֥ל אֲשֶׁר עָשָׂ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
translation:
  language: de
  text: Und ich werde sie für alle Königreiche der Erde zum Entsetzen machen[a], wegen Manasse, des Sohnes Hiskias, des Königs von Juda, wegen dessen, was er in Jerusalem getan hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Gegenstand des Schreckens“ oder „zum Schauder“. Das hebräische Substantiv bezeichnet etwas, das Schrecken oder Schauder hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Und ich werde sie … machen
  rationale: נתן mit prädikativer Ergänzung und ל bezeichnet hier das Versetzen in einen Zustand; „machen“ gibt diese resultative Bedeutung natürlich wieder.
- source_word: לְזַוֲעָה
  choice: zum Entsetzen
  rationale: Das seltene Substantiv bezeichnet Schrecken beziehungsweise ein Schauder hervorrufendes Objekt. „Zum Entsetzen“ ist im Deutschen knapp und idiomatisch, ohne den Ausdruck unnötig festzulegen.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: für alle Königreiche der Erde
  rationale: Die Präposition ל bezeichnet hier die Beziehung zu den Königreichen, vor deren Augen sie zum Entsetzen werden.
- source_word: בִּגְלַל
  choice: wegen
  rationale: Die kausale Bedeutung ist eindeutig und wird unmittelbar wiedergegeben.
- source_word: מְנַשֶּׁה בֶן יְחִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Manasse, des Sohnes Hiskias und Königs von Juda
  rationale: Die Namen und die zweifache nähere Bestimmung Manasses werden knapp und eindeutig wiedergegeben.
- source_word: עַל אֲשֶׁר עָשָׂה
  choice: wegen dessen, was er … getan hat
  rationale: Die zweite kausale Angabe präzisiert, dass Manasses Handeln der Grund des angekündigten Gerichts ist; die Wiederholung von „wegen“ bewahrt diese ausdrückliche Verknüpfung.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Schlichte örtliche Angabe mit der üblichen deutschen Namensform.
theological_decisions:
- issue: Das Gericht über das Volk wird ausdrücklich mit den Taten Manasses verknüpft.
  choice: Die doppelte kausale Verknüpfung bleibt ungemildert erhalten.
  alternative: Die Taten Manasses lediglich als historischen Hintergrund darstellen.
  rationale: Der hebräische Text nennt Manasse und sein Handeln in Jerusalem ausdrücklich als Grund. Die Spannung eines gemeinschaftlichen Gerichts aufgrund der Taten eines Königs wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Kausalgefüge, bleibt aber idiomatisch; „zum Entsetzen“ bewahrt die Bildhaftigkeit und die lexikalische Spannweite des seltenen hebräischen Ausdrucks.
