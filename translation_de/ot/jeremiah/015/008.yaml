source:
  edition: WLC
  text: עָֽצְמוּ לִ֤/י אַלְמְנֹתָ/ו֙ מֵ/ח֣וֹל יַמִּ֔ים הֵבֵ֨אתִי לָ/הֶ֥ם עַל אֵ֛ם בָּח֖וּר שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם הִפַּ֤לְתִּי עָלֶ֨י/הָ֙ פִּתְאֹ֔ם עִ֖יר וּ/בֶהָלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: de
  text: Ihre Witwen sind mir zahlreicher geworden als der Sand der Meere. Gegen sie, gegen die Mutter des jungen Mannes, ließ ich am Mittag einen Verwüster kommen. Plötzlich ließ ich Stadt und Schrecken über sie hereinbrechen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des letzten Satzes ist schwer verständlich. Die überlieferte Vokalisierung lautet wörtlich etwa: »Plötzlich ließ ich Stadt und Schrecken über sie fallen.« Manche Übersetzungen deuten oder ändern »Stadt« zu »Angst«, »Qual« oder einer ähnlichen Aussage.'
    reason: Die masoretische Lesart עִיר (»Stadt«) ergibt eine ungewöhnliche Verbindung. Die Fußnote bewahrt die Textform und weist zugleich transparent auf die Übersetzungsunsicherheit hin.
lexical_decisions:
- source_word: עָצְמוּ
  choice: sind … zahlreicher geworden
  rationale: Gibt die Grundbedeutung »zahlreich/mächtig werden« im Kontext einer anwachsenden Zahl von Witwen natürlich wieder.
- source_word: לִי
  choice: mir
  rationale: Bewahrt den im Hebräischen ausdrücklich gesetzten Bezug auf den Sprecher, ohne ihn deutend als bloßes »vor meinen Augen« aufzulösen.
- source_word: שֹׁדֵד
  choice: Verwüster
  rationale: Bezeichnet eine Person oder Macht, die gewaltsam verheert; »Verwüster« passt zum Gerichtskontext und bleibt näher am Partizip als eine abstrakte Wiedergabe.
- source_word: בַּצָּהֳרָיִם
  choice: am hellen Mittag
  rationale: »Mittags« ist die wörtliche Zeitangabe; »hellen« verdeutlicht idiomatisch die erschreckende Offenheit und Unerwartetheit des Angriffs, ohne eine neue Aussage einzuführen.
- source_word: עִיר
  choice: Stadt
  rationale: Entspricht der vokalisierten masoretischen Lesart. Da die Verbindung »Stadt und Schrecken über sie hereinbrechen lassen« schwierig ist, wird sie nicht stillschweigend geglättet, sondern in einer Fußnote erläutert.
- source_word: בֶהָלוֹת
  choice: Schrecken
  rationale: Der Plural bezeichnet plötzlich hereinbrechende Schrecknisse oder Bestürzungen; der deutsche Sammelbegriff bewahrt die Wucht der Aussage.
theological_decisions:
- issue: Bezug von Gottes Gerichtshandeln
  choice: 'Die erste Person wird unverändert als handelnder göttlicher Sprecher wiedergegeben: »ließ ich … kommen« und »ließ ich … hereinbrechen«.'
  alternative: Passivische Formulierungen, die Gottes unmittelbare Urheberschaft abschwächen.
  rationale: Die hebräischen Hifilformen schreiben das Gericht ausdrücklich dem Sprecher zu; diese Spannung darf nicht abgeschwächt werden.
- issue: Singularische »Mutter des jungen Mannes«
  choice: Der auffällige Singular bleibt erhalten.
  alternative: Verallgemeinernd »Mütter junger Männer« oder kollektiv »die Mutter der jungen Männer«.
  rationale: Der masoretische Text hat beide Ausdrücke im Singular. Eine kollektive Bedeutung ist möglich, aber nicht sicher genug, um sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Präpositionalfügung »gegen sie, gegen die Mutter …« bildet die markierte hebräische Satzstruktur ab. »Hereinbrechen« ist eine natürliche deutsche Wiedergabe von »über sie fallen lassen«, während die schwierige masoretische Lesart »Stadt« ausdrücklich stehen bleibt.
