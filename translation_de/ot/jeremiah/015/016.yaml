source:
  edition: WLC
  text: נִמְצְא֤וּ דְבָרֶ֨י/ךָ֙ וָ/אֹ֣כְלֵ֔/ם וַ/יְהִ֤י דברי/ך לִ֔/י לְ/שָׂשׂ֖וֹן וּ/לְ/שִׂמְחַ֣ת לְבָבִ֑/י כִּֽי נִקְרָ֤א שִׁמְ/ךָ֙ עָלַ֔/י יְהוָ֖ה אֱלֹהֵ֥י צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
translation:
  language: de
  text: Deine Worte wurden gefunden, und ich aß sie. Deine Worte wurden mir zu Jubel und zur Freude meines Herzens; denn ich bin nach deinem Namen genannt[a], Jahwe, Gott der Heerscharen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Dein Name ist über mir genannt worden.“ Die Wendung bezeichnet Zugehörigkeit zu Gott und das Tragen seines Namens.'
    reason: Die Fußnote bewahrt die räumliche Bildform des hebräischen Idioms, während der Haupttext dessen natürliche deutsche Bedeutung wiedergibt.
lexical_decisions:
- source_word: נִמְצְאוּ
  choice: wurden gefunden
  rationale: Die passive Nifal-Form wird bewahrt; der Satz sagt nicht ausdrücklich, dass Jeremia aktiv nach den Worten suchte.
- source_word: דְבָרֶיךָ
  choice: deine Worte
  rationale: Der hebräische Plural wird in beiden Vorkommen beibehalten.
- source_word: וָאֹכְלֵם
  choice: ich aß sie
  rationale: Die anschauliche Metapher des Essens wird nicht durch eine abstrakte Umschreibung abgeschwächt.
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחַת לְבָבִי
  choice: zu Jubel und zur Freude meines Herzens
  rationale: „Jubel“ gibt die lebhafte Freude von שָׂשׂוֹן wieder; „Freude meines Herzens“ entspricht der zweiten, innerlich zugespitzten Wendung, ohne im Deutschen schwerfällig zu wirken.
- source_word: נִקְרָא שִׁמְךָ עָלַי
  choice: dein Name ist über mir ausgerufen worden
  rationale: Die räumliche Bildsprache mit עַל bleibt sichtbar. Zugleich vermittelt „ausgerufen“ den Vorgang des Nennens beziehungsweise der Zuordnung zu Gottes Namen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Gott der Heerscharen
  rationale: Die traditionelle deutsche Wiedergabe bewahrt die Weite des Ausdrucks צְבָאוֹת, ohne ihn ausschließlich auf irdische Armeen einzuengen.
theological_decisions:
- issue: Die Wendung, dass Gottes Name über Jeremia ausgerufen ist
  choice: dein Name ist über mir ausgerufen worden
  alternative: ich bin nach deinem Namen genannt / ich gehöre zu dir
  rationale: Der Haupttext erhält das ungewöhnliche Bundes- und Zugehörigkeitsbild, statt es auf nur eine Deutung festzulegen. Die Fußnote nennt die idiomatische Bedeutung.
- issue: Wiedergabe des Tetragramms
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Übersetzung gibt ihn daher als Namen wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze und das Bild des Essens bleiben bewusst direkt. „Heerscharen“ ist leicht gehoben, für den festen Gottesnamen-Titel jedoch sachlich weit und im Deutschen etabliert.
