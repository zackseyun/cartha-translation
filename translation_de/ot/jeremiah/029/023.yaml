  variant: modern standard German
source:
  edition: WLC
  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
translation:
  language: de
  text: weil sie in Israel eine Schandtat begangen[a], mit den Ehefrauen ihrer Mitmenschen Ehebruch getrieben und in meinem Namen eine Lüge verkündet haben, die zu verkünden ich ihnen nicht befohlen hatte. Ich selbst weiß es und bin Zeuge[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine schändliche Tat“ beziehungsweise „eine Torheit begangen“. Das hebräische Wort bezeichnet eine moralisch empörende, entehrende Tat.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Und ich, ich bin der Wissende und Zeuge.“ Die hebräische Formulierung hebt das „Ich“ nachdrücklich hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet den Grund für das im vorigen Vers angekündigte Gericht ein; „weil“ gibt die kausale Funktion natürlich wieder.
- source_word: עָשׂוּ נְבָלָה
  choice: eine Schandtat begangen
  rationale: נְבָלָה bezeichnet eine moralisch empörende und entehrende Tat; „Schandtat“ bewahrt die starke Wertung und ist im Deutschen idiomatisch.
- source_word: בְּיִשְׂרָאֵל
  choice: in Israel
  rationale: Die Präposition wird unmittelbar lokal beziehungsweise gemeinschaftsbezogen wiedergegeben, ohne zwischen Land und Gemeinschaft unnötig zu entscheiden.
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  choice: mit den Frauen ihrer Mitmenschen Ehebruch getrieben
  rationale: נאף bezeichnet ausdrücklich Ehebruch. רֵעַ meint hier andere Angehörige der Gemeinschaft; „Mitmenschen“ vermeidet die im modernen Deutschen oft rein räumliche Engführung von „Nachbarn“.
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  choice: in meinem Namen eine Lüge verkündet haben
  rationale: Der Gebrauch des göttlichen Namens beansprucht prophetische Autorisierung. „verkündet“ lässt diesen Kontext erkennen, während „eine Lüge“ die konkrete Falschaussage bewahrt.
- source_word: אֲשֶׁר לֹא צִוִּיתִם
  choice: die ich ihnen nicht aufgetragen hatte
  rationale: Der Relativsatz bestreitet die göttliche Beauftragung; das Plusquamperfekt macht im Deutschen deutlich, dass kein vorausgehender Auftrag ergangen war.
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  choice: Ich selbst weiß es und bin Zeuge
  rationale: „Ich selbst“ bildet die emphatische Folge אָנֹכִי הוּא ab. Die koordinierte Form wahrt sowohl Gottes Wissen als auch seine forensische Zeugenrolle, ohne unnatürliche deutsche Syntax.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste Prophetenformel wird würdig und knapp wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gottes Rolle als Wissender und Zeuge
  choice: Ich selbst weiß es und bin Zeuge
  alternative: Ich bin derjenige, der weiß und Zeuge ist
  rationale: Die gewählte Form bewahrt Nachdruck und forensische Aussage, vermeidet aber im Deutschen eine schwerfällige Selbstidentifikation; sie legt nicht fest, ob „Zeuge“ hier zusätzlich den Sinn „bezeugend“ annimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen, wird aber durch idiomatische deutsche Verbverbindungen geglättet. „Schandtat“ trägt die starke moralische Wertung; „Ausspruch Jahwes“ bewahrt den feierlichen prophetischen Abschluss.
