  variant: modern standard German
source:
  edition: WLC
  text: שְׁלַ֤ח עַל כָּל הַ/גּוֹלָה֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה אֶל שְׁמַעְיָ֖ה הַ/נֶּחֱלָמִ֑י יַ֡עַן אֲשֶׁר֩ נִבָּ֨א לָ/כֶ֜ם שְׁמַעְיָ֗ה וַֽ/אֲנִי֙ לֹ֣א שְׁלַחְתִּ֔י/ו וַ/יַּבְטַ֥ח אֶתְ/כֶ֖ם עַל שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
translation:
  language: de
  text: 'Sende an alle Weggeführten und sage: »So spricht Jahwe über Schemaja, den Nehelamiter[a]: Weil Schemaja euch geweissagt hat, obwohl ich ihn nicht gesandt habe, und euch dazu gebracht hat, auf eine Lüge zu vertrauen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »den Träumer«, falls die Bezeichnung von einem mit »träumen« verwandten Wort abgeleitet ist und nicht von einem Orts- oder Sippennamen.'
    reason: lexikalische Alternative wegen unsicherer Herleitung von הַנֶּחֱלָמִי
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  choice: Sende an alle Weggeführten
  rationale: Der singularische Imperativ richtet sich an Jeremia. עַל bezeichnet mit שׁלח hier idiomatisch die Empfänger der Botschaft; הַגּוֹלָה meint die deportierte Gemeinschaft.
- source_word: לֵאמֹר
  choice: und sage
  rationale: Der quotative Infinitiv wird im Deutschen natürlich als koordinierte Aufforderung wiedergegeben.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die traditionelle prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  choice: über Schemaja, den Nehelamiter
  rationale: אֶל führt hier den Gegenstand des Gotteswortes ein, nicht dessen Adressaten. Die unsichere Bezeichnung הַנֶּחֱלָמִי wird zurückhaltend transliteriert.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Die kausale Wendung leitet den Grund für das folgende Gerichtswort ein.
- source_word: נִבָּא לָכֶם
  choice: euch geweissagt hat
  rationale: Das Nifal von נבא bezeichnet hier das Auftreten und Reden als Prophet.
- source_word: וַאֲנִי לֹא שְׁלַחְתִּיו
  choice: obwohl ich ihn nicht gesandt habe
  rationale: Die konzessive Formulierung bringt den Gegensatz zwischen Schemajas Anspruch und Gottes fehlendem Auftrag klar zum Ausdruck.
- source_word: וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  choice: euch dazu gebracht hat, auf eine Lüge zu vertrauen
  rationale: Die Hifil-Form von בטח ist kausativ. עַל bezeichnet die falsche Grundlage beziehungsweise den Gegenstand des Vertrauens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Art von Schemajas prophetischem Reden
  choice: geweissagt
  alternative: als Prophet geredet
  rationale: Die Übersetzung gibt נבא formal als prophetisches Reden wieder, ohne bereits im Verb zu entscheiden, ob der Anspruch echt oder falsch war; Gottes fehlender Auftrag wird ausdrücklich im Folgesatz benannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt offen, weil der mit »Weil« beginnende Begründungssatz erst im folgenden Vers zum Hauptsatz führt. »Weggeführte« bildet die Exilgemeinschaft konkret und verständlich ab.
