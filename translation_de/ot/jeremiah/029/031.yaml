  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des hebräischen Textes präzise wieder: den an Jeremia gerichteten Singularimperativ, die gesamte Exilgemeinschaft als Empfänger, die prophetische Botenformel, den Gegenstand des Wortes über Schemaja, den Kausalanschluss sowie die beiden Anschuldigungen. »euch dazu gebracht hat, auf eine Lüge zu vertrauen« erhält den kausativen Sinn von וַיַּבְטַח אֶתְכֶם und die falsche Grundlage des Vertrauens.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. »Weggeführten« ist in diesem Kontext eine angemessene, konkrete Bezeichnung der deportierten Exilgemeinschaft. Der mit »Weil« eröffnete und mit Komma offen bleibende Satz entspricht korrekt der versübergreifenden Syntax.
  terminology: »Jahwe« gibt den Gottesnamen konsistent als Eigennamen wieder. »Schemaja« und die vorsichtige Transkription »Nehelamiter« sind sachgerecht. »geweissagt« wahrt zunächst die formale prophetische Aussage, während die fehlende göttliche Sendung ausdrücklich genannt wird.
