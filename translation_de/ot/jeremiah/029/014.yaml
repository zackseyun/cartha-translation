source:
  edition: WLC
  text: וְ/נִמְצֵ֣אתִי לָ/כֶם֮ נְאֻם יְהוָה֒ וְ/שַׁבְתִּ֣י אֶת שבית/כם וְ/קִבַּצְתִּ֣י אֶ֠תְ/כֶם מִֽ/כָּל הַ/גּוֹיִ֞ם וּ/מִ/כָּל הַ/מְּקוֹמ֗וֹת אֲשֶׁ֨ר הִדַּ֧חְתִּי אֶתְ/כֶ֛ם שָׁ֖ם נְאֻם יְהוָ֑ה וַ/הֲשִׁבֹתִ֣י אֶתְ/כֶ֔ם אֶל הַ֨/מָּק֔וֹם אֲשֶׁר הִגְלֵ֥יתִי אֶתְ/כֶ֖ם מִ/שָּֽׁם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
translation:
  language: de
  text: Und ich werde mich von euch finden lassen, spricht Jahwe. Ich werde euer Geschick wenden[a] und euch aus allen Völkern und von all den Orten sammeln, wohin ich euch vertrieben habe, spricht Jahwe. Ich werde euch an den Ort zurückbringen, von dem ich euch in die Verbannung geführt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „eure Gefangenschaft wenden/zurückführen“ oder „eure Gefangenen zurückbringen“. Die hebräische Wendung bezeichnet die Umkehr einer Lage von Exil und Not.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  choice: Und ich werde mich von euch finden lassen
  rationale: Das Nifal von מצא bedeutet hier „gefunden werden“. Die reflexiv-passive Formulierung „mich finden lassen“ ist im Deutschen natürlich, wahrt Gottes Initiative und deutet den Ausdruck weniger stark aus als „mich offenbaren“.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Charakter der Wendung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וְשַׁבְתִּי אֶת שביתכם
  choice: Ich werde euer Geschick wenden
  rationale: Die hebräische Wendung bezeichnet idiomatisch die Umkehr einer Not- und Exilslage. „Das Geschick wenden“ ist im Deutschen verständlich und bewahrt zugleich das Bild einer grundlegenden Wiederherstellung; wörtlichere Deutungen werden in der Fußnote genannt.
- source_word: וְקִבַּצְתִּי אֶתְכֶם
  choice: und euch … sammeln
  rationale: קבץ bezeichnet im Zusammenhang der Wiederherstellung das Sammeln eines zerstreuten Volkes und wird direkt und natürlich wiedergegeben.
- source_word: מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  choice: aus allen Völkern und von all den Orten
  rationale: Die Wiedergabe erhält die parallele Ausweitung von politischen Gemeinschaften auf sämtliche Orte der Zerstreuung.
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  choice: wohin ich euch vertrieben habe
  rationale: Das Hifil von נדח drückt ein Vertreiben oder Verbannen aus. „Vertrieben“ bewahrt die Härte des göttlichen Gerichts, ohne zusätzliche Einzelheiten einzutragen.
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם
  choice: Ich werde euch … zurückbringen
  rationale: 'Das Hifil von שוב ist kausativ: Jahwe bewirkt die Rückkehr. „Zurückbringen“ gibt dies in natürlichem Deutsch wieder.'
- source_word: אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  choice: von dem ich euch in die Verbannung geführt habe
  rationale: Das Hifil von גלה bezeichnet das Ins-Exil-Führen. Die Formulierung macht den im Verb enthaltenen Exilbezug deutlich und bewahrt Jahwe als Handelnden.
theological_decisions:
- issue: Bedeutung der Wiederherstellungsformel שׁוּב אֶת־שְׁבוּת/שְׁבִית
  choice: Ich werde euer Geschick wenden
  alternative: Ich werde eure Gefangenschaft wenden/zurückführen; ich werde eure Gefangenen zurückbringen
  rationale: Die Formel kann idiomatisch die umfassende Umkehr einer durch Gericht, Not und Exil geprägten Lage bezeichnen. Da die folgenden Aussagen die konkrete Sammlung und Rückkehr ausdrücklich nennen, gibt „euer Geschick wenden“ die umfassende Bedeutung ohne unnötige Verengung wieder. Die wörtlicheren, stärker auf Gefangenschaft oder Gefangene bezogenen Möglichkeiten bleiben in der Fußnote sichtbar.
- issue: Göttliche Verantwortung für Exil und Rückkehr
  choice: Jahwe hat das Volk vertrieben und in die Verbannung geführt; Jahwe sammelt es und bringt es zurück
  alternative: Passivische oder unpersönliche Formulierungen, die Gottes Handeln abschwächen
  rationale: Der hebräische Text nennt Jahwe ausdrücklich als Handelnden sowohl im Gericht als auch bei der Wiederherstellung. Diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze geben die prophetische Zusage klar wieder. „Jahwe“ bewahrt den persönlichen Gottesnamen; „spricht Jahwe“ entspricht der etablierten deutschen Prophetenformel. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wiederherstellungsformel.
