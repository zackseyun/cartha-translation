reference: Jeremiah 29:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: יְהוָ֞ה נְתָנְ/ךָ֣ כֹהֵ֗ן תַּ֚חַת יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן לִֽ/הְי֤וֹת פְּקִדִים֙ בֵּ֣ית יְהוָ֔ה לְ/כָל אִ֥ישׁ מְשֻׁגָּ֖ע וּ/מִתְנַבֵּ֑א וְ/נָתַתָּ֥ה אֹת֛/וֹ אֶל הַ/מַּהְפֶּ֖כֶת וְ/אֶל הַ/צִּינֹֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
translation:
  language: de
  text: Jahwe hat dich anstelle des Priesters Jojada zum Priester eingesetzt, damit du als Aufseher[a] im Haus Jahwes über jeden Mann wachst, der wahnsinnig ist und als Prophet auftritt[b]. Einen solchen sollst du in den Stock und ins Halseisen[c] legen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Hebräischen die Mehrzahl „Aufseher“; gemeint sein können auch Amtsträger oder Beauftragte. Angesprochen wird jedoch eine einzelne Person.
    reason: lexical_alternative
  - marker: b
    text: 'Oder neutraler: „weissagt“. Die Hauptfassung lässt den abwertenden Ton des Schreibers erkennen.'
    reason: alternative_reading
  - marker: c
    text: Die genaue Art dieser Fessel ist unsicher. Wahrscheinlich war sie ein eiserner Halsring oder eine andere eiserne Zwangsvorrichtung, die zusammen mit dem Stock verwendet wurde.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נְתָנְךָ כֹהֵן
  choice: hat dich … zum Priester eingesetzt
  rationale: נתן bezeichnet in dieser Verbindung idiomatisch die Einsetzung in ein Amt; die Formulierung ist im Deutschen natürlich und präzise.
- source_word: תַּחַת יְהוֹיָדָע הַכֹּהֵן
  choice: anstelle des Priesters Jojada
  rationale: תחת bezeichnet hier die Nachfolge beziehungsweise Ersetzung im Amt, nicht Unterordnung.
- source_word: לִהְיוֹת פְּקִדִים
  choice: damit du als Aufseher … wachst
  rationale: פקידים bezeichnet Personen mit Aufsichts- oder Ordnungsfunktion. Die deutsche Einzahl folgt dem singularischen Adressaten; die auffällige hebräische Mehrzahl wird in einer Fußnote offengelegt.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Bewahrt das hebräische Bild und bezeichnet in diesem Zusammenhang den Tempel.
- source_word: לְכָל אִישׁ מְשֻׁגָּע
  choice: über jeden Mann …, der wahnsinnig ist
  rationale: Bewahrt sowohl die maskuline Einzahl von איש als auch die abwertende Charakterisierung משגע aus der Perspektive des Briefschreibers.
- source_word: וּמִתְנַבֵּא
  choice: und als Prophet auftritt
  rationale: Gibt den feindseligen Ton wieder, ohne im Übersetzungstext abschließend zu entscheiden, ob die betreffende Person wirklich weissagt.
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Einen solchen sollst du … legen
  rationale: Die Verbfolge drückt hier die erwartete amtliche Maßnahme aus. Das Demonstrativ nimmt den zuvor beschriebenen Mann natürlich wieder auf.
- source_word: הַמַּהְפֶּכֶת
  choice: den Stock
  rationale: Bezeichnet eine Vorrichtung zum Fesseln und Bestrafen; „Stock“ ist die etablierte knappe deutsche Wiedergabe.
- source_word: הַצִּינֹק
  choice: das Halseisen
  rationale: Bezeichnet wahrscheinlich eine eiserne Fessel oder einen Halsring. „Halseisen“ bewahrt die Unsicherheit über die genaue Bauart besser als eine enger festgelegte Bezeichnung.
theological_decisions:
- issue: Feindselige Bezeichnung prophetischen Auftretens
  choice: als Prophet auftritt
  alternative: weissagt
  rationale: Die Hauptfassung lässt die abwertende Sicht des Briefschreibers erkennen, ohne zu behaupten, Jeremia sei kein wahrer Prophet; die neutralere grammatische Möglichkeit wird in der Fußnote genannt.
- issue: Generisches maskulines אִישׁ
  choice: jeden Mann
  alternative: jeden Menschen
  rationale: Die Wiedergabe folgt der grammatisch maskulinen Einzahl des Ausgangstextes, ohne den Anwendungsbereich darüber hinaus theologisch einzuengen.
- issue: Singularischer Adressat bei pluralischem פְּקִדִים
  choice: du als Aufseher
  alternative: du … Aufseher (Plural)
  rationale: Idiomatic German requires agreement with the singular addressee; the genuine formal tension in Hebrew is explicitly retained in the note rather than silently explained away.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jahwe“ bewahrt den Gottesnamen; „Haus Jahwes“ hält das biblische Bild fest. Der Satz wurde moderat gegliedert, damit die lange hebräische Konstruktion verständlich bleibt. Die abwertende Sprache gehört zur Perspektive des Sprechers und wird weder verschärft noch neutralisiert.
