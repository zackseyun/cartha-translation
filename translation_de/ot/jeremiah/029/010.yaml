id: JER.29.10
reference: Jeremiah 29:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כִּ֠י לְ/פִ֞י מְלֹ֧את לְ/בָבֶ֛ל שִׁבְעִ֥ים שָׁנָ֖ה אֶפְקֹ֣ד אֶתְ/כֶ֑ם וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ אֶת דְּבָרִ֣/י הַ/טּ֔וֹב לְ/הָשִׁ֣יב אֶתְ/כֶ֔ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Wenn für Babel siebzig Jahre vollendet sind[a], werde ich mich euch zuwenden[b] und mein gutes Wort an euch erfüllen[c], um euch an diesen Ort zurückzubringen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »wenn siebzig Jahre für Babel vollendet sind«. Gemeint sein kann die mit Babel verbundene, festgesetzte Zeit; der hebräische Ausdruck legt nicht näher fest, worin diese Zuordnung besteht.'
    reason: alternative_reading
  - marker: b
    text: 'Auch: »werde ich nach euch sehen« oder »werde ich euch heimsuchen«. Das hebräische Verb bezeichnet, dass Gott sich jemandem zuwendet und eingreift – zum Gericht oder, wie hier, zum Guten.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: »werde ich mein gutes Wort an euch bestätigen/in Kraft setzen«. Gemeint ist, dass Jahwe seine Zusage ausführt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Die geläufige deutsche Botenformel gibt die hebräische Einleitung knapp und würdig wieder; כִּי stellt die Aussage begründend in ihren Zusammenhang.
- source_word: כִּי לְפִי מְלֹאת לְבָבֶל שִׁבְעִים שָׁנָה
  choice: Wenn für Babel siebzig Jahre vollendet sind
  rationale: Die Formulierung bewahrt die Zuordnung der siebzig Jahre zu Babel, ohne festzulegen, ob die Dauer der babylonischen Vorherrschaft oder des Exils gemeint ist.
- source_word: אֶפְקֹד אֶתְכֶם
  choice: werde ich mich euch zuwenden
  rationale: פקד bezeichnet das aufmerksame Eingreifen gegenüber jemandem und kann je nach Zusammenhang Gericht oder Fürsorge bedeuten. Hier zeigt der Wiederherstellungszusammenhang eine wohlwollende Zuwendung an.
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  choice: und mein gutes Wort an euch erfüllen
  rationale: קום im Hifil bedeutet zusammen mit דבר, ein gesprochenes Wort in Kraft zu setzen beziehungsweise auszuführen. »Mein gutes Wort« erhält die Bildsprache des Hebräischen, während »erfüllen« den idiomatischen Sinn ausdrückt.
- source_word: לְהָשִׁיב אֶתְכֶם
  choice: um euch ... zurückzubringen
  rationale: 'Das Hifil von שוב ist kausativ: Gott bewirkt die Rückkehr. Die deutsche Formulierung gibt zugleich den Zweck der Erfüllung des zugesagten Wortes wieder.'
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: an diesen Ort
  rationale: מקום bedeutet hier »Ort«. Die Übersetzung vermeidet die kontextuell mögliche, aber gegenüber dem Wortlaut engere Deutung als Jerusalem, Juda oder das Land.
theological_decisions:
- issue: Bezug der siebzig Jahre auf Babel
  choice: Die offene Formulierung »für Babel« bleibt erhalten.
  alternative: »siebzig Jahre in Babel« oder »Babels siebzig Jahre«
  rationale: Die hebräische Präposition kennzeichnet eine Beziehung zu Babel, bestimmt aber nicht ausdrücklich, ob dessen Herrschaftszeit oder die Dauer des Exils gemeint ist. Die Übersetzung legt keine bestimmte Chronologie fest.
- issue: Bedeutung von Gottes פקד gegenüber den Exilierten
  choice: Im Haupttext steht die kontextuell positive Wiedergabe »mich euch zuwenden«.
  alternative: »euch heimsuchen« oder »nach euch sehen«
  rationale: Das Verb kann sowohl fürsorgliches als auch richtendes Eingreifen bezeichnen. Die Zusage der Rückkehr macht hier die günstige Seite deutlich, ohne die weitere Bedeutungsbreite in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. »Babel« folgt der in deutschen Bibelübersetzungen üblichen Form des alttestamentlichen Ortsnamens. Die Satzstruktur bleibt nahe am Hebräischen, ohne unnatürlich zu wirken.
