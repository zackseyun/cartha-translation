source:
  edition: WLC
  text: קְח֣וּ נָשִׁ֗ים וְ/הוֹלִידוּ֮ בָּנִ֣ים וּ/בָנוֹת֒ וּ/קְח֨וּ לִ/בְנֵי/כֶ֜ם נָשִׁ֗ים וְ/אֶת בְּנֽוֹתֵי/כֶם֙ תְּנ֣וּ לַֽ/אֲנָשִׁ֔ים וְ/תֵלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/רְבוּ שָׁ֖ם וְ/אַל תִּמְעָֽטוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
translation:
  language: de
  text: Nehmt euch Frauen und zeugt Söhne und Töchter. Nehmt auch für eure Söhne Frauen, und gebt eure Töchter Männern zur Frau[a], damit sie Söhne und Töchter gebären. Vermehrt euch dort und werdet nicht weniger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gebt eure Töchter Männern“; im Zusammenhang ist damit gemeint, sie zu verheiraten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  choice: Nehmt euch Frauen
  rationale: Die hebräische Wendung bezeichnet die Eheschließung. Die reflexive deutsche Form macht diesen Sinn verständlich und bewahrt zugleich das konkrete Wort „Frauen“.
- source_word: וְהוֹלִידוּ
  choice: zeugt
  rationale: Der Hifil von ילד hat bei männlichem Subjekt den Sinn „zeugen“. Diese Wiedergabe erhält die Perspektive des Ausgangstextes genauer als das allgemeinere „bekommt“.
- source_word: בָּנִים וּבָנוֹת
  choice: Söhne und Töchter
  rationale: Der hebräische Text nennt ausdrücklich beide Geschlechter; die konkrete Formulierung wird daher nicht zu „Kinder“ verallgemeinert.
- source_word: וּקְחוּ לִבְנֵיכֶם נָשִׁים
  choice: Nehmt auch für eure Söhne Frauen
  rationale: Die Formulierung folgt der Heiratswendung des Hebräischen eng, ohne durch „sucht“ eine im Text nicht ausdrücklich genannte Handlung einzuführen.
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  choice: gebt eure Töchter Männern zur Frau
  rationale: „Männern“ entspricht אֲנָשִׁים; „zur Frau“ verdeutlicht den durch den Zusammenhang bestimmten Eheschließungssinn.
- source_word: וְתֵלַדְנָה
  choice: damit sie … gebären
  rationale: Nach den Aufforderungen lässt sich die Verbform natürlich als beabsichtigte Folge wiedergeben. Das feminine Subjekt bezieht sich auf die Töchter.
- source_word: וּרְבוּ
  choice: Vermehrt euch
  rationale: רבה bezeichnet hier das zahlenmäßige Anwachsen der Gemeinschaft. Die reflexive deutsche Wendung ist natürlich und bewahrt den biblischen Motivklang.
- source_word: שָׁם
  choice: dort
  rationale: Das Adverb verweist auf den zuvor genannten Ort des Exils.
- source_word: וְאַל תִּמְעָטוּ
  choice: und werdet nicht weniger
  rationale: מעט steht im Gegensatz zum Vermehren und bezeichnet das zahlenmäßige Abnehmen; die Wiedergabe erhält diesen direkten Kontrast.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Satzfolge. Die wiederholte Nennung von Söhnen und Töchtern sowie der Gegensatz zwischen Vermehrung und zahlenmäßigem Rückgang bleiben erhalten.
