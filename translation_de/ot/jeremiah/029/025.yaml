  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
translation:
  language: de
  text: 'So spricht Yahweh der Heerscharen, der Gott Israels: Weil du in deinem eigenen Namen[a] Briefe an das ganze Volk in Jerusalem, an den Priester Zefanja, den Sohn Maasejas, und an alle Priester gesandt hast, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter deinem Namen«.'
    reason: Die Präposition בְּ kann hier sowohl die Berufung auf den eigenen Namen als auch das Auftreten unter diesem Namen bezeichnen.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die geläufige prophetische Botenformel in würdigem, verständlichem Deutsch.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh der Heerscharen
  rationale: Gibt den Gottesnamen als Eigennamen wieder und lässt die umfassende Bedeutung von צְבָאוֹת offen, ohne sie auf irdische Armeen zu beschränken.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet wie im Hebräischen den Grund für die folgende Ankündigung ein; der Satz wird in den nächsten Versen fortgeführt.
- source_word: בְשִׁמְךָ
  choice: in deinem eigenen Namen
  rationale: Macht die im Kontext wichtige Eigenautorität Schemajas sichtbar, ohne einen fremden theologischen Begriff einzuführen.
- source_word: סְפָרִים
  choice: Briefe
  rationale: Im Zusammenhang mit versandter Korrespondenz ist dies die präziseste natürliche Bedeutung.
- source_word: כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: das ganze Volk in Jerusalem
  rationale: Gibt den Bezug vollständig und idiomatisch wieder.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: den Priester Zefanja, den Sohn Maasejas
  rationale: Identifiziert im Einklang mit dem Kontext Zefanja als Priester und gibt Abstammung und Amt in natürlicher deutscher Reihenfolge wieder.
- source_word: כָּל הַכֹּהֲנִים
  choice: alle Priester
  rationale: Unmittelbare Wiedergabe von Quantor, Artikel und Plural.
- source_word: לֵאמֹר
  choice: 'mit den Worten:'
  rationale: Leitet idiomatisch den im nächsten Vers folgenden Wortlaut der Briefe ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Eigenmächtige Autorisierung durch בְשִׁמְךָ
  choice: in deinem eigenen Namen
  alternative: in deinem Namen; unter deinem Namen
  rationale: Die Formulierung bringt den Kontrast zwischen Schemajas eigener Autorität und göttlichem Auftrag zum Ausdruck, ohne ihn über den Kontext hinaus dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt prägnant; die durch »Weil« eröffnete, über den Vers hinausreichende Satzstruktur und der Doppelpunkt am Ende werden bewusst bewahrt.
