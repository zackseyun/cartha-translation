source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׁלַ֛ח יִרְמְיָ֥ה הַ/נָּבִ֖יא מִ/ירוּשָׁלִָ֑ם אֶל יֶ֜תֶר זִקְנֵ֣י הַ/גּוֹלָ֗ה וְ/אֶל הַ/כֹּהֲנִ֤ים וְ/אֶל הַ/נְּבִיאִים֙ וְ/אֶל כָּל הָ/עָ֔ם אֲשֶׁ֨ר הֶגְלָ֧ה נְבֽוּכַדְנֶאצַּ֛ר מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: These are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
translation:
  language: de
  text: Dies sind die Worte des Briefes[a], den der Prophet Jeremia aus Jerusalem an die übrig gebliebenen Ältesten unter den Weggeführten[b], an die Priester, an die Propheten und an das ganze Volk sandte, das Nebukadnezar von Jerusalem nach Babel verschleppt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Schriftrolle“ beziehungsweise „des Schriftstücks“. Das hebräische Wort סֵפֶר kann verschiedene Arten schriftlicher Dokumente bezeichnen; hier legt der Versand an bestimmte Empfänger die Bedeutung „Brief“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „an den Rest der Ältesten der Exilsgemeinschaft“. Der hebräische Ausdruck kann die noch verbliebenen Ältesten unter den Verschleppten bezeichnen; „Exil“ beziehungsweise „Wegführung“ kann dabei auch für die deportierte Gemeinschaft stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dies sind
  rationale: Die Formulierung eröffnet den Abschnitt und knüpft zugleich an den Zusammenhang an. Im Deutschen ist „Dies sind“ natürlich; ein zusätzliches zeitliches „Nun“ steht nicht ausdrücklich im Hebräischen.
- source_word: דִּבְרֵי הַסֵּפֶר
  choice: die Worte des Briefes
  rationale: סֵפֶר bezeichnet allgemein ein Schriftstück, eine Schriftrolle oder ein Buch. Da Jeremia es an bestimmte Empfänger sendet, passt „Brief“ hier am besten; „die Worte“ bewahrt die hebräische Genitivverbindung.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: der Prophet Jeremia
  rationale: Diese im Deutschen natürliche Wortstellung gibt Titel und Namen vollständig wieder.
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  choice: die übrig gebliebenen Ältesten unter den Weggeführten
  rationale: יֶתֶר bezeichnet den verbliebenen Rest; הַגּוֹלָה kann den Zustand des Exils oder die deportierte Gemeinschaft bezeichnen. Die gewählte Formulierung macht verständlich, dass Älteste innerhalb der verschleppten Gemeinschaft gemeint sind, ohne den Grund ihres Verbleibens festzulegen.
- source_word: הַכֹּהֲנִים ... הַנְּבִיאִים ... כָּל הָעָם
  choice: die Priester, ... die Propheten und ... das ganze Volk
  rationale: Die drei ausdrücklich genannten Empfängergruppen werden in ihrer Reihenfolge und mit der wiederholten Anrede „an“ wiedergegeben.
- source_word: אֲשֶׁר הֶגְלָה
  choice: das ... verschleppt hatte
  rationale: Der Hifil von גלה bezeichnet das erzwungene Fortführen ins Exil. „Verschleppt“ gibt diese Zwangsdeportation prägnant wieder; das Plusquamperfekt markiert, dass sie vor dem Versand des Briefes lag.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die geläufige deutsche Namensform und entspricht der hier bezeugten hebräischen Schreibung.
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Die Richtungsendung bezeichnet eine Bewegung auf Babel zu; „nach Babel“ ist die übliche deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Aufbau, ist aber flüssig lesbar. „Weggeführte“ bewahrt den biblischen Exilkontext, während „verschleppt“ die erzwungene Handlung klar ausdrückt.
