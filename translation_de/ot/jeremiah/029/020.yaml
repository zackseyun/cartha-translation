  text: וְ/אַתֶּ֖ם שִׁמְע֣וּ דְבַר יְהוָ֑ה כָּל הַ֨/גּוֹלָ֔ה אֲשֶׁר שִׁלַּ֥חְתִּי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/020.yaml
  text: But you, all the exiles whom I sent from Jerusalem to Babylon, hear the word of Yahweh.
translation:
  language: de
  text: Hört das Wort Jahwes, alle ihr Verbannten, die ich von Jerusalem nach Babylon gesandt habe!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Das selbstständige Pronomen mit der Konjunktion hebt die Angeredeten kontrastiv gegenüber dem vorher Gesagten hervor; im Deutschen gibt „Ihr aber“ diesen Übergang knapp und natürlich wieder.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Imperativ bedeutet hier „hören/anhören“. „Hört“ bewahrt die prophetische Wendung und lässt den mitschwingenden Aufruf zum Gehorsam unausgesprochen.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ wahrt die feste prophetische Formel und das Gewicht göttlicher Rede; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כָּל הַגּוֹלָה
  choice: ihr Verbannten alle
  rationale: Das singularische Kollektiv bezeichnet die gesamte Gemeinschaft der Weggeführten. Die Anrede „ihr Verbannten alle“ ist im Deutschen verständlich und erhält den umfassenden Bezug von כָּל.
- source_word: אֲשֶׁר שִׁלַּחְתִּי
  choice: die ich ... geschickt habe
  rationale: Das Verb bezeichnet schlicht das Senden. Das Perfekt klingt in der direkten Rede natürlich und macht deutlich, dass Jahwe selbst hinter der Verbannung steht, ohne eine stärkere Bedeutung wie „vertrieben“ einzutragen.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: von Jerusalem nach Babylon
  rationale: Die Ausgangsangabe mit מִן und die Richtungsendung an „Babylon“ werden idiomatisch mit „von … nach …“ ausgedrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn im Deutschen als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer Befehlsform. Die vorangestellte Kontrastformel „Ihr aber“ und die nachgestellte Gruppenanrede bilden einen klaren, mündlich gut verständlichen Satz.
