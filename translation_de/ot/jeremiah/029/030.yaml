  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/030.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Jeremia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form führt das nächste Geschehen in der Erzählfolge ein. „Da erging“ ist eine natürliche, würdige deutsche Wiedergabe der festen prophetischen Formel und vermeidet das altertümliche „Und es geschah“.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der Formel דְּבַר יְהוָה bewahrt „das Wort“ die erkennbare hebräische Ausdrucksweise; „Botschaft“ wäre möglich, aber interpretierender.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: an
  rationale: Beim deutschen Ausdruck „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die unmittelbar folgende Rede ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ wahrt den Charakter als Eigenname, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Sprachklang. Die feste Formel wird knapp wiedergegeben; der Doppelpunkt kündigt die in Vers 31 folgende direkte Rede an.
