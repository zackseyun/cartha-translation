base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/016.yaml
  text: For thus says Yahweh concerning the king who sits on the throne of David[a], and concerning all the people who dwell in this city—your brothers who did not go out with you into exile—
translation:
  language: de
  text: Denn so spricht Jahwe über den König, der auf Davids Thron sitzt, und über das ganze Volk, das in dieser Stadt wohnt – eure Brüder[a], die nicht mit euch in die Verbannung gegangen sind –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Verwandten“ beziehungsweise „eure Landsleute“. Wörtlich steht im Hebräischen „eure Brüder“; der Ausdruck kann hier umfassender die anderen Judäer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet eine Begründung beziehungsweise Erläuterung des vorher Gesagten ein und bewahrt den Zusammenhang mit dem vorangehenden Vers.
- source_word: כֹה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt das Hebräische knapp und würdevoll wieder; der Gottesname wird als Jahwe wiedergegeben.
- source_word: אֶל
  choice: über
  rationale: אֶל bezeichnet hier den Gegenstand der folgenden Aussage, nicht die unmittelbar angesprochene Person. Die Wiederholung wird bei König und Volk erhalten.
- source_word: הַיּוֹשֵׁב אֶל כִּסֵּא דָוִד
  choice: der auf Davids Thron sitzt
  rationale: Bewahrt das Bild des Sitzens auf dem davidischen Thron und bezeichnet damit den regierenden König aus Davids Dynastie.
- source_word: הַיּוֹשֵׁב בָּעִיר הַזֹּאת
  choice: das in dieser Stadt wohnt
  rationale: Das singularische Partizip stimmt mit dem kollektiven Singular הָעָם überein; die deutsche Formulierung bildet dies natürlich nach.
- source_word: אֲחֵיכֶם
  choice: eure Brüder
  rationale: Gibt den ausdrücklich maskulinen Plural des hebräischen Verwandtschaftsbegriffs formal wieder, ohne seinen im Kontext möglichen weiteren Bezug im Haupttext festzulegen.
- source_word: אֲשֶׁר לֹא יָצְאוּ אִתְּכֶם בַּגּוֹלָה
  choice: die nicht mit euch in die Verbannung gegangen sind
  rationale: Bewahrt die aktive Aussage von יָצָא und gibt בַּגּוֹלָה idiomatisch als Ziel beziehungsweise Zustand der Deportation wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ gibt ihn wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von אֲחֵיכֶם
  choice: eure Brüder
  alternative: eure Verwandten / eure Landsleute
  rationale: Der Haupttext bewahrt die maskuline Form des Ausgangstextes. Eine Fußnote weist darauf hin, dass das Wort im Zusammenhang weiter gefasst sein und die in Juda verbliebenen Volksgenossen bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Prophetenformel „so spricht Jahwe“ bleibt erhalten. Die Gedankenstriche zeigen, dass der Satz in den folgenden Versen weitergeführt wird.
