source:
  edition: WLC
  text: אַחֲרֵ֣י צֵ֣את יְכָנְיָֽה הַ֠/מֶּלֶךְ וְ/הַ/גְּבִירָ֨ה וְ/הַ/סָּרִיסִ֜ים שָׂרֵ֨י יְהוּדָ֧ה וִ/ירוּשָׁלִַ֛ם וְ/הֶ/חָרָ֥שׁ וְ/הַ/מַּסְגֵּ֖ר מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/002.yaml
  text: after King Jeconiah[a], the queen mother, the court officials, the officials of Judah and Jerusalem[c][b], and the craftsmen and the metalworkers had gone out from Jerusalem—
translation:
  language: de
  text: nachdem König Jechonja, die Königsmutter, die Hofbeamten[a], die führenden Männer von Juda und Jerusalem[b], die Handwerker und die Metallarbeiter[c] Jerusalem verlassen hatten —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Eunuchen“. Das hebräische Wort kann sowohl Eunuchen im engeren Sinn als auch königliche Hofbeamte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Obersten von Juda und Jerusalem“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Schmiede“. Die genaue Berufsbezeichnung ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  choice: nachdem … verlassen hatten
  rationale: Die Präposition mit dem Infinitiv bezeichnet ein Geschehen, das dem im Zusammenhang genannten Brief vorausging. Ein temporaler Nebensatz im Plusquamperfekt ist im Deutschen natürlich; „Jerusalem verlassen“ gibt יצא mit dem Ausgangsort idiomatisch wieder, ohne die grammatisch aktive Form ausdrücklich in ein Passiv umzudeuten.
- source_word: יְכָנְיָה הַמֶּלֶךְ
  choice: König Jechonja
  rationale: „Jechonja“ bildet die hier vorliegende hebräische Namensform ab; der Titel steht im natürlichen deutschen Sprachgebrauch vor dem Namen.
- source_word: הַגְּבִירָה
  choice: die Königsmutter
  rationale: Im königlichen Umfeld bezeichnet das Wort regelmäßig die hochgestellte Mutter des Königs und nicht bloß allgemein eine Herrin.
- source_word: הַסָּרִיסִים
  choice: die Hofbeamten
  rationale: Der Ausdruck kann Eunuchen im engeren Sinn oder königliche Amtsträger allgemeiner bezeichnen. „Hofbeamte“ passt zum Verwaltungskontext, während die engere Möglichkeit in einer Fußnote erhalten bleibt.
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  choice: die führenden Männer von Juda und Jerusalem
  rationale: שׂרים bezeichnet Personen in politischer oder gesellschaftlicher Führungsstellung. Diese Wiedergabe ist verständlich und vermeidet die im modernen Deutschen leicht dynastisch missverständliche Bezeichnung „Fürsten“.
- source_word: הֶחָרָשׁ
  choice: die Handwerker
  rationale: חרש kann allgemein einen Fachhandwerker bezeichnen. Die breite Wiedergabe wahrt die Unterscheidung vom folgenden, wahrscheinlich auf Metallarbeit bezogenen Ausdruck.
- source_word: הַמַּסְגֵּר
  choice: die Metallarbeiter
  rationale: Die genaue Berufsbezeichnung ist unsicher; wahrscheinlich sind Schmiede oder andere Metallhandwerker gemeint. „Metallarbeiter“ ist eine klare, nicht unnötig enge Wiedergabe.
- source_word: מִירוּשָׁלָם
  choice: Jerusalem verlassen
  rationale: Die Präposition markiert Jerusalem als Ausgangsort. Im Deutschen drückt das transitive Verb „verlassen“ denselben räumlichen Bezug natürlich ohne „aus“ aus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt entsprechend dem hebräischen Satzbau und dem Zusammenhang als zeitlicher Nebensatz offen; der Gedankenstrich zeigt die Fortsetzung aus Vers 1 an. Die Aufzählung ist klar gegliedert, ohne die historisch unsicheren Amts- und Berufsbezeichnungen stärker festzulegen als der Ausgangstext.
