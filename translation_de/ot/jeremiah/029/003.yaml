  text: בְּ/יַד֙ אֶלְעָשָׂ֣ה בֶן שָׁפָ֔ן וּ/גְמַרְיָ֖ה בֶּן חִלְקִיָּ֑ה אֲשֶׁ֨ר שָׁלַ֜ח צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה אֶל נְבוּכַדְנֶאצַּ֛ר מֶ֥לֶךְ בָּבֶ֖ל בָּבֶ֥לָ/ה לֵ/אמֹֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/003.yaml
  text: 'by the hand of Elasah son of Shaphan and Gemariah son of Hilkiah[a], whom Zedekiah king of Judah sent to Nebuchadnezzar king of Babylon in Babylon[b], saying:'
translation:
  language: de
  text: 'durch Elasa, den Sohn Schafans, und Gemarja, den Sohn Hilkijas[a], die Zedekia, der König von Juda, zu Nebukadnezar, dem König von Babel, nach Babel sandte, mit folgendem Wortlaut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »durch die Hand Elasas … und Gemarjas«; gemeint ist die Übermittlung durch diese beiden Boten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: durch
  rationale: Die hebräische Wendung »durch die Hand von« bezeichnet hier die Vermittlung durch Boten. Das schlichte »durch« gibt diese Funktion im modernen Deutschen natürlich wieder.
- source_word: אֶלְעָשָׂה בֶן־שָׁפָן
  choice: Elasa, den Sohn Schafans
  rationale: Die Namen folgen gängigen deutschen Bibelschreibungen; בֶן wird als genealogische Bezeichnung mit »Sohn« wiedergegeben.
- source_word: וּגְמַרְיָה בֶּן־חִלְקִיָּה
  choice: und Gemarja, den Sohn Hilkijas
  rationale: Konjunktion, Personenname und Abstammungsangabe werden unmittelbar und in idiomatischer deutscher Apposition wiedergegeben.
- source_word: אֲשֶׁר שָׁלַח
  choice: hatte sie … gesandt
  rationale: Das Relativpronomen bezieht sich auf beide genannten Männer. Das Plusquamperfekt macht im Deutschen klar, dass ihre Sendung den Rahmen für die Übermittlung des Briefes bildet.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Zedekia, der König von Juda
  rationale: Die hebräische Apposition wird mit der üblichen deutschen Namensform und einem bestimmten Artikel natürlich wiedergegeben.
- source_word: אֶל נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: zu Nebukadnezar, dem König von Babel
  rationale: אֶל bezeichnet das Ziel in Bezug auf die Person; die nachfolgende Amtsbezeichnung wird als Apposition wiedergegeben.
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Die Richtungsendung ה zeigt Bewegung auf Babel zu an. »Nach Babel« bewahrt diese Zielrichtung, ohne sie als bloße Ortsangabe aufzulösen.
- source_word: לֵאמֹר
  choice: 'Es hieß:'
  rationale: Die häufige Einleitungsformel eröffnet hier den Wortlaut des Briefes. »Es hieß:« ist im Deutschen natürlich und vermeidet ein unidiomatisches partizipiales »sagend«.
