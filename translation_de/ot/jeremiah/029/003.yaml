translation_notes:
  register: Moderner, würdiger Erzählstil. Da der Vers syntaktisch an den vorhergehenden Vers anschließt, beginnt er bewusst mit kleinem Anfangsbuchstaben. Die lange hebräische Satzkonstruktion wird zur besseren Verständlichkeit in zwei Sätze gegliedert; die Zielrichtung von בָּבֶלָה bleibt mit »nach Babel« ausdrücklich erhalten.
