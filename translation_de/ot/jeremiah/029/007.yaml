  variant: modern standard German
source:
  edition: WLC
  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
translation:
  language: de
  text: Bemüht euch um das Wohlergehen[a] der Stadt, in die ich euch in die Verbannung geführt habe, und betet für sie zu Jahwe; denn von ihrem Wohlergehen hängt auch euer Wohlergehen ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch „Frieden“ oder „Wohl“. Das hebräische Wort schalom steht in diesem Vers dreimal: für die Stadt und für die Verbannten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ
  choice: Bemüht euch um
  rationale: Das Verb bezeichnet hier ein tätiges Suchen und Streben. „Bemüht euch um“ gibt den Aufforderungscharakter natürlich wieder, ohne eine bestimmte Form des Handelns festzulegen.
- source_word: שְׁלוֹם / בִשְׁלוֹמָהּ ... שָׁלוֹם
  choice: Wohlergehen / von ihrem Wohlergehen hängt auch euer Wohlergehen ab
  rationale: שׁלום umfasst hier Frieden, Sicherheit und umfassendes Wohlergehen. Die dreimalige Wiedergabe mit „Wohlergehen“ bewahrt die bewusste Wiederholung und den Zusammenhang zwischen dem Ergehen der Stadt und dem der Verbannten.
- source_word: הָעִיר
  choice: der Stadt
  rationale: Der bestimmte Ausdruck meint die konkrete Stadt des Exils; „Stadt“ ist die sachgerechte und natürliche Wiedergabe.
- source_word: הִגְלֵיתִי אֶתְכֶם שָׁמָּה
  choice: in die ich euch in die Verbannung geführt habe
  rationale: Der Hifil von גלה bezeichnet das Veranlassen des Exils und lässt Gottes Handeln ausdrücklich stehen. Das örtliche שָׁמָּה wird idiomatisch in den Relativsatz einbezogen.
- source_word: הִתְפַּלְלוּ בַעֲדָהּ
  choice: betet für sie
  rationale: Die Form fordert zum Beten auf; בַעֲדָהּ bezeichnet die Stadt als diejenige, zu deren Gunsten gebetet werden soll. „Für sie“ ist klar und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der vorausgehenden Aufforderungen ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ bewahrt den persönlichen Gottesnamen des hebräischen Textes; die traditionelle Ersetzung durch den Titel „der HERR“ wird nicht in den Haupttext übernommen.
- issue: Verhältnis zwischen dem Wohlergehen der Stadt und dem der Verbannten
  choice: von ihrem Wohlergehen hängt auch euer Wohlergehen ab
  alternative: in ihrem Wohlergehen werdet ihr Wohlergehen haben
  rationale: Die gewählte Formulierung gibt die im Hebräischen ausgesagte Verbindung natürlich wieder, ohne sie auf wirtschaftlichen Wohlstand, politische Anpassung oder eine bestimmte theologische Lehre zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „Wohlergehen“ macht die Wortverbindung des hebräischen Textes sichtbar; „Bemüht euch um“ vermittelt zugleich, dass דִרְשׁוּ aktives Streben und nicht bloßes Suchen bezeichnet.
