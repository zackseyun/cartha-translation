  text: וְ/לֻקַּ֤ח מֵ/הֶם֙ קְלָלָ֔ה לְ/כֹל֙ גָּל֣וּת יְהוּדָ֔ה אֲשֶׁ֥ר בְּ/בָבֶ֖ל לֵ/אמֹ֑ר יְשִֽׂמְ/ךָ֤ יְהוָה֙ כְּ/צִדְקִיָּ֣הוּ וּ/כְ/אֶחָ֔ב אֲשֶׁר קָלָ֥/ם מֶֽלֶךְ בָּבֶ֖ל בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
translation:
  language: de
  text: 'Alle Verbannten aus Juda, die in Babylon sind, werden von ihnen eine Fluchformel übernehmen und sagen: »Jahwe mache dich wie Zedekia und wie Ahab, die der König von Babylon im Feuer röstete[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Feuer verbrannte«. Das hebräische Verb kann allgemeiner „verbrennen“ bedeuten; „röstete“ bewahrt seine drastische Bildkraft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֻקַּח מֵהֶם קְלָלָה
  choice: werden von ihnen ein Fluchwort übernehmen
  rationale: 'Die aktive deutsche Form gibt die hebräische Passivkonstruktion idiomatisch wieder: Das Schicksal der beiden Männer wird zur Grundlage einer übernommenen Fluchformel. „Fluchwort“ verdeutlicht den formelhaften Gebrauch, der durch das folgende Zitat erkennbar ist.'
- source_word: לְכֹל גָּלוּת יְהוּדָה אֲשֶׁר בְּבָבֶל
  choice: Alle aus Juda Verbannten, die in Babylon sind
  rationale: גָּלוּת bezeichnet hier konkret die Gemeinschaft der Verbannten. Die Wiedergabe vermeidet das im heutigen Deutsch abstrakt oder veraltet klingende „Gefangenschaft Judas“.
- source_word: לֵאמֹר
  choice: und sagen
  rationale: Leitet die direkte Rede in natürlichem modernem Deutsch ein.
- source_word: יְשִׂמְךָ יְהוָה
  choice: Jahwe mache dich
  rationale: Die Verbform drückt in der Fluchformel einen Wunsch beziehungsweise eine Verwünschung aus. Der Konjunktiv „mache“ bildet diese Funktion knapp ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כְּצִדְקִיָּהוּ וּכְאֶחָב
  choice: wie Zedekia und wie Ahab
  rationale: Das wiederholte כְּ wird durch das wiederholte „wie“ abgebildet; die Namensformen entsprechen dem geläufigen deutschen Bibelgebrauch.
- source_word: קָלָם
  choice: röstete
  rationale: Das Piel von קלה kann „rösten“ oder allgemeiner „verbrennen“ bedeuten. „Röstete“ bewahrt die ungewöhnlich drastische Bildkraft des hebräischen Verbs.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Präposition בְּ bezeichnet hier passend den Bereich beziehungsweise das Mittel der Hinrichtung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt seinen Charakter als Eigenname, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Kraft der Verwünschungsformel יְשִׂמְךָ יְהוָה
  choice: Jahwe mache dich
  alternative: Jahwe wird dich machen
  rationale: Der Kontext verlangt keine Zukunftsaussage, sondern eine gegen jemanden ausgesprochene Verwünschung. Der deutsche Konjunktiv wahrt diese Funktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliche Verständlichkeit ins Aktiv umgeformt, während Herkunft und formelhafter Gebrauch des Fluchworts erhalten bleiben. Die drastische Ausdrucksweise des hebräischen Textes wurde nicht abgeschwächt.
