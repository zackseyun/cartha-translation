  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֨י פֹקֵ֜ד עַל שְׁמַעְיָ֣ה הַ/נֶּחֱלָמִי֮ וְ/עַל זַרְע/וֹ֒ לֹא יִהְיֶ֨ה ל֜/וֹ אִ֣ישׁ יוֹשֵׁ֣ב בְּ/תוֹךְ הָ/עָ֣ם הַ/זֶּ֗ה וְ/לֹֽא יִרְאֶ֥ה בַ/טּ֛וֹב אֲשֶׁר אֲנִ֥י עֹשֶֽׂה לְ/עַמִּ֖/י נְאֻם יְהוָ֑ה כִּֽי סָרָ֥ה דִבֶּ֖ר עַל יְהוָֽה־־־־׀׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
translation:
  language: de
  text: 'Darum spricht Yahweh: Siehe, ich werde Schemaja, den Nehelamiter,[a] und seine Nachkommen bestrafen. Er wird keinen Mann haben, der inmitten dieses Volkes wohnt, und er wird das Gute nicht sehen, das ich meinem Volk erweise, spricht Yahweh; denn er hat Auflehnung gegen Yahweh verkündet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Schemaja, den Träumer“. Der Beiname הַנֶּחֱלָמִי könnte mit dem Träumen zusammenhängen; seine genaue Bedeutung ist jedoch unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn er hat Abfall gegen Yahweh verkündet“ beziehungsweise „denn er hat Revolte gegen Yahweh verkündet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Gerichtswort knapp und idiomatisch wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Yahweh
  rationale: Bewahrt die traditionelle prophetische Botenformel und gibt den Gottesnamen als Yahweh wieder.
- source_word: הִנְנִי פֹקֵד עַל
  choice: Siehe, ich werde … zur Rechenschaft ziehen
  rationale: „Siehe“ erhält die hinweisende Kraft von הִנְנִי; „zur Rechenschaft ziehen“ vermittelt im Gerichtskontext den Sinn von פקד על, ohne die Wendung unnötig zu verengen.
- source_word: שְׁמַעְיָה
  choice: Schemaja
  rationale: Im Deutschen geläufige, dem Hebräischen entsprechende Namensform.
- source_word: הַנֶּחֱלָמִי
  choice: den Nehelamiter
  rationale: Die genaue Ableitung des Beinamens ist unsicher; daher bleibt er im Haupttext als Eigenbezeichnung transliteriert, während die mögliche Bedeutung in einer Fußnote erscheint.
- source_word: וְעַל זַרְעוֹ
  choice: und seine Nachkommen
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft; „Nachkommen“ ist im modernen Deutschen natürlich und präzise.
- source_word: לֹא יִהְיֶה לוֹ אִישׁ יוֹשֵׁב
  choice: Von ihm wird kein Mann … wohnen
  rationale: Bewahrt sowohl die Zugehörigkeitskonstruktion „für/von ihm“ als auch den ausdrücklich maskulinen Singular אִישׁ und das Motiv eines fehlenden überlebenden Vertreters.
- source_word: בְּתוֹךְ הָעָם הַזֶּה
  choice: inmitten dieses Volkes
  rationale: Nahe, verständliche Wiedergabe der räumlich-sozialen Zugehörigkeit.
- source_word: וְלֹא יִרְאֶה בַטּוֹב
  choice: und er wird das Gute nicht sehen
  rationale: Erhält das hebräische Bild, das sowohl das Erleben als auch das Miterleben des Guten umfassen kann.
- source_word: אֲשֶׁר אֲנִי עֹשֶׂה לְעַמִּי
  choice: das ich meinem Volk erweise
  rationale: Gibt die gegenwärtig bzw. unmittelbar bevorstehend dargestellte Wohltat idiomatisch wieder, ohne die Zeitstufe starr festzulegen.
- source_word: נְאֻם יְהוָה
  choice: spricht Yahweh
  rationale: Geläufige, würdige Wiedergabe der prophetischen Schlussformel.
- source_word: כִּי סָרָה דִבֶּר עַל יְהוָה
  choice: denn er hat Auflehnung gegen Yahweh gepredigt
  rationale: סָרָה bezeichnet Auflehnung, Abfall oder Revolte. „Gepredigt“ macht deutlich, dass hier öffentlich vermittelte Rede gemeint ist, ohne den Inhalt konfessionell auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben, um den im Hebräischen ausdrücklich stehenden Bundesnamen sichtbar zu erhalten.
- issue: Bedeutungsumfang von סָרָה
  choice: Auflehnung
  alternative: Abfall oder Revolte
  rationale: „Auflehnung“ wahrt die politische und bundestheologische Spannung des Ausdrucks, ohne ihn ausschließlich als formellen Glaubensabfall oder politischen Umsturz festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Formelsprache. Die hebräischen Bilder „Siehe“ und „das Gute sehen“ bleiben erhalten; schwer verständliche Hebraismen werden moderat idiomatisiert. Alle Fußnotenmarker stehen im Haupttext.
