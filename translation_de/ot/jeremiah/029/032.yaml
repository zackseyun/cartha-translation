    issue: Unidiomatische und potenziell missverständliche Wiedergabe von לֹא יִהְיֶה לוֹ אִישׁ יוֹשֵׁב
    rationale: „Von ihm wird kein Mann inmitten dieses Volkes wohnen“ ist im Deutschen syntaktisch schwerfällig und kann räumlich statt zugehörigkeitsbezogen verstanden werden. „Er wird keinen Mann haben, der inmitten dieses Volkes wohnt“ gibt die hebräische „für ihn wird kein Mann ... sein“-Konstruktion klar und eng wieder.
  - severity: low
    issue: „Gepredigt“ für דִּבֵּר ist unnötig spezifizierend
    rationale: Das hebräische Verb bezeichnet allgemein Sprechen; der Kontext erlaubt öffentliche Verkündigung, erzwingt aber nicht die spezifische Handlungsbezeichnung „predigen“. „Auflehnung ... verkündet“ bleibt idiomatisch und weniger interpretierend.
  - severity: low
    issue: Gerichtssinn von פֹּקֵד עַל sollte expliziter sein
    rationale: „Zur Rechenschaft ziehen“ kann auch bloßes Befragen oder Verwalten nahelegen. „Bestrafen“ macht im vorliegenden Gerichtskontext die Funktion der Wendung unmittelbar deutlich.
