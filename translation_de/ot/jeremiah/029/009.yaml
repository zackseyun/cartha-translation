  terminology: „Jahwe“ ist eine konsistente Wiedergabe von יְהוָה. „spricht Jahwe“ ist als knappe prophetische Formel angemessen. Die Fußnote zu JHWH nennt sachgerecht die traditionelle Wiedergabe „der HERR“.
