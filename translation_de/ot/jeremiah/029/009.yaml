source:
  edition: WLC
  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
translation:
  language: de
  text: Denn sie weissagen euch falsch in meinem Namen[a]. Ich habe sie nicht gesandt, spricht Jahwe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Falschheit“ oder „in einer Lüge“.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Warnung ein und bewahrt den kausalen Zusammenhang.
- source_word: בְשֶׁקֶר
  choice: Lügen
  rationale: Die Wendung bedeutet wörtlich „in Falschheit“ oder „in einer Lüge“. Die substantivische Wiedergabe ist im Deutschen natürlich und kennzeichnet den Inhalt beziehungsweise Charakter ihres Weissagens als falsch.
- source_word: נִבְּאִים
  choice: sie weissagen
  rationale: Das Partizip bezeichnet eine andauernde oder kennzeichnende Tätigkeit. Das deutsche Präsens gibt dies im Kontext natürlich wieder.
- source_word: לָכֶם
  choice: euch
  rationale: Der Ausdruck bezeichnet die Empfänger der prophetischen Rede.
- source_word: בִשְׁמִי
  choice: in meinem Namen
  rationale: Bewahrt die biblische Wendung für ein Reden unter beanspruchter göttlicher Autorität.
- source_word: לֹא שְׁלַחְתִּים
  choice: Ich habe sie nicht gesandt
  rationale: Das Perfekt mit Verneinung bestreitet ausdrücklich ihre göttliche Beauftragung; das deutsche Perfekt klingt gegenwärtig und natürlich.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die feierliche prophetische Botenformel knapp und idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Göttliche Beauftragung der Propheten
  choice: Die Propheten weissagen Lügen unter Berufung auf Gottes Namen, doch Jahwe bestreitet ausdrücklich, sie gesandt zu haben.
  alternative: Die Propheten weissagen lediglich irrtümlich, ohne bewusst göttliche Autorität zu beanspruchen.
  rationale: Der hebräische Text stellt „in meinem Namen“ unmittelbar der Aussage „Ich habe sie nicht gesandt“ gegenüber. Die Übersetzung bewahrt diesen Gegensatz, ohne über ihre innere Absicht zu urteilen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen; die traditionelle Titelwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Weissagen“ erhält den spezifisch prophetischen Sinn; „spricht Jahwe“ bewahrt die knappe Botenformel. Die Satzstellung hält die falsche Botschaft und den beanspruchten Gottesnamen eng zusammen.
