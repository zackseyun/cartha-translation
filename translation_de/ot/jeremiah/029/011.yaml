id: JER.29.11
reference: Jeremiah 29:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
translation:
  language: de
  text: Denn ich kenne die Pläne, die ich für euch habe – Ausspruch Jahwes –, Pläne zum Frieden[a] und nicht zum Unheil[b], um euch Zukunft und Hoffnung zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische schalom umfasst neben Frieden auch Wohlergehen, Ganzheit und Gedeihen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »nicht zum Schaden«; das hebräische Wort kann auch Unheil, Unglück oder Böses bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Zusage ein und bewahrt den Zusammenhang natürlich im Deutschen.
- source_word: יָדַעְתִּי
  choice: ich kenne
  rationale: Das Perfekt des Zustandsverbs bezeichnet hier Jahwes feststehendes Wissen; das deutsche Präsens gibt dies idiomatisch wieder.
- source_word: הַמַּחֲשָׁבוֹת ... חֹשֵׁב עֲלֵיכֶם
  choice: die Pläne, die ich für euch habe
  rationale: מַחֲשָׁבוֹת kann Gedanken, Absichten oder Pläne bezeichnen. Im Kontext göttlichen, zielgerichteten Handelns ist »Pläne« passend; die idiomatische Formulierung vermeidet das schwerfällige »die ich über euch plane«, ohne die Ausrichtung auf die Angesprochenen zu verlieren.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den charakteristischen prophetischen Botenstil und gibt den Gottesnamen als Eigennamen wieder.
- source_word: מַחְשְׁבוֹת שָׁלוֹם
  choice: Pläne zum Frieden
  rationale: »Frieden« ist die direkte Wiedergabe von שָׁלוֹם; die Fußnote hält dessen umfassenderes Bedeutungsfeld offen.
- source_word: וְלֹא לְרָעָה
  choice: und nicht zum Unheil
  rationale: רָעָה bezeichnet im Gegensatz zu שָׁלוֹם hier eher schädliches Ergehen oder Unheil als moralische Bosheit.
- source_word: לָתֵת לָכֶם אַחֲרִית וְתִקְוָה
  choice: um euch Zukunft und Hoffnung zu geben
  rationale: Der Infinitiv drückt Ziel oder Zweck aus. אַחֲרִית kann Ende, Ausgang oder Zukunft bedeuten; im verheißenden Kontext ist »Zukunft« natürlich, während die Fußnote die lexikalische Spannweite wahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: Frieden
  alternative: Wohlergehen
  rationale: Die Hauptübersetzung bleibt lexikalisch nah; eine Fußnote zeigt, dass der Begriff auch Ganzheit und Wohlergehen umfasst.
- issue: Adressaten und Reichweite der Zusage
  choice: euch (Plural)
  alternative: dir (Singular, individualisierend)
  rationale: Die hebräischen Formen sind pluralisch und richten sich im Kontext an die Exilierten als Gemeinschaft. Die Übersetzung individualisiert die Zusage daher nicht.
- issue: Bedeutung von רָעָה
  choice: Unheil
  alternative: Böses
  rationale: Der Gegensatz zu שָׁלוֹם und der historische Kontext sprechen für erlittenes Unheil, ohne die grundsätzliche lexikalische Möglichkeit von »Bösem« zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural »euch« bleibt sichtbar. Gedankenstriche markieren die eingeschobene prophetische Formel; die Wortwahl vermeidet sowohl altertümliche Schwere als auch eine individualisierende Umdeutung.
