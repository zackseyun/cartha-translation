source:
  edition: WLC
  text: כִּ֣י עַל כֵּ֞ן שָׁלַ֥ח אֵלֵ֛י/נוּ בָּבֶ֥ל לֵ/אמֹ֖ר אֲרֻכָּ֣ה הִ֑יא בְּנ֤וּ בָתִּים֙ וְ/שֵׁ֔בוּ וְ/נִטְע֣וּ גַנּ֔וֹת וְ/אִכְל֖וּ אֶת פְּרִי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/028.yaml
  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
translation:
  language: de
  text: 'Aus diesem Grund hat er uns in Babylon eine Botschaft geschickt und gesagt: »Es wird lange dauern.[a] Baut Häuser und wohnt darin,[b] pflanzt Gärten und esst ihre Früchte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie ist lang.“ Das Hebräische ist verkürzt; gemeint ist vermutlich, dass der Aufenthalt oder das Exil in Babylon lange dauern wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „und wohnt“ beziehungsweise „und bleibt“. „Darin“ ist durch die zuvor genannten Häuser sinngemäß vorausgesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַל כֵּן
  choice: Aus diesem Grund
  rationale: Die Wendung führt die Begründung für die vorausgehende Beschwerde ein. „Aus diesem Grund“ gibt den kausalen Zusammenhang in natürlichem Deutsch wieder.
- source_word: שָׁלַח אֵלֵינוּ בָּבֶל
  choice: hat er uns in Babylon eine Botschaft geschickt
  rationale: Wörtlich steht etwa „hat er zu uns Babylon gesandt“. Gemeint ist idiomatisch, dass den in Babylon befindlichen Adressaten eine Mitteilung geschickt wurde; „eine Botschaft“ macht das im Deutschen notwendige, im Kontext vorausgesetzte Objekt kenntlich.
- source_word: לֵאמֹר
  choice: und gesagt
  rationale: Der Infinitiv führt die wörtliche Rede ein. In Verbindung mit „eine Botschaft geschickt“ ist „und gesagt“ natürlich und wahrt die Funktion des hebräischen Ausdrucks.
- source_word: אֲרֻכָּה הִיא
  choice: Es wird lange dauern
  rationale: Die feminine Form ist elliptisch und bezieht sich wahrscheinlich auf den Aufenthalt oder das Exil in Babylon. Die Übersetzung bewahrt die knappe Aussage, ohne das nicht ausdrücklich genannte Bezugswort in den Haupttext einzufügen.
- source_word: בְּנוּ בָתִּים
  choice: Baut Häuser
  rationale: Direkte und natürliche Wiedergabe des Imperativs mit seinem Objekt.
- source_word: וְשֵׁבוּ
  choice: und wohnt darin
  rationale: Das Verb kann „sitzen“, „bleiben“ oder „wohnen“ bedeuten. Nach „Baut Häuser“ ist „wohnt darin“ im Deutschen idiomatisch; „darin“ ist aus dem Zusammenhang erschlossen.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: pflanzt Gärten
  rationale: גַנּוֹת bezeichnet allgemein Gärten; „Obstgärten“ wäre hier unnötig enger.
- source_word: וְאִכְלוּ אֶת פְּרִיהֶן
  choice: und esst ihre Früchte
  rationale: Die Formulierung gibt den Imperativ und den Rückbezug auf die Gärten knapp und idiomatisch wieder.
