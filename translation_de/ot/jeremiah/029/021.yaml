source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
translation:
  language: de
  text: 'So spricht Yahweh der Heerscharen, der Gott Israels, über Ahab, den Sohn Kolajas, und Zedekia, den Sohn Maasejas, die euch in meinem Namen Lügen weissagen: Siehe, ich gebe sie in die Hand Nebukadrezars[a], des Königs von Babel, und er wird sie vor euren Augen niederschlagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier die Namensform „Nebukadrezar“; im Deutschen ist auch „Nebukadnezar“ gebräuchlich.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh der Heerscharen
  rationale: Gibt den Gottesnamen als Eigennamen wieder und bewahrt im Titel צְבָאוֹת die umfassende Herrschafts- und Kriegsmacht, ohne sie auf menschliche Armeen zu verengen.
- source_word: אֶל
  choice: über
  rationale: Leitet hier die Personen ein, denen die Gerichtsbotschaft gilt; sie werden nicht direkt angeredet.
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  choice: die euch in meinem Namen Lügen weissagen
  rationale: Das Partizip bezeichnet ihre fortdauernde Tätigkeit; der Plural „Lügen“ klingt im Deutschen idiomatisch und gibt den als falsch bezeichneten Inhalt ihrer Weissagung wieder.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Erhält die feierliche und nachdrückliche göttliche Ankündigungsformel.
- source_word: נֹתֵן אֹתָם בְּיַד
  choice: gebe sie in die Hand
  rationale: Bewahrt das verständliche hebräische Bild für die Auslieferung in die Gewalt eines anderen.
- source_word: וְהִכָּם
  choice: und er wird sie ... niederschlagen
  rationale: „Niederschlagen“ wahrt die Härte des Gerichtsworts, ohne die im Verb nicht ausdrücklich festgelegte Todesfolge durch „töten“ zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der persönliche Gottesname wird transparent wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutungsumfang von וְהִכָּם
  choice: er wird sie niederschlagen
  alternative: er wird sie töten
  rationale: Der Zusammenhang beschreibt schweres Gericht, doch das Verb selbst verlangt nicht, die Todesfolge ausdrücklich zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter prophetischer Formel und hebräischer Bildsprache. Die Namen folgen geläufigen deutschen Formen; die quellennahe Form „Nebukadrezar“ wird im Text verwendet und erläutert.
