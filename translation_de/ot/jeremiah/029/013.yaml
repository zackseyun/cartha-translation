  text: Ihr werdet mich suchen und finden[a], wenn ihr mich von ganzem Herzen sucht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn ihr werdet mich suchen und finden, wenn ihr mich von ganzem Herzen sucht.“ Das hebräische Bindewort כִּי kann hier in mehreren verwandten Bedeutungen verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Ihr werdet mich suchen
  rationale: Das Piel-Perfekt mit vorangestelltem ו setzt im Zusammenhang die zukunftsbezogene Zusage fort. „Suchen“ gibt die bewusste Hinwendung natürlich und quellennah wieder.
- source_word: וּמְצָאתֶם
  choice: und finden
  rationale: Das Qal-Perfekt mit ו führt die zukunftsbezogene Folge weiter. Das Objekt „mich“ gilt im Deutschen natürlich für beide Verben.
- source_word: כִּי
  choice: wenn
  rationale: כִּי kann hier begründend, zeitlich oder bedingend verstanden werden. „Wenn“ drückt den Umstand beziehungsweise die Bedingung idiomatisch aus; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
- source_word: תִדְרְשֻׁנִי
  choice: ihr von ganzem Herzen nach mir fragt
  rationale: דרשׁ bezeichnet hier das ernsthafte Suchen beziehungsweise Fragen nach Gott. „Nach mir fragen“ unterscheidet es hörbar vom vorherigen בקשׁ, ohne den Sinn unnötig auszudeuten.
- source_word: בְּכָל לְבַבְכֶם
  choice: von ganzem Herzen
  rationale: Die feste deutsche Wendung gibt die Totalität des inneren Menschen natürlich, würdig und verständlich wieder.
theological_decisions:
- issue: Verhältnis zwischen dem Suchen und dem Finden Gottes
  choice: Der Vers verheißt wirklich, dass auf die vorbehaltlose Suche das Finden folgt, ohne den größeren theologischen Zusammenhang von Gnade und menschlichem Vermögen festzulegen.
  alternative: Der Vers kann entweder stärker als Betonung menschlicher Verantwortung oder im Rahmen göttlicher Befähigung gelesen werden.
  rationale: Die Übersetzung bleibt bei Zusage und Bedingung des hebräischen Textes und trägt keine konfessionelle Erklärung ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Anrede steht entsprechend dem hebräischen Plural im Plural. „Von ganzem Herzen“ ist idiomatisch; „nach mir fragen“ bewahrt den Wechsel zwischen בקשׁ und דרשׁ.
