base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/005.yaml
  text: Build houses and live in them[a]; plant gardens and eat their fruit.
translation:
  language: de
  text: Baut Häuser und wohnt in ihnen; pflanzt Gärten und esst ihre Früchte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנוּ בָתִּים
  choice: Baut Häuser
  rationale: Der pluralische Qal-Imperativ von בנה mit בָּתִּים bezeichnet unmittelbar das Errichten konkreter Wohnhäuser. Die knappe deutsche Form bewahrt den Befehlscharakter.
- source_word: וְשֵׁבוּ
  choice: und wohnt darin
  rationale: ישב kann sitzen, bleiben oder wohnen bedeuten. In Verbindung mit Häusern bezeichnet es hier dauerhaftes Wohnen; „darin“ gibt den im Deutschen erforderlichen Rückbezug idiomatisch wieder.
- source_word: וְנִטְעוּ גַנּוֹת
  choice: pflanzt Gärten
  rationale: נטע ist das übliche Verb für pflanzen, und גַּנּוֹת bezeichnet Gärten. Obwohl der folgende Fruchtbezug auch an Obstgärten denken lässt, bleibt „Gärten“ lexikalisch weiter und vermeidet eine unnötige Einengung.
- source_word: וְאִכְלוּ אֶת־פִּרְיָן
  choice: und esst ihre Früchte
  rationale: אכל bedeutet schlicht „essen“. פְּרִי kann Frucht oder Ertrag bezeichnen; der femininale Pluralsuffix verweist auf die Gärten. „Ihre Früchte“ bewahrt das konkrete landwirtschaftliche Bild und ist im Deutschen natürlich.
