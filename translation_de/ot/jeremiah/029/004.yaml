  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/כָל הַ֨/גּוֹלָ֔ה אֲשֶׁר הִגְלֵ֥יתִי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen, der Gott Israels, zu allen Weggeführten, die ich aus Jerusalem nach Babel in die Verbannung geführt habe[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die ich aus Jerusalem nach Babel deportiert habe“. Das hebräische Verb ist kausativ und bedeutet, jemanden in die Verbannung zu führen beziehungsweise zu deportieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch und würdevoll im Präsens wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die Wiedergabe als Eigenname bewahrt die Funktion des Tetragramms und ersetzt es nicht durch einen Titel.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, lexikalisch nahe Wiedergabe lässt die Weite des hebräischen Ausdrucks bestehen; „Armeen“ wäre enger, „Allmächtiger“ stärker deutend.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte Wiedergabe der hebräischen Genitivverbindung.
- source_word: לְכָל הַגּוֹלָה
  choice: zu allen Weggeführten
  rationale: Das kollektive Singularwort bezeichnet die deportierte Gemeinschaft. Der deutsche Plural benennt die angesprochenen Menschen natürlich und vermeidet die mögliche Vorstellung bloßer Gefangenschaft.
- source_word: הִגְלֵיתִי
  choice: die ich … in die Verbannung geführt habe
  rationale: Die Form ist kausativ und schreibt Jahwe zu, dass er die Betroffenen ins Exil führen ließ beziehungsweise führte. Die Formulierung macht diese Verursachung deutlich.
- source_word: מִירוּשָׁלַם
  choice: aus Jerusalem
  rationale: Die Präposition bezeichnet den Ausgangspunkt der Deportation.
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Die Richtungsendung bezeichnet die Bewegung auf Babel zu; „nach“ ist bei einem Städtenamen idiomatisches Deutsch.
theological_decisions:
- issue: Göttliches Handeln bei der Verbannung
  choice: „die ich … in die Verbannung geführt habe“
  alternative: „die aus Jerusalem nach Babel verschleppt wurden“
  rationale: Der hebräische Text nennt Jahwe ausdrücklich als handelndes Subjekt. Diese theologische Spannung wird weder zu bloßer Zulassung abgeschwächt noch ausschließlich menschlichen Akteuren zugeschrieben.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname bleibt als Name erkennbar, statt durch einen Titel ersetzt zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt prägnant; „Weggeführte“ und „in die Verbannung geführt“ bewahren Exilmotiv und göttliche Urheberschaft. Der Doppelpunkt zeigt, dass die folgende Botschaft anschließt.
