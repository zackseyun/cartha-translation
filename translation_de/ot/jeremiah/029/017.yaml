source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִי֙ מְשַׁלֵּ֣חַ בָּ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר וְ/נָתַתִּ֣י אוֹתָ֗/ם כַּ/תְּאֵנִים֙ הַ/שֹּׁ֣עָרִ֔ים אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Siehe, ich schicke Schwert, Hunger und Pest gegen sie. Ich mache sie wie verdorbene Feigen[a], die man nicht essen kann, weil sie so schlecht sind.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „schlechte Feigen“ oder „verfaulte Feigen“; das hebräische Wort bezeichnet Feigen von so schlechter Beschaffenheit, dass sie ungenießbar sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als „Jahwe“ wieder und bewahrt mit „Heerscharen“ die traditionelle, nicht vorschnell eingeengte Bedeutung des Titels.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Bewahrt die nachdrückliche deiktische Funktion und den feierlichen Ton der prophetischen Gerichtsankündigung.
- source_word: מְשַׁלֵּחַ בָּם
  choice: ich schicke … gegen sie
  rationale: Der mit הִנְנִי verbundene Partizipialausdruck bezeichnet das unmittelbar bevorstehende beziehungsweise anschaulich gegenwärtige Handeln; בָּם hat hier feindliche Zielrichtung.
- source_word: הַחֶרֶב אֶת הָרָעָב וְאֶת הַדָּבֶר
  choice: Schwert, Hunger und Pest
  rationale: Erhält die konkrete dreigliedrige Gerichtsformel. „Hunger“ ist im modernen Deutsch natürlicher als „Hungersnot“, ohne die kollektive Notlage auszuschließen.
- source_word: וְנָתַתִּי אוֹתָם
  choice: Ich mache sie
  rationale: Gibt die idiomatische Wirkung von נתן mit dem folgenden Vergleich im natürlichen Deutschen wieder.
- source_word: הַשֹּׁעָרִים
  choice: verdorbene
  rationale: Bezeichnet hier Feigen von äußerst schlechter, abstoßender Beschaffenheit; „verdorben“ macht ihre Ungenießbarkeit konkret, ohne eine moralische Bedeutung einzutragen.
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: die man nicht essen kann, weil sie so schlecht sind
  rationale: Gibt die passive Ungenießbarkeit und den begründenden Ausdruck מֵרֹעַ klar und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ macht den hebräischen Eigennamen sichtbar und folgt der vorgegebenen Projektentscheidung, ohne den Namen durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem prophetischem Ton. Die Satzteilung erhöht die Verständlichkeit, ohne den Gedankengang oder die Gerichtsformel zu verändern.
