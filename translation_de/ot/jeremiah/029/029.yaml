base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/029.yaml
  text: Then Zephaniah the priest read this scroll in the hearing of Jeremiah the prophet[a].
translation:
  language: de
  text: Darauf las der Priester Zefanja dieses Schriftstück[a] dem Propheten Jeremia vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Buch“, „Schriftrolle“, „Schriftstück“ oder „Brief“ bedeuten; im Zusammenhang ist das Schreiben Schemajas gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Darauf las ... vor
  rationale: Das Qal-Wayyiqtol von קרא bezeichnet mit einem Schriftstück als Objekt das Lesen. „Darauf“ gibt die erzählerische Abfolge wieder; das trennbare Verb „vorlesen“ macht zusammen mit בְּאָזְנֵי deutlich, dass laut gelesen wurde.
- source_word: צְפַנְיָה
  choice: Zefanja
  rationale: Der Personenname wird nach der im Deutschen üblichen biblischen Namensform wiedergegeben.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Amtstitel wird ausdrücklich beibehalten.
- source_word: הַסֵּפֶר הַזֶּה
  choice: dieses Schriftstück
  rationale: סֵפֶר kann ein Buch, eine Schriftrolle, ein Dokument oder einen Brief bezeichnen. „Schriftstück“ wahrt diese lexikalische Breite, während der Zusammenhang erkennen lässt, dass es sich um das Schreiben Schemajas handelt.
- source_word: בְּאָזְנֵי
  choice: dem ... vor
  rationale: Die hebräische Wendung bedeutet wörtlich „in den Ohren von“ und besagt hier, dass Zefanja laut las, sodass Jeremia es hörte. Die deutsche Konstruktion „jemandem vorlesen“ gibt dies natürlich wieder.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: dem Propheten Jeremia
  rationale: Name und bestimmter Titel bleiben erhalten; die im Deutschen natürliche Stellung des Titels vor dem Namen vermeidet eine schwerfällige Apposition.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. „Darauf“ führt die Erzählung flüssig fort; „dem Propheten Jeremia vorlesen“ gibt die hebräische Hörensformel idiomatisch und präzise wieder.
