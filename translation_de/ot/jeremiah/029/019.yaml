source:
  edition: WLC
  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
translation:
  language: de
  text: weil sie nicht auf meine Worte gehört haben – Ausspruch Jahwes –, die ich ihnen durch meine Diener, die Propheten, immer wieder sandte.[a] Doch ihr habt nicht gehört[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „früh aufstehend und sendend“; eine hebräische Redewendung für beharrliches, wiederholtes Senden.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Text wechselt von „sie haben nicht gehört“ zur direkten Anrede „ihr habt nicht gehört“.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: weil
  rationale: Die Verbindung leitet den Grund für das zuvor angekündigte Gericht ein; „weil“ gibt die kausale Funktion natürlich und präzise wieder.
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  choice: nicht auf … gehört / nicht gehört
  rationale: שׁמע mit אֶל bezeichnet hier nicht bloß akustisches Hören, sondern aufmerksames Hören mit der Erwartung, dem Gesagten zu folgen. „Auf meine Worte gehört“ bewahrt diese Bedeutungsbreite, ohne sie auf „gehorcht“ zu verengen.
- source_word: אֶל דְּבָרַי
  choice: auf meine Worte
  rationale: Der Plural wird als „Worte“ bewahrt; mit „auf … hören“ ergibt sich im Deutschen eine natürliche Verbindung.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch Jahwes“ wahrt den feierlichen Charakter der prophetischen Botenformel und gibt נְאֻם als formelhafte Kennzeichnung einer göttlichen Erklärung wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: שָׁלַחְתִּי אֲלֵיהֶם אֶת עֲבָדַי הַנְּבִאִים
  choice: die ich ihnen durch meine Diener, die Propheten, … ausrichten ließ
  rationale: Im Hebräischen bezieht sich אֲשֶׁר grammatisch auf „meine Worte“, obwohl anschließend die Propheten als Gesandte genannt werden. Die deutsche Fassung macht die Vermittlung der Worte durch die Propheten verständlich, ohne den Sinn zu verändern.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: meine Diener, die Propheten
  rationale: „Diener“ betont hier den göttlichen Auftrag; die Apposition „die Propheten“ bleibt erhalten.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: immer wieder ausrichten ließ
  rationale: Die wörtliche Wendung „früh aufstehen und senden“ ist ein hebräisches Idiom für beharrliches, wiederholtes Senden. Die idiomatische Wiedergabe vermittelt diesen Sinn in natürlichem Deutsch; die Bildsprache wird in der Fußnote dokumentiert.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: Doch ihr habt nicht gehört
  rationale: Der Wechsel von der dritten zur zweiten Person Plural wird bewahrt. „Doch“ bringt den im Zusammenhang liegenden Gegensatz im Deutschen klar zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR / Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen und verwendet die im Deutschen übliche wissenschaftliche Transkription.
- issue: Wechsel von der dritten zur zweiten Person
  choice: „sie …“ und anschließend „ihr …“ beibehalten
  alternative: Beide Aussagen an dieselbe grammatische Person angleichen
  rationale: Der masoretische Text wechselt unvermittelt von „sie haben nicht gehört“ zu „ihr habt nicht gehört“. Die Übersetzung bewahrt diese rhetorische Zuspitzung, statt sie stillschweigend zu harmonisieren.
- issue: Bedeutung von שׁמע
  choice: hören / auf Worte hören
  alternative: gehorchen
  rationale: Der Kontext schließt das Befolgen ein, doch „gehorchen“ würde die Bedeutungsbreite ausdrücklich festlegen. „Hören“ erhält das Zusammenspiel von Wahrnehmen und Beachten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit behutsam gegliedert. Der prophetische Formelcharakter bleibt mit „Ausspruch Jahwes“ erhalten; der ungewöhnliche Personenwechsel wird nicht geglättet.
