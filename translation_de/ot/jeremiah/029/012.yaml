  text: Then you will call on me and come and pray to me[b][a], and I will hear you.
translation:
  language: de
  text: Dann werdet ihr mich anrufen, hingehen[a] und zu mir beten, und ich werde euch hören[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu mir kommen und beten“. Das hebräische Verb bedeutet wörtlich „gehen“ oder „sich auf den Weg machen“; im Zusammenhang mit dem folgenden Beten kann es ein Herantreten zum Gebet bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „euch zuhören“ oder „auf euch hören“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם
  choice: ihr werdet … anrufen
  rationale: קרא mit persönlichem Objekt bezeichnet hier das an Gott gerichtete Rufen. „Anrufen“ ist im Deutschen idiomatisch und wahrt den Gebetskontext.
- source_word: אֹתִי
  choice: mich
  rationale: Das Objektsuffix bezieht sich auf Gott und wird direkt mit „mich“ wiedergegeben.
- source_word: וַהֲלַכְתֶּם
  choice: zu mir kommen
  rationale: הלך bedeutet wörtlich „gehen/ziehen“. In der Verbindung mit dem folgenden Gebet bezeichnet es wahrscheinlich das Herantreten zum Gebet; „zu mir kommen“ macht dieses Ziel im Deutschen natürlich deutlich, ohne die wörtliche Alternative zu verschweigen.
- source_word: וְהִתְפַּלַּלְתֶּם
  choice: zu mir beten
  rationale: Der Hitpael von פלל bezeichnet hier das an Gott gerichtete Beten. „Beten“ ist die klare und übliche deutsche Wiedergabe.
- source_word: אֵלָי
  choice: zu mir
  rationale: Die Präposition bezeichnet die Ausrichtung des Gebets auf Gott und wird natürlich mit „zu mir“ wiedergegeben.
- source_word: וְשָׁמַעְתִּי אֲלֵיכֶם
  choice: ich werde euch hören
  rationale: שמע mit אֶל kann „hören“, „zuhören“ oder „auf jemanden hören“ bedeuten. „Euch hören“ bleibt nahe am hebräischen Ausdruck und lässt offen, wie ausdrücklich die zugesagte wohlwollende Reaktion formuliert wird.
theological_decisions:
- issue: Gottes Reaktion auf das Gebet
  choice: ich werde euch hören
  alternative: ich werde euch zuhören / ich werde euch erhören
  rationale: „Erhören“ würde eine günstige Antwort stärker festlegen, während „zuhören“ die bewusste Zuwendung hervorhebt. „Hören“ bewahrt die knappe Formulierung und die Bedeutungsweite des Hebräischen; der Kontext legt Gottes Zuwendung nahe, ohne dass die Übersetzung sie weiter ausdeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht entsprechend dem hebräischen Plural im vertrauten „ihr“. Die parallele Abfolge der Verben bleibt erkennbar, wird aber für natürliches Deutsch leicht geglättet.
