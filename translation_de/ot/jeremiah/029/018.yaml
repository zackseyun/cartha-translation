  source_fidelity: Der Entwurf gibt die göttliche Ich-Rede, die Gerichtstriade sowie die Abfolge der öffentlichen Schmachbegriffe grundsätzlich treffend wieder. „Hunger“ ist jedoch für רָעָב in diesem nationalen Gerichts- und Katastrophenkontext zu eng und sollte als „Hungersnot“ wiedergegeben werden. Außerdem bezeichnet בְּכָל־הַגּוֹיִם אֲשֶׁר הִדַּחְתִּים שָׁם die Völker, unter die die Betroffenen vertrieben wurden; „unter die“ bildet dies genauer ab als das bloß zielgerichtete „wohin“.
  naturalness: Die überarbeitete Fassung bleibt modernes, würdiges Standarddeutsch. „Zum Schrecken“ ist direkter und weniger bildlich ergänzend als „zu einem Bild des Schreckens“, ohne die Bedeutung zu verändern. Die Reihung bleibt gut lesbar.
  terminology: „Schwert“, „Hungersnot“ und „Pest“ bewahren die etablierte prophetische Gerichtstriade. „Fluch“, „Verwüstung“, „Pfeifen“ und „Schande“ unterscheiden die hebräischen Glieder ausreichend. Die Fußnoten erläutern die lexikalischen Spielräume bei זַוֲעָה und שְׁרֵקָה angemessen.
