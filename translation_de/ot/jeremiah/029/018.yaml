  - severity: low
    issue: „wohin ich sie vertrieben habe“
    rationale: Der Relativsatz bezieht sich auf die genannten Völker als Orte bzw. Gemeinschaften der Zerstreuung. „unter die ich sie vertrieben habe“ macht diesen Bezug im Deutschen genauer.
  - severity: low
    issue: „zu einem Bild des Schreckens“
    rationale: „Bild“ ist im hebräischen Text nicht ausgedrückt. „Zum Schrecken“ ist knapper und wahrt die offene Bedeutung von זַוֲעָה.
