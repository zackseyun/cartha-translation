source:
  edition: WLC
  text: וְ/רָֽדַפְתִּי֙ אַֽחֲרֵי/הֶ֔ם בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וּ/נְתַתִּ֨י/ם ל/זועה לְ/כֹ֣ל מַמְלְכ֣וֹת הָ/אָ֗רֶץ לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/שְׁרֵקָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁר הִדַּחְתִּ֥י/ם שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
translation:
  language: de
  text: Und ich werde sie mit dem Schwert, mit Hungersnot und mit Pest verfolgen. Ich werde sie für alle Königreiche der Erde zum Schrecken[a] machen, zum Fluch, zur Verwüstung, zum Gegenstand höhnischen Pfeifens[b] und zur Schande unter allen Völkern, unter die ich sie vertrieben habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Entsetzen« oder »zum Grauen«. Das hebräische Wort kann Schrecken, Entsetzen oder Zittern bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »zum Pfeifen« oder »zum Zischen«; gemeint ist eine verächtliche Reaktion, durch die sie zum Gegenstand des Spotts werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  choice: Und ich werde sie … verfolgen
  rationale: רדף mit אַחֲרֵי bezeichnet ein aktives Verfolgen. Die deutsche Formulierung bewahrt den nachdrücklichen Sinn, ohne ihn auf religiöse Verfolgung einzuengen.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: mit Schwert, Hunger und Pest
  rationale: Die konkrete prophetische Gerichtsfolge wird knapp und traditionsnah wiedergegeben. רָעָב meint hier die umfassende Not des Hungers; דֶּבֶר bezeichnet eine tödliche Seuche beziehungsweise Pest.
- source_word: וּנְתַתִּים לְזועה
  choice: Ich werde sie … zu einem Bild des Schreckens machen
  rationale: Die Wendung beschreibt die Betroffenen als sichtbares Beispiel, das Schrecken oder Entsetzen hervorruft. „Bild des Schreckens“ ist im Deutschen natürlicher als „ein Schrecken“ und lässt die Bedeutungsbreite erkennen.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: für alle Königreiche der Erde
  rationale: 'Das ל markiert hier den Bezug: Für sämtliche Königreiche werden sie zu einem abschreckenden Beispiel.'
- source_word: לְאָלָה
  choice: zum Fluch
  rationale: אָלָה kann einen Fluch, auch einen Schwurfluch, bezeichnen. Im vorliegenden Katalog ist „Fluch“ die klare und hinreichend offene Wiedergabe.
- source_word: וּלְשַׁמָּה
  choice: zur Verwüstung
  rationale: שַׁמָּה kann Verwüstung oder einen Gegenstand des Entsetzens bezeichnen. „Verwüstung“ bewahrt die mögliche konkrete Bedeutung und unterscheidet das Wort von זועה.
- source_word: וְלִשְׁרֵקָה
  choice: zum Gegenstand höhnischen Pfeifens
  rationale: שְׁרֵקָה bezeichnet das verächtliche Zischen oder Pfeifen der Betrachter. Die Formulierung macht deutlich, dass die Verurteilten dessen Ziel sind.
- source_word: וּלְחֶרְפָּה
  choice: und zur Schande
  rationale: חֶרְפָּה umfasst Schmach, Schande und öffentlichen Hohn. „Schande“ ist gegenwärtig, verständlich und wahrt die soziale Dimension.
- source_word: בְּכָל הַגּוֹיִם אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: unter allen Völkern, wohin ich sie vertrieben habe
  rationale: „Unter“ gibt die Lage inmitten der Völker idiomatisch wieder. Das Hifil von נדח wird mit „vertrieben“ wiedergegeben und bewahrt Gottes ausdrücklich genannte Urheberschaft.
theological_decisions:
- issue: Gottes unmittelbare Urheberschaft bei Gericht und Vertreibung
  choice: 'Die Aussagen bleiben ausdrücklich in der ersten Person: „ich werde … verfolgen“, „ich werde … machen“, „ich … vertrieben habe“.'
  alternative: Das Geschehen passiv oder unpersönlich formulieren.
  rationale: Der hebräische Text schreibt Gott sowohl das kommende Gericht als auch die bereits vollzogene Vertreibung ausdrücklich zu. Diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. Die Aufzählung und die ausdrückliche göttliche Ich-Rede bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
