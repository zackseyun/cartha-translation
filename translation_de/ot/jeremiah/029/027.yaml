id: JER.29.27
reference: Jeremiah 29:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לָ֚/מָּה לֹ֣א גָעַ֔רְתָּ בְּ/יִרְמְיָ֖הוּ הָֽ/עֲנְּתֹתִ֑י הַ/מִּתְנַבֵּ֖א לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
translation:
  language: de
  text: Und nun, warum hast du Jeremia aus Anatot[a] nicht zurechtgewiesen, der euch weissagt?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Anatotiter“; das Hebräische verwendet ein Herkunftsadjektiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt sowohl die verbindende Funktion von ו als auch den zeitlich-folgernden Gesprächsmarker עַתָּה wieder.
- source_word: לָמָּה
  choice: warum
  rationale: Direktes Fragewort nach dem Grund.
- source_word: לֹא גָעַרְתָּ
  choice: hast du … nicht zurechtgewiesen
  rationale: גָּעַר bezeichnet ein scharfes Tadeln oder Zurechtweisen. Die Perfektform mit Negation wird im Deutschen idiomatisch mit dem Perfekt wiedergegeben.
- source_word: בְּיִרְמְיָהוּ
  choice: Jeremia
  rationale: Die Präposition ב markiert hier die Person, gegen die sich das Zurechtweisen richtet; im Deutschen regiert „zurechtweisen“ den Akkusativ ohne Präposition.
- source_word: הָעֲנְתֹתִי
  choice: aus Anatot
  rationale: Das hebräische Herkunftsadjektiv wird in natürlichem modernem Deutsch als Herkunftsangabe wiedergegeben; die wörtlichere Form wird in der Fußnote genannt.
- source_word: הַמִּתְנַבֵּא
  choice: der … weissagt
  rationale: Das substantivierte Partizip beschreibt Jeremia in seiner gegenwärtigen prophetischen Tätigkeit. „Weissagt“ bewahrt den verbalen Sinn, ohne die Echtheit seiner Prophetie vorwegzunehmen.
- source_word: לָכֶם
  choice: euch
  rationale: ל kennzeichnet hier am natürlichsten die Adressaten der prophetischen Rede; der Dativ „euch“ entspricht idiomatischem Deutsch.
theological_decisions:
- issue: Bewertung von Jeremias prophetischem Auftreten
  choice: der euch weissagt
  alternative: der sich euch gegenüber als Prophet aufspielt
  rationale: Die reflexive Hitpael-Form kann je nach Kontext prophetisches Auftreten bezeichnen, enthält hier aber nicht zwingend eine abwertende Beurteilung. Die Übersetzung lässt die im zitierten Vorwurf liegende Spannung bestehen, ohne Jeremias Sendung sprachlich zu leugnen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Satzstellung erhält den vorwurfsvollen Frageton. Der Fußnotenmarker steht unmittelbar bei der Herkunftsbezeichnung, auf die er sich bezieht.
