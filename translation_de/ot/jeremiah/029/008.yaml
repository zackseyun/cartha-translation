source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen, der Gott Israels: Lasst euch nicht von euren Propheten, die unter euch sind, und euren Wahrsagern täuschen; und hört nicht auf eure Träume, die ihr euch träumen lasst.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr träumt“. Die hebräische Wendung ist ungewöhnlich und kann entweder die eigenen Träume der Menschen oder Träume bezeichnen, die sie in gewisser Weise fördern oder hervorrufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Der Heerscharen“ bewahrt den festen Titel und lässt offen, ob himmlische oder irdische Heere im Blick sind.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Genitivverbindung wird direkt und natürlich wiedergegeben.
- source_word: אַל יַשִּׁיאוּ לָכֶם
  choice: Lasst euch nicht … täuschen
  rationale: Die deutsche Konstruktion gibt den verursachenden Sinn des Hifil idiomatisch wieder und behält die angesprochenen Personen als Betroffene der Täuschung bei.
- source_word: נְבִיאֵיכֶם אֲשֶׁר בְּקִרְבְּכֶם
  choice: eure Propheten, die unter euch sind
  rationale: Die Formulierung bewahrt sowohl die Zugehörigkeit zur angesprochenen Gemeinschaft als auch die Gegenwart dieser Propheten in ihrer Mitte.
- source_word: קֹסְמֵיכֶם
  choice: eure Wahrsager
  rationale: „Wahrsager“ ist eine verständliche moderne Bezeichnung für Menschen, die Wahrsagung beziehungsweise Divination betreiben.
- source_word: וְאַל תִּשְׁמְעוּ אֶל
  choice: und hört nicht auf
  rationale: „Auf jemanden oder etwas hören“ gibt hier nicht nur akustisches Hören, sondern das Befolgen oder Ernstnehmen wieder.
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  choice: eure Träume, die ihr euch träumen lasst
  rationale: Die reflexiv-kausative Formulierung wahrt den auffälligen Hifil von חלם besser als das glatte „die ihr träumt“, bleibt im Deutschen aber verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Text nennt den persönlichen Gottesnamen. Die im Deutschen übliche Form „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der auffälligen Hifil-Form מַחְלְמִים
  choice: die ihr euch träumen lasst
  alternative: die ihr träumt
  rationale: Die gewählte Form bewahrt die mögliche verursachende oder fördernde Nuance, ohne auszuschließen, dass von den eigenen Träumen der Angesprochenen die Rede ist. Die echte sprachliche Unsicherheit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am prophetischen Botenwort; die schwierige Schlusswendung wird bewusst nicht zu einer eindeutigeren Aussage geglättet.
