  source_fidelity: 'Die Satzglieder sind grundsätzlich vollständig wiedergegeben: כִּי als begründendes „Denn“, die abgeschlossene Aussage der 2. Person Plural, der Gottesname, „für uns“, die Propheten und der Ort Babel. Die Wiedergabe von הֵקִים als „hat ... auftreten lassen“ verschiebt jedoch den Hifil von קום von „aufrichten/erwecken, einsetzen“ zu einer bloßen Erlaubnis, öffentlich aufzutreten. Das ist semantisch enger und schwächer als der hebräische Ausdruck.'
