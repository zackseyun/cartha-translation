  terminology: '„Jahwe“, „Propheten“ und „Babel“ sind konsistent und angemessen. „Hat ... Propheten erweckt“ gibt die etablierte prophetische Ausdrucksweise und die kausative Bedeutung von הֵקִים präziser wieder, ohne die im Kontext fragliche Behauptung der Sprecher als göttlich bestätigt darzustellen: Sie bleibt ausdrücklich zitiert.'
