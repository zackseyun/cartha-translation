source:
  edition: WLC
  text: כִּ֖י אֲמַרְתֶּ֑ם הֵקִ֨ים לָ֧/נוּ יְהוָ֛ה נְבִאִ֖ים בָּבֶֽלָ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/015.yaml
  text: Because you have said[b][a], “Yahweh has raised up prophets for us in Babylon,”
translation:
  language: de
  text: 'Denn ihr habt gesagt: »Jahwe hat uns in Babel Propheten erweckt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang die folgende göttliche Antwort. „Denn“ erhält diese Verknüpfung natürlich und lässt zugleich erkennen, dass der Satz inhaltlich weitergeführt wird.
- source_word: אֲמַרְתֶּם
  choice: ihr habt gesagt
  rationale: Das Qatal in der 2. Person Plural verweist auf eine bereits geäußerte Behauptung; das deutsche Perfekt verbindet sie natürlich mit der gegenwärtigen Situation.
- source_word: הֵקִים
  choice: hat … auftreten lassen
  rationale: Der Hifil von קום bezeichnet hier, dass Gott Propheten hervorbringt beziehungsweise einsetzt. „auftreten lassen“ ist im Deutschen bei Propheten idiomatisch und wahrt den Handlungssinn, ohne ihre göttliche Bestätigung stärker zu behaupten, als es der zitierte Ausspruch tut.
- source_word: לָנוּ
  choice: für uns
  rationale: Die Präposition ל drückt hier am natürlichsten Begünstigung oder Bereitstellung aus.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נְבִאִים
  choice: Propheten
  rationale: Direkte und geläufige Wiedergabe des maskulinen Plurals von נביא.
- source_word: בָּבֶלָה
  choice: in Babel
  rationale: Die Form bezeichnet hier trotz der Endung ה den Ort. „Babel“ ist die etablierte deutsche biblische Namensform für die Stadt Babylon.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn, statt ihn durch einen traditionellen Titel zu ersetzen.
- issue: Bedeutungsumfang von הֵקִים bei Propheten
  choice: hat … auftreten lassen
  alternative: hat … eingesetzt
  rationale: „Eingesetzt“ könnte die amtliche Legitimation der in Babel auftretenden Propheten stärker hervorheben. Da die Aussage von den Angesprochenen zitiert wird und der weitere Kontext ihre Beurteilung problematisiert, wahrt „auftreten lassen“ die Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede steht im Plural. Der Doppelpunkt und die Anführungszeichen machen kenntlich, dass die Behauptung der Adressaten zitiert wird. „Babel“ folgt dem üblichen deutschen Bibelgebrauch.
