base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
translation:
  language: de
  text: Da kamen Ismael, der Sohn Netanjas, Johanan und Jonatan, die Söhne Kareachs, Seraja, der Sohn Tanchumets, die Söhne des Netofatiters Efai[a], und Jesanja[b], der Sohn eines Maachatiters, bei Gedalja in Mizpa zusammen – sie und ihre Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Efai kann auch Ofai beziehungsweise Ofi wiedergegeben werden; seine genaue Umschrift ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Der Name Jesanja kann auch Jesanjahu wiedergegeben werden; möglicherweise entspricht er einer Namensform, die andernorts als Jaasanja erscheint.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das Wayyiqtol führt die Erzählung mit einer abgeschlossenen Handlung fort; „Da kamen“ gibt diesen narrativen Anschluss in natürlichem Deutsch wieder.
- source_word: אֶל גְּדַלְיָה הַמִּצְפָּתָה
  choice: zu Gedalja nach Mizpa
  rationale: אֶל bezeichnet die Bewegung zu Gedalja, während die Richtungsendung an מִצְפָּתָה die Bewegung nach Mizpa ausdrückt. Die Formulierung bewahrt beide Zielangaben.
- source_word: וְיִשְׁמָעֵאל בֶּן נְתַנְיָהוּ
  choice: Ismael, der Sohn Netanjas
  rationale: Die Patronymik wird ausdrücklich wiedergegeben; die Namensformen folgen geläufigen deutschen Bibelkonventionen.
- source_word: וְיוֹחָנָן וְיוֹנָתָן בְּנֵי קָרֵחַ
  choice: Johanan und Jonatan, die Söhne Kareachs
  rationale: Der Plural „Söhne“ bezieht sich auf beide unmittelbar vorausgehenden Namen.
- source_word: וּשְׂרָיָה בֶן תַּנְחֻמֶת
  choice: Seraja, der Sohn Tanchumets
  rationale: Die hebräische Vater-Sohn-Angabe bleibt transparent erhalten.
- source_word: וּבְנֵי עופי הַנְּטֹפָתִי
  choice: die Söhne Efais[a], des Netofatiters
  rationale: Der Konsonantenbestand עופי wird mit der verbreiteten Namensform „Efai“ wiedergegeben; das Gentiliz bezeichnet einen Mann aus Netofa und bezieht sich grammatisch auf Efai.
- source_word: וִיזַנְיָהוּ בֶּן הַמַּעֲכָתִי
  choice: Jesanja[b], der Sohn des Maachatiters
  rationale: Der Personenname wird in einer geläufigen deutschen Form wiedergegeben. Beim Vater steht im Hebräischen nur das Gentiliz mit Artikel, weshalb sein Eigenname nicht ergänzt wird.
- source_word: הֵמָּה וְאַנְשֵׁיהֶם
  choice: sie und ihre Männer
  rationale: Die nachgestellte, ausdrücklich wiederholte Subjektangabe wird beibehalten und durch einen Gedankenstrich hervorgehoben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die lange Namensreihe folgt dem Hebräischen, wird aber durch Appositionen und Kommas lesbar gegliedert. Der Gedankenstrich bewahrt die markante hebräische Nachstellung „sie und ihre Männer“.
