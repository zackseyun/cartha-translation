  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֗ה הֵ֚מָּה וְ/אַנְשֵׁי/הֶ֔ם כִּֽי הִפְקִ֧יד מֶֽלֶךְ בָּבֶ֛ל אֶת גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם בָּ/אָ֑רֶץ וְ/כִ֣י הִפְקִ֣יד אִתּ֗/וֹ אֲנָשִׁ֤ים וְ/נָשִׁים֙ וָ/טָ֔ף וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ מֵ/אֲשֶׁ֥ר לֹֽא הָגְל֖וּ בָּבֶֽלָ/ה־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: When all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
translation:
  language: de
  text: Als alle Befehlshaber der Truppen, die sich im offenen Land[a] befanden, mit ihren Männern hörten, dass der König von Babel Gedalja, den Sohn Ahikams, über das Land eingesetzt und ihm Männer, Frauen und Kinder sowie einen Teil der armen Bevölkerung des Landes, die nicht nach Babel verschleppt worden war[c], anvertraut hatte[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf dem Feld“; gemeint ist hier das Gebiet außerhalb der Städte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von den Geringen des Landes“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die nicht nach Babel ins Exil geführt worden war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Heerführer
  rationale: Die Wendung bezeichnet die militärischen Befehlshaber der Truppen; „Heerführer“ ist prägnant, würdig und legt keinen bestimmten Dienstgrad fest.
- source_word: בַּשָּׂדֶה
  choice: auf dem offenen Land
  rationale: Wörtlich steht „auf dem Feld“; im Erzählzusammenhang ist das Gebiet außerhalb der städtischen Kontrolle gemeint.
- source_word: וְאַנְשֵׁיהֶם
  choice: mit ihren Männern
  rationale: Das Hebräische lautet wörtlich „und ihre Männer“. Die Einbindung mit „mit“ ergibt im Deutschen einen natürlichen Satz und bewahrt den militärischen Zusammenhang.
- source_word: הִפְקִיד ... בָּאָרֶץ
  choice: über das Land eingesetzt
  rationale: Beim ersten Vorkommen bezeichnet das Verb die offizielle Einsetzung Gedaljas in eine Leitungsfunktion mit Zuständigkeit für das Land.
- source_word: הִפְקִיד אִתּוֹ
  choice: ihm ... anvertraut
  rationale: Beim zweiten Vorkommen bezeichnet das Verb, dass Menschen Gedaljas Obhut beziehungsweise Verantwortung übergeben wurden.
- source_word: אֲנָשִׁים וְנָשִׁים וָטָף
  choice: Männer, Frauen und Kinder
  rationale: טָף bezeichnet hier Kinder beziehungsweise die Kleinen; „Kinder“ ist die klare, gegenwärtige deutsche Wiedergabe.
- source_word: מִדַּלַּת הָאָרֶץ
  choice: einen Teil der armen Bevölkerung des Landes
  rationale: Das מִן trägt partitive Bedeutung; דַּלַּת bezeichnet die sozial und wirtschaftlich schwache Bevölkerung. Die Formulierung wahrt beides, ohne einen Superlativ einzutragen.
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  choice: nämlich diejenigen, die nicht nach Babel verschleppt worden waren
  rationale: Die hebräische aktive Pluralform lässt die handelnden Personen unausgesprochen. Das deutsche Passiv bewahrt diesen offenen Bezug und gibt die gewaltsame Deportation sachgerecht wieder.
- source_word: וַיִּשְׁמְעוּ
  choice: Als ... hörten
  rationale: Die Form führt die Erzählung weiter und eröffnet einen temporalen Nebensatz, dessen Fortsetzung in Vers 8 folgt. Ein zusätzliches „Nun“ ist nicht nötig.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Der Vers bleibt entsprechend dem hebräischen Satzbau syntaktisch offen und wird erst in Vers 8 fortgesetzt. „Babel“ bewahrt die im deutschen Bibelregister geläufige Bezeichnung des Ortes und Reiches.
