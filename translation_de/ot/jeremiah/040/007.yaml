revisions:
- from: Als alle Heerführer, die sich auf dem offenen Land[a] befanden, mit ihren Männern hörten, dass der König von Babel Gedalja, den Sohn Ahikams, über das Land eingesetzt und ihm Männer, Frauen und Kinder sowie einen Teil der armen Bevölkerung des Landes[b] anvertraut hatte, nämlich diejenigen, die nicht nach Babel verschleppt worden waren[c],
  to: Als alle Befehlshaber der Truppen, die sich im offenen Land[a] befanden, mit ihren Männern hörten, dass der König von Babel Gedalja, den Sohn Ahikams, über das Land eingesetzt und ihm Männer, Frauen und Kinder sowie einen Teil der armen Bevölkerung des Landes, die nicht nach Babel verschleppt worden war[c], anvertraut hatte[b],
  rationale: Die Überarbeitung präzisiert die militärische Bezeichnung und glättet die Ortsangabe. Vor allem wird der Relativsatz unmittelbar an „arme Bevölkerung des Landes“ angeschlossen, damit sein Bezug im Deutschen dem hebräischen Satzanschluss entspricht. Die offene Fortsetzung des Satzes zum folgenden Vers bleibt erhalten. Die Fußnotenanker wurden so gesetzt, dass jeder Anker eindeutig der betreffenden Formulierung folgt.
