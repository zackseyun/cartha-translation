source:
  edition: WLC
  text: וְ/יוֹחָנָ֣ן בֶּן קָרֵ֡חַ אָמַ֣ר אֶל גְּדַלְיָהוּ֩ בַ/סֵּ֨תֶר בַּ/מִּצְפָּ֜ה לֵ/אמֹ֗ר אֵ֤לְכָה נָּא֙ וְ/אַכֶּה֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וְ/אִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧/מָּה יַכֶּ֣/כָּה נֶּ֗פֶשׁ וְ/נָפֹ֨צוּ֙ כָּל יְהוּדָ֔ה הַ/נִּקְבָּצִ֣ים אֵלֶ֔י/ךָ וְ/אָבְדָ֖ה שְׁאֵרִ֥ית יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
translation:
  language: de
  text: 'Da sagte Johanan, der Sohn Kareachs, in Mizpa heimlich[a] zu Gedalja: „Lass mich doch gehen und Ismael, den Sohn Netanjas, erschlagen, ohne dass jemand davon erfährt. Warum sollte er dir das Leben nehmen[b], sodass alle Judäer, die sich bei dir gesammelt haben, zerstreut würden und der Rest von Juda umkäme?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Verborgenen“ beziehungsweise „insgeheim“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Warum sollte er dich töten?“ Der hebräische Wortlaut ist knapp und lautet wörtlich etwa: „Warum sollte er dich schlagen – Leben?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  choice: heimlich
  rationale: Die adverbiale Wiedergabe entspricht dem Gespräch im Verborgenen; das zugrunde liegende Substantiv kann auch einen geheimen oder verborgenen Ort bezeichnen.
- source_word: בַמִּצְפָּה
  choice: in Mizpa
  rationale: Der Ortsname wird in der im Deutschen üblichen biblischen Form wiedergegeben; die Präposition bezeichnet den Ort des Gesprächs.
- source_word: אֵלְכָה נָּא
  choice: Lass mich doch gehen
  rationale: Der Kohortativ mit נָא drückt eine dringliche, höflich vorgebrachte Bitte beziehungsweise einen Vorschlag aus.
- source_word: וְאַכֶּה
  choice: und … erschlagen
  rationale: נכה bezeichnet das Schlagen; im Kontext ist die beabsichtigte Tötung eindeutig. „Erschlagen“ bewahrt sowohl die Gewaltnuance als auch das Ergebnis.
- source_word: וְאִישׁ לֹא יֵדָע
  choice: ohne dass jemand davon erfährt
  rationale: אִישׁ ist hier generisch. Die deutsche Formulierung gibt natürlich wieder, dass niemand Kenntnis von der Tat erhalten soll.
- source_word: לָמָּה יַכֶּכָּה נֶפֶשׁ
  choice: Warum sollte er dir das Leben nehmen
  rationale: Die knappe hebräische Wendung lautet annähernd „Warum sollte er dich schlagen – Leben/Seele?“ und meint im Zusammenhang die Tötung Gedaljas.
- source_word: וְנָפֹצוּ
  choice: zerstreut würden
  rationale: Die Verbform beschreibt die erwartete Folge von Gedaljas Tod; der deutsche Konjunktiv wahrt den hypothetischen Zusammenhang.
- source_word: כָּל יְהוּדָה הַנִּקְבָּצִים אֵלֶיךָ
  choice: alle Judäer, die sich bei dir gesammelt haben
  rationale: „Ganz Juda“ bezeichnet hier kollektiv die Menschen, wie das pluralische Partizip zeigt. „Bei dir“ bringt ihre Sammlung unter Gedaljas Führung natürlich zum Ausdruck.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: der Rest Judas
  rationale: שְׁאֵרִית bezeichnet die nach der Katastrophe verbliebene Bevölkerung Judas. „Rest“ ist im heutigen Deutsch klar und bewahrt das Motiv der überlebenden Gemeinschaft.
- source_word: וְאָבְדָה
  choice: umkäme
  rationale: אבד kann „zugrunde gehen“, „umkommen“ oder „verloren gehen“ bedeuten; hier steht der Untergang der verbliebenen Gemeinschaft im Blick.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in der Tötungsdrohung
  choice: Leben
  alternative: Seele; Person
  rationale: Im Zusammenhang bezeichnet נֶפֶשׁ das bedrohte Leben Gedaljas, ohne eine anthropologische Aussage über eine vom Körper getrennte Seele zu verlangen.
- issue: Bezeichnung der verbliebenen Gemeinschaft Judas
  choice: der Rest Judas
  alternative: die Übriggebliebenen Judas
  rationale: Die traditionelle Motivsprache des „Restes“ wird bewahrt, ohne daraus an dieser Stelle eine weitergehende theologische Lehre abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist flüssig formuliert, während die hypothetische Folge im Konjunktiv und die Mehrdeutigkeit der knappen hebräischen Tötungsformel erhalten bleiben. Die Namensformen folgen geläufiger deutscher Bibelorthografie.
