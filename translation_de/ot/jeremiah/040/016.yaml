  text: וַ/יֹּ֨אמֶר גְּדַלְיָ֤הוּ בֶן אֲחִיקָם֙ אֶל יוֹחָנָ֣ן בֶּן קָרֵ֔חַ אַֽל תעש אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה כִּֽי שֶׁ֛קֶר אַתָּ֥ה דֹבֵ֖ר אֶל יִשְׁמָעֵֽאל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/016.yaml
  text: But Gedaliah son of Ahikam said to Johanan son of Kareah, “Do not do this thing, for you are speaking a lie about Ishmael.”
translation:
  language: de
  text: 'Doch Gedalja, der Sohn Ahikams, sagte zu Johanan, dem Sohn Kareachs: »Tu das nicht! Denn was du über Ismael sagst, ist eine Lüge.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תעש אֶת־הַדָּבָר הַזֶּה
  choice: Tu das nicht!
  rationale: Die Wendung bedeutet wörtlich »Tu diese Sache nicht«. Das natürliche deutsche »Tu das nicht« bewahrt das ausdrückliche Verbot ohne unnötige Schwerfälligkeit.
- source_word: כִּי שֶׁקֶר אַתָּה דֹבֵר אֶל־יִשְׁמָעֵאל
  choice: Denn was du über Ismael sagst, ist eine Lüge.
  rationale: שֶׁקֶר bezeichnet hier eine Lüge beziehungsweise Unwahrheit. אֶל kann in diesem Zusammenhang den Gegenstand der Aussage markieren; »über Ismael« entspricht dem Sinn und vermeidet die irreführende Lesart, Johanan spreche zu Ismael.
