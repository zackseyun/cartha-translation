base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/002.yaml
  text: Then the captain of the guard took Jeremiah and said to him[b][a], “Yahweh your God spoke this disaster against this place.”
translation:
  language: de
  text: 'Da nahm der Oberste der Leibwache[b] Jeremia zu sich und sagte zu ihm: „Jahwe, dein Gott, hat dieses Unheil[a] über diesen Ort angekündigt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Unglück“; das hebräische Wort kann je nach Zusammenhang auch „Böses“ oder „Schaden“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich lautet der Titel etwa „Oberster der Schlächter/Henker“; gemeint ist ein hoher babylonischer Hof- und Militärbeamter, gewöhnlich als Oberster der Leibwache verstanden.
    reason: cultural_note
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Die Wendung bezeichnet einen babylonischen Hof- und Militärtitel. „Oberster der Leibwache“ ist im Deutschen idiomatisch und lässt den Rang erkennen, ohne die wörtliche Bedeutung „Oberster der Schlächter/Henker“ in den Haupttext zu setzen.
- source_word: וַיִּקַּח
  choice: nah … zu sich
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im Zusammenhang geht es darum, dass der Amtsträger Jeremia zu sich beziehungsweise vor sich nimmt; „nahm … zu sich“ ist natürlich und vermeidet eine unnötig gewaltsame Deutung.
- source_word: לְיִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname wird nach der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Das maskuline Singularsuffix richtet die Aussage unmittelbar an Jeremia.
- source_word: דִּבֶּר
  choice: hat … angekündigt
  rationale: דבר bezeichnet hier das zuvor ausgesprochene Gerichtswort. „Angekündigt“ gibt im Deutschen den prophetischen Zusammenhang natürlicher wieder als das isolierte „gesprochen“.
- source_word: הָרָעָה הַזֹּאת
  choice: dieses Unheil
  rationale: רָעָה bezeichnet hier das Jerusalem betreffende Unheil beziehungsweise Gericht, nicht notwendig moralische Bosheit. „Unheil“ wahrt die semantische Breite und passt zum gehobenen, verständlichen Register.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: über diesen Ort
  rationale: Bei einem angekündigten Gericht kann אֶל die Zielrichtung der Aussage bezeichnen. „Über diesen Ort“ ist im Deutschen eine natürliche Verbindung mit „Unheil ankündigen“.
theological_decisions:
- issue: Bedeutung von רָעָה als Gegenstand des göttlichen Redens
  choice: dieses Unheil
  alternative: dieses Böse; dieses Unglück
  rationale: Der Kontext spricht vom angekündigten Gericht über Jerusalem. „Unheil“ kennzeichnet die schädliche Katastrophe, ohne den Text so wiederzugeben, als bezeichne er Jahwes Handeln als moralisch böse; die lexikalische Mehrdeutigkeit wird in der Fußnote offengelegt.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ erhält den Unterschied zwischen Eigenname und Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; „nahm … zu sich“ und „kündigte … an“ sorgen zugleich für natürliche Verständlichkeit. Sämtliche Fußnotenmarker stehen im Haupttext.
