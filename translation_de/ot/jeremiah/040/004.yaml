source:
  edition: WLC
  text: וְ/עַתָּ֞ה הִנֵּ֧ה פִתַּחְתִּ֣י/ךָ הַ/יּ֗וֹם מִֽן הָ/אזִקִּים֮ אֲשֶׁ֣ר עַל יָדֶ/ךָ֒ אִם ט֨וֹב בְּ/עֵינֶ֜י/ךָ לָ/ב֧וֹא אִתִּ֣/י בָבֶ֗ל בֹּ֚א וְ/אָשִׂ֤ים אֶת עֵינִ/י֙ עָלֶ֔י/ךָ וְ/אִם רַ֧ע בְּ/עֵינֶ֛י/ךָ לָ/בֽוֹא אִתִּ֥/י בָבֶ֖ל חֲדָ֑ל רְאֵה֙ כָּל הָ/אָ֣רֶץ לְ/פָנֶ֔י/ךָ אֶל ט֨וֹב וְ/אֶל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֥כֶת שָׁ֖מָּ/ה לֵֽךְ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now, look, today I have freed you from the chains on your hands. If you want to come with me to Babylon, come, and I will look after you[a]. But if you do not want to come with me to Babylon, do not. Look, the whole land is before you; go wherever seems good and right to you[b][c].
translation:
  language: de
  text: 'Und nun, sieh: Heute habe ich dich von den Fesseln an deinen Händen befreit. Wenn du mit mir nach Babylon kommen möchtest, dann komm; ich werde für dich sorgen[a]. Wenn du aber nicht mit mir nach Babylon kommen möchtest, dann lass es. Sieh, das ganze Land liegt vor dir. Geh, wohin es dir gut und richtig erscheint[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich werde mein Auge auf dich richten.“ Die Wendung drückt hier wohlwollende Fürsorge oder Schutz aus.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich heißt es zuvor „wenn es gut in deinen Augen ist“ beziehungsweise „wenn es schlecht in deinen Augen ist“ und hier „was gut und richtig in deinen Augen ist“. Diese Wendungen bezeichnen die persönliche Einschätzung oder Entscheidung.
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische endet wörtlich: „dorthin zu gehen – geh!“ Diese Formulierung unterstreicht die Erlaubnis, frei zu wählen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִתַּחְתִּיךָ
  choice: habe ich dich … befreit
  rationale: פתח bedeutet wörtlich „öffnen“, bezeichnet hier mit der Person als Objekt und der anschließenden Trennung von den Fesseln jedoch eindeutig die Befreiung aus der Bindung.
- source_word: הָאזִקִּים אֲשֶׁר עַל־יָדֶךָ
  choice: die Fesseln an deinen Händen
  rationale: אֲזִקִּים sind die Fesseln eines Gefangenen. יָד kann Hand oder Arm einschließen; „an deinen Händen“ bewahrt die körperliche Bezeichnung, ohne unnötig „Handgelenke“ festzulegen.
- source_word: אִם־טוֹב בְּעֵינֶיךָ … וְאִם־רַע בְּעֵינֶיךָ
  choice: wenn du … kommen möchtest … wenn du aber nicht … kommen möchtest
  rationale: Die Wendungen „gut/schlecht in deinen Augen“ drücken hier Zustimmung beziehungsweise Ablehnung einer angebotenen Möglichkeit aus. „Möchtest“ gibt diese freie persönliche Entscheidung in natürlichem Deutsch wieder.
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  choice: ich werde für dich sorgen
  rationale: Wörtlich heißt die Wendung „ich werde mein Auge auf dich richten“. Im Zusammenhang verspricht der babylonische Befehlshaber wohlwollende Aufsicht, Fürsorge oder Schutz, nicht feindliche Überwachung.
- source_word: חֲדָל
  choice: dann lass es
  rationale: Der knappe Imperativ fordert dazu auf, von der unmittelbar zuvor genannten Reise abzusehen. „Dann lass es“ ergänzt das im Hebräischen vorausgesetzte Handlungsobjekt idiomatisch.
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  choice: das ganze Land liegt vor dir
  rationale: Die bildhafte Aussage bezeichnet die freie Wahl des Weges beziehungsweise Aufenthaltsortes und lässt sich im Deutschen nahezu formal entsprechend wiedergeben.
- source_word: אֶל־טוֹב וְאֶל־הַיָּשָׁר בְּעֵינֶיךָ
  choice: wohin es dir gut und richtig erscheint
  rationale: Die Übersetzung erhält sowohl טוֹב „gut“ als auch יָשָׁר „richtig/gerade“ und verbindet sie natürlich mit der Wahl eines Zielortes.
- source_word: לָלֶכֶת שָׁמָּה לֵךְ
  choice: Geh
  rationale: Die Verbindung aus Infinitiv und abschließendem Imperativ verstärkt die Erlaubnis zu gehen. Im Haupttext trägt der direkte Imperativ diese Kraft; die hebräische Form wird in einer Fußnote dokumentiert.
theological_decisions:
- issue: Bedeutung des auf die Person gerichteten Auges
  choice: wohlwollende Fürsorge im Haupttext
  alternative: neutrale oder kontrollierende Beobachtung
  rationale: Im Angebot des Befehlshabers an den gerade freigelassenen Jeremia weist die Redewendung auf persönliche Fürsorge oder Schutz. Die Fußnote bewahrt dennoch das konkrete hebräische Bild, ohne daraus eine weitergehende theologische Zusage zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. „Sieh“ wahrt den auffordernden Diskursmarker הִנֵּה/רְאֵה, ohne das heute altertümliche „siehe“ zu verwenden. „Babylon“ ist die geläufige moderne Ortsbezeichnung. Die wiederholte hebräische Augen-Wendung wird im Haupttext idiomatisch und in den Fußnoten transparent wiedergegeben.
