source:
  edition: WLC
  text: וְ/גַ֣ם כָּֽל הַ/יְּהוּדִ֡ים אֲשֶׁר בְּ/מוֹאָ֣ב וּ/בִ/בְנֵֽי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וַ/אֲשֶׁ֤ר בְּ/כָל הָֽ/אֲרָצוֹת֙ שָֽׁמְע֔וּ כִּֽי נָתַ֧ן מֶֽלֶךְ בָּבֶ֛ל שְׁאֵרִ֖ית לִֽ/יהוּדָ֑ה וְ/כִי֙ הִפְקִ֣יד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: de
  text: Auch alle Judäer, die in Moab, unter den Ammonitern, in Edom und in allen Ländern waren, hörten, dass der König von Babylon Juda einen Rest[a] gelassen und Gedalja, den Sohn Ahikams, des Sohnes Schafans, über sie eingesetzt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Überlebende«. Das hebräische Wort kann allgemein Menschen bezeichnen, die nach einer Katastrophe am Leben geblieben sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Auch
  rationale: Gibt die additive Fortführung der Erzählung knapp und natürlich wieder.
- source_word: כָּל הַיְּהוּדִים
  choice: alle Judäer
  rationale: Im territorialen und exilischen Zusammenhang bezeichnet der Ausdruck Menschen aus Juda; „Judäer“ vermeidet eine vorschnelle Ausweitung auf die spätere religiös-ethnische Bedeutung von „Juden“.
- source_word: אֲשֶׁר בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדֹם וַאֲשֶׁר בְּכָל הָאֲרָצוֹת
  choice: die in Moab, unter den Ammonitern, in Edom und in all den anderen Ländern lebten
  rationale: „Unter den Ammonitern“ gibt den Volksgruppennamen בְּנֵי עַמּוֹן idiomatisch wieder. „Andere“ verdeutlicht, dass die allgemeine Wendung die zuvor genannten Gebiete erweitert; „lebten“ ergänzt im Deutschen natürlich das im Hebräischen elliptische Ortsverhältnis.
- source_word: שָׁמְעוּ
  choice: hörten
  rationale: Bewahrt die einfache Bedeutung des Verbs als Empfang einer Nachricht.
- source_word: כִּי נָתַן מֶלֶךְ בָּבֶל שְׁאֵרִית לִיהוּדָה
  choice: dass der König von Babylon für Juda einen Rest übrig gelassen hatte
  rationale: נָתַן wird im Kontext idiomatisch als Zurücklassen verstanden. „Rest“ wahrt die mögliche prophetisch-theologische Resonanz von שְׁאֵרִית, ohne sie auszudeuten.
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  choice: und ... über sie eingesetzt hatte
  rationale: Der Hifil bezeichnet hier die Einsetzung in eine Leitungs- oder Verwaltungsstellung.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: Gedalja, den Sohn Ahikams und Enkel Schafans
  rationale: Die Abstammungskette bleibt vollständig erhalten; „Enkel“ ist im Deutschen natürlicher und macht die Beziehung eindeutig.
theological_decisions:
- issue: Wiedergabe von שְׁאֵרִית
  choice: Rest
  alternative: Überlebende
  rationale: „Rest“ erhält die lexikalische und kanonische Resonanz des prophetischen Schlüsselbegriffs. Da das Wort im unmittelbaren Kontext zugleich schlicht die nach der Katastrophe Übriggebliebenen bezeichnen kann, wird diese Bedeutung in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, wird aber durch idiomatische Ortsangaben und die Wiedergabe der Genealogie mit „Enkel“ natürlich lesbar gehalten.
