- from: Auch alle Judäer, die in Moab, unter den Ammonitern, in Edom und in all den anderen Ländern lebten, hörten, dass der König von Babylon für Juda einen Rest[a] übrig gelassen und Gedalja, den Sohn Ahikams und Enkel Schafans, über sie eingesetzt hatte.
  to: Auch alle Judäer, die in Moab, unter den Ammonitern, in Edom und in allen Ländern waren, hörten, dass der König von Babylon Juda einen Rest[a] gelassen und Gedalja, den Sohn Ahikams, des Sohnes Schafans, über sie eingesetzt hatte.
