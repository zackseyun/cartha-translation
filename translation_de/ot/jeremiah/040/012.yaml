- from: Da kehrten alle Judäer aus all den Orten zurück, wohin sie vertrieben worden waren[a]. Sie kamen in das Land Juda zu Gedalja nach Mizpa und brachten sehr viel Wein und Sommerfrüchte[b] ein.
  to: Da kehrten alle Judäer aus all den Orten zurück, in die sie vertrieben worden waren[a]. Sie kamen in das Land Juda, zu Gedalja nach Mizpa, und sammelten sehr viel Wein und Sommerfrüchte[b] ein.
  rationale: Die Richtungsbeziehung der Vertreibung wird mit „in die“ korrekt und idiomatisch wiedergegeben. „Sammelten … ein“ entspricht dem neutralen Sinn von אסף besser als das potenziell stärker erntebezogene „brachten … ein“. Die inhaltliche Aussage, der Registerton und die vorhandenen Fußnotenanker bleiben erhalten.
