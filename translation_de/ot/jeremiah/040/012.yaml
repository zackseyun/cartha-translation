  - severity: low
    issue: „brachten … Wein … ein“
    rationale: אסף ist neutral „sammeln“. Bei Wein kann „einbringen“ im Deutschen besonders an das Einbringen einer Ernte denken lassen; „sammelten … ein“ bewahrt die offene Bedeutung und passt zu Wein und Sommerfrüchten gleichermaßen.
