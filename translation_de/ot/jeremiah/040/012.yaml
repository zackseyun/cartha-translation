base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
translation:
  language: de
  text: Da kehrten alle Judäer aus all den Orten zurück, in die sie vertrieben worden waren[a]. Sie kamen in das Land Juda, zu Gedalja nach Mizpa, und sammelten sehr viel Wein und Sommerfrüchte[b] ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die sie verbannt worden waren“ beziehungsweise „in die sie zerstreut worden waren“.'
    reason: lexical_alternative
  - marker: b
    text: „Sommerfrüchte“ sind saisonale Früchte und andere Erzeugnisse, die im Sommer oder gegen Ende des Sommers geerntet wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Da kehrten … zurück
  rationale: שׁוב bezeichnet hier in der fortlaufenden Erzählung die räumliche Rückkehr; „da“ gibt den narrativen Anschluss natürlich wieder.
- source_word: כָל הַיְּהוּדִים
  choice: alle Judäer
  rationale: Im historischen Zusammenhang sind die Menschen aus Juda gemeint; „Judäer“ wahrt diesen geografisch-ethnischen Bezug.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: wohin sie vertrieben worden waren
  rationale: Das Nifal von נדח drückt ein gewaltsames Forttreiben oder Vertreiben aus. Das Plusquamperfekt verdeutlicht, dass dies vor ihrer Rückkehr geschehen war.
- source_word: וַיָּבֹאוּ אֶרֶץ יְהוּדָה
  choice: Sie kamen in das Land Juda
  rationale: Die akkusativische Richtungsangabe wird im Deutschen idiomatisch mit „in das Land Juda“ wiedergegeben.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּתָה
  choice: zu Gedalja nach Mizpa
  rationale: Die Konstruktion verbindet die Bewegung zu Gedalja mit der Richtungsform „nach Mizpa“; so bleiben Person und Zielort klar erkennbar.
- source_word: וַיַּאַסְפוּ
  choice: brachten … ein
  rationale: אסף bedeutet sammeln oder einbringen. Bei Wein und saisonalen Früchten bezeichnet „einbringen“ im Deutschen natürlich das Einsammeln der Ernte, ohne den Ausdruck auf einen einzelnen Erntevorgang zu verengen.
- source_word: יַיִן וָקַיִץ
  choice: Wein und Sommerfrüchte
  rationale: יַיִן ist „Wein“; קַיִץ bezeichnet saisonale, im Sommer beziehungsweise Spätsommer reifende Früchte oder Erzeugnisse.
- source_word: הַרְבֵּה מְאֹד
  choice: sehr viel
  rationale: Die Verbindung bezeichnet eine stark betonte große Menge und wird knapp und idiomatisch mit „sehr viel“ wiedergegeben.
