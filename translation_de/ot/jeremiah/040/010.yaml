  text: וַ/אֲנִ֗י הִנְ/נִ֤י יֹשֵׁב֙ בַּ/מִּצְפָּ֔ה לַֽ/עֲמֹד֙ לִ/פְנֵ֣י הַ/כַּשְׂדִּ֔ים אֲשֶׁ֥ר יָבֹ֖אוּ אֵלֵ֑י/נוּ וְ/אַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְ/קַ֜יִץ וְ/שֶׁ֗מֶן וְ/שִׂ֨מוּ֙ בִּ/כְלֵי/כֶ֔ם וּ/שְׁב֖וּ בְּ/עָרֵי/כֶ֥ם אֲשֶׁר תְּפַשְׂתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
translation:
  language: de
  text: Ich selbst bleibe in Mizpa, um vor den Chaldäern[a] zu stehen[b], die zu uns kommen werden. Ihr aber sammelt Wein, Sommerfrüchte und Öl, tut sie in eure Gefäße und wohnt in den Städten, die ihr in Besitz genommen habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babyloniern“. „Chaldäer“ ist die direkte Wiedergabe der hebräischen Bezeichnung; im Kontext kann damit die babylonische Macht gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: „Vor ihnen zu stehen“ kann hier auch bedeuten, ihnen gegenüber in amtlicher Funktion aufzutreten oder ihnen zu dienen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: Ich aber
  rationale: וַאֲנִי hebt den Sprecher kontrastiv hervor. הִנְנִי verstärkt seine gegenwärtige Selbstverpflichtung; im natürlichen Deutschen wird diese hier durch die nachfolgende Aussage hinreichend getragen, ohne ein unidiomatisches „siehe, ich“.
- source_word: יֹשֵׁב
  choice: bleibe
  rationale: Das Partizip von ישׁב bezeichnet hier den fortdauernden Aufenthalt in Mizpa, nicht eine sitzende Körperhaltung.
- source_word: לַעֲמֹד לִפְנֵי
  choice: um vor … zu stehen
  rationale: Die hebräische Wendung bleibt bewusst erhalten; sie kann neben dem wörtlichen Auftreten auch amtliches Dienen oder Vertreten bezeichnen.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Dies gibt die hebräische Volksbezeichnung direkt wieder; im Kontext sind damit die Babylonier beziehungsweise die babylonische Staatsmacht gemeint.
- source_word: אֲשֶׁר יָבֹאוּ אֵלֵינוּ
  choice: die zu uns kommen werden
  rationale: Das Imperfekt bezeichnet hier plausibel das erwartete künftige Kommen der chaldäischen Amtsträger.
- source_word: אִסְפוּ
  choice: sammelt
  rationale: Der Imperativ fordert zum Einbringen beziehungsweise Zusammentragen der genannten Erzeugnisse auf.
- source_word: קַיִץ
  choice: Sommerfrüchte
  rationale: Der Ausdruck bezeichnet saisonale Sommerfrucht beziehungsweise Sommererzeugnisse, häufig insbesondere Feigen, ohne dass die Fruchtart hier festgelegt wird.
- source_word: שִׂימוּ בִּכְלֵיכֶם
  choice: füllt sie in eure Gefäße
  rationale: כְּלִי ist ein allgemeiner Ausdruck für Behältnisse. „Gefäße“ ist würdig und hinreichend unspezifisch; „füllen“ gibt die gemeinte Einlagerung natürlich wieder.
- source_word: וּשְׁבוּ
  choice: wohnt
  rationale: ישׁב bezeichnet hier das dauerhafte Wohnen beziehungsweise Ansiedeln in den Städten.
- source_word: תְּפַשְׂתֶּם
  choice: in Besitz genommen habt
  rationale: תפשׂ bezeichnet das Ergreifen und Inbesitznehmen. Die Formulierung wahrt dies, ohne zwingend eine bestimmte Art militärischer Eroberung vorauszusetzen.
theological_decisions:
- issue: Amtliche Bedeutung von לַעֲמֹד לִפְנֵי
  choice: Die offene Wendung „vor den Chaldäern zu stehen“ bleibt im Haupttext erhalten.
  alternative: „sie zu vertreten“ oder „ihnen zu Diensten zu stehen“
  rationale: Der Kontext legt eine amtliche Mittler- oder Repräsentationsfunktion Gedaljas nahe, doch der hebräische Ausdruck legt die genaue Funktion nicht eindeutig fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der kontrastive Aufbau zwischen „Ich aber“ und „Ihr jedoch“ wird bewahrt. Die genuine Bedeutungsweite der amtlichen Wendung wird nicht im Haupttext vereindeutigt.
