base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
translation:
  language: de
  text: Und Jochanan, der Sohn Kareachs, und alle Heerführer, die sich im offenen Land befanden[a], kamen zu Gedalja nach Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die im Feld waren“. Der hebräische Ausdruck kann Feld, freies Land oder allgemeiner ländliches Gebiet bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן בֶּן קָרֵחַ
  choice: Und Jochanan, der Sohn Kareachs
  rationale: Das einfache וְ führt die Erzählung mit „Und“ fort. Die hebräische Vatersangabe wird im Deutschen natürlich mit „der Sohn Kareachs“ wiedergegeben.
- source_word: וְ/כָל שָׂרֵי הַ/חֲיָלִים
  choice: und alle Heerführer
  rationale: שָׂרֵי bezeichnet militärische Führer, während חֲיָלִים hier die Streitkräfte meint. „Heerführer“ gibt die Funktion knapp und in würdigem modernem Deutsch wieder.
- source_word: אֲשֶׁר בַּ/שָּׂדֶה
  choice: die sich auf dem offenen Land befanden
  rationale: שָׂדֶה kann ein Feld oder allgemeiner das offene Land außerhalb einer Ortschaft bezeichnen. Die Formulierung wahrt diesen räumlichen Sinn; die engere Wiedergabe steht in der Fußnote.
- source_word: בָּ֥אוּ אֶל גְּדַלְיָ֖הוּ
  choice: kamen zu Gedalja
  rationale: בוא bezeichnet hier die Bewegung auf Gedalja zu; אֶל markiert ihn als Ziel.
- source_word: הַ/מִּצְפָּתָ/ה
  choice: nach Mizpa
  rationale: Das direktionale ה bezeichnet eine Bewegung nach Mizpa. „Nach Mizpa“ bildet diese Richtungsangabe unmittelbar ab.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die doppelte Zielangabe „zu Gedalja nach Mizpa“ bewahrt sowohl die Person als Ziel der Bewegung als auch das direktionale Element des Ortsnamens.
