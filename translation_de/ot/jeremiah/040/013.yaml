  source_fidelity: 'Die Satzstruktur und die wesentlichen Bedeutungen werden zutreffend wiedergegeben: Jochanan wird mit seinem Vatersnamen genannt, die militärischen Führer werden eingeschlossen, und ihre Bewegung zu Gedalja in Richtung Mizpa wird erhalten. Die Richtungsform des Ortsnamens kann im Deutschen sinnvoll mit „nach Mizpa“ wiedergegeben werden.'
