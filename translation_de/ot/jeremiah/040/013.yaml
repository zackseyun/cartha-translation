  terminology: „Jochanan“, „Kareach“, „Gedalja“ und „Mizpa“ sind als deutsche Bibeltransliterationen vertretbar. „Heerführer“ gibt שָׂרֵי הַחֲיָלִים angemessen wieder. Die Fußnote sollte grammatisch und idiomatisch präziser formuliert werden; der hebräische Ausdruck bezeichnet nicht einfach „ein Feld oder die Felder“, sondern kann je nach Kontext Feld, freies Land oder ländliches Gebiet meinen.
