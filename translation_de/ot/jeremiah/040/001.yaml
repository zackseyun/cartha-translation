  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה אַחַ֣ר שַׁלַּ֣ח אֹת֗/וֹ נְבוּזַרְאֲדָ֛ן רַב טַבָּחִ֖ים מִן הָֽ/רָמָ֑ה בְּ/קַחְתּ֣/וֹ אֹת֗/וֹ וְ/הֽוּא אָס֤וּר בָּֽ/אזִקִּים֙ בְּ/ת֨וֹךְ כָּל גָּל֤וּת יְרוּשָׁלִַ֨ם֙ וִֽ/יהוּדָ֔ה הַ/מֻּגְלִ֖ים בָּבֶֽלָ/ה־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
translation:
  language: de
  text: 'Das Wort, das von Jahwe an Jeremia erging, nachdem Nebusaradan, der Befehlshaber der Leibwache[a], ihn aus Rama entlassen hatte, als er ihn mitten unter all den Weggeführten aus Jerusalem und Juda, die nach Babylon verschleppt wurden, in Ketten gefesselt genommen hatte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Oberste der Schlächter“ oder „der Oberste der Henker“; gemeint ist wahrscheinlich ein hoher königlicher Wachbeamter, zu dessen Aufgaben auch Hinrichtungen gehörten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל־יִרְמְיָהוּ מֵאֵת יְהוָה
  choice: Das Wort, das von Jahwe an Jeremia erging
  rationale: Die prophetische Offenbarungsformel wird mit „das Wort“ und dem im Deutschen idiomatischen „erging an“ wiedergegeben; מֵאֵת bezeichnet Jahwe als Ursprung.
- source_word: אַחַר שַׁלַּח אֹתוֹ
  choice: nachdem … ihn … entlassen hatte
  rationale: שׁלח bezeichnet hier angesichts des Kontextes das Freilassen beziehungsweise Entlassen Jeremias; das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: רַב טַבָּחִים
  choice: Befehlshaber der Leibwache
  rationale: Der babylonische Amtstitel bezeichnet einen hohen königlichen Beamten mit Wach- und Hinrichtungsaufgaben. Die idiomatische Amtsbezeichnung steht im Text, die wörtlichere Bedeutung in der Fußnote.
- source_word: בְּקַחְתּוֹ אֹתוֹ
  choice: Nebusaradan hatte ihn in Gewahrsam genommen
  rationale: לקח bedeutet grundsätzlich „nehmen“; „in Gewahrsam nehmen“ passt zur anschließenden Schilderung Jeremias in Fesseln. Der Name wird zur Klärung des im Hebräischen nur pronominal bezeichneten Subjekts wiederholt.
- source_word: וְהוּא אָסוּר בָּאזִקִּים
  choice: als er gefesselt … war
  rationale: Die Zustandskonstruktion beschreibt Jeremias Lage bei seiner Ingewahrsamnahme. „Gefesselt“ gibt sowohl אָסוּר als auch die Funktion der Fesseln natürlich und ohne unnötige Doppelung wieder.
- source_word: בְּתוֹךְ כָּל גָּלוּת יְרוּשָׁלִַם וִיהוּדָה
  choice: mitten unter all den Weggeführten aus Jerusalem und Juda
  rationale: גָּלוּת bezeichnet hier kollektiv die deportierte Bevölkerung; „Weggeführte“ bewahrt den Zusammenhang mit dem folgenden Partizip und bleibt im Deutschen verständlich.
- source_word: הַמֻּגְלִים בָּבֶלָה
  choice: die nach Babylon verschleppt wurden
  rationale: Das passive Partizip bezeichnet die laufende beziehungsweise angeordnete Deportation. „Verschleppt“ macht den erzwungenen Charakter deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass die konkrete Benennung Gottes im hebräischen Text erhalten bleibt.
- issue: Bezug des pronominalen Subjekts in בְּקַחְתּוֹ
  choice: Nebusaradan als Subjekt
  alternative: unbestimmter oder anderer Handelnder
  rationale: Das nächstliegende maskuline Subjekt ist Nebusaradan. Die Übersetzung macht diesen syntaktischen Bezug deutlich, ohne eine zusätzliche handelnde Person einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange hebräische Konstruktion ist zur besseren Verständlichkeit in zwei Sätze gegliedert; der abschließende Doppelpunkt zeigt weiterhin an, dass die angekündigte Botschaft in den folgenden Versen beginnt.
