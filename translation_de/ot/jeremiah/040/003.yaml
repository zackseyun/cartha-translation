  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
translation:
  language: de
  text: Und Jahwe hat es eintreffen lassen und getan, wie er gesagt hatte. Denn ihr habt gegen Jahwe gesündigt und nicht auf seine Stimme gehört[a]; darum ist euch dies widerfahren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Stimme nicht gehorcht“. Die hebräische Wendung „auf seine Stimme hören“ schließt häufig den Gedanken des Gehorsams ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „darum ist dieses Unheil über euch gekommen“. Das hebräische „dies“ bezeichnet im Zusammenhang wahrscheinlich das zuvor geschilderte Unheil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: hat es kommen lassen
  rationale: Die Hifil-Form von בוא bezeichnet hier, dass Jahwe das zuvor angekündigte Geschehen eintreten ließ. Das im Hebräischen nicht ausdrücklich genannte Objekt wird im Deutschen durch „es“ aus dem Zusammenhang aufgenommen.
- source_word: וַיַּעַשׂ
  choice: hat … gehandelt
  rationale: עשה bedeutet grundsätzlich „tun, machen, handeln“. „Gehandelt“ ergibt zusammen mit „wie er gesagt hatte“ eine natürliche deutsche Formulierung und bewahrt den Gedanken, dass Jahwe sein angekündigtes Gericht vollzogen hat.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: genauso …, wie er gesagt hatte
  rationale: Die Formulierung betont die genaue Erfüllung des zuvor gesprochenen Wortes. Das Plusquamperfekt macht im Deutschen deutlich, dass die Ankündigung dem eingetretenen Geschehen vorausging.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für das Gericht ein. „Denn“ verbindet die Aussage natürlich mit dem vorhergehenden Satz.
- source_word: חֲטָאתֶם לַיהוָה
  choice: ihr habt gegen Jahwe gesündigt
  rationale: Die Präposition ל wird bei חטא kontextgemäß mit „gegen“ wiedergegeben, da Jahwe derjenige ist, gegen den sich die Sünde richtet.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלוֹ
  choice: und nicht auf seine Stimme gehört
  rationale: Die hebräische Wendung שׁמע בקול bezeichnet sowohl Hören als auch gehorsames Befolgen. Die deutsche Wendung „auf seine Stimme hören“ bewahrt dieses Bedeutungsspektrum.
- source_word: וְהָיָה לָכֶם דבר הַזֶּה
  choice: darum ist euch dies widerfahren
  rationale: Die Formulierung gibt die resultative Aussage idiomatisch wieder. „Dies“ lässt den Bezug wie das breite hebräische דבר offen, während „widerfahren“ ausdrückt, dass das angekündigte Geschehen über die Angeredeten kam.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration bewahrt den persönlichen Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע בקולו
  choice: auf seine Stimme gehört
  alternative: seiner Stimme gehorcht
  rationale: Die Wendung schließt Gehorsam ein, doch die gewählte Fassung erhält zugleich das konkrete Bild des Hörens und legt die Nuance nicht unnötig auf nur einen deutschen Begriff fest.
- issue: Bestimmung von דבר הזה
  choice: dies
  alternative: dieses Unheil
  rationale: Im Zusammenhang ist das Gericht beziehungsweise Unheil gemeint; דבר selbst ist jedoch breiter. „Dies“ bewahrt die Offenheit des Ausdrucks, während die Fußnote die kontextuell engere Deutung nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine überlange Satzperiode. „Jahwe“ bewahrt den Gottesnamen; „auf seine Stimme gehört“ erhält die hebräische Bildsprache, und „dies“ lässt die lexikalische Breite von דבר bestehen.
