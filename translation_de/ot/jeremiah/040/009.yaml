source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֜ם גְּדַלְיָ֨הוּ בֶן אֲחִיקָ֤ם בֶּן שָׁפָן֙ וּ/לְ/אַנְשֵׁי/הֶ֣ם לֵ/אמֹ֔ר אַל תִּֽירְא֖וּ מֵ/עֲב֣וֹד הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
translation:
  language: de
  text: 'Gedalja, der Sohn Ahikams, des Sohnes Schafans, schwor ihnen und ihren Männern: »Habt keine Angst davor, den Chaldäern[a] zu dienen. Bleibt im Land und dient dem König von Babel; dann wird es euch gut gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den Babyloniern. Im Hebräischen steht »Chaldäer«, eine Bezeichnung, die häufig für die babylonische Herrschaftsmacht gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Nifal von שׁבע bezeichnet hier das Ablegen eines Eides. „Schwor“ ist knapp, natürlich und bewahrt die Verbindlichkeit der Aussage.
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  choice: ihnen und ihren Männern
  rationale: אַנְשֵׁי bezeichnet die ihnen zugehörigen Männer beziehungsweise Gefolgsleute. „Ihren Männern“ bewahrt die Offenheit, ohne sie ausdrücklich als Soldaten festzulegen.
- source_word: לֵאמֹר
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: Das hebräische quotative „indem er sagte“ wird im natürlichen modernen Deutsch durch einen Doppelpunkt wiedergegeben, ohne seinen Zweck zu verlieren.
- source_word: אַל תִּירְאוּ מֵעֲבֹד
  choice: Habt keine Angst davor, ... zu dienen
  rationale: Die Konstruktion mit מן nach „sich fürchten“ wird als „Angst davor haben“ wiedergegeben; der Infinitiv bleibt inhaltlich eng am Hebräischen.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Der hebräische ethnisch-politische Ausdruck wird im Haupttext beibehalten; die im Kontext gemeinte babylonische Herrschaft wird in einer Fußnote erläutert.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Bleibt im Land
  rationale: ישׁב kann wohnen, bleiben oder sich niederlassen bedeuten. Im Zusammenhang der Aufforderung, das Land nicht zu verlassen, trifft „Bleibt“ den Sinn natürlich, ohne eine dauerhafte Ansiedlung stärker zu behaupten als der Text.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: und dient dem König von Babel
  rationale: עבד bezeichnet hier politische Unterordnung beziehungsweise Dienst. „Dient“ erhält diese Bedeutung; בָּבֶל wird mit der traditionellen deutschen Ortsbezeichnung „Babel“ wiedergegeben.
- source_word: וְיִיטַב לָכֶם
  choice: dann wird es euch gut gehen
  rationale: Die Wendung beschreibt einen günstigen Ausgang. „Dann“ macht den resultativen Zusammenhang im Deutschen natürlich deutlich.
