translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der schwer verständliche Versanfang wird lesbar formuliert und durch eine Fußnote als unsicher gekennzeichnet. Der im Hebräischen nicht erneut genannte Sprecher wird zur Klarheit als Nebusaradan identifiziert; der unmittelbare Kontext und der Amtstitel im zweiten Satz machen diese Referenz eindeutig. Die hebräische Bildformel „richtig in deinen Augen“ wird zugunsten natürlichen Deutschen leicht geglättet.
