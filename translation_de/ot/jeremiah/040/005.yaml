source:
  edition: WLC
  text: וְ/עוֹדֶ֣/נּוּ לֹֽא יָשׁ֗וּב וְ/שֻׁ֡בָ/ה אֶל גְּדַלְיָ֣ה בֶן אֲחִיקָ֣ם בֶּן שָׁפָ֡ן אֲשֶׁר֩ הִפְקִ֨יד מֶֽלֶךְ בָּבֶ֜ל בְּ/עָרֵ֣י יְהוּדָ֗ה וְ/שֵׁ֤ב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם א֠וֹ אֶל כָּל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֖כֶת לֵ֑ךְ וַ/יִּתֶּן ל֧/וֹ רַב טַבָּחִ֛ים אֲרֻחָ֥ה וּ/מַשְׂאֵ֖ת וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
translation:
  language: de
  text: 'Da er aber noch nicht zurückgekehrt war,[a] sagte Nebusaradan: „Kehre zu Gedalja, dem Sohn Ahikams, des Sohnes Schafans, zurück. Der König von Babylon hat ihn über die Städte Judas eingesetzt. Bleib bei ihm mitten unter dem Volk, oder geh, wohin du es für richtig hältst.“ Darauf gab ihm der Oberste der Leibwache Wegzehrung[b] und ein Geschenk[c] und entließ ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Versanfang ist schwierig und elliptisch. Möglich ist auch: „Während er noch nicht zurückgekehrt war: Kehre zu Gedalja … zurück.“'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Verpflegung“ beziehungsweise „Rationen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „eine Gabe“, „einen Unterhalt“ oder „einen Anteil“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  choice: Da er aber noch nicht zurückkehren wollte
  rationale: Die schwierige und elliptische Anfangsklausel besagt im Zusammenhang am ehesten, dass Jeremia weiterhin nicht zurückkehrte. „Wollte“ macht die naheliegende voluntative Nuance im Deutschen verständlich, ohne sie als völlig sicher auszugeben; die Fußnote wahrt die syntaktische Alternative.
- source_word: וְשֻׁבָה
  choice: Dann kehre ... zurück
  rationale: Der Imperativ von שוב fordert Jeremia auf, zu Gedalja zurückzukehren. „Dann“ gibt den elliptischen Übergang natürlich wieder.
- source_word: אֶל גְּדַלְיָה בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: zu Gedalja, dem Sohn Ahikams, des Sohnes Schafans
  rationale: Die Abstammungsangaben werden vollständig und in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בְּעָרֵי יְהוּדָה
  choice: Der König von Babylon hat ihn über die Städte Judas eingesetzt
  rationale: Das Hifil von פקד bezeichnet hier die Einsetzung in ein Verwaltungsamt; „über“ drückt Zuständigkeit statt bloßer Ortsangabe aus.
- source_word: וְשֵׁב אִתּוֹ בְּתוֹךְ הָעָם
  choice: Bleib bei ihm mitten unter dem Volk
  rationale: ישב kann „wohnen“, „bleiben“ oder „sich niederlassen“ bedeuten. „Bleib“ passt zur angebotenen Aufenthaltsmöglichkeit und bewahrt den Gedanken des Verweilens.
- source_word: אוֹ אֶל כָּל הַיָּשָׁר בְּעֵינֶיךָ לָלֶכֶת לֵךְ
  choice: oder geh, wohin zu gehen dir richtig erscheint
  rationale: Die hebräische Wendung „richtig in deinen Augen“ wird in idiomatischem Deutsch wiedergegeben, während die subjektive Entscheidungsfreiheit erhalten bleibt.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Der Amtstitel bezeichnet Nebusaradans hohe militärische beziehungsweise höfische Stellung. „Oberster der Leibwache“ ist präzise und vermeidet die missverständliche wörtliche Wiedergabe „Oberster der Schlächter“.
- source_word: אֲרֻחָה
  choice: Wegzehrung
  rationale: Das Substantiv bezeichnet eine Verpflegung oder Ration. Im Kontext der Entlassung und bevorstehenden Reise ist „Wegzehrung“ konkret und natürlich.
- source_word: וּמַשְׂאֵת
  choice: ein Geschenk
  rationale: Das Wort kann eine Gabe, einen Anteil oder etwas Mitgegebenes bezeichnen. Neben der Wegzehrung liegt eine zusätzliche Gabe nahe; die Bedeutungsbreite wird in der Fußnote vermerkt.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: und entließ ihn
  rationale: Das Verb bezeichnet hier das Freilassen beziehungsweise Fortschicken Jeremias. „Entließ ihn“ passt zum Kontext seiner Freigabe.
