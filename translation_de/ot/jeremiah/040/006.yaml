base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
translation:
  language: de
  text: Da ging Jeremia zu Gedalja, dem Sohn Ahikams, nach Mizpa und lebte bei ihm unter dem Volk, das im Land zurückgeblieben war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das im Land übrig geblieben war“. Das hebräische Wort kann sowohl das Verbleiben als auch das Zurückgelassensein bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ging
  rationale: בוא bezeichnet hier Jeremias Bewegung zu Gedalja; „ging“ entspricht der natürlichen deutschen Erzählperspektive.
- source_word: הַמִּצְפָּתָה
  choice: nach Mizpa
  rationale: Die Ortsbezeichnung mit direktionaler Endung bezeichnet das Ziel der Bewegung. Die Umstellung „nach Mizpa zu Gedalja“ gibt dies im Deutschen klar und natürlich wieder.
- source_word: וַיֵּשֶׁב
  choice: lebte
  rationale: ישב bezeichnet in diesem Zusammenhang das Wohnen beziehungsweise den Aufenthalt in einer Gemeinschaft; „lebte“ ist natürlich und lässt die genaue Dauer offen.
- source_word: בְּתוֹךְ הָעָם
  choice: unter dem Volk
  rationale: Die Wendung bezeichnet Jeremias Leben innerhalb der dortigen Bevölkerung; „unter dem Volk“ bewahrt den kollektiven Ausdruck הָעָם.
- source_word: הַנִּשְׁאָרִים בָּאָרֶץ
  choice: das im Land zurückgeblieben war
  rationale: Das Niphal-Partizip von שׁאר beschreibt diejenigen, die im Land verblieben beziehungsweise dort zurückgelassen worden waren. Der deutsche Relativsatz stimmt grammatisch mit dem kollektiven Singular „Volk“ überein und bewahrt die mögliche Bedeutungsnuance.
theological_decisions:
- issue: Mögliche theologische Überdeutung von הַנִּשְׁאָרִים als feststehender Begriff für einen „Rest“
  choice: das im Land zurückgeblieben war
  alternative: der Rest im Land
  rationale: Der hebräische Text verwendet ein Partizip und keinen ausdrücklich substantivischen oder technischen Rest-Begriff. Die beschreibende Wiedergabe vermeidet zusätzliche theologische Festlegungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde leicht angepasst, damit das Bewegungsziel „nach Mizpa“ und die Zielperson „zu Gedalja“ ohne schwerfällige Doppelung verständlich werden. Der Fußnotenmarker steht unmittelbar bei der betreffenden Wendung.
