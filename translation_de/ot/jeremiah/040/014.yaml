base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
translation:
  language: de
  text: 'Und sie sagten zu ihm: „Weißt du wirklich[a], dass Baalis, der König der Ammoniter, Ismael, den Sohn Netanjas, geschickt hat, um dir das Leben zu nehmen[b]?“ Doch Gedalja, der Sohn Ahikams, glaubte ihnen nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weißt du ganz sicher …?“ Im Hebräischen wird das Verb „wissen“ durch einen vorangestellten Infinitiv derselben Wurzel nachdrücklich verstärkt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung lautet wörtlich etwa: „dich hinsichtlich des Lebens zu schlagen“ und bedeutet, jemanden tödlich zu schlagen oder zu töten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדֹעַ תֵּדַע
  choice: Weißt du auch wirklich
  rationale: Die Verbindung aus Infinitivus absolutus und finiter Verbform verstärkt das Verb. „Auch wirklich“ gibt diese Hervorhebung in natürlichem, modernem Deutsch wieder, ohne Gewissheit stärker zu behaupten, als der hebräische Wortlaut verlangt.
- source_word: בַּעֲלִיס
  choice: Baalis
  rationale: Der Personenname wird in einer dem Hebräischen entsprechenden, im Deutschen gut lesbaren Form wiedergegeben.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: der König der Ammoniter
  rationale: Die wörtliche Konstruktion „König der Söhne Ammons“ bezeichnet idiomatisch den König des ammonitischen Volkes.
- source_word: שָׁלַח
  choice: geschickt hat
  rationale: Das deutsche Perfekt passt zur direkten Rede und hebt die gegenwärtige Bedeutung des bereits erteilten Auftrags hervor.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, den Sohn Netanjas
  rationale: Die Namen folgen gebräuchlichen deutschen Bibelformen; die Apposition macht das Abstammungsverhältnis klar und natürlich.
- source_word: לְהַכֹּתְךָ נָפֶשׁ
  choice: um dir das Leben zu nehmen
  rationale: Die hebräische Wendung bedeutet, jemanden zu töten. „Dir das Leben zu nehmen“ bewahrt den Bezug von נֶפֶשׁ auf das Leben und klingt im Deutschen natürlich.
- source_word: הֶאֱמִין לָהֶם
  choice: glaubte ihnen nicht
  rationale: Im Zusammenhang geht es darum, ob Gedalja ihre Warnung für wahr hielt; „ihnen glauben“ trifft dies genauer als das allgemeinere „ihnen vertrauen“.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Gedalja, der Sohn Ahikams
  rationale: Die Namen stehen in gebräuchlichen deutschen Bibelformen; die Abstammungsangabe wird als natürliche Apposition formuliert.
