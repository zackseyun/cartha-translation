id: JER.19.12
reference: Jeremiah 19:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֵּֽן אֶעֱשֶׂ֞ה לַ/מָּק֥וֹם הַ/זֶּ֛ה נְאֻם יְהוָ֖ה וּ/לְ/יֽוֹשְׁבָ֑י/ו וְ/לָ/תֵ֛ת אֶת הָ/עִ֥יר הַ/זֹּ֖את כְּ/תֹֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/012.yaml
  text: So I will do to this place[a], declares Yahweh, and to its inhabitants, making this city like Topheth.
translation:
  language: de
  text: So werde ich mit diesem Ort[a] und seinen Bewohnern verfahren – Ausspruch Jahwes – und diese Stadt wie Tofet machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tofet lag im Tal Ben-Hinnom und war mit Kinderopfern, später auch mit Entweihung und Gericht verbunden. Der Vergleich kündigt an, dass Jerusalem zu einem Ort des Schreckens und der Unreinheit werden wird.
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: So
  rationale: Leitet die Anwendung der vorausgehenden Zeichenhandlung und Gerichtsankündigung ein und bewahrt die folgernde Kraft.
- source_word: אֶעֱשֶׂה לַמָּקוֹם הַזֶּה
  choice: werde ich mit diesem Ort verfahren
  rationale: Das allgemeine עשה mit ל bezeichnet hier das Handeln an dem betroffenen Ort; „mit … verfahren“ ist im Deutschen natürlich und lässt die aus dem Kontext hervorgehende feindliche Wirkung bestehen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feste prophetische Botenformel würdig und quellennah wieder und bewahrt den Gottesnamen.
- source_word: וּלְיֹשְׁבָיו
  choice: und seinen Bewohnern
  rationale: Bezieht das angekündigte Handeln parallel zum Ort auch auf die dort lebenden Menschen.
- source_word: וְלָתֵת
  choice: und … machen
  rationale: Der Infinitiv mit ו und ל führt aus, worauf das angekündigte Handeln hinausläuft; die deutsche Koordination bleibt eng am hebräischen Satzbau.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Direkte Wiedergabe der bestimmten Nominalgruppe mit Demonstrativpronomen; gemeint ist im Kontext Jerusalem.
- source_word: כְּתֹפֶת
  choice: wie Tofet
  rationale: כ markiert einen Vergleich. Die übliche deutsche Namensform „Tofet“ bezeichnet den mit Opferkult, Entweihung und Gericht verbundenen Ort im Hinnomtal.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art des angekündigten Handelns
  choice: mit diesem Ort … verfahren
  alternative: diesem Ort antun
  rationale: Die Formulierung bewahrt die Breite von עשה und macht die Gerichtswirkung nicht genauer, als der Satz selbst es tut; der Kontext und der Vergleich mit Tofet verdeutlichen den Charakter des Handelns.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Feierlichkeit. Der Gedankenstrich hebt die eingeschobene Botenformel ab; Wortwahl und Satzbau bleiben verständlich, ohne die knappe Härte des Hebräischen zu glätten.
