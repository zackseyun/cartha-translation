  source_fidelity: 'Die Übersetzung bildet die Satzbewegung des Hebräischen zuverlässig ab: כֵּן als folgerndes „So“, die Ankündigung des Handelns an Ort und Bewohnern, die eingeschobene Botenformel sowie den Vergleich der Stadt mit Tofet. „Mit diesem Ort ... verfahren“ gibt die im Deutschen hier idiomatische, bewusst allgemein bleibende Wirkung von עשה mit ל wieder. „Wie Tofet machen“ bewahrt den Vergleich mit כ, ohne ihn übermäßig auszudeuten.'
  naturalness: Der Text ist verständliches modernes Standarddeutsch in angemessen knappem, prophetisch-feierlichem Register. Die Stellung von „Ausspruch Jahwes“ zwischen Gedankenstrichen ist klar und stilistisch tragfähig. Die leicht formelle Wendung „So werde ich ... verfahren“ passt zur Gattung.
  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Tofet“ ist eine etablierte deutsche Namensform. Die Fußnote erläutert den kulturellen Hintergrund sachlich und ohne den Vergleich über den Kontext hinaus dogmatisch festzulegen.
