source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָבֻ֗/נִי וַֽ/יְנַכְּר֞וּ אֶת הַ/מָּק֤וֹם הַ/זֶּה֙ וַ/יְקַטְּרוּ ב/וֹ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁ֧ר לֹֽא יְדָע֛וּ/ם הֵ֥מָּה וַ/אֲבֽוֹתֵי/הֶ֖ם וּ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מָֽלְא֛וּ אֶת הַ/מָּק֥וֹם הַ/זֶּ֖ה דַּ֥ם נְקִיִּֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/004.yaml
  text: Because they have forsaken me and made this place unrecognizable[a], and have burned incense in it to other gods whom neither they nor their fathers nor the kings of Judah had known, and they have filled this place with the blood of innocents[b],
translation:
  language: de
  text: Weil sie mich verlassen haben, diesen Ort zu etwas Fremdem gemacht und an diesem Ort anderen Göttern Räucheropfer dargebracht haben, die weder sie noch ihre Vorfahren noch die Könige von Juda gekannt hatten, und weil sie diesen Ort mit dem Blut Unschuldiger gefüllt haben,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Die Wendung leitet den Grund für das angekündigte Gericht ein; „weil“ gibt ihre kausale Funktion im modernen Deutsch klar wieder.
- source_word: עֲזָבֻנִי
  choice: sie mich verlassen
  rationale: עזב bezeichnet hier das Verlassen bzw. Aufgeben JHWHs und bewahrt in diesem Zusammenhang sein relationales und bundestheologisches Gewicht.
- source_word: וַיְנַכְּרוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: diesen Ort zu einem fremden Ort gemacht
  rationale: Das Piel von נכר vermittelt hier den Gedanken des Fremdmachens oder Entfremdens. Die Formulierung bewahrt dieses Bild, ohne es vorschnell als „entweihen“ auszulegen.
- source_word: וַיְקַטְּרוּ בוֹ
  choice: hier ... Räucheropfer dargebracht haben
  rationale: קטר bezeichnet in diesem kultischen Zusammenhang das Verbrennen von Räucherwerk bzw. das Darbringen von Rauchopfern. „Räucheropfer darbringen“ ist natürlich und hinreichend spezifisch.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Die einfache Wiedergabe entspricht dem hebräischen Ausdruck und vermeidet, die Fremdheitsvorstellung aus dem vorhergehenden Verb unnötig zu wiederholen.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: die ... nicht gekannt hatten
  rationale: ידע bezeichnet hier das Kennen bzw. Anerkennen im geschichtlichen und kultischen Sinn; das Plusquamperfekt entspricht dem Rückblick auf die bisherige Geschichte.
- source_word: הֵמָּה וַאֲבוֹתֵיהֶם וּמַלְכֵי יְהוּדָה
  choice: weder sie noch ihre Vorfahren noch die Könige von Juda
  rationale: Die dreigliedrige weder-noch-Fügung macht deutlich, dass die Verneinung für alle genannten Gruppen gilt. „Vorfahren“ ist im heutigen Deutsch inklusiver und natürlicher als „Väter“.
- source_word: וּמָלְאוּ אֶת־הַמָּקוֹם הַזֶּה
  choice: diesen Ort ... gefüllt haben
  rationale: Die Formulierung erhält das konkrete Bild des mit Blut angefüllten Ortes und fügt sich in die Reihe der begründenden Handlungen ein.
- source_word: דַּם נְקִיִּם
  choice: dem Blut Unschuldiger
  rationale: Die Genitivfügung gibt den hebräischen Plural mit persönlichem Bezug wieder und macht deutlich, dass das Blut unschuldigen Menschen gehört.
theological_decisions:
- issue: Bedeutung von נכר in der Anklage gegen „diesen Ort“
  choice: zu einem fremden Ort gemacht
  alternative: diesen Ort entweiht
  rationale: Der Grundsinn betrifft Fremdwerden bzw. Fremdmachen. „Entweiht“ ist im Kontext möglich, legt die kultische Folgerung jedoch stärker fest, als es das ungewöhnliche hebräische Bild selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt als Begründung grammatisch offen, da der Vers im folgenden Kontext weitergeführt wird. Das wiederholte „weil“ vor dem letzten Glied macht die lange deutsche Satzstruktur transparent, ohne die kausale Einheit aufzubrechen.
