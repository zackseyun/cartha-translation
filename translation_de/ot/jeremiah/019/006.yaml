source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יִקָּרֵא֩ לַ/מָּק֨וֹם הַ/זֶּ֥ה ע֛וֹד הַ/תֹּ֖פֶת וְ/גֵ֣יא בֶן הִנֹּ֑ם כִּ֖י אִם גֵּ֥יא הַ/הֲרֵגָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/006.yaml
  text: Therefore, look, days are coming, declares the LORD, when this place will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter.
translation:
  language: de
  text: Darum, seht, es kommen Tage, spricht der HERR, da wird dieser Ort nicht mehr Tofet und Tal Ben-Hinnom heißen, sondern Tal des Schlachtens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Gerichtswort knapp und natürlich wieder.
- source_word: הִנֵּה
  choice: seht
  rationale: Bewahrt das aufmerksamkeitslenkende Element des hebräischen Ausdrucks in idiomatischem Deutsch.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Verwendet die im deutschen Bibelstil geläufige Wiedergabe der prophetischen Botenformel und kennzeichnet den Gottesnamen durch Kapitälchenschreibung.
- source_word: הַתֹּפֶת
  choice: Tofet
  rationale: Der Ortsname wird als Eigenname transliteriert und nicht etymologisierend gedeutet.
- source_word: גֵיא בֶן הִנֹּם
  choice: Tal Ben-Hinnom
  rationale: Bewahrt die traditionelle Form des Ortsnamens; Ben-Hinnom fungiert als Eigenname.
- source_word: גֵּיא הַהֲרֵגָה
  choice: Tal des Schlachtens
  rationale: Gibt das gewaltsame Töten des Nomens הֲרֵגָה konkret wieder und erhält den Kontrast zur bisherigen Ortsbezeichnung.
theological_decisions:
- issue: Wiedergabe des Tetragramms
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Ersatzlesung wird transparent durch Kapitälchen markiert, ohne eine unsichere Aussprache festzulegen.
- issue: Verknüpfung der beiden bisherigen Ortsnamen
  choice: Tofet und Tal Ben-Hinnom
  alternative: Tofet oder Tal Ben-Hinnom
  rationale: Das hebräische וְ verbindet die Bezeichnungen formal mit „und“; die Übersetzung lässt offen, ob es sich um zwei Bezeichnungen desselben Bereichs oder eng verbundene Ortsangaben handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und klarer Gerichtssprache. Keine Fußnoten erforderlich.
