  to: 'Und du sollst zu ihnen sagen: »So spricht Jahwe der Heerscharen: Auf diese Weise werde ich dieses Volk und diese Stadt zerbrechen, wie man das Gefäß eines Töpfers zerbricht, das nicht wiederhergestellt werden kann.[a] Und im Tofet wird man begraben, weil es keinen anderen Ort zum Begraben gibt.[b]«'
