source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת כָּ֣כָה אֶשְׁבֹּ֞ר אֶת הָ/עָ֤ם הַ/זֶּה֙ וְ/אֶת הָ/עִ֣יר הַ/זֹּ֔את כַּ/אֲשֶׁ֤ר יִשְׁבֹּר֙ אֶת כְּלִ֣י הַ/יּוֹצֵ֔ר אֲשֶׁ֛ר לֹֽא יוּכַ֥ל לְ/הֵרָפֵ֖ה ע֑וֹד וּ/בְ/תֹ֣פֶת יִקְבְּר֔וּ מֵ/אֵ֥ין מָק֖וֹם לִ/קְבּֽוֹר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/011.yaml
  text: 'And you shall say to them[a], ‘Thus says Yahweh of hosts: In this way I will break this people and this city, as one breaks a potter’s vessel, which cannot be repaired again[b]; and in Topheth they will bury because there is no place else to bury.’'
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »So spricht Jahwe der Heerscharen: Auf diese Weise werde ich dieses Volk und diese Stadt zerbrechen, wie man das Gefäß eines Töpfers zerbricht, das nicht wiederhergestellt werden kann.[a] Und im Tofet wird man begraben, weil es keinen anderen Ort zum Begraben gibt.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das nicht wieder geheilt werden kann“; bei einem zerbrochenen Töpfergefäß ist damit gemeint, dass es nicht wiederhergestellt werden kann.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische hat ein aktives Verb in der Mehrzahl: „sie begraben“. Wen oder was sie begraben, bleibt unausgesprochen.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die Breite des Titels, ohne ihn auf menschliche Armeen zu beschränken.
- source_word: כָּכָה
  choice: Auf diese Weise
  rationale: Die Formulierung verweist auf die symbolische Handlung des Zerbrechens und unterscheidet sich vom vorangehenden כֹּה, das mit „So spricht“ wiedergegeben wird.
- source_word: אֶשְׁבֹּר / יִשְׁבֹּר
  choice: zerbrechen / zerbricht
  rationale: Dasselbe deutsche Verb erhält die bewusste Wiederholung und die Verbindung zwischen Gerichtsaussage und Zeichenhandlung.
- source_word: כְּלִי הַיּוֹצֵר
  choice: das Gefäß eines Töpfers
  rationale: כְּלִי ist ein allgemeiner Ausdruck für ein Gefäß oder einen Gegenstand; „Gefäß“ vermeidet die unbelegte Verengung auf einen Krug.
- source_word: לֹא יוּכַל לְהֵרָפֵה עוֹד
  choice: das nicht wiederhergestellt werden kann
  rationale: רפא bedeutet wörtlich „heilen“, bezeichnet beim zerbrochenen Töpfergefäß aber idiomatisch dessen Wiederherstellung; עוֹד wird durch „wieder“ aufgenommen.
- source_word: וּבְתֹפֶת
  choice: Und im Tofet
  rationale: Der Ortsname wird transliteriert; „im“ gibt die lokale Präposition ב natürlich wieder.
- source_word: יִקְבְּרוּ
  choice: wird man begraben
  rationale: Die unbestimmte deutsche man-Konstruktion gibt die aktive dritte Person Plural natürlich wieder, ohne ein im Hebräischen unausgesprochenes Objekt in den Haupttext einzusetzen.
- source_word: מֵאֵין מָקוֹם לִקְבּוֹר
  choice: weil kein Platz zum Begraben da ist
  rationale: Die kausale Wendung wird in klarem, gegenwärtigem Deutsch wiedergegeben; ein ausdrückliches „anderswo“ steht nicht im hebräischen Wortlaut.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Unwiderruflichkeit des angekündigten Gerichts
  choice: nicht wiederhergestellt werden kann
  alternative: nicht wieder geheilt werden kann
  rationale: Die übertragene Aussage bleibt eng am Bild des unwiederbringlich zerbrochenen Gefäßes, ohne die Bildsprache vorschnell zu einer umfassenderen dogmatischen Aussage auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „So spricht“ wahrt die prophetische Redeformel; „Auf diese Weise“ stellt den Bezug zur Zeichenhandlung deutlich her. Die unpersönliche Form „wird man begraben“ vermeidet, das im Hebräischen ausgelassene Objekt zu ergänzen oder das aktive Verb in ein Passiv umzudeuten.
