id: JER.19.7
reference: Jeremiah 19:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ֠/בַקֹּתִי אֶת עֲצַ֨ת יְהוּדָ֤ה וִ/ירוּשָׁלִַ֨ם֙ בַּ/מָּק֣וֹם הַ/זֶּ֔ה וְ/הִפַּלְתִּ֤י/ם בַּ/חֶ֨רֶב֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/נָתַתִּ֤י אֶת נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/007.yaml
  text: And I will frustrate the plan of Judah and Jerusalem in this place[a], and I will make them fall by the sword before their enemies and by the hand of those who seek their life[c][b], and I will give their corpses as food to the birds of the heavens and to the beasts of the earth.
translation:
  language: de
  text: Und ich werde an diesem Ort den Plan Judas und Jerusalems vereiteln[a]. Ich werde sie durch das Schwert zu Fall bringen, vor ihren Feinden und durch die Hand derer, die ihnen nach dem Leben trachten[b]. Ihre Leichen werde ich den Vögeln des Himmels[c] und den Tieren der Erde zum Fraß geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Rat Judas und Jerusalems zunichtemachen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die ihr Leben suchen“, das heißt, die sie töten wollen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Vögeln des Himmelsraums“ beziehungsweise „den Vögeln am Himmel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַקֹּתִי
  choice: ich werde … vereiteln
  rationale: Das Verb בקק hat hier im Kausativ den Sinn, einen Plan zunichtezumachen oder wirkungslos werden zu lassen. „Vereiteln“ ist im Deutschen präzise und idiomatisch.
- source_word: עֲצַת
  choice: den Plan
  rationale: עֵצָה kann „Rat“, „Plan“ oder „Vorhaben“ bedeuten. „Plan“ passt zum Gegenstand des Vereitelns und ist in modernem Deutsch klar.
- source_word: יְהוּדָה וִירוּשָׁלַם
  choice: Judas und Jerusalems
  rationale: Die Genitivkonstruktion gibt die politische und religiöse Paarung von Land beziehungsweise Volk und Hauptstadt natürlich wieder.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die Wendung bewahrt den deiktischen Bezug auf den konkreten Schauplatz und klingt im Deutschen idiomatischer als „in diesem Ort“.
- source_word: וְהִפַּלְתִּים
  choice: Ich werde sie … zu Fall bringen
  rationale: Der Hifil von נפל ist kausativ. „Zu Fall bringen“ erhält diese ausdrückliche Verursachung, ohne sie durch ein bloßes „fallen lassen“ abzuschwächen.
- source_word: בַּחֶרֶב
  choice: durch das Schwert
  rationale: Die instrumentale Wendung bezeichnet gewaltsamen Tod durch Krieg oder Tötung und bleibt nahe am hebräischen Bild.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: vor ihren Feinden
  rationale: Dies bewahrt den räumlich-relationalen Sinn von לִפְנֵי und entspricht gehobenem, verständlichem Deutsch.
- source_word: וּבְיַד מְבַקְשֵׁי נַפְשָׁם
  choice: und durch die Hand derer, die ihnen nach dem Leben trachten
  rationale: „Durch die Hand“ erhält das hebräische Bild der handelnden Gewalt; „jemandem nach dem Leben trachten“ ist eine natürliche deutsche Entsprechung für die idiomatische Suche nach dem נֶפֶשׁ einer Person.
- source_word: נִבְלָתָם
  choice: ihre Leichen
  rationale: נְבֵלָה bezeichnet hier die unbeerdigten toten Körper von Menschen. „Leichen“ ist klar und wahrt die Schande des angekündigten Schicksals.
- source_word: לְמַאֲכָל
  choice: zum Fraß
  rationale: Bei Tieren ist „zum Fraß geben“ die natürliche deutsche Wendung und vermittelt die drastische Bildsprache des Urtexts.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: den Vögeln des Himmels
  rationale: Die traditionelle, verständliche Formulierung bewahrt das hebräische Bild; sachlich sind die Vögel des Luftraums beziehungsweise Himmels gemeint.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: und den Tieren der Erde
  rationale: Die Wiedergabe bleibt eng an der hebräischen Parallelformulierung und umfasst die Landtiere, die sich von den Leichen nähren.
theological_decisions:
- issue: Göttliche Handlung im Gericht
  choice: 'Die drei Verben werden als ausdrückliche Handlungen Gottes in der ersten Person wiedergegeben: „ich werde … vereiteln“, „Ich werde … zu Fall bringen“, „werde ich … geben“.'
  alternative: Abschwächende Formulierungen wie „ich werde zulassen, dass sie fallen“ oder unpersönliche Passivkonstruktionen.
  rationale: Die hebräischen Verben schreiben dem redenden Gott die Handlungen unmittelbar zu. Die Übersetzung bewahrt diese Aussage über Gottes Gericht, ohne sie zu mildern oder weiter auszudeuten.
- issue: Bedeutung von נַפְשָׁם in der Verfolgerformel
  choice: Idiomatistisch als „ihnen nach dem Leben trachten“ wiedergegeben.
  alternative: 'Wörtlicher: „die ihr Leben suchen“; expliziter: „die sie töten wollen“.'
  rationale: Die hebräische Wendung meint in diesem Zusammenhang die tödliche Absicht der Verfolger. Die deutsche Redewendung bewahrt sowohl das Bild als auch den Sinn, ohne נֶפֶשׁ metaphysisch als „Seele“ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gerichtssprache. Die Satzfolge wahrt die dreifache göttliche Ich-Aussage. „Zum Fraß geben“ ist bewusst drastisch, aber idiomatisch; „ihnen nach dem Leben trachten“ bewahrt die hebräische Lebensformel ohne missverständliches „Seele“.
