source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה מַלְכֵ֣י יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ עַל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר כָּל שֹׁמְעָ֖/הּ תִּצַּ֥לְנָה אָזְנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/003.yaml
  text: 'And say, ‘Hear the word of the LORD, O kings of Judah and inhabitants of Jerusalem. Thus says the LORD of hosts, the God of Israel: Behold, I am bringing disaster on this place, at which everyone who hears of it—his ears will tingle.’'
translation:
  language: de
  text: 'Und sage: »Hört das Wort des HERRN, ihr Könige von Juda und ihr Bewohner Jerusalems! So spricht der HERR der Heerscharen, der Gott Israels: Siehe, ich bringe Unheil über diesen Ort. Jedem, der davon hört, werden die Ohren gellen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenstil wird beibehalten; sie ist würdig, geläufig und unterscheidet den Eigennamen vom gewöhnlichen Titel „Herr“.
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Die formnahe Wiedergabe erhält den traditionsreichen göttlichen Titel und sein militärisch-kosmisches Bild.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Kontext bezeichnet das Wort angekündigtes Verderben beziehungsweise Gericht, nicht moralische Bosheit; „Unheil“ bewahrt diese Bedeutung ohne unnötige Festlegung auf eine bestimmte Katastrophenart.
- source_word: תִּצַּלְנָה אָזְנָיו
  choice: werden die Ohren gellen
  rationale: Diese natürliche deutsche Wendung gibt das körperlich eindringliche Schreckensbild des hebräischen Idioms wieder; die Mehrzahl des Verbs entspricht dem Subjekt „Ohren“.
theological_decisions:
- issue: Gott als Urheber des angekündigten Unheils
  choice: „ich bringe Unheil“
  alternative: „ich lasse Unheil kommen“
  rationale: Der hebräische Hifil-Partizip מֵבִיא stellt den HERRN unmittelbar als den Handelnden dar. Die Übersetzung schwächt diese Gerichtsaussage nicht ab.
- issue: Anrede an mehrere Könige Judas
  choice: „ihr Könige von Juda“
  alternative: „du König von Juda“
  rationale: Der masoretische Text hat ausdrücklich den Plural מַלְכֵי. Die historisch auffällige Mehrzahl bleibt erhalten und wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Verkündigungsstil. Der einleitende Imperativ und die Botenformel bleiben eng am hebräischen Satzbau, während das Schlussidiom in verständlichem, bildkräftigem Deutsch wiedergegeben wird.
