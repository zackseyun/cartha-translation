base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/001.yaml
  text: 'Thus says Yahweh: Go and buy a potter’s earthenware flask[a], and take some of the elders of the people and some of the elders of the priests[b],'
translation:
  language: de
  text: 'So spricht Jahwe: Geh und kauf von einem Töpfer eine Tonflasche[a]. Nimm einige von den Ältesten des Volkes und einige von den Ältesten der Priester mit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Tonkrug“ beziehungsweise „ein Tongefäß“. Das hebräische Wort bezeichnet ein geformtes Gefäß, vermutlich mit engem Hals.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von den Ältesten des Volkes und von den Ältesten der Priester“. Der hebräische Text nennt hier kein ausdrückliches Verb; die Aufforderung, Vertreter aus beiden Gruppen mitzunehmen, wird aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Charakter und gibt den Gottesnamen als persönlichen Namen wieder.
- source_word: הָלוֹךְ וְקָנִיתָ
  choice: Geh und kauf
  rationale: Der Infinitivus absolutus הָלוֹךְ hat hier imperativische Funktion; die knappe Befehlsfolge entspricht dem Hebräischen und klingt im Deutschen natürlich.
- source_word: בַקְבֻּק
  choice: Tonkrug
  rationale: Das Wort bezeichnet ein geformtes, vermutlich engHalsiges Gefäß. „Tonkrug“ ist allgemein verständlich; die genauere Form bleibt in der Fußnote offen.
- source_word: יוֹצֵר חָרֶשׂ
  choice: bei einem Töpfer
  rationale: Der Zusammenhang macht deutlich, dass das irdene Gefäß vom Töpfer stammt. Da „Tonkrug“ bereits das Material ausdrückt, vermeidet diese Formulierung eine schwerfällige Dopplung.
- source_word: וּמִזִּקְנֵי הָעָם וּמִזִּקְנֵי הַכֹּהֲנִים
  choice: Nimm einige von den Ältesten des Volkes und einige von den Ältesten der Priester mit
  rationale: Das Verb „mitnehmen“ ist im Hebräischen elliptisch vorausgesetzt. „Einige von“ gibt die partitive Bedeutung von מִן wieder, ohne zu behaupten, alle Ältesten seien gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität der זִקְנֵי הַכֹּהֲנִים
  choice: Älteste der Priester
  alternative: priesterliche Älteste
  rationale: Die formal transparente Wiedergabe bewahrt die mögliche Spannung, ob ranghohe beziehungsweise ältere Priester oder eine eigens bezeichnete Gruppe gemeint ist.
