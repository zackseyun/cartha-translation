source:
  edition: WLC
  text: וְ/יָצָ֨אתָ֙ אֶל גֵּ֣יא בֶן הִנֹּ֔ם אֲשֶׁ֕ר פֶּ֖תַח שַׁ֣עַר ה/חרסות וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דְּבָרִ֖ים אֲשֶׁר אֲדַבֵּ֥ר אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/002.yaml
  text: and go out to the Valley of Ben Hinnom[a], which is at the entrance of the Potsherd Gate, and proclaim there the words that I will speak to you.
translation:
  language: de
  text: und geh hinaus in das Tal Ben-Hinnom, das am Eingang des Scherbentors[a] liegt, und rufe dort die Worte aus, die ich zu dir reden werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Tor der Tonscherben“. Der hebräische Torname ist nicht ganz sicher; man kann ihn auch formaler als „Harsit-Tor“ wiedergeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָאתָ
  choice: und geh hinaus
  rationale: Das Qal-Perfekt mit וְ setzt die Anweisungsfolge fort und hat hier auffordernde Kraft. „Hinausgehen“ bewahrt zudem die Richtungsangabe von יצא.
- source_word: גֵּיא בֶן הִנֹּם
  choice: das Tal Ben-Hinnom
  rationale: Der überlieferte Ortsname wird beibehalten. „Gehenna“ würde spätere Bedeutungsassoziationen eintragen, die an dieser Stelle nicht ausdrücklich vorliegen.
- source_word: אֲשֶׁר פֶּתַח שַׁעַר הַחַרְסוּת
  choice: das am Eingang des Scherbentors liegt
  rationale: Die im Hebräischen elliptische Ortsangabe wird im Deutschen mit „liegt“ natürlich ausgedrückt. „Scherbentor“ gibt die wahrscheinliche Verbindung des unsicheren Tornamens mit Ton beziehungsweise Tonscherben wieder.
- source_word: וְקָרָאתָ שָּׁם
  choice: und rufe dort … aus
  rationale: קרא bezeichnet im prophetischen Zusammenhang ein öffentliches, vernehmbares Ausrufen; „ausrufen“ bewahrt diesen Verkündigungscharakter.
- source_word: אֶת הַדְּבָרִים
  choice: die Worte
  rationale: Die konkrete Wiedergabe „Worte“ erhält den formalen Bezug zur folgenden göttlichen Rede besser als das allgemeinere „Botschaft“.
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: die ich dir sagen werde
  rationale: Die Formulierung gibt die angekündigte göttliche Rede idiomatisch und klar wieder, ohne ihren zukünftigen Charakter abzuschwächen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappen Aufforderungen und die Ortsangabe bleiben eng an der hebräischen Satzstruktur, während die Ellipse durch „liegt“ natürlich ergänzt wird.
