  text: Then you shall break the flask before the eyes of the men who are going with you[a].
translation:
  language: de
  text: Dann zerbrich den Krug vor den Augen der Männer, die mit dir gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁבַרְתָּ
  choice: Dann zerbrich
  rationale: Das Qal-Perfekt der 2. Person Singular mit vorangestelltem Waw setzt hier eine Folge prophetischer Anweisungen fort. Der deutsche Imperativ gibt die direktive Funktion natürlich wieder, während „Dann“ die Abfolge markiert.
- source_word: הַבַּקְבֻּק
  choice: den Krug
  rationale: Das Wort bezeichnet hier das zuvor genannte irdene Gefäß. „Krug“ ist im Deutschen anschaulich, geläufig und für ein zerbrechliches Tongefäß passend; „Flasche“ könnte irreführend an ein modernes Glasgefäß denken lassen.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die wörtlich-nahe Wendung bewahrt die Bildhaftigkeit des Hebräischen und bedeutet, dass die Handlung sichtbar in Gegenwart der Zeugen geschieht.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Das hebräische Substantiv bezeichnet ausdrücklich Männer; der bestimmte Artikel wird beibehalten.
- source_word: הַהֹלְכִים אוֹתָךְ
  choice: die mit dir gehen
  rationale: Das Partizip beschreibt die Männer, die Jeremia begleiten. Die Formulierung ist natürlich und erhält den fortdauernden Charakter der Begleitung.
