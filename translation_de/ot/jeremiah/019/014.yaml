  rationale: Die Revision stellt die stative Ortsangabe des Hebräischen wieder her, vermeidet die nicht explizite Spezifizierung „Vorhof“ und verwendet für לְהִנָּבֵא die direkte, moderne Entsprechung „zu prophezeien“. Die Satzverbindung bildet die hebräische Erzählfolge natürlich ab; der Doppelpunkt bleibt als Anschluss an die folgende Rede erhalten.
