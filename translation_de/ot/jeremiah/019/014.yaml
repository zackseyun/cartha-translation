  text: וַ/יָּבֹ֤א יִרְמְיָ֨הוּ֙ מֵֽ/הַ/תֹּ֔פֶת אֲשֶׁ֨ר שְׁלָח֧/וֹ יְהוָ֛ה שָׁ֖ם לְ/הִנָּבֵ֑א וַֽ/יַּעֲמֹד֙ בַּ/חֲצַ֣ר בֵּית יְהוָ֔ה וַ/יֹּ֖אמֶר אֶל כָּל הָ/עָֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/014.yaml
  text: Then Jeremiah came from Topheth[a], where Yahweh had sent him to prophesy, and he stood in the court of the house of Yahweh and said to all the people,
translation:
  language: de
  text: 'Dann kam Jeremia vom Tofet[a], wohin Jahwe ihn gesandt hatte, um zu prophezeien, und stand im Hof des Hauses Jahwes und sagte zum ganzen Volk:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tofet ist der Ort, an dem Jeremia zuvor in diesem Kapitel eine prophetische Zeichenhandlung vollzog und seine Botschaft verkündete.
    reason: Querverweis auf den unmittelbaren Zusammenhang des Kapitels.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Dann kam
  rationale: Das Qal wayyiqtol von בוא bezeichnet hier Jeremias Ortswechsel vom Tofet zum Tempel. „Kam“ folgt der erzählerischen Perspektive; „dann“ bildet die Handlungsfolge natürlich ab.
- source_word: מֵהַתֹּפֶת
  choice: vom Tofet
  rationale: Tofet ist ein Ortsname. Die im Deutschen geläufige Form „Tofet“ gibt den hebräischen Namen wieder; Artikel und Präposition werden idiomatisch zu „vom“ verbunden.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה שָׁם
  choice: wohin Jahwe ihn gesandt hatte
  rationale: Das hebräische Relativpronomen mit dem lokalen שָׁם bezeichnet den Ort, an den Jeremia zuvor gesandt worden war. „Wohin“ und das Plusquamperfekt machen dieses Verhältnis im Deutschen klar, ohne Zusatzinformation einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die übliche deutsche Form.
- source_word: לְהִנָּבֵא
  choice: um prophetisch zu reden
  rationale: Der Niphal-Infinitiv von נבא bezeichnet das Reden als Prophet. Diese Formulierung ist verständlicher als das heute seltene „weissagen“ und lässt offen, ob Verkündigung oder Vorhersage im Vordergrund steht.
- source_word: וַיַּעֲמֹד
  choice: Er stellte sich
  rationale: עמד kann sowohl das Stehen als auch das Einnehmen eines Standorts bezeichnen. Im Zusammenhang mit dem anschließenden öffentlichen Reden gibt „stellte sich“ den zielgerichteten Wechsel in den Vorhof natürlich wieder, ohne eine besondere Haltung zu unterstellen.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: in den Vorhof des Hauses Jahwes
  rationale: חצר bezeichnet den umschlossenen Hofbereich. Wegen der Bewegung, die „stellte sich“ ausdrückt, ist im Deutschen der Akkusativ idiomatisch. „Haus Jahwes“ bewahrt die hebräische Benennung des Heiligtums.
- source_word: וַיֹּאמֶר אֶל כָּל הָעָם
  choice: und sagte zum ganzen Volk
  rationale: אמר wird schlicht mit „sagte“ wiedergegeben. כל העם bleibt als „das ganze Volk“ erhalten, ohne den angesprochenen Kreis weiter einzugrenzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. Die Wiedergabe als „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von לְהִנָּבֵא
  choice: prophetisch zu reden
  alternative: zu weissagen
  rationale: Die gewählte Formulierung wahrt den breiten Sinn prophetischer Verkündigung und verengt ihn nicht auf die Vorhersage zukünftiger Ereignisse.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze halten die Erzählung klar; der Doppelpunkt am Versende kündigt die unmittelbar folgende Rede an. Der traditionelle Tempelausdruck „Haus Jahwes“ bleibt erhalten, während „prophetisch reden“ gegenüber dem missverständlichen „weissagen“ bevorzugt wird.
