    issue: »zu einem Ort des Entsetzens«
    rationale: Das hebräische לְשַׁמָּה bezeichnet nicht einen hinzugefügten Ort, sondern den Zustand der Verwüstung bzw. das von ihm ausgelöste Entsetzen. Die Einfügung »Ort« ist unnötig und schwächt die knappe Parallelstruktur mit לִשְׁרֵקָה.
  - severity: low
    issue: Präpositionale Anbindung von »all ihrer Schläge«
    rationale: »Wegen« ist möglich; »angesichts« gibt die Reaktion der Vorübergehenden auf die sichtbaren Schläge/Heimsuchungen der Stadt natürlicher wieder und bleibt nahe bei עַל.
  - severity: low
