source:
  edition: WLC
  text: וְ/שַׂמְתִּי֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את לְ/שַׁמָּ֖ה וְ/לִ/שְׁרֵקָ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכֹּתֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/008.yaml
  text: And I will make this city a horror and an object of hissing[b][a]; everyone who passes by it will be appalled and will hiss because of all its wounds.
translation:
  language: de
  text: Ich werde diese Stadt zu Entsetzen und höhnischem Pfeifen machen.[a] Jeder, der an ihr vorübergeht, wird entsetzt sein und angesichts all ihrer Schläge höhnisch pfeifen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »zu Verwüstung und höhnischem Pfeifen«. Die hebräischen Hauptwörter bezeichnen sowohl den verwüsteten Zustand der Stadt als auch die verächtliche Reaktion, die er hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »wird bestürzt sein und pfeifen/zischen«. Die hebräischen Verben können erstauntes Entsetzen sowie Pfeifen oder Zischen als herkömmliche Reaktion auf das sichtbare Gericht ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Ich werde … machen
  rationale: שׂים mit לְ und Ergebnisbezeichnungen beschreibt hier, wozu die Stadt gemacht wird; diese deutsche Wendung gibt die resultative Bedeutung natürlich wieder.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Die einfache Demonstrativverbindung wird direkt und mit ihrer deiktischen Kraft wiedergegeben.
- source_word: לְשַׁמָּה
  choice: zu einem Ort des Entsetzens
  rationale: שַׁמָּה bezeichnet Verwüstung und das von ihr ausgelöste Entsetzen. Die Formulierung verbindet Zustand und Wirkung, ohne das Wort auf bloße Verwüstung zu verengen.
- source_word: וְלִשְׁרֵקָה
  choice: des höhnischen Pfeifens
  rationale: Das von שרק abgeleitete Substantiv bezeichnet Pfeifen oder Zischen als Reaktion auf die gerichtete Stadt. »Höhnisches Pfeifen« erhält das konkrete Bild und macht seine verächtliche Funktion verständlich.
- source_word: כֹּל עֹבֵר עָלֶיהָ
  choice: Jeder, der an ihr vorübergeht
  rationale: Die partizipiale Wendung ist allgemein zu verstehen. »An ihr vorübergeht« ist im Deutschen für das Passieren einer Stadt natürlich.
- source_word: יִשֹּׁם
  choice: wird entsetzt sein
  rationale: שׁמם kann hier sowohl Bestürzung als auch Erstarrung angesichts der Verwüstung ausdrücken. »Entsetzt sein« passt zum Gerichtskontext und bewahrt die Reaktion des Betrachters.
- source_word: וְיִשְׁרֹק
  choice: wird … höhnisch pfeifen
  rationale: שרק kann »pfeifen« oder »zischen« bedeuten. Im Deutschen vermittelt »höhnisch pfeifen« die konventionelle prophetische Geste des spöttischen Staunens verständlicher als das missverständliche »zischen«.
- source_word: עַל כָּל מַכֹּתֶיהָ
  choice: wegen all ihrer Schläge
  rationale: מַכָּה kann Schlag, Wunde, Plage oder Heimsuchung bezeichnen. »Schläge« bewahrt das Bild zugefügter Gerichtsschläge, ohne es auf Krankheit oder sichtbare Wunden einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte Wortfeld von Entsetzen sowie Pfeifen/Zischen bleibt sichtbar; »höhnisch« erläutert die im Deutschen sonst leicht unklare Geste. Beide Fußnotenmarker stehen im Haupttext.
