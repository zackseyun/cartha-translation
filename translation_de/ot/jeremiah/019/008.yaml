revisions:
- from: Ich werde diese Stadt zu einem Ort des Entsetzens und des höhnischen Pfeifens machen.[a] Jeder, der an ihr vorübergeht, wird entsetzt sein und wegen all ihrer Schläge höhnisch pfeifen.[b]
  to: Ich werde diese Stadt zu Entsetzen und höhnischem Pfeifen machen.[a] Jeder, der an ihr vorübergeht, wird entsetzt sein und angesichts all ihrer Schläge höhnisch pfeifen.[b]
  rationale: Die Revision entfernt die nicht im Hebräischen ausgedrückte Ergänzung »Ort«, erhält die parallele Ergebnisformulierung und verdeutlicht die Reaktion auf die Schläge der Stadt. Die Fußnoten bleiben an denselben Aussageeinheiten verankert und formulieren die lexikalischen Alternativen zurückhaltender.
  reviewer_model: gpt-5.6-terra
