source:
  edition: WLC
  text: וְ/הַֽאֲכַלְתִּ֞י/ם אֶת בְּשַׂ֣ר בְּנֵי/הֶ֗ם וְ/אֵת֙ בְּשַׂ֣ר בְּנֹתֵי/הֶ֔ם וְ/אִ֥ישׁ בְּשַׂר רֵעֵ֖/הוּ יֹאכֵ֑לוּ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֧יקוּ לָ/הֶ֛ם אֹיְבֵי/הֶ֖ם וּ/מְבַקְשֵׁ֥י נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/009.yaml
  text: And I will make them eat the flesh of their sons and the flesh of their daughters[b][a], and each will eat the flesh of his neighbor in the siege and in the distress with which their enemies and those who seek their life will afflict them.
translation:
  language: de
  text: Und ich werde sie dazu bringen, das Fleisch ihrer Söhne und das Fleisch ihrer Töchter zu essen. Jeder wird während der Belagerung und der Bedrängnis, die ihre Feinde und die, die ihnen nach dem Leben trachten,[b] über sie bringen werden, das Fleisch seines Mitmenschen essen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während der Belagerung und in der Not“; auch: „in der Bedrängnis“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die ihr Leben suchen“; gemeint sind Menschen, die sie töten wollen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְהַאֲכַלְתִּים
  choice: Und ich werde sie dazu bringen, ... zu essen
  rationale: Die Hifil-Form ist kausativ. Die Wiedergabe bewahrt Gottes unmittelbare Verursachung des angekündigten Gerichts, ohne sie zu einem bloßen Zulassen abzuschwächen.
- source_word: בְּשַׂר
  choice: Fleisch
  rationale: „Fleisch“ entspricht dem konkreten hebräischen Ausdruck und bewahrt die erschütternde Härte der Aussage; „Körper“ wäre zu allgemein.
- source_word: בְּנֵיהֶם ... בְּנֹתֵיהֶם
  choice: ihrer Söhne ... ihrer Töchter
  rationale: Die ausdrücklich genannten Söhne und Töchter bleiben als bewusstes Parallelpaar erhalten und werden nicht zu „Kindern“ verallgemeinert.
- source_word: וְאִישׁ בְּשַׂר רֵעֵהוּ
  choice: Einer wird das Fleisch des anderen essen
  rationale: Die deutsche Wendung gibt den distributiven Sinn von אִישׁ und die wechselseitige Beziehung natürlich wieder. „Mitmensch“ oder „Nächster“ wären möglich, könnten hier aber zusätzliche ethische oder religiöse Konnotationen wecken.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: während der Belagerung und in der Not
  rationale: מָצוֹר bezeichnet die konkrete Belagerung, מָצוֹק die dadurch entstehende äußerste Bedrängnis. Die unterschiedlichen deutschen Präpositionen sorgen für natürliche Lesbarkeit.
- source_word: אֲשֶׁר יָצִיקוּ לָהֶם
  choice: in die ... sie bringen
  rationale: Die relative Konstruktion wird idiomatisch auf die Not bezogen und bewahrt, dass die Feinde den bedrängenden Zustand herbeiführen.
- source_word: וּמְבַקְשֵׁי נַפְשָׁם
  choice: und alle, die ihnen nach dem Leben trachten
  rationale: Diese geläufige deutsche Redewendung gibt den hebräischen Ausdruck sachgerecht als Tötungsabsicht wieder, ohne נֶפֶשׁ hier fälschlich auf eine immaterielle „Seele“ zu verengen.
theological_decisions:
- issue: Göttliche Verursachung des Gerichts
  choice: Gott spricht als derjenige, der sie dazu bringen wird, dies zu essen.
  alternative: „Ich werde zulassen, dass sie essen“ oder „Ich werde sie essen lassen“
  rationale: Die kausative Verbform stellt das Geschehen als von Gott herbeigeführtes Gericht dar. Diese Spannung wird nicht durch eine permissive Formulierung abgeschwächt.
- issue: Bedeutung von נֶפֶשׁ in der Todesdrohung
  choice: „ihnen nach dem Leben trachten“
  alternative: „ihre Seele suchen“ oder wörtlicher „ihr Leben suchen“
  rationale: נֶפֶשׁ bezeichnet in dieser festen Wendung das bedrohte Leben beziehungsweise die Person. Die Übersetzung vermeidet eine sachlich unpassende anthropologische Festlegung auf die „Seele“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache wird nicht beschönigt. Der Gedankenstrich gliedert den langen Satz, ohne die syntaktische Verbindung zum angekündigten Essen aufzulösen.
