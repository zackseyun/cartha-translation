revisions:
- from: Und ich werde sie dazu bringen, das Fleisch ihrer Söhne und das Fleisch ihrer Töchter zu essen. Einer wird das Fleisch des anderen essen – während der Belagerung und in der Not,[a] in die ihre Feinde und alle, die ihnen nach dem Leben trachten,[b] sie bringen.
  to: Und ich werde sie dazu bringen, das Fleisch ihrer Söhne und das Fleisch ihrer Töchter zu essen. Jeder wird während der Belagerung und der Bedrängnis, die ihre Feinde und die, die ihnen nach dem Leben trachten,[b] über sie bringen werden, das Fleisch seines Mitmenschen essen.[a]
  rationale: Die Korrektur stellt den Relativsatz syntaktisch und semantisch zu „Belagerung und Bedrängnis“ und gibt das pluralische „über sie bringen werden“ wieder. Die Fußnotenanker wurden beibehalten und eindeutig an die betreffenden Ausdrücke gesetzt. Die Aussage über das angekündigte Gericht wird weder abgeschwächt noch theologisch ausgelegt.
