  naturalness: Die revidierte Satzstellung ist modernes, würdiges Standarddeutsch und vermeidet die syntaktisch holprige Konstruktion „in die ... sie bringen“. „Jeder“ gibt den distributiven Sinn natürlich wieder.
  terminology: „Fleisch“ bewahrt die Konkretheit des hebräischen Ausdrucks. „Mitmensch“ gibt רֵעֵהוּ als Mitangehörigen der Gemeinschaft wieder, ohne eine engere räumliche Bedeutung von „Nachbar“ festzulegen. „Ihnen nach dem Leben trachten“ gibt die idiomatische Tötungsabsicht sachgerecht wieder.
