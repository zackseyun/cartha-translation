source:
  edition: WLC
  text: וּ/בָנ֞וּ אֶת בָּמ֣וֹת הַ/בַּ֗עַל לִ/שְׂרֹ֧ף אֶת בְּנֵי/הֶ֛ם בָּ/אֵ֖שׁ עֹל֣וֹת לַ/בָּ֑עַל אֲשֶׁ֤ר לֹֽא צִוִּ֨יתִי֙ וְ/לֹ֣א דִבַּ֔רְתִּי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/005.yaml
  text: They have built the high places of Baal to burn their sons in the fire as burnt offerings to Baal—something I did not command or speak[a], nor did it arise in my heart.
translation:
  language: de
  text: Sie haben die Kulthöhen des Baal gebaut, um ihre Söhne im Feuer als Brandopfer für Baal zu verbrennen – etwas, das ich weder geboten noch davon gesprochen habe[a] und das mir nicht in den Sinn gekommen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das ich nicht geboten und nicht geredet habe und das nicht auf mein Herz gestiegen ist«; sinngemäß auch: »das mir nicht in den Sinn gekommen ist«.'
    reason: Bewahrt die zwei unterschiedlichen hebräischen Verben sowie die ungewöhnliche Herz-Metapher, während der Haupttext natürliches modernes Deutsch verwendet.
lexical_decisions:
- source_word: וּבָנוּ
  choice: Sie haben ... gebaut
  rationale: Das Qal Perfekt bezeichnet eine vollzogene Tat; das deutsche Perfekt gibt in der prophetischen Anklage ihre fortdauernde Bedeutung natürlich wieder.
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: Der Ausdruck bezeichnet kultische Höhen beziehungsweise Höhenheiligtümer; »Kulthöhen« ist im modernen Deutsch verständlich und bewahrt den kultischen Sinn.
- source_word: הַבַּעַל / לַבָּעַל
  choice: des Baal / für Baal
  rationale: Baal wird im Deutschen als Gottesname ohne Artikel verwendet, wo die Syntax dies zulässt; der Genitiv nach »Kulthöhen« lautet idiomatisch »des Baal«.
- source_word: לִשְׂרֹף
  choice: um ... zu verbrennen
  rationale: Der Infinitiv mit ל drückt hier den Zweck aus.
- source_word: בְּנֵיהֶם
  choice: ihre Söhne
  rationale: Das Hebräische nennt ausdrücklich die Söhne und nicht allgemein die Kinder.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Wendung gibt die lokale beziehungsweise instrumentale Bedeutung der Präposition in diesem Opferkontext idiomatisch wieder.
- source_word: עֹלוֹת
  choice: als Brandopfer
  rationale: עֹלוֹת ist der technische Opferbegriff; »als« verdeutlicht die prädikative Beziehung zu den geopferten Söhnen.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: etwas, das ich ... nicht geboten habe
  rationale: Der Relativsatz bezieht sich auf die gesamte zuvor beschriebene Praxis.
- source_word: וְלֹא דִבַּרְתִּי
  choice: noch angeordnet habe
  rationale: Wörtlich steht »noch geredet/gesagt habe«. Im Zusammenhang mit einem nicht erteilten göttlichen Auftrag gibt »angeordnet« die gemeinte Sprechhandlung natürlich wieder; die Fußnote bewahrt die formale Alternative.
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: und das mir nie in den Sinn gekommen ist
  rationale: Die hebräische Wendung lautet wörtlich »und es stieg nicht auf mein Herz«. Die deutsche Idiomatik verlangt eine sinngemäße Wiedergabe; die Fußnote erhält das Bild mit »Herz« und macht die Ambiguität transparent.
theological_decisions:
- issue: Anthropomorphe Aussage über Gottes inneres Erwägen
  choice: das mir nie in den Sinn gekommen ist
  alternative: das nicht in meinem Herzen aufgestiegen ist
  rationale: Die Hauptfassung vermeidet unnatürliches Deutsch, ohne die starke Aussage der völligen Nichtautorisierung abzuschwächen. Die Fußnote bewahrt die wörtliche Herz-Metapher, sodass die anthropomorphe und theologische Spannung nicht verborgen wird.
- issue: Verhältnis von »gebieten« und »reden«
  choice: weder geboten noch angeordnet
  alternative: weder geboten noch davon gesprochen
  rationale: Die beiden Verben bleiben als parallele Verneinungen erhalten. »Angeordnet« versteht דִבַּרְתִּי kontextuell als autorisierende Äußerung; die Fußnote nennt die wörtlichere Lesart, ohne daraus eine besondere Lehrposition abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Kulthöhen« vermeidet das im Deutschen missverständliche bloße »Höhen« und bleibt zugleich quellennah. Der Gedankenstrich markiert die nachdrückliche göttliche Zurückweisung der beschriebenen Praxis.
