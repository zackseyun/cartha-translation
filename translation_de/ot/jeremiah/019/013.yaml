source:
  edition: WLC
  text: וְ/הָי֞וּ בָּתֵּ֣י יְרוּשָׁלִַ֗ם וּ/בָתֵּי֙ מַלְכֵ֣י יְהוּדָ֔ה כִּ/מְק֥וֹם הַ/תֹּ֖פֶת הַ/טְּמֵאִ֑ים לְ/כֹ֣ל הַ/בָּתִּ֗ים אֲשֶׁ֨ר קִטְּר֜וּ עַל גַּגֹּֽתֵי/הֶם֙ לְ/כֹל֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/הַסֵּ֥ךְ נְסָכִ֖ים לֵ/אלֹהִ֥ים אֲחֵרִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/013.yaml
  text: The houses of Jerusalem and the houses of the kings of Judah will become like the unclean place of Topheth—all the houses on whose rooftops they burned incense to all the host of heaven and poured out drink offerings to other gods[a][b].
translation:
  language: de
  text: Die Häuser Jerusalems und die Häuser der Könige von Juda werden wie der Ort Tofet unrein[a] werden – all die Häuser, auf deren Dächern sie dem ganzen Heer des Himmels[b] Räucheropfer darbrachten und anderen Göttern Trankopfer ausgossen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: entweiht.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem »Heer des Himmels« sind hier die Himmelskörper gemeint, die in einem astralen Kult verehrt wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ ... כִּמְקוֹם הַתֹּפֶת הַטְּמֵאִים
  choice: werden ebenso unrein sein wie der Ort Tofet
  rationale: Das pluralische הַטְּמֵאִים bezieht sich grammatisch auf die Häuser, nicht auf den singularischen Ort. Die Konstruktion beschreibt ihren künftigen Zustand im Vergleich mit Tofet.
- source_word: בָּתֵּי יְרוּשָׁלִַם וּבָתֵּי מַלְכֵי יְהוּדָה
  choice: Die Häuser Jerusalems und die Häuser der Könige von Juda
  rationale: Die parallelen Constructusverbindungen werden wörtlich und natürlich wiedergegeben; »Häuser« bleibt auch bei den Königen erhalten, statt deutend zu »Paläste« erweitert zu werden.
- source_word: לְכֹל הַבָּתִּים אֲשֶׁר
  choice: all die Häuser, auf deren
  rationale: Das לְ führt hier am ehesten eine erläuternde Präzisierung ein. Der Gedankenstrich macht die Apposition im Deutschen verständlich.
- source_word: קִטְּרוּ
  choice: Räucheropfer darbrachten
  rationale: Die kultische Bedeutung des Piel von קטר wird idiomatisch wiedergegeben.
- source_word: עַל גַּגֹּתֵיהֶם
  choice: auf deren Dächern
  rationale: Die Ortsangabe und der Bezug auf die zuvor genannten Häuser bleiben erhalten.
- source_word: לְכֹל צְבָא הַשָּׁמַיִם
  choice: dem ganzen Heer des Himmels
  rationale: Die feste hebräische Wendung wird formal bewahrt; eine Fußnote erläutert ihren Bezug auf verehrte Himmelskörper.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: und ... Trankopfer ausgossen
  rationale: Die kultische Handlung wird mit der üblichen deutschen Bezeichnung präzise wiedergegeben.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Direkte und geläufige Wiedergabe der prophetischen Bezeichnung fremder Gottheiten.
theological_decisions:
- issue: Bezug und Bedeutung von הַטְּמֵאִים
  choice: »unrein« als Aussage über die Häuser
  alternative: '»entweiht«; oder syntaktisch weniger wahrscheinlich: »wie der unreine Ort Tofet«'
  rationale: Die Pluralform des Adjektivs stimmt mit den Häusern überein, während מְקוֹם singularisch ist. »Unrein« bewahrt zugleich die rituell-moralische Bedeutungsbreite, ohne sie nur auf physische Verunreinigung zu verengen.
- issue: Bedeutung der Häuser der Könige von Juda
  choice: »Häuser« beibehalten
  alternative: »Paläste«
  rationale: Auch wenn königliche Residenzen gemeint sein können, verwendet der hebräische Text das gewöhnliche Wort für Häuser. Die Übersetzung vermeidet eine unnötige interpretierende Präzisierung.
- issue: Referenz des Heeres des Himmels
  choice: Bildhafte Ausgangsformulierung im Text bewahren und in der Fußnote erläutern
  alternative: direkt »Himmelskörper« übersetzen
  rationale: So bleibt die feste biblische Wendung samt ihrer Bildhaftigkeit erhalten, während der konkrete Bezug im vorliegenden Götzendienstkontext verständlich gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich kennzeichnet die erläuternde Apposition. Die Formulierung folgt der hebräischen Numeruskongruenz und weicht deshalb sachlich begründet von einer möglichen Deutung als »der unreine Ort Tofet« ab.
