source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מבי אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל כָּל עָרֶ֔י/הָ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלֶ֑י/הָ כִּ֤י הִקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֖י שְׁמ֥וֹעַ אֶת דְּבָרָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/019/015.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Behold, I am bringing on this city and on all its towns all the disaster that I have spoken against it[c][b], because they have stiffened their neck so as not to hear my words.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen, der Gott Israels: Siehe, ich bringe über diese Stadt und über alle ihre Ortschaften[a] all das Unheil[b], das ich gegen sie angekündigt habe. Denn sie haben ihren Nacken verhärtet[c], um nicht auf meine Worte zu hören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle ihre Städte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all das Unglück“. Das hebräische Wort bezeichnet hier das Unheil des Gerichts, nicht moralisch Böses.'
    reason: lexical_alternative
  - marker: c
    text: Ein hebräisches Bild für hartnäckige Weigerung und Ungehorsam.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. „Der Heerscharen“ bewahrt die breite Bedeutung des festen hebräischen Titels, ohne ihn allein auf irdische Heere einzugrenzen.
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Die Wendung signalisiert feierliche Unmittelbarkeit und lenkt nachdrücklich auf das bevorstehende Handeln Gottes.
- source_word: מֵבִיא
  choice: bringe
  rationale: Die Kausativform von בוא bezeichnet hier, dass Gott das angekündigte Gericht über die Stadt kommen lässt.
- source_word: כָּל עָרֶיהָ
  choice: alle ihre Ortschaften
  rationale: עָרִים kann Städte oder kleinere Orte bezeichnen. „Ortschaften“ lässt den Umfang offen und passt zu den zu Jerusalem gehörenden Siedlungen.
- source_word: כָּל הָרָעָה
  choice: all das Unheil
  rationale: רָעָה bezeichnet in diesem Gerichtszusammenhang nicht moralische Bosheit, sondern hereinbrechendes Unheil.
- source_word: דִּבַּרְתִּי עָלֶיהָ
  choice: das ich ihr angedroht habe
  rationale: Wörtlich steht „das ich gegen/über sie geredet habe“. „Angedroht“ gibt im Deutschen den Zusammenhang einer zuvor ausgesprochenen Gerichtsankündigung natürlich wieder.
- source_word: הִקְשׁוּ אֶת עָרְפָּם
  choice: sie haben ihren Nacken verhärtet
  rationale: Die hebräische Körpermetapher für hartnäckige Verweigerung bleibt im Haupttext erhalten; eine Fußnote erläutert ihre Bedeutung.
- source_word: לְבִלְתִּי שְׁמוֹעַ אֶת דְּבָרָי
  choice: um nicht auf meine Worte zu hören
  rationale: Die Formulierung erhält sowohl die bewusste Verweigerung als auch die Bedeutung von שׁמע als hörendes Beachten bzw. Gehorchen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe, der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: Der Eigenname wird als „Jahwe“ statt durch einen Titel wiedergegeben. „Heerscharen“ bewahrt die traditionelle semantische Weite des Beinamens und legt nicht fest, ob ausschließlich himmlische oder irdische Mächte gemeint sind.
- issue: Art des angekündigten רָעָה
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im Kontext ist das von Gott angekündigte Gericht gemeint. „Unheil“ beschreibt dessen verheerende Wirkung, ohne Gott moralisches Böses zuzuschreiben oder die Ernsthaftigkeit des Gerichts abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Feierlichkeit. Die hebräische Nackenmetapher bleibt stehen, wird aber erläutert. „Ortschaften“ vermeidet eine unnötige Festlegung zwischen Städten und kleineren abhängigen Siedlungen.
