  to: 'So spricht Jahwe der Heerscharen, der Gott Israels: Siehe, ich bringe über diese Stadt und über alle ihre Ortschaften[a] all das Unheil[b], das ich gegen sie angekündigt habe. Denn sie haben ihren Nacken verhärtet[c], um nicht auf meine Worte zu hören.'
