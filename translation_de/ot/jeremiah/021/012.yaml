id: JER.21.12
reference: Jeremiah 21:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בֵּ֣ית דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה דִּ֤ינוּ לַ/בֹּ֨קֶר֙ מִשְׁפָּ֔ט וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עוֹשֵׁ֑ק פֶּן תֵּצֵ֨א כָ/אֵ֜שׁ חֲמָתִ֗/י וּ/בָעֲרָה֙ וְ/אֵ֣ין מְכַבֶּ֔ה מִ/פְּנֵ֖י רֹ֥עַ מעללי/הם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/012.yaml
  text: 'House of David[a], thus says Yahweh: Administer justice in the morning, and deliver the one who has been robbed from the hand of the oppressor, lest my wrath go out like fire and burn with no one to quench it[c][b], because of the evil of their deeds.'
translation:
  language: de
  text: 'Haus David, so spricht Jahwe: Sprecht am Morgen Recht und rettet den Beraubten aus der Hand des Unterdrückers[a], damit mein Zorn nicht wie Feuer hervorbricht und brennt, ohne dass jemand es löschen kann[b], wegen der Bosheit ihrer Taten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Aus der Hand“ bedeutet hier: aus der Macht oder Gewalt des Unterdrückers.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: „und es brennt, und niemand löscht“.'
    reason: literal_rendering
lexical_decisions:
- source_word: בֵּית דָּוִד
  choice: Haus David
  rationale: Die Konstruktverbindung ist eine direkte Anrede an das davidische Königshaus. „Haus David“ ist im Deutschen geläufig und bewahrt die knappe Form des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּינוּ לַבֹּקֶר מִשְׁפָּט
  choice: Sprecht am Morgen Recht
  rationale: Die Verbindung aus דין und מִשְׁפָּט bezeichnet die pflichtgemäße Ausübung richterlicher Gerechtigkeit. Die Formulierung ist idiomatisches Deutsch und lässt offen, ob der Morgen jeweils regelmäßiger Gerichtstermin oder Ausdruck unverzüglichen Handelns ist.
- source_word: וְהַצִּילוּ גָזוּל
  choice: und rettet den Beraubten
  rationale: Das substantivierte passive Partizip bezeichnet einen Menschen, dem etwas gewaltsam oder ungerecht genommen wurde. „Rettet“ bringt das geforderte konkrete Eingreifen zum Ausdruck.
- source_word: מִיַּד עוֹשֵׁק
  choice: aus der Hand des Unterdrückers
  rationale: Die hebräische Wendung bezeichnet Befreiung aus Macht oder Gewalt; die bildhafte Rede von der „Hand“ bleibt im Deutschen verständlich.
- source_word: פֶּן תֵּצֵא כָאֵשׁ חֲמָתִי
  choice: damit mein Zorn nicht wie Feuer hervorbricht
  rationale: פֶּן leitet eine warnende negative Folge ein. „Hervorbricht“ gibt das Ausgehen des Zorns natürlich wieder und hält den Feuervergleich lebendig.
- source_word: וּבָעֲרָה וְאֵין מְכַבֶּה
  choice: und unauslöschlich brennt
  rationale: Die kompakte Wiedergabe drückt aus, dass niemand das Feuer löschen kann, ohne einen ausdrücklichen Gegenstand in den deutschen Satz einzuführen.
- source_word: מִפְּנֵי רֹעַ מעלליהם
  choice: wegen der Bosheit eurer Taten
  rationale: Der masoretische Konsonantentext weist auf die Taten der Angeredeten. Die zweite Person wird im Haupttext wiedergegeben; die abweichende Vokalisierungs- beziehungsweise Lesetradition der dritten Person wird in einer Fußnote vermerkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt die Unterscheidung zwischen dem persönlichen Gottesnamen und einem bloßen Titel.
- issue: Adressatenbezug im Schlusswort מעלליהם
  choice: eurer Taten
  alternative: ihrer Taten
  rationale: Die Konsonanten beziehungsweise die Ketiv-Form weisen auf die zweite Person Plural und setzen die direkte Anrede an das Haus David fort. Die masoretische Randlesung gibt dagegen die dritte Person Plural; diese echte Textspannung wird nicht verschwiegen.
- issue: Bild des unauslöschlichen Feuers
  choice: unauslöschlich brennt
  alternative: brennt, ohne dass jemand löscht
  rationale: Die Aussage wird als Warnung vor nicht mehr abwendbarem göttlichem Gericht belassen, ohne Reichweite oder Dauer über den Wortlaut hinaus dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Eindringlichkeit. Die direkte Anrede und die Feuerbildsprache bleiben erhalten. „Sprecht Recht“ ist eine geläufige, gehobene Wendung, die sowohl gerichtliches Entscheiden als auch gerechtes Regierungshandeln umfasst.
