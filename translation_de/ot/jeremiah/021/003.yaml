- source_word: וַיֹּאמֶר
  choice: sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; im natürlichen deutschen Erzählstil ist die Wiedergabe ohne wiederholtes »und« angemessen.
- source_word: יִרְמְיָהוּ
