  rationale: Die Präposition אֶל mit Suffix der 3. Person maskulin Plural bezeichnet die Angesprochenen.
- source_word: כֹּה
  choice: So
  rationale: כֹּה leitet eine förmliche Botschaft ein; »So« bewahrt die knappe Botenformel in natürlichem modernem Deutsch.
- source_word: תֹאמְרֻן
  choice: sollt ihr sagen
  rationale: Die 2. Person maskulin Plural Imperfekt hat hier auffordernde Bedeutung und richtet sich an mehrere Boten.
- source_word: אֶל
  choice: zu
  rationale: Die Präposition kennzeichnet den Adressaten der auszurichtenden Botschaft.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Die im Deutschen übliche Form des königlichen Eigennamens.
