  variant: modern standard German
source:
  edition: WLC
  text: דְּרָשׁ נָ֤א בַעֲדֵ֨/נוּ֙ אֶת יְהוָ֔ה כִּ֛י נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל נִלְחָ֣ם עָלֵ֑י/נוּ אוּלַי֩ יַעֲשֶׂ֨ה יְהוָ֤ה אוֹתָ֨/נוּ֙ כְּ/כָל נִפְלְאֹתָ֔י/ו וְ/יַעֲלֶ֖ה מֵ/עָלֵֽי/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/002.yaml
  text: Please inquire of Yahweh on our behalf[a], because Nebuchadnezzar king of Babylon is fighting against us. Perhaps Yahweh will act for us according to all his wondrous acts[c][b], so that he will withdraw from us.
translation:
  language: de
  text: „Befrage doch Jahwe für uns[a], denn Nebukadnezar[b], der König von Babel, führt Krieg gegen uns. Vielleicht wird Jahwe für uns handeln, gemäß all seinen Wundertaten[c], sodass er von uns abzieht[d].“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Erkundige dich bei Jahwe für uns nach seinem Willen und Eingreifen.'
    reason: Die prophetische Bedeutung von „befragen“ wird für heutige Leser verdeutlicht.
  - marker: b
    text: Die hebräische Namensform entspricht genauer „Nebukadrezzar“.
    reason: Hinweis auf die quellennahe Namensform neben der geläufigen deutschen Form.
  - marker: c
    text: 'Wörtlich etwa: „gemäß all seinen Wundertaten“; gemeint ist ein Handeln nach dem Muster seiner außergewöhnlichen Taten.'
    reason: Die Vergleichsformulierung wird erläutert, ohne ihren Bezug über den Wortlaut hinaus einzuengen.
  - marker: d
    text: 'Wörtlich: „und er von uns hinaufzieht“. Gemeint ist, dass Nebukadnezar seinen Angriff beendet und abzieht.'
    reason: Das militärische Idiom sowie das im Hebräischen nur implizite Subjekt werden erklärt.
lexical_decisions:
- source_word: דְּרָשׁ נָא
  choice: Befrage doch
  rationale: דרש bezeichnet hier die prophetische Befragung Gottes; נא macht die Aufforderung höflich und wird natürlich mit „doch“ wiedergegeben.
- source_word: בַעֲדֵנוּ
  choice: für uns
  rationale: Die Präposition bezeichnet hier stellvertretendes Handeln; „für uns“ ist im Deutschen knapp und schließt die Fürsprache ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נִלְחָם עָלֵינוּ
  choice: führt Krieg gegen uns
  rationale: Das Partizip bezeichnet die andauernde militärische Feindseligkeit; „führt Krieg“ ist dem Kontext angemessen.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im Deutschen etablierte Namensform dient der Verständlichkeit; eine quellenähere Variante wird in der Fußnote genannt.
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt die im Hebräischen ausgesprochene Unsicherheit und Hoffnung.
- source_word: יַעֲשֶׂה יְהוָה אוֹתָנוּ כְּכָל נִפְלְאֹתָיו
  choice: wird Jahwe für uns handeln, wie es all seinen Wundertaten entspricht
  rationale: Die ungewöhnliche Verbindung von עשה mit dem Objektpronomen wird kontextgemäß als Handeln zugunsten der Sprecher verstanden; die Vergleichsphrase verweist auf Gottes frühere außergewöhnliche Taten, ohne eine konkrete Art des Eingreifens festzulegen.
- source_word: וְיַעֲלֶה מֵעָלֵינוּ
  choice: sodass er von uns abzieht
  rationale: עלה מעל bezeichnet im militärischen Zusammenhang das Aufheben des Angriffs beziehungsweise den Abzug; das maskuline Subjekt bleibt wie im Hebräischen durch „er“ implizit auf den angreifenden König bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Transliteration bewahrt dies und vermeidet die Ersetzung durch einen Titel.
- issue: Sinn von יַעֲשֶׂה יְהוָה אוֹתָנוּ
  choice: Jahwe wird für uns handeln
  alternative: Jahwe wird mit uns verfahren
  rationale: Der Kontext ist die Hoffnung auf rettendes Eingreifen. „Für uns handeln“ gibt diese naheliegende Richtung wieder, ohne die erhoffte Rettung als Gewissheit darzustellen.
- issue: Unausgesprochenes Subjekt von וְיַעֲלֶה
  choice: „er“ bezieht sich auf Nebukadnezar
  alternative: 'wörtlich und stärker mehrdeutig: „und er steigt von uns hinauf“'
  rationale: Im Zusammenhang soll der angreifende König infolge von Jahwes Eingreifen abziehen. Das Pronomen bewahrt die knappe Ausdrucksweise des Hebräischen, während die Fußnote den Bezug erklärt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Babel“ bewahrt die geläufige biblische Ortsbezeichnung, während „führt Krieg“ die laufende militärische Lage klar ausdrückt. Die Unsicherheit von אוּלַי bleibt ausdrücklich erhalten.
