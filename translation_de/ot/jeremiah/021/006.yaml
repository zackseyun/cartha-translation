source:
  edition: WLC
  text: וְ/הִכֵּיתִ֗י אֶת יֽוֹשְׁבֵי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת הָ/אָדָ֖ם וְ/אֶת הַ/בְּהֵמָ֑ה בְּ/דֶ֥בֶר גָּד֖וֹל יָמֻֽתוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/006.yaml
  text: And I will strike the inhabitants of this city, both man and beast; they will die by a great pestilence.
translation:
  language: de
  text: Und ich werde die Bewohner dieser Stadt schlagen, Menschen und Tiere; an einer schweren Seuche werden sie sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: Und ich werde … schlagen
  rationale: Das Hifil von נכה bezeichnet hier Gottes unmittelbares Schlagen. „Schlagen“ wahrt die Bildsprache, ohne das im folgenden Satzteil ausdrücklich genannte Sterben vorwegzunehmen.
- source_word: יֹשְׁבֵי הָעִיר הַזֹּאת
  choice: die Bewohner dieser Stadt
  rationale: Die partizipiale Wendung bezeichnet diejenigen, die in der Stadt wohnen; „Bewohner“ ist natürlich, präzise und dem prophetischen Register angemessen.
- source_word: הָאָדָם וְאֶת הַבְּהֵמָה
  choice: Menschen und Tiere
  rationale: אָדָם steht kollektiv für die Menschen und bildet mit בְּהֵמָה eine umfassende Mensch-Tier-Gegenüberstellung. Im heutigen Deutsch gibt „Menschen und Tiere“ diese Formel klarer und natürlicher wieder als „Mensch und Vieh“.
- source_word: בְּדֶבֶר גָּדוֹל
  choice: an einer schweren Seuche
  rationale: דֶּבֶר bezeichnet eine tödliche epidemische Seuche; גָּדוֹל beschreibt hier ihre große Schwere. Die Präposition בְּ kann beim Sterben idiomatisch mit „an“ wiedergegeben werden.
- source_word: יָמֻתוּ
  choice: werden sie sterben
  rationale: Das Imperfekt bezeichnet in diesem Gerichtswort die angekündigte Folge. Die Nachstellung erhält den Nachdruck des hebräischen Satzschlusses auf dem Sterben.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם in der Gerichtsformel
  choice: Menschen
  alternative: Mensch
  rationale: Der Singular אָדָם ist hier kollektiv und steht parallel zu der ebenfalls kollektiv gebrauchten Tierbezeichnung. Der Plural „Menschen“ macht den Umfang des angekündigten Gerichts im modernen Deutsch deutlich, ohne eine geschlechtliche Einschränkung einzutragen.
- issue: Art der göttlichen Gerichtsankündigung
  choice: ich werde … schlagen
  alternative: ich werde … vernichten
  rationale: „Schlagen“ bewahrt die konkrete Aussage von נכה und lässt die anschließende Todesursache eigenständig stehen; „vernichten“ würde das Ergebnis bereits in das Verb hineinlesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Direktheit. Die Wortstellung im zweiten Teilsatz setzt wie der hebräische Text einen deutlichen Schlussakzent auf „sterben“; auf archaische Formen wie „Pestilenz“ oder „Vieh“ wurde verzichtet.
