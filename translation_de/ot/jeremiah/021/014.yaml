id: JER.21.14
reference: Jeremiah 21:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/פָקַדְתִּ֧י עֲלֵי/כֶ֛ם כִּ/פְרִ֥י מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָ֑ה וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/יַעְרָ֔/הּ וְ/אָכְלָ֖ה כָּל סְבִיבֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/014.yaml
  text: And I will punish you according to the fruit of your deeds[a], declares Yahweh, and I will kindle a fire in her forest[b], and it will consume all that is around her.
translation:
  language: de
  text: Und ich werde euch heimsuchen entsprechend der Frucht eurer Taten[a], spricht Jahwe. Ich werde in ihrem Wald ein Feuer entzünden[b], und es wird alles rings um sie verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Rechenschaft ziehen“ beziehungsweise „bestrafen“. Das hebräische Verb kann allgemein „sich jemandem zuwenden“ oder „jemanden aufsuchen“ bedeuten; hier steht es in einem Gerichtszusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr Wald“ bezeichnet wahrscheinlich bildhaft Jerusalem oder ihren königlichen beziehungsweise palastartigen Gebäudekomplex; möglicherweise ist damit auch das Dickicht ihrer Bauten oder Befestigungen gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיכֶם
  choice: ich werde euch heimsuchen
  rationale: פקד mit על bezeichnet hier ein ahndendes Einschreiten im Gericht. „Heimsuchen“ bewahrt zugleich etwas von der größeren Bedeutungsbreite des Verbs, anders als das eindeutigere „bestrafen“.
- source_word: כִּפְרִי מַעַלְלֵיכֶם
  choice: entsprechend der Frucht eurer Taten
  rationale: כ bezeichnet die Entsprechung beziehungsweise das Maß; „Frucht“ bewahrt das hebräische Bild für die Folgen der Taten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt נְאֻם knapp und würdig wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְהִצַּתִּי אֵשׁ
  choice: ich werde ... ein Feuer entzünden
  rationale: Der Hifil von יצת drückt das Entfachen oder Inbrandsetzen aus; „ein Feuer entzünden“ ist im Deutschen natürlich und präzise.
- source_word: בְּיַעְרָהּ
  choice: in ihrem Wald
  rationale: יער bedeutet wörtlich „Wald“; das feminine Suffix bleibt erhalten, ohne den poetischen Bezug im Haupttext auf Jerusalem oder einen Palastkomplex festzulegen.
- source_word: וְאָכְלָה כָּל סְבִיבֶיהָ
  choice: und es wird alles rings um sie verzehren
  rationale: אכל wird mit Feuer als Subjekt idiomatisch durch „verzehren“ wiedergegeben. „Rings um sie“ erhält den femininen Bezug und bezeichnet ihre gesamte Umgebung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn im modernen deutschen Bibelregister direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gerichtsbedeutung von פקד
  choice: heimsuchen
  alternative: bestrafen; zur Rechenschaft ziehen; sich zuwenden
  rationale: Der Zusammenhang ist eindeutig Gericht, doch „heimsuchen“ lässt die grundsätzliche Bedeutungsweite des Verbs erkennen und vermeidet eine unnötige Verengung.
- issue: Bezug der femininen Suffixe in בְּיַעְרָהּ und סְבִיבֶיהָ
  choice: ihrem / sie, ohne ausdrückliche Identifizierung
  alternative: Jerusalems Wald; ihr Palastkomplex; sein Wald
  rationale: Die feminine Personifikation wird bewahrt. Ob „Wald“ Jerusalem insgesamt, ihre Bebauung, Befestigung oder den königlichen Bereich bezeichnet, wird nicht im Haupttext entschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. „Heimsuchen“ ist leicht gehoben, bleibt aber verständlich und dient hier dazu, die Bedeutungsbreite von פקד nicht vollständig einzuebnen. Die femininen Bezüge und das Bild des Waldes werden nicht interpretierend aufgelöst.
