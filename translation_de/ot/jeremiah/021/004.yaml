source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֣י מֵסֵב֮ אֶת כְּלֵ֣י הַ/מִּלְחָמָה֮ אֲשֶׁ֣ר בְּ/יֶדְ/כֶם֒ אֲשֶׁ֨ר אַתֶּ֜ם נִלְחָמִ֣ים בָּ֗/ם אֶת מֶ֤לֶךְ בָּבֶל֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים הַ/צָּרִ֣ים עֲלֵי/כֶ֔ם מִ/ח֖וּץ לַֽ/חוֹמָ֑ה וְ/אָסַפְתִּ֣י אוֹתָ֔/ם אֶל תּ֖וֹךְ הָ/עִ֥יר הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/004.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Behold, I am turning back the weapons of war that are in your hands, with which you are fighting against the king of Babylon and against the Chaldeans who are besieging you outside the wall, and I will gather them into the midst of this city.'
translation:
  language: de
  text: 'So spricht Jahwe, der Gott Israels: Siehe, ich wende die Kriegswaffen zurück, die ihr in euren Händen habt und mit denen ihr gegen den König von Babylon und gegen die Chaldäer kämpft, die euch außerhalb der Mauer belagern, und ich werde sie[a] mitten in dieser Stadt sammeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sie“ kann sich auch auf den König von Babylon und die Chaldäer beziehen. Dann bedeutet der Satz, dass Gott die feindlichen Truppen in die Stadt bringen wird.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen stehenden Gottesnamen als im Deutschen geläufige Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנְנִי
  choice: Seht, ich werde
  rationale: Bewahrt die nachdrückliche Einleitung der unmittelbar bevorstehenden göttlichen Handlung in natürlichem, würdigem Deutsch.
- source_word: מֵסֵב
  choice: zurückwenden
  rationale: Das Partizip bezeichnet eine bevorstehende bzw. einsetzende Handlung; „zurückwenden“ erhält im militärischen Zusammenhang das Bild, dass die Waffen der Verteidiger von ihrem bisherigen Ziel abgebracht werden.
- source_word: כְּלֵי הַמִּלְחָמָה
  choice: die Kriegswaffen
  rationale: Gibt die militärische Bedeutung knapp und idiomatisch wieder, ohne den Ausdruck unnötig technisch zu formulieren.
- source_word: בְּיֶדְכֶם
  choice: die ihr in euren Händen habt
  rationale: Bewahrt das konkrete hebräische Bild und macht deutlich, dass die Angesprochenen diese Waffen selbst führen.
- source_word: נִלְחָמִים בָּם
  choice: mit denen ihr … kämpft
  rationale: Gibt den instrumentalen Sinn der Präposition und die andauernde Kampfhandlung natürlich wieder.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Erhält die ethnisch-historische Bezeichnung des Ausgangstextes, statt sie zum allgemeineren „Babylonier“ zu vereinheitlichen.
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: die euch … belagern
  rationale: Der Zusammenhang von Stadtmauer und babylonischem Angriff verlangt eine konkrete Wiedergabe als Belagerung.
- source_word: מִחוּץ לַחוֹמָה
  choice: außerhalb der Mauer
  rationale: Gibt die räumliche Aussage direkt wieder; aus dem Kontext ist die Stadtmauer gemeint.
- source_word: וְאָסַפְתִּי אוֹתָם
  choice: und sie mitten in dieser Stadt sammeln
  rationale: „Sammeln“ bewahrt das Bild des hebräischen Verbs. Das Pronomen bleibt in der Übersetzung mehrdeutig, wie es auch im Ausgangstext möglich ist.
theological_decisions:
- issue: Bezugswort von אוֹתָם („sie“)
  choice: Im Haupttext bleibt das Pronomen formal mehrdeutig; der Satzbau legt als ersten Bezug die Kriegswaffen nahe.
  alternative: Das Pronomen kann sich auf den König von Babylon und die Chaldäer beziehen, sodass Jahwe die feindlichen Truppen in die Stadt bringt.
  rationale: „Kriegswaffen“ ist grammatisch ein passendes Bezugswort, doch die feindlichen Truppen sind kontextuell ebenfalls möglich. Die Übersetzung entscheidet diese echte Spannung nicht stillschweigend, sondern nennt die Alternative in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „So spricht“ erhält die prophetische Botenformel; „Seht“ gibt den feierlichen Nachdruck von הִנְנִי verständlich wieder. Die lange Satzbewegung des Hebräischen bleibt erkennbar, wurde aber durch eine klare deutsche Relativsatzstruktur lesbar gestaltet.
