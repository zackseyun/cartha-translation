  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/שְׁלֹ֨חַ אֵלָ֜י/ו הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ אֶת פַּשְׁחוּר֙ בֶּן מַלְכִּיָּ֔ה וְ/אֶת צְפַנְיָ֧ה בֶן מַעֲשֵׂיָ֛ה הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/001.yaml
  text: The word that came to Jeremiah from Yahweh when King Zedekiah sent to him Pashhur son of Malchiah and Zephaniah son of Maaseiah the priest[a], saying,
translation:
  language: de
  text: 'Das Wort, das von Jahwe an Jeremia erging, als König Zedekia Paschhur, den Sohn Malkijas, und den Priester Zefanja, den Sohn Maasejas, zu ihm sandte mit den Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: Bewahrt die geläufige prophetische Wortereignisformel; „Botschaft“ wäre möglich, aber stärker deutend.
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: das … an Jeremia erging
  rationale: Gibt die hebräische Offenbarungsformel idiomatisch und in würdigem modernem Deutsch wieder.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet die Herkunft; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בִּשְׁלֹחַ
  choice: als … sandte
  rationale: Der Infinitiv mit בְּ hat hier temporale Bedeutung.
- source_word: אֵלָיו
  choice: zu ihm
  rationale: Das Pronomen verweist eindeutig auf Jeremia und wird entsprechend beibehalten.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: König Zedekia
  rationale: Natürliche deutsche Stellung von Titel und Name.
- source_word: פַּשְׁחוּר בֶּן מַלְכִּיָּה
  choice: Paschhur, den Sohn Malkijas
  rationale: Die Namen werden in etablierter deutscher Bibelschreibung transliteriert; בֶּן wird transparent als „Sohn“ wiedergegeben.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: den Priester Zefanja, den Sohn Maasejas
  rationale: Die Stellung des Artikels bei הַכֹּהֵן und die unmittelbare Apposition sprechen dafür, „Priester“ auf Zefanja zu beziehen; die deutsche Umstellung macht diesen Bezug klar.
- source_word: לֵאמֹר
  choice: 'und sagen ließ:'
  rationale: Leitet die im folgenden Vers wiedergegebene Botschaft ein; zusammen mit „sandte“ ist „sagen ließ“ im Deutschen natürlicher als das partizipiale „sprechend“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als Eigenname.
- issue: Bezug von הַכֹּהֵן („der Priester“)
  choice: Titel Zefanjas
  alternative: Bezeichnung Maasejas
  rationale: Die Wortstellung kann im Deutschen missverständlich wirken. Grammatisch ist die Apposition zu Zefanja am naheliegendsten; diese Deutung wird durch die klare Umstellung ausgedrückt, ohne eine theologische Zusatzannahme einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt erkennbar; die Syntax wurde nur so weit umgestellt, wie es für Klarheit und natürliche deutsche Lesbarkeit nötig ist.
