base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/010.yaml
  text: For I have set my face against this city for harm and not for good[a], declares Yahweh. It will be given into the hand of the king of Babylon[b], and he will burn it with fire.
translation:
  language: de
  text: Denn ich habe mein Angesicht gegen diese Stadt gerichtet, zum Unheil und nicht zum Guten[a], spricht Jahwe. Sie wird in die Hand des Königs von Babel gegeben werden[b], und er wird sie mit Feuer verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Schaden“; wörtlicher auch: „zum Bösen“. Das hebräische Wort bezeichnet hier Unheil beziehungsweise ein schädigendes Gericht, nicht moralische Bosheit Gottes.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „in die Hand des Königs von Babel“; die Wendung bedeutet, dass die Stadt seiner Gewalt ausgeliefert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתִּי פָנַי
  choice: ich habe mein Angesicht gegen … gerichtet
  rationale: Die hebräische Wendung beschreibt entschlossene, hier feindliche Zuwendung. Die bildhafte Ausdrucksweise bleibt erhalten; „gegen“ ergibt sich aus dem folgenden Gerichtszweck.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: zum Unheil und nicht zum Guten
  rationale: רָעָה bezeichnet hier das über die Stadt kommende Unheil, nicht moralische Bosheit. „Zum Guten“ bewahrt den knappen, scharfen Gegensatz des Hebräischen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt נְאֻם würdig und natürlich wieder; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: in die Hand des Königs von Babel
  rationale: Die wörtlich bewahrte hebräische Wendung bezeichnet die Übergabe in die Gewalt des babylonischen Königs.
- source_word: תִּנָּתֵן
  choice: sie wird … gegeben werden
  rationale: Das feminine Pronomen nimmt „diese Stadt“ auf und entspricht dem passiven Nifal des Ausgangstextes.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: und er wird sie mit Feuer verbrennen
  rationale: Die aktive Verbform mit maskulinem Subjekt und femininem Objekt wird genau abgebildet. „Er“ verweist auf den König von Babel beziehungsweise auf ihn als handelnden Befehlshaber.
theological_decisions:
- issue: Göttliches Gericht in לְרָעָה
  choice: zum Unheil
  alternative: zum Bösen
  rationale: Im Zusammenhang ist ein von Gott bestimmtes Strafgericht gemeint. „Unheil“ wahrt die Härte der Aussage, ohne רָעָה hier als moralische Bosheit Gottes zu deuten.
- issue: Benennung Gottes durch יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname folgt unmittelbar dem hebräischen Gottesnamen und vermeidet die Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Bildrede „mein Angesicht … gerichtet“ und die Wendung „in die Hand“ bleiben erhalten; Fußnoten erläutern mögliche Missverständnisse. „Babel“ folgt der üblichen deutschen Bibelbezeichnung für das hebräische בָּבֶל.
