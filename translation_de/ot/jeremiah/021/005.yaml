source:
  edition: WLC
  text: וְ/נִלְחַמְתִּ֤י אֲנִי֙ אִתְּ/כֶ֔ם בְּ/יָ֥ד נְטוּיָ֖ה וּ/בִ/זְר֣וֹעַ חֲזָקָ֑ה וּ/בְ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֥צֶף גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/005.yaml
  text: And I myself will fight against you with an outstretched hand and a strong arm[b][a], and with anger and wrath and great fury.
translation:
  language: de
  text: Und ich selbst werde gegen euch kämpfen, mit ausgestreckter Hand und starkem Arm[a], mit Zorn, mit Grimm und mit großer Wut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mit ausgestreckter Hand und starkem Arm“ ist eine feste Wendung für Gottes entschiedenes, machtvolles Handeln. Häufig steht sie im Zusammenhang mit dem Auszug aus Ägypten; hier ist dieses Bild auf das Gericht gerichtet.
    reason: cross_reference
  - marker: b
    text: 'Oder: „mit großer Entrüstung“; das hebräische Wort bezeichnet heftigen Zorn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחַמְתִּי
  choice: Und … werde kämpfen
  rationale: Das Nifal von לחם bezeichnet hier feindliches Kämpfen. Die Futurform gibt die angekündigte Handlung natürlich wieder.
- source_word: אֲנִי
  choice: ich selbst
  rationale: Das selbstständige Pronomen verstärkt das bereits im Verb enthaltene Subjekt und betont Gottes persönliches Eingreifen.
- source_word: אִתְּכֶם
  choice: gegen euch
  rationale: Bei נלחם bezeichnet אֵת die Partei, gegen die gekämpft wird; der Gerichtskontext bestätigt die feindliche Bedeutung.
- source_word: בְּיָד נְטוּיָה
  choice: mit ausgestreckter Hand
  rationale: Die körperhafte Bildsprache wird bewahrt und bezeichnet machtvolles, entschlossenes göttliches Handeln.
- source_word: וּבִזְרֹעַ חֲזָקָה
  choice: und starkem Arm
  rationale: Die knappe Parallelformulierung zur ausgestreckten Hand bleibt erhalten; im Deutschen kann die Präposition bei der verbundenen Wortgruppe unmissverständlich mitgelten.
- source_word: וּבְאַף
  choice: mit Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet idiomatisch jedoch Zorn. „Zorn“ ist im prophetischen Register natürlich und würdig.
- source_word: וּבְחֵמָה
  choice: mit Grimm
  rationale: חֵמָה bezeichnet glühenden Zorn oder Grimm. „Grimm“ hält die Häufung verschiedener Zornesbegriffe erkennbar, ohne sie einzuebnen.
- source_word: וּבְקֶצֶף גָּדוֹל
  choice: mit großer Wut
  rationale: קֶצֶף bezeichnet heftigen Zorn beziehungsweise Entrüstung. „große Wut“ gibt die Steigerung durch גָּדוֹל klar wieder und bildet den Höhepunkt der Dreierfolge.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Handeln
  choice: „mit ausgestreckter Hand und starkem Arm“ als körperhafte Bildsprache beibehalten
  alternative: „mit großer Macht“
  rationale: Der hebräische Text setzt bewusst das aus anderen Zusammenhängen bekannte Bild entschiedener göttlicher Macht ein und richtet es hier auf das Gericht. Eine Paraphrase würde diese Spannung und den intertextuellen Nachhall abschwächen.
- issue: Gott selbst als Gegner Jerusalems
  choice: Die emphatische Aussage „ich selbst werde gegen euch kämpfen“ unverändert deutlich wiedergeben
  alternative: Die Aussage abschwächen, etwa zu „ich werde euch nicht helfen“
  rationale: Der Text beschreibt nicht bloß den Entzug von Hilfe, sondern Gottes unmittelbares, feindliches Handeln im Gericht. Diese theologische Härte darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Die dreifache Zornesformel wird durch „Zorn, Grimm, Wut“ differenziert wiedergegeben; die Wiederholung von „mit“ erhält den rhythmischen Nachdruck des Hebräischen.
