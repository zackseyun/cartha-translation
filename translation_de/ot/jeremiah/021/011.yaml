id: JER.21.11
reference: Jeremiah 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/לְ/בֵית֙ מֶ֣לֶךְ יְהוּדָ֔ה שִׁמְע֖וּ דְּבַר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/011.yaml
  text: 'And to the house of the king of Judah: Hear the word of Yahweh[a].'
translation:
  language: de
  text: 'Und zum Haus des Königs von Juda[a]: Hört das Wort Jahwes!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und über das Haus des Königs von Juda“. Die hebräische Präposition kann hier eine neue Rede einleiten, die an das Königshaus gerichtet ist oder es zum Thema hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית
  choice: Und zum Haus
  rationale: ו verbindet den neuen Abschnitt mit dem Vorangehenden; ל kann hier die Angesprochenen bezeichnen oder das Thema einführen. „Zum Haus“ bewahrt die Anredewirkung, während „Haus“ sowohl den königlichen Haushalt als auch das Königshaus bezeichnen kann.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die hebräische Genitivverbindung wird in natürlichem Standarddeutsch wiedergegeben.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ steht im Plural und richtet sich somit an das Königshaus als Personengruppe. „Hört“ bewahrt die knappe prophetische Aufforderung.
- source_word: דְּבַר
  choice: das Wort
  rationale: „Wort“ erhält die feste prophetische Wendung und die Vorstellung einer von Gott ausgehenden Botschaft, ohne sie paraphrasierend einzuengen.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird im Deutschen mit der gebräuchlichen Form „Jahwe“ wiedergegeben; der Genitiv fügt sich natürlich in „das Wort Jahwes“ ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Präposition ל vor „Haus des Königs“
  choice: 'an das Königshaus gerichtete Aussage: „zum Haus“'
  alternative: 'das Königshaus als Thema: „über das Haus“'
  rationale: Die Präposition kann in diesem Übergang sowohl den Adressaten als auch den Gegenstand der folgenden Rede markieren. Der Haupttext folgt der naheliegenden Anredefunktion; die Fußnote hält die sachliche Alternative offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzform. „Haus des Königs“ bleibt bewusst erhalten, da der Ausdruck den königlichen Haushalt beziehungsweise das Königshaus bezeichnet und nicht sicher auf den Palast als Gebäude zu verengen ist.
