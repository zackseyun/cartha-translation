  naturalness: '„Und zum Haus des Königs von Juda: Hört das Wort Jahwes!“ ist knapp, verständlich und im modernen würdigen Deutsch für eine prophetische Anrede angemessen. Die elliptische Einleitung mit Doppelpunkt bildet die hebräische Abschnittseröffnung sinnvoll nach.'
  terminology: „Jahwe“ ist eine im Deutschen etablierte Wiedergabe des Tetragramms; der Genitiv „Jahwes“ ist korrekt. „Wort“ wahrt die traditionelle prophetische Ausdrucksweise. Die Fußnote gibt die semantische Offenheit von לְ angemessen wieder.
