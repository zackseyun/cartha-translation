source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֣ן נְאֻם יְהוָ֡ה אֶתֵּ֣ן אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֣ה וְ/אֶת עֲבָדָ֣י/ו וְ/אֶת הָ/עָ֡ם וְ/אֶת הַ/נִּשְׁאָרִים֩ בָּ/עִ֨יר הַ/זֹּ֜את מִן הַ/דֶּ֣בֶר מִן הַ/חֶ֣רֶב וּ/מִן הָ/רָעָ֗ב בְּ/יַד֙ נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וּ/בְ/יַד֙ אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הִכָּ֣/ם לְ/פִי חֶ֔רֶב לֹֽא יָח֣וּס עֲלֵי/הֶ֔ם וְ/לֹ֥א יַחְמֹ֖ל וְ/לֹ֥א יְרַחֵֽם־־־־־׀־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/007.yaml
  text: And after that[a], declares Yahweh, I will give Zedekiah king of Judah, his servants, the people, and those left in this city from the plague, from the sword, and from the famine into the hand of Nebuchadnezzar king of Babylon, into the hand of their enemies, and into the hand of those seeking their life; and he will strike them down with the edge of the sword. He will not spare them or have pity or compassion.
translation:
  language: de
  text: 'Und danach – Ausspruch Jahwes – werde ich Zedekia, den König von Juda, seine Diener, das Volk und die, die in dieser Stadt von der Seuche, dem Schwert und dem Hunger übrig geblieben sind, in die Hand Nebukadnezars[a], des Königs von Babylon, geben: in die Hand ihrer Feinde und in die Hand derer, die ihnen nach dem Leben trachten. Er wird sie mit der Schneide des Schwertes erschlagen. Er wird sie weder verschonen noch Mitleid mit ihnen haben noch sich über sie erbarmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Nebukadrezar“; im Deutschen traditionell meist „Nebukadnezar“.'
    reason: Der masoretische Text bietet hier die Namensform נְבוּכַדְרֶאצַּר mit r, während die traditionelle deutsche Form ein n hat.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Und danach
  rationale: Bewahrt die zeitliche Abfolge und knüpft den Vers natürlich an das Vorhergehende an.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feierliche prophetische Botenformel knapp wieder und bewahrt zugleich den Gottesnamen.
- source_word: אֶתֵּן ... בְּיַד
  choice: werde ich ... in die Hand ... geben
  rationale: Bewahrt sowohl das einfache Verb ‚geben‘ als auch das wiederholte hebräische Bild der Hand als Machtbereich.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Die breite Bezeichnung kann im königlichen Zusammenhang auch Amtsträger einschließen, ohne deren Rang ausdrücklich festzulegen.
- source_word: הַנִּשְׁאָרִים
  choice: alle, die ... übrig geblieben sind
  rationale: Bezeichnet die nach den vorausgehenden Katastrophen Verbliebenen, ohne den möglicherweise theologisch aufgeladenen Ausdruck ‚Rest‘ einzuführen.
- source_word: הַדֶּבֶר
  choice: die Seuche
  rationale: Eine verständliche moderne Wiedergabe für eine tödliche epidemische Krankheit.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: die ihnen nach dem Leben trachten
  rationale: Gibt die hebräische Wendung idiomatisch wieder und macht die feindliche Tötungsabsicht deutlich.
- source_word: לְפִי חֶרֶב
  choice: mit der Schärfe des Schwertes
  rationale: Bewahrt das konkrete hebräische Bild vom ‚Mund‘ beziehungsweise der Schneide des Schwertes in natürlichem Deutsch.
- source_word: לֹא יָחוּס ... וְלֹא יַחְמֹל וְלֹא יְרַחֵם
  choice: weder verschonen noch Mitleid mit ihnen haben noch sich über sie erbarmen
  rationale: Erhält die dreifache Verneinung und die rhetorische Steigerung der drei eng verwandten Verben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Subjekt von וְהִכָּם und den folgenden Verben
  choice: Er, das heißt Nebukadnezar
  alternative: unpersönliche oder auf mehrere Feinde bezogene Wiedergabe
  rationale: Das hebräische Verb steht im maskulinen Singular; der nächstliegende ausdrücklich genannte singularische Handelnde ist der König von Babylon. Die Übersetzung belässt das Subjekt jedoch als Pronomen und fügt keine zusätzliche Auslegung in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „in die Hand“ und die dreifache Verneinung wurden wegen ihrer rhetorischen Bedeutung beibehalten; die Satzstruktur wurde zugleich so gegliedert, dass der lange hebräische Satz gut verständlich bleibt.
