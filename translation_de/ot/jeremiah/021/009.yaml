source:
  edition: WLC
  text: הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב וּ/בָ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יּוֹצֵא֩ וְ/נָפַ֨ל עַל הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עֲלֵי/כֶם֙ יחיה וְ/הָֽיְתָה לּ֥/וֹ נַפְשׁ֖/וֹ לְ/שָׁלָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/009.yaml
  text: The one who stays in this city will die by the sword[a], by famine, and by pestilence; but the one who goes out and defects to the Chaldeans who are besieging you will live[b], and his life will be to him as plunder.
translation:
  language: de
  text: Wer in dieser Stadt bleibt, wird durch Schwert, Hunger und Pest sterben. Wer aber hinausgeht und zu den Chaldäern überläuft, die euch belagern, wird am Leben bleiben, und sein Leben wird ihm zur Beute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sein Leben wird ihm zur Beute sein.“ Gemeint ist: Aus der Katastrophe rettet er nur sein Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: Wer in dieser Stadt bleibt
  rationale: Das Partizip von ישׁב bezeichnet im Belagerungskontext das Verbleiben in der Stadt, nicht bloß Sitzen oder Wohnen.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: durch Schwert, Hunger und Pest
  rationale: Die feste Gerichtstrias Jeremias wird konkret und in natürlichem Deutsch wiedergegeben; „Schwert“ bewahrt das Bild des hebräischen חֶרֶב.
- source_word: וְהַיּוֹצֵא וְנָפַל עַל
  choice: Wer aber hinausgeht und … überläuft
  rationale: נפל על ist hier eine militärisch-politische Wendung für den Übertritt zum belagernden Feind. „Überlaufen“ gibt die Bedeutung idiomatisch wieder; „aber“ macht den sachlichen Gegensatz deutlich.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die ethnische Bezeichnung des Ausgangstextes wird beibehalten, statt sie historisch erklärend durch „Babylonier“ zu ersetzen.
- source_word: הַצָּרִים עֲלֵיכֶם
  choice: die euch belagern
  rationale: Das Partizip von צור bezeichnet in diesem Zusammenhang das Einschließen beziehungsweise Belagern einer Stadt.
- source_word: יִחְיֶה
  choice: wird am Leben bleiben
  rationale: Die Form bedeutet wörtlich „wird leben“; im Zusammenhang drückt sie das Überleben der Belagerung aus. Die deutsche Wendung bleibt nah am Lebensmotiv.
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: und sein Leben wird ihm wie Beute zufallen
  rationale: Die Metapher der Beute bleibt erhalten und wird zugleich in verständliches modernes Deutsch gebracht. Gemeint ist, dass ihm aus der Katastrophe nur sein Leben bleibt.
- source_word: נַפְשׁוֹ
  choice: sein Leben
  rationale: נפשׁ bezeichnet in dieser Überlebenswendung das konkrete Leben, nicht eigens eine immaterielle Seele.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ in der Überlebenswendung
  choice: „sein Leben“
  alternative: „seine Seele“
  rationale: Der Zusammenhang handelt vom körperlichen Überleben während der Belagerung. „Seele“ würde eine anthropologische Aussage nahelegen, die der hebräische Ausdruck hier nicht eigens macht.
- issue: Charakter des Hinausgehens zu den Chaldäern
  choice: „zu den Chaldäern überläuft“
  alternative: „sich den Chaldäern ergibt“
  rationale: Die Wendung נפל על kann den Übertritt zur gegnerischen Seite bezeichnen. „Überlaufen“ wahrt diesen stärkeren politischen und militärischen Sinn, ohne das Handeln lediglich als formelle Kapitulation festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die singularischen Partizipien werden mit dem inklusiven „Wer“ wiedergegeben. Die Beutemetapher bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
