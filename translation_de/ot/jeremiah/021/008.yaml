id: JER.21.8
reference: Jeremiah 21:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֤ם הַ/זֶּה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֤י נֹתֵן֙ לִ/פְנֵי/כֶ֔ם אֶת דֶּ֥רֶךְ הַ/חַיִּ֖ים וְ/אֶת דֶּ֥רֶךְ הַ/מָּֽוֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/008.yaml
  text: 'And to this people you shall say[a], ‘Thus says Yahweh: Behold, I am setting before you the way of life and the way of death.’'
translation:
  language: de
  text: 'Und zu diesem Volk sollst du sagen: »So spricht Jahwe: Siehe, ich stelle euch den Weg des Lebens und den Weg des Todes vor.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »gebe ich vor euch«; die hebräische Wendung bedeutet hier, dass Jahwe ihnen zwei Wege beziehungsweise Möglichkeiten vorlegt.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: וְאֶל הָעָם הַזֶּה
  choice: Und zu diesem Volk
  rationale: Das einleitende וְ hält die Verbindung zum vorherigen Zusammenhang aufrecht; עָם bleibt als kollektiver Singular »Volk« erhalten.
- source_word: תֹּאמַר
  choice: sollst du sagen
  rationale: Das Imperfekt hat hier anweisende Kraft und richtet den Sprechauftrag an Jeremia.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: »Siehe« erhält das feierliche Aufmerksamkeitssignal und verbindet sich im Deutschen natürlich mit dem folgenden Gotteswort.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: stelle euch … vor
  rationale: נתן bedeutet wörtlich »geben«, bildet mit »vor euch« hier jedoch die Wendung für das Vorlegen zweier Möglichkeiten. Die Präsensform gibt die aktuelle bzw. unmittelbar bevorstehende Handlung wieder.
- source_word: דֶּרֶךְ הַחַיִּים
  choice: den Weg des Lebens
  rationale: Die Genitivfügung bildet die hebräische Konstruktion nach und wahrt, ob der Weg durch Leben gekennzeichnet ist oder zum Leben führt.
- source_word: דֶּרֶךְ הַמָּוֶת
  choice: den Weg des Todes
  rationale: Die parallele Formulierung erhält den scharf ausgewogenen Gegensatz von Leben und Tod.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; die im Deutschen übliche Form »Jahwe« bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung der Wege von Leben und Tod
  choice: Weg des Lebens / Weg des Todes
  alternative: Weg zum Leben / Weg zum Tod
  rationale: Die Genitivform bewahrt die knappe Ausdrucksweise und legt nicht vorschnell fest, ob die Wege als Lebens- und Todesweise oder als Wege zu den jeweiligen Ergebnissen verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener prophetischer Formel und paralleler Bildsprache. »Siehe« ist gegenüber dem umgangssprachlicheren »Seht« vorzuziehen, da im Hebräischen Gott selbst in der ersten Person spricht und das Wort als feierliches Aufmerksamkeitssignal dient.
