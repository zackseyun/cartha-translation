source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלַ֜יִ/ךְ יֹשֶׁ֧בֶת הָ/עֵ֛מֶק צ֥וּר הַ/מִּישֹׁ֖ר נְאֻם יְהוָ֑ה הָ/אֹֽמְרִים֙ מִֽי יֵחַ֣ת עָלֵ֔י/נוּ וּ/מִ֥י יָב֖וֹא בִּ/מְעוֹנוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/021/013.yaml
  text: Behold[a], I am against you, O inhabitant of the valley, O rock of the plain, declares Yahweh—you who say, “Who will come down against us[b], and who will enter into our dwellings?”
translation:
  language: de
  text: 'Siehe, ich bin gegen dich, du Bewohnerin des Tals, du Fels der Ebene – Spruch Jahwes –, ihr, die ihr sagt: »Wer wird gegen uns herabkommen[a], und wer wird in unsere Wohnstätten kommen[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb ist an dieser Stelle schwierig; auch möglich: »Wer wird gegen uns herabsteigen?« Gemeint ist offenbar die Überzeugung der Stadt, vor einem Angriff sicher zu sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Wohnstätten«; möglicherweise schwingt die Bedeutung sicherer Wohnorte oder Zufluchtsstätten mit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלַיִךְ
  choice: Siehe, ich bin gegen dich
  rationale: Die feste Wendung kündigt hier feierlich Jahwes feindliches Einschreiten an. „Siehe“ bewahrt den prophetischen Nachdruck; „gegen dich“ gibt den Sinn der Präposition im Gerichtszusammenhang wieder.
- source_word: יֹשֶׁבֶת הָעֵמֶק
  choice: du Bewohnerin des Tals
  rationale: Das feminine Singularpartizip redet die personifizierte Stadt unmittelbar an. „Bewohnerin“ erhält Genus, Numerus und die topografische Bezeichnung.
- source_word: צוּר הַמִּישֹׁר
  choice: du Fels der Ebene
  rationale: Die konkrete Metapher „Fels“ bleibt erhalten, statt sie deutend durch „Festung“ zu ersetzen. מִישׁוֹר wird mit dem geläufigen geografischen Ausdruck „Ebene“ wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die knappe prophetische Formel wird in idiomatischer, würdevoller Form wiedergegeben; der Gottesname erscheint als „Jahwe“.
- source_word: הָאֹמְרִים
  choice: die ihr sagt
  rationale: Der hebräische Text wechselt von der feminin-singularischen Anrede der personifizierten Stadt zum Plural ihrer Bewohner. Die Formulierung bewahrt diesen rhetorischen Numeruswechsel.
- source_word: מִי יֵחַת עָלֵינוּ
  choice: Wer wird gegen uns herabsteigen
  rationale: Das schwierige Verb wird in seinem wahrscheinlichen militärisch-topografischen Sinn verstanden. „Herabsteigen“ bewahrt das Bewegungsbild, ohne es zu einer bloßen Aussage über einen Angriff zu verflachen.
- source_word: וּמִי יָבוֹא בִּמְעוֹנוֹתֵינוּ
  choice: und wer wird in unsere Wohnstätten eindringen
  rationale: „Wohnstätten“ bleibt nahe bei מְעוֹנוֹת und vermeidet die interpretierende Festlegung auf „Festungen“. „Eindringen“ macht im Deutschen die feindliche Bewegung in diese Orte natürlich und kontextgerecht deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen im Deutschen unmittelbar wieder und entspricht der für diese Vorlage angegebenen Projektentscheidung.
- issue: Feminin-singularische Stadtanrede neben pluralischer Rede der Bewohner
  choice: Den Numeruswechsel als „du Bewohnerin …, die ihr sagt“ bewahren
  alternative: Die gesamte Anrede entweder in den Singular oder in den Plural angleichen
  rationale: Der hebräische Text verbindet die personifizierte Stadt mit ihren pluralisch sprechenden Bewohnern. Die leichte Spannung wird nicht geglättet.
- issue: Deutung von צוּר als Verteidigungsmetapher
  choice: Fels
  alternative: Festung
  rationale: 'Die Bildsprache bleibt offen: Der Fels kann Sicherheit und Unbezwingbarkeit andeuten, wird aber nicht ausdrücklich als Festung erklärt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Nachdruck. Die ungewöhnliche Topografie und der Wechsel von der femininen Singularanrede zum Plural wurden bewusst bewahrt; Gedankenstriche setzen die Spruchformel klar ab.
