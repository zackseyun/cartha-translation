  text: קְבוּרַ֥ת חֲמ֖וֹר יִקָּבֵ֑ר סָח֣וֹב וְ/הַשְׁלֵ֔ךְ מֵ/הָ֖לְאָה לְ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/019.yaml
  text: He will be buried with the burial of a donkey—dragged off and thrown out beyond the gates of Jerusalem[a][b].
translation:
  language: de
  text: 'Wie ein Esel wird er begraben: fortgeschleift und jenseits der Tore Jerusalems hinausgeworfen.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Mit dem Begräbnis eines Esels wird er begraben«; auch möglich: »Er wird wie ein Esel begraben.«'
    reason: lexical_alternative
  - marker: b
    text: Das Bild bezeichnet die schändliche Beseitigung des Leichnams außerhalb der Stadt anstelle einer ehrenvollen Bestattung.
    reason: cultural_note
lexical_decisions:
- source_word: קְבוּרַת חֲמוֹר
  choice: wie ein Esel
  rationale: Die hebräische Genitivverbindung bedeutet wörtlich »Begräbnis eines Esels« und beschreibt hier vergleichend die entehrende Art, wie sein Leichnam beseitigt wird. Die gewählte Formulierung ist im modernen Deutschen natürlich; die wörtlichere Struktur bleibt in Fußnote [a] erhalten.
- source_word: יִקָּבֵר
  choice: wird er begraben
  rationale: Das Nifal Imperfekt von קבר wird als zukünftiges Passiv wiedergegeben. Zusammen mit dem folgenden Bild hat »begraben« einen bitter-ironischen Klang, da keine ehrenvolle Bestattung gemeint ist.
- source_word: סָחוֹב
  choice: Man wird ihn fortschleifen
  rationale: Der Infinitivus absolutus schildert das gewaltsame Wegschleifen des Leichnams. Ein unpersönliches »man« gibt den sachlich Handelnden wieder, ohne im Hebräischen nicht genannte Täter einzuführen.
- source_word: וְהַשְׁלֵךְ
  choice: und … hinauswerfen
  rationale: Das Verb שלך bezeichnet ein Werfen oder Schleudern. »Hinauswerfen« bewahrt die gewaltsame Bildsprache und bringt in Verbindung mit den Stadttoren die Bewegung aus der Stadt heraus zum Ausdruck.
- source_word: מֵהָלְאָה לְשַׁעֲרֵי
  choice: jenseits der Tore
  rationale: מֵהָלְאָה bezeichnet den Bereich weiter weg beziehungsweise jenseits eines Bezugspunktes. Die Formulierung gibt die räumliche Lage außerhalb der Jerusalemer Tore knapp und natürlich wieder.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Art des Vergleichs beim Eselsbegräbnis
  choice: Die Aussage beschreibt eine schändliche Beseitigung des Leichnams nach Art eines verendeten Esels, nicht eine ehrenvolle menschliche Bestattung.
  alternative: Die Wendung lediglich als neutrale Angabe einer besonderen Bestattungsart zu verstehen.
  rationale: Die anschließenden Verben »fortschleifen« und »hinauswerfen« machen Entehrung und Ausschluss aus einer ordentlichen Bestattung deutlich. Die Übersetzung lässt zugleich die Spannung bestehen, dass der Vorgang im Text dennoch »begraben« genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert die allgemeine Ankündigung und ihre konkrete Ausführung. Das unpersönliche »man« vermeidet einen nicht genannten Täter; »fortschleifen« und »hinauswerfen« erhalten die Härte des hebräischen Bildes.
