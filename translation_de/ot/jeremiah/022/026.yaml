  variant: modern standard German
source:
  edition: WLC
  text: וְ/הֵֽטַלְתִּ֣י אֹתְ/ךָ֗ וְ/אֶֽת אִמְּ/ךָ֙ אֲשֶׁ֣ר יְלָדַ֔תְ/ךָ עַ֚ל הָ/אָ֣רֶץ אַחֶ֔רֶת אֲשֶׁ֥ר לֹֽא יֻלַּדְתֶּ֖ם שָׁ֑ם וְ/שָׁ֖ם תָּמֽוּתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/026.yaml
  text: And I will hurl you and your mother who gave birth to you into another land[a], where you were not born, and there you will die.
translation:
  language: de
  text: Und ich werde dich und deine Mutter, die dich geboren hat, in ein anderes Land schleudern, in dem ihr[a] nicht geboren seid; dort werdet ihr sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt die Anrede vom Singular („dich“) zum Plural („ihr … seid“, „ihr werdet“), weil nun der König und seine Mutter gemeinsam angesprochen werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: ich werde … schleudern
  rationale: Der Hifil-Stamm bezeichnet hier ein gewaltsames Werfen beziehungsweise Verstoßen. „Schleudern“ bewahrt den Nachdruck des angekündigten Gerichts und ist zugleich klares modernes Deutsch.
- source_word: אֹתְךָ וְאֶת אִמְּךָ
  choice: dich und deine Mutter
  rationale: Die beiden koordinierten Objekte werden unmittelbar wiedergegeben. Das zunächst singularische „dich“ geht später folgerichtig in die Anrede beider mit „ihr“ über.
- source_word: אֲשֶׁר יְלָדַתְךָ
  choice: die dich geboren hat
  rationale: Der Relativsatz bezieht sich auf die Mutter. Diese Formulierung ist präzise, natürlich und näher am Geburtsvorgang als das mehrdeutige „die dich getragen hat“.
- source_word: עַל הָאָרֶץ אַחֶרֶת
  choice: in ein anderes Land
  rationale: עַל kann bei einem Verb des Werfens die Bewegung auf beziehungsweise in einen Zielbereich ausdrücken. Im Zusammenhang der Verbannung ist „in ein anderes Land“ idiomatisch und bewahrt die territoriale Bedeutung von אֶרֶץ.
- source_word: אֲשֶׁר לֹא יֻלַּדְתֶּם שָׁם
  choice: in dem ihr nicht geboren seid
  rationale: Das pluralische Passiv bezieht den König und seine Mutter gemeinsam ein. Das deutsche „ihr“ macht den Numeruswechsel des Hebräischen sichtbar.
- source_word: וְשָׁם תָּמֽוּתוּ
  choice: dort werdet ihr sterben
  rationale: Auch dieses Verb steht im Plural und richtet die sichere Gerichtsankündigung an beide Personen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schleudern“ erhält die Härte des prophetischen Gerichtswortes; der Wechsel von „dich“ zu „ihr“ bildet die hebräische Numerusverschiebung transparent ab.
