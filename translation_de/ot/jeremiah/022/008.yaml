id: JER.22.8
reference: Jeremiah 22:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָֽבְרוּ֙ גּוֹיִ֣ם רַבִּ֔ים עַ֖ל הָ/עִ֣יר הַ/זֹּ֑את וְ/אָֽמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/עִ֥יר הַ/גְּדוֹלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/008.yaml
  text: And many nations will pass by this city[a], and each man will say to his neighbor[b], ‘Why has Yahweh done thus to this great city?’
translation:
  language: de
  text: 'Viele Völker werden an dieser Stadt vorbeiziehen[a], und einer wird zum anderen sagen[b]: »Warum hat Jahwe dieser großen Stadt das angetan?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „an dieser Stadt entlangziehen“. Die hebräische Verbindung kann eine Bewegung an der Stadt vorbei oder an ihr entlang bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein Mann zu seinem Gefährten“; eine distributive Wendung für Menschen, die miteinander sprechen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וְעָבְרוּ ... עַל הָעִיר הַזֹּאת
  choice: werden an dieser Stadt vorbeiziehen
  rationale: Das Qal-Perfekt mit וְ steht in der prophetischen Folge für ein zukünftiges Geschehen. עַל nach עבר bezeichnet hier am ehesten eine Bewegung an der Stadt vorbei; „vorbeiziehen“ gibt dies im Deutschen natürlich wieder.
- source_word: גּוֹיִם רַבִּים
  choice: viele Völker
  rationale: גּוֹיִם bezeichnet hier kollektive Volksgemeinschaften außerhalb Judas. „Völker“ ist im Deutschen natürlich und vermeidet die moderne staatsrechtliche Färbung von „Nationen“.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: einer ... zum anderen
  rationale: Die hebräische Wendung ist distributiv und beschreibt, wie einzelne Vorüberziehende miteinander sprechen. Die deutsche Paarformel gibt diese wechselseitige Bedeutung idiomatisch wieder.
- source_word: עַל מֶה
  choice: Warum
  rationale: Die Wendung fragt nach dem Grund und wird im Deutschen knapp und natürlich mit „Warum“ wiedergegeben.
- source_word: עָשָׂה ... כָּכָה לָעִיר
  choice: hat ... dieser Stadt das angetan
  rationale: „Das“ verweist auf den sichtbar gewordenen Zustand der Stadt und bewahrt die rückverweisende Kraft von כָּכָה. „Antun“ entspricht der Konstruktion עשה ... ל und passt zur erschütterten Frage der Vorüberziehenden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הָעִיר הַגְּדוֹלָה הַזֹּאת
  choice: dieser großen Stadt
  rationale: „Groß“ kann sowohl Ausmaß als auch Bedeutung ausdrücken und entspricht der offenen Bedeutung von גָּדוֹל.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ erhält den Unterschied zwischen Eigenname und Herrschaftstitel.
- issue: Distributive, grammatisch maskuline Wendung אִישׁ אֶל רֵעֵהוּ
  choice: einer wird zum anderen sagen
  alternative: jeder Mann wird zu seinem Gefährten sagen
  rationale: Die Wendung bezeichnet idiomatisch einzelne Personen, die miteinander reden; sie behauptet nicht ausdrücklich, dass ausschließlich Männer gemeint sind. Die deutsche distributive Form bewahrt den Singular und die Gegenseitigkeit, ohne das Geschlecht stärker festzulegen als der hebräische Idiomgebrauch.
- issue: Ursache der Zerstörung der großen Stadt
  choice: als offene Frage der Vorüberziehenden belassen
  alternative: den Grund als göttliches Gericht ausdrücklich ergänzen
  rationale: Der Vers nennt den Grund noch nicht, sondern lässt ihn erst erfragen. Eine ausdrückliche Deutung als Gericht würde die Antwort des folgenden Verses vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vorbeiziehen“ und „das angetan“ sind allgemein verständlich und bewahren zugleich den prophetischen und erschütterten Ton. Die direkte Rede steht in deutschen Anführungszeichen.
