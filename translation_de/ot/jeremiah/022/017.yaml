id: JER.22.17
reference: Jeremiah 22:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אֵ֤ין עֵינֶ֨י/ךָ֙ וְ/לִבְּ/ךָ֔ כִּ֖י אִם עַל בִּצְעֶ֑/ךָ וְ/עַ֤ל דַּֽם הַ/נָּקִי֙ לִ/שְׁפּ֔וֹךְ וְ/עַל הָ/עֹ֥שֶׁק וְ/עַל הַ/מְּרוּצָ֖ה לַ/עֲשֽׂוֹת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/017.yaml
  text: But your eyes and your heart are set on nothing except your dishonest gain[a], on shedding innocent blood, and on practicing oppression and extortion.
translation:
  language: de
  text: Doch deine Augen und dein Herz sind auf nichts anderes gerichtet als auf deinen unrechtmäßigen Gewinn, darauf, unschuldiges Blut zu vergießen, und darauf, Unterdrückung und Gewalt[a] zu verüben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene hebräische Wort kann auch rücksichtsloses Unrecht oder Erpressung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Die Konjunktion markiert hier den Gegensatz zum zuvor beschriebenen gerechten Verhalten Josias; „Doch“ gibt diesen Kontrast im modernen Deutschen knapp wieder.
- source_word: אֵין ... כִּי אִם
  choice: sind auf nichts anderes gerichtet als auf
  rationale: Die hebräische Ausschließlichkeitskonstruktion bezeichnet die alleinige Ausrichtung. Diese Formulierung ist natürliches Deutsch und bewahrt zugleich das Bild von Augen und Herz.
- source_word: עֵינֶיךָ וְלִבְּךָ
  choice: deine Augen und dein Herz
  rationale: 'Die Körperbegriffe werden wörtlich bewahrt: Die Augen stehen für Aufmerksamkeit und Begehren, das Herz für Denken, Wollen und Absicht.'
- source_word: בִּצְעֶךָ
  choice: deinen unrechtmäßigen Gewinn
  rationale: בֶּצַע bezeichnet hier Gewinn, der durch Habgier und Ausbeutung erlangt wird. „Unrechtmäßiger Gewinn“ erhält sowohl den materiellen als auch den moralischen Aspekt.
- source_word: דַּם הַנָּקִי
  choice: unschuldiges Blut
  rationale: Die geläufige biblische Wendung bezeichnet das Blut schuldloser Menschen und lässt sich im Deutschen ebenso prägnant wiedergeben.
- source_word: לִשְׁפּוֹךְ
  choice: zu vergießen
  rationale: „Blut vergießen“ ist die natürliche deutsche Entsprechung des hebräischen Ausdrucks und bezeichnet hier das Töten Unschuldiger.
- source_word: הָעֹשֶׁק
  choice: Unterdrückung
  rationale: Das Wort umfasst bedrückende Ausbeutung, Beraubung und soziale Entrechtung; „Unterdrückung“ bewahrt diesen breiten prophetischen Sinn.
- source_word: הַמְּרוּצָה
  choice: Gewalt
  rationale: Das seltene Wort bezeichnet im Zusammenhang wahrscheinlich gewaltsames oder rücksichtsloses Unrecht. Die breite Wiedergabe „Gewalt“ vermeidet eine zu enge Festlegung; die lexikalische Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: לַעֲשׂוֹת
  choice: zu verüben
  rationale: Bei „Unterdrückung und Gewalt“ ist „verüben“ idiomatischer als das wörtliche „tun“ und bringt das tatsächliche Ausführen dieser Untaten zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Ausrichtung auf Gewinn, Blutvergießen und Gewalttaten bleibt erkennbar; die Metapher von Augen und Herz wird nicht aufgelöst.
