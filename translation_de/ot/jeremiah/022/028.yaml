  text: הַ/עֶ֨צֶב נִבְזֶ֜ה נָפ֗וּץ הָ/אִ֤ישׁ הַ/זֶּה֙ כָּנְיָ֔הוּ אִ֨ם כְּלִ֔י אֵ֥ין חֵ֖פֶץ בּ֑/וֹ מַדּ֤וּעַ הֽוּטֲלוּ֙ ה֣וּא וְ/זַרְע֔/וֹ וְ/הֻ֨שְׁלְכ֔וּ עַל הָ/אָ֖רֶץ אֲשֶׁ֥ר לֹא יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/028.yaml
  text: Is this man Coniah a despised[a], broken vessel[b], or a vessel in which there is no delight? Why have he and his offspring been hurled out and cast into a land that they did not know?
translation:
  language: de
  text: Ist dieser Mann Konja ein verachtetes, zerschlagenes Gebilde[a] oder ein Gefäß, an dem niemand Gefallen findet? Warum wurden er und seine Nachkommen fortgeschleudert und in ein Land geworfen, das sie nicht kannten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein verachtetes, zerschlagenes Bild“, möglicherweise auch „Götzenbild“. Das hebräische Wort bezeichnet etwas von Menschenhand Geformtes; der Zusammenhang mit „Gefäß“ kann an einen zerbrechlichen Gegenstand denken lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶצֶב
  choice: Gebilde
  rationale: Das Substantiv bezeichnet etwas von Menschenhand Geformtes und kann insbesondere ein Bild oder Götzenbild meinen. „Gebilde“ bewahrt diese Offenheit; der folgende Ausdruck „Gefäß“ lässt zugleich an einen zerbrechlichen Gegenstand denken.
- source_word: נִבְזֶה נָפוּץ
  choice: verachtetes, zerschlagenes
  rationale: „Verachtet“ gibt den passiven Schandstatus wieder; „zerschlagen“ passt zur Darstellung eines geformten, zerbrechlichen Gegenstands, ohne das erste Substantiv vorschnell auf „Topf“ festzulegen.
- source_word: כָּנְיָהוּ
  choice: Konja
  rationale: Die deutsche Transliteration folgt der hier tatsächlich stehenden Kurzform des Königsnamens, der andernorts als Jojachin bzw. Jechonja erscheint.
- source_word: אִם
  choice: oder
  rationale: In der rhetorischen Frage führt אִם die zweite Alternative ein.
- source_word: כְּלִי אֵין חֵפֶץ בּוֹ
  choice: ein Gefäß, an dem niemand Gefallen hat
  rationale: Die Formulierung bewahrt חֵפֶץ als „Gefallen“ und ist im heutigen Deutsch natürlicher als eine unpersönliche Wendung mit „kein Gefallen“.
- source_word: הוּטֲלוּ ... וְהֻשְׁלְכוּ
  choice: wurden ... fortgeschleudert und ... geworfen
  rationale: Die beiden Passivformen schildern eine gewaltsame Ausstoßung; die Übersetzung erhält die verbale Doppelung.
- source_word: הוּא וְזַרְעוֹ
  choice: er und seine Nachkommen
  rationale: זֶרַע bezeichnet hier die familiäre Nachkommenschaft; „Nachkommen“ ist idiomatisches modernes Deutsch.
- source_word: עַל הָאָרֶץ אֲשֶׁר לֹא יָדָעוּ
  choice: in ein Land ..., das sie nicht kannten
  rationale: Im Zusammenhang der Verbannung bezeichnet die Präpositionalfügung das Zielland; der Plural des Verbs bezieht sich auf Konja und seine Nachkommen.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage und die gewaltsame Bildsprache bleiben erhalten. „Gebilde“ wahrt die lexikalische Mehrdeutigkeit von הָעֶצֶב, statt sie ohne zwingenden Grund auf „Topf“ oder „Götzenbild“ zu verengen.
