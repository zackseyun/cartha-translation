source:
  edition: WLC
  text: כָּל רֹעַ֨יִ/ךְ֙ תִּרְעֶה ר֔וּחַ וּֽ/מְאַהֲבַ֖יִ/ךְ בַּ/שְּׁבִ֣י יֵלֵ֑כוּ כִּ֣י אָ֤ז תֵּבֹ֨שִׁי֙ וְ/נִכְלַ֔מְתְּ מִ/כֹּ֖ל רָעָתֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/022.yaml
  text: All your shepherds the wind will shepherd[a], and your lovers will go into captivity[b]; then you will surely be ashamed and humiliated because of all your evil.
translation:
  language: de
  text: Alle deine Hirten wird der Wind forttreiben[a], und deine Liebhaber werden in die Gefangenschaft ziehen[b]. Dann wirst du beschämt und gedemütigt sein wegen all deiner Bosheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Alle deine Führer wird der Wind zerstreuen.« Im Hebräischen gehören »deine Hirten« und das Verb, das vom Wind ausgesagt wird, derselben Wortwurzel an; dadurch entsteht ein ironisches Wortspiel.'
    reason: lexical_alternative
  - marker: b
    text: »Liebhaber« ist hier ein prophetisches Bild für Judas politische Verbündete und treulose Bindungen.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעַיִךְ
  choice: deine Hirten
  rationale: Die wörtliche Wiedergabe bewahrt das prophetische Bild für die Herrscher und ermöglicht zugleich das Wortspiel mit dem folgenden Verb.
- source_word: תִּרְעֶה רוּחַ
  choice: wird der Wind fortweiden
  rationale: Das Verb wiederholt die Wurzel von »Hirten«. »Fortweiden« ist ungewöhnlich, aber verständlich und bewahrt sowohl die ironische Wiederholung als auch die Wirkung des Wegtreibens, ohne sie schlicht mit »zerstreuen« aufzulösen.
- source_word: מְאַהֲבַיִךְ
  choice: deine Liebhaber
  rationale: Bewahrt die prophetische Metapher für Judas politische Verbündete und treulose Bindungen.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: werden in die Gefangenschaft gehen
  rationale: Entspricht eng der hebräischen Wendung und lässt offen, ob Gefangennahme oder Exil im Vordergrund steht.
- source_word: כִּי אָז
  choice: Dann
  rationale: Gibt hier die zeitlich-konsekutive Fortführung in natürlichem Deutsch wieder.
- source_word: תֵּבֹשִׁי וְנִכְלַמְתְּ
  choice: wirst du beschämt und gedemütigt sein
  rationale: Die beiden verwandten Begriffe werden unterscheidbar wiedergegeben; die passive deutsche Form bringt den Zustand der Schande natürlich zum Ausdruck, ohne eine ausdrückliche menschliche Ursache einzuführen.
- source_word: מִכֹּל רָעָתֵךְ
  choice: wegen all deiner Bosheit
  rationale: מִן bezeichnet im Zusammenhang den Grund der Schande. »Bosheit« gibt das moralische Gewicht von רָעָה deutlicher wieder als das mehrdeutige »Übel«.
theological_decisions:
- issue: Metaphorische Sprache für Judas politische und geistliche Untreue
  choice: Die Bilder »Hirten« und »Liebhaber« bleiben im Haupttext erhalten.
  alternative: »Führer« und »Verbündete«
  rationale: Die metaphorischen Ausdrücke tragen die Anklage und ihre rhetorische Spannung. Eine direkte Auflösung würde den politischen Bezug verdeutlichen, aber die prophetische Bildsprache und ihre moralische Kraft abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das bewusst ungewöhnliche »fortweiden« bewahrt das hebräische Wortspiel; die Fußnote nennt die idiomatischere Deutung. Die feminine Singularanrede an Jerusalem/Juda ist im Deutschen nur aus dem Zusammenhang erkennbar.
