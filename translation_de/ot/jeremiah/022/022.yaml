  to: Alle deine Hirten wird der Wind forttreiben[a], und deine Liebhaber werden in die Gefangenschaft ziehen[b]. Dann wirst du beschämt und gedemütigt sein wegen all deiner Bosheit.
  rationale: Die Revision ersetzt die nicht idiomatische Neubildung »fortweiden« durch »forttreiben«, das die Wirkung des Windbildes in natürlichem Deutsch wiedergibt. Das im Deutschen nicht sicher nachbildbare hebräische Wortspiel bleibt ausdrücklich in der Fußnote erhalten. Die übrigen Formulierungen bewahren Metapher, Register und Aussage des Verses.
