  source_fidelity: Die Übersetzung gibt die Satzglieder, die Metaphern »Hirten« und »Liebhaber«, die Gefangenschaft sowie die doppelte Schamfolge im Wesentlichen zutreffend wieder. »fortweiden« ist jedoch keine etablierte moderne deutsche Verbfügung und fügt mit »fort-« eine im hebräischen Wortlaut nicht eigens ausgedrückte Richtung hinzu. Der Kontext des Windes macht das Forttreiben zwar als Bildsinn deutlich, doch sollte das hebräische Wortspiel in einer Anmerkung erklärt statt durch eine künstliche deutsche Neubildung nachgeahmt werden.
  naturalness: »Fortweiden« wirkt im modernen Standarddeutsch unverständlich und störend. »Der Wind wird alle deine Hirten forttreiben« ist idiomatisch, bewahrt das Windbild und vermittelt den in diesem Kontext gemeinten Effekt. »In die Gefangenschaft ziehen« ist zudem im Deutschen etwas geläufiger als »in die Gefangenschaft gehen« und bleibt dem hebräischen Ausdruck eng.
  terminology: »Hirten« und »Liebhaber« sollen beibehalten werden; die Fußnote erläutert den politischen Bildbezug, ohne ihn in den Haupttext zu verlagern. »Bosheit« ist als Wiedergabe von רָעָה vertretbar. »beschämt und gedemütigt« gibt die beiden hebräischen Ausdrücke ausreichend unterschieden wieder.
