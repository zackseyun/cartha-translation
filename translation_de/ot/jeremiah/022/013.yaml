source:
  edition: WLC
  text: ה֣וֹי בֹּנֶ֤ה בֵית/וֹ֙ בְּֽ/לֹא צֶ֔דֶק וַ/עֲלִיּוֹתָ֖י/ו בְּ/לֹ֣א מִשְׁפָּ֑ט בְּ/רֵעֵ֨/הוּ֙ יַעֲבֹ֣ד חִנָּ֔ם וּ/פֹעֲל֖/וֹ לֹ֥א יִתֶּן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/013.yaml
  text: Woe to him who builds his house without righteousness[a], and his upper rooms without justice[c][b], who makes his neighbor work for nothing and does not give him his wages.
translation:
  language: de
  text: Wehe dem, der sein Haus ohne Gerechtigkeit[a] baut und seine oberen Räume[b] ohne Recht, der seinen Nächsten umsonst arbeiten lässt und ihm seinen Lohn[c] nicht gibt!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „ohne Recht“. Die hebräischen Wörter für „Gerechtigkeit“ und „Recht“ sind eng miteinander verwandt und können sich in ihrer Bedeutung überschneiden.'
    reason: lexical_alternative
  - marker: b
    text: „Obere Räume“ kann auch „obere Gemächer“ oder „obere Stockwerke“ bedeuten und bezeichnet den oberen Teil eines größeren Hauses.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich kann das hebräische Wort auch „seine Arbeit“ bedeuten; hier ist der für die Arbeit geschuldete Lohn gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe dem
  rationale: Leitet einen prophetischen Wehruf gegen schuldhaftes Handeln ein und bewahrt die scharfe, öffentliche Anklage.
- source_word: בֹּנֶה בֵיתוֹ
  choice: der sein Haus … baut
  rationale: Das Partizip bezeichnet denjenigen, dessen Handeln angeprangert wird. „Haus“ gibt den Grundsinn wieder; der Kontext kann zugleich an einen königlichen Palast denken lassen.
- source_word: בְּלֹא צֶדֶק
  choice: ohne Gerechtigkeit
  rationale: צֶדֶק bezeichnet gerechte, sittlich richtige Verhältnisse. Die substantivische Wendung bleibt nah an der hebräischen Formulierung.
- source_word: וַעֲלִיּוֹתָיו
  choice: und seine Obergemächer
  rationale: Gemeint sind Räume im oberen Teil eines größeren Hauses. „Obergemächer“ wahrt das architektonische Bild und passt zum gehobenen prophetischen Stil.
- source_word: בְּלֹא מִשְׁפָּט
  choice: ohne Recht
  rationale: מִשְׁפָּט bezeichnet hier das Recht beziehungsweise den rechtmäßigen Anspruch. „Recht“ unterscheidet den Ausdruck von צֶדֶק, ohne ihre Bedeutungsnähe zu leugnen.
- source_word: בְּרֵעֵהוּ יַעֲבֹד חִנָּם
  choice: der seinen Nächsten umsonst arbeiten lässt
  rationale: Die Konstruktion beschreibt, dass jemand einen Mitmenschen für sich arbeiten lässt, ohne ihn zu entlohnen. „Umsonst“ wird durch den folgenden Halbsatz eindeutig als „ohne Bezahlung“ bestimmt.
- source_word: וּפֹעֲלוֹ לֹא יִתֶּן לוֹ
  choice: und ihm seinen Lohn nicht gibt
  rationale: פֹּעַל kann „Arbeit“ oder den dafür geschuldeten Ertrag bezeichnen; mit „geben“ und im Kontext der unbezahlten Arbeit ist „Lohn“ die natürliche Wiedergabe.
theological_decisions:
- issue: Wiedergabe des ethischen Begriffspaars צֶדֶק / מִשְׁפָּט
  choice: ohne Gerechtigkeit … ohne Recht
  alternative: ohne Recht … ohne Gerechtigkeit; ungerecht … ohne Recht
  rationale: Die Übersetzung erhält zwei eng verwandte, aber nicht völlig deckungsgleiche Begriffe. So bleibt die prophetische Spannung zwischen sittlich gerechtem Handeln und dem vorenthaltenen rechtmäßigen Anspruch des Arbeiters sichtbar.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Der traditionelle Wehruf „Wehe dem“ und „Nächster“ bewahren die biblische Prägung; Satzbau und Wortwahl bleiben zugleich unmittelbar verständlich.
