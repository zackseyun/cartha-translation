id: JER.22.9
reference: Jeremiah 22:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹֽהֵי/הֶ֑ם וַ/יִּֽשְׁתַּחֲו֛וּ לֵ/אלֹהִ֥ים אֲחֵרִ֖ים וַ/יַּעַבְדֽוּ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/009.yaml
  text: And they will say[b][a], ‘Because they abandoned the covenant of Yahweh their God and bowed down to other gods and served them.’
translation:
  language: de
  text: 'Und sie werden sagen: »Weil sie den Bund Jahwes, ihres Gottes, verlassen[a], sich vor anderen Göttern niedergeworfen[b] und ihnen gedient haben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aufgegeben«.'
    reason: lexical_alternative
  - marker: b
    text: Das Niederwerfen und Dienen bezeichnet zusammen die kultische Verehrung anderer Götter.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Und sie werden sagen
  rationale: Die Form führt die zukunftsbezogene Aussage des vorigen Verses fort. »Und« bewahrt die Verknüpfung mit dem Kontext.
- source_word: עַל אֲשֶׁר
  choice: Weil
  rationale: Die Wortverbindung leitet hier den Grund für das Gericht ein; »weil« gibt diese kausale Bedeutung natürlich wieder.
- source_word: עָזְבוּ
  choice: verlassen
  rationale: Das Verb bezeichnet hier die treulose Abkehr vom Bund. »Verlassen« ist klar, gegenwärtig und wahrt das Bild des Ausgangstextes.
- source_word: בְּרִית
  choice: den Bund
  rationale: Gemeint ist die verbindliche Bundesbeziehung zwischen Jahwe und seinem Volk; »Bund« ist dafür die sachgemäße deutsche Bezeichnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. »Jahwe« gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיהֶם
  choice: ihres Gottes
  rationale: Die grammatisch pluralisch gebildete Form bezeichnet in der Bundesformel den einen Gott Israels; der Singular ist daher erforderlich.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sich ... niedergeworfen
  rationale: Das Verb bezeichnet wörtlich das Niederwerfen beziehungsweise Sichverbeugen. Die konkrete Handlung bleibt erhalten, während der folgende Ausdruck ihren kultischen Sinn verdeutlicht.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: vor anderen Göttern
  rationale: Die Präposition kennzeichnet das Gegenüber der Huldigung. Im Deutschen ist »sich vor jemandem niederwerfen« die natürliche Konstruktion.
- source_word: וַיַּעַבְדוּם
  choice: ihnen gedient
  rationale: Bei Gottheiten bezeichnet עבד kultischen Dienst. »Gedient« bewahrt die lexikalische Unterscheidung zum vorherigen Niederwerfen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich den Gottesnamen JHWH. Die Wiedergabe »Jahwe« bewahrt den persönlichen Bundesnamen und ersetzt ihn nicht durch einen Titel.
- issue: Verhältnis der beiden Verben für den Götzendienst
  choice: sich niederwerfen und dienen
  alternative: anbeten und verehren
  rationale: Die gewählte Fassung bewahrt die zwei unterschiedlichen hebräischen Verben und lässt sie gemeinsam den kultischen Götzendienst beschreiben, ohne beide in allgemeinere Begriffe aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und klar. Die drei koordinierten Handlungen des Hebräischen werden im Deutschen durch eine gemeinsame Perfektkonstruktion zusammengehalten.
