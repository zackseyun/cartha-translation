source:
  edition: WLC
  text: ישבתי בַּ/לְּבָנ֔וֹן מקננתי בָּֽ/אֲרָזִ֑ים מַה נֵּחַנְתְּ֙ בְּ/בֹא לָ֣/ךְ חֲבָלִ֔ים חִ֖יל כַּ/יֹּלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/023.yaml
  text: You who dwell in Lebanon[a], who nest in the cedars, how you will groan when pangs come upon you[b], pain like that of a woman giving birth.
translation:
  language: de
  text: 'Die du im Libanon wohnst[a], die du in den Zedern nistest: Wie wirst du stöhnen[b], wenn Wehen über dich kommen, Schmerzen wie bei einer Gebärenden!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Libanon und Zedern spielen wahrscheinlich auf den mit Zedernholz aus dem Libanon errichteten Königspalast an und zeichnen Judas Herrscher als Bewohner einer hoch gelegenen, sicher wirkenden Stätte.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Wie wirst du bemitleidet werden, wenn Wehen über dich kommen.“ Das hier verwendete hebräische Verb ist schwer zu deuten; manche verstehen es im Sinn von Mitleid erfahren statt stöhnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשַׁבְתִּי / ישבתי
  choice: die du … wohnst
  rationale: Der masoretische Text ist in der überlieferten Form schwierig; der Zusammenhang und die folgenden femininen Singularformen verlangen eine Anrede an die personifizierte Stadt beziehungsweise das Königshaus. ישב bezeichnet hier das Wohnen, nicht bloß das Sitzen.
- source_word: בַּלְּבָנוֹן
  choice: im Libanon
  rationale: Die Ortsangabe bleibt direkt erhalten; eine mögliche Anspielung auf den mit Libanonzedern ausgestatteten Königspalast wird nicht in den Haupttext eingetragen.
- source_word: מְקֻנַּנְתְּ / מקננתי
  choice: die du in den Zedern nistest
  rationale: קנן trägt das anschauliche Bild des Nestens beziehungsweise sicheren Wohnens. Das deutsche „nisten“ bewahrt diese Metapher.
- source_word: מַה נֵּחַנְתְּ
  choice: Wie wirst du stöhnen
  rationale: מַה leitet einen Ausruf ein. Das schwierige Verb wird im Zusammenhang der unmittelbar genannten Geburtswehen als Äußerung von Schmerz verstanden; die alternative Deutung „bemitleidet werden“ wird in einer Fußnote bewahrt.
- source_word: בְּבֹא לָךְ חֲבָלִים
  choice: wenn Wehen über dich kommen
  rationale: Die Infinitivkonstruktion ist temporal. חבלים bezeichnet angesichts des Geburtsvergleichs Wehen; „über dich kommen“ gibt den Eintritt des Leidens idiomatisch wieder.
- source_word: חִיל כַּיֹּלֵדָה
  choice: Schmerzen wie bei einer Gebärenden
  rationale: חיל bezeichnet hier schmerzvolle, windende Angst. „Gebärende“ gibt das feminine Partizip prägnant und würdig wieder.
theological_decisions:
- issue: Bezug von „Libanon“ und „Zedern“
  choice: Die Bildsprache bleibt im Haupttext offen; die wahrscheinliche Anspielung auf den Königspalast wird nur angemerkt.
  alternative: Libanon und Zedern unmittelbar als Königspalast paraphrasieren.
  rationale: Der Wortlaut nennt den Libanon und die Zedern ausdrücklich, während die genaue Referenz bildhaft und nicht völlig eindeutig ist.
- issue: Deutung des schwierigen Verbs נֵּחַנְתְּ
  choice: „du wirst stöhnen“
  alternative: „du wirst bemitleidet werden“
  rationale: Der Zusammenhang mit Wehen und Geburtsschmerz stützt eine Äußerung des Schmerzes, doch die echte lexikalische Unsicherheit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Anrede wird durch die Relativkonstruktionen sichtbar gehalten. „Gebärende“ ist knapp und gehoben, aber allgemein verständlich. Die Fußnotenmarker stehen jeweils an der inhaltlich passenden Stelle.
