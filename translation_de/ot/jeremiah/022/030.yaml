source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה כִּתְב֞וּ אֶת הָ/אִ֤ישׁ הַ/זֶּה֙ עֲרִירִ֔י גֶּ֖בֶר לֹא יִצְלַ֣ח בְּ/יָמָ֑י/ו כִּי֩ לֹ֨א יִצְלַ֜ח מִ/זַּרְע֗/וֹ אִ֚ישׁ יֹשֵׁב֙ עַל כִּסֵּ֣א דָוִ֔ד וּ/מֹשֵׁ֥ל ע֖וֹד בִּ/יהוּדָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/030.yaml
  text: 'Thus says Yahweh: Write this man down as childless[a], a man who will not prosper in his days; for none of his offspring will prosper[b] to sit on the throne of David and rule again in Judah.'
translation:
  language: de
  text: 'So spricht Jahwe: Tragt diesen Mann als kinderlos[a] ein, als einen Mann, dem es in seinen Tagen nicht gelingen wird. Denn keinem seiner Nachkommen wird es gelingen[b], auf dem Thron Davids zu sitzen und noch über Juda zu herrschen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als einen Mann ohne Erben“. Wörtlich steht im Hebräischen „kinderlos“; der folgende Satz zeigt jedoch, dass es um die dynastische Nachfolge geht: Keiner seiner Nachkommen wird ihm als König auf Davids Thron folgen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Keinem Nachkommen Jojachins wird es gelingen, als davidischer König in Juda zu regieren.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den überlieferten Gottesnamen im Deutschen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּתְבוּ
  choice: Schreibt ... ein
  rationale: Der Pluralimperativ bezeichnet hier eine amtliche Feststellung oder Eintragung; „einschreiben“ bewahrt diese administrative Färbung.
- source_word: עֲרִירִי
  choice: kinderlos
  rationale: Entspricht der unmittelbaren lexikalischen Bedeutung. Der folgende Satz grenzt den Zusammenhang auf die dynastische Nachfolge ein; diese Spannung bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
- source_word: לֹא יִצְלַח בְּיָמָיו
  choice: dem es in seinen Tagen nicht gelingen wird
  rationale: צלח bezeichnet Gelingen oder Erfolg. Die Wendung „in seinen Tagen“ wird nahe am Hebräischen bewahrt.
- source_word: מִזַּרְעוֹ
  choice: keinem seiner Nachkommen
  rationale: זרע ist kollektiv gebraucht. „Nachkommen“ ist im heutigen Deutsch klarer als das wörtliche „Same“.
- source_word: אִישׁ יֹשֵׁב עַל כִּסֵּא דָוִד וּמֹשֵׁל עוֹד בִּיהוּדָה
  choice: auf dem Thron Davids zu sitzen und wieder über Juda zu herrschen
  rationale: Die Formulierung verbindet das ausbleibende Gelingen mit der königlichen Stellung. Die Infinitivkonstruktion ist idiomatisches Deutsch, ohne die Aussage in zwei voneinander unabhängige Verbote aufzuspalten.
theological_decisions:
- issue: Die Bezeichnung Jojachins als „kinderlos“ trotz anderweitig bezeugter Nachkommen
  choice: „kinderlos“ im Haupttext, dynastisch im Kontext erläutert
  alternative: „ohne Thronerben“ oder „ohne Erben“
  rationale: Der hebräische Ausdruck selbst lautet „kinderlos“, doch der folgende Begründungssatz betrifft ausdrücklich die Nachfolge auf Davids Thron. Die Übersetzung erhält sowohl den Wortlaut als auch die kontextuelle Spannung.
- issue: Reichweite des Urteils über seine Nachkommen
  choice: Keinem Nachkommen wird es gelingen, als davidischer König in Juda zu regieren
  alternative: Kein Nachkomme wird überhaupt existieren oder jemals irgendeine bedeutende Stellung erlangen
  rationale: Die Partizipialformulierungen bestimmen den fraglichen Erfolg durch das Sitzen auf Davids Thron und das Herrschen in Juda. Die Aussage wird deshalb nicht über ihren königlich-dynastischen Zusammenhang hinaus ausgeweitet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „So spricht Jahwe“ bewahrt die prophetische Formel; „Schreibt ... ein“ klingt amtlich, ohne altertümlich zu wirken. Die Wiederholung von „gelingen“ bildet die Wiederholung von צלח ab.
