source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה אֶל יְהוֹיָקִ֤ים בֶּן יֹאשִׁיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָחִ֖/י וְ/ה֣וֹי אָח֑וֹת לֹא יִסְפְּד֣וּ ל֔/וֹ ה֥וֹי אָד֖וֹן וְ/ה֥וֹי הֹדֹֽ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/018.yaml
  text: 'Therefore thus says Yahweh concerning Jehoiakim son of Josiah[a], king of Judah: They will not lament for him, saying, “Alas, my brother!” or “Alas, sister!” They will not lament for him, saying, “Alas, lord!” or “Alas[d][c][b], his majesty!”'
translation:
  language: de
  text: 'Darum, so spricht Jahwe über Jojakim, den Sohn Josias, den König von Juda: Man wird nicht um ihn klagen[a]: »Ach, mein Bruder! Ach, Schwester![b]« Man wird nicht um ihn klagen: »Ach, Herr![c] Ach, seine Herrlichkeit![d]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Man wird keine Totenklage über ihn halten.« Das hebräische Verb bezeichnet besonders die formelle Klage um einen Verstorbenen.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen steht wörtlich nur »Schwester«, ohne das ausdrückliche »mein« aus dem vorangehenden Ruf »mein Bruder«.
    reason: textual_form
  - marker: c
    text: 'Oder: »Ach, Gebieter!« Der hebräische Titel kann einen Herrn, Vorgesetzten oder Herrscher bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »Ach, sein Glanz!« Der hebräische Ausdruck bezeichnet Herrlichkeit, Majestät oder Glanz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gerichtswort und bewahrt den argumentativen Zusammenhang.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Gibt die feste prophetische Botenformel in geläufiger, würdevoller deutscher Form wieder und lässt den Gottesnamen als Eigennamen erkennen.
- source_word: אֶל
  choice: über
  rationale: Leitet hier den Gegenstand des Gerichtswortes ein; Jojakim wird nicht direkt angeredet.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Jojakim, den Sohn Josias, den König von Juda
  rationale: Verwendet die im Deutschen etablierten Namensformen und erhält die vollständige königliche Identifizierung.
- source_word: לֹא יִסְפְּדוּ לוֹ
  choice: Man wird nicht um ihn klagen
  rationale: ספד bezeichnet besonders die öffentliche oder rituelle Totenklage; die unpersönliche deutsche Form gibt das nicht näher bestimmte Subjekt natürlich wieder.
- source_word: הוֹי
  choice: Ach
  rationale: Die Interjektion gehört hier zu einem Totenklageruf; „Ach“ ist im modernen Deutschen natürlicher als „Wehe“ und bewahrt den klagenden Ton.
- source_word: אָחִי
  choice: mein Bruder
  rationale: Der hebräische Ausdruck enthält ausdrücklich das Suffix der ersten Person Singular.
- source_word: אָחוֹת
  choice: Schwester
  rationale: Anders als beim vorangehenden „mein Bruder“ steht im überlieferten hebräischen Text kein Possessivsuffix.
- source_word: אָדוֹן
  choice: Herr
  rationale: Bezeichnet einen Höhergestellten oder Herrscher und ist in diesem Klageruf die natürliche deutsche Anrede.
- source_word: הֹדֹה
  choice: seine Hoheit
  rationale: הוֹד bezeichnet Hoheit, Majestät oder Glanz; das Suffix verweist auf die königliche Würde des Verstorbenen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֶל יְהוֹיָקִים
  choice: Gerichtswort über Jojakim
  alternative: direkte Anrede an Jojakim
  rationale: Der folgende Satz spricht in der dritten Person über Jojakim; daher bezeichnet אֶל hier den Gegenstand des Orakels, ohne die grammatische Mehrdeutigkeit des Verhältniswortes grundsätzlich zu leugnen.
- issue: Deutung von הֹדֹה
  choice: seine Hoheit
  alternative: sein Glanz
  rationale: Im Zusammenhang mit dem Tod eines Königs liegt die königliche Würde nahe; die Fußnote hält die konkretere Bildbedeutung „Glanz“ offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Klageformel und die knappen Ausrufe bleiben erhalten. „Ach“ vermittelt den Ton der Totenklage ohne die im Deutschen stärker gerichtliche Färbung von „Wehe“. Die ungewöhnliche Asymmetrie zwischen „mein Bruder“ und „Schwester“ wird entsprechend dem hebräischen Wortlaut bewahrt.
