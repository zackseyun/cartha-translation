  text: וּ/נְתַתִּ֗י/ךָ בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשֶׁ֔/ךָ וּ/בְ/יַ֛ד אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶ֑ם וּ/בְ/יַ֛ד נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַ֥ד הַ/כַּשְׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/025.yaml
  text: And I will give you into the hand of those who seek your life[a], into the hand of those before whom you are afraid, into the hand of Nebuchadnezzar king of Babylon[b], and into the hand of the Chaldeans.
translation:
  language: de
  text: Und ich werde dich in die Hand derer geben, die dir nach dem Leben trachten, in die Hand derer, vor denen du dich fürchtest, in die Hand Nebukadnezars[a], des Königs von Babylon, und in die Hand der Chaldäer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Nebukadrezar“; diese Form entspricht der hebräischen Namensform an dieser Stelle genauer.'
    reason: lexical_alternative
  - marker: b
    text: „Die Chaldäer“ kann hier auch mit „die Babylonier“ wiedergegeben werden, da die Bezeichnung im Zusammenhang die babylonischen Streitkräfte meinen kann.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  choice: Und ich werde dich … geben
  rationale: נתן mit persönlichem Objekt und der anschließenden Wendung בְּיַד bezeichnet die Auslieferung in fremde Gewalt. „Geben“ bewahrt das hebräische Bild und trägt zusammen mit „in die Hand“ den Sinn klar.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die viermal wiederholte Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Die konkrete Metapher und die eindringliche Wiederholung des Hebräischen bleiben erhalten.
- source_word: מְבַקְשֵׁי נַפְשֶׁךָ
  choice: die dir nach dem Leben trachten
  rationale: נפש meint hier angesichts der feindlichen Absicht das Leben. Die deutsche Wendung gibt die Tötungsabsicht natürlich wieder, ohne „Seele“ einzutragen.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  choice: vor denen du dich fürchtest
  rationale: יגור bezeichnet hier Furcht oder Grauen; מִפְּנֵיהֶם wird mit dem natürlichen deutschen „vor denen“ wiedergegeben.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im Deutschen geläufige Namensform wird im Haupttext verwendet; die dem hebräischen Schriftbild näherkommende Form wird in einer Fußnote genannt.
- source_word: מֶלֶךְ בָּבֶל
  choice: König von Babel
  rationale: Die Status-constructus-Verbindung wird unmittelbar und in der im Deutschen bibelsprachlich geläufigen Form wiedergegeben.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: „Chaldäer“ bewahrt die ethnische Bezeichnung des Ausgangstextes; im Kontext kann sie zugleich die babylonischen Streitkräfte bezeichnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vierfache Wiederholung von „in die Hand“ erhält die eindringliche Rhetorik und das konkrete Bild des hebräischen Textes; idiomatisches „nach dem Leben trachten“ vermeidet eine missverständliche wörtliche Wiedergabe mit „Seele“.
