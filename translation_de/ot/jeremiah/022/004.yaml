source:
  edition: WLC
  text: כִּ֤י אִם עָשׂוֹ֙ תַּֽעֲשׂ֔וּ אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הַ/בַּ֣יִת הַ/זֶּ֡ה מְלָכִים֩ יֹשְׁבִ֨ים לְ/דָוִ֜ד עַל כִּסְא֗/וֹ רֹֽכְבִים֙ בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֔ים ה֥וּא ו/עבד/ו וְ/עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/004.yaml
  text: For if you truly do this thing[a], then kings sitting on David’s throne will enter through the gates of this house, riding in chariots and on horses—he, his servants[b], and his people.
translation:
  language: de
  text: Denn wenn ihr wirklich so handelt[a], werden durch die Tore dieses Hauses Könige einziehen, die auf Davids Thron sitzen und in Wagen und auf Pferden fahren — jeder mit seinen Dienern[b] und seinem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn ihr diese Sache wirklich tut“. Das hebräische דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten und verweist hier auf das zuvor gebotene Handeln.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „er und seine Diener und sein Volk“. Nach dem Plural „Könige“ stehen im Hebräischen Singularformen, die sich jeweils auf den einzelnen König beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn wenn
  rationale: Bewahrt sowohl den begründenden Anschluss an den vorherigen Zusammenhang als auch die Bedingung, ohne das Hebräische unnötig zu verschärfen.
- source_word: עָשׂוֹ תַּעֲשׂוּ
  choice: ihr wirklich so handelt
  rationale: Der Infinitivus absolutus verstärkt das finite Verb. „wirklich“ gibt diese Betonung in natürlichem Deutsch wieder; „so handelt“ verweist idiomatisch auf die zuvor geforderte Handlungsweise.
- source_word: הַדָּבָר הַזֶּה
  choice: so handelt
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. Im Kontext bezeichnet es das zuvor gebotene Verhalten; die verbale Wiedergabe ist im Deutschen natürlich, während die Fußnote die lexikalische Breite wahrt.
- source_word: וּבָאוּ בְשַׁעֲרֵי הַבַּיִת הַזֶּה
  choice: werden durch die Tore dieses Hauses einziehen
  rationale: „Einziehen“ erfasst die Bewegung durch die Tore und passt zum königlichen Prozessionsbild. „Dieses Haus“ folgt dem Wortlaut und lässt den kontextuellen Bezug auf den Königspalast stehen.
- source_word: מְלָכִים יֹשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: Könige, die auf Davids Thron sitzen
  rationale: Gibt die davidische Thronfolge klar wieder, ohne „aus Davids Linie“ hinzuzufügen oder eine weitergehende messianische Deutung in den Wortlaut einzutragen.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: in Wagen und auf Pferden fahren
  rationale: Entspricht dem königlichen Prozessionsbild; der hebräische Singular bei „Wagen“ ist kollektiv beziehungsweise generisch und wird im Deutschen natürlich pluralisch wiedergegeben.
- source_word: הוּא וַעֲבָדָיו וְעַמּוֹ
  choice: jeder mit seinen Dienern und seinem Volk
  rationale: Das singularische Pronomen nach dem pluralischen „Könige“ wird distributiv verstanden. „Jeder“ macht diesen Numeruswechsel im Deutschen verständlich, ohne ihn zu verwischen.
theological_decisions:
- issue: Dynastische Verheißung in der Wendung „Könige, die auf Davids Thron sitzen“
  choice: Als Zusage des Fortbestands davidischer Könige bei entsprechendem Handeln wiedergeben.
  alternative: Die Wendung ausdrücklich auf spätere messianische Erfüllung beziehen oder mit „Könige aus Davids Linie“ stärker ausdeuten.
  rationale: Der unmittelbare Kontext betrifft das davidische Königtum und seine an gerechtes Handeln geknüpfte Fortdauer. Die Übersetzung bewahrt diese Aussage, ohne eine im Vers nicht ausdrücklich formulierte spätere Deutung festzulegen.
- issue: Bedingungscharakter von כִּי אִם
  choice: „Denn wenn“
  alternative: „Denn nur wenn“
  rationale: „Wenn“ wahrt die klare Bedingung. „Nur wenn“ könnte eine ausschließende Nuance stärker ausdrücken, als sie hier sicher festzustellen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einziehen“ trägt das Bild einer königlichen Prozession; „dieses Haus“ bewahrt die quellensprachliche Formulierung, die im Kontext wahrscheinlich den Königspalast bezeichnet. Der distributive Singular wird im Haupttext verständlich als „jeder“ wiedergegeben und in der Fußnote dokumentiert.
