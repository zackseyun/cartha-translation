source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָֽמַר יְ֠הוָה אֶל שַׁלֻּ֨ם בֶּן יֹאשִׁיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה הַ/מֹּלֵךְ֙ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו אֲשֶׁ֥ר יָצָ֖א מִן הַ/מָּק֣וֹם הַ/זֶּ֑ה לֹֽא יָשׁ֥וּב שָׁ֖ם עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/011.yaml
  text: 'For thus says Yahweh concerning Shallum son of Josiah[a], king of Judah, who reigned in place of Josiah his father, who went out from this place: He shall never return there again.'
translation:
  language: de
  text: 'Denn so spricht Jahwe über Schallum, den Sohn Josias,[a] den König von Juda, der anstelle seines Vaters Josia König war und von diesem Ort fortging: Er wird nie wieder dorthin zurückkehren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Schallum, dem Sohn Josias“. Die hebräische Präposition kann eine direkte Anrede bezeichnen; hier führt sie wahrscheinlich den Gegenstand des Gotteswortes ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: כִּי begründet die vorausgehende Aussage; „Denn“ gibt diese Funktion wieder. Die prophetische Botenformel כֹה אָמַר wird im Deutschen idiomatisch und traditionsnah mit „so spricht“ wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֶל
  choice: über
  rationale: אֶל kann wörtlich „zu“ bedeuten. Im Zusammenhang führt es wahrscheinlich den Gegenstand des folgenden Gotteswortes ein; „über“ ist dafür natürliches Deutsch, während die mögliche direkte Anrede in einer Fußnote bewahrt wird.
- source_word: שַׁלֻּם בֶּן יֹאשִׁיָּהוּ
  choice: Schallum, den Sohn Josias
  rationale: Der Personenname wird in geläufiger deutscher Bibelnamensform wiedergegeben; das Abstammungsverhältnis bleibt ausdrücklich erhalten.
- source_word: מֶלֶךְ יְהוּדָה
  choice: den König von Juda
  rationale: Die königliche Amtsbezeichnung wird direkt und idiomatisch wiedergegeben.
- source_word: הַמֹּלֵךְ תַּחַת יֹאשִׁיָּהוּ אָבִיו
  choice: der anstelle seines Vaters Josia König war
  rationale: Das Partizip von מלך und תַּחַת bezeichnen seine Herrschaft an der Stelle seines Vaters. Die Formulierung wahrt diesen Stellvertretungs- beziehungsweise Nachfolgegedanken.
- source_word: אֲשֶׁר יָצָא מִן הַמָּקוֹם הַזֶּה
  choice: und von diesem Ort fortging
  rationale: יצא bezeichnet das Hinaus- beziehungsweise Fortgehen. Das koordinierende „und“ macht im Deutschen deutlich, dass auch dieser Relativsatz Schallum beschreibt, ohne den Ortsbezug auszudeuten.
- source_word: לֹא יָשׁוּב שָׁם עוֹד
  choice: Er wird nie mehr hierher zurückkehren
  rationale: Die Verneinung mit עוֹד bezeichnet eine endgültige Nichtwiederkehr. Da aus der Perspektive „dieses Ortes“ gesprochen wird, ist שָׁם im Deutschen idiomatisch mit „hierher“ als Ziel der Rückkehr wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug von אֶל שַׁלֻּם
  choice: über Schallum
  alternative: zu Schallum
  rationale: Der Kontext legt nahe, dass Schallum Gegenstand des Gotteswortes ist. Weil אֶל jedoch auch eine direkte Anrede einleiten kann, wird diese echte sprachliche Möglichkeit in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „So spricht“ bewahrt den prophetischen Formelcharakter. Die Satzstruktur bleibt quellennah, wird aber durch „und“ lesbar gegliedert; historische und geografische Bezüge werden nicht erläuternd ergänzt.
