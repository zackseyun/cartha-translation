id: JER.22.7
reference: Jeremiah 22:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/קִדַּשְׁתִּ֥י עָלֶ֛י/ךָ מַשְׁחִתִ֖ים אִ֣ישׁ וְ/כֵלָ֑י/ו וְ/כָֽרְתוּ֙ מִבְחַ֣ר אֲרָזֶ֔י/ךָ וְ/הִפִּ֖ילוּ עַל הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/007.yaml
  text: And I will set apart destroyers against you[a], each with his weapons[c][b]; they will cut down the choicest of your cedars and cast them into the fire.
translation:
  language: de
  text: Und ich werde Verderber gegen dich aussondern[a], jeden mit seinen Geräten[b]. Sie werden die erlesensten deiner Zedern fällen und ins Feuer werfen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich werde Verderber gegen dich heiligen“. Das hebräische Verb bedeutet häufig „heiligen“ oder „weihen“; hier bezeichnet es das Aussondern für den Vollzug des Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jeden mit seinen Waffen“. Das hebräische Wort kann Geräte, Ausrüstung oder Waffen bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „auf das Feuer“. „Ins Feuer“ gibt den gemeinten Vorgang im Deutschen natürlicher wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי
  choice: Und ich werde … aussondern
  rationale: Das Verb קדשׁ bezeichnet grundsätzlich das Heiligen beziehungsweise Absondern. „Aussondern“ bewahrt hier die besondere Sprache göttlicher Bestimmung, ohne den Verderbern moralische Heiligkeit zuzuschreiben.
- source_word: מַשְׁחִתִים
  choice: Verderber
  rationale: Das substantivierte Partizip bezeichnet Personen, die Zerstörung anrichten. „Verderber“ ist knapp, würdevoll und passt zum Gerichtskontext.
- source_word: עָלֶיךָ
  choice: gegen dich
  rationale: עַל hat im Zusammenhang feindlichen Vorgehens die adversative Bedeutung „gegen“.
- source_word: אִישׁ וְכֵלָיו
  choice: jeden mit seinen Geräten
  rationale: אִישׁ ist nach dem Plural distributiv zu verstehen. כְּלִי kann Geräte, Ausrüstung oder Waffen bezeichnen; „Geräte“ hält die sachliche Mehrdeutigkeit offen und passt zugleich zum anschließenden Fällen der Zedern.
- source_word: וְכָרְתוּ
  choice: Sie werden … fällen
  rationale: כרת bezeichnet bei Bäumen das Fällen; die deutsche Wahl ist präzise und idiomatisch.
- source_word: מִבְחַר אֲרָזֶיךָ
  choice: die erlesensten deiner Zedern
  rationale: מִבְחַר bezeichnet das Ausgewählte oder Beste. „Die erlesensten“ gibt den herausgehobenen Wert der Zedern in gehobenem, natürlichem Deutsch wieder.
- source_word: וְהִפִּילוּ עַל הָאֵשׁ
  choice: und ins Feuer werfen
  rationale: Wörtlich steht „auf das Feuer fallen lassen“. „Ins Feuer werfen“ gibt den beabsichtigten Vorgang im Deutschen natürlich wieder.
theological_decisions:
- issue: Heiligungssprache in einer Gerichtsankündigung
  choice: „aussondern“
  alternative: „heiligen“, „weihen“ oder „bestellen“
  rationale: „Aussondern“ erhält den Anklang an קדשׁ als göttliches Absondern für einen Zweck, vermeidet aber die irreführende Aussage, die Verderber seien sittlich heilig. So bleibt die Spannung bestehen, dass Gott selbst Gerichtsvollstrecker für ihre Aufgabe bestimmt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne den Zusammenhang der Handlungen aufzulösen. „Verderber“ und „erlesensten“ bewahren den gehobenen prophetischen Ton; die Fußnoten legen echte lexikalische Alternativen offen.
