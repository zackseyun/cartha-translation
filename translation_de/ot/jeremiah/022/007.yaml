  source_fidelity: 'Der Text gibt die Abfolge und die zentralen hebräischen Ausdrücke zuverlässig wieder: Gottes Aussonderung/Bestimmung von Zerstörern gegen das angesprochene Gegenüber, die distributive Wendung „jeden mit seinen Geräten“, das Fällen der besten Zedern und deren Werfen ins Feuer. „Aussondern“ bildet קדשׁ im vorliegenden Gerichtskontext vertretbar ab, ohne eine moralische Heiligkeit der Vollstrecker zu behaupten. „Ins Feuer“ ist als idiomatische Wiedergabe von עַל־הָאֵשׁ gerechtfertigt.'
