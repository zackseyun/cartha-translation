  text: וְ/עַל הָ/אָ֗רֶץ אֲשֶׁר הֵ֛ם מְנַשְּׂאִ֥ים אֶת נַפְשָׁ֖/ם לָ/שׁ֣וּב שָׁ֑ם שָׁ֖מָּ/ה לֹ֥א יָשֽׁוּבוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/027.yaml
  text: But to the land to which they lift up their soul to return[a], there they will not return.
translation:
  language: de
  text: Doch was das Land betrifft, nach dem sie sich sehnen, um dorthin zurückzukehren[a] – dorthin werden sie nicht zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Land, zu dem sie ihre Seele erheben, um dorthin zurückzukehren“. Die hebräische Wendung „die Seele erheben“ drückt ein starkes Verlangen oder eine tiefe Sehnsucht aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Doch in
  rationale: Die Konjunktion markiert im Zusammenhang einen Gegensatz; die Präposition wird entsprechend der auf das Land gerichteten Rückkehrbewegung idiomatisch mit „in“ wiedergegeben.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist hier das konkrete Heimatland, nicht die Erde als Ganze.
- source_word: מְנַשְּׂאִים אֶת־נַפְשָׁם
  choice: sie sich so sehr sehnen
  rationale: Die wörtliche Wendung „ihre Seele erheben“ bezeichnet ein starkes Verlangen. „Sich so sehr sehnen“ gibt den idiomatischen Sinn in natürlichem modernem Deutsch wieder.
- source_word: לָשׁוּב ... יָשׁוּבוּ
  choice: zurückzukehren ... werden sie nicht zurückkehren
  rationale: Die Wiederholung desselben hebräischen Verbs wird auch im Deutschen bewahrt.
- source_word: שָׁם ... שָׁמָּה
  choice: in das ... dorthin
  rationale: Das erste Ortsadverb ist in die Relativkonstruktion eingebunden; „dorthin“ erhält im Hauptsatz die nachdrückliche Wiederaufnahme des Ziels.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Wiederholung des Rückkehrmotivs und die emphatische Zielangabe „dorthin“ bleiben erhalten; die hebräische Sehnsuchtswendung wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
