  text: דִּבַּ֤רְתִּי אֵלַ֨יִ/ךְ֙ בְּ/שַׁלְוֺתַ֔יִ/ךְ אָמַ֖רְתְּ לֹ֣א אֶשְׁמָ֑ע זֶ֤ה דַרְכֵּ/ךְ֙ מִ/נְּעוּרַ֔יִ/ךְ כִּ֥י לֹֽא שָׁמַ֖עַתְּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/021.yaml
  text: I spoke to you in your prosperity[a], but you said, ‘I will not listen.’ This has been your way from your youth[b], for you have not listened to my voice.
translation:
  language: de
  text: 'Ich redete zu dir, als es dir gut ging[a], doch du sagtest: »Ich will nicht hören.« Das ist dein Weg von Jugend an, denn du hast nicht auf meine Stimme gehört[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in deinem Wohlergehen«, »in deiner Sicherheit« oder »in deinem Wohlstand«. Das hebräische Wort kann ruhiges Wohlergehen, Sicherheit oder Wohlstand bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Hören« kann hier auch »gehorchen« bedeuten; das hebräische Verb verbindet häufig beide Bedeutungen.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּרְתִּי אֵלַיִךְ
  choice: Ich redete zu dir
  rationale: Gibt die direkte frühere Anrede JHWHs schlicht und idiomatisch wieder; das feminine Singularsuffix bleibt im Deutschen als nicht näher bestimmtes »dir« erhalten.
- source_word: בְּשַׁלְוֺתַיִךְ
  choice: als du in Sicherheit lebtest
  rationale: שַׁלְוָה kann ruhiges Wohlergehen, Sicherheit oder Wohlstand bezeichnen. Die Formulierung ist natürlich und wahrt den Sicherheitsaspekt, ohne ausdrücklich Selbstzufriedenheit zu unterstellen.
- source_word: לֹא אֶשְׁמָע
  choice: Ich will nicht hören
  rationale: שׁמע umfasst sowohl Hören als auch gehorchendes Beachten. »Hören« bewahrt das Bild und lässt die Gehorsamskomponente mitschwingen.
- source_word: זֶה דַרְכֵּךְ מִנְּעוּרַיִךְ
  choice: So war es bei dir von Jugend an
  rationale: Der nominale Satz beschreibt ein seit früher Zeit kennzeichnendes Verhalten. Diese deutsche Wendung gibt den Sinn natürlich wieder, ohne »Weg« unnötig konkret zu machen.
- source_word: כִּי לֹא שָׁמַעַתְּ בְּקוֹלִי
  choice: denn du hast nicht auf meine Stimme gehört
  rationale: Bewahrt die Wiederholung von שׁמע und das hebräische Stimmenbild; »auf eine Stimme hören« trägt im Deutschen ebenfalls den Sinn des Befolgens.
theological_decisions:
- issue: Weiblich personifizierte Adressatin
  choice: Die Anrede bleibt im Haupttext beim unbestimmten Singular »du«.
  alternative: Die Adressatin ausdrücklich als Jerusalem, Juda oder das Königshaus benennen.
  rationale: Die femininen Singularformen weisen kontextuell auf eine personifizierte kollektive Größe, doch der Vers selbst nennt sie nicht. Eine ausdrückliche Identifikation würde die vorhandene Offenheit stärker auflösen.
- issue: Hören und Gehorchen
  choice: שׁמע wird an beiden Stellen mit »hören« wiedergegeben.
  alternative: Mit »gehorchen« oder »beachten« übersetzen.
  rationale: Die einheitliche Wiedergabe erhält die Wiederholung und die Spannung zwischen tatsächlichem Hören und gehorsamer Reaktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gottesrede bleibt knapp und eindringlich; beide Vorkommen von שׁמע werden bewusst gleich wiedergegeben.
