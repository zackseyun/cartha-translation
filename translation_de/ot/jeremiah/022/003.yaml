source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲשׂ֤וּ מִשְׁפָּט֙ וּ/צְדָקָ֔ה וְ/הַצִּ֥ילוּ גָז֖וּל מִ/יַּ֣ד עָשׁ֑וֹק וְ/גֵר֩ יָת֨וֹם וְ/אַלְמָנָ֤ה אַל תֹּנוּ֙ אַל תַּחְמֹ֔סוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֥וֹם הַ/זֶּֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/003.yaml
  text: 'Thus says Yahweh: Do justice and righteousness[a], and deliver the robbed person from the hand of the oppressor. Do not oppress the resident foreigner, the fatherless, or the widow, and do not do violence[c][b], and do not shed innocent blood in this place.'
translation:
  language: de
  text: 'So spricht Jahwe: Übt Recht und Gerechtigkeit[a] und rettet den Beraubten aus der Gewalt des Unterdrückers. Unterdrückt den ansässigen Fremden[b], die Waise und die Witwe nicht und verübt keine Gewalttat[c]. Vergießt an diesem Ort kein unschuldiges Blut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tut, was recht und gerecht ist.“ Das Hebräische gebraucht zwei Begriffe, die zusammen gerechtes öffentliches Handeln und moralische Rechtschaffenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der „ansässige Fremde“ bezeichnet eine nicht einheimische Person, die unter Israel lebte und oft gesellschaftlich besonders schutzbedürftig war; traditionell auch „Fremdling“.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht beim zweiten Verbot kein ausdrückliches Objekt: „und verübt keine Gewalttat“. Im Zusammenhang kann es sich weiterhin auf den ansässigen Fremden, die Waise und die Witwe beziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die prophetische Botenformel und gibt den im Hebräischen ausdrücklich stehenden Gottesnamen als „Jahwe“ wieder.
- source_word: עֲשׂוּ מִשְׁפָּט וּצְדָקָה
  choice: Übt Recht und Gerechtigkeit
  rationale: „Übt“ ist im Deutschen idiomatisch mit den beiden ethischen Begriffen verbunden; beide hebräischen Substantive bleiben unterscheidbar erhalten.
- source_word: וְהַצִּילוּ גָזוּל
  choice: und rettet den Beraubten
  rationale: Der Hifil-Imperativ fordert aktives Eingreifen; das passive גָזוּל bezeichnet den Menschen, der beraubt beziehungsweise ausgeplündert wurde.
- source_word: מִיַּד עָשׁוֹק
  choice: aus der Gewalt des Unterdrückers
  rationale: Die Wendung „aus der Hand“ bezeichnet hier Macht oder Verfügungsgewalt. Natürliches Deutsch gibt den Sinn mit „aus der Gewalt“ wieder.
- source_word: גֵר
  choice: ansässiger Fremder
  rationale: Bezeichnet einen Nichtisraeliten, der dauerhaft unter Israel lebt und gesellschaftlich besonders schutzbedürftig ist.
- source_word: יָתוֹם
  choice: Waise
  rationale: Das hebräische Wort bezeichnet besonders ein vaterloses und dadurch sozial schutzloses Kind; „Waise“ ist die klare moderne deutsche Bezeichnung.
- source_word: אַל תֹּנוּ אַל תַּחְמֹסוּ
  choice: Unterdrückt ... nicht und tut ihnen keine Gewalt an
  rationale: Die beiden überlappenden, aber nicht identischen Verbote bleiben getrennt erhalten. Das ergänzte Pronomen macht den im Hebräischen aus dem Kontext erschlossenen Bezug auf die drei schutzbedürftigen Gruppen deutlich.
- source_word: וְדָם נָקִי אַל תִּשְׁפְּכוּ
  choice: Vergießt ... kein unschuldiges Blut
  rationale: Bewahrt das konkrete und im Deutschen geläufige biblische Bild des Blutvergießens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von מִשְׁפָּט und צְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: was recht und richtig ist
  rationale: Die zwei koordinierten hebräischen Begriffe werden nicht zu einem einzigen Gedanken zusammengezogen; so bleibt ihre ethische und öffentliche Spannweite sichtbar.
- issue: Bezug von אַל תַּחְמֹסוּ
  choice: tut ihnen keine Gewalt an
  alternative: begeht keine Gewalttat
  rationale: Das Hebräische nennt bei diesem zweiten Verb kein ausdrückliches Objekt. Der unmittelbare Kontext legt den Rückbezug auf Fremden, Waise und Witwe nahe; die Fußnote hält die grammatisch mögliche allgemeinere Lesart offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Anrede im Plural. Die Satzfolge folgt dem Hebräischen eng, wird aber zur Klarheit in drei deutsche Sätze gegliedert. „Aus der Gewalt“ ersetzt die im Deutschen weniger natürliche Körpermetapher „aus der Hand“, ohne den Machtsinn abzuschwächen.
