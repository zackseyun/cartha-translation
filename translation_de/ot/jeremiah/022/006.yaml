source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל בֵּית֙ מֶ֣לֶךְ יְהוּדָ֔ה גִּלְעָ֥ד אַתָּ֛ה לִ֖/י רֹ֣אשׁ הַ/לְּבָנ֑וֹן אִם לֹ֤א אֲשִֽׁיתְ/ךָ֙ מִדְבָּ֔ר עָרִ֖ים לֹ֥א נושבה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/006.yaml
  text: 'For thus says Yahweh concerning the house of the king of Judah: You are Gilead to me[a], the summit of Lebanon; surely I will make you a wilderness[c][b], cities not inhabited.'
translation:
  language: de
  text: 'Denn so spricht Jahwe über das Haus des Königs von Juda: Du bist für mich wie Gilead, wie der Gipfel des Libanon. Gewiss, ich mache dich zu einer Wüste, zu unbewohnten Städten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht eine schwurartige Wendung: »wenn ich dich nicht zur Wüste mache«. Sie bekräftigt die Gewissheit der Ankündigung. Die letzten Worte können auch als »Städte, die nicht bewohnt sind« wiedergegeben werden.'
    reason: Die Anmerkung erklärt die elliptische hebräische Schwurformel, ohne eine nicht im Text stehende Lebensschwurformel zu ergänzen, und dokumentiert die knappe appositionelle Schlussformulierung.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die geläufige deutsche Form.
- source_word: עַל בֵּית מֶלֶךְ יְהוּדָה
  choice: über das Haus des Königs von Juda
  rationale: »Haus« bewahrt die mögliche Breite zwischen Palast, königlichem Haushalt und Dynastie; עַל wird neutral als Gegenstandsangabe wiedergegeben.
- source_word: גִּלְעָד אַתָּה לִי רֹאשׁ הַלְּבָנוֹן
  choice: Du bist für mich wie Gilead, wie der Gipfel des Libanon
  rationale: Die ergänzten Vergleichswörter machen die metaphorische Gleichsetzung im Deutschen verständlich. »Gipfel« gibt das geografisch gebrauchte רֹאשׁ natürlich wieder, ohne die erhabene Bildsprache aufzulösen.
- source_word: אִם לֹא
  choice: Doch so gewiss ich lebe
  rationale: Die formal bedingte Wendung dient hier als nachdrückliche, schwurartige Bekräftigung. Die deutsche Schwurformel drückt diese Gewissheit aus; »doch« markiert den im Satz angelegten Umschlag von Wertschätzung zu Gericht.
- source_word: אֲשִׁיתְךָ מִדְבָּר
  choice: Ich mache dich zur Wüste
  rationale: שׂים mit prädikativer Ergänzung bedeutet hier »zu etwas machen«; »Wüste« bezeichnet den Zustand der Verödung.
- source_word: עָרִים לֹא נוֹשָׁבָה
  choice: zu Städten, in denen niemand wohnt
  rationale: Die appositionelle Fortführung wird im Deutschen parallel zu »zur Wüste« gefasst und beschreibt anschaulich das Ergebnis des Gerichts.
theological_decisions:
- issue: Erhabene Ortsbilder und anschließendes Gericht
  choice: Das Königshaus wird mit Gilead und dem Gipfel des Libanon verglichen, bevor seine sichere Verwüstung angekündigt wird.
  alternative: Die Ortsnamen könnten enger auf die wald- beziehungsweise zedernreiche Pracht des Palastes bezogen sein.
  rationale: Die Übersetzung erhält die Spannung zwischen Wertschätzung beziehungsweise Erhabenheit und dem folgenden Gericht, ohne die Bildsprache auf eine einzelne Deutung festzulegen.
- issue: Schwurartige Aussage אִם לֹא
  choice: »Doch so gewiss ich lebe« als deutsche Bekräftigungsformel
  alternative: »Fürwahr« oder wörtlich »wenn ich dich nicht …«
  rationale: Die Wendung ist keine offene Bedingung, sondern eine elliptische Schwurformel. Die gewählte Fassung vermittelt die unbedingte Gewissheit des göttlichen Gerichtsworts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die geografische Bildsprache bleibt erhalten; »Haus« wird nicht vorschnell auf Palast oder Dynastie verengt. Die Wiederholung von »wie« dient der natürlichen deutschen Verständlichkeit.
