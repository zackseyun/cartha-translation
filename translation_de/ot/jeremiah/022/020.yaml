  text: עֲלִ֤י הַ/לְּבָנוֹן֙ וּֽ/צְעָ֔קִי וּ/בַ/בָּשָׁ֖ן תְּנִ֣י קוֹלֵ֑/ךְ וְ/צַֽעֲקִי֙ מֵֽ/עֲבָרִ֔ים כִּ֥י נִשְׁבְּר֖וּ כָּל מְאַהֲבָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/020.yaml
  text: Go up to Lebanon and cry out[a]; raise your voice in Bashan; cry out from Abarim[b], for all your lovers are shattered.
translation:
  language: de
  text: Steig auf den Libanon und ruf laut; erhebe deine Stimme im Baschan; ruf vom Abarim[a] her, denn alle deine Liebhaber[b] sind zerschmettert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Übergängen“ beziehungsweise „von den jenseitigen Gebieten“. Im Zusammenhang mit Libanon und Baschan ist hier wahrscheinlich Abarim als Ortsname gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Deine Liebhaber“ ist ein prophetisches Bild für Judas beziehungsweise Jerusalems ausländische Verbündete oder politische Partner.
    reason: cultural_note
lexical_decisions:
- source_word: עֲלִי
  choice: Steig auf
  rationale: Der feminine Singularimperativ von עלה fordert die angeredete Stadt beziehungsweise Gemeinschaft unmittelbar zum Hinaufsteigen auf. „Steig auf“ ist natürlich und bewahrt die Richtungsangabe.
- source_word: וּצְעָקִי / וְצַעֲקִי
  choice: und ruf laut / ruf
  rationale: צעק bezeichnet einen lauten, dringlichen Hilferuf oder Klageruf. Die Wiederholung im Deutschen erhält den poetischen Parallelismus, ohne die Gefühlslage enger als der hebräische Ausdruck festzulegen.
- source_word: תְּנִי קוֹלֵךְ
  choice: erhebe deine Stimme
  rationale: Die hebräische Wendung lautet wörtlich „gib deine Stimme“. „Erhebe deine Stimme“ gibt den idiomatischen Sinn klar, würdevoll und bildnah wieder.
- source_word: מֵעֲבָרִים
  choice: vom Abarim her
  rationale: Im Zusammenhang mit Libanon und Baschan liegt die Deutung als Ortsname, wahrscheinlich das Abarim-Gebirge beziehungsweise dessen Region, nahe. „her“ macht die Ausgangsbedeutung der Präposition מן im Deutschen deutlich.
- source_word: נִשְׁבְּרוּ
  choice: sind zerschmettert
  rationale: Das Nifal Perfekt von שבר bezeichnet hier den eingetretenen Zusammenbruch der bildlich als Liebhaber bezeichneten Partner. „Zerschmettert“ bewahrt das starke Bruchbild und vermeidet die interpretierende Ersetzung durch „vernichtet“.
- source_word: מְאַהֲבָיִךְ
  choice: deine Liebhaber
  rationale: Die wörtliche Metapher aus der prophetischen Bündnis- und Untreuerhetorik bleibt erhalten. Eine Wiedergabe als „Verbündete“ würde den politischen Bezug erklären, aber das literarische und theologische Bild auflösen.
theological_decisions:
- issue: Metaphorische Bedeutung von מְאַהֲבָיִךְ
  choice: Die Metapher „deine Liebhaber“ steht im Haupttext.
  alternative: „deine Verbündeten“
  rationale: Im Kontext sind wahrscheinlich ausländische politische Partner Judas beziehungsweise Jerusalems gemeint. Die Übersetzung bewahrt jedoch das prophetische Bild, statt dessen sachliche Deutung in den Haupttext einzusetzen.
- issue: Referenz von מֵעֲבָרִים
  choice: Als Ortsname „Abarim“ wiedergegeben.
  alternative: „von den Übergängen“ oder „von den jenseitigen Gebieten“
  rationale: Die Folge Libanon, Baschan und Abarim spricht für eine geografische Dreierreihe. Da die Form auch als gewöhnliches Substantiv verstanden werden kann, wird die echte lexikalische Mehrdeutigkeit in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige poetische Prosa. Die feminine Anrede des Hebräischen wird durch die deutschen Imperative nicht eigens markiert, ist aber kontextuell auf die personifizierte Stadt beziehungsweise Gemeinschaft bezogen. Die parallelen Aufforderungen und die starke Schlussmetapher bleiben erhalten.
