id: JER.22.24
reference: Jeremiah 22:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַי אָנִי֮ נְאֻם יְהוָה֒ כִּ֣י אִם יִהְיֶ֞ה כָּנְיָ֤הוּ בֶן יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה חוֹתָ֖ם עַל יַ֣ד יְמִינִ֑/י כִּ֥י מִ/שָּׁ֖ם אֶתְּקֶֽ/נְךָּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/024.yaml
  text: As I live[a], declares Yahweh, even if Coniah son of Jehoiakim, king of Judah, were a signet ring on my right hand[b], even from there I would tear you off.
translation:
  language: de
  text: 'So wahr ich lebe, spricht Jahwe: Selbst wenn Konja[a], der Sohn Jojakims, König von Juda, ein Siegelring[b] an meiner rechten Hand wäre, würde ich dich doch von dort abreißen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Konja ist eine Namensform desselben Königs, der auch Jechonja beziehungsweise Jojachin genannt wird.
    reason: alternative_reading
  - marker: b
    text: Oder „Siegel“. Gemeint ist ein getragenes Siegel als Zeichen von Autorität und besonderem Wert.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Die geläufige deutsche Schwurformel gibt den feierlichen göttlichen Selbsteid natürlich und präzise wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den charakteristischen prophetischen Botenformel-Stil und unterscheidet נְאֻם von einem gewöhnlichen Verb des Sagens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen in der etablierten deutschen Form wieder.
- source_word: כִּי אִם יִהְיֶה
  choice: Selbst wenn … wäre
  rationale: Gibt die stark konzessive, hypothetische Konstruktion idiomatisch wieder, ohne die Irrealität übermäßig festzulegen.
- source_word: כָּנְיָהוּ
  choice: Konja
  rationale: Transliteriert die in diesem Vers tatsächlich gebrauchte kürzere Namensform, statt sie mit Jojachin oder Jechonja zu harmonisieren.
- source_word: חוֹתָם
  choice: Siegelring
  rationale: Bezeichnet hier das am Körper getragene Siegel als kostbaren Gegenstand und Zeichen von Autorität; im Zusammenhang mit der Hand ist „Siegelring“ im Deutschen anschaulich.
- source_word: עַל יַד יְמִינִי
  choice: an meiner rechten Hand
  rationale: Bewahrt die Körpermetapher und klingt im Deutschen in Verbindung mit einem getragenen Siegelring natürlich.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Verweist unmittelbar auf die gedachte Ehrenstellung an Jahwes rechter Hand zurück.
- source_word: אֶתְּקֶנְךָּ
  choice: würde ich dich … abreißen
  rationale: Das Verb נתק bezeichnet ein gewaltsames Los- oder Abreißen; der deutsche Ausdruck erhält die Härte des Gerichtsbildes und den Wechsel zur direkten Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar gemacht; „Jahwe“ ist die im modernen Deutschen etablierte wissenschaftliche und kirchlich bekannte Form.
- issue: Namensform כָּנְיָהוּ
  choice: Konja
  alternative: Jechonja bzw. Jojachin
  rationale: Die kürzere Form des Ausgangstextes bleibt erhalten. Eine Harmonisierung mit anderen Namensformen desselben Königs würde eine textliche Besonderheit verdecken.
- issue: Wechsel von der dritten zur zweiten Person
  choice: „Konja … wäre“ / „würde ich dich … abreißen“
  alternative: 'durchgehend dritte Person: „würde ich ihn … abreißen“'
  rationale: Der masoretische Text wechselt bewusst von der Nennung Konjas zur direkten Anrede im Suffix אֶתְּקֶנְךָּ. Dieser rhetorische Wechsel wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich markiert die feierliche Prophetenformel; die Satzstellung wahrt Nachdruck und Bildhaftigkeit. Die Fußnote bündelt die erklärungsbedürftige Namensvariante und die sachliche Bedeutung des Siegelbildes.
