  text: דָּ֛ן דִּין עָנִ֥י וְ/אֶבְי֖וֹן אָ֣ז ט֑וֹב הֲ/לוֹא הִ֛יא הַ/דַּ֥עַת אֹתִ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/016.yaml
  text: He defended the cause of the poor and needy[a]; then it was well[b]. Is not that what it means to know me? declares Yahweh.
translation:
  language: de
  text: Er verhalf den Armen und Bedürftigen zu ihrem Recht[a]; da ging es gut. Heißt das nicht, mich zu kennen?[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Er richtete den Rechtsfall des Armen und Bedürftigen“; die hebräische Wendung bezeichnet die gerechte Behandlung beziehungsweise Wahrung ihres Rechtsanspruchs.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Ist dies nicht das Erkennen meiner?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן דִּין
  choice: verhalf … zu ihrem Recht
  rationale: 'Die Verbindung aus Verb und stammverwandtem Substantiv ist forensisch: Der König behandelte den Rechtsfall der sozial Schwachen so, dass ihnen Recht widerfuhr. Die deutsche Wendung ist natürlich und gibt mehr als eine bloße Urteilstätigkeit wieder.'
- source_word: עָנִי וְאֶבְיוֹן
  choice: den Armen und Bedürftigen
  rationale: Das Wortpaar bezeichnet materiell und gesellschaftlich verletzliche Menschen; „Arme“ und „Bedürftige“ wahrt die Unterscheidung ohne unnötige Wiederholung.
- source_word: אָז טוֹב
  choice: da ging es gut
  rationale: „Da“ erhält den zeitlich-folgernden Sinn von אָז; „ging es gut“ gibt das prädikative טוֹב knapp und idiomatisch wieder, ohne ein ausdrücklich genanntes Bezugswort hinzuzufügen.
- source_word: הֲלוֹא הִיא הַדַּעַת אֹתִי
  choice: Heißt nicht das, mich zu kennen?
  rationale: Die rhetorische Frage bleibt erhalten. Die Formulierung gibt das substantivierte „Erkennen meiner“ in natürlichem Deutsch wieder und bewahrt den Zusammenhang zwischen Gotteserkenntnis und gerechtem Handeln.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel wird knapp wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“ statt als ersetzender Titel.
theological_decisions:
- issue: Bedeutung des Erkennens Jahwes
  choice: Gerechtes Handeln an Armen und Bedürftigen wird als konkreter Ausdruck des Erkennens Gottes bezeichnet.
  alternative: Das Erkennen ausschließlich als verstandesmäßiges Wissen oder das gesamte Gottesverhältnis ausschließlich als Sozialethik zu verstehen.
  rationale: Der Vers setzt Gotteserkenntnis eng mit gelebter Gerechtigkeit in Beziehung, sagt aber nicht ausdrücklich, dass diese das Gottesverhältnis in jeder Hinsicht erschöpft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zu ihrem Recht verhelfen“ vermittelt den juristischen Sinn allgemeinverständlich. Der Gedankenstrich vor der prophetischen Formel trennt den Sprechervermerk klar vom rhetorischen Fragesatz.
