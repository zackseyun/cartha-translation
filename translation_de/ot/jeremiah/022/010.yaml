base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/010.yaml
  text: Do not weep for the dead[a], and do not mourn for him. Weep bitterly for the one going away[b], for he will never return or see the land of his birth.
translation:
  language: de
  text: Weint nicht um den Toten und beklagt ihn nicht. Weint bitterlich[a] um den, der fortgeht[b]; denn er wird nie mehr zurückkehren und das Land seiner Geburt sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Weint, ja, weint“; das Hebräische verstärkt die Aufforderung durch einen Infinitivus absolutus nach dem Imperativ.'
    reason: lexical_alternative
  - marker: b
    text: Mit „dem, der fortgeht“ ist im Zusammenhang der Herrscher gemeint, der ins Exil weggeführt wird.
    reason: cultural_note
lexical_decisions:
- source_word: תִּבְכּוּ לְמֵת
  choice: Weint nicht um den Toten
  rationale: בכה bezeichnet Weinen oder Klagen; die Verbindung mit ל wird im Deutschen idiomatisch mit „um“ wiedergegeben. „Der Tote“ bewahrt die knappe substantivische Form des Hebräischen.
- source_word: תָּנֻדוּ לוֹ
  choice: beklagt ihn nicht
  rationale: נוד kann im Trauerzusammenhang das Bezeigen von Mitgefühl, Klagen oder eine Trauergeste bezeichnen. „Beklagt ihn“ bleibt bewusst allgemein und legt keine bestimmte Geste fest.
- source_word: בְּכוּ בָכוֹ
  choice: Weint bitterlich
  rationale: Der Imperativ mit folgendem Infinitivus absolutus verstärkt die Aufforderung. „Bitterlich“ gibt diese Intensivierung in natürlichem, würdigem Deutsch wieder.
- source_word: לַהֹלֵךְ
  choice: um den, der fortgeht
  rationale: Die substantivierte Form von הלך bedeutet wörtlich „der Gehende/Fortgehende“. Die Übersetzung bewahrt das Bewegungsbild, ohne das im Kontext naheliegende Exil bereits in den Haupttext einzutragen.
- source_word: לֹא יָשׁוּב עוֹד
  choice: er wird nie mehr zurückkehren
  rationale: לא ... עוד drückt aus, dass die Rückkehr künftig ausgeschlossen ist. „Nie mehr“ gibt diese Endgültigkeit idiomatisch wieder.
- source_word: וְרָאָה אֶת אֶרֶץ מוֹלַדְתּוֹ
  choice: und das Land seiner Geburt wiedersehen
  rationale: Unter der fortwirkenden Verneinung bildet וְרָאָה die zweite ausgeschlossene Handlung. Das deutsche Verb „wiedersehen“ macht den Bezug zur verlorenen Heimat natürlich deutlich; „Land seiner Geburt“ bewahrt den konkreten Ausdruck אֶרֶץ מוֹלַדְתּוֹ.
