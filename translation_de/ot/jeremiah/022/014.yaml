base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/014.yaml
  text: who says[a], ‘I will build myself a spacious house with roomy upper chambers,’ and cuts out windows for it, paneling it with cedar and painting it red.
translation:
  language: de
  text: 'der sagt: »Ich will mir ein großes Haus mit geräumigen oberen Räumen bauen«, der Fensteröffnungen darin ausbrechen lässt, es mit Zedernholz vertäfelt und rot anstreicht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »es mit Zinnober anstreicht«; gemeint ist möglicherweise ein roter Farbstoff, etwa Zinnober (Cinnabarit).'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: der sagt
  rationale: Das artikulierte Partizip wird substantivisch gebraucht und führt die Charakterisierung aus dem Weheruf des vorherigen Verses fort.
- source_word: אֶבְנֶה לִּי
  choice: Ich will mir ... bauen
  rationale: Das ל mit Suffix bezeichnet den persönlichen Nutzen; die deutsche Dativkonstruktion gibt dies natürlich und knapp wieder.
- source_word: בֵּית מִדּוֹת
  choice: ein geräumiges Haus
  rationale: Die Wendung bezeichnet ein Haus von beträchtlichen Ausmaßen; »geräumig« wahrt den Sinn, ohne stärker als der Ausgangstext zu »Palast« zuzuspitzen.
- source_word: וַעֲלִיּוֹת מְרֻוָּחִים
  choice: mit weiten Obergemächern
  rationale: עֲלִיּוֹת sind Räume im Obergeschoss; מְרֻוָּחִים bezeichnet ihre Weite oder Geräumigkeit. »Obergemächer« ist würdevoll und im biblischen Baukontext verständlich.
- source_word: וְקָרַע לוֹ חַלּוֹנָי
  choice: Er bricht sich Fenster aus
  rationale: קָרַע vermittelt das kräftige Öffnen beziehungsweise Herausschlagen von Fensteröffnungen. Das pronominale לוֹ wird als Dativ des persönlichen Nutzens bewahrt.
- source_word: וְסָפוּן בָּאָרֶז
  choice: täfelt das Haus mit Zedernholz
  rationale: ספן bezeichnet hier das Verkleiden oder Täfeln eines Bauwerks; die ausdrückliche Wiederaufnahme von »das Haus« klärt den im Hebräischen nur impliziten Bezug.
- source_word: וּמָשׁוֹחַ בַּשָּׁשַׁר
  choice: streicht es rot
  rationale: משח bezeichnet das Bestreichen, שָׁשַׁר einen roten Farbstoff. Die genaue mineralische Bestimmung bleibt unsicher und wird daher nicht in den Haupttext aufgenommen.
