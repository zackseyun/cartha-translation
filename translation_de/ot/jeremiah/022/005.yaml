  text: וְ/אִם֙ לֹ֣א תִשְׁמְע֔וּ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה בִּ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּי לְ/חָרְבָּ֥ה יִֽהְיֶ֖ה הַ/בַּ֥יִת הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/005.yaml
  text: But if you do not listen to these words[a], I swear by myself, declares Yahweh, that this house will become a ruin.
translation:
  language: de
  text: 'Doch wenn ihr nicht auf diese Worte hört, schwöre ich bei mir selbst – spricht Jahwe –: Dieses Haus[a] wird zur Ruine werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dieser Palast“. Im Zusammenhang ist mit „dieses Haus“ wahrscheinlich das Königshaus beziehungsweise der Palast des Königs von Juda gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die Wendung leitet eine Bedingung ein, die im Kontrast zur vorangehenden Verheißung steht. „Doch wenn“ gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: תִשְׁמְעוּ
  choice: ihr … hört
  rationale: שׁמע kann „hören“, „zuhören“ oder „gehorchen“ bedeuten. Die Verbindung „auf diese Worte hört“ bewahrt den Höraspekt und lässt zugleich das geforderte Beachten der Worte anklingen, ohne ausdrücklich „gehorchen“ einzutragen.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Im Zusammenhang prophetischer Rede ist „Worte“ die direkte und passende Wiedergabe.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: ich schwöre bei mir selbst
  rationale: בִּי bezeichnet in der Schwurformel den Schwörenden selbst als Bürge. Das hebräische Perfekt kann hier als unmittelbar vollzogener, performativer Schwur verstanden werden.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel wahrt den feierlichen Charakter und bleibt allgemein verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als „Jahwe“ wiedergegeben.
- source_word: לְחָרְבָּה
  choice: zur Ruine
  rationale: Das Substantiv bezeichnet einen verwüsteten, zerstörten Zustand. „Zur Ruine werden“ ist im Deutschen anschaulich und idiomatisch.
- source_word: יִהְיֶה הַבַּיִת הַזֶּה
  choice: Dieses Haus wird … werden
  rationale: „Haus“ entspricht dem hebräischen Ausdruck und lässt dessen mögliche Bedeutung als Königshaus beziehungsweise Palast offen; „werden“ gibt den eintretenden Zustand natürlich wieder.
theological_decisions:
- issue: Zeitform und Funktion der göttlichen Schwurformel
  choice: ich schwöre bei mir selbst
  alternative: ich habe bei mir selbst geschworen
  rationale: Das Perfekt kann in dieser direkten Gottesrede performativ gebraucht sein. Das Präsens erhält die Unmittelbarkeit des Schwurs, ohne seinen Inhalt zu verändern.
- issue: Bezug von „dieses Haus“
  choice: dieses Haus
  alternative: dieser Palast
  rationale: Der unmittelbare Kontext handelt vom Haus des Königs von Juda, sodass der Königspalast gemeint sein kann. Da der hebräische Text jedoch „Haus“ sagt, bleibt diese mögliche Mehrdeutigkeit im Haupttext erhalten und wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung hält die feierliche göttliche Schwurformel deutlich hervor; die mögliche Bedeutung von „Haus“ als Königspalast wird nicht stillschweigend in den Haupttext eingetragen.
