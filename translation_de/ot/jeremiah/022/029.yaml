  text: אֶ֥רֶץ אֶ֖רֶץ אָ֑רֶץ שִׁמְעִ֖י דְּבַר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/029.yaml
  text: Land[a], land, land, hear the word of Yahweh.
translation:
  language: de
  text: Land[a], Land, Land, höre das Wort Jahwes!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Erde, Erde, Erde«; das hebräische Wort אֶרֶץ kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ / אָרֶץ
  choice: Land
  rationale: Das Substantiv kann »Land« oder »Erde« bedeuten. Im Zusammenhang ist wahrscheinlich das Land Juda angeredet; die dreifache Wiederholung bleibt als eindringlicher prophetischer Ruf erhalten.
- source_word: שִׁמְעִי
  choice: höre
  rationale: Der feminine Singular des Imperativs stimmt mit אֶרֶץ überein. »Höre« gibt den unmittelbaren Sinn wieder und kann zugleich aufmerksames Vernehmen und Beherzigen einschließen.
- source_word: דְּבַר
  choice: das Wort
  rationale: »Das Wort Jahwes« bewahrt die prägnante prophetische Formel; »Botschaft« wäre möglich, aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen direkt. »Jahwe« wahrt seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Adressat des dreifachen Rufes אֶרֶץ
  choice: Land
  alternative: Erde
  rationale: Der Kontext legt das Land Juda als angeredeten Zeugen beziehungsweise Adressaten nahe. Da אֶרֶץ jedoch auch »Erde« bedeuten kann, wird diese echte lexikalische Möglichkeit in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Anrede und der knappe Imperativ bewahren den eindringlichen prophetischen Ton; das Ausrufezeichen entspricht der starken Rufwirkung, ohne zusätzliche Aussage einzutragen.
