id: JER.22.15
reference: Jeremiah 22:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/תִֽמְלֹ֔ךְ כִּ֥י אַתָּ֖ה מְתַחֲרֶ֣ה בָ/אָ֑רֶז אָבִ֜י/ךָ הֲ/ל֧וֹא אָכַ֣ל וְ/שָׁתָ֗ה וְ/עָשָׂ֤ה מִשְׁפָּט֙ וּ/צְדָקָ֔ה אָ֖ז ט֥וֹב לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/015.yaml
  text: Do you reign because you compete in cedar? Did not your father eat and drink and do justice and righteousness? Then it was well with him[a][b].
translation:
  language: de
  text: Meinst du, du seist König, weil du mit Zedernholz wetteiferst?[a] Hat dein Vater nicht gegessen und getrunken und Recht und Gerechtigkeit geübt?[b] Damals ging es ihm gut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die seltene hebräische Wendung kann auch mit „um Zedernholz wetteiferst“ oder „eifrig nach Zedernholz strebst“ wiedergegeben werden. Wahrscheinlich geht es um königlichen Konkurrenzgeist, der sich in prunkvollem Bauen mit Zedernholz zeigt.
    reason: lexical_alternative
  - marker: b
    text: „Recht und Gerechtigkeit“ kann auch mit „Recht und das Rechte“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתִמְלֹךְ
  choice: Meinst du, du seist König
  rationale: Die rhetorische Frage bestreitet nicht unbedingt das formale Königtum, sondern dessen vermeintliche Grundlage. Die Formulierung gibt diese herausfordernde Aussage im natürlichen modernen Deutsch wieder.
- source_word: כִּי
  choice: weil
  rationale: כִּי führt hier den vermeintlichen Grund des Königtums ein; „weil“ macht den argumentativen Zusammenhang deutlich.
- source_word: מְתַחֲרֶה בָאָרֶז
  choice: mit Zedernholz wetteiferst
  rationale: Die seltene Wendung bezeichnet wahrscheinlich ehrgeiziges Sichmessen durch luxuriöses Bauen mit Zedernholz. Die Übersetzung bewahrt das Bild und kennzeichnet seine Unsicherheit in Fußnote [a].
- source_word: אָכַל וְשָׁתָה
  choice: gegessen und getrunken
  rationale: Die gewöhnliche Lebensführung des Vaters wird ohne Unterstellung von Ausschweifung wiedergegeben.
- source_word: וְעָשָׂה מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit geübt
  rationale: „Recht und Gerechtigkeit“ bewahrt das feste prophetische Begriffspaar; „geübt“ ist im Deutschen eine natürliche Wiedergabe von עשה in dieser Verbindung.
- source_word: אָז טוֹב לוֹ
  choice: Damals ging es ihm gut
  rationale: אָז wird zeitlich als „damals“ verstanden und zugleich bleibt der im Kontext erkennbare Zusammenhang mit dem gerechten Handeln bestehen. Die deutsche Wendung gibt טוֹב לוֹ idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Begriffspaars מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  alternative: Recht und das Rechte
  rationale: Die gewählte Fassung erhält die beiden unterscheidbaren, theologisch gewichtigen Begriffe, ohne sie zu bloßen Synonymen zu machen. Die stärker dynamische Alternative wird in Fußnote [b] genannt.
- issue: Bedeutung von אָז im Schlusssatz
  choice: Damals ging es ihm gut
  alternative: Da ging es ihm gut / Deshalb ging es ihm gut
  rationale: „Damals“ wahrt den primär zeitlichen Sinn von אָז und lässt zugleich den möglichen Folgesinn aus dem Zusammenhang hervorgehen, ohne ihn ausdrücklich kausal festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einleitende Frage ist bewusst zugespitzt formuliert; das seltene Zedernbild und die mögliche zeitliche beziehungsweise folgernde Nuance des Schlusses werden nicht dogmatisch vereindeutigt.
