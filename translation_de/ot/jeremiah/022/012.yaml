source:
  edition: WLC
  text: כִּ֗י בִּ/מְק֛וֹם אֲשֶׁר הִגְל֥וּ אֹת֖/וֹ שָׁ֣ם יָמ֑וּת וְ/אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לֹֽא יִרְאֶ֥ה עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/012.yaml
  text: For in the place where they have exiled him[a], there he will die, and he will never see this land again.
translation:
  language: de
  text: Denn an dem Ort, an den sie ihn ins Exil gebracht haben[a], dort wird er sterben, und dieses Land wird er nie wiedersehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an den sie ihn verschleppt haben« / »an den sie ihn ins Exil geführt haben«. Das hebräische Verb bezeichnet hier, dass jemand ins Exil gebracht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt den erklärenden Zusammenhang im Deutschen natürlich wieder.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: an dem Ort, wohin
  rationale: Die Formulierung verbindet den Ort mit dem Ziel der Verbannung und ist im Deutschen idiomatischer als eine rein wörtliche Wiedergabe.
- source_word: הִגְלוּ אֹתוֹ
  choice: man ihn in die Verbannung geführt hat
  rationale: Der Hifil von גלה bezeichnet, dass jemand ins Exil gebracht wird. Das unpersönliche »man« bewahrt den im Hebräischen nicht näher bestimmten pluralischen Handlungsträger.
- source_word: שָׁם
  choice: dort
  rationale: 'Bewahrt die nachdrückliche Wiederaufnahme des Ortes: Gerade dort wird er sterben.'
- source_word: יָמוּת
  choice: wird er sterben
  rationale: Gibt die prophetische Zukunftsaussage klar und in modernem Deutsch wieder.
- source_word: וְאֶת־הָאָרֶץ הַזֹּאת
  choice: und dieses Land
  rationale: אָרֶץ bezeichnet hier das Heimatland Juda; »Land« ist sachlich und kontextuell angemessen.
- source_word: לֹא יִרְאֶה עוֹד
  choice: wird er nie wiedersehen
  rationale: Gibt die Endgültigkeit der Verneinung mit עוֹד idiomatisch und prägnant wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »an dem Ort … dort« bleibt zur Wahrung der hebräischen Hervorhebung erhalten; »man« lässt die Handelnden wie im Ausgangstext unbestimmt.
