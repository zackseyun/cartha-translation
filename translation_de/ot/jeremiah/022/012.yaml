revisions:
- from: Denn an dem Ort, wohin man ihn in die Verbannung geführt hat[a], dort wird er sterben, und dieses Land wird er nie wiedersehen.
  to: Denn an dem Ort, an den sie ihn ins Exil gebracht haben[a], dort wird er sterben, und dieses Land wird er nie wiedersehen.
  rationale: Die Revision glättet die deutsche Ausdrucksweise und gibt zugleich die mit dem Verb der Exilierung verbundene Zielrichtung präzise wieder. Die betonte Wiederaufnahme „dort“ sowie die unbestimmte pluralische Handlungsträgerschaft des Hebräischen bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:40:28Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Aussage ist im Wesentlichen zutreffend: כִּי wird sinnvoll mit „Denn“ wiedergegeben, die unbestimmten Handelnden bleiben gewahrt, und die Endgültigkeit von לֹא ... עוֹד wird idiomatisch ausgedrückt. „Wohin“ macht jedoch die Zielrichtung stärker explizit, während die hebräische Ortsformulierung zunächst den Ort bezeichnet, an dem die Verbannung erfolgt ist. Eine Formulierung mit „an den“ ist im Deutschen bei einem Verb der Verbringung natürlich und präziser.'
  naturalness: Der Entwurf ist gut verständlich und hat einen angemessen würdevollen modernen Registerton. „In die Verbannung geführt“ ist aber weniger idiomatisch als „ins Exil gebracht“ oder „ins Exil geführt“.
  terminology: „Land“ gibt אָרֶץ im judäischen Kontext angemessen wieder. „Ins Exil gebracht“ gibt den kausativen Charakter von הִגְלוּ klar wieder, ohne die im Text ungenannten Akteure zu spezifizieren. Die Fußnote sollte nicht behaupten, das Verb bezeichne dies „ausdrücklich“; es bezeichnet vielmehr das Verbringen bzw. Führen ins Exil.
  issues:
  - severity: low
    issue: Orts- und Richtungsformulierung
    rationale: „An dem Ort, wohin“ ist verständlich, vermischt aber die Ortsangabe mit der durch das Verb nahegelegten Zielrichtung. „An dem Ort, an den sie ihn ins Exil gebracht haben“ ist im Deutschen präzise und natürlich.
  - severity: low
    issue: Formulierung und Nuance der Fußnote
    rationale: „In die Verbannung geführt“ klingt etwas steif. Außerdem ist „ausdrücklich“ für die lexikalische Aussage zu stark; eine sachlichere Beschreibung wahrt die Bedeutung ohne Überbehauptung.
  revised_text: Denn an dem Ort, an den sie ihn ins Exil gebracht haben[a], dort wird er sterben, und dieses Land wird er nie wiedersehen.
  revised_footnotes:
  - marker: a
    text: 'Oder: »an den sie ihn verschleppt haben« / »an den sie ihn ins Exil geführt haben«. Das hebräische Verb bezeichnet hier, dass jemand ins Exil gebracht wird.'
    reason: lexical_alternative
  revision_rationale: Die Revision glättet die deutsche Ausdrucksweise und gibt zugleich die mit dem Verb der Exilierung verbundene Zielrichtung präzise wieder. Die betonte Wiederaufnahme „dort“ sowie die unbestimmte pluralische Handlungsträgerschaft des Hebräischen bleiben erhalten.
