source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה רֵ֖ד בֵּֽית מֶ֣לֶךְ יְהוּדָ֑ה וְ/דִבַּרְתָּ֣ שָׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/001.yaml
  text: 'Thus says Yahweh: Go down to the house of the king of Judah[c][b][a], and speak there this word:'
translation:
  language: de
  text: 'So spricht Jahwe: Geh hinab zum Haus des Königs von Juda[a] und sprich dort dieses Wort[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „zum Haus des Königs von Juda“; wahrscheinlich ist der Königspalast gemeint.
    reason: cultural_note
  - marker: b
    text: 'Oder: „diese Botschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in natürlichem, würdigem Deutsch wiedergegeben. Das Präsens entspricht ihrer Funktion als unmittelbare Einleitung einer göttlichen Rede; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: רֵד
  choice: Geh hinab
  rationale: Der Imperativ bewahrt die im Hebräischen ausdrücklich bezeichnete Abwärtsbewegung, ohne das Ziel oder den Ausgangspunkt näher festzulegen.
- source_word: בֵּית מֶלֶךְ יְהוּדָה
  choice: zum Haus des Königs von Juda
  rationale: Die Formulierung bleibt nahe beim hebräischen „Haus des Königs von Juda“ und lässt offen, ob der Ausdruck konkret den Königspalast bezeichnet.
- source_word: וְדִבַּרְתָּ שָׁם
  choice: und sprich dort
  rationale: Das auf den Imperativ folgende Verb hat hier ebenfalls Aufforderungscharakter. „Sprich“ gibt das schlichte דבר wieder, ohne die stärkere Bedeutung „verkündige“ einzutragen.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: „Dieses Wort“ bewahrt Singular und prophetischen Sprachgebrauch; gemeint ist die unmittelbar folgende Botschaft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Doppelpunkt weist darauf hin, dass im folgenden Vers die auszurichtende Rede beginnt.
