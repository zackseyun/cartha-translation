source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ שְׁמַ֣ע דְּבַר יְהוָ֔ה מֶ֣לֶךְ יְהוּדָ֔ה הַ/יֹּשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד אַתָּ֤ה וַ/עֲבָדֶ֨י/ךָ֙ וְ/עַמְּ/ךָ֔ הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/022/002.yaml
  text: and say[a], ‘Hear the word of Yahweh, O king of Judah, who sits on the throne of David—you, your servants, and your people who enter through these gates.’
translation:
  language: de
  text: 'Und sage: »Höre das Wort Jahwes, König von Juda, der du auf dem Thron Davids sitzt – du, deine Diener[a] und dein Volk, die ihr durch diese Tore eintretet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Beamten.'
    reason: עֲבָדֶיךָ bedeutet wörtlich »deine Diener«, kann im königlichen Umfeld aber die Amtsträger des Königs bezeichnen.
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: und sage
  rationale: Die fortführende Perfektform setzt den Auftrag aus dem vorherigen Vers fort; »und sage« gibt diese Verbindung knapp und natürlich wieder.
- source_word: שְׁמַע
  choice: Höre
  rationale: Der hebräische Imperativ steht im Singular und richtet sich zunächst an den König. »Höre« bewahrt sowohl die Form als auch den feierlichen Charakter des prophetischen Aufrufs, ohne die Bedeutung auf bloßen Gehorsam zu verengen.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel bezeichnet die von Gott ausgehende Botschaft; »Wort« erhält ihr Offenbarungsgewicht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Die Wendung ist hier eine direkte Anrede. Im Deutschen ist der Vokativ ohne zusätzliches »o« natürlich und würdig.
- source_word: הַיֹּשֵׁב עַל כִּסֵּא דָוִד
  choice: der du auf dem Thron Davids sitzt
  rationale: Das singularische Partizip bezieht sich auf den König. Die Anredekonstruktion »der du« macht diesen Bezug im Deutschen eindeutig und bewahrt den dynastischen Ausdruck.
- source_word: אַתָּה וַעֲבָדֶיךָ וְעַמְּךָ
  choice: du, deine Diener und dein Volk
  rationale: Das ausdrücklich gesetzte Pronomen hebt den König hervor und erweitert zugleich den Kreis der Angesprochenen. »Diener« bewahrt die Breite von עֲבָדִים; im höfischen Zusammenhang sind auch Amtsträger gemeint.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: die durch diese Tore kommen
  rationale: Das pluralische Partizip beschreibt die Genannten als diejenigen, die dort eintreten. »durch diese Tore kommen« gibt die Bewegungsrichtung idiomatisch wieder, ohne den im Hebräischen nicht ausdrücklich genannten Zielort zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht das Tetragramm als Gottes Eigenname. Die Wiedergabe »Jahwe« lässt diesen Namen sichtbar und ersetzt ihn nicht durch einen Titel.
- issue: Träger des davidischen Thrones
  choice: der König sitzt auf dem Thron Davids
  alternative: eine erklärende Umschreibung als davidischer Herrscher
  rationale: Die konkrete Thronformulierung wird beibehalten, sodass ihre dynastische und theologische Bedeutung offenbleibt und nicht durch Auslegung vorentschieden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Anredecharakter. Der singularische Imperativ »Höre« folgt der hebräischen Form, obwohl der anschließende Zusatz den Adressatenkreis auf Diener und Volk erweitert. Der Gedankenstrich bildet diese nachgestellte Erweiterung der Anrede ab.
