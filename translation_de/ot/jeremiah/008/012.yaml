  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
translation:
  language: de
  text: Schämten sie sich, weil sie etwas Abscheuliches getan hatten? Nein, sie schämten sich überhaupt nicht; sie wussten nicht einmal, wie man sich schämt. Darum werden sie unter den Fallenden fallen; zur Zeit ihrer Heimsuchung[a] werden sie straucheln, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Zeit ihrer Bestrafung“ beziehungsweise „zu der Zeit, in der sie zur Rechenschaft gezogen werden“. Das hebräische Wort kann ein Eingreifen Gottes bezeichnen, hier besonders zum Gericht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִשׁוּ
  choice: Schämten sie sich
  rationale: Im Zusammenhang ist die Form am besten als rhetorische Frage zu verstehen; die folgende nachdrückliche Verneinung bestätigt diese Lesart.
- source_word: תוֹעֵבָה
  choice: etwas Abscheuliches
  rationale: Die Formulierung bewahrt die starke moralisch-religiöse Wertung, klingt im heutigen Deutsch aber natürlicher als das substantivische „einen Gräuel“.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: Nein, sie schämten sich überhaupt nicht
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Verneinung; „überhaupt nicht“ gibt diesen Nachdruck idiomatisch wieder.
- source_word: וְהִכָּלֵם לֹא יָדָעוּ
  choice: sie wussten nicht einmal, was Scham ist
  rationale: Die Wiedergabe bezeichnet den völligen Verlust des Schamempfindens, ohne das im Hebräischen nicht zwingend enthaltene körperliche Erröten in den Vordergrund zu stellen.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: sie werden unter den Fallenden fallen
  rationale: Die Formulierung erhält das hebräische Wortspiel und lässt offen, ob das gemeinsame Fallen oder das Fallen inmitten bereits Gefallener betont wird.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: wenn die Zeit ihrer Heimsuchung kommt
  rationale: „Heimsuchung“ bewahrt die Bedeutungsbreite von göttlichem Eingreifen, Rechenschaft und Strafgericht; eine Fußnote erläutert den im Kontext naheliegenden Gerichtssinn.
- source_word: יִכָּשְׁלוּ
  choice: werden sie stürzen
  rationale: Im Gerichtszusammenhang bezeichnet das Verb ein Straucheln mit tatsächlichem Fall; „stürzen“ ist im Deutschen klar und bewahrt die Bildsprache.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die gängige deutsche prophetische Botenformel wird mit dem im Ausgangstext stehenden Gottesnamen verbunden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פְּקֻדָּה im Gerichtswort
  choice: Heimsuchung mit erläuternder Fußnote
  alternative: Bestrafung
  rationale: Der Kontext weist klar auf Gericht, doch das hebräische Wort kann allgemein Gottes Eingreifen beziehungsweise das Zur-Rechenschaft-Ziehen bezeichnen. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe und die Wiederholung der Fall-Metaphorik werden bewahrt; ungebräuchliche religiöse Sprache wird außer beim bewusst erklärten Begriff „Heimsuchung“ vermieden.
