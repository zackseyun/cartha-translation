  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
translation:
  language: de
  text: 'Sie behandeln die Verletzung der Tochter meines Volkes leichtfertig[a] und sagen: »Frieden[b], Frieden!«, obwohl kein Frieden da ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „oberflächlich“; das heißt: als wäre die Verletzung nur geringfügig.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort schalom kann neben „Frieden“ auch Wohlergehen, Unversehrtheit oder Sicherheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  choice: sie heilen
  rationale: Das Verb רפא bedeutet „heilen“. Die wörtliche medizinische Bildsprache bleibt erhalten; im Zusammenhang wirkt die behauptete Heilung bewusst ironisch, weil sie nur oberflächlich geschieht.
- source_word: שֶׁבֶר
  choice: Bruch
  rationale: שֶׁבֶר bezeichnet einen Bruch, eine schwere Beschädigung oder einen Zusammenbruch. „Bruch“ greift zusammen mit „heilen“ das körperliche Verletzungsbild des Hebräischen unmittelbar auf.
- source_word: בַּת עַמִּי
  choice: der Tochter meines Volkes
  rationale: Die prophetische Personifikation des Volkes als Tochter wird bewahrt, da sie Bildkraft und Klagecharakter des Ausdrucks trägt.
- source_word: עַל נְקַלָּה
  choice: nur oberflächlich
  rationale: Die Wendung wirft den Angesprochenen vor, eine schwere Verletzung leichtfertig beziehungsweise nur an der Oberfläche zu behandeln. „Nur oberflächlich“ ist im heutigen Deutsch klar und hält den medizinischen Zusammenhang fest.
- source_word: לֵאמֹר
  choice: indem sie sagen
  rationale: Die Form leitet die falsche Zusicherung ein und kann hier zugleich verdeutlichen, worin die oberflächliche Behandlung besteht.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Frieden, Frieden!
  rationale: Die Wiederholung und der schlagwortartige Klang des Hebräischen bleiben erhalten. Eine Fußnote weist auf das breitere Bedeutungsspektrum von שָׁלוֹם hin.
- source_word: וְאֵין שָׁלוֹם
  choice: obwohl kein Frieden da ist
  rationale: Die konzessive Formulierung macht den Gegensatz zwischen ihrer Zusicherung und der Wirklichkeit natürlich und deutlich, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Prophetische Personifikation des Volkes
  choice: „Tochter meines Volkes“ im Haupttext beibehalten
  alternative: „mein Volk“ oder „mein geliebtes Volk“
  rationale: Der hebräische Text personifiziert das Volk als Tochter. Diese emotional und prophetisch bedeutsame Bildsprache soll nicht in eine sachliche Umschreibung aufgelöst werden.
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: „Frieden“ im Haupttext
  alternative: „Wohlergehen“, „Unversehrtheit“ oder „Alles ist gut“
  rationale: „Frieden“ bewahrt die traditionelle und unmittelbare Entsprechung sowie die eindringliche Wiederholung. Das breitere Bedeutungsfeld wird in der Fußnote offengehalten.
- issue: Ironie des Heilungsverbs
  choice: Das direkte Verb „heilen“ beibehalten
  alternative: „behandeln“ oder „zu heilen versuchen“
  rationale: Der Ausgangstext sagt formal „heilen“, während עַל נְקַלָּה die vermeintliche Heilung als unzulänglich entlarvt. Die Spannung wird nicht durch eine abschwächende Paraphrase aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung „Tochter meines Volkes“ und die Spannung zwischen „heilen“ und „nur oberflächlich“ bleiben als bewusste prophetische Bildsprache erhalten.
