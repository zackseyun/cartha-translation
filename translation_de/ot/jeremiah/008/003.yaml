  text: וְ/נִבְחַ֥ר מָ֨וֶת֙ מֵֽ/חַיִּ֔ים לְ/כֹ֗ל הַ/שְּׁאֵרִית֙ הַ/נִּשְׁאָרִ֔ים מִן הַ/מִּשְׁפָּחָ֥ה הָֽ/רָעָ֖ה הַ/זֹּ֑את בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
translation:
  language: de
  text: Und der Tod wird dem Leben von allen vorgezogen werden, die von dieser bösen Sippe übrig geblieben sind, an allen verbliebenen Orten, an die ich sie vertrieben habe – Ausspruch Jahwes der Heerscharen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִבְחַר
  choice: wird … vorgezogen werden
  rationale: Das Nifal von בחר wird passiv wiedergegeben. Zusammen mit מִן bezeichnet es hier eine Bevorzugung; die deutsche Formulierung bewahrt die schroffe Aussage und nennt keinen zusätzlichen Handelnden.
- source_word: מָוֶת מֵחַיִּים
  choice: der Tod … dem Leben vorgezogen
  rationale: Die direkte Gegenüberstellung von Tod und Leben bleibt erhalten; מִן nach בחר markiert den Vorzug des einen gegenüber dem anderen.
- source_word: לְכֹל הַשְּׁאֵרִית הַנִּשְׁאָרִים
  choice: von dem ganzen Rest, der … übrig geblieben ist
  rationale: לְ bezeichnet bei der passiven Konstruktion die handelnde Gruppe. „Rest“ und „übrig geblieben“ bilden die hebräische Wortwiederholung erkennbar ab; der maskuline Plural des Partizips wird kollektiv auf die Menschen des „Restes“ bezogen.
- source_word: מִן הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  choice: von dieser bösen Sippe
  rationale: מִשְׁפָּחָה kann Familie, Sippe oder Clan bezeichnen. „Sippe“ macht hier den größeren Verwandtschafts- beziehungsweise Volksverband deutlicher als das im Deutschen oft engere „Familie“.
- source_word: בְּכָל הַמְּקֹמוֹת הַנִּשְׁאָרִים
  choice: an all den übrigen Orten
  rationale: Die zweite Form von נשׁאר stimmt grammatisch mit „Orten“ überein und bedeutet formal „die übrigen/verbliebenen Orte“. Diese ungewöhnliche Aussage wird im Haupttext bewahrt und in der Fußnote erläutert.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: wohin ich sie verstoßen habe
  rationale: Das Hifil von נדח bezeichnet ein gewaltsames Vertreiben oder Zerstreuen. „Verstoßen“ wahrt den Gerichtston; „wohin“ gibt die im Hebräischen durch אֲשֶׁר und שָׁם ausgedrückte Zielbeziehung natürlich wieder.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Ausspruch Jahwes der Heerscharen
  rationale: נְאֻם ist eine prophetische Offenbarungsformel und wird nominal als „Ausspruch“ wiedergegeben. Der Gottesname erscheint als „Jahwe“, צְבָאוֹת als „Heerscharen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des „Restes“
  choice: Rest
  alternative: Überlebende
  rationale: '„Rest“ bewahrt die prophetische Ausdrucksweise und ihre Spannung: Hier ist der verbliebene Rest nicht ohne Weiteres ein Hoffnungszeichen, sondern steht weiterhin unter dem Gericht.'
- issue: Aussage über die Wahl des Todes
  choice: passive Formulierung ohne psychologische Erklärung
  alternative: sie werden lieber sterben wollen
  rationale: Der Text sagt zugespitzt, dass der Tod dem Leben vorgezogen wird. Die Übersetzung ergänzt weder Selbsttötung noch einen ausdrücklich formulierten Todeswunsch und lässt Art und Umstände dieser Bevorzugung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die passivische und wiederholende Struktur wird weitgehend bewahrt, ohne unnatürliche Wortstellung zu erzwingen. „Sippe“, „Ausspruch“ und „Heerscharen“ tragen den prophetisch-feierlichen Ton, bleiben aber verständlich.
