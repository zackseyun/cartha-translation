revisions:
- from: Und der Tod wird dem Leben vorgezogen werden von dem ganzen Rest, der von dieser bösen Sippe übrig geblieben ist, an all den übrigen Orten[a], wohin ich sie verstoßen habe – Ausspruch Jahwes der Heerscharen.
  to: Und der Tod wird dem Leben von allen vorgezogen werden, die von dieser bösen Sippe übrig geblieben sind, an allen verbliebenen Orten, an die ich sie vertrieben habe – Ausspruch Jahwes der Heerscharen.
  rationale: Die Revision glättet die deutsche Syntax, ohne die passive Zuspitzung oder die Mehrdeutigkeit der Aussage zu verändern. Sie präzisiert das göttliche Vertreiben in den Exilkontext, bewahrt die Wiederholung des Übrigbleibens bei Personen und Orten und korrigiert die Fußnotenerklärung. Der Fußnotenanker a bleibt an „verbliebenen Orten“ zu setzen.
  reviewer_model: gpt-5.6-terra
