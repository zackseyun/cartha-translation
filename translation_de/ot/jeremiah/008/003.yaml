review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend: Der Tod wird dem Leben vorgezogen, und die Aussage gilt den aus der bösen Sippe Übriggebliebenen an den Orten ihrer Zerstreuung. „Verstoßen“ ist für הדיח jedoch weniger präzise als „vertreiben“, und die Konstruktion „von dem ganzen Rest“ ist als Agens zum Passiv im Deutschen schwerfällig. Die zweite Wiederaufnahme von נשאר bei den Orten sollte als „verbliebenen“ erhalten bleiben.'
  naturalness: Die vorliegende Satzfügung ist verständlich, aber „von dem ganzen Rest“ klingt unidiomatisch, während „an all den übrigen Orten, wohin“ die Ortsbeziehung unnötig holprig gestaltet. „Verbliebenen Orten, an die ich sie vertrieben habe“ ist modernes, würdiges Standarddeutsch und bildet die Zielrichtung der Zerstreuung klar ab.
  terminology: „Jahwe“, „Ausspruch“ und „Heerscharen“ sind angemessen. „Böse Sippe“ ist im Kontext für משפחה vertretbar. „Übriggebliebene“ gibt sowohl den Restgedanken als auch die partizipiale Wiederholung natürlich wieder.
  issues:
  - severity: medium
    issue: Unnatürliche und syntaktisch belastete Wiedergabe der betroffenen Personengruppe
    rationale: „von dem ganzen Rest, der ... übrig geblieben ist“ verbindet ein Passiv mit einem singularischen Kollektiv als Handelndem. „von allen, die ... übrig geblieben sind“ gibt לכל השארית הנשארים idiomatischer wieder und bewahrt den Bezug auf die Menschen.
  - severity: medium
    issue: „Verstoßen“ ist für הדחתים semantisch nicht optimal
    rationale: Das Hifil von נדח bezeichnet hier das Vertreiben beziehungsweise Zerstreuen in die Verbannung. Deutsches „verstoßen“ kann vor allem soziale oder familiäre Zurückweisung bedeuten; „vertrieben“ trifft den Exilkontext genauer.
  - severity: low
    issue: Die Fußnote erklärt die Ortsformulierung missverständlich
    rationale: Die Formulierung „wohin ich sie dorthin verstoßen habe“ ist im Deutschen keine brauchbare wörtliche Wiedergabe. Die Fußnote sollte die hebräische Wiederholung von „dort“ erläutern, ohne diese unidiomatische Konstruktion als Zitat auszugeben.
  revised_text: Und der Tod wird dem Leben von allen vorgezogen werden, die von dieser bösen Sippe übrig geblieben sind, an allen verbliebenen Orten, an die ich sie vertrieben habe – Ausspruch Jahwes der Heerscharen.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich etwa: „an allen verbliebenen Orten, wohin ich sie dort vertrieben habe“. Das Hebräische wiederholt bei den Orten ein Wort aus der Wurzel „übrig bleiben“ und fügt im Relativsatz „dort“ hinzu. Dies unterstreicht die Zerstreuung der Übriggebliebenen an ihren Verbannungsorten.'
    reason: Die zweite Verwendung der Wurzel נשׁאר sowie das örtliche שׁם werden erläutert, ohne eine im Deutschen unverständliche Scheinwörtlichkeit zu erzeugen.
  revision_rationale: Die Revision glättet die deutsche Syntax, ohne die passive Zuspitzung oder die Mehrdeutigkeit der Aussage zu verändern. Sie präzisiert das göttliche Vertreiben in den Exilkontext, bewahrt die Wiederholung des Übrigbleibens bei Personen und Orten und korrigiert die Fußnotenerklärung. Der Fußnotenanker a bleibt an „verbliebenen Orten“ zu setzen.
