source:
  edition: WLC
  text: לָ/כֵן֩ אֶתֵּ֨ן אֶת נְשֵׁי/הֶ֜ם לַ/אֲחֵרִ֗ים שְׂדֽוֹתֵי/הֶם֙ לְ/י֣וֹרְשִׁ֔ים כִּ֤י מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל כֻּלֹּ֖/ה בֹּצֵ֣עַ בָּ֑צַע מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלֹּ֖/ה עֹ֥שֶׂה שָּֽׁקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
translation:
  language: de
  text: Darum werde ich ihre Frauen anderen geben und ihre Felder denen, die sie in Besitz nehmen werden[a]. Denn vom Kleinsten bis zum Größten sind sie alle auf unrechten Gewinn aus; vom Propheten bis zum Priester handeln sie alle verlogen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Felder denen, die sie erben werden“. Das hebräische Verb kann „erben“, „besitzen“ oder „in Besitz nehmen“ bedeuten; hier geht es wahrscheinlich um neue Besitzer, die sich der Felder bemächtigen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „treiben sie alle Falschheit“ beziehungsweise „handeln sie alle betrügerisch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Schuldvorwurf natürlich und deutlich wieder.
- source_word: אֶתֵּן
  choice: werde ich ... geben
  rationale: Das Qal-Imperfekt der 1. Person Singular bezeichnet hier im Zusammenhang der Gerichtsankündigung eine zukünftige Handlung Gottes.
- source_word: נְשֵׁיהֶם
  choice: ihre Frauen
  rationale: Im Deutschen bezeichnet „ihre Frauen“ in diesem possessiven Zusammenhang natürlich die Ehefrauen, ohne unnötig altertümlich zu klingen.
- source_word: לַאֲחֵרִים
  choice: anderen
  rationale: Bewahrt die unbestimmte Bedeutung „anderen“, ohne Geschlecht oder Fremdheit hinzuzufügen.
- source_word: שְׂדוֹתֵיהֶם
  choice: ihre Felder
  rationale: Die konkrete Bezeichnung des landwirtschaftlichen Besitzes wird unmittelbar wiedergegeben.
- source_word: לְיוֹרְשִׁים
  choice: denen, die sie in Besitz nehmen werden
  rationale: ירשׁ kann erben, besitzen oder in Besitz nehmen bedeuten; im Gerichtskontext steht die Übernahme durch neue Besitzer im Vordergrund.
- source_word: כִּי מִקָּטֹן וְעַד גָּדוֹל
  choice: Denn vom Kleinsten bis zum Größten
  rationale: Die Rang und gesellschaftliche Stellung umfassende Merismusformel wird knapp und idiomatisch wiedergegeben.
- source_word: כֻּלֹּה
  choice: sie alle
  rationale: 'Gibt den distributiven Sinn wieder: Niemand in der bezeichneten Gruppe ist ausgenommen.'
- source_word: בֹּצֵעַ בָּצַע
  choice: sind ... auf unrechten Gewinn aus
  rationale: Die figura etymologica bezeichnet habgieriges Gewinnstreben; „unrecht“ macht den im prophetischen Kontext naheliegenden verwerflichen Charakter deutlich.
- source_word: מִנָּבִיא וְעַד כֹּהֵן
  choice: vom Propheten bis zum Priester
  rationale: Bewahrt die zweite umfassende Formel, die die religiösen Leitungsgruppen nennt.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: handeln ... verlogen
  rationale: Bezeichnet fortgesetztes falsches oder betrügerisches Handeln, nicht nur eine einzelne unwahre Aussage.
theological_decisions:
- issue: Art des angekündigten Verlusts von Frauen und Feldern
  choice: Die erste Person „werde ich ... geben“ bleibt als ausdrückliche göttliche Gerichtsankündigung erhalten.
  alternative: Den Satz lediglich als Beschreibung kriegsbedingter Verluste wiederzugeben.
  rationale: Der hebräische Sprecher stellt den Verlust ausdrücklich als sein eigenes Handeln dar; weitere Einzelheiten über die Durchführung werden nicht ergänzt.
- issue: Moralischer Gehalt von בֹּצֵעַ בָּצַע
  choice: „auf unrechten Gewinn aus“
  alternative: „auf Gewinn aus“
  rationale: Der prophetische Anklagekontext und die Wortverbindung tragen eine klar negative Bedeutung, während die Formulierung offenlässt, welche konkrete Art von Unrecht gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Spannweiten „vom Kleinsten bis zum Größten“ und „vom Propheten bis zum Priester“ sowie die kollektive Anklage „sie alle“ bleiben erhalten. Die Fußnotenmarker stehen jeweils direkt bei der betreffenden Aussage.
