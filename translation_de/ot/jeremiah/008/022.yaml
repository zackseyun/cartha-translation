  to: Gibt es denn keinen Balsam in Gilead,[a] keinen Arzt dort? Warum ist dann die Heilung der Tochter meines Volkes[b] nicht eingetreten?
  rationale: Die Änderung zu „nicht eingetreten“ vermeidet die nicht erforderliche Annahme eines bereits fortschreitenden Heilungsprozesses und gibt die rhetorische Klage über die ausgebliebene Heilung idiomatisch wieder. Die überarbeitete erste Fußnote bietet gebräuchlichere und dem hebräischen Begriff entsprechende Alternativen. Satzbau, medizinische Metaphorik und die personifizierende Wendung bleiben erhalten.
