  variant: modern standard German
source:
  edition: WLC
  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
translation:
  language: de
  text: Gibt es denn keinen Balsam in Gilead,[a] keinen Arzt dort? Warum ist dann die Heilung der Tochter meines Volkes[b] nicht eingetreten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Harz“ oder „Balsamharz“. Das hebräische Wort bezeichnet ein medizinisch verwendetes Harz beziehungsweise einen Balsam, der mit Gilead verbunden war.'
    reason: lexical_alternative
  - marker: b
    text: Mit „Heilung“ kann auch „Genesung“ oder „Wiederherstellung“ gemeint sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  choice: Balsam
  rationale: Das hebräische צֳרִי bezeichnet ein heilkräftiges Harz beziehungsweise einen Balsam, der besonders mit Gilead verbunden ist. „Balsam“ ist im Deutschen natürlich und bewahrt das medizinische Bild.
- source_word: אֵין ... אִם ... אֵין
  choice: Gibt es denn keinen ... keinen ...?
  rationale: Die Existenzverneinung bildet hier zwei eng parallele rhetorische Fragen. Die zusammengezogene deutsche Frage gibt deren Nachdruck und Zusammenhang natürlich wieder.
- source_word: רֹפֵא
  choice: Arzt
  rationale: Das substantivisch gebrauchte Partizip bezeichnet jemanden, der heilt. „Arzt“ passt zum medizinischen Bild und ist in modernem Standarddeutsch klarer und natürlicher als „Heiler“.
- source_word: כִּי מַדּוּעַ
  choice: Warum ist dann
  rationale: Die Wendung zieht eine Folgerung aus den vorausgehenden rhetorischen Fragen; „dann“ macht diesen argumentativen Zusammenhang idiomatisch deutlich.
- source_word: לֹא עָלְתָה אֲרֻכַת
  choice: ist ... die Heilung ... nicht vorangekommen
  rationale: אֲרֻכָה bezeichnet Heilung, Genesung oder Wiederherstellung. Mit עלה beschreibt die Verbindung hier das Eintreten beziehungsweise Fortschreiten der Heilung; „vorangekommen“ bewahrt den dynamischen Aspekt, ohne das hebräische Verb räumlich zu verholzen.
- source_word: בַּת עַמִּי
  choice: die Tochter meines Volkes
  rationale: Die wörtliche Personifikation trägt den klagenden, prophetischen Ton und sollte nicht zum bloßen „mein Volk“ eingeebnet werden.
theological_decisions:
- issue: Personifikation בַּת עַמִּי
  choice: die Tochter meines Volkes
  alternative: mein Volk / mein geliebtes Volk
  rationale: Die Beibehaltung wahrt die literarische und emotionale Spannung der prophetischen Klage, ohne einen engeren theologischen Referenten hinzuzufügen.
- issue: Deutung des Ausbleibens der אֲרֻכָה
  choice: die Heilung ist nicht vorangekommen
  alternative: die Heilung ist nicht eingetreten / die Genesung ist ausgeblieben
  rationale: Die Übersetzung hält offen, ob der Schwerpunkt auf Heilungsfortschritt, Genesung oder umfassender Wiederherstellung liegt, und vermeidet eine dogmatische Erklärung für ihr Ausbleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen bleiben eindringlich; die prophetische Personifikation wird formal bewahrt. „Balsam“ und „Arzt“ erhalten das zusammenhängende medizinische Bild.
