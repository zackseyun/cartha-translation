  naturalness: „Balsam“, „Arzt“ und „die Tochter meines Volkes“ sind in einem würdigen modernen Standarddeutsch natürlich. „… nicht eingetreten“ ist in diesem Zusammenhang idiomatischer als „… nicht vorangekommen“.
  terminology: „Balsam“ gibt צֳרִי angemessen wieder; „Harz“ ist eine sachliche lexikalische Alternative. „Arzt“ trifft רֹפֵא ohne die weitergehenden Konnotationen von „Heiler“. Die Personifikation „Tochter meines Volkes“ ist beizubehalten.
