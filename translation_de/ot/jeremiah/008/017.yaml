source:
  edition: WLC
  text: כִּי֩ הִנְ/נִ֨י מְשַׁלֵּ֜חַ בָּ/כֶ֗ם נְחָשִׁים֙ צִפְעֹנִ֔ים אֲשֶׁ֥ר אֵין לָ/הֶ֖ם לָ֑חַשׁ וְ/נִשְּׁכ֥וּ אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
translation:
  language: de
  text: 'Denn seht: Ich lasse Schlangen auf euch los, Vipern[a], die sich nicht beschwören lassen[b]. Sie werden euch beißen – Ausspruch Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet eine gefährliche Giftschlange; auch „Ottern“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „für die es keine Beschwörung gibt“. Gemeint ist eine geflüsterte Zauberformel, mit der Schlangen gebändigt werden sollten.'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Aussage und behält so ihre verbindende Funktion.
- source_word: הִנְנִי
  choice: 'seht: Ich'
  rationale: Die deiktisch-emphatische Wendung kündigt Gottes unmittelbar bevorstehendes und gewisses Handeln an. „Seht“ gibt den Nachdruck in heutigem Deutsch wieder.
- source_word: מְשַׁלֵּחַ
  choice: lasse … los
  rationale: Das Partizip mit הִנְנִי bezeichnet ein unmittelbar bevorstehendes beziehungsweise gewisses Handeln. Bei Schlangen ist „loslassen“ natürlich und bewahrt das Bild gezielt ausgesandter Tiere.
- source_word: בָּכֶם
  choice: auf euch
  rationale: Die Präposition ב kann hier räumlich („unter/in eure Mitte“) oder feindlich-zielgerichtet verstanden werden. „Auf euch loslassen“ verbindet beides idiomatisch und macht den Gerichtssinn deutlich, ohne das Bild aufzugeben.
- source_word: נְחָשִׁים
  choice: Schlangen
  rationale: Dies ist die klare, moderne Standardbezeichnung.
- source_word: צִפְעֹנִים
  choice: Vipern
  rationale: Das Wort bezeichnet eine gefährliche Giftschlange; „Vipern“ ist prägnant und wahrt die Steigerung gegenüber dem allgemeinen „Schlangen“.
- source_word: אֲשֶׁר אֵין לָהֶם לָחַשׁ
  choice: die sich nicht beschwören lassen
  rationale: לַחַשׁ bezeichnet hier eine geflüsterte Beschwörung oder Zauberformel, wie sie beim Schlangenbeschwören eingesetzt wird. Die Formulierung gibt den Sinn natürlich wieder, ohne die kulturelle Vorstellung zu verdecken.
- source_word: וְנִשְּׁכוּ אֶתְכֶם
  choice: Sie werden euch beißen
  rationale: Das Verb bezeichnet konkret das Beißen und die Verbform kündigt die Folge als gewiss an.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird würdevoll und knapp wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Unabwendbarkeit des angekündigten Gerichts
  choice: die sich nicht beschwören lassen
  alternative: für die es keine Beschwörung gibt
  rationale: Die Übersetzung bewahrt das Bild eines Gerichts, das durch menschliche Beschwörungsmittel nicht abgewehrt werden kann, ohne darüber hinaus eine systematische theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn seht“ wahrt den prophetischen Nachdruck; „auf euch loslassen“ ist anschaulich und idiomatisch. Der Gedankenstrich vor der Schlussformel hebt deren prophetisches Gewicht hervor.
