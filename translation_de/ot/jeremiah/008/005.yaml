source:
  edition: WLC
  text: מַדּ֨וּעַ שׁוֹבְבָ֜ה הָ/עָ֥ם הַ/זֶּ֛ה יְרוּשָׁלִַ֖ם מְשֻׁבָ֣ה נִצַּ֑חַת הֶחֱזִ֨יקוּ֙ בַּ/תַּרְמִ֔ית מֵאֲנ֖וּ לָ/שֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
translation:
  language: de
  text: Warum verharrt dieses Volk – Jerusalem[a] – in anhaltender Abkehr[b]? Sie halten am Trug[c] fest; sie weigern sich zurückzukehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Jerusalem“ kann auch als Anrede verstanden werden: „Warum kehrt sich dieses Volk ab, o Jerusalem?“'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich auch: „mit dauernder Abkehr“ oder „in beständigem Abfall“. Im Hebräischen werden hier mehrfach Wörter derselben Wortfamilie für Abkehr und Rückkehr verwendet.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „an der Täuschung“ beziehungsweise „an der Falschheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Frageadverb leitet eine anklagende rhetorische Frage ein; „Warum“ ist die natürliche deutsche Entsprechung.
- source_word: שׁוֹבְבָה
  choice: kehrt sich … ab
  rationale: Die Form beschreibt die Abwendung des Volkes. Die Wiedergabe mit „abkehren“ hält zugleich die Wortverbindung zu מְשׁוּבָה und לָשׁוּב hörbar.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: „Volk“ entspricht dem gewöhnlichen Sinn von עַם und bewahrt den prophetischen Ton.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Der Ortsname wird als Apposition zu „dieses Volk“ verstanden; Gedankenstriche verdeutlichen diese Zuordnung, ohne zusätzliche Wörter einzuführen.
- source_word: מְשֻׁבָה
  choice: Abkehr
  rationale: Das Substantiv bezeichnet Abwendung oder Abfall. „Abkehr“ ist verständlich und bewahrt das Wortspiel mit „abkehren“ und „zurückkehren“.
- source_word: נִצַּחַת
  choice: immerwährend
  rationale: Das Adjektiv hebt die fortdauernde, verhärtete Abkehr hervor. „Immerwährend“ gibt diese Dauer kräftig und würdig wieder.
- source_word: הֶחֱזִיקוּ
  choice: Sie halten … fest
  rationale: Die Hifil-Form von חזק bezeichnet hier beharrliches Festhalten oder Sichklammern.
- source_word: בַּתַּרְמִית
  choice: am Trug
  rationale: תַּרְמִית bezeichnet Täuschung, Trug oder Falschheit. „Trug“ ist knapp, in dieser Verbindung idiomatisch und trägt den moralischen Ernst der Anklage.
- source_word: מֵאֲנוּ
  choice: sie weigern sich
  rationale: Das Verb bezeichnet eine bewusste Weigerung und nicht bloß fehlende Bereitschaft.
- source_word: לָשׁוּב
  choice: zurückzukehren
  rationale: Die Grundbedeutung ist „zurückkehren/umkehren“. „Zurückzukehren“ bewahrt den Bezug zur wiederholten Wurzel שוב und lässt die mitgemeinte Umkehr theologisch unausgedeutet.
theological_decisions:
- issue: Wortspiel mit שוב und מְשׁוּבָה
  choice: „kehrt sich … ab“ / „Abkehr“ / „zurückzukehren“
  alternative: „ist abgefallen“ / „Abfall“ / „umzukehren“
  rationale: Der hebräische Satz stellt die hartnäckige Abwendung der verweigerten Rückkehr gegenüber. Die gewählten deutschen Wörter machen dieses Geflecht mit der wiederkehrenden Silbe „kehr“ wahrnehmbar, ohne den letzten Ausdruck ausdrücklich als „Buße tun“ auszulegen.
- issue: Syntaktische Funktion von „Jerusalem“
  choice: Apposition zu „dieses Volk“, durch Gedankenstriche markiert
  alternative: 'Vokativ: „Warum kehrt sich dieses Volk ab, Jerusalem …?“'
  rationale: Die appositionelle Lesart identifiziert das Volk am ehesten mit Jerusalem. Da der knappe hebräische Satz auch eine Anrede zulässt, wird diese Möglichkeit in einer Fußnote bewahrt.
- issue: Reichweite von נִצַּחַת
  choice: „immerwährend“ als Aussage über hartnäckige Dauer
  alternative: „andauernd“ oder „beständig“
  rationale: Die Form bezeichnet Fortdauer; die Übersetzung gibt die Schärfe der prophetischen Anklage wieder, ohne daraus eine metaphysische Aussage über ausnahmslose Ewigkeit zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Verbindung „in immerwährender Abkehr abkehren“ ist bewusst beibehalten, damit die eindringliche Wiederholung des hebräischen Wortfeldes hörbar bleibt. „Trug“ ist leicht gehoben, jedoch allgemein verständlich und passt zum prophetischen Register.
