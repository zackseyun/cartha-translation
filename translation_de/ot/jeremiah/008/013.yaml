source:
  edition: WLC
  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
translation:
  language: de
  text: »Gewiss werde ich sie einsammeln[a]«, spricht Jahwe. »Keine Trauben sind am Weinstock und keine Feigen am Feigenbaum; selbst das Blatt ist verwelkt. Was ich ihnen gegeben habe, wird ihnen verlorengehen.[b]«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich werde sie völlig wegraffen« beziehungsweise »vollständig vernichten«. Im Hebräischen verstärkt eine Verbform mit Infinitiv die Aussage; im Zusammenhang des Gerichts kann das Verb »sammeln« auch Wegnahme oder Vernichtung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist schwer verständlich. Möglich ist auch: »Was ich ihnen gegeben habe, wird ihnen genommen werden« oder eine ähnliche Wiedergabe.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  choice: Ich werde sie restlos einsammeln
  rationale: Der Infinitivus absolutus mit der finiten Verbform verstärkt die Aussage. „Einsammeln“ bewahrt die Grundbedeutung von אסף und passt zum anschließenden Erntebild; „restlos“ gibt die Intensivierung wieder. Der mögliche Gerichtssinn von Beseitigung oder Vernichtung wird in einer Fußnote offengehalten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige prophetische Botenformel wird in würdigem, natürlichem Deutsch wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: אֵין עֲנָבִים בַּגֶּפֶן
  choice: Keine Trauben sind am Weinstock
  rationale: Die Existenzverneinung und das konkrete landwirtschaftliche Bild werden unmittelbar bewahrt.
- source_word: וְאֵין תְּאֵנִים בַּתְּאֵנָה
  choice: und keine Feigen am Feigenbaum
  rationale: Die parallele Satzstruktur bleibt erhalten; die im Deutschen natürliche Unterscheidung zwischen Frucht und Baum gibt die Wiederholung des hebräischen Wortstamms wieder.
- source_word: וְהֶעָלֶה נָבֵל
  choice: selbst das Blatt ist verwelkt
  rationale: Der kollektive Singular „das Blatt“ bleibt erhalten. „Selbst“ macht die steigernde Wirkung im Zusammenhang natürlich verständlich.
- source_word: וָאֶתֵּן לָהֶם
  choice: was ich ihnen gegeben habe
  rationale: Die breite Bedeutung von נתן wird ohne unbelegtes konkretes Objekt wiedergegeben; weder Land noch Gesetz oder Segnungen werden ausdrücklich eingesetzt.
- source_word: יַעַבְרוּם
  choice: wird ihnen entschwinden
  rationale: Die schwierige Form wird als Verlust dessen verstanden, was Gott ihnen gegeben hat. „Entschwinden“ bewahrt den Bewegungsgedanken von עבר, ohne die dunkle Syntax mit einer zu bestimmten Deutung zu glätten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Gerichtsbedeutung der verstärkten Form אסף
  choice: restlos einsammeln
  alternative: völlig wegraffen / vollständig vernichten
  rationale: Die Hauptfassung hält am lexikalischen Bild des Sammelns fest und lässt zugleich durch Kontext und Fußnote die mögliche feindliche Bedeutung erkennen, ohne sie zur einzig möglichen Lesart zu machen.
- issue: Deutung des schwierigen Schlusssatzes
  choice: was ich ihnen gegeben habe, wird ihnen entschwinden
  alternative: was ich ihnen gegeben habe, wird ihnen genommen werden
  rationale: Die Fassung vermittelt den im Zusammenhang wahrscheinlichen Verlust, bewahrt aber mit „entschwinden“ den Bewegungssinn des Verbs und vermeidet eine unnötig eindeutige Passivkonstruktion.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die Erntebilder und die Parallelität bleiben erhalten; echte lexikalische und syntaktische Unsicherheiten werden nicht stillschweigend aufgelöst, sondern in den Fußnoten kenntlich gemacht.
