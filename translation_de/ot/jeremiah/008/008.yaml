  text: אֵיכָ֤ה תֹֽאמְרוּ֙ חֲכָמִ֣ים אֲנַ֔חְנוּ וְ/תוֹרַ֥ת יְהוָ֖ה אִתָּ֑/נוּ אָכֵן֙ הִנֵּ֣ה לַ/שֶּׁ֣קֶר עָשָׂ֔ה עֵ֖ט שֶׁ֥קֶר סֹפְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
translation:
  language: de
  text: 'Wie könnt ihr sagen: »Wir sind weise, und das Gesetz Jahwes ist bei uns«? Doch seht: Der Lügengriffel der Schreiber hat Lüge hervorgebracht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch seht, der Griffel der Schreiber hat Lüge hervorgebracht“ oder: „Doch seht, der falsche Griffel der Schreiber hat Trug bewirkt.“ Das Hebräische ist knapp formuliert: Es nennt kein ausdrückliches Objekt zu „hat ... gemacht“ und lässt verschiedene Zuordnungen der Wörter für „Lüge/Trug“ zu. Ein Bezug auf das zuvor genannte Gesetz ist möglich, wird aber nicht ausdrücklich gesagt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Wie könnt ihr
  rationale: Gibt die entrüstete, ungläubige Kraft der rhetorischen Frage in natürlichem Deutsch wieder.
- source_word: חֲכָמִים אֲנַחְנוּ
  choice: Wir sind weise
  rationale: Bewahrt die schlichte Selbsteinschätzung der Angesprochenen, ohne sie durch das speziellere „Weise“ im Sinn einer Amts- oder Gelehrtenbezeichnung zu überdeuten.
- source_word: תּוֹרַת יְהוָה
  choice: das Gesetz Jahwes
  rationale: „Gesetz“ wahrt hier den bundestheologischen und textlichen Bezug von תּוֹרָה; „Weisung“ wäre ebenfalls lexikalisch möglich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אִתָּנוּ
  choice: ist bei uns
  rationale: Entspricht der Aussage, dass Jahwes Tora bei ihnen vorhanden sei oder ihnen zur Verfügung stehe, ohne den Anspruch weiter auszudeuten.
- source_word: אָכֵן הִנֵּה
  choice: Doch seht
  rationale: Markiert sowohl den nachdrücklichen Widerspruch als auch den Aufmerksamkeitsruf in heutigem, würdigem Deutsch.
- source_word: לַשֶּׁקֶר
  choice: zur Lüge
  rationale: Gibt die mögliche resultative Bedeutung wieder und bewahrt die Wiederholung des Wortfeldes „Lüge“.
- source_word: עָשָׂה
  choice: hat … gemacht
  rationale: Die Grundbedeutung „tun/machen“ passt zur resultativen Aussage des Satzes.
- source_word: עֵט
  choice: Griffel
  rationale: Bezeichnet ein Schreibgerät und klingt im antiken Schreibkontext präziser als „Feder“, bleibt aber allgemein verständlich.
- source_word: שֶׁקֶר סֹפְרִים
  choice: der Lügengriffel der Schreiber
  rationale: Versteht die knappe Wortfolge als Charakterisierung des Schreibgeräts beziehungsweise der Schreibtätigkeit der Schreiber durch Falschheit; andere syntaktische Nuancen werden in der Fußnote offengehalten.
theological_decisions:
- issue: Wiedergabe von תּוֹרַת יְהוָה in der prophetischen Polemik
  choice: das Gesetz Jahwes
  alternative: die Weisung Jahwes
  rationale: „Gesetz“ erhält den Bezug auf die überlieferte, bundesbezogene Tora, deren Besitz die Angesprochenen beanspruchen. „Weisung“ ist möglich, würde den Bedeutungsumfang stärker betonen.
- issue: Bezug des ergänzten Pronomens in „hat es zur Lüge gemacht“
  choice: „es“ bezieht sich auf das Gesetz Jahwes
  alternative: 'Unpersönliche Wiedergabe: „hat Lüge hervorgebracht“'
  rationale: Das Hebräische nennt kein ausdrückliches Objekt. Die deutsche Fassung macht den im Kontext naheliegenden Bezug auf die Tora lesbar, während die Fußnote die kompakte und mehrdeutige Syntax kenntlich macht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Doch seht“ ist nachdrücklich, ohne altertümlich zu wirken; „Schreiber“ vermeidet die mögliche Überdeutung durch „Schriftgelehrte“.
