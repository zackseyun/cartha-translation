  source_fidelity: Die rhetorische Frage, der Anspruch auf Weisheit und auf das Gesetz Jahwes sowie die emphatische Gegenrede sind zutreffend wiedergegeben. In der zweiten Satzhälfte nennt der hebräische Text jedoch kein ausdrückliches Objekt zu עָשָׂה. „hat es zur Lüge gemacht“ legt daher den Bezug auf das Gesetz als Textaussage fest, obwohl er nur eine mögliche kontextuelle Ergänzung ist. Die Übersetzung sollte diese syntaktische Offenheit nicht im Haupttext auflösen.
  naturalness: „Wie könnt ihr sagen“, „das Gesetz Jahwes ist bei uns“ und „Doch seht“ sind modernes, verständliches Standarddeutsch. „Lügengriffel“ ist bildhaft und leicht literarisch, aber in einem prophetischen Kontext verständlich und angemessen. Eine objektlose Wiedergabe der knappen hebräischen Aussage klingt mit „hat Lüge hervorgebracht“ im Deutschen natürlich.
  terminology: „Jahwe“ ist konsequent als Gottesname wiedergegeben. „Gesetz Jahwes“ ist für תּוֹרַת יְהוָה vertretbar. „Schreiber“ ist neutraler und quellennäher als „Schriftgelehrte“.
