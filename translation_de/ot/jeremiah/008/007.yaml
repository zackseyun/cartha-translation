id: JER.8.7
reference: Jeremiah 8:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: גַּם חֲסִידָ֣ה בַ/שָּׁמַ֗יִם יָֽדְעָה֙ מֽוֹעֲדֶ֔י/הָ וְ/תֹ֤ר ו/סוס וְ/עָג֔וּר שָׁמְר֖וּ אֶת עֵ֣ת בֹּאָ֑/נָה וְ/עַמִּ֕/י לֹ֣א יָֽדְע֔וּ אֵ֖ת מִשְׁפַּ֥ט יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: de
  text: Selbst der Storch am Himmel kennt seine bestimmten Zeiten; Turteltaube, Mauersegler und Kranich[a] halten die Zeit ihrer Ankunft ein. Aber mein Volk kennt das Recht des HERRN[b] nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung der beiden letzten hebräischen Vogelnamen ist unsicher; auch „Schwalbe“ und andere Zuordnungen werden vorgeschlagen.
    reason: Alte Vogelnamen lassen sich zoologisch nicht in jedem Fall eindeutig bestimmen.
  - marker: b
    text: 'Oder: die Rechtsordnung beziehungsweise das Gericht des HERRN.'
    reason: מִשְׁפַּט hat eine Bedeutungsbreite von Recht und Rechtsentscheidung bis Gericht.
lexical_decisions:
- source_word: חֲסִידָה
  choice: Storch
  rationale: Die übliche und lexikalisch gut gestützte Bezeichnung des Vogels.
- source_word: מוֹעֲדֶיהָ
  choice: seine bestimmten Zeiten
  rationale: מוֹעֵד bezeichnet festgesetzte oder bestimmte Zeiten; das Possessivpronomen richtet sich im Deutschen nach dem grammatisch männlichen „Storch“.
- source_word: תֹר
  choice: Turteltaube
  rationale: Die gängige Bedeutung des hebräischen Vogelnamens.
- source_word: סוּס
  choice: Mauersegler
  rationale: Im Kontext ist ein Zugvogel gemeint; „Mauersegler“ gibt die in der konsultierten Fassung gewählte Bestimmung „swift“ präzise und idiomatisch wieder, bleibt aber zoologisch nicht völlig sicher.
- source_word: עָגוּר
  choice: Kranich
  rationale: Traditionelle und kontextuell passende Identifikation, obwohl die genaue Zuordnung alter Vogelnamen unsicher ist.
- source_word: שָׁמְרוּ אֶת־עֵת בֹּאָנָה
  choice: halten die Zeit ihrer Ankunft ein
  rationale: Bewahrt den Gedanken, dass die Vögel den Zeitpunkt ihrer jahreszeitlichen Rückkehr zuverlässig beachten.
- source_word: מִשְׁפַּט
  choice: Recht
  rationale: Das Wort kann Recht, Rechtsordnung, Entscheidung oder Gericht bedeuten. „Recht“ bewahrt hier die Spannung zwischen Gottes verbindlicher Ordnung und seinem richtenden Urteil.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchenform, hier technisch als Großschreibung dargestellt.
theological_decisions:
- issue: Bedeutung von מִשְׁפַּט יְהוָה
  choice: das Recht des HERRN
  alternative: das Gericht / die Rechtsordnung des HERRN
  rationale: Der Zusammenhang tadelt Israels fehlende Erkenntnis von Gottes verbindlichem Recht; zugleich darf der mögliche Gerichtsaspekt nicht ausgeschlossen werden. Die Fußnote macht die Bedeutungsbreite sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vergleich mit dem verlässlichen Zugverhalten der Vögel bleibt knapp und anschaulich; „Selbst“ gibt das einleitende גַּם natürlich wieder.
