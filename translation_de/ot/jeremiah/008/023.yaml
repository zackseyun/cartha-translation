  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
translation:
  language: de
  text: Ach[a], wäre doch mein Kopf Wasser und mein Auge eine Quelle der Tränen, dass ich Tag und Nacht um die Erschlagenen der Tochter meines Volkes weinen könnte!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt das Hebräische mit der Wunschformel „Wer gäbe …?“; auch möglich: „Wenn doch …“. Das Hebräische hat „mein Auge“ in der Einzahl.'
    reason: Die Fußnote erläutert die idiomatische Wiedergabe der hebräischen Wunschformel und dokumentiert die im Haupttext beibehaltene Singularform.
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ach, wäre doch
  rationale: Die hebräische Wunschformel bedeutet hier keine sachliche Frage, sondern drückt einen schmerzlichen, unerfüllbaren Wunsch aus. Die deutsche Formulierung bewahrt Klage, Wunschcharakter und poetische Kraft.
- source_word: רֹאשִׁי
  choice: mein Kopf
  rationale: Die konkrete körperliche Bildsprache wird ohne Vergeistigung oder Abschwächung wiedergegeben; „Kopf“ ist im modernen Standarddeutsch natürlicher als „Haupt“.
- source_word: מַיִם
  choice: Wasser
  rationale: Die direkte Bedeutung erhält das auffällige poetische Bild, der Kopf selbst möge zu Wasser werden.
- source_word: וְעֵינִי
  choice: und wären meine Augen
  rationale: Das Hebräische hat formal den Singular „mein Auge“. Im Deutschen bezeichnet der idiomatische Plural das Tränenorgan natürlicher; die Singularform wird in der Fußnote offengelegt.
- source_word: מְקוֹר דִּמְעָה
  choice: eine Tränenquelle
  rationale: מְקוֹר bezeichnet Quelle oder Quellort. Das deutsche Kompositum ist verständlich, knapp und bewahrt das poetische Bild einer unerschöpflichen Quelle von Tränen.
- source_word: וְאֶבְכֶּה
  choice: damit ich … weinen könnte
  rationale: Die Fortsetzung der Wunschformel bringt den ersehnten Zweck beziehungsweise die Folge zum Ausdruck. Der deutsche Konjunktiv hält den irrealen Wunsch offen.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die geläufige deutsche Wendung bewahrt den Merismus für unablässiges Trauern.
- source_word: חַלְלֵי
  choice: die Erschlagenen
  rationale: Im Zusammenhang sind gewaltsam Getötete beziehungsweise Kriegsopfer gemeint. „Erschlagene“ ist präzise und dem Klagecharakter angemessen.
- source_word: בַת עַמִּי
  choice: der Tochter meines Volkes
  rationale: Die prophetische Personifikation wird bewusst erhalten und nicht vereinfachend durch „mein Volk“ ersetzt.
theological_decisions:
- issue: Soll die Personifikation בַת עַמִּי aufgelöst werden?
  choice: „der Tochter meines Volkes“ bewahrt die Personifikation
  alternative: „meines Volkes“ oder „meines geliebten Volkes“
  rationale: Die Wendung personifiziert die Gemeinschaft poetisch. Ihre Beibehaltung erhält die literarische und emotionale Spannung, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dichterischer Bildkraft. „Kopf“ vermeidet das heute altertümliche „Haupt“; „Tränenquelle“ hält dennoch den poetischen Ton. Der lange Wunschsatz folgt der Bewegung des hebräischen Klagelauts.
