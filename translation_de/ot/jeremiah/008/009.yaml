source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
translation:
  language: de
  text: Die Weisen werden beschämt; sie sind bestürzt und werden gefangen genommen[a]. Siehe, sie haben das Wort Jahwes verworfen – welche Weisheit haben sie denn?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ergriffen oder gefangen; das hebräische Verb kann auch das Gefangenwerden in einer Falle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: werden beschämt
  rationale: Die Hifil-Form von בוש bezeichnet hier die Bloßstellung und öffentliche Schande der Weisen. Die deutsche Passivform gibt diese Wirkung wieder, ohne sie auf ein bloß inneres Schamgefühl zu reduzieren.
- source_word: חֲכָמִים
  choice: die Weisen
  rationale: Das maskuline Pluralnomen bezeichnet die anerkannte Gruppe der Weisen beziehungsweise Gelehrten in Juda. „Die Weisen“ ist im Deutschen die natürliche und traditionsnahe Klassenbezeichnung.
- source_word: חַתּוּ
  choice: sie sind bestürzt
  rationale: חתת beschreibt hier, dass Mut und Fassung zusammenbrechen. „Bestürzt“ ist verständlich und wahrt sowohl Erschrecken als auch Ratlosigkeit.
- source_word: וַיִּלָּכֵדוּ
  choice: und gefangen
  rationale: לכד kann das Ergreifen, Fangen oder Einfangen in einer Falle bezeichnen. „Gefangen“ bewahrt das Bild, dass das Gericht sie ereilt hat; die Fallen-Nuance wird in der Fußnote genannt.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der Aufmerksamkeitsmarker hebt die folgende Begründung hervor. „Siehe“ ist knapp, würdevoll und im prophetischen Sprachgebrauch gut verständlich.
- source_word: בִדְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: דבר bezeichnet im prophetischen Zusammenhang Jahwes offenbarte Rede beziehungsweise Weisung. „Wort“ wahrt die konkrete theologische Ausdrucksweise des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird entsprechend der deutschen Standardform direkt als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מָאָסוּ
  choice: haben … verworfen
  rationale: מאס bezeichnet bewusste Zurückweisung oder Verwerfung. „Verworfen“ bringt die schuldhafte Ablehnung von Jahwes Wort deutlich zum Ausdruck.
- source_word: וְחָכְמַת מֶה לָהֶם
  choice: was für eine Weisheit besitzen sie da noch?
  rationale: Die rhetorische Frage bestreitet ihren Anspruch auf wahre Weisheit, nachdem sie Jahwes Wort verworfen haben. „Da noch“ macht den folgernden Zusammenhang natürlich verständlich, ohne die Spannung der Frage in eine Aussage aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ erhält den offenbarten Eigennamen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Verhältnis zwischen Jahwes Wort und menschlicher Weisheit
  choice: rhetorische Frage bleibt erhalten
  alternative: Sie besitzen keine Weisheit
  rationale: Der Text formuliert keine abstrakte Lehrthese, sondern eine anklagende rhetorische Frage. Diese Form wahrt die prophetische Schärfe und lässt die Folgerung aus der Verwerfung des Wortes hervortreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. Die Perfekt- und Zustandsformen werden idiomatisch verbunden; „Siehe“ erhält den markierenden Charakter von הִנֵּה. Der Gedankenstrich verdeutlicht die scharfe Folgerung, ohne den rhetorischen Zusammenhang umzudeuten.
