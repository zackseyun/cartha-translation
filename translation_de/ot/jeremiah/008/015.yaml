source:
  edition: WLC
  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
translation:
  language: de
  text: 'Wir hofften[a] auf Frieden[b], doch es kam nichts Gutes; auf eine Zeit der Heilung – doch siehe: Schrecken[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wir warteten auf Frieden“ beziehungsweise „Wir erwarteten Frieden“. Das Verb kann Hoffen, Warten oder Erwarten ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann außer Frieden auch Wohlergehen oder Ganzsein bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Bestürzung“ beziehungsweise „Angst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה
  choice: Wir hofften
  rationale: Die Form ist morphologisch mehrdeutig und kann die Nuance von Hoffen, Warten oder Erwarten tragen. Im Zusammenhang der gemeinschaftlichen Klage wird sie als erste Person Plural wiedergegeben; die Fußnote hält die lexikalische Spannweite offen.
- source_word: לְשָׁלוֹם
  choice: auf Frieden
  rationale: שָׁלוֹם bezeichnet Frieden, Wohlergehen oder Ganzsein. „Frieden“ ist hier natürlich und lässt den Gegensatz zum folgenden Schrecken hervortreten, ohne die weiteren Bedeutungsnuancen auszuschließen.
- source_word: וְאֵין טוֹב
  choice: doch es kam nichts Gutes
  rationale: Wörtlich steht „und da ist nichts Gutes“. Das adversative „doch“ bildet den Gegensatz zur Hoffnung idiomatisch ab; „es kam nichts Gutes“ fügt sich in die rückblickende Klage.
- source_word: לְעֵת מַרְפֵּה
  choice: auf eine Zeit der Heilung
  rationale: מַרְפֵּה kann Heilung, Genesung oder Wiederherstellung bezeichnen. Die Formulierung bewahrt sowohl die Zeitangabe als auch die weit gefasste Heilungsmetaphorik.
- source_word: וְהִנֵּה
  choice: doch siehe
  rationale: הִנֵּה führt die unerwartete Wirklichkeit nachdrücklich vor Augen. „Siehe“ bewahrt diese rhetorische Funktion; „doch“ macht den im Parallelismus angelegten Gegensatz deutlich.
- source_word: בְעָתָה
  choice: Schrecken
  rationale: Das Substantiv bezeichnet Schrecken, Bestürzung oder heftige Angst. „Schrecken“ ist knapp, gewichtig und bildet einen scharfen Gegensatz zur erhofften Heilung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische zweite Vershälfte bleibt erhalten; Gedankenstrich und Doppelpunkt geben den abrupten Umschlag von erhoffter Heilung zu Schrecken wieder.
