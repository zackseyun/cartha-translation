id: JER.8.4
reference: Jeremiah 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/יִפְּל֖וּ וְ/לֹ֣א יָק֑וּמוּ אִם יָשׁ֖וּב וְ/לֹ֥א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/004.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
translation:
  language: de
  text: 'Sag zu ihnen: »So spricht Jahwe: Fällt man hin und steht nicht wieder auf? Wendet sich jemand ab und kehrt nicht zurück?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kehrt jemand um und kehrt nicht zurück?« Im Hebräischen steht an beiden Stellen dasselbe Verb, das je nach Zusammenhang »sich abwenden«, »umkehren« oder »zurückkehren« bedeuten kann.'
    reason: Die Wiederholung von שוב erzeugt ein Wortspiel und lässt bei der ersten Verbform mehr als eine sinnvolle Deutung zu.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Sag zu ihnen
  rationale: Die Form bezeichnet hier den an Jeremia gerichteten prophetischen Auftrag. Der vorangestellte Anschluss וְ wird im Deutschen nicht eigens wiedergegeben, da der Satz so natürlich und klar einsetzt.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Botenformel bewahrt den feierlichen prophetischen Charakter; das Tetragramm wird als Gottesname »Jahwe« wiedergegeben.
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  choice: Fällt man hin und steht nicht wieder auf?
  rationale: Die rhetorische Frage wird mit dem unpersönlichen »man« natürlich ausgedrückt. »Wieder aufstehen« gibt קום nach einem Sturz idiomatisch wieder.
- source_word: אִם יָשׁוּב וְלֹא יָשׁוּב
  choice: Wendet sich jemand ab und kehrt nicht zurück?
  rationale: אִם führt hier eine zweite rhetorische Frage ein. Die beiden Formen von שוב können kontextuell als Abwendung und anschließende Rückkehr verstanden werden; die unterschiedliche deutsche Wiedergabe macht diesen Gegensatz verständlich, während eine Fußnote die formale Wiederholung und alternative Deutung offenhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung der zweimaligen Form von שוב
  choice: Abwendung und ausbleibende Rückkehr
  alternative: Umkehr und ausbleibende Rückkehr
  rationale: Im Zusammenhang von Jeremias Anklage ist die erste Form gut als Sich-Abwenden verständlich. Da derselbe hebräische Verbstamm jedoch auch »umkehren/zurückkehren« heißen kann, wird die alternative Lesart nicht dogmatisch ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappen rhetorischen Fragen und ihre Parallelstruktur bleiben erhalten.
