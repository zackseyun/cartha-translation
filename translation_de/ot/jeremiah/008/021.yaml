id: JER.8.21
reference: Jeremiah 8:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל שֶׁ֥בֶר בַּת עַמִּ֖/י הָשְׁבָּ֑רְתִּי קָדַ֕רְתִּי שַׁמָּ֖ה הֶחֱזִקָֽתְ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/021.yaml
  text: For the brokenness of the daughter of my people I am broken[a]; I mourn[c][b]; horror has seized me.
translation:
  language: de
  text: Wegen des Bruchs der Tochter meines Volkes bin ich zerbrochen[a]. Ich trauere[b]; Entsetzen hat mich gepackt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen stehen „Bruch“ und „zerbrochen“ aus derselben Wortwurzel nebeneinander. Auch möglich: „Wegen der Zerschmetterung der Tochter meines Volkes bin ich zerschmettert.“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ich bin verdüstert“ oder „Ich gehe trauernd einher.“ Das hebräische Verb verbindet Trauer mit dem Bild des Dunkelwerdens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Wegen
  rationale: Die Präposition bezeichnet hier den Anlass oder Grund der Klage; „wegen“ gibt diesen Zusammenhang im Deutschen klar und knapp wieder.
- source_word: שֶׁבֶר
  choice: Bruch
  rationale: „Bruch“ bewahrt das konkrete Bild der Zerstörung und ermöglicht zugleich die lautliche und semantische Entsprechung mit „zerbrochen“.
- source_word: בַּת עַמִּי
  choice: Tochter meines Volkes
  rationale: Die prophetische Personifikation wird entsprechend dem Hebräischen beibehalten, statt sie erklärend aufzulösen.
- source_word: הָשְׁבָּרְתִּי
  choice: bin ich zerbrochen
  rationale: Die Form bezeichnet den eingetretenen Zustand des Sprechers. „Zerbrochen“ bewahrt zudem das bewusste Wortspiel mit שֶׁבֶר („Bruch“).
- source_word: קָדַרְתִּי
  choice: Ich trauere
  rationale: Das Verb trägt die Vorstellung des Dunkelwerdens beziehungsweise düsteren Trauerns. „Ich trauere“ gibt den Sinn in natürlichem Deutsch wieder; die Bildkomponente wird in einer Fußnote genannt.
- source_word: שַׁמָּה
  choice: Entsetzen
  rationale: Das Substantiv bezeichnet erschütterndes Grauen oder Bestürzung; „Entsetzen“ passt zum emotionalen Zustand des Sprechers.
- source_word: הֶחֱזִקַתְנִי
  choice: hat mich gepackt
  rationale: Die Hifil-Form von חזק beschreibt hier, dass das Entsetzen den Sprecher fest ergriffen hat. „Gepackt“ ist kräftig, gegenwärtig und idiomatisch.
theological_decisions:
- issue: Identität der sprechenden Stimme
  choice: Die erste Person bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Den Sprecher ausdrücklich als Jeremia oder als Gott kennzeichnen.
  rationale: Der einzelne Vers benennt den Sprecher nicht ausdrücklich; eine Festlegung würde die im Text und Kontext bestehende Auslegungsspannung unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Klagevokabular. Die ungewöhnliche prophetische Wendung „Tochter meines Volkes“ und das hebräische Wortspiel werden bewusst bewahrt; die Satzfolge bleibt knapp und eindringlich.
