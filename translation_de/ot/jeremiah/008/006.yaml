source:
  edition: WLC
  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
translation:
  language: de
  text: 'Ich habe aufmerksam hingehört: Sie reden nicht, was recht ist.[a] Niemand bereut sein böses Tun und sagt: »Was habe ich getan?« Jeder kehrt zu seinem eigenen Lauf zurück,[b] wie ein Pferd, das in die Schlacht stürmt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sie reden nicht so.« Auch möglich: »Sie reden nicht richtig.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Jeder kehrt zu seinem Rennen zurück.« Der hebräische Ausdruck beschreibt ihr ungestümes Beharren auf dem eingeschlagenen Weg.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  choice: Ich habe aufmerksam hingehört
  rationale: Die Verbindung beider Hörverben betont bewusstes, genaues Hinhören. Die deutsche Formulierung gibt diese Intensität natürlich wieder, ohne eine schwerfällige Doppelung zu erzeugen.
- source_word: לוֹא כֵן יְדַבֵּרוּ
  choice: Sie reden nicht, wie es recht wäre
  rationale: 'Wörtlich heißt die Wendung etwa: »Nicht so reden sie.« Im Zusammenhang wird ihre Rede als unangemessen oder unrichtig beurteilt. Die Übersetzung bewahrt diesen offenen moralischen Bezug.'
- source_word: אֵין אִישׁ
  choice: Niemand
  rationale: אִישׁ steht hier im verallgemeinernden Singular. »Niemand« ist im modernen Deutschen die natürliche inklusive Wiedergabe und verliert den distributiven Sinn nicht.
- source_word: נִחָם עַל רָעָתוֹ
  choice: bereut seine Bosheit
  rationale: נחם bezeichnet hier Reue beziehungsweise eine innere Umkehr angesichts eigenen Fehlverhaltens; רעה hat im Kontext moralischen Sinn. »Bosheit« hält diesen ethischen Gehalt fest.
- source_word: לֵאמֹר מֶה עָשִׂיתִי
  choice: 'und sagt: »Was habe ich getan?«'
  rationale: Die direkte Selbstfrage wird ohne den im Hebräischen nicht ausdrücklich vorhandenen Zusatz »falsch« wiedergegeben.
- source_word: כֻּלֹּה שָׁב במרצותם
  choice: Alle wenden sich wieder ihrem Lauf zu
  rationale: Die schwierige Formulierung verbindet die Gesamtheit der Menschen mit dem Bild ihres Laufens beziehungsweise eingeschlagenen Kurses. »ihrem Lauf« erhält das Bewegungsbild und lässt die im Konsonantentext erkennbare Suffixform anklingen.
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  choice: wie ein Pferd, das in die Schlacht stürmt
  rationale: שׁוֹטֵף vermittelt eine heftige, unaufhaltsame Bewegung. »stürmt« gibt das anschauliche Bild eines kopflos vorwärtsdrängenden Pferdes prägnant wieder.
theological_decisions:
- issue: Reue und Umkehr in נִחָם
  choice: bereut
  alternative: kehrt um / empfindet Bedauern
  rationale: Der Vers beschreibt fehlende Reue über moralische Bosheit, ohne bereits eine ausgearbeitete dogmatische Definition von Buße einzutragen. »bereut« wahrt sowohl das innere Bedauern als auch den möglichen Impuls zur Umkehr.
- issue: Generischer Gebrauch von אִישׁ
  choice: Niemand
  alternative: Kein Mann
  rationale: Im Kontext gilt die Aussage der gesamten angesprochenen Bevölkerung. Das natürliche deutsche Indefinitpronomen bildet diese repräsentative Funktion ab, ohne den Geltungsbereich unnötig auf männliche Personen einzuengen.
- issue: Mehrdeutigkeit des eigenen Laufs
  choice: ihrem Lauf
  alternative: seinem Lauf / ihrem Rennen
  rationale: Das seltene beziehungsweise textlich schwierige במרצותם bezeichnet Lauf, Rennen oder Kurs. Die Übersetzung erhält das Bild, statt es deutend als »sündigen Weg« aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Bildsprache des Laufens und des in die Schlacht stürmenden Pferdes bleibt erhalten; schwerfällige Nachbildung der beiden einleitenden Hörverben wurde zugunsten einer natürlichen intensiven Formulierung vermieden.
