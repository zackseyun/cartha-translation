  terminology: „bereut“ ist für נִחָם im Kontext passend. „Seine Bosheit“ kann im Deutschen stärker eine Charaktereigenschaft als die konkrete böse Tat bzw. das böse Handeln bezeichnen. „Sein böses Tun“ gibt רָעָתוֹ kontextgerecht wieder, ohne die nicht ausgesprochene Selbstanklage in der folgenden Frage zu ergänzen.
