    rationale: Die hebräische Formulierung lautet wörtlich „nicht so reden sie“ und kann im Kontext „sie reden nicht, was recht ist“ bedeuten. Die direkte Formulierung ist im Deutschen flüssig und näher an der Satzstruktur.
