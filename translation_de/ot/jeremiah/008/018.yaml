  text: Kein Trost in meinem Kummer[a][b]; mein Herz ist krank in mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut am Anfang ist schwierig. Auch möglich: »Ich wollte mich in meinem Kummer trösten; mein Herz ist krank in mir.«'
    reason: alternative_reading
  - marker: b
