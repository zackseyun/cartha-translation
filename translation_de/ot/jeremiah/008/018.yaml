lexical_decisions:
- source_word: מַבְלִיגִיתִי
  choice: lässt sich nicht lindern
  rationale: Die schwierige, wohl von בלג abgeleitete Form weist wahrscheinlich auf Linderung, Trost oder Aufhellung. Im Zusammenhang der Klage wird sie idiomatisch als ausbleibende Linderung wiedergegeben, ohne eine sichere Wortbedeutung vorzutäuschen.
- source_word: עֲלֵי יָגוֹן
  choice: mein Kummer
  rationale: יָגוֹן bezeichnet Kummer oder tiefen Schmerz. Die Präposition עֲלֵי steht in der stark verdichteten poetischen Wendung; im Deutschen wird die Beziehung natürlich in den Gesamtsatz integriert.
- source_word: עָלַי לִבִּי
  choice: mein Herz … in mir
  rationale: Wörtlich steht etwa »auf/über mir mein Herz«. Die deutsche Fassung gibt die innere Betroffenheit idiomatisch wieder und behält zugleich das Herz als Sitz des inneren Leidens bei.
- source_word: דַוָּי
  choice: krank
  rationale: Das Adjektiv bezeichnet einen kranken, siechen oder von Schwäche gezeichneten Zustand. »Krank« ist direkt, verständlich und entspricht dem Bild des leidenden Herzens.
