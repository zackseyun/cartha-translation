id: JER.8.14
reference: Jeremiah 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
translation:
  language: de
  text: Warum bleiben wir sitzen? Sammelt euch, lasst uns in die befestigten Städte ziehen und dort zugrunde gehen[a]! Denn Jahwe, unser Gott, hat uns dem Untergang preisgegeben und uns Giftwasser zu trinken gegeben[b], weil wir gegen Jahwe gesündigt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und dort verstummen« beziehungsweise »und dort vernichtet werden«; das hebräische Verb kann Verstummen, Stillwerden oder Zugrundegehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Wasser des Gifts« oder »Giftwasser«; gemeint ist Wasser mit einem bitteren oder giftigen Stoff.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: bleiben wir sitzen
  rationale: Bewahrt das konkrete Bild des Sitzens und macht im rhetorischen Zusammenhang zugleich das untätige Verharren deutlich.
- source_word: הֵאָסְפוּ
  choice: Sammelt euch
  rationale: Gibt den dringlichen Nifal-Imperativ natürlich wieder und wahrt den reflexiven Sinn des Zusammenkommens.
- source_word: עָרֵי הַמִּבְצָר
  choice: die befestigten Städte
  rationale: Bezeichnet klar und idiomatisch städtische Zufluchtsorte mit Verteidigungsanlagen.
- source_word: וְנִדְּמָה
  choice: und dort zugrunde gehen
  rationale: Im Zusammenhang von Belagerung, Gericht und Sündenbekenntnis liegt der Sinn des Verstummens beziehungsweise Vernichtetwerdens nahe; die bestehende Mehrdeutigkeit wird in der Fußnote genannt.
- source_word: הֲדִמָּנוּ
  choice: hat uns dem Untergang preisgegeben
  rationale: Die kausative Form derselben Wurzel bezeichnet hier, dem Kontext nach, Gottes Auslieferung des Volkes an den Untergang, ohne die genaue Art des Gerichts festzulegen.
- source_word: מֵי רֹאשׁ
  choice: Giftwasser
  rationale: רֹאשׁ bezeichnet hier einen giftigen beziehungsweise bitter-giftigen Stoff; „Giftwasser“ erhält das konkrete Bild in knapper, verständlicher Form.
- source_word: חָטָאנוּ לַיהוָה
  choice: wir gegen Jahwe gesündigt haben
  rationale: „Gegen jemanden sündigen“ ist die natürliche deutsche Entsprechung und bezeichnet Jahwe als den, dem gegenüber die Schuld begangen wurde.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Gerichtssprache in den beiden Formen der Wurzel דמה
  choice: Das Volk erkennt, dass Jahwe es unter seinem Gericht dem Untergang preisgegeben hat.
  alternative: Die Formen können auch im Sinn von Verstummen oder Stille verstanden werden.
  rationale: Der Kontext von befestigten Städten, Giftwasser und Sündenbekenntnis stützt den Sinn von Vernichtung beziehungsweise Untergang. Die echte lexikalische Spannung bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Aufforderung und die harte Gerichtssprache bleiben erhalten; die Mehrdeutigkeit von דמה wird nicht im Haupttext überladen, sondern in Fußnote [a] offengelegt.
