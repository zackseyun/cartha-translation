source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: de
  text: Zu jener Zeit – Spruch Jahwes – werden sie die Gebeine der Könige von Juda, die Gebeine seiner Amtsträger, die Gebeine der Priester, die Gebeine der Propheten und die Gebeine der Einwohner Jerusalems aus ihren Gräbern herausbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die geläufige Zeitangabe wird in natürlichem, gehobenem Deutsch wiedergegeben und behält ihren vorausweisenden Bezug.
- source_word: נְאֻם יְהוָה
  choice: so lautet der Ausspruch Jahwes
  rationale: נְאֻם bezeichnet eine feierliche prophetische Kundgabe. „Ausspruch“ wahrt diesen Charakter; die Einfügung mit Gedankenstrichen bildet die Stellung der Formel im Satz ab.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Umschrift.
- source_word: וְיֹצִיאוּ
  choice: werden sie … herausholen
  rationale: Der Hifil von יצא bezeichnet hier das Herausbringen der Gebeine aus den Gräbern. Das unbestimmte Subjekt der 3. Person Plural bleibt als „sie“ erhalten.
- source_word: עַצְמוֹת
  choice: Gebeine
  rationale: Das konkrete Wort bedeutet „Knochen“. Im Zusammenhang mit den Toten und ihren Gräbern ist „Gebeine“ im Deutschen natürlich und würdevoll; die Wiederholung des hebräischen Ausdrucks wird bewahrt.
- source_word: מַלְכֵי יְהוּדָה
  choice: die Könige von Juda
  rationale: Die hebräische Genitivverbindung wird klar und direkt wiedergegeben.
- source_word: שָׂרָיו
  choice: seine Amtsträger
  rationale: שׂרים bezeichnet hier Personen in politisch-führender Stellung. „Amtsträger“ ist aktueller und genauer als das heute missverständliche „Fürsten“; das Suffix wird auf Juda bezogen.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Dies ist die übliche und sachlich genaue Bezeichnung des kultischen Amtes.
- source_word: הַנְּבִיאִים
  choice: die Propheten
  rationale: Die etablierte deutsche Wiedergabe entspricht dem bezeichneten prophetischen Amt.
- source_word: יוֹשְׁבֵי יְרוּשָׁלִָם
  choice: die Einwohner Jerusalems
  rationale: Das substantivierte Partizip bezeichnet kollektiv die Menschen, die in Jerusalem wohnen; „Einwohner“ ist klar und gegenwärtig.
- source_word: מִקִּבְרֵיהֶם
  choice: aus ihren Gräbern
  rationale: Die Präposition bezeichnet die Bewegung aus den Gräbern heraus; das Pluralsuffix bezieht sich auf sämtliche zuvor genannten Toten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm als persönlichen Gottesnamen. Die Umschrift bewahrt den Namen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Rhetorische Wiederholung von עַצְמוֹת
  choice: „die Gebeine“ vor jeder genannten Gruppe wiederholen
  alternative: „die Gebeine“ nur einmal nennen und danach die Gruppen aufzählen
  rationale: Die fünfmalige Wiederholung im Hebräischen steigert das Grauen und unterstreicht, dass die angekündigte Schändung alle gesellschaftlichen Gruppen umfasst. Diese Wirkung soll nicht durch Straffung abgeschwächt werden.
- issue: Unbestimmtes Subjekt von וְיֹצִיאוּ
  choice: „sie werden … herausholen“
  alternative: „man wird … herausholen“
  rationale: Das Hebräische nennt kein ausdrückliches Subjekt, verwendet jedoch die 3. Person Plural. „Sie“ bewahrt diese grammatische Offenheit, ohne die Täter näher zu bestimmen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-prophetischem Ton. Die Satzstellung und die wiederholte Nennung der Gebeine bewahren die eindringliche Rhetorik des Hebräischen; Gedankenstriche kennzeichnen die eingeschobene Botenformel.
