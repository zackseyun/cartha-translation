id: JER.8.20
reference: Jeremiah 8:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָבַ֥ר קָצִ֖יר כָּ֣לָה קָ֑יִץ וַ/אֲנַ֖חְנוּ ל֥וֹא נוֹשָֽׁעְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/020.yaml
  text: The harvest has passed[a], the summer has ended, and we have not been saved.
translation:
  language: de
  text: Die Ernte ist vorüber, der Sommer ist zu Ende, und wir sind nicht gerettet worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »befreit worden«. Das hebräische Verb kann die Rettung aus Gefahr oder Unglück bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר
  choice: ist vorüber
  rationale: Das Qal Perfekt bezeichnet hier eine abgeschlossene Zeitspanne. »Ist vorüber« ist im modernen Deutschen natürlich und bringt zum Ausdruck, dass die Erntezeit verstrichen ist.
- source_word: קָצִיר
  choice: die Ernte
  rationale: Das Substantiv bezeichnet die Ernte beziehungsweise die Erntezeit. »Die Ernte« wahrt die knappe poetische Form und ist im Zusammenhang als Jahreszeit verständlich.
- source_word: כָּלָה
  choice: ist zu Ende
  rationale: Das Qal Perfekt drückt Vollendung aus. »Ist zu Ende« bildet einen natürlichen deutschen Parallelismus zu »ist vorüber«.
- source_word: קַיִץ
  choice: der Sommer
  rationale: Im Parallelismus mit »Ernte« ist die gewöhnliche Jahreszeitenbedeutung am wahrscheinlichsten; eine ausdrückliche Deutung als Zeit der Sommerfrüchte ist nicht nötig.
- source_word: וַאֲנַחְנוּ
  choice: und wir
  rationale: Das Waw verbindet zunächst koordinierend. »Und« bewahrt die hebräische Form; der enttäuschende Gegensatz ergibt sich aus dem Zusammenhang.
- source_word: לֹא
  choice: nicht
  rationale: Direkte Wiedergabe der Negation.
- source_word: נוֹשָׁעְנוּ
  choice: sind nicht gerettet worden
  rationale: Das Nifal Perfekt 1. Person Plural von ישׁע bezeichnet erfahrene Rettung beziehungsweise Befreiung. Die passive Form »sind nicht gerettet worden« wahrt sowohl die grammatische Gestalt als auch die Ergebnisbedeutung.
theological_decisions:
- issue: Wiedergabe von ישׁע im Zusammenhang einer nationalen Klage
  choice: gerettet
  alternative: befreit
  rationale: »Gerettet« ist eine direkte Wiedergabe und lässt die umfassende Bedeutung göttlicher Rettung offen. Der Zusammenhang bezieht sie auf die ausbleibende Rettung aus Not und Unglück, ohne den Ausdruck auf eine spätere lehrmäßige Bedeutung zu verengen. »Befreit« wäre ebenfalls möglich, ist aber enger.
translation_notes:
  register: Moderne, würdige und knappe Klagesprache. Der Parallelismus der beiden ersten Satzglieder bleibt erhalten; das abschließende »und« bewahrt die spannungsvolle hebräische Koordination.
