  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und bewahrt den knappen, klagenden Parallelismus. »Ist vorüber« und »ist zu Ende« sind idiomatisch; »sind nicht gerettet worden« ist zwar etwas formeller, für den würdigen biblischen Registerton aber natürlich und präzise.
