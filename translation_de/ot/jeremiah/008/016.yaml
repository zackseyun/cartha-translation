id: JER.8.16
reference: Jeremiah 8:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
translation:
  language: de
  text: Von Dan her ist das Schnauben seiner Pferde zu hören. Beim lauten Wiehern seiner starken Rosse[a] erbebt das ganze Land[b]. Sie kommen und verschlingen das Land und alles, was es erfüllt[c], die Stadt und ihre Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Hengste“. Das hebräische Wort bezeichnet Starke oder Mächtige und meint hier kräftige Kriegspferde; ihr Geschlecht wird dabei nicht zwingend festgelegt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die ganze Erde“. Das hebräische Wort אֶרֶץ kann „Land“ oder „Erde“ bedeuten; im unmittelbaren Zusammenhang der Invasion liegt „Land“ näher.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: das Land und alles, was sich darin befindet.'
    reason: clarification
lexical_decisions:
- source_word: מִדָּן נִשְׁמַע
  choice: Von Dan her ist … zu hören
  rationale: Gibt Herkunft und passive Wahrnehmung natürlich wieder und bewahrt die lebendige Unmittelbarkeit der Warnung aus dem Norden.
- source_word: נַחְרַת סוּסָיו
  choice: das Schnauben seiner Pferde
  rationale: נַחְרָה bezeichnet das kräftige Schnauben der Pferde; das maskuline Suffix wird als „seiner“ bewahrt, ohne den im Vers nicht ausdrücklich genannten Bezug festzulegen.
- source_word: מִצְהֲלוֹת אַבִּירָיו
  choice: beim lauten Wiehern seiner starken Rosse
  rationale: מִצְהֲלוֹת bezeichnet lautes Wiehern; אַבִּירָיו hebt hier im Zusammenhang mit Pferden deren Stärke hervor. „Rosse“ wahrt den würdevoll-prophetischen Ton.
- source_word: רָעֲשָׁה כָּל־הָאָרֶץ
  choice: erbebt das ganze Land
  rationale: רעש bezeichnet heftiges Beben oder Erzittern. „Land“ passt zum unmittelbaren Bild einer Invasion, während die weitere Bedeutung „Erde“ in einer Fußnote erhalten bleibt.
- source_word: וַיָּבֹאוּ וַיֹּאכְלוּ
  choice: Sie kommen und verschlingen
  rationale: Das Präsens vermittelt die prophetische Vergegenwärtigung. „Verschlingen“ bewahrt die gewaltsame Metapher des hebräischen Verbs „essen“.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  choice: das Land und alles, was es erfüllt
  rationale: Gibt מְלוֹאָהּ verständlich und zugleich bildnah wieder, ohne den Ausdruck lediglich zu „alles darin“ abzuflachen.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: die Stadt und ihre Bewohner
  rationale: Eine natürliche deutsche Wiedergabe, die sowohl die einzelne „Stadt“ als auch die darin Wohnenden ausdrücklich nennt.
theological_decisions: []
