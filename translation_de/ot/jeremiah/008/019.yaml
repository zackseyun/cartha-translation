  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
translation:
  language: de
  text: Siehe, der Hilfeschrei der Tochter meines Volkes aus einem fernen Land:[a] »Ist Jahwe nicht in Zion? Ist ihr König nicht in ihr?« — »Warum haben sie mich mit ihren Schnitzbildern zum Zorn gereizt, mit fremden Nichtigkeiten?«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Siehe, die Stimme des Hilfeschreis der Tochter meines Volkes aus einem Land der Fernen.“'
    reason: Die Fußnote dokumentiert sowohl die volle Konstruktion קוֹל שַׁוְעַת als auch den ungewöhnlichen hebräischen Plural מַרְחַקִּים.
  - marker: b
    text: 'Oder: „mit fremden Götzen“. Das hebräische Wort für „Nichtigkeiten“ verspottet Götzen als leer und wertlos.'
    reason: Die Alternative erläutert den in der Götzenpolemik naheliegenden Bezug von הַבְלֵי נֵכָר, ohne die Bedeutung „Nichtigkeiten“ im Haupttext zu ersetzen.
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die deiktische Interjektion lenkt mit Nachdruck auf den nun vernehmbaren Hilfeschrei. „Siehe“ ist in gehobener moderner Bibelsprache verständlich und bewahrt die Plötzlichkeit des Hebräischen.
- source_word: קוֹל שַׁוְעַת
  choice: da ist der Hilfeschrei
  rationale: Wörtlich steht „Stimme/Laut des Hilfeschreis“. Die deutsche Wendung gibt die Wahrnehmung des lauten, dringlichen Rufes natürlich wieder; die vollere Form wird in Fußnote [a] dokumentiert.
- source_word: בַּת עַמִּי
  choice: Tochter meines Volkes
  rationale: Die prophetische, gemeinschaftsbezogene Tochter-Metapher bleibt erhalten und wird nicht zu einer bloßen Bezeichnung wie „mein Volk“ eingeebnet.
- source_word: מֵאֶרֶץ מַרְחַקִּים
  choice: aus fernem Land
  rationale: Der hebräische Plural „Fernen/Entfernungen“ bezeichnet idiomatisch große räumliche Ferne. „Aus fernem Land“ ist knapp, natürlich und lässt den möglichen Exilbezug bestehen, ohne ihn ausdrücklich einzutragen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Ausgangstext stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אִם מַלְכָּהּ אֵין בָהּ
  choice: Ist ihr König nicht in ihr?
  rationale: Die zweite rhetorische Frage steht parallel zur Frage nach Jahwes Gegenwart in Zion. Das feminine Pronomen wird mit „ihr“ bewahrt und verweist auf Zion.
- source_word: הִכְעִסוּנִי
  choice: haben sie mich … zum Zorn gereizt
  rationale: Die Form ist kausativ; „zum Zorn gereizt“ gibt diese Nuance idiomatisch wieder.
- source_word: בִּפְסִילֵיהֶם
  choice: mit ihren Schnitzbildern
  rationale: פְּסִיל bezeichnet konkret ein geschnitztes oder gehauenes Kultbild. „Schnitzbilder“ bewahrt diese materielle Bildsprache genauer als das allgemeinere „Götzen“.
- source_word: בְּהַבְלֵי נֵכָר
  choice: mit den nichtigen Götzen der Fremde
  rationale: הֶבֶל bezeichnet Nichtigkeit, Leere oder Wertlosigkeit und kann in der Götzenpolemik die Götzen selbst benennen. Die Wiedergabe macht sowohl den Bezug auf Götzen als auch das abwertende Wortspiel sichtbar; נֵכָר bleibt als Herkunfts- oder Zugehörigkeitsangabe „der Fremde“ bewusst etwas offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Eigennamen. „Jahwe“ bewahrt diesen Textbefund, statt ihn durch den Titel „der HERR“ zu ersetzen.
- issue: Bezug von „ihr König“
  choice: „König“ als parallele Bezeichnung für Jahwe, ohne zusätzliche Erläuterung im Vers
  alternative: Bezug auf einen menschlichen König Zions
  rationale: Die unmittelbare Parallelität der beiden Fragen legt nahe, dass Jahwe selbst als Zions König bezeichnet wird. Die Übersetzung lässt den Wortlaut dennoch unverändert stehen und fügt keine dogmatische Auslegung hinzu.
- issue: Sprecherwechsel vor „Warum haben sie mich …?“
  choice: Durch Gedankenstrich und neue Anführungszeichen als Antwort Jahwes markiert
  alternative: Den gesamten Vers als unmarkierte, fortlaufende Rede wiedergeben
  rationale: Das Suffix der ersten Person in „mich“ zeigt einen Wechsel von der Klage des Volkes zu einer göttlichen Antwort an. Die Zeichensetzung macht den im Hebräischen impliziten Wechsel lesbar, ohne einen Sprecher ausdrücklich in den Text einzufügen.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener prophetischer Bildsprache. „Siehe“ setzt einen bewusst gehobenen, aber allgemein verständlichen Akzent. Die Sprecherwechsel werden nur typografisch verdeutlicht. Sämtliche Fußnotenmarker [a] und [b] stehen im Haupttext.
