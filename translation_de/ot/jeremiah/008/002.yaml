source:
  edition: WLC
  text: וּ/שְׁטָחוּ/ם֩ לַ/שֶּׁ֨מֶשׁ וְ/לַ/יָּרֵ֜חַ וּ/לְ/כֹ֣ל צְבָ֣א הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר אֲהֵב֜וּ/ם וַ/אֲשֶׁ֤ר עֲבָדוּ/ם֙ וַֽ/אֲשֶׁר֙ הָלְכ֣וּ אַֽחֲרֵי/הֶ֔ם וַ/אֲשֶׁ֣ר דְּרָשׁ֔וּ/ם וַ/אֲשֶׁ֥ר הִֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: de
  text: Und man wird sie vor der Sonne, dem Mond und dem ganzen Heer des Himmels[a] ausbreiten, die sie geliebt und denen sie gedient haben, denen sie gefolgt sind, die sie gesucht[b] und vor denen sie sich niedergeworfen haben. Sie werden weder aufgelesen noch begraben; sie werden zu Mist auf der Erdoberfläche[c] werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem ganzen Himmelsheer“.'
    reason: lexical_alternative
  - marker: b
    text: „Gesucht“ kann hier auch „befragt“ oder „um Rat gefragt“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „auf dem Angesicht des Erdbodens“.'
    reason: literal_rendering
lexical_decisions:
- source_word: וּשְׁטָחוּם
  choice: man wird sie … ausbreiten
  rationale: Das Verb bezeichnet hier das Ausbreiten und offene Preisgeben der zuvor genannten Gebeine. Die unbestimmte deutsche Konstruktion gibt die hebräische 3. Person Plural natürlich wieder.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: vor der Sonne, dem Mond
  rationale: Die Präposition bezeichnet in diesem Zusammenhang die offene Aussetzung vor den Himmelskörpern, nicht eine Bewegung zu ihnen hin.
- source_word: וּלְכֹל צְבָא הַשָּׁמַיִם
  choice: dem ganzen Heer des Himmels
  rationale: „Heer des Himmels“ ist im Deutschen verständlich, würdevoll und bewahrt den kollektiven Ausdruck für die Himmelskörper.
- source_word: אֲשֶׁר אֲהֵבוּם
  choice: die sie geliebt
  rationale: Die ungewöhnlich starke Sprache persönlicher Zuneigung wird beibehalten und nicht zu einem allgemeinen Ausdruck für Verehrung abgeschwächt.
- source_word: וַאֲשֶׁר עֲבָדוּם
  choice: denen sie gedient haben
  rationale: „Dienen“ bewahrt die kultische Bedeutung von עבד und bleibt zugleich vom späteren Niederwerfen lexikalisch unterschieden.
- source_word: וַאֲשֶׁר הָלְכוּ אַחֲרֵיהֶם
  choice: denen sie gefolgt sind
  rationale: Die hebräische Wendung „hinter jemandem hergehen“ bezeichnet Gefolgschaft oder Loyalität; „folgen“ gibt dies in natürlichem Deutsch wieder.
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  choice: die sie gesucht
  rationale: „Suchen“ hält die Bedeutung bewusst offen zwischen hingebungsvoller Suche und religiöser Befragung; die engere Möglichkeit wird in einer Fußnote genannt.
- source_word: וַאֲשֶׁר הִשְׁתַּחֲווּ לָהֶם
  choice: vor denen sie sich niedergeworfen haben
  rationale: Die Formulierung bewahrt den körperlichen Akt kultischer Unterwerfung, ohne ihn mit dem vorherigen „dienen“ gleichzusetzen.
- source_word: לֹא יֵאָסְפוּ
  choice: Sie werden weder aufgelesen
  rationale: Im Zusammenhang mit verstreuten Gebeinen bezeichnet אסף ihr Einsammeln. „Aufgelesen“ macht das konkrete Bild im Deutschen klar.
- source_word: וְלֹא יִקָּבֵרוּ
  choice: noch begraben werden
  rationale: Direkte und idiomatische Wiedergabe des verweigerten Begräbnisses.
- source_word: לְדֹמֶן
  choice: zu Mist
  rationale: „Mist“ bewahrt die derbe, erniedrigende Kraft des prophetischen Bildes und ist in modernem Standarddeutsch natürlicher als „Dung“.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf der Erdoberfläche
  rationale: Die Wendung bedeutet wörtlich „auf dem Angesicht des Erdbodens“; „Erdoberfläche“ gibt das räumliche Bild knapp und natürlich wieder.
theological_decisions:
- issue: Die Reihe der Verben für die Hinwendung zu den Himmelskörpern
  choice: geliebt / gedient / gefolgt / gesucht / sich niedergeworfen
  alternative: Die Reihe mit einem oder mehreren allgemeinen Begriffen wie „angebetet“ zusammenfassen
  rationale: Die Häufung verschiedener Verben zeichnet eine umfassende Bindung an die Himmelskörper. Ihre Unterscheidung erhält die rhetorische Kraft und vermeidet eine interpretierende Vereinfachung.
- issue: Bedeutungsumfang von דָּרַשׁ im religiösen Kontext
  choice: „gesucht“ im Text, mit „befragt“ als Fußnotenalternative
  alternative: Ausschließlich „befragt“ oder „um Rat gefragt“
  rationale: Der Ausdruck kann sowohl Suchen als auch kultisches Befragen bezeichnen. Die Hauptfassung bewahrt den weiteren Sinn; die Fußnote macht die engere religiöse Nuance sichtbar.
- issue: Bezeichnung צְבָא הַשָּׁמַיִם
  choice: „das ganze Heer des Himmels“
  alternative: „alle Himmelskörper“
  rationale: Die bildhafte Sammelbezeichnung des Hebräischen bleibt erhalten, ohne festzulegen, ob nur Gestirne oder umfassender himmlische Mächte gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Relativsätze und die abgestufte Reihe der Verehrungshandlungen bleiben erhalten, werden aber durch idiomatische Kasusanschlüsse lesbar gestaltet. Das drastische Schlussbild wird nicht abgeschwächt.
