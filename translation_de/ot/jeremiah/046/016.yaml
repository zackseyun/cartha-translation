source:
  edition: WLC
  text: הִרְבָּ֖ה כּוֹשֵׁ֑ל גַּם נָפַ֞ל אִ֣ישׁ אֶל רֵעֵ֗/הוּ וַ/יֹּֽאמְרוּ֙ ק֣וּמָ/ה וְ/נָשֻׁ֣בָה אֶל עַמֵּ֗/נוּ וְ/אֶל אֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔/נוּ מִ/פְּנֵ֖י חֶ֥רֶב הַ/יּוֹנָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/016.yaml
  text: He has multiplied the stumbling; indeed[a], each man falls against his companion, and they say, “Come, and let us return to our people and to the land of our birth, away from the sword of the oppressor.”
translation:
  language: de
  text: 'Er ließ viele straucheln; ja, einer fiel über den anderen. Da sagten sie: »Auf, lasst uns zu unserem Volk und in das Land unserer Geburt zurückkehren, weg vom Schwert des Unterdrückers[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Schwert der Taube«. Das hebräische Wort kann wörtlich so verstanden werden; im Zusammenhang wird es meist als Bezeichnung des Unterdrückers oder Gewalttäters aufgefasst.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְבָּה כּוֹשֵׁל
  choice: Er ließ viele straucheln
  rationale: הִרְבָּה ist eine Hifil-Form von רבה und hat hier kausative Kraft; der Handelnde ist aus dem Zusammenhang zu erschließen. כּוֹשֵׁל bezeichnet den Strauchelnden beziehungsweise das Straucheln. Die deutsche Wiedergabe löst die gedrängte hebräische Formulierung natürlich auf, ohne ihr Bild abzuschwächen.
- source_word: גַּם
  choice: ja
  rationale: Die Partikel verstärkt hier die folgende Aussage, statt lediglich ein weiteres Glied hinzuzufügen.
- source_word: נָפַל אִישׁ אֶל רֵעֵהוּ
  choice: einer fiel über den anderen
  rationale: אִישׁ ist distributiv gebraucht. Die Formulierung vermittelt das chaotische gegenseitige Zu-Fall-Bringen in der Niederlage und klingt im Deutschen idiomatisch.
- source_word: קוּמָה
  choice: Auf
  rationale: Der Imperativ leitet einen gemeinsamen Aufbruch ein. Das knappe deutsche »Auf« bewahrt sowohl den Aufforderungscharakter als auch die gehobene Erzählweise.
- source_word: וְנָשֻׁבָה
  choice: lasst uns … zurückkehren
  rationale: Der Kohortativ drückt den gemeinsamen Entschluss zur Rückkehr aus.
- source_word: עַמֵּנוּ
  choice: unser Volk
  rationale: עַם bezeichnet hier die eigene ethnische beziehungsweise nationale Gemeinschaft.
- source_word: אֶרֶץ מוֹלַדְתֵּנוּ
  choice: das Land unserer Geburt
  rationale: Die transparente Wiedergabe bewahrt das konkrete Bild des hebräischen Ausdrucks für das Herkunfts- oder Heimatland.
- source_word: מִפְּנֵי
  choice: weg vom
  rationale: Die Präposition bezeichnet hier das Fliehen vor einer drohenden Gewalt. »Weg vom« verbindet Bewegungsrichtung und Fluchtgrund natürlich.
- source_word: חֶרֶב הַיּוֹנָה
  choice: Schwert des Unterdrückers
  rationale: חֶרֶב behält das konkrete Kriegsbild bei. הַיּוֹנָה wird im militärischen Zusammenhang als Bezeichnung des Unterdrückers beziehungsweise Gewalttäters verstanden; die wörtlich mögliche Lesart wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Deutung von הַיּוֹנָה in der Schlusswendung
  choice: des Unterdrückers
  alternative: der Taube
  rationale: Die Form kann als »Taube« verstanden werden, doch im Zusammenhang von Schlacht, Zusammenbruch und Flucht ergibt eine Herleitung beziehungsweise Bedeutungsverbindung mit ינה, »unterdrücken/misshandeln«, den klareren Sinn. Da die hebräische Form tatsächlich mehrdeutig ist, bleibt die wörtliche Alternative ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufforderung »Auf« und das konkrete »Land unserer Geburt« bewahren den markanten Ton und die Bildsprache des Hebräischen; die Satzführung bleibt dennoch für heutige Leser unmittelbar verständlich.
