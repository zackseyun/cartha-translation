base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: de
  text: Du aber, fürchte dich nicht, mein Knecht Jakob, spricht Jahwe, denn ich bin mit dir. Denn ich werde alle Völker, unter die ich dich vertrieben habe, vollständig vernichten; dich aber werde ich nicht vollständig vernichten.[a] Doch ich werde dich dem Recht gemäß zurechtweisen und dich keinesfalls ungestraft lassen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische wiederholt „ein vollständiges Ende machen“ und betont so den Gegensatz zwischen den Völkern und Jakob.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde dich keinesfalls für unschuldig erklären.“ Das hebräische Verb kann im forensischen Sinn „freisprechen“ bedeuten; hier schließt es zugleich aus, dass Jakob ohne angemessene Strafe bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה אַל תִּירָא
  choice: Du aber, fürchte dich nicht
  rationale: Das vorangestellte Pronomen hebt Jakob kontrastiv hervor; die direkte Aufforderung gibt das Verbot mit ירא klar und idiomatisch wieder.
- source_word: עַבְדִּי יַעֲקֹב
  choice: mein Knecht Jakob
  rationale: Bewahrt sowohl den Bund Titel „mein Knecht“ als auch den ausdrücklich genannten Namen Jakob, der hier zugleich das Volk bezeichnet.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine natürliche, feierliche Wiedergabe der prophetischen Botenformel; der Gottesname wird als Jahwe wiedergegeben.
- source_word: כִּי אִתְּךָ אָנִי
  choice: denn ich bin mit dir
  rationale: Gibt die Begründung und die Zusage der göttlichen Gegenwart unmittelbar wieder.
- source_word: אֶעֱשֶׂה כָלָה
  choice: vollständig vernichten
  rationale: Die Verbindung bezeichnet hier ein völliges Ende beziehungsweise vollständige Vernichtung. Dieselbe Formulierung wird in beiden Satzteilen wiederholt, um den rhetorischen Gegensatz zu erhalten.
- source_word: בְּכָל הַגּוֹיִם אֲשֶׁר הִדַּחְתִּיךָ שָׁמָּה
  choice: alle Völker, unter die ich dich vertrieben habe
  rationale: נדח im Hifil bezeichnet das gewaltsame Forttreiben in die Verbannung; „unter die“ ist im Deutschen für das Zerstreuen unter Völker natürlich.
- source_word: וְיִסַּרְתִּיךָ לַמִּשְׁפָּט
  choice: Doch ich werde dich dem Recht gemäß zurechtweisen
  rationale: יסר bezeichnet korrigierende Zucht oder Disziplinierung; לַמִּשְׁפָּט bestimmt sie als rechtmäßig und gerecht, ohne die Spannung zwischen Bewahrung und Gericht aufzulösen.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָ
  choice: und dich keinesfalls ungestraft lassen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Verneinung. Die Wiedergabe erfasst den kontextuellen Sinn, lässt aber den forensischen Nebensinn in einer Fußnote erkennen.
theological_decisions:
- issue: Göttliches Gericht über Jakob im Unterschied zu den Völkern
  choice: Jakob wird vor vollständiger Vernichtung bewahrt, aber nicht von gerechter Zurechtweisung und Strafe ausgenommen.
  alternative: Jakob werde in jeder Hinsicht von Gericht verschont, oder seine Zurechtweisung sei ausschließlich vernichtende Vergeltung.
  rationale: Der Vers stellt die Nichtvernichtung Jakobs ausdrücklich neben seine rechtmäßige Zurechtweisung. So bleiben Bewahrung und Gericht gleichermaßen bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und der Gegensatz zwischen vollständiger Vernichtung und bewahrender, aber realer Zurechtweisung werden deutlich gehalten. „Zurechtweisen“ vermeidet das heute altertümlich oder missverständlich klingende „züchtigen“, ohne den korrigierenden Charakter von יסר abzuschwächen.
