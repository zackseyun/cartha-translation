  text: קוֹלָ֖/הּ כַּ/נָּחָ֣שׁ יֵלֵ֑ךְ כִּֽי בְ/חַ֣יִל יֵלֵ֔כוּ וּ/בְ/קַרְדֻּמּוֹת֙ בָּ֣אוּ לָ֔/הּ כְּ/חֹטְבֵ֖י עֵצִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/022.yaml
  text: Her sound goes like a serpent[a], for they go with an army and come against her with axes[c][b], like woodcutters.
translation:
  language: de
  text: Ihr Laut zieht dahin wie eine Schlange[a]; denn sie ziehen mit Heeresmacht heran und kommen mit Äxten gegen sie[b], wie Holzfäller.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann „Stimme“, „Laut“ oder „Geräusch“ bedeuten. Die ungewöhnliche Bildsprache sagt wörtlich, dass ihr Laut wie eine Schlange dahingeht; sie lässt die genaue Art des Lautes offen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „kommen zu ihr“; im Zusammenhang ist feindliches Vorgehen gemeint: „kommen gegen sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹלָהּ
  choice: ihr Laut
  rationale: קוֹל kann Stimme, Laut oder Geräusch bezeichnen. Da Ägypten als Frau personifiziert ist und hier eher ein vernehmbarer Laut als gesprochene Rede gemeint ist, wahrt „ihr Laut“ die Bildsprache, ohne sie unnötig festzulegen.
- source_word: כַּנָּחָשׁ
  choice: wie der einer Schlange
  rationale: נָחָשׁ bezeichnet eine Schlange. Die ergänzte Vergleichsform „wie der einer Schlange“ bezieht das Bild im Deutschen eindeutig auf den Laut, nicht auf dessen Fortbewegungsweise.
- source_word: יֵלֵךְ
  choice: zieht dahin
  rationale: הלך bedeutet grundsätzlich „gehen“. Beim Subjekt „Laut“ gibt „zieht dahin“ die Bewegung bzw. Ausbreitung natürlich wieder, ohne das Bild als Zischen oder Rascheln festzulegen.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Erklärung für den schlangenartigen Laut ein; „denn“ erhält diesen begründenden Zusammenhang.
- source_word: בְחַיִל
  choice: mit Heeresmacht
  rationale: חַיִל kann Kraft, Streitmacht oder Heer bedeuten. „Mit Heeresmacht“ bewahrt sowohl den militärischen Bezug als auch den möglichen Nachdruck auf überwältigende Stärke.
- source_word: יֵלֵכוּ
  choice: sie rücken heran
  rationale: הלך heißt wörtlich „gehen“. Im Zusammenhang eines bewaffneten Angriffs ist „heranrücken“ natürlich und macht die militärische Bewegung deutlich.
- source_word: וּבְקַרְדֻּמּוֹת
  choice: mit Äxten
  rationale: קַרְדֹּם bezeichnet eine Axt; der instrumentale Plural wird direkt und idiomatisch wiedergegeben.
- source_word: בָּאוּ לָהּ
  choice: kommen gegen sie
  rationale: Wörtlich steht „zu ihr kommen“. Im feindlichen militärischen Kontext ist die Zielrichtung adversativ; „gegen sie kommen“ macht dies knapp deutlich.
- source_word: כְּחֹטְבֵי עֵצִים
  choice: wie Holzfäller
  rationale: Die Wendung bedeutet wörtlich „wie Holz-/Baumhauer“. „Holzfäller“ ist die natürliche moderne Bezeichnung und bewahrt das Bild des Fällens.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Prophetensprache. „Heeresmacht“ hält die Bedeutungsbreite von חַיִל zwischen Heer und militärischer Stärke offen. Die Schlange bleibt ohne deutende Zusätze wie „zischen“ oder „rascheln“, damit die genuine Bildunschärfe des Hebräischen erhalten bleibt.
