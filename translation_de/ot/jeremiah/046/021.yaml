source:
  edition: WLC
  text: גַּם שְׂכִרֶ֤י/הָ בְ/קִרְבָּ/הּ֙ כְּ/עֶגְלֵ֣י מַרְבֵּ֔ק כִּֽי גַם הֵ֧מָּה הִפְנ֛וּ נָ֥סוּ יַחְדָּ֖יו לֹ֣א עָמָ֑דוּ כִּ֣י י֥וֹם אֵידָ֛/ם בָּ֥א עֲלֵי/הֶ֖ם עֵ֥ת פְּקֻדָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/021.yaml
  text: Even her hired soldiers in her midst are like fattened calves; for even they have turned and fled together; they did not stand[a], for the day of their disaster has come upon them, the time of their punishment.
translation:
  language: de
  text: Auch ihre Söldner mitten in ihr sind wie Mastkälber. Denn auch sie haben sich umgewandt und sind gemeinsam geflohen; sie hielten nicht stand. Denn der Tag ihres Unheils ist über sie gekommen, die Zeit ihrer Bestrafung[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zeit ihrer Heimsuchung“; auch möglich: „die Zeit, in der sie zur Rechenschaft gezogen werden“.'
    reason: lexikalische Alternative für פְּקֻדָּה
lexical_decisions:
- source_word: שְׂכִרֶיהָ
  choice: ihre Söldner
  rationale: Das Substantiv bezeichnet gemietete Personen; im militärischen Zusammenhang des Orakels gegen Ägypten sind angeworbene Truppen gemeint. „Söldner“ gibt diesen Sinn im Deutschen knapp und eindeutig wieder.
- source_word: בְקִרְבָּהּ
  choice: mitten in ihr
  rationale: Die räumliche Wendung bezieht sich auf die in Ägypten stationierten Söldner und bewahrt zugleich die Personifizierung des Landes durch das feminine Pronomen.
- source_word: כְּעֶגְלֵי מַרְבֵּק
  choice: wie Mastkälber
  rationale: Die Wendung bezeichnet im Stall gemästete Kälber. „Mastkälber“ erhält das Bild wohlgenährter, aber gegenüber dem kommenden Verderben wehrloser Tiere.
- source_word: הִפְנוּ
  choice: haben sich umgewandt
  rationale: Die Form bezeichnet eine Wendung beziehungsweise ein Abwenden. Die gewählte Formulierung bewahrt die Abfolge von Umwenden und Fliehen, ohne die Bewegungsrichtung stärker festzulegen als der hebräische Text.
- source_word: נָסוּ יַחְדָּו
  choice: sind gemeinsam geflohen
  rationale: „Fliehen“ gibt den militärischen Rückzug direkt wieder; „gemeinsam“ entspricht dem Adverb und zeigt den kollektiven Zusammenbruch.
- source_word: לֹא עָמָדוּ
  choice: sie hielten nicht stand
  rationale: Die idiomatische deutsche Wendung bewahrt das Bild des Nichtstandhaltens im Kampf, ohne das schlichtere Hebräisch durch ein ausdrückliches „konnten nicht“ zu modalisieren.
- source_word: יוֹם אֵידָם
  choice: der Tag ihres Unheils
  rationale: אֵיד bezeichnet Unheil, Unglück oder Verderben. „Unheil“ ist im prophetischen Gerichtskontext natürlich und würdevoll.
- source_word: עֵת פְּקֻדָּתָם
  choice: die Zeit ihrer Bestrafung
  rationale: פְּקֻדָּה kann Heimsuchung, Rechenschaft oder Bestrafung bezeichnen. Der Parallelismus mit dem Tag des Unheils legt hier den strafenden Sinn nahe; die offenere traditionelle Wiedergabe wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gerichtsbegriffs פְּקֻדָּה
  choice: die Zeit ihrer Bestrafung
  alternative: die Zeit ihrer Heimsuchung; die Zeit, in der sie zur Rechenschaft gezogen werden
  rationale: Der unmittelbare Zusammenhang ist ein Gerichtsorakel und stellt die Wendung parallel zum Tag des Unheils. Daher ist die strafende Bedeutung wahrscheinlich, doch die lexikalische Mehrdeutigkeit wird nicht verschwiegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Söldner“, „Mastkälber“ und „hielten nicht stand“ sind präzise und idiomatisch; die Personifizierung Ägyptens bleibt durch „mitten in ihr“ erhalten.
