base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/004.yaml
  text: Harness the horses[a]; mount up, you horsemen; take your stand with helmets on. Polish the spears[b]; put on the armor.
translation:
  language: de
  text: Schirrt die Pferde an; steigt auf, ihr Reiter! Stellt euch mit aufgesetzten Helmen auf! Poliert die Speere[a], zieht die Panzer[b] an!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Macht die Lanzen blank.«'
    reason: רמח kann als »Speer« oder »Lanze« wiedergegeben werden; מרק bezeichnet das Polieren beziehungsweise Blankmachen.
  - marker: b
    text: Das hebräische Wort bezeichnet einen Körperpanzer, möglicherweise einen Schuppen- oder Kettenpanzer.
    reason: Die genaue Bauart der mit סריון bezeichneten Schutzrüstung ist nicht sicher.
lexical_decisions:
- source_word: אִסְרוּ הַסּוּסִים
  choice: Schirrt die Pferde an
  rationale: אסר bedeutet grundsätzlich »binden«; im militärischen Zusammenhang mit Pferden bezeichnet es ihre Vorbereitung zum Einsatz. »anschirren« gibt dies im Deutschen knapp und natürlich wieder.
- source_word: וַעֲלוּ הַפָּרָשִׁים
  choice: steigt auf, ihr Reiter
  rationale: עלה heißt wörtlich »hinaufsteigen«; zusammen mit פרשים ist das Aufsteigen auf die Pferde gemeint. Die Anrede »ihr Reiter« bewahrt die Befehlsform und vermeidet eine unnötig moderne Spezifizierung als Kavalleristen.
- source_word: וְהִתְיַצְּבוּ בְּכוֹבָעִים
  choice: Stellt euch auf, die Helme auf dem Kopf
  rationale: Der Hitpael von יצב fordert dazu auf, eine feste Position beziehungsweise Gefechtsstellung einzunehmen. כובע bezeichnet militärischen Kopfschutz; die deutsche Formulierung macht das Anlegen bzw. Tragen der Helme idiomatisch deutlich.
- source_word: מִרְקוּ הָרְמָחִים
  choice: Poliert die Lanzen
  rationale: מרק bezeichnet hier das Glätten oder Blankmachen. רמח kann Speer oder Lanze bedeuten; »Lanzen« passt besonders zum genannten Reiterverband, ohne die Waffenart übermäßig eng festzulegen.
- source_word: לִבְשׁוּ הַסִּרְיֹנֹת
  choice: zieht die Panzer an
  rationale: לבש ist das Anziehen eines Kleidungs- oder Ausrüstungsstücks. סריון bezeichnet einen den Körper schützenden Panzer, möglicherweise einen Schuppen- oder Kettenpanzer; »Panzer« bewahrt die sachliche Breite des hebräischen Begriffs.
theological_decisions: []
translation_notes:
  register: Kurze, energische Imperative spiegeln den militärischen Aufruf. Die Sprache ist modern und würdig; »anschirren«, »Lanzen« und »Panzer« sind verständliche, sachlich passende Militärbegriffe. Beide Fußnotenmarker stehen unmittelbar bei den erklärten Begriffen.
