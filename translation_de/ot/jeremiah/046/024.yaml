  text: הֹבִ֖ישָׁה בַּת מִצְרָ֑יִם נִתְּנָ֖ה בְּ/יַ֥ד עַם צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/024.yaml
  text: The daughter of Egypt is put to shame[a]; she is given into the hand of a people from the north.
translation:
  language: de
  text: Die Tochter Ägyptens ist zuschanden geworden; sie ist in die Hand[a] eines Volkes aus dem Norden gegeben worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„In die Hand gegeben“ bedeutet: der Gewalt eines anderen ausgeliefert.'
    reason: Erläuterung eines hebräischen Idioms
lexical_decisions:
- source_word: הֹבִישָׁה
  choice: ist zuschanden geworden
  rationale: Die Hifil-Form bezeichnet hier das Eintreten von Schande beziehungsweise Entehrung. Die deutsche Zustandsveränderung gibt den prophetischen Gerichtston natürlich wieder, ohne bloß ein inneres Schamgefühl auszudrücken.
- source_word: בַּת מִצְרָיִם
  choice: die Tochter Ägyptens
  rationale: Die im Hebräischen übliche prophetische Personifikation des Landes bleibt erhalten; zugleich erklärt sie die feminine Form der Verben.
- source_word: נִתְּנָה
  choice: ist … gegeben worden
  rationale: Das Nifal von נתן ist passiv und bezeichnet hier die Auslieferung unter fremde Gewalt. Das Perfekt wird im Deutschen idiomatisch als vollzogener Vorgang wiedergegeben.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt eines anderen. Das Bild der Hand bleibt im Haupttext bewahrt und wird in der Fußnote erläutert.
- source_word: עַם צָפוֹן
  choice: eines Volkes aus dem Norden
  rationale: Die Formulierung ist im Hebräischen allgemein und nennt weder Babylon noch ausdrücklich ein Heer. Die Übersetzung bewahrt diese Unbestimmtheit.
theological_decisions:
- issue: Historische Identität des Volkes aus dem Norden
  choice: 'Die Bezeichnung bleibt allgemein: „ein Volk aus dem Norden“.'
  alternative: Das Volk im Haupttext als Babylonier oder als nördliches Heer bestimmen.
  rationale: Der hebräische Vers selbst nennt nur ein Volk aus dem Norden. Eine genauere historische Identifizierung würde eine Auslegung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Personifikation „Tochter Ägyptens“ und das Hand-Bild des hebräischen Textes bleiben erhalten; die Satzformen sind zugleich natürlich und allgemein verständlich.
