  text: עִרְכ֤וּ מָגֵן֙ וְ/צִנָּ֔ה וּ/גְשׁ֖וּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/003.yaml
  text: Prepare buckler and shield[a], and advance to battle.
translation:
  language: de
  text: Macht Schild und Großschild bereit[a] und rückt zum Kampf vor!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stellt den kleinen und den großen Schild bereit und tretet zum Kampf an.“'
    reason: Die beiden hebräischen Schildbezeichnungen unterscheiden wahrscheinlich einen kleineren von einem größeren Schild; außerdem können die Verben wörtlicher mit „aufstellen“ und „herantreten“ wiedergegeben werden.
lexical_decisions:
- source_word: עִרְכוּ
  choice: Macht … bereit
  rationale: Das Imperativverb bedeutet „ordnen, aufstellen, bereitmachen“. Mit Waffen als Objekt gibt „bereitmachen“ den militärischen Aufruf im modernen Deutschen natürlich wieder.
- source_word: מָגֵן
  choice: Schild
  rationale: מָגֵן bezeichnet einen Schutzschild, im Gegensatz zum folgenden צִנָּה wahrscheinlich den kleineren Schild. „Schild“ bleibt verständlich und vermeidet eine unbelegte Festlegung auf eine bestimmte Form.
- source_word: צִנָּה
  choice: Großschild
  rationale: צִנָּה bezeichnet gewöhnlich einen größeren Schild. „Großschild“ bewahrt den Gegensatz zu מָגֵן knapp und in modern verständlicher Sprache.
- source_word: וּגְשׁוּ
  choice: und rückt … vor
  rationale: Das Verb נגשׁ bedeutet „herantreten, sich nähern“. Im militärischen Zusammenhang bringt „vorrücken“ die Bewegung zum Kampf idiomatisch zum Ausdruck.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Die Präpositionalverbindung bezeichnet hier das Ziel des Heranrückens. „Zum Kampf“ ist knapp und natürlich.
theological_decisions: []
