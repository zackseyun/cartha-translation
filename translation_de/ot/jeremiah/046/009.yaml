source:
  edition: WLC
  text: עֲל֤וּ הַ/סּוּסִים֙ וְ/הִתְהֹלְל֣וּ הָ/רֶ֔כֶב וְ/יֵצְא֖וּ הַ/גִּבּוֹרִ֑ים כּ֤וּשׁ וּ/פוּט֙ תֹּפְשֵׂ֣י מָגֵ֔ן וְ/לוּדִ֕ים תֹּפְשֵׂ֖י דֹּ֥רְכֵי קָֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/009.yaml
  text: Go up, O horses, and rage, O chariots; let the warriors go out—Cush and Put, who grasp the shield, and the Ludim, who grasp and bend the bow.
translation:
  language: de
  text: 'Rückt vor, ihr Pferde, und rast, ihr Streitwagen! Zieht aus, ihr Krieger: Kusch und Put, die den Schild ergreifen, und die Luditer, die den Bogen ergreifen und spannen!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲלוּ
  choice: Rückt vor
  rationale: Das Verb bedeutet wörtlich »steigt hinauf«, kann im militärischen Zusammenhang aber den Vormarsch oder Angriff bezeichnen. »Rückt vor« gibt den natürlichen deutschen Befehl wieder.
- source_word: וְהִתְהֹלְלוּ
  choice: und rast
  rationale: Die reflexiv-intensivierende Form bezeichnet hier eine entfesselte, ungestüme Bewegung; »rast« bewahrt die kraftvolle Bildsprache, ohne eine psychische Bedeutung festzulegen.
- source_word: הַגִּבּוֹרִים
  choice: ihr Krieger
  rationale: Im militärischen Kontext bezeichnet גִּבּוֹרִים kampfstarke Männer beziehungsweise Krieger.
- source_word: דֹּרְכֵי קָשֶׁת
  choice: die den Bogen … spannen
  rationale: Wörtlich sind dies Menschen, die den Bogen »treten«; gemeint ist das Spannen des starken Bogens, gegebenenfalls unter Einsatz des Fußes.
- source_word: לוּדִים
  choice: die Luditer
  rationale: Die hebräische Volksbezeichnung wird als im Deutschen verständliche Einwohner- beziehungsweise Volksbezeichnung wiedergegeben.
theological_decisions: []
translation_notes:
  register: Kraftvoller, dichterischer Militärstil mit direkten Befehlen. Die Volksnamen Kusch und Put bleiben als Eigennamen erhalten; die parallele Satzstruktur und das stürmische Tempo des Hebräischen werden bewahrt.
