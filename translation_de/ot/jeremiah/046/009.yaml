  source_fidelity: 'Der Entwurf gibt die imperativische, militärisch-drängende Abfolge des Hebräischen zuverlässig wieder: עֲלוּ ist idiomatisch als „Rückt vor“ gefasst; וְהִתְהֹלְלוּ als „rast“ bewahrt die entfesselte Bewegung ohne unzulässige Präzisierung. Die Aufzählung von Kusch, Put und den Ludim sowie deren Waffenbezug entspricht dem hebräischen Parallelismus. „Den Bogen ergreifen und spannen“ gibt תֹּפְשֵׂי דֹּרְכֵי קָשֶׁת als die den Bogen handhaben bzw. spannen, angemessen wieder.'
