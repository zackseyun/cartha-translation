  variant: modern standard German
source:
  edition: WLC
  text: וְ֠/אַתָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲק֛וֹב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/027.yaml
  text: But as for you[a], do not fear, my servant Jacob, and do not be dismayed, Israel; for behold, I will save you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: de
  text: 'Du aber, mein Diener Jakob, fürchte dich nicht, und erschrick nicht, Israel! Denn sieh: Ich werde dich aus der Ferne retten und deine Nachkommen aus dem Land ihrer Gefangenschaft.[a] Jakob wird zurückkehren und ruhig und unbesorgt leben; niemand wird ihn in Schrecken versetzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Land, in dem sie gefangen sind“.'
    reason: lexical_alternative
  - marker: b
    text: „Jakob“ und „Israel“ stehen hier personifizierend für das Bundesvolk.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem selbstständigen Pronomen markiert einen betonten Gegensatz zum vorausgehenden Gerichtswort.
- source_word: אַל תִּירָא
  choice: fürchte dich nicht
  rationale: Gibt das direkte Verbot idiomatisch und würdig wieder.
- source_word: עַבְדִּי יַעֲקֹב
  choice: mein Diener Jakob
  rationale: Bewahrt die bundesbezogene Ehren- und Dienstbezeichnung, ohne hier eine Sklavereibedeutung in den Vordergrund zu rücken.
- source_word: וְאַל תֵּחַת
  choice: erschrick nicht
  rationale: חתת bezeichnet hier das Bestürzt- oder Entmutigtwerden; „erschrick nicht“ bildet eine natürliche deutsche Parallele zu „fürchte dich nicht“.
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: 'Denn sieh: Ich werde dich retten'
  rationale: „Denn“ bewahrt die Begründung, „sieh“ die hervorhebende Funktion von הִנְנִי. Das Partizip beschreibt im Kontext eine sichere, bevorstehende Rettung und wird daher zukunftsbezogen wiedergegeben.
- source_word: מֵרָחוֹק
  choice: aus der Ferne
  rationale: Knappes und natürliches räumliches Äquivalent.
- source_word: וְאֶת זַרְעֲךָ
  choice: und deine Nachkommen
  rationale: זֶרַע bezeichnet kollektiv die Nachkommenschaft; „Nachkommen“ ist im heutigen Deutsch klarer als das wörtliche „Samen“.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: aus dem Land ihrer Gefangenschaft
  rationale: Bewahrt sowohl das Landmotiv als auch das pluralische Suffix „ihrer“; die mögliche konkret-lokative Lesart wird in einer Fußnote genannt.
- source_word: וְשָׁב יַעֲקֹב
  choice: Jakob wird zurückkehren
  rationale: שׁוב bezeichnet hier die Rückkehr aus der Verschleppung.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: ruhig und unbesorgt leben
  rationale: Die beiden Verben schildern Ruhe und Sicherheit nach der Bedrängnis. Das ergänzte „leben“ ergibt im Deutschen eine natürliche, zusammenhängende Aussage.
- source_word: וְאֵין מַחֲרִיד
  choice: niemand wird ihn aufschrecken
  rationale: Gibt die idiomatische Negativkonstruktion und das kausative Partizip klar wieder.
theological_decisions:
- issue: Bezug von „Jakob“ und „Israel“
  choice: Die Eigennamen bleiben als personifizierende Bezeichnungen des Bundesvolkes stehen.
  alternative: Explizite Wiedergabe als „Volk Israel“ oder Bezug auf den Patriarchen Jakob als Einzelfigur.
  rationale: Der prophetische Kontext spricht das Volk kollektiv unter den parallelen Bundesnamen „Jakob“ und „Israel“ an. Die Eigennamen bewahren die Bild- und Sprachebene des Hebräischen, ohne sie im Haupttext auszudeuten.
- issue: Zeitbezug von מוֹשִׁיעֲךָ
  choice: „Ich werde dich retten“
  alternative: „Ich rette dich“ oder „Ich bin dabei, dich zu retten“
  rationale: Das Partizip mit הִנְנִי kann gegenwärtige, unmittelbar bevorstehende oder als gewiss dargestellte Handlung ausdrücken. Im Kontext der Verheißung ist die Zukunftswiedergabe natürlich, während die aspektuelle Nuance in der Fußnote offengehalten wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Der Gegensatz am Versanfang wird durch „Du aber“ markiert. Die parallelen Namen und die direkte göttliche Anrede bleiben erhalten; unnötig archaische Formulierungen werden vermieden.
