source:
  edition: WLC
  text: מִי זֶ֖ה כַּ/יְאֹ֣ר יַֽעֲלֶ֑ה כַּ/נְּהָר֕וֹת יִֽתְגָּעֲשׁ֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/007.yaml
  text: Who is this[a], rising like the Nile[b], like rivers whose waters surge?
translation:
  language: de
  text: Wer ist es, der wie der Nil[a] ansteigt, dessen Wasser wie Ströme aufwallen[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort יְאֹר kann „Strom“ bedeuten; in diesem ägyptischen Zusammenhang ist sehr wahrscheinlich der Nil gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „toben“ beziehungsweise „brausen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֶה
  choice: Wer ist es
  rationale: Die Verbindung aus Fragepronomen und Demonstrativpartikel eröffnet die Beschreibung mit einer lebhaften rhetorischen Frage. „Wer ist es“ klingt im heutigen Deutsch natürlich und bewahrt diese Wirkung.
- source_word: כַּיְאֹר
  choice: wie der Nil
  rationale: יְאֹר kann allgemein einen Strom bezeichnen, meint im Zusammenhang des Ägypten-Orakels jedoch sehr wahrscheinlich den Nil.
- source_word: יַעֲלֶה
  choice: ansteigt
  rationale: Das Verb עלה bezeichnet ein Aufsteigen. „Ansteigt“ gibt im Wasserbild besonders anschaulich das Anschwellen des Nils wieder.
- source_word: כַּנְּהָרוֹת
  choice: wie Ströme
  rationale: Der Plural נְהָרוֹת bezeichnet Flüsse oder Ströme. „Ströme“ erhält den Plural und passt zur kraftvollen poetischen Darstellung.
- source_word: יִתְגָּעֲשׁוּ
  choice: aufwallen
  rationale: Die Hitpael-Form von געש beschreibt heftige, unruhige Bewegung. „Aufwallen“ verbindet die Vorstellung anschwellender und bewegter Wassermassen, ohne den möglichen Akzent auf Brausen oder Toben auszuschließen.
- source_word: מֵימָיו
  choice: dessen Wasser
  rationale: Wörtlich steht „seine Wasser“ mit einem maskulinen Singularsuffix. „Dessen Wasser“ bezieht sich auf die in der rhetorischen Frage vorgestellte Gestalt und erhält diesen singularischen Bezug; die Ströme dienen als Vergleich.
theological_decisions: []
translation_notes:
  register: Poetisch und bildkräftig, zugleich in modernem Standarddeutsch gut verständlich. Die Satzfügung macht den singularischen Bezug von „seine Wasser“ sichtbar und bewahrt den Vergleich der Wassermassen mit Strömen.
