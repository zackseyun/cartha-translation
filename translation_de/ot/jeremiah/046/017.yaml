  text: There they cry[a], ‘Pharaoh king of Egypt is only a noise; he has let the appointed time pass by.’
translation:
  language: de
  text: Dort ruft man:[a] »Der Pharao, der König von Ägypten, ist nur Getöse; er hat den festgesetzten Zeitpunkt verstreichen lassen.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Pharao, der König von Ägypten, ist Getöse; er hat den angesetzten Moment verpasst.« Der hebräische Wortlaut ist knapp und spöttisch; שָׁאוֹן kann auch »Lärm«, »Tumult« oder »leeres Getöse« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: ruft man
  rationale: Das Qal Perfekt 3. Person Plural bezeichnet hier, was ausgerufen oder verkündet wird. Das unpersönliche deutsche »man« gibt die nicht näher bezeichneten Rufenden natürlich wieder; das historische Präsens wahrt die lebhafte, spöttische Wirkung.
- source_word: שָׁם
  choice: dort
  rationale: Das Ortsadverb wird direkt und idiomatisch mit »dort« wiedergegeben.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: der Pharao, der König von Ägypten
  rationale: Name beziehungsweise Titel und königliche Apposition werden in natürlichem Deutsch mit bestimmten Artikeln wiedergegeben.
- source_word: שָׁאוֹן
  choice: nur Getöse
  rationale: Das Wort kann Lärm, Getöse oder Tumult bezeichnen. »Nur Getöse« bringt im Kontext den höhnischen Vorwurf wirkungsloser Großspurigkeit zum Ausdruck, ohne ihn zu einer eindeutigen abstrakten Deutung zu verengen.
- source_word: הֶעֱבִיר
  choice: hat ... verstreichen lassen
  rationale: 'Die Hifil-Form von עבר hat kausative Bedeutung: Der Pharao ließ den entscheidenden Zeitpunkt vorübergehen. »Verstreichen lassen« bewahrt diesen Zug besser als das stärker ergebnisorientierte »verpassen«.'
- source_word: הַמּוֹעֵד
  choice: den festgesetzten Zeitpunkt
  rationale: מוֹעֵד bezeichnet hier am ehesten einen bestimmten beziehungsweise angesetzten Zeitpunkt. Der militärisch-politische Zusammenhang spricht gegen die ebenfalls mögliche kultische Bedeutung »Festzeit«.
