id: JER.46.18
reference: Jeremiah 46:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חַי אָ֨נִי֙ נְאֻם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ כִּ֚י כְּ/תָב֣וֹר בֶּֽ/הָרִ֔ים וּ/כְ/כַרְמֶ֖ל בַּ/יָּ֥ם יָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/018.yaml
  text: As I live[a], declares the King, whose name is Yahweh of Armies, surely as Tabor among the mountains and as Carmel by the sea[b], so he will come.
translation:
  language: de
  text: '»So wahr ich lebe«, spricht der König – Jahwe der Heerscharen[a] ist sein Name –, »gewiss: Wie der Tabor unter den Bergen und wie der Karmel am Meer, so wird er kommen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der HERR der Heerscharen«; für »Heerscharen« auch: »Heere«.'
    reason: lexical_alternative
  - marker: b
    text: Das Subjekt von »wird kommen« wird im Hebräischen nicht ausdrücklich genannt; der Zusammenhang weist auf den in den umliegenden Versen angekündigten Eroberer.
    reason: source_ambiguity
lexical_decisions:
- source_word: חַי אָנִי
  choice: So wahr ich lebe
  rationale: Die feste göttliche Schwurformel wird mit der natürlichen und feierlichen deutschen Entsprechung wiedergegeben.
- source_word: נְאֻם
  choice: spricht
  rationale: Das gebräuchliche prophetische Einleitungswort gibt die autoritative Äußerung in klarem, würdigem Deutsch wieder.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Titel bezeichnet hier Gott und bleibt als Hoheitstitel erhalten.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »Heerscharen« bewahrt sowohl den militärischen Sinn als auch die im Deutschen vertraute biblische Würde.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die hebräische Identifikationsformel wird direkt bewahrt, ohne sie zu einer bloßen Benennung abzuschwächen.
- source_word: כִּי
  choice: Gewiss
  rationale: כִּי leitet hier nicht kausal, sondern bekräftigend den Inhalt des Schwurs ein.
- source_word: כְּתָבוֹר בֶּהָרִים
  choice: wie der Tabor unter den Bergen
  rationale: Die Vergleichspartikel und die hervorgehobene Lage des Tabor innerhalb der Berglandschaft werden erhalten.
- source_word: וּכְכַרְמֶל בַּיָּם
  choice: und wie der Karmel am Meer
  rationale: Die geografische Bildsprache des markanten Karmel an der Mittelmeerküste bleibt klar und knapp.
- source_word: יָבוֹא
  choice: so wird er kommen
  rationale: Das maskuline Verb verlangt im Deutschen ein ausgesprochenes Subjekt; »er« wahrt den kontextuellen Bezug, ohne den Eroberer im Vers selbst namentlich festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt; die traditionelle Alternative wird in der Fußnote genannt.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: »Heerscharen« erhält die militärische und kosmische Weite des Ausdrucks in würdigem Deutsch; »Heere« wäre transparenter, aber enger.
- issue: Nicht genanntes Subjekt von יָבוֹא
  choice: er
  alternative: der Eroberer
  rationale: Der hebräische Text nennt das Subjekt nicht ausdrücklich. Das Pronomen wahrt diese Zurückhaltung; der Zusammenhang weist auf den angekündigten Eroberer.
translation_notes:
  register: Modernes, feierliches Standarddeutsch. Die direkte Rede macht Schwur und Gotteswort übersichtlich; die paarige Vergleichsstruktur des Hebräischen bleibt erhalten. Die ungewöhnliche, machtvolle Bildsprache wird nicht erklärend geglättet.
