source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
translation:
  language: de
  text: Und ich werde sie denen ausliefern, die ihnen nach dem Leben trachten[a], Nebukadnezar[b], dem König von Babylon, und seinen Dienern. Danach aber wird Ägypten wieder wohnen wie in früheren Tagen – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die ihr Leben suchen“; gemeint sein kann: „die sie töten wollen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „Nebukadrezar“; im Deutschen gewöhnlich „Nebukadnezar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים בְּיַד
  choice: ich werde sie … ausliefern
  rationale: Die Verbindung von נתן mit בְּיַד bezeichnet hier die Übergabe in die Gewalt anderer. „Ausliefern“ gibt die feindliche Situation im Deutschen natürlich und präzise wieder.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: die ihnen nach dem Leben trachten
  rationale: Diese geläufige deutsche Wendung bewahrt das Bild des hebräischen Ausdrucks und macht zugleich deutlich, dass die Betreffenden sie töten wollen.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im Deutschen herkömmliche Namensform wird aus Gründen der Wiedererkennbarkeit im Haupttext verwendet; die quellenähere Form steht in der Fußnote.
- source_word: עֲבָדָיו
  choice: seinen Dienern
  rationale: „Diener“ lässt die im Kontext mögliche Bandbreite königlicher Untergebener offen, ohne sie enger als Beamte, Soldaten oder Sklaven zu bestimmen.
- source_word: וְאַחֲרֵי כֵן
  choice: Danach aber
  rationale: Die Formulierung gibt sowohl die zeitliche Abfolge als auch den im Zusammenhang erkennbaren Umschwung vom Gericht zur Wiederherstellung wieder.
- source_word: תִּשְׁכֹּן
  choice: wird Ägypten wieder bewohnt sein
  rationale: Bei einem Land kann das feminine Singularverb eine erneute Besiedlung bezeichnen. Diese Wiedergabe ist im Deutschen natürlicher als die wörtliche Personifikation „sie wird wohnen“; die Alternative wird in einer Fußnote erhalten.
- source_word: כִּימֵי קֶדֶם
  choice: wie in früheren Tagen
  rationale: Die Wendung bezeichnet die Rückkehr zu einem früheren Zustand und wird nah am hebräischen Zeitbild wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: „Spruch“ gibt die feste prophetische Formel knapp und würdig wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die im modernen Deutschen verbreitete Form „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Femininum und Personifikation Ägyptens in תִּשְׁכֹּן
  choice: Ägypten wird wieder bewohnt sein
  alternative: sie wird wohnen
  rationale: Das feminine Singularverb stimmt mit dem im Hebräischen feminin behandelten Ägypten überein. Die Hauptfassung gibt den sachlichen Sinn natürlich wieder; die Fußnote bewahrt die mögliche Personifikation und die formale Nähe zum Verb.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache hebräische Wendung „in die Hand von“ wird zu einer natürlichen deutschen Aufzählung mit „ausliefern“ gebündelt. Der abschließende prophetische Bescheid bleibt durch „Spruch Jahwes“ markant.
