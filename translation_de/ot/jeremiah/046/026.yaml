  terminology: „Nebukadnezar“ ist die im Deutschen übliche Namensform; die hebräische Form „Nebukadrezar“ bleibt sinnvoll erläutert. „Jahwe“ gibt יהוה angemessen als Eigenname wieder. Die Personifikation Ägyptens wird im Haupttext bewahrt.
