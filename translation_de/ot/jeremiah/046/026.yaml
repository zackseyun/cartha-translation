  to: Und ich werde sie denen ausliefern, die ihnen nach dem Leben trachten[a], Nebukadnezar[b], dem König von Babylon, und seinen Dienern. Danach aber wird Ägypten wieder wohnen wie in früheren Tagen – Spruch Jahwes.
  rationale: Die Revision stellt für תִּשְׁכֹּן die aktive, feminine Personifikation Ägyptens wieder her und nennt Ägypten ausdrücklich, damit das deutsche Pronomen nicht auf die zuvor genannten Ausgelieferten bezogen werden kann. Die Empfänger der Auslieferung werden als koordinierte Dativgruppe formuliert; dies ist natürliches Deutsch und erhält die dreigliedrige hebräische Reihung. Die nun überflüssige Fußnote zur passiven Alternativfassung entfällt.
