id: JER.46.1
reference: Jeremiah 46:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא עַל הַ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/001.yaml
  text: The word of Yahweh that came to Jeremiah the prophet concerning the nations:[a]
translation:
  language: de
  text: Das Wort Jahwes, das an den Propheten Jeremia erging, über die Völker:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Völker“. Die hebräische Präposition kann allgemein den Gegenstand bezeichnen oder im Zusammenhang Gerichtsworte einleiten, die gegen die Völker gerichtet sind.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: das
  rationale: Leitet den Relativsatz ein und verbindet die Überschrift mit den folgenden Weissagungen; die Wiederaufnahme durch „das“ ist im Deutschen natürlich.
- source_word: הָיָה
  choice: erging
  rationale: Gibt die feste prophetische Formel דְבַר־יְהוָה הָיָה אֶל idiomatisch und zugleich würdig wieder; ein wörtliches „war“ wäre im Deutschen missverständlich.
- source_word: דְבַר יְהוָה
  choice: Das Wort Jahwes
  rationale: „Wort“ bewahrt die formale und theologische Prägung der prophetischen Offenbarungsformel besser als das stärker deutende „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֶל
  choice: an
  rationale: Kennzeichnet Jeremia als Empfänger des göttlichen Wortes und entspricht der natürlichen deutschen Wendung „an jemanden ergehen“.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Übliche deutsche Namensform des Propheten.
- source_word: הַנָּבִיא
  choice: den Propheten
  rationale: Bewahrt die ausdrücklich genannte Amtsbezeichnung und fügt sie im Deutschen natürlich vor den Namen.
- source_word: עַל
  choice: über
  rationale: Kann in dieser Überschrift allgemein den Gegenstand der folgenden Worte bezeichnen, ohne deren feindliche Stoßrichtung schon eindeutig festzulegen.
- source_word: הַגּוֹיִם
  choice: die Völker
  rationale: Bezeichnet hier die fremden Völker als politische Größen; „Heiden“ wäre ethnisch-religiös stärker festgelegt und im Kontext weniger passend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen unmittelbar. Die Wiedergabe „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von עַל הַגּוֹיִם in der Überschrift
  choice: über die Völker
  alternative: gegen die Völker
  rationale: עַל kann das Thema einer Aussage bezeichnen, im Kontext von Gerichtsworten aber auch eine feindliche Ausrichtung ausdrücken. Der Haupttext bewahrt mit „über“ die weitere Bedeutung; die kontextuell mögliche Lesart „gegen“ steht in der Fußnote.
translation_notes:
  register: Moderne, würdige Standardsprache. Die traditionelle prophetische Formel wird mit „Das Wort Jahwes … erging“ natürlich wiedergegeben; die Überschrift bleibt knapp und formal.
