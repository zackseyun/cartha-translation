source:
  edition: WLC
  text: הַגִּ֤ידוּ בְ/מִצְרַ֨יִם֙ וְ/הַשְׁמִ֣יעוּ בְ/מִגְדּ֔וֹל וְ/הַשְׁמִ֥יעוּ בְ/נֹ֖ף וּ/בְ/תַחְפַּנְחֵ֑ס אִמְר֗וּ הִתְיַצֵּב֙ וְ/הָכֵ֣ן לָ֔/ךְ כִּֽי אָכְלָ֥ה חֶ֖רֶב סְבִיבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/014.yaml
  text: Declare it in Egypt[a], and proclaim it in Migdol; proclaim it in Noph and in Tahpanhes. Say, ‘Take your stand and prepare yourself, for the sword has devoured those around you.’
translation:
  language: de
  text: 'Verkündet es in Ägypten, macht es in Migdol bekannt; macht es in Nof[a] und Tachpanhes bekannt! Sagt: »Nimm deine Stellung ein und mach dich bereit, denn das Schwert hat alles um dich her verschlungen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof ist der hebräische Name von Memphis.
    reason: Der historische Ort ist unter dem Namen Memphis weithin bekannter; der Haupttext bewahrt jedoch die hebräische Namensform.
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Verkündet es
  rationale: Der Hifil-Imperativ Plural bezeichnet ein öffentliches Bekanntmachen. „Verkündet“ wahrt den heroldartigen Ton; „es“ wird im Deutschen sinngemäß aus dem Zusammenhang ergänzt.
- source_word: וְהַשְׁמִיעוּ
  choice: macht es bekannt
  rationale: Der Hifil-Imperativ von שמע bedeutet hier, eine Botschaft öffentlich hören zu lassen. „Macht es bekannt“ ist natürliches modernes Deutsch und wird bei beiden Vorkommen gleich wiedergegeben.
- source_word: בְמִצְרַיִם
  choice: in Ägypten
  rationale: Die Präposition ב ist hier örtlich zu verstehen.
- source_word: בְמִגְדּוֹל
  choice: in Migdol
  rationale: Der Ortsname wird aus dem Hebräischen transliteriert.
- source_word: בְנֹף
  choice: in Nof
  rationale: Der im hebräischen Text stehende Ortsname wird bewahrt; seine geläufige historische Entsprechung Memphis wird in einer Fußnote genannt.
- source_word: וּבְתַחְפַּנְחֵס
  choice: und Tachpanhes
  rationale: Der Ortsname wird aus dem Hebräischen transliteriert; die Präposition „in“ gilt im koordinierten deutschen Satz sinngemäß fort.
- source_word: הִתְיַצֵּב
  choice: Stell dich auf
  rationale: Der Hitpael-Imperativ von יצב bezeichnet das Einnehmen einer Stellung oder das Sich-Bereitstellen und behält hier seine reflexive Form.
- source_word: וְהָכֵן לָךְ
  choice: mach dich bereit
  rationale: כון mit לָךְ hat reflexiven Sinn. „Mach dich bereit“ ist gegenwärtig, klar und natürlich.
- source_word: אָכְלָה חֶרֶב
  choice: das Schwert hat … verschlungen
  rationale: Das Perfekt stellt die Zerstörung als bereits eingetreten oder mit prophetischer Gewissheit im Gang dar. Die personifizierende Metapher des verschlingenden Schwertes bleibt erhalten.
- source_word: סְבִיבֶיךָ
  choice: rings um dich her alles
  rationale: Der Ausdruck bezeichnet den umliegenden Bereich. Das ergänzte „alles“ ergibt im Deutschen ein Objekt zu „verschlungen“, ohne die nicht ausdrücklich genannten Betroffenen auf Personen zu verengen.
theological_decisions:
- issue: Wechsel von pluralischen zu singularischen Aufforderungen
  choice: 'Die wörtliche Rede richtet sich im Singular an das personifizierte Ägypten: „Stell dich auf und mach dich bereit … um dich her“.'
  alternative: Den Singular auf eine einzelne Stadt oder Militäreinheit beziehen oder im Deutschen an die vorausgehenden Pluralformen angleichen.
  rationale: Der Numeruswechsel im Hebräischen ist rhetorisch bedeutsam und sollte nicht eingeebnet werden. Die personifizierende Anrede Ägyptens passt zum Zusammenhang, ohne eine spezifischere Referenz zu erzwingen.
- issue: Aspekt von אָכְלָה
  choice: 'Deutsches Perfekt: „hat … verschlungen“.'
  alternative: Präteritum „verschlang“ oder Zukunft „wird verschlingen“.
  rationale: Das hebräische Perfekt kann vollzogene Zerstörung oder prophetisch gewisse, unmittelbar bevorstehende Zerstörung ausdrücken. Das deutsche Perfekt bewahrt am ehesten den gegenwärtigen Ergebnisbezug, ohne den Satz eindeutig zur bloßen Zukunftsaussage zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit öffentlichem Verkündigungston. Die Wiederholung des Verkündigungsbefehls und der auffällige Wechsel zum Singular bleiben erhalten. Die Ortsnamen folgen den hebräischen Formen.
