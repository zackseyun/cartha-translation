source:
  edition: WLC
  text: לְ/מִצְרַ֗יִם עַל חֵ֨יל פַּרְעֹ֤ה נְכוֹ֙ מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁר הָיָ֥ה עַל נְהַר פְּרָ֖ת בְּ/כַרְכְּמִ֑שׁ אֲשֶׁ֣ר הִכָּ֗ה נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַת֙ הָֽ/רְבִיעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
translation:
  language: de
  text: Über Ägypten:[a] Über das Heer des Pharao Necho, des Königs von Ägypten, das am Euphrat bei Karkemisch stand und das Nebukadrezar,[b] der König von Babylon, im vierten Regierungsjahr Jojakims, des Sohnes Josias, schlug – des Königs von Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Überschrift kann auch mit „Gegen Ägypten“ wiedergegeben werden. „Über Ägypten“ bezeichnet hier zunächst das Thema des folgenden Ausspruchs.
    reason: alternative_reading
  - marker: b
    text: Die hebräische Namensform an dieser Stelle entspricht „Nebukadrezar“; im Deutschen ist auch „Nebukadnezar“ gebräuchlich.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם
  choice: Über Ägypten
  rationale: Das Präfix לְ leitet hier als prophetische Überschrift das Thema des folgenden Ausspruchs ein. „Über Ägypten“ wahrt diese Funktion, ohne die ebenfalls mögliche feindliche Stoßrichtung mit „Gegen Ägypten“ vorwegzunehmen.
- source_word: עַל חֵיל
  choice: über das Heer
  rationale: עַל führt den näheren Gegenstand ein; חֵיל bezeichnet in diesem Zusammenhang die militärische Streitmacht. „Heer“ ist knapp, würdig und im Deutschen eindeutig.
- source_word: פַּרְעֹה נְכוֹ
  choice: Pharao Necho
  rationale: „Necho“ ist eine geläufige deutsche Wiedergabe des hebräischen Namens נְכוֹ.
- source_word: אֲשֶׁר הָיָה עַל נְהַר פְּרָת
  choice: das am Euphrat … stand
  rationale: הָיָה bezeichnet hier den Standort des Heeres; idiomatisches Deutsch gibt dies mit „stand“ wieder. „Am Euphrat“ entspricht der lokativen Bedeutung von עַל.
- source_word: בְּכַרְכְּמִשׁ
  choice: bei Karkemisch
  rationale: Die Präposition markiert den Ort, an dem das Heer am Euphrat lag. „Bei Karkemisch“ bildet die geografische Beziehung im Deutschen natürlich ab.
- source_word: הִכָּה
  choice: schlug
  rationale: נכה bedeutet schlagen beziehungsweise im militärischen Zusammenhang vernichtend schlagen oder besiegen. „Schlug“ bewahrt die verbale Bildkraft, ohne den Grad der Niederlage zusätzlich festzulegen.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadrezar
  rationale: Diese Form gibt die hier im masoretischen Text stehende Namensform genauer wieder als das im Deutschen verbreitetere „Nebukadnezar“.
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  choice: im vierten Regierungsjahr Jojakims
  rationale: Die Wendung ist eine königliche Datierungsformel. Das ergänzte „Regierungs-“ macht ihren Sinn im heutigen Deutsch klar, ohne den zeitlichen Inhalt zu verändern.
theological_decisions: []
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der knappen Form einer prophetischen Überschrift. Die lange hebräische Satzfügung bleibt erkennbar, wird aber durch natürliche deutsche Appositionen und die Wiedergabe von הָיָה mit „stand“ lesbar gehalten.
