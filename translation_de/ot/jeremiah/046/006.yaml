id: JER.46.6
reference: Jeremiah 46:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל יָנ֣וּס הַ/קַּ֔ל וְ/אַל יִמָּלֵ֖ט הַ/גִּבּ֑וֹר צָפ֨וֹנָ/ה֙ עַל יַ֣ד נְהַר פְּרָ֔ת כָּשְׁל֖וּ וְ/נָפָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/006.yaml
  text: Let not the swift flee[a], and let not the mighty man escape; in the north, by the bank of the Euphrates River[c][b], they have stumbled and fallen.
translation:
  language: de
  text: Der Schnelle soll nicht fliehen, und der Krieger soll nicht entkommen. Im Norden[a], am Ufer des Euphrat[b], sind sie gestrauchelt und gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nordwärts“ beziehungsweise „nach Norden“. Die hebräische Form kann sowohl eine Richtung als auch eine Lage im Norden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an der Hand des Euphrat“; eine hebräische Wendung für „neben“ oder „an der Seite von“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָנוּס
  choice: soll nicht fliehen
  rationale: אַל mit dem Imperfekt drückt hier eine Verneinung mit jussivischem Sinn aus. Die Formulierung in der dritten Person wahrt diesen Sinn und klingt im Deutschen natürlich.
- source_word: הַקַּל
  choice: der Schnelle
  rationale: Das substantivierte Adjektiv bezeichnet hier den schnellen oder beweglichen Kämpfer. „Der Schnelle“ erhält die knappe poetische Parallelität.
- source_word: וְאַל יִמָּלֵט
  choice: und … soll nicht entkommen
  rationale: Das Nifal von מלט bedeutet im Zusammenhang einer Niederlage „entkommen“. Die wiederholte Konstruktion gibt die parallele Verneinung des Hebräischen wieder.
- source_word: הַגִּבּוֹר
  choice: der Krieger
  rationale: גִּבּוֹר kann einen starken, tapferen Mann oder besonders im militärischen Zusammenhang einen Krieger bezeichnen. „Krieger“ ist hier idiomatisch und kontextgerecht.
- source_word: צָפוֹנָה
  choice: im Norden
  rationale: Die Form kann eine Richtung nach Norden oder eine nördliche Lage ausdrücken. Zusammen mit der anschließenden Ortsangabe bezeichnet sie wahrscheinlich den Schauplatz der Niederlage.
- source_word: עַל יַד נְהַר פְּרָת
  choice: am Ufer des Euphrat
  rationale: עַל יַד bedeutet wörtlich „an der Hand/Seite von“ und bezeichnet hier die Lage neben dem Fluss. „Am Ufer“ gibt das hebräische Ortsidiom natürlich wieder.
- source_word: כָּשְׁלוּ וְנָפָלוּ
  choice: sind sie gestrauchelt und gefallen
  rationale: Die beiden Perfektformen stellen die Niederlage als eingetretenes Geschehen dar. Das Wortpaar „gestrauchelt und gefallen“ bewahrt Bild und Kürze des hebräischen Parallelismus.
theological_decisions: []
translation_notes:
  register: Moderne, gehobene Standardsprache mit knapper prophetisch-poetischer Parallelität. Die Satzfolge bleibt nahe am Hebräischen, ohne im Deutschen unnatürlich zu wirken.
