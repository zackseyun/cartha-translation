  register: Modernes, würdiges Standarddeutsch mit prophetisch-literarischem Ton. Das doppelte Bewegungsbild „stolpern“ und „fallen“ bleibt erhalten; die feminine Anrede an Ägypten wird im Deutschen durch „deiner“ bewahrt.
