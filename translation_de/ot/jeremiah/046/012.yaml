base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/012.yaml
  text: The nations have heard of your shame[a], and your cry has filled the earth; for warrior has stumbled against warrior; together both of them have fallen.
translation:
  language: de
  text: Die Völker haben von deiner Schande gehört, und dein Schreien hat die Erde erfüllt[a]. Denn ein Krieger ist über den anderen gestolpert; zusammen sind beide gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat das Land erfüllt“. Das hebräische Wort אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten. Wegen der im vorherigen Satzteil genannten Völker steht hier „Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ גוֹיִם קְלוֹנֵךְ
  choice: Die Völker haben von deiner Schande gehört
  rationale: Das Qal-Perfekt beschreibt die bereits verbreitete Nachricht. קָלוֹן bezeichnet öffentliche Schande oder Entehrung; die feminine Anrede richtet sich im Zusammenhang an Ägypten.
- source_word: וְצִוְחָתֵךְ
  choice: und dein Schreien
  rationale: צְוָחָה bezeichnet einen lauten Not- oder Klageschrei. „Schreien“ gibt den kollektiven, weithin hörbaren Aufschrei natürlich wieder.
- source_word: מָלְאָה הָאָרֶץ
  choice: hat die Erde erfüllt
  rationale: אֶרֶץ kann „Erde“ oder „Land“ bedeuten. Wegen der zuvor genannten Völker liegt hier die weltweite beziehungsweise internationale Reichweite näher; die andere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die weithin bekannt gewordene Schande und das Schreien ein.
- source_word: גִבּוֹר בְּגִבּוֹר כָּשָׁלוּ
  choice: ein Krieger ist über den anderen gestolpert
  rationale: גִּבּוֹר ist im militärischen Zusammenhang ein Krieger. בְּ bezeichnet hier wahrscheinlich das Zusammenstoßen beziehungsweise Stolpern eines Kriegers über oder gegen den anderen. Die deutsche Formulierung bewahrt das Bild einer chaotischen Flucht.
- source_word: יַחְדָּיו נָפְלוּ שְׁנֵיהֶם
  choice: beide sind miteinander gefallen
  rationale: שְׁנֵיהֶם hebt ausdrücklich beide Beteiligten hervor; יַחְדָּו bezeichnet ihr gemeinsames beziehungsweise gleichzeitiges Fallen.
