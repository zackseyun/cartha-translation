id: JER.46.13
reference: Jeremiah 46:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ הַ/נָּבִ֑יא לָ/ב֗וֹא נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל לְ/הַכּ֖וֹת אֶת אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/013.yaml
  text: The word that Yahweh spoke to Jeremiah the prophet about the coming of Nebuchadnezzar king of Babylon to strike the land of Egypt:[a]
translation:
  language: de
  text: 'Das Wort, das Jahwe zum Propheten Jeremia sprach, über das Kommen Nebukadnezars[a], des Königs von Babel, um das Land Ägypten zu schlagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensform lautet hier genauer »Nebukadrezar«; traditionell wird im Deutschen »Nebukadnezar« geschrieben.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. In einer prophetischen Überschrift bewahrt »das Wort« die geprägte hebräische Ausdrucksweise und bleibt im Deutschen verständlich.
- source_word: דִּבֶּר
  choice: sprach
  rationale: Mit Jahwe als Subjekt und Jeremia als Adressaten entspricht »sprach« der feierlichen prophetischen Redeformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen gebräuchliche Form.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Der Ausdruck bezeichnet in Apposition Jeremias Amt und wird direkt wiedergegeben.
- source_word: לָבוֹא
  choice: über das Kommen
  rationale: Der Infinitiv mit ל bezeichnet hier den Gegenstand des göttlichen Wortes. Die nominale Wiedergabe erhält die offene zeitliche Form des Hebräischen, statt sie in einen bestimmten Vergangenheitstempus umzudeuten.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: »Nebukadnezar« ist die im Deutschen eingebürgerte Namensform. Die genauere Entsprechung der hier vorliegenden hebräischen Schreibung wird in einer Fußnote genannt.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Die hebräische Genitivverbindung wird idiomatisch und ohne inhaltliche Erweiterung wiedergegeben.
- source_word: לְהַכּוֹת
  choice: um ... zu schlagen
  rationale: נכה umfasst unter anderem »schlagen«, »angreifen« und »besiegen«. »Schlagen« bewahrt die militärische Wucht, ohne den Ausgang des Angriffs vorwegzunehmen.
- source_word: אֶרֶץ מִצְרָיִם
  choice: das Land Ägypten
  rationale: Da der hebräische Text אֶרֶץ ausdrücklich nennt, bleibt der territoriale Bezug in der Übersetzung erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als persönlichen Namen, statt ihn durch den traditionellen Titel »der HERR« zu ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer Überschriftsformel. Die etwas feierliche Nominalfügung »über das Kommen« folgt der offenen Infinitivkonstruktion des Hebräischen; der Doppelpunkt kennzeichnet den folgenden prophetischen Abschnitt.
