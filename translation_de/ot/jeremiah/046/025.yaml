source:
  edition: WLC
  text: אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י פוֹקֵד֙ אֶל אָמ֣וֹן מִ/נֹּ֔א וְ/עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם וְ/עַל אֱלֹהֶ֖י/הָ וְ/עַל מְלָכֶ֑י/הָ וְ/עַ֨ל פַּרְעֹ֔ה וְ/עַ֥ל הַ/בֹּטְחִ֖ים בּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/025.yaml
  text: 'Yahweh of hosts[a], the God of Israel, says: Behold, I am about to punish Amon of No, and Pharaoh, and Egypt, and her gods, and her kings, and Pharaoh[b], and those who trust in him.'
translation:
  language: de
  text: 'Der HERR der Heerscharen, der Gott Israels, spricht: Siehe, ich werde Amon von No[a] zur Rechenschaft ziehen, ebenso den Pharao und Ägypten, seine Götter und seine Könige, den Pharao und alle, die auf ihn[b] vertrauen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Amon von Theben«. »No« ist der hebräische Name einer ägyptischen Stadt, die gewöhnlich mit Theben gleichgesetzt wird.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »alle, die auf Ägypten vertrauen«. Das hebräische Pronomen kann im weiteren Zusammenhang auf Ägypten bezogen werden, grammatisch liegt jedoch der unmittelbar zuvor genannte Pharao näher.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibelkonvention mit »der HERR« wiedergegeben; »der Heerscharen« bewahrt die Breite des Titels und seinen feierlichen Klang.
- source_word: הִנְנִי פוֹקֵד
  choice: Siehe, ich werde … zur Rechenschaft ziehen
  rationale: »Siehe« erhält den feierlichen Hinweischarakter; »zur Rechenschaft ziehen« gibt den gerichtlichen Sinn von פקד verständlich und weniger eindimensional als bloßes »bestrafen« wieder.
- source_word: אָמֹון מִנֹּא
  choice: Amon von No
  rationale: Die Verbindung von Gottheit und Ort wird nah am Hebräischen wiedergegeben. Die übliche Identifikation von No mit Theben steht in der Fußnote.
- source_word: וְעַל
  choice: ebenso … und
  rationale: Die wiederholte Präposition führt die Reihe der vom Gericht Betroffenen fort; im Deutschen wird die Aufzählung natürlich gegliedert, ohne ihren kumulativen Charakter zu verlieren.
- source_word: אֱלֹהֶיהָ וְעַל מְלָכֶיהָ
  choice: seine Götter und seine Könige
  rationale: Die deutschen Pronomen beziehen sich auf das grammatisch sächliche »Ägypten«. Der Plural »Könige« bleibt entsprechend dem Ausgangstext erhalten.
- source_word: הַבֹּטְחִים בּוֹ
  choice: alle, die auf ihn vertrauen
  rationale: Das maskuline Singularpronomen verweist am ehesten auf den unmittelbar zuvor wiederholten Pharao; »auf jemanden vertrauen« ist die natürliche deutsche Entsprechung.
theological_decisions:
- issue: Bezugswort des Pronomens בּוֹ
  choice: »auf ihn vertrauen« mit Bezug auf den Pharao
  alternative: »darauf vertrauen« beziehungsweise »auf Ägypten vertrauen«
  rationale: Der unmittelbar vorausgehende maskuline Singular »Pharao« ist grammatisch das naheliegendste Bezugswort. Da Ägypten den größeren Zusammenhang bestimmt, wird die alternative Beziehung in einer Fußnote offengehalten.
- issue: Gerichtssinn von פקד
  choice: »zur Rechenschaft ziehen«
  alternative: »bestrafen« oder wörtlicher »heimsuchen«
  rationale: Die Formulierung vermittelt göttliches Gericht, ohne den semantischen Umfang des Verbs unnötig auf die Vollstreckung einer Strafe zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-feierlichem Ton. Die wiederholte Nennung des Pharaos und die breite Aufzählung bleiben erhalten; unnötig archaische Wendungen werden vermieden.
