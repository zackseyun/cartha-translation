source:
  edition: WLC
  text: עֶגְלָ֥ה יְפֵֽה פִיָּ֖ה מִצְרָ֑יִם קֶ֥רֶץ מִ/צָּפ֖וֹן בָּ֥א בָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/020.yaml
  text: Egypt is a beautiful heifer; destruction from the north has come[a], it has come.
translation:
  language: de
  text: Ägypten ist eine schöne junge Kuh. Eine Bremse aus dem Norden ist gekommen[a] – sie ist gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Verderben aus dem Norden“; das seltene hebräische Wort wird unterschiedlich gedeutet.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶגְלָה
  choice: junge Kuh
  rationale: Das Substantiv bezeichnet ein junges weibliches Rind. „Junge Kuh“ ist im heutigen Deutsch allgemein verständlich und bewahrt die weibliche Bildsprache; „Färse“ wäre fachsprachlich.
- source_word: יְפֵה פִיָּה
  choice: schöne
  rationale: Die zusammengehörigen Formen beschreiben die auffällige Schönheit beziehungsweise schöne Gestalt des Tieres. „Schöne“ gibt dies natürlich und knapp wieder.
- source_word: מִצְרָיִם
  choice: Ägypten
  rationale: Die übliche Wiedergabe des Ländernamens; das Land wird hier als junge Kuh personifiziert.
- source_word: קֶרֶץ
  choice: Bremse
  rationale: Das seltene und unsicher gedeutete Substantiv kann ein stechendes beziehungsweise beißendes Insekt bezeichnen. „Bremse“ führt das konkrete Tierbild stimmig fort; die abstrakte Deutung wird in der Fußnote erhalten.
- source_word: מִצָּפוֹן
  choice: aus dem Norden
  rationale: Natürliche Wiedergabe der Richtungsangabe, die bei Jeremia häufig die Richtung des herannahenden Gerichts bezeichnet.
- source_word: בָּא בָא
  choice: ist gekommen – sie ist gekommen
  rationale: Die doppelte Wiedergabe bewahrt die emphatische Wiederholung und die perfektive Form. Das feminine Pronomen richtet sich im Deutschen nach „Bremse“.
theological_decisions:
- issue: Deutung von קֶרֶץ im poetischen Gerichtsbild
  choice: Konkretes Insekt („Bremse“) innerhalb des Bildes von der jungen Kuh
  alternative: „Verderben“ oder „Vernichtung“ aus dem Norden
  rationale: Die konkrete Deutung erhält den Zusammenhang der Tiermetapher und ist lexikalisch möglich. Da das seltene hebräische Wort unsicher ist, wird die abstrakte Deutung nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Der kurze poetische Satzbau und die eindringliche Wiederholung des hebräischen Textes bleiben erhalten.
