base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/019.yaml
  text: Prepare your baggage for exile[a], O daughter dwelling in Egypt, for Noph will become a desolation, laid waste[c][b], without inhabitant.
translation:
  language: de
  text: Mach dir Gepäck für die Verbannung[a] bereit, du Bewohnerin, Tochter Ägyptens! Denn Nof[b] wird zur Einöde werden, verwüstet[c] und ohne Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Ausrüstung für die Verbannung“; gemeint sind die Habseligkeiten, die man für eine erzwungene Wegführung vorbereitet.'
    reason: lexical_alternative
  - marker: b
    text: Nof ist der hebräische Name der ägyptischen Stadt, die später Memphis genannt wurde.
    reason: cross_reference
  - marker: c
    text: 'Oder: „niedergebrannt“. Das hebräische Verb bezeichnet Verwüstung und kann dabei eine Zerstörung durch Feuer einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי גוֹלָה
  choice: Gepäck für die Verbannung
  rationale: כְּלֵי bezeichnet Gegenstände oder Ausrüstung; zusammen mit גוֹלָה sind die für eine erzwungene Wegführung bereitzumachenden Habseligkeiten gemeint. „Gepäck für die Verbannung“ ist natürliches Deutsch und bewahrt das konkrete Bild.
- source_word: עֲשִׂי לָךְ
  choice: Mach dir … bereit
  rationale: Der feminine Imperativ mit reflexivem לָךְ fordert die Angesprochene auf, die Sachen für sich selbst vorzubereiten. Die deutsche Wendung gibt den idiomatischen Sinn klar wieder.
- source_word: יוֹשֶׁבֶת בַּת מִצְרָיִם
  choice: du Bewohnerin, Tochter Ägyptens
  rationale: Das feminine Partizip und „Tochter Ägyptens“ gestalten die angeredete Bevölkerung beziehungsweise das personifizierte Ägypten weiblich. Die knappe Anrede erhält sowohl das Wohnen als auch die Personifikation.
- source_word: נֹף
  choice: Nof
  rationale: Der hebräische Ortsname wird in deutscher Umschrift wiedergegeben; die geläufige historische Identifizierung mit Memphis steht in der Fußnote.
- source_word: לְשַׁמָּה
  choice: zur Einöde
  rationale: שַׁמָּה bezeichnet verheerende Verwüstung und kann zugleich den Eindruck entsetzlichen Ruins tragen. „Einöde“ passt zum anschließenden Fehlen jedes Bewohners.
- source_word: וְנִצְּתָה
  choice: niedergebrannt
  rationale: Die Verbform bezeichnet hier wahrscheinlich Zerstörung durch Feuer. „Niedergebrannt“ wahrt dieses konkrete Bild; die allgemeinere Deutung „verwüstet“ wird als Alternative vermerkt.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ohne Bewohner
  rationale: Die Wendung besagt knapp und eindringlich, dass niemand mehr dort wohnen wird. Die bewusst knappe deutsche Form entspricht dem prophetischen Stil.
