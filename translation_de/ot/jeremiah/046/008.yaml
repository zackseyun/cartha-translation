  text: מִצְרַ֨יִם֙ כַּ/יְאֹ֣ר יַֽעֲלֶ֔ה וְ/כַ/נְּהָר֖וֹת יִתְגֹּ֣עֲשׁוּ מָ֑יִם וַ/יֹּ֗אמֶר אַֽעֲלֶה֙ אֲכַסֶּה אֶ֔רֶץ אֹבִ֥ידָה עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
translation:
  language: de
  text: 'Ägypten steigt wie der Nil empor, seine Wasser wogen wie Ströme. Es sagt: »Ich will emporsteigen, ich will die Erde[a] bedecken; ich will die Stadt und ihre Bewohner vernichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Land«.'
    reason: Das hebräische Wort אֶרֶץ kann sowohl »Erde« als auch »Land« bedeuten; der Haupttext bewahrt die weit ausgreifende, übertreibende Prahlerei Ägyptens.
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Der übliche deutsche Name des Landes; Ägypten wird hier als handelnde und sprechende Macht personifiziert.
- source_word: כַּיְאֹר
  choice: wie der Nil
  rationale: יְאֹר bezeichnet besonders in ägyptischem Zusammenhang den Nil; das Bild ist sein ansteigendes Hochwasser.
- source_word: יַעֲלֶה / אַעֲלֶה
  choice: steigt herauf / will heraufsteigen
  rationale: Die Wiederholung derselben deutschen Wortwurzel bewahrt das Echo zwischen der Schilderung und Ägyptens eigener Prahlerei.
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  choice: und wie Ströme wühlen seine Wasser
  rationale: Die Wortstellung macht die Wasser Ägyptens zum Bild seiner aufgewühlten, vordringenden Macht. »wühlen« gibt die unruhige, heftige Bewegung von יתגעשו wieder.
- source_word: וַיֹּאמֶר
  choice: Es sagt
  rationale: Das sächliche Pronomen entspricht im Deutschen dem Ländernamen »Ägypten«; das Präsens erhält die lebendige prophetische Darstellung.
- source_word: אֲכַסֶּה אֶרֶץ
  choice: ich will die Erde bedecken
  rationale: אֶרֶץ kann »Erde« oder »Land« bedeuten. »Erde« wahrt im Haupttext die umfassende, überhebliche Sprache der Drohung.
- source_word: אֹבִידָה
  choice: ich will … vernichten
  rationale: Das Hifil von אבד bezeichnet hier die beabsichtigte gewaltsame Zerstörung.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  choice: die Stadt und ihre Bewohner
  rationale: Der hebräische Singular bleibt erhalten; die idiomatische Formulierung gibt Stadt und die in ihr Wohnenden knapp und verständlich wieder.
