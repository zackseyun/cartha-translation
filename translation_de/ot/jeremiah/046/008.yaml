  register: Modernes, würdevolles Standarddeutsch mit anschaulicher poetischer Bewegung. Die Personifikation Ägyptens und die Hochwasser-Metaphorik bleiben erhalten; der Wechsel zum lebendigen Präsens folgt dem prophetischen Stil.
