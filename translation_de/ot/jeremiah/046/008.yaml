  to: 'Ägypten steigt wie der Nil empor, seine Wasser wogen wie Ströme. Es sagt: »Ich will emporsteigen, ich will die Erde[a] bedecken; ich will die Stadt und ihre Bewohner vernichten.«'
  rationale: Die Revision beschränkt sich auf die unidiomatische Beschreibung der bewegten Wasser und glättet die Wiederholung von »heraufsteigen« zu »emporsteigen«. Die poetische Bildlichkeit, der hebräische Singular bei »Stadt« und die lexikalische Mehrdeutigkeit von אֶרֶץ bleiben erhalten.
