source:
  edition: WLC
  text: מַדּ֖וּעַ נִסְחַ֣ף אַבִּירֶ֑י/ךָ לֹ֣א עָמַ֔ד כִּ֥י יְהוָ֖ה הֲדָפֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/015.yaml
  text: Why has your mighty one been swept away? He did not stand[a], for Yahweh drove him away.
translation:
  language: de
  text: Warum wurde dein Mächtiger fortgerissen?[a] Er hielt nicht stand, denn Jahwe drängte ihn zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „deine Mächtigen“. Das hebräische Wort kann zudem „dein Stier“ bedeuten, möglicherweise eine Anspielung auf Apis, den heiligen Stier Ägyptens.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Das Frageadverb leitet eine rhetorische Frage ein; „Warum“ ist die natürliche moderne Entsprechung.
- source_word: נִסְחַף
  choice: wurde … fortgerissen
  rationale: Das passive Verb beschreibt ein Weg- oder Fortgerissenwerden und bewahrt das anschauliche Bild der Niederlage.
- source_word: אַבִּירֶיךָ
  choice: dein Mächtiger
  rationale: Die Wiedergabe hält zunächst die allgemeine Bedeutung von Stärke oder Macht fest. Die folgenden Formen stehen im Singular; die formal mögliche Mehrzahl und die Bedeutung „Stier“ werden in der Fußnote bewahrt.
- source_word: לֹא עָמַד
  choice: Er hielt nicht stand
  rationale: Die deutsche Wendung gibt sowohl das Stehen als auch das Scheitern im Kampfzusammenhang natürlich wieder, ohne ausdrücklich ein fehlendes Können einzutragen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier den Grund für die Niederlage ein.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֲדָפוֹ
  choice: stieß ihn fort
  rationale: Das Verb bezeichnet Stoßen, Zurückdrängen oder Vertreiben; „stieß ihn fort“ wahrt das kräftige Bild und das singularische Objektsuffix.
theological_decisions:
- issue: Bezug von אַבִּירֶיךָ im Gerichtswort über Ägypten
  choice: Im Haupttext steht allgemein und singularisch „dein Mächtiger“.
  alternative: „deine Mächtigen“ oder „dein Stier“, möglicherweise als Anspielung auf den heiligen Apis-Stier Ägyptens.
  rationale: Das Wort kann einen Mächtigen beziehungsweise Starken und auch einen Stier bezeichnen. Die anschließenden Verbformen und das Objektsuffix sind singularisch. Ein ausdrücklicher Bezug auf Apis ist historisch möglich, aber im Hebräischen nicht eindeutig; deshalb bleibt er eine Fußnotenalternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dein Mächtiger“ bewahrt die ungewöhnliche, mehrdeutige Bezeichnung des Hebräischen; „hielt nicht stand“ ist im Deutschen idiomatisch und erhält zugleich das Kampfbild.
