source:
  edition: WLC
  text: עֲלִ֤י גִלְעָד֙ וּ/קְחִ֣י צֳרִ֔י בְּתוּלַ֖ת בַּת מִצְרָ֑יִם לַ/שָּׁוְא֙ הרביתי רְפֻא֔וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/011.yaml
  text: Go up to Gilead and get balm[a], virgin daughter of Egypt. In vain you have multiplied remedies[b]; there is no healing for you.
translation:
  language: de
  text: Zieh nach Gilead hinauf und hol Balsam[a], Jungfrau, Tochter Ägyptens! Vergeblich hast du zahlreiche Heilmittel eingesetzt[b]; Heilung gibt es für dich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gilead war für seinen medizinisch verwendeten Balsam bekannt. Die Aufforderung ist ironisch: Selbst dieses berühmte Heilmittel kann Ägypten nicht heilen.'
    reason: cultural_note
  - marker: b
    text: 'Die Konsonanten und die grammatische Form des hebräischen Verbs sind an dieser Stelle schwierig. Dem Zusammenhang nach ist Ägypten angesprochen: Es hat zahlreiche Heilmittel eingesetzt beziehungsweise angehäuft, jedoch ohne Erfolg.'
    reason: textual_variant
lexical_decisions:
- source_word: עֲלִי גִלְעָד
  choice: Zieh nach Gilead hinauf
  rationale: Der feminine Singularimperativ von עלה bezeichnet eine gerichtete Bewegung nach oben. Die Wortstellung ist im modernen Deutschen natürlich und bewahrt die Richtungsangabe.
- source_word: וּקְחִי צֳרִי
  choice: und hol Balsam
  rationale: לקח bedeutet hier, sich etwas zu beschaffen; „hol“ klingt bei einem Heilmittel idiomatisch. צֳרִי bezeichnet den als Arzneistoff geschätzten Balsam beziehungsweise das Harz.
- source_word: בְּתוּלַת בַּת מִצְרָיִם
  choice: Jungfrau, Tochter Ägyptens
  rationale: Die prophetische Personifikation wird in ihrer doppelten femininen Bezeichnung bewahrt. Die Apposition mit Komma ist im Deutschen verständlich, ohne die Bildsprache aufzulösen.
- source_word: לַשָּׁוְא
  choice: Vergeblich
  rationale: Die Präpositionalfügung bezeichnet Zwecklosigkeit und wird knapp und mit angemessen prophetischem Ton wiedergegeben.
- source_word: הרביתי רְפֻאוֹת
  choice: häufst du Heilmittel an
  rationale: Im Zusammenhang ist Ägypten weiterhin die feminin-singulare Adressatin. „Heilmittel anhäufen“ bewahrt den Gedanken der Vermehrung und zugleich die Vielzahl vergeblicher Behandlungsversuche; die Schwierigkeit der überlieferten Verbform wird in einer Fußnote kenntlich gemacht.
- source_word: תְּעָלָה אֵין לָךְ
  choice: Heilung gibt es für dich nicht
  rationale: Die existentielle Verneinung wird in einer deutschen Satzform wiedergegeben, die sowohl die hebräische Aussage als auch ihren endgültigen Klang bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. Die feminine Personifikation Ägyptens und die Ironie des Heilmittels werden bewahrt; die textkritische Schwierigkeit wird nicht stillschweigend verdeckt.
