source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
translation:
  language: de
  text: 'Jener Tag gehört dem Herrn Jahwe der Heerscharen: ein Tag der Vergeltung, an dem er sich an seinen Gegnern rächt. Das Schwert wird fressen, bis es satt ist, und sich an ihrem Blut satt trinken. Denn der Herr Jahwe der Heerscharen hat ein Schlachtopfer im Land des Nordens, am Euphrat.


    [b] Möglich ist auch: »Denn im Land des Nordens, am Euphrat, gibt es ein Schlachtopfer für den Herrn Jahwe der Heerscharen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Möglich ist auch: »Denn im Land des Nordens, am Euphrat, gibt es ein Schlachtopfer für den Herrn Jahwe der Heerscharen.«'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא
  choice: Jener Tag
  rationale: Die deiktische Zeitangabe wird im Deutschen natürlich und zugleich betont wiedergegeben; das einleitende וְ muss hier nicht eigens mit »und« übersetzt werden.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: gehört dem Herrn, Jahwe der Heerscharen
  rationale: Das לְ bezeichnet die Zuordnung des Tages zu Gott. אֲדֹנָי wird als »der Herr« wiedergegeben, während der Gottesname יהוה als »Jahwe« erkennbar bleibt. »Heerscharen« bewahrt den etablierten Titel und dessen militärischen Klang.
- source_word: יוֹם נְקָמָה
  choice: ein Tag der Vergeltung
  rationale: »Vergeltung« gibt die richtende und vergeltende Bedeutung von נְקָמָה wieder, ohne die Aussage abzuschwächen.
- source_word: לְהִנָּקֵם מִצָּרָיו
  choice: an dem er sich an seinen Gegnern rächt
  rationale: Die reflexive Bedeutung des Niphal von נקם bleibt erhalten; »Gegner« passt zum militärischen Gerichtskontext von צָרָיו.
- source_word: וְאָכְלָה חֶרֶב וְשָׂבְעָה
  choice: Das Schwert wird fressen, bis es satt ist
  rationale: Die Personifikation des Schwertes und das Bild des Fressens und Sattwerdens werden anschaulich bewahrt.
- source_word: וְרָוְתָה מִדָּמָם
  choice: und sich an ihrem Blut satt trinken
  rationale: רוה kann Sättigung durch Trinken beziehungsweise Durchtränkung bezeichnen. Die Formulierung führt die Personifikation des Schwertes natürlich fort.
- source_word: כִּי זֶבַח לַאדֹנָי
  choice: Denn der Herr ... hält ein Schlachtopfer
  rationale: זֶבַח bezeichnet ein Opfer, bei dem das Schlachten im Vordergrund steht. Die idiomatische Besitz- beziehungsweise Veranstaltungsform wahrt das grausame Opferbild; die mögliche Existenzkonstruktion wird in einer Fußnote erhalten.
- source_word: בְּאֶרֶץ צָפוֹן
  choice: im Land des Nordens
  rationale: Die geografische Bezeichnung wird eng am Hebräischen und verständlich wiedergegeben.
- source_word: אֶל נְהַר פְּרָת
  choice: am Euphrat
  rationale: אֶל hat hier im Zusammenhang mit dem Ort der Schlacht lokative beziehungsweise räumliche Bedeutung; »am« ist die natürliche deutsche Wiedergabe.
theological_decisions:
- issue: Wiedergabe von אֲדֹנָי יְהוִה im zusammengesetzten Gottestitel
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; Herr Jahwe
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und vermeidet zugleich die missverständliche Doppelung »Herr HERR«.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: »Heerscharen« ist im Deutschen als Bestandteil des Gottestitels verständlich und traditionsverbunden; die Fußnote legt die wörtlichere militärische Bedeutung »Heere« offen.
- issue: Opfermetaphorik des Gerichtsgeschehens
  choice: Schlachtopfer
  alternative: Opfer; Opfermahl
  rationale: Die drastische sakrale Metaphorik von זֶבַח wird nicht verharmlost oder rein militärisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Personifikation des Schwertes und die Opfermetaphorik bleiben erhalten. »Jener Tag« und »Vergeltung« geben dem Gerichtswort feierliches Gewicht, ohne altertümliche Syntax zu verwenden.
