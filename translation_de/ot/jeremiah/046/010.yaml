revisions:
- from: 'Jener Tag gehört dem Herrn, Jahwe der Heerscharen[a]: ein Tag der Vergeltung, an dem er sich an seinen Gegnern rächt. Das Schwert wird fressen, bis es satt ist, und sich an ihrem Blut satt trinken. Denn der Herr, Jahwe der Heerscharen, hält ein Schlachtopfer[b] im Land des Nordens, am Euphrat.


    [a] Wörtlich: »Jahwe der Heere«; traditionell wird der Titel häufig mit »Herr der Heerscharen« wiedergegeben.


    [b] Möglich ist auch: »Denn im Land des Nordens, am Euphrat, gibt es ein Schlachtopfer für den Herrn, Jahwe der Heerscharen.«'
  to: 'Jener Tag gehört dem Herrn Jahwe der Heerscharen: ein Tag der Vergeltung, an dem er sich an seinen Gegnern rächt. Das Schwert wird fressen, bis es satt ist, und sich an ihrem Blut satt trinken. Denn der Herr Jahwe der Heerscharen hat ein Schlachtopfer im Land des Nordens, am Euphrat.


    [b] Möglich ist auch: »Denn im Land des Nordens, am Euphrat, gibt es ein Schlachtopfer für den Herrn Jahwe der Heerscharen.«'
  rationale: Die Revision korrigiert die ungenaue Fußnote zum Gottesnamen-Titel, glättet dessen deutsche Form und ersetzt das stärker interpretierende »hält« durch »hat«. Die alternative existenzielle Analyse der elliptischen Opferaussage wird weiterhin ausdrücklich in einer Fußnote dokumentiert. Die Bildsprache vom fressenden und sich an Blut satt trinkenden Schwert bleibt unverändert erhalten.
