source:
  edition: WLC
  text: מַדּ֣וּעַ רָאִ֗יתִי הֵ֣מָּה חַתִּים֮ נְסֹגִ֣ים אָחוֹר֒ וְ/גִבּוֹרֵי/הֶ֣ם יֻכַּ֔תּוּ וּ/מָנ֥וֹס נָ֖סוּ וְ/לֹ֣א הִפְנ֑וּ מָג֥וֹר מִ/סָּבִ֖יב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
translation:
  language: de
  text: Warum habe ich das gesehen? Sie sind bestürzt[a] und weichen zurück. Ihre Krieger werden zerschlagen; sie flohen Hals über Kopf[b] und wandten sich nicht um. Schrecken ringsum! – so lautet der Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie sind mutlos“ beziehungsweise „Sie sind innerlich gebrochen“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im Hebräischen eine verstärkende Verbindung wie „sie flohen eine Flucht“; gemeint ist eine völlige, überstürzte Flucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ רָאִיתִי
  choice: Warum sehe ich das?
  rationale: Die Frage gibt den bestürzten, unmittelbar vergegenwärtigenden Charakter der prophetischen Schau wieder. Das hebräische Perfekt wird im Deutschen idiomatisch als anschauliche Gegenwart wiedergegeben.
- source_word: הֵמָּה חַתִּים
  choice: Sie sind bestürzt
  rationale: חַתִּים bezeichnet hier im militärischen Zusammenhang inneres Gebrochensein, Entsetzen oder Mutlosigkeit. „Bestürzt“ wahrt diese Bedeutungsbreite besser als eine rein körperliche Deutung.
- source_word: נְסֹגִים אָחוֹר
  choice: weichen zurück
  rationale: Die partizipiale Wendung beschreibt den sichtbaren Rückzug; „zurückweichen“ ist natürliches, prägnantes Deutsch.
- source_word: גִבּוֹרֵיהֶם
  choice: ihre Krieger
  rationale: גִּבּוֹרִים meint im militärischen Kontext kampfstarke Männer oder Helden; „Krieger“ ist gegenwärtig verständlich und sachgerecht.
- source_word: יֻכַּתּוּ
  choice: werden zerschlagen
  rationale: Das Passiv bezeichnet, dass die Krieger geschlagen und vernichtend besiegt werden. Die deutsche Form bewahrt sowohl das Passiv als auch die militärische Wucht.
- source_word: וּמָנוֹס נָסוּ
  choice: in wilder Flucht fliehen sie
  rationale: Das Hebräische verstärkt das Verb durch ein stammverwandtes Substantiv. Die deutsche Wendung erhält die eindringliche Wiederholung und macht zugleich die vollständige Flucht deutlich.
- source_word: וְלֹא הִפְנוּ
  choice: ohne sich umzuwenden
  rationale: Die Form kann das Sich-Umdrehen, Zurückblicken oder erneute Frontmachen bezeichnen. Die Übersetzung lässt diese im Kontext echte Mehrdeutigkeit bestehen.
- source_word: מָגוֹר מִסָּבִיב
  choice: Schrecken ringsum!
  rationale: Die knappe nominale Formel, die bei Jeremia wiederkehrt, wird ebenso knapp und eindringlich wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: so lautet der Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird würdevoll und als göttliche Bekräftigung wiedergegeben; der Gottesname erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen im modernen Standarddeutsch unmittelbar wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Mehrdeutigkeit von וְלֹא הִפְנוּ
  choice: ohne sich umzuwenden
  alternative: ohne zurückzublicken / ohne erneut Front zu machen
  rationale: Der Kontext erlaubt sowohl das fehlende Zurückblicken während der Flucht als auch das Ausbleiben einer erneuten Wendung gegen den Feind. Die Hauptübersetzung entscheidet diese Spannung nicht unnötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, eindringlichen Sätzen. Der militärische Zusammenbruch wird anschaulich, aber nicht unnötig paraphrasierend wiedergegeben. Die wiederkehrende Jeremia-Formel „Schrecken ringsum“ bleibt prägnant erhalten.
