  variant: modern standard German
source:
  edition: WLC
  text: כָּרְת֤וּ יַעְרָ/הּ֙ נְאֻם יְהוָ֔ה כִּ֖י לֹ֣א יֵֽחָקֵ֑ר כִּ֤י רַבּוּ֙ מֵֽ/אַרְבֶּ֔ה וְ/אֵ֥ין לָ/הֶ֖ם מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
translation:
  language: de
  text: „Sie haben ihren Wald gefällt“, spricht Jahwe, „obwohl[a] er nicht zu durchforschen ist; denn sie sind zahlreicher als Heuschrecken und nicht zu zählen.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn er ist nicht zu durchforschen“. Die hebräische Konjunktion kann hier begründend („denn/weil“) oder einräumend („obwohl“) verstanden werden; im Haupttext steht die einräumende Lesart, weil sie im Zusammenhang besser passt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְתוּ
  choice: Sie haben … gefällt
  rationale: Das Qal Perfekt 3. Person Plural beschreibt das Fällen des sinnbildlichen Waldes Ägyptens als vollzogene oder gewiss eintretende Handlung. Das deutsche Perfekt gibt diesen Aspekt natürlich wieder.
- source_word: יַעְרָהּ
  choice: ihren Wald
  rationale: יַעַר bezeichnet einen Wald oder ein Waldgebiet. Das feminine Suffix bezieht sich auf das im Zusammenhang weiblich personifizierte Ägypten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Charakter der Wendung; der Gottesname wird als Jahwe wiedergegeben.
- source_word: כִּי לֹא יֵחָקֵר
  choice: obwohl er nicht zu durchforschen ist
  rationale: Das Nifal von חקר bezeichnet hier etwas, das nicht erforscht, durchsucht oder in seiner Ausdehnung erfasst werden kann. „Zu durchforschen“ wahrt das Passiv und passt zum Bild eines dichten, unüberschaubaren Waldes.
- source_word: רַבּוּ מֵאַרְבֶּה
  choice: sie sind zahlreicher als Heuschrecken
  rationale: Das Perfekt von רבה bezeichnet die überwältigende Menge der Angreifer; אַרְבֶּה ruft das Bild eines zerstörerischen Heuschreckenschwarms hervor.
- source_word: וְאֵין לָהֶם מִסְפָּר
  choice: und nicht zu zählen
  rationale: Die knappe deutsche Wendung gibt die hebräische Aussage „für sie gibt es keine Zahl“ idiomatisch und sinngenau wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ ist die im Deutschen gebräuchliche Form seiner wissenschaftlich begründeten Aussprache und ersetzt ihn nicht durch einen Titel.
- issue: Bezug des Waldbildes
  choice: Der Wald gehört zum weiblich personifizierten Ägypten; die zahllose Menge sind die Angreifer.
  alternative: Den Wald oder die zahllose Menge ausdrücklich mit einem bestimmten gesellschaftlichen oder militärischen Teil Ägyptens gleichsetzen.
  rationale: Der Vers lässt die genaue Entsprechung des Bildes offen. Die Übersetzung wahrt diese Bildhaftigkeit, ohne eine weitergehende theologische oder historische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild vom Wald und den Heuschrecken bleibt erhalten; die etwas spannungsvolle Aussage über den undurchforschlichen Wald wird nicht erklärend aufgelöst.
