source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַחֲרֵ֨י עֲשׂוֹתָ֧/הּ אֶת כָּל אֵ֛לֶּה אֵלַ֥/י תָּשׁ֖וּב וְ/לֹא שָׁ֑בָה ו/תראה בָּגוֹדָ֥ה אֲחוֹתָ֖/הּ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
translation:
  language: de
  text: 'Da sagte ich: »Nachdem sie dies alles getan hatte, wird sie zu mir zurückkehren[a].« Aber sie kehrte nicht zurück[b]. Das sah ihre treulose[c] Schwester Juda.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „würde sie zu mir zurückkehren“. Das hebräische Imperfekt kann eine von einem vergangenen Zeitpunkt aus erwartete Zukunft bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Zurückkehren“ kann auch mit „umkehren“ wiedergegeben werden und bezeichnet im Bundeszusammenhang zugleich die Hinwendung zu Gott.
    reason: lexical_alternative
  - marker: c
    text: Für „treulos“ ist auch „verräterisch“ oder „untreu“ möglich; das hebräische Wort hebt den Bruch von Loyalität hervor.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Da sagte ich
  rationale: Der Wayyiqtol führt die Äußerung des HERRN im fortlaufenden Rückblick ein. „Da sagte ich“ bildet den erzählerischen Anschluss im Deutschen natürlich ab.
- source_word: אַחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  choice: Nachdem sie dies alles getan hatte
  rationale: Die Präposition mit Infinitivus constructus und Suffix wird als natürlicher temporaler Nebensatz wiedergegeben; das Plusquamperfekt macht die Vorzeitigkeit deutlich.
- source_word: אֵלַי תָּשׁוּב
  choice: wird sie zu mir zurückkehren
  rationale: שׁוב bezeichnet hier die Rückkehr zu Gott und kann zugleich den Bundesruf zur Umkehr anklingen lassen. „Zurückkehren“ wahrt beide Ebenen, ohne ausschließlich „Buße tun“ festzulegen.
- source_word: וְלֹא שָׁבָה
  choice: Aber sie kehrte nicht zurück
  rationale: Die kontrastive Wiedergabe und die Wiederholung von „zurückkehren“ erhalten das Wortspiel und das zentrale Motiv des hebräischen Textes.
- source_word: וַתֵּרֶא
  choice: Das sah
  rationale: Das vorangestellte „Das“ nimmt im Deutschen natürlich den gesamten vorausgehenden Sachverhalt als implizites Objekt auf.
- source_word: בָּגוֹדָה
  choice: treulose
  rationale: Das von בגד abgeleitete Adjektiv bezeichnet illoyales, vertrags- bzw. bundesbrüchiges Verhalten. „Treulos“ ist im modernen Deutschen klar und würdig; „verräterisch“ wäre schärfer, wirkt hier aber weniger idiomatisch.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: ihre treulose Schwester Juda
  rationale: Die Wiedergabe bewahrt das prophetische Familienbild und ordnet das Adjektiv natürlich in die deutsche Nominalgruppe ein.
theological_decisions:
- issue: Bundestheologischer Sinn von שׁוּב
  choice: zu mir zurückkehren
  alternative: zu mir umkehren / Buße tun
  rationale: „Zurückkehren“ lässt sowohl die bildhafte Bewegung als auch die geistliche und bundesbezogene Umkehr erkennen, ohne die Mehrdeutigkeit auf einen theologischen Fachausdruck zu verengen.
- issue: Charakterisierung Judas durch בָּגוֹדָה
  choice: treulose Schwester Juda
  alternative: verräterische Schwester Juda / untreue Schwester Juda
  rationale: „Treulos“ bewahrt den Gedanken des Beziehungs- und Bundesbruchs. Die Alternative „verräterisch“ hebt den aktiven Verrat stärker hervor, klingt im Deutschen als attributive Personenbezeichnung jedoch härter.
- issue: Zeitwert des Imperfekts תָּשׁוּב nach vergangenem Redeeinleiter
  choice: wird sie zu mir zurückkehren
  alternative: sie würde zu mir zurückkehren
  rationale: Das hebräische Imperfekt kann eine aus damaliger Perspektive erwartete Zukunft ausdrücken. Die direkte Rede mit „wird“ erhält die lebendige Erwartung; „würde“ ist als deutsche Perspektivverschiebung ebenfalls möglich.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die direkte Rede bewahrt die Erwartung des Sprechers; die zweimalige Verwendung von „zurückkehren“ erhält die hebräische Wiederholung. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
