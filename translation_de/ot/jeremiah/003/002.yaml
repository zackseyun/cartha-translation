source:
  edition: WLC
  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
translation:
  language: de
  text: 'Erhebe deine Augen zu den kahlen Höhen und sieh: Wo hat man nicht mit dir geschlafen?[a] An den Wegen saßt du und wartetest auf sie, wie ein Araber in der Wüste[b], und du hast das Land durch deine Hurerei und dein Böses entweiht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische verwendet ein derbes sexuelles Verb; „mit dir geschlafen“ gibt es im Deutschen etwas abgeschwächt wieder. Im Bild ist Judas Untreue gegenüber Gott gemeint; Gewalt oder Zwang werden durch das Verb nicht eindeutig ausgesagt.
    reason: lexical_alternative
  - marker: b
    text: Der Vergleich ruft wahrscheinlich jemanden vor Augen, der an Wüstenwegen auf Reisende lauert. Im Mittelpunkt steht das absichtliche Warten, nicht die ethnische Zugehörigkeit.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  choice: Erhebe deine Augen
  rationale: Die feminine Singularform des Imperativs richtet sich an Juda; die hebräische Wendung wird in natürlichem, gehobenem Deutsch bewahrt.
- source_word: שְׁפָיִם
  choice: die kahlen Höhen
  rationale: Bezeichnet unbewachsene Anhöhen und lässt zugleich die mögliche Verbindung mit Orten unerlaubter Verehrung anklingen, ohne sie ausdrücklich einzutragen.
- source_word: שגלת
  choice: hat man ... mit dir geschlafen
  rationale: Das grobe sexuelle Verb wird deutlich wiedergegeben, ohne die im Hebräischen nicht eindeutig ausgesagte Vorstellung von Gewalt oder Zwang einzuführen. Die unbestimmte aktive Form ist im Deutschen natürlicher als eine passive Konstruktion.
- source_word: עַל דְּרָכִים יָשַׁבְתְּ לָהֶם
  choice: An den Wegen saßest du und wartetest auf sie
  rationale: Das Dativpronomen bezeichnet hier sinngemäß die Personen, auf die sie wartete; diese Ergänzung ist für verständliches Deutsch erforderlich.
- source_word: כַּעֲרָבִי בַּמִּדְבָּר
  choice: wie ein Araber in der Wüste
  rationale: Bewahrt die naheliegende ethnisch-geografische Bezeichnung und den Wüstenvergleich; die gemeinte Wachsamkeit beziehungsweise das Auflauern wird in einer Fußnote erläutert.
- source_word: וַתַּחֲנִיפִי אֶרֶץ
  choice: So hast du das Land entweiht
  rationale: Der Hifil von חנף bezeichnet moralische Verunreinigung oder Entweihung. „Entweiht“ passt zum Bundes- und Landkontext und vermeidet einen primär ökologischen Klang.
- source_word: בִּזְנוּתַיִךְ
  choice: durch deine Hurerei
  rationale: Die drastische sexuelle Metapher wird in würdigem, aber ungeschöntem prophetischem Deutsch erhalten.
- source_word: וּבְרָעָתֵךְ
  choice: und durch deine Bosheit
  rationale: Gibt den allgemeinen moralischen Begriff רעה mit angemessenem Gewicht wieder.
theological_decisions:
- issue: Sexuelle prophetische Metapher für Bundesuntreue und Götzendienst
  choice: Die sexuelle Bildsprache bleibt im Haupttext ausdrücklich erhalten.
  alternative: Die Metapher unmittelbar als „Götzendienst“ oder „Untreue“ aufzulösen.
  rationale: Der hebräische Text setzt bewusst anstößige sexuelle Sprache ein. Eine rein deutende Wiedergabe würde die prophetische Wirkung abschwächen und die Bildsprache vorzeitig festlegen.
- issue: Mögliche Gewaltkonnotation von שגלת
  choice: Keine Gewalt oder Vergewaltigung ausdrücklich behaupten.
  alternative: „Wo bist du nicht geschändet/vergewaltigt worden?“
  rationale: Das Verb ist grob und entwürdigend, bezeichnet hier jedoch den Geschlechtsakt, ohne Zwang eindeutig auszudrücken. Der Zusammenhang schildert zudem Judas bewusstes Warten, sodass eine ausdrückliche Gewaltlesart die Spannung einseitig auflösen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener prophetischer Schärfe. „Saßest“ wahrt den gehobenen biblischen Ton, bleibt aber verständlich. Die Anrede ist durchgehend feminin Singular, entsprechend der Personifikation Judas.
