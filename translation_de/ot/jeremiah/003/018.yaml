id: JER.3.18
reference: Jeremiah 3:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
translation:
  language: de
  text: In jenen Tagen wird das Haus Juda mit dem Haus Israel ziehen[a], und gemeinsam werden sie aus dem Land des Nordens in das Land kommen, das ich euren Vätern zum Erbbesitz gegeben habe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird das Haus Juda zum Haus Israel ziehen“. Die hebräische Präposition kann eine Bewegung auf Israel zu ausdrücken; im Zusammenhang ist wahrscheinlich gemeint, dass Juda sich Israel in wiederhergestellter Einheit anschließt.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „euren Vorfahren“. Wörtlich: „euren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  choice: In jenen Tagen
  rationale: Bewahrt die geläufige prophetische Zeitformel und klingt im modernen Standarddeutsch würdig und natürlich.
- source_word: יֵלְכוּ ... עַל בֵּית יִשְׂרָאֵל
  choice: wird ... mit dem Haus Israel ziehen
  rationale: הלך bezeichnet ein Gehen oder Ziehen. Im Zusammenhang mit יַחְדָּו und der Wiederherstellung der beiden Häuser gibt „mit ... ziehen“ die wahrscheinliche Verbindung wieder, ohne die ungewöhnliche Präposition עַל zu verschweigen; die formnähere Alternative steht in der Fußnote.
- source_word: בֵית יְהוּדָה / בֵית יִשְׂרָאֵל
  choice: das Haus Juda / das Haus Israel
  rationale: Erhält die korporative Ausdrucksweise des hebräischen Textes und ihre Bedeutung im prophetischen Zusammenhang.
- source_word: וְיָבֹאוּ יַחְדָּו
  choice: und gemeinsam werden sie ... kommen
  rationale: Gibt sowohl das Kommen als auch die ausdrücklich betonte Gemeinsamkeit wieder und vermeidet die im Deutschen mögliche Mehrdeutigkeit von „zusammenkommen“.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: aus dem Land des Nordens
  rationale: Bewahrt das geografisch-prophetische Motiv in einer formnahen und verständlichen Wendung.
- source_word: עַל הָאָרֶץ
  choice: in das Land
  rationale: Bei einer Bewegung auf ein Ziel hin ist „in das Land“ im Deutschen natürlich und kontextgerecht.
- source_word: אֲשֶׁר הִנְחַלְתִּי
  choice: das ich ... zum Erbbesitz gegeben habe
  rationale: Gibt den Hifil von נחל als Gewährung eines erblichen Besitzes wieder und erhält sowohl den Geschenk- als auch den Erbaspekt.
- source_word: אֶת אֲבוֹתֵיכֶם
  choice: euren Vätern
  rationale: Entspricht der ausdrücklich maskulinen Pluralform des Hebräischen; „euren Vorfahren“ wird als verständliche Bedeutungsalternative vermerkt.
theological_decisions:
- issue: Wiedervereinigung von Juda und Israel
  choice: Juda zieht mit Israel
  alternative: Juda zieht zu Israel
  rationale: Der Zusammenhang der Wiederherstellung und das folgende „gemeinsam“ sprechen für eine vereinte Bewegung der zuvor getrennten Häuser. Da עַל jedoch formal auch eine Zielrichtung ausdrücken kann, bleibt diese Lesart in einer Fußnote sichtbar.
- issue: Wiedergabe von אֲבוֹתֵיכֶם
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Die Hauptfassung bewahrt die grammatisch maskuline und traditionsgeschichtlich konkrete Form des Ausgangstextes; die Alternative verdeutlicht den möglichen umfassenderen Bezug auf frühere Generationen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Bildsprache. „Ziehen“ ist hier natürlicher als „gehen“ und passt zur gemeinsamen Rückkehr aus dem Exil. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Textstelle.
