  naturalness: Der Text hat einen würdigen, modernen Ton. „deine Wege unter Fremden zerstreut“ ist im Deutschen jedoch semantisch und bildlich schwer nachvollziehbar. „deine Wege zu Fremden hin verstreut“ ist zwar bewusst bildhaft, bildet die hebräische Konstruktion aber klarer ab.
  terminology: „Jahwe“, „Schuld“, „sich gegen ... auflehnen“ und „Ausspruch Jahwes“ sind angemessen. „Fremden“ bewahrt die Mehrdeutigkeit des hebräischen Ausdrucks und ergänzt nicht „Götter“.
