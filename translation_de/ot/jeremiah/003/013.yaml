  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
translation:
  language: de
  text: 'Erkenne nur deine Schuld an[a]: Du hast dich gegen Jahwe, deinen Gott, aufgelehnt und deine Wege zu Fremden hin verstreut, unter jedem grünen Baum. Auf meine Stimme habt ihr nicht gehört[b] – Ausspruch Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Erkenne nur deine Schuld.« Gemeint ist, die eigene Schuld zu erkennen und einzugestehen.'
    reason: translation_note
  - marker: b
    text: Der hebräische Text wechselt hier unvermittelt von »du« zur Mehrzahl »ihr«. »Auf meine Stimme hören« bedeutet zugleich, ihr zu gehorchen.
    reason: textual_and_idiom_note
lexical_decisions:
- source_word: אַךְ דְּעִי עֲוֺנֵךְ
  choice: Erkenne nur deine Schuld an
  rationale: אַךְ bündelt die Aufforderung auf das Entscheidende; ידע mit עָוֹן bedeutet hier nicht bloß wissen, sondern Schuld erkennen und eingestehen. „Schuld“ bewahrt den moralischen und forensischen Bedeutungsumfang von עָוֹן.
- source_word: כִּי בַּיהוָה אֱלֹהַיִךְ פָּשָׁעַתְּ
  choice: Du hast dich gegen Jahwe, deinen Gott, aufgelehnt
  rationale: פשע bezeichnet hier den trotzigen Bruch mit der rechtmäßigen Autorität. Die Präposition ב ist bei diesem Verb adversativ. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַתְּפַזְּרִי אֶת דְּרָכַיִךְ לַזָּרִים
  choice: und deine Wege unter Fremden zerstreut
  rationale: Die ungewöhnliche Bildsprache des Hebräischen bleibt erhalten. זָרִים bezeichnet wörtlich Fremde; der Text nennt nicht ausdrücklich fremde Götter. „Unter“ ergibt im Deutschen zusammen mit „zerstreut“ eine natürliche räumliche Metapher.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: unter jedem grünen Baum
  rationale: Die wiederkehrende prophetische Wendung wird formal bewahrt; רַעֲנָן bezeichnet einen grünen, üppig belaubten Baum.
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  choice: Auf meine Stimme aber habt ihr nicht gehört
  rationale: Die hebräische Hörensformel bleibt sichtbar und schließt Gehorsam sinngemäß ein. Der Wechsel von der femininen Einzahl zur Mehrzahl wird im Deutschen ausdrücklich erhalten.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben, ohne sie zu einer gewöhnlichen Redeeinleitung abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung von לַזָּרִים
  choice: unter Fremden
  alternative: fremden Göttern
  rationale: Der Zusammenhang verbindet Ehebruchs- und Götzendienstmetaphorik, doch das hebräische Wort nennt nur „Fremde“. Die Hauptfassung bewahrt diese Mehrdeutigkeit.
- issue: Numeruswechsel in שְׁמַעְתֶּם
  choice: habt ihr nicht gehört
  alternative: hast du nicht gehört
  rationale: Der masoretische Text wechselt unerwartet von der Anrede Judas in der femininen Einzahl zur zweiten Person Mehrzahl. Diese textlich und rhetorisch bedeutsame Spannung wird nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Einzelanrede ist im Deutschen formal nicht erkennbar, der anschließende Wechsel zur Mehrzahl dagegen schon. Die Interpunktion gliedert Schuldanerkenntnis, Begründung und Gotteswortformel klar; die Metaphorik von Wegen, Fremden und grünen Bäumen bleibt bewusst offen.
