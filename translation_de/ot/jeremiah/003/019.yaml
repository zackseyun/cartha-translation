source:
  edition: WLC
  text: וְ/אָנֹכִ֣י אָמַ֗רְתִּי אֵ֚יךְ אֲשִׁיתֵ֣/ךְ בַּ/בָּנִ֔ים וְ/אֶתֶּן לָ/ךְ֙ אֶ֣רֶץ חֶמְדָּ֔ה נַחֲלַ֥ת צְבִ֖י צִבְא֣וֹת גּוֹיִ֑ם וָ/אֹמַ֗ר אָבִ/י֙ תקראו לִ֔/י וּ/מֵ/אַחֲרַ֖/י לֹ֥א תשובו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
translation:
  language: de
  text: 'Und ich sagte: »Wie wollte ich dich doch unter die Söhne[a] stellen und dir ein begehrenswertes Land geben, ein herrliches Erbe unter den Völkerscharen[b]!« Und ich sagte: »Ihr werdet mich ›Mein Vater‹ nennen und euch nicht davon abwenden, mir zu folgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder allgemeiner: »unter die Kinder«; im Hebräischen steht wörtlich »unter die Söhne«.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wortfolge ist schwierig. Möglich sind auch: »das prächtigste Erbe der Nationen« oder »ein herrliches Erbe unter den Nationen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie wollte ich dich doch
  rationale: אֵיךְ leitet hier eine erwägende oder ausrufende Äußerung ein. Die Formulierung gibt den rückblickend ausgesprochenen göttlichen Vorsatz wieder, ohne die Wendung eindeutig als bloße Frage oder als Unmöglichkeit festzulegen.
- source_word: אֲשִׁיתֵךְ בַּבָּנִים
  choice: dich unter die Söhne stellen
  rationale: שׁית bedeutet „stellen, setzen“; בַּבָּנִים heißt wörtlich „unter die Söhne“. Das feminine Singularobjekt „dich“ bezeichnet die als Frau personifizierte Gemeinschaft, die unter die Söhne gestellt werden soll.
- source_word: אֶרֶץ חֶמְדָּה
  choice: ein begehrenswertes Land
  rationale: חֶמְדָּה bezeichnet etwas Begehrenswertes, Kostbares oder Erfreuliches. „Begehrenswert“ bewahrt diesen Bedeutungsumfang und den feierlichen Klang.
- source_word: נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: ein herrliches Erbe unter den Völkerscharen
  rationale: Die stark verdichtete hebräische Wortfolge verbindet „Erbe“, „Herrlichkeit/Pracht“, „Scharen/Heere“ und „Nationen“. Die Übersetzung bleibt diesen Bestandteilen nahe, vermeidet aber das im Deutschen irreführend militärische „Armeen“; die syntaktische Unsicherheit wird in einer Fußnote offengelegt.
- source_word: אָבִי תקראו לִי
  choice: Ihr werdet mich ›Mein Vater‹ nennen
  rationale: קרא mit ל kann „jemanden nennen“ oder „zu jemandem rufen“ bedeuten. Im Zusammenhang der Sohnschaft ist die direkte Anrede „Mein Vater“ am natürlichsten. Der Plural des Qere wird im Deutschen mit „ihr“ sichtbar gemacht.
- source_word: וּמֵאַחֲרַי לֹא תשובו
  choice: und euch nicht davon abwenden, mir zu folgen
  rationale: Die Wendung „von hinter mir weg umkehren“ bezeichnet das Aufhören, jemandem zu folgen. Die deutsche Fassung gibt das Bild verständlich und mit dem im Qere stehenden Plural wieder.
theological_decisions:
- issue: Geschlechtsspezifische Sohnesbezeichnung in בַּבָּנִים
  choice: unter die Söhne
  alternative: unter die Kinder
  rationale: Der hebräische Text verwendet ausdrücklich das maskuline Pluralwort „Söhne“. Die Hauptfassung bewahrt daher die geschlechtlich markierte Sohnes- und Zugehörigkeitsmetaphorik; die mögliche weitere Bedeutung „Kinder“ wird in der Fußnote genannt.
- issue: Deutung von נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם
  choice: ein herrliches Erbe unter den Völkerscharen
  alternative: das prächtigste Erbe der Nationen / ein herrliches Erbe unter den Nationen
  rationale: Die Syntax der Wortfolge ist schwierig und lässt offen, wie „Herrlichkeit“, „Scharen“ und „Nationen“ genau aufeinander zu beziehen sind. Die Hauptfassung bietet eine lesbare, quellennah bleibende Wiedergabe; die Fußnote bewahrt die echten Alternativen.
- issue: Wechsel von der femininen Einzahl zum maskulinen Plural
  choice: dich … Ihr … euch
  alternative: durchgehend „dich/du“ als kollektive Anrede
  rationale: Der masoretische Text spricht die personifizierte Gemeinschaft zunächst in der femininen Einzahl an, verwendet in den beiden folgenden Verben nach dem Qere jedoch den Plural. Dieser grammatische Wechsel bleibt sichtbar, ohne ihn theologisch zu harmonisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Völkerscharen“ hält die Bestandteile der schwierigen hebräischen Wendung erkennbar, ohne unnötig militärisch zu klingen. Die Anführungszeichen unterscheiden Gottes Rede und die darin enthaltene Anrede „Mein Vater“ klar.
