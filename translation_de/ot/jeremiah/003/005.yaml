base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
translation:
  language: de
  text: Wird er für immer zornig bleiben? Wird er daran auf ewig festhalten?[a] Sieh, das hast du gesagt[b], und du hast böse Taten begangen und dich durchgesetzt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wird er den Groll für immer bewahren? Wird er ihn auf ewig hüten?“'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräischen Konsonanten können auch als „ich habe gesprochen“ gelesen werden; der Zusammenhang spricht dafür, Judas eigene Worte aufzugreifen: „du hast gesagt“.'
    reason: textual_variant
  - marker: c
    text: 'Oder: „und du hast es vermocht“. Gemeint kann sein, dass Juda im Bösen beharrte und damit Erfolg hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר לְעוֹלָם
  choice: Wird er für immer zornig bleiben?
  rationale: נטר bezeichnet hier das Festhalten an Zorn oder Groll. Die Wiedergabe formuliert die rhetorische Frage in natürlichem Deutsch; die wörtlichere Vorstellung des Bewahrens wird in der Fußnote erhalten.
- source_word: אִם יִשְׁמֹר לָנֶצַח
  choice: Wird er daran auf ewig festhalten?
  rationale: שׁמר bedeutet wörtlich „bewahren, hüten“. Im Parallelismus ist Zorn beziehungsweise Groll als Objekt mitgedacht. „Daran festhalten“ bewahrt diesen Sinn, ohne im Deutschen ein unnatürliches Objekt einzuführen.
- source_word: הִנֵּה
  choice: Sieh
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf den Gegensatz zwischen Judas Worten und Taten. „Sieh“ ist gegenwärtig, würdig und nicht altertümlich.
- source_word: דברתי
  choice: so hast du geredet
  rationale: Im Zusammenhang wird Juda direkt angesprochen, und der Satz greift ihre Worte aus dem vorhergehenden Vers auf. Die Konsonanten lassen jedoch auch die Lesung „ich habe geredet“ zu; diese Unsicherheit wird in einer Fußnote ausgewiesen.
- source_word: וַתַּעֲשִׂי הָרָעוֹת
  choice: und du hast die bösen Taten begangen
  rationale: Der bestimmte Plural bezeichnet konkrete böse Handlungen. „Die bösen Taten begangen“ ist idiomatischer als „die bösen Dinge getan“ und erhält Artikel und Plural.
- source_word: וַתּוּכָל
  choice: und dich durchgesetzt
  rationale: יכל kann „fähig sein, vermögen“ oder „sich durchsetzen, Erfolg haben“ bedeuten. „Dich durchgesetzt“ gibt hier die erschreckende erfolgreiche Beharrlichkeit im Bösen wieder, ohne die lexikalische Alternative zu verschweigen.
theological_decisions:
- issue: Sprecher- und Adressatenwechsel bei דברתי
  choice: 'Die Schlussanklage wird vollständig als direkte Anrede an Juda verstanden: „du hast geredet … du hast … begangen … dich durchgesetzt“.'
  alternative: דברתי als „ich habe geredet“ lesen und damit den Sprecher innerhalb des Satzes wechseln lassen.
  rationale: Der unmittelbare Zusammenhang greift Judas eigene Worte auf und stellt ihnen ihre Taten gegenüber. Da die Konsonantenform dennoch eine andere Lesung ermöglicht, wird diese nicht dogmatisch ausgeschlossen, sondern in der Fußnote genannt.
- issue: Bedeutung von וַתּוּכָל
  choice: „und dich durchgesetzt“
  alternative: „und du hast es vermocht“ beziehungsweise „und du konntest es“
  rationale: Die gewählte Fassung hält die Spannung fest, dass Juda im Tun des Bösen erfolgreich beziehungsweise ungehindert war. Die formalere Fähigkeitslesung bleibt als echte lexikalische Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden rhetorischen Fragen sind idiomatisch formuliert, während eine Fußnote die konkrete hebräische Bildsprache des Bewahrens und Hütens von Groll erhält. Die Anrede bleibt durchgehend feminin-singular auf Juda bezogen, was im Deutschen formal nicht eigens markiert werden kann.
