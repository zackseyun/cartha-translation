  source_fidelity: Die beiden Fragen geben den Parallelismus von נטר („Zorn/Groll bewahren“) und שמר („bewahren/hüten“) sachgerecht wieder; die implizite Bezugsgröße wird im Deutschen angemessen durch „daran“ aufgenommen und in Fußnote a erläutert. Die direkte feminine Singularanrede an Juda in der Schlusszeile ist kontextuell und textlich gut begründet. „So hast du geredet“ ist jedoch im Deutschen semantisch unnötig auf die Art des Redens festgelegt; „das hast du gesagt“ nimmt natürlicher auf die Worte des vorherigen Verses Bezug. Die einfachen hebräischen Verknüpfungen werden mit „und“ beibehalten.
  naturalness: Die Fragen sind modernes, würdiges Standarddeutsch. „Sieh, das hast du gesagt“ ist idiomatischer und klarer als „Sieh, so hast du geredet“. Bei der Fußnote zur abweichenden Lesung ist die Konstruktion „als … gelesen werden“ erforderlich. „Böse Taten begangen“ bewahrt Plural und konkrete Handlungen, ohne den im Deutschen hier unnatürlichen bestimmten Artikel zu erzwingen.
  terminology: „zornig bleiben“, „festhalten“, „böse Taten“ und „sich durchsetzen“ sind terminologisch vertretbar. Die Fußnoten bewahren sowohl die konkretere Bildsprache von Bewahren/Hüten als auch die textliche Alternative bei דברתי und die Fähigkeitsnuance von ותוכל, ohne eine konfessionelle Deutung vorzugeben.
