  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָה֙ מִ/קֹּ֣ל זְנוּתָ֔/הּ וַ/תֶּחֱנַ֖ף אֶת הָ/אָ֑רֶץ וַ/תִּנְאַ֥ף אֶת הָ/אֶ֖בֶן וְ/אֶת הָ/עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
translation:
  language: de
  text: Weil ihre Hurerei weithin Aufsehen erregte[a], entweihte sie das Land und beging Ehebruch mit Stein und Holz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »wegen des Lärms/der Kunde von ihrer Hurerei«. Die hebräische Wendung ist schwierig. Möglich ist auch: »wegen der Leichtfertigkeit ihrer Hurerei«.'
    reason: lexical_alternative
  - marker: b
    text: »Stein und Holz« bezeichnet hier Götzenbilder, die aus diesen Materialien gefertigt waren.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל
  choice: weil … weithin Aufsehen erregte
  rationale: קוֹל bedeutet wörtlich »Stimme, Klang, Lärm« und kann auch auf Kunde oder öffentliches Bekanntwerden weisen. Die Formulierung gibt den wahrscheinlichen Gedanken der weithin bekannt gewordenen Hurerei in natürlichem Deutsch wieder, ohne die schwierige Wendung als eindeutig auszugeben.
- source_word: זְנוּתָהּ
  choice: ihre Hurerei
  rationale: »Hurerei« bewahrt die bewusst anstößige sexuelle Metapher des prophetischen Textes für Götzendienst und Bundesbruch. »Prostitution« könnte im heutigen Deutsch zu eng an gewerbsmäßige sexuelle Handlungen denken lassen.
- source_word: וַתֶּחֱנַף
  choice: entweihte sie
  rationale: חנף bezeichnet hier, mit dem Land als Objekt, dessen religiös-sittliche Verunreinigung oder Entheiligung. »Entweihen« passt zum Zusammenhang des Götzendienstes.
- source_word: הָאָרֶץ
  choice: das Land
  rationale: Gemeint ist im Zusammenhang sehr wahrscheinlich das Bundesland Juda beziehungsweise Israel, nicht die gesamte Erde.
- source_word: וַתִּנְאַף
  choice: beging Ehebruch
  rationale: נאף ist das übliche Wort für Ehebruch und führt die Metapher ehelicher beziehungsweise bundesbezogener Untreue ausdrücklich fort.
- source_word: אֶת־הָאֶבֶן וְאֶת־הָעֵץ
  choice: mit Stein und Holz
  rationale: Die wörtlich genannten Materialien stehen als Metonymie für daraus gefertigte Götzenbilder. Die knappe Form bewahrt die Schärfe des hebräischen Ausdrucks.
theological_decisions:
- issue: Sexuelle Metapher für Götzendienst und Bundesbruch
  choice: Die Bilder von Hurerei und Ehebruch bleiben im Haupttext erhalten.
  alternative: Die Bildsprache zu allgemeiner Untreue oder Abfall abschwächen.
  rationale: Jeremia verwendet bewusst sexuelle und eheliche Sprache, um den Bundesbruch durch Götzendienst darzustellen. Eine Abschwächung würde die theologische Spannung und rhetorische Härte des Ausgangstextes mindern.
- issue: Bezug von »Stein und Holz«
  choice: Die Materialien werden im Haupttext ohne den Zusatz »Götzen« genannt und in einer Fußnote erklärt.
  alternative: »mit Götzen aus Stein und Holz«
  rationale: Der hebräische Text lässt die Götzen nur mittelbar durch ihre Materialien erkennen. Diese Metonymie soll im Haupttext erhalten bleiben.
- issue: Deutung der schwierigen Wendung מִקּוֹל זְנוּתָהּ
  choice: Der Haupttext versteht קוֹל im Sinn von öffentlichem Aufsehen beziehungsweise weithin verbreiteter Kunde.
  alternative: »wegen der Leichtfertigkeit ihrer Hurerei« oder wörtlicher »wegen des Lärms ihrer Hurerei«
  rationale: Die hebräische Wendung ist schwierig und lässt mehrere Deutungen zu. Der Haupttext bietet eine kontextuell plausible, lesbare Fassung; die Fußnote bewahrt die anderen ernsthaften Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Härte. Die schwierige hebräische Wendung wird im Haupttext lesbar wiedergegeben, während die Fußnote ihre echte Mehrdeutigkeit offenhält.
