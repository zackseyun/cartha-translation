  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
translation:
  language: de
  text: Kehrt zurück, ihr abtrünnigen Kinder[a]! Ich werde eure Abtrünnigkeiten[b] heilen. Siehe, wir kommen zu dir, denn du bist Jahwe, unser Gott.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „abtrünnige Söhne“. Möglich ist auch: „eigensinnige“ oder „treulose Kinder“. Im Hebräischen sind „kehrt zurück“, „abtrünnig“ und „Abtrünnigkeiten“ sprachlich eng miteinander verbunden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „eure Abkehr“ oder „euer Abweichen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Kehrt zurück
  rationale: Der pluralische Imperativ von שוב ruft zur Rückkehr zu Gott auf. „Kehrt zurück“ bewahrt sowohl die räumlich-beziehungsbezogene Bildsprache als auch den Anklang an die weiteren Wörter derselben Bedeutungsfamilie.
- source_word: בָּנִים שׁוֹבָבִים
  choice: ihr abtrünnigen Kinder
  rationale: בָּנִים kann in der gemeinschaftlichen Anrede „Kinder“ bezeichnen; שׁוֹבָבִים beschreibt Menschen, die sich abgewandt haben. „Abtrünnig“ gibt den ernsten Bundesbruch wieder, ohne die Aussage auf eine bestimmte dogmatische Kategorie festzulegen.
- source_word: אֶרְפָּה
  choice: Ich werde … heilen
  rationale: Die Form von רפא bedeutet „heilen“. Die konkrete Metapher der Wiederherstellung bleibt erhalten.
- source_word: מְשׁוּבֹתֵיכֶם
  choice: eure Abtrünnigkeit
  rationale: Das Substantiv bezeichnet das Abweichen beziehungsweise die Abkehr. Der deutsche Singular als Sammelbegriff klingt natürlicher, während die Fußnote auf weitere mögliche Wiedergaben hinweist.
- source_word: הִנְנוּ אָתָנוּ לָךְ
  choice: Siehe, wir kommen zu dir
  rationale: הִנְנוּ leitet nachdrücklich die Antwort des Volkes ein; אָתָנוּ לָךְ bezeichnet sein Kommen zu Gott. Die Gegenwartsform vermittelt die unmittelbare Antwort im Deutschen natürlich.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der persönliche Bundesname wird als „Jahwe“ wiedergegeben, sodass er nicht mit dem Titel „Herr“ zusammenfällt.
- source_word: אֱלֹהֵינוּ
  choice: unser Gott
  rationale: Die übliche und in diesem Bundeszusammenhang natürliche Wiedergabe der Form mit dem Suffix der ersten Person Plural.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ wahrt den Unterschied zwischen dem Eigennamen und einem bloßen Herrschaftstitel.
- issue: Wiedergabe von בָּנִים in der gemeinschaftlichen Anrede
  choice: Kinder
  alternative: Söhne
  rationale: Obwohl die hebräische Form grammatisch maskulin ist, bezeichnet sie hier das als Gottes Nachkommenschaft angeredete Volk insgesamt. „Kinder“ gibt diese kollektive Beziehung im Deutschen sachgerecht wieder, ohne die grammatische Form zu einer ausschließlich männlichen Personengruppe zu verengen.
- issue: Bild des Heilens bei moralisch-geistlicher Abkehr
  choice: die Abtrünnigkeit heilen
  alternative: von der Abtrünnigkeit heilen
  rationale: 'Die direkte Objektkonstruktion folgt der markanten hebräischen Metapher: Gott heilt nicht nur die Menschen von etwas, sondern ihre Abkehr selbst. Diese ungewöhnliche Spannung bleibt bewusst erhalten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Direktheit und das Heilungsbild bleiben erhalten. „Siehe“ ist bewusst leicht gehoben und entspricht dem nachdrücklichen הִנְנוּ; die übrige Syntax ist für heutige Leser klar und natürlich.
