source:
  edition: WLC
  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
translation:
  language: de
  text: Und ich sah, dass ich Israel, die Abtrünnige,[a] wegen all der Ehebrüche, die sie begangen hatte, fortgeschickt und ihr die Scheidungsurkunde[b] gegeben hatte. Doch ihre treulose Schwester Juda fürchtete sich nicht; auch sie ging hin und prostituierte sich.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das abtrünnige Israel“. Das hebräische Wort betont das Abwenden beziehungsweise den Abfall.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet die formelle Urkunde einer Scheidung.
    reason: lexical_clarification
  - marker: c
    text: 'Auch möglich: „ging hin und trieb Hurerei“. Die Wendung führt das Bild der Untreue gegenüber Gott als sexueller Untreue fort.'
    reason: metaphor_clarification
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Und ich sah
  rationale: Gibt das erzählende Verb ראה und die fortlaufende prophetische Rede unmittelbar wieder.
- source_word: כִּי עַל כָּל אֹדוֹת אֲשֶׁר נִאֲפָה
  choice: dass ich ... wegen all ihrer Ehebrüche
  rationale: Die verdichtete hebräische Konstruktion verbindet Feststellung und Begründung. Die deutsche Fassung bewahrt sowohl כִּי als Inhaltssatz als auch den kausalen Sinn von עַל כָּל אֹדוֹת und gibt die Gesamtheit der ehebrecherischen Handlungen idiomatisch wieder.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: Israel, die Abtrünnige
  rationale: מְשֻׁבָה bezeichnet Israel als eine, die sich abgewandt hat. Die substantivische Apposition erhält die weibliche Personifikation und vermeidet das grammatisch widersprüchliche „das abtrünnige Israel“ neben den weiblichen Pronomen.
- source_word: שִׁלַּחְתִּיהָ
  choice: ich ... fortgeschickt ... hatte
  rationale: Im Zusammenhang der Eheauflösung bezeichnet שׁלח das Wegschicken der Ehefrau. Das Plusquamperfekt ordnet den Vorgang im deutschen Satz klar ein.
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  choice: den Scheidebrief
  rationale: Bezeichnet die formelle Urkunde der Scheidung; „Scheidebrief“ ist knapp, verständlich und im biblisch-rechtlichen Zusammenhang präzise.
- source_word: וְלֹא יָרְאָה
  choice: fürchtete sich nicht
  rationale: Bewahrt die Grundbedeutung von ירא, ohne sie auf die bloße Folgerung „ließ sich nicht warnen“ festzulegen.
- source_word: בֹּגֵדָה יְהוּדָה
  choice: ihre treulose Schwester Juda
  rationale: „Treulos“ gibt בגד als verräterischen Treuebruch wieder und hält den Ausdruck von מְשֻׁבָה („die Abtrünnige“) unterscheidbar.
- source_word: וַתֵּלֶךְ וַתִּזֶן
  choice: auch sie ging hin und prostituierte sich
  rationale: Erhält sowohl die Bewegungsfolge als auch die drastische sexuelle Metapher für Judas Untreue.
theological_decisions:
- issue: Ehe-, Ehebruchs- und Scheidungsbild für den Bundesbruch
  choice: Die gesamte Bildsprache mit „Ehebrüche“, „fortgeschickt“, „Scheidebrief“ und „prostituierte sich“ bleibt erhalten.
  alternative: Die Ausdrücke zu allgemeiner Untreue oder Götzendienst abschwächen.
  rationale: Der hebräische Text verbindet sexuelle Untreue ausdrücklich mit einem rechtlichen Scheidungsvorgang. Eine Verallgemeinerung würde die prophetische Anklage und ihre Spannung abschwächen.
- issue: Unterscheidung von מְשֻׁבָה und בֹּגֵדָה
  choice: „die Abtrünnige“ für Israel und „treulos“ für Juda
  alternative: Beide Ausdrücke einheitlich mit „treulos“ oder „untreu“ wiedergeben.
  rationale: Jeremia gebraucht zwei verschiedene Bezeichnungen. Die unterschiedliche Wiedergabe bewahrt den Gedanken des Abwendens bei Israel und des verräterischen Treuebruchs bei Juda.
- issue: Bedeutung von וְלֹא יָרְאָה
  choice: „fürchtete sich nicht“
  alternative: „ließ sich nicht warnen“
  rationale: Die wörtlichere Wiedergabe lässt offen, ob Gottesfurcht, Furcht vor dem Gericht oder warnende Abschreckung im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die weibliche Personifikation Israels und Judas bleibt sichtbar. Die Satzstruktur ist geglättet, ohne die kausale Verdichtung, die rechtliche Scheidungssprache oder die anstößig starke sexuelle Metapher des Hebräischen aufzulösen.
