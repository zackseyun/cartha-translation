id: JER.3.10
reference: Jeremiah 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַם בְּ/כָל זֹ֗את לֹא שָׁ֨בָה אֵלַ֜/י בָּגוֹדָ֧ה אֲחוֹתָ֛/הּ יְהוּדָ֖ה בְּ/כָל לִבָּ֑/הּ כִּ֥י אִם בְּ/שֶׁ֖קֶר נְאֻם יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
translation:
  language: de
  text: Doch trotz alledem kehrte ihre treulose Schwester Juda[a] nicht von ganzem Herzen zu mir zurück, sondern nur zum Schein[b] – so spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre verräterische Schwester Juda“. Das hebräische Wort kann Treulosigkeit, Vertrauensbruch oder Verrat hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „sondern in Falschheit“; gemeint ist eine unaufrichtige, nur äußerliche Rückkehr.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  choice: Doch trotz alledem
  rationale: Die Verbindung führt einen zusätzlichen, zugleich gegensätzlichen Gedanken ein. Die deutsche Formulierung gibt den konzessiven Sinn natürlich wieder.
- source_word: שָׁבָה אֵלַי
  choice: kehrte … zu mir zurück
  rationale: שׁוב bezeichnet hier die Umkehr zu Jahwe und bewahrt zugleich den räumlichen, relationalen und bundestheologischen Bedeutungsumfang.
- source_word: בָּגוֹדָה
  choice: treulose
  rationale: Das Wort kennzeichnet Juda als beziehungs- und bundbrüchig. „Treulos“ ist im Deutschen klar und natürlich, ohne den möglichen Beiklang verräterischen Handelns auszuschließen.
- source_word: אֲחוֹתָהּ יְהוּדָה
  choice: ihre … Schwester Juda
  rationale: Die feminine Familienmetapher und die Zuordnung Judas als Schwester des zuvor genannten Israel bleiben ausdrücklich erhalten.
- source_word: בְּכָל לִבָּהּ
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung gibt das hebräische Idiom für ungeteilte Aufrichtigkeit und Hingabe wieder.
- source_word: כִּי אִם בְּשֶׁקֶר
  choice: sondern nur zum Schein
  rationale: כִּי אִם stellt der verneinten ganzherzigen Umkehr eine unechte, von Falschheit geprägte Umkehr gegenüber. „Zum Schein“ macht diese Unechtheit idiomatisch deutlich.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die feierliche prophetische Botenformel wird in natürlichem, würdigem Deutsch wiedergegeben; der Gottesname bleibt als Eigenname erhalten.
theological_decisions:
- issue: Bundesbezogene Bedeutung der Umkehr Judas
  choice: „kehrte … zu mir zurück“ mit offenbleibendem Beiklang von Umkehr und Wiederherstellung der Beziehung
  alternative: „bekehrte sich zu mir“
  rationale: „Zurückkehren“ bewahrt die Bildlichkeit und den relationalen Sinn des hebräischen Verbs, ohne den Ausdruck auf einen späteren theologischen Fachbegriff festzulegen.
- issue: Personifikation Judas als Schwester
  choice: Die feminine Geschwistermetapher wird beibehalten.
  alternative: Eine geglättete Wiedergabe ohne „Schwester“
  rationale: Im Zusammenhang werden Israel und Juda als Schwestern personifiziert. Diese Metapher trägt die Anklage der Treulosigkeit und darf nicht eingeebnet werden.
- issue: Art der vorgeblichen Umkehr
  choice: „nur zum Schein“ bezeichnet die Umkehr als unaufrichtig.
  alternative: „in Falschheit“
  rationale: Der Text stellt nicht in Abrede, dass eine äußere Hinwendung stattfand, sondern dass sie von ganzem Herzen geschah. Die Formulierung wahrt diesen Gegensatz.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Doch trotz alledem“ bildet den Kontrast ab; der Gedankenstrich vor der Botenformel unterstützt den natürlichen Lesefluss. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
