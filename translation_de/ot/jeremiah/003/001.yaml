source:
  edition: WLC
  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
translation:
  language: de
  text: 'Es heißt: »Wenn ein Mann seine Frau fortschickt und sie von ihm weggeht und die Frau eines anderen wird[a], kehrt er dann wieder zu ihr zurück? Würde jenes Land nicht völlig entweiht? Du aber hast dich mit vielen Liebhabern prostituiert – und willst du zu mir zurückkehren?[b]« – Ausspruch Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „einem anderen Mann wird“, das heißt: die Frau eines anderen Mannes wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder als Aufforderung: „Und doch kehre zu mir zurück!“'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: Es heißt
  rationale: Der Infinitiv dient hier als unpersönliche Einleitungsformel für den folgenden rechtlichen Beispielsatz. „Es heißt“ ist im Deutschen knapp und natürlich.
- source_word: הֵן
  choice: Wenn
  rationale: הֵן leitet hier keine bloße Schauformel, sondern einen hypothetischen Rechtsfall ein.
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  choice: seine Frau fortschickt
  rationale: Im ehelichen Zusammenhang bezeichnet שׁלח das Entlassen beziehungsweise die Scheidung der Frau. „Fortschickt“ bewahrt das konkrete Bild des Hebräischen.
- source_word: וְהָלְכָה מֵאִתּוֹ
  choice: und sie von ihm weggeht
  rationale: Die Bewegungsrichtung des hebräischen Ausdrucks bleibt erhalten, ohne den Satz unnötig zu formalisieren.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: und die Frau eines anderen wird
  rationale: Die hebräische Wendung ist elliptisch („einem anderen Mann wird“); die Ergänzung „Frau“ macht den im Zusammenhang eindeutigen ehelichen Sinn im Deutschen verständlich.
- source_word: הֲיָשׁוּב אֵלֶיהָ עוֹד
  choice: darf er dann wieder zu ihr zurückkehren?
  rationale: Die rhetorische Frage steht in einem rechtlichen Zusammenhang. „Darf“ bringt die rechtliche Unzulässigkeit im Deutschen klar zum Ausdruck, während „zurückkehren“ שׁוב wiedergibt.
- source_word: הֲלוֹא חָנוֹף תֶּחֱנַף הָאָרֶץ הַהִיא
  choice: Würde jenes Land nicht völlig entweiht?
  rationale: Infinitivus absolutus und finite Verbform verstärken חנף. „Völlig entweiht“ gibt sowohl die Intensität als auch den religiös-moralischen Charakter der Verunreinigung wieder.
- source_word: וְאַתְּ זָנִית
  choice: Du aber hast dich ... prostituiert
  rationale: Die starke prophetische Metapher sexueller und zugleich bundesbezogener Untreue wird in heutiger, verständlicher Sprache beibehalten.
- source_word: רֵעִים רַבִּים
  choice: mit vielen Liebhabern
  rationale: רֵעִים kann allgemein „Gefährten“ bedeuten; im ausdrücklich sexualisierten Bild sind „Liebhaber“ gemeint.
- source_word: וְשׁוֹב אֵלַי
  choice: und da willst du zu mir zurückkehren?
  rationale: Als rhetorische Frage gelesen setzt die Wendung die Folge anklagender Fragen fort. „Und da“ vermittelt im Deutschen den schockierten Kontrast, ohne die alternative Auffassung als Einladung auszuschließen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird feierlich und knapp wiedergegeben; der Gottesname erscheint als „Jahwe“.
theological_decisions:
- issue: Ist וְשׁוֹב אֵלַי eine rhetorische Frage oder eine überraschende Aufforderung zur Umkehr?
  choice: 'Rhetorische Frage: „und da willst du zu mir zurückkehren?“'
  alternative: 'Aufforderung: „Und doch kehre zu mir zurück!“'
  rationale: Der unmittelbare Zusammenhang besteht aus rhetorischen Fragen zu einem Scheidungsfall und legt die anklagende Lesart nahe. Da die Form jedoch auch als Aufforderung verstanden worden ist und diese Lesart die theologische Spannung zwischen Gericht und Umkehrangebot verändert, wird sie ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Beispielstruktur bleibt klar, die drastische prophetische Metapher wird nicht abgeschwächt. Gedankenstrich und Schlussformel markieren den Übergang zur Gottesredeformel.
