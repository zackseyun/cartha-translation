  source_fidelity: Die Übersetzung gibt die elliptische, nachdrückliche Struktur des Hebräischen sachgerecht wieder. „Trug“ trifft שֶׁקֶר gut; „Getöse“ ist für הָמוֹן eine tragfähige kontextuelle Wiedergabe, ohne den kultischen Bezug ausdrücklich hineinzulesen. „Bei Jahwe, unserem Gott, liegt Israels Rettung“ bewahrt die Aussage von בַּיהוָה und die Genitivverbindung תְּשׁוּעַת יִשְׂרָאֵל.
