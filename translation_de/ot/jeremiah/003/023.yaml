id: JER.3.23
reference: Jeremiah 3:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָכֵ֥ן לַ/שֶּׁ֛קֶר מִ/גְּבָע֖וֹת הָמ֣וֹן הָרִ֑ים אָכֵן֙ בַּ/יהֹוָ֣ה אֱלֹהֵ֔י/נוּ תְּשׁוּעַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
translation:
  language: de
  text: Gewiss, von den Hügeln kommt nur Trug, das Getöse[a] auf den Bergen; gewiss, bei Jahwe, unserem Gott, liegt Israels Rettung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der Lärm auf den Bergen; hebräisch: das Getöse der Berge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: gewiss
  rationale: Die bekräftigende Diskurspartikel wird an beiden Stellen gleich wiedergegeben und bewahrt den nachdrücklichen, bekenntnishaften Ton.
- source_word: לַשֶּׁקֶר
  choice: nur Trug
  rationale: שֶׁקֶר bezeichnet Falschheit oder Täuschung. In der elliptischen Konstruktion bringt „nur Trug“ knapp zum Ausdruck, dass die von den Hügeln erhoffte Hilfe sich als falsch erweist.
- source_word: מִגְּבָעוֹת
  choice: von den Hügeln
  rationale: Die räumliche Herkunftsangabe und das Bild der Hügel, die im Jeremiabuch oft mit unerlaubtem Kult verbunden sind, bleiben erhalten.
- source_word: הָמוֹן הָרִים
  choice: das Getöse auf den Bergen
  rationale: הָמוֹן kann Getöse, Lärm, Aufruhr oder Menschenmenge bedeuten. „Getöse“ bewahrt die wahrscheinliche akustische Bedeutung; „auf den Bergen“ gibt den im Deutschen naheliegenden kontextuellen Bezug wieder, ohne den Kult ausdrücklich in den Text einzutragen.
- source_word: בַּיהוָה
  choice: bei Jahwe
  rationale: Das deutsche „bei“ bezeichnet hier, idiomatisch und ohne die Aussage zu überdeuten, den Ort beziehungsweise die Quelle der wahren Rettung im Gegensatz zu den Hügeln.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Die Bundes- und Bekenntnissprache des hebräischen Ausdrucks wird unmittelbar bewahrt.
- source_word: תְּשׁוּעַת יִשְׂרָאֵל
  choice: Israels Rettung
  rationale: Die knappe Genitivverbindung gibt die Rettung wieder, die Israel gehört beziehungsweise Israel gilt, ohne diese Beziehung enger festzulegen.
theological_decisions:
- issue: Gegensatz zwischen den Hügeln beziehungsweise Bergen und Jahwe als Quelle der Rettung
  choice: Die Hügel und das Getöse auf den Bergen stehen für trügerische Hoffnung; bei Jahwe liegt Israels Rettung.
  alternative: הָמוֹן הָרִים könnte wörtlicher als „die Menge der Berge“ verstanden werden, ohne Anspielung auf kultischen Lärm.
  rationale: Der weitere Zusammenhang in Jeremia verbindet Hügel und Berge mit abtrünnigem Kult. Die Übersetzung lässt diesen Gegensatz erkennen, fügt aber weder „Götzen“ noch „Kulthöhen“ hinzu und bewahrt so die Verdichtung des Ausgangstextes.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, bekenntnishaftem Ton. Die elliptische Reihung des Hebräischen und die zweimalige Bekräftigung „gewiss“ bleiben erkennbar; „kommt“ und „liegt“ machen die Aussage im Deutschen lesbar, ohne zusätzliche theologische Begriffe einzuführen.
