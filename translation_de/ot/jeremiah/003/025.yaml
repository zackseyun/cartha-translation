  text: נִשְׁכְּבָ֣ה בְּ/בָשְׁתֵּ֗/נוּ וּֽ/תְכַסֵּ/נוּ֮ כְּלִמָּתֵ/נוּ֒ כִּי֩ לַ/יהוָ֨ה אֱלֹהֵ֜י/נוּ חָטָ֗אנוּ אֲנַ֨חְנוּ֙ וַ/אֲבוֹתֵ֔י/נוּ מִ/נְּעוּרֵ֖י/נוּ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א שָׁמַ֔עְנוּ בְּ/ק֖וֹל יְהֹוָ֥ה אֱלֹהֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
translation:
  language: de
  text: Lasst uns in unserer Schande niederliegen, und unsere Schmach soll uns bedecken! Denn wir haben gegen Jahwe, unseren Gott, gesündigt – wir und unsere Väter[a] –, von unserer Jugend an bis zum heutigen Tag; und wir haben nicht auf die Stimme Jahwes, unseres Gottes, gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unsere Vorfahren“. Wörtlich steht im Hebräischen „unsere Väter“.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: נִשְׁכְּבָה
  choice: Wir wollen uns … niederlegen
  rationale: Der Qal-Kohortativ der 1. Person Plural drückt hier einen gemeinsamen Willen beziehungsweise eine auffordernde Selbsthingabe aus. Die Formulierung bewahrt diesen Zug und das Bild des Sich-Niederlegens.
- source_word: בְּבָשְׁתֵּנוּ
  choice: in unserer Schande
  rationale: Die Präposition ב bezeichnet den Zustand oder Bereich, in dem sich die Sprechenden niederlegen; „Schande“ gibt בֹּשֶׁת direkt und idiomatisch wieder.
- source_word: וּתְכַסֵּנוּ
  choice: und … soll uns bedecken
  rationale: Das Imperfekt steht parallel zum vorausgehenden Kohortativ und hat hier einen volitiven beziehungsweise jussivischen Klang. „Soll uns bedecken“ erhält diesen, ohne bloß eine Tatsachenfeststellung zu formulieren.
- source_word: כְּלִמָּתֵנוּ
  choice: unsere Schmach
  rationale: „Schmach“ bewahrt die Bedeutungsnähe zu בֹּשֶׁת, ohne die beiden parallelen Substantive unterschiedslos mit demselben deutschen Wort wiederzugeben.
- source_word: לַיהוָה … חָטָאנוּ
  choice: wir haben gegen Jahwe … gesündigt
  rationale: Bei חטא bezeichnet ל denjenigen, gegen den sich die Sünde richtet. Das deutsche „gegen … sündigen“ macht die relationale Verfehlung deutlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  choice: wir und unsere Väter
  rationale: Der hebräische Text nennt ausdrücklich die „Väter“. Die wörtliche Wiedergabe bleibt im Haupttext erhalten; die mögliche umfassendere Bedeutung wird in einer Fußnote genannt.
- source_word: מִנְּעוּרֵינוּ וְעַד הַיּוֹם הַזֶּה
  choice: von unserer Jugend an bis auf den heutigen Tag
  rationale: Die Wendung bezeichnet die ununterbrochene Dauer der Schuld seit der frühen Zeit der Gemeinschaft bis zur Gegenwart.
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  choice: und wir haben nicht auf die Stimme … gehört
  rationale: Die deutsche Wendung „auf die Stimme hören“ bewahrt das Bild des Hörens und schließt zugleich den im Hebräischen gemeinten Gehorsam ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ erhält den Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von אָבוֹת („Väter“)
  choice: Väter im Haupttext
  alternative: Vorfahren
  rationale: „Väter“ entspricht der konkreten Form des Hebräischen; zugleich kann das Wort im Zusammenhang die früheren Generationen insgesamt bezeichnen. Diese Spannung wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem poetisch-bußfertigem Parallelismus. „Schande/Schmach“ wahrt die zwei verwandten, aber nicht identischen hebräischen Begriffe; „bis auf den heutigen Tag“ trägt den feierlichen Ton, ohne altertümlich zu wirken.
