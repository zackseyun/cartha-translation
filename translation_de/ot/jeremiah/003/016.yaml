source:
  edition: WLC
  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn ihr euch im Land in jenen Tagen vermehrt und fruchtbar werdet – Ausspruch Jahwes –, wird man nicht mehr sagen: »Die Bundeslade Jahwes.« Sie wird niemandem mehr in den Sinn kommen; man wird sich nicht mehr an sie erinnern und sie nicht vermissen[a], und sie wird nicht wieder angefertigt werden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht mehr nach ihr sehen« beziehungsweise »sich nicht mehr um sie kümmern«. Das hebräische Verb kann mehrere verwandte Bedeutungen haben; hier dürfte gemeint sein, dass man die Lade nicht mehr benötigt oder ihre Abwesenheit nicht mehr wahrnimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »und keine andere wird mehr angefertigt werden«. Im Hebräischen steht ein Passiv ohne ausdrücklich genanntes Objekt; gemeint ist wahrscheinlich, dass keine Ersatzlade hergestellt wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: 'Und es wird geschehen: Wenn'
  rationale: Die prophetische Zukunftsformel und der zeitliche Anschluss werden in würdigem, natürlichem Deutsch wiedergegeben.
- source_word: תִרְבּוּ וּפְרִיתֶם
  choice: ihr euch vermehrt und fruchtbar seid
  rationale: Bewahrt beide Verben sowie den erkennbaren biblischen Anklang an die feste Wortverbindung von Sichvermehren und Fruchtbarsein.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Der Kontext spricht vom Land Israel/Juda, nicht allgemein von der Erde.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feierliche prophetische Botenformel knapp wieder und bewahrt den Gottesnamen.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: die Bundeslade Jahwes
  rationale: Natürliches deutsches Kompositum für die Lade des Bundes; die Zugehörigkeit zu Jahwe bleibt ausdrücklich.
- source_word: וְלֹא יַעֲלֶה עַל לֵב
  choice: Sie wird niemandem mehr in den Sinn kommen
  rationale: Idiomatiche Wiedergabe des hebräischen Bildes, wörtlich etwa »auf das Herz steigen«.
- source_word: וְלֹא יִזְכְּרוּ בוֹ
  choice: man wird sich nicht mehr an sie erinnern
  rationale: Das pronominale Element wird auf die Bundeslade bezogen; der Wechsel zu unpersönlichem »man« entspricht dem allgemeinen Subjekt der Aussage.
- source_word: וְלֹא יִפְקֹדוּ
  choice: und sie nicht vermissen
  rationale: פקד besitzt hier mehrere mögliche Sinnnuancen. »Vermissen« passt zur Folge von Nicht-Erwähnen und Nicht-Erinnern, ohne Alternativen zu verschweigen.
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  choice: und sie wird nicht wieder angefertigt werden
  rationale: Das passive Verb lässt sein Objekt unausgesprochen; aus dem Kontext wird die Bundeslade ergänzt, wobei die grammatische Offenheit in einer Fußnote kenntlich bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Künftige Bedeutung der Bundeslade
  choice: Die Aussagen beschränken sich auf ihr Nicht-Erwähnen, Nicht-Erinnern, Nicht-Vermissen und Nicht-Wiederanfertigen.
  alternative: Eine ausdrückliche Abschaffung des Bundes oder lediglich der Verlust eines Gegenstands
  rationale: Die Übersetzung führt keine umfassendere Bundestheologie ein, sondern wahrt die konkrete und zugleich spannungsreiche Aussage des Verses.
- issue: Unausgesprochenes Objekt des letzten Passivs
  choice: Die Bundeslade wird als aus dem Kontext erschlossenes Subjekt ausgedrückt.
  alternative: Noch etwas beziehungsweise eine andere Lade wird nicht angefertigt
  rationale: Das Hebräische lässt das Objekt implizit; die Hauptübersetzung stellt den naheliegenden Bezug her, die Fußnote bewahrt die formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachrhythmus. »Bundeslade« ist allgemein verständlich und traditionsnah. Die Folge kurzer Negationen des Hebräischen bleibt deutlich, wird aber für flüssiges Deutsch teilweise mit unpersönlichem »man« gestaltet.
