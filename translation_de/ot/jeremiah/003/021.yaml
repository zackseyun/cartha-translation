source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
translation:
  language: de
  text: 'Eine Stimme ist auf den kahlen Höhen zu hören: das Weinen und Flehen der Söhne Israels[a]. Denn sie haben ihren Weg verdreht[b]; sie haben Jahwe[c], ihren Gott, vergessen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Kinder Israels“ beziehungsweise „der Israeliten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihren Weg krumm gemacht“; gemeint sein kann auch ihr Lebenswandel.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  choice: Eine Stimme
  rationale: קוֹל bezeichnet eine Stimme, einen Laut oder Ruf. „Eine Stimme“ bewahrt die anschauliche Eröffnung und passt zum folgenden „ist … zu hören“.
- source_word: עַל שְׁפָיִ֣ים
  choice: auf den kahlen Höhen
  rationale: שְׁפָיִים bezeichnet kahle, unbewaldete oder weithin sichtbare Höhen. Diese Wiedergabe vermeidet zugleich, den Ausdruck vorschnell als kultischen Fachbegriff „Höhenheiligtümer“ festzulegen.
- source_word: נִשְׁמָ֔ע
  choice: ist … zu hören
  rationale: Das Nifal von שׁמע wird idiomatisch passiv wiedergegeben.
- source_word: בְּכִ֥י תַחֲנוּנֵ֖י
  choice: das Weinen und Flehen
  rationale: בְּכִי ist „Weinen“, תַחֲנוּנִים bezeichnet inständige Bitten um Erbarmen. „Flehen“ ist natürlich, verständlich und wahrt die eindringliche Haltung.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: der Söhne Israels
  rationale: Die formale Wendung gibt den maskulinen Plural בְּנֵי sowie die hebräische Genitivverbindung eng wieder; die kollektive Bedeutung wird in einer Fußnote ausgewiesen.
- source_word: כִּ֤י
  choice: Denn
  rationale: כִּי führt hier den Grund für das Weinen und Flehen an. „Denn“ stellt den kausalen Zusammenhang in würdigem, natürlichem Deutsch her.
- source_word: הֶעֱוּוּ֙ אֶת דַּרְכָּ֔ם
  choice: sie haben ihren Weg krumm gemacht
  rationale: Das Hifil von עוה bezeichnet das Krummmachen oder Verdrehen. Die konkrete Wegmetapher und ihre moralische Aussage bleiben erhalten.
- source_word: שָׁכְח֖וּ
  choice: sie haben … vergessen
  rationale: Das Perfekt beschreibt die eingetretene und für die Gegenwart bedeutsame Abkehr; das deutsche Perfekt ist hier natürlich.
- source_word: יְהֹוָ֥ה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיהֶֽם
  choice: ihren Gott
  rationale: Die Konstruktion mit Suffix wird direkt wiedergegeben und bewahrt den Bundesbezug, der das Vergessen besonders schwer wiegen lässt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottesnamen. „Jahwe“ macht diesen Namenscharakter sichtbar; die traditionelle Wiedergabe wird in einer Fußnote genannt.
- issue: Kollektive Bedeutung von בְּנֵי יִשְׂרָאֵל
  choice: Söhne Israels
  alternative: Kinder Israels / Israeliten
  rationale: Der Haupttext wahrt die formale maskuline Wendung, ohne auszuschließen, dass sie im Zusammenhang das Volk kollektiv bezeichnet; diese echte Übersetzungsalternative wird in der Fußnote offengelegt.
- issue: Moralische Wegmetapher in הֶעֱוּוּ אֶת דַּרְכָּם
  choice: ihren Weg krumm gemacht
  alternative: ihren Weg verdreht / ihren Lebenswandel verkehrt
  rationale: Die konkrete Metapher wird nicht durch eine rein abstrakte Deutung ersetzt. So bleibt offen sichtbar, dass „Weg“ zugleich den Lebenswandel bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Wahrung der hebräischen Bildsprache. Der Doppelpunkt macht die Apposition verständlich, ohne ein zusätzliches Richtungs- oder Herkunftsverhältnis einzutragen. Die beiden Begründungssätze bleiben durch klare Satzzeichen verbunden; echte lexikalische und theologische Alternativen stehen in den Fußnoten.
