  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
translation:
  language: de
  text: Zu jener Zeit wird man Jerusalem »Thron Jahwes« nennen. Alle Völker werden sich um des Namens Jahwes willen zu ihr, nach Jerusalem, versammeln[a]. Sie werden nicht länger dem Starrsinn ihres bösen Herzens folgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden zu ihr zusammengeführt« oder »werden zu ihr strömen«. Das hebräische Verb ist hier schwierig; im Zusammenhang beschreibt es, wie die Völker nach Jerusalem zusammenkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Gibt die übliche prophetische Zeitangabe natürlich und würdig wieder.
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  choice: wird man Jerusalem »Thron Jahwes« nennen
  rationale: Das unbestimmte pluralische Subjekt wird im Deutschen idiomatisch mit »man« wiedergegeben; das Bild des Thrones bleibt unverändert.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְנִקְוּוּ אֵלֶיהָ
  choice: werden sich dort versammeln
  rationale: Das schwierige Nifal wird kontextgemäß als Zusammenkommen der Völker verstanden. »Dort« verweist im Deutschen natürlich auf die Stadt, ohne das feminine hebräische Pronomen künstlich nachzubilden.
- source_word: כָל הַגּוֹיִם
  choice: alle Völker
  rationale: Bezeichnet hier umfassend die Nationen und wird nicht auf einen konfessionell geprägten Ausdruck verengt.
- source_word: לְשֵׁם יְהוָה
  choice: um des Namens Jahwes willen
  rationale: Bewahrt die Ausrichtung auf beziehungsweise Ehrung des göttlichen Namens, ohne den Zweck enger festzulegen.
- source_word: לִירוּשָׁלָם
  choice: in Jerusalem
  rationale: Die ausdrückliche Wiederholung Jerusalems bleibt erhalten; nach »sich versammeln« ist die lokale Wiedergabe im Deutschen natürlich.
- source_word: וְלֹא יֵלְכוּ עוֹד אַחֲרֵי
  choice: Sie werden nicht länger … folgen
  rationale: Gibt die hebräische Wendung idiomatisch wieder; die Lebenswandel-Metapher ist im Deutschen bei »nachgehen« weniger klar.
- source_word: שְׁרִרוּת לִבָּם הָרָע
  choice: dem Starrsinn ihres bösen Herzens
  rationale: »Starrsinn« erfasst die eigensinnige Verstocktheit; der kollektive Singular »Herz« wird bewahrt.
theological_decisions:
- issue: Jerusalem als »Thron Jahwes«
  choice: Das Thronbild wird direkt und ohne systematische Deutung wiedergegeben.
  alternative: Die Aussage ausdrücklich symbolisch, ekklesiologisch oder als buchstäbliche endzeitliche Inthronisierung deuten.
  rationale: Der Vers verbindet Jerusalem mit Jahwes königlicher Herrschaft, legt aber die weitergehende eschatologische Ausgestaltung nicht fest.
- issue: Bewegung der Völker nach Jerusalem
  choice: Als Versammlung in Jerusalem wiedergeben, ohne ihre genaue Art zu bestimmen.
  alternative: Ausdrücklich als Wallfahrt, Bekehrung oder politische Unterwerfung deuten.
  rationale: Der Text beschreibt das Zusammenkommen der Völker um des Namens Jahwes willen, ohne diese Kategorien ausdrücklich voneinander abzugrenzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung »dort, in Jerusalem« wahrt die hebräische Wiederaufnahme des Ortsnamens. Der Gottesname wird einheitlich als »Jahwe« wiedergegeben.
