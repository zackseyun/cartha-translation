  text: הֲ/ל֣וֹא מֵ/עַ֔תָּה קראתי לִ֖/י אָבִ֑/י אַלּ֥וּף נְעֻרַ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/004.yaml
  text: Have you not just now called to me[a], ‘My Father[b], you are the friend of my youth’?”
translation:
  language: de
  text: 'Hast du nicht eben erst[a] zu mir gerufen: »Mein Vater, du bist der Vertraute meiner Jugend[b]«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von nun an«. Die hebräische Wendung kann je nach Zusammenhang auch zukunftsbezogen verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Führer meiner Jugend«. Das hebräische Wort kann je nach Zusammenhang einen engen Vertrauten, Gefährten oder Führer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Hast du nicht
  rationale: Gibt die rhetorische Frage wieder, die eine bejahende Antwort nahelegt.
- source_word: מֵעַתָּה
  choice: eben erst
  rationale: Bezeichnet im Kontext am ehesten den gerade erst erfolgten Ruf; die grundsätzlich mögliche zukunftsbezogene Bedeutung wird in einer Fußnote genannt.
- source_word: קראתי לִי
  choice: zu mir gesagt
  rationale: Das feminine Qal-Perfekt richtet sich an die personifizierte Frau Juda/Israel. Bei der folgenden direkten Anrede ist »zu mir gesagt« im Deutschen natürlicher als das wörtlichere »mich gerufen«.
- source_word: אָבִי
  choice: Mein Vater
  rationale: Bewahrt die unmittelbare Anrede Gottes und das Possessivverhältnis.
- source_word: אַלּוּף
  choice: Vertraute
  rationale: Bezeichnet hier wahrscheinlich einen engen, vertrauten Gefährten; »Vertrauter« wahrt die persönliche Nähe, ohne die ebenfalls mögliche Leitungsnuance festzuschreiben.
- source_word: נְעֻרַי
  choice: meiner Jugend
  rationale: Gibt die hebräische Genitivverbindung knapp und idiomatisch wieder.
- source_word: אָתָּה
  choice: du bist
  rationale: Macht den im Hebräischen nominalen Satz im Deutschen vollständig.
theological_decisions:
- issue: Sprecher und Adressatin der rhetorischen Frage
  choice: Der HERR redet die als Frau personifizierte Juda/Israel an und zitiert ihren jüngsten Ruf an ihn.
  alternative: Der zitierte Ruf kann im Zusammenhang als oberflächliche oder ironisch entlarvte Umkehr verstanden werden.
  rationale: Die feminine Verbform stützt die personifizierte Adressatin. Die Übersetzung gibt ihren Ruf wieder, entscheidet aber nicht ausdrücklich über dessen Aufrichtigkeit.
- issue: Bedeutung von אַלּוּף
  choice: Vertrauter
  alternative: Führer oder Wegweiser
  rationale: Der Beziehungsausdruck »meiner Jugend« legt persönliche Vertrautheit nahe; die mögliche Leitungsbedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt persönlich und knapp; die feminine Anrede ist an der Verbform im Deutschen nicht erkennbar, wird aber nicht durch erklärende Zusätze in den Bibeltext eingebracht.
