source:
  edition: WLC
  text: וְ/הַ/בֹּ֗שֶׁת אָֽכְלָ֛ה אֶת יְגִ֥יעַ אֲבוֹתֵ֖י/נוּ מִ/נְּעוּרֵ֑י/נוּ אֶת צֹאנָ/ם֙ וְ/אֶת בְּקָרָ֔/ם אֶת בְּנֵי/הֶ֖ם וְ/אֶת בְּנוֹתֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
translation:
  language: de
  text: 'Doch die Schande[a] hat seit unserer Jugend den Ertrag der Arbeit unserer Väter verzehrt: ihre Schaf- und Ziegenherden und ihre Rinderherden, ihre Söhne und ihre Töchter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Schändliche“; wahrscheinlich eine verächtliche Bezeichnung für Baal oder den Götzendienst.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  choice: Doch die Schande
  rationale: Das וְ wird im Zusammenhang als gegensätzliches „Doch“ wiedergegeben. „Die Schande“ bewahrt die auffällige hebräische Bezeichnung und ihre Personifizierung, ohne sie im Haupttext ausdrücklich als Baal oder Götzendienst zu deuten.
- source_word: אָכְלָה
  choice: hat … verzehrt
  rationale: Das Verb bedeutet wörtlich „essen“, bezeichnet bei Besitz und Lebensgrundlagen aber bildhaft deren vollständigen Verbrauch oder Untergang. „Verzehrt“ erhält dieses kräftige Bild.
- source_word: יְגִיעַ אֲבוֹתֵינוּ
  choice: den Ertrag der Arbeit unserer Väter
  rationale: יְגִיעַ bezeichnet das durch Mühe Erarbeitete beziehungsweise dessen Ertrag. Die Formulierung bewahrt sowohl den Gedanken der Arbeit als auch den der daraus hervorgegangenen Güter; „Väter“ gibt den maskulinen Plural direkt wieder.
- source_word: מִנְּעוּרֵינוּ
  choice: seit unserer Jugend
  rationale: Die Wendung bezeichnet einen Zeitraum, der in der Jugend beginnt und bis zur betrachteten Gegenwart reicht. „Seit“ ist dafür im heutigen Deutsch natürlicher als „von unserer Jugend an“.
- source_word: צֹאנָם
  choice: ihre Schaf- und Ziegenherden
  rationale: צֹאן ist eine Sammelbezeichnung für Kleinvieh, insbesondere Schafe und Ziegen. Die ausdrückliche Benennung macht den Umfang für heutige Leser klar.
- source_word: בְּקָרָם
  choice: ihre Rinderherden
  rationale: בָּקָר bezeichnet Rindvieh beziehungsweise Großvieh. „Rinderherden“ bildet einen klaren Gegensatz zu den vorausgehenden Schaf- und Ziegenherden.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: ihre Söhne und ihre Töchter
  rationale: Die bewusste Paarung der beiden geschlechtsspezifischen Plurale wird direkt bewahrt und nicht zum allgemeineren „Kinder“ zusammengezogen.
theological_decisions:
- issue: Mögliche metonymische Verwendung von „die Schande“ für Baal oder den Götzendienst
  choice: Im Haupttext steht „die Schande“ als personifiziertes Abstraktum.
  alternative: „Das Schandbild“, „der Schandgott“ oder ausdrücklich „Baal“
  rationale: In Jeremia kann „die Schande“ als verächtliche Ersatzbezeichnung für Baal beziehungsweise den Götzendienst dienen. Die direkte Wiedergabe hält offen, ob hier die Schande selbst personifiziert oder auf den schändlichen Götzen angespielt wird; die mögliche Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Der Doppelpunkt macht die nachfolgende Aufzählung als Entfaltung des „Ertrags“ kenntlich. Die ungewöhnliche Einbeziehung von Söhnen und Töchtern in das Verzehrte wird als Spannung des Ausgangstextes bewahrt.
