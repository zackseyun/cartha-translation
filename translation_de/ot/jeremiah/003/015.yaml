id: JER.3.15
reference: Jeremiah 3:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י לָ/כֶ֛ם רֹעִ֖ים כְּ/לִבִּ֑/י וְ/רָע֥וּ אֶתְ/כֶ֖ם דֵּעָ֥ה וְ/הַשְׂכֵּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
translation:
  language: de
  text: Und ich werde euch Hirten[a] nach meinem Herzen[b] geben, und sie werden euch mit Erkenntnis und Einsicht[c] weiden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hirten“ kann auch mit „Leiter“ wiedergegeben werden. Das Hebräische verwendet jedoch das umfassendere Bild von Menschen, die Gottes Volk hüten und versorgen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinem Herzen entsprechend“. Gemeint ist die Übereinstimmung mit Gottes eigenem Willen oder Verlangen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit Wissen und verständiger Klugheit“. Die beiden hebräischen Begriffe bezeichnen kundige und einsichtsvolle Leitung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … geben
  rationale: Das Qal-Perfekt der 1. Person Singular mit vorangestelltem וְ bezeichnet im prophetischen Zusammenhang eine zukünftige Zusage. Die Wiedergabe bewahrt sowohl den Anschluss als auch den Verheißungscharakter.
- source_word: לָכֶם
  choice: euch
  rationale: Die Präposition לְ kennzeichnet hier den indirekten Gegenstand; im Deutschen ist „euch … geben“ die natürliche Form.
- source_word: רֹעִים
  choice: Hirten
  rationale: Das substantivierte Partizip von רעה bezeichnet wörtlich Hirten und dient als umfassendes Bild für Menschen, die Gottes Volk führen und versorgen. „Pastoren“ wäre enger und würde spätere kirchliche Amtsvorstellungen nahelegen.
- source_word: כְּלִבִּי
  choice: nach meinem Herzen
  rationale: Die knappe hebräische Wendung bezeichnet Übereinstimmung mit Gottes Willen, Gesinnung oder Verlangen. Die deutsche Formulierung bewahrt das Herzbild und seine mögliche Bedeutungsbreite.
- source_word: וְרָעוּ
  choice: und sie werden … weiden
  rationale: Das Verb רעה kann „weiden“, „hüten“ oder „als Hirte versorgen“ bedeuten. „Weiden“ führt das Hirtenbild natürlich fort, ohne es auf bloßes Füttern zu beschränken.
- source_word: אֶתְכֶם
  choice: euch
  rationale: Der Akkusativmarker mit dem Suffix der 2. Person maskulin Plural bezeichnet die Angesprochenen als direktes Objekt.
- source_word: דֵּעָה
  choice: Erkenntnis
  rationale: Das Substantiv bezeichnet Wissen oder Erkenntnis. „Erkenntnis“ ist in diesem würdevollen Kontext natürlich und bleibt vom folgenden Begriff unterschieden.
- source_word: וְהַשְׂכֵּיל
  choice: und Einsicht
  rationale: Die Form bringt verständiges, einsichtsvolles oder kluges Handeln zum Ausdruck. „Einsicht“ bewahrt die Unterscheidung von דֵּעָה und ergibt mit „Erkenntnis“ ein klares Begriffspaar.
theological_decisions:
- issue: Art der verheißenen Hirten
  choice: Das Hirtenbild bezeichnet von Gott gegebene menschliche Leiter, ohne ihr Amt enger festzulegen.
  alternative: „Pastoren“ im spezifisch kirchlichen Sinn oder ausschließlich Könige und Herrscher.
  rationale: Im Zusammenhang Jeremias betrifft die Zusage die erneuerte Leitung des Gottesvolkes. Das wörtliche Bild lässt den Umfang offen und importiert keine spätere Amtsordnung.
- issue: Bedeutung von „nach meinem Herzen“
  choice: Die Hirten entsprechen Gottes eigenem Willen, Verlangen oder seiner Gesinnung.
  alternative: Die Hirten seien lediglich von Gott besonders geliebt.
  rationale: כְּלִבִּי drückt hier vor allem Übereinstimmung mit Gottes Herz aus. Die bildhafte Übersetzung bewahrt zugleich die in der hebräischen Wendung liegende Spannung zwischen Wille, Gesinnung und Verlangen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das wiederholte Hirtenbild bleibt erhalten; spätere kirchliche Amtssprache wird vermieden. Die Satzstellung ist natürlich, ohne die knappe Struktur des Hebräischen unnötig auszubauen.
