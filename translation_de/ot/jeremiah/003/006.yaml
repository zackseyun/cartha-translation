  source_fidelity: Die Übersetzung gibt die Anrede JHWHs, die zeitliche Einordnung unter König Josia, die personifizierte Charakterisierung Israels als מְשֻׁבָה sowie die kultisch aufgeladenen Ortsbilder und die Ehebruch-/Prostitutionsmetapher sachgerecht wieder. „Israel, die Abtrünnige“ bewahrt die feminine Personifikation; „trieb dort Hurerei“ gibt וַתִּזְנִי in angemessen kräftigem prophetischem Register wieder, ohne die Metapher ausdeutend auf Götzendienst zu reduzieren.
