  terminology: „der HERR“ ist eine etablierte Wiedergabe des Tetragramms. „die Abtrünnige“, „hohen Berg“, „grünen Baum“ und „Hurerei“ sind terminologisch konsistent und bewahren die Bildsprache, ohne konfessionelle Zusatzdeutung einzutragen.
