source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בִּ/ימֵי֙ יֹאשִׁיָּ֣הוּ הַ/מֶּ֔לֶךְ הֲֽ/רָאִ֔יתָ אֲשֶׁ֥ר עָשְׂתָ֖ה מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל הֹלְכָ֨ה הִ֜יא עַל כָּל הַ֣ר גָּבֹ֗הַּ וְ/אֶל תַּ֛חַת כָּל עֵ֥ץ רַעֲנָ֖ן וַ/תִּזְנִי שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: de
  text: 'Und der HERR sprach zu mir in den Tagen König Josias: „Hast du gesehen, was Israel, die Abtrünnige, getan hat? Sie ging auf jeden hohen Berg und unter jeden grünen Baum und trieb dort Hurerei.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist im Bibelregister geläufig und unterscheidet ihn von אֲדֹנָי.
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  choice: Israel, die Abtrünnige
  rationale: מְשֻׁבָה bezeichnet hier personifiziertes, von JHWH abgekehrtes Israel. Die substantivische Wiedergabe bewahrt die Charakterisierung als Beiname und den Bezug zum Bundesbruch.
- source_word: הַר גָּבֹהַּ
  choice: hohen Berg
  rationale: Das konkrete Bild wird formal bewahrt; im Kontext sind Höhen als Orte des Götzendienstes mitgemeint, ohne dass dies in den Text hineinerklärt wird.
- source_word: עֵץ רַעֲנָן
  choice: grünen Baum
  rationale: Gibt den üppig belaubten beziehungsweise frischen Baum natürlich und traditionsnah wieder.
- source_word: וַתִּזְנִי
  choice: trieb Hurerei
  rationale: Die starke sexuelle Metapher für Israels kultische und bundestheologische Untreue bleibt erhalten; die Formulierung ist würdig, deutlich und im prophetischen Register angemessen.
theological_decisions:
- issue: Personifikation Israels und Metapher ehelicher Untreue
  choice: Israel wird feminin als „die Abtrünnige“ bezeichnet und ihr Verhalten als „Hurerei“ benannt.
  alternative: „das treulose Israel … prostituierte sich“
  rationale: Die gewählte Fassung hält die prophetische Personifikation und die Härte der Bundesbruchmetapher aufrecht, ohne sie auf bloße allgemeine Untreue abzuschwächen.
- issue: Kultische Bedeutung von Berg und grünem Baum
  choice: Die Ortsangaben bleiben unkommentiert im Haupttext.
  alternative: Explizite Ergänzung wie „an den Kultstätten“
  rationale: Der Kontext legt Götzendienst nahe, doch der hebräische Vers nennt bildhaft die Orte. Eine erklärende Ergänzung würde die Textaussage unnötig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. „In den Tagen König Josias“ bewahrt den biblisch-historischen Ton, bleibt aber gut verständlich. Keine Fußnoten erforderlich.
