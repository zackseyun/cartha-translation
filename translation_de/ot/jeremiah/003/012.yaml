source:
  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
translation:
  language: de
  text: 'Geh und rufe diese Worte nach Norden hin aus und sage: Kehre zurück, du abtrünniges Israel, spricht Jahwe. Ich werde euch nicht zornig ansehen; denn ich bin treu[a], spricht Jahwe. Ich werde nicht für immer zornig bleiben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „barmherzig“. Das hebräische Wort kann treue Verbundenheit, Güte oder Barmherzigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Geh und rufe … aus
  rationale: Der Infinitivus absolutus הָלֹךְ verstärkt den Aufforderungscharakter; קרא bezeichnet im prophetischen Zusammenhang ein öffentliches Ausrufen.
- source_word: צָפוֹנָה
  choice: nach Norden hin
  rationale: Die Richtungsform wird ausdrücklich wiedergegeben und weist wahrscheinlich auf das Gebiet des verschleppten Nordreichs.
- source_word: שׁוּבָה מְשֻׁבָה יִשְׂרָאֵל
  choice: Kehre zurück, du abtrünniges Israel
  rationale: שוב bewahrt den räumlichen und beziehungsbezogenen Sinn von Umkehr und Rückkehr; מְשֻׁבָה bezeichnet Israels Abkehr beziehungsweise Untreue und wird in natürlichem Deutsch adjektivisch wiedergegeben.
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  choice: Ich werde euch nicht zornig ansehen
  rationale: Die wörtliche Wendung vom Fallenlassen des Angesichts wird als Ausdruck eines zornigen, feindlichen Blicks verständlich wiedergegeben. Das plurale בָּכֶם bleibt durch „euch“ erhalten, obwohl Israel zuvor im Singular angeredet wird.
- source_word: חָסִיד אֲנִי
  choice: denn ich bin treu
  rationale: חָסִיד beschreibt hier Jahwes von Bundestreue und loyaler Güte geprägtes Wesen. „Treu“ hält diesen Beziehungsaspekt fest; die ebenfalls mögliche Wiedergabe „barmherzig“ wird in der Fußnote genannt.
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  choice: Ich werde nicht für immer zornig bleiben
  rationale: נטר bezeichnet hier das Festhalten an Zorn oder Groll. Die Wiedergabe drückt sowohl den Zorn als auch dessen Andauern aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text stehende Eigenname wird in seiner im Deutschen üblichen Form wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Bedeutungsnuance von חָסִיד in Bezug auf Jahwe
  choice: treu
  alternative: barmherzig
  rationale: „Treu“ hebt loyale, bundestreue Güte hervor, ohne die im Kontext mögliche Bedeutung „barmherzig“ auszuschließen; diese bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Aufforderungston. Die Anrede wechselt entsprechend dem Hebräischen vom singularischen „Israel“ zum pluralischen „euch“. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck, auf den die Anmerkung verweist.
