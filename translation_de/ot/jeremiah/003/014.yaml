id: JER.3.14
reference: Jeremiah 3:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
translation:
  language: de
  text: Kehrt zurück, ihr treulosen Söhne, spricht Jahwe, denn ich bin euer Herr[a]. Ich werde euch holen, einen aus einer Stadt und zwei aus einer Sippe, und euch nach Zion bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn ich bin euer Ehemann“; auch: „denn ich habe euch geheiratet“. Das hebräische Verb kann sowohl Herrschaft als auch eine eheliche Beziehung bezeichnen.'
    reason: Die Fußnote bewahrt die bei בָּעַלְתִּי mögliche eheliche Bedeutung neben der im Haupttext gewählten Herrschaftsbedeutung.
lexical_decisions:
- source_word: שׁוּבוּ
  choice: Kehrt zurück
  rationale: Der Qal-Imperativ von שוב ruft zur Rückkehr zu Jahwe und in die Bundesbeziehung auf. „Kehrt zurück“ bewahrt sowohl die räumliche als auch die relationale Bildsprache und legt den Ausdruck nicht vorschnell als bloß innerliche „Buße“ aus.
- source_word: בָנִים שׁוֹבָבִים
  choice: ihr treulosen Kinder
  rationale: בָנִים bezeichnet hier die Angehörigen des Gottesvolkes und kann im Deutschen in dieser Anrede natürlich mit „Kinder“ wiedergegeben werden. שׁוֹבָבִים beschreibt ihr Abweichen und ihre Untreue; „treulos“ hebt die im Kontext zentrale Bundesuntreue hervor.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt נְאֻם würdig und verständlich wieder; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: כִּי אָנֹכִי בָּעַלְתִּי בָכֶם
  choice: denn ich bin euer Herr[a]
  rationale: בעל kann sowohl Herrschaft als auch eine eheliche Beziehung ausdrücken. Die Hauptfassung wahrt den Anspruch Jahwes auf sein Volk; die ebenfalls kontextuell wichtige eheliche Bedeutung wird in der Fußnote offengehalten.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: Ich werde euch holen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Im Zusammenhang der Sammlung und Heimführung gibt „holen“ die Zielrichtung im natürlichen Deutschen wieder, ohne zusätzliche Einzelheiten einzutragen.
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  choice: einen aus einer Stadt und zwei aus einer Sippe
  rationale: Die knappe Zahlenformulierung des Hebräischen bleibt erhalten. מִשְׁפָּחָה bezeichnet hier eher einen größeren Verwandtschaftsverband als die moderne Kernfamilie und wird daher mit „Sippe“ wiedergegeben.
- source_word: וְהֵבֵאתִי אֶתְכֶם צִיּוֹן
  choice: und euch nach Zion bringen
  rationale: Die Zielbewegung von בוא im Hifil wird idiomatisch mit „nach Zion bringen“ ausgedrückt; der traditionsreiche Ortsname bleibt unverändert.
theological_decisions:
- issue: Herrschaftliche oder eheliche Bedeutung von בָּעַלְתִּי
  choice: „ich bin euer Herr“ im Haupttext, mit der ehelichen Bedeutung in einer Fußnote
  alternative: „ich bin euer Ehemann“ oder „ich habe euch geheiratet“
  rationale: Das Verb trägt im Zusammenhang sowohl den Anspruch der Herrschaft als auch die im Kapitel wirksame Ehemetaphorik. Eine eindeutige Festlegung würde diese echte Bedeutungsüberlagerung auflösen; deshalb steht die im unmittelbaren Satz natürliche Herrschaftsbedeutung im Text, während die eheliche Lesart ausdrücklich bewahrt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede bleibt eindringlich, ohne altertümliches „o“. „Sippe“ bezeichnet den größeren Verwandtschaftsverband; „Jahwe“ gibt den Gottesnamen als Eigennamen wieder.
