id: JER.3.3
reference: Jeremiah 3:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּמָּנְע֣וּ רְבִבִ֔ים וּ/מַלְק֖וֹשׁ ל֣וֹא הָיָ֑ה וּ/מֵ֨צַח אִשָּׁ֤ה זוֹנָה֙ הָ֣יָה לָ֔/ךְ מֵאַ֖נְתְּ הִכָּלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
translation:
  language: de
  text: Darum blieben die Regenschauer aus, und der Frühlingsregen[a] kam nicht. Doch du hattest die Stirn einer Prostituierten; du hast dich geweigert, dich zu schämen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Spätregen“. Gemeint ist der späte saisonale Regen gegen Ende der Regenzeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּנְעוּ
  choice: blieben aus
  rationale: Das Nifal beschreibt, dass die Regenschauer zurückgehalten wurden. „Blieben aus“ gibt die Folge im Deutschen natürlich wieder, ohne den im Hebräischen nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: רְבִבִים
  choice: Regenschauer
  rationale: Das Substantiv bezeichnet Regengüsse oder Schauer; „Regenschauer“ ist klar und idiomatisch.
- source_word: מַלְקוֹשׁ
  choice: Frühlingsregen
  rationale: Gemeint ist der späte saisonale Regen gegen Ende der Regenzeit, der für das Reifen der Ernte wichtig war. „Frühlingsregen“ macht den jahreszeitlichen Bezug für heutige Leser verständlich.
- source_word: מֵצַח
  choice: Stirn
  rationale: Die wörtliche Körpermetapher wird beibehalten, weil sie dreiste Schamlosigkeit anschaulich ausdrückt.
- source_word: אִשָּׁה זוֹנָה
  choice: einer Prostituierten
  rationale: Die direkte sexuelle Metapher bleibt erhalten; „Prostituierte“ ist gegenwärtiges Standarddeutsch und weniger archaisch als „Hure“.
- source_word: הָיָה לָךְ
  choice: du hattest
  rationale: Die hebräische Konstruktion mit היה und ל drückt Besitz aus und wird im Deutschen idiomatisch mit „haben“ wiedergegeben.
- source_word: מֵאַנְתְּ
  choice: du hast dich geweigert
  rationale: מאן bezeichnet eine bewusste Weigerung oder Unwilligkeit; die Formulierung bewahrt die Schärfe des Vorwurfs.
- source_word: הִכָּלֵם
  choice: dich zu schämen
  rationale: Der Infinitiv bezeichnet hier das Empfinden von Scham; die reflexive deutsche Wendung ist natürlich und präzise.
theological_decisions:
- issue: Sexuelle Untreue als Bild für den Bruch des Bundes
  choice: Die konkrete Wendung „die Stirn einer Prostituierten“ bleibt stehen.
  alternative: „Du warst schamlos“ oder „du warst dreist“.
  rationale: Das Bild der Prostitution verbindet Judas Götzendienst mit ehelicher beziehungsweise bundesbezogener Untreue. Eine bloße Aussage über Dreistigkeit würde diese prophetische und theologische Bildwelt abschwächen.
- issue: Nicht genannter Urheber des ausbleibenden Regens
  choice: „blieben … aus“ lässt den Handelnden unausgesprochen.
  alternative: „wurden zurückgehalten“ oder „Gott hielt … zurück“.
  rationale: Die passive hebräische Form passt im Kontext zu göttlichem Gericht, nennt Gott in diesem Vers jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese Zurückhaltung und führt keinen expliziten Urheber ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Schärfe. Die konkrete Stirnmetapher und die sexuelle Bildsprache werden nicht verallgemeinert oder beschönigt; die Regenterme werden für heutige Leser natürlich wiedergegeben.
