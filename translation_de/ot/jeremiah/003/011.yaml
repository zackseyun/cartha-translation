id: JER.3.11
reference: Jeremiah 3:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י צִדְּקָ֥ה נַפְשָׁ֖/הּ מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל מִ/בֹּגֵדָ֖ה יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/011.yaml
  text: And Yahweh said to me[a], “Faithless Israel has shown herself more righteous than treacherous Judah.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Israel, die Abtrünnige[a], hat sich als gerechter erwiesen als Juda, die Treulose.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Israel, die Abgefallene«.'
    reason: Lexikalische Alternative für מְשֻׁבָה, das Israels Abwendung von Jahwe beziehungsweise seinen Abfall bezeichnet.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Gibt das erzählende Wayyiqtol von אמר in natürlichem modernem Deutsch wieder; »da« markiert den Fortgang der Erzählung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Bewahrt den persönlichen Bundesnamen Gottes in der im Deutschen etablierten Form.
- source_word: אֵלַי
  choice: zu mir
  rationale: Natürliche deutsche Wiedergabe der Präposition mit Suffix der ersten Person Singular.
- source_word: צִדְּקָה נַפְשָׁהּ
  choice: hat sich als gerechter erwiesen
  rationale: Gibt die reflexive Wendung und den durch מן ausgedrückten Vergleich wieder. Die Formulierung bezeichnet relative Gerechtigkeit gegenüber Juda, nicht absolute Schuldlosigkeit.
- source_word: מְשֻׁבָה
  choice: die Abtrünnige
  rationale: Bezeichnet Israel als diejenige, die sich von Jahwe abgewandt hat. Die feminine substantivische Form wahrt die Personifikation und den Gegensatz zu Juda.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Übliche deutsche Form des Namens; hier als weiblich personifiziertes Gemeinwesen verstanden.
- source_word: מִבֹּגֵדָה
  choice: als Juda, die Treulose
  rationale: Das מן ist komparativ; בגד bezeichnet verräterische Untreue in einer Bundesbeziehung. »die Treulose« wahrt die feminine Personifikation.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Übliche deutsche Form für das personifizierte Südreich.
theological_decisions:
- issue: Relative Gerechtigkeit Israels gegenüber Juda
  choice: Israel hat sich im Vergleich zu Juda als gerechter erwiesen.
  alternative: Israel hat sich gegenüber Juda gerechtfertigt oder wird im Gegensatz zu Juda für gerecht erklärt.
  rationale: Der hebräische Satz vergleicht zwei schuldige Gemeinwesen. Die Übersetzung bewahrt die überraschende relative Wertung, ohne Israel absolute Gerechtigkeit oder Schuldlosigkeit zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionellen Bezeichnungen »die Abtrünnige« und »die Treulose« erhalten die weibliche Personifikation beider Reiche und machen den pointierten Vergleich klar.
