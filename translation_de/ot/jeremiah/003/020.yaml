  variant: modern standard German
source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
translation:
  language: de
  text: Ja, wie eine Frau ihrem Gefährten die Treue bricht[a], so habt ihr mir die Treue gebrochen, Haus Israel – spricht der HERR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine Ehefrau ihrem Mann die Treue bricht“. Wörtlich stehen im Hebräischen „eine Frau“ und „ihr Gefährte“; der größere Zusammenhang beschreibt Israels Untreue jedoch mit Bildern aus der Ehe.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: Ja
  rationale: Die Partikel bekräftigt die folgende Aussage. „Ja“ gibt diese nachdrückliche Funktion in natürlichem Deutsch wieder, ohne den möglichen Zusammenhang vorschnell als reinen Gegensatz festzulegen.
- source_word: בָּגְדָה / בְּגַדְתֶּם
  choice: die Treue bricht / habt ... die Treue gebrochen
  rationale: בגד bezeichnet treuloses oder verräterisches Handeln, besonders innerhalb einer Beziehung oder eines Bundes. Die deutsche Wendung „die Treue brechen“ bewahrt den relationalen und moralischen Gehalt und lässt die Ehemetaphorik des Zusammenhangs anklingen.
- source_word: אִשָּׁה
  choice: eine Frau
  rationale: אִשָּׁה kann „Frau“ oder „Ehefrau“ bedeuten. Da der Vers den Ehestatus nicht ausdrücklich bezeichnet, bleibt der Haupttext bei der weiteren Bedeutung.
- source_word: מֵרֵעָהּ
  choice: ihrem Gefährten
  rationale: רֵעַ bezeichnet einen Gefährten, Vertrauten oder Nächsten. „Gefährte“ erhält die lexikalische Weite und passt zugleich zur engen Beziehung, die das Bild voraussetzt.
- source_word: כֵּן
  choice: so
  rationale: „So“ bildet die knappe Entsprechung zwischen Vergleich und Anwendung idiomatisch ab.
- source_word: בִּי
  choice: mir
  rationale: Bei בגד kennzeichnet ב die Person, an der treulos gehandelt wird. „Mir die Treue brechen“ ist die natürliche deutsche Konstruktion.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die kollektive Bundesbezeichnung wird bewahrt. Das vorangehende „ihr“ gibt zudem den hebräischen Plural der Anrede wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die geläufige deutsche Prophetenformel gibt den feierlichen Charakter von נְאֻם wieder; der Gottesname יהוה wird gemäß der Übersetzungskonvention als „der HERR“ wiedergegeben.
theological_decisions:
- issue: Beziehungsmetapher im Vergleich
  choice: Der Haupttext spricht von einer Frau und ihrem Gefährten, ohne die Beziehung ausdrücklich als Ehe zu bestimmen.
  alternative: „wie eine Ehefrau ihrem Mann die Treue bricht“
  rationale: Der weitere Zusammenhang von Jeremia 3 verwendet deutlich eheliche Bilder für Israels Bundestreue. Die Wörter אִשָּׁה und רֵעַ lassen hier jedoch für sich genommen eine weitere Wiedergabe zu. Daher bleibt diese Offenheit im Haupttext erhalten und die eheliche Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Wendung „die Treue brechen“ macht die Entsprechung zwischen dem menschlichen Vergleich und Israels Verhalten deutlich. Der Gedankenstrich vor der Prophetenformel sorgt für einen natürlichen, feierlichen Abschluss.
