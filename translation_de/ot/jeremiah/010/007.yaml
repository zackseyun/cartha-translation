id: JER.10.7
reference: Jeremiah 10:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִ֣י לֹ֤א יִֽרָאֲ/ךָ֙ מֶ֣לֶךְ הַ/גּוֹיִ֔ם כִּ֥י לְ/ךָ֖ יָאָ֑תָה כִּ֣י בְ/כָל חַכְמֵ֧י הַ/גּוֹיִ֛ם וּ/בְ/כָל מַלְכוּתָ֖/ם מֵ/אֵ֥ין כָּמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/007.yaml
  text: Who would not fear you[a], O King of the nations? For this is your due; for among all the wise men of the nations and in all their kingdoms[b], there is none like you.
translation:
  language: de
  text: Wer sollte dich nicht fürchten[a], König der Völker? Denn das gebührt dir; denn unter allen Weisen der Völker und in all ihren Königreichen[b] ist niemand wie du.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer würde dich nicht fürchten?“ Die hebräische rhetorische Frage kann sowohl ausdrücken, was zu erwarten ist, als auch, was sich gehört.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Herrschaft“ oder „Königtum“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרָאֲךָ
  choice: sollte dich nicht fürchten
  rationale: Die rhetorische Frage מִי לֹא mit Imperfekt kann sowohl Erwartung als auch Angemessenheit ausdrücken. „Sollte … nicht“ klingt im Deutschen natürlich und betont hier die gebotene Reaktion; „fürchten“ bewahrt die Spannung zwischen Furcht und ehrfürchtigem Staunen.
- source_word: מֶלֶךְ הַגּוֹיִם
  choice: König der Völker
  rationale: Die direkte Wiedergabe der Status-constructus-Verbindung bewahrt den universalen Königstitel und ist im Deutschen idiomatisch.
- source_word: יָאָתָה
  choice: das gebührt dir
  rationale: Das Verb bezeichnet, was jemandem angemessen ist oder rechtmäßig zukommt. Im Zusammenhang bezieht sich „das“ auf die zuvor genannte Gottesfurcht.
- source_word: חַכְמֵי הַגּוֹיִם
  choice: die Weisen der Völker
  rationale: „Die Weisen“ gibt die substantivische Personenbezeichnung knapp und natürlich wieder, ohne das grammatische Maskulinum unnötig hervorzuheben.
- source_word: מַלְכוּתָם
  choice: ihre Königreiche
  rationale: Im pluralischen, possessiven Zusammenhang ist „Königreiche“ die klarste räumlich-politische Wiedergabe von מַלְכוּת.
- source_word: מֵאֵין כָּמוֹךָ
  choice: ist niemand wie du
  rationale: Die idiomatische Wendung drückt absolute Unvergleichlichkeit aus; die deutsche Form ist klar und quellennah.
- source_word: כִּי ... כִּי
  choice: Denn ... denn ...
  rationale: Die zweimalige kausale Verknüpfung bleibt sichtbar und bewahrt den argumentativen Aufbau des Verses.
theological_decisions:
- issue: Gottes Königtum über die Völker
  choice: König der Völker
  alternative: König über die Völker
  rationale: Die Übersetzung folgt unmittelbar der hebräischen Genitivverbindung und bewahrt die Aussage von Gottes universaler Königsherrschaft ohne erläuternde Erweiterung.
- issue: Bedeutung der Gottesfurcht
  choice: dich fürchten
  alternative: dich verehren
  rationale: „Fürchten“ erhält den starken biblischen Begriff und lässt seine Spannung zwischen Furcht und Ehrfurcht bestehen, statt ihn auf Verehrung oder Respekt zu verengen.
- issue: Modalität der rhetorischen Frage
  choice: Wer sollte dich nicht fürchten?
  alternative: Wer würde dich nicht fürchten?
  rationale: Das Hebräische lässt Erwartung und sittliche Angemessenheit anklingen. Im Kontext des folgenden „das gebührt dir“ tritt die Angemessenheit besonders hervor; die Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt ohne das im heutigen Deutsch gehobene und weniger natürliche „o“. Die Wiederholung von „denn“ bildet die zweifache Begründung des Hebräischen ab.
