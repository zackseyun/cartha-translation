base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/004.yaml
  text: They decorate it with silver and with gold[b][a]; they fasten it with nails and with hammers so that it will not totter.
translation:
  language: de
  text: Sie schmücken es mit Silber und mit Gold; mit Nägeln und Hämmern befestigen sie es[a], damit es nicht wankt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb hat hier ein pluralisches Objektsuffix: „sie machen sie fest“, während das vorangehende Verb ein singularisches Objekt hat. Der Bezug des Plurals ist unsicher.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Oder: „damit es sich nicht bewegt“ beziehungsweise „nicht ins Wanken gerät“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: mit Silber und mit Gold
  rationale: Die Präposition ב bezeichnet hier Material beziehungsweise Mittel. Die Wiederholung von „mit“ bewahrt den Parallelismus des Hebräischen.
- source_word: יְיַפֵּהוּ
  choice: sie schmücken es
  rationale: Das Piel von יפה bedeutet „schön machen, schmücken, verzieren“. „Schmücken“ ist gegenwärtiges, natürliches Deutsch und gibt das singularische Objekt wieder.
- source_word: בְּמַסְמְרוֹת וּבְמַקָּבוֹת
  choice: mit Nägeln und Hämmern
  rationale: מסמרות bezeichnet Nägel oder Pflöcke, מקבות Hämmer oder Schlägel. Im Zusammenhang der Befestigung ist „Nägel und Hämmer“ die klarste Wiedergabe.
- source_word: יְחַזְּקוּם
  choice: befestigen sie es
  rationale: Das Piel von חזק bezeichnet hier das Fest- oder Sichermachen. Für den im Kontext singularisch dargestellten Gegenstand ist „es befestigen“ im Deutschen verständlich; die abweichende pluralische Endung des hebräischen Wortes wird in einer Fußnote offengelegt.
- source_word: וְלֹא יָפִיק
  choice: damit es nicht wankt
  rationale: Nach der Befestigung ist die Verbindung als Zweck beziehungsweise Folge zu verstehen. יפיק bezeichnet hier instabiles Schwanken oder Wanken, nicht bloß jede beliebige Bewegung.
theological_decisions:
- issue: Satirische Darstellung des Götzenbildes
  choice: Die handwerkliche Ausschmückung und notwendige Befestigung werden sachlich und anschaulich wiedergegeben.
  alternative: Eine neutrale Beschreibung der Herstellung ohne deutlich wahrnehmbare Hilflosigkeit des Gegenstands.
  rationale: Jeremia 10,3–5 verspottet menschengemachte Kultbilder, die nicht aus eigener Kraft stehen oder handeln können. „Damit es nicht wankt“ erhält diese Aussage, ohne zusätzliche theologische Deutung einzutragen.
- issue: Numerus des Objekts bei יְחַזְּקוּם
  choice: Im Haupttext steht das singularische „es“, mit einer textkritisch-grammatischen Fußnote zur pluralischen hebräischen Endung.
  alternative: „Sie befestigen sie“, verstanden als Rückbezug auf mehrere Bilder oder Gegenstände.
  rationale: Der vorhergehende Objektsuffix in יְיַפֵּהוּ und der unmittelbare Bildzusammenhang sind singularisch, während יְחַזְּקוּם formal einen pluralischen Suffix trägt. Die Fußnote bewahrt diese echte Spannung, ohne den deutschen Haupttext unverständlich zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und bildhaft; der wiederholte Materialausdruck „mit Silber und mit Gold“ lehnt sich an den hebräischen Parallelismus an. Die satirische Wirkung entsteht aus dem beschriebenen Vorgang selbst und wird nicht durch wertende Zusätze verstärkt.
