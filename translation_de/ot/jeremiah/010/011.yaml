  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ/דְנָה֙ תֵּאמְר֣וּן לְ/ה֔וֹם אֱלָ֣הַיָּ֔/א דִּֽי שְׁמַיָּ֥/א וְ/אַרְקָ֖/א לָ֣א עֲבַ֑דוּ יֵאבַ֧דוּ מֵֽ/אַרְעָ֛/א וּ/מִן תְּח֥וֹת שְׁמַיָּ֖/א אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/011.yaml
  text: 'Thus you shall say to them: “The gods that did not make the heavens and the earth will perish from the earth and from under these heavens.”[a][b]'
translation:
  language: de
  text: 'So sollt ihr zu ihnen sagen: »Die Götter, die Himmel und Erde nicht gemacht haben, werden von der Erde und unter diesem Himmel verschwinden.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »werden zugrunde gehen« oder »werden vernichtet werden«. Das aramäische Verb kann das Vergehen, Verschwinden oder Vernichtetwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit »die Götter« können Götzenbilder, vermeintliche Gottheiten oder beide gemeint sein; der polemische Ausdruck bleibt bewusst weit.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּדְנָה
  choice: So
  rationale: Das aramäische demonstrative Adverb leitet die auszusprechende Formel ein; »So« ist im Deutschen natürlich und bewahrt den deiktischen Sinn.
- source_word: תֵּאמְרוּן לְהוֹם
  choice: sollt ihr zu ihnen sagen
  rationale: Der Imperfekt der 2. Person Plural steht hier als Anweisung; »sollt« gibt diese direkt wieder.
- source_word: אֱלָהַיָּא
  choice: die Götter
  rationale: Der determinierte aramäische Plural bezeichnet die Götter als die angegriffene Gruppe, ohne festzulegen, ob Götzenbilder, vermeintliche Gottheiten oder beides gemeint sind.
- source_word: שְׁמַיָּא וְאַרְקָא
  choice: Himmel und Erde
  rationale: Die feste deutsche Wendung bezeichnet die gesamte geschaffene Welt und gibt das kosmische Wortpaar idiomatisch wieder.
- source_word: לָא עֲבַדוּ
  choice: nicht gemacht haben
  rationale: Der negierte Perfekt beschreibt, was diese Götter nicht getan haben; das deutsche Perfekt passt natürlich in den Relativsatz.
- source_word: יֵאבַדוּ
  choice: werden … verschwinden
  rationale: אבד kann zugrunde gehen, vernichtet werden oder aus dem Bereich verschwinden bedeuten. Im Zusammenhang mit den beiden מִן-Angaben gibt »verschwinden« die Entfernung aus Erde und Himmel natürlich wieder, ohne eine ausdrückliche Passivhandlung einzutragen.
- source_word: מֵאַרְעָא
  choice: von der Erde
  rationale: Wegen des vorausgehenden kosmischen Wortpaars ist »Erde« hier gegenüber »Land« vorzuziehen.
- source_word: וּמִן תְּחוֹת שְׁמַיָּא אֵלֶּה
  choice: und unter diesem Himmel
  rationale: תְּחוֹת bezeichnet den Raum unterhalb; אֵלֶּה ist demonstrativ. Da »Himmel« im Deutschen gewöhnlich singularisch gebraucht wird, gibt »diesem Himmel« den demonstrativen und kosmischen Bezug natürlich wieder.
theological_decisions:
- issue: Bezug von »die Götter«
  choice: Die breite polemische Bezeichnung bleibt im Haupttext stehen.
  alternative: Die Götter ausdrücklich als Götzenbilder oder als geistliche Wesen bestimmen.
  rationale: Der aramäische Text legt nicht abschließend fest, ob materielle Götzen, vermeintliche Gottheiten oder beides gemeint sind. Die Übersetzung wahrt diese Spannung.
- issue: Art ihres Endes
  choice: »werden … verschwinden«
  alternative: »werden zugrunde gehen« oder »werden vernichtet werden«
  rationale: Die Aussage ihres sicheren Endes bleibt erhalten, ohne unnötig festzulegen, ob das Verb intransitives Vergehen oder bewirkte Vernichtung hervorhebt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Anweisung ist klar und direkt; die wörtliche Wiederholung von »Erde« und »Himmel« erhält den kosmischen Gegensatz. Alle Fußnotenmarker stehen im Haupttext.
