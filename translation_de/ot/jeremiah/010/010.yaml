  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אֱלֹהִים֙ אֱמֶ֔ת הֽוּא אֱלֹהִ֥ים חַיִּ֖ים וּ/מֶ֣לֶךְ עוֹלָ֑ם מִ/קִּצְפּ/וֹ֙ תִּרְעַ֣שׁ הָ/אָ֔רֶץ וְ/לֹֽא יָכִ֥לוּ גוֹיִ֖ם זַעְמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/010.yaml
  text: But Yahweh is the true God[a]; he is the living God and the everlasting King. At his wrath the earth quakes[c][b], and the nations cannot endure his indignation.
translation:
  language: de
  text: Doch[a] Jahwe ist der wahre Gott[b]; er ist der lebendige Gott und der König in Ewigkeit[c]. Vor seinem Zorn erbebt die Erde, und die Völker können seinen Grimm nicht ertragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und Jahwe“. Die Konjunktion kann rein verbindend sein; im Zusammenhang hebt sie wahrscheinlich den Gegensatz zu den zuvor beschriebenen Götzen hervor.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Gott der Wahrheit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der ewige König“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Doch Jahwe
  rationale: Die Konjunktion וְ kann schlicht verbindend oder im Zusammenhang gegensätzlich verstanden werden. Nach der Schilderung der nichtigen Götzen bringt „Doch“ den naheliegenden Kontrast zum Ausdruck; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אֱלֹהִים אֱמֶת
  choice: der wahre Gott
  rationale: Die Wortgruppe bezeichnet im Gegensatz zu den falschen Göttern des Kontexts am wahrscheinlichsten den Gott, der wirklich Gott ist. „Gott der Wahrheit“ bleibt grammatisch und lexikalisch möglich.
- source_word: אֱלֹהִים חַיִּים
  choice: der lebendige Gott
  rationale: Diese natürliche deutsche Wendung bewahrt den Gegensatz zwischen Jahwe, der lebt, und den leblosen Götzen.
- source_word: וּמֶלֶךְ עוֹלָם
  choice: und König in Ewigkeit
  rationale: עוֹלָם bezeichnet hier unbegrenzte Dauer. „König in Ewigkeit“ gibt die fortdauernde Königsherrschaft wieder, ohne die mögliche Wiedergabe „der ewige König“ auszuschließen.
- source_word: מִקִּצְפּוֹ
  choice: Vor seinem Zorn
  rationale: מִן kann hier Ursache beziehungsweise den auslösenden Anlass bezeichnen. „Vor seinem Zorn“ ist im Deutschen idiomatisch und wahrt das Bild einer Reaktion auf Gottes Zorn.
- source_word: תִּרְעַשׁ הָאָרֶץ
  choice: erbebt die Erde
  rationale: רעש bezeichnet heftiges Beben oder Erschüttern. „Erde“ passt zur universalen Aussage über Gottes Herrschaft und die Völker besser als das räumlich begrenztere „Land“.
- source_word: וְלֹא יָכִלוּ גוֹיִם
  choice: und die Völker können … nicht ertragen
  rationale: יכל mit dem folgenden Gegenstand bezeichnet Unvermögen. „Ertragen“ gibt wieder, dass die Völker unter Gottes Grimm nicht standhalten können.
- source_word: זַעְמוֹ
  choice: seinen Grimm
  rationale: זַעַם bezeichnet heftigen, oft göttlichen Zorn. „Grimm“ bewahrt die Intensität und unterscheidet das Wort im Deutschen von קֶצֶף („Zorn“) im vorherigen Satzteil.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֱלֹהִים אֱמֶת
  choice: der wahre Gott
  alternative: Gott der Wahrheit
  rationale: Im polemischen Gegensatz zu den Götzen besagt die Wendung wahrscheinlich, dass Jahwe der wirkliche, wahre Gott ist. Die mögliche Bedeutung, dass er ein Gott der Wahrheit beziehungsweise Treue ist, wird in der Fußnote offengehalten.
- issue: Geltungsdauer des Königtums in מֶלֶךְ עוֹלָם
  choice: König in Ewigkeit
  alternative: der ewige König
  rationale: Die Hauptfassung betont die nie endende Königsherrschaft; die Alternative versteht עוֹלָם enger als nähere Bestimmung des Königs. Beide ergeben hier einen eng verwandten Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbebt“ und „Grimm“ halten den feierlichen Ton, bleiben aber allgemein verständlich. Die parallelen Gottesbezeichnungen und der Wechsel zwischen „Zorn“ und „Grimm“ entsprechen der hebräischen Ausdrucksweise.
