  source_fidelity: 'Der deutsche Text gibt die drei Prädikate und ihre instrumentalen Angaben zuverlässig wieder: עֹשֵׂה als vergangenheitsbezogenes „schuf“, מֵכִין als „gründete“ im Sinn von fest einrichten/etablieren und נָטָה als bildhaftes „spannte ... aus“. „Erde“, „Welt“, „Weisheit“, „Einsicht“ und „Himmel“ entsprechen dem kosmischen und poetischen Kontext. Der singularische Kollektivbegriff „Himmel“ ist im modernen Deutsch für שָׁמַיִם idiomatisch.'
