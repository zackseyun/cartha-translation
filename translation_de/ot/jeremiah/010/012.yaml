source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/012.yaml
  text: He made the earth by his power[a]; he established the world by his wisdom[b], and by his understanding he stretched out the heavens.
translation:
  language: de
  text: Er schuf die Erde durch seine Kraft[a], gründete die Welt[b] durch seine Weisheit und spannte durch seine Einsicht den Himmel aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er macht die Erde durch seine Kraft“. Im Hebräischen stehen hier und bei „gründete“ Partizipien, die auch gegenwärtig oder als bleibende Kennzeichnung verstanden werden können.'
    reason: grammatical_ambiguity
  - marker: b
    text: Das hebräische Wort bezeichnet häufig die geordnete oder bewohnte Welt.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: schuf
  rationale: Das Partizip von עשה bezeichnet hier Gottes schöpferisches Handeln. „Schuf“ gibt dies im Deutschen natürlich und im Einklang mit dem abschließenden Vergangenheitsverb wieder; die partizipiale Form und ihre mögliche präsentische Wiedergabe werden in der Fußnote offengelegt.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Der kosmische Zusammenhang und die Gegenüberstellung mit dem Himmel sprechen für „Erde“ statt „Land“.
- source_word: בְּכֹחוֹ
  choice: durch seine Kraft
  rationale: Die Präposition ב bezeichnet hier das Mittel; „durch“ macht den instrumentalen Sinn klar. כֹּחַ wird angemessen mit „Kraft“ wiedergegeben.
- source_word: מֵכִין
  choice: gründete
  rationale: Das Hifil von כון bezeichnet das feste Einrichten oder Gründen. „Gründete“ ist im kosmischen Zusammenhang idiomatisch und bewahrt das Bild einer geordneten, gefestigten Welt.
- source_word: תֵּבֵל
  choice: die Welt
  rationale: תבל bezeichnet häufig die geordnete beziehungsweise bewohnte Welt. „Welt“ ist die natürliche deutsche Entsprechung; die Bedeutungsnuance wird in einer Fußnote erläutert.
- source_word: בְּחָכְמָתוֹ
  choice: durch seine Weisheit
  rationale: „Weisheit“ bewahrt den üblichen und theologisch bedeutsamen Sinn von חָכְמָה; „durch“ gibt das instrumentale ב wieder.
- source_word: וּבִתְבוּנָתוֹ
  choice: und durch seine Einsicht
  rationale: „Einsicht“ unterscheidet תְּבוּנָה von der unmittelbar zuvor genannten Weisheit, ohne beide Begriffe voneinander zu isolieren.
- source_word: נָטָה
  choice: spannte ... aus
  rationale: נטה bezeichnet beim Himmel dessen Ausspannen oder Ausbreiten. „Ausspannen“ erhält das anschauliche räumliche Bild.
- source_word: שָׁמָיִם
  choice: den Himmel
  rationale: Obwohl שָׁמַיִם formal pluralisch ist, ist „der Himmel“ im modernen Standarddeutsch die natürliche kollektive Bezeichnung; „die Himmel“ wäre hier unnötig altertümlich.
theological_decisions:
- issue: Das göttliche Subjekt ist in diesem Vers nicht ausdrücklich genannt.
  choice: Das Pronomen „Er“ führt den aus dem Zusammenhang erkennbaren göttlichen Referenten fort.
  alternative: „Gott schuf …“ oder „Der HERR schuf …“
  rationale: Ein Pronomen bewahrt den Textzusammenhang, ohne einen Gottesnamen oder Titel einzufügen, der in diesem Versglied nicht steht.
- issue: Zeitliche Aussage der beiden hebräischen Partizipien
  choice: Die Partizipien werden im Haupttext als vergangene Schöpfungshandlungen wiedergegeben.
  alternative: „Er macht die Erde … und gründet die Welt …“ oder substantivisch „Er ist es, der …“
  rationale: Das abschließende Perfekt נָטָה und der Schöpfungszusammenhang stützen eine rückblickende Wiedergabe. Da die Partizipien auch eine gegenwärtige beziehungsweise charakterisierende Aussage zulassen, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer poetischer Parallelität. Die Satzstellung variiert behutsam, um Wiederholungen schwerfälliger Konstruktionen zu vermeiden, ohne die drei instrumentalen Aussagen zu verwischen.
