  terminology: „Kraft“, „Weisheit“ und „Einsicht“ halten die im Hebräischen unterschiedenen Begriffe כֹּחַ, חָכְמָה und תְּבוּנָה auseinander. „Welt“ für תֵּבֵל ist angemessen; die Fußnote erläutert dessen Nuance. Die Fußnote zu a benennt zutreffend, dass die ersten beiden Formen Partizipien sind und auch präsentisch bzw. charakterisierend verstanden werden können.
