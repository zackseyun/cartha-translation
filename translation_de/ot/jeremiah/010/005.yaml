  text: כְּ/תֹ֨מֶר מִקְשָׁ֥ה הֵ֨מָּה֙ וְ/לֹ֣א יְדַבֵּ֔רוּ נָשׂ֥וֹא יִנָּשׂ֖וּא כִּ֣י לֹ֣א יִצְעָ֑דוּ אַל תִּֽירְא֤וּ מֵ/הֶם֙ כִּי לֹ֣א יָרֵ֔עוּ וְ/גַם הֵיטֵ֖יב אֵ֥ין אוֹתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/005.yaml
  text: They are like a scarecrow in a cucumber field[a], and they cannot speak; they must be carried, because they cannot walk. Do not fear them, for they cannot do harm[b], nor can they do good.
translation:
  language: de
  text: Sie sind wie eine Vogelscheuche in einem Gurkenfeld[a] und können nicht reden. Sie müssen getragen werden, denn sie können nicht gehen. Fürchtet euch nicht vor ihnen, denn sie können keinen Schaden anrichten und auch nichts Gutes tun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Pfahl im Melonenfeld“. Das hebräische Bild ist unsicher; gemeint ist wohl eine aufrecht stehende, leblose Gestalt in einem Gemüsefeld.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher kann der letzte Satzteil wiedergegeben werden: „und Gutes zu tun ist nicht bei ihnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹמֶר מִקְשָׁה
  choice: wie eine Vogelscheuche im Gurkenfeld
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich eine aufrecht stehende, leblose Gestalt oder einen Pfahl in einem Gurken- beziehungsweise Melonenfeld. Im Zusammenhang mit den unbeweglichen Götzen vermittelt „Vogelscheuche“ das Bild im Deutschen anschaulich; die Unsicherheit bleibt in der Fußnote erhalten.
- source_word: וְלֹא יְדַבֵּרוּ
  choice: und können nicht reden
  rationale: Der Zusammenhang betont nicht bloß, dass die Götzen gerade nicht reden, sondern dass sie dazu unfähig sind.
- source_word: נָשׂוֹא יִנָּשׂוּא
  choice: sie müssen getragen werden
  rationale: 'Die Verbindung von Infinitivus absolutus und finitem Passivverb verstärkt die Aussage: Die Götzen sind darauf angewiesen, getragen zu werden.'
- source_word: כִּי לֹא יִצְעָדוּ
  choice: denn sie können nicht gehen
  rationale: צעד bezeichnet das Schreiten oder Gehen. Hier unterstreicht es die Unbeweglichkeit der Götzen.
- source_word: אַל תִּירְאוּ מֵהֶם
  choice: Fürchtet euch nicht vor ihnen
  rationale: Die Formulierung gibt den verneinten Imperativ unmittelbar und in einem würdigen, geläufigen biblischen Register wieder.
- source_word: כִּי לֹא יָרֵעוּ
  choice: denn sie können keinen Schaden anrichten
  rationale: Der Hifil-Stamm von רעע bezeichnet hier das Zufügen von Bösem beziehungsweise Schaden. Im Kontext steht die Unfähigkeit der Götzen im Vordergrund.
- source_word: וְגַם הֵיטֵיב אֵין אוֹתָם
  choice: und auch nichts Gutes tun
  rationale: Die knappe deutsche Parallelformulierung gibt die ebenfalls verneinte Fähigkeit zum Guten natürlich wieder. Die eigentümlichere hebräische Ausdrucksweise wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Völlige Machtlosigkeit der Götzen
  choice: 'Die verneinten Handlungen werden als Unfähigkeit wiedergegeben: Sie können weder reden noch gehen, schaden oder Gutes tun.'
  alternative: 'Die Aussagen lediglich als gegenwärtige Nicht-Handlungen wiedergeben: Sie reden, gehen, schaden und helfen nicht.'
  rationale: Der unmittelbare Zusammenhang schildert von Menschen hergestellte, leblose Götzen, die getragen werden müssen. Die Wiedergabe mit „können nicht“ bringt diese sachlich angelegte Polemik zum Ausdruck, ohne eine zusätzliche konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. „Stehen sie da“ macht die im hebräischen Vergleich vorausgesetzte starre Erscheinung idiomatisch deutlich. Die Anrede im Plural folgt dem Hebräischen. Beide Fußnotenmarker erscheinen im Haupttext.
