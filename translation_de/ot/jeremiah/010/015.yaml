source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/015.yaml
  text: They are vanity, a work of mockery; at the time of their punishment they will perish.
translation:
  language: de
  text: Sie sind nichtig, ein Werk des Spotts; zur Zeit ihrer Bestrafung gehen sie zugrunde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: nichtig
  rationale: Bezeichnet hier die Substanzlosigkeit und Wertlosigkeit der Götzen; „nichtig“ gibt dies knapp und würdevoll wieder.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: ein lächerliches Machwerk
  rationale: Die seltene Wendung bezeichnet ein Erzeugnis, das Täuschung beziehungsweise Spott hervorruft. Im Zusammenhang der Götzenpolemik gibt „lächerliches Machwerk“ den spöttischen Sinn natürlich wieder, ohne dem Gegenstand Wirklichkeit oder Macht zuzuschreiben.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: wenn die Zeit ihrer Bestrafung kommt
  rationale: פְּקֻדָּה kann eine heimsuchende Rechenschaft oder Strafmaßnahme bezeichnen. Die kontextuell klare Bedeutung wird in verständlichem modernem Deutsch ausgedrückt.
- source_word: יֹאבֵדוּ
  choice: gehen sie zugrunde
  rationale: Gibt das vollständige Vergehen beziehungsweise Vernichtetwerden der Götzen idiomatisch wieder.
theological_decisions:
- issue: Bezug der angekündigten Bestrafung
  choice: Das Pronomen „sie“ bleibt wie im Hebräischen auf die nichtigen Götzen bezogen.
  alternative: Die Strafe ausdrücklich auf die Hersteller oder Verehrer der Götzen beziehen.
  rationale: Der unmittelbare grammatische Bezug sind die zuvor beschriebenen Götzen; eine ausdrückliche Umdeutung auf Menschen würde die Aussage des Ausgangstextes unnötig festlegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Ton. „Machwerk“ bewahrt die abwertende Schärfe der Götzenpolemik; die Satzstruktur bleibt nah am hebräischen Zweischritt von Bewertung und angekündigtem Untergang.
