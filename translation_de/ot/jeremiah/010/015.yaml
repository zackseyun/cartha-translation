  source_fidelity: Der Entwurf trifft הֶבֶל („nichtig“) und יֹאבֵדוּ („gehen zugrunde“) gut. Für בְּעֵת פְּקֻדָּתָם ist „zur Zeit ihrer Bestrafung“ näher am nominalen hebräischen Zeitausdruck als die umschreibende Bedingung „wenn ... kommt“. מַעֲשֵׂה תַּעְתֻּעִים bezeichnet ein Werk der Verspottung bzw. Täuschung; im hier maßgeblichen polemischen Kontext und entsprechend der englischen Audit-Fassung ist die Seite der Verspottung angemessen wiederzugeben.
  naturalness: „Sie sind nichtig“ und „gehen sie zugrunde“ sind modernes, würdiges Standarddeutsch. „Ein lächerliches Machwerk“ ist verständlich, verschiebt die Konstruktion aber zu einer bloßen Bewertung des Gegenstands und ist durch die doppelte Abwertung etwas freier. „Ein Werk des Spotts“ ist knapp, natürlich und näher an der hebräischen Nominalverbindung.
  terminology: „Nichtig“ bewahrt die für הֶבֶל typische Aussage von Wertlosigkeit/Substanzlosigkeit. „Werk des Spotts“ gibt die im englischen Audit gewählte Bedeutung „work of mockery“ wieder, ohne eine dogmatische Deutung einzutragen. „Bestrafung“ ist für פְּקֻדָּה im Kontext vertretbar; das Pronomen bleibt wie im Ausgangstext bei den Götzenbildern.
