id: JER.10.1
reference: Jeremiah 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֣וּ אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/001.yaml
  text: Hear the word that Yahweh has spoken concerning you[a], O house of Israel.
translation:
  language: de
  text: Hört das Wort, das Jahwe über euch[a] gesprochen hat, Haus Israel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: zu euch; je nach Zusammenhang auch: gegen euch.'
    reason: Die Präposition עַל lässt offen, ob das Wort Israel betrifft, an Israel gerichtet ist oder gegen Israel ergeht.
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Pluralimperativ eröffnet den prophetischen Aufruf und fordert die angesprochene Gemeinschaft zum aufmerksamen Hören auf.
- source_word: הַדָּבָר
  choice: das Wort
  rationale: „Das Wort“ bewahrt die geläufige prophetische Ausdrucksweise; „Botschaft“ wäre möglich, aber stärker deutend.
- source_word: אֲשֶׁר דִּבֶּר
  choice: das … gesprochen hat
  rationale: Das Perfekt bezeichnet die bereits ergangene, weiterhin maßgebliche Rede; das deutsche Perfekt gibt dies hier natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: עֲלֵיכֶם
  choice: über euch
  rationale: Die Präposition עַל kann hier den Gegenstand oder die Adressaten der Rede bezeichnen. „Über euch“ wahrt den Bezug auf Israel, ohne bereits eindeutig eine feindliche Aussage anzunehmen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die traditionelle prophetische Anrede bewahrt Israels gemeinschaftliche und bundesgeschichtliche Identität; ein vorangestelltes „o“ wäre im heutigen Deutsch unnötig altertümlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen JHWH. „Jahwe“ macht den Namen sichtbar, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Beziehungsrichtung von עֲלֵיכֶם
  choice: über euch
  alternative: zu euch; gegen euch
  rationale: Die Formulierung kann eine Israel betreffende, an Israel gerichtete oder im Zusammenhang auch gegen Israel ergehende Rede bezeichnen. Der Haupttext entscheidet sich für die sachlich offene Bedeutung „über euch“; die Fußnote erhält die weiteren Möglichkeiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe prophetische Aufruf und die kollektive Anrede bleiben erhalten; auf das heute altertümlich wirkende Anredepartikel „o“ wird verzichtet.
