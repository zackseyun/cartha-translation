  source_fidelity: Die Übersetzung gibt die schwierige Kollektivwendung, die beiden parallelen Aussagen über Unverstand und Torheit sowie die knappe Schlusspointe grundsätzlich treffend wieder. »Unterweisung« für מוּסָר und »ist Holz« für עֵץ הוּא sind quellentreu; die syntaktische Verdichtung der letzten Aussage bleibt erhalten.
