  text: וּ/בְ/אַחַ֖ת יִבְעֲר֣וּ וְ/יִכְסָ֑לוּ מוּסַ֥ר הֲבָלִ֖ים עֵ֥ץ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/008.yaml
  text: But together they are stupid and foolish[b][a]; the instruction of idols is wood.
translation:
  language: de
  text: Doch allesamt sind sie stumpfsinnig und töricht[a]; die Unterweisung der Götzen[b] ist Holz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und gleichermaßen sind sie unvernünftig und töricht«; die einleitende hebräische Wendung kann »allesamt«, »alle gleichermaßen« oder »in einer Hinsicht« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Nichtigkeiten«; in prophetischer Sprache ist dies häufig eine Bezeichnung für Götzen oder wertlose Dinge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַחַת
  choice: Doch allesamt
  rationale: 'Die schwierige Wendung bezeichnet hier angesichts der folgenden Pluralverben am ehesten die gemeinsame Gleichartigkeit: »allesamt« bzw. »alle gleichermaßen«. »Doch« gibt den Gegensatz zum vorangehenden Zusammenhang natürlich wieder.'
- source_word: יִבְעֲרוּ
  choice: sind sie stumpfsinnig
  rationale: בער ist hier im Sinn von »unverständig, vernunftlos« zu verstehen, nicht als das gleichlautende Verb »brennen«. »Stumpfsinnig« bewahrt die intellektuelle und moralische Schärfe, ohne einen tierbezogenen Ausdruck zu erzwingen.
- source_word: וְיִכְסָלוּ
  choice: und töricht
  rationale: כסל bedeutet hier »töricht sein«. Die koordinierte Adjektivkonstruktion ist im Deutschen natürlich und erhält den Parallelismus.
- source_word: מוּסַר
  choice: Unterweisung
  rationale: מוּסָר kann Unterweisung, Zucht oder Ermahnung bezeichnen. »Unterweisung« ist hier weit genug und bewahrt die zugespitzte Aussage über das, was von den Götzen ausgeht.
- source_word: הֲבָלִים
  choice: Nichtse
  rationale: Das Wort bezeichnet wörtlich Nichtigkeiten oder vergänglichen Hauch und wird in prophetischer Polemik für wertlose Götzen gebraucht. »Nichtse« lässt sowohl die Wertlosigkeit als auch den Bezug auf Götzen erkennen, ohne die Metapher ganz aufzulösen.
- source_word: עֵץ הוּא
  choice: ist Holz
  rationale: Die knappe verblosen Aussage hebt das tatsächliche Material des Götzen hervor. Die ebenso knappe deutsche Form bewahrt die schroffe Pointe.
theological_decisions:
- issue: Bezug und Aussagekraft des Schlusssatzes in der Götzenpolemik
  choice: Die angebliche Unterweisung der als »Nichtse« bezeichneten Götzen ist Holz.
  alternative: Der hölzerne Götze selbst ist der Lehrer; oder die Unterweisung wird bildlich als leblos beziehungsweise »hölzern« bezeichnet.
  rationale: Der hebräische Satz ist verdichtet und lässt den genauen syntaktischen Bezug offen. Die Formulierung bewahrt diese Spannung und zugleich die im Kontext von Jeremia 10 deutliche Pointe, dass die Götzen lediglich gefertigte Holzgegenstände sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Nichtse« ist bewusst markant gewählt, um die prophetische Verachtung auszudrücken und zugleich das hebräische Bild der Nichtigkeit nicht vollständig durch »Götzen« zu ersetzen. Die knappe Schlusswendung erhält die Härte und Mehrdeutigkeit des Ausgangstextes.
