source:
  edition: WLC
  text: לְ/ק֨וֹל תִּתּ֜/וֹ הֲמ֥וֹן מַ֨יִם֙ בַּ/שָּׁמַ֔יִם וַ/יַּעֲלֶ֥ה נְשִׂאִ֖ים מִ/קְצֵ֣ה ארץ בְּרָקִ֤ים לַ/מָּטָר֙ עָשָׂ֔ה וַ/יּ֥וֹצֵא ר֖וּחַ מֵ/אֹצְרֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/013.yaml
  text: At the sound of his voice[a], there is a roar of waters in the heavens, and he makes clouds rise from the ends of the earth; he makes lightning for the rain[b], and brings out the wind from his storehouses.
translation:
  language: de
  text: Wenn er seine Stimme erschallen lässt, brausen die Wasser am Himmel. Er lässt Wolken von den Enden der Erde aufsteigen, macht Blitze für den Regen[a] und holt den Wind aus seinen Vorratskammern hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »macht Blitze für den Regen«; die genaue Beziehung zwischen Blitz und Regen bleibt im Hebräischen offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Wenn er seine Stimme erschallen lässt
  rationale: Die wörtlich komprimierte Wendung »beim Laut seines Gebens« meint idiomatisch das Erschallen seiner Stimme. Die deutsche Formulierung bewahrt Gottes persönliche Stimme und passt zum akustischen Sturmgeschehen.
- source_word: הֲמוֹן מַיִם
  choice: brausen die Wasser
  rationale: הָמוֹן kann Menge, Getöse oder Brausen bezeichnen. Im Zusammenhang von Stimme, Wasser und Sturm steht der akustische Aspekt im Vordergrund.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: שָׁמַיִם bezeichnet hier den sichtbaren Himmel als Ort des Wettergeschehens. »Am Himmel« ist natürliches modernes Deutsch und vermeidet eine unnötige Verlagerung in einen rein jenseitigen Bereich.
- source_word: וַיַּעֲלֶה נְשִׂאִים
  choice: Er lässt Wolken ... aufsteigen
  rationale: Die Hifil-Form von עלה ist kausativ. נְשִׂאִים bezeichnet in diesem meteorologischen Kontext Wolken beziehungsweise aufsteigende Dunstmassen; »Wolken« ist die verständlichste Wiedergabe.
- source_word: מִקְצֵה אֶרֶץ
  choice: vom Ende der Erde
  rationale: Die Wendung bezeichnet den äußersten Rand beziehungsweise die fernsten Bereiche der Erde. Der Singular des Hebräischen wird beibehalten, ohne den idiomatischen Sinn einzuengen.
- source_word: בְּרָקִים לַמָּטָר עָשָׂה
  choice: macht Blitze zum Regen
  rationale: Die Wiedergabe bewahrt die knappe und semantisch offene Verbindung mit ל, ohne das genaue Verhältnis zwischen Blitz und Regen meteorologisch auszudeuten.
- source_word: וַיּוֹצֵא רוּחַ
  choice: und holt den Wind ... hervor
  rationale: רוּחַ bedeutet hier im Wetterzusammenhang »Wind«. »Hervorholen« gibt die Bewegung aus den nachfolgend genannten Vorratskammern anschaulich wieder.
- source_word: מֵאֹצְרֹתָיו
  choice: aus seinen Vorratskammern
  rationale: אֹצָר bezeichnet ein Lager oder eine Schatzkammer. »Vorratskammern« bewahrt das Bild, dass die Naturkräfte bei Gott verwahrt sind und von ihm hervorgeholt werden.
theological_decisions:
- issue: Persönliches Handeln Gottes im Sturmgeschehen
  choice: Die göttliche Stimme und das wiederholte aktive Handeln bleiben ausdrücklich erhalten.
  alternative: Eine entpersonalisierte Beschreibung natürlicher Wettervorgänge.
  rationale: Der hebräische Text stellt Wolken, Blitz, Regen und Wind als unmittelbar von Gott beherrschte Vorgänge dar. Diese Aussage darf nicht zu einer rein meteorologischen Schilderung abgeschwächt werden.
- issue: Bedeutung von רוּחַ
  choice: Wind
  alternative: Geist oder Atem
  rationale: Die Reihe von Wasser, Wolken, Blitz und Regen legt eindeutig die meteorologische Bedeutung nahe, ohne die sonstige Bedeutungsbreite des Wortes grundsätzlich aufzuheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher Sturmmetaphorik. Die komprimierte hebräische Anfangswendung wurde idiomatisch entfaltet; die ungewöhnliche Verbindung von Blitz und Regen wurde dagegen bewusst nicht weiter erklärt.
