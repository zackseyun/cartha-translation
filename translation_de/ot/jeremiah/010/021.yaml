id: JER.10.21
reference: Jeremiah 10:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י נִבְעֲרוּ֙ הָֽ/רֹעִ֔ים וְ/אֶת יְהוָ֖ה לֹ֣א דָרָ֑שׁוּ עַל כֵּן֙ לֹ֣א הִשְׂכִּ֔ילוּ וְ/כָל מַרְעִיתָ֖/ם נָפֽוֹצָה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/021.yaml
  text: For the shepherds have become stupid[a], and they have not sought Yahweh; therefore they have not acted wisely[c][b], and all their flock is scattered.
translation:
  language: de
  text: Denn die Hirten sind unverständig geworden[a] und haben Jahwe nicht gesucht. Darum haben sie nicht einsichtig gehandelt[b], und ihre ganze Herde ist zerstreut.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind stumpfsinnig geworden“; auch: „haben sich töricht verhalten“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb kann sowohl einsichtiges Handeln als auch erfolgreiches Handeln beziehungsweise Gelingen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: Mit den „Hirten“ sind hier wahrscheinlich die Führenden des Volkes gemeint; die „Herde“ bezeichnet entsprechend die Menschen unter ihrer Obhut.
    reason: cultural_note
lexical_decisions:
- source_word: נִבְעֲרוּ
  choice: sind unverständig geworden
  rationale: Das Nifal von בער bezeichnet einen vernunftlosen, abgestumpften Zustand. „Unverständig“ bewahrt den scharfen prophetischen Tadel, ohne im modernen Deutschen unnötig umgangssprachlich zu klingen.
- source_word: הָרֹעִים
  choice: die Hirten
  rationale: Die konkrete Hirtenmetapher bleibt erhalten; gemeint sind im Zusammenhang wahrscheinlich die Führenden des Volkes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: דָרָשׁוּ
  choice: haben ... nicht gesucht
  rationale: דרש kann das Suchen nach Gott ebenso wie das Befragen oder Sich-an-ihn-Wenden bezeichnen. „gesucht“ hält diese Bedeutungsbreite offen.
- source_word: עַל־כֵּן
  choice: Darum
  rationale: Die knappe deutsche Folgerung gibt den ursächlichen Zusammenhang natürlich wieder.
- source_word: הִשְׂכִּילוּ
  choice: haben sie nicht einsichtig gehandelt
  rationale: Das Hifil von שכל kann kluges bzw. einsichtiges Handeln und den daraus entstehenden Erfolg bezeichnen. Die Hauptübersetzung hebt das Handeln hervor; die mögliche Erfolgsbedeutung wird in der Fußnote bewahrt.
- source_word: מַרְעִיתָם
  choice: ihre ganze Herde
  rationale: Im Zusammenhang mit den „Hirten“ bezeichnet das Kollektivum das ihrer Obhut anvertraute Volk bzw. die Herde und nicht bloß den Weideplatz.
- source_word: נָפוֹצָה
  choice: ist zerstreut
  rationale: Das Verb פוץ bezeichnet das Auseinandergetrieben- oder Zerstreutsein. Der Singular passt zum kollektiven Subjekt „Herde“.
theological_decisions:
- issue: Bedeutung der Hirtenmetapher
  choice: „Hirten“ im Haupttext beibehalten
  alternative: „Führer“ oder „Herrscher“
  rationale: Die Metapher trägt zur prophetischen Anklage bei und sollte nicht durch eine Deutung ersetzt werden; eine Fußnote erläutert den wahrscheinlichen Bezug.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen; die Umschrift wahrt diesen Unterschied.
- issue: Mehrdeutigkeit von הִשְׂכִּילוּ
  choice: „einsichtig gehandelt“ mit Fußnote zur Erfolgsbedeutung
  alternative: „Erfolg gehabt“
  rationale: Die Form kann sowohl verständiges Handeln als auch Gelingen bezeichnen. Die Übersetzung entscheidet sich nicht stillschweigend gegen die zweite Nuance, sondern dokumentiert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Sätze bleiben knapp und folgen dem Begründungs- und Folgerungsgefüge des Hebräischen. „Unverständig“ ist deutlich, aber weniger umgangssprachlich als „dumm“; die Hirtenmetapher und die semantische Spannung von שכל bleiben erhalten.
