source:
  edition: WLC
  text: ק֤וֹל שְׁמוּעָה֙ הִנֵּ֣ה בָאָ֔ה וְ/רַ֥עַשׁ גָּד֖וֹל מֵ/אֶ֣רֶץ צָפ֑וֹן לָ/שׂ֞וּם אֶת עָרֵ֧י יְהוּדָ֛ה שְׁמָמָ֖ה מְע֥וֹן תַּנִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/022.yaml
  text: The sound of a report—look, it is coming!—a great commotion from the land of the north, to make the cities of Judah a desolation, a haunt of jackals.
translation:
  language: de
  text: 'Horch! Eine Nachricht – sieh, sie kommt! –: Ein gewaltiges Getöse kommt aus dem Land des Nordens, um die Städte Judas zur Einöde zu machen, zur Behausung von Schakalen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל שְׁמוּעָה֙
  choice: Horch! Eine Nachricht
  rationale: קול kann hier als Aufmerksamkeit weckender Ausruf („Horch!“) verstanden werden; שְׁמוּעָה bezeichnet eine Nachricht oder Kunde. Die Wiedergabe bildet den abrupten Warnruf natürlich und quellennah ab.
- source_word: הִנֵּ֣ה בָאָ֔ה
  choice: Seht, sie kommt!
  rationale: הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf das unmittelbar bevorstehende Eintreffen der grammatisch femininen „Nachricht“.
- source_word: רַ֥עַשׁ גָּד֖וֹל
  choice: ein gewaltiges Getöse
  rationale: רַעַשׁ bezeichnet ein lautes Dröhnen, Beben oder Getöse; „Getöse“ bewahrt die akustische Wirkung, ohne die Ursache festzulegen.
- source_word: מֵ/אֶ֣רֶץ צָפ֑וֹן
  choice: aus dem Land des Nordens
  rationale: Die traditionelle prophetische Richtungsangabe bleibt wörtlich erhalten.
- source_word: שְׁמָמָ֖ה
  choice: zur Einöde
  rationale: Das Substantiv bezeichnet einen verwüsteten, verlassenen Zustand; „Einöde“ ist prägnant und würdevoll.
- source_word: מְע֥וֹן תַּנִּֽים
  choice: zur Behausung der Schakale
  rationale: מָעוֹן ist Wohnstätte oder Behausung. תַּנִּים wird in diesem Verwüstungskontext am plausibelsten als Schakale verstanden.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt des Verwüstens
  choice: „Es wird … machen“, bezogen auf das angekündigte Geschehen beziehungsweise Getöse
  alternative: „um … zu machen“ oder ein ergänztes menschliches Subjekt wie „der Feind wird“
  rationale: Der hebräische Infinitiv לָשׂוּם nennt Zweck oder Folge, aber kein ausdrückliches handelndes Subjekt. Die Übersetzung ergänzt daher keinen bestimmten Feind und hält die Aussage offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit alarmierendem, abruptem Satzrhythmus. „Horch!“ gibt die idiomatische Kraft von קוֹל wieder; kurze Sätze bewahren die dramatische Ankündigung.
