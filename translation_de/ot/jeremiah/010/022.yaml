  source_fidelity: 'Die Grundbegriffe sind zutreffend wiedergegeben: die eintreffende Kunde, das große Getöse aus dem Norden, die Verwüstung der Städte Judas und die Behausung der Schakale. Das unbestimmte Subjekt des hebräischen Infinitivs wird zu Recht nicht als bestimmter Feind ausgelegt. Die Satzfolge des Entwurfs lässt jedoch das Verhältnis zwischen der Nachricht und dem Getöse weniger klar erkennen und macht aus der Zweck-/Folgeangabe einen selbständigen Zukunftssatz.'
  naturalness: „Horch!“ und „Getöse“ sind in modernem, würdigem Deutsch gut verständlich. Der isolierte Nominalsatz „Ein gewaltiges Getöse aus dem Land des Nordens“ wirkt jedoch im Deutschen unnötig abgebrochen; das anschließende „Es wird“ hat zudem keinen eindeutig natürlichen Bezug.
  terminology: „Einöde“, „Behausung“ und „Schakale“ sind passende, registergerechte Wiedergaben von שְׁמָמָה, מְעוֹן und תַּנִּים in diesem Verwüstungskontext. „Land des Nordens“ bewahrt die prophetische Ortsangabe ohne unnötige historische Festlegung.
