  text: אִסְפִּ֥י מֵ/אֶ֖רֶץ כִּנְעָתֵ֑/ךְ ישבתי בַּ/מָּצֽוֹר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/017.yaml
  text: Gather up your bundle from the land[a], you who dwell under siege.
translation:
  language: de
  text: Sammle dein Bündel vom Boden ein[a], du, die du unter Belagerung lebst!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sammle dein Bündel aus dem Land ein, du, die du unter Belagerung lebst!“ Das seltene hebräische Wort kann „Habe“, „Waren“, „Gepäck“ oder „Bündel“ bezeichnen. „Vom Boden“ versteht „Land/Erde“ hier konkret; möglich ist auch „aus dem Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפִּי
  choice: Raffe … auf
  rationale: Der feminine Singularimperativ von אסף fordert die als Frau angeredete Bewohnerin bzw. personifizierte Stadt nachdrücklich auf, ihre Habe zusammenzunehmen.
- source_word: מֵאֶרֶץ
  choice: vom Boden
  rationale: אֶרֶץ kann »Land«, »Erde« oder »Boden« bedeuten. Im Bild vom Aufnehmen eines Bündels liegt hier der konkrete Boden nahe; die Alternative »aus dem Land« bleibt in der Fußnote erhalten.
- source_word: כִּנְעָתֵךְ
  choice: dein Bündel
  rationale: Das seltene Substantiv bezeichnet wohl Habe, Waren oder Gepäck. »Bündel« passt zum singularischen Bild von Hab und Gut, das für Flucht oder Wegführung zusammengerafft wird.
- source_word: ישבתי
  choice: du Bewohnerin
  rationale: Die schwierige überlieferte Form wird kontextgemäß als feminine Anrede verstanden. »Bewohnerin« bildet Geschlecht und Anredefunktion ab, ohne eine bestimmte Identifizierung ausdrücklich in den Text einzutragen.
- source_word: בַּמָּצוֹר
  choice: der belagerten Stadt
  rationale: מָצוֹר kann Belagerung, Belagerungszustand oder einen befestigten beziehungsweise belagerten Ort bezeichnen. In Verbindung mit »Bewohnerin« ergibt »der belagerten Stadt« natürliches Deutsch.
theological_decisions:
- issue: Identität der weiblich angeredeten Person
  choice: Keine ausdrückliche Benennung als Zion oder Jerusalem
  alternative: »Tochter Zion« oder »Bewohnerin Jerusalems«
  rationale: Der Vers selbst enthält den Namen nicht. Die feminine Form wird durch »Bewohnerin« bewahrt, ohne die kontextuell naheliegende Identifizierung in den Wortlaut einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Singularanrede wird sichtbar erhalten. Der knappe Ausrufcharakter des Hebräischen wird durch den Imperativ und das Schlusszeichen wiedergegeben.
