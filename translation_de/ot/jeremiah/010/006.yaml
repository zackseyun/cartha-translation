source:
  edition: WLC
  text: מֵ/אֵ֥ין כָּמ֖וֹ/ךָ יְהוָ֑ה גָּד֥וֹל אַתָּ֛ה וְ/גָד֥וֹל שִׁמְ/ךָ֖ בִּ/גְבוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/006.yaml
  text: There is none like you[a], O Yahweh; you are great, and your name is great in might.
translation:
  language: de
  text: Niemand ist dir gleich, Jahwe[a]. Du bist groß, und dein Name ist groß an Macht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH, der Gottesname; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵין כָּמוֹךָ
  choice: Niemand ist dir gleich
  rationale: Die hebräische Verbindung verneint, dass es jemanden gibt, der mit dem Angesprochenen vergleichbar wäre. Die Formulierung ist im modernen Deutschen natürlich und bewahrt die direkte Anrede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben; eine Fußnote nennt die traditionelle Wiedergabe.
- source_word: גָּדוֹל אַתָּה
  choice: Du bist groß
  rationale: Die natürliche deutsche Wortstellung gibt die prädikative Aussage klar wieder, ohne ihren Nachdruck abzuschwächen.
- source_word: וְגָדוֹל שִׁמְךָ
  choice: und dein Name ist groß
  rationale: Die wörtliche Rede vom Namen bleibt erhalten und wahrt den Parallelismus zur vorigen Aussage; »Name« kann dabei auch Ruf und Ansehen einschließen.
- source_word: בִּגְבוּרָה
  choice: an Macht
  rationale: Die knappe Wendung gibt Macht beziehungsweise Stärke als den Bereich wieder, in dem Gottes Name groß ist, ohne sie auf bestimmte Machttaten einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als persönliche Anrede; die traditionelle deutsche Ersatzwiedergabe wird in der Fußnote transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper poetischer Parallelstruktur. Die Wiederholung von »groß« und das konkrete Wort »Name« bleiben bewusst erhalten.
