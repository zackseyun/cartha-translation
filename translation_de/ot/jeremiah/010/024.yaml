  terminology: „Jahwe“ gibt den Gottesnamen konsistent als Eigennamen wieder. Die zentralen Begriffe Recht, Zorn und Erziehung/Zurechtweisung sind sachlich und konfessionell nicht einengend behandelt. Die Alternativen in den Fußnoten sind passend und die Marker stehen an den jeweils betroffenen Ausdrücken.
