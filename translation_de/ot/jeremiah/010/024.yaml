source:
  edition: WLC
  text: יַסְּרֵ֥/נִי יְהוָ֖ה אַךְ בְּ/מִשְׁפָּ֑ט אַל בְּ/אַפְּ/ךָ֖ פֶּן תַּמְעִטֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/024.yaml
  text: Discipline me[a], Yahweh, but with justice, not in your anger[c][b], lest you diminish me.
translation:
  language: de
  text: Erziehe mich[a], Jahwe, doch nach Recht[b], nicht in deinem Zorn, damit du mich nicht gering machst[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weise mich zurecht“; traditionell: „Züchtige mich“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Gericht“ oder „nach gerechtem Maß“. Das hebräische Wort kann Recht, Gericht oder ein angemessenes Maß bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verminderst“ beziehungsweise wörtlich: „klein machst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסְּרֵנִי
  choice: Erziehe mich
  rationale: Das Piel von יסר bezeichnet zurechtweisende, formende Zucht. „Erziehe mich“ ist im modernen Deutsch verständlich und bewahrt den korrektiven Charakter, ohne das archaische „züchtige“ zu verwenden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel „HERR“ ersetzt.
- source_word: אַךְ
  choice: doch
  rationale: 'אַךְ schränkt die Bitte ein: Korrektur wird erbeten, jedoch nur auf die anschließend bezeichnete Weise.'
- source_word: בְּמִשְׁפָּט
  choice: nach Recht
  rationale: מִשְׁפָּט kann Recht, Gericht oder angemessenes Maß bezeichnen. „Nach Recht“ lässt diese Spannweite eher offen und bildet den Gegensatz zum Handeln im Zorn natürlich ab.
- source_word: בְּאַפְּךָ
  choice: in deinem Zorn
  rationale: אַף bezeichnet hier den göttlichen Zorn; die Präposition wird idiomatisch mit „in“ wiedergegeben.
- source_word: פֶּן
  choice: damit … nicht
  rationale: פֶּן leitet die befürchtete Folge ein. „Damit … nicht“ ist gegenwärtiges, natürliches Deutsch und erhält den vorbeugenden Sinn.
- source_word: תַּמְעִיטֵנִי
  choice: du mich gering machst
  rationale: Das Hiphil von מעט bedeutet wörtlich „klein/gering machen, vermindern“. Die Wiedergabe vermeidet die interpretierende Steigerung „vernichten“ beziehungsweise „zu nichts machen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Tetragrammaton als persönlichen Gottesnamen; die deutsche Form „Jahwe“ erhält diesen Charakter.
- issue: Bedeutung von מִשְׁפָּט in der Bitte um göttliche Zurechtweisung
  choice: nach Recht
  alternative: mit Gericht / nach gerechtem Maß
  rationale: Die Formulierung wahrt die Spannung zwischen notwendiger Korrektur und dem gefürchteten Zorn, ohne מִשְׁפָּט auf Milde oder Strafgericht festzulegen.
- issue: Stärke der Schlussaussage תַּמְעִיטֵנִי
  choice: damit du mich nicht gering machst
  alternative: damit du mich nicht verminderst / zu nichts machst
  rationale: Die grundsprachliche Aussage des Klein- oder Geringmachens bleibt erhalten; eine völlige Vernichtung wird nicht ausdrücklich in den Text hineingelesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erziehe“ vermeidet das heute leicht missverständliche oder körperlich klingende „züchtige“. Die Satzform bleibt knapp und gebetsartig; „nach Recht“ und „gering machst“ bewahren die Mehrdeutigkeit des Hebräischen.
