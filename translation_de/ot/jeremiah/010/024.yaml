  source_fidelity: 'Die Wiedergabe folgt dem Hebräischen sorgfältig: יַסְּרֵנִי wird als Bitte um korrektive Erziehung wiedergegeben, אַךְ angemessen einschränkend mit „doch“, und בְּמִשְׁפָּט als „nach Recht“ ohne unzulässige Festlegung auf Milde oder Strafgericht. „Nicht in deinem Zorn“ bildet אַל־בְּאַפְּךָ treffend ab. Der Schlusssatz gibt die Grundbedeutung des Hifil von מעט („klein/gering machen, vermindern“) zurück und vermeidet die interpretierende Zuspitzung zur vollständigen Vernichtung. „Damit du mich nicht“ kann im Deutschen den mit פֶּן ausgedrückten befürchteten Ausgang angemessen wiedergeben.'
