  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׁפֹ֣ךְ חֲמָתְ/ךָ֗ עַל הַ/גּוֹיִם֙ אֲשֶׁ֣ר לֹֽא יְדָע֔וּ/ךָ וְ/עַל֙ מִשְׁפָּח֔וֹת אֲשֶׁ֥ר בְּ/שִׁמְ/ךָ֖ לֹ֣א קָרָ֑אוּ כִּֽי אָכְל֣וּ אֶֽת יַעֲקֹ֗ב וַ/אֲכָלֻ֨/הוּ֙ וַ/יְכַלֻּ֔/הוּ וְ/אֶת נָוֵ֖/הוּ הֵשַֽׁמּוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/025.yaml
  text: Pour out your wrath on the nations that do not know you[a], and on the clans that do not call on your name; for they have devoured Jacob, they have devoured him and consumed him, and they have laid waste his habitation.
translation:
  language: de
  text: Gieße deinen Zorn über die Völker aus, die dich nicht kennen, und über die Sippen, die deinen Namen nicht anrufen! Denn sie haben Jakob verschlungen, sie haben ihn verschlungen und völlig aufgerieben; seine Wohnstätte[a] haben sie verwüstet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Weide; auch: seinen Wohnort.'
    reason: נָוֶה kann eine Wohnstätte beziehungsweise einen Wohnort, aber auch eine Weide bezeichnen.
lexical_decisions:
- source_word: שְׁפֹךְ חֲמָתְךָ
  choice: Gieße deinen Zorn … aus
  rationale: Der Imperativ bewahrt das Bild des Ausgießens; „Zorn“ gibt die starke, gerichtliche Bedeutung von חֵמָה natürlich wieder.
- source_word: הַגּוֹיִם אֲשֶׁר לֹא יְדָעוּךָ
  choice: die Völker, die dich nicht kennen
  rationale: „Völker“ vermeidet eine spätere technische Bedeutung von „Heiden“; „kennen“ lässt die relationale Bedeutung von ידע offen, ohne sie auszudeuten.
- source_word: מִשְׁפָּחוֹת
  choice: Sippen
  rationale: Das Wort bezeichnet verwandtschaftlich gegliederte Gruppen; „Sippen“ wahrt diesen Sinn im Parallelismus zu „Völker“.
- source_word: בְּשִׁמְךָ לֹא קָרָאוּ
  choice: die deinen Namen nicht anrufen
  rationale: קרא בשם ist eine feste Wendung für die anbetende oder bittende Anrufung einer Gottheit.
- source_word: אָכְלוּ אֶת יַעֲקֹב וַאֲכָלֻהוּ
  choice: sie haben Jakob verschlungen, sie haben ihn verschlungen
  rationale: Die Wiederholung desselben Verbs wird beibehalten und vermittelt gewaltsame Vernichtung.
- source_word: וַיְכַלֻּהוּ
  choice: und völlig aufgerieben
  rationale: כלה steigert die Aussage zum vollständigen Verzehren oder Zugrunderichten; „völlig aufgerieben“ unterscheidet die Steigerung vom wiederholten „verschlungen“.
- source_word: נָוֵהוּ
  choice: seine Wohnstätte
  rationale: נָוֶה kann Weide, Aufenthaltsort oder Wohnstätte bedeuten. Im Zusammenhang mit der Verwüstung ist „Wohnstätte“ idiomatisch und lässt den kollektiven Lebensraum Jakobs erkennen.
- source_word: הֵשַׁמּוּ
  choice: haben sie verwüstet
  rationale: Der Hifil von שמם bezeichnet das Verödenlassen beziehungsweise Verwüsten; die deutsche Formulierung ist klar und kräftig.
theological_decisions:
- issue: Fluchbitte gegen fremde Völker
  choice: Die direkte Bitte um das Ausgießen von Gottes Zorn bleibt ungemildert stehen.
  alternative: Die Aussage als bloße Ankündigung des Gerichts wiederzugeben oder „Zorn“ abzuschwächen.
  rationale: Der hebräische Text formuliert ausdrücklich eine Bitte um göttliches Gericht und begründet sie mit der Vernichtung Jakobs. Diese theologische Spannung darf nicht aufgelöst werden.
- issue: Bedeutung des Nichtkennens Gottes
  choice: „die dich nicht kennen“
  alternative: „die dich nicht anerkennen“
  rationale: Die wörtlichere Fassung bewahrt die mögliche relationale und religiöse Weite von ידע, ohne nur intellektuelles Wissen oder ausdrücklich bewusste Ablehnung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit Gebetston. Der Ausruf nach den beiden parallelen Bitten markiert den hebräischen Imperativ. Die dreifache Vernichtungsaussage und ihre Steigerung werden nicht geglättet. Der Fußnotenmarker steht im Haupttext unmittelbar nach der betroffenen Aussage.
