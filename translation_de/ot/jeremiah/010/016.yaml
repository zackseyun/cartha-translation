  variant: modern standard German
source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲקֹ֗ב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/יִ֨שְׂרָאֵ֔ל שֵׁ֖בֶט נַֽחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/016.yaml
  text: Not like these is the Portion of Jacob[a], for he is the Former of all things, and Israel is the tribe of his inheritance[b]; Yahweh of hosts is his name.
translation:
  language: de
  text: Nicht wie diese ist der Anteil Jakobs[a], denn er ist der Gestalter von allem, und Israel ist der Stamm seines Erbbesitzes[b]. Jahwe der Heerscharen ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Jakobs Anteil“. Gemeint ist, dass der Gott Israels nicht den zuvor beschriebenen Götzen gleicht.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann „Stamm“, „Stab“ oder „Zepter“ bedeuten. Hier passt „Stamm“ am besten, weil Israel als das Jahwe gehörende Volk bezeichnet wird.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק יַעֲקֹב
  choice: der Anteil Jakobs
  rationale: חֵלֶק bezeichnet einen Anteil oder ein zugewiesenes Teil. Im Zusammenhang ist Gott selbst Jakobs Anteil, im Gegensatz zu den zuvor beschriebenen Götzen. Die Formulierung bleibt nah am Hebräischen und bewahrt den beinahe titelartigen Klang.
- source_word: כְאֵלֶּה
  choice: wie diese
  rationale: Das Demonstrativpronomen verweist auf die zuvor beschriebenen Götzen. „Diese“ lässt den Rückbezug wie im Hebräischen unausgesprochen, ohne die Deutung in den Haupttext einzufügen.
- source_word: יוֹצֵר הַכֹּל
  choice: der Gestalter von allem
  rationale: יוֹצֵר bezeichnet jemanden, der formt oder gestaltet. „Gestalter“ bewahrt dieses Bild und den Gegensatz zwischen Gott und den von Menschen gefertigten Götzen; הַכֹּל wird umfassend mit „allem“ wiedergegeben.
- source_word: שֵׁבֶט נַחֲלָתוֹ
  choice: der Stamm seines Erbbesitzes
  rationale: שֵׁבֶט kann „Stamm“, „Stab“ oder „Zepter“ bedeuten. Mit Israel als Subjekt passt „Stamm“ am besten zur Aussage, dass Israel das Gott zugehörige Volk ist. „Erbbesitz“ gibt נַחֲלָה als bleibenden, zugewiesenen Besitz wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder. „Der Heerscharen“ bewahrt die traditionelle, umfassende Wiedergabe des festen Titels צְבָאוֹת, ohne ihn ausschließlich auf irdische oder himmlische Heere festzulegen.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die nominale Schlussformel wird schlicht und feierlich wiedergegeben.
theological_decisions:
- issue: Bezug von „Anteil Jakobs“
  choice: Die Wendung bezeichnet Jahwe selbst als den Jakob beziehungsweise Israel zugewiesenen Gott.
  alternative: Die Wendung könnte weniger personal oder titelartig als „Jakobs Teil“ verstanden und wiedergegeben werden.
  rationale: Der unmittelbare Zusammenhang stellt die nichtigen Götzen dem lebendigen Gott Israels gegenüber. „Der Anteil Jakobs“ bewahrt diese Bundesbeziehung, ohne sie erklärend auszubauen.
- issue: Bedeutung von שֵׁבֶט bei Israel
  choice: „Stamm“ bezeichnet Israel als das Volk, das Gottes Erbbesitz ist.
  alternative: „Stab“ oder „Zepter“ seines Erbbesitzes.
  rationale: Alle Bedeutungen gehören zum möglichen Wortfeld. In Verbindung mit Israel und Gottes Erbbesitz ergibt „Stamm“ im Kontext den klarsten Sinn; die echte lexikalische Mehrdeutigkeit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem feierlichen Aufbau des Hebräischen, bleibt aber gut verständlich. „Gestalter“ hält das Motiv des Formens fest; „Erbbesitz“ bewahrt die bundestheologische Besitzsprache, ohne konfessionelle Zusätze.
