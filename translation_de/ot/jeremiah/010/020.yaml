source:
  edition: WLC
  text: אָהֳלִ֣/י שֻׁדָּ֔ד וְ/כָל מֵיתָרַ֖/י נִתָּ֑קוּ בָּנַ֤/י יְצָאֻ֨/נִי֙ וְ/אֵינָ֔/ם אֵין נֹטֶ֥ה עוֹד֙ אָהֳלִ֔/י וּ/מֵקִ֖ים יְרִיעוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/020.yaml
  text: My tent is destroyed[a], and all my ropes are torn away. My sons have gone from me, and they are no more[d][c][b]. There is no one left to stretch out my tent again and set up my curtains.
translation:
  language: de
  text: Mein Zelt ist verwüstet[a], und alle meine Zeltstricke sind abgerissen. Meine Söhne sind von mir fortgegangen und nicht mehr da.[b] Niemand ist mehr da, der mein Zelt ausspannt und meine Zeltbahnen aufrichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geplündert“ oder „zerstört“. Das hebräische Verb kann sowohl gewaltsame Verheerung als auch Beraubung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Meine Söhne“ kann wörtlich Kinder oder bildlich die Bewohner beziehungsweise Angehörigen bezeichnen. „Nicht mehr da“ legt nicht fest, ob sie tot oder fortgeführt worden sind.
    reason: cultural_note
lexical_decisions:
- source_word: אָהֳלִי
  choice: mein Zelt
  rationale: Bewahrt das konkrete Zeltbild, das durch Stricke und Zeltbahnen weitergeführt wird.
- source_word: שֻׁדָּד
  choice: ist verwüstet
  rationale: Das passive Verb bezeichnet gewaltsame Verheerung oder Plünderung; „verwüstet“ gibt den zerstörten Zustand wieder, ohne den Vorgang auf bloßen Raub einzuengen.
- source_word: מֵיתָרַי
  choice: meine Zeltstricke
  rationale: Gemeint sind die Stricke eines Zeltes. Das Bestimmungswort macht den Bezug im Deutschen unmittelbar deutlich.
- source_word: נִתָּקוּ
  choice: sind abgerissen
  rationale: Das Verb beschreibt das Losreißen oder Abtrennen; „abgerissen“ passt natürlich zu Zeltstricken und bewahrt das passive Ergebnis.
- source_word: בָּנַי
  choice: meine Söhne
  rationale: Gibt den ausdrücklich maskulinen Plural wieder und lässt offen, ob leibliche Söhne oder bildlich die Bewohner beziehungsweise Angehörigen gemeint sind.
- source_word: יְצָאֻנִי
  choice: sind von mir fortgegangen
  rationale: Gibt die Bewegung vom Sprecher weg idiomatisch wieder und trägt den Klagecharakter.
- source_word: וְאֵינָם
  choice: und nicht mehr da
  rationale: Drückt ihre gegenwärtige Abwesenheit aus, ohne eindeutig festzulegen, ob sie tot, vertrieben oder anderweitig fort sind.
- source_word: אֵין נֹטֶה עוֹד אָהֳלִי
  choice: Niemand spannt mein Zelt wieder aus
  rationale: נָטָה bezeichnet beim Zelt das Ausspannen beziehungsweise Aufschlagen; „wieder“ gibt hier den zeitlichen Sinn von עוֹד im Zusammenhang der zerstörten Behausung natürlich wieder.
- source_word: יְרִיעוֹתַי
  choice: meine Zeltbahnen
  rationale: Bezeichnet die Stoffbahnen oder Decken eines Zeltes; „Zeltbahnen“ ist im modernen Deutschen klarer als das mögliche „Vorhänge“.
- source_word: וּמֵקִים
  choice: und richtet … auf
  rationale: Das Partizip bezeichnet das Aufrichten oder Aufstellen und wird parallel zum Ausspannen des Zeltes wiedergegeben.
theological_decisions:
- issue: Bezug der „Söhne“ und Bedeutung ihres Nichtmehrdaseins
  choice: Die wörtliche Bezeichnung „meine Söhne“ und die offene Aussage „nicht mehr da“ bleiben erhalten.
  alternative: Die Wendung als „meine Bewohner sind fort“ oder als eindeutige Todesaussage wiederzugeben.
  rationale: Der hebräische Text kann in der personifizierenden Klage auf Kinder, Angehörige oder Bewohner zielen und bestimmt nicht ausdrücklich, ob ihre Abwesenheit durch Tod, Flucht oder Verschleppung verursacht ist.
translation_notes:
  register: Moderne, würdige Klagesprache mit konsequent bewahrtem Zeltbild. „Zeltstricke“ und „Zeltbahnen“ sind allgemein verständlich und präzisieren die Gegenstände, ohne die Metapher auszudeuten.
