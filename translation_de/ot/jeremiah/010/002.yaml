  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֶל דֶּ֤רֶךְ הַ/גּוֹיִם֙ אַל תִּלְמָ֔דוּ וּ/מֵ/אֹת֥וֹת הַ/שָּׁמַ֖יִם אַל תֵּחָ֑תּוּ כִּֽי יֵחַ֥תּוּ הַ/גּוֹיִ֖ם מֵ/הֵֽמָּה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/002.yaml
  text: 'Thus says Yahweh: Do not learn the way of the nations[a], and do not be dismayed at the signs of the heavens, because the nations are dismayed at them.'
translation:
  language: de
  text: 'So spricht Jahwe: Lernt nicht den Weg der Völker, und erschreckt nicht vor den Zeichen des Himmels; denn die Völker erschrecken vor ihnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als gebräuchliche deutsche Wiedergabe des Tetragramms wieder.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die traditionelle prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: דֶּרֶךְ הַגּוֹיִם
  choice: den Weg der Völker
  rationale: „Weg“ bezeichnet hier Lebensweise und religiöse Praxis; „Völker“ ist gegenüber „Heiden“ neutraler und quellennäher.
- source_word: אַל תִּלְמָדוּ
  choice: Lernt nicht
  rationale: Folgt der Grundbedeutung „lernen“, ohne die im Kontext naheliegende Übernahme fremder Praktiken bereits paraphrasierend festzulegen.
- source_word: מֵאֹתוֹת הַשָּׁמַיִם
  choice: vor den Zeichen des Himmels
  rationale: „Zeichen“ wahrt die mögliche Bedeutung von Himmelszeichen beziehungsweise Vorzeichen; „vor“ ist mit „erschrecken“ idiomatisches Deutsch.
- source_word: תֵּחָתּוּ / יֵחַתּוּ
  choice: erschreckt / erschrecken
  rationale: Gibt die durch Angst verursachte Bestürzung des Verbs חתת verständlich wieder, ohne sie so stark wie „sich entsetzen“ oder „in Schrecken geraten“ auszudrücken.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung der Aufforderung in passendem prophetischem Register ein.
- source_word: מֵהֵמָּה
  choice: vor ihnen
  rationale: Bezieht das Pronomen eindeutig auf die zuvor genannten Zeichen und entspricht der deutschen Rektion von „erschrecken vor“.
theological_decisions:
- issue: Wiedergabe von גּוֹיִם bei der Abgrenzung von fremder religiöser Praxis
  choice: Völker
  alternative: Heiden
  rationale: „Völker“ entspricht dem breiten hebräischen Ausdruck und vermeidet zusätzliche abwertende oder später konfessionell geprägte Konnotationen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als Eigenname wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem prophetischem Ton. Die parallele Wiederholung von „erschrecken“ bildet die hebräische Wortwiederholung ab. Keine Fußnote ist erforderlich, da der englische Marker offenbar nicht an der passenden Stelle steht und seine angegebene Alternative im deutschen Haupttext keine eigenständige textliche Variante begründet.
