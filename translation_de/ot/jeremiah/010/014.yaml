source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צוֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/014.yaml
  text: Every man is stupid[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is a lie[c][b], and there is no breath in them.
translation:
  language: de
  text: Jeder Mensch ist aus Mangel an Erkenntnis stumpfsinnig[a]; jeder Metallhandwerker wird durch ein Götzenbild beschämt. Denn sein gegossenes Bild ist eine Lüge[b], und in ihnen ist kein Atem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jeder Mensch ist stumpfsinnig, ohne Erkenntnis.« Die Präposition kann privativ (»ohne«) oder kausal (»aus Mangel an«) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Denn sein Gussbild ist Falschheit.« Das zuvor genannte »Götzenbild« kann spezifischer auch als »geschnitztes Bild« wiedergegeben werden.'
    reason: lexical_alternative
  - marker: c
    text: »Atem« kann auch mit »Geist« wiedergegeben werden; im Zusammenhang bezeichnet dies die Leblosigkeit der Götzenbilder.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: ist unvernünftig
  rationale: Das Nifal von בער bezeichnet tierhafte Unvernunft oder Stumpfheit, nicht bloß fehlendes Wissen. »Unvernünftig« gibt die Schärfe in verständlichem, gegenwärtigem Deutsch wieder, ohne das heute missverständliche »viehisch« zu verwenden.
- source_word: כָּל אָדָם
  choice: jeder Mensch
  rationale: אָדָם bezeichnet hier den Menschen generisch; »jeder Mensch« bewahrt die distributive Kraft von כָּל und ist im Deutschen geschlechtsübergreifend.
- source_word: מִדַּעַת
  choice: ohne Erkenntnis
  rationale: Die Präposition מִן kann hier privativ oder kausal verstanden werden. Die Hauptfassung bewahrt mit »ohne Erkenntnis« die knappe privative Form; die kausale Möglichkeit wird in der Fußnote genannt.
- source_word: הֹבִישׁ
  choice: wird … beschämt
  rationale: Das Hifil von בוש drückt Beschämung beziehungsweise das Zuschandenwerden aus. Die deutsche Passivform gibt wieder, dass der Handwerker durch sein Werk bloßgestellt wird.
- source_word: צוֹרֵף
  choice: Metallhandwerker
  rationale: Das Wort bezeichnet jemanden, der Metall schmilzt, läutert oder verarbeitet. »Metallhandwerker« ist im Kontext umfassender und weniger materialspezifisch als »Goldschmied«.
- source_word: מִפָּסֶל
  choice: durch das Götzenbild
  rationale: פֶּסֶל ist ein hergestelltes Kultbild; מִן bezeichnet hier Mittel oder Ursache der Beschämung. »Götzenbild« macht den kultischen Bezug deutlich, ohne die Herstellungsart unnötig einzuengen.
- source_word: שֶׁקֶר
  choice: Lüge
  rationale: Das Substantiv bezeichnet Lüge oder Falschheit. Die prädikative Wendung »ist Lüge« bewahrt die zugespitzte prophetische Aussage.
- source_word: נִסְכּוֹ
  choice: sein gegossenes Bild
  rationale: Der Ausdruck bezeichnet ein durch Gießen gefertigtes Metallbild; das Suffix der dritten Person Singular wird mit »sein« wiedergegeben.
- source_word: וְלֹא רוּחַ בָּם
  choice: und in ihnen ist kein Atem
  rationale: רוּחַ kann Atem, Geist oder Wind bedeuten. Im Zusammenhang bezeichnet »Atem« am unmittelbarsten die Leblosigkeit der Götzenbilder. Das plurale »ihnen« bleibt trotz der vorangehenden Singularformen erhalten.
theological_decisions:
- issue: Reichweite der Anklage gegen den Menschen
  choice: Die allgemeine Formulierung »jeder Mensch« bleibt stehen, wird aber nicht durch Zusätze zu einer umfassenden anthropologischen Lehrformel ausgebaut.
  alternative: Die Aussage könnte ausdrücklich auf alle Menschen in jeder Hinsicht bezogen oder ausschließlich auf Götzenmacher eingeengt werden.
  rationale: Der Wortlaut ist allgemein, während der unmittelbare Zusammenhang die Unvernunft besonders im Götzendienst sichtbar macht. Die Übersetzung wahrt beides, ohne die Spannung aufzulösen.
- issue: Wesen der Götzenbilder
  choice: Die Bilder werden als Lüge und ohne Atem, also als leblose Täuschung, bezeichnet.
  alternative: רוּחַ könnte mit »Geist« wiedergegeben und dadurch stärker metaphysisch verstanden werden.
  rationale: »Atem« entspricht der konkreten Gegenüberstellung von scheinbarer Gestalt und tatsächlicher Leblosigkeit; die weitere lexikalische Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst scharfer prophetischer Sprache. Die parallelen Satzglieder und der Wechsel vom Singular der einzelnen Bildgestalt zum pluralischen Rückbezug auf die Götzenbilder wurden bewahrt.
