source:
  edition: WLC
  text: א֥וֹי לִ/י֙ עַל שִׁבְרִ֔/י נַחְלָ֖ה מַכָּתִ֑/י וַ/אֲנִ֣י אָמַ֔רְתִּי אַ֛ךְ זֶ֥ה חֳלִ֖י וְ/אֶשָּׂאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/019.yaml
  text: Woe is me because of my brokenness[a]; my wound is grievous. But I said, “Surely this is my sickness[c][b], and I must bear it.”
translation:
  language: de
  text: 'Weh mir wegen meines Zusammenbruchs[a]! Meine Wunde ist schwer[b]. Doch ich sagte: »Gewiss, das ist mein Leiden, und ich muss es tragen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen meiner Verletzung“ beziehungsweise „über meinen Bruch“. Das hebräische Wort kann einen Bruch, eine Verletzung oder einen Zusammenbruch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „Meine Wunde ist krank“; sinngemäß: „Meine Wunde ist schlimm“. Das hebräische Verb bezeichnet Kranksein, Schwachsein oder einen schweren Zustand.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „und ich werde es tragen“. Der letzte Satz kann sowohl als notgedrungene Ergebung („ich muss es tragen“) als auch als Aussage über die Zukunft verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: א֥וֹי לִי
  choice: Weh mir
  rationale: Die knappe, eindringliche Klageformel gibt den hebräischen Schmerzensruf in würdigem, verständlichem Deutsch wieder.
- source_word: עַל שִׁבְרִי
  choice: wegen meines Zusammenbruchs
  rationale: שֶׁבֶר kann einen Bruch, eine Verletzung oder umfassenden Zusammenbruch und Untergang bezeichnen. „Zusammenbruch“ bewahrt neben dem Bild körperlicher Versehrtheit auch die weiter reichende Verwüstung; עַל wird im Zusammenhang kausal verstanden.
- source_word: נַחְלָה מַכָּתִי
  choice: Meine Wunde ist schwer
  rationale: מַכָּה bezeichnet hier passend eine Wunde oder Verletzung. נַחְלָה beschreibt sie als krank, schwach oder schlimm; „schwer“ klingt bei einer Wunde natürlich und legt sich nicht auf die stärker deutende Bedeutung „unheilbar“ fest.
- source_word: אַךְ
  choice: Gewiss
  rationale: Das Wort bekräftigt hier die ernüchterte, von Ergebung geprägte Einschätzung des Sprechers.
- source_word: חֳלִי
  choice: mein Leiden
  rationale: חֳלִי kann Krankheit oder leidvolle Schwäche bezeichnen. „Leiden“ bewahrt den medizinischen Bezug, lässt aber offen, ob ausschließlich eine körperliche Krankheit gemeint ist.
- source_word: וְאֶשָּׂאֶנּוּ
  choice: und ich muss es tragen
  rationale: נשׂא bedeutet „tragen“. Der Imperfekt kann im Zusammenhang als entschlossene oder notgedrungene Hinnahme gehört werden; die modale Wiedergabe ist idiomatisch, während die einfache Zukunft als Alternative vermerkt wird.
