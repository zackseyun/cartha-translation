  rationale: Die Revision korrigiert die nicht quellengerechte Passivierung des letzten hebräischen Verbs. „Damit sie es erfahren“ gibt im Deutschen einen verständlichen, zurückhaltenden Sinn wieder; das ergänzte „es“ und die fortbestehende Schwierigkeit des objektlosen hebräischen Aktivverbs werden in der Fußnote offengelegt. Die übrigen Entscheidungen bleiben erhalten, einschließlich der Schleudermetapher, der landbezogenen Lesart und der traditionellen deutschen Schreibung des Gottesnamens.
