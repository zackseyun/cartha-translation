  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י קוֹלֵ֛עַ אֶת יוֹשְׁבֵ֥י הָ/אָ֖רֶץ בַּ/פַּ֣עַם הַ/זֹּ֑את וַ/הֲצֵר֥וֹתִי לָ/הֶ֖ם לְמַ֥עַן יִמְצָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/018.yaml
  text: 'For thus says Yahweh: Behold[a], I am slinging out the inhabitants of the land at this time[c][b], and I will press them hard so that they may be found.'
translation:
  language: de
  text: 'Denn so spricht der HERR: Siehe, ich schleudere diesmal die Bewohner des Landes[a] hinaus und werde sie bedrängen, damit sie es erfahren[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Verb bezeichnet bildhaft das Schleudern, besonders mit einer Schleuder; auch: „hinauswerfen“ oder „hinausschleudern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Schlusssatz ist schwierig. Wörtlich steht aktiv: „damit sie finden“, ohne genanntes Objekt. Auch möglich: „damit sie es zu spüren bekommen“ oder „damit sie sich gefangen finden“.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die in deutschen Bibeln etablierte Wiedergabe des Tetragramms wahrt den besonderen Gottesnamen im Schriftbild, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- source_word: הִנְנִי
  choice: Siehe, ... ich
  rationale: „Siehe“ erhält den nachdrücklichen prophetischen Hinweis; das folgende Partizip wird als unmittelbar bevorstehendes Handeln wiedergegeben.
- source_word: קוֹלֵעַ
  choice: schleudere ... hinaus
  rationale: Das Verb bezeichnet anschaulich das Schleudern, insbesondere mit einer Schleuder, und vermittelt eine gewaltsame Vertreibung statt bloßer Entfernung.
- source_word: יוֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Im unmittelbaren Zusammenhang ist das Land Juda gemeint; „Land“ wahrt zugleich die übliche Bedeutungsbreite von אֶרֶץ.
- source_word: בַּפַּעַם הַזֹּאת
  choice: diesmal
  rationale: Die knappe deutsche Wendung gibt den zeitlich-anlassbezogenen Sinn natürlich wieder.
- source_word: וַהֲצֵרוֹתִי
  choice: ich werde sie bedrängen
  rationale: Der Hiphil von צור bezeichnet das Versetzen in Enge oder Bedrängnis. „Bedrängen“ bewahrt diese Bedeutung, ohne das Bild unnötig auf eine konkrete Belagerung festzulegen.
- source_word: לְמַעַן יִמְצָאוּ
  choice: damit sie gefunden werden
  rationale: Die schwierige, objektlose Formulierung wird formal und absichtlich offen wiedergegeben; es wird kein im Hebräischen fehlendes Objekt ergänzt.
theological_decisions:
- issue: Reichweite von הָאָרֶץ
  choice: Land
  alternative: Erde
  rationale: Der Kontext weist auf die Bewohner Judas und damit auf das Land; eine weltweite Reichweite wird nicht ausdrücklich behauptet.
- issue: Deutung von לְמַעַן יִמְצָאוּ
  choice: damit sie gefunden werden
  alternative: damit sie es zu spüren bekommen / damit sie sich gefangen finden
  rationale: Der hebräische Schluss ist ungewöhnlich und mehrdeutig. Der Haupttext erhält die formale Offenheit, während verständlichere, aber stärker deutende Möglichkeiten in der Fußnote stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kräftige Schleudermetapher bleibt erhalten; die ungewöhnliche Offenheit des letzten Satzes wird nicht durch ein hinzugefügtes Objekt beseitigt. Die Fußnotenmarker stehen jeweils unmittelbar bei der betreffenden Formulierung.
