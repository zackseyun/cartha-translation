  terminology: »Jahwe« gibt den Gottesnamen konsistent als Eigenname wieder. »Mensch« ist für אָדָם im generischen Sinn angemessen. Die Formulierung vermeidet es, aus dem Vers eine weitergehende deterministische Aussage abzuleiten.
