source:
  edition: WLC
  text: יָדַ֣עְתִּי יְהוָ֔ה כִּ֛י לֹ֥א לָ/אָדָ֖ם דַּרְכּ֑/וֹ לֹֽא לְ/אִ֣ישׁ הֹלֵ֔ךְ וְ/הָכִ֖ין אֶֽת צַעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/023.yaml
  text: I know[a], O Yahweh, that a man's way is not his own[b]; it is not for a man who walks to direct his steps.
translation:
  language: de
  text: 'Ich weiß, Jahwe: Der Weg des Menschen liegt nicht in seiner Hand[a]; es steht nicht bei einem Menschen, der seinen Weg geht, seine Schritte zu lenken[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nicht beim Menschen ist sein Weg.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seine Schritte festzulegen« beziehungsweise »zu festigen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ich weiß
  rationale: Das Qal-Perfekt in der 1. Person Singular bezeichnet hier eine gefestigte Erkenntnis beziehungsweise ein Bekenntnis; im Deutschen gibt das Präsens die gegenwärtige, allgemeingültige Aussage natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לֹא לָאָדָם דַּרְכּוֹ
  choice: Der Weg des Menschen liegt nicht in seiner eigenen Hand
  rationale: 'Die hebräische Nominalkonstruktion ist elliptisch, etwa: »Nicht beim Menschen ist sein Weg.« Die deutsche Wendung bewahrt die Aussage fehlender autonomer Verfügung, ohne vollständige Passivität zu behaupten.'
- source_word: לְאִישׁ הֹלֵךְ
  choice: wer seinen Weg geht
  rationale: Die Verbindung aus אִישׁ und dem Partizip הֹלֵךְ bezeichnet den Menschen in seinem Gehen. Die Formulierung ist im Deutschen natürlich und erhält zugleich das Bild des Lebenswegs.
- source_word: וְהָכִין אֶת צַעֲדוֹ
  choice: kann seine Schritte nicht selbst lenken
  rationale: Das Hifil von כון kann »festmachen«, »einrichten« oder im Zusammenhang mit Schritten »lenken« bedeuten. »Lenken« passt zum Parallelismus mit dem Weg; »selbst« verdeutlicht die im Hebräischen verneinte menschliche Verfügung, ohne einen ausdrücklichen Handelnden hinzuzufügen.
theological_decisions:
- issue: Menschliche Handlungsfähigkeit und göttliche Souveränität
  choice: Die Übersetzung verneint die autonome Verfügungsgewalt des Menschen über seinen Lebensweg.
  alternative: Die Aussage könnte stärker deterministisch formuliert werden, als könne der Mensch überhaupt keine eigenen Entscheidungen treffen.
  rationale: Der hebräische Text betont menschliche Begrenztheit und Abhängigkeit, entfaltet hier aber keine vollständige Lehre des Determinismus. Die Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Der Weg des Menschen« und »Schritte« erhalten das poetische Bild und den Parallelismus. Das generische אָדָם wird mit »Mensch« wiedergegeben; dies ist im heutigen Deutschen präzise und natürlich.
