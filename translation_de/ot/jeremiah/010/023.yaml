  source_fidelity: 'Die Grundbedeutung ist zutreffend: Der Vers bekennt, dass der Mensch über seinen Lebensweg und die Ausrichtung seiner Schritte nicht autonom verfügt. Das deutsche Modalverb »kann« verschiebt jedoch die hebräische Konstruktion לֹא לְ... leicht zu einer bloßen Unfähigkeitsbehauptung. Die Wendung »es steht nicht bei« gibt die Aussage »es ist nicht Sache/steht nicht in der Verfügung von« genauer wieder.'
