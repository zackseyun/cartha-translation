source:
  edition: WLC
  text: כֶּ֣סֶף מְרֻקָּ֞ע מִ/תַּרְשִׁ֣ישׁ יוּבָ֗א וְ/זָהָב֙ מֵֽ/אוּפָ֔ז מַעֲשֵׂ֥ה חָרָ֖שׁ וִ/ידֵ֣י צוֹרֵ֑ף תְּכֵ֤לֶת וְ/אַרְגָּמָן֙ לְבוּשָׁ֔/ם מַעֲשֵׂ֥ה חֲכָמִ֖ים כֻּלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/009.yaml
  text: Beaten silver is brought from Tarshish[a], and gold from Uphaz, the work of a craftsman and of the hands of a goldsmith. Blue and purple are their clothing; all of them are the work of skilled men.
translation:
  language: de
  text: Getriebenes Silber wird aus Tarschisch herbeigebracht und Gold aus Ufas[a] – das Werk eines Handwerkers und der Hände eines Goldschmieds. Blauer und purpurroter Stoff ist ihr Gewand; sie alle sind das Werk geschickter Männer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Ufas; manche halten den Namen für eine Variante von Ofir.
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּסֶף מְרֻקָּע
  choice: getriebenes Silber
  rationale: כֶּסֶף bezeichnet hier Silber als Werkstoff; מְרֻקָּע beschreibt Metall, das durch Hämmern flach bzw. zu dünnen Platten getrieben wurde. „Getriebenes Silber“ ist im Deutschen präzise und idiomatisch.
- source_word: מִתַּרְשִׁישׁ
  choice: aus Tarschisch
  rationale: Der Ortsname wird in seiner etablierten deutschen biblischen Form wiedergegeben.
- source_word: יוּבָא
  choice: wird … herbeigebracht
  rationale: Der Hophal von בוא ist passiv-kausativ. „Herbeigebracht“ bewahrt diese Form genauer als das stärker deutende „importiert“.
- source_word: וְזָהָב מֵאוּפָז
  choice: und Gold aus Ufas
  rationale: Der masoretische Text liest אוּפָז. Daher steht Ufas im Haupttext; die mögliche Beziehung zu Ofir wird in einer Fußnote genannt.
- source_word: מַעֲשֵׂה חָרָשׁ
  choice: das Werk eines Handwerkers
  rationale: מַעֲשֵׂה bezeichnet das hergestellte Werk, חָרָשׁ einen fachkundigen Handwerker. Die Wiedergabe bleibt nah am handwerklichen Kontext.
- source_word: וִידֵי צוֹרֵף
  choice: und von Goldschmiedehänden
  rationale: Die konkrete hebräische Rede von den „Händen“ hebt die menschliche Herstellung hervor. צוֹרֵף kann einen Läuterer oder Edelmetallhandwerker bezeichnen; im Zusammenhang passt „Goldschmied“ am besten.
- source_word: תְּכֵלֶת וְאַרְגָּמָן
  choice: blauer und purpurroter Stoff
  rationale: Die Wörter bezeichnen kostbare Farbstoffe beziehungsweise damit gefärbte Textilien. „Stoff“ macht im Deutschen den Bezug auf das Gewand verständlich, ohne eine bestimmte Textilart festzulegen.
- source_word: לְבוּשָׁם
  choice: ist ihr Gewand
  rationale: Das singularische Kollektiv לְבוּשׁ bezeichnet die Bekleidung der mehrfach genannten Götzen. „Gewand“ bewahrt den gehobenen, konkreten Ausdruck.
- source_word: מַעֲשֵׂה חֲכָמִים כֻּלָּם
  choice: sie alle sind das Werk geschickter Männer
  rationale: חֲכָמִים bezeichnet hier aufgrund des Herstellungskontexts fachlich geschickte Personen, nicht religiöse oder philosophische Weise. Die maskuline Form wird beibehalten.
theological_decisions:
- issue: Geschlechtsspezifische Wiedergabe von חֲכָמִים
  choice: geschickter Männer
  alternative: geschickter Fachleute / kundiger Handwerker
  rationale: Das hebräische Wort steht im maskulinen Plural. „Geschickter Männer“ erhält diese Form und macht durch das Adjektiv zugleich deutlich, dass handwerkliches Können gemeint ist.
- issue: Bezug von כֻּלָּם („sie alle“)
  choice: Das pluralische Pronomen bleibt ausdrücklich stehen, ohne seinen Bezug durch ein eingefügtes Substantiv festzulegen.
  alternative: Alle diese Götzen sind von geschickten Handwerkern gemacht.
  rationale: Der unmittelbare Abschnitt handelt von Götzenbildern, doch der hebräische Satz nennt das Bezugswort hier nicht erneut. Die Übersetzung wahrt diese textliche Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Handwerkliche Fachsprache wird nur dort verwendet, wo sie allgemein verständlich bleibt. Der Gedankenstrich bildet die knappe, verblessartige hebräische Fügung ab. Der Fußnotenmarker steht unmittelbar nach „Ufas“, da sich die textkritisch-geografische Anmerkung auf diesen Namen und nicht auf Tarschisch bezieht.
