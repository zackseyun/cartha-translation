  text: כִּֽי חֻקּ֥וֹת הָֽ/עַמִּ֖ים הֶ֣בֶל ה֑וּא כִּֽי עֵץ֙ מִ/יַּ֣עַר כְּרָת֔/וֹ מַעֲשֵׂ֥ה יְדֵ֥י חָרָ֖שׁ בַּֽ/מַּעֲצָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/010/003.yaml
  text: For the customs of the peoples are vanity[a], for a tree is cut from the forest, the work of the hands of a craftsman with an axe.
translation:
  language: de
  text: Denn die Bräuche der Völker sind nichtig; denn man fällt einen Baum aus dem Wald, den ein Handwerker mit dem Beil zum Werk seiner Hände macht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit der Dechsel«; das hebräische Wort bezeichnet ein Werkzeug zum Fällen oder Bearbeiten von Holz. Welches Werkzeug genau gemeint ist, ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻקּוֹת
  choice: Bräuche
  rationale: Im Zusammenhang der Götzenverehrung bezeichnet das Wort überlieferte religiöse Gebräuche, nicht in erster Linie förmliche Satzungen.
- source_word: הָעַמִּים
  choice: der Völker
  rationale: Bewahrt den ethnischen Plural und vermeidet moderne staatspolitische Nebenbedeutungen.
- source_word: הֶבֶל
  choice: nichtig
  rationale: Gibt die übertragene Bedeutung von Hauch, Leere und Wertlosigkeit knapp wieder, ohne das Bild unnötig auszudeuten.
- source_word: כִּי ... כִּי
  choice: Denn ... denn
  rationale: Die Wiederholung des hebräischen Begründungswortes bleibt sichtbar und verbindet den Vers mit dem vorausgehenden Aufruf sowie seine beiden Aussagen miteinander.
- source_word: עֵץ מִיַּעַר כְּרָתוֹ
  choice: man fällt einen Baum im Wald
  rationale: Das aktive unpersönliche »man« gibt das hebräische Verb mit Objektsuffix natürlich wieder; »Baum« bewahrt das konkrete Bild.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: das Werk der Hände eines Handwerkers
  rationale: Die Wendung erhält die Betonung menschlicher Herstellung und bildet die hebräische Konstruktverbindung eng nach.
- source_word: בַּמַּעֲצָד
  choice: mit dem Beil
  rationale: Bezeichnet verständlich ein Werkzeug zur Holzbearbeitung; die genaue Art des Werkzeugs ist unsicher und wird deshalb in der Fußnote erläutert.
theological_decisions:
- issue: Antigötzendienstliche Aussage ohne spätere dogmatische Zusätze
  choice: die Bräuche der Völker sind nichtig
  alternative: die Satzungen der Nationen sind wertlos
  rationale: Die Formulierung bewahrt die Polemik gegen menschlich hergestellte Kultobjekte, ohne eine im Vers nicht ausdrücklich genannte theologische Kategorie einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Begründung mit »denn« wahrt die Struktur des Hebräischen. Der leicht verdichtete zweite Satzteil folgt bewusst der knappen prophetischen Ausdrucksweise.
