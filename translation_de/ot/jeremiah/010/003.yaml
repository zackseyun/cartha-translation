  rationale: Die Revision korrigiert „im Wald“ zu „aus dem Wald“ und löst die hebräische Nominalverdichtung minimal in einen verständlichen deutschen Relativsatz auf. „Zum Werk seiner Hände macht“ gibt die Betonung von מַעֲשֵׂה יְדֵי חָרָשׁ auf menschliche Herstellung wieder, ohne zusätzliche theologische Deutung einzutragen. Die Fußnote bleibt unverändert, da sie die lexikalische Unsicherheit des Werkzeugs angemessen dokumentiert.
