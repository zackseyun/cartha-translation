  text: בָּ֤אָה קָרְחָה֙ אֶל עַזָּ֔ה נִדְמְתָ֥ה אַשְׁקְל֖וֹן שְׁאֵרִ֣ית עִמְקָ֑/ם עַד מָתַ֖י תִּתְגּוֹדָֽדִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
translation:
  language: de
  text: Kahlheit ist über Gaza gekommen; Aschkelon ist verstummt[a], der Rest ihres Tales[b]. Wie lange noch wirst du dir Einschnitte zufügen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Aschkelon ist vernichtet“ beziehungsweise „Aschkelon ist zugrunde gegangen“. Das hebräische Verb kann Verstummen, Stillwerden oder Vernichtung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „der Rest ihres Tales“. Alte Übersetzungen oder eine andere Lesung beziehungsweise Vokalisierung haben zu weiteren Deutungen geführt, darunter „der Rest der Anakiter“.'
    reason: alternative_reading
  - marker: c
    text: Das Einschneiden des eigenen Körpers war im Alten Orient eine verbreitete Trauerhandlung.
    reason: cultural_note
lexical_decisions:
- source_word: קָרְחָה
  choice: Kahlheit
  rationale: Das Substantiv bezeichnet Kahlheit als sichtbares Zeichen von Trauer und Unheil. Die Wiedergabe bewahrt das Bild, ohne ausdrücklich festzulegen, ob das Haar geschoren wurde oder auf andere Weise verloren ging.
- source_word: בָּאָה ... אֶל עַזָּה
  choice: ist über Gaza gekommen
  rationale: Die Formulierung gibt die Ankunft eines bedrohlichen Geschicks wieder; „über … gekommen“ klingt im Deutschen natürlicher und unheilvoller als das neutrale „zu … gekommen“.
- source_word: נִדְמְתָה
  choice: ist verstummt
  rationale: Das Nifal von דמה kann Verstummen, Stillwerden oder Zugrundegehen bezeichnen. „Ist verstummt“ erhält das Grundbild, während der Zusammenhang eines Kriegsgerichts die zerstörerische Bedeutung erkennen lässt.
- source_word: שְׁאֵרִית
  choice: der Rest
  rationale: „Rest“ bezeichnet hier, ohne zusätzliche Deutung, das nach dem Unheil Übriggebliebene.
- source_word: עִמְקָם
  choice: ihres Tales
  rationale: Der masoretische Text lässt sich am unmittelbarsten als „ihr Tal“ mit Suffix der 3. Person Plural verstehen. Abweichende alte Überlieferungen werden in einer Fußnote genannt.
- source_word: תִּתְגּוֹדָדִי
  choice: wirst du dich selbst ritzen
  rationale: Die reflexive Form bezeichnet das Einschneiden des eigenen Körpers als Trauerhandlung. „Sich selbst ritzen“ ist verständlich, anschaulich und erhält den reflexiven Sinn.
- source_word: עַד מָתַי
  choice: Wie lange noch
  rationale: Dies ist die natürliche deutsche Wiedergabe der zeitlichen Klagefrage und bringt durch „noch“ ihre Dringlichkeit zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe poetische Satzfolge und die personifizierende Anrede im Femininum bleiben erhalten; die angesprochene Größe wird nicht ausdrücklich bestimmt. „Kahlheit“ bewahrt bewusst das ungewöhnliche Bild des hebräischen Textes.
