id: JER.47.7
reference: Jeremiah 47:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֵ֣יךְ תִּשְׁקֹ֔טִי וַֽ/יהוָ֖ה צִוָּה לָ֑/הּ אֶֽל אַשְׁקְל֛וֹן וְ/אֶל ח֥וֹף הַ/יָּ֖ם שָׁ֥ם יְעָדָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
translation:
  language: de
  text: Wie kannst du still sein, wenn Jahwe dir einen Auftrag gegeben hat? Gegen Aschkelon und gegen die Küste am Meer – dorthin hat er dich bestimmt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen heißt es wörtlich „Jahwe hat ihr befohlen“ und „er hat sie bestimmt“. Die femininen Formen beziehen sich auf das personifizierte Schwert aus dem vorherigen Vers.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Nach Aschkelon und zur Küste des Meeres“. Die Präposition bezeichnet zunächst eine Richtung; im Zusammenhang ist das Schwert jedoch gegen diese Orte gesandt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie kannst du
  rationale: Die Wendung eröffnet eine rhetorische Frage nach der Möglichkeit; „Wie kannst du“ gibt diese Kraft im heutigen Deutsch natürlich wieder.
- source_word: תִּשְׁקֹטִי
  choice: still sein
  rationale: Das feminine Singularverb von שׁקט bezeichnet Stillsein oder Zur-Ruhe-Kommen. Im Zusammenhang wird das Schwert aus dem vorherigen Vers unmittelbar angeredet.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: צִוָּה לָהּ
  choice: dir einen Auftrag gegeben hat
  rationale: Wörtlich steht eine feminine Singularreferenz („ihr befohlen“), die auf das personifizierte Schwert zurückweist. Die zweite Person wahrt im Deutschen die unmittelbare Anrede; „Auftrag“ bezeichnet hier den erteilten göttlichen Befehl, ohne seinen Inhalt unnötig festzulegen.
- source_word: אֶל אַשְׁקְלוֹן
  choice: Gegen Aschkelon
  rationale: אֶל bezeichnet grundsätzlich die Richtung auf ein Ziel hin; im Kontext des zum Gericht ausgesandten Schwertes ist die feindliche Zielrichtung gemeint. Die wörtlichere Möglichkeit „nach Aschkelon“ wird in einer Fußnote bewahrt.
- source_word: חוֹף הַיָּם
  choice: die Küste am Meer
  rationale: Natürliche deutsche Wiedergabe von „Küste/Ufer des Meeres“.
- source_word: שָׁם
  choice: dorthin
  rationale: Der Ortsausdruck nimmt die beiden zuvor genannten Ziele auf; im Deutschen verdeutlicht „dorthin“ die gerichtete Bestimmung.
- source_word: יְעָדָהּ
  choice: hat er dich bestimmt
  rationale: יעד bezeichnet hier das Bestimmen oder Zuweisen für einen Ort beziehungsweise Auftrag. Die direkte Anrede wird im Deutschen fortgeführt, während die hebräische Form in der Fußnote erläutert wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ bewahrt seinen Charakter als Eigenname.
- issue: Bezug der femininen Formen
  choice: Unmittelbare Anrede des personifizierten Schwertes mit „du/dir/dich“
  alternative: Wechsel von „du“ zu „ihr/sie“ beziehungsweise, nach deutschem Genus, zu „ihm/es“
  rationale: Das feminine Verb und die femininen Suffixe beziehen sich auf das in Jeremia 47,6 personifizierte Schwert. Eine durchgehende zweite Person ist im Deutschen klar und rhetorisch kraftvoll; die grammatische Form des Hebräischen wird in der Fußnote offengelegt.
- issue: Richtung oder feindliche Zielsetzung von אֶל
  choice: gegen
  alternative: nach/zu
  rationale: Der unmittelbare Zusammenhang beschreibt den Auftrag des Schwertes zum Gericht. „Gegen“ macht diese kontextuelle Zielrichtung deutlich, während die grundlegend direktionale Bedeutung in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede erhält die Personifikation und die rhetorische Spannung. „Küste am Meer“ ist allgemeinverständlich; „dorthin bestimmt“ bleibt nah an der Zuweisungs- und Sendungssprache des Ausgangstextes.
