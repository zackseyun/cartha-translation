  text: עַל הַ/יּ֗וֹם הַ/בָּא֙ לִ/שְׁד֣וֹד אֶת כָּל פְּלִשְׁתִּ֔ים לְ/הַכְרִ֤ית לְ/צֹר֙ וּ/לְ/צִיד֔וֹן כֹּ֖ל שָׂרִ֣יד עֹזֵ֑ר כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת פְּלִשְׁתִּ֔ים שְׁאֵרִ֖ית אִ֥י כַפְתּֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/004.yaml
  text: because of the day that is coming to devastate all the Philistines[a], to cut off from Tyre and Sidon every surviving helper. For Yahweh is devastating the Philistines, the remnant of the island of Caphtor.
translation:
  language: de
  text: wegen des Tages, der kommt, um alle Philister zu verwüsten und Tyrus und Sidon von jedem verbliebenen Helfer abzuschneiden. Denn Jahwe verwüstet die Philister, den Rest der Insel Kaftor[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Küstenlandes Kaftor“.'
    reason: אִי kann sowohl „Insel“ als auch „Küstenland“ bedeuten.
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  choice: wegen des Tages, der kommt
  rationale: עַל ist im Zusammenhang kausal zu verstehen; die substantivierte Partizipialform הַבָּא wird mit „der kommt“ wiedergegeben.
- source_word: לִשְׁדֹד / שֹׁדֵד
  choice: zu verwüsten / verwüstet
  rationale: שׁדד bezeichnet gewaltsames Verheeren oder Ausplündern. „Verwüsten“ passt zum Gericht über ein Volk und gibt sowohl Infinitiv als auch Partizip einheitlich wieder.
- source_word: אֶת כָּל פְּלִשְׁתִּים
  choice: alle Philister
  rationale: Die hebräische Pluralform bezeichnet hier das Volk, nicht ausdrücklich das Land Philistäa.
- source_word: לְהַכְרִית
  choice: auszurotten
  rationale: Die Hifil-Form von כרת bedeutet, jemanden vollständig zu beseitigen oder abzuschneiden. Im Deutschen gibt „ausrotten“ die gewaltsame Gerichtsaussage natürlich wieder.
- source_word: לְצֹר וּלְצִידוֹן כֹּל שָׂרִיד עֹזֵר
  choice: jeden noch verbliebenen Helfer für Tyrus und Sidon
  rationale: שָׂרִיד עֹזֵר bezeichnet einen übrig gebliebenen Helfer. Die Präposition ל vor den Städten wird als Zuordnung beziehungsweise Begünstigung wiedergegeben; so bleibt erkennbar, dass Tyrus und Sidon diese Hilfe verlieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im modernen Deutschen geläufigen Form transliteriert und nicht durch einen Titel ersetzt.
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  choice: den Rest des Küstenlandes Kaftor
  rationale: שְׁאֵרִית bezeichnet den verbliebenen Rest; אִי kann sowohl Insel als auch Küstenland bedeuten. „Küstenland“ vermeidet eine unnötig genaue geografische Festlegung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen Gottes. Die Transliteration wahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Geografische Bedeutung von אִי bei Kaftor
  choice: Küstenland
  alternative: Insel
  rationale: Beide Bedeutungen liegen im möglichen Bedeutungsbereich. Die Hauptübersetzung wählt die weniger eng festgelegte geografische Bezeichnung; die Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt als kausale Fortsetzung des vorhergehenden Satzes bewusst mit „wegen“. Die drastische Gerichtssprache des Hebräischen bleibt erhalten.
