  - severity: medium
    issue: „wenden sich die Väter nicht nach ihren Söhnen um“
    rationale: Das Hebräische sagt, dass die Väter sich den Söhnen nicht zuwenden. Die deutsche Wendung „sich nach jemandem umwenden“ betont eher ein Umdrehen bzw. Zurückschauen und verschiebt damit die Blickrichtung.
  - severity: low
    issue: „beim Getöse ihrer Räder“
    rationale: Das feminine Possessivpronomen kann sich zwar auf die Streitwagen beziehen, entfernt sich aber von der einheitlichen Zuordnung „seiner … seiner … seiner“ im hebräischen Bild. „seiner Räder“ ist eindeutig und stilistisch unproblematisch.
  - severity: low
    issue: Fußnotenformulierung „ein Bild für lähmende Angst, Schwäche und Hilflosigkeit“
    rationale: Die Wendung bezeichnet wörtlich die Erschlaffung bzw. Schwäche der Hände und kann in diesem Kontext panische Handlungsunfähigkeit ausdrücken. Die Erklärung sollte diese idiomatische Funktion als mögliche Kontextbedeutung markieren, nicht mehrere Deutungen kumulativ festschreiben.
