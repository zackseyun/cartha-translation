  text: מִ/קּ֗וֹל שַֽׁעֲטַת֙ פַּרְס֣וֹת אַבִּירָ֔י/ו מֵ/רַ֣עַשׁ לְ/רִכְבּ֔/וֹ הֲמ֖וֹן גַּלְגִּלָּ֑י/ו לֹֽא הִפְנ֤וּ אָבוֹת֙ אֶל בָּנִ֔ים מֵֽ/רִפְי֖וֹן יָדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/003.yaml
  text: At the sound of the stamping of the hooves of his mighty horses[a], at the rumbling of his chariots, at the roar of his wheels, fathers do not turn to their sons because of the helplessness of their hands.
translation:
  language: de
  text: Beim Donnern der Hufe seiner mächtigen Pferde, beim Rasseln seiner Streitwagen, beim Getöse seiner Räder wenden die Väter sich ihren Söhnen nicht zu, weil ihre Hände kraftlos sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wegen der Erschlaffung/Schwäche der Hände“; ein Bild, das hier durch Angst verursachte Kraftlosigkeit oder Hilflosigkeit ausdrücken kann.'
    reason: Die Fußnote erläutert die hebräische Wendung מֵרִפְיוֹן יָדָיִם, bewahrt aber ihren körperbildlichen Charakter und ihre kontextuelle Offenheit.
lexical_decisions:
- source_word: מִקּוֹל שַׁעֲטַת פַּרְסוֹת אַבִּירָיו
  choice: Beim Dröhnen der stampfenden Hufe seiner starken Pferde
  rationale: Die Wiedergabe bewahrt den akustischen Schwerpunkt von קוֹל und שַׁעֲטָה sowie das konkrete Bild der Hufe. אַבִּירָיו bezeichnet im Zusammenhang mit Hufen die kräftigen Kriegspferde des angreifenden Feindes.
- source_word: מֵרַעַשׁ לְרִכְבּוֹ
  choice: beim Rasseln seiner Streitwagen
  rationale: רַעַשׁ bezeichnet hier den erschütternden Lärm der herannahenden Wagen; „Rasseln“ ist im Deutschen ein natürliches, anschauliches Geräuschwort. רֶכֶב ist kollektiv als „Streitwagen“ wiedergegeben.
- source_word: הֲמוֹן גַּלְגִּלָּיו
  choice: beim Getöse ihrer Räder
  rationale: הֲמוֹן bezeichnet lauten Lärm oder Getöse. Das Possessivpronomen wird im Deutschen auf die unmittelbar genannten Streitwagen bezogen, weil „seiner Räder“ missverständlich auf eine einzelne Person weisen könnte; sachlich bleiben es die Räder seiner Wagen.
- source_word: לֹא הִפְנוּ אָבוֹת אֶל בָּנִים
  choice: wenden sich die Väter nicht nach ihren Söhnen um
  rationale: Die Konstruktion bezeichnet das Sich-Hinwenden zu den Söhnen. „Sich nach jemandem umwenden“ vermittelt im Fluchtzusammenhang natürlich, dass die Väter nicht einmal zurückschauen oder helfen. Die ausdrücklich männlichen Verwandtschaftsbezeichnungen bleiben erhalten.
- source_word: מֵרִפְיוֹן יָדָיִם
  choice: denn ihre Hände sind kraftlos
  rationale: Die hebräische Wendung beschreibt erschlaffte, schwache Hände als körperliches Bild für lähmende Angst und Handlungsunfähigkeit. Die Formulierung bewahrt dieses Bild in verständlichem Deutsch.
theological_decisions:
- issue: Geschlechtsspezifische Verwandtschaftsbegriffe
  choice: Väter … Söhne
  alternative: Eltern … Kinder
  rationale: Der hebräische Text nennt ausdrücklich Väter und Söhne. Eine Verallgemeinerung würde die konkrete Ausdrucksweise des Ausgangstextes abschwächen.
- issue: Deutung der kraftlosen Hände
  choice: Das körperliche Bild bleibt stehen und wird in einer Fußnote als Angst und Hilflosigkeit erläutert.
  alternative: Eine reine Deutung wie „weil sie vor Angst wie gelähmt sind“
  rationale: So bleibt die Bildsprache des Hebräischen erhalten, ohne die idiomatische Bedeutung für heutige Leserinnen und Leser zu verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger akustischer Bildsprache. Die dreifache Parallelstruktur der Lärmschilderung wird durch „beim … beim … beim“ bewahrt; der Satz bleibt trotz poetischer Dichte gut verständlich.
