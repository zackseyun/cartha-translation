source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל פְּלִשְׁתִּ֑ים בְּ/טֶ֛רֶם יַכֶּ֥ה פַרְעֹ֖ה אֶת עַזָּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/001.yaml
  text: This is the word of Yahweh that came to Jeremiah the prophet concerning the Philistines[b][a], before Pharaoh struck Gaza.
translation:
  language: de
  text: Dies ist das Wort Jahwes, das an den Propheten Jeremia über die Philister[a] erging, bevor der Pharao Gaza schlug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Philister“. Die hebräische Präposition kann das Thema beziehungsweise Ziel eines prophetischen Ausspruchs angeben und in einem Gerichtszusammenhang auch gegnerisch verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  choice: Dies ist das Wort Jahwes, das … erging
  rationale: Die hebräische Relativkonstruktion dient als Überschrift. „Dies ist“ macht diese Funktion im Deutschen deutlich; „das … erging“ bewahrt zugleich die prophetische Offenbarungsformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als Gottes Eigenname wiedergegeben; „Jahwe“ ist die geläufige deutsche Form.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: an den Propheten Jeremia
  rationale: אֶל bezeichnet hier den Empfänger des göttlichen Wortes. Die deutsche Wortstellung ist natürlich und erhält Titel und Namen.
- source_word: אֶל פְּלִשְׁתִּים
  choice: über die Philister
  rationale: In einer prophetischen Überschrift kann אֶל den Gegenstand beziehungsweise das Ziel des Ausspruchs bezeichnen. „Über“ lässt offen, ob der Akzent ausdrücklich feindlich ist.
- source_word: בְּטֶרֶם
  choice: bevor
  rationale: Die Konjunktion gibt das zeitliche Verhältnis knapp und idiomatisch wieder.
- source_word: יַכֶּה
  choice: schlug
  rationale: Das Hifil von נכה kann „schlagen“ oder „besiegen“ bedeuten. „Schlug“ bleibt nahe am hebräischen Ausdruck, ohne das genaue militärische Ergebnis näher festzulegen.
- source_word: פַרְעֹה אֶת עַזָּה
  choice: der Pharao Gaza
  rationale: Der bestimmte hebräische Königstitel wird im Deutschen mit Artikel wiedergegeben; Gaza folgt in seiner üblichen deutschen Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die Transliteration bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Ausspruchs auf die Philister
  choice: über die Philister
  alternative: gegen die Philister
  rationale: Der Kontext ist ein Gerichtswort, doch die Präposition אֶל in Überschriften kann neutral das Thema oder Ziel eines Ausspruchs angeben. Die Hauptfassung vermeidet, die adversative Nuance schon in der Überschrift zwingend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Überschriftsfunktion der ungewöhnlichen hebräischen Eröffnung wird idiomatisch verdeutlicht, während die prophetische Formel und die Mehrdeutigkeit von אֶל erhalten bleiben.
