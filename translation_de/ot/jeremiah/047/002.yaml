source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנֵּה מַ֜יִם עֹלִ֤ים מִ/צָּפוֹן֙ וְ/הָיוּ֙ לְ/נַ֣חַל שׁוֹטֵ֔ף וְ/יִשְׁטְפוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֣שְׁבֵי בָ֑/הּ וְ/זָֽעֲקוּ֙ הָֽ/אָדָ֔ם וְ/הֵילִ֕ל כֹּ֖ל יוֹשֵׁ֥ב הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: de
  text: 'So spricht der HERR[a]: Siehe, Wasser steigen aus dem Norden herauf. Sie werden zu einem reißenden Strom und überfluten das Land und seine ganze Fülle, die Stadt und ihre Bewohner. Da werden die Menschen aufschreien, und jeder Bewohner des Landes wird wehklagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: Macht die Übersetzungstradition „HERR“ transparent und informiert über die Form des Ausgangstextes.
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt den aufmerksamkeitslenkenden und eindringlichen Charakter der hebräischen Partikel natürlich wieder.
- source_word: נַחַל שׁוֹטֵף
  choice: reißender Strom
  rationale: Bezeichnet hier einen mächtigen, alles überschwemmenden Wasserlauf; die anschließende Formulierung „überfluten“ macht den Aspekt des Überströmens ausdrücklich.
- source_word: מְלוֹאָהּ
  choice: alles, was es erfüllt
  rationale: Bewahrt die umfassende hebräische Wendung, statt sie vorschnell auf Besitz, Bevölkerung oder Ertrag einzuengen.
- source_word: הָאָדָם
  choice: die Menschen
  rationale: Der Singular mit Artikel ist hier kollektiv gebraucht; der deutsche Plural gibt diesen allgemeinen Bezug verständlich wieder.
- source_word: הֵילִל
  choice: wehklagen
  rationale: Entspricht dem lauten Klagen angesichts des angekündigten Unheils und wahrt den gehobenen prophetischen Ton.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschen Bibeltradition, kennzeichnet aber durch die Schreibweise in Großbuchstaben, dass im Ausgangstext der Eigenname Gottes steht; die Fußnote macht dies transparent.
- issue: Bildsprache der Wasser aus dem Norden
  choice: Als Bildsprache unverändert wiedergegeben
  alternative: Explizit als feindliches Heer auslegen
  rationale: Der Vers selbst nennt die Wasser und deutet das Bild hier nicht ausdrücklich aus. Die Übersetzung bewahrt daher die prophetische Metapher, ohne ihre Bedeutung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Satzführung. Das zweimalige „Land“ und die umfassende Wendung „alles, was es erfüllt“ bewahren die Struktur und Reichweite des Hebräischen; unnötige archaische Formen wurden vermieden.
