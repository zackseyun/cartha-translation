source:
  edition: WLC
  text: ה֗וֹי חֶ֚רֶב לַֽ/יהוָ֔ה עַד אָ֖נָה לֹ֣א תִשְׁקֹ֑טִי הֵאָֽסְפִי֙ אַל תַּעְרֵ֔/ךְ הֵרָגְעִ֖י וָ/דֹֽמִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/006.yaml
  text: Ah, sword of the LORD, how long will you not be quiet? Return to your sheath; rest and be still.
translation:
  language: de
  text: Ach, Schwert des HERRN, wie lange noch willst du nicht ruhen? Zieh dich in deine Scheide zurück; komm zur Ruhe und sei still!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Ach
  rationale: Die Interjektion drückt hier Klage und Bestürzung aus; „Ach“ wahrt diesen Ton, ohne sie unnötig als ausdrücklichen Weheruf festzulegen.
- source_word: חֶרֶב לַיהוָה
  choice: Schwert des HERRN
  rationale: Die Genitivform gibt die Zugehörigkeit bzw. Beauftragung durch JHWH natürlich wieder; „HERR“ entspricht der üblichen deutschen Wiedergabe des Gottesnamens.
- source_word: עַד־אָנָה לֹא תִשְׁקֹטִי
  choice: wie lange noch willst du nicht ruhen?
  rationale: Die feminine Anrede des Schwertes und die rhetorische Frage bleiben erhalten. „Ruhen“ trifft das Verstummen bzw. Aufhören des Schwertes in natürlichem Deutsch.
- source_word: הֵאָסְפִי אֶל־תַּעְרֵךְ
  choice: Zieh dich in deine Scheide zurück
  rationale: Das seltene תער wird kontextgemäß als Schwertscheide verstanden; הֵאָסְפִי bezeichnet das Zurücknehmen bzw. Einziehen des Schwertes.
- source_word: הֵרָגְעִי וָדֹמִּי
  choice: komm zur Ruhe und sei still
  rationale: 'Die beiden Imperative werden unterscheidbar und idiomatisch wiedergegeben: Aufhören bzw. Ruhe finden und still sein.'
theological_decisions:
- issue: Beziehung des Schwertes zu JHWH
  choice: „Schwert des HERRN“
  alternative: „Schwert für den HERRN“
  rationale: Der Kontext stellt das Schwert als Instrument des göttlichen Gerichts dar. Die knappe Genitivwendung wahrt diese Beziehung, ohne genauer festzulegen, ob Besitz, Beauftragung oder Zweck im Vordergrund steht.
translation_notes:
  register: Moderne, würdige Klagesprache mit direkter Personifizierung des Schwertes. Die Imperative sind klar und mündlich verständlich; die poetische Parallelität bleibt gewahrt.
