id: JER.25.15
reference: Jeremiah 25:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵלַ֔/י קַ֠ח אֶת כּ֨וֹס הַ/יַּ֧יִן הַ/חֵמָ֛ה הַ/זֹּ֖את מִ/יָּדִ֑/י וְ/הִשְׁקִיתָ֤ה אֹת/וֹ֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר אָנֹכִ֛י שֹׁלֵ֥חַ אוֹתְ/ךָ֖ אֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/015.yaml
  text: 'For thus said Yahweh[a], the God of Israel, to me: “Take from my hand this cup of the wine of wrath, and make all the nations to whom I am sending you drink it.”'
translation:
  language: de
  text: 'Denn so sprach der HERR, der Gott Israels, zu mir: »Nimm aus meiner Hand diesen Becher mit dem Wein des Zorns[a] und gib ihn all den Völkern zu trinken, zu denen ich dich sende.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Grimms«.'
    reason: Lexikalische Alternative für חֵמָה; der Ausdruck kann heftigen Zorn beziehungsweise Grimm bezeichnen.
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Großbuchstaben ist verständlich, würdig und kennzeichnet, dass im Hebräischen der Eigenname JHWH steht.
- source_word: כִּי כֹה אָמַר
  choice: Denn so sprach
  rationale: Bewahrt sowohl die anknüpfende Funktion von כִּי als auch die formelhafte Aussage von כֹה אָמַר; das Vergangenheitstempus entspricht dem erzählerischen Kontext und dem hebräischen Perfekt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und im Deutschen geläufige Wiedergabe der hebräischen Genitivverbindung.
- source_word: קַח ... מִיָּדִי
  choice: Nimm aus meiner Hand
  rationale: Gibt Imperativ und Herkunftsangabe genau wieder und erhält das konkrete Bild der Übergabe.
- source_word: כּוֹס הַיַּיִן הַחֵמָה הַזֹּאת
  choice: diesen Becher mit dem Wein des Zorns
  rationale: Erhält Becher und Wein als konkrete Bildelemente. »Mit« klingt im Deutschen natürlicher als eine gestufte Genitivkonstruktion; »des Zorns« bewahrt die Gerichtsbedeutung von חֵמָה.
- source_word: וְהִשְׁקִיתָה אֹתוֹ אֶת כָּל הַגּוֹיִם
  choice: und gib ihn all den Völkern zu trinken
  rationale: Gibt den Kausativ von שׁקה idiomatisch wieder, ohne durch »zwinge« eine im Verb nicht ausdrücklich bezeichnete Gewaltkomponente hinzuzufügen. Das maskuline Pronomen bezieht sich grammatisch auf den Becher.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אוֹתְךָ אֲלֵיהֶם
  choice: zu denen ich dich sende
  rationale: Natürlicher deutscher Relativsatz, der Zielrichtung und fortgeltenden göttlichen Auftrag bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: HERR
  alternative: Jahwe
  rationale: »HERR« folgt einer breit verständlichen deutschen Bibelkonvention und lässt durch die Großschreibung den Gottesnamen erkennen, ohne eine unsichere historische Aussprache in den Haupttext zu setzen.
- issue: Gerichtsbegriff חֵמָה
  choice: Zorn
  alternative: Grimm
  rationale: »Zorn« trägt im heutigen Deutsch die Bedeutung göttlichen Gerichts klar und würdig. »Grimm« ist ebenfalls möglich, wirkt jedoch stärker altertümlich und emotional zugespitzt.
- issue: Causative force of וְהִשְׁקִיתָה
  choice: gib ... zu trinken
  alternative: lass ... trinken
  rationale: Die gewählte Formulierung hält an Gottes wirksamer Veranlassung fest, ohne zu entscheiden, wie wörtlich Jeremias Austeilen des symbolischen Bechers zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht formelhafter prophetischer Rede. Die Becher- und Weinmetaphorik bleibt unaufgelöst; die Satzführung ist nah am Hebräischen, aber idiomatisch deutsch.
