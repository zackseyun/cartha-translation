revisions:
- from: Und an jenem Tag werden die von Jahwe Erschlagenen[a] von einem Ende der Erde bis zum anderen reichen[b]. Sie werden nicht beklagt, nicht eingesammelt und nicht begraben werden; sie werden zu Dung auf der Oberfläche des Erdbodens[c].
  to: Und an jenem Tag werden die von Jahwe Erschlagenen[a] von einem Ende der Erde bis zum anderen daliegen[b]. Sie werden nicht beklagt, nicht eingesammelt und nicht begraben werden; sie werden als Dung auf dem Erdboden daliegen[c].
  rationale: Die Revision ersetzt die missverständliche räumliche Aussage »reichen« durch »daliegen« und glättet die abschließende Bildaussage. Sie bewahrt dabei den Umfang der Aussage, die Abfolge von unterlassener Totenklage, Bergung und Bestattung sowie die erniedrigende Metapher des hebräischen Textes. Die vorhandenen Fußnotenanker bleiben jeweils an ihrer sachlich passenden Stelle.
