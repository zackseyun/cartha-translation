  naturalness: »Die von Jahwe Erschlagenen ... werden ... reichen« klingt für Tote unnatürlich und kann eine aktive Reichweite statt ihrer Lage bezeichnen. »zu Dung auf der Oberfläche des Erdbodens« ist in dieser Stellung ebenfalls holprig. »werden ... als Dung auf dem Erdboden daliegen« ist modernes, würdiges Standarddeutsch und erhält das drastische Bild.
  terminology: »Jahwe«, »beklagt«, »eingesammelt« und »begraben« sind passend. »Erdboden« ist hier natürlicher als die etwas technische Formulierung »Oberfläche des Erdbodens«; die Fußnote bewahrt die wörtliche Bildsprache von »Angesicht des Erdbodens«.
