reference: Jeremiah 25:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָי֞וּ חַֽלְלֵ֤י יְהוָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ לֹ֣א יִסָּפְד֗וּ וְ/לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/033.yaml
  text: And the slain of Yahweh on that day will be from one end of the earth even to the other end of the earth[a]. They will not be mourned, or gathered, or buried[c][b]; they will become dung on the surface of the ground.
translation:
  language: de
  text: Und an jenem Tag werden die von Jahwe Erschlagenen[a] von einem Ende der Erde bis zum anderen daliegen[b]. Sie werden nicht beklagt, nicht eingesammelt und nicht begraben werden; sie werden als Dung auf dem Erdboden daliegen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »die Erschlagenen Jahwes«. Die hebräische Verbindung kann hier diejenigen bezeichnen, die Jahwe erschlagen hat.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »von einem Ende des Landes bis zum anderen«. Das hebräische Wort kann sowohl »Land« als auch »Erde« bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »auf dem Angesicht des Erdbodens«.'
    reason: literal_rendering
lexical_decisions:
- source_word: חַלְלֵי יְהוָה
  choice: die von Jahwe Erschlagenen
  rationale: חַלְלֵי ist der Konstruktplural von חָלָל, »Erschlagene/Getötete«. Die Wiedergabe macht Jahwes Urheberschaft wahrscheinlich, lässt die knappe hebräische Konstruktverbindung aber durch eine Fußnote als formal mehrdeutig erkennbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige wissenschaftliche Umschrift.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Zeitangabe, die zugleich den prophetischen Sprachton bewahrt.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: von einem Ende der Erde bis zum anderen
  rationale: Die Wendung ist ein Merismus für die volle räumliche Ausdehnung. »Erde« entspricht dem weltweiten Horizont des Zusammenhangs; die ebenfalls mögliche Bedeutung »Land« wird in einer Fußnote bewahrt.
- source_word: לֹא יִסָּפְדוּ
  choice: sie werden nicht beklagt
  rationale: Das Nifal bezeichnet hier, dass den Getöteten keine Totenklage zuteilwird. »Beklagt« ist knapp und idiomatisch.
- source_word: וְלֹא יֵאָסְפוּ
  choice: nicht eingesammelt
  rationale: Gemeint ist das Aufsammeln beziehungsweise Bergen der Leichen. »Eingesammelt« erhält das konkrete Bild und die Abfolge vor dem Begraben.
- source_word: וְלֹא יִקָּבֵרוּ
  choice: nicht begraben
  rationale: Direkte und natürliche Wiedergabe des passiven Verbs קבר.
- source_word: לְדֹמֶן ... יִהְיוּ
  choice: sie werden zu Dung
  rationale: Die resultative Konstruktion wird ohne ein im Hebräischen nicht ausdrücklich vorhandenes Vergleichswort wiedergegeben und bewahrt die drastische Erniedrigung des Bildes.
- source_word: עַל־פְּנֵי הָאֲדָמָה
  choice: auf der Oberfläche des Erdbodens
  rationale: Die Formulierung gibt das räumliche Bild von פְּנֵי, wörtlich »Angesicht/Oberfläche«, verständlich und konkret wieder.
theological_decisions:
- issue: Bedeutung der Konstruktverbindung חַלְלֵי יְהוָה
  choice: die von Jahwe Erschlagenen
  alternative: die Erschlagenen Jahwes
  rationale: Im Gerichtszusammenhang ist Jahwe am ehesten als Urheber des Erschlagens zu verstehen. Da die hebräische Konstruktverbindung formal auch als Zugehörigkeitsbezeichnung gelesen werden kann, nennt die Fußnote die kompaktere Alternative.
- issue: Räumlicher Umfang von אֶרֶץ
  choice: Erde
  alternative: Land
  rationale: Der weitere Ausspruch richtet den Blick auf die Völker und schildert ein umfassendes Gericht. Daher ist »Erde« im Kontext vorzuziehen, ohne die lexikalisch mögliche Lesart »Land« auszuschließen.
- issue: Bildsprache von לְדֹמֶן ... יִהְיוּ
  choice: sie werden zu Dung
  alternative: sie werden wie Dung sein
  rationale: Das לְ kann einen resultativen Zustand ausdrücken. Die gewählte Fassung bewahrt die Härte der Aussage und fügt kein ausdrückliches Vergleichswort hinzu; die alternative similitische Auffassung bleibt sprachlich möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-feierlichem Rhythmus. Die dreifache Verneinung bleibt als eindringliche Reihung erhalten; drastische Gerichtssprache wird nicht abgeschwächt.
