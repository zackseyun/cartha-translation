id: JER.25.27
reference: Jeremiah 25:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁת֤וּ וְ/שִׁכְרוּ֙ וּ/קְי֔וּ וְ/נִפְל֖וּ וְ/לֹ֣א תָק֑וּמוּ מִ/פְּנֵ֣י הַ/חֶ֔רֶב אֲשֶׁ֛ר אָנֹכִ֥י שֹׁלֵ֖חַ בֵּינֵי/כֶֽםס־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/027.yaml
  text: 'You shall say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Drink and become drunk, and vomit, and fall, and do not rise, because of the sword that I am sending among you.’'
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »So spricht Yahweh der Heerscharen, der Gott Israels: Trinkt, werdet betrunken und erbrecht[a]; fallt hin und steht nicht auf wegen des Schwertes, das ich in eure Mitte sende.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „speit“.'
    reason: Das seltene hebräische Verb kann mit „erbrechen“ oder dem stilistisch kräftigeren „speien“ wiedergegeben werden.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Und du sollst zu ihnen sagen
  rationale: Das Waw mit Perfekt setzt im prophetischen Auftrag die Anweisung fort. „Du sollst“ bewahrt den beauftragenden Ton, während „Und“ den Anschluss an den Kontext sichtbar macht.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die geläufige und würdevolle deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh der Heerscharen
  rationale: Der Gottesname wird als „Yahweh“ wiedergegeben. „Heerscharen“ erhält die Breite des Titels, ohne ihn auf menschliche Armeen zu beschränken.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: שְׁתוּ וְשִׁכְרוּ
  choice: Trinkt, werdet betrunken
  rationale: Die beiden pluralischen Imperative und die einsetzende Trunkenheit werden unmittelbar wiedergegeben.
- source_word: וּקְיוּ
  choice: und erbrecht
  rationale: Das seltene Verb bezeichnet Erbrechen; „erbrechen“ ist im modernen Standarddeutsch klar und präzise.
- source_word: וְנִפְלוּ וְלֹא תָקוּמוּ
  choice: fallt hin und steht nicht auf
  rationale: Die Folge von Imperativen bleibt erhalten. Es wird weder „nie wieder“ noch „nicht mehr“ ergänzt, damit die Endgültigkeit nicht stärker formuliert wird als im Hebräischen.
- source_word: מִפְּנֵי הַחֶרֶב
  choice: wegen des Schwertes
  rationale: Die Wendung bezeichnet hier den Grund beziehungsweise Anlass ihres Fallens und Nichtaufstehens. „Wegen“ ist im Deutschen klar, während „vor dem Schwert“ räumlich oder furchtbezogen missverstanden werden könnte.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ בֵּינֵיכֶם
  choice: das ich in eure Mitte sende
  rationale: „In eure Mitte“ bewahrt die räumliche Aussage von בֵּינֵיכֶם genauer als das deutendere „gegen euch“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. Die Transliteration „Yahweh“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bildsprache von Trunkenheit und Schwertgericht
  choice: Die Befehlsfolge und das Schwert als von Gott gesandtes Gericht bleiben unvermittelt stehen.
  alternative: Die Aussagen als bloßen Vergleich auszudeuten oder erläuternd abzuschwächen.
  rationale: Der Vers verbindet die Becher- und Trunkenheitsmetaphorik mit dem tatsächlichen Schwertgericht. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Rede. Die knappe Reihung der Imperative und die harte Gerichtssprache des Ausgangstextes bleiben erhalten.
