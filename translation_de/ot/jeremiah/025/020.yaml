base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/020.yaml
  text: and all the mixed people[a], and all the kings of the land of Uz, and all the kings of the land of the Philistines—Ashkelon, Gaza, Ekron, and the remnant of Ashdod[c][b];
translation:
  language: de
  text: und das ganze Mischvolk[a], alle Könige des Landes Uz und alle Könige des Landes der Philister[b], und Aschkelon, Gaza, Ekron und den Rest von Aschdod[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die ganze gemischte Bevölkerung«; möglicherweise ist eine ethnisch gemischte fremde Bevölkerungsgruppe und kein bestimmtes Volk gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »das Land der Philister«; traditionell auch: »Philistäa«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »was von Aschdod übrig geblieben war« beziehungsweise »die Überlebenden von Aschdod«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶרֶב
  choice: das ganze Mischvolk
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich eine ethnisch gemischte Bevölkerungsgruppe und nicht eindeutig ein bestimmtes Volk. »Mischvolk« bewahrt diese Bedeutung knapp und verständlich.
- source_word: מַלְכֵי אֶרֶץ הָעוּץ
  choice: alle Könige des Landes Uz
  rationale: אֶרֶץ bezeichnet in dieser geopolitischen Aufzählung ein Land oder Gebiet; Uz bleibt als Ortsname unübersetzt.
- source_word: מַלְכֵי אֶרֶץ פְּלִשְׁתִּים
  choice: alle Könige des Landes der Philister
  rationale: Die Formulierung bildet die ethnisch-geografische Wendung des Hebräischen transparent ab und bleibt im Deutschen natürlich.
- source_word: אַשְׁקְלוֹן
  choice: Aschkelon
  rationale: Gebräuchliche deutsche Form des Städtenamens.
- source_word: עַזָּה
  choice: Gaza
  rationale: Eingebürgerte deutsche Form des Städtenamens.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Gebräuchliche deutsche Form des Städtenamens.
- source_word: שְׁאֵרִית אַשְׁדּוֹד
  choice: den Rest von Aschdod
  rationale: שְׁאֵרִית bezeichnet das, was nach einer Verwüstung übrig geblieben ist. »Rest« bewahrt die Offenheit, ob vor allem die Bevölkerung oder der Stadtstaat gemeint ist.
