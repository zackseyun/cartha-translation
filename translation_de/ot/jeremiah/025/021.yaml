  yaml_path: translation/ot/jeremiah/025/021.yaml
  text: Edom[a], Moab, and the sons of Ammon;
translation:
  language: de
  text: Edom, Moab und die Söhne Ammons[a];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ammoniter“; wörtlich: „die Söhne Ammons“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der Eigenname bezeichnet hier das Land beziehungsweise das Volk als politische Größe; die geläufige deutsche Namensform bleibt erhalten.
- source_word: מוֹאָב
  choice: Moab
  rationale: Der Eigenname wird als Moab wiedergegeben, ohne ihn durch die engere Volksbezeichnung „Moabiter“ zu ersetzen.
- source_word: בְּנֵי עַמּוֹן
  choice: die Söhne Ammons
  rationale: Die Wiedergabe bewahrt die hebräische Verwandtschaftsbezeichnung wörtlich und bleibt im Deutschen verständlich; idiomatisch kann damit das Volk der Ammoniter gemeint sein.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: '[Akkusativobjekte als einfache Aufzählung]'
  rationale: Die wiederholte hebräische Objektpartikel hat keine eigene deutsche Entsprechung. Die Konjunktionen werden in einer natürlichen deutschen Aufzählung durch „und“ vor dem letzten Glied wiedergegeben.
