  verdict: revise
  source_fidelity: Die Aufzählung und die resultative Infinitivkonstruktion sind grundsätzlich zutreffend wiedergegeben. „Trümmerstätte“ legt jedoch zu stark einen konkreten Ort fest, obwohl חָרְבָּה auch die Verwüstung bzw. Verödung selbst bezeichnet; dies ist angesichts der mitgenannten Könige und Amtsträger weniger passend. Die Umschreibung „etwas, das man auspfeift“ gibt שְׁרֵקָה zwar dem Sinn nach wieder, schwächt aber die knappe, parallele hebräische Reihe.
  naturalness: Die Fassung ist verständlich, doch „zu einer Trümmerstätte“ und besonders „zu etwas, das man auspfeift“ sind in der Reihe stilistisch uneinheitlich. Eine substantivische Parallelreihe ist im modernen Standarddeutsch zugleich natürlicher und näher am Ausgangstext.
  terminology: „Städte Judas“, „Könige“ und „Beamte“ sind angemessen. „Zum Entsetzen“ gibt die von שַׁמָּה ausgelöste Bestürzung idiomatisch wieder. „Zum Gegenstand höhnischen Pfeifens“ erhält bei שְׁרֵקָה das konkrete Bild des spöttischen Pfeifens, ohne es zu einer bloßen allgemeinen Verspottung zu verflachen.
