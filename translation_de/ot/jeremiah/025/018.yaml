  to: Jerusalem, die Städte Judas, seine Könige und seine führenden Beamten – um sie zur Verwüstung, zum Entsetzen[a], zum Gegenstand höhnischen Pfeifens[b] und zum Fluch zu machen, wie es heute der Fall ist.
  rationale: Die Revision bewahrt die vollständige Aufzählung, die resultative Aussage und die Ambivalenz der beiden Begriffe für bestürzte Reaktion und höhnisches Pfeifen. Zugleich stellt sie eine natürliche, parallel gebaute deutsche Reihe her und vermeidet die unnötige Festlegung von חָרְבָּה auf eine örtliche „Trümmerstätte“.
