  text: אֶת יְרוּשָׁלִַ֨ם֙ וְ/אֶת עָרֵ֣י יְהוּדָ֔ה וְ/אֶת מְלָכֶ֖י/הָ אֶת שָׂרֶ֑י/הָ לָ/תֵ֨ת אֹתָ֜/ם לְ/חָרְבָּ֧ה לְ/שַׁמָּ֛ה לִ/שְׁרֵקָ֥ה וְ/לִ/קְלָלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/018.yaml
  text: Jerusalem[a], the cities of Judah, her kings, and her officials—to make them a ruin, a horror, a hissing, and a curse[b], as it is this day.
translation:
  language: de
  text: Jerusalem, die Städte Judas, seine Könige und seine führenden Beamten – um sie zur Verwüstung, zum Entsetzen[a], zum Gegenstand höhnischen Pfeifens[b] und zum Fluch zu machen, wie es heute der Fall ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Erstaunen“. Das hebräische Wort kann die bestürzte Reaktion hervorheben, die eine Verwüstung auslöst.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zum Pfeifen“. Gemeint ist das höhnische oder spöttische Pfeifen derer, die den verwüsteten Ort sehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: עָרֵי יְהוּדָה
  choice: die Städte Judas
  rationale: Gibt die hebräische Genitivverbindung knapp und natürlich wieder.
- source_word: מְלָכֶיהָ
  choice: seine Könige
  rationale: Das Possessivpronomen bezieht sich im Deutschen grammatisch auf Juda; so bleibt die Zugehörigkeit gewahrt, ohne eine im Deutschen unnatürliche feminine Personifikation zu erzwingen.
- source_word: שָׂרֶיהָ
  choice: seine führenden Beamten
  rationale: שׂרים bezeichnet hier politische Amtsträger beziehungsweise Führungspersonen; „Beamte“ vermeidet das mögliche Missverständnis, es seien ausschließlich Prinzen gemeint.
- source_word: לָתֵת אֹתָם
  choice: um sie … zu machen
  rationale: נתן mit den folgenden ל-Konstruktionen beschreibt das herbeigeführte Ergebnis; die deutsche Wendung gibt diese resultative Bedeutung idiomatisch wieder.
- source_word: לְחָרְבָּה
  choice: zu einer Trümmerstätte
  rationale: Bezeichnet einen verwüsteten, in Ruinen liegenden Ort und ist konkreter als das abstrakte „Verwüstung“.
- source_word: לְשַׁמָּה
  choice: zu einem Bild des Entsetzens
  rationale: Der Ausdruck bezeichnet Verwüstung, die bei Betrachtenden Bestürzung und Entsetzen hervorruft.
- source_word: לִשְׁרֵקָה
  choice: zu etwas, das man auspfeift
  rationale: Bewahrt das konkrete Bild des verächtlichen Pfeifens angesichts eines verwüsteten Ortes und macht seine spöttische Funktion verständlich.
- source_word: וְלִקְלָלָה
  choice: zu einem Fluch
  rationale: Die knappe Form wahrt den Gedanken, dass der verwüstete Ort sprichwörtlich in Verwünschungen genannt wird.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Die Wendung verweist auf den gegenwärtig sichtbaren Zustand als Bestätigung des Gesagten.
