source:
  edition: WLC
  text: הִנְ/נִ֣י שֹׁלֵ֡חַ וְ/לָקַחְתִּי֩ אֶת כָּל מִשְׁפְּח֨וֹת צָפ֜וֹן נְאֻם יְהוָ֗ה וְ/אֶל נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶל֮ עַבְדִּ/י֒ וַ/הֲבִ֨אֹתִ֜י/ם עַל הָ/אָ֤רֶץ הַ/זֹּאת֙ וְ/עַל יֹ֣שְׁבֶ֔י/הָ וְ/עַ֛ל כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה סָבִ֑יב וְ/הַ֣חֲרַמְתִּ֔י/ם וְ/שַׂמְתִּי/ם֙ לְ/שַׁמָּ֣ה וְ/לִ/שְׁרֵקָ֔ה וּ/לְ/חָרְב֖וֹת עוֹלָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/009.yaml
  text: Look[a], I am sending for and taking all the clans of the north, declares Yahweh, and Nebuchadnezzar king of Babylon, my servant, and I will bring them against this land and against its inhabitants and against all these surrounding nations[b]. I will devote them to destruction and make them a horror, a hissing[c], and everlasting ruins.
translation:
  language: de
  text: Seht, ich lasse alle Sippen des Nordens kommen – Spruch Jahwes – und auch Nebukadrezzar, den König von Babel, meinen Diener[a][b]. Ich werde sie gegen dieses Land, gegen seine Bewohner und gegen alle diese Völker ringsum bringen. Ich werde sie dem Untergang weihen[c] und sie zum Entsetzen, zum Zischen[d] und zu Ruinen für immer[e] machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Satzbau ist an dieser Stelle ungewöhnlich. Nebukadrezzar kann als in das Herbeiholen einbezogen verstanden werden; die Präposition kann auch als eigenständige Ergänzung verstanden werden: „und zu Nebukadrezzar …“.'
    reason: textual_syntax
  - marker: b
    text: „Mein Diener“ bezeichnet Nebukadrezzar hier als Werkzeug, dessen sich Jahwe für sein Gericht bedient; damit ist nicht notwendig gesagt, dass er Jahwe treu verehrte.
    reason: cultural_theological_note
  - marker: c
    text: 'Oder: „vollständig vernichten“. Das hebräische Verb kann bedeuten, Menschen oder Dinge dem Bann und damit dem Untergang zu weihen.'
    reason: lexical_alternative
  - marker: d
    text: Das Zischen kann hier Spott, Verachtung oder erschrockenes Staunen ausdrücken.
    reason: cultural_note
  - marker: e
    text: Das hebräische Wort kann je nach Zusammenhang „für immer“, „dauerhaft“ oder „auf unabsehbare Zeit“ bedeuten.
    reason: lexical_semantic_note
lexical_decisions:
- source_word: הִנְנִי
  choice: Seht
  rationale: Leitet eine feierliche göttliche Ankündigung ein und bewahrt die aufmerksamkeitslenkende Kraft der Wendung in natürlichem modernem Deutsch.
- source_word: שֹׁלֵחַ וְלָקַחְתִּי
  choice: ich lasse … kommen
  rationale: Die Verbindung bezeichnet hier das unmittelbar bevorstehende, als gewiss dargestellte Herbeiholen beziehungsweise Aufbieten der nördlichen Gruppen. Die deutsche Kausativform gibt den Sinn flüssig wieder, ohne die prophetische Eindringlichkeit zu verlieren.
- source_word: מִשְׁפְּחוֹת צָפוֹן
  choice: alle Sippen des Nordens
  rationale: מִשְׁפָּחוֹת bezeichnet verwandtschaftlich oder ethnisch verbundene Gruppen; „Sippen“ passt hier besser als das häuslich klingende „Familien“ und legt keine technisch festgelegte Stammesordnung nahe.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Eine knappe, würdige und im prophetischen Zusammenhang verständliche Wiedergabe der festen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְאֶל נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל עַבְדִּי
  choice: und auch Nebukadrezzar, den König von Babel, meinen Diener
  rationale: Die ungewöhnliche hebräische Fügung wird als Einbeziehung Nebukadrezzars in das göttliche Aufgebot verstanden. „Auch“ macht diese Beziehung im Deutschen lesbar; eine Fußnote wahrt die syntaktische Schwierigkeit.
- source_word: וַהֲבִאֹתִים
  choice: Ich bringe sie
  rationale: Das Verb setzt die angekündigte, als gewiss dargestellte Handlung fort. Das Präsens hält die lebendige prophetische Perspektive aufrecht.
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: über dieses Land
  rationale: „Über“ bezeichnet hier das feindliche Heranführen einer Macht gegen das Land und bewahrt zugleich etwas von der räumlichen Bildlichkeit der Präposition.
- source_word: וְהַחֲרַמְתִּים
  choice: Ich werde sie dem Untergang weihen
  rationale: Die Formulierung bewahrt den besonderen Sinn von חרם, etwas unwiderruflich der Vernichtung preiszugeben, ohne den unverständlicheren Fachausdruck „mit dem Bann belegen“ in den Haupttext zu setzen.
- source_word: לְשַׁמָּה
  choice: zum Entsetzen
  rationale: Das Wort kann sowohl den verwüsteten Zustand als auch das Entsetzen der Betrachter bezeichnen. „Zum Entsetzen“ passt zur Aufzählung der Wirkungen des Gerichts und lässt diese Spannung bestehen.
- source_word: לִשְׁרֵקָה
  choice: zum Anlass für höhnisches Zischen
  rationale: Die Wendung bewahrt das konkrete Lautbild des Zischens und macht zugleich seine Funktion als Ausdruck von Spott oder Verachtung verständlich.
- source_word: לְחָרְבוֹת עוֹלָם
  choice: zu Ruinen für immer
  rationale: Eine direkte und eindringliche Wiedergabe; die mögliche zeitliche Spannweite von עוֹלָם wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Nebukadrezzar als „mein Diener“
  choice: Die Bezeichnung wird wörtlich beibehalten und als Rolle eines von Jahwe gebrauchten Werkzeugs verstanden.
  alternative: Die Bezeichnung könnte persönliche Frömmigkeit oder Bundestreue Nebukadrezzars ausdrücken.
  rationale: Der unmittelbare Zusammenhang handelt von Jahwes Herrschaft über die Völker und davon, dass Babel sein Gericht ausführt. Der Text rechtfertigt es nicht, darüber hinaus persönliche Glaubenstreue vorauszusetzen.
- issue: Bedeutung von חרם
  choice: dem Untergang weihen
  alternative: vollständig vernichten; mit dem Bann belegen
  rationale: Die gewählte Formulierung erhält sowohl den Vernichtungsaspekt als auch die Vorstellung einer unwiderruflichen Bestimmung, bleibt aber für heutige Leser verständlich.
- issue: Reichweite von עוֹלָם
  choice: für immer
  alternative: auf unabsehbare Zeit; dauerhaft
  rationale: Die starke Zeitangabe des Textes bleibt im Haupttext stehen. Die Fußnote weist darauf hin, dass das hebräische Wort je nach Zusammenhang auch eine unübersehbar lange Dauer bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Der Gedankenstrich hebt die Botenformel ab, ohne den langen hebräischen Satz künstlich schwer zu machen. „Nebukadrezzar“ folgt der Namensform des vorliegenden hebräischen Textes; „Babel“ bewahrt die biblisch-hebräische Ortsbezeichnung.
