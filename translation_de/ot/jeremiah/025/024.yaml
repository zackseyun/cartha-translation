source:
  edition: WLC
  text: וְ/אֵ֖ת כָּל מַלְכֵ֣י עֲרָ֑ב וְ/אֵת֙ כָּל מַלְכֵ֣י הָ/עֶ֔רֶב הַ/שֹּׁכְנִ֖ים בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/024.yaml
  text: and all the kings of Arabia[a], and all the kings of the mixed peoples who dwell in the wilderness[b];
translation:
  language: de
  text: und alle Könige Arabiens[a] und alle Könige der gemischten Völker, die in der Wüste[b] wohnen;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aller Könige der Araber«. Das hier stehende hebräische Wort unterscheidet sich von der Bezeichnung für die »gemischten Völker« im nächsten Satzteil.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »in der Wildnis«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי
  choice: Könige … / Könige der …
  rationale: Der Konstruktus Plural von מֶלֶךְ regiert jeweils die folgende Gruppenbezeichnung; die deutsche Genitivkonstruktion gibt dies natürlich wieder.
- source_word: עֲרָב
  choice: Arabiens
  rationale: Das Substantiv bezeichnet hier Arabien beziehungsweise dessen Bevölkerung und steht in der Aufzählung politisch-ethnischer Größen. „Arabiens“ fügt sich idiomatisch an „Könige“ an.
- source_word: הָעֶרֶב
  choice: der gemischten Völker
  rationale: עֶרֶב ist von dem unmittelbar zuvor stehenden עֲרָב zu unterscheiden und bezeichnet wahrscheinlich eine gemischte Bevölkerung oder Völkerschaft. Die Wiedergabe bewahrt diesen lexikalischen Unterschied.
- source_word: הַשֹּׁכְנִים
  choice: die … wohnen
  rationale: Das attributiv gebrauchte Qal-Partizip Plural von ישׁב wird als deutscher Relativsatz wiedergegeben und bezieht sich auf die gemischten Völker.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbesiedeltes, trockenes Land; „Wüste“ ist im heutigen Deutsch klar und entspricht hier dem Lebensraum der genannten Gruppen.
- source_word: וְאֵת ... וְאֵת
  choice: und … und
  rationale: Die wiederholte Konjunktion führt die Aufzählung fort. Der nicht übersetzbare Akkusativmarker אֵת bleibt im Deutschen unausgedrückt, während das wiederholte „und“ die Struktur erhält.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Satzstruktur des hebräischen Nationenkatalogs bleibt erhalten; „gemischte Völker“ wahrt die schwierige lexikalische Unterscheidung zu „Arabien“, ohne die betreffende Gruppe genauer festzulegen, als es der Ausgangstext erlaubt.
