base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/019.yaml
  text: Pharaoh king of Egypt, his servants, his officials, and all his people;
translation:
  language: de
  text: den Pharao, den König von Ägypten, seine Diener, seine Beamten und sein ganzes Volk;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּרְעֹה
  choice: den Pharao
  rationale: Der Herrschertitel wird nach der etablierten deutschen Namensform wiedergegeben. Der Akkusativ entspricht dem hebräischen Objektmarker אֶת und dem übergeordneten Satz.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: den König von Ägypten
  rationale: Die Status-constructus-Verbindung bezeichnet Pharao als Herrscher Ägyptens. Im Deutschen verlangt die Apposition hier ebenfalls den Akkusativ mit bestimmtem Artikel.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: עֶבֶד kann Diener, Sklave oder königlicher Bediensteter bedeuten. In dieser Aufzählung am Hof wahrt „Diener“ die Bedeutungsbreite, ohne einen rechtlichen Sklavenstatus festzulegen.
- source_word: שָׂרָיו
  choice: seine Beamten
  rationale: שַׂר bezeichnet leitende Amtsträger, Fürsten oder Befehlshaber. „Beamte“ ist in diesem politischen Kontext eine klare, moderne Sammelbezeichnung und vermeidet die mögliche Fehlannahme, es handle sich um Königssöhne.
- source_word: כָּל עַמּוֹ
  choice: sein ganzes Volk
  rationale: עַם bezeichnet kollektiv das Volk; כָּל macht die umfassende Aussage deutlich. Die deutsche Wortstellung „sein ganzes Volk“ ist direkt und idiomatisch.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: Akkusativische Aufzählung mit abschließendem „und“
  rationale: Der wiederholte hebräische Objektmarker gliedert die Reihe. Im Deutschen wird seine syntaktische Funktion durch den Akkusativ ausgedrückt; eine mechanische Wiederholung ist weder möglich noch nötig.
