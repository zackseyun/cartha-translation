source:
  edition: WLC
  text: בָּ֤א שָׁאוֹן֙ עַד קְצֵ֣ה הָ/אָ֔רֶץ כִּ֣י רִ֤יב לַֽ/יהוָה֙ בַּ/גּוֹיִ֔ם נִשְׁפָּ֥ט ה֖וּא לְ/כָל בָּשָׂ֑ר הָ/רְשָׁעִ֛ים נְתָנָ֥/ם לַ/חֶ֖רֶב נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/031.yaml
  text: An uproar has come to the end of the earth[a], for Yahweh has a case against the nations; he is entering into judgment with all flesh. He has given the wicked to the sword[d][c][b], declares Yahweh.
translation:
  language: de
  text: Ein Getöse ist bis ans Ende der Erde gedrungen[a], denn Jahwe führt einen Rechtsstreit mit den Völkern; mit allen Menschen geht er ins Gericht[b]. Die Gottlosen hat er dem Schwert preisgegeben[c] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lärm“, „Tumult“ oder „Tosen“ statt „Getöse“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mit allem Fleisch“, eine hebräische Wendung für die gesamte Menschheit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Er hat sie dem Schwert ausgeliefert.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוֹן
  choice: Lärm
  rationale: Das Wort bezeichnet hier ein lautes, unheilvolles Getöse beziehungsweise Kampfgetümmel. „Lärm“ ist natürlich und wahrt die Breite des hebräischen Ausdrucks; Alternativen stehen in der Fußnote.
- source_word: בָּא
  choice: dringt
  rationale: Das hebräische Perfekt schildert das prophetisch gewisse Geschehen lebhaft. Zusammen mit „Lärm“ gibt „dringt bis“ die Bewegung und Reichweite im Deutschen idiomatisch wieder.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: bis ans Ende der Erde
  rationale: Die Einzahl קְצֵה wird bewahrt. Der Ausdruck bezeichnet den äußersten Bereich beziehungsweise die volle Weite der Erde.
- source_word: רִיב לַיהוָה בַּגּוֹיִם
  choice: Jahwe führt einen Rechtsstreit gegen die Völker
  rationale: רִיב besitzt in diesem prophetischen Zusammenhang deutlich forensische Kraft. „Rechtsstreit“ erhält das juristische Bild, während „gegen“ die gegnerische Beziehung im Deutschen klar ausdrückt.
- source_word: נִשְׁפָּט הוּא
  choice: geht er ins Gericht
  rationale: Die Niphalform steht in einem gerichtlichen Zusammenhang und kann ein Sich-Einlassen auf ein Gerichtsverfahren bezeichnen. Die Formulierung wahrt das forensische Bild, ohne vorschnell nur das Urteil zu benennen.
- source_word: לְכָל בָּשָׂר
  choice: mit allen Menschen
  rationale: Wörtlich steht „mit allem Fleisch“, eine hebräische Wendung für die gesamte Menschheit. Die natürliche deutsche Wiedergabe vermittelt den universalen Umfang unmittelbar; der Bildwortlaut wird in der Fußnote dokumentiert.
- source_word: הָרְשָׁעִים
  choice: die Schuldigen
  rationale: Im forensischen Kontext kann רְשָׁעִים die als schuldig beziehungsweise im Unrecht Befundenen bezeichnen. „Die Schuldigen“ bindet den Ausdruck an das Rechtsmotiv, ohne seine moralische Dimension aufzuheben.
- source_word: נְתָנָם לַחֶרֶב
  choice: gibt er dem Schwert preis
  rationale: Die hebräische Wendung bezeichnet die Auslieferung an gewaltsamen Tod. „Dem Schwert preisgeben“ ist im Deutschen verständlich, prägnant und erhält das Quellbild.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben und von gewöhnlichem „sagen“ unterschieden.
theological_decisions:
- issue: Juristische Bildsprache des göttlichen Gerichts
  choice: „führt einen Rechtsstreit“ und „geht ... ins Gericht“
  alternative: „hat einen Streit“ und „richtet“
  rationale: Die Verbindung von רִיב und נשפט entfaltet ein ausdrücklich forensisches Bild. Die Übersetzung erhält die Spannung, dass Jahwe als Prozessgegner auftritt und Gericht ausübt, ohne sie systematisch aufzulösen.
- issue: Reichweite von כָל־בָּשָׂר
  choice: „alle Menschen“
  alternative: „alles Fleisch“
  rationale: Die Wendung umfasst hier die Menschheit. Die Hauptübersetzung macht diese universale Reichweite für heutige Leser unmittelbar verständlich, während die wörtliche Bildsprache in einer Fußnote erhalten bleibt.
- issue: Bedeutung von הָרְשָׁעִים im Gerichtskontext
  choice: „die Schuldigen“
  alternative: „die Gottlosen“ oder „die Bösen“
  rationale: „Die Schuldigen“ wahrt die forensische Einbettung des Verses und bezeichnet diejenigen, die im Unrecht sind, ohne eine konfessionell geprägte Kategorie einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erhaltener prophetischer und juristischer Bildsprache. Der Singular „Ende der Erde“ folgt eng dem Hebräischen. Die Satzfolge bleibt knapp und feierlich; der Gedankenstrich markiert die abschließende prophetische Formel.
