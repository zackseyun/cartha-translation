  variant: modern standard German
source:
  edition: WLC
  text: הֵילִ֨ילוּ הָ/רֹעִ֜ים וְ/זַעֲק֗וּ וְ/הִֽתְפַּלְּשׁוּ֙ אַדִּירֵ֣י הַ/צֹּ֔אן כִּֽי מָלְא֥וּ יְמֵי/כֶ֖ם לִ/טְב֑וֹחַ וּ/תְפוֹצ֣וֹתִי/כֶ֔ם וּ/נְפַלְתֶּ֖ם כִּ/כְלִ֥י חֶמְדָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/034.yaml
  text: Wail[a], you shepherds, and cry out; roll in the dust, you lords of the flock, for the days of your slaughter are fulfilled[b], and your dispersions have come[e][d][c], and you will fall like a precious vessel.
translation:
  language: de
  text: Heult[a], ihr Hirten, und schreit; wälzt euch im Staub, ihr Mächtigen der Herde! Denn die Tage eurer Schlachtung und eurer Zerstreuungen[b] sind erfüllt, und ihr werdet fallen wie ein kostbares Gefäß[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Klagt laut“. Das hebräische Verb bezeichnet ein lautes Heulen oder Wehklagen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Form ist schwierig und steht im Plural. Sie kann „eure Zerstreuungen“ bedeuten; möglich ist auch die Bedeutung „euer Zerstreutwerden“.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „wie ein begehrenswertes Gefäß“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Heult
  rationale: Der Imperativ von ילל bezeichnet lautes Klagen oder Heulen. „Heult“ bewahrt die starke, hörbare Klage und ist im Deutschen unmittelbar verständlich.
- source_word: הָרֹעִים
  choice: ihr Hirten
  rationale: Die direkte Anrede wird ausdrücklich wiedergegeben; das Hirtenbild bleibt erhalten und wird nicht im Haupttext als Herrscherbild ausgedeutet.
- source_word: וְזַעֲקוּ
  choice: und schreit
  rationale: זעק bezeichnet einen lauten Ruf, besonders aus Not. „Schreit“ setzt die eindringliche Klagesprache natürlich fort.
- source_word: וְהִתְפַּלְּשׁוּ
  choice: Wälzt euch im Staub
  rationale: Die reflexive Form bezeichnet hier wahrscheinlich eine Trauer- und Demütigungsgeste. „Im Staub“ macht die kulturell vorausgesetzte Handlung verständlich.
- source_word: אַדִּירֵי הַצֹּאן
  choice: ihr Mächtigen der Herde
  rationale: אַדִּיר kann mächtig, vornehm oder majestätisch bedeuten. „Mächtige“ bewahrt Rang und Einfluss, ohne einen bestimmten politischen Titel einzutragen.
- source_word: כִּי מָלְאוּ יְמֵיכֶם לִטְבוֹחַ
  choice: Denn eure Tage sind erfüllt, an denen ihr geschlachtet werdet
  rationale: Die Fülle der Tage und die drastische Schlachtsprache bleiben erhalten; der Relativsatz macht die knappe hebräische Konstruktion in modernem Deutsch verständlich.
- source_word: וּתְפוֹצוֹתִיכֶם
  choice: die Zeit eurer Zerstreuung ist da
  rationale: Die schwierige Nominalform wird auf Zerstreuung bezogen. „Die Zeit ... ist da“ ergänzt aus dem parallelen Satzbau den Eintritt des angekündigten Geschehens, ohne die textliche Schwierigkeit zu verschweigen.
- source_word: וּנְפַלְתֶּם
  choice: Ihr werdet fallen
  rationale: Das Perfekt mit konsekutivem beziehungsweise zukünftigem Sinn kündigt die Folge des Gerichts an.
- source_word: כִּכְלִי חֶמְדָּה
  choice: wie ein kostbares Gefäß
  rationale: כְּלִי bezeichnet einen Gegenstand oder ein Gefäß, חֶמְדָּה etwas Begehrenswertes oder Kostbares. Die Wiedergabe erhält sowohl den Wert als auch die im Bild mitschwingende Zerbrechlichkeit.
theological_decisions:
- issue: Bildliche Bedeutung von „Hirten“ und „Mächtigen der Herde“
  choice: Das Hirten- und Herdenbild bleibt im Haupttext stehen.
  alternative: Die Angesprochenen ausdrücklich als Herrscher oder führende Männer bezeichnen.
  rationale: Der Zusammenhang zielt wahrscheinlich auf Machthaber, doch der hebräische Text formuliert metaphorisch. Die Übersetzung soll diese Deutung nicht an die Stelle des Bildes setzen.
- issue: Gewaltgehalt von לִטְבוֹחַ
  choice: „geschlachtet werdet“
  alternative: Zu „umkommt“ oder „vernichtet werdet“ abschwächen.
  rationale: Das Verb bezeichnet Schlachten und gehört zur drastischen Gerichtssprache des Verses. Eine mildere Formulierung würde die Aussage abschwächen.
- issue: Deutung von וּתְפוֹצוֹתִיכֶם
  choice: Auf die bevorstehende Zerstreuung der Angesprochenen beziehen.
  alternative: Eine textkritisch oder semantisch abweichende Deutung wie „eure Scherben“ beziehungsweise eine direkte Verbform „ich zerstreue euch“ wählen.
  rationale: Die überlieferte Form spricht am ehesten für ein Nomen zu „Zerstreuung“, bleibt jedoch schwierig; deshalb wird die Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, eindringlichen Imperativen. Die poetischen Hirten- und Gefäßbilder sowie die harte Gerichtssprache werden bewahrt; die schwierigste hebräische Form wird verständlich wiedergegeben und zugleich in einer Fußnote als unsicher gekennzeichnet.
