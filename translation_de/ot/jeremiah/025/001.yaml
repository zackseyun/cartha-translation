id: JER.25.1
reference: Jeremiah 25:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה עַֽל יִרְמְיָ֨הוּ֙ עַל כָּל עַ֣ם יְהוּדָ֔ה בַּ/שָּׁנָה֙ הָֽ/רְבִעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֗יא הַ/שָּׁנָה֙ הָ/רִ֣אשֹׁנִ֔ית לִ/נְבֽוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/001.yaml
  text: The word that came to Yirmeyahu concerning all the people of Judah in the fourth year of Jehoiakim son of Josiah[a], king of Judah—it was the first year of Nebuchadnezzar king of Babylon—
translation:
  language: de
  text: Das Wort, das an Jeremia über das ganze Volk Juda[a] erging, im vierten Regierungsjahr Jojakims, des Sohnes Josias, des Königs von Juda – das war das erste Regierungsjahr Nebukadnezars, des Königs von Babylon –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen das ganze Volk Juda“. Die hebräische Präposition kann in prophetischen Zusammenhängen sowohl den Gegenstand als auch die feindliche Zielrichtung einer Botschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: In prophetischen Überschriften bezeichnet דָּבָר häufig eine göttliche Mitteilung. „Das Wort“ bewahrt die geläufige prophetische Ausdrucksweise, ohne sie erklärend zu erweitern.
- source_word: אֲשֶׁר הָיָה עַל
  choice: das an … erging
  rationale: Die prophetische Formel היה על beschreibt, dass ein Wort einen Propheten erreicht. „An … erging“ ist im Deutschen natürlich und zugleich würdevoll.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Die im modernen deutschen Bibel- und Sprachgebrauch fest etablierte Namensform gewährleistet Verständlichkeit und Wiedererkennbarkeit.
- source_word: עַל כָּל עַם יְהוּדָה
  choice: über das ganze Volk Juda
  rationale: עַל kann hier „über/betreffend“ oder „gegen“ bedeuten. „Über“ lässt die Richtung der Botschaft zunächst offen und erhält die Mehrdeutigkeit.
- source_word: בַּשָּׁנָה הָרְבִעִית לִיהוֹיָקִים
  choice: im vierten Regierungsjahr Jojakims
  rationale: Die deutsche Wendung „Regierungsjahr“ gibt die königliche Datierungsformel klar und idiomatisch wieder.
- source_word: בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: des Sohnes Josias, des Königs von Juda
  rationale: Die Genealogie und der Königstitel werden formal klar wiedergegeben; die Apposition bezieht „König von Juda“ entsprechend der hebräischen Wortfolge auf Jojakim.
- source_word: הִיא הַשָּׁנָה הָרִאשֹׁנִית לִנְבוּכַדְרֶאצַּר
  choice: das war das erste Regierungsjahr Nebukadnezars
  rationale: Das Pronomen nimmt die zuvor genannte Jahresangabe wieder auf. „Regierungsjahr“ verdeutlicht die im Hebräischen vorausgesetzte regnal-chronologische Bedeutung.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babylon
  rationale: Der königliche Titel wird in natürlicher deutscher Genitivfügung wiedergegeben.
theological_decisions:
- issue: Bedeutung von עַל vor „das ganze Volk Juda“
  choice: über das ganze Volk Juda
  alternative: gegen das ganze Volk Juda
  rationale: Obwohl das Kapitel Gericht ankündigt, bestimmt die Überschrift selbst die Botschaft nicht zwingend bereits als gegen Juda gerichtet. Die Hauptfassung bewahrt den weiteren Bezugssinn; die mögliche feindliche Stoßrichtung wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionellen deutschen Namensformen werden aus Gründen der allgemeinen Verständlichkeit verwendet. Der abschließende Gedankenstrich bewahrt den syntaktisch offenen Übergang zum folgenden Vers.
