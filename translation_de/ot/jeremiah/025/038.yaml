  variant: modern standard German
source:
  edition: WLC
  text: עָזַ֥ב כַּ/כְּפִ֖יר סֻכּ֑/וֹ כִּֽי הָיְתָ֤ה אַרְצָ/ם֙ לְ/שַׁמָּ֔ה מִ/פְּנֵי֙ חֲר֣וֹן הַ/יּוֹנָ֔ה וּ/מִ/פְּנֵ֖י חֲר֥וֹן אַפּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/038.yaml
  text: Like a young lion[a], he has left his den, for their land has become a desolation because of the burning anger of the oppressor[b], and because of his burning anger.
translation:
  language: de
  text: Wie ein junger Löwe hat er seinen Unterschlupf verlassen; denn ihr Land ist zur Einöde geworden wegen des glühenden Zorns des Unterdrückers[a] und wegen seines glühenden Zorns[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen des glühenden Zorns der Taube“. Die hebräische Konsonantenform kann so gelesen werden; der Zusammenhang spricht jedoch eher für eine Bedeutung wie „Unterdrücker“.'
    reason: alternative_reading
  - marker: b
    text: „Seines“ bezieht sich im Zusammenhang wahrscheinlich auf den HERRN. Möglich ist auch ein Bezug auf den zuvor genannten Unterdrücker.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַב
  choice: hat … verlassen
  rationale: Das Qal Perfekt bezeichnet hier eine vollzogene Handlung. Das deutsche Perfekt gibt sie natürlich wieder, ohne die stärkere Bedeutung „aufgeben“ oder „preisgeben“ einzutragen.
- source_word: כַּכְּפִיר
  choice: wie ein junger Löwe
  rationale: כְּפִיר bezeichnet gewöhnlich einen jungen, bereits kräftigen Löwen. „Junger Löwe“ ist präzise und im Deutschen unmittelbar verständlich.
- source_word: סֻכּוֹ
  choice: sein Versteck
  rationale: סֻכָּה bedeutet grundsätzlich Schutzdach oder Hütte, bezeichnet im Löwenbild jedoch dessen geschützten Aufenthaltsort. „Versteck“ bewahrt diesen Bildwert natürlicher als das biologisch engere „Bau“.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für das vorausgehende Bild ein. „Denn“ bildet diesen erklärenden Zusammenhang klar ab.
- source_word: הָיְתָה אַרְצָם לְשַׁמָּה
  choice: ihr Land ist zur Einöde geworden
  rationale: Die Konstruktion mit לְ und dem Substantiv שַׁמָּה beschreibt den eingetretenen Zustand der Verwüstung. „Zur Einöde geworden“ erhält die substantivische Form und klingt zugleich idiomatisch.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: In beiden Vorkommen hat die Präposition kausale Bedeutung. „Wegen“ gibt sie knapp und natürlich wieder.
- source_word: חֲרוֹן
  choice: glühender Zorn
  rationale: חֲרוֹן verbindet Zorn mit der Vorstellung brennender Hitze. „Glühender Zorn“ bewahrt dieses Bild und lässt sich in der Parallelkonstruktion wiederholen.
- source_word: הַיּוֹנָה
  choice: des Unterdrückers
  rationale: Im Zusammenhang der Verwüstung ist die traditionelle kontextuelle Deutung als Bezeichnung für den Bedrücker beziehungsweise Unterdrücker am plausibelsten. Da die Konsonantenform auch als „die Taube“ verstanden werden kann, wird diese echte Unsicherheit in einer Fußnote offengelegt.
- source_word: וּמִפְּנֵי חֲרוֹן אַפּוֹ
  choice: und wegen seines glühenden Zorns
  rationale: אַף bezeichnet idiomatisch den Zorn; das Suffix bleibt mit „seines“ formal mehrdeutig. Die Wiederholung von „glühender Zorn“ erhält den Parallelismus des Hebräischen.
theological_decisions:
- issue: Bezug des Löwenbildes und des abschließenden Pronomens
  choice: Das maskuline Pronomen wird unbestimmt als „er/seines“ wiedergegeben; im Zusammenhang liegt der HERR als Bezug nahe.
  alternative: Das Löwenbild und das abschließende Pronomen können auf einen menschlichen Verwüster beziehungsweise den unmittelbar genannten Unterdrücker bezogen werden.
  rationale: Jeremia 25,30–38 stellt das Gericht des HERRN in den Mittelpunkt, sodass der Bezug auf ihn wahrscheinlich ist. Der hebräische Vers nennt das Subjekt jedoch nicht erneut, und der „Unterdrücker“ steht unmittelbar vor dem letzten Pronomen. Der Haupttext bewahrt diese Spannung, die Fußnote benennt die möglichen Bezüge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Löwenbild und die parallele Wiederholung von „glühender Zorn“ bleiben erhalten. Die Satzstruktur folgt dem erklärenden Zusammenhang des Hebräischen, ohne die ungenannten Bezüge im Haupttext ausdrücklich festzulegen.
