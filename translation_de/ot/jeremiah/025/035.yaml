revisions:
- from: Den Hirten ist jede Zuflucht genommen[a], und den Mächtigen der Herde jeder Ausweg.[b]
  to: Den Hirten[a] ist jede Fluchtmöglichkeit verlorengegangen und den Mächtigen[b] der Herde jedes Entrinnen.
  rationale: Die Revision ersetzt die etwas breiten Begriffe »Zuflucht« und »Ausweg« durch kontextgenauere Entsprechungen für Flucht und Entrinnen. Sie erhält den parallelen Aufbau, die hebräische Metaphorik und die zurückhaltende, nicht ausdeutende Fußnotierung.
