  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָבַ֥ד מָנ֖וֹס מִן הָֽ/רֹעִ֑ים וּ/פְלֵיטָ֖ה מֵ/אַדִּירֵ֥י הַ/צֹּֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/035.yaml
  text: Escape has perished from the shepherds[b][a], and deliverance from the lords of the flock.
translation:
  language: de
  text: Den Hirten[a] ist jede Fluchtmöglichkeit verlorengegangen und den Mächtigen[b] der Herde jedes Entrinnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »Hirten« und die »Herde« sind prophetische Bilder für führende Personen und das ihnen anvertraute Volk.
    reason: cultural_note
  - marker: b
    text: 'Oder: »den Vornehmen der Herde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: ist ... genommen
  rationale: Das Qal Perfekt bezeichnet hier das völlige Verschwinden beziehungsweise den Verlust. Die deutsche Wendung „ist ... genommen“ gibt zusammen mit מן natürlich wieder, dass keine Möglichkeit zur Flucht mehr besteht.
- source_word: מָנוֹס
  choice: jede Zuflucht
  rationale: Das Substantiv kann einen Zufluchtsort oder die Möglichkeit zur Flucht bezeichnen. „Zuflucht“ bewahrt diese Bedeutungsbreite; „jede“ macht idiomatisch deutlich, dass keinerlei Zuflucht mehr vorhanden ist.
- source_word: מִן הָרֹעִים
  choice: den Hirten
  rationale: מן bezeichnet hier Entzug oder Trennung. Im Deutschen gibt der Dativ in „ist den Hirten ... genommen“ diesen Sinn natürlicher wieder als ein wörtliches „von den Hirten“. Das Hirtenbild bleibt erhalten.
- source_word: וּפְלֵיטָה
  choice: jeder Ausweg
  rationale: Das Wort bezeichnet hier Entrinnen beziehungsweise die Möglichkeit, lebend davonzukommen. „Ausweg“ bildet ein natürliches deutsches Parallelglied zu „Zuflucht“, ohne beide hebräischen Begriffe gleichzusetzen.
- source_word: מֵאַדִּירֵי הַצֹּאן
  choice: den Mächtigen der Herde
  rationale: אַדִּירֵי bezeichnet die Mächtigen, Vornehmen oder Hervorragenden. „Mächtige der Herde“ ist quellennah, bewahrt das Herdenbild und vermeidet das im Deutschen missverständliche „Herren der Herde“.
theological_decisions:
- issue: Hirten und Mächtige der Herde als prophetische Bilder für führende Personen
  choice: Die pastorale Bildsprache bleibt im Haupttext erhalten.
  alternative: Die Bilder im Haupttext ausdrücklich als politische oder gesellschaftliche Führer deuten.
  rationale: Der hebräische Text spricht bildhaft von Hirten und den Mächtigen der Herde. Eine explizite Auflösung als „Führer“ würde die Metapher interpretierend einebnen; eine Fußnote kann ihre Funktion erläutern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die pastorale Metaphorik des Hebräischen bleiben gewahrt; die idiomatische Konstruktion „jemandem ist etwas genommen“ gibt den durch מן bezeichneten Entzug natürlich wieder.
