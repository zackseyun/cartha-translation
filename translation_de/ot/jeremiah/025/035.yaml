  - severity: low
    issue: Die Ankerpositionen können die jeweiligen Anmerkungen klarer zuordnen.
    rationale: Der Metaphernhinweis sollte bei »Hirten« stehen; die lexikalische Alternative zu אַדִּירֵי bei »Mächtigen«.
