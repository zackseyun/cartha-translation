source:
  edition: WLC
  text: וְ/שָׁלַח֩ יְהוָ֨ה אֲלֵי/כֶ֜ם אֶֽת כָּל עֲבָדָ֧י/ו הַ/נְּבִאִ֛ים הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/לֹֽא הִטִּיתֶ֥ם אֶֽת אָזְנְ/כֶ֖ם לִ/שְׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/004.yaml
  text: And Yahweh sent to you all his servants the prophets[a], rising early and sending them, but you did not listen, nor did you incline your ear to hear.
translation:
  language: de
  text: Und Jahwe sandte immer wieder alle seine Diener, die Propheten, zu euch.[a] Doch ihr habt nicht zugehört und euer Ohr nicht geneigt, um zu hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „früh aufstehen und senden“; eine hebräische Wendung für wiederholtes, eindringliches Senden.'
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁלַח
  choice: Und … sandte
  rationale: Das Qal Perfekt 3. Person Singular mit וְ wird im Zusammenhang als vergangene, mit dem Folgenden verbundene Handlung wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: אֲלֵיכֶם
  choice: zu euch
  rationale: Die Präposition אֶל mit Suffix der 2. Person Plural bezeichnet hier die Richtung der Sendung.
- source_word: כָּל עֲבָדָיו הַנְּבִאִים
  choice: alle seine Diener, die Propheten
  rationale: עֲבָדָיו bezeichnet hier die von Gott beauftragten Diener; „die Propheten“ steht dazu erläuternd in Apposition.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: sandte immer wieder
  rationale: Die Verbindung der Infinitive drückt idiomatisch Gottes wiederholtes, nachdrückliches Senden aus. Die wörtliche Bildsprache wird in der Fußnote bewahrt.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: Doch ihr habt nicht gehört
  rationale: שׁמע meint im prophetischen Vorwurf mehr als akustisches Wahrnehmen und schließt aufmerksames Hören ein; „gehört“ erhält zugleich die Wiederaufnahme in לִשְׁמֹעַ.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם לִשְׁמֹעַ
  choice: und euer Ohr nicht zum Hören geneigt
  rationale: Die hebräische Metapher des geneigten Ohres wird in verständlichem, gehobenem Deutsch erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; die Transliteration bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von שׁמע im Vorwurf an das Volk
  choice: gehört
  alternative: gehorcht
  rationale: „Gehört“ bewahrt die sprachliche Verbindung zum nachfolgenden Bild des Ohres und lässt die im Kontext mitschwingende Bedeutung des Beachtens und Gehorchens bestehen, ohne sie einseitig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die idiomatische Wendung wird im Haupttext verständlich wiedergegeben; ihre konkrete hebräische Bildsprache bleibt in der Fußnote erhalten.
