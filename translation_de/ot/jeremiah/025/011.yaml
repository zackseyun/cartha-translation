source:
  edition: WLC
  text: וְ/הָֽיְתָה֙ כָּל הָ/אָ֣רֶץ הַ/זֹּ֔את לְ/חָרְבָּ֖ה לְ/שַׁמָּ֑ה וְ/עָ֨בְד֜וּ הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה אֶת מֶ֥לֶךְ בָּבֶ֖ל שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/011.yaml
  text: And all this land will become a ruin and a horror[a], and these nations will serve the king of Babylon for seventy years.
translation:
  language: de
  text: Und dieses ganze Land wird zu einer Ruine und zum Entsetzen[a] werden, und diese Völker werden dem König von Babel siebzig Jahre lang dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Gegenstand des Entsetzens“; gemeint sein kann auch die bestürzte Reaktion, die die Verwüstung des Landes hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Und ... wird ... werden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang Zukunftsbedeutung; „wird ... werden“ drückt den eintretenden Zustand natürlich aus.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: dieses ganze Land
  rationale: אֶרֶץ bezeichnet hier im Kontext des Gerichts über Juda und die umliegenden Gebiete das betreffende Land, nicht die gesamte Erde; Demonstrativpronomen und כָּל bleiben erhalten.
- source_word: לְחָרְבָּה
  choice: zur Trümmerstätte
  rationale: Das Substantiv bezeichnet einen verwüsteten, in Trümmern liegenden Ort. „Trümmerstätte“ ist anschaulich und passt zur resultativen Konstruktion mit לְ.
- source_word: לְשַׁמָּה
  choice: zum Entsetzen
  rationale: שַׁמָּה kann sowohl den entsetzlichen Zustand als auch die bestürzte Reaktion darauf bezeichnen. „Entsetzen“ bewahrt diese Spannung knapp und idiomatisch.
- source_word: וְעָבְדוּ
  choice: werden ... dienen
  rationale: עבד mit direktem Objekt bezeichnet hier den Dienst unter einem Herrscher und schließt politische Unterwerfung ein, ohne sie paraphrasierend festzulegen.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: diese Völker
  rationale: גּוֹיִם bezeichnet hier die betroffenen politischen Völker. „Völker“ ist im Deutschen natürlicher und weniger staatsrechtlich eng als „Nationen“.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: dem König von Babel
  rationale: Das hebräische direkte Objekt wird wegen der deutschen Rektion von „dienen“ mit dem Dativ wiedergegeben. „Babel“ entspricht der etablierten biblischen Ortsbezeichnung.
- source_word: שִׁבְעִים שָׁנָה
  choice: siebzig Jahre lang
  rationale: „Jahre lang“ gibt die Zeitdauer im modernen Deutsch eindeutig und natürlich wieder.
theological_decisions:
- issue: Reichweite von הָאָרֶץ im Gerichtswort
  choice: „Land“ bezeichnet das in diesem Zusammenhang vom Gericht betroffene regionale Gebiet.
  alternative: „Erde“ oder eine umfassendere, hyperbolische Bedeutung.
  rationale: Der unmittelbare Kontext handelt von Juda und den umliegenden Völkern unter babylonischer Herrschaft. „Land“ vermeidet eine unbegründete globale Festlegung.
- issue: Bedeutung der siebzig Jahre
  choice: Die Zeitangabe wird ohne zusätzliche chronologische Deutung wörtlich wiedergegeben.
  alternative: Eine ausdrücklich symbolische oder auf ein bestimmtes chronologisches Schema festgelegte Auslegung.
  rationale: Der Vers selbst nennt schlicht siebzig Jahre; eine nähere harmonisierende oder symbolische Bestimmung wäre interpretierende Hinzufügung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Zielkonstruktion „zur Trümmerstätte und zum Entsetzen“ bildet die beiden hebräischen לְ-Nominalphrasen ab; die Wortstellung bleibt klar und vorlesbar.
