source:
  edition: WLC
  text: וְ/אַל תֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וְ/לֹֽא תַכְעִ֤יסוּ אוֹתִ/י֙ בְּ/מַעֲשֵׂ֣ה יְדֵי/כֶ֔ם וְ/לֹ֥א אָרַ֖ע לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/006.yaml
  text: And do not go after other gods to serve them and to bow down to them[a], and do not provoke me to anger by the work of your hands[b], and I will do you no harm.
translation:
  language: de
  text: Und geht nicht anderen Göttern nach[a], um ihnen zu dienen und euch vor ihnen niederzuwerfen. Und reizt mich nicht durch das Werk eurer Hände zum Zorn, und ich werde euch keinen Schaden zufügen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Folgt nicht anderen Göttern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: und ich werde kein Unheil über euch bringen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּלְכוּ אַחֲרֵי
  choice: lauft … hinterher
  rationale: Die Wendung bedeutet wörtlich, hinter jemandem herzugehen, und bezeichnet hier Gefolgschaft und religiöse Hinwendung. „Hinterherlaufen“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Die Wendung bezeichnet Gottheiten neben bzw. anstelle JHWHs. „Andere Götter“ gibt den Ausdruck unmittelbar wieder, ohne die nicht ausdrücklich vorhandene Bedeutung „fremdländisch“ hinzuzufügen.
- source_word: לְעָבְדָם
  choice: um ihnen zu dienen
  rationale: עבד bezeichnet im Blick auf Gottheiten kultischen Dienst. „Dienen“ bewahrt den Grundsinn und hält den Ausdruck von der folgenden körperlichen Huldigung unterschieden.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: und euch vor ihnen niederzuwerfen
  rationale: Das Verb bezeichnet das ehrfürchtige Niederwerfen bzw. Sich-Verbeugen. Die konkrete körperliche Handlung bleibt so sichtbar und wird nicht allgemein mit „anbeten“ wiedergegeben.
- source_word: תַכְעִיסוּ אֹתִי
  choice: reizt mich … zum Zorn
  rationale: Der Hifil von כעס drückt aus, jemanden zu erzürnen oder zum Zorn zu reizen. Die Formulierung gibt die kausative Bedeutung in würdigem, natürlichem Deutsch wieder.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: durch das Werk eurer Hände
  rationale: Die bildhafte hebräische Wendung bleibt erhalten. Im Zusammenhang verweist sie besonders auf von Menschen angefertigte Kultbilder, ohne dass dies im Text ausdrücklich ergänzt werden muss.
- source_word: וְלֹא אָרַע לָכֶם
  choice: und ich werde euch keinen Schaden zufügen
  rationale: Der Hifil von רעע kann bedeuten, jemandem zu schaden oder Unheil über jemanden zu bringen. „Keinen Schaden zufügen“ vermeidet die moralisch missverständliche wörtliche Wiedergabe „nichts Böses tun“.
theological_decisions:
- issue: Verhältnis des abschließenden Satzteils zu den vorangehenden Verboten
  choice: und ich werde euch keinen Schaden zufügen
  alternative: sodass ich euch keinen Schaden zufüge
  rationale: Der hebräische Text verbindet den Satzteil schlicht mit וְ und formuliert eine göttliche Zusicherung bzw. Folge. Die Übersetzung bewahrt diese parataktische Form und legt ihn nicht eindeutig als Zweck- oder Folgesatz fest.
- issue: Bedeutungsumfang von רעע im Handeln Gottes
  choice: Schaden zufügen
  alternative: Unheil über euch bringen
  rationale: Die Wiedergabe bezeichnet nachteilhaftes oder strafendes Handeln, ohne Gott moralisches Bösestun zuzuschreiben. Die Alternative betont stärker die mögliche Bedeutung einer konkreten Katastrophe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die anschaulichen hebräischen Wendungen „hinterherlaufen“, „sich niederwerfen“ und „Werk eurer Hände“ bleiben erhalten; unnötige kultische oder konfessionelle Deutungen werden vermieden.
