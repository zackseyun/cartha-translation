source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּנָּבֵ֣א אֲלֵי/הֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם יְהוָ֞ה מִ/מָּר֤וֹם יִשְׁאָג֙ וּ/מִ/מְּע֤וֹן קָדְשׁ/וֹ֙ יִתֵּ֣ן קוֹל֔/וֹ שָׁאֹ֤ג יִשְׁאַג֙ עַל נָוֵ֔/הוּ הֵידָד֙ כְּ/דֹרְכִ֣ים יַֽעֲנֶ֔ה אֶ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/030.yaml
  text: 'And you, you shall prophesy all these words against them, and you shall say to them: The LORD will roar from on high, and from his holy dwelling he will give his voice; he will surely roar against his pasture. He will answer with a shout like those who tread grapes, against all the inhabitants of the earth.'
translation:
  language: de
  text: 'Und du sollst gegen sie alle diese Worte prophezeien und zu ihnen sagen:


    »Der HERR wird aus der Höhe brüllen,


    und aus seiner heiligen Wohnung wird er seine Stimme erschallen lassen.


    Laut wird er gegen seine Weide[a] brüllen.


    Wie Keltertreter wird er einen lauten Ruf anstimmen[b]


    gegen alle Bewohner der Erde.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Wohnstätte« oder »seinen Aufenthaltsort«.'
    reason: Das hebräische נָוֶה bezeichnet sowohl eine Weide als auch einen Wohn- bzw. Aufenthaltsort.
  - marker: b
    text: 'Auch möglich: »Er antwortet mit einem lauten Ruf wie Keltertreter.« Das hebräische Verb kann „antworten“ oder, in diesem Zusammenhang, einen Ruf anstimmen bzw. erheben bedeuten.'
    reason: יַעֲנֶה ist semantisch nicht eindeutig; die Fußnote bewahrt die mögliche Lesart „antworten“, während der Haupttext die idiomatische Sinnwiedergabe bietet.
lexical_decisions:
- source_word: תִּנָּבֵא אֲלֵיהֶם
  choice: ihnen … prophezeien
  rationale: אֶל bezeichnet hier die Adressaten der prophetischen Rede. Das Deutsche lässt durch den folgenden Gerichtsspruch erkennen, dass die Worte gegen sie gerichtet sind, ohne die Präposition unnötig zu verschärfen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen bzw. Großschreibung ist verständlich und würdig; hier wird sie als »HERR« dargestellt.
- source_word: יִתֵּן קוֹלוֹ
  choice: lässt er seine Stimme erschallen
  rationale: Gibt die hebräische Wendung idiomatisch und zugleich bildkräftig wieder.
- source_word: שָׁאֹג יִשְׁאַג
  choice: Laut wird er … brüllen
  rationale: Der Infinitivus absolutus verstärkt das finite Verb. »Laut« bildet diese nachdrückliche Intensivierung in natürlichem Deutsch ab.
- source_word: נָוֵהוּ
  choice: seine Weide
  rationale: נָוֶה kann Weide, Wohnplatz oder Aufenthaltsort bezeichnen. Im poetischen Bild ist »Weide« eine naheliegende konkrete Wiedergabe, während die Mehrdeutigkeit in einer Fußnote erhalten bleibt.
- source_word: הֵידָד כְּדֹרְכִים יַעֲנֶה
  choice: Wie die Keltertreter stimmt er einen lauten Ruf an
  rationale: הֵידָד bezeichnet einen lauten Ruf, hier verglichen mit dem rhythmischen Rufen der Traubentreter. יַעֲנֶה kann »antworten« oder »anstimmen/erheben« bedeuten; im Deutschen ist »einen Ruf anstimmen« im unmittelbaren Zusammenhang verständlicher.
theological_decisions:
- issue: Bezug von »seine Weide«
  choice: Die possessive Form wird unverändert als »seine Weide« wiedergegeben.
  alternative: »sein Land« oder »seine Wohnstätte«
  rationale: Der Text identifiziert den Referenten nicht ausdrücklich. Eine Deutung als Israel, das Land oder die ganze Schöpfung wird daher nicht in den Haupttext eingetragen.
- issue: Richtung des lauten Rufs
  choice: »gegen alle Bewohner der Erde«
  alternative: »über alle Bewohner der Erde hin«
  rationale: אֶל kann eine Ausrichtung auf ein Ziel ausdrücken; im Gerichtskontext ist »gegen« gut begründet, ohne die Identität oder das endgültige Geschick der Betroffenen weiter festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit poetischen Zeilenumbrüchen. Das wiederholte »Und du« des Hebräischen wird knapp bewahrt; die kräftige Bildsprache des Brüllens und Keltertretens bleibt unverharmlost.
