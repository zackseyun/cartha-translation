    Wie die Keltertreter stimmt er einen lauten Ruf an[b]

    gegen alle Bewohner der Erde.«'
  to: 'Und du sollst gegen sie alle diese Worte prophezeien und zu ihnen sagen:


    »Der HERR wird aus der Höhe brüllen,


    und aus seiner heiligen Wohnung wird er seine Stimme erschallen lassen.


    Laut wird er gegen seine Weide[a] brüllen.


    Wie Keltertreter wird er einen lauten Ruf anstimmen[b]


    gegen alle Bewohner der Erde.«'
  rationale: Die Revision stellt die im Hebräischen ausdrückliche Ausrichtung der Prophezeiung „gegen sie“ wieder her. Sie glättet außerdem den Keltertretervergleich und überarbeitet die zugehörige Fußnote, ohne die syntaktische und lexikalische Mehrdeutigkeit von יַעֲנֶה aufzulösen. Die poetische Form, der Gottesname und die Bildsprache bleiben erhalten.
