source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנֵּ֥ה רָעָ֛ה יֹצֵ֖את מִ/גּ֣וֹי אֶל גּ֑וֹי וְ/סַ֣עַר גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/032.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], disaster is going out from nation to nation[c][b], and a great storm is being stirred up from the farthest parts of the earth.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Siehe, Unheil[a] zieht von Nation zu Nation[b], und ein gewaltiger Sturm wird aus den entlegensten Gegenden der Erde[c] aufgewirbelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unglück“ oder „Katastrophe“. Das hebräische Wort kann auch „Böses“ bedeuten; hier bezeichnet es zerstörerisches Unheil im Gericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von einem Volk zum anderen“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „aus den äußersten Teilen der Erde“; auch: „von den Enden der Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in einer natürlichen, würdevollen deutschen Wendung.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; die im Deutschen geläufige Titelform „Herr der Heerscharen“ macht צְבָאוֹת als umfassende Bezeichnung himmlischer und irdischer Heere verständlich, ohne es auf menschliche Armeen einzuengen.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Erhält den hinweisenden Nachdruck und die prophetische Dringlichkeit; die leicht gehobene Form entspricht dem feierlichen Register.
- source_word: רָעָה
  choice: Unheil
  rationale: Bezeichnet hier zerstörerisches Gericht beziehungsweise eine Katastrophe, nicht sittlich Böses. „Unheil“ ist im Deutschen idiomatisch und bewahrt zugleich die Schwere des Ausdrucks.
- source_word: יֹצֵאת
  choice: zieht
  rationale: Das Partizip schildert das Geschehen als bereits einsetzend oder unmittelbar bevorstehend. „zieht“ vermittelt anschaulich die fortschreitende Ausbreitung.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: von Nation zu Nation
  rationale: Gibt die Bewegung über eine Folge von Völkern beziehungsweise Nationen knapp wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes Gegeneinander einzutragen.
- source_word: סַעַר גָּדוֹל
  choice: ein gewaltiger Sturm
  rationale: „Gewaltig“ gibt die Stärke und bedrohliche Dimension von גָּדוֹל im Zusammenhang des Gerichts natürlich wieder.
- source_word: יֵעוֹר
  choice: wird ... aufgewirbelt
  rationale: Die passive Form des Verbs bezeichnet das Erweckt- oder Aufgerührtwerden. „aufgewirbelt“ bewahrt beim Sturm die Vorstellung des Aufrührens und klingt im Deutschen anschaulich.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: aus den entlegensten Gegenden der Erde
  rationale: Die Wendung bezeichnet die fernen äußersten Bereiche der Erde. Die Übersetzung ist verständlich und vermeidet eine unnötig räumlich-geometrische Festlegung.
theological_decisions:
- issue: Bedeutung von רָעָה in einer Gerichtsankündigung
  choice: „Unheil“ statt „Böses“
  alternative: „Böses“ oder „Katastrophe“
  rationale: Im Kontext bezeichnet רָעָה das hereinbrechende zerstörerische Gericht. „Böses“ könnte im Deutschen missverständlich moralische Bosheit bezeichnen; „Unheil“ lässt die gerichtliche Katastrophe erkennen, ohne eine zusätzliche dogmatische Aussage einzutragen.
- issue: Zeitwert von יֵעוֹר
  choice: Mit „wird ... aufgewirbelt“ als bevorstehendes Geschehen wiedergegeben
  alternative: 'Präsentisch: „wird ... aufgewirbelt“ im Sinn eines gerade ablaufenden Vorgangs oder „erhebt sich“'
  rationale: Das hebräische Imperfekt kann hier im prophetischen Zusammenhang zukünftig oder anschaulich-imminent verstanden werden. Die deutsche Zukunftsform passt zur Gerichtsankündigung, ohne den Bildcharakter aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Sprachform. „Siehe“ und „Heerscharen“ sind bewusst leicht gehoben; der übrige Satz bleibt unmittelbar verständlich. Die Bildsprache des sich über die Nationen ausbreitenden Unheils und des aus der Ferne aufgewirbelten Sturms bleibt erhalten.
