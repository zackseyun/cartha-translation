base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/013.yaml
  text: And I will bring upon that land all my words that I have spoken against it—all that is written in this book[b][a], which Jeremiah prophesied against all the nations.
translation:
  language: de
  text: 'Und ich werde über jenes Land alle meine Worte kommen lassen, die ich gegen es gesprochen habe: alles, was in diesem Buch[a] geschrieben steht und was Jeremia gegen alle Völker[b] geweissagt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dieser Schriftrolle“. Das hebräische Wort kann eine Schriftrolle oder ein Buch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über alle Völker“. Die hebräische Präposition kann allgemeiner wiedergegeben werden; im Gerichtskontext liegt hier „gegen“ näher.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Und ich werde … kommen lassen
  rationale: Der Hifil von בוא bedeutet hier, dass Gott die angekündigten Worte beziehungsweise Gerichte eintreffen lässt. Die deutsche Wendung „kommen lassen“ verbindet sich natürlich mit „über jenes Land“ und bewahrt den kausativen Sinn.
- source_word: עַל הָאָרֶץ הַהִיא
  choice: über jenes Land
  rationale: אֶרֶץ bezeichnet hier das betroffene Gebiet, daher „Land“. עַל wird im Zusammenhang mit dem Eintreffen angekündigten Gerichts idiomatisch mit „über“ wiedergegeben.
- source_word: אֶת כָּל דְּבָרַי
  choice: alle meine Worte
  rationale: „Worte“ bewahrt den engen Zusammenhang zwischen Gottes vorausgegangener Rede und ihrer Erfüllung, ohne den Inhalt bereits auf „Gerichte“ einzuengen.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלֶיהָ
  choice: die ich gegen es gesprochen habe
  rationale: Das Perfekt bezeichnet die bereits ergangene Rede, deren Erfüllung bevorsteht. „Gegen“ gibt den feindlich-gerichtlichen Sinn von עַל in diesem Kontext wieder.
- source_word: אֵת כָּל הַכָּתוּב
  choice: alles, was … geschrieben steht
  rationale: Diese natürliche deutsche Formulierung drückt die Gesamtheit des schriftlich Festgehaltenen aus.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: in diesem Buch
  rationale: סֵפֶר kann ein Buch beziehungsweise eine Schriftrolle bezeichnen. „Buch“ ist im modernen Deutsch verständlich; die historisch konkretere Alternative wird in einer Fußnote genannt.
- source_word: אֲשֶׁר נִבָּא יִרְמְיָהוּ
  choice: was Jeremia … geweissagt hat
  rationale: נבא im Nifal bedeutet gewöhnlich „weissagen“. Die aktive deutsche Konstruktion mit Jeremia als Subjekt ist klar und entspricht dem Hebräischen.
- source_word: עַל כָּל הַגּוֹיִם
  choice: gegen alle Völker
  rationale: עַל kann bei נבא allgemein „über/betreffs“ bedeuten; im vorliegenden Gerichtskontext liegt jedoch der adversative Sinn „gegen“ näher. גּוֹיִם wird idiomatisch mit „Völker“ wiedergegeben.
theological_decisions:
- issue: Reichweite und Stoßrichtung der prophetischen Aussagen im Schlusssatz
  choice: gegen alle Völker
  alternative: über alle Völker
  rationale: Die Präposition עַל kann sowohl einen Gegenstand als auch eine feindliche Ausrichtung bezeichnen. Der Zusammenhang angekündigten Gerichts spricht für „gegen“, während die breitere Lesart in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „alle meine Worte kommen lassen“ hält die Verbindung zwischen göttlicher Ankündigung und ihrem Eintreffen fest. Die Wiederholung mit „alles, was … und was …“ wurde zugunsten eines klaren deutschen Satzbaus verwendet, ohne den Umfang der Aussage einzuschränken.
