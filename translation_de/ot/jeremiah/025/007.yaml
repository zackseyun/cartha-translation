id: JER.25.7
reference: Jeremiah 25:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹֽא שְׁמַעְתֶּ֥ם אֵלַ֖/י נְאֻם יְהוָ֑ה לְמַ֧עַן הכעסו/ני בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶ֖ם לְ/רַ֥ע לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/007.yaml
  text: Yet you did not listen to me[a], declares Yahweh, to provoke me to anger by the work of your hands, to your own harm.
translation:
  language: de
  text: Doch ihr habt nicht auf mich gehört, spricht Jahwe, um mich durch das Werk eurer Hände[a] zum Zorn zu reizen – zu eurem eigenen Schaden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch die Werke eurer Hände“. Die Wendung bezeichnet bei Jeremia häufig Götzen oder götzendienerisches Tun.'
    reason: lexikalische Alternative und idiomatischer Hintergrund
lexical_decisions:
- source_word: וְלֹא
  choice: Doch ... nicht
  rationale: Die adversative Fortführung hebt den Gegensatz zu den wiederholten prophetischen Mahnungen im Kontext hervor.
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: ihr habt nicht auf mich gehört
  rationale: „Auf jemanden hören“ bewahrt sowohl den Vorgang des Hörens als auch die darin anklingende Bereitschaft zum Gehorsam, ohne ausschließlich „gehorchen“ zu übersetzen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Dies ist eine natürliche und würdevolle Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: לְמַעַן הַכְעִסוּנִי
  choice: um mich ... zum Zorn zu reizen
  rationale: Die Formulierung erhält die mögliche Zweckbedeutung von לְמַעַן und die kausative Bedeutung des Verbs, ohne die Spannung vorschnell als bloße Folge aufzulösen.
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: durch das Werk eurer Hände
  rationale: Die wörtliche, kollektiv verstehbare Wendung bewahrt das hebräische Bild und lässt offen, ob speziell Götzenbilder oder menschliches Tun allgemein gemeint sind.
- source_word: לְרַע לָכֶם
  choice: zu eurem eigenen Schaden
  rationale: Die Wendung gibt die nachteilige Folge für die Angesprochenen idiomatisch und mit dem reflexiven Nachdruck des Zusammenhangs wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung des „Werks eurer Hände“
  choice: die bildhafte Wendung im Haupttext beibehalten
  alternative: die von euren Händen gemachten Götzen
  rationale: Obwohl die Wendung bei Jeremia häufig auf Götzen oder Götzendienst zielt, nennt der Vers Götzen nicht ausdrücklich. Die Übersetzung wahrt daher die weitere Bedeutung.
- issue: Zweck oder Folge bei לְמַעַן
  choice: um ... zu
  alternative: sodass
  rationale: Die Zweckform bleibt formal möglich und bewahrt die theologische und rhetorische Spannung des hebräischen Wortlauts; eine reine Folgebedeutung wird nicht festgeschrieben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Spricht Jahwe“ entspricht dem prophetischen Sprachgebrauch; der Gedankenstrich macht die abschließende Schadensfolge klar, ohne den Satz unnötig zu glätten.
