base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/016.yaml
  text: They will drink[a], and stagger, and act like madmen because of the sword that I am sending among them.
translation:
  language: de
  text: Sie werden trinken, taumeln und sich wie Wahnsinnige gebärden[a] wegen des Schwertes, das ich unter sie sende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: wahnsinnig werden.'
    reason: Das hebräische Verb kann neben wahnsinnigem beziehungsweise rasendem Verhalten auch das Verrücktwerden bezeichnen.
lexical_decisions:
- source_word: וְשָׁתוּ
  choice: Sie werden trinken
  rationale: Das Qal-Perfekt mit וְ führt in der prophetischen Abfolge die vorausgehende Aufforderung fort und ist hier futurisch zu verstehen. Die konkrete Bildsprache des Trinkens bleibt erhalten.
- source_word: וְהִתְגֹּעֲשׁוּ
  choice: taumeln
  rationale: Das Verb bezeichnet heftige Erschütterung oder schwankende Bewegung. Im Zusammenhang mit dem Trinken aus dem Zornesbecher gibt „taumeln“ die anschauliche Wirkung natürlich wieder.
- source_word: וְהִתְהֹלָלוּ
  choice: sich wie Wahnsinnige gebärden
  rationale: Die reflexive Verbalform bezeichnet ein rasendes, vernunftwidriges Verhalten. Die Formulierung wahrt den Verhaltensaspekt, ohne eindeutig einen dauerhaften Geisteszustand zu behaupten.
- source_word: מִפְּנֵי הַחֶרֶב
  choice: wegen des Schwertes
  rationale: 'מִפְּנֵי ist hier kausal: Das gesandte Schwert verursacht ihr Taumeln und ihr rasendes Verhalten. „Schwert“ bewahrt zugleich das konkrete prophetische Bild für Krieg und Gericht.'
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ
  choice: das ich … sende
  rationale: Das Partizip שֹׁלֵחַ mit אָנֹכִי stellt Gottes Handeln als unmittelbar bevorstehend oder bereits im Vollzug dar. Das deutsche Präsens passt zu dieser lebendigen prophetischen Darstellung.
- source_word: בֵּינֹתָם
  choice: unter sie
  rationale: Die Präposition bezeichnet hier das Hineinsenden in die Mitte der Völker. „Unter sie“ gibt diese Richtung knapp und idiomatisch wieder.
theological_decisions:
- issue: Bildsprache des Gerichts
  choice: Trinken, Taumeln und wahnsinniges Verhalten werden als konkrete Wirkungen des von Gott gesandten Schwertes beibehalten.
  alternative: Die Bilder allgemein als Schrecken, politische Verwirrung oder Zusammenbruch wiederzugeben.
  rationale: Der Zusammenhang des Zornesbechers und die ausdrückliche Nennung des Schwertes verlangen, die anschauliche prophetische Gerichtssprache nicht in eine abstrakte Deutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sich gebärden“ ist gehoben, aber allgemein verständlich und erhält die kraftvolle prophetische Bildsprache; die Satzstruktur bleibt klar und knapp.
