id: JER.25.17
reference: Jeremiah 25:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אֶקַּ֥ח אֶת הַ/כּ֖וֹס מִ/יַּ֣ד יְהוָ֑ה וָֽ/אַשְׁקֶה֙ אֶת כָּל הַ/גּוֹיִ֔ם אֲשֶׁר שְׁלָחַ֥/נִי יְהוָ֖ה אֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/017.yaml
  text: So I took the cup from the hand of Yahweh and made all the nations to whom Yahweh had sent me drink[a][b].
translation:
  language: de
  text: Da nahm ich den Becher aus Jahwes Hand[a] und ließ alle Völker, zu denen Jahwe mich gesandt hatte, trinken.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus der Hand Jahwes“; die Wendung drückt aus, dass Jeremia den Becher unmittelbar von ihm empfing.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „gab allen Völkern zu trinken“. Das hebräische Verb ist eine Kausativform: Er bewirkte, dass sie tranken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Da nahm ich
  rationale: Das Qal-Wayyiqtol von לקח führt die Erzählung mit der nächsten Handlung fort. „Da nahm ich“ gibt diese Abfolge in natürlichem, gehobenem Deutsch wieder.
- source_word: הַכּוֹס
  choice: den Becher
  rationale: כּוֹס bezeichnet ein Trinkgefäß und steht mit bestimmtem Artikel. „Becher“ bewahrt das konkrete Bild; die im Zusammenhang erkennbare Bedeutung als Zornesbecher wird nicht zusätzlich in den Vers hineingetragen.
- source_word: מִיַּד יְהוָה
  choice: aus Jahwes Hand
  rationale: Die Formulierung gibt das anschauliche hebräische Bild wörtlich und zugleich idiomatisch auf Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, der im modernen Deutschen üblichen Umschrift des Tetragramms, statt ihn durch einen Titel zu ersetzen.
- source_word: וָאַשְׁקֶה
  choice: und ließ … trinken
  rationale: Der Hifil von שׁקה ist kausativ. „ließ … trinken“ bewahrt diesen Sinn natürlich, ohne die stärkere Vorstellung von körperlichem Zwang zwingend festzulegen.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen, an die sich die folgenden Gerichtsworte richten. „Völker“ ist in diesem prophetischen Zusammenhang natürlich und präzise.
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה אֲלֵיהֶם
  choice: zu denen Jahwe mich gesandt hatte
  rationale: Der Relativsatz bezieht sich eindeutig auf „alle Völker“. Das Plusquamperfekt macht im Deutschen kenntlich, dass die Sendung der hier erzählten Handlung vorausging.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre die traditionelle ersetzende Lesung.
- issue: Stärke der Kausativform וָאַשְׁקֶה
  choice: ließ … trinken
  alternative: zwang … zu trinken / gab … zu trinken
  rationale: Die Hifil-Form besagt, dass Jeremia die Völker zum Trinken bringt, legt aber für sich allein nicht eindeutig fest, ob der Akzent auf Zwang oder auf Darreichung liegt. „ließ … trinken“ erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau hält den Relativsatz unmittelbar bei „alle Völker“, sodass sein Bezug klar bleibt. Das konkrete Bild von Becher und Hand sowie die kausative Aussage des hebräischen Verbs werden bewahrt.
