base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/026.yaml
  text: and all the kings of the north[a], both near and far, each one with his brother, and all the kingdoms of the earth that are on the face of the ground. And the king of Sheshach will drink after them.
translation:
  language: de
  text: und alle Könige des Nordens, die nahen wie die fernen, einer nach dem anderen, und alle Königreiche der Erde, die auf dem Erdboden sind. Und der König von Scheschach[a] wird nach ihnen trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scheschach gilt weithin als verschlüsselte Bezeichnung für Babylon, wahrscheinlich nach dem Atbasch-Verfahren, bei dem die Buchstaben des hebräischen Alphabets spiegelbildlich ausgetauscht werden.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְכֵי הַצָּפוֹן
  choice: Könige des Nordens
  rationale: Die Genitivkonstruktion und ihre geopolitische Offenheit werden unmittelbar wiedergegeben.
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: die nahen wie die fernen
  rationale: Die Paarformel bezeichnet umfassend sowohl nahe als auch entfernte Könige und klingt im Deutschen natürlich.
- source_word: אִישׁ אֶל אָחִיו
  choice: einer neben dem anderen
  rationale: Die Wendung bedeutet wörtlich etwa »jeder zu seinem Bruder«; hier bezeichnet sie am ehesten die wechselseitige Anordnung beziehungsweise Gesamtheit der Könige, ohne tatsächliche Verwandtschaft zu behaupten.
- source_word: כָּל הַמַּמְלְכוֹת הָאָרֶץ
  choice: alle Königreiche der Erde
  rationale: Der anschließende Ausdruck erweitert den Blick über ein einzelnes Land hinaus; »Erde« bewahrt diesen universalen Umfang.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: die sich auf der Oberfläche des Erdbodens befinden
  rationale: Die Übersetzung gibt die räumliche hebräische Formel verständlich wieder und unterscheidet אֲדָמָה als »Erdboden« vom vorherigen אֶרֶץ als »Erde«.
- source_word: שֵׁשַׁךְ
  choice: Scheschach
  rationale: Der im Hebräischen stehende verschlüsselte Eigenname wird transliteriert und nicht stillschweigend durch seine wahrscheinliche Deutung ersetzt.
- source_word: יִשְׁתֶּה אַחֲרֵיהֶם
  choice: wird nach ihnen trinken
  rationale: Die Formulierung setzt das Becherbild des Kontextes voraus und wahrt die zeitliche Abfolge, ohne »aus dem Becher« oder »zuletzt« hinzuzufügen.
theological_decisions:
- issue: Identität Scheschachs
  choice: Scheschach im Haupttext beibehalten und die wahrscheinliche Identifizierung mit Babylon in einer Fußnote erläutern.
  alternative: Im Haupttext unmittelbar »Babylon« schreiben.
  rationale: Der masoretische Text bietet שֵׁשַׁךְ und nicht בָּבֶל. Die rätselhafte Form ist daher textlich zu bewahren; ihre weithin anerkannte Deutung gehört in die Fußnote.
- issue: Bild vom Trinken
  choice: Das Verb ohne ausdrückliche Ergänzung eines Bechers wiedergeben.
  alternative: »wird nach ihnen aus dem Becher trinken«
  rationale: Der Zornesbecher ist aus dem Zusammenhang klar, wird in diesem Vers jedoch nicht ausdrücklich genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur schließt als Teil einer längeren Aufzählung mit »und« an den vorausgehenden Kontext an. »Einer neben dem anderen« wahrt die Bildlichkeit von אִישׁ אֶל אָחִיו, ohne eine leibliche Bruderschaft zu unterstellen.
