    rationale: Fußnotenanker müssen den Ausdruck kennzeichnen, auf den sich die Erklärung bezieht. Der gegenwärtige Anker kann fälschlich den Eindruck erwecken, die Anmerkung betreffe den Norden oder dessen Könige.
  - severity: low
    issue: »einer neben dem anderen« ist für אִישׁ אֶל־אָחִיו kontextuell weniger treffend.
    rationale: Die Formulierung betont Nachbarschaft; im Zusammenhang der nacheinander zum Trinken verpflichteten Völker passt die idiomatische Wiedergabe »einer nach dem anderen« besser, ohne eine tatsächliche Bruderschaft zu behaupten.
  - severity: low
    issue: »auf der Oberfläche des Erdbodens befinden« ist unnötig technisch.
    rationale: Die hebräische Formel bezeichnet umfassend die Bewohner bzw. Reiche der ganzen Erde. »auf dem Erdboden sind« ist natürlicher und hinreichend genau.
  revised_text: und alle Könige des Nordens, die nahen wie die fernen, einer nach dem anderen, und alle Königreiche der Erde, die auf dem Erdboden sind. Und der König von Scheschach[a] wird nach ihnen trinken.
