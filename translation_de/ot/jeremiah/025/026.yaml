  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des Hebräischen wieder: alle Könige des Nordens, nahe und ferne, die Königreiche der Erde und die zeitliche Folge des Trinkens. »Einer neben dem anderen« kann jedoch eine bloß räumliche Anordnung nahelegen. אִישׁ אֶל־אָחִיו fungiert hier idiomatisch eher im Sinn von »einer nach dem anderen« bzw. »einer zum anderen«; »einer nach dem anderen« ist im Kontext der Abfolge beim Trinken die klarere deutsche Wiedergabe.'
  naturalness: »Die sich auf der Oberfläche des Erdbodens befinden« ist korrekt, aber unnötig technisch und schwerfällig. »Die auf dem Erdboden sind« ist modernes, würdiges Deutsch und bewahrt die Unterscheidung von »Erde« und אֲדָמָה. Die einleitende Kleinschreibung von »und« ist als Fortsetzung der vorherigen Aufzählung angemessen.
  terminology: »Könige des Nordens«, »Königreiche der Erde« und »Scheschach« sind angemessen. Die Fußnote zu Scheschach ist sachlich vorsichtig formuliert; ihr Anker muss jedoch bei »Scheschach« stehen, nicht bei »Nordens«.
