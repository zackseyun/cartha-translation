reference: Jeremiah 25:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: מִן שְׁלֹ֣שׁ עֶשְׂרֵ֣ה שָׁנָ֡ה לְ/יֹאשִׁיָּ֣הוּ בֶן אָמוֹן֩ מֶ֨לֶךְ יְהוּדָ֜ה וְ/עַ֣ד הַ/יּ֣וֹם הַ/זֶּ֗ה זֶ֚ה שָׁלֹ֤שׁ וְ/עֶשְׂרִים֙ שָׁנָ֔ה הָיָ֥ה דְבַר יְהוָ֖ה אֵלָ֑/י וָ/אֲדַבֵּ֧ר אֲלֵי/כֶ֛ם אַשְׁכֵּ֥ים וְ/דַבֵּ֖ר וְ/לֹ֥א שְׁמַעְתֶּֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/003.yaml
  text: From the thirteenth year of Josiah son of Amon[a], king of Judah, even to this day, these twenty-three years, the word of Yahweh has come to me, and I have spoken to you, rising early and speaking, but you have not listened.
translation:
  language: de
  text: Vom dreizehnten Jahr Josias, des Sohnes Amons, des Königs von Juda, bis zum heutigen Tag – nunmehr dreiundzwanzig Jahre lang – ist das Wort Jahwes an mich ergangen. Ich habe beharrlich immer wieder zu euch geredet[a], doch ihr habt nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „indem ich mich früh aufmachte und redete“. Die hebräische Wendung bezeichnet beharrliches, wiederholtes Handeln.'
    reason: Bewahrt die konkrete Bildsprache des hebräischen Idioms, dessen Sinn im Haupttext idiomatisch wiedergegeben wird.
lexical_decisions:
- source_word: מִן ... וְעַד
  choice: Vom ... bis zum
  rationale: Gibt den zeitlichen Bogen vom Ausgangspunkt bis zur Gegenwart im natürlichen Deutschen klar wieder.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: dreizehnten Jahr
  rationale: Die Wendung bezeichnet das dreizehnte Regierungsjahr Josias, nicht einen Zeitraum von dreizehn Jahren.
- source_word: לְיֹאשִׁיָּהוּ בֶן אָמוֹן מֶלֶךְ יְהוּדָה
  choice: Josias, des Sohnes Amons, des Königs von Juda
  rationale: Bewahrt sowohl die Abstammungsangabe als auch den Königstitel; die Namen folgen ihrer geläufigen deutschen biblischen Form.
- source_word: הַיּוֹם הַזֶּה
  choice: zum heutigen Tag
  rationale: Bewahrt den deiktischen Bezug auf Jeremias gegenwärtigen Zeitpunkt in würdigem, verständlichem Deutsch.
- source_word: זֶה שָׁלֹשׁ וְעֶשְׂרִים שָׁנָה
  choice: nunmehr dreiundzwanzig Jahre lang
  rationale: Gibt die zusammenfassende Zeitangabe idiomatisch wieder und erhält durch „nunmehr“ die hinweisende Kraft von זֶה.
- source_word: הָיָה דְבַר יְהוָה אֵלַי
  choice: ist das Wort Jahwes an mich ergangen
  rationale: Die deutsche Perfektform erfasst den vom vergangenen Ausgangspunkt bis zur Gegenwart reichenden Zeitraum; „an mich ergangen“ ist eine natürliche prophetische Redeweise.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als persönlichen Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Ich habe ... zu euch geredet
  rationale: Das Perfekt fügt sich in den bis zur Gegenwart reichenden Rückblick ein und bewahrt die direkte Anrede.
- source_word: אַשְׁכֵּים וְדַבֵּר
  choice: beharrlich immer wieder ... geredet
  rationale: Vermittelt die iterative und ausdauernde Bedeutung des hebräischen Bildausdrucks in natürlichem Deutsch; die wörtliche Bildsprache steht in der Fußnote.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: doch ihr habt nicht gehört
  rationale: Bewahrt das Hörmotiv von שׁמע und lässt dessen mögliche Bedeutung „hören/auf etwas hören, gehorchen“ offen, statt sie einseitig festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Namen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Deutung der prophetischen Wendung אַשְׁכֵּים וְדַבֵּר
  choice: beharrlich immer wieder zu euch geredet
  alternative: mich früh aufmachend und redend
  rationale: Die Hauptfassung vermittelt die übliche idiomatische Aussage wiederholten, unermüdlichen Redens. Die konkrete Bildsprache wird zur Nachprüfbarkeit in der Fußnote erhalten.
- issue: Bedeutungsumfang von שׁמע
  choice: gehört
  alternative: gehorcht / auf mich gehört
  rationale: „Gehört“ erhält die Spannung zwischen akustischem Hören, aufmerksamem Hören und Gehorsam, ohne die Aussage enger festzulegen als der hebräische Ausdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satz ist durch Gedankenstriche und einen Satzpunkt gegliedert, ohne seinen zeitlichen Gedankengang zu verändern. „Jahwe“ wird als im Deutschen etablierte Form des Gottesnamens verwendet; „gehört“ wahrt die lexikalische und theologische Offenheit des hebräischen Verbs.
