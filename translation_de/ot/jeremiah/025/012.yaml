id: JER.25.12
reference: Jeremiah 25:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֣ה כִ/מְלֹ֣אות שִׁבְעִ֣ים שָׁנָ֡ה אֶפְקֹ֣ד עַל מֶֽלֶךְ בָּבֶל֩ וְ/עַל הַ/גּ֨וֹי הַ/ה֧וּא נְאֻם יְהוָ֛ה אֶת עֲוֺנָ֖/ם וְ/עַל אֶ֣רֶץ כַּשְׂדִּ֑ים וְ/שַׂמְתִּ֥י אֹת֖/וֹ לְ/שִֽׁמְמ֥וֹת עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/012.yaml
  text: And when seventy years are completed[a], I will punish the king of Babylon and that nation—oracle of Yahweh—for their iniquity, and the land of the Chaldeans[b], and I will make it an everlasting desolation.
translation:
  language: de
  text: Und wenn die siebzig Jahre vollendet sind, werde ich den König von Babel und jenes Volk für ihre Schuld bestrafen – Ausspruch Jahwes – und ebenso das Land der Chaldäer. Ich werde es für alle Zeit zu einer Einöde machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zu Verwüstungen auf Dauer“; das Hebräische verwendet bei „Verwüstungen“ den Plural.'
    reason: Die Fußnote macht die hebräische Pluralform und die wörtlichere Fassung sichtbar, während der Haupttext die im Deutschen idiomatische Einzahl verwendet.
lexical_decisions:
- source_word: וְהָיָה כִמְלֹאות שִׁבְעִים שָׁנָה
  choice: Und wenn die siebzig Jahre vollendet sind
  rationale: Die Verbindung aus כ und dem Infinitiv von מלא bezeichnet den Zeitpunkt, an dem die siebzig Jahre vollständig abgelaufen sind. Die temporale Formulierung gibt das im modernen Deutschen natürlich wieder.
- source_word: אֶפְקֹד עַל
  choice: werde ich … bestrafen
  rationale: פקד mit עַל bezeichnet in diesem Gerichtszusammenhang ein strafendes Einschreiten. „Bestrafen“ ist klar und lässt sich sowohl auf den König und das Volk als auch auf das anschließend genannte Land beziehen.
- source_word: מֶלֶךְ בָּבֶל
  choice: den König von Babel
  rationale: „Babel“ ist die im deutschen Bibelgebrauch etablierte Wiedergabe des hebräischen Orts- und Reichsnamens בבל.
- source_word: הַגּוֹי הַהוּא
  choice: jenes Volk
  rationale: גוי bezeichnet hier die politische und ethnische Gemeinschaft Babyloniens. „Jenes Volk“ ist im Deutschen natürlicher als „jene Nation“ und wahrt den rückverweisenden Charakter von הַהוּא.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird formal und zugleich verständlich wiedergegeben. „Ausspruch“ bewahrt ihren substantivischen Charakter.
- source_word: אֶת עֲוֺנָם
  choice: für ihre Schuld
  rationale: עָוֹן kann Schuld, Vergehen oder dessen Folgen bezeichnen. Hier nennt es den Grund des göttlichen Strafhandelns; „Schuld“ erhält die moralische Bedeutung, ohne sie unnötig auszuweiten.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: das Land der Chaldäer
  rationale: Die historische Volksbezeichnung „Chaldäer“ bleibt erhalten und wird nicht mit „Babylonier“ gleichgesetzt.
- source_word: וְשַׂמְתִּי אֹתוֹ
  choice: Ich werde es … zu … machen
  rationale: שׂים mit ל bezeichnet das Versetzen in einen Zustand. Das maskuline Singularsuffix wird im Deutschen sachlich mit „es“ wiedergegeben und bezieht sich am natürlichsten auf das unmittelbar vorausgehende Land.
- source_word: לְשִׁמְמוֹת עוֹלָם
  choice: für alle Zeit zu einer Einöde
  rationale: „Einöde“ gibt den Zustand völliger Verwüstung idiomatisch wieder; „für alle Zeit“ bewahrt die zeitliche Tragweite von עוֹלָם, ohne eine philosophische Bestimmung von Ewigkeit einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Jahwe“ ist die geläufige deutsche Form und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Bezug des Singularpronomens אֹתוֹ
  choice: Bezug auf das Land der Chaldäer
  alternative: Zusammenfassender Bezug auf König, Volk und Land als eine gerichtete Einheit
  rationale: Das unmittelbar vorausgehende אֶרֶץ ist grammatisch singular und bietet den nächstliegenden Bezug. Die Formulierung lässt erkennen, dass das Land zur Einöde gemacht wird, ohne den vorangehenden Gerichtsspruch über König und Volk abzuschwächen.
- issue: Zeitliche Tragweite von עוֹלָם
  choice: für alle Zeit
  alternative: ewig
  rationale: עוֹלָם bezeichnet hier eine unabsehbare beziehungsweise dauerhafte Verwüstung. „Für alle Zeit“ wahrt den starken prophetischen Ausdruck, ohne die im Kontext nicht näher bestimmte metaphysische Reichweite festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der prophetischen Gerichtsankündigung, wird aber zur besseren Verständlichkeit nach „Chaldäer“ geteilt. Die Parenthese „Ausspruch Jahwes“ bewahrt die markante prophetische Formel.
