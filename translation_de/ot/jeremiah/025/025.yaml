id: JER.25.25
reference: Jeremiah 25:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל מַלְכֵ֣י זִמְרִ֗י וְ/אֵת֙ כָּל מַלְכֵ֣י עֵילָ֔ם וְ/אֵ֖ת כָּל מַלְכֵ֥י מָדָֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/025.yaml
  text: and all the kings of Zimri[a], and all the kings of Elam, and all the kings of Media[b];
translation:
  language: de
  text: und alle Könige von Simri[a], alle Könige von Elam und alle Könige von Medien[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wer oder was mit »Simri« gemeint ist, ist ungewiss; der Name könnte ein sonst nicht eindeutig bekanntes Volk oder Gebiet bezeichnen.
    reason: cultural_note
  - marker: b
    text: 'Oder: »der Meder«. Das hebräische Wort מָדָי kann das Land Medien oder das medische Volk bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: und
  rationale: Die Konjunktion וְ wird mit »und« wiedergegeben; der Akkusativmarker אֵת hat im Deutschen keine eigene Entsprechung. Beim zweiten und dritten Vorkommen bleibt die Reihung durch Kommas beziehungsweise »und« natürlich erkennbar.
- source_word: כָּל
  choice: alle
  rationale: Vor dem pluralischen Konstrukt bezeichnet כָּל die Gesamtheit der jeweiligen Herrschergruppe; »alle« ist dafür die natürliche deutsche Wiedergabe.
- source_word: מַלְכֵי
  choice: Könige von
  rationale: Der Konstruktplural von מֶלֶךְ bedeutet »Könige von«. Die Verbindung mit »von« ist im modernen Deutschen klar und idiomatisch.
- source_word: זִמְרִי
  choice: Simri
  rationale: Der unsicher identifizierte Eigenname wird in der im Deutschen üblichen biblischen Namensform »Simri« bewahrt und nicht deutend übersetzt.
- source_word: עֵילָם
  choice: Elam
  rationale: »Elam« ist die etablierte deutsche Form des Gebietsnamens עֵילָם.
- source_word: מָדָי
  choice: Medien
  rationale: מָדָי kann das Land Medien oder das medische Volk bezeichnen. In der geografisch geprägten Aufzählung nach »Könige von« ist »Medien« die natürliche Haupttextfassung; die personelle Deutung bleibt in der Fußnote erhalten.
