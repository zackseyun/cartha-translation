id: JER.25.36
reference: Jeremiah 25:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: ק֚וֹל צַעֲקַ֣ת הָֽ/רֹעִ֔ים וִֽ/ילְלַ֖ת אַדִּירֵ֣י הַ/צֹּ֑אן כִּֽי שֹׁדֵ֥ד יְהוָ֖ה אֶת מַרְעִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/036.yaml
  text: The sound of the cry of the shepherds[a], and the wailing of the leaders of the flock[b], for Yahweh is devastating their pasture.
translation:
  language: de
  text: Man hört das Geschrei der Hirten[a] und das Wehklagen der Mächtigen der Herde[b], denn Jahwe verwüstet ihre Weide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild von Hirten und Herde meint wahrscheinlich Herrscher oder andere Verantwortliche und die Menschen, die ihrer Obhut anvertraut sind.
    reason: cultural_note
  - marker: b
    text: 'Oder: »der Vornehmen der Herde« beziehungsweise »der Anführer der Herde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל צַעֲקַת
  choice: Man hört das Geschrei
  rationale: קוֹל bezeichnet hier das hörbare Geräusch beziehungsweise den Laut, צְעָקָה einen Not- oder Klageschrei. Die deutsche Formulierung gibt den akustischen Eindruck natürlich wieder, ohne die Intensität abzuschwächen.
- source_word: הָרֹעִים
  choice: der Hirten
  rationale: Das konkrete Hirtenbild bleibt erhalten, obwohl es im Zusammenhang wahrscheinlich auf Herrscher oder andere Verantwortliche zielt.
- source_word: וִילְלַת
  choice: und das Wehklagen
  rationale: יִלְלָה bezeichnet lautes Klagen oder Heulen aus Trauer und Not. „Wehklagen“ ist im Deutschen würdevoll und bringt die Intensität zum Ausdruck.
- source_word: אַדִּירֵי הַצֹּאן
  choice: der Mächtigen der Herde
  rationale: אַדִּיר kann einen Mächtigen, Vornehmen oder Führenden bezeichnen. „Mächtige“ bewahrt die lexikalische Weite und deutet die Metapher nicht vorschnell als eine bestimmte politische Funktion aus.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt den Grund für Geschrei und Wehklagen ein.
- source_word: שֹׁדֵד
  choice: verwüstet
  rationale: Das Partizip von שׁדד beschreibt ein gegenwärtiges beziehungsweise anschaulich vor Augen gestelltes Verheeren oder Verwüsten. Das Präsens bewahrt diese Wirkung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מַרְעִיתָם
  choice: ihre Weide
  rationale: מַרְעִית bezeichnet Weideland oder einen Weideplatz. „Weide“ erhält das durchgehende Bild von Hirten und Herde.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. Die Transliteration bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der Hirten- und Herdenmetaphorik
  choice: Das Bild bleibt im Haupttext erhalten.
  alternative: Ausdeutende Wiedergabe als Herrscher, Volk und Land
  rationale: Der Zusammenhang legt zwar eine politische beziehungsweise gesellschaftliche Deutung nahe, doch der hebräische Wortlaut hält das vollständige Hirtenbild aufrecht. Die Übersetzung bewahrt diese Bildsprache und nennt die wahrscheinliche Bedeutung nur in einer Fußnote.
- issue: Bedeutung von אַדִּירֵי הַצֹּאן
  choice: die Mächtigen der Herde
  alternative: die Anführer der Herde
  rationale: אַדִּירֵי kann Macht, Rang oder Vornehmheit bezeichnen. „Mächtige“ erhält diese Mehrdeutigkeit besser als die funktional eindeutigere Bezeichnung „Anführer“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Klang. „Geschrei“ und „Wehklagen“ vermitteln die hörbare Not; die zusammenhängende Hirten-, Herden- und Weidemetaphorik bleibt unverändert erhalten.
