  source_fidelity: 'Der Text gibt die Abfolge und Bildsprache des Hebräischen zuverlässig wieder: hörbarer Schrei der Hirten, Wehklagen der Mächtigen der Herde und die begründende Aussage, dass Jahwe ihre Weide verwüstet. Das Präsens bei „verwüstet“ bildet den hebräischen Partizipgebrauch angemessen ab.'
