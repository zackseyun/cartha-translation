  terminology: „Jahwe“ gibt den Gottesnamen konsistent wieder. „Hirten“, „Herde“ und „Weide“ erhalten die Metapher, ohne sie im Haupttext auszudeuten. „Mächtigen der Herde“ ist eine tragfähige, bewusst nicht einengende Wiedergabe von אַדִּירֵי הַצֹּאן; die Fußnote nennt sinnvolle Alternativen. Die Fußnotenanker sind passend zugeordnet.
