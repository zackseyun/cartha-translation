  yaml_path: translation/ot/jeremiah/025/014.yaml
  text: For many nations and great kings will make even them serve[a], and I will repay them according to their work and according to the work of their hands.
translation:
  language: de
  text: Denn auch sie werden vielen Völkern und mächtigen Königen dienen müssen[a]. Ich werde ihnen nach ihren Taten und nach dem Werk ihrer Hände vergelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Ausdruck ist gedrängt und mehrdeutig; wörtlich lässt er sich etwa als „Denn auch sie: Viele Völker und große Könige haben sich ihrer bedient“ umschreiben. Im Zusammenhang bedeutet er wahrscheinlich, dass Babylon nun selbst vielen Völkern und mächtigen Königen dienen muss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Gerichtsankündigung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: עָבְדוּ בָם
  choice: werden … dienen müssen
  rationale: 'Die hebräische Verbindung ist gedrängt und formal mehrdeutig. Im Kontext von Jeremia 25,12–14 bezeichnet sie wahrscheinlich die Umkehrung der Herrschaft: Babylon beziehungsweise die Chaldäer werden ihrerseits fremder Herrschaft unterworfen.'
- source_word: גַּם הֵמָּה
  choice: auch sie
  rationale: 'Bewahrt die Betonung der Umkehrung: Auch diejenigen, die andere unterwarfen, werden selbst dienen müssen.'
- source_word: גּוֹיִם רַבִּים
  choice: vielen Völkern
  rationale: גּוֹיִם bezeichnet hier politische Völker beziehungsweise Nationen; der Dativ folgt der deutschen Formulierung „jemandem dienen“.
- source_word: וּמְלָכִים גְּדוֹלִים
  choice: und mächtigen Königen
  rationale: גְּדוֹלִים bedeutet wörtlich „groß“, bezeichnet bei Königen im Kontext jedoch ihre Macht und Bedeutung; „mächtig“ ist im modernen Deutsch natürlicher.
- source_word: וְשִׁלַּמְתִּי לָהֶם
  choice: Ich werde ihnen vergelten
  rationale: Das Piel von שׁלם bezeichnet hier eine richterliche Vergeltung; „vergelten“ erhält diesen ernsten Sinn.
- source_word: כְּפָעֳלָם
  choice: was sie getan haben
  rationale: Gibt den Maßstab der Vergeltung klar und idiomatisch wieder, ohne über die Art ihrer Taten hinauszugehen.
- source_word: וּכְמַעֲשֵׂה יְדֵיהֶם
  choice: das Werk ihrer Hände
  rationale: Bewahrt das konkrete hebräische Handbild und die parallele, verstärkende Schlusswendung.
theological_decisions:
- issue: Bezug von „sie/ihnen“ in der Umkehrung des Gerichts
  choice: Die Pronomen beziehen sich auf Babylon beziehungsweise die Chaldäer, die nun selbst fremder Herrschaft unterworfen werden.
  alternative: Die Formulierung kann formal auch als vergangenes „viele Völker und große Könige haben durch sie gedient/sie in Dienst genommen“ verstanden werden.
  rationale: Der unmittelbare Zusammenhang kündigt das Gericht über den König von Babylon und sein Land an. Die gewählte Wiedergabe macht die dort erwartete Umkehrung verständlich, während die Fußnote die sprachliche Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist verständlich und kontextgerecht, während die Fußnote die ungewöhnliche hebräische Konstruktion und ihre echte Mehrdeutigkeit dokumentiert.
