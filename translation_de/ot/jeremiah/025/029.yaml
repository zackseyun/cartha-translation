  text: כִּי֩ הִנֵּ֨ה בָ/עִ֜יר אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלֶ֗י/הָ אָֽנֹכִי֙ מֵחֵ֣ל לְ/הָרַ֔ע וְ/אַתֶּ֖ם הִנָּקֵ֣ה תִנָּק֑וּ לֹ֣א תִנָּק֔וּ כִּ֣י חֶ֗רֶב אֲנִ֤י קֹרֵא֙ עַל כָּל יֹשְׁבֵ֣י הָ/אָ֔רֶץ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/029.yaml
  text: For behold[a], in the city over which my name is called, I am beginning to bring harm, and shall you indeed go unpunished? You shall not go unpunished, for I am calling for a sword against all the inhabitants of the earth[b], declares Yahweh of hosts.
translation:
  language: de
  text: 'Denn siehe: In der Stadt, die nach meinem Namen genannt ist[a], beginne ich, Unheil zu bringen. Und ihr werdet etwa ungestraft bleiben? Ihr werdet nicht ungestraft bleiben! Denn ich rufe das Schwert über alle Bewohner der Erde[b], spricht Jahwe der Heerscharen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „in der Stadt, über die mein Name ausgerufen ist“. Die hebräische Wendung bezeichnet die Stadt als dem Namen Gottes zugehörig.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Bewohner des Landes“. Das hebräische Wort kann sowohl „Land“ als auch „Erde“ bedeuten; im Zusammenhang ist die umfassendere Bedeutung „Erde“ naheliegend.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָעִיר אֲשֶׁר נִקְרָא שְׁמִי עָלֶיהָ
  choice: In der Stadt, über der mein Name ausgerufen ist
  rationale: Bewahrt das hebräische Bild eines über der Stadt ausgerufenen Namens als Kennzeichen von Zugehörigkeit und Anspruch; die geläufigere deutsche Wiedergabe steht in der Fußnote.
- source_word: מֵחֵל לְהָרַע
  choice: beginne ich, Unheil zu bringen
  rationale: Die Konstruktion bezeichnet den Beginn einer Handlung. „Unheil bringen“ gibt die gerichtliche Katastrophe wieder, ohne Gott moralisch böses Handeln zuzuschreiben.
- source_word: הִנָּקֵה תִנָּקוּ ... לֹא תִנָּקוּ
  choice: solltet etwa ungestraft bleiben? Ihr werdet nicht ungestraft bleiben
  rationale: Die rhetorische Frage und ihre nachdrückliche Verneinung werden mit derselben deutschen Wendung wiedergegeben; „etwa“ vermittelt die verstärkende, eine Verneinung erwartende Frage.
- source_word: חֶרֶב אֲנִי קֹרֵא
  choice: ich rufe das Schwert
  rationale: Erhält die Personifikation des Schwertes als herbeigerufenes Werkzeug des Gerichts und bleibt näher am Wortlaut als eine Verallgemeinerung zu „Krieg“.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  choice: alle Bewohner der Erde
  rationale: Im Kontext des Völkergerichts ist die umfassende Bedeutung plausibel; die ebenfalls mögliche regionale Wiedergabe „Land“ wird als echte lexikalische Alternative vermerkt.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: spricht Jahwe der Heerscharen
  rationale: „Spricht“ ist eine natürliche deutsche prophetische Formel; der Gottesname wird als „Jahwe“ wiedergegeben, und „Heerscharen“ bewahrt die traditionsreiche Weite von צְבָאוֹת.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname kenntlich gemacht und nicht durch einen Titel ersetzt.
- issue: Bedeutung von לְהָרַע beim Handeln Gottes
  choice: Unheil zu bringen
  alternative: Böses zu tun
  rationale: Im Gerichtskontext bezeichnet das Verb zugefügtes Unheil beziehungsweise eine Katastrophe, nicht moralische Bosheit Gottes.
- issue: Reichweite von הָאָרֶץ
  choice: Erde
  alternative: Land
  rationale: Der weitere Kontext richtet das Gericht über Jerusalem hinaus auf die Völker; zugleich bleibt die geografisch begrenztere Bedeutung des hebräischen Wortes möglich und wird in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge erhält die Steigerung von der Ankündigung des Gerichts über die rhetorische Frage bis zum weltweiten Schwertgericht. Das konkrete Bild des ausgerufenen Namens und die Personifikation des Schwertes bleiben erhalten.
