base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/022.yaml
  text: and all the kings of Tyre[a], and all the kings of Sidon, and the kings of the coastland that is across the sea;
translation:
  language: de
  text: und alle Könige von Tyrus und alle Könige von Sidon und die Könige des Küstenlandes[a], das jenseits des Meeres liegt;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Insel“. Das hebräische Wort אִי kann „Insel“ bedeuten, bezeichnet in prophetischen Texten aber oft allgemeiner ein Küstenland oder Seegebiet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: alle
  rationale: Gibt den umfassenden Sinn wieder und fügt sich natürlich in die Aufzählung ein.
- source_word: מַלְכֵי
  choice: Könige von / Könige des
  rationale: Der Status constructus bezeichnet die Könige der jeweils genannten Orte oder Region; die deutschen Präpositionen und Artikel richten sich nach dem Eigennamen beziehungsweise Gattungsnamen.
- source_word: צֹר
  choice: Tyrus
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: הָאִי
  choice: das Küstenland
  rationale: אִי kann eine Insel bezeichnen, wird in prophetischen Texten jedoch auch weiter für ein Küstenland oder Seegebiet gebraucht. „Küstenland“ wahrt hier den geografisch weiteren Sinn; die engere Möglichkeit wird in der Fußnote genannt.
- source_word: אֲשֶׁר בְּעֵבֶר הַיָּם
  choice: das jenseits des Meeres liegt
  rationale: Bildet den Relativsatz ausdrücklich ab und gibt die räumliche Bedeutung von בְּעֵבֶר in natürlichem modernem Deutsch wieder.
- source_word: וְאֵת ... וְאֵת ... וְאֵת
  choice: und ... und ... und
  rationale: Die wiederholte Verbindung setzt die Aufzählung des vorigen Verses fort; den unübersetzbaren Akkusativmarker gibt das Deutsche nicht gesondert wieder.
