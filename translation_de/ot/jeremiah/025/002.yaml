  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁ֨ר דִּבֶּ֜ר יִרְמְיָ֤הוּ הַ/נָּבִיא֙ עַל כָּל עַ֣ם יְהוּדָ֔ה וְ/אֶ֛ל כָּל יֹשְׁבֵ֥י יְרוּשָׁלִַ֖ם לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/002.yaml
  text: 'which Jeremiah the prophet spoke to all the people of Judah and to all the inhabitants of Jerusalem[b][a], saying:'
translation:
  language: de
  text: 'das der Prophet Jeremia zum ganzen Volk von Juda und zu allen Bewohnern Jerusalems sprach[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »zum« wiedergegebene hebräische Verhältniswort kann auch »über« oder »gegen« bedeuten; hier weist die Parallele zu »zu allen Bewohnern Jerusalems« auf die Angesprochenen hin.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: das
  rationale: Das Relativpronomen nimmt das grammatisch sächliche »Wort« aus Vers 1 auf und führt den Relativsatz natürlich fort.
- source_word: דִּבֶּר
  choice: sprach
  rationale: דבר bedeutet gewöhnlich »sprechen«. Im Deutschen leitet der Doppelpunkt die folgende Rede idiomatischer ein als eine zusätzliche Wiedergabe von לֵאמֹר durch »indem er sagte«.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: der Prophet Jeremia
  rationale: Die im Deutschen übliche Wortstellung gibt den appositionellen Titel mit bestimmtem Artikel wieder.
- source_word: עַל כָּל עַם יְהוּדָה
  choice: zum ganzen Volk von Juda
  rationale: עַל kann bei דבר die angesprochene Gruppe bezeichnen; der Parallelismus mit וְאֶל spricht hier für eine Rede an das Volk. »Zum« bewahrt diese Funktion, ohne die möglichen Bedeutungen »über« oder »gegen« zu verschweigen.
- source_word: וְאֶל כָּל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: und zu allen Bewohnern Jerusalems
  rationale: אֶל bezeichnet klar die Adressaten. »Bewohner« ist eine natürliche, würdige Wiedergabe des substantivierten Partizips ישׁב.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im modernen Deutschen die Funktion des hebräischen Redeeinleiters und vermeidet die schwerfällige Formulierung »und sagte« nach »sprach«.
theological_decisions: []
