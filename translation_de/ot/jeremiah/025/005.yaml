  text: לֵ/אמֹ֗ר שֽׁוּבוּ נָ֞א אִ֣ישׁ מִ/דַּרְכּ֤/וֹ הָֽ/רָעָה֙ וּ/מֵ/רֹ֣עַ מַעַלְלֵי/כֶ֔ם וּ/שְׁבוּ֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם לְ/מִן עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/005.yaml
  text: saying[a], ‘Please turn back, each man from his evil way and from the evil of your deeds[b], and dwell in the land that Yahweh gave to you and to your fathers from of old and forever.’
translation:
  language: de
  text: 'Sie sagten: »Kehrt doch um, jeder von seinem bösen Weg und von euren bösen Taten, und wohnt in dem Land, das Jahwe euch und euren Vätern gegeben hat – seit alters und für immer.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »von ferner Vorzeit und bis in ferne Zukunft«; die hebräische Wendung umfasst Vergangenheit und Zukunft.'
    reason: cultural_note
lexical_decisions:
- source_word: לֵאמֹר
  choice: 'Sie sagten:'
  rationale: Der Infinitiv leitet den Inhalt der zuvor erwähnten prophetischen Botschaft ein. Im Deutschen gibt ein finites Verb den Anschluss an den vorausgehenden Kontext natürlich wieder.
- source_word: שׁוּבוּ נָא
  choice: Kehrt doch um
  rationale: שׁוּב bezeichnet hier die Abkehr vom bisherigen Lebensweg; נָא verleiht der Aufforderung einen bittenden, dringlichen Ton, den „doch“ idiomatisch wiedergibt.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: jeder von seinem bösen Weg
  rationale: 'אִישׁ ist distributiv: Jeder Einzelne ist angesprochen. „Weg“ bewahrt das hebräische Bild für Lebensführung und Verhalten.'
- source_word: וּמֵרֹעַ מַעַלְלֵיכֶם
  choice: und von euren bösen Taten
  rationale: Die natürliche deutsche Formulierung gibt die Bosheit der מַעֲלָלִים als Eigenschaft der Taten wieder und bewahrt den Wechsel vom distributiven Singular zum kollektiven Plural.
- source_word: וּשְׁבוּ עַל הָאֲדָמָה
  choice: und wohnt in dem Land
  rationale: יָשַׁב bezeichnet hier dauerhaftes Wohnen; אֲדָמָה meint im Zusammenhang das von Gott gegebene Land. „In dem Land“ ist im Deutschen idiomatischer als eine formale Wiedergabe mit „auf“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: euch und euren Vätern
  rationale: „Väter“ bewahrt die konkrete familiäre und generationenbezogene Ausdrucksweise des Hebräischen.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: seit alters und für immer
  rationale: Die Wendung blickt sowohl in die ferne Vergangenheit als auch in die unbegrenzte Zukunft. Diese zeitliche Asymmetrie bleibt in verständlichem Deutsch erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt diesen als Namen; die traditionelle Ersatzlesung „der HERR“ bleibt eine mögliche liturgische Konvention, steht aber nicht als Titel im Konsonantentext.
- issue: Dauer der Landgabe
  choice: seit alters und für immer
  alternative: von Ewigkeit zu Ewigkeit
  rationale: Die Formulierung wahrt den Rückblick und den Ausblick des hebräischen Idioms, ohne daraus eine abstrakte dogmatische Aussage über Zeit oder Besitzbedingungen abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kehrt doch um“ trägt den eindringlich-bittenden Ton; „Weg“ bewahrt die prophetische Lebensmetapher. Der Wechsel von „seinem“ zu „euren“ folgt bewusst dem Wechsel vom distributiven Singular zum angesprochenen Plural im Hebräischen.
