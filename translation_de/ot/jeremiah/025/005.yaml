  terminology: „Jahwe“ ist die etablierte deutsche Wiedergabe des Gottesnamens. „Böser Weg“, „böse Taten“, „Land“ und „Väter“ bewahren die biblisch-prophetische Ausdrucksweise und bleiben zugleich verständlich. Die Fußnote erklärt die idiomatische Zeitformel angemessen.
