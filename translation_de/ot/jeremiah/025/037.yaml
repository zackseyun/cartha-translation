  text: וְ/נָדַ֖מּוּ נְא֣וֹת הַ/שָּׁל֑וֹם מִ/פְּנֵ֖י חֲר֥וֹן אַף יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/037.yaml
  text: And the peaceful pastures are laid waste because of the burning anger of Yahweh[a].
translation:
  language: de
  text: Und die friedlichen Weideplätze werden verwüstet[a] wegen des glühenden Zorns Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verstummen«. Wörtlicher: »die Weideplätze des Friedens«.'
    reason: „Verstummen“ gibt eine mögliche Grundbedeutung von וְנָדַמּוּ wieder, während der Haupttext die im Gerichtskontext naheliegende Verwüstung ausdrückt. Die zweite Angabe bewahrt die formnähere Wiedergabe der hebräischen Genitivverbindung נְאוֹת הַשָּׁלוֹם.
lexical_decisions:
- source_word: וְנָדַמּוּ
  choice: verstummen
  rationale: Das Nifal von דמם bedeutet zunächst still oder zum Schweigen gebracht werden. Im Gerichtskontext bezeichnet es die völlige Verödung der Weideplätze, doch „verstummen“ bewahrt das konkrete hebräische Bild, ohne die mögliche Bedeutung vorschnell auf „verwüstet werden“ festzulegen.
- source_word: נְאוֹת
  choice: Weideplätze
  rationale: נְאוֹת bezeichnet hier im Hirten- und Landschaftsbild Weide- beziehungsweise Lagerplätze und nicht allgemein Wohnstätten.
- source_word: הַשָּׁלוֹם
  choice: friedlichen
  rationale: Die wörtliche Genitivverbindung „Weideplätze des Friedens“ beschreibt sichere, ungestörte Weideplätze. „friedlichen Weideplätze“ ist im Deutschen natürlich; die formnähere Wiedergabe steht in der Fußnote.
- source_word: מִפְּנֵי
  choice: vor
  rationale: מִפְּנֵי kann Ursache ausdrücken („wegen“), bewahrt mit „vor“ aber zugleich die bildhafte Vorstellung, dass die Weideplätze angesichts von Jahwes Zorn verstummen.
- source_word: חֲרוֹן אַף
  choice: glühenden Zorn
  rationale: Die feste Wendung bezeichnet heftigen, entbrannten Zorn. „glühender Zorn“ erhält die im Hebräischen angelegte Hitzevorstellung in würdigem, geläufigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ macht den Eigennamen sichtbar, während „der HERR“ ihn durch einen Titel ersetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Personifikation „Weideplätze verstummen“ bewahrt das hebräische Bild; die geläufigere kontextuelle Deutung „werden verwüstet“ wird als Alternative dokumentiert.
