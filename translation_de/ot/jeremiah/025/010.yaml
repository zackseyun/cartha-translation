  to: 'Und ich werde aus ihrer Mitte verschwinden lassen[a]: den Klang der Freude und den Klang der Fröhlichkeit, die Stimme des Bräutigams und die Stimme der Braut[b], das Geräusch der Mühlsteine und das Licht der Lampe.'
