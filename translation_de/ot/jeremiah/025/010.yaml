  text: וְ/הַאֲבַדְתִּ֣י מֵ/הֶ֗ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה ק֥וֹל רֵחַ֖יִם וְ/א֥וֹר נֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/010.yaml
  text: And I will destroy from among them the sound of joy and the sound of gladness[a], the voice of the bridegroom and the voice of the bride[b], the sound of the millstones and the light of the lamp.
translation:
  language: de
  text: 'Und ich werde aus ihrer Mitte verschwinden lassen[a]: den Klang der Freude und den Klang der Fröhlichkeit, die Stimme des Bräutigams und die Stimme der Braut[b], das Geräusch der Mühlsteine und das Licht der Lampe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zugrunde gehen lassen“, „beseitigen“ oder „ein Ende bereiten“. Das hebräische Verb steht in einer kausativen Form.'
    reason: lexical_alternative
  - marker: b
    text: Die Stimmen von Bräutigam und Braut stehen für Hochzeitsfeiern und damit für das normale gemeinschaftliche Leben.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַאֲבַדְתִּי
  choice: ich werde … verstummen lassen
  rationale: Der Hifil von אבד bedeutet hier kausativ, dass etwas verschwindet bzw. aufhört. Da zunächst Klänge und Stimmen die Objekte sind, gibt „verstummen lassen“ die Wirkung im Deutschen natürlich wieder; für das abschließende Lampenlicht ist die Formulierung zeugmatisch, wie auch das hebräische Verb die ganze Reihe regiert.
- source_word: מֵהֶם
  choice: bei ihnen
  rationale: מן mit Suffix bezeichnet hier die Entfernung aus ihrer Mitte. „Bei ihnen“ ist im Deutschen idiomatisch und lokalisiert das Aufhören innerhalb ihrer Gemeinschaft.
- source_word: קוֹל
  choice: Klang / Stimme / Geräusch
  rationale: קוֹל bezeichnet je nach Bezug Klang, Stimme oder Geräusch. Die wechselnde deutsche Wiedergabe entspricht den verschiedenen Trägern, während die parallele Satzstruktur die rhetorische Wiederholung bewahrt.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Freude und Jubel
  rationale: Die beiden eng verwandten Begriffe werden unterschieden, ohne einen unnatürlichen deutschen Doppelbegriff zu erzeugen. „Jubel“ hebt bei שִׂמְחָה hier den hörbaren festlichen Ausdruck hervor.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: die Stimme des Bräutigams und die Stimme der Braut
  rationale: Die wörtliche Personenpaarung bewahrt das konkrete Bild einer Hochzeitsfeier und zugleich den würdevollen prophetischen Ton.
- source_word: קוֹל רֵחַיִם
  choice: das Geräusch der Mühlsteine
  rationale: רֵחַיִם bezeichnet die zusammengehörigen Mahlsteine. Ihr Geräusch steht konkret für alltägliche häusliche Arbeit.
- source_word: אוֹר נֵר
  choice: das Licht der Lampe
  rationale: Die Constructusverbindung wird direkt und natürlich wiedergegeben und bewahrt das Bild bewohnter, lebendiger Häuser.
theological_decisions:
- issue: Bildsprache des prophetischen Gerichts
  choice: Die konkreten Zeichen gemeinschaftlichen und häuslichen Lebens bleiben als Aufzählung erhalten.
  alternative: Eine zusammenfassende Paraphrase wie „Ich werde jedes fröhliche und alltägliche Leben bei ihnen beenden“.
  rationale: Der hebräische Text entfaltet das Gericht durch das Verschwinden hör- und sichtbarer Lebenszeichen. Eine abstrakte Zusammenfassung würde diese Bildkraft und die rhetorische Spannung mindern.
- issue: Reichweite des Verbs וְהַאֲבַדְתִּי
  choice: Ein einziges kausatives Verb regiert die gesamte Reihe, auch das Lampenlicht.
  alternative: Für das Lampenlicht ein zusätzliches Verb wie „erlöschen lassen“ einsetzen.
  rationale: Die leichte semantische Spannung entspricht der hebräischen Konstruktion. Eine Ergänzung würde den Sinn verdeutlichen, aber die kompakte Struktur des Ausgangstextes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Aufzählung und die konkreten Bilder des Hebräischen bleiben erhalten; „verstummen lassen“ sorgt bei den akustischen Gliedern für natürliche Sprache, während die bewusste zeugmatische Verbindung mit „Licht der Lampe“ die knappe hebräische Syntax spiegelt.
