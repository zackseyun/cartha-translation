  text: לָ/כֵ֕ן כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת יַ֕עַן אֲשֶׁ֥ר לֹֽא שְׁמַעְתֶּ֖ם אֶת דְּבָרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/008.yaml
  text: 'Therefore[a], thus says Yahweh of hosts: Because you have not listened to my words[b],'
translation:
  language: de
  text: 'Darum so spricht Jahwe der Heerscharen: Weil ihr nicht auf meine Worte gehört habt[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mir nicht gehorcht habt“. Das hebräische Verb kann ein Hören bezeichnen, das sich im Gehorsam zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Anklage und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feste prophetische Botenformel in ihrer geläufigen, würdevollen deutschen Form; das hebräische Perfekt wird in dieser Formel idiomatisch präsentisch wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als Namen wieder und lässt צְבָאוֹת in seiner umfassenden Bedeutung stehen, ohne es auf menschliche Armeen einzuengen.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Leitet knapp und eindeutig den Grund für das folgende Gerichtswort ein.
- source_word: לֹא שְׁמַעְתֶּם
  choice: nicht … gehört habt
  rationale: שׁמע bezeichnet hier ein Hören, das eine entsprechende Reaktion erwartet. „Gehört“ bewahrt die Grundbedeutung, während der Zusammenhang den Aspekt des Nichtgehorchens erkennen lässt.
- source_word: אֶת דְּבָרָי
  choice: auf meine Worte
  rationale: Die Verbindung „auf meine Worte hören“ ist natürliches Deutsch und bleibt nahe am hebräischen Plural mit dem Suffix der ersten Person.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע
  choice: gehört
  alternative: gehorcht
  rationale: Das Verb kann sowohl das Hören als auch das daraus folgende Gehorchen bezeichnen. Die Übersetzung lässt diese Spannung im Haupttext bestehen und nennt die engere sinngemäße Wiedergabe in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller prophetischer Sprachform. Die einleitende Folgerung, die Botenformel und der offene Anschluss an den folgenden Vers werden bewahrt.
