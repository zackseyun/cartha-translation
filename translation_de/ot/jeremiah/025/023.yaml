lexical_decisions:
- source_word: דְּדָן
  choice: Dedan
  rationale: Der Eigenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: תֵּימָא
  choice: Tema
  rationale: Der Name der arabischen Oase beziehungsweise Volksgruppe wird in der etablierten deutschen Form wiedergegeben.
- source_word: בּוּז
  choice: Bus
  rationale: Der Eigenname wird nach der üblichen deutschen Bibeltranskription mit abschließendem s wiedergegeben.
- source_word: כָּל
  choice: alle
  rationale: Die umfassende Mengenangabe passt natürlich in die Aufzählung von Völkern und Gruppen.
- source_word: קְצוּצֵי
  choice: die sich … stutzen
  rationale: Das Partizip aus קצץ bezeichnet das Abschneiden oder Kürzen; die verbale Relativkonstruktion ist im modernen Deutschen klar und natürlich.
- source_word: פֵאָה
  choice: das Haar an den Schläfen
  rationale: פֵאָה bedeutet wörtlich »Rand« oder »Ecke« und bezeichnet in dieser ethnografischen Wendung wahrscheinlich das Haar an den Seiten des Kopfes; die Ergänzung »Haar« macht den gemeinten Brauch verständlich, ohne die mögliche Beziehung zum Bart in der Fußnote auszuschließen.
