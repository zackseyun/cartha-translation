  source_fidelity: Die Eigennamen Dedan, Tema und Bus entsprechen dem Hebräischen. Die Wendung קְצוּצֵי פֵאָה bezeichnet jedoch wörtlich Menschen, die »am Rand/der Seite abgeschnitten bzw. gestutzt« sind; die vorliegende Fußnote formuliert dies zu aktiv als »die den Rand abschneiden«. Außerdem legt »an den Schläfen« im Haupttext die Kopfhaar-Deutung etwas stärker fest, als die hebräische Wendung selbst zulässt.
