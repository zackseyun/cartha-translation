    issue: Die Wiedergabe von שָׁתוֹ תִשְׁתּוּ als „Ihr müsst ihn trinken, ja, ihr müsst trinken!“
    rationale: Der absolute Infinitiv mit finitem Verb verstärkt die Aussage („ihr werdet ganz gewiss/sicherlich trinken“). „Müsst“ kann zwar den Zwang des Kontextes anklingen lassen, legt aber stärker eine modale Verpflichtung nahe; die Wiederholung mit „ja“ ist zudem im Deutschen unnötig schwerfällig.
