source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֧י יְמָאֲנ֛וּ לָ/קַֽחַת הַ/כּ֥וֹס מִ/יָּדְ/ךָ֖ לִ/שְׁתּ֑וֹת וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת שָׁת֥וֹ תִשְׁתּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/025/028.yaml
  text: 'And if they refuse to take the cup from your hand to drink[a], then you shall say to them, ‘Thus says Yahweh of hosts: You shall surely drink.’'
translation:
  language: de
  text: 'Und wenn sie sich weigern, den Becher aus deiner Hand zu nehmen und daraus zu trinken, dann sollst du zu ihnen sagen: »So spricht Jahwe der Heerscharen: Ihr werdet ganz gewiss trinken!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Wendung leitet hier einen möglichen künftigen Fall ein; „Und wenn“ gibt die bedingte Aussage natürlich wieder.
- source_word: יְמָאֲנוּ
  choice: sie sich weigern
  rationale: Das Piel von מאן bezeichnet eine ausdrückliche Weigerung.
- source_word: לָקַחַת הַכּוֹס מִיָּדְךָ לִשְׁתּוֹת
  choice: den Becher aus deiner Hand zu nehmen und daraus zu trinken
  rationale: „Becher“ bewahrt das Bild des hebräischen Textes; „daraus“ macht im Deutschen den Bezug des Trinkens auf den Becher eindeutig, ohne das Bild auszudeuten.
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: dann sollst du zu ihnen sagen
  rationale: Die Verbform führt die prophetische Anweisung fort und hat hier direktiven Zukunftssinn.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Eingebürgerte und genaue deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ bewahrt den Titel צבאות transparent.
- source_word: שָׁתוֹ תִשְׁתּוּ
  choice: Ihr müsst ihn trinken, ja, ihr müsst trinken!
  rationale: Der absolute Infinitiv mit finitem Verb verstärkt die Aussage. Die Wiederaufnahme mit „ja“ bildet den Nachdruck idiomatisch ab; „müsst“ lässt den Zwang im Kontext hervortreten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung des Bechers
  choice: Das Bild „Becher“ ohne erklärenden Zusatz beibehalten
  alternative: Becher des Zorns
  rationale: Der unmittelbare Vers nennt nur den Becher. Seine Bedeutung als göttliches Zorngericht ergibt sich aus dem Zusammenhang und wird nicht in den Wortlaut eingefügt.
- issue: Kraft von שָׁתוֹ תִשְׁתּוּ
  choice: Verpflichtung und unausweichliche Gewissheit gemeinsam ausdrücken
  alternative: Ihr werdet ihn ganz gewiss trinken
  rationale: Die Form ist emphatisch und steht in einer erzwungenen Handlungssituation. „Müsst“ bewahrt den Zwang, während die Wiederholung den Nachdruck wiedergibt, ohne ausschließlich Befehl oder Vorhersage festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am Hebräischen, ist aber natürlich lesbar. Keine Fußnote ist erforderlich, da die emphatische Konstruktion im Haupttext sichtbar wiedergegeben wird.
