source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר יְהוָ֔ה הִנֵּ֥ה כַ/נֶּ֖שֶׁר יִדְאֶ֑ה וּ/פָרַ֥שׂ כְּנָפָ֖י/ו אֶל מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/040.yaml
  text: 'For thus says the LORD: Look, like an eagle he swoops down and spreads his wings over Moab.'
translation:
  language: de
  text: 'Denn so spricht der HERR: Seht, wie ein Adler fliegt er heran und breitet seine Flügel über Moab aus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Denn so spricht
  rationale: Gibt die begründende Verknüpfung durch כִּי und die prophetische Botenformel כֹה אָמַר natürlich und würdevoll wieder.
- source_word: יְהוָה
  choice: der HERR
  rationale: Folgt der etablierten deutschen Bibelkonvention, den Gottesnamen in Kapitälchen wiederzugeben, ohne einen deutschen Eigennamen einzuführen.
- source_word: הִנֵּה
  choice: Seht
  rationale: Bewahrt die aufmerksamkeitslenkende und dramatisierende Funktion des hebräischen Präsentativpartikels.
- source_word: כַנֶּשֶׁר
  choice: wie ein Adler
  rationale: נֶשֶׁר kann einen Adler oder großen Geier bezeichnen; „Adler“ ist im Deutschen die natürliche, traditionsreiche Entsprechung und passt zum Bild des schnellen Angriffs.
- source_word: יִדְאֶה
  choice: fliegt er heran
  rationale: Das Verb bezeichnet das Fliegen beziehungsweise Dahingleiten eines Raubvogels. „Heranfliegen“ wahrt die bedrohliche Bewegung, ohne die im Verb nicht eindeutig festgelegte Vorstellung eines Sturzflugs zu erzwingen.
- source_word: וּפָרַשׂ כְּנָפָיו אֶל מוֹאָב
  choice: und breitet seine Flügel über Moab aus
  rationale: Gibt das anschauliche Bild idiomatisch wieder. אֶל bezeichnet die Ausrichtung auf Moab; im Bild ausgebreiteter Flügel ist „über Moab“ im Deutschen natürlich und bewahrt den bedrohlichen Sinn.
theological_decisions:
- issue: Identität des mit „er“ bezeichneten Angreifers
  choice: Das maskuline Pronomen bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Den Angreifer als Nebukadnezar oder Babylon ausdrücklich benennen.
  rationale: Der hebräische Vers nennt den Handelnden nicht. Eine explizite Identifizierung würde die im Text bestehende Offenheit unzulässig auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit prophetisch-feierlichem Ton. Die Wortstellung „wie ein Adler fliegt er heran“ hält das Vergleichsbild im Vordergrund und vermeidet unnötig technische oder altertümliche Sprache.
