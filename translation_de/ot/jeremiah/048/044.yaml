source:
  edition: WLC
  text: ה/ניס מִ/פְּנֵ֤י הַ/פַּ֨חַד֙ יִפֹּ֣ל אֶל הַ/פַּ֔חַת וְ/הָֽ/עֹלֶה֙ מִן הַ/פַּ֔חַת יִלָּכֵ֖ד בַּ/פָּ֑ח כִּֽי אָבִ֨יא אֵלֶ֧י/הָ אֶל מוֹאָ֛ב שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
translation:
  language: de
  text: Wer vor dem Schrecken flieht, wird in die Grube fallen, und wer aus der Grube heraufsteigt, wird in der Schlinge gefangen werden. Denn ich bringe über sie, über Moab, das Jahr ihrer Heimsuchung[a] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bestrafung“; auch: „Abrechnung“.'
    reason: 'Lexikalische Alternative: פְּקֻדָּה hat eine breitere Bedeutung, bezeichnet hier aber ein strafendes Eingreifen.'
lexical_decisions:
- source_word: הניס מִפְּנֵי הַפַּחַד
  choice: Wer vor dem Schrecken flieht
  rationale: Das substantivisch gebrauchte Partizip wird als allgemeiner Relativsatz wiedergegeben. „Schrecken“ bezeichnet hier bedrohliches Entsetzen und passt zum Gerichtskontext.
- source_word: יִפֹּל אֶל הַפַּחַת
  choice: wird in die Grube fallen
  rationale: פַּחַת bezeichnet eine Grube beziehungsweise Fanggrube. „Grube“ bewahrt das konkrete Bild und unterscheidet es von der folgenden Schlinge.
- source_word: וְהָעֹלֶה מִן הַפַּחַת
  choice: wer aus der Grube heraufsteigt
  rationale: עלה bedeutet hier, aus der Grube hinaufzukommen. „Heraufsteigt“ gibt die Bewegungsrichtung wieder, ohne eine erfolgreiche Flucht vorwegzunehmen.
- source_word: יִלָּכֵד בַּפָּח
  choice: wird sich in der Schlinge fangen
  rationale: פַּח ist eine Schlinge oder Falle. Die Formulierung erhält die Abfolge von Schrecken, Grube und Schlinge.
- source_word: כִּי אָבִיא אֵלֶיהָ אֶל מוֹאָב
  choice: Denn ich bringe über sie, über Moab
  rationale: Das feminine Pronomen nimmt Moab als Land beziehungsweise Gemeinwesen auf; die anschließende Nennung „über Moab“ erläutert den Bezug. „Über … bringen“ entspricht im Deutschen dem Gerichtsidiom.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: das Jahr ihrer Heimsuchung
  rationale: פְּקֻדָּה kann eine machtvolle Zuwendung beziehungsweise ein Einschreiten Gottes bezeichnen, das hier eindeutig Gericht bringt. „Heimsuchung“ bewahrt mehr von der semantischen Breite als das engere „Bestrafung“; die punitive Bedeutung wird in der Fußnote erläutert.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben; der Gottesname erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פְּקֻדָּה im Gerichtswort
  choice: Heimsuchung
  alternative: Bestrafung; Abrechnung
  rationale: Der Zusammenhang macht die gerichtliche, strafende Seite deutlich, doch das hebräische Wort bezeichnet umfassender ein bestimmendes Eingreifen oder Aufsuchen. Der Haupttext bewahrt diese Breite, während die Fußnote den kontextuellen Sinn nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwörtlicher Struktur. Die dreifache Bildfolge Schrecken–Grube–Schlinge und die appositionelle Wiederholung „über sie, über Moab“ bleiben erhalten.
