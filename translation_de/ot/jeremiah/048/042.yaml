id: JER.48.42
reference: Jeremiah 48:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִשְׁמַ֥ד מוֹאָ֖ב מֵ/עָ֑ם כִּ֥י עַל יְהוָ֖ה הִגְדִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
translation:
  language: de
  text: Und Moab wird als Volk vernichtet werden, weil es sich gegen Jahwe erhoben hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sich gegen Jahwe großgemacht hat“; gemeint ist hochmütige Selbsterhöhung gegen ihn.'
    reason: Erläutert das hebräische Bild des »Großmachens« und dessen hier gemeinten Sinn, ohne die idiomatische Hauptfassung zu belasten.
lexical_decisions:
- source_word: וְנִשְׁמַד
  choice: wird vernichtet werden
  rationale: Das Nifal-Perfekt steht im prophetischen Gerichtswort mit zukünftig-resultativer Bedeutung. Die passive Form und der Ernst des angekündigten Untergangs bleiben erhalten, ohne eine metaphysische Auslöschung zu behaupten.
- source_word: מוֹאָב
  choice: Moab
  rationale: Übliche deutsche Wiedergabe des Namens des Volkes und Landes.
- source_word: מֵעָם
  choice: als Volk
  rationale: Die Verbindung bezeichnet hier wahrscheinlich den Verlust des Status als eigenständiges Volk. „Als Volk“ gibt dies knapp und idiomatisch wieder; „aus den Völkern“ wäre wegen des singularischen, unbestimmten עָם weniger wahrscheinlich.
- source_word: כִּי
  choice: weil
  rationale: Leitet ausdrücklich den Grund für das Gericht ein.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang mit der hochmütigen Selbsterhöhung bezeichnet die Präposition die feindselige Ausrichtung gegenüber Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als geläufige deutsche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִגְדִּיל
  choice: sich großgemacht hat
  rationale: Bewahrt das hebräische Bild des Großmachens und bringt den kontextuell vorausgesetzten reflexiven Sinn verständlich zum Ausdruck. Die Fußnote erläutert die damit gemeinte anmaßende Selbsterhöhung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Art von Moabs Vergehen
  choice: „sich gegen Jahwe großgemacht“ als anmaßende Selbsterhöhung
  alternative: „gegen Jahwe geprahlt“
  rationale: Die bildhafte Formulierung bleibt erhalten, ohne sie auf bloßes verbales Prahlen einzuengen; zugleich macht die Präposition „gegen“ die oppositionelle Ausrichtung deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am knappen prophetischen Gerichtswort; „als Volk“ ist verständlich, ohne die Aussage über den Verlust der nationalen Existenz unnötig auszudeuten.
