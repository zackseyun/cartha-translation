    rationale: „Ertappen“ impliziert häufig, jemanden bei einer Verfehlung zu überführen. Das hebräische Verb bedeutet zunächst „gefunden/angetroffen werden“; die kriminalisierende rhetorische Unterstellung bleibt mit „gefunden“ erhalten, ohne sie zu verstärken.
