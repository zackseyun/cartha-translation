revisions:
- from: War dir Israel nicht zum Gespött? War Israel etwa unter Dieben ertappt worden, dass du immer, wenn du von ihm sprachst, den Kopf schütteltest[a]?
  to: War dir Israel nicht zum Gespött? Wurde Israel etwa unter Dieben gefunden? Denn sooft du von ihm sprachst, schütteltest du den Kopf[a].
  rationale: Die Revision gibt die kausale Funktion von כִּי mit „Denn“ wieder und ersetzt das stärker deutende „ertappt“ durch „gefunden“. Die poetisch-rhetorische Struktur wird durch zwei kurze Fragen und die anschließende Begründung deutlicher. Die Fußnote wurde idiomatisch präzisiert und erläutert weiterhin, dass „Kopf“ eine kontextuelle Ergänzung ist.
