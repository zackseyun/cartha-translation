  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die beiden rhetorischen Fragen und der wiederholte spöttische Gestus bleiben erhalten; „etwa“ kennzeichnet die erwartete verneinende Antwort.
