base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
translation:
  language: de
  text: War dir Israel nicht zum Gespött? Wurde Israel etwa unter Dieben gefunden? Denn sooft du von ihm sprachst, schütteltest du den Kopf[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wackeltest du mit dem Kopf“. Das hebräische Verb bezeichnet eine schüttelnde oder schwankende Bewegung; hier ist wahrscheinlich eine Gebärde des Spotts gemeint. „Kopf“ steht nicht ausdrücklich im hebräischen Text.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  choice: zum Gespött
  rationale: Das Substantiv bezeichnet spöttisches Lachen bzw. den Gegenstand des Spotts. Die deutsche Wendung „jemandem zum Gespött sein“ gibt dies natürlich und prägnant wieder.
- source_word: הָיָה לְךָ
  choice: war dir ... zum
  rationale: Die deutsche Konstruktion bewahrt die relationale Kraft von לְ und verbindet sich idiomatisch mit „zum Gespött“.
- source_word: אִם בְּגַנָּבִים נמצאה
  choice: War Israel etwa unter Dieben ertappt worden
  rationale: Die rhetorische Frage unterstellt gerade nicht, dass Israel als einer von Dieben aufgegriffen worden sei. „Ertappt worden“ macht den kriminalrechtlichen Zusammenhang im Deutschen deutlich, ohne die Aussage unnötig auszudeuten.
- source_word: כִּי מִדֵּי
  choice: dass ... immer, wenn
  rationale: Die Formulierung gibt den wiederholten Vorgang wieder und erhält zugleich den syntaktischen Zusammenhang mit der vorausgehenden rhetorischen Frage.
- source_word: דְבָרֶיךָ בּוֹ
  choice: wenn du von ihm sprachst
  rationale: Die Wendung bedeutet, über bzw. von jemandem zu sprechen. „Von ihm sprachst“ wahrt den Grundsinn, ohne ausdrücklich feindseliges Reden einzutragen.
- source_word: תִּתְנוֹדָד
  choice: den Kopf schütteltest
  rationale: Das Verb bezeichnet eine schüttelnde oder schwankende Bewegung. Im Kontext des Spotts ist eine verächtliche Gebärde gemeint; „den Kopf schütteln“ ist dafür im modernen Deutschen idiomatisch, wobei das Körperteil im Hebräischen nicht ausdrücklich genannt wird.
