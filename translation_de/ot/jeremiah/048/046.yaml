id: JER.48.46
reference: Jeremiah 48:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖ד עַם כְּמ֑וֹשׁ כִּֽי לֻקְּח֤וּ בָנֶ֨י/ךָ֙ בַּ/שֶּׁ֔בִי וּ/בְנֹתֶ֖י/ךָ בַּ/שִּׁבְיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/046.yaml
  text: Woe to you[a], Moab! The people of Chemosh have perished, for your sons have been taken captive, and your daughters into captivity.
translation:
  language: de
  text: Wehe dir, Moab! Das Volk des Kemosch ist zugrunde gegangen; denn deine Söhne wurden als Gefangene fortgeführt und deine Töchter in die Gefangenschaft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹי לְךָ מוֹאָב
  choice: Wehe dir, Moab!
  rationale: אוֹי ist hier ein prophetischer Klage- und Gerichtsruf; „Wehe dir“ bewahrt seine herkömmliche Kraft. לְךָ bezeichnet den Adressaten der Klage.
- source_word: אָבַד
  choice: ist zugrunde gegangen
  rationale: Das Verb bezeichnet Untergang oder Vernichtung. Die Formulierung wahrt das Perfekt und legt keine ausdrücklich genannte handelnde Macht fest.
- source_word: עַם כְּמוֹשׁ
  choice: das Volk des Kemosch
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet Moab als das Kemosch zugeordnete Volk, ohne die Art dieser Beziehung näher auszudeuten.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt hier die Begründung für den Weheruf und die Aussage vom Untergang an.
- source_word: לֻקְּחוּ בָנֶיךָ בַּשֶּׁבִי
  choice: deine Söhne wurden als Gefangene fortgeführt
  rationale: „Wurden ... fortgeführt“ gibt das Passiv von לקח im Zusammenhang mit Gefangenschaft natürlich wieder; „als Gefangene“ entspricht בַּשֶּׁבִי und vermeidet die unidiomatische Wendung „in Gefangenschaft genommen“ im Kontext einer Deportation.
- source_word: וּבְנֹתֶיךָ בַּשִּׁבְיָה
  choice: und deine Töchter in die Gefangenschaft
  rationale: Die elliptische Parallelzeile übernimmt das Verb aus der ersten Hälfte. „Gefangenschaft“ gibt den nah verwandten zweiten hebräischen Ausdruck wieder, ohne einen sachlich möglicherweise zu engen Unterschied als „Exil“ festzuschreiben.
theological_decisions:
- issue: Beziehung Moabs zu Kemosch
  choice: das Volk des Kemosch
  alternative: Kemoschs Volk
  rationale: Die Genitivform bildet die hebräische Zuordnungsbeziehung nüchtern ab und bewahrt die polemisch-theologische Spannung, ohne die Existenz oder Macht Kemoschs zu kommentieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Die Parallelität von Söhnen und Töchtern sowie der Wechsel zwischen zwei nah verwandten hebräischen Gefangenschaftsbegriffen bleiben erkennbar; die deutsche Formulierung ergänzt im zweiten Glied das elliptisch ausgelassene Verb nicht ausdrücklich.
