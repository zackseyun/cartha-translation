source:
  edition: WLC
  text: תְּנוּ צִ֣יץ לְ/מוֹאָ֔ב כִּ֥י נָצֹ֖א תֵּצֵ֑א וְ/עָרֶ֨י/הָ֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ינָה מֵ/אֵ֥ין יוֹשֵׁ֖ב בָּ/הֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
translation:
  language: de
  text: Gebt Moab Flügel[a], denn es wird ganz gewiss fortziehen[b]. Seine Städte werden zur Einöde werden, und niemand wird darin wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebt Moab eine Blüte/einen Schmuck.“ Das hebräische Wort צִיץ bezeichnet sonst meist eine Blüte oder einen Schmuck und steht hier im Singular. Im unmittelbaren Zusammenhang legt das anschließende Fortziehen jedoch das Bild von Flügeln nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Fortziehen wird es fortziehen“; die hebräische Wiederholungsform verstärkt die Gewissheit der Aussage. Im Zusammenhang mit den Flügeln kann zugleich ein Davonfliegen anklingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Gebt
  rationale: Der pluralische Imperativ von נתן wird direkt und im prophetischen Aufruf natürlich mit „Gebt“ wiedergegeben.
- source_word: צִיץ
  choice: Flügel
  rationale: Das sonst meist mit „Blüte“ oder einem Schmuckstück verbundene Substantiv ist hier schwierig. Im Zusammenhang mit Moabs unmittelbar bevorstehendem Fortziehen liegt ein Bild des Davonfliegens nahe; das idiomatische deutsche „Flügel“ gibt dieses Bild wieder, während die Fußnote die echte lexikalische Unsicherheit festhält.
- source_word: לְמוֹאָב
  choice: Moab
  rationale: Die mit ל markierte Empfängerangabe lässt sich im Deutschen nach „Gebt“ ohne Präposition ausdrücken.
- source_word: כִּי
  choice: denn
  rationale: Leitet die Begründung für die vorangehende Aufforderung ein und passt zum gehobenen prophetischen Stil.
- source_word: נָצֹא תֵּצֵא
  choice: es wird ganz gewiss fortziehen
  rationale: Der Infinitivus absolutus mit der finiten Form von יצא verstärkt die Aussage. „Fortziehen“ wahrt die Grundbedeutung des Weggehens, ohne das durch „Flügel“ nahegelegte Fliegen als allein mögliche Bedeutung festzuschreiben.
- source_word: וְעָרֶיהָ
  choice: Seine Städte
  rationale: Das feminine Suffix bezieht sich auf Moab; da „Moab“ im Deutschen sächlich gebraucht wird, ist „seine“ grammatisch natürlich.
- source_word: לְשַׁמָּה תִהְיֶינָה
  choice: werden zur Einöde werden
  rationale: Die resultative Konstruktion bezeichnet die völlige Verwüstung der Städte. „Einöde“ ist verständlich, würdevoll und bewahrt den Ton des Gerichts.
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
  choice: niemand wird darin wohnen
  rationale: Gibt die hebräische Wendung für vollständige Entvölkerung klar und natürlich wieder.
