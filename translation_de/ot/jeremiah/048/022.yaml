  text: and against Dibon[a], and against Nebo, and against Beth-diblathaim—
translation:
  language: de
  text: und über Dibon, und über Nebo und über Bet-Diblatajim —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  choice: und über / über
  rationale: Das wiederholte עַל führt die Aufzählung der Orte fort, über die das Gericht ergeht. Im Deutschen ist „über“ in diesem elliptischen Zusammenhang natürlich und lässt die Verbindung zum vorausgehenden Satz offen, ohne ein Verb zu ergänzen.
- source_word: דִּיבוֹן
  choice: Dibon
  rationale: Der Ortsname wird nach geläufiger deutscher Form transkribiert.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Hier bezeichnet das Wort einen Ort und wird daher als Eigenname transkribiert, nicht gedeutet oder übersetzt.
- source_word: בֵּית דִּבְלָתַיִם
  choice: Bet-Diblatajim
  rationale: Der zusammengesetzte Ortsname wird transkribiert. „Bet“ gibt בֵּית als Bestandteil des Eigennamens wieder; „-ajim“ bewahrt die hörbare hebräische Dualendung.
theological_decisions: []
translation_notes:
  register: Knappe, würdige Aufzählung in modernem Standarddeutsch. Die dreifache Präpositionalfügung des Hebräischen bleibt erkennbar; beim zweiten Glied wird das bloße „über“ ohne zusätzliches „und“ entsprechend dem hebräischen Satzbau beibehalten. Der Gedankenstrich zeigt, dass die Liste im Kontext syntaktisch weitergeführt beziehungsweise abgeschlossen wird.
