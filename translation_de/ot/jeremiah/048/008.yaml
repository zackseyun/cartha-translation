  text: וְ/יָבֹ֨א שֹׁדֵ֜ד אֶל כָּל עִ֗יר וְ/עִיר֙ לֹ֣א תִמָּלֵ֔ט וְ/אָבַ֥ד הָ/עֵ֖מֶק וְ/נִשְׁמַ֣ד הַ/מִּישֹׁ֑ר אֲשֶׁ֖ר אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
translation:
  language: de
  text: Der Verwüster wird gegen jede Stadt ziehen, und keine Stadt wird entkommen. Das Tal wird zugrunde gehen, und die Hochebene[a] wird vernichtet werden, wie Jahwe gesagt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ebene“ oder „das Tafelland“. Das hebräische Wort bezeichnet ebenes Land und kann sich in Moab auf die erhöhte Tafellandregion beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  choice: der Verwüster
  rationale: Das substantivierte Partizip bezeichnet jemanden, der plündert und verheert. „Verwüster“ ist im Deutschen prägnant und passt zum Gerichtskontext.
- source_word: וְיָבֹא אֶל כָּל עִיר
  choice: wird über jede Stadt kommen
  rationale: Der Imperfekt hat im prophetischen Zusammenhang zukünftige Bedeutung. „Über … kommen“ gibt die feindliche Bewegung von אֶל idiomatisch wieder.
- source_word: וְעִיר לֹא תִמָּלֵט
  choice: und keine Stadt wird entkommen
  rationale: Der Singular setzt die vorausgehende Gesamtaussage distributiv fort; „keine Stadt“ drückt die ausnahmslose Bedrohung natürlich aus.
- source_word: הָעֵמֶק
  choice: das Tal
  rationale: עֵמֶק bezeichnet gewöhnlich ein Tal beziehungsweise eine Talregion; der bestimmte Artikel bleibt erhalten.
- source_word: וְאָבַד
  choice: wird zugrunde gehen
  rationale: אבד bezeichnet hier den Untergang der Region. „Zugrunde gehen“ ist verständlich und bewahrt die aktive Verbform.
- source_word: הַמִּישֹׁר
  choice: die Hochebene
  rationale: מִישׁוֹר bedeutet ebenes Land und kann in Moab besonders das erhöhte Tafelland bezeichnen. „Hochebene“ verdeutlicht den geografischen Gegensatz zum Tal, ohne die Grundbedeutung zu verdecken.
- source_word: וְנִשְׁמַד
  choice: vernichtet werden
  rationale: Der Nifal von שׁמד bezeichnet das Vernichtetwerden; die passive Form des Hebräischen wird beibehalten.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: wie Jahwe gesagt hat
  rationale: Die Wendung führt das angekündigte Geschehen auf Jahwes verbindliches Wort zurück und gibt den Relativsatz natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Eigenname wird in seiner im Deutschen geläufigen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Zukunftsaussagen und der geografische Gegensatz zwischen Tal und Hochebene bleiben klar erkennbar.
