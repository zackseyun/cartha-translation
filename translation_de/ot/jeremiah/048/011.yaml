  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
translation:
  language: de
  text: Moab ist von seiner Jugend an sorglos und ruht ruhig auf seinem Bodensatz[a]. Er ist nicht von einem Gefäß in ein anderes umgegossen worden und ist nicht in die Verbannung gegangen. Darum blieb sein Geschmack unverändert, und sein Duft hat sich nicht verändert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische verwendet ein Bild aus der Weinbereitung: Wein, der lange auf seinem Bodensatz ruht und nicht umgegossen wird, behält Geschmack und Duft.'
    reason: Das durch den ganzen Vers laufende Weinbild und die Bedeutung des Bodensatzes werden für heutige Leserinnen und Leser erläutert.
lexical_decisions:
- source_word: שַׁאֲנַן
  choice: lebte … ungestört
  rationale: Die Form bezeichnet eine dauerhaft sorglose, sichere Lage. »Lebte ungestört« gibt Moabs lang anhaltende Verschonung natürlich wieder und leitet zugleich zum Bild des ruhenden Weins über.
- source_word: מִנְּעוּרָיו
  choice: von seiner Jugend an
  rationale: Die zeitliche Wendung bleibt eng am Hebräischen und bewahrt die Personifikation Moabs.
- source_word: שֹׁקֵט הוּא אֶל שְׁמָרָיו
  choice: ruhte auf seinem Bodensatz
  rationale: Die Formulierung erhält das Bild von Wein, der ungestört auf seinem Satz lagert. »Bodensatz« ist im heutigen Deutsch verständlicher als das fachsprachliche »Weinhefe«.
- source_word: הוּרַק מִכְּלִי אֶל כֶּלִי
  choice: wurde nicht von einem Gefäß ins andere umgegossen
  rationale: Das Passiv und der konkrete Vorgang des Umfüllens werden gewahrt; »umgegossen« ist verständlich, ohne das technischere »dekantiert« zu verwenden.
- source_word: וּבַגּוֹלָה לֹא הָלָךְ
  choice: musste nicht in die Verbannung ziehen
  rationale: »Verbannung« gibt die Deportation ins Exil wieder. »Musste nicht … ziehen« formuliert die hebräische Bewegungsaussage natürlich und macht die erzwungene Lage deutlich, ohne sie auszudeuten.
- source_word: עָמַד טַעְמוֹ בּוֹ
  choice: blieb sein Geschmack in ihm
  rationale: Die ungewöhnliche Innenbeziehung des hebräischen Bildes bleibt erhalten; der Geschmack des nicht umgegossenen Weins ist unverändert geblieben.
- source_word: וְרֵיחוֹ לֹא נָמָר
  choice: sein Duft veränderte sich nicht
  rationale: »Duft« passt zum Weinbild, ohne die positive Wertung von »Aroma« zwingend einzutragen; das Verb wird klar als Veränderung wiedergegeben.
theological_decisions:
- issue: Personifikation Moabs im maskulinen Singular
  choice: Die maskulinen Bezüge werden in »seiner Jugend«, »seinem Bodensatz«, »sein Geschmack« und »sein Duft« beibehalten.
  alternative: Moab durchgehend sachlich oder als Bevölkerung im Plural wiedergeben.
  rationale: Der hebräische Text gestaltet Moab konsequent als maskuline Einzelfigur. Diese literarische Personifikation soll nicht eingeebnet werden.
- issue: Spannung zwischen äußerer Ruhe und prophetischer Kritik
  choice: »ungestört« und »ruhte« beschreiben zunächst Moabs Zustand, ohne ausdrücklich »selbstzufrieden« oder »überheblich« zu sagen.
  alternative: Mit »selbstzufrieden« die implizite Kritik explizit machen.
  rationale: Der Kontext kann den Zustand kritisch bewerten, doch der Vers selbst entfaltet diese Kritik vor allem durch das Weinbild. Die Übersetzung bewahrt diese indirekte Wirkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Weinbild bleibt konkret und durchgehend erhalten. Die Satzstruktur ist gegenüber dem Hebräischen leicht geglättet, ohne die Bildfolge oder die Personifikation Moabs aufzulösen.
