  text: קָר֥וֹב אֵיד מוֹאָ֖ב לָ/ב֑וֹא וְ/רָ֣עָת֔/וֹ מִהֲרָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/016.yaml
  text: The disaster of Moab is near to come[b][a], and his calamity is hurrying very quickly.
translation:
  language: de
  text: Moabs Verderben steht kurz bevor, und sein Unheil naht sehr schnell.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרוֹב
  choice: steht kurz bevor
  rationale: Das prädikative Adjektiv bezeichnet die zeitliche Nähe. Zusammen mit לָבוֹא gibt „steht kurz bevor“ die unmittelbar bevorstehende Ankunft in natürlichem Deutsch wieder.
- source_word: אֵיד
  choice: Verderben
  rationale: Das Wort bezeichnet vernichtendes Unglück beziehungsweise Untergang. „Verderben“ passt zum würdevollen Ton prophetischer Gerichtsankündigung.
- source_word: מוֹאָב
  choice: Moab
  rationale: Übliche deutsche Wiedergabe des Namens für Land und Volk.
- source_word: לָבוֹא
  choice: bevor
  rationale: Der Infinitiv mit ל bezeichnet hier das bevorstehende Eintreten des Verderbens und ist in der Wendung „steht kurz bevor“ idiomatisch enthalten.
- source_word: רָעָתוֹ
  choice: sein Unheil
  rationale: רָעָה bezeichnet im Zusammenhang nicht moralische Bosheit, sondern das über Moab kommende Unglück. Das Possessivpronomen bewahrt den maskulinen Singularsuffix und die Personifizierung Moabs.
- source_word: מִהֲרָה
  choice: eilt … herbei
  rationale: Die verbale Wendung drückt beschleunigte Bewegung aus. „Eilt herbei“ erhält dieses anschauliche Bild in natürlichem, gegenwärtigem Deutsch.
- source_word: מְאֹד
  choice: sehr schnell
  rationale: Der Intensivierer verstärkt die Eile; „sehr schnell“ gibt die emphatische Aussage klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallelen Begriffe „Verderben“ und „Unheil“ sowie die personifizierende Bewegung des herbeieilenden Unheils bleiben erhalten.
