id: JER.48.1
reference: Jeremiah 48:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
translation:
  language: de
  text: 'Über Moab[a]: So spricht Jahwe der Heerscharen, der Gott Israels: Wehe über Nebo, denn es ist verwüstet! Kirjatajim ist zuschanden geworden und eingenommen. Die Festung[b] ist zuschanden geworden und erschüttert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Gegen Moab.'
    reason: alternative_reading
  - marker: b
    text: 'Oder als Ortsname: Misgab.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְמוֹאָב
  choice: Über Moab
  rationale: Das präfigierte לְ leitet hier die Überschrift eines prophetischen Ausspruchs ein. „Über“ gibt den weiten Bezugssinn wieder, ohne die Präposition allein schon ausdrücklich adversativ zu deuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, zugleich verständliche Wiedergabe bewahrt die Form des hebräischen Gottesprädikats und lässt offen, ob himmlische oder irdische Heere im Vordergrund stehen.
- source_word: הוֹי אֶל נְבוֹ
  choice: Wehe über Nebo
  rationale: הוֹי verbindet Klage und Gerichtsankündigung; „Wehe über“ gibt zusammen mit אֶל diese prophetische Ausrufform natürlich wieder.
- source_word: כִּי שֻׁדָּדָה
  choice: denn es ist verwüstet
  rationale: Das Passiv von שׁדד bezeichnet gewaltsame Verheerung, ohne festzulegen, ob ausschließlich Plünderung oder vollständige Zerstörung gemeint ist.
- source_word: הֹבִישָׁה
  choice: ist zuschanden geworden
  rationale: Die Form bezeichnet hier das Geraten in Schande beziehungsweise die erfahrene Entehrung, nicht bloß ein inneres Schamgefühl.
- source_word: נִלְכְּדָה
  choice: eingenommen
  rationale: Im militärischen Zusammenhang bezeichnet das Nifal von לכד die Einnahme einer Stadt.
- source_word: קִרְיָתָיִם
  choice: Kirjatajim
  rationale: Der Ortsname wird in einer im Deutschen lesbaren, quellenahen Form transkribiert.
- source_word: הַמִּשְׂגָּב
  choice: die Festung
  rationale: Der Artikel und die gewöhnliche Bedeutung des Substantivs sprechen für eine Gattungsbezeichnung. Die mögliche Deutung als Ortsname wird in einer Fußnote bewahrt.
- source_word: וָחָתָּה
  choice: und erschüttert
  rationale: חתת kann ein Zerbrechen, Erschüttertwerden oder Bestürztsein bezeichnen. „Erschüttert“ passt zur Festung und bewahrt etwas von dieser Bedeutungsbreite.
theological_decisions:
- issue: Deutung von לְ in der Überschrift des Gerichtswortes
  choice: Über Moab
  alternative: Gegen Moab
  rationale: Der Zusammenhang ist eindeutig ein Gerichtswort, doch לְ selbst ist weiter als eine ausdrücklich adversative Präposition. Die Hauptlesart wahrt diese Offenheit; die alternative Deutung steht in der Fußnote.
- issue: Gattungsbezeichnung oder Ortsname bei הַמִּשְׂגָּב
  choice: die Festung
  alternative: Misgab als Ortsname
  rationale: Artikel und Wortbedeutung stützen die Gattungsbezeichnung, doch die überlieferte Deutung als möglicher Ortsname bleibt textlich möglich und wird daher ausgewiesen.
- issue: Bedeutungsbreite von חתת
  choice: erschüttert
  alternative: zerschmettert oder bestürzt
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen konkretem Zusammenbruch und einem Zustand der Bestürzung, ohne eine der Nuancen unnötig auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. Die Ortsnamen werden deutsch lesbar transkribiert; die wiederholte Schandformel des Hebräischen bleibt erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils betroffenen Ausdrücken.
