source:
  edition: WLC
  text: רְדִ֤י מִ/כָּבוֹד֙ ישבי בַ/צָּמָ֔א יֹשֶׁ֖בֶת בַּת דִּיב֑וֹן כִּֽי שֹׁדֵ֤ד מוֹאָב֙ עָ֣לָה בָ֔/ךְ שִׁחֵ֖ת מִבְצָרָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/018.yaml
  text: Come down from your glory and sit in thirst[a], O inhabitant, daughter of Dibon, for the destroyer of Moab has come up against you[b]; he has destroyed your fortresses.
translation:
  language: de
  text: Steig herab von deiner Herrlichkeit und sitze im Durst[a], du Bewohnerin, Tochter Dibons[b]! Denn der Verwüster Moabs ist gegen dich heraufgezogen; er hat deine Festungen zerstört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „setze dich an einen ausgedörrten Ort“ bzw. „wohne in dürrem Land“. Der hebräische Ausdruck kann sowohl Durst als auch den trockenen Zustand oder Ort bezeichnen, in den Dibon gerät.'
    reason: lexical_alternative
  - marker: b
    text: „Tochter Dibons“ ist eine in prophetischen Texten übliche Personifizierung der Stadt und ihrer Bevölkerung als Frau.
    reason: cultural_note
lexical_decisions:
- source_word: רְדִי
  choice: Steig herab
  rationale: Der feminine Singularimperativ von ירד richtet sich an die personifizierte Stadt. „Steig herab“ bewahrt sowohl die Bewegung nach unten als auch den feierlich-prophetischen Ton.
- source_word: מִכָּבוֹד
  choice: von deiner Herrlichkeit
  rationale: כָּבוֹד kann Herrlichkeit, Ehre oder Pracht bezeichnen. Der Possessivbezug ergibt sich im Deutschen natürlich aus der direkten Anrede und bezeichnet Dibons bisherige hohe Stellung.
- source_word: ישבי ... יֹשֶׁבֶת בַּת דִּיבוֹן
  choice: du Bewohnerin, Tochter Dibons
  rationale: Die feminine Anrede und die Bezeichnung „Tochter Dibons“ personifizieren Stadt und Bevölkerung als Frau. „Bewohnerin“ erhält den im hebräischen Text vorhandenen Wohn-/Sitzbezug, ohne die Konstruktion unnötig zu glätten.
- source_word: בַצָּמָא
  choice: im Durst
  rationale: צָמָא kann Durst oder Trockenheit bezeichnen. Die knappe Wiedergabe bewahrt die Mehrdeutigkeit zwischen erlittener Entbehrung und einem ausgedörrten Aufenthaltsort; die Alternative wird in einer Fußnote genannt.
- source_word: שֹׁדֵד מוֹאָב
  choice: der Verwüster Moabs
  rationale: שֹׁדֵד bezeichnet einen Plünderer oder Verwüster. „Verwüster“ passt zum militärischen Zusammenhang und lässt offen, wer konkret gemeint ist.
- source_word: עָלָה בָךְ
  choice: ist gegen dich heraufgezogen
  rationale: עלה mit ב beschreibt hier das militärische Heranziehen gegen die Stadt. „Heraufgezogen“ bewahrt das Richtungsbild des Hebräischen.
- source_word: שִׁחֵת
  choice: hat ... zerstört
  rationale: Das Verb kann verderben, zugrunde richten oder zerstören bedeuten. Bei Festungen ist „zerstört“ eine klare, kontextgerechte Wiedergabe.
- source_word: מִבְצָרָיִךְ
  choice: deine Festungen
  rationale: מִבְצָר bezeichnet befestigte Orte oder Bollwerke. „Festungen“ ist im Deutschen verständlich und entspricht dem militärischen Kontext.
theological_decisions:
- issue: Identität des Verwüsters
  choice: Der Verwüster wird nicht näher bestimmt.
  alternative: Eine bestimmte Macht oder einen bestimmten Herrscher ausdrücklich benennen.
  rationale: Der Vers selbst nennt nur „den Verwüster Moabs“. Eine genauere Identifizierung würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Imperativ. Die ungewöhnliche Bildsprache „im Durst sitzen“ bleibt bewusst erhalten und wird durch eine Fußnote erläutert. Die feminine Anrede macht die Personifizierung Dibons sichtbar.
