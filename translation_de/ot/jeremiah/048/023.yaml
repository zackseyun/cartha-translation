base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/023.yaml
  text: and against Kiriathaim[a], and against Beth-gamul, and against Beth-meon—
translation:
  language: de
  text: und gegen Kirjatajim[a], und gegen Bet-Gamul und gegen Bet-Meon —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht vor jedem der drei Ortsnamen erneut »und gegen«. Diese Wiederholung prägt den Rhythmus des Gerichtswortes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: und gegen
  rationale: Die Präposition עַל bezeichnet im Zusammenhang des Gerichtswortes die feindliche Ausrichtung gegen die genannten Städte. Ihre dreifache Wiederholung wird im Deutschen beibehalten, soweit sie im hebräischen Text steht.
- source_word: קִרְיָתַיִם
  choice: Kirjatajim
  rationale: Der Ortsname wird nach im Deutschen geläufigen bibelsprachlichen Umschriftkonventionen wiedergegeben und nicht übersetzt.
- source_word: בֵּית גָּמוּל
  choice: Bet-Gamul
  rationale: Der zusammengesetzte Ortsname wird transliteriert; der Bindestrich macht seine Einheit und Struktur lesbar.
- source_word: בֵּית מְעוֹן
  choice: Bet-Meon
  rationale: Auch dieser Ortsname wird als Eigenname transliteriert und mit Bindestrich geschrieben.
theological_decisions: []
translation_notes:
