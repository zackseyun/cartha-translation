  text: אֵ֥יךְ חַ֨תָּה֙ הֵילִ֔ילוּ אֵ֛יךְ הִפְנָה עֹ֥רֶף מוֹאָ֖ב בּ֑וֹשׁ וְ/הָיָ֥ה מוֹאָ֛ב לִ/שְׂחֹ֥ק וְ/לִ/מְחִתָּ֖ה לְ/כָל סְבִיבָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
translation:
  language: de
  text: Wie ist sie zerschmettert! Heult! Wie hat Moab in Schande den Rücken gewandt![a] So ist Moab für alle ringsum zum Gespött und zum Entsetzen[b] geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hat den Nacken beziehungsweise Rücken gewandt“; die hebräische Wendung bezeichnet ein beschämtes Abwenden oder Zurückweichen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Schrecken“ beziehungsweise „zu einem Gegenstand des Entsetzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie
  rationale: Leitet jeweils einen klagenden Ausruf ein und bewahrt die poetische Eindringlichkeit.
- source_word: חַתָּה
  choice: ist es zerschmettert
  rationale: חתת bezeichnet hier den völligen Zusammenbruch Moabs; „zerschmettert“ gibt die starke Bildsprache wieder, ohne sie auf bloße innere Bestürzung zu verengen.
- source_word: הֵילִילוּ
  choice: Heult!
  rationale: Der pluralische Imperativ ruft laut und eindringlich zur Toten- beziehungsweise Klage an; „Heult!“ entspricht dieser Stärke.
- source_word: הִפְנָה עֹרֶף
  choice: hat … den Rücken gekehrt
  rationale: Bewahrt das verständliche hebräische Bild des Sichabwendens beziehungsweise des schmachvollen Rückzugs.
- source_word: מוֹאָב
  choice: Moab
  rationale: Der Eigenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: בּוֹשׁ
  choice: beschämt
  rationale: Gibt den Zustand der Schande beim Rückzug knapp und adverbial wieder.
- source_word: וְהָיָה
  choice: So ist … geworden
  rationale: Beschreibt den aus dem Gericht hervorgegangenen, im Klagelied anschaulich als eingetreten dargestellten Zustand.
- source_word: לִשְׂחֹק
  choice: zum Gespött
  rationale: Bezeichnet Moab als Gegenstand des Spottes; „zum Gespött“ ist idiomatisch und würdevoll.
- source_word: לִמְחִתָּה
  choice: zum Entsetzen
  rationale: Das Substantiv kann Schrecken, Verderben oder einen Gegenstand des Entsetzens bezeichnen. „Zum Entsetzen“ wahrt die Reaktion der Umstehenden und die lexikalische Spannweite.
- source_word: לְכָל סְבִיבָיו
  choice: für alle ringsum
  rationale: Gibt die räumlich weit gefasste Wendung wieder, ohne sie unnötig auf politische Nachbarn einzuengen.
