  register: Modernes, gehobenes Standarddeutsch mit kurzen, kräftigen Klagerufen. Das Neutrum „es“ bezieht sich auf Moab; dadurch wird keine im Hebräischen nicht ausdrücklich markierte weibliche Personifikation eingeführt. Die Wiederholung von „Moab“ und die poetische Ausrufstruktur bleiben erhalten.
