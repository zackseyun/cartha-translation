base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
translation:
  language: de
  text: Kerijot ist eingenommen worden[a], und die Festungen sind erobert worden. An jenem Tag wird das Herz der Krieger Moabs sein wie das Herz einer Frau in den Wehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „Die Städte sind eingenommen worden“, wenn הַקְּרִיּוֹת nicht als Ortsname Kerijot, sondern als Gattungsbezeichnung verstanden wird.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  choice: Kerijot
  rationale: Im Zusammenhang des Moab-Orakels ist die Form am ehesten als Name der moabitischen Stadt Kerijot zu verstehen; die mögliche appellativische Lesart „die Städte“ bleibt in der Fußnote erhalten.
- source_word: נִלְכְּדָה
  choice: ist eingenommen
  rationale: Das Nifal von לכד bezeichnet passiv das Eingenommen- oder Gefangenwerden. Das deutsche Perfekt gibt die prophetisch als vollzogen dargestellte Eroberung natürlich wieder.
- source_word: הַמְּצָדוֹת
  choice: die Festungen
  rationale: Das Substantiv bezeichnet befestigte Orte beziehungsweise militärische Stützpunkte; „Festungen“ ist im Deutschen präzise und geläufig.
- source_word: נִתְפָּשָׂה
  choice: sind erobert
  rationale: Die passive Form von תפשׂ bedeutet „ergriffen/eingenommen werden“. „Erobert“ passt zum militärischen Zusammenhang und vermeidet eine unbeholfene Wiederholung.
- source_word: לֵב
  choice: das Herz
  rationale: „Herz“ bewahrt das hebräische Bild für den inneren Zustand, besonders Mut, Fassung und Entschlossenheit.
- source_word: גִּבּוֹרֵי מוֹאָב
  choice: die Krieger Moabs
  rationale: Im militärischen Kontext bezeichnet גִּבּוֹרֵי kampfstarke Männer beziehungsweise Krieger; die gewählte Formulierung ist modern und würdevoll.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Die Formulierung gibt die prophetische Zeitangabe idiomatisch und zugleich gehoben wieder.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  choice: wie das Herz einer Frau in den Wehen
  rationale: Die Wendung bezeichnet eine gebärende Frau beziehungsweise eine Frau in Geburtswehen. Die Übersetzung bewahrt das konkrete Bild großer Angst und Bedrängnis.
