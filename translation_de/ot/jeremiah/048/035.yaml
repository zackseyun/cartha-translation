  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֥י לְ/מוֹאָ֖ב נְאֻם יְהוָ֑ה מַעֲלֶ֣ה בָמָ֔ה וּ/מַקְטִ֖יר לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
translation:
  language: de
  text: Ich werde in Moab – Ausspruch Jahwes – dem ein Ende machen, der zur Kulthöhe hinaufsteigt und seinem Gott Räucheropfer darbringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde den Höhenkult in Moab aufhören lassen …“ Im Hebräischen stehen substantivisch gebrauchte Partizipien im Singular („der hinaufsteigt … und darbringt“); sie können die Kultteilnehmer allgemein vertreten. Das mit „Räucheropfer darbringt“ übersetzte Verb kann auch allgemeiner bedeuten, Opfer in Rauch aufgehen zu lassen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Ich werde … dem ein Ende machen
  rationale: Der Hifil von שׁבת bezeichnet hier das Veranlassen eines Aufhörens. Die deutsche Wendung gibt die kausative Aussage natürlich wieder und lässt offen, ob vor allem die Kultausübenden oder durch sie die Kultpraxis gemeint sind.
- source_word: לְמוֹאָב
  choice: in Moab
  rationale: Die Präposition ל bezeichnet hier am plausibelsten den Bereich, in dem Jahwe dieses kultische Handeln beendet.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Botenformel. „Ausspruch“ wahrt ihre nominale Gestalt; „Jahwe“ gibt den Gottesnamen in der im Deutschen geläufigen Form wieder.
- source_word: מַעֲלֶה בָמָה
  choice: der zur Kulthöhe hinaufsteigt
  rationale: מַעֲלֶה ist ein substantivisch gebrauchtes Partizip von עלה, „hinaufsteigen“. בָמָה bezeichnet hier eine kultische Höhenstätte; „Kulthöhe“ macht diese Bedeutung für heutige Leser deutlich.
- source_word: וּמַקְטִיר
  choice: und … Räucheropfer darbringt
  rationale: Der Hifil von קטר bezeichnet im Kult das Erzeugen von Opferrauch, häufig durch Räucherwerk. „Räucheropfer darbringt“ ist knapp und verständlich, ohne den Vorgang völlig zu verallgemeinern.
- source_word: לֵאלֹהָיו
  choice: seinem Gott
  rationale: אֱלֹהִים kann formal pluralisch sein, ist hier mit dem Suffix der dritten Person Singular jedoch am natürlichsten auf die jeweilige Gottheit des moabitischen Verehrers bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Die im modernen Deutschen übliche Form „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Was in Moab aufhören soll
  choice: der zur Kulthöhe hinaufsteigt und … Räucheropfer darbringt
  alternative: der Kult auf den Höhen allgemein
  rationale: Der hebräische Text verwendet zwei maskuline Partizipien im Singular und bezeichnet seinem Wortlaut nach einen repräsentativen Kultteilnehmer. Die Fußnote weist darauf hin, dass damit zugleich die gesamte Kultpraxis gemeint sein kann.
- issue: Bedeutungsumfang von מקטיר
  choice: Räucheropfer darbringt
  alternative: Opfer in Rauch aufgehen lässt
  rationale: Das Verb kann kultischen Rauch sowohl von Räucherwerk als auch allgemeiner von Opfergaben bezeichnen. Die Hauptfassung folgt der häufigen Bedeutung, ohne die breitere Möglichkeit dogmatisch auszuschließen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Gedankenstriche heben die prophetische Formel ab. „Kulthöhe“ vermeidet das im Deutschen missverständliche bloße „Höhe“ und benennt die kultische Stätte, ohne sie vorschnell als Tempel oder Heiligtum zu konkretisieren.
