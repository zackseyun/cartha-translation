  register: Moderne, würdevolle poetische Standardsprache. Die kurzen Sätze erhalten den Rhythmus des Gerichtswortes; ungewöhnliche Körper- und RaumMetaphern werden nicht eingeebnet. Die Schreibweisen „Heschbon“ und „Sihon“ folgen gängigen deutschen Bibelnamen.
