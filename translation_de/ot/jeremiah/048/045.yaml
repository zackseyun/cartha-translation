source:
  edition: WLC
  text: בְּ/צֵ֥ל חֶשְׁבּ֛וֹן עָמְד֖וּ מִ/כֹּ֣חַ נָסִ֑ים כִּֽי אֵ֞שׁ יָצָ֣א מֵ/חֶשְׁבּ֗וֹן וְ/לֶֽהָבָה֙ מִ/בֵּ֣ין סִיח֔וֹן וַ/תֹּ֨אכַל֙ פְּאַ֣ת מוֹאָ֔ב וְ/קָדְקֹ֖ד בְּנֵ֥י שָׁאֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
translation:
  language: de
  text: Im Schatten Heschbons stehen die Flüchtenden kraftlos[a]. Denn aus Heschbon ist Feuer ausgegangen und eine Flamme aus Sihons Mitte[b]. Sie hat den Rand Moabs[c] verzehrt und den Scheitel der Söhne des Getümmels[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „standen die Flüchtenden aus Mangel an Kraft“. Das hebräische Perfekt kann hier auch als Vergangenheit wiedergegeben werden; מִכֹּחַ kann „aus Mangel an Kraft“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „aus der Mitte Sihons“; auch: „von zwischen Sihon“. „Sihon“ kann hier stellvertretend für die mit ihm verbundene Stadt oder sein Herrschaftsgebiet stehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die Ecke Moabs“. Das hebräische Wort bezeichnet eine Ecke, Seite oder äußerste Begrenzung.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „den Scheitel der Lärmenden“ beziehungsweise „der Söhne des Aufruhrs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵל חֶשְׁבּוֹן
  choice: Im Schatten Heschbons
  rationale: Bewahrt das konkrete Bild von צֵל und gibt die Ortsangabe mit natürlichem deutschem Genitiv wieder.
- source_word: עָמְדוּ מִכֹּחַ נָסִים
  choice: stehen die Flüchtenden kraftlos
  rationale: נָסִים bezeichnet Menschen auf der Flucht. Die knappe Wiedergabe „kraftlos“ entspricht dem kontextuellen Sinn von מִכֹּחַ; das Präsens erhält die lebhafte prophetische Darstellung.
- source_word: כִּי
  choice: Denn
  rationale: Kennzeichnet den folgenden Satz als Begründung für die Kraftlosigkeit der Flüchtenden.
- source_word: אֵשׁ יָצָא מֵחֶשְׁבּוֹן
  choice: von Heschbon ist Feuer ausgegangen
  rationale: Gibt das Bild und die Bewegungsrichtung von יצא eng wieder; das Perfekt klingt in modernem Deutsch natürlich.
- source_word: וְלֶהָבָה מִבֵּין סִיחוֹן
  choice: eine Flamme mitten aus Sihon
  rationale: „Mitten aus“ bewahrt den räumlichen Ausdruck מִבֵּין, ohne die mögliche metonymische Bedeutung von Sihon ausdrücklich festzulegen.
- source_word: וַתֹּאכַל
  choice: Sie hat ... verzehrt
  rationale: Das feminine Pronomen bezieht sich natürlich auf „Flamme“; „verzehrt“ ist ein idiomatisches Verb für zerstörendes Feuer.
- source_word: פְּאַת מוֹאָב
  choice: den Rand Moabs
  rationale: פֵּאָה kann Ecke, Seite oder äußersten Rand bezeichnen. „Rand“ ist im Deutschen verständlich und erhält das poetische Bild einer Extremität.
- source_word: וְקָדְקֹד בְּנֵי שָׁאוֹן
  choice: und den Scheitel der Söhne des Getümmels
  rationale: „Scheitel“ gibt קָדְקֹד prägnant wieder. Die ungewöhnliche Wendung „Söhne des Getümmels“ bewahrt die poetische Mehrdeutigkeit von בְּנֵי שָׁאוֹן.
