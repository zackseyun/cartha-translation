id: JER.48.20
reference: Jeremiah 48:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֹבִ֥ישׁ מוֹאָ֛ב כִּֽי חַ֖תָּה הילילי ו/זעקי הַגִּ֣ידוּ בְ/אַרְנ֔וֹן כִּ֥י שֻׁדַּ֖ד מוֹאָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/020.yaml
  text: 'Moab is put to shame[a], for she is shattered[c][b]. Wail and cry out! Declare it by the Arnon: Moab is devastated.'
translation:
  language: de
  text: Moab ist zuschanden geworden, denn es ist zerbrochen.[a] Heult und schreit! Verkündet es am Arnon:[b] Moab ist verwüstet.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn es ist bestürzt“ oder „denn es ist zerschmettert“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „beim Arnon“ oder „im Arnongebiet“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Moab ist ausgeplündert“ beziehungsweise „verheert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁ
  choice: ist zuschanden geworden
  rationale: Die Hifil-Form beschreibt hier das eingetretene Ergebnis der Beschämung. Die deutsche Wendung gibt den öffentlichen Verlust von Ehre in würdigem, idiomatischem Deutsch wieder.
- source_word: מוֹאָב
  choice: Moab
  rationale: Eingebürgerte deutsche Form des Landes- und Volksnamens.
- source_word: כִּי
  choice: denn
  rationale: Leitet den Grund dafür ein, dass Moab zuschanden geworden ist, und passt zum gehobenen prophetischen Stil.
- source_word: חַתָּה
  choice: ist zerbrochen
  rationale: Die Form von חתת kann sowohl Zusammenbruch als auch Bestürzung ausdrücken. „Ist zerbrochen“ wahrt das kräftige Bild und entspricht dem Zusammenhang des Gerichts, ohne die mögliche emotionale Bedeutung zu verschweigen.
- source_word: הילילי
  choice: Heult
  rationale: Der feminine Singular richtet sich personifizierend an Moab. „Heult“ gibt den lauten Klageruf des hebräischen Verbs unmittelbar wieder.
- source_word: ו/זעקי
  choice: und schreit
  rationale: Gibt den lauten Hilferuf oder Schrei der Bedrängnis wieder und bildet mit „Heult“ ein natürliches deutsches Wortpaar.
- source_word: הַגִּידוּ
  choice: Verkündet es
  rationale: Der Pluralimperativ fordert zur öffentlichen Bekanntmachung auf. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „es“ ergänzt.
- source_word: בְ/אַרְנֹון
  choice: am Arnon
  rationale: Die Präposition ב ist räumlich flexibel. Da Arnon den bekannten Fluss beziehungsweise das Flusstal bezeichnet, ist „am Arnon“ die natürliche geografische Wiedergabe.
- source_word: שֻׁדַּד
  choice: ist verwüstet
  rationale: Das Pual von שדד bezeichnet das Erleiden von Verwüstung, Verheerung oder Plünderung. „Ist verwüstet“ erfasst die umfassende Zerstörung, ohne den Sinn allein auf Beutezug einzuengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappen, eindringlichen Sätzen. Die beiden Imperative im femininen Singular werden als direkte Anrede des personifizierten Moab verstanden; im Deutschen ist dabei keine Genusmarkierung sichtbar. Die Mehrdeutigkeit von חתה, ב und שדד wird in Fußnoten bewahrt.
