source:
  edition: WLC
  text: אֵ֣ין עוֹד֮ תְּהִלַּ֣ת מוֹאָב֒ בְּ/חֶשְׁבּ֗וֹן חָשְׁב֤וּ עָלֶ֨י/הָ֙ רָעָ֔ה לְכ֖וּ וְ/נַכְרִיתֶ֣/נָּה מִ/גּ֑וֹי גַּם מַדְמֵ֣ן תִּדֹּ֔מִּי אַחֲרַ֖יִ/ךְ תֵּ֥לֶךְ חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/002.yaml
  text: 'There is no more praise for Moab[a]. In Heshbon they have devised evil against her: ‘Come, let us cut her off from being a nation.’ You too, Madmen, will be silenced[b]; the sword will go after you.'
translation:
  language: de
  text: 'Moabs Ruhm ist dahin. In Heschbon[a] haben sie Unheil gegen Moab geplant: »Kommt, wir wollen es auslöschen, sodass es kein Volk mehr ist!« Auch du, Madmen, wirst verstummen[b]; das Schwert wird dich verfolgen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen klingen der Name Heschbon und das Verb für „planen“ ähnlich; dadurch entsteht ein Wortspiel.
    reason: lexical_alternative
  - marker: b
    text: Madmen ist wahrscheinlich ein Ortsname. Im Hebräischen klingt der Name zugleich an das Verb „verstummen“ an und verstärkt so die Gerichtsankündigung.
    reason: cultural_note
lexical_decisions:
- source_word: אֵין עוֹד תְּהִלַּת מוֹאָב
  choice: Moabs Ruhm ist dahin
  rationale: תְּהִלָּה bezeichnet Lob, Ruhm oder Ansehen; die idiomatische Wendung „ist dahin“ gibt אֵין עוֹד als endgültigen Verlust dieses Ruhmes natürlich und prägnant wieder.
- source_word: בְּחֶשְׁבּוֹן חָשְׁבוּ
  choice: In Heschbon haben sie … geplant
  rationale: Die Präposition wird lokal verstanden. „Heschbon“ und חָשְׁבוּ bilden im Hebräischen ein hörbares Wortspiel, das in einer Fußnote erläutert wird.
- source_word: רָעָה
  choice: Unheil
  rationale: „Unheil“ wahrt hier sowohl den Gedanken einer bösen Absicht als auch den einer geplanten Vernichtung, ohne die Mehrdeutigkeit vorschnell auf moralisches Böses oder bloßes Unglück einzuengen.
- source_word: לְכוּ וְנַכְרִיתֶנָּה מִגּוֹי
  choice: Kommt, wir wollen es auslöschen, sodass es kein Volk mehr ist
  rationale: Die Aufforderung mit Kohortativ wird als direkte feindliche Rede wiedergegeben. Die Formulierung drückt die beabsichtigte Beseitigung Moabs als Volk aus.
- source_word: מַדְמֵן תִּדֹּמִּי
  choice: Madmen, wirst verstummen
  rationale: מַדְמֵן wird als Ortsname bewahrt; „verstummen“ gibt דמם wieder und lässt zugleich die im Gerichtswort mitschwingende Vernichtung erkennen.
- source_word: אַחֲרַיִךְ תֵּלֶךְ חָרֶב
  choice: das Schwert wird dich verfolgen
  rationale: Die idiomatische Wiedergabe erhält die Personifikation des Schwertes und macht die drohende militärische Verfolgung im Deutschen klar.
