  text: וְ/עַל קְרִיּ֖וֹת וְ/עַל בָּצְרָ֑ה וְ/עַ֗ל כָּל עָרֵי֙ אֶ֣רֶץ מוֹאָ֔ב הָ/רְחֹק֖וֹת וְ/הַ/קְּרֹבֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/024.yaml
  text: and against Kerioth[a], and against Bozrah, and against all the cities of the land of Moab, far and near.
translation:
  language: de
  text: und über Kerijot und über Bozra und über alle Städte des Landes Moab, die fernen wie die nahen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: und über
  rationale: Die wiederholte Präposition setzt die Reihe der Orte fort, über die im größeren Satz das Gericht gekommen ist. „Über“ bewahrt den deutschen Satzanschluss und die gerichtliche Stoßrichtung.
- source_word: קְרִיּוֹת
  choice: Kerijot
  rationale: Der Ausdruck ist hier ein Ortsname und wird daher nach gebräuchlicher deutscher biblischer Umschrift wiedergegeben, nicht als Gattungsbegriff „Städte“ übersetzt.
- source_word: בָּצְרָה
  choice: Bozra
  rationale: Der moabitische Ortsname wird in der geläufigen deutschen Form wiedergegeben.
- source_word: כָּל עָרֵי אֶרֶץ מוֹאָב
  choice: alle Städte des Landes Moab
  rationale: Die Wiedergabe folgt der hebräischen Genitivverbindung und klingt zugleich natürlich und würdig.
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  choice: die fernen wie die nahen
  rationale: Die femininen Pluraladjektive beziehen sich auf die Städte. Die Formulierung bewahrt den Merismus, der sämtliche Städte ohne Ausnahme umfasst, und vermeidet im Deutschen eine unnötig schwerfällige Wiederholung von „Städte“.
