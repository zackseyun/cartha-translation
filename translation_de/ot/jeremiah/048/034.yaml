  text: מִ/זַּעֲקַ֨ת חֶשְׁבּ֜וֹן עַד אֶלְעָלֵ֗ה עַד יַ֨הַץ֙ נָתְנ֣וּ קוֹלָ֔/ם מִ/צֹּ֨עַר֙ עַד חֹ֣רֹנַ֔יִם עֶגְלַ֖ת שְׁלִֽשִׁיָּ֑ה כִּ֚י גַּם מֵ֣י נִמְרִ֔ים לִ/מְשַׁמּ֖וֹת יִהְיֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
translation:
  language: de
  text: Vom Schrei Heschbons bis nach Elale, bis nach Jahaz, erheben sie ihre Stimme; von Zoar bis nach Horonajim, bis nach Eglat-Schelischija[a]. Denn selbst die Wasser von Nimrim werden zu Einöden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: „eine dreijährige Färse“. Die hebräische Wortgruppe עֶגְלַת שְׁלִשִׁיָּה kann beschreibend verstanden werden; in der Reihe der Ortsangaben ist hier jedoch wahrscheinlich ein Ortsname gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזַּעֲקַת חֶשְׁבּוֹן
  choice: Vom Schrei Heschbons
  rationale: זַעֲקָה bezeichnet einen lauten Schrei aus Not. Das vorangestellte מִן eröffnet hier die geografische Spannweite; die knappe Genitivform bewahrt die poetische Dichte.
- source_word: עַד
  choice: bis nach
  rationale: Das wiederholte עַד bezeichnet jeweils die räumliche Erstreckung des Schreis. Bei Ortsnamen klingt „bis nach“ im modernen Deutschen natürlich.
- source_word: נָתְנוּ קוֹלָם
  choice: erheben sie ihre Stimme
  rationale: Die hebräische Wendung lautet wörtlich „sie geben ihre Stimme“ und meint, dass sie laut rufen. „Ihre Stimme erheben“ erhält die aktive idiomatische Aussage.
- source_word: מִצֹּעַר
  choice: von Zoar
  rationale: Die Präposition מִן eröffnet einen zweiten geografischen Abschnitt und wird direkt wiedergegeben.
- source_word: חֹרֹנַיִם
  choice: Horonajim
  rationale: Der Ortsname wird nach gängiger deutscher Umschrift wiedergegeben.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Eglat-Schelischija
  rationale: Im Zusammenhang der Ortsnamen und im Vergleich mit Jesaja 15,5 ist die Auffassung als Ortsname wahrscheinlich. Die Umschrift vermeidet es, die lexikalische Mehrdeutigkeit im Haupttext vorschnell aufzulösen.
- source_word: כִּי גַּם
  choice: Denn selbst
  rationale: כִּי leitet die Begründung ein, während גַּם hervorhebend wirkt; „Denn selbst“ gibt beides knapp wieder.
- source_word: מֵי נִמְרִים
  choice: die Wasser von Nimrim
  rationale: Die Status-constructus-Verbindung wird als Bezeichnung der zu Nimrim gehörenden Wasserläufe oder Quellen offen wiedergegeben.
- source_word: לִמְשַׁמּוֹת יִהְיוּ
  choice: werden zur Einöde werden
  rationale: היה mit לְ bezeichnet hier das Eintreten eines Zustands. „Zur Einöde werden“ gibt den resultativen Sinn natürlich wieder; der deutsche Kollektivbegriff vermeidet das schwer verständliche „zu Verwüstungen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer geografischer Staffelung. Die ungewöhnliche Mehrzahl in „erheben sie ihre Stimme“ bleibt erhalten, weil der hebräische Text das Subjekt nicht ausdrücklich nennt. Die lexikalische Unsicherheit bei עֶגְלַת שְׁלִשִׁיָּה wird im Haupttext nicht aufgelöst, sondern in der Fußnote dokumentiert.
