lexical_decisions:
- source_word: קוֹל צְעָקָה
  choice: Horch! Ein Hilfeschrei
  rationale: Die hebräische Nominalwendung bedeutet wörtlich „Stimme/Klang eines Schreiens“. „Horch!“ gibt die aufmerksamkeitslenkende Wirkung von קוֹל natürlich wieder; „Hilfeschrei“ erfasst צְעָקָה im Zusammenhang einer Katastrophe.
- source_word: מֵחֹרוֹנָיִם
  choice: aus Horonajim
  rationale: Die Präposition מִן bezeichnet die Herkunft des Schreis; der Ortsname wird in geläufiger deutscher Umschrift wiedergegeben.
- source_word: שֹׁד
  choice: Verwüstung
  rationale: שֹׁד bezeichnet gewaltsame Zerstörung beziehungsweise Verheerung; „Verwüstung“ passt zum Gerichtskontext.
- source_word: שֶׁבֶר גָּדוֹל
  choice: großer Zusammenbruch
  rationale: שֶׁבֶר kann Bruch, Zerschmetterung, Zusammenbruch oder Untergang bezeichnen. „Zusammenbruch“ bewahrt das Bild und unterscheidet den Ausdruck von שֹׁד; גָּדוֹל wird direkt mit „groß“ wiedergegeben.
