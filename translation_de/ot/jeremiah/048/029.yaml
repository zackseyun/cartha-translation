  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּאֶ֣ה מְאֹ֑ד גָּבְה֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/גַאֲוָת֖/וֹ וְ/רֻ֥ם לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/029.yaml
  text: We have heard of the pride of Moab—he is exceedingly proud—of his haughtiness[a], his pride, his arrogance, and the loftiness of his heart.
translation:
  language: de
  text: Wir haben vom Hochmut Moabs gehört – Moab ist überaus hochmütig –, von seiner Überheblichkeit[a], seinem Hochmut, seiner Anmaßung und dem Hochmut seines Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: seiner Höhe oder Erhabenheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Wir haben … gehört
  rationale: Das Qal-Perfekt der 1. Person Plural bezeichnet hier eine bereits erlangte und weiterhin geltende Kenntnis; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: גְאוֹן מוֹאָב
  choice: Hochmut Moabs
  rationale: Im Gerichtskontext bezeichnet גְאוֹן nicht neutrale Hoheit, sondern anmaßenden Stolz. Die Genitivform ist im Deutschen knapp und würdig.
- source_word: גֵּאֶה מְאֹד
  choice: es ist überaus hochmütig
  rationale: Die prädikative Wiedergabe bewahrt die starke Intensivierung durch מְאֹד und passt zum grammatischen Geschlecht des deutschen Namens Moab.
- source_word: גָּבְהוֹ
  choice: seine Überheblichkeit
  rationale: Die Grundvorstellung von Höhe wird in der Reihe von Ausdrücken für Stolz moralisch gebraucht. „Überheblichkeit“ vermittelt diesen Sinn, während die Fußnote die konkrete Höhenmetapher sichtbar hält.
- source_word: וּגְאוֹנוֹ
  choice: seinem Hochmut
  rationale: Die Wiederholung des Wortfeldes aus גְאוֹן wird beibehalten, weil die hebräische Häufung rhetorisch beabsichtigt ist.
- source_word: וְגַאֲוָתוֹ
  choice: seiner Anmaßung
  rationale: „Anmaßung“ unterscheidet diesen Ausdruck leicht von den benachbarten Synonymen und bewahrt zugleich den negativen Sinn.
- source_word: וְרֻם לִבּוֹ
  choice: davon, wie hoch sich sein Herz erhebt
  rationale: Die Formulierung bewahrt sowohl das Herzmotiv als auch die im Hebräischen enthaltene Höhenmetapher, ohne sie durch einen weiteren abstrakten Stolzbegriff einzuebnen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihe nahezu synonymer Ausdrücke bleibt erhalten, ebenso die abschließende Höhenmetapher des Herzens. Gedankenstriche markieren den emphatischen Einschub des Hebräischen.
