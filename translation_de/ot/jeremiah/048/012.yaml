  to: 'Darum: Siehe, es kommen Tage, spricht Jahwe, da werde ich ihm Ausschütter schicken[a]; sie werden ihn ausschütten[b], seine Gefäße leeren und ihre Krüge[c] zerschlagen.'
  rationale: Die Revision stellt die Zukunftsform der göttlichen Ankündigung ausdrücklich her und ersetzt den adressatenbezogenen Imperativ „seht“ durch die prophetische Partikel „Siehe“. „Ausschütter/ausschütten“ folgt der kontextuell bevorzugten Lesart des schwierigen hebräischen Wortspiels, während die ernsthafte Alternative weiterhin in der Fußnote genannt wird. Die ungewöhnliche, im überlieferten Text stehende Form „ihre Krüge“ bleibt unverändert erhalten.
