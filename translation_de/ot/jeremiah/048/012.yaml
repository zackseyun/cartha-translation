source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּ֖ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּחְתִּי ל֥/וֹ צֹעִ֖ים וְ/צֵעֻ֑/הוּ וְ/כֵלָ֣י/ו יָרִ֔יקוּ וְ/נִבְלֵי/הֶ֖ם יְנַפֵּֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
translation:
  language: de
  text: 'Darum: Siehe, es kommen Tage, spricht Jahwe, da werde ich ihm Ausschütter schicken[a]; sie werden ihn ausschütten[b], seine Gefäße leeren und ihre Krüge[c] zerschlagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist selten. Möglich sind auch „Kipper“ oder „Ausgießer“; das Bild vom Ausschütten, Leeren und Zerschlagen von Gefäßen spricht für Personen, die Wein ausschütten.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie werden ihn umherziehen lassen“. Das hebräische Verb kann so verstanden werden; der Zusammenhang mit dem Wein- und Gefäßbild spricht jedoch für „ausschütten“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „ihre Krüge“. Manche erwarten dem Sinn nach „seine Krüge“ mit Bezug auf Moab; der überlieferte hebräische Text hat „ihre“.'
    reason: textual_difficulty
lexical_decisions:
- source_word: לָכֵן הִנֵּה
  choice: Darum seht
  rationale: לָכֵן stellt die Folgerung aus dem vorherigen Bild von Moabs ungestörter Lagerung her; הִנֵּה wird als gegenwärtiger Aufmerksamkeitsruf mit „seht“ wiedergegeben.
- source_word: יָמִים בָּאִים
  choice: Es kommen Tage
  rationale: Bewahrt die geläufige prophetische Ankündigungsformel in natürlichem, feierlichem Deutsch.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „spricht“ ist die etablierte, würdige Wiedergabe der prophetischen Botenformel; der Gottesname wird als Jahwe wiedergegeben.
- source_word: וְשִׁלַּחְתִּי לוֹ
  choice: da schicke ich ihm
  rationale: Das ל mit Suffix bezeichnet die Ausrichtung auf Moab; „ihm“ wahrt die hebräische Form, während der feindliche Sinn aus den folgenden Handlungen hervorgeht.
- source_word: צֹעִים
  choice: Umfüller
  rationale: Das seltene Wort wird aufgrund des durchgehenden Wein- und Gefäßbildes als Bezeichnung für Personen verstanden, die Wein aus einem Behälter in einen anderen umfüllen.
- source_word: וְצֵעֻהוּ
  choice: sie werden ihn umfüllen
  rationale: Das Verb wird im Einklang mit dem Bild von Moab als ungestörtem Wein verstanden; die mögliche Bedeutung „umherziehen lassen“ bleibt in einer Fußnote erhalten.
- source_word: וְכֵלָיו יָרִיקוּ
  choice: seine Gefäße leeren
  rationale: Die Kausativform von ריק bedeutet „leeren“; „Gefäße“ hält das Bild bewusst allgemein.
- source_word: וְנִבְלֵיהֶם יְנַפֵּצוּ
  choice: ihre Krüge zerschlagen
  rationale: „Krüge“ gibt נְבָלִים im Gefäßkontext verständlich wieder; das maskuline Pluralsuffix „ihre“ des überlieferten Textes wird nicht zu „seine“ harmonisiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die personale Namensform des hebräischen Textes wird transparent wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Deutung der Gerichtsmetapher
  choice: Umfüllen im Weinbild
  alternative: ins Umherziehen bringen
  rationale: Vers 11 und die anschließenden Aussagen über das Leeren und Zerschlagen von Gefäßen stützen die Weinmetapher; die lexikalische Unsicherheit wird jedoch ausdrücklich vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Satzführung und das durchgehende Wein- und Gefäßbild bleiben erhalten. „Umfüller“ ist bewusst ungewöhnlich, weil auch der hebräische Ausdruck selten und bildhaft ist; die Fußnoten sichern die echten lexikalischen Alternativen.
