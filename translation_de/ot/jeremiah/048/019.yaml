  yaml_path: translation/ot/jeremiah/048/019.yaml
  text: Stand by the road and watch, inhabitant of Aroer; ask the man who flees and the woman who escapes, “What has happened?”
translation:
  language: de
  text: 'Stell dich an den Weg und halte Ausschau, Bewohnerin von Aroër! Frage den Flüchtenden und die Entkommene: »Was ist geschehen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל דֶּרֶךְ עִמְדִי וְצַפִּי
  choice: Stell dich an den Weg und halte Ausschau
  rationale: Die beiden femininen Imperative werden direkt wiedergegeben; »halte Ausschau« vermittelt צפה hier natürlicher als das allgemeinere »sieh zu«.
- source_word: יוֹשֶׁבֶת עֲרוֹעֵר
  choice: Bewohnerin von Aroër
  rationale: Das feminine Partizip wird als direkte Anrede einer personifizierten Stadt beziehungsweise ihrer weiblich angesprochenen Einwohnerschaft bewahrt.
- source_word: נָס וְנִמְלָטָה
  choice: den Flüchtenden und die Entkommene
  rationale: Die im Hebräischen erkennbare männliche beziehungsweise weibliche Form bleibt sichtbar, ohne zusätzliche Bezeichnungen wie »Mann« und »Frau« in den Text einzutragen.
- source_word: מַה נִּהְיָתָה
  choice: Was ist geschehen?
  rationale: Eine idiomatische und semantisch genaue Wiedergabe der Frage nach dem eingetretenen Ereignis.
