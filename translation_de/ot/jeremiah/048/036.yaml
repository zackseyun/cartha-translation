base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: de
  text: Darum klagt mein Herz um Moab wie Flöten, und mein Herz klagt um die Männer von Kir-Heres wie Flöten. Darum sind die Güter, die er erworben hat, verloren gegangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Darum sind der Überschuss/die Güter, die er gemacht hat, verloren.“ Der hebräische Wortlaut verbindet bei „er machte“ einen maskulinen Singular mit einem pluralischen Verb bei „sind verloren gegangen“. Der Bezug des Singulars ist nicht ausdrücklich bestimmt; gemeint sein können Moab personifiziert oder seine Bewohner. Das Wort kann erworbenen Besitz, Ertrag oder Vorräte bezeichnen.'
    reason: Die grammatische Unebenheit zwischen Singular und Plural sowie die Bedeutungsbreite von יִתְרַת werden im deutschen Haupttext nur annähernd sichtbar und bedürfen einer Erläuterung.
lexical_decisions:
- source_word: יֶהֱמֶה
  choice: klagt
  rationale: Das Verb bezeichnet ein hörbares Dröhnen, Seufzen oder Klagen. Im Bild der Flöten gibt „klagt“ den Trauerton natürlich und würdig wieder.
- source_word: כַחֲלִלִים / כַחֲלִילִים
  choice: wie Flöten
  rationale: Die beiden Schreibformen bezeichnen Flöten bzw. Pfeifen; die Wiederholung des Bildes bleibt erhalten.
- source_word: יִתְרַת עָשָׂה
  choice: was es erwirtschaftet hat
  rationale: יִתְרָה bezeichnet den Überschuss oder erworbenen Besitz; עָשָׂה ist formal Singular. Die Formulierung lässt Moab als naheliegenden Bezug des Singulars erkennen, ohne eine männliche Einzelperson einzuführen.
- source_word: אָבָדוּ
  choice: ist verloren
  rationale: Das pluralische Verb kann sich kollektiv auf den Ertrag bzw. die erworbenen Güter beziehen. Die unpersönliche deutsche Wendung gibt den Verlust idiomatisch wieder.
theological_decisions:
- issue: Wessen Herz klagt?
  choice: „mein Herz“ ohne ausdrückliche Identifizierung des Sprechers
  alternative: den Sprecher ausdrücklich als Jeremia oder als Gott bezeichnen
  rationale: Der hebräische Vers identifiziert den Sprecher hier nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
- issue: Bezug des maskulinen Singulars עָשָׂה
  choice: neutrales Pronomen „es“ mit Bezug auf Moab
  alternative: „er“ mit Bezug auf einen einzelnen Mann oder kollektiv „sie“ mit Bezug auf die Bewohner
  rationale: Die grammatische Singularform wird gewahrt; zugleich wird keine im Ausgangstext nicht eindeutig genannte Einzelperson vorausgesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Klage des Herzens und das Flötenbild werden entsprechend der hebräischen Wiederholung beibehalten; die Satzstellung wird nur leicht geglättet.
