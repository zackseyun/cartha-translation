  to: Und Moab wird wegen Kemosch zuschanden werden[a], wie das Haus Israel wegen Bethel, ihrer Zuversicht, zuschanden wurde[b].
  rationale: Die Revision ersetzt die im modernen Deutsch unklare Verbindung „an … zuschanden werden“ durch die kontextgerecht-kausale und parallele Formulierung „wegen … zuschanden werden“. Die Apposition „ihrer Zuversicht“ bildet das hebräische מִבְטָחָם unmittelbar ab; die Fußnoten erläutern die verbleibende Präpositionsnuance, ohne eine theologisch oder syntaktisch überbestimmte Deutung einzutragen.
