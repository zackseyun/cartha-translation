source:
  edition: WLC
  text: וּ/בֹ֥שׁ מוֹאָ֖ב מִ/כְּמ֑וֹשׁ כַּ/אֲשֶׁר בֹּ֨שׁוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל מִ/בֵּ֥ית אֵ֖ל מִבְטֶחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
translation:
  language: de
  text: Und Moab wird wegen Kemosch zuschanden werden[a], wie das Haus Israel wegen Bethel, ihrer Zuversicht, zuschanden wurde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich Kemoschs schämen“. Das Hebräische kann wörtlicher als „sich wegen/von Kemosch schämen“ wiedergegeben werden. Gemeint ist, dass Moabs Vertrauen auf Kemosch in Schande endet.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wegen/von Bethel, ihrer Zuversicht“. Bethel war das nordisraelitische Heiligtum, das mit der Verehrung von Stierbildern verbunden war.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  choice: wird … zuschanden werden
  rationale: בוש bezeichnet hier nicht nur ein inneres Schamgefühl, sondern das Scheitern, das in öffentliche Schande führt. „Zuschanden werden“ gibt dieses Ergebnis im prophetischen Gerichtskontext prägnant wieder.
- source_word: מוֹאָב
  choice: Moab
  rationale: Die im Deutschen übliche Form des Völker- und Landesnamens.
- source_word: מִכְּמוֹשׁ
  choice: an Kemosch
  rationale: Die Präposition מִן kann nach בוש die Person oder Sache bezeichnen, an der jemand beschämt wird beziehungsweise mit der seine Hoffnung scheitert. „An Kemosch zuschanden werden“ ist idiomatisches Deutsch und bewahrt die enge hebräische Verknüpfung.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet den unmittelbaren Vergleich zwischen Moabs künftigem und Israels bereits erfahrenem Scheitern ein.
- source_word: בֹּשׁוּ
  choice: zuschanden wurde
  rationale: Wahrt die lexikalische Entsprechung zum ersten בוש und bezeichnet die eingetretene Beschämung Israels.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die formale Wiedergabe erhält die kollektive, national-korporative Bezeichnung des hebräischen Ausdrucks.
- source_word: מִבֵּית אֵל
  choice: an Bethel
  rationale: Bethel ist hier der Ortsname des nordisraelitischen Kultzentrums. „An Bethel zuschanden werden“ bildet die Parallele zu Moabs Scheitern an Kemosch ab.
- source_word: מִבְטֶחָם
  choice: auf das es vertraute
  rationale: Das Substantiv bezeichnet den Gegenstand beziehungsweise Grund des Vertrauens. Die relative Formulierung ist im Deutschen natürlicher als die wörtliche Apposition „seine Zuversicht“ und macht den Bezug des kollektiven Singulars „Haus Israel“ klar.
theological_decisions:
- issue: Bezug von Bethel
  choice: Bethel wird als das nordisraelitische Kultzentrum verstanden, auf das Israel vertraute.
  alternative: „Haus Gottes“ als wörtlich verstandene Gattungsbezeichnung.
  rationale: Im Vergleich stehen Moabs Vertrauen auf Kemosch und Israels Vertrauen auf Bethel einander gegenüber. Eine Übersetzung als „Haus Gottes“ würde die historische und polemische Anspielung verdunkeln und könnte fälschlich ein Vertrauen auf den wahren Gott nahelegen.
- issue: Art der Beschämung durch Kemosch und Bethel
  choice: „an … zuschanden werden“ lässt sowohl das enttäuschte Vertrauen als auch die daraus folgende öffentliche Schande anklingen.
  alternative: „sich Kemoschs/Bethels schämen“, mit stärkerem Gewicht auf einem inneren Schamgefühl.
  rationale: Der Kontext spricht vom Scheitern der religiösen Zuversicht unter dem Gericht. Die gewählte Formulierung bewahrt die semantische Spannung von בוש, ohne sie ausschließlich psychologisch oder kausal festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „zuschanden werden“ bildet die hebräische Parallelstruktur ab. „Haus Israel“ bleibt als korporative Bezeichnung erhalten; die Relativkonstruktion bei Bethel sorgt trotz der formalen Grundstruktur für natürliche Verständlichkeit.
