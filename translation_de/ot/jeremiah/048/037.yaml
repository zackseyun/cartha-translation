  text: כִּ֤י כָל רֹאשׁ֙ קָרְחָ֔ה וְ/כָל זָקָ֖ן גְּרֻעָ֑ה עַ֤ל כָּל יָדַ֨יִם֙ גְּדֻדֹ֔ת וְ/עַל מָתְנַ֖יִם שָֽׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
translation:
  language: de
  text: Denn jeder Kopf ist kahl, jeder Bart abgeschnitten; an allen Händen sind Einschnitte[a], und um die Hüften liegt Sacktuch[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort für „Hände“ kann hier möglicherweise auch die Unterarme einschließen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „an den Lenden ist Sacktuch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung beziehungsweise Erläuterung der Klage ein.
- source_word: כָל רֹאשׁ קָרְחָה
  choice: jeder Kopf ist kahl geschoren
  rationale: קָרְחָה bezeichnet hier die als Trauerzeichen herbeigeführte Kahlheit; die Formulierung gibt den resultativen Sinn natürlich wieder.
- source_word: וְכָל זָקָן גְּרֻעָה
  choice: jeder Bart abgeschnitten
  rationale: גְּרֻעָה bezeichnet einen verminderten beziehungsweise entfernten Bart und steht parallel zum Scheren des Kopfes als Trauerbrauch.
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  choice: an allen Händen sind Schnittwunden
  rationale: גְּדֻדֹת sind rituelle Einschnitte als Ausdruck der Trauer. „An“ ist im Deutschen bei Körperstellen natürlich; יָדַיִם kann in diesem Zusammenhang möglicherweise auch Hand und Unterarm umfassen.
- source_word: וְעַל מָתְנַיִם שָׂק
  choice: um die Hüften liegt Sacktuch
  rationale: מָתְנַיִם bezeichnet die Hüft- oder Lendengegend. „Um die Hüften“ macht verständlich, dass das Trauergewand um den Körper getragen wird, ohne das Bild unnötig zu verengen.
