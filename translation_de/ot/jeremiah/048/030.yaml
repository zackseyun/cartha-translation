  text: אֲנִ֤י יָדַ֨עְתִּי֙ נְאֻם יְהוָ֔ה עֶבְרָת֖/וֹ וְ/לֹא כֵ֑ן בַּדָּ֖י/ו לֹא כֵ֥ן עָשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/030.yaml
  text: I know his wrath[a], declares Yahweh, and it is not so; his boasts have accomplished nothing.
translation:
  language: de
  text: Ich kenne seinen Zorn, spricht Jahwe; und so ist es nicht; seine Prahlereien haben nichts bewirkt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut im Schlussteil ist knapp und schwer verständlich. Möglich auch: »Seine Lügen sind nicht wahr; sie haben nicht so gehandelt« oder: »Sein leeres Gerede hat nichts bewirkt.«'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Ich kenne
  rationale: Das Qal-Perfekt bezeichnet hier Jahwes feststehende Kenntnis und wird im Deutschen natürlich als gegenwärtiger Zustand wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige prophetische Botenformel bleibt feierlich und gibt den Gottesnamen ausdrücklich wieder.
- source_word: עֶבְרָתוֹ
  choice: seinen Zorn
  rationale: עֶבְרָה bezeichnet gewöhnlich heftigen beziehungsweise überströmenden Zorn. »Zorn« ist im modernen Standarddeutsch klar und würdevoll; der Kontext verbindet ihn zugleich mit Moabs Hochmut.
- source_word: וְלֹא כֵן
  choice: Doch so ist es nicht
  rationale: Die knappe Zurückweisung mit כֵן (»so«) wird formal bewahrt, ohne ihren nicht ausdrücklich genannten Bezug vorschnell festzulegen.
- source_word: בַּדָּיו
  choice: seine Prahlereien
  rationale: בַּדִּים kann Lügen, leeres Gerede oder prahlerische Behauptungen bezeichnen. Im Kontext von Moabs Stolz passt »Prahlereien«, während die Fußnote die lexikalische Breite erkennen lässt.
- source_word: לֹא כֵן עָשׂוּ
  choice: haben nichts bewirkt
  rationale: Wörtlich steht knapp »sie haben nicht so getan«. Bezogen auf die Prahlereien drückt die idiomatische Wiedergabe aus, dass sie die behauptete Wirklichkeit nicht zustande gebracht haben; die Unsicherheit bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: »Jahwe« gibt den persönlichen Bundesnamen ausdrücklich wieder und entspricht der vorgegebenen Projektentscheidung, ohne eine konfessionelle Sonderdeutung einzuführen.
- issue: Deutung von בַּדָּיו לֹא כֵן עָשׂוּ
  choice: Seine Prahlereien haben nichts bewirkt
  alternative: Seine Lügen sind falsch; sie haben nicht so gehandelt / Sein leeres Gerede hat nichts bewirkt
  rationale: Der hebräische Ausdruck ist stark verkürzt und mehrdeutig. Die Hauptfassung folgt dem unmittelbaren Kontext von Moabs Hochmut und bleibt verständlich; andere mögliche Satzbezüge und Bedeutungen werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Aussagesätze bewahren die Schärfe des prophetischen Urteils; die schwer aufzulösende hebräische Ellipse wird im Haupttext lesbar wiedergegeben und in der Fußnote transparent gemacht.
