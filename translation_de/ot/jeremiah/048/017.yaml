  text: נֻ֤דוּ ל/וֹ֙ כָּל סְבִיבָ֔י/ו וְ/כֹ֖ל יֹדְעֵ֣י שְׁמ֑/וֹ אִמְר֗וּ אֵיכָ֤ה נִשְׁבַּר֙ מַטֵּה עֹ֔ז מַקֵּ֖ל תִּפְאָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
translation:
  language: de
  text: 'Beklagt ihn[a], ihr alle rings um ihn, und ihr alle, die seinen Namen kennen[b]! Sagt: »Wie ist der mächtige Stab zerbrochen, der Stock der Pracht![c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schüttelt den Kopf über ihn“ beziehungsweise „Trauert um ihn“. Das hebräische Verb kann eine Klage bezeichnen, die mit einer körperlichen Geste verbunden ist.'
    reason: lexical_alternative
  - marker: b
    text: „Seinen Namen kennen“ kann hier auch bedeuten, seinen Ruf oder seine Berühmtheit zu kennen.
    reason: lexical_alternative
  - marker: c
    text: Die beiden hebräischen Wörter können jeweils einen Stab, Stock oder eine Rute bezeichnen; beim ersten ist auch „Zepter“ möglich. Das Bild steht wahrscheinlich für Moabs nun zerbrochene Macht und Pracht.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻדוּ לֹו
  choice: Beklagt ihn
  rationale: Das Verb נוד kann hier zur mitfühlenden Klage auffordern und zugleich eine körperliche Trauergeste einschließen. „Beklagt ihn“ gibt den Klagecharakter natürlich wieder, ohne die mögliche Geste festzulegen; das maskuline Pronomen bewahrt die Personifizierung Moabs.
- source_word: כָּל סְבִיבָיו
  choice: ihr alle rings um ihn
  rationale: Die Formulierung bewahrt die direkte Anrede und bezeichnet die Moab umgebenden Völker oder Menschen, ohne das im Hebräischen nicht ausdrücklich vorhandene „Nachbarn“ einzusetzen.
- source_word: וְכֹל יֹדְעֵי שְׁמוֹ
  choice: und ihr alle, die seinen Namen kennen
  rationale: Die wörtliche Wiedergabe lässt offen, ob שֵׁם vor allem den Namen oder zugleich Moabs Bekanntheit und Ruf bezeichnet.
- source_word: אֵיכָה נִשְׁבַּר
  choice: Wie ist … zerbrochen
  rationale: „Wie“ erhält die Form des klagenden Ausrufs; „ist zerbrochen“ gibt den eingetretenen Zustand beziehungsweise das Ergebnis des hebräischen Perfekts wieder.
- source_word: מַטֵּה עֹז
  choice: der mächtige Stab
  rationale: מַטֶּה kann Stab, Stock, Rute oder Zepter bedeuten. „Mächtiger Stab“ bewahrt sowohl das konkrete Bild als auch den Sinn von Stärke und Herrschaft, ohne es ausschließlich königlich zu deuten.
- source_word: מַקֵּל תִּפְאָרָה
  choice: der Stock der Pracht
  rationale: „Stock“ unterscheidet מַקֵּל im Deutschen vom parallelen מַטֶּה, während „Pracht“ die Bedeutungsbreite von תִּפְאָרָה im Zusammenhang von Ansehen, Herrlichkeit und Schönheit angemessen wiedergibt.
