id: JER.48.25
reference: Jeremiah 48:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
translation:
  language: de
  text: Moabs Horn ist abgehauen[a], und sein Arm ist zerbrochen – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Horn« und »Arm« sind hier Bilder für Stärke und Macht.
    reason: Erläuterung der hebräischen Metaphern
lexical_decisions:
- source_word: נִגְדְּעָה
  choice: ist abgehauen
  rationale: Das Nifal von גדע bezeichnet das Abhauen oder Abschneiden. »Abgehauen« bewahrt das konkrete Bild des Horns und bildet ein kräftiges poetisches Gegenstück zu »zerbrochen«.
- source_word: קֶרֶן
  choice: Horn
  rationale: Das Wort bedeutet wörtlich »Horn« und steht hier bildlich für Stärke und Macht. Die Metapher bleibt im Haupttext erhalten.
- source_word: מוֹאָב
  choice: Moab
  rationale: Übliche deutsche Wiedergabe des Namens des Landes beziehungsweise Volkes.
- source_word: וּזְרֹעוֹ
  choice: und sein Arm
  rationale: זְרוֹעַ bedeutet wörtlich »Arm« und kann bildlich Stärke oder militärische Macht bezeichnen. Das maskuline Suffix wird entsprechend der Personifizierung Moabs mit »sein« wiedergegeben.
- source_word: נִשְׁבָּרָה
  choice: ist zerbrochen
  rationale: Das Nifal von שבר bezeichnet das Gebrochenwerden. Die Formulierung wahrt das körperliche Bild und die parallele Passivkonstruktion.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Offenbarungsformel. »Ausspruch Jahwes« gibt ihre nominale Form und ihr Gewicht knapp wieder; der Gottesname wird als »Jahwe« wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bildsprache von Horn und Arm
  choice: Die beiden Körperbilder im Haupttext bewahren
  alternative: Beide Bilder deutend als Stärke oder Macht wiedergeben
  rationale: Die parallelen Metaphern bezeichnen Moabs Stärke und Macht, sind aber bewusst konkrete poetische Bilder. Eine interpretierende Auflösung würde die Bildsprache des Ausgangstextes verflachen.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit knappem Parallelismus. »Abgehauen« und »zerbrochen« erhalten die anschauliche Härte des hebräischen Verses; der Gedankenstrich setzt die abschließende Offenbarungsformel ab.
