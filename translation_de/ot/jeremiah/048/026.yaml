source:
  edition: WLC
  text: הַשְׁכִּירֻ֕/הוּ כִּ֥י עַל יְהוָ֖ה הִגְדִּ֑יל וְ/סָפַ֤ק מוֹאָב֙ בְּ/קִיא֔/וֹ וְ/הָיָ֥ה לִ/שְׂחֹ֖ק גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
translation:
  language: de
  text: Macht ihn betrunken, denn gegen Jahwe hat er sich überhoben! Moab wird sich in seinem Erbrochenen wälzen[a], und auch er wird zum Gespött werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Moab wird in seinem Erbrochenen klatschen/schlagen.“ Das seltene hebräische Verb bedeutet gewöhnlich „klatschen“ oder „schlagen“; im Zusammenhang mit dem Erbrochenen wird es häufig als Bild des Wälzens in entehrender Trunkenheit verstanden. Die genaue Bildlichkeit ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  choice: Macht ihn betrunken
  rationale: Der Hifil-Imperativ im Plural mit männlichem Singularobjekt fordert dazu auf, Moab betrunken zu machen; das Bild bezeichnet das entehrende Gericht.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung des Befehls ein; „denn“ ist in diesem feierlich-gerichtlichen Zusammenhang natürlich und klar.
- source_word: עַל יְהוָה הִגְדִּיל
  choice: gegen Jahwe hat er sich überhoben
  rationale: עַל bezeichnet hier die feindliche Ausrichtung gegen Jahwe; „sich überheben“ gibt die selbstverherrlichende, hochmütige Bedeutung des Hifil von גדל idiomatisch wieder.
- source_word: וְסָפַק
  choice: wird sich … wälzen
  rationale: In Verbindung mit dem Erbrochenen ergibt sich das Bild, dass Moab in seiner betrunkenen Erniedrigung darin herumwälzt. Da das seltene Verb auch als „klatschen/schlagen“ verstanden werden kann, wird die Unsicherheit in einer Fußnote bewahrt.
- source_word: בְּקִיאוֹ
  choice: in seinem Erbrochenen
  rationale: Die konkrete und drastische Gerichtsszene sowie die Präposition בְּ werden direkt wiedergegeben.
- source_word: וְהָיָה לִשְׂחֹק
  choice: wird zum Gespött werden
  rationale: Die Wendung bezeichnet den resultierenden Zustand öffentlicher Verspottung; „zum Gespött werden“ ist geläufig und würdevoll.
- source_word: גַּם הוּא
  choice: auch er
  rationale: Die emphatische Ergänzung bleibt erhalten und zeigt, dass Moab ebenfalls der Lächerlichkeit preisgegeben wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Art von Moabs Vergehen gegen Jahwe
  choice: hat er sich überhoben
  alternative: hat er großgetan / groß aufgespielt
  rationale: Die Formulierung wahrt die Vorstellung hochmütiger Selbsterhöhung in feindlicher Ausrichtung gegen Jahwe, ohne das Vergehen auf bloßes Reden oder Prahlen einzuengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das drastische Bild des hebräischen Textes bleibt ungemildert; die lexikalische Unsicherheit bei וְסָפַק wird nicht verdeckt.
