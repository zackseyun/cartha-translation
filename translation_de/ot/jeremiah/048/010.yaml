id: JER.48.10
reference: Jeremiah 48:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָר֗וּר עֹשֶׂ֛ה מְלֶ֥אכֶת יְהוָ֖ה רְמִיָּ֑ה וְ/אָר֕וּר מֹנֵ֥עַ חַרְבּ֖/וֹ מִ/דָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
translation:
  language: de
  text: Verflucht ist, wer das Werk Jahwes nachlässig[a] tut, und verflucht ist, wer sein Schwert vom Blut zurückhält.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trügerisch“. Das hebräische Wort kann Täuschung oder Treulosigkeit bezeichnen; hier meint es wahrscheinlich eine nachlässige oder säumige Ausführung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht ist
  rationale: Das prädikativ gebrauchte Wort leitet eine Fluch- und Gerichtsformel ein. „Verflucht ist“ gibt deren Nachdruck in natürlichem, würdigem Deutsch wieder.
- source_word: עֹשֶׂה
  choice: wer … tut
  rationale: Das Partizip bezeichnet substantivisch und allgemein denjenigen, der etwas ausführt. Die Wiedergabe mit „wer“ ist im Deutschen idiomatisch und bewahrt den generischen Sinn.
- source_word: מְלֶאכֶת יְהוָה
  choice: das Werk Jahwes
  rationale: מְלָאכָה bezeichnet Arbeit, Werk oder Auftrag. „Das Werk Jahwes“ bewahrt die hebräische Wendung und lässt im Kontext erkennen, dass das Gericht an Moab als von Jahwe aufgetragene Handlung verstanden wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen geläufige wissenschaftliche Form und ersetzt den Namen nicht durch einen Titel.
- source_word: רְמִיָּה
  choice: nachlässig
  rationale: Das Wort kann Täuschung oder Treulosigkeit bezeichnen, meint hier aber wahrscheinlich die nachlässige, säumige Ausführung des übertragenen Werkes. Die lexikalisch mögliche Alternative wird in einer Fußnote erhalten.
- source_word: מֹנֵעַ
  choice: zurückhält
  rationale: Das Partizip bezeichnet das Zurückhalten oder Abhalten. Zusammen mit „Schwert“ ist „zurückhält“ anschaulich und idiomatisch.
- source_word: חַרְבּוֹ
  choice: sein Schwert
  rationale: Direkte Wiedergabe des Substantivs mit Suffix der dritten Person Maskulinum Singular.
- source_word: מִדָּם
  choice: vom Blut
  rationale: Die konkrete und schroffe Bildsprache des Hebräischen wird bewahrt. „Vom Blutvergießen“ wäre erklärender, aber weniger unmittelbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. Die Übersetzung bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Explizite Gewaltsprache des Gerichtsbildes
  choice: sein Schwert vom Blut zurückhält
  alternative: sein Schwert vom Blutvergießen zurückhält
  rationale: Die konkrete Aussage des Verses wird weder abgeschwächt noch durch eine zusätzliche Rechtfertigung erweitert. So bleiben die Härte und theologische Spannung des Gerichtswortes erhalten.
- issue: Bedeutung von רְמִיָּה
  choice: nachlässig
  alternative: trügerisch
  rationale: Im Zusammenhang mit der Ausführung eines aufgetragenen Werkes liegt Nachlässigkeit beziehungsweise Säumigkeit nahe. Da der Ausdruck zugleich Täuschung oder Treulosigkeit bezeichnen kann, wird diese echte Mehrdeutigkeit in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und knappem Ton. Die parallele Fluchformel wird vollständig wiederholt, und die schroffe Bildsprache des hebräischen Gerichtswortes bleibt erhalten.
