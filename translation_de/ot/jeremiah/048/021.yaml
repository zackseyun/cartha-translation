  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. Die Wiederholung von „über“ ist in einer Aufzählung von Orten, über die das Gericht ergeht, natürlich und bewahrt den Rhythmus des hebräischen Textes.
  terminology: „Gericht“ ist für מִשְׁפָּט im Kontext eines Unheilsorakels angemessen, ohne den Begriff einseitig zu verengen. „Hochebene“ ist eine gute deutsche Wiedergabe von מִישׁוֹר. Holon, Jahza und Mefaat sind konsistent und im Deutschen gut verwendbare Transkriptionen. Die Fußnote zu „Jahaz“ bietet sinnvoll eine verbreitete Namensvariante.
