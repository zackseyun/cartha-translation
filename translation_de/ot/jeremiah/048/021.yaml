id: JER.48.21
reference: Jeremiah 48:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מִשְׁפָּ֥ט בָּ֖א אֶל אֶ֣רֶץ הַ/מִּישֹׁ֑ר אֶל חֹל֥וֹן וְ/אֶל יַ֖הְצָ/ה וְ/עַל מופעת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/021.yaml
  text: And judgment has come upon the land of the plateau—upon Holon[a], and upon Jahzah[b], and upon Mephaath—
translation:
  language: de
  text: 'Und das Gericht ist über das Land der Hochebene gekommen: über Holon, über Jahza[a] und über Mefaat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname wird auch Jahaz genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשְׁפָּט
  choice: Und das Gericht
  rationale: מִשְׁפָּט bezeichnet hier nicht nur abstrakte Gerechtigkeit, sondern das vollzogene richterliche Urteil im Gerichtswort über Moab. „Gericht“ bewahrt die rechtliche und zugleich unheilvolle Bedeutung.
- source_word: בָּא
  choice: ist … gekommen
  rationale: Das Qatal stellt das Eintreffen des Gerichts als gewiss beziehungsweise bereits eingetreten dar. Das deutsche Perfekt gibt diese eindringliche Feststellung natürlich wieder, ohne sie ausdrücklich als Zukunft umzudeuten.
- source_word: אֶל אֶרֶץ הַמִּישֹׁר
  choice: über das Land der Hochebene
  rationale: מִישׁוֹר meint ebenes, erhöht gelegenes Land beziehungsweise Tafelland. „Hochebene“ ist im modernen Deutsch verständlich und entspricht der Landschaft östlich des Jordan. אֶל wird im Zusammenhang mit dem kommenden Gericht idiomatisch mit „über“ wiedergegeben.
- source_word: חֹלוֹן
  choice: Holon
  rationale: Der Ortsname wird in einer dem Hebräischen nahen und im Deutschen gut lesbaren Form transkribiert.
- source_word: יַהְצָה
  choice: Jahza
  rationale: Die Form gibt den hebräischen Ortsnamen in deutscher Transkription wieder; die verbreitete Nebenform „Jahaz“ wird in einer Fußnote genannt.
- source_word: מופעת
  choice: Mefaat
  rationale: Der moabitische Ortsname wird nach deutscher Transkriptionsgewohnheit wiedergegeben.
- source_word: וְעַל
  choice: und über
  rationale: עַל bezeichnet hier das Ergehen des Gerichts über den genannten Ort. Die Wiederholung von „über“ erhält den listenartigen Rhythmus.
theological_decisions:
- issue: Zeitbezug des angekündigten Gerichts
  choice: „ist … gekommen“ als gewisse beziehungsweise vollendete Darstellung
  alternative: „kommt“ oder „wird kommen“
  rationale: Die hebräische Verbform darf nicht vorschnell zu einer bloßen Zukunftsaussage geglättet werden. Das Perfekt bewahrt die Spannung zwischen prophetischer Gewissheit und dargestelltem Vollzug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hochebene“ vermeidet das missverständliche „Ebene“ und bildet die Topografie des hebräischen מִישׁוֹר treffend ab. Die Ortsnamen folgen einer deutschsprachigen Transkription; der Vers endet als abgeschlossene Aussage, obwohl er inhaltlich Teil einer fortlaufenden Ortsliste ist.
