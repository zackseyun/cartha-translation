source:
  edition: WLC
  text: עִזְב֤וּ עָרִים֙ וְ/שִׁכְנ֣וּ בַּ/סֶּ֔לַע יֹשְׁבֵ֖י מוֹאָ֑ב וִֽ/הְי֣וּ כְ/יוֹנָ֔ה תְּקַנֵּ֖ן בְּ/עֶבְרֵ֥י פִי פָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
translation:
  language: de
  text: Verlasst die Städte und wohnt im Fels, ihr Bewohner Moabs! Seid wie eine Taube, die an den Seiten der Öffnung einer Grube[a] nistet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Fallgrube“. Das hebräische Wort kann eine Grube bezeichnen, die als Falle dient; dadurch wird die Gefährlichkeit dieses Zufluchtsorts noch deutlicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ עָרִים
  choice: Verlasst die Städte
  rationale: Der pluralische Imperativ fordert die Bewohner Moabs auf, ihre städtischen Siedlungen zu verlassen. Der bestimmte Artikel ist im Hebräischen nicht ausdrücklich vorhanden, im Deutschen hier aber idiomatisch.
- source_word: וְשִׁכְנוּ בַּסֶּלַע
  choice: und wohnt im Fels
  rationale: שׁכן bezeichnet hier das Wohnen beziehungsweise den Aufenthalt an einem Zufluchtsort; סלע ist ein Fels oder eine Felsklippe. Die knappe Bildsprache des Hebräischen bleibt erhalten.
- source_word: יֹשְׁבֵי מוֹאָב
  choice: ihr Bewohner Moabs
  rationale: Die Partizipialverbindung fungiert als direkte Anrede. Das ergänzte „ihr“ macht den Vokativ im modernen Deutschen eindeutig.
- source_word: וִהְיוּ כְיוֹנָה
  choice: Seid wie eine Taube
  rationale: Der Imperativ von היה leitet einen Vergleich ein. „Seid“ bewahrt die Befehlsform, ohne einen nicht zwingend gemeinten Vorgang des Werdens einzutragen.
- source_word: תְּקַנֵּן
  choice: die … nistet
  rationale: Das feminine Verb stimmt mit „Taube“ überein und wird als deutscher Relativsatz natürlich wiedergegeben.
- source_word: בְּעֶבְרֵי פִי פָחַת
  choice: an den Seiten der Öffnung einer Grube
  rationale: עברי ist räumlich als Seiten oder Randbereiche zu verstehen; פי bedeutet wörtlich „Mund“, bezeichnet hier jedoch die Öffnung. פחת kann eine Grube und möglicherweise besonders eine als Falle dienende Grube bezeichnen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige prophetische Sprache mit direkter Anrede. Die ungewöhnliche räumliche Bildfolge von Fels, Taube und Grubenöffnung wird nicht geglättet; die mögliche Fallenbedeutung von פחת bleibt in der Fußnote erhalten.
