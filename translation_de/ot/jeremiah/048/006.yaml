  text: נֻ֖סוּ מַלְּט֣וּ נַפְשְׁ/כֶ֑ם וְ/תִֽהְיֶ֕ינָה כַּ/עֲרוֹעֵ֖ר בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/006.yaml
  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
translation:
  language: de
  text: Flieht! Rettet euer Leben und seid wie ein Wüstenstrauch[a][b] in der Wüste!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welche Wüstenpflanze mit dem hebräischen Wort gemeint ist, lässt sich nicht sicher bestimmen; vorgeschlagen werden unter anderem Wacholder und Tamariske.
    reason: lexical_alternative
  - marker: b
    text: 'Oder möglicherweise: „wie Aroër in der Wüste“. Das hebräische עֲרוֹעֵר kann hier entweder als Pflanzenbezeichnung oder als Ortsname verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֻסוּ
  choice: Flieht!
  rationale: Der pluralische Imperativ von נוס ist ein dringender Aufruf zur Flucht; „Flieht!“ gibt ihn knapp und unmittelbar wieder.
- source_word: מַלְּטוּ נַפְשְׁכֶם
  choice: Rettet euer Leben
  rationale: מלט im Piel mit נֶפֶשׁ fordert hier dazu auf, das eigene Leben in Sicherheit zu bringen. „Leben“ trifft den situationsbezogenen Sinn von נֶפֶשׁ besser als „Seele“.
- source_word: וְתִהְיֶינָה
  choice: und werdet
  rationale: Die Form von היה führt die Reihe der Aufforderungen fort. „Werdet“ bewahrt gegenüber einem bloßen „seid“ stärker den Übergang in den beschriebenen Zustand.
- source_word: כַּעֲרוֹעֵר
  choice: wie ein Wüstenstrauch
  rationale: עֲרוֹעֵר wird im Zusammenhang mit der Wüste wahrscheinlich als Bezeichnung einer Wüstenpflanze gebraucht. Da die genaue Art unbekannt ist, vermeidet „Wüstenstrauch“ eine unbegründet genaue botanische Bestimmung.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes, trockenes Land; „Wüste“ ist hier natürlich und passt zum Bild des vereinzelten Strauchs.
theological_decisions:
- issue: Deutung von עֲרוֹעֵר als Pflanze oder Ortsname
  choice: Im Haupttext als Wüstenstrauch verstanden
  alternative: „wie Aroër in der Wüste“
  rationale: Die Vergleichspartikel und die anschließende Ortsangabe begünstigen das Bild einer Wüstenpflanze; die mögliche Lesart als Ortsname bleibt jedoch ausdrücklich in einer Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knappen Imperativen und würdigem biblischem Ton. Die Wiederholung von „Wüstenstrauch“ und „Wüste“ ist im Deutschen leicht markiert, bewahrt aber Bild und Ortsangabe des Hebräischen; botanische und geografische Unsicherheit werden nicht im Haupttext aufgelöst, sondern in den Fußnoten offengelegt.
