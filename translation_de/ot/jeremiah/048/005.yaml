source:
  edition: WLC
  text: כִּ֚י מַעֲלֵ֣ה ה/לחות בִּ/בְכִ֖י יַֽעֲלֶה בֶּ֑כִי כִּ֚י בְּ/מוֹרַ֣ד חוֹרֹנַ֔יִם צָרֵ֥י צַֽעֲקַת שֶׁ֖בֶר שָׁמֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/005.yaml
  text: For on the ascent of Luhith they go up with weeping[b][a]; for on the descent of Horonaim they have heard the distressing cry of destruction.
translation:
  language: de
  text: Denn den Anstieg nach Luhit steigt man unter Weinen hinauf – unter Weinen.[a] Denn am Abstieg von Horonajim haben sie den bedrängenden Schrei der Zerstörung gehört.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Hebräischen wird das Wort »Weinen« zur Verstärkung wiederholt; wörtlicher: »Unter Weinen steigt er oder steigt man hinauf – Weinen.«'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Wortlaut ist hier schwierig. Man kann auch wörtlicher verstehen: »Die Feinde haben einen Schrei der Zerstörung gehört.«'
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה
  choice: Anstieg
  rationale: Bezeichnet einen ansteigenden Weg beziehungsweise eine Anhöhe und bildet den topografischen Gegensatz zu מוֹרַד, dem »Abstieg«.
- source_word: הַלֻּחוֹת
  choice: Luhit
  rationale: Im Zusammenhang ist die Form als Ortsname zu verstehen; der Name wird in üblicher deutscher Form wiedergegeben.
- source_word: בִּבְכִי ... בֶּכִי
  choice: unter Weinen ... weinend
  rationale: Die Wiederholung des Substantivs verstärkt die Klage. Die leicht variierte deutsche Wiedergabe erhält diese Wiederholung, ohne unnötig schwerfällig zu klingen.
- source_word: יַעֲלֶה
  choice: steigen sie ... hinauf
  rationale: Die morphologische Einzahl kann unpersönlich oder kollektiv gebraucht sein; im Zusammenhang sind die fliehenden Menschen aus Moab gemeint.
- source_word: בְּמוֹרַד
  choice: am Abstieg
  rationale: Bewahrt die topografische Bedeutung und den bewussten Gegensatz zum »Anstieg« im ersten Satzteil.
- source_word: חוֹרֹנַיִם
  choice: Horonajim
  rationale: Der Ortsname wird nach geläufiger deutscher Umschrift wiedergegeben.
- source_word: צָרֵי
  choice: angstvollen
  rationale: 'Die schwierige Form wird im Haupttext als nähere Bestimmung des Schreis verstanden: Es ist ein von Bedrängnis geprägter Schrei. Die mögliche Deutung als »Feinde« wird in einer Fußnote offengelegt.'
- source_word: צַעֲקַת
  choice: Schrei
  rationale: Gibt den lauten Hilferuf oder Aufschrei knapp und natürlich wieder.
- source_word: שֶׁבֶר
  choice: Zerstörung
  rationale: Bezeichnet im prophetischen Gerichtszusammenhang Zusammenbruch, Verderben oder Vernichtung; »Zerstörung« ist im modernen Deutsch klar.
- source_word: שָׁמֵעוּ
  choice: haben sie ... gehört
  rationale: Bewahrt die dritte Person Plural und gibt das hebräische Perfekt in diesem lebhaften Bericht idiomatisch wieder.
theological_decisions:
- issue: Subjekt und syntaktische Funktion von צָרֵי im zweiten Satzteil
  choice: 'Als Beschreibung des Schreis: »den angstvollen Schrei«'
  alternative: 'Als Subjekt: »Die Feinde haben einen Schrei der Zerstörung gehört«'
  rationale: Die hebräische Form und Syntax sind schwierig. Der Zusammenhang und die Parallele in Jesaja 15,5 stützen eine Beschreibung der Bedrängnis; die alternative, formal mögliche Deutung wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ortsnamen und das topografische Gegensatzpaar »Anstieg/Abstieg« bleiben deutlich. Die auffällige Wiederholung von »Weinen« wird im Text hörbar gemacht und in der Fußnote erläutert; die syntaktische Unsicherheit des zweiten Satzteils wird nicht stillschweigend aufgelöst.
