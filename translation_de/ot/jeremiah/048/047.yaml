base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
translation:
  language: de
  text: Doch in den letzten Tagen werde ich Moabs Geschick wenden[a], spricht Jahwe. Bis hierher das Gericht über Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich Moab aus der Gefangenschaft zurückbringen“. Die hebräische Wendung kann eine Rückkehr aus der Gefangenschaft oder allgemeiner die Wiederherstellung des Wohlergehens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי שְׁבוּת
  choice: Doch … werde ich … Geschick wenden
  rationale: Die feste Verbindung mit שוב und שׁבות bezeichnet die Umkehr einer Notlage beziehungsweise die Wiederherstellung früheren Wohlergehens. „Geschick wenden“ bildet die hebräische Wendung natürlich ab; „Doch“ macht im Zusammenhang den Gegensatz zur vorangehenden Gerichtsankündigung sichtbar.
- source_word: מוֹאָב
  choice: Moab
  rationale: Eingebürgerte deutsche Form des Volks- und Landesnamens.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: in der letzten Zeit
  rationale: Die Formulierung bewahrt den Zukunftsbezug und den möglichen endzeitlichen Klang, ohne genauer festzulegen, welchen geschichtlichen oder eschatologischen Zeitraum sie bezeichnet.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche und würdige Wiedergabe der feierlichen prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: עַד הֵנָּה
  choice: So weit reicht
  rationale: Die Wendung markiert den Abschluss des Moab-Orakels. In Verbindung mit „Gericht“ ist „So weit reicht“ im Deutschen verständlicher als das wörtlichere „Bis hierher“.
- source_word: מִשְׁפַּט מוֹאָב
  choice: das Gericht über Moab
  rationale: מִשְׁפַּט bezeichnet hier den gegen Moab ergangenen richterlichen Spruch beziehungsweise den Gerichtsabschnitt, nicht abstrakte Gerechtigkeit.
theological_decisions:
- issue: Reichweite und Zeitpunkt der verheißenen Wiederherstellung Moabs
  choice: Die Aussage wird als echte zukünftige Wende wiedergegeben, ohne deren geschichtlichen oder heilsgeschichtlichen Vollzug näher zu bestimmen.
  alternative: Die Aussage ausschließlich als politische Rückkehr aus der Gefangenschaft oder ausdrücklich als endzeitliche Aufnahme der Völker zu deuten.
  rationale: Der hebräische Text verheißt Moab eine künftige Wiederherstellung, erläutert aber weder ihren Mechanismus noch ihre genaue zeitliche oder theologische Einordnung. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und orakelhaft; die Schlussformel wird verständlich formuliert, ohne ihren Charakter als Abschluss des Moab-Gerichts zu verlieren.
