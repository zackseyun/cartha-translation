  source_fidelity: Die Wiedergabe von וְשַׁבְתִּי שְׁבוּת als „werde ich Moabs Geschick wenden“ trifft die idiomatische Wiederherstellungszusage gut und bewahrt mit der Fußnote die Alternative einer Rückkehr aus der Gefangenschaft. „Doch“ ist im Kontext als adversative Nuance vertretbar. „in der letzten Zeit“ gibt בְּאַחֲרִית הַיָּמִים jedoch zu unbestimmt und im Singular wieder; „in den letzten Tagen“ erhält die hebräische Pluralform und den möglichen endzeitlichen Klang besser. Die Schlussformel sollte als abschließende, bewusst knappe Orakelformel näher am Hebräischen bleiben.
  naturalness: „Moabs Geschick wenden“ und „spricht Jahwe“ sind natürliches, würdiges modernes Standarddeutsch. „Bis hierher das Gericht über Moab“ ist als bewusst elliptische Schlussformel verständlich und stilistisch angemessener als „So weit reicht das Gericht über Moab“, das im Deutschen unnötig nach räumlicher oder quantitativer Ausdehnung klingt.
  terminology: „Jahwe“, „Moab“ und „Gericht“ sind konsistent und sachgerecht. „Geschick wenden“ wahrt die offene Reichweite des hebräischen Idioms, ohne die Verheißung auf eine ausschließlich wörtliche Gefangenschaftsrückkehr festzulegen. Die Fußnote soll diese Ambiguität weiterhin ausdrücklich markieren.
