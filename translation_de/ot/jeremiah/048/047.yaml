    rationale: בְּאַחֲרִית הַיָּמִים lautet wörtlich „am Ende/ in der Folge der Tage“ und ist eine feste prophetische Zukunftsformel. Der Singular „letzten Zeit“ ist semantisch flacher; „in den letzten Tagen“ bewahrt Form, Resonanz und Offenheit besser.
