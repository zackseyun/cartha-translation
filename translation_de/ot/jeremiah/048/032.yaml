  text: מִ/בְּכִ֨י יַעְזֵ֤ר אֶבְכֶּה לָּ/ךְ֙ הַ/גֶּ֣פֶן שִׂבְמָ֔ה נְטִֽישֹׁתַ֨יִ/ךְ֙ עָ֣בְרוּ יָ֔ם עַ֛ד יָ֥ם יַעְזֵ֖ר נָגָ֑עוּ עַל קֵיצֵ֥/ךְ וְ/עַל בְּצִירֵ֖/ךְ שֹׁדֵ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
translation:
  language: de
  text: Mit dem Weinen um Jaser weine ich um dich[a], du Weinstock von Sibma. Deine Ranken[b] überquerten das Meer; bis zum Meer von Jaser[c] reichten sie. Über deine Sommerfrüchte und deine Weinlese ist der Verwüster hergefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Mehr als über Jaser weine ich um dich“; die Präposition am Versanfang kann einen Vergleich ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Schösslinge“ beziehungsweise „Triebe“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der hebräische Text lautet „bis zum Meer von Jaser“. Da Jaser im Landesinneren lag, verstehen manche dies als poetische Übertreibung; andere vermuten eine Textänderung und übersetzen etwa: „bis nach Jaser reichten sie“.'
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי יַעְזֵר
  choice: Mit dem Weinen um Jaser
  rationale: Die schwierige Präposition מִ־ wird als begleitende Verknüpfung des Weinens wiedergegeben; die mögliche komparative Bedeutung bleibt in einer Fußnote erhalten. Jaser ist hier am natürlichsten das Ziel der Klage.
- source_word: אֶבְכֶּה לָּךְ
  choice: weine ich um dich
  rationale: Das Imperfekt steht im poetischen Klagezusammenhang für gegenwärtiges Klagen; לְ bezeichnet dessen Gegenstand.
- source_word: הַגֶּפֶן שִׂבְמָה
  choice: du Weinstock von Sibma
  rationale: Die Wortgruppe wird als Anrede verstanden. „Weinstock“ erhält das Weinbergmotiv und klingt im Deutschen natürlicher als eine bloße Apposition.
- source_word: נְטִישֹׁתַיִךְ
  choice: deine Ranken
  rationale: Das seltene Substantiv bezeichnet die sich ausbreitenden Triebe eines Weinstocks. „Ranken“ bewahrt das Bild; „Schösslinge“ ist ebenfalls möglich.
- source_word: עָבְרוּ יָם
  choice: überquerten das Meer
  rationale: Die Wendung wird direkt und bildhaft wiedergegeben.
- source_word: עַד יָם יַעְזֵר נָגָעוּ
  choice: bis zum Meer von Jaser reichten sie
  rationale: Die masoretische Wortfolge wird ohne Konjektur bewahrt, obwohl die geografische Aussage schwierig ist.
- source_word: קֵיצֵךְ
  choice: deine Sommerfrüchte
  rationale: קֵיץ bezeichnet saisonal reife Früchte beziehungsweise Sommerobst; die formnahe Wiedergabe wahrt das Erntebild.
- source_word: בְּצִירֵךְ
  choice: deine Weinlese
  rationale: בָּצִיר bezeichnet im Weinbau die Traubenernte; „Weinlese“ ist die geläufige moderne Bezeichnung.
- source_word: שֹׁדֵד נָפָל
  choice: ist der Verwüster hergefallen
  rationale: שֹׁדֵד bezeichnet den Plünderer oder Verwüster. „herfallen über“ gibt נפל על im Deutschen idiomatisch und zugleich gewaltsam wieder.
theological_decisions:
- issue: Ob die schwierige Wendung „Meer von Jaser“ im Haupttext geglättet oder textkritisch geändert werden soll
  choice: Die masoretische Lesart „Meer von Jaser“ bleibt im Haupttext erhalten.
  alternative: „bis nach Jaser reichten sie“ aufgrund einer textkritischen Glättung oder abweichenden Segmentierung
  rationale: Die überlieferte hebräische Formulierung ist zwar geografisch schwierig, kann aber poetische Übertreibung sein. Eine conjecturale Lösung soll nicht unmarkiert in den Haupttext gelangen.
translation_notes:
  register: Moderne, würdige Klagesprache mit klarer Weinbergmetaphorik. Die ungewöhnliche Geografie des masoretischen Textes wird im Haupttext bewahrt und in der Fußnote erläutert; sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Wendungen.
