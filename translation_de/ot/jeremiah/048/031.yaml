review_pass:
  verdict: revise
  source_fidelity: Die erste Person Singular in אֲיֵלִיל und אֶזְעָק sowie die Wiederholung von Moab sind zutreffend wiedergegeben. כֻּלֹּה wird angemessen kollektiv mit „ganz Moab“ erfasst. Die schwierige dritte Person Singular יֶהְגֶּה wird mit dem unpersönlichen „man“ sinnvoll offen gehalten; die Fußnote dokumentiert die möglichen Subjektbezüge. Die Präposition אֶל im letzten Satzteil sollte im Deutschen jedoch nicht mit „um“ an ein Stöhnverb gebunden werden, da dies die intendierte Klagebeziehung nur schwer verständlich ausdrückt.
  naturalness: „Um ganz Moab werde ich laut schreien“ und besonders „Um die Männer von Kir-Heres stöhnt man“ sind im modernen Standarddeutsch semantisch und idiomatisch unerquicklich. „Über“ bildet den Anlass bzw. Gegenstand der Klage klarer ab und erhält zugleich die poetische Parallelität.
  terminology: „Wehklagen“ ist als gehobene, aber verständliche Wiedergabe von ילל passend. „laut aufschreien“ gibt זעק idiomatischer wieder als die Konstruktion „laut schreien“ und unterscheidet sich weiterhin von „wehklagen“. „Männer von Kir-Heres“ bewahrt אַנְשֵׁי. Die Schreibung „Kir-Heres“ und der Hinweis auf „Kir-Hareset“ sind angemessen.
