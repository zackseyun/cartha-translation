  text: עַל כֵּן֙ עַל מוֹאָ֣ב אֲיֵלִ֔יל וּ/לְ/מוֹאָ֥ב כֻּלֹּ֖/ה אֶזְעָ֑ק אֶל אַנְשֵׁ֥י קִֽיר חֶ֖רֶשׂ יֶהְגֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
translation:
  language: de
  text: Darum werde ich über Moab wehklagen, und über ganz Moab laut aufschreien. Über die Männer von Kir-Heres[a] stöhnt man.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Kir-Hareset“; in Parallelstellen begegnet eine verwandte, längere Form des Ortsnamens.
    reason: alternative_reading
  - marker: b
    text: 'Der letzte Satzteil ist schwer verständlich. Möglich sind auch: „Über die Männer von Kir-Heres stöhnt er“ oder, bei anderer Deutung des Subjekts, „Über die Männer von Kir-Heres stöhne ich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
  choice: werde ich … wehklagen
  rationale: Die Hifil-Form von ילל bezeichnet lautes, eindringliches Klagen. „Wehklagen“ bewahrt diese Intensität und passt zu einem würdevollen modernen Register.
- source_word: אֶזְעָק
  choice: werde ich laut schreien
  rationale: זעק bezeichnet einen lauten Ruf, häufig aus Not. „Laut schreien“ unterscheidet den Ausdruck vom vorhergehenden Wehklagen und erhält seine Dringlichkeit.
- source_word: כֻּלֹּה
  choice: ganz
  rationale: In Verbindung mit Moab bezeichnet die feminine Form die Gesamtheit des Landes beziehungsweise Volkes; „ganz Moab“ ist im Deutschen natürlich und kollektiv verständlich.
- source_word: אֶל
  choice: um
  rationale: Vor dem Verb des Stöhnens bezeichnet אֶל hier wahrscheinlich diejenigen, denen die Klage gilt. „Um“ gibt dieses Verhältnis im Deutschen idiomatisch wieder, ohne die schwierige Syntax weiter festzulegen.
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  choice: die Männer von Kir-Heres
  rationale: אַנְשֵׁי bedeutet wörtlich „Männer von“. Der Ortsname wird entsprechend der hier vorliegenden hebräischen Form als „Kir-Heres“ wiedergegeben.
- source_word: יֶהְגֶּה
  choice: stöhnt man
  rationale: הגה kann ein leises Äußern, Murmeln oder Stöhnen bezeichnen; im Klagezusammenhang passt „stöhnen“. Das unpersönliche „man“ lässt den im Hebräischen nicht eindeutig identifizierbaren maskulinen Singular offen.
theological_decisions:
- issue: Sprecher und Subjekt der Klage
  choice: Die ersten beiden Verben stehen ausdrücklich in der ersten Person; beim letzten Verb wird das Subjekt nicht identifiziert.
  alternative: 'Den Sprecher der ersten Sätze auch als Subjekt des letzten Verbs auffassen: „stöhne ich“.'
  rationale: Der masoretische Text hat am Ende יֶהְגֶּה in der dritten Person Singular und nicht eine Form der ersten Person. Die Übersetzung glättet diesen Wechsel nicht und vermeidet so eine unbelegte Identifizierung des Subjekts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wehklagen“ ist bewusst etwas gehoben, aber allgemein verständlich und bildet die Intensität des hebräischen Verbs ab. Die Wiederholung von „Moab“ und der Wechsel zwischen den Verben wurden erhalten; die Unklarheit des letzten Subjekts wird im Text und in der Fußnote sichtbar gemacht.
