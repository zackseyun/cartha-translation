revisions:
- from: Darum werde ich über Moab wehklagen, und um ganz Moab werde ich laut schreien. Um die Männer von Kir-Heres[a] stöhnt man.[b]
  to: Darum werde ich über Moab wehklagen, und über ganz Moab laut aufschreien. Über die Männer von Kir-Heres[a] stöhnt man.[b]
  rationale: Die Revision beschränkt sich auf sichere idiomatische Verbesserungen der Präpositionsverbindungen und auf „aufschreien“ als natürliche Wiedergabe eines lauten Notrufs. Der Wechsel zur nicht näher bestimmten dritten Person im Schlusssatz bleibt durch „man“ samt Fußnote erhalten.
