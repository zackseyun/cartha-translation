  text: עַ֣ל כָּל גַּגּ֥וֹת מוֹאָ֛ב וּ/בִ/רְחֹבֹתֶ֖י/הָ כֻּלֹּ֣/ה מִסְפֵּ֑ד כִּֽי שָׁבַ֣רְתִּי אֶת מוֹאָ֗ב כִּ/כְלִ֛י אֵֽין חֵ֥פֶץ בּ֖/וֹ נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
translation:
  language: de
  text: Auf allen Dächern Moabs und auf ihren Plätzen – überall ist Klage; denn ich habe Moab zerbrochen wie ein Gefäß, an dem niemand Gefallen findet[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wie ein Gefäß, an dem kein Gefallen ist“; auch möglich: „wie ein Gefäß, das niemand haben will“.'
    reason: Die hebräische Wendung אֵין חֵפֶץ בּוֹ kann fehlendes Gefallen, fehlendes Verlangen oder daraus folgend fehlenden Wert ausdrücken.
lexical_decisions:
- source_word: גַּגּוֹת
  choice: Dächern
  rationale: Das Wort bezeichnet die flachen Hausdächer, die im alten Vorderen Orient auch als Aufenthaltsorte dienten. „Dächer“ bewahrt das konkrete Bild in natürlichem Deutsch.
- source_word: רְחֹבֹתֶיהָ
  choice: ihren Plätzen
  rationale: רְחוֹב bezeichnet häufig breite öffentliche Flächen oder Stadtplätze. „Plätze“ passt zum öffentlichen Klagen und bildet mit den Dächern ein umfassendes Bild.
- source_word: כֻּלֹּה מִסְפֵּד
  choice: ist überall Klage
  rationale: Die knappe hebräische Formulierung besagt, dass das Ganze von Klage erfüllt ist. „Überall ist Klage“ gibt diesen umfassenden Sinn idiomatisch wieder.
- source_word: שָׁבַרְתִּי
  choice: ich habe … zerbrochen
  rationale: Das Perfekt stellt Jahwes Handeln als vollzogen dar; „zerbrochen“ erhält zugleich das Bild eines unbrauchbar gewordenen Gefäßes.
- source_word: כִּכְלִי
  choice: wie ein Gefäß
  rationale: כְּלִי kann Gefäß, Gerät oder Gegenstand bedeuten. Im Zusammenhang mit שׁבר ist „Gefäß“ ein natürliches und anschauliches Äquivalent.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: an dem niemand Gefallen hat
  rationale: Die Wendung lautet wörtlich etwa „an/in dem kein Gefallen ist“ und bezeichnet ein unerwünschtes oder wertlos gewordenes Gefäß. Die gewählte Form ist natürlich und lässt sowohl mangelndes Gefallen als auch mangelndes Begehren anklingen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht Jahwe“ ist eine würdige, geläufige Wiedergabe der prophetischen Botenformel und erhält den Gottesnamen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Sprecherwechsel in כִּי שָׁבַרְתִּי
  choice: denn ich habe Moab zerbrochen
  alternative: denn Moab ist zerbrochen worden
  rationale: Die erste Person Singular steht ausdrücklich im Hebräischen und wird bewahrt; die abschließende Botenformel identifiziert Jahwe als Sprecher.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache und der abrupte Wechsel zur Gottesrede bleiben erhalten; die komprimierte Aussage כֻּלֹּה מִסְפֵּד wird für heutige Leser natürlich entfaltet.
