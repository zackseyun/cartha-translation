  naturalness: Das Deutsch ist modern, verständlich und dem prophetischen Register angemessen. „Die Besten seiner jungen Männer sind zur Schlachtung hinabgestiegen“ ist ebenso natürlich wie „die Auslese“, wahrt aber besser die Pluralform des Ausgangstextes.
  terminology: „Jahwe der Heere“ gibt יהוה צבאות transparent und konsequent wieder. „Zur Schlachtung“ trifft לטבח ohne unnötige Konkretisierung. Die traditionelle Wiedergabe in Fußnote b ist zutreffend.
