source:
  edition: WLC
  text: שֻׁדַּ֤ד מוֹאָב֙ וְ/עָרֶ֣י/הָ עָלָ֔ה וּ/מִבְחַ֥ר בַּֽחוּרָ֖י/ו יָרְד֣וּ לַ/טָּ֑בַח נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: de
  text: Moab ist verwüstet, und gegen seine Städte ist man hinaufgezogen[a]. Die Besten seiner jungen Männer sind zur Schlachtung hinabgestiegen, spricht der König; Jahwe der Heere ist sein Name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und seine Städte – er ist hinaufgezogen“. Der knappe hebräische Wortlaut ist schwierig; er kann das Vorrücken eines nicht ausdrücklich genannten Angreifers gegen Moabs Städte meinen.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  choice: ist verwüstet
  rationale: Das Pual von שׁדד bezeichnet gewaltsames Verheeren oder Ausplündern. „Ist verwüstet“ gibt den passiven Ergebniszustand natürlich wieder, ohne die Bedeutung auf Plünderung zu verengen.
- source_word: וְעָרֶיהָ עָלָה
  choice: und gegen seine Städte ist man hinaufgezogen
  rationale: Die hebräische Wendung ist knapp und syntaktisch schwierig. Der Singular עָלָה lässt sich am ehesten mit einem ungenannten Angreifer als militärisches Hinaufziehen gegen die Städte verstehen. Die Fußnote bewahrt die formnähere, aber schwer verständliche Alternative.
- source_word: מִבְחַר בַּחוּרָיו
  choice: die Auslese seiner jungen Männer
  rationale: מִבְחַר bezeichnet das Ausgewählte beziehungsweise Beste. „Die Auslese“ bewahrt den substantivischen Ausdruck; das maskuline Suffix in בַּחוּרָיו wird passend zum grammatisch maskulinen Moab mit „seiner“ wiedergegeben.
- source_word: יָרְדוּ לַטָּבַח
  choice: ist zur Schlachtung hinabgestiegen
  rationale: „Hinabgestiegen“ erhält das anschauliche Bewegungsbild von ירד. Der kollektive Singular „Auslese“ verlangt im Deutschen „ist“; לַטָּבַח bezeichnet das Ziel beziehungsweise das ihnen bestimmte Geschick.
- source_word: נְאֻם
  choice: spricht
  rationale: Die übliche prophetische Botenformel wird in klarem, gegenwärtigem Deutsch mit „spricht“ wiedergegeben.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Der bestimmte Ausdruck ist hier ein göttlicher Titel; die Großschreibung von „König“ folgt der normalen deutschen Substantivschreibung und lässt den Titelcharakter erkennen.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen. „Der Heere“ ist im modernen Deutsch verständlicher als „der Heerscharen“ und wahrt die militärische beziehungsweise kosmische Weite von צְבָאוֹת.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die nominale hebräische Aussage wird in natürlicher deutscher Wortstellung wiedergegeben und unmittelbar auf den König bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה im Titel יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  alternative: der HERR der Heerscharen
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn traditionell durch einen Titel ersetzt; die traditionelle Fassung wird in der Fußnote genannt.
- issue: Bezug des Possessivsuffixes in בַּחוּרָיו
  choice: seiner jungen Männer
  alternative: ihrer jungen Männer
  rationale: Das hebräische Suffix ist maskulin Singular und bezieht sich grammatisch naheliegend auf das ebenfalls maskuline Moab. Eine feminine Wiedergabe wäre nur durch eine Personifikation als Stadt oder Land motiviert und ist im Deutschen nicht erforderlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzbewegung „hinaufgezogen … hinabgestiegen“ bewahrt den Kontrast des Hebräischen. Die schwierige erste Bewegungsangabe wird verständlich formuliert, ohne ihre Unsicherheit zu verschweigen.
