source:
  edition: WLC
  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֛י/ךָ יוֹשֵׁ֥ב מוֹאָ֖ב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
translation:
  language: de
  text: Schrecken, Grube und Schlinge kommen über dich, Bewohner Moabs[a] – so spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Dreierformel „Schrecken, Grube und Schlinge“ begegnet auch in Jesaja 24,17.
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  choice: Schrecken
  rationale: Das Substantiv bezeichnet Furcht oder Grauen; „Schrecken“ gibt im Gerichtskontext die starke Wirkung wieder und erhält den Klang der Dreierformel.
- source_word: פַחַת
  choice: Grube
  rationale: Gemeint ist eine Fanggrube, in die jemand stürzt. „Grube“ ist knapp und entspricht der parallelen Formel in Jesaja 24,17.
- source_word: פָח
  choice: Schlinge
  rationale: Das Wort bezeichnet eine Fangschlinge oder Falle. „Schlinge“ unterscheidet das Bild klar von der Grube.
- source_word: עָלֶיךָ
  choice: kommen über dich
  rationale: Die Präposition mit Suffix kann wörtlich „auf/über dir“ bedeuten; im Deutschen bringt „kommen über dich“ die hereinbrechende Bedrohung natürlich zum Ausdruck, ohne ihren Charakter näher festzulegen.
- source_word: יוֹשֵׁב מוֹאָב
  choice: Bewohner Moabs
  rationale: Das substantivierte Partizip im Singular dient als repräsentative Anrede an die Bevölkerung Moabs.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die feierliche prophetische Botenformel wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm; „Jahwe“ bewahrt den persönlichen Gottesnamen in einer im Deutschen geläufigen wissenschaftlichen Form.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die klanglich zugespitzte hebräische Dreierformel wird mit drei knappen Substantiven bewahrt; der repräsentative Singular der Anrede bleibt erhalten.
