id: JER.48.7
reference: Jeremiah 48:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֠י יַ֣עַן בִּטְחֵ֤/ךְ בְּ/מַעֲשַׂ֨יִ/ךְ֙ וּ/בְ/א֣וֹצְרוֹתַ֔יִ/ךְ גַּם אַ֖תְּ תִּלָּכֵ֑דִי וְ/יָצָ֤א כמיש בַּ/גּוֹלָ֔ה כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יחד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
translation:
  language: de
  text: Weil du auf deine Werke[a] und deine Schätze[b] vertraut hast, wirst auch du gefangen genommen werden. Kemosch[c] wird in die Verbannung[d] ziehen, zusammen mit seinen Priestern und seinen Würdenträgern[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Taten“ beziehungsweise „das, was du geschaffen hast“. Das hebräische Wort kann Werke, Handlungen oder Hervorgebrachtes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „deine Reichtümer“, „deine Schatzkammern“ oder „deine Vorratshäuser“.'
    reason: lexical_alternative
  - marker: c
    text: Kemosch war der Nationalgott Moabs.
    reason: cultural_note
  - marker: d
    text: 'Oder: „in die Gefangenschaft“.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „Fürsten“, „Obersten“ oder „Amtsträger“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יַעַן
  choice: Weil
  rationale: Die Verbindung unterstreicht den Grund für das angekündigte Gericht. Das deutsche „Weil“ gibt die kausale Aussage klar und natürlich wieder; ein zusätzliches „denn“ wäre hier unnötig schwerfällig.
- source_word: בִּטְחֵךְ
  choice: du ... vertraut hast
  rationale: Das Qal Perfekt 2. Person feminin Singular bezeichnet Moabs vorausgegangenes Vertrauen als Grund des Gerichts. Das Perfekt ist im Deutschen idiomatisch.
- source_word: בְּמַעֲשַׂיִךְ
  choice: auf deine Werke
  rationale: מַעֲשֶׂה kann Werke, Taten oder Hervorgebrachtes bezeichnen. „Werke“ bewahrt diese Bedeutungsbreite, ohne den Bezug vorschnell auf militärische, wirtschaftliche oder kultische Leistungen einzuengen.
- source_word: וּבְאֹצְרוֹתַיִךְ
  choice: und deine Schätze
  rationale: אֹצָר kann Schatz, Vorrat, Schatzkammer oder Speicher bezeichnen. Im Zusammenhang mit dem Vertrauen bezeichnet „Schätze“ am natürlichsten die angesammelten Reichtümer und Mittel.
- source_word: גַּם אַתְּ
  choice: auch du
  rationale: Die Formulierung bewahrt die nachdrückliche Einbeziehung Moabs in das angekündigte Gericht.
- source_word: תִּלָּכֵדִי
  choice: wirst ... gefangen genommen werden
  rationale: Das Nifal Imperfekt von לכד bezeichnet hier das Ergriffen- oder Eingenommenwerden. „Gefangen genommen“ passt zum militärischen Gerichtskontext und ist im modernen Deutsch verständlich.
- source_word: וְיָצָא
  choice: wird ... ziehen
  rationale: Obwohl die Form morphologisch ein Qatal ist, hat sie in der prophetischen Folge Zukunftsbezug. In Verbindung mit „in die Verbannung“ drückt „ziehen“ die erzwungene Wegführung natürlich aus.
- source_word: כמיש
  choice: Kemosch
  rationale: Der Eigenname des moabitischen Nationalgottes wird in geläufiger deutscher Umschrift wiedergegeben.
- source_word: בַּגּוֹלָה
  choice: in die Verbannung
  rationale: Die Wendung bezeichnet die deportierende Wegführung ins Exil. „In die Verbannung“ gibt sowohl die Bewegung als auch den Zustand wieder.
- source_word: כֹּהֲנָיו
  choice: seinen Priestern
  rationale: Das maskuline Suffix bezieht sich auf den personifiziert dargestellten Kemosch; daher bleibt der personale Bezug im Deutschen erhalten.
- source_word: וְשָׂרָיו
  choice: und seinen Würdenträgern
  rationale: שַׂר kann Fürst, Oberster, Herrscher oder Amtsträger bedeuten. „Würdenträger“ ist breit genug für die führenden Vertreter des kultisch-staatlichen Umfelds, ohne eine bestimmte Amtsform festzulegen.
- source_word: יַחַד
  choice: zusammen mit
  rationale: Die Formulierung macht deutlich, dass Kemosch, seine Priester und seine Würdenträger gemeinsam weggeführt werden.
theological_decisions:
- issue: Referenz und Darstellung Kemoschs
  choice: Kemosch wird als benannter moabitischer Gott dargestellt, der mit seinen Priestern und Würdenträgern in die Verbannung zieht.
  alternative: Kemosch als Ortsname oder dynastischer Titel
  rationale: Der unmittelbare Kontext spricht für den moabitischen Nationalgott. Die personifizierte Darstellung seiner Verbannung bewahrt die polemische Aussage des Textes, ohne sie durch zusätzliche dogmatische Deutung auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede Moabs bleibt durch „du“ erhalten. Der Satzbau ist klar und gegenwärtig, während die Bildsprache von Gefangennahme und Verbannung sowie die personifizierte Niederlage Kemoschs bewahrt werden.
