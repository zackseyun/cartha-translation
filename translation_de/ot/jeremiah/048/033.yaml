source:
  edition: WLC
  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
translation:
  language: de
  text: Freude und Jubel sind aus dem Fruchtland[a] und aus dem Land Moab weggenommen. Ich habe den Wein in den Keltern versiegen lassen. Niemand wird die Trauben unter Jubelruf[b] treten; ein Ruf, ein Ruf – kein Jubelruf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem fruchtbaren Feld“. Das hebräische Wort karmel bezeichnet hier fruchtbares, kultiviertes Land und nicht den Eigennamen Karmel.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der festliche Ruf beim Traubentreten oder bei der Ernte.
    reason: cultural_note
  - marker: c
    text: 'Der letzte Satz ist im Hebräischen knapp und mehrdeutig, wörtlich etwa: „Ruf, Ruf – kein Ruf.“ Die Formel besagt, dass der erwartete freudige Ruf der Weinlese nicht mehr erklingt; sie legt die Art eines etwaigen anderen Rufs nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  choice: sind ... weggenommen
  rationale: Das Nifal von אסף kann ein Einsammeln oder Wegnehmen bezeichnen. Im Zusammenhang des Gerichts, in dem Freude und Jubel verschwinden, gibt „weggenommen“ den gemeinten Verlust natürlich und präzise wieder.
- source_word: שִׂמְחָה וָגִיל
  choice: Freude und Jubel
  rationale: Die beiden nahezu synonymen Begriffe werden unterschieden wiedergegeben; „Jubel“ bewahrt bei גיל den hörbaren, festlichen Charakter.
- source_word: כַּרְמֶל
  choice: Fruchtland
  rationale: כרמל ist hier kein Eigenname, sondern bezeichnet fruchtbares, kultiviertes Land. „Fruchtland“ ist knapp, verständlich und passt zum landwirtschaftlichen Zusammenhang.
- source_word: יַיִן מִיקָבִים הִשְׁבַּתִּי
  choice: Dem Wein in den Keltern habe ich ein Ende gemacht
  rationale: Die Formulierung bewahrt die erste Person des göttlichen Sprechers und gibt den Hifil von שבת als verursachtes Aufhören wieder. „Keltern“ bezeichnet die Anlagen beziehungsweise Behälter der Weinbereitung.
- source_word: יִדְרֹךְ
  choice: wird ... die Trauben treten
  rationale: דרך bezeichnet in diesem Zusammenhang das Keltern durch Treten. Das im Hebräischen unausgesprochene Objekt wird im Deutschen ergänzt, damit der Vorgang eindeutig und natürlich verständlich ist.
- source_word: הֵידָד
  choice: Jubelruf
  rationale: Das Wort bezeichnet hier den lauten Ruf beim Keltern beziehungsweise bei der Ernte. „Jubelruf“ bringt diese festliche Bedeutung im Haupttext zum Ausdruck.
- source_word: הֵידָד הֵידָד לֹא הֵידָד
  choice: der Ruf ist kein Jubelruf
  rationale: 'Die knappe, rhetorische Wiederholung und Verneinung bleibt erkennbar: Ein Ruf mag ertönen, doch er ist nicht mehr der erwartete freudige Ruf der Weinlese.'
theological_decisions:
- issue: Sprecher der ersten Person Singular in הִשְׁבַּתִּי
  choice: Die erste Person bleibt als „ich“ erhalten und wird im Zusammenhang als Rede des HERRN verstanden.
  alternative: Eine nicht näher bestimmte prophetische oder erzählende Stimme.
  rationale: Der umgebende Gerichtspruch weist auf den HERRN als Sprecher. Der Haupttext bewahrt jedoch lediglich die grammatische erste Person und fügt keine ausdrückliche Sprecherbezeichnung ein.
- issue: Deutung des letzten הֵידָד
  choice: Der letzte Ruf wird als ein Ruf verstanden, der nicht mehr der freudige Jubelruf der Weinlese ist.
  alternative: Alle Vorkommen lediglich formal und ohne Bedeutungsunterscheidung als „Ruf“ wiederzugeben.
  rationale: Die verneinende Wortfolge erzeugt bewusst Spannung. Die Übersetzung bewahrt sie, ohne festzulegen, ob der verbleibende Ruf ein Kriegs-, Klage- oder anderer Schreckensruf ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fruchtland“ hält den landwirtschaftlichen Sinn von כרמל fest, ohne einen Ortsnamen anzunehmen. Das explizite „die Trauben“ erleichtert das Verständnis des Keltervorgangs. Die Schlussformulierung bewahrt die rhetorische Spannung des Hebräischen und vermeidet eine unnötige Festlegung auf die Art des verbleibenden Rufes.
