lexical_decisions:
- source_word: נִשְׁבְּרָה
  choice: ist zerschmettert
  rationale: Das Nifal bezeichnet hier Moabs gewaltsames Zerbrechen beziehungsweise seinen vernichtenden Zusammenbruch; „zerschmettert“ gibt die Bildkraft im Deutschen knapp wieder.
- source_word: הִשְׁמִיעוּ זְּעָקָה
  choice: haben einen Schrei hören lassen
  rationale: Die Hifil-Form bedeutet wörtlich, etwas hörbar zu machen. Die Form kann morphologisch auch als Aufforderung verstanden werden, doch im Satzgefüge liegt die Lesart als 3. Person Plural nahe.
- source_word: צְעוּרֶיהָ
  choice: seine Kleinen
  rationale: Der Ausdruck bezeichnet die Kleinen beziehungsweise Jungen Moabs. Die bewusst offene Bezeichnung vermeidet eine unbelegte Festlegung ausschließlich auf Kleinkinder.
