  text: 'Wie könnt ihr sagen: »Wir sind Krieger, tapfere Männer für den Kampf«?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵיךְ תֹּאמְרוּ
  choice: Wie könnt ihr sagen
  rationale: Die modale Formulierung gibt die ungläubig-tadelnde Kraft der rhetorischen Frage natürlich wieder; תֹּאמְרוּ ist 2. Person Plural.
- source_word: גִּבּוֹרִים
  choice: Helden
  rationale: Bezeichnet hier starke beziehungsweise herausragende Kämpfer. „Helden“ bewahrt die prahlerische Selbstbezeichnung und vermeidet eine unnötige Wiederholung von „Männer“.
- source_word: וְאַנְשֵׁי חַיִל
  choice: kampferprobte Männer
  rationale: חַיִל bezeichnet in diesem militärischen Zusammenhang Tüchtigkeit, Stärke oder Tapferkeit. „Kampferprobt“ vermittelt die behauptete militärische Befähigung in natürlichem Deutsch.
- source_word: לַמִּלְחָמָה
  choice: für die Schlacht
  rationale: Das Präfix ל bezeichnet hier Eignung oder Bestimmung; „für die Schlacht“ hält die martialische Zuspitzung fest.
