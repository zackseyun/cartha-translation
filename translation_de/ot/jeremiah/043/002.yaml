  to: 'Da sagten Asarja, der Sohn Hoschajas, Johanan, der Sohn Kareachs, und alle vermessenen Männer zu Jeremia: »Du redest Lügen! Der HERR, unser Gott, hat dich nicht gesandt, um zu sagen: ›Ihr sollt nicht nach Ägypten gehen, um dort als Fremde zu leben.‹«'
  rationale: Die Revision entfernt den nicht ausdrücklich im Ausgangstext enthaltenen Zusatz „mit der Botschaft“ und stellt die Konstruktion „hat dich nicht gesandt, um zu sagen“ wieder her. Zudem wird das neutrale „gehen“ für die Bewegung nach Ägypten verwendet. Die direkte, nachdrückliche Lügenanschuldigung, die wertende Bezeichnung der Sprecher, der Gottesname und der Sinn von גור als Leben/Aufenthalt von Fremden bleiben erhalten.
