  text: וַ/יֹּ֨אמֶר עֲזַרְיָ֤ה בֶן הוֹשַֽׁעְיָה֙ וְ/יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל הָ/אֲנָשִׁ֖ים הַ/זֵּדִ֑ים אֹמְרִ֣ים אֶֽל יִרְמְיָ֗הוּ שֶׁ֚קֶר אַתָּ֣ה מְדַבֵּ֔ר לֹ֣א שְׁלָחֲ/ךָ֞ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹֽא תָבֹ֥אוּ מִצְרַ֖יִם לָ/ג֥וּר שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/002.yaml
  text: Azariah son of Hoshaiah, Johanan son of Kareah, and all the arrogant men said to Jeremiah, “You are speaking a lie. The LORD our God has not sent you to say, ‘You must not go to Egypt to sojourn there.’”
translation:
  language: de
  text: 'Da sagten Asarja, der Sohn Hoschajas, Johanan, der Sohn Kareachs, und alle vermessenen Männer zu Jeremia: »Du redest Lügen! Der HERR, unser Gott, hat dich nicht gesandt, um zu sagen: ›Ihr sollt nicht nach Ägypten gehen, um dort als Fremde zu leben.‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַזֵּדִים
  choice: die vermessenen Männer
  rationale: Das Wort bezeichnet anmaßende, überhebliche Menschen. »Vermessen« bewahrt sowohl die moralische Wertung als auch den gehobenen, aber verständlichen Ton.
- source_word: שֶׁקֶר אַתָּה מְדַבֵּר
  choice: Du redest eine Lüge
  rationale: Die direkte, emphatische Anschuldigung des Hebräischen wird bewahrt; sie ist stärker als lediglich »Du irrst dich«.
- source_word: לֹא תָבֹאוּ מִצְרַיִם
  choice: Ihr dürft nicht nach Ägypten ziehen
  rationale: Der negierte Imperfekt steht hier als wiedergegebene Untersagung. »ziehen« bezeichnet natürlich den Ortswechsel nach Ägypten, ohne einen bloßen Kurzbesuch nahezulegen.
- source_word: לָגוּר שָׁם
  choice: um dort als Fremde zu leben
  rationale: גור meint den Aufenthalt als nicht einheimischer Schutzbürger bzw. Fremder. Die Formulierung erhält diesen sozialen Bedeutungsanteil besser als das unspezifische »wohnen«.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen wird verwendet.
theological_decisions:
- issue: Anspruch auf göttliche Sendung
  choice: Der HERR, unser Gott, hat dich nicht mit der Botschaft gesandt
  alternative: Der HERR, unser Gott, hat dich nicht gesandt, zu sagen
  rationale: Die gewählte Fassung macht deutlich, dass die Männer Jeremias konkreten Sendungsauftrag bestreiten, ohne zu beurteilen, ob ihre Behauptung wahr ist.
- issue: Stärke des Verbots
  choice: Ihr dürft nicht
  alternative: Ihr sollt nicht / Ihr müsst nicht
  rationale: Im Kontext gibt לֹא mit dem Imperfekt ein Verbot wieder. »Ihr dürft nicht« drückt dies im modernen Deutsch eindeutig aus; »ihr müsst nicht« könnte fälschlich bloße Wahlfreiheit bedeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede und klarer Satzführung. Die Namensformen folgen geläufiger deutscher Bibelorthografie. Die scharfe Anklage und die negative Charakterisierung der Sprecher bleiben erhalten.
