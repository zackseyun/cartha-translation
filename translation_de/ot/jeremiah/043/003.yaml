  text: כִּ֗י בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה מַסִּ֥ית אֹתְ/ךָ֖ בָּ֑/נוּ לְמַעַן֩ תֵּ֨ת אֹתָ֤/נוּ בְ/יַֽד הַ/כַּשְׂדִּים֙ לְ/הָמִ֣ית אֹתָ֔/נוּ וּ/לְ/הַגְל֥וֹת אֹתָ֖/נוּ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/003.yaml
  text: For Baruch son of Neriah is inciting you against us[a], in order to give us into the hand of the Chaldeans[c][b], to put us to death and to carry us away into exile to Babylon.
translation:
  language: de
  text: Denn Baruch, der Sohn Nerijas, hetzt dich gegen uns auf[a], damit du uns den Chaldäern auslieferst[b], damit wir getötet und nach Babel verschleppt werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stachelt dich gegen uns auf“; „verleitet dich, gegen uns vorzugehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „uns in die Hand der Chaldäer geben“; gemeint ist: uns ihrer Gewalt ausliefern.'
    reason: cultural_note
  - marker: c
    text: 'Oder: „nach Babel ins Exil geführt“; „nach Babel deportiert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Weigerung beziehungsweise Anschuldigung ein und wahrt den argumentativen Anschluss.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruch, der Sohn Nerijas
  rationale: Gibt Namen und Patronymikon in geläufiger deutscher Bibelsprache klar wieder.
- source_word: מַסִּית אֹתְךָ בָּנוּ
  choice: hetzt dich gegen uns auf
  rationale: Das Hifil-Partizip von סות bezeichnet feindseliges Anstiften oder Aufreizen; die deutsche Wendung bewahrt sowohl den fortdauernden Charakter als auch die Richtung gegen die Sprecher.
- source_word: לְמַעַן תֵּת אֹתָנוּ
  choice: damit du uns ... gibst
  rationale: לְמַעַן markiert hier den unterstellten Zweck. Zusammen mit בְיַד wird נתן quellennah als Übergabe in fremde Gewalt ausgedrückt.
- source_word: בְיַד הַכַּשְׂדִּים
  choice: in die Hand der Chaldäer
  rationale: Bewahrt das hebräische Bild von der Hand als Macht- und Verfügungsbereich; eine Fußnote erläutert das Idiom.
- source_word: לְהָמִית אֹתָנוּ
  choice: sodass sie uns töten
  rationale: 'Der Hifil-Infinitiv von מות bezeichnet das Herbeiführen des Todes. Im Deutschen macht das ergänzte Subjekt den natürlichen Sinn deutlich: Die Chaldäer wären die Vollstrecker.'
- source_word: וּלְהַגְלוֹת אֹתָנוּ בָּבֶל
  choice: und nach Babel verschleppen
  rationale: Der Hifil von גלה bezeichnet erzwungene Wegführung ins Exil. „Verschleppen“ verbindet Zwang und Ortsveränderung in natürlichem Deutsch; Babel ist das Ziel.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Wendung „in die Hand“ bleibt im Haupttext erhalten und wird erklärt. „Hetzt ... auf“ gibt die feindselige Anschuldigung kräftig, aber allgemein verständlich wieder. Die finale Infinitivfolge wird mit „sodass sie“ idiomatisch entfaltet, ohne die von den Sprechern behauptete Absicht abzuschwächen.
