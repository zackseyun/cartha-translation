source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶ֣רֶץ מִצְרַ֔יִם כִּ֛י לֹ֥א שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה וַ/יָּבֹ֖אוּ עַד תַּחְפַּנְחֵֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/007.yaml
  text: So they entered the land of Egypt[a], for they did not listen to the voice of Yahweh, and they came as far as Tahpanhes.
translation:
  language: de
  text: So kamen sie in das Land Ägypten, denn sie hörten nicht auf Jahwes Stimme[a], und sie kamen bis nach Tachpanhes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn sie gehorchten Jahwe nicht“. Die hebräische Wendung „auf die Stimme hören“ kann bedeuten, einer Stimme gehorsam zu folgen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶרֶץ מִצְרַיִם
  choice: So kamen sie in das Land Ägypten
  rationale: בוא kann „kommen“ oder „hineingehen“ bedeuten. Mit אֶרֶץ מִצְרַיִם gibt „in das Land Ägypten kommen“ sowohl die Bewegung in das Gebiet als auch die ausdrückliche Nennung des „Landes“ natürlich wieder.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung ihres Handelns ein; „denn“ bewahrt den erklärenden Zusammenhang.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: sie hörten nicht auf die Stimme
  rationale: Die Formulierung bewahrt das hebräische Bild und ist im Deutschen zugleich als verweigerter Gehorsam verständlich, ohne den Ausdruck auf nur eine Bedeutungsnuance festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen geläufige Umschrift.
- source_word: וַיָּבֹאוּ עַד
  choice: sie kamen bis nach
  rationale: עַד bezeichnet hier das erreichte Ziel beziehungsweise die räumliche Ausdehnung bis zu einem Ort; bei Ortsnamen ist „bis nach“ idiomatisches Deutsch.
- source_word: תַּחְפַּנְחֵס
  choice: Tachpanhes
  rationale: Der Ortsname wird in seiner im Deutschen gebräuchlichen, am Hebräischen orientierten Form transkribiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. Die Umschrift „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf die Stimme hören
  alternative: gehorchen
  rationale: Das hebräische Idiom schließt Gehorsam ein, verwendet aber ausdrücklich das Bild des Hörens. Die Hauptfassung bewahrt dieses Bild; die Fußnote nennt die sinngemäße Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzverknüpfung folgt dem knappen Erzählfluss des Hebräischen; das wiederholte „sie kamen“ bleibt erhalten.
