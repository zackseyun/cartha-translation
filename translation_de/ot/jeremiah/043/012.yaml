source:
  edition: WLC
  text: וְ/הִצַּ֣תִּי אֵ֗שׁ בְּ/בָתֵּי֙ אֱלֹהֵ֣י מִצְרַ֔יִם וּ/שְׂרָפָ֖/ם וְ/שָׁבָ֑/ם וְ/עָטָה֩ אֶת אֶ֨רֶץ מִצְרַ֜יִם כַּ/אֲשֶׁר יַעְטֶ֤ה הָֽ/רֹעֶה֙ אֶת בִּגְד֔/וֹ וְ/יָצָ֥א מִ/שָּׁ֖ם בְּ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/012.yaml
  text: And he will set fire to the temples of the gods of Egypt[a], and he will burn them and carry them away. He will wrap himself in the land of Egypt as a shepherd wraps himself in his garment[b], and he will go out from there in peace.
translation:
  language: de
  text: Ich werde in den Tempeln der Götter Ägyptens Feuer anzünden[a]. Er wird sie verbrennen und wegführen[b]. Er wird sich mit dem Land Ägypten umhüllen, wie ein Hirte sich in sein Gewand hüllt, und von dort in Frieden fortziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Ich werde in den Tempeln der Götter Ägyptens Feuer anzünden.“ Wegen des Zusammenhangs kann auch Nebukadnezar als fortlaufendes Subjekt verstanden werden: „Er wird in den Tempeln … Feuer anzünden.“'
    reason: Der masoretische Text hat die 1. Person Singular, während die folgenden Verben in der 3. Person Singular stehen.
  - marker: b
    text: Das hebräische Wort kann auch „gefangen wegführen“ bedeuten. Gemeint sein können die Götter, ihre Bilder oder die Schätze ihrer Tempel.
    reason: Das Verb und sein pluralisches Objekt lassen den genauen Gegenstand des Wegführens offen.
lexical_decisions:
- source_word: וְהִצַּתִּי אֵשׁ
  choice: Ich werde Feuer … legen
  rationale: Die masoretische Form ist eindeutig 1. Person Singular und wird im Haupttext bewahrt. „Feuer an etwas legen“ gibt die kausative Bedeutung idiomatisch und würdig wieder.
- source_word: בְּבָתֵּי אֱלֹהֵי מִצְרַיִם
  choice: an die Tempel der Götter Ägyptens
  rationale: בָּתִּים bedeutet wörtlich „Häuser“, bezeichnet bei Gottheiten hier jedoch deren Tempel. Die Präposition wird gemäß der natürlichen deutschen Verbindung „Feuer an etwas legen“ wiedergegeben.
- source_word: וּשְׂרָפָם
  choice: Er wird sie verbrennen
  rationale: Das pluralische Suffix wird mit „sie“ wiedergegeben, ohne seinen genauen Bezug über den Text hinaus festzulegen.
- source_word: וְשָׁבָם
  choice: und fortschleppen
  rationale: שבה bezeichnet das Gefangennehmen oder Wegführen. „Fortschleppen“ lässt offen, ob Götterbilder, Kultgegenstände oder Tempelschätze gemeint sind, und vermeidet die unnatürliche Aussage, Tempel würden gefangen genommen.
- source_word: וְעָטָה אֶת אֶרֶץ מִצְרַיִם
  choice: Er wird sich mit dem Land Ägypten umhüllen
  rationale: Die ungewöhnliche Kleidungsmetapher wird bewusst erhalten und nicht als bloße Eroberung paraphrasiert.
- source_word: כַּאֲשֶׁר יַעְטֶה הָרֹעֶה אֶת בִּגְדוֹ
  choice: wie ein Hirte sich in sein Gewand hüllt
  rationale: Die Wiederholung desselben hebräischen Verbs wird durch die verwandten deutschen Verben „umhüllen“ und „hüllen“ hörbar gehalten; „Gewand“ ist eine natürliche, allgemeine Wiedergabe von בֶּגֶד.
- source_word: וְיָצָא מִשָּׁם בְּשָׁלוֹם
  choice: und von dort in Frieden fortziehen
  rationale: „In Frieden“ wahrt die Bedeutungsbreite von שָׁלוֹם, die hier auch eine sichere und unbehelligte Abreise einschließt.
theological_decisions:
- issue: Wechsel vom göttlichen Ich in וְהִצַּתִּי zu den folgenden Verben in der 3. Person Singular
  choice: Das „Ich“ des masoretischen Textes bleibt im Haupttext stehen; anschließend folgt „Er“ für den König von Babylon.
  alternative: „Er wird Feuer an die Tempel … legen“ und damit Nebukadnezar als durchgehendes Subjekt lesen.
  rationale: Die vorhandene hebräische Form lautet 1. Person Singular, während der unmittelbare Kontext und die folgenden Verben Nebukadnezar in der 3. Person beschreiben. Der unvermittelte Subjektwechsel kann den HERRN als eigentlichen Urheber und den König als sein Werkzeug darstellen. Da der Befund nicht sicher zu glätten ist, bleibt die Spannung im Haupttext erhalten; die kontextuell mögliche Vereinheitlichung wird in der Fußnote genannt.
- issue: Bezugswort der pluralischen Suffixe in וּשְׂרָפָם וְשָׁבָם
  choice: Das Pronomen „sie“ bleibt unbestimmt; eine Fußnote erläutert die möglichen konkreten Gegenstände des Fortschleppens.
  alternative: Die Götterbilder oder Tempelschätze ausdrücklich in den Haupttext einsetzen.
  rationale: Der hebräische Text nennt diese Gegenstände nicht ausdrücklich. Eine Festlegung im Haupttext würde die genuine Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die auffällige Kleidungsmetapher und der Wechsel von der ersten zur dritten Person werden nicht geglättet. Die Fußnotenmarker stehen jeweils unmittelbar an der betreffenden Textstelle.
