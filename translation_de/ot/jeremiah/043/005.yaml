revisions:
- from: Da nahm Jochanan, der Sohn Kareachs, zusammen mit allen Befehlshabern der Truppen den ganzen Rest Judas, der aus all den Völkern zurückgekehrt war, unter die man ihn vertrieben hatte,[a] um sich im Land Juda als Fremde niederzulassen[b] –
  to: Da nahm Jochanan, der Sohn Kareachs, zusammen mit allen Befehlshabern der Truppen den gesamten Rest Judas, der aus allen Völkern zurückgekehrt war, in die sie vertrieben worden waren,[a] um im Land Juda zu wohnen[b] –
  rationale: Die Revision bewahrt die narrative Fortführung, die militärische Bezeichnung, das Leitwort „Rest“ und den Zweckinfinitiv. Sie ersetzt die sozial stärker festlegende Haupttextwiedergabe von לָגוּר durch „wohnen“ und hält die mögliche spezifische Nuance in der Fußnote fest. Die pluralische passive Rückverweisung entspricht zugleich der hebräischen Form und verbessert die deutsche Verständlichkeit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:16:55Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die wesentlichen Lexeme sind zutreffend wiedergegeben. Die Formulierung „als Fremde niederzulassen“ legt jedoch für לָגוּר eine soziale Stellung fest, die der hebräische Text hier nicht ausdrücklich behauptet und die im eigenen Land Juda missverständlich sein kann. Außerdem stellt die Singularform „ihn“ den kollektiven „Rest“ weniger klar dar als eine plurale Rückverweisung auf die Personen, die der hebräische Plural שָׁבוּ / נִדְּחוּ nahelegt.
  naturalness: „Da nahm“, „Befehlshaber der Truppen“ und „Land Juda“ sind natürlich und registergerecht. Die Revision glättet die Bezugnahme auf die aus den Völkern zurückgekehrten Personen und vermeidet die im Deutschen unnötig starke Aussage, sie seien in Juda „Fremde“.
  terminology: „Jochanan“, „Kareach“, „Rest Judas“ und „Befehlshaber der Truppen“ sind angemessen. „Rest Judas“ bewahrt die für Jeremia bedeutsame Remnant-Terminologie. Die mögliche Fremdlings- bzw. abhängigen-Residenten-Nuance von גּוּר wird sachgerecht in der Fußnote geführt, statt sie im Haupttext zu überbestimmen.
  issues:
  - severity: medium
    issue: „als Fremde niederzulassen“ überbestimmt לָגוּר.
    rationale: גוּר kann den Aufenthalt als Fremder oder abhängiger Bewohner bezeichnen, bedeutet aber nicht zwingend, dass die Betroffenen hier als Fremde etikettiert werden. Da das Ziel das Land Juda ist, kann diese Wiedergabe besonders missverständlich sein. Die Nuance sollte als Alternative erläutert werden.
  - severity: low
    issue: Die Rückverweisung „unter die man ihn vertrieben hatte“ ist grammatisch möglich, aber weniger transparent.
    rationale: Das hebräische Verb steht im Plural und bezieht sich sachlich auf die Angehörigen des Restes. „in die sie vertrieben worden waren“ macht den Bezug zu den Völkern und die unbestimmte passive Handlung unmittelbar klar.
