base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/005.yaml
  text: Then Johanan son of Kareah[a], and all the commanders of the forces, took all the remnant of Judah who had returned from all the nations where they had been driven away[b], to sojourn in the land of Judah—
translation:
  language: de
  text: Da nahm Jochanan, der Sohn Kareachs, zusammen mit allen Befehlshabern der Truppen den gesamten Rest Judas, der aus allen Völkern zurückgekehrt war, in die sie vertrieben worden waren,[a] um im Land Juda zu wohnen[b] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die sie zerstreut worden waren“. Das hebräische Verb kann Vertreibung, Verbannung oder Zerstreuung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um sich im Land Juda als Fremde niederzulassen“. Das hebräische Verb kann das Wohnen als Fremder oder abhängiger Einwohner bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: Das narrative Waw führt die Handlung fort; „Da nahm“ gibt die zeitliche Erzählfolge natürlich wieder und bewahrt die Bedeutung von לקח.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Jochanan, der Sohn Kareachs
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Formen; das hebräische Patronym wird ausdrücklich wiedergegeben.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Befehlshaber der Truppen
  rationale: שָׂרֵי bezeichnet hier militärische Führer, der Plural חֲיָלִים die von ihnen geführten Truppen oder Streitkräfte.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: den ganzen Rest Judas
  rationale: „Rest“ bewahrt sowohl den zahlenmäßigen Sinn als auch das für Jeremia wichtige Motiv des übrig gebliebenen Volkes, ohne es auf „Überlebende“ zu verengen.
- source_word: אֲשֶׁר שָׁבוּ
  choice: der ... zurückgekehrt war
  rationale: Das Plusquamperfekt macht deutlich, dass die Rückkehr der Haupthandlung vorausging; der grammatische Singular richtet sich nach dem Kollektiv „Rest“.
- source_word: מִכָּל הַגּוֹיִם
  choice: aus all den Völkern
  rationale: Die Wendung gibt den Ausgangspunkt der Rückkehr knapp und idiomatisch wieder; „Völker“ entspricht גּוֹיִם im alttestamentlichen Kontext.
- source_word: אֲשֶׁר נִדְּחוּ שָׁם
  choice: unter die man ihn vertrieben hatte
  rationale: Das Niphal von נדח bezeichnet gewaltsames Forttreiben oder Zerstreuen. Die deutsche aktive unpersönliche Form ist natürlich und wahrt die Unbestimmtheit des Handelnden.
- source_word: לָגוּר
  choice: um sich ... als Fremde niederzulassen
  rationale: גור bezeichnet einen Aufenthalt als Fremder beziehungsweise Schutzbürger. Die Formulierung bewahrt diese soziale Nuance und gibt zugleich den Zweck des Zurückkehrens verständlich wieder.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: Dies ist die natürliche deutsche territoriale Bezeichnung für אֶרֶץ יְהוּדָה.
