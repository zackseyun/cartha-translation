base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/001.yaml
  text: And when Jeremiah had finished speaking to all the people all the words of Yahweh their God[a], with which Yahweh their God had sent him to them—all these words—
translation:
  language: de
  text: Und als Jeremia zu dem ganzen Volk alle Worte Jahwes, ihres Gottes, zu Ende gesprochen hatte, mit denen Jahwe, ihr Gott, ihn zu ihnen gesandt hatte – all diese Worte –
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Als … zu Ende gesprochen hatte
  rationale: Die Konstruktion aus וַיְהִי und כ mit dem Infinitiv von כלה leitet den nächsten Erzählabschnitt ein und bezeichnet eine abgeschlossene Handlung. Die deutsche Nebensatzkonstruktion gibt dies natürlich wieder.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: Gemeint ist die versammelte Gemeinschaft, zu der Jeremia spricht. „Das ganze Volk“ ist im Deutschen idiomatischer als „alle das Volk“ und bewahrt den kollektiven Sinn.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: alle Worte Jahwes
  rationale: דְּבָרִים bezeichnet hier die einzelnen prophetischen Worte; die konkrete Wiedergabe als „Worte“ bewahrt zugleich die spätere Wiederholung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text gebraucht den Gottesnamen JHWH. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵיהֶם
  choice: ihres Gottes / ihr Gott
  rationale: Obwohl אֱלֹהִים der Form nach pluralisch ist, ist es in Verbindung mit Jahwe eindeutig singularisch gemeint. Der Wechsel des Kasus folgt der deutschen Syntax.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם אֲלֵיהֶם
  choice: mit denen Jahwe, ihr Gott, ihn zu ihnen gesandt hatte
  rationale: Der Relativsatz bezieht sich auf die „Worte“. „Mit denen“ bewahrt den instrumentalen Zusammenhang zwischen Jeremias Sendung und den ihm aufgetragenen Worten; das Suffix an שְׁלָחוֹ bezeichnet Jeremia als den Gesandten.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: all diese Worte
  rationale: Die appositionelle Wiederholung wird erhalten, weil sie den umfassenden Charakter der übermittelten Botschaft betont. „Worte“ wahrt die lexikalische Verbindung zum vorausgehenden דִּבְרֵי.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen. Die Transliteration „Jahwe“ macht diese Namensform sichtbar und vermeidet die stillschweigende Ersetzung durch einen Titel.
- issue: Bezeichnung Jahwes als „ihr Gott“
  choice: Die zweifache Formulierung „Jahwe, ihr Gott“ wird inhaltlich bewahrt.
  alternative: Eine der beiden Formulierungen aus stilistischen Gründen kürzen.
  rationale: 'Die Wiederholung gehört zur theologischen Spannung des Zusammenhangs: Jahwe wird weiterhin als ihr Gott bezeichnet, obwohl das folgende Verhalten des Volkes seinem Wort widerspricht.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt wie im Hebräischen syntaktisch offen und führt unmittelbar in Vers 2 weiter. Gedankenstriche kennzeichnen die nachgestellte, nachdrückliche Wiederaufnahme „all diese Worte“, ohne sie zu glätten oder auszulassen.
