  text: קַ֣ח בְּ/יָדְ/ךָ֞ אֲבָנִ֣ים גְּדֹל֗וֹת וּ/טְמַנְתָּ֤/ם בַּ/מֶּ֨לֶט֙ בַּ/מַּלְבֵּ֔ן אֲשֶׁ֛ר בְּ/פֶ֥תַח בֵּית פַּרְעֹ֖ה בְּ/תַחְפַּנְחֵ֑ס לְ/עֵינֵ֖י אֲנָשִׁ֥ים יְהוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/009.yaml
  text: Take large stones in your hand and hide them in the mortar[a], in the brick pavement that is at the entrance of Pharaoh’s house in Tahpanhes[c][b], before the eyes of the Jewish men.
translation:
  language: de
  text: Nimm große Steine in die Hand und verbirg sie im Mörtel[a], in dem Ziegelpflaster[b] am Eingang des Hauses des Pharaos in Tachpanhes, vor den Augen jüdischer Männer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vergrabe sie“. Das hebräische Verb kann ein Verbergen bezeichnen, bei dem etwas in den Boden oder in ein Bauwerk eingelassen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ziegelwerk“, „Ziegelterrasse“, möglicherweise auch „Ziegelofen“. Das hebräische Wort ist selten; welche bauliche Anlage genau gemeint ist, bleibt unsicher.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „judäischer Männer“. Das hebräische Eigenschaftswort kann ethnisch „jüdisch“ oder genauer auf Menschen aus Juda bezogen verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בְּיָדְךָ
  choice: Nimm … in die Hand
  rationale: Der Imperativ wird unmittelbar wiedergegeben; die im Deutschen idiomatische Wendung bewahrt zugleich das hebräische Singularwort „Hand“.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: große Steine
  rationale: Klare, gegenwärtige Wiedergabe der Größenangabe ohne archaischen Klang.
- source_word: וּטְמַנְתָּם
  choice: und verbirg sie
  rationale: טמן bezeichnet das Verbergen, häufig durch Einlegen oder Eingraben. „Verbirg“ wahrt den weiteren Sinn, ohne die Art des Verbergens vorschnell auf ein Vergraben festzulegen.
- source_word: בַּמֶּלֶט
  choice: im Mörtel
  rationale: Im baulichen Zusammenhang bezeichnet מלט am ehesten Mörtel oder ein entsprechendes Bindematerial. „Mörtel“ ist sachgerecht und vermeidet die modernere Vorstellung von Zement.
- source_word: בַּמַּלְבֵּן
  choice: in dem Ziegelpflaster
  rationale: Das seltene Wort מַלְבֵּן bezeichnet hier wahrscheinlich eine aus Ziegeln bestehende Anlage am Eingang. „Ziegelpflaster“ passt zum Ort und zum Einbetten der Steine in Mörtel; die genaue Bauform bleibt jedoch unsicher.
- source_word: אֲשֶׁר בְּפֶתַח בֵּית פַּרְעֹה
  choice: am Eingang des Hauses des Pharaos
  rationale: „Eingang“ gibt פתח natürlich wieder. „Haus des Pharaos“ bewahrt den Wortlaut, während „Palast“ eine mögliche, aber interpretierende Präzisierung wäre.
- source_word: בְּתַחְפַּנְחֵס
  choice: in Tachpanhes
  rationale: Transliteration des hebräischen Ortsnamens in einer für deutsche Leser gut lesbaren Form.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die bildhafte hebräische Wendung wird beibehalten und betont, dass die Handlung sichtbar vor Zeugen geschieht.
- source_word: אֲנָשִׁים יְהוּדִים
  choice: jüdischer Männer
  rationale: Die Wiedergabe erhält sowohl das ausdrücklich männliche Substantiv אֲנָשִׁים als auch die ethnische Bedeutung von יְהוּדִים. Die historisch-geografische Wiedergabe „judäische Männer“ bleibt als Alternative in der Fußnote sichtbar.
