  text: ו/בא/ה וְ/הִכָּ֖ה אֶת אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֧ר לַ/מָּ֣וֶת לַ/מָּ֗וֶת וַ/אֲשֶׁ֤ר לַ/שְּׁבִי֙ לַ/שֶּׁ֔בִי וַ/אֲשֶׁ֥ר לַ/חֶ֖רֶב לֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/011.yaml
  text: 'He will come and strike the land of Egypt: those for death[a], to death; those for captivity, to captivity; and those for the sword, to the sword.'
translation:
  language: de
  text: 'Er wird kommen und das Land Ägypten schlagen: Wer für den Tod bestimmt ist, geht in den Tod; wer für die Gefangenschaft bestimmt ist, gerät in Gefangenschaft; und wer für das Schwert bestimmt ist, fällt durch das Schwert.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher und noch knapper: „Wer zum Tod, zum Tod; wer zur Gefangenschaft, zur Gefangenschaft; und wer zum Schwert, zum Schwert.“ Das Hebräische verwendet eine wiederholte Gerichtsformel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאָה
  choice: Er wird kommen
  rationale: Das Qal-Perfekt mit vorangestellter Konjunktion führt im prophetischen Zusammenhang die zukünftige Handlung des Königs von Babylon fort. Das deutsche Futur gibt diese Funktion natürlich wieder; die Konjunktion wird nicht eigens mit „und“ wiedergegeben.
- source_word: וְהִכָּה
  choice: und … schlagen
  rationale: נכה bezeichnet ein Schlagen oder vernichtendes Angreifen. „Schlagen“ bewahrt die Breite und Wucht des Verbs, ohne die konkrete Art des Angriffs enger festzulegen.
- source_word: אֶת־אֶרֶץ מִצְרַיִם
  choice: das Land Ägypten
  rationale: Die Wiedergabe behält אֶרֶץ bei und bezeichnet Ägyptens Gebiet ausdrücklich als Ziel des Angriffs; der Akkusativmarker אֵת bleibt unübersetzt.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת
  choice: Wer für den Tod bestimmt ist, geht in den Tod
  rationale: Die Bestimmungsformel mit ל wird im Deutschen verständlich ausgedrückt. Die Wiederholung von „Tod“ erhält den knappen, unausweichlichen Gerichtscharakter.
- source_word: וַאֲשֶׁר לַשְּׁבִי לַשֶּׁבִי
  choice: wer für die Gefangenschaft bestimmt ist, gerät in Gefangenschaft
  rationale: שְׁבִי meint Gefangenschaft beziehungsweise das Gefangenwerden. „Gefangenschaft“ ist hier genauer als „Exil“ und wahrt die parallele Wiederholung.
- source_word: וַאֲשֶׁר לַחֶרֶב לֶחָרֶב
  choice: wer für das Schwert bestimmt ist, fällt durch das Schwert
  rationale: חֶרֶב wird wörtlich als „Schwert“ wiedergegeben, kann dabei aber zugleich für gewaltsamen Tod im Krieg stehen. „Fällt durch“ macht die deutsche Aussage verständlich, ohne das Bild aufzulösen.
theological_decisions:
- issue: Bezug des maskulinen Singularsubjekts
  choice: „Er“ verweist im Zusammenhang auf den König von Babylon als Werkzeug des angekündigten Gerichts.
  alternative: Eine unpersönliche Wiedergabe oder die ausdrückliche Einfügung des Namens „Nebukadnezar“.
  rationale: Die hebräischen Verbformen stehen im maskulinen Singular, und der unmittelbare Kontext nennt den König von Babylon. Das Pronomen bewahrt den Wortlaut des Verses, ohne den Namen erklärend einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Härte und dreifache Wiederholung der hebräischen Gerichtsformel bleiben erhalten; ergänzte deutsche Verben machen die elliptische Konstruktion verständlich.
