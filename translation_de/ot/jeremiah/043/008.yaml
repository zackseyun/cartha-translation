  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ בְּ/תַחְפַּנְחֵ֖ס לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/008.yaml
  text: Then the word of Yahweh came to Jeremiah in Tahpanhes[a], saying,
translation:
  language: de
  text: 'Dann[a] erging in Tachpanhes das Wort Jahwes an Jeremia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der hebräische Satz: »Und es geschah: Das Wort Jahwes kam …«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Dann erging
  rationale: Die Verbform führt ein neues Ereignis in der Erzählung ein. „Dann erging“ gibt den Übergang natürlich wieder, ohne die im modernen Deutschen schwerfällige wörtliche Formulierung „Und es geschah“ zu verwenden.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel wird mit „Wort“ wiedergegeben; so bleiben sowohl die formale Nähe als auch die theologische Bedeutung göttlicher Rede erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. „Jahwe“ ist die im Deutschen übliche Form von „Yahweh“.
- source_word: אֶל יִרְמְיָהוּ
  choice: an Jeremia
  rationale: Die Präposition bezeichnet hier den Empfänger des göttlichen Wortes; „an Jeremia“ entspricht der natürlichen deutschen Ausdrucksweise.
- source_word: בְּתַחְפַּנְחֵס
  choice: in Tachpanhes
  rationale: Die Präposition bezeichnet den Ort, an dem Jeremia das Wort empfängt. „Tachpanhes“ ist eine gebräuchliche deutsche Umschrift des Ortsnamens.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet den Inhalt der folgenden Rede ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion klarer und natürlicher als „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und nicht einen Titel. Die Wiedergabe als „Jahwe“ bewahrt diesen Eigennamen; „der HERR“ wäre die traditionelle Ersatzlesung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt mit „das Wort Jahwes“ erkennbar; der Doppelpunkt leitet die in Vers 9 folgende Gottesrede natürlich ein.
