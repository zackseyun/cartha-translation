  source_fidelity: 'Die Übersetzung bildet die hebräische Satzstruktur und die zentralen Aussagen zuverlässig ab: die Gottesrede, die Ankündigung des Sendens und Holens Nebukadnezars, seine Bezeichnung als Gottes Diener, das Aufstellen des Thrones über den verborgenen Steinen sowie das Ausspannen der unsicheren königlichen Überdachung. Die auffällige erste Person in »die ich verborgen habe« entspricht dem WLC-Text und wird zu Recht nicht harmonisiert.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch und für prophetische Rede angemessen. »Seht« und die leicht gehobene Fügung »ich sende hin« tragen den feierlichen Charakter, ohne unverständlich zu sein. »Baldachin« ist verständlich und im Kontext eines königlichen Thrones bildhaft passend.
  terminology: »Jahwe der Heerscharen«, »der Gott Israels«, »meinen Diener« und »Thron« sind quellentreue und im Deutschen etablierte Wiedergaben. Die deutsche Namensform »Nebukadnezar« ist trotz der im WLC vorliegenden Namensvariante eine übliche standarddeutsche Form. Die Fußnote kennzeichnet die lexikalische Unsicherheit von שפרורו sachgerecht und ohne unzulässige Festlegung.
