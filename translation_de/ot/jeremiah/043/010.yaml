  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֡ם כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הִנְ/נִ֤י שֹׁלֵ֨חַ֙ וְ֠/לָקַחְתִּי אֶת נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עַבְדִּ֔/י וְ/שַׂמְתִּ֣י כִסְא֔/וֹ מִ/מַּ֛עַל לָ/אֲבָנִ֥ים הָ/אֵ֖לֶּה אֲשֶׁ֣ר טָמָ֑נְתִּי וְ/נָטָ֥ה אֶת שפרור/ו עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/010.yaml
  text: 'And say to them[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am sending and will take Nebuchadnezzar king of Babylon, my servant, and I will set his throne above these stones that I have hidden, and he will spread his canopy over them.’'
translation:
  language: de
  text: 'Und sag zu ihnen: »So spricht Jahwe der Heerscharen, der Gott Israels: Seht, ich sende hin und werde Nebukadnezar, den König von Babylon, meinen Diener, holen. Ich werde seinen Thron über diesen Steinen aufstellen, die ich verborgen habe, und er wird seinen Baldachin[a] über ihnen ausspannen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort ist selten und in seiner genauen Bedeutung unsicher; möglich sind auch »Pavillon«, »Königszelt« oder eine andere königliche Überdachung.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »der Heerscharen« bewahrt den traditionellen, umfassenden Sinn des göttlichen Titels, ohne ihn auf menschliche Armeen zu verengen.
- source_word: הִנְנִי
  choice: Seht
  rationale: Die Aufforderung gibt die feierliche, Aufmerksamkeit weckende Funktion natürlich und verständlich wieder.
- source_word: שֹׁלֵחַ וְלָקַחְתִּי
  choice: ich sende hin und werde … holen
  rationale: Die beiden Verben bleiben erkennbar erhalten. »Holen« gibt in diesem Zusammenhang den zielgerichteten Zugriff auf Nebukadnezar natürlicher wieder als das isolierte »nehmen«.
- source_word: עַבְדִּי
  choice: meinen Diener
  rationale: »Diener« bezeichnet Nebukadnezar als Werkzeug unter Gottes Verfügung, ohne moralische Billigung oder Bundestreue auszusagen.
- source_word: כִסְאוֹ
  choice: seinen Thron
  rationale: Im königlichen Zusammenhang ist ausdrücklich ein Herrschersitz gemeint.
- source_word: מִמַּעַל לָאֲבָנִים הָאֵלֶּה
  choice: über diesen Steinen
  rationale: Die Formulierung bewahrt die räumliche Angabe, ohne genauer festzulegen, ob der Thron unmittelbar auf ihnen oder oberhalb ihrer verborgenen Lage steht.
- source_word: טָמָנְתִּי
  choice: die ich verborgen habe
  rationale: Die erste Person des hebräischen Textes bleibt trotz ihrer Spannung zum erzählerischen Zusammenhang unverändert erhalten.
- source_word: שפרורו
  choice: seinen Baldachin
  rationale: Das seltene und unsicher bestimmte Wort bezeichnet wahrscheinlich eine ausgebreitete königliche Überdachung oder ein entsprechendes Zelt; »Baldachin« ist im Kontext anschaulich, während die Unsicherheit in einer Fußnote offengelegt wird.
- source_word: וְנָטָה
  choice: wird … ausspannen
  rationale: Das Verb bezeichnet das Ausstrecken oder Ausbreiten und passt idiomatisch zu einer Überdachung beziehungsweise einem Zelt.
theological_decisions:
- issue: Nebukadnezar als עַבְדִּי Gottes
  choice: »meinen Diener«
  alternative: »meinen Sklaven« oder eine deutende Umschreibung wie »mein Werkzeug«
  rationale: Die Übersetzung bewahrt die Spannung, dass der heidnische König tatsächlich in Gottes Dienst genommen wird, ohne daraus geistliche Treue oder moralische Zustimmung abzuleiten.
- issue: Gott als Sprecher von טָמָנְתִּי (»ich habe verborgen«)
  choice: Die erste Person wird formal als »die ich verborgen habe« bewahrt.
  alternative: »die du verborgen hast« nach dem erzählerischen Vollzug durch Jeremia oder eine unpersönliche Formulierung
  rationale: Der überlieferte WLC-Text hat eindeutig die erste Person Singular. Die auffällige Spannung wird nicht stillschweigend harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Rede bleibt feierlich, vermeidet jedoch unnötig altertümliche Formen. Der seltene Ausdruck שפרורו wird lesbar übersetzt und seine Unsicherheit ausdrücklich vermerkt.
