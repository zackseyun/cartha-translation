  text: אֶֽת הַ֠/גְּבָרִים וְ/אֶת הַ/נָּשִׁ֣ים וְ/אֶת הַ/טַּף֮ וְ/אֶת בְּנ֣וֹת הַ/מֶּלֶךְ֒ וְ/אֵ֣ת כָּל הַ/נֶּ֗פֶשׁ אֲשֶׁ֤ר הִנִּ֨יחַ֙ נְבוּזַרְאֲדָ֣ן רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֑ן וְ/אֵת֙ יִרְמְיָ֣הוּ הַ/נָּבִ֔יא וְ/אֶת בָּר֖וּךְ בֶּן נֵרִיָּֽהוּ־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/006.yaml
  text: the men[a], the women, the little children, the king’s daughters, and every person whom Nebuzaradan the captain of the guard had left with Gedaliah son of Ahikam, son of Shaphan, and Jeremiah the prophet[c][b], and Baruch son of Neriah—
translation:
  language: de
  text: die Männer, die Frauen, die kleinen Kinder[a], die Töchter des Königs und alle Menschen[b], die Nebusaradan, der Befehlshaber der Leibwache[c], bei Gedalja, dem Sohn Ahikams, des Sohnes Schafans, zurückgelassen hatte, sowie den Propheten Jeremia und Baruch, den Sohn Nerijas —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Kinder“. Das hebräische Wort kann kleine Kinder oder abhängige Kinder allgemeiner bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „jede Seele“. „Seele“ ist hier eine hebräische Ausdrucksweise für einen Menschen als Person.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Oberster der Schlächter/Hinrichter“. Gemeint ist eine babylonische Amtsbezeichnung, die gewöhnlich als „Befehlshaber der Leibwache“ wiedergegeben wird.'
    reason: cultural_note
lexical_decisions:
- source_word: הַגְּבָרִים
  choice: die Männer
  rationale: In der Aufzählung neben Frauen und Kindern bezeichnet גְּבָרִים am natürlichsten die erwachsenen Männer, nicht speziell Soldaten.
- source_word: הַנָּשִׁים
  choice: die Frauen
  rationale: נָשִׁים bezeichnet hier allgemein Frauen; „Ehefrauen“ wäre unnötig einschränkend.
- source_word: הַטַּף
  choice: die kleinen Kinder
  rationale: טַף bezeichnet kleine beziehungsweise abhängige Kinder. Die gewählte Formulierung ist im Deutschen klar und fügt sich natürlich in die Aufzählung ein.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: die Töchter des Königs
  rationale: Die wörtliche Wiedergabe bewahrt die ausdrückliche Verwandtschaftsbezeichnung; „Prinzessinnen“ wäre interpretierender.
- source_word: כָּל הַנֶּפֶשׁ
  choice: alle Personen
  rationale: נֶפֶשׁ bezeichnet hier Menschen als Personen, nicht eigens einen immateriellen Seelenteil. Der Plural ist im modernen Deutschen die natürliche Wiedergabe des hebräischen Kollektivausdrucks.
- source_word: הִנִּיחַ
  choice: zurückgelassen hatte
  rationale: Das Verb beschreibt im Kontext, dass Nebusaradan diese Menschen im Land beziehungsweise bei Gedalja zurückließ.
- source_word: רַב טַבָּחִים
  choice: der Befehlshaber der Leibwache
  rationale: Dies gibt die babylonische Amtsbezeichnung verständlich wieder, ohne die im heutigen Deutsch irreführende wörtliche Vorstellung eines Schlächters hervorzurufen.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: bei Gedalja, dem Sohn Ahikams und Enkel Schafans
  rationale: „Bei Gedalja“ bringt das im Kontext gemeinte Unterstellt- beziehungsweise Anvertrautsein knapp zum Ausdruck. Die zweite Generation wird idiomatisch als „Enkel Schafans“ wiedergegeben.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: den Propheten Jeremia
  rationale: Name und ausdrücklich genannter Titel bleiben erhalten; die deutsche Wortstellung ist natürlich.
- source_word: בָּרוּךְ בֶּן נֵרִיָּהוּ
  choice: Baruch, den Sohn Nerijas
  rationale: Der Eigenname wird transliteriert und das hebräische Patronym ausdrücklich wiedergegeben.
theological_decisions:
- issue: Bezug von Jeremia und Baruch zur vorangehenden Relativkonstruktion
  choice: „außerdem den Propheten Jeremia und Baruch“ als weitere Glieder der vom übergeordneten Satz abhängigen Aufzählung
  alternative: Jeremia und Baruch als Teil der bei Gedalja zurückgelassenen „Personen“ in die Relativkonstruktion einbeziehen
  rationale: Das wiederholte אֵת vor Jeremia und Baruch setzt sie grammatisch als eigene Glieder der Aufzählung fort. Die Übersetzung vermeidet, mehr über ihren genauen syntaktischen Bezug auszusagen, als der fragmentarische Vers sicher erkennen lässt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Text bleibt als Satzfragment mit Gedankenstrich stehen, da der hebräische Vers mitten in der übergeordneten Satzkonstruktion endet. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
