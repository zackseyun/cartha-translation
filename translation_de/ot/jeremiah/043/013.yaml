  text: וְ/שִׁבַּ֗ר אֶֽת מַצְּבוֹת֙ בֵּ֣ית שֶׁ֔מֶשׁ אֲשֶׁ֖ר בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אֶת בָּתֵּ֥י אֱלֹהֵֽי מִצְרַ֖יִם יִשְׂרֹ֥ף בָּ/אֵֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/013.yaml
  text: He will shatter the pillars of Beth-shemesh that is in the land of Egypt[b][a], and he will burn the temples of the gods of Egypt with fire.
translation:
  language: de
  text: Er wird die Kultsteine[a] von Bet-Schemesch, das im Land Ägypten liegt,[b] zerschlagen, und die Tempel der Götter Ägyptens wird er im Feuer verbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heilige Steinmale“ oder „aufgerichtete Steine“. Das hebräische Wort bezeichnet kultisch verwendete, aufgerichtete Steine.'
    reason: lexical_alternative
  - marker: b
    text: Bet-Schemesch bedeutet „Haus der Sonne“ und meint wahrscheinlich die ägyptische Stadt, die auf Griechisch Heliopolis hieß.
    reason: cultural_note
lexical_decisions:
- source_word: וְשִׁבַּר
  choice: Er wird … zerschlagen
  rationale: שׁבר bezeichnet ein Zerbrechen oder Zerschmettern. „Zerschlagen“ gibt die entschlossene Zerstörung natürlich und kraftvoll wieder; die vorangestellte Konjunktion wird durch die deutsche Satzverknüpfung aufgenommen.
- source_word: מַצְּבוֹת
  choice: Kultsteine
  rationale: מַצֵּבָה bezeichnet hier aufgerichtete Steine oder Steinmale mit kultischer Funktion. „Kultsteine“ ist im modernen Deutsch verständlich und macht den religiösen Zusammenhang deutlich, ohne eine bestimmte Form wie Säulen oder Obelisken festzulegen.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Schemesch
  rationale: Der Ortsname wird nach üblichen deutschen Transkriptionskonventionen wiedergegeben. Seine Bedeutung „Haus der Sonne“ und die wahrscheinliche Identifizierung mit Heliopolis werden in einer Fußnote erläutert.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: das im Land Ägypten liegt
  rationale: Der Relativsatz bezieht sich am natürlichsten auf Bet-Schemesch und kennzeichnet den ägyptischen Ort. Die Formulierung bewahrt diese syntaktische Beziehung in klarem modernem Deutsch.
- source_word: בָּתֵּי אֱלֹהֵי מִצְרַיִם
  choice: die Tempel der Götter Ägyptens
  rationale: בָּתִּים bedeutet wörtlich „Häuser“, bezeichnet im kultischen Zusammenhang jedoch die Heiligtümer beziehungsweise Tempel der ägyptischen Götter. „Tempel“ benennt den gemeinten Referenten idiomatisch und präzise.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: wird er im Feuer verbrennen
  rationale: Die Wiedergabe erhält sowohl das Verb „verbrennen“ als auch die ausdrückliche Nennung des Feuers. „Im Feuer verbrennen“ klingt im Deutschen würdevoll und weniger unbeholfen als „mit Feuer verbrennen“.
