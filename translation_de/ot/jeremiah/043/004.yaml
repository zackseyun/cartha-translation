source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַע֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֛ים וְ/כָל הָ/עָ֖ם בְּ/ק֣וֹל יְהוָ֑ה לָ/שֶׁ֖בֶת בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/043/004.yaml
  text: But Johanan son of Kareah[a], and all the commanders of the forces, and all the people, did not listen to the voice of Yahweh, to remain in the land of Judah.
translation:
  language: de
  text: Doch Johanan, der Sohn Kareachs, alle Befehlshaber der Truppen und das ganze Volk hörten nicht auf die Stimme Jahwes[a], die ihnen gebot, im Land Juda zu bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „auf die Stimme Jahwes hören“ kann auch mit „Jahwe gehorchen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Doch … nicht
  rationale: Die Konjunktion führt die Erzählung mit einem deutlichen Gegensatz zu Jahwes zuvor erteiltem Auftrag weiter; „doch“ gibt diesen Zusammenhang natürlich wieder.
- source_word: שָׁמַע … בְּקוֹל
  choice: auf die Stimme … hören
  rationale: Die hebräische Wendung bezeichnet ein Hören, das Befolgen einschließt. Die deutsche Formulierung bewahrt das Bild der Stimme und lässt zugleich den Sinn des Gehorchens erkennen.
- source_word: יוֹחָנָן בֶּן־קָרֵחַ
  choice: Johanan, der Sohn Kareachs
  rationale: Die Namen werden in gebräuchlicher deutscher Umschrift wiedergegeben; der Genitiv „Kareachs“ ist eine natürliche Wiedergabe des Patronyms.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Befehlshaber der Truppen
  rationale: שָׂרֵי bezeichnet hier militärische Führer; der Plural חֲיָלִים wird mit „Truppen“ wiedergegeben, ohne ihn auf ein einziges formelles Heer einzuengen.
- source_word: כָל הָעָם
  choice: das ganze Volk
  rationale: Dies ist eine direkte und idiomatische Wiedergabe des hebräischen Kollektivausdrucks.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לָשֶׁבֶת בְּאֶרֶץ יְהוּדָה
  choice: und blieben nicht im Land Juda
  rationale: Der Infinitiv bezeichnet im Zusammenhang das angeordnete weitere Verbleiben in Juda. Die koordinierte deutsche Form macht den Bezug eindeutig und gibt die verweigerte Handlung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname; „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von שָׁמַע בְּקוֹל
  choice: auf die Stimme hören
  alternative: gehorchen
  rationale: Die Hauptfassung erhält die konkrete hebräische Redeweise. Dass dieses Hören Gehorsam verlangt, bleibt erkennbar und wird in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde gegenüber dem Hebräischen leicht geglättet, damit sich der Infinitiv eindeutig auf das von Jahwe gebotene Verbleiben bezieht. Das konkrete Bild vom Hören auf Jahwes Stimme bleibt erhalten.
