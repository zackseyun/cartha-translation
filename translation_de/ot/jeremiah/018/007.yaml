  terminology: „Volk“, „Königreich“, „ausreißen“, „niederreißen“ und „vernichten“ sind im Kontext passend. Die Fußnote erhält die relevante lexikalische Ambiguität von על, ohne sie im Haupttext einseitig aufzulösen.
