  text: רֶ֣גַע אֲדַבֵּ֔ר עַל גּ֖וֹי וְ/עַל מַמְלָכָ֑ה לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּֽ/לְ/הַאֲבִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/007.yaml
  text: At one moment I may speak concerning a nation and concerning a kingdom[a], to uproot and to tear down and to destroy.
translation:
  language: de
  text: Einmal kann ich über ein Volk und über ein Königreich[a] ankündigen, sie auszureißen, niederzureißen und zu vernichten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen ein Volk und gegen ein Königreich“. Die Präposition kann angesichts der folgenden Gerichtsverben auch stärker gegenläufig verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֶגַע
  choice: Einmal
  rationale: Das Substantiv bezeichnet einen Zeitpunkt oder Augenblick. Im Deutschen leitet „Einmal“ natürlich einen möglichen Fall innerhalb des allgemeinen Grundsatzes in V. 7–10 ein und entspricht der wiederholten Zeitformel.
- source_word: אֲדַבֵּר
  choice: kann ich … ankündigen
  rationale: Das Piel-Imperfekt bezeichnet hier im Zusammenhang von V. 7–10 einen allgemeinen, möglichen Fall. „Kann ich … ankündigen“ gibt diesen situativen Sinn wieder; „ankündigen“ passt zu einem göttlichen Urteilsspruch.
- source_word: עַל
  choice: über
  rationale: Bei דבר bezeichnet die Präposition zunächst den Gegenstand der Ankündigung. „Über“ bewahrt diese Breite, während die folgenden Infinitive den feindlichen Inhalt ausdrücken; die adversative Alternative wird in einer Fußnote genannt.
- source_word: גּוֹי
  choice: Volk
  rationale: גּוֹי bezeichnet hier ein politisch verstandenes Volk. „Volk“ ist im modernen Deutschen natürlicher als „Nation“, ohne den politischen Zusammenhang aufzugeben.
- source_word: מַמְלָכָה
  choice: Königreich
  rationale: Der Ausdruck bezeichnet ein Königreich oder Herrschaftsgebiet. „Königreich“ bewahrt die politische Bedeutung und bildet mit „Volk“ ein klares Paar.
- source_word: לִנְתוֹשׁ
  choice: auszureißen
  rationale: Das Verb beschreibt bildhaft das Herausreißen einer Pflanze samt Wurzel. „Ausreißen“ wahrt Jeremias wiederkehrendes Bild und klingt in der Dreierreihe natürlich.
- source_word: לִנְתוֹץ
  choice: niederzureißen
  rationale: Das Verb meint das Einreißen oder Niederlegen eines Bauwerks. „Niederreißen“ erhält das konkrete Zerstörungsbild.
- source_word: וּלְהַאֲבִיד
  choice: zu vernichten
  rationale: Der Hifil von אבד bedeutet hier, etwas zugrunde gehen zu lassen. „Vernichten“ gibt die kausative Zerstörungsbedeutung knapp und deutlich wieder.
theological_decisions:
- issue: Aussageweise der göttlichen Rede in einem bedingungsähnlichen Gerichtszusammenhang
  choice: „kann ich … ankündigen“ als allgemeiner möglicher Fall
  alternative: „rede ich“ oder „kündige ich an“ als schlichtes Präsens
  rationale: Der Vers eröffnet einen allgemeinen Grundsatz über Gottes angekündigtes Handeln an Völkern und nicht nur einen einzelnen vergangenen Ausspruch. Die modale Form bewahrt die situative Offenheit, ohne eine weitergehende theologische Festlegung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Infinitivfolge bewahrt den knappen, eindringlichen Rhythmus des Hebräischen; die echte Bedeutungsbreite von עַל wird durch Haupttext und Fußnote erhalten.
