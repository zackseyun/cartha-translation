  source_fidelity: Die Dreierfolge „ausreißen, niederreißen und vernichten“ gibt die hebräischen Infinitive לנתוש, לנתוץ und להאביד treffend wieder. Auch die Hauptlesart „über“ bewahrt die nicht ausschließlich adversative Bedeutung von על; die Fußnote dokumentiert sachgerecht die mögliche Lesart „gegen“.
