  text: וַ/יֹּאמְר֗וּ לְכ֨וּ וְ/נַחְשְׁבָ֣ה עַֽל יִרְמְיָהוּ֮ מַחֲשָׁבוֹת֒ כִּי֩ לֹא תֹאבַ֨ד תּוֹרָ֜ה מִ/כֹּהֵ֗ן וְ/עֵצָה֙ מֵֽ/חָכָ֔ם וְ/דָבָ֖ר מִ/נָּבִ֑יא לְכוּ֙ וְ/נַכֵּ֣/הוּ בַ/לָּשׁ֔וֹן וְ/אַל נַקְשִׁ֖יבָה אֶל כָּל דְּבָרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/018.yaml
  text: Then they said[a], “Come, let us devise plans against Jeremiah, for instruction will not perish from the priest, nor counsel from the wise man, nor word from the prophet. Come, let us strike him with the tongue, and let us not pay attention to any of his words.”
translation:
  language: de
  text: 'Da sagten sie: »Kommt, wir wollen Pläne gegen Jeremia schmieden! Denn Weisung wird nicht vom Priester verschwinden, Rat nicht vom Weisen und Wort nicht vom Propheten. Kommt, wir wollen ihn mit der Zunge schlagen[a] und auf keines seiner Worte hören!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn mit der Zunge angreifen«, das heißt durch Verleumdung oder Anklage.'
    reason: Lexikalische Alternative und Erläuterung der hebräischen Metapher; das nicht im Ausgangstext ausgedrückte „unserer“ wird vermieden.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten sie
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagten sie“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: לְכוּ
  choice: Kommt
  rationale: Der Imperativ fordert zu gemeinsamem Handeln auf und wird im Deutschen idiomatisch mit „Kommt“ wiedergegeben.
- source_word: וְנַחְשְׁבָה ... מַחֲשָׁבוֹת
  choice: wir wollen Pläne ... schmieden
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv bezeichnet bewusstes, hier feindseliges Planen. „Pläne schmieden“ klingt natürlich und bewahrt den verschwörerischen Ton.
- source_word: עַל יִרְמְיָהוּ
  choice: gegen Jeremia
  rationale: Im Zusammenhang richtet sich das Planen feindlich gegen Jeremia; עַל ist daher adversativ zu verstehen.
- source_word: תּוֹרָה
  choice: Weisung
  rationale: Gemeint ist die priesterliche Unterweisung, nicht ausschließlich ein kodifiziertes Gesetz. „Weisung“ bewahrt zugleich die religiöse Färbung des Begriffs.
- source_word: לֹא תֹאבַד ... מִן
  choice: wird es nicht an ... fehlen
  rationale: Die deutsche Wendung gibt den Gedanken wieder, dass Weisung, Rat und prophetisches Wort bei den genannten Trägern nicht verschwinden oder ausbleiben werden.
- source_word: מֵחָכָם
  choice: dem Weisen
  rationale: Der maskuline Singular wird als repräsentative Rollenbezeichnung beibehalten und steht parallel zu Priester und Prophet.
- source_word: וְדָבָר מִנָּבִיא
  choice: und dem Propheten nicht an einem Wort
  rationale: „Wort“ erhält die Breite und den biblischen Klang von דָבָר als prophetischer Ausspruch oder Botschaft.
- source_word: וְנַכֵּהוּ בַלָּשׁוֹן
  choice: wir wollen ihn mit der Zunge schlagen
  rationale: Die auffällige hebräische Metapher wird im Haupttext bewahrt; ihre mögliche Bedeutung als verleumderische oder anklagende Rede wird in der Fußnote erläutert.
- source_word: וְאַל נַקְשִׁיבָה אֶל כָּל דְּבָרָיו
  choice: und auf keines seiner Worte hören
  rationale: Die deutsche Negativform gibt idiomatisch die vollständige Zurückweisung all dessen wieder, was Jeremia sagt.
theological_decisions:
- issue: Repräsentativer maskuliner Singular חָכָם
  choice: dem Weisen
  alternative: einem weisen Menschen / den Weisen
  rationale: Der hebräische Text nennt eine konventionelle soziale Rolle im maskulinen Singular, parallel zu „Priester“ und „Prophet“. Die Form wird nicht geschlechtsneutral umgedeutet.
- issue: Begründung der Gegner Jeremias
  choice: Weisung, Rat und prophetisches Wort werden weiterhin bei ihren jeweiligen Trägern verfügbar sein
  alternative: Die genannten Institutionen seien grundsätzlich unfehlbar oder göttlich garantiert
  rationale: Der Satz wird als Behauptung der Sprecher wiedergegeben, ohne ihre institutionelle Zuversicht theologisch zu bestätigen oder zu widerlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt energisch und verschwörerisch; die dreigliedrige Parallelstruktur von Priester, Weisheitsträger und Prophet wird erhalten. Die ungewöhnliche Metapher „mit der Zunge schlagen“ bleibt bewusst im Text und wird nicht stillschweigend auf eine einzige Deutung festgelegt.
