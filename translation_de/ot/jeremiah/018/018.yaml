  terminology: „Weisung“ gibt תורה im Kontext priesterlicher Unterweisung treffend wieder; „Rat“, „Weiser“ und „Wort“ bewahren die Parallelität der drei Rollen. Die Fußnote sollte jedoch nicht „unserer Zunge“ sagen, da das Hebräische lediglich „der Zunge“ lautet.
