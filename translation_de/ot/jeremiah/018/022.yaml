source:
  edition: WLC
  text: תִּשָּׁמַ֤ע זְעָקָה֙ מִ/בָּ֣תֵּי/הֶ֔ם כִּֽי תָבִ֧יא עֲלֵי/הֶ֛ם גְּד֖וּד פִּתְאֹ֑ם כִּֽי כָר֤וּ שיחה לְ/לָכְדֵ֔/נִי וּ/פַחִ֖ים טָמְנ֥וּ לְ/רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/022.yaml
  text: Let a cry be heard from their houses when you suddenly bring a raiding band upon them[b][a], for they have dug a pit to capture me and hidden traps for my feet.
translation:
  language: de
  text: Möge aus ihren Häusern ein Hilfeschrei zu hören sein, wenn du plötzlich eine Räuberschar über sie kommen lässt[a]. Denn sie haben eine Grube gegraben, um mich zu fangen, und meinen Füßen Fallen gestellt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Truppe« oder »eine Schar von Plünderern«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Schlingen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשָּׁמַע
  choice: soll … zu hören sein
  rationale: Das Nifal bewahrt die passive Bedeutung »gehört werden«. Im Zusammenhang des Fluchgebets gibt »soll« den auffordernden Wunschcharakter wieder, ohne ihn in eine bloße Vorhersage umzudeuten.
- source_word: זְעָקָה
  choice: ein Hilfeschrei
  rationale: Das Substantiv bezeichnet einen Schrei aus Not. »Hilfeschrei« vermittelt diese emotionale und situative Bedeutung im heutigen Deutsch klar.
- source_word: מִבָּתֵּיהֶם
  choice: aus ihren Häusern
  rationale: Die Präposition bezeichnet den räumlichen Ausgangspunkt des Schreis; »Häuser« erhält das konkrete Bild.
- source_word: כִּי
  choice: wenn
  rationale: Das erste כִּי führt den Umstand beziehungsweise Zeitpunkt ein, unter dem der Schrei ertönen soll.
- source_word: תָבִיא
  choice: du … kommen lässt
  rationale: Der Hifil von בוא bedeutet »bringen« beziehungsweise »kommen lassen«. Die gewählte Formulierung ist im Deutschen mit einer gegen Menschen gesandten Schar natürlich.
- source_word: גְּדוּד
  choice: eine Räuberschar
  rationale: Das Wort kann eine Truppe oder plündernde Streifschar bezeichnen. »Räuberschar« bewahrt hier den feindlichen, überfallartigen Sinn.
- source_word: פִּתְאֹם
  choice: plötzlich
  rationale: Direkte und idiomatische Wiedergabe des Adverbs.
- source_word: כִּי
  choice: denn
  rationale: Das zweite כִּי begründet die Bitte mit dem Anschlag, den die Gegner gegen Jeremia vorbereitet haben.
- source_word: כָרוּ
  choice: sie haben … gegraben
  rationale: Das Qal-Perfekt bezeichnet eine bereits vollzogene Handlung, die Jeremias gegenwärtige Bitte begründet; dafür eignet sich im Deutschen das Perfekt.
- source_word: שיחה
  choice: eine Grube
  rationale: Das Substantiv bezeichnet eine Grube, hier im Bild einer Fanggrube. »Grube« lässt das Bild offen und verständlich.
- source_word: לְלָכְדֵנִי
  choice: um mich zu fangen
  rationale: Der Infinitiv mit לְ drückt den Zweck aus. »Fangen« verbindet sich natürlich mit dem Bild von Grube und Fallen.
- source_word: וּפַחִים טָמְנוּ לְרַגְלָי
  choice: und meinen Füßen Fallen gestellt
  rationale: פַּחִים bezeichnet Fallen oder Schlingen, und טמן deren verborgenes Auslegen. Die deutsche Wendung »jemandem Fallen stellen« gibt das konkrete Bild idiomatisch wieder.
theological_decisions:
- issue: Verwünschender Charakter von Jeremias Gebet
  choice: Die Aussage bleibt eine unmittelbare Bitte um Gericht.
  alternative: Die Verbform als bloße Zukunftsaussage oder Vorhersage wiedergeben.
  rationale: Der Kontext und die jussive Aussagekraft der hebräischen Imperfektform sprechen für einen Wunsch beziehungsweise eine Bitte. Eine reine Vorhersage würde die rhetorische und theologische Spannung des Textes abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau hält den eindringlichen Gebetscharakter fest; konkrete Bilder wie Häuser, Grube, Füße und Fallen bleiben erhalten.
