  yaml_path: translation/ot/jeremiah/018/004.yaml
  text: And the vessel that he was making from the clay was spoiled in the potter’s hand[a], and he turned and made it into another vessel[b], as seemed right in the potter’s eyes to make.
translation:
  language: de
  text: Und das Gefäß, das er gerade aus Ton formte, missriet in der Hand des Töpfers.[a] Da formte er es erneut zu einem anderen Gefäß, wie der Töpfer es für richtig hielt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „verdarb“ oder „wurde unbrauchbar“. Das hebräische Verb besagt, dass das Gefäß während der Bearbeitung fehlerhaft wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie es in den Augen des Töpfers richtig war, es zu machen“. Die hebräische Wendung bedeutet, dass der Töpfer es nach seinem Ermessen gestaltete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁחַת
  choice: missriet
  rationale: Das Nifal von שׁחת bezeichnet hier, dass das Gefäß während der Bearbeitung fehlerhaft oder unbrauchbar wurde. „Missriet“ ist im Deutschen natürlich, wahrt den prozesshaften Zusammenhang und legt die Ursache nicht fest.
- source_word: הַכְּלִי
  choice: das Gefäß
  rationale: כְּלִי ist allgemein ein Gegenstand oder Behältnis; im Töpferkontext ist „Gefäß“ die naheliegende und würdige Wiedergabe.
- source_word: אֲשֶׁר הוּא עֹשֶׂה
  choice: das er … machte
  rationale: Das Partizip bezeichnet die laufende Arbeit des Töpfers. Der deutsche Nebensatz mit Präteritum bleibt natürlich und lässt den Prozess im Zusammenhang erkennen.
- source_word: בַּחֹמֶר
  choice: aus dem Ton
  rationale: Die Präposition bezeichnet hier den bearbeiteten Werkstoff. „Aus dem Ton“ ist die übliche deutsche Ausdrucksweise für die Herstellung eines Gefäßes.
- source_word: בְּיַד הַיּוֹצֵר
  choice: in der Hand des Töpfers
  rationale: Die konkrete hebräische Wendung wird bewahrt und zeigt, dass das Gefäß während der unmittelbaren Bearbeitung missriet, ohne eine Ursache zu ergänzen.
- source_word: וְשָׁב וַיַּעֲשֵׂהוּ
  choice: Darauf machte er daraus
  rationale: שׁוב bezeichnet hier die erneute beziehungsweise anschließende Tätigkeit, nicht notwendig eine räumliche Umkehr. „Darauf“ gibt den Fortgang wieder; „daraus“ nimmt das bearbeitete Material als Objekt der Neugestaltung auf.
- source_word: כְּלִי אַחֵר
  choice: ein anderes Gefäß
  rationale: Die Formulierung bewahrt offen, worin die neue Gestalt oder Bestimmung des Gefäßes bestand.
- source_word: כַּאֲשֶׁר יָשַׁר בְּעֵינֵי הַיּוֹצֵר לַעֲשׂוֹת
  choice: wie es der Töpfer für richtig hielt
  rationale: Die idiomatische deutsche Wiedergabe drückt das Urteil und Ermessen des Töpfers aus. Sie vermeidet den schwerfälligen Hebraismus „wie es in seinen Augen richtig war, es zu machen“, ohne den Sinn theologisch auszuweiten.
theological_decisions:
- issue: Konkretes Töpferbild und seine spätere theologische Deutung
  choice: Der Vers bleibt bei der beobachteten Werkstattszene und erklärt das Bild nicht ausdrücklich theologisch.
  alternative: Das Handeln des Töpfers unmittelbar als Aussage über Gottes souveränes Handeln an Menschen oder Völkern paraphrasieren.
  rationale: Die Deutung folgt erst im weiteren Zusammenhang. Hier bewahrt die Übersetzung das konkrete Bild samt seiner Spannung und trägt keine konfessionelle oder systematisch-theologische Folgerung in den Vers ein.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in einem würdigen Erzählton. Das konkrete Handwerksbild und die Wiederholung von „Gefäß“ bleiben erhalten; unnötig altertümliche Wörter und eine vorweggenommene theologische Auslegung werden vermieden.
