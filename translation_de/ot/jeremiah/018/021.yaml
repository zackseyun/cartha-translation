source:
  edition: WLC
  text: לָ/כֵן֩ תֵּ֨ן אֶת בְּנֵי/הֶ֜ם לָ/רָעָ֗ב וְ/הַגִּרֵ/ם֮ עַל יְדֵי חֶרֶב֒ וְ/תִֽהְיֶ֨נָה נְשֵׁי/הֶ֤ם שַׁכֻּלוֹת֙ וְ/אַלְמָנ֔וֹת וְ/אַ֨נְשֵׁי/הֶ֔ם יִֽהְי֖וּ הֲרֻ֣גֵי מָ֑וֶת בַּח֣וּרֵי/הֶ֔ם מֻכֵּי חֶ֖רֶב בַּ/מִּלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/021.yaml
  text: Therefore give their children over to famine[a], and hand them over to the power of the sword. Let their wives become bereaved and widowed, and let their men be slain by death[c][b], their young men struck down by the sword in battle.
translation:
  language: de
  text: Darum gib ihre Kinder[b] dem Hunger preis und liefere sie der Gewalt des Schwertes aus.[a] Ihre Frauen sollen ihrer Kinder beraubt und zu Witwen werden; ihre Männer sollen vom Tod erschlagen werden,[c] ihre jungen Männer im Krieg vom Schwert erschlagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über die Hände des Schwertes“; gemeint ist die Auslieferung an seine Gewalt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Söhne“. Das hebräische Wort kann enger die Söhne oder kollektiv die Kinder bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „vom Tod Erschlagene“. Die ungewöhnliche hebräische Wendung bezeichnet tödliche Vernichtung, ohne die Todesart eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet klar die Folgerung aus der vorausgehenden Klage und klingt im modernen Deutschen natürlich.
- source_word: תֵּן ... לָרָעָב
  choice: gib ... dem Hunger preis
  rationale: Gibt die Übergabe an eine vernichtende Macht idiomatisch und mit der gerichtlichen Härte des Hebräischen wieder.
- source_word: בְּנֵיהֶם
  choice: ihre Kinder
  rationale: בנים kann enger „Söhne“ bedeuten, wird aber auch kollektiv für die Nachkommen gebraucht; die Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: וְהַגִּרֵם עַל יְדֵי חֶרֶב
  choice: liefere sie der Gewalt des Schwertes aus
  rationale: Die schwierige Hifil-Form wird im Kontext als Auslieferung verstanden; „Gewalt des Schwertes“ bewahrt die personifizierende hebräische Wendung, ohne im Deutschen unverständlich zu wirken.
- source_word: שַׁכֻּלוֹת וְאַלְמָנוֹת
  choice: ihrer Kinder beraubt und zu Witwen
  rationale: שַׁכֻּלוֹת bezeichnet Frauen, die Kinder durch den Tod verloren haben, nicht bloß kinderlose Frauen. Die Formulierung macht beide familiären Verluste ausdrücklich.
- source_word: הֲרֻגֵי מָוֶת
  choice: vom Tod dahingerafft
  rationale: Gibt die ungewöhnliche Verbindung von „erschlagen/getötet“ und „Tod“ verständlich wieder, ohne ihre Härte oder mögliche Personifizierung zu beseitigen.
- source_word: בַּחוּרֵיהֶם מֻכֵּי חֶרֶב בַּמִּלְחָמָה
  choice: ihre jungen Männer im Krieg vom Schwert erschlagen
  rationale: Bewahrt die parallele poetische Satzform sowie die konkrete gewaltsame Todesart.
theological_decisions:
- issue: Unmittelbare Bitte an Gott um gewaltsames Gericht
  choice: Die imperativisch-jussive Bitte wird ungemildert als Bitte wiedergegeben.
  alternative: Die Aussagen als bloße Zukunftsankündigung formulieren oder die Gewalt euphemistisch abschwächen.
  rationale: Imperativ und Jussiv gehören zur verstörenden theologischen Spannung des prophetischen Gebets. Eine Übersetzung soll diese Spannung bewahren und nicht stillschweigend auflösen.
- issue: Deutung von הֲרֻגֵי מָוֶת
  choice: „vom Tod dahingerafft“ mit Hinweis auf die wörtliche Schwierigkeit
  alternative: Eindeutig auf Pest, Hinrichtung oder eine andere bestimmte Todesart festlegen.
  rationale: Die ungewöhnliche hebräische Verbindung nennt keine zweifelsfrei bestimmbare Todesart. Die gewählte Fassung wahrt daher die Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetisch-poetischer Parallelstruktur. Die drastische Sprache des Bittgebets bleibt erhalten; ungewöhnliche hebräische Bilder werden lesbar wiedergegeben und bei echter Mehrdeutigkeit durch Fußnoten offengehalten.
