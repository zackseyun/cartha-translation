base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/006.yaml
  text: Can I not do with you[a], house of Israel, as this potter does? declares Yahweh. Look, like clay in the hand of the potter, so are you in my hand, house of Israel.
translation:
  language: de
  text: 'Kann ich nicht mit euch verfahren wie dieser Töpfer, Haus Israel?[a] – Ausspruch Jahwes. Seht: Wie der Ton in der Hand des Töpfers, so seid ihr in meiner Hand, Haus Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Kann ich nicht so mit euch verfahren, wie dieser Töpfer [mit dem Ton verfährt]?“ Die knappe hebräische Vergleichskonstruktion kann im Deutschen leicht unterschiedlich wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכַיּוֹצֵר הַזֶּה ... אוּכַל לַעֲשׂוֹת לָכֶם
  choice: Kann ich mit euch ... nicht ebenso verfahren wie dieser Töpfer?
  rationale: Die rhetorische Frage und der Vergleich werden in natürlichem Deutsch wiedergegeben. „Mit euch verfahren“ bewahrt die offene Bedeutung von עשה mit ל, ohne die Handlung einseitig als Strafe oder Wohltat festzulegen.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die kollektive, bundestheologisch geprägte Anrede wird formal bewahrt.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם bezeichnet die feierliche prophetische Spruchformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Ausdruck lenkt nachdrücklich die Aufmerksamkeit auf das folgende Bild; „Seht“ ist würdig und gegenwärtig.
- source_word: כַחֹמֶר בְּיַד הַיּוֹצֵר
  choice: Wie der Ton in der Hand des Töpfers
  rationale: Das konkrete Bild und die Vergleichsstruktur werden unmittelbar erhalten. Der bestimmte Artikel ist im Deutschen durch die situationsbezogene Anschauung des Tons beim Töpfer natürlich.
- source_word: כֵּן אַתֶּם בְּיָדִי
  choice: so seid ihr in meiner Hand
  rationale: Die Entsprechung zwischen Bild und angesprochener Gemeinschaft bleibt formal und bildkräftig erhalten.
theological_decisions:
- issue: Göttliche Souveränität im Bild von Töpfer und Ton
  choice: Das Bild wird ohne dogmatische Ausdeutung direkt wiedergegeben.
  alternative: Eine deterministische Deutung oder eine Abschwächung zu bloßer Fürsorge beziehungsweise Gestaltung.
  rationale: Der Vers spricht von Jahwes Verfügungsgewalt über Israel, legt aber in diesem Satz kein umfassendes Lehrsystem über Vorherbestimmung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. Die Anrede „Haus Israel“, die Handmetapher und der persönliche Gottesname bleiben erhalten; die Mehrdeutigkeit der göttlichen Handlung wird nicht zugunsten einer ausschließlich strafenden oder wohltätigen Lesart aufgelöst.
