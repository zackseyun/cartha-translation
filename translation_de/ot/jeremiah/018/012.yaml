id: JER.18.12
reference: Jeremiah 18:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמְר֖וּ נוֹאָ֑שׁ כִּֽי אַחֲרֵ֤י מַחְשְׁבוֹתֵ֨י/נוּ֙ נֵלֵ֔ךְ וְ/אִ֛ישׁ שְׁרִר֥וּת לִבּֽ/וֹ הָ/רָ֖ע נַעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/012.yaml
  text: But they will say[a], ‘It is hopeless, for we will follow our own plans, and each of us will act according to the stubbornness of his evil heart.’
translation:
  language: de
  text: 'Doch sie werden sagen[a]: »Es ist hoffnungslos! Denn wir werden unseren eigenen Plänen folgen, und jeder von uns wird nach dem Starrsinn seines bösen Herzens handeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Es ist vergeblich« oder »Es gibt keine Hoffnung.« Der hebräische Ausdruck kann sowohl Verzweiflung ausdrücken als auch den Aufruf des Propheten als zwecklos abweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹאָשׁ
  choice: Es ist hoffnungslos
  rationale: Die Form kann Hoffnungslosigkeit oder Vergeblichkeit ausdrücken. »Es ist hoffnungslos« ist im modernen Deutschen natürlich und lässt im Kontext sowohl Resignation als auch die abweisende Erklärung anklingen, der Aufruf zur Umkehr sei zwecklos.
- source_word: אַחֲרֵי מַחְשְׁבוֹתֵינוּ נֵלֵךְ
  choice: wir werden unseren eigenen Plänen folgen
  rationale: Die hebräische Wendung »hinter ... hergehen« bezeichnet hier das Befolgen oder Verfolgen; מַחְשְׁבוֹת meint Gedanken, Absichten oder Pläne. »Plänen folgen« gibt die bewusste Selbstbestimmung natürlich wieder, ohne unnötig »Machenschaften« einzutragen.
- source_word: וְאִישׁ
  choice: und jeder von uns
  rationale: 'אִישׁ hat hier distributive Bedeutung: jeder Einzelne innerhalb der sprechenden Gruppe. »Jeder von uns« ist idiomatisch und bewahrt diesen Bezug.'
- source_word: שְׁרִרוּת
  choice: Starrsinn
  rationale: Das Wort bezeichnet hartnäckigen Eigenwillen beziehungsweise widersetzliche Verstocktheit. »Starrsinn« ist prägnant, verständlich und erhält die moralische Schärfe.
- source_word: לִבּוֹ הָרָע
  choice: seines bösen Herzens
  rationale: לֵב bezeichnet das innere Zentrum von Denken, Wollen und Entscheiden; »Herz« bewahrt das biblische Bild. הָרָע enthält ausdrücklich eine moralische Bewertung, daher »böse«.
- source_word: נַעֲשֶׂה
  choice: wird ... handeln
  rationale: עשה bedeutet allgemein »tun/machen«. In Verbindung mit dem Starrsinn des Herzens gibt »handeln« das daraus hervorgehende Verhalten im Deutschen flüssig wieder.
theological_decisions:
- issue: Antwort des Volkes als Verzweiflung oder abweisende Erklärung der Vergeblichkeit
  choice: Es ist hoffnungslos
  alternative: Es ist vergeblich; Es gibt keine Hoffnung
  rationale: נוֹאָשׁ kann entweder Hoffnungslosigkeit ausdrücken oder die Aufforderung des Propheten als aussichtslos beziehungsweise zwecklos abweisen. Der Haupttext wahrt die knappe, resignativ-abweisende Kraft; die Fußnote erhält die möglichen Bedeutungsnuancen, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und trotzig. »Starrsinn« bewahrt die in Jeremia wiederkehrende Sprache des eigenwilligen Widerstands; das traditionelle Herzbild bleibt erhalten, ist aber im Satzbau unmittelbar verständlich.
