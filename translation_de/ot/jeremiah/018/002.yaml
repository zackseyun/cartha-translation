  text: ק֥וּם וְ/יָרַדְתָּ֖ בֵּ֣ית הַ/יּוֹצֵ֑ר וְ/שָׁ֖מָּ/ה אַשְׁמִֽיעֲ/ךָ֥ אֶת דְּבָרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/002.yaml
  text: Arise and go down to the potter’s house[a], and there I will let you hear my words.
translation:
  language: de
  text: Steh auf und geh hinunter zum Haus des Töpfers; dort werde ich dich meine Worte hören lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וּם
  choice: Steh auf
  rationale: Der Imperativ von קום fordert zum Aufstehen und unverzüglichen Handeln auf. „Steh auf“ ist im modernen Deutsch natürlich und bewahrt den nachdrücklichen Ton.
- source_word: וְ/יָרַדְתָּ֖
  choice: und geh hinunter
  rationale: ירד bezeichnet eine Bewegung nach unten. „Geh hinunter“ erhält die Richtungsangabe und passt zur topografischen Perspektive Jerusalems.
- source_word: בֵּ֣ית הַ/יּוֹצֵ֑ר
  choice: zum Haus des Töpfers
  rationale: Die hebräische Status-constructus-Verbindung bedeutet wörtlich „Haus des Töpfers“. Die formnahe deutsche Wiedergabe ist klar und natürlich.
- source_word: הַ/יּוֹצֵר
  choice: Töpfer
  rationale: Das substantivierte Partizip von יצר kann allgemein einen Formenden bezeichnen; der anschließende Zusammenhang mit Ton macht „Töpfer“ hier eindeutig passend.
- source_word: וְ/שָׁ֖מָּ/ה
  choice: dort
  rationale: Das Ortsadverb hebt den Ort hervor, an dem Jeremia die göttliche Mitteilung empfangen wird. Nach dem Semikolon ist „dort“ eine natürliche deutsche Fortführung.
- source_word: אַשְׁמִֽיעֲ/ךָ֥
  choice: werde ich dich … hören lassen
  rationale: 'Die Hifil-Form von שמע ist kausativ: Gott wird bewirken, dass Jeremia hört. „Dich … hören lassen“ bewahrt diese Nuance besser als das interpretierende „dir sagen“.'
- source_word: אֶת דְּבָרָֽ/י
  choice: meine Worte
  rationale: Die Wiedergabe im Plural entspricht der hebräischen Form und vermeidet die interpretierende Zusammenfassung als „Botschaft“.
theological_decisions:
- issue: Kausative Aussage über das Hören der göttlichen Worte
  choice: dort werde ich dich meine Worte hören lassen
  alternative: dort werde ich dir meine Worte sagen
  rationale: Die gewählte Fassung hält die ungewöhnliche, aber bedeutsame Kausativform fest, ohne näher zu bestimmen, auf welche Weise Gott Jeremia seine Worte zu hören gibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng an Bild, Bewegungsrichtung und Kausativstruktur des Hebräischen; ein Semikolon gliedert die beiden aufeinanderfolgenden Aufträge klar.
