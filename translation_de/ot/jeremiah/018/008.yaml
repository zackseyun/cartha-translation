  text: וְ/שָׁב֙ הַ/גּ֣וֹי הַ/ה֔וּא מֵ/רָ֣עָת֔/וֹ אֲשֶׁ֥ר דִּבַּ֖רְתִּי עָלָ֑י/ו וְ/נִֽחַמְתִּי֙ עַל הָ֣/רָעָ֔ה אֲשֶׁ֥ר חָשַׁ֖בְתִּי לַ/עֲשׂ֥וֹת לֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/008.yaml
  text: And if that nation turns from its evil[a], against which I spoke[c][b], then I will relent concerning the disaster that I planned to do to it.
translation:
  language: de
  text: Wenn aber jenes Volk von seiner Bosheit umkehrt[a], gegen das ich geredet habe[b], dann werde ich von dem Unheil[c] absehen[d], das ich ihm zuzufügen gedachte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zurückkehrt“ oder „sich abwendet“. Das hebräische Verb bezeichnet ein Umkehren oder Zurückkehren.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „über das ich geredet habe“. Im Zusammenhang ist eine gegen das Volk gerichtete Gerichtsankündigung gemeint.'
    reason: alternative_reading
  - marker: c
    text: Im Hebräischen steht hier dasselbe Wort wie zuvor bei der „Bosheit“ des Volkes. Dort bezeichnet es moralisch Böses, hier das angekündigte Unheil.
    reason: lexical_alternative
  - marker: d
    text: Wörtlich kann die hebräische Formulierung auch mit „dann wird mich das Unheil reuen“ wiedergegeben werden. Sie beschreibt die Rücknahme des angekündigten Gerichts als Reaktion auf die Umkehr.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁב
  choice: Wenn aber … umkehrt
  rationale: שׁוב bezeichnet ein Umkehren oder Zurückkehren. Der bedingende Sinn ergibt sich aus dem Zusammenhang mit Vers 7; „umkehrt“ bewahrt das anschauliche Bild einer moralischen Kehrtwende.
- source_word: הַגּוֹי הַהוּא
  choice: jenes Volk
  rationale: גּוֹי bezeichnet hier ein politisch-kollektives Volk. „Jenes Volk“ gibt die demonstrative Wendung natürlich wieder.
- source_word: מֵרָעָתוֹ
  choice: von seiner Bosheit
  rationale: רָעָה bezeichnet an dieser Stelle das moralisch Böse des Volkes. „Bosheit“ ist im Deutschen natürlicher als „von seinem Bösen“, ohne einen im Hebräischen nicht ausdrücklich genannten „Weg“ oder ein „Tun“ hinzuzufügen.
- source_word: אֲשֶׁר דִּבַּרְתִּי עָלָיו
  choice: gegen das ich geredet habe
  rationale: Das maskuline Suffix in עָלָיו bezieht sich auf das Volk; דִּבֵּר עַל kann „über“ oder im Gerichtszusammenhang „gegen“ jemanden reden bedeuten. „Gegen“ entspricht hier der angekündigten Gerichtsbotschaft.
- source_word: וְנִחַמְתִּי
  choice: dann wird mich … reuen
  rationale: נחם beschreibt hier Gottes Reaktion auf die Umkehr des Volkes. Die Formulierung bewahrt die Aussage und ihre theologische Spannung, ohne daraus eine moralische Verfehlung Gottes zu machen.
- source_word: עַל הָרָעָה
  choice: das Unheil
  rationale: Dasselbe hebräische Substantiv רָעָה bezeichnet hier nicht moralische Bosheit, sondern das angekündigte Gericht als Unheil. Die unterschiedliche Wiedergabe ist wegen des Bedeutungswechsels erforderlich.
- source_word: אֲשֶׁר חָשַׁבְתִּי לַעֲשׂוֹת לוֹ
  choice: das ich ihm zuzufügen gedachte
  rationale: חשב bezeichnet ein beabsichtigtes oder geplantes Handeln. „Zuzufügen gedachte“ ist im Deutschen natürlich und gibt die auf das Volk gerichtete Handlung von לַעֲשׂוֹת לוֹ prägnant wieder.
theological_decisions:
- issue: Gottes נִחַם angesichts menschlicher Umkehr
  choice: dann wird mich das Unheil reuen
  alternative: dann werde ich von dem Unheil absehen / dann werde ich es mir anders überlegen
  rationale: „Reuen“ lässt die im Text ausgesagte responsive Änderung hinsichtlich des angekündigten Gerichts stehen. „Absehen“ würde stärker nur das Ergebnis benennen, während „es mir anders überlegen“ die Aussage psychologisierend ausweiten könnte. Die Formulierung behauptet keine moralische Schuld Gottes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jenes Volk“ und „gedachte“ sind leicht gehoben, bleiben aber allgemein verständlich und entsprechen dem prophetischen Ton. Die Satzstruktur folgt der hebräischen Bedingungsfolge, ohne im Deutschen schwerfällig zu wirken.
