  yaml_path: translation/ot/jeremiah/018/010.yaml
  text: but if it does what is evil in my sight[a], not listening to my voice[b], then I will relent concerning the good that I said I would do to it.
translation:
  language: de
  text: Wenn es aber tut, was in meinen Augen böse ist, und nicht auf meine Stimme hört, dann werde ich von dem Guten absehen[a], das ich ihm zu erweisen zugesagt hatte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werde ich meine Entscheidung über das Gute ändern. Das hebräische Verb kann eine Änderung des zuvor angekündigten Handelns bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: ihm Gutes zu tun.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְעָשָׂה הָרָעָה בְּעֵינַי
  choice: Wenn es aber tut, was böse ist in meinen Augen
  rationale: Das im Zusammenhang vorausgesetzte Bedingungsverhältnis wird im Deutschen mit „wenn“ ausgedrückt. Das sächliche Pronomen nimmt das in Vers 9 genannte Volk beziehungsweise Königreich auf; „in meinen Augen“ bewahrt die hebräische Bildsprache.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹלִי
  choice: und nicht auf meine Stimme hört
  rationale: שמע בְּקוֹל bezeichnet ein Hören, das Gehorsam einschließt. Die Wiedergabe bleibt nahe am hebräischen Ausdruck, ohne den Gehorsamsaspekt auszuschließen.
- source_word: וְנִחַמְתִּי עַל הַטּוֹבָה
  choice: dann werde ich es mir hinsichtlich des Guten anders überlegen
  rationale: נחם bezeichnet hier die Änderung eines angekündigten Vorgehens. Die Formulierung wahrt die im Text ausgesagte Reaktion Gottes, ohne mit „bereuen“ moralische Schuld anzudeuten; „hinsichtlich“ gibt עַל als Bezug auf die angekündigte Wohltat wieder.
- source_word: אֲשֶׁר אָמַרְתִּי לְהֵיטִיב אֹתוֹ
  choice: das ich ihm zu tun angekündigt hatte
  rationale: אמר wird kontextgemäß als Ankündigung wiedergegeben. Das Plusquamperfekt verdeutlicht, dass diese Ankündigung der nun beschriebenen Reaktion vorausging; die wörtliche Bedeutung von לְהֵיטִיב אֹתוֹ wird in einer Fußnote genannt.
theological_decisions:
- issue: Aussage über Gottes נחם
  choice: werde ich es mir … anders überlegen
  alternative: werde ich von dem angekündigten Guten absehen
  rationale: 'Die gewählte Fassung erhält die echte Kontingenz und Spannung der Aussage: Das angekündigte Gute steht in Beziehung zum Verhalten des Volkes. Zugleich vermeidet sie die mögliche Fehlvorstellung, Gott bereue moralisches Unrecht.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist klar und allgemein verständlich; die hebräische Wendung „in meinen Augen“ sowie die Spannung der göttlichen Handlungsänderung bleiben erhalten.
