  terminology: „Schuld“ für עָוֹן und „Sünde“ für חַטָּאת bewahren die hebräische Parallelität sinnvoll. „Vergib ihnen ihre Schuld nicht“ ist eine natürliche kontextuelle Wiedergabe von כפר; die Fußnote hält die Sühne- und Bedeckungsbedeutung angemessen offen. HERR entspricht der festgelegten deutschen Konvention für den Gottesnamen.
