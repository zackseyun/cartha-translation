  source_fidelity: 'Die Übersetzung gibt die Gebets- und Gerichtsbitte insgesamt zutreffend wieder: JHWH wird konventionell als HERR bezeichnet, die tödliche Absicht der Gegner wird klar, und die Bitten um Nichtvergebung, Nichtauslöschung sowie Gericht bleiben erhalten. Bei וְהָיוּ מֻכְשָׁלִים liegt jedoch eine passive Hophal-Form vor. „Lass sie ... zu Fall kommen“ kann im Deutschen lediglich ein Zulassen ausdrücken und schwächt die passive/kausative Nuance. „Lass sie ... zu Fall gebracht werden“ bildet die Form und den jussivischen Wunsch genauer ab.'
