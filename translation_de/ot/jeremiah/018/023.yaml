    rationale: Die Hophal-Form מֻכְשָׁלִים bedeutet primär „zu Fall gebracht gemacht/zu Fall gebracht werden“. Die vorgeschlagene Formulierung kann bloß bedeuten, dass Gott ihr Fallen nicht verhindert. Eine explizit passive Fassung wahrt die grammatische Nuance und die gerichtliche Bitte.
