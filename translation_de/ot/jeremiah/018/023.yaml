- from: Doch du, HERR, kennst alle ihre Pläne gegen mich, mich zu töten.[a] Vergib ihnen ihre Schuld nicht[b] und lösche ihre Sünde vor dir nicht aus. Lass sie vor dir zu Fall kommen;[c] zur Zeit deines Zorns geh gegen sie vor!
  to: Doch du, HERR, kennst alle ihre Pläne gegen mich, mich zu töten.[a] Vergib ihnen ihre Schuld nicht[b] und lösche ihre Sünde vor dir nicht aus. Lass sie vor dir zu Fall gebracht werden;[c] zur Zeit deines Zorns geh gegen sie vor!
  rationale: Nur die dritte Bitte wird angepasst. Die passive, wahrscheinlich kausative Nuance des Hophal-Partizips wird mit „zu Fall gebracht werden“ klarer als mit „zu Fall kommen“ wiedergegeben, ohne eine konkrete Art des Gerichts zu bestimmen. Alle übrigen Formulierungen sind quellennah, idiomatisch und registergerecht.
