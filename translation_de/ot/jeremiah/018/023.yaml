source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֠הוָה יָדַ֜עְתָּ אֶֽת כָּל עֲצָתָ֤/ם עָלַ/י֙ לַ/מָּ֔וֶת אַל תְּכַפֵּר֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תֶּ֑מְחִי ו/היו מֻכְשָׁלִים֙ לְ/פָנֶ֔י/ךָ בְּ/עֵ֥ת אַפְּ/ךָ֖ עֲשֵׂ֥ה בָ/הֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/023.yaml
  text: But you[a], O Yahweh, know all their counsel against me for death. Do not cover over their iniquity, and do not blot out their sin from before you. Let them be made to stumble before you; in the time of your anger[c][b], act against them.
translation:
  language: de
  text: Doch du, HERR, kennst alle ihre Pläne gegen mich, mich zu töten.[a] Vergib ihnen ihre Schuld nicht[b] und lösche ihre Sünde vor dir nicht aus. Lass sie vor dir zu Fall gebracht werden;[c] zur Zeit deines Zorns geh gegen sie vor!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „gegen mich zum Tod“; auch möglich: „auf meinen Tod aus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bedecke ihre Schuld nicht“ beziehungsweise „Schaffe keine Sühne für ihre Schuld“. Das hebräische Verb kann das Sühnen, Bedecken oder Vergeben von Schuld bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Mögen sie vor dir straucheln.“ Die hebräische Form ist passiv und kann eine verursachende Nuance haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: HERR
  rationale: Die Kapitälchenform gibt den Gottesnamen JHWH nach etablierter deutscher Bibelkonvention wieder, ohne ihn mit einem gewöhnlichen Herrentitel gleichzusetzen.
- source_word: עֲצָתָם
  choice: ihre Pläne
  rationale: עֵצָה kann Rat, Plan oder Vorhaben bezeichnen. Im Zusammenhang feindlicher Absichten ist „Pläne“ im heutigen Deutsch natürlich und präzise.
- source_word: עָלַי לַמָּוֶת
  choice: gegen mich, mich zu töten
  rationale: Die knappe hebräische Wendung lautet wörtlich etwa „gegen mich zum Tod“. Die gewählte Fassung macht den tödlichen Zweck idiomatisch deutlich, ohne das Ziel der Pläne abzuschwächen.
- source_word: תְּכַפֵּר עַל עֲוֺנָם
  choice: Vergib ihnen ihre Schuld nicht
  rationale: כפר im Piel kann Sühne schaffen, Schuld bedecken beziehungsweise Vergebung bewirken. Im Kontext der Bitte ist „vergib … nicht“ die natürliche deutsche Wiedergabe; die zugrunde liegende Sühne- und Bedeckungsmetaphorik wird in der Fußnote offengehalten.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עָוֹן kann sowohl das schuldhafte Unrecht als auch die daraus erwachsende Schuld bezeichnen. „Schuld“ passt zum Verb כפר und bleibt vom folgenden „Sünde“ unterschieden.
- source_word: חַטָּאתָם
  choice: ihre Sünde
  rationale: „Sünde“ ist hier die direkte und geläufige Entsprechung und bewahrt die Parallelität mit „Schuld“, ohne beide Begriffe gleichzusetzen.
- source_word: תֶּמְחִי מִלְּפָנֶיךָ
  choice: lösche … vor dir nicht aus
  rationale: מחה bezeichnet das Auslöschen oder Wegwischen. „Vor dir“ bewahrt die räumlich-gerichtliche Vorstellung, dass die Sünde vor Gott steht.
- source_word: וְהָיוּ מֻכְשָׁלִים לְפָנֶיךָ
  choice: Lass sie vor dir zu Fall kommen
  rationale: Die Form hat im Zusammenhang auffordernden beziehungsweise wünschenden Sinn; der Hophal-Stamm trägt eine passive oder verursachende Nuance. „Zu Fall kommen lassen“ gibt diese natürlicher wieder als ein schwerfälliges „zum Straucheln gebracht werden“.
- source_word: בְּעֵת אַפְּךָ
  choice: zur Zeit deines Zorns
  rationale: אַף bezeichnet idiomatisch Zorn. Die Übersetzung hält die Zeitangabe ausdrücklich fest und verwendet ein würdiges, gut verständliches deutsches Wort.
- source_word: עֲשֵׂה בָהֶם
  choice: geh gegen sie vor
  rationale: Wörtlich steht knapp „handle an/mit ihnen“. Der feindlich-gerichtliche Kontext rechtfertigt „gegen sie vorgehen“, ohne die konkrete Art des Gerichts näher festzulegen.
theological_decisions:
- issue: Die Härte der Fluchbitte
  choice: Die Bitten um Nichtvergebung und göttliches Gericht bleiben als direkte Gebetsbitten stehen.
  alternative: Die Aussagen abschwächen, verallgemeinern oder in bloße Beschreibungen umformen.
  rationale: Negierte Aufforderungen und der abschließende Imperativ sind im Hebräischen deutlich. Die Übersetzung wahrt die theologische Spannung dieses Klage- und Vergeltungsgebets, statt sie stillschweigend zu mildern.
- issue: Bedeutung von כפר in Verbindung mit Schuld
  choice: Im Haupttext steht die kontextuell natürliche Wiedergabe „vergib“, während die Sühne- und Bedeckungsbedeutung in einer Fußnote genannt wird.
  alternative: Im Haupttext wörtlicher „bedecke ihre Schuld nicht“ oder „schaffe keine Sühne für ihre Schuld“.
  rationale: Die Alternativen bilden die Metaphorik formaler ab, klingen im modernen Deutsch jedoch missverständlich oder unnatürlich. Die Fußnote verhindert, dass die kultisch-sühnetheologische Bedeutungsbreite verdeckt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Der Gottesname wird nach deutscher Bibelkonvention als HERR wiedergegeben. Die feindselige Schärfe des Verses bleibt erhalten; schwer verständliche hebräische Kürze wird nur so weit entfaltet, wie es idiomatisches Deutsch verlangt.
