  terminology: „Ostwind“, „zerstreuen“, „Feind“ und „Unheil“ sind sachgerecht und im prophetischen Register natürlich. Die possessive Formulierung bei „meinen Rücken / mein Gesicht“ ist keine dogmatische Ausdeutung, sondern verdeutlicht die im hebräischen Bild durch die erste Person und das Verb bestimmte Referenz.
