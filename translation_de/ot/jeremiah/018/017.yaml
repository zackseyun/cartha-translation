revisions:
- from: Wie ein Ostwind werde ich sie vor dem Feind zerstreuen. Den Rücken und nicht das Gesicht werde ich sie sehen lassen[a] am Tag ihres Verderbens.
  to: Wie ein Ostwind werde ich sie vor dem Feind zerstreuen; ich werde ihnen meinen Rücken und nicht mein Gesicht zeigen[a] am Tag ihres Unheils.
  rationale: Die Revision ersetzt die im Deutschen missverständliche Konstruktion „sie sehen lassen“ durch die idiomatische Entsprechung „ihnen ... zeigen“. Die possessiven Formen machen die durch Sprecher und Handlung im hebräischen Kontext bestimmte Referenz des anthropomorphen Bildes sichtbar, ohne dessen konkrete Metaphorik zu abstrahieren. „Unheil“ gibt אֵיד als Katastrophe beziehungsweise Verderben in natürlichem, feierlichem Deutsch wieder.
