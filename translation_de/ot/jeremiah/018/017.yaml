  text: כְּ/רֽוּחַ קָדִ֥ים אֲפִיצֵ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב עֹ֧רֶף וְ/לֹֽא פָנִ֛ים אֶרְאֵ֖/ם בְּ/י֥וֹם אֵידָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/017.yaml
  text: Like an east wind I will scatter them before the enemy[a]; I will show them the back and not the face in the day of their disaster.
translation:
  language: de
  text: Wie ein Ostwind werde ich sie vor dem Feind zerstreuen; ich werde ihnen meinen Rücken und nicht mein Gesicht zeigen[a] am Tag ihres Unheils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Rücken und nicht das Gesicht“. Das hebräische Bild beschreibt die Abwendung des HERRN und den Entzug seiner zugewandten Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּחַ קָדִים
  choice: Wie ein Ostwind
  rationale: Das כְּ markiert den Vergleich; רוּחַ קָדִים bezeichnet den oft zerstörerisch wirkenden Ostwind. Die Formulierung bewahrt das konkrete Bild, ohne „glühend“ oder „versengend“ hinzuzufügen.
- source_word: אֲפִיצֵם
  choice: werde ich sie … zerstreuen
  rationale: Der Hifil von פוץ bedeutet hier kausativ „zerstreuen, auseinandertreiben“; „zerstreuen“ ist direkt und im Gerichtskontext natürlich.
- source_word: לִפְנֵי אוֹיֵב
  choice: vor dem Feind
  rationale: Die Wendung bedeutet wörtlich „vor Feind“ und beschreibt, dass sie angesichts beziehungsweise vor dem angreifenden Feind zerstreut werden. Der bestimmte Artikel ist im Deutschen kontextgemäß.
- source_word: עֹרֶף וְלֹא פָנִים
  choice: den Rücken und nicht das Gesicht
  rationale: עֹרֶף bezeichnet eigentlich Nacken beziehungsweise Rückseite und steht hier im Gegensatz zu פָנִים, dem Gesicht. Die körperhafte Metapher wird ohne einen im Hebräischen nicht ausdrücklich gesetzten Possessivartikel bewahrt.
- source_word: אֶרְאֵם
  choice: werde ich sie sehen lassen
  rationale: Die Form von ראה kann in dieser Konstruktion den Sinn „sehen lassen/zeigen“ tragen. „Sie sehen lassen“ bildet die hebräische Struktur mit Personenobjekt und dem, was gesehen wird, eng ab.
- source_word: בְּיוֹם אֵידָם
  choice: am Tag ihres Verderbens
  rationale: אֵיד bezeichnet Unheil, Verderben oder Katastrophe. „Am Tag ihres Verderbens“ bewahrt die knappe, feierlich-prophetische Zeitangabe.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Abwendung im Gericht
  choice: Die konkrete Metapher „den Rücken und nicht das Gesicht … sehen lassen“ bleibt im Haupttext erhalten.
  alternative: 'Abstrakt wiedergeben: „Ich werde mich von ihnen abwenden“ oder „Ich werde ihnen meine Gunst entziehen“.'
  rationale: Der hebräische Text beschreibt Gottes Entzug zugewandter Gegenwart durch ein körperhaftes Gegenbild. Eine abstrakte Paraphrase würde die Bildspannung auflösen.
- issue: Nicht ausdrücklich markierter Besitz bei „Rücken“ und „Gesicht“
  choice: Im Haupttext stehen „den Rücken“ und „das Gesicht“ ohne „meinen“.
  alternative: 'Zur Verdeutlichung der idiomatisch gemeinten Beziehung ergänzen: „meinen Rücken und nicht mein Gesicht“.'
  rationale: Im Hebräischen fehlen Possessivsuffixe. Die deutsche Fassung folgt dieser Form, während die Fußnote die naheliegende idiomatische Deutung erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-feierlichem Klang. Die Satzstellung hebt das Gegensatzpaar „Rücken/Gesicht“ hervor; die konkrete und bewusst harte Bildsprache des Hebräischen bleibt erhalten.
