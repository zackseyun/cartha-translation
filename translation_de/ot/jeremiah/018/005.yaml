  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: Die narrative Wayyiqtol-Form führt das nächste Ereignis ein. „Da kam“ gibt die zeitliche Fortführung natürlich wieder und vermeidet die altertümliche Formel „Und es geschah“.
- source_word: דְבַר
  choice: das Wort
  rationale: דָּבָר bezeichnet in der prophetischen Botenformel Gottes Wort beziehungsweise Botschaft; „das Wort“ bewahrt die geprägte biblische Ausdrucksweise.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; der Genitiv „Jahwes“ bildet die hebräische Konstruktverbindung natürlich im Deutschen ab.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit dem Suffix der ersten Person Singular bezeichnet die Richtung zum Sprecher.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den unmittelbar folgenden Wortlaut der göttlichen Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Einleitungsformel bleibt erhalten; der Doppelpunkt kündigt die in Vers 6 folgende direkte Rede an.
