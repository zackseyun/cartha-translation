  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַֽׁאֲלוּ נָא֙ בַּ/גּוֹיִ֔ם מִ֥י שָׁמַ֖ע כָּ/אֵ֑לֶּה שַֽׁעֲרֻרִת֙ עָשְׂתָ֣ה מְאֹ֔ד בְּתוּלַ֖ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/013.yaml
  text: 'Therefore thus says Yahweh: Ask now among the nations[b][a], who has heard such things? Virgin Israel has done a very horrible thing.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: Fragt doch unter den Völkern: Wer hat je von etwas Derartigem gehört? Etwas überaus Entsetzliches[b] hat die Jungfrau Israel[a] getan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jungfrau Israels“; eine Personifikation des Volkes Israel.'
    reason: translation_clarification
  - marker: b
    text: 'Oder: „etwas überaus Empörendes“ beziehungsweise „etwas ungeheuer Schreckliches“. Das hebräische Wort bezeichnet etwas, das Schauder und Entrüstung hervorruft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel knüpft die Gottesrede als Schlussfolgerung an den vorausgehenden Zusammenhang an.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen יְהוָה als „Jahwe“ wieder.
- source_word: שַׁאֲלוּ נָא בַּגּוֹיִם
  choice: Fragt doch unter den Völkern
  rationale: Der Pluralimperativ wird direkt wiedergegeben; „doch“ vermittelt die auffordernde Nuance von נָא im natürlichen Deutschen.
- source_word: מִי שָׁמַע כָּאֵלֶּה
  choice: Wer hat je von etwas Derartigem gehört?
  rationale: Die idiomatische rhetorische Frage bewahrt die vergleichende Bedeutung von כָּאֵלֶּה und unterstreicht, ohne sie sachlich zu erweitern, die Unerhörtheit.
- source_word: שַׁעֲרֻרִת ... מְאֹד
  choice: etwas überaus Entsetzliches
  rationale: Das seltene Substantiv bezeichnet etwas Schauderhaftes, Empörendes oder Ungeheuerliches; „überaus“ gibt die Verstärkung durch מְאֹד wieder.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: die Jungfrau Israel
  rationale: Die nationale Personifikation wird ohne den im Hebräischen nicht vorhandenen Zusatz „Tochter“ bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich den Tetragrammaton; die Wiedergabe als Eigenname wahrt dessen Funktion als Bundesname.
- issue: Personifikation Israels als בְּתוּלַת יִשְׂרָאֵל
  choice: die Jungfrau Israel
  alternative: die jungfräuliche Israelitin
  rationale: Die wörtliche nationale Personifikation bleibt erhalten; sie wird weder individualisiert noch durch „Tochter“ erweitert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt bewusst formell; „Fragt doch“ und „etwas Derartiges“ sind zugleich allgemein verständlich. Die seltene und starke Wertung des hebräischen שַׁעֲרֻרִת wird nicht auf eine bestimmte Art von Vergehen eingeengt.
