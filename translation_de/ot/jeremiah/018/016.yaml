  text: making their land a desolation[a], an object of perpetual hissing[b]; everyone who passes by it will be appalled and shake his head.
translation:
  language: de
  text: um ihr Land zu einer Einöde zu machen, zu einem Gegenstand ewigen Zischens[a]. Jeder, der daran vorbeikommt, wird sich entsetzen und den Kopf schütteln[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „zu einem Gegenstand ewigen Pfeifens“ oder „zu einem ewigen Zischen“. Das hebräische Bild meint wahrscheinlich den Laut, mit dem Vorübergehende auf das verwüstete Land reagieren; er kann Spott, Erstaunen oder Entsetzen ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Das Kopfschütteln ist eine hebräische Geste, die je nach Zusammenhang Spott, Erstaunen oder Bestürzung ausdrücken kann.
    reason: cultural_note
lexical_decisions:
- source_word: לָשׂוּם
  choice: um … zu machen
  rationale: Der Infinitiv mit לְ führt die Zweck- oder Ergebnisangabe aus dem vorherigen Vers fort. Die deutsche Infinitivkonstruktion bewahrt diesen syntaktischen Anschluss.
- source_word: אַרְצָם
  choice: ihr Land
  rationale: אֶרֶץ bezeichnet hier das Land des unter Gericht stehenden Volkes; „Land“ ist direkt und im prophetischen Zusammenhang natürlich.
- source_word: לְשַׁמָּה
  choice: zu einer Einöde
  rationale: שַׁמָּה bezeichnet im Gerichtskontext Verwüstung beziehungsweise einen Zustand, der Entsetzen hervorruft. „Einöde“ gibt die konkrete Verwüstung knapp und verständlich wieder.
- source_word: שרוקת עוֹלָם
  choice: über die man für immer zischt
  rationale: Die Wendung bezeichnet ein anhaltendes Zischen oder Pfeifen angesichts des verwüsteten Landes. Die verbale Formulierung klingt im Deutschen natürlicher als „zu einem ewigen Zischen“ und erhält das Bild.
- source_word: כֹּל עוֹבֵר עָלֶיהָ
  choice: Jeder, der daran vorbeikommt
  rationale: Gemeint sind Vorübergehende, die das verwüstete Land sehen. „Daran vorbeikommt“ ist idiomatisches modernes Deutsch.
- source_word: יִשֹּׁם
  choice: wird sich entsetzen
  rationale: Das Qal von שמם beschreibt hier die erschrockene oder bestürzte Reaktion des Betrachters auf die Verwüstung.
- source_word: וְיָנִיד בְּרֹאשׁוֹ
  choice: und den Kopf schütteln
  rationale: Die hebräische Geste kann Spott, Erstaunen oder Bestürzung ausdrücken. „Den Kopf schütteln“ ist die geläufigste gegenwärtige deutsche Entsprechung, ohne die genaue Gefühlsnuance festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Infinitiv bleibt als Anschluss an Vers 15 erhalten. Die Bildsprache des Zischens und die Mehrdeutigkeit des Kopfschüttelns werden nicht auf eine einzige emotionale Reaktion verengt.
