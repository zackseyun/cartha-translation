    rationale: Das Hebräische nennt kein Objekt bei den Infinitiven. Die Ergänzung ist nicht erforderlich und wirkt angesichts von „Volk und Königreich“ syntaktisch weniger klar.
  - severity: low
    issue: „kann ich“
    rationale: Die Form kann zwar eine mögliche Situation ausdrücken, wird im Deutschen aber leicht als Aussage göttlicher Fähigkeit verstanden. Der einfache Präsensgebrauch wahrt die allgemeine, beispielhafte Aussage des Kontextes ohne diese Nebenbedeutung.
