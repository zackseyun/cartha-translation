  source_fidelity: 'Der Entwurf gibt die Gliederung und die zentralen Begriffe grundsätzlich wieder. „einpflanzen“ ist jedoch für נטע ungenau: Es bezeichnet im Deutschen meist das Einsetzen/Verpflanzen von etwas, während das hebräische Bild schlicht „pflanzen“ lautet. Das ergänzte Objekt „es“ steht nicht im Hebräischen und ist bei den zwei Bezugsgrößen zudem unnötig.'
  naturalness: „Zu einer anderen Zeit“ ist im modernen Standarddeutsch klarer als „ein andermal“ und bewahrt den Kontrast zu V. 7. Die infinitivische Wendung „um zu bauen und zu pflanzen“ ist idiomatisch und lässt das im Hebräischen nicht ausgedrückte Objekt offen.
  terminology: „Volk“ und „Königreich“ sind angemessene Wiedergaben von גּוֹי und מַמְלָכָה. „über“ ist für דבר על hier möglich. „spreche ich“ gibt das Imperfekt im rahmenden, allgemeinen Aussagezusammenhang natürlicher wieder als „kann ich“, das im Deutschen primär Fähigkeit nahelegen kann.
