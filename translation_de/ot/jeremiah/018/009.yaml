revisions:
- from: Und ein andermal kann ich über ein Volk und über ein Königreich[a] sprechen, um es aufzubauen und einzupflanzen.
  to: Und zu einer anderen Zeit spreche ich über ein Volk und ein Königreich[a], um zu bauen und zu pflanzen.
  rationale: Die Revision ersetzt das semantisch zu spezifische „einpflanzen“ durch „pflanzen“, entfernt das nicht ausgedrückte Objekt und verwendet für die allgemeine prophetische Aussage ein natürliches Präsens. Die zeitliche Gegenüberstellung zu V. 7 bleibt mit „zu einer anderen Zeit“ erkennbar; die Fußnote dokumentiert die näher am hebräischen Wortlaut liegende Alternative.
