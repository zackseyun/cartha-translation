base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/009.yaml
  text: And at another moment I may speak concerning a nation and concerning a kingdom[a], to build and to plant.
translation:
  language: de
  text: Und zu einer anderen Zeit spreche ich über ein Volk und ein Königreich[a], um zu bauen und zu pflanzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und in einem Augenblick spreche ich über ein Volk und ein Königreich, um zu bauen und zu pflanzen.“ Die hebräische Ausdrucksweise mit „Augenblick“ rahmt die göttlichen Ankündigungen in den Versen 7–10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרֶגַע
  choice: Und ein andermal
  rationale: רֶגַע bezeichnet einen Augenblick; im Kontrast zur parallelen Aussage in V. 7 gibt „ein andermal“ die zeitliche Gegenüberstellung natürlich wieder, ohne die Wendung als plötzlichen Vorgang zu deuten.
- source_word: אֲדַבֵּר
  choice: kann ich … sprechen
  rationale: Der Imperfekt steht innerhalb der bedingten, beispielhaften Darstellung von V. 7–10. „kann ich … sprechen“ bewahrt diese mögliche bzw. situationsbezogene Aussage und bleibt beim Grundverb „sprechen“.
- source_word: עַל
  choice: über
  rationale: Bei דבר על bedeutet die Präposition, dass von einem Gegenstand die Rede ist. „über“ ist im modernen Deutschen präzise und natürlich; „gegen“ würde hier unberechtigt Feindseligkeit ausdrücken.
- source_word: גּוֹי
  choice: Volk
  rationale: גּוֹי bezeichnet hier ein politisch-kollektives Volk. „Volk“ ist im Deutschen idiomatischer als „Nation“ und bildet mit „Königreich“ ein klares Paar.
- source_word: מַמְלָכָה
  choice: Königreich
  rationale: Die übliche Bedeutung ist „Königreich“ bzw. „Reich“; „Königreich“ erhält den politischen Sinn eindeutig.
- source_word: לִבְנֹת
  choice: um es aufzubauen
  rationale: בנה bedeutet wörtlich „bauen“. Beim Aufbau eines Volkes oder Königreichs ist „aufbauen“ im Deutschen natürlich und bewahrt das Bild. Das Pronomen „es“ nimmt die beiden singularischen Bezugsgrößen zusammenfassend auf.
- source_word: וְלִנְטֹעַ
  choice: und einzupflanzen
  rationale: נטע bedeutet „pflanzen“. „einpflanzen“ erhält das landwirtschaftliche Bild und lässt sich mit dem gemeinsamen Objekt „es“ natürlich koordinieren.
theological_decisions:
- issue: Bedingtheit göttlicher prophetischer Rede
  choice: „kann ich … sprechen“
  alternative: „spreche ich“ oder „werde ich sprechen“
  rationale: Der weitere Zusammenhang V. 7–10 beschreibt Gottes Ankündigungen und sein Handeln in Beziehung zur Reaktion eines Volkes. Die Formulierung bewahrt diesen situationsbezogenen Charakter, ohne Ungewissheit Gottes zu behaupten oder die Spannung des Textes aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung bleibt gut verständlich; die beiden Bilder „aufbauen“ und „einpflanzen“ werden erhalten. Der Fußnotenmarker [a] steht unmittelbar bei „Königreich“.
