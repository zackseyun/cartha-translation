reference: Jeremiah 18:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אֱמָר נָ֣א אֶל אִישׁ יְהוּדָה֩ וְ/עַל יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤ר עֲלֵי/כֶם֙ רָעָ֔ה וְ/חֹשֵׁ֥ב עֲלֵי/כֶ֖ם מַֽחֲשָׁבָ֑ה שׁ֣וּבוּ נָ֗א אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וְ/הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַעַלְלֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/011.yaml
  text: 'Now therefore[a], say to the men of Judah and to the inhabitants of Jerusalem, saying, ‘Thus says Yahweh: Behold, I am shaping disaster against you and devising a plan against you. Turn back, please, each man from his evil way[c][b], and make your ways and your deeds good.’'
translation:
  language: de
  text: 'Und nun sprich doch zu den Männern von Juda und zu den Bewohnern Jerusalems: »So spricht Jahwe: Seht, ich forme[a] Unheil gegen euch und ersinne einen Plan gegen euch. Kehrt doch um[b], jeder von seinem bösen Weg[c], und bessert eure Wege und eure Taten!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »gestalte Unheil gegen euch«. Das Verb greift das Bild des Töpfers aus dem unmittelbaren Zusammenhang auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Kehrt doch zurück« oder »Tut doch Buße«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »jeder von seinem bösen Weg«. Der Singular ist distributiv: Die Gemeinschaft wird Mitglied für Mitglied angesprochen.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl den zeitlichen Übergang als auch den folgernden Anschluss an das vorausgehende Töpferbild, ohne im Deutschen eine stärkere Schlussfolgerung einzutragen.
- source_word: אֱמָר נָא
  choice: sprich doch
  rationale: Der Imperativ wird direkt wiedergegeben; »doch« vermittelt die dringliche beziehungsweise nachdrückliche Nuance von נָא natürlich.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: zu den Männern Judas
  rationale: אִישׁ steht hier kollektiv. Die Wiedergabe erhält die maskuline Form und macht zugleich die Mehrzahl der Angesprochenen verständlich.
- source_word: וְעַל יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: und zu den Bewohnern Jerusalems
  rationale: עַל bezeichnet in Verbindung mit dem Redeverb hier die Adressaten; die deutsche Präposition »zu« ist idiomatisch.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die prophetische Botenformel und gibt das Tetragramm als Gottes persönlichen Namen wieder.
- source_word: הִנֵּה אָנֹכִי
  choice: Seht, ich
  rationale: »Seht« signalisiert die feierliche Ankündigung und spricht die angesprochene Gemeinschaft passend im Plural an.
- source_word: יוֹצֵר
  choice: forme
  rationale: Das Verb bewahrt den bewussten Anklang an den Töpfer und das Formen im unmittelbaren Kontext.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang bezeichnet das Wort angekündigtes Verderben beziehungsweise Gericht, nicht moralische Bosheit Gottes.
- source_word: וְחֹשֵׁב ... מַחֲשָׁבָה
  choice: und ersinne einen Plan
  rationale: Gibt die figura etymologica mit natürlichem Deutsch wieder und bewahrt die Aussage bewusster Planung.
- source_word: שׁוּבוּ נָא
  choice: Kehrt doch um
  rationale: Erhält das konkrete Bild der Richtungsänderung; »doch« gibt die eindringliche Nuance von נָא wieder, ohne das Verb vorschnell theologisch zu verengen.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: jeder von seinem bösen Weg
  rationale: 'Bewahrt den distributiven Singular: Die Gemeinschaft wird Mitglied für Mitglied zur Umkehr aufgefordert. Das Wegbild für die Lebensführung bleibt erhalten.'
- source_word: וְהֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: und ändert eure Wege und eure Taten zum Guten
  rationale: Gibt die kausative Aufforderung verständlich und natürlich wieder und erhält die beiden parallelen Begriffe für Lebensführung und Handlungen.
theological_decisions:
- issue: Bedeutung von רָעָה als Gegenstand des göttlichen Formens
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Der Kontext spricht von angekündigtem Gericht. »Unheil« wahrt die mögliche Härte des Ausdrucks, ohne Gott moralische Bosheit zuzuschreiben.
- issue: Metaphorische Verbindung zum Töpferbild
  choice: forme
  alternative: bereite; gestalte
  rationale: »Forme« erhält die durch יוֹצֵר hervorgerufene Verbindung zum Töpfer der vorangehenden Verse und damit die rhetorische Spannung des Abschnitts.
- issue: Umkehrruf שׁוּבוּ
  choice: Kehrt um
  alternative: Kehrt zurück; Tut Buße
  rationale: Die konkrete Bewegungsmetapher bleibt erhalten und umfasst sowohl Abkehr vom Bösen als auch Rückkehr, ohne die Bedeutung auf eine spätere theologische Fachformel festzulegen.
- issue: Distributiver maskuliner Singular אִישׁ
  choice: jeder ... seinem
  alternative: alle ... ihren; jede und jeder
  rationale: 'Die grammatische und rhetorische Form des Hebräischen wird bewahrt: Die ganze Gemeinschaft ist angesprochen, aber jedes einzelne Mitglied trägt Verantwortung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Botenformel. »Jahwe« gibt den Gottesnamen wieder. Die Töpfermetapher, der eindringliche Ton beider נָא-Partikeln und der Wechsel zwischen gemeinschaftlicher und individueller Anrede bleiben sichtbar.
