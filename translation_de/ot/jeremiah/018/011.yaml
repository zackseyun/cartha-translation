  - severity: low
    issue: »Männer Judas« kann im Deutschen einen possessiven Bezug auf die Person Juda nahelegen.
    rationale: Der Ausdruck meint die Männer beziehungsweise Bewohner des Gebietes Juda. »Männer von Juda« verdeutlicht diesen Bezug und bleibt gendergetreu.
