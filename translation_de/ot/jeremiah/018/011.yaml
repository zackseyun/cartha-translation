revisions:
- from: 'Und nun sprich doch zu den Männern Judas und zu den Bewohnern Jerusalems: »So spricht Jahwe: Seht, ich forme[a] Unheil gegen euch und ersinne einen Plan gegen euch. Kehrt doch um[b], jeder von seinem bösen Weg[c], und ändert eure Wege und eure Taten zum Guten!«'
  to: 'Und nun sprich doch zu den Männern von Juda und zu den Bewohnern Jerusalems: »So spricht Jahwe: Seht, ich forme[a] Unheil gegen euch und ersinne einen Plan gegen euch. Kehrt doch um[b], jeder von seinem bösen Weg[c], und bessert eure Wege und eure Taten!«'
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachliche Verbesserungen: »von Juda« klärt den territorialen Bezug der kollektiven Anrede, und »bessert« gibt den abschließenden Hifil-Imperativ natürlicher und unmittelbarer wieder. Aussagegehalt, Register, Ambiguitäten, Gottesname und sämtliche Fußnoten bleiben erhalten.'
