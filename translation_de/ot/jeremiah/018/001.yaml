  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/001.yaml
  text: The word that came to Yirmeyahu from Yahweh[a], saying,
translation:
  language: de
  text: 'Das Wort, das von Jahwe an Jeremia erging, lautete:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: das Wort
  rationale: In der prophetischen Offenbarungsformel bezeichnet דָּבָר die von Gott ausgehende Botschaft. „Das Wort“ wahrt den formalen Bezug auf das göttliche Reden und ist im Deutschen geläufig.
- source_word: הָיָה אֶל
  choice: erging an
  rationale: Die Verbindung bezeichnet idiomatisch, dass Gottes Wort den Propheten erreicht. „Erging an“ ist eine natürliche und zugleich würdevolle deutsche Wiedergabe der prophetischen Formel.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: „Jeremia“ ist die im modernen Standarddeutsch fest etablierte Form des hebräischen Namens und ermöglicht unmittelbare Wiedererkennbarkeit.
- source_word: מֵאֵת
  choice: von
  rationale: מֵאֵת kennzeichnet hier den Ursprung des Wortes; „von“ gibt diese Herkunft knapp und eindeutig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen übliche lautnahe Wiedergabe des Tetragramms und bewahrt den Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: לֵאמֹר
  choice: 'lautete:'
  rationale: Der Infinitiv leitet die nachfolgende Gottesrede ein. In Verbindung mit „das Wort“ gibt „lautete:“ diese Funktion in natürlichem Deutsch wieder und hält den Satz für den folgenden Vers offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen Namen und vermeidet die im Ausgangstext nicht ausdrücklich stehende Ersetzung durch den Titel „der HERR“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle deutsche Namensform „Jeremia“ dient der Verständlichkeit; die Satzstellung bleibt nahe an der hebräischen Offenbarungsformel. Der Doppelpunkt zeigt an, dass die angekündigte Rede im folgenden Vers beginnt.
