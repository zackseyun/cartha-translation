source:
  edition: WLC
  text: כִּֽי שְׁכֵחֻ֥/נִי עַמִּ֖/י לַ/שָּׁ֣וְא יְקַטֵּ֑רוּ וַ/יַּכְשִׁל֤וּ/ם בְּ/דַרְכֵי/הֶם֙ שְׁבִילֵ֣י עוֹלָ֔ם לָ/לֶ֣כֶת נְתִיב֔וֹת דֶּ֖רֶךְ לֹ֥א סְלוּלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/015.yaml
  text: For my people have forgotten me[a]; they burn incense to emptiness. They have stumbled in their ways, in the ancient paths, to walk on side roads[d][c][b], on a road not built up.
translation:
  language: de
  text: Denn mein Volk hat mich vergessen; dem Nichtigen räuchern sie.[a] Sie bringen sie auf ihren Wegen, den uralten Pfaden, zu Fall,[b] damit sie auf Nebenpfaden gehen,[d] auf einem nicht gebahnten Weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Nichtigkeit“, „dem Falschen“ oder „den Götzen“. Das hebräische Wort bezeichnet Nichtigkeit, Wertlosigkeit oder Falschheit und kann hier nichtige Götterverehrung meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Sie bringen sie auf ihren Wegen, den uralten Pfaden, zu Fall.“ Wer mit dem handelnden „sie“ gemeint ist, bleibt im knappen hebräischen Satz unklar. Auch möglich: „Sie wurden auf ihren Wegen, den uralten Pfaden, zu Fall gebracht“ oder „Sie straucheln auf ihren Wegen, den uralten Pfaden“.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: „Seitenwege“, „Abwege“ oder „Pfade“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁכֵחֻנִי
  choice: hat mich vergessen
  rationale: Das Qal-Perfekt mit Suffix der 1. Person Singular bezeichnet unmittelbar das Vergessen; im Zusammenhang schwingt die Abkehr von Gott mit, ohne dass sie erklärend in den Text eingefügt wird.
- source_word: לַשָּׁוְא
  choice: dem Nichtigen
  rationale: שָׁוְא umfasst Nichtigkeit, Falschheit und Wertlosigkeit. Die substantivierte Form wahrt die knappe, absichtlich unspezifische Bezeichnung des falschen Kultgegenstands.
- source_word: יְקַטֵּרוּ
  choice: bringen sie Räucheropfer dar
  rationale: Das Piel von קטר bezeichnet hier das Verbrennen beziehungsweise Darbringen von Räucherwerk; „Räucheropfer darbringen“ ist natürliches, kultisch passendes Deutsch.
- source_word: וַיַּכְשִׁילוּם
  choice: Man brachte sie … zum Straucheln
  rationale: Die Hifil-Form ist kausativ und enthält ein Objekt der 3. Person Plural. Die unpersönliche Wiedergabe bewahrt sowohl die Kausativität als auch die Unbestimmtheit des im Hebräischen nicht eindeutig identifizierbaren Agens.
- source_word: בְּדַרְכֵיהֶם
  choice: auf ihren Wegen
  rationale: Die Präposition ב wird räumlich als „auf“ wiedergegeben und erhält das durchgehende Wegbild.
- source_word: שְׁבִילֵי עוֹלָם
  choice: auf den uralten Pfaden
  rationale: עוֹלָם bezeichnet hier das seit alters Bestehende. „Uralte Pfade“ ist verständlich und bewahrt Jeremias Bild für den überlieferten, von Gott gewiesenen Weg.
- source_word: לָלֶכֶת
  choice: sodass sie … gingen
  rationale: Der Infinitiv wird als Folgesatz wiedergegeben, damit die Beziehung zwischen dem Straucheln und dem Gehen auf ungeeigneten Pfaden in natürlichem Deutsch erkennbar bleibt.
- source_word: נְתִיבוֹת
  choice: Nebenpfade
  rationale: Im Gegensatz zu den uralten, gebahnten Wegen sind schmalere oder abseitige Pfade gemeint; „Nebenpfade“ hält diese Kontrastwirkung fest.
- source_word: דֶּרֶךְ לֹא סְלוּלָה
  choice: einen nicht gebahnten Weg
  rationale: סלל bezeichnet das Aufschütten oder Herrichten eines Weges. „Nicht gebahnt“ erhält das konkrete Bild in geläufigem Deutsch.
theological_decisions:
- issue: Bezeichnung des Gegenstands falscher Verehrung in לַשָּׁוְא
  choice: „dem Nichtigen“ statt einer ausdrücklichen Benennung als Götzen
  alternative: „den Götzen“, „falschen Göttern“ oder „vergeblich“
  rationale: Der Zusammenhang betrifft falschen Kult, doch שָׁוְא bezeichnet allgemeiner Nichtigkeit, Wertlosigkeit oder Falschheit. Die Übersetzung lässt diese Breite stehen und fügt keinen ausdrücklich genannten Kultgegenstand ein.
- issue: Agens und Kausativität von וַיַּכְשִׁילוּם
  choice: 'Unpersönlich-kausativ: „Man brachte sie … zum Straucheln“'
  alternative: 'Intransitiv: „sie strauchelten“; ausdrücklich aktiv: „sie brachten sie zum Straucheln“'
  rationale: Die hebräische Form ist kausativ und hat „sie“ als Objekt, während die Identität des handelnden Subjekts im knappen Satz nicht zweifelsfrei festgelegt ist. Die unpersönliche Konstruktion wahrt beides, ohne Götzen, Priester oder andere Verführer ausdrücklich einzusetzen.
- issue: Verhältnis zu den „uralten Pfaden“
  choice: Das Straucheln wird räumlich „auf“ ihren Wegen und den uralten Pfaden dargestellt.
  alternative: „weg von ihren Wegen, den uralten Pfaden“
  rationale: Die Alternative gibt den gedanklichen Sinn einer Abkehr deutlich wieder, verlangt aber eine ablativische Deutung der Präposition ב. „Auf“ bildet die vorhandene Präposition formnäher ab und lässt die anschließende Bewegung auf Nebenpfade als Folge erscheinen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit durchgehendem Wegbild. „Dem Nichtigen“ bewahrt die knappe und theologisch offene Ausdrucksweise des Hebräischen; „Räucheropfer darbringen“ macht den kultischen Vorgang verständlich. Die ungewöhnliche unpersönliche Konstruktion bei וַיַּכְשִׁילוּם dient dazu, dessen Kausativität nicht einzuebnen und zugleich kein ungenanntes Agens festzulegen.
