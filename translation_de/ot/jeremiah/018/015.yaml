  to: Denn mein Volk hat mich vergessen; dem Nichtigen räuchern sie.[a] Sie bringen sie auf ihren Wegen, den uralten Pfaden, zu Fall,[b] damit sie auf Nebenpfaden gehen,[d] auf einem nicht gebahnten Weg.
