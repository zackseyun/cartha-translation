base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/019.yaml
  text: Pay attention to me[a], O Yahweh, and hear the voice of my adversaries.
translation:
  language: de
  text: Hör mir aufmerksam zu, Jahwe, und höre auf die Stimme meiner Widersacher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »höre auf die Stimme meiner Widersacher«; gemeint sein kann sowohl, dass Jahwe ihre Anklagen gegen mich anhören soll, als auch, dass er ihr feindliches Planen wahrnehmen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Höre aufmerksam
  rationale: Der Hifil-Imperativ von קשׁב fordert eindringlich dazu auf, aufmerksam hinzuhören; die Wendung ist im modernen Deutsch natürlich und unterscheidet sich zugleich vom folgenden einfachen שׁמע.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als der persönliche Gottesname Jahwe wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלָי
  choice: auf mich
  rationale: Bei »auf jemanden hören« wird die Richtung des hebräischen אֶל im Deutschen idiomatisch durch »auf« ausgedrückt.
- source_word: וּשְׁמַע
  choice: und höre
  rationale: Der Qal-Imperativ von שׁמע bezeichnet hier das Hören beziehungsweise Anhören und bewahrt die parallele Struktur des hebräischen Satzes.
- source_word: לְקוֹל
  choice: auf die Stimme
  rationale: קוֹל bedeutet wörtlich »Stimme« oder »Laut«. Die konkrete Formulierung bleibt erhalten; die deutsche Verbfügung verlangt »auf«.
- source_word: יְרִיבָי
  choice: meiner Widersacher
  rationale: Das von ריב abgeleitete Wort bezeichnet Menschen, die gegen Jeremia streiten oder ihn anfeinden. »Widersacher« wahrt die Breite zwischen Anklage, Streit und feindlichem Vorgehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Worauf sich das Hören der Stimme der Widersacher richtet
  choice: Die mehrdeutige Wendung »höre auf die Stimme meiner Widersacher« bleibt im Text erhalten.
  alternative: Höre ihre Anklagen; nimm ihr feindliches Planen wahr.
  rationale: Der hebräische Ausdruck kann sowohl das Anhören ihrer gegen Jeremia gerichteten Worte oder Anklagen als auch das Wahrnehmen ihres feindlichen Vorgehens bezeichnen. Der Haupttext entscheidet diese Spannung nicht einseitig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von »höre« bildet den hebräischen Parallelismus ab; »Widersacher« ist gehoben, aber allgemein verständlich und vermeidet eine vorschnelle Beschränkung auf einen Rechtsstreit.
