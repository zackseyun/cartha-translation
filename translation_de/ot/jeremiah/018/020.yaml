  text: הַ/יְשֻׁלַּ֤ם תַּֽחַת טוֹבָה֙ רָעָ֔ה כִּֽי כָר֥וּ שׁוּחָ֖ה לְ/נַפְשִׁ֑/י זְכֹ֣ר עָמְדִ֣/י לְ/פָנֶ֗י/ךָ לְ/דַבֵּ֤ר עֲלֵי/הֶם֙ טוֹבָ֔ה לְ/הָשִׁ֥יב אֶת חֲמָתְ/ךָ֖ מֵ/הֶֽם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/020.yaml
  text: Should evil be repaid for good? For they have dug a pit for my life[a]. Remember that I stood before you to speak good on their behalf[b], to turn your wrath away from them.
translation:
  language: de
  text: Soll Böses für Gutes vergolten werden? Denn sie haben eine Grube für mich gegraben.[a] Denk daran, dass ich vor dir stand, um zu ihrem Besten über sie zu reden,[b] und deinen Zorn von ihnen abzuwenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie haben für meine Seele / mein Leben eine Grube gegraben“. Das hebräische Wort bezeichnet hier die bedrohte Person beziehungsweise ihr Leben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „um Gutes über sie zu reden“ oder „um für sie zu ihrem Besten zu sprechen“. Im Zusammenhang geht es um Jeremias Fürsprache für sie vor Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְשֻׁלַּם תַּחַת טוֹבָה רָעָה
  choice: Soll Böses für Gutes vergolten werden?
  rationale: Die passive rhetorische Frage und der scharfe Gegensatz zwischen Gutem und Bösem werden unmittelbar bewahrt; „für“ gibt den Gedanken der Vergeltung idiomatisch wieder.
- source_word: כָרוּ שׁוּחָה לְנַפְשִׁי
  choice: sie haben mir eine Grube gegraben, um mir das Leben zu nehmen
  rationale: Die Grube ist im Kontext eine tödliche Falle. נֶפֶשׁ bezeichnet hier das bedrohte Leben beziehungsweise die Person, nicht eigens eine vom Körper unterschiedene Seele.
- source_word: זְכֹר עָמְדִי לְפָנֶיךָ
  choice: Denk daran, dass ich vor dir stand
  rationale: Der Imperativ wird natürlich wiedergegeben; „vor dir stehen“ bewahrt die Vorstellung des Eintretens vor Gott.
- source_word: לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: um für sie zum Guten zu reden
  rationale: Die Formulierung hält die Mehrdeutigkeit zwischen wohlwollendem Reden über sie und Reden zu ihrem Nutzen fest, während der Zusammenhang Fürsprache erkennen lässt.
- source_word: לְהָשִׁיב אֶת חֲמָתְךָ מֵהֶם
  choice: deinen Zorn von ihnen abzuwenden
  rationale: Der Hifil von שׁוב bezeichnet das Abwenden; „Zorn“ ist im modernen Deutschen würdig und gibt die göttliche Gerichtsreaktion klar wieder.
theological_decisions:
- issue: Bedeutung von נֶפֶשׁ in der Todesgefahr
  choice: Leben
  alternative: Seele
  rationale: Der Zusammenhang beschreibt einen Anschlag auf Jeremias Person und Leben. „Seele“ könnte im Deutschen eine hier nicht geforderte Leib-Seele-Unterscheidung nahelegen.
- issue: Wiedergabe von חֵמָה als Bezeichnung göttlichen Zorns
  choice: Zorn
  alternative: Grimm / Glut
  rationale: „Zorn“ wahrt den Ernst des göttlichen Gerichts, ohne eine zusätzliche dogmatische Deutung einzutragen.
- issue: Sinn von לְדַבֵּר עֲלֵיהֶם טוֹבָה
  choice: für sie zum Guten zu reden
  alternative: Gutes über sie zu reden
  rationale: Die gewählte Formulierung lässt sowohl das Reden zu ihrem Vorteil als auch den im Kontext naheliegenden Charakter der Fürsprache erkennen, ohne die sprachliche Spannung völlig aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gebetston. Die rhetorische Frage und die Sprache der Fürsprache bleiben erhalten; „Grube“ bewahrt das konkrete Bild, während die tödliche Absicht idiomatisch verdeutlicht wird.
