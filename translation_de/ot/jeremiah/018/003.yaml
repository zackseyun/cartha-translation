  text: So I went down to the potter’s house[a], and there he was[b], doing work on the wheel.
translation:
  language: de
  text: Da ging ich zum Haus des Töpfers hinab, und dort war er gerade an der Töpferscheibe bei der Arbeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den beiden Steinen“. Die hebräische Dualform bezeichnet hier wohl die aus zwei Scheiben beziehungsweise Steinen bestehende Vorrichtung des Töpfers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Da ging ich … hinab
  rationale: Das Qal-Wayyiqtol der 1. Person Singular führt die Erzählung fort. „hinabgehen“ bewahrt die im Verb ירד enthaltene Richtungsangabe; „Da“ gibt den erzählerischen Anschluss natürlich wieder.
- source_word: בֵּית הַיּוֹצֵר
  choice: zum Haus des Töpfers
  rationale: Die Status-constructus-Verbindung bedeutet wörtlich „Haus des Töpfers“. Die gewählte Form ist im Deutschen klar und idiomatisch.
- source_word: וְהִנֵּהוּ
  choice: und tatsächlich … er
  rationale: הִנֵּה lenkt lebhaft die Aufmerksamkeit auf das, was Jeremia dort wahrnimmt; das Suffix verweist auf den Töpfer. „tatsächlich“ vermittelt diesen präsentierenden, überraschenden Zug in natürlichem modernem Deutsch.
- source_word: עֹשֶׂה מְלָאכָה
  choice: arbeitete … gerade
  rationale: Partizip und Substantiv bezeichnen den Töpfer mitten bei seiner Arbeit. „gerade arbeitete“ gibt den fortdauernden Vorgang natürlich wieder, ohne ein bestimmtes Werkstück vorauszusetzen.
- source_word: עַל הָאָבְנָיִם
  choice: an der Töpferscheibe
  rationale: Der Dual אָבְנַיִם bezeichnet hier nach verbreitetem Verständnis die aus zwei Scheiben beziehungsweise Steinen bestehende Vorrichtung des Töpfers. Der deutsche Singular „Töpferscheibe“ benennt das Gesamtgerät idiomatisch; die formale Besonderheit bleibt in der Fußnote sichtbar.
theological_decisions: []
