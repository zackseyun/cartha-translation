id: JER.18.14
reference: Jeremiah 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/יַעֲזֹ֥ב מִ/צּ֛וּר שָׂדַ֖י שֶׁ֣לֶג לְבָנ֑וֹן אִם יִנָּתְשׁ֗וּ מַ֛יִם זָרִ֥ים קָרִ֖ים נוֹזְלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/018/014.yaml
  text: Does the snow of Lebanon leave the rock of the open country? Or are cold[b][a], flowing foreign waters ever uprooted?
translation:
  language: de
  text: Verlässt der Schnee des Libanon den Felsen des offenen Landes[a]? Oder werden fremde[b], kalte, fließende Wasser je ausgerissen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „den Feldfelsen“, „die Felsklippe des offenen Landes“ oder ähnlich. Die hebräische Wendung ist schwierig und ruft wahrscheinlich die felsigen Höhen oder das offene Land im Umfeld des Libanon in Erinnerung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von fern kommende“. Gemeint sein kann Wasser aus einer entfernten Quelle; eine moralische Bedeutung von „fremd“ ist hier nicht vorausgesetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַעֲזֹב
  choice: Verlässt ...?
  rationale: Die Fragepartikel leitet eine rhetorische Frage ein. „Verlassen“ gibt עזב im Naturbild klar und ohne unnötige Personifizierung wieder.
- source_word: מִצּוּר שָׂדַי
  choice: den Felsen des offenen Landes
  rationale: צוּר bezeichnet einen Felsen oder eine Felsklippe; שָׂדַי gehört zu „Feld, offenes Land“. Die schwierige Wendung wird möglichst konkret wiedergegeben, ohne ihre geografische Aussage genauer festzulegen, als der hebräische Text erlaubt.
- source_word: שֶׁלֶג לְבָנוֹן
  choice: der Schnee des Libanon
  rationale: Die Wendung bezeichnet in natürlicher Weise den Schnee des Libanon und bewahrt das geografische Bild.
- source_word: אִם
  choice: Oder
  rationale: Im poetischen Parallelismus führt אִם eine zweite rhetorische Frage ein und keine gewöhnliche Bedingung.
- source_word: יִנָּתְשׁוּ
  choice: werden ... ausgerissen
  rationale: Die passive Verbform bewahrt das auffällige Bild des Heraus- oder Ausreißens. Eine Glättung zu „versiegen“ oder „aufhören“ würde eine im Hebräischen nicht ausdrücklich genannte Deutung eintragen.
- source_word: מַיִם
  choice: Wasser
  rationale: Das im Hebräischen grammatisch plurale Wort מַיִם wird im modernen Deutschen idiomatisch als Stoffbezeichnung „Wasser“ wiedergegeben; die Mehrzahl der beschriebenen Wasserläufe bleibt durch den Zusammenhang möglich.
- source_word: זָרִים
  choice: fremde
  rationale: זָרִים kann „fremd“ oder „von anderswoher kommend“ bedeuten. „Fremde“ erhält die lexikalische Offenheit, ohne eine moralische Wertung hinzuzufügen.
- source_word: קָרִים
  choice: kalte
  rationale: Die direkte Temperaturangabe passt zum Bild von Wasser aus dem Gebirge.
- source_word: נוֹזְלִים
  choice: fließende
  rationale: Das Partizip beschreibt Wasser in Bewegung; „fließend“ ist im heutigen Deutsch natürlich und legt die Stärke der Strömung nicht unnötig fest.
theological_decisions: []
translation_notes:
  register: Poetisch und würdevoll, zugleich in moderner Standardsprache. Die beiden rhetorischen Fragen und das ungewöhnliche Bild des ausgerissenen Wassers bleiben erhalten; schwierige geografische und lexikalische Einzelheiten werden nicht stillschweigend harmonisiert.
