source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה עִמְדוּ֩ עַל דְּרָכִ֨ים וּ/רְא֜וּ וְ/שַׁאֲל֣וּ לִ/נְתִב֣וֹת עוֹלָ֗ם אֵי זֶ֨ה דֶ֤רֶךְ הַ/טּוֹב֙ וּ/לְכוּ בָ֔/הּ וּ/מִצְא֥וּ מַרְגּ֖וֹעַ לְ/נַפְשְׁ/כֶ֑ם וַ/יֹּאמְר֖וּ לֹ֥א נֵלֵֽךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/016.yaml
  text: 'Thus says Yahweh: “Stand by the roads and look[a], and ask for the ancient paths, where the good way is; then walk in it, and find rest for your souls. But they said[b], ‘We will not walk in it.’”'
translation:
  language: de
  text: 'So spricht Jahwe:


    „Stellt euch an die Wege und schaut! Fragt nach den Pfaden aus alter Zeit[a]: Wo ist der gute Weg? Geht auf ihm und findet Ruhe für eure Seelen.[b] Doch sie sagten: ‚Wir werden nicht auf ihm gehen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die uralten Pfade“ oder „die ewigen Pfade“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann hier auch „für euch selbst“ oder „für euer Leben“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: עִמְדוּ עַל־דְּרָכִים
  choice: Stellt euch an die Wege
  rationale: Die Formulierung bewahrt das Bild von Menschen, die an den Wegen innehalten, ohne die möglicherweise gemeinte Wegkreuzung ausdrücklich in den Text einzutragen.
- source_word: וּרְאוּ
  choice: und schaut
  rationale: „Schaut“ kann sowohl die konkrete Wahrnehmung als auch das prüfende Betrachten im Bild der Wege ausdrücken.
- source_word: וְשַׁאֲלוּ לִנְתִבוֹת עוֹלָם
  choice: Fragt nach den Pfaden aus alter Zeit
  rationale: עוֹלָם bezeichnet hier am ehesten weit zurückliegende Zeit beziehungsweise hohes Alter; „aus alter Zeit“ wahrt zugleich die zeitliche Weite des Ausdrucks.
- source_word: אֵי־זֶה דֶרֶךְ הַטּוֹב
  choice: Wo ist der gute Weg?
  rationale: Die Frage sucht im fortgeführten Wegbild nach dem richtigen Weg. Die eigenständige Frage ist im Deutschen klar und erhält die Bildsprache.
- source_word: וּלְכוּ־בָהּ
  choice: Geht auf ihm
  rationale: „Auf ihm gehen“ ist im Deutschen die natürliche Fortführung des Wegbildes und kann zugleich die Lebensführung bezeichnen.
- source_word: וּמִצְאוּ מַרְגּוֹעַ
  choice: und findet Ruhe
  rationale: Die imperativische Form des Hebräischen bleibt erhalten; „Ruhe“ gibt die zugesagte Erquickung beziehungsweise das Aufatmen schlicht und würdig wieder.
- source_word: לְנַפְשְׁכֶם
  choice: für eure Seelen
  rationale: Die traditionelle Wendung bewahrt das Gewicht von נֶפֶשׁ, ohne dessen Bedeutungsumfang auf eine rein körperlose Seele festzulegen; eine Fußnote nennt weitere mögliche Wiedergaben.
- source_word: וַיֹּאמְרוּ
  choice: Doch sie sagten
  rationale: „Doch“ macht den im Zusammenhang klaren Gegensatz zwischen Jahwes Aufforderung und der ablehnenden Antwort sichtbar.
- source_word: לֹא נֵלֵךְ
  choice: Wir werden nicht auf ihm gehen
  rationale: „Auf ihm“ nimmt den unmittelbar zuvor genannten guten Weg auf. Das Hebräische lässt das Bezugswort unausgesprochen, im Deutschen macht die Ergänzung den Bezug eindeutig.
theological_decisions:
- issue: Bedeutungsumfang von נֶפֶשׁ
  choice: für eure Seelen
  alternative: für euch selbst / für euer Leben
  rationale: „Seelen“ erhält die geistliche und persönliche Tiefe der Zusage, soll aber keine starre Trennung von Körper und Seele lehren. Die Fußnote bewahrt den breiteren hebräischen Bedeutungsumfang.
- issue: Zeitliche Bedeutung von עוֹלָם
  choice: Pfade aus alter Zeit
  alternative: uralte Pfade / ewige Pfade
  rationale: Im Zusammenhang geht es wahrscheinlich um die seit alters bewährten Wege. Da עוֹלָם auch lange oder unabsehbare Dauer bezeichnen kann, werden die wichtigsten Alternativen in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Wegmetaphorik. Die kurzen Aufforderungen folgen dem hebräischen Rhythmus. Die Anrede steht im Plural; der Wechsel zu „sie sagten“ bleibt sichtbar. Die Fußnotenmarker wurden an die Ausdrücke gesetzt, auf die sie sich inhaltlich beziehen.
