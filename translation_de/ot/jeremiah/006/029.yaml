id: JER.6.29
reference: Jeremiah 6:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נָחַ֣ר מַפֻּ֔חַ מ/אשת/ם עֹפָ֑רֶת לַ/שָּׁוְא֙ צָרַ֣ף צָר֔וֹף וְ/רָעִ֖ים לֹ֥א נִתָּֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/029.yaml
  text: The bellows blow fiercely[a]; the lead is consumed by the fire. In vain the refiner keeps refining[b], but the wicked are not separated out.
translation:
  language: de
  text: Der Blasebalg schnaubt heftig[a], das Blei wird vom Feuer verzehrt. Vergeblich läutert der Schmelzer immer weiter; doch die Bösen werden nicht ausgeschieden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Blasebalg ist versengt/verbrannt; vom Feuer ist das Blei aufgezehrt.“ Der hebräische Wortlaut dieses Satzteils ist schwierig; wie Blasebalg, Feuer und Blei genau aufeinander bezogen sind, wird unterschiedlich verstanden.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „die Schlechten werden nicht entfernt“; im engeren metallurgischen Sinn auch: „die Verunreinigungen werden nicht abgeschieden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחַר
  choice: schnaubt heftig
  rationale: Das Verb bezeichnet wörtlich heftiges Schnauben oder angestrengtes Atmen. Mit dem Blasebalg als Subjekt vermittelt „schnaubt heftig“ anschaulich dessen kraftvolles Blasen, ohne die schwierige Form vorschnell als „verbrennt“ festzulegen.
- source_word: מַפֻּחַ
  choice: Blasebalg
  rationale: Gemeint ist das Gerät, mit dem beim Schmelzen und Läutern das Feuer angefacht wird. „Blasebalg“ ist dafür die geläufige deutsche Bezeichnung.
- source_word: מ/אשת/ם
  choice: vom Feuer
  rationale: Die überlieferte Form und die Gliederung der Wendung sind schwierig. Im Zusammenhang bezeichnet sie am ehesten das Feuer als Ursache dafür, dass das Blei verzehrt wird; die Übersetzung bleibt bewusst allgemein.
- source_word: עֹפָרֶת
  choice: das Blei
  rationale: Das Substantiv bezeichnet Blei, das hier zum metallurgischen Läuterungsprozess gehört.
- source_word: לַשָּׁוְא
  choice: Vergeblich
  rationale: Die Wendung kennzeichnet den Läuterungsversuch als erfolglos und bewahrt in knapper Form den prophetischen Ton.
- source_word: צָרַף צָרוֹף
  choice: läutert der Schmelzer immer weiter
  rationale: Die Wiederholung des Wortstamms verstärkt beziehungsweise intensiviert den Vorgang. „Immer weiter“ gibt diese nachdrückliche Fortsetzung natürlich wieder; „der Schmelzer“ wird aus dem metallurgischen Zusammenhang ergänzt.
- source_word: וְרָעִים
  choice: doch die Bösen
  rationale: Das Adjektiv kann im Bild an schlechte Bestandteile denken lassen, bezeichnet aber gewöhnlich böse Menschen. Die personale Wiedergabe erhält den moralischen Bezug des Zusammenhangs.
- source_word: נִתָּקוּ
  choice: werden nicht ausgeschieden
  rationale: Im Läuterungsbild bezeichnet das Verb das Entfernen oder Absondern dessen, was nicht bleiben soll. „Ausgeschieden“ passt sowohl zum metallurgischen Bild als auch zu dessen Anwendung auf Menschen.
theological_decisions:
- issue: Deutung des Läuterungsbildes
  choice: 'Das erfolglose Läutern beschreibt bildhaft die moralische Unverbesserlichkeit des Volkes: Trotz fortgesetzter Läuterung werden die Bösen nicht ausgeschieden.'
  alternative: Eine ausschließlich metallurgische Aussage über einen misslungenen Schmelzvorgang.
  rationale: Der unmittelbare Zusammenhang spricht von der Prüfung des Volkes. Zugleich bleibt das konkrete Bild eines misslungenen Läuterungsvorgangs vollständig erhalten, statt durch eine rein abstrakte Deutung ersetzt zu werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das kräftige Bild des schnaubenden Blasebalgs und die Wiederholung des Läuterns bleiben anschaulich; die textliche Unsicherheit im ersten Halbvers wird in einer Fußnote offengelegt.
