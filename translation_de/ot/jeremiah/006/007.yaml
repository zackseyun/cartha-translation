id: JER.6.7
reference: Jeremiah 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כְּ/הָקִ֥יר בור מֵימֶ֔י/הָ כֵּ֖ן הֵקֵ֣רָה רָעָתָ֑/הּ חָמָ֣ס וָ֠/שֹׁד יִשָּׁ֨מַע בָּ֧/הּ עַל פָּנַ֛/י תָּמִ֖יד חֳלִ֥י וּ/מַכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/007.yaml
  text: As a well keeps its waters fresh[a], so she keeps her evil fresh. Violence and destruction are heard in her[c][b]; before me continually are sickness and wounds.
translation:
  language: de
  text: Wie ein Brunnen sein Wasser hervorquellen lässt[a], so lässt sie ihre Bosheit hervorquellen. Gewalt und Verwüstung[b] sind in ihr zu hören; ständig stehen mir Krankheit und Wunde vor Augen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie eine Zisterne ihr Wasser kühl hält, so hält sie ihre Bosheit frisch.“ Das hebräische Verb ist schwierig; das Bild kann das Hervorbringen von Wasser oder dessen Kühl- beziehungsweise Frischhalten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Gewalt und Zerstörung“ beziehungsweise „Gewalt und Plünderung“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Vor meinem Angesicht sind ständig Krankheit und Wunde.“ Die Ausdrücke können den Zustand der Stadt buchstäblich oder bildlich beschreiben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהָקִיר / הֵקֵרָה
  choice: hervorquellen lässt
  rationale: Die schwierige Verbform steht parallel in beiden Vershälften. Im Zusammenhang mit Brunnen und Wasser gibt „hervorquellen lassen“ das Bild einer fortwährenden Hervorbringung wieder und bewahrt durch die Wiederholung die hebräische Rhetorik.
- source_word: בּוֹר
  choice: Brunnen
  rationale: Das Wort kann Grube, Zisterne oder Brunnen bezeichnen. Wegen des Wassers und des gewählten Verbs ist „Brunnen“ hier das natürlichste deutsche Bild; „Zisterne“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: מֵימֶיהָ
  choice: sein Wasser
  rationale: Hebräisches מַיִם hat Pluralform, wird im Deutschen bei einer Wassermenge jedoch idiomatisch als Singular wiedergegeben.
- source_word: רָעָתָהּ
  choice: ihre Bosheit
  rationale: Der moralische Sinn ist durch die anschließende Nennung von Gewalt und Verwüstung naheliegend. „Bosheit“ bezeichnet das verwerfliche Handeln der personifizierten Stadt deutlicher als das mehrdeutige „Böse“.
- source_word: חָמָס וָשֹׁד
  choice: Gewalt und Verwüstung
  rationale: „Gewalt“ gibt חָמָס im prophetischen Anklagekontext treffend wieder; שֹׁד kann Verwüstung, Zerstörung oder Plünderung bezeichnen. „Verwüstung“ wahrt die Wirkung gewaltsamer Zerstörung, ohne den Begriff unnötig einzuengen.
- source_word: יִשָּׁמַע בָּהּ
  choice: sind in ihr zu hören
  rationale: Die passive Form und der fortdauernde Eindruck werden natürlich wiedergegeben. „Ihr“ bewahrt die feminine Personifikation Jerusalems.
- source_word: עַל־פָּנַי תָּמִיד
  choice: ständig stehen mir ... vor Augen
  rationale: Die deutsche Wendung gibt „fortwährend vor meinem Angesicht“ idiomatisch wieder und erhält die unmittelbare göttliche Wahrnehmung.
- source_word: חֳלִי וּמַכָּה
  choice: Krankheit und Wunde
  rationale: Die konkreten körperlichen Begriffe bleiben erhalten, ebenso der Numerus der hebräischen Substantive. Ob sie den Zustand der Stadt bildlich oder buchstäblich beschreiben, wird im Haupttext nicht entschieden.
theological_decisions:
- issue: Feminine Personifikation Jerusalems
  choice: Die Stadt wird mit „sie“ und „ihr“ bezeichnet.
  alternative: Die Stadt sachlich mit „es“ beziehungsweise „darin“ bezeichnen.
  rationale: Die femininen Suffixe des Hebräischen personifizieren Jerusalem. Diese sprachliche Gestalt gehört zur prophetischen Anrede und wird ohne zusätzliche dogmatische Deutung bewahrt.
- issue: Bedeutung von Krankheit und Wunde
  choice: Die konkreten Ausdrücke „Krankheit und Wunde“ werden beibehalten.
  alternative: Abstrakter als „Leiden und Verletzung“ oder ausschließlich metaphorisch als gesellschaftlicher Verfall wiedergeben.
  rationale: Der Text lässt offen, ob körperliche Not, ein Bild für den moralisch-sozialen Zustand der Stadt oder beides gemeint ist. Die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Die Wiederholung von „hervorquellen lässt“ bildet den Parallelismus des Hebräischen ab. „Vor Augen stehen“ ist idiomatisch, ohne die Perspektive Gottes abzuschwächen.
