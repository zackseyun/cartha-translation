id: JER.6.19
reference: Jeremiah 6:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְעִ֣י הָ/אָ֔רֶץ הִנֵּ֨ה אָנֹכִ֜י מֵבִ֥יא רָעָ֛ה אֶל הָ/עָ֥ם הַ/זֶּ֖ה פְּרִ֣י מַחְשְׁבוֹתָ֑/ם כִּ֤י עַל דְּבָרַ/י֙ לֹ֣א הִקְשִׁ֔יבוּ וְ/תוֹרָתִ֖/י וַ/יִּמְאֲסוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/019.yaml
  text: 'Hear[a], O earth: behold, I am bringing disaster on this people, the fruit of their thoughts, because they have not listened to my words[b], and they have rejected my law.'
translation:
  language: de
  text: Höre, Erde! Sieh, ich bringe Unheil über dieses Volk – die Frucht ihrer Gedanken[a]. Denn auf meine Worte haben sie nicht gehört, und meine Weisung[b] haben sie verworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Frucht ihrer Pläne“ beziehungsweise „das Ergebnis ihrer Vorhaben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mein Gesetz“. Das hebräische Wort Tora kann sowohl verbindliche Weisung als auch Gesetz bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Höre
  rationale: Der feminine Singular des Imperativs richtet sich an die personifizierte Erde. „Höre“ bewahrt den feierlichen prophetischen Zeugenaufruf.
- source_word: הָאָרֶץ
  choice: Erde
  rationale: In der direkten Anrede ist „Erde“ wahrscheinlicher als das territorial begrenzte „Land“ und entspricht der Vorstellung einer umfassenden Zeugin.
- source_word: הִנֵּה
  choice: Sieh
  rationale: Das Wort leitet eine eindringliche göttliche Ankündigung ein. „Sieh“ ist im heutigen Deutsch verständlich und bewahrt den Aufforderungscharakter.
- source_word: מֵבִיא רָעָה
  choice: ich bringe Unheil
  rationale: רָעָה bezeichnet hier nicht moralisches Böses, sondern das als Gericht kommende Unglück. Die präsentische Form gibt die hebräische Partizipialkonstruktion wieder.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Die singularische Form und der Demonstrativ werden direkt wiedergegeben; zugleich bleibt der distanzierende Ton der Anklage erhalten.
- source_word: פְּרִי מַחְשְׁבוֹתָם
  choice: die Frucht ihrer Gedanken
  rationale: Die Formulierung bewahrt das Bild der Frucht als Folge dessen, was das Denken des Volkes hervorgebracht hat, ohne „Gedanken“ vorschnell als böse Pläne festzulegen.
- source_word: עַל דְּבָרַי לֹא הִקְשִׁיבוּ
  choice: auf meine Worte haben sie nicht gehört
  rationale: הקשיב על bezeichnet aufmerksames Hören. Die Wiedergabe lässt die darin liegende Ungehorsamkeit erkennen, ersetzt das Hören aber nicht interpretierend durch „gehorchen“.
- source_word: וְתוֹרָתִי
  choice: meine Weisung
  rationale: תּוֹרָה bezeichnet Gottes verbindliche Unterweisung. „Weisung“ erhält sowohl den lehrenden als auch den verpflichtenden Sinn und vermeidet im modernen Deutsch die mögliche Verengung von „Gesetz“ auf einen Gesetzeskodex.
- source_word: וַיִּמְאֲסוּ בָהּ
  choice: haben sie verworfen
  rationale: מאס bezeichnet entschiedene Zurückweisung. „Verwerfen“ ist stark, idiomatisch und entspricht dem feierlichen Register.
theological_decisions:
- issue: Wiedergabe von תּוֹרָה im prophetischen Bundeskontext
  choice: meine Weisung
  alternative: mein Gesetz
  rationale: „Weisung“ bildet die Bedeutungsbreite von תּוֹרָה ab und bleibt zugleich durch das Possessivpronomen und das Verb „verwerfen“ verbindlich. „Gesetz“ ist wegen des bundesrechtlichen Gewichts ebenfalls möglich und wird deshalb in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges prophetisches Deutsch. Die direkte Anrede „Höre, Erde!“ und das anschließende „Sieh“ erhalten den feierlichen Zeugenaufruf; der Gedankenstrich macht die appositionale Gerichtserklärung verständlich, ohne die hebräische Metapher aufzulösen.
