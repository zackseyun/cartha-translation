  to: 'Darum, so spricht Jahwe: „Siehe, ich lege diesem Volk Hindernisse in den Weg[a]. Darüber werden Väter und Söhne miteinander stolpern. Der Nachbar und sein Freund werden zugrunde gehen.“'
