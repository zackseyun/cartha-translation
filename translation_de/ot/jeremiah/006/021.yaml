  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֥י נֹתֵ֛ן אֶל הָ/עָ֥ם הַ/זֶּ֖ה מִכְשֹׁלִ֑ים וְ/כָ֣שְׁלוּ בָ֠/ם אָב֨וֹת וּ/בָנִ֥ים יַחְדָּ֛ו שָׁכֵ֥ן וְ/רֵע֖/וֹ יאבדו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/021.yaml
  text: 'Therefore[a], thus says Yahweh: Behold, I am setting stumbling blocks before this people, and they will stumble over them—fathers and sons together[b]; neighbor and his friend will perish.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: „Siehe, ich lege diesem Volk Hindernisse in den Weg[a]. Darüber werden Väter und Söhne miteinander stolpern. Der Nachbar und sein Freund werden zugrunde gehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich setze diesem Volk Hindernisse vor.“ Die Präposition kann hier auch stärker im Sinn von „gegen dieses Volk“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verbindung zur vorausgehenden Anklage knapp und idiomatisch wieder.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die traditionelle deutsche Form der prophetischen Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Erhält den feierlichen, aufmerksamkeitslenkenden Charakter der hebräischen Wendung.
- source_word: נֹתֵן אֶל הָעָם הַזֶּה מִכְשֹׁלִים
  choice: ich lege diesem Volk Stolpersteine in den Weg
  rationale: Gibt das Bild von absichtlich in den Weg gelegten Hindernissen natürlich wieder; „Stolpersteine“ erhält zudem die Wortverbindung zum folgenden Verb כשל.
- source_word: וְכָשְׁלוּ בָם
  choice: Über sie werden sie stürzen
  rationale: Bewahrt die konkrete Bildsprache und die lexikalische Verbindung zwischen den Hindernissen und dem Stürzen.
- source_word: אָבוֹת וּבָנִים יַחְדָּו
  choice: Väter und Söhne miteinander
  rationale: Folgt den ausdrücklich maskulinen Familienbezeichnungen des Hebräischen und erhält die Aussage gemeinsamer Betroffenheit.
- source_word: שָׁכֵן וְרֵעוֹ
  choice: der Nachbar und sein Freund
  rationale: Unterscheidet wie das Hebräische zwischen räumlicher Nachbarschaft und persönlicher bzw. gesellschaftlicher Verbundenheit.
- source_word: יֹאבֵדוּ
  choice: sie werden zugrunde gehen
  rationale: Drückt die Schwere des Gerichts aus, ohne die Art des Untergangs enger festzulegen, als es das hebräische Verb verlangt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Urheber der Stolpersteine
  choice: Jahwe legt sie dem Volk in den Weg
  alternative: Dem Volk begegnen lediglich unpersönliche Hindernisse
  rationale: Die erste Person in הִנְנִי נֹתֵן stellt Gottes aktives Handeln ausdrücklich als Gericht dar; diese theologische Spannung wird nicht abgeschwächt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer Feierlichkeit. Die direkte Rede und „Siehe“ erhalten den markanten Gerichtscharakter; „Stolpersteine … stürzen“ bildet das hebräische Wortspiel möglichst eng nach.
