source:
  edition: WLC
  text: וְ/נָסַ֤בּוּ בָֽתֵּי/הֶם֙ לַ/אֲחֵרִ֔ים שָׂד֥וֹת וְ/נָשִׁ֖ים יַחְדָּ֑ו כִּֽי אַטֶּ֧ה אֶת יָדִ֛/י עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/012.yaml
  text: Their houses will be turned over to others[a], together with their fields and wives; for I will stretch out my hand against the inhabitants of the land[b], declares Yahweh.
translation:
  language: de
  text: Ihre Häuser werden anderen zufallen, zusammen mit den Feldern und den Frauen[a]. Denn ich werde meine Hand gegen die Bewohner des Landes[b] ausstrecken – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehefrauen“. Das hebräische Wort kann sowohl Frauen allgemein als auch Ehefrauen bezeichnen; in diesem Zusammenhang ist wahrscheinlich an Ehefrauen gedacht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Bewohner der Erde“. Das hebräische Wort kann „Land“ oder „Erde“ bedeuten; hier legt der Zusammenhang die örtliche Bedeutung nahe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָסַבּוּ
  choice: werden … zufallen
  rationale: Der Niphal von סבב bezeichnet hier den Übergang von Besitz an andere. „Zufallen“ gibt den erzwungenen Eigentumswechsel im Deutschen natürlich wieder, ohne das unpassende Bild eines räumlichen Umdrehens einzutragen.
- source_word: בָתֵּיהֶם
  choice: ihre Häuser
  rationale: Die direkte Wiedergabe bewahrt den Bezug auf den enteigneten Hausbesitz.
- source_word: לַאֲחֵרִים
  choice: anderen
  rationale: אֲחֵרִים bedeutet schlicht „andere“; „Fremde“ würde eine nicht ausdrücklich vorhandene Nuance hinzufügen.
- source_word: שָׂדוֹת
  choice: die Felder
  rationale: „Felder“ ist die gewöhnliche und kontextuell passende Bezeichnung für den landwirtschaftlichen Besitz.
- source_word: וְנָשִׁים
  choice: die Frauen
  rationale: נָשִׁים kann sowohl „Frauen“ als auch „Ehefrauen“ bedeuten. Die Hauptübersetzung bewahrt diese im Deutschen teilweise ebenfalls vorhandene Offenheit; der Haushalts- und Enteignungskontext macht „Ehefrauen“ wahrscheinlich.
- source_word: יַחְדָּו
  choice: zusammen mit
  rationale: Die Formulierung verbindet Häuser, Felder und Frauen als gemeinsam eintretenden Verlust.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die angekündigte Enteignung ein.
- source_word: אַטֶּה אֶת־יָדִי
  choice: ich werde meine Hand … ausstrecken
  rationale: Die deutsche Wendung erhält das hebräische Bild für Jahwes aktives Eingreifen zum Gericht.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang mit der ausgestreckten Hand bezeichnet die Präposition ein feindliches beziehungsweise gerichtliches Vorgehen.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: die Bewohner des Landes
  rationale: Der unmittelbare Kontext betrifft das Gericht über Juda; daher ist die örtliche Bedeutung von אֶרֶץ hier wahrscheinlicher als „Erde“.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt die feierliche Bekräftigung wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von הָאָרֶץ
  choice: das Land
  alternative: die Erde
  rationale: Obwohl הָאָרֶץ beides bedeuten kann, spricht der Zusammenhang von Jeremias Gerichtswort über Juda für die örtliche Bedeutung. Die lexikalische Alternative bleibt in der Fußnote sichtbar.
- issue: Bedeutung von נָשִׁים
  choice: Frauen
  alternative: Ehefrauen
  rationale: Der Begriff ist lexikalisch mehrdeutig. Der Besitz- und Haushaltskontext legt „Ehefrauen“ nahe, doch „Frauen“ bewahrt die echte sprachliche Offenheit, ohne den Text unnötig festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt nah am hebräischen Gedankengang, während „anderen zufallen“ den Besitzübergang idiomatisch ausdrückt. Der Gedankenstrich vor der Botenformel markiert den feierlichen Abschluss.
