id: JER.6.17
reference: Jeremiah 6:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ צֹפִ֔ים הַקְשִׁ֖יבוּ לְ/ק֣וֹל שׁוֹפָ֑ר וַ/יֹּאמְר֖וּ לֹ֥א נַקְשִֽׁיב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/017.yaml
  text: 'I set watchmen over you: ‘Listen to the sound of the trumpet!’ But they said[b][a], ‘We will not listen.’'
translation:
  language: de
  text: 'Ich stellte Wächter über euch auf: »Achtet auf den Klang des Schofars![a]« Doch sie sagten: »Wir werden nicht darauf achten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Schofar ist ein Horn, das unter anderem als Alarm- und Warnsignal verwendet wurde; traditionell wird es auch mit „Posaune“ wiedergegeben.
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Ich stellte … auf
  rationale: Das Hifil von קום bezeichnet hier das Aufstellen beziehungsweise Einsetzen. „stellte … auf“ bewahrt das konkrete Bild, ohne eine förmliche Amtsbestellung vorauszusetzen.
- source_word: עֲלֵיכֶם
  choice: über euch
  rationale: עַל mit Suffix beschreibt die Stellung der Wächter gegenüber dem Volk als Aufsicht und Warnfunktion; „gegen euch“ würde den feindlichen Aspekt überbetonen.
- source_word: צֹפִים
  choice: Wächter
  rationale: Das Partizip von צפה bezeichnet Menschen, die Ausschau halten und warnen. „Wächter“ erhält das prophetische Bild, ohne ihre genaue Identität festzulegen.
- source_word: הַקְשִׁיבוּ
  choice: Achtet
  rationale: Der Imperativ von קשב fordert aufmerksames Hören und Reagieren. „Achtet auf“ ist im modernen Deutschen natürlich und lässt den praktischen Gehorsamsaspekt anklingen.
- source_word: לְקוֹל
  choice: auf den Klang
  rationale: קוֹל bezeichnet beim Schofar dessen hörbaren Klang. „Klang“ ist idiomatisch und legt sich nicht so eng wie „Stoß“ auf einen einzelnen Signalton fest.
- source_word: שׁוֹפָר
  choice: Schofar
  rationale: Die Bezeichnung des konkreten Horninstruments wird als etablierter deutscher Kulturbegriff beibehalten; eine Fußnote erläutert seine Warnfunktion.
- source_word: וַיֹּאמְרוּ
  choice: Doch sie sagten
  rationale: Das Waw führt die Reaktion weiter; „doch“ macht den im Zusammenhang klaren Gegensatz zwischen Warnung und Weigerung natürlich sichtbar.
- source_word: לֹא נַקְשִׁיב
  choice: Wir werden nicht darauf achten
  rationale: Der Imperfekt mit לֹא drückt hier entschlossene Weigerung aus. Die Wiederaufnahme von „achten“ bildet die Wiederholung desselben hebräischen Verbs קשב ab.
theological_decisions:
- issue: Identität und Funktion der Wächter
  choice: Die Wächter bleiben nicht näher bestimmte, von Gott aufgestellte Warner.
  alternative: Sie ausdrücklich als Propheten, militärische Späher oder führende Amtsträger zu identifizieren.
  rationale: Der hebräische Text nennt nur „Wächter“. Die Übersetzung bewahrt daher das prophetische Warnbild und entscheidet nicht, auf welche konkrete Personengruppe es sich bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die Wiederholung von קשב wird durch „achten“/„darauf achten“ sichtbar gemacht.
