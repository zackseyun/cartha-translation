  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קֶ֣שֶׁת וְ/כִיד֞וֹן יַחֲזִ֗יקוּ אַכְזָרִ֥י הוּא֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/023.yaml
  text: They seize bow and javelin; they are cruel and show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Zion.
translation:
  language: de
  text: Sie führen Bogen und Wurfspeer; sie sind grausam und kennen kein Erbarmen. Ihr Lärm braust wie das Meer, und sie reiten auf Pferden. Wie ein Mann[a] sind sie zum Kampf gegen dich aufgestellt, Tochter Zion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein einziger Mann“. Das singularische כְאִישׁ kann entweder den Vergleich mit einem kampfbereiten Mann ausdrücken oder die geschlossene Einheit des Heeres betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: Bogen
  rationale: Der Singular bezeichnet hier kollektiv beziehungsweise als Waffenbezeichnung den Bogen; die deutsche Singularform bewahrt die knappe militärische Aufzählung.
- source_word: כִידוֹן
  choice: Wurfspeer
  rationale: כִּידוֹן bezeichnet eine Speerwaffe, die zum Stoßen oder Werfen dienen kann. „Wurfspeer“ hält sie sprachlich vom allgemeineren „Speer“ unterschieden.
- source_word: יַחֲזִיקוּ
  choice: sie führen
  rationale: Das Hifil von חזק beschreibt hier das Ergreifen beziehungsweise Bereithalten von Waffen. „führen“ ist im Deutschen eine natürliche militärische Formulierung, ohne die Tätigkeit unnötig auf das bloße Festhalten zu beschränken.
- source_word: אַכְזָרִי הוּא
  choice: sie sind grausam
  rationale: Adjektiv und Pronomen stehen im Hebräischen im Singular, beziehen sich aber kollektiv auf das zuvor genannte Volk, dessen Handeln mit Pluralverben beschrieben wird. Der deutsche Plural macht diesen Bezug verständlich.
- source_word: וְלֹא יְרַחֵמוּ
  choice: und kennen kein Erbarmen
  rationale: Das Piel von רחם bezeichnet erbarmendes oder mitfühlendes Handeln. Die Wendung ist kraftvoll und idiomatisch, ohne eine zusätzliche Aussage über Verschonung einzutragen.
- source_word: קוֹלָם ... כַיָּם יֶהֱמֶה
  choice: Ihr Lärm braust wie das Meer
  rationale: קוֹל kann Stimme, Schall oder Lärm bedeuten; beim tosenden Heer passt „Lärm“. המה bezeichnet ein Brausen, Tosen oder Dröhnen, sodass „braust“ das Meeresbild natürlich wiedergibt.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: und sie reiten auf Pferden
  rationale: Die Formulierung gibt Bild und Satzbezug direkt in natürlicher deutscher Wortstellung wieder.
- source_word: עָרוּךְ
  choice: aufgestellt
  rationale: Im militärischen Zusammenhang bedeutet ערך, dass Truppen geordnet beziehungsweise kampfbereit aufgestellt sind. „aufgestellt“ ist modern und bewahrt diesen Sinn.
- source_word: כְאִישׁ
  choice: wie ein Mann
  rationale: Die formale Singularform wird im Haupttext bewahrt. Sie kann einen Vergleich mit einem kampfbereiten Mann ausdrücken, lässt sich im Zusammenhang aber auch kollektiv als „wie ein einziger Mann“ verstehen.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: „zum Kampf“ ist eine natürliche Wiedergabe der Zweckangabe und passt zur unmittelbar geschilderten Schlachtordnung.
- source_word: עָלַיִךְ בַּת צִיּוֹן
  choice: gegen dich, Tochter Zion
  rationale: Die direkte Anrede und die poetische Personifikation Zions bleiben erhalten. „Tochter Zion“ ist im Deutschen verständlich und textnah.
theological_decisions:
- issue: Personifizierende Bezeichnung בַּת צִיּוֹן
  choice: Tochter Zion
  alternative: Tochter Zions
  rationale: Die Wendung personifiziert Zion beziehungsweise Jerusalem als Tochter und ist kein technisch-dogmatischer Titel. „Tochter Zion“ bewahrt das prophetische Bild und die direkte Anrede.
- issue: Deutung des singularischen כְאִישׁ in der Beschreibung des Heeres
  choice: wie ein Mann
  alternative: wie ein einziger Mann
  rationale: Der Haupttext hält die formale Vergleichsform offen. Die mögliche Aussage über die geschlossene Einheit des Heeres wird in der Fußnote genannt, statt die Mehrdeutigkeit stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulicher militärischer Sprache. Die kurzen Hauptsätze erhalten die Wucht des hebräischen Kriegsorakels; die genuine Mehrdeutigkeit von כְאִישׁ wird durch eine Fußnote bewahrt.
