  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָעִ֣זוּ בְּנֵ֣י בִניָמִ֗ן מִ/קֶּ֨רֶב֙ יְר֣וּשָׁלִַ֔ם וּ/בִ/תְק֨וֹעַ֙ תִּקְע֣וּ שׁוֹפָ֔ר וְ/עַל בֵּ֥ית הַכֶּ֖רֶם שְׂא֣וּ מַשְׂאֵ֑ת כִּ֥י רָעָ֛ה נִשְׁקְפָ֥ה מִ/צָּפ֖וֹן וְ/שֶׁ֥בֶר גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/001.yaml
  text: Take cover[a], sons of Benjamin, from the midst of Jerusalem! Blow the trumpet in Tekoa, and raise a signal over Beth-haccherem, for disaster is looking down from the north[d][c][b], and great destruction.
translation:
  language: de
  text: Bringt euch in Sicherheit[a], ihr Söhne Benjamins, fort aus Jerusalems Mitte! Stoßt in Tekoa ins Schofarhorn, und richtet über Bet-Kerem ein Signal auf[b][c]! Denn Unheil blickt vom Norden herab[d], und großes Verderben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Flieht und bringt euch in Sicherheit.“ Der hebräische Imperativ ist ungewöhnlich und in seiner genauen Bedeutung unsicher; im Zusammenhang bezeichnet er offenbar die dringende Suche nach Schutz.'
    reason: lexical_alternative
  - marker: b
    text: Bet-Kerem ist ein Ortsname. Vermutlich lag der Ort auf einer Anhöhe, die sich für weithin sichtbare Warnsignale zwischen Jerusalem und Tekoa eignete.
    reason: cultural_note
  - marker: c
    text: 'Oder: „lasst ein Feuerzeichen aufsteigen“ beziehungsweise „richtet ein Warnzeichen auf“. Der hebräische Ausdruck legt die genaue Art des Signals nicht fest.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „Unheil hat vom Norden herabgeblickt.“ Das kommende Unheil wird wie eine Person dargestellt, die von einer erhöhten Stelle herabschaut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִזוּ
  choice: Bringt euch in Sicherheit
  rationale: Der schwierige Hifil-Imperativ bezeichnet im Zusammenhang mit Alarmzeichen und drohendem Angriff am ehesten die dringende Aufforderung, Schutz zu suchen. Die Formulierung ist natürliches modernes Deutsch, ohne die unsichere Etymologie zu überdeuten.
- source_word: בְּנֵי בִנְיָמִן
  choice: ihr Söhne Benjamins
  rationale: Die hebräische Verwandtschaftsbezeichnung und die Stammeszugehörigkeit bleiben erhalten; die Anrede ist kollektiv gemeint.
- source_word: מִקֶּרֶב יְרוּשָׁלִַם
  choice: fort aus Jerusalems Mitte
  rationale: קֶרֶב bezeichnet das Innere beziehungsweise die Mitte. „fort aus“ macht die vom Kontext verlangte Bewegung deutlich, während „Jerusalems Mitte“ das Bild des Ausgangstextes bewahrt.
- source_word: וּבִתְקוֹעַ תִּקְעוּ שׁוֹפָר
  choice: Stoßt in Tekoa ins Schofarhorn
  rationale: שׁוֹפָר bezeichnet das als Signal verwendete Horn. „Schofarhorn“ ist im Deutschen präziser als das allgemeinere „Trompete“ und in diesem biblischen Zusammenhang verständlich.
- source_word: וְעַל בֵּית הַכֶּרֶם
  choice: über Bet-Kerem
  rationale: עַל kann „auf“ oder „über“ bedeuten. „über“ lässt die Vorstellung eines weithin sichtbaren, erhöhten Warnsignals zu; der Ortsname wird in geläufiger deutscher Form wiedergegeben.
- source_word: שְׂאוּ מַשְׂאֵת
  choice: richtet ein Signal auf
  rationale: מַשְׂאֵת ist hier etwas Hochgehobenes beziehungsweise ein Warnzeichen. „Signal“ wahrt die Offenheit, ob ein Feuerzeichen, Leuchtzeichen oder anderes sichtbares Zeichen gemeint ist.
- source_word: כִּי רָעָה
  choice: Denn Unheil
  rationale: רָעָה bezeichnet hier die kommende Katastrophe, nicht moralische Bosheit. „Unheil“ passt zur prophetischen Gerichtssprache und vermeidet ein ethisches Missverständnis.
- source_word: נִשְׁקְפָה
  choice: blickt ... herab
  rationale: Die Form von שׁקף beschreibt ein Schauen von einer erhöhten Stelle her. Die Wiedergabe erhält die Personifikation des herannahenden Unheils, statt sie zu dem allgemeineren „kommt“ oder „erscheint“ zu verflachen.
- source_word: מִצָּפוֹן
  choice: vom Norden
  rationale: Die Richtungsangabe wird unmittelbar wiedergegeben; in Jeremia bezeichnet sie wiederholt die Richtung der herannahenden Gefahr.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: und großes Verderben
  rationale: שֶׁבֶר bedeutet wörtlich ein Zerbrechen und bezeichnet hier umfassenden Zusammenbruch oder Vernichtung. „Verderben“ ist idiomatisch und bewahrt die knappe, substantivische Schlusswendung.
theological_decisions:
- issue: Geschlechtlich markierte Stammesanrede
  choice: ihr Söhne Benjamins
  alternative: ihr Benjaminiter / ihr Angehörigen Benjamins
  rationale: Die männliche filiale Ausdrucksweise des Hebräischen wird nicht neutralisiert. Zugleich ist aus dem Zusammenhang ersichtlich, dass die Anrede kollektiv der benjaminitischen Bevölkerung gilt.
- issue: Sprache des drohenden Gerichts
  choice: Unheil ... großes Verderben
  alternative: Böses ... großer Zusammenbruch
  rationale: Die Wörter beschreiben in diesem Vers die anrückende Katastrophe. Die Übersetzung trifft die konkrete Gerichtsfolge, ohne רָעָה als Aussage über moralische Bosheit zu missverstehen oder zusätzliche dogmatische Deutungen einzutragen.
- issue: Personifikation des Unheils
  choice: Unheil blickt vom Norden herab
  alternative: Unheil erscheint aus dem Norden / Unheil droht vom Norden
  rationale: Die auffällige Bildsprache des hebräischen Verbs bleibt als echte Personifikation stehen. Sie wird nicht rationalisierend in eine bloße Aussage über das Eintreffen eines Heeres umgewandelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen Alarmrufen. „Schofarhorn“ erhält den konkreten altisraelitischen Signalgegenstand. Die ungewöhnliche Personifikation und die elliptische Schlusswendung werden bewusst bewahrt; unsichere Einzelheiten stehen in den Fußnoten.
