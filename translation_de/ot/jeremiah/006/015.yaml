  text: הֹבִ֕ישׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵב֗וֹשׁוּ גַּם הַכְלִים֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֧וּ בַ/נֹּפְלִ֛ים בְּ/עֵת פְּקַדְתִּ֥י/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/015.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time I punish them, they will stumble, says Yahweh.
translation:
  language: de
  text: Schämten sie sich, weil sie einen Gräuel verübt hatten? Nein, sie schämten sich überhaupt nicht; sie wussten nicht einmal, wie man errötet. Darum werden sie mit denen fallen, die fallen. Wenn ich sie heimsuche[a], werden sie stürzen, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich sie aufsuche“. Das hebräische Verb kann „aufsuchen“, „sich jemandem zuwenden“ oder „zur Rechenschaft ziehen“ bedeuten; hier bezeichnet es eine strafende Heimsuchung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: Schämten sie sich
  rationale: Im Zusammenhang ist die Form am besten als rhetorische Frage zu verstehen, auf die die folgenden verneinten Aussagen antworten.
- source_word: תוֹעֵבָה עָשׂוּ
  choice: einen Gräuel verübt hatten
  rationale: „Gräuel“ bewahrt die starke moralische Wertung von תוֹעֵבָה; „verüben“ gibt עָשׂוּ in diesem Zusammenhang idiomatisch wieder.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹשׁוּ
  choice: sie schämten sich überhaupt nicht
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Verneinung; „überhaupt nicht“ bildet diese Emphase natürlich ab.
- source_word: גַּם הַכְלִים לֹא יָדָעוּ
  choice: sie wussten nicht einmal, wie man errötet
  rationale: Die Formulierung wahrt das Bild einer nach außen sichtbaren Scham und gibt גַּם als Steigerung mit „nicht einmal“ wieder.
- source_word: יִפְּלוּ בַנֹּפְלִים
  choice: sie werden mit denen fallen, die fallen
  rationale: Die Wiederholung von „fallen“ erhält das hebräische Wortspiel und beschreibt, wie sie das Geschick der Fallenden teilen.
- source_word: בְּעֵת פְּקַדְתִּים
  choice: Wenn ich sie heimsuche
  rationale: „Heimsuchen“ trägt im Deutschen den hier vom Gerichtszusammenhang geforderten Strafsinn, ohne die weitere Bedeutung von פקד völlig auf eine explizite Paraphrase zu verengen.
- source_word: יִכָּשְׁלוּ
  choice: werden sie stürzen
  rationale: Im Parallelismus zu „fallen“ bezeichnet das Verb den Zusammenbruch unter dem angekündigten Gericht; „stürzen“ ist hier natürlicher und kräftiger als „stolpern“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen als Eigennamen wieder und folgt der konsultierten POB-Lesart, ohne ihn durch einen Titel zu ersetzen.
- issue: Gerichtsbedeutung von פקד
  choice: heimsuchen
  alternative: besuchen / zur Rechenschaft ziehen
  rationale: Der Zusammenhang von Fallen und Stürzen macht die strafende Zuwendung eindeutig. „Heimsuchen“ bewahrt zugleich etwas von der lexikalischen Breite des Verbs; die Fußnote nennt die Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter prophetischer Bildsprache und Wiederholung. „Gräuel“, „erröten“ und „heimsuchen“ sind kräftig, aber weiterhin allgemein verständlich.
