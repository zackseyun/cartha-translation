  source_fidelity: 'Die Übersetzung bewahrt die Abfolge und den Kontrast des Hebräischen: die unangemessene Behandlung des Schadens, die wiederholte Friedenszusage und deren Widerlegung. »Behandeln« ist im ironisch-anklagenden Kontext für וַיְרַפְּאוּ vertretbar und vermeidet eine ungewollte Aussage erfolgreichen Heilens. Für שֶׁבֶר ist »Wunde« im Deutschen als Teil des medizinischen Bildes klarer und idiomatischer als das hier missverständliche »Bruch«.'
  naturalness: »Den Bruch ... oberflächlich behandeln« ist im modernen Standarddeutsch holprig und kann zu eng an einen Knochenbruch denken lassen. »Die Wunde meines Volkes nur oberflächlich behandeln« ist natürlich, erhält das Bild und macht die Kritik an der Verharmlosung deutlich.
  terminology: »Frieden! Frieden!« gibt die emphatische Wiederholung von שָׁלוֹם angemessen wieder; »doch da ist kein Frieden« erhält den Gegensatz ohne zusätzliche Deutung. Die Fußnote sollte sich grammatisch auf die revidierte feminine Bezugsgröße »Wunde« beziehen und die Bedeutungsnuance als Alternative, nicht als fragwürdige wörtliche Wiedergabe, formulieren.
