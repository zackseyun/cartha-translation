source:
  edition: WLC
  text: וַֽ/יְרַפְּא֞וּ אֶת שֶׁ֤בֶר עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/014.yaml
  text: They have healed the wound of my people lightly[a], saying, ‘Peace, peace,’ when there is no peace.
translation:
  language: de
  text: 'Sie behandeln die Wunde meines Volkes nur oberflächlich[a] und sagen: »Frieden! Frieden!« – doch da ist kein Frieden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als wäre sie unbedeutend«; auch: »leichtfertig«.'
    reason: Die hebräische Wendung kann sowohl eine oberflächliche Behandlung als auch die Verharmlosung der schweren Schädigung hervorheben.
lexical_decisions:
- source_word: וַיְרַפְּאוּ
  choice: sie behandeln
  rationale: רפא bedeutet grundsätzlich »heilen«. Im anklagenden, ironischen Zusammenhang ist jedoch keine wirkliche Heilung erfolgt; »behandeln« bewahrt das medizinische Bild, ohne einen Behandlungserfolg zu behaupten.
- source_word: שֶׁבֶר
  choice: Bruch
  rationale: Das Wort bezeichnet einen Bruch, eine schwere Schädigung oder einen Zusammenbruch. »Bruch« erhält das Bild und umfasst mehr als eine bloß äußerliche Wunde.
- source_word: עַמִּי
  choice: meines Volkes
  rationale: Die Besitzangabe wird direkt wiedergegeben und bewahrt die Aussage Gottes über Israel als sein Volk.
- source_word: עַל נְקַלָּה
  choice: oberflächlich
  rationale: Die Wendung beschreibt eine leichtfertige, verharmlosende Behandlung eines schweren Schadens. »Oberflächlich« ist im Deutschen idiomatisch und passt unmittelbar zum Bild des Behandelns.
- source_word: לֵאמֹר
  choice: und sagen
  rationale: Gibt die Einführung der direkten Rede natürlich wieder.
- source_word: שָׁלוֹם שָׁלוֹם
  choice: Frieden! Frieden!
  rationale: 'Die Wiederholung bleibt als nachdrückliche falsche Zusicherung erhalten. »Frieden« bewahrt die weite Bedeutung von שָׁלוֹם: Frieden, Sicherheit und Wohlergehen.'
- source_word: וְאֵין שָׁלוֹם
  choice: doch da ist kein Frieden
  rationale: »Doch« macht den im hebräischen וְ liegenden Gegensatz natürlich deutlich, ohne die Aussage weiter auszulegen.
theological_decisions:
- issue: Prophetische Anklage wegen falscher Beruhigung
  choice: Die Verantwortlichen behandeln den schweren Schaden des Volkes nur oberflächlich und behaupten Frieden, der tatsächlich nicht besteht.
  alternative: »Sie heilen den Bruch meines Volkes leichthin« wäre formnäher, könnte auf Deutsch jedoch missverständlich nach einer tatsächlich gelungenen Heilung klingen.
  rationale: Die Übersetzung wahrt die prophetische Ironie und Anklage, ohne festzulegen, welche konkrete Gruppe in diesem einzelnen Vers gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das medizinische Bild und die eindringliche Wiederholung bleiben erhalten; der Gedankenstrich markiert den scharfen Gegensatz zwischen Behauptung und Wirklichkeit.
