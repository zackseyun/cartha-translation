  - severity: low
    issue: Die Fußnote enthält nach der Textrevision eine unpassende Bezugsform und bezeichnet »leichthin« unnötig als wörtlich.
    rationale: Bei »Wunde« muss die Paraphrase feminin sein. Die hebräische Wendung akzentuiert das Behandeln als etwas Geringfügiges bzw. Leichtfertiges; eine alternative Bedeutungsangabe ist präziser als die Kennzeichnung einer deutschen Entsprechung als wörtlich.
