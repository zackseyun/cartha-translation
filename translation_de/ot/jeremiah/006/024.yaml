source:
  edition: WLC
  text: שָׁמַ֥עְנוּ אֶת שָׁמְע֖/וֹ רָפ֣וּ יָדֵ֑י/נוּ צָרָה֙ הֶחֱזִיקַ֔תְ/נוּ חִ֖יל כַּ/יּוֹלֵדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/024.yaml
  text: We have heard the report of it[a]; our hands hang limp. Distress has seized us[c][b], pain like a woman giving birth.
translation:
  language: de
  text: Wir haben die Nachricht über ihn[a] gehört; unsere Hände sind kraftlos geworden[b]. Bedrängnis hat uns gepackt, Wehen wie bei einer Gebärenden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Nachricht« beziehungsweise »die Kunde von ihm«. Das Hebräische kann sowohl die Nachricht über den Feind als auch eine von ihm ausgehende Nachricht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Unsere Hände sind schlaff geworden« – ein Bild für den Verlust von Kraft und Mut.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Qualen wie bei einer Frau in den Wehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  choice: Wir haben ... gehört
  rationale: Das Qal-Perfekt 1. Person Plural bezeichnet ein erfolgtes Hören, dessen erschreckende Wirkung in den folgenden Aussagen fortbesteht.
- source_word: אֶת שָׁמְעוֹ
  choice: die Nachricht über ihn
  rationale: שֵׁמַע/שֶׁמַע bedeutet Nachricht, Kunde oder Bericht; das Suffix der 3. Person maskulin Singular kann einen Bericht über den herannahenden Feind oder dessen eigenen Bericht bezeichnen. Der Kontext legt die Nachricht über ihn nahe.
- source_word: רָפוּ יָדֵינוּ
  choice: unsere Hände sind kraftlos geworden
  rationale: Die Verbindung von רפה mit »Händen« beschreibt bildhaft den Verlust von Kraft und Mut. Die deutsche Wiedergabe bewahrt das Körperbild und erschließt zugleich seinen Sinn.
- source_word: צָרָה
  choice: Bedrängnis
  rationale: צָרָה bezeichnet Not, Bedrängnis oder Angst; »Bedrängnis« umfasst hier sowohl die bedrohliche Lage als auch deren innere Wirkung.
- source_word: הֶחֱזִיקַתְנוּ
  choice: hat uns gepackt
  rationale: Das Hifil von חזק kann »ergreifen« oder »festhalten« bedeuten. »Gepackt« ist anschaulich und im Deutschen natürlich.
- source_word: חִיל
  choice: Wehen
  rationale: חִיל kann Qual, krampfhaftes Winden oder Geburtswehen bezeichnen. Wegen des unmittelbaren Vergleichs mit einer Gebärenden ist »Wehen« hier prägnant, ohne die Bildaussage aufzulösen.
- source_word: כַּיּוֹלֵדָה
  choice: wie eine Gebärende
  rationale: Das Partizip von ילד mit der Vergleichspartikel כ bezeichnet eine Frau beim Gebären. »Eine Gebärende« ist knapp, würdig und bildgetreu.
theological_decisions:
- issue: Bezug des maskulinen Suffixes in שָׁמְעוֹ
  choice: Nachricht über den herannahenden Feind
  alternative: seine Nachricht bzw. der von ihm ausgehende Bericht
  rationale: Der vorangehende Kontext spricht vom Feind aus dem Norden; syntaktisch bleibt die Funktion des Suffixes jedoch mehrdeutig. Die Fußnote bewahrt diese Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das semantische Feld von Nachricht/Kunde und die Bildsprache der erschlaffenden Hände sowie der Geburtswehen werden bewahrt; echte Mehrdeutigkeit wird in der Fußnote offengehalten.
