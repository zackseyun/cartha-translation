base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/013.yaml
  text: For from their least to their greatest[a], every one of them is greedy for unjust gain; and from prophet to priest[c][b], every one of them practices falsehood.
translation:
  language: de
  text: Denn vom Kleinsten bis zum Größten unter ihnen[a] ist jeder auf unrechten Gewinn aus[b]; vom Propheten bis zum Priester handelt jeder betrügerisch[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von ihrem Kleinsten bis zu ihrem Größten«.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Gewinn erlangen«; die Wendung bezeichnet wahrscheinlich unehrlichen oder ungerechten Profit.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »übt jeder Lüge« oder »treibt jeder Täuschung«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anklage beziehungsweise Gerichtsankündigung ein und gibt den erklärenden Zusammenhang natürlich wieder.
- source_word: מִקְּטַנָּם וְעַד גְּדוֹלָם
  choice: vom Kleinsten bis zum Größten unter ihnen
  rationale: Bewahrt die umfassende Spannweite und macht den Bezug des hebräischen Suffixes im Deutschen klar.
- source_word: כֻּלּוֹ
  choice: sie alle
  rationale: Gibt den kollektiv-distributiven Sinn idiomatisch wieder; die Wiederholung in beiden Vershälften entspricht der hebräischen Struktur.
- source_word: בּוֹצֵעַ בָּצַע
  choice: sind … auf unrechten Gewinn aus
  rationale: Die Verbindung aus stammverwandtem Verb und Substantiv bezeichnet gewinnsüchtiges Streben mit unehrlichen oder ausbeuterischen Anklängen. Die Formulierung ist modern und erhält die moralische Wertung.
- source_word: וּמִנָּבִיא וְעַד כֹּהֵן
  choice: vom Propheten bis zum Priester
  rationale: Bewahrt die zweite umfassende Spannweite, die hier die religiösen Amtsträger nennt.
- source_word: עֹשֶׂה שָּׁקֶר
  choice: handeln … falsch
  rationale: Bezeichnet fortgesetztes, von Täuschung geprägtes Verhalten und bleibt näher am allgemeinen Handlungsausdruck עֹשֶׂה als eine nur auf das Reden bezogene Wiedergabe.
