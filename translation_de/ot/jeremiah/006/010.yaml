id: JER.6.10
reference: Jeremiah 6:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל מִ֨י אֲדַבְּרָ֤ה וְ/אָעִ֨ידָה֙ וְ/יִשְׁמָ֔עוּ הִנֵּה֙ עֲרֵלָ֣ה אָזְנָ֔/ם וְ/לֹ֥א יוּכְל֖וּ לְ/הַקְשִׁ֑יב הִנֵּ֣ה דְבַר יְהוָ֗ה הָיָ֥ה לָ/הֶ֛ם לְ/חֶרְפָּ֖ה לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/010.yaml
  text: To whom shall I speak and give warning[a], that they may hear? Look, their ear is uncircumcised, and they are not able to listen. Look, the word of Yahweh has become a reproach to them[b]; they take no delight in it.
translation:
  language: de
  text: Zu wem soll ich reden und eindringlich warnen[a], damit sie hören? Siehe, ihr Ohr ist unbeschnitten[b], und sie können nicht aufmerksam zuhören. Siehe, das Wort Jahwes ist für sie zum Gespött geworden; sie haben keinen Gefallen daran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Zeugnis ablegen“ beziehungsweise „und bezeugen“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr Ohr ist unbeschnitten“ ist ein Bild für ihre fehlende Bereitschaft und Fähigkeit, auf Gottes Wort zu hören.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: soll ich reden
  rationale: Die deliberative Form steht in einer rhetorischen Frage; „soll ich reden“ gibt diese abwägende Kraft im Deutschen natürlich wieder.
- source_word: וְאָעִידָה
  choice: und eindringlich warnen
  rationale: Der Hifil von עוד kann hier sowohl feierliches Bezeugen als auch nachdrückliches Warnen ausdrücken. Im prophetischen Zusammenhang vermittelt „eindringlich warnen“ die konkrete Aussageabsicht, während die Alternative in der Fußnote erhalten bleibt.
- source_word: וְיִשְׁמָעוּ
  choice: damit sie hören
  rationale: Der nachfolgende Imperfekt wird als Zweck beziehungsweise angestrebte Folge der Verkündigung verstanden, ohne das tatsächliche Hören zu behaupten.
- source_word: עֲרֵלָה אָזְנָם
  choice: ihr Ohr ist unbeschnitten
  rationale: Die auffällige Bundes- und Körpermetapher des Hebräischen bleibt erhalten; der Singular „Ohr“ folgt dem kollektiv gebrauchten hebräischen Ausdruck.
- source_word: לְהַקְשִׁיב
  choice: aufmerksam zuhören
  rationale: Das Verb bezeichnet nicht bloß akustisches Hören, sondern aufmerksames Hinhören beziehungsweise Beachten. Die Wiedergabe wahrt zugleich die Verbindung mit „hören“ im vorigen Satz.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Wendung wird direkt wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: הָיָה לָהֶם לְחֶרְפָּה
  choice: ist für sie zum Gespött geworden
  rationale: חֶרְפָּה bezeichnet Schmach, Verachtung oder Spott. „Zum Gespött geworden“ macht deutlich, dass sie das Wort verächtlich behandeln, statt missverständlich anzudeuten, das Wort selbst verspotte sie.
- source_word: לֹא יַחְפְּצוּ בוֹ
  choice: sie haben keinen Gefallen daran
  rationale: חפץ umfasst Wollen, Gefallen und Freude. Die gewählte Formulierung verbindet innere Abneigung mit willentlicher Ablehnung in geläufigem Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den Charakter als Eigenname, ohne die traditionelle Ersatzlesung in den Haupttext einzutragen.
- issue: Metapher vom unbeschnittenen Ohr
  choice: Die Metapher im Haupttext beibehalten
  alternative: ihr Ohr ist verschlossen / sie sind geistlich taub
  rationale: Die körperliche und bundestheologische Bildsprache gehört zur Schärfe der prophetischen Aussage. Eine bloße Deutung als Taubheit oder Unaufmerksamkeit würde diese Dimension vorschnell auflösen.
- issue: Bedeutung von וְאָעִידָה
  choice: eindringlich warnen
  alternative: Zeugnis ablegen / bezeugen
  rationale: Der Zusammenhang betont Jeremias vergebliche Warnrede. Da das Verb jedoch auch gerichtliches oder feierliches Bezeugen bezeichnen kann, wird diese echte lexikalische Möglichkeit in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das zweimalige הִנֵּה wird mit „Siehe“ wiedergegeben, um den eindringlichen prophetischen Ton und die parallele Struktur zu erhalten. Die ungewöhnliche Metapher „unbeschnittenes Ohr“ bleibt bewusst stehen und wird knapp erläutert.
