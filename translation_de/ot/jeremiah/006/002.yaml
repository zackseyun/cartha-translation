id: JER.6.2
reference: Jeremiah 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/נָּוָה֙ וְ/הַ/מְּעֻנָּגָ֔ה דָּמִ֖יתִי בַּת צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/002.yaml
  text: I have likened daughter Zion to a lovely and delicate woman[a].
translation:
  language: de
  text: Die Tochter Zion habe ich mit einer schönen und zarten Frau verglichen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Die schöne und zarte Tochter Zion werde ich vernichten.« Das hebräische Verb ist hier schwierig; manche verstehen es im Sinn von »vernichten« statt von »vergleichen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּוָה
  choice: schönen
  rationale: Das feminine Adjektiv bezeichnet hier im Zusammenhang mit מְעֻנָּגָה am ehesten Schönheit oder Anmut. »Schön« ist im modernen Deutschen natürlich und legt sich nicht auf die andernorts mögliche Bedeutung im Umfeld von Wohn- oder Weideplätzen fest.
- source_word: וְהַמְּעֻנָּגָה
  choice: und zarten
  rationale: Das Wort aus der Wurzel ענג kann Zartheit, Verfeinerung oder verwöhnten Luxus ausdrücken. »Zart« bewahrt die positive poetische Beschreibung, ohne die wertende Bedeutung »verwöhnt« zwingend einzutragen.
- source_word: דָּמִיתִי
  choice: habe ich … verglichen
  rationale: Die Qal-Form in der ersten Person Singular wird primär von דמה im Sinn von »gleichen, vergleichen« verstanden. Das deutsche Perfekt gibt die hebräische Suffixkonjugation natürlich wieder. Wegen einer möglichen destruktiven Deutung wird die Alternative in einer Fußnote genannt.
- source_word: בַּת צִיּוֹן
  choice: die Tochter Zion
  rationale: Die feste prophetische Personifikation Zions wird in knapper, im Deutschen verständlicher Form bewahrt.
- source_word: implizite feminine Bezugsgröße
  choice: Frau
  rationale: Die beiden Adjektive stehen im Femininum Singular, während das verglichene Gegenüber nicht ausdrücklich als Substantiv genannt wird. »Frau« macht den Vergleich im Deutschen verständlich, ohne ein bestimmtes Alter wie »Mädchen« vorauszusetzen.
theological_decisions:
- issue: Deutung des zentralen Bildes
  choice: Die Tochter Zion wird mit einer schönen und zarten Frau verglichen.
  alternative: »Die schöne und zarte Tochter Zion werde ich vernichten.«
  rationale: Der verbreitete Sinn von דמה als »gleichen/vergleichen« und die beiden femininen Adjektive stützen die Vergleichsdeutung. Da das hebräische Verb an dieser Stelle jedoch schwierig ist und auch destruktiv verstanden worden ist, bleibt diese echte Auslegungsmöglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung hebt »die Tochter Zion« als personifizierte Größe hervor; die ergänzte »Frau« macht den im Hebräischen nur durch feminine Adjektive angezeigten Vergleich idiomatisch.
