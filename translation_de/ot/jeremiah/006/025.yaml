  text: אַל תצאי הַ/שָּׂדֶ֔ה וּ/בַ/דֶּ֖רֶךְ אַל תלכי כִּ֚י חֶ֣רֶב לְ/אֹיֵ֔ב מָג֖וֹר מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/025.yaml
  text: Do not go out into the field[a], and do not walk on the road[b], for the sword of the enemy and terror are on every side.
translation:
  language: de
  text: Geh nicht hinaus aufs Feld[a] und geh nicht auf der Straße; denn das Schwert des Feindes[b] – Schrecken ringsum!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden Verbformen stehen im Hebräischen in der femininen Einzahl. Wahrscheinlich ist das personifizierte Jerusalem beziehungsweise die Tochter Zion angeredet.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich knapp: „ein Schwert dem Feind“. Die Konstruktion bezeichnet das Schwert als dem Feind zugehörig; daher: „das Schwert des Feindes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תצאי
  choice: Geh nicht hinaus
  rationale: אַל mit dem Imperfekt drückt ein Verbot aus; תצאי ist Qal 2. Person feminin Singular von יצא. Die deutsche Formulierung gibt Bewegung und Verbot natürlich wieder.
- source_word: הַשָּׂדֶה
  choice: aufs Feld
  rationale: שׂדה bezeichnet ein Feld beziehungsweise das offene Land. „Aufs Feld“ ist im Deutschen idiomatisch und bewahrt das konkrete Bild.
- source_word: וּבַדֶּרֶךְ אַל תלכי
  choice: und geh nicht auf der Straße
  rationale: דרך bezeichnet hier einen Weg oder eine Straße. „Auf der Straße gehen“ passt zum Zusammenhang gefährlicher Fortbewegung und erhält die Wiederholung des Verbots.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion leitet den Grund für die vorausgehenden Verbote ein.
- source_word: חֶרֶב לְאֹיֵב
  choice: der Feind hat ein Schwert
  rationale: 'Die knappe hebräische Verbindung aus חֶרֶב und לְאֹיֵב lässt sich als Besitzkonstruktion verstehen: Dem Feind ist ein Schwert beziehungsweise der Feind hat ein Schwert. Die gewählte Fassung ist klares, heutiges Deutsch.'
- source_word: מָגוֹר מִסָּבִיב
  choice: ringsum herrscht Schrecken
  rationale: מָגוֹר bedeutet Schrecken oder Grauen; מִסָּבִיב bezeichnet die Gefahr ringsum. Das im Hebräischen fehlende Verb wird im Deutschen zur natürlichen Satzbildung ergänzt.
theological_decisions:
- issue: Angeredete Person
  choice: Das grammatische Femininum wird in einer Fußnote kenntlich gemacht, ohne im Haupttext einen Namen einzusetzen.
  alternative: Jerusalem oder die Tochter Zion ausdrücklich anreden
  rationale: Der Vers selbst nennt die Adressatin nicht. Die feminine Singularform deutet im Kontext wahrscheinlich auf das personifizierte Jerusalem beziehungsweise die Tochter Zion, doch eine ausdrückliche Benennung würde die im Einzelvers bestehende Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direktem prophetischem Warnton. Die knappe Satzfolge und das Bild des umgebenden Schreckens bleiben erhalten; notwendige deutsche Verben werden sparsam ergänzt.
