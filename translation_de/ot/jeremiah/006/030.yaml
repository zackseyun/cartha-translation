source:
  edition: WLC
  text: כֶּ֣סֶף נִמְאָ֔ס קָרְא֖וּ לָ/הֶ֑ם כִּֽי מָאַ֥ס יְהוָ֖ה בָּ/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/030.yaml
  text: They call them rejected silver[a], because Yahweh has rejected them.
translation:
  language: de
  text: Verworfenes Silber[a] nennt man sie, denn Jahwe hat sie verworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Ausschusssilber« oder »verschmähtes Silber«. Das Hebräische greift das Bild der Metallprüfung auf: Das Silber wird nach der Prüfung als unbrauchbar verworfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף נִמְאָס
  choice: verworfenes Silber
  rationale: כֶּסֶף bezeichnet hier im Bild des Läuterns Silber, nicht Geld; das passive Partizip נִמְאָס bedeutet »verworfen« oder »verschmäht«. »Verworfenes Silber« bewahrt sowohl das Metallbild als auch die Wiederholung derselben hebräischen Wurzel im zweiten Satzteil.
- source_word: קָרְאוּ לָהֶם
  choice: nennt man sie
  rationale: Die 3. Person Plural hat hier ein unbestimmtes Subjekt. Die deutsche man-Konstruktion gibt dies natürlich wieder, ohne eine bestimmte handelnde Gruppe einzuführen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion begründet die Bezeichnung im ersten Satzteil. »Denn« verbindet die beiden knappen Aussagen in natürlichem, würdigem Deutsch.
- source_word: מָאַס ... בָּהֶם
  choice: hat sie verworfen
  rationale: Das Verb מָאַס bedeutet »verwerfen« oder »verschmähen«; die Präposition ב markiert hier idiomatisch das Objekt. Dieselbe deutsche Wortwurzel wie in »verworfenes« erhält das beabsichtigte Wortspiel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben, der im Deutschen üblichen Form des Tetragramms.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. »Jahwe« bewahrt diesen als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Verwerfung
  choice: Jahwe hat »sie« verworfen
  alternative: Jahwe hat etwas »an ihnen« verworfen
  rationale: Bei מָאַס markiert בָּהֶם idiomatisch die verworfenen Personen als Objekt. Die Übersetzung lässt die Härte der göttlichen Verwerfung stehen und schwächt sie nicht zu einer Ablehnung einzelner Eigenschaften ab.
translation_notes:
  register: Knappes, bildkräftiges und würdiges Gegenwartsdeutsch. Die Voranstellung von »Verworfenes Silber« betont die prophetische Bezeichnung; »nennt man sie« gibt das unbestimmte hebräische Subjekt natürlich wieder. Die Wiederholung »verworfenes … verworfen« bildet die hebräische Wurzelwiederholung bewusst nach.
