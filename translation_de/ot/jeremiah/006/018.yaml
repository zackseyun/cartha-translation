source:
  edition: WLC
  text: לָ/כֵ֖ן שִׁמְע֣וּ הַ/גּוֹיִ֑ם וּ/דְעִ֥י עֵדָ֖ה אֶת אֲשֶׁר בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/018.yaml
  text: Therefore hear[a], O nations, and know, O congregation[b], what is among them.
translation:
  language: de
  text: Darum hört, ihr Völker, und erkenne, du Versammlung[a], was unter ihnen ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gemeinde“ oder „Gemeinschaft“. Das hebräische Wort עֵדָה bezeichnet ein Kollektiv; wer hier genau gemeint ist, ist umstritten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „was in ihnen ist“. Die hebräische Wendung ist knapp und kann sowohl auf etwas in ihnen als auch auf etwas unter ihnen verweisen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Leitet als Folgerungsmarker die Konsequenz aus der vorausgehenden Anklage und Gerichtsankündigung ein; „Darum“ ist im Deutschen natürlich und prägnant.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Imperativ Plural bewahrt den prophetischen Aufruf und lässt sowohl das Hören als auch das aufmerksame Zuhören anklingen.
- source_word: הַגּוֹיִם
  choice: Völker
  rationale: Bezeichnet hier die Völker beziehungsweise Nationen. „Völker“ passt zum prophetischen Sprachgebrauch, ohne die spätere religiöse Bedeutung von „Heiden“ einzutragen.
- source_word: וּדְעִי
  choice: und erkenne
  rationale: Der feminine Singularimperativ von ידע richtet sich an das folgende feminine Kollektivum. „Erkenne“ gibt den Grundsinn wieder und bezeichnet hier das bewusste Wahrnehmen dessen, was vorliegt.
- source_word: עֵדָה
  choice: Versammlung
  rationale: Das feminine Kollektivum kann eine Versammlung, Gemeinde oder Gemeinschaft bezeichnen. „Versammlung“ erhält den kollektiven Charakter und vermeidet eine unnötig kirchliche Festlegung.
- source_word: אֶת אֲשֶׁר בָּם
  choice: was unter ihnen ist
  rationale: Die knappe hebräische Wendung bleibt bewusst offen. „Unter ihnen“ ist idiomatisch und kann auf das verweisen, was sich in ihrer Mitte befindet, ohne den Gegenstand näher festzulegen.
theological_decisions:
- issue: Bezug und syntaktische Funktion von עֵדָה
  choice: 'עֵדָה wird als direkt angeredetes Kollektivum verstanden: „du Versammlung“.'
  alternative: Möglich ist eine appositionelle Verbindung mit den Völkern („Versammlung der Völker“); wegen der schwierigen Formulierung wurden außerdem Textänderungen vorgeschlagen.
  rationale: Die masoretische Vokalisierung bietet vor עֵדָה einen femininen Singularimperativ. Die Wiedergabe als direkte Anrede erhält diese grammatische Spannung und vermeidet eine spekulative Textänderung.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Der Wechsel vom pluralischen „hört“ zum singularischen „erkenne“ ist bewusst beibehalten, weil er die hebräische Anredeform abbildet. Die etwas ungewöhnliche Wendung „du Versammlung“ erhält die Schwierigkeit und Mehrdeutigkeit des Ausgangstextes.
