source:
  edition: WLC
  text: בָּח֛וֹן נְתַתִּ֥י/ךָ בְ/עַמִּ֖/י מִבְצָ֑ר וְ/תֵדַ֕ע וּ/בָחַנְתָּ֖ אֶת דַּרְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/027.yaml
  text: I have made you a tester among my people[a], a fortress[b], so that you may know and test their way.
translation:
  language: de
  text: Als Prüfer[a] habe ich dich in meinem Volk eingesetzt, als Festung[b], damit du ihren Weg[c] erkennst und prüfst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Als Metallprüfer“. Das Bild der Prüfung von Metall passt zum folgenden Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Satz ist knapp und an dieser Stelle schwer verständlich. Wörtlich steht hier „Festung“ beziehungsweise „befestigter Ort“.
    reason: textual_difficulty
  - marker: c
    text: „Ihr Weg“ kann auch „ihr Verhalten“ oder „ihre Lebensweise“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחוֹן
  choice: Prüfer
  rationale: Das Substantiv bezeichnet jemanden, der prüft, hier im Bild eines Metallprüfers. „Prüfer“ ist allgemein verständlich und bewahrt durch das folgende „prüfst“ die Wiederholung der Wurzel בחן.
- source_word: נְתַתִּיךָ
  choice: habe ich dich … eingesetzt
  rationale: נתן bedeutet wörtlich „geben, setzen“; zusammen mit der Rollenbezeichnung gibt „einsetzen“ die Beauftragung Jeremias im Deutschen natürlich wieder.
- source_word: בְעַמִּי
  choice: in meinem Volk
  rationale: Die Präposition ב wird nah am hebräischen Ausdruck mit „in“ wiedergegeben. Gemeint ist Jeremias Stellung innerhalb des Volkes.
- source_word: מִבְצָר
  choice: Festung
  rationale: Das Wort bezeichnet gewöhnlich eine Festung oder einen befestigten Ort. Das konkrete, im Zusammenhang jedoch schwer verständliche Bild des masoretischen Textes bleibt erhalten.
- source_word: וְתֵדַע
  choice: damit du … erkennst
  rationale: Das mit ו verbundene Imperfekt kann Folge oder Zweck ausdrücken. „Damit“ gibt hier den wahrscheinlichen Zweck der Einsetzung wieder, ohne den Sinn von ידע auf bloßes Faktenwissen zu verengen.
- source_word: וּבָחַנְתָּ
  choice: und prüfst
  rationale: „Prüfen“ nimmt dieselbe hebräische Wurzel wie „Prüfer“ auf und bewahrt so das prägende Motiv der Untersuchung beziehungsweise Metallprüfung.
- source_word: דַּרְכָּם
  choice: ihren Weg
  rationale: דרך kann sowohl den Weg als auch bildlich Lebensweise und Verhalten bezeichnen. „Ihren Weg“ erhält die Metapher und ihre Bedeutungsoffenheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Apposition „als Festung“ bleibt bewusst stehen, um die Schwierigkeit und Bildsprache des hebräischen Textes nicht stillschweigend aufzulösen.
