base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/004.yaml
  text: Consecrate war against her; rise up[a], and let us go up at noon. Woe to us, for the day is turning away, for the shadows of evening are stretching out.
translation:
  language: de
  text: Heiligt den Krieg gegen sie![a] Auf, lasst uns am Mittag hinaufziehen! Wehe uns, denn der Tag neigt sich, denn die Abendschatten werden länger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bereitet den Krieg gegen sie vor.« Das Hebräische verwendet für den Krieg eine Sprache des Heiligens beziehungsweise sakralen Vorbereitens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Heiligt
  rationale: Der Piel-Imperativ bewahrt die kultisch-sakrale Sprache des hebräischen Ausdrucks. Im militärischen Zusammenhang bedeutet er zugleich, den Krieg vorzubereiten beziehungsweise auszurufen.
- source_word: עָלֶיהָ מִלְחָמָה
  choice: den Krieg gegen sie
  rationale: עַל bezeichnet hier die feindliche Ausrichtung; das feminine Suffix bezieht sich im Kontext auf die Stadt.
- source_word: קוּמוּ
  choice: Steht auf
  rationale: Der Imperativ ist ein unmittelbarer, energischer Aufruf zum Handeln.
- source_word: וְנַעֲלֶה
  choice: lasst uns ... hinaufziehen
  rationale: Die Kohortativform und die Grundbedeutung von עלה werden bewahrt; zugleich ist 'hinaufziehen' im Deutschen ein verständlicher militärischer Ausdruck für den Zug gegen eine Stadt.
- source_word: בַצָּהֳרָיִם
  choice: am Mittag
  rationale: Klare und natürliche Wiedergabe der Zeitangabe.
- source_word: אוֹי לָנוּ
  choice: Wehe uns!
  rationale: Bewahrt den ernsten Ausruf von Bestürzung und Klage.
- source_word: כִּי פָנָה הַיּוֹם
  choice: Der Tag wendet sich
  rationale: Bewahrt die Wendemetapher von פנה und lässt im Zusammenhang erkennen, dass sich der Tag dem Abend zuneigt.
- source_word: כִּי יִנָּטוּ צִלְלֵי עָרֶב
  choice: und die Abendschatten ziehen sich in die Länge
  rationale: Gibt das Sich-Ausdehnen der Schatten idiomatisch und anschaulich wieder. Das zweite כִּי wird koordinierend verstanden, da beide Beobachtungen die Klage begründen.
theological_decisions:
- issue: Sakral-militärische Rede in קַדְּשׁוּ ... מִלְחָמָה
  choice: Heiligt den Krieg gegen sie
  alternative: Rüstet euch zum Krieg gegen sie
  rationale: Die ausdrückliche Heiligungssprache erhält die theologische Spannung des Textes, ohne damit göttliche Billigung des Angriffs zu behaupten.
translation_notes:
  register: Gehobenes, aber gegenwärtiges Standarddeutsch. Die kurzen Ausrufe bilden die drängende militärische Rede nach; die hebräische Wendemetapher und die sakrale Kriegssprache bleiben erhalten.
