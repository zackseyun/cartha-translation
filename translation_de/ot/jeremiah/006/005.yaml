  text: Rise up[a], and let us go up by night, and let us destroy her palaces.
translation:
  language: de
  text: Steht auf! Lasst uns bei Nacht hinaufziehen und ihre Paläste[a] zerstören!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Burgen“ oder „ihre Festungen“. Das hebräische Wort kann sowohl Palastbauten als auch besonders hervorgehobene befestigte Bauwerke bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמוּ
  choice: Steht auf!
  rationale: Der Imperativ im maskulinen Plural ist ein unmittelbarer, dringlicher Aufruf zum Handeln; „Steht auf!“ bewahrt sowohl den militärischen Nachdruck als auch den gehobenen Ton.
- source_word: וְ/נַעֲלֶ֣ה
  choice: Lasst uns … hinaufziehen
  rationale: Der Kohortativ der 1. Person Plural drückt eine gemeinsame Aufforderung aus. „Hinaufziehen“ gibt die Grundbedeutung von עלה wieder und lässt den im Belagerungskontext naheliegenden Angriff anklingen, ohne ihn ausdrücklich in den Text hineinzutragen.
- source_word: בַ/לָּ֔יְלָה
  choice: bei Nacht
  rationale: Die Wendung bezeichnet den Zeitpunkt der geplanten Handlung; „bei Nacht“ ist im Deutschen natürlich und passt zum würdevollen, militärischen Sprachduktus.
- source_word: וְ/נַשְׁחִ֖יתָה
  choice: und … zerstören
  rationale: Der Kohortativ im Hifil bezeichnet eine beabsichtigte, umfassende Zerstörung. Im Deutschen wird seine auffordernde Kraft durch das vorangestellte „Lasst uns“ zugleich für beide koordinierten Verben ausgedrückt.
- source_word: אַרְמְנוֹתֶֽי/הָ
  choice: ihre Paläste
  rationale: Das Substantiv kann palastartige wie auch befestigte, hervorgehobene Bauwerke bezeichnen. „Paläste“ ist im Zusammenhang mit der personifizierten Stadt eine natürliche Hauptwiedergabe; die militärisch gefärbten Alternativen werden in einer Fußnote offengehalten.
theological_decisions: []
translation_notes:
