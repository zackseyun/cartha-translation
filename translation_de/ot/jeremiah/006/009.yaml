  text: כֹּ֤ה אָמַר֙ יְהֹוָ֣ה צְבָא֔וֹת עוֹלֵ֛ל יְעוֹלְל֥וּ כַ/גֶּ֖פֶן שְׁאֵרִ֣ית יִשְׂרָאֵ֑ל הָשֵׁב֙ יָדְ/ךָ֔ כְּ/בוֹצֵ֖ר עַל סַלְסִלּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/009.yaml
  text: 'Thus says Yahweh of hosts: They will thoroughly glean the remnant of Israel as a vine[a]; pass your hand over the branches again like a grape-gatherer.'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr der Heerscharen: Sie werden den Rest Israels gründlich nachlesen wie einen Weinstock. Fahre mit deiner Hand noch einmal über die Ranken[a], wie ein Traubenleser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über die Zweige“; möglicherweise auch: „über die Körbe“. Das hebräische Wort kommt selten vor, und seine genaue Bedeutung ist umstritten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Gibt den Gottesnamen transparent als „Jahwe“ wieder und formuliert den Titel צְבָאוֹת in einer im Deutschen verständlichen, würdevollen Form.
- source_word: עוֹלֵל יְעוֹלְלוּ
  choice: Man wird … gründlich nachlesen
  rationale: Der Infinitivus absolutus verstärkt das Verb. „Gründlich nachlesen“ bewahrt das Weinlesebild und drückt die vollständige, wiederholte Ernte aus; das unpersönliche „man“ erhält die im Hebräischen nicht ausdrücklich benannten Handelnden.
- source_word: כַגֶּפֶן
  choice: wie einen Weinstock
  rationale: 'Die Vergleichspartikel wird direkt wiedergegeben. Der Akkusativ entspricht dem deutschen Satzbau: Der Rest Israels wird wie ein Weinstock nachgelesen.'
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: den Rest Israels
  rationale: „Rest“ ist natürliches modernes Deutsch und bewahrt den im Gerichtskontext wichtigen Begriff, ohne ihn zusätzlich auszudeuten.
- source_word: הָשֵׁב יָדְךָ
  choice: Fahre mit deiner Hand noch einmal
  rationale: Der Imperativ fordert zur Wiederholung der Lesehandlung auf. Die Formulierung gibt die Bewegung idiomatisch wieder, ohne das Bild zu erklären.
- source_word: כְּבוֹצֵר
  choice: wie ein Traubenleser
  rationale: Bezeichnet denjenigen, der Trauben erntet; „Traubenleser“ ist präzise und allgemein verständlich.
- source_word: עַל סַלְסִלּוֹת
  choice: über die Ranken
  rationale: Das seltene Substantiv wird im Weinbaukontext plausibel auf Teile des Weinstocks bezogen. Wegen der unsicheren genauen Bedeutung werden Alternativen in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: „Jahwe“ macht den Eigennamen im Ausgangstext sichtbar und vermeidet, ihn mit einem Titel gleichzusetzen.
- issue: Identität der nachlesenden Handelnden
  choice: unpersönliches „man“
  alternative: „sie“ oder ausdrückliche Benennung eines Feindes
  rationale: Die hebräische Verbform steht im Plural, nennt das Subjekt aber nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit, statt die Handelnden theologisch oder historisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Bild der gründlichen Nachlese bleibt erhalten; seltene oder umstrittene Bilddetails werden nicht stillschweigend vereindeutigt.
