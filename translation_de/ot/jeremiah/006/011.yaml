  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵת֩ חֲמַ֨ת יְהוָ֤ה מָלֵ֨אתִי֙ נִלְאֵ֣יתִי הָכִ֔יל שְׁפֹ֤ךְ עַל עוֹלָל֙ בַּ/ח֔וּץ וְ/עַ֛ל ס֥וֹד בַּחוּרִ֖ים יַחְדָּ֑ו כִּֽי גַם אִ֤ישׁ עִם אִשָּׁה֙ יִלָּכֵ֔דוּ זָקֵ֖ן עִם מְלֵ֥א יָמִֽים׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/011.yaml
  text: But I am full of the wrath of Yahweh[a]; I am weary of holding it in. Pour it out on the child in the street, and on the company of young men together; for both man and woman will be taken[b], the old man along with the very aged.
translation:
  language: de
  text: Doch ich bin erfüllt vom Zorn Jahwes[a]; ich bin es müde, ihn zurückzuhalten. Gieße ihn aus über das Kind auf der Straße und über die Schar der jungen Männer, die beisammen ist! Denn Mann und Frau werden ergriffen, der Alte samt dem Hochbetagten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: von der Zornesglut Jahwes.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „voll an Tagen“; eine hebräische Wendung für einen Menschen in sehr hohem Alter.'
    reason: idiom_explanation
lexical_decisions:
- source_word: חֲמַת יְהוָה
  choice: Zorn Jahwes
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn; „Zorn“ wahrt hier Intensität und Gerichtskontext, während der Gottesname יְהוָה als „Jahwe“ wiedergegeben wird.
- source_word: מָלֵאתִי
  choice: ich bin erfüllt
  rationale: Das Perfekt beschreibt den gegenwärtigen Zustand des Sprechers als Ergebnis des Erfülltwordenseins.
- source_word: נִלְאֵיתִי הָכִיל
  choice: ich bin es müde, ihn zurückzuhalten
  rationale: Die Wendung verbindet Erschöpfung mit dem Unvermögen beziehungsweise der Müdigkeit, den zuvor genannten Zorn weiter in sich zu halten.
- source_word: שְׁפֹךְ
  choice: Gieße ihn aus
  rationale: Die Imperativform bewahrt den abrupten Übergang zur Aufforderung; das Pronomen nimmt den Zorn aus dem vorigen Satz auf.
- source_word: עוֹלָל בַּחוּץ
  choice: das Kind auf der Straße
  rationale: עוֹלָל bezeichnet ein kleines Kind; בַּחוּץ verweist hier auf den öffentlichen Außenraum, idiomatisch „auf der Straße“.
- source_word: סוֹד בַּחוּרִים יַחְדָּו
  choice: die Schar der jungen Männer insgesamt
  rationale: סוֹד meint hier einen Kreis oder eine versammelte Gruppe, nicht notwendig einen förmlichen Rat; יַחְדָּו unterstreicht, dass die Gruppe als Ganze betroffen ist.
- source_word: יִלָּכֵדוּ
  choice: werden ergriffen
  rationale: Das Nifal von לכד kann Gefangennahme oder Ergriffenwerden im Gericht bezeichnen. „Ergriffen“ hält den militärischen Bezug offen, ohne ihn zu erzwingen.
- source_word: אִישׁ עִם אִשָּׁה
  choice: Mann und Frau
  rationale: Die Wortverbindung bezeichnet beide Geschlechter und setzt nicht voraus, dass es sich um ein Ehepaar handelt.
- source_word: זָקֵן עִם מְלֵא יָמִים
  choice: der Alte samt dem Hochbetagten
  rationale: זָקֵן bezeichnet hier einen alten Mann, nicht einen Amtsträger; מְלֵא יָמִים ist wörtlich „voll an Tagen“ und bezeichnet einen Menschen in sehr hohem Alter.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Sprecherperspektive und Aufforderung שְׁפֹךְ
  choice: Der Text lässt Jeremia von seiner Erfüllung mit Jahwes Zorn sprechen und gibt anschließend die unvermittelte Aufforderung „Gieße ihn aus“ wieder.
  alternative: Die Aufforderung kann als direktes Wort Jahwes oder als Ausdruck der vom Propheten übernommenen Gerichtsankündigung verstanden werden.
  rationale: Die knappe hebräische Abfolge markiert den Sprecherwechsel nicht ausdrücklich. Die Übersetzung bewahrt den Imperativ und vermeidet eine erklärende Sprecherangabe, die die Mehrdeutigkeit auflösen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des angefüllten und ausgegossenen Zorns bleibt erhalten. Der abrupte Imperativ wird nicht durch eine zusätzliche Sprecherangabe geglättet; „Schar“ gibt die versammelte Gruppe natürlich wieder, ohne einen förmlichen Rat anzunehmen.
