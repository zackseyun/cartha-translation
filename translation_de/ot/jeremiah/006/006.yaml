revisions:
- from: 'Denn so spricht Jahwe der Heerscharen: »Fällt Bäume[a] und schüttet gegen Jerusalem einen Belagerungsdamm auf! Das ist die Stadt, die zur Rechenschaft gezogen werden muss[b]; in ihrer Mitte herrscht nichts als Unterdrückung.«'
  to: 'Denn so spricht Jahwe der Heerscharen: »Fällt Bäume[a] und schüttet gegen Jerusalem einen Belagerungswall auf! Das ist die Stadt, die zur Rechenschaft gezogen werden muss[b]; in ihr ist alles Unterdrückung.«'
  rationale: Die Revision stellt die umfassende Aussage „alles [an] ihr ist Unterdrückung“ deutlicher wieder her und ersetzt eine im Deutschen potenziell missverständliche Bezeichnung des Belagerungswerks. Die Satzstruktur, die gerichtliche Aussage und die vorhandenen Fußnotenanker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
