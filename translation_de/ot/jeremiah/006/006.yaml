source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּרְת֣וּ עֵצָ֔ה וְ/שִׁפְכ֥וּ עַל יְרוּשָׁלִַ֖ם סֹלְלָ֑ה הִ֚יא הָ/עִ֣יר הָפְקַ֔ד כֻּלָּ֖/הּ עֹ֥שֶׁק בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/006.yaml
  text: 'For thus says Yahweh of hosts: “Cut down trees[a], and heap up a siege ramp against Jerusalem. This is the city that must be punished[b]; there is nothing but oppression within her.”'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen: »Fällt Bäume[a] und schüttet gegen Jerusalem einen Belagerungswall auf! Das ist die Stadt, die zur Rechenschaft gezogen werden muss[b]; in ihr ist alles Unterdrückung.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort steht in der Einzahl, ist hier aber wahrscheinlich kollektiv gemeint: „Holz“ oder „Bäume“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die heimgesucht werden muss“. Das entsprechende hebräische Verb kann „aufsuchen“ oder „überprüfen“ bedeuten und bezeichnet hier ein Zur-Rechenschaft-Ziehen im Gericht.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Bewahrt den Gottesnamen und gibt den umfassenden Titel צְבָאוֹת in einer würdigen, im Deutschen verständlichen Form wieder, ohne ihn auf ausschließlich menschliche Heere einzuengen.
- source_word: כִּרְתוּ עֵצָה
  choice: Fällt Bäume
  rationale: עֵצָה steht hier kollektiv für Holz beziehungsweise Bäume; im Zusammenhang der Belagerung bezeichnet die Wendung das Fällen von Bäumen für die Belagerungsarbeiten.
- source_word: וְשִׁפְכוּ ... סֹלְלָה
  choice: schüttet ... einen Belagerungsdamm auf
  rationale: Die Wiedergabe behält das Bild des hebräischen Verbs ‚ausgießen, ausschütten‘ bei und macht zugleich deutlich, dass Erdmaterial zu einem Belagerungswerk aufgeschüttet wird.
- source_word: עַל יְרוּשָׁלִַם
  choice: gegen Jerusalem
  rationale: עַל bezeichnet hier im militärischen Zusammenhang die feindliche Ausrichtung des Belagerungswerks.
- source_word: הָפְקַד
  choice: zur Rechenschaft gezogen werden muss
  rationale: Im Kontext kündigt פקד eine gerichtliche Heimsuchung an. Die Formulierung macht den Strafcharakter deutlich, ohne die mögliche Grundbedeutung des Aufsuchens oder Überprüfens völlig zu verdecken.
- source_word: כֻּלָּהּ עֹשֶׁק בְּקִרְבָּהּ
  choice: in ihrer Mitte herrscht nichts als Unterdrückung
  rationale: Die idiomatische deutsche Formulierung bewahrt die totalisierende Aussage כֻּלָּהּ und die feminine Personifikation Jerusalems.
theological_decisions:
- issue: Gerichtliche Bedeutung von הָפְקַד
  choice: zur Rechenschaft gezogen werden muss
  alternative: heimgesucht werden muss / zur Bestrafung bestimmt ist
  rationale: Die Belagerungsankündigung verlangt eine gerichtliche Deutung, doch die Fußnote hält die breitere Bedeutung von פקד sichtbar und vermeidet eine übermäßig enge dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen militärischen Befehle bleiben direkt; die feminine Bezugnahme auf Jerusalem wird mit „ihrer Mitte“ bewahrt. „Belagerungsdamm“ ist gegenüber dem technischeren „Belagerungsrampe“ im Deutschen natürlicher, während „schüttet ... auf“ das hebräische Bild erhält.
