id: JER.6.26
reference: Jeremiah 6:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בַּת עַמִּ֤/י חִגְרִי שָׂק֙ וְ/הִתְפַּלְּשִׁ֣י בָ/אֵ֔פֶר אֵ֤בֶל יָחִיד֙ עֲשִׂ֣י לָ֔/ךְ מִסְפַּ֖ד תַּמְרוּרִ֑ים כִּ֣י פִתְאֹ֔ם יָבֹ֥א הַ/שֹּׁדֵ֖ד עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/026.yaml
  text: Daughter of my people[a], put on sackcloth and roll in ashes; make mourning as for an only son, a most bitter lamentation[c][b], for suddenly the destroyer will come upon us.
translation:
  language: de
  text: Tochter meines Volkes, gürte dich mit Sacktuch und wälze dich in Asche![a] Trauere wie um den einzigen Sohn[b], halte eine überaus bittere Totenklage! Denn plötzlich wird der Verwüster über uns kommen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wirf dich in die Asche“ oder „bedecke dich mit Asche“. Das hebräische Verb beschreibt eine körperliche Trauerhandlung in der Asche.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Trauer um einen Einzigen“. Im Zusammenhang ist die Trauer um den einzigen Sohn gemeint.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen steht „über uns“. Der Prophet geht damit von der Anrede des Volkes dazu über, sich selbst in das drohende Unheil einzubeziehen; manche Übersetzungen gleichen den Ausdruck zu „über euch“ an.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת עַמִּי
  choice: Tochter meines Volkes
  rationale: Die direkte Anrede und die prophetische Personifikation des Volkes als Tochter bleiben erhalten.
- source_word: חִגְרִי שָׂק
  choice: gürte dich mit Sacktuch
  rationale: Die Wendung bewahrt das konkrete Anlegen des Sacktuchs als Zeichen der Trauer; „gürte dich“ ist im Deutschen verständlich und entspricht dem Bild des hebräischen Verbs.
- source_word: וְהִתְפַּלְּשִׁי בָאֵפֶר
  choice: und wälze dich in Asche
  rationale: Die reflexive Verbform bezeichnet eine heftige körperliche Trauerhandlung; „sich in Asche wälzen“ gibt diese anschaulich wieder.
- source_word: אֵבֶל יָחִיד
  choice: Trauere wie um den einzigen Sohn
  rationale: יָחִיד bedeutet wörtlich „einziger/einziges“; im Trauerzusammenhang ist der einzige Sohn gemeint. Der Vergleich vermittelt äußerste Trauer.
- source_word: מִסְפַּד תַּמְרוּרִים
  choice: eine überaus bittere Totenklage
  rationale: מִסְפַּד bezeichnet die Klage um einen Toten; der intensive Ausdruck תַּמְרוּרִים wird natürlich mit „überaus bitter“ wiedergegeben.
- source_word: הַשֹּׁדֵד
  choice: der Verwüster
  rationale: Das substantivierte Partizip bezeichnet den, der plündert und verheerend zerstört. „Verwüster“ umfasst im Kontext beide Aspekte.
- source_word: עָלֵינוּ
  choice: über uns
  rationale: Die erste Person Plural wird bewahrt und gibt den Wechsel von der direkten Anrede zur Einbeziehung des Propheten in das drohende Unheil wieder.
theological_decisions:
- issue: Wechsel von der Anrede in der zweiten Person Femininum zur ersten Person Plural
  choice: „Tochter meines Volkes … über uns“
  alternative: Den Schluss zur stilistischen Angleichung mit „über dich/euch“ wiedergeben
  rationale: Der masoretische Text liest ausdrücklich „über uns“. Die Beibehaltung wahrt die Solidarität des Propheten mit dem Volk und glättet die rhetorische Spannung nicht.
- issue: Ergänzung von „Sohn“ bei יָחִיד
  choice: „der einzige Sohn“
  alternative: „der Einzige“ oder „das einzige Kind“
  rationale: Im Kontext der Totenklage bezeichnet die knappe hebräische Wendung idiomatisch die Trauer um den einzigen Sohn. Eine Fußnote macht die wörtliche Offenheit sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter prophetischer Bildsprache. Die Imperative wirken eindringlich, ohne unnötig altertümlich zu klingen; „Totenklage“ macht den Trauerkontext ausdrücklich, und „über uns“ erhält den auffälligen Personenwechsel des hebräischen Textes.
