id: JER.6.28
reference: Jeremiah 6:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֻּלָּ/ם֙ סָרֵ֣י סֽוֹרְרִ֔ים הֹלְכֵ֥י רָכִ֖יל נְחֹ֣שֶׁת וּ/בַרְזֶ֑ל כֻּלָּ֥/ם מַשְׁחִיתִ֖ים הֵֽמָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/028.yaml
  text: All of them are the most stubborn rebels[a], going about as slanderers; they are bronze and iron[d][c][b]; all of them are corrupters.
translation:
  language: de
  text: Sie alle sind durch und durch widerspenstige Rebellen[a], gehen als Verleumder umher[b]. Sie sind Bronze und Eisen[c]; sie alle sind Verderber[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »Rebellen unter Rebellen«; die hebräische Wendung verstärkt den Grad ihrer Widerspenstigkeit. Möglich ist auch: »die schlimmsten Rebellen« oder »führende Rebellen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »gehen umher und verbreiten Verleumdungen«, »gehen umher und verbreiten Klatsch oder Gerüchte« oder »gehen als Klatschverbreiter umher«.'
    reason: lexical_alternative
  - marker: c
    text: »Bronze und Eisen« ist wahrscheinlich bildlich gemeint und kann auf Härte oder auf unedle Bestandteile im Bild der Läuterung hinweisen. Das mit »Bronze« übersetzte hebräische Wort kann auch »Kupfer« bedeuten.
    reason: cultural_note
  - marker: d
    text: 'Oder: »Zerstörer« beziehungsweise »Menschen, die Verderben anrichten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Bewahrt den umfassenden Geltungsbereich und die Hervorhebung der gesamten Gruppe; die Voranstellung am Satzanfang entspricht dem hebräischen Nachdruck in natürlichem Deutsch.
- source_word: סָרֵי סוֹרְרִים
  choice: durch und durch widerspenstige Rebellen
  rationale: Die intensive hebräische Verbindung, wörtlich etwa »Rebellen unter Rebellen«, wird idiomatisch wiedergegeben, ohne sie auf einen bloßen Rang wie »Anführer« festzulegen.
- source_word: הֹלְכֵי רָכִיל
  choice: gehen als Verleumder umher
  rationale: Die Partizipialkonstruktion bezeichnet ein fortgesetztes Verhalten. »Verleumder« gibt den schädigenden Sinn von רָכִיל wieder; die mögliche Bedeutung »Klatsch- oder Gerüchteverbreiter« bleibt in der Fußnote sichtbar.
- source_word: נְחֹשֶׁת וּבַרְזֶל
  choice: Bronze und Eisen
  rationale: Gibt das traditionelle Metallpaar direkt wieder und erhält dessen knappe, nicht ausdrücklich erklärte Bildsprache. נְחֹשֶׁת kann je nach Zusammenhang auch Kupfer bezeichnen.
- source_word: מַשְׁחִיתִים
  choice: Verderber
  rationale: Bewahrt die aktive Bedeutung des Hifil-Partizips von שׁחת und lässt sowohl moralisches Verderben als auch zerstörerisches Handeln anklingen.
- source_word: הֵמָּה
  choice: sie sind
  rationale: Das ausdrücklich gesetzte Pronomen wird in der abschließenden Identifikation wiedergegeben; die erneute Formulierung »sie alle« nimmt zugleich das wiederholte כֻּלָּם auf.
theological_decisions:
- issue: Deutung von »Bronze und Eisen«
  choice: Das Metallbild bleibt im Haupttext ungedeutet.
  alternative: Eine bestimmte Deutung wie »hart und unrein« unmittelbar in den Text einzusetzen.
  rationale: Der hebräische Text nennt nur die Metalle. Ihre genaue bildliche Nuance ist nicht eindeutig; eine Fußnote benennt daher mögliche Assoziationen, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »sie alle« und das abrupte Metallbild bleiben als Merkmale der prophetischen Anklage erhalten. »Rebellen« ist allgemein verständlich; »Verderber« bewahrt den kompakten, aktiven Charakter des hebräischen Partizips.
