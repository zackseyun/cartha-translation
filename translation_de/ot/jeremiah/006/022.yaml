source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנֵּ֛ה עַ֥ם בָּ֖א מֵ/אֶ֣רֶץ צָפ֑וֹן וְ/ג֣וֹי גָּד֔וֹל יֵע֖וֹר מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/022.yaml
  text: 'Thus says Yahweh: Behold[a], a people is coming from the land of the north, and a great nation is stirred up from the farthest parts of the earth.'
translation:
  language: de
  text: 'So spricht Jahwe: Siehe, ein Volk kommt aus dem Land des Nordens, und eine große Nation wird von den fernsten Winkeln der Erde her[a] aufgerüttelt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den Enden der Erde her“ beziehungsweise „aus den entlegensten Teilen des Landes“. Der hebräische Ausdruck bezeichnet äußerste oder weit entfernte Bereiche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Botenformel bewahrt den feierlichen prophetischen Ton; das Präsens gibt die im Hebräischen formelhafte Verkündigung natürlich wieder, und der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הִנֵּה
  choice: Siehe
  rationale: „Siehe“ markiert den eindringlichen Aufmerksamkeitsruf und passt zum würdevollen prophetischen Sprachregister.
- source_word: עַם בָּא
  choice: ein Volk kommt
  rationale: Die schlichte Präsensform gibt das unmittelbar bevorstehende und bereits anschaulich angekündigte Kommen wieder.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: aus dem Land des Nordens
  rationale: Die Wiedergabe erhält sowohl אֶרֶץ als auch die Richtungsangabe und lässt offen, ob eine bestimmte nördliche Region oder allgemein das Gebiet im Norden gemeint ist.
- source_word: וְגוֹי גָּדוֹל
  choice: und eine große Nation
  rationale: „Nation“ wahrt den lexikalischen Wechsel von עַם zu גּוֹי und den geopolitischen Klang des Zusammenhangs.
- source_word: יֵעוֹר
  choice: wird … aufgerüttelt
  rationale: Das Passiv bewahrt die Nifal-Form und bezeichnet ein Aufwecken beziehungsweise Mobilisieren zum Handeln, ohne den Handelnden ausdrücklich zu benennen.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: von den fernsten Winkeln der Erde her
  rationale: Die Formulierung gibt die abgelegenen äußersten Bereiche anschaulich wieder; „Erde“ passt zur weiträumigen Perspektive, während „Land“ lexikalisch ebenfalls möglich bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht genannter Urheber des Aufrüttelns
  choice: 'Passiv: „wird … aufgerüttelt“'
  alternative: „macht sich auf“
  rationale: Das Passiv wahrt die grammatische Offenheit des hebräischen Nifal und benennt weder Gott noch eine andere Macht ausdrücklich als Urheber.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel. „Siehe“ ist leicht gehoben, aber verständlich und entspricht der eindringlichen Funktion des hebräischen Ausdrucks. Der Fußnotenmarker steht bei der Wendung, auf die sich die lexikalische Alternative bezieht.
