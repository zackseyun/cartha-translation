  text: הִוָּסְרִי֙ יְר֣וּשָׁלִַ֔ם פֶּן תֵּקַ֥ע נַפְשִׁ֖/י מִמֵּ֑/ךְ פֶּן אֲשִׂימֵ֣/ךְ שְׁמָמָ֔ה אֶ֖רֶץ ל֥וֹא נוֹשָֽׁבָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/008.yaml
  text: Be warned[a], O Jerusalem, lest my soul turn away from you, lest I make you a desolation[b], a land not inhabited.
translation:
  language: de
  text: Lass dich zurechtweisen[a], Jerusalem, sonst wendet sich meine Seele von dir ab[b], sonst mache ich dich zur Einöde, zu einem Land, in dem niemand wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Nimm Zurechtweisung an“ oder „Lass dich unterweisen“. Das hebräische Verb meint, erzieherische Korrektur oder Zucht anzunehmen, nicht lediglich eine Warnung zur Kenntnis zu nehmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Sonst löst sich meine Seele von dir los“ oder „Sonst entfremdet sich meine Seele von dir“. Das seltene hebräische Verb bezeichnet ein Loslösen oder Entfremden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוָּסְרִי
  choice: Lass dich zurechtweisen
  rationale: Der feminine Singular des Niphal-Imperativs von יסר richtet sich an Jerusalem und fordert dazu auf, Zurechtweisung oder erzieherische Korrektur anzunehmen. Die Formulierung ist im heutigen Deutsch natürlich und bewahrt den korrektiven Nachdruck.
- source_word: פֶּן
  choice: sonst
  rationale: פֶּן leitet hier jeweils die angedrohte Folge ein. „Sonst“ gibt diese Warnfunktion in natürlichem Deutsch klar wieder.
- source_word: תֵּקַע נַפְשִׁי מִמֵּךְ
  choice: wendet sich meine Seele von dir ab
  rationale: Die seltene Verbform bezeichnet ein Loslösen, Entfremden oder Abwenden. Die Übersetzung bewahrt נַפְשִׁי ausdrücklich als „meine Seele“ und macht zugleich den Beziehungsabbruch verständlich.
- source_word: אֲשִׂימֵךְ שְׁמָמָה
  choice: mache ich dich zur Einöde
  rationale: שׂים mit Objektsuffix bezeichnet hier das Versetzen Jerusalems in einen Zustand völliger Verwüstung; das Substantiv שְׁמָמָה wird mit „Einöde“ nominal wiedergegeben.
- source_word: אֶרֶץ לֹא נוֹשָׁבָה
  choice: zu einem Land, in dem niemand wohnt
  rationale: Die partizipiale Wendung beschreibt ein nicht bewohntes Land. Der Relativsatz ist idiomatisches modernes Deutsch und erhält die Aussage vollständig.
theological_decisions:
- issue: Anthropopathische Rede von Gottes נֶפֶשׁ
  choice: meine Seele wendet sich von dir ab
  alternative: ich wende mich von dir ab
  rationale: Der hebräische Text nennt ausdrücklich Gottes „Seele“. Diese bildhafte, theologisch spannungsreiche Rede wird nicht zu einer bloßen Ich-Aussage geglättet.
- issue: Bedingter Charakter der Gerichtsankündigung
  choice: zweimaliges „sonst“
  alternative: „damit nicht … und damit ich nicht …“
  rationale: Das zweimalige פֶּן verbindet die Aufforderung zur Umkehr mit zwei angedrohten Folgen. „Sonst“ hält diesen Warn- und Folgezusammenhang offen, ohne das Gericht als bereits unabwendbar darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Nachdruck. Die direkte Anrede Jerusalems und die zweimalige Warnformel bleiben erhalten; die ungewöhnliche Wendung „meine Seele“ wird bewusst nicht geglättet.
