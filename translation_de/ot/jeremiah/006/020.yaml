  text: לָ/מָּה זֶּ֨ה לִ֤/י לְבוֹנָה֙ מִ/שְּׁבָ֣א תָב֔וֹא וְ/קָנֶ֥ה הַ/טּ֖וֹב מֵ/אֶ֣רֶץ מֶרְחָ֑ק עֹלֽוֹתֵי/כֶם֙ לֹ֣א לְ/רָצ֔וֹן וְ/זִבְחֵי/כֶ֖ם לֹא עָ֥רְבוּ לִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/020.yaml
  text: 'Why is this to me: frankincense comes from Sheba[a], and sweet cane from a distant land? Your burnt offerings are not acceptable[b], and your sacrifices do not please me.'
translation:
  language: de
  text: Was soll mir Weihrauch, der aus Saba kommt, und kostbares Würzrohr aus einem fernen Land? Eure Brandopfer finden kein Gefallen, und eure Schlachtopfer sind mir nicht angenehm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה זֶּה לִי
  choice: Wozu soll mir das dienen
  rationale: Gibt die rhetorische Frage und den idiomatischen Sinn des Dativs לִי natürlich wieder, ohne die göttliche Zurückweisung übermäßig auszudeuten.
- source_word: לְבוֹנָה
  choice: Weihrauch
  rationale: Bezeichnet spezifisch Weihrauch und nicht Räucherwerk im Allgemeinen.
- source_word: מִשְּׁבָא
  choice: aus Saba
  rationale: Verwendet die im Deutschen eingebürgerte biblische Form des Ortsnamens.
- source_word: תָבוֹא
  choice: kommt
  rationale: Das Qal-Imperfekt beschreibt hier passend den gegenwärtigen Import im Rahmen der rhetorischen Frage.
- source_word: קָנֶה הַטּוֹב
  choice: das kostbare Würzrohr
  rationale: קָנֶה bezeichnet Rohr, während הַטּוֹב hier dessen geschätzte aromatische Qualität hervorhebt; „Würzrohr“ ist verständlicher als das fachsprachliche „Kalmus“.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: aus fernem Land
  rationale: Bewahrt knapp und natürlich die geografische Ferne.
- source_word: עֹלוֹתֵיכֶם
  choice: eure Brandopfer
  rationale: Gibt den feststehenden kultischen Begriff ausdrücklich wieder.
- source_word: לֹא לְרָצוֹן
  choice: finden kein Gefallen
  rationale: Drückt aus, dass die Opfer vor Gott keine Annahme beziehungsweise kein Wohlgefallen finden, und wahrt die kultische Färbung.
- source_word: זִבְחֵיכֶם
  choice: eure Schlachtopfer
  rationale: Unterscheidet זֶבַח präzise vom zuvor genannten Brandopfer und bewahrt den kultischen Fachbegriff in allgemein verständlicher Form.
- source_word: לֹא עָרְבוּ לִי
  choice: sind mir nicht angenehm
  rationale: Gibt die Bedeutung „angenehm, wohlgefällig sein“ idiomatisch wieder und erhält den Bezug auf den Sprecher.
theological_decisions:
- issue: Göttliche Zurückweisung kostbarer Kultgaben und Opfer
  choice: Die rhetorische Frage stellt den Nutzen importierter Räucherstoffe für Gott infrage; anschließend werden Brand- und Schlachtopfer ausdrücklich als nicht wohlgefällig bezeichnet.
  alternative: Eine stärker deutende Fassung könnte ausdrücklich von heuchlerischem oder ungehorsamem Gottesdienst sprechen.
  rationale: Der hebräische Vers selbst formuliert die Zurückweisung klar, nennt hier aber nicht ausdrücklich den moralischen Grund. Die Übersetzung bewahrt diese Spannung und trägt keine Erklärung aus dem Kontext in den Vers ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; kultische Begriffe werden präzise, aber verständlich wiedergegeben. „Saba“ folgt dem etablierten deutschen Bibelgebrauch.
