base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/006/003.yaml
  text: To her shepherds will come with their flocks[a]; they will pitch tents against her all around; each will pasture his own place.
translation:
  language: de
  text: Zu ihr kommen Hirten mit ihren Herden. Rings um sie schlagen sie ihre Zelte auf; jeder weidet seinen Bereich ab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Jeder weidet seine Hand ab.« Die ungewöhnliche Wendung meint wahrscheinlich, dass jeder den ihm zufallenden Bereich abweidet oder aufzehrt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: Zu ihr
  rationale: Bewahrt die gewöhnliche Richtungsbedeutung von אֶל; der feindliche Zusammenhang ergibt sich aus dem ringsum erfolgenden Lageraufschlag.
- source_word: רֹעִים וְעֶדְרֵיהֶם
  choice: Hirten mit ihren Herden
  rationale: Erhält das durchgehende Hirtenbild; וְ bezeichnet hier natürlich die Begleitung.
- source_word: תָּקְעוּ עָלֶיהָ אֹהָלִים סָבִיב
  choice: Rings um sie schlagen sie ihre Zelte auf
  rationale: Gibt die feste Verbindung von תקע mit Zelten idiomatisch wieder und macht die vollständige Umzingelung deutlich, ohne עָלֶיהָ unnötig zu überdeuten.
- source_word: רָעוּ
  choice: weidet ... ab
  rationale: Führt das Hirtenbild fort und lässt zugleich im Belagerungskontext das Aufzehren des jeweiligen Gebiets anklingen.
- source_word: אִישׁ אֶת יָדוֹ
  choice: jeder ... seinen Bereich
  rationale: Gibt die distributive Wendung lesbar wieder. Da das wörtliche »seine Hand« dunkel ist, wird die wahrscheinlich gemeinte räumliche Zuteilung im Text knapp ausgedrückt und die Unsicherheit in der Fußnote offengelegt.
