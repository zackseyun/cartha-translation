source:
  edition: WLC
  text: כִּ֣י עָלָה֩ עָלֶ֨י/הָ גּ֜וֹי מִ/צָּפ֗וֹן הֽוּא יָשִׁ֤ית אֶת אַרְצָ/הּ֙ לְ/שַׁמָּ֔ה וְ/לֹֽא יִהְיֶ֥ה יוֹשֵׁ֖ב בָּ֑/הּ מֵ/אָדָ֥ם וְ/עַד בְּהֵמָ֖ה נָ֥דוּ הָלָֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
translation:
  language: de
  text: Denn ein Volk ist von Norden gegen sie heraufgezogen. Es wird ihr Land zur Einöde machen, sodass niemand mehr darin wohnt. Von Mensch bis Tier sind alle geflohen und fortgezogen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Formel bezeichnet die Gesamtheit der Lebewesen: Menschen und Tiere gleichermaßen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für den vorausgehenden Aufruf ein und wahrt den erklärenden Zusammenhang.
- source_word: עָלָה עָלֶיהָ
  choice: zieht gegen sie herauf
  rationale: Gibt den militärischen Vormarsch idiomatisch wieder und erhält zugleich die Bewegungsrichtung des Verbs.
- source_word: גּוֹי
  choice: ein Volk
  rationale: Bezeichnet hier die als politische und militärische Größe auftretende Gemeinschaft; im Deutschen ist „Volk“ in diesem prophetischen Kontext natürlich.
- source_word: מִצָּפוֹן
  choice: von Norden
  rationale: Gibt die Herkunftsrichtung des angreifenden Volkes knapp und klar wieder.
- source_word: הוּא יָשִׁית אֶת אַרְצָהּ לְשַׁמָּה
  choice: Es wird ihr Land zur Einöde machen
  rationale: Das Pronomen nimmt das Volk auf; „zur Einöde machen“ drückt den bewirkten Zustand der Verwüstung aus und bewahrt die weibliche Personifikation Babylons in „ihr Land“.
- source_word: וְלֹא יִהְיֶה יוֹשֵׁב בָּהּ
  choice: sodass niemand mehr darin wohnt
  rationale: Formuliert die Folge der Verwüstung in natürlichem Deutsch; „mehr“ verdeutlicht die vollständige Entvölkerung, ohne den Sinn zu erweitern.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: Von Mensch bis Tier sind alle
  rationale: Bewahrt die hebräische Spannweitenformel und macht mit „alle“ deutlich, dass Menschen und Tiere gleichermaßen gemeint sind.
- source_word: נָדוּ הָלָכוּ
  choice: geflohen und fortgezogen
  rationale: 'Gibt beide Verben wieder: נוד bezeichnet hier die Flucht unter Bedrohung, הלך den vollzogenen Weggang.'
theological_decisions:
- issue: Generischer Gebrauch von אָדָם in der Totalitätsformel
  choice: Mensch
  alternative: Mann
  rationale: אָדָם bezeichnet in der festen Verbindung mit בְּהֵמָה die menschliche Gattung im Gegensatz zum Tier, nicht speziell männliche Personen. „Mensch“ ist daher quellennah und im heutigen Deutschen eindeutig.
- issue: Bezug des femininen Suffixes in אַרְצָהּ
  choice: ihr Land
  alternative: das Land
  rationale: Das Suffix bezieht sich auf das im Kontext personifizierte Babylon. „Ihr“ erhält diese Personifikation, ohne sie weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der prophetischen Aussage, vermeidet jedoch unnatürliche Nominalformulierungen. Die hebräische Doppelbewegung am Versende wird mit zwei deutschen Verben erhalten.
