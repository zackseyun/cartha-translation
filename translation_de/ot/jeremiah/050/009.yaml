id: JER.50.9
reference: Jeremiah 50:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
translation:
  language: de
  text: Denn siehe, ich rufe eine Schar großer Völker aus dem Land des Nordens auf und lasse sie gegen Babel heranziehen. Sie stellen sich gegen die Stadt in Schlachtordnung auf; von dort aus[a] wird sie eingenommen. Ihre Pfeile sind wie die eines kundigen Kriegers; keiner kehrt erfolglos zurück.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Von dort aus“ bezieht sich wahrscheinlich auf den Ort, an dem sich die angreifenden Völker gegen Babel aufstellen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher und mit möglichem Bezug auf den Krieger: „Ihre Pfeile sind wie ein kundiger Krieger, der nicht leer zurückkehrt.“ Der hebräische Vergleich ist verkürzt, und der genaue Bezug von „kehrt nicht leer zurück“ bleibt mehrdeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִיר
  choice: ich rufe … auf
  rationale: Das Hifil-Partizip von עור bezeichnet hier das veranlasste Aufstehen beziehungsweise Mobilisieren der Völker. „Aufrufen“ gibt die göttliche Verursachung in natürlichem Deutsch wieder.
- source_word: וּמַעֲלֶה
  choice: und lasse sie … heranziehen
  rationale: 'Das Hifil von עלה hat im militärischen Zusammenhang kausativen Sinn: Gott lässt die Streitmacht gegen Babel herauf- beziehungsweise heranziehen.'
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  choice: eine Schar großer Völker
  rationale: קהל bezeichnet eine versammelte Menge oder ein Aufgebot. „Schar“ ist im militärisch-prophetischen Zusammenhang verständlich und würdevoll; „großer Völker“ bewahrt den Bezug des Adjektivs auf die Völker.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: aus dem Land des Nordens
  rationale: Die häufige prophetische Herkunftsangabe wird nah am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: וְעָרְכוּ לָהּ
  choice: Sie stellen sich gegen die Stadt in Schlachtordnung auf
  rationale: ערך bezeichnet hier das militärische Aufstellen. „Die Stadt“ macht den femininen Rückbezug auf Babel im Hebräischen auf Deutsch verständlich, ohne Babel künstlich ein grammatisches Geschlecht zuzuweisen.
- source_word: מִשָּׁם תִּלָּכֵד
  choice: von dort aus wird sie eingenommen
  rationale: Die Ortsangabe bleibt ausdrücklich erhalten; das Nifal von לכד wird als militärisches Passiv „wird eingenommen“ wiedergegeben.
- source_word: חִצָּיו
  choice: Ihre Pfeile
  rationale: Das maskuline Singularsuffix bezieht sich am ehesten auf קהל als kollektive Streitmacht. Da „Schar“ im Deutschen feminin ist, lautet der entsprechende Rückbezug „ihre“.
- source_word: כְּגִבּוֹר מַשְׁכִּיל
  choice: wie die eines kundigen Kriegers
  rationale: משכיל kann Einsicht, Geschick oder daraus folgenden Erfolg bezeichnen. „Kundig“ bewahrt den Aspekt sachgemäßen Könnens; „die eines“ macht den im Hebräischen verkürzten Vergleich im Deutschen verständlich.
- source_word: לֹא יָשׁוּב רֵיקָם
  choice: keiner kehrt erfolglos zurück
  rationale: Wörtlich heißt es „er/es kehrt nicht leer zurück“. Die gewählte Form bezieht die Aussage auf die Pfeile und vermittelt ihr sicheres Treffen, ohne das Bild mit „mit leeren Händen“ unpassend auf Pfeile zu übertragen.
theological_decisions:
- issue: Göttliche Veranlassung des Angriffs auf Babel
  choice: Gott ruft die Völker auf und lässt sie gegen Babel heranziehen.
  alternative: Eine bloße Vorhersage des Angriffs ohne Hervorhebung göttlicher Veranlassung.
  rationale: Das betonte אָנֹכִי und die beiden kausativen Verbformen stellen Gottes Wirken ausdrücklich als Ursache des Aufmarsches dar.
- issue: Bezug des letzten Verbs
  choice: „Keiner kehrt erfolglos zurück“ wird im Haupttext auf die Pfeile bezogen.
  alternative: 'Das singularische Verb kann auf den kundigen Krieger bezogen werden: „der nicht leer zurückkehrt“.'
  rationale: Der unmittelbare Kontext handelt von den Pfeilen und ihrer Wirksamkeit; zugleich ist die hebräische Konstruktion verdichtet und lässt einen grammatischen Bezug auf den Krieger zu. Diese Spannung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Bildsprache. „Denn siehe“ bewahrt den prophetischen Ankündigungston; „Babel“ folgt der im deutschen Bibelgebrauch etablierten Namensform. Die hebräische Verdichtung im Pfeilvergleich wird im Haupttext lesbar entfaltet und in der Fußnote transparent gemacht.
