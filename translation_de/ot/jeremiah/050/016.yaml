source:
  edition: WLC
  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
translation:
  language: de
  text: Rottet aus Babel den Sämann aus und den, der zur Erntezeit die Sichel führt! Wegen des Schwertes des Unterdrückers[a] wird sich jeder seinem Volk zuwenden, und jeder wird in sein Land fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck kann auch als „das Schwert dessen, der unterdrückt“ oder „das grausame Schwert“ verstanden werden; weniger wahrscheinlich lautet er wörtlich „das Schwert der Taube“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְתוּ זוֹרֵעַ מִבָּבֶל
  choice: Rottet in Babel den Sämann aus
  rationale: כרת bezeichnet im Gerichtskontext das Abschneiden beziehungsweise Beseitigen. Die deutsche Formulierung gibt die gewaltsame Tilgung natürlich wieder; „in Babel“ vermeidet die missverständliche Lesart, der Sämann stamme aus Babel, während מן die Entfernung aus dem Bereich Babels ausdrückt.
- source_word: וְתֹפֵשׂ מַגָּל בְּעֵת קָצִיר
  choice: und den, der zur Erntezeit die Sichel führt
  rationale: תפשׂ bedeutet ergreifen, festhalten oder handhaben. „Die Sichel führt“ ist im Deutschen natürlich und bleibt dem konkreten Bild des hebräischen Textes nahe.
- source_word: מִפְּנֵי
  choice: Wegen
  rationale: Die Präposition bezeichnet hier den Grund für Umkehr und Flucht. „Wegen“ gibt diese kausale Funktion knapp und idiomatisch wieder.
- source_word: חֶרֶב הַיּוֹנָה
  choice: das Schwert des Unterdrückers
  rationale: הַיּוֹנָה wird hier am ehesten als Bezeichnung eines Unterdrückers verstanden. Die ungewöhnliche und mehrdeutige hebräische Wendung wird in einer Fußnote offengelegt.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: wird sich jeder seinem Volk zuwenden
  rationale: אִישׁ wird distributiv gebraucht. Das deutsche „jeder“ bewahrt diese Einzelverteilung ohne unnötig ein biologisches Geschlecht hervorzuheben; פנה bezeichnet die Hinwendung beziehungsweise Rückkehr zum eigenen Volk.
- source_word: וְאִישׁ לְאַרְצוֹ יָנֻסוּ
  choice: und jeder wird in sein Land fliehen
  rationale: נוס bedeutet fliehen oder entkommen. „Land“ entspricht ארץ und passt zur Rückkehr aus Babel in die jeweilige Heimat.
theological_decisions:
- issue: Distributive Bedeutung von אִישׁ
  choice: jeder
  alternative: jeder Mann
  rationale: Obwohl אִישׁ formal maskulin ist, dient es hier distributiv für die einzelnen Angehörigen der fremden Bevölkerungsgruppen. „Jeder“ bildet diese Funktion im modernen Deutschen präzise ab, ohne den Bezug auf einzelne Menschen abzuschwächen.
- issue: Deutung von חֶרֶב הַיּוֹנָה
  choice: Schwert des Unterdrückers
  alternative: grausames Schwert; Schwert der Taube
  rationale: Der Kontext eines gegen Babel gerichteten Gerichts macht die Ableitung von einem Verb für Unterdrücken am wahrscheinlichsten. Da die Form sprachlich umstritten ist, werden die anderen Deutungen nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eröffnende Imperativ bleibt scharf und unmittelbar; das landwirtschaftliche Bild wird konkret bewahrt. Die parallele Wiederholung von „jeder“ bildet die distributive Struktur des Hebräischen ab.
