  text: לָ/כֵ֗ן יֵשְׁב֤וּ צִיִּים֙ אֶת אִיִּ֔ים וְ/יָ֥שְׁבוּ בָ֖/הּ בְּנ֣וֹת יַֽעֲנָ֑ה וְ/לֹֽא תֵשֵׁ֥ב עוֹד֙ לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכּ֖וֹן עַד דּ֥וֹר וָ/דֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/039.yaml
  text: Therefore desert creatures will dwell there with hyenas[a], and ostriches will dwell in her; she will never again be inhabited forever[c][b], nor will she be lived in from generation to generation.
translation:
  language: de
  text: Darum werden dort Wüstentiere zusammen mit Hyänen[a] hausen, und Strauße[b] werden in ihr[c] wohnen. Für immer wird sie nicht wieder bewohnt werden, und von Generation zu Generation wird niemand in ihr wohnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schakalen“ beziehungsweise „heulenden Tieren“. Die genaue zoologische Bestimmung der hier verwendeten hebräischen Tierbezeichnungen ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Töchter des Straußes“, das heißt Strauße. In älteren Übersetzungen steht bisweilen „Eulen“.'
    reason: lexical_alternative
  - marker: c
    text: Babylon wird im Hebräischen als weibliche Stadt personifiziert; daher heißt es „in ihr“ und „sie“.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus dem angekündigten Gericht über Babylon ein.
- source_word: צִיִּים
  choice: Wüstentiere
  rationale: Der Ausdruck bezeichnet Tiere beziehungsweise Wesen, die mit Wüsten und Ruinen verbunden sind; wegen der unsicheren zoologischen Bestimmung ist eine allgemeine Wiedergabe angemessen.
- source_word: אֶת
  choice: zusammen mit
  rationale: אֶת wird hier nicht als direktes Objektzeichen, sondern in begleitender beziehungsweise verbindender Bedeutung verstanden.
- source_word: אִיִּים
  choice: Hyänen
  rationale: Das schwer zu bestimmende Wort bezeichnet wahrscheinlich heulende oder aasfressende Wildtiere in verlassenen Gebieten. Die spezifische Wiedergabe bleibt durch eine Fußnote als unsicher gekennzeichnet.
- source_word: בְּנוֹת יַעֲנָה
  choice: Strauße
  rationale: Die wörtliche Wendung „Töchter des Straußes“ ist eine hebräische Bezeichnung für Strauße; die ältere Deutung als Eulen ist weniger wahrscheinlich.
- source_word: בָהּ
  choice: in ihr
  rationale: Das feminine Suffix bezieht sich auf die als weiblich vorgestellte Stadt Babylon und bewahrt deren Personifizierung.
- source_word: לֹא תֵשֵׁב עוֹד לָנֶצַח
  choice: Nie wieder wird sie bewohnt sein – für alle Zeit
  rationale: Die Formulierung bewahrt sowohl עוֹד („wieder“) als auch לָנֶצַח („für immer/für alle Zeit“) und gibt ihre nachdrückliche Aussage dauernder Verwüstung in verständlichem Deutsch wieder.
- source_word: לֹא תִשְׁכּוֹן
  choice: wird niemand in ihr wohnen
  rationale: Das Verb bezeichnet das Wohnen oder Sich-Niederlassen. Die unpersönliche deutsche Formulierung drückt natürlich aus, dass die Stadt ohne Bewohner bleiben wird.
- source_word: עַד דּוֹר וָדוֹר
  choice: von Generation zu Generation
  rationale: Die feste Wendung bezeichnet eine über aufeinanderfolgende Generationen andauernde Zeitspanne.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hausen“ kennzeichnet passend das Leben wilder Tiere in Ruinen, während „wohnen“ die Aussage über eine menschliche Besiedlung natürlich wiedergibt. Der Gedankenstrich erhält die hebräische Verstärkung „nie wieder … für alle Zeit“, ohne sie als bloße Redundanz zu glätten.
