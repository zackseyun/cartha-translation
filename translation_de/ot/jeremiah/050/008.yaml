  variant: modern standard German
source:
  edition: WLC
  text: נֻ֚דוּ מִ/תּ֣וֹךְ בָּבֶ֔ל וּ/מֵ/אֶ֥רֶץ כַּשְׂדִּ֖ים יצאו וִ/הְי֕וּ כְּ/עַתּוּדִ֖ים לִ/פְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/008.yaml
  text: Flee from the midst of Babylon[a], and go out from the land of the Chaldeans; and be like male goats before the flock.
translation:
  language: de
  text: Flieht aus Babylon, zieht aus dem Land der Chaldäer fort und seid wie Ziegenböcke vor der Herde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Bild kann dies bedeuten: wie Ziegenböcke, die der Herde vorangehen.'
    reason: Die Wendung לִפְנֵי צֹאן bedeutet wörtlich „vor der Herde“. Die Anmerkung erläutert die mögliche bildliche Bedeutung, ohne die räumliche Grundbedeutung im Haupttext zu ersetzen.
lexical_decisions:
- source_word: נֻדוּ
  choice: Flieht
  rationale: Der Imperativ fordert im Zusammenhang zur dringenden Abkehr vom dem Untergang geweihten Babylon auf. „Flieht“ gibt diese Dringlichkeit im Deutschen natürlicher wieder als das wörtlichere „zieht umher“ oder das schwächere „geht fort“.
- source_word: מִתּוֹךְ בָּבֶל
  choice: aus Babylon
  rationale: מִתּוֹךְ bezeichnet eine Bewegung aus dem Inneren heraus. Im Deutschen enthält „aus Babylon“ diesen Gedanken idiomatisch; „aus der Mitte Babylons“ wäre unnötig schwerfällig.
- source_word: וּמֵאֶרֶץ כַּשְׂדִּים יצאו
  choice: zieht aus dem Land der Chaldäer fort
  rationale: יצאו ist der Form nach 3. Person Plural, setzt hier im Zusammenhang jedoch die Aufforderung fort. „Land der Chaldäer“ bewahrt die ausdrückliche hebräische Bezeichnung, statt sie zu „Chaldäa“ zu verkürzen.
- source_word: וִהְיוּ
  choice: und seid
  rationale: Die Form führt die Reihe der Aufforderungen weiter. Das verbindende „und“ entspricht der hebräischen Satzfolge.
- source_word: כְּעַתּוּדִים
  choice: wie Ziegenböcke
  rationale: עַתּוּדִים meint männliche Ziegen. „Ziegenböcke“ ist präzise und im heutigen Deutsch verständlich; „Widder“ würde fälschlich männliche Schafe bezeichnen.
- source_word: לִפְנֵי צֹאן
  choice: vor der Herde
  rationale: Die Wiedergabe bewahrt die räumliche Grundbedeutung von לִפְנֵי und lässt offen, ob die Böcke lediglich vorausgehen oder die Herde anführen. „Herde“ ist für das kollektive צֹאן hier natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter imperativischer Ansprache. Die drei Aufforderungen bleiben deutlich, während die Mehrdeutigkeit des abschließenden Herdenbildes nicht im Haupttext aufgelöst wird.
