source:
  edition: WLC
  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
translation:
  language: de
  text: Ein Schwert gegen die Chaldäer[a] – Spruch Jahwes – und gegen die Bewohner Babylons, gegen ihre Amtsträger[b] und gegen ihre Weisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Babylonier«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ihre Fürsten«; auch: »ihre führenden Männer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב עַל
  choice: Das Schwert kommt über
  rationale: Die verblos formulierte Gerichtsaussage kündigt Krieg und gewaltsames Gericht an. Die deutsche Wendung ist natürlich und bewahrt zugleich das Bild des Schwertes.
- source_word: כַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die Wiedergabe hält am konkreten Ethnonym des hebräischen Textes fest; im Kontext sind damit die Babylonier gemeint.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt נְאֻם knapp und würdig wieder; der Gottesname wird als Jahwe wiedergegeben.
- source_word: יֹשְׁבֵי בָבֶל
  choice: die Bewohner Babylons
  rationale: Dies ist eine natürliche und genaue Wiedergabe der partizipialen Wendung für die in Babylon Wohnenden.
- source_word: שָׂרֶיהָ
  choice: ihre führenden Männer
  rationale: שָׂרִים bezeichnet je nach Zusammenhang Fürsten, Amtsträger oder andere Führungspersonen. Die Formulierung wahrt diese Bedeutungsbreite, ohne königliche Abstammung vorauszusetzen.
- source_word: חֲכָמֶיהָ
  choice: ihre Weisen
  rationale: Die direkte Wiedergabe bewahrt den Bezug auf Babylons gelehrte und als weise geltende Führungsschicht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration „Jahwe“ bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten hebräischen Präpositionen werden durch die dreifache Wiederaufnahme von „über“ hörbar gemacht; vor dem letzten Glied steht ein natürliches „und“. Die personifizierende feminine Rückverweisung auf Babylon wird im Deutschen idiomatisch mit Possessivformen wiedergegeben.
