  naturalness: Eine knappe, elliptische Gerichtsankündigung mit „Ein Schwert gegen …“ ist im prophetisch-würdigen modernen Bibeldeutsch verständlich und angemessen. „Spruch Jahwes“ gibt die Formel נְאֻם יְהוָה idiomatisch wieder.
