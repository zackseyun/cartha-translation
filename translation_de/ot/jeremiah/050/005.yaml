  naturalness: „Nach Zion werden sie nach dem Weg fragen“ ist verständlich, aber „Sie werden nach dem Weg nach Zion fragen“ ist im modernen Standarddeutsch deutlich idiomatischer. „dorthin das Gesicht gewandt“ ist möglich, jedoch wirkt „ihr Gesicht dorthin gerichtet“ natürlicher. Die überarbeitete direkte Rede vermeidet die doppelte, schwerfällige Reflexivkonstruktion und bleibt auffordernd.
  terminology: „Zion“, „Jahwe“, „Bund“ und „ewig“ sind sachgerecht. Die passive Offenheit von „der nicht vergessen wird“ soll erhalten bleiben; sie bestimmt nicht, wer den Bund nicht vergisst. „Ewigen Bund“ gibt בְּרִית עוֹלָם angemessen wieder.
