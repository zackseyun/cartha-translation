source:
  edition: WLC
  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
translation:
  language: de
  text: Sie werden nach dem Weg nach Zion fragen, ihr Gesicht dorthin gerichtet. »Kommt, wir wollen uns Jahwe anschließen[a] in einem ewigen Bund, der nicht vergessen wird[b].«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kommt, wir wollen mit Jahwe verbunden werden.« Die hebräische Verbform kann sowohl die Nuance „sich anschließen“ als auch „verbunden werden“ haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ein ewiger Bund, der nicht vergessen wird«. Die passive Form nennt nicht, von wem der Bund nicht vergessen wird.'
    reason: ambiguity
lexical_decisions:
- source_word: צִיּוֹן
  choice: Zion
  rationale: Der überlieferte Ortsname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: יִשְׁאָלוּ דֶּרֶךְ
  choice: werden sie nach dem Weg fragen
  rationale: Das Qal-Imperfekt beschreibt im prophetischen Zusammenhang die künftige Handlung; die konkrete Wegfrage bleibt erhalten.
- source_word: הֵנָּה פְנֵיהֶם
  choice: dorthin das Gesicht gewandt
  rationale: Die Richtungsangabe und das anschauliche Bild des hebräischen Ausdrucks werden knapp und idiomatisch wiedergegeben. Der kollektive Singular »das Gesicht« entspricht deutschem Sprachgebrauch.
- source_word: בֹּאוּ
  choice: Kommt
  rationale: Der Qal-Imperativ Plural eröffnet eine direkte gegenseitige Aufforderung.
- source_word: וְנִלְווּ
  choice: lasst uns … anschließen
  rationale: Das Niphal von לוה kann reflexiv »sich anschließen« oder passiv »verbunden werden« bedeuten. Im Anschluss an den Imperativ liegt eine auffordernde Wiedergabe nahe.
- source_word: אֶל יְהוָה
  choice: Jahwe
  rationale: Die Präposition wird durch das deutsche Verb »sich jemandem anschließen« ausgedrückt; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: בְּרִית עוֹלָם
  choice: in einem ewigen Bund
  rationale: »Bund« bewahrt den theologischen und relationalen Gehalt von בְּרִית; עוֹלָם bezeichnet hier unbegrenzte beziehungsweise dauerhafte Geltung.
- source_word: לֹא תִשָּׁכֵחַ
  choice: der nicht vergessen werden wird
  rationale: Die feminine Niphalform bezieht sich auf »Bund« und wird in ihrer passiven, zukünftigen Aussage bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Stimme und Nuance von וְנִלְווּ
  choice: lasst uns Jahwe anschließen
  alternative: lasst uns mit Jahwe verbunden werden
  rationale: Die reflexive Wiedergabe passt zur gegenseitigen Aufforderung, ohne die grammatisch mögliche passive Nuance zu verschweigen; diese wird in der Fußnote genannt.
- issue: Nichtvergessen des ewigen Bundes
  choice: der nicht vergessen werden wird
  alternative: den wir nicht vergessen werden
  rationale: Der hebräische Text formuliert passiv und nennt den Handelnden nicht. Die Übersetzung legt daher nicht fest, ob Menschen oder Gott als impliziter Bezug gedacht sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar markiert; das konkrete Bild des nach Zion gerichteten Gesichts und die grammatische Offenheit der passiven Aussagen bleiben erhalten.
