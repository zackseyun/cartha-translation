source:
  edition: WLC
  text: וְ/הָיְתָ֥ה כַשְׂדִּ֖ים לְ/שָׁלָ֑ל כָּל שֹׁלְלֶ֥י/הָ יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
translation:
  language: de
  text: Und Chaldäa wird zur Beute werden[a]; alle, die sie plündern, werden satt werden[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Chaldäer“. Die hebräische Form ist pluralisch, bezeichnet hier aber wahrscheinlich Chaldäa als Land oder politische Macht; darauf weist auch die folgende feminine Rückverweisung hin.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden gesättigt werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Und ... wird ... werden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang Zukunfts- bzw. Ergebnisbedeutung. Die Formulierung beschreibt den Übergang in einen neuen Zustand.
- source_word: כַשְׂדִּים
  choice: Chaldäa
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet sie hier wahrscheinlich das Land bzw. die politische Größe Chaldäa; dafür spricht das folgende feminine Singularsuffix.
- source_word: לְשָׁלָל
  choice: zur Beute
  rationale: Die Wendung gibt die prädikative Konstruktion knapp und idiomatisch wieder und passt zum militärischen Kontext.
- source_word: כָּל שֹׁלְלֶיהָ
  choice: alle, die es plündern
  rationale: Der Partizipialausdruck bezeichnet die plündernden Akteure. Das deutsche Pronomen „es“ nimmt das grammatisch sächliche „Chaldäa“ auf, während das Hebräische ein feminines Suffix verwendet.
- source_word: יִשְׂבָּעוּ
  choice: werden sich satt nehmen
  rationale: Das Verb bedeutet „satt werden, Befriedigung finden“. Im Zusammenhang mit Beute vermittelt „sich satt nehmen“ sowohl Fülle als auch die aktive Aneignung, ohne den Bildgehalt völlig aufzulösen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird substantivisch und würdevoll wiedergegeben; der Gottesname erscheint entsprechend dem hebräischen Text als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen im modernen deutschen Bibelstil direkt wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Referenz von כַשְׂדִּים
  choice: Chaldäa als Land bzw. politische Größe
  alternative: die Chaldäer als Volk
  rationale: Die feminine Rückverweisung in שֹׁלְלֶיהָ und die Aussage, zur Beute zu werden, stützen die territoriale bzw. kollektive Lesart. Da die Form selbst pluralisch ist, wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzführung. „Zur Beute werden“ ist idiomatisch, während „Ausspruch Jahwes“ die formelhafte Schlusswendung sichtbar erhält. Die Fußnoten bewahren die morphologische Mehrdeutigkeit von כַשְׂדִּים und die Bedeutungsbreite von שׂבע.
