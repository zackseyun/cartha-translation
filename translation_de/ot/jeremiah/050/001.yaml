id: JER.50.1
reference: Jeremiah 50:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל בָּבֶ֖ל אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
translation:
  language: de
  text: 'Das Wort, das Jahwe über Babel[a], über das Land der Chaldäer, durch den Propheten Jeremia sprach:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen Babel, gegen das Land der Chaldäer«. Die hebräische Präposition kann ein gegen ein Volk gerichtetes Prophetenwort einleiten, bezeichnet hier möglicherweise aber allgemeiner dessen Gegenstand.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. In der prophetischen Überschrift bewahrt »das Wort« die formelhafte und feierliche Ausdrucksweise.
- source_word: דִּבֶּר
  choice: sprach
  rationale: Die Grundbedeutung von דבר wird direkt und im Deutschen idiomatisch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen übliche wissenschaftliche Umschrift.
- source_word: אֶל בָּבֶל אֶל אֶרֶץ כַּשְׂדִּים
  choice: über Babel, über das Land der Chaldäer
  rationale: אֶל bezeichnet hier in einer prophetischen Überschrift wahrscheinlich den Gegenstand des Wortes. »Über« erhält die mögliche Neutralität, während »gegen« den Gerichtssinn ausdrücklich machen würde.
- source_word: בְּיַד
  choice: durch
  rationale: Wörtlich »durch die Hand von«; die Wendung bezeichnet die vermittelnde Person oder den Beauftragten. »Durch« gibt diese Funktion in natürlichem modernem Deutsch wieder.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: den Propheten Jeremia
  rationale: Die deutsche Wortstellung verbindet Amtsbezeichnung und Namen natürlich und gibt die Apposition vollständig wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Die Umschrift »Jahwe« bewahrt ihn als Namen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von אֶל in der prophetischen Überschrift
  choice: über Babel, über das Land der Chaldäer
  alternative: gegen Babel, gegen das Land der Chaldäer
  rationale: Der Zusammenhang ist ein Gerichtswort, doch die Präposition kann in einer Überschrift allgemeiner das Thema bezeichnen. Die Hauptfassung löst diese genuine Mehrdeutigkeit nicht einseitig auf; die gerichtete beziehungsweise feindliche Lesart steht in der Fußnote.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die prophetische Formel »Das Wort, das Jahwe … sprach« bleibt erkennbar. Das hebräische Vermittlungsidiom »durch die Hand Jeremias« wird zugunsten des natürlichen deutschen »durch den Propheten Jeremia« funktional wiedergegeben.
