base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
translation:
  language: de
  text: Ruft gegen Babylon viele zusammen, alle, die den Bogen spannen! Lagert euch ringsum gegen sie; niemand soll entkommen.[a] Vergeltet ihr nach ihrem Tun; tut ihr ebenso, wie sie gehandelt hat! Denn sie hat sich gegen Jahwe vermessen, gegen den Heiligen Israels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kein Überlebender soll bleiben“ beziehungsweise „Kein entkommener Rest soll bleiben“. Das hebräische Wort פְּלֵטָה kann die Flucht oder diejenigen bezeichnen, die entkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמִיעוּ אֶל־בָּבֶל רַבִּים
  choice: Ruft viele gegen Babylon zusammen
  rationale: Das Hifil von שמע bezeichnet hier im militärischen Zusammenhang den Aufruf beziehungsweise das Zusammenrufen von Angreifern. Die Formulierung gibt den kausativen Sinn idiomatisch wieder.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: alle, die den Bogen spannen
  rationale: Wörtlich sind diejenigen gemeint, die den Bogen treten beziehungsweise spannen, also Bogenschützen. Die Wiedergabe bewahrt das konkrete militärische Bild.
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  choice: Lagert euch ringsum gegen sie
  rationale: Der pluralische Imperativ beschreibt die vollständige militärische Einschließung Babylons. „Gegen sie“ erhält die feindliche Stoßrichtung von עָלֶיהָ.
- source_word: אַל־יְהִי פְּלֵטָה
  choice: niemand soll entkommen
  rationale: פְּלֵטָה kann die Flucht, Rettung oder die entkommene Person beziehungsweise Restgruppe bezeichnen. Die persönliche Formulierung ist im Deutschen natürlich und bleibt im Kontext der Belagerung nahe am Sinn.
- source_word: שַׁלְּמוּ לָהּ כְּפָעֳלָהּ
  choice: Vergeltet ihr nach ihrem Tun
  rationale: Das Piel von שלם bezeichnet hier angemessene Vergeltung. „Tun“ gibt פֹּעַל verständlich wieder und hält den Gedanken entsprechender Gegenleistung fest.
- source_word: כְּכֹל אֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: tut ihr genauso, wie sie selbst gehandelt hat
  rationale: Die Wiedergabe erhält die Wiederholung des Handelns und den reziproken Vergeltungsgedanken, ohne im Deutschen unnötig hölzern zu klingen.
- source_word: זָדָה
  choice: hat sich vermessen
  rationale: Das Verb bezeichnet stolzes, anmaßendes oder vermessenes Handeln. „Sich vermessen gegen“ bringt sowohl die Überheblichkeit als auch die feindliche Ausrichtung zum Ausdruck.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Die feste prophetische Gottesbezeichnung wird in ihrer geläufigen und würdevollen deutschen Form bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ wahrt dessen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פְּלֵטָה im Gerichtswort
  choice: niemand soll entkommen
  alternative: kein Überlebender soll bleiben / kein entkommener Rest soll bleiben
  rationale: Im Zusammenhang der vollständigen militärischen Umzingelung liegt der Akzent auf verhindertem Entkommen. Die mögliche Bedeutung eines Überlebenden oder entkommenen Restes wird in der Fußnote offengehalten.
- issue: Art der Vergeltung
  choice: Entsprechende Vergeltung für Babylons eigenes Handeln
  alternative: Allgemeine Bestrafung ohne ausdrückliche Entsprechung
  rationale: Die doppelte Formulierung „nach ihrem Tun“ und „wie sie selbst gehandelt hat“ betont im Hebräischen ausdrücklich die Entsprechung zwischen Tat und Vergeltung.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter prophetischer Befehlsfolge. Die weiblichen Pronomen beziehen sich auf die als Stadt personifizierte Größe Babylon. Die militärische Bildsprache und die hebräische Wiederholung beim Vergeltungsgedanken bleiben erkennbar.
