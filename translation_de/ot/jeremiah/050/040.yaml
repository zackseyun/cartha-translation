  - severity: medium
    issue: »sich aufhalten« für יָגוּר
    rationale: Die Formulierung kann eine bloß zeitweilige Anwesenheit meinen. Im Parallelismus der Verwüstungsformel ist das Nichtwohnen bzw. Sichniederlassen gemeint.
  - severity: low
