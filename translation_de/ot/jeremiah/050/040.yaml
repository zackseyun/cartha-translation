  text: כְּ/מַהְפֵּכַ֨ת אֱלֹהִ֜ים אֶת סְדֹ֧ם וְ/אֶת עֲמֹרָ֛ה וְ/אֶת שְׁכֵנֶ֖י/הָ נְאֻם יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/040.yaml
  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
translation:
  language: de
  text: Wie Gott Sodom und Gomorra und die benachbarten Orte umstürzte, spricht Jahwe, so wird dort niemand wohnen, und kein Menschenkind wird sich darin niederlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »ihre Nachbarn« (mit singularischer femininer Endung); gemeint sind wahrscheinlich benachbarte Ortschaften oder Ansiedlungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: Wie damals, als … umstürzte
  rationale: Das כְּ kennzeichnet einen Vergleich, und מַהְפֵּכָה bezeichnet eine gewaltsame Umkehrung beziehungsweise Vernichtung. Die verbale Wiedergabe formuliert den Vergleich in natürlichem Deutsch, ohne seine Aussage abzuschwächen.
- source_word: אֱלֹהִים
  choice: Gott
  rationale: אֱלֹהִים bezeichnet hier den einen Gott als Urheber des Gerichts über Sodom und Gomorra.
- source_word: שְׁכֵנֶיהָ
  choice: ihren Nachbarorten
  rationale: Wörtlich steht »ihre Nachbarn«. Im Zusammenhang sind die benachbarten Ortschaften oder Ansiedlungen gemeint; »Nachbarorte« macht diesen räumlichen Bezug knapp und verständlich deutlich.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben; der Gottesname יהוה erscheint als »Jahwe«.
- source_word: יֵשֵׁב
  choice: wird … wohnen
  rationale: ישׁב bedeutet grundsätzlich »sitzen« oder »wohnen« und bezeichnet in dieser Verwüstungsformel das dauerhafte Bewohnen eines Ortes.
- source_word: אִישׁ
  choice: niemand
  rationale: Das wörtliche »kein Mann« hat hier allgemein menschlichen Bezug. »Niemand« gibt die uneingeschränkte Verneinung im heutigen Deutsch natürlich wieder.
- source_word: יָגוּר
  choice: wird sich … aufhalten
  rationale: גור kann »als Fremder weilen«, »sich aufhalten« oder »wohnen« bedeuten. »Sich aufhalten« bewahrt gegenüber dem parallelen »wohnen« die mögliche Nuance eines auch nur vorübergehenden Aufenthalts.
- source_word: בֶּן אָדָם
  choice: Menschenkind
  rationale: Die poetische Wendung bedeutet wörtlich »Sohn des Menschen/Adams« und steht parallel zu אִישׁ. »Menschenkind« bewahrt die bildhafte Form, bleibt aber im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen יהוה. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des Gerichtsvergleichs
  choice: Gott selbst stürzte Sodom, Gomorra und die Nachbarorte um
  alternative: 'unpersönlich: beim Untergang Sodoms und Gomorras'
  rationale: Die Übersetzung erhält אֱלֹהִים ausdrücklich als handelndes Subjekt und wahrt damit die im Ausgangstext ausgesagte göttliche Urheberschaft des Gerichts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der einleitende Vergleich ist idiomatisch als Satzgefüge formuliert. Das feminine Pronomen in »in ihr« bleibt erhalten und verweist im Zusammenhang auf die zuvor angesprochene Stadt beziehungsweise Babylonien als weiblich bezeichnete Größe. Die parallelen Verben werden differenziert wiedergegeben, damit sowohl dauerhaftes Wohnen als auch ein möglicher vorübergehender Aufenthalt ausgeschlossen bleiben.
