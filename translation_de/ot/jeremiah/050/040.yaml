  verdict: revise
  source_fidelity: Der Vergleich und Gottes Handeln sind zutreffend erfasst. »Wie damals« fügt jedoch eine zeitliche Bestimmung hinzu, die im Hebräischen nicht ausdrücklich steht. Die Wendung »sich aufhalten« kann zudem bloß vorübergehende Anwesenheit bezeichnen, während גור hier in der Verwüstungsformel eher das Sichniederlassen bzw. Wohnen ausdrückt.
  naturalness: Die Satzfügung mit »Wie damals, als …, so wird …« ist verständlich, aber unnötig schwerfällig. Die revidierte Fassung ist modernes, würdiges Standarddeutsch und wahrt den poetischen Parallelismus.
  terminology: »Jahwe« gibt יהוה angemessen wieder. »Menschenkind« ist als poetische Wiedergabe von בן־אדם möglich; »sich niederlassen« gibt die Residenz-/Wohnnuance von גור besser wieder als »sich aufhalten«. Die Fußnote zu den Nachbarorten muss die singularische hebräische Possessivendung nicht durch eine unmarkierte pluralische Paraphrase ersetzen.
