  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext vorhandene Zeitangabe, formuliert den Vergleich unmittelbar und gibt die zweite Verbwendung als Niederlassen/Wohnen wieder. Die Fußnote dokumentiert sowohl die wörtliche Form als auch die kontextuelle Deutung der »Nachbarn«, ohne die grammatische Singularform zu verwischen.
