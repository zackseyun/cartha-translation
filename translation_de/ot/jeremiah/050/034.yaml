source:
  edition: WLC
  text: גֹּאֲלָ֣/ם חָזָ֗ק יְהוָ֤ה צְבָאוֹת֙ שְׁמ֔/וֹ רִ֥יב יָרִ֖יב אֶת רִיבָ֑/ם לְמַ֨עַן֙ הִרְגִּ֣יעַ אֶת הָ/אָ֔רֶץ וְ/הִרְגִּ֖יז לְ/יֹשְׁבֵ֥י בָבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
translation:
  language: de
  text: Ihr Erlöser ist stark[a]; Jahwe der Heere[b] ist sein Name. Er wird ihre Rechtssache mit Nachdruck vertreten[c], um der Erde[d] Ruhe zu verschaffen, den Bewohnern Babels aber Unruhe zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Löser als naher Angehöriger ist stark.“ Das hebräische Wort bezeichnet jemanden, der als naher Angehöriger für die Befreiung, das Recht oder die Wiederherstellung eines Verwandten eintritt.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell auch: „Jahwe Zebaot“ oder „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Er wird ganz gewiss für ihre Sache streiten.“ Im Hebräischen werden Verb und Substantiv für Rechtsstreit wiederholt, um die Aussage zu verstärken.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „dem Land“.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּאֲלָם
  choice: ihr Erlöser
  rationale: גאל bezeichnet jemanden, der als Löser, Befreier oder Rechtsbeistand für einen Angehörigen eintritt. „Erlöser“ ist im Deutschen knapp und verständlich; die familiär-rechtliche Komponente wird in einer Fußnote offengehalten.
- source_word: חָזָק
  choice: stark
  rationale: Das Adjektiv bezeichnet unmittelbar Stärke oder Macht. „Stark“ gibt den einfachen Sinn natürlich wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heere
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „der Heere“ macht den konkreten Sinn von צְבָאוֹת transparent und bewahrt den Titel des göttlichen Kriegsherrn.
- source_word: רִיב יָרִיב אֶת רִיבָם
  choice: Er wird ihren Rechtsstreit ganz gewiss führen
  rationale: Verb und Substantiv aus ריב bezeichnen einen Streit mit rechtlicher Färbung. Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; „ganz gewiss“ bildet diese Betonung ab.
- source_word: הִרְגִּיעַ אֶת הָאָרֶץ
  choice: der Erde Ruhe verschaffen
  rationale: Der Hifil von רגע bezeichnet hier das Herbeiführen von Ruhe. הָאָרֶץ kann „Erde“ oder „Land“ bedeuten; „Erde“ passt zum weit gefassten Kontrast mit Babel, ohne die Alternative auszuschließen.
- source_word: וְהִרְגִּיז לְיֹשְׁבֵי בָבֶל
  choice: den Bewohnern Babels aber Unruhe bringen
  rationale: Der Hifil von רגז kann Erschütterung, Zittern oder Unruhe verursachen bedeuten. „Unruhe bringen“ bildet den beabsichtigten Gegensatz zur Ruhe der Erde natürlich ab; „aber“ macht diesen im Hebräischen angelegten Gegensatz auf Deutsch deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Räumlicher Umfang von הָאָרֶץ
  choice: die Erde
  alternative: das Land
  rationale: Beide Bedeutungen sind lexikalisch möglich. Im Gerichtswort über Babel legt die Ruhe für die Erde im Gegensatz zur Unruhe der Bewohner Babels die weitere Bedeutung nahe; die engere Lesart bleibt in der Fußnote erhalten.
- issue: Rechtlicher oder allgemeiner Sinn von ריב
  choice: ihren Rechtsstreit führen
  alternative: für ihre Sache streiten
  rationale: Die Wortwiederholung und der Kontext der Rechtsschaffung tragen eine forensische Färbung. Die Alternative bewahrt den möglichen allgemeineren Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den feierlichen prophetischen Ton, während „Rechtsstreit führen“, „Ruhe verschaffen“ und „Unruhe bringen“ für heutige Leser verständlich bleiben. „Babel“ folgt der im Alten Testament geläufigen deutschen Namensform.
