  text: פָּתַ֤ח יְהוָה֙ אֶת א֣וֹצָר֔/וֹ וַ/יּוֹצֵ֖א אֶת כְּלֵ֣י זַעְמ֑/וֹ כִּי מְלָאכָ֣ה הִ֗יא לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/אֶ֥רֶץ כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
translation:
  language: de
  text: Jahwe hat sein Vorratshaus geöffnet und die Waffen seines Zorns[a][b] herausgeholt; denn es ist ein Werk für den Herrn, Jahwe der Heerscharen, im Land der Chaldäer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Schatzkammer“; im militärischen Zusammenhang auch: „sein Waffenlager“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Geräte“ beziehungsweise „die Werkzeuge seines Zorns“. Das hebräische Wort kann allgemein Gegenstände oder Ausrüstung bezeichnen; hier liegt eine militärische Bedeutung nahe.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „im Land Chaldäa“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: hat … geöffnet
  rationale: Das Qatal beschreibt die Handlung als vollzogen; das deutsche Perfekt wirkt im Zusammenhang natürlich und lebendig.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֹצָרוֹ
  choice: sein Vorratshaus
  rationale: אוֹצָר bezeichnet allgemein einen Vorrats- oder Schatzraum. „Vorratshaus“ bewahrt das Bild, ohne den Inhalt vorschnell auf ein Waffenlager einzuengen.
- source_word: וַיּוֹצֵא
  choice: und … herausgeholt
  rationale: Das Verb bezeichnet das Herausbringen; „herausgeholt“ passt natürlich zum zuvor geöffneten Vorratshaus.
- source_word: כְּלֵי זַעְמוֹ
  choice: die Waffen seines Zorns
  rationale: כְּלִי kann Geräte, Werkzeuge oder Waffen bezeichnen. Der militärische Gerichtskontext legt „Waffen“ nahe, während eine Fußnote die weitere Bedeutung offenhält.
- source_word: מְלָאכָה הִיא לַאדֹנָי
  choice: der Herr … hat … ein Werk zu tun
  rationale: Die hebräische Nominalkonstruktion besagt idiomatisch, dass für den Herrn eine Aufgabe bzw. ein Werk ansteht. Diese Wiedergabe ist natürlich und wahrt den Zweck- bzw. Zuordnungscharakter.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr, Jahwe der Heerscharen
  rationale: Die beiden göttlichen Bezeichnungen bleiben unterscheidbar; „Heerscharen“ bewahrt die umfassende und bewusst mehrdeutige Bedeutung von צְבָאוֹת besser als das enger militärische „Armeen“.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: im Land der Chaldäer
  rationale: Dies entspricht unmittelbar der ethnischen Formulierung des Hebräischen.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: der Herr, Jahwe
  alternative: Gott, der HERR; der Herr HERR
  rationale: „Der Herr, Jahwe“ gibt sowohl den Titel אֲדֹנָי als auch den Eigennamen יְהוִה wieder, ohne den Namen zu verdecken oder eine unnatürliche Verdopplung zu erzeugen.
- issue: Bedeutungsumfang von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Armeen
  rationale: „Heerscharen“ lässt offen, ob vor allem himmlische oder irdische Heere beziehungsweise ihre Gesamtheit gemeint sind, und vermeidet eine unnötige Verengung.
- issue: Art des göttlichen Handelns in מְלָאכָה
  choice: ein Werk zu tun
  alternative: eine Aufgabe; ein Vernichtungswerk
  rationale: „Werk“ bewahrt die sachliche Offenheit des hebräischen Wortes; der Gerichtskontext bestimmt seinen Charakter, ohne dass dieser im Lexem selbst ausdrücklich auf Vernichtung festgelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt hält die eröffnenden Handlungen lebendig; der zweite Satzteil wird idiomatisch formuliert. Die traditionellen Begriffe „Zorn“ und „Heerscharen“ bleiben wegen ihrer inhaltlichen Tragweite erhalten und werden durch Fußnoten erläutert.
