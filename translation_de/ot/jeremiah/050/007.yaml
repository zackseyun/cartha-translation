source:
  edition: WLC
  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
translation:
  language: de
  text: 'Alle, die sie fanden, verschlangen sie, und ihre Gegner sagten: »Wir laden keine Schuld auf uns, denn sie haben gegen Jahwe gesündigt, die Wohnstatt der Gerechtigkeit[a], die Hoffnung ihrer Vorfahren[b] – Jahwe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Weide der Gerechtigkeit«. Das hebräische Wort kann eine Weide, einen Aufenthaltsort oder eine Wohnstatt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »die Erwartung ihrer Vorfahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצְאֵיהֶם
  choice: alle, die sie fanden
  rationale: Das substantivisch gebrauchte Partizip bezeichnet alle, die auf sie stießen; die Formulierung ist im Deutschen natürlich und eng am Hebräischen.
- source_word: אֲכָלוּם
  choice: verschlangen sie
  rationale: Das Verb bedeutet wörtlich »essen«, beschreibt hier aber bildhaft die vernichtende Gewalt der Feinde. »Verschlangen« bewahrt dieses Bild.
- source_word: צָרֵיהֶם
  choice: ihre Gegner
  rationale: צָר bezeichnet feindlich gesinnte Widersacher. »Gegner« ist verständlich und legt den Ausdruck nicht unnötig auf militärische Feinde fest.
- source_word: לֹא נֶאְשָׁם
  choice: Wir laden keine Schuld auf uns
  rationale: Die Verbform bezeichnet das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld. Diese Wiedergabe erhält gegenüber dem bloßen Zustandsurteil »Wir sind nicht schuldig« die verbale Nuance.
- source_word: תַּחַת אֲשֶׁר
  choice: denn
  rationale: Die Verbindung führt die von den Gegnern angeführte Begründung ein. »Denn« gibt diese argumentative Funktion in natürlichem Deutsch wieder.
- source_word: חָטְאוּ לַיהוָה
  choice: sie haben gegen Jahwe gesündigt
  rationale: חטא mit ל bezeichnet hier das Sündigen gegen jemanden; das deutsche Perfekt passt zur direkten Rede und zum vorausgesetzten Geschehen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נְוֵה צֶדֶק
  choice: die Wohnstätte der Gerechtigkeit
  rationale: נְוֵה kann Weide, Aufenthaltsort oder Wohnstätte bedeuten. Hier ist es als Bezeichnung Jahwes appositionell gebraucht; »Wohnstätte« wahrt die räumliche Metapher, ohne die mögliche Hirtenbildlichkeit ganz auf eine Weide festzulegen.
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  choice: die Hoffnung ihrer Vorfahren
  rationale: מִקְוֶה bedeutet hier am plausibelsten »Hoffnung« beziehungsweise »Erwartung«. »Vorfahren« ist modern und schließt die patriarchale Überlieferung ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יהוה zweimal. »Jahwe« macht diesen Namen sichtbar, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bezug von נְוֵה צֶדֶק und מִקְוֵה אֲבוֹתֵיהֶם
  choice: Beide Wendungen werden als Appositionen zu Jahwe verstanden.
  alternative: נְוֵה צֶדֶק könnte als Bezeichnung des Landes oder der Wohnstätte Israels verstanden werden.
  rationale: Die Abfolge nach »gegen Jahwe gesündigt« und die abschließende Wiederholung des Namens Jahwe sprechen dafür, beide Ausdrücke als Bezeichnungen Gottes zu lesen. Die syntaktische Spannung bleibt durch die appositionelle Zeichensetzung erkennbar.
- issue: Rechtfertigungsbehauptung der Gegner
  choice: Die Aussage wird als ihre eigene Behauptung wiedergegeben, ohne sie als göttliches Urteil zu bestätigen.
  alternative: Wir sind nicht schuldig.
  rationale: Der Redeeinleiter »sie sagten« kennzeichnet die Worte als Selbstrechtfertigung der Gegner. Die Übersetzung wahrt diesen Abstand.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und anklagend. Der Gedankenstrich vor der erneuten Nennung Jahwes bildet den nachgestellten, emphatischen Abschluss des hebräischen Satzes ab.
