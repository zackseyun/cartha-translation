source:
  edition: WLC
  text: מִ/קֶּ֤צֶף יְהוָה֙ לֹ֣א תֵשֵׁ֔ב וְ/הָיְתָ֥ה שְׁמָמָ֖ה כֻּלָּ֑/הּ כֹּ֚ל עֹבֵ֣ר עַל בָּבֶ֔ל יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
translation:
  language: de
  text: Wegen des Zorns Jahwes wird sie nicht bewohnt werden, sondern zu völliger Öde werden. Jeder, der an Babylon vorüberzieht, wird sich entsetzen und über all ihre Wunden zischen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „pfeifen“. Das hebräische Verb kann sowohl „zischen“ als auch „pfeifen“ bezeichnen; hier drückt es wohl Spott oder entsetztes Staunen über Babylons Untergang aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֶּצֶף יְהוָה
  choice: Wegen des Zorns Jahwes
  rationale: מִן bezeichnet hier den Grund für Babylons Schicksal. „Zorn“ bewahrt die Stärke von קֶצֶף; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לֹא תֵשֵׁב
  choice: wird sie unbewohnt bleiben
  rationale: Das feminine Singularverb bezieht sich auf die Stadt Babylon. Im Gerichtskontext bezeichnet ישׁב, dass sie nicht mehr bewohnt sein wird.
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  choice: und völlig verwüstet sein
  rationale: שְׁמָמָה bezeichnet Verödung beziehungsweise Verwüstung; כֻּלָּהּ verstärkt sie zur vollständigen Verwüstung. Die verbale Formulierung klingt im Deutschen natürlich.
- source_word: כֹּל עֹבֵר עַל בָּבֶל
  choice: Jeder, der an Babylon vorüberzieht
  rationale: Die Wendung beschreibt Vorübergehende, die der zerstörten Stadt begegnen.
- source_word: יִשֹּׁם
  choice: wird sich entsetzen
  rationale: Das Qal von שׁמם bezeichnet hier die bestürzte, erschreckte Reaktion auf die Verwüstung.
- source_word: וְיִשְׁרֹק
  choice: und … zischen
  rationale: שרק kann Zischen oder Pfeifen bezeichnen. „Zischen“ erhält die wahrscheinlich spöttische oder erschrockene Reaktion, ohne sie im Haupttext weiter auszudeuten.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: wegen all ihrer Wunden
  rationale: מַכָּה kann Schlag, Wunde oder Plage bedeuten. „Wunden“ bewahrt das Bild der als Frau personifizierten Stadt und bezeichnet die ihr zugefügten Schäden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Personifizierung Babylons
  choice: weibliche Pronomen „sie“ und „ihrer“
  alternative: sächliche Wiedergabe mit „es“ und „seiner“
  rationale: Die femininen Formen des Hebräischen stellen Babylon als personifizierte Stadt dar; die deutsche Wiedergabe bewahrt dies.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt nahe am Hebräischen, wird aber idiomatisch formuliert; die Mehrdeutigkeit von שרק wird durch eine Fußnote erhalten.
