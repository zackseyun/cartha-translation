- from: Wegen des Zorns Jahwes wird sie unbewohnt bleiben und völlig verwüstet sein. Jeder, der an Babylon vorüberzieht, wird sich entsetzen und wegen all ihrer Wunden zischen[a].
  to: Wegen des Zorns Jahwes wird sie nicht bewohnt werden, sondern zu völliger Öde werden. Jeder, der an Babylon vorüberzieht, wird sich entsetzen und über all ihre Wunden zischen[a].
  rationale: Die Revision stellt die Zukunftsaussagen des Hebräischen klarer heraus und gibt die totale Verödung mit „zu völliger Öde werden“ wieder. „Über“ bewahrt bei der abschließenden Reaktion die relationale Bildsprache von עַל. Die lexikalische Mehrdeutigkeit von שרק bleibt durch die Fußnote offen.
