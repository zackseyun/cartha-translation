  source_fidelity: Der Grund („Wegen des Zorns Jahwes“), die Nichtbewohnbarkeit, die völlige Verwüstung, die Reaktion der Vorübergehenden und das Bild von Babylons „Wunden“ sind zutreffend erfasst. „Unbewohnt bleiben“ und „völlig verwüstet sein“ schwächen jedoch die futurische Aussage von לֹא תֵשֵׁב וְהָיְתָה ... und geben das Werden zur völligen Öde weniger genau wieder. Die Präposition עַל ist mit „über“ näher wiederzugeben als mit dem kausalen „wegen“.
  naturalness: Die Sprache ist überwiegend klares modernes Standarddeutsch. „Nicht bewohnt werden“ und „zu völliger Öde werden“ sind hier präziser und zugleich natürlich. Die Verbindung „über all ihre Wunden zischen“ bewahrt die bildhafte, prophetische Ausdrucksweise; die Fußnote erläutert die mögliche Lesart „pfeifen“.
  terminology: „Jahwe“ gibt יהוה konsequent wieder. „Zorn“, „Öde“ und „Wunden“ passen zum hebräischen Wortlaut und zum prophetischen Register. Die weiblichen Bezüge auf Babylon bleiben erhalten.
