  source_fidelity: 'Der Entwurf gibt die Satzglieder, die Wiederholung von אִם־לֹא als Bekräftigung und das Herdenbild im Wesentlichen zutreffend wieder. Im letzten Satzteil glättet „ihren Weideplatz wird er verwüsten“ jedoch die schwierige Konstruktion יַשִּׁים עֲלֵיהֶם נָוֶה zu stark: עֲלֵיהֶם ist nicht einfach ein Possessivpronomen. Eine deutsche Wiedergabe sollte die Beziehung „über sie“ und die daraus hervorgehende Unsicherheit sichtbar lassen.'
  naturalness: „Darum“, „Ratschluss Jahwes“, „gegen Babel gefasst“, „ersonnen“ und „fortschleppen“ sind modernes, würdiges Standarddeutsch. „die Kleinen der Herde“ bewahrt das Bild verständlich. Die Umstellung im Schlussteil ergibt eine natürliche deutsche Satzfolge, ohne dessen schwierige hebräische Syntax zu verschleiern.
  terminology: „Jahwe“, „Babel“, „Chaldäer“, „Ratschluss“ und „Gedanken“ sind konsistent und angemessen. „Weideplatz“ ist als mögliche Bedeutung von נָוֶה vertretbar. Die bisherige Fußnote c sollte jedoch nicht „ihretwegen“ als gleichwertige Übersetzung von עֲלֵיהֶם ausgeben; sie muss die Konstruktion genauer als „über sie“ beziehungsweise als Deutungsproblem erläutern.
