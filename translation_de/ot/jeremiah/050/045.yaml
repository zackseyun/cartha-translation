  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל בָּבֶ֔ל וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נָוֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
translation:
  language: de
  text: 'Darum hört den Ratschluss Jahwes, den er gegen Babel gefasst hat, und seine Gedanken, die er gegen das Land der Chaldäer ersonnen hat: Wahrlich, die Kleinen der Herde[a] werden sie fortschleppen; wahrlich, über sie wird er ihren Weideplatz[b][c] verwüsten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Geringsten der Herde“ oder „die Jungen der Herde“. Gemeint sind wahrscheinlich bildlich die schwächsten oder unbedeutendsten unter Babylons Angreifern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Wohnstätte“. Das hebräische Wort kann einen Weideplatz, eine Wohnstätte oder einen Aufenthaltsort bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Die hebräische Satzfügung ist schwierig. Wörtlich steht etwa: „über sie wird er Weideplatz/Wohnstätte machen“; die Wiedergabe versteht dies im Gerichtskontext als Verwüstung, die über sie kommt.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus dem vorangehenden Gerichtswort ein; „Darum“ ist knapp und idiomatisch.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Pluralimperativ bewahrt den prophetischen Aufruf und schließt aufmerksames Zuhören ein.
- source_word: עֲצַת יְהוָה
  choice: den Ratschluss Jahwes
  rationale: „Ratschluss“ gibt sowohl den beratenden als auch den planenden Sinn von עֵצָה wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: יָעַץ אֶל־בָּבֶל
  choice: den er gegen Babel gefasst hat
  rationale: Im feindlichen Gerichtskontext hat אֶל die Richtung „gegen“; „einen Ratschluss fassen“ ist im Deutschen eine natürliche Verbindung.
- source_word: וּמַחְשְׁבוֹתָיו אֲשֶׁר חָשַׁב
  choice: und seine Gedanken, die er … ersonnen hat
  rationale: „Gedanken“ bewahrt die lexikalische Unterscheidung zu עֵצָה; „ersonnen“ drückt überlegtes Planen aus, ohne denselben deutschen Wortstamm zu wiederholen.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: das Land der Chaldäer
  rationale: Dies bildet die hebräische Wendung transparent ab und vermeidet die geografische Kurzform „Chaldäa“.
- source_word: אִם לֹא
  choice: Wahrlich
  rationale: Die zweimalige Wendung ist hier keine gewöhnliche Bedingung, sondern eine nachdrückliche, eidartige Bekräftigung.
- source_word: יִסְחָבוּם
  choice: werden sie fortschleppen
  rationale: Das Verb bezeichnet gewaltsames Ziehen oder Schleppen; Subjekt und pluralisches Objekt bleiben erhalten.
- source_word: צְעִירֵי הַצֹּאן
  choice: die Kleinen der Herde
  rationale: Die konkrete Herdenmetapher und die Mehrdeutigkeit zwischen klein, jung und gering werden im Haupttext möglichst weit bewahrt.
- source_word: יַשִּׁים עֲלֵיהֶם נָוֶה
  choice: ihren Weideplatz wird er verwüsten
  rationale: Die schwierige Konstruktion wird gemäß dem Gerichtskontext resultativ verstanden; עֲלֵיהֶם wird idiomatisch als Zugehörigkeit wiedergegeben, während נָוֶה zunächst als Weideplatz erscheint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung der Kleinen der Herde
  choice: Die Metapher bleibt im Haupttext stehen.
  alternative: die unbedeutendsten beziehungsweise schwächsten Angreifer
  rationale: Der Kontext legt eine metaphorische Bezeichnung gering erscheinender Angreifer nahe, doch der hebräische Text benennt diese Deutung nicht ausdrücklich.
- issue: Subjekt im letzten Teilsatz
  choice: „er“ bezieht sich auf Jahwe
  alternative: unpersönliche oder anders syntaktisch gefasste Wiedergabe der schwierigen Verbform
  rationale: Die Wiederaufnahme des göttlichen Handelns passt zum Parallelismus und zur überlieferten Lesart, ohne die lexikalische Unsicherheit der gesamten Konstruktion zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Nachdruck. Der parallele Satzbau, die zweimalige Bekräftigung „Wahrlich“ und das Herdenbild bleiben erhalten; schwer verständliche lexikalische und syntaktische Alternativen werden in Fußnoten ausgewiesen.
