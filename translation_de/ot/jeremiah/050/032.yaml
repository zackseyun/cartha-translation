source:
  edition: WLC
  text: וְ/כָשַׁ֤ל זָדוֹן֙ וְ/נָפַ֔ל וְ/אֵ֥ין ל֖/וֹ מֵקִ֑ים וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה כָּל סְבִיבֹתָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
translation:
  language: de
  text: Der Hochmütige wird straucheln und fallen[a], und niemand wird ihn aufrichten. Ich werde in seinen Städten[b] ein Feuer entfachen, und es wird alles rings um ihn verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Hochmut« oder »die Vermessenheit«. Das hebräische Wort זָדוֹן ist häufig abstrakt; hier wird es wegen der folgenden Verben und Pronomen im maskulinen Singular persönlich wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in seinen Städten«. Babylon wird in diesem Vers als männliche Einzelgestalt personifiziert.'
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  choice: der Hochmütige
  rationale: Das Substantiv kann abstrakt „Hochmut“ oder „Vermessenheit“ bedeuten. Hier sprechen die folgenden Verben und Pronomen im maskulinen Singular für eine personifizierte Wiedergabe; „der Hochmütige“ ist im Deutschen natürlich und bewahrt diesen persönlichen Bezug.
- source_word: כָשַׁל
  choice: wird straucheln
  rationale: Das Qatal bezeichnet im prophetischen Gerichtswort das angekündigte Ergebnis. „Straucheln“ erhält das Bild und bildet mit „fallen“ die hebräische Steigerung ab.
- source_word: נָפַל
  choice: und fallen
  rationale: Die koordinierte Wiedergabe bewahrt die Abfolge von Straucheln und endgültigem Sturz.
- source_word: מֵקִים
  choice: ihn aufrichten
  rationale: Das Hifil-Partizip von קום bezeichnet hier, dass jemand den Gestürzten wieder aufstehen lässt. „Aufrichten“ bewahrt dieses Bild, ohne es als politische Wiederherstellung auszudeuten.
- source_word: הִצַּתִּי אֵשׁ
  choice: Ich werde … Feuer entfachen
  rationale: Die Wendung bezeichnet das Anzünden eines Feuers. Das Futur entspricht dem prophetischen Gerichtszusammenhang und „Feuer entfachen“ gibt das ausdrücklich genannte אֵשׁ wieder.
- source_word: בְּעָרָיו
  choice: in seinen Städten
  rationale: Das Suffix steht im maskulinen Singular. Die Übersetzung erhält damit die Personifizierung Babylons, auch wenn im Deutschen bei einer Stadt oder einem Reich sonst eine unpersönlichere Form möglich wäre.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: Das feminine Verb bezieht sich auf das Feuer. „Verzehren“ ist im Deutschen eine natürliche und kraftvolle Beschreibung der Wirkung des Feuers.
- source_word: כָּל סְבִיבֹתָיו
  choice: alles rings um ihn
  rationale: Die Formulierung gibt die Gesamtheit dessen wieder, was ihn umgibt, und bewahrt zugleich den maskulinen Singular der Personifizierung.
theological_decisions:
- issue: Personifizierung Babylons durch maskuline Singularformen
  choice: 'Maskulinen persönlichen Bezug beibehalten: „der Hochmütige … ihn … seinen Städten“'
  alternative: Abstrakt „der Hochmut“ oder unpersönlich auf Babylon bezogen formulieren
  rationale: Die hebräische Grammatik stellt Babylon beziehungsweise den Hochmut als eine einzelne männlich personifizierte Gestalt dar. Diese Bildsprache wird bewahrt, ohne die mögliche abstrakte Bedeutung von זָדוֹן zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallelen Verben „straucheln und fallen“ sowie die Feuerbildsprache bleiben eng am Hebräischen; die Satzstruktur ist zugleich natürlich deutsch.
