id: JER.50.33
reference: Jeremiah 50:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Die Israeliten und die Judäer werden gleichermaßen unterdrückt.[a] Alle, die sie gefangen genommen haben, halten sie fest; sie weigern sich, sie freizulassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Die Söhne Israels und die Söhne Judas werden gemeinsam unterdrückt.“'
    reason: Bewahrt die formnähere Wiedergabe der Volksbezeichnungen und von יַחְדָּו.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Prophetenformel gibt die hebräische Einleitungsformel knapp, würdig und unmittelbar wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ bewahrt die breite Bedeutung von צְבָאוֹת und die traditionelle Würde des Titels.
- source_word: עֲשׁוּקִים
  choice: werden … unterdrückt
  rationale: Das passive Partizip beschreibt die andauernde Lage beider Volksgruppen; die deutsche Verlaufsformulierung klingt natürlicher als „sind unterdrückt“.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: die Israeliten und die Judäer
  rationale: Die modernen Volksbezeichnungen geben die idiomatische Bedeutung der hebräischen Wendungen „Söhne Israels“ und „Söhne Judas“ verständlich wieder, ohne nur die Gebiete zu bezeichnen.
- source_word: יַחְדָּו
  choice: gleichermaßen
  rationale: Das Adverb bezieht beide Gruppen auf denselben Zustand und wird im Deutschen mit dem gemeinsamen Prädikat natürlich als „gleichermaßen“ ausgedrückt.
- source_word: שֹׁבֵיהֶם
  choice: alle, die sie gefangen genommen haben
  rationale: Die Umschreibung gibt das aktive Partizip präzise wieder und bezeichnet diejenigen, die Israel und Juda in Gefangenschaft führten.
- source_word: הֶחֱזִיקוּ בָם
  choice: halten sie fest
  rationale: Die Wendung bezeichnet beharrliches Festhalten beziehungsweise Nichtfreigeben.
- source_word: מֵאֲנוּ שַׁלְּחָם
  choice: sie weigern sich, sie freizulassen
  rationale: Die Formulierung bewahrt die entschiedene Weigerung und gibt שׁלח im Gefangenschaftskontext idiomatisch als Freilassung wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von בְּנֵי bei den Volksbezeichnungen
  choice: Israeliten … Judäer
  alternative: Söhne Israels … Söhne Judas
  rationale: בְּנֵי bildet hier etablierte Bezeichnungen für die Angehörigen der beiden Völker. Die idiomatische Wiedergabe vermeidet im modernen Deutschen die mögliche Fehlvorstellung, nur männliche unmittelbare Nachkommen seien gemeint; die formnähere Fassung bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die prophetische Formel und der Gottesname bleiben markant; die Volksbezeichnungen und die Gefangenschaftssprache werden zugleich unmittelbar verständlich formuliert.
