source:
  edition: WLC
  text: קֶ֣שֶׁת וְ/כִידֹ֞ן יַחֲזִ֗יקוּ אַכְזָרִ֥י הֵ֨מָּה֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
translation:
  language: de
  text: Bogen und Wurfspeer führen sie. Sie sind grausam und erbarmen sich nicht. Ihr Lärm tost wie das Meer. Auf Pferden reiten sie, zum Kampf gegen dich aufgestellt wie ein Mann[a], Tochter Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein einziger Mann“; damit wäre die geschlossene Aufstellung des Heeres betont.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: Bogen
  rationale: Der Singular kann kollektiv bzw. als Waffenbezeichnung verstanden werden; der deutsche Singular bewahrt die knappe militärische Ausdrucksweise.
- source_word: כִידֹן
  choice: Wurfspeer
  rationale: Bezeichnet eine speerartige Stoß- oder Wurfwaffe. „Wurfspeer“ grenzt sie verständlich vom allgemeineren „Speer“ ab, ohne die genaue Bauart zu stark festzulegen.
- source_word: יַחֲזִיקוּ
  choice: führen sie
  rationale: Das Hifil von חזק bezeichnet hier das Ergreifen bzw. Bereithalten von Waffen. „Waffen führen“ ist im Deutschen natürlich und umfasst Halten wie Einsatzbereitschaft.
- source_word: אַכְזָרִי הֵמָּה
  choice: Sie sind grausam
  rationale: Gibt die ausdrücklich beschriebene erbarmungslose Haltung der Angreifer direkt wieder.
- source_word: וְלֹא יְרַחֵמוּ
  choice: und erbarmen sich nicht
  rationale: Bewahrt die verbale Form und den engen Zusammenhang mit der vorausgehenden Charakterisierung.
- source_word: קוֹלָם
  choice: Ihr Lärm
  rationale: קוֹל kann Stimme, Schall oder Geräusch bedeuten. Beim Herannahen eines Heeres und im Vergleich mit dem Meer trifft „Lärm“ den kollektiven, bedrohlichen Klang.
- source_word: כַּיָּם יֶהֱמֶה
  choice: tost wie das Meer
  rationale: Das Verb bezeichnet ein brausendes, dröhnendes oder aufgewühltes Geräusch; „tost“ ist im Deutschen eine anschauliche und idiomatische Verbindung mit dem Meer.
- source_word: וְעַל סוּסִים יִרְכָּבוּ
  choice: Auf Pferden reiten sie
  rationale: Folgt der hebräischen Präposition und behält durch die Voranstellung der Pferde den markanten poetischen Satzbau bei.
- source_word: עָרוּךְ
  choice: aufgestellt
  rationale: Das passive Partizip bezeichnet geordnete Aufstellung bzw. Kampfbereitschaft eines Heeres.
- source_word: כְּאִישׁ
  choice: wie ein Mann
  rationale: Bewahrt den grammatisch maskulinen Singular und die echte Deutungsmöglichkeit des hebräischen Ausdrucks. Die idiomatische Lesart einer geschlossenen Formation wird in der Fußnote genannt.
- source_word: לַמִּלְחָמָה
  choice: zum Kampf
  rationale: Gibt in dieser konkreten militärischen Szene den Zweck der Aufstellung natürlicher wieder als das allgemeinere „zum Krieg“.
- source_word: בַּת בָּבֶל
  choice: Tochter Babel
  rationale: Bewahrt die poetische Personifikation und die direkte Anrede. „Babel“ entspricht der etablierten deutschen biblischen Namensform.
theological_decisions:
- issue: Maskuliner Singular im militärischen Vergleich כְּאִישׁ
  choice: wie ein Mann
  alternative: wie ein einziger Mann
  rationale: Der Haupttext wahrt Form und Bild des Hebräischen, ohne die Wendung vorschnell als Aussage über die einheitliche Formation festzulegen. Diese verbreitete und kontextuell plausible Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen, rhythmischen Sätzen. Die poetische Anrede „Tochter Babel“ und die militärische Bildsprache bleiben erhalten; altertümliche Wendungen werden vermieden.
