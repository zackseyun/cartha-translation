  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
translation:
  language: de
  text: Erhebt ringsum ein Kriegsgeschrei gegen sie! Sie hat sich ergeben[a]. Ihre Grundfesten[b] sind gefallen, ihre Mauern sind niedergerissen. Denn es ist die Rache Jahwes. Nehmt Rache an ihr! Wie sie gehandelt hat, so handelt an ihr!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie hat ihre Hand gegeben.“ Die Wendung bezeichnet hier wahrscheinlich Unterwerfung oder Kapitulation.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort ist unsicher; gemeint sein können auch Stützwerke, Bollwerke, Ecktürme oder andere Teile der Befestigung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  choice: Stoßt ringsum Kriegsgeschrei gegen sie aus!
  rationale: Das Hifil von רוע/ריע bezeichnet im militärischen Zusammenhang einen lauten Kampf- oder Kriegsschrei. „Kriegsgeschrei“ macht den Belagerungskontext deutlich, während „ringsum gegen sie“ das feindliche Umzingeln wiedergibt.
- source_word: נָתְנָה יָדָהּ
  choice: Sie hat ihre Hand gegeben
  rationale: Die wörtliche Wendung bleibt erhalten, weil das Bild im Hebräischen greifbar ist, aber idiomatisch wohl Kapitulation oder Unterwerfung bezeichnet; diese Bedeutung wird in der Fußnote erläutert.
- source_word: אשויתיה
  choice: ihre Grundfesten
  rationale: Das seltene und unsichere Wort bezeichnet im Zusammenhang offenbar tragende oder verteidigende Bauteile. „Grundfesten“ passt zum Fallen und zum Parallelismus mit den Mauern, ohne die architektonische Einzelheit sicherer erscheinen zu lassen, als sie ist.
- source_word: נֶהֶרְסוּ חוֹמוֹתֶיהָ
  choice: ihre Mauern niedergerissen
  rationale: Das Nifal von הרס bezeichnet das Einreißen oder Zerstören. Die knappe elliptische Form bewahrt den gedrängten poetischen Parallelismus.
- source_word: נִקְמַת יְהוָה הִיא
  choice: Denn es ist die Rache Jahwes
  rationale: נקמה wird mit „Rache“ wiedergegeben; die Aussage identifiziert den Untergang Babylons als Jahwes Vergeltung. Der Gottesname יהוה erscheint als „Jahwe“.
- source_word: הִנָּקְמוּ בָהּ
  choice: Nehmt Rache an ihr!
  rationale: Der Nifal-Imperativ fordert die Angreifer dazu auf, an Babylon Vergeltung zu vollziehen.
- source_word: כַּאֲשֶׁר עָשְׂתָה עֲשׂוּ לָהּ
  choice: Wie sie getan hat, so tut ihr!
  rationale: Die knappe deutsche Form erhält die Gegenseitigkeit und den vergeltenden Charakter der hebräischen Aussage, ohne ein Objekt hinzuzufügen.
theological_decisions:
- issue: Bedeutung von נָתְנָה יָדָהּ
  choice: Das wörtliche Bild „sie hat ihre Hand gegeben“ steht im Haupttext.
  alternative: „Sie hat sich ergeben“ oder „sie hat kapituliert“.
  rationale: Die Wendung bezeichnet im Kontext wahrscheinlich die Kapitulation. Die wörtliche Wiedergabe bewahrt jedoch das genuine Bild und vermeidet, seine Bedeutung im Haupttext vollständig festzulegen.
- issue: Deutung des unsicheren Nomens אשויתיה
  choice: „Grundfesten“ im Haupttext mit Hinweis auf die lexikalische Unsicherheit.
  alternative: „Stützwerke“, „Bollwerke“ oder „Ecktürme“.
  rationale: Der Belagerungskontext und der Parallelismus mit den Mauern sprechen für ein tragendes oder befestigendes Bauelement. Da die genaue Referenz unsicher bleibt, werden plausible Alternativen in der Fußnote genannt.
- issue: Darstellung der göttlichen Vergeltung
  choice: „die Rache Jahwes“ und „Nehmt Rache an ihr“.
  alternative: „die Vergeltung Jahwes“ und „Vergeltet es ihr“.
  rationale: Die wiederholte Wortwurzel נקם wird durch die Wiederholung von „Rache“ sichtbar gehalten. Der Text beauftragt die Angreifer mit der Ausführung, ohne die Spannung zwischen göttlicher und menschlicher Handlung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer und militärischer Bildsprache. Die Imperative bleiben scharf, der poetische Parallelismus wird durch kurze Sätze und Ellipse bewahrt.
