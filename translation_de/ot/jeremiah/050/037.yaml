base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
translation:
  language: de
  text: Ein Schwert gegen seine Pferde, gegen seine Streitwagen und gegen das ganze Mischvolk[a] in ihrer Mitte — sie werden zu Frauen werden[b]. Ein Schwert gegen ihre Schatzkammern — sie werden geplündert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle ausländischen Söldner“ oder „die gesamte gemischte Bevölkerung“. Das hebräische Wort bezeichnet hier wahrscheinlich eine gemischte Bevölkerungsgruppe oder fremde Hilfstruppen in Babylon.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie werden zu Frauen werden“. Dies ist eine antike kriegerische Redewendung für Angst und den Verlust von Kampfesmut.'
    reason: cultural_note
lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: Ein Schwert über
  rationale: Die knappe prophetische Gerichtsformel wird im Deutschen idiomatisch mit „ein Schwert über“ wiedergegeben; dies bewahrt sowohl das Bild als auch den elliptischen Orakelstil.
- source_word: סוּסָיו
  choice: seine Pferde
  rationale: Der maskuline Suffixbezug wird formal bewahrt und bezieht sich im Kontext auf Babylon beziehungsweise dessen Herrscher- und Militärmacht.
- source_word: רִכְבּוֹ
  choice: seine Streitwagen
  rationale: Das hebräische Kollektiv bezeichnet hier die Streitwagen beziehungsweise die Streitwagenmacht. „Streitwagen“ ist im militärischen Zusammenhang eindeutig und natürlich.
- source_word: כָּל הָעֶרֶב
  choice: das ganze Mischvolk
  rationale: עֶרֶב bezeichnet wahrscheinlich eine gemischte Bevölkerungsgruppe oder ausländische Hilfstruppen. „Mischvolk“ hält die lexikalische Offenheit aufrecht, ohne die Deutung als Söldner festzuschreiben.
- source_word: בְּתוֹכָהּ
  choice: in ihrer Mitte
  rationale: Das feminine Suffix nimmt Babylon als personifizierte Stadt auf. Der Wechsel vom maskulinen zum femininen Bezug bleibt wie im Hebräischen sichtbar.
- source_word: וְהָיוּ לְנָשִׁים
  choice: sie sollen zu Frauen werden
  rationale: Die Übersetzung bewahrt den ausdrücklichen Wortlaut und die Härte der antiken Kriegsrede. Die idiomatische Bedeutung wird in einer Fußnote erläutert, nicht in den Haupttext eingetragen.
- source_word: אוֹצְרֹתֶיהָ
  choice: ihre Schatzkammern
  rationale: Der Plural bezeichnet Aufbewahrungsorte angesammelten Reichtums. „Schatzkammern“ passt zum folgenden Plündern und ist konkreter als „Schätze“.
- source_word: וּבֻזָּזוּ
  choice: sie sollen geplündert werden
  rationale: Die passive Verbform wird bewahrt; ihr nächstliegender Bezug sind die Schatzkammern.
theological_decisions:
- issue: Geschlechtsspezifische Kriegsrede in לְנָשִׁים
  choice: sie sollen zu Frauen werden
  alternative: sie sollen den Mut verlieren / sie sollen wie Frauen werden
  rationale: Der Haupttext bewahrt die explizite, kulturell geprägte Formulierung des Hebräischen, ohne sie zu neutralisieren oder als zeitlose Aussage über Frauen auszulegen. Die gemeinte Feigheit beziehungsweise der Verlust des Kampfesmuts wird in der Fußnote erläutert.
- issue: Mehrdeutigkeit von הָעֶרֶב
  choice: Mischvolk
  alternative: ausländische Söldner / gemischte Bevölkerung / Hilfstruppen
  rationale: Der Kontext erlaubt sowohl eine ethnisch gemischte Bevölkerungsgruppe als auch fremde militärische Hilfskräfte. Die Übersetzung legt sich nicht enger fest, als der hebräische Ausdruck es verlangt.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knappem, rhythmischem Orakelstil. Die Wiederholung „Ein Schwert über“ und die Ausrufezeichen geben die zugespitzte Gerichtsankündigung wieder. Der im Hebräischen vorhandene Wechsel zwischen maskulinen und femininen Bezügen auf Babylon wird nicht eingeebnet.
