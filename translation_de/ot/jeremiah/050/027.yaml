source:
  edition: WLC
  text: חִרְבוּ֙ כָּל פָּרֶ֔י/הָ יֵרְד֖וּ לַ/טָּ֑בַח ה֣וֹי עֲלֵי/הֶ֔ם כִּֽי בָ֥א יוֹמָ֖/ם עֵ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/027.yaml
  text: Slay all her bulls; let them go down to the slaughter. Woe to them[a], for their day has come, the time of their punishment.
translation:
  language: de
  text: Erschlagt alle ihre Jungstiere; sie sollen zur Schlachtung hinabsteigen. Wehe ihnen! Denn ihr Tag ist gekommen, die Zeit ihrer Bestrafung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Zeit ihrer Heimsuchung“ beziehungsweise „ihrer Abrechnung“. Das hebräische Wort kann ein Aufsuchen zur Prüfung, Rechenschaft oder zum Gericht bezeichnen; hier ist strafendes Gericht gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִרְבוּ
  choice: Erschlagt
  rationale: Der imperative Hifil von חרב bezeichnet hier im Zusammenhang mit Schlachtung gewaltsames Töten. „Erschlagt“ ist prägnant und wahrt den prophetischen Gerichtston.
- source_word: פָּרֶיהָ
  choice: ihre Jungstiere
  rationale: פַּר bezeichnet einen jungen Stier. Die Tiermetapher für die Mächtigen oder Krieger Babylons bleibt erhalten, statt sie im Haupttext auszudeuten.
- source_word: יֵרְדוּ לַטָּבַח
  choice: sie sollen zur Schlachtung hinabsteigen
  rationale: Die Form wird nach dem vorangehenden Imperativ als Jussiv verstanden. „Hinabsteigen“ bewahrt das Bewegungsbild von ירד, „Schlachtung“ die drastische Bildsprache von טבח.
- source_word: הוֹי עֲלֵיהֶם
  choice: Wehe ihnen!
  rationale: Dies ist die natürliche deutsche Entsprechung der prophetischen Wehe- und Klageformel.
- source_word: כִּי בָא יוֹמָם
  choice: Denn ihr Tag ist gekommen
  rationale: Das Perfekt בָא stellt den für sie bestimmten Gerichtstag als eingetroffen dar.
- source_word: עֵת פְּקֻדָּתָם
  choice: die Zeit ihrer Heimsuchung
  rationale: „Heimsuchung“ bewahrt die Bedeutungsbreite von פְּקֻדָּה zwischen Aufsuchen, Rechenschaft und strafendem Gericht; der Kontext legt die strafende Bedeutung nahe, die in der Fußnote erläutert wird.
theological_decisions:
- issue: Wiedergabe des Gerichtsbegriffs פְּקֻדָּה
  choice: Heimsuchung
  alternative: Bestrafung; Abrechnung
  rationale: Der Zusammenhang kündigt Strafgericht über Babylon an. Dennoch wird der mehrdeutige hebräische Begriff nicht vollständig auf „Bestrafung“ verengt; „Heimsuchung“ erhält die traditionelle und theologisch spannungsreiche Vorstellung eines prüfenden beziehungsweise richtenden Eingreifens, während die Fußnote den Kontext verdeutlicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst kräftiger prophetischer Gerichtssprache. Die konkrete Tiermetapher und das Bild des Hinabsteigens zur Schlachtung bleiben erhalten.
