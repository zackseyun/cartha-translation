  register: Modernes, würdiges Standarddeutsch mit prophetisch gehobenem Auftakt. Die Unterscheidung zwischen עַם („Volk“) und גּוֹי („Nation“) bleibt erhalten; die räumliche und verbale Mehrdeutigkeit wird in Fußnoten kenntlich gemacht.
