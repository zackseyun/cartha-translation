source:
  edition: WLC
  text: הִנֵּ֛ה עַ֥ם בָּ֖א מִ/צָּפ֑וֹן וְ/ג֤וֹי גָּדוֹל֙ וּ/מְלָכִ֣ים רַבִּ֔ים יֵעֹ֖רוּ מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
translation:
  language: de
  text: Siehe, ein Volk kommt aus dem Norden, und eine große Nation und viele Könige werden aus den entlegensten Gegenden der Erde[a] aufgerüttelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus den äußersten Bereichen der Erde“ beziehungsweise „von den Enden der Erde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werden aufgeboten“ oder „werden aufgeweckt“. Das hebräische Verb kann hier das Erwecken oder Mobilisieren zum Handeln bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Der Aufmerksamkeitsruf eröffnet die prophetische Ankündigung. „Siehe“ bewahrt den gehobenen Ton, ohne den Satz unnötig auszudeuten.
- source_word: עַם
  choice: ein Volk
  rationale: עַם bezeichnet hier eine Volksgruppe. „Volk“ hält zudem den Ausdruck von dem folgenden גּוֹי גָּדוֹל unterschieden.
- source_word: בָּא
  choice: kommt
  rationale: Das Qal-Perfekt hat nach הִנֵּה eine anschaulich vergegenwärtigende, auf das bevorstehende Geschehen gerichtete Kraft. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: מִצָּפוֹן
  choice: aus dem Norden
  rationale: Die schlichte Richtungsangabe wird im Deutschen idiomatisch und genau wiedergegeben.
- source_word: גּוֹי גָּדוֹל
  choice: eine große Nation
  rationale: גּוֹי kann eine politisch oder ethnisch gefasste Nation bezeichnen. „Nation“ wahrt die lexikalische Unterscheidung zum vorangehenden עַם („Volk“).
- source_word: וּמְלָכִים רַבִּים
  choice: und viele Könige
  rationale: Die direkte Wiedergabe erhält die Mehrzahl der beteiligten Herrscher und klingt im Deutschen natürlich.
- source_word: יֵעֹרוּ
  choice: werden aufgerüttelt
  rationale: Die Nifalform bezeichnet ein Aufgeweckt- oder In-Bewegung-Versetztwerden. „Aufgerüttelt“ wahrt die passive Form und lässt offen, wie genau die Mobilisierung geschieht.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: aus den entlegensten Gegenden der Erde
  rationale: יַרְכְּתֵי bezeichnet abgelegene äußerste Bereiche. Die Formulierung ist verständlich und bewahrt die räumliche Weite des Ausdrucks.
theological_decisions: []
