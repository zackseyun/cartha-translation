  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
translation:
  language: de
  text: In jenen Tagen und zu jener Zeit, spricht Jahwe, werden die Israeliten[a] kommen, sie und die Judäer gemeinsam. Weinend werden sie weiterziehen[b] und Jahwe, ihren Gott, suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels“; ebenso anschließend „die Söhne Judas“. Gemeint sind die Angehörigen der beiden Volksgemeinschaften.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische wiederholt den Gedanken des Gehens: wörtlich etwa „gehend und weinend werden sie gehen“. Dadurch wird fortdauernde Bewegung unter Tränen ausgedrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  choice: In jenen Tagen und zu jener Zeit
  rationale: Bewahrt die doppelte Zeitangabe der prophetischen Formel, ohne beide Ausdrücke zu einem einzigen zusammenzuziehen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die prophetische Redeeinleitung in natürlichem, würdevollem Deutsch wieder und erhält den Gottesnamen.
- source_word: יָבֹאוּ
  choice: werden ... kommen
  rationale: Gibt die zukünftige Wiederherstellungsankündigung schlicht wieder und lässt das im Hebräischen nicht genannte Ziel offen.
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  choice: die Nachkommen Israels ... und die Nachkommen Judas
  rationale: Erhält die familiär-korporative Bedeutung von בְנֵי, ist im heutigen Deutsch aber natürlicher und inklusiver als die wörtliche Wiedergabe „Söhne“.
- source_word: הֵמָּה ... יַחְדָּו
  choice: sie ... gemeinsam
  rationale: Das resumptive und betonte Pronomen הֵמָּה bleibt sichtbar; „gemeinsam“ bringt die angekündigte Zusammenführung beider Gruppen zum Ausdruck.
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  choice: Unter Tränen werden sie ihres Weges ziehen
  rationale: Gibt die fortdauernde Bewegung zusammen mit dem Weinen idiomatisch wieder; die auffällige Wiederholung des Verbs „gehen“ wird in einer Fußnote erläutert.
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  choice: und Jahwe, ihren Gott, suchen
  rationale: „Suchen“ bewahrt sowohl den schlichten Wortsinn als auch die religiöse Bedeutung der erneuten Hinwendung zu ihrem Gott.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gemeinsame Wiederherstellung Israels und Judas
  choice: Beide Gruppen werden ausdrücklich getrennt genannt und kommen gemeinsam.
  alternative: Verallgemeinerung zu „ganz Israel“ oder eine spätere heilsgeschichtliche Deutung
  rationale: Die Übersetzung bewahrt die historische und theologische Spannung des Textes, ohne die beiden genannten Gruppen aufzulösen oder auf eine spätere Gemeinschaft festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die doppelte Zeitformel, das betonte Pronomen und die getrennte Nennung Israels und Judas bleiben erhalten; schwer nachzubildende hebräische Wiederholung wird idiomatisch übersetzt und in einer Fußnote offengelegt.
