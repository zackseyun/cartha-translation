source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤עָה ארוצ/ם מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יוֹעִדֶ֔/נִּי וּ/מִֽי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
translation:
  language: de
  text: Siehe, wie ein Löwe steigt er aus dem Dickicht des Jordan[a] herauf auf eine sichere Weide zu. Denn plötzlich werde ich sie von ihr vertreiben[b]. Und wer ist der Erwählte, den ich über sie einsetzen werde? Denn wer ist mir gleich? Wer kann mich vorladen[c]? Und welcher Hirte kann vor mir bestehen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Stolz“ oder „der Pracht des Jordan“; gemeint ist wahrscheinlich das dicht bewachsene Jordanufer.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Verbform ist schwierig. Auch möglich: „werde ich sie von ihr in die Flucht schlagen“.'
    reason: textual_or_lexical_difficulty
  - marker: c
    text: 'Oder: „Wer kann mir eine Zeit bestimmen?“ Das hebräische Verb kann das Festsetzen einer Begegnung oder das Vorladen zur Rechenschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Leitet das lebhafte prophetische Bild als Aufmerksamkeitssignal ein; „Siehe“ ist im gehobenen biblischen Deutsch verständlich und prägnant.
- source_word: כְּאַרְיֵה יַעֲלֶה
  choice: wie ein Löwe steigt er … herauf
  rationale: Bewahrt den Vergleich und die Bewegungsrichtung von עלה; das Präsens vermittelt die prophetische Unmittelbarkeit.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: aus dem Dickicht am Jordan
  rationale: גאון הירדן bezeichnet in diesem festen Zusammenhang wahrscheinlich das üppige, dicht bewachsene Jordanufer; die wörtlichere Bedeutung bleibt in der Fußnote erhalten.
- source_word: אֶל נְוֵה אֵיתָן
  choice: gegen eine sichere Weide
  rationale: נוה kann Weide beziehungsweise Wohnstätte einer Herde bezeichnen, während איתן Festigkeit und Sicherheit ausdrückt; „gegen“ passt zum bedrohlichen Löwenbild.
- source_word: כִּי אַרְגִּיעָה
  choice: Denn in einem Augenblick
  rationale: Gibt die temporale beziehungsweise plötzliche Nuance der Form natürlich wieder, ohne den Satz syntaktisch zu überladen.
- source_word: ארוצם מֵעָלֶיהָ
  choice: werde ich sie von dort fortjagen
  rationale: Die schwierige Form wird im Kontext kausativ als Vertreiben verstanden; „von dort“ nimmt den femininen Ortsbezug idiomatisch auf.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: und den, der erwählt ist, über sie einsetzen
  rationale: Bewahrt die komprimierte Syntax, die passive Nuance von בחור und den Sinn von פקד als Einsetzen oder Bestellen. Das feminine „sie“ bezieht sich auf die Weide.
- source_word: כִּי מִי כָמוֹנִי
  choice: Denn wer ist mir gleich?
  rationale: Die rhetorische Frage und die Aussage göttlicher Unvergleichlichkeit werden formal bewahrt.
- source_word: וּמִי יוֹעִדֶנִּי
  choice: Wer kann mich vorladen?
  rationale: יעד im Hifil kann eine Zeit festsetzen, jemanden bestellen oder vorladen; „vorladen“ trifft hier die Herausforderung, Gott zur Rechenschaft zu bestellen, lässt aber die lexikalische Alternative in der Fußnote sichtbar.
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  choice: Und welcher Hirte könnte vor mir bestehen?
  rationale: Erhält das Hirtenbild und gibt „vor mir stehen“ im kontextuellen Sinn von standhalten beziehungsweise bestehen natürlich wieder.
theological_decisions:
- issue: Bezug des Löwenbildes und Wechsel zur göttlichen Ich-Rede
  choice: Der Wechsel vom in der dritten Person beschriebenen Löwen zur göttlichen Ich-Rede bleibt unvermittelt stehen.
  alternative: Den Löwen ausdrücklich mit dem angreifenden Herrscher oder unmittelbar mit dem HERRN gleichzusetzen.
  rationale: Der hebräische Text identifiziert die Bildfigur nicht ausdrücklich. Die offene Verbindung wahrt sowohl das menschliche Werkzeug des Gerichts als auch Gottes souveränes Handeln, ohne die Spannung aufzulösen.
- issue: Bezugswort des femininen Suffixes in אֵלֶיהָ
  choice: „über sie“, bezogen auf die feminine „Weide“
  alternative: „über es“, bezogen auf ein allgemeiner verstandenes Land oder Gebiet
  rationale: Die grammatische Rückbindung an נוה als dargestellte Weide wird im Deutschen mit dem gewählten femininen Substantiv transparent erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Bildkraft. „Siehe“ und „bestehen“ halten einen leicht gehobenen biblischen Ton, bleiben aber allgemein verständlich. Die Pronomen unterscheiden bewusst „dort“ beim Fortjagen und „über sie“ bei der Einsetzung, um den Ortsbezug idiomatisch und zugleich grammatisch nachvollziehbar wiederzugeben.
