id: JER.50.14
reference: Jeremiah 50:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: de
  text: Stellt euch ringsum gegen Babylon auf, ihr alle, die ihr den Bogen spannt! Schießt auf sie, spart keinen Pfeil; denn sie hat gegen Jahwe gesündigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכוּ עַל בָּבֶל סָבִיב
  choice: Stellt euch ringsum gegen Babylon auf
  rationale: ערך bezeichnet im militärischen Zusammenhang das Aufstellen zur Schlacht; עַל hat hier feindlichen Sinn, und סָבִיב beschreibt die vollständige Umzingelung.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  choice: ihr alle, die ihr den Bogen spannt
  rationale: Die konkrete hebräische Bezeichnung für Bogenschützen wird als verständliches Bild bewahrt. „Den Bogen spannen“ gibt die gemeinte Tätigkeit im Deutschen natürlicher wieder als das wörtliche „den Bogen treten“.
- source_word: יְדוּ אֵלֶיהָ
  choice: Schießt auf sie
  rationale: ידה im Hiphil bezeichnet hier das Abschießen von Geschossen. Das feminine Pronomen bezieht sich auf die personifizierte Stadt Babylon.
- source_word: אַל תַּחְמְלוּ אֶל חֵץ
  choice: spart keinen Pfeil
  rationale: חמל bedeutet hier, etwas zu schonen oder zurückzuhalten. Der verneinte Singular חֵץ wird im Deutschen idiomatisch mit „keinen Pfeil“ wiedergegeben.
- source_word: כִּי לַיהוָה חָטָאָה
  choice: denn sie hat gegen Jahwe gesündigt
  rationale: כִּי begründet den Angriff. Die Verbindung חטא mit ל bezeichnet die Person, gegen die gesündigt wurde; das Perfekt wird als „hat gesündigt“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Eigenname wird transparent als „Jahwe“ wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezug der Sünde Babylons
  choice: sie hat gegen Jahwe gesündigt
  alternative: sie hat an Jahwe gesündigt
  rationale: Das ל nach חטא kennzeichnet hier idiomatisch denjenigen, gegen den sich die Sünde richtet. „Gegen“ ist im heutigen Deutsch klar und bewahrt die theologische Aussage.
translation_notes:
  register: Moderne, würdige prophetische Sprache mit direktem militärischem Imperativ. „Ringsum“ ist knapp und natürlich; das konkrete Bild des Bogenspannens bleibt erhalten. Die Zeichensetzung macht die aufeinanderfolgenden Befehle und ihre Begründung deutlich.
