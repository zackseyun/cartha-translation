source:
  edition: WLC
  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
translation:
  language: de
  text: Israel ist ein versprengtes Schaf[a]; Löwen haben es verjagt. Zuerst fraß der König von Assyrien es, und dieser Letzte – Nebukadrezar[b], der König von Babel – nagte ihm die Knochen ab.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein versprengtes Lamm«.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionelle deutsche Namensform: »Nebukadnezar«; der hebräische Text hat hier die Form »Nebukadrezar«.'
    reason: lexical_alternative
  - marker: c
    text: 'Die seltene hebräische Verbform kann das Abnagen oder Entblößen der Knochen bezeichnen; möglich ist auch die allgemeinere Wiedergabe: »hat ihm die Knochen zermalmt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: Schaf
  rationale: Das Substantiv bezeichnet ein Stück Kleinvieh und kann je nach Zusammenhang »Schaf« oder »Lamm« bedeuten. »Schaf« bewahrt hier das Bild des schutzlosen, vereinzelten Tieres, ohne sein Alter festzulegen.
- source_word: פְזוּרָה
  choice: versprengt
  rationale: Das Wort bezeichnet etwas Zerstreutes oder Auseinandergetriebenes. »Versprengt« klingt im Deutschen bei einem von Raubtieren vertriebenen Tier natürlich und erhält zugleich den Bezug auf Israels Zerstreuung.
- source_word: אֲרָיוֹת הִדִּיחוּ
  choice: Löwen haben es verjagt
  rationale: Die Hifil-Form beschreibt ein Vertreiben oder Fortjagen. »Verjagt« führt das Bild der Löwen als räuberische Mächte klar weiter.
- source_word: אֲכָלוֹ
  choice: hat … es gefressen
  rationale: Das Verb bedeutet wörtlich »essen«; bei einem Raubtierbild gibt »fressen« die gewaltsame Bildsprache im Deutschen unmittelbar wieder.
- source_word: וְזֶה הָאַחֲרוֹן
  choice: und dieser Letzte
  rationale: Die demonstrative Form und der Gegensatz zu »zuerst« werden beibehalten. Gemeint ist der spätere der beiden genannten Unterdrücker.
- source_word: עִצְּמוֹ
  choice: hat ihm die Knochen abgenagt
  rationale: Die seltene Verbform wird mit dem Abnagen beziehungsweise Entblößen der Knochen verbunden. Die Übersetzung erhält die drastische Fortsetzung des Raubtierbildes; die lexikalische Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadrezar
  rationale: Diese Form bildet die hier im hebräischen Text stehende Namensform genauer ab als die im Deutschen traditionell geläufige Form »Nebukadnezar«.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: »Babel« ist die geläufige deutsche biblische Namensform für die Stadt und das zugehörige Reich in diesem Zusammenhang.
theological_decisions:
- issue: Israel als einzelnes Tier und kollektive Person
  choice: Israel wird als ein einzelnes Schaf dargestellt und im weiteren Bild mit singularischen Bezügen wiederaufgenommen.
  alternative: Israel als Herde oder mit pluralischen Bezügen wiederzugeben.
  rationale: Der hebräische Text verwendet ein singularisches Tierbild sowie singularische Suffixe. Die Übersetzung bewahrt diese kollektive Personifikation, ohne sie zu einer Herde auszuweiten.
- issue: Imperiale Mächte im Raubtierbild
  choice: Die Verben »gefressen« und »die Knochen abgenagt« werden als konkrete Metaphern beibehalten.
  alternative: Die Bildsprache zu »vernichtet«, »zerschlagen« oder »besiegt« zu verallgemeinern.
  rationale: Der Vers deutet Assyrien und Babel durch ein bewusst drastisches Raubtierbild. Eine abstrakte Wiedergabe würde diese prophetische Spannung abschwächen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst anschaulicher Raubtiermetaphorik. Das neutrale Pronomen »es« folgt dem deutschen Genus von »Schaf«, während »ihm« Israel als personifiziertes Volk wieder stärker hervortreten lässt. Die Gedankenstriche markieren die erklärende Apposition, ohne die Abfolge der beiden Eroberermächte zu verwischen.
