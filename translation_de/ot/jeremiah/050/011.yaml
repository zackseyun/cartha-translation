  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
translation:
  language: de
  text: Weil du dich freust, weil du jubelst, ihr Plünderer meines Erbteils[a], weil du umherspringst wie eine dreschende junge Kuh und wie Hengste wieherst[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meines Erbbesitzes«. Gemeint sein können das Volk und das Land, die dem HERRN gehören.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräischen Verbformen sprechen Babylon als weiblich personifizierte Stadt in der Einzahl an; die Anrede »ihr Plünderer« ist dagegen ein maskuliner Plural.
    reason: grammatical_clarification
lexical_decisions:
- source_word: כִּי
  choice: weil
  rationale: 'Die dreifache Partikel wird in ihrer gewöhnlichen kausalen Bedeutung wiedergegeben. Der folgende Vers nennt das angekündigte Gericht; dadurch ergibt sich ein natürlicher Zusammenhang: Weil Babylon über die Plünderung jubelt, wird es zuschanden werden.'
- source_word: תשמחי / תעלזי
  choice: ihr euch freut / ihr jubelt
  rationale: Die beiden Verben bezeichnen Freude und ausgelassenes Frohlocken. Unterschiedliche deutsche Verben bewahren die poetische Steigerung.
- source_word: שֹׁסֵי נַחֲלָתִי
  choice: ihr Plünderer meines Erbteils
  rationale: שֹׁסֵי ist ein vokativisch verstandener maskuliner Plural und bezeichnet diejenigen, die berauben oder plündern. נַחֲלָה wird als »Erbteil« wiedergegeben und lässt offen, ob besonders Gottes Volk, sein Land oder beides gemeint ist.
- source_word: תפושי
  choice: ihr umherspringt
  rationale: Das seltene Verb פושׁ bezeichnet hier offenbar ausgelassene, lebhafte Bewegung. »Umherspringen« bewahrt das Tierbild, ohne die unsichere Nuance unnötig zu präzisieren.
- source_word: כְּעֶגְלָה דָשָׁה
  choice: wie eine dreschende junge Kuh
  rationale: Die Wendung bezeichnet ein weibliches Jungrind beim Dreschen beziehungsweise Austreten des Getreides. Die Wiedergabe erhält das konkrete landwirtschaftliche Bild.
- source_word: וּתְצַהֲלִי כָּאֲבִּרִים
  choice: und wie Hengste wiehert
  rationale: צהל bezeichnet hier den Laut von Pferden. אַבִּירִים kann allgemein »Starke« heißen, wird durch das Wiehern jedoch als Bezeichnung kräftiger Pferde konkretisiert; »Hengste« gibt dieses Bild knapp und anschaulich wieder.
theological_decisions:
- issue: Bezug und Numerus der Anrede
  choice: Babylon wird als weiblich personifizierte Stadt angesprochen; im Deutschen steht idiomatisch der Plural »ihr«, weil die eingeschobene Anrede »ihr Plünderer« die Bewohner bzw. Täter hervorhebt.
  alternative: 'Konsequente feminine Singularanrede an die personifizierte Stadt: »du freust dich … du jubelst …«'
  rationale: Im Hebräischen stehen feminine Singularformen neben dem maskulinen Plural שֹׁסֵי. Die deutsche Pluralanrede verbindet die Handlungen natürlich mit den angesprochenen Plünderern, während der Kontext die Personifikation Babylons erkennen lässt.
- issue: Funktion von כִּי
  choice: 'kausal: »weil«'
  alternative: 'konzessiv: »obwohl«'
  rationale: Die gewöhnliche kausale Bedeutung erklärt das folgende Gericht als Antwort auf Babylons schadenfrohen Übermut. Eine konzessive Lesart ist sprachlich möglich, aber weniger unmittelbar.
translation_notes:
  register: Moderne, gehobene Standardsprache mit prophetisch-poetischem Rhythmus. Die dreifache kausale Einleitung und die spöttischen Tierbilder bleiben erhalten. »Junge Kuh« ist verständlicher als das heute weniger geläufige »Färse«; »Erbteil« bewahrt den biblischen Eigentums- und Zugehörigkeitsklang.
