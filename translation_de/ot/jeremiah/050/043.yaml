  text: שָׁמַ֧ע מֶֽלֶךְ בָּבֶ֛ל אֶת שִׁמְעָ֖/ם וְ/רָפ֣וּ יָדָ֑י/ו צָרָה֙ הֶחֱזִיקַ֔תְ/הוּ חִ֖יל כַּ/יּוֹלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
translation:
  language: de
  text: Der König von Babel hat die Nachricht über sie[a] gehört, und seine Hände sind kraftlos geworden. Bedrängnis hat ihn gepackt, Wehen wie bei einer Frau in den Wehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Nachricht von ihnen“. Wörtlicher kann die hebräische Wendung als „ihre Nachricht“ wiedergegeben werden; im Zusammenhang ist die Nachricht über die heranrückenden Angreifer gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: hat ... gehört
  rationale: Das Qal Perfekt bezeichnet das abgeschlossene Hören, dessen gegenwärtige Folge die anschließende Reaktion des Königs ist.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Die Status-constructus-Verbindung bezeichnet den Herrscher Babels; „Babel“ entspricht der im deutschen Bibelstil üblichen Ortsbezeichnung.
- source_word: שִׁמְעָם
  choice: die Nachricht über sie
  rationale: שֵׁמַע kann „Nachricht“ oder „Bericht“ bedeuten. Das Suffix verweist hier auf die heranrückenden Angreifer; „über sie“ gibt diese Beziehung idiomatisch wieder, ohne die formal mögliche Lesart „ihre Nachricht“ zu verschweigen.
- source_word: וְרָפוּ יָדָיו
  choice: und seine Hände sind kraftlos geworden
  rationale: Die körperhafte Wendung beschreibt den Verlust von Kraft und Mut. Die Übersetzung bewahrt das Bild der Hände und ist in modernem Deutsch verständlich.
- source_word: צָרָה
  choice: Bedrängnis
  rationale: Das Substantiv bezeichnet Not oder Bedrängnis und bildet den ersten Ausdruck der den König überwältigenden Angst.
- source_word: הֶחֱזִיקַתְהוּ
  choice: hat ihn gepackt
  rationale: Das Hifil von חזק bedeutet hier „ergreifen, packen“; die Formulierung vermittelt das gewaltsame Überwältigtwerden natürlich und anschaulich.
- source_word: חִיל
  choice: Wehen
  rationale: חִיל kann in diesem Zusammenhang krampfartige Schmerzen bzw. Geburtswehen bezeichnen. Wegen des unmittelbar folgenden Vergleichs mit einer Gebärenden ist „Wehen“ prägnant und bildgetreu.
- source_word: כַּיּוֹלֵדָה
  choice: wie eine Gebärende
  rationale: Das feminine Partizip bezeichnet eine Frau beim Gebären. „Gebärende“ ist knapp, würdevoll und bewahrt den direkten Vergleich.
