source:
  edition: WLC
  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
translation:
  language: de
  text: Dürre über ihre Wasser – sie werden austrocknen! Denn es ist ein Land der Götzenbilder, und wegen der Schrecknisse[b] geraten sie in Raserei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Das hebräische Wort kann „Schrecknisse“ oder „furchterregende Dinge“ bedeuten; im Zusammenhang mit den Götzenbildern sind möglicherweise furchterregende Kultbilder gemeint. Das Verb kann auch „rasen“ oder „sich wie wahnsinnig gebärden“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  choice: Dürre
  rationale: Im unmittelbaren Zusammenhang mit den Wassern und ihrem Austrocknen ist „Dürre“ die naheliegende Bedeutung. Die mögliche Anspielung auf „Schwert“ bleibt in einer Fußnote erhalten.
- source_word: אֶל
  choice: kommt über
  rationale: Gibt die gegen die Wasser gerichtete Gerichtsankündigung in natürlichem Deutsch wieder.
- source_word: מֵימֶיהָ
  choice: ihre Wasser
  rationale: Bewahrt die feminine Personifikation Babylons.
- source_word: וְיָבֵשׁוּ
  choice: und sie werden austrocknen
  rationale: Das Qal wird intransitiv wiedergegeben; die Wasser sind das Subjekt.
- source_word: אֶרֶץ פְּסִלִים
  choice: ein Land der Schnitzbilder
  rationale: „Schnitzbilder“ bewahrt den konkreten Sinn von פְּסִלִים und lässt im Kontext ihre Funktion als Götzenbilder erkennen.
- source_word: וּבָאֵימִים
  choice: über Schreckensbilder
  rationale: Die Form bezeichnet wörtlich Schrecknisse oder Furcht erregende Dinge; im Götzenkontext legt sich der Bezug auf furchterregende Kultbilder nahe, ohne völlig sicher zu sein.
- source_word: יִתְהֹלָלוּ
  choice: geraten sie in Raserei
  rationale: Die Form bezeichnet törichtes, wahnsinniges oder rasendes Verhalten; die Wendung ist würdig, verständlich und bildkräftig.
theological_decisions:
- issue: Mehrdeutigkeit von חֹרֶב bei den Wassern
  choice: Im Haupttext „Dürre“, mit „Schwert“ als Fußnotenalternative
  alternative: Ein Schwert kommt über ihre Wasser
  rationale: Das Austrocknen der Wasser stützt „Dürre“, während Jeremias wiederkehrende Gerichtsformel „Schwert über/gegen …“ eine bewusste Doppelbedeutung möglich macht.
- issue: Bezug von אֵימִים
  choice: Schreckensbilder
  alternative: Schrecknisse / furchterregende Dinge
  rationale: Der unmittelbare Zusammenhang mit Schnitzbildern spricht für Kultbilder; die Fußnote bewahrt den weiteren lexikalischen Sinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung macht die Gerichtsankündigung klar lesbar; die echten lexikalischen Mehrdeutigkeiten werden durch Fußnoten offengehalten.
