  text: יָקֹ֨שְׁתִּי לָ֤/ךְ וְ/גַם נִלְכַּדְתְּ֙ בָּבֶ֔ל וְ/אַ֖תְּ לֹ֣א יָדָ֑עַתְּ נִמְצֵאת֙ וְ/גַם נִתְפַּ֔שְׂתְּ כִּ֥י בַֽ/יהוָ֖ה הִתְגָּרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/024.yaml
  text: I set a trap for you[a], and you also were caught, Babylon, and you did not know it; you were found and also seized[c][b], because you contended against Yahweh.
translation:
  language: de
  text: Ich habe dir eine Falle gestellt[a], und du wurdest auch gefangen, Babylon, ohne es zu wissen. Du wurdest entdeckt und auch ergriffen[b], weil du gegen Jahwe gestritten hast[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich habe dir eine Schlinge gelegt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Du wurdest gefunden und gefangen genommen.“ Die beiden Verben verstärken die Schilderung von Babylons Niederlage.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „weil du dich mit Jahwe angelegt hast.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֹשְׁתִּי לָךְ
  choice: Ich habe dir eine Falle gestellt
  rationale: Die Wendung bewahrt das konkrete Bild einer ausgelegten Falle und klingt im heutigen Deutsch natürlich.
- source_word: וְגַם נִלְכַּדְתְּ
  choice: und du wurdest auch gefangen
  rationale: Das Niphal von לכד bezeichnet das Gefangenwerden; „auch“ gibt die verstärkende Kraft von וְגַם wieder und knüpft an das Fallenbild an.
- source_word: וְאַתְּ לֹא יָדָעַתְּ
  choice: ohne es zu wissen
  rationale: Die knappe deutsche Fügung bewahrt, dass Babylon von der Falle beziehungsweise seiner Gefangennahme nichts wusste, ohne einen bestimmten Gegenstand dogmatisch festzulegen.
- source_word: נִמְצֵאת
  choice: du wurdest entdeckt
  rationale: Im Zusammenhang bezeichnet das Niphal von מצא das Aufgefunden- oder Entdecktwerden. „Entdeckt“ verdeutlicht die Bloßstellung nach Babylons Unwissenheit.
- source_word: וְגַם נִתְפַּשְׂתְּ
  choice: und auch ergriffen
  rationale: תפשׂ bezeichnet hier das Ergriffenwerden. Die Formulierung erhält die Steigerung vom Entdecken zum gewaltsamen Zugriff, ohne נלכד und נתפשׂ gleichlautend wiederzugeben.
- source_word: כִּי
  choice: weil
  rationale: Die Konjunktion leitet hier den Grund für Babylons Sturz ein.
- source_word: בַיהוָה הִתְגָּרִית
  choice: weil du dich mit Jahwe angelegt hast
  rationale: Der Hitpael von גרה beschreibt ein feindseliges Sich-Einlassen beziehungsweise Herausfordern. „Sich mit jemandem anlegen“ ist gegenwärtiges, verständliches Deutsch und bewahrt die vermessene Konfrontation; יהוה wird als Eigenname „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt es als Gottesnamen wieder, statt es durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von הִתְגָּרִית
  choice: du dich mit Jahwe angelegt hast
  alternative: du gegen Jahwe gestritten hast
  rationale: Die gewählte Fassung lässt offen, ob der Schwerpunkt auf Herausforderung, Auflehnung oder offenem Streit liegt, und vermeidet eine engere konfessionelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Babylon wird entsprechend den femininen Singularformen direkt als personifizierte Stadt angeredet. Der erste Satz wurde für bessere deutsche Lesbarkeit geteilt; Wiederholungen von „auch“ bleiben als Entsprechung zu וְגַם erhalten.
