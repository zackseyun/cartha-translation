  source_fidelity: 'Der Entwurf gibt die hebräische Ursache-Wirkungs-Folge zuverlässig wieder: מִקּוֹל als hörbarer Lärm/Schall, die Einnahme bzw. Gefangennahme Babels, das Erbeben der Erde und den unter den Völkern vernehmbaren Schrei. Die Deutung von הָאָרֶץ als „die Erde“ ist im prophetischen Kontext gut vertretbar; die mögliche Bedeutung „Land“ wird nicht unterschlagen, aber muss im Text nicht markiert werden.'
