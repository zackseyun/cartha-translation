source:
  edition: WLC
  text: מִ/קּוֹל֙ נִתְפְּשָׂ֣ה בָבֶ֔ל נִרְעֲשָׁ֖ה הָ/אָ֑רֶץ וּ/זְעָקָ֖ה בַּ/גּוֹיִ֥ם נִשְׁמָֽע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/046.yaml
  text: At the sound of Babylon being captured, the earth quakes, and a cry is heard among the nations.
translation:
  language: de
  text: Vom Lärm der Einnahme Babels erbebt die Erde, und ein Schrei wird unter den Völkern gehört.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  choice: Vom Lärm
  rationale: קוֹל kann »Stimme«, »Schall«, »Laut« oder »Lärm« bezeichnen. Im Zusammenhang mit der gewaltsamen Einnahme einer Stadt gibt »Lärm« den hörbaren Tumult natürlich und prägnant wieder.
- source_word: נִתְפְּשָׂה בָבֶל
  choice: der Einnahme Babels
  rationale: Das passive Verb bezeichnet hier, dass Babel ergriffen bzw. eingenommen wird. Die nominale Formulierung fügt sich idiomatisch in die Wendung »vom Lärm« ein, ohne den Vorgang inhaltlich umzudeuten.
- source_word: נִרְעֲשָׁה הָאָרֶץ
  choice: erbebt die Erde
  rationale: רעש bezeichnet heftiges Beben oder Erschüttern. »erbebt« bewahrt die starke, bildhafte Aussage und den poetisch-prophetischen Ton.
- source_word: וּזְעָקָה
  choice: und ein Schrei
  rationale: זְעָקָה ist ein lauter Hilferuf, Klageschrei oder Aufschrei. Das allgemeinere »Schrei« erhält die im Hebräischen nicht näher festgelegte Nuance.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Die Präposition ב kann hier den Bereich angeben, in dem der Schrei gehört wird. »unter den Völkern« ist im Deutschen natürlich und wahrt den kollektiven Plural גּוֹיִם.
theological_decisions:
- issue: Reichweite der erschütterten »Erde«
  choice: die Erde
  alternative: das Land
  rationale: הָאָרֶץ kann »Land« oder »Erde« bedeuten. Der parallele Hinweis auf die Völker und die weltweite Wirkung von Babels Fall sprechen hier für »Erde«, ohne die poetische Überhöhung zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. Der Satzbau folgt der hebräischen Ursache-Wirkungs-Struktur, bleibt aber idiomatisch.
