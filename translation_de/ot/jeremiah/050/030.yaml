source:
  edition: WLC
  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתָּ֥/הּ יִדַּ֛מּוּ בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
translation:
  language: de
  text: Darum werden ihre jungen Männer auf ihren Straßen fallen, und alle ihre Krieger werden an jenem Tag verstummen[a] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden umkommen“. Das hebräische Verb kann „verstummen“ oder „still werden“ bedeuten und im Zusammenhang das Stillwerden im Tod einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und natürlich wieder und wahrt den Zusammenhang mit dem vorausgehenden Gerichtswort.
- source_word: יִפְּלוּ
  choice: werden fallen
  rationale: Bewahrt das hebräische Bild; im militärischen Gerichtskontext ist der Tod mitgemeint, ohne ausdrücklich ergänzt zu werden.
- source_word: בַחוּרֶיהָ
  choice: ihre jungen Männer
  rationale: Bezeichnet Männer in der Blüte ihrer Kraft, hier wahrscheinlich mit militärischem Beiklang; die neutrale Grundbedeutung bleibt erhalten.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: auf ihren Straßen
  rationale: רְחֹבוֹת kann breite Straßen oder öffentliche Plätze bezeichnen. Im Deutschen ist „auf ihren Straßen“ eine natürliche räumliche Wiedergabe.
- source_word: אַנְשֵׁי מִלְחַמְתָּהּ
  choice: alle ihre Krieger
  rationale: Gibt die wörtliche Wendung „Männer ihres Krieges“ idiomatisch und prägnant wieder.
- source_word: יִדַּמּוּ
  choice: werden zum Schweigen gebracht werden
  rationale: Bewahrt das Bild des Verstummens beziehungsweise Stillwerdens und lässt zugleich im Gerichtskontext das Getötetwerden anklingen.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der geläufigen prophetischen Zeitangabe.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Kennzeichnet die prophetische Gotteswortformel und gibt den Gottesnamen als Eigennamen wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen. „Jahwe“ ist dessen im Deutschen geläufige wissenschaftliche Wiedergabe und ersetzt ihn nicht durch einen Titel.
- issue: Todessinn von יִדַּמּוּ
  choice: zum Schweigen gebracht werden
  alternative: umkommen; vernichtet werden
  rationale: Das hebräische Verb kann Verstummen oder Stillwerden bezeichnen und im Gerichtskontext das Stillwerden im Tod einschließen. Der Haupttext bewahrt diese Spannung; die eindeutigere Todesdeutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem prophetischen Gerichtswort, vermeidet jedoch unnötig altertümliche Formen. Der Gedankenstrich setzt die abschließende Gotteswortformel klar ab.
