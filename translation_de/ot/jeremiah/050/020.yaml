  text: בַּ/יָּמִ֣ים הָ/הֵם֩ וּ/בָ/עֵ֨ת הַ/הִ֜יא נְאֻם יְהוָ֗ה יְבֻקַּ֞שׁ אֶת עֲוֺ֤ן יִשְׂרָאֵל֙ וְ/אֵינֶ֔/נּוּ וְ/אֶת חַטֹּ֥את יְהוּדָ֖ה וְ/לֹ֣א תִמָּצֶ֑אינָה כִּ֥י אֶסְלַ֖ח לַ/אֲשֶׁ֥ר אַשְׁאִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: de
  text: In jenen Tagen und zu jener Zeit, spricht der HERR, wird man nach der Schuld Israels suchen, doch es wird keine geben, und nach den Sünden Judas, doch sie werden nicht zu finden sein; denn ich werde denen vergeben, die ich übrig bleiben lasse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲוֺן
  choice: Schuld
  rationale: Der Singular bezeichnet hier Israels verschuldete Verfehlung beziehungsweise Schuld; „Schuld“ bewahrt den Unterschied zum folgenden pluralischen „Sünden“.
- source_word: חַטֹּאת
  choice: Sünden
  rationale: Der Plural wird direkt und idiomatisch wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die feste prophetische Formel wird in würdigem, geläufigem Deutsch wiedergegeben; der Gottesname erscheint gemäß deutscher Bibeltradition als „HERR“.
- source_word: לַאֲשֶׁר אַשְׁאִיר
  choice: denen, die ich als Rest übrig lasse
  rationale: Die Formulierung erhält sowohl Gottes Handeln im Übriglassen als auch den im Kontext erkennbaren Restgedanken, ohne eine zusätzliche Bezeichnung als Substantiv einzuführen.
theological_decisions:
- issue: Nichtauffindbarkeit von Schuld und Sünden
  choice: „nicht mehr da sein“ beziehungsweise „nicht gefunden werden“
  alternative: „es wird keine geben“
  rationale: Die Übersetzung bewahrt das Bild einer Suche, die wegen Gottes Vergebung erfolglos bleibt, ohne die Aussage zu einer allgemeinen Behauptung über Sündlosigkeit auszuweiten.
- issue: Identität der Vergebenen
  choice: „denen vergeben, die ich als Rest übrig lasse“
  alternative: „meinem übrig gebliebenen Volk vergeben“
  rationale: Das Relativgefüge des Hebräischen bleibt erhalten und vermeidet eine über den Wortlaut hinausgehende Identifizierung, während der Restgedanke sichtbar bleibt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit prophetisch-feierlichem Ton. Die parallele Satzstruktur und der Wechsel von singularischer „Schuld“ zu pluralischen „Sünden“ bleiben erhalten.
