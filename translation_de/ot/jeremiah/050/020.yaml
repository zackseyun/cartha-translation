  to: In jenen Tagen und zu jener Zeit, spricht der HERR, wird man nach der Schuld Israels suchen, doch es wird keine geben, und nach den Sünden Judas, doch sie werden nicht zu finden sein; denn ich werde denen vergeben, die ich übrig bleiben lasse.
  rationale: Die Revision entfernt den nicht ausdrücklich im Ausgangstext enthaltenen Zeitbezug „mehr“, erhält die parallele Suchmetaphorik und gibt die beiden verschieden formulierten Negationen des Hebräischen in natürlichem modernen Deutsch wieder. Die Schlusswendung bleibt ein offener Relativsatz und wahrt zugleich den im Verb enthaltenen Gedanken eines von Gott bewahrten Restes.
