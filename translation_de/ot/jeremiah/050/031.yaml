  text: הִנְ/נִ֤י אֵלֶ֨י/ךָ֙ זָד֔וֹן נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָא֑וֹת כִּ֛י בָּ֥א יוֹמְ/ךָ֖ עֵ֥ת פְּקַדְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
translation:
  language: de
  text: Siehe, ich bin gegen dich, du Vermessener[a] – Spruch von Jahwe, dem Herrn der Heerscharen. Denn dein Tag ist gekommen, die Zeit, in der ich dich zur Rechenschaft ziehen werde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „du Hochmütiger“ oder „du Überheblicher“. Das hebräische Wort bezeichnet Babylon wegen seines anmaßenden Hochmuts.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Zeit, da ich dich heimgesucht habe“. Das hebräische Verb kann ein gezieltes Aufsuchen bezeichnen; hier meint es Gottes gerichtliches Eingreifen, also dass er Babylon zur Rechenschaft zieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe, ich bin
  rationale: Die Wendung leitet eine feierliche göttliche Ankündigung ein. „Siehe“ bewahrt den nachdrücklichen prophetischen Ton, ohne den folgenden Satz unnötig auszubauen.
- source_word: אֵלֶיךָ
  choice: gegen dich
  rationale: In Verbindung mit הִנְנִי bezeichnet die Präposition hier feindliches Entgegentreten im Gericht, nicht bloß eine Bewegung „zu“ jemandem.
- source_word: זָדוֹן
  choice: du Vermessener
  rationale: Das Substantiv bezeichnet schuldhafte Selbstüberhebung beziehungsweise anmaßenden Hochmut und wird hier als Anrede für Babylon gebraucht. Die maskuline Form entspricht den maskulinen Anredesuffixen im hebräischen Text.
- source_word: נְאֻם
  choice: Spruch
  rationale: „Spruch“ gibt die feste prophetische Botenformel knapp und würdevoll wieder und kennzeichnet die Aussage als autoritatives Gotteswort.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: des Herrn Jahwe der Heerscharen
  rationale: „Herr“ gibt אֲדֹנָי wieder, „Jahwe“ bewahrt den Gottesnamen, und „der Heerscharen“ übersetzt צְבָאוֹת, ohne dessen möglichen Bezug auf himmlische oder irdische Heere vorschnell einzuengen.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt den Grund für die zuvor angekündigte Gegnerschaft Gottes an.
- source_word: בָּא יוֹמְךָ
  choice: dein Tag ist gekommen
  rationale: Das Perfekt stellt den bestimmten Gerichtstag als eingetreten beziehungsweise gewiss gegenwärtig dar. Die deutsche Formulierung bewahrt diese prophetische Unmittelbarkeit.
- source_word: עֵת
  choice: die Zeit
  rationale: Das Wort bezeichnet den bestimmten Zeitpunkt des göttlichen Einschreitens; „die Zeit“ ist knapp und lässt den Kontext dessen besonderen Charakter verdeutlichen.
- source_word: פְּקַדְתִּיךָ
  choice: da ich dich zur Rechenschaft ziehe
  rationale: פקד bezeichnet hier ein göttliches Aufsuchen mit gerichtlicher Konsequenz. „Zur Rechenschaft ziehen“ macht den Gerichtssinn verständlich, ohne das weitere Bedeutungsspektrum des Verbs vollständig auf „bestrafen“ zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr Jahwe der Heerscharen
  alternative: GOTT, der Herr der Heerscharen; der Herr, der HERR der Heerscharen
  rationale: Die gewählte Fassung unterscheidet אֲדֹנָי von dem ausdrücklich gesetzten Gottesnamen יְהוִה und vermeidet zugleich die schwer verständliche Doppelung „Herr HERR“. „Heerscharen“ wahrt die traditionelle Bildwelt, ohne sie dogmatisch auf eine einzige Art von Heer festzulegen.
- issue: Gerichtsbedeutung von פקד
  choice: zur Rechenschaft ziehen
  alternative: heimsuchen; bestrafen; sich jemandes annehmen
  rationale: Im Zusammenhang der Gerichtsankündigung ist eine positive Fürsorge nicht gemeint. Die Formulierung hält jedoch fest, dass פקד zunächst ein gezieltes göttliches Aufsuchen beziehungsweise Sich-Kümmern bezeichnet, das hier zur Abrechnung wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Nachdruck. „Siehe“ und „Spruch“ sind bewusst feierlich, aber im Bibelregister weiterhin allgemein verständlich. Die direkte Anrede und die knappe Satzstruktur folgen der Wucht des hebräischen Textes.
