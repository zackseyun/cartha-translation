  edition: WLC
  text: אֵ֤יךְ נִגְדַּע֙ וַ/יִּשָּׁבֵ֔ר פַּטִּ֖ישׁ כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/023.yaml
  text: How the hammer of the whole earth has been cut down and broken! How Babylon has become a desolation among the nations![a][b]
translation:
  language: de
  text: Wie ist der Hammer der ganzen Erde doch abgehauen und zerbrochen worden! Wie ist Babylon unter den Nationen zur Einöde geworden![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ist Babylon unter den Nationen zum Gegenstand des Entsetzens geworden!“ Das hebräische Wort kann sowohl die Verwüstung als auch das Entsetzen über den Untergang bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie ist doch
  rationale: Leitet hier einen Ausruf des Staunens und der Klage ein, keine echte Frage. „Doch“ macht diese rhetorische Kraft im Deutschen natürlich hörbar.
- source_word: נִגְדַּע
  choice: abgehauen worden
  rationale: Das Nifal von גדע bezeichnet das Ab- oder Niederhauen. „Abgehauen“ bewahrt das konkrete Bild und passt zu einem mächtigen Werkzeug, das selbst beseitigt wird.
- source_word: וַיִּשָּׁבֵר
  choice: und zerbrochen worden
  rationale: שבר bezeichnet hier passiv das Zerbrechen. „Zerbrochen“ gibt den Grundsinn wieder, ohne ihn zum stärkeren „zerschmettert“ zu steigern.
- source_word: פַּטִּישׁ
  choice: Hammer
  rationale: Die direkte Wiedergabe erhält das eindrückliche Bild Babylons als zermalmendes Werkzeug, ohne es durch „Zerstörer“ auszudeuten.
- source_word: כָּל הָאָרֶץ
  choice: der ganzen Erde
  rationale: Der Zusammenhang mit den Nationen legt den internationalen, umfassenden Sinn von אֶרֶץ nahe; „Erde“ ist daher passender als „Land“.
- source_word: הָיְתָה לְשַׁמָּה
  choice: ist … zur Einöde geworden
  rationale: שַׁמָּה kann verwüstete Öde wie auch Entsetzen angesichts der Verwüstung bezeichnen. „Einöde“ gibt den Zustand der Verwüstung prägnant wieder; die alternative Nuance wird in der Fußnote bewahrt.
- source_word: בָּבֶל
  choice: Babylon
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: Im geopolitischen Gerichtskontext sind Völker beziehungsweise Nationen gemeint. „Nationen“ stellt zudem den Bezug zur weltweiten Macht Babylons klar heraus.
theological_decisions:
- issue: Metaphorische Bezeichnung Babylons als „Hammer der ganzen Erde“
  choice: Das Bild wird unmittelbar als „Hammer der ganzen Erde“ beibehalten.
  alternative: „Zerstörer der ganzen Erde“ oder „Kriegshammer der ganzen Erde“
  rationale: Der hebräische Text stellt pointiert dar, dass das Werkzeug, das andere zerschlug, nun selbst abgehauen und zerbrochen ist. Eine Auflösung als „Zerstörer“ würde das Bild verengen; „Kriegshammer“ würde eine Spezifizierung hinzufügen, die das Substantiv allein nicht zwingend verlangt.
- issue: Bedeutung von שַׁמָּה
  choice: „zur Einöde geworden“
  alternative: „zum Gegenstand des Entsetzens geworden“
  rationale: Das Wort lässt sowohl die konkrete Verwüstung als auch das dadurch ausgelöste Entsetzen anklingen. Der Haupttext nennt den verwüsteten Zustand; die Fußnote erhält die genuine Bedeutungsalternative.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit prophetisch-ausrufendem Ton. Die parallele Satzform „Wie ist doch …! Wie ist …!“ bildet die hebräische Rhetorik ab. Das konkrete Hammerbild bleibt ohne konfessionelle oder dogmatische Ausdeutung stehen.
