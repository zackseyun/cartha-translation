  terminology: „Hirten“, „in die Irre führen“, „Berg“, „Hügel“ und „Ruheplatz“ sind treffend. „Schafherde“ hält die kollektive Bedeutung von צֹאן und die konkrete Schafmetapher gleichermaßen fest. Die Fußnote soll die textliche Schwierigkeit von שׁוֹבְבִים offenlegen, ohne eine bestimmte syntaktische Lösung als gesichert auszugeben.
