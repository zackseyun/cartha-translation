    rationale: Die kontextuelle Deutung ist vertretbar, aber die zwei aufeinanderfolgenden deutschen Kausativa („führten … in die Irre und ließen … umherirren“) verwischen die umstrittene Syntax. Eine knappere Formulierung bewahrt die Unsicherheit besser; die Fußnote kann die Alternativen nennen.
