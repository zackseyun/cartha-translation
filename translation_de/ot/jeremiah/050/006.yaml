source:
  edition: WLC
  text: צֹ֤אן אֹֽבְדוֹת֙ היה עַמִּ֔/י רֹעֵי/הֶ֣ם הִתְע֔וּ/ם הָרִ֖ים שובבים מֵ/הַ֤ר אֶל גִּבְעָה֙ הָלָ֔כוּ שָׁכְח֖וּ רִבְצָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
translation:
  language: de
  text: Mein Volk war eine verlorene Schafherde. Ihre Hirten führten sie in die Irre und trieben sie auf den Bergen umher.[a] Sie zogen von Berg zu Hügel; sie vergaßen ihren Ruheplatz.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Hebräische ist hier syntaktisch schwierig. Die letzten Wörter des Satzes können auch formaler als „sie wandten sie auf den Bergen ab“ verstanden werden; manche beziehen „abtrünnig/wegführend“ auf die Berge.
    reason: lexical_alternative
  - marker: b
    text: „Von Berg zu Hügel“ kann neben dem Bild einer umherirrenden Herde auch an Israels Wege zu den Höhenheiligtümern und damit an seinen Abfall von Gott erinnern.
    reason: cross_reference
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  choice: eine Herde verlorener Schafe
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh bzw. eine Herde; im Hirtenbild macht „Herde verlorener Schafe“ sowohl das Kollektiv als auch den Zustand des Verlorenseins verständlich. אֹבְדוֹת kann auch zugrunde gehende oder verirrte Tiere bezeichnen, doch „verloren“ wahrt hier die Bildsprache ohne endgültige Vernichtung auszudrücken.
- source_word: היה עַמִּי
  choice: Mein Volk war
  rationale: Die hebräische Nominalfügung mit היה wird schlicht und idiomatisch wiedergegeben. „War“ bewahrt die rückblickende Anklage; ein deutsches Perfekt wäre möglich, aber stilistisch schwerfälliger.
- source_word: רֹעֵיהֶם
  choice: ihre Hirten
  rationale: Die wörtliche Hirtenmetapher bleibt erhalten und bezeichnet im Zusammenhang zugleich die verantwortlichen Führer des Volkes, ohne die Metapher durch „Leiter“ aufzulösen.
- source_word: הִתְעוּם
  choice: führten sie in die Irre
  rationale: 'Der Hifil von תעה ist kausativ: Die Hirten bewirkten das Irren der Schafe. Die Formulierung bewahrt sowohl die Richtungslosigkeit als auch die Schuld der Hirten.'
- source_word: הָרִים שובבים
  choice: ließen sie auf den Bergen umherirren
  rationale: Die syntaktische Zuordnung von שובבים ist schwierig. Die kontextuelle Wiedergabe beschreibt das fehlgeleitete Umherziehen auf den Bergen, ohne die schwer verständliche formale Möglichkeit „abtrünnige Berge“ in den Haupttext zu zwingen.
- source_word: מֵהַר אֶל גִּבְעָה הָלָכוּ
  choice: Von Berg zu Hügel zogen sie
  rationale: Die Ortsfolge bleibt knapp und bildhaft erhalten. הָלָכוּ bedeutet grundsätzlich „sie gingen“; „zogen“ passt zum fortgesetzten Weg der Herde, ohne das Verb stärker als nötig mit „irrten“ auszudeuten.
- source_word: שָׁכְחוּ רִבְצָם
  choice: ihren Ruheplatz vergaßen sie
  rationale: רִבְצָם bezeichnet den Platz, an dem Tiere lagern oder ruhen. „Ruheplatz“ ist weiter und quellennäher als das spezifischere „Pferch“ und hält das Hirtenbild aufrecht.
theological_decisions:
- issue: Mögliche Anspielung auf Götzendienst an Höhenheiligtümern
  choice: Die geografische Hirtenbildsprache „von Berg zu Hügel“ bleibt im Haupttext bestehen.
  alternative: Die Berge und Hügel ausdrücklich als illegitime Kultstätten bezeichnen.
  rationale: In Jeremia können Berge und Hügel mit Abfall und Götzendienst verbunden sein. Der unmittelbare Text stellt jedoch verirrte Schafe dar; deshalb bleibt die mögliche kultische Nebenbedeutung angedeutet und wird nur in der Fußnote erwähnt.
- issue: Syntaktische und semantische Deutung von שובבים
  choice: Das Wort wird kontextuell als Umherirren der Schafe wiedergegeben.
  alternative: „abtrünnige/wegführende Berge“ oder „sie abwendend“
  rationale: Die Form kann formal auf הָרִים bezogen werden, ergibt dann aber eine ungewöhnliche und mehrdeutige Aussage. Die Hauptfassung folgt dem Bewegungsbild, während die Fußnote die echte Unsicherheit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Hirtenmetaphorik. Die leicht markierte Wortstellung im letzten Satzteil gibt dem Abschluss Gewicht, bleibt aber gut verständlich. Die schwierige hebräische Syntax wird im Haupttext flüssig wiedergegeben und in Fußnote [a] ausdrücklich offengehalten.
