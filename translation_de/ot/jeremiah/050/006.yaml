  source_fidelity: 'Die Grundzüge sind richtig: Gottes Volk wird als verlorene Herde dargestellt, die Hirten tragen die Schuld am Irregehen, die Herde zieht von Berg zu Hügel und vergisst ihren Lager-/Ruheplatz. Die Wiedergabe „führten sie in die Irre und ließen sie … umherirren“ gibt die schwierige Folge הִתְעוּם הָרִים שׁוֹבְבִים jedoch mit zwei sehr ähnlichen deutschen Verben etwas zu stark entfaltend wieder. Außerdem sollte die alternative Deutung in der Fußnote nicht als unvollständiger Satz stehen.'
