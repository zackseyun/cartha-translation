source:
  edition: WLC
  text: ק֥וֹל נָסִ֛ים וּ/פְלֵטִ֖ים מֵ/אֶ֣רֶץ בָּבֶ֑ל לְ/הַגִּ֣יד בְּ/צִיּ֗וֹן אֶת נִקְמַת֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ נִקְמַ֖ת הֵיכָלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/028.yaml
  text: The sound of fugitives and escapees from the land of Babylon[a], to declare in Zion the vengeance of Yahweh our God[c][b], the vengeance for his temple.
translation:
  language: de
  text: 'Die Stimme[b] von Flüchtenden und Entkommenen[a] aus dem Land Babylon: Sie verkünden in Zion die Vergeltung Jahwes, unseres Gottes – die Vergeltung für seinen Tempel.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Fliehende und Entronnene«; das zweite Wort kann auch Überlebende bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich beginnt der Vers knapp: »Stimme (oder: Schall) von Flüchtenden und Entkommenen aus dem Land Babylon«.'
    reason: literal_rendering
  - marker: c
    text: 'Wörtlich: »die Vergeltung seines Tempels«; gemeint ist wahrscheinlich die Vergeltung für das Unrecht, das seinem Tempel angetan wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: lassen ihre Stimme hören
  rationale: קוֹל kann »Stimme«, »Laut« oder »Schall« bezeichnen. Die deutsche Wendung gibt die hörbare Meldung natürlich wieder, ohne die im Hebräischen knappe, nominale Eröffnung in eine schwer verständliche Satzfügung zu zwingen.
- source_word: נָסִים
  choice: Flüchtende
  rationale: Das Partizip von נוס bezeichnet Menschen, die fliehen. »Flüchtende« bewahrt den Vorgangscharakter und vermeidet die möglichen modernen rechtlichen Nebenbedeutungen von »Flüchtlinge«.
- source_word: וּפְלֵטִים
  choice: und Entkommene
  rationale: פְלֵטִים bezeichnet Menschen, die entkommen beziehungsweise gerettet worden sind. »Entkommene« erhält den konkreten Gedanken des Entrinnens und die Parallelität zu »Flüchtende«.
- source_word: מֵאֶרֶץ בָּבֶל
  choice: aus dem Land Babylon
  rationale: Das ausdrücklich genannte אֶרֶץ wird als »Land« beibehalten; die Wendung bezeichnet das babylonische Gebiet, aus dem sie kommen.
- source_word: לְהַגִּיד
  choice: um … zu verkünden
  rationale: Der Infinitiv mit לְ drückt hier den Zweck aus. »Verkünden« passt zur öffentlichen Bekanntgabe in Zion.
- source_word: בְּצִיּוֹן
  choice: in Zion
  rationale: Die Präposition בְּ bezeichnet den Ort der Verkündigung. Daher steht »in Zion« und nicht »nach Zion«.
- source_word: נִקְמַת
  choice: die Vergeltung
  rationale: נְקָמָה bezeichnet Rache beziehungsweise vergeltendes Eingreifen. »Vergeltung« wahrt die strafende Kraft des Wortes, klingt im Deutschen aber stärker nach gerechtem Gericht als nach persönlicher Rachsucht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch den Titel »der HERR« ersetzt. »Jahwe« ist die im modernen Deutschen geläufige Umschrift.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Das Suffix der ersten Person Plural wird bewahrt und kennzeichnet das Bekenntnis zu »unserem Gott«.
- source_word: נִקְמַת הֵיכָלוֹ
  choice: die Vergeltung für seinen Tempel
  rationale: Die zweite Genitivverbindung wiederholt נִקְמַת und bezieht die Vergeltung auf das dem Tempel angetane Unrecht. »Für« ist im Deutschen verständlich, während die wörtliche Genitivfügung mehrdeutig bleibt.
- source_word: הֵיכָלוֹ
  choice: seinen Tempel
  rationale: הֵיכָל bezeichnet hier den Tempel in Jerusalem; »Palast« wäre in diesem Zusammenhang missverständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; JHWH
  rationale: Der hebräische Text nennt den Tetragrammaton ausdrücklich. Die Umschrift bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Reaktion
  choice: Vergeltung
  alternative: Rache
  rationale: Beide Wiedergaben liegen im Bedeutungsbereich von נְקָמָה. »Vergeltung« bewahrt hier den Gedanken des strafenden Eingreifens und lässt zugleich dessen gerichtlichen Charakter erkennen, ohne die Aussage abzuschwächen.
- issue: Bezug der Vergeltung auf den Tempel
  choice: Vergeltung für seinen Tempel
  alternative: Vergeltung seines Tempels
  rationale: Der hebräische Genitiv ist formal offen. Im Zusammenhang ist wahrscheinlich die Vergeltung für das am Tempel begangene Unrecht gemeint; diese Deutung steht im Text, während die wörtlichere Form in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe hebräische Nominaleröffnung wird zu einer natürlichen deutschen Wendung entfaltet; die Zweckbeziehung des Infinitivs, die Wiederholung von »Vergeltung« und die Spannung der Genitivfügung bleiben erhalten.
