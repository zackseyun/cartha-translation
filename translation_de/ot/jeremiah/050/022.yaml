  text: The sound of war is in the land[a], and great destruction.
translation:
  language: de
  text: Kriegslärm im Land und gewaltige Zerstörung[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kriegslärm im Land und ein gewaltiges Krachen!“ Das hebräische Wort שֶׁבֶר kann je nach Zusammenhang „Zerbrechen“, „Krachen“, „Zusammenbruch“ oder „Zerstörung“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: Lärm
  rationale: קוֹל bezeichnet Stimme, Klang, Geräusch oder Lärm. In Verbindung mit Krieg gibt „Kriegslärm“ den hörbaren Eindruck knapp und natürlich wieder.
- source_word: מִלְחָמָה
  choice: Krieg
  rationale: מִלְחָמָה kann Krieg oder Schlacht bedeuten. Der weitere Zusammenhang des Gerichtswortes gegen Babylon spricht für den umfassenderen Begriff „Krieg“.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ bezeichnet hier das betroffene Herrschaftsgebiet, nicht die ganze Erde. „Im Land“ ist daher sachlich und idiomatisch passend.
- source_word: וְשֶׁבֶר
  choice: und gewaltige Zerstörung
  rationale: שֶׁבֶר bezeichnet wörtlich ein Zerbrechen und kann auch Zusammenbruch, Verwüstung oder Zerstörung meinen. „Zerstörung“ gibt im Gerichtskontext die Folge des gewaltsamen Zerbrechens verständlich wieder; die hörbare Bedeutungsmöglichkeit bleibt in der Fußnote erhalten.
- source_word: גָּדוֹל
  choice: gewaltige
  rationale: גָּדוֹל bedeutet groß oder gewaltig. „Gewaltige“ verbindet sich im modernen Deutschen natürlich mit „Zerstörung“ und bewahrt die Intensität.
theological_decisions: []
translation_notes:
  register: Knapp, ausrufartig und würdevoll. Die verblosen hebräischen Nominalsätze werden ohne ergänztes Verb wiedergegeben. „Kriegslärm“ ist im modernen Standarddeutsch natürlicher als „Stimme des Krieges“; das Ausrufezeichen verdeutlicht den alarmierenden Charakter, ohne den Aussagegehalt zu erweitern.
