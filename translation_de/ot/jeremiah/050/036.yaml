base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/036.yaml
  text: A sword is against the diviners[a], and they will become fools; a sword is against her warriors[b], and they will be dismayed.
translation:
  language: de
  text: Ein Schwert gegen die Wahrsager[a], und sie werden zu Narren; ein Schwert gegen ihre Krieger[b], und sie werden erschrecken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lügner“. Das hebräische Wort kann auch allgemein Menschen bezeichnen, die Falsches oder Trügerisches reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie werden verzagen“ oder „sie werden zusammenbrechen“. Das hebräische Verb kann Entsetzen und Mutlosigkeit ebenso wie Zusammenbruch ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב אֶל
  choice: Ein Schwert über
  rationale: Die knappe prophetische Gerichtsformel bezeichnet ein feindlich gegen eine Gruppe gerichtetes Schwert. „Über“ bewahrt den elliptischen Ausrufcharakter und klingt im Deutschen natürlicher als „ein Schwert gegen“.
- source_word: הַבַּדִּים
  choice: die Wahrsager
  rationale: בַּדִּים kann Lügner oder allgemein trügerisch Redende bezeichnen, wird hier im babylonischen Kontext jedoch plausibel auf Wahrsager und ihre trügerischen Orakel bezogen. Die weitere Bedeutung bleibt in einer Fußnote erhalten.
- source_word: וְנֹאָלוּ
  choice: sie werden zu Narren
  rationale: Die Nifalform bezeichnet, dass sie töricht werden beziehungsweise sich als töricht erweisen. Die gewählte Formulierung bewahrt den resultativen Sinn und die prophetische Ironie.
- source_word: גִּבּוֹרֶיהָ
  choice: ihre Krieger
  rationale: גִּבּוֹר bezeichnet hier angesichts des Schwertgerichts kampfstarke Männer; „Krieger“ ist eine klare, moderne Wiedergabe.
- source_word: וָחָתּוּ
  choice: sie werden den Mut verlieren
  rationale: חתת kann erschrecken, verzagen oder innerlich zusammenbrechen bezeichnen. Im militärischen Zusammenhang gibt „den Mut verlieren“ den psychischen Zusammenbruch idiomatisch wieder, ohne eine rein körperliche Zerschmetterung festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die zweimalige knappe Formel „Ein Schwert über …“ und die Ausrufezeichen erhalten den eindringlichen Rhythmus des hebräischen Gerichtsorakels. Der feminine Rückverweis in „ihre Krieger“ bezieht sich im Kontext auf Babylon.
