  to: 'Verkündet es unter den Völkern und macht es bekannt; richtet ein Banner auf! Macht es bekannt, verschweigt es nicht! Sagt: »Babylon ist erobert, Bel ist beschämt worden, Merodach[a] ist erschüttert. Ihre Götzenbilder sind beschämt worden, ihre Götzen sind erschüttert.[b]«'
