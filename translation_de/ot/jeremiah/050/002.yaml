id: JER.50.2
reference: Jeremiah 50:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַגִּ֨ידוּ בַ/גּוֹיִ֤ם וְ/הַשְׁמִ֨יעוּ֙ וּֽ/שְׂאוּ נֵ֔ס הַשְׁמִ֖יעוּ אַל תְּכַחֵ֑דוּ אִמְרוּ֩ נִלְכְּדָ֨ה בָבֶ֜ל הֹבִ֥ישׁ בֵּל֙ חַ֣ת מְרֹדָ֔ךְ הֹבִ֣ישׁוּ עֲצַבֶּ֔י/הָ חַ֖תּוּ גִּלּוּלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
translation:
  language: de
  text: 'Verkündet es unter den Völkern und macht es bekannt; richtet ein Banner auf! Macht es bekannt, verschweigt es nicht! Sagt: »Babylon ist erobert, Bel ist beschämt worden, Merodach[a] ist erschüttert. Ihre Götzenbilder sind beschämt worden, ihre Götzen sind erschüttert.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Merodach ist die hebräische Namensform des babylonischen Gottes, der gewöhnlich Marduk genannt wird.
    reason: historische Namensform
  - marker: b
    text: Das hier mit „Götzen“ wiedergegebene hebräische Wort ist stark verächtlich und kann an etwas Unreines oder Widerwärtiges denken lassen. Das mit „erschüttert“ übersetzte Wort kann auch „bestürzt“ oder „zerschmettert“ bedeuten.
    reason: lexikalische Mehrdeutigkeit und abwertende Wortwahl
lexical_decisions:
- source_word: הַגִּידוּ בַגּוֹיִם
  choice: Verkündet es unter den Völkern
  rationale: Der Hifil-Imperativ bezeichnet eine öffentliche Bekanntmachung; „unter den Völkern“ gibt den internationalen Geltungsbereich idiomatisch wieder. Das im Deutschen notwendige Objekt „es“ nimmt die folgende Botschaft auf.
- source_word: וְהַשְׁמִיעוּ / הַשְׁמִיעוּ
  choice: macht es bekannt / Macht es bekannt
  rationale: Die wiederholte Hifil-Form von שמע fordert, die Nachricht öffentlich hörbar zu machen. Die Wiederholung bleibt als rhetorische Verstärkung erhalten.
- source_word: וּשְׂאוּ נֵס
  choice: richtet ein Banner auf
  rationale: נֵס bezeichnet ein weithin sichtbares Signal oder Feldzeichen. „Banner“ bewahrt das Bild und ist gegenwärtig verständlich.
- source_word: אַל תְּכַחֵדוּ
  choice: verschweigt es nicht
  rationale: כחד bezeichnet hier das Zurückhalten oder Verheimlichen einer Nachricht. „Verschweigt es nicht“ passt unmittelbar zum Gebot öffentlicher Bekanntmachung.
- source_word: נִלְכְּדָה בָבֶל
  choice: Babylon ist erobert
  rationale: Der Nifal-Perfekt meldet Babylon als eingenommen; die deutsche Zustandsform eignet sich für den prophetischen Siegesruf.
- source_word: הֹבִישׁ / הֹבִישׁוּ
  choice: ist/sind zuschanden geworden
  rationale: Die Formen von בוש bezeichnen eingetretene Schande und Niederlage. „Zuschanden geworden“ wahrt den feierlichen Ton und die Wiederholung.
- source_word: בֵּל
  choice: Bel
  rationale: Der Gottesname wird entsprechend der hebräischen Form transliteriert.
- source_word: חַת / חַתּוּ
  choice: ist/sind gebrochen
  rationale: חתת kann Erschrecken, Zusammenbrechen oder Zerschmetterung ausdrücken. „Gebrochen“ wahrt die bildliche und sachliche Offenheit zwischen Bestürzung und Zusammenbruch, ohne ausschließlich physische Zerstörung festzulegen.
- source_word: מְרֹדָךְ
  choice: Merodach
  rationale: Die Wiedergabe folgt der hebräischen Namensform; die geläufigere Form „Marduk“ wird in der Fußnote genannt.
- source_word: עֲצַבֶּיהָ
  choice: ihre Götzenbilder
  rationale: עֲצַבִּים bezeichnet gestaltete Kultbilder. „Götzenbilder“ unterscheidet den Ausdruck vom folgenden, deutlich abwertenderen גִּלּוּלִים.
- source_word: גִּלּוּלֶיהָ
  choice: ihre Götzen
  rationale: „Götzen“ ist im Haupttext klar und natürlich; die besonders verächtliche Färbung des hebräischen Wortes wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe der babylonischen Gottesnamen
  choice: Die Namen werden als „Bel“ und „Merodach“ transliteriert.
  alternative: Die Gottheiten im Haupttext identifizieren oder „Merodach“ durch „Marduk“ ersetzen.
  rationale: Die hebräischen Namensformen bleiben sichtbar, während die historische Identifikation in der Fußnote zugänglich ist. So wird keine zusätzliche Deutung in den Haupttext eingeführt.
- issue: Bedeutung von חתת bei Merodach und den Götzen
  choice: „gebrochen“
  alternative: „bestürzt“, „erschüttert“ oder „zerschmettert“
  rationale: Das Wort kann sowohl Bestürzung als auch Zusammenbruch beziehungsweise Zerschmetterung bezeichnen. „Gebrochen“ lässt diese Spannung eher bestehen als eine rein psychologische oder rein physische Festlegung.
- issue: Abwertende Bezeichnung der Götzen
  choice: Im Haupttext „Götzen“, mit Erklärung der stärkeren Verachtung in der Fußnote.
  alternative: Im Haupttext „Mistgötzen“ oder „Scheusale“.
  rationale: Die natürliche Lesbarkeit bleibt gewahrt, ohne die polemische Kraft des Ausgangstextes zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit öffentlichem Verkündigungsrhythmus. Die Imperativfolge und die parallelen Wiederholungen des Hebräischen bleiben erhalten; notwendige deutsche Objektpronomen sorgen für natürliche Verständlichkeit.
