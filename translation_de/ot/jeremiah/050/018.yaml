reference: Jeremiah 50:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֥י פֹקֵ֛ד אֶל מֶ֥לֶךְ בָּבֶ֖ל וְ/אֶל אַרְצ֑/וֹ כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי אֶל מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe der Heerscharen, der Gott Israels: Siehe, ich werde den König von Babylon und sein Land bestrafen[a], wie ich den König von Assyrien bestraft habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann auch „heimsuchen“, „sich jemandes annehmen“ oder „zur Rechenschaft ziehen“ bedeuten. Hier hat es im Zusammenhang einen strafenden Sinn.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang knapp und natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feierliche prophetische Botenformel in geläufigem biblischem Deutsch.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als „Jahwe“ wieder und bewahrt mit „Heerscharen“ die traditionelle Breite des Titels, ohne ihn auf menschliche Heere zu beschränken.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: הִנְנִי
  choice: Siehe, ich werde
  rationale: „Siehe“ erhält das Aufmerksamkeitssignal; die Futurform gibt die angekündigte, unmittelbar bevorstehende Handlung idiomatisch wieder.
- source_word: פֹקֵד / פָּקַדְתִּי
  choice: bestrafen / bestraft habe
  rationale: פקד besitzt ein breites Bedeutungsspektrum, bezeichnet hier im Gerichtswort gegen Babylon und im Rückblick auf Assyrien jedoch eine strafende Zuwendung. Die einheitliche Wiedergabe erhält die Parallelität.
- source_word: אֶל
  choice: den … und sein Land
  rationale: Bei פקד markiert אֶל die von der strafenden Handlung Betroffenen; im Deutschen wird dies bei „bestrafen“ ohne Präposition durch den Akkusativ ausgedrückt.
- source_word: מֶלֶךְ בָּבֶל וְאֶל אַרְצוֹ
  choice: den König von Babylon und sein Land
  rationale: Sachlich genaue und im Deutschen natürliche Wiedergabe der beiden Gegenstände des angekündigten Gerichts.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Leitet den Vergleich mit dem bereits vollzogenen Gericht an Assyrien klar und knapp ein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von פקד im Gerichtswort
  choice: bestrafen
  alternative: heimsuchen; sich vornehmen; zur Rechenschaft ziehen
  rationale: Der Zusammenhang kündigt Babylon dasselbe Gericht an, das Assyrien bereits getroffen hat. „Bestrafen“ macht den hier vorliegenden gerichtlichen Sinn deutlich, während die Fußnote die lexikalische Spannweite wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel. „Siehe“ und „Heerscharen“ halten den feierlichen Ton, während Satzbau und Verbwahl für heutige Leser verständlich bleiben.
