id: JER.50.12
reference: Jeremiah 50:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
translation:
  language: de
  text: 'Eure Mutter wird sich sehr schämen; die euch geboren hat, wird beschämt sein. Seht: Sie wird die Letzte unter den Völkern sein[a], eine Wildnis, dürres Land und eine Steppe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geringste unter den Völkern“. Der hebräische Ausdruck kann Babylons endgültige, herabgesetzte Stellung unter den Völkern bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשָׁה
  choice: wird sich ... schämen
  rationale: Das Qal-Perfekt bezeichnet im prophetischen Gerichtswort eine gewiss eintretende Zukunft. Die reflexive Form ist im modernen Deutsch natürlich und benennt keinen im Hebräischen ausdrücklich genannten äußeren Verursacher.
- source_word: אִמְּכֶם
  choice: eure Mutter
  rationale: Die wörtliche mütterliche Metapher für Babylon bleibt erhalten, statt sie im Haupttext als Mutterstadt oder Mutterland auszudeuten.
- source_word: מְאֹד
  choice: sehr
  rationale: Der gebräuchliche deutsche Verstärker gibt die Intensität klar und natürlich wieder.
- source_word: חָפְרָה
  choice: wird gedemütigt dastehen
  rationale: Die Wendung wahrt den Zukunftsbezug und unterscheidet den Zustand der Beschämung sprachlich vom vorausgehenden Sich-Schämen.
- source_word: יֽוֹלַדְתְּכֶם
  choice: die euch geboren hat
  rationale: Die feminine Bezeichnung der Gebärenden und der poetische Parallelismus zu „eure Mutter“ werden unmittelbar bewahrt.
- source_word: הִנֵּה
  choice: Seht
  rationale: Der Aufmerksamkeitsruf wird in gegenwärtigem, verständlichem und dennoch würdigem Deutsch wiedergegeben.
- source_word: אַחֲרִית גּוֹיִם
  choice: die Letzte unter den Völkern
  rationale: Die Formulierung bewahrt die mögliche Bedeutung eines letzten beziehungsweise herabgesetzten Ranges, ohne die Mehrdeutigkeit vorschnell auf „geringste“ festzulegen.
- source_word: מִדְבָּר
  choice: eine Wildnis
  rationale: Im Gerichtskontext bezeichnet das Wort ein verwüstetes, unbewohntes Gebiet; zugleich bleibt es von den folgenden Landschaftsbegriffen unterschieden.
- source_word: צִיָּה
  choice: dürres Land
  rationale: Die Wendung gibt Trockenheit und Verödung idiomatisch wieder.
- source_word: וַעֲרָבָה
  choice: und eine Steppe
  rationale: עֲרָבָה bezeichnet eine trockene, wüstenartige Ebene. „Steppe“ hält diesen Begriff von מִדְבָּר und צִיָּה unterscheidbar.
theological_decisions:
- issue: Personifikation Babylons als Mutter und Gebärende
  choice: Die mütterliche Metapher bleibt unmittelbar im Haupttext erhalten.
  alternative: Die Metapher im Haupttext als „Mutterstadt“ oder „Mutterland“ erklären.
  rationale: Der hebräische Text gestaltet Babylons Erniedrigung poetisch als Schande einer Mutter. Eine direkte Wiedergabe vermeidet eine unnötige interpretierende Festlegung.
- issue: Zeitwert der prophetischen Perfektformen
  choice: Die beiden einleitenden Verben werden zukünftig wiedergegeben.
  alternative: 'Resultativ oder gegenwärtig übersetzen: „schämt sich/ist beschämt“ und „steht gedemütigt da“.'
  rationale: Im prophetischen Gerichtswort stellen die Perfektformen das angekündigte Geschehen als gewiss dar; das deutsche Futur vermittelt diese Diskursfunktion klar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Seht“ ersetzt das heute stärker altertümlich wirkende „Siehe“. Die dreigliedrige Landschaftsfolge wird mit unterscheidbaren deutschen Begriffen bewahrt.
