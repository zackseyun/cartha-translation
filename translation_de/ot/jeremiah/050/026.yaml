  text: בֹּֽאוּ לָ֤/הּ מִ/קֵּץ֙ פִּתְח֣וּ מַאֲבֻסֶ֔י/הָ סָלּ֥וּ/הָ כְמוֹ עֲרֵמִ֖ים וְ/הַחֲרִימ֑וּ/הָ אַל תְּהִי לָ֖/הּ שְׁאֵרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
translation:
  language: de
  text: Kommt von der äußersten Grenze her gegen sie[a]; öffnet ihre Vorratshäuser[b]! Häuft sie zu Haufen auf und weiht sie der Vernichtung[c]; kein Rest soll von ihr übrig bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Ende her“ oder „vom äußersten Rand her“. Gemeint sein können die fernsten Gebiete.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Kornspeicher“, „ihre Scheunen“ oder „ihre Futterplätze“. Das hebräische Wort bezeichnet einen Ort für Futter und kann hier auf Vorratslager bezogen sein.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Verb bezeichnet die Übergabe unter den Bann, hier zur vollständigen Vernichtung. Auch möglich: „vollstreckt an ihr den Bann“ oder „vernichtet sie völlig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ לָהּ
  choice: Kommt … gegen sie
  rationale: בוא im Imperativ ruft die angreifenden Mächte herbei; לָהּ erhält im feindlichen Zusammenhang die adversative Bedeutung „gegen sie“.
- source_word: מִקֵּץ
  choice: von der äußersten Grenze her
  rationale: קֵץ bezeichnet ein Ende oder äußerstes Gebiet. Die Formulierung wahrt die räumliche Bedeutung, ohne das im Hebräischen nicht ausdrücklich genannte „Land“ einzufügen.
- source_word: מַאֲבֻסֶיהָ
  choice: ihre Vorratshäuser
  rationale: מַאֲבוּס kann einen Futterplatz, Trog oder Stall bezeichnen; im Kontext der Eroberung sind vermutlich Aufbewahrungsorte für Vorräte gemeint.
- source_word: סָלּוּהָ כְמוֹ עֲרֵמִים
  choice: Schüttet sie auf wie Haufen
  rationale: סלל bezeichnet hier das Aufschütten oder Anhäufen. Die ungewöhnliche Bildsprache und der weibliche Objektbezug auf Babylon bleiben erhalten.
- source_word: וְהַחֲרִימוּהָ
  choice: und weiht sie dem Untergang
  rationale: Die Hiphil-Form von חרם meint, etwas dem Bann und damit vollständiger Vernichtung zu übergeben. „Dem Untergang weihen“ bewahrt sowohl den Weihe- als auch den Vernichtungsaspekt.
- source_word: אַל תְּהִי לָהּ שְׁאֵרִית
  choice: kein Rest soll von ihr übrig bleiben
  rationale: שְׁאֵרִית kann Rest, Überrest oder eine Gruppe Überlebender bezeichnen. Die Übersetzung lässt offen, ob Sachen oder Menschen im Blick sind.
theological_decisions:
- issue: Wiedergabe von החרים im Gerichtswort
  choice: weiht sie dem Untergang
  alternative: vernichtet sie völlig; vollstreckt an ihr den Bann
  rationale: Die gewählte Fassung beschränkt das Verb weder auf bloße Zerstörung noch setzt sie ein heutiges Verständnis des Wortes „Bann“ voraus. Sie erhält den Gedanken einer unwiderruflichen Übergabe zur Vernichtung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit imperativischem Rhythmus. Die weiblichen Pronomen beziehen sich auf Babylon. Die fremdartige Metapher des Aufschüttens bleibt bewusst stehen; die Fußnoten erklären die wichtigsten lexikalischen Unsicherheiten.
