source:
  edition: WLC
  text: עַל הָ/אָ֤רֶץ מְרָתַ֨יִם֙ עֲלֵ֣ה עָלֶ֔י/הָ וְ/אֶל יוֹשְׁבֵ֖י פְּק֑וֹד חֲרֹ֨ב וְ/הַחֲרֵ֤ם אַֽחֲרֵי/הֶם֙ נְאֻם יְהוָ֔ה וַ/עֲשֵׂ֕ה כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
translation:
  language: de
  text: Zieh gegen das Land Meratajim[a] hinauf, gegen es und gegen die Bewohner von Pekod[b]! Töte sie mit dem Schwert und weihe sie der Vernichtung, ihnen hinterher[c], spricht Jahwe, und tu alles, was ich dir befohlen habe!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meratajim ist wahrscheinlich eine symbolische Bezeichnung für Babylon. Der Name kann wie „doppelte Auflehnung“ oder möglicherweise wie „doppelte Bitterkeit“ klingen.
    reason: lexical_alternative
  - marker: b
    text: Pekod ist der Name eines Ortes oder einer Volksgruppe; zugleich kann er an ein hebräisches Wort für „Heimsuchung“ oder „Bestrafung“ erinnern.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „weihe sie der Vernichtung hinter ihnen her“. Der hebräische Bannbegriff bezeichnet die Weihe zur Vernichtung; die Verbindung von „ihnen hinterher“ mit dem Befehl ist schwer zu deuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרָתַיִם
  choice: Meratajim
  rationale: Das Wort wird seiner syntaktischen Funktion entsprechend als Eigenname wiedergegeben. Die deutsche Umschrift bewahrt den hebräischen Namen; sein mögliches Wortspiel wird in einer Fußnote erläutert.
- source_word: עֲלֵה
  choice: Zieh ... hinauf
  rationale: עלה bezeichnet im militärischen Zusammenhang das Hinaufziehen beziehungsweise Vorrücken gegen ein Gebiet. Die Wiedergabe bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: יוֹשְׁבֵי
  choice: Bewohner von
  rationale: Das Partizip von ישב bezeichnet kollektiv die in Pekod Wohnenden. „Bewohner von“ ist knapp und natürlich.
- source_word: פְּקוֹד
  choice: Pekod
  rationale: Pekod wird hier als Orts- oder Volksname behandelt. Ein möglicher Anklang an פקד wird nicht interpretierend in den Haupttext eingesetzt, sondern in der Fußnote offengehalten.
- source_word: חֲרֹב
  choice: Erschlage sie
  rationale: Die knappe, imperativische Form bezeichnet im Zusammenhang gewaltsames Töten. „Erschlage sie“ bewahrt die Härte des Gerichtswortes, ohne sie durch einen allgemeineren Ausdruck abzuschwächen.
- source_word: וְהַחֲרֵם
  choice: vollstrecke ... den Bann
  rationale: Die Hifilform von חרם bezeichnet das dem Bann Übergeben und damit die Weihe zur Vernichtung. „Den Bann vollstrecken“ hält den besonderen kultisch-gerichtlichen Begriff fest.
- source_word: אַחֲרֵיהֶם
  choice: hinter ihnen her
  rationale: Die schwierige Wendung bedeutet wörtlich „hinter ihnen/nach ihnen“. „Hinter ihnen her“ wahrt die räumlich-verfolgende Vorstellung, ohne die syntaktische Unklarheit vorschnell als bloß zeitliches „danach“ aufzulösen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben; der Gottesname יהוה bleibt als Jahwe erhalten.
- source_word: וַעֲשֵׂה כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: und tu alles, was ich dir befohlen habe
  rationale: Die Formulierung gibt den umfassenden Gehorsamsanspruch von כְכֹל klar und idiomatisch wieder.
theological_decisions:
- issue: Härte der Gerichts- und Bannsprache
  choice: Die militärische Tötungs- und Bannterminologie wird ungemildert mit „erschlage“ und „den Bann vollstrecken“ wiedergegeben.
  alternative: Allgemeinere Ausdrücke wie „besiege“ oder „vernichte“ verwenden.
  rationale: Der hebräische Text verbindet gewaltsame Tötung mit dem besonderen Begriff חרם. Eine Abschwächung würde die theologische Spannung des göttlichen Gerichtswortes verdecken.
- issue: Deutung der symbolisch klingenden Namen
  choice: Meratajim und Pekod bleiben im Haupttext Eigennamen; mögliche Wortspiele stehen in den Fußnoten.
  alternative: Die Namen als „Doppelte Auflehnung“, „Doppelte Bitterkeit“ beziehungsweise „Strafe“ übersetzen.
  rationale: Beide Wörter fungieren syntaktisch als Namen. Die Umschrift vermeidet eine Festlegung darauf, ob geografische Bezeichnung, symbolische Benennung oder beides gemeint ist.
- issue: Bedeutung von אַחֲרֵיהֶם
  choice: Die schwer verständliche räumliche Wendung bleibt mit „hinter ihnen her“ erkennbar.
  alternative: Glättend „danach“ oder deutend „verfolge sie“ übersetzen.
  rationale: Der Ausgangstext lässt die genaue Beziehung der Wendung zum Bannbefehl offen. Die Übersetzung soll diese Unschärfe nicht durch eine eindeutige zeitliche oder militärische Deutung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-militärischem Ton. Die direkte Anrede bleibt im Singular, wie im Hebräischen. Die ungewöhnliche Wiederholung „gegen es“ und die schwierige Wendung „hinter ihnen her“ werden bewusst nicht vollständig geglättet, damit Struktur und Mehrdeutigkeit des Ausgangstextes sichtbar bleiben.
