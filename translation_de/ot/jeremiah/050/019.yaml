source:
  edition: WLC
  text: וְ/שֹׁבַבְתִּ֤י אֶת יִשְׂרָאֵל֙ אֶל נָוֵ֔/הוּ וְ/רָעָ֥ה הַ/כַּרְמֶ֖ל וְ/הַ/בָּשָׁ֑ן וּ/בְ/הַ֥ר אֶפְרַ֛יִם וְ/הַ/גִּלְעָ֖ד תִּשְׂבַּ֥ע נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
translation:
  language: de
  text: Ich werde Israel zu seiner Weide zurückbringen. Es wird auf dem Karmel und im Baschan weiden; und im Bergland Ephraims und in Gilead wird es satt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Seine Seele wird satt werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  choice: Ich werde … zurückbringen
  rationale: Die Kausativbedeutung von שוב bezeichnet hier das Zurückführen Israels; „zurückbringen“ bewahrt sowohl die konkrete Bewegung als auch den Gedanken der Wiederherstellung.
- source_word: נָוֵהוּ
  choice: zu seiner Weide
  rationale: נָוֶה kann Wohnstätte, Weideplatz oder Hürde bezeichnen. Das folgende Weiden macht „Weide“ im Hirtenbild am stimmigsten.
- source_word: וְרָעָה
  choice: Es wird … weiden
  rationale: רעה bezeichnet hier das Grasen einer als Herde dargestellten Gemeinschaft. „weiden“ erhält das Bild und ist im Deutschen auch intransitiv gebräuchlich.
- source_word: הַכַּרְמֶל
  choice: der Karmel
  rationale: Der geografische Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: הַבָּשָׁן
  choice: Baschan
  rationale: Der regionale Eigenname wird nach gebräuchlicher deutscher biblischer Schreibweise transliteriert.
- source_word: וּבְהַר אֶפְרַיִם
  choice: im Bergland Ephraims
  rationale: הַר bezeichnet hier nicht nur einen einzelnen Berg, sondern die gebirgige Region Ephraims.
- source_word: וְהַגִּלְעָד
  choice: und in Gilead
  rationale: Gilead ist ein regionaler Eigenname; die Präposition wird entsprechend der parallelen Ortsangabe im Deutschen ergänzt.
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  choice: wird sein Hunger gestillt werden
  rationale: Wörtlich heißt die Wendung „seine Seele wird satt werden“. Im Zusammenhang von Weide und Nahrung bezeichnet נֶפֶשׁ das hungrige, begehrende Selbst; „sein Hunger“ gibt den konkreten Sinn natürlich wieder, während die wörtlichere Form in der Fußnote erhalten bleibt.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Eigenname bezeichnet das Volk als eine einzige, personifizierte Größe.
theological_decisions:
- issue: Israel als singularische, personifizierte Größe
  choice: 'Israel wird im Singular aufgenommen: „Es … sein“.'
  alternative: Pluralische Wiedergabe mit „sie … ihr“ für das Volk als Gemeinschaft.
  rationale: Die hebräischen Verb- und Pronominalformen stehen im Singular. Das grammatisch neutrale deutsche Pronomen „es“ nimmt den Namen Israel natürlich auf und bewahrt zugleich den singularischen Charakter der Darstellung.
- issue: Bedeutung von נֶפֶשׁ im Nahrungskontext
  choice: Im Haupttext kontextgemäß „sein Hunger“.
  alternative: Wörtlicher „seine Seele“.
  rationale: נֶפֶשׁ meint hier im Hirten- und Nahrungsbild nicht ausdrücklich eine vom Körper getrennte Seele, sondern das lebendige, verlangende Selbst. Die Fußnote macht die wörtliche Form transparent, ohne dem Haupttext eine engere anthropologische Deutung aufzuzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das durchgehende Weidebild bleibt erhalten; geografische Namen folgen geläufigen deutschen Formen. Die Satzgliederung macht die beiden Weideregionen und die abschließende Sättigung klar, ohne die poetische Parallelität einzuebnen.
