source:
  edition: WLC
  text: וּ/מִן אָ֡ז חָדַ֜לְנוּ לְ/קַטֵּ֨ר לִ/מְלֶ֧כֶת הַ/שָּׁמַ֛יִם וְ/הַסֵּֽךְ לָ֥/הּ נְסָכִ֖ים חָסַ֣רְנוּ כֹ֑ל וּ/בַ/חֶ֥רֶב וּ/בָ/רָעָ֖ב תָּֽמְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/018.yaml
  text: But from the time we stopped burning incense to the Queen of Heaven and pouring out drink offerings to her[a], we have lacked everything[c][b], and we have been consumed by the sword and by famine.
translation:
  language: de
  text: Doch seitdem wir aufgehört haben, der Himmelskönigin[a] Räucherwerk darzubringen und für sie Trankopfer auszugießen, fehlt es uns an allem, und durch Schwert und Hunger sind wir umgekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Himmelskönigin“ ist hier der Titel der Göttin, die von den Sprechern verehrt wurde.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִן אָז חָדַלְנוּ
  choice: Doch seitdem wir aufgehört haben
  rationale: Die Formulierung bezeichnet den zeitlichen Ausgangspunkt der von den Sprechern behaupteten Entwicklung. „Doch seitdem“ gibt zugleich den Gegensatz zum vorherigen Zusammenhang und den zeitlichen Sinn natürlich wieder.
- source_word: לְקַטֵּר
  choice: Räucherwerk darzubringen
  rationale: Das Verb bezeichnet im kultischen Zusammenhang das Verbrennen beziehungsweise Darbringen von Räucherwerk. Die gewählte Formulierung ist im Deutschen klar und würdig.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: der Himmelskönigin
  rationale: Die Wendung fungiert hier als Titel der von den Sprechern verehrten Göttin. „Himmelskönigin“ ist die natürliche deutsche Entsprechung.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: und für sie Trankopfer auszugießen
  rationale: Die Wörter bezeichnen den rituellen Vollzug einer Libation. „Trankopfer ausgießen“ bildet Handlung und Opferart präzise ab.
- source_word: חָסַרְנוּ כֹל
  choice: fehlt es uns an allem
  rationale: חסר bezeichnet Mangel, und כֹל weitet ihn umfassend aus. Die deutsche Wendung ist idiomatisch und bewahrt diese Aussage.
- source_word: וּבַחֶרֶב וּבָרָעָב תָּמְנוּ
  choice: und durch Schwert und Hunger sind wir umgekommen
  rationale: תמם bezeichnet hier das Zu-Ende-Kommen beziehungsweise Zugrundegehen; die Präposition ב nennt Schwert und Hunger als Mittel oder Umstände. „Umgekommen“ gibt das Ergebnis natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich genanntes handelndes Subjekt einzuführen.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels מְלֶכֶת הַשָּׁמַיִם
  choice: Himmelskönigin
  alternative: Königin des Himmels / Königin der Himmel
  rationale: Der Ausdruck ist im Vers der Titel einer verehrten Göttin. Die Übersetzung bewahrt den Titel, ohne ihn mit späteren christlichen Verwendungen gleichzusetzen oder die im Text geschilderte Verehrung theologisch umzudeuten.
- issue: Kausalbehauptung der Sprecher
  choice: Die zeitliche Verknüpfung wird wiedergegeben, ohne sie ausdrücklich als objektiv wahre Ursache zu bestätigen.
  alternative: Eine kausale Erweiterung wie „weil wir aufgehört haben“
  rationale: Die Sprecher führen ihren Mangel und ihr Sterben auf das Ende des Kultes zurück. Das Hebräische formuliert jedoch zunächst einen zeitlichen Zusammenhang; daher wird keine stärkere kausale Aussage in die Übersetzung eingefügt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Erzählton. Kultische Fachbegriffe werden dort beibehalten, wo sie allgemein verständlich sind; unnötig altertümliche Wendungen werden vermieden.
