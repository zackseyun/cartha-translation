  text: הֲ/ל֣וֹא אֶת הַ/קִּטֵּ֗ר אֲשֶׁ֨ר קִטַּרְתֶּ֜ם בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם אַתֶּ֧ם וַ/אֲבֽוֹתֵי/כֶ֛ם מַלְכֵי/כֶ֥ם וְ/שָׂרֵי/כֶ֖ם וְ/עַ֣ם הָ/אָ֑רֶץ אֹתָ/ם֙ זָכַ֣ר יְהוָ֔ה וַֽ/תַּעֲלֶ֖ה עַל לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/021.yaml
  text: Was it not the incense that you burned in the cities of Judah and in the streets of Jerusalem—you and your fathers[a], your kings and your officials, and the people of the land—that Yahweh remembered, and it came up upon his heart?
translation:
  language: de
  text: War es nicht die Räucheropfer, die ihr in den Städten Judas und auf den Straßen Jerusalems dargebracht habt – ihr und eure Vorfahren, eure Könige und eure Oberen und das Volk des Landes –, an die Jahwe sich erinnerte und die ihm in den Sinn kamen[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie stiegen auf sein Herz“. Das hebräische Herz-Idiom bezeichnet hier, dass die Räucheropfer in Jahwes inneres Wahrnehmen oder Erinnern kamen.'
    reason: Das hebräische Bild wird in der Anmerkung dokumentiert, während der Haupttext die Funktion des Idioms in natürlichem modernem Deutsch wiedergibt.
lexical_decisions:
- source_word: הֲלוֹא
  choice: War es nicht
  rationale: Bewahrt die rhetorische Frage, die Zustimmung erwartet, in natürlichem Deutsch.
- source_word: אֶת הַקִּטֵּר אֲשֶׁר קִטַּרְתֶּם
  choice: das Räucherwerk, das ihr … verbrannt habt
  rationale: Gibt das kultische Verb und sein substantiviertes Objekt prägnant wieder; „Räucherwerk verbrennen“ ist im Deutschen verständlich und vermeidet eine unnötig erklärende Paraphrase.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: in den Städten Judas und auf den Straßen Jerusalems
  rationale: חֻצוֹת kann Straßen oder öffentliche Plätze bezeichnen; „Straßen“ ist hier eine natürliche, nicht überdeutende Wiedergabe.
- source_word: אַתֶּם וַאֲבוֹתֵיכֶם
  choice: ihr und eure Vorfahren
  rationale: „Vorfahren“ vermittelt den generationsübergreifenden Sinn im heutigen Deutsch natürlicher als das missverständliche „Väter“.
- source_word: מַלְכֵיכֶם וְשָׂרֵיכֶם
  choice: eure Könige und eure führenden Männer
  rationale: שָׂרִים bezeichnet ranghohe Verantwortungsträger; „führende Männer“ ist historisch passend und vermeidet die mögliche Verengung von „Fürsten“ auf königliche Söhne.
- source_word: וְעַם הָאָרֶץ
  choice: und das Volk des Landes
  rationale: Bewahrt die offene, möglicherweise sozial oder politisch geprägte hebräische Wendung, ohne sie als bestimmte Gesellschaftsschicht festzulegen.
- source_word: אֹתָם זָכַר יְהוָה
  choice: Daran erinnerte sich Jahwe
  rationale: Das maskuline Pluralpronomen greift die genannten Räucherhandlungen beziehungsweise die gesamte Praxis auf; „daran“ ist im Deutschen idiomatisch, ohne den Bezug unnötig zu verengen.
- source_word: וַתַּעֲלֶה עַל לִבּוֹ
  choice: und es stieg ihm zu Herzen
  rationale: Bewahrt die Bewegungsrichtung und das anthropomorphe Bild des hebräischen Idioms. Das feminine Singularverb kann kollektiv auf die Räucherhandlung beziehungsweise die Sache zurückweisen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass der im Ausgangstext ausdrücklich verwendete Gottesname erkennbar bleibt.
- issue: Anthropomorphe Redeweise עַל לִבּוֹ
  choice: es stieg ihm zu Herzen
  alternative: es kam ihm in den Sinn
  rationale: Die Übersetzung erhält das Bild vom Herzen als innerem Ort des Erinnerns und Erwägens, statt es rein kognitiv aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage wird zur besseren Lesbarkeit vor dem anschließenden Aussagesatz abgeschlossen. Der Gedankenstrich hebt die umfassende Aufzählung der Beteiligten hervor; das anthropomorphe Herzbild bleibt bewusst erhalten.
