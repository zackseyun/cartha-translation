  naturalness: „Räucheropfer“ und „Oberen“ sind in diesem kultisch-administrativen Kontext natürliche, verständliche Wiedergaben. Die Konstruktion „die ihm in den Sinn kamen“ ist modernes Standarddeutsch; die Fußnote bewahrt das hebräische Herzbild.
