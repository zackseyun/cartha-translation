  to: War es nicht die Räucheropfer, die ihr in den Städten Judas und auf den Straßen Jerusalems dargebracht habt – ihr und eure Vorfahren, eure Könige und eure Oberen und das Volk des Landes –, an die Jahwe sich erinnerte und die ihm in den Sinn kamen[a]?
