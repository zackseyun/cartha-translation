  variant: modern standard German
source:
  edition: WLC
  text: כֹּה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַתֶּ֣ם רְאִיתֶ֗ם אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֤ר הֵבֵ֨אתִי֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֖ל כָּל עָרֵ֣י יְהוּדָ֑ה וְ/הִנָּ֤/ם חָרְבָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וְ/אֵ֥ין בָּ/הֶ֖ם יוֹשֵֽׁב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: You yourselves have seen all the disaster that I brought on Jerusalem and on all the cities of Judah. And behold, they are a ruin this day[b], and there is no one living in them.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen[a], der Gott Israels: Ihr selbst habt all das Unheil gesehen, das ich über Jerusalem und über alle Städte Judas gebracht habe. Seht, sie liegen heute in Trümmern[b], und niemand wohnt in ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Jahwe der Heere«.'
    reason: „Heerscharen“ gibt צְבָאוֹת im Gottesnamen umfassend wieder; „Heere“ ist eine mögliche, etwas knappere Alternative, ohne den Bezug auf ausschließlich himmlische Heere einzuengen.
  - marker: b
    text: 'Wörtlich etwa: »Sie sind an diesem Tag eine Verwüstung«; auch: »Sie sind heute verwüstet«.'
    reason: חָרְבָּה ist ein nominaler Ausdruck für Verwüstung, Ödland oder Ruinen. Die Hauptübersetzung gibt den Zustand idiomatisch wieder.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil und gibt das hebräische Perfekt idiomatisch im Präsens wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die etablierte, semantisch breite Wiedergabe umfasst himmlische wie irdische Scharen und passt zum würdevollen Register des Gottesnamens.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: אַתֶּם רְאִיתֶם
  choice: Ihr selbst habt ... gesehen
  rationale: „Ihr selbst“ bildet die Betonung durch das ausdrücklich gesetzte Personalpronomen ab; das Perfekt bezeichnet das von den Angeredeten persönlich Erlebte mit gegenwärtiger Relevanz.
- source_word: כָּל הָרָעָה
  choice: all das Unheil
  rationale: רָעָה bezeichnet hier die von Gott herbeigeführte Gerichtskatastrophe, nicht moralische Bosheit. „Unheil“ wahrt diesen Sinn und den bestimmten Gesamtbezug.
- source_word: הֵבֵאתִי עַל
  choice: das ich über ... gebracht habe
  rationale: „Unheil über jemanden bringen“ ist im Deutschen eine natürliche Entsprechung der kausativen Wendung mit עַל.
- source_word: עָרֵי יְהוּדָה
  choice: die Städte Judas
  rationale: Konventionelle und sachlich passende Wiedergabe; עִיר kann je nach Größe auch eine Ortschaft bezeichnen.
- source_word: וְהִנָּם
  choice: Seht, sie
  rationale: Die Aufforderung „Seht“ gibt die aufmerksamkeitslenkende Kraft der deiktischen Partikel wieder und greift den pluralischen Rückbezug auf.
- source_word: חָרְבָּה הַיּוֹם הַזֶּה
  choice: liegen heute in Trümmern
  rationale: Die idiomatische deutsche Formulierung vermittelt den Zustand der Verwüstung; „heute“ entspricht dem demonstrativ bestimmten Zeitausdruck ohne einen zusätzlichen durativen Sinn einzutragen.
- source_word: וְאֵין בָּהֶם יוֹשֵׁב
  choice: und niemand wohnt in ihnen
  rationale: Natürliche deutsche Wiedergabe der Existenzverneinung mit dem Partizip „wohnend“ und dem pluralischen Ortsbezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Gott als Urheber des Unheils
  choice: „das ich ... gebracht habe“ wird ausdrücklich beibehalten
  alternative: passive oder unpersönliche Formulierung wie „das über Jerusalem kam“
  rationale: Der hebräische Text schreibt das Gericht in der ersten Person direkt Jahwe zu. Diese theologische Spannung darf nicht durch Abschwächung oder Passivierung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten prophetischen Formel „So spricht“. „Heerscharen“ ist bewusst gehoben, aber im biblischen Register verständlich. „Seht“ erhält den deiktischen Nachdruck, ohne das heute deutlich altertümlichere „siehe“ zu verwenden.
