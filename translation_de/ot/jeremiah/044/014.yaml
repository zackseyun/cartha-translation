source:
  edition: WLC
  text: וְ/לֹ֨א יִהְיֶ֜ה פָּלִ֤יט וְ/שָׂרִיד֙ לִ/שְׁאֵרִ֣ית יְהוּדָ֔ה הַ/בָּאִ֥ים לָ/גֽוּר שָׁ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לָ/שׁ֣וּב אֶ֣רֶץ יְהוּדָ֗ה אֲשֶׁר הֵ֜מָּה מְנַשְּׂאִ֤ים אֶת נַפְשָׁ/ם֙ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת שָׁ֔ם כִּ֥י לֹֽא יָשׁ֖וּבוּ כִּ֥י אִם פְּלֵטִֽים־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/014.yaml
  text: So there will be no fugitive or survivor for the remnant of Judah who are coming to sojourn there in the land of Egypt and then to return to the land of Judah[a], to which they are lifting up their soul to return and dwell there; for they will not return, except for fugitives.
translation:
  language: de
  text: Für die Übriggebliebenen aus Juda, die nach Ägypten gekommen sind, um dort als Fremde zu leben und in das Land Juda zurückzukehren, wird es keinen Entkommenen und keinen Überlebenden geben – in das Land, nach dem sie sich sehnen, um dorthin zurückzukehren und dort zu wohnen. Denn sie werden nicht zurückkehren, außer Entkommenen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie erheben ihre Seele“ – eine hebräische Wendung für starkes Verlangen oder Sehnsucht.'
    reason: Das hebräische Sprachbild ist in einer wörtlichen deutschen Wiedergabe schwer verständlich; die Fußnote dokumentiert es, während der Haupttext die idiomatische Bedeutung wiedergibt.
lexical_decisions:
- source_word: פָּלִיט וְשָׂרִיד
  choice: entkommen oder übrig bleiben
  rationale: 'Die beiden unterschiedlichen Begriffe werden verbal und idiomatisch wiedergegeben: פָּלִיט bezeichnet einen Entkommenen, שָׂרִיד einen nach dem Gericht Übriggebliebenen.'
- source_word: שְׁאֵרִית יְהוּדָה
  choice: der Rest Judas
  rationale: „Rest“ bezeichnet hier sachlich die verbliebene judäische Bevölkerungsgruppe, ohne ihr eine positive geistliche Wertung beizulegen.
- source_word: הַבָּאִים לָגוּר שָׁם
  choice: der gekommen ist, um sich dort … als Fremder aufzuhalten
  rationale: Der substantivierte Plural wird im Deutschen nach dem Kollektivsingular „Rest“ im Singular aufgenommen. גור bezeichnet den Aufenthalt als Fremder oder zeitweiliger Bewohner; das Perfekt „ist gekommen“ entspricht im Kontext einer bereits vollzogenen Übersiedlung nach Ägypten.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: im Land Ägypten
  rationale: Die ausdrückliche Nennung von אֶרֶץ bleibt erhalten und wahrt den feierlichen Stil des Gerichtswortes.
- source_word: וְלָשׁוּב אֶרֶץ יְהוּדָה
  choice: und ins Land Juda zurückkehren
  rationale: Der Infinitiv wird als Fortführung dessen verstanden, was den Überlebenden verwehrt bleibt. Diese syntaktisch natürliche Lesart vermeidet den missverständlichen Eindruck, die Judäer seien zugleich nach Ägypten und nach Juda gekommen.
- source_word: מְנַשְּׂאִים אֶת נַפְשָׁם
  choice: sie sehnen sich danach
  rationale: Die wörtliche Wendung „ihre Seele erheben“ bezeichnet ein starkes Verlangen. Eine idiomatische Wiedergabe ist im modernen Deutschen verständlicher; das hebräische Bild wird in der Fußnote dokumentiert.
- source_word: לָשׁוּב לָשֶׁבֶת שָׁם
  choice: zurückzukehren und dort zu wohnen
  rationale: Die beiden Infinitive bezeichnen das erhoffte Zurückkehren und anschließende Wohnen im Land Juda.
- source_word: כִּי אִם פְּלֵטִים
  choice: abgesehen von einigen Entkommenen
  rationale: Die Wendung formuliert eine begrenzte Ausnahme. „Einigen“ macht im Deutschen deutlich, dass nur eine kleine Gruppe von Entkommenen gemeint ist, ohne eine genaue Zahl einzutragen.
theological_decisions:
- issue: Theologische Wertung des „Restes Judas“
  choice: „Rest Judas“ wird rein historisch-beschreibend verstanden.
  alternative: „Treuer Rest Judas“ oder eine andere positiv heilsgeschichtliche Kennzeichnung.
  rationale: Der Zusammenhang spricht von den in Ägypten lebenden Judäern unter dem Gericht. Der Vers kennzeichnet sie nicht als treue oder besonders erwählte Gruppe.
- issue: Spannung zwischen umfassendem Gericht und der Ausnahme am Versende
  choice: Sowohl die Aussage, dass niemand entkommen und zurückkehren wird, als auch die Ausnahme einiger Entkommener bleibt ausdrücklich stehen.
  alternative: Die Ausnahme abzuschwächen oder die erste Aussage so umzuformulieren, dass kein scheinbarer Gegensatz mehr besteht.
  rationale: Der hebräische Text stellt die umfassende Gerichtsaussage und die begrenzte Ausnahme unmittelbar nebeneinander; diese Spannung darf nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde gegenüber dem langen hebräischen Satz gegliedert, um die Bezüge verständlich zu machen. „Als Fremder aufhalten“ bewahrt die Nuance eines nicht dauerhaft gesicherten Aufenthalts; „Entkommene“ hält die Wortverbindung zwischen פָּלִיט und פְּלֵטִים sichtbar.
