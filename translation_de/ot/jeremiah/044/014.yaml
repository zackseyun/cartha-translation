revisions:
- from: Vom Rest Judas, der gekommen ist, um sich dort im Land Ägypten als Fremder aufzuhalten, wird niemand entkommen oder übrig bleiben und ins Land Juda zurückkehren. Dabei sehnen sie sich danach[a], zurückzukehren und dort zu wohnen. Doch sie werden nicht zurückkehren, abgesehen von einigen Entkommenen.
  to: Für die Übriggebliebenen aus Juda, die nach Ägypten gekommen sind, um dort als Fremde zu leben und in das Land Juda zurückzukehren, wird es keinen Entkommenen und keinen Überlebenden geben – in das Land, nach dem sie sich sehnen, um dorthin zurückzukehren und dort zu wohnen. Denn sie werden nicht zurückkehren, außer Entkommenen.[a]
  rationale: Die Revision stellt die hebräischen Infinitive wieder zur Beschreibung des Ziels der nach Ägypten Gekommenen und nicht zur Folge des Entkommens. Die idiomatische Wiedergabe von „ihre Seele erheben“ bleibt durch die Fußnote transparent. Die unbelegte Einschränkung „einigen“ wurde entfernt; die spannungsvolle Ausnahme am Satzende bleibt erhalten.
