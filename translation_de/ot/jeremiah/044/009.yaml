  text: הַֽ/שְׁכַחְתֶּם֩ אֶת רָע֨וֹת אֲבוֹתֵי/כֶ֜ם וְ/אֶת רָע֣וֹת מַלְכֵ֣י יְהוּדָ֗ה וְ/אֵת֙ רָע֣וֹת נָשָׁ֔י/ו וְ/אֵת֙ רָעֹ֣תֵ/כֶ֔ם וְ/אֵ֖ת רָעֹ֣ת נְשֵׁי/כֶ֑ם אֲשֶׁ֤ר עָשׂוּ֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/009.yaml
  text: Have you forgotten the evil deeds of your fathers[a], the evil deeds of the kings of Judah, the evil deeds of their wives, your own evil deeds, and the evil deeds of your wives[b], which they did in the land of Judah and in the streets of Jerusalem?
translation:
  language: de
  text: Habt ihr die bösen Taten[a] eurer Väter vergessen, die bösen Taten der Könige von Juda, die bösen Taten ihrer Frauen[b], eure eigenen bösen Taten und die bösen Taten eurer Frauen – all diese Taten, die sie im Land Juda und auf den Straßen Jerusalems begangen haben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Übel“, „Bosheiten“ oder „böse Dinge“. Der Zusammenhang spricht von Handlungen, die begangen wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich „seiner Frauen“. Nach „den Königen von Juda“ ist die Form wahrscheinlich kollektiv beziehungsweise distributiv gemeint: die Frauen der jeweiligen Könige.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַשְׁכַחְתֶּם
  choice: Habt ihr … vergessen?
  rationale: Das deutsche Perfekt gibt die rhetorische Frage natürlich wieder und wahrt den gegenwärtigen Vorwurfscharakter.
- source_word: רָעוֹת / רָעֹתֵיכֶם
  choice: böse Taten / eure eigenen bösen Taten
  rationale: Der Plural bezeichnet hier konkrete Verfehlungen; אֲשֶׁר עָשׂוּ („die sie taten“) stützt eine handlungsbezogene Wiedergabe. „eigenen“ verdeutlicht den Kontrast zu Vätern und Königen.
- source_word: אֲבוֹתֵיכֶם
  choice: eure Väter
  rationale: Die direkte, generationenbezogene Verwandtschaftsbezeichnung bleibt erhalten; „Vorfahren“ wäre ebenfalls möglich, aber weniger nah am Wortlaut.
- source_word: מַלְכֵי יְהוּדָה
  choice: die Könige von Juda
  rationale: Natürliche deutsche Wiedergabe der hebräischen Genitivverbindung.
- source_word: נָשָׁיו
  choice: ihre Frauen
  rationale: Der morphologisch singularische Suffixbezug steht nach dem pluralischen „Könige von Juda“ und ist wahrscheinlich kollektiv beziehungsweise distributiv zu verstehen.
- source_word: נְשֵׁיכֶם
  choice: eure Frauen
  rationale: Im possessiven Zusammenhang bezeichnet נָשִׁים hier am ehesten die Ehefrauen; „Frauen“ ist im Deutschen natürlich und ausreichend eindeutig.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die sie … begangen haben
  rationale: „Begehen“ verbindet sich im Deutschen idiomatisch mit bösen Taten und macht den Bezug auf schuldhafte Handlungen deutlich.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: Bewahrt die geografische Bezeichnung und die übliche Bedeutung von אֶרֶץ.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: und auf den Straßen Jerusalems
  rationale: חֻצוֹת bezeichnet Straßen oder öffentliche Plätze; „Straßen“ ist hier die natürlichste moderne Wiedergabe.
theological_decisions:
- issue: Konkreter oder abstrakter Sinn von רָעוֹת
  choice: böse Taten
  alternative: Übel; Bosheiten; böse Dinge
  rationale: Die Aufzählung schuldiger Gruppen und der anschließende Ausdruck „die sie … begangen haben“ sprechen für konkrete Handlungen, ohne die moralische Wertung abzuschwächen.
- issue: Generationenbezeichnung אֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Die maskuline Verwandtschaftsbezeichnung und der familiäre Generationenbezug des Ausgangstextes werden bewahrt.
- issue: Numerusbezug von נָשָׁיו
  choice: ihre Frauen
  alternative: seine Frauen
  rationale: Die hebräische Form trägt zwar ein singularisches Suffix, folgt jedoch auf „die Könige von Juda“. Die pluralische deutsche Wiedergabe bildet den wahrscheinlich kollektiven beziehungsweise distributiven Bezug natürlich ab, während die Fußnote die Form des Ausgangstextes offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „die bösen Taten“ bewahrt die anklagende, rhetorische Häufung des Hebräischen. Das Perfekt und „begangen haben“ sind idiomatisch, ohne die Aussage theologisch zu präzisieren oder abzuschwächen.
