  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הָ/עָ֔ם וְ/אֶ֖ל כָּל הַ/נָּשִׁ֑ים שִׁמְעוּ֙ דְּבַר יְהוָ֔ה כָּל יְהוּדָ֕ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/024.yaml
  text: Then Jeremiah said to all the people and to all the women[a], “Hear the word of Yahweh, all Judah who are in the land of Egypt.”
translation:
  language: de
  text: 'Dann sagte Jeremia zum ganzen Volk und zu allen Frauen: »Hört das Wort Jahwes, ihr alle aus Juda[a], die ihr im Land Ägypten lebt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ganz Juda«; gemeint ist die judäische Gemeinschaft in Ägypten.'
    reason: Die Fußnote bewahrt die kollektive Ausdrucksweise des Hebräischen, während der Haupttext die direkte Anrede in natürlichem Deutsch wiedergibt.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Dann sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Dann sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: אֶל כָּל הָעָם
  choice: zum ganzen Volk
  rationale: עָם bezeichnet hier das Volk als Gesamtheit; die zusammengezogene Form ist im Deutschen idiomatisch.
- source_word: וְאֶל כָּל הַנָּשִׁים
  choice: und zu allen Frauen
  rationale: נָשִׁים kann Frauen oder Ehefrauen bedeuten. Der unmittelbare Zusammenhang hebt die Frauen als Gruppe hervor, daher ist „Frauen“ hier vorzuziehen.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Pluralimperativ wird knapp wiedergegeben und bewahrt den feierlichen prophetischen Aufruf.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die geläufige prophetische Formel wird formal und zugleich verständlich wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen mit der etablierten Umschrift „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּל יְהוּדָה
  choice: ihr alle aus Juda
  rationale: Die hebräische Kollektivbezeichnung „ganz Juda“ meint hier die aus Juda stammende Gemeinschaft, die direkt angeredet wird. Die gewählte Form macht diesen Bezug in natürlichem Deutsch deutlich.
- source_word: אֲשֶׁר בְּאֶרֶץ מִצְרָיִם
  choice: die ihr im Land Ägypten lebt
  rationale: Der Relativsatz bezieht sich auf die angeredeten Menschen. „Lebt“ gibt ihren Aufenthalt idiomatisch wieder, ohne die volle geografische Wendung „Land Ägypten“ zu verkürzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname Gottes. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch den traditionellen Titel „der HERR“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die Anrede wird zur besseren Verständlichkeit ausdrücklich als zweite Person formuliert.
