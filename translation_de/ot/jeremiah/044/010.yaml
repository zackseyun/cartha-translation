source:
  edition: WLC
  text: לֹ֣א דֻכְּא֔וּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וְ/לֹ֣א יָרְא֗וּ וְ/לֹֽא הָלְכ֤וּ בְ/תֽוֹרָתִ/י֙ וּ/בְ/חֻקֹּתַ֔/י אֲשֶׁר נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם וְ/לִ/פְנֵ֥י אֲבוֹתֵי/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/010.yaml
  text: They have not been humbled to this day[a], and they have not feared[b], and they have not walked in my law and in my statutes that I set before you and before your fathers.
translation:
  language: de
  text: Bis heute sind sie nicht gedemütigt worden[a]; sie haben sich nicht gefürchtet und nicht nach meinem Gesetz und meinen Satzungen gelebt, die ich euch und euren Vätern[b] vorgelegt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zerschlagen worden«, »zerknirscht geworden«; sinngemäß auch: »sind nicht umgekehrt«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »euren Vorfahren«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֻכְּאוּ
  choice: sind sie nicht gedemütigt worden
  rationale: Das Pual von דכא kann ein Zerschlagen, Erniedrigen oder inneres Zerknirschtwerden bezeichnen. „Gedemütigt worden“ bewahrt die passive Form und legt die Aussage nicht vorschnell als ausdrückliche Umkehr aus.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis heute
  rationale: Natürliche deutsche Wiedergabe der festen Zeitangabe mit fortdauernder Geltung.
- source_word: יָרְאוּ
  choice: sie haben sich nicht gefürchtet
  rationale: Die Wiedergabe wahrt den offenen Bedeutungsraum zwischen Furcht und ehrfürchtiger Gottesfurcht, da im hebräischen Satz kein Objekt ausdrücklich genannt wird.
- source_word: הָלְכוּ בְתוֹרָתִי וּבְחֻקֹּתַי
  choice: nicht nach meinem Gesetz und meinen Satzungen gelebt
  rationale: „Nach … leben“ gibt die hebräische Weg-Metapher in natürlichem modernem Deutsch wieder; „Gesetz“ und „Satzungen“ bewahren den bundesrechtlichen Zusammenhang.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: die ich euch … vorgelegt habe
  rationale: נתן לפני bedeutet hier idiomatisch, etwas verbindlich vor jemanden hinzustellen beziehungsweise vorzulegen. Das Suffix ist eindeutig zweite Person Plural.
- source_word: וְלִפְנֵי אֲבוֹתֵיכֶם
  choice: und euren Vätern
  rationale: Die ausdrücklich maskuline Bezeichnung wird im Haupttext beibehalten; „Vorfahren“ ist als kontextuell mögliche weitere Wiedergabe vermerkt.
theological_decisions:
- issue: Ob דֻכְּאוּ ausdrücklich mit Umkehrsprache wiederzugeben ist
  choice: sind sie nicht gedemütigt worden
  alternative: sind sie nicht umgekehrt / haben sie nicht bereut
  rationale: Der Zusammenhang spricht von anhaltender Unbußfertigkeit, doch das Verb selbst bedeutet nicht ausdrücklich „umkehren“ oder „bereuen“. Die Übersetzung bewahrt diese Spannung.
- issue: Wechsel von der dritten zur zweiten Person
  choice: „sie“ bei den Beschriebenen, aber „euch“ und „euren Vätern“ beim ursprünglichen Empfängerkreis der Weisung
  alternative: durchgehend „ihnen“ und „ihren Vätern“
  rationale: Die hebräischen Formen לִפְנֵיכֶם und אֲבוֹתֵיכֶם sind eindeutig zweite Person maskulin Plural. Der rhetorische Personenwechsel darf nicht harmonisiert werden.
- issue: Bedeutungsumfang von ירא ohne ausdrücklich genanntes Objekt
  choice: sich fürchten
  alternative: Ehrfurcht haben
  rationale: Im Kontext ist Gottesfurcht wahrscheinlich, doch die lexikalisch offenere Formulierung vermeidet es, Furcht ausschließlich als Verehrung zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Satzteil bleibt bewusst passiv und etwas gewichtig, um die Form und Mehrdeutigkeit des Hebräischen zu wahren. Die Weg-Metapher wird mit dem natürlichen deutschen Ausdruck „nach … leben“ wiedergegeben. Sämtliche Fußnotenmarker stehen an der jeweils sachlich zugehörigen Stelle.
