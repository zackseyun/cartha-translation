source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר דִּבַּ֥רְתָּ אֵלֵ֖י/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה אֵינֶ֥/נּוּ שֹׁמְעִ֖ים אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/016.yaml
  text: As for the word that you have spoken to us in the name of Yahweh[a], we will not listen to you.
translation:
  language: de
  text: 'Was das Wort angeht, das du im Namen Jahwes zu uns geredet hast: Wir werden nicht auf dich hören.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir werden dir nicht gehorchen.« Das hebräische Verb kann sowohl Hören als auch Gehorchen bezeichnen; hier ist die Weigerung, Jeremias Botschaft zu befolgen, eindeutig mitgemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: das Wort
  rationale: דָּבָר bezeichnet hier Jeremias prophetische Äußerung. »Wort« bewahrt die direkte Ausdrucksweise des Hebräischen und ist im Zusammenhang verständlich.
- source_word: דִּבַּרְתָּ אֵלֵינוּ
  choice: das du … zu uns geredet hast
  rationale: Die abgeschlossene Rede Jeremias wird mit einem deutschen Perfekt wiedergegeben; אֶל behält seine gerichtete Bedeutung »zu«.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Die feste Wendung bezeichnet das Reden unter göttlicher Autorität und in göttlichem Auftrag. »Jahwe« gibt den im Ausgangstext stehenden Gottesnamen wieder.
- source_word: אֵינֶנּוּ שֹׁמְעִים אֵלֶיךָ
  choice: wir werden nicht auf dich hören
  rationale: Die Verneinung mit Partizip drückt hier eine entschiedene Weigerung aus. »Auf dich hören« bewahrt sowohl die Grundbedeutung von שׁמע als auch den persönlichen Bezug von אֵלֶיךָ.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die im Deutschen geläufige Form »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע bei der Zurückweisung prophetischer Rede
  choice: auf dich hören
  alternative: dir gehorchen
  rationale: שׁמע kann sowohl das Hören als auch das daraus folgende Befolgen bezeichnen. Der Haupttext erhält die unmittelbare lexikalische Bildlichkeit; die im Zusammenhang deutlich eingeschlossene Gehorsamsverweigerung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung »Was das Wort angeht« bildet die hervorgehobene Satzstellung des Hebräischen natürlich ab; der Doppelpunkt macht die entschiedene Antwort der Sprecher klar.
