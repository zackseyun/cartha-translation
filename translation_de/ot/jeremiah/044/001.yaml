  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ אֶ֚ל כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הַ/יֹּשְׁבִ֤ים בְּ/מִגְדֹּל֙ וּ/בְ/תַחְפַּנְחֵ֣ס וּ/בְ/נֹ֔ף וּ/בְ/אֶ֥רֶץ פַּתְר֖וֹס לֵ/אמֹֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/001.yaml
  text: The word that came to Jeremiah concerning all the Judeans living in the land of Egypt[a], those living in Migdol and in Tahpanhes and in Noph and in the land of Pathros, saying,
translation:
  language: de
  text: 'Das Wort, das an Jeremia erging und allen Judäern galt, die im Land Ägypten lebten – und zwar denen, die in Migdol, Tachpanhes, Nof[a] und im Land Patros lebten –, lautete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nof ist der hebräische Name der ägyptischen Stadt, die meist unter dem Namen Memphis bekannt ist.
    reason: Die Fußnote nennt die geläufige historische Bezeichnung, während der Haupttext den hebräischen Ortsnamen bewahrt.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: Bewahrt die feststehende prophetische Einleitungsformel und bleibt näher am Hebräischen als das deutendere »die Botschaft«.
- source_word: אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: das an Jeremia erging
  rationale: »An jemanden ergehen« ist eine natürliche, würdige deutsche Wiedergabe der prophetischen Formel היה אל.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: und allen Judäern galt
  rationale: Gibt die Beziehung des Wortes zu den angesprochenen beziehungsweise betroffenen Menschen verständlich wieder, ohne sie mit dem später breiteren Begriff »Juden« historisch einzuebnen.
- source_word: הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: die im Land Ägypten lebten
  rationale: Das Partizip bezeichnet den dauerhaften Wohn- oder Aufenthaltsort; »lebten« ist im modernen Deutsch natürlich.
- source_word: הַיֹּשְׁבִים
  choice: denen, die … lebten
  rationale: Die Wiederholung des hebräischen Partizips wird beibehalten und als nähere Bestimmung der zuvor genannten Judäer verständlich gemacht.
- source_word: מִגְדֹּל
  choice: Migdol
  rationale: Der Ortsname wird nach gebräuchlicher deutscher Form transliteriert.
- source_word: תַחְפַּנְחֵס
  choice: Tachpanhes
  rationale: Der Ortsname wird in einer im Deutschen etablierten biblischen Schreibweise wiedergegeben.
- source_word: נֹף
  choice: Nof
  rationale: Der im hebräischen Text stehende Name bleibt im Haupttext erhalten; die geläufigere Identifizierung mit Memphis steht in der Fußnote.
- source_word: אֶרֶץ פַּתְרוֹס
  choice: im Land Patros
  rationale: Das ausdrücklich vorhandene אֶרֶץ (»Land«) wird nicht ausgelassen.
- source_word: לֵאמֹר
  choice: 'lautete:'
  rationale: Leitet die im nächsten Vers folgende direkte Rede im Deutschen idiomatisch ein und gibt die Funktion von לאמר wieder.
theological_decisions:
- issue: Beziehung des Gotteswortes zu »allen Judäern« (zweites אֶל)
  choice: und allen Judäern galt
  alternative: an alle Judäer gerichtet war / über alle Judäer erging
  rationale: Das Hebräische kann die Judäer als Adressaten oder als Bezugsgruppe des Wortes kennzeichnen. »Galt« lässt diese Spannung eher offen, während eine ausschließlich inhaltliche Wiedergabe mit »über« oder eine strikt adressierende Formulierung sie stärker festlegen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche grenzen die konkretisierende Ortsliste ab und machen den langen Satz übersichtlich; der Doppelpunkt bereitet die im folgenden Vers einsetzende Rede vor.
