id: JER.44.11
reference: Jeremiah 44:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י שָׂ֥ם פָּנַ֛/י בָּ/כֶ֖ם לְ/רָעָ֑ה וּ/לְ/הַכְרִ֖ית אֶת כָּל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/011.yaml
  text: 'Therefore[a], this is what Yahweh of Armies, the God of Israel, says: Behold, I am setting my face against you for harm[b], to cut off all Judah.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe der Heerscharen[a], der Gott Israels: Siehe, ich richte mein Angesicht gegen euch zum Unheil[b], um ganz Juda auszurotten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahwe der Heere“; traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
  - marker: b
    text: „Unheil“ bezeichnet hier die Katastrophe beziehungsweise das Verderben als Gericht, nicht moralisch Böses.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Anklage und klingt im heutigen Deutsch natürlich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feststehende prophetische Botenformel in würdigem, geläufigem Deutsch.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als Namen wieder und bewahrt mit „Heerscharen“ den umfassenden militärischen Hoheitstitel.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Hebt den feierlichen, entschlossenen Beginn der göttlichen Ankündigung hervor.
- source_word: שָׂם פָּנַי בָּכֶם
  choice: ich richte mein Angesicht gegen euch
  rationale: Bewahrt das hebräische Bild für entschlossene Gegnerschaft und Gericht; „gegen“ macht die im Kontext negative Ausrichtung deutlich.
- source_word: לְרָעָה
  choice: zum Unheil
  rationale: Bezeichnet hier schädigendes Gericht beziehungsweise Verderben, nicht moralisch Böses; „Unheil“ erhält die gerichtliche Schärfe.
- source_word: וּלְהַכְרִית
  choice: um … auszurotten
  rationale: Gibt den kausativen Sinn von כרת im Gerichtskontext klar und mit der erforderlichen Härte wieder.
- source_word: כָּל יְהוּדָה
  choice: ganz Juda
  rationale: Bewahrt die knappe kollektive Bezeichnung, die sowohl Juda als Gemeinschaft als auch das Ganze Judas bezeichnen kann.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; „Jahwe“ behandelt es als Gottesnamen. „Heerscharen“ bewahrt den traditionellen und mehrdeutigen Hoheitstitel, ohne ihn auf eine einzelne Art von Heer festzulegen.
- issue: Bedeutung von לְרָעָה in einer göttlichen Gerichtsankündigung
  choice: zum Unheil
  alternative: zum Bösen / zum Verderben
  rationale: Der Ausdruck bezeichnet hier die von Gott angekündigte Katastrophe des Gerichts und schreibt Gott nicht moralische Bosheit zu. Zugleich wird die Härte der Aussage nicht abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter prophetischer Formel und Bildsprache. „Siehe“ und „Angesicht“ halten den feierlichen Ton; die übrige Syntax bleibt für heutige Leser klar.
