source:
  edition: WLC
  text: וְ/לֹ֤א שָֽׁמְעוּ֙ וְ/לֹא הִטּ֣וּ אֶת אָזְנָ֔/ם לָ/שׁ֖וּב מֵ/רָֽעָתָ֑/ם לְ/בִלְתִּ֥י קַטֵּ֖ר לֵ/אלֹהִ֥ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/005.yaml
  text: But they did not listen or incline their ear to turn from their evil[a], so as not to make offerings to other gods.
translation:
  language: de
  text: Doch sie hörten nicht und neigten ihr Ohr nicht, um von ihrer Bosheit umzukehren und anderen Göttern kein Räucheropfer darzubringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „… und anderen Göttern nicht zu räuchern.“'
    reason: Macht die engere Bedeutung des kultischen Verbs קטר („räuchern“, d. h. Räucherwerk verbrennen) sichtbar und bewahrt zugleich die Verneinung der hebräischen Infinitivkonstruktion.
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: sie hörten nicht
  rationale: Das Verb reicht semantisch von Hören bis Gehorchen. Im Zusammenhang bedeutet es, dass sie die prophetische Mahnung nicht beachteten; „hörten nicht“ bewahrt die hebräische Ausdrucksweise, ohne die Bedeutung auf „gehorchten nicht“ festzulegen.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: neigten ihr Ohr nicht
  rationale: Die wörtliche Metapher bezeichnet aufmerksame Bereitschaft zu hören und ist auch im heutigen gehobenen Deutsch verständlich.
- source_word: לָשׁוּב מֵרָעָתָם
  choice: um von ihrer Bosheit umzukehren
  rationale: שׁוב bezeichnet hier die Abkehr von falschem Verhalten. „Umkehren“ wahrt den biblischen Begriff, während „Bosheit“ רָעָה sowohl als moralische Haltung als auch als böses Tun offenhält.
- source_word: לְבִלְתִּי קַטֵּר
  choice: kein Räucheropfer mehr darzubringen
  rationale: קטר bezeichnet im kultischen Zusammenhang das Erzeugen von Opferrauch, häufig das Verbrennen von Räucherwerk. Die Formulierung gibt den konkreten Kultakt wieder; „mehr“ drückt zusammen mit der Umkehr den beabsichtigten Abbruch der fortgesetzten Praxis aus.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Der Dativ gibt die durch ל markierte Ausrichtung beziehungsweise Widmung des Kultakts im Deutschen natürlich wieder.
theological_decisions:
- issue: Reichweite des kultischen Verbs קטר
  choice: anderen Göttern kein Räucheropfer mehr darzubringen
  alternative: anderen Göttern nicht mehr zu räuchern; anderen Göttern keine Opfer mehr darzubringen
  rationale: Der hebräische Ausdruck weist konkret auf einen raucherzeugenden Kultakt, besonders Räucherwerk. „Räucheropfer“ ist präziser als das allgemeinere „Opfer“, ohne den Vorgang auf bloßen Wohlgeruch zu reduzieren.
- issue: Syntaktischer Bezug von לְבִלְתִּי קַטֵּר
  choice: 'als Folge beziehungsweise Ziel der Umkehr: „um ... umzukehren und ... kein Räucheropfer mehr darzubringen“'
  alternative: 'rein final: „um von ihrer Bosheit umzukehren, damit sie anderen Göttern keine Räucheropfer darbrächten“'
  rationale: Der Infinitiv mit לבלתי kann Zweck oder beabsichtigtes Ergebnis ausdrücken. Die koordinierte deutsche Fassung bewahrt den engen Zusammenhang zwischen der Abkehr vom Bösen und dem Ende des fremdgöttlichen Kults, ohne eine zusätzliche logische Abstufung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Ohr-Metapher bleibt erhalten; „Räucheropfer darbringen“ ist kultisch präzise und allgemein verständlich. Der Fußnotenmarker [a] steht unmittelbar nach dem betroffenen Satzteil.
