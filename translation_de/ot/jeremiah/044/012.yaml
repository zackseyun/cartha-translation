  to: Und ich werde den Rest Judas nehmen, die ihr Gesicht darauf gerichtet haben, in das Land Ägypten zu ziehen, um dort als Fremde zu leben. Sie alle werden im Land Ägypten zugrunde gehen. Sie werden durch Schwert und Hunger fallen; vom Geringsten bis zum Größten werden sie durch Schwert und Hunger sterben. Sie werden zu einer Fluchformel[a], zum Entsetzen, zum Fluch und zur Schmach werden.
