  variant: modern standard German
source:
  edition: WLC
  text: וְ/לָקַחְתִּ֞י אֶת שְׁאֵרִ֣ית יְהוּדָ֗ה אֲשֶׁר שָׂ֨מוּ פְנֵי/הֶ֜ם לָ/ב֣וֹא אֶֽרֶץ מִצְרַיִם֮ לָ/ג֣וּר שָׁם֒ וְ/תַ֨מּוּ כֹ֜ל בְּ/אֶ֧רֶץ מִצְרַ֣יִם יִפֹּ֗לוּ בַּ/חֶ֤רֶב בָּֽ/רָעָב֙ יִתַּ֔מּוּ מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב יָמֻ֑תוּ וְ/הָיוּ֙ לְ/אָלָ֣ה לְ/שַׁמָּ֔ה וְ/לִ/קְלָלָ֖ה וּ/לְ/חֶרְפָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/012.yaml
  text: And I will take the remnant of Judah who have set their faces to enter the land of Egypt to sojourn there[a], and they will all come to an end in the land of Egypt. They will fall by the sword and by famine; from the least even to the greatest, they will come to an end. By the sword and by famine they will die, and they will become an oath, a horror, a curse, and a reproach.
translation:
  language: de
  text: Und ich werde den Rest Judas nehmen, die ihr Gesicht darauf gerichtet haben, in das Land Ägypten zu ziehen, um dort als Fremde zu leben. Sie alle werden im Land Ägypten zugrunde gehen. Sie werden durch Schwert und Hunger fallen; vom Geringsten bis zum Größten werden sie durch Schwert und Hunger sterben. Sie werden zu einer Fluchformel[a], zum Entsetzen, zum Fluch und zur Schmach werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Fluchschwur“. Das hebräische Wort אָלָה bezeichnet häufig einen Eid, mit dem ein Fluch verbunden ist, und kann auch eine Fluchformel meinen.'
    reason: Die Fußnote sichert die für אָלָה bestehende Bedeutungsspanne ab und erklärt die von dem folgenden Wort „Fluch“ unterschiedene Haupttextwiedergabe.
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Und ich werde … nehmen
  rationale: לקח bedeutet zunächst „nehmen“. Die Formulierung lässt den im Gerichtszusammenhang möglichen Sinn des Ergreifens stehen, ohne ihn durch „vernichten“ oder „bestrafen“ vorwegzunehmen.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: den Rest Judas
  rationale: שְׁאֵרִית bezeichnet den nach einer Katastrophe verbliebenen Teil. „Rest Judas“ ist im Deutschen natürlich und bewahrt den prophetischen Begriff.
- source_word: אֲשֶׁר שָׂמוּ פְנֵיהֶם
  choice: die ihre Gesichter darauf gerichtet haben
  rationale: Die konkrete hebräische Wendung wird bewahrt; sie drückt eine entschlossene Ausrichtung auf das folgende Vorhaben aus.
- source_word: לָבוֹא אֶרֶץ מִצְרַיִם
  choice: ins Land Ägypten zu kommen
  rationale: בוא bezeichnet hier das Hineinkommen in das Land. Die Wiedergabe folgt dem Ausgangstext eng und bleibt idiomatisch.
- source_word: לָגוּר שָׁם
  choice: um dort als Fremde zu leben
  rationale: גור bezeichnet den Aufenthalt als Fremder oder Schutzbürger und kann zugleich einen zeitweiligen Aufenthalt nahelegen. Die deutsche Formulierung macht die Fremdlingsnuance verständlich.
- source_word: וְתַמּוּ כֹל
  choice: Sie alle werden … zugrunde gehen
  rationale: תם bezeichnet hier das vollständige Zu-Ende-Kommen. „Zugrunde gehen“ gibt im Gerichtskontext den Sinn natürlich wieder und wird beim zweiten Vorkommen desselben Stammes wiederholt.
- source_word: יִפֹּלוּ
  choice: werden sie fallen
  rationale: נפל mit „durch das Schwert“ ist die übliche konkrete Gerichtswendung. „Fallen“ bewahrt das Bild.
- source_word: בַּחֶרֶב בָּרָעָב
  choice: durch das Schwert … durch den Hunger
  rationale: 'Die Präposition ב wird instrumental wiedergegeben. Die Trennung der beiden Angaben entspricht der masoretischen Satzgliederung: Fallen durch das Schwert, Zugrundegehen durch Hunger.'
- source_word: יִתַּמּוּ
  choice: werden sie zugrunde gehen
  rationale: Die gleiche Wiedergabe wie bei וְתַמּוּ bewahrt die Wiederholung des Stammes תם und den rhetorischen Nachdruck.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringsten bis zum Größten
  rationale: Die feste Wendung bezeichnet umfassende Totalität, wahrscheinlich über Rang oder gesellschaftliche Stellung hinweg, ohne die mögliche Reichweite auf das Alter festzulegen.
- source_word: יָמֻתוּ
  choice: werden sie … sterben
  rationale: מות ist das gewöhnliche Verb für „sterben“ und verlangt keine stärkere interpretierende Formulierung.
- source_word: לְאָלָה
  choice: zum Fluchwort
  rationale: אָלָה kann einen Eid mit Fluchandrohung beziehungsweise eine Fluchformel bezeichnen. „Fluchwort“ unterscheidet den Ausdruck vom folgenden קְלָלָה und ist im Deutschen verständlicher als das missverständliche bloße „Eid“.
- source_word: לְשַׁמָּה
  choice: zum Entsetzen
  rationale: שַׁמָּה bezeichnet hier etwas, das Bestürzung oder Entsetzen hervorruft.
- source_word: לִקְלָלָה
  choice: zum Fluch
  rationale: קְלָלָה ist der gewöhnliche Ausdruck für Fluch und wird vom vorhergehenden אָלָה lexikalisch unterschieden.
- source_word: לְחֶרְפָּה
  choice: zur Schande
  rationale: חֶרְפָּה bezeichnet Schmach, Beschimpfung oder entehrende Schande. „Schande“ ist hier eine natürliche und würdige Wiedergabe.
theological_decisions:
- issue: Unverkürzte Wiedergabe der göttlichen Gerichtsankündigung
  choice: Die wiederholten Aussagen über Fallen, Zugrundegehen und Sterben bleiben ausdrücklich erhalten.
  alternative: Die Wiederholungen zu einer allgemeinen Aussage vollständiger Vernichtung zusammenziehen.
  rationale: Der hebräische Text häuft Gerichtsbegriffe und wiederholt תם. Diese rhetorische Schwere soll weder abgeschwächt noch durch eine dogmatisch stärker zugespitzte Sammelformel ersetzt werden.
- issue: Verhältnis von אָלָה und קְלָלָה
  choice: „Fluchwort“ und „Fluch“ werden getrennt wiedergegeben.
  alternative: Beide Wörter mit „Fluch“ wiedergeben oder אָלָה schlicht als „Eid“ übersetzen.
  rationale: Die beiden verwandten, aber verschiedenen Begriffe sollen unterscheidbar bleiben. Zugleich trägt אָלָה hier wahrscheinlich die Bedeutung eines fluchbeladenen Schwurs oder einer Fluchformel, die ein bloßes „Eid“ im Deutschen nicht erkennen ließe.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Die Formulierung „ihre Gesichter darauf gerichtet“ ist bewusst leicht fremdartig, um das hebräische Entschlossenheitsbild zu erhalten. Die masoretische Akzentgliederung wurde berücksichtigt: Fallen bezieht sich auf das Schwert, Zugrundegehen auf den Hunger; anschließend werden beide Todesarten zusammengefasst.'
