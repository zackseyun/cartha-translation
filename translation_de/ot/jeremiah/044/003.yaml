  yaml_path: translation/ot/jeremiah/044/003.yaml
  text: because of their evil that they did to provoke me to anger[a], by going to burn incense and to serve other gods[b], whom they had not known—they, you, and your fathers.
translation:
  language: de
  text: wegen des Bösen, das sie taten, um mich zum Zorn zu reizen, indem sie hingingen, um anderen Göttern Räucherwerk zu verbrennen und ihnen zu dienen[a] – Göttern, die weder sie noch ihr noch eure Väter gekannt hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie zu verehren“. Das hebräische Verb kann religiösen Dienst oder kultische Verehrung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher schließt das Hebräische mit der betonten Aufzählung: „die sie nicht gekannt hatten – sie, ihr und eure Väter“.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: מִפְּנֵי רָעָתָם
  choice: wegen ihrer Bosheit
  rationale: Die Präposition ist hier kausal; רָעָה bezeichnet wegen der folgenden schuldhaften Handlungen moralische Bosheit, nicht Unheil.
- source_word: אֲשֶׁר עָשׂוּ
  choice: die sie begingen
  rationale: Im Deutschen verbindet sich „begehen“ natürlich mit „Bosheit“ und bezeichnet eine schuldhafte Tat, ohne den Inhalt über die folgenden Infinitive hinaus festzulegen.
- source_word: לְהַכְעִסֵנִי
  choice: um mich zum Zorn zu reizen
  rationale: Die Wiedergabe erhält sowohl die kausative Form als auch den ausdrücklich genannten Zorn.
- source_word: לָלֶכֶת
  choice: Sie gingen hin, um
  rationale: Das hebräische Verb „gehen“ bleibt ausdrücklich erhalten; ein neuer Satz nach dem Doppelpunkt stellt die erklärende Funktion im Deutschen klar dar.
- source_word: לְקַטֵּר
  choice: Räucherwerk zu verbrennen
  rationale: Im kultischen Zusammenhang bezeichnet das Piel das Verbrennen beziehungsweise Darbringen von Räucherwerk.
- source_word: לַעֲבֹד
  choice: ihnen zu dienen
  rationale: „Dienen“ entspricht der Grundbedeutung von עבד und lässt den umfassenden Sinn religiöser Verehrung und Loyalität bestehen.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Die feste Wendung bezeichnet Gottheiten außer dem HERRN; „andere Götter“ ist direkt und konventionell.
- source_word: אֲשֶׁר לֹא יְדָעוּם
  choice: Göttern, die ... nicht gekannt hatten
  rationale: „Kennen“ bewahrt die mögliche relationale Färbung von ידע, ohne sie mit „anerkennen“ interpretierend zu verstärken.
- source_word: הֵמָּה אַתֶּם וַאֲבֹתֵיכֶם
  choice: weder sie noch ihr noch eure Väter
  rationale: Die dreigliedrige, betonte Aufzählung bleibt vollständig erhalten; die deutsche weder-noch-Konstruktion macht ihre syntaktische Beziehung zum Verb klar.
theological_decisions:
- issue: Wiedergabe des religiösen Dienstes für andere Götter
  choice: ihnen zu dienen
  alternative: sie anzubeten
  rationale: עבד umfasst Dienst, kultische Verehrung und Loyalität. „Dienen“ wahrt den breiteren Ausdruck, während die Fußnote die im Kontext mögliche Wiedergabe „verehren“ nennt.
- issue: Geschlechtsspezifische Verwandtschaftsbezeichnung in וַאֲבֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Das maskuline Substantiv wird entsprechend der sprachlichen Form des Ausgangstextes wiedergegeben und nicht ohne textlichen Anlass neutralisiert.
- issue: Bezug der abschließenden Subjektaufzählung
  choice: die weder sie noch ihr noch eure Väter gekannt hatten
  alternative: die sie nicht gekannt hatten – sie, ihr und eure Väter
  rationale: Die natürliche deutsche Konstruktion versteht die drei Gruppen als betontes Subjekt von „gekannt hatten“. Die Fußnote dokumentiert die knappere appositionelle Form des Hebräischen und bewahrt damit die formale Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt entfaltet „Bosheit“ durch die folgenden Handlungen; die Wiederaufnahme „Göttern“ verhindert einen unklaren Relativsatzbezug. Die Anrede unterscheidet bewusst zwischen „sie“ und „ihr“.
