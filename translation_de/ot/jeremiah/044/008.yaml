source:
  edition: WLC
  text: לְ/הַכְעִסֵ֨/נִי֙ בְּ/מַעֲשֵׂ֣י יְדֵי/כֶ֔ם לְ/קַטֵּ֞ר לֵ/אלֹהִ֤ים אֲחֵרִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם אֲשֶׁר אַתֶּ֥ם בָּאִ֖ים לָ/ג֣וּר שָׁ֑ם לְמַ֨עַן֙ הַכְרִ֣ית לָ/כֶ֔ם וּ/לְמַ֤עַן הֱיֽוֹתְ/כֶם֙ לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כֹ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/008.yaml
  text: provoking me to anger by the works of your hands[a], by burning incense to other gods in the land of Egypt, where you are going to sojourn[c][b], so that you may cut yourselves off and so that you may become a curse and a reproach among all the nations of the earth.
translation:
  language: de
  text: indem ihr mich durch das Werk eurer Hände zum Zorn reizt, indem ihr anderen Göttern im Land Ägypten Räucheropfer darbringt, in das ihr zieht, um euch dort als Fremde niederzulassen[a], sodass ihr euch selbst zugrunde richtet[b] und unter allen Völkern der Erde zum Fluch[c] und zur Schande werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Verb kann besonders das Wohnen oder Niederlassen als Fremder bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sodass ihr ausgerottet werdet“; auch ein unausgesprochener göttlicher Handlungsträger ist möglich: „damit ich euch ausrotte“.'
    reason: alternative_reading
  - marker: c
    text: '„Zum Fluch“ kann auch bedeuten: zu einem Gegenstand des Verfluchens, der in Fluchformeln genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַכְעִסֵנִי
  choice: indem ihr mich … zum Zorn reizt
  rationale: Der Hifil-Infinitiv von כעס mit Suffix der 1. Person Singular bezeichnet das Verursachen von Zorn; die deutsche Wendung gibt die kausative Bedeutung natürlich wieder.
- source_word: בְּמַעֲשֵׂי יְדֵיכֶם
  choice: durch das Werk eurer Hände
  rationale: Die hebräische Wendung wird bewahrt, ohne vorschnell ausschließlich Götzenbilder oder ausschließlich kultische Handlungen zu meinen.
- source_word: לְקַטֵּר לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern Räucheropfer darbringt
  rationale: קטר bezeichnet im kultischen Zusammenhang das Verbrennen von Räucherwerk beziehungsweise das Aufsteigenlassen von Opferrauch; „Räucheropfer darbringen“ ist verständlich und kultisch präzise.
- source_word: אֲשֶׁר אַתֶּם בָּאִים לָגוּר שָׁם
  choice: wohin ihr gekommen seid, um dort als Fremde zu leben
  rationale: גור bezeichnet häufig den Aufenthalt als Fremder ohne angestammtes Bürgerrecht. Das Perfekt beziehungsweise partizipiale בָּאִים wird im Kontext als bereits vollzogene Ankunft wiedergegeben.
- source_word: לְמַעַן הַכְרִית לָכֶם
  choice: So rottet ihr euch selbst aus
  rationale: Die reflexiv-schädigende Wirkung von לָכֶם wird erhalten. „Ausrotten“ gibt die starke Vernichtungsbedeutung von כרת im Kontext deutlicher wieder als das im Deutschen missverständliche „abschneiden“.
- source_word: לִקְלָלָה וּלְחֶרְפָּה
  choice: zum Fluch und zur Schande
  rationale: קללה kann einen Fluch oder einen Gegenstand von Fluchformeln bezeichnen; חרפה umfasst Schmach, Schande und Verhöhnung. Die gewählte Paarung ist natürlich und würdevoll.
- source_word: בְּכֹל גּוֹיֵי הָאָרֶץ
  choice: unter allen Völkern der Erde
  rationale: Bei „allen Völkern“ bezeichnet הארץ hier die Erde beziehungsweise Welt; ב wird als soziale Einordnung „unter“ wiedergegeben.
theological_decisions:
- issue: Handlungsträger und Ziel-/Folgesinn in לְמַעַן הַכְרִית לָכֶם
  choice: 'reflexiv-resultativ: „So rottet ihr euch selbst aus“'
  alternative: 'final mit implizitem göttlichem Handlungsträger: „damit ich euch ausrotte“, oder passiv: „sodass ihr ausgerottet werdet“'
  rationale: Im hebräischen Teilsatz wird kein neuer Handlungsträger ausdrücklich genannt, und לָכֶם legt eine Wirkung zum eigenen Schaden nahe. Die reflexive Wiedergabe bewahrt die Verantwortung des Volkes, ohne das im weiteren Zusammenhang wirkende göttliche Gericht auszuschließen.
- issue: Verhältnis von Absicht und Folge bei לְמַעַן
  choice: im Deutschen als Folge der beschriebenen Handlungen formuliert
  alternative: 'ausdrücklicher Absichtssatz: „damit ihr euch selbst ausrottet“'
  rationale: Ein wörtlicher deutscher Absichtssatz könnte so klingen, als wollten die Angesprochenen bewusst ihre eigene Vernichtung. Die resultative Formulierung erhält die im Hebräischen mögliche Ziel-/Folgespannung, ohne ihnen eine psychologische Selbstvernichtungsabsicht zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz ist zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. „Als Fremde leben“ macht die besondere Nuance von גור sichtbar; „Räucheropfer darbringen“ wahrt den kultischen Zusammenhang. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
