  text: מִ/פְּנֵי֩ אֲשֶׁ֨ר קִטַּרְתֶּ֜ם וַ/אֲשֶׁ֧ר חֲטָאתֶ֣ם לַ/יהוָ֗ה וְ/לֹ֤א שְׁמַעְתֶּם֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/בְ/תֹרָת֧/וֹ וּ/בְ/חֻקֹּתָ֛י/ו וּ/בְ/עֵדְוֺתָ֖י/ו לֹ֣א הֲלַכְתֶּ֑ם עַל כֵּ֞ן קָרָ֥את אֶתְ/כֶ֛ם הָ/רָעָ֥ה הַ/זֹּ֖את כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/023.yaml
  text: Because you burned incense and sinned against Yahweh[a], and did not listen to the voice of Yahweh or walk in his law, his statutes, and his testimonies, therefore this disaster has come upon you[d][c][b], as it is this day.
translation:
  language: de
  text: Weil ihr Räucheropfer dargebracht, gegen Jahwe gesündigt und nicht auf die Stimme Jahwes gehört habt und nicht nach seiner Weisung, seinen Satzungen und seinen Zeugnissen gelebt habt, ist dieses Unheil über euch gekommen, wie es heute zu sehen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי אֲשֶׁר
  choice: Weil
  rationale: Gibt die kausale Einleitung knapp und natürlich wieder.
- source_word: קִטַּרְתֶּם
  choice: ihr Räucheropfer dargebracht habt
  rationale: Das Verb bezeichnet hier kultisches Erzeugen von Opferrauch beziehungsweise das Darbringen von Räucherwerk; die gewählte Formulierung macht den Opferkontext deutlich.
- source_word: חֲטָאתֶם לַיהוָה
  choice: gegen Jahwe gesündigt habt
  rationale: Die Präposition bezeichnet hier die Ausrichtung der Sünde gegen Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: שְׁמַעְתֶּם בְּקוֹל יְהוָה
  choice: nicht auf die Stimme Jahwes gehört habt
  rationale: Bewahrt die hebräische Redeweise und lässt zugleich die Bedeutung des Gehorchens erkennen.
- source_word: תּוֹרָתוֹ
  choice: seiner Weisung
  rationale: Torah bezeichnet hier Gottes verbindliche Unterweisung; „Weisung“ erhält diese Bedeutungsbreite besser als das enger wirkende „Gesetz“.
- source_word: חֻקֹּתָיו
  choice: seinen Satzungen
  rationale: Eine präzise und geläufige Wiedergabe im rechtlich-bundestheologischen Zusammenhang.
- source_word: עֵדְוֺתָיו
  choice: seinen Zeugnissen
  rationale: Bewahrt die lexikalische Eigenart gegenüber Weisung und Satzungen.
- source_word: לֹא הֲלַכְתֶּם
  choice: nicht ... gelebt habt
  rationale: Gibt die hebräische Wegmetapher idiomatisch als Lebensführung nach Gottes Weisungen wieder.
- source_word: קָרָאת אֶתְכֶם הָרָעָה הַזֹּאת
  choice: dieses Unheil über euch gekommen
  rationale: רָעָה bezeichnet in diesem Gerichtskontext ein hereinbrechendes Unheil, nicht moralische Bosheit.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute zu sehen ist
  rationale: Die idiomatische Wendung verweist auf den gegenwärtig sichtbaren Zustand.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen; die Transliteration bewahrt ihn als Eigennamen.
- issue: Bedeutung von רָעָה im Gerichtskontext
  choice: Unheil
  alternative: Böses
  rationale: Gemeint ist die erfahrene Katastrophe als Gericht, nicht moralisches Böses.
- issue: Bedeutungsumfang von תּוֹרָה
  choice: Weisung
  alternative: Gesetz
  rationale: „Weisung“ wahrt sowohl den verbindlichen als auch den unterweisenden Charakter, ohne den Ausdruck auf Gesetzesbestimmungen zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte kausale Struktur wird mit zweimaligem „weil“ transparent gemacht; die Folge wird durch „darum“ markiert. Keine Fußnoten erforderlich, da die wichtigsten Bedeutungsnuancen im Text verständlich wiedergegeben werden.
