base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/007.yaml
  text: 'And now[a], thus says Yahweh, the God of hosts, the God of Israel: Why are you doing this great evil against yourselves, to cut off from among Judah man and woman, child and infant, leaving yourselves no remnant?'
translation:
  language: de
  text: 'Und nun, so spricht Jahwe, der Gott der Heerscharen, der Gott Israels: Warum tut ihr euch selbst so großes Böses an[a], sodass aus Juda Mann und Frau, Kind und Säugling ausgerottet werden und euch kein Überrest bleibt?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum fügt ihr euch selbst so großes Unheil zu?“ Das hebräische Wort רָעָה kann sowohl moralisches Böses als auch schädliches Unheil bezeichnen; hier klingen beide Bedeutungen an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Die traditionelle und zugleich quellennah formulierte Wiedergabe bewahrt die mögliche Bezugnahme auf militärische beziehungsweise himmlische Heere.
- source_word: עֹשִׂים רָעָה גְדוֹלָה אֶל נַפְשֹׁתֵכֶם
  choice: tut ihr euch selbst so großes Böses an
  rationale: „Böses“ wahrt die moralische Bedeutung von רָעָה, während „euch selbst … antun“ die reflexive Wendung natürlich wiedergibt. Die ebenfalls mögliche Bedeutung „Unheil/Schaden“ wird in der Fußnote erhalten.
- source_word: לְהַכְרִית
  choice: indem ihr … ausrottet
  rationale: Das kausative Verb bezeichnet hier die vollständige Beseitigung der genannten Bevölkerungsgruppen; „ausrotten“ gibt die Schärfe und den resultativen Zusammenhang idiomatisch wieder.
- source_word: אִישׁ וְאִשָּׁה עוֹלֵל וְיוֹנֵק
  choice: Mann und Frau, Kind und Säugling
  rationale: Die singularischen Gegensatzpaare und die umfassende Aufzählung werden eng am Hebräischen bewahrt.
- source_word: מִתּוֹךְ יְהוּדָה
  choice: aus Juda
  rationale: Die knappe deutsche Formulierung bezeichnet die Beseitigung aus der Mitte Judas, ohne „Juda“ unnötig auf Land oder Volk festzulegen.
- source_word: לְבִלְתִּי הוֹתִיר לָכֶם שְׁאֵרִית
  choice: und euch keinen Rest übrig lasst
  rationale: Die Ergebnisfolge bleibt deutlich; „Rest“ bewahrt den prophetisch bedeutsamen Begriff שְׁאֵרִית in natürlichem Deutsch.
theological_decisions:
- issue: Mehrdeutigkeit von רָעָה als moralisches Böses oder schädliches Unheil
  choice: so großes Böses
  alternative: so großes Unheil
  rationale: Der Haupttext bewahrt den moralischen Vorwurf im Zusammenhang des Götzendienstes; die Fußnote hält die zugleich mitschwingende Bedeutung selbst verursachten Unheils ausdrücklich offen.
- issue: Wiedergabe von שְׁאֵרִית
  choice: Rest
  alternative: Überlebende
  rationale: „Rest“ erhält den wiederkehrenden prophetischen Leitbegriff, ohne über den unmittelbaren Sinn hinaus eine bestimmte theologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem feierlichen prophetischen Redeeingang, bleibt aber für heutige Leser verständlich. Die umfassenden singularischen Paare und die Spannung zwischen Schuld und selbst herbeigeführtem Verderben bleiben erhalten.
