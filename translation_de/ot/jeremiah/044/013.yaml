  text: וּ/פָקַדְתִּ֗י עַ֤ל הַ/יּֽוֹשְׁבִים֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי עַל יְרֽוּשָׁלִָ֑ם בַּ/חֶ֥רֶב בָּ/רָעָ֖ב וּ/בַ/דָּֽבֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/013.yaml
  text: And I will punish those who dwell in the land of Egypt[a], just as I punished Jerusalem, with the sword, with famine[b], and with pestilence.
translation:
  language: de
  text: 'Und ich werde diejenigen bestrafen, die im Land Ägypten wohnen,[a] so wie ich Jerusalem bestraft habe: mit Schwert, Hunger und Pest.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und ich werde die heimsuchen, die im Land Ägypten wohnen, … so wie ich Jerusalem heimgesucht habe.“ Das hebräische Verb פקד kann „sich um jemanden kümmern“, „heimsuchen“ oder in einem Gerichtszusammenhang wie hier „bestrafen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: „Pest“ kann auch mit „Seuche“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי ... פָּקַדְתִּי
  choice: ich werde ... bestrafen ... ich ... bestraft habe
  rationale: פקד hat ein breites Bedeutungsspektrum, bezeichnet hier aber angesichts der Gerichte durch Schwert, Hunger und Pest eindeutig strafendes Einschreiten. Die Wiederholung desselben deutschen Verbs bildet die hebräische Wiederholung ab.
- source_word: הַיּוֹשְׁבִים
  choice: die ... wohnen
  rationale: Die substantivierte Partizipialform bezeichnet die in Ägypten Wohnenden; die Relativkonstruktion ist im modernen Deutsch natürlich und bewahrt den verbalen Charakter.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Diese Wiedergabe erhält אֶרֶץ ausdrücklich und ist zugleich idiomatisches Deutsch.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Formulierung kennzeichnet klar den Vergleich zwischen dem bevorstehenden Gericht in Ägypten und dem vollzogenen Gericht an Jerusalem.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: mit Schwert, Hunger und Pest
  rationale: Die Präposition בְּ bezeichnet hier das Mittel. Die knappe, parallele Reihung bewahrt die geläufige prophetische Gerichtstrias.
theological_decisions:
- issue: Gerichtsbedeutung von פקד
  choice: explizit mit „bestrafen“ wiedergegeben
  alternative: „heimsuchen“ oder „zur Rechenschaft ziehen“
  rationale: Der unmittelbare Kontext bestimmt פקד als strafendes göttliches Handeln. „Bestrafen“ macht diese Bedeutung verständlich, ohne über den Text hinauszugehen; die weitere lexikalische Spannweite wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, während „bestrafen“ den im Kontext klaren Gerichtssinn natürlich ausdrückt. Der Doppelpunkt macht die folgende Aufzählung der Gerichtsmittel transparent.
