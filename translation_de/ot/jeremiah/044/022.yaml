  text: וְ/לֹֽא יוּכַל֩ יְהוָ֨ה ע֜וֹד לָ/שֵׂ֗את מִ/פְּנֵי֙ רֹ֣עַ מַעַלְלֵי/כֶ֔ם מִ/פְּנֵ֥י הַ/תּוֹעֵבֹ֖ת אֲשֶׁ֣ר עֲשִׂיתֶ֑ם וַ/תְּהִ֣י אַ֠רְצְ/כֶם לְ/חָרְבָּ֨ה וּ/לְ/שַׁמָּ֧ה וְ/לִ/קְלָלָ֛ה מֵ/אֵ֥ין יוֹשֵׁ֖ב כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/022.yaml
  text: And Yahweh could no longer bear it because of the evil of your deeds[a], because of the abominations that you committed. So your land became a ruin, a desolation, and a curse, without inhabitant[c][b], as it is this day.
translation:
  language: de
  text: Und Jahwe konnte es wegen der Bosheit eurer Taten und wegen der abscheulichen Dinge, die ihr getan habt, nicht länger ertragen.[a] So wurde euer Land zu einer Ruine, zu einer Einöde[b] und zum Fluch[c], ohne Bewohner, wie es bis heute ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich näher: „konnte … nicht länger tragen“; gemeint ist „nicht länger ertragen“ oder „nicht länger hinnehmen“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann neben „Einöde“ auch den Gedanken eines Gegenstands des Entsetzens oder Erschreckens ausdrücken.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zum Gegenstand des Fluchens“, also zu etwas, das als abschreckendes Beispiel in einer Fluchformel genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְלֹא יוּכַל ... עוֹד לָשֵׂאת
  choice: konnte es nicht länger ertragen
  rationale: Die Verbindung bezeichnet hier das Ende des Ertragens oder Hinnehmens. Das im Deutschen nötige Objekt „es“ wird aus dem Zusammenhang ergänzt.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition ist in beiden Vorkommen kausal gebraucht und nennt den Grund für das Ende des Ertragens.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: die Bosheit eurer Taten
  rationale: Bewahrt die Genitivkonstruktion und die ausdrücklich moralische Bewertung der Handlungen.
- source_word: הַתּוֹעֵבֹת
  choice: die abscheulichen Dinge
  rationale: Gibt die starke Verwerflichkeit verständlich wieder, ohne den Ausdruck vorschnell ausschließlich auf eine bestimmte Art kultischer Vergehen einzuengen.
- source_word: וַתְּהִי אַרְצְכֶם
  choice: So wurde euer Land
  rationale: „So“ macht den im Satzzusammenhang erkennbaren Folgezusammenhang natürlich deutlich.
- source_word: לְחָרְבָּה
  choice: zur Trümmerstätte
  rationale: Bezeichnet das verwüstete, ruinierte Land und unterscheidet den Ausdruck von dem folgenden שַׁמָּה.
- source_word: וּלְשַׁמָּה
  choice: zur Einöde
  rationale: Im Kontext der Verwüstung und Entvölkerung bezeichnet das Wort vorrangig einen verödeten Zustand; seine weitere Nuance des Entsetzens wird in einer Fußnote bewahrt.
- source_word: וְלִקְלָלָה
  choice: zum Fluch
  rationale: Die knappe Formulierung folgt der hebräischen Prädikatsreihe; gemeint sein kann auch ein Gegenstand oder Beispiel, das in Flüchen genannt wird.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ohne Bewohner
  rationale: Gibt die knappe hebräische Wendung für die völlige Entvölkerung eng und verständlich wieder.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: wie es noch heute ist
  rationale: Eine natürliche deutsche Wiedergabe der festen Wendung, die den bis zum Zeitpunkt der Rede fortbestehenden Zustand bezeichnet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Eigennamen, während „der HERR“ ihn durch den traditionellen Lesetitel ersetzt.
- issue: Aussage, Jahwe habe es nicht länger ertragen können
  choice: Die starke Ausdrucksweise des hebräischen Textes bleibt stehen.
  alternative: Eine abschwächende Umschreibung wie „Jahwe wollte es nicht länger hinnehmen“
  rationale: Der Text verwendet ausdrücklich יכל („können“) mit „tragen/ertragen“. Die Übersetzung löst die daraus entstehende theologische Spannung nicht durch eine Umdeutung in bloßes Nichtwollen auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe an der zweifachen Begründung und der dreigliedrigen Folgenreihe des Hebräischen. „Trümmerstätte“ und „Einöde“ vermeiden eine unnötige Wiederholung und bilden die beiden unterschiedlichen hebräischen Substantive ab.
