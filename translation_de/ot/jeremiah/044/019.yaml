base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/019.yaml
  text: And when we burned incense to the Queen of Heaven and poured out drink offerings to her[a], was it apart from our husbands that we made cakes for her, to depict her, and poured out drink offerings to her?
translation:
  language: de
  text: 'Und als wir der Himmelskönigin Räucheropfer darbrachten und ihr Trankopfer ausgossen: Haben wir denn ohne unsere Ehemänner für sie Kuchen gebacken, um sie abzubilden[a], und ihr Trankopfer ausgegossen?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »um sie darzustellen« oder »um ihr Bild zu formen«. Gemeint sind wahrscheinlich Kuchen, die in einer die Göttin darstellenden Form gebacken wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und als
  rationale: Die Wendung knüpft an die Verteidigung im vorherigen Vers an und führt den damaligen kultischen Brauch als Umstand an; eine konditionale Wiedergabe wäre im Kontext weniger passend.
- source_word: מְקַטְּרִים
  choice: Räucheropfer darbrachten
  rationale: Das Piel von קטר bezeichnet im kultischen Zusammenhang das Erzeugen von Opferrauch, häufig durch Räucherwerk. Die Wiedergabe ist im Deutschen natürlich und lässt den Opfercharakter erkennen.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: der Himmelskönigin
  rationale: Dies bewahrt den im Jeremiabuch verwendeten heidnischen Kulttitel knapp und idiomatisch, ohne die verehrte Gestalt näher zu identifizieren.
- source_word: וּלְהַסֵּךְ לָהּ נְסָכִים
  choice: und ihr Trankopfer ausgossen
  rationale: נסכים bezeichnet kultische Trankopfer; das Verb נסך wird entsprechend mit »ausgießen« wiedergegeben.
- source_word: הֲמִבַּלְעֲדֵי אֲנָשֵׁינוּ
  choice: Haben wir denn ohne unsere Ehemänner
  rationale: Die Frage bestreitet, dass die Frauen unabhängig von ihren Männern handelten. Im gegebenen familiären Kontext gibt »Ehemänner« den Sinn von אֲנָשֵׁינוּ präziser wieder als das allgemeinere »Männer«.
- source_word: עָשִׂינוּ לָהּ כַּוָּנִים
  choice: für sie Kuchen gebacken
  rationale: כַּוָּנִים bezeichnet geformte, für diesen Kult bestimmte Kuchen. »gebacken« ist für die Herstellung von Kuchen im Deutschen natürlich, während der kultische Zusammenhang aus dem Satz hervorgeht.
- source_word: לְהַעֲצִבָהּ
  choice: um sie abzubilden
  rationale: Der Infinitiv mit Suffix bezeichnet wahrscheinlich den Zweck beziehungsweise die darstellende Form der Kuchen. Die Formulierung wahrt durch eine Fußnote die lexikalische Unsicherheit.
- source_word: וְהַסֵּךְ לָהּ נְסָכִים
  choice: und ihr Trankopfer ausgegossen
  rationale: Die wiederholte Kultformel wird in Übereinstimmung mit ihrem ersten Vorkommen wiedergegeben.
theological_decisions:
- issue: Wiedergabe des heidnischen Titels מְלֶכֶת הַשָּׁמַיִם
  choice: Himmelskönigin
  alternative: Königin des Himmels / Königin der Himmel
  rationale: Der Text gibt die Bezeichnung der verehrten heidnischen Gottheit aus der Sicht der Sprecherinnen wieder. Der etablierte deutsche Kulttitel wird beibehalten, ohne spätere religiöse Assoziationen einzutragen.
- issue: Beteiligung der Ehemänner an dem Kult
  choice: Die rhetorische Frage lässt erkennen, dass die Frauen nicht ohne ihre Ehemänner handelten.
  alternative: Die Frauen fragen lediglich, ob ihre Männer Kenntnis davon hatten.
  rationale: מִבַּלְעֲדֵי bezeichnet ein Handeln ohne beziehungsweise unabhängig von jemandem. Die Übersetzung wahrt die rhetorische Form und legt den genauen Grad der Mitwirkung nicht weiter fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt rhetorisch und gut verständlich; kultische Fachbegriffe werden mit den geläufigen Wörtern »Räucheropfer« und »Trankopfer« wiedergegeben. Die Unsicherheit bei לְהַעֲצִבָהּ wird nicht im Haupttext überladen, sondern in der Fußnote offengelegt.
