    issue: „zur Rechenschaft ziehen“ für פֹּקֵד
    rationale: Die Wendung kann eine bloße rechtliche Befragung oder Verantwortlichmachung nahelegen. Im unmittelbaren Gerichtskontext bezeichnet פקד hier Gottes strafendes Einschreiten; „bestrafen“ ist klarer und weniger umschreibend.
  - severity: low
    issue: „meine Worte sich ... erfüllen werden“
    rationale: Verständlich, aber im modernen Deutschen gehen Worte bzw. Ankündigungen gewöhnlich „in Erfüllung“. Diese Formulierung ist idiomatischer und bewahrt die Aussage.
