source:
  edition: WLC
  text: וְ/זֹאת לָ/כֶ֤ם הָ/אוֹת֙ נְאֻם יְהוָ֔ה כִּֽי פֹקֵ֥ד אֲנִ֛י עֲלֵי/כֶ֖ם בַּ/מָּק֣וֹם הַ/זֶּ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּי֩ ק֨וֹם יָק֧וּמוּ דְבָרַ֛/י עֲלֵי/כֶ֖ם לְ/רָעָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/029.yaml
  text: And this will be the sign for you[a], declares Yahweh, that I am punishing you in this place, so that you may know that my words will surely stand against you for harm.
translation:
  language: de
  text: 'Und dies soll euch als Zeichen dienen, spricht Jahwe: Ich werde euch an diesem Ort bestrafen, damit ihr erkennt, dass meine Worte gegen euch ganz gewiss in Erfüllung gehen werden – zum Unheil.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „… dass meine Worte gegen euch ganz gewiss Bestand haben werden – zum Unheil.“ Das hebräische Verb bedeutet „aufstehen/stehen“; im Zusammenhang kann es auch „in Erfüllung gehen“ bedeuten.'
    reason: Die Fußnote bewahrt die Bildsprache von קוֹם יָקוּמוּ und erläutert die idiomatische Wiedergabe in der Hauptübersetzung.
lexical_decisions:
- source_word: וְזֹאת לָכֶם הָאוֹת
  choice: Und dies soll für euch das Zeichen sein
  rationale: Die nominale hebräische Wendung wird im Deutschen mit einer idiomatischen Kopula wiedergegeben; „Zeichen“ bewahrt die prophetische Bestätigungsfunktion von אוֹת.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ ist eine natürliche, würdige Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: כִּי פֹקֵד אֲנִי עֲלֵיכֶם
  choice: Ich werde euch … zur Rechenschaft ziehen
  rationale: פקד bezeichnet hier angesichts des angekündigten Unheils ein strafendes Einschreiten. „Zur Rechenschaft ziehen“ vermittelt den gerichtlichen Sinn, ohne die Wendung unnötig zu verengen.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die Ortsangabe und ihre deiktische Kraft werden direkt und idiomatisch wiedergegeben.
- source_word: לְמַעַן תֵּדְעוּ
  choice: damit ihr erkennt
  rationale: לְמַעַן bezeichnet den Zweck; „erkennt“ passt zur bestätigenden Funktion des angekündigten Zeichens.
- source_word: כִּי קוֹם יָקוּמוּ
  choice: dass … sich ganz gewiss … erfüllen werden
  rationale: Infinitivus absolutus und finites Verb verstärken die Gewissheit. Bei „meine Worte“ gibt „sich erfüllen“ die idiomatische Bedeutung wieder; die wörtliche Bildsprache wird in der Fußnote genannt.
- source_word: דְבָרַי עֲלֵיכֶם
  choice: meine Worte sich … gegen euch erfüllen werden
  rationale: Der ausdrückliche Plural „Worte“ bleibt erhalten; עֲלֵיכֶם hat im Gerichtszusammenhang adversative Bedeutung.
- source_word: לְרָעָה
  choice: zu eurem Unheil
  rationale: רָעָה bezeichnet hier die schädliche, katastrophale Folge des Gerichts und nicht moralische Bosheit.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ gibt ihn im modernen Deutschen erkennbar wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Deutung von פקד im Gerichtskontext
  choice: zur Rechenschaft ziehen
  alternative: heimsuchen; bestrafen; sich annehmen
  rationale: Der Kontext legt ein strafendes Eingreifen nahe. Die gewählte Formulierung wahrt den gerichtlichen Charakter, ohne eine weitergehende dogmatische Aussage einzutragen.
- issue: Bedeutung von לְרָעָה
  choice: zu eurem Unheil
  alternative: zum Bösen; zum Schaden; zur Katastrophe
  rationale: Gemeint ist die unheilvolle Wirkung des angekündigten Gerichts, nicht moralisches Böses in Gott.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem prophetischen Ton, bleibt aber für heutige Leser gut verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der erläuterten Aussage.
