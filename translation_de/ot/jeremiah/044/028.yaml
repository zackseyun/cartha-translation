  to: Und die dem Schwert Entkommenen werden aus dem Land Ägypten in das Land Juda zurückkehren — wenige an Zahl.[a] Der ganze Rest Judas, all die nach Ägypten gekommen sind, um dort als Fremde zu leben, wird erkennen, wessen Wort Bestand haben wird:[b] meines oder ihres.
  rationale: Die Revision beschränkt sich auf die sichere Korrektur des Singularrelativsatzes. Die Formulierung „all die nach Ägypten gekommen sind“ gibt das pluralische Partizip wieder, ohne den kollektivischen Ausdruck „der ganze Rest Judas“ aufzugeben. Textaussage, Ambiguität und Fußnotenanker bleiben unverändert.
