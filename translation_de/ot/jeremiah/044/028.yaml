source:
  edition: WLC
  text: וּ/פְלִיטֵ֨י חֶ֜רֶב יְשֻׁב֨וּ/ן מִן אֶ֧רֶץ מִצְרַ֛יִם אֶ֥רֶץ יְהוּדָ֖ה מְתֵ֣י מִסְפָּ֑ר וְֽ/יָדְע֞וּ כָּל שְׁאֵרִ֣ית יְהוּדָ֗ה הַ/בָּאִ֤ים לְ/אֶֽרֶץ מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם דְּבַר מִ֥י יָק֖וּם מִמֶּ֥/נִּי וּ/מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/028.yaml
  text: And a few survivors of the sword will return from the land of Egypt to the land of Judah[a], and all the remnant of Judah who came to the land of Egypt to sojourn there will know whose word will stand[b], mine or theirs.
translation:
  language: de
  text: Und die dem Schwert Entkommenen werden aus dem Land Ägypten in das Land Juda zurückkehren — wenige an Zahl.[a] Der ganze Rest Judas, all die nach Ägypten gekommen sind, um dort als Fremde zu leben, wird erkennen, wessen Wort Bestand haben wird:[b] meines oder ihres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die dem Schwert Entkommenen … wenige an Zahl“.'
    reason: Die Fußnote macht die durch die deutsche Satzstellung leicht geglättete hebräische Konstruktion sichtbar.
  - marker: b
    text: 'Oder: „wessen Wort sich erfüllen wird“.'
    reason: Die Alternative erläutert den idiomatischen Sinn von יָקוּם neben der im Text bewahrten Metapher.
lexical_decisions:
- source_word: וּפְלִיטֵי חֶרֶב
  choice: die dem Schwert Entkommenen
  rationale: פְלִיטֵי bezeichnet Entkommene bzw. Überlebende; die Formulierung bewahrt das hebräische Bild vom Schwert als gewaltsamem Gericht.
- source_word: יְשֻׁבוּן
  choice: werden ... zurückkehren
  rationale: Das Qal von שוב bedeutet hier im ankündigenden Kontext schlicht „zurückkehren“.
- source_word: מִן אֶרֶץ מִצְרַיִם אֶרֶץ יְהוּדָה
  choice: aus dem Land Ägypten in das Land Juda
  rationale: Die Wiederholung von אֶרֶץ wird erhalten; die deutschen Präpositionen geben Ausgangs- und Zielort natürlich wieder.
- source_word: מְתֵי מִסְפָּר
  choice: wenige an Zahl
  rationale: Die Wendung bezeichnet eine kleine, zählbare Anzahl. Die Nachstellung folgt der hebräischen Informationsfolge und lässt erkennen, dass sie die Entkommenen näher bestimmt.
- source_word: וְיָדְעוּ
  choice: Dann wird ... erkennen
  rationale: „Erkennen“ gibt ידע hier als durch das Eintreffen des angekündigten Gerichts gewonnene Einsicht wieder; „dann“ verdeutlicht den im Zusammenhang angelegten Folgezusammenhang.
- source_word: כָּל שְׁאֵרִית יְהוּדָה
  choice: der ganze Rest Judas
  rationale: „Rest“ ist im prophetischen Sprachgebrauch die etablierte, verständliche Wiedergabe von שְׁאֵרִית.
- source_word: הַבָּאִים לְאֶרֶץ מִצְרַיִם לָגוּר שָׁם
  choice: der in das Land Ägypten gekommen ist, um dort als Fremder zu leben
  rationale: בוא wird mit „gekommen“ wiedergegeben. גור bezeichnet das Wohnen als Fremder beziehungsweise Schutzbürger; „als Fremder leben“ bewahrt diese Nuance in modernem Deutsch.
- source_word: דְּבַר מִי יָקוּם
  choice: wessen Wort Bestand haben wird
  rationale: Die Wiedergabe bewahrt die Metapher des hebräischen יקום („stehen/bestehen“) und bezeichnet zugleich die Bewahrheitung des Wortes.
- source_word: מִמֶּנִּי וּמֵהֶם
  choice: meines oder ihres
  rationale: Die Pronomen beziehen sich auf „Wort“. Die Genitivformen bilden den knappen hebräischen Gegensatz im Deutschen natürlich nach.
theological_decisions:
- issue: Prophetische Bewahrheitungsformel
  choice: 'wessen Wort Bestand haben wird: meines oder ihres'
  alternative: 'wessen Wort sich erfüllen wird: meines oder ihres'
  rationale: „Bestand haben“ erhält die Metapher von קום und lässt die Aussage als Gegenüberstellung konkurrierender Worte stehen, ohne die prophetische Spannung durch eine stärker deutende Formulierung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache von Schwert und bestehendem Wort bleibt erhalten. „Als Fremder leben“ ist verständlicher als das heute gehobene „als Fremdling weilen“, ohne die soziale Nuance von גור zu verlieren.
