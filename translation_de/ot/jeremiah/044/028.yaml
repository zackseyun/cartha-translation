  terminology: „Rest Judas“, „dem Schwert Entkommene“, „Bestand haben“ und „als Fremde leben“ sind terminologisch tragfähig. „Bestand haben“ erhält die Bildlichkeit von יָקוּם, ohne eine konfessionelle Deutung einzutragen.
