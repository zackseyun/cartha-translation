  text: כֹּֽה אָמַ֣ר יְהוָֽה צְבָאוֹת֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אַתֶּ֨ם וּ/נְשֵׁי/כֶ֜ם וַ/תְּדַבֵּ֣רְנָה בְּ/פִי/כֶם֮ וּ/בִ/ידֵי/כֶ֣ם מִלֵּאתֶ֣ם לֵ/אמֹר֒ עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶת נְדָרֵ֗י/נוּ אֲשֶׁ֤ר נָדַ֨רְנוּ֙ לְ/קַטֵּר֙ לִ/מְלֶ֣כֶת הַ/שָּׁמַ֔יִם וּ/לְ/הַסֵּ֥ךְ לָ֖/הּ נְסָכִ֑ים הָקֵ֤ים תָּקִ֨ימְנָה֙ אֶת נִדְרֵי/כֶ֔ם וְ/עָשֹׂ֥ה תַעֲשֶׂ֖ינָה אֶת נִדְרֵי/כֶֽם־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/025.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: You and your wives have spoken with your mouths and fulfilled it with your hands, saying, ‘We will surely carry out our vows that we have vowed, to burn incense to the Queen of Heaven and to pour out drink offerings to her.’ Go ahead, confirm your vows and carry out your vows.'
translation:
  language: de
  text: 'So spricht der HERR der Heerscharen, der Gott Israels: Ihr und eure Frauen habt es mit eurem Mund ausgesprochen und mit euren Händen ausgeführt. Ihr habt gesagt: »Wir werden unsere Gelübde ganz gewiss erfüllen, die wir abgelegt haben: der Himmelskönigin Räucherwerk darzubringen und ihr Trankopfer auszugießen.« Dann bekräftigt nur eure Gelübde, ihr Frauen, und erfüllt eure Gelübde!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Gibt den Gottesnamen gemäß verbreiteter deutscher Bibelkonvention als HERR wieder und bewahrt צְבָאוֹת mit der formnahen, würdevollen Wendung „der Heerscharen“.
- source_word: וּבִידֵיכֶם מִלֵּאתֶם
  choice: und mit euren Händen ausgeführt
  rationale: Bewahrt den Gegensatz zwischen dem mit dem Mund Gesagten und dem durch die Hände praktisch Vollbrachten; „ausgeführt“ gibt das Piel von מלא im Kontext idiomatisch wieder.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: Wir werden … ganz gewiss erfüllen
  rationale: Der vorangestellte Infinitivus absolutus verstärkt die Entschlossenheit; im Deutschen wird dies natürlich durch „ganz gewiss“ ausgedrückt.
- source_word: לְקַטֵּר
  choice: Räucherwerk darzubringen
  rationale: Bezeichnet kultisches Verbrennen beziehungsweise Darbringen von Räucherwerk und wird entsprechend präzisiert.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: Himmelskönigin
  rationale: Die feminine Titulatur wird direkt und traditionsgemäß wiedergegeben, ohne die bezeichnete Gottheit näher zu identifizieren.
- source_word: הָקֵים תָּקִימְנָה … וְעָשֹׂה תַעֲשֶׂינָה
  choice: Dann haltet nur … und erfüllt …!
  rationale: Die doppelten emphatischen Konstruktionen werden als zugespitzte Aufforderung wiedergegeben; „nur“ lässt im Zusammenhang den ironisch-drohenden Ton erkennen, ohne ihn ausdrücklich auszudeuten.
theological_decisions:
- issue: Ton der abschließenden Aufforderung
  choice: „Dann haltet nur eure Gelübde und erfüllt eure Gelübde!“
  alternative: „Bestätigt eure Gelübde und erfüllt eure Gelübde!“
  rationale: Im Kontext ist dies keine göttliche Billigung des Götzendienstes, sondern eine rhetorisch zugespitzte, dem Gericht vorausgehende Aufforderung. Die Übersetzung bewahrt die Befehlsform und signalisiert den Ton zurückhaltend durch „nur“, ohne die Ironie in einer erklärenden Paraphrase festzuschreiben.
- issue: Bezeichnung der verehrten Gestalt
  choice: „Himmelskönigin“
  alternative: Identifikation mit einer bestimmten altorientalischen Göttin
  rationale: Der hebräische Text nennt einen Titel, aber keinen Eigennamen. Eine konkrete Identifikation würde eine exegetische Festlegung in den Haupttext importieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die feierliche Botenformel und die kultischen Fachbegriffe bleiben erhalten; unnötige Archaismen werden vermieden. Die Wiederholung von „Gelübde“ wird als rhetorisches Merkmal des Ausgangstextes bewahrt.
