source:
  edition: WLC
  text: וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים הַשְׁכֵּ֥ים וְ/שָׁלֹ֖חַ לֵ/אמֹ֑ר אַל נָ֣א תַעֲשׂ֗וּ אֵ֛ת דְּבַֽר הַ/תֹּעֵבָ֥ה הַ/זֹּ֖את אֲשֶׁ֥ר שָׂנֵֽאתִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/004.yaml
  text: Yet I sent to you all my servants the prophets[a], rising early and sending them, saying[b], 'Please do not do this abominable thing that I hate.'
translation:
  language: de
  text: 'Doch ich sandte alle meine Diener, die Propheten, immer wieder[a] zu euch und sagte: »Tut doch nicht diese abscheuliche Tat[b], die ich hasse!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »früh aufstehend und sendend«; eine hebräische Ausdrucksweise für beharrliches, eindringliches und wiederholtes Handeln.'
    reason: cultural_note
  - marker: b
    text: 'Auch: »diese abscheuliche Sache« oder »diesen Gräuel«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Doch ich sandte
  rationale: Das Waw führt die Erzählung weiter; im Zusammenhang, nach dem Ungehorsam des Volkes, gibt »doch« zugleich den leicht adversativen Sinn wieder. שׁלח bedeutet schlicht »senden«.
- source_word: כָּל עֲבָדַי הַנְּבִיאִים
  choice: alle meine Diener, die Propheten
  rationale: Die appositionale Verbindung beider Substantive bleibt ausdrücklich erhalten. »Diener« bezeichnet die Propheten als von Gott Beauftragte, ohne hier den sozialen Status von Sklaven in den Vordergrund zu stellen.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: immer wieder
  rationale: Die wörtliche Wendung »früh aufstehen und senden« ist ein hebräisches Idiom für beharrliches, eindringliches und wiederholtes Handeln. »Immer wieder« gibt ihre Funktion in natürlichem Deutsch wieder; das Bild wird in einer Fußnote dokumentiert.
- source_word: לֵאמֹר
  choice: und ließ ihnen sagen
  rationale: Die Infinitivform führt den Inhalt der prophetischen Botschaft ein. Im Deutschen macht diese Formulierung deutlich, dass Gott die Propheten mit der folgenden Botschaft beauftragte.
- source_word: אַל נָא תַעֲשׂוּ
  choice: Tut doch nicht
  rationale: אַל formuliert das Verbot; נָא verleiht ihm einen bittenden beziehungsweise dringlichen Ton. Das Modalwort »doch« bewahrt diesen Nachdruck, ohne die Aussage abzuschwächen.
- source_word: דְּבַר הַתּוֹעֵבָה הַזֹּאת
  choice: diese abscheuliche Tat
  rationale: דבר bedeutet hier »Sache, Angelegenheit«; תועבה bezeichnet etwas Abscheuliches oder Verabscheuungswürdiges, im Kontext besonders den Götzendienst. »Tat« knüpft natürlich an »tut« an, während die Fußnote die allgemeinere lexikalische Möglichkeit offenhält.
- source_word: אֲשֶׁר שָׂנֵאתִי
  choice: die ich hasse
  rationale: Die Perfektform bezeichnet hier Gottes feststehende Haltung zu diesem Tun. Das deutsche Präsens gibt diese fortdauernde Bewertung treffend wieder.
theological_decisions:
- issue: Gottes Abscheu gegenüber dem götzendienerischen Tun
  choice: die ich hasse
  alternative: die ich verabscheue / die ich gehasst habe
  rationale: Die direkte und starke Aussage des Hebräischen bleibt erhalten. Das Präsens bringt Gottes beständige moralische Ablehnung zum Ausdruck, ohne zusätzliche dogmatische Kategorien in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist für heutige Leser unmittelbar verständlich; der bittend-eindringliche Ton von נָא und die Härte der göttlichen Ablehnung bleiben erhalten. Das hebräische Idiom wird funktional übersetzt und zugleich in der Fußnote transparent gemacht.
