source:
  edition: WLC
  text: וַ/יַּעֲנ֣וּ אֶֽת יִרְמְיָ֗הוּ כָּל הָ/אֲנָשִׁ֤ים הַ/יֹּֽדְעִים֙ כִּֽי מְקַטְּר֤וֹת נְשֵׁי/הֶם֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וְ/כָל הַ/נָּשִׁ֥ים הָ/עֹמְד֖וֹת קָהָ֣ל גָּד֑וֹל וְ/כָל הָ/עָ֛ם הַ/יֹּשְׁבִ֥ים בְּ/אֶֽרֶץ מִצְרַ֖יִם בְּ/פַתְר֥וֹס לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/015.yaml
  text: Then all the men who knew that their wives were burning incense to other gods[a], and all the women who were standing by—a great assembly—and all the people who were living in the land of Egypt, in Pathros, answered Jeremiah, saying,
translation:
  language: de
  text: 'Da antworteten Jeremia alle Männer, die wussten, dass ihre Frauen anderen Göttern Räucherwerk verbrannten, ebenso alle Frauen, die standen – eine große Versammlung –, und das ganze Volk, das im Land Ägypten, in Patros, lebte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יִרְמְיָהוּ
  choice: Da antworteten Jeremia
  rationale: ענה bezeichnet hier die Antwort auf Jeremias vorherige Rede. Der Personenname steht im Deutschen als Dativobjekt ohne sichtbare Kasusmarkierung.
- source_word: כָּל־הָאֲנָשִׁים
  choice: alle Männer
  rationale: Im Zusammenhang sind ausdrücklich Männer gemeint, da anschließend von ihren Frauen und danach gesondert von allen Frauen die Rede ist.
- source_word: הַיֹּדְעִים
  choice: die wussten
  rationale: Das Partizip grenzt die Männer als diejenigen ein, denen das Handeln ihrer Frauen bekannt war.
- source_word: מְקַטְּרוֹת
  choice: Räucherwerk verbrannten
  rationale: Das Piel von קטר bezeichnet in diesem kultischen Zusammenhang das Verbrennen von Räucherwerk; die Form ist feminin plural und bezieht sich auf die Frauen.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: Der Dativ gibt die Ausrichtung der kultischen Handlung auf andere Gottheiten natürlich und knapp wieder.
- source_word: וְכָל־הַנָּשִׁים הָעֹמְדוֹת
  choice: ebenso alle Frauen, die dort standen
  rationale: עמד beschreibt die Frauen als am Ort stehende beziehungsweise anwesende Teilnehmerinnen. „Dort standen“ bewahrt das konkrete Bild des Hebräischen.
- source_word: קָהָל גָּדוֹל
  choice: eine große Versammlung
  rationale: Die Nominalfügung charakterisiert die anwesende Gruppe als zahlreiche versammelte Gemeinschaft; die Gedankenstriche bilden den einschiebenden Charakter ab.
- source_word: וְכָל־הָעָם
  choice: und das ganze Volk
  rationale: עם bezeichnet hier umfassend die Bevölkerung beziehungsweise Volksmenge neben den zuvor eigens genannten Gruppen.
- source_word: הַיֹּשְׁבִים
  choice: das … lebte
  rationale: ישב bedeutet in einer geografischen Angabe idiomatisch „leben“ oder „wohnen“. Der Singular richtet sich im Deutschen nach dem Kollektivwort „Volk“.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Die formelle geografische Wendung des Hebräischen wird bewahrt.
- source_word: בְּפַתְרוֹס
  choice: in Patros
  rationale: Der geografische Eigenname wird in seiner im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im modernen Deutschen die im folgenden Vers einsetzende direkte Rede natürlicher ein als das formelhafte „indem sie sagten“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange Aufzählung und der einschiebende Ausdruck „eine große Versammlung“ bleiben entsprechend der hebräischen Satzstruktur erkennbar, werden aber durch Zeichensetzung und „ebenso“ lesbar gegliedert.
