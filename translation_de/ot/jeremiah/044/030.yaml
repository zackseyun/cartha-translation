  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹ֠תֵן אֶת פַּרְעֹ֨ה חָפְרַ֤ע מֶֽלֶךְ מִצְרַ֨יִם֙ בְּ/יַ֣ד אֹֽיְבָ֔י/ו וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשׁ֑/וֹ כַּ/אֲשֶׁ֨ר נָתַ֜תִּי אֶת צִדְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֗ה בְּ/יַ֨ד נְבוּכַדְרֶאצַּ֧ר מֶֽלֶךְ בָּבֶ֛ל אֹיְב֖/וֹ וּ/מְבַקֵּ֥שׁ נַפְשֽׁ/וֹ׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/030.yaml
  text: 'Thus says Yahweh: Behold[a], I am giving Pharaoh Hophra king of Egypt into the hand of his enemies and into the hand of those seeking his life, just as I gave Zedekiah king of Judah into the hand of Nebuchadnezzar king of Babylon, his enemy and the one seeking his life.'
translation:
  language: de
  text: 'So spricht Jahwe: Siehe, ich gebe den Pharao Hophra, den König von Ägypten, in die Hand seiner Feinde und in die Hand derer, die ihm nach dem Leben trachten, so wie ich Zedekia, den König von Juda, in die Hand Nebukadnezars[a], des Königs von Babel, gegeben habe, der Zedekias Feind war und ihm nach dem Leben trachtete.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Nebukadrezzar“; im Deutschen üblicherweise „Nebukadnezar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel in würdigem, geläufigem Deutsch und gibt den Gottesnamen als Jahwe wieder.
- source_word: הִנְנִי נֹתֵן
  choice: Siehe, ich gebe
  rationale: „Siehe“ erhält den feierlichen Hinweischarakter; das Präsens gibt die anschauliche Gewissheit und unmittelbar bevorstehende Ausführung der durch das Partizip bezeichneten Handlung wieder.
- source_word: פַּרְעֹה חָפְרַע
  choice: Pharao Hophra
  rationale: Folgt der hebräischen Namensform statt der griechischen Geschichtsform Apries.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Erhält das verständliche hebräische Bild für die Auslieferung in die Gewalt eines anderen und die Wiederholung im Vers.
- source_word: מְבַקְשֵׁי נַפְשׁוֹ
  choice: die ihm nach dem Leben trachten
  rationale: Gibt die hebräische Wendung idiomatisch und zugleich bildnah als Tötungsabsicht wieder.
- source_word: כַּאֲשֶׁר נָתַתִּי
  choice: so wie ich … gegeben habe
  rationale: Kennzeichnet klar den Vergleich mit der bereits erfolgten Auslieferung Zedekias.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Verwendet die im Deutschen herkömmliche und leicht erkennbare Namensform; die quellennahe Form wird in einer Fußnote genannt.
- source_word: אֹיְבוֹ וּמְבַקֵּשׁ נַפְשׁוֹ
  choice: seines Feindes, der ihm nach dem Leben trachtete
  rationale: Bezieht beide singularischen Bezeichnungen auf Nebukadnezar. Der Relativsatz wirkt im Deutschen natürlicher und bewahrt beide Aussagen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift „Jahwe“ gibt den Eigennamen im Ausgangstext sichtbar wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „in die Hand“ und das einleitende „Siehe“ bewahren die feierliche Bildsprache des Hebräischen; der ansonsten idiomatische Satzbau bleibt für heutige Leser verständlich.
