  text: וַ/תִּתַּ֤ךְ חֲמָתִ/י֙ וְ/אַפִּ֔/י וַ/תִּבְעַר֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרֽוּשָׁלִָ֑ם וַ/תִּהְיֶ֛ינָה לְ/חָרְבָּ֥ה לִ/שְׁמָמָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/006.yaml
  text: So my wrath and my anger were poured out and burned in the cities of Judah and in the streets of Jerusalem[a], and they became a ruin and a desolation, as they are this day.
translation:
  language: de
  text: Da ergossen sich mein Zorn und mein Grimm und brannten in den Städten Judas und auf den Straßen Jerusalems[a]. So wurden sie zu Ruinen und zur Einöde, wie sie es bis zum heutigen Tag sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Plätzen“ oder „auf freien Plätzen Jerusalems“.'
    reason: Lexikalische Alternative zu חֻצוֹת, das Straßen, Plätze oder offene öffentliche Bereiche bezeichnen kann.
lexical_decisions:
- source_word: וַתִּתַּךְ
  choice: Da ergossen sich
  rationale: Das Verb נתך bewahrt in dieser Form das konkrete Bild des Ausgießens. Der Plural im Deutschen richtet sich natürlich nach dem nachgestellten zusammengesetzten Subjekt „mein Zorn und mein Grimm“.
- source_word: חֲמָתִי וְאַפִּי
  choice: mein Zorn und mein Grimm
  rationale: Beide Ausdrücke bezeichnen heftigen göttlichen Zorn. Die Wortpaarung erhält den Parallelismus, ohne das idiomatische אַף wörtlich als „Nase“ wiederzugeben.
- source_word: וַתִּבְעַר
  choice: und brannten
  rationale: בער bezeichnet Brennen oder Lodern. „brannten“ führt das anschauliche Bild des göttlichen Zorns fort; die Pluralform entspricht im Deutschen dem Doppelsubjekt.
- source_word: בְּעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Die Präposition lokalisiert das Brennen in den betroffenen Städten; der Genitiv „Judas“ gibt die hebräische Status-constructus-Verbindung knapp und natürlich wieder.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: und auf den Straßen Jerusalems
  rationale: חֻצוֹת kann Straßen, Plätze oder freie öffentliche Flächen bezeichnen. „Straßen“ ist im Kontext natürlich, während die echte lexikalische Alternative in der Fußnote erhalten bleibt.
- source_word: וַתִּהְיֶינָה לְחָרְבָּה לִשְׁמָמָה
  choice: So wurden sie zu Trümmerstätten und zur Einöde
  rationale: Das feminine Pluralverb weist auf die genannten Orte zurück und beschreibt ihren eingetretenen Zustand. „Trümmerstätten“ und „Einöde“ bewahren die doppelte Aussage von Verwüstung und Verlassenheit.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie sie es noch heute sind
  rationale: Die idiomatische Wendung verweist auf den zur Sprechzeit sichtbaren Zustand. „noch heute“ klingt modern und macht die Fortdauer deutlich, ohne zusätzliche Erklärung einzutragen.
theological_decisions:
- issue: Bildhafte Sprache des göttlichen Gerichts
  choice: Die konkreten Bilder vom Ausgießen und Brennen des göttlichen Zorns werden beibehalten.
  alternative: Abstraktere Wiedergaben wie „mein Gericht kam über sie“ oder „ich bestrafte sie“.
  rationale: Der hebräische Text stellt Gottes Gericht persönlich und bildkräftig dar. Eine abstrakte Umschreibung würde diese theologische und rhetorische Schärfe abschwächen.
- issue: Bezug der femininen Pluralformen
  choice: „sie“ bezieht sich kollektiv auf die Städte und die öffentlichen Bereiche Jerusalems.
  alternative: 'Unpersönlicher Singular: „So wurde alles zur Ruine ... wie es heute ist.“'
  rationale: Die hebräischen femininen Pluralformen lassen den Rückbezug auf die genannten Ortsbezeichnungen erkennen. Die deutsche Fassung hält diesen grammatischen Bezug offen sichtbar.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter prophetischer Bildkraft. „Trümmerstätten“ und „Einöde“ sind gehoben, aber allgemein verständlich; die Satzführung bleibt klar und mündlich lesbar.
