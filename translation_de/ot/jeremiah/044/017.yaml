reference: Jeremiah 44:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֩י עָשֹׂ֨ה נַעֲשֶׂ֜ה אֶֽת כָּל הַ/דָּבָ֣ר אֲשֶׁר יָצָ֣א מִ/פִּ֗י/נוּ לְ/קַטֵּ֞ר לִ/מְלֶ֣כֶת הַ/שָּׁמַיִם֮ וְ/הַסֵּֽיךְ לָ֣/הּ נְסָכִים֒ כַּ/אֲשֶׁ֨ר עָשִׂ֜ינוּ אֲנַ֤חְנוּ וַ/אֲבֹתֵ֨י/נוּ֙ מְלָכֵ֣י/נוּ וְ/שָׂרֵ֔י/נוּ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָ֑ם וַ/נִּֽשְׂבַּֽע לֶ֨חֶם֙ וַ/נִּֽהְיֶ֣ה טוֹבִ֔ים וְ/רָעָ֖ה לֹ֥א רָאִֽינוּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/017.yaml
  text: 'But we will certainly do every word that has gone out from our mouth: to burn incense to the Queen of Heaven and to pour out drink offerings to her[a], just as we and our fathers, our kings and our officials, did in the cities of Judah and in the streets of Jerusalem; then we had plenty of bread, prospered[b], and saw no disaster.'
translation:
  language: de
  text: 'Doch wir werden ganz bestimmt alles tun, was wir ausgesprochen haben: der Himmelskönigin Räucheropfer darbringen und ihr Trankopfer ausgießen, so wie wir, unsere Vorfahren, unsere Könige und unsere führenden Männer es in den Städten Judas und auf den Straßen Jerusalems getan haben. Damals hatten wir Brot in Fülle, uns ging es gut[a], und wir erlebten kein Unglück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wir lebten in guten Verhältnissen“ oder „es erging uns wohl“.'
    reason: Die hebräische Wendung bedeutet wörtlich etwa „wir waren gut/wohl“ und lässt offen, ob allgemeines Wohlergehen oder besonders günstige Lebensverhältnisse gemeint sind.
lexical_decisions:
- source_word: כִּי
  choice: Doch
  rationale: Die Partikel leitet hier im Zusammenhang eine trotzige Gegenrede ein. „Doch“ gibt diesen adversativen Diskurswert natürlich wieder.
- source_word: עָשֹׂה נַעֲשֶׂה
  choice: wir werden ganz bestimmt … tun
  rationale: Der Infinitivus absolutus verstärkt die finite Verbform; „ganz bestimmt“ bildet die nachdrückliche Entschlossenheit im modernen Deutschen idiomatisch ab.
- source_word: כָּל הַדָּבָר אֲשֶׁר יָצָא מִפִּינוּ
  choice: alles, was wir ausgesprochen haben
  rationale: Die hebräische Wendung bezeichnet das aus dem eigenen Mund hervorgegangene Wort, hier also die erklärte oder gelobte Absicht. Die Formulierung wahrt das Mund-Motiv sinngemäß, ohne im Deutschen hölzern zu wirken.
- source_word: לְקַטֵּר
  choice: Räucheropfer darbringen
  rationale: Das Verb bezeichnet im kultischen Zusammenhang das Erzeugen von Opferrauch beziehungsweise das Verbrennen von Räucherwerk. „Räucheropfer darbringen“ ist klar und präzise.
- source_word: לִמְלֶכֶת הַשָּׁמַיִם
  choice: der Himmelskönigin
  rationale: Der Ausdruck ist der Titel der von den Sprechern verehrten Göttin. Die etablierte deutsche Zusammensetzung gibt ihn direkt wieder, ohne die Verehrung zu billigen.
- source_word: וְהַסֵּיךְ לָהּ נְסָכִים
  choice: und ihr Trankopfer ausgießen
  rationale: Die kultische Verbindung aus Verb und Objekt bezeichnet das Ausgießen von Libationen. „Trankopfer“ ist verständlich und sachlich genau.
- source_word: אֲנַחְנוּ וַאֲבֹתֵינוּ מְלָכֵינוּ וְשָׂרֵינוּ
  choice: wir, unsere Vorfahren, unsere Könige und unsere führenden Männer
  rationale: אבות bezeichnet hier die früheren Generationen und wird inklusiv als „Vorfahren“ wiedergegeben. שרים meint hochgestellte politische Führungspersonen; „führende Männer“ passt zur historischen Männergruppe, ohne einen spezifischen Amtstitel festzulegen.
- source_word: בְּעָרֵי יְהוּדָה וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: in den Städten Judas und auf den Straßen Jerusalems
  rationale: חוצות kann Straßen oder öffentliche Plätze bezeichnen. „Straßen“ ist hier die breite, natürliche Wiedergabe.
- source_word: וַנִּשְׂבַּע לֶחֶם
  choice: Damals hatten wir Brot in Fülle
  rationale: Wörtlich waren die Sprecher „mit Brot gesättigt“. „Brot in Fülle haben“ bewahrt das konkrete Bild und drückt ausreichende Versorgung idiomatisch aus.
- source_word: וַנִּהְיֶה טוֹבִים
  choice: uns ging es gut
  rationale: Die Wendung lautet nahe am Hebräischen „wir waren gut/wohl“. „Uns ging es gut“ erhält die offene Bedeutung allgemeinen Wohlergehens, ohne sie auf wirtschaftlichen Wohlstand zu verengen.
- source_word: וְרָעָה לֹא רָאִינוּ
  choice: und wir erlebten kein Unglück
  rationale: ראה kann idiomatisch „erleben“ bedeuten, und רעה bezeichnet hier Unheil oder Unglück, nicht moralische Bosheit.
theological_decisions:
- issue: Wiedergabe des Titels einer verehrten Göttin
  choice: Himmelskönigin
  alternative: Königin des Himmels / Königin der Himmel
  rationale: Der hebräische Kulttitel wird unmittelbar und ohne beschönigende Umschreibung wiedergegeben. Die Formulierung berichtet die abgöttische Verehrung der Sprecher, ohne sie zu bestätigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede klingt bewusst entschlossen und trotzig. Kultische Begriffe bleiben präzise, während schwer verständliche hebräische Idiome natürlich wiedergegeben werden.
