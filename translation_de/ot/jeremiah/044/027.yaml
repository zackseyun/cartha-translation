source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁקֵ֧ד עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֣א לְ/טוֹבָ֑ה וְ/תַמּוּ֩ כָל אִ֨ישׁ יְהוּדָ֜ה אֲשֶׁ֧ר בְּ/אֶֽרֶץ מִצְרַ֛יִם בַּ/חֶ֥רֶב וּ/בָ/רָעָ֖ב עַד כְּלוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/027.yaml
  text: Behold[a], I am watching over them for harm and not for good, and every man of Judah who is in the land of Egypt will come to an end by the sword and by famine[c][b], until they are consumed.
translation:
  language: de
  text: Siehe, ich wache über sie – zum Unheil[a] und nicht zum Guten. Jeder Mann aus Juda[b], der im Land Ägypten ist, wird durch Schwert und Hunger umkommen, bis sie alle vernichtet sind.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Unglück“ beziehungsweise „zum Verderben“. Das hebräische Wort bezeichnet hier Unheil als Folge des Gerichts, nicht moralische Bosheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Hebräischen eine männliche Einzahl mit verteilender Bedeutung: „jeder Mann aus Juda“.'
    reason: source_form
  - marker: c
    text: 'Oder: „bis sie alle umgekommen sind“ oder „bis sie völlig zugrunde gegangen sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Die einleitende Formel lenkt feierlich die Aufmerksamkeit auf die folgende göttliche Erklärung; „Siehe“ bewahrt den prophetischen Ton.
- source_word: שֹׁקֵד עֲלֵיהֶם
  choice: ich wache über sie
  rationale: Das Partizip bezeichnet anhaltende, wachsame Aufmerksamkeit. Die feindliche Zielrichtung wird nicht in das Verb verlegt, sondern durch „zum Unheil“ ausgedrückt.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: zum Unheil und nicht zum Guten
  rationale: „Unheil“ bezeichnet hier die schädliche Gerichtsfolge, nicht moralische Bosheit, und erhält den direkten Gegensatz zu „dem Guten“.
- source_word: וְתַמּוּ
  choice: wird … umkommen
  rationale: Das Verb תמם bezeichnet das Zu-Ende-Kommen beziehungsweise Aufhören. Im Zusammenhang von Schwert und Hunger gibt „umkommen“ den Sinn natürlich und deutlich wieder.
- source_word: כָל אִישׁ יְהוּדָה
  choice: jeder Mann aus Juda
  rationale: Die Übersetzung erhält die distributive Einzahl und die ausdrücklich männliche Form des Hebräischen; „aus Juda“ klingt im modernen Deutschen natürlicher als „Judas“.
- source_word: בַּחֶרֶב וּבָרָעָב
  choice: durch Schwert und Hunger
  rationale: Die Formulierung bewahrt die instrumentale Bedeutung und die in Jeremia häufige Gerichtsformel.
- source_word: עַד כְּלוֹתָם
  choice: bis sie alle aufgerieben sind
  rationale: כלה bezeichnet hier die vollständige Aufzehrung der betroffenen Gruppe. Der Plural greift die Gesamtheit auf, die zuvor distributiv als „jeder Mann“ bezeichnet wurde.
theological_decisions:
- issue: Gerichtssprache, ohne Gott moralische Bosheit zuzuschreiben
  choice: zum Unheil
  alternative: zum Bösen
  rationale: רָעָה bezeichnet in diesem Gerichtszusammenhang drohendes Unglück beziehungsweise eine schädliche Folge. „Unheil“ erhält die Härte der Aussage, ohne die mögliche Fehlbedeutung moralischer Bosheit nahezulegen.
- issue: Distributive und geschlechtsspezifische Formulierung
  choice: jeder Mann aus Juda
  alternative: alle Menschen aus Juda
  rationale: כָל אִישׁ ist grammatisch männlich und distributiv. Die gewählte Fassung bewahrt beides, ohne festzulegen, ob der größere Zusammenhang darüber hinaus weitere Angehörige der judäischen Gemeinschaft einschließt.
- issue: Spannung zwischen göttlicher Wachsamkeit und Gericht
  choice: ich wache über sie – zum Unheil
  alternative: ich bin darauf bedacht, ihnen Unheil zuzufügen
  rationale: Die Übersetzung erhält das Bild wachsamer Aufmerksamkeit und lässt die ausdrücklich negative Zielrichtung im anschließenden Ausdruck stehen, statt beides interpretierend zu einem einzigen Wirkverb zu verschmelzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem prophetischem „Siehe“. Der Gedankenstrich macht die erschütternde Umkehrung des sonst schützenden „Wachens über“ hörbar. Die distributive Einzahl wird im ersten Satzteil erhalten; der abschließende Plural gibt den kollektiven Bezug des hebräischen Suffixes wieder.
