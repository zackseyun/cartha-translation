  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֶל כָּל הָ/עָ֑ם עַל הַ/גְּבָרִ֤ים וְ/עַל הַ/נָּשִׁים֙ וְ/עַל כָּל הָ/עָ֔ם הָ/עֹנִ֥ים אֹת֛/וֹ דָּבָ֖ר לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/020.yaml
  text: Then Jeremiah said to all the people—to the men[a], to the women, and to all the people who were answering him, saying,
translation:
  language: de
  text: 'Da sagte Jeremia zu dem ganzen Volk – zu den Männern und Frauen und zu allen, die ihm antworteten[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die ihm ein Wort erwiderten“; gemeint ist: „die ihm antworteten“ oder „ihm eine Antwort gaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Die im Deutschen etablierte Namensform.
- source_word: אֶל כָּל הָעָם
  choice: zu dem ganzen Volk
  rationale: Gibt die Präposition אֶל und die kollektive Bedeutung von עָם unmittelbar wieder.
- source_word: עַל הַגְּבָרִים וְעַל הַנָּשִׁים
  choice: zu den Männern und den Frauen
  rationale: Die mit עַל angeschlossenen Gruppen erläutern hier appositionell, an wen Jeremia sich wendet. Die Wiedergabe mit „zu“ ist im Deutschen klarer als „über“ oder „gegen“ und bewahrt beide ausdrücklich genannten Gruppen.
- source_word: וְעַל כָּל הָעָם
  choice: und zu all den Leuten
  rationale: Bewahrt die wiederholte umfassende Bezeichnung, vermeidet aber durch „Leute“ eine im Deutschen schwerfällige unmittelbare Wiederholung von „Volk“.
- source_word: הָעֹנִים אֹתוֹ דָּבָר
  choice: die ihm antworteten
  rationale: Das Partizip bezeichnet diejenigen, die Jeremia eine Antwort gaben. Das unbestimmte דָּבָר gehört zu einer knappen hebräischen Wendung und muss im idiomatischen Deutschen nicht eigens mit „ein Wort“ wiedergegeben werden; die wörtlichere Form wird in der Fußnote dokumentiert.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im Deutschen natürlich die Funktion der hebräischen Redeeinleitung und zeigt an, dass im folgenden Vers die direkte Rede beginnt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die appositionelle Entfaltung von „dem ganzen Volk“ verständlich; die Wiederholung und die ausdrückliche Nennung von Männern und Frauen bleiben erhalten.
