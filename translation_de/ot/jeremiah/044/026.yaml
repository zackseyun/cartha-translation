source:
  edition: WLC
  text: לָ/כֵן֙ שִׁמְע֣וּ דְבַר יְהוָ֔ה כָּל יְהוּדָ֕ה הַ/יֹּשְׁבִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם הִנְ/נִ֨י נִשְׁבַּ֜עְתִּי בִּ/שְׁמִ֤/י הַ/גָּדוֹל֙ אָמַ֣ר יְהוָ֔ה אִם יִהְיֶה֩ ע֨וֹד שְׁמִ֜/י נִקְרָ֣א בְּ/פִ֣י כָּל אִ֣ישׁ יְהוּדָ֗ה אֹמֵ֛ר חַי אֲדֹנָ֥/י יְהוִ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/044/026.yaml
  text: 'Therefore hear the word of Yahweh[a], all Judah who dwell in the land of Egypt: Behold, I have sworn by my great name, says Yahweh, that my name shall no longer be called upon by the mouth of any man of Judah in all the land of Egypt, saying, ‘As the Lord GOD lives.’'
translation:
  language: de
  text: 'Darum hört das Wort Jahwes, alle Judäer, die ihr im Land Ägypten wohnt! Siehe, ich habe bei meinem großen Namen geschworen, spricht Jahwe: Im ganzen Land Ägypten wird mein Name von keinem Mann aus Juda mehr bei einem Schwur angerufen werden[a]: »So wahr der Herr Jahwe lebt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Mein Name wird nicht mehr im Mund irgendeines Mannes aus Juda genannt werden.« Gemeint ist hier das Aussprechen beziehungsweise Anrufen des Gottesnamens in einem Schwur.'
    reason: Die hebräische Wendung ist bildhaft und kann formal enger oder ihrer Funktion im Schwur entsprechend wiedergegeben werden.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Gerichtsankündigung knapp und natürlich.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: hört das Wort Jahwes
  rationale: Bewahrt die prophetische Botenformel und gibt den Pluralimperativ direkt wieder.
- source_word: כָּל יְהוּדָה הַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: ihr alle aus Juda, die ihr im Land Ägypten wohnt
  rationale: Gibt die kollektive Anrede verständlich wieder und bewahrt die Vorstellung vom Land Ägypten.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Leitet die feierliche göttliche Erklärung in würdigem prophetischem Stil ein.
- source_word: נִשְׁבַּעְתִּי בִּשְׁמִי הַגָּדוֹל
  choice: ich habe bei meinem großen Namen geschworen
  rationale: Bewahrt Tempus, Schwurformel und das Gewicht des göttlichen Namens.
- source_word: אִם יִהְיֶה עוֹד
  choice: wird … nicht mehr
  rationale: Nach der Schwurformel trägt אִם hier die Kraft einer nachdrücklichen Verneinung.
- source_word: שְׁמִי נִקְרָא בְּפִי
  choice: mein Name … bei einem Schwur angerufen werden
  rationale: Gibt die Funktion der hebräischen Wendung im unmittelbar folgenden Schwurspruch wieder, ohne die Beziehung zum göttlichen Namen zu verlieren.
- source_word: כָּל אִישׁ יְהוּדָה
  choice: von keinem Mann aus Juda
  rationale: Bewahrt den distributiven Sinn sowie die grammatisch maskuline Einzahl des Ausgangstextes.
- source_word: חַי אֲדֹנָי יְהוִה
  choice: So wahr der Herr Jahwe lebt
  rationale: Entspricht der üblichen Bedeutung der hebräischen Schwurformel und unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- issue: Wiedergabe von אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: Gott, der HERR
  rationale: Die Übersetzung bewahrt sowohl den Titel „Herr“ als auch den unmittelbar folgenden Gottesnamen, ohne beide zu verschmelzen.
- issue: Generisches אִישׁ in der verneinten distributiven Aussage
  choice: kein Mann aus Juda
  alternative: niemand aus Juda
  rationale: Die Formulierung hält die maskuline Einzahl des Hebräischen sichtbar; der Kontext bezeichnet zugleich die gesamte judäische Gemeinschaft.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem prophetischem Ton. „Siehe“ und die Formel „spricht Jahwe“ bewahren die Feierlichkeit; Satzbau und Anrede bleiben zugleich natürlich deutsch.
