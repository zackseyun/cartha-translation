base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
translation:
  language: de
  text: Und ich werde das Schwert, die Hungersnot und die Seuche[a] gegen sie schicken, bis sie vom Land, das ich ihnen und ihren Vätern gegeben habe, weggerafft sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Pest. Das hebräische Wort bezeichnet eine Seuche beziehungsweise epidemische Krankheit und nicht notwendigerweise die historisch als Pest bekannte Krankheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי בָם
  choice: Und ich werde … gegen sie schicken
  rationale: Das Piel von שׁלח bezeichnet hier das Aussenden feindlicher Gerichtsmächte; בָם gibt ihre feindliche Ausrichtung auf die Betroffenen wieder. „Gegen sie schicken“ ist im Deutschen klar und bewahrt Gottes ausdrücklich genannte Urheberschaft.
- source_word: הַחֶרֶב
  choice: das Schwert
  rationale: חֶרֶב bezeichnet wörtlich das Schwert und steht hier zugleich metonymisch für Krieg und gewaltsamen Tod. Das konkrete Bild bleibt als Bestandteil der prophetischen Gerichtsformel erhalten.
- source_word: הָרָעָב
  choice: den Hunger
  rationale: רָעָב meint in diesem Gerichtszusammenhang eine durch Mangel verursachte Hungersnot. „Hunger“ ist in der festen deutschen Dreierformel „Schwert, Hunger und Pest“ natürlich und umfasst die tödliche Notlage, ohne den Sinn abzuschwächen.
- source_word: הַדָּבֶר
  choice: die Pest
  rationale: דֶּבֶר bezeichnet in prophetischen Gerichtsformeln eine tödliche, epidemische Krankheit. „Pest“ bewahrt die traditionelle Prägnanz, darf aber nicht auf die historisch so benannte Einzelkrankheit verengt werden; deshalb steht eine Fußnote.
- source_word: עַד תֻּמָּם
  choice: bis sie … völlig verschwunden sind
  rationale: Die Form von תמם drückt aus, dass die Betroffenen vollständig zu Ende kommen. Die Wiedergabe ist idiomatisch, erhält aber durch „völlig“ den Aspekt der Vollständigkeit.
- source_word: מֵעַל הָאֲדָמָה
  choice: aus dem Land
  rationale: מֵעַל bedeutet wörtlich „von … herab/weg“; zusammen mit אֲדָמָה ist hier das von Gott gegebene Land als Lebensraum gemeint. „Aus dem Land verschwunden“ gibt die Entfernung von dessen Oberfläche in natürlichem Deutsch wieder.
- source_word: אֲשֶׁר נָתַתִּי לָהֶם וְלַאֲבוֹתֵיהֶם
  choice: das ich ihnen und ihren Vätern gegeben habe
  rationale: Die Formulierung bewahrt den Rückbezug auf die Gabe des Landes an die gegenwärtige Generation und ihre Väter. „Vätern“ entspricht der geschichtlichen und bundesbezogenen Konkretheit von אֲבוֹתֵיהֶם.
theological_decisions:
- issue: Bundesbezogene Sprache von der Gabe des Landes
  choice: das Land, das ich ihnen und ihren Vätern gegeben habe
  alternative: das Land, das ich ihnen und ihren Vorfahren gegeben habe
  rationale: „Vätern“ hält die konkrete generationenübergreifende Bundesgeschichte des hebräischen Textes fest. Die allgemeinere Wiedergabe „Vorfahren“ ist sprachlich möglich, würde diese patriarchale Ausdrucksweise jedoch einebnen.
- issue: Göttliche Urheberschaft des Gerichts
  choice: ich werde … gegen sie schicken
  alternative: über sie werden … kommen
  rationale: Die erste Person des hebräischen Verbs nennt Gott ausdrücklich als den Handelnden. Eine unpersönliche Formulierung würde diese theologische Spannung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle und einprägsame Gerichtsformel „Schwert, Hunger und Pest“ bleibt erhalten. Die Satzstellung setzt den langen Relativsatz direkt zu „Land“ und hält den Abschluss zugleich gut verständlich.
