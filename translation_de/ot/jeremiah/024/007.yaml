  to: Und ich werde ihnen ein Herz geben, damit sie mich als den HERRN erkennen.[a] Und sie werden mein Volk sein, und ich werde ihr Gott sein; denn sie werden mit ihrem ganzen Herzen zu mir zurückkehren.[b]
