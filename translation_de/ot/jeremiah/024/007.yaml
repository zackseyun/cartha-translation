base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
translation:
  language: de
  text: Und ich werde ihnen ein Herz geben, damit sie mich als den HERRN erkennen.[a] Und sie werden mein Volk sein, und ich werde ihr Gott sein; denn sie werden mit ihrem ganzen Herzen zu mir zurückkehren.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn ich bin der HERR“.'
    reason: alternative_reading
  - marker: b
    text: „Zurückkehren“ kann hier auch im Sinn von „umkehren“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי לָהֶם לֵב
  choice: Und ich werde ihnen ein Herz geben
  rationale: Die prophetische Perfektform bezeichnet hier eine zukünftige Zusage. Das Bild vom Herzen bleibt erhalten und umfasst Denken, Wollen und die innere Person.
- source_word: לָדַעַת אֹתִי
  choice: mich zu erkennen
  rationale: „Erkennen“ wahrt sowohl den Erkenntnisaspekt als auch die relationale, bundeshafte Tiefe des hebräischen ידע.
- source_word: כִּי אֲנִי יְהוָה
  choice: dass ich der HERR bin
  rationale: כִּי führt hier am natürlichsten den Inhalt des Erkennens ein. Der Gottesname wird gemäß dem deutschen Projektstil mit „der HERR“ wiedergegeben.
- source_word: וְהָיוּ לִי לְעָם
  choice: Dann werden sie mein Volk sein
  rationale: Die vertraute Bundesformel wird idiomatisch bewahrt. „Dann“ gibt die Folgebeziehung im Deutschen flüssig wieder, ohne eine zusätzliche theologische Aussage einzutragen.
- source_word: וְאָנֹכִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: und ich werde ihr Gott sein
  rationale: Dies erhält die wechselseitige Bundesformel in natürlichem, würdigem Deutsch.
- source_word: כִּי יָשֻׁבוּ אֵלַי
  choice: denn sie werden zu mir zurückkehren
  rationale: Das abschließende כִּי wird kausal verstanden; שׁוב bezeichnet hier die Rückkehr zu Gott und kann zugleich Umkehr anklingen lassen.
- source_word: בְּכָל לִבָּם
  choice: mit ganzem Herzen
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild einer ungeteilten Hinwendung der ganzen inneren Person.
theological_decisions:
- issue: Bundesformel
  choice: „sie werden mein Volk sein, und ich werde ihr Gott sein“
  alternative: Eine freie Umschreibung ihrer gegenseitigen Zugehörigkeit
  rationale: Die formelhafte Gestalt ist für Jeremias Bundestheologie und die innerbiblischen Bezüge bedeutsam und sollte daher sichtbar bleiben.
- issue: Bedeutung von „mich erkennen“
  choice: Die knappe Formulierung „mich zu erkennen“ bleibt stehen.
  alternative: „mich anzuerkennen“ oder „zu verstehen, dass ich der HERR bin“
  rationale: Der hebräische Ausdruck umfasst mehr als bloßes Wissen, ohne dass die Übersetzung seine relationale und theologische Bedeutung ausformulieren sollte.
- issue: Funktion des ersten כִּי
  choice: 'Inhaltssatz: „dass ich der HERR bin“'
  alternative: 'Begründungssatz: „denn ich bin der HERR“'
  rationale: Beides ist grammatisch möglich; im Zusammenhang mit „erkennen“ liegt die inhaltliche Lesart näher. Die Alternative wird in einer Fußnote erhalten.
- issue: Funktion des letzten כִּי
  choice: 'kausal: „denn“'
  alternative: Eine lose weiterführende Verbindung ohne ausdrücklich kausale Markierung
  rationale: Die kausale Lesart verbindet Gottes erneuernde Gabe und die ganzherzige Rückkehr, ohne deren theologisches Verhältnis weiter zu systematisieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Herzmetaphorik und die vertraute Bundesformel bleiben erhalten; unnötige Archaismen und konfessionell geprägte Zusätze werden vermieden.
