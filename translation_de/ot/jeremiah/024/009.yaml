base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
translation:
  language: de
  text: Ich mache sie zu einem Schrecken, zu einem Unheil für alle Königreiche der Erde, zur Schmach, zum Sprichwort, zum Spott und zum Fluch an allen Orten, wohin ich sie vertreibe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Oder: „an die ich sie verbanne“. Das Verb kann „wegtreiben“ oder „verbannen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  choice: Ich mache sie
  rationale: נתן mit der prädikativen ל-Konstruktion bezeichnet hier, dass Gott sie in einen bestimmten Zustand versetzt bzw. zu etwas macht.
- source_word: לְזַוֲעָה
  choice: zum Bild des Entsetzens
  rationale: Das seltene Substantiv bezeichnet etwas, das Schauder oder Entsetzen hervorruft. Die Formulierung macht deutlich, dass sie anderen zum abschreckenden Anblick werden.
- source_word: לְרָעָה
  choice: zum Unheil
  rationale: רעה bezeichnet hier im Zusammenhang des Gerichts Unheil bzw. Verderben; die substantivische Wiedergabe erhält die Reihung der hebräischen ל-Ausdrücke.
- source_word: לְכָל מַמְלְכוֹת הָאָרֶץ
  choice: für alle Königreiche der Erde
  rationale: Die Präposition bezeichnet die Königreiche, vor deren Augen bzw. für die sie zu Entsetzen und Unheil werden.
- source_word: לְחֶרְפָּה
  choice: zum Gegenstand der Schande
  rationale: חרפה umfasst Schmach, Schande und verächtliche Beschimpfung. Die explizite Wendung passt grammatisch zur Reihe und ist im Deutschen verständlich.
- source_word: וּלְמָשָׁל
  choice: zum Sprichwort
  rationale: משל bedeutet Sprichwort oder sprichwörtliche Redensart; im Gerichtskontext schwingt die Bedeutung eines abschätzigen Sinnbilds mit.
- source_word: לִשְׁנִינָה
  choice: zum Spott
  rationale: Das seltene Wort bezeichnet höhnisches oder spöttisches Reden und wird so von משל unterschieden.
- source_word: וְלִקְלָלָה
  choice: zum Fluch
  rationale: קללה bezeichnet einen Fluch; ihr Schicksal wird zum Muster einer Fluchformel.
- source_word: בְּכָל הַמְּקֹמוֹת
  choice: an allen Orten
  rationale: Direkte und natürliche locative Wiedergabe.
- source_word: אֲשֶׁר אַדִּיחֵם שָׁם
  choice: wohin ich sie vertreibe
  rationale: Der Hifil von נדח bedeutet gewaltsam wegtreiben oder verbannen. „Vertreiben“ bewahrt die aktive, nachdrückliche Handlung und die Richtungskomponente.
theological_decisions:
- issue: Form der Gerichtsankündigung
  choice: Die gehäufte Reihe der Folgen bzw. Stellungen wird als Aufzählung bewahrt.
  alternative: Die Aussagen zu einer allgemeinen Umschreibung wie „Ich bringe großes Unglück über sie“ zusammenziehen.
  rationale: Die wiederholten ל-Konstruktionen steigern Schande und öffentliche Bekanntheit des Gerichts. Eine geglättete Paraphrase würde diese rhetorische Wirkung und einzelne Bedeutungsaspekte verlieren.
- issue: Bedeutung von לְרָעָה
  choice: „zum Unheil“ als Gerichtsfolge bzw. verhängnisvoller Zustand
  alternative: „zum Bösen“ oder „ihnen zum Schaden“
  rationale: „Unheil“ lässt offen, ob besonders ihr eigener verhängnisvoller Zustand oder ihre Wirkung vor den Königreichen betont ist, und vermeidet eine moralische Festlegung, die der Kontext nicht erzwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die mehrfachen „zum“-Glieder spiegeln die eindringliche hebräische Aufzählung, ohne unnatürlich wörtlich zu wirken. „Bild des Entsetzens“ und „Gegenstand der Schande“ verdeutlichen die prädikative Funktion der abstrakten Substantive.
