  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
translation:
  language: de
  text: 'So spricht der HERR, der Gott Israels: Wie diese guten Feigen, so werde ich die Weggeführten aus Juda[a], die ich von diesem Ort in das Land der Chaldäer weggeschickt habe, wohlwollend beachten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die Wegführung Judas“ oder „die Gefangenschaft Judas“. Das hebräische Wort kann sowohl die weggeführten Menschen als auch den Zustand oder Vorgang der Verbannung bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „zum Guten“. Der Begünstigte wird im Hebräischen nicht ausdrücklich genannt; möglich ist: „zu ihrem Guten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Gängige, würdige Wiedergabe der prophetischen Botenformel im Deutschen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens macht kenntlich, dass im Hebräischen das Tetragramm steht.
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה ... כֵּן
  choice: Wie diese guten Feigen, so
  rationale: Bewahrt die ausdrücklich korrelative Vergleichsstruktur des Hebräischen.
- source_word: אַכִּיר ... לְטוֹבָה
  choice: als gut ansehen
  rationale: Gibt die wertende beziehungsweise wohlwollende Anerkennung im Zusammenhang des Bildes von den guten Feigen natürlich wieder; die genaue Zuordnung von לְטוֹבָה bleibt in einer Fußnote sichtbar.
- source_word: גָּלוּת יְהוּדָה
  choice: die Weggeführten Judas
  rationale: Der Kollektivbegriff bezeichnet hier am wahrscheinlichsten die Menschen aus Juda, wie das personenbezogene Relativgefüge zeigt.
- source_word: שִׁלַּחְתִּי
  choice: geschickt habe
  rationale: Bewahrt Gottes ausdrücklich genannte Urheberschaft, ohne den allgemeineren hebräischen Ausdruck unnötig als politischen Fachbegriff zu präzisieren.
- source_word: אֶרֶץ כַּשְׂדִּים
  choice: ins Land der Chaldäer
  rationale: Formale Wiedergabe der ethnogeografischen Bezeichnung des Ausgangstextes.
theological_decisions:
- issue: Referent von גָּלוּת יְהוּדָה
  choice: 'personenbezogen: „die Weggeführten Judas“'
  alternative: 'abstrakt oder zustandsbezogen: „die Verbannung/Gefangenschaft Judas“'
  rationale: Der Vergleich mit den Feigen und der anschließende Relativsatz sprechen im Kontext für die deportierten Menschen; die lexikalische Mehrdeutigkeit wird dennoch angemerkt.
- issue: Bezug von לְטוֹבָה
  choice: 'mit אַכִּיר verbunden: „als gut ansehen“'
  alternative: 'final beziehungsweise benefaktiv auf das Wegschicken bezogen: „zu ihrem Guten geschickt“'
  rationale: Die Verbindung mit der göttlichen Beurteilung führt das Bild der guten Feigen unmittelbar fort. Wegen der möglichen syntaktischen Zuordnung zum Wegschicken wird die Alternative nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Weggeführte“ ist weniger technisch als „Deportierte“ und bildet die Personenbezogenheit des hebräischen Kollektivbegriffs ab. Die Satzstellung hält Vergleich, göttliche Bewertung und Relativsatz klar erkennbar.
