  naturalness: „Wohlwollend beachten“ ist modernes, verständliches Standarddeutsch und gibt die fürsorglich-günstige Nuance von אַכִּיר ... לְטוֹבָה wieder. „Weggeschickt“ macht die Richtung des hebräischen Verbs deutlicher als das bloße „geschickt“.
  terminology: „der HERR“ ist für יהוה in einer deutschen Bibelübersetzung angemessen. „Weggeführten aus Juda“ bewahrt den personenbezogenen Kollektivsinn, ohne den abstrakten Alternativsinn auszuschließen. „Land der Chaldäer“ ist quellennah und verständlich.
