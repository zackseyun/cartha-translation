  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ יִרְמְיָ֔הוּ וָ/אֹמַ֖ר תְּאֵנִ֑ים הַ/תְּאֵנִ֤ים הַ/טֹּבוֹת֙ טֹב֣וֹת מְאֹ֔ד וְ/הָֽ/רָעוֹת֙ רָע֣וֹת מְאֹ֔ד אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹֽעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/003.yaml
  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: „Was siehst du, Jeremia?“ Ich antwortete: „Feigen. Die guten Feigen sind sehr gut, und die schlechten sind sehr schlecht – so schlecht, dass man sie nicht essen kann.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die man wegen ihrer schlechten Beschaffenheit nicht essen kann.“'
    reason: Die Präposition מִן in מֵרֹעַ kann kausal („wegen ihrer Schlechtigkeit“) verstanden werden; der Haupttext gibt die mögliche Gradbedeutung idiomatisch wieder.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative וַ führt die Handlung fort; „Da“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: מָה אַתָּה רֹאֶה
  choice: Was siehst du
  rationale: Die partizipiale Frage wird als idiomatische deutsche Gegenwartsfrage wiedergegeben.
- source_word: תְּאֵנִים
  choice: Feigen
  rationale: Die knappe Antwort Jeremias wird in ihrer prägnanten Form beibehalten.
- source_word: הַתְּאֵנִים הַטֹּבוֹת טֹבוֹת מְאֹד
  choice: Die guten Feigen sind sehr gut
  rationale: Die emphatische Wiederholung von „gut“ bleibt erhalten.
- source_word: וְהָרָעוֹת רָעוֹת מְאֹד
  choice: und die schlechten sind sehr schlecht
  rationale: רעות bezeichnet hier die Beschaffenheit der Feigen, nicht moralische Bosheit; „schlecht“ wahrt zugleich die Wiederholung.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה
  choice: dass man sie nicht essen kann
  rationale: Die unpersönliche deutsche Konstruktion gibt den passivischen Sinn natürlich wieder.
- source_word: מֵרֹעַ
  choice: so schlecht
  rationale: Die Wendung kann Ursache oder Grad ausdrücken; im Haupttext wird der Grad idiomatisch wiedergegeben, während die kausale Lesart in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt den Eigennamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Antwort „Feigen“ und die betonte Wiederholung „gut … gut / schlecht … schlecht“ bleiben erhalten. Der Gedankenstrich verdeutlicht die steigernde Erklärung, ohne zusätzliche Aussage einzuführen.
