  text: וְ/שַׂמְתִּ֨י עֵינִ֤/י עֲלֵי/הֶם֙ לְ/טוֹבָ֔ה וַ/הֲשִׁבֹתִ֖י/ם עַל הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְנִיתִי/ם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וּ/נְטַעְתִּ֖י/ם וְ/לֹ֥א אֶתּֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
translation:
  language: de
  text: Ich werde meinen Blick zu ihrem Wohl auf sie richten[a] und sie in dieses Land zurückbringen[b]. Ich werde sie aufbauen und nicht niederreißen[c]; ich werde sie pflanzen und nicht entwurzeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zum Guten“; das heißt, mit einer ihnen zugutekommenden Absicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie in diesem Land wiederherstellen“. Im Zusammenhang steht jedoch ihre Rückkehr aus dem Exil im Vordergrund.'
    reason: lexical_alternative
  - marker: c
    text: 'Das Hebräische verwendet zwei aufeinander bezogene Bildpaare für die Wiederherstellung: „aufbauen – nicht niederreißen“ und „pflanzen – nicht entwurzeln“.'
    reason: cross_reference
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: Ich werde meinen Blick auf sie richten
  rationale: Die Formulierung bewahrt das hebräische Bild vom auf jemanden gerichteten Auge, klingt im modernen Deutschen natürlich und bezeichnet hier Gottes wohlwollende, fürsorgliche Zuwendung.
- source_word: לְטוֹבָה
  choice: zu ihrem Wohl
  rationale: Die Wendung bezeichnet eine günstige Absicht oder Wirkung. „Zu ihrem Wohl“ ist idiomatisches Deutsch und lässt den umfassenden Charakter des verheißenen Guten bestehen.
- source_word: וַהֲשִׁבֹתִים
  choice: ich werde sie zurückbringen
  rationale: Der Hifil von שׁוב mit direktem Objekt bezeichnet hier das Veranlassen der Rückkehr. Im Exilskontext gibt „zurückbringen“ die konkrete räumliche Aussage klar wieder.
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: in dieses Land
  rationale: עַל hat bei einem Verb der Rückkehr eine direktionale Funktion. Gemeint ist das konkrete Land, in das die Verbannten zurückgebracht werden.
- source_word: וּבְנִיתִים
  choice: ich werde sie aufbauen
  rationale: Das Volk selbst ist Objekt des Verbs. „Aufbauen“ erhält die Baumetapher und bezeichnet zugleich Wiederherstellung und Festigung.
- source_word: וְלֹא אֶהֱרֹס
  choice: und nicht niederreißen
  rationale: „Niederreißen“ bildet den natürlichen metaphorischen Gegensatz zu „aufbauen“ und bewahrt das für Jeremia charakteristische Wortpaar.
- source_word: וּנְטַעְתִּים
  choice: ich werde sie pflanzen
  rationale: Die wörtliche Wiedergabe erhält die landwirtschaftliche Metapher, mit der dauerhafte Verwurzelung und Bestand verheißen werden.
- source_word: וְלֹא אֶתּוֹשׁ
  choice: und nicht entwurzeln
  rationale: „Entwurzeln“ gibt das Herausreißen einer Pflanze samt Wurzel prägnant wieder und bildet im Deutschen den klaren Gegenpol zu „pflanzen“.
theological_decisions:
- issue: Wiederherstellung im Zusammenhang von Bundesgericht und Heil
  choice: Die Aussage wird als konkrete Verheißung wohlwollender göttlicher Zuwendung und der Rückkehr aus dem Exil wiedergegeben; die Bilder des Aufbauens und Pflanzens bleiben erhalten.
  alternative: Eine allgemeine Wohlstandsverheißung oder eine ausschließlich geistliche Wiederherstellung.
  rationale: Der unmittelbare Zusammenhang handelt von den Verbannten, denen der HERR Gutes erweisen und die er in das Land zurückbringen wird. Die Übersetzung hält diese geschichtlich-räumliche Aussage fest, ohne mögliche weiterführende theologische Bezüge festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die beiden prophetischen Bildpaare bleiben sichtbar; räumliche Rückkehr und göttliche Zuwendung werden klar ausgedrückt, ohne die Aussage konfessionell oder später heilsgeschichtlich auszudeuten.
