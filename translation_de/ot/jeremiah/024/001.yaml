  source_fidelity: 'Die Grundbedeutung wird überwiegend zutreffend wiedergegeben: Jahwe zeigt dem Propheten zwei vor dem Tempel aufgestellte Feigenkörbe, und die vorausgehende Wegführung Jojachins/Jechonjas sowie weiterer Gruppen nach Babylon wird erfasst. Die Apposition zu Jechonja muss jedoch im Deutschen eindeutig als „König von Juda“ markiert werden. Zudem sollte die zeitliche Angabe direkt an den Satz über die Körbe angeschlossen werden.'
  naturalness: „Das war, nachdem …“ ist in diesem Zusammenhang unnötig schwerfällig und lässt den Bezug unscharf erscheinen. Ein einheitlicher Satz mit „nachdem“ ist modernes, klares Standarddeutsch. „Siehe“ ist als bewusster gehobener Ausdruck für die visionäre Präsentationspartikel angemessen.
  terminology: „Jahwe“, „Nebukadrezzar“, „Jechonja“, „Amtsträger Judas“, „Handwerker“ und „Schmiede“ sind vertretbar. Bei den Berufsbezeichnungen bleibt die Unsicherheit sinnvoll in einer Fußnote vermerkt. Die Fußnote zu beiden Berufsbezeichnungen muss an beide Ausdrücke angebunden sein.
