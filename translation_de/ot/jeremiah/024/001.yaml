    rationale: Im Hebräischen ist Jechonja sowohl „Sohn Jojakims“ als auch „König von Juda“. Durch die parallele Akkusativ-Apposition „den Sohn Jojakims, den König von Juda“ wird dies im Deutschen eindeutig.
  - severity: medium
