    rationale: אַחֲרֵי הַגְלוֹת bezieht die Vision bzw. die aufgestellten Körbe zeitlich auf die zuvor erfolgte Wegführung. Die direkte Anbindung mit „nachdem“ gibt den Zusammenhang idiomatischer wieder.
  - severity: low
