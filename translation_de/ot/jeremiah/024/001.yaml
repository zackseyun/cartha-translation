- from: 'Jahwe zeigte mir: Siehe, zwei Körbe mit Feigen waren vor dem Tempel Jahwes aufgestellt. Das war, nachdem Nebukadrezzar[a], der König von Babylon, Jechonja, den Sohn Jojakims und König von Juda, zusammen mit den Amtsträgern Judas[b], den Handwerkern und den Schmieden[c] aus Jerusalem in die Verbannung geführt und nach Babylon gebracht hatte.'
  to: 'Jahwe zeigte mir, und siehe: Zwei Körbe mit Feigen waren vor dem Tempel Jahwes aufgestellt, nachdem Nebukadrezzar[a], der König von Babylon, Jechonja, den Sohn Jojakims, den König von Juda, zusammen mit den Amtsträgern Judas[b], den Handwerkern und den Schmieden[c] aus Jerusalem in die Verbannung geführt und nach Babylon gebracht hatte.'
  rationale: Die Überarbeitung klärt die Apposition zu Jechonja, verbindet die zeitliche Bestimmung unmittelbar mit dem Aufstellen der Körbe und setzt den Anker der Berufsgruppen-Fußnote an die gesamte betreffende Wortgruppe. Die Bedeutung, die Namensformen und die im Hebräischen bestehende begriffliche Unsicherheit bleiben erhalten.
