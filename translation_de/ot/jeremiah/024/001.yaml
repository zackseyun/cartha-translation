reference: Jeremiah 24:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִרְאַ/נִי֮ יְהוָה֒ וְ/הִנֵּ֗ה שְׁנֵי֙ דּוּדָאֵ֣י תְאֵנִ֔ים מוּעָדִ֕ים לִ/פְנֵ֖י הֵיכַ֣ל יְהוָ֑ה אַחֲרֵ֣י הַגְל֣וֹת נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֡ל אֶת יְכָנְיָ֣הוּ בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָה֩ וְ/אֶת שָׂרֵ֨י יְהוּדָ֜ה וְ/אֶת הֶ/חָרָ֤שׁ וְ/אֶת הַ/מַּסְגֵּר֙ מִ/יר֣וּשָׁלִַ֔ם וַ/יְבִאֵ֖/ם בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
translation:
  language: de
  text: 'Jahwe zeigte mir, und siehe: Zwei Körbe mit Feigen waren vor dem Tempel Jahwes aufgestellt, nachdem Nebukadrezzar[a], der König von Babylon, Jechonja, den Sohn Jojakims, den König von Juda, zusammen mit den Amtsträgern Judas[b], den Handwerkern und den Schmieden[c] aus Jerusalem in die Verbannung geführt und nach Babylon gebracht hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Namensform lautet „Nebukadrezzar“; geläufiger ist im Deutschen „Nebukadnezar“.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Fürsten Judas“.'
    reason: lexical_alternative
  - marker: c
    text: Die genaue Bedeutung der beiden hebräischen Berufsbezeichnungen ist unsicher; gemeint sind wahrscheinlich Gruppen von Facharbeitern, darunter Metallhandwerker.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאַנִי
  choice: zeigte mir
  rationale: Der Hifil von ראה bedeutet hier „sehen lassen“ beziehungsweise „zeigen“. „Zeigte mir“ ist natürliches Deutsch und bewahrt den Offenbarungscharakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְהִנֵּה
  choice: Siehe
  rationale: Die Präsentationspartikel führt den Inhalt der Schau lebhaft vor Augen. „Siehe“ wahrt diese Funktion in würdigem, bibelgemäßem Deutsch.
- source_word: שְׁנֵי דּוּדָאֵי תְאֵנִים
  choice: zwei Körbe mit Feigen
  rationale: דּוּד kann einen Topf oder korbartigen Behälter bezeichnen; bei Feigen ist „Körbe“ kontextgemäß und idiomatisch.
- source_word: מוּעָדִים
  choice: waren … aufgestellt
  rationale: Das passive Partizip bezeichnet hier Gegenstände, die an einem Ort hingestellt beziehungsweise platziert worden waren.
- source_word: הֵיכַל יְהוָה
  choice: Tempel Jahwes
  rationale: הֵיכָל bezeichnet in diesem Zusammenhang den Tempelbau; „Tempel“ ist die klare und geläufige Wiedergabe.
- source_word: אַחֲרֵי הַגְלוֹת
  choice: nachdem … in die Verbannung geführt hatte
  rationale: Die Konstruktion kennzeichnet eine vorausgehende Handlung. Die deutsche Nachdem-Konstruktion stellt die zeitliche Abfolge klar dar und lässt den erzwungenen Charakter erkennen.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadrezzar
  rationale: Diese Umschrift folgt der im hebräischen Vers stehenden Namensform mit r, statt sie an die geläufigere Form „Nebukadnezar“ anzugleichen.
- source_word: יְכָנְיָהוּ
  choice: Jechonja
  rationale: „Jechonja“ ist eine im Deutschen etablierte Wiedergabe dieser Namensform.
- source_word: שָׂרֵי יְהוּדָה
  choice: Amtsträger Judas
  rationale: שָׂרִים bezeichnet hochgestellte Leitungs- oder Regierungsvertreter. „Amtsträger“ ist modern und vermeidet die mögliche Fehlvorstellung, es handle sich ausschließlich um Königssöhne.
- source_word: הֶחָרָשׁ
  choice: Handwerker
  rationale: חָרָשׁ kann Handwerker verschiedener Fachrichtungen bezeichnen und steht hier kollektiv für eine Berufsgruppe.
- source_word: הַמַּסְגֵּר
  choice: Schmiede
  rationale: Die genaue Berufsbezeichnung ist unsicher; wahrscheinlich sind Metallhandwerker gemeint. „Schmiede“ passt zum historischen Zusammenhang, ohne die Bedeutung so stark wie „Schlosser“ einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Im Ausgangstext steht der Eigenname יהוה. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis der Schau zu Jahwes Handeln
  choice: Jahwe zeigte mir
  alternative: Jahwe ließ mich sehen
  rationale: Beide Wiedergaben sind grammatisch möglich. „Zeigte mir“ drückt die von Jahwe gewährte prophetische Schau knapp aus, ohne ihre genaue Art näher festzulegen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. „Siehe“ erhält die lebhafte Schauform des Hebräischen; die komplexe Zeitangabe wurde als eigener Satz angeschlossen, ohne den sachlichen Zusammenhang zu verändern.
