  terminology: „Jahwe“, „Zedekia“, „König von Juda“, „führende Beamte“ und „Land Ägypten“ sind angemessen. „Rest Jerusalems“ bewahrt die etablierte prophetische Terminologie. Die Fußnote soll weiterhin kenntlich machen, dass נתן wörtlich „geben“ lautet und der Sinn der Behandlung/Zuweisung aus dem Vergleich erschlossen wird.
