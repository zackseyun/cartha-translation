  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: Der Kontrast zu den guten Feigen wird aufgenommen, die Feigen sind wegen ihrer schlechten Beschaffenheit ungenießbar, und Zedekia, seine Amtsträger sowie weitere Gruppen werden dem Bild der schlechten Feigen zugeordnet. Die Übersetzung von כֵּן אֶתֵּן als „mit … verfahren“ ist als kontextuelle Wiedergabe möglich. Die Satzgliederung des hebräischen Textes unterscheidet jedoch den „Rest Jerusalems, nämlich die in diesem Land Übriggebliebenen“ von der anschließenden Gruppe derjenigen, die in Ägypten wohnen. Der Entwurf bindet durch seinen Doppelpunkt beide Gruppen an „den Rest Jerusalems“ und verengt damit die Struktur.'
