  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
translation:
  language: de
  text: Doch wie die schlechten Feigen, die so schlecht sind, dass man sie nicht essen kann, so werde ich, spricht Jahwe, Zedekia, den König von Juda, seine führenden Beamten, den Rest Jerusalems, nämlich die in diesem Land Übriggebliebenen, und die im Land Ägypten wohnen, behandeln[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „So werde ich Zedekia … geben.“ Der Vergleich mit den schlechten Feigen ergibt den Sinn, dass Jahwe die Genannten entsprechend behandeln wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כַ/תְּאֵנִים הָרָעוֹת
  choice: Doch wie mit den schlechten Feigen
  rationale: Das einleitende וְ setzt den Gegensatz zu den guten Feigen fort; כַּ bewahrt den Vergleich. „Schlecht“ bezeichnet hier zunächst die Qualität der Früchte, ohne die Bildsprache vorschnell zu moralisieren.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: die so schlecht sind, dass man sie nicht essen kann
  rationale: Die deutsche Folge-Konstruktion gibt idiomatisch wieder, dass die Feigen wegen ihrer außerordentlichen Schlechtigkeit ungenießbar sind.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֵּן אֶתֵּן
  choice: so … werde ich mit … verfahren
  rationale: נתן bedeutet wörtlich „geben“. Hier ist aus dem vorangestellten Vergleich zu erschließen, dass Jahwe die Genannten entsprechend den schlechten Feigen behandeln wird. „Mit … verfahren“ macht die im Hebräischen knappe Vergleichsbeziehung im Deutschen verständlich, ohne die in den Folgeversen entfaltete Strafe vorwegzunehmen.
- source_word: שָׂרָיו
  choice: seinen führenden Beamten
  rationale: שׂרים bezeichnet die politischen und höfischen Amtsträger. „Führende Beamte“ ist gegenwärtiges, verständliches Deutsch und vermeidet das missverständliche „Fürsten“.
- source_word: שְׁאֵרִית יְרוּשָׁלִַם
  choice: dem Rest Jerusalems
  rationale: „Rest“ bewahrt den prophetisch bedeutsamen Begriff שְׁאֵרִית und bleibt zugleich allgemein verständlich.
- source_word: הַנִּשְׁאָרִים בָּאָרֶץ הַזֹּאת
  choice: denen, die in diesem Land übrig geblieben sind
  rationale: Die partizipiale Wendung bezeichnet diejenigen aus Jerusalem, die im Land Juda zurückgeblieben sind.
- source_word: וְהַיֹּשְׁבִים בְּאֶרֶץ מִצְרָיִם
  choice: und denen, die im Land Ägypten wohnen
  rationale: Die Formulierung wahrt sowohl den partizipialen Sinn von יֹשְׁבִים als auch die ausdrückliche hebräische Wendung „Land Ägypten“.
theological_decisions:
- issue: Die Bedeutung der Gerichtsformel כֵּן אֶתֵּן innerhalb des Vergleichs mit den schlechten Feigen
  choice: „so … werde ich mit … verfahren“ im Haupttext, mit der wörtlichen Bedeutung „geben“ in der Fußnote
  alternative: „so werde ich Zedekia … hingeben“ oder wörtlich „so werde ich Zedekia … geben“
  rationale: Der hebräische Text lässt das Ziel beziehungsweise Ergebnis von „geben“ unausgesprochen und bezieht es aus dem Feigenvergleich. Die gewählte Formulierung erhält diese Spannung, ohne bereits eine bestimmte Art des Gerichts festzulegen; die Fußnote dokumentiert die auffällige Quellform.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederaufnahme mit „mit denen … und denen …“ verdeutlicht, dass beide Gruppen zum „Rest Jerusalems“ gehören. Der Einschub „spricht Jahwe“ bildet die hebräische Redeeinleitung natürlich ab; die Gedankenstriche erhalten den Satzfluss.
