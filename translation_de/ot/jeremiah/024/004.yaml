base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/004.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes[a] an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit „der HERR“ wiedergegeben.'
    reason: Die Fußnote macht transparent, dass im Ausgangstext der Gottesname steht und die deutsche Wiedergabe „Jahwe“ einer verbreiteten traditionellen Ersatzlesung gegenübersteht.
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: In der festen prophetischen Botenformel gibt „erging … an“ die Verbindung von וַיְהִי mit דְבַר יהוה idiomatisch und zugleich würdevoll wieder.
- source_word: דְבַר
  choice: Wort
  rationale: „Wort“ bewahrt die lexikalische Nähe zur wiederkehrenden prophetischen Formel; „Botschaft“ wäre verständlich, aber stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit „erging“ ist „an mich“ die natürliche deutsche Wiedergabe der Richtung auf den Propheten hin.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im heutigen Deutschen natürlich die Funktion des hebräischen Infinitivs, der die folgende direkte Rede einführt; ein wörtliches „indem er sprach“ wäre unnötig schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etablierte prophetische Formel „Das Wort Jahwes erging an mich“ bleibt erkennbar; der Doppelpunkt leitet knapp und natürlich die in Vers 5 folgende Rede ein.
