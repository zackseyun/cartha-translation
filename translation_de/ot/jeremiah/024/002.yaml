  - marker: b
    text: 'Wörtlich: „die wegen ihrer Schlechtigkeit nicht gegessen werden konnten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּד
  choice: Korb
  rationale: Das Wort kann auch einen Topf oder Kessel bezeichnen; im Zusammenhang der Feigenbehälter vor dem Tempel ist „Korb“ die natürliche und sachlich passende Wiedergabe.
- source_word: תְּאֵנִים טֹבוֹת מְאֹד
  choice: sehr gute Feigen
  rationale: Gibt Adjektiv und Verstärkung direkt und in natürlichem modernem Deutsch wieder.
- source_word: כִּתְאֵנֵי הַבַּכֻּרוֹת
  choice: wie Frühfeigen
  rationale: Bezeichnet die früh reifenden beziehungsweise ersten Feigen der Erntezeit; „Frühfeigen“ bewahrt die zeitliche Bedeutung knapp und idiomatisch.
- source_word: תְּאֵנִים רָעוֹת מְאֹד
  choice: sehr schlechte Feigen
  rationale: Bewahrt den deutlichen Gegensatz zu den „sehr guten Feigen“, ohne die Art des Mangels als Fäulnis zu präzisieren.
- source_word: אֲשֶׁר לֹא תֵאָכַלְנָה מֵרֹעַ
  choice: so schlecht, dass man sie nicht essen konnte
  rationale: Gibt die Folge beziehungsweise Ursache des schlechten Zustands idiomatisch wieder und erhält die unpersönliche Aussage des hebräischen Passivs.
