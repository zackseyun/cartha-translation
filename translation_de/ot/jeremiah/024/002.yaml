  yaml_path: translation/ot/jeremiah/024/002.yaml
  text: One basket had very good figs[a], like first-ripe figs, and one basket had very bad figs[b], which could not be eaten because of their badness.
translation:
  language: de
  text: In dem einen Korb waren sehr gute Feigen, wie Frühfeigen[a], und in dem anderen Korb waren sehr schlechte Feigen, so schlecht, dass man sie nicht essen konnte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die ersten Feigen“ beziehungsweise „wie Feigen der ersten Ernte“.'
