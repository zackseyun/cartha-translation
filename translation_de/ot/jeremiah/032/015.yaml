id: JER.32.15
reference: Jeremiah 32:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל ע֣וֹד יִקָּנ֥וּ בָתִּ֛ים וְ/שָׂד֥וֹת וּ/כְרָמִ֖ים בָּ/אָ֥רֶץ הַ/זֹּֽאת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/015.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Houses and fields and vineyards will again be bought in this land.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen, der Gott Israels: Häuser, Felder und Weinberge werden in diesem Land wieder gekauft werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In diesem Land wird man wieder Häuser, Felder und Weinberge kaufen.“ Das hebräische Verb steht im Nifal und kann hier auch weniger streng, mittelartig beziehungsweise passivähnlich verstanden werden; die Übersetzung im Text bewahrt die Form am deutlichsten.'
    reason: lexikalische Alternative zur Diathese des Verbs
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für die vorausgehende symbolische Handlung ein und gibt den hebräischen Diskursanschluss natürlich wieder.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Entspricht der geläufigen prophetischen Botenformel; das deutsche Präsens ist hier idiomatisch und würdevoll.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den offenbarten Gottesnamen als im Deutschen gebräuchliche Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Bewahrt die traditionelle, weiterhin verständliche Weite des Gottesepithetons, ohne es auf irdische Armeen einzuengen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Gibt die hebräische Genitivverbindung direkt und natürlich wieder.
- source_word: עוֹד
  choice: wieder
  rationale: Bezeichnet in diesem Wiederherstellungszusammenhang die erneute Aufnahme einer zuvor unterbrochenen Tätigkeit.
- source_word: יִקָּנוּ
  choice: werden ... gekauft werden
  rationale: Bewahrt die am nächsten liegende passive Bedeutung des hebräischen Nifal und macht die zukünftige Wiederaufnahme gewöhnlicher Grundstücksgeschäfte ausdrücklich.
- source_word: בָתִּים וְשָׂדוֹת וּכְרָמִים
  choice: Häuser, Felder und Weinberge
  rationale: Gibt die drei Arten von Besitz konkret, knapp und in der Reihenfolge des Hebräischen wieder.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: Ist im Jeremiakontext natürlich und bewahrt den möglichen Anklang an das verheißene Land.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Transkription wahrt den persönlichen Gottesnamen und ersetzt ihn nicht stillschweigend durch einen Titel.
- issue: Diathese von יִקָּנוּ (Nifal)
  choice: 'passiv: „werden ... gekauft werden“'
  alternative: 'unpersönlich/aktivähnlich: „wird man ... kaufen“'
  rationale: Das Passiv entspricht der Form am unmittelbarsten und lässt den Fokus auf der Wiederkehr normaler Verhältnisse liegen; die mögliche weniger strenge, mittelartige Auffassung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem prophetischem Register. Die formal etwas schwere doppelte Form von „werden“ ist bewusst gewählt, um sowohl Zukunft als auch Passiv des Hebräischen sichtbar zu halten.
