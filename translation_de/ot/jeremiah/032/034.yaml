  text: וַ/יָּשִׂ֣ימוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/034.yaml
  text: They put their detestable things in the house that is called by my name[b][a], to defile it.
translation:
  language: de
  text: Sie stellten ihre abscheulichen Dinge[a] in dem Haus[b] auf, das nach meinem Namen genannt wird, um es zu verunreinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Abscheulichkeiten“. Der hebräische Ausdruck bezeichnet besonders im Zusammenhang mit Götzendienst verabscheuungswürdige Gegenstände oder Praktiken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Tempel“. Wörtlich steht im Hebräischen „in dem Haus“; gemeint ist hier das Haus, das nach Gottes Namen genannt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Sie stellten
  rationale: Das Waw-Konsekutiv erzählt eine vergangene Handlung. „Stellten“ gibt שׂים konkret und in diesem Zusammenhang natürlich wieder.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihre abscheulichen Dinge
  rationale: שִׁקּוּץ bezeichnet etwas kultisch und moralisch Verabscheuungswürdiges, häufig im Zusammenhang mit Götzendienst. Die Wiedergabe bleibt bewusst allgemein und legt den Ausdruck nicht vorschnell auf Götzenbilder fest.
- source_word: בַּבַּיִת
  choice: in das Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“. Gemeint ist hier der Tempel; im Haupttext bleibt jedoch die Bildsprache des Hebräischen erhalten.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: über dem mein Name ausgerufen worden ist
  rationale: Diese Wiedergabe hält die ungewöhnliche hebräische Wendung sichtbar. Sie bezeichnet Gottes Anspruch auf das Haus und dessen Zugehörigkeit zu ihm, ohne diese Bedeutungsaspekte auf nur einen davon zu verengen.
- source_word: לְטַמְּאוֹ
  choice: um es unrein zu machen
  rationale: Der Infinitiv kann Zweck beziehungsweise beabsichtigte Folge ausdrücken. „Unrein machen“ bewahrt hier den kultischen Sinn von טמא und bleibt zugleich allgemein verständlich.
theological_decisions:
- issue: Ob בַּבַּיִת im Haupttext als „Haus“ oder ausdrücklich als „Tempel“ wiederzugeben ist
  choice: Haus
  alternative: Tempel
  rationale: „Haus“ entspricht unmittelbar dem hebräischen Wortlaut und bewahrt die biblische Bezeichnung des Heiligtums; eine Fußnote erläutert den im Zusammenhang gemeinten Tempel.
- issue: Ob שִׁקּוּצֵיהֶם ausdrücklich als Götzenbilder bezeichnet werden soll
  choice: abscheuliche Dinge
  alternative: Götzenbilder; Abscheulichkeiten
  rationale: Der Zusammenhang ist wahrscheinlich götzendienstlich, doch der hebräische Ausdruck kann sowohl verabscheuungswürdige Gegenstände als auch Praktiken bezeichnen. Die allgemeinere Formulierung wahrt diesen Bedeutungsumfang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „über dem mein Name ausgerufen worden ist“ ist bewusst etwas fremdartig, um das hebräische Besitz- und Weiheidiom sowie seine theologische Spannung nicht auf die glattere Deutung „das meinen Namen trägt“ zu reduzieren.
