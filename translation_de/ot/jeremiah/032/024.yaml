  text: הִנֵּ֣ה הַ/סֹּלְל֗וֹת בָּ֣אוּ הָ/עִיר֮ לְ/לָכְדָ/הּ֒ וְ/הָ/עִ֣יר נִתְּנָ֗ה בְּ/יַ֤ד הַ/כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים עָלֶ֔י/הָ מִ/פְּנֵ֛י הַ/חֶ֥רֶב וְ/הָ/רָעָ֖ב וְ/הַ/דָּ֑בֶר וַ/אֲשֶׁ֥ר דִּבַּ֛רְתָּ הָיָ֖ה וְ/הִנְּ/ךָ֥ רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/024.yaml
  text: Look[a], the siege ramps have come up against the city to capture it, and the city has been given into the hand of the Chaldeans who are fighting against it, because of the sword and the famine and the plague. What you spoke has happened, and look[c][b], you see it.
translation:
  language: de
  text: Sieh, die Belagerungsrampen[a] sind bis an die Stadt herangerückt, um sie einzunehmen. Die Stadt ist den Chaldäern[b], die gegen sie kämpfen, in die Hand gegeben wegen des Schwertes, des Hungers und der Seuche[c]. Was du gesagt hast, ist geschehen, und sieh, du siehst es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Belagerungswerke“ oder „Erdwälle“. Gemeint sind aufgeschüttete Erdwerke, die beim Angriff auf eine befestigte Stadt eingesetzt wurden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder erklärend: „Babyloniern“. Im Hebräischen steht „Chaldäer“, die hier mit der neubabylonischen Macht verbunden sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Pest“ beziehungsweise „Pestilenz“. Das hebräische Wort bezeichnet eine tödliche Seuche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה / וְהִנְּךָ
  choice: Sieh / und sieh
  rationale: Die deiktische Partikel lenkt zweimal nachdrücklich die Aufmerksamkeit auf die gegenwärtige Lage. „Sieh“ ist modern und würdevoll und bewahrt die Wiederholung.
- source_word: הַסֹּלְלוֹת
  choice: die Belagerungsrampen
  rationale: Das Wort bezeichnet im Belagerungskontext aufgeschüttete Erdwerke, über die eine Stadt angegriffen wurde. „Belagerungsrampen“ ist konkret und verständlich.
- source_word: בָּאוּ הָעִיר
  choice: reichen schon bis an die Stadt heran
  rationale: Die Konstruktion beschreibt, dass die Belagerungswerke die Stadt erreicht haben. „Heranreichen“ ergibt im Deutschen mit Rampen als Subjekt ein natürliches und anschauliches Bild; „schon“ verdeutlicht die eingetretene bedrohliche Lage, ohne eine neue Aussage einzuführen.
- source_word: לְלָכְדָהּ
  choice: um sie einzunehmen
  rationale: לכד bezeichnet besonders bei Städten deren militärische Einnahme. „Einnehmen“ ist dafür die geläufige deutsche Wendung.
- source_word: נִתְּנָה בְּיַד
  choice: ist ... in die Hand gegeben
  rationale: Die hebräische Redeweise für die Auslieferung an fremde Macht bleibt erkennbar und ist auch auf Deutsch verständlich.
- source_word: הַכַּשְׂדִּים
  choice: den Chaldäern
  rationale: Die ethnische Bezeichnung des hebräischen Textes wird direkt bewahrt; der historische Bezug auf die Babylonier wird in einer Fußnote erklärt.
- source_word: הַנִּלְחָמִים עָלֶיהָ
  choice: die gegen sie kämpfen
  rationale: Das Partizip bezeichnet den fortdauernden Kampf gegen die Stadt und wird transparent wiedergegeben.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Hier nennt die Präposition Schwert, Hunger und Seuche als Ursachen beziehungsweise Umstände der bereits besiegelten Übergabe der Stadt.
- source_word: הַחֶרֶב וְהָרָעָב וְהַדָּבֶר
  choice: des Schwertes, des Hungers und der Seuche
  rationale: Die traditionelle Gerichtstrias wird in klarer heutiger Sprache bewahrt. „Seuche“ ist verständlicher und im Kontext treffender als das ältere „Pestilenz“.
- source_word: וַאֲשֶׁר דִּבַּרְתָּ הָיָה
  choice: Was du angekündigt hast, ist eingetroffen
  rationale: Die Formulierung drückt aus, dass Gottes vorher gesprochenes Wort nun Wirklichkeit geworden ist. „Angekündigt“ macht den vorausweisenden Charakter im Deutschen natürlich deutlich.
- source_word: וְהִנְּךָ רֹאֶה
  choice: und sieh, du siehst es selbst
  rationale: Die Wiedergabe erhält sowohl die erneute Aufmerksamkeitsformel als auch das ausdrückliche Verb des Sehens. „Selbst“ hebt idiomatisch die unmittelbare Wahrnehmung des Angeredeten hervor.
theological_decisions:
- issue: Erfüllung des zuvor gesprochenen göttlichen Wortes
  choice: Was du angekündigt hast, ist eingetroffen
  alternative: Was du geredet hast, ist geschehen
  rationale: Die Übersetzung bewahrt den Zusammenhang zwischen Gottes vorausgehendem Wort und der gegenwärtigen Katastrophe, ohne daraus eine weitergehende dogmatische Aussage abzuleiten.
- issue: Verhältnis von göttlicher Übergabe und menschlich-militärischen Ursachen
  choice: Die Stadt ist ... in die Hand gegeben — wegen des Schwertes, des Hungers und der Seuche
  alternative: Die Stadt fällt ... durch Schwert, Hunger und Seuche
  rationale: Das Passiv und die hebräische Hand-Formel bleiben stehen. So wird weder der im Kontext naheliegende göttliche Urheber ausdrücklich ergänzt noch die Aussage auf rein militärische Vorgänge reduziert.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Ton. Die auffällige Wiederholung von „Sieh“ sowie die Hand-Metapher des Hebräischen bleiben erhalten. Der Gedankenstrich gliedert den langen Satz und hebt die Ursachenformel hervor, ohne den syntaktischen Zusammenhang aufzulösen.
