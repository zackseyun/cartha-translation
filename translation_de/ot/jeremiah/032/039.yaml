  text: וְ/נָתַתִּ֨י לָ/הֶ֜ם לֵ֤ב אֶחָד֙ וְ/דֶ֣רֶךְ אֶחָ֔ד לְ/יִרְאָ֥ה אוֹתִ֖/י כָּל הַ/יָּמִ֑ים לְ/ט֣וֹב לָ/הֶ֔ם וְ/לִ/בְנֵי/הֶ֖ם אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/039.yaml
  text: And I will give them one heart and one way[a], so that they may fear me all their days[b], for their good and for the good of their children after them.
translation:
  language: de
  text: Und ich werde ihnen ein Herz[a] und einen Weg[b] geben, damit sie mich ihr Leben lang fürchten – zu ihrem Wohl und zum Wohl ihrer Kinder nach ihnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein ungeteiltes Herz“. Wörtlich steht im Hebräischen „ein Herz“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Lebensweise“. Das hebräische Wort für „Weg“ kann bildlich die Art zu leben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … geben
  rationale: Das Qal-Perfekt der 1. Person Singular mit וְ steht im prophetischen Verheißungszusammenhang für eine zukünftige Handlung. „Geben“ entspricht der Grundbedeutung von נתן.
- source_word: לֵב אֶחָד
  choice: ein Herz
  rationale: Die wörtliche Metapher bleibt erhalten und lässt offen, ob vor allem gemeinschaftliche Einheit, innere Geschlossenheit oder ungeteilte Hingabe gemeint ist.
- source_word: וְדֶרֶךְ אֶחָד
  choice: und einen Weg
  rationale: דרך bezeichnet einen Weg und übertragen eine Lebensweise. „Einen Weg“ bewahrt das Bild und dessen Deutungsspielraum.
- source_word: לְיִרְאָה אוֹתִי
  choice: damit sie mich … fürchten
  rationale: Der Infinitiv mit לְ drückt hier den Zweck aus. „Fürchten“ erhält den biblischen Begriff, der in diesem Bundeskontext ehrfürchtige, gehorsame Gottesfurcht bezeichnet.
- source_word: כָּל הַיָּמִים
  choice: ihr Leben lang
  rationale: Wörtlich „alle Tage“; die idiomatische deutsche Wendung gibt die gemeinte lebenslange Dauer klar wieder.
- source_word: לְטוֹב לָהֶם
  choice: zu ihrem Wohl
  rationale: לְ mit טוֹב bezeichnet den Nutzen beziehungsweise das Gute, das ihnen daraus erwächst. „Zu ihrem Wohl“ ist natürlich und sachlich.
- source_word: וְלִבְנֵיהֶם אַחֲרֵיהֶם
  choice: und zum Wohl ihrer Kinder nach ihnen
  rationale: Der Nutzen wird auf die folgende Generation ausgedehnt. Die Wiederholung von „zum Wohl“ macht den syntaktischen Bezug im Deutschen deutlich; „Kinder“ ist die direkte Wiedergabe von בנים.
theological_decisions:
- issue: Bedeutung von „ein Herz und einen Weg“
  choice: Die wörtlichen Bilder bleiben als umfassende Bundesverheißung einer geeinten inneren Ausrichtung und Lebensführung stehen.
  alternative: „ein ungeteiltes Herz und eine gemeinsame Lebensweise“
  rationale: Der hebräische Ausdruck kann sowohl gemeinschaftliche Einheit als auch persönliche Lauterkeit und ungeteilte Hingabe einschließen. Eine ausdeutende Paraphrase würde diese Spannung verengen.
- issue: Bedeutung von „mich fürchten“
  choice: „mich fürchten“
  alternative: „mir in Ehrfurcht begegnen“
  rationale: Im Zusammenhang der Bundeserneuerung bezeichnet ירא ehrfürchtige Gottesfurcht, die sich in Treue und Gehorsam zeigt, nicht bloßes Erschrecken. Der Haupttext bewahrt dennoch den theologischen Grundbegriff.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Parallelbilder „ein Herz“ und „einen Weg“ werden bewusst nicht aufgelöst. Der Gedankenstrich gliedert die abschließende Nutzenaussage, ohne ihren Bezug auf die gesamte Verheißung zu verändern.
