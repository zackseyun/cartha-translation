source:
  edition: WLC
  text: גְּדֹל֙ הָֽ/עֵצָ֔ה וְ/רַ֖ב הָ/עֲלִֽילִיָּ֑ה אֲשֶׁר עֵינֶ֣י/ךָ פְקֻח֗וֹת עַל כָּל דַּרְכֵי֙ בְּנֵ֣י אָדָ֔ם לָ/תֵ֤ת לְ/אִישׁ֙ כִּ/דְרָכָ֔י/ו וְ/כִ/פְרִ֖י מַעֲלָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/019.yaml
  text: great in counsel and mighty in deed[a], whose eyes are open upon all the ways of the sons of man, to give to each man according to his ways and according to the fruit of his deeds.
translation:
  language: de
  text: Du bist groß an Rat und mächtig an Tat; deine Augen sind offen über allen Wegen der Menschen, um jedem zu geben nach seinen Wegen und nach der Frucht seiner Taten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „groß an Rat und reich an Wirksamkeit“; das seltene hebräische Wort bezeichnet Tat, Handeln oder vollbrachtes Werk.'
    reason: lexikalische Alternative und Erklärung eines seltenen Ausdrucks
lexical_decisions:
- source_word: גְּדֹל הָעֵצָה
  choice: groß an Rat
  rationale: Bewahrt die knappe hebräische Prägung und umfasst sowohl weise Beratung als auch Plan und Absicht.
- source_word: רַב הָעֲלִילִיָּה
  choice: mächtig an Tat
  rationale: Gibt die wirksame Größe göttlichen Handelns wieder und erhält den parallelen Klang zu „groß an Rat“.
- source_word: עֵינֶיךָ פְקֻחוֹת
  choice: dessen Augen offen sind
  rationale: Bewahrt das konkrete anthropomorphe Bild; das Relativpronomen verbindet die Aussage mit der vorausgehenden Gottesbeschreibung.
- source_word: עַל כָּל דַּרְכֵי בְּנֵי אָדָם
  choice: über allen Wegen der Menschen
  rationale: „Wege“ bezeichnet Lebensführung und Verhalten. „Menschen“ gibt die kollektive Bedeutung von בְּנֵי אָדָם im natürlichen modernen Deutsch wieder.
- source_word: לָתֵת לְאִישׁ
  choice: um jedem zu geben
  rationale: Der Infinitiv bezeichnet Zweck beziehungsweise Folge; אִישׁ wird hier distributiv und geschlechtsübergreifend gebraucht.
- source_word: כִּדְרָכָיו
  choice: nach seinen Wegen
  rationale: Erhält den Plural und die sprachliche Rückbindung an die zuvor genannten Wege der Menschen.
- source_word: וְכִפְרִי מַעֲלָלָיו
  choice: und nach der Frucht seiner Taten
  rationale: Bewahrt die Fruchtmetapher für das Ergebnis menschlichen Handelns und dessen moralisches Gewicht.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes umfassendes Wissen
  choice: „dessen Augen offen sind“
  alternative: „der alles sieht“
  rationale: Das körperhafte Bild des hebräischen Textes bleibt stehen, ohne es in eine abstrakte Lehrformel aufzulösen.
- issue: Kollektive und distributive Personenbezeichnungen
  choice: „der Menschen“ und „jedem“
  alternative: „der Menschensöhne“ und „jedem Mann“
  rationale: Die hebräischen Maskulinformen sind hier repräsentativ beziehungsweise kollektiv. Natürliches modernes Deutsch macht den umfassenden Bezug deutlich, ohne den Sinn auf männliche Personen zu verengen.
- issue: Vergeltung nach menschlichem Handeln
  choice: „um jedem zu geben nach seinen Wegen und nach der Frucht seiner Taten“
  alternative: „um jedem seine Taten zu vergelten“
  rationale: Die gewählte Fassung erhält die offene Formulierung des Originals sowie Weg- und Fruchtbild, statt die Art des Gebens ausdrücklich als Vergeltung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur und die Bilder von offenen Augen, Wegen und Frucht bleiben erhalten; inklusive Personenbezeichnungen geben den kollektiven Sinn idiomatisch wieder.
