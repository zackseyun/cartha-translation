source:
  edition: WLC
  text: וְ/אָ֗ז חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל צָרִ֖ים עַל יְרוּשָׁלִָ֑ם וְ/יִרְמְיָ֣הוּ הַ/נָּבִ֗יא הָיָ֤ה כָלוּא֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה אֲשֶׁ֖ר בֵּֽית מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/002.yaml
  text: At that time the army of the king of Babylon was besieging Jerusalem[a], and Jeremiah the prophet was confined in the court of the guard[b], which was in the house of the king of Judah.
translation:
  language: de
  text: Zu jener Zeit belagerte das Heer des Königs von Babylon Jerusalem, und der Prophet Jeremia war im Wachhof[a] eingeschlossen, der sich im Palast des Königs von Juda befand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Wachhof« war ein bewachter Hof innerhalb des königlichen Palastkomplexes.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָז
  choice: Zu jener Zeit
  rationale: Gibt den temporalen Erzählmarker natürlich und präzise wieder.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: das Heer des Königs von Babylon
  rationale: „Heer“ bezeichnet die militärische Streitmacht und bewahrt die königliche Titulatur der Konstruktion.
- source_word: צָרִים עַל יְרוּשָׁלִָם
  choice: belagerte Jerusalem
  rationale: Die partizipiale Form beschreibt die damals andauernde Belagerung; der Singular entspricht im Deutschen dem Kollektivsubjekt „Heer“.
- source_word: וְיִרְמְיָהוּ הַנָּבִיא
  choice: und der Prophet Jeremia
  rationale: Bewahrt sowohl die Koordination als auch Jeremias ausdrücklich genannte Funktion in natürlicher deutscher Wortstellung.
- source_word: הָיָה כָלוּא
  choice: war … eingeschlossen
  rationale: Gibt den resultativen Zustand der Verwahrung wieder, ohne eine gewöhnliche Gefängniszelle vorauszusetzen.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: im Wachhof
  rationale: Die kompakte deutsche Bezeichnung meint den bewachten Hofbereich, in dem Jeremia festgehalten wurde.
- source_word: אֲשֶׁר בֵּית מֶלֶךְ יְהוּדָה
  choice: der zum Palast des Königs von Juda gehörte
  rationale: Der knappe hebräische Relativsatz ordnet den Wachhof dem königlichen Gebäudekomplex zu; „Palast“ vermittelt hier den kontextuellen Sinn von בֵּית klarer als das missverständliche „Haus“.
