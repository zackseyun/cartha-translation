source:
  edition: WLC
  text: וּ/בָ֣אוּ הַ/כַּשְׂדִּ֗ים הַ/נִּלְחָמִים֙ עַל הָ/עִ֣יר הַ/זֹּ֔את וְ/הִצִּ֜יתוּ אֶת הָ/עִ֥יר הַ/זֹּ֛את בָּ/אֵ֖שׁ וּ/שְׂרָפ֑וּ/הָ וְ/אֵ֣ת הַ/בָּתִּ֡ים אֲשֶׁר֩ קִטְּר֨וּ עַל גַּגּֽוֹתֵי/הֶ֜ם לַ/בַּ֗עַל וְ/הִסִּ֤כוּ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/029.yaml
  text: And the Chaldeans who are fighting against this city will come and set this city on fire and burn it[a], along with the houses on whose rooftops they burned incense to Baal and poured out drink offerings to other gods, to provoke me to anger.
translation:
  language: de
  text: Und die Chaldäer[a], die gegen diese Stadt kämpfen, werden kommen, diese Stadt in Brand setzen und sie niederbrennen samt den Häusern, auf deren Dächern man dem Baal Räucheropfer dargebracht und anderen Göttern Trankopfer ausgegossen hat, um mich zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“. Im Hebräischen steht „Chaldäer“, eine Bezeichnung, die häufig für die Streitkräfte des Neubabylonischen Reiches gebraucht wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die direkte Volks- und Heeresbezeichnung wird beibehalten; im Kontext sind die neubabylonischen Streitkräfte gemeint.
- source_word: הַנִּלְחָמִים עַל
  choice: die gegen diese Stadt kämpfen
  rationale: Das Partizip bezeichnet die andauernde feindliche Kriegshandlung gegen die Stadt, ohne eine bestimmte Angriffstaktik festzulegen.
- source_word: וְהִצִּיתוּ אֶת־הָעִיר הַזֹּאת בָּאֵשׁ וּשְׂרָפוּהָ
  choice: diese Stadt in Brand setzen und sie niederbrennen
  rationale: Die deutsche Wendung gibt sowohl das Anzünden als auch das anschließende Verbrennen natürlich und deutlich wieder.
- source_word: וְאֵת הַבָּתִּים
  choice: samt den Häusern
  rationale: Die zweite Akkusativkonstruktion erweitert das Objekt des Verbrennens auf die Häuser; „samt“ bildet diese Zuordnung knapp und idiomatisch ab.
- source_word: אֲשֶׁר קִטְּרוּ עַל גַּגּוֹתֵיהֶם
  choice: auf deren Dächern man … Räucheropfer dargebracht hat
  rationale: קטר im Piel bezeichnet hier kultisches Räuchern beziehungsweise das Darbringen eines Rauchopfers. Das unpersönliche „man“ vermeidet im Deutschen einen missverständlichen Bezug von „sie“ auf die Chaldäer.
- source_word: לַבַּעַל
  choice: dem Baal
  rationale: Der bestimmte Artikel im Hebräischen wird durch „dem Baal“ wiedergegeben; die Präposition kennzeichnet den Empfänger des Opfers.
- source_word: וְהִסִּכוּ נְסָכִים
  choice: Trankopfer ausgegossen hat
  rationale: Dies ist die übliche und verständliche deutsche Wiedergabe der kultischen Handlung des Ausgießens von Libationen.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: „Andere“ entspricht dem hebräischen אֲחֵרִים direkter als das interpretierende „fremde“.
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: um mich zum Zorn zu reizen
  rationale: Die Formulierung bewahrt die Zweck- beziehungsweise Wirkungsnuance von לְמַעַן und die kausative Bedeutung des Verbs.
theological_decisions:
- issue: Darstellung der göttlichen Reaktion auf den Götzendienst
  choice: um mich zum Zorn zu reizen
  alternative: um mich zu erzürnen
  rationale: Die Übersetzung erhält die ausdrücklich personale und gerichtliche Dimension des göttlichen Zorns und lässt zugleich die im Hebräischen mögliche Spannung zwischen beabsichtigtem Zweck und tatsächlicher Folge bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Niederbrennen“ ist idiomatisch und kräftig; „Räucheropfer“ und „Trankopfer“ bewahren die kultische Fachbedeutung, bleiben aber allgemein verständlich. Das unpersönliche „man“ verdeutlicht, dass die Bewohner beziehungsweise Verehrer und nicht die unmittelbar zuvor genannten Chaldäer die Opferhandlungen vollzogen.
