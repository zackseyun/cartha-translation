source:
  edition: WLC
  text: וָ/אֶתֵּ֞ן אֶת הַ/סֵּ֣פֶר הַ/מִּקְנָ֗ה אֶל בָּר֣וּךְ בֶּן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ לְ/עֵינֵי֙ חֲנַמְאֵ֣ל דֹּדִ֔/י וּ/לְ/עֵינֵי֙ הָֽ/עֵדִ֔ים הַ/כֹּתְבִ֖ים בְּ/סֵ֣פֶר הַ/מִּקְנָ֑ה לְ/עֵינֵי֙ כָּל הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים בַּ/חֲצַ֥ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/012.yaml
  text: Then I gave the deed of purchase to Baruch son of Neriah[a], son of Mahseiah, in the sight of Hanamel my uncle, and in the sight of the witnesses who had written in the deed of purchase[e][d][c][b], in the sight of all the Judeans who were sitting in the court of the guard.
translation:
  language: de
  text: Dann übergab ich den Kaufvertrag an Baruch, den Sohn Nerijas, dessen Vater Machseja war, vor den Augen Hanamels, meines Onkels,[a] vor den Augen der Zeugen, die im Kaufvertrag schrieben,[b] und vor den Augen aller Judäer,[c] die im Hof der Wache saßen.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Hanamel, mein Onkel“. Nach Vers 7 und 9 ist Hanamel der Sohn von Jeremias Onkel, also sein Cousin.'
    reason: cross_reference
  - marker: b
    text: 'Oder: „die in den Kaufvertrag schrieben“. Das Hebräische bezeichnet sie wörtlich als „die Zeugen, die im Kaufvertrag schrieben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aller Juden“. „Judäer“ betont hier die Zugehörigkeit zum damaligen Juda.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „im Wachhof“; möglicherweise ist der Hof des Gefängnis- beziehungsweise Wachbereichs gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Dann übergab ich
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Übergab“ gibt נתן im Zusammenhang mit der förmlichen Aushändigung einer Urkunde natürlich wieder.
- source_word: סֵפֶר הַמִּקְנָה
  choice: den Kaufvertrag
  rationale: סֵפֶר bezeichnet hier eine Urkunde und מִקְנָה den Erwerb beziehungsweise Kauf. „Kaufvertrag“ ist im modernen Deutschen verständlich und passt zum Rechtsgeschäft.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Baruch, den Sohn Nerijas, des Sohnes Machsejas
  rationale: Die Namensfolge und die zweifache Abstammungsangabe werden beibehalten; die eingedeutschten biblischen Namensformen sorgen für einen natürlichen deutschen Bibelstil.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die wörtlich-nahe Wiedergabe bewahrt die dreifach wiederholte öffentliche Zeugenformel und ihre rhetorische Wirkung.
- source_word: חֲנַמְאֵל דֹּדִי
  choice: Hanamel, meines Onkels
  rationale: דּוֹד bedeutet gewöhnlich „Onkel“. Die unmittelbare Formulierung des hebräischen Textes wird erhalten; die abweichend wirkende Verwandtschaftsangabe im Kapitel wird in einer Fußnote erläutert.
- source_word: הָעֵדִים הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה
  choice: der Zeugen, die sich in den Kaufvertrag eingetragen hatten
  rationale: Das Partizip הכותבים bedeutet wörtlich „die Schreibenden“. „Sich eingetragen hatten“ beschreibt die schriftliche Mitwirkung der Zeugen, ohne das spezifischere „unterzeichnet“ in den Text hineinzulesen.
- source_word: כָּל הַיְּהוּדִים
  choice: aller Judäer
  rationale: Im historischen Kontext bezeichnet יְהוּדִים vornehmlich die Menschen aus Juda. „Judäer“ erhält diesen geografisch-politischen Bezug.
- source_word: הַיֹּשְׁבִים
  choice: die sich … aufhielten
  rationale: ישׁב kann sitzen, wohnen oder sich an einem Ort aufhalten bedeuten. Hier bezeichnet es am natürlichsten die dort anwesenden Personen.
- source_word: חֲצַר הַמַּטָּרָה
  choice: im Wachhof
  rationale: חצר ist ein Hof, während מטרה hier den bewachten Haftbereich bezeichnet. „Wachhof“ ist knapp, verständlich und entspricht dem Schauplatz des Kapitels.
theological_decisions:
- issue: Verwandtschaftsbezeichnung Hanamels
  choice: „meines Onkels“ im Haupttext
  alternative: „meines Verwandten“ oder „meines Cousins“
  rationale: Die unmittelbare lexikalische Bedeutung von דֹּדִי wird nicht harmonisierend verändert. Die Spannung zu Jeremia 32,7–9, wo Hanamel als Sohn von Jeremias Onkel erscheint, bleibt sichtbar und wird erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit rechtlich verständlicher Wortwahl. Die dreifache Wendung „vor den Augen“ wurde zur Wahrung der hebräischen öffentlichen Zeugenformel beibehalten. Sämtliche Fußnotenmarker stehen unmittelbar an der einschlägigen Stelle im Haupttext.
