  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge, die dreifach wiederholte öffentliche Formel לְעֵינֵי, die Namen, die Zeugen und den Ort insgesamt zuverlässig wieder. Die Formulierung „die sich in den Kaufvertrag eingetragen hatten“ verschiebt jedoch die Aussage: Sie beschreibt eine Selbsteintragung bzw. Registrierung, während das Hebräische die Zeugen als diejenigen bezeichnet, die „im Kaufdokument schrieben“.'
  naturalness: „Vor den Augen“ ist trotz der Wiederholung verständlich und bewahrt bewusst die hebräische Formel. „Wachhof“ ist möglich, aber „Hof der Wache“ ist im modernen Standarddeutsch transparenter und näher an חֲצַר הַמַּטָּרָה. Die Genealogie lässt sich mit einer klaren Relativformulierung idiomatischer und eindeutiger ausdrücken.
  terminology: „Kaufvertrag“ ist als moderne Bezeichnung für סֵפֶר הַמִּקְנָה vertretbar. „Judäer“ ist historisch präzise. Die Anrede bzw. Verwandtschaftsbezeichnung „mein Onkel“ sollte im Haupttext stehen bleiben; die Spannung zu den anderen Angaben des Kapitels ist angemessen in einer Fußnote zu erläutern, ohne sie zu harmonisieren.
