revisions:
- from: Dann übergab ich den Kaufvertrag an Baruch, den Sohn Nerijas, des Sohnes Machsejas, vor den Augen Hanamels, meines Onkels,[a] vor den Augen der Zeugen, die sich in den Kaufvertrag eingetragen hatten,[b] und vor den Augen aller Judäer,[c] die sich im Wachhof aufhielten.[d]
  to: Dann übergab ich den Kaufvertrag an Baruch, den Sohn Nerijas, dessen Vater Machseja war, vor den Augen Hanamels, meines Onkels,[a] vor den Augen der Zeugen, die im Kaufvertrag schrieben,[b] und vor den Augen aller Judäer,[c] die im Hof der Wache saßen.[d]
  rationale: Die Revision beseitigt die semantische Überbestimmung von „sich eintragen“, macht die Abstammungsfolge eindeutig und verwendet für den Ort eine transparentere deutsche Formulierung. Das Partizip „schrieben“ wahrt die Offenheit des hebräischen Ausdrucks und behauptet weder ausdrücklich eine Unterschrift noch eine bestimmte Form der Registrierung. Die Fußnotenanker bleiben unmittelbar bei den jeweiligen Bezugspunkten.
