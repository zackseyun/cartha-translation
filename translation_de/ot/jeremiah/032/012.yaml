    issue: „die sich in den Kaufvertrag eingetragen hatten“
    rationale: Diese Wendung bedeutet im Deutschen eher, dass die Zeugen ihre Namen registrierten oder sich selbst eintrugen. הַכֹּתְבִים בְּסֵפֶר הַמִּקְנָה sagt lediglich, dass die Zeugen im Kaufdokument schrieben; eine spezifische Art der Eintragung sollte nicht in den Haupttext hineingelesen werden.
  - severity: low
    issue: „Wachhof“
    rationale: Das Kompositum ist verständlich, aber „Hof der Wache“ bildet die transparente Nominalverbindung „Hof/courtyard“ plus „Wache/Guard“ genauer und natürlicher nach.
