  naturalness: »Kaufe dir das Feld mit Silber« ist modernes, idiomatisches Deutsch und zugleich konkret. Die Folge zweier Sätze mit »Und« ist in diesem betonten Gebetszusammenhang natürlich und erhält die hebräische Verknüpfung. Der Fußnotenanker zur Verknüpfung steht unmittelbar bei der betreffenden Aussage.
  terminology: »Herr Yahweh«, »Zeugen hinzuziehen«, »in die Hand der Chaldäer« und »Silber« sind sachgerecht. »Chaldäer« wird angemessen knapp als Bezeichnung der babylonischen Macht erläutert.
