  to: 'Und doch hast gerade du zu mir gesagt, Herr Yahweh: »Kaufe dir das Feld mit Silber und zieh Zeugen hinzu.« Und die Stadt ist in die Hand der Chaldäer[b] gegeben worden[a].'
