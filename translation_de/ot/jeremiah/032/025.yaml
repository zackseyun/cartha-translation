source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ אֵלַ/י֙ אֲדֹנָ֣/י יְהוִ֔ה קְנֵֽה לְ/ךָ֧ הַ/שָּׂדֶ֛ה בַּ/כֶּ֖סֶף וְ/הָעֵ֣ד עֵדִ֑ים וְ/הָ/עִ֥יר נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/025.yaml
  text: Yet you yourself said to me[a], Lord Yahweh[b], ‘Buy the field for yourself with silver and call witnesses,’ though the city has been given into the hand of the Chaldeans.
translation:
  language: de
  text: 'Und doch hast gerade du zu mir gesagt, Herr Yahweh: »Kaufe dir das Feld mit Silber und zieh Zeugen hinzu.« Und die Stadt ist in die Hand der Chaldäer[b] gegeben worden[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »während die Stadt in die Hand der Chaldäer gegeben worden ist« oder »obwohl die Stadt in die Hand der Chaldäer gegeben worden ist«. Die hebräische Verknüpfung bedeutet zunächst »und«; im Zusammenhang kann sie begleitend oder einräumend verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Mit den »Chaldäern« ist hier die babylonische Macht gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Und doch hast gerade du
  rationale: Die Konjunktion erhält im Zusammenhang einen adversativen Sinn; das selbstständige Pronomen betont den Gegensatz zwischen Gottes Anweisung und der unmittelbar folgenden Lage der Stadt.
- source_word: אָמַרְתָּ אֵלַי
  choice: zu mir gesagt
  rationale: Gibt אמר mit אֶל natürlich und unmittelbar wieder; das deutsche Perfekt passt zur gegenwärtigen Rückschau im Gebet.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  rationale: Bewahrt sowohl die Anrede אֲדֹנָי als auch den ausdrücklich genannten Gottesnamen, ohne beide zu »Herr« einzuebnen.
- source_word: קְנֵה לְךָ הַשָּׂדֶה
  choice: Kaufe dir das Feld
  rationale: »Kaufen« entspricht dem geschäftlichen Zusammenhang; »dir« bildet לְךָ knapp und idiomatisch ab.
- source_word: בַּכֶּסֶף
  choice: für Silber
  rationale: Bewahrt die konkrete Bedeutung von כֶּסֶף und lässt zugleich den Kaufpreis erkennen.
- source_word: וְהָעֵד עֵדִים
  choice: und zieh Zeugen hinzu
  rationale: Die Hifil-Form bezeichnet hier das Hinzuziehen beziehungsweise Bestellen von Zeugen für den Rechtsakt; die Formulierung ist im Deutschen natürlich.
- source_word: וְהָעִיר
  choice: Dabei ist die Stadt
  rationale: »Dabei« wahrt den möglichen koordinierenden beziehungsweise begleitenden Sinn von וְ, während der Zusammenhang weiterhin die Spannung zu Gottes Auftrag erkennen lässt.
- source_word: נִתְּנָה
  choice: ist bereits ... gegeben worden
  rationale: Das Passiv bildet den Nifal ab; »bereits« bringt den resultativen Zustand des hebräischen Perfekts im Zusammenhang zur Geltung.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Erhält das hebräische Bild für Auslieferung und Machtübertragung.
- source_word: הַכַּשְׂדִּים
  choice: der Chaldäer
  rationale: Gibt die konkrete Volks- und Herrschaftsbezeichnung des Hebräischen wieder; eine Fußnote erläutert den historischen Bezug.
theological_decisions:
- issue: Wiedergabe des zusammengesetzten Gottestitels אֲדֹנָי יְהוִה
  choice: Herr Yahweh
  alternative: Herr, HERR; Gott, der HERR
  rationale: Die gewählte Form unterscheidet den Anredetitel vom Gottesnamen und gibt den Tetragrammaton als Eigennamen erkennbar wieder.
- issue: Verhältnis zwischen Gottes Kaufbefehl und der Übergabe der Stadt
  choice: 'koordinierend-begleitend: »Dabei ist die Stadt ...«'
  alternative: 'konzessiv: »obwohl die Stadt ...«'
  rationale: Das hebräische וְ bezeichnet zunächst eine Verknüpfung und kann im Kontext konzessiv verstanden werden. Der Haupttext bewahrt die offenere Form; die Fußnote nennt die naheliegende konzessive Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die betonte Eröffnung macht Jeremias Verwunderung hörbar, ohne die Spannung erklärend aufzulösen. Das Bild »in die Hand geben« und die konkrete Bezeichnung »Silber« bewahren die hebräische Ausdrucksweise.
