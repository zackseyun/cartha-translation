id: JER.32.43
reference: Jeremiah 32:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/נִקְנָ֥ה הַ/שָּׂדֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים שְׁמָמָ֥ה הִיא֙ מֵ/אֵ֤ין אָדָם֙ וּ/בְהֵמָ֔ה נִתְּנָ֖ה בְּ/יַ֥ד הַ/כַּשְׂדִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/043.yaml
  text: Fields will be bought in this land of which you say[a], ‘It is a desolation, without man or beast[b]; it has been given into the hand of the Chaldeans.’
translation:
  language: de
  text: 'Und in diesem Land werden Felder[a] gekauft werden, von dem ihr sagt: »Es ist eine Einöde, ohne Mensch und Vieh; es ist in die Hand der Chaldäer[b] gegeben worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen der Singular: »das Feld«; er kann hier kollektiv gemeint sein.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: die Babylonier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְנָה
  choice: Und … werden … gekauft werden
  rationale: Das Nifal von קנה wird als passives Futur wiedergegeben. Ein sinngemäßes »wieder« wird nicht ergänzt, da es nicht ausdrücklich im hebräischen Text steht.
- source_word: הַשָּׂדֶה
  choice: Felder
  rationale: Die morphologisch singularische Form kann hier kollektiv verstanden werden; der Kontext handelt von künftigen Grundstückskäufen. Die Mehrzahl ist im Deutschen idiomatisch.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: »Land« bewahrt sowohl den territorialen als auch den im Jeremiabuch mitschwingenden heilsgeschichtlichen Bezug.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: von dem ihr sagt
  rationale: Natürliche deutsche Wiedergabe des Relativsatzes, der die Einschätzung der Angeredeten einleitet.
- source_word: שְׁמָמָה
  choice: eine Einöde
  rationale: Die nominale Form des Hebräischen bleibt erhalten; »Einöde« bezeichnet ein verwüstetes, menschenleeres Gebiet.
- source_word: מֵאֵין אָדָם וּבְהֵמָה
  choice: ohne Mensch und Vieh
  rationale: Die feste Abwesenheitsformel wird knapp und quellennah wiedergegeben. אָדָם bezeichnet hier den Menschen allgemein, בְּהֵמָה vor allem Nutz- beziehungsweise Herdentiere.
- source_word: נִתְּנָה
  choice: es ist … gegeben worden
  rationale: Das passive Perfekt beschreibt die bereits erfolgte Übergabe mit fortbestehendem Ergebnis.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die transparente deutsche Wendung bewahrt das hebräische Bild für die Übergabe in fremde Gewalt.
- source_word: הַכַּשְׂדִּים
  choice: der Chaldäer
  rationale: Die historische Bezeichnung des hebräischen Textes wird beibehalten; gemeint sind hier die Babylonier.
theological_decisions:
- issue: Generische Bedeutung von אָדָם in der Formel מֵאֵין אָדָם וּבְהֵמָה
  choice: ohne Mensch und Vieh
  alternative: ohne Menschen und Tiere
  rationale: »Mensch« ist hier generisch und bezeichnet die Abwesenheit menschlicher Bewohner insgesamt. Die quellennähere feste Paarung wahrt den knappen, umfassenden Charakter der Gerichtsaussage.
- issue: Zeitliche Nuance der erneuten Landkäufe
  choice: werden … gekauft werden
  alternative: werden wieder gekauft werden
  rationale: Die Wiederherstellung im Kontext legt erneute Käufe nahe, doch das Adverb »wieder« steht nicht ausdrücklich im Vers. Daher wird die kontextuelle Folgerung nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Futurform »werden … gekauft werden« ist grammatisch korrekt und bewahrt bewusst das Passiv des Ausgangstextes. Der Satzbau bleibt nah am Hebräischen, ohne unnatürlich zu wirken.
