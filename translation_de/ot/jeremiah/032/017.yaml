  text: אֲהָהּ֮ אֲדֹנָ֣/י יְהוִה֒ הִנֵּ֣ה אַתָּ֣ה עָשִׂ֗יתָ אֶת הַ/שָּׁמַ֨יִם֙ וְ/אֶת הָ/אָ֔רֶץ בְּ/כֹֽחֲ/ךָ֙ הַ/גָּד֔וֹל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה לֹֽא יִפָּלֵ֥א מִמְּ/ךָ֖ כָּל דָּבָֽר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/017.yaml
  text: Ah, Lord GOD! Look, you yourself made the heavens and the earth by your great power and by your outstretched arm. Nothing is too difficult for you.
translation:
  language: de
  text: 'Ach, Herr, HERR! Sieh doch: Du selbst hast den Himmel und die Erde durch deine große Kraft und deinen ausgestreckten Arm gemacht. Nichts ist für dich zu schwierig.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Nichts ist für dich zu wunderbar; gemeint ist: Keine Sache übersteigt deine Fähigkeit.'
    reason: Die hebräische Wendung mit פלא kann das Außergewöhnliche bzw. Wunderbare bezeichnen und wird hier im Sinn von „zu schwierig“ oder „unmöglich“ gebraucht.
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ach
  rationale: Gibt den emotionalen Ausruf des Gebets knapp und würdig wieder.
- source_word: אֲדֹנָי יְהוִה
  choice: Herr, HERR
  rationale: Unterscheidet den Herrentitel von dem Gottesnamen; die traditionelle Großschreibung HERR kennzeichnet das Tetragramm.
- source_word: הִנֵּה
  choice: Sieh doch
  rationale: Bewahrt den aufmerksamkeitslenkenden und im Gebet eindringlichen Charakter des hebräischen Ausdrucks.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: den Himmel und die Erde
  rationale: Natürliche deutsche Wiedergabe des hebräischen Gesamtbegriffs für die geschaffene Welt.
- source_word: בְּכֹחֲךָ הַגָּדוֹל וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: durch deine große Kraft und deinen ausgestreckten Arm
  rationale: Erhält das konkrete biblische Bild und den Parallelismus.
- source_word: לֹא יִפָּלֵא מִמְּךָ כָּל דָּבָר
  choice: Nichts ist dir zu wunderbar
  rationale: Spiegelt die Wurzel פלא und lässt die mögliche Bedeutungsspannung zwischen »wunderbar/außergewöhnlich« und »zu schwierig« bestehen.
theological_decisions:
- issue: Aussage über Gottes unbegrenzte Macht
  choice: Nichts ist dir zu wunderbar.
  alternative: Nichts ist zu schwierig für dich.
  rationale: Die gewählte Form folgt der hebräischen Ausdrucksweise enger und bewahrt zugleich die Aussage, dass keine Sache Gottes Macht übersteigt, ohne die lexikalische Spannung von פלא auf bloße Schwierigkeit zu verengen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Die Anrede »Herr, HERR« bewahrt die Unterscheidung der beiden Gottesbezeichnungen; »ausgestreckter Arm« bleibt als bewusstes biblisches Bild erhalten.
