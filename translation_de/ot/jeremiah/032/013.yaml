  text: And I charged Baruch before their eyes[a], saying[b],
translation:
  language: de
  text: 'Und ich gab Baruch[a] vor ihren Augen[b] folgende Anweisung:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „befahl Baruch“ oder „wies Baruch an“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung „vor ihren Augen“ bedeutet hier: öffentlich und im Beisein der Zeugen.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: Und ich gab … folgende Anweisung
  rationale: צוה bezeichnet ein verbindliches Anweisen oder Befehlen. Die gewählte Formulierung bewahrt den feierlich-rechtlichen Charakter, klingt im modernen Deutschen aber natürlicher als „ich gebot“. Das vorangestellte ו trägt hier die Erzählung in der Vergangenheit weiter.
- source_word: אֶת
  choice: '[Akkusativobjekt, nicht eigens wiedergegeben]'
  rationale: Die Partikel kennzeichnet „Baruch“ als bestimmtes direktes Objekt und hat im Deutschen keine eigene Entsprechung.
- source_word: בָּרוּךְ
  choice: Baruch
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: לְעֵינֵיהֶם
  choice: vor ihren Augen
  rationale: Die wörtlich-nahe Wiedergabe erhält das anschauliche hebräische Bild und betont, dass die Anweisung öffentlich im Beisein der Zeugen erging.
- source_word: לֵאמֹר
  choice: 'folgende Anweisung:'
  rationale: Der hebräische Infinitiv leitet die anschließende direkte Rede ein. Im Deutschen kennzeichnet der Doppelpunkt diese Funktion natürlich; zusammen mit צוה ergibt sich die idiomatische Formulierung „gab … folgende Anweisung“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nahe am hebräischen Satzbau, vermeidet jedoch das heute gehobene und leicht altertümliche „gebieten“. Der Doppelpunkt führt die in Vers 14 folgende direkte Rede ein.
