base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/010.yaml
  text: So I wrote it in the deed[a], sealed it, called witnesses, and weighed out the silver on the scales.
translation:
  language: de
  text: Dann schrieb ich in die Urkunde[a], versiegelte sie, zog Zeugen hinzu und wog das Silber mit der Waage ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in das Schriftstück« oder »in die Schriftrolle«; das hebräische Wort סֵפֶר ist eine allgemeine Bezeichnung für ein schriftliches Dokument, hier wahrscheinlich die Kaufurkunde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְתֹּב
  choice: Dann schrieb ich
  rationale: Das Qal-Wayyiqtol der 1. Person Singular führt die Handlungsfolge fort; „Dann“ gibt diese Erzählfolge im Deutschen natürlich wieder.
- source_word: בַּסֵּפֶר
  choice: in die Urkunde
  rationale: סֵפֶר bezeichnet allgemein ein Schriftstück, eine Schriftrolle oder ein Buch; im Zusammenhang des Grundstückskaufs ist eine rechtliche Urkunde gemeint. Wegen des deutschen Verbs „schreiben“ ist hier die richtungsbezogene Formulierung „in die Urkunde“ idiomatisch.
- source_word: וָאֶחְתֹּם
  choice: versiegelte sie
  rationale: חתם bezeichnet im Rechtsverkehr das Versiegeln eines Schriftstücks. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „sie“ auf „Urkunde“ bezogen.
- source_word: וָאָעֵד עֵדִים
  choice: zog Zeugen hinzu
  rationale: Die Hifil-Form von עוד mit עֵדִים meint hier, Zeugen zur rechtsgültigen Bezeugung heranzuziehen. Diese Wiedergabe ist im modernen Deutschen natürlich und lässt die genaue Art ihrer Mitwirkung offen.
- source_word: וָאֶשְׁקֹל
  choice: wog … ab
  rationale: שקל bezeichnet das Abwiegen des als Zahlungsmittel verwendeten Metalls; „abwägen“ wäre im heutigen Deutsch missverständlich, während „auf der Waage abwiegen“ den konkreten Vorgang klar ausdrückt.
- source_word: הַכֶּסֶף
  choice: das Silber
  rationale: כֶּסֶף kann „Silber“ oder daraus abgeleitet „Geld“ bedeuten. Zusammen mit dem Wiegen bewahrt „Silber“ die historische Konkretheit des Zahlungsmittels.
- source_word: בְּמֹאזְנָיִם
  choice: auf der Waage
  rationale: מֹאזְנַיִם bezeichnet eine Balkenwaage beziehungsweise Waage. Der Singular ist im modernen Deutschen die natürliche Sachbezeichnung und bewahrt das konkrete Bild.
theological_decisions: []
translation_notes:
