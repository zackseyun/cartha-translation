  to: 'Sie bauten die Kulthöhen des Baal, die im Tal Ben-Hinnom[a] liegen, um ihre Söhne und Töchter für Moloch hindurchgehen zu lassen[b] – etwas, das ich ihnen nicht geboten hatte und das mir nie in den Sinn gekommen war[c]: diese Abscheulichkeit zu tun und Juda dazu zu bringen, zu sündigen.'
