  source_fidelity: 'Eine sichere Korrektur ist erforderlich: Der hebräische Text sagt hier nur, dass die Kinder „für Moloch hindurchgehen“ gelassen wurden; „durchs Feuer“ steht in diesem Vers nicht ausdrücklich. Die kultische Bedeutung kann in einer Fußnote erläutert werden, sollte aber nicht als expliziter Bestandteil des Haupttexts erscheinen. Der Schlusssatz ist kausativ wiederzugeben und auf das Tun der Abscheulichkeit zu beziehen.'
  naturalness: 'Die bisherige Doppelpunktkonstruktion („… in den Sinn gekommen war[c]: diesen … Brauch zu begehen“) ist im Deutschen syntaktisch schwerfällig. Eine direkte Infinitivkonstruktion mit „diese Abscheulichkeit zu tun“ ist klar, würdig und natürlich.'
