source:
  edition: WLC
  text: וַ/יִּבְנוּ֩ אֶת בָּמ֨וֹת הַ/בַּ֜עַל אֲשֶׁ֣ר בְּ/גֵ֣יא בֶן הִנֹּ֗ם לְ֠/הַעֲבִיר אֶת בְּנֵי/הֶ֣ם וְ/אֶת בְּנוֹתֵי/הֶם֮ לַ/מֹּלֶךְ֒ אֲשֶׁ֣ר לֹֽא צִוִּיתִ֗י/ם וְ/לֹ֤א עָֽלְתָה֙ עַל לִבִּ֔/י לַ/עֲשׂ֖וֹת הַ/תּוֹעֵבָ֣ה הַ/זֹּ֑את לְמַ֖עַן החטי אֶת יְהוּדָֽה־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/035.yaml
  text: They built the high places of Baal that are in the Valley of Ben-hinnom[a], to make their sons and their daughters pass through the fire to Molech—something I had not commanded them, nor had it entered my heart that they should do this abomination[c][b], causing Judah to sin.
translation:
  language: de
  text: 'Sie bauten die Kulthöhen des Baal, die im Tal Ben-Hinnom[a] liegen, um ihre Söhne und Töchter für Moloch hindurchgehen zu lassen[b] – etwas, das ich ihnen nicht geboten hatte und das mir nie in den Sinn gekommen war[c]: diese Abscheulichkeit zu tun und Juda dazu zu bringen, zu sündigen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Tal des Sohnes Hinnoms“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „ihre Söhne und ihre Töchter hindurchgehen zu lassen“. In diesem kultischen Zusammenhang bezeichnet die Wendung ein Kinderopfer für Moloch; Feuer wird in diesem Vers jedoch nicht ausdrücklich genannt.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „und das nicht auf mein Herz heraufgekommen war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּמוֹת
  choice: Kulthöhen
  rationale: Bezeichnet erhöhte beziehungsweise lokale Kultstätten. „Kulthöhen“ bewahrt den etablierten biblischen Begriff und ist im heutigen Deutsch klarer als das bloße „Höhen“.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Der Ausdruck bezeichnet hier die kanaanäische Gottheit und wird daher als Eigenname wiedergegeben.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: im Tal Ben-Hinnom
  rationale: Die Namensform bleibt erhalten; die wörtliche Analyse „Tal des Sohnes Hinnoms“ wird in einer Fußnote genannt. „Gehenna“ wäre in diesem alttestamentlichen Zusammenhang anachronistisch.
- source_word: לְהַעֲבִיר
  choice: durchs Feuer gehen zu lassen
  rationale: Das Verb bedeutet wörtlich „hinüber-/hindurchgehen lassen“. Der Feuerbezug ist in der kultischen Wendung impliziert und macht für heutige Leser den Zusammenhang mit dem Kinderopfer verständlich, ohne die Bildsprache durch „opfern“ zu ersetzen.
- source_word: לַמֹּלֶךְ
  choice: für Moloch
  rationale: Im Kontext ist Moloch die mit diesem Kult verbundene Gottheit. „Für“ gibt die kultische Bestimmung im Deutschen natürlich wieder.
- source_word: וְלֹא עָלְתָה עַל לִבִּי
  choice: und das mir nie in den Sinn gekommen war
  rationale: Natürliches deutsches Äquivalent der wörtlichen Wendung „auf mein Herz heraufkommen“; die anthropomorphe Aussage und ihre rhetorische Schärfe bleiben erkennbar.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: diesen abscheulichen Brauch
  rationale: „Abscheulich“ bewahrt die starke moralisch-kultische Wertung von תּוֹעֵבָה; „Brauch“ bezeichnet die konkrete Handlung in natürlichem Deutsch.
- source_word: לְמַעַן החטי אֶת־יְהוּדָה
  choice: und so Juda zur Sünde zu verführen
  rationale: Die masoretische Randlesart versteht החטי als kausative Form von חטא. „Zur Sünde verführen“ gibt diese verursachende Wirkung idiomatisch wieder.
theological_decisions:
- issue: Art der Moloch-Handlung
  choice: „ihre Söhne und Töchter für Moloch durchs Feuer gehen zu lassen“
  alternative: „ihre Söhne und Töchter Moloch zu opfern“
  rationale: Die Übersetzung bewahrt die konkrete hebräische Kultformel, macht aber mit „durchs Feuer“ ihren Opfercharakter verständlich. Sie legt die genaue Durchführung des Ritus nicht über den Text hinaus fest.
- issue: Anthropomorphe Rede von Gottes Herz
  choice: „das mir nie in den Sinn gekommen war“ mit wörtlicher Fußnote
  alternative: „das nie auf mein Herz gekommen war“
  rationale: Die idiomatische Haupttextfassung bleibt verständlich; die Fußnote erhält das hebräische Bild. Die Aussage wird nicht zu einer systematischen Behauptung über Gottes Wissen umgedeutet, sondern als entschiedene Zurückweisung der Handlung stehen gelassen.
- issue: Beziehung des Schlusssatzes zur Handlung
  choice: „diesen abscheulichen Brauch zu begehen und so Juda zur Sünde zu verführen“
  alternative: „damit Juda sündigte“
  rationale: Die causative Form wird ausdrücklich wiedergegeben. Zugleich bleibt offen, ob der Satz vor allem Zweck oder tatsächliche Folge hervorhebt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kulthöhen“ und „abscheulicher Brauch“ vermitteln den kultischen Kontext ohne unnötig altertümliche Sprache. Die Gedankenstrich- und Doppelpunktkonstruktion hält die lange hebräische Satzbewegung lesbar und ordnet Gottes Zurückweisung eindeutig der beschriebenen Handlung zu.
