  text: כִּֽי הָי֨וּ בְנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אַ֣ךְ עֹשִׂ֥ים הָ/רַ֛ע בְּ/עֵינַ֖/י מִ/נְּעֻרֹֽתֵי/הֶ֑ם כִּ֣י בְנֵֽי יִשְׂרָאֵ֗ל אַ֣ךְ מַכְעִסִ֥ים אֹתִ֛/י בְּ/מַעֲשֵׂ֥ה יְדֵי/הֶ֖ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/030.yaml
  text: For the sons of Israel and the sons of Judah have done only what was evil in my eyes from their youth[a], for the sons of Israel have only provoked me by the work of their hands[b], declares Yahweh.
translation:
  language: de
  text: Denn die Söhne Israels und die Söhne Judas haben von ihrer Jugend an[a] nur getan, was in meinen Augen böse war; denn die Söhne Israels haben mich durch das Werk ihrer Hände[b] nur zum Zorn gereizt – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „die Söhne Israels“ und „die Söhne Judas“; gemeint sein können auch „die Israeliten“ beziehungsweise „das Volk Israel“ und „das Volk Juda“.
    reason: lexical_alternative
  - marker: b
    text: „Das Werk ihrer Hände“ kann allgemein ihre Taten bezeichnen, in diesem Zusammenhang aber auch besonders die von ihnen angefertigten Götzen.
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Die wörtliche, korporative Bezeichnung bewahrt die Parallelität zu „Söhne Judas“ und wird nicht stillschweigend zu „Israeliten“ verallgemeinert.
- source_word: וּבְנֵי יְהוּדָה
  choice: und die Söhne Judas
  rationale: Die formale Entsprechung wahrt die Unterscheidung und Parallelität der beiden Gruppen.
- source_word: אַךְ
  choice: nur
  rationale: In beiden Satzteilen gibt „nur“ die exklusive beziehungsweise verstärkende Kraft des hebräischen Ausdrucks knapp und natürlich wieder.
- source_word: עֹשִׂים הָרַע בְּעֵינַי
  choice: getan, was böse war in meinen Augen
  rationale: Die Wendung bewahrt das hebräische Bild und bezeichnet Handeln, das nach Jahwes Urteil böse ist.
- source_word: מִנְּעֻרֹתֵיהֶם
  choice: von ihrer Jugend an
  rationale: Die natürliche deutsche Zeitangabe bringt den seit früher Zeit bestehenden Zustand zum Ausdruck.
- source_word: מַכְעִסִים אֹתִי
  choice: haben mich … zum Zorn gereizt
  rationale: Die kausative Bedeutung des Hifil wird idiomatisch ausgedrückt und die fortgesetzte Provokation Gottes bleibt erkennbar.
- source_word: בְּמַעֲשֵׂה יְדֵיהֶם
  choice: durch das Werk ihrer Hände
  rationale: Die hebräische Metapher bleibt erhalten und lässt sowohl menschliche Taten allgemein als auch hergestellte Götzen anklingen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel und der Gottesname werden eng am Hebräischen wiedergegeben.
theological_decisions:
- issue: Bezugsweite von „Söhne Israels“ im zweiten Satzteil
  choice: Die ausdrückliche Wiederholung „die Söhne Israels“ bleibt erhalten.
  alternative: Durch „sie“ oder „Israel und Juda“ ersetzen.
  rationale: Der hebräische Text nennt im zweiten Satzteil erneut nur die Söhne Israels. Die mögliche Verengung oder repräsentative Verwendung wird nicht harmonisierend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrten hebräischen Bildern. „Ja“ gibt den erneuten begründenden beziehungsweise verstärkenden Anschluss von כִּי natürlich wieder; der Gedankenstrich hebt die abschließende prophetische Formel ab.
