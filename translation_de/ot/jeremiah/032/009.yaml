base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/009.yaml
  text: 'So I bought the field from Hanamel the son of my uncle[a], who was at Anathoth[b], and I weighed out the silver to him: seventeen shekels of silver.'
translation:
  language: de
  text: 'Ich kaufte das Feld von Hanamel, dem Sohn meines Onkels, der in Anatot war,[a] und wog ihm das Silber ab: siebzehn Schekel Silber.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das in Anatot lag“. Der hebräische Relativsatz kann sich grammatisch auf Hanamel oder auf das Feld beziehen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „sieben Schekel und zehn Silber“; gemeint sind siebzehn Schekel Silber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: So kaufte ich
  rationale: Das Qal-Wayyiqtol von קנה bezeichnet hier den vollzogenen Kauf und führt die Erzählung folgerichtig weiter.
- source_word: הַשָּׂדֶה
  choice: das Feld
  rationale: שׂדה bezeichnet hier das als Grundbesitz erworbene Feld beziehungsweise Grundstück; „Feld“ ist die naheliegende und traditionsübergreifend verständliche Wiedergabe.
- source_word: מֵאֵת חֲנַמְאֵל
  choice: von Hanamel
  rationale: מֵאֵת kennzeichnet den Verkäufer beziehungsweise die Herkunft des Gekauften; im Deutschen ist „von“ idiomatisch.
- source_word: בֶּן דֹּדִי
  choice: dem Sohn meines Onkels
  rationale: Die ausdrückliche hebräische Verwandtschaftsangabe wird bewahrt, statt sie vereinfachend mit „meinem Cousin“ wiederzugeben.
- source_word: אֲשֶׁר בַּעֲנָתוֹת
  choice: der sich in Anatot befand
  rationale: Der Relativsatz wird entsprechend der unmittelbaren Personenbezeichnung auf Hanamel bezogen. Da אֲשֶׁר grammatisch auch auf das Feld zurückweisen kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengelegt.
- source_word: וָאֶשְׁקֲלָה לּוֹ אֶת הַכֶּסֶף
  choice: und wog ihm das Silber ab
  rationale: שׁקל beschreibt die konkrete Abwägung des Silbers als Zahlungsmittel; „wog … ab“ erhält das antike Zahlungsverfahren.
- source_word: שִׁבְעָה שְׁקָלִים וַעֲשָׂרָה הַכָּסֶף
  choice: siebzehn Schekel Silber
  rationale: Die ungewöhnliche hebräische Wortfolge „sieben Schekel und zehn, das Silber“ wird ihrem allgemein verstandenen Zahlenwert entsprechend natürlich wiedergegeben; die wörtliche Form steht in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete Handelssprache („kaufte“, „wog … ab“, „Silber“) bleibt erhalten; die syntaktische Mehrdeutigkeit des Ortsbezugs und die ungewöhnliche hebräische Zahlenform werden nicht stillschweigend verdeckt.
