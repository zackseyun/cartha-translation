base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/037.yaml
  text: Behold[a], I am gathering them from all the lands where I drove them in my anger and in my wrath and in great indignation[b], and I will bring them back to this place and make them dwell in safety.
translation:
  language: de
  text: Siehe[a], ich sammle sie aus all den Ländern, in die ich sie in meinem Zorn, in meinem Grimm und in großem Zorn vertrieben habe. Ich werde sie an diesen Ort zurückbringen und sie in Sicherheit wohnen lassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, ich werde sie sammeln.“ Die hebräische Konstruktion kann eine unmittelbar bevorstehende oder gewisse zukünftige Handlung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי מְקַבְּצָם
  choice: Siehe, ich sammle sie
  rationale: הִנְנִי mit Partizip hebt die unmittelbar bevorstehende beziehungsweise gewisse Handlung hervor. Das Präsens bewahrt die hebräische Form, ohne den im Kontext klaren Zukunftsbezug auszuschließen.
- source_word: מִכָּל הָאֲרָצוֹת
  choice: aus all den Ländern
  rationale: Gemeint sind die verschiedenen Länder der Verbannung, nicht die Erde als kosmische Gesamtheit.
- source_word: הִדַּחְתִּים
  choice: vertrieben habe
  rationale: Die Hifil-Form bezeichnet ein gewaltsames Wegtreiben und macht Gottes im Text ausdrücklich genannte Urheberschaft deutlich.
- source_word: בְּאַפִּי וּבַחֲמָתִי וּבְקֶצֶף גָּדוֹל
  choice: in meinem Zorn, meinem Grimm und in großer Entrüstung
  rationale: Drei verschiedene deutsche Ausdrücke erhalten die rhetorische Häufung dreier hebräischer Zornesbegriffe, ohne zwischen ihnen eine sachlich-technische Abstufung zu behaupten.
- source_word: וַהֲשִׁבֹתִים
  choice: Ich werde sie ... zurückbringen
  rationale: Die kausative Form von שוב bezeichnet hier räumlich konkret die Rückführung der Vertriebenen.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: an diesen Ort
  rationale: Die direkte Ortsangabe bleibt erhalten und wird nicht interpretierend zu „in dieses Land“ erweitert.
- source_word: וְהֹשַׁבְתִּים לָבֶטַח
  choice: sie in Sicherheit wohnen lassen
  rationale: Die kausative Form von ישׁב und der Sinn sicheren, ungefährdeten Wohnens werden natürlich und zugleich formnah wiedergegeben.
theological_decisions:
- issue: Aspekt der Verheißungsformel הִנְנִי mit Partizip
  choice: Siehe, ich sammle sie
  alternative: Siehe, ich werde sie sammeln
  rationale: Die Konstruktion kann eine unmittelbar bevorstehende oder gewiss eintretende Zukunftshandlung ausdrücken. Das deutsche Präsens bewahrt ihre aspektuelle Spannung; die anschließenden Futurformen verdeutlichen den Verheißungscharakter.
- issue: Häufung der Ausdrücke für Gottes Zorn
  choice: Zorn / Grimm / große Entrüstung
  alternative: Zorn / Wut / großer Unwille
  rationale: Die drei Ausdrücke bewahren die kumulative Wucht des göttlichen Gerichts, ohne eine über den Text hinausgehende dogmatische Unterscheidung zwischen den Begriffen einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ erhält den prophetischen Nachdruck; die übrige Syntax ist bewusst natürlich gehalten. Da keine Fußnoten erforderlich sind, enthält der Haupttext keine Fußnotenmarker.
