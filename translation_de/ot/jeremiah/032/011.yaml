source:
  edition: WLC
  text: וָ/אֶקַּ֖ח אֶת סֵ֣פֶר הַ/מִּקְנָ֑ה אֶת הֶֽ/חָת֛וּם הַ/מִּצְוָ֥ה וְ/הַ/חֻקִּ֖ים וְ/אֶת הַ/גָּלֽוּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/011.yaml
  text: Then I took the deed of purchase[a], the sealed copy, containing the terms and conditions[b], and the open copy.
translation:
  language: de
  text: 'Dann nahm ich die Kaufurkunde: die versiegelte Ausfertigung mit den Vertragsbestimmungen[a] und die offene Ausfertigung[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die versiegelte Urkunde, das Gebot und die Satzungen“. Die hebräischen Rechtsbegriffe meinen hier wahrscheinlich die Festlegungen und Vorschriften der Kaufurkunde.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: die unversiegelte beziehungsweise offen zugängliche Ausfertigung, im Gegensatz zur versiegelten.'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Dann nahm ich
  rationale: Das narrative Waw führt die Handlung weiter; „Dann“ gibt die zeitliche Abfolge im modernen Deutschen natürlich wieder.
- source_word: סֵפֶר הַמִּקְנָה
  choice: die Kaufurkunde
  rationale: סֵפֶר bezeichnet hier ein Schriftstück, מִקְנָה den Erwerb bzw. Kauf. „Kaufurkunde“ ist im Grundstückskontext präzise und verständlich.
- source_word: הֶחָתוּם
  choice: die versiegelte Ausfertigung
  rationale: Das passive Partizip bedeutet „versiegelt“. Im Gegensatz zu הַגָּלוּי liegt die Deutung als versiegelte Fassung bzw. Ausfertigung der Urkunde nahe.
- source_word: הַמִּצְוָה וְהַחֻקִּים
  choice: mit den Vertragsbestimmungen
  rationale: Wörtlich stehen Begriffe für „Gebot/Bestimmung“ und „Satzungen/Vorschriften“. Im rechtlichen Zusammenhang bezeichnen sie wahrscheinlich die verbindlichen Bestimmungen der Kaufurkunde; der Singular „Vertragsbestimmungen“ gibt das Begriffspaar idiomatisch wieder, ohne seinen Rechtscharakter zu verlieren.
- source_word: הַגָּלוּי
  choice: die offene Ausfertigung
  rationale: Das Wort bezeichnet das Offene bzw. Unversiegelte und steht im direkten Gegensatz zur versiegelten Ausfertigung. „Offen“ bewahrt diesen Kontrast.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt verdeutlicht, dass die beiden Ausfertigungen zur Kaufurkunde gehören. „Ausfertigung“ ist ein geläufiger rechtlicher Begriff und macht den impliziten Dokumentbezug deutlich; die Fußnote bewahrt die mögliche wörtlichere syntaktische Deutung.
