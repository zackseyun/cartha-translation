  yaml_path: translation/ot/jeremiah/032/022.yaml
  text: And you gave them this land[a], which you swore to their fathers to give them, a land flowing with milk and honey.
translation:
  language: de
  text: 'Und du gabst ihnen dieses Land, das du ihren Vätern mit einem Eid zugesagt hattest, ihnen zu geben: ein Land, in dem Milch und Honig fließen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Und du gabst
  rationale: נתן bedeutet gewöhnlich „geben“. Das Präteritum gibt die rückblickende Gebetssprache natürlich wieder; „Und“ bewahrt die fortführende Satzverknüpfung.
- source_word: הָאָרֶץ הַזֹּאת
  choice: dieses Land
  rationale: אֶרֶץ bezeichnet hier das verheißene Gebiet; „dieses Land“ ist im Bundes- und Landverheißungskontext präzise und idiomatisch.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ
  choice: das du … mit einem Eid zugesagt hattest
  rationale: נשבע bezeichnet ausdrücklich das Schwören. Die Formulierung bewahrt den Eidcharakter, klingt im Deutschen jedoch natürlicher als „das du geschworen hattest“.
- source_word: לַאֲבוֹתָם
  choice: ihren Vätern
  rationale: אָבוֹת heißt wörtlich „Väter“ und verweist hier auf Israels Vorväter beziehungsweise Patriarchen. Die konkrete männliche Bezeichnung des Hebräischen bleibt erhalten.
- source_word: לָתֵת לָהֶם
  choice: um es ihnen zu geben
  rationale: Der Infinitiv bezeichnet den Inhalt beziehungsweise das Ziel des Eides. Das Pronomen „es“ macht im Deutschen den Bezug auf das Land deutlich und bewahrt die Wiederholung des Verbs נתן.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Die traditionelle hebräische Fülleformel wird bildhaft und zugleich in natürlichem modernem Deutsch wiedergegeben.
theological_decisions:
- issue: Patriarchale Bezeichnung in der Bundesformel
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: Der hebräische Text verwendet ausdrücklich אָבוֹת („Väter“) und erinnert an den Eid gegenüber Israels Patriarchen. Die Übersetzung wahrt diese sprachliche und heilsgeschichtliche Konkretheit, während die Fußnote den weiteren Verständnishorizont nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem hebräischen Gedankengang, wird aber durch Plusquamperfekt und explizites Objektpronomen idiomatisch gestaltet. Die traditionelle Fülleformel bleibt als lebendiges Bild erhalten.
