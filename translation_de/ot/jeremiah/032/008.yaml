  source_fidelity: 'Der Entwurf gibt die Satzfolge und die wesentlichen Rechtsbegriffe des Hebräischen zuverlässig wieder: Hanamel kommt entsprechend dem zuvor ergangenen Wort Yahwehs, fordert zum Kauf des Feldes in Anatot auf, nennt Erb- und Lösungsanspruch und Jeremia erkennt darin Yahwehs Wort. „Yahweh“ entspricht dem Gottesnamen יהוה. Die knappe, im Hebräischen nicht näher explizierte Aussage über die גאולה sollte auch im Deutschen nicht zu einer ausschließlich verpflichtenden oder ausschließlich optionalen Aussage ausgebaut werden.'
