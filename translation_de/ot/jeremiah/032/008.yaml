  terminology: „Erbrecht“ trifft משפט הירשה gut. Für גאולה ist „Einlösung“ im Haupttext als knappe, nicht überinterpretierende Wiedergabe vertretbar, benötigt aber die vorhandene Erläuterung. Die Fußnote sollte die hebräische Besitzkonstruktion natürlich als „Die Einlösung gehört dir“ wiedergeben und das mögliche Recht beziehungsweise die Verantwortung beim Rückkauf von Familienbesitz erläutern.
