source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵ֠לַ/י חֲנַמְאֵ֨ל בֶּן דֹּדִ֜/י כִּ/דְבַ֣ר יְהוָה֮ אֶל חֲצַ֣ר הַ/מַּטָּרָה֒ וַ/יֹּ֣אמֶר אֵלַ֡/י קְנֵ֣ה נָ֠א אֶת שָׂדִ֨/י אֲשֶׁר בַּ/עֲנָת֜וֹת אֲשֶׁ֣ר בְּ/אֶ֣רֶץ בִּנְיָמִ֗ין כִּֽי לְ/ךָ֞ מִשְׁפַּ֧ט הַ/יְרֻשָּׁ֛ה וּ/לְ/ךָ֥ הַ/גְּאֻלָּ֖ה קְנֵה לָ֑/ךְ וָ/אֵדַ֕ע כִּ֥י דְבַר יְהוָ֖ה הֽוּא־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/008.yaml
  text: Then Hanamel the son of my uncle came to me in the court of the guard[a], according to the word of Yahweh, and he said to me, “Please buy my field that is at Anathoth, in the land of Benjamin, for the right of inheritance is yours and the redemption is yours. Buy it for yourself.” Then I knew that this was the word of Yahweh.
translation:
  language: de
  text: 'Da kam Hanamel, der Sohn meines Onkels, gemäß dem Wort Yahwehs zu mir in den Wachhof und sagte zu mir: „Kauf doch mein Feld in Anatot im Land Benjamin; denn dir steht das Erbrecht zu, und dir steht die Einlösung zu.[a] Kauf es für dich!“ Da erkannte ich, dass dies das Wort Yahwehs war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Dir steht das Einlösungsrecht zu.“ Wörtlich: „Die Einlösung gehört dir.“ Gemeint ist das verwandtschaftlich begründete Recht oder die entsprechende Verantwortung, Familienbesitz zurückzukaufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְבַר יְהוָה
  choice: gemäß dem Wort Yahwehs
  rationale: Die Präposition כְּ bezeichnet hier die Übereinstimmung des Geschehens mit der zuvor ergangenen Ankündigung. Die Formulierung bewahrt den erzählerischen Rückbezug.
- source_word: חֲצַר הַמַּטָּרָה
  choice: Hof der Wache
  rationale: Die Wendung bezeichnet den bewachten Hof, in dem Jeremia festgehalten wurde. Diese Wiedergabe erhält den Verwahrungsaspekt, ohne den Ort genauer als Gefängnis zu bestimmen.
- source_word: קְנֵה נָא
  choice: Kauf doch
  rationale: קנה bedeutet im Grundstücksgeschäft „kaufen“; נָא mildert die Aufforderung ab. Das deutsche „doch“ gibt diese bittende beziehungsweise eindringliche Nuance natürlich wieder.
- source_word: שָׂדִי
  choice: mein Feld
  rationale: שָׂדֶה bezeichnet gewöhnlich ein Feld oder Grundstück. „Feld“ ist direkt, verständlich und passt zum Zusammenhang des Landkaufs.
- source_word: בַּעֲנָתוֹת
  choice: in Anatot
  rationale: Die Ortsangabe bezeichnet die Lage des Feldes. „In Anatot“ ist im Deutschen die natürliche Form.
- source_word: מִשְׁפַּט הַיְרֻשָּׁה
  choice: das Erbrecht
  rationale: מִשְׁפָּט bezeichnet hier einen rechtlichen Anspruch, יְרֻשָּׁה Erbe beziehungsweise erblichen Besitz. „Erbrecht“ gibt den juristischen Sinn knapp und idiomatisch wieder.
- source_word: הַגְּאֻלָּה
  choice: die Einlösung
  rationale: Das Substantiv bezeichnet die verwandtschaftlich begründete Einlösung von Familienbesitz. Die substantivische Wiedergabe bleibt nahe an der knappen hebräischen Aussage; eine Fußnote erläutert den rechtlichen Gehalt.
- source_word: קְנֵה לָךְ
  choice: Kauf es für dich
  rationale: Der Dativ לָךְ drückt die Aneignung zugunsten des Angesprochenen aus. Das im Deutschen ergänzte Objekt „es“ verweist eindeutig auf das Feld.
- source_word: וָאֵדַע כִּי דְבַר יְהוָה הוּא
  choice: Da erkannte ich, dass dies das Wort Yahwehs war
  rationale: Die Aussage beschreibt Jeremias Erkenntnis, dass das eingetretene Ereignis die vorherige göttliche Botschaft bestätigte. „Dies“ macht den situationsbezogenen Rückverweis im Deutschen deutlich.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Yahweh“ bewahrt ihn als Eigennamen, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Recht oder Pflicht zur Einlösung von Familienbesitz
  choice: dir steht die Einlösung zu
  alternative: du hast das Recht zur Einlösung / du bist zur Einlösung verpflichtet
  rationale: הַגְּאֻלָּה kann im verwandtschaftlichen Rechtsrahmen ein Recht und eine Verantwortung einschließen. Der Haupttext lässt diese Spannung bestehen, statt sie einseitig als bloßes Recht oder als zwingende Pflicht festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Rechtssprache. Die Wiederholung „dir steht … zu“ spiegelt die parallele Struktur des Hebräischen; „Kauf doch“ bewahrt den höflich-eindringlichen Ton der Aufforderung.
