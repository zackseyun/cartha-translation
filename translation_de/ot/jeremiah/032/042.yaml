base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/042.yaml
  text: 'For thus says Yahweh: Just as I brought on this people all this great disaster[b][a], so I will bring on them all the good that I am speaking concerning them.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Wie ich über dieses Volk all dieses große Unheil[a] gebracht habe, so werde ich über sie all das Gute bringen, von dem ich über sie rede[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unglück«; das hebräische Wort kann auch »Böses« bedeuten, bezeichnet hier jedoch das Unheil des Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »von dem ich über sie rede«; sinngemäß auch: »das ich ihnen verheiße«.'
    reason: genuine_ambiguity
lexical_decisions:
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: Denn so spricht Jahwe
  rationale: Die Wendung verbindet den Vers begründend mit dem Zusammenhang und bewahrt zugleich die feste prophetische Botenformel sowie den Gottesnamen.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Wie ... so
  rationale: Gibt die ausdrückliche Entsprechung zwischen dem vergangenen Gericht und dem zugesagten Guten knapp und natürlich wieder.
- source_word: הֵבֵאתִי אֶל־הָעָם הַזֶּה
  choice: ich über dieses Volk ... gebracht habe
  rationale: Im Zusammenhang mit Unheil gibt die deutsche Konstruktion „über jemanden bringen“ die verursachende Aussage idiomatisch wieder.
- source_word: כָּל־הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: all dieses große Unheil
  rationale: רָעָה bezeichnet hier die über das Volk gekommene Katastrophe bzw. das Gericht, nicht moralische Bosheit. „Unheil“ wahrt die Breite des Begriffs.
- source_word: מֵבִיא עֲלֵיהֶם
  choice: werde ich über sie ... bringen
  rationale: Das Partizip bezeichnet im prophetischen Zusammenhang das sicher bevorstehende Handeln; das deutsche Futur ist hier natürlich und eindeutig.
- source_word: כָּל־הַטּוֹבָה
  choice: all das Gute
  rationale: Die breite Formulierung umfasst Wohlergehen, Segen und die angekündigte Wiederherstellung, ohne sie auf einen Einzelaspekt zu verengen.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר עֲלֵיהֶם
  choice: von dem ich zu ihnen rede
  rationale: Die Wiedergabe hält an „reden“ fest und lässt עֲלֵיהֶם als Bezug auf die Adressaten verstehen; die mögliche Bedeutung „über sie“ wird in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von רָעָה bei Gottes Gerichtshandeln
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im unmittelbaren Gegensatz zu „dem Guten“ bleibt die Spannung des hebräischen Wortpaares erkennbar. Zugleich bezeichnet „Unheil“ hier eine Gerichtskatastrophe und unterstellt Gott keine moralische Bosheit.
- issue: Bezug von עֲלֵיהֶם nach דֹּבֵר
  choice: zu ihnen
  alternative: über sie; ihnen verheiße
  rationale: Die Präposition kann hier die Betroffenen bzw. Adressaten der göttlichen Rede bezeichnen. „Verheiße“ wäre kontextuell plausibel, würde den allgemeineren Wortlaut „rede“ jedoch stärker auslegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzform „Wie ... so“ bildet den hebräischen Vergleich nach. „Jahwe“ gibt den Gottesnamen ausdrücklich wieder; „Unheil“ und „das Gute“ bewahren den markanten Gegensatz.
