  text: וְ/כָרַתִּ֤י לָ/הֶם֙ בְּרִ֣ית עוֹלָ֔ם אֲשֶׁ֤ר לֹֽא אָשׁוּב֙ מֵ/אַ֣חֲרֵי/הֶ֔ם לְ/הֵיטִיבִ֖/י אוֹתָ֑/ם וְ/אֶת יִרְאָתִ/י֙ אֶתֵּ֣ן בִּ/לְבָבָ֔/ם לְ/בִלְתִּ֖י ס֥וּר מֵ/עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/040.yaml
  text: I will make with them an everlasting covenant[a], that I will not turn away from them, to do them good. And I will put the fear of me in their hearts[b], so that they will not turn away from me.
translation:
  language: de
  text: Ich werde mit ihnen einen ewigen Bund[a] schließen, dass ich mich nicht von ihnen abwenden werde, um ihnen Gutes zu tun. Und ich werde ihnen die Furcht vor mir ins Herz geben[b], damit sie sich nicht von mir abwenden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen immerwährenden Bund« oder »einen Bund für alle Zeit«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »meine Furcht«; gemeint ist die auf Gott gerichtete Furcht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָרַתִּי
  choice: schließen
  rationale: Die feste hebräische Wendung lautet wörtlich »einen Bund schneiden«; im Deutschen ist »einen Bund schließen« die entsprechende natürliche und genaue Redewendung.
- source_word: בְּרִית עוֹלָם
  choice: einen ewigen Bund
  rationale: »Ewig« gibt die zeitlich unbegrenzte beziehungsweise dauerhafte Geltung von עוֹלָם im Bundeskontext knapp und würdig wieder.
- source_word: אֲשֶׁר לֹא אָשׁוּב מֵאַחֲרֵיהֶם
  choice: Ich werde mich nicht mehr von ihnen abwenden
  rationale: Die idiomatische Formulierung besagt, dass Gott seine zugewandte Begleitung nicht zurücknimmt. »Nicht mehr« passt zum Verb des Umkehrens, ohne eine zusätzliche dogmatische Aussage einzuführen.
- source_word: לְהֵיטִיבִי אוֹתָם
  choice: sondern ihnen Gutes tun
  rationale: Die deutsche Formulierung gibt Gottes fortgesetztes wohltätiges Handeln natürlich wieder. »Sondern« verdeutlicht den inhaltlichen Gegensatz, der im Hebräischen durch den Zusammenhang ausgedrückt wird.
- source_word: יִרְאָתִי
  choice: die Ehrfurcht vor mir
  rationale: Das suffixierte Substantiv bedeutet hier Furcht, die auf Gott gerichtet ist. »Ehrfurcht« vermeidet das Missverständnis bloßer Angst, während die Fußnote die wörtlichere Ausdrucksweise offenlegt.
- source_word: בִּלְבָבָם
  choice: ihnen … ins Herz
  rationale: »Ins Herz geben« ist im modernen Deutschen idiomatisch und bewahrt das Herz als Zentrum von Wille und innerer Haltung.
- source_word: לְבִלְתִּי סוּר מֵעָלָי
  choice: damit sie sich nicht von mir abwenden
  rationale: Die Konstruktion bezeichnet den beabsichtigten beziehungsweise verhindernden Zweck. Die Wiedergabe bewahrt die Spannung zwischen Gottes Gabe und dem Handeln des Volkes.
theological_decisions:
- issue: Dauer des Bundes
  choice: ewiger Bund
  alternative: immerwährender Bund; Bund für alle Zeit
  rationale: Die Übersetzung gibt die im Text behauptete bleibende Geltung wieder, ohne spätere heilsgeschichtliche oder konfessionelle Systeme einzutragen.
- issue: Bedeutung der Gottesfurcht
  choice: Ehrfurcht vor mir
  alternative: Furcht vor mir; meine Furcht
  rationale: Gemeint ist eine auf Gott gerichtete innere Haltung. »Ehrfurcht« ist im Deutschen verständlich und vermeidet die irreführende Lesart, Gott selbst empfinde Furcht; die wörtliche Form wird in der Fußnote dokumentiert.
- issue: Verhältnis von göttlichem Handeln und menschlicher Treue
  choice: Gott gibt die Ehrfurcht ins Herz, damit das Volk sich nicht abwendet
  alternative: keine explizite dogmatische Deutung von Beharrlichkeit oder Unabwendbarkeit
  rationale: Die Übersetzung bewahrt die starke Zweckbeziehung des hebräischen Textes, ohne sie durch eine bestimmte konfessionelle Lehre näher festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die Satzglieder bleiben nahe an der hebräischen Abfolge; idiomatische deutsche Wendungen vermeiden jedoch Hebraismen wie »einen Bund schneiden« oder »von hinter ihnen umkehren«.
