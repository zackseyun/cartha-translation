base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/027.yaml
  text: Behold[a], I am Yahweh, the God of all flesh. Is anything too difficult for me?
translation:
  language: de
  text: Siehe, ich bin Jahwe, der Gott allen Fleisches. Ist mir irgendetwas zu wunderbar[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu schwer“. Das hebräische Verb kann etwas Außergewöhnliches oder Wunderbares bezeichnen, aber auch etwas, das die eigene Kraft übersteigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Der Aufmerksamkeitsruf leitet Gottes feierliche Selbstaussage ein. „Sieh“ ist gegenwärtiges, würdiges Deutsch und bewahrt die auffordernde Kraft.
- source_word: אֲנִי
  choice: ich bin
  rationale: Die hebräische Nominalklausel wird im Deutschen idiomatisch mit der Kopula wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי כָּל בָּשָׂר
  choice: der Gott allen Fleisches
  rationale: Die Formulierung bewahrt das weite hebräische Bild von sterblichem, leiblichem Leben, ohne es vorschnell auf „alle Menschen“ einzuengen.
- source_word: הֲמִמֶּנִּי
  choice: mir … zu
  rationale: In Verbindung mit פלא bezeichnet die Präposition, was die Fähigkeit einer Person übersteigt; die deutsche Konstruktion „jemandem zu … sein“ gibt dies natürlich wieder.
- source_word: יִפָּלֵא
  choice: zu wunderbar
  rationale: Die Wiedergabe hält die Bedeutungsbreite von פלא zwischen außergewöhnlich beziehungsweise wunderbar und die eigene Kraft übersteigend offen; der Kontext legt zugleich die Frage nach Gottes Fähigkeit nahe.
- source_word: כָּל דָּבָר
  choice: irgendetwas
  rationale: In der rhetorischen Frage gibt „irgendetwas“ den umfassenden Sinn von „irgendeine Sache/Angelegenheit“ idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich; die Transliteration bewahrt seinen Charakter als Eigenname.
- issue: Umfang von כָּל בָּשָׂר
  choice: allen Fleisches
  alternative: aller Menschen
  rationale: Die engere Deutung auf die Menschheit ist im Kontext möglich, doch der hebräische Ausdruck ist weiter. Die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung von יִפָּלֵא
  choice: zu wunderbar
  alternative: zu schwer
  rationale: „Zu wunderbar“ bewahrt die Spannung zwischen dem Außergewöhnlichen und dem, was menschliche Fähigkeit übersteigt. Die Fußnote erläutert den im Kontext naheliegenden Fähigkeitssinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Selbstaussage und die rhetorische Frage bleiben knapp; „allen Fleisches“ ist bewusst bibelsprachlich, aber verständlich und quellennah.
