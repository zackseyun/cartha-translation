reference: Jeremiah 32:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עַל֩ כָּל רָעַ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י יְהוּדָ֗ה אֲשֶׁ֤ר עָשׂוּ֙ לְ/הַכְעִסֵ֔/נִי הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם כֹּהֲנֵי/הֶ֖ם וּ/נְבִֽיאֵי/הֶ֑ם וְ/אִ֣ישׁ יְהוּדָ֔ה וְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/032.yaml
  text: because of all the evil of the sons of Israel and the sons of Judah that they did to provoke me to anger—they[a], their kings, their officials, their priests, and their prophets[c][b], and the men of Judah and the inhabitants of Jerusalem.
translation:
  language: de
  text: wegen all des Bösen, das die Israeliten und die Judäer[a] getan haben, um mich zum Zorn zu reizen[b] – sie selbst, ihre Könige, ihre Amtsträger, ihre Priester und ihre Propheten, die Männer Judas[c] und die Einwohner Jerusalems.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne Israels und die Söhne Judas“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um mich zu erzürnen“.'
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht im Hebräischen die Einzahl „der Mann Judas“, hier kollektiv gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כָּל רָעַת
  choice: wegen all des Bösen
  rationale: עַל bezeichnet hier den Grund für das im vorausgehenden Zusammenhang angekündigte Gericht. רָעָה meint in diesem Kontext moralisch Böses, und כָּל gibt dessen umfassendes Ausmaß an.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  choice: die Israeliten und die Judäer
  rationale: Die idiomatische deutsche Wiedergabe bezeichnet die Angehörigen Israels und Judas klar und natürlich; die wörtliche Form „Söhne“ wird in einer Fußnote dokumentiert.
- source_word: אֲשֶׁר עָשׂוּ
  choice: das … getan hatten
  rationale: Das einfache Verb עשה wird ohne zusätzliche Deutung als „tun“ wiedergegeben. Das Plusquamperfekt fügt sich natürlich in den deutschen Erzählzusammenhang ein.
- source_word: לְהַכְעִסֵנִי
  choice: um mich zum Zorn zu reizen
  rationale: Die Wiedergabe erhält sowohl die kausative Bedeutung des Hifil als auch den ausdrücklich bezeichneten Zorn; eine knappere Alternative wird in der Fußnote genannt.
- source_word: הֵמָּה
  choice: sie selbst
  rationale: Das selbstständige Pronomen ist hervorgehoben und nimmt die Verantwortlichen vor der anschließenden Aufzählung nochmals auf.
- source_word: מַלְכֵיהֶם
  choice: ihre Könige
  rationale: Direkte und natürliche Wiedergabe der Possessivform.
- source_word: שָׂרֵיהֶם
  choice: ihre Amtsträger
  rationale: שָׂרִים bezeichnet hier Personen mit politischer oder administrativer Leitungsgewalt. „Amtsträger“ ist modern und vermeidet die für „Fürsten“ mögliche Verengung auf erblichen Adel.
- source_word: כֹּהֲנֵיהֶם וּנְבִיאֵיהֶם
  choice: ihre Priester und ihre Propheten
  rationale: Die beiden religiösen Gruppen werden entsprechend der hebräischen Possessivformen ausdrücklich der Gemeinschaft zugeordnet.
- source_word: וְאִישׁ יְהוּדָה
  choice: die Männer Judas
  rationale: Das singularische אִישׁ hat hier kollektive beziehungsweise repräsentative Bedeutung. Die Wiedergabe wahrt die maskuline Form, während eine Fußnote auf den hebräischen Singular hinweist.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: und die Einwohner Jerusalems
  rationale: Natürliche deutsche Wiedergabe des substantivierten Partizips für die in Jerusalem wohnende Bevölkerung.
theological_decisions:
- issue: Geschlechtlich markierte Kollektivbegriffe in בְּנֵי und אִישׁ
  choice: בְּנֵי wird idiomatisch als Volksbezeichnung wiedergegeben; אִישׁ bleibt als „Männer“ maskulin markiert.
  alternative: „die Söhne Israels und die Söhne Judas“ sowie „jeder Mann Judas“
  rationale: Die Übersetzung soll im modernen Deutsch verständlich sein, ohne die Form des Ausgangstextes zu verschweigen. Bei der festen Abstammungsbezeichnung בְּנֵי ist die Volksbezeichnung idiomatisch; die wörtliche Form steht in der Fußnote. Beim auffälligen singularischen אִישׁ wird die maskuline kollektive Aussage im Haupttext bewahrt und ihre Form erläutert.
- issue: Absicht beziehungsweise Wirkung von לְהַכְעִיסֵנִי
  choice: „um mich zum Zorn zu reizen“
  alternative: „sodass sie mich zum Zorn reizten“ oder „um mich zu erzürnen“
  rationale: Die לְ-Konstruktion kann Ziel beziehungsweise hervorgebrachte Wirkung ausdrücken. Die gewählte Form wahrt die naheliegende Zielangabe, ohne über die im Text genannte Provokation hinaus eine besondere Lehre über menschliche Absichten festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Da der Vers syntaktisch an den vorausgehenden Satz anschließt, beginnt der Text bewusst mit „wegen“. Der Gedankenstrich bildet die hervorgehobene Wiederaufnahme durch הֵמָּה und die folgende Aufzählung ab.
