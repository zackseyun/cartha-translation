  variant: modern standard German
source:
  edition: WLC
  text: וְ/צִדְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹ֥א יִמָּלֵ֖ט מִ/יַּ֣ד הַ/כַּשְׂדִּ֑ים כִּ֣י הִנָּתֹ֤ן יִנָּתֵן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/דִבֶּר פִּ֣י/ו עִם פִּ֔י/ו וְ/עֵינָ֖י/ו אֶת עינ/ו תִּרְאֶֽינָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/004.yaml
  text: And Zedekiah king of Judah will not escape from the hand of the Chaldeans[a], for he will surely be given into the hand of the king of Babylon, and he will speak mouth to mouth with him[b], and his eyes will see his eyes.
translation:
  language: de
  text: Und Zedekia, der König von Juda, wird der Hand der Chaldäer nicht entkommen[a], denn er wird ganz gewiss in die Hand des Königs von Babel gegeben werden. Er wird mit ihm von Mund zu Mund reden[b], und seine Augen werden dessen Augen sehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „wird der Gewalt der Chaldäer nicht entkommen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Er wird unmittelbar und persönlich mit ihm reden.'
    reason: idiom_explanation
  - marker: c
    text: 'Das heißt: Er wird ihm direkt in die Augen sehen.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יִמָּלֵט
  choice: wird … nicht entkommen
  rationale: Das Nifal von מלט bezeichnet hier das Entkommen aus feindlicher Gewalt; die deutsche Wendung ist natürlich und kontextgerecht.
- source_word: מִיַּד הַכַּשְׂדִּים
  choice: der Hand der Chaldäer
  rationale: Die konkrete hebräische Hand-Metapher bleibt erhalten; „Chaldäer“ wahrt die spezifische ethnisch-politische Bezeichnung des Ausgangstextes.
- source_word: הִנָּתֹן יִנָּתֵן
  choice: ganz gewiss … gegeben werden
  rationale: Infinitivus absolutus und finite Verbform verstärken die Gewissheit; „ganz gewiss“ gibt diese emphatische Funktion wieder und bewahrt das Passiv.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: in die Hand des Königs von Babel
  rationale: Die Hand-Metapher wird konsequent beibehalten; „Babel“ entspricht der in deutschen Bibelübersetzungen vertrauten Ortsbezeichnung.
- source_word: וְדִבֶּר פִּיו עִם פִּיו
  choice: Er wird mit ihm von Mund zu Mund reden
  rationale: Die ungewöhnliche, konkrete Körperteilrede des Hebräischen bleibt erkennbar, während der deutsche Satz grammatisch und verständlich formuliert ist.
- source_word: וְעֵינָיו אֶת עֵינוֹ תִּרְאֶינָה
  choice: seine Augen werden dessen Augen sehen
  rationale: Die auffällige reziproke Bildsprache des Hebräischen wird bewahrt, ohne sie stillschweigend zu „von Angesicht zu Angesicht“ zu glätten.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Verwendet die im modernen deutschen Bibelgebrauch etablierte Form des Personennamens.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „Hand“, „Mund zu Mund“ und „seine Augen werden dessen Augen sehen“ bleiben im Haupttext erhalten; Fußnoten erläutern ihre idiomatische Bedeutung. Das adversative „sondern“ bildet den sachlichen Gegensatz zwischen Nichtentkommen und sicherer Auslieferung natürlich ab.
