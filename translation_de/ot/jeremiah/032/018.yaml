source:
  edition: WLC
  text: עֹ֤שֶׂה חֶ֨סֶד֙ לַֽ/אֲלָפִ֔ים וּ/מְשַׁלֵּם֙ עֲוֺ֣ן אָב֔וֹת אֶל חֵ֥יק בְּנֵי/הֶ֖ם אַחֲרֵי/הֶ֑ם הָ/אֵ֤ל הַ/גָּדוֹל֙ הַ/גִּבּ֔וֹר יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/018.yaml
  text: showing steadfast love to thousands[a], and repaying the iniquity of fathers into the lap of their children after them—the great, mighty God, Yahweh of Armies[b], is his name.
translation:
  language: de
  text: Tausenden[a] beständige Liebe erweist und die Schuld der Väter ihren Kindern, die nach ihnen kommen, in den Schoß vergilt — der große, mächtige Gott, Jahwe der Heerscharen[b], ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tausenden von Generationen“; im Licht ähnlicher Bundesaussagen ist diese Ergänzung möglich. Im Hebräischen steht hier nur „Tausenden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe der Heere“; traditionell: „der HERR Zebaoth“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה חֶסֶד
  choice: beständige Liebe erweist
  rationale: Die partizipiale Wendung beschreibt fortlaufend Gottes Handeln. „Beständige Liebe“ bringt sowohl Güte als auch verlässliche Bundestreue zum Ausdruck; „erweist“ ist im Deutschen die natürliche Verbindung.
- source_word: לַאֲלָפִים
  choice: der Tausenden
  rationale: Der hebräische Text nennt wörtlich nur „Tausende“ und ergänzt weder „Menschen“ noch „Generationen“. Die knappe Form bleibt daher im Haupttext erhalten.
- source_word: וּמְשַׁלֵּם
  choice: und … zurückzahlt
  rationale: Das Verb bezeichnet Vergeltung beziehungsweise entsprechende Rückzahlung. „Zurückzahlt“ bewahrt diesen Gedanken in verständlicher heutiger Sprache.
- source_word: עֲוֺן
  choice: Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder deren Folge bezeichnen. „Schuld“ erhält die moralische Schwere, ohne die mögliche Bedeutung auf Sünde oder Strafe einzuengen.
- source_word: אָבוֹת
  choice: Väter
  rationale: Das ausdrücklich maskuline Pluralwort wird präzise mit „Väter“ wiedergegeben.
- source_word: אֶל חֵיק
  choice: in den Schoß
  rationale: Die konkrete hebräische Metapher wird beibehalten; sie bezeichnet etwas, das jemandem unmittelbar und persönlich zukommt.
- source_word: בְּנֵיהֶם אַחֲרֵיהֶם
  choice: ihrer Kinder nach ihnen
  rationale: בָּנִים kann Söhne, Kinder oder Nachkommen bezeichnen. Im Zusammenhang ist „Kinder“ repräsentativ und natürlich; „nach ihnen“ bewahrt die ausdrückliche zeitliche Folge.
- source_word: הָאֵל הַגָּדוֹל הַגִּבּוֹר
  choice: der große, mächtige Gott
  rationale: Die deutsche Form ist würdevoll und idiomatisch und erhält beide göttlichen Attribute.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen als Namen wieder. „Heerscharen“ wahrt die Breite und Erhabenheit von צְבָאוֹת, das himmlische und irdische Heere umfassen kann; die verständlichere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Generationenübergreifende Vergeltung
  choice: Die Aussage, dass Gott die Schuld der Väter in den Schoß ihrer Kinder nach ihnen zurückzahlt, bleibt ungemildert stehen.
  alternative: Die Aussage ausschließlich als natürliche soziale Folgen elterlicher Sünde erklären oder als unmittelbare Bestrafung schuldloser Kinder festlegen.
  rationale: Der Vers formuliert eine reale generationenübergreifende Dimension, erklärt aber nicht abschließend deren Verhältnis zur individuellen Verantwortung. Diese kanonische Spannung darf die Übersetzung nicht auflösen.
- issue: Bedeutung von לַאֲלָפִים
  choice: Im Haupttext steht lediglich „der Tausenden“.
  alternative: „Tausenden von Generationen“ ergänzen.
  rationale: Ähnliche Bundestexte legen Generationen als möglichen Bezug nahe, doch das Substantiv fehlt hier im Hebräischen. Die Mehrdeutigkeit wird durch eine Fußnote kenntlich gemacht.
- issue: Göttlicher Titel צְבָאוֹת
  choice: „Jahwe der Heerscharen“ im Haupttext.
  alternative: „Jahwe der Heere“ oder traditionell „der HERR Zebaoth“.
  rationale: Die gewählte Form bewahrt die erhabene, umfassende und militärisch-souveräne Kraft des Titels, ohne den persönlichen Gottesnamen durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform setzt die in Vers 17 begonnene Anrede beziehungsweise Gottesbeschreibung fort. Die Schoß-Metapher und die knappe Form „der Tausenden“ bleiben bewusst erhalten; Fußnoten erläutern echte lexikalische Alternativen.
