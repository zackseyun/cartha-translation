source:
  edition: WLC
  text: וְ/שַׂשְׂתִּ֥י עֲלֵי/הֶ֖ם לְ/הֵטִ֣יב אוֹתָ֑/ם וּ/נְטַעְתִּ֞י/ם בָּ/אָ֤רֶץ הַ/זֹּאת֙ בֶּ/אֱמֶ֔ת בְּ/כָל לִבִּ֖/י וּ/בְ/כָל נַפְשִֽׁ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/041.yaml
  text: I will rejoice over them to do them good[a], and I will plant them in this land in faithfulness, with all my heart and with all my soul.
translation:
  language: de
  text: Ich werde mich über sie freuen und ihnen Gutes tun. Ich werde sie in diesem Land in Treue[a] einpflanzen, mit meinem ganzen Herzen und mit meiner ganzen Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wahrhaftig“ oder „in Wahrheit“.'
    reason: Lexikalische Alternative für בֶּאֱמֶת.
lexical_decisions:
- source_word: וְשַׂשְׂתִּי עֲלֵיהֶם
  choice: Ich werde mich über sie freuen
  rationale: שׂושׂ bezeichnet starke Freude; עַל kennzeichnet hier die Menschen als Gegenstand dieser Freude. Die Zukunftsform entspricht dem prophetischen Verheißungszusammenhang.
- source_word: לְהֵיטִיב אוֹתָם
  choice: und ihnen Gutes tun
  rationale: Die Wendung mit dem Hifil von יטב bedeutet, jemandem Gutes zu tun beziehungsweise ihm Wohlergehen zu schenken. Die deutsche Formulierung ist natürlich und bewahrt den positiven, umfassenden Sinn.
- source_word: וּנְטַעְתִּים
  choice: Ich werde sie … einpflanzen
  rationale: נטע bedeutet wörtlich „pflanzen“. „Einpflanzen“ bewahrt das in Jeremia wichtige Bild und lässt zugleich die dauerhafte Ansiedlung im Land anklingen.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: „Land“ entspricht אֶרֶץ im Zusammenhang der Wiederherstellungs- und Landverheißung, ohne den Ausdruck unnötig politisch einzuengen.
- source_word: בֶּאֱמֶת
  choice: in Treue
  rationale: אֱמֶת kann Wahrheit, Verlässlichkeit oder Treue bezeichnen. Hier hebt die Wendung Gottes verlässliche, vorbehaltlose Entschlossenheit hervor; die echte Alternative „wahrhaftig“ wird in einer Fußnote erhalten.
- source_word: בְּכָל לִבִּי וּבְכָל נַפְשִׁי
  choice: mit meinem ganzen Herzen und mit meiner ganzen Seele
  rationale: Die konkrete hebräische Rede von Herz und Seele bringt die vollständige persönliche Hingabe nachdrücklich zum Ausdruck und wird daher nicht zu einer abstrakten Umschreibung verflacht.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Herz und Seele
  choice: Die Formulierung „mit meinem ganzen Herzen und mit meiner ganzen Seele“ bleibt ausdrücklich auf Gott bezogen.
  alternative: „mit meinem ganzen Wesen“ oder „mit völliger Hingabe“
  rationale: Der hebräische Text gebraucht bewusst die Sprache uneingeschränkter persönlicher Hingabe. Ihre Beibehaltung wahrt die Kraft der Bundesverheißung, ohne sie spekulativ auszudeuten.
- issue: Bedeutung von בֶּאֱמֶת in der Wiederherstellungsverheißung
  choice: „in Treue“ im Haupttext
  alternative: „wahrhaftig“ oder „in Wahrheit“
  rationale: Im Zusammenhang bezeichnet der Ausdruck am ehesten Gottes Verlässlichkeit bei der dauerhaften Ansiedlung seines Volkes. Die semantische Offenheit wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist zur besseren Verständlichkeit in zwei Hauptsätze gegliedert. Das landwirtschaftliche Bild des Einpflanzens sowie die auffällige Rede von Gottes ganzem Herzen und seiner ganzen Seele bleiben erhalten.
