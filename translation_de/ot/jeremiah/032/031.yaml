source:
  edition: WLC
  text: כִּ֧י עַל אַפִּ֣/י וְ/עַל חֲמָתִ֗/י הָ֤יְתָה לִּ/י֙ הָ/עִ֣יר הַ/זֹּ֔את לְ/מִן הַ/יּוֹם֙ אֲשֶׁ֣ר בָּנ֣וּ אוֹתָ֔/הּ וְ/עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה לַ/הֲסִירָ֖/הּ מֵ/עַ֥ל פָּנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/031.yaml
  text: For this city has been to me a cause of my anger and my wrath from the day they built it even to this day[b][a], so that I should remove it from before my face.
translation:
  language: de
  text: Denn diese Stadt ist mir seit dem Tag, als man sie baute, bis zum heutigen Tag Anlass zu meinem Zorn und meinem Grimm gewesen, sodass ich sie aus meiner Gegenwart entferne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um sie von vor meinem Angesicht zu entfernen“. Die Formulierung kann sowohl Zweck als auch Folge ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Gerichtsankündigung ein und gibt den erklärenden Zusammenhang im Deutschen natürlich wieder.
- source_word: עַל אַפִּי וְעַל חֲמָתִי
  choice: Anlass zu Zorn und Grimm gegeben
  rationale: Die wörtlich schwierige Fügung mit עַל bezeichnet hier idiomatisch, dass die Stadt Gottes Zorn hervorgerufen hat. Die aktive deutsche Wendung gibt diesen Sinn klar wieder, ohne den Auslöser näher zu bestimmen.
- source_word: אַפִּי
  choice: Zorn
  rationale: אַף bedeutet wörtlich „Nase“, bezeichnet aber häufig metonymisch Zorn.
- source_word: חֲמָתִי
  choice: Grimm
  rationale: חֵמָה bezeichnet heftigen, glühenden Zorn. „Grimm“ erhält den gehobenen Ton und unterscheidet das Wort von אַף.
- source_word: הָיְתָה לִּי
  choice: hat mir … gegeben
  rationale: In Verbindung mit der idiomatisch verstandenen Zornesformel wird das fortdauernde Verhältnis der Stadt zu Gott in natürlichem Deutsch ausgedrückt.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּנוּ אוֹתָהּ
  choice: vom Tag an, als man sie baute
  rationale: לְמִן markiert den Ausgangspunkt. Das unpersönliche „man“ wahrt die im Hebräischen nicht näher bestimmten Erbauer.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Gibt die ununterbrochene zeitliche Erstreckung bis zur Gegenwart wieder.
- source_word: לַהֲסִירָהּ
  choice: sodass ich sie … entfernen muss
  rationale: Der Infinitiv mit ל kann Zweck oder Folge ausdrücken. „Sodass“ bewahrt die resultative Nuance; „muss“ kennzeichnet hier die daraus erwachsende Konsequenz, nicht einen äußeren Zwang.
- source_word: מֵעַל פָּנָי
  choice: aus meiner Gegenwart
  rationale: Die wörtliche Wendung „von vor meinem Angesicht“ bezeichnet die Entfernung aus Gottes Gegenwart. Die gewählte Form ist modern und verständlich; die konkrete Bildsprache wird in der Fußnote genannt.
theological_decisions:
- issue: Anthropomorphe Sprache für Gottes Zorn und Gegenwart
  choice: „Zorn und Grimm“ bleibt erhalten; מֵעַל פָּנָי wird idiomatisch mit „aus meiner Gegenwart“ wiedergegeben und wörtlich erläutert.
  alternative: „vor meinem Angesicht wegschaffen“
  rationale: Die Zornessprache des hebräischen Textes wird nicht abstrahiert. Bei der Wendung für Gottes Angesicht erhält die Hauptfassung jedoch natürliches modernes Deutsch, während die Fußnote das Körperbild transparent macht.
- issue: Zweck oder Folge bei לַהֲסִירָהּ
  choice: 'resultativ: „sodass ich sie … entfernen muss“'
  alternative: 'final: „um sie … zu entfernen“'
  rationale: Der Zusammenhang stellt die Entfernung der Stadt als Konsequenz ihres fortgesetzten Hervorrufens göttlichen Zorns dar. Da die Präposition mit Infinitiv beide Nuancen zulässt, nennt die Fußnote die alternative finale Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zorn und Grimm“ bewahrt die feierliche Doppelung; „aus meiner Gegenwart entfernen“ vermeidet eine altertümliche Haupttextformulierung. Das ergänzte „immer wieder“ verdeutlicht die im Zeitraum liegende fortgesetzte Provokation.
