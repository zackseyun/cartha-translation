source:
  edition: WLC
  text: וָ/אֶתְפַּלֵּ֖ל אֶל יְהוָ֑ה אַחֲרֵ֤י תִתִּ/י֙ אֶת סֵ֣פֶר הַ/מִּקְנָ֔ה אֶל בָּר֥וּךְ בֶּן נֵרִיָּ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/016.yaml
  text: After I had given the deed of purchase to Baruch son of Neriah[a], I prayed to Yahweh, saying,
translation:
  language: de
  text: 'Nachdem ich Baruch, dem Sohn Nerijas, die Kaufurkunde übergeben hatte, betete ich zu Jahwe und sprach:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל
  choice: betete ich
  rationale: Das Hitpael von פלל bedeutet hier schlicht „beten“; eine zusätzliche Intensität oder Fürbitte ist nicht ausdrücklich bezeichnet.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: אֶל bezeichnet die Ausrichtung des Gebets; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אַחֲרֵי תִתִּי
  choice: Nachdem ich … übergeben hatte
  rationale: Die Konstruktion bezeichnet eine abgeschlossene Handlung, die dem Hauptverb zeitlich vorausgeht; das deutsche Plusquamperfekt bildet diese Abfolge natürlich ab.
- source_word: סֵפֶר הַמִּקְנָה
  choice: die Kaufurkunde
  rationale: סֵפֶר bezeichnet hier ein Schriftstück, הַמִּקְנָה dessen Funktion im Kaufgeschäft; „Kaufurkunde“ ist präzise und idiomatisch.
- source_word: אֶל בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruch, dem Sohn Nerijas
  rationale: Mit „übergeben“ verlangt die deutsche Satzfügung den Dativ; das Patronym wird ausdrücklich bewahrt.
- source_word: לֵאמֹר
  choice: 'und sprach:'
  rationale: Die Formel leitet den folgenden Wortlaut des Gebets ein. „Und sprach:“ ist im Deutschen natürlicher als das partizipiale „indem ich sagte“, ohne die Funktion der hebräischen Formel zu verändern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vorzeitigkeit der Übergabe wird klar ausgedrückt; der Doppelpunkt bereitet den in Vers 17 folgenden Gebetswortlaut vor.
