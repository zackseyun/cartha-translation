source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר יִרְמְיָ֑הוּ הָיָ֥ה דְּבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/006.yaml
  text: And Jeremiah said[a], "The word of Yahweh came to me, saying,"
translation:
  language: de
  text: 'Und Jeremia sagte: »Das Wort Jahwes[a] erging an mich:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: Nennt die hebräische Form des Gottesnamens und die traditionelle deutsche Wiedergabe.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Das Waw mit der erzählenden Verbform führt die Handlung weiter. „Und … sagte“ wahrt diesen Zusammenhang, ohne die zeitliche Abfolge mit „Dann“ stärker festzulegen.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname folgt der im Deutschen üblichen biblischen Namensform.
- source_word: הָיָה דְבַר־יְהוָה אֵלַי
  choice: Das Wort Jahwes erging an mich
  rationale: Die feste deutsche Wendung „erging an mich“ gibt die prophetische Offenbarungsformel idiomatisch und zugleich quellennah wieder.
- source_word: דְבַר
  choice: Wort
  rationale: „Wort“ erhält sowohl die vertraute prophetische Formel als auch den direkten lexikalischen Bezug zu דָּבָר; „Botschaft“ wäre sinngemäß möglich, aber interpretierender.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֵלַי
  choice: an mich
  rationale: In Verbindung mit der deutschen Wendung „erging“ entspricht „an mich“ natürlich der hebräischen Präposition mit dem Suffix der ersten Person Singular.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der folgenden Rede
  rationale: Der Infinitiv leitet den Inhalt der göttlichen Mitteilung ein. Im modernen Deutschen erfüllt der Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „Das Wort Jahwes erging an mich“ bleibt erhalten; der Doppelpunkt eröffnet knapp und natürlich den in Vers 7 folgenden Redeinhalt.
