base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/038.yaml
  text: And they will be my people[a], and I will be their God.
translation:
  language: de
  text: Und sie werden mein Volk sein[a], und ich werde ihr Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie werden mir zum Volk sein, und ich werde ihnen zum Gott sein.“ Das ist eine hebräische Bundesformel, die wechselseitige Zugehörigkeit und Beziehung ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Und sie werden … sein
  rationale: Das Qal-Perfekt mit vorangestelltem וְ steht in dieser prophetischen Verheißungsfolge mit Zukunftsbezug. „Werden … sein“ gibt die Aussage im modernen Deutsch klar wieder.
- source_word: לִי לְעָם
  choice: mein Volk
  rationale: Wörtlich steht „mir/für mich zum Volk“. In der hebräischen Bundesformel bezeichnet die Konstruktion Zugehörigkeit und Beziehung; „mein Volk“ ist die natürliche deutsche Entsprechung.
- source_word: וַאֲנִי
  choice: und ich
  rationale: Die Konjunktion verbindet die beiden wechselseitigen Aussagen der Bundesformel. Ein Gegensatz wie „aber ich“ ist nicht angezeigt.
- source_word: אֶהְיֶה
  choice: ich werde … sein
  rationale: Das Imperfekt in der ersten Person Singular drückt hier Gottes künftige Bundeszusage aus und wahrt zugleich die verbale Entsprechung zum ersten Satzteil.
- source_word: לָהֶם לֵאלֹהִים
  choice: ihr Gott
  rationale: Wörtlich steht „ihnen/für sie zum Gott“. In dieser Formel ist אֱלֹהִים relational bestimmt; „ihr Gott“ drückt das im Deutschen idiomatisch aus.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: Und sie werden mein Volk sein, und ich werde ihr Gott sein.
  alternative: Und sie werden mir zum Volk sein, und ich werde ihnen zum Gott sein.
  rationale: Die gewählte Fassung bewahrt die wechselseitige Zugehörigkeit der hebräischen Bundesformel in natürlichem, würdigem Deutsch. Die wörtlichere Konstruktion wird in der Fußnote kenntlich gemacht, ohne die Beziehungsaussage weiter auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die parallele Satzstruktur und die Zukunftsaussage des Hebräischen bleiben erhalten.
