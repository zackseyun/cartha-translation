  to: Felder wird man mit Silber kaufen, eine Urkunde ausfertigen, sie versiegeln und Zeugen hinzuziehen[a] – im Land Benjamin, in der Umgebung Jerusalems, in den Städten Judas, in den Städten des Berglands, in den Städten der Niederung[b] und in den Städten des Negev. Denn ich werde ihr Geschick wenden[c], spricht Yahweh.
  rationale: Die Revision wahrt den modernen, rechtlich verständlichen Stil, stellt aber den im Hebräischen ausdrücklich genannten Vorgang des Ausfertigens einer Urkunde und ihres Versiegelns deutlicher heraus. Die Fußnote zur Zeugenformel wird sprachlich und sachlich korrigiert; die Alternativen zur Wiederherstellungsformel bleiben offen, ohne deren Bedeutung auf eine einzige Deutung zu beschränken.
