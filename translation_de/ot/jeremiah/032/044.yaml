source:
  edition: WLC
  text: שָׂד֞וֹת בַּ/כֶּ֣סֶף יִקְנ֗וּ וְ/כָת֨וֹב בַּ/סֵּ֥פֶר וְ/חָתוֹם֮ וְ/הָעֵ֣ד עֵדִים֒ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן וּ/בִ/סְבִיבֵ֣י יְרוּשָׁלִַ֗ם וּ/בְ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/עָרֵ֣י הָ/הָ֔ר וּ/בְ/עָרֵ֥י הַ/שְּׁפֵלָ֖ה וּ/בְ/עָרֵ֣י הַ/נֶּ֑גֶב כִּֽי אָשִׁ֥יב אֶת שְׁבוּתָ֖/ם נְאֻם יְהוָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/044.yaml
  text: Fields will be bought with silver[a], and deeds will be written in a scroll and sealed and witnessed by witnesses in the land of Benjamin, around Jerusalem, and in the cities of Judah, in the cities of the hill country, in the cities of the lowland, and in the cities of the Negeb; for I will restore their fortunes[c][b], declares Yahweh.
translation:
  language: de
  text: Felder wird man mit Silber kaufen, eine Urkunde ausfertigen, sie versiegeln und Zeugen hinzuziehen[a] – im Land Benjamin, in der Umgebung Jerusalems, in den Städten Judas, in den Städten des Berglands, in den Städten der Niederung[b] und in den Städten des Negev. Denn ich werde ihr Geschick wenden[c], spricht Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „und Zeugen bezeugen lassen“; gemeint ist die förmliche Bestätigung des Rechtsgeschäfts durch Zeugen.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch „Schefelah“, die westlich des judäischen Berglands gelegene Niederungs- und Hügellandschaft.
    reason: cultural_note
  - marker: c
    text: 'Oder: „ich werde ihre Gefangenschaft wenden“ oder „ich werde die Exilierten zurückbringen“. Die hebräische Wendung kann sowohl die Rückkehr aus dem Exil als auch eine umfassendere Wiederherstellung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂדוֹת
  choice: Felder
  rationale: Bezeichnet im Zusammenhang des Grundstückskaufs landwirtschaftlich genutzte Grundstücke; „Felder“ ist konkret und natürlich.
- source_word: בַּכֶּסֶף
  choice: für Silber
  rationale: כֶּסֶף bezeichnet sowohl Silber als auch Geld. „Für Silber“ bewahrt die konkrete Zahlungsform der hebräischen Rechts- und Handelssprache.
- source_word: יִקְנוּ
  choice: wird man … kaufen
  rationale: Die aktive Verbform der 3. Person Plural hat hier ein unbestimmtes Subjekt. Das deutsche „man“ gibt dies natürlich wieder, ohne einen Käufer zu ergänzen.
- source_word: וְכָתוֹב בַּסֵּפֶר
  choice: Kaufurkunden ausstellen
  rationale: סֵפֶר bezeichnet hier im rechtlichen Zusammenhang eine schriftliche Urkunde. „Kaufurkunden ausstellen“ macht den Vorgang im Deutschen verständlich, ohne einen literarischen „Buch“-Sinn nahezulegen.
- source_word: וְחָתוֹם
  choice: versiegeln
  rationale: Das Versiegeln gehört zur rechtsgültigen Abwicklung des Grundstückskaufs.
- source_word: וְהָעֵד עֵדִים
  choice: Zeugen hinzuziehen
  rationale: Die hebräische Rechtsformel bedeutet, Zeugen zur förmlichen Bestätigung des Geschäfts einzusetzen. Die deutsche Formulierung ist natürlich und lässt die Funktion der Zeugen klar erkennen.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: im Land Benjamin
  rationale: אֶרֶץ bezeichnet hier das Stammesgebiet Benjamins; „Land Benjamin“ bewahrt die knappe geografische Bezeichnung.
- source_word: וּבִסְבִיבֵי יְרוּשָׁלִַם
  choice: in der Umgebung Jerusalems
  rationale: Gibt das Gebiet rings um Jerusalem in natürlichem Standarddeutsch wieder.
- source_word: וּבְעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Bewahrt die wiederholte geografische Formel mit עָרֵי und ist im Deutschen klar.
- source_word: הָהָר
  choice: das Bergland
  rationale: Bezeichnet die Bergregion Judas, nicht einen einzelnen Berg.
- source_word: הַשְּׁפֵלָה
  choice: die Niederung
  rationale: Bezeichnet die westlich des judäischen Berglands gelegene Landschaft; die verständliche Übersetzung steht im Text, der Eigenname in der Fußnote.
- source_word: הַנֶּגֶב
  choice: der Negev
  rationale: Hier ist die bestimmte südliche Region gemeint, nicht nur die Himmelsrichtung Süden.
- source_word: שְׁבוּתָם
  choice: ihr Geschick
  rationale: In der Wendung שׁוּב שְׁבוּת bezeichnet das Wort die Umkehr von Not, Exil oder Gefangenschaft hin zur Wiederherstellung. „Ihr Geschick wenden“ erhält die idiomatische Weite.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich; die Transliteration bewahrt ihn als Eigennamen.
- issue: Bedeutungsumfang der Wiederherstellungsformel אָשִׁיב אֶת שְׁבוּתָם
  choice: ich werde ihr Geschick wenden
  alternative: ich werde ihre Gefangenen zurückbringen / ihre Gefangenschaft wenden
  rationale: Die hebräische Wendung kann die Rückkehr aus dem Exil einschließen, bezeichnet aber auch umfassender die Wiederherstellung. Die Hauptübersetzung legt sie nicht einseitig auf nur eine Dimension fest; die Fußnote nennt die engeren Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Formulierung „Felder wird man … kaufen“ hebt wie der hebräische Satz die erneuerte Möglichkeit rechtmäßiger Grundstückskäufe hervor. Die Aufzählung der Regionen bleibt rhythmisch und vollständig erhalten; „spricht Yahweh“ wahrt den prophetischen Formelcharakter.
