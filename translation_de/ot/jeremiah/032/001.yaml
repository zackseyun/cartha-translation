  text: הַ/דָּבָ֞ר אֲשֶׁר הָיָ֤ה אֶֽל יִרְמְיָ֨הוּ֙ מֵ/אֵ֣ת יְהוָ֔ה ב/שנת הָ/עֲשִׂרִ֔ית לְ/צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הִ֧יא הַ/שָּׁנָ֛ה שְׁמֹנֶֽה עֶשְׂרֵ֥ה שָׁנָ֖ה לִ/נְבֽוּכַדְרֶאצַּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/001.yaml
  text: The word that came to Jeremiah from Yahweh in the tenth year of Zedekiah king of Judah[a], which was the eighteenth year of Nebuchadnezzar.
translation:
  language: de
  text: Das Wort, das im zehnten Jahr Zedekias, des Königs von Juda, von Jahwe an Jeremia erging – das war das achtzehnte Jahr Nebukadnezars.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: In prophetischen Einleitungsformeln bezeichnet דָּבָר eine göttliche Mitteilung. „Das Wort“ bewahrt die geprägte Formel, ohne sie zu „Botschaft“ auszudeuten.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das … an Jeremia erging
  rationale: Die hebräische Wendung beschreibt, dass ein Gotteswort an den Propheten gelangt. „erging an“ ist im Deutschen natürlich, würdig und weniger missverständlich als das wörtliche „geschah zu“.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת kennzeichnet die Herkunft des Wortes; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
- source_word: ב/שנת הָעֲשִׂרִית לְ/צִדְקִיָּהוּ
  choice: im zehnten Jahr Zedekias
  rationale: Die Regierungsjahrformel wird in geläufiger deutscher Form wiedergegeben. Der Genitiv macht deutlich, dass das zehnte Regierungsjahr gemeint ist.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Der appositionelle Herrschertitel wird eindeutig auf Zedekia bezogen und idiomatisch in den deutschen Satz eingefügt.
- source_word: הִיא
  choice: das war
  rationale: Das feminine Pronomen bezieht sich auf שָׁנָה („Jahr“) und setzt die beiden Datierungen gleich. Der Gedankenstrich mit „das war“ bildet diese erläuternde Zuordnung klar ab.
- source_word: הַשָּׁנָה שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: das achtzehnte Jahr
  rationale: Die im Hebräischen wiederholte Jahresbezeichnung gehört zur Zahlformel; im Deutschen genügt die einmalige Nennung ohne Bedeutungsverlust.
- source_word: לִ/נְבוּכַדְרֶאצַּר
  choice: Nebukadnezars
  rationale: Das Präfix לְ bezeichnet hier die Zuordnung zum Regierungsjahr. „Nebukadnezar“ ist die im modernen Deutschen etablierte Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch den traditionellen Ersatztitel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Einleitungsformel bleibt erkennbar; die Datierung wird durch einen Gedankenstrich übersichtlich gegliedert. Auf eine Fußnote wird verzichtet, da der Ausgangstext an dieser Stelle keine textkritische oder semantische Unsicherheit erfordert.
