id: JER.32.28
reference: Jeremiah 32:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֕ן כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנְ/נִ֣י נֹתֵן֩ אֶת הָ/עִ֨יר הַ/זֹּ֜את בְּ/יַ֣ד הַ/כַּשְׂדִּ֗ים וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/028.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am giving this city into the hand of the Chaldeans and into the hand of Nebuchadnezzar king of Babylon, and he will capture it.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: Siehe, ich gebe diese Stadt in die Hand der Chaldäer und in die Hand Nebukadnezars[a], des Königs von Babylon; er wird sie einnehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Nebukadrezar“; im Deutschen traditionell „Nebukadnezar“.'
    reason: Die masoretische Namensform an dieser Stelle weicht von der geläufigen deutschen Namensform ab.
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Anklage und Begründung; „Darum“ ist im Deutschen zugleich prägnant und natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die feierliche prophetische Botenformel in geläufigem, würdigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text ausdrücklich stehenden Gottesnamen wieder.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: Erhält den nachdrücklichen Hinweischarakter der göttlichen Ankündigung und die erste Person; „Siehe“ entspricht dem feierlichen prophetischen Register.
- source_word: נֹתֵן
  choice: gebe
  rationale: Das Partizip bezeichnet hier eine unmittelbar bevorstehende beziehungsweise bereits beschlossene Handlung. Das Präsens „gebe“ bewahrt diese Unmittelbarkeit.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Bewahrt das verständliche hebräische Bild für die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen.
- source_word: הַכַּשְׂדִּים
  choice: der Chaldäer
  rationale: Gibt die ethnische Bezeichnung direkt wieder; der folgende Titel des babylonischen Königs verdeutlicht den historischen Bezug.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezars
  rationale: Verwendet die im Deutschen geläufige Namensform; die genauere Entsprechung der hier vorliegenden hebräischen Form wird in der Fußnote genannt.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babylon
  rationale: Natürliche Wiedergabe der hebräischen Genitivverbindung; die Apposition bleibt eindeutig auf Nebukadnezar bezogen.
- source_word: וּלְכָדָהּ
  choice: er wird sie einnehmen
  rationale: לכד bezeichnet bei einer Stadt deren militärische Einnahme. Das maskuline Singularsubjekt wird ausdrücklich wiedergegeben, und das feminine Objektpronomen bezieht sich auf die Stadt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Subjekt des Singularverbs וּלְכָדָהּ
  choice: „er“ bezieht sich auf Nebukadnezar
  alternative: 'Unpersönlich: „sie wird eingenommen“; kollektiv auf die Chaldäer bezogen'
  rationale: Die Verbform steht im maskulinen Singular, und Nebukadnezar ist der nächste ausdrücklich genannte maskuline Singularbezug. Die Formulierung bewahrt diese Syntax, ohne auszuschließen, dass seine Truppen die Einnahme ausführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrtem prophetischem Klang. „Siehe“ und „in die Hand“ erhalten die markanten hebräischen Ausdrucksweisen, bleiben aber im Zusammenhang verständlich. Das Semikolon vor dem letzten Satzteil macht den Wechsel vom göttlichen Handeln zur angekündigten Einnahme der Stadt klar.
