id: JER.32.26
reference: Jeremiah 32:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/026.yaml
  text: Then the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes[a] an Jeremia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; die genaue ursprüngliche Aussprache ist nicht sicher überliefert. Traditionell wird der Name auch mit »Jehova« oder durch »der HERR« wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form führt das nächste Ereignis in der Erzählfolge ein. Zusammen mit דְּבַר ist »Da erging das Wort« eine natürliche, würdige deutsche Wiedergabe der prophetischen Formel.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der festen prophetischen Wendung דְּבַר יְהוָה bewahrt »das Wort« sowohl die formale Ausdrucksweise als auch ihr theologisches Gewicht.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; der Genitiv stellt die Verbindung »das Wort Jahwes« im Deutschen natürlich dar.
- source_word: אֶל
  choice: an
  rationale: Bei der deutschen Wendung »das Wort erging« bezeichnet »an« idiomatisch den Empfänger der Botschaft.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden Rede ein. Im modernen Deutschen übernimmt der Doppelpunkt diese Funktion natürlicher als das formelhafte »indem er sprach«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: Jehova; der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen; die genaue ursprüngliche Aussprache ist jedoch nicht sicher überliefert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem prophetischem Erzählstil. Der Doppelpunkt vermeidet eine unnatürliche wörtliche Wiedergabe von לֵאמֹר und kündigt die unmittelbar folgende Gottesrede klar an.
