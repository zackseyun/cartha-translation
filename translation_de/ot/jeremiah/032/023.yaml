base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/023.yaml
  text: They came in and took possession of it[a], but they did not listen to your voice, and they did not walk in your law. They did not do all that you commanded them to do[b], and you brought upon them all this disaster.
translation:
  language: de
  text: Sie kamen hinein und nahmen es in Besitz. Aber sie hörten nicht auf deine Stimme und richteten sich nicht nach deinem Gesetz.[a] Sie taten nicht alles, was du ihnen zu tun geboten hattest. Und du brachtest all dieses Unheil über sie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach deiner Weisung“. Das hebräische Wort Tora kann „Gesetz“ oder „Weisung“ bedeuten; hier geht es um Gottes verbindliche Unterweisung im Bund.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Und du riefst ihnen all dieses Unheil zu.“ Die hebräische Wendung meint, dass Gott das angekündigte Gericht über sie kommen ließ.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Sie kamen hinein
  rationale: Das Qal wayyiqtol von בוא beschreibt den Eintritt in das zuvor genannte Land. „Kamen hinein“ gibt die Bewegungsrichtung natürlich wieder.
- source_word: וַיִּרְשׁוּ אֹתָהּ
  choice: nahmen es in Besitz
  rationale: ירשׁ bezeichnet im Zusammenhang mit dem Land dessen Besitzergreifung. Die Wiedergabe vermeidet die im Deutschen mögliche Verengung von „erben“ auf einen rechtlichen Erbfall.
- source_word: בְקוֹלֶךָ
  choice: auf deine Stimme
  rationale: Die konkrete Wendung „auf deine Stimme hören“ bewahrt sowohl das Hören als auch den im Kontext mitschwingenden Gehorsam.
- source_word: וּבְתוֹרָתְךָ לֹא הָלָכוּ
  choice: richteten sich nicht nach deinem Gesetz
  rationale: הלך mit ב und תורה beschreibt die Lebensführung gemäß Gottes Weisung. Die deutsche Formulierung gibt das Idiom verständlich wieder, ohne das hebräische Bild unnatürlich als „im Gesetz gehen“ nachzubilden.
- source_word: תּוֹרָה
  choice: Gesetz
  rationale: Im Zusammenhang mit Israels Bundespflichten im Land bezeichnet תורה die verbindliche göttliche Unterweisung. „Gesetz“ passt zum Kontext; die ebenfalls mögliche Wiedergabe „Weisung“ wird in einer Fußnote festgehalten.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתָה לָהֶם לַעֲשׂוֹת לֹא עָשׂוּ
  choice: Sie taten nichts von all dem, was du ihnen zu tun geboten hattest
  rationale: 'Die Formulierung bewahrt die umfassende Verneinung: Von der Gesamtheit des Gebotenen wurde nichts getan. Das Plusquamperfekt ordnet das vorausgehende Gebot im Deutschen klar ein.'
- source_word: וַתַּקְרֵא אֹתָם אֵת כָּל הָרָעָה הַזֹּאת
  choice: Da brachtest du all dieses Unheil über sie
  rationale: Die ungewöhnliche Konstruktion mit קרא besagt hier idiomatisch, dass das Unheil herbeigerufen beziehungsweise über die Menschen gebracht wurde. „Da“ macht den im Zusammenhang erkennbaren Folgezusammenhang deutlich, ohne ihn stärker als kausal festzulegen.
- source_word: הָרָעָה
  choice: Unheil
  rationale: רָעָה bezeichnet hier die schädliche Katastrophe des Bundesgerichts, nicht moralische Bosheit. „Unheil“ erhält den ernsten prophetischen Klang und vermeidet ein ethisches Missverständnis.
theological_decisions:
- issue: Bedeutung von תורה im Bundeskontext
  choice: deinem Gesetz
  alternative: deiner Weisung
  rationale: Der Vers erinnert an Israels verbindliche Bundespflichten. „Gesetz“ bringt diesen rechtlich-bundestheologischen Aspekt zur Geltung; „Weisung“ bleibt eine echte lexikalische Möglichkeit und wird daher in der Fußnote genannt.
- issue: Bedeutung von רָעָה beim Handeln Gottes im Gericht
  choice: Unheil
  alternative: Böses
  rationale: Im Kontext geht es um die leidvolle Folge des Gerichts. Die Wiedergabe „Unheil“ beschreibt die Katastrophe, ohne dem hebräischen Wort hier die Bedeutung moralischer Bosheit aufzuzwingen.
- issue: Zusammenhang zwischen Ungehorsam und Gericht
  choice: Da brachtest du all dieses Unheil über sie
  alternative: Und du brachtest all dieses Unheil über sie
  rationale: „Da“ gibt den im Kontext naheliegenden Folgezusammenhang wieder, formuliert jedoch keine über den Vers hinausgehende Lehrbestimmung zur genauen Art der Kausalität.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Gedankengang; unnatürliche Hebraismen wie „im Gesetz gehen“ werden idiomatisch wiedergegeben. Die Anrede Gottes und die Bundesgerichtssprache bleiben klar und feierlich, ohne konfessionelle Zusatzdeutung.
