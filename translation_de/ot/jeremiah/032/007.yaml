source:
  edition: WLC
  text: הִנֵּ֣ה חֲנַמְאֵ֗ל בֶּן שַׁלֻּם֙ דֹּֽדְ/ךָ֔ בָּ֥א אֵלֶ֖י/ךָ לֵ/אמֹ֑ר קְנֵ֣ה לְ/ךָ֗ אֶת שָׂדִ/י֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת כִּ֥י לְ/ךָ֛ מִשְׁפַּ֥ט הַ/גְּאֻלָּ֖ה לִ/קְנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/007.yaml
  text: Look[a], Hanamel son of Shallum, your uncle, is coming to you, saying, ‘Buy my field that is in Anathoth, for the right of redemption to buy it belongs to you.’
translation:
  language: de
  text: 'Sieh, Hanamel, der Sohn Schallums, deines Onkels, kommt zu dir und sagt: »Kauf dir mein Feld in Anatot, denn dir steht das Auslösungsrecht[a] zu, es zu kaufen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort bezeichnet hier das verwandtschaftlich begründete Recht, Familienbesitz auszulösen; möglich ist auch: „Recht der Einlösung“.'
    reason: Erläutert den rechtlich-kulturellen Sinn von מִשְׁפַּט הַגְּאֻלָּה, ohne eine frühere Eigentümerschaft Jeremias vorauszusetzen.
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Bewahrt die hinweisende, die unmittelbar bevorstehende Handlung hervorhebende Kraft und klingt zugleich moderner als „Siehe“.
- source_word: חֲנַמְאֵל
  choice: Hanamel
  rationale: Der Personenname wird in einer im Deutschen gebräuchlichen Form transliteriert.
- source_word: בֶּן שַׁלֻּם דֹּדְךָ
  choice: der Sohn deines Onkels Schallum
  rationale: 'דֹּדְךָ bezieht sich syntaktisch auf Schallum: Hanamel ist der Sohn von Jeremias Onkel Schallum. Die Formulierung vermeidet die mögliche Fehlannahme, Hanamel selbst werde als Onkel bezeichnet.'
- source_word: בָּא אֵלֶיךָ
  choice: kommt zu dir
  rationale: Das Partizip stellt ein unmittelbar bevorstehendes Geschehen anschaulich als im Kommen dar.
- source_word: לֵאמֹר
  choice: und wird sagen
  rationale: Leitet die angekündigte direkte Rede im Deutschen natürlich ein und entspricht dem hier zukunftsbezogenen Zusammenhang.
- source_word: קְנֵה לְךָ
  choice: Kauf dir
  rationale: Gibt den Imperativ samt dem ethischen Dativ לְךָ knapp und idiomatisch wieder.
- source_word: שָׂדִי
  choice: mein Feld
  rationale: Bewahrt die konkrete Bezeichnung des Grundstücks.
- source_word: בַּעֲנָתוֹת
  choice: in Anatot
  rationale: Der Ortsname wird in der etablierten deutschen Form wiedergegeben.
- source_word: מִשְׁפַּט הַגְּאֻלָּה
  choice: das Rückkaufsrecht
  rationale: Bezeichnet hier das verwandtschaftlich begründete Recht, Familienbesitz zurückzukaufen. „Rückkaufsrecht“ ist im heutigen Deutsch klarer als das missverständliche „Erlösungsrecht“ und bewahrt den rechtlichen Charakter von מִשְׁפָּט.
- source_word: כִּי לְךָ
  choice: denn dir steht ... zu
  rationale: Gibt die Begründung und die rechtliche Zuordnung idiomatisch wieder.
- source_word: לִקְנוֹת
  choice: es zu kaufen
  rationale: Das im Hebräischen unausgesprochene Objekt wird aus „mein Feld“ aufgenommen; der Infinitiv erläutert den Inhalt beziehungsweise Zweck des Rückkaufsrechts.
theological_decisions:
- issue: Bedeutung von גְּאֻלָּה im Grundstücksrecht
  choice: Als verwandtschaftlich begründetes Rückkaufsrecht verstanden, nicht geistlich gedeutet.
  alternative: „Auslösung“ oder „Erlösung des Grundstücks“
  rationale: Der Zusammenhang handelt vom Erwerb von Familienland nach dem israelitischen Verwandtschaftsrecht. „Rückkauf“ macht den rechtlichen Vorgang verständlich, ohne spätere geistliche Bedeutungen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar markiert; der Satzbau bleibt nah am hebräischen Ablauf, ohne unnatürlich zu wirken. Der Fußnotenmarker steht bei dem erklärungsbedürftigen Rechtsbegriff.
