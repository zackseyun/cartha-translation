id: JER.32.3
reference: Jeremiah 32:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֲשֶׁ֣ר כְּלָא֔/וֹ צִדְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹ֑ר מַדּוּעַ֩ אַתָּ֨ה נִבָּ֜א לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֥יר הַ/זֹּ֛את בְּ/יַ֥ד מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/003.yaml
  text: 'because Zedekiah king of Judah had confined him[a], saying, “Why do you prophesy, saying, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will capture it’?”'
translation:
  language: de
  text: 'Denn Zedekia, der König von Juda, hatte ihn in Haft genommen[a] und gesagt: „Warum prophezeist du mit den Worten: ›So spricht Jahwe: Sieh, ich gebe diese Stadt in die Hand des Königs von Babylon, und er wird sie einnehmen‹?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hatte ihn eingesperrt“ oder „hatte ihn gefangen gesetzt“.'
    reason: Lexikalische Alternativen für כלא, das Einschließen, Festhalten oder Inhaftieren bezeichnen kann.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Denn
  rationale: Die Relativpartikel führt hier im Anschluss an den vorherigen Vers den Grund für Jeremias Gewahrsam näher aus. „Denn“ bildet diese Textverknüpfung im Deutschen natürlich ab.
- source_word: כְּלָאוֹ
  choice: hatte ihn in Haft genommen
  rationale: כלא bezeichnet das Einschließen beziehungsweise Festhalten einer Person. Die Formulierung ist modernes, sachliches Deutsch und das Plusquamperfekt macht deutlich, dass die Inhaftierung der wiedergegebenen Frage vorausging.
- source_word: לֵאמֹר
  choice: und gesagt / mit den Worten
  rationale: Die beiden Vorkommen dienen jeweils der Einführung direkter Rede. Unterschiedliche, idiomatische deutsche Wendungen vermeiden eine schwerfällige Wiederholung, ohne die Struktur zu verlieren.
- source_word: מַדּוּעַ
  choice: Warum
  rationale: Direkte und natürliche Wiedergabe des Frageworts.
- source_word: נִבָּא
  choice: prophezeist du
  rationale: Der Nifal von נבא bedeutet hier „prophezeien“; das Präsens entspricht der an Jeremia gerichteten Beschwerde.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die erkennbare prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: הִנְנִי נֹתֵן
  choice: Sieh, ich gebe
  rationale: הִנְנִי hebt die feierliche Unmittelbarkeit des göttlichen Handelns hervor; das Partizip נֹתֵן wird entsprechend seiner anschaulichen, als gewiss dargestellten Zukunftsbedeutung präsentisch wiedergegeben.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Metapher für das Ausliefern in die Gewalt eines anderen bleibt erhalten und ist im deutschen Bibelstil verständlich.
- source_word: וּלְכָדָהּ
  choice: und er wird sie einnehmen
  rationale: לכד bezeichnet bei einer Stadt ihre militärische Einnahme. Das maskuline Subjekt bezieht sich naheliegend auf den König von Babylon.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Botenformel und das Bild „in die Hand“ bleiben erkennbar; weniger geläufige Archaismen werden vermieden.
