  text: וּ/בָבֶ֞ל יוֹלִ֤ךְ אֶת צִדְקִיָּ֨הוּ֙ וְ/שָׁ֣ם יִֽהְיֶ֔ה עַד פָּקְדִ֥/י אֹת֖/וֹ נְאֻם יְהוָ֑ה כִּ֧י תִֽלָּחֲמ֛וּ אֶת הַ/כַּשְׂדִּ֖ים לֹ֥א תַצְלִֽיחוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/005.yaml
  text: And he will take Zedekiah to Babylon, and there he will remain until I attend to him, declares the LORD. Though you fight against the Chaldeans, you will not succeed.
translation:
  language: de
  text: Babylon wird Zedekia nach Babylon bringen. Dort wird er bleiben, bis ich mich mit ihm befasse[a] – Spruch des HERRN. Auch wenn ihr gegen die Chaldäer kämpft[b], werdet ihr keinen Erfolg haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „bis ich ihn aufsuche“; der hebräische Ausdruck kann fürsorgliches oder richtendes Eingreifen meinen.'
    reason: Bewahrt die semantische und theologische Mehrdeutigkeit von פקד.
  - marker: b
    text: 'Oder: „Wenn ihr gegen die Chaldäer kämpft“.'
    reason: Macht die mögliche konditionale statt konzessive Auffassung von כי sichtbar.
lexical_decisions:
- source_word: יוֹלִךְ
  choice: wird … bringen
  rationale: Das Hifil von הלך bezeichnet hier das Hinbringen beziehungsweise Wegführen Zedekias nach Babylon; „bringen“ ist im Deutschen natürlich und lässt den Zwang aus dem Zusammenhang hervorgehen.
- source_word: פָּקְדִי אֹתוֹ
  choice: bis ich mich mit ihm befasse
  rationale: פקד kann je nach Zusammenhang fürsorgliches Eingreifen, Aufsuchen oder strafendes Einschreiten bezeichnen. Die Formulierung bewahrt diese Offenheit besser als eindeutig positive oder negative Wiedergaben.
- source_word: נְאֻם יְהוָה
  choice: Spruch des HERRN
  rationale: Die feste prophetische Formel wird würdig und idiomatisch wiedergegeben; der Gottesname wird entsprechend etablierter deutscher Bibelkonvention als HERR gesetzt.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Historisch und bibelsprachlich geläufige Bezeichnung für die babylonischen Gegner.
- source_word: לֹא תַצְלִיחוּ
  choice: werdet ihr keinen Erfolg haben
  rationale: Gibt das Hifil von צלח klar und in modernem Deutsch als Ausbleiben militärischen Erfolgs wieder.
theological_decisions:
- issue: Art des angekündigten göttlichen Eingreifens gegenüber Zedekia
  choice: bis ich mich mit ihm befasse
  alternative: bis ich ihn heimsuche / bis ich mich seiner annehme
  rationale: Der hebräische Ausdruck legt nicht ausdrücklich fest, ob Gottes Eingreifen zugunsten Zedekias oder als Gericht erfolgt. Die Übersetzung entscheidet diese Spannung nicht vorzeitig.
- issue: Verhältnis des letzten Satzes zur vorausgehenden Weissagung
  choice: Auch wenn ihr gegen die Chaldäer kämpft
  alternative: Wenn ihr gegen die Chaldäer kämpft / Denn ihr werdet gegen die Chaldäer kämpfen
  rationale: כי kann kontextabhängig verschieden verknüpfen. Die konzessive Wiedergabe betont wie die konsultierte Fassung, dass selbst weiterer Widerstand am angekündigten Ausgang nichts ändert, ohne daraus eine dogmatische Aussage abzuleiten.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem prophetischem Ton. Kurze Sätze vermeiden syntaktische Schwere; „Spruch des HERRN“ bewahrt die formelhafte Feierlichkeit. Die Fußnoten erläutern nur echte Quelltextmehrdeutigkeiten.
