source:
  edition: WLC
  text: וַ/תֹּצֵ֛א אֶת עַמְּ/ךָ֥ אֶת יִשְׂרָאֵ֖ל מֵ/אֶ֣רֶץ מִצְרָ֑יִם בְּ/אֹת֣וֹת וּ/בְ/מוֹפְתִ֗ים וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בְ/אֶזְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָ֖א גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/021.yaml
  text: And you brought your people Israel out of the land of Egypt with signs and wonders[a], with a strong hand and an outstretched arm, and with great terror.
translation:
  language: de
  text: Du hast dein Volk Israel aus dem Land Ägypten herausgeführt, mit Zeichen und Wundern, mit starker Hand und ausgestrecktem Arm und mit großem Schrecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit großer Ehrfurcht“. Das hebräische Wort kann Schrecken, Furcht oder Ehrfurcht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּצֵא
  choice: du hast … herausgeführt
  rationale: Der Hifil von יצא bedeutet hier, jemanden hinauszubringen. „Herausgeführt“ gibt den kausativen Sinn im Deutschen natürlich wieder und entspricht der geläufigen Exodus-Sprache.
- source_word: עַמְּךָ אֶת־יִשְׂרָאֵל
  choice: dein Volk Israel
  rationale: „Israel“ erläutert appositionell „dein Volk“; die direkte Anrede und die Zugehörigkeitsbezeichnung bleiben erhalten.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Die Formulierung wahrt das räumliche Herausführen und gibt אֶרֶץ ausdrücklich mit „Land“ wieder.
- source_word: בְּאֹתוֹת וּבְמוֹפְתִים
  choice: mit Zeichen und Wundern
  rationale: Die etablierte Wortverbindung gibt beide hebräischen Begriffe knapp wieder; ב wird instrumental mit „mit“ ausgedrückt.
- source_word: וּבְיָד חֲזָקָה
  choice: mit starker Hand
  rationale: Dies entspricht der konkreten Bildsprache des Hebräischen und ist im Deutschen verständlich und würdevoll.
- source_word: וּבְאֶזְרֹעַ נְטוּיָה
  choice: und ausgestrecktem Arm
  rationale: Die feste Exodus-Wendung wird bildlich und ohne erklärende Erweiterung bewahrt.
- source_word: וּבְמוֹרָא גָּדוֹל
  choice: und mit großem Schrecken
  rationale: מוֹרָא kann Schrecken, Furcht oder Ehrfurcht bezeichnen. „Großer Schrecken“ bringt hier vorrangig die furchterregende Wirkung des göttlichen Handelns zum Ausdruck, ohne die lexikalische Alternative zu verschweigen.
theological_decisions:
- issue: Deutung von וּבְמוֹרָא גָּדוֹל innerhalb der Exodus-Formel
  choice: und mit großem Schrecken
  alternative: und mit großer Ehrfurcht
  rationale: Der Zusammenhang beschreibt Gottes machtvolle Taten beim Auszug und deren furchterregenden Charakter. Da מוֹרָא zugleich ehrfürchtiges Erschauern bezeichnen kann, wird diese Spannung durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdevoller, knapper Satzführung. Die wiederholte instrumentale Konstruktion „mit …“ bewahrt den Rhythmus und die Struktur der hebräischen Exodus-Formel.
