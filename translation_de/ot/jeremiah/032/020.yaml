base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/020.yaml
  text: who set signs and wonders in the land of Egypt[a], and in Israel and among mankind to this day, and made a name for yourself, as it is this day.
translation:
  language: de
  text: der du im Land Ägypten Zeichen und Wunder getan hast und bis auf den heutigen Tag in Israel und unter den Menschen[a], und dir einen Namen gemacht hast, wie es heute noch ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort אָדָם ist hier ein Kollektivbegriff für die Menschheit; auch möglich: „unter der Menschheit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְתָּ אֹתוֹת וּמֹפְתִים
  choice: Zeichen und Wunder getan hast
  rationale: שׂוּם bedeutet grundsätzlich „setzen, stellen“, bildet mit „Zeichen und Wunder“ hier aber eine idiomatische Verbindung. „Zeichen und Wunder tun“ ist im Deutschen natürlich, würdevoll und gibt die bewirkten außergewöhnlichen Taten wieder, ohne sie enger als bloße „Wunderwerke“ zu bestimmen.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: im Land Ägypten
  rationale: Bewahrt das ausdrücklich stehende אֶרֶץ („Land“) und die geografische Konkretheit des Hebräischen.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag
  rationale: Eine geläufige, gehobene deutsche Entsprechung der hebräischen Zeitangabe; ihre Stellung lässt den fortdauernden Horizont der Zeichen und Wunder erkennen.
- source_word: וּבְיִשְׂרָאֵל וּבָאָדָם
  choice: auch in Israel und unter den Menschen
  rationale: ב wird bei Israel räumlich mit „in“, beim kollektiv gebrauchten אָדָם personenbezogen mit „unter“ wiedergegeben. „auch“ macht die koordinierende Fortführung im Deutschen klar.
- source_word: וַתַּעֲשֶׂה לְּךָ שֵׁם
  choice: und dir einen Namen gemacht hast
  rationale: Gibt die hebräische Wendung für den Erwerb von Ansehen nahezu formal und zugleich idiomatisch wieder.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie er heute besteht
  rationale: Bezieht das Vergleichselement natürlich auf „Namen“ und bringt dessen bis zur Gegenwart bestehendes Ansehen zum Ausdruck, ohne die Aussage theologisch auszudeuten.
theological_decisions:
- issue: Kollektive Bedeutung von אָדָם
  choice: unter den Menschen
  alternative: unter der Menschheit; unter den Männern; unter dem Menschen
  rationale: אָדָם bezeichnet hier die Menschen insgesamt, nicht einen einzelnen Mann. „Unter den Menschen“ ist geschlechtsübergreifend, konkret und im modernen Standarddeutsch natürlicher als „unter der Menschheit“.
- issue: Zeitlicher Bezug von עַד הַיּוֹם הַזֶּה
  choice: bis auf den heutigen Tag auch in Israel und unter den Menschen
  alternative: im Land Ägypten bis auf den heutigen Tag sowie in Israel und unter den Menschen
  rationale: Die hebräische Wortfolge erlaubt eine gewisse Spannung hinsichtlich der Reichweite der Zeitangabe. Die gewählte Fassung versteht sie als fortdauernden Horizont der göttlichen Zeichen in Israel und unter den Menschen, ohne durch eine Fußnote eine nicht zwingende theologische Festlegung vorzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers beginnt als Relativsatz in Fortsetzung des vorherigen Zusammenhangs. Die traditionelle Wortverbindung „Zeichen und Wunder“ bleibt erhalten; schwerfällige Archaismen werden vermieden.
