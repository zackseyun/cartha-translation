- from: 'Und nun, darum spricht Jahwe, der Gott Israels, über diese Stadt, von der ihr sagt: »Sie ist in die Hand des Königs von Babel gegeben durch Schwert, Hunger und Pest«:'
  to: 'Und nun, deshalb spricht Jahwe, der Gott Israels, so über diese Stadt, von der ihr sagt: »Sie ist durch das Schwert, durch Hunger und durch Pest in die Hand des Königs von Babel gegeben«:'
  rationale: Die Revision ergänzt „so“ als Entsprechung zu כֹּה und ordnet den Satz für modernes Standarddeutsch um. Die dreifache Präposition verdeutlicht, dass Schwert, Hunger und Pest die Mittel der Übergabe bezeichnen. Der resultative, ohne weitergehende zeitliche Festlegung gehaltene Ausdruck „ist … gegeben“ bleibt erhalten.
