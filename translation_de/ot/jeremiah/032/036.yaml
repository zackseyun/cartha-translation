source:
  edition: WLC
  text: וְ/עַתָּ֕ה לָ/כֵ֛ן כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אֶל הָ/עִ֨יר הַ/זֹּ֜את אֲשֶׁ֣ר אַתֶּ֣ם אֹמְרִ֗ים נִתְּנָה֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל בַּ/חֶ֖רֶב וּ/בָ/רָעָ֥ב וּ/בַ/דָּֽבֶר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/036.yaml
  text: 'Now therefore[a], thus says Yahweh, the God of Israel, concerning this city of which you say, ‘It has been given into the hand of the king of Babylon by the sword, by famine[b], and by pestilence’:'
translation:
  language: de
  text: 'Und nun, deshalb spricht Jahwe, der Gott Israels, so über diese Stadt, von der ihr sagt: »Sie ist durch das Schwert, durch Hunger und durch Pest in die Hand des Königs von Babel gegeben«:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Und nun, darum
  rationale: 'Beide Diskursmarker werden ausdrücklich wiedergegeben: וְעַתָּה leitet den neuen Abschnitt ein, לָכֵן stellt den Folgerungszusammenhang her.'
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Die im Deutschen etablierte, würdevolle Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die geläufige deutsche Form.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: über diese Stadt
  rationale: אֶל bezeichnet hier im Zusammenhang der Rede deren Gegenstand; »über« ist im modernen Deutschen natürlicher als das wörtliche »zu«.
- source_word: אֲשֶׁר אַתֶּם אֹמְרִים
  choice: von der ihr sagt
  rationale: Bewahrt die Relativkonstruktion und gibt die Aussage idiomatisch wieder.
- source_word: נִתְּנָה
  choice: sie ist ... gegeben
  rationale: Das Nifal Perfekt wird als resultatives Passiv wiedergegeben. Die Form kann kontextuell auch als bereits vollzogene Übergabe verstanden werden, doch die deutsche Perfektform bewahrt die knappe Aussage.
- source_word: בְּיַד מֶלֶךְ בָּבֶל
  choice: in die Hand des Königs von Babel
  rationale: Die transparente hebräische Herrschaftsmetapher wird beibehalten; »Babel« entspricht der geläufigen deutschen biblischen Namensform.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדָּבֶר
  choice: durch Schwert, Hunger und Pest
  rationale: Die dreigliedrige Gerichtsformel bleibt konkret und rhythmisch; die Präposition wird im Deutschen einmal gesetzt und auf alle drei Glieder bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen; die Transliteration wahrt diesen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Zeitlicher bzw. aspektueller Wert von נִתְּנָה
  choice: sie ist ... gegeben
  alternative: sie ist ... preisgegeben / sie wird ... gegeben
  rationale: Das Perfekt bezeichnet die Übergabe als feststehend beziehungsweise resultativ, ohne dass die Übersetzung ausdrücklich entscheiden muss, ob der Vorgang bereits vollständig abgeschlossen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter prophetischer Formel und biblisch verständlicher Bildsprache. Der Satz bleibt wegen des folgenden Verses mit einem Doppelpunkt offen.
