review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Diskursmarker, den Gottesnamen, den Bezug auf die Stadt, die Übergabe in die Gewalt des babylonischen Königs und die dreigliedrige Gerichtsformel grundsätzlich treffend wieder. Die Botenformel כֹּה אָמַר („so spricht“) ist jedoch im Übersetzungstext nicht vollständig vertreten.
  naturalness: „Und nun, darum spricht“ ist als Verbindung der beiden Diskursmarker mit der Botenformel im modernen Deutschen holprig. Eine Umstellung mit „Deshalb spricht … so über“ bewahrt alle Elemente und ist klarer.
  terminology: „Jahwe“, „der Gott Israels“, „Babel“ sowie „Schwert, Hunger und Pest“ sind angemessen. Die Wiederholung von „durch“ macht die Zuordnung der drei Gerichtsmittel eindeutig und bleibt im würdevollen Register natürlich.
  issues:
  - severity: medium
    issue: Die Formel כֹּה אָמַר wird im deutschen Übersetzungstext ausgelassen.
    rationale: Der Entwurf bietet „darum spricht Jahwe“, was לָכֵן und אָמַר abdeckt, aber das demonstrative כֹּה („so/folgendermaßen“) nicht ausdrückt. Die lexikalische Entscheidung nennt zwar „so spricht“, doch dies steht nicht im Text.
  - severity: low
    issue: Die Abfolge „Und nun, darum spricht“ klingt im Deutschen unidiomatisch.
    rationale: Die beiden hebräischen Diskursmarker können beibehalten werden, sollten aber so gestellt werden, dass die prophetische Redeformel verständlich bleibt.
