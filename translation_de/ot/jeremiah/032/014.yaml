  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל לָק֣וֹחַ אֶת הַ/סְּפָרִ֣ים הָ/אֵ֡לֶּה אֵ֣ת סֵפֶר֩ הַ/מִּקְנָ֨ה הַ/זֶּ֜ה וְ/אֵ֣ת הֶ/חָת֗וּם וְ/אֵ֨ת סֵ֤פֶר הַ/גָּלוּי֙ הַ/זֶּ֔ה וּ/נְתַתָּ֖/ם בִּ/כְלִי חָ֑רֶשׂ לְמַ֥עַן יַעַמְד֖וּ יָמִ֥ים רַבִּֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/014.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Take these documents, this deed of purchase, both the sealed copy and this open copy, and put them in an earthenware vessel[b], so that they may last for many days.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen, der Gott Israels: Nimm diese Schriftstücke[a] – diesen Kaufvertrag, die versiegelte Ausfertigung und diese offene Ausfertigung[b] – und lege sie in ein Tongefäß, damit sie lange erhalten bleiben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Schriftrollen“. Das hebräische Wort kann allgemein Schriftstücke bezeichnen; hier handelt es sich um Unterlagen eines Rechtsgeschäfts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „diese unversiegelte Ausfertigung“. Das Hebräische stellt sie der versiegelten Ausfertigung gegenüber.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Herr der Heerscharen“ ist die im Deutschen verständliche und etablierte Wiedergabe des Titels und bezeichnet Gottes Herrschaft über die himmlischen und irdischen Mächte.
- source_word: לָקוֹחַ
  choice: Nimm
  rationale: Der absolute Infinitiv hat hier im Zusammenhang einer direkten Anweisung imperativische Funktion.
- source_word: הַסְּפָרִים הָאֵלֶּה
  choice: diese Schriftstücke
  rationale: סְפָרִים bezeichnet hier mehrere schriftliche Unterlagen eines Rechtsgeschäfts. „Schriftstücke“ wahrt die Breite des Ausdrucks besser als das engere „Urkunden“ oder das materialbezogene „Schriftrollen“.
- source_word: סֵפֶר הַמִּקְנָה
  choice: diesen Kaufvertrag
  rationale: Gemeint ist die Urkunde über den Grundstückskauf; „Kaufvertrag“ vermittelt ihre rechtliche Funktion in natürlichem modernem Deutsch.
- source_word: הֶחָתוּם
  choice: die versiegelte Ausfertigung
  rationale: Das substantivierte Adjektiv verweist auf die versiegelte Form der Kaufurkunde. „Ausfertigung“ verdeutlicht diese Beziehung, ohne einen eigenständigen Gegenstand hinzuzufügen.
- source_word: סֵפֶר הַגָּלוּי
  choice: diese offene Ausfertigung
  rationale: גָּלוּי steht im Gegensatz zu „versiegelt“ und bezeichnet die offen zugängliche beziehungsweise unversiegelte Form der Urkunde.
- source_word: בִּכְלִי חָרֶשׂ
  choice: in ein Tongefäß
  rationale: Der Ausdruck bezeichnet ein Gefäß aus gebranntem Ton, ohne dessen genaue Form festzulegen.
- source_word: לְמַעַן יַעַמְדוּ יָמִים רַבִּים
  choice: damit sie lange erhalten bleiben
  rationale: Das wörtliche „viele Tage bestehen“ meint hier die dauerhafte Aufbewahrung der Schriftstücke; die gewählte Formulierung gibt diesen Sinn idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Titels צְבָאוֹת
  choice: Herr der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ lässt den umfassenden, nicht ausschließlich irdisch-militärischen Bezug des traditionellen Gottestitels offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche machen deutlich, dass die folgenden Ausfertigungen die genannten Schriftstücke näher bestimmen. Die juristische Sprache bleibt verständlich; „Tongefäß“ vermeidet eine unbelegte Festlegung auf die Form eines Kruges.
