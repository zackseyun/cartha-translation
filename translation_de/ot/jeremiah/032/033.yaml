  text: וַ/יִּפְנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וְ/לַמֵּ֤ד אֹתָ/ם֙ הַשְׁכֵּ֣ם וְ/לַמֵּ֔ד וְ/אֵינָ֥/ם שֹׁמְעִ֖ים לָ/קַ֥חַת מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/032/033.yaml
  text: They turned their back to me and not their face[a]; though I taught them, rising early and teaching[b], they would not listen to receive correction.
translation:
  language: de
  text: Sie wandten mir den Rücken zu, nicht das Gesicht. Obwohl ich sie immer wieder lehrte,[a] hörten sie nicht und nahmen keine Zurechtweisung an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „früh aufstehend und lehrend“; eine hebräische Wendung für beharrliches, eifriges und wiederholtes Lehren.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „keine Zurechtweisung annehmen“. Das hebräische Wort kann Zurechtweisung, Erziehung oder Unterweisung bezeichnen, besonders eine Unterweisung, die Fehlverhalten korrigiert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: Sie kehrten mir den Rücken zu und nicht das Gesicht
  rationale: Die deutsche Wendung bewahrt den scharfen bildlichen Gegensatz zwischen Rücken und Gesicht sowie die Beziehungsrichtung zu Gott. Der Singular „das Gesicht“ hat wie im Hebräischen distributive Bedeutung.
- source_word: וְלַמֵּד אֹתָם הַשְׁכֵּם וְלַמֵּד
  choice: Obwohl ich sie immer wieder eindringlich lehrte
  rationale: Die im Jeremiabuch häufige Verbindung mit „früh aufstehen“ bezeichnet beharrliches, eifriges und wiederholtes Handeln. Eine funktionale Wiedergabe ist im modernen Deutschen natürlicher als die missverständliche wörtliche Formulierung „früh aufstehend und lehrend“; die Bildform wird in der Fußnote genannt.
- source_word: וְאֵינָם שֹׁמְעִים
  choice: hörten sie nicht
  rationale: שמע bezeichnet hier nicht bloß akustisches Hören, sondern die fortdauernde Weigerung, auf Gottes Lehre einzugehen. Im Zusammenhang bringt „hörten sie nicht“ dies knapp und natürlich zum Ausdruck.
- source_word: לָקַחַת מוּסָר
  choice: ließen sich nicht zurechtweisen
  rationale: Die idiomatische deutsche Formulierung gibt das Annehmen von מוּסָר wieder und bewahrt dessen Sinn von korrigierender, erzieherischer Weisung, ohne ihn auf Bestrafung zu verengen.
theological_decisions:
- issue: Bedeutungsumfang von מוּסָר
  choice: sich zurechtweisen lassen
  alternative: Zurechtweisung annehmen; Erziehung annehmen
  rationale: Der Ausdruck umfasst korrigierende Unterweisung und erzieherische Disziplin. Die gewählte Form wahrt den Zusammenhang prophetischer Mahnung, ohne ausschließlich strafende oder rein intellektuelle Belehrung anzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bewahrt bewusst das markante hebräische Bild; die idiomatische Wendung vom frühen Aufstehen wird für heutige Leser funktional wiedergegeben und in einer Fußnote offengelegt.
