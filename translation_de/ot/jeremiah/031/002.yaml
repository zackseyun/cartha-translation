  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה מָצָ֥א חֵן֙ בַּ/מִּדְבָּ֔ר עַ֖ם שְׂרִ֣ידֵי חָ֑רֶב הָל֥וֹךְ לְ/הַרְגִּיע֖/וֹ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/002.yaml
  text: 'Thus says Yahweh: The people who survived the sword found favor in the wilderness; Israel[a], when it went to find rest for him.'
translation:
  language: de
  text: 'So spricht Jahwe: Das Volk, das dem Schwert entronnen war, fand Gunst in der Wildnis – Israel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut des Schlussteils ist schwierig. Wörtlich etwa: »gehend, um ihm Ruhe zu verschaffen, Israel«. Möglich ist auch: »als er ging, um Israel Ruhe zu verschaffen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als in modernem Deutsch geläufige Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: מָצָא חֵן
  choice: fand Gunst
  rationale: Bewahrt die hebräische Wendung für das Erlangen von Wohlwollen, ohne sie unnötig theologisch einzuengen.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר bezeichnet häufig unbewohntes Weide- oder Steppenland und nicht ausschließlich eine Sandwüste; zugleich bleibt der Anklang an den Exodus erhalten.
- source_word: עַם שְׂרִידֵי חָרֶב
  choice: das Volk, das dem Schwert entronnen war
  rationale: Gibt die wörtliche Vorstellung vom Volk als den Überlebenden des Schwertes in natürlichem Deutsch wieder und erhält das Bild kriegerischer Vernichtung.
- source_word: הָלוֹךְ
  choice: als es sich aufmachte
  rationale: Gibt die Bewegung des adverbial beziehungsweise verbal gebrauchten Infinitivus absolutus wieder, ohne eine präzise syntaktische Funktion vorzutäuschen.
- source_word: לְהַרְגִּיעוֹ
  choice: ihm Ruhe zu verschaffen
  rationale: Entspricht der kausativen Bedeutung des Hifil von רגע und bildet das maskuline Singularsuffix ausdrücklich mit »ihm« ab; die schwer bestimmbare Beziehung des Pronomens bleibt bestehen.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Der Volksname wird in seiner üblichen deutschen Form wiedergegeben und appositionell auf »das Volk« bezogen.
theological_decisions:
- issue: Bezug und Syntax von הָלוֹךְ לְהַרְגִּיעוֹ יִשְׂרָאֵל
  choice: »Israel, als es sich aufmachte, ihm Ruhe zu verschaffen«
  alternative: '»als er ging, um Israel Ruhe zu verschaffen«; auch möglich: »als Israel auszog, um Ruhe zu finden«'
  rationale: 'Der hebräische Schluss ist syntaktisch stark verdichtet: Unklar sind das Subjekt der Bewegung, der Bezug des maskulinen Suffixes und die Funktion des nachgestellten »Israel«. Der Haupttext lässt Israel als Apposition zu »Volk« und als Subjekt der Bewegung erkennen, bewahrt aber mit »ihm« die auffällige Pronominalform. Die Fußnote nennt eine wichtige alternative Zuordnung, statt die Spannung stillschweigend aufzulösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet die appositionelle Wiederaufnahme durch »Israel« ab. Die etwas ungewöhnliche Formulierung des Schlussteils ist bewusst beibehalten, weil auch der hebräische Text syntaktisch mehrdeutig ist.
