source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה רָנּ֤וּ לְ/יַֽעֲקֹב֙ שִׂמְחָ֔ה וְ/צַהֲל֖וּ בְּ/רֹ֣אשׁ הַ/גּוֹיִ֑ם הַשְׁמִ֤יעוּ הַֽלְלוּ֙ וְ/אִמְר֔וּ הוֹשַׁ֤ע יְהוָה֙ אֶֽת עַמְּ/ךָ֔ אֵ֖ת שְׁאֵרִ֥ית יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/007.yaml
  text: 'For thus says Yahweh: Sing aloud with gladness for Jacob[a], and shout at the head of the nations; proclaim, praise, and say, “Save, Yahweh, your people, the remnant of Israel.”'
translation:
  language: de
  text: 'Denn so spricht Jahwe:

    „Jubelt voller Freude über Jakob

    und jauchzt an der Spitze der Völker![a]

    Verkündet, lobt und sagt:

    ›Rette, Jahwe, dein Volk,

    den Rest Israels!‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor den Völkern“; möglicherweise auch: „über das vornehmste der Völker“. Die hebräische Wendung kann Israels Vorrang unter den Völkern oder den öffentlichen Rahmen des Jubelrufs hervorheben.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: רָנּוּ לְיַעֲקֹב שִׂמְחָה
  choice: Jubelt voller Freude über Jakob
  rationale: רנן bezeichnet hier einen lauten Freudenruf; ל wird angesichts der angekündigten Wiederherstellung relational als „über“ verstanden, während שִׂמְחָה die freudige Art des Jubelns angibt.
- source_word: וְצַהֲלוּ
  choice: und jauchzt
  rationale: Das Verb verstärkt den öffentlichen, freudigen Ruf und wird im Deutschen treffend mit „jauchzen“ wiedergegeben.
- source_word: בְּרֹאשׁ הַגּוֹיִם
  choice: an der Spitze der Völker
  rationale: Die formnahe Wiedergabe bewahrt die schwierige räumliche beziehungsweise rangbezogene Wendung, ohne ihre Bedeutung im Haupttext eindeutig festzulegen.
- source_word: הַשְׁמִיעוּ
  choice: Verkündet
  rationale: Der Hifil-Imperativ fordert dazu auf, die Botschaft öffentlich hörbar zu machen; „verkündet“ ist dafür natürlich und prägnant.
- source_word: הַלְלוּ
  choice: lobt
  rationale: Der Imperativ von הלל bezeichnet hier das ausdrückliche Loben oder Preisen.
- source_word: הוֹשַׁע
  choice: Rette
  rationale: Der an Jahwe gerichtete Hifil-Imperativ bittet unmittelbar um Rettung.
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: den Rest Israels
  rationale: „Rest“ ist die natürliche deutsche Wiedergabe des prophetisch bedeutsamen Begriffs für den übrig gebliebenen beziehungsweise bewahrten Teil Israels.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den persönlichen Gottesnamen; die Transliteration bewahrt diesen Unterschied gegenüber einem bloßen Titel.
- issue: Deutung von בְּרֹאשׁ הַגּוֹיִם
  choice: an der Spitze der Völker
  alternative: vor den Völkern / über das vornehmste der Völker
  rationale: Die knappe hebräische Wendung kann Rang, Ort oder den öffentlichen Rahmen des Rufes bezeichnen. Die formnahe Haupttextfassung lässt diese Spannung bestehen; die Fußnote nennt die wichtigsten anderen Verständnismöglichkeiten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit poetischer Zeilengliederung. Die parallelen Aufforderungen und der Wechsel zur direkten Bitte bleiben erhalten; die schwer deutbare Wendung בְּרֹאשׁ הַגּוֹיִם wird im Haupttext formnah und in der Fußnote transparent wiedergegeben.
