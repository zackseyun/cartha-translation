base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/018.yaml
  text: 'I have surely heard Ephraim grieving: ‘You disciplined me[a], and I was disciplined, like an untrained calf. Restore me, and I will return[b], for you are Yahweh my God.’'
translation:
  language: de
  text: 'Ich habe sehr wohl gehört, wie Ephraim klagt: »Du hast mich zurechtgewiesen, und ich wurde zurechtgewiesen[a] wie ein untrainiertes Kalb. Bring mich zurück, dann kehre ich zurück[b], denn du bist Jahwe, mein Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ich ließ mich zurechtweisen«. Die hebräische Verbform kann auch eine mediale Nuance haben.'
    reason: Sie dokumentiert die mögliche mediale Deutung, ohne die naheliegende passive Hauptlesart zu verdrängen.
  - marker: b
    text: 'Wörtlicher: »Wende mich um, damit ich umkehre.« Im Hebräischen steht in beiden Satzteilen dasselbe Verb für »umkehren/zurückkehren«; die erste Form ist kausativ.'
    reason: Sie wahrt die Verbwiederholung und erklärt die unterschiedliche Verbform korrekt.
lexical_decisions:
- source_word: שָׁמוֹעַ שָׁמַעְתִּי
  choice: Ich habe … deutlich … hören
  rationale: Der Infinitivus absolutus verstärkt die finite Verbform. „deutlich“ gibt diese Bekräftigung in natürlichem Deutsch wieder.
- source_word: אֶפְרַיִם מִתְנוֹדֵד
  choice: Ephraim … klagen
  rationale: Das Hitpolel-Partizip bezeichnet hier im Zusammenhang hörbare Selbstklage. „klagen“ ist gegenwärtig und würdevoll, ohne die mögliche reflexive Nuance unnötig zu überzeichnen.
- source_word: יִסַּרְתַּנִי וָאִוָּסֵר
  choice: Du hast mich zurechtgewiesen, und ich ließ mich zurechtweisen
  rationale: Die Wiederholung von יסר bleibt erhalten. Die zweite Form kann passiv oder medial verstanden werden; „ließ mich zurechtweisen“ wahrt den Bezug zur erfahrenen Zucht und klingt im Deutschen natürlicher als eine rein passive Wiederholung.
- source_word: כְּעֵגֶל לֹא לֻמָּד
  choice: wie ein ungezähmtes Kalb
  rationale: Wörtlich ist das Kalb „nicht abgerichtet/gelehrt“. „ungezähmt“ bewahrt das landwirtschaftliche Bild und bezeichnet seine fehlende Gewöhnung an Führung oder Joch.
- source_word: הֲשִׁיבֵנִי וְאָשׁוּבָה
  choice: Bring mich zurück, dann kehre ich zurück
  rationale: Die kausative und die einfache Form desselben Verbs שוב werden durch „zurückbringen/zurückkehren“ sichtbar miteinander verbunden. „dann“ drückt die resultative Beziehung des Kohortativs natürlich aus.
- source_word: כִּי אַתָּה יְהוָה אֱלֹהָי
  choice: denn du bist Jahwe, mein Gott
  rationale: כִּי begründet die Bitte. Der Gottesname wird als „Jahwe“ wiedergegeben; die Apposition „mein Gott“ folgt der hebräischen Aussage unmittelbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Verhältnis von göttlichem Zurückbringen und menschlicher Umkehr
  choice: Bring mich zurück, dann kehre ich zurück
  alternative: Stelle mich wieder her, und ich werde zurückkehren
  rationale: 'Die Wiederholung von שוב bewahrt die Spannung: Ephraim bittet Gott, die Umkehr zu bewirken, und spricht zugleich von seinem eigenen Zurückkehren. Die Formulierung löst dieses Verhältnis nicht dogmatisch auf.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die Wiederholungen des Hebräischen werden soweit möglich bewahrt. „Jahwe“ folgt der vorgegebenen Wiedergabe des Gottesnamens.
