  variant: modern standard German
source:
  edition: WLC
  text: וְ/כָל הָ/עֵ֣מֶק הַ/פְּגָרִ֣ים וְ/הַ/דֶּ֡שֶׁן וְ/כָֽל ה/שרמות עַד נַ֨חַל קִדְר֜וֹן עַד פִּנַּ֨ת שַׁ֤עַר הַ/סּוּסִים֙ מִזְרָ֔חָ/ה קֹ֖דֶשׁ לַֽ/יהוָ֑ה לֹֽא יִנָּתֵ֧שׁ וְֽ/לֹא יֵהָרֵ֛ס ע֖וֹד לְ/עוֹלָֽם־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/040.yaml
  text: And the whole valley of the corpses and the ashes[a], and all the terraces as far as the Kidron Valley, as far as the corner of the Horse Gate toward the east, shall be holy to Yahweh[c][b]. It shall not be uprooted or overthrown again forever.
translation:
  language: de
  text: Und das ganze Tal der Leichen und der Asche sowie alle Terrassen[a] bis zum Kidrontal[b], bis zur Ecke des Rosstores nach Osten hin, sollen Jahwe heilig sein. Es wird nie wieder entwurzelt oder niedergerissen werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Felder“ beziehungsweise „Hänge“. Das zugrunde liegende hebräische Wort ist schwierig und wird traditionell auf die terrassierten Flächen um Jerusalem bezogen.
    reason: lexical_alternative
  - marker: b
    text: Auch „bis zum Kidronbach“. Das hebräische Wort kann sowohl ein Wadi oder saisonales Fließgewässer als auch dessen Tal bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Es wird nie wieder ausgerissen oder niedergerissen werden.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵמֶק
  choice: das Tal
  rationale: עֵמֶק bezeichnet gewöhnlich ein Tal oder tiefer gelegenes Gelände; „Tal“ ist in dieser topografischen Grenzbeschreibung klar und natürlich.
- source_word: הַפְּגָרִים
  choice: der Leichen
  rationale: פֶּגֶר bezeichnet einen Leichnam oder toten Körper. „Leichen“ bewahrt die drastische Vorstellung eines vormals verunreinigten Ortes.
- source_word: הַדֶּשֶׁן
  choice: der Asche
  rationale: דֶּשֶׁן kann Fett oder fetthaltige Asche bezeichnen; hier liegt wegen des kultischen beziehungsweise abfallbezogenen Zusammenhangs „Asche“ nahe.
- source_word: השרמות
  choice: Terrassen
  rationale: Die überlieferte Form ist schwierig. „Terrassen“ gibt die wahrscheinlich gemeinten terrassierten Flächen an den Hängen Jerusalems wieder, ohne sie ausdrücklich als Äcker festzulegen.
- source_word: נַחַל קִדְרוֹן
  choice: Kidrontal
  rationale: נַחַל kann ein Wadi, dessen zeitweiliges Bachbett oder das zugehörige Tal meinen. „Kidrontal“ passt natürlich zur Grenzbeschreibung; die sachlich mögliche Wiedergabe „Kidronbach“ wird in der Fußnote genannt.
- source_word: פִּנַּת שַׁעַר הַסּוּסִים
  choice: Ecke des Rosstores
  rationale: פִּנָּה bezeichnet eine Ecke oder einen Winkel. „Rosstor“ ist die geläufige, knappe deutsche Bezeichnung für das Pferdetor.
- source_word: מִזְרָחָה
  choice: im Osten
  rationale: Die Richtungsform bezeichnet die östliche Lage beziehungsweise Ausrichtung. Im Deutschen ist „im Osten“ in dieser Grenzangabe idiomatisch.
- source_word: קֹדֶשׁ לַיהוָה
  choice: werden Jahwe heilig sein
  rationale: Die Wendung bezeichnet Heiligkeit und Zugehörigkeit zu Jahwe. Das Futur ergibt sich aus dem prophetischen Zusammenhang; der ganze zuvor beschriebene Bereich bleibt im Geltungsbereich der Aussage.
- source_word: לֹא יִנָּתֵשׁ
  choice: wird nie wieder ausgerissen
  rationale: נתשׁ bedeutet im Nifal „ausgerissen/entwurzelt werden“ und greift Jeremias wiederkehrende Bildsprache von Gericht und Wiederherstellung auf.
- source_word: וְלֹא יֵהָרֵס
  choice: oder niedergerissen werden
  rationale: הרס im Nifal bedeutet „niedergerissen“ oder „zerstört werden“. „Niedergerissen“ wahrt das konkrete Bau- und Stadtbild.
- source_word: עוֹד לְעוֹלָם
  choice: nie wieder
  rationale: In Verbindung mit der Verneinung drückt die Wortgruppe dauerhafte Endgültigkeit aus. „Nie wieder“ ist im Deutschen natürlich und umfasst sowohl das erneute Geschehen als auch seine dauerhafte Ausschließung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den Bundesnamen im modernen Standarddeutsch direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang der Heiligung
  choice: Der gesamte beschriebene Bereich wird Jahwe heilig sein
  alternative: Nur die eigentliche wiederaufgebaute Stadt ist heilig, während die Randgebiete lediglich die Grenze markieren
  rationale: Das Prädikat קֹדֶשׁ לַיהוָה folgt auf die gesamte Aufzählung. Die Übersetzung belässt daher alle genannten, vormals verunreinigten Gebiete im Umfang der Heiligkeitsaussage.
- issue: Bezug der singularischen Schlussverben
  choice: Dieses ganze Gebiet
  alternative: die Stadt
  rationale: Die hebräischen Verben stehen im Singular und beziehen die aufgezählten Orte als zusammengehörige Größe ein. „Dieses ganze Gebiet“ macht diesen kollektiven Bezug im Deutschen verständlich, ohne den Referenten auf die Stadt im engeren Sinn zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die topografische Aufzählung bleibt erhalten; ein neuer Satz mit „Dieses ganze Gebiet“ vermeidet einen missverständlichen Numeruswechsel und bildet den kollektiven Singular des Hebräischen verständlich ab. Die Wiederholung „bis … bis“ bewahrt die Struktur des Ausgangstextes.
