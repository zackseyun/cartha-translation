  text: וְ/יָצָ֨א ע֜וֹד קוה הַ/מִּדָּה֙ נֶגְדּ֔/וֹ עַ֖ל גִּבְעַ֣ת גָּרֵ֑ב וְ/נָסַ֖ב גֹּעָֽתָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/039.yaml
  text: And the measuring line will go out farther[a], straight ahead to the hill of Gareb[b], and then it will turn toward Goah.
translation:
  language: de
  text: Und die Messschnur wird noch weiter geradeaus[b] bis zum Hügel Gareb verlaufen[a]; dann wird sie in Richtung Goah abbiegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wieder“. Das hebräische עוֹד kann „wieder“ oder „noch weiter“ bedeuten; im Zusammenhang der erweiterten Grenze liegt hier die räumliche Bedeutung nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vor ihm/ihr“ oder „ihm/ihr gegenüber“. Worauf sich das hebräische Suffix in נֶגְדּוֹ bezieht, ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: wird … verlaufen
  rationale: Das Qal-Perfekt mit וְ steht im prophetischen Zukunftszusammenhang. „Verlaufen“ gibt in einer Grenzbeschreibung die räumliche Ausdehnung der Messschnur natürlich wieder.
- source_word: עוֹד
  choice: noch weiter
  rationale: Im Zusammenhang der erweiterten Stadtgrenze bezeichnet עוֹד wahrscheinlich eine zusätzliche räumliche Erstreckung; die mögliche Bedeutung „wieder“ bleibt in der Fußnote erhalten.
- source_word: קוה הַמִּדָּה
  choice: die Messschnur
  rationale: Die Verbindung bezeichnet eine zum Vermessen benutzte Schnur; „Messschnur“ bewahrt das konkrete Bild und ist im Deutschen verständlich.
- source_word: נֶגְדּוֹ
  choice: geradeaus
  rationale: Das Wort bedeutet wörtlich „vor ihm/ihr“ oder „ihm/ihr gegenüber“. In der Grenzbeschreibung gibt „geradeaus“ die wahrscheinlich gemeinte Richtung idiomatisch wieder, ohne den unklaren Bezug des Suffixes im Haupttext zu erzwingen.
- source_word: עַל
  choice: bis zu
  rationale: Bei der räumlichen Erstreckung zu einem topografischen Ziel ist „bis zu“ im Deutschen natürlicher als das wörtlichere „auf/über“.
- source_word: גִּבְעַת גָּרֵב
  choice: zum Hügel Gareb
  rationale: גִּבְעַת ist die Konstruktform von „Hügel“, gefolgt vom als Eigennamen beibehaltenen Gareb.
- source_word: וְנָסַב
  choice: dann wird sie … abbiegen
  rationale: Das Verb kann „sich wenden“, „herumgehen“ oder „abbiegen“ bedeuten. „Abbiegen“ passt präzise und natürlich zu einem beschriebenen Grenzverlauf.
- source_word: גֹּעָתָה
  choice: in Richtung Goa
  rationale: Der Ortsname trägt die hebräische Richtungsendung; „in Richtung Goa“ bildet diese Zielrichtung ausdrücklich ab.
