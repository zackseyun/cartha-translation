  - severity: low
    issue: „Reigen“ ist für die Zielvariante weniger geläufig als „Tanz“.
    rationale: „Tanz“ ist modernes Standarddeutsch und deckt מָחוֹל zuverlässig ab; die Bildlichkeit bleibt erhalten.
