revisions:
- from: Dann freut sich die junge Frau beim Reigen[a], junge und alte Männer miteinander. Ich verwandle ihre Trauer in Freude, tröste sie und schenke ihnen Freude nach ihrem Kummer.
  to: Dann wird sich die junge Frau beim Tanz freuen, ebenso die jungen und die alten Männer miteinander. Ich werde ihre Trauer in Freude verwandeln, sie trösten und sie über ihren Kummer hinweg froh machen.[a]
  rationale: Die Revision stellt die zukunftsbezogene Aussageform wieder her, ersetzt das weniger moderne „Reigen“ durch „Tanz“ und gibt die abschließende kausative Aussage mit ihrer Bewegung weg vom Kummer genauer wieder. Die koordinierte Aufzählung wird im Deutschen mit „ebenso“ verständlich gemacht, ohne den hebräischen Generationenkontrast zu verändern.
