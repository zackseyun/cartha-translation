source:
  edition: WLC
  text: אָ֣ז תִּשְׂמַ֤ח בְּתוּלָה֙ בְּ/מָח֔וֹל וּ/בַחֻרִ֥ים וּ/זְקֵנִ֖ים יַחְדָּ֑ו וְ/הָפַכְתִּ֨י אֶבְלָ֤/ם לְ/שָׂשׂוֹן֙ וְ/נִ֣חַמְתִּ֔י/ם וְ/שִׂמַּחְתִּ֖י/ם מִ/יגוֹנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/013.yaml
  text: Then the virgin will rejoice in the dance[a], and young men and old men together; and I will turn their mourning into gladness[c][b], and I will comfort them and make them rejoice from their sorrow.
translation:
  language: de
  text: Dann wird sich die junge Frau beim Tanz freuen, ebenso die jungen und die alten Männer miteinander. Ich werde ihre Trauer in Freude verwandeln, sie trösten und sie über ihren Kummer hinweg froh machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie nach ihrem Kummer erfreuen“. Hebräisch: „und ich werde sie froh machen aus/weg von ihrem Kummer“. „Die junge Frau“ kann stellvertretend für die jungen Frauen der Gemeinschaft stehen; als engere lexikalische Wiedergabe ist auch „die Jungfrau“ möglich.'
    reason: Dokumentiert die repräsentative Verwendung des Singulars bei בְּתוּלָה sowie die im Deutschen nicht völlig eindeutige Beziehung von מִן zu „Kummer“.
lexical_decisions:
- source_word: אָז
  choice: Dann
  rationale: Das Zeitadverb verbindet die Aussage knapp und natürlich mit den vorausgehenden Verheißungen der Wiederherstellung.
- source_word: תִּשְׂמַח
  choice: freut sich
  rationale: Das hebräische Imperfekt bezeichnet hier das künftige Ergebnis der Wiederherstellung; im Deutschen kann das Präsens in prophetischer Zukunftsaussage natürlich wirken.
- source_word: בְּתוּלָה
  choice: die junge Frau
  rationale: Das Substantiv kann eine Jungfrau beziehungsweise unverheiratete junge Frau bezeichnen. Im Festbild steht der Singular wahrscheinlich stellvertretend für die jungen Frauen der Gemeinschaft; ‚junge Frau‘ ist im heutigen Deutsch natürlich und vermeidet eine im Kontext unnötige Hervorhebung sexueller Unerfahrenheit.
- source_word: בְּמָחוֹל
  choice: beim Reigen
  rationale: מָחוֹל bezeichnet einen festlichen Tanz, häufig einen Reigen. Die Wendung bewahrt das konkrete Gemeinschaftsbild.
- source_word: וּבַחֻרִים וּזְקֵנִים יַחְדָּו
  choice: junge und alte Männer miteinander
  rationale: Der Gegensatz hebt Lebensalter hervor. ‚Alte Männer‘ ist daher wahrscheinlicher als die mögliche Amtsbezeichnung ‚Älteste‘; ‚miteinander‘ gibt יַחְדָּו wieder.
- source_word: וְהָפַכְתִּי אֶבְלָם לְשָׂשׂוֹן
  choice: Ich verwandle ihre Trauer in Freude
  rationale: הפך bezeichnet den Wechsel von einem Zustand in einen anderen; ‚verwandeln‘ ist im Deutschen idiomatisch. אֵבֶל ist Trauer beziehungsweise Trauerklage, שָׂשׂוֹן jubelnde Freude.
- source_word: וְנִחַמְתִּים
  choice: tröste sie
  rationale: Der Piel von נחם bezeichnet hier Gottes tröstendes Handeln nach Leid und Verlust.
- source_word: וְשִׂמַּחְתִּים מִיגוֹנָם
  choice: schenke ihnen Freude nach ihrem Kummer
  rationale: 'Der Piel von שׂמח ist kausativ: Gott macht sie froh. מִן kann hier den Ausgangspunkt beziehungsweise die Ablösung des Kummers bezeichnen; ‚nach ihrem Kummer‘ ergibt natürliches Deutsch, ohne eine räumliche Vorstellung zu erzwingen.'
theological_decisions:
- issue: Repräsentativer Singular בְּתוּלָה
  choice: Der Singular bleibt als ‚die junge Frau‘ erhalten und wird repräsentativ verstanden.
  alternative: 'Idiomaticher Plural: ‚die jungen Frauen‘; enger lexikalisch: ‚die Jungfrau‘.'
  rationale: Der hebräische Singular gehört zur poetischen Gestaltung und kann ein typisches Mitglied der wiederhergestellten Gemeinschaft vertreten. ‚Junge Frau‘ bewahrt Singular und Personenbezug, ohne mehr über ihren sexuellen Status auszusagen, als die Szene verlangt.
- issue: Bedeutung von זְקֵנִים
  choice: Altersbezeichnung ‚alte Männer‘
  alternative: Soziale oder amtliche Bezeichnung ‚Älteste‘
  rationale: Die unmittelbare Gegenüberstellung mit den jungen Männern spricht für einen Generationenkontrast und nicht vorrangig für ein Leitungsamt.
- issue: Verhältnis von Trost, Freude und Kummer
  choice: Die drei Aussagen werden als eng verbundene, aber eigenständige Handlungen Gottes wiedergegeben.
  alternative: Die letzten beiden Verben zu einer einzigen freien Aussage zusammenziehen.
  rationale: 'Die getrennte Wiedergabe wahrt die hebräische Folge: Gott verwandelt Trauer, tröstet die Betroffenen und macht sie froh.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einem leicht poetischen Ton. ‚Reigen‘ erhält das konkrete festliche Bild, ist aber durch die Fußnote mit dem geläufigeren ‚Tanz‘ abgesichert. Die zweite Satzhälfte vermeidet schwerfällige Wiederholungen, bewahrt jedoch die drei göttlichen Handlungen.
