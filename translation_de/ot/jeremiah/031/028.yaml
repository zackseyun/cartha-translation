id: JER.31.28
reference: Jeremiah 31:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֞ה כַּ/אֲשֶׁ֧ר שָׁקַ֣דְתִּי עֲלֵי/הֶ֗ם לִ/נְת֧וֹשׁ וְ/לִ/נְת֛וֹץ וְ/לַ/הֲרֹ֖ס וּ/לְ/הַאֲבִ֣יד וּ/לְ/הָרֵ֑עַ כֵּ֣ן אֶשְׁקֹ֧ד עֲלֵי/הֶ֛ם לִ/בְנ֥וֹת וְ/לִ/נְט֖וֹעַ נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/028.yaml
  text: And it shall be that[a], just as I watched over them to uproot and to tear down and to overthrow and to destroy and to bring harm, so I will watch over them to build and to plant, declares Yahweh.
translation:
  language: de
  text: 'Und es wird geschehen: Wie ich über sie gewacht habe, um auszureißen und niederzureißen, um einzureißen und zu vernichten und Unheil zu bringen[a], so werde ich über sie wachen, um aufzubauen und zu pflanzen – Ausspruch Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Schaden zuzufügen. Das hebräische Verb kann im Zusammenhang des Gerichts das Verursachen von Unheil oder Schaden bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die zukunftsgerichtete prophetische Übergangsformel in würdigem, verständlichem Deutsch.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Wie ... so
  rationale: Gibt die ausdrückliche Entsprechung zwischen vergangenem Gericht und künftiger Wiederherstellung knapp und parallel wieder.
- source_word: שָׁקַדְתִּי / אֶשְׁקֹד
  choice: über sie gewacht habe / über sie wachen
  rationale: שׁקד bezeichnet aufmerksame, zielgerichtete Wachsamkeit. Die identische Wiedergabe in beiden Vershälften erhält den auffälligen Gegensatz zwischen Gottes Wirken im Gericht und in der Wiederherstellung.
- source_word: לִנְתוֹשׁ
  choice: auszureißen
  rationale: Erhält das landwirtschaftliche Bild und bereitet den Gegensatz zu »pflanzen« vor.
- source_word: וְלִנְתוֹץ
  choice: niederzureißen
  rationale: Eine natürliche deutsche Wiedergabe des gewaltsamen Abbrechens und zugleich vom folgenden Verb unterscheidbar.
- source_word: וְלַהֲרֹס
  choice: einzureißen
  rationale: Bewahrt die kumulative Folge der Zerstörungsverben, ohne dieses Verb mit הַאֲבִיד vollständig gleichzusetzen.
- source_word: וּלְהַאֲבִיד
  choice: zu vernichten
  rationale: Gibt den kausativen Sinn von אבד prägnant wieder und unterscheidet ihn sprachlich von den vorausgehenden Verben des Nieder- und Einreißens.
- source_word: וּלְהָרֵעַ
  choice: Unheil zu bringen
  rationale: Bezeichnet hier das Herbeiführen von Unheil im Gericht, ohne Gott moralisch Böses zuzuschreiben; die Bedeutungsbreite wird in der Fußnote kenntlich gemacht.
- source_word: לִבְנוֹת וְלִנְטוֹעַ
  choice: aufzubauen und zu pflanzen
  rationale: Erhält die beiden zentralen Wiederherstellungsbilder und ihre Gegenüberstellung zu Niederreißen und Ausreißen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: »Ausspruch« entspricht der prophetischen Botenformel; »Jahwe« gibt das Tetragramm in der im Deutschen üblichen Form des Gottesnamens wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« wahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Gottes wachsame Tätigkeit in Gericht und Wiederherstellung
  choice: Dasselbe Verb »wachen« in beiden Vershälften
  alternative: im ersten Vershälftenteil »darauf bedacht sein«, im zweiten »wachen«
  rationale: 'Die Wiederholung von שׁקד ist theologisch und rhetorisch bedeutsam: Gottes zielgerichtete Aufmerksamkeit gilt sowohl dem angekündigten Gericht als auch dem künftigen Aufbau. Eine wechselnde Übersetzung würde diese Spannung abschwächen.'
- issue: Bedeutung von וּלְהָרֵעַ
  choice: Unheil zu bringen
  alternative: Böses zu tun / Schaden zuzufügen
  rationale: Im Gerichtskontext geht es um verursachtes Unheil beziehungsweise Schädigung, nicht um moralische Bosheit Gottes. »Unheil« erhält dennoch die Härte der Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Parallelstruktur. Die fünf Gerichtshandlungen bleiben als kumulative Reihe unterscheidbar; die Bildpaare »ausreißen/pflanzen« und »niederreißen/aufbauen« werden sichtbar gehalten.
