  verdict: approve
  source_fidelity: Die Übersetzung gibt die Vergleichsstruktur כַּאֲשֶׁר ... כֵּן sowie die Zeitrelation des hebräischen Perfekts und Imperfekts angemessen wieder. Die fünf Gerichtshandlungen bleiben vollständig und in ihrer Steigerung erkennbar; der Übergang zu Bauen und Pflanzen ist ebenso vollständig erhalten. »Über sie wachen« bewahrt die bewusste Wiederholung von שׁקד in beiden Satzhälften.
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. Die einleitende Formel »Und es wird geschehen« ist leicht formell, aber für prophetische Rede idiomatisch und nicht unnötig archaisch. Die Infinitivreihe ist flüssig und verständlich.
  terminology: »Jahwe« gibt יְהוָה sachgerecht wieder, und »Ausspruch Jahwes« entspricht נְאֻם יְהוָה. »Unheil zu bringen« trifft im Gerichtskontext die Bedeutung von לְהָרֵעַ, ohne moralisches Übeltun zu unterstellen. Die Fußnote bietet mit »Schaden zuzufügen« eine vertretbare lexikalische Alternative; ihr Anker steht unmittelbar bei der betreffenden Wendung.
