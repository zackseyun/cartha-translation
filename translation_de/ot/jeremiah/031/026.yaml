lexical_decisions:
- source_word: עַל זֹאת
  choice: Darüber
  rationale: Die Wendung bezeichnet hier den Anlass oder Gegenstand des Erwachens. „Darüber“ ist im Deutschen idiomatisch und lässt offen, ob ein stärker ursächlicher Sinn gemeint ist.
- source_word: הֱקִיצֹתִי
  choice: wachte ich auf
  rationale: Die Form ist aktiv, erste Person Singular. „Wachte ich auf“ gibt den schlichten Vorgang wieder, ohne eine im Hebräischen nicht ausdrücklich markierte passive Verursachung einzutragen.
- source_word: וָאֶרְאֶה
  choice: und sah mich um
  rationale: ראה bedeutet grundsätzlich „sehen“. Nach dem Erwachen bezeichnet die Form hier natürlich das anschließende Schauen oder Wahrnehmen; „sah mich um“ ergibt im modernen Deutschen einen verständlichen Zusammenhang, ohne ein bestimmtes gesehenes Objekt hinzuzufügen.
- source_word: וּשְׁנָתִי
  choice: mein Schlaf
  rationale: שֵׁנָה wird schlicht und gegenwartssprachlich mit „Schlaf“ wiedergegeben.
- source_word: עָרְבָה לִּי
  choice: war mir angenehm
  rationale: Das Verb ערב drückt Angenehmheit oder Süße aus. „War mir angenehm“ ist natürliches modernes Deutsch; die bildhaftere Wiedergabe „war mir süß“ bleibt in der Fußnote erhalten.
