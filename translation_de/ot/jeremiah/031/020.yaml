  text: הֲ/בֵן֩ יַקִּ֨יר לִ֜/י אֶפְרַ֗יִם אִ֚ם יֶ֣לֶד שַׁעֲשֻׁעִ֔ים כִּֽי מִ/דֵּ֤י דַבְּרִ/י֙ בּ֔/וֹ זָכֹ֥ר אֶזְכְּרֶ֖/נּוּ ע֑וֹד עַל כֵּ֗ן הָמ֤וּ מֵעַ/י֙ ל֔/וֹ רַחֵ֥ם אֲֽרַחֲמֶ֖/נּוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/020.yaml
  text: Is Ephraim a precious son to me[a], a child of delight? For as often as I speak of him, I still surely remember him. Therefore my inward parts are stirred for him; I will surely have compassion on him[b], declares Yahweh.
translation:
  language: de
  text: Ist Ephraim mir ein teurer Sohn, ein Kind, an dem ich Freude habe? Denn sooft ich von ihm rede[a], denke ich immer wieder an ihn. Darum ist mein Innerstes in Aufruhr um ihn[b]. Ich werde gewiss Erbarmen mit ihm haben – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen ihn rede“. Die hebräische Präposition kann neutral „von/über ihn“ bedeuten; im Zusammenhang kann „gegen ihn“ auf vorausgehende Gerichtsworte weisen.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „meine Eingeweide sind seinetwegen in Bewegung“. Im Hebräischen bezeichnet dies eine tiefe innere Regung und Anteilnahme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵן יַקִּיר לִי
  choice: Ist Ephraim mir ein teurer Sohn
  rationale: „Teurer Sohn“ gibt die emotionale Bedeutung von יַקִּיר natürlich wieder und bewahrt die rhetorische Frage.
- source_word: אִם יֶלֶד שַׁעֲשֻׁעִים
  choice: ein Kind, an dem ich Freude habe
  rationale: Die Wendung bezeichnet ein Kind der Freude beziehungsweise des Entzückens; die deutsche Formulierung ist verständlich, ohne die Zuneigung abzuschwächen.
- source_word: כִּי מִדֵּי דַבְּרִי בּוֹ
  choice: Denn sooft ich gegen ihn rede
  rationale: בּוֹ kann hier neutral „von/über ihn“ oder im Zusammenhang mit Gerichtsworten „gegen ihn“ bedeuten. Der Haupttext wählt die kontextuell naheliegende gerichtliche Nuance; die neutralere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: זָכֹר אֶזְכְּרֶנּוּ עוֹד
  choice: denke ich doch immer wieder an ihn
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt das Erinnern; „doch immer wieder“ bringt sowohl die Betonung als auch die fortdauernde Bedeutung von עוֹד idiomatisch zum Ausdruck.
- source_word: הָמוּ מֵעַי לוֹ
  choice: ist mein Innerstes aufgewühlt wegen ihm
  rationale: Die Übersetzung bewahrt die körperbezogene Metapher von מֵעַי und gibt הָמוּ als starke innere Bewegung wieder, ohne das Bild vorschnell nur mit „Herz“ zu paraphrasieren.
- source_word: רַחֵם אֲרַחֲמֶנּוּ
  choice: Ich werde gewiss Erbarmen mit ihm haben
  rationale: Die deutsche Verstärkung „gewiss“ bildet den emphatischen Infinitivus absolutus ab; „Erbarmen“ entspricht der tief empfundenen Barmherzigkeit von רחם.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel wird knapp wiedergegeben; der Gottesname יהוה erscheint transparent als „Jahwe“.
theological_decisions:
- issue: Bezug und Ton der Bezeichnung Ephraims
  choice: Ephraim erscheint als personifiziertes Nordreich und zugleich als geliebter Sohn; Gerichtswort und fortdauerndes Erbarmen bleiben nebeneinander stehen.
  alternative: Ephraim ausschließlich als einzelne Gestalt beziehungsweise Stammesvater zu verstehen.
  rationale: Der Zusammenhang von Jeremia 31 spricht von Ephraim kollektiv und personifiziert. Die Übersetzung erhält sowohl die familiäre Nähe als auch die Spannung zwischen Zurechtweisung und Erbarmen.
- issue: Aussageform der einleitenden Fragen
  choice: Die hebräischen Fragen bleiben als rhetorische Fragen stehen.
  alternative: 'Sie als bekräftigende Aussagen wiederzugeben: „Ephraim ist mir ein teurer Sohn …“'
  rationale: Die Frageform ist im Hebräischen ausdrücklich markiert und trägt zur emotionalen Spannung des Verses bei; sie sollte nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die körperbezogene hebräische Gefühlsmetapher bleibt in verständlicher Form erhalten. „Ausspruch Jahwes“ wahrt den feierlichen prophetischen Ton; die emphatischen Verbverbindungen werden idiomatisch mit „immer wieder“ und „gewiss“ wiedergegeben.
