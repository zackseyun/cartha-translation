  text: וְ/לֹ֧א יְלַמְּד֣וּ ע֗וֹד אִ֣ישׁ אֶת רֵעֵ֜/הוּ וְ/אִ֤ישׁ אֶת אָחִי/ו֙ לֵ/אמֹ֔ר דְּע֖וּ אֶת יְהוָ֑ה כִּֽי כוּלָּ/ם֩ יֵדְע֨וּ אוֹתִ֜/י לְ/מִ/קְטַנָּ֤/ם וְ/עַד גְּדוֹלָ/ם֙ נְאֻם יְהוָ֔ה כִּ֤י אֶסְלַח֙ לַֽ/עֲוֺנָ֔/ם וּ/לְ/חַטָּאתָ֖/ם לֹ֥א אֶזְכָּר עֽוֹד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/034.yaml
  text: And they will no longer teach[a], each man his neighbor and each man his brother, saying, ‘Know Yahweh,’ for they will all know me, from the least of them to the greatest of them, declares Yahweh. For I will forgive their iniquity[c][b], and I will remember their sin no more.
translation:
  language: de
  text: 'Und niemand wird mehr seinen Nächsten und seinen Bruder belehren[a] und sagen: »Erkennt Jahwe!« Denn sie alle werden mich erkennen, vom Geringsten bis zum Größten unter ihnen[b], spricht Jahwe. Denn ich werde ihre Schuld vergeben und ihrer Sünde nicht mehr gedenken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ein Mann wird nicht mehr seinen Nächsten und ein Mann seinen Bruder belehren.“ Die maskuline Einzahl wird hier distributiv für die Angehörigen der Gemeinschaft gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „vom Kleinsten bis zum Größten unter ihnen.“ Die Wendung umfasst die ganze Gemeinschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְלַמְּדוּ
  choice: belehren
  rationale: Das Piel von למד bedeutet „lehren, unterweisen“. „Belehren“ passt zur ausdrücklich genannten Aufforderung und ergibt im Deutschen eine natürliche Satzfügung.
- source_word: אִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת אָחִיו
  choice: niemand ... seinen Mitmenschen oder seinen Bruder
  rationale: Die zweimalige distributive Wendung wird in idiomatischem Deutsch mit „niemand ... oder“ wiedergegeben. „Mitmensch“ hält den weiteren Gemeinschaftsbezug von רֵעַ offen; „Bruder“ bewahrt die familiäre beziehungsweise gemeinschaftliche Bildsprache von אָח.
- source_word: דְּעוּ אֶת יְהוָה
  choice: Erkennt Jahwe!
  rationale: ידע bezeichnet hier mehr als bloßes Faktenwissen, ohne dass die Übersetzung die relationale und bundestheologische Bedeutung näher festlegt. Der Pluralimperativ wird mit „Erkennt“ wiedergegeben; der Gottesname erscheint als „Jahwe“.
- source_word: יֵדְעוּ אוֹתִי
  choice: sie alle werden mich erkennen
  rationale: „Mich erkennen“ bewahrt sowohl den Erkenntnisaspekt als auch die mögliche personale und relationale Tiefe des hebräischen ידע.
- source_word: לְמִקְטַנָּם וְעַד גְּדוֹלָם
  choice: vom Geringsten bis zum Größten unter ihnen
  rationale: Die Wendung bezeichnet umfassend alle Angehörigen der Gemeinschaft. „Geringsten“ und „Größten“ lassen Rang, Bedeutung und Lebensalter offen und klingen im Deutschen natürlich.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Formel wird würdig und idiomatisch wiedergegeben, ohne sie zum technischen Ausdruck „Ausspruch“ zu verengen.
- source_word: אֶסְלַח לַעֲוֹנָם
  choice: ich werde ihre Schuld vergeben
  rationale: סלח ist das übliche Verb für göttliches Vergeben. עָוֹן kann Schuld und Vergehen bezeichnen; „Schuld“ ist natürlich und bleibt von der folgenden „Sünde“ unterscheidbar.
- source_word: וּלְחַטָּאתָם לֹא אֶזְכָּר עוֹד
  choice: und ihrer Sünde nicht mehr gedenken
  rationale: „Gedenken“ gibt זכר bewusstes Erinnern beziehungsweise In-Anschlag-Bringen wieder und vermeidet den Eindruck eines bloßen Gedächtnisverlusts.
theological_decisions:
- issue: Bedeutung von „erkennen“ im Bundeskontext
  choice: „erkennen“ ohne erklärende Erweiterung
  alternative: „anerkennen“ oder „in einer rettenden Beziehung zu ... stehen“
  rationale: ידע trägt hier personale und bundeshafte Tiefe, doch eine ausdrückliche dogmatische Auslegung würde die Mehrdeutigkeit des Ausgangstextes verengen.
- issue: Distributive maskuline Formulierung
  choice: idiomatisches „niemand“, ergänzt durch eine Fußnote zur hebräischen Form
  alternative: „kein Mann seinen Nächsten und kein Mann seinen Bruder“
  rationale: אִישׁ ist zweimal distributiv gebraucht. Im modernen Deutschen gibt „niemand“ die allgemeine Aussage verständlich wieder; die konkrete maskuline Form und Parallelstruktur werden in der Fußnote dokumentiert.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht-mehr-Gedenken der Sünde
  choice: „ihrer Sünde nicht mehr gedenken“
  alternative: „sich nicht mehr an ihre Sünde erinnern“
  rationale: Die gewählte Formulierung bewahrt die Aussage göttlichen Vergebens, ohne sie als unfreiwilliges Vergessen oder als Verlust von Wissen misszuverstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax wurde gegenüber der hebräischen distributiven Wiederholung behutsam geglättet; zentrale Bundesbegriffe wie „erkennen“, „Schuld“, „Sünde“ und der Gottesname „Jahwe“ bleiben deutlich und theologisch offen.
