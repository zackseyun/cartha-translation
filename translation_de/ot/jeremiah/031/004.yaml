source:
  edition: WLC
  text: ע֤וֹד אֶבְנֵ/ךְ֙ וְֽ/נִבְנֵ֔ית בְּתוּלַ֖ת יִשְׂרָאֵ֑ל ע֚וֹד תַּעְדִּ֣י תֻפַּ֔יִ/ךְ וְ/יָצָ֖את בִּ/מְח֥וֹל מְשַׂחֲקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/004.yaml
  text: Again I will build you[a], and you will be built, O virgin Israel[c][b]; again you will adorn yourself with your tambourines and go out in the dance of those who celebrate.
translation:
  language: de
  text: Wieder werde ich dich aufbauen, und du wirst aufgebaut werden[a], Jungfrau Israel[b]. Wieder wirst du dich mit deinen Tamburinen schmücken und im Tanz der Feiernden hinausziehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit derselben Wortwurzel: »Ich werde dich bauen, und du wirst gebaut werden.« Gemeint ist hier das erneute Aufbauen nach der Zerstörung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »junge Frau Israel«. Die Wendung ist eine bildhafte Anrede Israels.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »hinausziehen und mit den Fröhlichen tanzen« beziehungsweise »hinausziehen im Reigen der Feiernden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: Wieder
  rationale: Das Adverb kündigt nach Gericht und Zerstörung eine erneute, zukünftige Handlung an; seine Wiederholung in beiden Satzhälften bleibt erhalten.
- source_word: אֶבְנֵךְ … וְנִבְנֵית
  choice: werde ich dich aufbauen, und du wirst aufgebaut werden
  rationale: Aktiv und Passiv derselben hebräischen Wurzel בנה werden mit derselben deutschen Wortfamilie wiedergegeben. „Aufbauen“ lässt im Deutschen den Wiederherstellungssinn erkennen und klingt natürlicher als „dich bauen“.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: du Jungfrau Israel
  rationale: Die direkte metaphorische Anrede wird bewahrt; das vorangestellte „du“ kennzeichnet den Vokativ im heutigen Deutsch klar und würdevoll.
- source_word: תַּעְדִּי
  choice: du wirst dich … schmücken
  rationale: Die reflexive Bedeutung des Verbs im Sinn von „sich schmücken“ bleibt erhalten, ohne das festliche Bild erklärend aufzulösen.
- source_word: תֻפַּיִךְ
  choice: deinen Tamburinen
  rationale: „Tamburin“ ist eine geläufige moderne Bezeichnung für die kleinen, beim Tanz verwendeten Rahmentrommeln; „Handpauke“ oder „Timbrel“ wäre weniger gegenwärtig.
- source_word: וְיָצָאת
  choice: und hinausziehen
  rationale: Das Verb bezeichnet das öffentliche Hinausgehen beziehungsweise Ausziehen und passt zur festlichen Prozession.
- source_word: בִּמְחוֹל מְשַׂחֲקִים
  choice: zum Tanz der Feiernden
  rationale: מָחוֹל bezeichnet gemeinschaftlichen Tanz; das Partizip מְשַׂחֲקִים beschreibt Menschen in ausgelassener, freudiger Feier. Die Formulierung bleibt verständlich, ohne die Feiernden abwertend als bloße Spieler erscheinen zu lassen.
theological_decisions:
- issue: Metaphorische Anrede „Jungfrau Israel“ in einer Wiederherstellungszusage
  choice: Die Metapher wird unmittelbar als „du Jungfrau Israel“ beibehalten.
  alternative: „du junge Frau Israel“ oder eine erklärende Umschreibung der erneuerten Reinheit Israels
  rationale: Der Ausdruck ist prophetische Bildsprache für Israels wiederhergestellte Identität. Eine erklärende Auflösung würde die metaphorische Spannung des Textes beseitigen und könnte eine wörtliche Aussage über Jungfräulichkeit suggerieren oder vermeiden, statt den Wortlaut stehen zu lassen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Das doppelte „Wieder“ und das Wortspiel aus aktivem und passivem בנה bleiben sichtbar. Der Vokativ wird ohne altertümliches „o“ durch „du“ kenntlich gemacht.
