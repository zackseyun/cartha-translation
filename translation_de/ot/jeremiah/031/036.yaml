id: JER.31.36
reference: Jeremiah 31:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם יָמֻ֜שׁוּ הַ/חֻקִּ֥ים הָ/אֵ֛לֶּה מִ/לְּ/פָנַ֖/י נְאֻם יְהוָ֑ה גַּם֩ זֶ֨רַע יִשְׂרָאֵ֜ל יִשְׁבְּת֗וּ מִֽ/הְי֥וֹת גּ֛וֹי לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/036.yaml
  text: If these fixed ordinances depart from before me[a], declares Yahweh[c][b], then the offspring of Israel also will cease from being a nation before me forever.
translation:
  language: de
  text: Wenn diese festen Ordnungen vor mir weichen[a] – Ausspruch Jahwes –, dann wird auch die Nachkommenschaft Israels[b] aufhören, vor mir eine Nation zu sein, für alle Zeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Satzungen“ beziehungsweise „diese Festsetzungen“. Im Zusammenhang sind die festgesetzten Ordnungen der Schöpfung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Same Israels“; eine kollektive Bezeichnung für Israels Nachkommenschaft oder Nachkommen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „alle Tage“; ein hebräischer Ausdruck für ununterbrochene Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמֻשׁוּ
  choice: weichen
  rationale: Das Verb bezeichnet hier das Abweichen oder Entferntwerden aus einer festgesetzten Stellung. „Weichen“ passt zur Beständigkeit der Schöpfungsordnung im Kontext.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: diese festen Ordnungen
  rationale: Gemeint sind im unmittelbaren Kontext die von Gott festgesetzten Ordnungen von Sonne, Mond und Meer, nicht in erster Linie Gebote für menschliches Verhalten.
- source_word: מִלְּפָנַי / לְפָנַי
  choice: vor mir
  rationale: Die wiederholte räumlich-relationale Wendung wird an beiden Stellen gleich wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die gewichtige prophetische Botenformel wird knapp und formal wiedergegeben.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: die Nachkommenschaft Israels
  rationale: „Nachkommenschaft“ gibt den kollektiven Singular זֶרַע natürlich wieder, ohne ihn auf einzelne Nachkommen zu verengen.
- source_word: יִשְׁבְּתוּ מִהְיוֹת גּוֹי
  choice: wird aufhören, eine Nation zu sein
  rationale: Die Formulierung bewahrt sowohl das Aufhören eines Zustands als auch die ausdrücklich korporative Bezeichnung גּוֹי.
- source_word: כָּל הַיָּמִים
  choice: für alle Zeit
  rationale: Die deutsche Wendung gibt den Sinn dauernden Fortbestands natürlich wieder, während eine Fußnote auf das wörtliche hebräische Idiom hinweist.
theological_decisions:
- issue: Fortdauernde korporative Identität Israels
  choice: Die Nachkommenschaft Israels bleibt ausdrücklich als „Nation vor mir“ bezeichnet.
  alternative: Eine Verallgemeinerung zu rein geistlicher oder nicht korporativer Fortdauer.
  rationale: Der hebräische Text verknüpft Israels Fortbestand als גּוֹי unmittelbar mit der Beständigkeit der Schöpfungsordnung. Die Übersetzung erhält diese Aussage, ohne sie durch ein späteres theologisches System einzuengen.
- issue: Logische Form der Zusage
  choice: Die konditionale Form „Wenn …, dann …“ bleibt unverändert bestehen.
  alternative: Eine erklärende Paraphrase wie „So gewiss diese Ordnungen bestehen …“.
  rationale: Die rhetorische Unmöglichkeitsbedingung ist aus dem Kontext erkennbar; die Übersetzung bewahrt die tatsächliche Satzform des Hebräischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markierte Parenthese „Ausspruch Jahwes“ erhält den feierlichen Charakter der prophetischen Formel. „Nation“ bewahrt die korporativ-politische Aussage von גּוֹי deutlicher als das weiter gefasste „Volk“.
