id: JER.31.21
reference: Jeremiah 31:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַצִּ֧יבִי לָ֣/ךְ צִיֻּנִ֗ים שִׂ֤מִי לָ/ךְ֙ תַּמְרוּרִ֔ים שִׁ֣תִי לִבֵּ֔/ךְ לַֽ/מְסִלָּ֖ה דֶּ֣רֶךְ הלכתי שׁ֚וּבִי בְּתוּלַ֣ת יִשְׂרָאֵ֔ל שֻׁ֖בִי אֶל עָרַ֥יִ/ךְ אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/021.yaml
  text: Set up road markers for yourself[a]; place guideposts for yourself. Set your heart toward the highway, the way you went. Return, virgin Israel[c][b]; return to these your cities.
translation:
  language: de
  text: Stell dir Wegzeichen auf[a], errichte dir Wegweiser[b]. Richte dein Herz auf die Straße, auf den Weg, den du gegangen bist. Kehre zurück, Jungfrau Israel[c], kehre zurück in diese deine Städte!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Orientierungszeichen« beziehungsweise »Markierungssteine«.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort ist selten; im Zusammenhang sind wahrscheinlich Markierungen gemeint, die entlang des Weges zur Orientierung dienen.
    reason: lexical_uncertainty
  - marker: c
    text: »Kehre zurück« kann sowohl die Heimkehr aus dem Exil als auch die Rückkehr zu einer treuen Beziehung zu Gott bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיבִי לָךְ צִיֻּנִים
  choice: Stell dir Wegzeichen auf
  rationale: Der Hifil-Imperativ verlangt das Aufstellen sichtbarer Zeichen entlang der Reiseroute. »Wegzeichen« ist gegenwärtig, verständlich und lässt die genaue Art der Markierungen offen.
- source_word: שִׂמִי לָךְ תַּמְרוּרִים
  choice: errichte dir Wegweiser
  rationale: Das seltene תַּמְרוּרִים wird durch den Reise- und Parallelkontext am ehesten als Markierungen zur Orientierung verstanden. »Wegweiser« gibt diese Funktion natürlich wieder, ohne eine unsichere Etymologie einzutragen.
- source_word: שִׁתִי לִבֵּךְ
  choice: Richte dein Herz auf
  rationale: Die Körpermetapher des Hebräischen bleibt erhalten; »Herz« umfasst Aufmerksamkeit, Willen und innere Ausrichtung.
- source_word: לַמְסִלָּה
  choice: auf die Straße
  rationale: מְסִלָּה bezeichnet eine angelegte beziehungsweise aufgeschüttete Straße. »Straße« passt im Deutschen besser zur konkreten Rückreiseroute als das modern oft anders konnotierte »Autobahn«.
- source_word: דֶּרֶךְ הלכתי
  choice: auf den Weg, den du gegangen bist
  rationale: דֶּרֶךְ steht erläuternd zu מְסִלָּה; die feminine Singularform des Verbs bezieht sich auf die als Frau angeredete Israelgestalt.
- source_word: שׁוּבִי
  choice: Kehre zurück
  rationale: Die Form ist ein femininer Singularimperativ. »Kehre zurück« wahrt sowohl die räumliche Rückkehr aus dem Exil als auch mögliche bundesbezogene Untertöne.
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: Jungfrau Israel
  rationale: Die prophetische Personifikation wird direkt und würdevoll wiedergegeben. Die Großschreibung folgt der deutschen Substantivschreibung und macht daraus keinen zusätzlichen Eigennamen.
- source_word: אֶל עָרַיִךְ אֵלֶּה
  choice: in diese deine Städte
  rationale: Die leicht gehobene Wortstellung bewahrt die Verbindung von Demonstrativ und Possessivsuffix sowie den nachdrücklichen Zielpunkt der Rückkehr.
theological_decisions:
- issue: Bedeutungsumfang des Rückkehrrufs שׁוּבִי
  choice: »Kehre zurück« ohne Einschränkung auf eine ausschließlich geografische oder ausschließlich geistliche Bedeutung
  alternative: »Komm aus dem Exil zurück« oder »Kehre um«
  rationale: Straße, Wegzeichen und Städte sprechen unmittelbar von der Heimkehr aus dem Exil; im Jeremiabuch kann שוב zugleich eine Rückwendung in Bundestreue anklingen lassen. Die offene Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativen und bewahrter Herzmetapher. Die Wiederholung von »dir« und »kehre zurück« bildet die hebräische Eindringlichkeit ab. Die Formulierung »diese deine Städte« ist bewusst leicht literarisch, um den demonstrativen Nachdruck des Ausgangstextes zu erhalten.
