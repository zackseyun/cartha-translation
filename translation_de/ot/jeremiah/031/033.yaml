source:
  edition: WLC
  text: כִּ֣י זֹ֣את הַ/בְּרִ֡ית אֲשֶׁ֣ר אֶכְרֹת֩ אֶת בֵּ֨ית יִשְׂרָאֵ֜ל אַחֲרֵ֨י הַ/יָּמִ֤ים הָ/הֵם֙ נְאֻם יְהוָ֔ה נָתַ֤תִּי אֶת תּֽוֹרָתִ/י֙ בְּ/קִרְבָּ֔/ם וְ/עַל לִבָּ֖/ם אֶכְתֲּבֶ֑/נָּה וְ/הָיִ֤יתִי לָ/הֶם֙ לֵֽ/אלֹהִ֔ים וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/033.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], declares Yahweh: I will put my law within them, and I will write it on their hearts. And I will be their God[c][b], and they shall be my people.'
translation:
  language: de
  text: 'Denn dies ist der Bund, den ich nach jenen Tagen mit dem Haus Israel schließen werde – Ausspruch Jahwes: Ich werde meine Weisung[a] in ihr Inneres legen[b] und sie auf ihr Herz schreiben. Ich werde ihr Gott sein, und sie werden mein Volk sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Gesetz“. Das hebräische Wort Tora kann „Weisung“ oder „Gesetz“ bedeuten; im Bundeskontext schwingt die verbindliche göttliche Ordnung mit.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb steht formal in einer Vergangenheitsform („ich habe gelegt“), hat hier im Zusammenhang der übrigen Zukunftsverheißungen aber wahrscheinlich Zukunftsbedeutung.
    reason: textual_grammar
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Verheißung ein und gibt den Zusammenhang im Deutschen natürlich wieder.
- source_word: הַבְּרִית ... אֶכְרֹת
  choice: der Bund, den ich ... schließen werde
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung der hebräischen Wendung, die wörtlich „einen Bund schneiden“ lautet.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Bewahrt die korporative Bundesbezeichnung des Hebräischen, ohne sie zu „Israel“ oder „Volk Israel“ zu glätten.
- source_word: אַחֲרֵי הַיָּמִים הָהֵם
  choice: nach jenen Tagen
  rationale: Nahe, idiomatische Wiedergabe der zeitlichen Formulierung, ohne den prophetischen Zeitraum näher festzulegen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feste prophetische Botenformel gewichtig und knapp wieder; der Eigenname wird als „Jahwe“ wiedergegeben.
- source_word: נָתַתִּי ... תּוֹרָתִי בְּקִרְבָּם
  choice: Ich werde meine Weisung in ihr Inneres legen
  rationale: Der morphologische Perfekt wird im Zusammenhang der umgebenden Zukunftsverheißungen mit Zukunftsbedeutung verstanden. „Ihr Inneres“ bewahrt den inneren Ort und die Parallele zum Herzen.
- source_word: תּוֹרָתִי
  choice: meine Weisung
  rationale: תּוֹרָה bezeichnet sowohl Gesetz als auch göttliche Unterweisung. „Weisung“ bewahrt hier die Breite des Begriffs, während die Fußnote „Gesetz“ als sachlich mögliche, bundesbezogene Alternative nennt.
- source_word: וְעַל לִבָּם אֶכְתֲּבֶנָּה
  choice: und sie ihnen ins Herz schreiben
  rationale: „Sie“ bezieht sich auf die Weisung; „ins Herz schreiben“ ist im Deutschen natürlich und bewahrt das Bild der verinnerlichten göttlichen Weisung.
- source_word: וְהָיִתִי לָהֶם לֵאלֹהִים וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: Ich werde ihr Gott sein, und sie werden mein Volk sein
  rationale: Bewahrt die wechselseitige Bundesformel in klarer, würdiger deutscher Sprache.
theological_decisions:
- issue: Prophetisches Perfekt נָתַתִּי innerhalb einer zukünftigen Bundesverheißung
  choice: 'Zukünftig: „Ich werde ... legen“'
  alternative: 'Vergangen/perfektiv: „Ich habe ... gelegt“'
  rationale: Der Vers wird durch zukünftige Formen des Bundesschlusses, Schreibens und der Bundesformel bestimmt. Die Zukunftswiedergabe erhält die zusammenhängende Verheißungsfolge, ohne die formale Besonderheit zu verschweigen.
- issue: Bedeutung von תּוֹרָה im Kontext des neuen Bundes
  choice: „Weisung“ im Haupttext
  alternative: „Gesetz“
  rationale: Der hebräische Ausdruck umfasst verbindliche göttliche Unterweisung und kann im Bundeskontext „Gesetz“ bedeuten. „Weisung“ vermeidet eine unnötige Verengung; die bundesrechtliche Alternative bleibt in der Fußnote ausdrücklich erhalten.
- issue: Referenz und Reichweite von בְּקִרְבָּם und לִבָּם
  choice: Innere Verankerung bei den Angehörigen des Hauses Israel
  alternative: 'Kollektiv: „in ihre Mitte“'
  rationale: Die Parallele zum Schreiben ins Herz legt den inneren Bereich nahe. Die Übersetzung lässt offen, wie individuelles und gemeinschaftliches Verständnis genau zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bekannte Bundesformel und das biblische Herzbild bleiben erhalten. „Ausspruch Jahwes“ wahrt den feierlichen prophetischen Ton; „Weisung“ ist allgemein verständlich und lexikalisch breit. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
