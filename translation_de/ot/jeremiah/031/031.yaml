  source_fidelity: 'Der Entwurf gibt sämtliche Sinnelemente des hebräischen Textes zuverlässig wieder: die aufmerksamkeitslenkende Einleitung (הִנֵּה), die prophetische Zukunftsformel, die Gottesredeformel, Gottes künftiges Handeln sowie die beiden parallel genannten Häuser Israel und Juda. „Einen Bund schließen“ ist die idiomatische deutsche Entsprechung für כרת ברית. Das zeitlich anknüpfende „da werde ich“ ist im Kontext der kommenden Tage angemessen und verändert die Aussage nicht.'
