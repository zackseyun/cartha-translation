id: JER.31.31
reference: Jeremiah 31:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/כָרַתִּ֗י אֶת בֵּ֧ית יִשְׂרָאֵ֛ל וְ/אֶת בֵּ֥ית יְהוּדָ֖ה בְּרִ֥ית חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/031.yaml
  text: Look[a], days are coming, declares Yahweh, when I will make a new covenant with the house of Israel and the house of Judah.
translation:
  language: de
  text: „Siehe, es kommen Tage“, spricht Jahwe, „da werde ich mit dem Haus Israel und mit dem Haus Juda einen neuen[a] Bund schließen.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen erneuerten Bund“. Das hebräische Adjektiv bedeutet am naheliegendsten „neu“; manche Ausleger verstehen es mit Blick auf die Kontinuität des Bundes als „erneuert“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Das einleitende Signal lenkt nachdrücklich die Aufmerksamkeit auf die folgende prophetische Ankündigung. „Siehe“ bewahrt diese Funktion in knapper, würdevoller Form.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Die Formulierung bildet die geläufige prophetische Zukunftsformel und die partizipiale Konstruktion des Hebräischen eng und zugleich verständlich ab.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird im Deutschen natürlich und gewichtig wiedergegeben; „Jahwe“ bewahrt den im Ausgangstext stehenden Gottesnamen.
- source_word: וְכָרַתִּי
  choice: da werde ich … schließen
  rationale: Hebräisch heißt es wörtlich, einen Bund zu „schneiden“. „Einen Bund schließen“ ist die entsprechende natürliche deutsche Wendung; „da“ verknüpft die angekündigten Tage mit Gottes künftigem Handeln.
- source_word: בֵּית יִשְׂרָאֵל / בֵּית יְהוּדָה
  choice: das Haus Israel / das Haus Juda
  rationale: „Haus“ erhält die korporative und bundestheologische Ausdrucksweise beider parallelen hebräischen Wendungen.
- source_word: בְּרִית חֲדָשָׁה
  choice: einen neuen Bund
  rationale: בְּרִית bezeichnet einen Bund, und חֲדָשָׁה bedeutet hier am naheliegendsten „neu“. Die mögliche Deutung „erneuert“ wird nicht in den Haupttext eingetragen, sondern in einer Fußnote offengelegt.
theological_decisions:
- issue: Ob חֲדָשָׁה mit „neu“ oder im Sinn von „erneuert“ wiederzugeben ist
  choice: neuen Bund
  alternative: erneuerten Bund
  rationale: Der direkte lexikalische Sinn des Adjektivs ist „neu“. „Erneuert“ kann die Kontinuität des Bundes betonen, legt jedoch bereits eine theologische Deutung fest, die über die eindeutige Wortbedeutung hinausgeht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel. Die Wiederholung von „mit“ und die Bezeichnungen „Haus Israel“ und „Haus Juda“ erhalten Parallelismus und korporative Bildsprache des Hebräischen.
