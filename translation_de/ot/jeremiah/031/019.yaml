reference: Jeremiah 31:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אַחֲרֵ֤י שׁוּבִ/י֙ נִחַ֔מְתִּי וְ/אַֽחֲרֵי֙ הִוָּ֣דְעִ֔/י סָפַ֖קְתִּי עַל יָרֵ֑ךְ בֹּ֚שְׁתִּי וְ/גַם נִכְלַ֔מְתִּי כִּ֥י נָשָׂ֖אתִי חֶרְפַּ֥ת נְעוּרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/019.yaml
  text: For after I turned back[a], I repented; and after I was instructed, I struck my thigh. I was ashamed, and also humiliated[c][b], because I bore the disgrace of my youth.
translation:
  language: de
  text: Denn nachdem ich umgekehrt war[a], empfand ich Reue; und nachdem ich zur Einsicht gebracht worden war, schlug ich mir auf die Hüfte[b]. Ich schämte mich und war tief gedemütigt, denn ich trug die Schmach meiner Jugend[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nachdem ich zurückgekehrt war“. Das Hebräische unterscheidet das Umkehren beziehungsweise Zurückkehren (שׁוב) von der danach genannten Reue (נחם).'
    reason: lexical_alternative
  - marker: b
    text: Sich auf die Hüfte zu schlagen war eine Gebärde der Trauer, Bestürzung oder Reue.
    reason: cultural_note
  - marker: c
    text: 'Oder: „den Vorwurf meiner Jugend“. Gemeint sein kann die Schmach aus der Jugendzeit oder die Schmach wegen dessen, was in der Jugend geschah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: ich umgekehrt war
  rationale: שׁוב bezeichnet grundlegend ein Umkehren oder Zurückkehren. „Umkehren“ bewahrt hier die konkrete Bewegungsmetapher und unterscheidet das Verb von dem folgenden נחם.
- source_word: נִחַמְתִּי
  choice: empfand ich Reue
  rationale: נחם bezeichnet in diesem Bekenntnis Reue beziehungsweise ein inneres Bereuen. Die Formulierung ist natürliches modernes Deutsch und lässt die Handlung von der vorausgehenden Umkehr unterschieden.
- source_word: הִוָּדְעִי
  choice: nachdem ich zur Einsicht gebracht worden war
  rationale: Der Nifal-Infinitiv von ידע kann ausdrücken, dass jemand zum Wissen oder Erkennen gebracht wird. Die passive Formulierung wahrt diese Nuance, ohne festzulegen, wer die Einsicht vermittelt.
- source_word: סָפַקְתִּי עַל יָרֵךְ
  choice: schlug ich mir auf die Hüfte
  rationale: Die Wendung beschreibt eine körperliche Gebärde der Trauer, Bestürzung oder Reue. „Sich auf die Hüfte schlagen“ ist im Deutschen verständlich und bleibt nahe am Bild des Hebräischen.
- source_word: בֹּשְׁתִּי
  choice: Ich schämte mich
  rationale: Die direkte Wiedergabe bewahrt den persönlichen Ausdruck von Scham.
- source_word: נִכְלַמְתִּי
  choice: war tief gedemütigt
  rationale: Die Formulierung unterscheidet das zweite, verstärkende Schamwort von בושׁ und vermittelt tiefe Beschämung beziehungsweise Erniedrigung.
- source_word: נָשָׂאתִי
  choice: ich trug
  rationale: נשׂא bedeutet hier, eine Last beziehungsweise Schmach zu tragen. Das schlichte „trug“ erhält das Bild und den rückblickenden Charakter des Bekenntnisses.
- source_word: חֶרְפַּת נְעוּרָי
  choice: die Schmach meiner Jugend
  rationale: חֶרְפָּה kann Schmach, Schande oder Vorwurf bezeichnen. „Schmach“ bewahrt die mögliche soziale Dimension und die Mehrdeutigkeit des Genitivs.
- source_word: כִּי
  choice: Denn / denn
  rationale: Das erste כִּי leitet eine Begründung im Zusammenhang ein; das zweite begründet die vorausgehende Scham und Demütigung. „Denn“ gibt beide erklärenden Verknüpfungen angemessen wieder.
theological_decisions:
- issue: Verhältnis von Umkehr und Reue im Bekenntnis Ephraims
  choice: שׁוב wird als „umkehren“, נחם als „Reue empfinden“ wiedergegeben.
  alternative: Beide Verben könnten mit Buße beziehungsweise Reue verbunden und dadurch stärker angeglichen werden.
  rationale: Der hebräische Text verwendet zwei verschiedene Verben. Die Übersetzung erhält eine mögliche Abfolge von äußerer beziehungsweise gerichteter Umkehr und nachfolgender innerer Reue, ohne daraus ein festes Lehrschema abzuleiten.
- issue: Ursprung der gewonnenen Einsicht
  choice: Die passive Wendung „zur Einsicht gebracht“ bleibt ohne ausdrücklich genanntes handelndes Subjekt.
  alternative: Man könnte „nachdem du mich unterwiesen hattest“ übersetzen und Gott ausdrücklich als Handelnden einsetzen.
  rationale: Die hebräische Form ist passiv und nennt das Agens nicht. Die Übersetzung wahrt diese Offenheit und vermeidet eine inhaltlich plausible, aber nicht ausdrücklich formulierte Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am hebräischen Bekenntnis; die Wiederholungen und die Steigerung der Schambegriffe werden erhalten, ohne altertümliche oder konfessionell geprägte Terminologie.
