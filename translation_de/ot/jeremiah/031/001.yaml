  naturalness: „Sippen“ kann מִשְׁפָּחוֹת zwar treffen, wirkt im heutigen Standarddeutsch jedoch merklich historisierend und kann unerwünschte Nebenassoziationen wecken. „Familien“ ist die neutralere, allgemein verständliche Hauptlesart; die weiter gefasste Bedeutung lässt sich knapp in einer Fußnote sichern. Die eingeschobene Formel „– so spricht Jahwe –“ bildet die prophetische Redeformel im Deutschen besonders natürlich ab.
  terminology: „Jahwe“ entspricht der vorgegebenen Wiedergabe des Tetragramms. „Gott“ und „mein Volk“ bewahren die etablierte Bundesformel, ohne deren relationale Aussage abzuschwächen. Die Fußnote dokumentiert „Sippen/Clans“ als mögliche lexikalische Nuance von מִשְׁפָּחוֹת.
