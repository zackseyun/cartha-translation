  text: בָּ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה אֶֽהְיֶה֙ לֵֽ/אלֹהִ֔ים לְ/כֹ֖ל מִשְׁפְּח֣וֹת יִשְׂרָאֵ֑ל וְ/הֵ֖מָּה יִֽהְיוּ לִ֥/י לְ/עָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/001.yaml
  text: At that time[a], declares Yahweh, I will be God to all the families of Israel, and they will be my people.
translation:
  language: de
  text: Zu jener Zeit – so spricht Jahwe – werde ich der Gott aller Familien[a] Israels sein, und sie werden mein Volk sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Sippen. Das hebräische Wort kann größere Verwandtschaftsgruppen innerhalb Israels bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Zu jener Zeit
  rationale: Die geläufige prophetische Zeitangabe bezeichnet einen bestimmten kommenden Zeitpunkt oder Zeitraum; „zu jener Zeit“ ist natürlich und würdevoll.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: נְאֻם kennzeichnet eine feierliche prophetische Gottesrede. „Spricht Jahwe“ gibt die Formel idiomatisch wieder, ohne sie unnötig zu substantivieren.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶהְיֶה לֵאלֹהִים
  choice: werde ich der Gott … sein
  rationale: Die deutsche Formulierung bewahrt die Bundesformel und klingt mit dem bestimmten Artikel natürlich; das לְ bezeichnet hier die Beziehung zu den genannten Gruppen.
- source_word: לְכֹל מִשְׁפְּחוֹת יִשְׂרָאֵל
  choice: aller Sippen Israels
  rationale: מִשְׁפָּחוֹת bezeichnet hier die größeren verwandtschaftlich gegliederten Gruppen Israels. „Sippen“ trifft diesen gemeinschaftlichen Sinn genauer als das im Deutschen oft auf den engeren Haushalt bezogene „Familien“.
- source_word: וְהֵמָּה יִהְיוּ לִי לְעָם
  choice: und sie werden mein Volk sein
  rationale: Die natürliche deutsche Bundesformel drückt die gegenseitige Zugehörigkeit vollständig aus.
theological_decisions:
- issue: Wiedergabe der gegenseitigen Bundesformel
  choice: werde ich der Gott aller Sippen Israels sein, und sie werden mein Volk sein
  alternative: werde ich allen Sippen Israels zum Gott sein, und sie werden mir zum Volk sein
  rationale: Die gewählte Fassung ist modernes, verständliches Deutsch und erhält sowohl Gottes Selbstzusage als auch die Zugehörigkeit Israels. Die formalere Alternative bildet die hebräischen לְ-Konstruktionen sichtbarer ab, wirkt heute jedoch deutlich weniger natürlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem prophetischem Ton. Die Satzstellung hebt die Selbstzusage Gottes hervor; keine Fußnote ist erforderlich, da „Sippen“ die gemeinte soziale Einheit im Haupttext präzise wiedergibt.
