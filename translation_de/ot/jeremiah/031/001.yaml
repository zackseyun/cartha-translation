- from: Zu jener Zeit, spricht Jahwe, werde ich der Gott aller Sippen Israels sein, und sie werden mein Volk sein.
  to: Zu jener Zeit – so spricht Jahwe – werde ich der Gott aller Familien[a] Israels sein, und sie werden mein Volk sein.
  rationale: Die Revision ersetzt das weniger neutrale „Sippen“ im Haupttext durch das moderne, natürliche „Familien“ und sichert die mögliche Bedeutung als größere Verwandtschaftsgruppe in einer Fußnote. Die Satzformel wird mit „so spricht Jahwe“ idiomatisch und zugleich dem prophetischen Charakter von נְאֻם יְהוָה entsprechend gestaltet. Inhalt und Ambiguität des hebräischen Textes bleiben erhalten.
