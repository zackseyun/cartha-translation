  variant: modern standard German
source:
  edition: WLC
  text: כִּ֛י אִם אִ֥ישׁ בַּ/עֲוֺנ֖/וֹ יָמ֑וּת כָּל הָֽ/אָדָ֛ם הָ/אֹכֵ֥ל הַ/בֹּ֖סֶר תִּקְהֶ֥ינָה שִׁנָּֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/030.yaml
  text: But each man will die for his own iniquity; every person who eats the sour grapes[a], his teeth will be set on edge.
translation:
  language: de
  text: Sondern jeder wird wegen seiner eigenen Schuld sterben. Wer unreife Trauben[a] isst, dem werden die Zähne stumpf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „saure Trauben“. Das hebräische Wort bezeichnet noch unreife und daher saure Trauben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: Die Partikelverbindung korrigiert im Kontrast zum verworfenen Sprichwort des vorigen Verses dessen Aussage; „sondern“ gibt diese adversativ-korrigierende Funktion natürlich wieder.
- source_word: אִישׁ
  choice: jeder
  rationale: Das singularische אִישׁ ist hier distributiv gebraucht. „Jeder“ drückt die persönliche Zuordnung idiomatisch und geschlechtsübergreifend aus, ohne den Singular aufzugeben.
- source_word: בַּעֲוֺנוֹ
  choice: wegen seiner eigenen Schuld
  rationale: עָוֹן kann Verfehlung, Schuld oder Schuldfolge bezeichnen. Die Präposition und der Zusammenhang weisen hier auf die eigene Schuld als Grund des Sterbens; „eigene“ verdeutlicht das Suffix und den Kontrast zur stellvertretend gedachten Folge.
- source_word: יָמוּת
  choice: wird … sterben
  rationale: Das Imperfekt bezeichnet in dieser prophetischen Feststellung die eintretende Folge; das deutsche Futur gibt dies klar wieder.
- source_word: כָּל הָאָדָם הָאֹכֵל
  choice: Wer … isst
  rationale: Die Verbindung aus כָּל הָאָדָם und substantivischem Partizip bezeichnet distributiv jeden Menschen, auf den die Aussage zutrifft. Der deutsche Relativsatz mit „wer“ ist natürlich und bewahrt den allgemeinen Singular.
- source_word: הַבֹּסֶר
  choice: unreife Trauben
  rationale: בֹּסֶר bezeichnet noch nicht reife und deshalb saure Trauben. „Unreife Trauben“ benennt die Grundbedeutung; die geschmackliche Nuance wird in der Fußnote erläutert.
- source_word: תִּקְהֶינָה שִׁנָּיו
  choice: dem werden die Zähne stumpf
  rationale: Die Wendung beschreibt die unangenehme Wirkung unreifer, saurer Trauben auf die Zähne. „Die Zähne werden stumpf“ bleibt nahe am hebräischen Bild und ist im Deutschen verständlich.
theological_decisions:
- issue: Individuelle und generationenübergreifende Verantwortung
  choice: Der Vers ordnet das Sterben ausdrücklich der eigenen Schuld des Einzelnen zu.
  alternative: Das Sprichwort lediglich als allgemeine Redensart wiederzugeben, ohne den Nachdruck auf persönliche Verantwortlichkeit erkennen zu lassen.
  rationale: Der Gegensatz zu Jeremia 31,29 und die wiederholte distributive Formulierung betonen persönliche Verantwortlichkeit. Die Übersetzung gibt diesen Kontrast wieder, ohne daraus weitergehende Aussagen über alle Formen gemeinschaftlicher Schuld oder Leidensfolgen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sondern“ knüpft eng an die verneinte Aussage des vorigen Verses an. Die Formulierung mit „jeder“ und „wer“ ist allgemeinverständlich und bildet den distributiven Singular ohne unnötige Geschlechtsmarkierung ab.
