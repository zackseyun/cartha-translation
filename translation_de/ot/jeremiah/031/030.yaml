  source_fidelity: Die Übersetzung gibt die kontrastiv-korrigierende Einleitung כִּי אִם mit „Sondern“ treffend wieder. „Jeder wird wegen seiner eigenen Schuld sterben“ bewahrt die distributive Einzelzuordnung sowie das Possessivsuffix. „Wer unreife Trauben isst, dem werden die Zähne stumpf“ bildet die allgemeine, singularische Konstruktion und das Bild von תִּקְהֶינָה שִׁנָּיו angemessen ab.
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Satzteilung ist idiomatisch. „Die Zähne werden stumpf“ ist zwar ein bildhafter, biblisch geprägter Ausdruck, aber im Kontext klar und näher am hebräischen Bild als eine stärker interpretierende Umschreibung.
  terminology: „Schuld“ ist für עָוֹן in diesem Zusammenhang eine sachgerechte, nicht überinterpretierende Wahl. „Unreife Trauben“ trifft die Grundbedeutung von בֹּסֶר; die Fußnote bewahrt mit „saure Trauben“ die naheliegende idiomatische Alternative. Die Fußnotenmarkierung steht korrekt am betreffenden Ausdruck.
