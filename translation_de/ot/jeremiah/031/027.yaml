source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/זָרַעְתִּ֗י אֶת בֵּ֤ית יִשְׂרָאֵל֙ וְ/אֶת בֵּ֣ית יְהוּדָ֔ה זֶ֥רַע אָדָ֖ם וְ/זֶ֥רַע בְּהֵמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/027.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will sow the house of Israel and the house of Judah with the seed of man and the seed of beast.
translation:
  language: de
  text: Siehe, es kommen Tage – Spruch Jahwes –, da werde ich das Haus Israel und das Haus Juda mit Menschen[a] und Vieh besäen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Saat von Menschen“ und „Saat von Vieh“. „Menschen“ gibt das hebräische Wort in seiner allgemeinen Bedeutung wieder; das Bild beschreibt, dass das Land wieder mit Menschen und Vieh bevölkert wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den markierten prophetischen Aufmerksamkeitsruf. Die leicht gehobene Form passt zum würdevollen prophetischen Register und ist im Deutschen weiterhin verständlich.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Gibt die prophetische Zukunftsformel natürlich wieder, ohne einen im Hebräischen nicht vorhandenen bestimmten Artikel hinzuzufügen.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Gibt die feste prophetische Botenformel knapp wieder und unterscheidet sie von einem gewöhnlichen Verb des Sagens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und bewahrt so seinen besonderen Bundesbezug.
- source_word: וְזָרַעְתִּי
  choice: da werde ich … besäen
  rationale: Bewahrt das landwirtschaftliche Bild des Säens. „Da“ verbindet die angekündigten kommenden Tage idiomatisch mit der folgenden Verheißung.
- source_word: בֵּית יִשְׂרָאֵל ... בֵּית יְהוּדָה
  choice: das Haus Israel und das Haus Juda
  rationale: Erhält den korporativen Ausdruck „Haus“ für die beiden Völker beziehungsweise Gemeinschaften.
- source_word: זֶרַע אָדָם
  choice: Menschensaat
  rationale: Bewahrt sowohl das Saatbild als auch den generischen Bezug von אָדָם auf Menschen beziehungsweise die Menschheit. Eine Fußnote erläutert die ungewöhnliche, bildhafte Zusammensetzung.
- source_word: וְזֶרַע בְּהֵמָה
  choice: und mit Viehsaat
  rationale: Erhält die Parallelität zu „Menschensaat“ und gibt בְּהֵמָה im Kontext der Wiederbesiedlung als Nutz- und Herdentiere, also „Vieh“, wieder.
theological_decisions:
- issue: Wiederherstellungsbild des Säens
  choice: Das wörtliche Bild wird mit „mit Menschensaat und mit Viehsaat besäen“ beibehalten.
  alternative: „Israel und Juda wieder mit Menschen und Vieh bevölkern“
  rationale: Die dynamische Alternative erklärt zwar den Sinn, beseitigt aber das bewusste landwirtschaftliche Bild und seine Bezüge zur Saat- und Pflanzensprache im Jeremiabuch.
- issue: Generische Bedeutung von אָדָם
  choice: „Menschensaat“ bezeichnet Menschen ohne geschlechtliche Einschränkung.
  alternative: „Saat des Mannes“
  rationale: אָדָם meint hier die Menschheit beziehungsweise Menschen allgemein, nicht ausschließlich männliche Personen. „Menschensaat“ bewahrt diese generische Bedeutung und zugleich den Parallelismus mit der Viehsaat.
translation_notes:
  register: Modernes, würdiges prophetisches Deutsch. „Siehe“ und „Spruch Jahwes“ halten das markierte Orakelregister aufrecht; die ungewöhnlichen Bildwörter „Menschensaat“ und „Viehsaat“ bewahren bewusst die hebräische Metapher und den Parallelismus.
