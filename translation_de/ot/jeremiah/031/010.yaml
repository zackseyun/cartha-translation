  - severity: low
    issue: Elliptische Formulierung „Der Israel zerstreut hat“
    rationale: Die Form ist verständlich, klingt in modernem Standarddeutsch jedoch unvollständig. „Er, der Israel zerstreut hat“ ist klarer, ohne den Sinn zu verändern.
  - severity: low
