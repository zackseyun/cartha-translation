    rationale: „Es hüten, wie ein Hirte seine Herde hütet“ ist möglich, aber stilistisch schwerfällig. „Bewahren ... wie ein Hirte seine Herde bewahrt“ gibt die Schutz- und Fürsorgebedeutung von שׁמר klar wieder.
