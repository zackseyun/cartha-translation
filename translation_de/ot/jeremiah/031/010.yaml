  text: שִׁמְע֤וּ דְבַר יְהוָה֙ גּוֹיִ֔ם וְ/הַגִּ֥ידוּ בָ/אִיִּ֖ים מִ/מֶּרְחָ֑ק וְ/אִמְר֗וּ מְזָרֵ֤ה יִשְׂרָאֵל֙ יְקַבְּצֶ֔/נּוּ וּ/שְׁמָר֖/וֹ כְּ/רֹעֶ֥ה עֶדְרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/010.yaml
  text: Hear the word of the LORD, O nations, and declare it in the coastlands far away; say, “He who scattered Israel will gather him and will keep him as a shepherd keeps his flock.”
translation:
  language: de
  text: 'Hört das Wort des HERRN[a], ihr Völker, und verkündet es in den fernen Küstenländern. Sagt: »Er, der Israel zerstreut hat, wird es sammeln und es bewahren, wie ein Hirte seine Herde bewahrt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH.'
    reason: Macht sichtbar, dass „HERR“ den im hebräischen Text stehenden Gottesnamen wiedergibt.
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der hebräische Imperativ Plural wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: יְהוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wird verwendet; eine Fußnote nennt die hebräische Form.
- source_word: גּוֹיִם
  choice: ihr Völker
  rationale: Die Anredepartikel des Deutschen macht deutlich, dass die Völker direkt angesprochen werden.
- source_word: בָאִיִּים מִמֶּרְחָק
  choice: in den fernen Küstenländern
  rationale: אִיִּים kann Inseln ebenso wie entfernte Küstenregionen bezeichnen; „Küstenländer“ passt zum internationalen Verkündigungsauftrag und bewahrt die geografische Weite.
- source_word: מְזָרֵה
  choice: der ... zerstreut hat
  rationale: Das Partizip bezeichnet Gott durch sein bisheriges Handeln an Israel; im Deutschen ist ein Relativsatz idiomatisch.
- source_word: יְקַבְּצֶנּוּ
  choice: wird es wieder sammeln
  rationale: Das maskuline Singularsuffix bezieht sich kollektiv auf Israel. Das deutsche Neutrum „es“ folgt dem grammatischen Geschlecht des Namens; „wieder“ verdeutlicht den Gegensatz zur vorausgehenden Zerstreuung, ohne einen neuen Sachgehalt einzuführen.
- source_word: וּשְׁמָרוֹ
  choice: und es hüten
  rationale: Im Zusammenhang mit dem Hirtenbild gibt „hüten“ sowohl schützende Bewahrung als auch fürsorgliche Aufsicht wieder.
- source_word: כְּרֹעֶה עֶדְרוֹ
  choice: wie ein Hirte seine Herde hütet
  rationale: Das im Hebräischen knappe Vergleichsbild wird im Deutschen durch die Wiederaufnahme des Verbs natürlich und eindeutig formuliert.
theological_decisions:
- issue: Bezeichnung Gottes durch das Tetragramm
  choice: 'HERR mit Fußnote „Hebräisch: JHWH“'
  alternative: JHWH oder Jahwe im Haupttext
  rationale: Die vertraute deutsche Bibelkonvention bleibt erhalten, während die Fußnote transparent macht, dass im Ausgangstext der Eigenname Gottes steht.
- issue: Israel als kollektive Einheit
  choice: Neutrales Singularpronomen „es“
  alternative: „ihn“, „sie“ oder die Wiederholung „Israel“
  rationale: Der hebräische Text personifiziert Israel mit einem maskulinen Singularsuffix. Da „Israel“ im Deutschen grammatisch sächlich ist, wahrt „es“ den singularischen kollektiven Bezug, ohne Israel ausdrücklich als Land, Mann oder weibliche Gemeinschaft umzudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter prophetischer Anrede. Der Parallelismus von Zerstreuen, Sammeln und Hüten bleibt klar erkennbar; das Hirtenbild wird in geläufigem Deutsch bewahrt.
