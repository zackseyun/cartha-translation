  language: en
  yaml_path: translation/ot/jeremiah/031/005.yaml
  text: Again you will plant vineyards on the mountains of Samaria[a]; planters will plant and enjoy them.
translation:
  language: de
  text: Wieder wirst du Weinberge auf den Bergen Samarias pflanzen; die Pflanzer werden pflanzen und sie in Gebrauch nehmen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie entweihen“ oder „profan machen“. Im Zusammenhang mit Weinbergen bedeutet dies, sie beziehungsweise ihren Ertrag nach der vorgeschriebenen Zeit in die gewöhnliche Nutzung zu übernehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: Wieder
  rationale: Im Wiederherstellungszusammenhang bezeichnet עוֹד die erneute Aufnahme einer früheren Tätigkeit; „wieder“ ist knapp und natürlich.
- source_word: תִּטְּעִי
  choice: wirst du … pflanzen
  rationale: Das Qal-Imperfekt 2. Person feminin Singular bezeichnet hier eine zukünftige Handlung der im Kontext weiblich personifizierten Adressatin; die deutsche Form gibt das Genus nicht eigens wieder.
- source_word: כְרָמִים
  choice: Weinberge
  rationale: Die übliche und im landwirtschaftlichen Bild passende Wiedergabe von כְּרָמִים.
- source_word: בְּהָרֵי שֹׁמְרוֹן
  choice: auf den Bergen Samarias
  rationale: Bewahrt das Grundbild von הָרִים und gibt die Ortsbeziehung idiomatisch wieder.
- source_word: נָטְעוּ נֹטְעִים
  choice: die Pflanzer werden pflanzen
  rationale: Bewahrt die auffällige Wiederholung derselben Wortwurzel. Das Perfekt wird im prophetischen Wiederherstellungskontext als gewiss dargestellte Zukunft verstanden.
- source_word: וְחִלֵּלוּ
  choice: und sie für den gewöhnlichen Gebrauch freigeben
  rationale: Das Piel von חלל bezeichnet hier im Weinbau das Überführen in gewöhnliche Nutzung, nicht eine gotteslästerliche Entweihung. Die Formulierung wahrt den sachlichen Idiomgehalt, ohne das im Hebräischen nicht ausdrücklich genannte „Frucht“ einzufügen.
theological_decisions:
- issue: Adressatin der femininen Singularform
  choice: Die direkte Anrede bleibt als „du“ stehen.
  alternative: Die Adressatin ausdrücklich als „Jungfrau Israel“ benennen.
  rationale: Die feminine Verbform verweist auf die personifizierte Adressatin aus dem unmittelbaren Kontext; der Vers selbst nennt sie jedoch nicht erneut, daher wird nichts ergänzt.
- issue: Bedeutung von וְחִלֵּלוּ im landwirtschaftlichen Zusammenhang
  choice: Für den gewöhnlichen Gebrauch freigeben.
  alternative: „sie entweihen“ oder freier „sie genießen“.
  rationale: Der Zusammenhang handelt von Wiederherstellung und geregelter Nutzung der Weinberge. Die gewählte Formulierung vermeidet eine irreführende kultische Deutung, bewahrt aber die ungewöhnliche Ausdrucksweise und erklärt sie in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Pflanzer werden pflanzen“ bildet die hebräische Stammwiederholung bewusst ab. Die ungewöhnliche Wendung am Versende bleibt im Haupttext sichtbar und wird durch eine Fußnote erläutert.
