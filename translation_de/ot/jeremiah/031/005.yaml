  naturalness: „Wieder wirst du“ und „auf den Bergen Samarias“ sind natürliches, würdiges Standarddeutsch. „Die Pflanzer werden pflanzen“ ist absichtlich markiert, aber verständlich und bildet die hebräische Wiederholung angemessen ab. „Sie in Gebrauch nehmen“ ist idiomatischer und näher an der tatsächlichen Nutzung als „sie für den gewöhnlichen Gebrauch freigeben“.
  terminology: „Weinberge“ und „Samaria“ sind richtig. Die Fußnote sollte die wörtliche Bedeutung von חלל als „entweihen/profan machen“ transparent machen und zugleich erklären, dass sie hier idiomatisch die gewöhnliche Nutzung bezeichnet; „gemein machen“ ist im heutigen Deutsch missverständlich.
