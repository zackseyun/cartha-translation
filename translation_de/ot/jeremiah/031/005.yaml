  rationale: Die Revision ersetzt die etwas verwaltungssprachliche Wendung „für den gewöhnlichen Gebrauch freigeben“ durch „in Gebrauch nehmen“. Damit wird die kontextuelle Bedeutung von וְחִלֵּלוּ klar und idiomatisch wiedergegeben, ohne den im Hebräischen nicht ausdrücklich genannten „Ertrag“ in den Haupttext einzufügen. Die Fußnote bewahrt die wörtliche, potenziell missverständliche Wortbedeutung und erläutert deren idiomatischen Sinn.
