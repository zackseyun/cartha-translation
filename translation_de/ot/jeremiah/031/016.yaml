  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה מִנְעִ֤י קוֹלֵ/ךְ֙ מִ/בֶּ֔כִי וְ/עֵינַ֖יִ/ךְ מִ/דִּמְעָ֑ה כִּי֩ יֵ֨שׁ שָׂכָ֤ר לִ/פְעֻלָּתֵ/ךְ֙ נְאֻם יְהוָ֔ה וְ/שָׁ֖בוּ מֵ/אֶ֥רֶץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/016.yaml
  text: 'Thus says Yahweh: Restrain your voice from weeping and your eyes from tears[a], for there is a reward for your work, declares Yahweh[b], and they will return from the land of the enemy.'
translation:
  language: de
  text: 'So spricht Jahwe: Halte deine Stimme vom Weinen zurück und deine Augen von Tränen[a]; denn es gibt Lohn für deine Arbeit, spricht Jahwe, und sie[b] werden aus dem Land des Feindes zurückkehren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Halte deine Stimme vom Klagen zurück.“'
    reason: Lexikalische Alternative für בֶּכִי, das Weinen beziehungsweise klagendes Weinen bezeichnen kann.
  - marker: b
    text: Mit „sie“ sind im Zusammenhang Rahels Kinder gemeint, also die Verschleppten.
    reason: Das hebräische Verb hat ein unausgedrücktes Subjekt in der dritten Person Plural; der Bezug ergibt sich aus dem Kontext.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel in würdigem, geläufigem Deutsch und gibt den Gottesnamen als Jahwe wieder.
- source_word: מִנְעִי
  choice: Halte … zurück
  rationale: Der feminine Singular richtet sich an die personifizierte Rahel. „Zurückhalten“ bildet die Grundbedeutung von מנע natürlich ab.
- source_word: קוֹלֵךְ מִבֶּכִי
  choice: deine Stimme vom Weinen
  rationale: Die konkrete hebräische Bildsprache mit „Stimme“ bleibt erhalten, statt die Aussage zu einem bloßen „Weine nicht“ zu verflachen.
- source_word: וְעֵינַיִךְ מִדִּמְעָה
  choice: deine Augen von Tränen
  rationale: Die knappe, körperbezogene Parallelformulierung des Hebräischen wird bewahrt.
- source_word: כִּי יֵשׁ שָׂכָר
  choice: denn es gibt Lohn
  rationale: שָׂכָר kann Lohn, Belohnung oder Vergeltung bezeichnen. „Lohn“ bewahrt die Prägnanz und den Zusammenhang mit der folgenden Arbeit.
- source_word: לִפְעֻלָּתֵךְ
  choice: für deine Arbeit
  rationale: „Arbeit“ gibt den weiten Sinn von פְעֻלָּה wieder, ohne ihn auf eine einzelne Tat oder auf Erwerbsarbeit zu verengen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine etablierte deutsche Wiedergabe der feierlichen prophetischen Bekräftigungsformel.
- source_word: וְשָׁבוּ
  choice: und sie werden … zurückkehren
  rationale: Das Verb steht in prophetischem Zukunftssinn. Das unausgedrückte Subjekt bleibt als „sie“ knapp und wird nicht im Haupttext aus dem Kontext ergänzt.
- source_word: מֵאֶרֶץ אוֹיֵב
  choice: aus dem Land des Feindes
  rationale: Bewahrt die singularische hebräische Konstruktion; „Feind“ kann dabei kollektiv oder allgemein verstanden werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, um seinen Charakter als offenbarten Bundesnamen sichtbar zu halten.
- issue: Unausgedrücktes Subjekt von וְשָׁבוּ
  choice: sie werden zurückkehren
  alternative: deine Kinder werden zurückkehren; die Verschleppten werden zurückkehren
  rationale: Der hebräische Text nennt das pluralische Subjekt in diesem Vers nicht ausdrücklich. „Sie“ bewahrt diese Knappheit; der Kontext legt Rahels Kinder beziehungsweise die Verschleppten als Bezug nahe, ohne dies grammatisch in den Vers einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Parallelität von Stimme/Weinen und Augen/Tränen sowie die knappe prophetische Verheißung bleiben erhalten.
