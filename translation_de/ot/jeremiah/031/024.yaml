base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/024.yaml
  text: And Judah and all its cities will dwell there together[a], farmers and those who journey with the flock.
translation:
  language: de
  text: 'Und Juda und alle seine Städte werden gemeinsam darin wohnen: Bauern und Menschen, die mit der Herde weiterziehen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und Hirten, die mit der Herde weiterziehen“. Wörtlich steht im Hebräischen: „und sie ziehen mit der Herde weiter“; wahrscheinlich sind Menschen gemeint, die mit ihren Herden umherziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: Und … werden darin wohnen
  rationale: יָשַׁב bezeichnet hier das Wohnen bzw. Ansässigsein. „Darin“ bewahrt den rückverweisenden Charakter des femininen Pronominalsuffixes an בְּ, ohne im Deutschen ein ungenanntes Bezugswort einzufügen; der Kontext trägt die futurische Wiedergabe.
- source_word: יְהוּדָה וְכָל עָרָיו
  choice: Juda und alle seine Städte
  rationale: Juda bezeichnet das Land beziehungsweise kollektiv seine Bevölkerung. Das maskuline Suffix an עָרָיו wird formal und im Deutschen natürlich mit „seine“ wiedergegeben.
- source_word: יַחְדָּו
  choice: gemeinsam
  rationale: Das Adverb bezeichnet das vereinte Zusammenwohnen; „gemeinsam“ ist aktuell und idiomatisch.
- source_word: אִכָּרִים
  choice: Bauern
  rationale: Das Wort bezeichnet Menschen, die den Boden bearbeiten. „Bauern“ ist die klare moderne Entsprechung, während „Pflüger“ den Tätigkeitsbereich unnötig verengt.
- source_word: וְנָסְעוּ בָּעֵדֶר
  choice: und Menschen, die mit der Herde weiterziehen
  rationale: נָסַע bedeutet aufbrechen oder weiterziehen; zusammen mit עֵדֶר beschreibt es offenbar Menschen, die ihre Herde begleiten. Die Umschreibung vermeidet es, das im Hebräischen nicht ausdrücklich genannte „Hirten“ in den Haupttext einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die nachgestellten Bevölkerungsgruppen als Erläuterung zu den Bewohnern verständlich. „Darin“ erhält den anaphorischen Bezug des hebräischen בָהּ; die mögliche Deutung von וְנָסְעוּ als Hirten beziehungsweise wandernde Viehhalter bleibt durch die Fußnote offen.
