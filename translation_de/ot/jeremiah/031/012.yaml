source:
  edition: WLC
  text: וּ/בָאוּ֮ וְ/רִנְּנ֣וּ בִ/מְרוֹם צִיּוֹן֒ וְ/נָהֲר֞וּ אֶל ט֣וּב יְהוָ֗ה עַל דָּגָן֙ וְ/עַל תִּירֹ֣שׁ וְ/עַל יִצְהָ֔ר וְ/עַל בְּנֵי צֹ֖אן וּ/בָקָ֑ר וְ/הָיְתָ֤ה נַפְשָׁ/ם֙ כְּ/גַ֣ן רָוֶ֔ה וְ/לֹא יוֹסִ֥יפוּ לְ/דַאֲבָ֖ה עֽוֹד־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/012.yaml
  text: They will come and shout for joy on the height of Zion[a], and they will stream to the goodness of Yahweh, to the grain, the new wine, and the fresh oil, and to the young of the flock and the herd. Their life will be like a well-watered garden[d][c][b], and they will never again waste away.
translation:
  language: de
  text: 'Sie werden kommen und auf Zions Höhe jubeln. Sie werden zu Jahwes Güte[a] strömen[b]: zum Getreide, zum jungen Wein und zum frischen Öl, zu den Jungtieren von Schafen und Rindern. Ihr Leben[c] wird wie ein gut bewässerter Garten sein, und sie werden nie mehr dahinsiechen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Jahwes Fülle“. Das hebräische Wort für „Güte“ schließt hier die guten Gaben ein, die anschließend aufgezählt werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich im Bild: „sie werden hinströmen“. Das Verb beschreibt eine fließende Bewegung auf Jahwes Segensgaben zu.'
    reason: lexical_image
  - marker: c
    text: 'Hebräisch: „ihre nefesch“. Gemeint ist hier ihr Leben oder ihr ganzes Selbst, nicht nur ein immaterieller Teil des Menschen.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „sie werden keinen Kummer mehr haben“ beziehungsweise „nicht länger verschmachten“. Das hebräische Verb kann von einem kummervollen Dahinwelken sprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְרִנְּנוּ
  choice: Sie werden kommen und … jubeln
  rationale: Die Perfektformen mit וְ stehen im prophetischen Verheißungszusammenhang futurisch. „Jubeln“ gibt den lauten, freudigen Ausdruck von רנן natürlich wieder.
- source_word: בִמְרוֹם צִיּוֹן
  choice: auf Zions Höhe
  rationale: מָרוֹם steht im Singular und bezeichnet den erhöhten Ort Zion. Die Formulierung ist knapp, idiomatisch und bewahrt das Höhenbild.
- source_word: וְנָהֲרוּ
  choice: sie werden … strömen
  rationale: נהר bezeichnet hier angesichts der Richtungsangabe אֶל eine strömende Bewegung hin zu Jahwes Gaben. Das Bewegungsbild bleibt im Deutschen erhalten.
- source_word: אֶל טוּב יְהוָה
  choice: zu Jahwes Güte
  rationale: טוּב bezeichnet sowohl Güte als auch die daraus hervorgehende Fülle guter Gaben. Die anschließende Aufzählung entfaltet die konkrete Bedeutung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַל דָּגָן וְעַל תִּירֹשׁ וְעַל יִצְהָר
  choice: zum Getreide, zum jungen Wein und zum frischen Öl
  rationale: Die wiederholte Präposition führt die konkreten Gaben näher aus. תִּירוֹשׁ ist junger Wein; יִצְהָר bezeichnet frisches, insbesondere aus Oliven gewonnenes Öl.
- source_word: בְּנֵי צֹאן וּבָקָר
  choice: die Jungen der Schafe und Rinder
  rationale: בְּנֵי bezeichnet wörtlich die Nachkommen beziehungsweise Jungtiere und sollte nicht zu einer allgemeinen Aussage über Herden verflacht werden.
- source_word: וְהָיְתָה נַפְשָׁם
  choice: Ihr Leben wird … sein
  rationale: נֶפֶשׁ meint hier das lebendige Selbst beziehungsweise das ganze Leben, nicht lediglich einen immateriellen Seelenteil.
- source_word: כְּגַן רָוֶה
  choice: wie ein gut bewässerter Garten
  rationale: רָוֶה bezeichnet reichliche Wasserversorgung und damit einen üppig gedeihenden Garten.
- source_word: וְלֹא יוֹסִיפוּ לְדַאֲבָה עוֹד
  choice: sie werden nie mehr dahinsiechen
  rationale: Die Konstruktion bedeutet „nicht wieder/weiter“. דָּאַב verbindet Kummer mit körperlichem Vergehen; „dahinsiechen“ bewahrt diese Spannung.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der persönliche Gottesname. Die Umschrift „Jahwe“ macht diesen Namen sichtbar, ohne ihn durch den Titel „Herr“ zu ersetzen.
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: Leben
  alternative: Seele
  rationale: Die Aussage betrifft den ganzen lebendigen Menschen in seiner erneuerten Lebenskraft. „Seele“ könnte im heutigen Deutsch unbeabsichtigt auf einen vom Körper getrennten inneren Teil verengt werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Kurze Hauptsätze und der Doppelpunkt lassen die Bewegung von der allgemeinen Güte Jahwes zu den konkreten Gaben hervortreten. Das Bild des Strömens und die ganzheitliche Bedeutung von נֶפֶשׁ bleiben erhalten.
