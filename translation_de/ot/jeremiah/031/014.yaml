    issue: Redundante Formulierung „mit reicher Fülle sättigen“
    rationale: „Reich“ und „Fülle“ übermitteln weitgehend dieselbe Intensivierung. „Reichlich sättigen“ ist modernes, idiomatisches Deutsch und wahrt den Sinn von רוה/דשן.
  - severity: medium
