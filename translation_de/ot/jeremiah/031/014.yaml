revisions:
- from: Ich werde die Priester mit reicher Fülle sättigen[a], und mein Volk wird an meinen guten Gaben satt werden[b] – so spricht Jahwe.
  to: Ich werde die Priester reichlich sättigen[a], und mein Volk wird von meinen guten Gaben satt werden[b] – Spruch Jahwes.
  rationale: Die Revision beseitigt die stilistische Doppelung im ersten Satzteil und präzisiert die Fußnote zu נפש. Der Haupttext bleibt im Versorgungskontext konkret; die Fußnote bewahrt die weitere Bedeutung von טוּבִי. „Spruch Jahwes“ gibt נְאֻם־יְהוָה als knappe prophetische Formel präzise und in modernem Bibeldeutsch wieder.
