    rationale: נפש kann in bestimmten Kontexten mit Kehle/Hals zusammenhängen, bezeichnet hier aber idiomatisch die Person bzw. ihr Verlangen. Die Fußnote sollte deshalb „Seele/Verlangen“ nennen und die vollständige Wendung wiedergeben, statt „Kehle“ als Hauptliteralität nahezulegen.
  - severity: low
