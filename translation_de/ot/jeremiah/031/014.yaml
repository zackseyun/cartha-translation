  text: וְ/רִוֵּיתִ֛י נֶ֥פֶשׁ הַ/כֹּהֲנִ֖ים דָּ֑שֶׁן וְ/עַמִּ֛/י אֶת טוּבִ֥/י יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/014.yaml
  text: I will satisfy the priests with abundance[a], and my people will be filled with my goodness[c][b], declares Yahweh.
translation:
  language: de
  text: Ich werde die Priester reichlich sättigen[a], und mein Volk wird von meinen guten Gaben satt werden[b] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Seele/das Verlangen der Priester mit Fettigkeit [reicher Nahrung] tränken“. Gemeint ist volle Sättigung durch üppige Versorgung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Mein Volk wird an meiner Güte satt werden“ beziehungsweise „wird sich an meinem Guten sättigen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרִוֵּיתִי
  choice: Ich werde … sättigen
  rationale: Das Piel von רוה bezeichnet, jemanden reichlich trinken zu lassen bzw. völlig zu sättigen. Im Zusammenhang mit Versorgung gibt „sättigen“ den idiomatischen Sinn natürlich wieder.
- source_word: נֶפֶשׁ הַכֹּהֲנִים
  choice: die Priester
  rationale: נפש bezeichnet hier idiomatisch das Verlangen bzw. den Hunger der Priester, letztlich die Personen selbst. Im Deutschen ist die direkte Formulierung natürlicher; die wörtlichere Nuance wird in der Fußnote bewahrt.
- source_word: דָּשֶׁן
  choice: mit reicher Fülle
  rationale: דשן bedeutet wörtlich „Fett/Fettheit“ und bezeichnet übertragen gehaltvolle Nahrung, Wohlstand oder Überfluss. „Reiche Fülle“ erhält das Bild üppiger Versorgung in verständlichem Deutsch.
- source_word: וְעַמִּי
  choice: und mein Volk
  rationale: Direkte Wiedergabe des Bundesausdrucks mit Possessivsuffix.
- source_word: אֶת־טוּבִי
  choice: an meinen guten Gaben
  rationale: טוב kann Gottes Güte, seine Wohltaten oder konkrete gute Gaben meinen. „Gute Gaben“ passt zum Sättigungsmotiv, ohne die göttliche Herkunft des Guten aufzugeben.
- source_word: יִשְׂבָּעוּ
  choice: wird … satt werden
  rationale: שבע bedeutet, gesättigt zu sein oder genug zu haben. „Satt werden“ ist anschaulich, idiomatisch und wahrt den Parallelismus mit dem ersten Versteil.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Natürliche, würdige Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ gibt den Eigennamen erkennbar wieder und folgt der vorgegebenen Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von טוּבִי
  choice: meine guten Gaben
  alternative: meine Güte / mein Gutes
  rationale: Der Versorgungskontext legt konkrete Wohltaten nahe, doch der Ausdruck bleibt bewusst breit genug, um Gottes Güte als deren Ursprung mitzudenken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallelen Sättigungsverben bleiben erkennbar; der Gedankenstrich hebt die abschließende Gottesredeformel ab.
