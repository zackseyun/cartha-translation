id: JER.31.38
reference: Jeremiah 31:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים נְאֻם יְהוָ֑ה וְ/נִבְנְתָ֤ה הָ/עִיר֙ לַֽ/יהוָ֔ה מִ/מִּגְדַּ֥ל חֲנַנְאֵ֖ל שַׁ֥עַר הַ/פִּנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/038.yaml
  text: Behold[a], days are coming, declares Yahweh, when the city will be rebuilt for Yahweh, from the Tower of Hananel to the Corner Gate.
translation:
  language: de
  text: Siehe, es kommen Tage – Ausspruch Jahwes –, da wird die Stadt für Jahwe wieder aufgebaut[a], vom Turm Hananel bis zum Ecktor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgebaut“. Das hebräische Passiv kann sowohl Bauen als auch Wiederaufbauen bezeichnen; der Zusammenhang der Wiederherstellung spricht hier für „wieder aufgebaut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה יָמִים
  choice: Siehe, es kommen Tage
  rationale: Bewahrt die hervorhebende, prophetische Ankündigungsformel und gibt die hebräische Wendung in natürlichem, würdigem Deutsch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die formelhafte und autoritative Aussage als eingeschobene Prophetenformel knapp wieder.
- source_word: וְנִבְנְתָה
  choice: wird … wieder aufgebaut
  rationale: Das Nifal bezeichnet ein passives Bauen; der Wiederherstellungskontext Jerusalems legt im Deutschen „wieder aufgebaut“ nahe, ohne die allgemeinere Bedeutung des Verbs zu verschweigen.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Folgt dem hebräischen Wortlaut, ohne den kontextuell erschließbaren Namen Jerusalem in den Haupttext einzufügen.
- source_word: לַיהוָה
  choice: für Jahwe
  rationale: Das ל kann hier Zugehörigkeit oder Bestimmung ausdrücken; „für Jahwe“ bewahrt diesen Sinn in natürlichem Deutsch.
- source_word: מִמִּגְדַּל חֲנַנְאֵל
  choice: vom Turm Hananel
  rationale: מן kennzeichnet den Ausgangspunkt der räumlichen Ausdehnung; der Eigenname wird transliteriert.
- source_word: שַׁעַר הַפִּנָּה
  choice: bis zum Ecktor
  rationale: „Bis zum“ ergänzt im Deutschen idiomatisch das durch מן eröffnete räumliche Spektrum; „Ecktor“ gibt die Bezeichnung des Stadttores knapp wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bestimmung der wiederaufgebauten Stadt
  choice: für Jahwe
  alternative: Jahwe zu Ehren / dem Jahwe gehörend
  rationale: Die knappe Formulierung erhält die mögliche Bedeutungsbreite des ל zwischen Bestimmung, Zugehörigkeit und Widmung, ohne sie auf eine einzelne theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem prophetischem Ton. Die Parenthese „Ausspruch Jahwes“ bewahrt den formelhaften Charakter des Hebräischen; Ortsbezeichnungen bleiben knapp und verständlich.
