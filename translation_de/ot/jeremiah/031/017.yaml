source:
  edition: WLC
  text: וְ/יֵשׁ תִּקְוָ֥ה לְ/אַחֲרִיתֵ֖/ךְ נְאֻם יְהוָ֑ה וְ/שָׁ֥בוּ בָנִ֖ים לִ/גְבוּלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/017.yaml
  text: There is hope for your future[a], declares Yahweh[b], and your children will return to their own territory.
translation:
  language: de
  text: Es gibt Hoffnung für deine Zukunft[a], spricht Jahwe, und deine Kinder werden in ihr Gebiet zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hoffnung für dein Ende« beziehungsweise »für deinen Ausgang«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Doch es gibt
  rationale: Die Existenzformel wird natürlich wiedergegeben; das einleitende וְ knüpft kontrastierend an die vorausgehende Klage und den Aufruf an, nicht mehr zu weinen, an.
- source_word: תִּקְוָה
  choice: Hoffnung
  rationale: Das Substantiv bezeichnet Hoffnung beziehungsweise begründete Erwartung und passt zur zugesagten Wiederherstellung.
- source_word: לְאַחֲרִיתֵךְ
  choice: für deine Zukunft
  rationale: אַחֲרִית kann das spätere Ende, den Ausgang oder die Zukunft bezeichnen. Im Kontext der Rückkehr ist »Zukunft« klar und bewahrt die Vorwärtsrichtung der Zusage.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige deutsche prophetische Formel gibt die autoritative Gottesrede würdig und knapp wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Eigenname Gottes wird als »Jahwe« wiedergegeben.
- source_word: וְשָׁבוּ
  choice: und ... werden zurückkehren
  rationale: Das Perfekt bezeichnet im prophetischen Zusammenhang die gewiss zugesagte künftige Rückkehr.
- source_word: בָנִים
  choice: deine Kinder
  rationale: Das maskuline Pluralwort bezeichnet hier im Zusammenhang mit Rahel ihre Nachkommen insgesamt; das im Deutschen natürliche »Kinder« gibt den gemeinten Umfang wieder.
- source_word: לִגְבוּלָם
  choice: in ihr Gebiet
  rationale: גְּבוּל kann Grenze oder das durch Grenzen bestimmte Gebiet bezeichnen. Bei einer Rückkehr ist »in ihr Gebiet« im Deutschen natürlicher als »zu ihrer Grenze« und erhält den territorialen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen ausdrücklich. »Jahwe« gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von בָנִים
  choice: Kinder beziehungsweise Nachkommen insgesamt
  alternative: Söhne
  rationale: Die grammatisch männliche Form lässt eine wörtliche Wiedergabe als »Söhne« zu; im Kontext der als Mutter dargestellten Rahel bezeichnet sie jedoch die weggeführten Nachkommen kollektiv.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt wie im Hebräischen feminin singularisch und bezieht sich im Zusammenhang auf Rahel. Der Kontrastanschluss »Doch« verdeutlicht die Funktion des hebräischen וְ, ohne die Aussage zu überladen.
