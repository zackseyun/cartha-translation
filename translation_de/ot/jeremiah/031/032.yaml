source:
  edition: WLC
  text: לֹ֣א כַ/בְּרִ֗ית אֲשֶׁ֤ר כָּרַ֨תִּי֙ אֶת אֲבוֹתָ֔/ם בְּ/יוֹם֙ הֶחֱזִיקִ֣/י בְ/יָדָ֔/ם לְ/הוֹצִיאָ֖/ם מֵ/אֶ֖רֶץ מִצְרָ֑יִם אֲשֶׁר הֵ֜מָּה הֵפֵ֣רוּ אֶת בְּרִיתִ֗/י וְ/אָנֹכִ֛י בָּעַ֥לְתִּי בָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/032.yaml
  text: not like the covenant that I made with their fathers on the day I took them by the hand to bring them out of the land of Egypt[a], my covenant that they themselves broke, though I was their husband, declares Yahweh.
translation:
  language: de
  text: nicht wie der Bund, den ich mit ihren Vätern schloss an dem Tag, als ich sie bei der Hand nahm, um sie aus dem Land Ägypten herauszuführen – mein Bund, den sie selbst brachen, obwohl ich ihr Ehemann war[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „obwohl ich ihr Herr war“ beziehungsweise „obwohl ich über sie herrschte“. Das hebräische Verb kann sowohl eheliche als auch herrschaftliche Sprache ausdrücken. Die in Hebräer 8,9 zitierte griechische Fassung weicht hier ab und lautet sinngemäß: „und ich missachtete sie“ beziehungsweise „ich kümmerte mich nicht um sie“.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא כַבְּרִית
  choice: nicht wie der Bund
  rationale: Das Präfix כ bezeichnet einen Vergleich. „Nicht wie“ gibt diese vergleichende Aussage im Deutschen klar und natürlich wieder.
- source_word: כָּרַתִּי
  choice: den ich … schloss
  rationale: Die hebräische Wendung lautet wörtlich „einen Bund schneiden“; im Deutschen ist „einen Bund schließen“ die entsprechende feste Wendung.
- source_word: אֶת אֲבוֹתָם
  choice: mit ihren Vätern
  rationale: „Väter“ bewahrt die familiär-geschichtliche Ausdrucksweise des Hebräischen; die deutsche Bundessprache verlangt hier „mit“.
- source_word: בְּיוֹם הֶחֱזִיקִי בְיָדָם
  choice: an dem Tag, als ich sie bei der Hand nahm
  rationale: Die Formulierung bewahrt sowohl den Zeitbezug als auch das anschauliche Bild des festen Ergreifens und Führens.
- source_word: לְהוֹצִיאָם מֵאֶרֶץ מִצְרָיִם
  choice: um sie aus dem Land Ägypten herauszuführen
  rationale: Der Hifil von יצא bezeichnet das Herausführen; die Formulierung entspricht dem Exoduszusammenhang und klingt im Deutschen natürlich.
- source_word: אֲשֶׁר הֵמָּה הֵפֵרוּ אֶת בְּרִיתִי
  choice: mein Bund, den sie selbst brachen
  rationale: Das selbstständige Pronomen הֵמָּה ist betont und wird durch „sie selbst“ wiedergegeben. הפר bezeichnet hier das Brechen eines Bundes.
- source_word: וְאָנֹכִי בָּעַלְתִּי בָם
  choice: obwohl ich ihr Ehemann war
  rationale: „Obwohl“ bringt den Gegensatz zwischen ihrem Bundesbruch und Jahwes Verhältnis zu ihnen zum Ausdruck. בעל kann im Kontext eheliche Sprache bezeichnen; die alternative Herrschaftsbedeutung bleibt in der Fußnote erhalten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht Jahwe“ ist eine würdige und geläufige deutsche Wiedergabe der prophetischen Botenformel und gibt den Gottesnamen als Namen wieder.
theological_decisions:
- issue: Bedeutung von בָּעַלְתִּי בָם in der Bundesaussage
  choice: obwohl ich ihr Ehemann war
  alternative: obwohl ich ihr Herr war; obwohl ich über sie herrschte
  rationale: Der masoretische Text lässt im Bundeszusammenhang eine eheliche Metapher naheliegen. Da das Verb zugleich Herrschaftssprache tragen kann und die in Hebräer 8,9 zitierte griechische Fassung die andere Bedeutungsrichtung widerspiegelt, wird diese Spannung nicht stillschweigend aufgelöst, sondern in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an Bildsprache und Satzbau des Hebräischen. Der Gedankenstrich verdeutlicht die wiederaufnehmende Apposition „mein Bund“, ohne den Satz in mehrere Aussagen aufzulösen.
