base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/025.yaml
  text: For I have satisfied the weary soul[b][a], and every faint soul I have filled.
translation:
  language: de
  text: Denn ich habe die erschöpfte Seele erquickt[a] und jede verschmachtende Seele[b] erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich schwingt mit: „reichlich zu trinken gegeben“; auch „gesättigt“ oder „erfrischt“.'
    reason: lexical_alternative
  - marker: b
    text: Auch „bekümmerte“, „trauernde“ oder „kraftlose Seele“. Das hebräische Wort kann Gram und Hinschwinden bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Verheißung; „Denn“ bewahrt diesen Zusammenhang im Deutschen.
- source_word: הִרְוֵיתִי
  choice: habe … erquickt
  rationale: Der Hifil von רוה bezeichnet, jemanden reichlich trinken zu lassen und dadurch zu erfrischen oder zu sättigen. „Erquickt“ gibt das Bild in gehobener, aber verständlicher Sprache wieder, ohne ausdrücklich „Durst“ hinzuzufügen.
- source_word: נֶפֶשׁ עֲיֵפָה
  choice: die erschöpfte Seele
  rationale: נֶפֶשׁ bezeichnet hier den Menschen in seiner inneren Lebenskraft; „Seele“ erhält die poetische Wiederholung. עֲיֵפָה beschreibt starke Müdigkeit oder Erschöpfung.
- source_word: וְכָל נֶפֶשׁ
  choice: und jede … Seele
  rationale: Die Verbindung und der distributive Ausdruck werden direkt und natürlich wiedergegeben; die Wiederholung von „Seele“ bewahrt den Parallelismus.
- source_word: דָּאֲבָה
  choice: verschmachtende
  rationale: Das seltene Wort kann körperliches Hinschwinden ebenso wie Kummer und Gram bezeichnen. „Verschmachtend“ erhält diese Schwebe und passt zur Wiederherstellung erschöpfter Lebenskraft.
- source_word: מִלֵּאתִי
  choice: habe … erfüllt
  rationale: Der Piel von מלא bedeutet „füllen, voll machen“. „Erfüllt“ bewahrt die konkrete Vorstellung von Fülle, klingt mit „Seele“ im Deutschen jedoch natürlicher als „gefüllt“.
theological_decisions:
- issue: Anthropologische Bedeutung von נֶפֶשׁ
  choice: In beiden Vershälften mit „Seele“ wiedergegeben
  alternative: „Mensch“, „Leben“ oder „Inneres“
  rationale: Die poetische Aussage betrifft den ganzen Menschen in seiner Lebenskraft. „Seele“ wahrt die Bildsprache und den Parallelismus, ohne damit eine bestimmte Leib-Seele-Lehre festzulegen.
- issue: Zeitbezug der hebräischen Perfektformen
  choice: 'Deutsches Perfekt: „habe … erquickt“ und „habe … erfüllt“'
  alternative: Präsens („erquicke“, „erfülle“) oder Futur („werde … erquicken“, „werde … erfüllen“)
  rationale: Die Perfektformen können eine vollzogene oder prophetisch als gewiss dargestellte Handlung bezeichnen. Das deutsche Perfekt hält die Form offen, ohne die Verheißung einseitig als Vergangenheit oder Zukunft festzulegen.
- issue: Bedeutungsbreite von דָּאֲבָה
  choice: „verschmachtende“
  alternative: „bekümmerte“, „trauernde“ oder „kraftlose“
  rationale: Der Ausdruck lässt sowohl Gram als auch körperliches Hinschwinden anklingen. Die Übersetzung vermeidet es, die Not ausschließlich psychisch oder körperlich zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Parallelismus. „Erquickt“ und „verschmachtend“ sind leicht gehoben, bleiben jedoch verständlich und tragen die Wasser-, Erschöpfungs- und Füllebildsprache des hebräischen Textes.
