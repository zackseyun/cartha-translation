source:
  edition: WLC
  text: מֵ/רָח֕וֹק יְהוָ֖ה נִרְאָ֣ה לִ֑/י וְ/אַהֲבַ֤ת עוֹלָם֙ אֲהַבְתִּ֔י/ךְ עַל כֵּ֖ן מְשַׁכְתִּ֥י/ךְ חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/003.yaml
  text: 'From far away Yahweh appeared to me: “I have loved you with an everlasting love[b][a]; therefore I have drawn you with steadfast love.”'
translation:
  language: de
  text: 'Aus der Ferne[a] erschien mir Jahwe:


    „Mit ewiger Liebe habe ich dich geliebt;


    darum habe ich dich mit beständiger Güte[b] gezogen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Jahwe erschien mir von fern.“ Die Stellung von „aus der Ferne“ lässt die genaue Zuordnung im Satz offen; im Zusammenhang kann die Wendung auch zeitlich („vor langer Zeit“) verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Hebräisch חֶסֶד bezeichnet gütige, beständige und loyale Zuwendung. Die Wortverbindung mit „gezogen“ wird auch idiomatisch als fortgesetzte bzw. erwiesene Güte verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרָחוֹק
  choice: Aus der Ferne
  rationale: Die Wendung bezeichnet zunächst räumliche Entfernung und bewahrt das Bild des hebräischen Textes. Daneben ist im Zusammenhang auch ein zeitliches Verständnis möglich; dies wird in einer Fußnote offengehalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נִרְאָה לִי
  choice: erschien mir
  rationale: Der Nifal von ראה bedeutet hier idiomatisch „erscheinen“; לִי bezeichnet die Person, der Jahwe erschien.
- source_word: וְאַהֲבַת עוֹלָם
  choice: Mit ewiger Liebe
  rationale: עוֹלָם bezeichnet hier eine Liebe von unbegrenzter Dauer. „Ewig“ ist im modernen Deutschen klar und würdig; ein möglicher zeitlicher Rückbezug im Sinn von „seit alters“ wird durch den Kontext nicht völlig ausgeschlossen.
- source_word: אֲהַבְתִּיךְ
  choice: habe ich dich geliebt
  rationale: Das deutsche Perfekt gibt die vollzogene und weiterhin wirksame Liebe natürlich wieder. Das feminine Suffix richtet sich im Kontext an Israel.
- source_word: עַל כֵּן
  choice: darum
  rationale: „Darum“ gibt die Folgerung knapp und natürlich wieder.
- source_word: מְשַׁכְתִּיךְ
  choice: habe ich dich … zu mir gezogen
  rationale: משך bedeutet „ziehen“. „Zu mir“ macht die im Bild naheliegende Zielrichtung im Deutschen verständlich, ohne die mögliche idiomatische Deutung zu verdecken.
- source_word: חָסֶד
  choice: treue Güte
  rationale: Die Verbindung wahrt sowohl den Aspekt gnädiger Zuwendung als auch den der beständigen, loyalen Verbundenheit und unterscheidet חֶסֶד von אַהֲבָה.
theological_decisions:
- issue: Verhältnis von אַהֲבָה und חֶסֶד
  choice: Die beiden verwandten Begriffe werden als „Liebe“ und „treue Güte“ unterschieden.
  alternative: Beide Begriffe mit „Liebe“ wiedergeben oder חֶסֶד als „Bundestreue“ übersetzen.
  rationale: Die Unterscheidung erhält die sprachliche Struktur des Hebräischen. „Treue Güte“ bewahrt die Bundesnähe von חֶסֶד, ohne den Begriff auf eine einzige theologische Kategorie einzuengen.
- issue: Bedeutung von משך mit חֶסֶד
  choice: Das konkrete Bild „mit treuer Güte zu mir gezogen“ bleibt im Haupttext erhalten.
  alternative: 'Idiomatish: „darum habe ich dir meine Güte bewahrt/fortdauern lassen“.'
  rationale: Die konkrete Bedeutung des Verbs ist gut verständlich und theologisch offen. Weil die Verbindung auch als fortgesetzte Zuwendung verstanden werden kann, wird diese Möglichkeit in der Fußnote genannt.
- issue: Zeitbezug der Verbformen
  choice: 'Deutsches Perfekt: „habe ich … geliebt/gezogen“.'
  alternative: 'Präteritum: „liebte/ zog ich dich“.'
  rationale: Das Perfekt lässt die vergangenen Taten als für die Gegenwart wirksam erscheinen, ohne eine besondere dogmatische Aspektlehre festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengliederung. Der Gottesname wird als „Jahwe“ wiedergegeben. Die Wiederholung von „Liebe“ im ersten Satzteil folgt bewusst dem hebräischen Ausdruck; „treue Güte“ hält den davon unterschiedenen Begriff חֶסֶד erkennbar.
