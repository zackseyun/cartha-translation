source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ע֣וֹד יֹאמְר֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בְ/עָרָ֔י/ו בְּ/שׁוּבִ֖/י אֶת שְׁבוּתָ֑/ם יְבָרֶכְ/ךָ֧ יְהוָ֛ה נְוֵה צֶ֖דֶק הַ֥ר הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/023.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: They will yet say this word in the land of Judah and in its cities, when I restore their fortunes: “May Yahweh bless you, O habitation of righteousness[b], O holy mountain.”'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen, der Gott Israels: Wieder wird man im Land Juda und in seinen Städten dieses Wort sagen, wenn ich ihr Geschick wende[a]: »Jahwe segne dich, du Wohnstätte der Gerechtigkeit[b], du heiliger Berg!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn ich ihre Gefangenen zurückbringe« beziehungsweise »wenn ich sie aus der Gefangenschaft zurückführe«. Die hebräische Wendung kann besonders die Rückkehr aus dem Exil, aber auch eine umfassendere Wiederherstellung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Stätte der Gerechtigkeit« beziehungsweise »Weide der Gerechtigkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben. »Herr der Heerscharen« ist im Deutschen die geläufige, würdevolle Wiedergabe des festen Titels und lässt dessen umfassenden Bezug offen.
- source_word: עוֹד יֹאמְרוּ אֶת־הַדָּבָר הַזֶּה
  choice: Noch wird man ... dieses Wort sagen
  rationale: »Noch« trägt die prophetische Erwartung, dass dieser Ausspruch künftig wieder zu hören sein wird. Das unbestimmte deutsche »man« gibt die nicht näher bezeichnete dritte Person Plural natürlich wieder.
- source_word: בְּאֶרֶץ יְהוּדָה וּבְעָרָיו
  choice: im Land Juda und in seinen Städten
  rationale: Das Suffix bezieht sich auf Juda als Land beziehungsweise Gebiet; »seinen Städten« ist im Deutschen idiomatisch.
- source_word: בְּשׁוּבִי אֶת־שְׁבוּתָם
  choice: wenn ich ihr Geschick wende
  rationale: Die geläufige deutsche Wendung bewahrt den weiteren Sinn einer Wiederherstellung, ohne den im Kontext naheliegenden Bezug auf Exil und Heimkehr auszuschließen.
- source_word: יְבָרֶכְךָ
  choice: Jahwe segne dich
  rationale: Der deutsche Konjunktiv I bringt den jussivischen beziehungsweise segnenden Charakter knapp und würdevoll zum Ausdruck.
- source_word: נְוֵה צֶדֶק
  choice: Wohnstätte der Gerechtigkeit
  rationale: »Wohnstätte« bewahrt den räumlichen Sinn von נָוֶה, ohne ihn auf »Weide« festzulegen; »Gerechtigkeit« gibt צֶדֶק in seiner moralisch-religiösen Weite wieder.
- source_word: הַר הַקֹּדֶשׁ
  choice: heiliger Berg
  rationale: Die traditionelle und sachlich genaue Bezeichnung für Zion als geheiligten Berg.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als solcher bewahrt und nicht durch einen Titel ersetzt.
- issue: Deutung der Wendung שׁוּב שְׁבוּת
  choice: ihr Geschick wenden
  alternative: ihre Gefangenen zurückbringen; sie aus der Gefangenschaft zurückführen
  rationale: Die gewählte Formulierung hält die umfassendere Wiederherstellung und die konkrete Rückkehr aus dem Exil zugleich als Bedeutungsmöglichkeiten offen.
- issue: Bezug von נְוֵה צֶדֶק und הַר הַקֹּדֶשׁ
  choice: Anrede an Zion beziehungsweise Jerusalem, ohne den Namen einzufügen
  alternative: ausdrückliche Ergänzung »Jerusalem/Zion«
  rationale: Die poetischen Titel werden unmittelbar übersetzt; der im Kontext erkennbare Bezug wird nicht durch eine im hebräischen Text fehlende Benennung vereindeutigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der prophetische Ton und die poetische Anrede bleiben erhalten; ungebräuchliche Wortstellung und unnötige Archaismen werden vermieden.
