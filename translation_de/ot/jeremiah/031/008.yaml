source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא אוֹתָ֜/ם מֵ/אֶ֣רֶץ צָפ֗וֹן וְ/קִבַּצְתִּי/ם֮ מִ/יַּרְכְּתֵי אָרֶץ֒ בָּ֚/ם עִוֵּ֣ר וּ/פִסֵּ֔חַ הָרָ֥ה וְ/יֹלֶ֖דֶת יַחְדָּ֑ו קָהָ֥ל גָּד֖וֹל יָשׁ֥וּבוּ הֵֽנָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/008.yaml
  text: Behold[a], I am bringing them from the land of the north, and I will gather them from the farthest parts of the earth. Among them are the blind and the lame, the pregnant woman and the woman in labor, together; a great assembly will return here.
translation:
  language: de
  text: Siehe, ich bringe sie aus dem Land des Nordens und sammle sie von den fernsten Enden der Erde[a]. Unter ihnen sind Blinde und Lahme, Schwangere und Gebärende, alle miteinander. Eine große Schar wird hierher zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von den fernsten Enden des Landes«. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang »Erde« oder »Land« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Bewahrt den feierlichen prophetischen Aufmerksamkeitsruf; im modernen Deutsch gehoben, aber verständlich.
- source_word: מֵבִיא
  choice: ich bringe
  rationale: Das Partizip mit הִנְנִי bezeichnet eine unmittelbar bevorstehende oder als gewiss dargestellte Handlung; das Präsens erhält diese Anschaulichkeit.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: aus dem Land des Nordens
  rationale: Gibt die geografische Wendung eng wieder, ohne sie vorschnell ausschließlich mit Babylon gleichzusetzen.
- source_word: וְקִבַּצְתִּים
  choice: und sammle sie
  rationale: Sammeln ist die natürliche deutsche Entsprechung und bewahrt die in Jeremia wiederkehrende Sprache der Wiederherstellung.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  choice: von den fernsten Enden der Erde
  rationale: יַרְכְּתֵי bezeichnet entlegene äußerste Bereiche. Die Formulierung gibt die räumliche Weite idiomatisch wieder; die mögliche Bedeutung »Land« wird in der Fußnote bewahrt.
- source_word: בָּם
  choice: Unter ihnen sind
  rationale: Kennzeichnet natürlich und klar, wer zu der gesammelten Gemeinschaft gehört.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: Blinde und Gehbehinderte
  rationale: Die substantivierten Gruppenbezeichnungen bewahren die knappe Aufzählung. »Gehbehinderte« gibt פִּסֵּחַ in heutigem, respektvollem Deutsch verständlich wieder.
- source_word: הָרָה וְיֹלֶדֶת
  choice: Schwangere und Gebärende
  rationale: Gibt die beiden femininen Formen prägnant wieder; יֹלֶדֶת bezeichnet hier eine Frau, die gebiert beziehungsweise in den Wehen liegt.
- source_word: יַחְדָּו
  choice: alle miteinander
  rationale: Bringt die Betonung der gemeinsamen Zugehörigkeit und Rückkehr natürlich zum Ausdruck.
- source_word: קָהָל גָּדוֹל
  choice: eine große Schar
  rationale: »Schar« ist im Kontext einer zurückkehrenden Menschenmenge natürlicher als »Versammlung«, ohne einen späteren kirchlichen Fachsinn einzutragen.
- source_word: יָשׁוּבוּ הֵנָּה
  choice: werden sie hierher zurückkehren
  rationale: Bewahrt sowohl die Rückkehrbedeutung von שׁוב als auch die gerichtete Ortsangabe »hierher«.
theological_decisions:
- issue: Die wiederhergestellte Gemeinschaft schließt besonders verletzliche Menschen ein
  choice: Blinde, Gehbehinderte, Schwangere und Gebärende werden ausdrücklich als Angehörige der zurückkehrenden Schar dargestellt.
  alternative: Die Aufzählung könnte lediglich als rhetorisches Bild für eine große Menge verstanden werden.
  rationale: Der Wortlaut bezeichnet diese Gruppen konkret als unter den Gesammelten befindlich. Die Übersetzung bewahrt diesen Akzent göttlicher Fürsorge, ohne ihn dogmatisch auszubauen.
- issue: Bedeutungsumfang von אֶרֶץ in מִיַּרְכְּתֵי אָרֶץ
  choice: Im Haupttext steht die weite geografische Bedeutung »Erde«.
  alternative: »Land« ist lexikalisch ebenfalls möglich.
  rationale: Die umfassende Sprache der Sammlung stützt hier »Erde«; weil אֶרֶץ kontextabhängig auch »Land« bedeuten kann, bleibt diese echte Mehrdeutigkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-feierlichem Auftakt. Die Satzführung bleibt klar und mündlich verständlich; traditionelle, heute missverständliche oder unnötig kirchlich geprägte Ausdrücke werden vermieden.
