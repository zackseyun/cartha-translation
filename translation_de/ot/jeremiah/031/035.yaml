source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה נֹתֵ֥ן שֶׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם חֻקֹּ֛ת יָרֵ֥חַ וְ/כוֹכָבִ֖ים לְ/א֣וֹר לָ֑יְלָה רֹגַ֤ע הַ/יָּם֙ וַ/יֶּהֱמ֣וּ גַלָּ֔י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/035.yaml
  text: 'Thus says Yahweh[a], who gives the sun for light by day, the fixed order of the moon and stars for light by night[b], who stirs up the sea so that its waves roar—Yahweh of hosts is his name:'
translation:
  language: de
  text: So spricht Jahwe, der die Sonne zum Licht am Tag gibt, die festen Ordnungen des Mondes und der Sterne zum Licht in der Nacht[a], der das Meer aufwühlt, sodass seine Wellen brausen[b] – Jahwe der Heerscharen ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Satzungen des Mondes und der Sterne“. Das hebräische Wort kann festgesetzte Satzungen oder eine beständige Ordnung bezeichnen; hier bezieht es sich auf die regelmäßige Ordnung der Himmelskörper.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Er beruhigt das Meer“. Das hebräische Verb kann andernorts diese Bedeutung haben; hier spricht das anschließende Brausen der Wellen jedoch für „aufwühlen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige prophetische Botenformel wird knapp und würdevoll wiedergegeben; das Tetragramm erscheint als persönlicher Name „Jahwe“.
- source_word: נֹתֵן שֶׁמֶשׁ לְאוֹר יוֹמָם
  choice: Er gibt die Sonne als Licht für den Tag
  rationale: Das Partizip beschreibt Jahwes fortdauerndes Handeln. Die Präposition לְ bezeichnet hier die Funktion der Sonne.
- source_word: חֻקֹּת יָרֵחַ וְכוֹכָבִים
  choice: die festen Ordnungen von Mond und Sternen
  rationale: חֻקּוֹת kann Satzungen, Ordnungen oder festgesetzte Regelmäßigkeiten bezeichnen. Im kosmischen Zusammenhang sind die beständigen Ordnungen der Himmelskörper gemeint, ohne den Rechtsbegriff unnötig in den Vordergrund zu stellen.
- source_word: לְאוֹר לָיְלָה
  choice: als Licht für die Nacht
  rationale: Die Formulierung bewahrt die Parallelität zur Sonne als Licht für den Tag.
- source_word: רֹגַע הַיָּם
  choice: Er wühlt das Meer auf
  rationale: Obwohl das Verb andernorts auch ein Beruhigen bezeichnen kann, legt die unmittelbar folgende Aussage vom Brausen der Wellen hier ein Aufwühlen nahe.
- source_word: וַיֶּהֱמוּ גַלָּיו
  choice: sodass seine Wellen brausen
  rationale: Die deutsche Folgekonstruktion gibt den Zusammenhang mit dem vorhergehenden Aufwühlen natürlich wieder; „brausen“ erfasst Bewegung und lautes Tosen.
- source_word: יְהוָה צְבָאוֹת שְׁמוֹ
  choice: Jahwe der Heerscharen ist sein Name
  rationale: „Heerscharen“ wahrt die Weite des traditionellen Gottestitels und vermeidet eine vorschnelle Beschränkung auf menschliche Heere.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet das Tetragramm als persönlichen Gottesnamen. „Jahwe“ gibt diesen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רֹגַע beim Meer
  choice: wühlt das Meer auf
  alternative: beruhigt oder stillt das Meer
  rationale: Die Aussage, dass die Wellen daraufhin brausen, stützt im vorliegenden Zusammenhang die Bedeutung „aufwühlen“. Die mögliche andere Bedeutung wird in einer Fußnote offengelegt.
- issue: Kosmische Bedeutung von חֻקּוֹת
  choice: feste Ordnungen
  alternative: Satzungen oder Ordnungen
  rationale: Im Zusammenhang von Sonne, Mond und Sternen bezeichnet der Ausdruck die von Gott gesetzte Regelmäßigkeit, ohne dass die rechtliche Bedeutungsnuance des Wortes völlig ausgeschlossen wird.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. „Heerscharen“ bleibt als verständlicher, traditionsnaher Gottestitel erhalten. Die beiden möglichen lexikalischen Mehrdeutigkeiten werden nicht verdeckt, sondern durch Fußnoten ausgewiesen.
