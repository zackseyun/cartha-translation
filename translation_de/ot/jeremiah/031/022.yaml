  text: עַד מָתַי֙ תִּתְחַמָּקִ֔י/ן הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה כִּֽי בָרָ֨א יְהוָ֤ה חֲדָשָׁה֙ בָּ/אָ֔רֶץ נְקֵבָ֖ה תְּס֥וֹבֵֽב גָּֽבֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/022.yaml
  text: 'How long will you waver[c][b][a], faithless daughter? For Yahweh has created a new thing in the land: a woman will surround a man.'
translation:
  language: de
  text: 'Wie lange wirst du noch ausweichen[a], du abtrünnige Tochter[b]? Denn Jahwe hat etwas Neues im Land[c] geschaffen: Eine Frau wird einen Mann umgeben[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Wie lange wirst du dich noch abwenden?“ oder „Wie lange wirst du noch umherschweifen?“'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „du eigensinnige Tochter“ oder „du abtrünnig gewordene Tochter“. Das hebräische Wort bezeichnet bei Jeremia die Abkehr aus der Bundesbeziehung.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „auf der Erde“. Im Zusammenhang ist wahrscheinlich das Land Israel gemeint.'
    reason: lexical_alternative
  - marker: d
    text: 'Der letzte Satz ist schwer verständlich und stark umstritten. Er wird hier möglichst unmittelbar als „Eine Frau wird einen Mann umgeben“ wiedergegeben. Vorgeschlagen wurden unter anderem: „Eine Frau wird um einen Mann werben“, „die Schwache wird den Starken überwinden“ oder ein Bild dafür, dass Israel zu Jahwe zurückkehrt.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתְחַמָּקִין
  choice: willst du dich noch entziehen
  rationale: Das Verb חמק bezeichnet ein Ausweichen, Sichentziehen oder Abwenden. „Dich entziehen“ bewahrt die Vorstellung einer ausweichenden Bewegung und passt zum Aufruf zur Umkehr, ohne eine rein körperliche Bewegung festzulegen.
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: du abtrünnige Tochter
  rationale: שׁוֹבֵבָה bezeichnet bei Jeremia eine widerspenstige, abtrünnige oder vom Bund abgekehrte Haltung. „Abtrünnige Tochter“ bewahrt die weibliche Anrede und ihren bundestheologischen Ernst.
- source_word: כִּי
  choice: Denn
  rationale: כִּי leitet hier die Begründung für die vorausgehende Frage ein.
- source_word: בָרָא
  choice: hat ... geschaffen
  rationale: Die Qatal-Form wird als vollendete Handlung mit gegenwärtiger Bedeutung wiedergegeben. Ein prophetischer Zukunftsbezug bleibt möglich, wird aber nicht in den Text hineingezwungen.
- source_word: חֲדָשָׁה
  choice: etwas Neues
  rationale: Das substantivisch gebrauchte Adjektiv bleibt bewusst offen; „etwas Neues“ ist im modernen Deutschen natürlich und präzise.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der Zusammenhang der Wiederherstellung Israels legt hier „Land“ nahe, ohne die andere Möglichkeit zu verschweigen.
- source_word: נְקֵבָה
  choice: eine Frau
  rationale: נְקֵבָה bedeutet wörtlich „weiblich“ beziehungsweise „eine weibliche Person“. Im menschlichen Beziehungskontext ist „eine Frau“ die natürliche deutsche Wiedergabe.
- source_word: תְּסוֹבֵב
  choice: wird ... umgeben
  rationale: סבב bedeutet grundlegend „umgeben“, „umringen“ oder „ringsherum gehen“. Wegen der rätselhaften Gesamtaussage bleibt der Haupttext bei diesem konkreten lexikalischen Sinn.
- source_word: גָּבֶר
  choice: einen Mann
  rationale: גֶּבֶר bezeichnet einen Mann und kann Stärke mitschwingen lassen. „Mann“ ist hier die transparenteste Wiedergabe und vermeidet eine unbelegte Präzisierung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen stehende Eigenname erkennbar bleibt.
theological_decisions:
- issue: Deutung der rätselhaften Wendung נְקֵבָה תְּסוֹבֵב גָּבֶר
  choice: Das konkrete Bild „Eine Frau wird einen Mann umgeben“ bleibt im Haupttext stehen.
  alternative: Unter anderem wurden „Eine Frau wird um einen Mann werben“, „die Schwache wird den Starken überwinden“, „Israel wird zu Jahwe zurückkehren“ und „eine Frau wird einen Mann beschützen“ vorgeschlagen.
  rationale: Die einzelnen Wörter sind vergleichsweise klar, die Aussage als Ganze ist jedoch stark umstritten. Eine deutende Paraphrase würde die echte Mehrdeutigkeit vorschnell auflösen.
- issue: Zeitlicher Aussagewert von בָרָא
  choice: 'Perfekt: „hat ... geschaffen“'
  alternative: „wird ... schaffen“ oder „schafft“
  rationale: Die Wiedergabe folgt zunächst der hebräischen Qatal-Form. Ein prophetisch auf die Zukunft gerichteter Sinn bleibt aufgrund des Zusammenhangs möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und das rätselhafte Schlussbild bleiben erhalten. „Abtrünnig“ ist bewusst stärker als „wankelmütig“, da שׁוֹבֵבָה bei Jeremia eine bundeshafte Abkehr bezeichnet; die Fußnote bietet weniger festgelegte Alternativen.
