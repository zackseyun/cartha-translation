  text: בִּ/בְכִ֣י יָבֹ֗אוּ וּֽ/בְ/תַחֲנוּנִים֮ אֽוֹבִילֵ/ם֒ אֽוֹלִיכֵ/ם֙ אֶל נַ֣חֲלֵי מַ֔יִם בְּ/דֶ֣רֶךְ יָשָׁ֔ר לֹ֥א יִכָּשְׁל֖וּ בָּ֑/הּ כִּֽי הָיִ֤יתִי לְ/יִשְׂרָאֵל֙ לְ/אָ֔ב וְ/אֶפְרַ֖יִם בְּכֹ֥רִ/י הֽוּא־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/009.yaml
  text: They will come with weeping, and with pleas for mercy[a] I will lead them; I will guide them to streams of water, on a straight path where they will not stumble. For I am a father to Israel, and Ephraim is my firstborn.
translation:
  language: de
  text: Weinend werden sie kommen, und mit Flehen um Erbarmen[a] werde ich sie führen; ich werde sie zu Wasserbächen leiten, auf einem geraden Weg, auf dem sie nicht straucheln werden. Denn ich bin Israel ein Vater, und Ephraim ist mein Erstgeborener.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit inständigen Bitten.'
    reason: Lexikalische Alternative zu תַּחֲנוּנִים; der Ausdruck kann inständiges Bitten um Gunst oder Erbarmen bezeichnen.
lexical_decisions:
- source_word: בִּבְכִי
  choice: weinend
  rationale: Die Präposition ב bezeichnet hier die Art und Weise oder Begleitung. „Weinend“ gibt das konkrete Bild natürlich wieder, ohne den Grund der Tränen als Reue, Trauer oder Freude festzulegen.
- source_word: וּבְתַחֲנוּנִים
  choice: und unter Flehen um Erbarmen
  rationale: תַּחֲנוּנִים bezeichnet inständiges Bitten um Gunst oder Erbarmen. Die Formulierung ist im heutigen Deutsch verständlich und bewahrt den Gebetscharakter.
- source_word: אֽוֹבִילֵם
  choice: werde ich sie führen
  rationale: Der Hifil von יבל bezeichnet das Führen oder Geleiten und passt zur Darstellung göttlicher Führung.
- source_word: אֽוֹלִיכֵם
  choice: Ich werde sie ... leiten
  rationale: Der Hifil von הלך hat hier den Sinn des Gehenlassens beziehungsweise Hinführens. „Leiten“ wahrt die Bewegungsrichtung und vermeidet eine schwerfällige Wiederholung von „führen“.
- source_word: נַחֲלֵי מַיִם
  choice: Wasserbächen
  rationale: Die Konstruktverbindung bezeichnet wasserführende Bäche oder Wasserläufe. „Wasserbäche“ bewahrt das anschauliche, lebensspendende Bild.
- source_word: בְּדֶרֶךְ יָשָׁר
  choice: auf einem geraden Weg
  rationale: יָשָׁר kann einen geraden, ebenen oder ungehinderten Weg bezeichnen. „Gerader Weg“ ist natürlich und lässt die Vorstellung sicherer, ungehinderter Führung bestehen.
- source_word: לֹא יִכָּשְׁלוּ בָּהּ
  choice: auf dem sie nicht straucheln werden
  rationale: Das Suffix verweist auf den Weg zurück. „Straucheln“ bildet das hebräische Verb präzise und idiomatisch ab.
- source_word: כִּי הָיִיתִי לְיִשְׂרָאֵל לְאָב
  choice: Denn ich bin ein Vater für Israel
  rationale: Das stative Perfekt bezeichnet hier eine bestehende Beziehung. Das Präsens vermeidet die unbegründete Aussage, Gott sei erst jetzt Israels Vater geworden.
- source_word: וְאֶפְרַיִם בְּכֹרִי הוּא
  choice: und Ephraim ist mein Erstgeborener
  rationale: בְּכוֹר bezeichnet den Erstgeborenen samt seiner besonderen Stellung. Das selbstständige Pronomen הוּא wird im Deutschen natürlich durch die reguläre Prädikation wiedergegeben.
theological_decisions:
- issue: Art des Weinens und Flehens
  choice: Der Text lässt offen, ob die Menschen aus Reue, Trauer oder Freude weinen.
  alternative: Das Weinen ausdrücklich als Bußtrauer oder Freudentränen deuten.
  rationale: Der hebräische Text nennt die Weise ihres Kommens, aber nicht den emotionalen oder theologischen Grund ihrer Tränen.
- issue: Zeitlicher Sinn von הָיִיתִי in der Vaterschaftsaussage
  choice: „Ich bin ein Vater für Israel“
  alternative: „Ich bin Israel zum Vater geworden“ oder „Ich bin Israel ein Vater gewesen“
  rationale: Das stative Perfekt bekräftigt in diesem prophetischen Zusammenhang eine bestehende Beziehung; eine beginnende oder lediglich vergangene Vaterschaft wäre eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verben werden mit „führen“ und „leiten“ wiedergegeben; die Bildsprache von Tränen, Wasserbächen, Weg und Straucheln bleibt erhalten.
