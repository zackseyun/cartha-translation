  terminology: „Wächter“, „hinaufziehen“, „Zion“ und „Jahwe“ sind sachgerecht. Die Schreibung „Jahwe“ ist im Deutschen etabliert. Die Fußnote zum Gottesnamen muss an „Jahwe“ statt am Satzende verankert werden.
