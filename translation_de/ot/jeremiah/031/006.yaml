  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י יֶשׁ י֔וֹם קָרְא֥וּ נֹצְרִ֖ים בְּ/הַ֣ר אֶפְרָ֑יִם ק֚וּמוּ וְ/נַעֲלֶ֣ה צִיּ֔וֹן אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/006.yaml
  text: For there will be a day when watchmen will call out on the hill country of Ephraim[a], ‘Rise up, and let us go up to Zion[b], to Yahweh our God.’
translation:
  language: de
  text: 'Denn es wird ein Tag kommen, an dem Wächter[a] im Bergland Ephraims rufen werden: »Macht euch auf! Lasst uns hinaufziehen nach Zion, zu Jahwe[b], unserem Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Wächter“ wiedergegebene hebräische Wort kann auch „Hüter“ oder „Bewacher“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; der Gottesname wird traditionell mit „der HERR“ wiedergegeben.
    reason: divine_name
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Bewahrt die begründende Verknüpfung mit der vorausgehenden Verheißung.
- source_word: יֶשׁ יוֹם
  choice: es kommt der Tag
  rationale: Gibt die im Zusammenhang zukunftsgerichtete Existenzformel natürlich wieder, ohne ihren bestimmten Erwartungshorizont zu verlieren.
- source_word: קָרְאוּ
  choice: ausrufen werden
  rationale: Das Qal-Perfekt bezeichnet im prophetischen Zusammenhang ein gewiss erwartetes zukünftiges Geschehen; „ausrufen“ passt zum öffentlichen Ruf.
- source_word: נֹצְרִים
  choice: Wächter
  rationale: Das Partizip von נצר bezeichnet hier Menschen, die wachen beziehungsweise bewachen; „Wächter“ erhält das konkrete Bild.
- source_word: בְּהַר אֶפְרָיִם
  choice: im Bergland Ephraim
  rationale: הַר bezeichnet hier kollektiv die gebirgige Landschaft Ephraims, nicht notwendig einen einzelnen Berg.
- source_word: קוּמוּ
  choice: Macht euch auf!
  rationale: Gibt den pluralischen Imperativ als würdigen und zugleich verständlichen Aufbruchsruf wieder.
- source_word: וְנַעֲלֶה
  choice: Lasst uns hinaufziehen
  rationale: Bewahrt die auffordernde Kraft des Kohortativs und die topografisch wie kultisch bedeutsame Aufwärtsbewegung nach Zion.
- source_word: צִיּוֹן
  choice: Zion
  rationale: Die etablierte Namensform wahrt sowohl den Ortsbezug als auch die theologische Resonanz.
- source_word: אֶל יְהוָה
  choice: zu Jahwe
  rationale: Gibt die Bewegungsrichtung und den im Hebräischen ausdrücklich stehenden Gottesnamen wieder.
- source_word: אֱלֹהֵינוּ
  choice: unserem Gott
  rationale: Bewahrt das gemeinschaftliche Bekenntnis der hebräischen Possessivform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher sichtbar gemacht; die Fußnote nennt die traditionelle deutsche Wiedergabe, ohne sie in den Haupttext einzusetzen.
- issue: Bedeutung von נֹצְרִים
  choice: Wächter
  alternative: Hüter oder Bewacher
  rationale: „Wächter“ passt am besten zum öffentlichen Ruf im Bergland; die lexikalische Offenheit wird in der Fußnote erhalten.
- issue: Zukunftsbezug von קָרְאוּ
  choice: ausrufen werden
  alternative: haben ausgerufen
  rationale: Obwohl die Verbform formal ein Perfekt ist, verlangt der prophetische Zukunftszusammenhang eine futurische Wiedergabe; die Gewissheit der Ankündigung bleibt dabei erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Macht euch auf“ und „hinaufziehen“ erhalten den feierlichen Aufbruchs- und Wallfahrtston, während Satzbau und Wortwahl allgemein verständlich bleiben.
