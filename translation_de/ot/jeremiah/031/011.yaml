base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/011.yaml
  text: For Yahweh has redeemed Jacob and ransomed him from the hand of one stronger than he[a].
translation:
  language: de
  text: Denn Jahwe hat Jakob erlöst und ihn aus der Hand eines Stärkeren als er zurückgewonnen[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und ihn erlöst“. Das hebräische Verb גאל bezeichnet häufig, dass jemand als Löser zugunsten eines Angehörigen eintritt oder einen Menschen aus Not und fremder Gewalt zurückgewinnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Heilszusage; „Denn“ gibt diesen Zusammenhang im Deutschen natürlich wieder.
- source_word: פָדָה
  choice: hat … erlöst
  rationale: פדה bezeichnet die Befreiung aus Not, Abhängigkeit oder Gewalt. Das deutsche Perfekt gibt die hebräische Perfektform in diesem begründenden Rückblick idiomatisch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יַעֲקֹב
  choice: Jakob
  rationale: Der ausdrücklich genannte Name bleibt erhalten; ein möglicher kollektiver Bezug auf Israel wird nicht in den Wortlaut eingetragen.
- source_word: וּגְאָלוֹ
  choice: und ihn … zurückgewonnen
  rationale: גאל bezeichnet häufig das Eintreten als Löser, besonders zugunsten eines Angehörigen, und kann das Zurückgewinnen aus fremder Gewalt ausdrücken. „Zurückgewonnen“ unterscheidet das Verb behutsam vom parallelen פדה, ohne eine Zahlung vorauszusetzen.
- source_word: מִיַּד
  choice: aus der Hand dessen
  rationale: Die hebräische Hand-Metapher für Gewalt oder Verfügungsgewalt bleibt im Deutschen verständlich erhalten.
- source_word: חָזָק מִמֶּנּוּ
  choice: der stärker war als er
  rationale: Die singularische Vergleichskonstruktion wird ausdrücklich auf Jakob bezogen. Das Präteritum fügt sich natürlich in den deutschen Rückblick ein, ohne die Aussage als zeitlose Wesensbeschreibung des Gegners festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. Die Transliteration bewahrt seinen Charakter als Eigenname.
- issue: Verhältnis der parallelen Verben פדה und גאל
  choice: „erlöst“ und „zurückgewonnen“
  alternative: beide Verben mit „erlöst“ wiedergeben
  rationale: Die beiden Verben überschneiden sich semantisch, sind aber nicht identisch. Zwei verwandte deutsche Ausdrücke bewahren die poetische Abstufung, ohne daraus getrennte Heilslehren abzuleiten.
- issue: Identität des Stärkeren
  choice: offengelassen
  alternative: eine konkrete politische oder übernatürliche Macht benennen
  rationale: Der hebräische Text nennt den Überlegenen nicht. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hand-Metapher des Hebräischen bleibt erhalten; der Relativsatz macht den Vergleich natürlich verständlich. Die Übersetzung vermeidet sowohl unnötig kirchliche Fachsprache als auch eine vorschnelle Festlegung auf Lösegeldzahlung oder einen bestimmten Gegner.
