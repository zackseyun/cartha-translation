source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם לֹא יֹאמְר֣וּ ע֔וֹד אָב֖וֹת אָ֣כְלוּ בֹ֑סֶר וְ/שִׁנֵּ֥י בָנִ֖ים תִּקְהֶֽינָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/029.yaml
  text: In those days they will no longer say[a], ‘The fathers have eaten sour grapes, and the sons’ teeth are set on edge.’
translation:
  language: de
  text: 'In jenen Tagen wird man nicht mehr sagen: »Die Väter haben unreife Trauben[a] gegessen, und den Söhnen werden die Zähne stumpf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: saure Trauben.'
    reason: 'Lexikalische Alternative: בֹּסֶר bezeichnet unreife und deshalb saure Trauben.'
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Gibt die feste prophetische Zeitformel natürlich und würdig wieder.
- source_word: לֹא יֹאמְרוּ עוֹד
  choice: wird man nicht mehr sagen
  rationale: Das unbestimmte hebräische Subjekt in der 3. Person Plural wird im Deutschen idiomatisch mit „man“ wiedergegeben; „nicht mehr“ bewahrt den Gedanken des Aufhörens.
- source_word: אָבוֹת
  choice: die Väter
  rationale: Bewahrt die ausdrücklich männliche Verwandtschaftsbezeichnung des hebräischen Textes, ohne sie zu „Eltern“ oder „Vorfahren“ zu erweitern.
- source_word: אָכְלוּ
  choice: haben … gegessen
  rationale: Das Perfekt bezeichnet die abgeschlossene Handlung, deren Folge im zweiten Teil des Sprichworts genannt wird.
- source_word: בֹסֶר
  choice: unreife Trauben
  rationale: Bezeichnet unreife und daher saure Trauben; „unreife Trauben“ gibt den konkreten Sinn des hebräischen Wortes genauer wieder. Die geläufige Wiedergabe „saure Trauben“ wird in einer Fußnote genannt.
- source_word: וְשִׁנֵּי בָנִים
  choice: und den Söhnen … die Zähne
  rationale: Die deutsche Dativkonstruktion klingt natürlich und bewahrt zugleich das hebräische „Söhne“ statt es zu „Kinder“ zu verallgemeinern.
- source_word: תִּקְהֶינָה
  choice: sind … stumpf geworden
  rationale: Beschreibt die unangenehme abstumpfende Wirkung saurer, unreifer Früchte auf die Zähne und bildet die eingetretene Folge idiomatisch ab.
theological_decisions:
- issue: Verwandtschaftsbegriffe im Sprichwort
  choice: „Väter“ und „Söhne“ im Haupttext beibehalten
  alternative: „Eltern“ und „Kinder“
  rationale: Der hebräische Wortlaut verwendet ausdrücklich männliche Bezeichnungen. Die Übersetzung bewahrt diese Form, ohne den umfassenderen Gedanken generationenübergreifender Folgen auf eine geschlechtsneutrale Formulierung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die unpersönliche Form „wird man … sagen“ ist idiomatischer als ein nicht näher bestimmtes „sie werden … sagen“. Die direkte Rede bewahrt den sprichwörtlichen Charakter.
