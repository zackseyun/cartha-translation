source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה ק֣וֹל בְּ/רָמָ֤ה נִשְׁמָע֙ נְהִי֙ בְּכִ֣י תַמְרוּרִ֔ים רָחֵ֖ל מְבַכָּ֣ה עַל בָּנֶ֑י/הָ מֵאֲנָ֛ה לְ/הִנָּחֵ֥ם עַל בָּנֶ֖י/הָ כִּ֥י אֵינֶֽ/נּוּ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/015.yaml
  text: 'Thus says Yahweh: “A voice is heard in Ramah[a], lamentation and bitter weeping—Rachel weeping for her children. She refuses to be comforted for her children[b], because they are no more.”'
translation:
  language: de
  text: 'So spricht Jahwe: »Eine Stimme ist in Rama[a] zu hören: Klage, bitteres Weinen. Rahel weint um ihre Kinder. Sie will sich wegen ihrer Kinder nicht trösten lassen, denn sie sind nicht mehr.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rama war eine Stadt im Gebiet Benjamins. Rahel erscheint hier dichterisch als Stammmutter, die um ihre Nachkommen trauert.
    reason: cultural_note
  - marker: b
    text: 'Oder: »denn er ist nicht mehr«. Im Hebräischen steht in dieser Wendung eine Singularform, obwohl im Zusammenhang kollektiv von Rahels Kindern die Rede ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als gebräuchliche deutsche Umschrift wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: קוֹל בְּרָמָה נִשְׁמָע
  choice: Eine Stimme ist in Rama zu hören
  rationale: Erhält das hebräische Bild einer hörbaren Stimme und gibt das Passiv präsentisch wieder.
- source_word: נְהִי בְּכִי תַמְרוּרִים
  choice: Klage und bitteres Weinen
  rationale: Gibt die beiden Ausdrücke der Trauer klar wieder und bewahrt die emotionale Steigerung.
- source_word: רָחֵל מְבַכָּה עַל בָּנֶיהָ
  choice: Rahel weint um ihre Kinder
  rationale: Das deutsche »um jemanden weinen« drückt Trauer natürlich aus; בָּנִים bezeichnet hier kollektiv die Nachkommen.
- source_word: מֵאֲנָה לְהִנָּחֵם
  choice: Sie weigert sich, sich … trösten zu lassen
  rationale: Gibt sowohl die ausdrückliche Weigerung als auch den passiv-reflexiven Sinn des Niphal-Infinitivs wieder.
- source_word: כִּי אֵינֶנּוּ
  choice: denn sie sind nicht mehr
  rationale: Bezieht die singularische hebräische Form kontextgemäß auf das kollektive »ihre Kinder«, ohne den Verlust näher auszudeuten.
theological_decisions:
- issue: Numerus und Bezug von כִּי אֵינֶנּוּ nach dem kollektiven »ihre Kinder«
  choice: denn sie sind nicht mehr
  alternative: denn er ist nicht mehr
  rationale: Die hebräische Form ist Singular, doch ihr unmittelbarer Bezug sind Rahels Kinder als Kollektiv. Da Deutsch eine Numerusentscheidung verlangt, steht im Haupttext der kontextgemäße Plural; der formnähere Singular wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachrhythmus. Die Wiederholung von »ihre Kinder« und die knappe Schlussformulierung bewahren die eindringliche Struktur des Hebräischen. Die Fußnotenmarker sind entsprechend ihrem tatsächlichen Bezug gesetzt.
