source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אִם יִמַּ֤דּוּ שָׁמַ֨יִם֙ מִ/לְ/מַ֔עְלָ/ה וְ/יֵחָקְר֥וּ מֽוֹסְדֵי אֶ֖רֶץ לְ/מָ֑טָּה גַּם אֲנִ֞י אֶמְאַ֨ס בְּ/כָל זֶ֧רַע יִשְׂרָאֵ֛ל עַֽל כָּל אֲשֶׁ֥ר עָשׂ֖וּ נְאֻם יְהוָֽה׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/031/037.yaml
  text: 'Thus says Yahweh: If the heavens above can be measured[a], and the foundations of the earth below can be searched out, then I also will reject all the offspring of Israel for all that they have done, declares Yahweh.'
translation:
  language: de
  text: 'So spricht der HERR: Wenn der Himmel oben ausgemessen und die Grundfesten der Erde unten erforscht werden können, dann werde auch ich die ganze Nachkommenschaft Israels verwerfen wegen all dessen, was sie getan haben – Ausspruch des HERRN.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens; sie wahrt den würdigen prophetischen Ton. Die typografische Auszeichnung durch Kapitälchen ist mit »HERR« angezeigt.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Traditionelle, weiterhin verständliche Wiedergabe der prophetischen Botenformel; knapp und quellennah.
- source_word: אִם יִמַּדּוּ
  choice: Wenn … ausgemessen … werden können
  rationale: Bewahrt die Bedingungsform und gibt den Nifal von מדד passiv wieder. »Ausmessen« bezeichnet ein vollständiges Vermessen und passt zur rhetorisch unerfüllbaren Bedingung.
- source_word: שָׁמַיִם מִלְמַעְלָה
  choice: der Himmel oben
  rationale: Natürliches Deutsch für die kosmologische Wendung; »oben« erhält den vertikalen Gegensatz zu »unten«.
- source_word: וְיֵחָקְרוּ
  choice: erforscht werden können
  rationale: Gibt den Nifal von חקר als gründliches Untersuchen wieder, ohne die Aussage interpretierend auf »ergründen« zu verengen.
- source_word: מוֹסְדֵי אֶרֶץ לְמָטָּה
  choice: die Grundfesten der Erde unten
  rationale: Bewahrt das antike kosmologische Bild sowie die Parallelität von »oben« und »unten«.
- source_word: גַּם אֲנִי
  choice: dann werde auch ich
  rationale: »Dann« verdeutlicht im Deutschen den Nachsatz der Bedingung; »auch ich« erhält die emphatische Entsprechung.
- source_word: אֶמְאַס
  choice: verwerfen
  rationale: Gibt מאס im Zusammenhang der Bundesbeziehung prägnant als Zurückweisung wieder, ohne zusätzlich emotionale Verachtung einzutragen.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: die ganze Nachkommenschaft Israels
  rationale: »Nachkommenschaft« gibt das kollektive זֶרַע natürlich wieder und bewahrt den umfassenden Bezug von כָּל.
- source_word: עַל כָּל אֲשֶׁר עָשׂוּ
  choice: wegen all dessen, was sie getan haben
  rationale: עַל bezeichnet hier den Grund der möglichen Verwerfung. Das Perfekt wird idiomatisch mit dem deutschen Perfekt wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch des HERRN
  rationale: Formale und zugleich verständliche Wiedergabe der prophetischen Bekräftigungsformel; sie unterscheidet diese von der einleitenden Botenformel.
theological_decisions:
- issue: Aussagekraft der Bedingung hinsichtlich der Verwerfung Israels
  choice: Die grammatische Wenn-dann-Struktur bleibt ausdrücklich erhalten; im Kontext bezeichnet sie eine rhetorisch unmögliche Voraussetzung und bekräftigt so, dass Gott nicht die gesamte Nachkommenschaft Israels verwirft.
  alternative: Die Bedingung als bloß offene, tatsächlich erfüllbare Möglichkeit formulieren oder ihre rhetorische Kraft durch eine direkte Aussage wie »Niemals werde ich …« ersetzen.
  rationale: Jeremia 31,35–37 stellt die Beständigkeit der Schöpfungsordnung und deren Unermesslichkeit als Gewähr für Israels Fortbestand vor Gott dar. Die Übersetzung bewahrt sowohl die konkrete Bedingungsform als auch ihre im Kontext erkennbare Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Klang. »So spricht« und »Ausspruch des HERRN« sind bewusst formell, aber allgemein verständlich. Keine Fußnote ist nötig; der im englischen Konsultationstext gesetzte Marker bei »measured« gehört sachlich offenbar zur Alternative für אֶמְאַס und ist dort fehlplatziert. Die deutsche Übersetzung gibt die einschlägigen Wörter eindeutig und quellennah wieder.
