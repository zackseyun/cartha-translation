  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ מִצְרַ֔יִם לִ/שְׁתּ֖וֹת מֵ֣י שִׁח֑וֹר וּ/מַה לָּ/ךְ֙ לְ/דֶ֣רֶךְ אַשּׁ֔וּר לִ/שְׁתּ֖וֹת מֵ֥י נָהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/018.yaml
  text: And now[a], what have you to do with the way to Egypt, to drink the waters of Shihor? And what have you to do with the way to Assyria[b], to drink the waters of the River?
translation:
  language: de
  text: 'Und nun: Was hast du mit dem Weg nach Ägypten zu schaffen, um das Wasser des Schihor[a] zu trinken? Und was hast du mit dem Weg nach Assyrien zu schaffen, um das Wasser des Stromes[b] zu trinken?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schihor ist wahrscheinlich eine Bezeichnung für den Nil oder einen seiner östlichen Arme.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Euphrat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den zeitlichen und rhetorischen Übergang von עַתָּה.
- source_word: מַה לָּךְ
  choice: Was hast du ... zu schaffen?
  rationale: Die deutsche Wendung gibt den tadelnden, auf Distanzierung zielenden Sinn des hebräischen Idioms wieder, ohne ihn zum bloßen 'Warum gehst du?' abzuflachen.
- source_word: לְדֶרֶךְ מִצְרַיִם
  choice: mit dem Weg nach Ägypten
  rationale: Behält das konkrete Bild des Weges bei und verbindet es idiomatisch mit 'zu schaffen haben'.
- source_word: לִשְׁתּוֹת
  choice: um ... zu trinken
  rationale: Gibt den finalen Infinitiv als Zweckangabe wieder.
- source_word: מֵי שִׁחוֹר
  choice: das Wasser des Schihor
  rationale: Bewahrt den Eigennamen im Haupttext, statt die wahrscheinliche Identifikation mit dem Nil bereits in die Übersetzung einzutragen.
- source_word: אַשּׁוּר
  choice: Assyrien
  rationale: Übliche deutsche Wiedergabe des Ländernamens.
- source_word: מֵי נָהָר
  choice: das Wasser des Stromes
  rationale: Bewahrt die nicht ausdrücklich benannte Bezeichnung 'der Strom'; im Zusammenhang ist damit sehr wahrscheinlich der Euphrat gemeint.
theological_decisions:
- issue: Bild des Trinkens aus den Gewässern Ägyptens und Assyriens
  choice: Das Bild bleibt im Haupttext unverändert stehen.
  alternative: Als 'Hilfe bei Ägypten und Assyrien suchen' paraphrasieren.
  rationale: Der Kontext legt politische Abhängigkeit beziehungsweise Bündnissuche nahe, doch der Vers selbst formuliert dies bildhaft. Die Übersetzung bewahrt diese Bildsprache und ihre Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele rhetorische Struktur des Hebräischen wird bewahrt. 'Zu schaffen haben' vermittelt den vorwurfsvollen Ton natürlich; 'Strom' bleibt als traditionsfähige, im Kontext verständliche Bezeichnung stehen.
