  text: כִּ֣י עִבְר֞וּ אִיֵּ֤י כִתִּיִּים֙ וּ/רְא֔וּ וְ/קֵדָ֛ר שִׁלְח֥וּ וְ/הִֽתְבּוֹנְנ֖וּ מְאֹ֑ד וּ/רְא֕וּ הֵ֥ן הָיְתָ֖ה כָּ/זֹֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/010.yaml
  text: For cross over to the coasts of Kittim and see[a]; send to Kedar and consider carefully[b]; see whether there has ever been anything like this.
translation:
  language: de
  text: Denn geht hinüber zu den Küsten von Kittim und seht euch um[a]; schickt nach Kedar und betrachtet es sehr genau[b]. Seht, ob je etwas Derartiges geschehen ist!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu den Inseln beziehungsweise Küstenländern von Kittim«. Kittim bezeichnet wahrscheinlich Zypern oder allgemeiner westliche Länder am Meer.'
    reason: lexical_alternative
  - marker: b
    text: Kedar bezeichnet arabische Stämme oder deren Gebiet im Osten beziehungsweise Südosten. Zusammen mit Kittim entsteht so ein Vergleich vom Westen bis zum Osten.
    reason: cultural_note
lexical_decisions:
- source_word: עִבְרוּ
  choice: geht hinüber
  rationale: Der Qal-Imperativ Plural bezeichnet eine konkrete Bewegung in ein anderes Gebiet. »Geht hinüber« bewahrt diesen räumlichen Sinn in natürlichem Deutsch.
- source_word: אִיֵּי כִתִּיִּים
  choice: die Küsten von Kittim
  rationale: אִיִּים kann Inseln oder Küstenländer bezeichnen. »Küsten« lässt die geografische Reichweite offen; der Eigenname Kittim bleibt erhalten.
- source_word: וּרְאוּ
  choice: und seht nach
  rationale: Das wiederholte ראה fordert zur eigenen Feststellung auf. »Seht nach« gibt hier den prüfenden Charakter idiomatisch wieder.
- source_word: וְקֵדָר שִׁלְחוּ
  choice: schickt Boten nach Kedar
  rationale: Das hebräische »schickt« lässt das Objekt unausgesprochen; im Deutschen macht »Boten« die naheliegende Handlung verständlich, ohne den Sinn wesentlich einzuengen.
- source_word: וְהִתְבּוֹנְנוּ מְאֹד
  choice: und prüft es sehr genau
  rationale: Der Hitpael-Imperativ verlangt aufmerksames Betrachten oder Erwägen; מְאֹד verstärkt ihn. »Prüft es sehr genau« verbindet Untersuchung und Nachdenken.
- source_word: הֵן הָיְתָה כָּזֹאת
  choice: Seht, ob je etwas Derartiges geschehen ist
  rationale: הֵן leitet den abschließenden, staunenden Aufruf ein; die rhetorische Frage nach einem vergleichbaren Geschehen wird in idiomatischem Deutsch ausdrücklich wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Folge kurzer Imperative und das abschließende staunende »Seht« bewahren die prophetische Dringlichkeit. Die geografische Mehrdeutigkeit von אִיִּים wird in der Fußnote offengehalten.
