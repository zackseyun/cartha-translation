source:
  edition: WLC
  text: כִּ֣י מֵ/עוֹלָ֞ם שָׁבַ֣רְתִּי עֻלֵּ֗/ךְ נִתַּ֨קְתִּי֙ מוֹסְרֹתַ֔יִ/ךְ וַ/תֹּאמְרִ֖י לֹ֣א אעבד כִּ֣י עַֽל כָּל גִּבְעָ֞ה גְּבֹהָ֗ה וְ/תַ֨חַת֙ כָּל עֵ֣ץ רַעֲנָ֔ן אַ֖תְּ צֹעָ֥ה זֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/020.yaml
  text: For long ago I broke your yoke[a]; I tore off your bonds. But you said, “I will not serve.” Indeed, on every high hill and under every green tree[c][b], you sprawled out as a prostitute.
translation:
  language: de
  text: 'Denn schon vor langer Zeit zerbrach ich dein Joch[a] und zerriss deine Fesseln. Doch du sagtest: »Ich will nicht dienen.« Ja, auf jedem hohen Hügel und unter jedem grünen Baum[b] streckst du dich wie eine Prostituierte hin.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von alters her«. Der hebräische Ausdruck bezeichnet eine weit zurückliegende Vergangenheit und verweist hier wahrscheinlich auf Israels frühere Befreiung.'
    reason: lexical_alternative
  - marker: b
    text: »Unter jedem grünen Baum« ist bei den Propheten eine feste Wendung für Orte, die mit götzendienerischem Kult verbunden waren.
    reason: cultural_note
  - marker: c
    text: Das hier mit »streckst du dich … hin« wiedergegebene hebräische Verb ist selten und schwer zu deuten. Möglich sind auch Wiedergaben wie »niedergebeugt« oder ähnliche Beschreibungen einer sexuell verfügbaren Haltung.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: schon vor langer Zeit
  rationale: Die Zeitangabe weist hier wahrscheinlich auf Israels frühe Befreiungsgeschichte zurück. Die Formulierung gibt die ferne Vergangenheit natürlich wieder, ohne eine abstrakte Ewigkeit anzudeuten.
- source_word: שָׁבַרְתִּי עֻלֵּךְ
  choice: ich zerbrach dein Joch
  rationale: Die konkrete Metapher der Befreiung aus Knechtschaft bleibt erhalten; »zerbrach« gibt die Stärke des Verbs wieder.
- source_word: נִתַּקְתִּי מוֹסְרֹתַיִךְ
  choice: zerriss deine Fesseln
  rationale: Das Verb bezeichnet ein gewaltsames Losreißen oder Zerreißen, während das Substantiv Bindungen beziehungsweise Jochriemen bezeichnen kann. »Fesseln« ist verständlich und führt das Befreiungsbild fort.
- source_word: לֹא אעבד
  choice: Ich will nicht dienen
  rationale: עבד kann sowohl gewöhnliches Dienen als auch Gottesdienst bezeichnen. »Dienen« bewahrt diese Doppelbedeutung und passt zugleich zum Bild von Joch und Fesseln.
- source_word: כִּי
  choice: Ja
  rationale: Das zweite כִּי leitet eine nachdrückliche Bestätigung beziehungsweise Begründung durch Israels Verhalten ein. »Ja« stellt diesen Zusammenhang knapp und natürlich her.
- source_word: עַל כָּל גִּבְעָה גְּבֹהָה וְתַחַת כָּל עֵץ רַעֲנָן
  choice: auf jedem hohen Hügel und unter jedem grünen Baum
  rationale: Die wörtliche prophetische Wendung bleibt erhalten. Sie bezeichnet zugleich Orte, die mit götzendienerischen Kultpraktiken verbunden waren.
- source_word: צֹעָה
  choice: hast du dich … hingestreckt
  rationale: Das seltene und schwer zu deutende Partizip scheint in diesem Zusammenhang eine Körperhaltung sexueller Verfügbarkeit zu schildern. Die Übersetzung bleibt anschaulich, während eine Fußnote die Unsicherheit offenlegt.
- source_word: זֹנָה
  choice: wie eine Hure
  rationale: Das ausdrückliche Bild sexueller Untreue wird beibehalten. »Hure« ist im Deutschen unmittelbar verständlich und besitzt die scharfe prophetische Wirkung des Ausgangstextes.
theological_decisions:
- issue: Sexuelle Untreue als Metapher für Götzendienst
  choice: Das ausdrückliche Hurenbild bleibt im Haupttext erhalten.
  alternative: Abschwächende Wiedergabe wie »du wurdest untreu« oder erklärende Wiedergabe wie »du triebst Götzendienst«.
  rationale: Jeremia stellt den Bundesbruch bewusst als sexuelle Untreue dar. Eine Abschwächung oder rein erklärende Übersetzung würde die prophetische Schärfe und die Verbindung zwischen unerlaubtem Kult und Ehebruch verdecken.
- issue: Bedeutungsumfang von עבד
  choice: »dienen«
  alternative: »Sklave sein« oder »anbeten«
  rationale: Der unmittelbare Zusammenhang mit Joch und Fesseln aktiviert die Bedeutung des Dienens beziehungsweise der Knechtschaft, während der folgende Götzendienst zugleich die kultische Dimension anklingen lässt. »Dienen« hält beide Aspekte offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Die direkte Anrede Israels im Femininum wird durch »dein« und »du« natürlich wiedergegeben. Die explizite, beschämende Metapher wird nicht beschönigt; die Unsicherheit des seltenen Verbs wird in der Fußnote kenntlich gemacht.
