review_pass:
  verdict: revise
  source_fidelity: Die drei pluralischen Imperative und die Anrede der Himmel sind erhalten. „völlig verwüstet“ ist bei der personifizierten Anrede jedoch im Deutschen weniger treffend als ein intransitives Verb; חָרְבוּ bezeichnet primär Veröden/Austrocknen und bleibt in dieser Anwendung bewusst bildhaft und schwierig.
  naturalness: „Entsetzt euch“ ist als Aufforderung idiomatischer als „Seid entsetzt“. „Verödet völlig“ bewahrt die absichtlich harte poetische Bildlichkeit, ohne die im Deutschen unnatürliche Passivzustandsformulierung „seid verwüstet“ zu erzeugen.
  terminology: „Jahwe“ gibt יְהוָה als Gottesnamen konsistent wieder. „Spruch Jahwes“ ist eine angemessene knappe Wiedergabe von נְאֻם יְהוָה. Die Fußnote soll die umstrittene bzw. bildhafte Nuance von שׂערו und besonders חרבו präziser ausweisen.
  issues:
