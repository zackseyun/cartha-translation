    issue: „Seid völlig verwüstet“
    rationale: Die Formulierung klingt im modernen Deutsch wie ein von außen zugefügter Zustand. Das hebräische חרבו ist intransitiv und trägt die Grundvorstellung des Verödens bzw. Austrocknens; „Verödet völlig“ gibt dies bei gleicher poetischer Sperrigkeit genauer wieder.
  - severity: low
    issue: Fußnotenalternative „erstarrt völlig“
    rationale: Die Alternative vermischt die Nuance des zweiten Imperativs mit dem dritten und macht nicht deutlich, dass bei חרבו vor allem Veröden/Austrocknen in Betracht kommt.
