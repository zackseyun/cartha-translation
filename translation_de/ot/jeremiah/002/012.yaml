  text: שֹׁ֥מּוּ שָׁמַ֖יִם עַל זֹ֑את וְ/שַׂעֲר֛וּ חָרְב֥וּ מְאֹ֖ד נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/012.yaml
  text: Be appalled at this[a], O heavens; shudder, be utterly desolate, declares Yahweh.
translation:
  language: de
  text: Entsetzt euch darüber, ihr Himmel! Schaudert, verödet völlig[a] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Schaudert, verdorrt völlig“ oder „Schaudert, seid völlig verödet“. Die hebräischen Verben verbinden Entsetzen und Schauder mit dem auffälligen Bild äußerster Verödung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמּוּ
  choice: Seid entsetzt
  rationale: Der pluralische Imperativ von שמם ruft die als Zeugen angeredeten Himmel zu fassungslosem Entsetzen auf. Die Formulierung ist gegenwärtiges, verständliches Deutsch und bewahrt die Eindringlichkeit.
- source_word: שָׁמַיִם
  choice: ihr Himmel
  rationale: Der Plural wird als direkte Anrede wiedergegeben. „Ihr Himmel“ klingt im Deutschen natürlicher als ein isoliertes „Himmel“ und erhält den prophetisch-poetischen Apostroph.
- source_word: עַל זֹאת
  choice: darüber
  rationale: Die Wendung verweist auf das unmittelbar zuvor geschilderte Geschehen. „Darüber“ verbindet sich im Deutschen idiomatisch mit „entsetzt sein“ und bewahrt den Rückverweis.
- source_word: וְשַׂעֲרוּ
  choice: Schaudert
  rationale: Der Imperativ bezeichnet ein körperlich erfahrbares Erschrecken oder Sträuben vor Grauen. „Schaudert“ gibt dieses Moment knapp und anschaulich wieder.
- source_word: חָרְבוּ מְאֹד
  choice: seid völlig verwüstet
  rationale: חרב kann Austrocknung, Verwüstung oder Verödung ausdrücken; מְאֹד verstärkt den Ausdruck. Die ungewöhnliche Verbindung mit den Himmeln bleibt als kühnes poetisches Bild erhalten, statt geglättet zu werden.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die feste prophetische Botenformel wird knapp und feierlich wiedergegeben. „Spruch“ kennzeichnet die folgende oder vorausgehende Aussage als göttlichen Ausspruch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Namen und folgt einer geläufigen deutschen Transkription.
- issue: Bildhafte Aussage חָרְבוּ über die Himmel
  choice: seid völlig verwüstet
  alternative: erstarrt völlig; verdorrt völlig; seid zutiefst verstört
  rationale: Die konkrete Bildsprache der Wurzel חרב bleibt erhalten, obwohl ihre Anwendung auf die Himmel auffällig ist. Eine rein psychologische Wiedergabe würde die poetische Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Wucht. Die direkte Anrede und die drei gesteigerten Imperative bleiben erhalten; die auffällige Bildsprache wird nicht eingeebnet.
