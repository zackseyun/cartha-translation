source:
  edition: WLC
  text: קֹ֤דֶשׁ יִשְׂרָאֵל֙ לַ/יהוָ֔ה רֵאשִׁ֖ית תְּבוּאָתֹ֑/ה כָּל אֹכְלָ֣י/ו יֶאְשָׁ֔מוּ רָעָ֛ה תָּבֹ֥א אֲלֵי/הֶ֖ם נְאֻם יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/003.yaml
  text: Israel was holy to Yahweh[a], the firstfruits of his harvest; all who devoured him became guilty; disaster came upon them[c][b], declares Yahweh.
translation:
  language: de
  text: Israel war Jahwe heilig, die Erstlingsfrucht seiner Ernte.[a] Alle, die Israel verschlangen,[b] machten sich schuldig; Unheil kam über sie.[c] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der erste Ertrag seiner Ernte“. Das Bild bezeichnet den ersten, Gott geweihten Ertrag.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „alle, die es aßen“. Gemeint sind Völker, die Israel gleichsam aufzehrten oder plünderten.'
    reason: metaphor_note
  - marker: c
    text: 'Die hebräischen Verbformen können auch allgemeiner oder zukünftig verstanden werden: „Alle, die Israel verschlingen, werden schuldig; Unheil wird über sie kommen.“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: heilig
  rationale: Das prädikativ gebrauchte Substantiv bezeichnet Israel als Jahwe geweiht beziehungsweise für ihn ausgesondert. „Heilig“ gibt diesen kultisch-bundestheologischen Sinn natürlich und knapp wieder.
- source_word: לַיהוָה
  choice: Jahwe
  rationale: Die Präposition ל markiert Zugehörigkeit beziehungsweise Weihe. In der deutschen Formulierung „Jahwe heilig“ ist diese Beziehung idiomatisch enthalten; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: רֵאשִׁית תְּבוּאָתוֹ
  choice: die Erstlingsfrucht seiner Ernte
  rationale: רֵאשִׁית bezeichnet hier den ersten, Gott geweihten Ertrag. „Erstlingsfrucht“ bewahrt das kultische Bild; „Ernte“ gibt תְּבוּאָה in diesem Zusammenhang verständlich wieder.
- source_word: אֹכְלָיו
  choice: alle, die Israel verschlangen
  rationale: Das wörtliche Essen ist ein Bild für feindliches Aufzehren, Verwüsten oder Plündern. Die ausdrückliche Wiederaufnahme von „Israel“ vermeidet im Deutschen einen unklaren pronominalen Bezug.
- source_word: יֶאְשָׁמוּ
  choice: machten sich schuldig
  rationale: Das Verb bezeichnet das Schuldigwerden beziehungsweise das Auf-sich-Laden von Schuld. Die Formulierung wahrt diesen Sinn, ohne ein förmliches Gerichtsverfahren vorauszusetzen.
- source_word: רָעָה תָּבֹא אֲלֵיהֶם
  choice: Unheil kam über sie
  rationale: רָעָה meint im Gerichtszusammenhang Unheil oder Verderben, nicht moralische Bosheit. Die Vergangenheitsform entspricht dem rückblickenden Zusammenhang; die hebräische Verbform kann auch allgemeiner oder zukünftig verstanden werden, was die Fußnote ausweist.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben und bleibt als göttliche Bekräftigung erkennbar.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Israel als geweihter Erstertrag
  choice: die Erstlingsfrucht seiner Ernte
  alternative: der erste Ertrag seiner Ernte
  rationale: Das Bild stellt Israel als Jahwe besonders zugehörig und geweiht dar. „Erstlingsfrucht“ erhält diese kultische Spannung, ohne weitergehende spätere Lehrannahmen einzutragen.
- issue: Zeitbezug der Gerichtsfolge
  choice: machten sich schuldig; Unheil kam über sie
  alternative: werden schuldig; Unheil wird über sie kommen
  rationale: Der Vers blickt im Zusammenhang auf Israels frühe Geschichte und das Ergehen seiner Angreifer zurück. Da die hebräischen Imperfektformen auch eine allgemeine oder zukünftige Aussage zulassen, wird diese Möglichkeit ausdrücklich in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Bildsprache bleibt erhalten; erklärende Zusätze stehen nur in den Fußnoten. „Ausspruch Jahwes“ markiert die feierliche Schlussformel.
