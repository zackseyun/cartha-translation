id: JER.2.8
reference: Jeremiah 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/כֹּהֲנִ֗ים לֹ֤א אָֽמְרוּ֙ אַיֵּ֣ה יְהוָ֔ה וְ/תֹפְשֵׂ֤י הַ/תּוֹרָה֙ לֹ֣א יְדָע֔וּ/נִי וְ/הָ/רֹעִ֖ים פָּ֣שְׁעוּ בִ֑/י וְ/הַ/נְּבִיאִים֙ נִבְּא֣וּ בַ/בַּ֔עַל וְ/אַחֲרֵ֥י לֹֽא יוֹעִ֖לוּ הָלָֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/008.yaml
  text: The priests did not say[a], ‘Where is Yahweh?’ Those who handle the law did not know me; the shepherds rebelled against me[c][b]; the prophets prophesied by Baal and went after things that do not profit.
translation:
  language: de
  text: 'Die Priester sagten nicht: »Wo ist Jahwe?« Die mit dem Gesetz umgehen[a], kannten mich nicht. Die Hirten lehnten sich gegen mich auf. Die Propheten weissagten durch Baal[b] und liefen Dingen nach, die nichts nützen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die das Gesetz ergreifen“. Gemeint sein können diejenigen, die mit dem Gesetz befasst sind oder es lehren. „Gesetz“ kann hier auch „Weisung“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „weissagten im Namen Baals“.'
    reason: alternative_reading
  - marker: c
    text: 'Auch: „folgten dem, was nutzlos ist“. Gemeint sind im Zusammenhang wohl Götzen oder andere falsche Mächte; das hebräische Bezugswort bleibt jedoch unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Der konkrete Plural bezeichnet die priesterlichen Verantwortungsträger und wird direkt und natürlich wiedergegeben.
- source_word: אַיֵּה יְהוָה
  choice: Wo ist Jahwe?
  rationale: Die rhetorische Frage bleibt erhalten; der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: תֹפְשֵׂי הַתּוֹרָה
  choice: die mit dem Gesetz umgehen
  rationale: Die Formulierung bewahrt das konkrete Bild des Ergreifens beziehungsweise Handhabens, ohne die betreffenden Personen vorschnell ausschließlich als Lehrer oder Schriftgelehrte zu bestimmen.
- source_word: הַתּוֹרָה
  choice: das Gesetz
  rationale: „Gesetz“ ist in diesem Zusammenhang verständlich und etabliert; das hebräische Wort kann zugleich weiter gefasst Gottes Weisung bezeichnen, was die Fußnote offenhält.
- source_word: לֹא יְדָעוּנִי
  choice: kannten mich nicht
  rationale: Die persönliche Formulierung wahrt sowohl die unmittelbare Aussage als auch den Beziehungs- und Bundescharakter von ידע.
- source_word: הָרֹעִים
  choice: die Hirten
  rationale: Die prophetische Leitungsmetapher bleibt sichtbar, statt sie durch das deutende „Herrscher“ oder „Führer“ zu ersetzen.
- source_word: פָּשְׁעוּ בִי
  choice: lehnten sich gegen mich auf
  rationale: Die Wendung bringt die in פשע liegende bewusste Auflehnung stärker zum Ausdruck als ein allgemeines Wort für Sünde oder Übertretung.
- source_word: הַנְּבִיאִים נִבְּאוּ בַבַּעַל
  choice: die Propheten weissagten durch Baal
  rationale: „Durch Baal“ lässt die Präposition als mögliche Bezeichnung von Mittel oder Wirkmacht stehen; „im Namen Baals“ ist als erklärende Alternative vermerkt.
- source_word: אַחֲרֵי לֹא יוֹעִלוּ הָלָכוּ
  choice: liefen Dingen nach, die nichts nützen
  rationale: Die Verfolgungsbewegung des hebräischen Idioms wird natürlich wiedergegeben. „Dingen“ ergänzt das im Hebräischen unausgesprochene Bezugswort, ohne es ausdrücklich als Götzen festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher bewahrt. „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlich rekonstruierten Aussprache; die traditionelle Ersetzung durch einen Titel würde den Namen im Haupttext verdecken.
- issue: Bedeutung von נִבְּאוּ בַבַּעַל
  choice: weissagten durch Baal
  alternative: weissagten im Namen Baals
  rationale: Die hebräische Präposition ב kann Mittel, Wirkmacht oder Sphäre bezeichnen. Der Haupttext erhält diese Spannung, während die geläufige Deutung als Weissagung in Baals Namen in der Fußnote genannt wird.
- issue: Unausgesprochenes Bezugswort im Schlusssatz
  choice: Dinge, die nichts nützen
  alternative: nutzlose Götzen
  rationale: Der Zusammenhang legt Götzen beziehungsweise falsche Mächte nahe, doch der hebräische Text nennt sie hier nicht ausdrücklich. Daher wird das Bezugswort nur allgemein ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt den vier Anklagen des hebräischen Textes. Bildhafte Leitungsbegriffe wie „Hirten“ und die offene Bezeichnung der nutzlosen Dinge bleiben erhalten; erklärende Präzisierungen stehen nur in den Fußnoten.
