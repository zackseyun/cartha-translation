id: JER.2.29
reference: Jeremiah 2:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֥/מָּה תָרִ֖יבוּ אֵלָ֑/י כֻּלְּ/כֶ֛ם פְּשַׁעְתֶּ֥ם בִּ֖/י נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/029.yaml
  text: Why do you contend with me? All of you have rebelled against me[b][a], declares Yahweh.
translation:
  language: de
  text: Warum streitet ihr mit mir?[a] Ihr alle habt euch gegen mich aufgelehnt,[b] spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum rechtet ihr mit mir?“ Das hebräische Verb kann streiten, rechten oder einen Rechtsstreit führen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ihr alle seid mir untreu geworden“ beziehungsweise „habt gegen mich rebelliert“. Das hebräische Verb bezeichnet oft Auflehnung oder einen Treuebruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Warum
  rationale: Leitet eine rhetorische Frage nach dem Grund für das Verhalten des Volkes ein und entspricht natürlichem modernem Deutsch.
- source_word: תָרִיבוּ
  choice: streitet ihr
  rationale: Das Verb ריב kann streiten, rechten oder einen Rechtsstreit führen bedeuten. „Streiten“ bewahrt die konfrontative Bedeutung und lässt den möglichen rechtlichen Unterton offen.
- source_word: אֵלַי
  choice: mit mir
  rationale: In Verbindung mit ריב ist „mit mir“ im Deutschen idiomatisch; „gegen mich“ würde die Feindseligkeit stärker festlegen.
- source_word: כֻּלְּכֶם
  choice: Ihr alle
  rationale: Gibt die nachdrückliche kollektive Anrede an das ganze Volk klar wieder.
- source_word: פְּשַׁעְתֶּם
  choice: habt euch aufgelehnt
  rationale: פשע bezeichnet häufig Auflehnung, Rebellion oder einen Treuebruch und ist stärker als eine allgemeine Übertretung.
- source_word: בִּי
  choice: gegen mich
  rationale: Bei פשע bezeichnet die Präposition die Person, gegen die sich die Auflehnung richtet.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche und würdige Wiedergabe der prophetischen Botenformel; der Gottesname יְהוָה wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Stärke des Vorwurfs פשע
  choice: habt euch gegen mich aufgelehnt
  alternative: habt gegen mich gesündigt / habt mich übertreten
  rationale: Die Formulierung bewahrt den Gedanken bewusster Rebellion beziehungsweise gebrochener Loyalität, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die rhetorische Frage bleibt knapp; der mögliche rechtliche Unterton von ריב und die starke Loyalitätsverletzung in פשע werden nicht vereindeutigt.
