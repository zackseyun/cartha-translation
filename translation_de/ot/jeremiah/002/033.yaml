  terminology: „Liebe“ bewahrt die offene Metaphorik. „Böse Frauen“ gibt die gewählte personale Lesart wieder; die alternative abstrakte Deutung wird ohne eine im Deutschen ungrammatische Beispielübersetzung in der Fußnote erklärt. „Wege“ erhält die bildliche Wiederaufnahme des hebräischen Weg-Vokabulars.
