translation:
  language: de
  text: Wie geschickt gestaltest du deinen Weg, um Liebe zu suchen! Darum hast du sogar bösen Frauen deine Wege beigebracht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die feminine Pluralform kann auch abstrakt verstanden werden, etwa als „böse Dinge“ oder „Böses“, statt sich auf Frauen zu beziehen.
    reason: lexical_alternative
  - marker: b
    text: 'Der geschriebene Text lautet: „ich habe gelehrt“; die masoretische Lesetradition liest: „du hast gelehrt“.'
    reason: textual_variant
lexical_decisions:
- source_word: מַה תֵּיטִיבִי דַּרְכֵּךְ
  choice: Wie geschickt richtest du deinen Weg darauf aus
  rationale: מַה leitet hier einen rhetorischen Ausruf des Grades ein. Die Hifil-Form von יטב bezeichnet zusammen mit „dein Weg“ ein geschicktes beziehungsweise wirksames Ausrichten des eigenen Vorgehens; die Formulierung bewahrt zugleich die ironische Schärfe.
- source_word: לְבַקֵּשׁ אַהֲבָה
  choice: Liebe zu suchen
  rationale: Der hebräische Text nennt im Singular „Liebe“, nicht ausdrücklich „Liebhaber“. Die offene, im Kontext jedoch anstößige Liebesmetaphorik bleibt dadurch erhalten.
- source_word: לָכֵן גַּם
  choice: Darum … sogar
  rationale: לָכֵן kennzeichnet die Folgerung, während גַּם die überraschende Steigerung hervorhebt.
- source_word: הָרָעוֹת
  choice: böse Frauen
  rationale: Die bestimmte feminine Pluralform wird im Zusammenhang mit der Darstellung Judas als untreuer Frau am ehesten auf Frauen bezogen. Eine abstrakte Deutung als „böse Dinge“ bleibt möglich und wird in der Fußnote genannt.
- source_word: למדתי
  choice: du hast … gelehrt
  rationale: Die masoretische Lesetradition und der durchgehende feminine Singular der Anrede stützen die zweite Person Singular. Die abweichende mögliche Deutung des geschriebenen Konsonantentextes wird textkritisch vermerkt.
- source_word: דְּרָכָיִךְ
  choice: deine Wege
  rationale: Der Plural wird bewahrt und greift das Weg-Motiv des ersten Satzteils auf; gemeint sind zugleich Verhaltensweisen und Praktiken.
theological_decisions:
- issue: Bezug der femininen Pluralform הָרָעוֹת innerhalb der Metapher unerlaubter Liebe
  choice: 'persönlicher Bezug: „böse Frauen“'
  alternative: 'abstrakter Bezug: „böse Dinge“ beziehungsweise „Böses“'
  rationale: Der unmittelbare Kontext personifiziert Juda als eine Frau, die verbotene Liebe sucht. Daher liegt ein Bezug auf andere Frauen nahe; da die Form auch abstrakt verstanden werden kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in einer Fußnote bewahrt.
- issue: Person des Verbs למדתי
  choice: 'zweite Person feminin Singular: „du hast gelehrt“'
  alternative: 'erste Person Singular nach möglicher Lesung des Konsonantentextes: „ich habe gelehrt“'
  rationale: Die zweite Person entspricht der masoretischen Lesetradition, der unmittelbaren Anrede und dem syntaktischen Zusammenhang. Die Spannung zum geschriebenen Text wird nicht stillschweigend beseitigt, sondern in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Liebe suchen“ bewahrt die bewusste Mehrdeutigkeit des hebräischen Ausdrucks; „deine Wege lehren“ ist leicht gehoben, hält aber die auffällige Weg-Metaphorik und die doppelte Akkusativkonstruktion des Ausgangstextes fest.
