  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ בְ/אָזְנֵ֨י יְרוּשָׁלִַ֜ם לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה זָכַ֤רְתִּי לָ/ךְ֙ חֶ֣סֶד נְעוּרַ֔יִ/ךְ אַהֲבַ֖ת כְּלוּלֹתָ֑יִ/ךְ לֶכְתֵּ֤/ךְ אַחֲרַ/י֙ בַּ/מִּדְבָּ֔ר בְּ/אֶ֖רֶץ לֹ֥א זְרוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/002.yaml
  text: 'Go and proclaim in the hearing of Jerusalem[a], saying, ‘Thus says Yahweh: I remember for you the faithful love of your youth, the love of your betrothal, when you went after me in the wilderness[b], in a land not sown.’'
translation:
  language: de
  text: 'Geh und rufe Jerusalem[a] zu: »So spricht Jahwe: Ich erinnere mich an die treue Liebe deiner Jugend, an die Liebe deiner Brautzeit[b], als du mir in der Wüste folgtest, in einem Land, das nicht besät war.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Ohren Jerusalems“. Jerusalem steht hier für die Stadt und ihre Bewohner.'
    reason: idiom_explanation
  - marker: b
    text: 'Oder: „die Liebe deiner Verlobungszeit“. Der hebräische Ausdruck bezeichnet den Brautstand beziehungsweise die Brautzeit und legt nicht eindeutig fest, ob Verlobung, Hochzeit oder frühe Ehe gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  choice: Geh und rufe
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt den Auftrag. „Geh und rufe“ bewahrt sowohl die Bewegung als auch die öffentliche prophetische Verkündigung.
- source_word: בְאָזְנֵי יְרוּשָׁלִַם
  choice: Jerusalem ins Ohr
  rationale: Die bildhafte hebräische Wendung „in die Ohren Jerusalems“ wird in einer knappen, verständlichen deutschen Form bewahrt; Jerusalem steht metonymisch für seine Bevölkerung.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird idiomatisch und würdevoll wiedergegeben; der Gottesname bleibt als Eigenname erkennbar.
- source_word: זָכַרְתִּי לָךְ
  choice: Ich erinnere mich an
  rationale: Im Deutschen verlangt „sich erinnern“ eine andere Konstruktion als das Hebräische. Die auf Jerusalem beziehungsweise Israel bezogene Erinnerung wird natürlich ausgedrückt, ohne das schwer verständliche „für dich“ nachzubilden.
- source_word: חֶסֶד
  choice: Güte
  rationale: „Güte“ umfasst hier liebevolle Zuwendung und loyale Verbundenheit, ohne den Ausdruck auf einen rein technischen Bundesbegriff einzuengen; die Alternative „Treue“ wird in der Fußnote genannt.
- source_word: נְעוּרַיִךְ
  choice: deiner Jugend
  rationale: Die Formulierung bewahrt das Bild von Israels früher Lebens- und Beziehungsepoche.
- source_word: אַהֲבַת כְּלוּלֹתָיִךְ
  choice: die Liebe deiner Brautzeit
  rationale: „Brautzeit“ erhält die ehelich-bundeshafte Bildsprache und lässt offen, ob Verlobungszeit, Hochzeit oder frühe Ehe im Vordergrund steht.
- source_word: לֶכְתֵּךְ אַחֲרַי
  choice: als du mir ... folgtest
  rationale: Die temporale Funktion der Infinitivkonstruktion wird natürlich ausgedrückt; „folgen“ gibt das hebräische „hinter jemandem hergehen“ idiomatisch wieder.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: „Wüste“ ist im modernen Standarddeutsch die natürliche Bezeichnung und ruft den Exoduskontext auf.
- source_word: בְּאֶרֶץ לֹא זְרוּעָה
  choice: in einem Land, das nicht besät war
  rationale: Die landwirtschaftliche Vorstellung eines unbestellten, unfruchtbaren Landes und die hebräische Prädikatsstruktur bleiben klar erkennbar.
theological_decisions:
- issue: Ehebild für Israels frühe Beziehung zu Jahwe
  choice: „die Liebe deiner Brautzeit“
  alternative: „die Liebe deiner Verlobungszeit“ oder „deine Liebe als Braut“
  rationale: Die Fassung bewahrt das Beziehungs- und Bundesbild, ohne festzulegen, ob der hebräische Ausdruck ausschließlich Verlobung, Hochzeit oder frühe Ehe bezeichnet.
- issue: Bezug von חֶסֶד
  choice: „die Güte deiner Jugend“ als von Israel ausgesagte Haltung
  alternative: „die treue Liebe deiner Jugend“
  rationale: Die feminine Anrede und der Parallelismus mit „deiner Brautzeit“ beziehen die erinnerte Zuwendung auf Jerusalem beziehungsweise Israel. Der Begriff bleibt zugleich offen für Liebe, Loyalität und hingebungsvolle Verbundenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und nuptialer Bildsprache. Die direkte Anrede Jerusalems bleibt feminin und wird nicht erklärend zu „Israel“ umformuliert. Leicht markierte Bildsprache wie „Jerusalem ins Ohr“ erhält die Eindringlichkeit des Originals.
