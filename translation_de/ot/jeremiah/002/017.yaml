source:
  edition: WLC
  text: הֲ/לוֹא זֹ֖את תַּעֲשֶׂה לָּ֑/ךְ עָזְבֵ/ךְ֙ אֶת יְהוָ֣ה אֱלֹהַ֔יִ/ךְ בְּ/עֵ֖ת מוֹלִיכֵ֥/ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/017.yaml
  text: Has not this brought it upon you[b][a], because you have forsaken Yahweh your God when he was leading you in the way?
translation:
  language: de
  text: Hast du dir das nicht selbst zugezogen[a], weil du Jahwe, deinen Gott, verlassen hast, als[b] er dich auf dem Weg führte?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Hat dies dir nicht angetan?“ Die hebräische Satzfügung ist elliptisch; die idiomatische Übersetzung entfaltet den Zusammenhang als selbst zugezogene Folge.'
    reason: Die hebräische Wendung enthält nur ein Demonstrativum und lässt die genauere Ergänzung offen.
  - marker: b
    text: 'Oder: „während er dich auf dem Weg führte“.'
    reason: Das Partizip kann den andauernden Charakter des Führens stärker hervorheben.
lexical_decisions:
- source_word: הֲלוֹא
  choice: Hast du … nicht
  rationale: Kennzeichnet eine rhetorische Frage, die eine bejahende Antwort erwartet, und bewahrt den vorwurfsvollen Ton.
- source_word: זֹאת תַּעֲשֶׂה לָּךְ
  choice: dir das nicht selbst zugezogen
  rationale: Die Wendung lautet wörtlicher etwa „Hat dies dir das getan?“ Im Zusammenhang bezeichnet sie das Unheil als Folge des eigenen Handelns. Die deutsche Formulierung gibt diesen Sinn natürlich wieder; die ungewöhnliche und mehrdeutige hebräische Konstruktion wird in einer Fußnote offengelegt.
- source_word: עָזְבֵךְ
  choice: weil du … verlassen hast
  rationale: 'Der Infinitiv mit Suffix bezeichnet hier den Grund: „dein Verlassen“. Der kausale Nebensatz ist im Deutschen klar und idiomatisch.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהַיִךְ
  choice: deinen Gott
  rationale: Direkte Wiedergabe der possessiven Bundesbezeichnung; die Apposition wird im Deutschen durch Kommas abgesetzt.
- source_word: בְּעֵת מוֹלִיכֵךְ
  choice: als er dich … führte
  rationale: בְּעֵת führt eine Zeitangabe ein, und das Hifil-Partizip bezeichnet Jahwe als den Führenden. „Als“ ist natürlich, während die mögliche Betonung eines fortdauernden Vorgangs in der Fußnote erhalten bleibt.
- source_word: בַּדָּרֶךְ
  choice: auf dem Weg
  rationale: Bewahrt das Wegbild und klingt im modernen Deutsch natürlich, ohne eine rein räumliche oder eine moralisch-bundestheologische Deutung festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Seine Wiedergabe als „Jahwe“ bewahrt den Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Verhältnis zwischen Israels Abkehr und dem erlittenen Unheil
  choice: Das Unheil wird als selbst zugezogene Folge des Verlassens Jahwes formuliert.
  alternative: 'Eine streng wörtliche Formulierung mit „dies“ als grammatischem Subjekt: „Hat dies dir das angetan …?“'
  rationale: Der Kontext stützt die Deutung als Folge der eigenen Abkehr. Da die hebräische Syntax ungewöhnlich ist und nicht ausdrücklich „selbst“ sagt, wird die formnähere Alternative in Fußnote [a] genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede steht entsprechend dem hebräischen Femininum im Singular und richtet sich im Zusammenhang an Israel. „Sich etwas zuziehen“ ist verständlich und ernst, ohne die umgangssprachliche Färbung von „sich etwas einbrocken“.
