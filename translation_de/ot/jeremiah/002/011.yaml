base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/011.yaml
  text: Has a nation changed its gods—though they are not gods? Yet my people have changed their glory for what does not profit[a][b][c].
translation:
  language: de
  text: Hat ein Volk seine Götter gewechselt[a], obwohl sie keine Götter sind? Doch mein Volk hat seine Herrlichkeit[b] gegen etwas eingetauscht, das nichts nützt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ausgetauscht“ beziehungsweise „ersetzt“. Dasselbe hebräische Verb wird im zweiten Satzteil mit „eingetauscht“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: Mit „seine Herrlichkeit“ ist hier wahrscheinlich der HERR gemeint, Israels wahre Herrlichkeit. Möglich ist auch ein Verständnis als Israels eigene Ehre oder Herrlichkeit.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „gegen etwas Nutzloses“ beziehungsweise „gegen etwas, das nicht hilft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵימִיר
  choice: gewechselt / eingetauscht
  rationale: Das Verb bezeichnet ein Wechseln, Austauschen oder Ersetzen. Im ersten Satzglied ist „seine Götter gewechselt“ natürliches Deutsch; im zweiten bringt „gegen etwas eingetauscht“ die Austauschbeziehung klar zum Ausdruck. Die unterschiedlichen deutschen Verben geben hier dieselbe hebräische Wortwurzel kontextgerecht wieder.
- source_word: גּוֹי
  choice: Volk
  rationale: Gemeint ist eine ethnisch-politische Gemeinschaft. „Volk“ passt zum prophetischen Zusammenhang und ermöglicht zugleich den deutlichen Kontrast zu „mein Volk“ im zweiten Satzglied.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Der Plural bezeichnet die vermeintlichen Gottheiten der Völker; „Götter“ ist die klare und übliche deutsche Entsprechung.
- source_word: וְהֵמָּה לֹא אֱלֹהִים
  choice: obwohl sie gar keine Götter sind
  rationale: Die Formulierung bewahrt den pluralischen Bezug und gibt die einräumende, zugleich polemische Aussage in natürlichem Deutsch wieder. „gar keine“ unterstreicht, ohne den Sinn auszuweiten, dass es sich in Wahrheit nicht um Götter handelt.
- source_word: וְעַמִּי
  choice: Doch mein Volk
  rationale: '„Doch“ macht den scharfen, ironischen Gegensatz sichtbar: Die Völker halten an ihren Nichtgöttern fest, Israel dagegen gibt seine Herrlichkeit preis.'
- source_word: כְּבוֹדוֹ
  choice: seine Herrlichkeit
  rationale: Das Suffix ist grammatisch singular und bezieht sich auf das kollektiv-singularische „mein Volk“. „Herrlichkeit“ wahrt die metonymische beziehungsweise titelartige Ausdrucksweise, ohne den Bezug im Haupttext ausdrücklich als den HERRN festzulegen.
- source_word: בְּלֹא יוֹעִיל
  choice: gegen etwas, das nichts nützt
  rationale: Die Wendung bezeichnet etwas, das keinen Nutzen oder keine Hilfe bringt. Diese Übersetzung ist in modernem Deutsch verständlich und behält die prophetische Wertung bei.
theological_decisions:
- issue: Bezug von כְּבוֹדוֹ („seine Herrlichkeit“)
  choice: Die hebräische Metonymie bleibt als „seine Herrlichkeit“ erhalten; im Kontext ist wahrscheinlich der HERR als Israels wahre Herrlichkeit gemeint.
  alternative: Israels eigene Ehre oder Herrlichkeit beziehungsweise Herrlichkeit in abstraktem Sinn.
  rationale: Der Göttervergleich legt den HERRN als Bezug nahe. Eine direkte Wiedergabe mit „den HERRN“ würde die echte sprachliche Mehrdeutigkeit jedoch auflösen; Kleinschreibung vermeidet zudem, im Deutschen einen eindeutigen Eigennamen oder Titel einzuführen, den der hebräische Text nicht ausdrücklich markiert.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die rhetorische Frage und der Gegensatz der beiden Satzglieder bleiben erhalten. Die Formulierung „seine Herrlichkeit“ bewahrt die theologische und sprachliche Spannung des Hebräischen.
