source:
  edition: WLC
  text: גַּ֣ם מֵ/אֵ֥ת זֶה֙ תֵּֽצְאִ֔י וְ/יָדַ֖יִ/ךְ עַל רֹאשֵׁ֑/ךְ כִּֽי מָאַ֤ס יְהֹוָה֙ בְּ/מִבְטַחַ֔יִ/ךְ וְ/לֹ֥א תַצְלִ֖יחִי לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/037.yaml
  text: From this one too you will go out with your hands on your head[a], for Yahweh has rejected those in whom you trust[d][c][b], and you will not prosper through them.
translation:
  language: de
  text: Auch von diesem[a] wirst du fortgehen, die Hände auf dem Kopf[b]. Denn Jahwe hat verworfen, worauf du dein Vertrauen setzt[c], und mit ihnen wirst du keinen Erfolg haben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der eben erwähnte auswärtige Bündnispartner, nämlich Ägypten. Wörtlich steht hier nur „von diesem“.
    reason: alternative_reading
  - marker: b
    text: Die Hände auf den Kopf zu legen war ein Zeichen von Trauer, Schande oder Niederlage.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „deine Sicherheiten“ oder „deine Vertrauensobjekte“. Gemeint sein können auch die Menschen oder Mächte, auf die du vertraust.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „Durch sie wird es dir nicht gelingen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: 'Das Wort führt den Gedanken aus dem vorherigen Zusammenhang weiter: Auch dieser auswärtige Hoffnungsträger wird Juda enttäuschen.'
- source_word: מֵאֵת זֶה
  choice: von diesem
  rationale: Die demonstrative Form bleibt bewusst erhalten. Im Zusammenhang ist vermutlich Ägypten beziehungsweise der gerade genannte auswärtige Bündnispartner gemeint, doch der hebräische Ausdruck benennt ihn hier nicht ausdrücklich.
- source_word: תֵּצְאִי
  choice: wirst du fortgehen
  rationale: Das Verb יצא bezeichnet hier das Weggehen beziehungsweise Zurückkehren von einem Bündnispartner; „fortgehen“ ist im Deutschen natürlich und lässt die genaue Bewegungsrichtung offen.
- source_word: וְיָדַיִךְ עַל רֹאשֵׁךְ
  choice: die Hände auf dem Kopf
  rationale: Die konkrete Körperhaltung wird bewahrt; sie bringt im damaligen kulturellen Zusammenhang Trauer, Schande oder Niederlage zum Ausdruck.
- source_word: מָאַס
  choice: hat verworfen
  rationale: „Verworfen“ gibt die entschiedene Zurückweisung wieder, ohne die stärkere emotionale Bedeutung „verachtet“ festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen übliche Form.
- source_word: בְּמִבְטַחַיִךְ
  choice: worauf du dein Vertrauen setzt
  rationale: Das hebräische Abstraktum steht im Plural und kann die Personen, Mächte oder Mittel bezeichnen, auf die Juda vertraut. Die deutsche Formulierung bleibt idiomatisch und legt den Bezug nicht unnötig fest.
- source_word: תַצְלִיחִי לָהֶם
  choice: damit wirst du keinen Erfolg haben
  rationale: Das Hifil von צלח bezeichnet Gelingen oder Erfolg. „Damit“ nimmt die zuvor genannten Vertrauensobjekte auf, ohne eindeutig zwischen „mit ihnen“ und „durch sie“ zu entscheiden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ bewahrt den Charakter als Eigenname; die deutsche Schreibform entspricht dem üblichen Sprachgebrauch.
- issue: Bezug der verworfenen Vertrauensobjekte
  choice: worauf du dein Vertrauen setzt
  alternative: die Mächte, denen du vertraust
  rationale: Der Zusammenhang weist auf auswärtige Bündnispartner, besonders Ägypten. Der hebräische Plural מִבְטַחַיִךְ ist jedoch abstrakter und kann Personen, Mächte oder andere Sicherheiten umfassen; deshalb wird die politische Deutung nicht exklusiv in den Haupttext aufgenommen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede im Singular und das Zukunftsgefüge des Hebräischen bleiben erhalten. Die knappe demonstrative Wendung „von diesem“ bewahrt die im Vers selbst vorhandene Unbestimmtheit; die Fußnote erschließt den Zusammenhang mit Ägypten.
