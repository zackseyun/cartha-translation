  naturalness: »Wildeselin«, »Brunst« und »sich abmühen« sind modernes, verständliches Standarddeutsch und dem prophetischen Register angemessen. »Den Wind schnuppern« ist im Deutschen eine natürliche, bildhafte Wiedergabe; die wörtliche Zeitangabe »in ihrem Monat« darf mit Erklärung stehen bleiben.
  terminology: Die feminine Tierbezeichnung und die femininen Pronomina sind im deutschen Kontext angemessen. »Brunst« trifft תַּאֲנָתָהּ präzise. »Monat« bewahrt die ungewöhnliche hebräische Formulierung, ohne ihre wahrscheinlich auf die Paarungszeit bezogene Bedeutung in den Haupttext einzutragen.
