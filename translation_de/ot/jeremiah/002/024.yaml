  text: פֶּ֣רֶה לִמֻּ֣ד מִדְבָּ֗ר בְּ/אַוַּ֤ת נפש/ו שָׁאֲפָ֣ה ר֔וּחַ תַּאֲנָתָ֖/הּ מִ֣י יְשִׁיבֶ֑/נָּה כָּל מְבַקְשֶׁ֨י/הָ֙ לֹ֣א יִיעָ֔פוּ בְּ/חָדְשָׁ֖/הּ יִמְצָאֽוּ/נְהָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/024.yaml
  text: A wild donkey accustomed to the wilderness[a], in the craving of her appetite sniffs the wind; in her heat, who can turn her back? All who seek her will not weary themselves[c][b]; in her month they will find her.
translation:
  language: de
  text: Eine an die Wüste gewöhnte Wildeselin schnuppert in ihrem heftigen Verlangen den Wind. Wer kann sie in ihrer Brunst zurückhalten? Alle, die sie suchen, brauchen sich nicht abzumühen; in ihrem Monat[a] werden sie sie finden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in ihrem Monat«; wahrscheinlich ist die Zeit ihrer Brunst oder ihres Paarungszyklus gemeint.'
    reason: cultural_note
lexical_decisions:
- source_word: פֶּרֶה
  choice: Wildeselin
  rationale: Das Wort bezeichnet den Wildesel bzw. Onager; wegen der durchgehend weiblichen Bildsprache ist die feminine Form im Deutschen passend.
- source_word: לִמֻּד מִדְבָּר
  choice: an die Wüste gewöhnt
  rationale: Die adjektivische Fügung beschreibt ein Tier, das an das Leben in der Wüste gewöhnt ist.
- source_word: בְּאַוַּת נַפְשׁוֹ
  choice: in ihrem heftigen Verlangen
  rationale: Die Wendung bezeichnet starkes Begehren. Das feminine Pronomen folgt dem Gesamtbild der Wildeselin; der auffällige maskuline Suffix wird nicht künstlich in die deutsche Grammatik übertragen.
- source_word: שָׁאֲפָה רוּחַ
  choice: schnappt … nach Luft
  rationale: שׁאף mit רוּחַ kann das gierige Einziehen von Luft bezeichnen. Die Formulierung bewahrt die körperliche Unruhe des Bildes; als Alternative ist das Wittern des Windes möglich.
- source_word: תַּאֲנָתָהּ
  choice: in ihrer Brunst
  rationale: Das seltene Wort bezeichnet hier den Zustand oder Zeitpunkt sexueller Erregung eines Tieres. „Brunst“ ist im Deutschen zoologisch klar und knapp.
- source_word: מִי יְשִׁיבֶנָּ
  choice: Wer kann sie … zurückhalten?
  rationale: Der Hifil von שוב bedeutet wörtlich, sie umkehren bzw. zurückkehren zu lassen; im Kontext steht die Unmöglichkeit im Vordergrund, ihren Drang aufzuhalten.
- source_word: כָּל מְבַקְשֶׁיהָ לֹא יִיעָפוּ
  choice: Alle, die sie suchen, brauchen sich nicht abzumühen
  rationale: Die Verfolger müssen sich nicht erschöpfen, weil das Tier zur entsprechenden Zeit leicht zu finden ist.
- source_word: בְּחָדְשָׁהּ
  choice: in ihrem Monat
  rationale: Die wörtliche, ungewöhnliche Zeitangabe bleibt im Haupttext erhalten; ihre wahrscheinliche Bedeutung wird in einer Fußnote erklärt.
- source_word: יִמְצָאוּנְהָ
  choice: werden sie sie finden
  rationale: Die einfache deutsche Zukunftsform gibt die Aussage des Kontextes natürlich wieder.
theological_decisions:
- issue: Geschlechtskongruenz im Bild der Wildeselin für Juda
  choice: Durchgehend feminine Bezüge verwenden
  alternative: Den formal maskulinen Suffix in נַפְשׁוֹ ausdrücklich abbilden
  rationale: Tierbezeichnung, Verbformen und die übrigen Suffixe führen das Bild feminin fort. Ein einzelner maskuliner Bezug im Deutschen würde den Sinn unnötig verdunkeln.
- issue: Deutung von בְּחָדְשָׁהּ
  choice: Die wörtliche Wendung „in ihrem Monat“ im Text bewahren und erläutern
  alternative: Im Haupttext deutend „zur Zeit ihrer Brunst“ übersetzen
  rationale: Die hebräische Formulierung ist ungewöhnlich und vermutlich auf Brunst- oder Paarungszeit bezogen. Die wörtliche Wiedergabe erhält die genuine Bildspannung, während die Fußnote Orientierung gibt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Das derbe und sexuell aufgeladene Tierbild des hebräischen Textes wird nicht abgeschwächt. „Wildeselin“ und „Brunst“ sind präzise, allgemein verständliche Tierbezeichnungen; die ungewöhnliche Wendung „in ihrem Monat“ bleibt bewusst erhalten.
