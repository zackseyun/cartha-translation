revisions:
- from: Eine Wildeselin, an die Wüste gewöhnt, schnappt in ihrem heftigen Verlangen nach Luft. Wer kann sie in ihrer Brunst zurückhalten? Alle, die sie suchen, brauchen sich nicht abzumühen; in ihrem Monat[a] werden sie sie finden.
  to: Eine an die Wüste gewöhnte Wildeselin schnuppert in ihrem heftigen Verlangen den Wind. Wer kann sie in ihrer Brunst zurückhalten? Alle, die sie suchen, brauchen sich nicht abzumühen; in ihrem Monat[a] werden sie sie finden.
  rationale: Die Revision ersetzt die einengende Wiedergabe »nach Luft schnappen« durch »den Wind schnuppern«, um das hebräische Bild vom begierigen Einziehen bzw. Wittern des Windes besser zu erhalten. Die rhetorische Frage wird so gestellt, dass die Brunst eindeutig den Zustand bezeichnet, in dem das Tier nicht zurückzuhalten ist. Die wörtliche, erklärungsbedürftige Wendung »in ihrem Monat« und die bestehende Fußnote bleiben erhalten.
