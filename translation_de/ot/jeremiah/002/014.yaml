id: JER.2.14
reference: Jeremiah 2:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/עֶ֨בֶד֙ יִשְׂרָאֵ֔ל אִם יְלִ֥יד בַּ֖יִת ה֑וּא מַדּ֖וּעַ הָיָ֥ה לָ/בַֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/014.yaml
  text: Is Israel a servant[b][a], or a homeborn servant? Why then has he become plunder?
translation:
  language: de
  text: Ist Israel etwa ein Sklave oder ein im Haus geborener Sklave?[a] Warum ist er dann zur Beute geworden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „oder ein im Haus Geborener?“ Gemeint ist jemand, der als Sklave im Haushalt seines Herrn geboren wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Warum ist er dann zum Plündergut geworden?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֶבֶד
  choice: ein Sklave
  rationale: עֶבֶד bezeichnet einen Diener oder Sklaven. Hier ist der Status der Unfreiheit für die rhetorische Frage entscheidend; „Sklave“ gibt diese soziale Wirklichkeit klar wieder.
- source_word: אִם
  choice: oder
  rationale: In dieser Doppelfrage führt אִם die alternative Möglichkeit ein und wird im Deutschen natürlich mit „oder“ wiedergegeben.
- source_word: יְלִיד בַּיִת
  choice: ein im Haus geborener Sklave
  rationale: Die Wendung bedeutet wörtlich „im Haus Geborener“ und bezeichnet hier jemanden, der als Sklave in den Haushalt seines Herrn hineingeboren wurde. Die ausformulierte Wiedergabe ist im modernen Deutsch verständlicher als ein künstliches Kompositum.
- source_word: מַדּוּעַ
  choice: Warum … dann
  rationale: „Warum“ gibt das Fragewort wieder; „dann“ verdeutlicht den im Kontext angelegten rhetorischen Schluss aus den vorausgehenden Fragen.
- source_word: הָיָה לָבַז
  choice: ist … zur Beute geworden
  rationale: היה mit ל drückt hier das Eintreten in einen Zustand aus. בַּז kann Beute, Raubgut oder Plündergut bezeichnen; „zur Beute geworden“ ist natürlich und bewahrt das Bild, dass Israel anderen ausgeliefert ist.
theological_decisions:
- issue: Sozialstatus in עֶבֶד und יְלִיד בַּיִת
  choice: Beide Ausdrücke mit ausdrücklicher Sklavereisprache wiedergeben
  alternative: „Diener“ beziehungsweise „einer, der im Haus geboren ist“
  rationale: Die rhetorische Spannung setzt voraus, dass Israel nicht von Natur aus den Status eines unfreien Haushaltsangehörigen hat. „Sklave“ vermeidet eine beschönigende Wiedergabe, ohne eine besondere theologische Deutung hinzuzufügen.
- issue: Bildwort בַּז
  choice: Beute
  alternative: Plündergut oder Raubgut
  rationale: „Beute“ kann sowohl gewaltsam angeeignetes Gut als auch ein Opfer fremder Gewalt bezeichnen und erhält so die mögliche Bildweite des hebräischen Nomens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Etwa“ markiert den rhetorischen Charakter der ersten Frage, ohne ihre formale Offenheit aufzuheben. Die maskuline Personifikation Israels wird mit „er“ bewahrt.
