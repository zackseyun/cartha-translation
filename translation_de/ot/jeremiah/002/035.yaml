  source_fidelity: 'Eine sichere Korrektur ist beim ersten Verb nötig: וַתֹּאמְרִי ist ein waw-konsekutives Präteritum und verweist auf die vorangehende Behauptung („du hast gesagt“), nicht auf ein gegenwärtiges Sagen. Die zweite Form אָמְרֵךְ bezeichnet dagegen die für das Gericht maßgebliche fortgesetzte Behauptung und kann passend präsentisch stehen bleiben. Die übrigen Formulierungen geben Unschuld, die emphatische Partikel, das Abwenden des Zorns und die gerichtliche Nuance von נִשְׁפָּט אֹתָךְ angemessen wieder.'
