base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/035.yaml
  text: Yet you said[a], “I am innocent; surely his anger has turned away from me.” Behold, I am entering into judgment with you because you say, “I have not sinned.”
translation:
  language: de
  text: 'Doch du hast gesagt: „Ich bin unschuldig; gewiss hat sich sein Zorn von mir abgewandt.“ Sieh, ich trete mit dir ins Gericht, weil du sagst: „Ich habe nicht gesündigt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Doch du sagst
  rationale: Die feminine Singularform richtet sich an Juda beziehungsweise Jerusalem. Das einleitende Waw führt die Anklage mit kontrastivem Akzent fort; „Doch“ gibt diesen Zusammenhang natürlich wieder. Das hebräische Imperfekt mit Waw-Fortführung kann im lebendigen Anklagediskurs deutsch präsentisch wiedergegeben werden.
- source_word: נִקֵּיתִי
  choice: Ich bin unschuldig
  rationale: Der Nifal von נקה bezeichnet hier das Freisein von Schuld. „Unschuldig“ bewahrt sowohl den moralischen als auch den gerichtlichen Sinn.
- source_word: אַךְ
  choice: gewiss
  rationale: Die Partikel verstärkt hier die selbstsichere Behauptung der Sprecherin und ist nicht exklusiv im Sinn von „nur“ zu verstehen.
- source_word: שָׁב אַפּוֹ מִמֶּנִּי
  choice: hat sich sein Zorn von mir abgewandt
  rationale: שׁוב mit אַף beschreibt idiomatisch das Abwenden des Zorns. Die reflexive deutsche Formulierung ist natürlich und hält das Bild der Richtungsänderung fest.
- source_word: הִנְנִי
  choice: Sieh
  rationale: Die deiktische Partikel lenkt nachdrücklich die Aufmerksamkeit auf Gottes unmittelbar folgende Erklärung. „Sieh“ ist würdevoll, verständlich und weniger altertümlich als „Siehe“.
- source_word: נִשְׁפָּט אוֹתָךְ
  choice: ich trete mit dir ins Gericht
  rationale: Der Nifal von שׁפט mit אוֹת bewahrt hier die forensische Vorstellung eines Rechtsstreits. Die deutsche Wendung gibt die gerichtliche Auseinandersetzung genauer wieder als das allgemeinere „ich richte dich“.
- source_word: עַל אָמְרֵךְ
  choice: weil du sagst
  rationale: עַל mit der substantivierten Verbform nennt den Grund für das gerichtliche Vorgehen; der Kausalsatz ist im Deutschen idiomatisch.
- source_word: לֹא חָטָאתִי
  choice: Ich habe nicht gesündigt
  rationale: Das Perfekt bezeichnet in der direkten Rede die bestrittene Schuld; das deutsche Perfekt gibt diese bis in die Gegenwart geltende Leugnung passend wieder.
theological_decisions:
- issue: Gerichtliche Nuance des göttlichen Vorgehens
  choice: ich trete mit dir ins Gericht
  alternative: ich richte dich / ich führe einen Rechtsstreit gegen dich
  rationale: Die Formulierung erhält die Gerichtssprache des Hebräischen, ohne vorwegzunehmen, ob der Schwerpunkt auf Anklage, Rechtsstreit oder Urteil liegt.
- issue: Bezug von „sein Zorn“
  choice: sein Zorn
  alternative: mein Zorn
  rationale: Der hebräische Text hat ausdrücklich die dritte Person Singular. Die Übersetzung bewahrt diesen Wechsel in der zitierten Rede, statt den gemeinten göttlichen Sprecher durch „mein“ ausdrücklich zu identifizieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Anrede ist im deutschen Pronomen nicht sichtbar, ergibt sich aber aus dem Kontext. Die Gerichtssprache bleibt erhalten; unnötig altertümliche Formen werden vermieden.
