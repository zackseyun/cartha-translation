  terminology: „Unschuldig“, „Zorn“, „gesündigt“ und „ins Gericht treten“ sind in diesem Kontext treffend. Die Übersetzung wahrt den im Hebräischen stehenden Wechsel zu „sein Zorn“, ohne den Bezug unnötig zu explizieren.
