source:
  edition: WLC
  text: אֵ֣יךְ תֹּאמְרִ֞י לֹ֣א נִטְמֵ֗אתִי אַחֲרֵ֤י הַ/בְּעָלִים֙ לֹ֣א הָלַ֔כְתִּי רְאִ֤י דַרְכֵּ/ךְ֙ בַּ/גַּ֔יְא דְּעִ֖י מֶ֣ה עָשִׂ֑ית בִּכְרָ֥ה קַלָּ֖ה מְשָׂרֶ֥כֶת דְּרָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/023.yaml
  text: How can you say[a], ‘I have not defiled myself; I have not gone after the Baals’? Look at your way in the valley; know what you have done— a swift young she-camel[c][b], twisting her ways.
translation:
  language: de
  text: 'Wie kannst du sagen: »Ich habe mich nicht verunreinigt[a], ich bin den Baalen nicht nachgelaufen[b]«? Sieh deinen Weg im Tal an; erkenne, was du getan hast: eine flinke junge Kamelstute, die auf ihren Wegen hin und her läuft.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin nicht unrein geworden.«'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Ich bin den Baalen nicht gefolgt.«'
    reason: lexical_alternative
  - marker: c
    text: Das seltene hebräische Verb beschreibt möglicherweise eine junge Kamelstute, die auf ihren Spuren kreuz und quer läuft oder verschlungene Wege nimmt; seine genaue Bedeutung ist unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְמֵאתִי
  choice: ich habe mich nicht verunreinigt
  rationale: Das Nifal von טמא bezeichnet das Unrein- oder Verunreinigtwerden. Die reflexive deutsche Form gibt Judas Selbstrechtfertigung natürlich wieder und bewahrt den religiös-moralischen Sinn.
- source_word: אַחֲרֵי הַבְּעָלִים ... הָלַכְתִּי
  choice: ich bin den Baalen nicht nachgelaufen
  rationale: הלך אחרי bezeichnet das Hinterhergehen beziehungsweise Folgen. »Nachlaufen« bewahrt das Bewegungsbild und den vorwurfsvollen Ton; der Plural des Hebräischen bleibt erhalten.
- source_word: רְאִי דַרְכֵּךְ
  choice: Sieh deinen Weg ... an
  rationale: דרך kann sowohl den konkreten Weg als auch den Lebenswandel bezeichnen. Wegen der anschließenden Ortsangabe »im Tal« bleibt das Wegbild ausdrücklich erhalten.
- source_word: בַּגַּיְא
  choice: im Tal
  rationale: גיא bezeichnet ein Tal oder eine Schlucht. »Tal« ist im Deutschen natürlich und lässt die mögliche Anspielung auf einen Kultort offen.
- source_word: דְּעִי
  choice: erkenne
  rationale: Der Imperativ von ידע bedeutet wörtlich »wisse«; »erkenne« ist hier idiomatischer und fordert dazu auf, das eigene Tun wahrzunehmen und einzugestehen.
- source_word: בִּכְרָה קַלָּה
  choice: eine flinke junge Kamelstute
  rationale: בכרה bezeichnet ein junges weibliches Kamel; קלה vermittelt Leichtigkeit beziehungsweise Schnelligkeit. »Flink« gibt die lebhafte, rastlose Bewegung natürlich wieder.
- source_word: מְשָׂרֶכֶת דְּרָכֶיהָ
  choice: die ihre Wege kreuz und quer läuft
  rationale: Das seltene Partizip ist in seiner genauen Bedeutung unsicher und beschreibt wahrscheinlich verschlungene, kreuzende oder unstete Bewegung. Die Formulierung vermittelt das Bild, ohne eine präzisere Bedeutung vorzutäuschen.
theological_decisions:
- issue: Plural בְּעָלִים und Götzendienst
  choice: den Baalen
  alternative: Baal; den Herren
  rationale: Der hebräische Text verwendet den Plural und verweist auf verschiedene Erscheinungsformen oder Kultbilder des Baal. Die deutsche Pluralform bewahrt diese Anklage, ohne sie zu verallgemeinern oder zu singularisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Femininum, entsprechend der personifizierten Adressatin. Das konkrete Weg- und Tierbild bleibt erhalten; die Unsicherheit des letzten Verbs wird in einer Fußnote ausgewiesen.
