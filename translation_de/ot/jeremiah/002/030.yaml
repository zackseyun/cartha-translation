  text: לַ/שָּׁוְא֙ הִכֵּ֣יתִי אֶת בְּנֵי/כֶ֔ם מוּסָ֖ר לֹ֣א לָקָ֑חוּ אָכְלָ֧ה חַרְבְּ/כֶ֛ם נְבִֽיאֵי/כֶ֖ם כְּ/אַרְיֵ֥ה מַשְׁחִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/030.yaml
  text: In vain I struck your sons[a]; they accepted no correction[c][b]. Your sword devoured your prophets like a destroying lion.
translation:
  language: de
  text: Vergeblich schlug ich eure Söhne[a]; sie nahmen keine Zurechtweisung[b] an. Euer Schwert verschlang eure Propheten wie ein Löwe, der Verderben bringt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Kinder“. Das Hebräische lautet wörtlich „eure Söhne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Erziehung“, „Zucht“ oder „Unterweisung“. Das hebräische Wort kann sowohl korrigierende Disziplin als auch sittliche Unterweisung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wie ein reißender Löwe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשָּׁוְא
  choice: Vergeblich
  rationale: Die mit לְ gebildete Wendung bezeichnet hier Ergebnislosigkeit; „vergeblich“ ist im Deutschen natürlich und prägnant.
- source_word: הִכֵּיתִי
  choice: habe ich ... geschlagen
  rationale: Die Hifil-Form von נכה bedeutet hier „schlagen“. Die Wiedergabe vermeidet sowohl archaisches „schlug“ im Sinne von „zerschlug“ als auch die nicht zwingende Zuspitzung auf Tötung.
- source_word: בְּנֵיכֶם
  choice: eure Söhne
  rationale: Die maskuline Pluralform bedeutet wörtlich „eure Söhne“. Eine mögliche allgemeinere Bedeutung wird in der Fußnote bewahrt.
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: מוּסָר umfasst erziehende Zucht, Korrektur und Unterweisung. Im Zusammenhang mit dem vorangehenden Schlagen steht die korrigierende Absicht im Vordergrund.
- source_word: לֹא לָקָחוּ
  choice: sie nahmen keine ... an
  rationale: לקח mit מוּסָר bezeichnet idiomatisch das Annehmen einer Zurechtweisung; die deutsche Formulierung bewahrt zugleich das Verb „nehmen“.
- source_word: אָכְלָה
  choice: fraß
  rationale: Das Verb אכל wird beim Schwert bildhaft gebraucht. „Fraß“ erhält die kräftige Personifikation und verbindet sich natürlich mit dem anschließenden Löwenvergleich.
- source_word: חַרְבְּכֶם
  choice: Euer Schwert
  rationale: Der Possessivbezug wird direkt bewahrt und benennt die Gewalt, die von den Angesprochenen ausgeht.
- source_word: נְבִיאֵיכֶם
  choice: eure Propheten
  rationale: Der Possessivbezug des Hebräischen bleibt erhalten und unterstreicht, dass die dem Volk zugehörigen beziehungsweise zu ihm gesandten Propheten dessen Gewalt zum Opfer fielen.
- source_word: כְּאַרְיֵה מַשְׁחִית
  choice: wie ein Löwe, der Verderben bringt
  rationale: Die Formulierung gibt das substantivisch-partizipiale מַשְׁחִית wieder, ohne die Bildsprache durch eine zusätzliche Vorstellung wie „reißend“ festzulegen.
theological_decisions:
- issue: Bezug von „eure Söhne“
  choice: Die wörtliche maskuline Bezeichnung bleibt im Haupttext stehen.
  alternative: „eure Kinder“ als umfassendere Wiedergabe
  rationale: Der hebräische Wortlaut ist maskulin plural, kann im prophetischen Sprachgebrauch aber eine Generation beziehungsweise die Angehörigen des Volkes breiter bezeichnen. Die Übersetzung entscheidet diese Reichweite nicht stillschweigend.
- issue: Art der göttlichen Maßnahme
  choice: „Zurechtweisung“ betont den korrigierenden Zweck des Schlagens.
  alternative: „Zucht“, „Erziehung“ oder „Unterweisung“
  rationale: מוּסָר verbindet Disziplinierung und Belehrung. Im Kontext ist Gericht nicht bloß vergeltend dargestellt, sondern auf Umkehr ausgerichtet, ohne dass der Ausdruck auf eine einzelne Lehrtradition eingeengt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Parallelismus. „Fraß“ bewahrt die drastische Personifikation des Schwertes; der Relativsatz beim Löwen klingt natürlicher als ein schwerfälliges Partizipialattribut.
