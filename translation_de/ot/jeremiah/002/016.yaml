  text: גַּם בְּנֵי נֹ֖ף ו/תחפנס יִרְע֖וּ/ךְ קָדְקֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/016.yaml
  text: Even the sons of Noph and Tahpanhes have grazed your crown.
translation:
  language: de
  text: Selbst die Bewohner von Nof[b] und Tachpanhes[a] haben dir den Scheitel abgefressen[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne von Nof und Tachpanhes“; „Söhne von“ kann im Hebräischen die Bewohner eines Ortes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Nof wird gewöhnlich mit der ägyptischen Stadt Memphis gleichgesetzt.
    reason: cultural_note
  - marker: c
    text: Das hebräische Verb bedeutet wörtlich „weiden“, „abweiden“ oder „abfressen“. Manche Übersetzungen geben den gemeinten Schaden deutender mit „zerschlagen“ oder „zermalmen“ wieder.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „die Höhe deines Kopfes“ beziehungsweise „deine Kopfhaut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Selbst
  rationale: 'Gibt den hervorhebenden Sinn im Zusammenhang wieder: Sogar Menschen aus diesen ägyptischen Städten fügen Juda Schaden zu.'
- source_word: בְּנֵי
  choice: die Bewohner von
  rationale: Wörtlich steht „Söhne von“; bei Ortsnamen bezeichnet diese hebräische Wendung jedoch häufig die Einwohner. „Bewohner“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: נֹף
  choice: Nof
  rationale: Der hebräische Ortsname wird transliteriert; seine übliche Identifizierung mit Memphis wird in einer Fußnote erläutert.
- source_word: תחפנס
  choice: Tachpanhes
  rationale: Der Ortsname wird in einer dem Hebräischen nahen, im Deutschen lesbaren Form transliteriert.
- source_word: יִרְעוּךְ
  choice: haben dir … abgeweidet
  rationale: Das Verb רעה bedeutet grundsätzlich „weiden, abweiden, fressen“. Die ungewöhnliche und demütigende Bildsprache wird bewahrt, statt sie durch eine sichere Deutung wie „zerschlagen“ zu ersetzen.
- source_word: קָדְקֹד
  choice: den Scheitel
  rationale: Bezeichnet den obersten Teil des Kopfes. „Scheitel“ bewahrt das Körperbild präziser als das allgemeinere „Kopf“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Ortsnamen bleiben transliteriert. Die bewusst ungewöhnliche Weide-Metapher des Hebräischen wird erhalten; der Dativ „dir“ gibt das hebräische Personenobjekt natürlich wieder.
