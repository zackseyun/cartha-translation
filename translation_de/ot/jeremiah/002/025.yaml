  source_fidelity: Die Grundbedeutung und die bewusst offene Metapher von זָרִים werden gut getroffen. Korrigiert werden sollten jedoch das präsentische „sagst“ für das hebräische narrative „sagtest“ sowie „ich liebe“ für das Perfekt אָהַבְתִּי. Außerdem ist „unbeschuht zu werden“ im Deutschen semantisch und stilistisch weniger passend als die aktive Wendung „barfuß zu gehen“.
  naturalness: „Bewahre deine Füße davor, unbeschuht zu werden“ wirkt wegen des Passivs unnatürlich. „Bewahre deine Füße davor, barfuß zu gehen“ ist modernes, verständliches Standarddeutsch und bewahrt das Bild. Die Vergangenheitsform in der anschließenden Erwiderung macht den prophetischen Redeablauf klar.
  terminology: „Kehle“, „Durst“ und „Fremde“ sind angemessen. „Fremde“ erhält die mehrschichtige, nicht auf Götter, Liebhaber oder politische Partner festzulegende Referenz. Die Fußnote erläutert diese Offenheit sachlich.
