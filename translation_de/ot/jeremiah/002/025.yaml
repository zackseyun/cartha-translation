    rationale: Der hebräische Ausdruck bezeichnet das Barfußsein bzw. Barfußgehen; das deutsche Passiv klingt unbeholfen und verschiebt die Aussage. „barfuß zu gehen“ gibt das Bild natürlich wieder.
  - severity: low
