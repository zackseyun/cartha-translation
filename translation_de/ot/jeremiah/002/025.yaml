base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/025.yaml
  text: Keep your feet from going unshod and your throat from thirst. But you said[a], “It is hopeless! No, for I have loved strangers, and after them I will go.”
translation:
  language: de
  text: 'Bewahre deine Füße davor, barfuß zu gehen, und deine Kehle vor Durst! Doch du sagtest: »Es ist hoffnungslos! Nein, denn ich habe Fremde[a] geliebt, und ihnen werde ich folgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ausländer“. Gemeint sein können bildlich fremde Götter, fremde Liebhaber oder fremde Völker beziehungsweise Bündnispartner.'
    reason: Lexikalische und metaphorische Mehrdeutigkeit von זָרִים.
lexical_decisions:
- source_word: מִנְעִי רַגְלֵךְ מִיָּחֵף
  choice: Bewahre deine Füße davor, unbeschuht zu werden
  rationale: Der feminine Singular richtet sich an das personifizierte Juda. Der hebräische Singular „Fuß“ ist kollektiv gebraucht; der deutsche Plural klingt natürlich. „Unbeschuht“ bewahrt das Bild des barfüßigen, aufreibenden Hinterherlaufens, ohne es ausdeutend als Verwundung wiederzugeben.
- source_word: וּגְרֹנֵךְ מִצִּמְאָה
  choice: und deine Kehle vor dem Durst
  rationale: „Kehle“ entspricht hier angesichts des Durstes der konkreten Bedeutung von גרון und erhält die parallele Körpermetaphorik.
- source_word: וַתֹּאמְרִי
  choice: Doch du sagst
  rationale: Das Waw wird wegen des widersprechenden Zusammenhangs adversativ wiedergegeben. Das deutsche Präsens vergegenwärtigt die direkte prophetische Anrede.
- source_word: נוֹאָשׁ
  choice: Es ist hoffnungslos!
  rationale: Die knappe Äußerung bezeichnet Resignation beziehungsweise die Zurückweisung jedes weiteren Abratens. Die Übersetzung bewahrt diese Mehrdeutigkeit.
- source_word: לֹא כִּי
  choice: Nein, denn
  rationale: לֹא weist die Aufforderung entschieden zurück; כִּי leitet die Begründung dieser Weigerung ein.
- source_word: אָהַבְתִּי זָרִים
  choice: ich liebe Fremde
  rationale: Das Perfekt beschreibt hier eine fortbestehende Bindung, die im Deutschen natürlich mit dem Präsens ausgedrückt wird. „Fremde“ lässt den metaphorischen Bezug offen.
- source_word: וְאַחֲרֵיהֶם אֵלֵךְ
  choice: und ihnen werde ich folgen
  rationale: Die Wendung gibt das hebräische „hinter ihnen hergehen“ idiomatisch wieder und erhält durch das Futur den entschlossenen Willen der Sprecherin.
theological_decisions:
- issue: Bezug von זָרִים innerhalb der Ehebruchsmetaphorik
  choice: Fremde
  alternative: fremde Götter; fremde Liebhaber; fremde Völker oder Bündnispartner
  rationale: Der Zusammenhang verbindet Untreue, Götzendienst und politische Hinwendung zum Ausland. Der Oberbegriff bewahrt diese prophetische Mehrschichtigkeit, statt sie auf nur einen Bezug festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede an das personifizierte Juda bleibt feminin aus dem Zusammenhang erschließbar. Der Parallelismus von Füßen und Kehle sowie die abrupte, trotzige Antwort werden bewahrt.
