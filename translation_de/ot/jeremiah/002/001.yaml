  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/001.yaml
  text: And the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes[a] erging an mich:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „JHWH“, hier „Jahwe“; traditionell wird der Gottesname mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form von היה leitet hier die nächste Aussage im Erzählverlauf ein. Zusammen mit „erging“ gibt „Und“ diese Funktion natürlich wieder, ohne das formelhafte „Und es geschah“ unnötig nachzuahmen.
- source_word: דְבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְבַר יְהוָה bewahrt „das Wort“ sowohl den festen Sprachgebrauch als auch den Bezug auf Gottes offenbarende Rede.
- source_word: יְהוָה
  choice: Jahwe
  rationale: „Jahwe“ ist die im Deutschen gebräuchliche wissenschaftliche Wiedergabe des Tetragramms und lässt den persönlichen Gottesnamen als solchen erkennen.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der im Deutschen üblichen Wendung „das Wort … erging“ wird die Richtung mit „an mich“ idiomatisch und genau ausgedrückt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen, nicht den Titel אֲדֹנָי. Die Wiedergabe „Jahwe“ bewahrt diesen Unterschied; die traditionelle Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Wortereignisformel bleibt durch „das Wort … erging an mich“ erkennbar; der Doppelpunkt führt natürlich zur in Vers 2 folgenden Rede über.
