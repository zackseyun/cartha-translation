base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/005.yaml
  text: 'Thus says Yahweh: What wrong did your fathers find in me[a], that they went far from me, and went after vanity[b], and became vain?'
translation:
  language: de
  text: 'So spricht Jahwe: Was für ein Unrecht fanden eure Vorfahren an mir[a], dass sie sich weit von mir entfernten, dem Nichtigen folgten und selbst nichtig wurden?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Welche Ungerechtigkeit fanden eure Vorfahren an mir …?“'
    reason: alternative_reading
  - marker: b
    text: '„Dem Nichtigen“ und „nichtig wurden“ geben im Hebräischen dieselbe Wortwurzel wieder: Indem sie dem Leeren und Wertlosen folgten, wurden sie selbst leer beziehungsweise wertlos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige prophetische Botenformel wird knapp und würdevoll wiedergegeben; der Gottesname יְהוָה erscheint in der im Deutschen üblichen Form „Jahwe“.
- source_word: מַה מָּצְאוּ אֲבוֹתֵיכֶם בִּי עָוֶל
  choice: Was für ein Unrecht fanden eure Vorfahren an mir
  rationale: Die rhetorische Frage und das hebräische Bild des Findens bleiben erhalten. „Unrecht“ deckt die moralische Bedeutung von עָוֶל ab; „Vorfahren“ ist im heutigen Deutsch natürlicher als „Väter“ und bezeichnet hier frühere Generationen.
- source_word: כִּי רָחֲקוּ מֵעָלַי
  choice: dass sie sich weit von mir entfernten
  rationale: „Sich entfernen“ bewahrt die räumliche Metapher für den Beziehungsbruch; „weit“ gibt רָחֲקוּ ausdrücklich wieder. כִּי wird als Folge beziehungsweise Begründung der rhetorischen Frage mit „dass“ angeschlossen.
- source_word: וַיֵּלְכוּ אַחֲרֵי הַהֶבֶל
  choice: dem Nichtigen folgten
  rationale: הלך אחרי bedeutet hier „jemandem oder etwas folgen“. „Das Nichtige“ lässt die Anspielung auf Götzen erkennen, ohne den weiteren Sinn von הֶבֶל als Leere, Hauch oder Wertlosigkeit auf eine einzige Deutung festzulegen.
- source_word: וַיֶּהְבָּלוּ
  choice: und selbst nichtig wurden
  rationale: '„Nichtig“ greift dieselbe Wortwurzel wie „dem Nichtigen“ auf und bewahrt so das Wortspiel: Wer dem Wertlosen folgt, wird selbst wertlos beziehungsweise leer. „Selbst“ verdeutlicht diese zugespitzte Folge, ohne einen neuen Sachgehalt einzuführen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von הַהֶבֶל
  choice: das Nichtige
  alternative: die Götzen
  rationale: Im Zusammenhang ist wahrscheinlich Götzendienst gemeint; dennoch bezeichnet הֶבֶל wörtlich und bildlich Hauch, Leere oder Nichtigkeit. Die Übersetzung wahrt diese gewollte Weite und das Wortspiel mit וַיֶּהְבָּלוּ.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur bleibt nahe am hebräischen rhetorischen Aufbau; ungebräuchliche oder missverständliche Wörter wie „eitel“ werden vermieden, während das zentrale Wortspiel durch „das Nichtige / nichtig werden“ erhalten bleibt.
