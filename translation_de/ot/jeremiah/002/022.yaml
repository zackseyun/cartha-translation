  text: כִּ֤י אִם תְּכַבְּסִי֙ בַּ/נֶּ֔תֶר וְ/תַרְבִּי לָ֖/ךְ בֹּרִ֑ית נִכְתָּ֤ם עֲוֺנֵ/ךְ֙ לְ/פָנַ֔/י נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/022.yaml
  text: For though you wash with natron and use much lye[a], your guilt is stained before me[c][b], declares the Lord YHWH.
translation:
  language: de
  text: Denn selbst wenn du dich mit Natron wäschst und reichlich Lauge[a] verwendest, bleibt deine Schuld vor mir befleckt[b] – Ausspruch des Herrn JHWH.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Waschalkali“. Gemeint ist ein antikes alkalisches Reinigungsmittel, nicht unbedingt Seife im heutigen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bleibt deine Schuld vor mir gekennzeichnet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn selbst wenn
  rationale: Die Verbindung führt hier einen konzessiven Gedanken ein und wahrt zugleich den Anschluss an den vorausgehenden Zusammenhang.
- source_word: תְּכַבְּסִי
  choice: du dich wäschst
  rationale: Das Verb bezeichnet gewöhnlich das Waschen von Stoffen; reflexiv wiedergegeben bleibt das konkrete Bild der versuchten Selbstreinigung erhalten.
- source_word: בַּנֶּתֶר
  choice: mit Natron
  rationale: נֶתֶר bezeichnet ein mineralisches Reinigungsmittel, wahrscheinlich Natron beziehungsweise Soda.
- source_word: וְתַרְבִּי לָךְ
  choice: reichlich … verwendest
  rationale: Die idiomatische Wendung drückt den Einsatz einer großen Menge aus; die natürliche deutsche Formulierung vermeidet ein hölzernes „für dich vermehrst“.
- source_word: בֹּרִית
  choice: Lauge
  rationale: Gemeint ist wahrscheinlich ein aus Pflanzen gewonnenes alkalisches Waschmittel, nicht moderne Seife.
- source_word: נִכְתָּם
  choice: bleibt … als Fleck bestehen
  rationale: Die seltene passive Form bezeichnet hier wahrscheinlich ein dauerhaftes Befleckt- oder Gezeichnetsein; die Wiedergabe hält das Waschbild und den bleibenden Zustand zusammen.
- source_word: עֲוֺנֵךְ
  choice: deine Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch daraus erwachsende Schuld bezeichnen; im Zusammenhang der vor Gott nicht entfernbaren Befleckung ist „Schuld“ treffend, ohne die moralische Dimension aufzugeben.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die Wendung bezeichnet Gottes unmittelbare Gegenwart und Beurteilung und lässt sich im Deutschen knapp und würdig wiedergeben.
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: Ausspruch des Herrn JHWH
  rationale: „Ausspruch“ bildet die prophetische Formel נְאֻם knapp ab; „Herr JHWH“ wahrt sowohl den Titel אֲדֹנָי als auch die im Ausgangstext stehende Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr JHWH
  alternative: Gott, der HERR; der Herr Jahwe
  rationale: Die Umschrift JHWH bewahrt die Unterscheidung zwischen dem Herrentitel und dem Tetragramm, ohne eine unsichere Aussprache verbindlich festzulegen.
- issue: Bedeutungsumfang von עָוֹן
  choice: Schuld
  alternative: Verfehlung; Unrecht
  rationale: Der Vers kann sowohl die Tat als auch deren Schuldfolge anklingen lassen. „Schuld“ passt zum gerichtlichen Gegenüber Gottes, während die Fußnote die mögliche Bildnuance von Befleckung beziehungsweise Kennzeichnung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die weiblichen Singularformen des Hebräischen werden im Deutschen durch das kontextuell natürliche „du“ wiedergegeben. Das konkrete Wasch- und Fleckenbild bleibt erhalten; altertümliche Fachbegriffe werden knapp erläutert.
