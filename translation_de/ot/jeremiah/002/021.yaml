revisions:
- from: Ich aber hatte dich als Edelrebe gepflanzt,[a] ganz und gar aus echtem Saatgut.[b] Wie hast du dich mir da in entartete Triebe eines fremden Weinstocks verwandelt?[c]
  to: Ich aber hatte dich als Edelrebe gepflanzt,[a] ganz und gar aus unverfälschtem Pflanzgut.[b] Wie bist du mir zu entarteten Trieben eines fremden Weinstocks geworden?[c]
  rationale: Die Revision beschränkt sich auf zwei sichere sprachliche Verbesserungen. »Bist du mir zu … geworden« bildet die hebräische Veränderungsaussage mit לִי präziser und natürlicher nach. »Unverfälschtes Pflanzgut« wahrt die Aussage von כֻּלֹּה זֶרַע אֱמֶת über die durchgängige Echtheit des ursprünglichen Pflanzenmaterials. Die Unsicherheit von סוּרֵי bleibt ausdrücklich in der Fußnote markiert.
