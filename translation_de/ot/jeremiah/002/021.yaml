  text: וְ/אָֽנֹכִי֙ נְטַעְתִּ֣י/ךְ שֹׂרֵ֔ק כֻּלֹּ֖/ה זֶ֣רַע אֱמֶ֑ת וְ/אֵיךְ֙ נֶהְפַּ֣כְתְּ לִ֔/י סוּרֵ֖י הַ/גֶּ֥פֶן נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/021.yaml
  text: Yet I planted you as a choice vine[a], wholly of true seed[c][b]. How then have you turned for me into the degenerate shoots of a foreign vine?
translation:
  language: de
  text: Ich aber hatte dich als Edelrebe gepflanzt,[a] ganz und gar aus unverfälschtem Pflanzgut.[b] Wie bist du mir zu entarteten Trieben eines fremden Weinstocks geworden?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als erlesene Weinrebe«; das hebräische Wort bezeichnet eine ausgewählte, hochwertige Rebe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ganz und gar aus echtem Saatgut« oder »durch und durch aus unverfälschtem Bestand«.'
    reason: lexical_alternative
  - marker: c
    text: Das mit »entartete Triebe« wiedergegebene hebräische Wort ist schwierig. Möglich sind auch »verwilderte Ranken« oder »verdorbener Wuchs«.
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: וְאָנֹכִי נְטַעְתִּיךְ
  choice: Ich aber hatte dich … gepflanzt
  rationale: Das betonte אָנֹכִי und die vorangestellte Konjunktion markieren den scharfen Gegensatz zur Entartung. Das Plusquamperfekt stellt im Deutschen die ursprüngliche Pflanzung natürlich der später eingetretenen Veränderung gegenüber.
- source_word: שֹׂרֵק
  choice: Edelrebe
  rationale: Das Wort bezeichnet eine ausgewählte, hochwertige Rebe. »Edelrebe« ist prägnant, gegenwärtig verständlich und bewahrt die Qualitätsaussage.
- source_word: כֻּלֹּה זֶרַע אֱמֶת
  choice: ganz und gar aus echtem Saatgut
  rationale: Die Wendung betont die durchgängige Echtheit und Zuverlässigkeit des Ausgangsmaterials. »Saatgut« hält die Pflanzenmetapher fest, ohne אֱמֶת vorschnell moralisch als Treue auszulegen.
- source_word: וְאֵיךְ
  choice: Wie … da
  rationale: Die Formulierung gibt den erstaunten, anklagenden Kontrast der rhetorischen Frage in natürlichem Deutsch wieder.
- source_word: נֶהְפַּכְתְּ לִי
  choice: hast du dich mir … verwandelt
  rationale: Der Nifal von הפך bezeichnet eine eingetretene Veränderung. Das Dativpronomen »mir« bewahrt die relationale Aussage des hebräischen לִי.
- source_word: סוּרֵי
  choice: entartete Triebe
  rationale: Die schwierige Form bezeichnet im Zusammenhang offenbar abgewichene oder verdorbene Wuchsformen. »Entartete Triebe« hält sowohl die Abweichung als auch das Weinrebenbild fest.
- source_word: הַגֶּפֶן נָכְרִיָּה
  choice: eines fremden Weinstocks
  rationale: נָכְרִיָּה bedeutet fremd beziehungsweise nicht zugehörig. »Fremder Weinstock« ist klares modernes Deutsch und wahrt das Bild.
theological_decisions:
- issue: Israel beziehungsweise Juda als von Gott gepflanzte Rebe
  choice: Das durchgehende Bild von Pflanzung, Saatgut, Trieben und Weinstock bleibt im Haupttext erhalten.
  alternative: Die Metapher als Aussage über ein ursprünglich reines, später verdorbenes Volk auszudeuten.
  rationale: Die Bildsprache trägt prophetische und bundestheologische Bezüge, die eine erklärende Paraphrase verengen würde. Ihre Spannung zwischen Gottes guter Pflanzung und der unerwarteten Entartung bleibt deshalb bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feminine Anrede ist im Deutschen beim Pronomen nicht sichtbar, bleibt aber durch die Rebenmetapher erschließbar. »Entartet« wird hier ausschließlich im botanisch-metaphorischen Sinn von einer vom ursprünglichen Bestand abweichenden Entwicklung gebraucht.
