source:
  edition: WLC
  text: וְ/לֹ֣א אָמְר֔וּ אַיֵּ֣ה יְהוָ֔ה הַ/מַּעֲלֶ֥ה אֹתָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַ/מּוֹלִ֨יךְ אֹתָ֜/נוּ בַּ/מִּדְבָּ֗ר בְּ/אֶ֨רֶץ עֲרָבָ֤ה וְ/שׁוּחָה֙ בְּ/אֶ֨רֶץ֙ צִיָּ֣ה וְ/צַלְמָ֔וֶת בְּ/אֶ֗רֶץ לֹֽא עָ֤בַר בָּ/הּ֙ אִ֔ישׁ וְ/לֹֽא יָשַׁ֥ב אָדָ֖ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/006.yaml
  text: They did not say[a], ‘Where is Yahweh, who brought us up from the land of Egypt, who led us through the wilderness, through a land of desert plain and pit, through a land of drought and deep darkness, through a land where no man passed through and no human dwelt?’
translation:
  language: de
  text: 'Sie fragten nicht: »Wo ist Jahwe, der uns aus dem Land Ägypten heraufführte, der uns durch die Wüste führte, durch ein Land der Steppe und der Grube, durch ein Land der Dürre und tiefen Dunkelheit[a], durch ein Land, das niemand durchquerte und in dem kein Mensch wohnte?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Todesschatten«.'
    reason: Lexikalische Alternative für צַלְמָוֶת; die hebräische Bezeichnung kann tiefe Dunkelheit oder Todesschatten meinen.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige wissenschaftliche Wiedergabe des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: הַמַּעֲלֶה אֹתָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: der uns aus dem Land Ägypten heraufführte
  rationale: Die Hifil-Form von עלה bezeichnet das Heraufführen; die Formulierung bewahrt dieses Bild und klingt zugleich natürlich.
- source_word: הַמּוֹלִיךְ אֹתָנוּ בַּמִּדְבָּר
  choice: der uns durch die Wüste führte
  rationale: הלך im Hifil bedeutet hier führen; bei einer Bewegung durch ein Gebiet ist »durch die Wüste« im Deutschen idiomatisch.
- source_word: עֲרָבָה וְשׁוּחָה
  choice: Steppe und Gruben
  rationale: עֲרָבָה bezeichnet eine trockene Steppe beziehungsweise Wüstenebene; שׁוּחָה meint eine Grube oder Vertiefung. Der Plural »Gruben« beschreibt die Beschaffenheit des Landes natürlich.
- source_word: צִיָּה
  choice: Dürre
  rationale: Das Wort bezeichnet Trockenheit beziehungsweise ausgedörrtes Land; »Dürre« erhält die knappe, eindringliche Landschaftsschilderung.
- source_word: צַלְמָוֶת
  choice: tiefe Dunkelheit
  rationale: Die kontextuell gut begründete Bedeutung ist tiefste Dunkelheit oder Finsternis; die traditionelle Alternative wird in der Fußnote bewahrt.
- source_word: לֹא עָבַר בָּהּ אִישׁ
  choice: das niemand durchquerte
  rationale: Die generische Aussage wird im heutigen Deutsch mit »niemand« natürlich und vollständig wiedergegeben.
- source_word: וְלֹא יָשַׁב אָדָם שָׁם
  choice: und in dem kein Mensch wohnte
  rationale: יָשַׁב bezeichnet hier dauerhaftes Wohnen; אָדָם ist generisch und wird passend mit »Mensch« wiedergegeben.
theological_decisions:
- issue: Bedeutung von צַלְמָוֶת
  choice: tiefe Dunkelheit
  alternative: Todesschatten
  rationale: Im Zusammenhang bezeichnet der Ausdruck die unheimliche, lebensfeindliche Finsternis der Wüste. Da eine ausdrückliche Todesbedeutung möglich, aber nicht sicher ist, steht die traditionelle Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die wiederholte Wendung »durch ein Land« bewahren den eindringlichen Rhythmus des Hebräischen; geschlechtsübergreifende Aussagen werden natürlich mit »niemand« und »kein Mensch« formuliert.
