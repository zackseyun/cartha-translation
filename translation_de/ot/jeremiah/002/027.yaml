  text: אֹמְרִ֨ים לָ/עֵ֜ץ אָ֣בִ/י אַ֗תָּה וְ/לָ/אֶ֨בֶן֙ אַ֣תְּ ילדת/ני כִּֽי פָנ֥וּ אֵלַ֛/י עֹ֖רֶף וְ/לֹ֣א פָנִ֑ים וּ/בְ/עֵ֤ת רָֽעָתָ/ם֙ יֹֽאמְר֔וּ ק֖וּמָ/ה וְ/הוֹשִׁיעֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/027.yaml
  text: They say to a tree[a], “You are my father,” and to a stone, “You gave birth to me.” For they have turned their back to me and not their face; but in the time of their trouble they say[c][b], “Rise up and save us!”
translation:
  language: de
  text: 'Sie sagen zu einem Baum: »Du bist mein Vater«, und zu einem Stein: »Du hast mich geboren.« Denn sie haben mir den Rücken und nicht das Gesicht zugewandt.[a] Doch zur Zeit ihres Unglücks[b] sagen sie: »Steh auf und rette uns!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: »Sie haben mir den Nacken/Rücken und nicht das Gesicht zugewandt« – ein Bild für Abkehr und Ablehnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »zur Zeit ihres Unheils« beziehungsweise »ihrer Not«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָעֵץ
  choice: zu einem Baum
  rationale: עֵץ kann »Baum« oder »Holz« bedeuten. »Baum« bewahrt hier das konkrete, bewusst anstößige Bild, dass geschaffenes Material als Vater angeredet wird.
- source_word: וְלָאֶבֶן
  choice: und zu einem Stein
  rationale: Die wörtliche Wiedergabe erhält den Parallelismus zwischen den Materialien der Götzenbilder, Baum beziehungsweise Holz und Stein.
- source_word: אַתְּ יְלַדְתִּנִי
  choice: Du hast mich geboren
  rationale: Das feminine Subjektpronomen passt grammatisch zu אֶבֶן und יلد bezeichnet hier das Gebären. Die Formulierung gibt die Behauptung eines mütterlichen Ursprungs direkt wieder.
- source_word: פָנוּ אֵלַי עֹרֶף וְלֹא פָנִים
  choice: sie haben mir den Rücken zugekehrt und nicht das Gesicht
  rationale: Die deutsche Wendung »den Rücken zukehren« vermittelt die Ablehnung natürlich; der anschließende Kontrast mit dem Gesicht bleibt entsprechend der hebräischen Bildsprache ausdrücklich erhalten.
- source_word: וּבְעֵת רָעָתָם
  choice: Doch zur Zeit ihres Unglücks
  rationale: רָעָה kann je nach Zusammenhang Böses, Unheil, Unglück oder Not bezeichnen. Hier ist die bedrängende Lage gemeint, in der sie um Rettung rufen. »Doch« gibt den im Zusammenhang liegenden Gegensatz idiomatisch wieder.
- source_word: יֹאמְרוּ
  choice: sagen sie
  rationale: Das Imperfekt kann eine künftige oder wiederholt eintretende Reaktion bezeichnen. Das Präsens stellt das typische Verhalten anschaulich dar, ohne eine einmalige Zukunftsaussage festzulegen.
- source_word: קוּמָה וְהוֹשִׁיעֵנוּ
  choice: Steh auf und rette uns!
  rationale: Die beiden Aufforderungen werden direkt und in modernem, würdigem Deutsch wiedergegeben. »Rette« entspricht der kausativen Bedeutung von ישׁע in diesem Hilferuf.
theological_decisions:
- issue: Direkte Zuschreibung von Elternschaft an Baum und Stein
  choice: Die Menschen werden wörtlich so zitiert, dass sie einen Baum ihren Vater nennen und einem Stein zuschreiben, sie geboren zu haben.
  alternative: Die Aussage allgemein als Verehrung von Götzen zusammenzufassen.
  rationale: Der hebräische Text verwendet ausdrücklich familiäre und schöpferische Herkunftssprache. Ihre Beibehaltung erhält die Schärfe der prophetischen Anklage, ohne sie konfessionell auszudeuten.
- issue: Zeitwert von יֹאמְרוּ
  choice: 'Habitual-anschauliches Präsens: »sagen sie«.'
  alternative: 'Explizite Zukunft: »werden sie sagen«.'
  rationale: Das hebräische Imperfekt lässt im Zusammenhang sowohl eine erwartete als auch eine typische wiederkehrende Reaktion zu. Das deutsche Präsens bewahrt diese Offenheit weitgehend.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Rede und der Gegensatz zwischen Rücken und Gesicht bleiben bildkräftig erhalten; altertümliche Formen wie »Erhebe dich« werden vermieden.
