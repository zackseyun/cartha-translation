source:
  edition: WLC
  text: כִּֽי שְׁתַּ֥יִם רָע֖וֹת עָשָׂ֣ה עַמִּ֑/י אֹתִ֨/י עָזְב֜וּ מְק֣וֹר מַ֣יִם חַיִּ֗ים לַ/חְצֹ֤ב לָ/הֶם֙ בֹּאר֔וֹת בֹּארֹת֙ נִשְׁבָּרִ֔ים אֲשֶׁ֥ר לֹא יָכִ֖לוּ הַ/מָּֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/013.yaml
  text: 'For my people have done two evils: they have forsaken me[a], the fountain of living waters, to dig for themselves cisterns—broken cisterns that cannot hold water.'
translation:
  language: de
  text: 'Denn mein Volk hat zweifaches Unrecht getan: Mich haben sie verlassen, die Quelle lebendigen Wassers[a], um sich Zisternen auszuhauen – rissige Zisternen, die kein Wasser halten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Quelle lebendiger Wasser“. Das Hebräische kann auch „Springquelle“ oder „Ursprung lebendigen Wassers“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung der vorausgehenden Anklage ein und gibt die kausale Kraft im Deutschen natürlich wieder.
- source_word: שְׁתַּיִם רָעוֹת
  choice: zweifaches Unrecht
  rationale: Bewahrt die Zählung zweier schuldhafter Taten und klingt im modernen Deutschen natürlicher als „zwei Übel“, ohne das moralische Gewicht abzuschwächen.
- source_word: עָשָׂה עַמִּי
  choice: mein Volk hat … getan
  rationale: Gibt das gewöhnliche Verb עשה direkt wieder; die Stellung des Verbs am Satzende umfasst die anschließend genannten zwei Verfehlungen.
- source_word: אֹתִי עָזְבוּ
  choice: Mich haben sie verlassen
  rationale: Bewahrt die emphatische Voranstellung von „mich“ und die relationale, bundestheologisch gewichtige Aussage, ohne sie auszudeuten.
- source_word: מְקוֹר
  choice: Quelle
  rationale: Bezeichnet einen natürlichen Wasserursprung und bildet einen klaren Gegensatz zu den künstlich ausgehauenen Zisternen.
- source_word: מַיִם חַיִּים
  choice: lebendigen Wassers
  rationale: Bewahrt die traditionelle und theologisch offene Bildsprache; im natürlichen deutschen Ausdruck steht „Wasser“ als Stoffbezeichnung im Singular.
- source_word: לַחְצֹב
  choice: auszuhauen
  rationale: Gibt das Aushauen, besonders in Fels, genauer wieder als das allgemeinere „graben“ und passt sachlich zur Herstellung von Zisternen.
- source_word: לָהֶם
  choice: sich
  rationale: Drückt den reflexiven Nutznießer natürlich aus und erhält den Kontrast zwischen dem Verlassen Gottes und dem selbstgeschaffenen Ersatz.
- source_word: בֹּארוֹת
  choice: Zisternen
  rationale: Bezeichnet hier künstliche Wasserspeicher; „Brunnen“ würde den Gegensatz zu einer natürlichen Quelle verwischen.
- source_word: בֹּארֹת נִשְׁבָּרִים
  choice: rissige Zisternen
  rationale: 'Macht den für das Bild entscheidenden Defekt konkret: Die Behälter sind beschädigt und undicht. „Zerbrochen“ könnte einen völlig zerstörten Behälter nahelegen.'
- source_word: אֲשֶׁר לֹא יָכִלוּ הַמָּיִם
  choice: die kein Wasser halten
  rationale: Gibt die Unfähigkeit der Zisternen, Wasser zurückzuhalten, idiomatisch und bildkräftig wieder.
theological_decisions:
- issue: Metaphorische Wasserrede für Gott
  choice: Die Apposition „die Quelle lebendigen Wassers“ bleibt als unmittelbare Bezeichnung Gottes erhalten.
  alternative: Die Metapher deutend als „die Quelle des Lebens“ oder sachlich als „die Quelle frischen, fließenden Wassers“ wiedergeben.
  rationale: Der hebräische Text entfaltet die Bedeutung des Bildes nicht ausdrücklich. Die unaufgelöste Metapher bewahrt sowohl ihre konkrete Wasserbildlichkeit als auch ihre theologische Offenheit.
- issue: Charakter der zwei Verfehlungen
  choice: „zweifaches Unrecht“ fasst das Verlassen Gottes und das Aushauen untauglicher Zisternen als zwei zusammengehörige schuldhafte Taten.
  alternative: „zwei Übel“ oder „zwei böse Dinge“.
  rationale: Die Formulierung wahrt die moralische Anklage, ohne „Übel“ möglicherweise als erlittenes Unglück missverständlich werden zu lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Bildsprache. Die emphatische Voranstellung „Mich“ folgt dem hebräischen Fokus. Der Gedankenstrich hebt die nachgestellte Charakterisierung der untauglichen Zisternen hervor.
