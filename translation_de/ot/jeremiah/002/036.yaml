source:
  edition: WLC
  text: מַה תֵּזְלִ֥י מְאֹ֖ד לְ/שַׁנּ֣וֹת אֶת דַּרְכֵּ֑/ךְ גַּ֤ם מִ/מִּצְרַ֨יִם֙ תֵּב֔וֹשִׁי כַּ/אֲשֶׁר בֹּ֖שְׁתְּ מֵ/אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/036.yaml
  text: Why do you go about so much[a], changing your way? You will also be put to shame by Egypt[b], as you were put to shame by Assyria.
translation:
  language: de
  text: Warum läufst du so viel umher, um deinen Weg zu ändern?[a] Auch an Ägypten wirst du zuschanden werden[b], wie du an Assyrien zuschanden geworden bist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Warum ziehst du so rastlos umher, um deinen Kurs zu wechseln?“ Der hebräische Ausdruck kann die ruhelose Suche nach wechselnden Bündnissen hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auch Ägypten wird dich beschämen“ beziehungsweise „Auch von Ägypten wirst du enttäuscht werden“. Das hebräische Verb kann Schande oder enttäuschtes Vertrauen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֵּזְלִי מְאֹד
  choice: Warum läufst du so viel umher
  rationale: מַה leitet hier eine tadelnde rhetorische Frage ein. Das seltene תֵּזְלִי bezeichnet im Zusammenhang ein ruheloses Umherziehen; „läufst … umher“ bewahrt das Bewegungsbild, ohne bereits eine bestimmte moralische oder politische Deutung festzulegen.
- source_word: לְשַׁנּוֹת אֶת דַּרְכֵּךְ
  choice: um deinen Weg zu ändern
  rationale: Der Infinitiv mit לְ wird als Zweckangabe wiedergegeben. „Weg“ lässt wie דֶּרֶךְ sowohl die politische Ausrichtung als auch das allgemeine Verhalten anklingen.
- source_word: גַּם מִמִּצְרַיִם תֵּבוֹשִׁי
  choice: Auch an Ägypten wirst du zuschanden werden
  rationale: גַּם fügt Ägypten dem zuvor genannten Assyrien hinzu. בושׁ mit מִן kann Beschämung ebenso wie enttäuschtes Vertrauen bezeichnen; die deutsche Verbindung „an jemandem zuschanden werden“ bewahrt beides und gibt Ägypten nicht eindeutig als handelnden Urheber aus.
- source_word: כַּאֲשֶׁר בֹּשְׁתְּ מֵאַשּׁוּר
  choice: wie du an Assyrien zuschanden geworden bist
  rationale: Die parallele Formulierung hält Vergangenheit und Zukunft sowie Ägypten und Assyrien eng zusammen.
theological_decisions:
- issue: Bedeutungsumfang von „dein Weg“ im prophetischen Tadel
  choice: Die breite Wiedergabe „deinen Weg“ bleibt erhalten.
  alternative: „deinen politischen Kurs“ oder „dein Verhalten“
  rationale: Der unmittelbare Zusammenhang betrifft wechselnde außenpolitische Bündnisse, doch דֶּרֶךְ kann zugleich das sittliche und geistliche Verhalten bezeichnen. Die Übersetzung legt den Ausdruck nicht auf nur eine Ebene fest.
- issue: Art der Schande durch Ägypten und Assyrien
  choice: „an … zuschanden werden“
  alternative: „von … beschämt werden“ oder „von … enttäuscht werden“
  rationale: Der hebräische Ausdruck kann sowohl öffentliche Beschämung als auch das Scheitern gesetzten Vertrauens ausdrücken. Die gewählte Formulierung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zuschanden werden“ ist bewusst etwas gehoben, aber weiterhin verständlich und bildet die wiederholte hebräische Wurzel prägnant ab.
