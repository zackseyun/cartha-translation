source:
  edition: WLC
  text: לָ/כֵ֗ן עֹ֛ד אָרִ֥יב אִתְּ/כֶ֖ם נְאֻם יְהוָ֑ה וְ/אֶת בְּנֵ֥י בְנֵי/כֶ֖ם אָרִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/009.yaml
  text: Therefore I will still contend with you[a], declares Yahweh, and with your children's children I will contend.
translation:
  language: de
  text: Darum werde ich weiterhin einen Rechtsstreit mit euch führen[a], spricht Jahwe, und mit euren Kindeskindern werde ich einen Rechtsstreit führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gegen euch … und gegen eure Kindeskinder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Anklage und klingt im modernen Deutschen natürlich und bestimmt.
- source_word: עוֹד
  choice: weiterhin
  rationale: Gibt die Fortdauer des angekündigten Vorgehens wieder; „noch“ oder „erneut“ wären ebenfalls möglich, doch „weiterhin“ passt zum fortgesetzten Rechtsstreit.
- source_word: אָרִיב
  choice: werde ich einen Rechtsstreit führen
  rationale: ריב hat hier einen rechtlich-adversativen Sinn. Die Formulierung macht diesen deutlich, ohne ein bestimmtes Gerichtsverfahren vorauszusetzen; die Wiederholung des Verbs wird entsprechend im Deutschen bewahrt.
- source_word: אִתְּכֶם
  choice: mit euch
  rationale: Folgt der hebräischen Präposition unmittelbar und lässt die Gegnerschaft durch „Rechtsstreit“ zum Ausdruck kommen. Die mögliche Wiedergabe „gegen euch“ wird in der Fußnote genannt.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche und würdige Wiedergabe der festen prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וְאֶת בְּנֵי בְנֵיכֶם
  choice: und mit euren Kindeskindern
  rationale: Bewahrt die parallele Konstruktion und gibt die Generationenfolge prägnant wieder. „Kindeskinder“ ist im Deutschen verständlich und trägt den feierlichen Ton des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des angekündigten Rechtsstreits über mehrere Generationen
  choice: Die Aussage wird ohne erklärende Abschwächung oder Ausweitung wiedergegeben.
  alternative: Eine Deutung als pauschale Verurteilung von Nachkommen oder ausschließlich als rhetorische Beschreibung fortdauernder Schuld
  rationale: Der Vers nennt ausdrücklich die „Kindeskinder“, erklärt hier aber weder den genauen Grund noch die Bedingungen des künftigen Rechtsstreits. Diese Spannung bleibt im Text bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Einen Rechtsstreit führen“ wahrt den gerichtlichen Hintergrund von ריב und ist verständlicher als das heute gehobene beziehungsweise altertümlich wirkende „rechten“. Die Wiederholung am Versende folgt der hebräischen Rhetorik.
