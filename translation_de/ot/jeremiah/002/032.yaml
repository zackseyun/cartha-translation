source:
  edition: WLC
  text: הֲ/תִשְׁכַּ֤ח בְּתוּלָה֙ עֶדְיָ֔/הּ כַּלָּ֖ה קִשֻּׁרֶ֑י/הָ וְ/עַמִּ֣/י שְׁכֵח֔וּ/נִי יָמִ֖ים אֵ֥ין מִסְפָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/032.yaml
  text: Does a virgin forget her jewelry[b][a], or a bride her ornaments? Yet my people have forgotten me for days without number.
translation:
  language: de
  text: Vergisst denn eine Jungfrau ihren Schmuck[a] oder eine Braut ihre Bänder[b]? Doch mein Volk hat mich vergessen seit unzähligen Tagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine junge Frau“; auch: „ihre Zierde“.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann gebundene Schmuckstücke, Bänder, Gürtel oder andere Teile des Brautschmucks bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתִשְׁכַּח
  choice: Vergisst etwa ...?
  rationale: Die Fragepartikel הֲ leitet eine rhetorische Frage ein; „etwa“ macht die erwartete Verneinung im natürlichen Deutschen hörbar.
- source_word: בְּתוּלָה
  choice: eine junge Frau
  rationale: בְּתוּלָה kann eine Jungfrau beziehungsweise unverheiratete junge Frau bezeichnen. Hier steht das Bild der persönlichen Schmucksachen im Vordergrund; „junge Frau“ ist im heutigen Deutsch natürlich, ohne die lexikalische Nuance dogmatisch festzulegen.
- source_word: עֶדְיָהּ
  choice: ihren Schmuck
  rationale: עֲדִי bezeichnet Schmuck oder Zierde; „Schmuck“ ist präzise, allgemein und idiomatisch.
- source_word: כַּלָּה
  choice: eine Braut
  rationale: Das Substantiv bezeichnet eindeutig eine Braut und bildet die parallele Vergleichsfigur.
- source_word: קִשֻּׁרֶיהָ
  choice: ihre Bänder
  rationale: Das seltene Wort hängt wahrscheinlich mit dem Binden zusammen und bezeichnet gebundene Schmuckstücke, Bänder oder eine entsprechende Brautzier. „Bänder“ bewahrt diese konkrete Bildkomponente; die Unsicherheit wird in der Fußnote kenntlich gemacht.
- source_word: וְעַמִּי
  choice: Doch mein Volk
  rationale: וְ markiert hier den scharfen Gegensatz zwischen dem erwartbaren Verhalten der Frauen und dem Verhalten des Gottesvolkes.
- source_word: שְׁכֵחוּנִי
  choice: hat mich vergessen
  rationale: Das Perfekt beschreibt die tatsächlich eingetretene und fortdauernd relevante Missachtung; das deutsche Perfekt ist hier natürlich.
- source_word: יָמִים אֵין מִסְפָּר
  choice: seit unzähligen Tagen
  rationale: Die Wendung bedeutet wörtlich Tage, für die es keine Zahl gibt. „Seit unzähligen Tagen“ gibt sowohl Dauer als auch Unzählbarkeit in geläufigem Deutsch wieder.
theological_decisions:
- issue: Bundesbeziehung in „mein Volk hat mich vergessen“
  choice: Die relationale Formulierung „mein Volk“ und das Verb „vergessen“ bleiben unverstärkt erhalten.
  alternative: „Mein Volk hat mich verlassen“ oder „ist mir untreu geworden“.
  rationale: Der Zusammenhang legt Untreue nahe, doch der Vers selbst formuliert den Vorwurf als Vergessen. Eine stärkere Paraphrase würde die Bildsprache theologisch ausdeuten, statt ihre Spannung zu bewahren.
- issue: Bedeutung von בְּתוּלָה
  choice: „eine junge Frau“ im Haupttext
  alternative: „eine Jungfrau“
  rationale: Das hebräische Wort kann den Status als Jungfrau beziehungsweise unverheiratete junge Frau hervorheben. Da dieser Status für die Aussage nicht theologisch entfaltet wird und modernes „Jungfrau“ leicht unnötig eng wirkt, steht die natürliche Personenbezeichnung im Text; die Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp und parallel gebaut; „etwa“ signalisiert die erwartete Antwort. Die seltene Bezeichnung für den Brautschmuck wird konkret, aber durch eine Fußnote vorsichtig wiedergegeben.
