revisions:
- from: Deine Bosheit wird dich züchtigen, und deine Abtrünnigkeiten[a] werden dich zurechtweisen. Darum erkenne und sieh, wie böse und bitter es ist, dass du Jahwe, deinen Gott, verlässt und keine Furcht vor mir in dir ist,[b] spricht der Herr Jahwe der Heerscharen.
  to: 'Deine Bosheit wird dich in Zucht nehmen, und deine Abtrünnigkeiten[a] werden dich zurechtweisen. Darum erkenne und sieh: Es ist böse und bitter, Jahwe, deinen Gott, zu verlassen, und du fürchtest mich nicht,[b] spricht der Herr Jahwe der Heerscharen.'
  rationale: 'Die Revision glättet die deutsche Syntax und ersetzt eine im heutigen Sprachgebrauch stark eingeengte Ausdrucksweise. Entscheidend wird die problematische hebräische Nominalwendung korrekt abgesichert: Die idiomatische Hauptfassung „du fürchtest mich nicht“ bleibt als mögliche kontextuelle Wiedergabe bestehen, während die Fußnote die wörtliche Form „mein Schrecken ist nicht über dir“ dokumentiert und damit die Spannung zwischen fehlender Ehrfurcht und fehlendem göttlichen Schrecken nicht dogmatisch auflöst.'
