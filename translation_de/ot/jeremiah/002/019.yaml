reference: Jeremiah 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: תְּיַסְּרֵ֣/ךְ רָעָתֵ֗/ךְ וּ/מְשֻֽׁבוֹתַ֨יִ/ךְ֙ תּוֹכִחֻ֔/ךְ וּ/דְעִ֤י וּ/רְאִי֙ כִּי רַ֣ע וָ/מָ֔ר עָזְבֵ֖/ךְ אֶת יְהוָ֣ה אֱלֹהָ֑יִ/ךְ וְ/לֹ֤א פַחְדָּתִ/י֙ אֵלַ֔יִ/ךְ נְאֻם אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/019.yaml
  text: Your evil will discipline you[a], and your apostasies will reprove you. So know and see that it is evil and bitter for you to forsake Yahweh your God, and that my fear is not in you[c][b], declares the Lord GOD of hosts.
translation:
  language: de
  text: 'Deine Bosheit wird dich in Zucht nehmen, und deine Abtrünnigkeiten[a] werden dich zurechtweisen. Darum erkenne und sieh: Es ist böse und bitter, Jahwe, deinen Gott, zu verlassen, und du fürchtest mich nicht,[b] spricht der Herr Jahwe der Heerscharen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: deine Abwendungen; deine Rückfälle.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: und mein Schrecken ist nicht über dir. Oder: und keine Furcht vor mir ist in dir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּיַסְּרֵךְ
  choice: wird dich züchtigen
  rationale: Das Piel von יסר umfasst korrigierende wie strafende Zucht. „Züchtigen“ bewahrt beide Aspekte und lässt die eigene Bosheit als handelndes Mittel stehen.
- source_word: רָעָתֵךְ
  choice: deine Bosheit
  rationale: Der Zusammenhang mit dem Verlassen Jahwes spricht für die moralische Bedeutung und nicht primär für „Unheil“.
- source_word: מְשֻׁבוֹתַיִךְ
  choice: deine Abtrünnigkeiten
  rationale: Das Wort bezeichnet wiederholte Abwendungen beziehungsweise Untreue gegenüber Jahwe. Der Plural und der bundesbezogene Sinn werden bewahrt.
- source_word: תּוֹכִחֻךְ
  choice: werden dich zurechtweisen
  rationale: Das Hifil von יכח kann überführen, tadeln oder zurechtweisen bedeuten. Hier treten Judas Abwendungen selbst als entlarvender Beweis gegen das Volk auf.
- source_word: וּדְעִי וּרְאִי
  choice: Darum erkenne und sieh
  rationale: Die beiden Imperative werden beibehalten; „Darum“ macht den Folgerungszusammenhang im Deutschen natürlich deutlich.
- source_word: רַע וָמָר
  choice: böse und bitter
  rationale: „Böse“ erhält das moralische Gewicht von רע, während „bitter“ die schmerzliche Folge ausdrückt.
- source_word: עָזְבֵךְ אֶת־יְהוָה אֱלֹהָיִךְ
  choice: dass du Jahwe, deinen Gott, verlässt
  rationale: Der Infinitiv mit Suffix wird als deutscher Inhaltssatz wiedergegeben. Das Präsens beschreibt die Handlung in ihrem grundsätzlichen Charakter, ohne sie unnötig zeitlich festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: und keine Furcht vor mir in dir ist
  rationale: Die nominale Formulierung des Hebräischen bleibt erhalten. „Furcht vor mir“ bezeichnet ehrfürchtige Gottesfurcht, ohne die mögliche Nuance des Schreckens vollständig auszuschließen.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: spricht der Herr Jahwe der Heerscharen
  rationale: נְאֻם wird idiomatisch mit „spricht“ wiedergegeben. אֲדֹנָי bleibt „Herr“, der Gottesname bleibt „Jahwe“, und „Heerscharen“ bewahrt die militärisch-kosmische Weite von צְבָאוֹת.
theological_decisions:
- issue: Bundesbezogene Bedeutung von מְשֻׁבוֹתַיִךְ
  choice: deine Abtrünnigkeiten
  alternative: deine Abwendungen; dein Abfall
  rationale: Die Formulierung bezeichnet nicht bloß allgemeine moralische Schwäche, sondern die Abkehr von Jahwe. Zugleich wird durch den Plural die wiederholte oder vielfältige Untreue nicht eingeebnet.
- issue: Bedeutung von וְלֹא פַחְדָּתִי אֵלַיִךְ
  choice: und keine Furcht vor mir in dir ist
  alternative: und du mich nicht fürchtest; und mein Schrecken nicht über dich kommt
  rationale: Die Hauptfassung bewahrt die nominale Rede von der „Furcht“ und lässt deren Spektrum zwischen Ehrfurcht und Schrecken offen. Die geläufigere verbale Deutung wird in der Fußnote genannt.
- issue: Wiedergabe des Gottesnamens in אֲדֹנָי יְהוִה
  choice: der Herr Jahwe
  alternative: der Herr HERR
  rationale: Die unterschiedliche Funktion von אֲדֹנָי als Titel und יהוה als Eigenname bleibt sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede steht wie im Hebräischen im femininen Singular und richtet sich im Zusammenhang an Juda; dies ist in den deutschen Verbformen nicht eigens sichtbar. Die Satzstruktur folgt dem poetisch-prophetischen Nachdruck des Ausgangstextes, ohne unnötig altertümlich zu wirken.
