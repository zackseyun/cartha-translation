id: JER.2.15
reference: Jeremiah 2:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָלָי/ו֙ יִשְׁאֲג֣וּ כְפִרִ֔ים נָתְנ֖וּ קוֹלָ֑/ם וַ/יָּשִׁ֤יתוּ אַרְצ/וֹ֙ לְ/שַׁמָּ֔ה עָרָ֥י/ו נצתה מִ/בְּלִ֥י יֹשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/015.yaml
  text: Young lions roar against him; they raise their voice. They make his land a desolation; his cities are burned[a], without inhabitant.
translation:
  language: de
  text: Junge Löwen brüllen ihn an, sie lassen ihre Stimme erschallen. Sie machen sein Land zur Einöde; seine Städte sind niedergebrannt[a] und ohne Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Städte sind verwüstet und ohne Bewohner«. Die hebräische Form נצתה ist schwierig und kann entweder im Sinn von »niedergebrannt« oder allgemeiner von »verwüstet« verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: ihn an
  rationale: In Verbindung mit dem Brüllen der Löwen bezeichnet עַל die feindliche Ausrichtung gegen das als männliche Einzelfigur dargestellte Israel.
- source_word: יִשְׁאֲגוּ
  choice: brüllen
  rationale: Das übliche und bildkräftige deutsche Verb für den Laut von Löwen.
- source_word: כְפִרִים
  choice: Junge Löwen
  rationale: Das Wort bezeichnet kräftige junge Löwen, nicht kleine Löwenjunge.
- source_word: נָתְנוּ קוֹלָם
  choice: sie lassen ihre Stimme erschallen
  rationale: Gibt die hebräische Wendung wörtlich genug und zugleich in natürlichem, würdigem Deutsch als lauten, bedrohlichen Ruf wieder.
- source_word: וַיָּשִׁיתוּ
  choice: Sie machen
  rationale: 'שׁית drückt hier das Herbeiführen eines Zustands aus: Das Land wird zur Einöde gemacht.'
- source_word: אַרְצוֹ
  choice: sein Land
  rationale: Der Singular mit männlichem Possessivsuffix führt die Personifikation Israels als Einzelfigur fort.
- source_word: לְשַׁמָּה
  choice: zur Einöde
  rationale: Bewahrt den nominalen Charakter des Ausdrucks und bezeichnet ein verwüstetes, verlassenes Gebiet.
- source_word: עָרָיו
  choice: seine Städte
  rationale: Direkte Wiedergabe des Plurals mit männlichem Possessivsuffix.
- source_word: נצתה
  choice: sind niedergebrannt
  rationale: Die schwierige Form wird im Kontext wahrscheinlich als Verb des Brennens verstanden. »Niedergebrannt« passt idiomatisch zu zerstörten Städten; die allgemeinere Deutung als Verwüstung wird in der Fußnote erhalten.
- source_word: מִבְּלִי יֹשֵׁב
  choice: ohne Bewohner
  rationale: Knappes, natürliches Deutsch für die feste hebräische Wendung, die vollständige Entvölkerung ausdrückt.
