id: JER.2.4
reference: Jeremiah 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בֵּ֣ית יַעֲקֹ֑ב וְ/כָֽל מִשְׁפְּח֖וֹת בֵּ֥ית יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/004.yaml
  text: Hear the word of Yahweh[a], O house of Jacob, and all the clans of the house of Israel.
translation:
  language: de
  text: Hört das Wort Jahwes, Haus Jakob, und all ihr Sippen[a] des Hauses Israel!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Familien; gemeint sind verwandtschaftlich verbundene Gruppen innerhalb Israels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Qal-Imperativ im Plural fordert die Angeredeten unmittelbar auf, Gottes Botschaft zu hören und zu beachten. „Hört“ bewahrt den knappen prophetischen Aufruf.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Wendung wird mit „Wort“ wiedergegeben, nicht nur mit dem allgemeineren „Botschaft“. Der Gottesname יְהוָה erscheint als „Jahwe“; im Genitiv lautet die natürliche deutsche Form „Jahwes“.
- source_word: בֵּית יַעֲקֹב
  choice: Haus Jakob
  rationale: Die direkte Anrede bezeichnet das Bundesvolk als kollektive Größe. Die formelhafte Wendung „Haus Jakob“ bewahrt das hebräische Bild und ist im Deutschen verständlich.
- source_word: וְכָל מִשְׁפְּחוֹת
  choice: und all ihr Sippen
  rationale: מִשְׁפְּחוֹת meint verwandtschaftlich organisierte Gruppen. „Sippen“ ist hier genauer als das möglicherweise zu eng verstandene „Familien“ und kleiner als „Stämme“. Das ergänzte „ihr“ macht die fortgesetzte Anrede im Deutschen deutlich.
- source_word: בֵּית יִשְׂרָאֵל
  choice: des Hauses Israel
  rationale: Die Wiedergabe erhält die Parallele zu „Haus Jakob“ sowie den gemeinschaftlichen und bundestheologischen Sinn der Bezeichnung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen Gottes. „Jahwe“ gibt diesen Namen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Anrede. Die traditionellen Kollektivbezeichnungen „Haus Jakob“ und „Haus Israel“ bleiben erhalten; „Sippen“ vermittelt die soziale Gliederung ohne das altertümliche und mehrdeutige „Geschlechter“.
