source:
  edition: WLC
  text: וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל אֶ֣רֶץ הַ/כַּרְמֶ֔ל לֶ/אֱכֹ֥ל פִּרְיָ֖/הּ וְ/טוּבָ֑/הּ וַ/תָּבֹ֨אוּ֙ וַ/תְּטַמְּא֣וּ אֶת אַרְצִ֔/י וְ/נַחֲלָתִ֥/י שַׂמְתֶּ֖ם לְ/תוֹעֵבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/007.yaml
  text: I brought you into a fertile land to eat its fruit and its goodness[a], but when you came in[b], you defiled my land and made my inheritance an abomination.
translation:
  language: de
  text: Ich brachte euch in ein fruchtbares Land[a], um seine Früchte und seinen Reichtum[b] zu genießen. Doch ihr kamt hinein und verunreinigtet mein Land und machtet mein Erbteil zu einem Gräuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein Land des Karmel“; כַּרְמֶל kann den Karmel bezeichnen, meint hier aber wahrscheinlich allgemein ertragreiches, kultiviertes Land.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „seine Frucht und sein Gutes“; auch möglich: „seine Fülle“ oder „seine reichen Erträge“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִיא
  choice: Ich brachte
  rationale: Der Hifil von בוא bezeichnet hier das Hineinbringen; die Wiedergabe bewahrt Gottes handelnde Rolle knapp und natürlich.
- source_word: אֶרֶץ הַכַּרְמֶל
  choice: ein fruchtbares Land
  rationale: כַּרְמֶל bezeichnet im Zusammenhang wahrscheinlich ertragreiches, kultiviertes Land und nicht den Eigennamen Karmel.
- source_word: לֶאֱכֹל פִּרְיָהּ וְטוּבָהּ
  choice: damit ihr seine Früchte und seine guten Gaben genießen konntet
  rationale: Die Infinitivkonstruktion drückt den Zweck aus. „Früchte“ gibt פְּרִי konkret wieder; „gute Gaben“ bewahrt die Breite von טוּב, während „genießen“ das idiomatische Essen bzw. Nutznießen von beidem natürlich ausdrückt.
- source_word: וַתָּבֹאוּ
  choice: Doch ihr kamt hinein
  rationale: Die Erzählfolge wird fortgeführt; „doch“ macht den inhaltlichen Gegensatz zwischen Gottes Gabe und Israels Reaktion sichtbar, ohne die Aussage auszubauen.
- source_word: וַתְּטַמְּאוּ
  choice: machtet ... unrein
  rationale: Der Piel von טמא bezeichnet das Verunreinigen und kann kultische wie moralische Bedeutung tragen. „Unrein machen“ hält diese Bedeutungsbreite offen.
- source_word: אַרְצִי
  choice: mein Land
  rationale: Die Possessivform betont Gottes Anspruch auf das Land.
- source_word: נַחֲלָתִי
  choice: mein Erbteil
  rationale: נַחֲלָה bezeichnet einen erblich zugewiesenen Besitz oder Anteil. „Erbteil“ erhält den bundestheologischen und besitzrechtlichen Klang.
- source_word: שַׂמְתֶּם לְתוֹעֵבָה
  choice: habt ... zu einem Gräuel gemacht
  rationale: תּוֹעֵבָה ist ein starkes Wort für etwas Abscheuliches oder Verwerfliches, häufig mit religiös-moralischem Gewicht. „Gräuel“ bewahrt diese Schärfe und den würdevollen biblischen Sprachton.
theological_decisions:
- issue: Bedeutung von כַּרְמֶל
  choice: 'Gattungsbegriff: „fruchtbares Land“'
  alternative: 'Eigenname: „ein Land des Karmel“ bzw. „das Karmelland“'
  rationale: Die folgende Erwähnung von Frucht und guten Gaben spricht dafür, dass die Beschaffenheit des Landes gemeint ist. Der geografische Eigenname bleibt jedoch sprachlich möglich.
- issue: Bedeutungsumfang von טוּבָהּ
  choice: „seine guten Gaben“
  alternative: „seine Fülle“, „sein Gutes“ oder „seinen Reichtum“
  rationale: טוּב ist weiter als landwirtschaftlicher Ertrag und bezeichnet das Gute beziehungsweise die Fülle des Landes. „Gute Gaben“ macht dies im Deutschen verständlich, ohne die Aussage auf eine einzelne Art von Ertrag zu verengen.
- issue: Bild des göttlichen Erbteils in נַחֲלָתִי
  choice: „mein Erbteil“
  alternative: „mein Eigentum“ oder „mein Besitz“
  rationale: Die ungewöhnliche Rede von Gottes „Erbteil“ wird nicht geglättet. Sie hält die Spannung fest, dass das von Gott zugeteilte Land zugleich als sein eigener besonderer Besitz bezeichnet wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung im letzten Teilsatz hebt „mein Erbteil“ entsprechend dem Hebräischen hervor. „Gräuel“ bleibt bewusst kräftig; kultische und moralische Unreinheit werden nicht voneinander getrennt.
