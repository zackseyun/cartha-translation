  text: כְּ/בֹ֤שֶׁת גַּנָּב֙ כִּ֣י יִמָּצֵ֔א כֵּ֥ן הֹבִ֖ישׁוּ בֵּ֣ית יִשְׂרָאֵ֑ל הֵ֤מָּה מַלְכֵי/הֶם֙ שָֽׂרֵי/הֶ֔ם וְ/כֹהֲנֵי/הֶ֖ם וּ/נְבִיאֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/026.yaml
  text: As a thief is ashamed when he is found[a], so the house of Israel has been put to shame—they, their kings, their officials, their priests[b], and their prophets.
translation:
  language: de
  text: 'Wie ein Dieb beschämt dasteht, wenn er ertappt wird,[a] so ist das Haus Israel zuschanden geworden: Sie selbst, ihre Könige, ihre Obersten,[b] ihre Priester und ihre Propheten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn er entdeckt wird“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Amtsträger“ oder „ihre Fürsten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹשֶׁת
  choice: Wie … beschämt dasteht
  rationale: Die Präposition כ und das Substantiv בֹּשֶׁת bilden einen Vergleich. Die verbale deutsche Wendung gibt das Scham-Motiv natürlich wieder, ohne es auf ein bloß inneres Gefühl zu reduzieren.
- source_word: גַּנָּב
  choice: ein Dieb
  rationale: Der artikellose Singular dient als allgemeines Beispiel.
- source_word: כִּי יִמָּצֵא
  choice: wenn er ertappt wird
  rationale: Der Nifal von מצא bezeichnet hier das Gefunden- beziehungsweise Entdecktwerden. Im Zusammenhang mit einem Dieb drückt „ertappt“ die situationsgerechte Aufdeckung knapp aus.
- source_word: כֵּן
  choice: so
  rationale: „So“ bildet die natürliche deutsche Entsprechung zum einleitenden Vergleich.
- source_word: הֹבִישׁוּ
  choice: ist … zuschanden geworden
  rationale: Die Form bezeichnet einen eingetretenen Zustand von Schande und öffentlicher Bloßstellung. „Zuschanden geworden“ bewahrt diesen stärkeren Sinn.
- source_word: בֵּית יִשְׂרָאֵל
  choice: das Haus Israel
  rationale: Die kollektive Bundesbezeichnung wird nahe am Hebräischen beibehalten.
- source_word: הֵמָּה
  choice: sie
  rationale: Das betonte Pronomen wird ausdrücklich wiedergegeben und leitet die erläuternde Aufzählung ein.
- source_word: מַלְכֵיהֶם
  choice: ihre Könige
  rationale: Direkte Wiedergabe des Plurals mit Possessivsuffix.
- source_word: שָׂרֵיהֶם
  choice: ihre führenden Männer
  rationale: שׂרים bezeichnet hochgestellte politische oder gesellschaftliche Führungspersonen. Die Formulierung ist im heutigen Deutsch verständlich, ohne den Begriff auf Erbprinzen oder moderne Amtsinhaber einzuengen.
- source_word: כֹהֲנֵיהֶם
  choice: ihre Priester
  rationale: Übliche und sachlich genaue Wiedergabe.
- source_word: נְבִיאֵיהֶם
  choice: ihre Propheten
  rationale: Übliche und sachlich genaue Wiedergabe.
theological_decisions:
- issue: Umfang der Schuldzuweisung in der erläuternden Aufzählung
  choice: Das ganze Haus Israel wird der Schande ausgesetzt; seine maßgeblichen Führungsgruppen werden ausdrücklich einbezogen.
  alternative: Die Aussage richtet sich ausschließlich gegen die genannten Führungsgruppen.
  rationale: „Das Haus Israel“ ist das grammatische Kollektiv, während das betonte הֵמָּה und die anschließende Liste Könige, führende Männer, Priester und Propheten hervorheben. Die Übersetzung lässt sowohl die umfassende Anklage als auch den besonderen Akzent auf den Führungsschichten stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Beschämt dastehen“ und „zuschanden geworden“ unterscheiden die konkrete Reaktion des ertappten Diebes von Israels umfassender öffentlicher Schande. Der Doppelpunkt macht die erläuternde Funktion des betonten Pronomens und der folgenden Liste sichtbar.
