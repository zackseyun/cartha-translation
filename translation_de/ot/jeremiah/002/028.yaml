source:
  edition: WLC
  text: וְ/אַיֵּ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ לָּ֔/ךְ יָק֕וּמוּ אִם יוֹשִׁיע֖וּ/ךָ בְּ/עֵ֣ת רָעָתֶ֑/ךָ כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/028.yaml
  text: But where are your gods that you made for yourself? Let them arise[a], if they can save you in the time of your trouble. For your gods, Judah[b], are as many as your cities.
translation:
  language: de
  text: Doch wo sind deine Götter, die du dir gemacht hast? Sollen sie aufstehen, ob sie dich zur Zeit deines Unglücks retten können! Denn so zahlreich wie deine Städte sind deine Götter, Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיֵּה
  choice: Doch wo sind
  rationale: אַיֵּה fragt nach dem Ort; das vorangestellte וְ leitet im Zusammenhang einen vorwurfsvollen Gegensatz ein. „Doch“ gibt diesen Diskurswert natürlich wieder.
- source_word: אֱלֹהֶיךָ
  choice: deine Götter
  rationale: Die Pluralform bezeichnet im Kontext die von Juda angefertigten und verehrten Götterbilder beziehungsweise falschen Götter.
- source_word: אֲשֶׁר עָשִׂיתָ לָּךְ
  choice: die du dir gemacht hast
  rationale: Die Formulierung bewahrt sowohl das menschliche Herstellen als auch den reflexiven Sinn von לָךְ.
- source_word: יָקוּמוּ
  choice: Sie sollen aufstehen
  rationale: Der rhetorisch auffordernde Imperfekt fordert die Götter spöttisch zum Handeln heraus. „Aufstehen“ erhält das konkrete Bild.
- source_word: אִם יוֹשִׁיעוּךָ
  choice: wenn sie dich … retten können
  rationale: אִם führt hier eine herausfordernde Bedingung ein. Das Modalverb „können“ macht den rhetorischen Zweifel im Deutschen deutlich, ohne ihn zur ausdrücklichen Verneinung zu verschärfen.
- source_word: בְּעֵת רָעָתֶךָ
  choice: zur Zeit deines Unglücks
  rationale: רָעָה bezeichnet hier widerfahrendes Unheil oder eine Notlage, nicht moralische Bosheit. „Unglück“ ist in diesem Zusammenhang präzise und verständlich.
- source_word: כִּי מִסְפַּר עָרֶיךָ הָיוּ אֱלֹהֶיךָ
  choice: Denn so zahlreich wie deine Städte sind deine Götter
  rationale: Die deutsche Vergleichskonstruktion gibt die zahlenmäßige Entsprechung idiomatisch wieder. Das Perfekt הָיוּ beschreibt den bestehenden, ausgebildeten Zustand und kann hier präsentisch wiedergegeben werden.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Der Eigenname steht als direkte Anrede und wird deshalb am Satzende durch ein Komma abgesetzt.
theological_decisions:
- issue: Bezug von „deine Götter“
  choice: Die Wendung bezeichnet die von Juda selbst gemachten falschen Götter beziehungsweise Götterbilder.
  alternative: Bezug auf den HERRN oder eine unbestimmte Singularbedeutung „dein Gott“
  rationale: Der Plural und der Relativsatz „die du dir gemacht hast“ schließen einen Bezug auf den HERRN aus und tragen die prophetische Kritik am Götzendienst.
- issue: Rhetorische Herausforderung in אִם יוֹשִׁיעוּךָ
  choice: Die Möglichkeit ihrer Rettungsmacht wird spöttisch infrage gestellt, aber nicht durch eine ausdrückliche Verneinung ersetzt.
  alternative: „Sie können dich nicht retten“
  rationale: Der Ausgangstext formuliert eine Bedingung beziehungsweise Probe. Die Übersetzung bewahrt diese rhetorische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Schärfe. Die Anrede bleibt im Singular, da Juda als kollektive Person angesprochen wird. Keine konfessionell geprägte Zusatzdeutung.
