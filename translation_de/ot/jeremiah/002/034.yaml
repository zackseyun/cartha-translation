source:
  edition: WLC
  text: גַּ֤ם בִּ/כְנָפַ֨יִ/ךְ֙ נִמְצְא֔וּ דַּ֛ם נַפְשׁ֥וֹת אֶבְיוֹנִ֖ים נְקִיִּ֑ים לֹֽא בַ/מַּחְתֶּ֥רֶת מְצָאתִ֖י/ם כִּ֥י עַל כָּל אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/034.yaml
  text: Even on your skirts is found the blood of the lives of innocent poor people[a]. I did not find them in a break-in[c][b], but on account of all these things.
translation:
  language: de
  text: Sogar an den Säumen deines Gewandes[a] findet sich das Blut unschuldiger, bedürftiger Menschen. Ich fand sie nicht bei einem Einbruch[b], sondern wegen all dieser Dinge[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „an/in deinen Flügeln“; bei einem Gewand sind dessen Ränder, Säume oder Zipfel gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen Einbruch, bei dem man sich durch eine Wand gräbt; siehe den rechtlichen Hintergrund in 2. Mose 22,1.
    reason: cross_reference
  - marker: c
    text: 'Der hebräische Schlusssatz ist verkürzt und schwer verständlich. Möglich ist auch: „Nicht weil ich sie beim Einbrechen fand, sondern wegen all dieser Dinge.“'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּכְנָפַיִךְ
  choice: an den Säumen deines Gewandes
  rationale: כָּנָף bezeichnet wörtlich einen Flügel oder äußersten Rand und bei Kleidung den Saum beziehungsweise Gewandzipfel. Die konkrete Wendung bewahrt das Bild von Blutspuren am Kleid, ohne das im Deutschen irreführende „Flügel“ zu verwenden.
- source_word: נִמְצְאוּ
  choice: findet sich
  rationale: Das hebräische Verb steht im Plural, während „Blut“ im Deutschen als nicht zählbares Kollektiv gewöhnlich den Singular verlangt. Das Präsens erhält die Unmittelbarkeit der Anklage.
- source_word: דַּם נַפְשׁוֹת
  choice: das Blut
  rationale: Die ungewöhnliche Verbindung bezeichnet das Blut beziehungsweise vergossene Leben von Personen. Eine wörtliche Wiedergabe als „Blut der Seelen“ wäre im heutigen Deutsch missverständlich; die mit אֶבְיוֹנִים נְקִיִּים bezeichneten Opfer folgen unmittelbar.
- source_word: אֶבְיוֹנִים נְקִיִּים
  choice: unschuldiger Bedürftiger
  rationale: אֶבְיוֹנִים sind Arme oder Bedürftige, נְקִיִּים bezeichnet ihre Schuldlosigkeit. „Bedürftige“ gibt die soziale Schutzlosigkeit wieder, „unschuldig“ den rechtlich-moralischen Sinn.
- source_word: לֹא בַמַּחְתֶּרֶת
  choice: nicht bei einem Einbruch
  rationale: מַחְתֶּרֶת bezeichnet einen durch das Durchgraben einer Wand verübten Einbruch. Die natürliche deutsche Formulierung hält den möglichen rechtlichen Hintergrund aus Exodus 22 fest.
- source_word: מְצָאתִים
  choice: Ich habe sie … ertappt
  rationale: Die masoretische Form ist erste Person Singular mit einem Objekt der dritten Person Plural. „Ertappt“ passt zur Situation des auf frischer Tat angetroffenen Einbrechers und bezieht „sie“ auf die getöteten Bedürftigen.
- source_word: כִּי עַל כָּל אֵלֶּה
  choice: sondern wegen all dieser Dinge
  rationale: Der verkürzte und schwierige Schluss wird kontrastiv und עַל kausal verstanden. Die Formulierung bleibt bewusst offen, worauf „all diese Dinge“ im Einzelnen verweist.
theological_decisions:
- issue: Sprecher und Bezugswort in מְצָאתִים
  choice: Der HERR spricht in der ersten Person; „sie“ bezeichnet die unschuldigen Bedürftigen.
  alternative: 'Konjekturale oder interpretierende Wiedergabe in der zweiten Person: „Du hast sie nicht beim Einbrechen ertappt.“'
  rationale: Die masoretische Form stützt „Ich habe sie gefunden/ertappt“. Diese Lesart vermeidet eine Textänderung und lässt die göttliche Anklage forensisch hervortreten.
- issue: Sinn des Einbruchmotivs
  choice: Die Opfer wurden nicht als beim Einbruch ertappte Täter getötet.
  alternative: Allgemeiner Bezug auf irgendwo entdeckte Schuldbeweise.
  rationale: Der rechtliche Hintergrund erklärt den Kontrast zwischen möglicherweise gerechtfertigter Tötung eines ertappten Einbrechers und dem Blut unschuldiger Bedürftiger, ohne die schwierige Schlussklausel dogmatisch festzulegen.
- issue: Deutung der Schlussklausel כִּי עַל כָּל אֵלֶּה
  choice: 'Kausale, kontrastive Wiedergabe: „sondern wegen all dieser Dinge“.'
  alternative: „Vielmehr fand ich es an all diesen“ beziehungsweise „trotz all dieser Dinge“.
  rationale: Die hebräische Klausel ist elliptisch. Die gewählte Fassung folgt dem naheliegenden kausalen Gebrauch von עַל, während eine Fußnote die Unsicherheit ausdrücklich wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete Gewandbild und der forensische Ton bleiben erhalten. „Bedürftige“ ist verständlich und etwas weiter als „Arme“. Die elliptische Schlussklausel wird im Haupttext lesbar wiedergegeben, ihre echte Unsicherheit jedoch in der Fußnote offengelegt.
