base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/002/031.yaml
  text: 'O generation[a], you yourselves, see the word of Yahweh: Have I been a wilderness to Israel, or a land of deep darkness? Why has my people said, ‘We are lords; we will come to you no more’?”'
translation:
  language: de
  text: 'Ihr Menschen dieser Generation, seht selbst das Wort Jahwes: Bin ich für Israel etwa eine Wüste gewesen oder ein Land tiefster Finsternis? Warum hat mein Volk gesagt: »Wir schweifen frei umher[a]; wir werden nicht mehr zu dir kommen«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wir herrschen«, »Wir ziehen umher« oder »Wir haben uns losgerissen.« Das hebräische Verb ist schwer zu deuten; im Zusammenhang beansprucht das Volk Unabhängigkeit von Jahwe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוֹר אַתֶּם
  choice: Ihr Menschen dieser Generation
  rationale: Gibt die betonte direkte Anrede idiomatisch wieder; das selbstständige Pronomen אַתֶּם verstärkt die Anrede, ohne die im Deutschen unnatürliche Form »O Generation, ihr selbst« nachzuahmen.
- source_word: רְאוּ דְבַר יְהוָה
  choice: seht selbst das Wort Jahwes
  rationale: Bewahrt das Bild des hebräischen Imperativs »sehen« und den prophetischen Ausdruck »Wort Jahwes«; »selbst« nimmt die emphatische Anrede auf.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den persönlichen Gottesnamen als gebräuchliche deutsche Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הֲמִדְבָּר הָיִיתִי לְיִשְׂרָאֵל
  choice: Bin ich für Israel etwa eine Wüste gewesen
  rationale: Erhält die rhetorische Frage und das Bild eines unwirtlichen, unfruchtbaren Ortes. »etwa« markiert im Deutschen die erwartete verneinende Antwort.
- source_word: אֶרֶץ מַאְפֵּלְיָה
  choice: ein Land tiefster Finsternis
  rationale: Gibt die starke Bedeutung von מַאְפֵּלְיָה in würdigem, verständlichem Deutsch wieder.
- source_word: רַדְנוּ
  choice: Wir schweifen frei umher
  rationale: Die schwierige Form wird im Zusammenhang als Behauptung ungebundener Bewegungsfreiheit beziehungsweise Unabhängigkeit verstanden. Die Fußnote bewahrt andere ernsthafte Deutungen.
- source_word: לֹא נָבוֹא עוֹד אֵלֶיךָ
  choice: wir kommen nicht mehr zu dir
  rationale: Natürliches Deutsch für die Verneinung mit עוֹד; drückt die erklärte Beendigung jeder Rückkehr zu Jahwe aus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname bleibt als solcher erkennbar; die Übersetzung ersetzt ihn nicht durch einen konfessionell tradierten Titel.
- issue: Deutung des schwierigen Verbs רַדְנוּ
  choice: Wir schweifen frei umher
  alternative: Wir herrschen / Wir haben uns losgerissen
  rationale: Die Hauptfassung bringt den im Kontext naheliegenden Anspruch auf Unabhängigkeit zum Ausdruck, ohne die lexikalische Unsicherheit zu verdecken; konkurrierende Deutungen werden in der Fußnote ausdrücklich genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Die rhetorischen Fragen bleiben prägnant; die ungewöhnliche Verbindung »das Wort sehen« wurde bewusst bewahrt, während die direkte Anrede idiomatisch gestaltet ist.
