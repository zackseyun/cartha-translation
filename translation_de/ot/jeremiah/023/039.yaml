revisions:
- from: 'Darum seht: Ich werde euch mit Macht hochheben und wegwerfen – euch und die Stadt, die ich euch und euren Vorfahren gegeben habe. Ich werde euch aus meinem Angesicht verstoßen.[a]'
  to: 'Darum: Seht, ich werde euch gewiss hochheben[a] und euch und die Stadt, die ich euch und euren Vorfahren gegeben habe, von meinem Angesicht[b] verstoßen.'
  rationale: 'Die Revision folgt der Satzfügung des MT: Auf die betonte schwierige Verbform folgt ein zweiter Gerichtsakt, dessen Objekte sowohl die Angeredeten als auch die Stadt sind. Die Lesart „hochheben“ bleibt bewusst stehen, weil sie der masoretischen Punktierung folgt und die Spannung zum anschließenden Verstoßen wahrt; die ernstzunehmenden Alternativen werden nicht harmonisierend in den Text übernommen, sondern in einer Fußnote vermerkt.'
