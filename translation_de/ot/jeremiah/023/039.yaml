base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
translation:
  language: de
  text: 'Darum: Seht, ich werde euch gewiss hochheben[a] und euch und die Stadt, die ich euch und euren Vorfahren gegeben habe, von meinem Angesicht[b] verstoßen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig. Statt »ich werde euch gewiss hochheben« verstehen manche: »ich werde euch völlig vergessen« oder »ich werde euch gewiss forttragen«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »aus meiner Gegenwart«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit der vorausgehenden Anklage knapp und natürlich wieder.
- source_word: הִנְנִי
  choice: seht
  rationale: Bewahrt den nachdrücklichen prophetischen Hinweischarakter in verständlichem, gehobenem Deutsch.
- source_word: וְנָשִׁיתִי אֶתְכֶם נָשֹׂא
  choice: Ich werde euch mit Macht hochheben
  rationale: Folgt der Punktierung des masoretischen Textes, gibt die Verstärkung durch den Infinitivus absolutus wieder und erhält das ironische Wortspiel mit נשׂא; das anschließende „wegwerfen“ macht deutlich, dass keine Erhöhung gemeint ist.
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: und wegwerfen … Ich werde euch … verstoßen
  rationale: „Wegwerfen“ bildet zusammen mit „hochheben“ das drastische Gerichtsbild ab; die Wiederaufnahme als „verstoßen“ ermöglicht die natürliche Anbindung von „aus meinem Angesicht“ und umfasst Stadt wie Adressaten.
- source_word: הָעִיר
  choice: die Stadt
  rationale: Der hebräische Text nennt Jerusalem hier nicht ausdrücklich, daher bleibt die allgemeinere Bezeichnung erhalten.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: die ich euch und euren Vorfahren gegeben habe
  rationale: Bewahrt den geschichtlichen Bezug auf Gottes Gabe an die gegenwärtige Generation und ihre Ahnen; „Vorfahren“ ist im modernen Deutsch inklusiver und natürlicher als „Väter“.
- source_word: מֵעַל פָּנָי
  choice: aus meinem Angesicht
  rationale: Erhält die anschauliche anthropomorphe Rede des Hebräischen; gemeint ist die Entfernung aus Gottes Gegenwart.
theological_decisions:
- issue: Textkritische und lexikalische Mehrdeutigkeit von וְנָשִׁיתִי ... נָשֹׂא
  choice: Ich werde euch mit Macht hochheben
  alternative: Ich werde euch völlig vergessen / Ich werde euch gewiss forttragen
  rationale: Die gewählte Fassung folgt dem vokalisierten masoretischen Text und bewahrt das Wortspiel mit מַשָּׂא im Kontext. Da eine Ableitung im Sinn von „vergessen“ weithin vertreten ist und die Stelle sprachlich schwierig bleibt, wird diese echte Unsicherheit in einer Fußnote kenntlich gemacht.
- issue: Bildhafte Gegenwartssprache in מֵעַל פָּנָי
  choice: aus meinem Angesicht
  alternative: aus meiner Gegenwart
  rationale: Die konkrete Bildsprache wird nicht vorschnell abstrahiert; ihre Bedeutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles prophetisches Deutsch. „Seht“ wahrt den feierlichen Hinweischarakter, ohne das altertümliche „siehe“. Die drastische Verbindung „hochheben und wegwerfen“ erhält das hebräische Wortspiel und seine Ironie; die Fußnote markiert die echte textliche und lexikalische Unsicherheit.
