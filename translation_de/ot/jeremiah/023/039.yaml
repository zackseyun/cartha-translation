  source_fidelity: Die Entfaltung des hebräischen Satzes im Entwurf verschiebt die Syntax und lässt die abschließende Ausstoßung nicht mehr eindeutig auch „die Stadt“ umfassen. Der MT verbindet beide Objekte mit ונטשתי und der Ortsbestimmung. Die Revision stellt diese Verbindung wieder her und bewahrt die schwierige, am MT orientierte Lesart von ונשיתי ... נשא.
  naturalness: '„Darum: Seht, ich werde …“ ist würdiges, verständliches modernes prophetisches Deutsch. „Gewiss“ gibt die Nachdrücklichkeit des Infinitivus absolutus idiomatischer wieder als „mit Macht“.'
  terminology: „Vorfahren“ ist hier eine angemessene moderne Wiedergabe von „Väter“. „Von meinem Angesicht verstoßen“ erhält die konkrete Gegenwartsmetaphorik; die glattere Deutung wird gesondert angemerkt.
  issues:
  - severity: high
    issue: Satzstruktur und Bezugsumfang von „verstoßen“ verändert
    rationale: Der Entwurf setzt nach „euch und die Stadt“ einen Satzschluss und fährt mit „Ich werde euch aus meinem Angesicht verstoßen“ fort. Dadurch ist die Stadt nicht mehr klar Objekt des von ונטשתי bezeichneten endgültigen Gerichtsakts. Im Hebräischen umfasst dieser ausdrücklich euch und die Stadt.
  - severity: medium
    issue: „mit Macht“ gibt den Infinitivus absolutus ungenau wieder
    rationale: Die Konstruktion נשא verstärkt die Verbhandlung; „mit Macht“ kann dagegen vor allem Gottes Machtmittel bezeichnen. „gewiss“ bildet die Emphase klarer ab.
  - severity: low
    issue: Zwei unterschiedliche textliche Fragen in einer Fußnote zusammengezogen
    rationale: Die umstrittene Lesung von ונשיתי ... נשא und die lexikalische Alternative zu מעל פני sind an verschiedenen Textstellen verankert. Getrennte Anker machen den Bezug nachvollziehbar.
