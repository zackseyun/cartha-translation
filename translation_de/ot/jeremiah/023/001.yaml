source:
  edition: WLC
  text: ה֣וֹי רֹעִ֗ים מְאַבְּדִ֧ים וּ/מְפִצִ֛ים אֶת צֹ֥אן מַרְעִיתִ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/001.yaml
  text: Woe to the shepherds who are destroying and scattering the sheep of my pasture[a], declares Yahweh.
translation:
  language: de
  text: Wehe den Hirten, die die Schafe meiner Weide zugrunde richten und zerstreuen! – Ausspruch Jahwes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹי
  choice: Wehe
  rationale: Die Interjektion kündigt hier prophetisches Gericht an; „Wehe“ bewahrt diese eindringliche Funktion.
- source_word: רֹעִים
  choice: Hirten
  rationale: Die wörtliche Hirtenmetapher für die Verantwortlichen des Volkes bleibt erhalten.
- source_word: מְאַבְּדִים
  choice: zugrunde richten
  rationale: Das Partizip bezeichnet fortdauerndes, zerstörerisches Handeln; die Wendung gibt die kausative Bedeutung treffend und natürlich wieder.
- source_word: וּמְפִצִים
  choice: und zerstreuen
  rationale: Das parallele Partizip beschreibt das Auseinandertreiben der Herde.
- source_word: אֶת צֹאן מַרְעִיתִי
  choice: die Schafe meiner Weide
  rationale: „Schafe“ hält das Bild konkret; „meiner Weide“ wahrt den mehrdeutigen Genitiv und die Zugehörigkeit zu Jahwe.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird feierlich und eng am Hebräischen wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Hirten- und Herdenmetaphorik
  choice: Die Metapher bleibt im Haupttext als „Hirten“ und „Schafe“ erhalten.
  alternative: Die Bildsprache deutend als „Führer“ und „Volk“ wiedergeben.
  rationale: Der hebräische Text verwendet ausdrücklich die für den Zusammenhang bedeutsame Hirtenmetaphorik; eine Auflösung würde die literarische und theologische Spannung verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung ist natürlich, während die prophetische Schärfe und der formelhafte Schluss erhalten bleiben.
