source:
  edition: WLC
  text: עַד מָתַ֗י הֲ/יֵ֛שׁ בְּ/לֵ֥ב הַ/נְּבִאִ֖ים נִבְּאֵ֣י הַ/שָּׁ֑קֶר וּ/נְבִיאֵ֖י תַּרְמִ֥ת לִבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
translation:
  language: de
  text: Wie lange noch wird dies im Herzen der Propheten sein[a], die Lüge prophezeien[b] und den Trug ihres eigenen Herzens verkünden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Wie lange noch? Ist im Herzen der Propheten …?“ Der hebräische Satz ist elliptisch; „dies“ macht den aus dem Zusammenhang vorausgesetzten Sachverhalt ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Lügenpropheten“. Die Übersetzung bewahrt hier die verbale Formulierung des Hebräischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Wie lange noch
  rationale: Die geläufige deutsche Frageform gibt die zeitliche Frage und den mitschwingenden göttlichen Unwillen natürlich wieder.
- source_word: הֲיֵשׁ בְּלֵב
  choice: soll dies im Herzen … sein
  rationale: Die hebräische Existenzfrage ist elliptisch. „Dies“ greift den vorausgesetzten Sachverhalt aus dem Zusammenhang auf; „im Herzen“ bewahrt das Bild für Denken, Absicht und Wollen.
- source_word: הַנְּבִאִים
  choice: der Propheten
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: נִבְּאֵי הַשָּׁקֶר
  choice: die Lüge prophezeien
  rationale: Die verbale Aussage über Inhalt und Tätigkeit wird bewahrt, statt sie nur zur Bezeichnung „Lügenpropheten“ zu verdichten.
- source_word: וּנְבִיאֵי תַּרְמִת לִבָּם
  choice: und den Trug ihres eigenen Herzens verkünden
  rationale: „Trug“ gibt תַּרְמִת als moralisch schuldhafte Täuschung wieder. „Eigenen“ verdeutlicht, dass ihre Botschaft aus ihrem Inneren stammt; „verkünden“ vermeidet im Deutschen eine schwerfällige Wiederholung von „prophezeien“.
theological_decisions:
- issue: Bedeutungsumfang von לֵב
  choice: Herzen
  alternative: Sinn; Inneres
  rationale: „Herz“ bewahrt die hebräische Anthropologie, in der Denken, Absicht und Wille zusammengehören, ohne den Ausdruck auf bloßes Gefühl zu verengen.
- issue: Elliptische Frage הֲיֵשׁ בְּלֵב
  choice: soll dies im Herzen … sein
  alternative: Ist im Herzen der Propheten …?
  rationale: Die Übersetzung ergänzt nur das im Hebräischen vorausgesetzte Demonstrativ und lässt die ungewöhnliche, spannungsvolle Frage bestehen, statt sie als eindeutige Aufforderung zum Aufhören auszulegen.
- issue: Charakterisierung der Propheten
  choice: die Lüge prophezeien
  alternative: Lügenpropheten
  rationale: Die gewählte Form betont wie der hebräische Ausdruck ihre Tätigkeit und den Inhalt ihrer Botschaft, ohne daraus allein eine feststehende theologische Kategorie zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewöhnliche Wendung „im Herzen … sein“ hält die Ellipse und das biblische Herzbild sichtbar; die Relativsätze bleiben dennoch für heutige Leser verständlich.
