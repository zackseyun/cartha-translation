source:
  edition: WLC
  text: וּ/בִ/נְבִיאֵ֥י שֹׁמְר֖וֹן רָאִ֣יתִי תִפְלָ֑ה הִנַּבְּא֣וּ בַ/בַּ֔עַל וַ/יַּתְע֥וּ אֶת עַמִּ֖/י אֶת יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
translation:
  language: de
  text: Unter den Propheten Samarias sah ich etwas Verwerfliches:[a] Sie weissagten im Namen des Baal[b] und führten mein Volk Israel in die Irre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Torheit“, „etwas Anstößiges“ oder „etwas Entsetzliches“. Das hebräische Wort bezeichnet etwas moralisch oder religiös Verwerfliches.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „durch Baal“, „für Baal“ oder „in Verbindung mit Baal“. Gemeint ist, dass ihr prophetisches Reden unter Baals beanspruchter Autorität oder in seinem Namen geschah.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבִנְבִיאֵי
  choice: Und bei den Propheten
  rationale: Die Verbindung aus ו und ב bezeichnet hier den Bereich bzw. die Personengruppe, bei der etwas festgestellt wird. „Bei den Propheten“ ist im Deutschen natürlich und bleibt nahe am Hebräischen.
- source_word: שֹׁמְרוֹן
  choice: Samarias
  rationale: Der Ortsname bezeichnet Samaria, hier im Zusammenhang mit dem prophetischen Milieu des Nordreichs.
- source_word: רָאִיתִי
  choice: sah ich
  rationale: Das Qal Perfekt der 1. Person Singular wird als berichtendes Präteritum wiedergegeben.
- source_word: תִפְלָה
  choice: etwas Abstoßendes
  rationale: Das seltene Wort bezeichnet etwas moralisch oder religiös Anstößiges beziehungsweise Abscheuliches. „Etwas Abstoßendes“ gibt die starke negative Wertung verständlich wieder, ohne sie unnötig einzuengen.
- source_word: הִנַּבְּאוּ
  choice: sie weissagten
  rationale: Das Hitpael von נבא bezeichnet prophetisches Reden oder Auftreten. „Weissagten“ ist eine geläufige, prägnante biblische Wiedergabe.
- source_word: בַבַּעַל
  choice: im Namen des Baal
  rationale: Die Präposition ב kennzeichnet hier die Beziehung oder Autorität, unter der die Weissagung erfolgt. „Im Namen des Baal“ macht diesen Sinn im modernen Deutschen deutlich; die formal möglichen Nuancen werden in der Fußnote bewahrt.
- source_word: וַיַּתְעוּ
  choice: und führten … in die Irre
  rationale: 'Der Hifil von תעה ist kausativ: jemanden vom richtigen Weg abbringen. „In die Irre führen“ bewahrt sowohl das Kausative als auch das moralisch-religiöse Wegmotiv.'
- source_word: אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: mein Volk Israel
  rationale: „Israel“ steht als Apposition zu „mein Volk“. Die natürliche deutsche Fügung erhält den göttlichen Besitzanspruch und die Identifikation des Volkes.
theological_decisions:
- issue: Beziehung der Propheten zu Baal in הִנַּבְּאוּ בַבַּעַל
  choice: sie weissagten im Namen des Baal
  alternative: sie weissagten durch Baal / für Baal / in Verbindung mit Baal
  rationale: Die Formulierung bringt zum Ausdruck, dass ihr prophetisches Reden mit Baal verbunden war und unter seiner beanspruchten Autorität stand. Sie legt nicht fest, ob tatsächliche Vermittlung, bloßer Anspruch oder kultische Zugehörigkeit gemeint ist.
- issue: Moralisch-religiöse Tragweite von תִפְלָה
  choice: etwas Abstoßendes
  alternative: Torheit / etwas Entsetzliches / etwas Anstößiges
  rationale: Der Kontext verlangt mehr als intellektuelle Unvernunft. Die gewählte Formulierung vermittelt die religiöse und moralische Verwerflichkeit, ohne eine bestimmte dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weissagen“ wahrt den prophetischen Fachbezug; „im Namen des Baal“ ist verständlicher als das im Deutschen missverständliche „durch Baal“. Die Apposition „mein Volk Israel“ bleibt unmarkiert und natürlich.
