id: JER.23.21
reference: Jeremiah 23:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לֹא שָׁלַ֥חְתִּי אֶת הַ/נְּבִאִ֖ים וְ/הֵ֣ם רָ֑צוּ לֹא דִבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/הֵ֥ם נִבָּֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
translation:
  language: de
  text: Ich habe die Propheten nicht gesandt, und doch sind sie gelaufen; ich habe nicht zu ihnen gesprochen, und doch haben sie geweissagt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַחְתִּי
  choice: gesandt
  rationale: „Senden“ gibt den gewöhnlichen Sinn von שׁלח wieder und lässt im prophetischen Zusammenhang die Beauftragung durch Gott anklingen, ohne sie erklärend auszubauen.
- source_word: הַנְּבִאִים
  choice: die Propheten
  rationale: Der bestimmte Artikel wird natürlich mit „die“ wiedergegeben; ein hinweisendes „diese“ wäre deutlicher als der hebräische Wortlaut.
- source_word: רָצוּ
  choice: sind sie gelaufen
  rationale: Die wörtliche und bildhafte Bedeutung „laufen“ bleibt erhalten. Sie bezeichnet hier ihr eigenmächtiges Auftreten, ohne das Bild durch eine Deutung wie „eilten in den Dienst“ zu ersetzen.
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  choice: habe ich zu ihnen gesprochen
  rationale: Die Wendung דבר אל wird direkt und idiomatisch als „zu jemandem sprechen“ wiedergegeben.
- source_word: נִבָּאוּ
  choice: haben sie geweissagt
  rationale: „Weissagen“ ist eine präzise, im biblischen Register geläufige Wiedergabe des Verbs נבא und bezeichnet prophetisches Reden, ohne dessen Echtheit vorwegzunehmen.
- source_word: וְהֵם
  choice: und doch sind/haben sie
  rationale: Das hebräische ו verbindet die Aussagen formal, trägt im Kontext jedoch einen deutlichen Gegensatz. „Und doch“ bewahrt sowohl die Verknüpfung als auch den adversativen Sinn.
- source_word: לֹא
  choice: nicht
  rationale: Die Negation wird in Verbindung mit dem deutschen Perfekt natürlich durch „nicht“ ausgedrückt.
theological_decisions:
- issue: Art der Tätigkeit der angeklagten Propheten
  choice: Der Vers stellt fest, dass diese Propheten ohne Gottes Sendung und ohne sein Reden auftraten.
  alternative: Man könnte רָצוּ schwächer lediglich als Kritik an ihrer Übereilung verstehen.
  rationale: Die parallelen Aussagen „nicht gesandt“ und „nicht ... gesprochen“ bestreiten sowohl göttliche Beauftragung als auch Offenbarung. Die Übersetzung erhält diese Anklage, ohne weitergehende Aussagen über Prophetie einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Perfekt klingt in gewöhnlichem heutigen Deutsch natürlicher als das Präteritum; „geweissagt“ wahrt zugleich den biblisch-prophetischen Fachton. Die zweimalige Formulierung „und doch“ macht den im Kontext klaren Gegensatz des ו transparent, ohne eine Fußnote zu benötigen.
