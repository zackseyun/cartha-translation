  text: הַ/אֱלֹהֵ֧י מִ/קָּרֹ֛ב אָ֖נִי נְאֻם יְהוָ֑ה וְ/לֹ֥א אֱלֹהֵ֖י מֵ/רָחֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/023.yaml
  text: Am I a God who is near[a], declares Yahweh, and not a God who is far away?
translation:
  language: de
  text: Bin ich ein Gott, der nahe ist[a] – Spruch Jahwes –, und nicht ein Gott, der fern ist?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bin ich nur ein Gott in der Nähe … und nicht auch ein Gott in der Ferne?“ Die rhetorische Frage verneint, dass Jahwe auf das Nahe beschränkt ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/אֱלֹהֵי מִ/קָּרֹב
  choice: Bin ich ein Gott aus der Nähe
  rationale: Das interrogative ה eröffnet eine rhetorische Frage; die im Hebräischen fehlende Kopula wird im Deutschen mit „bin“ ergänzt. „Aus der Nähe“ bewahrt die mit מן gebildete Wendung und den Parallelismus zu „aus der Ferne“, ohne sie als Herkunftsaussage festzulegen.
- source_word: אָנִי
  choice: ich
  rationale: Das ausdrücklich gesetzte Personalpronomen wird in der deutschen Frage beibehalten.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die gewichtige prophetische Formel wird knapp und formnah wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“ statt als Ersatztitel.
- source_word: וְ/לֹא
  choice: und nicht
  rationale: Konjunktion und Negation werden direkt wiedergegeben; die rhetorische Wirkung ergibt sich aus der Gesamtfrage.
- source_word: אֱלֹהֵי מֵ/רָחֹק
  choice: ein Gott aus der Ferne
  rationale: Die Formulierung spiegelt den ersten Satzteil und erhält den räumlichen Gegensatz von Nähe und Ferne.
theological_decisions:
- issue: Reichweite der göttlichen Gegenwart im rhetorischen Gegensatz von Nähe und Ferne
  choice: Bin ich ein Gott aus der Nähe … und nicht ein Gott aus der Ferne?
  alternative: Bin ich nur ein Gott in der Nähe … und nicht auch ein Gott in der Ferne?
  rationale: Der Haupttext bewahrt die knappe, spannungsvolle Form der hebräischen Frage und ergänzt weder „nur“ noch „auch“. Die mögliche, im Kontext naheliegende Deutung, dass Jahwe nicht auf das Nahe beschränkt ist, wird in der Fußnote erläutert, statt in den Text eingetragen zu werden.
- issue: Wiedergabe des Tetragramms יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird im Deutschen transliteriert und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gedankenstriche markieren die eingeschobene prophetische Formel klar. „Aus der Nähe / aus der Ferne“ erhält den hebräischen Parallelismus und die echte Deutungsspannung.
