  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אִם יִסָּתֵ֨ר אִ֧ישׁ בַּ/מִּסְתָּרִ֛ים וַ/אֲנִ֥י לֹֽא אֶרְאֶ֖/נּוּ נְאֻם יְהוָ֑ה הֲ/ל֨וֹא אֶת הַ/שָּׁמַ֧יִם וְ/אֶת הָ/אָ֛רֶץ אֲנִ֥י מָלֵ֖א נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/024.yaml
  text: Can a man hide himself in secret places so that I do not see him? declares Yahweh[b][a]. Do I not fill heaven and earth? declares Yahweh.
translation:
  language: de
  text: Kann sich ein Mensch an verborgenen Orten verstecken, ohne dass ich ihn sehe?[a] – spricht Jahwe. Erfülle ich nicht den Himmel und die Erde?[b] – spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Wenn sich ein Mensch an verborgenen Orten versteckt, sollte ich ihn dann nicht sehen?“'
    reason: Das hebräische אִם kann hier entweder konditional („wenn“) oder als Einleitung einer rhetorischen Herausforderung verstanden werden.
  - marker: b
    text: 'Wörtlich: „die Himmel und die Erde“; das hebräische Wort für „Himmel“ steht in einer grammatisch pluralen Form.'
    reason: Die Fußnote macht die Form des Ausgangstextes sichtbar, während der Haupttext die übliche deutsche Wendung verwendet.
lexical_decisions:
- source_word: אִם
  choice: Kann
  rationale: אִם bedeutet gewöhnlich „wenn/falls“, leitet hier im Zusammenhang aber eine rhetorische Frage ein. „Kann“ gibt deren herausfordernden Sinn im Deutschen natürlich wieder; die konditionale Form bleibt in einer Fußnote erhalten.
- source_word: יִסָּתֵר
  choice: sich verstecken
  rationale: Die Nifal-Form kann passiv oder reflexiv verstanden werden. Hier bezeichnet sie den Versuch eines Menschen, sich Gottes Blick zu entziehen; „sich verstecken“ gibt dies klar und idiomatisch wieder.
- source_word: אִישׁ
  choice: ein Mensch
  rationale: Das maskuline Singularwort bezeichnet hier generisch eine Person. „Ein Mensch“ bewahrt den Bezug auf den Menschen als solchen und klingt im modernen Deutschen natürlicher als „ein Mann“.
- source_word: בַּמִּסְתָּרִים
  choice: an verborgenen Orten
  rationale: Der hebräische Plural bezeichnet Verstecke oder verborgene Orte. Die Wiedergabe wahrt den Plural und ist zugleich verständlich und natürlich.
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  choice: ohne dass ich ihn sehe
  rationale: Im rhetorischen Satz geht es darum, ob sich jemand so verbergen kann, dass Jahwe ihn nicht sieht. „Ohne dass“ drückt dieses Verhältnis idiomatisch aus, ohne die Aussage in eine abstrakte Lehre umzudeuten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Formel wird mit einer geläufigen, würdevollen deutschen Wendung wiedergegeben. Der Gottesname bleibt als „Jahwe“ erhalten.
- source_word: הֲלוֹא
  choice: Erfülle ich nicht
  rationale: הֲלוֹא eröffnet eine rhetorische Frage, die eine bejahende Antwort erwartet. Die deutsche Stellung mit „nicht“ bewahrt diese Kraft.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: den Himmel und die Erde
  rationale: Die feste Wortverbindung bezeichnet umfassend die gesamte geschaffene Wirklichkeit. Die Artikel des Hebräischen werden bewahrt; die grammatisch plurale Form von „Himmel“ wird in einer Fußnote vermerkt.
- source_word: מָלֵא
  choice: erfülle
  rationale: Das Wort drückt aus, dass Jahwe Himmel und Erde füllt. „Erfüllen“ bewahrt dieses konkrete, theologisch spannungsreiche Bild und ist im Deutschen gehobener und passender als das räumlich-mechanisch klingende „ausfüllen“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Tetragrammaton wird als persönlicher Gottesname „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Gottes Gegenwart in Himmel und Erde
  choice: Erfülle ich nicht den Himmel und die Erde?
  alternative: Bin ich nicht überall im Himmel und auf der Erde gegenwärtig?
  rationale: Die Übersetzung bewahrt das hebräische Bild des Füllens, statt es mit dem theologischen Fachbegriff der Allgegenwart erklärend aufzulösen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. „Jahwe“ wahrt den Charakter als Eigenname, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Logische Form der ersten rhetorischen Frage
  choice: Kann sich ein Mensch … verstecken, ohne dass ich ihn sehe?
  alternative: Wenn sich ein Mensch … versteckt, sollte ich ihn dann nicht sehen?
  rationale: Die Hauptfassung gibt die rhetorische Herausforderung in natürlichem Deutsch wieder. Da אִם formal auch konditional verstanden werden kann, wird diese echte Mehrdeutigkeit in der Fußnote sichtbar gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoll-prophetischem Ton. Die Gedankenstriche markieren die eingeschobene Botenformel klar. Konkrete Bilder des Hebräischen werden bewahrt, ohne unnötig wörtliche oder konfessionell geprägte Formulierungen einzuführen.
