id: JER.23.10
reference: Jeremiah 23:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
translation:
  language: de
  text: Denn das Land ist voll von Ehebrechern. Wegen des Fluches[a] trauert das Land, und die Weideplätze der Steppe sind verdorrt. Ihr Lauf[b] ist böse, und ihre Stärke ist nicht recht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen des Eides“ beziehungsweise „wegen des Flucheides“. Das hebräische Wort kann einen Eid bezeichnen, besonders einen Eid, der einen Fluch einschließt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihr Rennen“ beziehungsweise „ihr Weg“; das hebräische Wort kann bildlich den Verlauf ihres Handelns bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich knapp: „ist nicht so“; auch „ist nicht aufrichtig“ oder „ist nicht gerecht“ ist möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  choice: Ehebrechern
  rationale: Das substantivisch gebrauchte Partizip bezeichnet Menschen, die Ehebruch begehen. Die konkrete moralische Anklage bleibt erhalten, ohne mögliche weitergehende Anklänge an Bundestreue ausdrücklich festzulegen.
- source_word: מָלְאָה הָאָרֶץ
  choice: das Land ist voll
  rationale: Im auf Juda bezogenen Zusammenhang bezeichnet אֶרֶץ am natürlichsten das Land, nicht die gesamte Erde.
- source_word: מִפְּנֵי אָלָה
  choice: wegen des Fluches
  rationale: אָלָה kann einen Fluch oder einen mit Fluch verbundenen Eid bezeichnen. Das Trauern und Verdorren des Landes spricht hier vorrangig für die Wirkung eines Fluches; die echte Mehrdeutigkeit wird in einer Fußnote bewahrt.
- source_word: אָבְלָה
  choice: trauert
  rationale: Die Wiedergabe erhält die Personifikation des Landes und den üblichen Sinn des Verbs אבל.
- source_word: יָבְשׁוּ
  choice: sind verdorrt
  rationale: Die Form beschreibt den eingetretenen Zustand; „sind verdorrt“ ist im Deutschen natürlich und passt zu Weideflächen.
- source_word: נְאוֹת מִדְבָּר
  choice: die Weideplätze der Steppe
  rationale: נְאוֹת sind Weide- oder Lagerplätze; מִדְבָּר bezeichnet hier eher unbewohntes Weideland beziehungsweise Steppe als eine reine Sandwüste.
- source_word: מְרוּצָתָם
  choice: ihr Lauf
  rationale: Die wörtliche Lauf-Metapher bleibt erhalten und kann zugleich den Verlauf ihres Handelns bezeichnen.
- source_word: רָעָה
  choice: böse
  rationale: Das Adjektiv trägt eine klare moralische Wertung und qualifiziert ihren Lauf beziehungsweise Lebenswandel.
- source_word: גְבוּרָתָם
  choice: ihre Stärke
  rationale: גְבוּרָה bezeichnet Stärke, Kraft oder Macht; „Stärke“ ist hier verständlich und bewahrt die knappe Aussage.
- source_word: לֹא כֵן
  choice: ist nicht recht
  rationale: Die hebräische Wendung ist knapp und elliptisch. „Nicht recht“ gibt ihre moralische Negation wieder, ohne sie stärker als nötig auszudeuten.
theological_decisions:
- issue: Wörtlicher Ehebruch oder metaphorische Bunduntreue
  choice: „Ehebrecher“ im Haupttext
  alternative: „Treulose“ beziehungsweise eine ausdrückliche Deutung als bundbrüchige Menschen
  rationale: Das hebräische Wort bezeichnet unmittelbar Ehebrecher. Mögliche prophetische Anklänge an Bunduntreue bleiben bestehen, werden aber nicht an die Stelle des lexikalischen Sinnes gesetzt.
- issue: Bedeutung von אָלָה
  choice: „Fluch“ im Haupttext
  alternative: „Eid“ oder „Flucheid“
  rationale: Die Verwüstung des Landes legt den wirksamen Fluch nahe. Da אָלָה jedoch auch einen Eid, besonders einen fluchbewehrten Eid, bezeichnen kann, wird diese Möglichkeit in der Fußnote genannt.
- issue: Elliptische Aussage לֹא כֵן
  choice: „nicht recht“
  alternative: „nicht so“, „nicht aufrichtig“ oder „nicht gerecht“
  rationale: Die Übersetzung macht die wahrscheinliche moralische Stoßrichtung verständlich, während die Fußnote die Kürze und Offenheit des Hebräischen sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Aussage. „Steppe“ vermittelt den alttestamentlichen מִדְבָּר-Kontext natürlicher als „Wüste“. Die Metaphern des trauernden Landes und ihres „Laufs“ bleiben erhalten; echte lexikalische und syntaktische Mehrdeutigkeiten werden in Fußnoten ausgewiesen.
