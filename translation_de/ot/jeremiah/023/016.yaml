  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת אַֽל תִּשְׁמְע֞וּ עַל דִּבְרֵ֤י הַ/נְּבִאִים֙ הַ/נִּבְּאִ֣ים לָ/כֶ֔ם מַהְבִּלִ֥ים הֵ֖מָּה אֶתְ/כֶ֑ם חֲז֤וֹן לִבָּ/ם֙ יְדַבֵּ֔רוּ לֹ֖א מִ/פִּ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/016.yaml
  text: 'Thus says Yahweh of hosts: Do not listen to the words of the prophets who prophesy to you; they are deluding you. They speak a vision of their own heart[a], not from the mouth of Yahweh.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Hört nicht auf die Worte der Propheten, die euch weissagen. Sie führen euch in die Irre.[a] Sie verkünden eine Vision ihres eigenen Herzens, nicht aus dem Mund Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sie machen euch nichtig« oder »Sie führen euch in die Leere.« Das hebräische Verb bezeichnet ein Verursachen von Leere oder Nichtigkeit und kann hier auch den Sinn »Sie täuschen euch« haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „Herr der Heerscharen“ ist die im Deutschen verständliche und würdevolle Form des Titels, ohne die Heerscharen auf irdische Armeen zu beschränken.
- source_word: אַל תִּשְׁמְעוּ עַל דִּבְרֵי
  choice: Hört nicht auf die Worte
  rationale: „Auf jemanden bzw. seine Worte hören“ gibt das hebräische Verbot idiomatisch wieder und bewahrt zugleich den Plural „Worte“.
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: der Propheten, die euch weissagen
  rationale: Die Verbindung von „Propheten“ und „weissagen“ erhält das hebräische Wortspiel zwischen Substantiv und Partizip sowie den direkten Bezug auf die Angesprochenen.
- source_word: מַהְבִּלִים הֵמָּה אֶתְכֶם
  choice: Sie führen euch in die Irre
  rationale: Die Hifil-Form von הבל bezeichnet hier ein Verursachen von Nichtigkeit oder Leere und damit irreführende, gehaltlose Verkündigung. Die deutsche Wendung ist klar, ohne die Wirkung enger als „falsche Hoffnung“ festzulegen.
- source_word: חֲזוֹן לִבָּם
  choice: eine Vision ihres eigenen Herzens
  rationale: „Vision“ und „Herz“ bewahren die konkreten Bilder des Hebräischen. „Eigenen“ verdeutlicht den Gegensatz zwischen selbst hervorgebrachter Schau und einem Wort Jahwes.
- source_word: יְדַבֵּרוּ
  choice: Sie verkünden
  rationale: Im Kontext prophetischer Rede gibt „verkünden“ den fortgesetzten Sprechakt natürlich und würdevoll wieder.
- source_word: לֹא מִפִּי יְהוָה
  choice: nicht aus dem Mund Jahwes
  rationale: Die konkrete hebräische Redeweise bleibt erhalten und unterstreicht, dass ihre Botschaft nicht von Jahwe ausgesprochen wurde.
theological_decisions:
- issue: Wirkung der falschen Propheten auf ihre Hörer
  choice: Sie führen euch in die Irre
  alternative: Sie erfüllen euch mit falscher Hoffnung / Sie machen euch nichtig
  rationale: הבל trägt die Vorstellung von Leere und Nichtigkeit. Im Zusammenhang bezeichnet die Kausativform eine irreführende Wirkung; die Übersetzung wahrt diese Aussage, ohne die Art der Täuschung ausschließlich als falsche Hoffnung zu bestimmen.
- issue: Anthropologische Bedeutung von לֵב
  choice: ihres eigenen Herzens
  alternative: ihres eigenen Denkens
  rationale: Das hebräische „Herz“ umfasst Denken, Wollen und Begehren. Die Beibehaltung des Bildes wahrt diese Bedeutungsbreite und den Gegensatz zur Rede aus Jahwes Mund.
- issue: Quelle prophetischer Autorität
  choice: nicht aus dem Mund Jahwes
  alternative: nicht von Jahwe
  rationale: Die bildhafte Formulierung wird nicht geglättet; so bleibt der scharfe Gegensatz zwischen menschlich erzeugter Vision und göttlicher Äußerung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Propheten, die … weissagen“ bewahrt bewusst das hebräische Wortspiel. „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ hält die Breite des Titels offen.
