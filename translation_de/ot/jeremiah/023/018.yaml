id: JER.23.18
reference: Jeremiah 23:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י מִ֤י עָמַד֙ בְּ/ס֣וֹד יְהוָ֔ה וְ/יֵ֖רֶא וְ/יִשְׁמַ֣ע אֶת דְּבָר֑/וֹ מִֽי הִקְשִׁ֥יב דבר/י וַ/יִּשְׁמָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
translation:
  language: de
  text: Denn wer hat im Rat des HERRN[a] gestanden, sodass er sein Wort sah und hörte? Wer hat auf mein Wort geachtet und es gehört?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im vertrauten Kreis des HERRN“ beziehungsweise „bei der vertraulichen Beratung des HERRN“. Das hebräische Wort kann sowohl einen vertraulichen Rat als auch eine Ratsversammlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die rhetorische Begründung für die vorausgehende Anklage ein und wahrt den argumentativen Zusammenhang.
- source_word: עָמַד בְּסוֹד
  choice: hat im Rat gestanden
  rationale: Das Perfekt wird mit dem deutschen Perfekt wiedergegeben; סוֹד bezeichnet hier wahrscheinlich den vertraulichen göttlichen Rat beziehungsweise die Ratsversammlung.
- source_word: יְהוָה
  choice: HERRN
  rationale: Der Gottesname wird nach verbreiteter deutscher Bibeltradition mit HERR wiedergegeben; die Genitivform lautet „des HERRN“.
- source_word: וְיֵרֶא וְיִשְׁמַע
  choice: sodass er … sah und hörte
  rationale: Die Verbfolge wird als Folge des Stehens im göttlichen Rat verstanden. „Sah und hörte“ bewahrt das auffällige Paar der Wahrnehmungsverben.
- source_word: דְּבָרוֹ
  choice: sein Wort
  rationale: „Wort“ erhält den prophetischen Offenbarungscharakter von דָּבָר, ohne es enger als „Botschaft“ festzulegen.
- source_word: הִקְשִׁיב
  choice: hat … geachtet
  rationale: Gibt die intensive Bedeutung des Hifil als aufmerksames Hinhören in natürlichem Deutsch wieder.
- source_word: דְבָרִי
  choice: mein Wort
  rationale: Bewahrt den Wechsel zur ersten Person der göttlichen Rede und die lexikalische Verbindung zu „sein Wort“.
- source_word: וַיִּשְׁמָע
  choice: und es gehört
  rationale: Führt das Motiv des Hörens fort; das Pronomen macht den im Hebräischen vorausgesetzten Bezug im Deutschen deutlich, ohne „gehorcht“ einzutragen.
theological_decisions:
- issue: Bedeutung von סוֹד יְהוָה
  choice: im Rat des HERRN
  alternative: im vertrauten Kreis / in der vertraulichen Beratung des HERRN
  rationale: Im prophetischen Zusammenhang liegt das Bild einer göttlichen Ratsversammlung nahe, zu der ein wahrer Prophet Zugang hat. Zugleich kann סוֹד auch Vertraulichkeit und vertrauten Umgang bezeichnen; diese Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen, der Wechsel von „sein Wort“ zu „mein Wort“ und die Spannung zwischen göttlicher Ratsversammlung und vertraulicher Beratung bleiben erhalten.
