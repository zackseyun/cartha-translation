id: JER.23.36
reference: Jeremiah 23:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/מַשָּׂ֥א יְהוָ֖ה לֹ֣א תִזְכְּרוּ ע֑וֹד כִּ֣י הַ/מַּשָּׂ֗א יִֽהְיֶה֙ לְ/אִ֣ישׁ דְּבָר֔/וֹ וַ/הֲפַכְתֶּ֗ם אֶת דִּבְרֵי֙ אֱלֹהִ֣ים חַיִּ֔ים יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
translation:
  language: de
  text: Doch den Ausdruck »Last Jahwes« sollt ihr nicht mehr erwähnen. Denn jedem wird sein eigenes Wort zur Last[a], und ihr habt die Worte des lebendigen Gottes, Jahwes der Heerscharen[b], unseres Gottes, verdreht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort מַשָּׂא kann »Last« bedeuten, in prophetischen Zusammenhängen aber auch »Ausspruch« oder »Botschaft«. Hier wird offenbar bewusst mit beiden Bedeutungen gespielt.
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: »Jahwe der Heerscharen«. Das Wort kann Heerscharen oder Heere bezeichnen und schließt je nach Zusammenhang himmlische wie auch irdische Scharen ein.'
    reason: translation_clarification
lexical_decisions:
- source_word: מַשָּׂא
  choice: Last
  rationale: Das hebräische Wort kann sowohl eine zu tragende Last als auch einen prophetischen Ausspruch bezeichnen. »Last« bewahrt das Wortspiel zwischen der missbrauchten Formel »Last Jahwes« und dem eigenen Wort, das dem Sprecher zur Last wird.
- source_word: תִזְכְּרוּ
  choice: erwähnen
  rationale: In Verbindung mit dem zitierten Ausdruck bezeichnet das Verb hier nicht bloß inneres Erinnern, sondern das Aussprechen oder Anführen dieser Formel.
- source_word: הַמַּשָּׂא יִהְיֶה לְאִישׁ דְּבָרוֹ
  choice: das eigene Wort eines jeden wird ihm zur Last werden
  rationale: Die Formulierung gibt die knappe hebräische Zuordnung verständlich wieder, ohne die polemische Rückwendung des Wortes מַשָּׂא auf den jeweiligen Sprecher aufzulösen.
- source_word: וַהֲפַכְתֶּם
  choice: ihr habt ... verdreht
  rationale: »Verdreht« bezeichnet hier die schuldhafte Entstellung der Worte Gottes und bleibt zugleich anschaulich und gegenwärtig.
- source_word: אֱלֹהִים חַיִּים
  choice: der lebendige Gott
  rationale: Die geläufige deutsche Wendung bewahrt den theologischen Kontrast zwischen dem lebendigen Gott und den eigenmächtigen Worten der Sprecher.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Die Wiedergabe erhält sowohl den Gottesnamen als auch das Bild der geordneten himmlischen beziehungsweise kriegerischen Scharen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als Name wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Wortspiel mit מַשָּׂא
  choice: In beiden Sinnzusammenhängen »Last«
  alternative: »Ausspruch« oder »Botschaft« in der prophetischen Formel
  rationale: 'Die wiederholte Wiedergabe mit »Last« erhält die beabsichtigte Spannung: Die Menschen berufen sich auf eine angebliche göttliche »Last«, doch ihr eigenes Wort wird ihnen selbst zur Last.'
- issue: Deutung von לְאִישׁ דְּבָרוֹ
  choice: Das eigene Wort eines jeden wird ihm zur Last
  alternative: Das Wort jedes Einzelnen wird der Ausspruch sein
  rationale: Der Zusammenhang stützt die Rückwirkung des eigenmächtigen Wortes auf seinen Sprecher; die Fußnote hält jedoch die Mehrdeutigkeit des Schlüsselwortes offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formel »Last Jahwes« wurde bewusst beibehalten, damit das zentrale hebräische Wortspiel hörbar bleibt. »Eines jeden« gibt den verteilenden Sinn von אִישׁ knapp und allgemein wieder; der Gedankenstrich kennzeichnet die appositionelle Benennung des lebendigen Gottes.
