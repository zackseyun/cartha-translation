source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֵ֤ת אֲשֶׁר אָֽמְרוּ֙ הַ/נְּבִאִ֔ים הַֽ/נִּבְּאִ֥ים בִּ/שְׁמִ֛/י שֶׁ֖קֶר לֵ/אמֹ֑ר חָלַ֖מְתִּי חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
translation:
  language: de
  text: 'Ich habe gehört, was die Propheten gesagt haben, die in meinem Namen Lügen weissagen[a]: »Ich habe geträumt! Ich habe geträumt!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die in meinem Namen falsch weissagen«.'
    reason: 'Lexikalische Alternative: שֶׁקֶר kann als Gegenstand der Weissagung oder adverbial als Kennzeichnung ihres falschen Charakters verstanden werden.'
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Ich habe gehört
  rationale: Das Qal-Perfekt 1. Person Singular bezeichnet ein abgeschlossenes Hören mit gegenwärtiger Bedeutung; das deutsche Perfekt ist hier natürlich und passend.
- source_word: אֵת אֲשֶׁר אָמְרוּ
  choice: was … sagen
  rationale: אֵת אֲשֶׁר wird idiomatisch mit „was“ wiedergegeben. Das hebräische Perfekt אָמְרוּ wird im Kontext als zusammenfassende Wiedergabe des fortdauernden Redens der Propheten natürlich ins Präsens übertragen.
- source_word: הַנְּבִאִים
  choice: die Propheten
  rationale: Entspricht der üblichen Bedeutung und bewahrt den bestimmten Artikel.
- source_word: הַנִּבְּאִים
  choice: die … weissagen
  rationale: Das substantivisch beziehungsweise appositionell gebrauchte Nifal-Partizip wird als Relativsatz wiedergegeben; „weissagen“ bewahrt den Bezug zur prophetischen Rede.
- source_word: בִּשְׁמִי
  choice: in meinem Namen
  rationale: Die geläufige deutsche Wendung bezeichnet den Anspruch, mit Gottes Vollmacht und Autorisierung zu sprechen.
- source_word: שֶׁקֶר
  choice: Lügen
  rationale: Das Substantiv wird konkret als Inhalt ihrer Weissagung verstanden. Dadurch bleibt die scharfe Anklage des hebräischen Textes erhalten.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Der quotative Infinitiv wird im Deutschen idiomatisch durch die Einleitung der direkten Rede ausgedrückt.
- source_word: חָלַמְתִּי חָלָמְתִּי
  choice: Ich habe geträumt! Ich habe geträumt!
  rationale: Die Wiederholung der beiden Perfektformen wird vollständig bewahrt und bringt den nachdrücklichen Anspruch auf einen Offenbarungstraum zum Ausdruck.
theological_decisions:
- issue: Art der falschen prophetischen Aussage
  choice: die in meinem Namen Lügen weissagen
  alternative: die in meinem Namen falsch weissagen
  rationale: שֶׁקֶר kann hier den Inhalt („Lügen“) oder die Art und Weise („falsch“) der Weissagung bezeichnen. Der Haupttext bewahrt die konkrete substantivische Aussage; die Fußnote weist die genuine Alternative aus, ohne sie theologisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholung der Traumbehauptung bleibt erhalten. „Weissagen“ ist bibelsprachlich, aber weiterhin allgemein verständlich und bildet die Wortverwandtschaft zwischen „Propheten“ und ihrem prophetischen Reden angemessen ab.
