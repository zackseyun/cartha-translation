id: JER.23.7
reference: Jeremiah 23:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
translation:
  language: de
  text: 'Darum: Siehe, es kommen Tage – Ausspruch Jahwes –, da wird man nicht mehr sagen: »So wahr Jahwe lebt, der die Söhne Israels[a] aus dem Land Ägypten heraufgeführt hat«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „die Israeliten“ beziehungsweise „das Volk Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und klingt im modernen Deutsch natürlicher als das förmlichere „Daher“.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt den nachdrücklichen, feierlichen Hinweischarakter der prophetischen Rede, ohne ihn zu einer bloßen Wahrnehmungsaufforderung abzuschwächen.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Gibt die prophetische Zukunftsformel eng und zugleich idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den substantivischen Charakter der prophetischen Botenformel und ihre feierliche Autorität.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt das Tetragramm als den persönlichen Gottesnamen in der im Deutschen geläufigen Form wieder, statt es durch einen Titel zu ersetzen.
- source_word: וְלֹא יֹאמְרוּ עוֹד
  choice: da wird man nicht mehr sagen
  rationale: „Nicht mehr“ drückt das Ende eines bisherigen Sprachgebrauchs aus; das unbestimmte „man“ entspricht dem nicht näher bezeichneten Subjekt der dritten Person Plural.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Ist die natürliche deutsche Entsprechung der festen hebräischen Schwurformel.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: der … heraufgeführt hat
  rationale: Bewahrt sowohl den Relativsatz als auch die Bewegungsrichtung des Hifil von עלה; im Exoduszusammenhang bezeichnet es Gottes Heraus- beziehungsweise Heraufführung des Volkes.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Gibt die formal maskuline hebräische Wendung transparent wieder; die idiomatische kollektive Bedeutung wird in der Fußnote genannt.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Bewahrt die volle Ortsbezeichnung und den heilsgeschichtlichen Anklang der Exodusformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen, während „der HERR“ ihn durch einen Titel ersetzt.
- issue: Umfang der Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten
  rationale: Die Hauptübersetzung wahrt die grammatisch maskuline und genealogische Formulierung. Zugleich kann die Wendung kollektiv das ganze Volk bezeichnen; diese idiomatische Lesart bleibt in der Fußnote sichtbar.
- issue: Funktion von חַי יְהוָה
  choice: So wahr Jahwe lebt
  alternative: Jahwe lebt
  rationale: Im Kontext handelt es sich um eine Schwur- beziehungsweise Beteuerungsformel, nicht lediglich um eine Aussage über Gottes Lebendigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem „siehe“. Gedankenstriche grenzen die feierliche Botenformel klar ab. Die Schwurformel ist idiomatisch deutsch formuliert; die genealogisch-formale Wendung „Söhne Israels“ bleibt im Haupttext erhalten und wird durch eine Fußnote erläutert.
