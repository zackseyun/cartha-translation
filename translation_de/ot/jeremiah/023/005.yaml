id: JER.23.5
reference: Jeremiah 23:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
translation:
  language: de
  text: Siehe, es kommen Tage – Ausspruch Jahwes –, da werde ich David einen gerechten Spross[a] erstehen lassen. Er wird als König herrschen, mit Einsicht handeln[b] und im Land Recht und Gerechtigkeit üben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »einen gerechten Trieb« beziehungsweise »einen gerechten Schössling«. Das hebräische Bild bezeichnet einen Nachkommen aus Davids Linie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »umsichtig handeln«; auch »Erfolg haben«. Das hebräische Verb kann sowohl einsichtsvolles Handeln als auch das daraus entstehende Gelingen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die hinweisende Kraft und den feierlichen Ton der prophetischen Ankündigung; im modernen Deutschen gehoben, aber weiterhin verständlich.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Gibt die prophetische Zukunftsformel nah am Hebräischen und zugleich idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den substantivischen Charakter der autoritativen Prophetenformel und gibt den Gottesnamen ausdrücklich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Transkribiert den im Ausgangstext stehenden Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- source_word: וַהֲקִמֹתִי
  choice: werde ich … erstehen lassen
  rationale: 'Gibt den kausativen Sinn von קום wieder: Gott lässt den verheißenen davidischen Herrscher auftreten.'
- source_word: לְדָוִד
  choice: David
  rationale: Mit „David einen … Spross erstehen lassen“ wird die Zugehörigkeit zur davidischen Linie natürlich ausgedrückt, ohne „Haus“ ergänzend in den Text einzutragen.
- source_word: צֶמַח צַדִּיק
  choice: einen gerechten Spross
  rationale: „Spross“ erhält das Bild eines neuen Triebs aus der davidischen Linie. Die Kleinschreibung vermeidet eine im Hebräischen nicht markierte Titulierung.
- source_word: וּמָלַךְ מֶלֶךְ
  choice: Er wird als König herrschen
  rationale: Bewahrt die emphatische Verbindung von Verb und stammverwandtem Substantiv in natürlichem Deutsch.
- source_word: וְהִשְׂכִּיל
  choice: mit Einsicht handeln
  rationale: Stellt das kluge und verständige Handeln in den Vordergrund, ohne die ebenfalls mögliche Erfolgsnuance auszuschließen.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  rationale: Die feste Wortpaarung bezeichnet gerechte königliche Herrschaft und wahrt die Unterscheidung der beiden hebräischen Begriffe.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Im Kontext Jeremias ist zunächst das Land gemeint; „auf der Erde“ bleibt grammatisch möglich, wäre hier jedoch weniger wahrscheinlich.
theological_decisions:
- issue: Messianische Bedeutung des davidischen Sprosses
  choice: Die davidisch-königliche Bildsprache bleibt erhalten, ohne die Gestalt im Haupttext ausdrücklich als Messias oder Christus zu identifizieren.
  alternative: „Messias“, „Christus“ oder einen großgeschriebenen Titel „Spross“ in den Text einsetzen.
  rationale: Der Vers trägt eine starke dynastische und messianische Erwartung, benennt die Gestalt jedoch nicht ausdrücklich als Messias. Die Übersetzung bewahrt diese Aussage und lässt ihre kanonische Deutung offen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname steht ausdrücklich im hebräischen Text; seine Wiedergabe als „Jahwe“ bewahrt diese lexikalische Unterscheidung.
- issue: Bedeutungsbreite von וְהִשְׂכִּיל
  choice: mit Einsicht handeln
  alternative: Erfolg haben / Gelingen haben
  rationale: Im Zusammenhang königlicher Regierung liegt verständiges Handeln nahe. Da das Verb auch den daraus folgenden Erfolg bezeichnen kann, wird diese Möglichkeit in einer Fußnote festgehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst prophetisch-feierlichem „Siehe“ und „Ausspruch Jahwes“. Der Satzbau bleibt quellennah, wird aber durch Gedankenstriche und einen neuen Satz lesbar gegliedert. „Spross“ ist als verständliches Traditionswort beibehalten und in der Fußnote erläutert.
