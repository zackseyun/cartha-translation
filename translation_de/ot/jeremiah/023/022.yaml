source:
  edition: WLC
  text: וְ/אִֽם עָמְד֖וּ בְּ/סוֹדִ֑/י וְ/יַשְׁמִ֤עוּ דְבָרַ/י֙ אֶת עַמִּ֔/י וִֽ/ישִׁבוּ/ם֙ מִ/דַּרְכָּ֣/ם הָ/רָ֔ע וּ/מֵ/רֹ֖עַ מַֽעַלְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
translation:
  language: de
  text: Doch wenn sie in meinem Rat[a] gestanden hätten, hätten sie mein Volk meine Worte hören lassen und es von seinem bösen Weg und von der Bosheit seiner Taten abgebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in meiner Ratsversammlung“, „in meinem vertrauten Kreis“ oder „in meinem Ratschluss“. Das hebräische Wort סוֹד kann einen vertraulichen Kreis, eine nicht öffentliche Ratsversammlung oder den dort mitgeteilten Ratschluss bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: 'Die Verbindung ist im Zusammenhang adversativ: Die falschen Propheten werden dem gegenübergestellt, was sie getan hätten, wenn sie wirklich Zugang zu Gottes Rat gehabt hätten.'
- source_word: עָמְדוּ
  choice: gestanden hätten
  rationale: Das Qatal steht hier in einem irrealen Bedingungssatz; der deutsche Konjunktiv II der Vergangenheit gibt dies natürlich wieder.
- source_word: בְּסוֹדִי
  choice: in meinem Rat
  rationale: סוֹד kann den vertraulichen Kreis beziehungsweise die Ratsversammlung oder den dort erteilten Ratschluss bezeichnen. „Rat“ bewahrt im Deutschen diese Mehrdeutigkeit besser als eine stärker festlegende Umschreibung.
- source_word: וְיַשְׁמִעוּ דְבָרַי אֶת־עַמִּי
  choice: hätten sie mein Volk meine Worte hören lassen
  rationale: Die Form von שׁמע ist kausativ. „Hören lassen“ erhält diesen Sinn und bewahrt zugleich den ausdrücklichen Plural „meine Worte“.
- source_word: וִישִׁבוּם
  choice: und es … abgebracht
  rationale: Die Hifil-Form von שוב ist kausativ. In Verbindung mit מִן gibt „von … abbringen“ die bewirkte Abkehr idiomatisch wieder; das Suffix bezieht sich kollektiv auf „mein Volk“.
- source_word: מִדַּרְכָּם הָרָע
  choice: von seinem bösen Weg
  rationale: „Weg“ bewahrt das hebräische Bild für Lebensführung. Wegen des kollektiven Singulars „Volk“ stehen die deutschen Bezüge im Singular.
- source_word: וּמֵרֹעַ מַעַלְלֵיהֶם
  choice: und von der Bosheit seiner Taten
  rationale: Die Konstruktion nennt wörtlich das Böse beziehungsweise die Bosheit der Taten. Diese Wiedergabe erhält sowohl das abstrakte רֹעַ als auch das konkrete מַעֲלָלִים.
theological_decisions:
- issue: Bedeutung des göttlichen סוֹד
  choice: „in meinem Rat“ mit Fußnote zur möglichen Ratsversammlung beziehungsweise vertraulichen Beratung
  alternative: „in meiner Ratsversammlung“ oder „in meinem vertrauten Kreis“
  rationale: Der Ausdruck kann sowohl die vertrauliche göttliche Ratsgemeinschaft als auch den darin eröffneten Ratschluss bezeichnen. Die Übersetzung soll das Bild echten prophetischen Zugangs bewahren, ohne eine einzelne Deutung exklusiv festzuschreiben.
- issue: Wirkung wahrer prophetischer Verkündigung
  choice: Die Propheten hätten das Volk kausativ hören lassen und von seinem bösen Verhalten abgebracht.
  alternative: Sie hätten lediglich Gottes Worte verkündet und das Volk wäre umgekehrt.
  rationale: Beide hebräischen Verbformen sind kausativ. Die Übersetzung erhält diese grammatische Aussage, ohne daraus eine weitergehende Lehre über menschliche oder göttliche Wirksamkeit abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Bedingungssatz wird mit Konjunktiv II der Vergangenheit wiedergegeben. „Rat“ hält die echte lexikalische Mehrdeutigkeit von סוֹד offen; die Fußnote nennt die wichtigsten Alternativen. Die doppelte Formulierung „böser Weg“ und „Bosheit seiner Taten“ bewahrt die rhetorische Zweigliedrigkeit des Hebräischen.
