id: JER.23.11
reference: Jeremiah 23:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי גַם נָבִ֥יא גַם כֹּהֵ֖ן חָנֵ֑פוּ גַּם בְּ/בֵיתִ֛/י מָצָ֥אתִי רָעָתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/011.yaml
  text: For both prophet and priest are ungodly[a]; even in my house I have found their evil[b], declares Yahweh.
translation:
  language: de
  text: Denn Prophet wie Priester sind gottlos[a]; selbst in meinem Haus[b] habe ich ihre Bosheit gefunden, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sind entweiht“, „sind verdorben“ oder „handeln heuchlerisch“. Das hebräische Verb bezeichnet moralisch-religiöse Verderbtheit oder Gottlosigkeit.'
    reason: lexical_alternative
  - marker: b
    text: Mit „meinem Haus“ ist der Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet im Zusammenhang das zuvor angekündigte Gericht und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: גַם ... גַם
  choice: Prophet wie Priester
  rationale: Die wiederholte Partikel schließt beide Gruppen ausdrücklich ein; „Prophet wie Priester“ gibt diese paarige Hervorhebung knapp und idiomatisch wieder.
- source_word: חָנֵפוּ
  choice: sind gottlos
  rationale: Das Verb bezeichnet moralisch-religiöse Verderbtheit beziehungsweise Frevel. „Sind gottlos“ ist verständlich und wahrt die religiöse Dimension, ohne die Bedeutung auf bloße Heuchelei zu verengen.
- source_word: גַּם
  choice: selbst
  rationale: 'Die dritte Partikel steigert die Anklage: Die Bosheit findet sich sogar an Jahwes eigenem heiligen Ort.'
- source_word: בְּבֵיתִי
  choice: in meinem Haus
  rationale: Die wörtliche Wendung „in meinem Haus“ bleibt erhalten; im Kontext bezeichnet sie den Tempel.
- source_word: מָצָאתִי
  choice: habe ich ... gefunden
  rationale: Das hebräische Perfekt wird mit einem deutschen Perfekt wiedergegeben, das die festgestellte Tat mit ihrer gegenwärtigen Bedeutung verbindet.
- source_word: רָעָתָם
  choice: ihre Bosheit
  rationale: „Bosheit“ bezeichnet hier moralisches Übel und klingt im Deutschen natürlicher als das substantivierte „ihr Böses“.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von חָנֵפוּ
  choice: sind gottlos
  alternative: sind entweiht; sind verdorben; handeln heuchlerisch
  rationale: Die Form bezeichnet umfassende moralisch-religiöse Verderbtheit. Die Übersetzung legt sie nicht auf die engere Vorstellung bloßer Heuchelei fest; die weiteren möglichen Nuancen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die paarige Formulierung „Prophet wie Priester“ ist knapp und allgemein verständlich; „spricht Jahwe“ bewahrt den feierlichen Charakter der prophetischen Formel.
