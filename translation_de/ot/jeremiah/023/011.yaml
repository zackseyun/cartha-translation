  source_fidelity: Die Übersetzung gibt כִּי zutreffend als begründendes „Denn“ wieder. „Prophet wie Priester“ erfasst die doppelte Einschließung durch גַם … גַם idiomatisch und ohne eine im Hebräischen nicht vorhandene Einschränkung. „Sind gottlos“ deckt den hier gemeinten Bereich religiös-moralischer Verkommenheit von חָנֵפוּ angemessen ab; die Fußnote bewahrt wichtige lexikalische Nuancen. Das steigernde גַם („selbst“), בְּבֵיתִי („in meinem Haus“), מָצָאתִי („habe ich … gefunden“), רָעָתָם („ihre Bosheit“) und die Schlussformel נְאֻם יְהוָה sind sachgerecht wiedergegeben.
  naturalness: Modernes, würdiges und flüssiges Standarddeutsch. Die Formulierung „Prophet wie Priester“ ist knapp und klar; „spricht Jahwe“ passt zum prophetischen Register.
