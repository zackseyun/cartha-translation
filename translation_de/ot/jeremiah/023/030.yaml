  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
translation:
  language: de
  text: Darum, siehe, ich bin gegen die Propheten, spricht Jahwe, die meine Worte stehlen, jeder von seinem Nächsten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgernde Wendung aus der vorausgehenden Anklage und klingt im modernen Deutschen natürlicher als das förmlichere „Daher“.
- source_word: הִנְנִי עַל
  choice: Siehe, ich bin gegen
  rationale: Bewahrt sowohl das nachdrückliche Aufmerksamkeitssignal von הִנְנִי als auch die feindliche beziehungsweise richterliche Haltung, die עַל in diesem Zusammenhang ausdrückt.
- source_word: הַנְּבִאִים
  choice: die Propheten
  rationale: Direkte und im Kontext eindeutige Wiedergabe der Pluralform.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die feste prophetische Botenformel idiomatisch und würdevoll wieder; der Gottesname wird als Eigenname wiedergegeben.
- source_word: מְגַנְּבֵי דְבָרַי
  choice: die meine Worte stehlen
  rationale: Die substantivisch gebrauchte Partizipialform wird als Relativsatz wiedergegeben; der Plural „Worte“ entspricht der hebräischen Form und vermeidet eine vorschnelle Kollektivdeutung als „Botschaft“.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  choice: einer vom anderen
  rationale: Gibt die distributive hebräische Wendung natürlich wieder. Gemeint ist, dass die Propheten ihre angeblichen Gottesworte gegenseitig übernehmen; „Nächster“ wäre im heutigen Deutschen hier leicht missverständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ wahrt diesen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Partizipialphrase מְגַנְּבֵי דְבָרַי
  choice: Relativsatz zu „die Propheten“
  alternative: 'förmlich-appositionell: „die Diebe meiner Worte“'
  rationale: Der Relativsatz bewahrt die Anklage als kennzeichnende Handlung, ohne die Propheten durch ein zusätzliches deutsches Substantiv stärker zu etikettieren als der Kontext verlangt.
- issue: Distributive maskuline Form אִישׁ ... רֵעֵהוּ
  choice: einer vom anderen
  alternative: jeder von seinem Nächsten
  rationale: Die deutsche distributive Wendung gibt die wechselseitige Beziehung präzise wieder, ohne das grammatische Maskulinum unnötig zu verallgemeinern oder eine geschlechtliche Aussage in den Vordergrund zu rücken.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-prophetischem Klang. „Siehe“ bleibt als bewusst markiertes biblisches Aufmerksamkeitssignal erhalten; die übrige Syntax ist knapp und gegenwärtig.
