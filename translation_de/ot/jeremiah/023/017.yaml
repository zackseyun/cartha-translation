source:
  edition: WLC
  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
translation:
  language: de
  text: 'Immer wieder sagen sie zu denen, die mich verachten[a]: »Jahwe hat gesprochen: Ihr werdet Frieden haben[b].« Und allen, die dem Starrsinn ihres eigenen Herzens folgen, sagen sie: »Kein Unheil wird über euch kommen[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »zu meinen Verächtern« oder »zu denen, die mich verschmähen«.'
    reason: lexical_alternative
  - marker: b
    text: »Frieden« kann hier auch Wohlergehen, Sicherheit oder unversehrtes Ergehen bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »Nichts Böses wird über euch kommen.« Gemeint ist hier ein Unglück oder eine Katastrophe, nicht moralisch Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  choice: Immer wieder sagen sie
  rationale: Die Verbindung aus Partizip und Infinitivus absolutus verstärkt die Aussage und bezeichnet hier ein fortgesetztes, nachdrückliches Reden. »Immer wieder sagen sie« gibt dies in natürlichem Deutsch wieder.
- source_word: לִמְנַאֲצַי
  choice: zu denen, die mich verachten
  rationale: Das Partizip von נאץ mit Suffix der 1. Person Singular bezeichnet Menschen, die den Sprecher verachten oder verschmähen. Die Formulierung bewahrt das unbestimmte »mich« des Hebräischen; im Zusammenhang spricht Jahwe.
- source_word: דִּבֶּר יְהוָה
  choice: Jahwe hat gesprochen
  rationale: Das Perfekt mit Jahwe als Subjekt erscheint als prophetische Autorisierungsformel, die hier von den falschen Propheten beansprucht wird. »Hat gesprochen« bewahrt ihren feierlichen und abgeschlossenen Anspruch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם umfasst Frieden, Wohlergehen und unversehrtes Ergehen. »Frieden« ist knapp, traditionsfähig und lässt die breitere Bedeutung durch eine Fußnote erkennen.
- source_word: יִהְיֶה לָכֶם
  choice: Ihr werdet … haben
  rationale: Die hebräische Existenzkonstruktion wird im Deutschen idiomatisch als Besitz- beziehungsweise Erfahrungsaussage formuliert.
- source_word: וְכֹל הֹלֵךְ בִּשְׁרִרוּת לִבּוֹ
  choice: Und zu jedem, der dem Starrsinn seines eigenen Herzens folgt
  rationale: שְׁרִרוּת bezeichnet Starrsinn oder Verstocktheit. »Folgt« gibt die Lebensführung des hebräischen Bildes vom Gehen natürlich wieder; »seines eigenen Herzens« betont die selbstbestimmte innere Ausrichtung, ohne den Sinn zu erweitern.
- source_word: אָמְרוּ
  choice: sagen sie
  rationale: Das Perfekt steht innerhalb der Beschreibung ihres fortgesetzten Verhaltens. Das deutsche Präsens hält den zeitlichen Zusammenhang und den Parallelismus zum ersten Satzteil fest.
- source_word: לֹא תָבוֹא עֲלֵיכֶם רָעָה
  choice: Kein Unheil wird über euch kommen
  rationale: רָעָה bezeichnet in diesem Gerichtszusammenhang drohendes Unglück oder eine Katastrophe, nicht moralische Bosheit. »Über euch kommen« entspricht dem hebräischen Ausdruck mit בוא und על.
theological_decisions:
- issue: Bezug des Suffixes der 1. Person in לִמְנַאֲצַי
  choice: Das »mich« wird unverändert wiedergegeben und im Kontext auf Jahwe bezogen.
  alternative: Das »mich« könnte auf Jeremia als Propheten bezogen werden.
  rationale: Der unmittelbare und weitere Zusammenhang handelt von der Verachtung Jahwes und seines Wortes. Die Übersetzung entscheidet den grammatisch nicht ausdrücklich bezeichneten Sprecher jedoch nicht durch einen erklärenden Zusatz, sondern bewahrt die Form des Hebräischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar gegliedert; die fortgesetzte falsche Zusicherung wird idiomatisch ausgedrückt. Das ethische Bild des hebräischen »Gehens« wird mit »folgt« natürlich vermittelt, während die Spannung zwischen behauptetem Frieden und angekündigtem Unheil erhalten bleibt.
