source:
  edition: WLC
  text: לַ/נְּבִאִ֞ים נִשְׁבַּ֧ר לִבִּ֣/י בְ/קִרְבִּ֗/י רָֽחֲפוּ֙ כָּל עַצְמוֹתַ֔/י הָיִ֨יתִי֙ כְּ/אִ֣ישׁ שִׁכּ֔וֹר וּ/כְ/גֶ֖בֶר עֲבָ֣ר/וֹ יָ֑יִן מִ/פְּנֵ֣י יְהוָ֔ה וּ/מִ/פְּנֵ֖י דִּבְרֵ֥י קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
translation:
  language: de
  text: 'Über die Propheten:[a]


    Mein Herz ist in meinem Innern zerbrochen,

    alle meine Gebeine zittern.[b]


    Ich bin wie ein Betrunkener geworden,

    wie ein kräftiger Mann, den der Wein überwältigt hat –

    wegen Jahwe und wegen seiner heiligen Worte.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Gegen die Propheten“. Die hebräische Präposition kann das Thema des Ausspruchs einführen oder hier mit gegnerischem Sinn verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: „alle meine Gebeine beben“ oder „erbeben“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „vor Jahwe und vor seinen heiligen Worten“. Hier wird die Wendung als Angabe des Grundes für den überwältigten Zustand des Propheten verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַנְּבִאִים
  choice: Über die Propheten
  rationale: Das präfigierte ל leitet hier am ehesten das Thema des folgenden Ausspruchs ein. „Über die Propheten“ ist im Deutschen eine natürliche Überschrift und bewahrt gegenüber dem stärker deutenden „Gegen die Propheten“ die Mehrdeutigkeit.
- source_word: נִשְׁבַּר לִבִּי בְקִרְבִּי
  choice: Mein Herz ist in meinem Innern zerbrochen
  rationale: Das Nifal von שׁבר bezeichnet den Zustand des Zerbrochenseins; „in meinem Innern“ gibt בְקִרְבִּי ausdrücklich wieder.
- source_word: רָחֲפוּ כָּל עַצְמוֹתַי
  choice: alle meine Gebeine erbeben
  rationale: רחף beschreibt hier zitternde oder bebende Bewegung. „Erbeben“ bringt die körperliche Erschütterung würdig und verständlich zum Ausdruck.
- source_word: הָיִיתִי כְּאִישׁ שִׁכּוֹר
  choice: Ich bin wie ein Betrunkener geworden
  rationale: Das Perfekt beschreibt einen eingetretenen Zustand; „bin … geworden“ bewahrt diesen Übergangsaspekt.
- source_word: וּכְגֶבֶר עֲבָרוֹ יָיִן
  choice: wie ein kräftiger Mann, den der Wein überwältigt hat
  rationale: גֶּבֶר kann die Kraft des Mannes hervorheben, während die Wendung mit עבר ausdrückt, dass der Wein ihn überwältigt. Die Formulierung erhält sowohl die maskuline Einzahl als auch die Wirkung des Weines.
- source_word: מִפְּנֵי יְהוָה וּמִפְּנֵי דִּבְרֵי קָדְשׁוֹ
  choice: wegen Jahwe und wegen seiner heiligen Worte
  rationale: 'מִפְּנֵי wird im Zusammenhang kausal verstanden: Jahwe und seine heiligen Worte sind der Grund für den überwältigten Zustand des Sprechers. Die räumlichere Lesart bleibt in einer Fußnote erhalten.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird in der im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבְרֵי קָדְשׁוֹ
  choice: seine heiligen Worte
  rationale: Die natürliche deutsche Wiedergabe versteht die Konstruktverbindung als Worte, die durch seine Heiligkeit gekennzeichnet sind, und erhält das Possessivsuffix.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen; „der HERR“ wäre die traditionelle Ersetzung durch einen Titel.
- issue: Bezug von מִפְּנֵי
  choice: wegen Jahwe und wegen seiner heiligen Worte
  alternative: vor Jahwe und vor seinen heiligen Worten
  rationale: Die kausale Lesart passt zum beschriebenen körperlichen und inneren Erschrecken. Da die Präposition auch Gegenwart beziehungsweise Konfrontation ausdrücken kann, wird die Alternative nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengliederung. „Gebeine“ hält den konkreten Körperbezug und den gehobenen Ton, ohne unverständlich zu sein. Die Übersetzung bewahrt die Spannung zwischen einer thematischen und einer gegen die Propheten gerichteten Überschrift sowie zwischen kausaler und gegenwartsbezogener Deutung von מִפְּנֵי.
