  text: וְ/הַ/נָּבִ֤יא וְ/הַ/כֹּהֵן֙ וְ/הָ/עָ֔ם אֲשֶׁ֥ר יֹאמַ֖ר מַשָּׂ֣א יְהוָ֑ה וּ/פָקַדְתִּ֛י עַל הָ/אִ֥ישׁ הַ/ה֖וּא וְ/עַל בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/034.yaml
  text: And as for the prophet[a], the priest, or the people who say, “The burden of Yahweh,” I will punish that man and his household.
translation:
  language: de
  text: 'Und wenn ein Prophet, ein Priester oder jemand aus dem Volk sagt: »Last Jahwes[a]«, dann werde ich diesen Mann und sein Haus bestrafen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ausspruch Jahwes«. Das hebräische Wort massa kann einen prophetischen Ausspruch bezeichnen, bedeutet aber auch »Last«. Hier greift Jeremia offenbar gerade diese wörtliche Bedeutung auf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא
  choice: ein Prophet
  rationale: Die bestimmte hebräische Form bezeichnet hier im Zusammenhang mit den weiteren Gruppen distributiv einen beliebigen Angehörigen dieser Gruppe; im Deutschen ist daher der unbestimmte Artikel natürlich.
- source_word: הַכֹּהֵן
  choice: ein Priester
  rationale: Wie bei הַנָּבִיא ist die Aussage generisch-distributiv gemeint; »ein Priester« gibt dies in modernem Deutsch klar wieder.
- source_word: הָעָם
  choice: jemand aus dem Volk
  rationale: Das kollektive Substantiv steht in einer Reihe mit einzelnen Personen, und der folgende Singular הָאִישׁ הַהוּא richtet die Sanktion gegen den jeweiligen Sprecher. Die individualisierende Wiedergabe vermeidet die missverständliche Aussage, das ganze Volk spreche und werde als ein Einzelner bestraft.
- source_word: אֲשֶׁר יֹאמַר
  choice: sagt
  rationale: Der hebräische Singular wird bewahrt und bezieht sich distributiv auf jeden Angehörigen der genannten Gruppen.
- source_word: מַשָּׂא יְהוָה
  choice: Last Jahwes
  rationale: מַשָּׂא kann einen prophetischen Ausspruch beziehungsweise ein Orakel bezeichnen, doch Jeremia nutzt im Kontext ausdrücklich auch den konkreten Sinn »Last«. Die knappe Form wahrt das Wortspiel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּפָקַדְתִּי עַל
  choice: dann werde ich … zur Rechenschaft ziehen
  rationale: פּקד mit עַל bezeichnet hier ein ahndendes Einschreiten. »Zur Rechenschaft ziehen« vermittelt die Gerichtsbedeutung, ohne die semantische Breite unnötig auf eine bestimmte Strafhandlung zu verengen.
- source_word: הָאִישׁ הַהוּא
  choice: diesen Menschen
  rationale: Die Form verweist auf die jeweils schuldige Einzelperson. »Mensch« ist im Deutschen generisch und schließt im Kontext Propheten, Priester oder Angehörige des Volkes ein.
- source_word: בֵּיתוֹ
  choice: seine Familie
  rationale: בַּיִת meint hier den sozialen Hausverband, nicht bloß das Gebäude. »Familie« ist für gewöhnliche heutige Leser klar und natürlich.
theological_decisions:
- issue: Die Doppeldeutigkeit von מַשָּׂא in Jeremias Polemik
  choice: Im Haupttext »Last«, mit »Ausspruch« als Fußnotenalternative
  alternative: »Ausspruch Jahwes« oder »Orakel Jahwes«
  rationale: Der Kontext Jeremia 23,33–40 lebt davon, dass מַשָּׂא sowohl als prophetischer Ausspruch verstanden werden kann als auch wörtlich eine Last bezeichnet. Die Haupttextwahl erhält die polemische Wortbedeutung, während die Fußnote die fachsprachliche Bedeutung offenhält.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Eigenname wird als Eigenname wiedergegeben; dadurch bleibt die Unterscheidung zwischen Gottes Namen und einem bloßen Titel sichtbar.
- issue: Reichweite des angekündigten Gerichts über בֵּיתוֹ
  choice: seine Familie
  alternative: sein Haus beziehungsweise sein Hausverband
  rationale: Der Text erstreckt die angekündigte Ahndung ausdrücklich auf das בַּיִת des Sprechers. Die Übersetzung bewahrt diese theologische Spannung, ohne sie zu erklären oder abzumildern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Hebräischen, wird aber durch die distributive Formulierung »jemand aus dem Volk« idiomatisch geklärt. Die direkte Rede ist knapp gehalten, damit das zentrale Wortspiel um »Last« hervortritt.
