source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
translation:
  language: de
  text: 'Darum sagt Jahwe der Heerscharen über die Propheten: »Siehe, ich gebe ihnen Wermut zu essen und Giftwasser[a] zu trinken; denn von den Propheten Jerusalems ist Gottlosigkeit über das ganze Land ausgegangen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wasser des Rosch«. Das hebräische Wort bezeichnet hier einen bitteren oder giftigen Stoff; möglich ist auch: »Gallenwasser«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; »Heerscharen« bewahrt den konkreten Sinn des traditionellen Gottesepithetons in würdigem, verständlichem Deutsch.
- source_word: עַל הַנְּבִאִים
  choice: über die Propheten
  rationale: עַל kann hier sowohl »über/betreffend« als auch »gegen« bedeuten. »Über« erhält die weitere Bedeutung, während der folgende Gerichtsspruch die feindliche Ausrichtung deutlich macht.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: »Siehe« bewahrt die nachdrückliche, Aufmerksamkeit fordernde göttliche Selbstankündigung, ohne eine im Hebräischen nicht ausdrücklich markierte Zukunftsumschreibung einzuführen.
- source_word: מַאֲכִיל אוֹתָם לַעֲנָה
  choice: ich gebe ihnen Wermut zu essen
  rationale: Die Kausativform wird idiomatisch wiedergegeben und das konkrete Bild der bitteren Pflanze beibehalten.
- source_word: וְהִשְׁקִתִים מֵי רֹאשׁ
  choice: und Giftwasser zu trinken
  rationale: Die Kausativform und das Bild eines bitteren beziehungsweise giftigen Wassers werden knapp und natürlich ausgedrückt.
- source_word: חֲנֻפָּה
  choice: Gottlosigkeit
  rationale: Das Wort bezeichnet religiös-sittliche Verkommenheit beziehungsweise Entheiligung; »Gottlosigkeit« erfasst diese Verbindung in modernem Deutsch.
- source_word: יָצְאָה ... לְכָל הָאָרֶץ
  choice: ist ausgegangen über das ganze Land
  rationale: Die Bewegungsmetapher des Hebräischen bleibt erhalten; »Land« bezeichnet im Kontext am ehesten das betroffene Land und nicht die gesamte Erde.
theological_decisions:
- issue: Bildsprache des göttlichen Gerichts
  choice: Die konkreten Bilder von Wermut und Giftwasser werden beibehalten.
  alternative: Paraphrase als »bitteres Leiden« oder »schweres Gericht«
  rationale: Der hebräische Text stellt das göttliche Gericht in drastischer Speise- und Trankbildsprache dar. Eine abstrakte Paraphrase würde deren prophetisches Gewicht abschwächen.
- issue: Reichweite von הָאָרֶץ
  choice: das ganze Land
  alternative: die ganze Erde
  rationale: Der Zusammenhang in Jeremia legt das Land Juda beziehungsweise das im Kontext gemeinte Land nahe; die globale Deutung wird nicht erzwungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Bildkraft. »Siehe« ist bewusst feierlicher als Alltagssprache, entspricht hier aber der emphatischen Redeform. Der Fußnotenmarker steht nach dem gesamten Zitat, da er die Wendung »Giftwasser« erläutert.
