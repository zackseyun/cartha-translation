  text: וַ/הֲקִמֹתִ֧י עֲלֵי/הֶ֛ם רֹעִ֖ים וְ/רָע֑וּ/ם וְ/לֹא יִֽירְא֨וּ ע֧וֹד וְ/לֹא יֵחַ֛תּוּ וְ/לֹ֥א יִפָּקֵ֖דוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
translation:
  language: de
  text: Ich werde Hirten über sie einsetzen, die sie weiden werden. Sie werden sich nicht mehr fürchten und nicht mehr bestürzt sein, und niemand von ihnen wird fehlen[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „niemand von ihnen wird vermisst werden“; möglicherweise auch: „keiner wird verloren gehen“. Gemeint ist wahrscheinlich, dass von der Herde niemand fehlt oder unberücksichtigt bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Ich werde … einsetzen
  rationale: Das Hifil von קום bezeichnet hier Gottes Handeln, durch das er verantwortliche Leiter bestellt. „Einsetzen“ ist im Deutschen natürlich und gibt den Gedanken der Beauftragung wieder, ohne die Art und Weise näher festzulegen.
- source_word: עֲלֵיהֶם
  choice: über sie
  rationale: עַל bezeichnet in Verbindung mit den Hirten deren Verantwortung und Leitungsstellung gegenüber der Herde.
- source_word: רֹעִים
  choice: Hirten
  rationale: Die wörtliche Wiedergabe bewahrt das tragende Hirtenbild des unmittelbaren Zusammenhangs. „Pastoren“ oder „Leiter“ würde das Bild abschwächen oder spätere kirchliche Vorstellungen eintragen.
- source_word: וְרָעוּם
  choice: die sie weiden werden
  rationale: „Weiden“ bewahrt die Verbindung zwischen dem Substantiv „Hirten“ und dem verwandten Verb רעה. Es umfasst hier die fürsorgliche Führung der Herde, nicht nur die Futteraufnahme.
- source_word: וְלֹא יִירְאוּ עוֹד
  choice: Sie werden sich nicht mehr fürchten
  rationale: Die reflexive Form ist im modernen Deutschen idiomatisch; „nicht mehr“ gibt עוֹד im negierten Satz wieder.
- source_word: וְלֹא יֵחַתּוּ
  choice: und nicht mehr bestürzt sein
  rationale: Das Nifal von חתת kann Erschrecken, Mutlosigkeit oder inneres Gebrochensein ausdrücken. „Bestürzt sein“ hält den Begriff von „sich fürchten“ unterscheidbar und passt zum Wiederherstellungskontext.
- source_word: וְלֹא יִפָּקֵדוּ
  choice: und niemand von ihnen wird fehlen
  rationale: Das Nifal von פקד bedeutet hier wahrscheinlich, dass niemand vermisst wird, fehlt oder unberücksichtigt bleibt. Die distributive Formulierung bezieht die Aussage verständlich auf alle Angehörigen der Herde.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ ist eine würdige und geläufige Wiedergabe der prophetischen Botenformel נְאֻם; „Jahwe“ gibt den Gottesnamen wieder.
theological_decisions:
- issue: Wiedergabe des Hirtenbildes
  choice: Das Bild mit „Hirten“ und „weiden“ ausdrücklich beibehalten
  alternative: Sinngemäß „Leiter“ und „für sie sorgen“
  rationale: Die Verheißung steht im Kontrast zu den schlechten Hirten im Kontext. Eine bildhafte Wiedergabe bewahrt diese prophetische Verbindung und vermeidet eine vorschnelle Festlegung auf ein bestimmtes späteres Leitungsamt.
- issue: Bedeutungsumfang von וְלֹא יִפָּקֵדוּ
  choice: „niemand von ihnen wird fehlen“
  alternative: „keiner wird verloren gehen“ oder „es wird ihnen an nichts fehlen“
  rationale: Der hebräische Ausdruck betont wahrscheinlich, dass kein Glied der Herde fehlt oder vermisst wird. „Verloren gehen“ könnte zusätzliche heilsgeschichtliche Assoziationen wecken; „es wird ihnen an nichts fehlen“ würde die Aussage auf Versorgung statt auf die Vollständigkeit der Herde beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am hebräischen Aufbau, wird aber für flüssiges Deutsch in zwei Sätze gegliedert. Das Hirtenwortspiel bleibt durch „Hirten“ und „weiden“ erhalten; der Gottesname wird als „Jahwe“ wiedergegeben.
