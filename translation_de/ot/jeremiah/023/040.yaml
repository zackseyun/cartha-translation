  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
translation:
  language: de
  text: Und ich werde euch ewige Schmach auferlegen und ewige Schande, die nicht in Vergessenheit geraten wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „immerwährende Schmach und immerwährende Schande“. Das hebräische Wort עוֹלָם kann je nach Zusammenhang ewige, dauernde oder unabsehbar lange Fortdauer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי עֲלֵיכֶם
  choice: Und ich werde euch … auferlegen
  rationale: נתן mit עַל und abstrakten Objekten bezeichnet hier das Auferlegen eines Zustands oder einer Last. „Euch … auferlegen“ ist im modernen Deutsch natürlicher als das wörtlichere „auf euch legen“.
- source_word: חֶרְפַּת
  choice: Schmach
  rationale: חֶרְפָּה bezeichnet öffentlichen Spott, entehrende Schande oder Schmach. „Schmach“ bewahrt den Aspekt öffentlicher Entehrung und bleibt vom folgenden כְּלִמּוּת unterscheidbar.
- source_word: עוֹלָם
  choice: ewige
  rationale: עוֹלָם bezeichnet hier eine fortdauernde, unabsehbare Dauer. „Ewig“ gibt die feierliche Schärfe des Gerichtsorakels wieder; die mögliche Nuance dauernder beziehungsweise unabsehbarer Fortdauer wird in der Fußnote genannt.
- source_word: וּכְלִמּוּת
  choice: und ewige Schande
  rationale: כְּלִמּוּת bezeichnet Schande, Beschämung oder Demütigung. „Schande“ bildet mit „Schmach“ ein natürliches Wortpaar, ohne beide hebräischen Begriffe völlig gleichzusetzen.
- source_word: אֲשֶׁר לֹא תִשָּׁכֵחַ
  choice: die nicht vergessen werden wird
  rationale: Das feminine Relativpronomen bezieht sich grammatisch am unmittelbarsten auf „Schande“, entsprechend dem femininen Singular תִשָּׁכֵחַ. Die Passivform wird mit „nicht vergessen werden wird“ formal genau wiedergegeben.
theological_decisions:
- issue: Tragweite von עוֹלָם im Gerichtsorakel
  choice: ewig
  alternative: immerwährend / auf unabsehbare Zeit
  rationale: Der Ausdruck kündigt bleibende Schmach und Schande an. „Ewig“ erhält die volle, ernste Aussage, während die Fußnote darauf hinweist, dass עוֹלָם je nach Kontext auch unabsehbare oder dauernde Fortdauer bezeichnen kann.
- issue: Bezug des Relativsatzes im Singular
  choice: grammatischer Bezug auf die unmittelbar vorausgehende „Schande“
  alternative: sinngemäßer Bezug auf „Schmach und Schande“ zusammen
  rationale: Das feminine Singularverb entspricht dem zuletzt genannten femininen Singular כְּלִמּוּת. Zugleich bleibt sachlich möglich, dass die gesamte angekündigte Entehrung als unvergesslich bezeichnet wird; die Übersetzung erzwingt keine weitergehende theologische Auflösung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auferlegen“ gibt die hebräische Konstruktion idiomatisch wieder; „Schmach“ und „Schande“ erhalten die rhetorische Doppelung und die begriffliche Nähe, ohne die beiden Substantive gleichzusetzen.
