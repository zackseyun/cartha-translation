id: JER.23.6
reference: Jeremiah 23:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וְ/יִשְׂרָאֵ֖ל יִשְׁכֹּ֣ן לָ/בֶ֑טַח וְ/זֶה שְּׁמ֥/וֹ אֲֽשֶׁר יִקְרְא֖/וֹ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
translation:
  language: de
  text: 'In seinen Tagen wird Juda gerettet werden, und Israel wird in Sicherheit wohnen. Und so wird man ihn nennen: »Jahwe ist unsere Gerechtigkeit[a][b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als verblose Namensformel: »Jahwe, unsere Gerechtigkeit.«'
    reason: Die hebräische Namensformel enthält kein ausgesprochenes Wort für »ist«.
  - marker: b
    text: Das hebräische Wort für »Gerechtigkeit« kann auch »Recht« bezeichnen.
    reason: Die Bedeutungsbreite von צֶדֶק umfasst sowohl Gerechtigkeit als auch Recht.
lexical_decisions:
- source_word: בְּיָמָיו
  choice: In seinen Tagen
  rationale: Die wörtliche Zeitangabe bezieht sich im Kontext auf die Tage des angekündigten gerechten davidischen Königs und bleibt auch im modernen Deutsch verständlich.
- source_word: תִּוָּשַׁע
  choice: wird … gerettet werden
  rationale: Das Nifal von ישׁע bezeichnet Rettung oder Befreiung. »Gerettet werden« bewahrt die Offenheit dafür, ob politische, leibliche oder umfassendere Rettung gemeint ist.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: wird in Sicherheit wohnen
  rationale: Die Wendung verbindet dauerhaftes Wohnen mit Sicherheit. Diese Formulierung ist natürlich und gibt beide Bestandteile wieder.
- source_word: וְזֶה שְּׁמוֹ אֲשֶׁר יִקְרְאוֹ
  choice: Und so wird man ihn nennen
  rationale: Die kompakte deutsche Namensformel gibt den Sinn wieder, ohne dem im Hebräischen nicht ausdrücklich genannten singularischen Subjekt eine bestimmte Identität zuzuschreiben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des göttlichen Eigennamens bewahrt den Unterschied zwischen dem Namen JHWH und dem Titel »Herr«.
- source_word: צִדְקֵנוּ
  choice: ist unsere Gerechtigkeit
  rationale: צדק bezeichnet je nach Zusammenhang Gerechtigkeit, Recht oder das, was recht ist. In der Namensformel ist »unsere Gerechtigkeit« knapp und traditionsnah; das im Hebräischen fehlende Kopulaverb wird für einen verständlichen deutschen Satz ergänzt.
theological_decisions:
- issue: Bezug und Aussage der Namensformel יְהוָה צִדְקֵנוּ
  choice: »Jahwe ist unsere Gerechtigkeit« als Name, mit dem der angekündigte König bezeichnet wird
  alternative: »Jahwe, unsere Gerechtigkeit« oder eine Deutung der Formel als Aussage, dass Jahwe dem König beziehungsweise seinem Volk Gerechtigkeit schafft
  rationale: Der unmittelbare Kontext bezieht das Namensprädikat grammatisch auf den angekündigten davidischen Spross. Die Übersetzung lässt die daraus entstehende theologische Spannung stehen und erklärt weder den König schlicht mit Jahwe identisch noch trennt sie die Formel von ihm.
- issue: Semantischer Umfang von צֶדֶק
  choice: Gerechtigkeit
  alternative: Recht
  rationale: »Gerechtigkeit« passt zur königlichen und heilvollen Aussage des Zusammenhangs, während eine Fußnote den ebenfalls möglichen Rechtsaspekt sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität von Juda und Israel sowie die offene Reichweite der angekündigten Rettung bleiben erhalten. »In Sicherheit wohnen« ist gegenüber dem gehobeneren »sicher wohnen« für heutige Leser unmittelbar verständlich. Die Gottesnamensform »Jahwe« entspricht deutscher Laut- und Schreibtradition.
