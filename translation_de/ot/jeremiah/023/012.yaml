  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
translation:
  language: de
  text: Darum wird ihr Weg für sie wie glatte Stellen im Dunkeln sein. Sie werden fortgetrieben werden und darin zu Fall kommen; denn ich bringe Unheil über sie im Jahr ihrer Bestrafung[a] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Jahr ihrer Heimsuchung“. Das hebräische Wort kann die Zeit bezeichnen, in der Gott jemanden aufsucht, um Gericht zu halten oder Rechenschaft zu fordern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgende Gerichtsaussage als Konsequenz aus der vorausgehenden Anklage und klingt im heutigen Deutsch natürlich.
- source_word: יִהְיֶה דַרְכָּם לָהֶם
  choice: ihr Weg wird für sie … sein
  rationale: Bewahrt die auffällige hebräische Konstruktion und damit den Gedanken, dass ihr eigener Weg ihnen zum Verhängnis wird.
- source_word: כַּחֲלַקְלַקּוֹת
  choice: wie glatte Stellen
  rationale: Gibt das pluralische Bild gefährlich rutschiger Stellen wieder, ohne es zu einem einzelnen Weg oder Untergrund zu verengen.
- source_word: בָּאֲפֵלָה
  choice: im Dunkeln
  rationale: Vermittelt sowohl die konkrete Orientierungslosigkeit als auch die bildhafte Bedrohung in natürlichem Deutsch.
- source_word: יִדַּחוּ
  choice: sie werden fortgestoßen werden
  rationale: Das Nifal bezeichnet ein von außen bewirktes Stoßen oder Treiben; die Formulierung wahrt diese Passivität, ohne eine ausdrücklich nicht genannte Abwärtsrichtung hinzuzufügen.
- source_word: וְנָפְלוּ בָהּ
  choice: und darin fallen
  rationale: Bewahrt den pronominalen Rückverweis, ohne seinen Bezug eindeutig auf die Dunkelheit oder die gefährliche Wegstrecke festzulegen.
- source_word: רָעָה
  choice: Unheil
  rationale: Bezeichnet im Gerichtskontext verhängtes Unglück beziehungsweise Verderben und nicht moralische Bosheit.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: im Jahr ihrer Bestrafung
  rationale: Im vorliegenden Gerichtszusammenhang bezeichnet פְּקֻדָּה die Zeit göttlicher Ahndung; die Fußnote hält die weitere Bedeutung ‚Heimsuchung‘ sichtbar.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Gibt die feierliche prophetische Botenformel knapp wieder und nennt das Tetragramm als den Gottesnamen Jahwe.
theological_decisions:
- issue: Wiedergabe von יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen ausdrücklich; die Umschrift ‚Jahwe‘ macht diesen erkennbar, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe von רָעָה als von Gott gebrachtes Gericht
  choice: Unheil
  alternative: Böses
  rationale: Hier geht es um eine verhängte Katastrophe beziehungsweise Gerichtsfolge, nicht um die Aussage, Gott tue moralisch Böses.
- issue: Bedeutung von פְּקֻדָּה
  choice: Bestrafung
  alternative: Heimsuchung
  rationale: Der Zusammenhang legt gerichtliche Ahndung nahe; da das Wort zugleich eine göttliche Heimsuchung oder Abrechnung bezeichnen kann, bleibt diese Bedeutungsbreite in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Aufbau des Hebräischen und die Gerichtsschärfe bleiben erhalten; ungeklärte Bezüge werden nicht unnötig vereindeutigt.
