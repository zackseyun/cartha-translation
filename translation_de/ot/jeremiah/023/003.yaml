  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
translation:
  language: de
  text: Ich selbst aber werde den Rest meiner Herde aus all den Ländern sammeln, in die ich sie vertrieben habe[a]. Ich werde sie auf ihre Weideplätze zurückbringen[b], und sie werden fruchtbar sein und sich vermehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die ich sie zerstreut habe“. Das hebräische Verb kann ein Wegtreiben oder Zerstreuen bezeichnen; „vertrieben“ bewahrt hier die Stärke des göttlichen Gerichts.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu ihren Wohnstätten“ beziehungsweise „zu ihren Ruheplätzen“. Das hebräische Wort kann Weideplatz, Wohnstätte oder Ruheplatz bedeuten; „Weideplätze“ führt hier das Bild der Herde fort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich selbst aber
  rationale: Das selbstständige Pronomen betont Gottes persönliches Handeln; „aber“ stellt dieses Handeln passend dem Versagen der Hirten im Kontext gegenüber.
- source_word: אֲקַבֵּץ
  choice: werde ... sammeln
  rationale: „Sammeln“ gibt קבץ in einem Wiederherstellungskontext natürlich und genau wieder.
- source_word: שְׁאֵרִית צֹאנִי
  choice: den Rest meiner Herde
  rationale: „Rest“ bewahrt die prophetische Vorstellung der Übriggebliebenen, während „Herde“ das durchgehende Hirtenbild erhält.
- source_word: מִכֹּל הָאֲרָצוֹת
  choice: aus all den Ländern
  rationale: Der Plural bezeichnet die verschiedenen Gebiete, in die die Herde zerstreut beziehungsweise vertrieben wurde.
- source_word: הִדַּחְתִּי
  choice: in die ich sie vertrieben habe
  rationale: Die Kausativform bezeichnet ein Wegtreiben oder Zerstreuen. „Vertrieben“ wahrt Gottes ausdrückliche Urheberschaft und die Härte des Gerichts.
- source_word: וַהֲשִׁבֹתִי אֶתְהֶן
  choice: Ich werde sie ... zurückbringen
  rationale: Die Kausativform von שוב beschreibt, dass Gott ihre Rückkehr bewirkt; „zurückbringen“ ist konkret und idiomatisch.
- source_word: עַל נְוֵיהֶן
  choice: auf ihre Weideplätze
  rationale: נָוֶה kann Weide, Wohnstätte oder Ruheplatz bedeuten. Der Plural „Weideplätze“ passt zum Herdenbild und bildet den hebräischen Plural ab.
- source_word: וּפָרוּ וְרָבוּ
  choice: sie werden fruchtbar sein und sich vermehren
  rationale: Die traditionelle Wortpaarung bewahrt den Anklang an die biblische Segens- und Mehrungssprache.
theological_decisions:
- issue: Gottes Handeln in Gericht und Wiederherstellung
  choice: Sowohl Gottes Rolle beim Vertreiben als auch sein persönliches Sammeln und Zurückbringen werden ausdrücklich beibehalten.
  alternative: Die göttliche Urheberschaft des Exils durch eine passive Formulierung wie „wohin sie zerstreut worden sind“ abschwächen.
  rationale: Der hebräische Text schreibt Gott beide Handlungen ausdrücklich zu. Die Spannung zwischen Gericht und Wiederherstellung darf nicht aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzteilung erhöht die Lesbarkeit, ohne den gedanklichen Zusammenhang zu verändern. Die Bildsprache von Herde und Weide sowie die Spannung zwischen Gericht und Wiederherstellung bleiben erhalten.
