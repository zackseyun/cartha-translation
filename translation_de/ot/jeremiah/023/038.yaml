  text: וְ/אִם מַשָּׂ֣א יְהוָה֮ תֹּאמֵרוּ֒ לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֧עַן אֲמָרְ/כֶ֛ם אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה מַשָּׂ֣א יְהוָ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תֹאמְר֖וּ מַשָּׂ֥א יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
translation:
  language: de
  text: 'Wenn ihr aber »Last Jahwes«[a] sagt, darum sagt Jahwe: Weil ihr das gesagt habt: »Last Jahwes«, obwohl ich zu euch gesandt und gesagt habe: »Ihr sollt nicht ›Last Jahwes‹ sagen«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ausspruch Jahwes«. Das hebräische Wort kann sowohl eine »Last« als auch einen prophetischen Ausspruch bezeichnen. »Last« bewahrt hier das wiederholte Wortspiel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn ihr aber
  rationale: Gibt sowohl die Bedingung als auch den kontrastierenden Anschluss an das vorausgehende Verbot natürlich wieder.
- source_word: מַשָּׂא
  choice: Last
  rationale: Das Wort kann eine Last oder einen prophetischen Ausspruch bezeichnen. »Last« bewahrt die für den Zusammenhang entscheidende Wortwiederholung und das Wortspiel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen wieder.
- source_word: לָכֵן כֹּה אָמַר יְהוָה
  choice: dann spricht Jahwe so
  rationale: Verbindet die Folgerung mit der prophetischen Botenformel in würdigem, verständlichem Deutsch.
- source_word: אֲמָרְכֶם אֶת הַדָּבָר הַזֶּה
  choice: ihr dieses Wort gebraucht habt
  rationale: Bezieht sich auf die konkrete, unmittelbar zitierte Wendung; »gebraucht habt« klingt im Deutschen natürlicher als die wörtliche Wiederholung »dieses Wort gesagt habt«.
- source_word: וָאֶשְׁלַח אֲלֵיכֶם לֵאמֹר
  choice: obwohl ich euch ausrichten ließ
  rationale: 'Der Zusammenhang legt einen konzessiven Sinn nahe: Sie gebrauchten die Formel trotz Gottes vorausgegangener Warnung. Die Sendung von Boten bleibt durch »ausrichten ließ« erkennbar.'
- source_word: לֹא תֹאמְרוּ
  choice: Ihr sollt nicht … sagen
  rationale: Gibt das direkte göttliche Verbot klar und mit angemessener Verbindlichkeit wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Mehrdeutigkeit und Wortspiel von מַשָּׂא
  choice: Last
  alternative: Ausspruch; Orakel
  rationale: »Last« erhält die rhetorische Wiederholung und mögliche Ironie des Abschnitts; die prophetische Fachbedeutung wird in der Fußnote dokumentiert, ohne die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die verschachtelte Begründungsstruktur und der offene Satzschluss des Verses bleiben erhalten, da der Gedanke im folgenden Vers weitergeführt wird.
