  text: הֲ/ל֨וֹא כֹ֧ה דְבָרִ֛/י כָּ/אֵ֖שׁ נְאֻם יְהוָ֑ה וּ/כְ/פַטִּ֖ישׁ יְפֹ֥צֵֽץ סָֽלַע־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
translation:
  language: de
  text: Ist mein Wort nicht wie Feuer – Spruch Jahwes[a] – und wie ein Hammer, der einen Felsen zerschmettert?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „so spricht Jahwe“. Die hebräische prophetische Formel lautet wörtlicher „Spruch Jahwes“ beziehungsweise „Ausspruch Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Ist … nicht
  rationale: Bewahrt die rhetorische Frage, die eine bejahende Antwort erwartet.
- source_word: כֹה דְבָרִי כָאֵשׁ
  choice: mein Wort … wie Feuer
  rationale: Das vergleichende Verhältnis wird in natürlichem Deutsch direkt mit „wie“ wiedergegeben; כֹה wird dabei idiomatisch in die Vergleichskonstruktion aufgenommen, statt mit einem schwerfälligen „so“ eigens abgebildet zu werden.
- source_word: דְבָרִי
  choice: mein Wort
  rationale: Der Singular entspricht der hebräischen Form und fasst Jahwes Äußerung als wirksame Einheit.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: „Spruch“ bewahrt den nominalen Charakter der prophetischen Formel; „Jahwe“ gibt den Gottesnamen wieder.
- source_word: וּכְפַטִּישׁ
  choice: und wie ein Hammer
  rationale: Gibt Konjunktion, Vergleich und Werkzeugbild klar wieder, ohne die Art des Hammers unnötig zu präzisieren.
- source_word: יְפֹצֵץ
  choice: zerschmettert
  rationale: Vermittelt das gewaltsame Zerbrechen beziehungsweise Zersprengen mit der im Bild geforderten Stärke.
- source_word: סָלַע
  choice: einen Felsen
  rationale: Der konkrete Singular wahrt das massive Felsbild und ergibt mit dem transitiven Verb natürliches Deutsch.
theological_decisions:
- issue: Wiedergabe der prophetischen Formel נְאֻם יְהוָה
  choice: Spruch Jahwes
  alternative: so spricht Jahwe
  rationale: Die gewählte Form hält an der nominalen Gestalt des Hebräischen fest, während die Alternative denselben Sinn idiomatischer als Redeeinleitung ausdrückt. Der persönliche Gottesname bleibt in beiden Fällen erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Frage und die beiden kraftvollen Bilder bleiben erhalten; Gedankenstriche markieren die eingeschobene prophetische Formel.
