  terminology: „Jahwe“ gibt das Tetragramm JHWH konsistent wieder. „Spruch Jahwes“ ist für נְאֻם יְהוָה als nominale prophetische Formel fachlich vertretbar und im deutschen Bibelregister verständlich. „Zerschmettert“ trifft die Intensität von יְפֹצֵץ ohne unnötige Überdeutung.
