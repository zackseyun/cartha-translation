  source_fidelity: Die Übersetzung gibt die rhetorische Frage הֲלוֹא, das einheitlich gedachte „mein Wort“, die beiden Vergleiche („wie Feuer“, „wie ein Hammer“) sowie das gewaltsame Zerschmettern eines Felsens zuverlässig wieder. Die Stellung der Formel נְאֻם יְהוָה zwischen den beiden Bildhälften ist bewahrt. Das unbestimmte „einen Felsen“ gibt den artikellosen hebräischen Singular angemessen als generisches Objekt wieder.
