  naturalness: Der Text ist überwiegend modernes, würdevolles Standarddeutsch. „Darum spricht … so über“ wirkt jedoch unnötig nachgebildet; „Darum sagt … über“ ist klarer. Die Formulierung „ich werde mich um euch kümmern – wegen …“ ist trotz Gedankenstrich idiomatisch und semantisch zu missverständlich.
  terminology: „Jahwe“, „der Gott Israels“, „Hirten“, „Herde“ und „Bosheit eurer Taten“ sind angemessen. Die metaphorischen „Hirten“ werden zu Recht nicht interpretierend durch „Führer“ oder Ähnliches ersetzt.
