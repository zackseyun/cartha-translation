reference: Jeremiah 23:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
translation:
  language: de
  text: 'Darum sagt Jahwe, der Gott Israels, Folgendes über[a] die Hirten, die mein Volk hüten: Ihr habt meine Herde zerstreut und sie vertrieben, und ihr habt euch nicht um sie gekümmert. Seht, ich werde euch wegen der Bosheit eurer Taten[b] zur Rechenschaft ziehen, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen die Hirten“. Die hebräische Präposition kann eine gegen sie gerichtete Botschaft einleiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen steht in beiden Aussagen dasselbe Verb: „Ihr habt euch nicht um sie gekümmert … ich werde euch zur Rechenschaft ziehen.“ Die Wiederholung stellt der unterlassenen Fürsorge Gottes strafendes Eingreifen gegenüber.'
    reason: wordplay
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt das Tetragramm als Namen, statt es durch einen Titel zu ersetzen.
- source_word: עַל
  choice: über
  rationale: Die Präposition kann hier eine Aussage über die Hirten oder eine gegen sie gerichtete Botschaft einleiten. „Über“ erhält die allgemeinere Bedeutung; der feindliche Gehalt wird durch die folgende Gerichtsdrohung deutlich.
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  choice: die Hirten, die mein Volk hüten
  rationale: Bewahrt die Wiederholung des hebräischen Wortstamms und das für den Zusammenhang zentrale Hirtenbild, ohne es vorschnell als „Herrscher“ oder „Führer“ auszudeuten.
- source_word: הֲפִצֹתֶם אֶת צֹאנִי
  choice: ihr habt meine Herde zerstreut
  rationale: Gibt die verursachende Verbform und das Bild einer auseinandergetriebenen Herde klar und idiomatisch wieder.
- source_word: וַתַּדִּחוּם
  choice: und sie vertrieben
  rationale: Drückt aus, dass die Hirten die Herde aktiv fortgetrieben haben.
- source_word: וְלֹא פְקַדְתֶּם אֹתָם
  choice: und ihr habt euch nicht um sie gekümmert
  rationale: Erfasst im Hirtenkontext die Bedeutung von פקד als fürsorgliches Sichkümmern und ermöglicht zugleich, die Wiederholung desselben Verbs in der Gerichtsaussage hörbar zu machen.
- source_word: הִנְנִי
  choice: Seht, nun werde ich
  rationale: „Seht“ wahrt den feierlichen prophetischen Hinweischarakter; „nun werde ich“ vermittelt die bevorstehende göttliche Handlung in natürlichem Deutsch.
- source_word: פֹקֵד עֲלֵיכֶם
  choice: mich um euch kümmern
  rationale: 'Die bewusst doppeldeutige Formulierung bewahrt die Wiederholung von פקד: Weil die Hirten sich nicht um die Herde kümmerten, wird Jahwe sich nun im Gericht um sie „kümmern“.'
- source_word: אֶת רֹעַ מַעַלְלֵיכֶם
  choice: wegen der Bosheit eurer Taten
  rationale: Bewahrt die hebräische Verbindung von moralischer Bosheit und den konkreten Taten der Hirten und macht den strafenden Sinn des vorhergehenden Verbs eindeutig.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine knappe, würdevolle und im Deutschen geläufige Wiedergabe der prophetischen Botenformel.
theological_decisions:
- issue: Wiederholung und Bedeutungswechsel von פקד
  choice: In beiden Teilsätzen „sich um jemanden kümmern“ verwenden und den gerichtlichen Sinn im zweiten durch „wegen der Bosheit eurer Taten“ verdeutlichen.
  alternative: Im ersten Teilsatz „sich kümmern“, im zweiten ausdrücklich „bestrafen“ oder „heimsuchen“.
  rationale: 'Der hebräische Text erzeugt eine gezielte Umkehrung mit demselben Verb: Die Hirten haben sich nicht um die Herde gekümmert, daher wird Gott sich nun strafend um sie kümmern. Die einheitliche Wiedergabe erhält diese Spannung, ohne den Gerichtssinn zu verschleiern.'
- issue: Identität der „Hirten“
  choice: Das Hirtenbild wörtlich beibehalten.
  alternative: Deutend „Führer“, „Herrscher“ oder „Leiter“ schreiben.
  rationale: Der unmittelbare Zusammenhang arbeitet ausdrücklich mit Herde, Zerstreuung und Hirtendienst. Die Metapher selbst soll bestimmen, welche verantwortlichen Personen im Kontext gemeint sind.
- issue: Wiedergabe des Gottesnamens
  choice: יְהוָה als „Jahwe“ wiedergeben.
  alternative: Den Namen durch „der HERR“ ersetzen.
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. Seine Wiedergabe als „Jahwe“ wahrt diese textliche Unterscheidung, ohne eine zusätzliche konfessionelle Auslegung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Hirtenbild und die rhetorische Wiederholung bleiben erhalten. „Seht“ trägt den feierlichen Ton des prophetischen הִנְנִי, ohne die altertümlichere Form „Siehe“ zu verwenden.
