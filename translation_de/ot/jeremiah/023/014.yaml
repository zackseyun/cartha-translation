id: JER.23.14
reference: Jeremiah 23:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
translation:
  language: de
  text: 'Und unter den Propheten Jerusalems habe ich etwas Entsetzliches gesehen: Sie begehen Ehebruch und leben in der Lüge; sie bestärken Übeltäter[a], sodass keiner von seiner Bosheit umkehrt.[b] Sie alle sind für mich wie Sodom und Jerusalems Bewohner wie Gomorra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie stärken die Hände von Übeltätern“.'
    reason: Hebräisches Idiom und Bildsprache werden dokumentiert.
  - marker: b
    text: „Umkehrt“ kann hier auch „Buße tut“ bedeuten; gemeint ist die Abkehr vom Bösen.
    reason: Die mögliche Bußbedeutung von שוב soll erhalten bleiben, ohne sie im Haupttext ausdrücklich festzulegen.
lexical_decisions:
- source_word: וּבִנְבִאֵי יְרוּשָׁלִַם
  choice: Und unter den Propheten Jerusalems
  rationale: ב bezeichnet hier den Bereich bzw. die Gruppe; im Deutschen gibt „unter“ den Sinn idiomatisch wieder. Das einleitende ו wird als „Und“ beibehalten.
- source_word: רָאִיתִי שַׁעֲרוּרָה
  choice: habe ich etwas Entsetzliches gesehen
  rationale: Das Perfekt bezeichnet eine Wahrnehmung mit gegenwärtiger Relevanz. שַׁעֲרוּרָה benennt einen moralisch empörenden, erschreckenden Sachverhalt.
- source_word: נָאוֹף
  choice: Sie begehen Ehebruch
  rationale: Die verbale Form bezeichnet das Tun, nicht lediglich den abstrakten Begriff „Ehebruch“.
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  choice: und leben in der Lüge
  rationale: הלך bezeichnet in dieser Verbindung die Lebensführung. „Leben in der Lüge“ gibt die hebräische Weg-Metaphorik natürlich wieder, ohne den Singular שׁקר aufzulösen.
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  choice: sie bestärken Übeltäter
  rationale: Die Wendung „die Hände stärken“ bedeutet, andere zu ermutigen oder in ihrem Handeln zu unterstützen. „Bestärken“ vermittelt den idiomatischen Sinn in natürlichem Deutsch; das Bild wird in einer Fußnote dokumentiert.
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  choice: sodass keiner von seiner Bosheit umkehrt
  rationale: לבלתי führt hier eine negative Folge ein. אִישׁ steht distributiv und wird mit „keiner“ wiedergegeben. „Umkehrt“ bewahrt sowohl das Bild der Richtungsänderung als auch den möglichen Bußsinn von שוב.
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  choice: Sie alle sind für mich wie Sodom
  rationale: Die Formulierung bewahrt לִי als göttliche Bewertung und gibt den resultierenden gegenwärtigen Zustand im Deutschen natürlich wieder.
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  choice: und Jerusalems Bewohner wie Gomorra
  rationale: Das feminine Suffix bezieht sich auf Jerusalem. Die ausdrückliche Wiederholung des Stadtnamens verhindert im Deutschen, dass ein Pronomen fälschlich auf Sodom bezogen wird.
theological_decisions:
- issue: Bußbedeutung von שוב
  choice: umkehrt
  alternative: Buße tut
  rationale: „Umkehrt“ erhält die konkrete Wortbedeutung und lässt zugleich den im Zusammenhang naheliegenden Sinn der Abkehr vom Bösen erkennen, ohne ihn durch einen stärker theologischen Fachausdruck festzulegen.
- issue: Distributiver Singular אִישׁ
  choice: keiner von seiner Bosheit
  alternative: niemand von seiner Bosheit
  rationale: „Keiner“ gibt die distributive Aussage prägnant wieder. Das Possessivpronomen im Singular entspricht der individuellen Verantwortlichkeit des hebräischen Ausdrucks.
- issue: Vergleich Jerusalems mit Sodom und Gomorra
  choice: Sie alle sind für mich wie Sodom und Jerusalems Bewohner wie Gomorra
  alternative: Sie alle sind mir zu Sodom geworden und ihre Bewohner zu Gomorra
  rationale: Der Text formuliert einen Vergleich aus Gottes Sicht. Die Wiedergabe vermeidet, aus dem Vergleich eine ontologische Gleichsetzung zu machen, und klärt zugleich den Bezug des Suffixes auf Jerusalem.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anklage bleibt knapp und eindringlich. Idiomatische Wendungen werden natürlich wiedergegeben, während wichtige hebräische Bild- und Bedeutungsnuancen in den Fußnoten erhalten bleiben.
