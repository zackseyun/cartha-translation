id: JER.23.32
reference: Jeremiah 23:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
translation:
  language: de
  text: Siehe, ich bin gegen die, die Lügenträume[a] weissagen – Ausspruch Jahwes –, die sie erzählen und mein Volk durch ihre Lügen und ihre Leichtfertigkeit[b] in die Irre führen. Ich aber habe sie weder gesandt noch ihnen etwas befohlen. Sie nützen diesem Volk überhaupt nichts – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Träume der Lüge“; möglich ist ebenso: „falsche Träume“. Das Hebräische verwendet das Substantiv „Lüge/Falschheit“ attributiv.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann auch „Vermessenheit“, „Unbesonnenheit“ oder „Leichtsinn“ bezeichnen. Gemeint ist unverantwortliches, anmaßendes Verhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי עַל
  choice: Siehe, ich bin gegen
  rationale: Die feste Wendung kündigt feierlich Jahwes Eingreifen gegen die Genannten an. „Siehe“ bewahrt den prophetischen Signalcharakter, „gegen“ den feindlichen Gerichtssinn von עַל.
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  choice: die, die Lügenträume weissagen
  rationale: Die partizipiale Form bezeichnet Menschen durch ihr Tun. „Lügenträume“ gibt die attributive Verwendung des Substantivs שֶׁקֶר knapp wieder und lässt sowohl unwahre als auch irreführende Träume anklingen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ bildet die charakteristische prophetische Formel deutlich ab; „Jahwe“ gibt den Eigennamen יְהוָה wieder.
- source_word: וַיְסַפְּרוּם
  choice: und sie erzählen
  rationale: 'Das Objektsuffix verweist auf die Träume zurück. Im Deutschen kann das Pronomen „sie“ sowohl Subjekt als auch Objekt sein; aus dem Zusammenhang ergibt sich: Die Propheten erzählen die Träume.'
- source_word: וַיַּתְעוּ אֶת עַמִּי
  choice: und mein Volk … in die Irre führen
  rationale: Der Hifil von תעה bezeichnet das Veranlassen zum Irren oder Abirren. „In die Irre führen“ ist natürlich und wahrt den Gedanken aktiver Fehlleitung.
- source_word: בְּשִׁקְרֵיהֶם
  choice: durch ihre Lügen
  rationale: Die Präposition בְּ ist instrumental verstanden; der Plural wird direkt als „Lügen“ wiedergegeben.
- source_word: וּבְפַחֲזוּתָם
  choice: und ihre Leichtfertigkeit
  rationale: Das seltene פחזות bezeichnet unverantwortliches, unbesonnenes oder anmaßendes Verhalten. „Leichtfertigkeit“ passt zum verantwortungslosen Weitergeben angeblicher Offenbarungen, ohne die schwierige Nuance zu stark festzulegen.
- source_word: וְאָנֹכִי לֹא שְׁלַחְתִּים וְלֹא צִוִּיתִים
  choice: Ich aber habe sie weder gesandt noch ihnen einen Auftrag gegeben
  rationale: Das betonte אָנֹכִי wird durch „Ich aber“ hervorgehoben. צוה meint hier das Erteilen eines göttlichen Auftrags; die Formulierung ist im Deutschen idiomatischer als „sie befohlen“.
- source_word: וְהוֹעֵיל לֹא יוֹעִילוּ
  choice: Sie nützen … überhaupt nichts
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Verneinung. „Überhaupt nichts“ gibt diese Nachdrücklichkeit natürlich wieder.
- source_word: לָעָם הַזֶּה
  choice: diesem Volk
  rationale: Die Wendung hält die prophetische Bezeichnung und ihren leicht distanzierenden Ton fest.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Art der fehlenden göttlichen Beauftragung
  choice: ihnen einen Auftrag gegeben
  alternative: ihnen befohlen
  rationale: Im Zusammenhang mit Propheten bezeichnet צוה ihre göttliche Beauftragung. Die Übersetzung wahrt, dass weder Sendung noch Auftrag von Jahwe ausgingen, ohne daraus eine weitergehende Amtslehre abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Ton. Die Satzstruktur bleibt quellennah, wird aber durch Gedankenstriche und einen neuen Satz lesbar gegliedert. „Weissagen“ ist als geläufiger biblischer Fachausdruck beibehalten; schwierige lexikalische Mehrdeutigkeiten werden in Fußnoten offengelegt.
