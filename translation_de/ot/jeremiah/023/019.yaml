    rationale: Das hebräische יָחוּל kann die wirbelnde Bewegung und/oder das gewaltsame Niedergehen des Unwetters bezeichnen. „Niederfahren“ gibt das Auftreffen natürlich wieder; eine Fußnote kann die Nuance des Wirbelns als Alternative bewahren.
  - severity: low
