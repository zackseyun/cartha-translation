source:
  edition: WLC
  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה וְ/סַ֖עַר מִתְחוֹלֵ֑ל עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/019.yaml
  text: Look[a], the storm of Yahweh has gone out in wrath, a whirling tempest[c][b]; it will whirl down on the head of the wicked.
translation:
  language: de
  text: 'Siehe, Jahwes[a] Sturm ist im Zorn losgebrochen[b]: ein wirbelnder Sturm; auf den Kopf der Frevler wird er niederfahren.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „des HERRN“. Der hebräische Text nennt den Gottesnamen יהוה (JHWH).'
    reason: textual_or_naming_convention
  - marker: b
    text: Das hebräische Perfekt stellt das kommende Gericht als so gewiss dar, dass es bereits losgebrochen ist.
    reason: aspectual_ambiguity
  - marker: c
    text: 'Oder: „wird er auf den Kopf der Frevler herabwirbeln“. Das Verb kann neben dem gewaltsamen Niedergehen auch die Wirbelbewegung des Sturms hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufforderung eröffnet die Ankündigung mit eindringlicher Unmittelbarkeit. „Siehe“ ist im Deutschen gehoben, aber weiterhin verständlich und für prophetische Rede angemessen.
- source_word: סַעֲרַת יְהוָה
  choice: Jahwes Sturm
  rationale: סַעֲרָה bezeichnet einen Sturm oder ein Unwetter. Die knappe Genitivverbindung bewahrt die Zugehörigkeit zu beziehungsweise den Ausgang von Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Standarddeutsch übliche Form „Jahwe“ gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: חֵמָה
  choice: im Zorn
  rationale: Das Substantiv bezeichnet heftigen Zorn beziehungsweise Grimm. Die adverbiale Einbindung ergibt einen natürlichen deutschen Satz, ohne die Gerichtsschärfe abzuschwächen.
- source_word: יָצְאָה
  choice: ist losgebrochen
  rationale: Das Perfekt stellt das Gerichtsgeschehen als bereits in Gang gesetzt dar. „Losgebrochen“ passt zum Sturm bildlich besser als das wörtlichere, im Deutschen aber schwerfällige „ist ausgegangen“.
- source_word: וְסַעַר מִתְחוֹלֵל
  choice: ein wirbelnder Sturm
  rationale: Die Wendung beschreibt denselben Sturm weiter und hebt seine heftige Drehbewegung hervor. Eine Apposition vermeidet im Deutschen eine unnatürliche Koordination.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: auf den Kopf der Frevler
  rationale: Der kollektive Singular „Kopf“ und der substantivierte Plural „Frevler“ werden bewahrt. „Frevler“ bezeichnet Menschen, die schuldig und gottlos handeln, ohne eine bestimmte Gruppe einzutragen.
- source_word: יָחוּל
  choice: wird er niederwirbeln
  rationale: Die Wiedergabe führt die wirbelnde Sturmbewegung des vorangehenden Partizips fort und bringt zugleich das Herabkommen auf die Frevler zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm als Gottesnamen. „Jahwe“ bewahrt im Deutschen den Eigennamen und ersetzt ihn nicht stillschweigend durch einen Herrschaftstitel.
- issue: Zeitwert des prophetischen Perfekts יָצְאָה
  choice: ist losgebrochen
  alternative: wird losbrechen
  rationale: Die Vergangenheitsform bewahrt die prophetische Darstellung eines künftigen, sicheren Gerichts als bereits in Bewegung gesetzt, statt diese Spannung in ein gewöhnliches Futur aufzulösen.
- issue: Bedeutung des Schlussverbs יָחוּל
  choice: wird er niederwirbeln
  alternative: wird er niederbrechen
  rationale: Der Zusammenhang mit מִתְחוֹלֵל legt die fortgesetzte Wirbelbewegung nahe; zugleich kann das Verb die Wucht des Auftreffens betonen. Die Hauptfassung erhält die Wortverbindung, die Fußnote nennt die andere mögliche Nuance.
translation_notes:
  register: Moderne, würdige prophetische Sprache. „Siehe“ wahrt die eindringliche Eröffnungsformel; „losgebrochen“ und „niederwirbeln“ halten das Sturmwortfeld lebendig. Die Syntax bleibt knapp und bildstark, ohne die Ambiguität des prophetischen Perfekts oder des Schlussverbs einzuebnen.
