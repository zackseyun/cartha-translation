  text: הַ/חֹשְׁבִ֗ים לְ/הַשְׁכִּ֤יחַ אֶת עַמִּ/י֙ שְׁמִ֔/י בַּ/חֲל֣וֹמֹתָ֔/ם אֲשֶׁ֥ר יְסַפְּר֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ כַּ/אֲשֶׁ֨ר שָׁכְח֧וּ אֲבוֹתָ֛/ם אֶת שְׁמִ֖/י בַּ/בָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
translation:
  language: de
  text: die beabsichtigen, mein Volk durch ihre Träume[a], die sie einander erzählen, meinen Namen vergessen zu lassen, so wie ihre Väter meinen Namen wegen Baals[b] vergaßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihren Träumen“. Die hebräische Präposition kann das Mittel oder den Bereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für Baal“ oder „durch Baal“. Wahrscheinlich ist gemeint, dass die Hinwendung zu Baal sie meinen Namen vergessen ließ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹשְׁבִים
  choice: die beabsichtigen
  rationale: Das Partizip von חשׁב bezeichnet hier im Zusammenhang mit den falschen Propheten eine bewusste Absicht, nicht bloß einen Gedanken.
- source_word: לְהַשְׁכִּיחַ
  choice: vergessen zu lassen
  rationale: Der Hifil-Infinitiv von שׁכח ist kausativ; die deutsche Fügung „jemanden etwas vergessen lassen“ gibt diese Bedeutung natürlich wieder.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Der ausdrücklich vorhandene Possessivbezug und die bundestheologische Wendung bleiben erhalten.
- source_word: שְׁמִי
  choice: meinen Namen
  rationale: Die wörtliche Wiedergabe bewahrt die Aussage über Gottes offenbarte Identität, ohne sie interpretierend auszuweiten.
- source_word: בַּחֲלֹמוֹתָם
  choice: durch ihre Träume
  rationale: 'Die Präposition ב wird im Satz am ehesten instrumental verstanden: Die erzählten Träume dienen als Mittel des beabsichtigten Vergessenlassens. Die mögliche lokale beziehungsweise sphärische Deutung wird in der Fußnote genannt.'
- source_word: אֲשֶׁר יְסַפְּרוּ
  choice: die sie erzählen
  rationale: ספר im Piel bedeutet „erzählen“ oder „berichten“; „erzählen“ passt zum mündlichen Weitergeben der Träume.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: einander
  rationale: Die distributive Wendung wird in natürlichem modernem Deutsch wiedergegeben, ohne den Sinn des wechselseitigen Erzählens zu verändern.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Wendung leitet ausdrücklich den Vergleich mit dem Verhalten der früheren Generation ein.
- source_word: שָׁכְחוּ אֲבוֹתָם
  choice: ihre Väter … vergaßen
  rationale: „Väter“ gibt אבות wörtlich wieder und erhält den generationenübergreifenden Vergleich.
- source_word: בַּבָּעַל
  choice: wegen des Baal
  rationale: 'Die Präposition bezeichnet wahrscheinlich Ursache oder Zusammenhang: Die Hinwendung zu Baal führte dazu, dass sie den Namen des HERRN vergaßen. Die grammatisch möglichen Alternativen bleiben in der Fußnote sichtbar.'
theological_decisions:
- issue: Bundestheologische Rede vom „Namen“ Gottes
  choice: Beide Vorkommen werden wörtlich mit „meinen Namen“ wiedergegeben.
  alternative: „mein Ansehen“ oder „wer ich bin“
  rationale: Die wörtliche Form bewahrt die Spannung und theologische Tragweite von Gottes offenbartem Namen, ohne eine bestimmte Auslegung in den Text einzubauen.
- issue: Deutung von בַּבָּעַל
  choice: „wegen des Baal“
  alternative: „für Baal“ oder „durch Baal“
  rationale: Die gewählte Fassung macht den wahrscheinlichen ursächlichen Zusammenhang mit der Baalsverehrung verständlich; die Mehrdeutigkeit der hebräischen Präposition wird durch die Fußnote erhalten.
- issue: Distributive maskuline Wendung אִישׁ לְרֵעֵהוּ
  choice: „einander“
  alternative: „jeder seinem Nächsten“
  rationale: Die Wendung bezeichnet hier die wechselseitige Weitergabe der Träume. „Einander“ ist im Deutschen idiomatisch und legt nicht über den Aussagezweck hinaus fest, ob ausschließlich Männer gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält „durch ihre Träume“ nahe bei „vergessen zu lassen“, lässt aber den Relativsatz natürlich anschließen. Der Vers bleibt entsprechend der hebräischen Syntax ein Relativsatzfragment, das an den Kontext anschließt.
