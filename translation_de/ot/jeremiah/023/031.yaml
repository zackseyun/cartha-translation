  text: הִנְ/נִ֥י עַל הַ/נְּבִיאִ֖ם נְאֻם יְהוָ֑ה הַ/לֹּקְחִ֣ים לְשׁוֹנָ֔/ם וַֽ/יִּנְאֲמ֖וּ נְאֻֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
translation:
  language: de
  text: 'Siehe, ich bin gegen die Propheten – Ausspruch Jahwes –, die ihre Zunge gebrauchen und sagen: »Ausspruch!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die ihre Zunge nehmen und sagen: ‚Ausspruch!‘“ Das Hebräische ist knapp und wahrscheinlich ironisch: Die Propheten bringen aus ihrem eigenen Mund eine Rede hervor, die den Klang eines autoritativen Ausspruchs haben soll. Das Verb und das abschließende Wort gehören zur selben Wortfamilie.'
    reason: Lexikalische und syntaktische Alternative; Erklärung der knappen, wahrscheinlich ironischen Wortwiederholung zwischen וַיִּנְאֲמוּ und נְאֻם, ohne den im Schlusswort nicht vorhandenen Gottesnamen zu ergänzen.
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe, ich bin
  rationale: Die feierliche, nachdrückliche Einleitungsformel wird bewahrt; „Siehe“ entspricht dem prophetischen Ton und ist im Deutschen weiterhin verständlich.
- source_word: עַל
  choice: gegen
  rationale: In der Wendung „ich bin gegen“ bezeichnet die Präposition göttlichen Widerstand und angekündigtes Gericht.
- source_word: הַנְּבִיאִם
  choice: die Propheten
  rationale: Der Vers selbst nennt sie lediglich „die Propheten“; dass sie als falsche Propheten verurteilt werden, ergibt sich aus dem Zusammenhang.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ bildet die feste prophetische Formel knapp ab und ermöglicht zugleich, das Wortspiel mit dem letzten נְאֻם sichtbar zu halten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt den im hebräischen Text ausdrücklich stehenden Eigennamen.
- source_word: הַלֹּקְחִים
  choice: die … nehmen
  rationale: Die konkrete Bedeutung „nehmen“ wird trotz der ungewöhnlichen deutschen Wendung bewahrt, weil sie das eigenmächtige Ergreifen und Produzieren ihrer Rede anschaulich macht.
- source_word: לְשׁוֹנָם
  choice: ihre eigene Zunge
  rationale: „Zunge“ gibt das Körperbild unmittelbar wieder; „eigene“ verdeutlicht den im Kontext liegenden Gegensatz zu einem wirklich von Gott gegebenen Wort, ohne die Aussage als bloßes „Reden“ aufzulösen.
- source_word: וַיִּנְאֲמוּ
  choice: und verkünden
  rationale: Das seltene Verb gehört zur selben Wurzel wie נְאֻם. „Verkünden“ klingt im Deutschen autoritativ und lässt zusammen mit „Ausspruch“ die Nachahmung prophetischer Sprache erkennen.
- source_word: נְאֻם
  choice: »Ausspruch!«
  rationale: Das isolierte Substantiv bleibt ebenso abrupt wie im Hebräischen und bringt die vermutlich ironische Nachahmung einer Offenbarungsformel zum Ausdruck.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Kennzeichnung der verurteilten Propheten
  choice: die Propheten
  alternative: die falschen Propheten
  rationale: Obwohl der Zusammenhang sie als falsche Propheten entlarvt, steht das Adjektiv „falsch“ nicht in diesem Vers; die Übersetzung fügt diese Deutung daher nicht in den Haupttext ein.
- issue: Deutung des abschließenden נְאֻם
  choice: als abruptes, ironisch wirkendes Zitat »Ausspruch!«
  alternative: als vollständige Formel »Ausspruch Jahwes« beziehungsweise »spricht Jahwe«
  rationale: Im überlieferten hebräischen Text steht am Ende nur נְאֻם. Die knappe Wiedergabe wahrt diese formale Auffälligkeit und legt die mögliche Ironie nicht eindeutiger fest, als der Ausgangstext es tut.
translation_notes:
  register: Feierlich-prophetischer, aber gegenwärtig verständlicher Stil. Die absichtlich ungewohnte Wendung „ihre eigene Zunge nehmen“ hält das konkrete hebräische Bild fest; Gedankenstriche markieren die eingeschobene Offenbarungsformel. Das abschließende „Ausspruch!“ bewahrt Knappheit, Wortspiel und mögliche Ironie.
