id: JER.23.37
reference: Jeremiah 23:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֥ה תֹאמַ֖ר אֶל הַ/נָּבִ֑יא מֶה עָנָ֣/ךְ יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/037.yaml
  text: 'Thus you shall say to the prophet: ‘What has Yahweh answered you[a], and what has Yahweh spoken?’'
translation:
  language: de
  text: 'So sollst du zu dem Propheten sagen: »Was hat Jahwe dir[a] geantwortet, und was hat Jahwe gesprochen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Suffix für »dir« ist der Form nach feminin Singular; die vorausgehende Anrede und »der Prophet« stehen dagegen im Maskulinum.
    reason: Grammatische Unebenheit im hebräischen Text, die im deutschen Pronomen nicht sichtbar ist.
lexical_decisions:
- source_word: כֹּה
  choice: So
  rationale: Leitet eine vorgeschriebene Redeformel ein; »So« ist im Deutschen knapp, natürlich und dem hebräischen Ausdruck angemessen.
- source_word: תֹאמַר
  choice: sollst du ... sagen
  rationale: Das Imperfekt hat hier anweisende Bedeutung. »Sollst du sagen« gibt diesen direktiven Sinn idiomatisch wieder.
- source_word: אֶל הַנָּבִיא
  choice: zu dem Propheten
  rationale: Der hebräische Singular mit bestimmtem Artikel wird beibehalten.
- source_word: מֶה עָנָךְ יְהוָה
  choice: Was hat Jahwe dir geantwortet
  rationale: מֶה eröffnet eine Sachfrage, ענה bedeutet hier »antworten«, und die Perfektform wird im Deutschen natürlich mit dem Perfekt wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Namen statt ihn durch einen Titel zu ersetzen.
- source_word: וּמַה דִּבֶּר יְהוָה
  choice: und was hat Jahwe gesprochen
  rationale: »Gesprochen« bildet דבר sachnah ab und bewahrt die Unterscheidung zum vorangehenden »geantwortet«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Gottesnamen selbst. »Jahwe« bewahrt ihn als Eigennamen, ohne ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Verhältnis von »antworten« und »sprechen«
  choice: Beide Verben unterscheidbar wiedergeben
  alternative: Beide Teilsätze mit »sagen« formulieren
  rationale: Die Übersetzung wahrt die hebräische Spannung zwischen ענה (antworten) und דבר (sprechen), ohne den möglichen Bedeutungsunterschied einzuebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und knapp; die ungewöhnliche grammatische Spannung des Hebräischen wird nicht stillschweigend aufgelöst, sondern in einer Fußnote kenntlich gemacht.
