id: JER.23.8
reference: Jeremiah 23:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֣ר הֶעֱלָה֩ וַ/אֲשֶׁ֨ר הֵבִ֜יא אֶת זֶ֨רַע בֵּ֤ית יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹנָ/ה וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדַּחְתִּ֖י/ם שָׁ֑ם וְ/יָשְׁב֖וּ עַל אַדְמָתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
translation:
  language: de
  text: 'sondern: »So wahr Jahwe[a] lebt, der die Nachkommen des Hauses Israel aus dem Land des Nordens und aus all den Ländern, in die ich sie vertrieben hatte, heraufgeführt und heimgebracht hat!« Und sie werden auf ihrem eigenen Boden[b] wohnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionell wird der Gottesname hier mit »der HERR« wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: 'Auch möglich: »auf ihrem eigenen Land«. Das hebräische Wort bezeichnet besonders den Erdboden oder Grund.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: sondern
  rationale: Die Wendung ersetzt im Zusammenhang die frühere Schwurformel durch eine neue; »sondern« drückt diesen korrigierenden Gegensatz im Deutschen knapp und natürlich aus.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies ist die geläufige deutsche Wiedergabe der hebräischen Schwurformel und bewahrt ihren feierlichen Charakter.
- source_word: הֶעֱלָה וַאֲשֶׁר הֵבִיא
  choice: heraufgeführt und heimgebracht hat
  rationale: 'Die zwei Verben werden unterschieden: הֶעֱלָה greift die Exodus- und Rückkehrsprache des Heraufführens auf, während הֵבִיא das Hinein- beziehungsweise Zurückbringen in die Heimat bezeichnet. »heimgebracht« macht im Deutschen das Ziel verständlich, ohne die beiden Vorgänge zusammenzuziehen.'
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  choice: die Nachkommen des Hauses Israel
  rationale: זֶרַע bezeichnet hier kollektiv die Nachkommenschaft. »Nachkommen« ist gegenwärtiges, klares Deutsch; »Haus Israel« bleibt als nationale und bundestheologische Bezeichnung erhalten.
- source_word: מֵאֶרֶץ צָפוֹנָה
  choice: aus dem Land des Nordens
  rationale: Die formnahe Wiedergabe erhält das in Jeremia wichtige geografische Motiv des Nordens.
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: und aus all den Ländern
  rationale: Der Plural entspricht dem hebräischen Text und bewahrt das Motiv der Zerstreuung über mehrere Länder.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  choice: in die ich sie vertrieben hatte
  rationale: Die Zielrichtung wird im Deutschen idiomatisch mit »in die« ausgedrückt. Das Plusquamperfekt kennzeichnet die Vertreibung als der Sammlung vorausgehend; der Wechsel zur ersten Person bleibt erhalten.
- source_word: וְיָשְׁבוּ
  choice: Und sie werden … wohnen
  rationale: Die Form bezeichnet hier die künftige Folge der Rückführung. »wohnen« passt zum Motiv dauerhafter Wiederansiedlung.
- source_word: עַל אַדְמָתָם
  choice: auf ihrem eigenen Boden
  rationale: אֲדָמָה meint konkret Boden oder Grund und unterscheidet sich von אֶרֶץ, den zuvor genannten Ländern. »eigenen« verdeutlicht idiomatisch das Possessivsuffix, ohne einen zusätzlichen Besitzanspruch auszudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. »Jahwe« gibt ihn als Namen wieder; die traditionelle Ersetzung durch den Titel »der HERR« wird in einer Fußnote genannt.
- issue: Rückführung als Herausführung und Heimkehr
  choice: die beiden Verben als »heraufgeführt und heimgebracht« unterscheiden
  alternative: beide Verben mit einer allgemeinen Form wie »zurückgebracht« zusammenfassen
  rationale: Die Unterscheidung bewahrt die Spannung zwischen Befreiung aus der Zerstreuung und Rückkehr in die Heimat sowie den Anklang an den Exodus.
- issue: Personwechsel innerhalb der Gottesrede
  choice: »der … hat« und anschließend »in die ich sie vertrieben hatte«
  alternative: den gesamten Relativsatz zur dritten Person angleichen
  rationale: Der hebräische Text wechselt unvermittelt von der dritten Person in der Schwurformel zur ersten Person. Diese markante Spannung wird nicht stillschweigend geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Schwurformel bleibt feierlich, während »Nachkommen«, »heimgebracht« und »wohnen« allgemein verständlich sind. Der ungewöhnliche Wechsel von der dritten zur ersten Person wird quellennah bewahrt.
