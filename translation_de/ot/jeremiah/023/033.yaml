  text: וְ/כִי יִשְׁאָלְ/ךָ֩ הָ/עָ֨ם הַ/זֶּ֜ה אֽוֹ הַ/נָּבִ֤יא אֽוֹ כֹהֵן֙ לֵ/אמֹ֔ר מַה מַשָּׂ֖א יְהוָ֑ה וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת מַה מַשָּׂ֔א וְ/נָטַשְׁתִּ֥י אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/033.yaml
  text: And when this people, or a prophet, or a priest asks you, saying, ‘What is the burden of the LORD?’ then you shall say to them, ‘You are the burden, and I will cast you off,’ declares the LORD.
translation:
  language: de
  text: 'Und wenn dich dieses Volk oder ein Prophet oder ein Priester fragt: »Was ist die Last des HERRN?«, dann sollst du ihnen antworten: »Welche Last?[a] Ich werde euch verstoßen«, spricht der HERR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'So der hebräische Text; nach einer textkritischen Korrektur: »Ihr seid die Last, und ich werde euch verstoßen.«'
    reason: Der WLC-Text lautet אֶת־מַה מַשָּׂא, am besten als »Welche Last?« verstanden. Die in der englischen Konsultationsfassung vertretene Fassung »Ihr seid die Last« setzt eine abweichende textkritische Auffassung voraus.
lexical_decisions:
- source_word: מַשָּׂא
  choice: Last
  rationale: Das hebräische Wort kann sowohl eine Last als auch einen prophetischen Ausspruch bezeichnen. »Last« bewahrt hier das beabsichtigte Wortspiel, das in den folgenden Versen entfaltet wird.
- source_word: וְנָטַשְׁתִּי אֶתְכֶם
  choice: Ich werde euch verstoßen
  rationale: נָטַשׁ bezeichnet hier ein entschiedenes Aufgeben oder Verwerfen. »Verstoßen« gibt die Gerichtsaussage natürlich und würdig wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die feste prophetische Botenformel wird in geläufigem biblischem Deutsch wiedergegeben; der Gottesname יהוה erscheint entsprechend der deutschen Übersetzungskonvention als HERR.
theological_decisions:
- issue: Textliche Mehrdeutigkeit in אֶת־מַה מַשָּׂא
  choice: »Was für eine Last? Ich werde euch verstoßen« im Haupttext
  alternative: »Ihr seid die Last, und ich werde euch verstoßen«
  rationale: Der WLC bietet אֶת־מַה מַשָּׂא, wörtlich etwa »Was für eine Last?«. Die Alternative setzt eine abweichende Lesart bzw. Textkorrektur voraus. Daher folgt der Haupttext dem vorgelegten hebräischen Text, während die verbreitete Alternative in einer Fußnote dokumentiert wird.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede bleibt knapp und scharf; »Last« erhält das hebräische Wortspiel zwischen Belastung und prophetischem Ausspruch.
