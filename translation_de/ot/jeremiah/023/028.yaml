  text: הַ/נָּבִ֞יא אֲשֶׁר אִתּ֤/וֹ חֲלוֹם֙ יְסַפֵּ֣ר חֲל֔וֹם וַ/אֲשֶׁ֤ר דְּבָרִ/י֙ אִתּ֔/וֹ יְדַבֵּ֥ר דְּבָרִ֖/י אֱמֶ֑ת מַה לַ/תֶּ֥בֶן אֶת הַ/בָּ֖ר נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
translation:
  language: de
  text: Der Prophet, der einen Traum hat, soll den Traum erzählen. Wer aber mein Wort hat, soll mein Wort wahrheitsgemäß verkünden.[a] Was hat Stroh mit Korn gemeinsam?[b] – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »soll mein Wort in Wahrheit verkünden« oder »soll mein wahres Wort verkünden«. Das Hebräische kann entweder die wahrheitsgemäße Art des Redens oder die Wahrheit des Wortes selbst hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Was ist Stroh im Vergleich zu Korn?«'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר אִתּוֹ חֲלוֹם
  choice: Der Prophet, der einen Traum hat
  rationale: Der bestimmte Artikel wird in seiner allgemeinen, klassenbezogenen Funktion bewahrt. Die hebräische Wendung »bei dem ein Traum ist« wird natürlich als Besitz eines Traumes wiedergegeben, ohne dessen Herkunft vorweg zu beurteilen.
- source_word: יְסַפֵּר חֲלוֹם
  choice: soll den Traum erzählen
  rationale: Das Piel von ספר bedeutet hier »erzählen, berichten«. Die deutsche Form gibt den auffordernden Sinn im Zusammenhang klar wieder.
- source_word: וַאֲשֶׁר דְּבָרִי אִתּוֹ
  choice: Wer aber mein Wort hat
  rationale: »Aber« macht den im Kontext und im abschließenden Bild angelegten Gegensatz zwischen Traum und Wort deutlich. Die elliptische deutsche Form ist natürlich und entspricht der parallelen hebräischen Konstruktion.
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  choice: soll mein Wort wahrheitsgemäß verkünden
  rationale: »Wahrheitsgemäß« versteht אֱמֶת adverbial und bezeichnet die wahrhaftige beziehungsweise zuverlässige Art der Weitergabe. »Verkünden« passt zum prophetischen Reden, ohne dem Verb zusätzliche lehrmäßige Bedeutung aufzuerlegen.
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  choice: Was hat Stroh mit Korn gemeinsam?
  rationale: Die idiomatische Frage drückt die Unvergleichbarkeit aus. תֶּבֶן ist »Stroh«, בָּר allgemein »Korn« beziehungsweise gereinigtes Getreide, nicht ausdrücklich Weizen.
- source_word: נְאֻם יְהוָה
  choice: – Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel wird knapp und formnah wiedergegeben; der Gottesname erscheint als »Jahwe«.
theological_decisions:
- issue: Gegensatz zwischen Traumprophetie und dem Wort Jahwes
  choice: 'Die beiden Aussagen werden als auffordernder Gegensatz formuliert: Der Träumende soll seinen Traum erzählen, wer aber Jahwes Wort hat, soll dieses wahrheitsgemäß verkünden.'
  alternative: Beide Satzteile könnten ohne ausdrückliches »aber« lediglich nebeneinandergestellt werden.
  rationale: Der weitere Zusammenhang und das Bild von Stroh und Korn tragen einen deutlichen Gegensatz. Die Übersetzung macht ihn sichtbar, ohne jeden Traum pauschal als falsch oder jede nähere Deutung ausdrücklich festzuschreiben.
- issue: Bezug von אֱמֶת
  choice: אֱמֶת wird adverbial als »wahrheitsgemäß« auf die Art des Verkündens bezogen.
  alternative: 'Möglich sind auch »in Wahrheit« oder eine adjektivische Zuordnung: »mein wahres Wort«.'
  rationale: Die hebräische Fügung lässt sowohl die Wahrhaftigkeit des Sprechens als auch die Wahrheit des gesprochenen Wortes anklingen. Der Haupttext wählt die natürliche adverbiale Lesart; die Fußnote bewahrt die syntaktische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderungen werden mit »soll« wiedergegeben; »Ausspruch Jahwes« bewahrt den feierlichen prophetischen Ton. Die Fußnotenmarker stehen jeweils direkt an der Textstelle, auf die sie sich beziehen.
