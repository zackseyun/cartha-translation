  text: כֹּ֥ה תֹאמְר֛וּ אִ֥ישׁ עַל רֵעֵ֖/הוּ וְ/אִ֣ישׁ אֶל אָחִ֑י/ו מֶה עָנָ֣ה יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
translation:
  language: de
  text: 'So sollt ihr sagen, jeder zu seinem Nächsten und jeder zu seinem Bruder: »Was hat Jahwe geantwortet? Was hat Jahwe gesagt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה תֹאמְרוּ
  choice: So sollt ihr sagen
  rationale: כֹּה leitet die vorgeschriebene Redeweise ein; die zweite Person Plural von תֹאמְרוּ wird als direkte Anweisung wiedergegeben.
- source_word: אִישׁ עַל רֵעֵהוּ
  choice: jeder zu seinem Nächsten
  rationale: אִישׁ hat hier distributive Kraft. עַל bezeichnet in Verbindung mit dem Reden die angesprochene Person; רֵעַ ist in diesem Zusammenhang passend mit „Nächster“ wiedergegeben.
- source_word: וְאִישׁ אֶל אָחִיו
  choice: und jeder zu seinem Bruder
  rationale: Die parallele Satzform sowie die maskuline Verwandtschaftsbezeichnung אָח bleiben erhalten.
- source_word: מֶה עָנָה
  choice: Was hat … geantwortet
  rationale: ענה bezeichnet eine Antwort oder Erwiderung; das deutsche Perfekt fragt natürlich nach der ergangenen Antwort.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וּמַה דִּבֶּר
  choice: und was hat … gesprochen
  rationale: דבר bedeutet „reden/sprechen“. „Gesprochen“ wahrt die Parallelität und unterscheidet die Aussage vom vorangehenden „geantwortet“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration bewahrt seinen Charakter als Eigenname.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die distributive maskuline Form und der Parallelismus des hebräischen Satzes bleiben sichtbar; die beiden Verben „antworten“ und „sprechen“ werden nicht eingeebnet.
