  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
translation:
  language: de
  text: Der Zorn Jahwes wird nicht zurückweichen,[a] bis er es getan hat und bis er die Pläne seines Herzens ausgeführt hat.[b] In den letzten Tagen[c] werdet ihr das klar verstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird nicht umkehren“ oder „wird nicht zurückkehren“. Das Bild besagt, dass Jahwes Zorn nicht zurückweicht, bevor sein Vorhaben vollendet ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Absichten seines Herzens“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „In künftigen Tagen“. Wörtlich: „Am Ende der Tage“.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַף יְהוָה
  choice: der Zorn Jahwes
  rationale: אַף bezeichnet in dieser Verbindung nicht wörtlich die Nase, sondern den Zorn. Der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לֹא יָשׁוּב
  choice: wird nicht umkehren
  rationale: Die Formulierung bewahrt das hebräische Bild, dass der Zorn nicht zurückweicht; „wird nicht nachlassen“ wäre stärker deutend.
- source_word: עַד עֲשֹׂתוֹ
  choice: bis er getan
  rationale: Die knappe, im Hebräischen nicht näher bestimmte Aussage bleibt offen; das Gemeinte wird nicht durch einen ergänzten Gegenstand festgelegt.
- source_word: וְעַד הֲקִימוֹ מְזִמּוֹת לִבּוֹ
  choice: und bis er die Pläne seines Herzens ausgeführt hat
  rationale: הקים bezeichnet hier das wirksame Verwirklichen; „ausgeführt“ ist im Deutschen mit „Pläne“ natürlich. „Herz“ bleibt als Sitz des Wollens und Planens erhalten.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  rationale: Die formnahe Wiedergabe erhält den prophetischen Nachklang und lässt offen, ob die Wendung allgemein die kommende Zeit oder spezifisch die Endzeit meint.
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  choice: werdet ihr es klar verstehen
  rationale: Das Verb des aufmerksamen Erkennens wird durch das nachgestellte בינה verstärkt; „klar verstehen“ gibt diese Intensivierung idiomatisch wieder.
theological_decisions:
- issue: Zeitliche Tragweite von בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  alternative: In künftigen Tagen / In der kommenden Zeit
  rationale: Die gewählte Formulierung bewahrt die mögliche endzeitliche Bedeutung, ohne sie als ausschließlich technische Endzeitangabe festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bewahrt die knappe Unbestimmtheit von „bis er getan“ sowie die prophetische Mehrdeutigkeit der abschließenden Zeitangabe.
