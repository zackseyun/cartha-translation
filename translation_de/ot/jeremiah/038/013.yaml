  register: Modernes, würdiges Standarddeutsch. Die beiden aufeinanderfolgenden hebräischen Verben für das Ziehen und Heraufbringen bleiben erkennbar, ohne im Deutschen unnötig schwerfällig zu wirken. „Danach“ verdeutlicht den erzählerischen Fortgang, ohne eine zusätzliche inhaltliche Aussage einzuführen.
