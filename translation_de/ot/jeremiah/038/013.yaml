id: JER.38.13
reference: Jeremiah 38:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּמְשְׁכ֤וּ אֶֽת יִרְמְיָ֨הוּ֙ בַּֽ/חֲבָלִ֔ים וַ/יַּעֲל֥וּ אֹת֖/וֹ מִן הַ/בּ֑וֹר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/013.yaml
  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
translation:
  language: de
  text: Da zogen sie Jeremia mit den Seilen hoch und brachten ihn aus der Zisterne[a] herauf. Danach blieb Jeremia im Wachhof[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus der Grube“. Das hebräische Wort kann eine Grube, eine Zisterne oder ein Verlies bezeichnen; hier passt „Zisterne“ zum Erzählzusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Hof der Wache“, „im Gefängnishof“. Gemeint ist der bewachte Bereich, in dem Jeremia festgehalten wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ
  choice: zogen … hoch
  rationale: Das Verb משׁך bezeichnet ein Ziehen; mit „hoch“ wird die durch den Kontext bestimmte Richtung natürlich auf Deutsch ausgedrückt.
- source_word: בַּחֲבָלִים
  choice: mit den Seilen
  rationale: חֲבָלִים bezeichnet Seile oder Stricke; die Präposition בְּ ist hier instrumental gebraucht.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: brachten ihn … herauf
  rationale: Der Hifil von עלה bedeutet „hinaufbringen“ beziehungsweise „heraufbringen“ und bewahrt hier den kausativen Sinn.
- source_word: מִן הַבּוֹר
  choice: aus der Zisterne
  rationale: בּוֹר kann Grube, Zisterne oder Verlies bedeuten; im unmittelbaren Erzählzusammenhang ist eine Zisterne gemeint.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten; hier beschreibt es Jeremias weiteren Aufenthaltsort und nicht seine Körperhaltung.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: im Wachhof
  rationale: חֲצַר bezeichnet einen Hof, während מַטָּרָה hier den bewachten Haftbereich bezeichnet. „Wachhof“ ist knapp, verständlich und vermeidet die Überpräzisierung als Gebäude.
theological_decisions: []
