  text: וַ/יִּשָּׁבַ֞ע הַ/מֶּ֧לֶךְ צִדְקִיָּ֛הוּ אֶֽל יִרְמְיָ֖הוּ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר חַי יְהוָ֞ה את אֲשֶׁר֩ עָשָׂה לָ֨/נוּ אֶת הַ/נֶּ֤פֶשׁ הַ/זֹּאת֙ אִם אֲמִיתֶ֔/ךָ וְ/אִם אֶתֶּנְ/ךָ֗ בְּ/יַד֙ הָ/אֲנָשִׁ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
translation:
  language: de
  text: 'Da schwor König Zedekia Jeremia heimlich: »So wahr Jahwe lebt, der dieses Leben für uns geschaffen hat[a]: Ich werde dich weder töten noch dich diesen Männern ausliefern, die dir nach dem Leben trachten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der uns dieses Leben gegeben hat“. Wörtlicher: „der für uns dieses Leben/diese Lebenskraft gemacht hat“.'
    reason: Die hebräische Formulierung verbindet עָשָׂה („machen, schaffen“) mit נֶפֶשׁ („Leben, Lebenskraft, Person“) und lässt sich im Deutschen nicht mit derselben Bedeutungsbreite wiedergeben.
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: schwor
  rationale: Das Verb bezeichnet das Ablegen eines Eides. „Schwor“ ist knapp, würdevoll und im Deutschen idiomatisch.
- source_word: בַּסֵּתֶר
  choice: heimlich
  rationale: Die Wendung bezeichnet ein verborgenes, nicht öffentliches Handeln. „Heimlich“ gibt die adverbiale Funktion natürlich wieder.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies ist die übliche hebräische Eidesformel; die deutsche Formulierung bewahrt ihren feierlichen und verbindlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֵת אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  choice: der dieses Leben für uns geschaffen hat
  rationale: Die Wiedergabe bewahrt das Schöpfungshandeln von עָשָׂה und versteht נֶפֶשׁ kontextgemäß als „Leben“. Die ungewöhnliche Formulierung des Hebräischen bleibt erkennbar, ohne unverständlich zu werden.
- source_word: אִם אֲמִיתֶךָ
  choice: Ich werde dich … nicht töten
  rationale: Nach der Eidesformel hat אִם elliptisch verneinende Kraft. Im Deutschen muss die Verneinung ausdrücklich formuliert werden.
- source_word: וְאִם אֶתֶּנְךָ בְּיַד
  choice: noch dich … ausliefern
  rationale: „Ausliefern“ gibt die hebräische Übergabe-in-die-Hand-Wendung in natürlichem modernem Deutsch wieder; „noch“ setzt die verneinte eidliche Zusage fort.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: diesen Männern
  rationale: Das maskuline Pluralwort bezeichnet hier die konkret gemeinten männlichen Amtsträger.
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  choice: die dir nach dem Leben trachten
  rationale: Diese feste deutsche Wendung entspricht dem hebräischen Idiom, das die Absicht bezeichnet, jemanden zu töten, und bewahrt zugleich dessen Bildsprache.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה in der Eidesformel
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich den Gottesnamen. Die Wiedergabe „Jahwe“ bewahrt ihn als Eigennamen, ohne die Eidesformel umzudeuten.
- issue: Bedeutung von נֶפֶשׁ in der Aussage über Gottes Schöpfung
  choice: Leben
  alternative: Seele
  rationale: Im Zusammenhang der Eidesformel und der anschließenden Todesdrohung bezeichnet נֶפֶשׁ das konkrete Leben. „Seele“ würde hier eine stärker anthropologische Unterscheidung nahelegen, die der Vers nicht verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die königliche Eidesformel bleibt feierlich; zugleich werden natürliche deutsche Wendungen wie „ausliefern“ und „nach dem Leben trachten“ verwendet. Die ungewöhnliche Schöpfungsaussage wird im Haupttext bewahrt und durch eine Fußnote erläutert.
