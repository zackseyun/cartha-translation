source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ צִדְקִיָּ֔הוּ הִנֵּה ה֖וּא בְּ/יֶדְ/כֶ֑ם כִּֽי אֵ֣ין הַ/מֶּ֔לֶךְ יוּכַ֥ל אֶתְ/כֶ֖ם דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/005.yaml
  text: Then King Zedekiah said[a], “Look, he is in your hands, for the king can do nothing against you.”
translation:
  language: de
  text: 'Da sagte König Zedekia: „Seht, er ist in eurer Hand; denn der König vermag nichts gegen euch auszurichten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: „Denn der König vermag euch gegenüber keine Sache [zu tun].“ Gemeint ist im Zusammenhang, dass er nicht gegen sie vorgehen oder ihre Entscheidung überstimmen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da sagte“ gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  choice: König Zedekia
  rationale: Die Verbindung von Titel und Namen wird im Deutschen idiomatisch als „König Zedekia“ wiedergegeben.
- source_word: הִנֵּה
  choice: Seht
  rationale: Die deiktische Partikel lenkt die Aufmerksamkeit der mehreren Angeredeten auf die folgende Aussage. „Seht“ bewahrt diesen Impuls in gegenwärtigem, würdigem Deutsch.
- source_word: הוּא
  choice: er
  rationale: Das selbstständige Pronomen bezieht sich im Kontext auf Jeremia und ist Subjekt des verblosen Satzes.
- source_word: בְּיֶדְכֶם
  choice: in eurer Hand
  rationale: Die hebräische Wendung bezeichnet Verfügungsgewalt. Das deutsche Bild „in eurer Hand“ bleibt nah am Ausgangstext und ist unmittelbar verständlich.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die Einräumung des Königs ein.
- source_word: אֵין הַמֶּלֶךְ יוּכַל
  choice: der König vermag nichts
  rationale: Die Formulierung drückt Unvermögen aus. Die Selbstbezeichnung in der dritten Person bleibt erhalten, statt sie stillschweigend in „ich“ umzuwandeln.
- source_word: אֶתְכֶם דָּבָר
  choice: gegen euch auszurichten
  rationale: Die knappe hebräische Konstruktion ist elliptisch. Im Zusammenhang bezeichnet sie die Unfähigkeit des Königs, sich den Männern entgegenzustellen oder ihre Entscheidung zu überstimmen; „gegen euch auszurichten“ gibt diesen Sinn natürlich wieder.
