source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אֶֽל יִרְמְיָ֗הוּ שִׂ֣ים נָ֠א בְּלוֹאֵ֨י הַ/סְּחָב֤וֹת וְ/הַ/מְּלָחִים֙ תַּ֚חַת אַצִּל֣וֹת יָדֶ֔י/ךָ מִ/תַּ֖חַת לַ/חֲבָלִ֑ים וַ/יַּ֥עַשׂ יִרְמְיָ֖הוּ כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
translation:
  language: de
  text: 'Da sagte Ebed-Melech, der Kuschiter,[a] zu Jeremia: »Lege bitte die abgenutzten Lumpen und Stoffreste[b] zwischen deine Achseln und die Seile.[c]« Und Jeremia tat es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: »der Äthiopier«. Im Hebräischen steht »der Kuschiter«, also ein Mann aus Kusch.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräischen Wörter für diese Materialien sind selten. Gemeint sind wahrscheinlich verschlissene Stoffstücke oder Kleidungsreste, die Jeremia vor den Seilen schützen sollten.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: »unter die Gelenke deiner Hände/Arme«; gemeint ist hier wohl der Bereich unter den Armen, auf den die Seile beim Hochziehen drückten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebed-Melech
  rationale: Der Ausdruck wird im Kontext als Personenname verstanden und daher in einer im Deutschen gut lesbaren Form transliteriert, nicht als »Diener des Königs« übersetzt.
- source_word: הַכּוּשִׁי
  choice: der Kuschiter
  rationale: Die Bezeichnung meint einen Mann aus Kusch. »Kuschiter« bleibt näher am hebräischen Ethnonym als das traditionelle »Äthiopier«.
- source_word: שִׂים נָא
  choice: Lege bitte
  rationale: Der Imperativ mit נָא hat hier bittenden beziehungsweise höflichen Nachdruck; »Lege bitte« gibt dies in natürlichem Deutsch wieder.
- source_word: בְּלוֹאֵי הַסְּחָבוֹת וְהַמְּלָחִים
  choice: diese abgenutzten Lumpen und Stoffreste
  rationale: Die seltenen Bezeichnungen meinen offenbar verschlissene textile Gegenstände. Die Übersetzung wahrt die Unsicherheit, lässt aber ihre Funktion als Polsterung erkennen.
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ
  choice: unter deine Achseln
  rationale: Wörtlich ist von den Gelenken beziehungsweise Ansatzstellen der Arme die Rede; beim Hochziehen mit Seilen sind sinngemäß die Achselbereiche gemeint.
- source_word: מִתַּחַת לַחֲבָלִים
  choice: unter die Seile
  rationale: Die Stoffe sollen zwischen Körper und Seilen liegen. Die knappe räumliche Formulierung entspricht dem Hebräischen.
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  choice: Und Jeremia tat es
  rationale: Natürliche deutsche Wiedergabe der üblichen hebräischen Erfüllungsformel.
