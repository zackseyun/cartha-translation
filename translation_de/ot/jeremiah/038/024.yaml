id: JER.38.24
reference: Jeremiah 38:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר צִדְקִיָּ֜הוּ אֶֽל יִרְמְיָ֗הוּ אִ֛ישׁ אַל יֵדַ֥ע בַּ/דְּבָֽרִים הָ/אֵ֖לֶּה וְ/לֹ֥א תָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
translation:
  language: de
  text: 'Da sagte Zedekia zu Jeremia: „Niemand soll von diesen Dingen erfahren, dann wirst du nicht sterben.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Satzteil kann auch einen Zweck ausdrücken: „damit du nicht stirbst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das narrative Waw führt die Handlung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem modernem Deutsch wieder.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Der Personenname wird in der im Deutschen üblichen biblischen Form wiedergegeben.
- source_word: אֶל יִרְמְיָהוּ
  choice: zu Jeremia
  rationale: Die Präposition אֶל bezeichnet hier den Adressaten der Rede; „zu Jeremia“ ist die natürliche deutsche Fügung.
- source_word: אִישׁ אַל יֵדַע
  choice: Niemand soll … erfahren
  rationale: אִישׁ ist hier generisch gebraucht, und אַל mit Jussiv drückt ein Verbot aus. „Niemand soll … erfahren“ ist idiomatisch und bewahrt den direktiven Sinn.
- source_word: בַּדְּבָרִים הָאֵלֶּה
  choice: von diesen Dingen
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Die breite Wiedergabe „diese Dinge“ vermeidet eine unnötige Festlegung.
- source_word: וְלֹא תָמוּת
  choice: dann wirst du nicht sterben
  rationale: Die mit וְ angeschlossene Klausel bezeichnet im Zusammenhang wahrscheinlich die Folge beziehungsweise Zusicherung bei Wahrung des Geheimnisses. „Dann“ macht diesen Zusammenhang natürlich verständlich, ohne einen ausdrücklich finalen Sinn festzuschreiben.
theological_decisions:
- issue: Logisches Verhältnis von וְלֹא תָמוּת zum vorausgehenden Verbot
  choice: „dann wirst du nicht sterben“ als Folge oder Zusicherung
  alternative: „damit du nicht stirbst“ als Zweckangabe
  rationale: Das hebräische וְ lässt das genaue Verhältnis offen. Der Haupttext gibt die naheliegende konsekutive Lesart wieder; die Fußnote bewahrt die mögliche finale Nuance.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Niemand“ gibt das generisch verwendete אִישׁ natürlich wieder. Die Mehrdeutigkeit der Schlussklausel wird durch eine knappe Fußnote bewahrt.
