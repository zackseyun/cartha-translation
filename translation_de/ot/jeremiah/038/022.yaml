source:
  edition: WLC
  text: וְ/הִנֵּ֣ה כָל הַ/נָּשִׁ֗ים אֲשֶׁ֤ר נִשְׁאֲרוּ֙ בְּ/בֵ֣ית מֶֽלֶךְ יְהוּדָ֔ה מוּצָא֕וֹת אֶל שָׂרֵ֖י מֶ֣לֶךְ בָּבֶ֑ל וְ/הֵ֣נָּה אֹמְר֗וֹת הִסִּית֜וּ/ךָ וְ/יָכְל֤וּ לְ/ךָ֙ אַנְשֵׁ֣י שְׁלֹמֶ֔/ךָ הָטְבְּע֥וּ בַ/בֹּ֛ץ רַגְלֶ֖/ךָ נָסֹ֥גוּ אָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
translation:
  language: de
  text: 'Sieh, alle Frauen, die im Palast des Königs von Juda übrig geblieben sind, werden zu den Beamten des Königs von Babylon hinausgebracht. Sie sagen:


    »Deine Vertrauten[a] haben dich irregeführt

    und über dich die Oberhand gewonnen.

    Deine Füße sind im Schlamm[b] versunken;

    sie haben sich zurückgezogen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Männer deines Friedens“; gemeint sind Menschen, die mit dir auf vertrautem oder freundschaftlichem Fuß stehen, etwa Freunde, Vertraute oder Verbündete.'
    reason: Die hebräische Beziehungsformel lässt mehrere nahe Bedeutungen zu, die im Deutschen nicht mit einer einzigen natürlichen Wendung vollständig wiedergegeben werden können.
  - marker: b
    text: 'Oder: „im Morast“.'
    reason: „Schlamm“ und „Morast“ geben beide בֹּץ wieder; die Alternative bewahrt den stärkeren Eindruck einer tiefen, festhaltenden Masse.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden und vergegenwärtigenden Charakter des hebräischen Diskursmarkers in natürlichem, würdigem Deutsch wieder.
- source_word: בְּבֵית מֶלֶךְ יְהוּדָה
  choice: im Palast des Königs von Juda
  rationale: בֵּית bezeichnet hier nicht bloß ein Wohnhaus, sondern den königlichen Haushalt beziehungsweise Palast; „Palast“ ist im Kontext eindeutig und idiomatisch.
- source_word: נִשְׁאֲרוּ
  choice: übrig geblieben sind
  rationale: 'Bewahrt den Sinn des Niphal: Es geht um die Frauen, die noch im Palast zurückgeblieben sind.'
- source_word: מוּצָאוֹת
  choice: werden ... hinausgebracht
  rationale: Der Hophal-Partizip drückt ein passiv verursachtes Hinausgehen aus. Das deutsche Präsens kann in der lebhaften prophetischen Darstellung zugleich das bevorstehende Geschehen bezeichnen.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  choice: die Beamten des Königs von Babylon
  rationale: שָׂרִים bezeichnet ranghohe Amtsträger, ohne hier zwingend Adel oder militärischen Rang festzulegen.
- source_word: אַנְשֵׁי שְׁלֹמֶךָ
  choice: deine Vertrauten
  rationale: Die wörtlichen „Männer deines Friedens“ sind Personen, die dem König freundschaftlich verbunden sind oder als verlässliche Verbündete gelten. „Vertraute“ gibt die idiomatische Bedeutung knapp und natürlich wieder; die hebräische Wendung wird in der Fußnote offengelegt.
- source_word: הִסִּיתוּךָ
  choice: haben dich irregeführt
  rationale: סות im Hiphil kann verleiten, aufstacheln oder auf einen falschen Weg bringen. „irregeführt“ wahrt die Breite der Aussage, ohne eine bestimmte Art der Einflussnahme festzulegen.
- source_word: וְיָכְלוּ לְךָ
  choice: und über dich die Oberhand gewonnen
  rationale: יכל mit ל bezeichnet das Überwältigen oder Sich-Durchsetzen gegen jemanden. Die deutsche Wendung ist natürlich und erhält die gegen den König gerichtete Bedeutung.
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  choice: Sie haben deine Füße im Schlamm versinken lassen
  rationale: 'Bewahrt sowohl das eindrückliche Bild als auch die kausative Form des hebräischen Verbs: Die Vertrauten werden als diejenigen dargestellt, die den König in die hilflose Lage gebracht haben.'
- source_word: נָסֹגוּ אָחוֹר
  choice: und sich dann zurückgezogen
  rationale: Gibt die rückwärtsgerichtete Bewegung als Rückzug beziehungsweise Preisgabe des Königs wieder; „dann“ verdeutlicht die im Spottvers angelegte Abfolge, ohne einen neuen Sachgehalt einzuführen.
