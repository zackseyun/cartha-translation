translation_notes:
  register: Moderne, würdige Erzählsprache. Kurze, klare Sätze vermeiden eine schwerfällige Nachbildung der hebräischen Satzkette. Die Schlussbegründung wird kontextbezogen als nicht mitgehörtes Gespräch wiedergegeben; damit wird die wahrscheinlich gemeinte Situation verständlich, ohne konfessionelle oder theologische Zusatzdeutung.
