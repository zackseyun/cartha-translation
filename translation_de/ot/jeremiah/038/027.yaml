base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
translation:
  language: de
  text: Da kamen alle führenden Beamten zu Jeremia und befragten ihn. Er berichtete ihnen alle diese Worte, die der König ihm aufgetragen hatte. Darauf schwiegen sie ihm gegenüber, denn die Angelegenheit war nicht bekannt geworden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn die Sache war nicht gehört worden“. Gemeint kann sein, dass die Unterredung nicht mitgehört worden war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: die führenden Beamten
  rationale: שַׂר bezeichnet hier Angehörige der königlichen Führungsschicht. „Führende Beamte“ ist im Hofkontext verständlich und vermeidet das heute missverständliche „Fürsten“ sowie eine unnötige Festlegung auf militärische Befehlshaber.
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  choice: sie befragten ihn
  rationale: שׁאל bezeichnet in diesem Zusammenhang eine gezielte Befragung Jeremias; „befragten“ gibt den prüfenden Charakter natürlich wieder.
- source_word: וַיַּגֵּד לָהֶם
  choice: er berichtete ihnen
  rationale: Das Hifil von נגד bedeutet, etwas mitzuteilen oder bekanntzugeben. „Berichtete“ passt zur Wiedergabe der zuvor abgesprochenen Auskunft.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: alles so, wie der König es ihm befohlen hatte
  rationale: Das כְּ wird als Übereinstimmung mit der königlichen Anweisung verstanden. Die idiomatische Formulierung wahrt sowohl den Gesamtumfang von כָּל als auch die bindende Kraft von צוה.
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  choice: darauf ließen sie ihn in Ruhe
  rationale: Die Wendung bezeichnet hier, dass die Beamten schwiegen beziehungsweise nicht weiter gegen Jeremia vorgingen oder ihn bedrängten. „Ließen sie ihn in Ruhe“ gibt die Funktion im Erzählzusammenhang natürlich wieder, ohne zusätzliche Rede zu erfinden.
- source_word: כִּי לֹא נִשְׁמַע הַדָּבָר
  choice: denn das Gespräch war nicht mitgehört worden
  rationale: דָּבָר kann sowohl „Wort/Sache“ als auch den besprochenen Inhalt bezeichnen. Im Zusammenhang der geheimen Unterredung erklärt der passive Ausdruck wahrscheinlich, dass niemand das Gespräch mitgehört hatte.
