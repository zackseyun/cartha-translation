  naturalness: Die deutsche Fassung ist flüssig und modern. „Darauf schwiegen sie ihm gegenüber“ ist natürlich genug und gibt den erzählerischen Zusammenhang präziser wieder. „Die Angelegenheit war nicht bekannt geworden“ ist idiomatisch und wahrt die unbestimmte passive Aussage.
  terminology: „Führende Beamte“, „befragten“ und „berichtete“ passen zum höfischen Kontext und zu modernem Standarddeutsch. „Alle diese Worte, die der König ihm aufgetragen hatte“ bewahrt den Wortbezug von דְּבָרִים und die Befehlsnuance, ohne das hebräische כְּ unnötig in eine Vergleichsformulierung umzudeuten.
