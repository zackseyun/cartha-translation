  source_fidelity: Die Übersetzung gibt die prophetische Formel כֹּה אָמַר יְהוָה treffend wieder. Die Verstärkung von הִנָּתֹן תִּנָּתֵן ist mit „ganz gewiss“ angemessen erfasst. „in die Hand des Heeres des Königs von Babel“ bewahrt die hebräische Übergabeformel, und „einnehmen“ entspricht לכד im Kontext einer Stadt. Das maskuline Singularsubjekt des Schlussverbs bleibt im Deutschen sichtbar und wird nicht unzulässig festgelegt.
  naturalness: „So spricht Jahwe“ und der übrige Satz sind modernes, verständliches Standarddeutsch mit angemessen würdigem prophetischem Register. Die Konstruktion „wird ganz gewiss … gegeben werden“ ist trotz der Passivhäufung natürlich und bildet die emphatische hebräische Passivform sorgfältig ab.
  terminology: „Jahwe“, „Heer“, „König von Babel“ und „einnehmen“ sind konsistent, sachlich zutreffend und registergerecht. Die Fußnote zu [a] erklärt die idiomatische Alternative; Fußnote [b] wahrt die im Hebräischen bestehende Referenzoffenheit des Singularverbs.
