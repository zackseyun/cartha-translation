id: JER.38.3
reference: Jeremiah 38:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנָּתֹ֨ן תִּנָּתֵ֜ן הָ/עִ֣יר הַ/זֹּ֗את בְּ/יַ֛ד חֵ֥יל מֶֽלֶךְ בָּבֶ֖ל וּ/לְכָדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/003.yaml
  text: 'Thus says Yahweh: This city will surely be given into the hand of the army of the king of Babylon[a], and he will capture it.'
translation:
  language: de
  text: 'So spricht Jahwe: Diese Stadt wird ganz gewiss in die Hand des Heeres des Königs von Babel gegeben werden[a], und er wird sie einnehmen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Gewalt des Heeres des Königs von Babel gegeben werden“. Wörtlich steht im Hebräischen „in die Hand“.'
    reason: lexical_alternative
  - marker: b
    text: Das im Hebräischen nur durch die Verbform angezeigte Subjekt kann sich auf den König oder auf das Heer beziehen.
    reason: ambiguity
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt die autoritative Verkündigung natürlich und würdig wieder. Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben.
- source_word: הִנָּתֹן תִּנָּתֵן
  choice: wird ganz gewiss … gegeben werden
  rationale: Der absolute Infinitiv zusammen mit der finiten Verbform verstärkt die Aussage. „Ganz gewiss“ wahrt den Nachdruck und die Zukunftsbedeutung des passiven Verbs.
- source_word: הָעִיר הַזֹּאת
  choice: Diese Stadt
  rationale: Direkte und natürliche Wiedergabe der Nominalgruppe mit Demonstrativpronomen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Verfügungsgewalt eines anderen; das deutsche Bild bleibt verständlich und bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: חֵיל
  choice: Heer
  rationale: Im militärischen Zusammenhang bezeichnet das Wort die bewaffnete Streitmacht. „Heer“ passt zum würdigen prophetischen Register.
- source_word: מֶלֶךְ בָּבֶל
  choice: König von Babel
  rationale: „Babel“ ist die etablierte deutsche Wiedergabe des hebräischen Orts- und Reichsnamens בָּבֶל und die Genitivverbindung wird idiomatisch mit „von“ ausgedrückt.
- source_word: וּלְכָדָהּ
  choice: und er wird sie einnehmen
  rationale: לכד bezeichnet bei einer Stadt deren militärische Einnahme. Das maskuline Singularsubjekt bleibt wie im Hebräischen unausgesprochen; „er“ bildet die Form knapp ab, während eine Fußnote auf die mögliche Zuordnung hinweist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Bundesnamen in der üblichen deutschen Schreibweise, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des unausgesprochenen Subjekts bei וּלְכָדָהּ
  choice: er, mit Hinweis auf die Mehrdeutigkeit
  alternative: das Heer wird sie einnehmen
  rationale: Sowohl „Heer“ als auch „König“ können im Hebräischen als maskulines Singularsubjekt verstanden werden. Der Haupttext legt den Bezug nicht durch eine erläuternde Umformung endgültig fest; die Fußnote bewahrt die genuine syntaktische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die traditionelle Botenformel und das hebräische Bild „in die Hand“ bleiben erhalten; ungebräuchliche Archaismen werden vermieden.
