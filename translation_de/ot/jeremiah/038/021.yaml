id: JER.38.21
reference: Jeremiah 38:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִם מָאֵ֥ן אַתָּ֖ה לָ/צֵ֑את זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֥ר הִרְאַ֖/נִי יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/021.yaml
  text: 'But if you refuse to go out[a], this is the word that Yahweh has shown me:'
translation:
  language: de
  text: 'Wenn du dich aber weigerst, hinauszugehen, dann ist dies das Wort[a], das Jahwe mir gezeigt hat:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sache“ oder „die Angelegenheit“.'
    reason: דָּבָר kann hier neben „Wort“ auch „Sache“ oder „Angelegenheit“ bedeuten.
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die Verbindung aus Konjunktion und Konditionalpartikel leitet einen Gegensatz zur vorausgehenden Zusage ein; die deutsche Nachstellung von „aber“ wirkt natürlich.
- source_word: מָאֵן
  choice: dich weigerst
  rationale: Das Verb bezeichnet eine willentliche Weigerung, nicht bloß Unvermögen oder Zögern.
- source_word: לָצֵאת
  choice: hinauszugehen
  rationale: Die Form bedeutet wörtlich „hinausgehen“. Der Kontext legt zwar eine Übergabe an die Babylonier nahe, doch wird „sich ergeben“ hier nicht ausdrücklich gesagt.
- source_word: זֶה הַדָּבָר
  choice: dies ist das Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. „Wort“ passt zum prophetischen Offenbarungskontext; die echte lexikalische Alternative wird in einer Fußnote erhalten.
- source_word: אֲשֶׁר הִרְאַנִי
  choice: das … mir gezeigt hat
  rationale: Der Hifil von ראה bedeutet „sehen lassen/zeigen“. „Mir gezeigt hat“ ist idiomatisches Deutsch und bewahrt den visuellen Offenbarungsaspekt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Deutung von לָצֵאת im historischen Kontext
  choice: hinauszugehen
  alternative: dich zu ergeben
  rationale: Obwohl das Hinausgehen im Kontext die Übergabe an die babylonischen Obersten meint, bleibt die Übersetzung bei der ausdrücklichen Formulierung des hebräischen Textes und löst die Handlung nicht interpretierend als „sich ergeben“ auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinauszugehen“ bewahrt die konkrete Ausdrucksweise des Hebräischen; „dann“ macht den deutschen Konditionalsatz klar, ohne zusätzliche Bedeutung einzutragen.
