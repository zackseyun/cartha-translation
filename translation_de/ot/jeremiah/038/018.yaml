source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא תֵצֵ֗א אֶל שָׂרֵי֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נִתְּנָ֞ה הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד הַ/כַּשְׂדִּ֔ים וּ/שְׂרָפ֖וּ/הָ בָּ/אֵ֑שׁ וְ/אַתָּ֖ה לֹֽא תִמָּלֵ֥ט מִ/יָּדָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
translation:
  language: de
  text: Wenn du aber nicht zu den hohen Beamten des Königs von Babel hinausgehst[a], wird diese Stadt in die Hand der Chaldäer gegeben werden. Sie werden sie niederbrennen, und du wirst ihrer Hand nicht entkommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Fürsten des Königs von Babel“ beziehungsweise „zu den Befehlshabern des Königs von Babel“. Das hebräische Wort bezeichnet allgemein hochrangige Amts- oder Befehlsträger.'
    reason: lexical_alternative
  - marker: b
    text: „In die Hand“ und „ihrer Hand nicht entkommen“ sind hebräische Wendungen dafür, in die Gewalt eines anderen zu geraten beziehungsweise ihr nicht zu entkommen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֵצֵא
  choice: Wenn du aber nicht ... hinausgehst
  rationale: Die Formulierung bewahrt die Bedingung und den kontrastierenden Anschluss. Das wörtliche „hinausgehst“ lässt die im Kontext gemeinte Ergebung erkennen, ohne sie ausdrücklich in den Text einzutragen.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: zu den hohen Beamten des Königs von Babel
  rationale: שָׂרֵי bezeichnet hochrangige Amts- oder Befehlsträger. „Hohe Beamte“ ist im Deutschen verständlich und vermeidet die zu enge Festlegung auf Fürsten oder rein militärische Befehlshaber.
- source_word: וְנִתְּנָה הָעִיר הַזֹּאת בְּיַד הַכַּשְׂדִּים
  choice: wird diese Stadt in die Hand der Chaldäer gegeben werden
  rationale: Das Passiv und das hebräische Hand-Macht-Bild werden erhalten. „Chaldäer“ gibt die ethnisch-politische Bezeichnung des Ausgangstextes wieder.
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  choice: Sie werden sie niederbrennen
  rationale: „Niederbrennen“ gibt die natürliche deutsche Bedeutung des hebräischen Ausdrucks wieder; ein wörtliches „mit Feuer verbrennen“ wäre im modernen Deutsch unnötig redundant.
- source_word: וְאַתָּה לֹא תִמָּלֵט מִיָּדָם
  choice: und du wirst ihrer Hand nicht entkommen
  rationale: Die Übersetzung bewahrt das wiederholte Bild der „Hand“ als Ausdruck von Gewalt und Verfügungsgewalt sowie die Bedeutung „entkommen“ des Verbs.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Babel“ entspricht der im deutschen Bibelstil etablierten Form des hebräischen Ortsnamens; die parallele Bildsprache der „Hand“ bleibt erhalten.
