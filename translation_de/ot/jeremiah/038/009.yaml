  text: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ הֵרֵ֜עוּ הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ אֵ֣ת כָּל אֲשֶׁ֤ר עָשׂוּ֙ לְ/יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֵ֥ת אֲשֶׁר הִשְׁלִ֖יכוּ אֶל הַ/בּ֑וֹר וַ/יָּ֤מָת תַּחְתָּי/ו֙ מִ/פְּנֵ֣י הָֽ/רָעָ֔ב כִּ֣י אֵ֥ין הַ/לֶּ֛חֶם ע֖וֹד בָּ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
translation:
  language: de
  text: 'Mein Herr und König, diese Männer haben in allem, was sie dem Propheten Jeremia angetan haben, Böses getan: Sie haben ihn in die Zisterne[a] geworfen. Dort wird er wegen der Hungersnot sterben, denn in der Stadt gibt es kein Brot mehr.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Grube“ beziehungsweise „Verlies“. Das hebräische Wort kann eine Grube, ein Verlies oder eine Zisterne bezeichnen; im unmittelbaren Zusammenhang passt „Zisterne“ am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Mein Herr und König
  rationale: Die ehrerbietige Anrede bewahrt sowohl das possessive אֲדֹנִי als auch den Königstitel und klingt im Deutschen natürlich und würdevoll.
- source_word: הֵרֵעוּ
  choice: haben … Böses getan
  rationale: Die Hifil-Form von רעע bezeichnet hier moralisch verwerfliches Handeln; „Böses getan“ erhält diese Wertung.
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: diese Männer
  rationale: Das maskuline Pluralnomen bezeichnet hier konkret die zuvor genannten Männer.
- source_word: אֵת כָּל אֲשֶׁר עָשׂוּ לְיִרְמְיָהוּ הַנָּבִיא
  choice: mit allem, was sie dem Propheten Jeremia angetan haben
  rationale: „Angetan haben“ gibt den feindseligen Charakter ihres Handelns idiomatisch wieder; כָּל אֲשֶׁר behält seine umfassende Bedeutung.
- source_word: הִשְׁלִיכוּ אֶל הַבּוֹר
  choice: haben ihn in die Zisterne geworfen
  rationale: בּוֹר kann Grube, Verlies oder Zisterne bedeuten. Wegen des Schlamms und der beschriebenen Anlage im unmittelbaren Erzählzusammenhang ist „Zisterne“ hier am genauesten.
- source_word: וַיָּמָת תַּחְתָּיו
  choice: Dort wird er … sterben
  rationale: Obwohl וַיָּמָת formal eine narrative Vergangenheitsform ist, bezeichnet es im Zusammenhang den als sicher erwarteten Tod Jeremias, falls er dort bleibt. תַּחְתָּיו wird idiomatisch als Ortsangabe „dort“ verstanden.
- source_word: מִפְּנֵי הָרָעָב
  choice: vor Hunger
  rationale: Der Ausdruck bezeichnet hier die tödliche Folge der Hungersnot; „vor Hunger sterben“ ist die natürliche deutsche Wendung.
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  choice: denn in der Stadt gibt es kein Brot mehr
  rationale: „Brot“ erhält das konkrete לֶחֶם, während „mehr“ den Sinn von עוֹד in der Mangelsituation wiedergibt.
