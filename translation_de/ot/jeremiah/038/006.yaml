translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. „Zisterne“ erschließt die durch Wasserlosigkeit und Schlamm beschriebene Anlage; „Wachhof“ wahrt die mögliche Bedeutung eines bewachten Haftbereichs. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
