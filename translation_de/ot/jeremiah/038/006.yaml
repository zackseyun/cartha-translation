base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
translation:
  language: de
  text: Da nahmen sie Jeremia und warfen ihn in die Zisterne[a] Malkijas, des Königssohns, die sich im Hof der Wache[b] befand. Sie ließen Jeremia an Seilen hinab. In der Zisterne war kein Wasser, sondern nur Schlamm,[c] und Jeremia sank in den Schlamm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Grube“. Das hebräische Wort kann beides bezeichnen; der Hinweis auf fehlendes Wasser und Schlamm spricht hier für eine Zisterne.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Gefängnishof“. Das hebräische Wort bezeichnet wahrscheinlich einen bewachten Haftbereich.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Morast“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Da nahmen sie
  rationale: Das gewöhnliche Erzählverb לקח wird schlicht mit „nehmen“ wiedergegeben; „ergriffen“ wäre im Kontext möglich, aber stärker deutend.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל־הַבּוֹר
  choice: warfen ihn in die Zisterne
  rationale: השליך bezeichnet ein kraftvolles Werfen. בור kann Grube oder Zisterne bedeuten; der Hinweis auf fehlendes Wasser und vorhandenen Schlamm spricht hier für eine Zisterne.
- source_word: מַלְכִּיָּהוּ בֶן־הַמֶּלֶךְ
  choice: Malkijas, des Königssohns
  rationale: Die Genitivfügung gibt den Besitzer der Zisterne natürlich wieder. „Königssohn“ bewahrt die Bezeichnung, ohne eine Thronfolge anzudeuten.
- source_word: אֲשֶׁר בַּחֲצַר הַמַּטָּרָה
  choice: die sich im Wachhof befand
  rationale: חצר bezeichnet einen Hof; מטרה meint im Jeremiabuch einen bewachten Haftbereich. „Wachhof“ ist knapp und vermeidet die Überbestimmung als gewöhnliches Gefängnis.
- source_word: וַיְשַׁלְּחוּ אֶת־יִרְמְיָהוּ בַּחֲבָלִים
  choice: Sie ließen Jeremia an Seilen hinab
  rationale: שלח bedeutet gewöhnlich „senden“, bezeichnet hier zusammen mit den Seilen aber idiomatisch das Hinablassen.
- source_word: וּבַבּוֹר אֵין מַיִם כִּי אִם־טִיט
  choice: In der Zisterne war kein Wasser, sondern nur Schlamm
  rationale: אין bezeichnet das Nichtvorhandensein, כי אם ist hier ausschließend. „Schlamm“ ist die klare moderne Entsprechung für טיט.
- source_word: וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט
  choice: Jeremia sank in den Schlamm
  rationale: טבע beschreibt das Einsinken beziehungsweise Untergehen und bewahrt so die im Hebräischen erkennbare Gefahr.
