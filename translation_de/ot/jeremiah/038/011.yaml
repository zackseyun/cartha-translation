id: JER.38.11
reference: Jeremiah 38:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֶֽבֶד מֶ֨לֶךְ אֶת הָ/אֲנָשִׁ֜ים בְּ/יָד֗/וֹ וַ/יָּבֹ֤א בֵית הַ/מֶּ֨לֶךְ֙ אֶל תַּ֣חַת הָ/אוֹצָ֔ר וַ/יִּקַּ֤ח מִ/שָּׁם֙ בְּלוֹיֵ֣ ה/סחבות וּ/בְלוֹיֵ֖ מְלָחִ֑ים וַ/יְשַׁלְּחֵ֧/ם אֶֽל יִרְמְיָ֛הוּ אֶל הַ/בּ֖וֹר בַּ/חֲבָלִֽים׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/011.yaml
  text: So Ebed-melech took the men with him and went into the king’s house[a], to a place below the storeroom, and from there took worn-out rags and worn-out garments[c][b], and sent them down by ropes to Jeremiah in the cistern.
translation:
  language: de
  text: Da nahm Ebed-Melech die Männer mit sich und ging in den Königspalast, hinunter unter den Vorratsraum[a]. Von dort nahm er abgenutzte Lumpen und abgetragene Kleidungsstücke[b] und ließ sie an Seilen zu Jeremia in die Zisterne[c] hinab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »unter die Schatzkammer«. Das hebräische Wort kann eine Schatzkammer, einen Lagerraum oder einen Vorratsraum bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bedeutung des seltenen hebräischen Wortes ist unsicher. Gemeint sind wahrscheinlich alte Kleidungsstücke oder andere abgenutzte Textilien.
    reason: lexical_uncertainty
  - marker: c
    text: 'Oder: »Grube«. Das hebräische Wort kann eine Grube oder eine Zisterne bezeichnen; hier passt »Zisterne« zum Erzählzusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebed-Melech
  rationale: Der Ausdruck wird hier als Personenname verstanden und entsprechend transliteriert, nicht als »Diener des Königs« übersetzt.
- source_word: הָאֲנָשִׁים בְּיָדוֹ
  choice: die Männer mit sich
  rationale: בְּיָדוֹ bezeichnet idiomatisch die Männer, die ihn begleiteten beziehungsweise unter seiner Leitung standen; die gewählte Formulierung ist im Deutschen natürlich und legt die genaue Art der Zuordnung nicht unnötig fest.
- source_word: בֵית הַמֶּלֶךְ
  choice: Königspalast
  rationale: Wörtlich »Haus des Königs«; im erzählerischen Kontext bezeichnet die Wendung den Palast und wird so in natürlichem modernem Deutsch wiedergegeben.
- source_word: אֶל תַּחַת הָאוֹצָר
  choice: hinunter unter den Vorratsraum
  rationale: תַּחַת bezeichnet den Bereich darunter; אוֹצָר kann Schatzkammer, Lagerraum oder Vorratsraum bedeuten. Der Fund alter Stoffe spricht hier eher für einen Lager- oder Vorratsraum.
- source_word: בְּלוֹיֵ הַסְּחָבוֹת
  choice: abgenutzte Lumpen
  rationale: בְּלוֹיֵ drückt Abnutzung aus, während סחבות Lumpen oder Stofffetzen bezeichnet.
- source_word: וּבְלוֹיֵ מְלָחִים
  choice: abgetragene Kleidungsstücke
  rationale: מְלָחִים ist selten und in seiner genauen Bedeutung unsicher. Der Parallelismus und der folgende Vers weisen auf alte Textilien hin; »Kleidungsstücke« bewahrt die Unterscheidung von den zuvor genannten Lumpen.
- source_word: וַיְשַׁלְּחֵם ... בַּחֲבָלִים
  choice: ließ sie an Seilen ... hinab
  rationale: Das Verb bedeutet grundsätzlich »schicken/senden«; Ziel und Mittel ergeben hier die Bewegung hinab in die Zisterne. »Ließ ... hinab« gibt diesen räumlichen Sinn idiomatisch wieder.
- source_word: הַבּוֹר
  choice: Zisterne
  rationale: בּוֹר kann Grube oder Zisterne bezeichnen. Im unmittelbaren Erzählzusammenhang handelt es sich um die als Gefängnis benutzte Zisterne.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Königspalast« vermeidet die im Deutschen missverständliche wörtliche Form »Haus des Königs«. Die seltene Bezeichnung מְלָחִים wird im Haupttext kontextgerecht, aber in der Fußnote ausdrücklich als unsicher gekennzeichnet.
