source:
  edition: WLC
  text: וַ/יְצַוֶּ֣ה הַ/מֶּ֔לֶךְ אֵ֛ת עֶֽבֶד מֶ֥לֶךְ הַ/כּוּשִׁ֖י לֵ/אמֹ֑ר קַ֣ח בְּ/יָדְ/ךָ֤ מִ/זֶּה֙ שְׁלֹשִׁ֣ים אֲנָשִׁ֔ים וְֽ/הַעֲלִ֜יתָ אֶֽת יִרְמְיָ֧הוּ הַ/נָּבִ֛יא מִן הַ/בּ֖וֹר בְּ/טֶ֥רֶם יָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/010.yaml
  text: Then the king commanded Ebed-melech the Cushite[a], saying, “Take with you from here thirty men[b], and bring Jeremiah the prophet up from the cistern before he dies.”
translation:
  language: de
  text: 'Da befahl der König Ebed-Melech, dem Kuschiten[a]: „Nimm von hier dreißig Männer mit dir und hol den Propheten Jeremia aus der Zisterne[b] herauf, bevor er stirbt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Äthiopier“. Im Hebräischen steht „dem Kuschiten“, also einem Mann aus Kusch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Grube“. Das hebräische Wort kann eine Grube oder Zisterne bezeichnen; hier passt „Zisterne“ zum erzählten Zusammenhang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה הַמֶּלֶךְ
  choice: Da befahl der König
  rationale: צוה bezeichnet hier einen verbindlichen königlichen Befehl; die Erzählform wird im Deutschen natürlich mit „Da“ und Präteritum wiedergegeben.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebed-Melech
  rationale: Die Wortfolge wird im Zusammenhang als Personenname verstanden und daher transliteriert, nicht als „Diener des Königs“ übersetzt.
- source_word: הַכּוּשִׁי
  choice: dem Kuschiten
  rationale: Die Bezeichnung meint einen Mann aus Kusch. „Kuschit“ gibt den hebräischen ethnogeografischen Ausdruck genauer wieder als das traditionelle „Äthiopier“.
- source_word: קַח בְּיָדְךָ מִזֶּה
  choice: Nimm von hier … mit dir
  rationale: Wörtlich steht „nimm in deine Hand von hier“; idiomatisch geht es darum, die Männer unter eigener Führung mitzunehmen.
- source_word: שְׁלֹשִׁים אֲנָשִׁים
  choice: dreißig Männer
  rationale: Die masoretische Vorlage nennt ausdrücklich dreißig Männer; Geschlecht und Zahl bleiben erhalten.
- source_word: וְהַעֲלִיתָ
  choice: hol … herauf
  rationale: Der Hifil von עלה bezeichnet das Hinaufbringen. „Heraufholen“ passt natürlich zur Rettung aus einer tiefen Zisterne.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: den Propheten Jeremia
  rationale: Name und Titel werden vollständig bewahrt; diese Wortstellung ist im modernen Deutschen natürlich.
- source_word: מִן הַבּוֹר
  choice: aus der Zisterne
  rationale: בּוֹר kann Grube oder Zisterne bedeuten. Der erzählerische Zusammenhang mit dem Schlamm in einem Wasserspeicher spricht hier für „Zisterne“.
- source_word: בְּטֶרֶם יָמוּת
  choice: bevor er stirbt
  rationale: בטרם setzt eine zeitliche Grenze; die schlichte Formulierung bewahrt die Dringlichkeit des bevorstehenden Todes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und befehlend formuliert. „Ebed-Melech“ bleibt als Personenname erhalten; „Kuschit“ vermeidet eine vorschnelle Gleichsetzung des antiken Kusch mit dem heutigen Äthiopien.
