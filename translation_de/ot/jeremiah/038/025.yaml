source:
  edition: WLC
  text: וְ/כִֽי יִשְׁמְע֣וּ הַ/שָּׂרִים֮ כִּֽי דִבַּ֣רְתִּי אִתָּ/ךְ֒ וּ/בָ֣אוּ אֵלֶ֣י/ךָ וְֽ/אָמְר֪וּ אֵלֶ֟י/ךָ הַגִּֽידָ/ה נָּ֨א לָ֜/נוּ מַה דִּבַּ֧רְתָּ אֶל הַ/מֶּ֛לֶךְ אַל תְּכַחֵ֥ד מִמֶּ֖/נּוּ וְ/לֹ֣א נְמִיתֶ֑/ךָ וּ/מַה דִּבֶּ֥ר אֵלֶ֖י/ךָ הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
translation:
  language: de
  text: 'Wenn aber die Amtsträger[a] hören, dass ich mit dir gesprochen habe, und zu dir kommen und zu dir sagen: »Sag uns bitte, was du zum König gesagt hast. Verschweige es uns nicht, dann werden wir dich nicht töten. Und was hat der König zu dir gesagt?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Fürsten; gemeint sind königliche oder leitende Amtsträger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Wenn aber
  rationale: Die Verbindung leitet eine bedingte Möglichkeit ein und führt zugleich die vorausgehende Rede mit leichtem Gegensatz weiter.
- source_word: הַשָּׂרִים
  choice: die Amtsträger
  rationale: Gemeint sind führende Männer am judäischen Königshof, nicht notwendigerweise Königssöhne. »Amtsträger« ist im modernen Deutsch klar und sachlich.
- source_word: דִבַּרְתִּי אִתָּךְ
  choice: ich mit dir gesprochen habe
  rationale: Das Perfekt bezeichnet hier das abgeschlossene Gespräch, dessen mögliches Bekanntwerden anschließend angenommen wird.
- source_word: וּבָאוּ אֵלֶיךָ וְאָמְרוּ אֵלֶיךָ
  choice: und zu dir kommen und dich fragen
  rationale: Das wörtliche »zu dir sagen« wird im Deutschen aufgrund des folgenden verlangenden Fragesatzes idiomatisch mit »dich fragen« wiedergegeben.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Sag uns bitte
  rationale: Der Imperativ mit נָא verbindet eine dringliche Aufforderung mit höflich formulierter Bitte.
- source_word: מַה דִּבַּרְתָּ אֶל הַמֶּלֶךְ
  choice: was du zum König gesagt hast
  rationale: »Zu jemandem sagen« gibt die auf den König gerichtete Rede im Deutschen natürlich wieder.
- source_word: אַל תְּכַחֵד מִמֶּנּוּ
  choice: Verschweige es uns nicht
  rationale: כחד bezeichnet hier das Verheimlichen beziehungsweise Zurückhalten der verlangten Auskunft; das im Hebräischen unausgesprochene Objekt wird mit »es« aufgenommen.
- source_word: וְלֹא נְמִיתֶךָ
  choice: dann werden wir dich nicht töten
  rationale: Der Hifil von מות hat kausative Bedeutung. »Töten« gibt die Drohung direkt wieder; »dann« verdeutlicht im Deutschen die im Zusammenhang erkennbare Bedingungsfolge.
- source_word: וּמַה דִּבֶּר אֵלֶיךָ הַמֶּלֶךְ
  choice: Und was hat der König zu dir gesagt?
  rationale: Die abschließende koordinierte Frage wird als eigenständige direkte Frage formuliert, ohne ihren Anschluss an die verlangte Auskunft aufzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt eindringlich und bewahrt sowohl die Bitte als auch die darin enthaltene Todesdrohung.
