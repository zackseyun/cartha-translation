  to: 'Wenn aber die Amtsträger[a] hören, dass ich mit dir gesprochen habe, und zu dir kommen und zu dir sagen: »Sag uns bitte, was du zum König gesagt hast. Verschweige es uns nicht, dann werden wir dich nicht töten. Und was hat der König zu dir gesagt?«'
