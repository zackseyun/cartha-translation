  text: וַ/יֵּצֵ֥א עֶֽבֶד מֶ֖לֶךְ מִ/בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְדַבֵּ֥ר אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/008.yaml
  text: Then Ebed-melech went out from the king’s house and spoke to the king[a], saying,
translation:
  language: de
  text: 'Da ging Ebed-Melech aus dem Haus des Königs[a] und sprach zum König:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus dem Palast“. Wörtlich steht im Hebräischen: „aus dem Haus des Königs“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da ging … aus
  rationale: Der Wayyiqtol von יצא führt die Erzählung fort und bezeichnet eine Bewegung nach draußen. „Da ging … aus“ gibt beides in natürlichem, gehobenem Deutsch wieder.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebed-Melech
  rationale: Die Wortfolge ist hier ein Personenname und wird daher transliteriert, nicht als gewöhnliche Nominalverbindung übersetzt.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: aus dem Haus des Königs
  rationale: בַּיִת bedeutet wörtlich „Haus“ und kann im königlichen Zusammenhang den Palast bezeichnen. Die gewählte Form bewahrt den hebräischen Ausdruck und bleibt verständlich.
- source_word: וַיְדַבֵּר אֶל הַמֶּלֶךְ
  choice: und sprach zum König
  rationale: דבר mit אֶל bedeutet „zu jemandem sprechen“. „Sprach zum König“ wahrt zudem die Unterscheidung zum anschließenden לֵאמֹר.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die Infinitivformel leitet die im folgenden Vers einsetzende direkte Rede ein. Im natürlichen deutschen Erzählstil erfüllt ein Doppelpunkt diese Funktion präzise, ohne ein schwerfälliges „und sagte“ hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen; die Redeeinleitungsformel לֵאמֹר wird idiomatisch durch einen Doppelpunkt wiedergegeben.
