  text: וַ/יִּשְׁמַ֞ע שְׁפַטְיָ֣ה בֶן מַתָּ֗ן וּ/גְדַלְיָ֨הוּ֙ בֶּן פַּשְׁח֔וּר וְ/יוּכַל֙ בֶּן שֶׁ֣לֶמְיָ֔הוּ וּ/פַשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה אֶ֨ת הַ/דְּבָרִ֔ים אֲשֶׁ֧ר יִרְמְיָ֛הוּ מְדַבֵּ֥ר אֶל כָּל הָ/עָ֖ם לֵ/אמֹֽר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
translation:
  language: de
  text: 'Schefatja, der Sohn Mattans, Gedalja, der Sohn Paschhurs, Juchal[a], der Sohn Schelemjas, und Paschhur, der Sohn Malkijas, hörten die Worte, die Jeremia an das ganze Volk richtete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Name lautet hier יוּכַל (Juchal); dieselbe Person erscheint in Jeremia 37,3 unter der längeren Namensform יְהוּכַל (Jehuchal).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörten
  rationale: Das Qal-Wayyiqtol bezeichnet hier das konkrete Hören von Jeremias Worten. Wegen des mehrteiligen Subjekts steht das Verb im Deutschen idiomatisch im Plural; ein einleitendes „Nun“ ist im Hebräischen nicht ausdrücklich vorhanden.
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַּשְׁחוּר
  choice: Schefatja ... Gedalja ... Juchal ... Paschhur
  rationale: Die Personennamen werden in einer im Deutschen lesbaren, am Hebräischen orientierten Form wiedergegeben. Bei יוּכַל wird die hier vorliegende kürzere Namensform „Juchal“ bewahrt.
- source_word: בֶּן
  choice: der Sohn
  rationale: Die übliche genealogische und identifizierende Angabe wird transparent mit „der Sohn“ wiedergegeben.
- source_word: אֶת הַדְּבָרִים
  choice: die Worte
  rationale: דְּבָרִים bezeichnet hier den gesprochenen Inhalt Jeremias; „die Worte“ ist direkt und kontextgerecht.
- source_word: אֲשֶׁר יִרְמְיָהוּ מְדַבֵּר
  choice: die Jeremia ... richtete
  rationale: Das Partizip stellt Jeremias Reden als im Verlauf befindlich dar. Die idiomatische Wendung „Worte an jemanden richten“ gibt diesen Sprechvorgang natürlich wieder.
- source_word: אֶל כָּל הָעָם
  choice: an das ganze Volk
  rationale: עָם meint hier die Gesamtheit der von Jeremia angesprochenen Menschen; „das ganze Volk“ wahrt diesen Umfang.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt übernimmt im Deutschen natürlich die Funktion des hebräischen Zitatankündigers und leitet die in Vers 2 folgende direkte Rede ein.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Form „der Sohn“ hält die vier Personen auch in der längeren Aufzählung klar auseinander. Der Doppelpunkt schafft einen natürlichen Übergang zur folgenden wörtlichen Rede.
