base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/026.yaml
  text: Then you shall say to them[a], ‘I was presenting my plea before the king, that he should not send me back to the house of Jonathan to die there.’
translation:
  language: de
  text: 'Dann sollst du ihnen sagen: »Ich brachte dem König meine Bitte vor[a], mich nicht in das Haus Jonatans zurückbringen zu lassen, damit ich dort nicht sterbe.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ich lasse meine flehentliche Bitte vor dem König niederfallen.“ Das hebräische Partizip kann gegenwärtig formuliert werden; im Zusammenhang berichtet Jeremia jedoch von seiner gerade beendeten Unterredung mit dem König.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Dann sollst du ihnen sagen
  rationale: Das mit וְ eingeleitete Perfekt steht hier in einer Anweisung und führt die Handlungsfolge weiter. „Dann sollst du“ gibt diese Funktion in natürlichem Deutsch wieder.
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַמֶּלֶךְ
  choice: Ich brachte dem König meine Bitte vor
  rationale: Die hebräische Wendung bedeutet wörtlich, eine Bitte vor jemandem „niederfallen zu lassen“, und bezeichnet eine inständige Bitte. Das Partizip mit אֲנִי ist imperfektiv; im Erzählzusammenhang ist der Rückblick mit deutschem Präteritum natürlich, während die Fußnote die wörtlichere präsentische Form erkennen lässt.
- source_word: תְחִנָּתִי
  choice: meine Bitte
  rationale: Das Substantiv bezeichnet eine inständige Bitte um Gunst oder Erbarmen. „Bitte“ ist gegenwärtig, verständlich und wird durch die idiomatische Gesamtformulierung ausreichend gewichtet.
- source_word: לְבִלְתִּי הֲשִׁיבֵנִי
  choice: mich nicht … zurückbringen zu lassen
  rationale: Die Konstruktion bezeichnet den Inhalt beziehungsweise Zweck der Bitte. Die kausative Verbform verlangt, dass der König Jeremia nicht zurückbringen lässt; die deutsche Infinitivkonstruktion gibt dies ohne unnötige Ergänzung eines handelnden Untergebenen wieder.
- source_word: בֵּית יְהוֹנָתָן
  choice: das Haus Jonatans
  rationale: Die Status-constructus-Verbindung wird transparent wiedergegeben und bewahrt die im Erzählzusammenhang wiederkehrende Bezeichnung des Haftortes.
- source_word: לָמוּת שָׁם
  choice: damit ich dort nicht sterbe
  rationale: Der Infinitiv bezeichnet hier das befürchtete Ergebnis einer Rückkehr. Die deutsche Formulierung macht den in der Verneinung des Zurückbringens enthaltenen negativen Zweck verständlich, ohne den Ernst der Todesgefahr abzuschwächen.
