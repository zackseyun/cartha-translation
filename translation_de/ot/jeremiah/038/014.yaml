  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יִּקַּ֞ח אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ אֵלָ֔י/ו אֶל מָבוֹא֙ הַ/שְּׁלִישִׁ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶֽל יִרְמְיָ֗הוּ שֹׁאֵ֨ל אֲנִ֤י אֹֽתְ/ךָ֙ דָּבָ֔ר אַל תְּכַחֵ֥ד מִמֶּ֖/נִּי דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/014.yaml
  text: Then King Zedekiah sent and took Jeremiah the prophet to himself[a], to the third entrance that is in the house of Yahweh, and the king said to Jeremiah, “I am asking you something[b]; do not hide anything from me.”
translation:
  language: de
  text: 'Da schickte König Zedekia nach dem Propheten Jeremia und ließ ihn zu sich an den dritten Eingang bringen, der sich im Haus Jahwes[a] befand. Der König sagte zu Jeremia: »Ich frage dich etwas. Verheimliche mir nichts.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Verbirg mir nichts“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקַּח
  choice: schickte ... nach ... und ließ ihn ... bringen
  rationale: Die beiden aufeinanderfolgenden Verben werden in natürlichem Deutsch als Beauftragung und Herbeibringen wiedergegeben. Dadurch bleibt der Handlungsablauf erhalten, ohne das im Deutschen missverständliche wörtliche „nahm“ zu verwenden.
- source_word: אֵלָיו
  choice: zu sich
  rationale: Die Form bezeichnet die Bewegung zu König Zedekia hin; „zu sich“ gibt den persönlichen Bezug knapp und idiomatisch wieder.
- source_word: מָבוֹא הַשְּׁלִישִׁי
  choice: der dritte Eingang
  rationale: מָבוֹא bezeichnet hier einen Zugang oder Eingang. Die Ordnungszahl „dritte“ bleibt ohne weitere, im Text nicht ausdrücklich gegebene Deutung erhalten.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die Wiedergabe bewahrt das konkrete Bild von בַּיִת („Haus“) und gibt den Gottesnamen in der im Deutschen üblichen Form „Jahwe“ wieder.
- source_word: שֹׁאֵל אֲנִי אֹתְךָ דָּבָר
  choice: Ich frage dich jetzt etwas
  rationale: Das Partizip mit selbstständigem Pronomen bezeichnet eine unmittelbar gegenwärtige Handlung. „Etwas“ gibt דָּבָר in diesem Zusammenhang idiomatisch wieder; „jetzt“ verdeutlicht die Unmittelbarkeit, ohne den Inhalt näher festzulegen.
- source_word: אַל תְּכַחֵד מִמֶּנִּי דָּבָר
  choice: Verheimliche mir nichts
  rationale: כחד bedeutet „verbergen, verheimlichen“. Die knappe deutsche Formulierung bewahrt den umfassenden Sinn von „kein Ding/nichts“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה, nicht einen Herrschaftstitel. „Jahwe“ wahrt diesen Unterschied und entspricht der gebräuchlichen deutschen Umschrift, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem hebräischen Erzählablauf, wird jedoch für gute Verständlichkeit geglättet. Die Ortsangabe bleibt bewusst als „dritter Eingang“ stehen, da der Text dessen genaue Lage oder Funktion nicht erklärt.
