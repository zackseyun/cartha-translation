base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
translation:
  language: de
  text: 'Jeremia sagte zu Zedekia: „Wenn ich dir etwas sage, wirst du mich dann nicht gewiss töten?[a] Und wenn ich dir einen Rat gebe, wirst du nicht auf mich hören.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage: „wirst du mich nicht gewiss töten?“'
    reason: lexical_alternative
  - marker: b
    text: „Auf mich hören“ kann hier auch „mich beachten“ oder „mir gehorchen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  choice: Wenn ich es dir sage
  rationale: כִּי leitet hier im Zusammenhang eine Bedingung ein; נגד im Hifil bedeutet „mitteilen, kundtun“. Das vorangestellte „es“ nimmt den erfragten Sachverhalt natürlich auf.
- source_word: הֲלוֹא
  choice: wirst du dann nicht
  rationale: Die Partikel kennzeichnet eine rhetorische Frage, die eine bejahende Antwort erwartet; „dann“ verdeutlicht im Deutschen den Zusammenhang mit dem Bedingungssatz.
- source_word: הָמֵת תְּמִיתֵנִי
  choice: ganz sicher töten
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt die Aussage. „Ganz sicher“ gibt diese Emphase in natürlichem modernem Deutsch wieder.
- source_word: וְכִי אִיעָצְךָ
  choice: Und wenn ich dir einen Rat gebe
  rationale: וְכִי führt den parallelen zweiten Bedingungssatz ein; יעץ bedeutet hier „raten, beraten“. Die gewählte Wendung ist klar und idiomatisch.
- source_word: לֹא תִשְׁמַע אֵלָי
  choice: wirst du nicht auf mich hören
  rationale: שׁמע mit אֶל bezeichnet das Hören auf jemanden und kann kontextuell auch „beachten“ oder „gehorchen“ einschließen. Die Formulierung bewahrt diesen Bedeutungsspielraum.
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  choice: Jeremia / Zedekia
  rationale: Die Personennamen folgen den im Deutschen üblichen biblischen Namensformen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter und natürlicher Rede. Die rhetorische Frage und die emphatische Tötungsdrohung bleiben erhalten; beim Verb „hören“ wird die mögliche Bedeutungskomponente des Befolgens nicht einseitig festgelegt.
