id: JER.38.17
reference: Jeremiah 38:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
translation:
  language: de
  text: 'Da sagte Jeremia zu Zedekia: »So spricht Jahwe, der Gott der Heerscharen, der Gott Israels: Wenn du wirklich zu den führenden Männern des Königs von Babel hinausgehst[a], wird dein Leben verschont bleiben[b], und diese Stadt wird nicht mit Feuer verbrannt werden. Du und deine Hausgemeinschaft werdet am Leben bleiben[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Wenn du gewiss hinausgehst«. Das Hebräische verstärkt das Verb durch die Verbindung eines absoluten Infinitivs mit einer finiten Verbform.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »Dann wird deine Seele leben«. Das hebräische Wort für »Seele« bezeichnet hier das Leben oder die Person selbst, also ihr Überleben.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: »Du und dein Haus werdet leben«. Mit »Haus« ist hier die Hausgemeinschaft gemeint, besonders Familie und Abhängige, nicht nur das Gebäude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  choice: Da sagte Jeremia zu Zedekia
  rationale: Das narrative wayyiqtol führt die Handlung weiter; »Da sagte« gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im Deutschen geläufige Form.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Die Wiedergabe erhält die hebräische Genitivverbindung und die umfassende, nicht ausschließlich militärisch festgelegte Bedeutung von צְבָאוֹת.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die formnahe Wiedergabe bewahrt die klare Beziehung Gottes zu Israel.
- source_word: אִם יָצֹא תֵצֵא
  choice: Wenn du wirklich … hinausgehst
  rationale: »Wirklich« bringt die Betonung durch den Infinitivus absolutus mit finitem Verb in natürlichem Deutsch zum Ausdruck.
- source_word: אֶל שָׂרֵי מֶלֶךְ בָּבֶל
  choice: zu den führenden Männern des Königs von Babel
  rationale: שָׂרִים kann Fürsten, hohe Beamte oder Befehlshaber bezeichnen. Die gewählte Form hält die Funktion offen und bezeichnet die maßgeblichen Vertreter des babylonischen Königs.
- source_word: וְחָיְתָה נַפְשֶׁךָ
  choice: wird dein Leben verschont bleiben
  rationale: נֶפֶשׁ bezeichnet hier das konkrete Leben beziehungsweise die Person im Blick auf ihr Überleben, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: לֹא תִשָּׂרֵף בָּאֵשׁ
  choice: wird nicht mit Feuer verbrannt werden
  rationale: Die Formulierung bewahrt sowohl das Passiv als auch die ausdrückliche Nennung des Feuers.
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  choice: Du und deine Hausgemeinschaft werdet am Leben bleiben
  rationale: בַּיִת bezeichnet hier nicht bloß das Gebäude, sondern die zum Haus gehörende Familie und die Abhängigen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm יהוה. Die Wiedergabe als Eigenname bewahrt diesen Befund, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von נֶפֶשׁ in einer Überlebensaussage
  choice: dein Leben wird verschont bleiben
  alternative: deine Seele wird leben
  rationale: Im Zusammenhang mit der drohenden Tötung bezeichnet נֶפֶשׁ das Leben oder die Person. Die Übersetzung vermeidet es, dem Vers eine spätere anthropologische Unterscheidung aufzuerlegen.
- issue: Bedeutung von בֵּיתֶךָ
  choice: deine Hausgemeinschaft
  alternative: dein Haus
  rationale: Gemeint ist wahrscheinlich Zedekias Familie samt den von seinem Haus abhängigen Personen. »Hausgemeinschaft« macht diesen sozialen Sinn deutlich, ohne ihn auf das Gebäude zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Redeeinleitung. »Heerscharen« wahrt den traditionsreichen, aber noch verständlichen Ausdruck; »führende Männer« und »Hausgemeinschaft« vermeiden unnötige institutionelle beziehungsweise bauliche Verengungen.
