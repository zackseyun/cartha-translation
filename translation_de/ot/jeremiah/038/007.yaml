  text: וַ/יִּשְׁמַ֡ע עֶֽבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אִ֣ישׁ סָרִ֗יס וְ/הוּא֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ כִּֽי נָתְנ֥וּ אֶֽת יִרְמְיָ֖הוּ אֶל הַ/בּ֑וֹר וְ/הַ/מֶּ֥לֶךְ יוֹשֵׁ֖ב בְּ/שַׁ֥עַר בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/007.yaml
  text: Ebed-melech the Cushite[a], a court official who was in the king’s house, heard that they had put Jeremiah into the cistern[c][b], while the king was sitting at the Benjamin Gate.
translation:
  language: de
  text: Ebed-Melech, der Kuschiter[a], ein Hofbeamter[b], der im Königspalast war, hörte, dass man Jeremia in die Zisterne[c] gebracht hatte, während der König am Benjamintor saß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Kuschiter war ein Mann aus Kusch; in älteren Übersetzungen steht häufig „Äthiopier“.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ein Eunuch“. Das hebräische Wort kann einen Eunuchen oder allgemeiner einen königlichen Hofbeamten bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in die Grube“. Das hebräische Wort kann eine Grube oder eine Zisterne bezeichnen; im unmittelbaren Zusammenhang ist eine Zisterne gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: Die narrative Verbform führt die Handlung mit der unmittelbaren Bedeutung „hörte“ weiter; ein zusätzliches „nun“ ist im Hebräischen nicht ausdrücklich vorhanden.
- source_word: עֶבֶד מֶלֶךְ
  choice: Ebed-Melech
  rationale: Die Wortfolge dient hier als Personenname und wird daher transliteriert, nicht als „Diener des Königs“ übersetzt.
- source_word: הַכּוּשִׁי
  choice: der Kuschit
  rationale: Die Bezeichnung meint einen Mann aus Kusch. „Kuschit“ bewahrt den hebräischen ethnogeografischen Bezug genauer als das traditionelle „Äthiopier“.
- source_word: אִישׁ סָרִיס
  choice: ein Hofbeamter
  rationale: סָרִיס kann einen Eunuchen oder allgemeiner einen königlichen Amtsträger bezeichnen. „Hofbeamter“ gibt in diesem Zusammenhang die erkennbare Funktion natürlich wieder; die konkrete Alternative bleibt in der Fußnote erhalten.
- source_word: וְהוּא בְּבֵית הַמֶּלֶךְ
  choice: der sich im Königspalast befand
  rationale: בֵּית הַמֶּלֶךְ bezeichnet hier den königlichen Palastbereich. Die Relativkonstruktion ist im Deutschen natürlich und erhält die Ortsangabe.
- source_word: כִּי
  choice: dass
  rationale: כִּי leitet hier den Inhalt dessen ein, was Ebed-Melech hörte.
- source_word: נָתְנוּ אֶת יִרְמְיָהוּ אֶל הַבּוֹר
  choice: dass man Jeremia in die Zisterne geworfen hatte
  rationale: בּוֹר kann Grube oder Zisterne bedeuten; der unmittelbare Kontext spricht für eine Zisterne. Das unpersönliche „man“ gibt das nicht näher bestimmte pluralische Subjekt idiomatisch wieder. „Geworfen“ passt zum Hinablassen in den Haftort und entspricht dem etablierten Kontext, obwohl נָתַן wörtlicher „hineingetan“ bedeutet.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: während der König … saß
  rationale: Die Nominalkonstruktion beschreibt einen gleichzeitig bestehenden Hintergrundzustand.
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: am Benjamintor
  rationale: Dies ist die natürliche deutsche Bezeichnung und Ortsangabe für das benannte Stadttor.
