  to: 'Da sagten die führenden Männer zum König: „Dieser Mann soll doch getötet werden! Denn indem er zu ihnen solche Worte redet, entmutigt er die Kämpfer, die in dieser Stadt zurückgeblieben sind, ebenso wie das ganze Volk. Denn dieser Mann sucht nicht das Wohl[a] dieses Volkes, sondern sein Unheil.“'
  rationale: Die Revision stellt das im Hebräischen ausdrücklich genannte Reden zu den Betroffenen wieder her, ersetzt die historisierende Bezeichnung „Kriegsleute“ durch das moderne, weiterhin nicht zu enge „Kämpfer“ und entfernt ein nicht erforderliches verstärkendes Modalpartikel. Bedeutung, Anklageton und die lexikalische Ambiguität von שָׁלוֹם bleiben erhalten.
