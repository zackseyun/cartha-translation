source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הַ/שָּׂרִ֜ים אֶל הַ/מֶּ֗לֶךְ י֣וּמַת נָא֮ אֶת הָ/אִ֣ישׁ הַ/זֶּה֒ כִּֽי עַל כֵּ֡ן הֽוּא מְרַפֵּ֡א אֶת יְדֵי֩ אַנְשֵׁ֨י הַ/מִּלְחָמָ֜ה הַֽ/נִּשְׁאָרִ֣ים בָּ/עִ֣יר הַ/זֹּ֗את וְ/אֵת֙ יְדֵ֣י כָל הָ/עָ֔ם לְ/דַבֵּ֣ר אֲלֵי/הֶ֔ם כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה כִּ֣י הָ/אִ֣ישׁ הַ/זֶּ֗ה אֵינֶ֨/נּוּ דֹרֵ֧שׁ לְ/שָׁל֛וֹם לָ/עָ֥ם הַ/זֶּ֖ה כִּ֥י אִם לְ/רָעָֽה־־־־־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/004.yaml
  text: Then the officials said to the king[a], “Please let this man be put to death, for in this way he is weakening the hands of the men of war who remain in this city, and the hands of all the people, by speaking to them words like these. For this man is not seeking the welfare of this people[c][b], but their harm.”
translation:
  language: de
  text: 'Da sagten die führenden Männer zum König: „Dieser Mann soll doch getötet werden! Denn indem er zu ihnen solche Worte redet, entmutigt er die Kämpfer, die in dieser Stadt zurückgeblieben sind, ebenso wie das ganze Volk. Denn dieser Mann sucht nicht das Wohl[a] dieses Volkes, sondern sein Unheil.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Frieden“. Das hebräische Wort kann Frieden, Wohlergehen und Gedeihen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: Der Ausdruck bezeichnet hier hochgestellte politische oder militärische Amtsträger. „Führende Männer“ bleibt hinsichtlich ihres genauen Amtes offen und klingt im modernen Deutsch natürlicher als „Fürsten“.
- source_word: יוּמַת נָא
  choice: Dieser Mann soll doch getötet werden!
  rationale: Die jussivische Passivform fordert seine Tötung; נָא kennzeichnet hier den nachdrücklichen Appell. „Soll doch getötet werden“ bewahrt Forderung und appellativen Ton, ohne ein förmliches Gerichtsverfahren ausdrücklich vorauszusetzen.
- source_word: מְרַפֵּא אֶת יְדֵי
  choice: entmutigt
  rationale: Wörtlich werden die Hände schlaff gemacht. Das deutsche „entmutigt“ gibt die Bedeutung des hebräischen Idioms unmittelbar und natürlich wieder.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: die Kriegsleute
  rationale: Der Ausdruck bezeichnet die zum Kampf eingesetzten Männer. „Kriegsleute“ erhält die maskuline und militärische Färbung, ohne einen modernen militärischen Dienstgrad anzudeuten.
- source_word: לְדַבֵּר אֲלֵיהֶם כַּדְּבָרִים הָאֵלֶּה
  choice: mit solchen Worten
  rationale: Das כַּ bezeichnet Worte dieser Art. Die knappe Formulierung gibt zugleich das Mittel an, durch das Jeremia nach der Anklage die Menschen entmutigt.
- source_word: דֹרֵשׁ לְשָׁלוֹם
  choice: sucht ... das Wohl
  rationale: שָׁלוֹם kann Frieden, Wohlergehen und Gedeihen umfassen. Im Gegensatz zu רָעָה passt „Wohl“ am besten, während die Alternative „Frieden“ in einer Fußnote bewahrt wird.
- source_word: כִּי אִם לְרָעָה
  choice: sondern sein Unglück
  rationale: רָעָה steht antithetisch zu שָׁלוֹם und kann Unheil, Unglück oder Schaden meinen. „Sein Unglück“ bezieht sich eindeutig auf das Volk und erhält die zugespitzte Gegenüberstellung.
theological_decisions:
- issue: Bedeutungsumfang von שָׁלוֹם
  choice: Wohl
  alternative: Frieden
  rationale: Der Kontext betrifft das behauptete Interesse am Ergehen des Volkes insgesamt. Da „Frieden“ dennoch eine echte lexikalische Möglichkeit und im Kriegskontext besonders naheliegend ist, wird sie nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das schwer verständliche hebräische Bild vom Erschlaffen der Hände wird im Haupttext idiomatisch mit „entmutigt“ wiedergegeben. Die Wiederholung des Bildes bei Volk und Kriegsleuten wird durch die gemeinsame Satzkonstruktion abgebildet. Der anklagende und drängende Ton der Rede bleibt erhalten.
