  terminology: „führende Männer“ ist als nicht weiter spezifizierende Wiedergabe von הַשָּׂרִים vertretbar. „soll doch getötet werden“ gibt die nachdrückliche Bitte bzw. Forderung von יוּמַת נָא angemessen wieder, ohne einen formalen Rechtsvorgang hineinzulesen. „Wohl“ für שָׁלוֹם und „Unheil“ für רָעָה bilden einen passenden Kontrast; die Fußnote bewahrt die relevante Alternative „Frieden“.
