  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
translation:
  language: de
  text: 'So spricht Jahwe: Wer in dieser Stadt bleibt, wird durch das Schwert, durch Hunger und durch die Pest sterben. Wer aber zu den Chaldäern hinausgeht, wird leben; sein Leben wird ihm als Beute zufallen[a], und er wird leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Bild bedeutet: Er wird mit dem Leben davonkommen; sein Leben ist die Beute, die er davonträgt.'
    reason: Erklärung des hebräischen Idioms bei Bewahrung der Beute-Metapher im Haupttext.
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und entspricht der etablierten deutschen Form.
- source_word: הַיֹּשֵׁב בָּעִיר הַזֹּאת
  choice: Wer in dieser Stadt bleibt
  rationale: ישׁב bezeichnet hier das Verbleiben in der belagerten Stadt, nicht wörtlich das Sitzen; die generische Form „wer“ ist im Deutschen natürlich.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: durch das Schwert, durch Hunger und durch die Pest
  rationale: Bewahrt die für Jeremia typische dreigliedrige Gerichtsformel; „Pest“ gibt דֶּבֶר im prophetischen Kontext prägnant wieder.
- source_word: וְהַיֹּצֵא אֶל הַכַּשְׂדִּים
  choice: Wer aber zu den Chaldäern hinausgeht
  rationale: „Hinausgeht“ bleibt näher am Wortlaut als das deutende „sich ergibt“; „aber“ macht den im Kontext klaren Gegensatz natürlich sichtbar.
- source_word: יִחְיֶה ... וָחָי
  choice: wird leben ... und er wird leben
  rationale: Erhält die bewusste Wiederholung der Lebenszusage im Hebräischen.
- source_word: וְהָיְתָה לּוֹ נַפְשׁוֹ לְשָׁלָל
  choice: sein Leben wird ihm zur Beute werden
  rationale: נֶפֶשׁ meint hier das bewahrte Leben; „zur Beute“ erhält das Kriegsbild des hebräischen Idioms, ohne es im Haupttext aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich; „Jahwe“ bewahrt den Charakter als Gottesname.
- issue: Bedeutung von נֶפֶשׁ in der Wendung נַפְשׁוֹ לְשָׁלָל
  choice: sein Leben ... zur Beute
  alternative: seine Seele ... zur Beute
  rationale: Im Zusammenhang von Belagerung und Todesgefahr bezeichnet נֶפֶשׁ das physische Leben beziehungsweise die eigene Person, nicht spezifisch eine immaterielle Seele.
- issue: Bedeutung des Hinausgehens zu den Chaldäern
  choice: zu den Chaldäern hinausgeht
  alternative: sich den Chaldäern ergibt
  rationale: Eine Kapitulation ist kontextuell gemeint, wird durch das Verb selbst aber nicht ausdrücklich benannt; daher bleibt die Übersetzung bei der offenen Bildsprache des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die generische Konstruktion mit „wer“ vermeidet unnötig männlich markierte Formulierungen. Die Wiederholung „wird leben ... wird leben“ und das Beutebild bleiben als rhetorische Merkmale des Hebräischen erhalten.
