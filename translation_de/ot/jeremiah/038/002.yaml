revisions:
- from: 'So spricht Jahwe: Wer in dieser Stadt bleibt, wird durch das Schwert, durch Hunger und durch die Pest sterben. Wer aber zu den Chaldäern hinausgeht, wird leben; sein Leben wird ihm zur Beute werden[a], und er wird leben.'
  to: 'So spricht Jahwe: Wer in dieser Stadt bleibt, wird durch das Schwert, durch Hunger und durch die Pest sterben. Wer aber zu den Chaldäern hinausgeht, wird leben; sein Leben wird ihm als Beute zufallen[a], und er wird leben.'
  rationale: Die Änderung betrifft ausschließlich die deutsche Wiedergabe von נפשו לשלל. „Als Beute zufallen“ ist eine natürliche deutsche Konstruktion, bewahrt das Kriegsbild und verdeutlicht, dass das gerettete Leben dem Betroffenen als sein Gewinn zukommt. Der Fußnotenanker bleibt unmittelbar bei der idiomatischen Wendung.
