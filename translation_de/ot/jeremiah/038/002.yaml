  verdict: revise
  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des Hebräischen zuverlässig wieder: Gottesname, Verbleiben in der Stadt, die dreifache Todesandrohung, das Hinausgehen zu den Chaldäern sowie die betonte Wiederholung von „leben“. Die offene Formulierung „zu den Chaldäern hinausgeht“ vermeidet die nicht ausdrücklich im Verb enthaltene Einengung auf „sich ergeben“.'
  naturalness: „Sein Leben wird ihm zur Beute werden“ ist verständlich, klingt im heutigen Standarddeutsch jedoch unnötig schwerfällig und kann den Sinn nahelegen, sein Leben selbst werde zur Beute eines anderen. „Sein Leben wird ihm als Beute zufallen“ ist idiomatischer und bildet die hebräische Beute-Metapher weiterhin ab.
  terminology: „Jahwe“, „Chaldäer“, „Schwert“, „Hunger“ und „Pest“ sind sachgerecht und im würdigen prophetischen Register angemessen. „Leben“ gibt נפש hier zutreffend wieder, ohne eine Aussage über eine immaterielle Seele einzutragen.
