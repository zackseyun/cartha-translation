id: JER.38.28
reference: Jeremiah 38:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב יִרְמְיָ֨הוּ֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה עַד י֖וֹם אֲשֶׁר נִלְכְּדָ֣ה יְרוּשָׁלִָ֑ם וְ/הָיָ֕ה כַּ/אֲשֶׁ֥ר נִלְכְּדָ֖ה יְרוּשָׁלִָֽם־־ס׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/028.yaml
  text: And Jeremiah remained in the court of the guard until the day Jerusalem was captured[b][a]. And it happened when Jerusalem was captured—
translation:
  language: de
  text: Und Jeremia blieb im Wachhof bis zu dem Tag, an dem Jerusalem eingenommen wurde[b]. Und es geschah, als Jerusalem eingenommen wurde —[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text bricht hier unvermittelt ab: »Und es geschah, als Jerusalem eingenommen wurde —«. Wahrscheinlich dient die Formulierung als Übergang zum folgenden Abschnitt und ist kein eigenständiger vollständiger Satz.'
    reason: textual_variant
  - marker: b
    text: 'Oder: »erobert wurde« beziehungsweise »genommen wurde«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: Das Verb ישׁב kann »sitzen«, »wohnen« oder »bleiben« bedeuten. Im Zusammenhang mit Jeremias Gewahrsam gibt »blieb« seine fortdauernde Anwesenheit wieder, ohne einen freiwilligen Aufenthalt anzudeuten.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: im Wachhof
  rationale: חָצֵר bezeichnet einen Hof, מַטָּרָה hier die Wache beziehungsweise den bewachten Haftbereich. »Wachhof« ist eine knappe, verständliche Bezeichnung für diesen amtlichen Gewahrsamsort.
- source_word: עַד יוֹם אֲשֶׁר
  choice: bis zu dem Tag, an dem
  rationale: Die Wendung bezeichnet den Endpunkt von Jeremias Aufenthalt und wird in natürlichem modernem Deutsch zugleich eng am hebräischen Satzbau wiedergegeben.
- source_word: נִלְכְּדָה
  choice: eingenommen wurde
  rationale: Der Niphal von לכד bedeutet, dass eine Stadt genommen oder erobert wird. »Eingenommen wurde« ist im Deutschen die natürliche militärische Formulierung.
- source_word: יְרוּשָׁלִַם
  choice: Jerusalem
  rationale: Übliche deutsche Form des Ortsnamens.
- source_word: וְהָיָה
  choice: Und es geschah
  rationale: Die Formulierung bewahrt die auffällige, offenbar überleitende Erzählformel des Hebräischen und lässt den abrupten Anschluss sichtbar.
- source_word: כַּאֲשֶׁר
  choice: als
  rationale: In diesem zeitlichen Zusammenhang ist »als« die natürliche deutsche Entsprechung, ohne die syntaktische Spannung des unvollständigen Satzes aufzulösen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Haftortbezeichnung »Wachhof« bleibt anschaulich; der ungewöhnliche und abrupte Schluss des hebräischen Textes wird bewusst nicht geglättet.
