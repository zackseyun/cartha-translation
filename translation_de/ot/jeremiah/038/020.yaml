source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
translation:
  language: de
  text: 'Jeremia sagte: „Sie werden dich nicht ausliefern[a]. Höre doch auf die Stimme Jahwes und richte dich nach dem, was ich dir sage; dann wird es dir gut gehen und du wirst am Leben bleiben[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden dich nicht übergeben.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und dein Leben wird leben“; נֶפֶשׁ kann auch „Seele“ bedeuten, bezeichnet hier aber das leibliche Leben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  choice: Sie werden dich nicht ausliefern
  rationale: Das Objekt ist aus dem Zusammenhang zu ergänzen. „Ausliefern“ gibt idiomatisch wieder, dass der König nicht in die Gewalt der anderen übergeben werden wird.
- source_word: שְׁמַע נָא
  choice: Höre doch
  rationale: Der Imperativ mit נָא ist eine eindringliche, höflich formulierte Bitte. Das deutsche „doch“ vermittelt diesen bittenden Nachdruck natürlich.
- source_word: בְּקוֹל יְהוָה
  choice: auf die Stimme Jahwes
  rationale: Die hebräische Wendung bezeichnet ein Hören, das zugleich Beachtung und Gehorsam einschließt. Die Bildlichkeit von „Stimme“ bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  choice: in dem, was ich dir sage
  rationale: Die Formulierung wahrt die enge Verbindung zwischen Jahwes Stimme und Jeremias gegenwärtiger Botschaft, ohne beide ausdrücklich gleichzusetzen oder die Konstruktion unnötig zu glätten.
- source_word: וְיִיטַב לְךָ
  choice: dann wird es dir gut gehen
  rationale: Die geläufige hebräische Wendung beschreibt die günstige Folge des Hörens. „Dann“ macht diesen Folgezusammenhang im Deutschen klar.
- source_word: וּתְחִי נַפְשֶׁךָ
  choice: und du wirst am Leben bleiben
  rationale: נֶפֶשׁ bezeichnet hier angesichts der drohenden Auslieferung das leibliche Leben. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne eine Aussage über eine immaterielle Seele einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen. „Jahwe“ bewahrt ihn als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Bedeutung von נֶפֶשׁ in der Todesgefahr
  choice: du wirst am Leben bleiben
  alternative: deine Seele wird leben
  rationale: Im Zusammenhang geht es um die Bewahrung von Zedekias physischem Leben. Die Alternative wäre im heutigen Deutsch missverständlich und könnte eine anthropologische Aussage nahelegen, die der Vers nicht beabsichtigt.
- issue: Verhältnis von Jeremias Rede zur Stimme Jahwes
  choice: auf die Stimme Jahwes in dem, was ich dir sage
  alternative: gehorche dem, was ich dir im Namen Jahwes sage
  rationale: Die gewählte Fassung bewahrt die enge Verbindung und zugleich die Ausdrucksweise des Hebräischen, ohne die prophetische Vermittlung stärker auszudeuten, als der Wortlaut es tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Höre doch“ bewahrt den bittenden Ernst, während „am Leben bleiben“ die hebräische Wendung verständlich und kontextgerecht wiedergibt.
