  source_fidelity: Die Rollen in der befürchteten Übergabe sind im Entwurf umgekehrt. Im Hebräischen sollen die zu den Chaldäern übergelaufenen Judäer Zedekia in die Hand der Chaldäer geben; anschließend sind die Chaldäer Subjekt des üblen Behandelns. „Ihren Spott mit mir treiben“ verengt וְהִתְעַלְּלוּ בִי zudem unzulässig auf Verspotten.
  naturalness: Die revidierte Fassung ist flüssiges modernes Standarddeutsch. Die explizite Wiederaufnahme von „die Judäer“ und „diese“ macht den im Hebräischen angelegten Wechsel der Bezugsgruppe verständlich.
  terminology: „Judäer“ und „Chaldäer“ geben die historischen Bezeichnungen יהודים und כשדים präzise wieder. „Schlecht behandeln“ ist für וְהִתְעַלְּלוּ בִי weiter und angemessener als die auf Spott beschränkte Formulierung.
  issues:
