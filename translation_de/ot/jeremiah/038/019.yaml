base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
translation:
  language: de
  text: 'Da sagte König Zedekia zu Jeremia: „Ich fürchte mich vor den Judäern[a], die zu den Chaldäern[b] übergelaufen sind. Sie könnten mich den Chaldäern ausliefern, und diese würden mich schlecht behandeln[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Juden“. In diesem historischen Zusammenhang bezeichnet das hebräische Wort Menschen aus Juda.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu den Babyloniern“. Hebräisch: „zu den Chaldäern“. „Übergelaufen“ kann hier auch „übergegangen“ oder „zu ihnen ergeben“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mich misshandeln“, „mich grausam behandeln“ oder „übel mit mir umgehen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֹאֵג
  choice: ich fürchte mich
  rationale: Im Zusammenhang bezeichnet das Partizip Zedekias gegenwärtige Furcht vor den Folgen einer Übergabe; die Wendung ist im Deutschen natürlich und wahrt die emotionale Stärke.
- source_word: הַיְּהוּדִים
  choice: die Judäer
  rationale: Hier sind im historischen Zusammenhang konkret Menschen aus Juda gemeint; „Judäer“ ist daher präziser als das ebenfalls mögliche „Juden“.
- source_word: נָפְלוּ אֶל
  choice: zu … übergelaufen sind
  rationale: Die militärisch-politische Wendung bezeichnet den Seitenwechsel zum Gegner und wird mit „überlaufen“ idiomatisch wiedergegeben.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die Wiedergabe behält die konkrete Bezeichnung des hebräischen Textes bei, statt sie erklärend durch „Babylonier“ zu ersetzen.
- source_word: פֶּן
  choice: vielleicht
  rationale: In Verbindung mit der ausgesprochenen Furcht leitet פֶּן die befürchtete Möglichkeit ein. „Vielleicht“ klingt in direkter deutscher Rede natürlich; der Angstbezug bleibt durch „Ich fürchte mich“ deutlich.
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  choice: die Chaldäer mich an sie ausliefern
  rationale: Das hebräische Idiom lautet wörtlich „mich in ihre Hand geben“. Die explizite Wiederaufnahme der Chaldäer beseitigt im Deutschen eine störende Pronomenmehrdeutigkeit, ohne den Sinn zu verändern.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: und sie treiben ihren Spott mit mir
  rationale: Die Hitpael-Form von עלל kann ein mutwilliges, demütigendes Behandeln und hier auch ein Zum-Gespött-Machen bezeichnen. Die Formulierung wahrt diesen konkreten Ton; die breitere Deutung „mich misshandeln“ bleibt in der Fußnote erhalten.
