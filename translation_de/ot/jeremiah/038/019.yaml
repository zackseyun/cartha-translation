    issue: Die Richtung der Auslieferung ist vertauscht.
    rationale: Der Entwurf sagt, die Chaldäer könnten Zedekia an die Judäer ausliefern. Der hebräische Text sagt hingegen, die übergelaufenen Judäer könnten ihn den Chaldäern ausliefern.
  - severity: medium
    issue: Das Subjekt des abschließenden Verbs ist falsch zugeordnet.
    rationale: Nach der Auslieferung in „ihre Hand“ bezeichnet das folgende „sie“ die Chaldäer, nicht die Judäer.
  - severity: medium
    issue: „Sie treiben ihren Spott mit mir“ ist zu eng.
    rationale: Die Hitpael-Form von עלל bezeichnet hier ein feindseliges bzw. missbräuchliches Behandeln und kann Spott einschließen, ist aber nicht darauf beschränkt.
