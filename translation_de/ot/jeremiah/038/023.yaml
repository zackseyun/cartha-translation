  source_fidelity: 'Der deutsche Text folgt dem WLC zuverlässig. Besonders zutreffend ist die aktive Wiedergabe von תִּשְׂרֹף als „du wirst ... verbrennen“: Das Verb ist 2. Person maskulin Singular und „diese Stadt“ ist durch אֶת als direktes Objekt markiert. Die englische Audit-Fußnote, die hier eine feminine Singularform mit Bezug auf die Stadt annimmt, entspricht dem punktierten hebräischen Text nicht. Die Wiedergaben von „Frauen“, „Söhne“, „hinausgebracht“, „Chaldäer“, der Hand-Metaphorik und „Babel“ sind quellentreu.'
  naturalness: Würdiges, modernes Standarddeutsch. „wirst ihrer Hand nicht entkommen“ und „in die Hand des Königs von Babel fallen“ sind verständliche, in diesem Register angemessene idiomatische Wiedergaben.
  terminology: „Chaldäer“ bewahrt das Ethnonym; die Fußnote bietet sinnvoll „Babylonier“ als kontextuelle Alternative. „Babel“ ist bibelsprachlich etabliert. Die aktive Schlussformulierung wahrt die offene Frage, ob unmittelbares Tun oder verursachende Verantwortung gemeint ist, ohne eine dogmatische Deutung festzulegen.
