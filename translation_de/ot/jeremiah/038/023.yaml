source:
  edition: WLC
  text: וְ/אֶת כָּל נָשֶׁ֣י/ךָ וְ/אֶת בָּנֶ֗י/ךָ מֽוֹצִאִים֙ אֶל הַ/כַּשְׂדִּ֔ים וְ/אַתָּ֖ה לֹא תִמָּלֵ֣ט מִ/יָּדָ֑/ם כִּ֣י בְ/יַ֤ד מֶֽלֶךְ בָּבֶל֙ תִּתָּפֵ֔שׂ וְ/אֶת הָ/עִ֥יר הַ/זֹּ֖את תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
translation:
  language: de
  text: Auch alle deine Frauen und deine Söhne werden zu den Chaldäern[a] hinausgebracht. Du selbst wirst ihrer Hand nicht entkommen; denn du wirst in die Hand des Königs von Babel fallen. Und du wirst diese Stadt mit Feuer verbrennen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Babyloniern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich spricht der hebräische Text den König an: „Du wirst diese Stadt mit Feuer verbrennen.“ Gemeint sein kann auch, dass sein Handeln zu ihrer Verbrennung führt.'
    reason: ambiguity_note
lexical_decisions:
- source_word: נָשֶׁיךָ
  choice: deine Frauen
  rationale: Im Zusammenhang mit dem königlichen Haushalt bezeichnet der Ausdruck die Frauen des Königs; „Frauen“ ist im heutigen Deutschen natürlicher als „Ehefrauen“ und enger als eine allgemeine Wiedergabe mit „Frauen des Hofes“.
- source_word: בָּנֶיךָ
  choice: deine Söhne
  rationale: Das hebräische Wort bezeichnet hier ausdrücklich die Söhne und wird nicht zum allgemeineren „Kinder“ erweitert.
- source_word: מוֹצִאִים
  choice: werden … hinausgebracht
  rationale: Das passive Partizip hat in der prophetischen Warnung Zukunftsbezug und bewahrt die kausativ-passive Aussage des Hebräischen.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die ethnische Bezeichnung des Ausgangstextes wird beibehalten; eine Fußnote nennt die kontextuell verständlichere Alternative „Babylonier“.
- source_word: לֹא תִמָּלֵט מִיָּדָם
  choice: wirst ihrer Hand nicht entkommen
  rationale: Die deutsche Formulierung bewahrt das hebräische Bild der Hand als Macht- und Herrschaftsbereich und bleibt verständlich.
- source_word: בְיַד מֶלֶךְ בָּבֶל תִּתָּפֵשׂ
  choice: wirst in die Hand des Königs von Babel fallen
  rationale: Die idiomatische deutsche Wendung gibt sowohl das Ergriffenwerden als auch das hebräische Bild des Ausgeliefertseins an die Hand des Königs wieder.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Dies entspricht unmittelbar der hebräischen Demonstrativkonstruktion.
- source_word: תִּשְׂרֹף
  choice: du wirst … verbrennen
  rationale: Wegen des vorangestellten Objektzeichens אֶת gehört „diese Stadt“ als direktes Objekt zum Verb; die gleichlautende Form ist daher als 2. Person Maskulin Singular zu verstehen und bezieht sich auf den angesprochenen König.
- source_word: בָּאֵשׁ
  choice: mit Feuer
  rationale: Die konkrete instrumentale Wendung des Hebräischen wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Verantwortung des Königs für die Verbrennung der Stadt
  choice: „du wirst diese Stadt mit Feuer verbrennen“
  alternative: „diese Stadt wird mit Feuer verbrannt werden“
  rationale: Der masoretische Text kennzeichnet „diese Stadt“ mit אֶת als direktes Objekt und spricht den König in der 2. Person Singular an. Die aktive Form bewahrt die zugespitzte Aussage über seine Verantwortung, ohne sie durch ein Passiv auf die unmittelbaren babylonischen Täter zu verlagern. Ob damit eigenhändiges Handeln oder verursachende Verantwortung gemeint ist, bleibt offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am Hebräischen. „Babel“ bewahrt die in deutschen Bibeln geläufige Form des hebräischen Ortsnamens; die Hand-Metaphorik bleibt erhalten. Die Schlussaussage folgt gegen die englische Konsultationsfassung der Syntax des WLC und lässt die Spannung zwischen unmittelbarer und verursachender Verantwortung bestehen.
