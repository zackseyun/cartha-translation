  to: Die Worte Jonadabs[a], des Sohnes Rechabs, die er seinen Söhnen gebot – keinen Wein zu trinken –, sind befolgt worden. Bis zum heutigen Tag haben sie keinen Wein getrunken, denn sie haben dem Gebot ihres Vaters gehorcht. Ich aber habe immer wieder zu euch geredet[b], doch ihr habt nicht auf mich gehört.
