  terminology: „Jonadab“ ist eine gebräuchliche deutsche Namensform; die Fußnote dokumentiert transparent die volle hebräische Form Jehonadab. „Gebot“, „gehorcht“ und „auf mich gehört“ erhalten den beabsichtigten Kontrast, ohne den Schlusssatz über das Nicht-Hören zu einer ausdrücklich stärkeren Aussage von „nicht gehorcht“ zu verschieben.
