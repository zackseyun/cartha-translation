source:
  edition: WLC
  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
translation:
  language: de
  text: Die Worte Jonadabs[a], des Sohnes Rechabs, die er seinen Söhnen gebot – keinen Wein zu trinken –, sind befolgt worden. Bis zum heutigen Tag haben sie keinen Wein getrunken, denn sie haben dem Gebot ihres Vaters gehorcht. Ich aber habe immer wieder zu euch geredet[b], doch ihr habt nicht auf mich gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Jehonadab; „Jonadab“ ist die gebräuchliche Kurzform.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „früh aufstehend und redend“; eine hebräische Wendung für beharrliches, wiederholtes Reden.'
    reason: cultural_note
lexical_decisions:
- source_word: הוּקַם אֶת דִּבְרֵי
  choice: Die Worte … sind befolgt worden
  rationale: Das passive הוּקַם bezeichnet hier, dass die Worte beziehungsweise Weisungen praktisch aufrechterhalten und ausgeführt wurden. „Befolgt“ klingt im Deutschen natürlich und passt zum anschließenden Gehorsam.
- source_word: יְהוֹנָדָב בֶּן רֵכָב
  choice: Jonadab, der Sohn Rechabs
  rationale: „Jonadab“ ist die im Deutschen gebräuchliche biblische Namensform für יְהוֹנָדָב; „Rechabs“ gibt die Zugehörigkeit im Genitiv natürlich wieder.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: keinen Wein zu trinken
  rationale: Die Verbotskonstruktion wird direkt und idiomatisch wiedergegeben.
- source_word: וְלֹא שָׁתוּ עַד הַיּוֹם הַזֶּה
  choice: Bis zum heutigen Tag haben sie keinen Wein getrunken
  rationale: Das Perfekt mit der Zeitangabe bewahrt die bis in die Gegenwart reichende Aussage; „Wein“ wird aus dem unmittelbaren Kontext ausdrücklich wiederholt.
- source_word: שָׁמְעוּ אֵת מִצְוַת אֲבִיהֶם
  choice: sie haben dem Gebot ihres Vaters gehorcht
  rationale: שׁמע bedeutet bei einem Gebot nicht nur Hören, sondern gehorsames Befolgen.
- source_word: וְאָנֹכִי
  choice: Ich aber
  rationale: Die Stellung und Wiedergabe markieren den scharfen Gegensatz zwischen dem Gehorsam der Rechabiter und dem Nicht-Hören Judas.
- source_word: הַשְׁכֵּם וְדַבֵּר
  choice: immer wieder eindringlich … geredet
  rationale: Die wörtliche Wendung „früh aufstehen und reden“ ist ein hebräisches Idiom für beharrliches, eifriges Ansprechen. Die Hauptübersetzung gibt dessen Sinn natürlich wieder; die Bildform bleibt in der Fußnote sichtbar.
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: doch ihr habt nicht auf mich gehört
  rationale: „Auf jemanden hören“ bewahrt im Deutschen sowohl die Hörmetaphorik als auch den Sinn des Nicht-Gehorchens.
theological_decisions:
- issue: Kontrast zwischen dem Gehorsam gegenüber dem menschlichen Vater und Judas Reaktion auf Gottes Reden
  choice: Den Kontrast durch „Ich aber“ und „nicht auf mich gehört“ deutlich machen, ohne ihn als ausdrückliche Bundesrebellion auszudeuten.
  alternative: „Doch ihr habt mir nicht gehorcht“ oder eine Erweiterung um Bundesbruch.
  rationale: Der Vers stellt Gehorsam und Nicht-Hören einander gegenüber. Die gewählte Form bewahrt diese theologische Spannung, ohne eine nicht ausdrücklich genannte Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde gegenüber dem Hebräischen moderat gegliedert, um die lange Gegenüberstellung gut verständlich zu machen. Das Idiom הַשְׁכֵּם וְדַבֵּר wird sinngemäß im Text und wörtlich in der Fußnote wiedergegeben.
