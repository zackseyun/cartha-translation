  to: 'Und ich sandte immer wieder alle meine Diener, die Propheten, zu euch und ließ euch sagen: »Kehrt doch um, jeder von seinem bösen Weg, und bessert eure Taten. Geht nicht anderen Göttern nach, um ihnen zu dienen. Dann könnt ihr in dem Land wohnen bleiben, das ich euch und euren Vorfahren gegeben habe.« Aber ihr habt mir kein Gehör geschenkt und nicht auf mich gehört.'
