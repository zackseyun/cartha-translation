  source_fidelity: 'Die Übersetzung gibt den Sinn des Verses insgesamt zuverlässig wieder: Gottes beharrliches Senden der Propheten, der Ruf zur Umkehr, die Abkehr von anderen Göttern, der Aufenthalt im gegebenen Land und Israels mangelndes Hören sind erhalten. „Lauft ... nach“ verstärkt jedoch das hebräische „geht ... nach“ unnötig; eine neutralere Wiedergabe wahrt die Metapher genauer. Die Wiedergabe des abschließenden Imperativs als kontextuelle Folge („Dann könnt ihr ... wohnen bleiben“) ist vertretbar.'
  naturalness: Modernes, verständliches und angemessen würdiges Deutsch. „Kehrt doch um“, „bessert eure Taten“ und „kein Gehör schenken“ sind idiomatisch. „Geht anderen Göttern nach“ ist im Deutschen natürlicher und weniger überzeichnend als „Lauft anderen Göttern nach“.
  terminology: „Diener, die Propheten“, „andere Götter“, „dienen“, „Land“ und „Vorfahren“ sind terminologisch angemessen. „Umkehren“ bewahrt die konkrete und moralische Dimension von שׁוּב, ohne sie dogmatisch zu verengen.
