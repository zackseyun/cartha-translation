source:
  edition: WLC
  text: וָ/אֶשְׁלַ֣ח אֲלֵי/כֶ֣ם אֶת כָּל עֲבָדַ֣/י הַ/נְּבִאִ֣ים הַשְׁכֵּ֣ים וְ/שָׁלֹ֣חַ לֵ/אמֹ֡ר שֻׁבוּ נָ֡א אִישׁ֩ מִ/דַּרְכּ֨/וֹ הָ/רָעָ֜ה וְ/הֵיטִ֣יבוּ מַֽעַלְלֵי/כֶ֗ם וְ/אַל תֵּ֨לְכ֜וּ אַחֲרֵ֨י אֱלֹהִ֤ים אֲחֵרִים֙ לְ/עָבְדָ֔/ם וּ/שְׁבוּ֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֹֽתֵי/כֶ֑ם וְ/לֹ֤א הִטִּיתֶם֙ אֶֽת אָזְנְ/כֶ֔ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
translation:
  language: de
  text: 'Und ich sandte immer wieder alle meine Diener, die Propheten, zu euch und ließ euch sagen: »Kehrt doch um, jeder von seinem bösen Weg, und bessert eure Taten. Geht nicht anderen Göttern nach, um ihnen zu dienen. Dann könnt ihr in dem Land wohnen bleiben, das ich euch und euren Vorfahren gegeben habe.« Aber ihr habt mir kein Gehör geschenkt und nicht auf mich gehört.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Und ich sandte
  rationale: Das Wayyiqtol führt den Rückblick auf Gottes wiederholtes Senden in der einfachen Vergangenheit fort.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: alle meine Diener, die Propheten
  rationale: Die Apposition bleibt erhalten und bezeichnet die Propheten ausdrücklich als Gottes Diener.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  choice: immer wieder … sandte … und ließ euch sagen
  rationale: Die hebräische Wendung, wörtlich mit dem Bild des frühen Aufstehens formuliert, drückt hier beharrliches und dringliches Senden aus; die deutsche Wiedergabe vermittelt ihre idiomatische Funktion natürlich.
- source_word: שֻׁבוּ נָא
  choice: Kehrt doch um
  rationale: „Umkehren“ bewahrt das Bewegungsbild von שׁוב; „doch“ gibt die eindringliche, bittende Partikel נָא wieder.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: jeder von seinem bösen Weg
  rationale: „Jeder“ bildet die distributive Einzahl natürlich ab; „böser Weg“ erhält das prophetische Bild für verwerfliches Verhalten.
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  choice: und bessert eure Taten
  rationale: Die Wendung gibt den Hifil von יטב als Aufforderung wieder, das eigene Handeln gut zu machen beziehungsweise zu ändern.
- source_word: וְאַל תֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: Lauft nicht anderen Göttern nach
  rationale: „Nachlaufen“ bewahrt die konkrete hebräische Metapher des Abfalls zu anderen Göttern und klingt im Deutschen verständlich.
- source_word: לְעָבְדָם
  choice: um ihnen zu dienen
  rationale: „Dienen“ wahrt die Breite von עבד, die im Blick auf Götter kultische Verehrung einschließt, ohne darauf verengt zu werden.
- source_word: וּשְׁבוּ אֶל הָאֲדָמָה
  choice: Dann könnt ihr in dem Land wohnen bleiben
  rationale: 'Die Form von ישׁב ist zwar formal ein Imperativ, bezeichnet im Zusammenhang aber die Folge der Umkehr: den fortdauernden Aufenthalt im Land. „Wohnen bleiben“ gibt diesen Kontext wieder.'
- source_word: הָאֲדָמָה
  choice: das Land
  rationale: Gemeint ist das von Gott gegebene Land und nicht bloß Erdreich oder Boden.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבֹתֵיכֶם
  choice: das ich euch und euren Vorfahren gegeben habe
  rationale: „Vorfahren“ gibt אָבוֹת im heutigen Deutsch sachgemäß wieder; das Perfekt bezeichnet die fortwirkende Gabe des Landes natürlich.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם וְלֹא שְׁמַעְתֶּם אֵלָי
  choice: Aber ihr habt mir kein Gehör geschenkt und nicht auf mich gehört
  rationale: „Kein Gehör schenken“ bewahrt das Ohr-Motiv idiomatisch; die zweite Aussage bleibt als verstärkende Wiederholung erhalten.
theological_decisions:
- issue: Prophetischer Ruf mit שׁוב
  choice: Kehrt doch um
  alternative: Kehrt doch zurück; tut Buße
  rationale: „Umkehren“ bewahrt das räumlich-moralische Bild und lässt dessen theologischen Gehalt stehen, ohne ihn durch einen stärker systematisch geprägten Fachausdruck festzulegen.
- issue: Distributive Bedeutung von אִישׁ
  choice: jeder
  alternative: jeder Mann; jeder Einzelne
  rationale: אִישׁ bezeichnet hier distributiv jede angesprochene Person. „Jeder“ bildet diese Funktion im Deutschen genau und natürlich ab, ohne die Aussage auf erwachsene Männer einzuengen.
- issue: Folge der Umkehr für den Aufenthalt im Land
  choice: Dann könnt ihr in dem Land wohnen bleiben
  alternative: Und wohnt in dem Land; damit ihr in dem Land wohnen könnt
  rationale: Der hebräische Imperativ וּשְׁבוּ kann in der Abfolge als verheißene beziehungsweise ermöglichte Folge des Gehorsams verstanden werden. Die Wiedergabe macht diesen Zusammenhang verständlich, ohne eine bedingungslose Besitzgarantie zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlichen prophetischen Bildern. Die beharrliche Sendung der Propheten wird idiomatisch statt durch die im Deutschen missverständliche wörtliche Wendung „früh aufstehen und senden“ wiedergegeben. Keine Fußnoten erforderlich, da die wesentlichen Bedeutungsnuancen im Haupttext natürlich darstellbar sind.
