source:
  edition: WLC
  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
translation:
  language: de
  text: 'Und zur Familie der Rechabiter sagte Jeremia: »So spricht Jahwe der Heerscharen, der Gott Israels: Weil ihr dem Gebot eures Vorfahren[a] Jehonadab gehorcht, alle seine Gebote befolgt und alles so getan habt, wie er es euch geboten hat,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Vater.'
    reason: Die Fußnote bewahrt die konkrete hebräische Verwandtschaftsbezeichnung אָב, während der Haupttext ihren kontextuellen Sinn »Vorfahr« wiedergibt.
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  choice: Und zu den Nachkommen der Rechabiter
  rationale: בֵּית bezeichnet hier die Familienlinie bzw. Sippe der Rechabiter. »Nachkommen« gibt den gemeinten Personenkreis im modernen Deutschen natürlicher wieder als das missverständliche »Haus«.
- source_word: אָמַר יִרְמְיָהוּ
  choice: sagte Jeremia
  rationale: Die einfache Redeeinleitung wird direkt und idiomatisch wiedergegeben.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Bewahrt die geläufige, würdevolle prophetische Botenformel.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als Jahwe wiedergegeben; »Heerscharen« bewahrt die traditionelle Weite des Titels, ohne ihn auf menschliche Armeen zu verengen.
- source_word: יַעַן אֲשֶׁר
  choice: Weil
  rationale: Gibt die kausale Einleitung knapp und natürlich wieder.
- source_word: שְׁמַעְתֶּם עַל מִצְוַת
  choice: ihr auf das Gebot ... gehört
  rationale: שמע mit עַל bezeichnet hier hörenden Gehorsam. Die deutsche Wendung »auf ... hören« bewahrt zugleich das Bild des Hörens und den Sinn des Gehorchens.
- source_word: יְהוֹנָדָב אֲבִיכֶם
  choice: eures Vorfahren Jehonadab
  rationale: אָב kann einen Ahnherrn bezeichnen. Da Jehonadab der Vorfahr der angesprochenen Generation ist, verhindert »Vorfahr« ein modernes Missverständnis von »Vater«.
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו
  choice: alle seine Gebote befolgt
  rationale: שמר bei Geboten meint beachten bzw. befolgen; diese Wiedergabe ist klares modernes Deutsch.
- source_word: וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: alles so getan habt, wie er es euch geboten hat
  rationale: Das »so ... wie« erhält die durch כְּ ausgedrückte Übereinstimmung mit Jehonadabs Anweisung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. »Jahwe« gibt ihn im Deutschen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung Jehonadabs als אָב
  choice: Vorfahr
  alternative: Vater
  rationale: Gemeint ist der Ahnherr der Rechabiter, nicht der unmittelbare Vater der Angesprochenen. Die Wahl klärt den genealogischen Sinn, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener prophetischer Formel. Der Vers endet syntaktisch offen mit einem Komma, weil der mit »Weil« begonnene göttliche Ausspruch im folgenden Vers fortgesetzt wird.
