source:
  edition: WLC
  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
translation:
  language: de
  text: Denn die Nachkommen Jonadabs, des Sohnes Rechabs, haben das Gebot ihres Vaters[a] befolgt, das er ihnen gegeben hatte; dieses Volk aber hat nicht auf mich gehört[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vater“ kann hier auch „Vorfahr“ oder „Ahnherr“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: „Auf mich gehört“ schließt hier den Sinn „mir gehorcht“ ein.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Aussage ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: הֵקִימוּ
  choice: haben … befolgt
  rationale: Das Hifil von קום bedeutet zusammen mit מִצְוַת idiomatisch, ein Gebot aufrechtzuerhalten beziehungsweise zu befolgen. „Befolgt“ bringt den Gehorsamsgedanken klar und natürlich zum Ausdruck.
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  choice: die Nachkommen Jonadabs, des Sohnes Rechabs
  rationale: בְּנֵי bedeutet wörtlich „Söhne“, bezeichnet in diesem Sippenzusammenhang jedoch die späteren Nachkommen Jonadabs. Die Wiedergabe vermeidet im modernen Deutsch den falschen Eindruck unmittelbarer leiblicher Söhne.
- source_word: מִצְוַת
  choice: das Gebot
  rationale: מִצְוָה bezeichnet eine verbindliche Anordnung. „Gebot“ bewahrt deren Autorität und passt zum gehobenen, aber verständlichen Register.
- source_word: אֲבִיהֶם
  choice: ihres Vaters
  rationale: Bewahrt die direkte familiäre Ausdrucksweise des Hebräischen und damit den Kontrast zwischen dem Gehorsam gegenüber einem menschlichen Vater beziehungsweise Vorfahren und dem Ungehorsam gegenüber Gott.
- source_word: אֲשֶׁר צִוָּם
  choice: das er ihnen gegeben hatte
  rationale: Im Deutschen verbindet sich „ein Gebot geben“ natürlicher als eine Wiederholung von „Gebot“ und „gebieten“. Das Plusquamperfekt verdeutlicht ohne Sinnänderung, dass das Gebot vor seiner Befolgung erteilt worden war.
- source_word: וְהָעָם הַזֶּה
  choice: dieses Volk aber
  rationale: Das nachgestellte „aber“ macht den im Kontext deutlichen Gegensatz zum Gehorsam der Nachkommen Jonadabs sichtbar; „dieses Volk“ bewahrt den distanzierenden Demonstrativausdruck.
- source_word: לֹא שָׁמְעוּ אֵלָי
  choice: hat nicht auf mich gehört
  rationale: שׁמע mit אֶל bezeichnet das Hören auf jemanden und schließt hier Gehorsam ein. Die deutsche Wendung bewahrt beide Bedeutungsanteile.
theological_decisions:
- issue: Familiäre Bezeichnung Jonadabs innerhalb der rechabitischen Sippe
  choice: ihres Vaters
  alternative: ihres Vorfahren
  rationale: 'Der hebräische Text verwendet ausdrücklich „Vater“. Diese Formulierung erhält die rhetorische und theologische Spannung: Die Rechabiter hören auf ihren menschlichen Vater beziehungsweise Ahnherrn, während das Volk nicht auf Gott hört. Eine Fußnote erläutert die kontextuell weitere Bedeutung.'
- issue: Bedeutung von „hören“ als Gehorsam
  choice: nicht auf mich gehört
  alternative: mir nicht gehorcht
  rationale: Die gewählte Fassung wahrt das hebräische Hörmotiv, ohne den im Zusammenhang klaren Gehorsamssinn auszuschließen oder auf eine einzige Bedeutungsnuance zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachkommen“ macht den Sippenbezug verständlich; „Vater“ erhält bewusst die Bildsprache des Ausgangstextes. Der Gegensatz wird durch „aber“ natürlich hervorgehoben.
