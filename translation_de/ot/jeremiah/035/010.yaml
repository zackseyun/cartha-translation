base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
translation:
  language: de
  text: So haben wir in Zelten gewohnt, haben gehorcht[a] und alles getan, was Jonadab, unser Vater, uns geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben darauf gehört“; das hebräische Wort für „hören“ kann zugleich das gehorsame Befolgen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: haben wir … gewohnt
  rationale: ישׁב bezeichnet hier das Wohnen beziehungsweise Leben an einem Ort, nicht wörtlich das Sitzen. Das Perfekt gibt im modernen Deutsch die rückblickende Zusammenfassung ihrer fortgesetzten Lebensweise natürlich wieder.
- source_word: בָּאֳהָלִים
  choice: in Zelten
  rationale: Der artikellose Plural beschreibt allgemein ihre Lebensweise; daher ist die Wiedergabe ohne bestimmten Artikel angemessen.
- source_word: וַנִּשְׁמַע
  choice: haben gehorcht
  rationale: שׁמע bezeichnet im Zusammenhang mit einem Gebot häufig nicht nur das Hören, sondern das darauf folgende Befolgen. „Gehorcht“ gibt diesen kontextuellen Sinn idiomatisch wieder; die wörtlichere Möglichkeit wird in einer Fußnote erhalten.
- source_word: וַנַּעַשׂ
  choice: und alles getan
  rationale: עשה bezeichnet die tatsächliche Ausführung des Gebotenen. „Getan“ bewahrt die hebräische Verbindung von Hören beziehungsweise Gehorchen und Tun.
- source_word: כְּכֹל אֲשֶׁר
  choice: alles …, was
  rationale: Die Wendung drückt vollständige Übereinstimmung mit dem Gebot aus. Im Deutschen ist „alles, was“ natürlich und wahrt die umfassende Aussage.
- source_word: צִוָּנוּ
  choice: uns geboten hat
  rationale: צוה ist das übliche Verb für verbindliches Gebieten. „Geboten“ wahrt die Autorität der Anweisung und passt zum würdigen biblischen Register.
- source_word: יוֹנָדָב
  choice: Jonadab
  rationale: „Jonadab“ entspricht der hier vorliegenden Namensform und der etablierten deutschen biblischen Schreibung.
- source_word: אָבִינוּ
  choice: unser Vater
  rationale: Dies ist die direkte Bedeutung des hebräischen Ausdrucks. Obwohl Jonadab hier der Stammvater der Gruppe ist, bleibt die familiäre Bezeichnung bewusst erhalten.
theological_decisions:
- issue: Bedeutung von שׁמע in Bezug auf Jonadabs Gebot
  choice: gehorcht
  alternative: gehört / darauf gehört
  rationale: Der Kontext betont die Befolgung des Gebots, und שׁמע kann eine gehorsame Reaktion einschließen. Die Fußnote bewahrt zugleich die hörbezogene Bildlichkeit und vermeidet, die Bedeutungsbreite unsichtbar zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Das Perfekt klingt in der berichteten Rede natürlich; „geboten“ hält den verbindlichen Charakter von Jonadabs Weisung fest, ohne altertümlich zu wirken.
