source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת יַאֲזַנְיָ֤ה בֶֽן יִרְמְיָ֨הוּ֙ בֶּן חֲבַצִּנְיָ֔ה וְ/אֶת אֶחָ֖י/ו וְ/אֶת כָּל בָּנָ֑י/ו וְ/אֵ֖ת כָּל בֵּ֥ית הָ/רֵכָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
translation:
  language: de
  text: Da nahm ich[a] Jaasanja, den Sohn Jeremias, des Sohnes Habazinjas, und seine Brüder und alle seine Söhne und das ganze Haus der Rechabiter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Dann nahm ich“ oder „Und ich nahm“. Die hebräische Erzählform verbindet diese Handlung mit dem vorausgehenden Geschehen.'
    reason: lexical_alternative
  - marker: b
    text: „Haus“ meint hier den gesamten Haushalt beziehungsweise die Sippe der Rechabiter, nicht ein Gebäude.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Da nahm ich
  rationale: Das Qal-Wajjiqtol von לקח führt die Erzählung mit der nächsten Handlung fort. „Da nahm ich“ gibt diesen Zusammenhang in natürlichem Deutsch wieder; auch „Dann nahm ich“ oder „Und ich nahm“ wären möglich.
- source_word: יַאֲזַנְיָה
  choice: Jaasanja
  rationale: Der Personenname wird in einer im Deutschen geläufigen, dem Hebräischen angenäherten Form wiedergegeben.
- source_word: בֶן יִרְמְיָהוּ בֶן חֲבַצִּנְיָה
  choice: den Sohn Jeremias, des Sohnes Habazinjas
  rationale: Die zweimalige Abstammungsangabe mit בֶן wird bewahrt, sodass die genealogische Folge Jaasanja–Jeremia–Habazinja eindeutig bleibt.
- source_word: אֶחָיו
  choice: seine Brüder
  rationale: אָח bezeichnet hier am unmittelbarsten leibliche oder verwandtschaftliche Brüder; der Kontext verlangt keine Verallgemeinerung zu „Verwandte“.
- source_word: כָּל בָּנָיו
  choice: alle seine Söhne
  rationale: בָּנִים ist maskuliner Plural und bezeichnet in diesem Zusammenhang die Söhne Jaasanjas; „Kinder“ wäre weniger genau.
- source_word: כָּל בֵּית הָרֵכָבִים
  choice: das ganze Haus der Rechabiter
  rationale: בֵּית bezeichnet in dieser Verbindung das gesamte Haus im Sinn von Haushalt oder Sippe. Die traditionelle Familienmetapher bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Reihung und die familienbezogene Bedeutung von „Haus“ werden bewahrt; die Satzverknüpfung ist natürlich deutsch formuliert.
