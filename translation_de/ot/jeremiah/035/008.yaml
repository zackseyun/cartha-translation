  text: וַ/נִּשְׁמַ֗ע בְּ/ק֨וֹל יְהוֹנָדָ֤ב בֶּן רֵכָב֙ אָבִ֔י/נוּ לְ/כֹ֖ל אֲשֶׁ֣ר צִוָּ֑/נוּ לְ/בִלְתִּ֤י שְׁתֽוֹת יַ֨יִן֙ כָּל יָמֵ֔י/נוּ אֲנַ֣חְנוּ נָשֵׁ֔י/נוּ בָּנֵ֖י/נוּ וּ/בְנֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
translation:
  language: de
  text: 'So haben wir auf die Stimme Jehonadabs, des Sohnes Rechabs, unseres Vaters, gehört, in allem, was er uns geboten hat: keinen Wein zu trinken, unser Leben lang – wir, unsere Frauen, unsere Söhne und unsere Töchter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  choice: So haben wir auf die Stimme … gehört
  rationale: Die Verbindung שׁמע בְּקוֹל bedeutet, auf jemanden zu hören und ihm zu gehorchen. Die deutsche Wendung bewahrt das Bild der »Stimme« und drückt zugleich das Befolgen aus.
- source_word: יְהוֹנָדָב
  choice: Jonadab
  rationale: Die im Deutschen bibelsprachlich geläufige Namensform gibt denselben hebräischen Namen wieder; die längere Form »Jehonadab« wäre ebenfalls möglich.
- source_word: בֶּן רֵכָב
  choice: des Sohnes Rechabs
  rationale: Die genealogische Zuordnung wird in natürlichem Deutsch als Apposition wiedergegeben.
- source_word: אָבִינוּ
  choice: unseres Vaters
  rationale: Obwohl ein Vorfahr gemeint ist, wird das hebräische אָבִינוּ bewusst als »unser Vater« bewahrt, da es die familiäre Bindung der Gemeinschaft an Jonadab ausdrückt.
- source_word: לְכֹל אֲשֶׁר צִוָּנוּ
  choice: alles befolgt, was er uns geboten hat
  rationale: Die Formulierung gibt sowohl die umfassende Reichweite von לְכֹל als auch den Gehorsamsgedanken des einleitenden Idioms natürlich wieder.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  choice: sollen wir keinen Wein trinken
  rationale: Der Infinitiv nennt den Inhalt des Gebots; »sollen« bindet ihn im Deutschen klar an »geboten hat« zurück.
- source_word: כָּל יָמֵינוּ
  choice: unser Leben lang
  rationale: Dies gibt den lebenslangen zeitlichen Umfang idiomatisch und verständlich wieder.
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  choice: weder wir noch unsere Frauen, unsere Söhne oder unsere Töchter
  rationale: Die ausdrückliche Aufzählung aller Gruppen bleibt erhalten; die weder-noch-Konstruktion macht deutlich, dass das Verbot für sie alle gilt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Gehorsamsformel wird bildhaft als »auf die Stimme hören« wiedergegeben und durch »befolgt« semantisch verdeutlicht. Die Aufzählung der gesamten Gemeinschaft bleibt ausdrücklich erhalten.
