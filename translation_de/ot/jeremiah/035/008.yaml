  source_fidelity: 'Die Aussage des hebräischen Textes wird im Wesentlichen getroffen: Die Rekabiter bezeugen ihren umfassenden Gehorsam gegenüber dem Gebot ihres Vorfahren, keinen Wein zu trinken, und die Aufzählung bezieht die gesamte Familie ein. Die WLC hat jedoch die volle Namensform יְהוֹנָדָב (Jehonadab), die im deutschen Text vorzuziehen ist. Außerdem gibt „sollen wir keinen Wein trinken“ die Infinitivbestimmung unnötig als gegenwärtig formulierte Sollens-Aussage wieder; „keinen Wein zu trinken“ bildet den Inhalt des ergangenen Gebots unmittelbarer ab.'
