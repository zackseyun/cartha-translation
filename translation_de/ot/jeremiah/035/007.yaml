source:
  edition: WLC
  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
translation:
  language: de
  text: Ihr sollt kein Haus bauen, kein Saatgut aussäen und keinen Weinberg pflanzen; auch sollt ihr keinen besitzen. Vielmehr sollt ihr euer Leben lang in Zelten wohnen, damit ihr lange in dem Land lebt, in dem ihr euch als Fremde aufhaltet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in dem ihr euch nur vorübergehend aufhaltet“. Das hebräische Verb bezeichnet den Aufenthalt als nicht dauerhaft ansässige Bewohner.'
    reason: Lexikalische Alternative und sozialgeschichtliche Bedeutungsnuance von גָּרִים.
lexical_decisions:
- source_word: וּבַיִת לֹא תִבְנוּ
  choice: Ihr sollt kein Haus bauen
  rationale: בַּיִת bezeichnet hier im Gegensatz zum Wohnen in Zelten ein festes Gebäude. Der verneinte Imperfekt hat gebietenden, prohibitivischen Sinn.
- source_word: וְזֶרַע לֹא תִזְרָעוּ
  choice: kein Saatgut aussäen
  rationale: זֶרַע wird konkret als „Saatgut“ wiedergegeben; dies bewahrt das landwirtschaftliche Bild, ohne eine bestimmte Feldfrucht vorauszusetzen.
- source_word: וְכֶרֶם לֹא תִטָּעוּ וְלֹא יִהְיֶה לָכֶם
  choice: keinen Weinberg pflanzen; auch sollt ihr keinen besitzen
  rationale: כֶּרֶם ist ein Weinberg. Die singularische Besitzkonstruktion יִהְיֶה לָכֶם wird am natürlichsten auf den unmittelbar zuvor genannten Weinberg bezogen.
- source_word: כִּי בָאֳהָלִים תֵּשְׁבוּ
  choice: Vielmehr sollt ihr … in Zelten wohnen
  rationale: כִּי führt hier den positiven Gegenentwurf zu den Verboten ein; „vielmehr“ drückt diesen Kontrast aus. ישׁב bezeichnet im Wohnkontext „wohnen“.
- source_word: כָּל יְמֵיכֶם
  choice: euer Leben lang
  rationale: Die idiomatische deutsche Wendung gibt wörtlich „alle eure Tage“ verständlich und vollständig wieder.
- source_word: לְמַעַן תִּחְיוּ יָמִים רַבִּים
  choice: damit ihr viele Tage … lebt
  rationale: לְמַעַן kennzeichnet den Zweck; „viele Tage“ bewahrt die konkrete hebräische Zeitangabe.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: auf dem Land
  rationale: אֲדָמָה meint hier den Boden beziehungsweise das Land, auf dem sie sich aufhalten; „auf dem Land“ ist im Deutschen natürlich und bleibt näher am Ausdruck als eine territoriale Spezifizierung.
- source_word: אֲשֶׁר אַתֶּם גָּרִים שָׁם
  choice: in dem ihr euch als Fremde aufhaltet
  rationale: גור bezeichnet den Aufenthalt von Menschen, die nicht dauerhaft ansässig oder voll heimisch sind. „Als Fremde aufhalten“ erhält diese soziale und zeitliche Nuance.
theological_decisions:
- issue: Bedeutung von גָּרִים für den Status der Rechabiter im Land
  choice: in dem ihr euch als Fremde aufhaltet
  alternative: in dem ihr wohnt / in dem ihr euch vorübergehend aufhaltet
  rationale: Die Formulierung bewahrt den im Verb גור enthaltenen Status eines nicht fest ansässigen Bewohners, ohne daraus eine weitergehende Aussage über Bundes- oder Besitzrechte abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verbote bleiben gebietend formuliert; „euer Leben lang“ und „in Zelten wohnen“ sind natürlich verständlich. Die Reihung wurde moderat gegliedert, ohne Inhalt oder Spannung des hebräischen Textes aufzulösen.
