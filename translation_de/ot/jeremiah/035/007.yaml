  naturalness: Die Übersetzung ist insgesamt flüssiges, würdiges modernes Standarddeutsch. „Damit ihr viele Tage auf dem Land lebt“ wirkt jedoch weniger natürlich und ist wegen der möglichen deutschen Nebenbedeutung von „auf dem Land“ missverständlich. „Damit ihr lange in dem Land lebt“ ist idiomatischer.
  terminology: „Haus“, „Saatgut“, „Weinberg“, „Zelte“ und „wohnen“ treffen den Kontext präzise. „Als Fremde“ ist als Haupttextwiedergabe von גָּרִים vertretbar, solange die Fußnote die Nuance eines nicht dauerhaft ansässigen Aufenthalts verdeutlicht. Die Fußnote tut dies ohne unzulässige theologische Festlegung.
