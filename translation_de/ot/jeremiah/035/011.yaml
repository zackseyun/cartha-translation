translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und mündlich nachvollziehbar. Die Wiederholung von »Heer« bildet die parallele Struktur des Hebräischen ab; historische Namen werden quellennah beibehalten und in Fußnoten erläutert.
