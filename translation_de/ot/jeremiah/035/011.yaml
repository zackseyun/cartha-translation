  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. »Als … heranzog« und »So wohnten wir in Jerusalem« sind flüssig und sachlich, ohne den Sinn über die Quelle hinaus zu präzisieren.
  terminology: »Nebukadnezar«, »Babel«, »Chaldäer« und »Aram« sind angemessen und quellennah. Die Fußnoten bieten die relevanten lexikalischen Alternativen; ihre Anker stehen bei den jeweils erläuterten Begriffen.
