  text: וַ/יְהִ֗י בַּ/עֲל֨וֹת נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶל֮ אֶל הָ/אָרֶץ֒ וַ/נֹּ֗אמֶר בֹּ֚אוּ וְ/נָב֣וֹא יְרוּשָׁלִַ֔ם מִ/פְּנֵי֙ חֵ֣יל הַ/כַּשְׂדִּ֔ים וּ/מִ/פְּנֵ֖י חֵ֣יל אֲרָ֑ם וַ/נֵּ֖שֶׁב בִּ/ירוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
translation:
  language: de
  text: 'Als Nebukadnezar, der König von Babel, gegen das Land heranzog, sagten wir: »Kommt, lasst uns vor dem Heer der Chaldäer[a] und vor dem Heer Arams[b] nach Jerusalem gehen!« So wohnten wir in Jerusalem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Babylonier« statt »Chaldäer«.'
    reason: lexical_alternative
  - marker: b
    text: Aram wird traditionell auch mit »Syrien« wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּעֲלוֹת
  choice: Doch als … heranzog
  rationale: Die Konstruktion leitet einen zeitlichen Umstand mit leichtem Gegensatz zum vorausgehenden Zusammenhang ein; עלה bezeichnet hier das militärische Heranziehen.
- source_word: נְבוּכַדְרֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, der König von Babel
  rationale: Der Eigenname wird in seiner geläufigen deutschen Form wiedergegeben; Babel bewahrt die traditionelle biblische Bezeichnung des Reiches.
- source_word: אֶל הָאָרֶץ
  choice: gegen das Land
  rationale: Im militärischen Kontext drückt אֶל die gegen das Land gerichtete Bewegung aus; הָאָרֶץ bleibt bewusst allgemein, wie im Hebräischen.
- source_word: בֹּאוּ וְנָבוֹא יְרוּשָׁלִַם
  choice: Kommt, lasst uns … nach Jerusalem gehen
  rationale: Imperativ und Kohortativ bilden eine gemeinsame Aufforderung. Im Deutschen ist die Verbindung ohne zusätzliches »und« natürlich und wahrt die exhortative Kraft.
- source_word: מִפְּנֵי
  choice: vor
  rationale: Die Präposition bezeichnet hier den feindlichen Kräften gegenüber Flucht beziehungsweise Schutzsuche und ist mit »vor« knapp und idiomatisch wiedergegeben.
- source_word: חֵיל הַכַּשְׂדִּים
  choice: Heer der Chaldäer
  rationale: חֵיל meint eine militärische Streitmacht; »Chaldäer« bewahrt die ethnisch-politische Bezeichnung des Ausgangstextes.
- source_word: חֵיל אֲרָם
  choice: Heer Arams
  rationale: Der Eigenname אֲרָם wird als Aram transliteriert und nicht durch die spätere geografische Bezeichnung Syrien ersetzt.
- source_word: וַנֵּשֶׁב
  choice: So ließen wir uns … nieder
  rationale: ישב kann wohnen, bleiben oder sich niederlassen bedeuten. Der narrative Kontext beschreibt den daraus folgenden Aufenthalt in Jerusalem; »sich niederlassen« gibt diesen Übergang natürlich wieder.
