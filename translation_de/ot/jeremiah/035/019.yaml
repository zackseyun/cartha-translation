  text: לָ/כֵ֗ן כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לֹֽא יִכָּרֵ֨ת אִ֜ישׁ לְ/יוֹנָדָ֧ב בֶּן רֵכָ֛ב עֹמֵ֥ד לְ/פָנַ֖/י כָּל הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe der Heerscharen, der Gott Israels: Jonadab, dem Sohn Rechabs, wird niemals ein Mann fehlen, der allezeit vor mir steht.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Von Jonadab, dem Sohn Rechabs, wird kein Mann abgeschnitten werden, der alle Tage vor mir steht.“'
    reason: lexical_alternative
  - marker: b
    text: „Vor mir steht“ kann den Dienst in Gottes Gegenwart bezeichnen; ein bestimmtes Amt wird im Text jedoch nicht genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Partikel knapp und natürlich wieder und verbindet die Zusage mit dem vorausgehenden Geschehen.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die geläufige, feierliche Botenformel prophetischer Rede.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen als Eigennamen wieder; „Heerscharen“ bewahrt die Weite des Titels, ohne ihn nur auf irdische Heere einzuengen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: לֹא יִכָּרֵת אִישׁ לְיוֹנָדָב בֶּן רֵכָב
  choice: Jonadab, dem Sohn Rechabs, wird niemals ein Mann fehlen
  rationale: Gibt die idiomatische Bedeutung der wörtlichen Formulierung „ein Mann wird nicht abgeschnitten werden“ verständlich wieder und erhält zugleich den männlichen Singular sowie den Gedanken fortdauernder Vertretung aus Jonadabs Linie.
- source_word: עֹמֵד לְפָנַי
  choice: der … vor mir steht
  rationale: Bewahrt das Partizip und die offene Bedeutung des Stehens in Gottes Gegenwart, ohne ein bestimmtes priesterliches oder kultisches Amt einzutragen.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Natürliches, würdevolles Deutsch für die idiomatische Zeitangabe; es bezeichnet ununterbrochene beziehungsweise dauerhafte Fortgeltung.
theological_decisions:
- issue: Bedeutung der Zusage, dass ein Mann aus Jonadabs Linie vor Gott steht
  choice: Fortdauernde Gegenwart beziehungsweise Dienstbereitschaft eines Vertreters aus Jonadabs Linie, ohne Festlegung auf ein bestimmtes Amt
  alternative: Eine ausdrückliche Zusage dauernden priesterlichen oder tempelbezogenen Dienstes; oder lediglich das Fortbestehen biologischer Nachkommen
  rationale: „Vor mir stehen“ kann Dienst in Gottes Gegenwart bezeichnen, doch der Vers nennt kein besonderes Amt. Die Formulierung bleibt daher bewusst offen und bewahrt die theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem prophetischem Ton. „Allezeit“ ist gehoben, aber geläufig; die Satzstellung bleibt natürlich. Die Fußnotenzeichen stehen unmittelbar nach der auslegungsbedürftigen Aussage.
