id: JER.35.4
reference: Jeremiah 35:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
translation:
  language: de
  text: Da brachte ich sie in das Haus Jahwes[a], in den Raum der Söhne Hanans[b], des Sohnes Jigdaljas, des Mannes Gottes. Dieser Raum lag neben dem Raum der Amtsträger. Der Raum der Amtsträger wiederum lag über dem Raum Maasejas, des Sohnes Schallums, des Hüters der Schwelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „in den Tempel Jahwes“. Wörtlich: „in das Haus Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: „Söhne Hanans“ kann auch Hanans Nachkommen, seinen Haushalt oder eine ihm zugehörige Gruppe bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „Türhüter“ oder „Torhüter“. Wörtlich: „Hüter der Schwelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבִא
  choice: Da brachte ich
  rationale: Das Wayyiqtol führt die Erzählung mit dem nächsten Ereignis fort; „Da“ gibt diese zeitlich-fortschreitende Funktion in natürlichem Deutsch wieder.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt sowohl das hebräische Bild als auch den Gottesnamen; gemeint ist der Tempel.
- source_word: לִשְׁכַּת
  choice: den Raum
  rationale: לִשְׁכָּה bezeichnet hier einen Neben- oder Amtsraum im Tempelbereich. „Raum“ ist im heutigen Deutsch natürlicher als „Kammer“, ohne die bauliche Bedeutung einzuengen.
- source_word: בְּנֵי חָנָן
  choice: die Söhne Hanans
  rationale: Die formale Wiedergabe erhält die Mehrdeutigkeit von בְּנֵי, das leibliche Söhne, Nachkommen, einen Haushalt oder eine zugehörige Gruppe bezeichnen kann.
- source_word: אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  rationale: Die feste Ehren- und Amtsbezeichnung wird bestimmt wiedergegeben und nicht zu einer allgemeinen Aussage „ein Mann Gottes“ abgeschwächt.
- source_word: הַשָּׂרִים
  choice: die Amtsträger
  rationale: שָׂרִים bezeichnet ranghohe Verantwortliche. „Amtsträger“ passt zum institutionellen Zusammenhang, ohne sie unnötig als königliche Prinzen festzulegen.
- source_word: מִמַּעַל לְ
  choice: über
  rationale: Die Präposition beschreibt hier die vertikale Lage der Tempelräume.
- source_word: שֹׁמֵר הַסַּף
  choice: der Hüter der Schwelle
  rationale: Die Wiedergabe bewahrt das konkrete hebräische Bild und zugleich den Charakter einer Amtsbezeichnung; funktional kann ein Tür- oder Torhüter gemeint sein.
- source_word: חָנָן ... יִגְדַּלְיָהוּ ... מַעֲשֵׂיָהוּ ... שַׁלֻּם
  choice: Hanan ... Jigdalja ... Maaseja ... Schallum
  rationale: Die Personennamen werden nach geläufigen deutschen Transkriptionsformen wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im hebräischen Text ausdrücklich stehende Bundesname erkennbar bleibt.
- issue: Bedeutung der Bezeichnung אִישׁ הָאֱלֹהִים
  choice: der Mann Gottes
  alternative: ein Mann Gottes
  rationale: Die bestimmte Form bewahrt den Charakter einer anerkannten Bezeichnung, ohne näher festzulegen, welches konkrete Amt Hanan innehatte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufteilung in zwei Sätze entlastet die lange räumliche Beschreibung, ohne ihre Bezüge zu verändern. „Raum“ vermeidet den heute leicht altertümlichen oder missverständlichen Klang von „Kammer“; „Hüter der Schwelle“ bewahrt bewusst die Bildsprache des Ausgangstextes.
