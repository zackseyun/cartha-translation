source:
  edition: WLC
  text: וָ/אֶתֵּ֞ן לִ/פְנֵ֣י בְּנֵ֣י בֵית הָ/רֵכָבִ֗ים גְּבִעִ֛ים מְלֵאִ֥ים יַ֖יִן וְ/כֹס֑וֹת וָ/אֹמַ֥ר אֲלֵי/הֶ֖ם שְׁתוּ יָֽיִן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/005.yaml
  text: Then I set before the sons of the house of the Rekabites bowls full of wine and cups[a], and I said to them, “Drink wine.”
translation:
  language: de
  text: 'Dann stellte ich den Söhnen des Hauses der Rechabiter Schalen voller Wein und Becher hin und sagte zu ihnen: »Trinkt Wein!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן לִפְנֵי
  choice: Dann stellte ich … hin
  rationale: נתן mit לִפְנֵי bezeichnet hier das Hinstellen von Gefäßen vor Personen. Die Verbklammer „stellte … hin“ ist im modernen Deutschen natürlich; „Dann“ gibt den erzählerischen Fortgang wieder.
- source_word: בְּנֵי בֵית הָרֵכָבִים
  choice: den Söhnen des Hauses der Rechabiter
  rationale: Die Formulierung bewahrt die familiär-gemeinschaftliche Struktur des hebräischen „Söhne des Hauses“, ohne sie zu „Mitglieder“ zu verflachen. „Rechabiter“ ist die im Deutschen etablierte Namensform.
- source_word: גְּבִעִים
  choice: Schalen
  rationale: Das Wort bezeichnet schalenartige Gefäße. „Schalen“ unterscheidet sie klar von den anschließend genannten Bechern und vermeidet die speziellere Vorstellung von Kelchen.
- source_word: מְלֵאִים יַיִן
  choice: voller Wein
  rationale: Die knappe Adjektivkonstruktion gibt „voll von Wein“ idiomatisch und präzise wieder.
- source_word: וְכֹסוֹת
  choice: und Becher
  rationale: כּוֹס bezeichnet Trinkgefäße. „Becher“ bewahrt neben den Schalen die zwei im Hebräischen genannten Gefäßarten.
- source_word: וָאֹמַר אֲלֵיהֶם
  choice: und sagte zu ihnen
  rationale: Direkte und natürliche Wiedergabe der üblichen Redeeinleitung.
- source_word: שְׁתוּ יָיִן
  choice: Trinkt Wein!
  rationale: Der pluralische Imperativ und sein unbestimmtes Objekt werden knapp und ohne den interpretierenden Zusatz „etwas“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die hebräische Wiederholung von „Wein“ und die Unterscheidung zwischen zwei Gefäßarten bleiben erhalten. Keine Fußnote ist nötig, da „Rechabiter“ die etablierte deutsche Schreibung ist und keine für das Verständnis wesentliche Textvariante vorliegt.
