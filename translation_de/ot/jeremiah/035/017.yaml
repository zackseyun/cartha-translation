    rationale: Die Pluralform fügt eine konkrete Anrede der Hörenden hinzu. Das hebräische הִנְנִי ist primär eine emphatische Selbstankündigung („Siehe, ich ...“) und verlangt keine Pluralanrede.
  - severity: low
    issue: „über sie angekündigt“ für דִּבַּרְתִּי עֲלֵיהֶם
    rationale: Die deutsche Präposition „über“ ist hier weniger klar gerichtlich ausgerichtet. „gegen sie angekündigt“ gibt den Kontext und die feindliche Richtung von דבר על präziser wieder.
  - severity: medium
    issue: Unidiomatische Fußnotenalternative „all die Katastrophe“
    rationale: „Katastrophe“ wird in dieser Verbindung im modernen Deutschen nicht natürlich verwendet. Die Fußnote soll eine tatsächlich verwendbare lexikalische Alternative bieten.
