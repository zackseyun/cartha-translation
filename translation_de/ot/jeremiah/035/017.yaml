source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מֵבִ֣יא אֶל יְהוּדָ֗ה וְ/אֶ֤ל כָּל יֽוֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עֲלֵי/הֶ֑ם יַ֣עַן דִּבַּ֤רְתִּי אֲלֵי/הֶם֙ וְ/לֹ֣א שָׁמֵ֔עוּ וָ/אֶקְרָ֥א לָ/הֶ֖ם וְ/לֹ֥א עָנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe, der Gott der Heerscharen, der Gott Israels: Siehe, ich bringe über Juda und über alle Bewohner Jerusalems all das Unheil[a], das ich gegen sie angekündigt habe, weil ich zu ihnen sprach und sie nicht hörten, weil ich sie rief und sie nicht antworteten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das ganze Unglück“. Das hebräische Wort kann in anderen Zusammenhängen auch „Böses“ bedeuten; hier bezeichnet es das angekündigte Gericht über Juda und Jerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gegensatz zwischen dem Gehorsam der Rechabiter und Judas Ungehorsam; im Deutschen natürlich und logisch klar.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die feste prophetische Botenformel in einer im Deutschen vertrauten, würdevollen Form.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Gibt die Konstruktverbindung formal wieder und lässt die umfassende Bedeutung der himmlischen oder irdischen Scharen offen.
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Hebt die feierliche göttliche Ankündigung hervor; der Plural entspricht den angesprochenen Bewohnern, ohne das hebräische Aufmerksamkeitssignal abzuflachen.
- source_word: מֵבִיא אֶל
  choice: bringe über
  rationale: Drückt im Gerichtszusammenhang idiomatisch aus, dass das angekündigte Unheil die Betroffenen trifft.
- source_word: כָּל הָרָעָה
  choice: all das Unheil
  rationale: רָעָה bezeichnet hier das angekündigte Strafgericht beziehungsweise eine Katastrophe, nicht notwendig moralisch Böses.
- source_word: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם
  choice: das ich über sie angekündigt habe
  rationale: Gibt den gerichtlichen Sinn von דבר על natürlich wieder, ohne die Aussage als bloßes Reden über die Betroffenen misszuverstehen.
- source_word: וְלֹא שָׁמֵעוּ
  choice: aber sie haben nicht auf mich gehört
  rationale: Die deutsche Wendung bewahrt sowohl das Nicht-Hören als auch den im Zusammenhang hervortretenden Ungehorsam.
- source_word: וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  choice: ich habe sie gerufen, aber sie haben nicht geantwortet
  rationale: Gibt die parallele Anklage schlicht und direkt wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname macht diese Textform sichtbar, ohne einen Titel an seine Stelle zu setzen.
- issue: Bedeutung von הָרָעָה beim göttlichen Gericht
  choice: Unheil
  alternative: Böses
  rationale: Im Kontext bezeichnet das Wort die von Gott angekündigte Strafkatastrophe. „Unheil“ wahrt die negative Tragweite, ohne die Formulierung vorschnell als Aussage über moralisch Böses zu verstehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller prophetischer Färbung. Die traditionelle Botenformel „so spricht“ und „Heerscharen“ bewahren den feierlichen Ton; Satzbau und Verbformen bleiben zugleich gegenwärtig und klar.
