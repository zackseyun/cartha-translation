  text: and not to build houses for us to live in[a]; and vineyard and field and seed have not been ours.
translation:
  language: de
  text: und keine Häuser zu bauen, um darin zu wohnen; Weinberg, Feld und Saatgut besitzen wir nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְבִלְתִּי בְּנוֹת
  choice: und keine … zu bauen
  rationale: Die Verbindung aus Konjunktion, verneinter Infinitivkonstruktion und בנה wird im Deutschen natürlich mit „und keine … zu bauen“ wiedergegeben.
- source_word: בָּתִּים לְשִׁבְתֵּנוּ
  choice: Häuser …, um darin zu wohnen
  rationale: „Häuser“ bewahrt den konkreten Plural; die Zweckangabe gibt den Infinitiv ישׁב samt Suffix der ersten Person Plural verständlich wieder.
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  choice: auch Weinberg, Feld und Saatgut
  rationale: Die drei landwirtschaftlichen Begriffe bleiben wie im Hebräischen im Singular. „Saatgut“ bezeichnet hier verständlicher als das mehrdeutige „Samen“ den Vorrat zum Aussäen; „auch“ markiert den Anschluss der hebräischen Konjunktion.
- source_word: לֹא יִהְיֶה לָּנוּ
  choice: besitzen wir nicht
  rationale: Die hebräische Konstruktion „nicht für uns sein“ drückt Besitz aus. Das Präsens passt zur fortdauernden Lebensweise, von der die Sprecher berichten, ohne die Aussage auf einen einmaligen vergangenen Zustand festzulegen.
