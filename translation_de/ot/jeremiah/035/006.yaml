source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן רֵכָ֜ב אָבִ֗י/נוּ צִוָּ֤ה עָלֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹ֧א תִשְׁתּוּ יַ֛יִן אַתֶּ֥ם וּ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
translation:
  language: de
  text: 'Aber sie sagten[a]: »Wir werden keinen Wein trinken; denn Jonadab, der Sohn Rechabs, unser Vater[b], hat uns geboten: ›Ihr sollt keinen Wein trinken, weder ihr noch eure Söhne[c], für alle Zeit.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und sie sagten.« Die hebräische Erzählungsverknüpfung lässt beides zu; »aber« hebt den Gegensatz zur vorausgehenden Aufforderung hervor, Wein zu trinken.'
    reason: lexical_alternative
  - marker: b
    text: Mit »unser Vater« ist hier Jonadab als ihr Vorfahr oder Stammvater gemeint.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: »eure Söhne«; gemeint sind ausdrücklich die männlichen Nachkommen, nicht allgemein »Kinder«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Aber sie sagten
  rationale: Das narrative וַ führt die Handlung fort; »aber« macht zugleich den Gegensatz zur vorausgehenden Aufforderung, Wein zu trinken, natürlich sichtbar. Die Alternative »Und sie sagten« bleibt in der Fußnote erhalten.
- source_word: לֹא נִשְׁתֶּה יָּיִן
  choice: Wir werden keinen Wein trinken
  rationale: Der Imperfekt drückt hier im unmittelbaren Antwortkontext eine entschiedene Weigerung aus. Das Futur gibt diesen Entschluss im Deutschen klar wieder.
- source_word: יוֹנָדָב בֶּן רֵכָב
  choice: Jonadab, der Sohn Rechabs
  rationale: Die Namen werden in ihrer geläufigen deutschen biblischen Form wiedergegeben; die Patronymik wird idiomatisch und genau ausgedrückt.
- source_word: אָבִינוּ
  choice: unser Vater
  rationale: Die formale Wiedergabe bewahrt die hebräische Verwandtschaftssprache und ihren Sippenbezug; dass ein Vorfahr gemeint ist, wird in einer Fußnote erläutert.
- source_word: צִוָּה עָלֵינוּ לֵאמֹר
  choice: hat uns geboten
  rationale: Das deutsche Verb »gebieten« trägt die verpflichtende Kraft des hebräischen Ausdrucks. Das formelhafte לֵאמֹר muss vor einem unmittelbar folgenden Zitat nicht eigens mit »indem er sagte« wiederholt werden.
- source_word: לֹא תִשְׁתּוּ יַיִן
  choice: Ihr sollt keinen Wein trinken
  rationale: »sollt nicht« gibt das Verbot in würdigem, verständlichem Deutsch wieder, ohne es abzuschwächen.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: weder ihr noch eure Söhne
  rationale: Die wiederholte ausdrückliche Nennung der Angeredeten und ihrer männlichen Nachkommen bleibt erhalten. »Söhne« entspricht dem geschlechtsspezifischen בָּנִים.
- source_word: עַד עוֹלָם
  choice: für alle Zeit
  rationale: Die Wendung bezeichnet eine bleibende, in die unbestimmte Zukunft reichende Verpflichtung. »Für alle Zeit« ist natürlich und bewahrt diese Dauer.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich nachvollziehbar; die patriarchalische Verwandtschaftssprache des Ausgangstextes wird nicht verallgemeinert. Die Satzstellung »weder ihr noch eure Söhne« bildet die ausdrückliche Doppeladressierung natürlich ab.
