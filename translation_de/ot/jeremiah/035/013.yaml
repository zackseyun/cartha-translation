source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹ֤ךְ וְ/אָֽמַרְתָּ֙ לְ/אִ֣ישׁ יְהוּדָ֔ה וּ/לְ/יֽוֹשְׁבֵ֖י יְרֽוּשָׁלִָ֑ם הֲ/ל֨וֹא תִקְח֥וּ מוּסָ֛ר לִ/שְׁמֹ֥עַ אֶל דְּבָרַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/013.yaml
  text: 'Thus says the LORD of hosts, the God of Israel: Go and say to the men of Judah and to the inhabitants of Jerusalem, ‘Will you not receive instruction by listening to my words? declares the LORD.’'
translation:
  language: de
  text: 'So spricht der HERR der Heerscharen, der Gott Israels: Geh und sage zu den Männern von Juda und zu den Bewohnern Jerusalems: »Wollt ihr keine Unterweisung annehmen und auf meine Worte hören?«, spricht der HERR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: der HERR der Heerscharen
  rationale: Gibt den Gottesnamen gemäß verbreiteter deutscher Bibeltradition als HERR wieder und bewahrt den militärisch-kosmischen Titel צְבָאוֹת formal als »Heerscharen«.
- source_word: לְאִישׁ יְהוּדָה
  choice: zu den Männern von Juda
  rationale: Der kollektive Singular אִישׁ bezeichnet hier die Männer beziehungsweise die Bevölkerung Judas; die Pluralform ist im Deutschen natürlich und bleibt nahe am Sinn.
- source_word: מוּסָר
  choice: Unterweisung
  rationale: Das Wort kann Erziehung, Zurechtweisung oder Unterweisung bedeuten. »Unterweisung« bewahrt den pädagogischen Aspekt, ohne die Bedeutung vorschnell auf Strafe zu verengen.
- source_word: לִשְׁמֹעַ אֶל דְּבָרַי
  choice: und auf meine Worte hören
  rationale: שׁמע אל bezeichnet aufmerksames, gehorsames Hören. Die koordinierte deutsche Wiedergabe ist natürlich; die mögliche modale Beziehung zur Annahme der Unterweisung bleibt im Zusammenhang erkennbar.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die feste prophetische Botenformel wird in ihrer üblichen, würdevollen deutschen Form wiedergegeben.
theological_decisions:
- issue: Beziehung zwischen Unterweisung und Hören
  choice: »Unterweisung annehmen und auf meine Worte hören«
  alternative: »Unterweisung annehmen, indem ihr auf meine Worte hört«
  rationale: Der hebräische Infinitiv לִשְׁמֹעַ kann Zweck, nähere Erläuterung oder Folge ausdrücken. Die koordinierte Fassung vermeidet, diese syntaktische Beziehung stärker festzulegen, als der Ausgangstext verlangt.
- issue: Wiedergabe des Tetragramms
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: »HERR« folgt einer etablierten deutschsprachigen Lesetradition und unterscheidet den Gottesnamen typografisch vom gewöhnlichen Herrentitel, ohne eine unsichere Vokalisierung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Formelstil. Die direkte Frage bleibt eindringlich, ohne altertümliche Wortstellung. Keine Fußnoten erforderlich.
