source:
  edition: WLC
  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
translation:
  language: de
  text: Geh zum Haus der Rechabiter und rede mit ihnen. Bring sie in das Haus Jahwes[a], in einen der Räume, und gib ihnen Wein zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in den Tempel Jahwes. Wörtlich: in das Haus Jahwes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ
  choice: Geh
  rationale: Der Imperativ von הלך ist hier ein unmittelbarer Auftrag; „Geh“ ist die natürliche und präzise deutsche Wiedergabe.
- source_word: בֵּית הָרֵכָבִים
  choice: zum Haus der Rechabiter
  rationale: בֵּית bezeichnet hier die Rechabiter als Haus beziehungsweise Sippenverband. „Haus der Rechabiter“ bewahrt die hebräische Ausdrucksweise, ohne sie auf ein Gebäude festzulegen.
- source_word: וְדִבַּרְתָּ אוֹתָם
  choice: und rede mit ihnen
  rationale: דבר mit אֵת kann „mit jemandem reden“ bedeuten. Diese Fassung ist im Deutschen natürlich und bewahrt den möglichen dialogischen Sinn.
- source_word: וַהֲבִאוֹתָם
  choice: Bring sie dann
  rationale: Der Hifil von בוא hat kausative Bedeutung; „bringen“ gibt sie idiomatisch wieder. „Dann“ bildet die Abfolge der waw-verbundenen Aufträge natürlich ab.
- source_word: בֵּית יְהוָה
  choice: in das Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ wird beibehalten; im Zusammenhang ist damit der Tempel gemeint, doch die Übersetzung vermeidet eine unnötige interpretierende Ersetzung.
- source_word: אַחַת הַלְּשָׁכוֹת
  choice: in einen der Räume
  rationale: לִשְׁכָּה bezeichnet einen Nebenraum oder eine Kammer im Tempelbereich. „Raum“ ist modern und verständlich, ohne eine ungesicherte genauere Funktion festzulegen.
- source_word: וְהִשְׁקִיתָ אוֹתָם יָיִן
  choice: und gib ihnen Wein zu trinken
  rationale: Der Hifil von שקה bedeutet, jemanden trinken zu lassen beziehungsweise ihm zu trinken zu geben. Die Fassung vermeidet die im Deutschen mögliche Zwangsbedeutung von „lass sie Wein trinken“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als persönlicher Name wiedergegeben; „Jahwe“ ist die übliche deutsche Form der wissenschaftlichen Transliteration.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. „Jahwe“ bewahrt ihn, während „der HERR“ die traditionelle Ersatzlesung wiedergibt.
- issue: Bedeutung von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: Im Kontext ist der Tempel gemeint, doch „Haus Jahwes“ entspricht der konkreten hebräischen Formulierung und bewahrt deren Bildsprache.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Imperativsätze sorgen für Klarheit. „Haus der Rechabiter“ und „Haus Jahwes“ bewahren bewusst die wiederholte hebräische Haus-Terminologie; der erste Ausdruck bezeichnet wahrscheinlich den Sippenverband, der zweite den Tempel.
