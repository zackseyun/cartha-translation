id: JER.35.12
reference: Jeremiah 35:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/012.yaml
  text: Then the word of Yahweh came to Yirmeyahu[a], saying[b],
translation:
  language: de
  text: 'Da erging das Wort Jahwes[a] an Jirmejahu[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (יהוה), hier „Jahwe“; traditionell wird der Gottesname mit „der HERR“ wiedergegeben.'
    reason: alternative_reading
  - marker: b
    text: Die hebräische Namensform Jirmejahu wird traditionell als „Jeremia“ wiedergegeben.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form von היה führt hier den nächsten Erzählabschnitt ein. Zusammen mit דְּבַר יְהוָה entspricht „Da erging“ der etablierten, natürlichen deutschen Prophetenformel, ohne das hebräische Idiom hölzern als „Und es geschah“ wiederzugeben.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der festen prophetischen Wendung דְּבַר יְהוָה bezeichnet das Substantiv die göttliche Mitteilung. „Das Wort“ bewahrt zugleich die wiederkehrende Formulierung des Ausgangstextes.
- source_word: יְהוָה
  choice: Jahwes
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; die Form „Jahwes“ ist der im deutschen Satz erforderliche Genitiv.
- source_word: אֶל
  choice: an
  rationale: Bei der deutschen Wendung „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger der Mitteilung.
- source_word: יִרְמְיָהוּ
  choice: Jirmejahu
  rationale: „Jirmejahu“ gibt die hebräische Namensform möglichst direkt und zugleich deutsch lesbar wieder.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה und keinen Titel. „Jahwe“ macht diesen Namen im Deutschen sichtbar, während die traditionelle Ersatzlesung in der Fußnote genannt wird.
- issue: Wiedergabe der Prophetenformel לֵאמֹר
  choice: Doppelpunkt
  alternative: mit den Worten
  rationale: Der Doppelpunkt lässt die folgende direkte Rede als Inhalt des göttlichen Wortes offen anschließen und fügt keine ausdrücklich genannte Sprechweise hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „Da erging das Wort … an …“ wahrt den feierlichen Erzählton; der Doppelpunkt gibt לֵאמֹר knapp und idiomatisch wieder.
