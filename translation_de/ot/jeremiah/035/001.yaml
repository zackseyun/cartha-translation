id: JER.35.1
reference: Jeremiah 35:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/ימֵ֨י יְהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
translation:
  language: de
  text: 'Das Wort, das in den Tagen Jojakims, des Sohnes Josias, des Königs von Juda, von Jahwe an Jeremia erging[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht hier der Gottesname JHWH.
    reason: Kennzeichnung des im Ausgangstext verwendeten göttlichen Eigennamens.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: Bewahrt die feste prophetische Eingangsformel und gibt דָּבָר transparent wieder; »Botschaft« wäre möglich, aber deutender.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das … an Jeremia erging
  rationale: Natürliches, würdevolles Deutsch für die prophetische Offenbarungsformel, ohne sie auf ein bloßes Geschehen zu reduzieren.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Im Deutschen etablierte Form des Personennamens.
- source_word: מֵאֵת
  choice: von
  rationale: Kennzeichnet hier Jahwe als Ursprung des Wortes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen JHWH wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: בִּימֵי
  choice: in den Tagen
  rationale: Entspricht der hebräischen Zeitangabe und bewahrt ihren weiteren Sinn gegenüber »während der Regierungszeit«.
- source_word: יְהוֹיָקִים
  choice: Jojakim
  rationale: Im Deutschen gebräuchliche biblische Namensform.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: des Sohnes Josias
  rationale: Gibt die genealogische Zuordnung in natürlicher deutscher Apposition wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Ordnet den Amtstitel eindeutig Jojakim zu und entspricht der hebräischen Apposition.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt im modernen Deutschen natürlich in die folgende direkte Rede ein; ein wörtliches »indem er sagte« wäre schwerfällig.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. »Jahwe« bewahrt dessen Eigennamecharakter; die Fußnote macht die hebräische Form ausdrücklich kenntlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel »Das Wort … erging« bleibt erhalten. Die verschachtelte königliche Datierung folgt dem Hebräischen, ist aber durch deutsche Genitivappositionen klar gegliedert. Der Doppelpunkt stellt die Verbindung zur folgenden Rede idiomatisch her.
