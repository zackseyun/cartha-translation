source:
  edition: WLC
  text: וְ/אַתָּ֣ה פַשְׁח֗וּר וְ/כֹל֙ יֹשְׁבֵ֣י בֵיתֶ֔/ךָ תֵּלְכ֖וּ בַּ/שֶּׁ֑בִי וּ/בָבֶ֣ל תָּב֗וֹא וְ/שָׁ֤ם תָּמוּת֙ וְ/שָׁ֣ם תִּקָּבֵ֔ר אַתָּה֙ וְ/כָל אֹ֣הֲבֶ֔י/ךָ אֲשֶׁר נִבֵּ֥אתָ לָ/הֶ֖ם בַּ/שָּֽׁקֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/006.yaml
  text: And you[a], Pashhur, and all who live in your house will go into captivity; and you will come to Babylon, and there you will die, and there you will be buried—you and all your loved ones, to whom you prophesied falsely.
translation:
  language: de
  text: Und du, Paschhur, und alle, die in deinem Haus leben, werden in die Gefangenschaft gehen. Du wirst nach Babel kommen; dort wirst du sterben, und dort wirst du begraben werden – du und alle, die dich lieben und denen du falsch geweissagt hast.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denen du Lügen geweissagt hast“.'
    reason: Lexikalische Alternative für בַּשָּׁקֶר; die Wendung kann sowohl die Falschheit des Weissagens als auch Lügen als dessen Inhalt hervorheben.
lexical_decisions:
- source_word: יֹשְׁבֵי בֵיתֶךָ
  choice: alle, die in deinem Haus leben
  rationale: Die partizipiale Wendung bezeichnet die in Paschhurs Haus Lebenden beziehungsweise seinen Haushalt. Die gewählte Form ist natürliches modernes Deutsch und wahrt den Umfang des Ausdrucks.
- source_word: תֵּלְכוּ בַּשֶּׁבִי
  choice: werden in die Gefangenschaft gehen
  rationale: Die Wendung bezeichnet, dass Menschen als Gefangene weggeführt werden. „Gefangenschaft“ bildet שׁבי genauer ab als das allgemeinere „Exil“.
- source_word: וּבָבֶל תָּבוֹא
  choice: Du wirst nach Babel kommen
  rationale: Das hebräische Verb bedeutet „kommen/eintreten“. „Nach Babel kommen“ erhält diese Perspektive, ohne im Deutschen unnatürlich zu wirken.
- source_word: וְשָׁם תָּמוּת וְשָׁם תִּקָּבֵר
  choice: dort wirst du sterben, und dort wirst du begraben werden
  rationale: Das wiederholte שׁם wird als „dort“ beibehalten und betont den Ort und die Gewissheit des angekündigten Gerichts.
- source_word: אֹהֲבֶיךָ
  choice: alle, die dich lieben
  rationale: Das substantivierte Partizip bezeichnet wörtlich diejenigen, die Paschhur lieben. Diese Wiedergabe bewahrt die relationale Breite besser als das engere „Freunde“.
- source_word: נִבֵּאתָ לָהֶם בַּשָּׁקֶר
  choice: denen du falsch geweissagt hast
  rationale: Die Formulierung gibt die Anklage falscher prophetischer Rede idiomatisch wieder, ohne über die subjektive Absicht Paschhurs hinauszugehen.
theological_decisions:
- issue: Art von Paschhurs Vergehen in seiner prophetischen Rede
  choice: denen du falsch geweissagt hast
  alternative: denen du Lügen geweissagt hast
  rationale: Der Text verurteilt die Prophetie als falsch, legt aber nicht zwingend fest, mit welcher subjektiven Absicht Paschhur sprach. Die Hauptfassung wahrt diese Spannung; die stärker inhaltsbezogene Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Babel“ folgt der im deutschen Bibelstil etablierten Form des hebräischen Ortsnamens. Die Wiederholung von „dort“ und der Wechsel vom gemeinsamen Geschick zur direkten Anrede bleiben erhalten.
