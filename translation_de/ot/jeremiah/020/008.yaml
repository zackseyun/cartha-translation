  text: כִּֽי מִ/דֵּ֤י אֲדַבֵּר֙ אֶזְעָ֔ק חָמָ֥ס וָ/שֹׁ֖ד אֶקְרָ֑א כִּֽי הָיָ֨ה דְבַר יְהוָ֥ה לִ֛/י לְ/חֶרְפָּ֥ה וּ/לְ/קֶ֖לֶס כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/008.yaml
  text: For whenever I speak[a], I cry out; I proclaim, “Violence and destruction!” For the word of Yahweh has become to me a reproach and a derision all day long.
translation:
  language: de
  text: 'Denn sooft ich rede, schreie ich auf; ich rufe: »Gewalt und Zerstörung!« Denn das Wort Jahwes ist mir den ganzen Tag zu Hohn und Spott geworden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדֵּי
  choice: sooft
  rationale: Die Verbindung מִדֵּי mit dem Imperfekt bezeichnet ein wiederholtes Geschehen; »sooft« gibt diesen iterativen Sinn knapp und natürlich wieder.
- source_word: אֲדַבֵּר
  choice: ich rede
  rationale: Das Piel-Imperfekt steht innerhalb der iterativen Wendung und wird daher als wiederholte Gegenwart verstanden.
- source_word: אֶזְעָק
  choice: muss ich aufschreien
  rationale: זעק bezeichnet einen eindringlichen lauten Ruf. Das deutsche »muss« macht den aus dem Zusammenhang hervorgehenden zwangsläufigen Inhalt seiner Rede natürlich verständlich, ohne eine äußere Verpflichtung festzulegen.
- source_word: חָמָס
  choice: Gewalt
  rationale: חָמָס bezeichnet hier Gewalt beziehungsweise gewaltsames Unrecht; »Gewalt« ist direkt und im prophetischen Zusammenhang geläufig.
- source_word: שֹׁד
  choice: Zerstörung
  rationale: שֹׁד kann Verwüstung, Zerstörung oder Plünderung bezeichnen. »Zerstörung« bewahrt die Breite des Ausdrucks und bildet mit »Gewalt« ein natürliches Wortpaar.
- source_word: אֶקְרָא
  choice: ich muss rufen
  rationale: קרא bezeichnet hier das öffentliche Ausrufen der Botschaft. »rufen« erhält die Parallelität zu »aufschreien«, ohne beide Verben gleich wiederzugeben.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Wendung wird wörtlich und mit ihrer theologischen sowie literarischen Prägung wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im deutschen Text als »Jahwe« transliteriert statt durch einen Titel ersetzt.
- source_word: לְחֶרְפָּה
  choice: Hohn
  rationale: חֶרְפָּה umfasst Schmach, Beschimpfung und verhöhnende Behandlung. »Hohn« passt im Deutschen natürlich zur folgenden »Spott«-Parallele.
- source_word: קֶלֶס
  choice: Spott
  rationale: קֶלֶס bezeichnet Verspottung oder Lächerlichmachung; »Spott« ist verständlich, prägnant und registergerecht.
- source_word: כָּל הַיּוֹם
  choice: den ganzen Tag
  rationale: Die Wendung bezeichnet eine über den ganzen Tag andauernde beziehungsweise ständig wiederkehrende Erfahrung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen ausdrücklich. Die Transliteration »Jahwe« bewahrt diesen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von לְחֶרְפָּה וּלְקֶלֶס
  choice: Das Wort Jahwes bringt Jeremia Hohn und Spott ein
  alternative: Das Wort Jahwes selbst ist Gegenstand von Hohn und Spott
  rationale: Die Formulierung »war mir zu Hohn und Spott« lässt offen, ob primär der Prophet wegen der Botschaft oder die Botschaft selbst verspottet wird. Die deutsche Fassung stellt Jeremias persönliche Erfahrung heraus, ohne auszuschließen, dass der Spott dem verkündeten Wort gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verben »aufschreien« und »rufen« erhalten die Intensität des Hebräischen. »Hohn und Spott« ist idiomatischer als substantivische Bildungen wie »Schmach und Verhöhnung«. Keine Fußnote nötig; alle Markeranforderungen sind daher gegenstandslos.
