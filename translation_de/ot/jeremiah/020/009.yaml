source:
  edition: WLC
  text: וְ/אָמַרְתִּ֣י לֹֽא אֶזְכְּרֶ֗/נּוּ וְ/לֹֽא אֲדַבֵּ֥ר עוֹד֙ בִּ/שְׁמ֔/וֹ וְ/הָיָ֤ה בְ/לִבִּ/י֙ כְּ/אֵ֣שׁ בֹּעֶ֔רֶת עָצֻ֖ר בְּ/עַצְמֹתָ֑/י וְ/נִלְאֵ֥יתִי כַּֽלְכֵ֖ל וְ/לֹ֥א אוּכָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/009.yaml
  text: If I say[a], “I will not mention him, or speak any longer in his name,” then in my heart it is like a burning fire, shut up in my bones; I grow weary of holding it in[c][b], and I cannot.
translation:
  language: de
  text: 'Wenn ich sage[a]: »Ich will ihn nicht erwähnen und nicht weiter in seinem Namen[b] reden«, dann ist es in meinem Herzen wie ein brennendes Feuer, eingeschlossen in meinen Knochen. Ich bin müde, es zurückzuhalten[c], und kann es nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn ich sage: Ich will mich nicht an ihn erinnern.« Das hebräische Verb kann sowohl »sich erinnern« als auch »erwähnen« bedeuten; hier passt »erwähnen« zum parallelen Reden.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: als sein Beauftragter oder unter seiner Autorität reden.'
    reason: cultural_note
  - marker: c
    text: Das Hebräische nennt nicht ausdrücklich, was zurückgehalten wird. Gemeint ist wahrscheinlich die Botschaft des HERRN oder der innere Zwang, sie auszusprechen.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַרְתִּי
  choice: Wenn ich sage
  rationale: Das formal rückblickende Waw mit Qatal bezeichnet im Zusammenhang Jeremias wiederkehrenden beziehungsweise hypothetischen Entschluss. Die konditionale Wiedergabe bildet den inneren Vorgang natürlich ab.
- source_word: אֶזְכְּרֶנּוּ
  choice: ich will ihn nicht mehr erwähnen
  rationale: זכר kann »sich erinnern« oder »erwähnen« bedeuten. Wegen des parallelen »reden« ist hier die sprachbezogene Bedeutung wahrscheinlicher; die Alternative bleibt in Fußnote [a] erhalten.
- source_word: אֲדַבֵּר עוֹד בִּשְׁמוֹ
  choice: nicht mehr in seinem Namen reden
  rationale: Die Formulierung bewahrt die hebräische Wendung für das Reden als Beauftragter beziehungsweise unter der Autorität eines anderen.
- source_word: וְהָיָה בְלִבִּי
  choice: dann ist es in meinem Herzen
  rationale: Das maskuline Pronomen bleibt ohne ausdrücklich genanntes Bezugswort, wie im Hebräischen. »Es« vermeidet eine vorschnelle Festlegung auf »Wort« oder »Botschaft«.
- source_word: כְּאֵשׁ בֹּעֶרֶת
  choice: wie ein brennendes Feuer
  rationale: Die konkrete und intensive Bildsprache des hebräischen Nomens mit Partizip bleibt erhalten.
- source_word: עָצֻר בְּעַצְמֹתָי
  choice: eingeschlossen in meinen Gebeinen
  rationale: עצר bezeichnet hier etwas Zurückgehaltenes oder Eingeschlossenes. »Gebeine« erhält das körperlich eindringliche Bild in würdigem Deutsch.
- source_word: וְנִלְאֵיתִי כַּלְכֵל
  choice: Ich mühe mich ab, es zurückzuhalten
  rationale: נלאיתי drückt Ermüdung und Erschöpfung aus; כלכל bezeichnet hier das anstrengende Eindämmen beziehungsweise Zurückhalten.
- source_word: וְלֹא אוּכָל
  choice: und kann es nicht
  rationale: Die knappe Aussage der Unfähigkeit bleibt erhalten; das ergänzte »es« bezieht sich grammatisch auf das Zurückhalten, ohne das Feuer näher zu bestimmen.
theological_decisions:
- issue: Bezugswort der Pronomen »ihn« und »seinem«
  choice: Die Pronomen bleiben im Haupttext stehen.
  alternative: Den Bezug ausdrücklich als »den HERRN« wiedergeben.
  rationale: Der Zusammenhang macht den Bezug verständlich, doch der hebräische Vers selbst verwendet Pronomen. Ihre Beibehaltung vermeidet eine nicht ausdrücklich dastehende Ergänzung.
- issue: Unausgesprochenes Subjekt des Feuers und Objekt des Zurückhaltens
  choice: Mit dem unbestimmten Pronomen »es« wiedergeben.
  alternative: Ausdrücklich »sein Wort« oder »seine Botschaft« einsetzen.
  rationale: Der Zusammenhang legt die göttliche Botschaft beziehungsweise den Zwang, sie auszusprechen, nahe. Der hebräische Wortlaut nennt dies jedoch nicht ausdrücklich; die Unbestimmtheit bleibt deshalb erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Gebeine« ist bewusst etwas gehobener als »Knochen«, wahrt aber die körperliche Wucht des Bildes. Die Satzfolge und die nicht aufgelösten Pronomen bewahren die Spannung des hebräischen Textes.
