  variant: modern standard German
source:
  edition: WLC
  text: וַֽ/יהוָ֤ה אוֹתִ/י֙ כְּ/גִבּ֣וֹר עָרִ֔יץ עַל כֵּ֛ן רֹדְפַ֥/י יִכָּשְׁל֖וּ וְ/לֹ֣א יֻכָ֑לוּ בֹּ֤שׁוּ מְאֹד֙ כִּֽי לֹ֣א הִשְׂכִּ֔ילוּ כְּלִמַּ֥ת עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/011.yaml
  text: But Yahweh is with me like a mighty warrior[a]; therefore my persecutors will stumble and will not prevail. They will be utterly ashamed, because they have not acted wisely[c][b]; their everlasting disgrace will not be forgotten.
translation:
  language: de
  text: Doch Jahwe ist bei mir wie ein gewaltiger, furchterregender Krieger. Darum werden meine Verfolger[a] straucheln und nichts ausrichten. Sie werden tief beschämt sein, weil sie nicht einsichtig gehandelt haben[b]. Ihre ewige Schande wird nicht vergessen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, mit stärker konkreter Nuance: „die hinter mir her sind“ oder „die mich verfolgen“.'
    reason: רדף kann feindseliges Verfolgen ebenso wie konkretes Hinterherjagen bezeichnen.
  - marker: b
    text: 'Oder: „weil sie nicht verstanden haben“ beziehungsweise „weil sie nicht mit Einsicht gehandelt haben“.'
    reason: Der Hifil von שׂכל lässt sowohl eine kognitive als auch eine handlungsbezogene Nuance zu.
lexical_decisions:
- source_word: וַיהוָה אוֹתִי
  choice: Doch Jahwe ist bei mir
  rationale: Das ו wird wegen des Gegensatzes zur vorangehenden Klage adversativ mit „Doch“ wiedergegeben. Die verblöse Wendung mit אוֹתִי bezeichnet hier Jahwes unterstützende Gegenwart und wird im Deutschen natürlich als „ist bei mir“ ausgedrückt.
- source_word: כְגִבּוֹר עָרִיץ
  choice: wie ein gewaltiger, furchterregender Krieger
  rationale: גִּבּוֹר bezeichnet einen starken Krieger oder Helden; עָרִיץ verstärkt das Bild im Sinn von furchterregend oder überwältigend. Beide Bestandteile bleiben ausdrücklich erhalten.
- source_word: עַל כֵּן
  choice: Darum
  rationale: Die knappe deutsche Folgerungspartikel gibt den inferentiellen Zusammenhang natürlich wieder.
- source_word: רֹדְפַי
  choice: meine Verfolger
  rationale: רדף kann sowohl körperliches Verfolgen als auch feindselige Verfolgung bezeichnen. „Verfolger“ passt zum sozialen Konflikt, während eine Fußnote die konkretere Alternative nennt.
- source_word: יִכָּשְׁלוּ
  choice: werden straucheln
  rationale: „Straucheln“ bewahrt das hebräische Bild und bezeichnet das Scheitern, ohne dessen Ausmaß über den Text hinaus festzulegen.
- source_word: וְלֹא יֻכָלוּ
  choice: und nichts ausrichten
  rationale: יכל bedeutet wörtlich „können“; im feindlichen Handlungskontext drückt die Wendung aus, dass die Verfolger keinen Erfolg haben werden.
- source_word: בֹּשׁוּ מְאֹד
  choice: Sie werden tief beschämt sein
  rationale: בוש bezeichnet Scham beziehungsweise Beschämung, und מְאֹד verstärkt sie. „Tief beschämt“ ist kräftig und idiomatisch.
- source_word: כִּי לֹא הִשְׂכִּילוּ
  choice: weil sie nicht einsichtig gehandelt haben
  rationale: Der Hifil von שׂכל kann Verstehen, Einsicht oder einsichtiges beziehungsweise kluges Handeln bezeichnen. Die gewählte Formulierung erhält die handlungsbezogene Nuance, ohne die Verständnisnuance auszuschließen.
- source_word: כְּלִמַּת עוֹלָם
  choice: Ihre ewige Schande
  rationale: כְּלִמָּה bezeichnet Schande oder Schmach; עוֹלָם kennzeichnet sie als dauerhaft. „Ewige Schande“ ist knapp, würdevoll und sachlich.
- source_word: לֹא תִשָּׁכֵחַ
  choice: wird nicht vergessen werden
  rationale: Die feminine Singularform bezieht sich auf „Schande“ und wird als unpersönliches Passiv wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt den offenbarten Bundesnamen direkt wieder und folgt der vorgegebenen Projektentscheidung, ohne ihn durch einen Titel zu ersetzen.
- issue: Art der göttlichen Gegenwart in אוֹתִי
  choice: ist bei mir
  alternative: ist mit mir; steht mir bei
  rationale: „Ist bei mir“ wahrt die Aussage göttlicher Gegenwart und Unterstützung, ohne durch „steht mir bei“ die implizite Hilfe stärker auszudeuten, als es die verblöse hebräische Klausel ausdrücklich tut.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die Satzglieder folgen weitgehend der hebräischen Gedankenfolge. Das martialische Bild und die Mehrdeutigkeit von שׂכל bleiben erhalten; konfessionell geprägte Zusatzdeutungen werden vermieden.
