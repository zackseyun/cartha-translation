base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/003.yaml
  text: And it happened the next day[a], when Pashhur brought Jeremiah out of the stocks, that Jeremiah said to him, “Yahweh has not called your name Pashhur, but Terror on Every Side.”
translation:
  language: de
  text: 'Am nächsten Tag, als Paschhur Jeremia aus dem Fesselblock holte, sagte Jeremia zu ihm: „Jahwe hat dich nicht Paschhur genannt, sondern ‚Schrecken ringsum‘[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: Magor-Missabib; ein Wortspiel mit der Bedeutung „Schrecken ringsum“ oder „Schrecken von allen Seiten“.'
    reason: Das hebräische Namenswortspiel und seine mögliche Bedeutungsbreite sind in der deutschen Übersetzung nicht vollständig sichtbar.
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: am nächsten Tag
  rationale: Die geläufige deutsche Zeitangabe gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: וַיֹּצֵא ... אֶת יִרְמְיָהוּ מִן הַמַּהְפָּכֶת
  choice: holte ... Jeremia aus dem Fesselblock
  rationale: Die Kausativform von יצא bezeichnet das Herausbringen. „Holte ... aus“ ist im Deutschen natürlich; „Fesselblock“ macht verständlich, dass מַהְפָּכֶת ein Straf- und Fesselgerät war, ohne seine genaue Bauart festzulegen.
- source_word: קָרָא ... שְׁמֶךָ
  choice: hat ... dich genannt
  rationale: Die deutsche Benennungsformel bewahrt den Vorgang einer göttlichen Umbenennung, ohne den hebräischen Ausdruck „deinen Namen nennen“ unnatürlich nachzubilden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Wiedergabe des göttlichen Eigennamens bewahrt den Tetragrammaton als Namen statt ihn durch einen Titel zu ersetzen.
- source_word: מָגוֹר מִסָּבִיב
  choice: Schrecken ringsum
  rationale: Die Wendung bezeichnet ringsum drohenden beziehungsweise umgebenden Schrecken und fungiert hier als neuer Name; die knappe Form erhält den Wortspielcharakter.
- source_word: פַשְׁחוּר
  choice: Paschhur
  rationale: Der Personenname wird nach geläufiger deutscher Bibelnamen-Orthografie transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich den Gottesnamen. Seine Wiedergabe als „Jahwe“ wahrt den Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Göttliche Umbenennung Paschhurs
  choice: Nicht Paschhur hat Jahwe dich genannt, sondern „Schrecken ringsum“
  alternative: Dein Name ist nicht Paschhur, sondern „Schrecken ringsum“
  rationale: Die gewählte Form bewahrt Jahwe ausdrücklich als den Handelnden der Benennung und lässt offen, ob die Aussage als prophetische Namensgebung, Gerichtswort oder Charakterisierung zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde gegenüber einer schwerfälligen wörtlichen Nachbildung geglättet. „Fesselblock“ ist anschaulicher als das heute mehrdeutige „Stock“, legt aber die genaue Konstruktion des Strafgeräts nicht fest. Der Fußnotenmarker steht bei der tatsächlich erläuterten Namensgebung.
