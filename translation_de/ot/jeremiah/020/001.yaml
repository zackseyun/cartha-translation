id: JER.20.1
reference: Jeremiah 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע פַּשְׁחוּר֙ בֶּן אִמֵּ֣ר הַ/כֹּהֵ֔ן וְ/הֽוּא פָקִ֥יד נָגִ֖יד בְּ/בֵ֣ית יְהוָ֑ה אֶֽת יִרְמְיָ֔הוּ נִבָּ֖א אֶת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/001.yaml
  text: Pashhur son of Immer the priest[a], who was chief officer in the house of Yahweh, heard Jeremiah prophesying these words.
translation:
  language: de
  text: Paschhur, der Sohn Immers, der Priester und oberste Aufseher im Haus Jahwes[a], hörte, wie Jeremia diese Worte prophetisch verkündete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“; wörtlich: „im Haus Jahwes“.'
    reason: Die Wendung bezeichnet sachlich den Tempel, lautet im Hebräischen jedoch wörtlich „Haus Jahwes“.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: hörte
  rationale: שׁמע bezeichnet hier schlicht das Wahrnehmen der prophetischen Rede; „hörte zu“ würde eine vom Hebräischen nicht geforderte bewusste Aufmerksamkeit nahelegen. Das narrative וַ wird nicht mit einem zusätzlichen deutschen Diskurswort wiedergegeben.
- source_word: פַּשְׁחוּר בֶּן אִמֵּר
  choice: Paschhur, der Sohn Immers
  rationale: Die Eigennamen werden in geläufiger deutscher Form wiedergegeben; die Patronymik bleibt ausdrücklich erhalten.
- source_word: הַכֹּהֵן
  choice: der Priester
  rationale: Der bestimmte Artikel und die appositionelle Amtsbezeichnung werden formal bewahrt.
- source_word: וְהוּא פָקִיד נָגִיד
  choice: und oberste Aufseher
  rationale: פקיד bezeichnet einen bestellten Aufseher oder Amtsträger, während נגיד dessen leitenden Rang hervorhebt. „Oberster Aufseher“ gibt die kombinierte Amtsbezeichnung knapp und verständlich wieder.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus“ bewahrt das Bild des hebräischen בַּיִת; im Zusammenhang ist damit der Tempel gemeint.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: נִבָּא
  choice: prophezeite
  rationale: Die partizipiale Form beschreibt Jeremias gleichzeitig stattfindende prophetische Rede; die Konstruktion „hörte, wie … prophezeite“ gibt diese Gleichzeitigkeit natürlich wieder.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דברים bezeichnet hier den unmittelbar vorausgehenden Inhalt von Jeremias prophetischer Rede; „Worte“ wahrt den verbalen Bezug.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Tetragrammaton als persönlichen Gottesnamen. „Jahwe“ bewahrt diesen Namenscharakter, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der Bezeichnung הַכֹּהֵן
  choice: Paschhur wird als „der Priester“ bezeichnet
  alternative: Immer wird als Priester bezeichnet
  rationale: Die unmittelbare appositionelle Folge „Paschhur, Sohn Immers, der Priester“ lässt grammatisch einen Bezug auf Paschhur als Hauptperson am nächsten liegen; die deutsche Fassung lässt die Amtsbezeichnung daher auf Paschhur bezogen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt eng am hebräischen Erzählgang, vermeidet aber ein künstliches einleitendes „Und“ oder „Nun“. Der Fußnotenmarker steht unmittelbar bei der Wendung, auf die sich die Anmerkung bezieht.
