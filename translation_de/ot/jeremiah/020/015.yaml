base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/015.yaml
  text: Cursed be the man who brought my father the news[a], saying[b], “A son has been born to you,” making him very glad.
translation:
  language: de
  text: 'Verflucht sei der Mann, der meinem Vater die Nachricht brachte: „Dir ist ein Sohn[a] geboren!“, und ihn damit sehr erfreute[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Sohn, ein Männliches“ bzw. „ein Sohn, ein männliches Kind“; die zweite Bezeichnung hebt das Geschlecht hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Hebräische verstärkt die Aussage durch die Verbindung eines Infinitivus absolutus mit einem Verb derselben Wurzel: „ihn sehr erfreute“ bzw. „ihn außerordentlich froh machte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht sei
  rationale: Das prädikative Adjektiv hat hier den Charakter eines Fluchwunsches; „Verflucht sei“ gibt diese Kraft natürlich und würdevoll wieder.
- source_word: הָאִישׁ
  choice: der Mann
  rationale: Der bestimmte Singular bezeichnet den konkreten Boten, auf den Jeremia zurückblickt.
- source_word: בִּשַּׂר
  choice: die Nachricht brachte
  rationale: Das Verb bezeichnet das Überbringen einer Nachricht, häufig einer guten. Die positive Bedeutung ergibt sich hier aus der Geburtsmeldung, ohne dass sie im Verb ausdrücklich ergänzt werden muss.
- source_word: אֶת אָבִי
  choice: meinem Vater
  rationale: Das Verb des Nachrichtenüberbringens wird im Deutschen idiomatisch mit einem Dativobjekt wiedergegeben, obwohl der hebräische Empfänger mit אֵת als direktes Objekt markiert ist.
- source_word: לֵאמֹר
  choice: '[durch Doppelpunkt und direkte Rede wiedergegeben]'
  rationale: Der hebräische Zitatintroduktor wird im Deutschen natürlich durch einen Doppelpunkt vor der direkten Rede ausgedrückt.
- source_word: יֻלַּד לְךָ
  choice: ist dir geboren
  rationale: Die passive Form mit לְךָ wird formal nah und zugleich verständlich wiedergegeben; sie bewahrt den feierlichen Ton der Geburtsmeldung.
- source_word: בֵּן זָכָר
  choice: ein Sohn, ein männliches Kind
  rationale: Die appositionale Verstärkung „ein Sohn, ein Männliches“ wird im Haupttext sichtbar gehalten. „Ein männliches Kind“ vermittelt den Sinn des substantivisch gebrauchten זָכָר ohne die unnatürliche Formulierung „ein männlicher Sohn“.
- source_word: שַׂמֵּחַ שִׂמֳּחָהוּ
  choice: und ihn damit überaus froh machte
  rationale: Infinitivus absolutus und finites Verb aus derselben Wurzel verstärken die Aussage. „Überaus froh“ gibt diese Intensivierung in natürlichem Deutsch wieder; „damit“ bindet die Freude an die Nachricht zurück.
