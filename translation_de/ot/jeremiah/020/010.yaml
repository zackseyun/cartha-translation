base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/010.yaml
  text: 'For I have heard the whispering of many: “Terror on every side!” “Report[a], and let us report it!” All the men at peace with me are watching for my stumbling: “Perhaps he will be deceived, and we will prevail against him[b], and we will take our vengeance on him.”'
translation:
  language: de
  text: 'Denn ich habe das Geflüster vieler gehört: »Schrecken ringsum!« »Zeigt ihn an, lasst uns ihn anzeigen[a]!« Alle, die mit mir in Frieden lebten, lauern darauf, dass ich zu Fall komme[b]: »Vielleicht lässt er sich täuschen; dann werden wir ihn überwältigen und Rache an ihm nehmen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Meldet ihn, lasst uns ihn melden!« Das hebräische Verb bedeutet „mitteilen, melden, bekannt machen“, kann hier im feindseligen Zusammenhang aber den Sinn einer Anzeige oder Denunziation haben. Beim ersten Verb ist das Objekt nicht ausdrücklich genannt; beim zweiten steht „ihn“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „beobachten meine Seite“ oder „beobachten mein Hinken“. Gemeint ist wahrscheinlich, dass sie auf eine Schwäche, einen Fehltritt oder meinen Sturz lauern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבַּת רַבִּים
  choice: das Geflüster vieler
  rationale: דִּבָּה kann einen Bericht, üble Nachrede oder verleumderisches Gerede bezeichnen. „Geflüster“ bewahrt die heimliche, feindselige Atmosphäre, ohne eine förmliche Anklage vorauszusetzen.
- source_word: מָגוֹר מִסָּבִיב
  choice: Schrecken ringsum
  rationale: Die prägnante jeremianische Wendung bezeichnet ringsum drohenden Schrecken und bleibt im Deutschen als zitierter Ruf knapp und eindringlich.
- source_word: הַגִּידוּ וְנַגִּידֶנּוּ
  choice: Zeigt ihn an, und wir zeigen ihn an
  rationale: נגד bedeutet im Hifil grundsätzlich „mitteilen, melden, bekannt machen“. Im feindseligen Zusammenhang gibt „anzeigen“ die anklagende Stoßrichtung wieder; die Objektsuffixform am zweiten Verb bezieht sich wahrscheinlich auf Jeremia, während der erste Imperativ kein ausdrückliches Objekt trägt.
- source_word: כֹּל אֱנוֹשׁ שְׁלוֹמִי
  choice: Alle, die mit mir in Frieden lebten
  rationale: Wörtlich steht „jeder Mann meines Friedens“. Die deutsche Formulierung gibt die früher friedliche oder freundschaftliche Beziehung natürlich wieder, ohne den Kreis enger als der hebräische Ausdruck zu bestimmen.
- source_word: שֹׁמְרֵי צַלְעִי
  choice: lauern darauf, dass ich zu Fall komme
  rationale: צֶלַע kann „Seite“ sowie eine Schwäche oder ein Hinken bezeichnen. Im Zusammenhang beobachten die Gegner eine verwundbare Stelle oder einen Fehltritt; „darauf lauern, dass ich zu Fall komme“ vermittelt diese feindselige Erwartung verständlich.
- source_word: יְפֻתֶּה
  choice: lässt er sich täuschen
  rationale: Die Nifalform von פתה kann „sich verführen, überreden oder täuschen lassen“ bedeuten. „Sich täuschen lassen“ erhält die passive Form und passt zum geplanten Überlisten.
- source_word: וְנּוּכְלָה לוֹ
  choice: dann werden wir ihn überwältigen
  rationale: יכל mit ל kann das Überhandgewinnen oder Obsiegen über jemanden ausdrücken. „Überwältigen“ gibt die feindliche Absicht idiomatisch wieder.
- source_word: וְנִקְחָה נִקְמָתֵנוּ מִמֶּנּוּ
  choice: und Rache an ihm nehmen
  rationale: Die hebräische Wendung lautet wörtlich „unsere Rache von ihm nehmen“. Die gewählte Form ist im Deutschen natürlich und bewahrt den Vergeltungsgedanken.
