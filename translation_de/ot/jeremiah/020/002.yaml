source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה פַשְׁח֔וּר אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יִּתֵּ֨ן אֹת֜/וֹ עַל הַ/מַּהְפֶּ֗כֶת אֲשֶׁ֨ר בְּ/שַׁ֤עַר בִּנְיָמִן֙ הָֽ/עֶלְי֔וֹן אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/002.yaml
  text: Then Pashhur struck Jeremiah the prophet and put him in the stocks that were at the upper Benjamin Gate[a], which was in the house of Yahweh.
translation:
  language: de
  text: Darauf schlug Paschhur den Propheten Jeremia und legte ihn in den Stock[a] am oberen Benjamintor, das sich im Haus Jahwes befand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ein Stock war eine Vorrichtung, in der ein Gefangener schmerzhaft festgesetzt wurde. Oder möglicherweise: „eine Streckvorrichtung“ oder ein anderes Gerät zur schmerzhaften Fesselung; die genaue Form der מַהְפֶּכֶת ist ungewiss.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: schlug
  rationale: נכה bezeichnet das Schlagen oder Treffen. „Schlug“ ist im modernen Deutschen natürlich und lässt offen, ob ein einzelner Schlag oder eine Misshandlung gemeint ist.
- source_word: פַשְׁחוּר
  choice: Paschhur
  rationale: Der Personenname wird nach geläufiger deutscher Bibelkonvention wiedergegeben.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: den Propheten Jeremia
  rationale: Die deutsche Wortstellung gibt Titel und Namen natürlich wieder und bewahrt die ausdrückliche Kennzeichnung Jeremias als Prophet.
- source_word: וַיִּתֵּן אֹתוֹ עַל
  choice: legte ihn in
  rationale: Im Zusammenhang mit einem Zwangsgerät bezeichnet die Wendung das Hineinlegen beziehungsweise Festsetzen. „Legte ihn in“ ist idiomatisch und passt zu „Block“.
- source_word: הַמַּהְפֶּכֶת
  choice: den Block
  rationale: Das seltene Substantiv bezeichnet offenbar eine Vorrichtung zur schmerzhaften Fesselung oder verdrehten Fixierung. „Block“ ist eine etablierte, verständliche deutsche Wiedergabe; die genaue Bauart bleibt jedoch unsicher und wird in der Fußnote offengehalten.
- source_word: שַׁעַר בִּנְיָמִן הָעֶלְיוֹן
  choice: am oberen Benjamintor
  rationale: „Benjamintor“ ist die natürliche deutsche Form des Tornamens; הָעֶלְיוֹן wird attributiv als „oberen“ wiedergegeben.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild „Haus“ und bezeichnet zugleich klar den Ort im Heiligtumsbereich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen üblichen Form „Jahwe“ transliteriert, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen; die Schreibweise entspricht der geläufigen deutschen Form.
- issue: Art der Misshandlung durch וַיַּכֶּה
  choice: schlug
  alternative: verprügelte
  rationale: Der hebräische Verbalsatz legt nicht eindeutig fest, ob Paschhur Jeremia einmal oder wiederholt schlug. „Schlug“ erhält diese Offenheit und verschärft den Vorgang nicht unnötig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darauf“ führt die hebräische Erzählfolge flüssig fort. Der relativische Nachsatz macht eindeutig, dass sich das obere Benjamintor im Haus Jahwes befand.
