id: JER.20.13
reference: Jeremiah 20:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שִׁ֚ירוּ לַֽ/יהוָ֔ה הַֽלְל֖וּ אֶת יְהוָ֑ה כִּ֥י הִצִּ֛יל אֶת נֶ֥פֶשׁ אֶבְי֖וֹן מִ/יַּ֥ד מְרֵעִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/013.yaml
  text: Sing to Yahweh[a]; praise Yahweh[c][b], for he has delivered the life of the poor from the hand of evildoers.
translation:
  language: de
  text: Singt Jahwe[a], preist Jahwe! Denn er hat das Leben[b] des Armen aus der Hand[c] der Übeltäter gerettet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „die Seele des Armen“; gemeint ist hier sein bedrohtes Leben beziehungsweise seine Person.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aus der Gewalt der Übeltäter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Singt
  rationale: Der Pluralimperativ von שׁיר bedeutet schlicht „singt“. Der folgende Imperativ nennt das Preisen ausdrücklich, sodass hier kein Zusatz nötig ist.
- source_word: לַיהוָה / אֶת יְהוָה
  choice: Jahwe
  rationale: Die Präposition ל kennzeichnet beim ersten Vorkommen den Adressaten des Singens; beim zweiten steht der Gottesname als direktes Objekt von „preist“. Die deutsche Form „Jahwe“ gibt den Eigennamen JHWH wieder.
- source_word: הַלְלוּ
  choice: preist
  rationale: Der Piel-Imperativ Plural von הלל bezeichnet hier den lobenden Preis Gottes; „preist“ ist knapp, würdig und im heutigen Deutschen verständlich.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet den Grund für die beiden Aufforderungen ein. „Denn“ erhält diesen kausalen Zusammenhang und passt zum poetischen Register.
- source_word: הִצִּיל
  choice: hat … gerettet
  rationale: Das Hiphil-Perfekt von נצל bezeichnet eine vollzogene Rettung. Das deutsche Perfekt drückt die abgeschlossene Tat mit gegenwärtiger Bedeutung natürlich aus.
- source_word: נֶפֶשׁ
  choice: das Leben
  rationale: נֶפֶשׁ meint hier das bedrohte Leben beziehungsweise Selbst des Menschen, nicht ausdrücklich eine vom Körper getrennte Seele.
- source_word: אֶבְיוֹן
  choice: des Armen
  rationale: אֶבְיוֹן bezeichnet einen armen oder bedürftigen Menschen. „Der Arme“ ist hier eine natürliche repräsentative Einzahl.
- source_word: מִיַּד
  choice: aus der Hand
  rationale: Die Wendung bezeichnet bildhaft die Gewalt oder Verfügungsgewalt anderer. Die deutsche Form bewahrt das verständliche hebräische Bild.
- source_word: מְרֵעִים
  choice: der Übeltäter
  rationale: Das substantivierte Partizip bezeichnet Menschen, die Böses tun. „Übeltäter“ ist knapp und dem prophetisch-poetischen Ton angemessen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen JHWH. „Jahwe“ bewahrt ihn als Eigennamen, während die traditionelle Ersatzlesung in einer Fußnote kenntlich gemacht wird.
- issue: Bedeutung von נֶפֶשׁ im Rettungskontext
  choice: Leben
  alternative: Seele
  rationale: Im Zusammenhang der Rettung aus der Gewalt böser Menschen bezeichnet נֶפֶשׁ das gefährdete Leben beziehungsweise die Person. „Leben“ vermeidet eine sachlich nicht geforderte anthropologische Festlegung.
- issue: Bildhafte Bedeutung von יָד
  choice: Hand
  alternative: Gewalt
  rationale: Die konkrete Metapher bleibt im Haupttext erhalten, ohne die übertragene Bedeutung auszuschließen; die Fußnote erläutert die idiomatische Alternative.
translation_notes:
  register: Knappe, poetische Aufforderungen mit natürlicher deutscher Wortstellung. Der Parallelismus der beiden Imperative und das anschauliche Bild „aus der Hand“ bleiben erhalten; Satzbau und Wortwahl sind würdig, aber ohne unnötig altertümliche Formen.
