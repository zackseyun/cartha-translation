id: JER.20.12
reference: Jeremiah 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ בֹּחֵ֣ן צַדִּ֔יק רֹאֶ֥ה כְלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/012.yaml
  text: But you[a], O Yahweh of Armies, who test the righteous, who see the kidneys and the heart, let me see your vengeance on them[b], for to you I have revealed my case.
translation:
  language: de
  text: Doch du, Jahwe der Heerscharen, prüfst den Gerechten und siehst Nieren und Herz.[a] Lass mich deine Rache an ihnen sehen, denn dir habe ich meinen Rechtsstreit offengelegt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Nieren und Herz“. Im hebräischen Sprachgebrauch bezeichnen sie das tiefste Innere eines Menschen, besonders Gedanken, Beweggründe und Empfindungen.
    reason: cultural_note
  - marker: b
    text: „Rechtsstreit“ kann hier auch „Rechtssache“, „Streitsache“ oder „Anliegen“ bedeuten. „Lass mich … sehen“ kann auch mit „Ich werde … sehen“ übersetzt werden.
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Doch du, Jahwe der Heerscharen
  rationale: Das וַ wird im Zusammenhang adversativ als „Doch“ wiedergegeben; das ausdrücklich gebrauchte Gottesnamens-Tetragramm erscheint als „Jahwe“. „Heerscharen“ bewahrt den pluralischen und militärischen Sinn von צְבָאוֹת in einer würdevollen deutschen Gottesbezeichnung.
- source_word: בֹּחֵן צַדִּיק
  choice: prüfst den Gerechten
  rationale: Das Partizip bezeichnet Jahwes fortdauerndes Prüfen. צַדִּיק steht substantivisch im Singular und wird entsprechend kompakt mit „den Gerechten“ wiedergegeben.
- source_word: רֹאֶה כְלָיוֹת וָלֵב
  choice: siehst Nieren und Herz
  rationale: Die konkrete hebräische Körpermetaphorik bleibt erhalten. Nieren und Herz stehen für das tiefste Innere, einschließlich Gedanken, Beweggründen und Empfindungen.
- source_word: אֶרְאֶה
  choice: Lass mich … sehen
  rationale: Der Imperfekt der ersten Person kann im Kontext einen Wunsch ausdrücken. Die deutsche Form gibt diesen an Gott gerichteten Wunsch natürlich wieder, ohne ihn als sichere Zukunftsaussage festzulegen.
- source_word: נִקְמָתְךָ מֵהֶם
  choice: deine Rache an ihnen
  rationale: נְקָמָה bezeichnet Rache beziehungsweise Vergeltung; die Präposition wird in dieser Verbindung im Deutschen idiomatisch mit „an“ wiedergegeben.
- source_word: גִּלִּיתִי אֶת רִיבִי
  choice: habe ich meinen Rechtsstreit offengelegt
  rationale: רִיב kann einen Streit, eine Rechtssache oder einen Rechtsstreit bezeichnen. „Rechtsstreit“ bewahrt den forensischen Klang; „offengelegt“ entspricht dem Verb גלה und vermeidet die zusätzliche Deutung, Jeremia habe die Sache Gott erst bekannt machen müssen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Bildsprache in כְלָיוֹת וָלֵב
  choice: Nieren und Herz im Haupttext beibehalten
  alternative: Innerstes und Herz; Gedanken und Gefühle
  rationale: Die körperliche Metapher des Hebräischen bleibt sichtbar und wird nicht vorschnell in moderne psychologische Kategorien aufgelöst. Eine Fußnote erklärt ihre Funktion.
- issue: Nuance von אֶרְאֶה
  choice: 'als Wunsch: „Lass mich … sehen“'
  alternative: „Ich werde … sehen“
  rationale: Die Form ist grammatisch ein Imperfekt und könnte als Zukunftsaussage verstanden werden; im Gebets- und Klagekontext ist die volitive Lesart jedoch wahrscheinlich. Die Alternative wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener hebräischer Bildsprache. Die Satzstruktur wurde für natürliches Deutsch geglättet, ohne die Anrede, die parallelen Partizipien, den Vergeltungsbegriff oder den forensischen Charakter von רִיב abzuschwächen.
