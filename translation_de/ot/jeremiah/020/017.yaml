  text: אֲשֶׁ֥ר לֹא מוֹתְתַ֖/נִי מֵ/רָ֑חֶם וַ/תְּהִי לִ֤/י אִמִּ/י֙ קִבְרִ֔/י וְ/רַחְמָ֖/הֿ הֲרַ֥ת עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/017.yaml
  text: because he did not kill me from the womb[a], so that my mother would have been my grave[c][b], and her womb forever pregnant.
translation:
  language: de
  text: weil er mich nicht im Mutterleib tötete, sodass meine Mutter mein Grab geworden wäre[a] und ihr Mutterleib für immer schwanger geblieben wäre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Hebräischen verdichtet: „Meine Mutter wäre mir zum Grab geworden und ihr Mutterleib für immer schwanger.“'
    reason: Die Fußnote weist auf die knappe hebräische Metapher und die in der Übersetzung verdeutlichte kontrafaktische Satzbeziehung hin.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: weil
  rationale: Das Relativwort führt im Zusammenhang den Grund für die Verfluchung des Boten ein; die kausale Wiedergabe ist im Deutschen klar und natürlich.
- source_word: לֹא מוֹתְתַנִי מֵרָחֶם
  choice: er mich nicht im Mutterleib tötete
  rationale: Die Verbform bezeichnet ein aktives Töten. מִן kann den Ausgangspunkt ausdrücken, doch idiomatisches Deutsch bezeichnet den gemeinten Ort hier mit „im Mutterleib“; „vom Mutterleib her“ wäre missverständlich.
- source_word: וַתְּהִי לִי אִמִּי קִבְרִי
  choice: sodass meine Mutter mein Grab geworden wäre
  rationale: Die kontrafaktische Form gibt im Kontext der Klage den unerfüllten Wunsch wieder und bewahrt zugleich die verdichtete Metapher „meine Mutter – mein Grab“.
- source_word: וְרַחְמָהּ
  choice: und ihr Schoß
  rationale: Gemeint ist anatomisch der Mutterleib. „Schoß“ vermeidet die unmittelbare Wiederholung und bleibt in diesem poetischen Klagewort verständlich und würdevoll.
- source_word: הֲרַת עוֹלָם
  choice: für immer schwanger geblieben wäre
  rationale: Die Wendung bezeichnet einen endlosen Zustand der Schwangerschaft; „geblieben wäre“ macht im Deutschen den kontrafaktischen Zusammenhang mit dem vorangehenden Satzteil deutlich.
theological_decisions:
- issue: Kontrafaktische Klage
  choice: „sodass meine Mutter mein Grab geworden wäre …“
  alternative: „und meine Mutter wurde mir zum Grab …“
  rationale: Der Zusammenhang von Jeremia 20,14–18 beschreibt einen rückblickenden Wunsch, bereits vor der Geburt gestorben zu sein. Der Konjunktiv macht diesen Sinn deutlich, ohne die erschütternde Spannung der Klage abzuschwächen.
- issue: Bezug des handelnden Subjekts
  choice: Das Pronomen „er“ bleibt ohne erklärenden Zusatz stehen.
  alternative: „der Bote“ oder „jener Mann“
  rationale: Der Vers bezieht sich auf den zuvor genannten Mann. Ein erläuterndes Substantiv würde Information in den Haupttext eintragen, die in diesem Vers nur durch den Zusammenhang gegeben ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Härte. Der Satz schließt syntaktisch an den vorhergehenden Vers an. „Mutterleib“ und „Schoß“ geben die beiden verwandten, aber unterschiedlich gebildeten hebräischen Ausdrücke wieder.
