source:
  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַ֣ר יְהוָ֡ה הִנְ/נִי֩ נֹתֶנְ/ךָ֨ לְ/מָג֜וֹר לְ/ךָ֣ וּ/לְ/כָל אֹהֲבֶ֗י/ךָ וְ/נָֽפְל֛וּ בְּ/חֶ֥רֶב אֹיְבֵי/הֶ֖ם וְ/עֵינֶ֣י/ךָ רֹא֑וֹת וְ/אֶת כָּל יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וְ/הִגְלָ֥/ם בָּבֶ֖לָ/ה וְ/הִכָּ֥/ם בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/004.yaml
  text: 'For thus says Yahweh: Behold[a], I am making you a terror to yourself and to all your loved ones, and they will fall by the sword of their enemies while your eyes look on. And I will give all Judah into the hand of the king of Babylon[c][b], and he will carry them away to Babylon and strike them with the sword.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Sieh, ich mache dich zum Schrecken[a] für dich selbst und für alle, die dich lieben. Sie werden durch das Schwert ihrer Feinde fallen, und du wirst es mit eigenen Augen sehen. Ganz Juda werde ich in die Hand des Königs von Babylon geben. Er wird sie nach Babylon verschleppen[b] und sie mit dem Schwert schlagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hebräische Wort für „Schrecken“ klingt an den Namen an, den Paschhur im unmittelbaren Zusammenhang erhält: „Schrecken ringsum“ (Vers 3).'
    reason: cross_reference
  - marker: b
    text: 'Oder: „ins Exil nach Babylon führen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen im Deutschen in seiner geläufigen wissenschaftlichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הִנְנִי
  choice: Sieh
  rationale: Bewahrt die hinweisende und feierliche Kraft der prophetischen Ankündigungsformel in natürlichem modernem Deutsch.
- source_word: נֹתֶנְךָ לְמָגוֹר
  choice: ich mache dich zum Schrecken
  rationale: Das idiomatische נתן mit לְמָגוֹר bezeichnet hier, dass Paschhur zu einer Ursache beziehungsweise einem Gegenstand des Schreckens wird; „machen zu“ ist im Deutschen klarer als das wörtliche „geben zu“.
- source_word: לְךָ
  choice: für dich selbst
  rationale: 'Bringt den reflexiven Sinn zum Ausdruck: Paschhur wird selbst den Schrecken erfahren, den seine Lage hervorruft.'
- source_word: אֹהֲבֶיךָ
  choice: alle, die dich lieben
  rationale: Bildet das hebräische Partizip transparent ab und lässt offen, ob Freunde, Vertraute, Angehörige oder Verbündete gemeint sind.
- source_word: וְנָפְלוּ בְּחֶרֶב אֹיְבֵיהֶם
  choice: Sie werden durch das Schwert ihrer Feinde fallen
  rationale: Bewahrt die hebräische Wendung und ihre bildhafte Aussage vom gewaltsamen Tod.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: du wirst es mit eigenen Augen sehen
  rationale: Gibt den Nachdruck auf Paschhurs persönliches Miterleben idiomatisch wieder.
- source_word: אֶתֵּן בְּיַד
  choice: werde ich in die Hand ... geben
  rationale: Bewahrt die verständliche hebräische Macht- und Auslieferungsmetapher.
- source_word: וְהִגְלָם בָּבֶלָה
  choice: Er wird sie nach Babylon verschleppen
  rationale: Das Hifil von גלה bezeichnet die erzwungene Wegführung ins Exil; „verschleppen“ vermittelt diesen Zwang prägnant.
- source_word: וְהִכָּם בֶּחָרֶב
  choice: und sie mit dem Schwert schlagen
  rationale: Bleibt bei der weiteren Bedeutung von נכה und vermeidet, über den Wortlaut hinaus ausschließlich „töten“ festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen; die Transliteration bewahrt ihn als solchen.
- issue: Bezug von לְמָגוֹר auf Paschhur
  choice: zum Schrecken für dich selbst
  alternative: zum Gegenstand des Schreckens für dich selbst
  rationale: Die knappe Form bewahrt die Aussage und den Anklang an Paschhurs neuen Namen im Kontext, ohne die dortige Wendung „Schrecken ringsum“ in diesen Vers einzutragen.
- issue: Bedeutungsumfang von אֹהֲבֶיךָ
  choice: alle, die dich lieben
  alternative: deine Freunde
  rationale: Die transparente Wiedergabe erhält die mögliche Breite des Ausdrucks und legt die Beziehung nicht enger fest, als es der hebräische Text tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Syntax. „Sieh“ hält den prophetischen Ankündigungston aufrecht; „mit eigenen Augen sehen“ und „verschleppen“ sorgen für natürliche Verständlichkeit. Die Wiederholung von „Schwert“ bleibt entsprechend dem hebräischen Text erhalten.
