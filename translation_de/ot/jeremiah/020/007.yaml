source:
  edition: WLC
  text: פִּתִּיתַ֤/נִי יְהוָה֙ וָֽ/אֶפָּ֔ת חֲזַקְתַּ֖/נִי וַ/תּוּכָ֑ל הָיִ֤יתִי לִ/שְׂחוֹק֙ כָּל הַ/יּ֔וֹם כֻּלֹּ֖/ה לֹעֵ֥ג לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/007.yaml
  text: You persuaded me[a], Yahweh, and I was persuaded; you overpowered me and prevailed. I have become a laughingstock all day long; everyone mocks me.
translation:
  language: de
  text: Du hast mich überredet[a], Jahwe, und ich ließ mich überreden; du hast mich überwältigt und die Oberhand gewonnen. Den ganzen Tag bin ich ein Gespött; jeder verspottet mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du hast mich getäuscht, Jahwe, und ich wurde getäuscht.« Das hebräische Verb kann »überreden«, »verlocken« oder »täuschen« bedeuten; Jeremias Klage ist bewusst scharf formuliert.'
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתִּיתַנִי
  choice: Du hast mich überredet
  rationale: Das Verb פתה kann je nach Zusammenhang »überreden«, »verlocken/verführen« oder »täuschen« bedeuten. »Überredet« bewahrt im Haupttext die Mehrdeutigkeit, ohne Jeremias scharfe Klage abzuschwächen; die stärkere Lesart »getäuscht« steht in der Fußnote.
- source_word: וָאֶפָּת
  choice: und ich ließ mich überreden
  rationale: Die passive beziehungsweise reflexive Form antwortet unmittelbar auf das vorangehende Verb. Die deutsche Formulierung gibt sowohl Jeremias Nachgeben als auch die Parallelität wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֲזַקְתַּנִי
  choice: du hast mich überwältigt
  rationale: חזק bezeichnet hier die gegen Jeremia eingesetzte überlegene Stärke. »Überwältigt« erhält die persönliche und kraftvolle Aussage.
- source_word: וַתּוּכָל
  choice: und die Oberhand gewonnen
  rationale: יכל drückt hier erfolgreiches Überwinden aus. Die Wendung ist gegenwärtiges, verständliches Deutsch und ergänzt »überwältigt« natürlich.
- source_word: הָיִיתִי לִשְׂחוֹק
  choice: bin ich zum Gespött geworden
  rationale: Die Wendung bezeichnet, dass Jeremia zum Gegenstand öffentlichen Spotts geworden ist. »Zum Gespött geworden« gibt die soziale Beschämung prägnant wieder.
- source_word: כָּל־הַיּוֹם כֻּלֹּה
  choice: den ganzen Tag
  rationale: Die verstärkte hebräische Zeitangabe bezeichnet eine ununterbrochene beziehungsweise immer wiederkehrende Dauer.
- source_word: לֹעֵג לִי
  choice: jeder verspottet mich
  rationale: Der singularische Partizipialsatz hat im Zusammenhang verallgemeinernde, distributive Bedeutung. »Jeder« bildet diesen Sinn im Deutschen klar ab.
theological_decisions:
- issue: Ob פתה im Haupttext als Vorwurf göttlicher Täuschung wiederzugeben ist
  choice: Im Haupttext »überredet«; in der Fußnote die schärfere Lesart »getäuscht«
  alternative: »Du hast mich getäuscht, Jahwe, und ich wurde getäuscht.«
  rationale: Jeremias Klage ist bewusst anstößig und kraftvoll, doch das hebräische Verb umfasst sowohl Überreden beziehungsweise Verlocken als auch Täuschen. Haupttext und Fußnote bewahren gemeinsam die theologische Spannung, ohne die Mehrdeutigkeit einseitig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Sprache der Klage bleibt erhalten; zugleich wird die echte lexikalische Mehrdeutigkeit von פתה durch Haupttext und Fußnote sichtbar gemacht.
