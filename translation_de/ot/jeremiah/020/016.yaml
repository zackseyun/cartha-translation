  text: וְ/הָיָה֙ הָ/אִ֣ישׁ הַ/ה֔וּא כֶּֽ/עָרִ֛ים אֲשֶׁר הָפַ֥ךְ יְהוָ֖ה וְ/לֹ֣א נִחָ֑ם וְ/שָׁמַ֤ע זְעָקָה֙ בַּ/בֹּ֔קֶר וּ/תְרוּעָ֖ה בְּ/עֵ֥ת צָהֳרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/016.yaml
  text: Let that man be like the cities that Yahweh overthrew without relenting[b][a], and let him hear a cry in the morning and a battle shout at the time of noon.
translation:
  language: de
  text: Möge dieser Mann wie die Städte werden, die Jahwe umstürzte und von denen er nicht abließ.[a] Möge er am Morgen einen Schrei hören und zur Mittagszeit Kriegsgeschrei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung erinnert wahrscheinlich an die Städte, die Jahwe im Gericht umstürzte, besonders an Sodom und Gomorra.
    reason: cross_reference
  - marker: b
    text: 'Oder: „Alarmruf“ oder „Trompetensignal“. Das hebräische Wort kann verschiedene laute Kriegs- und Alarmsignale bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... וְשָׁמַע
  choice: soll ... werden ... soll ... hören
  rationale: Die Verbformen führen im Kontext Jeremias Verwünschung fort. Die deutsche Soll-Konstruktion gibt diesen Wunsch- bzw. Fluchcharakter natürlich wieder.
- source_word: הָאִישׁ הַהוּא
  choice: dieser Mann
  rationale: Der Demonstrativausdruck bezeichnet ausdrücklich den zuvor genannten Mann und bewahrt das maskuline Singular.
- source_word: כֶּעָרִים אֲשֶׁר הָפַךְ יְהוָה
  choice: wie die Städte, die Jahwe umstürzte
  rationale: כְּ markiert den Vergleich; הפך bezeichnet hier den vernichtenden Umsturz und lässt den wahrscheinlichen Bezug auf Sodom und Gomorra erkennen, ohne ihn im Text auszuschreiben. Der Gottesname wird als Jahwe wiedergegeben.
- source_word: וְלֹא נִחָם
  choice: ohne es sich gereuen zu lassen
  rationale: נחם bezeichnet hier das Ausbleiben von Bedauern beziehungsweise Abkehr vom angekündigten Gericht. Die Formulierung bewahrt die anthropopathische Spannung des Hebräischen, ohne moralische Reue wegen eines Fehlverhaltens zu unterstellen.
- source_word: זְעָקָה
  choice: Hilferufe
  rationale: Das Wort bezeichnet einen lauten Schrei aus Bedrängnis. Im Deutschen vermittelt der Plural Hilferufe idiomatisch das kollektive Katastrophengeschehen.
- source_word: תְרוּעָה
  choice: Kriegsgeschrei
  rationale: תְרוּעָה kann Kriegsgeschrei, Alarmruf oder Trompetensignal bedeuten. Der Zusammenhang mit dem gewaltsamen Untergang der Städte spricht für Kriegsgeschrei; die Mehrdeutigkeit wird in einer Fußnote erhalten.
- source_word: בְּעֵת צָהֳרָיִם
  choice: zur Mittagszeit
  rationale: Die Wendung gibt das ausdrücklich genannte Zeitmoment natürlich und etwas voller als ein bloßes mittags wieder.
theological_decisions:
- issue: Gottes Reaktion im Gericht (נחם)
  choice: ohne es sich gereuen zu lassen
  alternative: ohne nachzugeben / ohne umzukehren
  rationale: Die gewählte Formulierung bewahrt die im Ausgangstext vorhandene Redeweise über Gottes Nicht-Bereuen beziehungsweise Nicht-Absehen vom Gericht. Sie glättet die theologische Spannung nicht, vermeidet aber die missverständliche Aussage, Gott habe eine moralische Schuld bereuen müssen.
- issue: Mögliche Anspielung auf Sodom und Gomorra
  choice: im Haupttext nur „die Städte“; Erläuterung in Fußnote
  alternative: Sodom und Gomorra ausdrücklich in den Haupttext einsetzen
  rationale: Der hebräische Text nennt die Städte nicht. Daher wird die wahrscheinliche intertextuelle Anspielung erklärt, aber nicht als ausdrücklicher Wortlaut ausgegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verwünschung wird mit einer klaren Soll-Konstruktion wiedergegeben. „Jahwe“ bewahrt den persönlichen Gottesnamen; „zur Mittagszeit“ erhält die etwas vollere hebräische Zeitangabe.
