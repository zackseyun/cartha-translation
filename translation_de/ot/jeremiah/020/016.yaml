- from: Dieser Mann soll wie die Städte werden, die Jahwe umstürzte, ohne es sich gereuen zu lassen.[a] Er soll am Morgen Hilferufe hören und zur Mittagszeit Kriegsgeschrei.[b]
  to: Möge dieser Mann wie die Städte werden, die Jahwe umstürzte und von denen er nicht abließ.[a] Möge er am Morgen einen Schrei hören und zur Mittagszeit Kriegsgeschrei.[b]
  rationale: Die Revision behebt die unidiomatische und unklare Formulierung zu נחם, indem sie Jahwes Nicht-Nachlassen auf die umgestürzten Städte bezieht. Sie stellt außerdem die Singularform von זעקה wieder her und kennzeichnet die beiden Verbformen klar als Verwünschung. Die mögliche Mehrdeutigkeit von תְרוּעָה bleibt durch die Fußnote erhalten.
