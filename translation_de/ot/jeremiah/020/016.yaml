    rationale: זְעָקָה ist Singular. „einen Schrei“ bewahrt Zahl und bleibt im Katastrophenkontext natürlich.
  - severity: low
    issue: Soll-Konstruktion
    rationale: „Soll“ kann im Deutschen auch Anordnung oder bloße Zukunft ausdrücken. „Möge“ markiert die im Kontext vorliegende Verwünschung eindeutiger.
