  text: וְ/נָתַתִּ֗י אֶת כָּל חֹ֨סֶן֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/אֶת כָּל יְגִיעָ֖/הּ וְ/אֶת כָּל יְקָרָ֑/הּ וְ/אֵ֨ת כָּל אוֹצְר֜וֹת מַלְכֵ֣י יְהוּדָ֗ה אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְזָזוּ/ם֙ וּ/לְקָח֔וּ/ם וֶ/הֱבִיא֖וּ/ם בָּבֶֽלָ/ה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/005.yaml
  text: And I will give all the wealth of this city[a], all its gains, all its precious things, and all the treasures of the kings of Judah into the hand of their enemies. They will plunder them, take them[c][b], and bring them to Babylon.
translation:
  language: de
  text: Und ich werde den ganzen Reichtum dieser Stadt, ihren gesamten Arbeitsertrag[a], all ihre Kostbarkeiten[b] und alle Schätze der Könige von Juda in die Hand ihrer Feinde geben.[c] Sie werden alles plündern, an sich nehmen und nach Babel bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all ihre Mühe“ beziehungsweise „alles, was sie durch ihre Arbeit hervorgebracht hat“. Das hebräische Wort kann die Arbeit selbst oder ihren Ertrag bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „all ihren kostbaren Besitz“.'
    reason: lexical_alternative
  - marker: c
    text: '„In die Hand geben“ bedeutet hier: der Gewalt oder Verfügungsgewalt anderer ausliefern.'
    reason: cultural_note
lexical_decisions:
- source_word: חֹסֶן
  choice: Reichtum
  rationale: Im Zusammenhang mit Raub und Wegführung bezeichnet das Wort den materiellen Reichtum der Stadt, nicht abstrakte Stärke.
- source_word: יְגִיעָהּ
  choice: ihren gesamten Arbeitsertrag
  rationale: Das Wort kann sowohl Mühe beziehungsweise Arbeit als auch deren Ertrag bezeichnen. Da hier wegnehmbare Güter aufgezählt werden, ist der Ertrag wahrscheinlich gemeint; die Zusammensetzung bewahrt zugleich den Bezug zur Arbeit.
- source_word: יְקָרָהּ
  choice: all ihre Kostbarkeiten
  rationale: In der Reihe materieller Güter liegt die konkrete Bedeutung wertvoller Gegenstände näher als Ehre oder Ansehen.
- source_word: אוֹצְרוֹת מַלְכֵי יְהוּדָה
  choice: alle Schätze der Könige von Juda
  rationale: אוֹצָר kann Schatz oder Vorratskammer bezeichnen; die folgenden Verben richten den Blick auf deren wegführbaren Inhalt.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die hebräische Wendung bezeichnet die Übergabe in die Gewalt oder Verfügungsgewalt eines anderen. Das im Deutschen verständliche Bild bleibt erhalten.
- source_word: אֹיְבֵיהֶם
  choice: ihrer Feinde
  rationale: Die Form bewahrt den pluralischen Rückbezug, der sich grammatisch am ehesten auf die Könige von Juda bezieht, ohne die Feinde unnötig näher zu bestimmen.
- source_word: וּבְזָזוּם
  choice: Sie werden es rauben
  rationale: בזז bezeichnet das Erbeuten oder Rauben von Gütern. „Rauben“ ist bei dem zusammenfassenden Sachbezug im Deutschen natürlicher als „es plündern“.
- source_word: וּלְקָחוּם
  choice: an sich nehmen
  rationale: Die Form gibt die anschließende Besitzergreifung wieder, ohne die danach ausdrücklich genannte Beförderung nach Babel vorwegzunehmen.
- source_word: וֶהֱבִיאוּם בָּבֶלָה
  choice: nach Babel bringen
  rationale: Die Richtungsendung an בָּבֶל wird mit „nach“ wiedergegeben; „bringen“ entspricht dem kausativen Verb.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Formulierung „werde ich … all das werde ich“ bildet die hebräische Wiederaufnahme von וְנָתַתִּי durch אֶתֵּן nach der langen Aufzählung ab. „Babel“ folgt der in deutschen Bibelübersetzungen etablierten Namensform.
