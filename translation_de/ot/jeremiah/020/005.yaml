  terminology: „Reichtum“, „Arbeitsertrag“, „Kostbarkeiten“, „Schätze“, „in die Hand geben“ und „Babel“ sind treffend und registergerecht. Die Anmerkungen bilden die wesentlichen lexikalischen und idiomatischen Alternativen angemessen ab.
