  text: אָר֣וּר הַ/יּ֔וֹם אֲשֶׁ֥ר יֻלַּ֖דְתִּי בּ֑/וֹ י֛וֹם אֲשֶׁר יְלָדַ֥תְ/נִי אִמִּ֖/י אַל יְהִ֥י בָרֽוּךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/020/014.yaml
  text: Cursed be the day on which I was born[a]; the day my mother bore me[b], let it not be blessed.
translation:
  language: de
  text: Verflucht sei der Tag, an dem ich geboren wurde; der Tag, an dem meine Mutter mich gebar, sei nicht gesegnet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Verflucht sei
  rationale: Das prädikative Partizip von ארר hat hier verwünschenden Sinn. „Verflucht sei“ gibt die Kraft der Klage würdig und im Deutschen idiomatisch wieder.
- source_word: הַיּוֹם
  choice: der Tag
  rationale: Der bestimmte Ausdruck bezeichnet den konkreten Tag der Geburt des Sprechers.
- source_word: אֲשֶׁר ... בּוֹ
  choice: an dem
  rationale: Die Relativpartikel und das rückbezügliche בּוֹ werden zusammen als natürliche deutsche Zeitangabe wiedergegeben.
- source_word: יֻלַּדְתִּי
  choice: ich geboren wurde
  rationale: Die Passivform von ילד bedeutet hier schlicht, dass der Sprecher geboren wurde.
- source_word: יוֹם
  choice: der Tag
  rationale: Die Wiederaufnahme bewahrt die parallele und nachdrückliche Struktur des hebräischen Satzes.
- source_word: יְלָדַתְנִי אִמִּי
  choice: meine Mutter mich gebar
  rationale: „Gebar“ bildet ילד prägnant und konkret ab; trotz gehobener Färbung ist es im modernen Standarddeutsch verständlich und passt zum würdigen Klagegestus.
- source_word: אַל יְהִי
  choice: sei nicht
  rationale: Der verneinte Jussiv äußert einen Wunsch beziehungsweise eine Verwünschung; der deutsche Konjunktiv bewahrt diese Kraft knapp.
- source_word: בָרוּךְ
  choice: gesegnet
  rationale: „Gesegnet“ erhält den ausdrücklichen Gegenpol zu „verflucht“ und damit die rhetorische Antithese.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Parallelität. „Gebar“ ist bewusst knapp und literarisch, ohne altertümliche Satzformen zu verwenden.
