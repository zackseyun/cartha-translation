  - severity: low
    issue: Fußnote wiederholt die für den Haupttext erforderliche Aussage
    rationale: Die bisherige Fußnote („und meine Tage vergingen in Schande“) bietet keine eigenständige lexikalische Alternative, sondern korrigiert faktisch die kausative Hauptfassung. Nach der Korrektur ist sie entbehrlich.
