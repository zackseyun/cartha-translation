revisions:
- from: Warum nur bin ich aus dem Mutterleib gekommen, um Mühsal und Kummer zu sehen und meine Tage in Schande vergehen zu lassen?[a]
  to: Warum nur bin ich aus dem Mutterleib gekommen, um Mühsal und Kummer zu sehen und meine Tage in Schande zu verbringen?
  rationale: Der Schlussteil wird so umformuliert, dass die Tage nicht willentlich „vergehen gelassen“, sondern in Schande verbracht werden. Dies gibt die Aussage von „meine Tage“ in Verbindung mit „in Schande“ natürlich wieder und wahrt den klagenden, rhetorischen Zusammenhang. Die Fußnote wird entfernt, weil ihre bisherige Formulierung die notwendige Korrektur der Hauptfassung darstellte und keine separate Übersetzungsvariante mehr dokumentiert.
