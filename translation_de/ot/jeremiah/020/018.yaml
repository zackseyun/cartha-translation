review_pass:
  verdict: revise
  source_fidelity: Der Schluss der vorliegenden Hauptfassung („meine Tage in Schande vergehen zu lassen“) ist kausativ und stellt Jeremia als denjenigen dar, der seine Tage willentlich vergehen lässt. וַיִּכְלוּ bezeichnet dagegen, dass seine Tage zu Ende gehen bzw. aufgebraucht werden. Die revidierte Fassung gibt diese Aussage ohne unangebrachte Kausalität wieder. „Warum nur“, „aus dem Mutterleib“, „Mühsal und Kummer“ und „in Schande“ entsprechen dem hebräischen Klageruf gut.
  naturalness: Die Revision ist modernes, poetisch angemessenes Standarddeutsch. Die parallelen Infinitivgruppen machen den Umfang der rhetorischen Frage klar und vermeiden die missverständliche Konstruktion „vergehen zu lassen“.
  terminology: „Mühsal und Kummer“ ist ein tragfähiges, nicht übermäßig interpretierendes Äquivalent für עָמָל וְיָגוֹן. „Schande“ bewahrt den öffentlichen bzw. existenziellen Klang von בֹּשֶׁת. „Meine Tage“ erhält das poetische Bild von יָמָי.
