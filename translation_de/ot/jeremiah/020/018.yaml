  text: לָ֤/מָּה זֶּה֙ מֵ/רֶ֣חֶם יָצָ֔אתִי לִ/רְא֥וֹת עָמָ֖ל וְ/יָג֑וֹן וַ/יִּכְל֥וּ בְּ/בֹ֖שֶׁת יָמָֽ/י׃פ
base_translation:
