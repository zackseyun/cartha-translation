  yaml_path: translation/ot/jeremiah/020/018.yaml
  text: Why did I come out from the womb to see trouble and sorrow[b][a], and for my days to end in shame?
translation:
  language: de
  text: Warum nur bin ich aus dem Mutterleib gekommen, um Mühsal und Kummer zu sehen und meine Tage in Schande zu verbringen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: Warum nur
  rationale: לָמָּה stellt die direkte Frage; זֶּה verstärkt sie. „Warum nur“ gibt den nachdrücklichen Klageruf natürlich wieder.
- source_word: מֵרֶחֶם
  choice: aus dem Mutterleib
  rationale: Das Hebräische sagt wörtlich „aus dem Mutterleib“; die deutsche Wendung ist klar und bewahrt das konkrete Bild.
- source_word: יָצָאתִי
  choice: bin ich … gekommen
  rationale: יצא bedeutet „hinausgehen/herauskommen“. Zusammen mit „Mutterleib“ bezeichnet es die Geburt, ohne das Bild durch „geboren werden“ aufzulösen.
- source_word: לִרְאוֹת
  choice: um … zu sehen
  rationale: Die Grundbedeutung ist „sehen“; im Zusammenhang schwingt „erleben“ mit, ohne dass diese Bedeutung ausdrücklich festgelegt werden muss.
- source_word: עָמָל
  choice: Mühsal
  rationale: עָמָל umfasst Mühe, Leid, Unheil und bedrückende Last. „Mühsal“ bewahrt diese Spannweite besser als das engere „Arbeit“.
- source_word: יָגוֹן
  choice: Kummer
  rationale: יָגוֹן bezeichnet Gram, Trauer oder Kummer. „Kummer“ ist modern, würdig und bildet mit „Mühsal“ ein natürliches Paar.
- source_word: וַיִּכְלוּ
  choice: vergehen zu lassen
  rationale: Das Verb kann ausdrücken, dass die Tage zu Ende gehen oder aufgebraucht werden. Die Formulierung bindet die Schlussaussage natürlich an die rhetorische Frage an; die näher am Satzbau liegende Alternative steht in der Fußnote.
- source_word: בְּבֹשֶׁת
  choice: in Schande
  rationale: בֹּשֶׁת bezeichnet Scham oder Schande. „In Schande“ passt zum öffentlichen und existenziellen Gewicht der Klage.
- source_word: יָמָי
  choice: meine Tage
  rationale: Die konkrete poetische Rede von „meinen Tagen“ wird beibehalten und nicht zum abstrakteren „mein Leben“ verallgemeinert.
