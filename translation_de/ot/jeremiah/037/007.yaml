base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/007.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Thus you shall say to the king of Judah, who sent you to me to inquire of me, ‘Behold, Pharaoh’s army, which came out to help you, has returned to its own land[c][b], Egypt.’'
translation:
  language: de
  text: 'So spricht Jahwe, der Gott Israels: So sollt ihr zum König von Juda sagen, der euch zu mir gesandt hat, um mich zu befragen[a]: »Seht, das Heer des Pharaos, das zu eurer Hilfe ausgerückt ist[b], ist in sein Land, nach Ägypten, zurückgekehrt[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „um mich zu suchen“ oder „mich um Auskunft zu bitten“. Das hebräische Verb bezeichnet hier das Einholen einer göttlichen Antwort durch Jeremia.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „das zu eurer Hilfe auszieht“. Im Hebräischen steht ein Partizip; im Zusammenhang ist das Heer bereits aufgebrochen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „ist in das Land Ägypten zurückgekehrt“ oder „kehrt in sein Land, nach Ägypten, zurück“. Die hebräische Perfektform beschreibt unmittelbar die Rückkehr; im prophetischen Zusammenhang kann sie deren Gewissheit betonen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Wiedergabe der prophetischen Botenformel wahrt ihren feierlichen und gegenwärtigen Aussagecharakter.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und idiomatisch wiedergegeben.
- source_word: כֹּה תֹאמְרוּ
  choice: So sollt ihr … sagen
  rationale: Die Formulierung gibt die an mehrere Angeredete gerichtete Anweisung klar und in natürlichem Deutsch wieder.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם אֵלַי
  choice: der euch zu mir gesandt hat
  rationale: Das Partizip bezeichnet im Erzählzusammenhang die bereits vollzogene Sendung durch den König.
- source_word: לְדָרְשֵׁנִי
  choice: um mich zu befragen
  rationale: דרשׁ bezeichnet hier das Einholen einer göttlichen Auskunft durch den Propheten; die erste Person des hebräischen Gotteswortes bleibt erhalten.
- source_word: הִנֵּה
  choice: Sieh
  rationale: „Sieh“ lenkt nachdrücklich auf die folgende unerwartete Ankündigung und ist im heutigen Deutsch verständlicher als „Siehe“.
- source_word: חֵיל פַּרְעֹה
  choice: das Heer des Pharaos
  rationale: חֵיל bezeichnet hier eindeutig eine militärische Streitmacht.
- source_word: הַיֹּצֵא לָכֶם לְעֶזְרָה
  choice: das zu eurer Hilfe ausgerückt ist
  rationale: „Ausrücken“ passt zu einem Heer; das deutsche Perfekt ordnet den vom Partizip bezeichneten Aufbruch dem bereits begonnenen Feldzug zu.
- source_word: שָׁב
  choice: wird … zurückkehren
  rationale: Obwohl die hebräische Form formal ein Perfekt ist, kündigt das Gotteswort im Zusammenhang die sichere bevorstehende Rückkehr des ägyptischen Heeres an.
- source_word: לְאַרְצוֹ מִצְרָיִם
  choice: in sein Land, nach Ägypten
  rationale: „Sein“ nimmt das kollektiv verstandene Heer auf; „nach Ägypten“ erklärt appositionell, welches Land gemeint ist.
theological_decisions:
- issue: Zeitbezug von שָׁב in der göttlichen Ankündigung
  choice: wird … zurückkehren
  alternative: ist … zurückgekehrt / kehrt … zurück
  rationale: Der Kontext versteht die Aussage als Ankündigung des bevorstehenden Abzugs. Eine Fußnote hält die formale und aspektuelle Mehrdeutigkeit der hebräischen Perfektform offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbarer prophetischer Formel. „Sieh“ bewahrt den Aufmerksamkeitsruf ohne altertümelndes „Siehe“; „ausgerückt“ ist präzise und allgemein verständliche Militärsprache.
