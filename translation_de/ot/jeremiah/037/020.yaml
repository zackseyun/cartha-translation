source:
  edition: WLC
  text: וְ/עַתָּ֕ה שְֽׁמַֽע נָ֖א אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ תִּפָּל נָ֤א תְחִנָּתִ/י֙ לְ/פָנֶ֔י/ךָ וְ/אַל תְּשִׁבֵ֗/נִי בֵּ֚ית יְהוֹנָתָ֣ן הַ/סֹּפֵ֔ר וְ/לֹ֥א אָמ֖וּת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/020.yaml
  text: So now[a], please hear, my lord the king; please let my plea fall before you, and do not send me back to the house of Jehonathan the scribe, lest I die there.
translation:
  language: de
  text: Und nun höre doch, mein Herr, der König! Lass doch meine Bitte vor dich kommen[a], und bring mich nicht in das Haus des Schreibers Jehonatan zurück, damit ich dort nicht sterbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Lass doch meine Bitte vor dir niederfallen.« Das Hebräische verwendet hier eine feste Wendung dafür, jemandem eine Bitte vorzutragen.'
    reason: Die Fußnote bewahrt die ungewöhnliche hebräische Metapher, während der Haupttext natürliches modernes Deutsch verwendet.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Kraft von וְ als auch den Übergang zu Jeremias dringender Bitte.
- source_word: שְׁמַע נָא
  choice: höre doch
  rationale: Der Imperativ שׁמע wird eng wiedergegeben; „doch“ vermittelt hier die höflich-drängende Kraft der Partikel נָא.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: mein Herr und König
  rationale: Natürliche deutsche Hofanrede, die sowohl den ehrerbietigen Titel אֲדֹנִי als auch die königliche Stellung ausdrückt.
- source_word: תִּפָּל נָא תְחִנָּתִי לְפָנֶיךָ
  choice: Lass doch meine Bitte vor dich kommen
  rationale: Die Wendung bezeichnet die Vorlage einer dringenden Bitte bei einem Höhergestellten. Die natürliche deutsche Formulierung gibt den Sinn wieder; die wörtliche Metapher mit „fallen“ bleibt in der Fußnote sichtbar.
- source_word: תְחִנָּתִי
  choice: meine Bitte
  rationale: „Bitte“ ist allgemein verständlich und gibt das eindringliche Ersuchen im Zusammenhang angemessen wieder, ohne das heute gehobene „Flehen“ vorauszusetzen.
- source_word: וְאַל תְּשִׁבֵנִי
  choice: und bring mich nicht … zurück
  rationale: Der Hifil von שוב ist kausativ. „Zurückbringen“ entspricht dem Kontext, in dem Jeremia erneut an den früheren Haftort gebracht werden könnte.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: in das Haus des Schreibers Jehonatan
  rationale: בֵּית wird als „Haus“ bewahrt, obwohl es hier als Haftort dient. „Jehonatan“ bildet die hebräische Namensform יְהוֹנָתָן ab; „Schreiber“ bezeichnet sein Amt.
- source_word: וְלֹא אָמוּת שָׁם
  choice: damit ich dort nicht sterbe
  rationale: Die formal mit וְלֹא angeschlossene Verneinung bezeichnet im Zusammenhang den befürchteten Ausgang, den die Bitte verhindern soll.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einer respektvollen königlichen Anrede. Die zweimalige Partikel נָא wird jeweils durch „doch“ als höflich-drängende Bitte hörbar gemacht.
