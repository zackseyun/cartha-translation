base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/019.yaml
  text: And where are your prophets who prophesied to you[a], saying, ‘The king of Babylon will not come against you or against this land’?”
translation:
  language: de
  text: 'Und wo sind eure Propheten, die euch prophezeiten: »Der König von Babel wird nicht gegen euch[a] und gegen dieses Land ziehen«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „auf euch und auf dieses Land“. Die hebräische Präposition kann wörtlicher mit „auf“ wiedergegeben werden, bezeichnet hier aber wahrscheinlich einen feindlichen Vormarsch und wird daher mit „gegen“ übersetzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Und wo sind nun
  rationale: Die Verbindung aus Konjunktion und Fragewort leitet eine zugespitzte rhetorische Frage ein. »Nun« gibt die im Kontext liegende Herausforderung natürlich wieder.
- source_word: נְבִיאֵיכֶם
  choice: eure Propheten
  rationale: Der Plural mit Suffix der 2. Person maskulin Plural wird unmittelbar und idiomatisch wiedergegeben.
- source_word: אֲשֶׁר נִבְּאוּ לָכֶם
  choice: die euch prophezeiten
  rationale: Der Relativsatz bezeichnet die früher an die Angeredeten gerichtete prophetische Tätigkeit; das Präteritum passt zum erzählenden Kontext.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Redeindikator wird im Deutschen vor direkter Rede am natürlichsten durch einen Doppelpunkt ausgedrückt.
- source_word: לֹא יָבֹא
  choice: wird nicht … ziehen
  rationale: Der negierte Imperfekt drückt in der zitierten Vorhersage Zukunft aus. Mit einem Herrscher als Subjekt und עַל als Zielangabe bezeichnet »ziehen gegen« einen feindlichen Vormarsch klar und idiomatisch.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Die Status-constructus-Verbindung wird transparent wiedergegeben; »Babel« entspricht der etablierten deutschen biblischen Namensform.
- source_word: עֲלֵיכֶם
  choice: gegen euch
  rationale: עַל bezeichnet hier im Zusammenhang mit dem Kommen eines feindlichen Königs die Richtung eines feindlichen Vormarschs.
- source_word: וְעַל הָאָרֶץ הַזֹּאת
  choice: und gegen dieses Land
  rationale: Die wiederholte Präposition verbindet Volk und Land als Ziele desselben Vormarschs. Das hebräische וְ wird als »und« bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe bleibt erhalten; die direkte Rede ist knapp und natürlich formuliert. »Gegen … ziehen« verdeutlicht den militärischen Kontext, ohne zusätzliche Deutung einzutragen.
