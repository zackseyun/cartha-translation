base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/015.yaml
  text: And the officials were enraged at Jeremiah[a], and they beat him and put him in the prison house, in the house of Jehonathan the scribe[b], for they had made it a prison.
translation:
  language: de
  text: Die Amtsträger gerieten über Jeremia[a] in Zorn. Sie schlugen ihn und brachten ihn in das Gefängnis im Haus des Schreibers Jonatan[b]; denn sie hatten es zum Gefängnis gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Oberen wurden zornig auf Jeremia.“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in das Haus des Gewahrsams, in das Haus des Schreibers Jonatan“; Jonatans Haus war zum Gefängnis gemacht worden.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְצְפוּ
  choice: wurden … zornig
  rationale: קצף bezeichnet heftigen Zorn oder Entrüstung. „wurden zornig“ ist natürliches, würdevolles Deutsch und gibt den Eintritt der Reaktion wieder, ohne die Intensität unnötig zu überzeichnen.
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים meint hier Personen in leitender staatlicher Stellung. „führende Männer“ wahrt die gesellschaftlich-politische Funktion, ohne fälschlich königliche Söhne anzudeuten; „Beamten“ ist eine mögliche Alternative.
- source_word: וְהִכּוּ אֹתוֹ
  choice: Sie schlugen ihn
  rationale: נכה bezeichnet körperliches Schlagen. Die Form lässt im Deutschen sowohl einzelne als auch wiederholte Schläge zu und legt daher nicht mehr fest als der Ausgangstext.
- source_word: וְנָתְנוּ אֹתוֹ
  choice: brachten ihn
  rationale: נתן bedeutet grundlegend „geben, setzen, tun“. In Verbindung mit dem Zielort ist „brachten ihn in“ im Deutschen natürlich und drückt die Einweisung in das Gefängnis aus.
- source_word: בֵּית הָאֵסוּר
  choice: das Gefängnis
  rationale: Die Wendung bedeutet wörtlich „Haus des Gewahrsams“. „Gefängnis“ gibt die institutionelle Bedeutung klar und idiomatisch wieder; die räumliche Einordnung wird durch den folgenden Ausdruck bewahrt.
- source_word: בֵּית יְהוֹנָתָן הַסֹּפֵר
  choice: im Haus des Schreibers Jonatan
  rationale: Der zweite Ausdruck mit בֵּית bestimmt das Gefängnis räumlich als Teil beziehungsweise Nutzung des Hauses Jonatans. סֹפֵר kann einen Schreiber oder hohen Verwaltungssekretär bezeichnen; „Schreiber“ bleibt quellennah.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Erklärung dafür ein, weshalb das Haus als Gefängnis bezeichnet wird.
- source_word: אֹתוֹ עָשׂוּ לְבֵית הַכֶּלֶא
  choice: dieses Haus hatten sie zum Gefängnis gemacht
  rationale: Das Pronomen wird zur Klarheit mit „dieses Haus“ aufgenommen. עשה mit לְ bezeichnet die Umwandlung oder Bestimmung zu etwas; das Plusquamperfekt macht deutlich, dass diese Nutzung bereits vor Jeremias Einweisung bestand.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze bilden die Abfolge von Zorn, Misshandlung und Inhaftierung klar ab. Der Name יְהוֹנָתָן wird in der im Deutschen geläufigen biblischen Form „Jonatan“ wiedergegeben.
