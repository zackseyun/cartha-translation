  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/006.yaml
  text: Then the word of Yahweh came to Jeremiah the prophet[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an den Propheten Jeremia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Form führt das nächste Ereignis der Erzählung ein. „Da erging“ ist im Deutschen eine natürliche, würdige Wiedergabe innerhalb der prophetischen Botenformel.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der festen Verbindung דְּבַר יְהוָה bewahrt „das Wort“ die erkennbare Formel für die göttliche Offenbarung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֶל
  choice: an
  rationale: Beim deutschen Ausdruck „das Wort erging“ bezeichnet „an“ idiomatisch den Empfänger.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname wird in seiner üblichen deutschen biblischen Form wiedergegeben.
- source_word: הַנָּבִיא
  choice: den Propheten
  rationale: נָבִיא bedeutet „Prophet“; der Artikel wird in der appositionellen Verbindung „den Propheten Jeremia“ berücksichtigt.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den Inhalt der folgenden Gottesrede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Wiedergabe „Jahwe“ erhält seinen Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die feste Formel „das Wort Jahwes erging an“ wird knapp und idiomatisch wiedergegeben; der Doppelpunkt eröffnet die in Vers 7 folgende Rede.
