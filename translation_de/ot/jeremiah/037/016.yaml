source:
  edition: WLC
  text: כִּ֣י בָ֧א יִרְמְיָ֛הוּ אֶל בֵּ֥ית הַ/בּ֖וֹר וְ/אֶל הַֽ/חֲנֻ֑יוֹת וַ/יֵּֽשֶׁב שָׁ֥ם יִרְמְיָ֖הוּ יָמִ֥ים רַבִּֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/016.yaml
  text: For Jeremiah had come into the dungeon house and into the cells[a], and Jeremiah remained there many days.
translation:
  language: de
  text: Denn Jeremia war in das Kerkerhaus und in die Zellen[a] gekommen, und dort blieb er viele Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „in die gewölbten Räume“ beziehungsweise „in die Verschläge“; das seltene hebräische Wort bezeichnet wahrscheinlich abgetrennte Räume innerhalb des Gefängnisses.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet hier eine erklärende Aussage über die Umstände von Jeremias Haft ein; „denn“ bewahrt diese Funktion, ohne den Satz rein zeitlich zu deuten.
- source_word: בָא
  choice: war … gekommen
  rationale: Das Plusquamperfekt kennzeichnet das Eintreten in den Haftbereich als vorausgehend gegenüber seinem langen Verbleib dort.
- source_word: בֵּית הַבּוֹר
  choice: Kerkerhaus
  rationale: Die Wendung bedeutet wörtlich etwa „Haus der Grube/Zisterne“. Im Haftkontext gibt „Kerkerhaus“ die Funktion und den unterirdischen Charakter knapp und verständlich wieder.
- source_word: הַחֲנֻיוֹת
  choice: Zellen
  rationale: Das seltene Wort bezeichnet wahrscheinlich abgegrenzte Räume innerhalb des Gefängnisses. „Zellen“ ist im modernen Deutschen am klarsten; die lexikalische Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: וַיֵּשֶׁב שָׁם
  choice: und dort blieb er
  rationale: ישׁב kann „sitzen“, „wohnen“ oder „bleiben“ bedeuten. Im Zusammenhang einer Gefangenschaft bezeichnet „blieb“ idiomatisch den fortdauernden Aufenthalt.
- source_word: יָמִים רַבִּים
  choice: viele Tage
  rationale: Bewahrt die konkrete hebräische Zeitangabe, ohne sie zum allgemeineren „lange Zeit“ zu verflachen.
theological_decisions: []
