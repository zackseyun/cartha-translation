base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/017.yaml
  text: Then King Zedekiah sent and had him brought[a], and the king questioned him privately in his house, and said, “Is there any word from Yahweh?” Jeremiah said, “There is.” Then he said[b], “You will be given into the hand of the king of Babylon.”
translation:
  language: de
  text: 'Da sandte König Zedekia nach Jeremia und ließ ihn holen. In seinem Haus befragte ihn der König heimlich[a]: »Gibt es ein Wort von Jahwe?« Jeremia antwortete: »Ja, das gibt es.« Dann sagte Jeremia: »Du wirst in die Gewalt[b] des Königs von Babel gegeben werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: an einem verborgenen Ort.'
    reason: Das hebräische בַּסֵּתֶר kann sowohl die heimliche Art der Unterredung als auch einen verborgenen Ort bezeichnen.
  - marker: b
    text: 'Wörtlich: in die Hand.'
    reason: Die hebräische Redewendung bezeichnet, dass jemand der Macht oder Verfügungsgewalt eines anderen ausgeliefert wird.
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקָּחֵהוּ
  choice: sandte ... nach Jeremia und ließ ihn holen
  rationale: Die beiden aufeinanderfolgenden Verben bedeuten wörtlich „sandte“ und „nahm/holte ihn“. Im Zusammenhang bezeichnet die Wendung, dass der König nach Jeremia schicken und ihn zu sich bringen ließ. Der Name wird zur eindeutigen Bezugnahme eingesetzt.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: befragte ihn
  rationale: שׁאל bedeutet „fragen, sich erkundigen“. „Befragte“ passt zur vertraulichen königlichen Unterredung, ohne ein förmliches Verhör vorauszusetzen.
- source_word: בְּבֵיתוֹ
  choice: in seinem Haus
  rationale: בַּיִת bezeichnet hier die Residenz des Königs. „Haus“ bewahrt die konkrete Formulierung des Hebräischen; „Palast“ wäre eine mögliche, aber stärker deutende Wiedergabe.
- source_word: בַּסֵּתֶר
  choice: heimlich
  rationale: Die adverbiale Wendung bezeichnet etwas im Verborgenen beziehungsweise unter Ausschluss anderer. „Heimlich“ ist knapp und natürlich; die räumlichere Möglichkeit wird in der Fußnote genannt.
- source_word: הֲיֵשׁ דָּבָר מֵאֵת יְהוָה
  choice: Gibt es ein Wort von Jahwe?
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Botschaft“ bedeuten. „Wort von Jahwe“ bewahrt die prägnante prophetische Ausdrucksweise und ihre intertextuellen Bezüge.
- source_word: יֵשׁ
  choice: Ja
  rationale: Die knappe Antwort lautet wörtlich „Es gibt/ist“. Im Deutschen gibt „Ja“ die elliptische Antwort natürlich und mit derselben dramatischen Kürze wieder.
- source_word: בְּיַד
  choice: in die Gewalt
  rationale: Die hebräische Wendung „in die Hand“ bezeichnet hier die Verfügungsgewalt eines Herrschers. „In die Gewalt“ vermittelt den Sinn im heutigen Deutsch; die wörtliche Bildsprache bleibt in der Fußnote erhalten.
- source_word: תִּנָּתֵן
  choice: wirst ... gegeben werden
  rationale: Der Niphal von נתן ist passiv und bedeutet hier „gegeben/übergeben werden“. Die Wiedergabe bewahrt die Passivform und lässt den Handelnden, wie im Ausgangstext, ungenannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als persönlicher Name wiedergegeben. „Jahwe“ ist die im Deutschen übliche wissenschaftliche Transkription.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH und keinen Titel. „Jahwe“ macht diesen Unterschied sichtbar, ohne eine konfessionelle Deutung einzutragen.
- issue: Ungenannter Handelnder beim passiven תִּנָּתֵן
  choice: Passiv ohne Nennung des Handelnden
  alternative: Gott wird dich ausliefern
  rationale: Der hebräische Satz sagt nicht ausdrücklich, wer Zedekia übergibt. Die passive Form erhält diese Offenheit und vermeidet, Gott oder einen menschlichen Akteur ergänzend zum grammatischen Subjekt zu machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Erzählführung. Die direkte Rede bleibt dramatisch kurz. „Haus“ wahrt die Ausgangsformulierung, während „Gewalt“ die hebräische Redewendung verständlich wiedergibt; ihre Bildsprache wird in der Fußnote dokumentiert.
