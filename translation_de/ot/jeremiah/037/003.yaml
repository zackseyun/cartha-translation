  text: וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ אֶת יְהוּכַ֣ל בֶּן שֶֽׁלֶמְיָ֗ה וְ/אֶת צְפַנְיָ֤הוּ בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר הִתְפַּלֶּל נָ֣א בַעֲדֵ֔/נוּ אֶל יְהוָ֖ה אֱלֹהֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/003.yaml
  text: Then King Zedekiah sent Jehucal son of Shelemiah and Zephaniah son of Maaseiah the priest to Jeremiah the prophet[a], saying, “Please pray to Yahweh our God for us.”
translation:
  language: de
  text: 'Da sandte König Zedekia Juchal[a], den Sohn Schelemjas, und Zefanja, den Sohn Maasejas, den Priester, zum Propheten Jeremia und ließ ihm sagen: »Bitte bete für uns zu Jahwe, unserem Gott!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Juchal; in Jeremia 38,1 erscheint der Name in der Kurzform Jukal.
    reason: Namensvariante im hebräischen Text erläutern; der Marker steht unmittelbar bei dem Namen, auf den sich die Anmerkung bezieht.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das Wayyiqtol führt die Erzählung weiter; „Da sandte“ gibt die zeitliche Abfolge in natürlichem, gehobenem Deutsch wieder.
- source_word: יְהוּכַל בֶּן שֶׁלֶמְיָה
  choice: Juchal, den Sohn Schelemjas
  rationale: „Juchal“ folgt der deutschen Wiedergabetradition des hebräischen Namens יְהוּכַל; die Abstammungsangabe wird transparent beibehalten.
- source_word: צְפַנְיָהוּ בֶן מַעֲשֵׂיָה הַכֹּהֵן
  choice: den Priester Zefanja, den Sohn Maasejas
  rationale: Der bestimmte Titel הַכֹּהֵן bezieht sich syntaktisch am natürlichsten auf Zefanja. Die deutsche Wortstellung beseitigt die mögliche Fehlzuordnung zu Maaseja, ohne zusätzliche Information einzutragen.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: zum Propheten Jeremia
  rationale: Natürliche deutsche Titelstellung, die sowohl Namen als auch Funktion vollständig wiedergibt.
- source_word: לֵאמֹר
  choice: Sie sollten ihm sagen
  rationale: Der hebräische Redeintroduktor wird im Deutschen als idiomatische Einführung der übermittelten Botschaft wiedergegeben; das Subjekt sind die beiden Gesandten.
- source_word: הִתְפַּלֶּל נָא
  choice: Bitte bete
  rationale: Der Imperativ von פלל bezeichnet das Beten; נָא kennzeichnet die Bitte beziehungsweise dringliche Aufforderung.
- source_word: בַעֲדֵנוּ
  choice: für uns
  rationale: Die Präposition bezeichnet hier Fürbitte zugunsten der Sprecher; „für uns“ ist knapp und idiomatisch.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unserem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; אֱלֹהֵינוּ bleibt als appositionale Bestimmung „unserem Gott“ erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH, nicht den Titel אֲדֹנָי. „Jahwe“ bewahrt den Charakter als Gottesname, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist natürlich formuliert; die Bezeichnung Zefanjas als Priester wird durch die Wortstellung eindeutig gemacht. Der Fußnotenmarker steht unmittelbar nach der vollständigen direkten Rede.
