id: JER.37.10
reference: Jeremiah 37:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם הִכִּיתֶ֞ם כָּל חֵ֤יל כַּשְׂדִּים֙ הַ/נִּלְחָמִ֣ים אִתְּ/כֶ֔ם וְ/נִ֨שְׁאֲרוּ בָ֔/ם אֲנָשִׁ֖ים מְדֻקָּרִ֑ים אִ֤ישׁ בְּ/אָהֳל/וֹ֙ יָק֔וּמוּ וְ/שָֽׂרְפ֛וּ אֶת הָ/עִ֥יר הַ/זֹּ֖את בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/010.yaml
  text: For even if you were to strike down the whole army of the Chaldeans who are fighting against you[a], and only wounded men remained among them, each in his tent[b], they would rise up and burn this city with fire.
translation:
  language: de
  text: Denn selbst wenn ihr das ganze Heer der Chaldäer[a], die gegen euch kämpfen, schlagen würdet und unter ihnen nur durchbohrte Männer[b] übrig blieben – jeder in seinem Zelt –, würden sie sich erheben und diese Stadt niederbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“. Im Hebräischen steht „Chaldäer“, die in Jeremia übliche Volksbezeichnung für die babylonischen Truppen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „durchbohrte“ oder „durchstochene Männer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Denn selbst wenn
  rationale: Gibt sowohl den begründenden Anschluss von כִּי als auch den nachdrücklichen hypothetisch-konzessiven Sinn von אִם wieder.
- source_word: הִכִּיתֶם
  choice: ihr ... schlagen würdet
  rationale: Der Konjunktiv II bildet die hypothetische Bedingung natürlich ab; „schlagen“ bewahrt die militärische Bedeutung, ohne zwingend jedes einzelne Mitglied als getötet darzustellen.
- source_word: כָּל חֵיל כַּשְׂדִּים
  choice: das ganze Heer der Chaldäer
  rationale: חֵיל bezeichnet hier eine Streitmacht; die Formulierung wahrt den kollektiven Singular und den hebräischen Volksnamen.
- source_word: כַּשְׂדִּים
  choice: Chaldäer
  rationale: Entspricht unmittelbar dem hebräischen Ethnonym; die kontextuelle Bezeichnung „Babylonier“ wird in der Fußnote genannt.
- source_word: הַנִּלְחָמִים אִתְּכֶם
  choice: die gegen euch kämpfen
  rationale: Im feindlichen militärischen Zusammenhang bezeichnet die Konstruktion eindeutig den Kampf gegen die Angesprochenen.
- source_word: וְנִשְׁאֲרוּ בָם
  choice: und unter ihnen nur ... übrig blieben
  rationale: „übrig bleiben“ entspricht dem Verb; „nur“ verdeutlicht die im Extremszenario vorausgesetzte Beschränkung auf einen kleinen Rest.
- source_word: אֲנָשִׁים מְדֻקָּרִים
  choice: durchbohrte Männer
  rationale: Bewahrt die konkrete Bedeutung „durchbohrt/durchstochen“ genauer als das allgemeinere „Verwundete“, ohne ausdrücklich den Tod vorauszusetzen.
- source_word: אִישׁ בְּאָהֳלוֹ
  choice: jeder in seinem Zelt
  rationale: Gibt den distributiven Singular knapp und formgetreu wieder.
- source_word: יָקֻמוּ
  choice: würden sie aufstehen
  rationale: Setzt die hypothetische Folge fort und bewahrt die konkrete Vorstellung, dass selbst die Schwerverwundeten sich erheben.
- source_word: וְשָׂרְפוּ אֶת הָעִיר הַזֹּאת בָּאֵשׁ
  choice: und diese Stadt niederbrennen
  rationale: Natürliches modernes Deutsch für das Verb mit der instrumentalen Wendung „mit Feuer“; „niederbrennen“ enthält den Feuerbezug bereits und vermeidet eine im Deutschen schwerfällige Doppelung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der doppelte hypothetische Satz wird mit Konjunktiv II wiedergegeben. „Chaldäer“ wahrt die quellensprachliche Bezeichnung; „niederbrennen“ ist gegenüber dem wörtlichen „mit Feuer verbrennen“ idiomatischer, ohne den Sinn abzuschwächen.
