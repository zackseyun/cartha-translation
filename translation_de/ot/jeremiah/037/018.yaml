translation:
  language: de
  text: 'Da sagte Jeremia zu König Zedekia: »Was habe ich gegen dich, deine Diener und dieses Volk gesündigt, dass ihr mich ins Gefängnis gebracht habt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶה חָטָאתִי לְךָ
  choice: Was habe ich gegen dich … gesündigt?
  rationale: Gibt die ungewöhnliche, aber verständliche Verbindung von מֶה mit חטא לְ formal nah wieder und bewahrt den vorwurfsvollen Fragesinn.
- source_word: עֲבָדֶיךָ
  choice: deine Diener
  rationale: Entspricht im königlichen Kontext den Amtsträgern bzw. Bediensteten Zedekias, ohne den Ausdruck unnötig einzuengen.
- source_word: נְתַתֶּם אֹתִי אֶל־בֵּית הַכֶּלֶא
  choice: ihr mich ins Gefängnis geworfen habt
  rationale: נָתַן אֶל bezeichnet hier die Einweisung in Haft; „geworfen“ ist im modernen Deutschen die natürliche idiomatische Wiedergabe, während בֵּית הַכֶּלֶא als „Gefängnis“ ausgedrückt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede wechselt wie im Hebräischen vom Singular („dich, deine“) zum Plural („ihr“), wodurch der König zusammen mit seinen Dienern bzw. Verantwortlichen angesprochen wird.
