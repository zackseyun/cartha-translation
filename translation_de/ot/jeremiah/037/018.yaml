    issue: „geworfen“ ist stärker als der hebräische Ausdruck.
    rationale: נתן („geben“, hier im Sinn von in Haft bringen/einweisen) beschreibt die Verbringung ins Gefängnis, ohne ausdrücklich ein gewaltsames „Werfen“ zu behaupten. Eine neutrale Formulierung vermeidet diesen Bedeutungszuwachs.
