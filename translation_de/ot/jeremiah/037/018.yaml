  verdict: revise
  source_fidelity: 'Die Anrede und die Abfolge der Bezugsgruppen entsprechen dem Hebräischen. Der Wechsel von Singular („dich“) zu Plural („ihr“) bewahrt den hebräischen Befund: Der König wird zunächst einzeln, bei der Verantwortung für die Gefangensetzung jedoch zusammen mit den anderen Angesprochenen erfasst. נְתַתֶּם ... אֶל־בֵּית הַכֶּלֶא bedeutet wörtlich etwa „ihr habt mich in das Gefängnishaus gegeben/gebracht“; „geworfen“ fügt eine nicht ausdrücklich markierte Gewaltsamkeit hinzu.'
  naturalness: Der Satz ist insgesamt klares, modernes und würdiges Standarddeutsch. „Ins Gefängnis gebracht“ ist hier ebenso idiomatisch wie „ins Gefängnis geworfen“, aber neutraler und näher am Ausgangstext.
  terminology: „Diener“ ist für עֲבָדֶיךָ im höfisch-königlichen Kontext möglich und lässt die genaue soziale Funktion offen. „Gefängnis“ gibt בֵּית הַכֶּלֶא sachgerecht wieder. Die Formulierung „gegen dich ... gesündigt“ erhält die im Hebräischen verwendete Sünden-Terminologie.
  issues:
