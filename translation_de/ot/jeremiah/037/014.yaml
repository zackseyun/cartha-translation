source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֜הוּ שֶׁ֗קֶר אֵינֶ֤/נִּי נֹפֵל֙ עַל הַ/כַּשְׂדִּ֔ים וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑י/ו וַ/יִּתְפֹּ֤שׂ יִרְאִיָּיה֙ בְּ/יִרְמְיָ֔הוּ וַ/יְבִאֵ֖/הוּ אֶל הַ/שָּׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/014.yaml
  text: But Jeremiah said[a], “That is a lie; I am not defecting to the Chaldeans.” But he would not listen to him[c][b], and Irijah seized Jeremiah and brought him to the officials.
translation:
  language: de
  text: 'Doch Jeremia sagte: „Das ist gelogen! Ich laufe nicht zu den Chaldäern über.“ Aber Jirija hörte nicht auf ihn. Er ergriff Jeremia und brachte ihn zu den führenden Beamten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu den Obersten“ beziehungsweise „zu den führenden Männern“. Das hebräische Wort bezeichnet hochrangige Herrscher oder Amtsträger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Das ist gelogen!
  rationale: Das allein stehende Substantiv dient als energischer Zurückweisung der Anschuldigung. Die deutsche Wendung ist natürlich und bewahrt die Schärfe des Ausrufs.
- source_word: אֵינֶנִּי נֹפֵל עַל הַכַּשְׂדִּים
  choice: Ich laufe nicht zu den Chaldäern über
  rationale: נפל על bezeichnet hier im militärisch-politischen Zusammenhang den Seitenwechsel zum Feind, nicht ein buchstäbliches Fallen. „Überlaufen“ gibt diesen Sinn im Deutschen präzise und idiomatisch wieder.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Bewahrt die ethnisch-politische Bezeichnung des hebräischen Textes; im Kontext sind die babylonischen Streitkräfte gemeint.
- source_word: וְלֹא שָׁמַע אֵלָיו
  choice: Aber Jirija hörte nicht auf ihn
  rationale: „Auf jemanden hören“ bezeichnet im Deutschen passend, dass Jirija Jeremias Einwand kein Gehör schenkte. Der Name ersetzt das im Hebräischen eindeutige männliche Pronomen, um Missverständnisse zu vermeiden.
- source_word: וַיִּתְפֹּשׂ
  choice: Er ergriff
  rationale: Gibt die gewaltsame Ingewahrsamnahme wieder, ohne die stärker rechtlich geprägte Deutung „verhaftete“ ausdrücklich einzutragen.
- source_word: וַיְבִאֵהוּ אֶל
  choice: brachte ihn zu
  rationale: Direkte und natürliche Wiedergabe des kausativen Verbs בוא in diesem Zusammenhang.
- source_word: הַשָּׂרִים
  choice: die führenden Beamten
  rationale: שׂרים bezeichnet hier hochrangige Amts- und Machthaber. „Führende Beamte“ ist modernes Deutsch und vermeidet die irreführende dynastische Bedeutung von „Fürsten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper erzählerischer Satzfolge. „Überlaufen“ bildet den militärisch-politischen Vorwurf idiomatisch ab; „Chaldäer“ bewahrt die Quellbezeichnung. Der Fußnotenmarker steht unmittelbar bei der erklärungsbedürftigen Amtsbezeichnung.
