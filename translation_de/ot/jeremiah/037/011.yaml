  text: When the army of the Chaldeans had gone up from Jerusalem because of Pharaoh’s army,[a]
translation:
  language: de
  text: Als das Heer der Chaldäer wegen des Heeres des Pharaos von Jerusalem abgezogen war,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als das Heer der Chaldäer von Jerusalem hinaufgezogen war«. Im Zusammenhang ist gemeint, dass es die Belagerung aufhob und sich wegen des Heeres des Pharaos zurückzog.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Als … war
  rationale: Die hebräische Erzählungsformel leitet hier zusammen mit dem folgenden Temporalsatz eine neue Situation ein. Im modernen Deutschen wird dies natürlich durch den mit »Als« eingeleiteten Nebensatz ausgedrückt, ohne eine nicht ausdrücklich vorhandene Zeitpartikel wie »nun« einzufügen.
- source_word: בְּהֵעָלוֹת
  choice: abgezogen war
  rationale: Die Konstruktion aus ב und dem Infinitiv von עלה bezeichnet den zeitlichen Umstand. In Verbindung mit מֵעַל יְרוּשָׁלִָם und dem militärischen Zusammenhang meint sie, dass das Belagerungsheer seine Stellung vor Jerusalem aufgab und sich entfernte. Das Plusquamperfekt fügt den Nebensatz natürlich in den deutschen Erzählzusammenhang ein.
- source_word: חֵיל
  choice: Heer
  rationale: חֵיל bezeichnet hier jeweils eine organisierte Streitmacht. »Heer« ist im militärischen und historischen Zusammenhang präzise und gut verständlich.
- source_word: הַכַּשְׂדִּים
  choice: der Chaldäer
  rationale: Die Übersetzung bewahrt die hebräische Volksbezeichnung, statt sie kontextuell durch »Babylonier« zu ersetzen.
- source_word: מֵעַל יְרוּשָׁלִָם
  choice: von Jerusalem
  rationale: Wörtlich steht »von über/bei Jerusalem weg«. Im Belagerungskontext bezeichnet die Wendung die Entfernung des Heeres aus seiner Stellung gegen die Stadt; »von Jerusalem« gibt dies im Deutschen idiomatisch wieder.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Grund für den Abzug angesichts der Streitmacht des Pharaos. »Wegen« gibt diese kausale Bedeutung knapp und natürlich wieder.
- source_word: חֵיל פַּרְעֹה
  choice: des Heeres des Pharaos
  rationale: Die hebräische Status-constructus-Verbindung bezeichnet die dem Pharao zugehörige Streitmacht. Die Genitivkonstruktion ist im Deutschen eindeutig und dem würdigen Erzählstil angemessen.
