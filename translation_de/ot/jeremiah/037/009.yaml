id: JER.37.9
reference: Jeremiah 37:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תַּשִּׁ֤אוּ נַפְשֹֽׁתֵי/כֶם֙ לֵ/אמֹ֔ר הָלֹ֛ךְ יֵלְכ֥וּ מֵ/עָלֵ֖י/נוּ הַ/כַּשְׂדִּ֑ים כִּי לֹ֖א יֵלֵֽכוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/009.yaml
  text: 'Thus says Yahweh: Do not deceive yourselves[a], saying[c][b], ‘The Chaldeans will surely go away from us,’ for they will not go away.'
translation:
  language: de
  text: 'So spricht Jahwe: Täuscht euch nicht selbst[a], indem ihr sagt: »Die Chaldäer[b] werden ganz bestimmt von uns abziehen[c]«, denn sie werden nicht abziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gebt euch keiner Täuschung hin.« Wörtlich erwähnt die hebräische Wendung »eure Seelen«; gemeint sind Selbsttäuschung und falsche Zuversicht.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Chaldäern« sind hier die babylonischen Streitkräfte gemeint.
    reason: cultural_note
  - marker: c
    text: 'Oder: »werden mit Sicherheit von uns weggehen«. Die hebräische Verbindung eines absoluten Infinitivs mit der finiten Verbform betont die behauptete Gewissheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt die hebräische Botenformel knapp und würdig wieder; der Gottesname wird als persönlicher Name »Jahwe« wiedergegeben.
- source_word: אַל תַּשִּׁיאוּ נַפְשֹׁתֵיכֶם
  choice: Täuscht euch nicht selbst
  rationale: Die hebräische Wendung mit נֶפֶשׁ bezeichnet hier Selbsttäuschung beziehungsweise falsche Zuversicht und ist nicht wörtlich als ein Erheben der Seele zu verstehen.
- source_word: לֵאמֹר
  choice: indem ihr sagt
  rationale: Die Formulierung macht im natürlichen Deutschen deutlich, worin die Selbsttäuschung besteht.
- source_word: הָלֹךְ יֵלְכוּ
  choice: werden ganz bestimmt … abziehen
  rationale: Der Infinitivus absolutus neben der finiten Verbform verstärkt die behauptete Gewissheit; »ganz bestimmt« bildet diese Betonung idiomatisch ab.
- source_word: מֵעָלֵינוּ
  choice: von uns
  rationale: Im militärischen Zusammenhang bezeichnet die Präposition die Bewegung weg von Juda; zusammen mit »abziehen« ist »von uns« die natürliche deutsche Fassung.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die historische Bezeichnung des hebräischen Textes bleibt erhalten; im Kontext sind damit die babylonischen Streitkräfte gemeint.
- source_word: כִּי לֹא יֵלֵכוּ
  choice: denn sie werden nicht abziehen
  rationale: כִּי begründet die Warnung. Die Wiederholung von »abziehen« bewahrt den scharfen rhetorischen Gegensatz.
theological_decisions:
- issue: Wiedergabe des Tetragramms יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den persönlichen Gottesnamen des Ausgangstextes, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die historische Benennung »Chaldäer« und die emphatische hebräische Verbkonstruktion bleiben erkennbar; die idiomatische Wendung zur Selbsttäuschung wird sinngerecht und ohne konfessionelle Zusätze wiedergegeben.
