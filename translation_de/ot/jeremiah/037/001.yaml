id: JER.37.1
reference: Jeremiah 37:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּ֨מְלָךְ מֶ֔לֶךְ צִדְקִיָּ֖הוּ בֶּן יֹֽאשִׁיָּ֑הוּ תַּ֗חַת כָּנְיָ֨הוּ֙ בֶּן יְה֣וֹיָקִ֔ים אֲשֶׁ֥ר הִמְלִ֛יךְ נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל בְּ/אֶ֥רֶץ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/001.yaml
  text: And King Zedekiah son of Josiah reigned in place of Coniah son of Jehoiakim[b][a], whom Nebuchadnezzar king of Babylon had made king in the land of Judah.
translation:
  language: de
  text: Und Zedekia, der Sohn Josias, den Nebukadnezar[b], der König von Babylon, im Land Juda zum König eingesetzt hatte, wurde anstelle Konjas[a], des Sohnes Jojakims, König.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Konja; andernorts wird er auch Jekonja genannt.
    reason: alternative_reading
  - marker: b
    text: Die hebräische Schreibweise entspricht näher der Form Nebukadrezar; im Deutschen ist Nebukadnezar gebräuchlich.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלָךְ
  choice: wurde … König
  rationale: Die Erzählform bezeichnet hier den Regierungsantritt. „Wurde König“ gibt den Vorgang im Deutschen natürlich wieder und passt zur anschließenden Angabe, dass der babylonische König ihn eingesetzt hatte.
- source_word: מֶלֶךְ צִדְקִיָּהוּ
  choice: Zedekia … wurde … König
  rationale: Die hebräische Titelkonstruktion wird in eine natürliche deutsche Satzstellung überführt, ohne den Königstitel auszulassen.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: der Sohn Josias
  rationale: Die Abstammungsangabe wird sachlich und in geläufiger deutscher Namensform wiedergegeben.
- source_word: תַּחַת
  choice: anstelle
  rationale: Im Zusammenhang der Thronfolge bezeichnet das Wort die Ablösung beziehungsweise Nachfolge.
- source_word: כָּנְיָהוּ
  choice: Konja
  rationale: „Konja“ bildet die hier tatsächlich stehende hebräische Namensform ab, statt sie im Haupttext an eine andere Namensform anzugleichen.
- source_word: בֶּן יְהוֹיָקִים
  choice: des Sohnes Jojakims
  rationale: Die Genitivkonstruktion bewahrt die genaue Abstammungsangabe in natürlichem Deutsch.
- source_word: אֲשֶׁר הִמְלִיךְ
  choice: den … zum König eingesetzt hatte
  rationale: 'Der Hifil von מלך ist kausativ: jemanden zum König machen beziehungsweise einsetzen. Das Plusquamperfekt zeigt, dass die Einsetzung dem berichteten Regierungsantritt vorausging.'
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die im Deutschen weithin geläufige Namensform dient der Lesbarkeit; die dem hebräischen Schriftbild näherstehende Form wird in einer Fußnote genannt.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babylon
  rationale: Die hebräische Status- und Herkunftsangabe wird direkt und idiomatisch wiedergegeben.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: im Land Juda
  rationale: Dies entspricht der Präposition und dem hebräischen Ausdruck wörtlich nah, ohne ein nicht ausdrücklich genanntes „über“ einzufügen.
theological_decisions:
- issue: Bezugswort des Relativsatzes אֲשֶׁר הִמְלִיךְ
  choice: Der Relativsatz wird durch Umstellung eindeutig auf Zedekia bezogen.
  alternative: Bei Beibehaltung der hebräischen Wortfolge könnte der deutsche Relativsatz grammatisch irreführend auf Konja bezogen werden.
  rationale: Der historische und syntaktische Gesamtsinn ist, dass Nebukadnezar Zedekia zum König einsetzte. Die Umstellung vermeidet einen falschen deutschen Bezug, ohne eine theologische Zusatzdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder wurden gegenüber der hebräischen Reihenfolge umgestellt, damit der Relativsatz eindeutig auf Zedekia bezogen bleibt. Eigennamen folgen geläufigen deutschen Formen, sofern eine Fußnote die genauere hebräische Form dokumentiert.
