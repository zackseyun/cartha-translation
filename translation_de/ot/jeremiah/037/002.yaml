source:
  edition: WLC
  text: וְ/לֹ֥א שָׁמַ֛ע ה֥וּא וַ/עֲבָדָ֖י/ו וְ/עַ֣ם הָ/אָ֑רֶץ אֶל דִּבְרֵ֣י יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יִרְמְיָ֥הוּ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/002.yaml
  text: But he and his servants and the people of the land did not listen to the words of Yahweh that he spoke through Jeremiah the prophet[a][b][c].
translation:
  language: de
  text: Doch er, seine Diener und das Volk des Landes[b] hörten nicht auf[a] die Worte Jahwes, die er durch den Propheten Jeremia[c] gesprochen hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehorchten den Worten Jahwes nicht“. Das hebräische Verb kann „hören“, „auf etwas hören“ und sinngemäß „gehorchen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Der hebräische Ausdruck „Volk des Landes“ kann allgemein die Bevölkerung oder besonders die einfachen Leute bezeichnen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „durch die Hand Jeremias, des Propheten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: Doch ... nicht
  rationale: Die Verbindung setzt die Erzählung mit einem Gegensatz zum vorherigen Vers fort. „Doch“ gibt diesen Sinn im Deutschen natürlich wieder, ohne ihn zu überzeichnen.
- source_word: שָׁמַע
  choice: auf ... hören
  rationale: Das Verb kann „hören“, „auf etwas hören“ oder sinngemäß „gehorchen“ bedeuten. Die deutsche Wendung bewahrt sowohl das Bild des Hörens als auch den Gedanken, einer Botschaft Folge zu leisten.
- source_word: וַ/עֲבָדָיו
  choice: seine Diener
  rationale: Im königlichen Umfeld kann das Wort Hofbedienstete oder Amtsträger bezeichnen. „Diener“ ist die breite, textnahe Wiedergabe.
- source_word: וְ/עַם הָ/אָרֶץ
  choice: das Volk des Landes
  rationale: Die Wiedergabe erhält den hebräischen Ausdruck, der je nach Zusammenhang allgemein die Bevölkerung oder besonders die einfachen Leute bezeichnen kann.
- source_word: דִּבְרֵי יְהוָה
  choice: die Worte Jahwes
  rationale: Der hebräische Plural wird als „Worte“ wiedergegeben; der Gottesname wird als Eigenname „Jahwe“ bewahrt.
- source_word: אֲשֶׁר דִּבֶּר
  choice: die er ... gesprochen hatte
  rationale: Der Relativsatz bezieht sich auf Jahwes Worte. Das Plusquamperfekt macht im Deutschen natürlich deutlich, dass das Sprechen der ausbleibenden Reaktion vorausging.
- source_word: בְּ/יַד
  choice: durch
  rationale: Die wörtliche Wendung „durch die Hand von“ bezeichnet hier Jeremia als den menschlichen Vermittler der göttlichen Worte. „Durch“ gibt diese Funktion idiomatisch wieder.
- source_word: יִרְמְיָהוּ הַ/נָּבִיא
  choice: den Propheten Jeremia
  rationale: Diese Wortstellung ist im modernen Deutschen natürlich und gibt Jeremias ausdrücklich genannte prophetische Funktion wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע
  choice: auf die Worte hören
  alternative: den Worten gehorchen
  rationale: Die gewählte Formulierung lässt die im Hebräischen vorhandene Spannung zwischen Hören, Beachten und Gehorchen bestehen, statt sie ausschließlich als Gehorsam auszulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wendung „auf die Worte hören“ bleibt bewusst nahe am hebräischen Sprachbild und bewahrt dessen Bedeutungsbreite; erläuterungsbedürftige hebräische Ausdrücke werden in Fußnoten transparent gemacht.
