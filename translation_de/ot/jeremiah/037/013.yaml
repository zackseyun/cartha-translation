  naturalness: Der Text ist flüssiges modernes Standarddeutsch. »Wachhabender« ist verständlich und rangneutral; »ein Sohn Schelemjas und Enkel Hananjas« klingt dagegen genealogisch stärker festgelegt und weniger nahe an der knappen hebräischen Namensfolge.
