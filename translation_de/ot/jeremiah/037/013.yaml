  text: וַ/יְהִי ה֞וּא בְּ/שַׁ֣עַר בִּנְיָמִ֗ן וְ/שָׁם֙ בַּ֣עַל פְּקִדֻ֔ת וּ/שְׁמ/וֹ֙ יִרְאִיָּ֔יה בֶּן שֶֽׁלֶמְיָ֖ה בֶּן חֲנַנְיָ֑ה וַ/יִּתְפֹּ֞שׂ אֶֽת יִרְמְיָ֤הוּ הַ/נָּבִיא֙ לֵ/אמֹ֔ר אֶל הַ/כַּשְׂדִּ֖ים אַתָּ֥ה נֹפֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/013.yaml
  text: And when he was at the Benjamin Gate[a], there was a captain of the guard there whose name was Irijah son of Shelemiah, son of Hananiah, and he seized Jeremiah the prophet, saying, “You are deserting to the Chaldeans!”
translation:
  language: de
  text: 'Als er am Benjamintor war, befand sich dort ein Wachhabender namens Jirija, ein Sohn Schelemjas, eines Sohnes Hananjas. Er ergriff den Propheten Jeremia und sagte: »Du läufst zu den Chaldäern über![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Du gehst zu den Chaldäern über!« Wörtlich heißt die hebräische Wendung: »Du fällst zu den Chaldäern.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁעַר בִּנְיָמִן
  choice: am Benjamintor
  rationale: Die Verbindung bezeichnet ein nach Benjamin benanntes Stadttor; die Zusammenschreibung ist im Deutschen natürlich.
- source_word: בַּעַל פְּקִדֻת
  choice: Wachhabender
  rationale: Die seltene Wendung bezeichnet den mit Aufsicht beziehungsweise Wachdienst betrauten Amtsträger. »Wachhabender« wahrt diese Funktion, ohne einen im Hebräischen nicht ausdrücklich genannten militärischen Rang festzulegen.
- source_word: יִרְאִיָּה
  choice: Jirija
  rationale: Quellnahe und im Deutschen gut sprechbare Wiedergabe des hebräischen Personennamens.
- source_word: בֶּן שֶׁלֶמְיָה בֶּן חֲנַנְיָה
  choice: ein Sohn Schelemjas und Enkel Hananjas
  rationale: Das zweite בֶּן drückt hier die weitere Abstammung aus; »Enkel« macht die genealogische Beziehung im Deutschen klar.
- source_word: וַיִּתְפֹּשׂ
  choice: ergriff
  rationale: Das Verb bezeichnet ein entschiedenes, körperliches Festhalten; »ergriff« vermeidet die zusätzliche Annahme eines förmlichen Rechtsakts, die »verhaftete« nahelegen könnte.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: den Propheten Jeremia
  rationale: Natürliche deutsche Apposition, die Titel und Namen vollständig bewahrt.
- source_word: אֶל הַכַּשְׂדִּים אַתָּה נֹפֵל
  choice: Du willst zu den Chaldäern überlaufen!
  rationale: נפל אֶל ist hier eine militärisch-politische Wendung für den Übergang zur Gegenseite. Die präsentische Verlaufsform lässt sich im Deutschen idiomatisch als vorgeworfene Absicht wiedergeben.
theological_decisions:
- issue: Charakter der Anschuldigung gegen Jeremia
  choice: Als direkte Anschuldigung einer beabsichtigten Fahnenflucht wiedergegeben
  alternative: »Du läufst zu den Chaldäern über!«
  rationale: Der Kontext zeigt, dass Jirija Jeremias Bewegung als Überlaufen deutet. »Du willst …« gibt die unmittelbar unterstellte Absicht natürlich wieder, ohne die Anschuldigung als erwiesene Tatsache darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der seltene Amtstitel wird funktional, aber rangneutral mit »Wachhabender« wiedergegeben. Die Rede bleibt knapp und anklagend; »Chaldäer« bewahrt die ethnisch-politische Bezeichnung des Ausgangstextes.
