  text: וְ/שָׁ֨בוּ֙ הַ/כַּשְׂדִּ֔ים וְ/נִלְחֲמ֖וּ עַל הָ/עִ֣יר הַ/זֹּ֑את וּ/לְכָדֻ֖/הָ וּ/שְׂרָפֻ֥/הָ בָ/אֵֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/008.yaml
  text: Then the Chaldeans will return and fight against this city[a], and they will capture it and burn it with fire.
translation:
  language: de
  text: Dann werden die Chaldäer[a] zurückkehren und gegen diese Stadt kämpfen. Sie werden sie einnehmen und mit Feuer niederbrennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“. Im Hebräischen steht „Chaldäer“, die historische Bezeichnung, die in diesem Zusammenhang verwendet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: Dann werden … zurückkehren
  rationale: שׁוּב bedeutet hier „zurückkehren“. „Dann“ gibt die Abfolge im prophetischen Zusammenhang natürlich wieder, ohne zusätzlichen Inhalt einzutragen.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die Wiedergabe bewahrt die ethnisch-politische Bezeichnung des Hebräischen; „Babylonier“ ist die verständliche historische Entsprechung und wird in der Fußnote genannt.
- source_word: וְנִלְחֲמוּ עַל
  choice: und gegen … kämpfen
  rationale: נלחם mit עַל bezeichnet hier den militärischen Kampf gegen die Stadt.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Das proximale Demonstrativpronomen זֹאת wird direkt und idiomatisch mit „diese“ wiedergegeben.
- source_word: וּלְכָדֻהָ
  choice: Sie werden sie einnehmen
  rationale: לכד bezeichnet im Zusammenhang mit einer Stadt deren militärische Einnahme; „einnehmen“ ist im Deutschen genauer und natürlicher als „gefangen nehmen“.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: und niederbrennen
  rationale: Die hebräische Verbindung bedeutet wörtlich, die Stadt „mit Feuer zu verbrennen“. Bei einer Stadt gibt „niederbrennen“ den Sinn klar und idiomatisch wieder, ohne die Aussage abzuschwächen.
theological_decisions: []
