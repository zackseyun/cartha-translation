source:
  edition: WLC
  text: וְ/חֵ֥יל פַּרְעֹ֖ה יָצָ֣א מִ/מִּצְרָ֑יִם וַ/יִּשְׁמְע֨וּ הַ/כַּשְׂדִּ֜ים הַ/צָּרִ֤ים עַל יְרוּשָׁלִַ֨ם֙ אֶת שִׁמְעָ֔/ם וַ/יֵּ֣עָל֔וּ מֵ/עַ֖ל יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/005.yaml
  text: Pharaoh’s army had come out from Egypt[a], and when the Chaldeans who were besieging Jerusalem heard the report about them[c][b], they withdrew from Jerusalem.
translation:
  language: de
  text: Das Heer des Pharaos war aus Ägypten ausgezogen. Als die Chaldäer[a], die Jerusalem belagerten, die Nachricht über sie hörten[b], zogen sie von Jerusalem ab[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Nachricht über sie“ beziehungsweise „ihre Nachricht“; gemeint ist die Kunde vom Heer des Pharaos.'
    reason: referential_ambiguity
  - marker: c
    text: 'Wörtlich etwa: „zogen sie von Jerusalem hinauf“; im Zusammenhang ist damit gemeint, dass sie die Belagerung abbrachen und abzogen.'
    reason: idiom
lexical_decisions:
- source_word: חֵיל פַּרְעֹה
  choice: das Heer des Pharaos
  rationale: חֵיל bezeichnet im militärischen Zusammenhang das Heer beziehungsweise die Streitmacht des Pharaos; „Heer“ ist präzise, geläufig und würdevoll.
- source_word: יָצָא מִמִּצְרָיִם
  choice: war aus Ägypten ausgezogen
  rationale: Das Qatal nennt die bereits eingetretene Handlung, auf die die anschließende Erzählfolge reagiert. Das Plusquamperfekt bildet dieses zeitliche Verhältnis im Deutschen natürlich ab.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: „Chaldäer“ gibt das hebräische Ethnonym direkt wieder; „Babylonier“ ist eine verständliche kontextuelle Alternative.
- source_word: הַצָּרִים עַל יְרוּשָׁלַם
  choice: die Jerusalem belagerten
  rationale: Das Partizip von צור bezeichnet hier die andauernde Belagerung der Stadt.
- source_word: אֶת שִׁמְעָם
  choice: die Nachricht über sie
  rationale: שֵׁמַע bedeutet „Nachricht, Kunde, Bericht“; das Suffix bezieht sich im Kontext auf das Heer des Pharaos. Das Pronomen wahrt die Form des Ausgangstextes und bleibt durch den Kontext verständlich.
- source_word: וַיֵּעָלוּ מֵעַל יְרוּשָׁלָם
  choice: zogen sie von Jerusalem ab
  rationale: Die wörtliche Bewegung „hinaufgehen von über/gegen Jerusalem“ bezeichnet im Belagerungskontext den militärischen Abzug. „Abziehen“ ist im Deutschen idiomatisch, ohne ausdrücklich mehr als den Text zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der eröffnende hebräische Anschluss וְ wird nicht mit einem eigenständigen „Nun“ überladen; die Satzfolge trägt den narrativen Zusammenhang. Die langen hebräischen Koordinationen werden zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
