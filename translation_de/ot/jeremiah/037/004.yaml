  text: וְ/יִרְמְיָ֕הוּ בָּ֥א וְ/יֹצֵ֖א בְּ/ת֣וֹךְ הָ/עָ֑ם וְ/לֹֽא נָתְנ֥וּ אֹת֖/וֹ בֵּ֥ית ה/כליא־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/004.yaml
  text: Jeremiah was coming and going among the people[a], for they had not yet put him in the prison house.
translation:
  language: de
  text: Jeremia ging unter dem Volk ein und aus, denn man hatte ihn nicht ins Gefängnis[a] gebracht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in das Haus der Verwahrung“ beziehungsweise „in das Haftgebäude“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא וְיֹצֵא
  choice: ging … ein und aus
  rationale: Die verbale Paarform bezeichnet fortgesetztes Kommen und Gehen beziehungsweise ungehinderte Bewegung. Die deutsche Wendung bewahrt das hebräische Bild und passt zu einer Hintergrundbeschreibung.
- source_word: בְּתוֹךְ הָעָם
  choice: unter dem Volk
  rationale: בְּתוֹךְ bedeutet hier „inmitten von/unter“. „Unter dem Volk“ gibt Jeremias Bewegung innerhalb der Bevölkerung knapp und natürlich wieder.
- source_word: וְלֹא נָתְנוּ אֹתוֹ
  choice: denn man hatte ihn noch nicht … gebracht
  rationale: 'Das vorangestellte ו kann hier den erklärenden Zusammenhang ausdrücken: Jeremia konnte sich unter dem Volk bewegen, weil seine Inhaftierung noch nicht erfolgt war. Das unbestimmte „man“ entspricht dem nicht näher bezeichneten Subjekt der dritten Person Plural. „Noch“ macht den aus dem Erzählzusammenhang hervorgehenden zeitlichen Gegensatz deutlich.'
- source_word: בֵּית הַכְּלִיא
  choice: ins Gefängnis
  rationale: Die wörtliche Verbindung lautet „Haus der Verwahrung/Haft“. „Gefängnis“ ist dafür die natürliche moderne deutsche Bezeichnung; die konkrete hebräische Ausdrucksweise wird in der Fußnote genannt.
- source_word: וְיִרְמְיָהוּ
  choice: Jeremia
  rationale: Das anknüpfende ו führt die Erzählung weiter, verlangt im Deutschen hier aber kein eigenes einleitendes Wort.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräische Paarform wird mit der geläufigen Wendung „ein und aus gehen“ erhalten; eine zusätzliche ausdrückliche Aussage wie „frei“ wird vermieden, da sie nur aus dem Zusammenhang erschlossen wäre.
