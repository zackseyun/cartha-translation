source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יִרְמְיָ֨הוּ֙ מִ/יר֣וּשָׁלִַ֔ם לָ/לֶ֖כֶת אֶ֣רֶץ בִּנְיָמִ֑ן לַ/חֲלִ֥ק מִ/שָּׁ֖ם בְּ/ת֥וֹךְ הָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/012.yaml
  text: Jeremiah went out from Jerusalem to go to the land of Benjamin[a], to receive his portion there among the people.
translation:
  language: de
  text: Jeremia verließ Jerusalem, um in das Gebiet Benjamins zu gehen und sich von dort mitten unter dem Volk seinen Anteil zu holen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um sich von dort mitten unter dem Volk einen Anteil zu beanspruchen.“ Der hebräische Ausdruck לַחֲלִק ist schwierig. Er kann sich darauf beziehen, einen zugeteilten Anteil zu erhalten, Besitz aufzuteilen oder einen Anteil zu beanspruchen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: verließ
  rationale: יצא bezeichnet das Hinausgehen beziehungsweise Weggehen. Im Deutschen gibt „verließ Jerusalem“ die Bewegung aus der Stadt natürlich und ohne zusätzliche Deutung wieder.
- source_word: מִירוּשָׁלִַם
  choice: Jerusalem
  rationale: Die mit מִן bezeichnete Bewegung weg von Jerusalem ist bereits idiomatisch im Verb „verließ“ enthalten.
- source_word: לָלֶכֶת
  choice: um … zu gehen
  rationale: Der Infinitiv von הלך drückt hier den Zweck aus; die deutsche Konstruktion „um … zu gehen“ bewahrt diese Funktion.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: ins Gebiet Benjamin
  rationale: אֶרֶץ bezeichnet hier das Stammes- beziehungsweise Siedlungsgebiet Benjamins. „Gebiet Benjamin“ ist im modernen Deutschen natürlicher als „Land Benjamin“, ohne den regionalen Sinn einzuengen.
- source_word: לַחֲלִק
  choice: seinen Anteil in Empfang zu nehmen
  rationale: Die seltene und schwierige Form wird im Kontext wahrscheinlich auf das Erlangen eines Anteils oder Besitzteils bezogen. Die Formulierung wahrt diesen wahrscheinlichen Sinn, während die Fußnote andere Deutungen offenhält.
- source_word: מִשָּׁם
  choice: dort
  rationale: Das Ortsadverb verweist auf das Gebiet Benjamin. Im natürlichen Deutschen gibt „dort“ den lokalen Bezug wieder, ohne ein unidiomatisches „von dort“ zu erzwingen.
- source_word: בְּתוֹךְ הָעָם
  choice: mitten unter dem Volk
  rationale: Die Wendung bedeutet wörtlich „inmitten des Volkes“. „Mitten unter dem Volk“ bewahrt den Nachdruck von בְּתוֹךְ; eine militärische Präzisierung zu „Truppen“ wäre durch עָם allein nicht hinreichend gesichert.
