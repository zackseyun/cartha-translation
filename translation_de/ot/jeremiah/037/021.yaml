  text: וַ/יְצַוֶּ֞ה הַ/מֶּ֣לֶךְ צִדְקִיָּ֗הוּ וַ/יַּפְקִ֣דוּ אֶֽת יִרְמְיָהוּ֮ בַּ/חֲצַ֣ר הַ/מַּטָּרָה֒ וְ/נָתֹן֩ ל֨/וֹ כִכַּר לֶ֤חֶם לַ/יּוֹם֙ מִ/ח֣וּץ הָ/אֹפִ֔ים עַד תֹּ֥ם כָּל הַ/לֶּ֖חֶם מִן הָ/עִ֑יר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/037/021.yaml
  text: So King Zedekiah gave orders[a], and they committed Jeremiah to the court of the guard, and gave him a loaf of bread daily from the bakers’ street, until all the bread from the city was gone. So Jeremiah remained in the court of the guard.
translation:
  language: de
  text: Da gab König Zedekia den Befehl, und man brachte Jeremia in den Wachhof und gab ihm täglich einen Laib Brot aus der Bäckerstraße[a], bis in der Stadt kein Brot mehr vorhanden war. So blieb Jeremia im Wachhof.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „vom Außenbereich/der Straße der Bäcker“; wahrscheinlich ist eine Straße oder ein Viertel gemeint, in dem Bäcker arbeiteten und Brot verkauften.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: gab ... den Befehl
  rationale: צוה bezeichnet das Erteilen eines Befehls; die Wendung ist im Deutschen natürlich und entspricht dem königlichen Kontext.
- source_word: וַיַּפְקִדוּ
  choice: man brachte
  rationale: פקד bezeichnet hier die amtliche Unterbringung Jeremias in Gewahrsam. „Man brachte ... in“ gibt den Vorgang verständlich wieder, ohne den Wachhof als Gefängnisgebäude zu überdeuten.
- source_word: חֲצַר הַמַּטָּרָה
  choice: Wachhof
  rationale: Die feste Wendung bezeichnet in Jeremia einen bewachten Hof, der auch zur Verwahrung von Gefangenen diente. „Wachhof“ ist knapp und institutionell, ohne daraus ein eigenständiges Gefängnis zu machen.
- source_word: וְנָתוֹן לוֹ
  choice: Dort gab man ihm
  rationale: Die auffällige Infinitivform führt den Inhalt beziehungsweise die Ausführung des Befehls fort. Eine finite deutsche Form gibt diesen Zusammenhang natürlich wieder.
- source_word: כִכַּר לֶחֶם
  choice: einen Laib Brot
  rationale: ככר bezeichnet hier einen runden Brotlaib beziehungsweise Brotkuchen; „einen Laib Brot“ ist die geläufige moderne Entsprechung.
- source_word: לַיּוֹם
  choice: täglich
  rationale: Die Formulierung bezeichnet eine regelmäßige Tagesration.
- source_word: מִחוּץ הָאֹפִים
  choice: aus der Bäckergasse
  rationale: Wörtlich steht etwa „vom Außenbereich/der Straße der Bäcker“. Gemeint ist wahrscheinlich eine Straße oder ein Viertel, in dem Bäcker arbeiteten und Brot verkauften; „Bäckergasse“ bewahrt den städtischen Ortsbezug.
- source_word: עַד תֹּם כָּל הַלֶּחֶם מִן הָעִיר
  choice: bis in der Stadt kein Brot mehr vorhanden war
  rationale: Die Wendung beschreibt die vollständige Erschöpfung des städtischen Brotvorrats. Die deutsche Formulierung ist klar und bewahrt den Umfang „alles Brot“ sinngemäß.
- source_word: וַיֵּשֶׁב
  choice: blieb
  rationale: ישב bedeutet hier im Zusammenhang des Gewahrsams „bleiben/sich aufhalten“, nicht notwendig „sitzen“.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch etablierte Namensform.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch etablierte Namensform.
