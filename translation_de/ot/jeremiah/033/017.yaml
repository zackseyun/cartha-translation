  text: כִּי כֹ֖ה אָמַ֣ר יְהוָ֑ה לֹֽא יִכָּרֵ֣ת לְ/דָוִ֔ד אִ֕ישׁ יֹשֵׁ֖ב עַל כִּסֵּ֥א בֵֽית יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
translation:
  language: de
  text: 'Denn so spricht Jahwe: David wird nie ein Mann fehlen, der auf dem Thron des Hauses Israel sitzt[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn so spricht Jahwe: Für David wird kein Mann abgeschnitten werden, der auf dem Thron des Hauses Israel sitzt.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder kürzer: „auf dem Thron Israels“. Im Hebräischen steht „des Hauses Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert die vorausgehende Verheißung; „Denn“ gibt diese Verbindung im Deutschen natürlich wieder.
- source_word: כֹה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: לֹא יִכָּרֵת לְדָוִד
  choice: David wird es nie … fehlen
  rationale: Das Nifal von כרת bedeutet wörtlich „abgeschnitten werden“, bildet hier mit dem Dativ und אִישׁ jedoch eine idiomatische Wendung dafür, dass David nicht ohne einen königlichen Vertreter sein wird. „Nie fehlen“ vermittelt diesen Sinn, ohne den Mann ausdrücklich als Nachkommen zu deuten.
- source_word: אִישׁ
  choice: an einem Mann
  rationale: Bewahrt den maskulinen Singular des Hebräischen. „Nachkomme“ wäre im dynastischen Zusammenhang naheliegend, aber lexikalisch enger und stärker auslegend.
- source_word: יֹשֵׁב
  choice: der … sitzt
  rationale: Das Partizip bezeichnet die fortdauernde königliche Funktion des Mannes; ein deutscher Relativsatz gibt dies klar und nah am Wortlaut wieder.
- source_word: עַל כִּסֵּא
  choice: auf dem Thron
  rationale: Der bestimmte königliche Thron ist gemeint; „auf dem Thron sitzen“ ist zugleich eine natürliche deutsche Herrschaftsformel.
- source_word: בֵית יִשְׂרָאֵל
  choice: des Hauses Israel
  rationale: Bewahrt die wörtliche, bundestheologisch geprägte Bezeichnung des Volkes, statt sie stillschweigend zu „Israel“ zu verkürzen.
theological_decisions:
- issue: Die dynastische Verheißung an David
  choice: Die Formulierung verheißt David fortdauernde königliche Vertretung, ohne hier festzulegen, wie diese historisch oder messianisch verwirklicht wird.
  alternative: Den Vers entweder ausschließlich als unmittelbare historische Thronfolge oder ausschließlich als Vorhersage eines einzigen endzeitlichen davidischen Königs formulieren.
  rationale: Der hebräische Text spricht von einem Mann, der für David auf Israels Thron sitzt. Die Übersetzung bewahrt diese dynastische Aussage und lässt ihre historische und messianische Tragweite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel „so spricht Jahwe“ bleibt bewusst feierlich; die Hauptaussage wird idiomatisch formuliert, während die erste Fußnote die ungewöhnliche hebräische Bildsprache dokumentiert.
