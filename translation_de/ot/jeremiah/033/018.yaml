  text: וְ/לַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם לֹֽא יִכָּרֵ֥ת אִ֖ישׁ מִ/לְּ/פָנָ֑/י מַעֲלֶ֨ה עוֹלָ֜ה וּ/מַקְטִ֥יר מִנְחָ֛ה וְ/עֹ֥שֶׂה זֶּ֖בַח כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And the Levitical priests will never lack a man before me to offer burnt offerings, burn grain offerings, and make sacrifices continually[a].
translation:
  language: de
  text: Auch den levitischen Priestern wird es nie an einem Mann fehlen, der vor mir allezeit Brandopfer darbringt, Speiseopfer in Rauch aufsteigen lässt und Schlachtopfer darbringt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse Jeremia 33,14–26 fehlen in der altgriechischen Fassung des Jeremiabuches.
    reason: textual_variant
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  choice: Und den levitischen Priestern
  rationale: Der vorangestellte Dativ gibt die Gruppe wieder, der die Verheißung gilt; „levitische Priester“ ist im Deutschen natürlich und bewahrt die hebräische Zuordnung.
- source_word: לֹא יִכָּרֵת אִישׁ
  choice: wird es … nie an einem Mann fehlen
  rationale: Die Wendung bezeichnet hier, dass die Priesterschaft niemals ohne einen dienenden Vertreter sein wird; sie behauptet nicht die Unsterblichkeit eines einzelnen Mannes.
- source_word: מִלְּפָנָי
  choice: vor mir
  rationale: Die Formulierung bezeichnet den Priesterdienst in Gottes Gegenwart.
- source_word: מַעֲלֶה עוֹלָה
  choice: der Brandopfer darbringt
  rationale: Der Relativsatz bildet die beschreibende Funktion des Partizips ab; der Plural ist im Deutschen für den fortdauernden Opferdienst idiomatisch.
- source_word: וּמַקְטִיר מִנְחָה
  choice: Speiseopfer in Rauch aufgehen lässt
  rationale: 'Die Wendung bewahrt die konkrete Bedeutung des Hifil-Partizips: Das Speiseopfer beziehungsweise sein Opferanteil wird auf dem Altar in Rauch aufgehen gelassen.'
- source_word: וְעֹשֶׂה זֶּבַח
  choice: und … Schlachtopfer darbringt
  rationale: „Schlachtopfer“ unterscheidet זֶבַח vom zuvor genannten Brand- und Speiseopfer; „darbringen“ ist natürliches gegenwärtiges Deutsch.
- source_word: כָּל הַיָּמִים
  choice: allezeit
  rationale: Das gehobene, aber verständliche Wort gibt die ununterbrochene Dauer der Verheißung knapp wieder.
theological_decisions:
- issue: Ob לא יכרת איש wörtlich als „kein Mann wird abgeschnitten“ oder idiomatisch als fortdauernde Besetzung des Priesterdienstes wiederzugeben ist
  choice: wird es nie an einem Mann fehlen
  alternative: ein Mann wird nicht abgeschnitten werden
  rationale: Im Parallelismus der Verheißung geht es um die ununterbrochene Fortdauer einer Linie und ihres Dienstes. Die idiomatische Wiedergabe bewahrt diese Aussage, ohne fälschlich die Bewahrung eines bestimmten Individuums nahezulegen.
- issue: Bestimmung von הַכֹּהֲנִים הַלְוִיִּם
  choice: die levitischen Priester
  alternative: die Priester, die Leviten
  rationale: Die kompakte Formulierung bewahrt die Identifikation der Priester als levitisch, ohne eine weitergehende historische oder konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Allezeit“ trägt den feierlichen Verheißungscharakter, bleibt aber allgemein verständlich. Die Opferbegriffe werden sachlich unterschieden; der Satzbau bleibt flüssig und bildet die hebräischen Partizipien durch einen Relativsatz ab.
