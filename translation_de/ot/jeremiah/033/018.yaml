  source_fidelity: Die Grundentscheidung, לֹא יִכָּרֵת אִישׁ idiomatisch als fortdauernde Verfügbarkeit eines priesterlichen Diensttuenden wiederzugeben, trifft den Kontext. Die Partizipien werden zutreffend durch einen Relativsatz abgebildet. Eine Umstellung macht jedoch deutlich, dass „vor mir“ den priesterlichen Dienst bezeichnet, und stellt „allezeit“ eindeutig unter die gesamte Opferreihe.
  naturalness: „Und den levitischen Priestern wird es vor mir nie an einem Mann fehlen“ ist verständlich, aber die Stellung von „vor mir“ wirkt im Deutschen, als modifiziere sie unmittelbar „fehlen“. Die revidierte Satzstellung ist modernes, würdiges Standarddeutsch. „in Rauch aufsteigen lässt“ ist für das kultische Räuchern natürlicher als „in Rauch aufgehen lässt“.
  terminology: „levitische Priester“, „Brandopfer“, „Speiseopfer“ und „Schlachtopfer“ unterscheiden die hebräischen Opferbegriffe sachgerecht. Die Fußnote sollte fachsprachlich von der „altgriechischen Fassung“ sprechen.
