revisions:
- from: Und den levitischen Priestern wird es vor mir nie an einem Mann fehlen, der Brandopfer darbringt, Speiseopfer in Rauch aufgehen lässt und allezeit Schlachtopfer darbringt.[a]
  to: Auch den levitischen Priestern wird es nie an einem Mann fehlen, der vor mir allezeit Brandopfer darbringt, Speiseopfer in Rauch aufsteigen lässt und Schlachtopfer darbringt.[a]
  rationale: Die Revision ändert die Aussage nicht, sondern ordnet die Satzglieder so, dass die hebräische Beziehung von „vor mir“ zum priesterlichen Opferdienst und die zeitliche Geltung für alle drei Tätigkeiten im Deutschen eindeutig und flüssig hervortreten. Die Opferterminologie bleibt differenziert; die textkritische Anmerkung wird fachsprachlich präzisiert.
