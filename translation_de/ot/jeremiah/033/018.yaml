    rationale: Am Satzende kann „allezeit“ im Deutschen vor allem auf das unmittelbar vorausgehende Darbringen von Schlachtopfern bezogen werden; vorangestellt im Relativsatz umfasst es klar die gesamte Reihe.
  - severity: low
