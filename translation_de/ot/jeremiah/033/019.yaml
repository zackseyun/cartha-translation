  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/019.yaml
  text: And the word of Yahweh came to Jeremiah, saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an Jeremia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form von היה leitet hier die nächste Mitteilung ein. Im Deutschen wird sie natürlich mit der festen Wendung „das Wort … erging“ wiedergegeben.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Formel דְּבַר יְהוָה bewahrt „Wort“ den wiederkehrenden Offenbarungscharakter deutlicher als „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form.
- source_word: אֶל
  choice: an
  rationale: Bei der idiomatischen deutschen Wendung „das Wort erging“ bezeichnet „an“ den Empfänger.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: „Jeremia“ ist die etablierte deutsche Namensform.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet die folgende direkte Rede ein. Ein Doppelpunkt erfüllt diese Funktion im heutigen Deutsch natürlicher als das wörtliche „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und nicht den Titel אֲדֹנָי. Die Wiedergabe als „Jahwe“ erhält diesen Unterschied.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel bleibt mit „das Wort Jahwes erging an“ erkennbar; der Doppelpunkt kündigt knapp und idiomatisch die direkte Rede des Folgeverses an.
