  text: קְרָ֥א אֵלַ֖/י וְ/אֶעֱנֶ֑/ךָּ וְ/אַגִּ֧ידָה לְּ/ךָ֛ גְּדֹל֥וֹת וּ/בְצֻר֖וֹת לֹ֥א יְדַעְתָּֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/003.yaml
  text: Call to me[a], and I will answer you, and I will tell you great and hidden things that you have not known.
translation:
  language: de
  text: Rufe zu mir, und ich werde dir antworten und dir Großes und Unzugängliches[a] mitteilen, das du nicht gekannt hast.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Verborgenes; auch: Befestigtes. Das hebräische Wort bezeichnet etwas, das dem gewöhnlichen Zugang entzogen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  choice: Rufe zu mir
  rationale: Der Qal-Imperativ richtet eine unmittelbare Aufforderung an den Angesprochenen, sich an Gott zu wenden. „Rufe zu mir“ ist natürlich, direkt und bewahrt die Zielrichtung der Präposition.
- source_word: וְאֶעֱנֶךָ
  choice: dann werde ich dir antworten
  rationale: ענה bezeichnet hier Gottes Antwort. Das deutsche „dann“ gibt den Zusammenhang von Aufforderung und zugesagter Reaktion natürlicher wieder, ohne einen ursächlichen Anspruch über den hebräischen Satz hinaus zu formulieren.
- source_word: וְאַגִּידָה לְּךָ
  choice: und dir … mitteilen
  rationale: Das Hiphil von נגד bedeutet „mitteilen“, „verkünden“ oder „bekannt machen“. „Mitteilen“ wahrt den persönlichen und offenbarenden Charakter der Zusage in aktuellem Deutsch.
- source_word: גְּדֹלוֹת
  choice: Großes
  rationale: Das substantivisch gebrauchte feminine Pluraladjektiv bezeichnet große Dinge oder Angelegenheiten. Das substantivierte deutsche „Großes“ erhält die offene Bedeutungsweite.
- source_word: וּבְצֻרוֹת
  choice: und Unzugängliches
  rationale: Das Wort kann Dinge bezeichnen, die abgeschnitten, unzugänglich oder befestigt sind. „Unzugängliches“ bewahrt diesen Bildbereich und passt zur Offenbarung dessen, was menschlicher Erkenntnis nicht ohne Weiteres zugänglich ist.
- source_word: לֹא יְדַעְתָּם
  choice: das du bisher nicht gekannt hast
  rationale: Die Perfektform bezeichnet das bis zu diesem Zeitpunkt nicht Erkannte. „Bisher“ verdeutlicht im Deutschen die zeitliche Relevanz, die durch die anschließende Offenbarung entsteht; der Singular „das“ nimmt die verbundene substantivische Wendung „Großes und Unzugängliches“ auf.
theological_decisions:
- issue: Bedeutungsumfang von וּבְצֻרוֹת im Zusammenhang göttlicher Offenbarung
  choice: Unzugängliches
  alternative: Verborgenes; Befestigtes
  rationale: Die Übersetzung soll weder bloße Geheimniskrämerei noch eine bestimmte Lehre über Sonderoffenbarung hineinlesen. „Unzugängliches“ erhält die Grundvorstellung von etwas, das dem gewöhnlichen Zugriff entzogen ist; die Fußnote nennt die bildhafteren Alternativen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter persönlicher Anrede. Die Satzfügung bleibt knapp und zusageorientiert; substantivierte Adjektive bewahren die offene Weite des hebräischen Ausdrucks.
