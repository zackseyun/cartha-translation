id: JER.33.14
reference: Jeremiah 33:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
translation:
  language: de
  text: Siehe, es kommen Tage – Ausspruch Jahwes –, da werde ich das gute Wort[a] erfüllen, das ich über das Haus Israel und das Haus Juda gesprochen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die gute Zusage. Wörtlich: das gute Wort.'
    reason: 'Lexikalische Alternative: דָּבָר bedeutet „Wort“, bezeichnet hier im Zusammenhang aber ein von Gott zugesagtes künftiges Handeln.'
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Die Aufmerksamkeitspartikel eröffnet eine gewichtige prophetische Ankündigung. „Siehe“ bewahrt ihre hinweisende und aufmerksamkeitslenkende Funktion in knapper, würdiger Form.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Die geläufige prophetische Zukunftsformel wird nah am Hebräischen und zugleich idiomatisch deutsch wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ bildet die substantivische prophetische Formel ab; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: וַהֲקִמֹתִי
  choice: werde ich … erfüllen
  rationale: Das Hifil von קום bezeichnet hier, dass Gott sein gesprochenes Wort Bestand gewinnen beziehungsweise Wirklichkeit werden lässt. Im Deutschen gibt „erfüllen“ diese kontextuelle Bedeutung knapp wieder.
- source_word: הַדָּבָר הַטּוֹב
  choice: das gute Wort
  rationale: Die wörtliche Bedeutung von דָּבָר und die sprachliche Verbindung zum folgenden „gesprochen habe“ bleiben erhalten; der Verheißungscharakter wird nicht stillschweigend in den Haupttext eingetragen.
- source_word: דִּבַּרְתִּי
  choice: gesprochen habe
  rationale: Die einfache Bedeutung „sprechen“ wird bewahrt, statt interpretierend „verheißen“ oder „zugesagt“ einzusetzen.
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  choice: über das Haus Israel und das Haus Juda
  rationale: Die Formulierung bezeichnet beide Häuser als Gegenstand des göttlichen Wortes. Die im Hebräischen wechselnden Präpositionen אֶל und עַל werden in natürlichem Deutsch zusammenfassend mit „über“ wiedergegeben, ohne eines der beiden Häuser auszublenden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von הַדָּבָר הַטּוֹב
  choice: das gute Wort
  alternative: die gute Zusage / die gute Verheißung
  rationale: „Wort“ wahrt den hebräischen Ausdruck und seinen Bezug zu „gesprochen habe“. Dass es sich inhaltlich um eine Zusage handelt, wird als mögliche Verdeutlichung in der Fußnote genannt, nicht im Haupttext festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusster Nähe zur prophetischen Ausdrucksweise. Der Gedankenstrich hebt die feste Botenformel ab; „Haus Israel“ und „Haus Juda“ bewahren die national-dynastische Bildsprache des Hebräischen.
