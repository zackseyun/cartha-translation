  - severity: low
    issue: Fußnote c nennt die Gegen-Wiedergabe nur als Alternative, obwohl die Hauptfassung „wegen“ gegenüber אֶל stärker interpretierend ist.
    rationale: Nach der Anpassung der Hauptfassung kann die Fußnote auf die Erklärung der Metonymie „Schwert“ beschränkt bleiben; dadurch wird keine unnötige, konkurrierende syntaktische Deutung hervorgehoben.
