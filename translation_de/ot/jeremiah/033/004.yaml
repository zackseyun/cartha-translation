revisions:
- from: 'Denn so spricht Jahwe, der Gott Israels, über die Häuser dieser Stadt und die Häuser der Könige von Juda[a], die wegen der Belagerungsrampen[b] und wegen des Schwertes[c] niedergerissen werden:'
  to: 'Denn so spricht Jahwe, der Gott Israels, über die Häuser dieser Stadt und die Häuser der Könige von Juda[a], die gegen die Belagerungsrampen[b] und gegen das Schwert[c] niedergerissen werden:'
  rationale: Die Änderung von „wegen“ zu „gegen“ vermeidet eine nicht vom hebräischen אֶל geforderte kausale Festlegung. Sie erhält die schwierige, in ihrer genauen militärischen Beziehung diskutierte Formulierung, ohne eine konkrete Absicht wie die Gewinnung von Baumaterial oder die Herstellung einer Verteidigungsstellung einzutragen. Die Fußnote zum Schwert wird entsprechend auf die Metonymie beschränkt.
