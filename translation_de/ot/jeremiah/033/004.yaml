  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
translation:
  language: de
  text: 'Denn so spricht Jahwe, der Gott Israels, über die Häuser dieser Stadt und die Häuser der Könige von Juda[a], die gegen die Belagerungsrampen[b] und gegen das Schwert[c] niedergerissen werden:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Paläste der Könige von Juda“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Belagerungswälle“ oder „Belagerungsanlagen“.'
    reason: lexical_alternative
  - marker: c
    text: „Das Schwert“ steht hier bildlich für Krieg oder Töten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zum vorausgehenden Zusammenhang ein und bewahrt die kausale Diskursfunktion.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Die geläufige deutsche Wiedergabe der prophetischen Botenformel ist würdig, natürlich und formnah.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen im Deutschen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung lässt sich im Deutschen klar und unmittelbar so wiedergeben.
- source_word: עַל
  choice: über
  rationale: Kennzeichnet hier den Gegenstand der folgenden Aussage; „über“ ist im Deutschen natürlich und lässt die Möglichkeit einer Aussage bezüglich dieser Gebäude offen.
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  choice: die Häuser dieser Stadt
  rationale: Bewahrt die hebräische Genitivstruktur und verweist im Kontext auf Jerusalem.
- source_word: בָּתֵּי מַלְכֵי יְהוּדָה
  choice: die Häuser der Könige von Juda
  rationale: Bewahrt die Wiederholung von בָּתֵּי; im königlichen Kontext ist auch „Paläste“ möglich und wird in der Fußnote genannt.
- source_word: הַנְּתֻצִים
  choice: die … niedergerissen werden
  rationale: Das passive Partizip beschreibt die Häuser als von einem Abbruch betroffen; die deutsche Verlaufsform gibt die im Kontext naheliegende laufende Maßnahme idiomatisch wieder.
- source_word: אֶל
  choice: wegen
  rationale: Die genaue Beziehung zu Belagerungsrampen und Schwert ist syntaktisch schwierig. „Wegen“ bewahrt den ursächlichen Zusammenhang, ohne die nicht ausdrücklich genannte Verwendung als Baumaterial festzuschreiben.
- source_word: הַסֹּלְלוֹת
  choice: die Belagerungsrampen
  rationale: Bezeichnet aufgeschüttete Anlagen beziehungsweise Rampen bei einer Belagerung; diese konkrete Wiedergabe ist modern verständlich.
- source_word: הֶחָרֶב
  choice: das Schwert
  rationale: Bewahrt die hebräische Metonymie für Krieg, Kampf oder Töten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als Namen; die im Deutschen verbreitete Form ist gegenüber dem englischen „Yahweh“ orthografisch angepasst.
- issue: Beziehung der niedergerissenen Häuser zu Belagerungsrampen und Schwert
  choice: wegen der Belagerungsrampen und wegen des Schwertes
  alternative: gegen die Belagerungsrampen und gegen das Schwert
  rationale: Die Präposition אֶל ist an dieser Stelle mehrdeutig, und auch die antike Überlieferung deutet die Konstruktion unterschiedlich. Die Hauptfassung vermeidet die spekulative Ergänzung, die Häuser würden eigens als Material oder zur Schaffung von Raum abgebrochen, und erhält die Spannung des Textes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel „Denn so spricht Jahwe“ erhält den feierlichen Ton. Die Satzstruktur bleibt wegen des anschließenden Gotteswortes mit einem Doppelpunkt offen. Sämtliche Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
