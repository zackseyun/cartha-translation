source:
  edition: WLC
  text: ק֣וֹל שָׂשׂ֞וֹן וְ/ק֣וֹל שִׂמְחָ֗ה ק֣וֹל חָתָן֮ וְ/ק֣וֹל כַּלָּה֒ ק֣וֹל אֹמְרִ֡ים הוֹדוּ֩ אֶת יְהוָ֨ה צְבָא֜וֹת כִּֽי ט֤וֹב יְהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ מְבִאִ֥ים תּוֹדָ֖ה בֵּ֣ית יְהוָ֑ה כִּֽי אָשִׁ֧יב אֶת שְׁבוּת הָ/אָ֛רֶץ כְּ/בָ/רִאשֹׁנָ֖ה אָמַ֥ר יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
translation:
  language: de
  text: 'der Klang des Jubels und der Klang der Freude, der Klang des Bräutigams und der Klang der Braut, der Klang derer, die sagen: »Dankt Jahwe der Heerscharen, denn Jahwe ist gut, denn seine unerschütterliche Liebe währt ewig«[a], und derer, die Dankopfer in das Haus Jahwes bringen. Denn ich werde das Geschick des Landes wiederherstellen wie am Anfang[b], spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »denn seine Güte währt ewig«, »denn seine Barmherzigkeit währt ewig« oder »denn seine Bundestreue währt ewig«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »die Gefangenschaft des Landes wenden« oder »die Gefangenen des Landes zurückbringen«. Die hebräische Wendung kann sowohl die Rückkehr von Gefangenen als auch allgemeiner die Wiederherstellung des früheren Wohlergehens bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: die Stimme
  rationale: Das Wort bezeichnet Stimme, Laut oder Klang. Bei Menschen und ihrem Sprechen passt »Stimme« gut und bewahrt zugleich die eindringliche Wiederholung des Hebräischen.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: Jubel und Freude
  rationale: Die beiden nah verwandten Begriffe werden unterschieden wiedergegeben; »Jubel« betont die hörbare, ausgelassene Freude, »Freude« den allgemeineren Zustand.
- source_word: חָתָן וְכַלָּה
  choice: Bräutigam und Braut
  rationale: Die traditionelle deutsche Paarformel entspricht dem feierlichen Hochzeitsbild des hebräischen Textes.
- source_word: הוֹדוּ
  choice: Dankt
  rationale: Im liturgischen Zusammenhang fordert die Hifil-Form von ידה zum Danken beziehungsweise lobenden Bekennen auf. »Dankt« hält zudem die Verbindung zum folgenden Dankopfer erkennbar.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: »Jahwe« gibt den Gottesnamen wieder; »der Heerscharen« bewahrt die Bildsprache des Titels statt sie deutend durch »der Allmächtige« zu ersetzen.
- source_word: לְעוֹלָם חַסְדּוֹ
  choice: seine beständige Liebe währt ewig
  rationale: חֶסֶד umfasst verlässliche Liebe, Güte, Erbarmen und Bundestreue. »Beständige Liebe« bringt Dauer und Beziehungstreue zum Ausdruck, ohne den Begriff ausschließlich auf eine einzelne Nuance festzulegen.
- source_word: תּוֹדָה
  choice: Dankopfer
  rationale: Da die תּוֹדָה in das Heiligtum gebracht wird, ist hier die kultische Bedeutung eines Dankopfers wahrscheinlicher als bloß gesprochener Dank.
- source_word: אָשִׁיב אֶת שְׁבוּת הָאָרֶץ
  choice: ich werde das Geschick des Landes wiederherstellen
  rationale: Die feste Wendung kann die Rückkehr aus Gefangenschaft bezeichnen, umfasst in diesem Zusammenhang aber wahrscheinlich die umfassende Wiederherstellung des Landes. Eine Fußnote bewahrt die engere Lesart.
- source_word: כְּבָרִאשֹׁנָה
  choice: wie am Anfang
  rationale: Die knappe Wiedergabe entspricht der Vergleichsform des Hebräischen und lässt offen, auf welchen früheren Zustand genau Bezug genommen wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt. Die Form »Jahwe« entspricht der geläufigen deutschen Schreibweise.
- issue: Bedeutungsumfang von חֶסֶד
  choice: beständige Liebe
  alternative: Güte; Barmherzigkeit; Bundestreue
  rationale: Die gewählte Formulierung wahrt sowohl den Beziehungscharakter als auch die Verlässlichkeit des Begriffs. Die Fußnote nennt weitere sachlich mögliche Nuancen.
- issue: Bedeutung der Wiederherstellungsformel mit שְׁבוּת
  choice: das Geschick des Landes wiederherstellen
  alternative: die Gefangenschaft des Landes wenden; die Gefangenen des Landes zurückbringen
  rationale: Der Kontext beschreibt eine umfassende Erneuerung mit Hochzeiten, Dank und Tempelgottesdienst. Die breitere idiomatische Wiedergabe passt dazu, während die mögliche Bezugnahme auf Gefangenschaft in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter poetischer Wiederholung. Die Partizipien אֹמְרִים und מְבִאִים werden parallel als »derer, die …« gefasst. Die direkte Rede ist typografisch klar markiert; kultische und theologische Begriffe werden verständlich, aber nicht konfessionell zugespitzt wiedergegeben.
