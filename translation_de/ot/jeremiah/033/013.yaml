source:
  edition: WLC
  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
translation:
  language: de
  text: In den Städten des Berglands, in den Städten der Schefela[a] und in den Städten des Negev[b], im Land Benjamin, in der Umgebung Jerusalems und in den Städten Judas werden die Herden wieder unter den Händen dessen vorüberziehen, der sie zählt[c], spricht Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schefela ist das westlich des judäischen Berglands gelegene Hügelland; auch: „Niederung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „der Süden“; der Negev ist die südliche Region Judas.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich heißt es im Hebräischen: „unter den Händen dessen, der zählt“. Gemeint ist das Bild eines Hirten, der die Tiere beim Vorüberziehen zählt.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  choice: in den Städten des Berglands
  rationale: הָהָר bezeichnet hier die judäische Berglandregion, nicht einen einzelnen Berg. „Städte“ bewahrt die wiederholte geografische Formel des Verses.
- source_word: הַשְּׁפֵלָה
  choice: die Schefela
  rationale: Der hebräische Ausdruck bezeichnet die judäische Hügelland- bzw. Niederungsregion als geografisches Gebiet. Der etablierte Gebietsname bewahrt diese Genauigkeit; eine Fußnote erläutert ihn.
- source_word: הַנֶּגֶב
  choice: der Negev
  rationale: Hier ist die südliche Landschaft Judas gemeint. Der gebräuchliche geografische Name ist genauer als das allgemeinere „Süden“.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: das Land Benjamin
  rationale: אֶרֶץ bezeichnet hier das dem Stamm Benjamin zugehörige Gebiet; die knappe Form folgt der hebräischen geografischen Bezeichnung.
- source_word: סְבִיבֵי יְרוּשָׁלִַם
  choice: die Umgebung Jerusalems
  rationale: Die Wendung bezeichnet die Gebiete rings um Jerusalem und wird in natürlichem Standarddeutsch wiedergegeben.
- source_word: עֹד
  choice: wieder
  rationale: Im Zusammenhang der Wiederherstellung bezeichnet עֹד die erneute Aufnahme einer zuvor unterbrochenen Tätigkeit.
- source_word: תַּעֲבֹרְנָה הַצֹּאן
  choice: die Herden werden hindurchziehen
  rationale: צֹאן ist eine Kollektivbezeichnung für Kleinvieh, besonders Schafe und Ziegen. Das feminine Pluralverb unterstützt hier die Wiedergabe mit „Herden“.
- source_word: עַל יְדֵי מוֹנֶה
  choice: unter der Hand dessen, der sie zählt
  rationale: Die Formulierung bewahrt das konkrete Bild eines Hirten, der die Tiere beim Vorüberziehen zählt. Der deutsche Singular „Hand“ gibt das Bild idiomatischer wieder; die hebräische Mehrzahl wird in der Fußnote vermerkt.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der im hebräischen Text stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiederherstellung im Bild des Zählens der Herden
  choice: Das konkrete Bild der unter der Hand des Zählenden hindurchziehenden Herden bleibt erhalten.
  alternative: Deutend wiedergeben, dass die Herden erneut sorgfältig gehütet oder gemustert werden.
  rationale: Der Text schildert die Wiederkehr normalen Hirtenlebens als Zeichen der Wiederherstellung. Eine konkrete Wiedergabe vermeidet es, die möglichen theologischen Untertöne ausdrücklich in den Wortlaut einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext verwendet den Tetragrammaton als persönlichen Gottesnamen. „Yahweh“ wahrt dessen Namenscharakter.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte geografische Satzstruktur des Hebräischen bleibt erkennbar, ohne unnötig schwerfällig zu wirken. Die regionalen Eigennamen „Schefela“ und „Negev“ werden durch knappe Fußnoten erschlossen; das konkrete Hirtenbild wird nicht interpretierend aufgelöst.
