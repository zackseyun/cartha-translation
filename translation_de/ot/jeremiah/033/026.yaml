base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
translation:
  language: de
  text: Dann würde ich auch die Nachkommenschaft Jakobs und meines Knechtes David[a] verwerfen und aus seinen Nachkommen keine Herrscher über die Nachkommenschaft Abrahams, Isaaks und Jakobs nehmen. Denn ich werde ihr Geschick wenden[b] und Erbarmen mit ihnen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „den Samen Jakobs und meines Knechtes David“. Das hebräische זֶרַע („Same“, „Nachkommenschaft“) ist ein kollektiver Singular.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „ihre Gefangenschaft wenden“ oder „ihre Verbannten zurückbringen“. Die hebräische Wendung kann sich besonders auf die Rückkehr aus dem Exil oder allgemeiner auf die Wiederherstellung ihrer Lage beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: dann ... auch
  rationale: Der Vers bildet den Folgesatz zu der im vorherigen Vers begonnenen Bedingung. „Dann … auch“ gibt sowohl den folgernden als auch den hinzufügenden Sinn wieder.
- source_word: זֶרַע יַעֲקוֹב וְדָוִד עַבְדִּי
  choice: die Nachkommenschaft Jakobs und meines Knechtes David
  rationale: זֶרַע ist ein kollektiver Singular. „Nachkommenschaft“ bewahrt diese Form und lässt die gemeinsame Zuordnung zu Jakob und David erkennen; „mein Knecht“ bleibt als Bundesbezeichnung Davids erhalten.
- source_word: אֶמְאַס
  choice: würde ich ... verwerfen
  rationale: Das Imperfekt setzt den irrealen Bedingungsgedanken des vorherigen Verses fort. Der deutsche Konjunktiv macht diese Abhängigkeit deutlich; „verwerfen“ passt zum Bundeskontext.
- source_word: מִקַּחַת מִזַּרְעוֹ מֹשְׁלִים
  choice: und aus seinen Nachkommen keine Herrscher ... nehmen
  rationale: Die Konstruktion bezeichnet die Folge beziehungsweise den Inhalt des Verwerfens. „Nehmen“ hält die konkrete Verbbedeutung fest, während „Herrscher“ das substantivierte Partizip wiedergibt.
- source_word: מִזַּרְעוֹ
  choice: aus seinen Nachkommen
  rationale: Das maskuline Singularsuffix bezieht sich am natürlichsten auf den unmittelbar genannten David, aus dessen Linie die Herrscher hervorgehen.
- source_word: אֶל זֶרַע אַבְרָהָם יִשְׂחָק וְיַעֲקֹב
  choice: über die Nachkommenschaft Abrahams, Isaaks und Jakobs
  rationale: אֶל bezeichnet bei משל den Herrschaftsbereich. „Über“ gibt dieses Verhältnis im Deutschen idiomatisch wieder.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung dafür ein, dass die angenommene Verwerfung nicht eintreten wird.
- source_word: אשוב אֶת שְׁבוּתָם
  choice: ich werde ihr Geschick wenden
  rationale: Die hebräische Wendung kann die Rückführung aus dem Exil oder umfassender die Wiederherstellung einer bedrängten Lage bezeichnen. Die traditionelle deutsche Wendung hält diesen Bedeutungsumfang offen.
- source_word: וְרִחַמְתִּים
  choice: und Erbarmen mit ihnen haben
  rationale: רחם bezeichnet barmherzige, zugewandte Anteilnahme. „Erbarmen haben“ ist würdig und im heutigen Standarddeutsch verständlich.
theological_decisions:
- issue: Bedingte Aussage aus dem vorherigen Vers
  choice: „würde ... verwerfen“ als irrealer Folgesatz
  alternative: „werde ... verwerfen“ als einfache Zukunftsaussage
  rationale: Vers 26 führt die Bedingung aus Vers 25 fort. Der Konjunktiv verhindert den falschen Eindruck, Gott kündige tatsächlich eine Verwerfung an.
- issue: Bezug von „seinen Nachkommen“
  choice: Das Suffix bezieht sich auf David.
  alternative: Das Suffix bezieht sich auf Jakob beziehungsweise kollektiv auf Israel.
  rationale: David ist der nächste maskuline Singularbezug, und Herrscher aus seiner Linie entsprechen dem davidischen Bundesmotiv des Zusammenhangs.
- issue: Bedeutungsumfang von שׁוב את־שבות
  choice: „ihr Geschick wenden“ mit offenem, umfassendem Sinn
  alternative: „ihre Gefangenschaft wenden“ oder „ihre Verbannten zurückbringen“
  rationale: Die Wendung kann konkrete Heimkehr aus dem Exil und eine umfassendere Wiederherstellung bezeichnen; die Hauptübersetzung legt sie nicht unnötig auf nur einen Aspekt fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Nachkommenschaft“ bewahrt den kollektiven Singular und den feierlichen Bundeskontext; „Geschick wenden“ erhält bewusst die Bedeutungsbreite der hebräischen Redewendung.
