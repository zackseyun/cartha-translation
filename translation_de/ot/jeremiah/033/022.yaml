  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
translation:
  language: de
  text: Wie das Heer des Himmels nicht gezählt und der Sand des Meeres nicht gemessen werden kann, so werde ich die Nachkommen meines Dieners David und die Leviten, die mir dienen, zahlreich machen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  choice: das Heer des Himmels
  rationale: Bewahrt die hebräische Wendung für die himmlische Schar, die in diesem Zusammenhang besonders die Sterne einschließt, ohne sie darauf zu verengen.
- source_word: לֹא יִסָּפֵר
  choice: nicht gezählt werden kann
  rationale: Gibt das passive יִסָּפֵר natürlich und sachlich wieder und entspricht dem Bild einer unzählbaren Menge.
- source_word: חוֹל הַיָּם
  choice: der Sand des Meeres
  rationale: Direkte, im Deutschen verständliche Wiedergabe der geläufigen hebräischen Wendung für eine unermessliche Menge.
- source_word: לֹא יִמַּד
  choice: nicht gemessen werden kann
  rationale: Bewahrt das zum Zählen parallele Bild des Messens.
- source_word: כֵּן אַרְבֶּה
  choice: so werde ich … zahlreich machen
  rationale: כֵּן führt den Vergleich fort; die kausative Form von רבה bezeichnet das Vielmachen beziehungsweise starke Vermehren. Die gewählte Formulierung ist im Deutschen natürlicher als ein transitives »vermehren« bei Personen.
- source_word: זֶרַע דָּוִד
  choice: die Nachkommen … David
  rationale: זֶרַע ist kollektiv und bezeichnet hier Davids Nachkommenschaft. »Nachkommen« ist modern und eindeutig, ohne das hebräische Bild durch das im Deutschen missverständliche »Same« wörtlich nachzubilden.
- source_word: עַבְדִּי
  choice: meines Dieners
  rationale: Im königlich-bundestheologischen Zusammenhang bezeichnet עֶבֶד David als den von JHWH eingesetzten Diener; »Diener« trifft diesen Sinn besser als »Sklave«.
- source_word: הַלְוִיִּם
  choice: die Leviten
  rationale: Übliche deutsche Bezeichnung für die Angehörigen des Stammes Levi.
- source_word: מְשָׁרְתֵי אֹתִי
  choice: die mir dienen
  rationale: Das Partizip bezeichnet ihren fortdauernden Dienst vor Gott, im Kontext besonders den kultischen Dienst. »Mir dienen« bleibt natürlich und bewahrt zugleich die mögliche Bedeutungsbreite.
theological_decisions:
- issue: Verhältnis der Nachkommen Davids zu den Leviten in der Verheißung
  choice: 'Beide Gruppen werden als koordinierte Objekte derselben Verheißung dargestellt: Gott wird sowohl Davids Nachkommen als auch die ihm dienenden Leviten zahlreich machen.'
  alternative: Die Leviten könnten enger ausschließlich als Tempeldiener im historischen Horizont Jeremias verstanden oder die Verheißung ausdrücklich auf eine spätere messianische Erfüllung bezogen werden.
  rationale: Der hebräische Text verbindet beide Gruppen mit וְאֶת als direkte Objekte von אַרְבֶּה. Die Übersetzung wahrt diese Parallelität, ohne die Art der späteren Erfüllung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Bildsprache bleibt erhalten; zugleich werden unnatürliche oder potenziell missverständliche Wörtlichkeiten vermieden. Keine Fußnote ist erforderlich, da die wesentlichen Bedeutungsnuancen im Haupttext angemessen wiedergegeben werden.
