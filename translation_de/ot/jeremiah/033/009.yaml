  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
translation:
  language: de
  text: Und sie wird mir zu einem Namen der Freude, zum Lob und zum Ruhm bei allen Völkern der Erde. Sie werden von all dem Guten hören, das ich für sie tue, und sie werden sich fürchten und erbeben wegen all des Guten und all des Friedens[a], den ich ihr bringe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all des Wohlergehens“. Das hebräische Wort schalom umfasst Frieden, Wohlergehen und unversehrte Ganzheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  choice: Und sie wird mir
  rationale: Das Verb steht im Femininum Singular; auch das abschließende לָּהּ („ihr“) weist auf die personifizierte Stadt Jerusalem zurück. „Sie“ bewahrt diese Personifikation.
- source_word: לְשֵׁם שָׂשׂוֹן
  choice: zu einem Namen der Freude
  rationale: Die Wendung bezeichnet einen Namen beziehungsweise Ruf, der Freude hervorruft. Die Übersetzung bewahrt das hebräische Bild, ohne es auf bloßen „Anlass zur Freude“ zu reduzieren.
- source_word: לִתְהִלָּה וּלְתִפְאֶרֶת
  choice: zum Lob und zum Ruhm
  rationale: תְהִלָּה bezeichnet Lob oder preisende Anerkennung; תִפְאֶרֶת kann Herrlichkeit, Pracht oder Ruhm meinen. „Ruhm“ passt hier zum öffentlichen Ansehen unter den Völkern.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: bei allen Völkern der Erde
  rationale: Das ל drückt hier die Beziehung zum öffentlichen Ansehen aus. „Bei“ ist im Deutschen in Verbindung mit Name, Lob und Ruhm natürlich.
- source_word: אֲשֶׁר יִשְׁמְעוּ
  choice: Sie werden ... hören
  rationale: Der Relativsatz bezieht sich auf die Völker. Die Aufteilung in einen neuen Satz vermeidet eine schwerfällige deutsche Satzkonstruktion und erhält den Bezug eindeutig.
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  choice: all dem Guten, das ich für sie tue
  rationale: Die idiomatische Verbindung bedeutet, jemandem Gutes zu tun. „All das Gute“ lässt sowohl konkrete Wohltaten als auch umfassendes Wohlergehen zu.
- source_word: וּפָחֲדוּ וְרָגְזוּ
  choice: sie werden sich fürchten und erbeben
  rationale: Die beiden Verben bezeichnen Furcht und körperliches oder inneres Beben. Die Formulierung bewahrt die Spannung zwischen ehrfürchtigem Erstaunen und erschreckter Reaktion.
- source_word: עַל כָּל הַטּוֹבָה
  choice: wegen all des Guten
  rationale: עַל bezeichnet hier den Grund ihrer Reaktion. „Wegen“ gibt den kausalen Sinn klar wieder.
- source_word: וְעַל כָּל הַשָּׁלוֹם
  choice: und all des Friedens
  rationale: שָׁלוֹם bedeutet Frieden, umfasst aber auch Wohlergehen, Heil und unversehrte Ganzheit. „Frieden“ bleibt die tragende Wiedergabe; die Bedeutungsbreite wird in der Fußnote genannt.
- source_word: אֲשֶׁר אָנֹכִי עֹשֶׂה לָּהּ
  choice: den ich ihr schenke
  rationale: Wörtlich steht „den ich für sie mache/tue“. Mit „Frieden“ als Objekt gibt „schenke“ im Deutschen den bewirkenden und gütigen Sinn natürlich wieder.
theological_decisions:
- issue: Reaktion der Völker auf Gottes Wiederherstellung Jerusalems
  choice: Furcht und Erbeben angesichts göttlicher Güte
  alternative: reine Schreckensangst oder lediglich politische Unruhe
  rationale: Die Verben können starke Angst ausdrücken, doch ihr ausdrücklicher Anlass sind Gottes Güte und Frieden. Die Übersetzung deutet die Reaktion weder ausschließlich als feindseligen Schrecken noch ausschließlich als ehrfürchtige Bewunderung, sondern bewahrt ihre Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer prophetischer Bildsprache. Die feminine Personifikation Jerusalems bleibt erhalten. Der lange hebräische Satz wurde für gute Verständlichkeit in zwei Sätze gegliedert.
