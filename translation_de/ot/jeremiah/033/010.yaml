  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עוֹד֮ יִשָּׁמַ֣ע בַּ/מָּקוֹם הַ/זֶּה֒ אֲשֶׁר֙ אַתֶּ֣ם אֹֽמְרִ֔ים חָרֵ֣ב ה֔וּא מֵ/אֵ֥ין אָדָ֖ם וּ/מֵ/אֵ֣ין בְּהֵמָ֑ה בְּ/עָרֵ֤י יְהוּדָה֙ וּ/בְ/חֻצ֣וֹת יְרוּשָׁלִַ֔ם הַֽ/נְשַׁמּ֗וֹת מֵ/אֵ֥ין אָדָ֛ם וּ/מֵ/אֵ֥ין יוֹשֵׁ֖ב וּ/מֵ/אֵ֥ין בְּהֵמָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: de
  text: 'So spricht der HERR: An diesem Ort, von dem ihr sagt: »Er ist verwüstet, ohne Menschen und Vieh«, in den Städten Judas und auf den Straßen Jerusalems, die verwüstet sind, ohne Menschen, ohne Bewohner und ohne Vieh, wird wieder zu hören sein,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָרֵב
  choice: liegt in Trümmern
  rationale: Das Adjektiv bezeichnet einen verwüsteten bzw. zerstörten Zustand. Die Formulierung ist im Deutschen natürlich und unterscheidet sich hinreichend vom späteren הַנְשַׁמּוֹת.
- source_word: חֻצוֹת
  choice: Straßen
  rationale: Im städtischen Zusammenhang bezeichnet der Plural öffentliche Straßen oder Plätze; »Straßen« ist hier die klare, idiomatische Wiedergabe.
- source_word: יוֹשֵׁב
  choice: Bewohner
  rationale: Das Partizip meint hier jemanden, der an einem Ort wohnt. »Bewohner« bewahrt die leichte begriffliche Unterscheidung gegenüber אָדָם, »Mensch«.
- source_word: יִשָּׁמַע
  choice: wird man wieder hören
  rationale: Das unpersönliche deutsche Aktiv gibt das hebräische Passiv idiomatisch wieder. Der Inhalt dessen, was gehört wird, folgt erst im nächsten Vers; das offene Satzende bleibt daher erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen wird beibehalten; sie kennzeichnet den Eigennamen, ohne eine unsichere Aussprache festzulegen.
- issue: Zeitliche bzw. modale Kraft von עוֹד יִשָּׁמַע
  choice: wird man wieder hören
  alternative: soll noch zu hören sein
  rationale: Der Kontext ist eine göttliche Wiederherstellungszusage. Die Zukunftsform gibt diese Aussage klar wieder, ohne ihren im Folgevers entfalteten Inhalt vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholungen »ohne Mensch … ohne Vieh« werden als bewusstes rhetorisches Merkmal des Hebräischen bewahrt. Der Vers endet syntaktisch offen mit einem Komma, da das Gehörte erst in Jeremia 33,11 genannt wird.
