    issue: »liegt in Trümmern« für חָרֵב
    rationale: Die Wendung verengt den Sinn auf einen konkreten Trümmerzustand. חָרֵב meint in diesem Kontext allgemein »verwüstet/öde«; eine weniger bildlich-spezifische Wiedergabe ist quellentreuer.
  - severity: low
    issue: »ohne Mensch« / »ohne Vieh«
    rationale: Die Singularformen sind zwar bibelsprachlich verständlich, aber im modernen Standarddeutsch weniger idiomatisch. Pluralformen bewahren die Aussage und lesen sich natürlicher.
