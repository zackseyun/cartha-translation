  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם תָּפֵ֨רוּ֙ אֶת בְּרִיתִ֣/י הַ/יּ֔וֹם וְ/אֶת בְּרִיתִ֖/י הַ/לָּ֑יְלָה וּ/לְ/בִלְתִּ֛י הֱי֥וֹת יֽוֹמָם וָ/לַ֖יְלָה בְּ/עִתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
translation:
  language: de
  text: 'So spricht Jahwe: Wenn ihr meinen Bund mit dem Tag und meinen Bund mit der Nacht brechen könnt[a], sodass Tag und Nacht nicht mehr zu ihrer bestimmten Zeit eintreten[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wenn ihr meinen Bund mit dem Tag und meinen Bund mit der Nacht brecht.« Im Hebräischen steht die Bedingung ohne ein ausdrückliches Wort für »können«; der Haupttext verdeutlicht ihre rhetorische Kraft im Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »sodass es zu ihrer bestimmten Zeit weder Tag noch Nacht gibt.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in natürlichem, zugleich würdevollem Deutsch wiedergegeben; der Gottesname יְהוָה erscheint als »Jahwe«.
- source_word: אִם תָּפֵרוּ
  choice: Wenn ihr … brechen könnt
  rationale: Das Hifil von פרר bezeichnet das Brechen, Aufheben oder Außerkraftsetzen eines Bundes. »brechen könnt« bringt den im Kontext rhetorisch-unmöglichen Bedingungssatz zur Geltung, ohne diese Auslegung im Haupttext weiter auszubauen.
- source_word: בְּרִיתִי
  choice: meinen Bund
  rationale: »Bund« ist die sachlich und theologisch angemessene Standardwiedergabe von בְּרִית und bewahrt das Bundesbild des Verses.
- source_word: הַיּוֹם … הַלָּיְלָה
  choice: mit dem Tag … mit der Nacht
  rationale: Die bestimmten Substantive bezeichnen die geordnete Folge von Tag und Nacht. Die parallele Formulierung erhält das Bild zweier von Gott gesetzter Ordnungen.
- source_word: וּלְבִלְתִּי הֱיוֹת
  choice: sodass … nicht … da sind
  rationale: Die Konstruktion bezeichnet Folge oder Ergebnis; »da sind« bleibt nahe am Verb היה »sein« und vermeidet die nicht ausdrücklich enthaltene Vorstellung des Kommens.
- source_word: בְּעִתָּם
  choice: zu ihrer festgesetzten Zeit
  rationale: עֵת bezeichnet hier die jeweils bestimmte, geordnete Zeit. »festgesetzt« macht die verlässliche göttliche Ordnung verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Rhetorische Kraft der Bedingung אִם תָּפֵרוּ
  choice: Wenn ihr … brechen könnt
  alternative: Wenn ihr … brecht
  rationale: Der weitere Zusammenhang stellt das Aufheben der Ordnung von Tag und Nacht als unmöglich dar. Das Modalverb macht diese rhetorische Funktion im Deutschen hörbar; die formalere Lesart bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes Standarddeutsch in einem würdevollen prophetischen Stil. Die Satzstruktur und die Parallelität des Hebräischen bleiben erkennbar; Fußnoten sichern die formalere und eine alternative idiomatische Wiedergabe.
