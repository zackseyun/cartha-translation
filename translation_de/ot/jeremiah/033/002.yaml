id: JER.33.2
reference: Jeremiah 33:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה עֹשָׂ֑/הּ יְהוָ֗ה יוֹצֵ֥ר אוֹתָ֛/הּ לַ/הֲכִינָ֖/הּ יְהוָ֥ה שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
translation:
  language: de
  text: 'So spricht Jahwe, der es[a][c] macht, Jahwe, der es formt, um es zu festigen – Jahwe[b] ist sein Name:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der es gemacht hat … der es geformt hat, um es zu festigen“. Die hebräischen Partizipien lassen je nach Zusammenhang sowohl eine gegenwärtige bzw. fortdauernde als auch eine abgeschlossene Wiedergabe zu.'
    reason: lexical_alternative
  - marker: b
    text: An allen drei Stellen steht im Hebräischen der Gottesname JHWH. Traditionell wird er auch mit „der HERR“ wiedergegeben.
    reason: alternative_reading
  - marker: c
    text: Die Suffixe in „es macht … es formt … es festigen“ sind im Hebräischen feminin und könnten deshalb auch mit „sie“ wiedergegeben werden. Worauf sie sich beziehen, wird in diesem Vers nicht ausdrücklich gesagt.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen natürlich und würdevoll mit „So spricht“ wiedergegeben; das Präsens entspricht ihrem performativen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: עֹשָׂהּ
  choice: der es macht
  rationale: Das aktive Partizip von עשה wird präsentisch wiedergegeben. Das Pronomen „es“ lässt den im Vers nicht ausdrücklich genannten Bezug offen.
- source_word: יוֹצֵר אוֹתָהּ
  choice: der es formt
  rationale: יצר bezeichnet absichtsvolles Formen oder Gestalten. „formt“ wahrt die Parallelität zu „macht“ und den partizipialen, fortdauernden Charakter.
- source_word: לַהֲכִינָהּ
  choice: um es zu festigen
  rationale: Die Hifil-Form von כון kann „fest machen“, „gründen“ oder „Bestand geben“ bedeuten. „festigen“ gibt Zielrichtung und Stabilität wieder, ohne einen bestimmten Bezug zu ergänzen.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Die Formulierung bewahrt die feierliche hebräische Namensaussage und ihre Satzstruktur.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Im Hebräischen steht an allen drei Stellen der Eigenname JHWH. „Jahwe“ macht den Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher bzw. aspektueller Wert der Partizipien עֹשֶׂה und יוֹצֵר
  choice: 'Präsentisch: „macht … formt“'
  alternative: 'Abgeschlossen: „gemacht hat … geformt hat“'
  rationale: Die hebräischen Partizipien können gegenwärtiges bzw. fortdauerndes Handeln oder eine charakteristische Tätigkeit bezeichnen. Die präsentische Fassung hält diese Formnähe fest; die abgeschlossene Deutung bleibt in der Fußnote erhalten.
- issue: Bezug der femininen Suffixe
  choice: Mit „es“ wiedergeben und den Bezug unausgesprochen lassen
  alternative: „sie“ oder die Ergänzung eines bestimmten Bezugsworts wie „die Stadt“ bzw. „die Erde“
  rationale: Der Vers selbst nennt das Bezugswort nicht. Eine ausdrückliche Identifizierung würde die im hebräischen Text bestehende Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten prophetischen Formel „So spricht“. Die knappe Wiederholung von „Jahwe“ und der Gedankenstrich bewahren den feierlichen, formelhaften Aufbau des Hebräischen. Das abschließende Kolon wird beibehalten, weil der folgende Vers die Rede fortsetzt.
