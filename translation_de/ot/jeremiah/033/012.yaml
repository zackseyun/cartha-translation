source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: An diesem Ort, der verwüstet ist und wo weder Mensch noch Vieh ist, und in allen seinen Städten wird es wieder Weideplätze[a] für Hirten geben, die ihre Herden lagern lassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Weideplätze“ kann auch mit „Wohnstätten“ oder „Lagerplätzen“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Bewahrt den Gottesnamen und gibt den traditionellen Titel צְבָאוֹת würdevoll und im Deutschen verständlich wieder; „Herr“ verdeutlicht idiomatisch die Beziehung zu den Heerscharen, ohne deren Art einzuengen.
- source_word: עוֹד יִהְיֶה
  choice: wird es wieder … geben
  rationale: Gibt die erneute, nach der Verwüstung eintretende Existenz natürlich wieder.
- source_word: בַּמָּקוֹם הַזֶּה הֶחָרֵב
  choice: an diesem Ort, der verwüstet ist
  rationale: Erhält den demonstrativen Nachdruck und den gegenwärtigen Zustand der Verwüstung.
- source_word: מֵאֵין אָדָם וְעַד בְּהֵמָה
  choice: wo weder Mensch noch Vieh lebt
  rationale: Vermittelt die hebräische Formel für völlige Entvölkerung in natürlichem modernem Deutsch.
- source_word: וּבְכָל עָרָיו
  choice: und in allen seinen Städten
  rationale: Der maskuline Suffixbezug wird formal auf „Ort“ bezogen; gemeint ist das zugehörige Gebiet mit seinen Städten.
- source_word: נְוֵה רֹעִים
  choice: Weideplätze für Hirten
  rationale: נְוֵה kann Weide, Aufenthaltsort oder Lagerplatz bezeichnen; im Zusammenhang mit lagernden Herden ist „Weideplätze“ klar und natürlich.
- source_word: מַרְבִּצִים צֹאן
  choice: die ihre Herden lagern lassen
  rationale: 'Bewahrt die kausative Bedeutung des Hifil-Partizips: Die Hirten bringen die Herden zum Lagern und Ruhen.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration bewahrt den persönlichen Bundesnamen im Haupttext, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Wiedergabe von אָדָם in der Entvölkerungsformel
  choice: Mensch
  alternative: Menschen
  rationale: „Mensch“ entspricht dem kollektiven Singular und bildet zusammen mit „Vieh“ die umfassende Formel für das Fehlen menschlichen und tierischen Lebens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung setzt die umfassende Ortsangabe vor die Verheißung und macht so den Gegensatz zwischen Verwüstung und Wiederherstellung deutlich. Der einzige Fußnotenmarker steht unmittelbar nach der betroffenen Gesamtaussage.
