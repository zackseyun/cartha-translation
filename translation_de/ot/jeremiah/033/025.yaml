  terminology: „Jahwe“, „Bund“, „Tag und Nacht“ sowie „feste Ordnungen von Himmel und Erde“ sind sachgerecht. „Festgesetzt“ gibt שׂים im Zusammenhang mit kosmischen Satzungen natürlich und präzise wieder.
