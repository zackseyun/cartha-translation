id: JER.33.25
reference: Jeremiah 33:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם לֹ֥א בְרִיתִ֖/י יוֹמָ֣ם וָ/לָ֑יְלָה חֻקּ֛וֹת שָׁמַ֥יִם וָ/אָ֖רֶץ לֹא שָֽׂמְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
translation:
  language: de
  text: 'So spricht Jahwe: Wenn mein Bund mit Tag und Nacht nicht besteht[a] und ich die festen Ordnungen von Himmel und Erde nicht festgesetzt habe —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist im ersten Teil kein Verb ausgedrückt. Möglich ist auch: „Wenn ich meinen Bund mit Tag und Nacht und die festen Ordnungen von Himmel und Erde nicht festgesetzt habe …“'
    reason: Das Hebräische lässt offen, ob beide Nominalgruppen unter dem Verb „festgesetzt habe“ stehen oder ob der erste Teil einen elliptischen, parallelen Bedingungssatz bildet.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige prophetische Botenformel wird würdig und unmittelbar wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: אִם לֹא
  choice: Wenn … nicht
  rationale: Die bedingende, beinahe eidartige Form des Hebräischen bleibt erhalten; der Nachsatz folgt erst im nächsten Vers.
- source_word: בְרִיתִי
  choice: meinen Bund
  rationale: „Bund“ bewahrt den zentralen theologischen Begriff und seine bewusste Verbindung mit der Schöpfungsordnung im Kontext.
- source_word: יוֹמָם וָלָיְלָה
  choice: mit Tag und Nacht
  rationale: Die Formulierung bezeichnet die beständige Ordnung von Tag und Nacht als Gegenstand beziehungsweise Bereich des Bundes.
- source_word: חֻקּוֹת
  choice: die festen Ordnungen
  rationale: חֻקּוֹת kann Satzungen oder festgesetzte Ordnungen bezeichnen; im kosmischen Zusammenhang vermittelt „feste Ordnungen“ sowohl Festsetzung als auch Regelmäßigkeit.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: von Himmel und Erde
  rationale: Die traditionelle Paarformel bezeichnet die gesamte geschaffene Welt und klingt im Deutschen natürlich.
- source_word: לֹא שָׂמְתִּי
  choice: nicht eingesetzt habe
  rationale: שׂים bedeutet grundlegend „setzen, stellen“ und bezeichnet hier das Einrichten der kosmischen Ordnung; „eingesetzt“ wahrt dieses Bild und ist idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Bundesnamen; „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Verhältnis zwischen „Bund mit Tag und Nacht“ und „Ordnungen von Himmel und Erde“
  choice: Apposition unter dem gemeinsamen Verb „eingesetzt habe“
  alternative: 'Zwei parallele Bedingungen: Der Bund besteht nicht, und die Ordnungen sind nicht eingesetzt'
  rationale: Der knappe hebräische Satz lässt das genaue syntaktische Verhältnis offen. Die Hauptfassung versteht die Ordnungen als erläuternde Apposition zum Bund, ohne beide Begriffe gleichzusetzen; die Fußnote dokumentiert die mögliche parallele Gliederung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit der vertrauten prophetischen Formel „So spricht …“. Der Gedankenstrich zeigt an, dass der Bedingungssatz erst in Vers 26 fortgeführt wird. „Feste Ordnungen“ vermeidet einen ausschließlich juristischen Klang, bewahrt aber den Gedanken göttlich festgesetzter Satzungen.
