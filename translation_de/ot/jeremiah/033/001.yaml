id: JER.33.1
reference: Jeremiah 33:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes zum zweiten Mal an Jeremia, während er noch im Wachhof[a] festgehalten wurde:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Gefängnishof“. Der hebräische Ausdruck bezeichnet wahrscheinlich einen bewachten Hof oder einen umschlossenen Bereich, in dem Gefangene festgehalten wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Erzählform führt einen neuen Handlungsschritt ein. „Da erging“ gibt den Anschluss idiomatisch wieder und passt zur prophetischen Offenbarungsformel.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die formale und theologische Prägung der prophetischen Formel; „Jahwe“ gibt den im Hebräischen stehenden Gottesnamen wieder.
- source_word: אֶל יִרְמְיָהוּ
  choice: an Jeremia
  rationale: Bei der deutschen Wendung „das Wort erging“ ist „an Jeremia“ die natürliche Entsprechung.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Die Formulierung bezeichnet ausdrücklich das zweite Auftreten und ist genauer als das allgemeinere „wieder“.
- source_word: וְהוּא עוֹדֶנּוּ עָצוּר
  choice: während er noch … festgehalten wurde
  rationale: Die zeitliche Begleitumstandsangabe und der Zustand des Festgehaltenseins werden in natürlichem Deutsch ausgedrückt, ohne den rechtlichen Status überzubestimmen.
- source_word: בַּחֲצַר הַמַּטָּרָה
  choice: im Wachhof
  rationale: חָצֵר bezeichnet einen Hof, מַטָּרָה hier einen bewachten Bereich, der der Verwahrung diente. „Wachhof“ bleibt knapp und institutionell, ohne ein reguläres Gefängnis vorauszusetzen.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im modernen Deutschen die unmittelbar folgende direkte Rede natürlich ein und erfüllt hier die Funktion des hebräischen לֵאמֹר.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Die im Deutschen geläufige Form „Jahwe“ bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Charakter von דְבַר יְהוָה
  choice: Wort Jahwes
  alternative: Botschaft Jahwes
  rationale: „Wort“ erhält die traditionelle Offenbarungsformel und legt den Ausdruck nicht vorschnell ausschließlich als „Botschaft“ aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt erkennbar; Satzbau und Doppelpunkt sind zugleich natürlich und gut verständlich.
