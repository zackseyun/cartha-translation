  text: וְ/טִ֣הַרְתִּ֔י/ם מִ/כָּל עֲוֺנָ֖/ם אֲשֶׁ֣ר חָֽטְאוּ לִ֑/י וְ/סָלַחְתִּ֗י ל/כול עֲוֺנֽוֹתֵי/הֶם֙ אֲשֶׁ֣ר חָֽטְאוּ לִ֔/י וַ/אֲשֶׁ֖ר פָּ֥שְׁעוּ בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
translation:
  language: de
  text: Und ich werde sie von all der Schuld[a] reinigen, die sie durch ihre Sünde gegen mich auf sich geladen haben. Ich werde ihnen alle ihre Vergehen[b] vergeben, durch die sie gegen mich gesündigt und sich gegen mich aufgelehnt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von all ihrem Unrecht“. Das hebräische Wort עָוֹן kann sowohl das begangene Unrecht als auch die daraus entstehende Schuld bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle ihre Schuld“. Im Hebräischen steht hier der Plural desselben Wortes wie zuvor; er kann sowohl die vielen einzelnen Vergehen als auch die damit verbundene Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Und ich werde sie … reinigen
  rationale: Das Piel von טהר bezeichnet ein Reinigen beziehungsweise Läutern. „Reinigen“ bewahrt das Bild göttlicher Beseitigung von Verunreinigung und Schuld, ohne es auf rein rituelle Reinheit einzuengen.
- source_word: מִכָּל עֲוֺנָם
  choice: von all der Schuld
  rationale: עָוֹן kann sowohl das begangene Unrecht als auch die daraus erwachsende Schuld bezeichnen. Nach „reinigen“ bringt „Schuld“ den Zusammenhang von Verfehlung, Belastung und Wiederherstellung natürlich zum Ausdruck.
- source_word: אֲשֶׁר חָטְאוּ לִי
  choice: die sie durch ihre Sünde gegen mich auf sich geladen haben
  rationale: חטא mit ל bezeichnet hier Sünde gegen Gott. Die Formulierung gibt bei der gewählten Bedeutung „Schuld“ den Zusammenhang idiomatisch wieder, ohne das Ursprungsverb „sündigen“ auszulassen.
- source_word: וְסָלַחְתִּי
  choice: Ich werde … vergeben
  rationale: סלח ist das übliche Verb für Gottes Vergebung. Der neue deutsche Satz vermeidet eine überlange Satzverbindung und bewahrt die gleichrangige göttliche Zusage.
- source_word: לְכָל עֲוֺנוֹתֵיהֶם
  choice: ihnen alle ihre Vergehen vergeben
  rationale: Der Plural von עָוֹן bezeichnet hier die zahlreichen schuldhaften Taten. „Vergehen“ ist im modernen Deutsch verständlich und unterscheidet diese Taten sprachlich von חטא und פשע.
- source_word: וַאֲשֶׁר פָּשְׁעוּ בִי
  choice: und sich gegen mich aufgelehnt haben
  rationale: פשע bezeichnet häufig bewusste Auflehnung oder Rebellion gegen rechtmäßige Autorität. „Sich gegen mich auflehnen“ erhält diese relationale und willentliche Dimension in natürlichem Deutsch.
theological_decisions:
- issue: 'Unterschiedliche Begriffe für menschliche Verfehlung: עון, חטא und פשע'
  choice: „Schuld/Vergehen“, „sündigen“ und „sich auflehnen“ werden unterschieden.
  alternative: Alle drei Begriffe einheitlich mit „Sünde/sündigen“ wiedergeben.
  rationale: Der hebräische Text häuft verwandte, aber nicht völlig deckungsgleiche Begriffe. Die differenzierte Wiedergabe bewahrt die Spannung zwischen schuldhafter Belastung, sündigem Handeln und bewusster Auflehnung, ohne daraus ein bestimmtes Lehrsystem abzuleiten.
- issue: Mehrdeutigkeit von עָוֹן
  choice: Im ersten Vorkommen „Schuld“, im pluralischen zweiten Vorkommen „Vergehen“.
  alternative: Beide Vorkommen einheitlich mit „Unrecht“ oder „Schuld“ wiedergeben.
  rationale: עָוֹן kann sowohl Tat als auch Schuldfolge bezeichnen. Der jeweilige deutsche Kontext verlangt unterschiedliche idiomatische Lösungen; Fußnoten halten die lexikalische Überschneidung transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufteilung in zwei Sätze erhöht die Verständlichkeit, ohne die Parallelität der beiden göttlichen Zusagen aufzugeben. Die Formulierung „auf sich geladen“ verdeutlicht idiomatisch den Schuldaspekt von עָוֹן; die Fußnoten bewahren dessen echte semantische Mehrdeutigkeit.
