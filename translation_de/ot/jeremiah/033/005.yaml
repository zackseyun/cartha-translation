id: JER.33.5
reference: Jeremiah 33:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
translation:
  language: de
  text: Sie kommen, um gegen die Chaldäer[a] zu kämpfen und sie mit den Leichen der Menschen[b] zu füllen, die ich in meinem Zorn und in meinem Grimm erschlagen habe. Denn wegen all ihrer Bosheit habe ich mein Angesicht vor dieser Stadt verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylonier“. Im Hebräischen steht „Chaldäer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und sie mit den Leichen der Menschen zu füllen“. „Sie“ bezieht sich wahrscheinlich auf die im vorherigen Vers genannten Häuser oder Befestigungsanlagen.'
    reason: cross_reference
lexical_decisions:
- source_word: בָּאִים
  choice: Sie kommen
  rationale: Das maskuline Pluralpartizip von בוא bezeichnet hier eine gegenwärtige oder unmittelbar bevorstehende Handlung; das deutsche Präsens gibt dies natürlich wieder.
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  choice: um gegen die Chaldäer zu kämpfen
  rationale: Der Infinitiv von לחם mit אֶת bezeichnet den feindlichen Kampf gegen die Chaldäer.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Der hebräische Volksname wird im Haupttext bewahrt; die historisch verständlichere Bezeichnung „Babylonier“ steht in der Fußnote.
- source_word: וּלְמַלְאָם
  choice: und sie … zu füllen
  rationale: Die koordinierende Konjunktion und der Infinitiv werden formal bewahrt. Das pluralische Suffix bleibt mit „sie“ erhalten, obwohl sein Bezug auf die im vorherigen Vers genannten Häuser beziehungsweise Befestigungen nur aus dem Kontext hervorgeht.
- source_word: פִּגְרֵי הָאָדָם
  choice: mit den Leichen der Menschen
  rationale: פגר bezeichnet einen Leichnam, besonders infolge gewaltsamen Todes; אָדָם ist hier kollektiv und wird inklusiv als „Menschen“ wiedergegeben.
- source_word: אֲשֶׁר הִכֵּיתִי
  choice: die ich … erschlagen habe
  rationale: נכה bezeichnet hier angesichts der bereits genannten Leichen ein tödliches Schlagen; „erschlagen“ bewahrt sowohl die Gewalt des Verbs als auch das Ergebnis.
- source_word: בְאַפִּי וּבַחֲמָתִי
  choice: in meinem Zorn und in meinem Grimm
  rationale: Die beiden überlappenden Begriffe für göttlichen Zorn werden als unterscheidbares, verstärkendes Wortpaar wiedergegeben.
- source_word: וַאֲשֶׁר הִסְתַּרְתִּי פָנַי מֵהָעִיר הַזֹּאת
  choice: Denn … habe ich mein Angesicht vor dieser Stadt verborgen
  rationale: Die anthropomorphe hebräische Wendung bleibt erhalten. Das einleitende וַאֲשֶׁר ist syntaktisch schwierig; „Denn“ stellt den folgenden Satz als erklärenden Hintergrund dar, ohne den idiomatischen Gehalt aufzulösen.
- source_word: עַל כָּל רָעָתָם
  choice: wegen all ihrer Bosheit
  rationale: עַל ist hier kausal; רָעָה bezeichnet die moralische Bosheit der Betroffenen.
theological_decisions:
- issue: Göttliches Gericht und anthropomorphe Rede
  choice: Direkte Aussagen „ich … erschlagen habe“, „in meinem Zorn und in meinem Grimm“ und „mein Angesicht … verborgen“ beibehalten
  alternative: Das Gericht als unpersönliches Unglück umschreiben oder die Wendung vom verborgenen Angesicht erklärend auflösen
  rationale: Der hebräische Text schreibt das Gericht ausdrücklich Gott zu und gebraucht die bedeutungsvolle biblische Wendung vom Verbergen seines Angesichts. Eine Abschwächung würde die theologische Spannung des Textes mindern.
- issue: Bezug des pluralischen Suffixes in וּלְמַלְאָם
  choice: Das unbestimmte „sie“ bewahren und den wahrscheinlichen Bezug in einer Fußnote erläutern
  alternative: Im Haupttext ausdrücklich „die Häuser“ oder „die Befestigungen“ einsetzen
  rationale: Der Vers selbst nennt den Bezug nicht erneut. Die Übersetzung bewahrt diese grammatische Unbestimmtheit, statt eine kontextuell wahrscheinliche Deutung zum ausdrücklichen Wortlaut zu machen.
- issue: Syntaktische Funktion von וַאֲשֶׁר im letzten Satzteil
  choice: Als erklärenden Übergang „Denn“ wiedergeben
  alternative: Mit „und“ koordinieren oder als weitere Relativklausel an die Erschlagenen anschließen
  rationale: Die Konstruktion ist komprimiert und textlich schwierig. Die kausale Lesart ergibt einen verständlichen Bezug zwischen der Bosheit der Bewohner und Gottes Abwendung von der Stadt, ohne die Bildsprache zu beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Chaldäer“ und „mein Angesicht verborgen“ bewahren die historische beziehungsweise biblische Ausdrucksweise; Satzbau und übriger Wortschatz bleiben für heutige Leser verständlich. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar an der erklärungsbedürftigen Stelle.
