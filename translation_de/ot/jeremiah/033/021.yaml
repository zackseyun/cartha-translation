  text: גַּם בְּרִיתִ֤/י תֻפַר֙ אֶת דָּוִ֣ד עַבְדִּ֔/י מִ/הְיֽוֹת ל֥/וֹ בֵ֖ן מֹלֵ֣ךְ עַל כִּסְא֑/וֹ וְ/אֶת הַ/לְוִיִּ֥ם הַ/כֹּהֲנִ֖ים מְשָׁרְתָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
translation:
  language: de
  text: Dann könnte auch mein Bund mit meinem Diener David gebrochen werden, sodass er keinen Sohn hätte, der auf seinem Thron regiert, und ebenso mein Bund mit den levitischen Priestern[a], die mir dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „mit den Leviten, den Priestern, die mir dienen“.'
    reason: Die hebräische Wortgruppe kann appositionell wiedergegeben werden; die Fußnote bewahrt diese formnähere Alternative einschließlich der Bezeichnung für Gottes Dienende.
lexical_decisions:
- source_word: גַּם
  choice: auch
  rationale: 'Das Wort stellt den entsprechenden Zusatz zur vorausgehenden Bedingung her: Auch Gottes Bund könnte dann gebrochen werden.'
- source_word: בְּרִיתִי
  choice: mein Bund
  rationale: „Bund“ bewahrt den rechtlichen und theologischen Gehalt des hebräischen Begriffs; die Wiederholung im zweiten Satzglied macht die hebräische Ellipse im Deutschen verständlich.
- source_word: תֻפַר
  choice: könnte ... gebrochen werden
  rationale: Das Hophal von פרר bezeichnet das Gebrochen- oder Außerkraftgesetztwerden eines Bundes. Der Konjunktiv gibt den irrealen Bedingungszusammenhang mit dem vorausgehenden Vers wieder.
- source_word: אֶת דָּוִד עַבְדִּי
  choice: mit meinem Diener David
  rationale: Bei בְּרִית bezeichnet אֶת die Person, mit der der Bund besteht. „Mein Diener“ bleibt als bedeutungsvoller Titel erhalten.
- source_word: מִהְיוֹת לוֹ
  choice: sodass er keinen ... hätte
  rationale: Die Verbindung aus מִן und Infinitiv beschreibt hier die Folge eines hypothetischen Bundesbruchs. Die deutsche Formulierung gibt diesen Zusammenhang idiomatisch wieder.
- source_word: בֵן
  choice: Sohn
  rationale: Die konkrete familiale und dynastische Bezeichnung wird nicht zu „Nachkomme“ oder „Erbe“ verallgemeinert.
- source_word: מֹלֵךְ
  choice: der ... regiert
  rationale: Das Partizip bezeichnet die fortdauernde Ausübung der Königsherrschaft.
- source_word: עַל כִּסְאוֹ
  choice: auf seinem Thron
  rationale: Dies ist die natürliche deutsche Entsprechung der hebräischen Königsformel.
- source_word: וְאֶת הַלְוִיִּם הַכֹּהֲנִים
  choice: und ebenso mein Bund mit den levitischen Priestern
  rationale: Die Wiederaufnahme von „mein Bund“ verdeutlicht im Deutschen die syntaktische Zuordnung. „Levitische Priester“ gibt die Bezeichnung flüssig wieder; die appositionelle Form bleibt in der Fußnote erhalten.
- source_word: מְשָׁרְתָי
  choice: die mir dienen
  rationale: שרת bezeichnet hier den kultischen Dienst vor Gott. Der Relativsatz ist im heutigen Deutsch natürlicher und eindeutiger als „meine Diener“ oder „meine Amtsträger“.
theological_decisions:
- issue: Dynastische Verheißung an David
  choice: Die konkrete Formulierung „einen Sohn ..., der auf seinem Thron regiert“ bleibt erhalten.
  alternative: „einen Nachkommen, der auf seinem Thron regiert“ oder „einen Erben auf seinem Thron“
  rationale: Der hebräische Text verwendet ausdrücklich „Sohn“. So bleibt die dynastische und familiale Spannung des Textes bestehen, ohne eine spätere messianische Deutung ausdrücklich einzutragen.
- issue: Bestimmung der priesterlichen Gruppe
  choice: Im Haupttext steht „die levitischen Priester“, mit der formnäheren Wiedergabe in einer Fußnote.
  alternative: „die Leviten, die Priester“
  rationale: Die hebräische Wortgruppe kann appositionell verstanden werden. Die Hauptfassung ist in modernem Deutsch lesbar, während die Fußnote die formale Mehrdeutigkeit sichtbar hält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der irreale Bedingungszusammenhang wird durch „Dann könnte“ und „hätte“ kenntlich gemacht. Die lange hebräische Satzstruktur wird behutsam gegliedert, ohne die Verbindung zwischen dem davidischen Bund und dem Priesterdienst aufzulösen.
