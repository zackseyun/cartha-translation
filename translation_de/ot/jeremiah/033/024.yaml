id: JER.33.24
reference: Jeremiah 33:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֲ/ל֣וֹא רָאִ֗יתָ מָֽה הָ/עָ֤ם הַ/זֶּה֙ דִּבְּר֣וּ לֵ/אמֹ֔ר שְׁתֵּ֣י הַ/מִּשְׁפָּח֗וֹת אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה בָּ/הֶ֖ם וַ/יִּמְאָסֵ֑/ם וְ/אֶת עַמִּ/י֙ יִנְאָצ֔וּ/ן מִֽ/הְי֥וֹת ע֖וֹד גּ֥וֹי לִ/פְנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
translation:
  language: de
  text: 'Hast du nicht gesehen, was dieses Volk gesagt hat: »Die beiden Familien, die Jahwe erwählt hat – die hat er verworfen«? So verachten sie mein Volk und halten es in ihren Augen nicht länger für ein Volk.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sodass es nicht länger ein Volk vor ihnen ist“. Gemeint sein kann: in ihren Augen oder nach ihrer Einschätzung.'
    reason: Die hebräische Schlussklausel ist knapp und lässt das genaue Verhältnis zwischen nationalem Status und der Einschätzung der Verachtenden offen.
lexical_decisions:
- source_word: הֲלוֹא רָאִיתָ
  choice: Hast du nicht gesehen
  rationale: Bewahrt die rhetorische Frage und die direkte Anrede; „gesehen“ kann hier auch wahrnehmen oder bemerken einschließen.
- source_word: הָעָם הַזֶּה דִּבְּרוּ לֵאמֹר
  choice: was dieses Volk sagt
  rationale: Natürliches modernes Deutsch gibt die hebräische Redeeinleitung knapp wieder; der Singular „dieses Volk“ erhält den leicht distanzierenden Kollektivausdruck.
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  choice: die beiden Familien
  rationale: „Familien“ ist die direkte Grundbedeutung; die nicht ausdrücklich genannten Identitäten werden nicht interpretierend ergänzt.
- source_word: אֲשֶׁר בָּחַר יְהוָה בָּהֶם
  choice: die Jahwe erwählt hat
  rationale: Gibt die idiomatische Bedeutung der Konstruktion mit ב wieder und bewahrt den Gottesnamen als Jahwe.
- source_word: וַיִּמְאָסֵם
  choice: die hat er verworfen
  rationale: „Verworfen“ gibt die starke Ablehnung von מאס wieder; die Wiederaufnahme durch „die“ entspricht dem emphatischen Objektpronomen.
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  choice: So verachten sie mein Volk
  rationale: נאַץ bezeichnet verächtliche Zurückweisung; „so“ macht den aus dem Kontext hervorgehenden Zusammenhang verständlich, ohne zusätzliche Lehraussage.
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  choice: und halten es in ihren Augen nicht länger für ein Volk
  rationale: Gibt die schwerfällige wörtliche Konstruktion idiomatisch wieder und versteht לִפְנֵיהֶם als „in ihren Augen“, sodass die Einschätzung der Sprecher im Vordergrund bleibt.
theological_decisions:
- issue: Bezug der „beiden Familien“
  choice: Nicht näher bestimmt; „die beiden Familien“
  alternative: Israel und Juda; oder das Haus Davids und die levitische Priesterschaft
  rationale: Der Vers selbst nennt die beiden Gruppen nicht ausdrücklich. Die Übersetzung wahrt diese echte Auslegungsfrage.
- issue: Aussage der Schlussklausel
  choice: Als verächtliche Einschätzung der Sprecher wiedergegeben
  alternative: Als objektive Aussage, Gottes Volk sei kein Volk mehr
  rationale: לִפְנֵיהֶם legt „vor ihnen/in ihren Augen“ nahe. Die gewählte Fassung vermeidet, aus der feindseligen Behauptung eine objektive Aufhebung des Volksstatus zu machen.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text bietet den Eigennamen יהוה; die Transliteration macht den persönlichen Gottesnamen im Haupttext sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und scharf; strittige Identifikationen werden nicht in den Text eingetragen. Der Fußnotenmarker [a] steht im Haupttext.
