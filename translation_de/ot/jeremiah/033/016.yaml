  text: בַּ/יָּמִ֤ים הָ/הֵם֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וִ/ירוּשָׁלִַ֖ם תִּשְׁכּ֣וֹן לָ/בֶ֑טַח וְ/זֶ֥ה אֲשֶׁר יִקְרָא לָ֖/הּ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
translation:
  language: de
  text: 'In jenen Tagen wird Juda gerettet werden, und Jerusalem wird in Sicherheit wohnen. Und dies ist der Name, mit dem man sie nennen wird: »Jahwe ist unsere Gerechtigkeit.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In Jeremia 23,6 trägt der angekündigte davidische König die eng verwandte Bezeichnung »Jahwe ist unsere Gerechtigkeit«. Hier bezieht die Grammatik sie auf Jerusalem; wahrscheinlich klingt die frühere Verheißung bewusst an.
    reason: Der Querverweis macht die literarische und theologische Spannung sichtbar, ohne den grammatischen Bezug des vorliegenden Verses umzudeuten.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Die feste prophetische Zeitformel wird nah am Hebräischen und zugleich in natürlichem modernem Deutsch wiedergegeben.
- source_word: תִּוָּשַׁע
  choice: wird gerettet werden
  rationale: Das Nifal von ישׁע bezeichnet passiv das Gerettet- oder Befreitwerden. „Gerettet werden“ bewahrt sowohl die Form als auch die umfassende Bedeutung göttlicher Rettung.
- source_word: תִּשְׁכּוֹן לָבֶטַח
  choice: wird in Sicherheit wohnen
  rationale: שׁכן bezeichnet dauerhaftes Wohnen, לָבֶטַח einen Zustand der Sicherheit. Die Wendung ist verständlich und erhält den Gedanken eines sicheren Lebensraums.
- source_word: וְזֶה אֲשֶׁר יִקְרָא לָהּ
  choice: Und so wird man sie nennen
  rationale: Die hebräische Konstruktion führt eine Benennung ein. Das maskuline Singularverb mit dem femininen Suffix lässt sich im Deutschen idiomatisch mit dem unpersönlichen „man“ wiedergeben; „sie“ bezieht sich grammatisch auf Jerusalem.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen als „Jahwe“ transliteriert und nicht durch einen Titel wie „der HERR“ ersetzt.
- source_word: צִדְקֵנוּ
  choice: ist unsere Gerechtigkeit
  rationale: צֶדֶק mit dem Suffix der ersten Person Plural bedeutet „unsere Gerechtigkeit“. In der Namensformel macht das ergänzte „ist“ den prädikativen Sinn im Deutschen deutlich.
theological_decisions:
- issue: Bezug der Benennungsformel
  choice: Die feminine Form „sie“ bezieht den Namen auf Jerusalem.
  alternative: Wegen Jeremia 23,6 könnte die Bezeichnung unmittelbar auf den kommenden davidischen König bezogen werden.
  rationale: Das feminine Suffix לָהּ verweist in diesem Vers grammatisch auf Jerusalem. Der enge Anklang an Jeremia 23,6 bleibt jedoch theologisch bedeutsam und wird in einer Fußnote kenntlich gemacht, ohne die Spannung aufzulösen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Transliteration bewahrt den Unterschied zwischen Eigenname und Titel.
- issue: Bedeutung von צִדְקֵנוּ
  choice: unsere Gerechtigkeit
  alternative: unsere Gerechtigkeit/unser Recht in einem enger juristischen Sinn
  rationale: „Gerechtigkeit“ erhält die Breite des hebräischen Begriffs und vermeidet eine unnötige Verengung auf juristische Gerechtigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „In Sicherheit wohnen“ ist allgemein verständlich und bewahrt das Bild dauerhaften Wohnens. Die direkte Namensformel bleibt prägnant; der Doppelpunkt signalisiert ihre Einführung.
