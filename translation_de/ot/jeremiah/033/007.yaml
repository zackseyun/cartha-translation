  text: וַ/הֲשִֽׁבֹתִי֙ אֶת שְׁב֣וּת יְהוּדָ֔ה וְ/אֵ֖ת שְׁב֣וּת יִשְׂרָאֵ֑ל וּ/בְנִתִ֖י/ם כְּ/בָ/רִֽאשֹׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
translation:
  language: de
  text: Ich werde das Geschick Judas und das Geschick Israels wiederherstellen[a] und Juda und Israel wieder aufbauen wie früher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: »die Gefangenschaft Judas und Israels zurückführen«; möglicherweise auch: »die Gefangenen Judas und Israels zurückbringen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי
  choice: Ich werde … wiederherstellen
  rationale: Der Hifil von שוב bezeichnet hier ein Zurückführen beziehungsweise Wiederherstellen. In Verbindung mit שְׁבוּת gibt „wiederherstellen“ die Umkehr von Exil, Verlust und Niedergang natürlich wieder.
- source_word: שְׁבוּת
  choice: das Geschick
  rationale: In der festen Verbindung הֵשִׁיב שְׁבוּת bezeichnet שְׁבוּת häufig umfassend die verlorene Lebenslage oder das Geschick, das Gott wendet. „Geschick“ bewahrt diese Breite; Gefangenschaft und Heimkehr bleiben als mögliche konkrete Aspekte in der Fußnote sichtbar.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Eingebürgerte deutsche Form des Stammes- und Landesnamens.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Eingebürgerte deutsche Form des Volksnamens; zusammen mit Juda bezeichnet sie hier das ganze geteilte Gottesvolk.
- source_word: וּבְנִתִים
  choice: und sie wieder aufbauen
  rationale: בנה bedeutet „bauen“ und kann im Wiederherstellungskontext „wieder aufbauen“ heißen. Das pluralische Suffix bezieht sich gemeinsam auf Juda und Israel.
- source_word: כְּבָרִאשֹׁנָה
  choice: wie früher
  rationale: Die Wendung vergleicht den kommenden Zustand mit dem früheren. „Wie früher“ ist prägnant, natürlich und bewahrt den zeitlichen Vergleich.
theological_decisions:
- issue: Bedeutungsumfang von שְׁבוּת in der Wiederherstellungsverheißung
  choice: das Geschick … wiederherstellen
  alternative: die Gefangenschaft wenden / die Gefangenen zurückbringen
  rationale: Der hebräische Ausdruck kann die Rückkehr aus der Gefangenschaft einschließen, bezeichnet in solchen Verheißungen aber oft eine umfassendere Wiederherstellung. Der Haupttext wahrt diese Breite, während die Fußnote die stärker exilbezogenen Möglichkeiten offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Das Geschick wiederherstellen“ ist verständlich und hält die idiomatische Bedeutungsbreite fest; „wie früher“ vermeidet unnötig altertümliche Formulierungen.
