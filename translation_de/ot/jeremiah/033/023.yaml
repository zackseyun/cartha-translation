  text: וַֽ/יְהִי֙ דְּבַר יְהוָ֔ה אֶֽל יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/023.yaml
  text: And the word of Yahweh came to Jeremiah[a], saying,
translation:
  language: de
  text: 'Und das Wort Jahwes erging an Jeremia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: erging
  rationale: Die Verbfolge leitet die nächste Offenbarung ein. Zusammen mit דְּבַר ist „das Wort … erging“ eine natürliche, würdige deutsche Wiedergabe, ohne das schwerfällige „und es geschah“.
- source_word: דְּבַר
  choice: das Wort
  rationale: In der prophetischen Formel bewahrt „Wort“ den Bezug auf Gottes wirksame Offenbarung; „Botschaft“ wäre bereits stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֶל
  choice: an
  rationale: Bei der festen deutschen Verbindung „das Wort erging an“ bezeichnet „an“ idiomatisch den Empfänger.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname wird entsprechend der etablierten deutschen Bibeltradition wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv führt die unmittelbar folgende Rede ein. Im heutigen Deutsch übernimmt ein Doppelpunkt diese Funktion natürlicher als das formelhafte „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen in der heute üblichen deutschen Form, ohne ihn durch den Titel „der HERR“ zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe prophetische Einleitungsformel bleibt erhalten; der Doppelpunkt weist unmittelbar auf die in Vers 24 folgende Gottesrede voraus.
