source:
  edition: WLC
  text: בַּ/יָּמִ֤ים הָ/הֵם֙ וּ/בָ/עֵ֣ת הַ/הִ֔יא אַצְמִ֥יחַ לְ/דָוִ֖ד צֶ֣מַח צְדָקָ֑ה וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
translation:
  language: de
  text: In jenen Tagen und zu jener Zeit werde ich für David einen gerechten Spross[a][b] hervorsprießen lassen; er wird im Land Recht und Gerechtigkeit üben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Spross der Gerechtigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: „Spross“ greift wahrscheinlich die Verheißung eines davidischen Herrschers in Jeremia 23,5 auf.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: In jenen Tagen
  rationale: Gibt die übliche Zeitformel mit Präposition und Demonstrativ natürlich und genau wieder.
- source_word: וּבָעֵת הַהִיא
  choice: und zu jener Zeit
  rationale: Bewahrt den parallelen zweiten Zeitausdruck, ohne ihn mit dem ersten zusammenzuziehen.
- source_word: אַצְמִיחַ
  choice: werde ich ... hervorsprießen lassen
  rationale: Gibt den kausativen Hifil wieder und erhält das pflanzliche Bild der Wurzel צמח.
- source_word: לְדָוִד
  choice: für David
  rationale: Entspricht der naheliegenden relationalen beziehungsweise benefaktiven Bedeutung von לְ, ohne den Text zu „Haus Davids“ zu erweitern.
- source_word: צֶמַח
  choice: Spross
  rationale: Ein natürliches deutsches Wort für einen neuen Pflanzentrieb; im Kontext bezeichnet das Bild wahrscheinlich den verheißenen davidischen Herrscher.
- source_word: צְדָקָה
  choice: gerecht
  rationale: Gibt die attributive Sinnbeziehung in der Verbindung צֶמַח צְדָקָה idiomatisch wieder; die mögliche formale Wiedergabe „Spross der Gerechtigkeit“ bleibt in der Fußnote erhalten.
- source_word: וְעָשָׂה
  choice: er wird ... sorgen
  rationale: Das Verb setzt im prophetischen Zusammenhang die Zukunftsaussage fort. „Für ... sorgen“ ist im Deutschen eine natürliche Wiedergabe dafür, dass der Herrscher Recht und Gerechtigkeit verwirklicht.
- source_word: מִשְׁפָּט וּצְדָקָה
  choice: Recht und Gerechtigkeit
  rationale: Bewahrt die traditionelle und sachlich passende Paarung, wobei מִשְׁפָּט gerechte Rechtsordnung und צְדָקָה das rechte, gerechte Handeln bezeichnet.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Im Kontext Jeremias ist das Land Juda beziehungsweise Israel wahrscheinlicher als die gesamte Erde.
theological_decisions:
- issue: Messianisch-königliche Bedeutung von צֶמַח
  choice: „Spross“ als wahrscheinlich königlich-messianische Bezeichnung verstehen, jedoch nicht typografisch durch Großschreibung als Titel markieren, da deutsche Substantive ohnehin großgeschrieben werden.
  alternative: Das Wort ausschließlich als nichttitelhafte Pflanzenmetapher verstehen.
  rationale: Die deutliche Parallele zu Jeremia 23,5 verbindet den Spross mit einem davidischen Herrscher. Die Übersetzung wahrt zugleich das konkrete Pflanzenbild und fügt keine ausdrückliche Deutung in den Haupttext ein.
- issue: Zeitwert von וְעָשָׂה
  choice: 'Mit Zukunft wiedergeben: „er wird ... sorgen“.'
  alternative: 'Formal vergangenheitsnah: „und er tat/hat getan“.'
  rationale: Im prophetischen Vers führt die Verbform die mit אַצְמִיחַ begonnene Zukunftsverheißung fort; eine deutsche Vergangenheitsform wäre irreführend.
- issue: Bedeutungsbeziehung in צֶמַח צְדָקָה
  choice: „einen gerechten Spross“ im Haupttext.
  alternative: „einen Spross der Gerechtigkeit“ oder „einen rechtmäßigen Spross“.
  rationale: Die hebräische Nominalverbindung lässt mehr als eine Nuance zu. „Gerechter Spross“ ist im Deutschen natürlich und kontextuell gut begründet; die echte grammatisch-lexikalische Alternative wird in Fußnote [a] bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hervorsprießen lassen“ erhält bewusst das landwirtschaftliche Wortspiel zwischen dem Verb צמח und dem Substantiv צמח. Das Semikolon gliedert die göttliche Verheißung und das anschließende Handeln des Sprosses klar.
