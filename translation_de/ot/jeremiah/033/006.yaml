source:
  edition: WLC
  text: הִנְ/נִ֧י מַעֲלֶה לָּ֛/הּ אֲרֻכָ֥ה וּ/מַרְפֵּ֖א וּ/רְפָאתִ֑י/ם וְ/גִלֵּיתִ֣י לָ/הֶ֔ם עֲתֶ֥רֶת שָׁל֖וֹם וֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
translation:
  language: de
  text: Siehe, ich bringe ihr Heilung und Genesung; ich werde sie heilen und ihnen eine Fülle von Frieden und Wahrheit[a] offenbaren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Treue“ beziehungsweise „Verlässlichkeit“. Das hebräische Wort אֱמֶת kann Wahrheit, Zuverlässigkeit oder Treue bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Siehe
  rationale: Die deiktische Ankündigungsformel wird mit dem würdevollen, im prophetischen Sprachgebrauch vertrauten „Siehe“ wiedergegeben.
- source_word: מַעֲלֶה לָּהּ
  choice: ich bringe ihr
  rationale: Das Hifil-Partizip bezeichnet hier Gottes herbeiführendes Handeln; „bringe ihr“ bewahrt den Bezug auf die personifizierte Stadt und klingt im Deutschen natürlich.
- source_word: אֲרֻכָה וּמַרְפֵּא
  choice: Heilung und Genesung
  rationale: Die beiden eng verwandten medizinischen Begriffe werden differenziert wiedergegeben, ohne ihre bildhafte Aussage durch unnötig technische Sprache einzuengen.
- source_word: וּרְפָאתִים
  choice: Ich werde sie heilen
  rationale: Das Perfekt bezeichnet im prophetischen Zusammenhang eine zugesagte künftige Handlung. Das pluralische Suffix wird formal mit „sie“ bewahrt, auch wenn dessen Numerus im Deutschen nicht sichtbar ist.
- source_word: וְגִלֵּיתִי
  choice: offenbaren
  rationale: Das Verb bedeutet „aufdecken, enthüllen“; bei dem abstrakten Objekt ist „offenbaren“ eine natürliche und gehobene deutsche Entsprechung.
- source_word: עֲתֶרֶת
  choice: in Fülle
  rationale: Das Substantiv bezeichnet Überfluss oder Fülle. Die adverbiale Stellung ergibt einen klaren deutschen Satz und vermeidet eine Verwechslung mit dem ähnlich geschriebenen Wort für „Krone“.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: „Frieden“ ist die geläufige Entsprechung und trägt hier zugleich den weiteren Gedanken von Wohlergehen und Ganzheit mit.
- source_word: אֱמֶת
  choice: Wahrheit
  rationale: „Wahrheit“ ist eine direkte Wiedergabe; die ebenfalls mögliche Bedeutung „Treue“ wird wegen der semantischen Offenheit in einer Fußnote bewahrt.
theological_decisions:
- issue: Wechsel vom femininen Singular zum Plural
  choice: „ihr“ bezeichnet die personifizierte Stadt; „sie/ihnen“ bezeichnet ihre Bewohner beziehungsweise das Volk.
  alternative: Alle Pronomen vereinheitlichen und ausschließlich auf die Stadt beziehen.
  rationale: Der hebräische Text wechselt bewusst vom femininen Singular zum maskulinen Plural. Die Übersetzung glättet diesen Wechsel nicht, auch wenn das deutsche „sie“ den Numerusunterschied äußerlich nicht erkennen lässt.
- issue: Bedeutung von אֱמֶת
  choice: Im Haupttext steht „Wahrheit“.
  alternative: „Treue“ oder „Verlässlichkeit“.
  rationale: Der hebräische Begriff umfasst Wahrheit, Zuverlässigkeit und Treue. Die Hauptfassung entscheidet sich für die direkte Standardentsprechung, während die Fußnote die echte Bedeutungsalternative offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ton. Die kurze Ankündigungsformel „Siehe“ bleibt erhalten; medizinische Bildsprache und Pronomenwechsel werden nicht eingeebnet.
