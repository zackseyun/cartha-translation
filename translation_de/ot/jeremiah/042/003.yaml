  text: that Yahweh your God may tell us the way in which we should walk[a], and the thing that we should do.
translation:
  language: de
  text: damit Jahwe, dein Gott, uns sagt, welchen Weg wir gehen sollen und was wir tun sollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַגֶּד
  choice: damit … uns sagt
  rationale: Das Hifil von נגד steht hier im Zusammenhang der vorausgehenden Bitte. Die Konstruktion mit „damit“ gibt den Zweck beziehungsweise das erhoffte Ergebnis natürlich wieder, während „sagt“ den Mitteilungscharakter des Verbs wahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Das Suffix der zweiten Person Singular richtet sich an Jeremia; daher lautet die Anrede „dein Gott“.
- source_word: הַדֶּרֶךְ אֲשֶׁר נֵלֶךְ בָּהּ
  choice: welchen Weg wir gehen
  rationale: „Weg“ und „gehen“ bewahren das hebräische Bild, das sowohl eine konkrete Route als auch die einzuschlagende Handlungsweise bezeichnen kann.
- source_word: הַדָּבָר אֲשֶׁר נַעֲשֶׂה
  choice: was wir tun
  rationale: דבר bezeichnet hier im Parallelismus das, was getan werden soll. Das deutsche „was“ ist natürlicher als „die Sache“ und lässt den Bezug auf die geforderte Handlung offen.
- source_word: נֵלֶךְ / נַעֲשֶׂה
  choice: wir gehen / wir tun sollen
  rationale: „Sollen“ bringt die Bitte um göttliche Weisung zum Ausdruck, ohne eine bloße Zukunftsaussage oder einen übermäßig starken Zwang zu formulieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die knappe Satzstruktur entspricht dem Charakter des hebräischen Teilsatzes. Das Wegmotiv bleibt erhalten; zugleich klingt die Formulierung im Deutschen natürlich.
