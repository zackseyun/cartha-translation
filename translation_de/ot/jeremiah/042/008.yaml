  terminology: „Heerführer“ ist für שָׂרֵי הַחֲיָלִים eine knappe, sachgerechte Wiedergabe. „Das ganze Volk“ und „vom Geringsten bis zum Größten“ treffen den kollektiven beziehungsweise umfassenden Sinn der hebräischen Formulierungen. Die Namensformen Johanan und Kareach sind konsistent und brauchbar.
