  source_fidelity: Die Übersetzung gibt die narrative Fortführung durch וַיִּקְרָא, die drei angesprochenen Gruppen sowie die inklusive Rangformel לְמִקָּטֹן וְעַד גָּדוֹל zuverlässig wieder. Der Relativsatz „die bei ihm waren“ kann, wie im Hebräischen, natürlich auf die Heerführer bezogen werden; die mögliche referenzielle Knappheit des Singulars wird nicht unnötig aufgelöst.
