source:
  edition: WLC
  text: וַ/יִּקְרָ֗א אֶל יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֶ֛ל כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וּ/לְ/כָ֨ל הָ/עָ֔ם לְ/מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/008.yaml
  text: Then he called Johanan son of Kareah, all the commanders of the forces who were with him, and all the people, from the least to the greatest,
translation:
  language: de
  text: Dann rief er Johanan, den Sohn Kareachs, alle Heerführer, die bei ihm waren, und das ganze Volk, vom Geringsten bis zum Größten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Dann rief er
  rationale: Das narrative Waw führt die Handlung weiter; „Dann“ gibt die Abfolge in natürlichem Deutsch wieder. „rief“ entspricht der schlichten Bedeutung von קרא, ohne die stärkere Nuance von „beorderte“ einzutragen.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Johanan, den Sohn Kareachs
  rationale: Die Namen folgen der im Deutschen üblichen biblischen Form; der Genitiv „Kareachs“ gibt das Patronym klar und natürlich wieder.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: alle Heerführer
  rationale: שָׂרֵי bezeichnet hier militärische Anführer, während הַחֲיָלִים ihre Truppen beziehungsweise Streitkräfte näher bestimmt. „Heerführer“ bildet die gesamte Wortgruppe knapp, verständlich und kontextgerecht ab.
- source_word: אֲשֶׁר אִתּוֹ
  choice: die bei ihm waren
  rationale: Der Relativsatz bezieht sich am natürlichsten auf die Heerführer und bezeichnet ihre Zugehörigkeit beziehungsweise Anwesenheit bei Johanan.
- source_word: וּלְכָל הָעָם
  choice: und das ganze Volk
  rationale: Die Präposition לְ kennzeichnet eine weitere angesprochene Gruppe; nach „rief“ ist die direkte koordinierte Fügung im Deutschen idiomatisch. הָעָם bezeichnet hier die versammelte Volksgemeinschaft.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: vom Geringsten bis zum Größten
  rationale: Die feste Wendung umfasst alle gesellschaftlichen Rangstufen. „Geringsten“ und „Größten“ bewahren diesen idiomatischen Sinn besser als körperlich verstandene Größenangaben.
