source:
  edition: WLC
  text: אִם שׁ֤וֹב תֵּֽשְׁבוּ֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וּ/בָנִ֤יתִי אֶתְ/כֶם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וְ/נָטַעְתִּ֥י אֶתְ/כֶ֖ם וְ/לֹ֣א אֶתּ֑וֹשׁ כִּ֤י נִחַ֨מְתִּי֙ אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר עָשִׂ֖יתִי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
translation:
  language: de
  text: Wenn ihr wirklich in diesem Land bleibt,[a] werde ich euch aufbauen und nicht niederreißen; ich werde euch pflanzen und nicht ausreißen.[b] Denn ich lasse von dem Unheil ab, das ich euch zugefügt habe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Wenn ihr tatsächlich in diesem Land wohnen bleibt.“ Der hebräische Infinitivus absolutus vor dem finiten Verb verstärkt die Aussage.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde euch pflanzen und nicht entwurzeln.“'
    reason: lexical_alternative
  - marker: c
    text: Das hebräische Verb kann hier auch mit „ich habe das Unheil ... bedauert“ wiedergegeben werden. Es bezeichnet im Zusammenhang jedoch besonders das Ablassen von weiterem Gericht. „Unheil“ meint Unglück oder Verderben, nicht moralische Bosheit.
    reason: theological_clarification
lexical_decisions:
- source_word: אִם שׁוֹב תֵּשְׁבוּ
  choice: Wenn ihr wirklich ... bleibt
  rationale: אִם leitet die Bedingung ein; der Infinitivus absolutus שׁוֹב vor תֵּשְׁבוּ verstärkt das Bleiben. „Wirklich“ gibt diese Betonung natürlich wieder, ohne שׁוֹב fälschlich als eigenständiges „zurückkehren“ zu deuten.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: „Land“ bewahrt den geografischen und zugleich bundestheologisch anklingenden Sinn von אֶרֶץ.
- source_word: וּבָנִיתִי אֶתְכֶם וְלֹא אֶהֱרֹס
  choice: werde ich euch aufbauen und nicht niederreißen
  rationale: Die deutsche Verbfügung bewahrt den metaphorischen Gegensatz zwischen בנה und הרס und klingt in moderner Standardsprache natürlich.
- source_word: וְנָטַעְתִּי אֶתְכֶם וְלֹא אֶתּוֹשׁ
  choice: ich werde euch pflanzen und nicht ausreißen
  rationale: Die landwirtschaftliche Bildsprache wird erhalten. „Ausreißen“ bildet im Deutschen einen klaren Gegensatz zu „pflanzen“ und gibt נטשׁ in diesem Zusammenhang angemessen wieder.
- source_word: כִּי נִחַמְתִּי
  choice: Denn ich habe ... bedauert
  rationale: Das Perfekt נִחַמְתִּי wird als vollzogene innere Umwendung beziehungsweise als Bedauern über das verhängte Unheil wiedergegeben. „Bedauert“ bewahrt die anthropopathische Spannung besser als eine rein zukunftsbezogene Umschreibung und vermeidet die moralische Konnotation von „bereut“.
- source_word: אֶל הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet hier das in Gericht zugefügte Unglück beziehungsweise Unheil, nicht moralische Bosheit. „Unheil“ ist würdig, verständlich und lässt den harten Wortlaut bestehen.
- source_word: אֲשֶׁר עָשִׂיתִי לָכֶם
  choice: das ich euch angetan habe
  rationale: Die Formulierung gibt עשה mit ל eng und idiomatisch wieder. Sie bewahrt ausdrücklich Gott als Handelnden, statt die Aussage zum bloßen Zulassen abzuschwächen.
theological_decisions:
- issue: Göttliches נִחַמְתִּי in Bezug auf zuvor zugefügtes Unheil
  choice: ich habe das Unheil, das ich euch angetan habe, bedauert
  alternative: ich lasse von dem Unheil ab, das ich über euch gebracht habe
  rationale: Der gewählte Wortlaut hält daran fest, dass Gott selbst das Unheil zugefügt hat, und bewahrt zugleich die menschlich gefasste Aussage seines Bedauerns beziehungsweise seiner Umwendung. Er unterstellt Gott keine moralische Schuld, glättet die theologische Spannung aber auch nicht durch „zulassen“ oder eine unpersönliche Passivform.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener prophetischer Doppelmetaphorik („aufbauen/niederreißen“, „pflanzen/ausreißen“). Die Satzstruktur bleibt nah am Hebräischen, ohne im Deutschen hölzern zu wirken. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Aussagen.
