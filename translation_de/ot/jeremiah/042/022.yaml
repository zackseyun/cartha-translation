  source_fidelity: Die Übersetzung gibt den emphatischen Aufforderungscharakter von יָדֹעַ תֵּדְעוּ mit „sollt ihr mit Gewissheit wissen“ angemessen wieder. Die Todesankündigung sowie die Triade „Schwert, Hunger und Seuche“ entsprechen dem hebräischen Text. „an den ihr gehen wolltet, um dort als Fremde zu leben“ vermittelt sowohl den gewünschten Zielort als auch die Nuance von לָגוּר, dort als ansässige Fremde zu wohnen.
  naturalness: Modernes, klares und würdiges Standarddeutsch. Satzbau und Wortwahl sind idiomatisch; die knappe Formel „durch Schwert, Hunger und Seuche“ passt zum prophetischen Register.
  terminology: „Seuche“ ist für דֶּבֶר sachgerecht und vermeidet die zu enge Festlegung auf die historische Krankheit Pest. „Als Fremde zu leben“ bringt den Status des גּוּר-Aufenthalts verständlich zum Ausdruck. Der Fußnotenanker steht unmittelbar bei „Seuche“ und ist korrekt gesetzt.
