id: JER.42.22
reference: Jeremiah 42:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּה֙ יָדֹ֣עַ תֵּֽדְע֔וּ כִּ֗י בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר תָּמ֑וּתוּ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר חֲפַצְתֶּ֔ם לָ/ב֖וֹא לָ/ג֥וּר שָֽׁם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
translation:
  language: de
  text: 'Und nun sollt ihr mit Gewissheit wissen: Durch Schwert, Hunger und Seuche[a] werdet ihr an dem Ort sterben, an den ihr gehen wolltet, um dort als Fremde zu leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Pest. Das hebräische Wort kann allgemein eine epidemische Krankheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Gibt den folgernden Übergang aus dem vorangehenden Warnwort knapp und quellennah wieder.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: sollt ihr mit Gewissheit wissen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt das Wissen; die deutsche Formulierung bewahrt diesen Nachdruck natürlich.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדֶּבֶר
  choice: durch Schwert, Hunger und Seuche
  rationale: Bewahrt die parallele prophetische Gerichtsformel; »Seuche« gibt דֶּבֶר als epidemische Krankheit im heutigen Deutsch verständlich wieder.
- source_word: תָּמ֑וּתוּ
  choice: werdet ihr ... sterben
  rationale: Gibt die angekündigte Folge als bestimmte Zukunftsaussage wieder.
- source_word: אֲשֶׁר חֲפַצְתֶּם
  choice: an den ihr ... wolltet
  rationale: חפץ bezeichnet hier den eigenen Wunsch oder Willen der Angesprochenen, ohne dass eine stärkere emotionale Deutung nötig ist.
- source_word: לָבוֹא
  choice: gehen
  rationale: Im Deutschen ist aus der Perspektive der Angesprochenen »gehen« für die Bewegung zum gewählten Ziel natürlicher als »kommen«.
- source_word: לָגוּר שָׁם
  choice: um dort als Fremde zu leben
  rationale: גור bezeichnet den Aufenthalt als Fremder beziehungsweise Beisasse und nicht bloß ein neutrales Wohnen; die Formulierung ist verständlicher als das altertümliche »weilen«.
theological_decisions:
- issue: Wiedergabe der Gerichtsreihe חרב / רעב / דבר
  choice: durch Schwert, Hunger und Seuche
  alternative: durch Schwert, Hunger und Pest
  rationale: Die wiederkehrende prophetische Dreierformel bleibt erkennbar, ohne דֶּבֶר auf die historisch enger verstandene Krankheit Pest festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eindringliche Gewissheit der Warnung und die parallele Gerichtsreihe bleiben erhalten; »als Fremde zu leben« macht den sozialen Sinn von גור ohne altertümliche Ausdrucksweise sichtbar.
