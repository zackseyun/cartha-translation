source:
  edition: WLC
  text: וְ/אִם אֹמְרִ֣ים אַתֶּ֔ם לֹ֥א נֵשֵׁ֖ב בָּ/אָ֣רֶץ הַ/זֹּ֑את לְ/בִלְתִּ֣י שְׁמֹ֔עַ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/013.yaml
  text: But if you say[a], ‘We will not stay in this land,’ not obeying the voice of Yahweh your God—
translation:
  language: de
  text: 'Wenn ihr aber sagt: »Wir werden nicht in diesem Land bleiben«, um nicht auf die Stimme Jahwes, eures Gottes, zu hören[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „um der Stimme Jahwes, eures Gottes, nicht zu gehorchen“. Die hebräische Wendung „auf die Stimme hören“ schließt häufig gehorsames Handeln ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die nachgestellte adversative Partikel gibt den kontrastierenden Bedingungssatz im Deutschen natürlich wieder.
- source_word: אֹמְרִים אַתֶּם
  choice: ihr sagt
  rationale: Das hebräische Partizip mit ausdrücklich genanntem Pronomen bezeichnet hier im Bedingungssatz idiomatisch das Sagen der Angesprochenen.
- source_word: לֹא נֵשֵׁב
  choice: Wir werden nicht … bleiben
  rationale: יָשַׁב bezeichnet hier das Bleiben beziehungsweise Sich-Niederlassen im Land; „bleiben“ passt unmittelbar zur Entscheidung, Juda nicht zu verlassen.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: „Land“ bewahrt sowohl den geografischen als auch den bundestheologischen Klang von אֶרֶץ.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹל
  choice: und damit nicht auf die Stimme … hört
  rationale: Die Formulierung bewahrt das hebräische Bild des Hörens auf eine Stimme und lässt zugleich den in diesem Zusammenhang naheliegenden Sinn des Gehorchens erkennen. „Damit“ gibt die zielgerichtete beziehungsweise folgernde Beziehung wieder, ohne sie stärker als im Hebräischen festzulegen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in der im Deutschen etablierten Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Der Genitiv fügt sich natürlich an „Stimme Jahwes“ an und bewahrt die Bundesbeziehung der Anrede.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den persönlichen Gottesnamen; die Transliteration bewahrt diese Unterscheidung gegenüber einem bloßen Titel.
- issue: Bedeutung von שׁמע בְקול
  choice: auf die Stimme … hören
  alternative: der Stimme … gehorchen
  rationale: Die gewählte Form bewahrt sowohl das konkrete Sprachbild als auch die idiomatische Bedeutung gehorsamen Hörens; die Fußnote nennt die eindeutigere Sinnwiedergabe.
- issue: Funktion von לְבִלְתִּי
  choice: und damit nicht
  alternative: weil ihr nicht / ohne … zu
  rationale: Die Konstruktion kann eine Absicht oder eng verbundene Folge ausdrücken. „Damit“ erhält den Zielbezug, während „und“ den Anschluss an die zitierte Weigerung verständlich macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bleibt erhalten, weil der Satz in Vers 14 weitergeführt wird. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
