source:
  edition: WLC
  text: לֵ/אמֹ֗ר לֹ֚א כִּ֣י אֶ֤רֶץ מִצְרַ֨יִם֙ נָב֔וֹא אֲשֶׁ֤ר לֹֽא נִרְאֶה֙ מִלְחָמָ֔ה וְ/ק֥וֹל שׁוֹפָ֖ר לֹ֣א נִשְׁמָ֑ע וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב וְ/שָׁ֥ם נֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/014.yaml
  text: saying[a], ‘No, but we will go into the land of Egypt, where we will not see war, and we will not hear the sound of the trumpet, and we will not be hungry for bread; and there we will live.’
translation:
  language: de
  text: 'indem ihr sagt: »Nein, wir werden vielmehr ins Land Ägypten ziehen, wo wir keinen Krieg sehen, keinen Schall des Schofarhorns hören und nicht nach Brot hungern werden; dort werden wir wohnen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵאמֹר
  choice: indem ihr sagt
  rationale: Der Infinitiv führt den Inhalt der in Vers 13 begonnenen Bedingung ein. Im Deutschen stellt „indem ihr sagt“ den syntaktischen Anschluss und die direkte Rede natürlich her.
- source_word: לֹא כִּי
  choice: Nein, … vielmehr
  rationale: Die Verbindung weist das zuvor Gesagte entschieden zurück und leitet den gegenteiligen Entschluss ein. „Nein … vielmehr“ bewahrt diese adversative Kraft.
- source_word: אֶרֶץ מִצְרַיִם נָבוֹא
  choice: wir werden ins Land Ägypten ziehen
  rationale: בוא bezeichnet hier die Bewegung in ein Zielgebiet hinein. „Ins Land Ägypten ziehen“ gibt sowohl das ausdrücklich genannte „Land“ als auch die beabsichtigte Übersiedlung idiomatisch wieder.
- source_word: לֹא נִרְאֶה מִלְחָמָה
  choice: wir keinen Krieg sehen
  rationale: Die konkrete hebräische Wendung „Krieg sehen“ bleibt erhalten; sie ist auch im Deutschen verständlich und vermeidet die stärker deutende Wiedergabe „erleben“.
- source_word: קוֹל שׁוֹפָר
  choice: Schall des Schofarhorns
  rationale: שׁוֹפָר bezeichnet das charakteristische Signalhorn. „Schofarhorn“ ist genauer als das allgemeinere „Trompete“, während „Schall“ die Konstruktion mit קוֹל wiedergibt.
- source_word: לֹא נִשְׁמָע
  choice: nicht … hören
  rationale: 'Die Form wird im Zusammenhang der parallelen Verben der ersten Person Plural natürlich aktivisch wiedergegeben: „wir … hören“.'
- source_word: וְלַלֶּחֶם לֹא נִרְעָב
  choice: nicht nach Brot hungern
  rationale: „Nach Brot hungern“ bewahrt die Präposition und das konkrete Grundnahrungsmittel, klingt zugleich in modernem Deutsch natürlich.
- source_word: וְשָׁם נֵשֵׁב
  choice: dort werden wir wohnen
  rationale: ישׁב kann sitzen, bleiben oder wohnen bedeuten. Im Zusammenhang einer geplanten Übersiedlung bezeichnet „wohnen“ am ehesten den dauerhaften Aufenthalt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt entschieden und rhythmisch; die dreifache Erwartung von Sicherheit und Versorgung wird ohne zusätzliche Deutung wiedergegeben. Der Anschluss „indem ihr sagt“ macht deutlich, dass der Vers syntaktisch die Bedingung des vorherigen Verses fortsetzt.
