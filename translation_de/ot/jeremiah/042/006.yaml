  text: אִם ט֣וֹב וְ/אִם רָ֔ע בְּ/ק֣וֹל יְהוָ֣ה אֱלֹהֵ֗י/נוּ אֲשֶׁ֨ר אנו שֹׁלְחִ֥ים אֹתְ/ךָ֛ אֵלָ֖י/ו נִשְׁמָ֑ע לְמַ֨עַן֙ אֲשֶׁ֣ר יִֽיטַב לָ֔/נוּ כִּ֣י נִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: de
  text: 'Ob es gut oder schlecht ist: Wir werden auf die Stimme des HERRN, unseres Gottes, hören, zu dem wir dich senden, damit es uns gut geht, wenn wir auf die Stimme des HERRN, unseres Gottes, hören.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  choice: Ob es gut oder schlecht ist
  rationale: Gibt die konditionale Alternative natürlich und knapp wieder; gemeint ist, ob die erteilte Weisung den Sprechern günstig oder ungünstig erscheint.
- source_word: בְּקוֹל ... נִשְׁמָע
  choice: auf die Stimme ... hören
  rationale: Bewahrt das hebräische Bild und umfasst im Deutschen kontextgemäß sowohl Hören als auch Gehorchen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Entspricht der etablierten deutschen Wiedergabe des Gottesnamens in Bibelübersetzungen.
- source_word: לְמַעַן אֲשֶׁר יִיטַב לָנוּ
  choice: Dann wird es uns gut gehen
  rationale: Drückt den bezweckten beziehungsweise erwarteten guten Ausgang idiomatisch aus.
- source_word: כִּי נִשְׁמַע
  choice: wenn wir ... hören
  rationale: כִּי kann hier den Umstand beziehungsweise die Bedingung bezeichnen, unter der es ihnen gut gehen wird; die Wiedergabe wahrt den Zusammenhang, ohne einen mechanischen Kausalzusammenhang überzubetonen.
theological_decisions:
- issue: Verhältnis zwischen Gehorsam und Wohlergehen
  choice: „wenn wir ... hören“
  alternative: „weil wir ... hören“
  rationale: Das hebräische כִּי lässt im Kontext eine konditionale beziehungsweise umstandsbezogene Lesart zu. Sie bewahrt die Aussage, dass das Wohlergehen mit dem Hören auf Gottes Stimme verbunden ist, ohne eine weitergehende dogmatische Kausalformel einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „auf die Stimme des HERRN, unseres Gottes, hören“ wurde als rhetorisch und inhaltlich bedeutsame Entsprechung des Hebräischen beibehalten.
