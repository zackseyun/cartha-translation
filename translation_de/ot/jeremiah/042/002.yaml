  text: וַ/יֹּאמְר֞וּ אֶֽל יִרְמְיָ֣הוּ הַ/נָּבִ֗יא תִּפָּל נָ֤א תְחִנָּתֵ֨/נוּ֙ לְ/פָנֶ֔י/ךָ וְ/הִתְפַּלֵּ֤ל בַּעֲדֵ֨/נוּ֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּעַ֖ד כָּל הַ/שְּׁאֵרִ֣ית הַ/זֹּ֑את כִּֽי נִשְׁאַ֤רְנוּ מְעַט֙ מֵֽ/הַרְבֵּ֔ה כַּ/אֲשֶׁ֥ר עֵינֶ֖י/ךָ רֹא֥וֹת אֹתָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
translation:
  language: de
  text: 'Da sagten sie zu dem Propheten Jeremia: „Bitte lass unser Flehen vor dich kommen[a] und bete für uns zu Jahwe, deinem Gott, für diesen ganzen Rest[b]. Denn von den vielen sind nur wenige von uns übrig geblieben, wie du mit eigenen Augen siehst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Lass doch unser Flehen vor dir niederfallen“; eine hebräische Wendung für das eindringliche Vorbringen einer Bitte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „für all diesen Rest“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפָּל נָא תְחִנָּתֵנוּ לְפָנֶיךָ
  choice: Bitte lass unser Flehen vor dich kommen
  rationale: Die Wendung bedeutet wörtlich, dass das Flehen vor Jeremia ‚fallen‘ möge. „Vor dich kommen“ gibt die hebräische Bittformel in natürlichem, würdevollem Deutsch wieder; die Bildlichkeit wird in der Fußnote kenntlich gemacht.
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  choice: und bete für uns
  rationale: Die Form von פלל bezeichnet hier das Beten zugunsten anderer. „Bete für uns“ ist klar und weniger deutend als „tritt für uns ein“.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Jahwe, deinem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben. Das Possessivsuffix bleibt als „deinem Gott“ erhalten und bewahrt die auffällige Distanzierung der Sprecher.
- source_word: בְּעַד כָּל הַשְּׁאֵרִית הַזֹּאת
  choice: für diesen ganzen Rest
  rationale: „Rest“ bewahrt den in Jeremia wichtigen Begriff שְׁאֵרִית. Die Stellung „diesen ganzen Rest“ entspricht natürlichem Deutsch und erhält den Umfangsausdruck כָּל.
- source_word: כִּי נִשְׁאַרְנוּ מְעַט מֵהַרְבֵּה
  choice: Denn von den vielen sind nur wenige von uns übrig geblieben
  rationale: Die Übersetzung macht den Kontrast zwischen der früheren Vielzahl und der jetzt kleinen Gruppe deutlich, ohne den Sinn über die hebräische Aussage hinaus festzulegen.
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  choice: wie du mit eigenen Augen siehst
  rationale: Die geläufige deutsche Wendung erhält den ausdrücklichen Bezug auf Jeremias Augen und gibt den Appell an seine unmittelbare Wahrnehmung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Beibehaltung der Rest-Terminologie
  choice: Rest
  alternative: Überlebende
  rationale: „Rest“ entspricht שְׁאֵרִית und bewahrt dessen wiederkehrende prophetische und theologische Bedeutung, ohne die Gruppe ausschließlich als Überlebende zu interpretieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die direkte Rede bleibt eindringlich, ohne altertümliche Formen; die hebräische Bildsprache der Bitte wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
