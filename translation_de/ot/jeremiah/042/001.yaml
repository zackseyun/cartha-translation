source:
  edition: WLC
  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
translation:
  language: de
  text: Da traten alle Befehlshaber der Truppen[a], Jochanan, Kareachs Sohn, Jisanja, Hoschajas Sohn, und das ganze Volk vom Geringsten bis zum Größten[b] heran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: alle Heerführer; alle Offiziere der Truppen.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „vom Geringsten bis zum Größten“ meint alle Menschen quer durch die ganze Gemeinschaft.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: Da traten … heran
  rationale: נגשׁ bezeichnet hier im erzählenden Wayyiqtol das Näherkommen. „herantreten“ ist im Deutschen natürlich und lässt das im Kontext erschlossene Ziel der Bewegung unausgesprochen.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  choice: alle Befehlshaber der Truppen
  rationale: שָׂרֵי bezeichnet militärische Führer oder Befehlshaber; חֲיָלִים meint hier Truppen beziehungsweise Streitkräfte. Die Wiedergabe ist klar, modern und bewahrt den militärischen Sinn.
- source_word: וְיוֹחָנָן בֶּן־קָרֵחַ
  choice: Jochanan, der Sohn Kareachs
  rationale: Die Namen werden lautnah aus dem Hebräischen wiedergegeben. Die Formulierung mit „der Sohn“ entspricht natürlichem modernem Deutsch.
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  choice: Jisanja, der Sohn Hoschajas
  rationale: „Jisanja“ bildet die hebräische Namensform יזניה lautnah ab; „Hoschaja“ entspricht הושעיה. Damit wird keine von Übersetzungstraditionen geprägte englische Namensform übernommen.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: הָעָם ist die gewöhnliche kollektive Bezeichnung für das Volk beziehungsweise die gesamte anwesende Gemeinschaft.
- source_word: מִקָּטֹן וְעַד־גָּדוֹל
  choice: vom Geringsten bis zum Größten
  rationale: Die formelhafte Spannweite schließt Menschen aller gesellschaftlichen Stellungen ein. Die deutsche Form bewahrt das Merisma, ohne es auf Alter oder Körpergröße zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Aufzählung übersichtlich; „herantraten“ bewahrt die Bewegung des hebräischen Verbs. Die Personennamen sind möglichst lautnah nach dem Hebräischen wiedergegeben.
