source:
  edition: WLC
  text: וָ/אַגִּ֥ד לָ/כֶ֖ם הַ/יּ֑וֹם וְ/לֹ֣א שְׁמַעְתֶּ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/לְ/כֹ֖ל אֲשֶׁר שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/021.yaml
  text: I have told you today[a], but you have not obeyed the voice of Yahweh your God or anything for which he sent me to you.
translation:
  language: de
  text: Ich habe es euch heute mitgeteilt, doch ihr habt weder auf die Stimme Jahwes, eures Gottes, noch auf all das gehört, womit er mich zu euch gesandt hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »… und ihr habt nicht auf die Stimme Jahwes, eures Gottes, und auf alles gehört, womit er mich zu euch gesandt hat.«'
    reason: Die Fußnote zeigt die hebräische Koordination mit »und«, die im Deutschen wegen der über beide Satzglieder reichenden Verneinung idiomatisch als »weder … noch« wiedergegeben wird.
lexical_decisions:
- source_word: וָאַגִּד
  choice: Ich habe es … mitgeteilt
  rationale: Das Hifil von נגד bedeutet hier »mitteilen, kundtun«. Das deutsche Perfekt bezeichnet die abgeschlossene Mitteilung mit fortdauernder Bedeutung; »es« nimmt Jeremias überbrachte Botschaft aus dem Kontext auf.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die adverbiale Zeitangabe wird unmittelbar und idiomatisch mit »heute« wiedergegeben.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹל
  choice: doch ihr habt … nicht auf die Stimme … gehört
  rationale: שׁמע בקול bezeichnet ein Hören, das Gehorsam einschließt. »Auf die Stimme hören« bewahrt sowohl das hebräische Bild als auch den Sinn des Gehorchens.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיכֶם
  choice: eures Gottes
  rationale: Die Apposition gibt den Pluralsuffix der zweiten Person präzise wieder und ist nach »Jahwes« im Deutschen natürlich.
- source_word: וּלְכֹל אֲשֶׁר שְׁלָחַנִי אֲלֵיכֶם
  choice: noch auf all das …, womit er mich zu euch gesandt hat
  rationale: Die Fortführung mit לְ hängt ebenfalls von שׁמע ab. Die Konstruktion »womit er mich … gesandt hat« macht die im Hebräischen knappe Angabe des überbrachten Auftrags verständlich, ohne dessen Inhalt näher festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt den Eigennamen, während »der HERR« ihn durch einen Titel ersetzen würde.
- issue: Bedeutungsumfang von שׁמע בקול
  choice: auf die Stimme hören
  alternative: gehorchen
  rationale: Die gewählte Formulierung lässt sowohl das konkrete Hören als auch den in diesem Ausdruck enthaltenen Gehorsamsgedanken erkennen und vermeidet eine unnötige Verengung.
- issue: Bezug des letzten Satzglieds
  choice: 'als zweites Objekt des Hörens: »noch auf all das«'
  alternative: 'adverbial: »in nichts von allem«'
  rationale: Das zweite לְ-Glied ist am natürlichsten parallel zu בְּקוֹל als Gegenstand des unterlassenen Hörens zu verstehen. Die negative Paarform »weder … noch« macht diese Koordination im Deutschen deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Mitgeteilt« ist allgemein verständlich; »auf die Stimme hören« wahrt die Bildsprache und den Gehorsamssinn. Die Paarform »weder … noch« bildet den Geltungsbereich der hebräischen Verneinung natürlich ab.
