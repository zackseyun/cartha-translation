source:
  edition: WLC
  text: וְ/עַתָּ֕ה לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּ/ן פְּנֵי/כֶם֙ לָ/בֹ֣א מִצְרַ֔יִם וּ/בָאתֶ֖ם לָ/ג֥וּר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
translation:
  language: de
  text: 'Darum hört nun das Wort Jahwes, ihr Übriggebliebenen von Juda! So spricht Jahwe der Heerscharen, der Gott Israels: Wenn ihr fest entschlossen seid, nach Ägypten zu ziehen und euch dort als Fremde aufzuhalten,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Wenn ihr entschlossen eure Gesichter darauf richtet, nach Ägypten zu ziehen, und hingeht, um euch dort als Fremde aufzuhalten.“ Die hebräische Wendung drückt einen festen Entschluss aus.'
    reason: Bewahrt das Körperbild des hebräischen Idioms, die Verstärkung durch Infinitivus absolutus und finites Verb sowie den durch גור bezeichneten Fremdenstatus.
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  choice: Und nun hört deshalb
  rationale: Die Verbindung bewahrt sowohl den zeitlichen Übergang als auch die folgernde, feierliche Zuspitzung; im Deutschen wird sie natürlich mit dem folgenden Imperativ verbunden.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: hört das Wort Jahwes
  rationale: „Hört“ wahrt den gewichtigen prophetischen Aufruf; „Wort Jahwes“ entspricht der festen Botenformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: ihr Übriggebliebenen von Juda
  rationale: Die Anrede bezeichnet konkret die überlebende Restgemeinschaft. „Übriggebliebene“ ist im heutigen Deutsch unmittelbarer verständlich als das stärker fachsprachlich klingende „Rest“.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Dies ist die etablierte und performativ passende deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Die traditionelle Sachentsprechung „Heerscharen“ lässt die militärischen und kosmischen Bezüge des Titels offen und ersetzt den Gottesnamen nicht durch einen Titel.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte, natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂימוּן פְּנֵיכֶם
  choice: Wenn ihr fest entschlossen seid
  rationale: Infinitivus absolutus und finites Verb verstärken die Aussage; die Wendung „das Gesicht richten“ bezeichnet hier einen festen Entschluss. Die Bildlichkeit wird in der Fußnote bewahrt.
- source_word: לָבֹא מִצְרַיִם
  choice: nach Ägypten zu ziehen
  rationale: בוא mit Zielangabe meint hier die Bewegung nach Ägypten; „ziehen“ passt natürlich zur geplanten Migration der Gruppe.
- source_word: וּבָאתֶם לָגוּר שָׁם
  choice: und dorthin zu gehen, um dort als Fremde zu leben
  rationale: Die fortgesetzte Bedingung und das zweite Bewegungsverb bleiben erkennbar. גור bezeichnet den Aufenthalt als Schutzbürger oder Fremder, ohne zwingend eine genaue Dauer festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Armeen; Jahwe Zebaot
  rationale: „Heerscharen“ bewahrt die Breite des Titels, ohne ihn ausschließlich auf menschliche Armeen oder eine einzelne theologische Deutung festzulegen.
- issue: Status des Aufenthalts in Ägypten
  choice: als Fremde zu leben
  alternative: sich vorübergehend aufzuhalten; sich niederzulassen
  rationale: גור betont den rechtlich-sozialen Status als Fremde beziehungsweise Beisassen. Die Übersetzung behauptet weder sicher einen nur kurzen Aufenthalt noch eine dauerhafte Ansiedlung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Der Satz bleibt als bedingender Vordersatz offen, weil er im folgenden Vers fortgeführt wird. „Jahwe“ wird konsequent als Eigenname gebraucht; „Heerscharen“ wahrt den traditionellen Bedeutungsumfang des Titels.
