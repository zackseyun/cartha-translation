revisions:
- from: 'Und sie sagten zu Jeremia: „Yahweh sei ein wahrer und zuverlässiger Zeuge gegen uns[a], wenn wir nicht genau nach der ganzen Botschaft handeln, mit der Yahweh, dein Gott, dich zu uns sendet[b].“'
  to: 'Und sie sagten zu Jeremia: „Yahweh sei ein wahrer und zuverlässiger Zeuge gegen uns[a], wenn wir nicht gemäß allem handeln, wozu Yahweh, dein Gott, dich zu uns sendet[b].“'
  rationale: 'Die Revision stellt die hebräische Sendekonstruktion wieder her: Yahweh sendet Jeremia zu den Sprechern, und diese verpflichten sich, gemäß allem zu handeln, wozu er gesandt wird. Zugleich bleibt die kontextuell starke, aber nicht rein wörtliche Deutung von בָּנוּ als „gegen uns“ transparent in der Fußnote. Die korrigierte Fußnote b unterscheidet sauber zwischen der engeren Struktur des Hebräischen und der sinnentfaltenden Botschaftslesart.'
