base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
translation:
  language: de
  text: 'Und sie sagten zu Jeremia: „Yahweh sei ein wahrer und zuverlässiger Zeuge gegen uns[a], wenn wir nicht gemäß allem handeln, wozu Yahweh, dein Gott, dich zu uns sendet[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein wahrer und zuverlässiger Zeuge unter uns“. Wörtlich steht im Hebräischen „in/unter uns“; im Zusammenhang dieses Schwurs ist wahrscheinlich gemeint, dass Yahweh gegen sie zeugt, falls sie nicht gehorchen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „gemäß allem, wozu Yahweh, dein Gott, dich zu uns sendet“. Das Hebräische nennt Jeremia als den Gesandten; die Botschaft, die er überbringt, ist aus dem Zusammenhang erschlossen. Auch möglich: „gemäß der ganzen Botschaft, die Yahweh, dein Gott, uns durch dich übermittelt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: sei
  rationale: Der Jussiv drückt hier in einer feierlichen Selbstverpflichtung eine Anrufung aus; „sei“ ist im Deutschen knapp, würdig und natürlich.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: בָּנוּ לְעֵד
  choice: ein Zeuge gegen uns
  rationale: Wörtlich steht „in/unter uns zum Zeugen“; im Zusammenhang des Schwurs bezeichnet die Wendung wahrscheinlich Yahweh als Zeugen gegen die Sprecher, falls sie nicht gehorchen.
- source_word: אֱמֶת וְנֶאֱמָן
  choice: wahr und zuverlässig
  rationale: Die beiden Ausdrücke betonen Wahrheit und Verlässlichkeit des angerufenen Zeugen. „Zuverlässig“ gibt נֶאֱמָן in diesem juristischen Zusammenhang natürlich wieder.
- source_word: אִם לֹא
  choice: wenn wir nicht
  rationale: Die Schwurformel führt die Bedingung an, unter der Yahweh gegen die Sprecher als Zeuge auftreten soll.
- source_word: כְּכָל הַדָּבָר
  choice: genau nach der ganzen Botschaft
  rationale: דָּבָר bezeichnet hier die vollständige göttliche Mitteilung. „Botschaft“ ist im Deutschen verständlicher als das formale „Wort“, während כְּכָל die umfassende Übereinstimmung ausdrückt.
- source_word: יִשְׁלָחֲךָ ... אֵלֵינוּ
  choice: mit der ... dich zu uns sendet
  rationale: Die hebräische Formulierung sagt unmittelbar, dass Yahweh Jeremia zu ihnen sendet; die Botschaft ist aus dem Zusammenhang als Inhalt seines Auftrags erschlossen.
- source_word: אֱלֹהֶיךָ
  choice: dein Gott
  rationale: Der singularische Suffix der zweiten Person wird bewahrt; die Formulierung wird nicht zu „unser Gott“ harmonisiert.
- source_word: כֵּן נַעֲשֶׂה
  choice: genau ... handeln
  rationale: Die idiomatische Einbindung in den deutschen Bedingungssatz gibt das versprochene entsprechende Handeln wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt diesen gegenüber der Ersetzung durch einen Titel.
- issue: Die Anrede „dein Gott“
  choice: dein Gott
  alternative: unser Gott
  rationale: Der hebräische Text spricht Jeremia ausdrücklich in der zweiten Person Singular an. Die mögliche relationale Distanz bleibt daher erhalten.
- issue: Richtung der Zeugenschaft
  choice: Zeuge gegen uns
  alternative: Zeuge unter uns
  rationale: Der Schwurzusammenhang legt die forensische Bedeutung „gegen uns“ nahe, doch die räumlich formulierte hebräische Wendung bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Schwurform bleibt erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisch entfaltet, wo der hebräische Zusammenhang die Ergänzung trägt. Sämtliche Fußnotenmarker stehen im Haupttext.
