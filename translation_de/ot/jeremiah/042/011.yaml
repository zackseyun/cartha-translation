id: JER.42.11
reference: Jeremiah 42:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
translation:
  language: de
  text: Fürchtet euch nicht vor dem König von Babel, vor dem ihr euch fürchtet. Fürchtet euch nicht vor ihm, spricht Jahwe[a]; denn ich bin mit euch, um euch zu retten und euch aus seiner Hand zu befreien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: der HERR.'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  choice: fürchtet euch / euch fürchtet
  rationale: Die Wiederholung derselben hebräischen Wurzel ירא wird im Deutschen bewahrt. Die partizipiale Form bezeichnet die gegenwärtige, anhaltende Furcht.
- source_word: מִפְּנֵי ... מִפָּנָיו
  choice: vor dem König von Babel, vor dem ihr euch fürchtet
  rationale: Nach ירא bezeichnet die Wendung mit מן und פנים den Gegenstand der Furcht. Deutsch »sich vor jemandem fürchten« gibt sowohl den Sinn als auch die wiederholte Präposition natürlich wieder.
- source_word: מֶלֶךְ בָּבֶל
  choice: der König von Babel
  rationale: Dies ist die geläufige deutsche Wiedergabe der hebräischen Status-constructus-Verbindung und entspricht dem alttestamentlichen Ortsnamen Babel.
- source_word: מִמֶּנּוּ
  choice: vor ihm
  rationale: Mit »sich fürchten« verlangt natürliches Deutsch die Präposition »vor«; zugleich bleibt die hebräische Wiederholung ausdrücklich erhalten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: »Spricht Jahwe« ist eine klare, würdige und im prophetischen Kontext geläufige Wiedergabe der Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כִּי אִתְּכֶם אָנִי
  choice: denn ich bin mit euch
  rationale: »Denn« gibt die Begründung des Verbots wieder; die Stellung des Pronomens im Hebräischen hebt Gottes persönliche Gegenwart hervor, die im Deutschen durch »ich« erhalten bleibt.
- source_word: לְהוֹשִׁיעַ
  choice: um euch zu retten
  rationale: Der Hifil von ישׁע bezeichnet hier rettendes Eingreifen. Die finale Konstruktion mit »um ... zu« gibt den Infinitiv mit לְ idiomatisch wieder.
- source_word: וּלְהַצִּיל
  choice: und euch ... zu befreien
  rationale: נצל wird von ישׁע lexikalisch unterschieden. »Befreien« bezeichnet die Herauslösung aus der Gewalt des Königs und vermeidet eine bloße Wiederholung von »retten«.
- source_word: מִיָּדוֹ
  choice: aus seiner Hand
  rationale: Das Bild der Hand als Macht- und Herrschaftsbereich bleibt erhalten und ist im Deutschen verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton unmittelbar. Die Transliteration »Jahwe« wahrt den Eigennamen, während »der HERR« ihn durch einen ehrerbietigen Titel ersetzt; die gebräuchliche Alternative wird in einer Fußnote genannt.
- issue: Verhältnis von Gottes Gegenwart und Rettung
  choice: denn ich bin mit euch, um euch zu retten und euch ... zu befreien
  alternative: denn ich bin mit euch und werde euch retten und befreien
  rationale: Die Infinitive mit לְ werden als Zweckbestimmung der göttlichen Gegenwart wiedergegeben. Eine Umformung in bloße Zukunftsaussagen wäre möglich, würde aber die grammatische Beziehung weniger genau abbilden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die eindringliche dreifache Wiederaufnahme von »fürchten« beziehungsweise »vor« wird bewusst bewahrt. »Babel« folgt der im deutschen Alten Testament geläufigen Bezeichnung; »aus seiner Hand« erhält das verständliche biblische Machtbild.
