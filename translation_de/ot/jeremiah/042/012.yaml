  text: וְ/אֶתֵּ֥ן לָ/כֶ֛ם רַחֲמִ֖ים וְ/רִחַ֣ם אֶתְ/כֶ֑ם וְ/הֵשִׁ֥יב אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
translation:
  language: de
  text: Und ich werde euch Erbarmen schenken, und er wird sich über euch erbarmen und euch in euer Land zurückbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶתֵּן לָ/כֶם רַחֲמִים
  choice: Und ich werde euch Erbarmen schenken
  rationale: נתן bedeutet wörtlich „geben“; mit dem abstrakten Objekt רַחֲמִים ist „Erbarmen schenken“ im Deutschen natürlich und bewahrt zugleich die Aussage des göttlichen Versprechens.
- source_word: וְ/רִחַם אֶתְ/כֶם
  choice: und er wird sich über euch erbarmen
  rationale: Die Wiedergabe mit „erbarmen“ erhält den Wortzusammenhang mit רַחֲמִים („Erbarmen“). Die dritte Person Singular bleibt erhalten und bezeichnet im Kontext den König von Babylon.
- source_word: וְ/הֵשִׁיב אֶתְ/כֶם
  choice: und euch … zurückbringen
  rationale: Der Hifil von שוב bezeichnet ein Veranlassen der Rückkehr. „Zurückbringen“ gibt diesen kausativen Sinn klar und idiomatisch wieder.
- source_word: אֶל אַדְמַתְ/כֶם
  choice: in euer Land
  rationale: אֶל bezeichnet die Bewegungsrichtung; אַדְמָה meint hier das eigene Land beziehungsweise den Heimatboden. „In euer Land“ ist im Deutschen bei „zurückbringen“ die natürliche Formulierung.
theological_decisions:
- issue: Wechsel vom göttlichen Ich zur dritten Person Singular
  choice: 'Der Wechsel bleibt erhalten: „ich werde … schenken, und er wird … sich erbarmen und … zurückbringen“.'
  alternative: 'Alle Verben auf Gott als Subjekt beziehen: „ich werde … mich erbarmen und euch zurückbringen“.'
  rationale: Der hebräische Text wechselt ausdrücklich von der ersten Person Singular אֶתֵּן zu den Formen der dritten Person Singular רִחַם und הֵשִׁיב. Im Zusammenhang ist der König von Babylon der menschliche Handelnde, dessen Erbarmen Gott gewährt; eine Vereinheitlichung würde die grammatische und theologische Spannung glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Erbarmen … erbarmen“ ist bewusst beibehalten, weil sie den hebräischen Wortklang und Sinnzusammenhang abbildet. Der Subjektwechsel wird nicht geglättet.
