source:
  edition: WLC
  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
translation:
  language: de
  text: Dann wird das Schwert, vor dem ihr euch fürchtet, euch dort im Land Ägypten einholen, und die Hungersnot, um die ihr euch sorgt, wird euch dort in Ägypten hartnäckig folgen[a], und dort werdet ihr sterben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird hinter euch haften“; das Bild bezeichnet eine unerbittliche Verfolgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Dann wird
  rationale: Leitet als Folge der vorausgehenden Warnung eine zukünftige Konsequenz ein; die deutsche Form ist natürlich und bewahrt die Vorhersagekraft.
- source_word: הַחֶרֶב
  choice: das Schwert
  rationale: Bewahrt das konkrete prophetische Bild, das hier zugleich für gewaltsamen Tod durch Krieg stehen kann.
- source_word: יְרֵאִים מִמֶּנָּה
  choice: vor dem ihr euch fürchtet
  rationale: Gibt ירא mit מן direkt und idiomatisch wieder, ohne die Intensität unnötig zu steigern.
- source_word: תַּשִּׂיג אֶתְכֶם
  choice: wird euch ... einholen
  rationale: Das Hifil von נשׂג bezeichnet häufig das Einholen oder Erreichen eines Verfolgten und passt zum Bild unausweichlicher Verfolgung.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: dort im Land Ägypten
  rationale: Bewahrt sowohl שָׁם als auch die volle geografische Bezeichnung und betont Ägypten als den vermeintlichen Zufluchtsort.
- source_word: הָרָעָב
  choice: der Hunger
  rationale: Im Kontext bezeichnet רָעָב eine Hungersnot; die konkrete deutsche Wendung „der Hunger“ erhält jedoch die Parallelität mit „das Schwert“ und ist im Zusammenhang eindeutig.
- source_word: דֹּאֲגִים מִמֶּנּוּ
  choice: um den ihr euch sorgt
  rationale: דאג bezeichnet besorgte, angstvolle Unruhe; „sich sorgen um“ gibt diese Nuance natürlicher und genauer wieder als ein zweites „fürchten“.
- source_word: יִדְבַּק אַחֲרֵיכֶם
  choice: wird euch ... hartnäckig folgen
  rationale: דבק mit אחרי zeichnet wörtlich ein Anhaften hinter jemandem; die Formulierung gibt das Bild unerbittlicher Verfolgung in natürlichem Deutsch wieder.
- source_word: וְשָׁם תָּמֻתוּ
  choice: dort werdet ihr sterben
  rationale: Direkte Zukunftsaussage; das wiederholte „dort“ bleibt wegen seiner rhetorischen Betonung erhalten.
theological_decisions:
- issue: Bedeutung der Gerichtsbegriffe „Schwert“ und „Hunger“
  choice: Die konkreten Bilder werden beibehalten.
  alternative: Gewaltsamer Tod und Verhungern beziehungsweise Krieg und Hungersnot.
  rationale: Der hebräische Text verwendet anschauliche prophetische Gerichtsbegriffe. Ihre Beibehaltung vermeidet eine auslegende Verengung und wahrt ihre theologische und rhetorische Kraft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Ortsbetonung durch „dort“ und die konkreten prophetischen Bilder bleiben erhalten; der hebräische Parallelismus wird in natürlicher deutscher Syntax wiedergegeben.
