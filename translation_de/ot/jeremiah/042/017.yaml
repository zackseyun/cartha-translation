revisions:
- from: Alle Menschen[a], die fest entschlossen sind, nach Ägypten zu ziehen, um dort als Fremde zu leben, werden durch Schwert, Hunger und Pest sterben. Keiner von ihnen wird das Unheil, das ich über sie bringe, überleben oder ihm entkommen[b].
  to: Alle Männer, die entschlossen sind, nach Ägypten zu ziehen, um dort als Fremde zu leben, werden durch das Schwert, durch Hungersnot und durch Seuche sterben. Keiner von ihnen wird als Überlebender übrig bleiben oder dem Unheil entkommen, das ich über sie bringe.[a]
  rationale: Die Überarbeitung stellt die maskuline Referenz von אֲנָשִׁים wieder her und ersetzt das im Deutschen möglicherweise zu spezifische „Pest“ durch „Seuche“. Zugleich wird das hebräische Paar „Überlebender/Entkommener“ in der Übersetzung und in einer korrekt verankerten Fußnote erkennbar gehalten. Bedeutung, Gerichtsschärfe und die ausdrückliche göttliche Handlung bleiben unverändert.
