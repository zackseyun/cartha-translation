  source_fidelity: Die Aussage über das Gericht, die Dreierreihe sowie die unmittelbare göttliche Urheberschaft des Unheils sind im Entwurf im Wesentlichen zutreffend wiedergegeben. כָּל־הָאֲנָשִׁים bezeichnet hier jedoch, entsprechend dem hebräischen Wortlaut und dem englischen Audit Trail, „alle Männer“, nicht allgemein „alle Menschen“. „Pest“ kann im heutigen Deutsch zu eng als konkrete Krankheit verstanden werden; „Seuche“ gibt דֶּבֶר als allgemeine Gerichtskrankheit genauer wieder.
  naturalness: Die deutsche Formulierung ist überwiegend klar und würdevoll. „Durch das Schwert, durch Hungersnot und durch Seuche“ ist etwas expliziter als die knappe Reihung des Entwurfs, bleibt aber natürlich und entspricht dem prophetischen Register. Die Formulierung mit „als Überlebender übrig bleiben oder ... entkommen“ bildet die beiden hebräischen Personenbezeichnungen transparent ab.
  terminology: „Männer“ wahrt die maskuline Referenz von אֲנָשִׁים. „Als Fremde leben“ bewahrt die für גּוּר relevante Nuance des Aufenthalts als Nichtansässige. „Schwert“, „Hungersnot“, „Seuche“ und „Unheil“ sind für die jeremianische Gerichtssprache angemessen. Die Fußnote erläutert das Paar שָׂרִיד וּפָלִיט am passenden Anker.
