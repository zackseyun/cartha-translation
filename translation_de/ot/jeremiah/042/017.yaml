  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
translation:
  language: de
  text: Alle Männer, die entschlossen sind, nach Ägypten zu ziehen, um dort als Fremde zu leben, werden durch das Schwert, durch Hungersnot und durch Seuche sterben. Keiner von ihnen wird als Überlebender übrig bleiben oder dem Unheil entkommen, das ich über sie bringe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Für sie wird es weder einen Überlebenden noch einen Entkommenen geben.“ Das hebräische Wortpaar betont, dass niemand am Leben bleibt und niemand dem Unheil entkommt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ ... יָמוּתוּ
  choice: werden ... sterben
  rationale: Die im Hebräischen durch וְיִהְיוּ eingeleitete Folge wird im Deutschen natürlich als Zukunftsaussage mit dem Hauptverb „sterben“ wiedergegeben.
- source_word: כָל הָאֲנָשִׁים
  choice: alle Menschen
  rationale: אֲנָשִׁים kann je nach Zusammenhang „Männer“ oder allgemein „Menschen/Leute“ bezeichnen. Hier gilt die Warnung der gesamten Gruppe, die nach Ägypten ziehen will; die mögliche engere Wiedergabe wird in einer Fußnote genannt.
- source_word: אֲשֶׁר שָׂמוּ אֶת־פְּנֵיהֶם
  choice: die fest entschlossen sind
  rationale: Die Wendung „ihr Gesicht setzen/richten“ bezeichnet einen festen Entschluss. Die sinngemäße Wiedergabe ist in modernem Deutsch klar und bewahrt die Entschiedenheit des Ausdrucks.
- source_word: לָבוֹא מִצְרַיִם
  choice: nach Ägypten zu ziehen
  rationale: בוא kann je nach Blickrichtung „kommen“, „gehen“ oder „hineingehen“ bedeuten. „Nach Ägypten ziehen“ passt zur geplanten Übersiedlung.
- source_word: לָגוּר שָׁם
  choice: um dort als Fremde zu leben
  rationale: גור bezeichnet das Wohnen oder den Aufenthalt als Fremder und nicht notwendig eine dauerhafte Ansiedlung. „Als Fremde leben“ erhält diesen sozialen Status.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: durch Schwert, Hunger und Pest
  rationale: 'Die feste Gerichtsdreiheit Jeremias wird konkret und knapp wiedergegeben: gewaltsamer Tod, Hungersnot und Seuche.'
- source_word: שָׂרִיד וּפָלִיט
  choice: überleben oder ihm entkommen
  rationale: Die beiden Substantive bezeichnen jemanden, der übrig bleibt, und jemanden, der entkommt. Die verbale deutsche Fassung gibt beide Aspekte natürlich wieder.
- source_word: מִפְּנֵי הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet hier nicht moralische Bosheit, sondern die hereinbrechende Katastrophe beziehungsweise das Unheil.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  choice: das ich über sie bringe
  rationale: Das Partizip מֵבִיא stellt Gottes Handeln als unmittelbar bevorstehend beziehungsweise bereits im Gang dar; die Präsensform bewahrt diese Wirkung.
theological_decisions:
- issue: Göttliche Urheberschaft des angekündigten Gerichts
  choice: das Unheil, das ich über sie bringe
  alternative: das Unheil, das über sie kommt
  rationale: Der hebräische Text nennt Gott ausdrücklich als Handelnden. Diese direkte Zuschreibung wird weder abgeschwächt noch umgedeutet.
- issue: Umfang des angekündigten Gerichts
  choice: Keiner ... wird ... überleben oder ihm entkommen
  alternative: Für sie wird es keinen Überlebenden und keinen Flüchtling geben
  rationale: Die umfassende Aussage des hebräischen Wortpaares bleibt erhalten, ohne „Überrest“ als möglicherweise theologisch aufgeladenen Fachbegriff einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Redewendung vom „Setzen des Gesichts“ wird zugunsten natürlicher Verständlichkeit als fester Entschluss ausgedrückt; die prophetische Schärfe und Gottes unmittelbare Gerichtsurheberschaft bleiben erhalten.
