  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יִרְמְיָ֤הוּ הַ/נָּבִיא֙ שָׁמַ֔עְתִּי הִנְ/נִ֧י מִתְפַּלֵּ֛ל אֶל יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כְּ/דִבְרֵי/כֶ֑ם וְֽ/הָיָ֡ה כָּֽל הַ/דָּבָר֩ אֲשֶׁר יַעֲנֶ֨ה יְהוָ֤ה אֶתְ/כֶם֙ אַגִּ֣יד לָ/כֶ֔ם לֹֽא אֶמְנַ֥ע מִ/כֶּ֖ם דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
translation:
  language: de
  text: 'Da sagte der Prophet Jeremia zu ihnen: „Ich habe eure Bitte gehört. Seht, ich werde entsprechend euren Worten[a] zu Jahwe, eurem Gott, beten. Alles, was Jahwe euch als Antwort gibt, werde ich euch mitteilen. Ich werde euch kein Wort vorenthalten.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „gemäß euren Worten“; gemeint ist: entsprechend dem, worum ihr gebeten habt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde euch nichts vorenthalten.“ Wörtlich: „Ich werde euch kein Wort vorenthalten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das konsekutive Waw führt die Erzählung fort; „Da sagte“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: der Prophet Jeremia
  rationale: Die im Deutschen übliche Wortstellung verbindet Titel und Eigennamen klar und würdevoll.
- source_word: שָׁמַעְתִּי
  choice: Ich habe euch gehört
  rationale: Das Perfekt bezeichnet hier die entgegengenommene Bitte. Das ergänzte Objekt „euch“ ergibt sich aus dem Gesprächszusammenhang und klingt im Deutschen natürlicher als das isolierte „Ich habe gehört“.
- source_word: הִנְנִי מִתְפַּלֵּל
  choice: Seht, ich werde … beten
  rationale: הִנְנִי mit Partizip lenkt die Aufmerksamkeit auf eine unmittelbar bevorstehende bzw. nun aufgenommene Handlung. Das Futur ist im Deutschen in diesem Vers natürlicher, ohne den Aspekt zu eng festzulegen.
- source_word: אֶל יְהוָה אֱלֹהֵיכֶם
  choice: zu Jahwe, eurem Gott
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; das Possessivsuffix der zweiten Person Plural bleibt erhalten.
- source_word: כְּדִבְרֵיכֶם
  choice: entsprechend euren Worten
  rationale: Die formnahe Wiedergabe bewahrt den Bezug auf die zuvor ausgesprochene Bitte; eine Fußnote erläutert den gemeinten Sinn.
- source_word: כָּל הַדָּבָר אֲשֶׁר יַעֲנֶה יְהוָה אֶתְכֶם
  choice: Alles, was Jahwe euch antwortet
  rationale: Die deutsche Konstruktion gibt den umfassenden Charakter von כָּל הַדָּבָר idiomatisch wieder, ohne ein zusätzliches „Wort“ in die Antwortformel zu zwingen.
- source_word: אַגִּיד לָכֶם
  choice: werde ich euch mitteilen
  rationale: Das Hifil von נגד bezeichnet das Bekanntmachen oder Berichten; „mitteilen“ ist gegenwärtiges, klares Deutsch.
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  choice: Ich werde euch kein Wort vorenthalten
  rationale: Die Formulierung bildet sowohl מנע „vorenthalten/zurückhalten“ als auch דָּבָר „Wort/Sache“ eng ab und betont die vollständige Weitergabe.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen in gebräuchlicher deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung Jahwes als „euer Gott“
  choice: eurem Gott
  alternative: unserem Gott
  rationale: Die zweite Person Plural wird unverändert bewahrt. Jeremia übernimmt nicht stillschweigend die Formulierung „unser Gott“ und die damit verbundene mögliche theologische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ bewahrt die aufmerksamkeitslenkende Funktion von הִנְנִי, ohne das altertümlichere „Siehe“. Die direkte Rede bleibt klar, feierlich und für heutige Leser verständlich.
