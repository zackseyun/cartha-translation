source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
translation:
  language: de
  text: 'Denn so spricht JHWH, der Herr der Heerscharen, der Gott Israels: »Wie mein Zorn und mein Grimm über die Bewohner Jerusalems ausgegossen wurden, so wird mein Grimm über euch ausgegossen werden, wenn ihr nach Ägypten zieht. Ihr werdet zur Fluchformel[a], zum Entsetzen, zum Fluch und zur Schande werden und diesen Ort nie wiedersehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zum Gegenstand eines Fluches« beziehungsweise »zum Fluch-Eid«. Das hebräische Wort kann einen Eid bezeichnen, der einen Fluch einschließt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: JHWH, der Herr der Heere
  rationale: JHWH gibt den Gottesnamen erkennbar wieder; „der Herr der Heere“ vermittelt den traditionellen Titel צְבָאוֹת in verständlichem, würdigem Deutsch, ohne ihn auf menschliche Streitkräfte zu beschränken.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: נִתַּךְ ... תִּתַּךְ
  choice: ausgegossen wurden ... wird ... ausgegossen werden
  rationale: Bewahrt sowohl das Bild einer ausgegossenen Flüssigkeit als auch die zeitliche Gegenüberstellung zwischen dem Gericht über Jerusalem und dem angekündigten Gericht in Ägypten.
- source_word: אַפִּי ... חֲמָתִי
  choice: mein Zorn und mein Grimm
  rationale: Die beiden eng verwandten Begriffe werden unterschieden und ihre rhetorische Steigerung bleibt erhalten; die wörtliche Körpermetapher von אַף wäre im Deutschen missverständlich.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Bewohner Jerusalems
  rationale: Idiomatiche, genaue Wiedergabe der substantivierten Partizipialform.
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  choice: wenn ihr nach Ägypten kommt
  rationale: Die Präposition mit Infinitiv constructus hat hier temporale Bedeutung; „nach Ägypten kommt“ gibt die Bewegung in das Land natürlich wieder.
- source_word: לְאָלָה
  choice: zur Fluchformel
  rationale: Der Ausdruck bezeichnet hier wahrscheinlich eine Eid- oder Redewendung, mit der ein Fluch ausgesprochen wird. „Fluchformel“ bildet diese kontextuelle Bedeutung genauer ab als das isolierte „Eid“, ohne die lexikalische Mehrdeutigkeit zu verschweigen.
- source_word: לְשַׁמָּה
  choice: zum Entsetzen
  rationale: Bezeichnet den Schrecken beziehungsweise die entsetzte Reaktion angesichts der Verwüstung und ist im modernen Deutsch natürlicher als „zum Schauderbild“.
- source_word: לִקְלָלָה
  choice: zum Fluch
  rationale: Direkte Wiedergabe des Nomens; gemeint ist, dass ihr Schicksal sprichwörtlich zum Fluchen herangezogen wird.
- source_word: לְחֶרְפָּה
  choice: zur Schande
  rationale: Gibt öffentliche Beschämung und Verachtung in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Das Begriffspaar אַף und חֵמָה als Beschreibung des göttlichen Gerichts
  choice: mein Zorn und mein Grimm
  alternative: mein Zorn und meine Wut
  rationale: Die Übersetzung wahrt beide Begriffe und ihre Intensivierung. „Grimm“ ist würdig und bezeichnet heftigen Zorn, ohne die Aussage abzuschwächen oder die anthropomorphe Grundbedeutung von אַף unnatürlich zu wörtlich wiederzugeben.
- issue: Bezeichnung Gottes in יְהוָה צְבָאוֹת
  choice: JHWH, der Herr der Heere
  alternative: Jahwe der Heerscharen
  rationale: Die gewählte Form macht den Gottesnamen sichtbar und gibt zugleich den Titel verständlich wieder. Sie legt nicht fest, ob mit den „Heeren“ vor allem himmlische oder irdische Mächte gemeint sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und das Bild des ausgegossenen Grimms bleiben erhalten. Der viergliedrige Gerichtskatalog wird knapp und rhythmisch wiedergegeben; die echte Mehrdeutigkeit von אָלָה wird durch die Fußnote kenntlich gemacht.
