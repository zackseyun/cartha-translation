  text: וַ/יְהִ֕י מִ/קֵּ֖ץ עֲשֶׂ֣רֶת יָמִ֑ים וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/007.yaml
  text: And it happened[a], at the end of ten days, that the word of Yahweh came to Jeremiah.
translation:
  language: de
  text: Und es geschah nach Ablauf von zehn Tagen[a], dass das Wort Jahwes an Jeremia erging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „am Ende von zehn Tagen“; gemeint ist: als die zehn Tage vorüber waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die hebräische Erzählformel wird in würdigem, verständlichem Deutsch bewahrt, ohne die altertümliche Wendung „es begab sich“ zu verwenden.
- source_word: מִקֵּץ עֲשֶׂרֶת יָמִים
  choice: nach Ablauf von zehn Tagen
  rationale: Die Wendung bezeichnet den Zeitpunkt, an dem der Zeitraum von zehn Tagen vollendet war. „Nach Ablauf“ gibt diesen zeitlichen Grenzpunkt im Deutschen natürlich und präzise wieder.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die feste prophetische Formel bleibt erhalten; „Wort“ wahrt den Offenbarungscharakter besser als das stärker deutende „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen etablierte Wiedergabe des göttlichen Eigennamens bewahrt das Tetragramm als Namen statt es durch einen Titel zu ersetzen.
- source_word: אֶל יִרְמְיָהוּ
  choice: an Jeremia
  rationale: „An Jeremia ergehen“ ist die natürliche deutsche Fügung für die Richtung der göttlichen Mitteilung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm. Die Wiedergabe als „Jahwe“ erhält den persönlichen Gottesnamen und ersetzt ihn nicht durch einen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Erzählformel und die prophetische Formel bleiben erkennbar, während Satzbau und Wortwahl natürlich deutsch sind.
