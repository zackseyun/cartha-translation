source:
  edition: WLC
  text: דִּבֶּ֨ר יְהוָ֤ה עֲלֵי/כֶם֙ שְׁאֵרִ֣ית יְהוּדָ֔ה אַל תָּבֹ֖אוּ מִצְרָ֑יִם יָדֹ֨עַ֙ תֵּֽדְע֔וּ כִּי הַעִידֹ֥תִי בָ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
translation:
  language: de
  text: 'Jahwe hat über euch gesprochen, ihr Übriggebliebenen Judas: Geht nicht nach Ägypten! Ihr sollt ganz gewiss wissen, dass ich euch heute eindringlich gewarnt habe.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass ich heute feierlich gegen euch Zeugnis abgelegt habe“. Das hebräische Verb kann sowohl ein eindringliches Warnen als auch ein förmliches Bezeugen ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר יְהוָה עֲלֵיכֶם
  choice: Jahwe hat über euch gesprochen
  rationale: Das Perfekt bezeichnet eine erfolgte Äußerung mit gegenwärtiger Geltung. עַל bei דִּבֶּר wird hier sachbezogen als „über euch“ wiedergegeben, ohne vorschnell die feindliche Nuance „gegen euch“ einzutragen.
- source_word: שְׁאֵרִית יְהוּדָה
  choice: ihr Übriggebliebenen von Juda
  rationale: Die Formulierung bezeichnet den verbliebenen Teil Judas. „Übriggebliebene“ ist im modernen Deutsch verständlich und bewahrt den geschichtlichen wie prophetischen Sinn, ohne einen abstrakten theologischen Fachbegriff aufzudrängen.
- source_word: אַל תָּבֹאוּ מִצְרָיִם
  choice: Geht nicht nach Ägypten!
  rationale: Die verneinte Verbform untersagt die Reise. Im Deutschen ist „nach Ägypten gehen“ in diesem Zusammenhang natürlicher als das wörtlichere „in Ägypten hineingehen“.
- source_word: יָדֹעַ תֵּדְעוּ
  choice: Ihr sollt ganz gewiss wissen
  rationale: Der absolute Infinitiv zusammen mit dem finiten Verb verstärkt die Aussage. „Ganz gewiss“ gibt diesen Nachdruck idiomatisch wieder.
- source_word: הַעִידֹתִי בָכֶם
  choice: ich euch eindringlich gewarnt habe
  rationale: Die Hifil-Form von עוּד kann ein feierliches Bezeugen oder eindringliches Warnen ausdrücken. Im Zusammenhang steht die Warnfunktion im Vordergrund; „eindringlich“ bewahrt etwas vom formellen Nachdruck des Verbs.
- source_word: הַיּוֹם
  choice: heute
  rationale: „Heute“ ist die unmittelbare und natürliche moderne Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Die Umschrift „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שְׁאֵרִית יְהוּדָה
  choice: ihr Übriggebliebenen von Juda
  alternative: Rest Judas
  rationale: Die gewählte Formulierung bewahrt den konkreten Bezug auf die Überlebenden beziehungsweise Verbliebenen, ohne die prophetisch-theologische Bedeutung des Restmotivs auszuschließen.
- issue: Warnung oder förmliches Zeugnis in הַעִידֹתִי בָכֶם
  choice: dass ich euch heute eindringlich gewarnt habe
  alternative: dass ich heute feierlich gegen euch Zeugnis abgelegt habe
  rationale: Der Kontext legt eine ernste Warnung nahe; zugleich wird die mögliche forensische beziehungsweise adversative Nuance nicht beseitigt, sondern in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede im Plural folgt den hebräischen Formen; der Ausruf unterstreicht das ausdrückliche Verbot, ohne den Inhalt zu erweitern.
