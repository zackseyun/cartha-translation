  source_fidelity: 'Der Satzbau und die Bezüge sind zutreffend wiedergegeben: Jeremia spricht zu der Gruppe; „ihr“ sandtet ihn zu JHWH, dem Gott Israels. Die Gottesbezeichnung und die offene Einleitung zur folgenden Rede entsprechen dem Hebräischen. Die Bitte wird als Anliegen der Sendenden vor Gott dargestellt.'
