base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/009.yaml
  text: And he said to them, “Thus says the LORD, the God of Israel, to whom you sent me to lay your plea before him:”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »So spricht der HERR, der Gott Israels, zu dem ihr mich gesandt habt, um eure Bitte vor ihm vorzubringen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in ihrer traditionellen, prägnanten Gegenwartsform wiedergegeben.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im deutschen Bibelgebrauch etablierte Wiedergabe des Gottesnamens wahrt dessen besondere Stellung; die Schreibweise in Kapitälchen wird hier durch Großbuchstaben dargestellt.
- source_word: לְהַפִּיל תְּחִנַּתְכֶם לְפָנָיו
  choice: damit ich euer Flehen vor ihn bringe
  rationale: Die Wendung bedeutet wörtlich etwa, eine inständige Bitte vor jemandem niederzulegen. Die gewählte Formulierung ist natürliches Deutsch und bewahrt das Bild des Vorbringens vor Gott.
theological_decisions:
- issue: Bezug von אֲשֶׁר und Wechsel zur dritten Person im Ausdruck אֵלָיו ... לְפָנָיו
  choice: „zu dem ihr mich gesandt habt … vor ihn“
  alternative: „der mich zu sich gesandt hat“
  rationale: Das Relativpronomen bezieht sich syntaktisch auf den Gott Israels; das Subjekt von שְׁלַחְתֶּם ist eindeutig „ihr“. Der Personenwechsel wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als Einleitung zur folgenden Gottesrede mit Doppelpunkt offen; keine erläuternden Zusätze.
