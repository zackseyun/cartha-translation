base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
translation:
  language: de
  text: 'Denn ihr habt euch selbst getäuscht[a], weil ihr mich zu Jahwe, eurem Gott, geschickt und gesagt habt: »Bete für uns zu Jahwe, unserem Gott. Teile uns alles mit, was Jahwe, unser Gott, sagt, und wir werden es tun.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihr seid auf Kosten eures Lebens irregegangen«; die hebräische Wendung kann die lebensgefährlichen Folgen ihres Irrtums hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: התעיתם בְּנַפְשׁוֹתֵיכֶם
  choice: ihr habt euch selbst getäuscht
  rationale: Die schwierige Verbindung des Hifil von תעה mit בְּנַפְשׁוֹתֵיכֶם kann eine selbstverschuldete Täuschung oder ein lebensgefährliches Irregehen bezeichnen. Im Zusammenhang steht die unaufrichtige Bereitschaft zum Gehorsam im Vordergrund; die alternative, selbstzerstörerische Nuance wird in der Fußnote bewahrt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im modernen Deutschen geläufige Form.
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  choice: Bete für uns
  rationale: Gibt sowohl die Bedeutung des Betens als auch das durch בַּעַד ausgedrückte Eintreten zugunsten anderer natürlich und verständlich wieder.
- source_word: וּכְכֹל אֲשֶׁר יֹאמַר
  choice: alles, was … sagt
  rationale: Bewahrt den umfassenden Sinn der hebräischen Wendung in natürlichem Deutsch.
- source_word: הַגֶּד לָנוּ
  choice: Teile uns … mit
  rationale: Eine natürliche und würdige Wiedergabe des Imperativs von נגד; der Inhalt wird aus dem vorangehenden Relativsatz aufgenommen.
- source_word: וְעָשִׂינוּ
  choice: dann werden wir es tun
  rationale: Das im Hebräischen aus dem Kontext erschlossene Objekt wird im Deutschen mit »es« ausgedrückt; »dann« macht die zugesagte Reaktion deutlich, ohne den Sinn zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« erhält diese Unterscheidung gegenüber dem Titel »Herr«.
- issue: Deutung von התעיתם בנפשותיכם
  choice: ihr habt euch selbst getäuscht
  alternative: ihr seid auf Kosten eures Lebens irregegangen
  rationale: Die Aussage kann sowohl Selbsttäuschung als auch selbstgefährdendes Irregehen betonen. Der unmittelbare Kontext stützt die Selbsttäuschung als Hauptlesart; die andere Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt klar und mündlich, ohne umgangssprachlich zu wirken. Das wiederholte »unser Gott« wird als bedeutungstragender Bestandteil der Selbstdarstellung der Sprecher beibehalten.
