revisions:
- from: Solltet ihr mich nicht fürchten? – Ausspruch Jahwes.[a] Solltet ihr nicht vor mir erbeben, der ich den Sand dem Meer als Grenze gesetzt habe, als ewige Schranke, die es nicht überschreiten kann? Mögen seine Wellen auch aufwogen, sie vermögen nichts; mögen sie auch brausen,[b] sie überschreiten sie nicht.
  to: Fürchtet ihr mich nicht? – Ausspruch Jahwes. Bebt ihr nicht vor mir, der ich den Sand dem Meer als Grenze gesetzt habe, als ewige Festsetzung, die es nicht überschreiten kann? Auch wenn seine Wellen aufwogen, können sie die Grenze nicht überwinden; auch wenn sie brausen, überschreiten sie sie nicht.
  rationale: 'Die direkte Frageform gibt die hebräischen rhetorischen Fragen ohne die zusätzliche Sollensnuance von „Solltet ihr“ wieder. „Ewige Festsetzung“ bewahrt bei חָק die Bedeutung einer bleibenden göttlichen Anordnung. Die Schlusszeilen machen die Fähigkeit bzw. das Scheitern der Wellen im gegebenen Kontext ausdrücklich und natürlich verständlich, ohne über den Bildzusammenhang hinauszugehen. Die vorhandenen Fußnoten sind nicht erforderlich: Die Botenformel und das hier verwendete „brausen“ sind im deutschen Text hinreichend klar; die behauptete Alternative „toben“ trägt keine für das Verständnis nötige abweichende Lesart bei.'
  reviewer_model: gpt-5.6-terra
