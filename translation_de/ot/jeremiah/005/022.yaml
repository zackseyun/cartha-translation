source:
  edition: WLC
  text: הַ/אוֹתִ֨/י לֹא תִירָ֜אוּ נְאֻם יְהֹוָ֗ה אִ֤ם מִ/פָּנַ/י֙ לֹ֣א תָחִ֔ילוּ אֲשֶׁר שַׂ֤מְתִּי חוֹל֙ גְּב֣וּל לַ/יָּ֔ם חָק עוֹלָ֖ם וְ/לֹ֣א יַעַבְרֶ֑/נְהוּ וַ/יִּֽתְגָּעֲשׁוּ֙ וְ/לֹ֣א יוּכָ֔לוּ וְ/הָמ֥וּ גַלָּ֖י/ו וְ/לֹ֥א יַעַבְרֻֽ/נְהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/022.yaml
  text: Do you not fear me? declares Yahweh[a]. Do you not tremble before me, he who set the sand as a boundary for the sea, an everlasting decree that it cannot cross? Though its waves toss, they cannot prevail; though they roar[b], they cannot cross it.
translation:
  language: de
  text: Fürchtet ihr mich nicht? – Ausspruch Jahwes. Bebt ihr nicht vor mir, der ich den Sand dem Meer als Grenze gesetzt habe, als ewige Festsetzung, die es nicht überschreiten kann? Auch wenn seine Wellen aufwogen, können sie die Grenze nicht überwinden; auch wenn sie brausen, überschreiten sie sie nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹתִי לֹא תִירָאוּ
  choice: Solltet ihr mich nicht fürchten?
  rationale: Die rhetorische Frage tadelt das fehlende Gottesfürchten. „Solltet ihr … nicht“ gibt den vorwurfsvollen Ton im heutigen Deutsch natürlich wieder; „fürchten“ bewahrt sowohl Furcht als auch ehrfürchtige Unterordnung.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ wahrt den feierlichen Charakter der prophetischen Formel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: אִם מִפָּנַי לֹא תָחִילוּ
  choice: Solltet ihr nicht vor mir erbeben
  rationale: חיל kann Zittern, Beben oder Sichwinden bezeichnen. Im Parallelismus zu „fürchten“ trifft „erbeben“ die körperlich-emotionale Reaktion, ohne sie auf bloße Angst zu verengen.
- source_word: אֲשֶׁר שַׂמְתִּי
  choice: der ich … gesetzt habe
  rationale: Die erste Person schließt unmittelbar an den redenden Gott an und bildet die hebräische Sprecherperspektive klarer ab als ein Wechsel in die dritte Person.
- source_word: חוֹל גְּבוּל לַיָּם
  choice: den Sand dem Meer als Grenze
  rationale: Die Formulierung bildet die Setzung des Sandes als Begrenzung des Meeres knapp und idiomatisch ab.
- source_word: חָק עוֹלָם
  choice: als ewige Schranke
  rationale: חֹק bezeichnet etwas Festgesetztes. Im kosmologischen Bild ist „Schranke“ natürlicher als „Satzung“ und hält die Verbindung zur zuvor genannten Grenze fest.
- source_word: וְלֹא יַעַבְרֶנְהוּ
  choice: die es nicht überschreiten kann
  rationale: Das Meer ist das naheliegende Subjekt; „überschreiten“ gibt עבר mit Bezug auf eine Grenze präzise wieder. „Kann“ bringt die Unüberwindlichkeit der göttlichen Festsetzung zum Ausdruck.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: Mögen seine Wellen auch aufwogen
  rationale: Das Verb bezeichnet stürmisches Aufwallen oder Toben. „Aufwogen“ passt zum Meer und führt das im Hebräischen anschließend genannte Subjekt „Wellen“ zur Klarheit vor.
- source_word: וְלֹא יוּכָלוּ
  choice: sie vermögen nichts
  rationale: Das isolierte יכל bedeutet „fähig sein/vermögen“. Die deutsche Wendung lässt wie das Hebräische offen, welches konkrete Ziel die Wellen nicht erreichen können, während der Kontext das Überwinden der Grenze nahelegt.
- source_word: וְהָמוּ גַלָּיו
  choice: mögen sie auch brausen
  rationale: המה bezeichnet lautes Tosen oder Brausen. „Brausen“ ist für Meereswellen idiomatisch und hält den parallelen konzessionellen Rhythmus.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von אֲשֶׁר שַׂמְתִּי
  choice: 'erste Person: „der ich … gesetzt habe“'
  alternative: 'dritte Person: „er, der … gesetzt hat“'
  rationale: Das Verb שַׂמְתִּי steht eindeutig in der ersten Person. Die deutsche Fassung bewahrt diese Sprecherperspektive und vermeidet einen unnötigen Wechsel in die dritte Person.
- issue: Kraft der Meereswellen gegenüber Gottes Grenze
  choice: „sie vermögen nichts“
  alternative: „sie können sie nicht überwinden“
  rationale: Die knappere Fassung bewahrt die im Hebräischen nicht ausdrücklich ergänzte Zielangabe und damit die rhetorische Spannung; aus dem Kontext ergibt sich dennoch, dass die Wellen an der gesetzten Grenze scheitern.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit prophetisch-rhetorischem Ton. Die parallelen Fragen und die zweimalige konzessionelle Struktur („Mögen … auch“) bilden den hebräischen Nachdruck nach. Die Pronomen in der Schlusszeile unterscheiden das Meer („es“) von der ewigen Schranke („sie“), soweit es im Deutschen möglich ist.
