  text: וְ/הָיָה֙ כִּ֣י תֹאמְר֔וּ תַּ֣חַת מֶ֗ה עָשָׂ֨ה יְהֹוָ֧ה אֱלֹהֵ֛י/נוּ לָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עֲזַבְתֶּ֤ם אוֹתִ/י֙ וַ/תַּעַבְד֞וּ אֱלֹהֵ֤י נֵכָר֙ בְּ/אַרְצְ/כֶ֔ם כֵּ֚ן תַּעַבְד֣וּ זָרִ֔ים בְּ/אֶ֖רֶץ לֹ֥א לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/019.yaml
  text: And when you say[a], ‘Why has Yahweh our God done all these things to us?’ then you shall say to them, ‘Just as you have forsaken me and served foreign gods in your land, so you shall serve foreigners in a land not yours.’
translation:
  language: de
  text: 'Und wenn ihr sagt: »Warum hat Jahwe, unser Gott, uns dies alles angetan?«, dann sollst du ihnen sagen: »Wie ihr mich verlassen und in eurem Land fremden Göttern gedient habt, so werdet ihr Fremden[a] in einem Land dienen, das euch nicht gehört.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ausländern«. Das hebräische Wort bezeichnet hier fremde Menschen, im Unterschied zu den zuvor genannten »fremden Göttern«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Wendung leitet einen künftigen Fall ein; »Und wenn« gibt ihren zeitlichen und bedingten Sinn in natürlichem Deutsch wieder.
- source_word: תַּחַת מֶה
  choice: Warum
  rationale: Die wörtlich ungewöhnliche Frage nach dem Grund wird im Deutschen idiomatisch mit »Warum« wiedergegeben.
- source_word: עָשָׂה ... אֶת כָּל אֵלֶּה
  choice: uns dies alles angetan
  rationale: »Angetan« macht im Zusammenhang deutlich, dass von erfahrenem Gericht die Rede ist; »dies alles« wahrt den umfassenden Bezug des hebräischen Ausdrucks.
- source_word: יְהֹוָה
  choice: Jahwe
  rationale: Der Eigenname Gottes wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: ihr mich verlassen
  rationale: »Verlassen« bewahrt die Schwere des Bundesbruchs, ohne eine zusätzliche Deutung einzutragen.
- source_word: וַתַּעַבְדוּ / תַּעַבְדוּ
  choice: gedient habt / dienen
  rationale: Die gleiche deutsche Verbalwurzel erhält die beabsichtigte Entsprechung zwischen dem Dienst an fremden Göttern und dem Dienst an fremden Menschen.
- source_word: אֱלֹהֵי נֵכָר
  choice: fremden Göttern
  rationale: Der Ausdruck bezeichnet Götter, die Israel fremd sind; die geläufige Wendung ist klar und bewahrt den Kontrast.
- source_word: זָרִים
  choice: Fremden
  rationale: Das Wort bezeichnet hier ausländische Menschen, im bewussten Gegenüber zu den zuvor genannten fremden Göttern.
- source_word: בְּאֶרֶץ לֹא לָכֶם
  choice: in einem Land, das euch nicht gehört
  rationale: Diese Formulierung gibt die Besitzverneinung verständlich wieder und erhält den Kontrast zu »eurem Land«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. »Jahwe« bewahrt ihn als Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von עבד in der Vergleichsstruktur
  choice: dienen in beiden Satzhälften
  alternative: fremde Götter anbeten / Fremden dienen
  rationale: Obwohl עבד bei Göttern auch »anbeten« bedeuten kann, macht die einheitliche Wiedergabe die gerichtliche Entsprechung des hebräischen Wortspiels sichtbar.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Wechsel vom Plural »ihr« zur singularischen Anweisung »sollst du« bleibt erhalten: Das Volk stellt die Frage, der Prophet soll antworten. Die Vergleichsform »Wie … so« bildet die hebräische Entsprechung knapp und deutlich ab.'
