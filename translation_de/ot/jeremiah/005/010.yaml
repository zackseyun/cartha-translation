source:
  edition: WLC
  text: עֲל֤וּ בְ/שָׁרוֹתֶ֨י/הָ֙ וְ/שַׁחֵ֔תוּ וְ/כָלָ֖ה אַֽל תַּעֲשׂ֑וּ הָסִ֨ירוּ֙ נְטִ֣ישׁוֹתֶ֔י/הָ כִּ֛י ל֥וֹא לַ/יהוָ֖ה הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/010.yaml
  text: Go up through her vine-rows and destroy[a], but do not make a full end. Remove her branches[b], for they are not Yahweh’s.
translation:
  language: de
  text: Zieht hinauf durch ihre Rebreihen[a] und verwüstet sie, doch vernichtet sie nicht völlig. Entfernt ihre Ranken[b], denn sie gehören nicht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Steigt auf ihre Mauern und zerstört sie.« Das hier mit »Rebreihen« wiedergegebene hebräische Wort ist schwierig; manche verstehen das Bild architektonisch statt als Weinberg.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Entfernt ihre Triebe.« Das hebräische Wort kann verschiedene ausgreifende Pflanzenteile bezeichnen und führt wahrscheinlich das Weinbergbild fort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ
  choice: Zieht … hinauf
  rationale: Der pluralische Imperativ bezeichnet hier das Vorrücken der Angreifer. „Zieht … hinauf“ bewahrt sowohl die Bewegungsrichtung als auch den militärischen Unterton, ohne ein im Hebräischen nicht ausdrücklich genanntes „gegen sie“ einzufügen.
- source_word: בְשָׁרוֹתֶיהָ
  choice: durch ihre Rebreihen
  rationale: Das seltene und schwierige Substantiv wird im Zusammenhang mit den anschließend genannten Ranken landwirtschaftlich verstanden. „Rebreihen“ ergibt ein verständliches Weinbergbild; die abweichende architektonische Deutung wird in der Fußnote offengehalten.
- source_word: וְשַׁחֵתוּ
  choice: und verwüstet sie
  rationale: Der Imperativ von שׁחת fordert eine schwere Zerstörung. „Verwüstet“ passt sowohl zur militärischen Handlung als auch zum Bild eines beschädigten Weinbergs und lässt sich im Deutschen natürlich mit der unmittelbar folgenden Einschränkung verbinden.
- source_word: וְכָלָה אַל תַּעֲשׂוּ
  choice: doch vernichtet sie nicht völlig
  rationale: Die idiomatische Verbindung bezeichnet die vollständige Vernichtung. Die Formulierung gibt die ausdrückliche Begrenzung des Zerstörungsbefehls klar und in modernem Deutsch wieder.
- source_word: הָסִירוּ
  choice: Entfernt
  rationale: Der pluralische Imperativ fordert das Wegnehmen beziehungsweise Abtrennen. „Entfernt“ ist knapp und bleibt für die möglichen landwirtschaftlichen Bildwörter offen.
- source_word: נְטִישׁוֹתֶיהָ
  choice: ihre Ranken
  rationale: Im wahrscheinlich fortgeführten Weinbergbild bezeichnet das Wort ausgreifende Pflanzenteile. „Ranken“ ist im Deutschen anschaulich; „Triebe“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: כִּי לֹא לַיהוָה הֵמָּה
  choice: denn sie gehören nicht Jahwe
  rationale: Die Konstruktion mit ל drückt Zugehörigkeit oder Beziehung aus. „Gehören nicht Jahwe“ ist natürliches Deutsch und lässt den Plural auf die unmittelbar genannten Ranken bezogen sein.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Begrenzung des angekündigten Gerichts
  choice: doch vernichtet sie nicht völlig
  alternative: doch macht kein vollständiges Ende
  rationale: Die Übersetzung bewahrt die Spannung zwischen dem Befehl zur Verwüstung und dem Verbot vollständiger Vernichtung, ohne diese Spannung durch eine weitergehende theologische Erklärung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die militärische Bewegung und das Weinbergbild bleiben zugleich hörbar. Die schwer deutbare Bildsprache wird im Haupttext nicht geglättet; die architektonische Alternative und die lexikalische Spannweite werden in den Fußnoten ausgewiesen.
