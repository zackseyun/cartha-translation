  text: שַׁמָּה֙ וְ/שַׁ֣עֲרוּרָ֔ה נִהְיְתָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/030.yaml
  text: An appalling and horrible thing has happened in the land:[a]
translation:
  language: de
  text: 'Entsetzliches und Schreckliches ist im Land geschehen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמָּה
  choice: Entsetzliches
  rationale: Das Substantiv bezeichnet etwas, das Entsetzen oder fassungsloses Erschrecken hervorruft. Die substantivierte deutsche Form ist natürlich und bewahrt die konkrete Wirkung, ohne die kontextabhängige Bedeutung „Verwüstung“ einzutragen.
- source_word: וְשַׁעֲרוּרָה
  choice: und Schreckliches
  rationale: Das Wort bezeichnet etwas Grauenhaftes, Ungeheuerliches oder Erschreckendes. Zusammen mit שַׁמָּה entsteht eine eindringliche Häufung, die durch zwei parallele substantivierte Adjektive wiedergegeben wird.
- source_word: נִהְיְתָה
  choice: ist … geschehen
  rationale: Die Form von היה beschreibt hier, dass dieses entsetzliche Geschehen eingetreten ist. Das deutsche Perfekt gibt den vollzogenen Vorgang idiomatisch wieder.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Im prophetischen Zusammenhang ist das Land Juda gemeint. „Im Land“ ist prägnant und vermeidet die zu weite Wiedergabe „auf der Erde“.
