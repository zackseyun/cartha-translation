source:
  edition: WLC
  text: וְ/אָכַ֨ל קְצִֽירְ/ךָ֜ וְ/לַחְמֶ֗/ךָ יֹאכְלוּ֙ בָּנֶ֣י/ךָ וּ/בְנוֹתֶ֔י/ךָ יֹאכַ֤ל צֹאנְ/ךָ֙ וּ/בְקָרֶ֔/ךָ יֹאכַ֥ל גַּפְנְ/ךָ֖ וּ/תְאֵנָתֶ֑/ךָ יְרֹשֵׁ֞שׁ עָרֵ֣י מִבְצָרֶ֗י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בּוֹטֵ֥חַ בָּ/הֵ֖נָּה בֶּ/חָֽרֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/017.yaml
  text: And they will consume your harvest and your bread[a]; they will consume your sons and your daughters; they will consume your flock and your herd; they will consume your vine and your fig tree; they will destroy your fortified cities, in which you trust[b], with the sword.
translation:
  language: de
  text: Und es wird deine Ernte und dein Brot verzehren[a]; sie werden deine Söhne und deine Töchter verzehren; es wird dein Kleinvieh und deine Rinder verzehren; es wird deinen Weinstock und deinen Feigenbaum verzehren; es wird deine befestigten Städte, auf die du vertraust, mit dem Schwert verwüsten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „essen“; das wiederholte Verb kann hier auch mit „aufzehren“ oder „verschlingen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen die Verben für den Angreifer teils in der Einzahl, teils in der Mehrzahl. Das angreifende Volk erscheint damit sowohl als Einheit als auch als Gesamtheit seiner Kräfte.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַל / יֹאכְלוּ / יֹאכַל
  choice: wird verzehren / werden verzehren
  rationale: Das Grundverb bedeutet „essen“, bezeichnet hier aber die umfassende Vernichtung von Ernte, Menschen, Vieh und Pflanzen. „Verzehren“ bewahrt die auffällige Wiederholung und passt zu allen Objekten.
- source_word: קְצִירְךָ וְלַחְמֶךָ
  choice: deine Ernte und dein Brot
  rationale: „Ernte“ gibt קָצִיר konkret wieder; „Brot“ bewahrt die anschauliche Grundbedeutung von לֶחֶם, ohne sie vorschnell zu „Nahrung“ zu verallgemeinern.
- source_word: בָּנֶיךָ וּבְנוֹתֶיךָ
  choice: deine Söhne und deine Töchter
  rationale: Die ausdrücklich genannten beiden Gruppen werden nicht zum allgemeineren „Kinder“ zusammengezogen.
- source_word: צֹאנְךָ וּבְקָרֶךָ
  choice: deine Schafe und deine Rinder
  rationale: צֹאן bezeichnet Kleinvieh, besonders Schafe und Ziegen, בָּקָר Rinder. „Schafe und Rinder“ ist verständlich und bildet den Gegensatz der Viehgruppen knapp ab, auch wenn צֹאן nicht ausschließlich Schafe meint.
- source_word: גַּפְנְךָ וּתְאֵנָתֶךָ
  choice: deinen Weinstock und deinen Feigenbaum
  rationale: Die Einzahl der beiden repräsentativen Nutzpflanzen bleibt erhalten.
- source_word: יְרֹשֵׁשׁ
  choice: wird verwüsten
  rationale: Das seltene Verb bezeichnet das Zugrunderichten beziehungsweise Veröden. „Verwüsten“ passt zum militärischen Kontext und vermeidet eine zu enge wirtschaftliche Deutung.
- source_word: עָרֵי מִבְצָרֶיךָ
  choice: deine befestigten Städte
  rationale: Die Wendung bezeichnet durch Befestigungen geschützte Städte; „befestigte Städte“ ist die natürliche moderne Entsprechung.
- source_word: אֲשֶׁר אַתָּה בּוֹטֵחַ בָּהֵנָּה
  choice: auf die du vertraust
  rationale: בָּטַח bezeichnet Vertrauen beziehungsweise das Sich-Verlassen auf etwas. Der Pluralbezug auf die Städte wird im Deutschen klar wiedergegeben.
- source_word: בֶּחָרֶב
  choice: mit dem Schwert
  rationale: Die Präposition kennzeichnet hier das Mittel der militärischen Verwüstung.
theological_decisions:
- issue: Wechsel zwischen singularischen und pluralischen Verbformen für den Angreifer
  choice: Singular mit „es“ und Plural mit „sie“ werden entsprechend dem Hebräischen beibehalten.
  alternative: Alle Verbformen könnten im Deutschen einheitlich pluralisch („sie“) oder kollektiv singularisch wiedergegeben werden.
  rationale: Der Text behandelt das zuvor genannte Volk sowohl als kollektive Einheit als auch als handelnde Mehrzahl. Der Wechsel wird nicht geglättet, obwohl die deutschen Pronomen dadurch bewusst wechseln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Wiederholung von „verzehren“ und der Numeruswechsel des hebräischen Textes bleiben bewusst sichtbar. Das sächliche „es“ bezieht sich auf das zuvor genannte angreifende Volk.
