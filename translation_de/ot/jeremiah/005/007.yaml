source:
  edition: WLC
  text: אֵ֤י לָ/זֹאת֙ אסלוח לָ֔/ךְ בָּנַ֣יִ/ךְ עֲזָב֔וּ/נִי וַ/יִּשָּׁבְע֖וּ בְּ/לֹ֣א אֱלֹהִ֑ים וָ/אַשְׂבִּ֤עַ אוֹתָ/ם֙ וַ/יִּנְאָ֔פוּ וּ/בֵ֥ית זוֹנָ֖ה יִתְגֹּדָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/007.yaml
  text: How can I forgive you for this? Your children have forsaken me and have sworn by those that are not gods[a]. When I had fed them to the full[b], they committed adultery and crowded into a prostitute’s house.
translation:
  language: de
  text: Wie könnte ich dir das vergeben? Deine Kinder haben mich verlassen und bei denen geschworen, die keine Götter sind. Als ich sie satt gemacht hatte[a], begingen sie Ehebruch und drängten sich im Haus einer Prostituierten zusammen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach anderer Ableitung: „Als ich sie hatte schwören lassen“.'
    reason: Das unpunktierte Konsonantenbild kann mit „satt machen“ oder mit „schwören lassen“ verbunden werden; die masoretische Punktierung stützt hier „satt machen“.
  - marker: b
    text: 'Oder: „sammelten sie sich in Scharen am Haus einer Prostituierten“.'
    reason: Das seltene hebräische Verb kann ein Zusammendrängen oder scharenweises Zusammenkommen bezeichnen; auch die genaue räumliche Nuance der Präposition bleibt offen.
lexical_decisions:
- source_word: אֵי לָזֹאת אֶסְלַח לָךְ
  choice: Wie könnte ich dir das vergeben?
  rationale: אֵי leitet hier eine rhetorische Frage voller Unfassbarkeit ein. Der Konjunktiv „könnte“ gibt diese Kraft natürlich wieder; das feminine Singularsuffix bleibt im singularischen „dir“ erhalten.
- source_word: בָּנַיִךְ
  choice: Deine Kinder
  rationale: Das Wort kann „Söhne“ oder allgemein „Kinder“ bezeichnen; hier sind die Angehörigen der kollektiv angeredeten Stadt beziehungsweise Gemeinschaft gemeint.
- source_word: עֲזָבוּנִי
  choice: haben mich verlassen
  rationale: „Verlassen“ ist gegenwärtiges, würdevolles Deutsch und bewahrt im Kontext den Sinn des treulosen Abfalls.
- source_word: וַיִּשָּׁבְעוּ בְּלֹא אֱלֹהִים
  choice: und bei denen geschworen, die keine Götter sind
  rationale: 'Die Formulierung bewahrt die polemische Aussage des Hebräischen: Die angerufenen Mächte gelten tatsächlich nicht als Götter.'
- source_word: וָאַשְׂבִּעַ אוֹתָם
  choice: Obwohl ich sie satt gemacht hatte
  rationale: Die Form wird hier von שבע „satt sein/werden“ her verstanden. „Obwohl“ bringt den im Zusammenhang liegenden Gegensatz zwischen Gottes Versorgung und der Untreue des Volkes zum Ausdruck, ohne ihn dogmatisch auszudeuten.
- source_word: וַיִּנְאָפוּ
  choice: brachen sie die Ehe
  rationale: Die direkte Wiedergabe lässt offen, ob konkrete sexuelle Untreue, bildhafte Bundestreueverletzung oder beides im Blick ist.
- source_word: וּבֵית זוֹנָה
  choice: im Haus einer Prostituierten
  rationale: „Prostituierte“ ist modern und sachlich; der Singular des hebräischen Ausdrucks bleibt erhalten.
- source_word: יִתְגֹּדָדוּ
  choice: drängten sich ... zusammen
  rationale: Die seltene Form bezeichnet ein scharenweises Zusammenkommen oder Zusammendrängen. Diese Wiedergabe ist anschaulich, ohne die Zielrichtung „hinein“ stärker festzulegen, als es die Präposition בְּ erlaubt.
theological_decisions:
- issue: Wörtlicher oder bildhafter Ehebruch
  choice: „brachen sie die Ehe“ ohne nähere Festlegung
  alternative: Den Ausdruck ausdrücklich nur auf Götzendienst oder nur auf sexuelles Fehlverhalten beziehen
  rationale: Jeremias prophetische Sprache kann konkrete sexuelle und bildhafte religiöse Untreue miteinander verbinden. Die Übersetzung wahrt diese Spannung.
- issue: Deutung von וָאַשְׂבִּעַ
  choice: Als „ich machte sie satt“ von שבע verstehen
  alternative: Als „ich ließ sie schwören“ von שׁבע deuten
  rationale: Die masoretische Form und der Zusammenhang von göttlicher Versorgung, Sättigung und anschließender Untreue stützen die Bedeutung „satt machen“; die andere morphologisch mögliche Verbindung wird in der Fußnote genannt.
- issue: Identität der angeredeten Person
  choice: Die feminine kollektive Singularanrede mit „dir“ beibehalten
  alternative: „Jerusalem“, „Juda“ oder eine pluralische Anrede ausdrücklich einsetzen
  rationale: Der Vers nennt die Adressatin nicht ausdrücklich. Die Übersetzung vermeidet daher eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Schärfe, die kollektive Singularanrede und die Mehrdeutigkeit des Ehebruchmotivs bleiben erhalten. Alle Fußnotenmarker stehen unmittelbar bei den betroffenen Wendungen.
