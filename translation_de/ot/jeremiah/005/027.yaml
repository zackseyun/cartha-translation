source:
  edition: WLC
  text: כִּ/כְלוּב֙ מָ֣לֵא ע֔וֹף כֵּ֥ן בָּתֵּי/הֶ֖ם מְלֵאִ֣ים מִרְמָ֑ה עַל כֵּ֥ן גָּדְל֖וּ וַֽ/יַּעֲשִֽׁירוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/027.yaml
  text: Like a cage full of birds[a], so their houses are full of deceit[b]; therefore they have become great and grown rich.
translation:
  language: de
  text: Wie ein Käfig voller Vögel[a], so sind ihre Häuser voller Betrug[b]. Darum sind sie groß und reich geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Korb“. Das hebräische Wort bezeichnet einen Behälter für Vögel und kann möglicherweise auch einen anderen Vogelbehälter meinen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch „Täuschung“, „Hinterlist“ oder „betrügerisches Handeln“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלוּב
  choice: Käfig
  rationale: Das Substantiv bezeichnet einen Behälter für Vögel. „Käfig“ gibt das Bild im Deutschen natürlich und konkret wieder; „Korb“ oder „Vogelbauer“ sind ebenfalls möglich.
- source_word: מָלֵא עוֹף
  choice: voller Vögel
  rationale: עוֹף bezeichnet hier allgemein Vögel beziehungsweise fliegende Tiere. „Voller Vögel“ ist klar, idiomatisch und wahrt die Vergleichsstruktur.
- source_word: כֵּן
  choice: so
  rationale: 'Die Partikel verbindet beide Satzhälften zu einem knappen Vergleich: Wie der Käfig gefüllt ist, so auch ihre Häuser.'
- source_word: בָּתֵּיהֶם
  choice: ihre Häuser
  rationale: Die wörtliche Wiedergabe bewahrt das konkrete Bild der Haushalte, deren Wohlstand durch unrechtes Handeln zustande gekommen ist.
- source_word: מְלֵאִים מִרְמָה
  choice: voller Betrug
  rationale: מִרְמָה umfasst Täuschung, Hinterlist und betrügerisches Handeln. „Betrug“ passt zum Kontext unrechtmäßiger Bereicherung, ohne den Ausdruck auf eine einzelne Methode zu beschränken.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die Wendung bezeichnet die Folge beziehungsweise den begründenden Zusammenhang zwischen dem betrügerischen Handeln und ihrem Aufstieg.
- source_word: גָּדְלוּ
  choice: sind sie mächtig geworden
  rationale: Das Verb bedeutet grundsätzlich „groß werden“. Im Zusammenhang mit Reichtum bezeichnet es wahrscheinlich gesellschaftliche Größe, Einfluss oder Macht; „mächtig geworden“ macht diesen Sinn in natürlichem Deutsch verständlich.
- source_word: וַיַּעֲשִׁירוּ
  choice: und reich geworden
  rationale: Die Verbform bedeutet, reich zu werden. Die Wiedergabe vermeidet das stärker deutende „sich bereichert“, obwohl der Kontext unrechtmäßigen Gewinn erkennen lässt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der parallele Vergleich „Wie …, so …“ bleibt erhalten. „Mächtig“ verdeutlicht die im Kontext gemeinte gesellschaftliche Größe, während die Fußnoten die echte lexikalische Bandbreite der Bild- und Betrugssprache offenhalten.
