  text: שׁוֹטְט֞וּ בְּ/חוּצ֣וֹת יְרוּשָׁלִַ֗ם וּ/רְאוּ נָ֤א וּ/דְעוּ֙ וּ/בַקְשׁ֣וּ בִ/רְחוֹבוֹתֶ֔י/הָ אִם תִּמְצְא֣וּ אִ֔ישׁ אִם יֵ֛שׁ עֹשֶׂ֥ה מִשְׁפָּ֖ט מְבַקֵּ֣שׁ אֱמוּנָ֑ה וְ/אֶסְלַ֖ח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/001.yaml
  text: Roam through the streets of Jerusalem[a], and please look and know, and search in her squares, whether you can find a man, whether there is one who does justice, who seeks faithfulness[b], and I will forgive her.
translation:
  language: de
  text: Durchstreift die Straßen Jerusalems! Seht euch doch um, stellt fest und sucht auf ihren Plätzen, ob ihr einen Mann[a] findet, ob es einen gibt, der Recht übt und Treue[b] sucht – dann werde ich ihr vergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Einen Mann“ gibt den maskulinen Singular des hebräischen אִישׁ wieder; gemeint ist die Suche danach, ob sich auch nur ein einziger solcher Mensch finden lässt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wahrheit“ beziehungsweise „Wahrhaftigkeit“. Das hebräische Wort אֱמוּנָה kann Treue, Verlässlichkeit oder Wahrhaftigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹטְטוּ
  choice: Durchstreift
  rationale: Der Imperativ bezeichnet ein ausgedehntes Umherziehen zur Suche; „durchstreift“ gibt Bewegung und gründliche Erkundung natürlich wieder.
- source_word: בְּחוּצוֹת יְרוּשָׁלִַם
  choice: die Straßen Jerusalems
  rationale: חוּצוֹת bezeichnet hier die Straßen beziehungsweise öffentlichen Außenräume der Stadt; mit dem Bewegungsverb ist „die Straßen durchstreifen“ idiomatisch.
- source_word: וּרְאוּ נָא
  choice: Seht euch doch um
  rationale: נָא verleiht dem Aufruf eine dringliche, hier nicht höflich-formelhafte Nuance. „doch“ bewahrt diesen Nachdruck, und „sich umsehen“ passt zur städtischen Suche.
- source_word: וּדְעוּ
  choice: stellt fest
  rationale: Das Verb bedeutet wörtlich „erkennt/wisst“, fordert hier aber dazu auf, den tatsächlichen Befund zu ermitteln. „Stellt fest“ ist im Deutschen klar und kontextgerecht.
- source_word: וּבַקְשׁוּ בִרְחוֹבוֹתֶיהָ
  choice: und sucht auf ihren Plätzen
  rationale: רְחֹבוֹת sind breite öffentliche Plätze. Das feminine Pronomen in „ihren“ erhält die Personifizierung Jerusalems.
- source_word: אִם תִּמְצְאוּ אִישׁ אִם יֵשׁ
  choice: ob ihr einen Mann findet, ob es einen gibt
  rationale: Die zweifache אִם-Konstruktion steigert die rhetorische Suche nach auch nur einem Einzelnen. „einen Mann“ bewahrt den maskulinen Singular אִישׁ.
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: der Recht übt
  rationale: Die feste deutsche Wendung „Recht üben“ gibt tätiges gerechtes Handeln knapp und würdig wieder.
- source_word: מְבַקֵּשׁ אֱמוּנָה
  choice: Treue sucht
  rationale: אֱמוּנָה umfasst Treue, Verlässlichkeit und Wahrhaftigkeit. „Treue“ bewahrt die ethisch-relationale Dimension; die echte Mehrdeutigkeit wird in einer Fußnote kenntlich gemacht.
- source_word: וְאֶסְלַח לָהּ
  choice: dann werde ich ihr vergeben
  rationale: 'Die Folgebeziehung ist im Kontext konditional: Wird ein solcher Mensch gefunden, vergibt Gott Jerusalem. „ihr“ erhält den femininen Stadtbezug.'
theological_decisions:
- issue: Repräsentativer maskuliner Singular אִישׁ
  choice: einen Mann
  alternative: jemanden / einen Menschen
  rationale: Der Ausgangstext spricht ausdrücklich von אִישׁ im maskulinen Singular. Die Form wird im Haupttext bewahrt; zugleich macht die Fußnote deutlich, dass die rhetorische Aussage auf das Auffinden auch nur eines solchen Einzelnen zielt.
- issue: Bedeutung von אֱמוּנָה im ethischen Zusammenhang
  choice: Treue
  alternative: Wahrheit / Wahrhaftigkeit / Verlässlichkeit
  rationale: Der Begriff ist semantisch weiter als bloße faktische Wahrheit und kann beständige Zuverlässigkeit sowie Wahrhaftigkeit bezeichnen. „Treue“ wahrt diese Spannung am besten, ohne die anderen möglichen Akzente auszuschließen.
- issue: Logischer Bezug von וְאֶסְלַח לָהּ
  choice: dann werde ich ihr vergeben
  alternative: und ich werde ihr vergeben
  rationale: Das waw leitet hier im Gefolge der Suchbedingung deren angekündigte Konsequenz ein. „dann“ macht die im Hebräischen kontextuell erkennbare Folge im Deutschen verständlich, ohne die Vergebung von der Bedingung zu lösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gestaffelten Aufforderungen und die rhetorische Wiederholung des Hebräischen bleiben erhalten. „Seht euch doch um“ und „stellt fest“ vermeiden unnatürlich wörtliches Deutsch, ohne den investigativen Charakter abzuschwächen.
