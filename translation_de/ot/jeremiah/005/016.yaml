source:
  edition: WLC
  text: אַשְׁפָּת֖/וֹ כְּ/קֶ֣בֶר פָּת֑וּחַ כֻּלָּ֖/ם גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/016.yaml
  text: Their quiver is like an open grave[b][a]; all of them are mighty men.
translation:
  language: de
  text: Sein Köcher ist wie ein offenes Grab; sie alle sind Krieger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie alle sind starke Männer« beziehungsweise »Helden«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁפָּתוֹ
  choice: sein Köcher
  rationale: Das Substantiv bezeichnet einen Köcher; das Suffix ist morphologisch 3. Person maskulin Singular. Der Singular kann sich im Zusammenhang auf das einfallende Volk als Kollektiv beziehen.
- source_word: כְּקֶבֶר פָּתוּחַ
  choice: ist wie ein offenes Grab
  rationale: כְּ kennzeichnet den Vergleich; קֶבֶר bedeutet Grab oder Gruft, und פָתוּחַ beschreibt es als offen. Die Formulierung bewahrt das eindringliche Bild natürlich im Deutschen.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Die Wendung hebt ausnahmslos die Gesamtheit der beschriebenen Gruppe hervor.
- source_word: גִּבּוֹרִים
  choice: Krieger
  rationale: Im Zusammenhang des angreifenden Volkes bezeichnet גִּבּוֹרִים starke, kampferprobte Männer. „Krieger“ ist im heutigen Deutsch natürlich und kontextuell präzise.
theological_decisions:
- issue: Bezug des maskulinen Singularsuffixes in אַשְׁפָּתוֹ
  choice: sein Köcher
  alternative: ihre Köcher
  rationale: Die Übersetzung gibt die grammatische Singularform wieder und lässt den kollektiven Bezug auf das einfallende Volk bestehen, ohne ihn in einen distributiven Plural umzudeuten.
- issue: Wiedergabe des maskulinen Plurals גִּבּוֹרִים
  choice: Krieger
  alternative: Helden / starke Männer
  rationale: „Krieger“ bezeichnet in diesem militärischen Kontext männliche Kämpfer, ohne den möglicherweise lobenden Beiklang von „Helden“ einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Parallelismus und das Todesbild des hebräischen Textes bleiben erhalten; die grammatische Singularform »sein Köcher« wird bewusst nicht geglättet.
