id: JER.5.4
reference: Jeremiah 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֣י אָמַ֔רְתִּי אַךְ דַּלִּ֖ים הֵ֑ם נוֹאֲל֕וּ כִּ֣י לֹ֤א יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/004.yaml
  text: But I said[a], “Surely these are only the poor; they are foolish, for they do not know the way of Yahweh, the justice of their God.”
translation:
  language: de
  text: 'Doch ich sagte: »Gewiss, es sind nur die Armen. Sie handeln töricht, denn sie kennen den Weg Jahwes nicht, das Recht[a] ihres Gottes.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »das Urteil ihres Gottes« beziehungsweise »die Rechtsordnung ihres Gottes«. Das hebräische Wort kann Recht, Gerechtigkeit, Urteil oder eine rechtliche Bestimmung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: Doch ich sagte
  rationale: Die Verbindung aus Konjunktion und betontem Pronomen leitet im Kontext Jeremias eigene, von der vorausgehenden Suche abgesetzte Einschätzung ein. »Doch« gibt diesen milden Gegensatz wieder; »sagte« wahrt die Grundbedeutung des Verbs und kann auch inneres Reden bezeichnen.
- source_word: אַךְ דַּלִּים הֵם
  choice: Gewiss, es sind nur die Armen
  rationale: אַךְ verbindet hier bekräftigende und einschränkende Nuancen. »Gewiss« gibt die Bekräftigung wieder, »nur« die Einschränkung. דַּלִּים bezeichnet arme beziehungsweise sozial geringgestellte Menschen; »die Armen« ist im Deutschen klar und natürlich.
- source_word: נוֹאֲלוּ
  choice: Sie handeln töricht
  rationale: Die Form kann einen törichten Zustand oder törichtes Verhalten ausdrücken. »Sie handeln töricht« bewahrt den verbalen Charakter, ohne eine dauerhafte Wesenseigenschaft festzuschreiben.
- source_word: כִּי לֹא יָדְעוּ
  choice: denn sie kennen … nicht
  rationale: Die Wendung begründet das vorausgehende Urteil. Bei einem Weg im übertragenen Sinn ist »kennen« im Deutschen natürlicher als »wissen«.
- source_word: דֶּרֶךְ יְהוָה
  choice: den Weg Jahwes
  rationale: Die feste biblische Bildsprache für Gottes Willen, Handlungsweise und den von ihm gewiesenen Lebensweg bleibt erhalten. Der Gottesname wird in der im Deutschen üblichen Form »Jahwe« wiedergegeben.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: das Recht ihres Gottes
  rationale: מִשְׁפָּט umfasst je nach Zusammenhang Recht, Gerechtigkeit, Urteil oder rechtliche Ordnung. »Das Recht ihres Gottes« ist knapp, würdig und lässt die ethisch-rechtliche Bedeutungsbreite weitgehend offen; weitere mögliche Nuancen werden in der Fußnote genannt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Yahweh; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. »Jahwe« ist die etablierte deutsche Umschrift und bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von מִשְׁפַּט
  choice: das Recht ihres Gottes
  alternative: das Urteil ihres Gottes; die Rechtsordnung ihres Gottes; die Gerechtigkeit ihres Gottes
  rationale: Der Kontext verbindet מִשְׁפַּט mit dem »Weg Jahwes«, legt aber nicht eindeutig fest, ob vor allem Gottes gerechte Ordnung, seine Rechtsforderung oder sein Urteil gemeint ist. Die Übersetzung hält diese Spannung offen und dokumentiert die Alternativen in einer Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die kurzen Sätze folgen dem gedanklichen Aufbau des Hebräischen, ohne dessen Wortstellung unnatürlich nachzuahmen. Die Bildrede »Weg Jahwes« und die Mehrdeutigkeit des Rechtsbegriffs bleiben erhalten.
