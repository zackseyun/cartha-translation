id: JER.5.9
reference: Jeremiah 5:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לוֹא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה וְ/אִם֙ בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/009.yaml
  text: Shall I not punish for these things? declares Yahweh[a]. And on a nation such as this[b], shall I not avenge myself?
translation:
  language: de
  text: „Sollte ich all dies nicht ahnden?“, spricht Jahwe. „Und[a] sollte meine Seele[b] nicht an einem Volk wie diesem Rache nehmen?“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlicher kann die hebräische Verbindung mit „und wenn“ wiedergegeben werden; hier leitet sie eine zweite rhetorische Frage ein.
    reason: lexical_alternative
  - marker: b
    text: „Meine Seele“ ist hier eine eindringliche hebräische Bezeichnung für Jahwe selbst.
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל אֵלֶּה
  choice: Sollte ich all dies nicht …?
  rationale: Die Verbindung aus Fragepartikel und עַל leitet eine rhetorische Frage über die zuvor genannten Vergehen ein. „All dies“ gibt den rückverweisenden Plural im natürlichen Deutschen wieder; die Kausalbeziehung wird zusammen mit „ahnden“ verständlich.
- source_word: אֶפְקֹד
  choice: ahnden
  rationale: פקד bezeichnet hier Gottes strafendes Einschreiten. „Ahnden“ bewahrt den gerichtlichen Sinn und lässt sich im Deutschen natürlich auf die genannten Vergehen beziehen.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, geläufigem Deutsch wiedergegeben; der Gottesname יהוה erscheint gemäß dem Projektstandard als „Jahwe“.
- source_word: וְאִם
  choice: Und sollte
  rationale: Die Konjunktion verstärkt hier die parallele zweite rhetorische Frage und bezeichnet keine reale Bedingung. „Und sollte“ gibt diese Funktion natürlich wieder; der wörtlichere konditionale Wortlaut wird in einer Fußnote genannt.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: an einem Volk wie diesem
  rationale: בְּ markiert bei נקם das Ziel der Vergeltung. „An einem Volk wie diesem“ entspricht der deutschen Verbindung „an jemandem Rache nehmen“ und bewahrt den vergleichenden Demonstrativausdruck.
- source_word: תִתְנַקֵּם
  choice: Rache nehmen
  rationale: 'Der Hitpael von נקם hat reflexiv-mediale Bedeutung: sich rächen beziehungsweise Rache nehmen. Mit „meine Seele“ als Subjekt ist „Rache nehmen“ zugleich quellennah und idiomatisch.'
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die wörtliche Bildsprache bezeichnet Jahwes eigene Person in eindringlicher Weise. Sie bleibt im Haupttext erhalten, statt interpretierend zu „ich selbst“ geglättet zu werden.
theological_decisions:
- issue: Anthropopathische Rede von Gottes „Seele“ in נַפְשִׁי
  choice: „meine Seele“ im Haupttext beibehalten
  alternative: „ich selbst“ oder „mein Innerstes“
  rationale: Die hebräische Formulierung stellt Gottes persönliche Entschlossenheit zum Gericht besonders eindringlich dar. Die Übersetzung bewahrt diese Spannung; eine Fußnote erklärt den idiomatischen Selbstbezug, ohne Aussagen über Gottes Wesen einzutragen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Gottesname wird nach dem Projektstandard transliteriert und nicht durch einen Titel ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen rhetorischen Fragen bleiben erhalten. „Ahnden“ trägt den gerichtlichen Ton, ohne das traditionelle, im Deutschen missverständliche „heimsuchen“ zu verwenden; „meine Seele“ bewahrt bewusst die markante hebräische Bildsprache.
