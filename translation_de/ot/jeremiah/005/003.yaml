source:
  edition: WLC
  text: יְהֹוָ֗ה עֵינֶי/ךָ֮ הֲ/ל֣וֹא לֶ/אֱמוּנָה֒ הִכִּ֤יתָה אֹתָ/ם֙ וְֽ/לֹא חָ֔לוּ כִּלִּיתָ֕/ם מֵאֲנ֖וּ קַ֣חַת מוּסָ֑ר חִזְּק֤וּ פְנֵי/הֶם֙ מִ/סֶּ֔לַע מֵאֲנ֖וּ לָ/שֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/003.yaml
  text: O Yahweh[a], are not your eyes on faithfulness? You struck them, but they did not feel pain; you consumed them, but they refused to accept discipline. They made their faces harder than rock[b]; they refused to return.
translation:
  language: de
  text: HERR, sind deine Augen nicht auf Treue gerichtet? Du hast sie geschlagen, doch sie empfanden keinen Schmerz[a]. Du hast sie aufgerieben, doch sie weigerten sich, Zurechtweisung anzunehmen. Sie machten ihre Gesichter härter als Fels; sie weigerten sich umzukehren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »doch sie wurden nicht schwach«, »doch sie wurden nicht krank« oder »doch es schmerzte sie nicht«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Buße zu tun«. Das hebräische Wort bedeutet wörtlich »umzukehren« und bezeichnet bei den Propheten häufig die Rückkehr zu Gott.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוָה
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens ist würdig und allgemein verständlich; die direkte Anrede ist ohne zusätzliches „O“ im heutigen Deutsch natürlich.
- source_word: עֵינֶיךָ הֲלוֹא לֶאֱמוּנָה
  choice: sind deine Augen nicht auf Treue gerichtet?
  rationale: Bewahrt das konkrete Bild der Augen und gibt אֱמוּנָה im moralischen Zusammenhang als „Treue“ wieder, ohne die Wendung zu „Wahrheit“ oder „Aufrichtigkeit“ zu verengen.
- source_word: הִכִּיתָה אֹתָם
  choice: Du hast sie geschlagen
  rationale: Direkte und kraftvolle Wiedergabe des göttlichen Gerichtshandelns.
- source_word: וְלֹא חָלוּ
  choice: doch sie empfanden keinen Schmerz
  rationale: Im Zusammenhang mit dem Schlagen bezeichnet חלה wahrscheinlich die ausbleibende schmerzliche Reaktion; weitere mögliche Nuancen werden in der Fußnote bewahrt.
- source_word: כִּלִּיתָם
  choice: Du hast sie aufgerieben
  rationale: Gibt die intensive, bis an ein Ende führende Wirkung von כלה wieder, ohne zwingend eine vollständige Vernichtung zu behaupten, die mit dem fortgesetzten Widerstand der Betroffenen schwer vereinbar wäre.
- source_word: מֵאֲנוּ קַחַת מוּסָר
  choice: sie weigerten sich, Zurechtweisung anzunehmen
  rationale: „Zurechtweisung“ umfasst hier sowohl korrigierende Unterweisung als auch strafende Disziplin und klingt im modernen Deutsch natürlich.
- source_word: חִזְּקוּ פְנֵיהֶם מִסֶּלַע
  choice: Sie machten ihr Gesicht härter als Fels
  rationale: Bewahrt das hebräische Körperbild und den Vergleich als Ausdruck trotziger Unnachgiebigkeit.
- source_word: מֵאֲנוּ לָשׁוּב
  choice: sie weigerten sich umzukehren
  rationale: „Umkehren“ bewahrt die Bewegungsmetapher von שׁוב und lässt zugleich deren prophetisch-religiöse Bedeutung anklingen.
theological_decisions:
- issue: Prophetische Bedeutung von שׁוּב
  choice: umzukehren
  alternative: Buße zu tun
  rationale: Die Hauptfassung erhält das Bild der Rückkehr zu Gott, statt es ausschließlich mit dem theologischen Fachausdruck „Buße tun“ auszulegen; die Alternative wird in der Fußnote genannt.
- issue: Gegenstand von Gottes Blick in לֶאֱמוּנָה
  choice: Treue
  alternative: Wahrheit oder Aufrichtigkeit
  rationale: אֱמוּנָה kann Festigkeit, Verlässlichkeit und Treue bezeichnen. „Treue“ passt zum Vorwurf des beharrlichen Abfalls, ohne die möglichen Bedeutungsnuancen völlig aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und die konkreten Bilder des Hebräischen bleiben erhalten. „HERR“ folgt der verbreiteten deutschen Wiedergabetradition für den Gottesnamen; „Treue“, „aufgerieben“ und „umzukehren“ bewahren die semantische und theologische Spannung des Ausgangstextes.
