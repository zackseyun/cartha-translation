id: JER.5.12
reference: Jeremiah 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽחֲשׁוּ֙ בַּ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֹא ה֑וּא וְ/לֹא תָב֤וֹא עָלֵ֨י/נוּ֙ רָעָ֔ה וְ/חֶ֥רֶב וְ/רָעָ֖ב ל֥וֹא נִרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/012.yaml
  text: They have denied Yahweh and said, “He is not there, and no disaster will come upon us; we will not see sword or famine.”
translation:
  language: de
  text: 'Sie haben Yahweh verleugnet und gesagt: »Er ist es nicht,[a] und kein Unheil wird über uns kommen; Schwert und Hungersnot werden wir nicht erleben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er ist nicht da«; oder: »Er wird nichts tun.« Der hebräische Ausdruck ist knapp und mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּחֲשׁוּ
  choice: haben verleugnet
  rationale: כחשׁ mit ב bezeichnet hier, dass die Menschen Yahweh abstreiten beziehungsweise sich ihm gegenüber als treulos erweisen. „Verleugnet“ passt zum folgenden Ausspruch und geht über eine bloße Lüge hinaus.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: לֹא הוּא
  choice: Er ist es nicht
  rationale: Die knappe, elliptische Formulierung wird bewusst nicht zu einer eindeutigen Aussage über Existenz, Gegenwart oder Handeln Yahwehs erweitert. Das deutsche „Er ist es nicht“ bewahrt die Kürze und Unbestimmtheit weitgehend.
- source_word: רָעָה
  choice: Unheil
  rationale: רָעָה bezeichnet in diesem Gerichtszusammenhang drohendes Unglück oder Verderben, nicht moralisch Böses. „Unheil“ ist idiomatisch und lässt den Umfang offen.
- source_word: חֶרֶב
  choice: Schwert
  rationale: Die konkrete Bildsprache des hebräischen Textes bleibt erhalten; gemeint sein kann gewaltsames Gericht beziehungsweise Krieg.
- source_word: רָעָב
  choice: Hungersnot
  rationale: רָעָב bezeichnet hier nicht nur persönlichen Hunger, sondern eine umfassende Hungersnot als Gericht.
- source_word: לֹא נִרְאֶה
  choice: werden wir nicht erleben
  rationale: Wörtlich steht „werden wir nicht sehen“. Im Deutschen gibt „erleben“ den idiomatischen Sinn wieder, dass Schwert und Hungersnot sie nach ihrer Behauptung nicht treffen werden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Yahweh
  alternative: der HERR
  rationale: Der Eigenname wird als „Yahweh“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung der elliptischen Aussage לֹא הוּא
  choice: Er ist es nicht
  alternative: Er ist nicht da / Er wird nichts tun
  rationale: Der Kontext legt eine Leugnung von Yahwehs Gegenwart oder wirksamem Eingreifen nahe, doch der hebräische Wortlaut legt sich nicht ausdrücklich auf eine dieser Deutungen fest. Daher bleibt die Hauptübersetzung knapp; die möglichen Verständnisse stehen in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die direkte Rede bleibt knapp und selbstsicher; die echte Mehrdeutigkeit von לֹא הוּא wird nicht im Haupttext aufgelöst.
