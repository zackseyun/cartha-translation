id: JER.5.29
reference: Jeremiah 5:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַֽ/עַל אֵ֥לֶּה לֹֽא אֶפְקֹ֖ד נְאֻם יְהֹוָ֑ה אִ֚ם בְּ/ג֣וֹי אֲשֶׁר כָּ/זֶ֔ה לֹ֥א תִתְנַקֵּ֖ם נַפְשִֽׁ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/029.yaml
  text: Shall I not punish for these things? declares Yahweh[b][a]. Shall my soul not avenge itself on a nation such as this?
translation:
  language: de
  text: Sollte ich all das nicht ahnden?[a] – Ausspruch Jahwes. Sollte meine Seele[b] sich nicht an einem Volk wie diesem rächen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sollte ich all das nicht zur Rechenschaft ziehen?“ Das hebräische Verb kann Gottes gerichtliches Eingreifen und Bestrafen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch: „meine Seele“. Die Wendung bringt Jahwes persönliche Entschlossenheit zum Ausdruck; sinngemäß auch: „Sollte ich selbst mich nicht … rächen?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַל אֵלֶּה לֹא אֶפְקֹד
  choice: Sollte ich all das nicht ahnden?
  rationale: Die Verbindung aus Fragepartikel, עַל und אֵלֶּה bildet eine rhetorische Frage mit Rückbezug auf die zuvor genannten Vergehen. „Ahnden“ gibt die gerichtliche Bedeutung von פקד wieder, ohne das Bild eines bloßen „Besuchens“ missverständlich wörtlich zu übertragen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feierliche prophetische Formel נְאֻם wird knapp als „Ausspruch“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: אִם ... לֹא תִתְנַקֵּם
  choice: Sollte ... sich nicht ... rächen?
  rationale: אִם leitet hier parallel zur ersten Vershälfte eine nachdrückliche rhetorische Frage ein. Die reflexive Form von נקם wird mit „sich rächen“ grammatisch erkennbar wiedergegeben.
- source_word: בְּגוֹי אֲשֶׁר כָּזֶה
  choice: an einem Volk wie diesem
  rationale: Die Präposition bezeichnet bei נקם das Ziel der Vergeltung; אֲשֶׁר כָּזֶה charakterisiert das Volk nachdrücklich als ein Volk dieser Art.
- source_word: נַפְשִׁי
  choice: meine Seele
  rationale: Die wörtliche Wiedergabe bewahrt die auffällige hebräische Ausdrucksweise und die persönliche Entschlossenheit des Sprechers; eine Fußnote erläutert die idiomatische Bedeutung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Anthropopathische Rede von Gottes „Seele“
  choice: meine Seele
  alternative: ich selbst / ich
  rationale: Die Formulierung wird nicht stillschweigend geglättet. Sie bewahrt die konkrete hebräische Redeweise, ohne daraus eine systematische Aussage über Gottes Wesen abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen bleiben erhalten. „Ahnden“ ist knapp und gerichtlich geprägt; die ungewöhnliche Wendung „meine Seele“ wird bewusst im Haupttext bewahrt und in der Fußnote erläutert.
