  variant: modern standard German
source:
  edition: WLC
  text: אֵֽלֲכָה לִּ֤/י אֶל הַ/גְּדֹלִים֙ וַ/אֲדַבְּרָ֣ה אוֹתָ֔/ם כִּ֣י הֵ֗מָּה יָדְעוּ֙ דֶּ֣רֶךְ יְהוָ֔ה מִשְׁפַּ֖ט אֱלֹהֵי/הֶ֑ם אַ֣ךְ הֵ֤מָּה יַחְדָּו֙ שָׁ֣בְרוּ עֹ֔ל נִתְּק֖וּ מוֹסֵרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/005.yaml
  text: I will go to the great men and speak to them[a], for they know the way of Yahweh, the justice of their God. But they too, together, have broken the yoke; they have torn off the bonds.
translation:
  language: de
  text: Ich will zu den Vornehmen gehen und zu ihnen reden, denn sie kennen den Weg Jahwes, das Recht ihres Gottes.[a] Doch auch sie haben allesamt das Joch zerbrochen und die Fesseln zerrissen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Urteil ihres Gottes“, „die Rechtsordnung ihres Gottes“ oder „die Forderung ihres Gottes“. Das hebräische Wort kann Recht, Urteil oder verbindliche Ordnung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֲכָה לִּי
  choice: Ich will gehen
  rationale: Der Kohortativ mit ethischem Dativ drückt Entschluss und Absicht aus; „ich will“ gibt dies im Deutschen natürlich wieder.
- source_word: הַגְּדֹלִים
  choice: die Vornehmen
  rationale: Gemeint sind im Gegensatz zu den Geringen des vorigen Verses gesellschaftlich einflussreiche oder hochgestellte Menschen; „Vornehme“ wahrt den sozialen Bezug, ohne sie enger als Amtsträger zu bestimmen.
- source_word: וַאֲדַבְּרָה אוֹתָם
  choice: und mit ihnen reden
  rationale: Die ungewöhnliche Konstruktion mit אֵת wird hier idiomatisch als direkte Gesprächsaufnahme wiedergegeben.
- source_word: דֶּרֶךְ יְהוָה
  choice: der Weg Jahwes
  rationale: Die geläufige hebräische Metapher für Jahwes Willen und Lebensordnung bleibt konkret erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: מִשְׁפַּט אֱלֹהֵיהֶם
  choice: das Recht ihres Gottes
  rationale: מִשְׁפָּט umfasst hier Recht, Rechtsordnung, Urteil oder Forderung. „Recht“ bewahrt die rechtlich-ethische Weite im Deutschen.
- source_word: אַךְ הֵמָּה
  choice: Doch auch sie
  rationale: אַךְ markiert den scharfen Gegensatz zwischen der Erwartung und dem tatsächlichen Verhalten der Vornehmen; „auch sie“ bindet den Vergleich mit den zuvor genannten Geringen ein.
- source_word: יַחְדָּו
  choice: allesamt
  rationale: Das Wort betont ihr gemeinsames, ausnahmsloses Handeln; „allesamt“ ist knapp und würdig.
- source_word: שָׁבְרוּ עֹל
  choice: haben das Joch zerbrochen
  rationale: Das konkrete Bild gewaltsam abgeschüttelter Unterordnung wird ohne erklärende Verengung bewahrt.
- source_word: נִתְּקוּ מוֹסֵרוֹת
  choice: haben die Fesseln zerrissen
  rationale: Die parallele Metapher bezeichnet Bindungen oder Stricke; „Fesseln zerrissen“ vermittelt die gewaltsame Loslösung natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen. Die im modernen Deutschen übliche wissenschaftliche Form „Jahwe“ erhält dessen Namenscharakter.
- issue: Bedeutung von מִשְׁפַּט אֱלֹהֵיהֶם
  choice: das Recht ihres Gottes
  alternative: das Urteil ihres Gottes; die Rechtsordnung ihres Gottes; die Forderung ihres Gottes
  rationale: Der Kontext erlaubt mehrere rechtlich-ethische Nuancen. Der Haupttext verwendet den weiten Ausdruck „Recht“; die Fußnote hält die echte lexikalische Mehrdeutigkeit offen.
- issue: Bild von Joch und Fesseln
  choice: Die Metapher unverändert beibehalten
  alternative: Als Ablehnung von Gottes Gesetz ausdrücklich deuten
  rationale: Die Bilder können Verpflichtung, Herrschaft und Bundesgehorsam anklingen lassen, werden im Vers aber nicht auf eine einzige dogmatische Erklärung festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vornehme“ stellt den sozialen Gegensatz zum vorigen Vers her. Die Bildsprache von Joch und Fesseln sowie die Mehrdeutigkeit von מִשְׁפַּט bleiben erhalten.
