  yaml_path: translation/ot/jeremiah/005/020.yaml
  text: 'Declare this in the house of Jacob[a], and proclaim it in Judah, saying:'
translation:
  language: de
  text: 'Verkündet dies im Haus Jakobs und macht es in Juda bekannt mit den Worten:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Verkündet
  rationale: Der pluralische Imperativ von נגד fordert eine öffentliche Bekanntgabe; „verkündet“ bewahrt den feierlichen, heroldartigen Ton.
- source_word: זֹאת
  choice: dies
  rationale: Das feminine Demonstrativpronomen verweist auf die unmittelbar folgende Botschaft.
- source_word: בְּבֵית יַעֲקֹב
  choice: im Haus Jakob
  rationale: Die Wendung bezeichnet kollektiv die Nachkommen Jakobs beziehungsweise Israel; die örtliche Präposition wird formal und verständlich mit „im“ wiedergegeben.
- source_word: וְהַשְׁמִיעוּהָ
  choice: und macht es bekannt
  rationale: Der Hifil-Imperativ von שמע mit Objektsuffix bedeutet wörtlich, etwas hören zu lassen; „macht es bekannt“ gibt den kausativen und öffentlichen Sinn natürlich wieder.
- source_word: בִיהוּדָה
  choice: in Juda
  rationale: Die Präposition ב bezeichnet hier am einfachsten den Bereich, in dem die Botschaft verbreitet werden soll.
- source_word: לֵאמֹר
  choice: 'indem ihr sagt:'
  rationale: Der übliche Einleitungsinfinitiv führt den Wortlaut der folgenden Verkündigung ein und macht zugleich den Bezug zum pluralischen Imperativ deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Jakob“ bleibt als traditionelle kollektive Bezeichnung erhalten; „macht es bekannt“ vermeidet eine unnötig hölzerne Wiedergabe von „lasst es hören“, ohne den kausativen Sinn aufzugeben.
