source:
  edition: WLC
  text: הַ/נְּבִיאִ֞ים נִבְּא֣וּ בַ/שֶּׁ֗קֶר וְ/הַ/כֹּהֲנִים֙ יִרְדּ֣וּ עַל יְדֵי/הֶ֔ם וְ/עַמִּ֖/י אָ֣הֲבוּ כֵ֑ן וּ/מַֽה תַּעֲשׂ֖וּ לְ/אַחֲרִיתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/031.yaml
  text: The prophets prophesy falsely[a], and the priests rule by their authority, and my people love it so[b]. But what will you do when its end comes?
translation:
  language: de
  text: Die Propheten weissagen falsch, und die Priester herrschen kraft ihrer Vollmacht[a]; mein Volk aber liebt es so. Doch was werdet ihr tun, wenn ihr Ende kommt[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter ihrer Leitung“; wörtlicher: „durch ihre Hand“. Die hebräische Wendung ist schwierig.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „an ihrem Ende“. Das feminine Suffix kann sich auf die geschilderte Lage, das Land oder die Stadt beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְּאוּ בַשֶּׁקֶר
  choice: weissagen Lügen
  rationale: Die Verbindung bezeichnet falsches, trügerisches Weissagen. „Weissagen Lügen“ gibt die Anklage kräftig und ohne erklärende Erweiterung wieder.
- source_word: יִרְדּוּ
  choice: herrschen
  rationale: Das Verb רדה bezeichnet gewöhnlich das Herrschen oder Ausüben von Macht; „herrschen“ bewahrt diesen deutlichen Machtaspekt.
- source_word: עַל יְדֵיהֶם
  choice: nach ihrer Weisung
  rationale: Die schwierige Wendung bedeutet hier wahrscheinlich, dass die Priester in Abhängigkeit von den Propheten beziehungsweise unter deren Einfluss herrschen. Die Fußnote hält die formelleren und abweichenden Verständnismöglichkeiten offen.
- source_word: כֵן
  choice: so
  rationale: „So“ bezieht sich knapp auf den eben beschriebenen Zustand und drückt aus, dass das Volk ihn gutheißt.
- source_word: לְאַחֲרִיתָהּ
  choice: wenn all das sein Ende erreicht
  rationale: אַחֲרִית kann Ende, Ausgang oder Endzustand bezeichnen. Die Formulierung versteht den Rückbezug auf die geschilderten Verhältnisse, ohne den warnenden Ausgang näher auszudeuten; die grammatische Mehrdeutigkeit wird in der Fußnote genannt.
- source_word: וּמַה תַּעֲשׂוּ
  choice: Doch was werdet ihr tun
  rationale: Das einleitende ו markiert hier einen scharfen Übergang von der Anklage zur warnenden Frage; „Doch“ gibt diesen Gegensatz natürlich wieder.
theological_decisions:
- issue: Bezug des femininen Suffixes in לְאַחֲרִיתָהּ
  choice: 'Im Haupttext bezieht sich das Suffix auf die gesamte zuvor beschriebene korrupte Lage: „wenn all das sein Ende erreicht“.'
  alternative: Das Suffix kann sich auf das Land oder die Stadt beziehen; formeller wäre „an ihrem Ende“.
  rationale: Der unmittelbare Zusammenhang legt den Ausgang der geschilderten Zustände nahe. Da der hebräische feminine Bezug jedoch nicht eindeutig bestimmt ist, wird die Alternative ausdrücklich in der Fußnote bewahrt.
- issue: Verhältnis zwischen Propheten und Priestern in עַל יְדֵיהֶם
  choice: Die Priester herrschen nach der Weisung der Propheten.
  alternative: Die Priester herrschen „durch ihre Hand“, „unter ihrer Leitung“ oder möglicherweise aus eigener Machtvollkommenheit.
  rationale: Das maskuline Pluralsuffix weist im unmittelbaren Satzbau am ehesten auf die Propheten zurück. Die ungewöhnliche hebräische Wendung erlaubt jedoch keine völlig sichere Festlegung, weshalb die Unsicherheit offengelegt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallele Anklage bleibt knapp; Semikolon und adversatives „aber“ bilden den Umschlag zur Mitschuld des Volkes ab. Beide echten Unklarheiten des Hebräischen werden durch unmittelbar markierte Fußnoten offengehalten.
