source:
  edition: WLC
  text: וְ/הַ/נְּבִיאִים֙ יִֽהְי֣וּ לְ/ר֔וּחַ וְ/הַ/דִּבֵּ֖ר אֵ֣ין בָּ/הֶ֑ם כֹּ֥ה יֵעָשֶׂ֖ה לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/013.yaml
  text: And the prophets will become wind[a], and the word is not in them; thus it will be done to them.
translation:
  language: de
  text: Und die Propheten werden zu Wind[a], und das Wort ist nicht in ihnen. So wird es ihnen ergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geist« oder »Atem«. Das hebräische Wort רוּחַ kann all dies bedeuten; hier bezeichnet es wahrscheinlich die Leere oder Substanzlosigkeit der Propheten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנְּבִיאִים
  choice: Und die Propheten
  rationale: Die bestimmte Pluralform mit Konjunktion wird ohne zusätzlichen, im Hebräischen nicht ausdrücklich markierten Nachdruck wiedergegeben.
- source_word: יִהְיוּ לְרוּחַ
  choice: werden zu Wind
  rationale: היה mit לְ bezeichnet hier ein Werden. „Wind“ gibt im polemischen Zusammenhang am natürlichsten Leere oder Substanzlosigkeit wieder, während die Bedeutungsbreite von רוּחַ in der Fußnote erhalten bleibt.
- source_word: וְהַדִּבֵּר
  choice: und das Wort
  rationale: Die substantivierte Form bezeichnet hier am ehesten das gesprochene Wort beziehungsweise die Botschaft. „Das Wort“ wahrt die knappe Ausdrucksweise und lässt den Bezug offen.
- source_word: אֵין בָּהֶם
  choice: ist nicht in ihnen
  rationale: Die hebräische Existenzverneinung mit Präposition wird nah an der Formulierung des Ausgangstextes wiedergegeben und lässt offen, ob das wahre Gotteswort oder eine gehaltvolle Botschaft gemeint ist.
- source_word: כֹּה יֵעָשֶׂה לָהֶם
  choice: So wird es ihnen ergehen
  rationale: Die unpersönliche Passivkonstruktion bezeichnet eine angekündigte Folge, ohne den Handelnden zu nennen. Die deutsche Wendung ist natürlich und bewahrt den ominösen, unbestimmten Charakter.
theological_decisions:
- issue: Bedeutung von רוּחַ in der Verurteilung der Propheten
  choice: Wind
  alternative: Geist oder Atem
  rationale: „Wind“ lässt die Propheten als leer und gehaltlos erscheinen und passt zur Aussage, dass das Wort nicht in ihnen ist. Die Alternativen werden in der Fußnote genannt, damit die Mehrdeutigkeit des hebräischen Wortes nicht verloren geht.
- issue: Bezug von „das Wort“
  choice: Der Bezug bleibt unausgesprochen
  alternative: ausdrücklich „das Wort des HERRN“ oder „ihre Botschaft“
  rationale: Der hebräische Text nennt weder den HERRN noch ein Possessivpronomen. Eine ausdrückliche Festlegung würde die knappe und spannungsreiche Formulierung interpretierend erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bleibt bewusst knapp und nah an der hebräischen Parallelität; die Schlusswendung ist idiomatisch, ohne den im Hebräischen ungenannten Handelnden zu ergänzen.
