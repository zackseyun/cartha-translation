  variant: modern standard German
source:
  edition: WLC
  text: שָׁמְנ֣וּ עָשְׁת֗וּ גַּ֚ם עָֽבְר֣וּ דִבְרֵי רָ֔ע דִּ֣ין לֹא דָ֔נוּ דִּ֥ין יָת֖וֹם וְ/יַצְלִ֑יחוּ וּ/מִשְׁפַּ֥ט אֶבְיוֹנִ֖ים לֹ֥א שָׁפָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/028.yaml
  text: They have grown fat[a]; they are sleek. They also have gone beyond evil words. They do not judge with justice the case of the fatherless, so that they might prosper[c][b], and they do not uphold the justice of the poor.
translation:
  language: de
  text: Sie sind fett geworden, sie glänzen vor Wohlgenährtheit. Sie haben sogar die Grenzen des Bösen überschritten.[a] Über die Rechtsache der Waise entscheiden sie nicht, und sie haben Erfolg;[b] über den Rechtsanspruch der Armen entscheiden sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie haben sogar Worte/Sachen des Bösen überschritten.« Die Wendung kann meinen, dass sie im Bösen jede Grenze überschritten haben.'
    reason: lexical_alternative
  - marker: b
    text: 'Der kurze Satzteil ist schwer zu deuten. Möglich sind auch: »damit sie Erfolg haben« oder »obwohl sie Erfolg haben«.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁמְנוּ
  choice: sie sind fett geworden
  rationale: Bewahrt das konkrete hebräische Bild für Wohlstand und selbstgefällige Üppigkeit.
- source_word: עָשְׁתוּ
  choice: sie glänzen vor Wohlgenährtheit
  rationale: Das seltene Verb bezeichnet hier wohl das glänzende oder glatte Aussehen gut genährter Menschen; die Ergänzung macht das Bild im Deutschen verständlich.
- source_word: גַּם עָבְרוּ דִבְרֵי רָע
  choice: Auch haben sie das Maß des Bösen überschritten
  rationale: עָבְרוּ bezeichnet das Überschreiten einer Grenze; דִבְרֵי רָע kann wörtlich »Worte des Bösen«, aber idiomatisch auch böse Dinge, Angelegenheiten oder Taten meinen.
- source_word: דִּין לֹא דָנוּ דִּין יָתוֹם
  choice: Dem Waisen verschaffen sie kein Recht
  rationale: Die Verbindung von דִּין als Substantiv und Verb betont den Rechtsentscheid; idiomatisches Deutsch bewahrt den forensischen Sinn.
- source_word: וְיַצְלִיחוּ
  choice: und doch haben sie Erfolg
  rationale: Die knappe Syntax ist mehrdeutig. Die adversative Wiedergabe passt zum prophetischen Vorwurf, ohne eine ursächliche Behauptung festzuschreiben; Alternativen stehen in der Fußnote.
- source_word: וּמִשְׁפַּט אֶבְיוֹנִים לֹא שָׁפָטוּ
  choice: den Armen verhelfen sie nicht zu ihrem Recht
  rationale: Gibt מִשְׁפַּט als Rechtsanspruch wieder und bewahrt den sozialen wie gerichtlichen Gehalt.
theological_decisions:
- issue: Bedeutung von יָתוֹם
  choice: Waise
  alternative: Vaterloser
  rationale: »Waise« ist im heutigen Deutschen die natürliche Bezeichnung für ein schutzbedürftiges elternloses beziehungsweise vaterloses Kind; das Hebräische hebt historisch besonders den Verlust des Vaters hervor.
- issue: Zuordnung und Funktion von וְיַצְלִיחוּ
  choice: 'adversativ: »und doch haben sie Erfolg«'
  alternative: »damit sie Erfolg haben« oder »obwohl sie Erfolg haben«
  rationale: Die hebräische Satzfügung ist komprimiert und erlaubt mehrere Beziehungen zum vorhergehenden Satzteil. Die Fußnote erhält diese echte Mehrdeutigkeit, statt sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Bildkraft. Rechtssprache wird verständlich und idiomatisch wiedergegeben; die schwierige Syntax von וְיַצְלִיחוּ wird im Haupttext lesbar gestaltet und in der Fußnote offengehalten.
