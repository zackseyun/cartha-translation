  text: וְ/לָ/עָ֤ם הַ/זֶּה֙ הָיָ֔ה לֵ֖ב סוֹרֵ֣ר וּ/מוֹרֶ֑ה סָ֖רוּ וַ/יֵּלֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/023.yaml
  text: But this people has had a stubborn and rebellious heart; they have turned aside and gone away.
translation:
  language: de
  text: Aber dieses Volk hat ein widerspenstiges und rebellisches Herz; sie haben sich abgewandt und sind weggegangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵב סוֹרֵר וּמוֹרֶה
  choice: ein widerspenstiges und rebellisches Herz
  rationale: Die Verbindung bezeichnet eine innere Haltung, die sich beharrlich widersetzt und auflehnt. „Herz“ bleibt als biblisches Bild für Denken, Wollen und Gesinnung erhalten.
- source_word: סָרוּ
  choice: sie haben sich abgewandt
  rationale: Das Verb beschreibt das Abweichen beziehungsweise Sich-Abwenden und greift zugleich „widerspenstig“ klanglich und inhaltlich wieder auf.
- source_word: וַיֵּלֵכוּ
  choice: und sind weggegangen
  rationale: Die konkrete Bewegungsmetapher des hebräischen Textes bleibt erhalten und wird nicht zu einer bloßen Aussage über Ungehorsam verflacht.
- source_word: הָיָה
  choice: hat
  rationale: Im deutschen Hauptsatz bezeichnet das Präsens den bestehenden Zustand natürlich und klar; ein wörtliches „hat gehabt“ würde hier unnatürlich klingen und könnte einen inzwischen beendeten Zustand nahelegen.
theological_decisions:
- issue: Verhältnis von Herzenshaltung und Abwendung
  choice: 'Beide Aussagen bleiben nebeneinander stehen: Das Volk hat ein rebellisches Herz und hat sich abgewandt.'
  alternative: 'Die zweite Aussage ausdrücklich als Folge der ersten wiedergeben, etwa: „Darum haben sie sich abgewandt.“'
  rationale: Der hebräische Text stellt die Aussagen aneinander, ohne die logische Beziehung durch ein ausdrückliches „darum“ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektive Bezeichnung „dieses Volk“ wird im zweiten Satzteil entsprechend dem hebräischen Numeruswechsel mit dem pluralischen „sie“ wieder aufgenommen.
