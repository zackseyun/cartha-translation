  text: שִׁמְעוּ נָ֣א זֹ֔את עַ֥ם סָכָ֖ל וְ/אֵ֣ין לֵ֑ב עֵינַ֤יִם לָ/הֶם֙ וְ/לֹ֣א יִרְא֔וּ אָזְנַ֥יִם לָ/הֶ֖ם וְ/לֹ֥א יִשְׁמָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/021.yaml
  text: Hear this now[a], foolish people without understanding, who have eyes but do not see, who have ears but do not hear.
translation:
  language: de
  text: Hört doch dies, ihr törichtes Volk ohne Einsicht[a], das Augen hat und nicht sieht, das Ohren hat und nicht hört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein törichtes Volk und ohne Herz“. Das hebräische Wort für „Herz“ bezeichnet hier das Vermögen zu verstehen und richtig zu urteilen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ נָא זֹאת
  choice: Hört doch dies
  rationale: Der Pluralimperativ שִׁמְעוּ eröffnet einen eindringlichen prophetischen Aufruf. „doch“ gibt die mahnende, dringliche Färbung von נָא im heutigen Deutsch natürlicher wieder als ein höfliches „bitte“; „dies“ bewahrt den unmittelbaren Verweis von זֹאת.
- source_word: עַם סָכָל
  choice: ihr törichtes Volk
  rationale: עַם bezeichnet hier das kollektiv angeredete Volk. „Töricht“ erfasst die moralische und geistliche Verblendung von סָכָל, ohne den Ausdruck auf mangelnde Intelligenz zu verengen.
- source_word: וְאֵין לֵב
  choice: ohne Einsicht
  rationale: לֵב bezeichnet im Hebräischen häufig das innere Vermögen zu verstehen, zu urteilen und zu entscheiden. „Ohne Einsicht“ vermittelt diesen Sinn idiomatisch; die wörtliche Bildsprache wird in der Fußnote offengelegt.
- source_word: עֵינַיִם לָהֶם וְלֹא יִרְאוּ
  choice: Ihr habt Augen, aber seht nicht
  rationale: Die Formulierung erhält den Gegensatz zwischen dem Besitz der Augen und dem fehlenden Sehen. Die direkte Anrede entspricht dem kollektiven Adressaten und klingt im Deutschen natürlich.
- source_word: אָזְנַיִם לָהֶם וְלֹא יִשְׁמָעוּ
  choice: ihr habt Ohren, aber hört nicht
  rationale: Die parallele Satzform bewahrt den Aufbau des Hebräischen. „hört“ nimmt bewusst das Verb des einleitenden Aufrufs wieder auf und erhält so die prophetische Ironie.
theological_decisions:
- issue: Anthropologische Bildsprache von לֵב
  choice: ohne Einsicht
  alternative: und ohne Herz; ohne Verstand
  rationale: Gemeint ist nicht Gefühllosigkeit oder das Fehlen eines körperlichen Herzens, sondern mangelndes geistliches und moralisches Urteilsvermögen. „Einsicht“ gibt diese Bedeutung wieder, ohne eine bestimmte konfessionelle Anthropologie einzutragen; die wörtliche Form bleibt durch die Fußnote sichtbar.
- issue: Kollektiver Singular עַם
  choice: ihr törichtes Volk
  alternative: du törichtes Volk; törichte Nation
  rationale: Das Substantiv steht im Singular, wird aber durch pluralische Verbformen als Kollektiv angesprochen. Das deutsche „ihr“ macht diese grammatische Spannung verständlich und vermeidet eine unnötige politische Zuspitzung durch „Nation“.
translation_notes:
  register: Moderne, würdige prophetische Mahnrede. Die direkte Anrede und die parallelen Kurzsätze bewahren Nachdruck und Rhythmus; die Wiederholung von „hören“ hält die Wortverbindung zwischen Aufruf und Vorwurf aufrecht.
