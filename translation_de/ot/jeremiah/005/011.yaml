id: JER.5.11
reference: Jeremiah 5:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי֩ בָג֨וֹד בָּגְד֜וּ בִּ֗/י בֵּ֧ית יִשְׂרָאֵ֛ל וּ/בֵ֥ית יְהוּדָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/011.yaml
  text: For the house of Israel and the house of Judah have dealt very treacherously with me[a], declares Yahweh.
translation:
  language: de
  text: Denn das Haus Israel und das Haus Juda haben völlig treulos an mir gehandelt[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haben ganz gewiss treulos gegen mich gehandelt“ oder „haben mich völlig verraten“. Im Hebräischen wird das Verb durch einen absoluten Infinitiv derselben Wurzel nachdrücklich verstärkt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Anklage beziehungsweise Gerichtsankündigung ein und gibt die erklärende Funktion im Deutschen natürlich wieder.
- source_word: בָגֹוד בָּגְדוּ
  choice: haben völlig treulos gehandelt
  rationale: Das Verb בגד bezeichnet treuloses oder verräterisches Handeln. „Völlig“ gibt die Verstärkung durch den absoluten Infinitiv neben dem finiten Verb wieder, ohne die konkrete Art des Treuebruchs enger festzulegen als der hebräische Text.
- source_word: בִּי
  choice: an mir
  rationale: Die Präposition bezeichnet die Person, gegen die sich das treulose Handeln richtet. „An mir treulos handeln“ bewahrt diesen persönlichen Bezug und klingt im gehobenen modernen Deutsch angemessen.
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: das Haus Israel und das Haus Juda
  rationale: Bewahrt die parallele kollektive Ausdrucksweise des Hebräischen und die Unterscheidung der beiden Gemeinschaften.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die feste prophetische Botenformel knapp und würdevoll wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang des Verbs בגד im Zusammenhang des Bundesbruchs
  choice: treulos gehandelt
  alternative: mich völlig verraten / überaus hinterhältig an mir gehandelt
  rationale: „Treulos gehandelt“ lässt sowohl den persönlichen Verrat als auch den weiteren Gedanken gebrochener Loyalität erkennen, ohne eine engere dogmatische Deutung in den Text einzutragen.
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Wiedergabe als Eigenname bewahrt, dass im Ausgangstext das Tetragramm und nicht ein bloßer Titel steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel „spricht Jahwe“ wahrt den feierlichen Ton; die leicht gehobene Verbindung „treulos an mir gehandelt“ erhält den persönlichen Bezug des hebräischen בִּי.
