id: JER.5.14
reference: Jeremiah 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת יַ֚עַן דַּבֶּרְ/כֶ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה הִנְ/נִ֣י נֹתֵן֩ דְּבָרַ֨/י בְּ/פִ֜י/ךָ לְ/אֵ֗שׁ וְ/הָ/עָ֥ם הַ/זֶּ֛ה עֵצִ֖ים וַ/אֲכָלָֽתַ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/014.yaml
  text: 'Therefore thus says Yahweh[a], the God of hosts: Because you speak this word, behold, I am making my words in your mouth fire, and this people wood[c][b], and it will consume them.'
translation:
  language: de
  text: 'Darum spricht Jahwe, der Gott der Heerscharen: Weil ihr dieses Wort sagt,[a] siehe, ich mache meine Worte in deinem Mund zu Feuer[b] und dieses Volk zu Holz;[c] es wird sie verzehren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Weil ihr dieses Wort gesagt habt.« Die hebräische Form kann gegenwärtig oder mit Bezug auf eine gerade vorausgegangene Äußerung verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: »Siehe, ich gebe meine Worte in deinem Mund als Feuer.« Gemeint ist, dass Gott seine Worte im Mund Jeremias wie Feuer wirken lässt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »dieses Volk zu Brennholz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Zusammenhang knapp und natürlich wieder.
- source_word: כֹּה אָמַר
  choice: spricht
  rationale: Bewahrt die geläufige prophetische Botenformel in würdigem, verständlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als im Deutschen übliche wissenschaftliche Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: der Gott der Heerscharen
  rationale: Bewahrt die militärische beziehungsweise kosmische Weite des Ausdrucks, ohne den Bezug auf irdische oder himmlische Heere festzulegen.
- source_word: יַעַן דַּבֶּרְכֶם אֶת־הַדָּבָר הַזֶּה
  choice: Weil ihr dieses Wort redet
  rationale: Erhält den Plural der Angesprochenen sowie die lexikalische Verbindung zwischen ihrem »Wort« und Gottes »Worten«.
- source_word: הִנְנִי
  choice: siehe
  rationale: Bewahrt die feierliche Unmittelbarkeit der prophetischen Ankündigungsformel.
- source_word: נֹתֵן דְּבָרַי בְּפִיךָ לְאֵשׁ
  choice: mache ich meine Worte in deinem Mund zu Feuer
  rationale: Gibt die resultative Funktion von נתן idiomatisch wieder und bewahrt Plural, konkrete Mund-Metaphorik und den Singular der Anrede.
- source_word: הָעָם הַזֶּה עֵצִים
  choice: dieses Volk zu Holz
  rationale: Bewahrt den kollektiven Singular und die knappe prädikative Metapher; »Holz« lässt offen, ob allgemein Holz oder ausdrücklich Brennholz gemeint ist.
- source_word: וַאֲכָלָתַם
  choice: und es wird sie verzehren
  rationale: Der feminine Singular verweist grammatisch auf das Feuer; »verzehren« ist für dessen vernichtende Wirkung im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält einen Eigennamen. »Jahwe« erhält diesen, während »der HERR« ihn durch einen Titel ersetzt.
- issue: Bezug und Numerus der Anrede
  choice: Zunächst pluralisch »ihr«, danach singularisch »deinem«
  alternative: Durchgehend pluralische oder durchgehend singularische Anrede
  rationale: 'Der Wechsel entspricht den hebräischen Formen: דַּבֶּרְכֶם hat ein Suffix der 2. Person Plural, בְּפִיךָ eines der 2. Person Singular. So bleibt die mögliche Hinwendung vom angesprochenen Kollektiv zu Jeremia sichtbar.'
- issue: Subjekt von »wird sie verzehren«
  choice: das Feuer
  alternative: Gottes Wort beziehungsweise die Worte
  rationale: Das feminine Verb passt grammatisch zu אֵשׁ, »Feuer«, und führt zugleich die Metapher fort, ohne Gottes Worte vom Feuerbild zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel und Bildsprache. Der Numeruswechsel zwischen »ihr« und »deinem« wird nicht geglättet. »Heerscharen« ist leicht gehoben, aber als etablierter und inhaltlich offener Ausdruck angemessen.
