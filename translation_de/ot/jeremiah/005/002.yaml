  text: וְ/אִ֥ם חַי יְהֹוָ֖ה יֹאמֵ֑רוּ לָ/כֵ֥ן לַ/שֶּׁ֖קֶר יִשָּׁבֵֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/002.yaml
  text: And if they say, “As the LORD lives,” even so they swear falsely.
translation:
  language: de
  text: 'Und wenn sie sagen: »So wahr der HERR lebt!«, schwören sie dennoch falsch.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Und wenn
  rationale: Gibt die konditionale Form des Hebräischen unmittelbar wieder; der nachfolgende Gegensatz macht deutlich, dass selbst dieses Bekenntnis ihre Falschheit nicht ausschließt.
- source_word: חַי יְהֹוָה
  choice: So wahr der HERR lebt!
  rationale: Entspricht der etablierten deutschen Schwurformel und bewahrt den Gottesnamen in der üblichen Wiedergabe als HERR.
- source_word: לָכֵן
  choice: dennoch
  rationale: Markiert hier den nachdrücklichen Gegensatz zwischen der ausgesprochenen Schwurformel und dem tatsächlich falschen Schwören; diese kontextuelle Funktion entspricht dem englischen Konsultationstext „even so“.
- source_word: לַשֶּׁקֶר יִשָּׁבֵעוּ
  choice: schwören sie falsch
  rationale: Gibt Verb und adverbiale Bestimmung knapp und direkt wieder, ohne die Art der Falschheit näher festzulegen.
theological_decisions:
- issue: Gebrauch des Gottesnamens in einer unwahren Schwurformel
  choice: „der HERR“ in der wörtlich erkennbaren Schwurformel beibehalten
  alternative: Den Gottesnamen als „JHWH“ oder „Jahwe“ wiedergeben
  rationale: Die traditionelle deutsche Wiedergabe wahrt den Bezug auf das Tetragramm, ohne eine bestimmte Rekonstruktion seiner Aussprache vorauszusetzen.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem biblischem Ton. Die feste Wendung „So wahr der HERR lebt!“ macht den Charakter als Schwurformel natürlich erkennbar; „dennoch“ bewahrt die Spannung zwischen äußerem Bekenntnis und falschem Schwören.
