id: JER.5.18
reference: Jeremiah 5:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/גַ֛ם בַּ/יָּמִ֥ים הָ/הֵ֖מָּה נְאֻם יְהֹוָ֑ה לֹֽא אֶעֱשֶׂ֥ה אִתְּ/כֶ֖ם כָּלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/018.yaml
  text: Yet even in those days[a], declares Yahweh, I will not make a full end of you.
translation:
  language: de
  text: Doch selbst in jenen Tagen – Ausspruch Jahwes – werde ich euch nicht völlig vernichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »werde ich mit euch kein vollständiges Ende machen«.'
    reason: Die Fußnote bewahrt die konkrete hebräische Wendung hinter der idiomatischen Übersetzung »völlig vernichten«.
lexical_decisions:
- source_word: וְגַם
  choice: Doch selbst
  rationale: Die Verbindung führt den Gedankengang fort und hebt zugleich den Gegensatz zur angekündigten schweren Strafe hervor.
- source_word: בַּיָּמִים הָהֵמָּה
  choice: in jenen Tagen
  rationale: Die übliche prophetische Zeitangabe verweist auf die zuvor angekündigte Gerichtszeit.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die nominale prophetische Botenformel wird in knapper, würdevoller Form wiedergegeben; der Gottesname bleibt als Eigenname erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen gebräuchliche Umschrift des Tetragramms bewahrt den offenbarten Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: לֹא אֶעֱשֶׂה אִתְּכֶם כָּלָה
  choice: werde ich euch nicht völlig vernichten
  rationale: Die natürliche deutsche Wiedergabe erschließt den Sinn der hebräischen Wendung, nämlich keine vollständige Auslöschung herbeizuführen; die bildnähere Form steht in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird nach der im Deutschen üblichen Form transliteriert und nicht durch einen Herrschaftstitel ersetzt.
- issue: Reichweite des angekündigten Gerichts
  choice: werde ich euch nicht völlig vernichten
  alternative: werde ich mit euch kein vollständiges Ende machen
  rationale: Die Aussage hält die Spannung zwischen wirklichem, schwerem Gericht und der Verhinderung einer vollständigen Auslöschung aufrecht. Die idiomatische Übersetzung legt nicht fest, auf welche Weise oder an wem der bewahrte Rest bestehen bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche heben die eingeschobene prophetische Formel hervor; die Formulierung vermeidet sowohl unnötige Altertümlichkeit als auch eine Abschwächung des Gerichts.
