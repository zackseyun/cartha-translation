  terminology: „Vergehen“ und „Sünden“ bilden eine angemessene, nicht überzeichnende Differenzierung. „Das Gute“ gibt den bestimmten Singular kollektiv bzw. abstrakt wieder. Die Fußnoten erläutern den impliziten Rückbezug, ohne ihn im Haupttext unzulässig zu spezifizieren.
  issues:
