source:
  edition: WLC
  text: עֲוֺנוֹתֵי/כֶ֖ם הִטּוּ אֵ֑לֶּה וְ/חַטֹּ֣אותֵי/כֶ֔ם מָנְע֥וּ הַ/טּ֖וֹב מִ/כֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/025.yaml
  text: Your iniquities have turned these away[b][a], and your sins have withheld the good from you.
translation:
  language: de
  text: Eure Vergehen haben dies[a] von euch abgewandt, und eure Sünden haben das Gute[b] von euch ferngehalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese Dinge“; gemeint sind die zuvor genannten Wohltaten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die guten Gaben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲוֺנוֹתֵיכֶם
  choice: eure Vergehen
  rationale: „Vergehen“ bezeichnet schuldhaftes Unrecht, bewahrt das moralische Gewicht von עָוֹן und bleibt zugleich vom folgenden „Sünden“ unterscheidbar.
- source_word: הִטּוּ
  choice: haben … abgewendet
  rationale: Das Hifil von נטה bezeichnet hier ein Abwenden oder Umlenken; im Zusammenhang sind die zuvor genannten Wohltaten von den Angeredeten abgewendet worden.
- source_word: אֵלֶּה
  choice: dies
  rationale: Das deutsche Demonstrativpronomen verweist knapp und natürlich auf das zuvor Genannte, ohne den im Hebräischen unausgesprochenen Bezug im Haupttext genauer festzulegen.
- source_word: וְחַטֹּאותֵיכֶם
  choice: und eure Sünden
  rationale: „Sünden“ ist die klare, geläufige Wiedergabe von חַטָּאוֹת und hält die begriffliche Unterscheidung zum ersten Satzglied aufrecht.
- source_word: מָנְעוּ
  choice: haben … ferngehalten
  rationale: מנע drückt Vorenthalten oder Zurückhalten aus. „Ferngehalten“ verbindet sich im Deutschen idiomatisch mit „von euch“ und bewahrt das Bild der Entbehrung.
- source_word: הַטּוֹב
  choice: das Gute
  rationale: Die substantivierte Singularform gibt die abstrakte oder kollektiv verstandene hebräische Form wieder, ohne sie auf Wohlstand oder einzelne Segnungen zu verengen.
- source_word: מִכֶּם
  choice: von euch
  rationale: Die Präposition מן bezeichnet Trennung beziehungsweise Entzug und wird mit „von euch ferngehalten“ natürlich wiedergegeben.
theological_decisions:
- issue: Bezug des Demonstrativpronomens אֵלֶּה
  choice: Der Haupttext lässt den Bezug mit „dies“ unausgesprochen.
  alternative: „diese Dinge“, „diese Segnungen“ oder ausdrücklich „den Regen und die Erntezeiten“
  rationale: Das Hebräische verweist lediglich auf den vorausgehenden Zusammenhang. Eine genauere Benennung im Haupttext würde die echte anaphorische Offenheit des Verses unnötig auflösen.
- issue: Umfang der Bedeutung von הַטּוֹב
  choice: „das Gute“ bleibt abstrakt beziehungsweise kollektiv offen.
  alternative: „die guten Gaben“, „das Wohlergehen“ oder „Gutes“
  rationale: So können sowohl konkrete Segnungen des Zusammenhangs als auch Wohlergehen allgemein mitgehört werden, ohne den Ausdruck über den hebräischen Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallele Gegenüberstellung „Vergehen/Sünden“ und „dies/das Gute“ bleibt erhalten; auf altertümliche Wörter wie „Missetaten“ wird verzichtet.
