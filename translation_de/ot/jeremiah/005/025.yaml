  source_fidelity: Die Wiedergabe trifft die Begriffe עָוֹן („Vergehen“) und חַטָּאוֹת („Sünden“) sowie הַטּוֹב („das Gute“) angemessen und bewahrt die anaphorische Offenheit von אֵלֶּה. Das bloße „haben dies abgewendet“ ist im heutigen Deutsch jedoch richtungsmehrdeutig und wird gewöhnlich als „dies verhindert/abgewehrt“ verstanden. Der im hebräischen Verb gemeinte Entzug muss daher klarer als Abwendung von den Angeredeten ausgedrückt werden.
