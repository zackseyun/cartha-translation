source:
  edition: WLC
  text: וְ/לֹֽא אָמְר֣וּ בִ/לְבָבָ֗/ם נִ֤ירָא נָא֙ אֶת יְהוָ֣ה אֱלֹהֵ֔י/נוּ הַ/נֹּתֵ֗ן גֶּ֛שֶׁם ו/ירה וּ/מַלְק֖וֹשׁ בְּ/עִתּ֑/וֹ שְׁבֻע֛וֹת חֻקּ֥וֹת קָצִ֖יר יִשְׁמָר לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/024.yaml
  text: They did not say in their heart[a], ‘Let us now fear Yahweh our God, who gives rain in its season, both the early rain and the latter rain, who keeps for us the appointed weeks of the harvest.’
translation:
  language: de
  text: 'Sie sagten nicht in ihrem Herzen: »Lasst uns doch Jahwe, unseren Gott, fürchten! Er gibt Regen zu seiner Zeit, Frühregen und Spätregen[a], und bewahrt uns die festgesetzten Wochen der Ernte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Herbstregen und Frühlingsregen«.'
    reason: Die hebräischen Wörter bezeichnen den frühen Regen zu Beginn und den späten Regen gegen Ende der Regenzeit; die klimatischen Jahreszeiten lassen sich alternativ ausdrücklich benennen.
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: Sie sagen nicht
  rationale: Das einleitende ו wird im Deutschen nicht eigens wiedergegeben; das hebräische Perfekt formuliert hier im Zusammenhang einen gegenwärtig erhobenen Vorwurf, wofür das deutsche Präsens natürlich ist.
- source_word: בִלְבָבָם
  choice: in ihrem Herzen
  rationale: Die kollektive Singularform »Herz« wird bewahrt. Sie bezeichnet das innere Überlegen und Wollen des Volkes, ohne sie interpretierend auf bloßes Sprechen zu sich selbst zu verengen.
- source_word: נִירָא נָא
  choice: Lasst uns doch … fürchten
  rationale: Der Kohortativ drückt eine gemeinsame Aufforderung aus; נָא wird mit dem im Deutschen natürlich mahnenden »doch« wiedergegeben, ohne ihm zwingend eine zeitliche Bedeutung beizulegen.
- source_word: אֶת יְהוָה אֱלֹהֵינוּ
  choice: Jahwe, unseren Gott
  rationale: Der Gottesname wird als »Jahwe« wiedergegeben; die Apposition »unseren Gott« und die Akkusativfunktion bleiben klar erkennbar.
- source_word: הַנֹּתֵן גֶּשֶׁם
  choice: Er gibt Regen
  rationale: Das attributive Partizip beschreibt Jahwes fortdauerndes Handeln. Ein neuer deutscher Hauptsatz ist hier klar und natürlich und behält denselben Bezug bei.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: Frühregen und Spätregen
  rationale: Die traditionellen deutschen Agrarbezeichnungen bilden die zeitliche Gegenüberstellung der beiden saisonalen Regenfälle ab; ihre kalendarische Einordnung wird in der Fußnote erläutert.
- source_word: בְּעִתּוֹ
  choice: zu seiner Zeit
  rationale: Der Singularsuffix bezieht sich am natürlichsten auf den Regen als Gesamtgabe. Die Formulierung wahrt zugleich den Gedanken der angemessenen, festgesetzten Zeit.
- source_word: שְׁבֻעוֹת חֻקּוֹת קָצִיר
  choice: die festgesetzten Wochen der Ernte
  rationale: חֻקּוֹת kennzeichnet die Erntewochen als festgelegt oder geordnet. Die Formulierung lässt offen, ob primär an göttliche Festsetzung oder an die regelmäßige Ordnung des Jahres gedacht ist.
- source_word: יִשְׁמָר לָנוּ
  choice: bewahrt uns
  rationale: שׁמר bezeichnet hier das Erhalten beziehungsweise Sichern der für die Ernte bestimmten Wochen zugunsten des Volkes. Die deutsche Wortstellung gibt לָנוּ knapp und idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von »fürchten«
  choice: fürchten
  alternative: Ehrfurcht haben vor
  rationale: Das direkte Verb bewahrt die Spannweite des hebräischen ירא zwischen Furcht, Scheu und ehrfürchtiger Anerkennung, statt sie auf eine ausschließlich positive Nuance festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige kollektive Wendung »in ihrem Herzen« bleibt quellennah erhalten; der folgende Relativgedanke wird zur besseren deutschen Lesbarkeit in koordinierte Hauptsätze aufgelöst.
