source:
  edition: WLC
  text: עַל כֵּן֩ הִכָּ֨/ם אַרְיֵ֜ה מִ/יַּ֗עַר זְאֵ֤ב עֲרָבוֹת֙ יְשָׁדְדֵ֔/ם נָמֵ֤ר שֹׁקֵד֙ עַל עָ֣רֵי/הֶ֔ם כָּל הַ/יּוֹצֵ֥א מֵ/הֵ֖נָּה יִטָּרֵ֑ף כִּ֤י רַבּוּ֙ פִּשְׁעֵי/הֶ֔ם עָצְמ֖וּ משבותי/הם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/006.yaml
  text: Therefore a lion from the forest strikes them down[a]; a wolf of the deserts devastates them; a leopard keeps watch over their cities. Everyone who goes out from them will be torn apart, because their transgressions are many[b]; their apostasies have grown strong.
translation:
  language: de
  text: Darum schlägt sie ein Löwe aus dem Wald nieder; ein Wolf aus den Steppen[a] verwüstet sie. Ein Leopard lauert bei ihren Städten. Jeder, der aus ihnen hinausgeht, wird zerrissen. Denn ihre Vergehen sind zahlreich, und ihre Abtrünnigkeiten[b] sind stark geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Wolf der Abendstunden“. Die hebräische Wendung kann mit abendlicher Jagdzeit verbunden werden; wahrscheinlicher bezeichnet das Wort hier jedoch trockene Ebenen oder Steppengebiete.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Abkehr(en)“ beziehungsweise „ihr Abfall“. Das hebräische Wort bezeichnet wiederholtes Abweichen von der geschuldeten Treue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּם
  choice: schlägt sie … nieder
  rationale: Das Verb נכה bezeichnet einen heftigen, hier wohl tödlichen Schlag. Das Präsens fügt sich in die lebendige Gerichtsankündigung und in die anschließenden Verbformen ein.
- source_word: אַרְיֵה מִיַּעַר
  choice: ein Löwe aus dem Wald
  rationale: Bewahrt das konkrete Raubtierbild und die Herkunftsangabe in natürlichem Deutsch.
- source_word: זְאֵב עֲרָבוֹת
  choice: ein Wolf aus den Steppen
  rationale: עֲרָבוֹת bezeichnet hier am naheliegendsten trockene Ebenen oder Steppengebiete. Die mögliche Deutung als Abendstunden wird in der Fußnote erhalten.
- source_word: יְשָׁדְדֵם
  choice: verwüstet sie
  rationale: שדד drückt gewaltsames Verheeren oder Ausplündern aus; „verwüstet“ passt zum Bild des angreifenden Raubtiers.
- source_word: נָמֵר שֹׁקֵד עַל
  choice: Ein Leopard liegt … auf der Lauer
  rationale: שֹׁקֵד bezeichnet wachsames, anhaltendes Beobachten. Im feindlichen Raubtierkontext gibt „auf der Lauer liegen“ die gemeinte Wachsamkeit natürlich wieder.
- source_word: כָּל הַיּוֹצֵא מֵהֵנָּה
  choice: Jeder, der aus ihnen hinausgeht
  rationale: Bewahrt die umfassende Aussage von כָּל und den pluralischen Rückbezug, der sich im Kontext auf die Städte bezieht.
- source_word: יִטָּרֵף
  choice: wird zerrissen
  rationale: Die Niphalform von טרף beschreibt das Zerrissenwerden als Beute eines Raubtiers und hält das Bild eindringlich fest.
- source_word: פִּשְׁעֵיהֶם
  choice: ihre Vergehen
  rationale: פשע umfasst schuldhafte Übertretung und Auflehnung. „Vergehen“ ist verständlich und lässt den rebellischen Beiklang im Zusammenhang bestehen.
- source_word: רַבּוּ
  choice: sind zahlreich
  rationale: Gibt den resultativen Zustand großer Menge knapp und idiomatisch wieder.
- source_word: עָצְמוּ
  choice: sind stark geworden
  rationale: Bewahrt die Grundbedeutung von עצם als Erstarken oder Mächtigwerden, statt die Aussage lediglich als zahlenmäßige Zunahme zu deuten.
- source_word: משבותיהם
  choice: ihre Abtrünnigkeiten
  rationale: Der Ausdruck bezeichnet wiederholte Abwendungen von der geschuldeten Treue. „Abtrünnigkeiten“ erhält sowohl den Plural als auch den ernsten Charakter des Bundesbruchs.
theological_decisions:
- issue: Wiedergabe der Abkehr von der Bundestreue in משבותיהם
  choice: ihre Abtrünnigkeiten
  alternative: ihre Abwendungen / ihr Abfall
  rationale: „Abtrünnigkeiten“ bezeichnet ernsthafte und wiederholte Treuebrüche, ohne die Aussage auf eine bestimmte konfessionelle Lehre festzulegen. Die Fußnote hält die wörtlichere Bewegungsmetapher der Abwendung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger Raubtierbildsprache. Die Satzfolge bleibt nah an der hebräischen Parallelstruktur; weniger geläufige oder mehrdeutige Ausdrücke werden durch Fußnoten erläutert.
