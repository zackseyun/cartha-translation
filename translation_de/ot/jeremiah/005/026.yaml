base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/026.yaml
  text: For wicked men are found among my people[a]; they lie in wait like fowlers. They set a trap[b]; they catch men.
translation:
  language: de
  text: Denn unter meinem Volk finden sich Frevler. Sie lauern wie Vogelfänger[a]; sie stellen eine Falle auf[b] und fangen Menschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig. Möglich ist auch: „wie Vogelfänger, die sich ducken“ oder „wie das Lauern der Vogelfänger“. Gemeint sind verborgene Jäger, die auf Beute warten.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann das Wort „Zerstörer“ oder „etwas Zerstörerisches“ bedeuten. Im Zusammenhang ist wohl eine Fangvorrichtung gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Anklage ein und bewahrt den erklärenden beziehungsweise kausalen Zusammenhang.
- source_word: נִמְצְאוּ בְעַמִּי
  choice: unter meinem Volk finden sich
  rationale: 'Gibt die passive beziehungsweise resultative Aussage idiomatisch wieder: Solche Personen sind innerhalb der Gemeinschaft vorhanden.'
- source_word: רְשָׁעִים
  choice: Frevler
  rationale: Bezeichnet schuldhaft böse Menschen. „Frevler“ ist knapp, würdig und bewahrt den Personenbezug des maskulinen Plurals.
- source_word: יָשׁוּר
  choice: sie lauern
  rationale: Der morphologische Singular kann kollektiv oder distributiv auf die zuvor genannten Frevler bezogen werden. „Lauern“ bringt die verborgene, feindliche Absicht zum Ausdruck.
- source_word: כְּשַׁךְ יְקוּשִׁים
  choice: wie Vogelfänger
  rationale: Die schwierige Wendung gehört zum Bild des verdeckten Auflauerns durch Vogelfänger. Der Haupttext wahrt das klare Vergleichsbild, während die Unsicherheit in einer Fußnote kenntlich gemacht wird.
- source_word: הִצִּיבוּ מַשְׁחִית
  choice: sie stellen eine verderbliche Falle auf
  rationale: הִצִּיבוּ bezeichnet das Aufstellen oder Platzieren; מַשְׁחִית hat eine zerstörerische Bedeutung, bezeichnet im Fangkontext aber offenbar eine Fangvorrichtung. Die Wiedergabe bewahrt beide Aspekte.
- source_word: אֲנָשִׁים יִלְכֹּדוּ
  choice: und fangen Menschen
  rationale: לכד setzt das Fangbild fort. אֲנָשִׁים wird hier natürlich und genau mit „Menschen“ wiedergegeben.
