  register: Modernes, würdiges Standarddeutsch. „Frevler“ verdichtet den ethischen Vorwurf; „verderbliche Falle“ erhält sowohl das Fangbild als auch die zerstörerische Bedeutung des schwierigen Nomens. Alle Unsicherheiten werden ausgewiesen, ohne die Bildfolge unnötig zu glätten.
