  yaml_path: translation/ot/jeremiah/005/008.yaml
  text: They were well-fed[a], lusty stallions; each one neighing after his neighbor’s wife.
translation:
  language: de
  text: Sie waren wohlgenährte, brünstige Hengste[a]; jeder wieherte nach der Frau seines Nächsten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »wohlgenährte Hengste, die früh aufstanden« oder »sich früh aufmachten«. Das mit »brünstig« wiedergegebene hebräische Wort ist schwierig; im Zusammenhang kann es frühes, begieriges Umherstreifen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּסִים
  choice: Hengste
  rationale: Das Grundwort bedeutet »Pferde«. Das sexuell geprägte Bild und der Bezug auf die Frau des Nächsten stellen hier männliche Tiere heraus; »Hengste« gibt das im Deutschen klar und natürlich wieder.
- source_word: מְיֻזָּנִים
  choice: wohlgenährte
  rationale: Das passive Partizip bezeichnet gefütterte beziehungsweise gut genährte Tiere. »Wohlgenährt« vermittelt sowohl die Versorgung als auch die daraus folgende Kraft der Tiere.
- source_word: מַשְׁכִּים
  choice: brünstige
  rationale: Die Form ist schwierig und bedeutet ihrer üblichen Ableitung nach »früh aufstehend« oder »sich früh aufmachend«. Im deutlich sexuellen Vergleich bezeichnet sie hier wahrscheinlich die ungestüme Begierde der Hengste; »brünstig« macht diese kontextuelle Stoßrichtung verständlich, während die formnähere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: אִישׁ
  choice: jeder
  rationale: Der Singular wird distributiv gebraucht. »Jeder« gibt die Aussage knapp und idiomatisch wieder.
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: nach der Frau seines Nächsten
  rationale: Die Präposition bezeichnet zusammen mit dem Wiehern die begehrliche Ausrichtung auf die Frau eines anderen. »Seines Nächsten« bewahrt zugleich die sprachliche Verbindung zum Verbot des Ehebruchs.
- source_word: יִצְהָלוּ
  choice: wieherte
  rationale: Das Verb bezeichnet den Ruf eines Pferdes. Das Präteritum passt zur vorausgehenden Beschreibung und hält das Tierbild lebendig.
theological_decisions:
- issue: Sexuelle Untreue im Hengstvergleich
  choice: Das Bild wird ausdrücklich als begehrliches Wiehern nach der Frau des Nächsten wiedergegeben.
  alternative: Eine neutralere Wiedergabe als bloßes Zugehen oder Rufen zur Frau eines anderen.
  rationale: Der unmittelbare Zusammenhang und die Pferdemetapher zeichnen ungezügeltes sexuelles Verlangen. Die Übersetzung benennt diese Stoßrichtung, ohne über den Bildgehalt hinaus eine besondere Lehrdeutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit einem bewusst kräftigen Tierbild. »Brünstig« ist deutlich, aber nicht vulgär. Die schwierige hebräische Form wird im Haupttext kontextgerecht und in der Fußnote formnäher wiedergegeben.
