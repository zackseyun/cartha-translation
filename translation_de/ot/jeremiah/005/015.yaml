source:
  edition: WLC
  text: הִנְ/נִ֣י מֵבִיא֩ עֲלֵי/כֶ֨ם גּ֧וֹי מִ/מֶּרְחָ֛ק בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהֹוָ֑ה גּ֣וֹי אֵיתָ֣ן ה֗וּא גּ֤וֹי מֵ/עוֹלָם֙ ה֔וּא גּ֚וֹי לֹא תֵדַ֣ע לְשֹׁנ֔/וֹ וְ/לֹ֥א תִשְׁמַ֖ע מַה יְדַבֵּֽר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/005/015.yaml
  text: Look[a], I am bringing against you a nation from far away, O house of Israel, declares Yahweh. It is a mighty nation; it is an ancient nation[b], a nation whose language you do not know[c], and whose speech you do not understand.
translation:
  language: de
  text: Seht, ich bringe ein Volk aus der Ferne gegen euch, Haus Israel, spricht Jahwe. Es ist ein mächtiges Volk[a], ein uraltes Volk[b], ein Volk, dessen Sprache ihr nicht kennt und dessen Rede ihr nicht versteht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein starkes Volk“ oder „ein beständiges Volk“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ein Volk von alters her“.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „dessen Zunge ihr nicht kennt und nicht versteht, was es redet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Die Wendung leitet eine feierliche göttliche Ankündigung ein. „Seht“ bewahrt den hinweisenden und aufmerksamkeitslenkenden Charakter in heutigem Deutsch.
- source_word: מֵבִיא עֲלֵיכֶם
  choice: bringe ... gegen euch
  rationale: Das Partizip bezeichnet das unmittelbar bevorstehende Handeln. Im Gerichtskontext bringt „gegen euch“ die feindliche Stoßrichtung von עַל natürlich zum Ausdruck.
- source_word: גּוֹי
  choice: Volk
  rationale: „Volk“ bezeichnet hier eine ethnisch-politische Gemeinschaft und erlaubt es, die rhetorisch wichtige dreifache Wiederholung beizubehalten.
- source_word: מִמֶּרְחָק
  choice: aus der Ferne
  rationale: Die Formulierung gibt die räumliche Entfernung knapp und idiomatisch wieder.
- source_word: בֵּית יִשְׂרָאֵל
  choice: Haus Israel
  rationale: Die Wendung wird als direkte Anrede verstanden und in ihrer biblisch geprägten, zugleich verständlichen Form bewahrt.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Dies ist eine natürliche deutsche Wiedergabe der prophetischen Botenformel.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: גּוֹי אֵיתָן
  choice: ein mächtiges Volk
  rationale: אֵיתָן kann Stärke, Festigkeit oder dauerhaften Bestand bezeichnen. Im Zusammenhang einer Invasion steht die furchteinflößende Stärke im Vordergrund; die übrigen Nuancen bleiben in der Fußnote sichtbar.
- source_word: גּוֹי מֵעוֹלָם
  choice: ein uraltes Volk
  rationale: מֵעוֹלָם bezeichnet hier am ehesten ein seit alter Zeit bestehendes Volk, nicht ewige Existenz.
- source_word: לֹא תֵדַע לְשֹׁנוֹ
  choice: dessen Sprache ihr nicht kennt
  rationale: „Sprache“ gibt das bildlich gebrauchte „Zunge“ in natürlichem modernem Deutsch wieder.
- source_word: וְלֹא תִשְׁמַע מַה יְדַבֵּר
  choice: bei dem ihr nicht versteht, was es sagt
  rationale: שׁמע meint hier ein Hören mit Verstehen. Die Übersetzung wahrt den Inhalt des hebräischen Relativsatzes, ohne bloß akustisches Nicht-Hören nahezulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen und ersetzt ihn nicht durch einen Titel.
- issue: Zeitliche Bedeutung von מֵעוֹלָם
  choice: uralt
  alternative: von alters her; ewig
  rationale: Im Zusammenhang wird das hohe Alter beziehungsweise lange Bestehen des angreifenden Volkes ausgesagt. Eine Aussage über ewige Existenz wäre hier sachlich und theologisch irreführend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Wiederholung von „Volk“ bildet die hebräische Rhetorik nach. Die Pluralformen „euch“ und „ihr“ entsprechen der kollektiven Anrede an das Haus Israel; „Seht“ vermeidet das altertümliche „Siehe“, ohne den feierlichen Aufmerksamkeitsruf aufzugeben.
