source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֛וּ הַ/כֹּהֲנִ֥ים וְ/הַ/נְּבִאִ֖ים וְ/כָל הָ/עָ֑ם אֶֽת יִרְמְיָ֔הוּ מְדַבֵּ֛ר אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/007.yaml
  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
translation:
  language: de
  text: Die Priester, die Propheten und das ganze Volk hörten, wie Jeremia diese Worte im Haus Jahwes[a] sprach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“. Wörtlich: „im Haus Jahwes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: hörten
  rationale: Das Wayyiqtol erzählt ein vergangenes Ereignis. „Hörten“ gibt שׁמע hier schlicht wieder, ohne eine weitergehende Bedeutung wie „gehorchen“ einzutragen.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: Die Priester, die Propheten und das ganze Volk
  rationale: Die drei koordinierten Gruppen werden vollständig bewahrt; im natürlichen Deutschen muss die wiederholte Konjunktion nicht nachgebildet werden.
- source_word: אֶת יִרְמְיָהוּ מְדַבֵּר
  choice: hörten, wie Jeremia … sprach
  rationale: Die Konstruktion aus Wahrnehmungsverb, Objekt und Partizip beschreibt Jeremia während des Sprechens. Der deutsche Nebensatz mit „wie“ gibt diese Gleichzeitigkeit idiomatisch wieder.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: דְּבָרִים kann „Worte“ oder „Dinge“ bedeuten; im unmittelbaren Redekontext ist „Worte“ präzise und natürlich.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die Wiedergabe bewahrt das hebräische Bild „Haus JHWHs“. „Im“ entspricht der Verbindung von Präposition und bestimmtem Ortsbezug; „Tempel“ wird als verständliche Alternative in der Fußnote genannt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben. Die im Deutschen etablierte Form „Jahwe“ entspricht dem hebräischen Tetragramm, ohne es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält ausdrücklich den Gottesnamen. „Jahwe“ wahrt dessen Eigenname-Charakter; „der HERR“ ist die traditionelle Ersatzlesung, würde aber den Namen durch einen Titel wiedergeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch, während die Aufzählung, die Gleichzeitigkeit des Hörens und Sprechens sowie das Bild vom „Haus Jahwes“ erhalten bleiben.
