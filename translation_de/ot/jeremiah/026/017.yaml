  text: וַ/יָּקֻ֣מוּ אֲנָשִׁ֔ים מִ/זִּקְנֵ֖י הָ/אָ֑רֶץ וַ/יֹּ֣אמְר֔וּ אֶל כָּל קְהַ֥ל הָ/עָ֖ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/017.yaml
  text: Then some of the elders of the land stood up and said to all the assembly of the people[a], saying,
translation:
  language: de
  text: 'Da erhoben sich einige der Ältesten des Landes und sagten zur ganzen Versammlung des Volkes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: Da standen … auf
  rationale: Das narrative Qal-Wayyiqtol von קום bezeichnet hier das Aufstehen, um öffentlich das Wort zu ergreifen; „standen auf“ ist natürlich und kontextgerecht.
- source_word: אֲנָשִׁים
  choice: einige Männer
  rationale: אֲנָשִׁים bezeichnet ausdrücklich Männer. „Einige“ gibt im Deutschen idiomatisch wieder, dass eine nicht näher bestimmte Mehrzahl aus der folgenden Gruppe hervortrat.
- source_word: מִזִּקְנֵי הָאָרֶץ
  choice: aus den Ältesten des Landes
  rationale: Die Präposition מִן bezeichnet die Zugehörigkeit beziehungsweise Auswahl aus der Gruppe der Landesältesten. Die etwas markierte Formulierung wahrt diese Struktur, statt אֲנָשִׁים und זִקְנֵי einfach gleichzusetzen.
- source_word: וַיֹּאמְרוּ
  choice: sagten
  rationale: אמר ist das gewöhnliche Verb zur Einführung direkter Rede.
- source_word: אֶל כָּל קְהַל הָעָם
  choice: zur ganzen Versammlung des Volkes
  rationale: קָהָל bezeichnet die öffentlich versammelte Gemeinschaft; כָּל wird idiomatisch mit „ganzen“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der deutsche Doppelpunkt erfüllt natürlich die Funktion des hebräischen Infinitivs zur Einführung der unmittelbar folgenden direkten Rede, ohne das schwerfällige „indem sie sagten“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige hebräische Konstruktion „Männer aus den Ältesten“ bleibt bewusst erkennbar; die Redeeinleitungsformel wird im Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben.
