  source_fidelity: Der Entwurf gibt die Satzfolge und die öffentlichen Redehandlung zutreffend wieder. Die Wortgruppe אֲנָשִׁים מִזִּקְנֵי הָאָרֶץ bezeichnet jedoch idiomatisch einige Männer, die zu den Landesältesten gehörten; im Deutschen ist „Männer aus den Ältesten“ keine natürliche oder klare Wiedergabe dieser Zugehörigkeit.
  naturalness: „Einige Männer aus den Ältesten des Landes“ ist im modernen Standarddeutsch deutlich unidiomatisch und kann eine von den Ältesten getrennte Personengruppe nahelegen. „Einige der Ältesten des Landes“ ist natürlich, präzise und wahrt die nicht näher bestimmte Teilmenge.
  terminology: „Älteste des Landes“, „Versammlung des Volkes“ und der Doppelpunkt als Redeeinleitung sind angemessen. Der Doppelpunkt gibt לֵאמֹר idiomatisch wieder, da die Rede im folgenden Vers fortgesetzt wird.
