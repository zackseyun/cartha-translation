id: JER.26.14
reference: Jeremiah 26:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֖י הִנְ/נִ֣י בְ/יֶדְ/כֶ֑ם עֲשׂוּ לִ֛/י כַּ/טּ֥וֹב וְ/כַ/יָּשָׁ֖ר בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/014.yaml
  text: But as for me[a], here I am in your hand[b]. Do to me what is good and right in your eyes.
translation:
  language: de
  text: Ich aber – hier bin ich in eurer Hand.[a] Tut mit mir, was in euren Augen gut und richtig ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in eurer Gewalt«. Im Hebräischen steht »Hand« in der Einzahl als bildhafte Wendung für die Verfügungsgewalt anderer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »was ihr für gut und richtig haltet«; sinngemäß auch: »wie es euch richtig erscheint«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Ich aber
  rationale: Das selbstständige Pronomen mit der Konjunktion markiert einen Kontrast und lenkt den Blick nach Jeremias Verteidigung auf seine eigene Lage.
- source_word: הִנְנִי
  choice: hier bin ich
  rationale: Die präsentative Wendung bezeichnet Jeremias unmittelbare Verfügbarkeit und wird in natürlichem, heutigem Deutsch ohne das altertümliche »siehe« wiedergegeben.
- source_word: בְיֶדְכֶם
  choice: in eurer Hand
  rationale: Die Einzahl »Hand« bewahrt das hebräische Bild für die Gewalt oder Verfügungsgewalt anderer und ist auch im Deutschen verständlich.
- source_word: עֲשׂוּ לִי
  choice: Tut mit mir
  rationale: Die Wendung gibt die gegen Jeremia beziehungsweise an ihm vorzunehmende Handlung idiomatisch wieder; »Tut mir« wäre im Deutschen unvollständig.
- source_word: כַטּוֹב וְכַיָּשָׁר
  choice: was … gut und richtig ist
  rationale: »Gut und richtig« wahrt die moralisch-rechtliche Weite der beiden Begriffe, ohne יָשָׁר unnötig auf den engeren Sinn »gerecht« festzulegen.
- source_word: בְּעֵינֵיכֶם
  choice: in euren Augen
  rationale: Die Übersetzung erhält das hebräische Bild für das eigene Urteil der Angesprochenen; idiomatisch bedeutet es »nach eurem Ermessen«.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bildet den kontrastierenden Neueinsatz knapp ab. Die hebräischen Bilder »in eurer Hand« und »in euren Augen« bleiben im Haupttext erhalten und werden in den Fußnoten erläutert.
