  text: וַֽ/יִּשְׁמְע֣וּ שָׂרֵ֣י יְהוּדָ֗ה אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יַּעֲל֥וּ מִ/בֵּית הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה וַ/יֵּֽשְׁב֛וּ בְּ/פֶ֥תַח שַֽׁעַר יְהוָ֖ה הֶ/חָדָֽשׁ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
translation:
  language: de
  text: Als die führenden Amtsträger Judas[a] diese Worte hörten, gingen sie vom Haus des Königs[b] hinauf zum Haus Jahwes und setzten sich am Eingang des Neuen Tores Jahwes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Fürsten Judas«; das hebräische Wort kann hochrangige Herrscher oder Amtsträger bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »vom Königspalast«; wörtlich: »vom Haus des Königs«.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist ein Tor des Tempelkomplexes, das als »Neues Tor« bekannt war.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  choice: die führenden Männer Judas
  rationale: שָׂרִים bezeichnet hochrangige politische oder administrative Amtsträger. „Führende Männer“ ist in modernem Deutsch verständlich und lässt offen, ob Fürsten oder andere leitende Beamte gemeint sind.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: diese Worte
  rationale: Im Zusammenhang bezeichnet דְּבָרִים die zuvor gesprochene Botschaft beziehungsweise Anklage; „Worte“ bewahrt diesen sprachlichen Bezug.
- source_word: וַיַּעֲלוּ
  choice: gingen ... hinauf
  rationale: Die Bewegungsrichtung von עלה wird ausdrücklich wiedergegeben und kann sowohl die Topografie als auch den Aufstieg zum Tempelbezirk spiegeln.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: vom Königspalast
  rationale: Wörtlich steht „vom Haus des Königs“. Im Deutschen bezeichnet „Königspalast“ den gemeinten königlichen Amts- und Wohnsitz natürlich und eindeutig; die wörtliche Form wird in einer Fußnote genannt.
- source_word: בֵּית יְהוָה
  choice: zum Haus Jahwes
  rationale: Die formale Bezeichnung „Haus Jahwes“ bewahrt das hebräische Bild, statt sie erklärend mit „Tempel“ aufzulösen.
- source_word: וַיֵּשְׁבוּ
  choice: Dort setzten sie sich
  rationale: ישׁב bedeutet hier „sitzen/sich setzen“. Die Formulierung ist natürliches Deutsch, ohne eine mögliche gerichtliche Funktion ausdrücklich in den Text einzutragen.
- source_word: בְּפֶתַח
  choice: am Eingang
  rationale: פֶּתַח bezeichnet die Öffnung beziehungsweise den Eingangsbereich; „am Eingang“ gibt die räumliche Zuordnung idiomatisch wieder.
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  choice: des Neuen Tores Jahwes
  rationale: Die Wortfolge lautet sinngemäß „Tor Jahwes, das neue“. „Neues Tor“ wird als Bezeichnung eines bestimmten Tores im Tempelkomplex großgeschrieben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Eigenname Gottes wird in seiner im Deutschen gebräuchlichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. „Jahwe“ bewahrt den Charakter als Eigenname; die traditionelle Ersetzung durch „der HERR“ ist möglich, würde den Namen jedoch durch einen Titel wiedergeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz wurde zur besseren Lesbarkeit geteilt. „Führende Männer“ vermeidet die heute leicht erblich-monarchisch verstandene Festlegung durch „Fürsten“; „Haus Jahwes“ und „hinaufgehen“ bewahren zentrale Bilder des Hebräischen.
