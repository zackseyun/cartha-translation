base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
translation:
  language: de
  text: Sie holten Uria aus Ägypten und brachten ihn zu König Jojakim. Er erschlug ihn mit dem Schwert und warf seinen Leichnam in die Gräber des einfachen Volkes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Gräber des Volkes“. Die hebräische Wendung kann wörtlicher Gräber gewöhnlicher Menschen bezeichnen, im Gegensatz zu einer ehrenvollen Bestattung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: sie holten … aus
  rationale: 'Der Hifil von יצא hat kausative Bedeutung: jemanden herausbringen bzw. herausholen. „Aus Ägypten holen“ ist im Deutschen natürlich und bewahrt diese Bedeutung.'
- source_word: וַיְבִאֻהוּ
  choice: brachten ihn
  rationale: Der Hifil von בוא mit Objektsuffix bedeutet direkt „ihn bringen“.
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: König Jojakim
  rationale: Die im Deutschen übliche Verbindung von Herrschertitel und Name gibt die hebräische Apposition natürlich wieder.
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  choice: erschlug ihn mit dem Schwert
  rationale: נכה bezeichnet das Schlagen; die instrumentale Ergänzung „mit dem Schwert“ zeigt hier die tödliche Folge. „Erschlug“ bewahrt sowohl Handlung als auch Ergebnis.
- source_word: נִבְלָתוֹ
  choice: seinen Leichnam
  rationale: נְבֵלָה bezeichnet einen toten Körper. „Leichnam“ ist eine natürliche, würdevolle deutsche Entsprechung, ohne den entehrenden Zusammenhang abzuschwächen.
- source_word: קִבְרֵי בְּנֵי הָעָם
  choice: die Gräber des einfachen Volkes
  rationale: קִבְרֵי bezeichnet Gräber oder Begräbnisstätten; בְּנֵי הָעָם meint hier wahrscheinlich die gewöhnliche Bevölkerung im Gegensatz zu einer ehrenvollen oder königlichen Bestattung.
theological_decisions:
- issue: Wechsel vom pluralischen zum singularischen Handlungsträger
  choice: Für Gefangennahme und Transport stehen pluralische Handelnde („sie“), für Tötung und Beseitigung des Leichnams der singularische König („er“).
  alternative: Die Singularformen kollektiv auf dieselben pluralischen Beauftragten beziehen.
  rationale: Der hebräische Text wechselt ausdrücklich von וַיּוֹצִיאוּ/וַיְבִאֻהוּ im Plural zu וַיַּכֵּהוּ/וַיַּשְׁלֵךְ im Singular. Der nächststehende singularische Bezug ist König Jojakim; der deutsche Text bewahrt diesen Wechsel, ohne ihn durch eine Umschreibung zu glätten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen Hauptsätze bewahren die Härte und Direktheit des hebräischen Berichts; „einfaches Volk“ markiert den sozialen Gegensatz, ohne umgangssprachlich zu wirken.
