  text: הֶ/הָמֵ֣ת הֱ֠מִתֻ/הוּ חִזְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כָל יְהוּדָ֗ה הֲ/לֹא֮ יָרֵ֣א אֶת יְהוָה֒ וַ/יְחַל֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יִּנָּ֣חֶם יְהוָ֔ה אֶל הָ/רָעָ֖ה אֲשֶׁר דִּבֶּ֣ר עֲלֵי/הֶ֑ם וַ/אֲנַ֗חְנוּ עֹשִׂ֛ים רָעָ֥ה גְדוֹלָ֖ה עַל נַפְשׁוֹתֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
translation:
  language: de
  text: Hat ihn etwa Hiskia, der König von Juda, zusammen mit ganz Juda getötet? Fürchtete er nicht Jahwe und suchte Jahwes Gunst[a]? Und Jahwe ließ von dem Unheil ab[b], das er ihnen angedroht hatte. Wir aber tun großes Böses gegen uns selbst.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „besänftigte oder erflehte das Angesicht Jahwes“; eine hebräische Redewendung dafür, seine Gunst zu suchen oder ihn anzuflehen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jahwe änderte seine Absicht hinsichtlich des Unheils.“'
    reason: alternative_reading
  - marker: c
    text: Dasselbe hebräische Wort bezeichnet zuvor das angekündigte „Unheil“, hier jedoch das moralisch „Böse“.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  choice: Hat ihn etwa … getötet?
  rationale: Die Verbindung von Infinitivus absolutus und finiter Hifilform verstärkt den Verbalgedanken. Im Deutschen gibt „etwa“ den nachdrücklichen rhetorischen Fragesinn natürlich wieder, ohne ein unnötig enges juristisches „hinrichten“ einzutragen.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה וְכָל יְהוּדָה
  choice: Hiskia, der König von Juda, zusammen mit ganz Juda
  rationale: „Hiskia“ folgt der etablierten deutschen Namensform. „Ganz Juda“ bewahrt den kollektiven Ausdruck; „zusammen mit“ macht die gemeinsame Subjektfunktion im Deutschen klar.
- source_word: הֲלֹא יָרֵא אֶת־יְהוָה
  choice: Fürchtete er nicht Jahwe
  rationale: „Jahwe fürchten“ bewahrt den biblisch-theologischen Sinn ehrfürchtiger Gottesfurcht und gibt den Gottesnamen als Eigennamen wieder.
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: und suchte Jahwes Gunst
  rationale: Die Wendung bedeutet wörtlich, Jahwes Angesicht zu besänftigen beziehungsweise anzuflehen. „Jahwes Gunst suchen“ vermittelt den relationalen Sinn in natürlichem modernem Deutsch.
- source_word: וַיִּנָּחֶם יְהוָה
  choice: Da ließ sich Jahwe … gereuen
  rationale: Die Formulierung bewahrt die starke, anthropopathische Aussage, dass Jahwe auf Gottesfurcht und Flehen reagierte, ohne die theologische Spannung durch eine Erklärung über Gottes Wesen aufzulösen.
- source_word: אֶל־הָרָעָה אֲשֶׁר דִּבֶּר עֲלֵיהֶם
  choice: das Unheil, das er ihnen angedroht hatte
  rationale: רָעָה bezeichnet hier angekündigtes Gericht beziehungsweise Unheil. „Angedroht“ gibt דִּבֶּר עֲלֵיהֶם im prophetischen Gerichtskontext idiomatisch wieder.
- source_word: וַאֲנַחְנוּ עֹשִׂים רָעָה גְדוֹלָה עַל־נַפְשׁוֹתֵינוּ
  choice: Wir aber tun großes Böses gegen uns selbst
  rationale: Hier bezeichnet רָעָה moralisch Böses, während נֶפֶשׁ in der Mehrzahl die eigene Person beziehungsweise das eigene Leben meint. Die bewusst enge Formulierung erhält den Gedanken selbstschädigenden Handelns.
theological_decisions:
- issue: Anthropopathische Sprache für Jahwes Reaktion
  choice: Da ließ sich Jahwe das Unheil gereuen
  alternative: Da änderte Jahwe seine Absicht hinsichtlich des Unheils / Da ließ Jahwe von dem Unheil ab
  rationale: 'Die gewählte Fassung lässt die Aussage des hebräischen נָחַם in ihrer Spannung stehen: Jahwe reagiert auf Gottesfurcht und Flehen und vollzieht das angekündigte Unheil nicht. Sie legt weder eine dogmatische Erklärung göttlicher Unveränderlichkeit noch einen Irrtum Gottes in den Text hinein.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorischen Fragen bleiben deutlich; „etwa“ trägt die erwartete verneinende Antwort mit. „Ließ sich … gereuen“ ist bewusst etwas gehobener, aber weiterhin verständlich und bewahrt die theologische Spannung des hebräischen Verbs. Der Gottesname wird als „Jahwe“ wiedergegeben.
