revisions:
- from: Hat ihn etwa Hiskia, der König von Juda, zusammen mit ganz Juda getötet? Fürchtete er nicht Jahwe und suchte Jahwes Gunst[a]? Da ließ sich Jahwe das Unheil gereuen[b], das er ihnen angedroht hatte. Wir aber tun großes Böses gegen uns selbst.[c]
  to: Hat ihn etwa Hiskia, der König von Juda, zusammen mit ganz Juda getötet? Fürchtete er nicht Jahwe und suchte Jahwes Gunst[a]? Und Jahwe ließ von dem Unheil ab[b], das er ihnen angedroht hatte. Wir aber tun großes Böses gegen uns selbst.[c]
  rationale: Die Revision ersetzt allein die missverständliche, archaische Wiedergabe von נחם durch „ließ von dem Unheil ab“. Diese Fassung ist modernes Standarddeutsch und gibt im Kontext präzise wieder, dass Jahwe das zuvor gegen sie angekündigte Unheil nicht vollzog. Die Fußnote bietet weiterhin eine mögliche alternative Umschreibung, ohne die anthropopathische Spannung des Textes dogmatisch aufzulösen.
