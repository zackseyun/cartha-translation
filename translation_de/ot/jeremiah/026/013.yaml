base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
translation:
  language: de
  text: 'Und nun: Bessert eure Wege und eure Taten[a] und hört auf die Stimme Jahwes, eures Gottes[b]. Jahwe wird von dem Unheil absehen[c], das er gegen euch angekündigt hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Macht eure Wege und eure Taten gut.«'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung »auf die Stimme hören« schließt hier ein, ihr zu gehorchen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Jahwe wird sich hinsichtlich des Unheils umstimmen lassen«; die Wendung bezeichnet hier das Absehen von angekündigtem Unheil. Auch möglich: »Jahwe wird das Unheil bereuen.«'
    reason: theological_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: Darum nun
  rationale: Kennzeichnet den folgernden, dringlichen Übergang zur Aufforderung; es bewahrt sowohl die Verknüpfung als auch das temporale Element.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: Macht eure Wege und eure Taten gut
  rationale: Gibt den kausativen Imperativ von יטב transparent wieder und bewahrt das verständliche ethische Bild der »Wege« sowie die konkrete Ergänzung »Taten«.
- source_word: וְשִׁמְעוּ בְּקוֹל
  choice: hört auf die Stimme
  rationale: Bewahrt die hebräische Wendung und lässt zugleich ihren in diesem Zusammenhang naheliegenden Gehorsamsaspekt erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den göttlichen Eigennamen als solchen wieder.
- source_word: וְיִנָּחֵם
  choice: wird … bereuen
  rationale: Das deutsche »bereuen« kann hier das Absehen von einem angekündigten Handeln ausdrücken und wahrt die Spannung der Aussage; eine Fußnote grenzt die Bedeutung gegen moralische Reue ein.
- source_word: אֶל הָרָעָה
  choice: das Unheil
  rationale: רָעָה bezeichnet im Gerichtszusammenhang drohendes Unglück beziehungsweise Unheil, nicht moralisch Böses.
- source_word: דִּבֶּר עֲלֵיכֶם
  choice: das er euch angedroht hat
  rationale: Gibt die gegen die Angeredeten gerichtete Gerichtsankündigung in natürlichem Deutsch wieder; wörtlicher steht »über/gegen euch geredet hat«.
theological_decisions:
- issue: Göttliches Bereuen beziehungsweise Absehen vom angekündigten Gericht
  choice: Dann wird Jahwe das Unheil bereuen
  alternative: Dann wird Jahwe von dem Unheil absehen / hinsichtlich des Unheils umkehren
  rationale: Die Formulierung bewahrt die biblische Spannung, dass Gott Gericht ankündigt und infolge der geforderten Umkehr davon absehen kann, ohne stillschweigend eine bestimmte Lehre über Unveränderlichkeit oder eine moralische Verfehlung Gottes einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ethische Bildsprache »Wege« und die Wendung »auf die Stimme hören« bleiben erhalten. Die Satzfolge macht den im Kontext liegenden Zusammenhang zwischen Umkehr und dem Absehen vom Gericht lesbar, ohne eine ausdrückliche Konditionalpartikel in den hebräischen Text einzutragen.
