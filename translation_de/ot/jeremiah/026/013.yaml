- from: 'Darum nun: Macht eure Wege und eure Taten gut[a] und hört auf die Stimme Jahwes, eures Gottes[b]. Dann wird Jahwe das Unheil bereuen[c], das er euch angedroht hat.'
  to: 'Und nun: Bessert eure Wege und eure Taten[a] und hört auf die Stimme Jahwes, eures Gottes[b]. Jahwe wird von dem Unheil absehen[c], das er gegen euch angekündigt hat.'
  rationale: Die Revision entfernt den zusätzlich eingeführten Folgemarker, formuliert den Imperativ idiomatischer und gibt נחם im deutschen Haupttext kontextgerecht als Absehen vom angekündigten Unheil wieder. Die Fußnote wahrt die hebräische Ausdrucksweise und ihre Auslegungsweite, ohne moralische Reue Gottes zu behaupten.
