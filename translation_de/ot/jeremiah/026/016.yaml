  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
translation:
  language: de
  text: 'Da sagten die führenden Männer und das ganze Volk zu den Priestern und den Propheten: »Dieser Mann hat kein Todesurteil verdient, denn er hat im Namen Jahwes, unseres Gottes, zu uns gesprochen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: Bezeichnet die maßgeblichen politischen und richterlichen Amtsträger; die Wiedergabe ist im Deutschen verständlich und wahrt hier den Personenbezug.
- source_word: וְכָל הָעָם
  choice: und das ganze Volk
  rationale: Gibt die umfassende Beteiligung der versammelten Bevölkerung unmittelbar wieder.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: die Priester und die Propheten
  rationale: Die üblichen und sachlich genauen Bezeichnungen für die direkt Angesprochenen.
- source_word: אֵין לָאִישׁ הַזֶּה מִשְׁפַּט מָוֶת
  choice: Dieser Mann hat kein Todesurteil verdient
  rationale: Die hebräische Wendung ist juristisch und besagt, dass gegen ihn kein Todesurteil gerechtfertigt ist. Die deutsche Formulierung verbindet diesen Rechtsgehalt mit natürlicher Sprache.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  choice: im Namen Jahwes, unseres Gottes
  rationale: Bewahrt den ausdrücklich genannten Gottesnamen und bringt zugleich zum Ausdruck, dass Jeremia mit göttlicher Bevollmächtigung sprach.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: zu uns gesprochen
  rationale: Das Perfekt bezeichnet die abgeschlossene, für das gegenwärtige Urteil maßgebliche Rede; das deutsche Perfekt gibt dies natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Rechtscharakter von מִשְׁפַּט מָוֶת
  choice: kein Todesurteil verdient
  alternative: für diesen Mann gibt es kein Todesurteil
  rationale: Die Formulierung hält fest, dass im gerichtlichen Verfahren keine Grundlage für ein Todesurteil besteht, ohne die Aussage auf eine bloß moralische Bewertung zu reduzieren.
translation_notes:
  register: Moderne, würdige Standardsprache. »Da sagten« führt die Reaktion in der Erzählfolge natürlich fort. Die Rede bleibt formal genug für die gerichtliche Szene, ist aber für heutige Leser unmittelbar verständlich.
