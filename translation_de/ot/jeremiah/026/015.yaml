source:
  edition: WLC
  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
translation:
  language: de
  text: 'Doch ihr sollt ganz sicher wissen: Wenn ihr mich zu Tode bringt[a], bringt ihr unschuldiges Blut über euch, über diese Stadt und über ihre Bewohner. Denn wahrhaftig, Jahwe hat mich zu euch gesandt, um euch alle diese Worte zu Gehör zu bringen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wenn ihr mich tötet.“ Das hebräische Verb ist kausativ und bedeutet „zu Tode bringen“; der Zusammenhang ist ein gerichtlicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um alle diese Worte in eure Ohren zu reden“, das heißt: so zu reden, dass ihr sie hört.'
    reason: idiom
lexical_decisions:
- source_word: אַךְ יָדֹעַ תֵּדְעוּ
  choice: Doch ihr sollt ganz sicher wissen
  rationale: אַךְ leitet hier eine nachdrückliche Warnung ein; die Verbindung von Infinitivus absolutus und finitem Verb verstärkt das Wissen. Die Wiedergabe bewahrt Nachdruck und natürlichen deutschen Satzbau.
- source_word: מְמִתִים אַתֶּם אֹתִי
  choice: wenn ihr mich hinrichten lasst
  rationale: Die Kausativform von מות bezeichnet das Zu-Tode-Bringen. Im gerichtlichen Zusammenhang trifft „hinrichten lassen“ die beabsichtigte Tötung und lässt zugleich offen, ob die Angesprochenen sie eigenhändig vollziehen.
- source_word: דָם נָקִי
  choice: unschuldiges Blut
  rationale: Die feste hebräische Wendung bezeichnet Blut, das durch schuldhafte Tötung eines Unschuldigen vergossen wird.
- source_word: נֹתְנִים עֲלֵיכֶם
  choice: ladet ihr ... auf euch
  rationale: Die deutsche Wendung „auf sich laden“ bewahrt das Bild des hebräischen „auf euch legen/geben“ und vermittelt die entstehende Blutschuld.
- source_word: וְאֶל הָעִיר הַזֹּאת וְאֶל יֹשְׁבֶיהָ
  choice: auf diese Stadt und auf ihre Bewohner
  rationale: Die parallele Präpositionalfügung erweitert die Folgen der Blutschuld auf Stadt und Bevölkerung.
- source_word: בֶאֱמֶת
  choice: wahrhaftig
  rationale: Das Wort betont feierlich die Wahrheit und Gewissheit von Jeremias Sendung.
- source_word: שְׁלָחַנִי יְהוָה עֲלֵיכֶם
  choice: Jahwe hat mich zu euch gesandt
  rationale: Das Perfekt bezeichnet die erfolgte Sendung mit gegenwärtiger Geltung; עַל bezeichnet hier im Zusammenhang der prophetischen Beauftragung die Ausrichtung auf die Adressaten.
- source_word: לְדַבֵּר בְּאָזְנֵיכֶם אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: damit ich euch alle diese Worte verkünde
  rationale: Die Zweckkonstruktion wird idiomatisch wiedergegeben. „In eure Ohren reden“ bedeutet, etwas unmittelbar hörbar mitzuteilen; „verkünden“ passt zum prophetischen Kontext.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Folge der Tötung Jeremias
  choice: ladet ihr unschuldiges Blut auf euch, auf diese Stadt und auf ihre Bewohner
  alternative: bringt ihr Blutschuld über euch, diese Stadt und ihre Bewohner
  rationale: Die gewählte Fassung bewahrt das konkrete Bild „unschuldiges Blut“, ohne die Aussage ausschließlich als abstrakten Rechtsbegriff aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers behält den feierlichen Warncharakter und das konkrete Bild der Blutschuld bei. „Jahwe“ steht für das Tetragramm; „hinrichten lasst“ entspricht dem gerichtlichen Kontext.
