  to: 'Doch ihr sollt ganz sicher wissen: Wenn ihr mich zu Tode bringt[a], bringt ihr unschuldiges Blut über euch, über diese Stadt und über ihre Bewohner. Denn wahrhaftig, Jahwe hat mich zu euch gesandt, um euch alle diese Worte zu Gehör zu bringen[b].'
