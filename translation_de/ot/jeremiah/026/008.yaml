  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִרְמְיָ֗הוּ לְ/דַבֵּר֙ אֵ֣ת כָּל אֲשֶׁר צִוָּ֣ה יְהוָ֔ה לְ/דַבֵּ֖ר אֶל כָּל הָ/עָ֑ם וַ/יִּתְפְּשׂ֨וּ אֹת֜/וֹ הַ/כֹּהֲנִ֧ים וְ/הַ/נְּבִאִ֛ים וְ/כָל הָ/עָ֥ם לֵ/אמֹ֖ר מ֥וֹת תָּמֽוּת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
translation:
  language: de
  text: 'Und als Jirmejahu alles zu Ende gesagt hatte, was Jahwe ihm geboten hatte, dem ganzen Volk zu sagen, da packten ihn die Priester, die Propheten und das ganze Volk und sagten: »Du musst sterben![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Du wirst ganz gewiss sterben!« Das Hebräische verbindet den Infinitiv mit einer finiten Form desselben Verbs und verstärkt dadurch die Aussage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Und als … zu Ende gesagt hatte
  rationale: Die zeitliche Konstruktion mit כְּ und dem Infinitiv von כלה bezeichnet den Abschluss des Redens; die deutsche Satzfügung mit „als“ gibt den Erzählfluss natürlich wieder.
- source_word: יִרְמְיָהוּ
  choice: Jirmejahu
  rationale: Der hebräische Personenname wird nach deutscher Laut- und Umschriftkonvention wiedergegeben.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht, dass Jahwes Auftrag dem abgeschlossenen Reden vorausging; „gebieten“ bewahrt den verpflichtenden Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des ausdrücklich stehenden Gottesnamens bewahrt ihn als Eigennamen.
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  choice: da packten ihn
  rationale: „Packen“ gibt das gewaltsame Ergreifen wieder, ohne einen förmlichen Arrest vorauszusetzen; „da“ markiert den Hauptsatz nach dem vorangestellten Zeitsatz.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  choice: die Priester, die Propheten und das ganze Volk
  rationale: Die drei ausdrücklich genannten Gruppen bleiben vollständig erhalten; eine natürliche deutsche Aufzählung ersetzt die wiederholten Konjunktionen.
- source_word: מוֹת תָּמוּת
  choice: Du musst sterben!
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Todesankündigung beziehungsweise Todesforderung. „Du musst sterben“ ist knapp, nachdrücklich und im modernen Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von מוֹת תָּמוּת
  choice: Du musst sterben!
  alternative: Du wirst ganz gewiss sterben!
  rationale: Im Kontext des Ergreifens Jeremias kann die emphatische Form als Todesforderung oder als sichere Todesankündigung verstanden werden. Der Haupttext bewahrt den fordernden Ton; die Fußnote nennt die ebenfalls mögliche Gewissheitsnuance.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am hebräischen Ablauf, ohne altertümliche Wendungen wie „es geschah“ oder „fürwahr“ zu verwenden.
