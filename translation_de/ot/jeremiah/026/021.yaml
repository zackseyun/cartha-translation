  text: וַ/יִּשְׁמַ֣ע הַ/מֶּֽלֶךְ יְ֠הוֹיָקִים וְ/כָל גִּבּוֹרָ֤י/ו וְ/כָל הַ/שָּׂרִים֙ אֶת דְּבָרָ֔י/ו וַ/יְבַקֵּ֥שׁ הַ/מֶּ֖לֶךְ הֲמִית֑/וֹ וַ/יִּשְׁמַ֤ע אוּרִיָּ֨הוּ֙ וַ/יִּרָ֔א וַ/יִּבְרַ֖ח וַ/יָּבֹ֥א מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
translation:
  language: de
  text: Als König Jojakim, alle seine Krieger[a] und alle hohen Beamten seine Worte hörten, suchte der König ihn zu töten. Als Urija davon hörte, fürchtete er sich, floh und kam nach Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine mächtigen Männer.'
    reason: Die Bezeichnung kann allgemein besonders starke oder angesehene Männer meinen, bezeichnet im königlichen Zusammenhang aber häufig Krieger.
lexical_decisions:
- source_word: גִּבּוֹרָיו
  choice: seine Krieger
  rationale: גִּבּוֹר bezeichnet hier wahrscheinlich kampferprobte Männer beziehungsweise militärische Gefolgsleute des Königs. „Krieger“ gibt diesen Sinn im heutigen Deutsch klar wieder.
- source_word: הַשָּׂרִים
  choice: die hohen Beamten
  rationale: שָׂרִים bezeichnet im königlichen Umfeld führende Amts- und Würdenträger. „Hohe Beamte“ vermeidet die irreführende Verengung auf erbliche Prinzen.
- source_word: דְּבָרָיו
  choice: seine Worte
  rationale: Die wörtliche Wiedergabe bewahrt den Bezug auf Urijas prophetische Rede, ohne sie deutend als bloße Nachricht oder Botschaft einzuengen.
- source_word: וַיְבַקֵּשׁ הַמֶּלֶךְ הֲמִיתוֹ
  choice: versuchte der König, ihn töten zu lassen
  rationale: בקשׁ mit Infinitiv bezeichnet hier das Bestreben beziehungsweise den Versuch; der kausative Infinitiv von מות wird mit „töten zu lassen“ wiedergegeben.
- source_word: וַיִּשְׁמַע אוּרִיָּהוּ
  choice: Als Urija davon hörte
  rationale: Beim zweiten שׁמע bleibt das Gehörte im Hebräischen unausgesprochen. „Davon“ verweist natürlich auf die unmittelbar zuvor genannte Tötungsabsicht, ohne weitere Einzelheiten hinzuzufügen.
- source_word: וַיִּרָא
  choice: fürchtete er sich
  rationale: Die Wendung gibt Urijas unmittelbare Furcht in natürlichem, würdigem Deutsch wieder.
- source_word: וַיָּבֹא מִצְרָיִם
  choice: kam nach Ägypten
  rationale: „Kam nach Ägypten“ entspricht sowohl dem Bewegungsverb בוא als auch idiomatischem Deutsch mit einem Zielort.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Namensformen „Jojakim“ und „Urija“ folgen dem üblichen deutschen Bibelgebrauch. Die Satzverknüpfung bleibt nah an der hebräischen Erzählfolge, ohne die häufigen Waw-Anschlüsse mechanisch mit „und“ wiederzugeben.
