    issue: „ihn töten zu lassen“ bei וַיְבַקֵּשׁ ... הֲמִיתוֹ
    rationale: Das deutsche „töten lassen“ bedeutet gewöhnlich, die Tötung durch eine andere Person zu veranlassen. Das hebräische Hifil von מות bedeutet hier dagegen „ihn töten“; das Subjekt der Tötungsabsicht bleibt der König.
  revised_text: Als König Jojakim, alle seine Krieger[a] und alle hohen Beamten seine Worte hörten, suchte der König ihn zu töten. Als Urija davon hörte, fürchtete er sich, floh und kam nach Ägypten.
