  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Personen, die Hofgruppen, die tödliche Absicht, Urijas Furcht, Flucht und sein Eintreffen in Ägypten insgesamt zuverlässig. Allerdings gibt „ihn töten zu lassen“ dem hebräischen Hifil הֲמִיתוֹ eine nicht vorhandene kausative Nuance im Deutschen: Der König beabsichtigt, Urija selbst zu töten, nicht ausdrücklich, ihn durch andere töten zu lassen.'
  naturalness: Modernes Standarddeutsch und der Erzählton sind überwiegend gelungen. „Als König Jojakim, alle seine Krieger und alle hohen Beamten ... hörten“ ist grammatisch korrekt. „suchte der König ihn zu töten“ ist zugleich idiomatisch und enger am Aspekt von בקשׁ + Infinitiv als „versuchte ...“.
  terminology: „Jojakim“, „Urija“, „Krieger“ und „hohe Beamte“ sind passende moderne Wiedergaben. Die Fußnote zu „Krieger“ dokumentiert eine mögliche weitere Bedeutung von גִּבּוֹרָיו sachlich und ohne Überdeutung.
  issues:
