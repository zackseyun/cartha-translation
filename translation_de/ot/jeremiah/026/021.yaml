  rationale: Die Revision beschränkt sich auf die Beseitigung der im Deutschen zusätzlich eingeführten Veranlassungsnuance. „Suchte ... zu töten“ bewahrt die Absicht bzw. das Bemühen von בקשׁ + Infinitiv, ohne bereits einen vollzogenen oder von Dritten ausgeführten Tötungsakt anzudeuten.
