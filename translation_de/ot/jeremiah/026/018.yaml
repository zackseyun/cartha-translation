source:
  edition: WLC
  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
translation:
  language: de
  text: 'Micha aus Moreschet war in den Tagen Hiskias, des Königs von Juda, als Prophet tätig und sagte zum ganzen Volk von Juda: »So spricht Jahwe der Heere[a]: Zion wird zu einem Feld umgepflügt werden, Jerusalem wird zu Trümmerhaufen werden, und der Berg des Hauses[b] wird zu bewaldeten Höhen[c] werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: »der HERR der Heerscharen«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempelberg.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »zu den Höhen eines Waldes« oder »zu überwucherten Anhöhen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיכיה הַמּוֹרַשְׁתִּי
  choice: Micha aus Moreschet
  rationale: Der geläufige deutsche Name »Micha« und die Herkunftsangabe »aus Moreschet« geben den Namen und das Gentiliz verständlich und präzise wieder.
- source_word: הָיָה נִבָּא
  choice: wirkte … als Prophet
  rationale: Die Verbindung von היה mit dem Partizip bezeichnet eine andauernde Tätigkeit in der Vergangenheit. »Wirkte … als Prophet« bewahrt diesen durativen Sinn in natürlichem Deutsch.
- source_word: בִּימֵי חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: in den Tagen Hiskias, des Königs von Juda
  rationale: Die zeitliche Wendung wird formnah wiedergegeben; die Apposition macht Hiskias Stellung eindeutig.
- source_word: וַיֹּאמֶר אֶל כָּל עַם יְהוּדָה לֵאמֹר
  choice: Er sagte zum ganzen Volk von Juda
  rationale: Die deutsche Redeeinleitung gibt den Inhalt vollständig wieder, ohne das im Deutschen schwerfällige »und sagte … indem er sagte« nachzubilden.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: So spricht Jahwe der Heere
  rationale: »Jahwe« gibt den Gottesnamen direkt wieder; »Heere« vermittelt den konkreten pluralischen und militärischen Sinn von צְבָאוֹת in heutigem Deutsch.
- source_word: צִיּוֹן שָׂדֶה תֵחָרֵשׁ
  choice: Zion wird wie ein Feld gepflügt werden
  rationale: Die Formulierung bewahrt das drastische Bild, dass Zion wie Ackerland behandelt wird, und klingt zugleich natürlich.
- source_word: עִיִּים
  choice: Trümmerhaufen
  rationale: Das Wort bezeichnet Ruinen beziehungsweise Schutthaufen. »Trümmerhaufen« bildet den konkreten Plural deutlicher ab als das abstraktere »Ruinen«.
- source_word: וְהַר הַבַּיִת
  choice: und der Berg des Hauses
  rationale: Die formnahe Wiedergabe bewahrt den hebräischen Ausdruck; eine Fußnote erläutert, dass das Tempelareal gemeint ist.
- source_word: לְבָמוֹת יָעַר
  choice: zu bewaldeten Höhen
  rationale: Die Wiedergabe erhält sowohl den Plural »Höhen« als auch den Bezug auf Wald beziehungsweise Gehölz, ohne die Bildsprache vorschnell zu erklären.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« gibt den persönlichen Gottesnamen wieder; die traditionelle Wiedergabe wird in der Fußnote zusammen mit dem Titel genannt.
- issue: Wiedergabe von צְבָאוֹת im Gottestitel
  choice: der Heere
  alternative: der Heerscharen
  rationale: »Heere« ist für heutige Leser transparent und bewahrt den konkreten pluralischen Sinn. »Heerscharen« ist die traditionelle, aber weniger alltägliche Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt in seiner Gerichtsbildsprache konkret; die ungewöhnliche Mehrzahl »bewaldete Höhen« wird nicht geglättet, sondern durch eine Fußnote erläutert. Die durative Vergangenheitsform wird idiomatisch mit »wirkte … als Prophet« ausgedrückt.
