base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
translation:
  language: de
  text: Vielleicht hören sie darauf[a], und jeder wird von seinem bösen Weg umkehren[b]. Dann werde ich von dem Unheil ablassen[c], das ich ihnen wegen der Bosheit ihrer Taten zuzufügen beabsichtige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: hören; das hebräische Verb kann sowohl das Hören als auch das Beachten und Befolgen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: kehren zurück; hier ist die Abkehr vom bösen Lebenswandel gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: Dann werde ich meinen Entschluss über das Unheil ändern. Das hebräische Verb beschreibt hier, dass Gott das angekündigte Gericht als Antwort auf ihre Umkehr nicht vollzieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Gibt die im hebräischen Text ausgedrückte Möglichkeit beziehungsweise Hoffnung knapp und natürlich wieder.
- source_word: יִשְׁמְעוּ
  choice: hören sie darauf
  rationale: שׁמע kann sowohl das Hören als auch das Beachten und Befolgen bezeichnen. „Darauf hören“ ist im prophetischen Zusammenhang natürlich und lässt beide Aspekte anklingen.
- source_word: וְיָשֻׁבוּ
  choice: kehren um
  rationale: Bewahrt das Bewegungsbild von שׁוב und bringt hier zugleich dessen moralische Bedeutung zum Ausdruck.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: jeder von seinem bösen Weg
  rationale: אִישׁ ist distributiv gebraucht; „jeder“ gibt dies in modernem Deutsch natürlicher wieder als „jeder Mann“. „Weg“ bewahrt die hebräische Metapher für den Lebenswandel.
- source_word: וְנִחַמְתִּי אֶל הָרָעָה
  choice: Dann werde ich von dem Unheil ablassen
  rationale: נחם bezeichnet bei angekündigtem Gericht Gottes Absehen beziehungsweise Ablassen davon. „Unheil“ unterscheidet die angedrohte Katastrophe von moralischem Bösen.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: das ich ihnen ... zuzufügen beabsichtige
  rationale: חשב mit Infinitiv bezeichnet hier Absicht oder Planung; „Unheil zufügen“ ist eine natürliche deutsche Wiedergabe der hebräischen Fügung.
- source_word: מִפְּנֵי רֹעַ מַעַלְלֵיהֶם
  choice: wegen der Bosheit ihrer Taten
  rationale: מִפְּנֵי ist kausal, רֹעַ bezeichnet die moralische Bosheit und מַעֲלָלִים die vollbrachten Taten beziehungsweise Handlungen.
theological_decisions:
- issue: Wiedergabe des auf Gott bezogenen נִחַם
  choice: von dem Unheil ablassen
  alternative: meinen Entschluss über das Unheil ändern / das Unheil bereuen
  rationale: 'Die Formulierung bewahrt die reale Bedingtheit der Gerichtsankündigung: Wenn die Menschen umkehren, vollzieht Gott das angekündigte Unheil nicht. Sie vermeidet zugleich die sachfremde Vorstellung moralischer Reue Gottes. Die Fußnote hält die stärkere anthropopathische Ausdrucksweise und die Spannung des Hebräischen sichtbar.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am hebräischen Bedingungszusammenhang, während „jeder“ die distributive Bedeutung idiomatisch wiedergibt. Die wiederholte Wurzel für „böse/Bosheit“ beziehungsweise „Unheil“ wird entsprechend ihrem moralischen und ihrem katastrophischen Sinn differenziert übersetzt.
