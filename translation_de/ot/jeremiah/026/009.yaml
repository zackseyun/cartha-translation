base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: de
  text: '„Warum hast du im Namen des HERRN geweissagt: ‚Dieses Haus wird wie Schilo werden, und diese Stadt wird verwüstet werden, sodass niemand darin wohnt‘?“ Da versammelte sich das ganze Volk gegen Jeremia im Haus des HERRN.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִבֵּיתָ
  choice: hast du … geweissagt
  rationale: Die formale und im biblischen Register geläufige Wiedergabe bewahrt den Vorwurf prophetischen Redens.
- source_word: כְשִׁלוֹ יִהְיֶה
  choice: wird wie Schilo werden
  rationale: Gibt den Vergleich und das Verb היה direkt wieder, ohne den geschichtlichen Bezug erklärend auszudeuten.
- source_word: תֶּחֱרַב
  choice: wird verwüstet werden
  rationale: Das Verb bezeichnet das Veröden beziehungsweise Verwüstetwerden; das Passiv wahrt die fehlende Nennung eines Handelnden.
- source_word: מֵאֵין יוֹשֵׁב
  choice: sodass niemand mehr darin wohnt
  rationale: Natürliche deutsche Wiedergabe des Ergebnisses völliger Verödung; יוֹשֵׁב ist hier substantivisch beziehungsweise verbal als Bewohner zu verstehen.
- source_word: וַיִּקָּהֵל … אֶל
  choice: Da versammelte sich … gegen
  rationale: אֶל kann räumlich „zu/um“ bedeuten; im feindseligen Kontext trägt „gegen“ die kontextuelle Stoßrichtung, ohne einen Angriff ausdrücklich hinzuzufügen.
- source_word: בְּשֵׁם יְהוָה / בְּבֵית יְהוָה
  choice: im Namen des HERRN / im Haus des HERRN
  rationale: Die traditionelle deutsche Wiedergabe des Tetragramms mit HERRN ist verständlich und würdevoll; die Wiederholung des Gottesnamens bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH oder Jahwe
  rationale: Die im deutschsprachigen Bibelgebrauch verbreitete Ersatzlesung wird verwendet, ohne eine bestimmte Aussprache des Tetragramms festzulegen.
- issue: Ausrichtung der Volksmenge gegenüber Jeremia
  choice: gegen Jeremia
  alternative: um Jeremia / bei Jeremia
  rationale: Der unmittelbare Kontext ist anklagend und bedrohlich. „Gegen“ macht die feindselige Ausrichtung sichtbar, lässt aber offen, welche konkrete Handlung folgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch vertrauten Begriffen wie „weissagen“. Die direkte Rede bleibt prägnant; die unpersönliche Verwüstungsaussage und die bedrohliche Spannung des Schlusses werden bewahrt.
