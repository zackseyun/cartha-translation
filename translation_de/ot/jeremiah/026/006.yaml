  source_fidelity: Die Zukunftsform von וְנָתַתִּי in diesem bedingten Gerichtszusammenhang sollte im Deutschen ausdrücklich wiedergegeben werden. „Schilo gleichmachen“ trifft die Vergleichskonstruktion idiomatisch und präzise.
  naturalness: „Dann mache ich“ klingt im modernen Standarddeutsch ohne besonderen erzählerischen Präsenskontext unnötig gegenwärtig. „Dann werde ich … gleichmachen“ ist natürlich, würdig und klar. Die Parallelität der beiden göttlichen Ankündigungen bleibt erhalten.
  terminology: „Haus“, „Schilo“, „Stadt“, „Fluch“ und „Völker der Erde“ sind angemessen. Die Fußnoten bewahren sowohl die historische Anspielung als auch die semantische Möglichkeit eines Fluchgegenstands, ohne sie im Haupttext festzulegen.
