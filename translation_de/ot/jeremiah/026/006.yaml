base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/006.yaml
  text: then I will make this house like Shiloh[b][a], and I will make this city a curse to all the nations of the earth.
translation:
  language: de
  text: Dann werde ich dieses Haus Schilo gleichmachen[a], und diese Stadt werde ich für alle Völker der Erde zum Fluch machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Schilo war ein früherer Heiligtumsort, der unter Gericht kam; der Vergleich kündigt Verwüstung und Verwerfung an.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Diese Stadt werde ich für alle Völker der Erde zum Gegenstand des Verfluchens machen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Dann mache ich
  rationale: נתן bedeutet wörtlich „geben/setzen“, hat hier aber mit dem doppelten Akkusativ die idiomatische Bedeutung „zu etwas machen“. „Dann“ gibt den Folgezusammenhang des vorangehenden Bedingungssatzes wieder.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: „Haus“ entspricht dem hebräischen בַּיִת und bewahrt die Bezeichnung des Tempels als Haus des HERRN, ohne den Bezug im Haupttext enger auszulegen.
- source_word: כְּשִׁלֹה
  choice: wie Schilo
  rationale: Das Präfix כְּ kennzeichnet einen Vergleich; Schilo bleibt als Ortsname erhalten.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Direkte Wiedergabe der Demonstrativverbindung; im Kontext ist Jerusalem gemeint.
- source_word: אֶתֵּן לִקְלָלָה
  choice: mache ich zum Fluch
  rationale: Die Verbindung נתן + ל + קְלָלָה bezeichnet, dass die Stadt zu einem Fluch beziehungsweise zu einem Gegenstand oder Beispiel des Verfluchens wird. Die knappe Form bewahrt die Bildsprache.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ
  choice: für alle Völker der Erde
  rationale: גּוֹיֵי הָאָרֶץ meint hier am natürlichsten die Völker der Erde beziehungsweise Welt. „Für“ gibt die Beziehung wieder, in der die Stadt ihnen als Fluchformel oder Fluchbeispiel dient.
theological_decisions:
- issue: Bezeichnung des Tempels
  choice: dieses Haus
  alternative: dieser Tempel
  rationale: Obwohl der Jerusalemer Tempel gemeint ist, lautet der hebräische Ausdruck „Haus“. Diese Wiedergabe bewahrt seine theologische Resonanz als Haus des HERRN.
- issue: Bedeutung der Gerichtsformel über die Stadt
  choice: diese Stadt mache ich zum Fluch
  alternative: diese Stadt mache ich für alle Völker der Erde zum Gegenstand des Verfluchens
  rationale: Das hebräische Idiom kann bedeuten, dass die Stadt in Fluchformeln genannt oder selbst zum abschreckenden Fluchbeispiel wird. Der Haupttext lässt diese Spannung bestehen; die Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „mache ich“ spiegelt die parallele hebräische Satzstruktur; „Haus“ bewahrt die quellensprachliche Tempelbezeichnung.
