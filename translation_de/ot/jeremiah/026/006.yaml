    issue: Präsens „mache ich“ statt Zukunftsankündigung
    rationale: Die hebräischen Perfektformen haben hier im Anschluss an die vorausgehende Bedingung zukünftige, drohende Kraft. Das Deutsche sollte dies mit „werde … machen“ kenntlich machen.
  - severity: low
    issue: „dieses Haus wie Schilo machen“ ist weniger idiomatisch
    rationale: „dieses Haus Schilo gleichmachen“ bezeichnet im Deutschen eindeutiger, dass das Haus in den Zustand Schilos versetzt wird, nicht dass es sich wie Schilo verhält.
