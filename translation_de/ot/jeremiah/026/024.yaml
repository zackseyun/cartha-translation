  text: אַ֗ךְ יַ֚ד אֲחִיקָ֣ם בֶּן שָׁפָ֔ן הָיְתָ֖ה אֶֽת יִרְמְיָ֑הוּ לְ/בִלְתִּ֛י תֵּת אֹת֥/וֹ בְ/יַד הָ/עָ֖ם לַ/הֲמִיתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/024.yaml
  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
translation:
  language: de
  text: Doch die Hand Ahikams, des Sohnes Schafans, war mit Jeremia[a], sodass er nicht in die Hand des Volkes gegeben wurde[b], damit das Volk ihn töte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Die Hand Ahikams … war mit Jeremia.“ Gemeint ist, dass Ahikam Jeremia unterstützte und beschützte.'
    reason: lexical_alternative
  - marker: b
    text: '„In die Hand des Volkes“ bedeutet: in seine Gewalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel setzt Ahikams Eingreifen in einen deutlichen Gegensatz zu der zuvor geschilderten tödlichen Bedrohung Jeremias.
- source_word: יַד אֲחִיקָם ... הָיְתָה אֶת יִרְמְיָהוּ
  choice: die Hand Ahikams ... war mit Jeremia
  rationale: Die bildhafte hebräische Wendung bezeichnet Ahikams tätige Unterstützung und seinen Schutz. Ihre Beibehaltung bewahrt zugleich den beabsichtigten Gegensatz zur folgenden „Hand des Volkes“.
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam, des Sohnes Schafans
  rationale: Die Namen werden in etablierter deutscher Form wiedergegeben; בן bezeichnet hier die Abstammung.
- source_word: לְבִלְתִּי תֵּת אֹתוֹ
  choice: sodass er nicht ... gegeben wurde
  rationale: Die negative Infinitivkonstruktion kann Zweck oder Folge ausdrücken. „Sodass“ gibt im Zusammenhang die bewirkte Verhinderung natürlich wieder, ohne ein im Hebräischen ungenanntes handelndes Subjekt einzuführen.
- source_word: בְיַד הָעָם
  choice: in die Hand des Volkes
  rationale: Die Wendung bedeutet, jemandem ausgeliefert beziehungsweise in dessen Gewalt gegeben zu werden. Die wörtliche Bildsprache erhält die sprachliche Gegenüberstellung der beiden „Hände“.
- source_word: לַהֲמִיתוֹ
  choice: um ihn zu töten
  rationale: Der Hifil von מות bedeutet „sterben lassen, töten“. Die Wiedergabe drückt den Zweck der beabsichtigten Auslieferung direkt aus, ohne einen förmlichen Hinrichtungsakt vorauszusetzen.
