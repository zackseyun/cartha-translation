translation_notes:
  register: Moderne, würdige Standardsprache. Die beiden Hand-Metaphern wurden bewusst beibehalten, damit der Kontrast zwischen Ahikams Schutz und der Gewalt des Volkes sichtbar bleibt; die Fußnoten erläutern die hebräischen Wendungen.
