  text: בְּ/רֵאשִׁ֗ית מַמְלְכ֛וּת יְהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָה֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
translation:
  language: de
  text: Am Anfang der Herrschaft Jojakims, des Königs von Juda und des Sohnes Josias, erging dieses Wort von Jahwe:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Dieses Wort war von Jahwe.« Das hebräische לֵאמֹר leitet die folgende Rede ein. Für den Gottesnamen steht im Hebräischen JHWH; traditionell wird er mit »der HERR« wiedergegeben.'
    reason: Die Fußnote erläutert die vom hebräischen Wortlaut abweichende, im Deutschen idiomatische prophetische Formel und die Funktion des Rede-Einleiters, ohne einen Sprecher in לֵאמֹר hineinzulesen.
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלְכוּת
  choice: Am Anfang der Herrschaft
  rationale: בְּרֵאשִׁית bezeichnet den Anfangszeitraum, מַמְלְכוּת hier die Regierungszeit beziehungsweise Königsherrschaft Jojakims. Die deutsche Wendung ist natürlich und bleibt eng am Hebräischen.
- source_word: יְהוֹיָקִים בֶּן יֹאשִׁיָּהוּ
  choice: Jojakims, des Sohnes Josias
  rationale: Die Namen folgen der im Deutschen etablierten biblischen Form; die Genitiv-Apposition gibt die Abstammungsangabe klar wieder.
- source_word: מֶלֶךְ יְהוּדָה
  choice: des Königs von Juda
  rationale: Die Apposition bezieht sich grammatisch auf Jojakim und wird im Deutschen in die bereits begonnene Genitivkonstruktion eingebunden.
- source_word: הָיָה הַדָּבָר הַזֶּה
  choice: erging dieses Wort
  rationale: Wörtlich steht »dieses Wort war«. »erging« gibt die übliche prophetische Offenbarungsformel in würdigem, verständlichem Deutsch wieder, ohne דָּבָר zu »Botschaft« zu verflachen.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet Ursprung beziehungsweise Urheber des Wortes; »von« ist hier idiomatisches Deutsch. Der Gottesname wird als Jahwe wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die folgende direkte Rede ein. Im Deutschen übernimmt ein Doppelpunkt diese Funktion natürlicher als das wörtliche »indem er sprach« oder »folgendermaßen«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. »Jahwe« bewahrt ihn als persönlichen Gottesnamen; die traditionelle Ersetzung durch den Titel »der HERR« wird in einer Fußnote genannt.
- issue: Subjektzuordnung der Königsbezeichnung
  choice: Jojakim ist als König von Juda bezeichnet
  alternative: Josia ist als König von Juda bezeichnet
  rationale: Obwohl die unmittelbare Wortfolge formal eine Nähe zu Josia zulässt, bezeichnet die feste Datierungsformel in Jeremia Jojakim als König von Juda. Die deutsche Genitivkonstruktion macht diese syntaktische Zuordnung deutlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung »erging dieses Wort« bewahrt den vertrauten prophetischen Sprachklang, bleibt aber verständlich. Der Doppelpunkt leitet die in Vers 2 folgende Rede idiomatisch ein.
