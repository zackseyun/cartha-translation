  text: לִ/שְׁמֹ֗עַ עַל דִּבְרֵ֨י עֲבָדַ֣/י הַ/נְּבִאִ֔ים אֲשֶׁ֥ר אָנֹכִ֖י שֹׁלֵ֣חַ אֲלֵי/כֶ֑ם וְ/הַשְׁכֵּ֥ם וְ/שָׁלֹ֖חַ וְ/לֹ֥א שְׁמַעְתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/005.yaml
  text: to listen to the words of my servants the prophets[a], whom I am sending to you, rising early and sending, though you have not listened,
translation:
  language: de
  text: auf die Worte meiner Diener, der Propheten, zu hören, die ich immer wieder[a] zu euch sende – doch ihr habt nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „früh aufstehend und sendend“; eine hebräische Wendung für beharrliches, wiederholtes Handeln.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ עַל דִּבְרֵי
  choice: auf die Worte … zu hören
  rationale: Der Infinitiv setzt die Bedingungsreihe aus dem vorhergehenden Vers fort. Bei שׁמע bezeichnet עַל hier das, worauf gehört werden soll. „Hören“ bewahrt sowohl das tatsächliche Zuhören als auch den möglichen Beiklang des Befolgens.
- source_word: עֲבָדַי הַנְּבִאִים
  choice: meiner Diener, der Propheten
  rationale: „Diener“ gibt die übliche Bezeichnung für von Gott beauftragte Propheten angemessen wieder; die Apposition „der Propheten“ identifiziert sie.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  choice: die ich … zu euch sende
  rationale: Das Partizip bezeichnet im Zusammenhang ein fortdauerndes beziehungsweise wiederholtes Senden. Das ausdrücklich gesetzte אָנֹכִי wird durch „ich“ wiedergegeben.
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: immer wieder … sende
  rationale: Die wörtliche Wendung „früh aufstehen und senden“ ist ein hebräisches Idiom für beharrliches, wiederholtes Handeln. „Immer wieder“ gibt ihren Sinn in natürlichem Deutsch wieder; die wörtliche Bildsprache steht in der Fußnote.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: doch ihr habt nicht gehört
  rationale: Das Waw hat hier im Zusammenhang adversative Kraft. Das Perfekt beschreibt das bisherige Versagen; das deutsche Perfekt wahrt zugleich den wiederholten Leitbegriff „hören“.
theological_decisions:
- issue: Anthropomorphe Wendung וְהַשְׁכֵּם וְשָׁלֹחַ
  choice: immer wieder zu euch sende
  alternative: früh aufstehend und sendend
  rationale: Die Übersetzung vermittelt die beharrliche, wiederholte Initiative Gottes, ohne die hebräische Bildrede fälschlich als bloße Zeitangabe zu behandeln. Die wörtliche Form bleibt in der Fußnote transparent.
- issue: Bedeutungsumfang von שׁמע
  choice: hören
  alternative: gehorchen
  rationale: „Hören“ erhält die lexikalische Wiederholung und lässt den kontextuellen Beiklang des Beachtens beziehungsweise Gehorchens bestehen, ohne ihn ausdrücklich festzulegen.
- issue: Wiedergabe von עֲבָדַי
  choice: meine Diener
  alternative: meine Sklaven
  rationale: In der prophetischen Beauftragungsformel bezeichnet der Ausdruck Gottes beauftragte Diener. „Sklaven“ würde hier einen sozialen Status in den Vordergrund rücken, den der Kontext nicht betont.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktisch abhängiger Teil der Bedingungsreihe aus Jeremia 26,4–6 formuliert. Der Gedankenstrich macht den adversativen Abschluss lesbar, ohne die Satzbindung aufzulösen.
