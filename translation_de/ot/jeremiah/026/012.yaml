  text: וַ/יֹּ֤אמֶר יִרְמְיָ֨הוּ֙ אֶל כָּל הַ/שָּׂרִ֔ים וְ/אֶל כָּל הָ/עָ֖ם לֵ/אמֹ֑ר יְהוָ֣ה שְׁלָחַ֗/נִי לְ/הִנָּבֵ֞א אֶל הַ/בַּ֤יִת הַ/זֶּה֙ וְ/אֶל הָ/עִ֣יר הַ/זֹּ֔את אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שְׁמַעְתֶּֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/012.yaml
  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: de
  text: 'Da sagte Jeremia zu allen führenden Männern und zum ganzen Volk: »Der HERR hat mich gesandt, gegen dieses Haus und gegen diese Stadt all die Worte prophetisch zu verkünden, die ihr gehört habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: führenden Männer
  rationale: Bezeichnet hier die leitenden Amtsträger; diese natürliche deutsche Formulierung vermeidet die heute missverständliche Bedeutung von »Fürsten«.
- source_word: יְהוָה
  choice: der HERR
  rationale: Wiedergabe des Gottesnamens JHWH gemäß etablierter deutscher Bibeltradition.
- source_word: לְהִנָּבֵא אֶל
  choice: gegen … prophetisch zu verkünden
  rationale: אֶל kann zwar allgemein »zu/über« bedeuten, doch der Kontext der Gerichtsbotschaft legt die adversative Richtung »gegen« nahe; »prophetisch verkünden« bildet den Infinitiv von נבא ab.
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: Bewahrt die konkrete Bezeichnung des Tempels als »Haus«, ohne die Referenz im Haupttext erklärend auszuweiten.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: all die Worte
  rationale: Gibt דְּבָרִים als konkrete prophetische Aussprüche wieder und bewahrt den Rückbezug auf das Gehörte.
theological_decisions:
- issue: Urheberschaft und Sendung der Gerichtsbotschaft
  choice: »Der HERR hat mich gesandt«
  alternative: »Ich habe im Auftrag des HERRN gesprochen«
  rationale: Die direkte Sendungsformel des Hebräischen bleibt erhalten und betont, dass Jeremia seine prophetische Vollmacht von JHWH herleitet.
- issue: Richtung der Prophetie
  choice: »gegen dieses Haus und gegen diese Stadt«
  alternative: »über dieses Haus und über diese Stadt«
  rationale: Der unmittelbare Kontext ist eine Gerichtankündigung; »gegen« gibt diese Stoßrichtung wieder, ohne den Inhalt über den Ausgangstext hinaus zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das formelhafte לֵאמֹר wird nicht eigens als »indem er sprach« wiedergegeben, da der Doppelpunkt seine Funktion im Deutschen natürlich erfüllt. »Jeremia« folgt der etablierten deutschen Namensform.
