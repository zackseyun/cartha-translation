  terminology: „Jahwe“, „weissagte“, „Uria“, „Schemaja“ und „Kirjat-Jearim“ sind im deutschen bibelsprachlichen Register angemessen. „Gegen“ ist im gegebenen Gerichtskontext gut begründet; die mögliche allgemeinere Lesart von עַל bleibt sachgerecht in der Fußnote vermerkt.
