source:
  edition: WLC
  text: וְ/גַם אִ֗ישׁ הָיָ֤ה מִתְנַבֵּא֙ בְּ/שֵׁ֣ם יְהוָ֔ה אֽוּרִיָּ֨הוּ֙ בֶּֽן שְׁמַעְיָ֔הוּ מִ/קִּרְיַ֖ת הַיְּעָרִ֑ים וַ/יִּנָּבֵ֞א עַל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל הָ/אָ֣רֶץ הַ/זֹּ֔את כְּ/כֹ֖ל דִּבְרֵ֥י יִרְמְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
translation:
  language: de
  text: 'Auch gab es einen Mann, der im Namen Jahwes weissagte: Uria, der Sohn Schemajas, aus Kirjat-Jearim. Er weissagte gegen diese Stadt und gegen dieses Land[a], allen Worten Jeremias entsprechend.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „über diese Stadt und über dieses Land“. Die hebräische Präposition kann allgemein das Thema einer Weissagung bezeichnen; im vorliegenden Gerichtskontext liegt jedoch „gegen“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִישׁ הָיָה מִתְנַבֵּא
  choice: Auch ein Mann trat als Prophet ... auf
  rationale: Gibt die zusätzliche, andauernd beziehungsweise beschreibend dargestellte prophetische Tätigkeit in natürlichem Deutsch wieder, ohne Uria lediglich als Propheten zu titulieren.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Bezeichnet das Reden unter Berufung auf die Autorität des Gottesnamens; der Eigenname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: אוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ
  choice: Uria, der Sohn Schemajas
  rationale: Verwendet die im Deutschen geläufigen biblischen Namensformen und bewahrt die genealogische Zuordnung.
- source_word: מִקִּרְיַת הַיְּעָרִים
  choice: aus Kirjat-Jearim
  rationale: Transliteriert den Ortsnamen in einer üblichen deutschen Form.
- source_word: וַיִּנָּבֵא עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  choice: Er weissagte gegen diese Stadt und gegen dieses Land
  rationale: „Gegen“ entspricht im Gerichtskontext der wahrscheinlichsten adversativen Bedeutung von עַל; die allgemeinere Bedeutung „über“ bleibt in einer Fußnote erhalten.
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  choice: ganz entsprechend den Worten Jeremias
  rationale: Drückt die vollständige inhaltliche Übereinstimmung mit Jeremias Botschaft idiomatisch aus, ohne eine wörtliche Identität jeder Formulierung zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Wiedergabe und bewahrt den Eigennamecharakter.
- issue: Bedeutung von עַל bei der Prophetie
  choice: gegen diese Stadt und gegen dieses Land
  alternative: über diese Stadt und dieses Land
  rationale: Der Zusammenhang mit Jeremias Gerichtsbotschaft legt die adversative Bedeutung nahe; da die Präposition auch lediglich das Thema bezeichnen kann, wird diese Möglichkeit nicht verschwiegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Als Prophet auftreten“ bildet die hebräische Verlaufsform natürlich ab; „weissagen“ hält die Wiederholung des prophetischen Verbs erkennbar. Der Satz wurde zur besseren deutschen Lesbarkeit nach der Herkunftsangabe geteilt.
