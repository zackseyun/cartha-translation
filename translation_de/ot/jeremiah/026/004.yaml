  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֖ה אָמַ֣ר יְהוָ֑ה אִם לֹ֤א תִשְׁמְעוּ֙ אֵלַ֔/י לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/004.yaml
  text: 'And you shall say to them, ‘Thus says the LORD: If you do not listen to me, to walk in my law that I have set before you,’'
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »So spricht der HERR: Wenn ihr nicht auf mich hört und nicht nach meiner Weisung lebt, die ich euch vorgelegt habe,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: auf mich hört
  rationale: Das hebräische שמע mit אֶל bezeichnet hier nicht bloß akustisches Hören, sondern aufmerksames und gehorsames Hören; die geläufige deutsche Wendung bewahrt beides.
- source_word: לָלֶכֶת בְּתוֹרָתִי
  choice: nach meiner Weisung lebt
  rationale: Wörtlich »in meiner Tora zu gehen«. Die deutsche Formulierung gibt das Bild des Lebenswandels natürlich wieder; »Weisung« erfasst תּוֹרָה hier weiter und angemessener als das enger klingende »Gesetz«.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: die ich euch vorgelegt habe
  rationale: Die Wendung bedeutet wörtlich, etwas vor jemanden zu geben beziehungsweise hinzustellen; »vorgelegt« bewahrt dieses Bild in idiomatischem Deutsch.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens in Kapitälchen entspricht der üblichen jüdisch-christlichen Lesetradition, ohne eine unsichere Vokalisierung festzuschreiben.
theological_decisions:
- issue: Verhältnis von Hören und Lebenswandel
  choice: »auf mich hört und nicht nach meiner Weisung lebt«
  alternative: »auf mich hört, indem ihr nach meiner Weisung lebt«
  rationale: Der hebräische Infinitiv לָלֶכֶת kann den Inhalt beziehungsweise die praktische Ausprägung des Hörens erläutern. Im Deutschen macht die koordinierte negative Form die enge Verbindung verständlich, ohne den Lebenswandel vollständig mit dem Hören gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Gottesrede bleibt offen, weil der Bedingungssatz in Vers 5 weitergeführt wird; daher endet der Vers mit einem Komma.
