base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/011.yaml
  text: Then the priests and the prophets said to the officials and to all the people, saying, “A sentence of death is for this man, because he has prophesied against this city, just as you have heard with your own ears.”
translation:
  language: de
  text: 'Da sagten die Priester und die Propheten zu den Amtsträgern und zum ganzen Volk: »Für diesen Mann lautet das Urteil auf Tod, denn er hat gegen diese Stadt geweissagt, wie ihr mit eigenen Ohren gehört habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: die führenden Männer
  rationale: שׂרים bezeichnet hier die politisch-gerichtlichen Amtsträger; die Formulierung ist im Deutschen verständlich und vermeidet die heute missverständliche Wiedergabe »Fürsten«.
- source_word: מִשְׁפַּט מָוֶת לָאִישׁ הַזֶּה
  choice: Dieser Mann ist des Todes schuldig
  rationale: Die knappe gerichtliche Formel besagt, dass der Mann nach dem Urteil der Sprecher den Tod verdient beziehungsweise dem Todesurteil verfällt. Die gewählte Form wahrt den forensischen und feierlichen Ton.
- source_word: נִבָּא אֶל הָעִיר הַזֹּאת
  choice: gegen diese Stadt geweissagt
  rationale: Die Präposition אֶל kann grundsätzlich »zu« bedeuten; im Kontext ist die Botschaft jedoch gegen die Stadt gerichtet, wie auch die Anklage zeigt.
- source_word: כַּאֲשֶׁר שְׁמַעְתֶּם בְּאָזְנֵיכֶם
  choice: wie ihr mit eigenen Ohren gehört habt
  rationale: Gibt die emphatische hebräische Wendung natürlich und anschaulich wieder.
theological_decisions:
- issue: Charakter der Todesforderung
  choice: »ist des Todes schuldig« als Behauptung der Priester und Propheten
  alternative: »Ein Todesurteil gebührt diesem Mann« / »Dieser Mann verdient den Tod«
  rationale: Der Vers berichtet die Anklage der Sprecher, ohne ihre rechtliche oder theologische Bewertung als objektiv gültig zu bestätigen.
- issue: Richtung der Prophetie
  choice: »gegen diese Stadt«
  alternative: »über diese Stadt« oder »zu dieser Stadt«
  rationale: Der unmittelbare Anklagekontext legt die adversative Bedeutung nahe, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das im Hebräischen redundante לֵאמֹר nach dem Sprechverb wird nicht eigens mit »indem sie sagten« wiedergegeben, da der folgende Doppelpunkt seine Funktion im Deutschen natürlich erfüllt.
