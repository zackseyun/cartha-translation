source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
translation:
  language: de
  text: 'So spricht Jahwe: Stell dich im Vorhof des Hauses Jahwes[a] auf und rede zu allen Menschen aus den Städten Judas[b], die kommen, um im Haus Jahwes anzubeten, alle Worte, die ich dir geboten habe, zu ihnen zu reden. Lass kein Wort aus[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Hof des Hauses Jahwes“. Das hebräische Wort kann einen Hof oder Vorhof bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: „zu/gegen alle Städte Judas“ oder „über alle Städte Judas“. Der hebräische Text bezeichnet die Städte; der folgende Ausdruck „die kommen“ meint erkennbar die Menschen aus diesen Städten, die zur Anbetung kommen.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Wörtlich: „Verringere kein Wort“; auch: „Halte kein Wort zurück“ oder „Nimm kein Wort weg“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feststehende prophetische Botenformel in würdigem, natürlichem Deutsch und gibt den Gottesnamen als Eigennamen wieder.
- source_word: עֲמֹד
  choice: Stell dich
  rationale: Der Imperativ bezeichnet hier das Einnehmen eines bestimmten Standorts; „Stell dich“ klingt im Deutschen natürlicher als das isolierte „Steh“.
- source_word: בַּחֲצַר בֵּית יְהוָה
  choice: in den Vorhof des Hauses Jahwes
  rationale: חָצֵר bezeichnet den Hof- oder Vorhofbereich. Nach „sich stellen“ ist im Deutschen die Richtungsangabe mit Akkusativ idiomatisch, obwohl das Hebräische den Standort profiliert.
- source_word: וְדִבַּרְתָּ
  choice: und verkünde
  rationale: Das koordinierte Verb führt den Befehl fort. „Verkünde“ gibt im prophetischen Kontext das öffentliche Reden treffend wieder, ohne den Inhalt zu verstärken.
- source_word: עַל כָּל עָרֵי יְהוּדָה
  choice: allen Städten Judas
  rationale: Die Städte stehen metonymisch für ihre Bewohner. עַל bleibt jedoch mehrdeutig und kann auch „gegen“ oder „über“ bedeuten; dies wird in einer Fußnote offengehalten.
- source_word: הַבָּאִים לְהִשְׁתַּחֲוֺת
  choice: die kommen, um … anzubeten
  rationale: Die Formulierung gibt das Kommen mit dem Ziel kultischer Verehrung natürlich wieder. Das körperliche Niederwerfen ist im Verb mit enthalten.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus Jahwes“ bildet die hebräische Benennung formal ab; „im“ bezeichnet hier den Ort beziehungsweise Tempelbereich der Anbetung.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alle Worte
  rationale: Bewahrt die Betonung des vollständigen Wortlauts, die durch den abschließenden Befehl verstärkt wird.
- source_word: אֲשֶׁר צִוִּיתִיךָ לְדַבֵּר אֲלֵיהֶם
  choice: die ich dir aufgetragen habe, zu ihnen zu reden
  rationale: „Aufgetragen“ gibt den göttlichen Befehl natürlich wieder; „zu ihnen zu reden“ bewahrt die Wiederholung des hebräischen דבר.
- source_word: אַל תִּגְרַע דָּבָר
  choice: Lass kein Wort aus
  rationale: Im Zusammenhang der Verkündigung bedeutet גרע, nichts vom anvertrauten Wort wegzunehmen beziehungsweise zu unterschlagen. Die deutsche Formulierung ist klar und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen und folgt der im Deutschen üblichen wissenschaftlichen Transkription, ohne ihn durch einen Titel zu ersetzen.
- issue: Adressatenformulierung „allen Städten Judas“
  choice: Die Städte werden als Bezeichnung ihrer zum Tempel kommenden Bewohner verstanden.
  alternative: „gegen alle Städte Judas“ oder „über alle Städte Judas“
  rationale: Der folgende Relativsatz spricht von denen, die zum Gottesdienst kommen, und legt daher die Bewohner als Adressaten nahe. Die mögliche adversative oder thematische Bedeutung der Präposition wird nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Sprachrhythmus. „Haus Jahwes“ wahrt die Bildsprache des Hebräischen; „Vorhof“ und „verkünde“ sorgen zugleich für unmittelbare Verständlichkeit.
