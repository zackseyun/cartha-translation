id: JER.26.22
reference: Jeremiah 26:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֧לֶךְ יְהוֹיָקִ֛ים אֲנָשִׁ֖ים מִצְרָ֑יִם אֵ֣ת אֶלְנָתָ֧ן בֶּן עַכְבּ֛וֹר וַ/אֲנָשִׁ֥ים אִתּ֖/וֹ אֶל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/022.yaml
  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
translation:
  language: de
  text: 'Da sandte König Jojakim Männer nach Ägypten: Elnatan, den Sohn Achbors,[a] und Männer, die mit ihm waren, nach Ägypten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen steht am Ende noch einmal „nach Ägypten“ als Zielangabe für Elnatan und die Männer bei ihm; die Übersetzung behält diese Wiederholung bei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Da sandte
  rationale: Das Verb שׁלח bezeichnet hier ein Aussenden; „Da“ gibt die fortschreitende Erzählfolge des Waw-Konsekutivs natürlich wieder.
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  choice: König Jojakim
  rationale: Titel und Name werden im Deutschen idiomatisch als „König Jojakim“ wiedergegeben.
- source_word: אֲנָשִׁים
  choice: Männer
  rationale: Der Plural bezeichnet hier männliche Beauftragte einer offiziellen Mission.
- source_word: מִצְרַיִם
  choice: Ägypten
  rationale: Übliche deutsche Wiedergabe des Ortsnamens.
- source_word: אֵת
  choice: ':'
  rationale: Der direkte Objektmarker leitet hier die nähere Benennung der ausgesandten Männer ein; ein Doppelpunkt bildet diese Struktur im Deutschen klar ab.
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  choice: Elnatan, den Sohn Achbors
  rationale: Die Namen werden nach geläufiger deutscher Bibeltradition transliteriert; der Akkusativ folgt der Satzkonstruktion, und das Patronym wird natürlich wiedergegeben.
- source_word: וַאֲנָשִׁים אִתּוֹ
  choice: und Männer, die mit ihm waren
  rationale: Die Formulierung bewahrt die schlichte Aussage des Hebräischen, ohne das nicht ausdrücklich vorhandene „weitere“ hinzuzufügen.
- source_word: אֶל מִצְרָיִם
  choice: nach Ägypten
  rationale: אֶל bezeichnet das Ziel; die Wiederholung am Versende wird entsprechend dem Hebräischen beibehalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die hebräische Wiederholung der Zielangabe bleibt erhalten; der Doppelpunkt macht die appositionelle Benennung der ausgesandten Männer verständlich.
