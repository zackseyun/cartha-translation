id: JER.28.5
reference: Jeremiah 28:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אֶל חֲנַנְיָ֖ה הַ/נָּבִ֑יא לְ/עֵינֵ֤י הַ/כֹּֽהֲנִים֙ וּ/לְ/עֵינֵ֣י כָל הָ/עָ֔ם הָ/עֹמְדִ֖ים בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/005.yaml
  text: Then Jeremiah the prophet said to Hananiah the prophet in the sight of the priests and in the sight of all the people who were standing in the house of Yahweh:[a][b]
translation:
  language: de
  text: Da sagte der Prophet Jeremia zu dem Propheten Hananja vor den Augen der Priester und vor den Augen des ganzen Volkes, das im Haus Jahwes stand:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Gegenwart der Priester und des ganzen Volkes“.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus Jahwes“ ist hier der Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Consecutiv führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Abfolge in natürlichem Deutsch wieder.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: der Prophet Jeremia
  rationale: Die im Deutschen übliche Wortstellung bewahrt sowohl den Namen als auch den bestimmten Titel.
- source_word: אֶל חֲנַנְיָה הַנָּבִיא
  choice: zu dem Propheten Hananja
  rationale: Die Wiederholung des Prophetentitels wird entsprechend dem Hebräischen beibehalten.
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Die konkrete hebräische Wendung wird bewahrt und hebt hervor, dass die Aussage öffentlich und von den Anwesenden wahrgenommen wurde.
- source_word: הַכֹּהֲנִים
  choice: der Priester
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: כָל הָעָם
  choice: des ganzen Volkes
  rationale: עָם bezeichnet hier die versammelte Bevölkerung beziehungsweise Gemeinschaft, nicht lediglich eine beliebige Menschenmenge.
- source_word: הָעֹמְדִים
  choice: das ... stand
  rationale: Das Partizip beschreibt das Volk als dort anwesend und stehend; wegen des singularischen Kollektivnomens „Volk“ steht das Relativverb im Singular.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus“ bewahrt das hebräische Bild, während „Jahwe“ den im Ausgangstext ausdrücklich stehenden Gottesnamen wiedergibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen; „Jahwe“ ist die etablierte deutsche Form.
- issue: Bezeichnung Hananjas als Prophet
  choice: der Prophet Hananja
  alternative: Hananja, der Prophet
  rationale: Der Vers selbst bezeichnet Hananja ohne einschränkende Wertung als נביא. Diese Spannung zum weiteren Erzählverlauf wird nicht durch Zusätze wie „angeblich“ oder „falsch“ aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „vor den Augen“ folgt bewusst der hebräischen Rhetorik; die Satzstellung bleibt trotz Quellennähe gut verständlich.
