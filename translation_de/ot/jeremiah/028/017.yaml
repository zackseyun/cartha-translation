  text: וַ/יָּ֛מָת חֲנַנְיָ֥ה הַ/נָּבִ֖יא בַּ/שָּׁנָ֣ה הַ/הִ֑יא בַּ/חֹ֖דֶשׁ הַ/שְּׁבִיעִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/017.yaml
  text: And Hananiah the prophet died in that year[a], in the seventh month.
translation:
  language: de
  text: Und der Prophet Hananja starb in jenem Jahr, im siebten Monat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Und … starb
  rationale: Das Qal-Wayyiqtol von מות bezeichnet schlicht das Sterben und führt die Erzählung fort. Die deutsche Satzstellung gibt sowohl die Verknüpfung als auch den natürlichen Erzählstil wieder.
- source_word: חֲנַנְיָה
  choice: Hananja
  rationale: Der Personenname wird in einer im Deutschen üblichen, eng am Hebräischen orientierten Form wiedergegeben.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: נָבִיא bedeutet hier „Prophet“. Der Kontext beurteilt Hananja zwar als falschen Verkündiger, doch der Vers selbst fügt keine abwertende Bezeichnung hinzu.
- source_word: בַּשָּׁנָה הַהִיא
  choice: in jenem Jahr
  rationale: Dies entspricht unmittelbar der rückverweisenden Zeitangabe „in jenem/dem Jahr“, ohne das im Hebräischen nicht eigens ausgedrückte Wort „selben“ hinzuzufügen.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Direkte und idiomatische Wiedergabe der Präpositionalverbindung mit der Ordnungszahl.
theological_decisions:
- issue: Soll Hananja ausdrücklich als falscher Prophet bezeichnet werden?
  choice: der Prophet
  alternative: der falsche Prophet
  rationale: Obwohl der Erzählzusammenhang Hananjas Botschaft als falsch entlarvt, steht im hebräischen Vers nur der gewöhnliche Titel „der Prophet“. Die Übersetzung übernimmt diese Spannung und fügt kein wertendes Adjektiv hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzform bewahrt den nüchternen erzählerischen Abschluss des Abschnitts; die Zeitangaben bleiben eng am Hebräischen.
