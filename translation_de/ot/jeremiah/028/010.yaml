id: JER.28.10
reference: Jeremiah 28:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֕ל צַוַּ֖אר יִרְמְיָ֣ה הַ/נָּבִ֑יא וַֽ/יִּשְׁבְּרֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/010.yaml
  text: Then Hananiah the prophet took the yoke from the neck of Jeremiah the prophet and broke it[a].
translation:
  language: de
  text: Da nahm der Prophet Hananja das Joch vom Nacken des Propheten Jeremia und zerbrach es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Stange“ beziehungsweise „die Jochstange“. Das hebräische Wort kann die hölzerne Stange eines Jochs bezeichnen. Im Haupttext steht „Joch“, weil die Zeichenhandlung im Zusammenhang von dem Joch handelt, das Jeremia trägt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Da nahm
  rationale: לקח bedeutet hier im fortlaufenden Erzählstil schlicht „nehmen“. „Da“ gibt die narrative Folge des Waw-Konsekutivs natürlich wieder; „entriss“ würde eine nicht ausdrücklich bezeichnete Gewaltsamkeit hinzufügen.
- source_word: חֲנַנְיָה
  choice: Hananja
  rationale: Der Personenname wird nach geläufiger deutscher Bibeltradition transliteriert.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: נָבִיא ist die übliche Bezeichnung für einen Propheten. Die Apposition wird bei Hananja und Jeremia beibehalten, da der hebräische Text beide ausdrücklich so bezeichnet.
- source_word: הַמּוֹטָה
  choice: das Joch
  rationale: מוֹטָה kann eine Stange, insbesondere eine Jochstange, bezeichnen. Im Zusammenhang der Zeichenhandlung Jeremias bezeichnet es das von ihm getragene Joch; „Joch“ ist daher im Haupttext verständlich und kontextgerecht, während die genauere gegenständliche Alternative in der Fußnote erhalten bleibt.
- source_word: מֵעַל צַוַּאר
  choice: vom Nacken
  rationale: Die Verbindung bedeutet wörtlich „von über/auf dem Nacken weg“. Das idiomatische deutsche „vom Nacken“ gibt die räumliche Entfernung prägnant wieder.
- source_word: יִרְמְיָה
  choice: Jeremia
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: und zerbrach es
  rationale: שׁבר bezeichnet das Zerbrechen. Das Pronomen „es“ bildet das maskuline Objektsuffix ab und verweist auf das Joch beziehungsweise die Jochstange.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die Wiederholung „der Prophet“ folgt bewusst dem hebräischen Text. „Da nahm“ bildet die unmittelbare narrative Abfolge natürlich ab; „zerbrach“ ist gegenüber dem allgemeineren „brach“ für einen konkreten Gegenstand idiomatisch.
