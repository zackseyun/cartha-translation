  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die wesentlichen hebräischen Elemente genau wieder: die doppelte Bezeichnung als „Prophet“, die eindringlich-abmildernde Aufforderung שְׁמַע־נָא, die Verneinung von JHWHs Sendung sowie das kausative הִבְטַחְתָּ mit dem Kollektiv „dieses Volk“ und der Vertrauensgrundlage „auf eine Lüge“. „Jahwe“ entspricht dem ausdrücklich genannten Gottesnamen. Der deutsche Anschluss „Da“ ist für das erzählfortführende Waw idiomatisch.'
