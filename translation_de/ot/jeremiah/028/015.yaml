id: JER.28.15
reference: Jeremiah 28:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִרְמְיָ֧ה הַ/נָּבִ֛יא אֶל חֲנַנְיָ֥ה הַ/נָּבִ֖יא שְׁמַֽע נָ֣א חֲנַנְיָ֑ה לֹֽא שְׁלָחֲ/ךָ֣ יְהוָ֔ה וְ/אַתָּ֗ה הִבְטַ֛חְתָּ אֶת הָ/עָ֥ם הַ/זֶּ֖ה עַל שָֽׁקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/015.yaml
  text: 'Then Jeremiah the prophet said to Hananiah the prophet[a], “Listen, please, Hananiah: Yahweh has not sent you[b], and you have made this people trust in a lie.”'
translation:
  language: de
  text: 'Da sagte der Prophet Jeremia zu dem Propheten Hananja: „Hör doch, Hananja! Jahwe hat dich nicht gesandt, und du hast dieses Volk dazu gebracht, auf eine Lüge zu vertrauen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Waw-Consecutivum führt die Erzählung weiter; „Da sagte“ gibt die zeitliche Folge in natürlichem Deutsch wieder.
- source_word: הַנָּבִיא
  choice: der Prophet
  rationale: Die bestimmte Amtsbezeichnung wird sowohl bei Jeremia als auch bei Hananja beibehalten; so bleibt auch die Spannung bestehen, dass Hananja als Prophet bezeichnet, aber als nicht gesandt entlarvt wird.
- source_word: שְׁמַע נָא
  choice: Hör doch
  rationale: Der Imperativ mit נָא verbindet eine nachdrückliche Aufforderung mit einer abmildernden beziehungsweise eindringlichen Partikel. „Hör doch“ ist dafür eine natürliche moderne deutsche Formulierung.
- source_word: לֹא שְׁלָחֲךָ יְהוָה
  choice: Jahwe hat dich nicht gesandt
  rationale: Das Perfekt wird im Deutschen mit Blick auf Hananjas gegenwärtig bestrittenen Sendungsanspruch idiomatisch als Perfekt wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird als Eigenname wiedergegeben.
- source_word: הִבְטַחְתָּ
  choice: du hast ... dazu gebracht, ... zu vertrauen
  rationale: Die Hifil-Form von בטח ist kausativ. Die Wiedergabe wahrt, dass Hananja das Vertrauen des Volkes verursacht hat, statt nur selbst zu vertrauen.
- source_word: הָעָם הַזֶּה
  choice: dieses Volk
  rationale: Der kollektive Singular mit Demonstrativ wird direkt und idiomatisch wiedergegeben.
- source_word: עַל שָׁקֶר
  choice: auf eine Lüge
  rationale: Die Präposition bezeichnet hier die Grundlage beziehungsweise den Gegenstand des fehlgeleiteten Vertrauens; שֶׁקֶר wird konkret als „Lüge“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung Hananjas als Prophet trotz der bestrittenen Sendung
  choice: zu dem Propheten Hananja
  alternative: zu Hananja, der sich als Prophet ausgab
  rationale: Der Text selbst nennt Hananja „den Propheten“ und bestreitet anschließend seine Sendung. Die Übersetzung erhält diese Spannung und fügt keine erklärende Abwertung in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „der Prophet“ folgt bewusst dem Hebräischen. „Hör doch“ ist eindringlich, aber nicht altertümlich; „dazu gebracht, auf eine Lüge zu vertrauen“ wahrt die kausative Aussage klar.
