  terminology: „Prophet“, „Jahwe“, „gesandt“ und „Volk“ sind konsistent und sachgerecht. Die Bezeichnung Hananjas als „der Prophet“ wird wie im Ausgangstext beibehalten, ohne seine Legitimität vorweg kommentierend umzudeuten.
