base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/008.yaml
  text: The prophets who were before me and before you from ancient times prophesied against many lands and against great kingdoms[b][a], of war and disaster and plague.
translation:
  language: de
  text: 'Die Propheten, die in alter Zeit vor mir und vor dir lebten[a], prophezeiten über viele Länder und gegen große Königreiche[b]: Krieg, Unheil und Pest[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „von alters her“. Der hebräische Ausdruck bezeichnet hier eine weit zurückliegende Zeit, nicht notwendig die Ewigkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „gegen viele Länder und gegen große Königreiche“.'
    reason: source_ambiguity
  - marker: c
    text: 'Oder: „Seuche“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּבִיאִים
  choice: Die Propheten
  rationale: Der bestimmte Plural wird direkt und idiomatisch wiedergegeben.
- source_word: אֲשֶׁר הָיוּ לְפָנַי וּלְפָנֶיךָ מִן הָעוֹלָם
  choice: die in alter Zeit vor mir und vor dir lebten
  rationale: לְפָנַי und לְפָנֶיךָ sind hier zeitlich zu verstehen. מִן הָעוֹלָם bezeichnet die weit zurückliegende Vergangenheit, nicht notwendig die Ewigkeit.
- source_word: וַיִּנָּבְאוּ
  choice: prophezeiten
  rationale: Die übliche und sachlich genaue Wiedergabe von נבא im prophetischen Zusammenhang.
- source_word: אֶל אֲרָצוֹת רַבּוֹת וְעַל מַמְלָכוֹת גְּדֹלוֹת
  choice: gegen viele Länder und mächtige Königreiche
  rationale: Die folgende Reihe von Gerichten stützt eine adversative Deutung. „Mächtig“ gibt גָּדוֹל bei Königreichen im natürlichen modernen Deutsch treffend wieder.
- source_word: לְמִלְחָמָה וּלְרָעָה וּלְדָבֶר
  choice: Krieg, Unheil und Pest
  rationale: Die לְ-Verbindungen benennen den Inhalt der Weissagungen. רָעָה bezeichnet hier Unheil oder Katastrophe, nicht sittliche Bosheit; דֶּבֶר bezeichnet eine verheerende Seuche.
theological_decisions:
- issue: Richtung beziehungsweise Gegenstand der prophetischen Botschaft
  choice: prophezeiten gegen viele Länder und mächtige Königreiche
  alternative: prophezeiten über viele Länder und mächtige Königreiche
  rationale: אֶל kann „zu“ und עַל „über/gegen“ bedeuten. Im unmittelbaren Gerichtskontext mit Krieg, Unheil und Pest ist „gegen“ wahrscheinlich, doch die neutralere Deutung bleibt in einer Fußnote sichtbar.
- issue: Bedeutung von רָעָה im Gerichtswort
  choice: Unheil
  alternative: Böses
  rationale: Gemeint ist hier das eintretende Unglück beziehungsweise Gericht, nicht moralische Bosheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht natürlich verständlich, dass Krieg, Unheil und Pest den Inhalt der Weissagungen bilden, ohne die knappe hebräische Reihung unnötig auszubauen.
