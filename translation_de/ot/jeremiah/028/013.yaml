source:
  edition: WLC
  text: הָלוֹךְ֩ וְ/אָמַרְתָּ֨ אֶל חֲנַנְיָ֜ה לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מוֹטֹ֥ת עֵ֖ץ שָׁבָ֑רְתָּ וְ/עָשִׂ֥יתָ תַחְתֵּי/הֶ֖ן מֹט֥וֹת בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/013.yaml
  text: 'Go and say to Hananiah, saying, ‘Thus says the LORD: You have broken wooden yoke-bars, but you have made iron yoke-bars in their place.’'
translation:
  language: de
  text: 'Geh und sag zu Hananja: »So spricht der HERR: Du hast hölzerne Jochstangen zerbrochen, doch an ihrer Stelle hast du eiserne Jochstangen gemacht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ וְאָמַרְתָּ ... לֵאמֹר
  choice: Geh und sag ...
  rationale: Die hebräische Aufforderungsformel wird idiomatisch und vollständig wiedergegeben; das zusätzliche לֵאמֹר wird im Deutschen durch den anschließenden Doppelpunkt ausgedrückt, statt unnatürlich mit „indem du sagst“ verdoppelt zu werden.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die etablierte deutsche Wiedergabe des Gottesnamens in Kapitälchenform entspricht der üblichen Bibeltradition und kennzeichnet, dass im Hebräischen der Eigenname JHWH steht.
- source_word: מוֹטֹת עֵץ
  choice: hölzerne Jochstangen
  rationale: מוֹטוֹת bezeichnet hier im Kontext des symbolischen Jochs dessen Stangen; „Jochstangen“ ist präziser als das allgemeinere „Stangen“.
- source_word: וְעָשִׂיתָ תַחְתֵּיהֶן מֹטוֹת בַּרְזֶל
  choice: doch an ihrer Stelle hast du eiserne Jochstangen gemacht
  rationale: Die direkte Anrede und das Verb „machen“ bleiben erhalten. „Doch“ gibt den kontrastierenden Zusammenhang natürlich wieder, ohne eine ausdrücklichere Folgerung in den Text einzutragen.
theological_decisions:
- issue: Wer die eisernen Jochstangen hervorbringt
  choice: „hast du ... gemacht“ mit Hananja als grammatischem Subjekt
  alternative: „werden ... eiserne Jochstangen treten“ oder eine Formulierung mit Gott als Handelndem
  rationale: Der hebräische Text redet Hananja in der zweiten Person an und verwendet וְעָשִׂיתָ. Die Übersetzung bewahrt diese zugespitzte Zuschreibung, ohne sie anhand des weiteren Kontexts umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Sprache des Jochs und die knappe prophetische Botenformel bleiben erhalten; unnötige formelhafte Verdopplungen werden vermieden.
