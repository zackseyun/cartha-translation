source:
  edition: WLC
  text: וְ/אֶת יְכָנְיָ֣ה בֶן יְהוֹיָקִ֣ים מֶֽלֶךְ יְ֠הוּדָה וְ/אֶת כָּל גָּל֨וּת יְהוּדָ֜ה הַ/בָּאִ֣ים בָּבֶ֗לָ/ה אֲנִ֥י מֵשִׁ֛יב אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה נְאֻם יְהוָ֑ה כִּ֣י אֶשְׁבֹּ֔ר אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/004.yaml
  text: And I will bring back to this place Jeconiah son of Jehoiakim[a], king of Judah, and all the exiles of Judah who came to Babylon, declares Yahweh, for I will break the yoke of the king of Babylon.
translation:
  language: de
  text: Und Jojachin, den Sohn Jojakims, den König von Juda, und alle Weggeführten aus Juda, die nach Babel gekommen sind, werde ich an diesen Ort zurückbringen – Ausspruch Jahwes –, denn ich werde das Joch des Königs von Babel zerbrechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְכָנְיָה
  choice: Jojachin
  rationale: Die im Deutschen gebräuchliche biblische Namensform für Jechonja/Jekonja in diesem Zusammenhang; sie bezeichnet den Sohn Jojakims und König von Juda.
- source_word: גָּלוּת
  choice: alle Weggeführten
  rationale: Das Kollektiv bezeichnet hier aufgrund des folgenden Partizips die deportierten Menschen, nicht lediglich den Zustand des Exils. „Weggeführte“ macht den erzwungenen Charakter deutlich, ohne das folgende Verb passiv umzudeuten.
- source_word: הַבָּאִים בָּבֶלָה
  choice: die nach Babel gekommen sind
  rationale: Gibt das Partizip von בוא formal als „kommen“ wieder. Der deutsche Satz erlaubt diese Perspektive, ohne eine freiwillige Reise zu unterstellen; „gebracht wurden“ wäre expliziter passiv als der hebräische Wortlaut.
- source_word: מֵשִׁיב
  choice: werde ich … zurückbringen
  rationale: Der Hifil von שוב bedeutet bei Personen und mit Zielangabe sachgerecht „zurückbringen“.
- source_word: הַמָּקוֹם הַזֶּה
  choice: diesen Ort
  rationale: Natürliche und genaue Wiedergabe der deiktischen Wendung; im Kontext ist Jerusalem beziehungsweise Juda gemeint, wird aber nicht ausdrücklich eingesetzt.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den feierlichen, formelhaften Charakter der prophetischen Botenformel enger als ein bloßes „spricht“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen etablierte Transkription wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: עֹל
  choice: Joch
  rationale: Bewahrt das konkrete prophetische Bild für politische Unterwerfung und Fremdherrschaft.
- source_word: אֶשְׁבֹּר אֶת עֹל מֶלֶךְ בָּבֶל
  choice: ich werde das Joch des Königs von Babel zerbrechen
  rationale: Folgt der Bildsprache und der starken Bedeutung von שׁבר, ohne sie zu einer abstrakten Aussage über Herrschaft abzuflachen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. „Jahwe“ bewahrt diesen als Namen und vermeidet die Ersetzung durch einen Titel.
- issue: Status der Aussage als Rede Hananjas
  choice: keine erläuternde Qualifizierung im Vers
  alternative: Kennzeichnung als falsche Prophetie
  rationale: Der Vers gibt Hananjas behaupteten Gottesspruch wieder; obgleich der weitere Kontext ihn widerlegt, fügt der hebräische Vers hier keine ausdrückliche Bewertung ein. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Bildsprache des Hebräischen. „Babel“ folgt der traditionellen deutschen biblischen Ortsbezeichnung. Die Voranstellung der beiden Objekte wird beibehalten, bleibt aber durch die verbale Klammer gut verständlich.
