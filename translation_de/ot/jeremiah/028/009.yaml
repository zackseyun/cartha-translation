source:
  edition: WLC
  text: הַ/נָּבִ֕יא אֲשֶׁ֥ר יִנָּבֵ֖א לְ/שָׁל֑וֹם בְּ/בֹא֙ דְּבַ֣ר הַ/נָּבִ֗יא יִוָּדַע֙ הַ/נָּבִ֔יא אֲשֶׁר שְׁלָח֥/וֹ יְהוָ֖ה בֶּ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/009.yaml
  text: As for the prophet who prophesies peace[a], when the word of that prophet comes to pass[c][b], then that prophet will be known as one whom Yahweh has truly sent.
translation:
  language: de
  text: 'Der Prophet aber, der Frieden prophezeit[a]: Wenn das Wort dieses Propheten eintrifft[b], wird dieser Prophet als einer erkannt werden, den Yahweh wahrhaftig gesandt hat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wohlergehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wenn das Wort des Propheten kommt“; gemeint ist, dass seine Botschaft eintrifft beziehungsweise sich erfüllt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „den Yahweh in Wahrheit gesandt hat“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּבִיא אֲשֶׁר יִנָּבֵא
  choice: ein Prophet … ankündigt
  rationale: Obwohl das Hebräische den bestimmten Artikel verwendet, bezeichnet die Formulierung hier den betreffenden Typus von Prophet. „Ankündigt“ gibt das prophetische Reden in diesem Kontext natürlich wieder, ohne es auf bloße Vorhersage zu verengen.
- source_word: לְשָׁלוֹם
  choice: Frieden
  rationale: שָׁלוֹם bezeichnet Frieden und kann darüber hinaus Wohlergehen oder Heil umfassen. „Frieden“ passt in den Gegensatz des Kontexts und bewahrt den traditionellen Kernbegriff.
- source_word: בְּבֹא דְּבַר הַנָּבִיא
  choice: sobald das Wort dieses Propheten eintrifft
  rationale: Wörtlich ist vom „Kommen“ des prophetischen Wortes die Rede; idiomatisch bezeichnet dies sein Eintreffen beziehungsweise seine Erfüllung. „Eintrifft“ hält das Bild des Kommens fest und bleibt verständlich.
- source_word: יִוָּדַע
  choice: wird man … erkennen
  rationale: Das Niphal drückt aus, dass die Echtheit des Propheten erkennbar wird. Die unpersönliche deutsche Formulierung gibt den passiven Sinn natürlich wieder.
- source_word: שְׁלָחוֹ יְהוָה
  choice: dass Yahweh ihn … gesandt hat
  rationale: Der Objektsuffix verweist auf den Propheten. Der Gottesname יהוה wird als „Yahweh“ wiedergegeben.
- source_word: בֶּאֱמֶת
  choice: wirklich
  rationale: Das Adverb kennzeichnet die Sendung als echt beziehungsweise wahrhaftig. „Wirklich“ ist im modernen Deutsch natürlich und lässt offen, ob בֶּאֱמֶת enger zur Sendung oder zum Gesandtsein gehört.
theological_decisions:
- issue: Kriterium eines wahren Propheten
  choice: Das Eintreffen einer Friedensankündigung lässt erkennen, dass Yahweh den Propheten wirklich gesandt hat.
  alternative: 'Formaler: „Der Prophet, den Yahweh in Wahrheit gesandt hat, wird erkannt werden.“'
  rationale: Die zeitliche Konstruktion verbindet das Eintreffen des prophetischen Wortes mit dem Erkennen der echten göttlichen Sendung. Die Übersetzung macht diesen Zusammenhang verständlich, ohne über den Vers hinaus ein allgemeines Lehrsystem zu formulieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur macht den Bedingungs- und Erkenntniszusammenhang klar, wahrt jedoch mit den Fußnoten die wörtlichere Syntax und die Bedeutungsbreite von שָׁלוֹם und בֶּאֱמֶת.
