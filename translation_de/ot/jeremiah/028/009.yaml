  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: Ein Friedenswort wird an seinem Eintreffen bzw. seiner Erfüllung geprüft, und daran wird die göttliche Sendung des Propheten erkennbar. „Sobald“ ist jedoch enger als das hebräische בְּבֹא („wenn/bei Eintreten“), weil es ein unmittelbares zeitliches Verhältnis nahelegt. Außerdem bildet eine passive Formulierung mit dem erneut aufgenommenen Propheten יִוָּדַע und die Relativkonstruktion שְׁלָחוֹ יְהוָה näher ab.'
