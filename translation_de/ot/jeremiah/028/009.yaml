  terminology: „Yahweh“ entspricht der vorgegebenen Wiedergabe von יהוה. „Frieden“ bewahrt den zentralen, bewusst weiten Begriff שָׁלוֹם; die Fußnote nennt „Wohlergehen“ als weniger missverständliche weiterführende Alternative. „Wahrhaftig“ gibt בֶּאֱמֶת in angemessenem Register wieder, ohne die syntaktische Zuordnung übermäßig festzulegen.
