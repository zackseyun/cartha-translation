revisions:
- from: Wenn aber ein Prophet Frieden[a] ankündigt, wird man, sobald das Wort dieses Propheten eintrifft[b], erkennen, dass Yahweh ihn wirklich gesandt hat.[c]
  to: 'Der Prophet aber, der Frieden prophezeit[a]: Wenn das Wort dieses Propheten eintrifft[b], wird dieser Prophet als einer erkannt werden, den Yahweh wahrhaftig gesandt hat.[c]'
  rationale: Die Revision ersetzt die zu spezifische Zeitangabe „sobald“ durch „wenn“, stellt die passive Erkenntnisaussage und die erneute Nennung des Propheten näher zum hebräischen Satzbau her und präzisiert die Fußnotenalternative zu שָׁלוֹם. Die Aussage bleibt ohne zusätzliche theologische Folgerung auf die Erkennbarkeit der echten Sendung anhand des eintreffenden Friedenswortes beschränkt.
