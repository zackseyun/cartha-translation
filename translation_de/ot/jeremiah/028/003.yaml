source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁנָתַ֣יִם יָמִ֗ים אֲנִ֤י מֵשִׁיב֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה אֶֽת כָּל כְּלֵ֖י בֵּ֣ית יְהוָ֑ה אֲשֶׁ֨ר לָקַ֜ח נְבוּכַדנֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה וַ/יְבִיאֵ֖/ם בָּבֶֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/003.yaml
  text: Within two years[a], I will bring back to this place all the vessels of the house of Yahweh[d][c][b], which Nebuchadnezzar king of Babylon took from this place and brought to Babylon.
translation:
  language: de
  text: Innerhalb von zwei Jahren[a] werde ich alle Geräte des Hauses Jahwes an diesen Ort zurückbringen, die Nebukadnezar, der König von Babylon, von diesem Ort genommen und nach Babylon gebracht hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „noch zwei Jahre an Tagen“; eine hebräische Zeitformel mit der Bedeutung: innerhalb von zwei Jahren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: Innerhalb von zwei Jahren
  rationale: Die Zeitangabe bezeichnet den noch verbleibenden Zeitraum; שְׁנָתַיִם יָמִים ist eine hebräische Zeitformel für zwei Jahre. Die deutsche Wiedergabe ist natürlich und bewahrt den angekündigten zeitlichen Rahmen.
- source_word: מֵשִׁיב
  choice: bringe ich ... zurück
  rationale: Das Hifil von שוב bezeichnet hier die konkrete Rückführung der Tempelgeräte. Das Partizip hat in der prophetischen Aussage futurischen Sinn; das deutsche Präsens kann diese fest angekündigte Zukunft natürlich ausdrücken.
- source_word: כָּל כְּלֵי בֵּית יְהוָה
  choice: alle Geräte aus dem Haus Jahwes
  rationale: כְּלִים ist ein Sammelbegriff für Geräte, Gefäße und andere Gegenstände. „Geräte“ ist im Deutschen weit genug und passt zum Tempelkontext; „aus dem Haus“ macht natürlich deutlich, woher die Geräte stammen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Text enthält den Gottesnamen; „Jahwe“ gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: נְבוּכַדנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, der König von Babylon
  rationale: „Nebukadnezar“ ist die geläufige deutsche Namensform. Die Apposition wird im Deutschen mit Artikel wiedergegeben.
- source_word: וַיְבִיאֵם בָּבֶל
  choice: und nach Babylon gebracht hat
  rationale: Das hebräische Objektpronomen bezieht sich ausdrücklich auf die Geräte; im deutschen Relativsatz ist dieser Bezug bereits durch „die“ ausgedrückt. „Nach Babylon“ gibt das Ziel idiomatisch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Da der Ausgangstext den persönlichen Gottesnamen verwendet, bleibt dieser als Name sichtbar. Die deutsche Form „Jahwe“ ist verständlich und vermeidet die Ersetzung durch einen bloßen Titel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „diesem Ort“ bleibt erhalten, weil sie der räumlichen Gegenüberstellung des hebräischen Textes entspricht. „Haus Jahwes“ bewahrt das hebräische Bild, während „Geräte“ den breiten Sinn von כְּלִים verständlich wiedergibt.
