revisions:
- from: Innerhalb von zwei Jahren[a] bringe ich alle Geräte aus dem Haus Jahwes an diesen Ort zurück, die Nebukadnezar, der König von Babylon, von diesem Ort weggenommen und nach Babylon gebracht hat.
  to: Innerhalb von zwei Jahren[a] werde ich alle Geräte des Hauses Jahwes an diesen Ort zurückbringen, die Nebukadnezar, der König von Babylon, von diesem Ort genommen und nach Babylon gebracht hat.
  rationale: Die Revision bewahrt die Zugehörigkeit der Geräte zum Haus Jahwes, vermeidet eine über den Wortlaut hinausgehende Intensivierung von לקח und macht die zukunftsbezogene Ankündigung im Deutschen explizit. Die räumliche Wiederholung „an/von diesem Ort“ sowie die ausdrückliche Bezugnahme auf die nach Babylon gebrachten Geräte bleiben erhalten.
