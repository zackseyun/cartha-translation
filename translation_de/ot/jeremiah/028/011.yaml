source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲנַנְיָה֩ לְ/עֵינֵ֨י כָל הָ/עָ֜ם לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ כָּ֣כָה אֶשְׁבֹּ֞ר אֶת עֹ֣ל נְבֻֽכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֗ל בְּ/עוֹד֙ שְׁנָתַ֣יִם יָמִ֔ים מֵ/עַ֕ל צַוַּ֖אר כָּל הַ/גּוֹיִ֑ם וַ/יֵּ֛לֶךְ יִרְמְיָ֥ה הַ/נָּבִ֖יא לְ/דַרְכּֽ/וֹ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/011.yaml
  text: 'And Hananiah said in the sight of all the people[a], saying[b], “Thus says Yahweh: In this way I will break the yoke of Nebuchadnezzar king of Babylon from upon the neck of all the nations within two years.” Then Jeremiah the prophet went on his way.'
translation:
  language: de
  text: 'Hananja sagte vor den Augen des ganzen Volkes[a]: »So spricht Jahwe: Auf diese Weise[b] werde ich innerhalb von zwei Jahren das Joch Nebukadnezars, des Königs von Babylon, vom Nacken aller Völker brechen.« Dann ging der Prophet Jeremia seines Weges.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vor dem ganzen Volk“.'
    reason: lexical_alternative
  - marker: b
    text: „Auf diese Weise“ verweist wahrscheinlich auf Hananjas Zeichenhandlung, bei der er das Joch zerbrach.
    reason: cultural_note
lexical_decisions:
- source_word: לְעֵינֵי
  choice: vor den Augen
  rationale: Bewahrt das hebräische Bild der Augen und bezeichnet zugleich natürlich verständlich das öffentliche Reden in Gegenwart des ganzen Volkes.
- source_word: כֹּה ... כָּכָה
  choice: So ... Genauso
  rationale: „So spricht“ gibt die prophetische Botenformel wieder; „Genauso“ unterscheidet das zweite deiktische Wort davon und verweist wahrscheinlich auf Hananjas unmittelbar vorausgehende Zeichenhandlung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Hebräischen ausdrücklich stehenden Gottesnamen in der im Deutschen üblichen Form wieder.
- source_word: אֶשְׁבֹּר
  choice: werde ich ... brechen
  rationale: Das Imperfekt bezeichnet in dieser prophetischen Ankündigung eine zukünftige Handlung; „brechen“ erhält das konkrete Bild des zerbrochenen Jochs.
- source_word: עֹל
  choice: Joch
  rationale: Entspricht dem konkreten Gegenstand und zugleich dem im Kontext gemeinten Bild politischer Unterwerfung.
- source_word: בְּעוֹד שְׁנָתַיִם יָמִים
  choice: innerhalb von zwei Jahren
  rationale: Die hebräische Zeitangabe bezeichnet den Zeitraum, bis zu dessen Ablauf das angekündigte Geschehen eintreten soll.
- source_word: מֵעַל צַוַּאר
  choice: vom Nacken
  rationale: Bewahrt das anschauliche Bild eines Jochs, das auf dem Nacken liegt, in natürlichem Deutsch.
- source_word: כָּל הַגּוֹיִם
  choice: aller Völker
  rationale: Bezeichnet hier die unter babylonischer Herrschaft stehenden Völker und vermeidet eine spätere religiöse Engführung auf „Heiden“.
- source_word: וַיֵּלֶךְ ... לְדַרְכּוֹ
  choice: Dann ging ... seines Weges
  rationale: Gibt die idiomatische Aussage über Jeremias Fortgehen knapp, würdevoll und im Deutschen natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Status von Hananjas Gotteswort
  choice: Die Aussage wird als Zitat Hananjas wiedergegeben, ohne ihre Wahrheit redaktionell zu bestätigen.
  alternative: Die Aussage durch eine erklärende Einfügung ausdrücklich als falsche Prophetie kennzeichnen.
  rationale: Der Vers berichtet zunächst nur, was Hananja öffentlich sagte. Die Beurteilung seiner Botschaft ergibt sich aus dem weiteren Kontext und soll nicht in diesen Satz hineingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel bleibt prägnant; das öffentliche Setting und die anschauliche Jochmetapher werden bewahrt. Das im Hebräischen formelhafte לֵאמֹר wird nicht zusätzlich mit „indem er sprach“ wiederholt, da der folgende Doppelpunkt seine Funktion im Deutschen natürlich erfüllt.
