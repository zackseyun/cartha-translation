  text: Doch hör bitte dieses Wort an, das ich in deinem Beisein und im Beisein des ganzen Volkes sage:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in deinen Ohren und in den Ohren des ganzen Volkes“; eine hebräische Wendung für Rede in jemandes Beisein bzw. Hörweite.'
