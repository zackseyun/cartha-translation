  terminology: „Wort“ bewahrt den prophetischen Sprachcharakter von דָּבָר. „Das ganze Volk“ entspricht כָּל הָעָם. Die Formulierung „in deinem Beisein und im Beisein des ganzen Volkes“ vermittelt die hebräische Hörformel idiomatisch und erhält die öffentliche Ausrichtung.
