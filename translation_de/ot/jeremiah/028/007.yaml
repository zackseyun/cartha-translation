lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel setzt nach der grundsätzlichen Zustimmung in Vers 6 einen einschränkenden Kontrast; „Doch“ gibt diesen Übergang natürlich wieder.
- source_word: שְׁמַע נָא
  choice: hör bitte
  rationale: Der Imperativ fordert zum Hören auf, während נָא die Aufforderung höflich und zugleich dringlich gestaltet.
- source_word: הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: דָּבָר kann „Wort“, „Sache“ oder „Botschaft“ bedeuten; hier bewahrt „Wort“ den Bezug auf Jeremias unmittelbar folgende Rede.
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר
  choice: das ich … ausspreche
  rationale: Das Partizip bezeichnet das gegenwärtige Reden. „Ausspreche“ passt idiomatisch zur Wendung „vor den Ohren“ und bezeichnet den unmittelbar vollzogenen Sprechakt.
- source_word: בְּאָזְנֶיךָ וּבְאָזְנֵי כָּל הָעָם
  choice: vor deinen Ohren und vor den Ohren des ganzen Volkes
  rationale: Die konkrete hebräische Wendung wird bewusst erhalten; im Deutschen bezeichnet „vor jemandes Ohren“ verständlich eine öffentlich hörbare Aussage und bewahrt die Wiederholung.
