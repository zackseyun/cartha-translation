id: JER.28.14
reference: Jeremiah 28:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֹֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עֹ֣ל בַּרְזֶ֡ל נָתַ֜תִּי עַל צַוַּ֣אר כָּל הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה לַ/עֲבֹ֛ד אֶת נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וַ/עֲבָדֻ֑/הוּ וְ/גַ֛ם אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה נָתַ֥תִּי לֽ/וֹ־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/014.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: I have put an iron yoke on the necks of all these nations, to serve Nebuchadnezzar king of Babylon, and they shall serve him[b]. I have also given him the beasts of the field.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen, der Gott Israels: Ein eisernes Joch habe ich auf den Nacken all dieser Völker gelegt, damit sie Nebukadnezar, dem König von Babel, dienen; und sie werden ihm dienen. Auch die Tiere des Feldes habe ich ihm gegeben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt den etablierten, nicht unnötig eingeengten Sinn des göttlichen Titels.
- source_word: עֹל בַּרְזֶל
  choice: ein eisernes Joch
  rationale: Die natürliche deutsche Wortfügung bewahrt das Bild einer harten, nicht zu brechenden Unterwerfung im Zusammenhang mit dem zuvor zerbrochenen hölzernen Joch.
- source_word: נָתַתִּי עַל צַוַּאר
  choice: habe ich auf den Nacken … gelegt
  rationale: נתן bedeutet hier idiomatisch „legen“; der kollektive Singular „Nacken“ wird entsprechend dem Hebräischen beibehalten.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: all dieser Völker
  rationale: „Völker“ ist im Deutschen für die hier gemeinten politischen Gemeinschaften natürlich und präzise.
- source_word: לַעֲבֹד ... וַעֲבָדֻהוּ
  choice: damit sie … dienen; und sie werden ihm dienen
  rationale: Die Wiederholung von עבד bleibt erhalten. Der Infinitiv bezeichnet den Zweck bzw. das Ziel der auferlegten Herrschaft, während das folgende Verb deren sichere künftige Verwirklichung aussagt.
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, dem König von Babel
  rationale: „Nebukadnezar“ und „Babel“ entsprechen dem geläufigen deutschen Bibelgebrauch; der Dativ folgt aus „dienen“.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die Tiere des Feldes
  rationale: Die Formulierung bewahrt die hebräische Wendung, ohne sie auf ausschließlich wilde Tiere zu verengen.
theological_decisions:
- issue: Göttliche Souveränität über die Völker und die Tierwelt
  choice: Gottes Handeln wird ausdrücklich als Auferlegung des Jochs und als Übergabe der Tiere an Nebukadnezar wiedergegeben.
  alternative: Eine abgeschwächte politische Formulierung, die Gottes Verfügung über Babylons Herrschaft weniger deutlich macht.
  rationale: Das zweimalige נתן stellt die babylonische Vorherrschaft als von Gott verfügtes Geschehen dar; die Übersetzung gibt dies ohne zusätzliche Deutung wieder.
- issue: Zeitlicher Aussagewert der Verben
  choice: „habe ich … gelegt“, „sie werden … dienen“, „habe ich … gegeben“
  alternative: 'Durchgehend einfache Vergangenheit: „legte ich“, „sie dienten“, „gab ich“'
  rationale: Die Perfektformen bezeichnen hier Gottes feststehende Verfügung mit fortdauernder beziehungsweise zukünftiger Wirkung. Die deutschen Zeitformen bilden diesen Zusammenhang natürlich ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem prophetischen Ausspruch eng, bleibt aber gut verständlich. Die hebräische kollektive Einzahl „Nacken“ und die Wiederholung von „dienen“ wurden bewusst bewahrt.
