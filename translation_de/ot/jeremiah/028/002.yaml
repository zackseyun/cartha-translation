source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר שָׁבַ֞רְתִּי אֶת עֹ֖ל מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/002.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: I have broken the yoke of the king of Babylon.'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr der Heerscharen[a], der Gott Israels: Ich habe das Joch des Königs von Babel zerbrochen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jahwe, der Herr der Heere«. Der hebräische Titel bezeichnet Jahwe als den Herrn über die Mächte, die unter seinem Befehl stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste Botenformel wird im Deutschen idiomatisch und würdevoll im Präsens wiedergegeben; sie kennzeichnet eine autoritative prophetische Verkündigung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Herr der Heerscharen
  rationale: Die traditionelle deutsche Titelbildung ist verständlich und bewahrt die umfassende Vorstellung der unter Gottes Befehl stehenden Mächte; die Alternative „der Heere“ wird in der Fußnote genannt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Genitivverbindung wird direkt und natürlich wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv dient der Einführung direkter Rede; ein Doppelpunkt erfüllt diese Funktion im modernen Deutsch ohne unnötiges „indem er spricht“.
- source_word: שָׁבַרְתִּי
  choice: Ich habe ... zerbrochen
  rationale: Das Perfekt stellt die Handlung als vollzogen dar; das deutsche Perfekt gibt die behauptete Vollendung mit gegenwärtiger Relevanz natürlich wieder.
- source_word: עֹל
  choice: Joch
  rationale: Das konkrete Bild bezeichnet hier politische Unterwerfung und wird im Deutschen als etablierte Metapher bewahrt.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babel
  rationale: Die Konstruktion wird transparent wiedergegeben; „Babel“ entspricht der geläufigen biblischen Form des hebräischen Ortsnamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch den traditionellen Ersatztitel zu verdecken.
- issue: Umfang von צְבָאוֹת im Gottestitel
  choice: Herr der Heerscharen
  alternative: Herr der Heere
  rationale: „Heerscharen“ lässt offen, ob himmlische oder irdische Streitkräfte beziehungsweise die Gesamtheit der Mächte gemeint sind, und vermeidet eine unnötige Verengung auf menschliche Armeen.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener prophetischer Botenformel. „Heerscharen“ ist bewusst leicht gehoben, da es sich um einen festen Gottestitel handelt; die Fußnote bietet eine unmittelbarere Alternative.
