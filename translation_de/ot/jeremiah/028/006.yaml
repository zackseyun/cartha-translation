revisions:
- from: 'Da sagte der Prophet Jeremia: »Amen! So möge es Jahwe tun! Möge Jahwe deine Worte, die du prophetisch verkündet hast, wahr werden lassen[a] und die Geräte des Hauses Jahwes sowie alle Verschleppten aus Babylon an diesen Ort zurückbringen.«'
  to: 'Da sagte der Prophet Jeremia: »Amen! Möge Jahwe es so tun! Möge Jahwe deine Worte erfüllen[a], die du prophezeit hast: dass er die Geräte des Hauses Jahwes sowie alle Verschleppten aus Babylon an diesen Ort zurückbringt.«'
  rationale: Die Revision verbessert die deutsche Idiomatik und stellt klar, dass die Rückführung von Tempelgeräten und Verschleppten den Inhalt von Hananjas Prophezeiung bildet. Die volitive Spannung von Jeremias Antwort bleibt erhalten; sie wird nicht als Anerkennung der Prophezeiung aufgelöst.
