source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִרְמְיָ֣ה הַ/נָּבִ֔יא אָמֵ֕ן כֵּ֖ן יַעֲשֶׂ֣ה יְהוָ֑ה יָקֵ֤ם יְהוָה֙ אֶת דְּבָרֶ֔י/ךָ אֲשֶׁ֣ר נִבֵּ֗אתָ לְ/הָשִׁ֞יב כְּלֵ֤י בֵית יְהוָה֙ וְ/כָל הַ/גּוֹלָ֔ה מִ/בָּבֶ֖ל אֶל הַ/מָּק֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/006.yaml
  text: Then Jeremiah the prophet said[a], “Amen! May Yahweh do so; may Yahweh fulfill your words that you have prophesied, to bring back the vessels of the house of Yahweh and all the exiles from Babylon to this place.”
translation:
  language: de
  text: 'Da sagte der Prophet Jeremia: »Amen! Möge Jahwe es so tun! Möge Jahwe deine Worte erfüllen[a], die du prophezeit hast: dass er die Geräte des Hauses Jahwes sowie alle Verschleppten aus Babylon an diesen Ort zurückbringt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »deine Worte aufrichten«. Das hebräische Verb kann hier auch »bestätigen«, »in Kraft setzen« oder »in Erfüllung gehen lassen« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֵן
  choice: Amen
  rationale: Die im Deutschen vertraute Form bewahrt sowohl den hebräischen Klang als auch die zustimmende und zugleich wünschende Gebetsformel.
- source_word: כֵן יַעֲשֶׂה יְהוָה
  choice: So möge es Jahwe tun
  rationale: 'Die Imperfektform hat nach »Amen« am wahrscheinlichsten volitiven Sinn: Jeremia äußert einen Wunsch, keine sichere Vorhersage.'
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יָקֵם
  choice: wahr werden lassen
  rationale: Das Hifil von קום bezeichnet hier, dass die angekündigten Worte Bestand gewinnen beziehungsweise eintreffen. Die Formulierung ist im heutigen Deutsch natürlich und wahrt den Bezug auf prophetische Worte.
- source_word: דְּבָרֶיךָ אֲשֶׁר נִבֵּאתָ
  choice: deine Worte, die du prophetisch verkündet hast
  rationale: »Worte« bildet den hebräischen Plural konkret ab; »prophetisch verkündet« gibt das Verb נבא verständlich wieder, ohne Jeremias Aussage als Bestätigung ihrer Wahrheit erscheinen zu lassen.
- source_word: לְהָשִׁיב
  choice: zurückbringen
  rationale: Das kausative Verb bezieht sich sowohl auf die Tempelgeräte als auch auf die Verschleppten und bezeichnet ihre Rückführung.
- source_word: כְּלֵי בֵית יְהוָה
  choice: die Geräte des Hauses Jahwes
  rationale: »Geräte« bezeichnet die kultischen Gegenstände angemessen; »Haus Jahwes« bewahrt die hebräische Bezeichnung des Tempels.
- source_word: כָל הַגּוֹלָה
  choice: alle Verschleppten
  rationale: Das singularische Kollektivum bezeichnet die Gesamtheit der deportierten Menschen. Der deutsche Plural gibt dies klar und natürlich wieder.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: an diesen Ort
  rationale: Die deiktische Formulierung bleibt erhalten, ohne den im Zusammenhang erkennbaren Ort ausdrücklich als Jerusalem oder Tempel zu präzisieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Wiedergabe als »Jahwe« erhält den Charakter eines Eigennamens.
- issue: Aussagekraft von Jeremias Antwort
  choice: 'Wunsch beziehungsweise Gebet: »möge«'
  alternative: 'Zukunftsaussage: »wird«'
  rationale: '»Amen« in Verbindung mit den nachfolgenden Imperfektformen legt einen volitiven Sinn nahe. So bleibt die erzählerische Spannung bestehen: Jeremia wünscht, dass die günstige Weissagung eintrifft, erklärt sie aber nicht schon für zuverlässig.'
- issue: Jeremias Haltung gegenüber Hananja
  choice: Keine ausdrückliche Bestätigung von Hananjas prophetischer Autorität
  alternative: Die Formulierung als Anerkennung einer wahren Prophezeiung verstehen
  rationale: Der Satz äußert den Wunsch nach Erfüllung der angekündigten Rückkehr. Er lässt offen, ob Jeremia Hananjas Botschaft für wahr hält, und nimmt die anschließende Prüfung prophetischer Worte nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wunschform »möge« erhält den Gebetscharakter und die Spannung des Kontextes. »Haus Jahwes« bewahrt das biblische Bild für den Tempel; »Verschleppte« ist für heutige Leser konkreter als das abstrakte »Exil«.
