source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑ה אַ֠חֲרֵי שְׁב֞וֹר חֲנַנְיָ֤ה הַ/נָּבִיא֙ אֶת הַ/מּוֹטָ֔ה מֵ/עַ֗ל צַוַּ֛אר יִרְמְיָ֥ה הַ/נָּבִ֖יא לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/012.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after Hananiah the prophet had broken the yoke from off the neck of Jeremiah the prophet, saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Jeremia, nachdem der Prophet Hananja das Joch[a] vom Hals des Propheten Jeremia zerbrochen hatte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: den Jochbalken, also das hölzerne Querstück des Jochs.'
    reason: Das hebräische מוֹטָה kann das Joch als Ganzes, insbesondere aber dessen Stange oder hölzernes Querstück bezeichnen.
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה
  choice: Da erging das Wort Jahwes
  rationale: Die geläufige prophetische Formel wird in natürlichem, würdigem Deutsch wiedergegeben. „Da“ führt das nächste Ereignis der Erzählung ein; „Wort“ bewahrt den Offenbarungscharakter des hebräischen Ausdrucks.
- source_word: אַחֲרֵי שְׁבוֹר
  choice: nachdem … zerbrochen hatte
  rationale: Die Konstruktion bezeichnet eine bereits abgeschlossene Handlung, die dem Ergehen des Gotteswortes vorausging; das Plusquamperfekt macht diese zeitliche Abfolge deutlich.
- source_word: חֲנַנְיָה הַנָּבִיא
  choice: der Prophet Hananja
  rationale: Die deutsche Wortstellung ist idiomatisch und gibt den appositionellen Titel ohne zusätzliche Deutung wieder.
- source_word: הַמּוֹטָה
  choice: das Joch
  rationale: Im Zusammenhang bezeichnet das Wort den hölzernen Jochbalken, den Jeremia als prophetisches Zeichen trug. „Joch“ ist die verständlichste Wiedergabe; die mögliche genauere Bedeutung wird in der Fußnote genannt.
- source_word: מֵעַל צַוַּאר
  choice: vom Hals
  rationale: Die Formulierung gibt die Entfernung des Gegenstands von Jeremias Hals knapp und natürlich wieder.
- source_word: יִרְמְיָה הַנָּבִיא
  choice: des Propheten Jeremia
  rationale: Die Wiederholung des Prophetentitels wird entsprechend dem Hebräischen beibehalten und unterstreicht die Konfrontation der beiden Propheten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im modernen Deutschen natürlich die in Vers 13 folgende direkte Gottesrede ein und erfüllt damit die Funktion des hebräischen Redeeinleiters.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen. „Jahwe“ ist die im Deutschen etablierte Umschrift und bewahrt den Namen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Erzählton. Die Wiederholung von „Prophet“ folgt bewusst dem hebräischen Text; der abschließende Doppelpunkt stellt die Verbindung zur Gottesrede des nächsten Verses her.
