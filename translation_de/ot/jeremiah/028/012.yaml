  source_fidelity: Die Übersetzung gibt die Erzählfolge von וַיְהִי und אַחֲרֵי sowie die vorzeitige Handlung durch das Plusquamperfekt korrekt wieder. Sie bewahrt die Wiederholung von „Prophet“ und gibt לֵאמֹר durch den anschließenden Doppelpunkt angemessen als Überleitung zur folgenden Rede wieder. „Vom Hals“ ist im Deutschen eine natürliche und hinreichend genaue Wiedergabe von מֵעַל צַוַּאר.
