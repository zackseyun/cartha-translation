  terminology: „Jahwe“ ist eine etablierte deutsche Wiedergabe des Tetragramms. „Joch“ ist im Kontext verständlich; die Fußnote sichert zutreffend die engere mögliche Bedeutung von מוֹטָה als Jochbalken bzw. hölzernes Querstück ab. Die Namensformen Jeremia und Hananja sind standardsprachlich und konsistent.
