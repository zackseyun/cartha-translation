source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מְשַֽׁלֵּֽחֲ/ךָ֔ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה הַ/שָּׁנָה֙ אַתָּ֣ה מֵ֔ת כִּֽי סָרָ֥ה דִבַּ֖רְתָּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/016.yaml
  text: 'Therefore[a], this is what Yahweh says: Look, I am sending you away from the face of the earth. This year you will die[b], because you have spoken rebellion against Yahweh.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: Sieh, ich schicke dich vom Angesicht des Erdbodens hinweg.[a] Noch in diesem Jahr wirst du sterben, denn was du gegen Jahwe geredet hast, war Auflehnung.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hebräische Wendung lautet wörtlich etwa „von über dem Angesicht des Erdbodens“. Sie bezeichnet hier die Entfernung aus dem Kreis der Lebenden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Abfall“ beziehungsweise „Trotz gegen Jahwe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gerichtswort und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: הִנְנִי
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden und nachdrücklichen Charakter der hebräischen Wendung in gegenwärtigem Deutsch wieder.
- source_word: מְשַׁלֵּחֲךָ
  choice: ich schicke dich … hinweg
  rationale: Bewahrt das Bild des Sendens beziehungsweise Fortschickens, ohne die Todesstrafe bereits in diesem Verb auszudeuten.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: vom Angesicht des Erdbodens hinweg
  rationale: Erhält das hebräische Bild möglichst deutlich; der folgende Satz erklärt, dass damit die Entfernung aus dem Leben gemeint ist.
- source_word: הַשָּׁנָה אַתָּה מֵת
  choice: Noch in diesem Jahr wirst du sterben
  rationale: Gibt die zeitliche Bestimmung und den in diesem Zusammenhang eindeutig vorausweisenden Sinn der Nominalkonstruktion idiomatisch wieder.
- source_word: סָרָה דִבַּרְתָּ אֶל יְהוָה
  choice: was du gegen Jahwe geredet hast, war Auflehnung
  rationale: Formuliert die schwierige hebräische Verbindung natürlich, bewahrt aber sowohl das Reden als auch dessen Charakter als Rebellion gegen Jahwe. „Auflehnung“ vermeidet die stärker dogmatisch geprägte Engführung von „Abfall“.
theological_decisions:
- issue: Bedeutung der Entfernung vom Angesicht des Erdbodens
  choice: Ankündigung des Todes
  alternative: Vertreibung oder Verbannung aus dem Land
  rationale: Der unmittelbar folgende Satz „Noch in diesem Jahr wirst du sterben“ bestimmt die bildhafte Entfernung als Todesurteil, nicht bloß als Ortswechsel.
- issue: Bedeutung von סָרָה
  choice: Auflehnung gegen Jahwe
  alternative: Abfall von Jahwe oder trotzige Rede gegen Jahwe
  rationale: Der Ausdruck bezeichnet eine rebellische Abweichung von der rechtmäßigen göttlichen Autorität. „Auflehnung“ hält diese Spannung fest, ohne einen späteren technischen Begriff von Apostasie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle prophetische Formel „so spricht Jahwe“ bleibt erhalten; ansonsten werden unnötig altertümliche Formen vermieden. Das Bild vom Angesicht des Erdbodens wird im Haupttext bewahrt und in der Fußnote erläutert.
