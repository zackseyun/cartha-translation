id: JER.28.1
reference: Jeremiah 28:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/שָּׁנָ֣ה הַ/הִ֗יא בְּ/רֵאשִׁית֙ מַמְלֶ֨כֶת֙ צִדְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֔ה ב/שנת הָֽ/רְבִעִ֔ית בַּ/חֹ֖דֶשׁ הַ/חֲמִישִׁ֑י אָמַ֣ר אֵלַ֡/י חֲנַנְיָה֩ בֶן עַזּ֨וּר הַ/נָּבִ֜יא אֲשֶׁ֤ר מִ/גִּבְעוֹן֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/עֵינֵ֧י הַ/כֹּהֲנִ֛ים וְ/כָל הָ/עָ֖ם לֵ/אמֹֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/028/001.yaml
  text: And it happened in that year[a], at the beginning of the reign of Zedekiah king of Judah, in the fourth year, in the fifth month, that Hananiah son of Azzur, the prophet from Gibeon, spoke to me in the house of Yahweh, in the sight of the priests and all the people, saying[b],
translation:
  language: de
  text: 'Und es geschah in jenem Jahr, zu Beginn der Herrschaft Zedekias, des Königs von Juda, im vierten Jahr[a], im fünften Monat: Hananja, der Sohn Asurs, der Prophet aus Gibeon, sagte im Haus Jahwes in Gegenwart der Priester und des ganzen Volkes[b] zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt sowohl den „Beginn der Herrschaft Zedekias“ als auch das „vierte Jahr“. Beide Angaben werden ohne Angleichung wiedergegeben.
    reason: preserved_ambiguity
  - marker: b
    text: 'Wörtlich: „vor den Augen der Priester und des ganzen Volkes“; gemeint ist öffentlich beziehungsweise in ihrer Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die geläufige, würdige Erzählformel gibt den hebräischen Episodenbeginn wieder, ohne unnötig altertümlich zu wirken.
- source_word: בַּשָּׁנָה הַהִיא
  choice: in jenem Jahr
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Zeitangabe.
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: zu Beginn der Herrschaft
  rationale: מַמְלֶכֶת bezeichnet hier Zedekias Regierungszeit beziehungsweise Herrschaft, nicht ein abstraktes Königreich.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Zedekias, des Königs von Juda
  rationale: Der Genitiv verbindet den Namen natürlich mit „Herrschaft“; die Apposition gibt den Königstitel ausdrücklich wieder.
- source_word: בַּשָּׁנָה הָרְבִעִית
  choice: im vierten Jahr
  rationale: Die chronologische Angabe bleibt ausdrücklich erhalten und wird nicht mit „zu Beginn“ harmonisiert.
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: im fünften Monat
  rationale: Die hebräische Monatszählung wird bewahrt, statt einen modernen Monatsnamen einzusetzen.
- source_word: אָמַר אֵלַי ... לֵאמֹר
  choice: 'sagte ... zu mir:'
  rationale: Der Doppel Ausdruck „sagte ... indem er sprach“ wird im heutigen Deutsch idiomatisch durch ein redeeinleitendes Verb und einen Doppelpunkt wiedergegeben.
- source_word: חֲנַנְיָה בֶן עַזּוּר
  choice: Hananja, der Sohn Asurs
  rationale: Gebräuchliche deutsche Namensformen und klare Wiedergabe des Abstammungsverhältnisses.
- source_word: הַנָּבִיא אֲשֶׁר מִגִּבְעוֹן
  choice: der Prophet aus Gibeon
  rationale: Die bestimmte Bezeichnung und die Herkunftsangabe werden knapp und vollständig wiedergegeben, ohne die spätere Beurteilung seiner Botschaft vorwegzunehmen.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: „Haus“ bewahrt das hebräische Bild; „Jahwe“ gibt den Gottesnamen יְהוָה als Eigennamen wieder.
- source_word: לְעֵינֵי הַכֹּהֲנִים וְכָל־הָעָם
  choice: in Gegenwart der Priester und des ganzen Volkes
  rationale: Die hebräische Wendung bedeutet, dass die Äußerung öffentlich vor den Anwesenden erfolgte; „in Gegenwart“ ist natürliches modernes Deutsch.
theological_decisions:
- issue: Chronologische Spannung zwischen „zu Beginn der Herrschaft Zedekias“ und „im vierten Jahr“
  choice: Beide Angaben unverändert nebeneinander bewahren
  alternative: „Beginn“ weiter fassen oder eine der Angaben ändern, um die Spannung aufzulösen
  rationale: Der masoretische Text enthält beide Zeitangaben. Die Übersetzung darf die erkennbare Spannung weder durch Konjektur noch durch erklärende Paraphrase beseitigen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet das Tetragramm; die deutsche Form „Jahwe“ behandelt es als Gottes Eigennamen.
- issue: Bezeichnung Hananjas als הַנָּבִיא
  choice: der Prophet
  alternative: ein Prophet oder der angebliche Prophet
  rationale: Der bestimmte hebräische Titel wird ohne wertende Ergänzung wiedergegeben. Ob und in welchem Sinn Hananja als Prophet gilt, wird nicht an dieser Stelle vorentschieden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt ersetzt die im Deutschen schwerfällige wörtliche Wiedergabe von לֵאמֹר. Die Satzstellung hält Ort, Öffentlichkeit und Adressat der Rede klar zusammen.
