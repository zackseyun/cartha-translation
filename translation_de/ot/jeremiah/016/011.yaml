  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם עַל֩ אֲשֶׁר עָזְב֨וּ אֲבוֹתֵי/כֶ֤ם אוֹתִ/י֙ נְאֻם יְהוָ֔ה וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יַּעַבְד֖וּ/ם וַ/יִּשְׁתַּחֲו֣וּ לָ/הֶ֑ם וְ/אֹתִ֣/י עָזָ֔בוּ וְ/אֶת תּוֹרָתִ֖/י לֹ֥א שָׁמָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/011.yaml
  text: Then you shall say to them, ‘Because your fathers abandoned me,’ declares the LORD, ‘and went after other gods, and served them, and bowed down to them. But me they abandoned, and my law they did not keep.’
translation:
  language: de
  text: 'Dann sollst du ihnen sagen: »Weil eure Vorfahren mich verlassen haben – Spruch des HERRN –, anderen Göttern nachgelaufen sind, ihnen gedient und sich vor ihnen niedergeworfen haben. Mich aber haben sie verlassen und meine Weisung nicht befolgt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבוֹתֵיכֶם
  choice: eure Vorfahren
  rationale: Das hebräische Wort bezeichnet hier die früheren Generationen; „Vorfahren“ ist im heutigen Deutsch natürlicher und schließt den historischen Bezug klar ein.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die feste prophetische Formel wird idiomatisch wiedergegeben; der Gottesname JHWH erscheint gemäß verbreiteter deutscher Bibelkonvention als „der HERR“.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: und anderen Göttern nachgelaufen sind
  rationale: „Nachlaufen“ bewahrt das Bild des hebräischen Ausdrucks und bezeichnet hier die religiöse Hinwendung zu anderen Göttern.
- source_word: וַיַּעַבְדוּם
  choice: ihnen gedient
  rationale: Das Pronomen bezieht sich auf die anderen Götter; „dienen“ bewahrt den kultischen und loyalitätsbezogenen Sinn.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: sich vor ihnen niedergeworfen
  rationale: Die körperliche Geste kultischer Verehrung wird konkret und source-nah ausgedrückt.
- source_word: תּוֹרָתִי
  choice: meine Weisung
  rationale: תורה bedeutet hier Gottes verbindliche Unterweisung; „Weisung“ ist breiter und kontextgemäßer als ausschließlich „Gesetz“.
- source_word: לֹא שָׁמָרוּ
  choice: haben sie nicht befolgt
  rationale: Im Zusammenhang mit Gottes Weisung bezeichnet שמר deren achtsame Einhaltung; „befolgen“ ist natürliches modernes Deutsch.
theological_decisions:
- issue: Kontrastive Hervorhebung von אֹתִי
  choice: Mich aber haben sie verlassen
  alternative: Und mich haben sie verlassen
  rationale: Die Voranstellung des Objektpronomens wird durch „Mich aber“ bewahrt und macht den Gegensatz zwischen der Verehrung anderer Götter und der Abkehr von JHWH sichtbar, ohne ihn weiter auszudeuten.
- issue: Wiedergabe des Tetragramms יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: „der HERR“ folgt einer etablierten deutschsprachigen Bibelkonvention und kennzeichnet den Eigennamen durch Kapitälchen, ohne eine unsichere Aussprache festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter prophetischer Rede. Die Satzfolge bleibt eng am Hebräischen; der starke Kontrast im letzten Satz wird erhalten. Keine Fußnoten erforderlich.
