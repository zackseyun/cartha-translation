base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
translation:
  language: de
  text: Niemand wird ihnen bei einem Trauerfall Brot brechen[a], um ihn über den Toten zu trösten[c]; und niemand wird ihnen den Becher des Trostes[b] zu trinken geben wegen seines Vaters oder seiner Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen bei einem Trauerfall Speise austeilen“. Das hebräische Verb bedeutet wörtlich „teilen“ oder „brechen“ und bezieht sich hier wahrscheinlich auf eine übliche Trauermahlzeit.'
    reason: lexical_alternative
  - marker: b
    text: Der „Becher des Trostes“ bezeichnet wahrscheinlich ein Getränk, das Trauernden nach einem Todesfall zum Trost gereicht wurde.
    reason: cultural_note
  - marker: c
    text: Im Hebräischen stehen „ihnen“ und später nochmals „ihnen“ im Plural, „ihn“ sowie „seines Vaters“ und „seiner Mutter“ dagegen im maskulinen Singular.
    reason: grammatical_note
lexical_decisions:
- source_word: יִפְרְסוּ
  choice: Brot brechen
  rationale: פרס bedeutet wörtlich „teilen“ oder „brechen“. Da hier kein Gegenstand genannt wird und es um Trauerbräuche geht, ist wahrscheinlich das Teilen einer Trauermahlzeit gemeint. „Brot brechen“ bewahrt das konkrete Bild, ohne die Deutung im Haupttext auszubreiten.
- source_word: עַל אֵבֶל
  choice: während der Trauer
  rationale: עַל bezeichnet hier den Umstand beziehungsweise Anlass. Die Formulierung ist im Deutschen natürlich und hält den Trauerkontext fest.
- source_word: לְנַחֲמוֹ
  choice: um ihn … zu trösten
  rationale: Das Piel von נחם bedeutet „trösten“. Das maskuline Singularsuffix wird trotz der umgebenden Pluralbezüge beibehalten.
- source_word: עַל מֵת
  choice: wegen des Verstorbenen
  rationale: Die Wendung bezeichnet den Todesfall als Anlass des Trostes. „Verstorbener“ ist im modernen Deutschen würdig und bezeichnet hier die gestorbene Person, ohne zusätzliche theologische Deutung.
- source_word: יַשְׁקוּ אוֹתָם
  choice: ihnen … zu trinken geben
  rationale: Der Hiphil von שקה bedeutet „trinken lassen“ beziehungsweise „zu trinken geben“. Die gewählte Formulierung gibt den Kausativ natürlich wieder und bewahrt das plurale Objekt.
- source_word: כּוֹס תַּנְחוּמִים
  choice: Becher des Trostes
  rationale: Die Genitivverbindung wird transparent und bildnah wiedergegeben. Gemeint ist wahrscheinlich ein bei der Trauer gereichtes Getränk.
- source_word: עַל אָבִיו וְעַל אִמּוֹ
  choice: sei es wegen seines Vaters oder seiner Mutter
  rationale: Das wiederholte עַל nennt den jeweiligen Anlass der Trauer. „Sei es … oder“ macht den distributiven Sinn im Deutschen verständlich, während die maskulinen Singularsuffixe erhalten bleiben.
theological_decisions:
- issue: Wechsel zwischen pluralen und singularen Personenbezügen
  choice: Die hebräischen Numeri werden als „ihnen … ihn … ihnen … seines“ beibehalten und durch eine Fußnote erläutert.
  alternative: Alle Bezüge zur stilistischen Angleichung in den Plural setzen.
  rationale: לָהֶם und אוֹתָם sind Plural, לְנַחֲמוֹ, אָבִיו und אִמּוֹ dagegen maskuliner Singular. Eine Angleichung würde eine echte grammatische Spannung des Ausgangstextes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem poetisch-prophetischen Ausgangstext nahe, wird aber durch „sei es … oder“ idiomatisch verdeutlicht. Die auffällige Numerusverschiebung des Hebräischen wird nicht harmonisiert.
