base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
translation:
  language: de
  text: Und zuerst werde ich ihnen ihre Schuld und ihre Sünde doppelt vergelten, weil sie mein Land mit den Leichnamen ihrer abscheulichen Götzen[a] entweiht und mein Erbteil mit ihren Gräueln angefüllt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den Leichnamen ihrer abscheulichen Dinge“. Das hebräische Wort bezeichnet in prophetischen Texten häufig Götzen.'
    reason: lexikalische_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: werde ich ihnen … vergelten
  rationale: Das Piel von שׁלם bezeichnet hier ein vergeltendes Zurückzahlen. „Vergelten“ bewahrt den gerichtlichen Sinn und klingt im Deutschen würdig und natürlich.
- source_word: רִאשׁוֹנָה
  choice: zuerst
  rationale: Das Adverb bezeichnet am ehesten die zeitliche beziehungsweise sachliche Priorität der Vergeltung; „zuerst“ erhält zugleich die Spannung zur später angekündigten Wiederherstellung.
- source_word: מִשְׁנֵה
  choice: doppelt
  rationale: Das Substantiv bezeichnet eine doppelte Menge oder ein Zweifaches. Die adverbiale Wiedergabe fügt sich natürlich in den deutschen Satz ein.
- source_word: עֲוֺנָם וְחַטָּאתָם
  choice: ihre Schuld und ihre Sünde
  rationale: עָוֹן kann sowohl Verfehlung als auch daraus erwachsende Schuld bezeichnen; „Schuld“ wahrt diese Mehrdeutigkeit. „Sünde“ gibt das kollektiv gebrauchte singularische חַטָּאת wieder und erhält die Parallelstruktur.
- source_word: עַל
  choice: weil
  rationale: עַל führt hier den Grund für die Vergeltung ein. „Weil“ gibt diesen kausalen Zusammenhang im modernen Deutsch klar wieder.
- source_word: חַלְּלָם אֶת־אַרְצִי
  choice: sie mein Land … entweiht haben
  rationale: חלל bezeichnet im Piel die kultisch-moralische Profanierung. „Entweihen“ bildet diesen Sinn genauer ab als das allgemeinere „verunreinigen“.
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  choice: mit den Leichnamen ihrer abscheulichen Götzen
  rationale: נִבְלָה bedeutet Leichnam oder Kadaver; שִׁקּוּצִים bezeichnet im prophetischen Kontext häufig verabscheute Götzenbilder. „Leichname“ bewahrt die bewusst herabsetzende Bildsprache gegenüber den Götzen.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  choice: mit ihren Gräueln
  rationale: תּוֹעֵבָה bezeichnet religiös und moralisch Verabscheuungswürdiges. „Gräuel“ ist im Deutschen verständlich und bewahrt die starke Wertung.
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  choice: mein Erbteil … angefüllt haben
  rationale: נַחֲלָה bezeichnet das Land als Gottes eigenen Anteil beziehungsweise Besitz. „Erbteil“ erhält den bundesgeschichtlichen Klang; „angefüllt“ gibt das transitive Verb eindeutig wieder.
theological_decisions:
- issue: Ob שִׁקּוּצֵיהֶם ausdrücklich als Götzen zu identifizieren ist
  choice: Im Haupttext „ihre abscheulichen Götzen“
  alternative: „ihre abscheulichen Dinge“
  rationale: Im prophetischen Sprachgebrauch Jeremias sind mit שִׁקּוּצִים häufig Götzen oder Götzenbilder gemeint. Die ausdrückliche Benennung vermittelt heutigen Lesern den wahrscheinlichen Bezug; die formal offenere Lesart bleibt in der Fußnote erhalten.
- issue: Bedeutung der doppelten Vergeltung
  choice: Die Aussage „doppelt vergelten“ bleibt ohne harmonisierende Erklärung stehen
  alternative: Als bloß vollständige oder angemessene Vergeltung paraphrasieren
  rationale: Der hebräische Text spricht pointiert von מִשְׁנֵה, „doppelt“. Die Übersetzung soll die theologische Spannung dieser Strafankündigung nicht abschwächen oder vorab erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markanten Bilder „Leichname“, „Erbteil“ und „Gräuel“ bleiben erhalten, ohne die syntaktische Verständlichkeit zu beeinträchtigen. Im Haupttext müssen beide Fußnotenmarker erscheinen; Marker [b] steht nach „Götzen“.
