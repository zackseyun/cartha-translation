id: JER.16.14
reference: Jeremiah 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
translation:
  language: de
  text: 'Darum siehe: Es kommen Tage, spricht Jahwe, da wird man nicht mehr sagen: »So wahr Jahwe lebt, der die Söhne Israels[a] aus dem Land Ägypten heraufgeführt[b] hat«,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: „die Israeliten“ oder „das Volk Israel“. Wörtlich steht im Hebräischen „die Söhne Israels“.'
    reason: lexical_alternative
  - marker: b
    text: „Heraufgeführt“ kann hier auch mit „herausgeführt“ wiedergegeben werden; gemeint ist der Auszug aus Ägypten.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang knapp und natürlich.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt den aufmerksamkeitslenkenden Nachdruck der prophetischen Rede; die leicht gehobene Form passt zum würdevollen Register.
- source_word: יָמִים בָּאִים
  choice: Es kommen Tage
  rationale: Gibt die prophetische Zukunftsformel eng am Hebräischen und zugleich idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Eine geläufige deutsche Wiedergabe der feierlichen prophetischen Botenformel.
- source_word: וְלֹא יֵאָמֵר עוֹד
  choice: da wird man nicht mehr sagen
  rationale: Das unpersönliche deutsche „man“ gibt das hebräische Passiv natürlich wieder; „nicht mehr“ entspricht der negierten Verwendung von עוֹד.
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Gibt die feste hebräische Schwurformel in ihrer üblichen deutschen Bedeutung wieder.
- source_word: אֲשֶׁר הֶעֱלָה
  choice: der … heraufgeführt hat
  rationale: Bewahrt die Grundrichtung des Hifil von עלה. Im Exoduszusammenhang ist auch „herausgeführt“ idiomatisch möglich.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  rationale: Bewahrt die ausdrücklich familiale Formulierung des hebräischen Textes; idiomatisch kann die Wendung das gesamte Volk Israel bezeichnen.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: aus dem Land Ägypten
  rationale: Erhält sowohl die Präposition als auch das Substantiv „Land“ der traditionellen Exodusformel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Umfang der Bezeichnung בְּנֵי יִשְׂרָאֵל
  choice: die Söhne Israels
  alternative: die Israeliten / das Volk Israel
  rationale: Die Übersetzung bewahrt die Form des Ausgangstextes, während die Fußnote verdeutlicht, dass die Wendung kollektiv für das Volk gebraucht werden kann.
- issue: Räumliche Nuance von הֶעֱלָה beim Exodus
  choice: heraufgeführt
  alternative: herausgeführt
  rationale: „Heraufgeführt“ wahrt die lexikalische Bildlichkeit von עלה; „herausgeführt“ hebt stärker den Auszug aus Ägypten hervor. Der Text entscheidet diese Nuance nicht dogmatisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem „siehe“. Die Schwurformel wird idiomatisch als „So wahr Jahwe lebt“ wiedergegeben. Das abschließende Komma zeigt, dass der Satz und die zitierte Gegenüberstellung im folgenden Vers weitergehen.
