  text: הֲ/יַעֲשֶׂה לּ֥/וֹ אָדָ֖ם אֱלֹהִ֑ים וְ/הֵ֖מָּה לֹ֥א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
translation:
  language: de
  text: Kann ein Mensch sich Götter machen? Doch sie sind keine Götter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Macht sich ein Mensch Götter? Aber sie sind keine Götter.“'
    reason: 'Lexikalisch und aspektuell mögliche Alternative: Das hebräische Imperfekt in der rhetorischen Frage kann auch mit einfachem Präsens wiedergegeben werden; וְ kann hier mit „aber“ übersetzt werden.'
lexical_decisions:
- source_word: הֲ/יַעֲשֶׂה
  choice: Kann ... machen?
  rationale: Die Fragepartikel הֲ mit dem Imperfekt von עשה bildet eine rhetorische Frage. „Kann ... machen?“ gibt den ungläubig-bestreitenden Ton im heutigen Deutsch natürlich wieder.
- source_word: לּוֹ
  choice: sich
  rationale: 'Die Präposition ל mit Suffix der 3. Person Singular ist hier im Zusammenhang reflexiv zu verstehen: Der Mensch fertigt Götter für sich selbst an.'
- source_word: אָדָם
  choice: ein Mensch
  rationale: אָדָם bezeichnet hier einen einzelnen Menschen in allgemeinem Sinn. „Ein Mensch“ bewahrt den generischen Singular ohne unnötige geschlechtliche Verengung.
- source_word: אֱלֹהִים
  choice: Götter
  rationale: Die Pluralform bezeichnet hier von Menschen hergestellte vermeintliche Gottheiten. „Götter“ erhält den Plural und die polemische Zuspitzung.
- source_word: וְ/הֵמָּה
  choice: Doch sie
  rationale: Die Konjunktion mit dem selbstständigen Pronomen leitet einen betonten Gegensatz ein. „Doch sie“ bringt diesen adversativen Umschwung klar zum Ausdruck.
- source_word: לֹא אֱלֹהִים
  choice: sind keine Götter
  rationale: Die Prädikatsaussage bestreitet den hergestellten Gebilden echten göttlichen Status. „Sind keine Götter“ ist klar, idiomatisch und bewahrt den Plural.
theological_decisions:
- issue: Art der Polemik gegen Götzen
  choice: Der Vers bestreitet, dass von Menschen hergestellte Gottheiten wirklich Götter sind.
  alternative: Der Vers verspottet lediglich die Herstellung von Götzen, ohne eine weitergehende Aussage über ihren göttlichen Status zu treffen.
  rationale: Die Schlusswendung לֹא אֱלֹהִים spricht den menschengemachten Gebilden ausdrücklich den Status als Götter ab. Die Übersetzung erhält diese prophetische Polemik, ohne zusätzliche philosophische Begriffe einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe rhetorische Frage und der betonte Gegensatz des Hebräischen bleiben erhalten; „ein Mensch“ gibt den generischen Singular natürlich wieder.
