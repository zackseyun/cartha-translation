source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה אַל תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְ/אַל תֵּלֵ֣ךְ לִ/סְפּ֔וֹד וְ/אַל תָּנֹ֖ד לָ/הֶ֑ם כִּֽי אָסַ֨פְתִּי אֶת שְׁלוֹמִ֜/י מֵ/אֵ֨ת הָ/עָ֤ם הַ/זֶּה֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֖סֶד וְ/אֶת הָֽ/רַחֲמִֽים־׀־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Geh nicht in ein Trauerhaus[a]; geh nicht hin, um zu klagen, und bekunde ihnen kein Mitgefühl[b]. Denn ich habe diesem Volk meinen Frieden[c], die beständige Liebe und das Erbarmen entzogen – Spruch Jahwes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein Festhaus“ bzw. „in ein Haus des Gelages“. Das hebräische Wort מַרְזֵחַ kann eine Fest- oder Trinkgesellschaft bezeichnen; hier sprechen Klage und Anteilnahme im Zusammenhang für „Trauerhaus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um ihnen Beileid zu bekunden“ bzw. „sie zu trösten“. Das hebräische Verb kann Gesten und Äußerungen der Anteilnahme an Trauernden bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: „Frieden“ umfasst hier wahrscheinlich auch Wohlergehen, Heil und Unversehrtheit, nicht nur die Abwesenheit von Konflikt.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder und entspricht der deutschen Form des hebräischen Tetragramms.
- source_word: בֵּית מַרְזֵחַ
  choice: Trauerhaus
  rationale: Der unmittelbare Zusammenhang mit Klage und Beileidsbekundung spricht für eine Trauerversammlung; die mögliche Bedeutung als Fest- oder Gelagehaus bleibt in einer Fußnote erhalten.
- source_word: לִסְפּוֹד
  choice: um zu klagen
  rationale: Bezeichnet hier ausdrücklich die Totenklage und wird in natürlichem, gegenwärtigem Deutsch wiedergegeben.
- source_word: תָּנֹד לָהֶם
  choice: ihnen dein Mitgefühl zu zeigen
  rationale: Erfasst die im Trauerkontext gemeinten Gesten oder Äußerungen der Anteilnahme, ohne eine bestimmte äußere Gebärde festzulegen.
- source_word: אָסַפְתִּי אֶת שְׁלוֹמִי
  choice: ich habe diesem Volk meinen Frieden entzogen
  rationale: אָסַף bezeichnet in dieser Verbindung das Wegnehmen oder Zurückziehen; „entzogen“ ist idiomatisch, während „Frieden“ den Schlüsselbegriff שָׁלוֹם bewahrt.
- source_word: שְׁלוֹמִי
  choice: meinen Frieden
  rationale: Bewahrt die direkte Entsprechung und lässt das weitere Bedeutungsspektrum von Wohlergehen, Heil und Unversehrtheit offen.
- source_word: נְאֻם יְהוָה
  choice: so lautet der Ausspruch Jahwes
  rationale: Gibt die feierliche prophetische Formel deutlich wieder, ohne sie mit dem einleitenden „so spricht“ gleichzusetzen.
- source_word: הַחֶסֶד
  choice: die beständige Liebe
  rationale: Verbindet den Beziehungscharakter von חֶסֶד mit seiner Vorstellung von Beständigkeit und Treue, ohne den Begriff ausschließlich konfessionell zu bestimmen.
- source_word: הָרַחֲמִים
  choice: das Erbarmen
  rationale: Natürliches, würdevolles Deutsch für den abstrakt gebrauchten hebräischen Plural; es bewahrt den Akzent auf barmherziger Zuwendung.
theological_decisions:
- issue: Beziehung der Schlussbegriffe „beständige Liebe“ und „Erbarmen“ zu „meinem Frieden“
  choice: Die Schlussbegriffe stehen nach einem Gedankenstrich als nachgetragene Erläuterung beziehungsweise weitere Objekte des Entziehens.
  alternative: 'Man könnte das Verb ausdrücklich wiederholen: „Ich habe ... die beständige Liebe und das Erbarmen entzogen.“'
  rationale: Das Hebräische setzt אֶת sowohl vor „meinen Frieden“ als auch vor den beiden Schlussbegriffen. Die knappe deutsche Reihung mit Gedankenstrichen bewahrt die syntaktische Spannung, ohne eindeutig zwischen Apposition und weiteren koordinierten Objekten zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird mit dem natürlichen Singularimperativ „Geh“ wiedergegeben. „Trauerhaus“ ist knapp und verständlich; die echte lexikalische Alternative wird dokumentiert. Der Gedankenstrich im Schlusssatz erhält die ungewöhnliche hebräische Nachstellung und ihre mögliche appositionale oder koordinierende Funktion.
