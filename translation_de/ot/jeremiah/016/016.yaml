id: JER.16.16
reference: Jeremiah 16:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
translation:
  language: de
  text: Sieh, ich lasse viele Fischer kommen – Spruch Jahwes –, und sie werden sie fangen. Danach lasse ich viele Jäger kommen,[a] und sie werden sie von jedem Berg und jedem Hügel und aus den Felsspalten aufjagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Bilder von Fischern und Jägern zeigen, wie Menschen aufgespürt und aus jedem Versteck hervorgeholt werden. Der Vers bezeichnet die von Jahwe ausgesandten Personen nicht näher.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי שֹׁלֵחַ
  choice: Sieh, ich lasse … kommen
  rationale: הִנְנִי leitet eine feierliche, nachdrückliche Ankündigung ein; das Partizip שֹׁלֵחַ stellt das bevorstehende Handeln anschaulich dar. „Ich lasse … kommen“ gibt zusammen mit der Präposition לְ idiomatisch wieder, dass die genannten Personen herbeigerufen beziehungsweise ausgesandt werden.
- source_word: לְדוגים רַבִּים
  choice: viele Fischer
  rationale: Die konkrete Berufsbezeichnung bewahrt das Bild des Fischfangs und entspricht natürlichem modernem Deutsch.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die feste prophetische Formel wird knapp und würdevoll wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: וְדִיגוּם
  choice: und sie werden sie fangen
  rationale: Das Verb bezeichnet hier das Fangen beim Fischfang. Das Objektsuffix bleibt bewusst als „sie“ stehen, ohne seine Bezugsgruppe im Vers ausdrücklich zu bestimmen.
- source_word: לְרַבִּים צַיָּדִים
  choice: viele Jäger
  rationale: „Jäger“ erhält das konkrete, zum Bild der Fischer parallele Motiv.
- source_word: וְצָדוּם
  choice: und sie werden sie … jagen
  rationale: Die Wiedergabe bewahrt das Jagdbild und die hebräische Verb-Objekt-Struktur, statt bereits deutend „ergreifen“ oder „gefangen nehmen“ zu schreiben.
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה וּמִנְּקִיקֵי הַסְּלָעִים
  choice: von jedem Berg und jedem Hügel und aus den Felsspalten
  rationale: Die wiederholten Ortsangaben betonen, dass kein Versteck unerreichbar bleibt. „Felsspalten“ ist konkret und im Deutschen idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Ausgangstext stehende Eigenname wird als Gottesname erkennbar wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Deutung der Fischer und Jäger
  choice: Das konkrete Bild und das unbestimmte Objekt „sie“ bleiben erhalten.
  alternative: Die Handelnden ausdrücklich als feindliche Eroberer oder als Sammler der Zerstreuten bestimmen.
  rationale: Der Vers selbst benennt die ausgesandten Gruppen nur bildhaft und löst die mögliche Spannung zwischen Straf- und Sammlungsmotiv nicht ausdrücklich auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sieh“ wahrt den feierlichen Hinweischarakter ohne die altertümliche Form „Siehe“. Die Satzstruktur bleibt bildhaft und klar; die wiederholten Ortsangaben erhalten den nachdrücklichen Umfang des hebräischen Textes.
