  text: לֹֽא תִקַּ֥ח לְ/ךָ֖ אִשָּׁ֑ה וְ/לֹֽא יִהְי֤וּ לְ/ךָ֙ בָּנִ֣ים וּ/בָנ֔וֹת בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/002.yaml
  text: You shall not take a wife for yourself[a], nor shall you have sons or daughters in this place.
translation:
  language: de
  text: Du sollst dir keine Frau nehmen[a], und du sollst an diesem Ort weder Söhne noch Töchter haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäßer: „Du sollst nicht heiraten und an diesem Ort weder Söhne noch Töchter haben.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקַּח לְךָ אִשָּׁה
  choice: dir keine Frau nehmen
  rationale: Die Wendung gibt das hebräische Idiom formal nah wieder. Im Zusammenhang bezeichnet אִשָּׁה eine Ehefrau; im Deutschen ist „sich eine Frau nehmen“ verständlich, würdevoll und deutlich ehelich.
- source_word: וְלֹא יִהְיוּ לְךָ
  choice: und du sollst … weder … noch … haben
  rationale: Die hebräische Existenzkonstruktion mit לְ drückt hier Besitz beziehungsweise persönliche Zugehörigkeit aus. Die deutsche Fassung bewahrt zusammen mit dem vorausgehenden Verbot den direkten, gebietenden Sinn.
- source_word: בָּנִים וּבָנוֹת
  choice: weder Söhne noch Töchter
  rationale: Die Paarformel nennt männliche und weibliche Nachkommen ausdrücklich. „Weder … noch“ ist unter der Verneinung idiomatisches Deutsch und erhält diese Einzelbenennung.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: מָקוֹם bedeutet grundsätzlich „Ort“. Diese Wiedergabe bewahrt den deiktischen und örtlichen Bezug, ohne ihn unbegründet auf das ganze Land auszuweiten.
theological_decisions:
- issue: Geltung und Art des Verbots für Jeremia
  choice: Direktes Verbot, an diesem Ort zu heiraten und Kinder zu haben
  alternative: Bloße Vorhersage, dass Jeremia unverheiratet und kinderlos bleiben werde, oder Ausweitung auf das ganze Land
  rationale: Die Formen der zweiten Person Singular und die verneinte Verbform tragen hier gebietenden Charakter. „An diesem Ort“ hält den örtlichen Bezug offen und vermeidet eine interpretierende Ausweitung.
translation_notes:
  register: Modernes Standarddeutsch mit würdevoll-knapper, prophetischer Direktheit. Die formal nahe Wendung „sich eine Frau nehmen“ bleibt verständlich; die Fußnote bietet die geläufigere dynamische Formulierung „heiraten“.
