base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/008.yaml
  text: And you shall not enter a house of feasting to sit with them[a], to eat and to drink.
translation:
  language: de
  text: Und in ein Haus des Festmahls sollst du nicht gehen, um dich zu ihnen zu setzen und zu essen und zu trinken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein Haus, in dem gefeiert wird“. Der hebräische Ausdruck bezeichnet ein Haus, in dem Menschen zu festlichem Essen und Trinken zusammenkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  choice: Und ... in kein Festhaus
  rationale: Die Konstruktion bezeichnet ein Haus bzw. einen Ort festlichen Essens und Trinkens. „Festhaus“ bewahrt das konkrete Bild knapp und natürlich; das vorangestellte וּ wird mit „Und“ wiedergegeben. Das hebräische לֹא macht im Deutschen zusammen mit „kein“ die Verneinung ausdrücklich.
- source_word: לֹא תָבוֹא
  choice: sollst ... nicht gehen
  rationale: Das Imperfekt der 2. Person Singular hat hier verbietenden Sinn. „Du sollst ... in kein Festhaus gehen“ gibt den feierlich-verbindlichen Ton wieder und klingt im Deutschen natürlicher als „eintreten“ bei einem besuchten Festort.
- source_word: לָשֶׁבֶת אוֹתָם
  choice: um dich zu ihnen zu setzen
  rationale: Der Infinitiv bezeichnet den Zweck des Hineingehens. אוֹתָם wird in dieser Verbindung idiomatisch assoziativ verstanden; „dich zu ihnen zu setzen“ macht die Teilnahme an ihrer Gemeinschaft deutlich.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: zu essen und zu trinken
  rationale: Die beiden parallelen Infinitive werden ausdrücklich beibehalten und geben Zweck bzw. Art der Teilnahme am Fest wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Weisungston. Die konkrete Haus-Metaphorik des Hebräischen bleibt erhalten; die ungewöhnliche Verbindung „sitzen + sie“ wird natürlich als „sich zu ihnen setzen“ wiedergegeben.
