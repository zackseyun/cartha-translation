  naturalness: Der Satz ist verständlich und hat einen passenden Weisungston. „Haus des Festmahls“ ist hier zwar etwas gehoben, aber als konkrete, quellennähere Formulierung in biblischem Register natürlich und klar.
  terminology: Das hebräische בֵּית מִשְׁתֶּה bezeichnet ein Haus des Gelages bzw. Festmahls. Die Formulierung „Haus des Festmahls“ bewahrt sowohl das konkrete „Haus“ als auch den Mahlcharakter. Die vorhandene Fußnote ist problematisch, weil sie diese präzisere Formulierung nur als mögliche wörtliche Alternative ausgibt, während der Haupttext mit „Festhaus“ freier formuliert.
