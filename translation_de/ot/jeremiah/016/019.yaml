source:
  edition: WLC
  text: יְהוָ֞ה עֻזִּ֧/י וּ/מָעֻזִּ֛/י וּ/מְנוּסִ֖/י בְּ/י֣וֹם צָרָ֑ה אֵלֶ֗י/ךָ גּוֹיִ֤ם יָבֹ֨אוּ֙ מֵֽ/אַפְסֵי אָ֔רֶץ וְ/יֹאמְר֗וּ אַךְ שֶׁ֨קֶר֙ נָחֲל֣וּ אֲבוֹתֵ֔י/נוּ הֶ֖בֶל וְ/אֵֽין בָּ֥/ם מוֹעִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
translation:
  language: de
  text: 'Jahwe[a], meine Stärke und meine Festung, meine Zuflucht am Tag der Not! Zu dir werden die Völker von den Enden der Erde kommen und sagen: »Gewiss, unsere Vorfahren haben nur Lügen geerbt, nichtige Dinge, die nichts nützen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Text nennt hier den Gottesnamen JHWH, traditionell auch mit „der HERR“ wiedergegeben.
    reason: divine_name
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עֻזִּי
  choice: meine Stärke
  rationale: Die direkte und natürliche Wiedergabe bewahrt das persönliche Bekenntnis.
- source_word: מָעֻזִּי
  choice: meine Festung
  rationale: Das Wort bezeichnet einen befestigten Schutzort; „Festung“ hält dieses Bild fest und unterscheidet sich klar von der folgenden „Zuflucht“.
- source_word: מְנוּסִי
  choice: meine Zuflucht
  rationale: Gemeint ist ein Ort, zu dem man sich in Sicherheit flüchtet.
- source_word: בְּיוֹם צָרָה
  choice: am Tag der Not
  rationale: Die feste Wendung bezeichnet eine Zeit schwerer Bedrängnis und klingt im Deutschen würdig und verständlich.
- source_word: גּוֹיִם
  choice: die Völker
  rationale: „Völker“ gibt den internationalen Umfang wieder, ohne den Israel-Nichtisrael-Gegensatz stärker hervorzuheben als der Kontext.
- source_word: מֵאַפְסֵי אָרֶץ
  choice: von den Enden der Erde
  rationale: Die hebräische Wendung meint die fernsten Gegenden der Erde und lässt sich im Deutschen ebenso idiomatisch ausdrücken.
- source_word: אַךְ
  choice: Gewiss
  rationale: Die Partikel leitet hier eine nachdrückliche Einsicht beziehungsweise ein Bekenntnis ein; die zugleich mögliche ausschließende Nuance wird durch „nur“ beim folgenden Satzglied ausgedrückt.
- source_word: שֶׁקֶר
  choice: Lügen
  rationale: Der Singular kann kollektiv die ererbten Unwahrheiten bezeichnen; der deutsche Plural ist in dieser Verbindung natürlicher.
- source_word: נָחֲלוּ
  choice: haben … geerbt
  rationale: Die Wiedergabe erhält das Bild einer von früheren Generationen übernommenen religiösen Überlieferung.
- source_word: אֲבוֹתֵינוּ
  choice: unsere Vorfahren
  rationale: „Vorfahren“ bezeichnet im heutigen Deutsch natürlich die vorangegangenen Generationen; wörtlicher wäre „unsere Väter“.
- source_word: הֶבֶל
  choice: nichtige Dinge
  rationale: Das Wort bezeichnet Nichtigkeit, Leere oder Vergeblichkeit. Die Wiedergabe bleibt bewusst weiter als die kontextuell mögliche Deutung „Götzen“.
- source_word: וְאֵין בָּם מוֹעִיל
  choice: die nichts nützen
  rationale: Die funktionale Formulierung gibt knapp wieder, dass sich unter beziehungsweise an diesen Dingen nichts Nützliches oder Hilfreiches findet.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Gottesnamen unmittelbar. Die Transliteration bewahrt seinen Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Ob הֶבֶל ausdrücklich als Götzen bezeichnet werden soll
  choice: nichtige Dinge
  alternative: Götzen
  rationale: Der Zusammenhang lässt an falsche Götter oder Götzen denken, doch הֶבֶל bezeichnet zunächst Nichtigkeit oder Vergeblichkeit. Die breitere Formulierung wahrt die Aussage und vermeidet eine unnötige Einengung.
- issue: Verhältnis von שֶׁקֶר, הֶבֶל und וְאֵין בָּם מוֹעִיל
  choice: „Lügen“ als Oberbegriff, danach eine erläuternde Apposition
  alternative: 'drei nebengeordnete Größen: „Lüge, Nichtigkeit und nichts Nützliches“'
  rationale: Die knappe hebräische Reihung erlaubt unterschiedliche syntaktische Zuordnungen. Der Doppelpunkt bildet plausibel ab, dass die folgenden Worte den ererbten Trug näher beschreiben, ohne „Nichtigkeit“ vorschnell mit Götzen gleichzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Der Ausruf nach der dreifachen Gottesbeschreibung bildet die emotionale Zäsur des hebräischen Satzes ab. „Vorfahren“ ist gegenwärtiger als „Väter“, während „am Tag der Not“ die prägnante biblische Bildsprache bewahrt.
