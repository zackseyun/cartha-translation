id: JER.16.9
reference: Jeremiah 16:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֨י מַשְׁבִּ֜ית מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה לְ/עֵינֵי/כֶ֖ם וּ/בִֽ/ימֵי/כֶ֑ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֥וֹל כַּלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen[a], der Gott Israels: Siehe, vor euren Augen und noch zu euren Lebzeiten lasse ich an diesem Ort den Jubelruf und den Freudenruf verstummen, die Stimme des Bräutigams und die Stimme der Braut.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „der HERR Zebaot“ oder „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt den konkreten Sinn des Titels und seine traditionelle biblische Würde. Eine Fußnote nennt die geläufige traditionelle Wiedergabe.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: הִנְנִי מַשְׁבִּית
  choice: Siehe, … lasse ich … verstummen
  rationale: „Siehe“ erhält die aufmerksamkeitslenkende Ankündigungsformel; das causative Partizip wird im Zusammenhang hörbarer Festfreude natürlich mit „verstummen lassen“ ausgedrückt und bezeichnet das unmittelbar bevorstehende Handeln Gottes.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Im Deutschen bezeichnet „an diesem Ort … verstummen lassen“ idiomatisch den Bereich, aus dem die genannten Klänge beseitigt werden; eine mechanische Wiedergabe mit „aus diesem Ort“ wäre unnatürlich.
- source_word: לְעֵינֵיכֶם וּבִימֵיכֶם
  choice: vor euren Augen und noch zu euren Lebzeiten
  rationale: „Vor euren Augen“ wahrt den öffentlich wahrnehmbaren Vollzug; „noch zu euren Lebzeiten“ gibt die zeitliche Aussage von „in euren Tagen“ in heutigem Deutsch eindeutig wieder.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: den Jubelruf und den Freudenruf
  rationale: Die parallelen, aber nicht identischen Ausdrücke bleiben unterscheidbar; „-ruf“ macht die hörbare Dimension von קוֹל deutlich und passt zur anschließenden Stimme des Hochzeitspaars.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: die Stimme des Bräutigams und die Stimme der Braut
  rationale: Bei Personen ist „Stimme“ die natürliche Wiedergabe von קוֹל; die Wiederholung erhält den feierlichen Parallelismus und das Hochzeitsbild.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: der HERR Zebaot; der HERR der Heerscharen
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm und verbindet es mit צְבָאוֹת. Die Übersetzung bewahrt sowohl den persönlichen Gottesnamen als auch den militärisch-kosmischen Titel, ohne ihn konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ und „Heerscharen“ sind bewusst leicht gehoben, bleiben aber im biblischen Zusammenhang verständlich. Die Satzstellung rückt die öffentliche und zeitnahe Erfüllung hervor, ohne die Aussage des hebräischen Textes zu erweitern.
