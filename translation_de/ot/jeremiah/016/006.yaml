source:
  edition: WLC
  text: וּ/מֵ֨תוּ גְדֹלִ֧ים וּ/קְטַנִּ֛ים בָּ/אָ֥רֶץ הַ/זֹּ֖את לֹ֣א יִקָּבֵ֑רוּ וְ/לֹֽא יִסְפְּד֣וּ לָ/הֶ֔ם וְ/לֹ֣א יִתְגֹּדַ֔ד וְ/לֹ֥א יִקָּרֵ֖חַ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
translation:
  language: de
  text: Große und Kleine werden in diesem Land sterben. Sie werden nicht begraben werden, und man wird nicht um sie trauern[a]. Niemand wird sich ihretwegen Einschnitte machen oder sich ihretwegen den Kopf kahl scheren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Man wird keine Totenklage für sie halten.« Das Hebräische verwendet hier ein unbestimmtes Verb in der Mehrzahl.'
    reason: lexical_alternative
  - marker: b
    text: Einschnitte in die Haut und das Kahlscheren des Kopfes waren Trauerbräuche für Verstorbene.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵתוּ
  choice: werden sterben
  rationale: Das Qal-Perfekt mit vorangestelltem וּ kündigt im prophetischen Zusammenhang zukünftiges Geschehen an. »Sterben« gibt מות schlicht und ohne interpretierende Erweiterung wieder.
- source_word: גְדֹלִים וּקְטַנִּים
  choice: Große und Kleine
  rationale: Die paarweise Formulierung umfasst Menschen ohne Unterschied von Rang, Bedeutung oder Alter. Die traditionelle, verständliche Wendung bewahrt zugleich die Offenheit des Hebräischen.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: »Land« entspricht אֶרֶץ im geografischen und bundesgeschichtlichen Zusammenhang Jeremias besser als das modern-politische »Staat«.
- source_word: לֹא יִקָּבֵרוּ
  choice: Sie werden nicht begraben werden
  rationale: Das Niphal bezeichnet eindeutig das passive Begrabenwerden; die deutsche Passivform bildet dies genau ab.
- source_word: וְלֹא יִסְפְּדוּ לָהֶם
  choice: und man wird nicht um sie trauern
  rationale: Das unbestimmte Verb in der 3. Person Plural wird im Deutschen natürlich mit dem unpersönlichen »man« wiedergegeben. »Trauern« erfasst den Zusammenhang, während die Fußnote auf die konkretere Totenklage hinweist.
- source_word: וְלֹא יִתְגֹּדַד
  choice: Niemand wird sich ihretwegen Einschnitte machen
  rationale: Die reflexive Form bezeichnet das Einritzen oder Verletzen des eigenen Körpers als Trauerbrauch. »Sich Einschnitte machen« ist konkret, verständlich und weniger missverständlich als bloßes »sich schneiden«.
- source_word: וְלֹא יִקָּרֵחַ לָהֶם
  choice: oder sich ihretwegen den Kopf kahl scheren
  rationale: Das von קרח abgeleitete Verb bezeichnet das Herstellen einer kahlen Stelle als Trauerzeichen. Die Wiedergabe benennt den gemeinten Brauch verständlich, ohne ihn zu verallgemeinern.
theological_decisions:
- issue: Konkrete Trauerbräuche im Gerichtswort
  choice: Selbstverletzung und Kahlscheren werden ausdrücklich im Haupttext genannt.
  alternative: Die Handlungen allgemein als »Trauerriten vollziehen« zusammenfassen.
  rationale: Der hebräische Text nennt bewusst konkrete körperliche Trauerzeichen. Ihre Beibehaltung wahrt die Schärfe des Gerichtswortes und vermeidet eine konfessionelle oder kulturelle Umdeutung.
- issue: Wechsel zwischen unbestimmtem Plural und Singular
  choice: יִסְפְּדוּ wird mit »man«, die beiden folgenden Singularformen werden mit »niemand« wiedergegeben.
  alternative: Alle drei Verben mit einem einheitlichen deutschen Subjekt wiedergeben.
  rationale: So bleibt der grammatische Wechsel des Hebräischen zumindest erkennbar, ohne im Deutschen unnatürlich zu wirken. Inhaltlich bezeichnen beide Konstruktionen das vollständige Ausbleiben der Trauerhandlungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bewahren den ernsten Ton des Gerichtswortes; konkrete, heute erklärungsbedürftige Trauerhandlungen bleiben im Text stehen und werden knapp erläutert.
