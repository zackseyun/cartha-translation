source:
  edition: WLC
  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
translation:
  language: de
  text: 'Doch ihr habt noch schlimmer gehandelt als eure Väter[a]. Seht: Jeder von euch folgt dem Starrsinn seines bösen Herzens[b] und hört nicht auf mich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als eure Vorfahren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem eigensinnigen Trachten seines bösen Herzens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת
  choice: habt noch schlimmer gehandelt
  rationale: Die Hifil-Form mit dem anschließenden מִן-Vergleich hat komparative Kraft. „Noch schlimmer gehandelt“ gibt sowohl den Vergleich als auch die moralische Wertung natürlich wieder.
- source_word: מֵאֲבוֹתֵיכֶם
  choice: als eure Väter
  rationale: „Väter“ bewahrt die konkrete familiäre und prophetische Ausdrucksweise; gemeint sind die früheren Generationen.
- source_word: וְהִנְכֶם
  choice: Seht
  rationale: Die Partikel lenkt nachdrücklich die Aufmerksamkeit auf das gegenwärtige Verhalten der Angeredeten. „Seht“ ist würdig und zugleich gegenwärtiges Deutsch.
- source_word: הֹלְכִים אִישׁ אַחֲרֵי
  choice: Jeder von euch folgt
  rationale: Das Bild vom Gehen hinter etwas her bezeichnet fortgesetzte Lebensführung. „Folgt“ ist im Deutschen natürlicher als eine wörtliche Wiedergabe mit „geht hinterher“; אִישׁ ist distributiv gebraucht.
- source_word: שְׁרִרוּת
  choice: Starrsinn
  rationale: Das Wort bezeichnet eigensinnige, hartnäckige Selbstbestimmung. „Starrsinn“ ist prägnant und verständlich, ohne die ältere, missverständliche Bedeutung „Einbildung“ einzutragen.
- source_word: לִבּוֹ הָרָע
  choice: seines bösen Herzens
  rationale: Die Wendung bleibt formal nah am Hebräischen und bewahrt „Herz“ als Zentrum von Denken, Wollen und Entscheiden.
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלָי
  choice: und hört nicht auf mich
  rationale: Die Infinitivkonstruktion bezeichnet die negative Folge beziehungsweise Zielrichtung ihres Verhaltens. Die Übersetzung bewahrt diese Offenheit und vermeidet, die Willentlichkeit durch „weigert sich“ stärker festzulegen als der Wortlaut.
theological_decisions:
- issue: Distributiver Gebrauch von אִישׁ
  choice: Jeder von euch
  alternative: jeder Mann
  rationale: אִישׁ individualisiert hier das ganze angesprochene Volk und beschränkt die Aussage nicht auf Männer. „Jeder von euch“ erhält sowohl den distributiven Sinn als auch den direkten Bezug zu den Angeredeten.
- issue: Bezeichnung der früheren Generationen mit אָבוֹת
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: „Väter“ wahrt die geschlechtlich konkrete Bildsprache des Ausgangstextes und den vertrauten prophetischen Sprachgebrauch; sachlich sind die Vorfahren beziehungsweise früheren Generationen gemeint.
- issue: Verhältnis von לְבִלְתִּי zur vorausgehenden Lebensführung
  choice: und hört nicht auf mich
  alternative: sodass ihr nicht auf mich hört / um nicht auf mich zu hören
  rationale: Die hebräische Konstruktion kann Ziel oder Folge ausdrücken. Die koordinierende deutsche Fassung lässt diese Spannung bestehen, statt sie einseitig als ausdrückliche Absicht oder bloße Folge festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz vermeidet unnötig altertümliche Formen; „Seht“ erhält jedoch den nachdrücklichen Hinweischarakter von הִנֵּה. Die Punktsetzung nach „Väter“ macht den emphatischen Neueinsatz mit וְהִנְכֶם hörbar.
