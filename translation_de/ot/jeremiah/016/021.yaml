source:
  edition: WLC
  text: לָ/כֵן֙ הִנְ/נִ֣י מֽוֹדִיעָ֔/ם בַּ/פַּ֣עַם הַ/זֹּ֔את אוֹדִיעֵ֥/ם אֶת יָדִ֖/י וְ/אֶת גְּבֽוּרָתִ֑/י וְ/יָדְע֖וּ כִּֽי שְׁמִ֥/י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
translation:
  language: de
  text: 'Darum: Sieh, ich lasse sie erkennen[a] – diesmal werde ich sie meine Hand[b] und meine Macht erkennen lassen. Dann werden sie erkennen, dass mein Name Jahwe[c] ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ich gebe es ihnen zu erkennen … ich werde es ihnen zu erkennen geben“. Das hebräische Verb ist kausativ und kann mit persönlichem oder sachlichem Bezug wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: „Meine Hand“ ist ein hebräisches Bild für Gottes wirksame Kraft.
    reason: cultural_note
  - marker: c
    text: Hebräisch JHWH; traditionell mit „der HERR“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang knapp und natürlich.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: Bewahrt den nachdrücklichen Hinweischarakter der göttlichen Ankündigung in gegenwärtigem, würdigem Deutsch.
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  choice: ich lasse sie erkennen … ich lasse sie … erkennen
  rationale: Gibt den kausativen Hifil-Stamm und die auffällige Wiederholung wieder; die Formulierung erhält zudem den persönlichen Objektbezug „sie“.
- source_word: בַּפַּעַם הַזֹּאת
  choice: diesmal
  rationale: Natürliche und prägnante Wiedergabe der zeitlichen Wendung mit demonstrativer Betonung.
- source_word: יָדִי
  choice: meine Hand
  rationale: Bewahrt das hebräische Bild für wirksame Kraft, ohne es mit dem folgenden Begriff für Macht zusammenzuziehen.
- source_word: גְּבוּרָתִי
  choice: meine Macht
  rationale: Bezeichnet Stärke beziehungsweise Macht und bildet im Deutschen eine klare Paarung mit „meine Hand“.
- source_word: וְיָדְעוּ
  choice: Dann werden sie erkennen
  rationale: „Dann“ macht die im Zusammenhang liegende Folge verständlich, ohne den Aussagegehalt zu erweitern.
- source_word: שְׁמִי
  choice: mein Name
  rationale: Die wörtliche Wiedergabe erhält die Bedeutung der göttlichen Selbstidentifikation.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Umschrift gibt den im hebräischen Text stehenden Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den persönlichen Namen, während „der HERR“ die traditionelle Ersatzlesung ist.
- issue: Deutung von „meine Hand“
  choice: Das Bild „meine Hand“ bleibt im Haupttext erhalten.
  alternative: meine Kraft
  rationale: Der Text unterscheidet „Hand“ und „Macht“. Die bildhafte Form wahrt diese rhetorische Spannung und vermeidet eine Einebnung beider Ausdrücke.
- issue: Persönliches oder unpersönliches Objekt beim kausativen Verb ידע
  choice: ich lasse sie erkennen
  alternative: ich gebe es ihnen zu erkennen
  rationale: Der pronominale Suffixbezug lässt sich persönlich auf „sie“ beziehen; die deutsche Formulierung bewahrt diese Möglichkeit, während eine Fußnote die sachbezogene Wiedergabe offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Sieh“ vermeidet das altertümliche „siehe“, erhält aber den Nachdruck der hebräischen Präsentationsformel. Die Wiederholung von „erkennen“ folgt bewusst der Rhetorik des Ausgangstextes.
