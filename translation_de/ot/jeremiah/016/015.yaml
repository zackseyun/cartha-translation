id: JER.16.15
reference: Jeremiah 16:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אִם חַי יְהוָ֗ה אֲשֶׁ֨ר הֶעֱלָ֜ה אֶת בְּנֵ֤י יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וּ/מִ/כֹּל֙ הָֽ/אֲרָצ֔וֹת אֲשֶׁ֥ר הִדִּיחָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִֽׁבֹתִי/ם֙ עַל אַדְמָתָ֔/ם אֲשֶׁ֥ר נָתַ֖תִּי לַ/אֲבוֹתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
translation:
  language: de
  text: 'sondern[a]: »So wahr Jahwe lebt, der die Israeliten aus dem Land des Nordens und aus all den Ländern heraufgeführt hat, in die er sie vertrieben hatte!« Denn ich werde sie in ihr Land zurückbringen, das ich ihren Vätern[b] gegeben habe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vielmehr“ beziehungsweise „sondern vielmehr“. Die hebräische Wendung führt den Gegensatz zu Vers 14 fort.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihren Vorfahren“. Wörtlich steht im Hebräischen „ihren Vätern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: sondern
  rationale: 'Die Wendung setzt den in Vers 14 begonnenen Gegensatz fort: nicht mehr die frühere, sondern die neue Schwurformel. „Sondern“ gibt diesen Anschluss knapp und natürlich wieder.'
- source_word: חַי יְהוָה
  choice: So wahr Jahwe lebt
  rationale: Dies ist die geläufige deutsche Wiedergabe der hebräischen Schwurformel und bewahrt sowohl ihren Eidcharakter als auch den Gottesnamen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im hebräischen Text ausdrücklich stehende Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הֶעֱלָה
  choice: heraufgeführt hat
  rationale: Die kausative Form von עלה bezeichnet ein Heraufführen. Die Wiedergabe erhält den räumlichen Ausdruck und den Anklang an die Exodusüberlieferung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: die Israeliten
  rationale: „Die Israeliten“ ist im heutigen Deutsch die natürliche kollektive Bezeichnung und meint hier das Volk Israel, ohne den Ausdruck auf männliche Nachkommen zu verengen.
- source_word: מֵאֶרֶץ צָפוֹן
  choice: aus dem Land des Nordens
  rationale: Die Formulierung bleibt geografisch offen und folgt dem hebräischen Ausdruck eng, ohne ihn mit einem bestimmten modernen Staat gleichzusetzen.
- source_word: וּמִכֹּל הָאֲרָצוֹת
  choice: und aus all den Ländern
  rationale: „Länder“ bewahrt die breite Bedeutung des Plurals und vermeidet eine moderne nationalstaatliche Festlegung.
- source_word: הִדִּיחָם
  choice: in die er sie vertrieben hatte
  rationale: Das Verb bezeichnet ein gewaltsames Wegtreiben beziehungsweise Verbannen. „Vertrieben“ bewahrt die Härte und die ausdrücklich göttliche Handlungsträgerschaft.
- source_word: וַהֲשִׁבֹתִים
  choice: Denn ich werde sie ... zurückbringen
  rationale: Die Hifilform bezeichnet das Veranlassen einer Rückkehr. „Zurückbringen“ ist idiomatisch und bewahrt Gottes aktive Rolle; „Denn“ stellt die verheißene Rückführung als Begründung für die neue Schwurformel dar.
- source_word: עַל אַדְמָתָם
  choice: in ihr Land
  rationale: אַדָמָה kann Boden oder Land bezeichnen. Im Zusammenhang der Wiederherstellung ist „in ihr Land“ natürlich und sachlich präzise.
- source_word: אֲשֶׁר נָתַתִּי לַאֲבוֹתָם
  choice: das ich ihren Vätern gegeben habe
  rationale: „Vätern“ gibt die ausdrücklich männliche und bundestheologisch geprägte Bezeichnung des Ausgangstextes wieder; „Vorfahren“ bleibt als verständliche Alternative vermerkt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als solcher wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Verantwortlichkeit für das Exil in הִדִּיחָם
  choice: in die er sie vertrieben hatte
  alternative: in die sie zerstreut worden waren
  rationale: Das hebräische Verb nennt Gott ausdrücklich als Handelnden. Die Übersetzung erhält diese theologische Spannung und schwächt sie nicht durch ein Passiv oder eine unpersönliche Formulierung ab.
- issue: Bundesgeschichtliche Bezeichnung לַאֲבוֹתָם
  choice: ihren Vätern
  alternative: ihren Vorfahren
  rationale: Der Ausgangstext spricht ausdrücklich von den „Vätern“. Die Hauptübersetzung wahrt diese Formulierung; die allgemeinere genealogische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Schwurformel ist idiomatisch formuliert; „heraufgeführt“ bewahrt bewusst die Bildrichtung des hebräischen Verbs. Der Satzanfang bleibt als Fortsetzung des Gegensatzes aus Vers 14 erkennbar. Alle Fußnotenmarker stehen an der jeweils sachlich zugehörigen Stelle.
