lexical_decisions:
- source_word: וַיְהִי
  choice: Und … erging
  rationale: Die Wayyiqtol-Form von היה führt die folgende Mitteilung in der fortlaufenden Erzählung ein. Zusammen mit דְבַר und אֵלַי entspricht die natürliche deutsche prophetische Formel „Und das Wort … erging an mich“ dem hebräischen Satzbau, ohne unnötig wörtlich „Und es geschah“ zu sagen.
- source_word: דְבַר
  choice: das Wort
  rationale: Im festen prophetischen Ausdruck דְבַר יְהוָה bewahrt „das Wort“ die formale und theologisch offene Ausdrucksweise des Hebräischen besser als das deutendere „die Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; dies bewahrt den Eigennamen im Haupttext statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der im Deutschen üblichen Verbindung „das Wort erging“ wird אֶל mit dem Suffix der ersten Person idiomatisch als „an mich“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv לֵאמֹר leitet die unmittelbar folgende direkte Rede ein. Im modernen Deutschen erfüllt ein Doppelpunkt diese Funktion natürlicher als das schwerfällige „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt ihn im deutschen Haupttext als Namen wieder; die traditionelle Ersatzlesung „der HERR“ wird in der Fußnote genannt, ohne den Ausgangstext stillschweigend durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige prophetische Formel „das Wort Jahwes erging an mich“ wahrt die Nähe zum Hebräischen; der Doppelpunkt kündigt knapp und natürlich die in Vers 2 folgende Rede an.
