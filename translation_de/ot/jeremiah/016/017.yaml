  text: כִּ֤י עֵינַ/י֙ עַל כָּל דַּרְכֵי/הֶ֔ם לֹ֥א נִסְתְּר֖וּ מִ/לְּ/פָנָ֑/י וְ/לֹֽא נִצְפַּ֥ן עֲוֺנָ֖/ם מִ/נֶּ֥גֶד עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
translation:
  language: de
  text: Denn[a] meine Augen sind auf alle ihre Wege[b] gerichtet; sie sind mir nicht verborgen, und ihre Schuld[c] ist meinen Augen nicht verborgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Weil meine Augen auf alle ihre Wege gerichtet sind.“'
    reason: lexical_alternative
  - marker: b
    text: Mit „ihren Wegen“ ist ihr Verhalten oder ihre Lebensführung gemeint.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihr Vergehen“. Das hebräische Wort kann sowohl schuldhaftes Unrecht als auch die daraus erwachsende Schuld bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet hier die Begründung für die vorausgehende Aussage ein. „Denn“ gibt diese erklärende Funktion im Deutschen natürlich wieder; „weil“ bleibt als mögliche Alternative erhalten.
- source_word: עֵינַי עַל
  choice: meine Augen sind auf … gerichtet
  rationale: Die Formulierung bewahrt das konkrete Bild der auf etwas gerichteten Augen und ist zugleich idiomatisches modernes Deutsch.
- source_word: כָּל דַּרְכֵיהֶם
  choice: alle ihre Wege
  rationale: „Wege“ erhält die hebräische Metapher, die hier nicht nur tatsächliche Pfade, sondern Verhalten und Lebensführung bezeichnet.
- source_word: לֹא נִסְתְּרוּ מִלְּפָנַי
  choice: sie sind mir nicht verborgen
  rationale: Das pluralische Pronomen bezieht sich auf „ihre Wege“. „Mir nicht verborgen“ gibt den Sinn der hebräischen Wendung natürlich wieder, ohne die Aussage zu einer abstrakten Umschreibung auszubauen.
- source_word: עֲוֺנָם
  choice: ihre Schuld
  rationale: עָוֹן kann sowohl das schuldhafte Vergehen als auch die daraus erwachsende Schuld bezeichnen. Das deutsche „Schuld“ bewahrt in diesem Zusammenhang einen Teil dieser Bedeutungsbreite.
- source_word: וְלֹא נִצְפַּן … מִנֶּגֶד עֵינָי
  choice: und ihre Schuld ist vor meinen Augen nicht verborgen
  rationale: Die Wiedergabe erhält das anschauliche Bild, dass nichts dem Blick Gottes entzogen ist. Die Wiederholung von „verborgen“ bildet den hebräischen Parallelismus klar und würdig ab.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Wissen
  choice: Das Bild von Gottes Augen wird konkret beibehalten.
  alternative: Abstrakte Wiedergabe wie „Ich sehe alles, was sie tun“ oder „Nichts entgeht mir“.
  rationale: Der hebräische Text beschreibt Gottes umfassende Kenntnis und moralische Prüfung durch körperhafte Bildsprache. Eine abstrakte Paraphrase würde die prophetische Anschaulichkeit abschwächen.
- issue: Bedeutungsumfang von עָוֹן
  choice: „Schuld“
  alternative: „Vergehen“, „Missetat“, „Sünde“
  rationale: Der Kontext lässt sowohl schuldhaftes Tun als auch den Zustand der Schuld anklingen. „Schuld“ wahrt diese Spannung besser als eine eindeutige Festlegung ausschließlich auf Tat oder Schuldzustand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache und der Parallelismus des Hebräischen bleiben erhalten; ungebräuchlich wörtliche Wendungen wie „vor meinem Angesicht“ werden vermieden.
