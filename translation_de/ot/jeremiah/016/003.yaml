  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה עַל הַ/בָּנִים֙ וְ/עַל הַ/בָּנ֔וֹת הַ/יִּלּוֹדִ֖ים בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/עַֽל אִמֹּתָ֞/ם הַ/יֹּלְד֣וֹת אוֹתָ֗/ם וְ/עַל אֲבוֹתָ֛/ם הַ/מּוֹלִדִ֥ים אוֹתָ֖/ם בָּ/אָ֥רֶץ הַ/זֹּֽאת־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
translation:
  language: de
  text: 'Denn so spricht Jahwe über die Söhne und Töchter, die an diesem Ort geboren werden, über ihre Mütter, die sie gebären, und über ihre Väter, die sie in diesem Land zeugen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Weisung ein und bildet den Zusammenhang im Deutschen natürlich ab.
- source_word: כֹה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel in würdigem, geläufigem Deutsch.
- source_word: עַל
  choice: über
  rationale: Kennzeichnet hier bei jeder Personengruppe das Thema der folgenden Aussage, ohne vorschnell eine feindliche Bedeutung wie „gegen“ festzulegen.
- source_word: הַבָּנִים וְהַבָּנוֹת
  choice: die Söhne und Töchter
  rationale: Gibt die ausdrückliche Nennung beider Geschlechter wieder, statt sie zum allgemeineren „Kinder“ zusammenzufassen.
- source_word: הַיִּלּוֹדִים בַּמָּקוֹם הַזֶּה
  choice: die an diesem Ort geboren werden
  rationale: Gibt das passive Partizip und die Ortsangabe klar und natürlich wieder.
- source_word: הַיֹּלְדוֹת אוֹתָם
  choice: die sie gebären
  rationale: Das Qal-Partizip von ילד bezeichnet bei den Müttern das Gebären; die Formulierung ist präzise und wahrt die Parallelität.
- source_word: הַמּוֹלִדִים אוֹתָם
  choice: die sie … zeugen
  rationale: Das Hifil-Partizip von ילד bezeichnet bei den Vätern das Zeugen beziehungsweise Hervorbringen; „zeugen“ ist im Deutschen genau und würdig.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: in diesem Land
  rationale: Gibt אֶרֶץ im räumlichen Kontext Judas als „Land“ wieder und unterscheidet die Wendung von „an diesem Ort“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen in geläufiger deutscher Form wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel und paralleler Satzstruktur. „Söhne und Töchter“ bleibt ausdrücklich erhalten; „gebären“ und „zeugen“ bilden die mütterliche und väterliche Aussage präzise ab.
