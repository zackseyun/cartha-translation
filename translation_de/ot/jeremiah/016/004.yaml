source:
  edition: WLC
  text: מְמוֹתֵ֨י תַחֲלֻאִ֜ים יָמֻ֗תוּ לֹ֤א יִסָּֽפְדוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְי֑וּ וּ/בַ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִכְל֔וּ וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
translation:
  language: de
  text: Sie werden an tödlichen Krankheiten sterben.[a] Niemand wird um sie trauern, und sie werden nicht begraben werden. Auf dem Erdboden werden sie zu Dung. Durch Schwert und Hunger werden sie umkommen, und ihre Leichname werden den Vögeln des Himmels und den Tieren der Erde zum Fraß dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Todesfälle durch Krankheiten“; gemeint ist der Tod infolge schwerer Krankheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵי תַחֲלֻאִים
  choice: an tödlichen Krankheiten
  rationale: Die ungewöhnliche Konstruktverbindung bedeutet wörtlich etwa „Todesfälle durch Krankheiten“ und bezeichnet ein durch schwere Krankheit verursachtes Sterben. Die deutsche Fassung gibt den idiomatischen Sinn natürlich wieder, ohne die Härte abzuschwächen.
- source_word: לֹא יִסָּפְדוּ
  choice: Niemand wird um sie trauern
  rationale: Das Niphal von ספד bezeichnet das Klagen oder die Totenklage. Die unpersönliche deutsche Form gibt das Passiv natürlich wieder.
- source_word: לְדֹמֶן עַל־פְּנֵי הָאֲדָמָה יִהְיוּ
  choice: Auf dem Erdboden werden sie zu Dung
  rationale: דֹּמֶן bezeichnet Dung oder Mist. „Dung“ bewahrt das drastische Bild der entehrten, unbegrabenen Toten; „auf dem Erdboden“ gibt עַל־פְּנֵי הָאֲדָמָה idiomatisch wieder.
- source_word: וּבַחֶרֶב וּבָרָעָב יִכְלוּ
  choice: Durch Schwert und Hunger werden sie umkommen
  rationale: כלה bezeichnet hier das vollständige Zugrundegehen. „Umkommen“ ist im Deutschen natürlich und wahrt Schwert und Hunger als Todesursachen.
- source_word: נִבְלָתָם
  choice: ihre Leichname
  rationale: נְבֵלָה bezeichnet einen leblosen Körper beziehungsweise Kadaver. „Leichname“ passt bei Menschen, bleibt würdevoll genug für den modernen Bibelstil und bewahrt dennoch das Bild der den Aasfressern preisgegebenen Toten.
- source_word: לְמַאֲכָל לְעוֹף הַשָּׁמַיִם וּלְבֶהֱמַת הָאָרֶץ
  choice: den Vögeln des Himmels und den Tieren der Erde zum Fraß dienen
  rationale: „Zum Fraß dienen“ gibt die prädikative Wendung mit לְמַאֲכָל in natürlichem Deutsch wieder. „Vögel des Himmels“ bewahrt die biblische Bildsprache; „Tiere der Erde“ gibt בְּהֵמָה ohne unnötige Einengung wieder.
theological_decisions: []
