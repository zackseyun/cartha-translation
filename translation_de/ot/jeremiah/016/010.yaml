    rationale: Das deutsche Verb »aussprechen« verbindet sich hier natürlicher mit Urteil, Fluch oder Strafe als mit »Unheil«. »Angekündigt« macht den prophetischen Sprechakt verständlich, ohne die Bedeutung des Textes zu verändern.
