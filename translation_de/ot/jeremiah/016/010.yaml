source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
translation:
  language: de
  text: 'Und wenn du diesem Volk alle diese Worte verkündest und sie zu dir sagen: »Warum hat Jahwe all dieses große Unheil gegen uns angekündigt? Was ist unsere Schuld, und was ist unsere Sünde, mit der wir gegen Jahwe, unseren Gott, gesündigt haben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Und wenn
  rationale: Die Wendung führt einen künftig erwarteten Fall ein; „Und wenn“ gibt dies in natürlichem Deutsch wieder.
- source_word: תַגִּיד
  choice: verkündest
  rationale: Der Hifil von נגד bedeutet hier bekannt machen; im prophetischen Zusammenhang wahrt „verkünden“ den öffentlichen und autoritativen Charakter der Mitteilung.
- source_word: לָעָם הַזֶּה
  choice: diesem Volk
  rationale: Bewahrt den kollektiven Singular עָם und die prophetische Ausdrucksweise.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דְּבָרִים bezeichnet hier die zuvor mitgeteilte prophetische Botschaft; „Worte“ erhält ihren sprachlichen Charakter.
- source_word: דִבֶּר יְהוָה עָלֵינוּ
  choice: hat Jahwe … über uns ausgesprochen
  rationale: „Aussprechen über“ gibt das gegen das Volk gerichtete göttliche Urteil idiomatisch wieder, ohne das allgemeinere Verb דבר unnötig zu verengen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen mit der gebräuchlichen Form „Jahwe“ wiedergegeben statt durch einen Titel ersetzt.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: all dieses große Unheil
  rationale: רָעָה bezeichnet hier die angekündigte Katastrophe beziehungsweise das Gericht, nicht moralische Bosheit; „Unheil“ ist würdig und kontextgerecht.
- source_word: עֲוֺנֵנוּ
  choice: unsere Schuld
  rationale: עָוֹן kann sowohl Verfehlung als auch daraus erwachsende Schuld bezeichnen. „Schuld“ bewahrt das moralische Gewicht und unterscheidet den Ausdruck vom folgenden חַטָּאת.
- source_word: חַטָּאתֵנוּ
  choice: unsere Sünde
  rationale: „Sünde“ ist die direkte und geläufige Wiedergabe und hält die Unterscheidung zu עָוֹן soweit möglich aufrecht.
- source_word: אֲשֶׁר חָטָאנוּ לַיהוָה אֱלֹהֵינוּ
  choice: mit der wir gegen Jahwe, unseren Gott, gesündigt haben
  rationale: Bei חטא bezeichnet לְ die Person, gegen die gesündigt wird. Die relative Formulierung bindet den Satz natürlich an „unsere Sünde“ zurück.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Eigennamen. „Jahwe“ bewahrt ihn, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von רָעָה im Gerichtskontext
  choice: Unheil
  alternative: Böses
  rationale: Gemeint ist das angekündigte schwere Gericht, nicht moralische Bosheit. „Unheil“ wahrt den negativen Ernst, ohne Gott moralisches Böses zuzuschreiben.
- issue: Verhältnis von עָוֹן und חַטָּאת
  choice: Schuld und Sünde
  alternative: Vergehen und Sünde
  rationale: Die beiden verwandten Begriffe bleiben unterschieden. „Schuld“ lässt die mögliche Bedeutungsbreite von עָוֹן zwischen Verfehlung und Schuld bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kollektive Singular „diesem Volk“ und die Wiederholung „Sünde … gesündigt“ folgen bewusst der hebräischen Ausdrucksweise. Keine Fußnote ist nötig, da „Unheil“ die kontextuelle Bedeutung von רָעָה klar wiedergibt.
