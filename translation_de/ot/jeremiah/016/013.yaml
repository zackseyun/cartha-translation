source:
  edition: WLC
  text: וְ/הֵטַלְתִּ֣י אֶתְ/כֶ֗ם מֵ/עַל֙ הָ/אָ֣רֶץ הַ/זֹּ֔את עַל הָ/אָ֕רֶץ אֲשֶׁר֙ לֹ֣א יְדַעְתֶּ֔ם אַתֶּ֖ם וַ/אֲבֽוֹתֵי/כֶ֑ם וַ/עֲבַדְתֶּם שָׁ֞ם אֶת אֱלֹהִ֤ים אֲחֵרִים֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֲשֶׁ֛ר לֹֽא אֶתֵּ֥ן לָ/כֶ֖ם חֲנִינָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
translation:
  language: de
  text: Und ich werde euch aus diesem Land hinauswerfen in ein Land, das weder ihr noch eure Väter gekannt haben.[a] Dort werdet ihr Tag und Nacht anderen Göttern dienen,[b] denn ich werde euch keine Gunst erweisen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Vorfahren“. Wörtlich: „eure Väter“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „andere Götter verehren“. Das hebräische Verb bedeutet „dienen“ und kann kultische Verehrung einschließen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „keine Gnade gewähren“. Das hebräische Substantiv bezeichnet Gunst oder gnädige Zuwendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  choice: werde ich euch … hinauswerfen
  rationale: Der Hifil des Verbs bezeichnet ein kraftvolles Werfen beziehungsweise Fortschleudern. „Hinauswerfen“ verbindet diese Härte idiomatisch mit der Vertreibung aus dem Land.
- source_word: מֵעַל הָאָרֶץ הַזֹּאת עַל הָאָרֶץ
  choice: aus diesem Land … in ein Land
  rationale: Die gegensätzlichen Präpositionen beschreiben die Bewegung weg vom bisherigen Land und hin zu einem anderen. Im Deutschen ist „aus … in“ natürlicher als das wörtlichere „von … auf“.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם אַתֶּם וַאֲבוֹתֵיכֶם
  choice: das weder ihr noch eure Väter gekannt haben
  rationale: „Gekannt haben“ gibt ידע schlicht wieder. „Väter“ wahrt die konkrete hebräische Bezeichnung; die mögliche weitere Bedeutung „Vorfahren“ wird in der Fußnote genannt.
- source_word: וַעֲבַדְתֶּם שָׁם אֶת אֱלֹהִים אֲחֵרִים
  choice: Dort werdet ihr … anderen Göttern dienen
  rationale: עבד bedeutet „dienen“ und kann beim Dienst an Göttern auch kultische Verehrung einschließen. „Dienen“ bewahrt die größere Bedeutungsbreite und die Spannung, ob freiwillige Verehrung, erzwungene Anpassung oder beides gemeint ist.
- source_word: יוֹמָם וָלַיְלָה
  choice: Tag und Nacht
  rationale: Die feste Wendung wird direkt und im Deutschen idiomatisch wiedergegeben; sie bezeichnet unablässige Dauer.
- source_word: אֲשֶׁר לֹא אֶתֵּן לָכֶם חֲנִינָה
  choice: denn ich werde euch keine Gunst erweisen
  rationale: חֲנִינָה bezeichnet Gunst oder gnädige Zuwendung. „Gunst erweisen“ ist verständlich und vermeidet eine unnötige dogmatische Engführung; אֲשֶׁר wird hier kontextgemäß kausal verstanden.
theological_decisions:
- issue: Bedeutungsumfang von וַאֲבוֹתֵיכֶם
  choice: eure Väter
  alternative: eure Vorfahren
  rationale: Der hebräische Text nennt ausdrücklich die „Väter“. Zugleich kann die Bezeichnung im Zusammenhang die Vorfahren insgesamt meinen; diese Möglichkeit bleibt durch die Fußnote offen.
- issue: Art des Dienstes an anderen Göttern
  choice: anderen Göttern dienen
  alternative: andere Götter verehren
  rationale: „Dienen“ bildet das hebräische Verb breiter ab und legt nicht fest, ob kultische Verehrung, gesellschaftlich erzwungener Dienst oder beides im Blick ist.
- issue: Verknüpfung des letzten Relativsatzes
  choice: denn ich werde euch keine Gunst erweisen
  alternative: sodass ich euch keine Gunst erweisen werde
  rationale: Das einleitende אֲשֶׁר kann hier kontextuell kausal beziehungsweise folgernd verstanden werden. „Denn“ gibt den naheliegenden Begründungszusammenhang wieder, ohne die Gerichtsaussage abzuschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hinauswerfen“ bewahrt die Gewalt der angekündigten Vertreibung, ohne unnatürlich zu klingen. Die Satzfolge wurde für klare deutsche Lesbarkeit in zwei Sätze gegliedert; „Tag und Nacht“ steht unmittelbar beim Verb, wie es im Deutschen üblich ist.
