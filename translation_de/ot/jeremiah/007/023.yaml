  text: כִּ֣י אִֽם אֶת הַ/דָּבָ֣ר הַ֠/זֶּה צִוִּ֨יתִי אוֹתָ֤/ם לֵ/אמֹר֙ שִׁמְע֣וּ בְ/קוֹלִ֔/י וְ/הָיִ֤יתִי לָ/כֶם֙ לֵֽ/אלֹהִ֔ים וְ/אַתֶּ֖ם תִּֽהְיוּ לִ֣/י לְ/עָ֑ם וַ/הֲלַכְתֶּ֗ם בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אֲצַוֶּ֣ה אֶתְ/כֶ֔ם לְמַ֖עַן יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/023.yaml
  text: 'But this command I gave them: ‘Listen to my voice[a], and I will be your God, and you shall be my people; and walk in all the way that I command you, so that it may go well with you.’'
translation:
  language: de
  text: 'Sondern dieses Gebot gab ich ihnen: »Hört auf meine Stimme[a], und ich werde euer Gott sein, und ihr werdet mein Volk sein. Geht auf dem ganzen Weg, den ich euch gebiete, damit es euch gut geht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gehorcht meiner Stimme.« Die hebräische Wendung »auf meine Stimme hören« schließt häufig ein, dem Gehörten zu gehorchen.'
    reason: Lexikalische Bedeutungsnuance der hebräischen Wendung.
lexical_decisions:
- source_word: כִּי אִם
  choice: Sondern
  rationale: 'Die Wendung führt nach der Verneinung in Vers 22 eine kontrastierende Richtigstellung ein: nicht das zuvor Genannte, sondern das Folgende.'
- source_word: הַדָּבָר הַזֶּה
  choice: dieses Gebot
  rationale: דָּבָר kann »Wort«, »Sache« oder »Anordnung« bedeuten; zusammen mit צִוִּיתִי bezeichnet es hier den Inhalt eines Gebots.
- source_word: צִוִּיתִי אוֹתָם לֵאמֹר
  choice: gab ich ihnen
  rationale: In Verbindung mit »dieses Gebot« gibt diese Formulierung den Befehlscharakter natürlich wieder und vermeidet die schwerfällige Wiederholung »dieses Gebot gebot ich ihnen«.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Hört auf meine Stimme
  rationale: Die hebräische Wendung bedeutet wörtlich »hört auf meine Stimme« und schließt im Bundeszusammenhang gehorsames Befolgen ein, ohne dass diese Bedeutungsnuance im Haupttext ausdrücklich festgelegt werden muss.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: dann werde ich euer Gott sein
  rationale: Die geläufige deutsche Bundesformel gibt die relationale Aussage klar wieder. »Dann« macht den Zusammenhang mit dem vorausgehenden Aufruf idiomatisch verständlich, ohne eine zusätzliche Bedingung einzuführen.
- source_word: וְאַתֶּם תִּהְיוּ לִי לְעָם
  choice: und ihr werdet mein Volk sein
  rationale: Die Formulierung bewahrt die wechselseitige Bundesformel in natürlichem, würdigem Deutsch.
- source_word: וַהֲלַכְתֶּם בְּכָל הַדֶּרֶךְ
  choice: Geht den ganzen Weg
  rationale: Die ethische Wegmetapher wird bewahrt; כָּל mit dem singularischen bestimmten »Weg« bezeichnet dessen ganze, umfassende Ausrichtung.
- source_word: אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: den ich euch gebiete
  rationale: Das hebräische Imperfekt kann hier gegenwärtig-allgemein oder zukünftig verstanden werden. Das deutsche Präsens passt zu einer fortdauernden Bundesweisung und lässt den zeitlichen Umfang offen.
- source_word: לְמַעַן יִיטַב לָכֶם
  choice: damit es euch gut geht
  rationale: Die geläufige deutsche Wendung gibt sowohl die Zielangabe von לְמַעַן als auch das zugesagte Wohlergehen klar wieder.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: »Dann werde ich euer Gott sein, und ihr werdet mein Volk sein.«
  alternative: »Ich werde euch zum Gott sein, und ihr werdet mir zum Volk sein.«
  rationale: Die gewählte Fassung bewahrt den gegenseitigen, relationalen Charakter der hebräischen Bundesformel, ohne über den Text hinausgehende dogmatische Bestimmungen einzutragen.
- issue: Gehorsamsnuance in שִׁמְעוּ בְקוֹלִי
  choice: Im Haupttext »Hört auf meine Stimme«
  alternative: »Gehorcht meiner Stimme«
  rationale: Das Verb bezeichnet zunächst Hören, während die feste Wendung zugleich gehorsames Befolgen nahelegt. Der Haupttext erhält das hebräische Bild; die Fußnote weist auf die mögliche explizitere Wiedergabe hin.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die biblische Wegmetapher und die Bundesformel bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
