source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּה אָמַ֣ר אֲדֹנָ֣/י יְהֹוִ֗ה הִנֵּ֨ה אַפִּ֤/י וַֽ/חֲמָתִ/י֙ נִתֶּ֨כֶת֙ אֶל הַ/מָּק֣וֹם הַ/זֶּ֔ה עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַל עֵ֥ץ הַ/שָּׂדֶ֖ה וְ/עַל פְּרִ֣י הָֽ/אֲדָמָ֑ה וּ/בָעֲרָ֖ה וְ/לֹ֥א תִכְבֶּֽה־׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/020.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], my anger and my wrath are being poured out on this place, on man and on beast, on the trees of the field and on the fruit of the ground; it will burn and will not be quenched.'
translation:
  language: de
  text: 'Darum spricht der Herr Yahweh: Siehe, mein Zorn und meine Zornesglut ergießen sich über diesen Ort, über Mensch und Tier, über die Bäume des Feldes und über die Frucht des Erdbodens; diese Zornesglut wird brennen und nicht erlöschen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorangehenden Anklage und klingt im modernen prophetischen Deutsch natürlich und nachdrücklich.
- source_word: כֹּה אָמַר
  choice: so spricht
  rationale: Bewahrt die vertraute prophetische Botenformel in würdigem, verständlichem Deutsch.
- source_word: אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  rationale: Gibt sowohl den Herrschertitel אֲדֹנָי als auch den Gottesnamen יהוה wieder und vermeidet die missverständliche Doppelung „Herr HERR“.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Erhält das feierliche Aufmerksamkeitssignal der göttlichen Ankündigung; „Schaut“ wäre hier unnötig umgangssprachlich.
- source_word: אַפִּי וַחֲמָתִי
  choice: mein Zorn und mein Grimm
  rationale: Bewahrt die Doppelung und ihre Steigerung, ohne beide hebräischen Ausdrücke mit demselben deutschen Wort wiederzugeben.
- source_word: נִתֶּכֶת
  choice: ergießen sich
  rationale: Die feminine Singularform fasst das zweiteilige Subjekt kollektiv auf. Das deutsche Präsens gibt die unmittelbar bevorstehende beziehungsweise bereits einsetzende Strafhandlung lebendig wieder.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: über diesen Ort
  rationale: Bei einem Ausgießen des Zorns bezeichnet אֶל das Ziel; „über“ entspricht der deutschen Bildsprache.
- source_word: הָאָדָם וְעַל הַבְּהֵמָה
  choice: über Mensch und Tier
  rationale: Die beiden Singularformen haben hier generische beziehungsweise kollektive Kraft. „Mensch und Tier“ ist formnah und im Deutschen idiomatisch.
- source_word: עֵץ הַשָּׂדֶה
  choice: die Bäume des Feldes
  rationale: Der hebräische Singular ist kollektiv; im Deutschen macht der Plural diesen Sinn natürlich deutlich.
- source_word: פְּרִי הָאֲדָמָה
  choice: die Frucht des Erdbodens
  rationale: Bewahrt das landwirtschaftliche Bild und unterscheidet אֲדָמָה klar von dem zuvor genannten אָדָם.
- source_word: וּבָעֲרָה וְלֹא תִכְבֶּה
  choice: Er wird brennen und nicht erlöschen
  rationale: Das feminine Pronomen bezieht sich am natürlichsten auf den zuvor genannten Zorn beziehungsweise die Zornesglut. „Nicht erlöschen“ bewahrt die Feuerbildsprache.
theological_decisions:
- issue: Wiedergabe der Verbindung אֲדֹנָי יְהוִה
  choice: der Herr, Yahweh
  alternative: Gott, der Herr
  rationale: Die gewählte Fassung lässt sowohl den Titel als auch den im Konsonantentext stehenden Eigennamen erkennen, ohne die Beziehung beider Elemente dogmatisch auszudeuten.
- issue: Bezug des femininen וּבָעֲרָה („sie/es wird brennen“)
  choice: Er wird brennen
  alternative: Sie wird brennen
  rationale: 'Das grammatische Femininum lässt sich auf חֵמָה, die Zornesglut, beziehen; im Deutschen wird der gesamte vorausgehende Zorn mit dem maskulinen Pronomen „er“ aufgenommen. Die Bildaussage bleibt dieselbe: Gottes Zorn brennt unauslöschlich.'
- issue: Generische Bedeutung von הָאָדָם
  choice: Mensch
  alternative: die Menschen
  rationale: Der Singular des Hebräischen wird bewahrt, während „Mensch“ im Deutschen in der Paarung „Mensch und Tier“ eindeutig generisch und nicht geschlechtsspezifisch verstanden wird.
translation_notes:
  register: Feierlicher, prophetischer Ton in modernem Standarddeutsch. Die traditionelle Formel „so spricht“ und das Aufmerksamkeitssignal „Siehe“ bleiben wegen ihrer Textfunktion erhalten; Syntax und Wortwahl sind ansonsten gegenwärtig und allgemein verständlich.
