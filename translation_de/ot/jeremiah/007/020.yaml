  to: 'Darum spricht der Herr Yahweh: Siehe, mein Zorn und meine Zornesglut ergießen sich über diesen Ort, über Mensch und Tier, über die Bäume des Feldes und über die Frucht des Erdbodens; diese Zornesglut wird brennen und nicht erlöschen.'
