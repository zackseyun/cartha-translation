id: JER.7.3
reference: Jeremiah 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הֵיטִ֥יבוּ דַרְכֵי/כֶ֖ם וּ/מַֽעַלְלֵי/כֶ֑ם וַ/אֲשַׁכְּנָ֣ה אֶתְ/כֶ֔ם בַּ/מָּק֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/003.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Make your ways and your deeds good[b], and I will let you dwell in this place.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen, der Gott Israels: Bessert eure Wege und eure Taten[a], dann werde ich euch an diesem Ort wohnen lassen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ändert euren Lebenswandel und eure Taten zum Guten.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dann werde ich euch an diesem Ort bleiben lassen“; auch möglich: „dann werde ich euch an diesem Ort ansiedeln“.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in natürlichem, zugleich feierlichem Deutsch wiedergegeben.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen als Namen wieder; „der Heerscharen“ bewahrt die semantische Weite des traditionellen Gottestitels, ohne ihn auf irdische Armeen zu verengen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und natürliche Wiedergabe der hebräischen Genitivverbindung.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  choice: Bessert eure Wege und eure Taten
  rationale: Der Imperativ fordert eine tatsächliche moralische Neuorientierung. „Wege“ erhält das hebräische Bild für den Lebenswandel, und „Taten“ bezeichnet das konkrete Handeln.
- source_word: וַאֲשַׁכְּנָה אֶתְכֶם
  choice: dann werde ich euch … wohnen lassen
  rationale: Das deutsche „wohnen lassen“ kann sowohl Ermöglichung als auch Fortdauer ausdrücken und wahrt damit die Spannweite des Hifil von שכן im Kontext. „Dann“ macht den sachlichen Folgezusammenhang nach der Aufforderung deutlich.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: „Ort“ bewahrt die mögliche Bezugnahme auf Tempel, Jerusalem oder das weitere Land, ohne sie vorschnell einzuengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von וַאֲשַׁכְּנָה אֶתְכֶם im Bundes- und Gerichtskontext
  choice: dann werde ich euch an diesem Ort wohnen lassen
  alternative: dann werde ich euch an diesem Ort bleiben lassen / ansiedeln
  rationale: Die gewählte Formulierung lässt offen, ob vor allem Gottes bewirkendes Handeln oder seine Erlaubnis zum weiteren Verbleib gemeint ist, und löst diese theologische Spannung nicht einseitig auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Sprachform. Die Wendung „eure Wege“ erhält bewusst das hebräische Lebensweg-Bild; die Fußnoten erläutern idiomatischere beziehungsweise semantisch mögliche Alternativen.
