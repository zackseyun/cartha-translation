source:
  edition: WLC
  text: וְ/ל֤וֹא שָׁמְעוּ֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם הֵרֵ֖עוּ מֵ/אֲבוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/026.yaml
  text: Yet they did not listen to me[a], and they did not incline their ear, but they stiffened their neck[b]; they acted more wickedly than their fathers.
translation:
  language: de
  text: Doch sie hörten nicht auf mich und neigten ihr Ohr nicht[a], sondern machten ihren Nacken steif; sie handelten noch schlimmer als ihre Vorfahren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „neigten ihr Ohr nicht“; eine bildhafte Wendung für aufmerksames Zuhören.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „ihre Väter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֵלַי
  choice: hörten nicht auf mich
  rationale: שׁמע mit אֶל bezeichnet hier nicht bloß akustisches Hören, sondern aufmerksames Hören und Beachten. „Auf mich hören“ bewahrt im Deutschen sowohl den Hörvorgang als auch den mitschwingenden Gedanken des Gehorsams, ohne ausschließlich mit „gehorchen“ zu übersetzen.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: neigten ihr Ohr nicht
  rationale: Die bildhafte hebräische Wendung bezeichnet aufmerksames Zuhören. Die deutsche Formulierung erhält das Körperbild und die Parallelität zum vorangehenden Hören.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: machten ihren Nacken steif
  rationale: Die hebräische Metapher beschreibt hartnäckige Widersetzlichkeit. Die bildnahe Wiedergabe bleibt verständlich und vermeidet die rein deutende Übersetzung „sie waren halsstarrig“.
- source_word: הֵרֵעוּ
  choice: sie handelten noch schlimmer
  rationale: Der Hifil von רעע drückt hier böses beziehungsweise schlimmes Handeln aus. Durch das folgende מִן ist der Vergleich ausdrücklich; „noch schlimmer“ gibt ihn natürlich wieder.
- source_word: מֵאֲבוֹתָם
  choice: als ihre Vorfahren
  rationale: אָבוֹת kann leibliche Väter oder frühere Generationen beziehungsweise Vorfahren bezeichnen. Im geschichtlichen Zusammenhang ist „Vorfahren“ im heutigen Deutsch klar und schließt die früheren Generationen Israels ein.
- source_word: וְלֹא ... וְלֹא ... וַ
  choice: Doch ... und ... sondern ...
  rationale: Die Verknüpfungen führen die Erzählung fort und tragen im Kontext einen Gegensatz zur vorausgehenden Aufforderung. „Doch“ und „sondern“ machen diesen rhetorischen Kontrast im Deutschen deutlich.
theological_decisions:
- issue: Bedeutungsumfang von שׁמע
  choice: hörten nicht auf mich
  alternative: gehorchten mir nicht
  rationale: Die gewählte Fassung lässt sowohl das Hören als auch das darin angelegte Beachten und Gehorchen erkennen, ohne die lexikalische und theologische Spannung auf den Gehorsamsaspekt zu verengen.
- issue: Bezug von אָבוֹת
  choice: Vorfahren
  alternative: Väter
  rationale: Der Vers vergleicht die angesprochene Generation mit früheren Generationen. „Vorfahren“ bringt diesen möglichen Kollektivbezug im modernen Deutsch klar zum Ausdruck; die formnähere Alternative wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden hebräischen Körperbilder vom geneigten Ohr und steifen Nacken bleiben erhalten; die Satzverknüpfung ist für einen natürlichen deutschen Lesefluss leicht geglättet.
