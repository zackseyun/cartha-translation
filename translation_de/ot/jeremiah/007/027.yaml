source:
  edition: WLC
  text: וְ/דִבַּרְתָּ֤ אֲלֵי/הֶם֙ אֶת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/לֹ֥א יִשְׁמְע֖וּ אֵלֶ֑י/ךָ וְ/קָרָ֥אתָ אֲלֵי/הֶ֖ם וְ/לֹ֥א יַעֲנֽוּ/כָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/027.yaml
  text: You shall speak all these words to them[a], but they will not listen to you; you shall call to them, but they will not answer you.
translation:
  language: de
  text: Du sollst ihnen alle diese Worte sagen, aber sie werden nicht auf dich hören.[a] Du sollst ihnen zurufen, aber sie werden dir nicht antworten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »doch sie werden dich nicht anhören« beziehungsweise »dir nicht gehorchen«. Das hebräische Verb שׁמע kann je nach Zusammenhang hören, zuhören oder gehorchen bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֲלֵיהֶם
  choice: Du sollst ihnen … sagen
  rationale: Das Qal Perfekt 2. Person Singular mit וְ hat hier im prophetischen Auftrag auffordernd-zukünftige Kraft. Die deutsche Formulierung bewahrt den Weisungscharakter und gibt אֶל als Hinwendung zu den Adressaten wieder.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דְּבָרִים kann »Worte«, »Dinge« oder »Angelegenheiten« bedeuten. Im Zusammenhang der prophetischen Verkündigung ist »Worte« am treffendsten.
- source_word: וְלֹא יִשְׁמְעוּ אֵלֶיךָ
  choice: aber sie werden nicht auf dich hören
  rationale: שׁמע mit אֶל bezeichnet hier das Hören auf jemanden und kann zugleich das Beachten oder Gehorchen einschließen. »Auf dich hören« erhält diese Bedeutungsbreite im natürlichen Deutschen; »aber« macht den sachlichen Gegensatz deutlich.
- source_word: וְקָרָאתָ אֲלֵיהֶם
  choice: Du sollst sie rufen
  rationale: קרא mit אֶל bedeutet, jemanden anzurufen beziehungsweise zu rufen. »Sie rufen« bleibt direkt und legt weder besondere Lautstärke noch eine förmliche Proklamation fest.
- source_word: וְלֹא יַעֲנוּכָה
  choice: aber sie werden dir nicht antworten
  rationale: ענה im Qal bedeutet gewöhnlich »antworten« oder »reagieren«. Der pronominale Bezug wird im Deutschen idiomatisch mit »dir« wiedergegeben.
