  naturalness: »Du sollst ihnen zurufen« ist in diesem Zusammenhang idiomatisch und verdeutlicht die im Hebräischen ausgedrückte Ausrichtung des Rufes. Die übrige Formulierung ist modernes, würdiges Standarddeutsch.
