id: JER.7.16
reference: Jeremiah 7:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אַל תִּתְפַּלֵּ֣ל בְּעַד הָ/עָ֣ם הַ/זֶּ֗ה וְ/אַל תִּשָּׂ֧א בַעֲדָ֛/ם רִנָּ֥ה וּ/תְפִלָּ֖ה וְ/אַל תִּפְגַּע בִּ֑/י כִּי אֵינֶ֥/נִּי שֹׁמֵ֖עַ אֹתָֽ/ךְ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/016.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, and do not intercede with me[b], for I am not listening to you.
translation:
  language: de
  text: Du aber, bete nicht für dieses Volk. Erhebe für sie weder Flehruf noch Gebet und flehe mich nicht an[a]; denn ich höre dir nicht zu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bestürme mich nicht“ beziehungsweise „tritt bei mir nicht für sie ein“. Das hebräische Verb kann dringendes Bitten oder Fürsprache bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn ich werde dich nicht erhören“. Die hebräische Form kann eine fortdauernde Weigerung oder im Zusammenhang eine feststehende zukünftige Ablehnung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die selbstständige Anrede mit וְ markiert einen Gegensatz und hebt Jeremia persönlich hervor; „Du aber“ gibt dies knapp und natürlich wieder.
- source_word: אַל תִּתְפַּלֵּל
  choice: bete nicht
  rationale: אַל mit dem Imperfekt formuliert hier ein direktes Verbot.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: für dieses Volk
  rationale: בְּעַד bezeichnet das Beten zugunsten beziehungsweise im Namen des Volkes.
- source_word: וְאַל תִּשָּׂא בַעֲדָם רִנָּה וּתְפִלָּה
  choice: Erhebe für sie weder Flehruf noch Gebet
  rationale: „Erhebe“ bewahrt das Bild von נשׂא. „Flehruf“ bringt bei רִנָּה den hörbaren, dringlichen Ruf im Gebetszusammenhang zum Ausdruck, ohne ihn als Jubel oder Klage festzulegen. „Weder … noch“ gibt die umfassende Kraft der verbundenen Verbote idiomatisch wieder.
- source_word: וְאַל תִּפְגַּע בִּי
  choice: und flehe mich nicht an
  rationale: פגע kann im Hifil dringendes Bitten oder vermittelnde Fürsprache bezeichnen. Im Zusammenhang des Gebets ist „anflehen“ verständlich und lässt die Eindringlichkeit erkennen.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ אֹתָךְ
  choice: denn ich höre dir nicht zu
  rationale: Die verneinte Partizipialform bezeichnet hier Gottes gegenwärtige beziehungsweise andauernde Weigerung, auf Jeremias Fürbitte zu hören. Die Formulierung vermeidet eine rein akustische Deutung.
theological_decisions:
- issue: Art des Verbots, für das Volk einzutreten
  choice: Ein unmittelbares und nachdrückliches Verbot prophetischer Fürbitte in der gegenwärtigen Gerichtssituation
  alternative: Eine bloß rhetorische oder übertreibende Warnung
  rationale: Die dreifache Verbotsform mit אַל und die abschließende Begründung stellen das Verbot als ernst und tatsächlich geltend dar. Über seine Reichweite außerhalb dieser Situation wird nichts hinzugefügt.
- issue: Zeitlicher Sinn von Gottes Nichthören
  choice: 'Gegenwärtige beziehungsweise andauernde Weigerung: „ich höre dir nicht zu“'
  alternative: 'Zukünftige Aussage: „ich werde dich nicht erhören“'
  rationale: Das hebräische Partizip stützt einen fortdauernden Sinn, kann im Zusammenhang jedoch auch als feste zukünftige Ablehnung verstanden werden; diese Möglichkeit bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze bewahren den Nachdruck der dreifachen Verbotsfolge. „Flehruf“ ist gehoben, aber allgemein verständlich; „ich höre dir nicht zu“ formuliert die bewusste göttliche Ablehnung in natürlichem Gegenwartsdeutsch.
