  terminology: „Jahwe“ gibt יְהוָה konsequent wieder; „Haus Jahwes“ bewahrt die hebräische Ausdrucksweise. Die Fußnote benötigt jedoch die Richtungs- bzw. Beziehungsangabe „vor Jahwe“, damit die Geste und ihr Adressat klar wiedergegeben werden.
