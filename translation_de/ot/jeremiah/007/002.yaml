  text: עֲמֹ֗ד בְּ/שַׁ֨עַר֙ בֵּ֣ית יְהוָ֔ה וְ/קָרָ֣אתָ שָּׁ֔ם אֶת הַ/דָּבָ֖ר הַ/זֶּ֑ה וְ/אָמַרְתָּ֞ שִׁמְע֣וּ דְבַר יְהוָ֗ה כָּל יְהוּדָה֙ הַ/בָּאִים֙ בַּ/שְּׁעָרִ֣ים הָ/אֵ֔לֶּה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/002.yaml
  text: Stand in the gate of the house of Yahweh[a], and proclaim there this word, and say, “Hear the word of Yahweh, all Judah, who enter through these gates to worship Yahweh.”
translation:
  language: de
  text: 'Stell dich an das Tor des Hauses Jahwes und verkünde dort dieses Wort. Sprich: »Hört das Wort Jahwes, ihr alle aus Juda, die ihr durch diese Tore kommt, um Jahwe anzubeten[a]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um euch vor Jahwe niederzuwerfen“. Das hebräische Verb kann besonders bei der Anbetung das körperliche Niederwerfen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: Stell dich
  rationale: Der Imperativ fordert Jeremia auf, einen bestimmten Platz einzunehmen. „Stell dich“ ist im modernen Deutsch natürlicher als das statischere „Steh“.
- source_word: בְּשַׁעַר
  choice: an das Tor
  rationale: Die Präposition ב kann hier die Lage am beziehungsweise im Torbereich bezeichnen. „An das Tor“ gibt den Ort am Tempelzugang natürlich wieder, ohne eine genaue Position innerhalb des Torbaus festzulegen.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bewahrt das hebräische Bild; „Tempel Jahwes“ wäre sachlich möglich, aber weniger formnah.
- source_word: וְקָרָאתָ
  choice: verkünde
  rationale: קרא bezeichnet in diesem prophetischen Zusammenhang das öffentliche Ausrufen einer Botschaft.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: dieses Wort
  rationale: Die Wiedergabe wahrt den Singular und die prophetische Redeweise; „diese Botschaft“ wäre eine dynamischere Alternative.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  choice: Hört das Wort Jahwes
  rationale: Dies erhält die geläufige prophetische Aufforderungsformel und den Imperativ שמע.
- source_word: כָּל יְהוּדָה
  choice: ihr alle aus Juda
  rationale: Juda wird kollektiv angeredet. Die explizite Anrede mit „ihr“ verbindet sich im Deutschen natürlich mit dem folgenden Relativsatz.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: die ihr durch diese Tore kommt
  rationale: Das Partizip bezeichnet die angesprochene Gruppe. „Durch diese Tore kommt“ gibt die Bewegung zum Gottesdienst in idiomatischem Deutsch wieder.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: um … anzubeten
  rationale: Das Verb bezeichnet das Sich-Niederwerfen als Huldigung oder Verehrung. „Anbeten“ gibt hier den kultischen Zweck natürlich wieder; die körperliche Grundbedeutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von השתחוה
  choice: anbeten
  alternative: sich vor Jahwe niederwerfen
  rationale: Im Tempelkontext bezeichnet das Verb gottesdienstliche Verehrung, enthält aber zugleich die konkrete Vorstellung des Niederwerfens. Die Hauptübersetzung ist natürlich, während die Fußnote die körperliche Nuance offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Befehlsfolge bleibt klar, wird jedoch in natürliche deutsche Sätze gegliedert. Der Gottesname erscheint als „Jahwe“; die kultische und körperliche Bedeutungsbreite von השתחוה bleibt durch die Fußnote sichtbar.
