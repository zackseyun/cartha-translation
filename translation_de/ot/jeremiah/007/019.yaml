  text: הַ/אֹתִ֛/י הֵ֥ם מַכְעִסִ֖ים נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֹתָ֔/ם לְמַ֖עַן בֹּ֥שֶׁת פְּנֵי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/019.yaml
  text: Is it I whom they are provoking? declares Yahweh. Is it not themselves[a], to the shame of their own faces?
translation:
  language: de
  text: „Bin ich es, den sie zum Zorn reizen?“, spricht Jahwe. „Sind es nicht sie selbst – zu ihrer eigenen Schande?“[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zur Schande ihrer Gesichter“. Auch möglich, idiomatischer: „Reizen sie nicht sich selbst zum Zorn – zu ihrer eigenen Schande?“'
    reason: Die Fußnote bewahrt das hebräische Bild der beschämten Gesichter und dokumentiert die idiomatische Auflösung der elliptischen zweiten Frage.
lexical_decisions:
- source_word: הַאֹתִי
  choice: Bin ich es, den
  rationale: Die vorangestellte Objektform mit Fragepartikel wird als betonte rhetorische Frage wiedergegeben und bewahrt so den Kontrast zwischen Jahwe und den Handelnden.
- source_word: מַכְעִסִים
  choice: zum Zorn reizen
  rationale: Der Hifil von כעס bezeichnet das Hervorrufen von Zorn beziehungsweise das Provozieren; die gewählte Wendung ist im Deutschen natürlich und semantisch präzise.
- source_word: נְאֻם יְהוָה
  choice: erklärt Jahwe
  rationale: Die feste prophetische Botenformel erhält eine gewichtige, aber gegenwärtig verständliche deutsche Wiedergabe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname und in der im Deutschen üblichen Form transliteriert, nicht durch einen Titel ersetzt.
- source_word: הֲלוֹא
  choice: Sind es nicht vielmehr
  rationale: Die rhetorische Frage erwartet Zustimmung; „vielmehr“ verdeutlicht den im Kontext angelegten Gegensatz, ohne die Aussage als bloße Feststellung umzubauen.
- source_word: אֹתָם
  choice: sie selbst
  rationale: Formal steht „sie“ als Objekt; die reflexive Wiedergabe macht verständlich, dass ihr Handeln auf sie selbst zurückfällt, und erhält zugleich die rhetorische Ellipse.
- source_word: לְמַעַן בֹּשֶׁת פְּנֵיהֶם
  choice: zu ihrer eigenen Schande
  rationale: Die Wendung bezeichnet die beschämende Folge beziehungsweise Zielrichtung ihres Handelns. Die idiomatische Haupttextfassung vermeidet im Deutschen die missverständliche wörtliche Form „Schande ihres Gesichts“; diese Bildlichkeit wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text gebraucht den Gottesnamen. „Jahwe“ bewahrt ihn als Namen und entspricht der üblichen deutschen Transliterationsform.
- issue: Wen das götzendienerische Handeln letztlich trifft
  choice: sie selbst
  alternative: sie
  rationale: Das objektmarkierte Pronomen אֹתָם lautet formal „sie“, steht aber im ausdrücklichen Gegensatz zu „mich“. „Sie selbst“ gibt die rückwirkende Folge ihres Handelns wieder, ohne zu behaupten, dass Jahwe überhaupt nicht erzürnt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden rhetorischen Fragen und die starke Gegenüberstellung von „ich“ und „sie selbst“ bleiben erhalten. Der Gedankenstrich markiert die knappe, spannungsvolle Folgeangabe des Hebräischen.
