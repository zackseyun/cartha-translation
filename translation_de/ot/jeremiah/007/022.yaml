source:
  edition: WLC
  text: כִּ֠י לֹֽא דִבַּ֤רְתִּי אֶת אֲבֽוֹתֵי/כֶם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם בְּ/י֛וֹם הוציא אוֹתָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם עַל דִּבְרֵ֥י עוֹלָ֖ה וָ/זָֽבַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/022.yaml
  text: For I did not speak to your fathers or command them on the day I brought them out of the land of Egypt concerning burnt offering and sacrifice[a][b][c].
translation:
  language: de
  text: Denn am Tag, als ich sie aus dem Land Ägypten herausführte, sprach ich nicht zu euren Vorfahren und gab ihnen keine Gebote über Brandopfer und Schlachtopfer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn ich sprach nicht zu euren Vorfahren und gab ihnen keine Gebote über Brandopfer und Schlachtopfer am Tag, als ich sie aus dem Land Ägypten herausführte.“'
    reason: Die Zeitangabe kann im Deutschen auch nachgestellt werden. Die vorangestellte Fassung macht ihren Bezug auf beide Verben besonders klar.
  - marker: b
    text: Die Aussage verneint im Hebräischen scharf und ohne ausdrückliche Einschränkung. Im Zusammenhang hebt sie den Gehorsam gegenüber Gottes Stimme als zentrale Bundesforderung hervor (vgl. Vers 23), statt die Spannung durch „in erster Linie“ im Text aufzulösen.
    reason: Bewahrt die theologische und rhetorische Spannung des Ausgangstextes, ohne eine harmonisierende Ergänzung in den Haupttext einzutragen.
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorausgehende Mahnung ein und bewahrt den argumentativen Zusammenhang.
- source_word: לֹא דִבַּרְתִּי אֶת אֲבוֹתֵיכֶם
  choice: ich habe zu euren Vorfahren nicht … gesprochen
  rationale: Gibt die ausdrückliche Verneinung direkt wieder; „Vorfahren“ ist im heutigen Standarddeutsch natürlicher und ebenso historisch passend wie „Väter“.
- source_word: וְלֹא צִוִּיתִים
  choice: und ihnen darüber keine Gebote gegeben
  rationale: Gibt צוה als verbindliches Gebieten wieder. „darüber“ macht im Deutschen deutlich, dass das folgende Thema beide parallelen Verben bestimmt.
- source_word: בְּיוֹם הוציא אוֹתָם מֵאֶרֶץ מִצְרָיִם
  choice: als ich sie aus dem Land Ägypten herausführte
  rationale: בְּיוֹם kann idiomatisch den Zeitpunkt des gesamten Auszugsgeschehens bezeichnen; „als“ ist natürliches modernes Deutsch, ohne einen einzelnen Kalendertag zu erzwingen.
- source_word: עַל דִּבְרֵי
  choice: über … / darüber
  rationale: Kennzeichnet den Gegenstand des Sprechens und Gebietens. Die geteilte Wiedergabe vermeidet eine schwerfällige deutsche Satzstellung.
- source_word: עוֹלָה
  choice: Brandopfer
  rationale: Etablierte deutsche Bezeichnung für das vollständig auf dem Altar verbrannte Opfer.
- source_word: וָזָבַח
  choice: und Schlachtopfer
  rationale: זבח bezeichnet hier als kollektive Opferkategorie das geschlachtete Opfer und steht parallel zu עוֹלָה.
theological_decisions:
- issue: Ob der Vers so wiederzugeben ist, als habe Gott niemals Opfergebote erlassen.
  choice: Die schroffe Verneinung des Hebräischen bleibt im Haupttext bestehen.
  alternative: 'Eine relative Gewichtung ausdrücklich einfügen, etwa: „Nicht in erster Linie über Brand- und Schlachtopfer …“'
  rationale: Der Ausgangstext formuliert keine Einschränkung wie „in erster Linie“. Die prophetische Spannung zwischen Gehorsam und Opferkult darf nicht durch einen Zusatz im Haupttext aufgelöst werden; der folgende Vers legt den rhetorischen Schwerpunkt auf das Hören auf Gottes Stimme.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorfahren“ vermeidet das heute missverständliche „Väter“. Die Satzstellung ist idiomatisch geglättet, während die starke Verneinung und die beiden Opferbegriffe erhalten bleiben.
