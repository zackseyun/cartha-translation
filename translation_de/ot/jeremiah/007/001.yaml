  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: Die traditionelle und kontextgerechte Wiedergabe bezeichnet hier eine göttliche Botschaft.
- source_word: הָיָה אֶל־יִרְמְיָהוּ
  choice: das … an Jeremia erging
  rationale: Die idiomatische deutsche Prophetenformel gibt das Eintreffen der Botschaft natürlich und würdig wieder.
- source_word: מֵאֵת יְהוָה
  choice: von dem HERRN
  rationale: מֵאֵת kennzeichnet den Urheber bzw. Ausgangspunkt; das Tetragramm wird der etablierten deutschen Bibelkonvention entsprechend mit HERR wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv leitet den nachfolgenden Wortlaut ein; ein Doppelpunkt erfüllt diese Funktion im modernen Deutschen ohne das schwerfällige „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die typografisch hervorgehobene traditionelle Wiedergabe wahrt die jüdische Lesetradition und stimmt mit der geprüften Konsultationsfassung überein, ohne eine unsichere Vokalisierung festzulegen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch in der vertrauten prophetischen Einleitungsformel; knapp und als Überschrift zum folgenden Gotteswort gestaltet.
