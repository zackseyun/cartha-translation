source:
  edition: WLC
  text: וּ/בָאתֶ֞ם וַ/עֲמַדְתֶּ֣ם לְ/פָנַ֗/י בַּ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר נִקְרָא שְׁמִ֣/י עָלָ֔י/ו וַ/אֲמַרְתֶּ֖ם נִצַּ֑לְנוּ לְמַ֣עַן עֲשׂ֔וֹת אֵ֥ת כָּל הַ/תּוֹעֵב֖וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/010.yaml
  text: Then you come and stand before me in this house[a], which is called by my name, and say[b], ‘We are delivered!’—so that you may do all these abominations.
translation:
  language: de
  text: 'Dann kommt ihr und stellt euch vor mich in diesem Haus[a], das nach meinem Namen genannt ist, und sagt: »Wir sind gerettet!«[b] – um all diese Gräueltaten zu begehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in diesem Tempel“. Hebräisch: „in diesem Haus“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wir sind entronnen!“ beziehungsweise „Wir sind in Sicherheit!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתֶם
  choice: Dann kommt ihr
  rationale: Das prophetische Präsens hält die Anklage unmittelbar; „dann“ gibt die Folge im Zusammenhang wieder.
- source_word: וַעֲמַדְתֶּם לְפָנַי
  choice: und tretet vor mich
  rationale: Gibt עמד לפני natürlich und zugleich nah am hebräischen Ausdruck für das Erscheinen in Gottes Gegenwart wieder.
- source_word: בַּבַּיִת הַזֶּה
  choice: in diesem Haus
  rationale: „Haus“ bewahrt die konkrete hebräische Bezeichnung und deren theologische Resonanz; gemeint ist der Tempel.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: über dem mein Name ausgerufen ist
  rationale: Bewahrt die ungewöhnliche hebräische Konstruktion mit קרא und על besser als die glattere Wiedergabe „das meinen Namen trägt“.
- source_word: וַאֲמַרְתֶּם
  choice: und sagt
  rationale: Setzt die lebendige gegenwärtige Anklage fort.
- source_word: נִצַּלְנוּ
  choice: Wir sind gerettet!
  rationale: Das Nifal von נצל bezeichnet Rettung bzw. Entrinnen. Die Formulierung lässt offen, ob die Sprecher eine erfolgte Rettung oder daraus abgeleitete Sicherheit behaupten.
- source_word: לְמַעַן עֲשׂוֹת
  choice: nur um … zu begehen
  rationale: „Nur um“ bringt den scharf anklagenden, ironischen Zweck- beziehungsweise Ergebniszusammenhang idiomatisch zum Ausdruck, ohne dem Infinitiv eine ausdrücklich fortdauernde Aktionsart hinzuzufügen.
- source_word: כָּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: all diese Gräueltaten
  rationale: „Gräueltaten“ ist ein starker, verständlicher Ausdruck für die verabscheuungswürdigen Handlungen; eine Fußnote nennt die traditionsnahe Alternative.
theological_decisions:
- issue: Bezeichnung des Heiligtums
  choice: Haus
  alternative: Tempel
  rationale: Der unmittelbare Bezug ist der Jerusalemer Tempel, doch der hebräische Text sagt „Haus“. Die Übersetzung bewahrt diese Benennung und ihre Aussage über Gottes Haus.
- issue: Bedeutungsumfang von נִצַּלְנוּ
  choice: Wir sind gerettet!
  alternative: Wir sind in Sicherheit! / Wir sind entronnen!
  rationale: Die Aussage kann sowohl beanspruchte Rettung als auch vermeintliche Sicherheit ausdrücken. Der Haupttext entscheidet nicht, worauf sich die Sprecher im Einzelnen berufen.
- issue: Verhältnis von behaupteter Rettung und weiterem Unrecht
  choice: nur um all diese Gräueltaten zu begehen
  alternative: damit ihr all diese Gräueltaten begehen könnt
  rationale: 'Die Formulierung erhält die schockierende Zweck- oder Ergebnisbeziehung des Textes: Die behauptete Rettung wird als Freibrief für verabscheuungswürdiges Handeln missbraucht.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das prophetische Präsens bewahrt die Unmittelbarkeit der Anklage. „Über dem mein Name ausgerufen ist“ ist bewusst quellennäher als das idiomatischere „das meinen Namen trägt“; die starke Wendung „Gräueltaten“ vermeidet zugleich unnötig kirchensprachliche Steifheit.
