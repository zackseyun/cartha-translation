    issue: Die Wiedergabe „über dem mein Name ausgerufen ist“ für אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
    rationale: Die Formulierung ist im modernen Deutsch semantisch schief und kann ein räumliches Ausrufen suggerieren. Die hebräische Formel bezeichnet, dass das Haus nach Gottes Namen genannt ist bzw. ihm zugeordnet ist.
  - severity: low
    issue: „nur um“ für לְמַעַן עֲשׂוֹת
    rationale: Das „nur“ verstärkt die Ironie, ist aber keine ausdrücklich markierte Komponente des hebräischen Zwecksatzes. „Um“ wahrt Zweck bzw. den ironischen Effekt ohne Zusatz.
  - severity: low
    issue: „tretet vor mich“ für וַעֲמַדְתֶּם לְפָנַי
    rationale: „Treten“ betont das Herantreten, während עמד die Anwesenheit bzw. das Stehen vor Gott bezeichnet. „Sich vor jemanden stellen“ ist näher und natürlich.
