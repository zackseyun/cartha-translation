revisions:
- from: 'Dann kommt ihr und tretet vor mich in diesem Haus[a], über dem mein Name ausgerufen ist, und sagt: »Wir sind gerettet![b]« – nur um all diese Gräueltaten zu begehen.'
  to: 'Dann kommt ihr und stellt euch vor mich in diesem Haus[a], das nach meinem Namen genannt ist, und sagt: »Wir sind gerettet!«[b] – um all diese Gräueltaten zu begehen.'
  rationale: Die Revision ersetzt die missverständliche, zu wörtlich-räumliche Namensformel durch die im Deutschen idiomatische und sachlich genaue Wendung „das nach meinem Namen genannt ist“. Sie gibt עמד לפני mit „stellt euch vor mich“ wieder und entfernt das nicht ausdrücklich im Hebräischen enthaltene einschränkende „nur“. Haus, die behauptete Rettung, die ironische Zielbeziehung und die starke Bezeichnung „Gräueltaten“ bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T07:38:34Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und das prophetische Präsens geben den hebräischen Anklagerhythmus gut wieder. „Über dem mein Name ausgerufen ist“ ist jedoch im heutigen Deutsch missverständlich und legt eher ein Ausrufen über dem Gebäude als die hebräische Benennungs-/Zugehörigkeitsformel nahe. „Nur um“ fügt zudem eine einschränkende Nuance hinzu, die לְמַעַן nicht ausdrücklich enthält.
  naturalness: „Dann kommt ihr … und tretet vor mich“ ist verständlich, doch „stellt euch vor mich“ bildet das Stehen vor Gott idiomatischer ab. „Das nach meinem Namen genannt ist“ ist klares modernes Standarddeutsch und wahrt die zugrunde liegende Namensformel.
  terminology: „Haus“ sollte als quellentreue Tempelbezeichnung bleiben; die Fußnote erklärt den Referenten. „Gerettet“ kann als behauptete Befreiung stehen bleiben und wird sinnvoll durch die Alternativen abgesichert. „Gräueltaten“ gibt תּוֹעֵבוֹת angemessen stark wieder.
