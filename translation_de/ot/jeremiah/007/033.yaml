source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה נִבְלַ֨ת הָ/עָ֤ם הַ/זֶּה֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/033.yaml
  text: The corpses of this people will become food for the birds of the heavens and for the beasts of the earth[a], with no one to frighten them away.
translation:
  language: de
  text: Die Leichen dieses Volkes werden den Vögeln des Himmels und den Tieren der Erde zum Fraß dienen[a], und niemand wird sie verscheuchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Der Leichnam dieses Volkes wird den Vögeln des Himmels und den Tieren der Erde zum Fraß dienen, und niemand wird verscheuchen.“ Das hebräische Wort für „Leichnam“ steht im Singular, kann aber kollektiv gebraucht sein. Im letzten Satzteil bleibt das Objekt von „verscheuchen“ unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: werden ... dienen
  rationale: Die Verbform bezeichnet im prophetischen Zusammenhang eine künftige Folge. Zusammen mit לְמַאֲכָל wird die Prädikatskonstruktion im Deutschen natürlich mit „zum Fraß dienen“ wiedergegeben.
- source_word: נִבְלַת
  choice: die Leichen
  rationale: Das hebräische Singularwort bezeichnet einen Leichnam oder Kadaver und kann hier kollektiv stehen. Da es um die Toten des Volkes geht, gibt der deutsche Plural den gemeinten kollektiven Sinn natürlich wieder.
- source_word: הָעָם הַזֶּה
  choice: dieses Volkes
  rationale: עַם bedeutet gewöhnlich „Volk“ und bezieht sich hier auf das betroffene Volk Juda.
- source_word: לְמַאֲכָל
  choice: zum Fraß
  rationale: Das Wort bedeutet „Nahrung“. Im Zusammenhang mit Aas fressenden Vögeln und Landtieren bringt „Fraß“ die drastische Gerichtsszene idiomatisch und prägnant zum Ausdruck.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: den Vögeln des Himmels
  rationale: עוֹף ist hier eine Sammelbezeichnung für fliegende Tiere; die traditionelle und würdevolle Wendung „Vögel des Himmels“ bildet die hebräische Formulierung genau ab.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: und den Tieren der Erde
  rationale: בְּהֵמָה steht kollektiv für Landtiere. „Tiere der Erde“ ist im modernen Deutsch verständlich und wahrt den Parallelismus zu „Vögeln des Himmels“.
- source_word: וְאֵין מַחֲרִיד
  choice: und niemand wird sie verscheuchen
  rationale: Das Partizip bezeichnet hier jemanden, der die Tiere aufschreckt oder vertreibt. Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch „sie“ natürlich ergänzt, bleibt aber hinsichtlich seines Bezugs formal mehrdeutig.
theological_decisions:
- issue: Kollektiver Singular bei נִבְלַת
  choice: Wiedergabe im Plural „die Leichen“
  alternative: „der Leichnam dieses Volkes“
  rationale: Der Singular kann kollektiv die vielen Toten des Volkes bezeichnen. Der deutsche Plural vermittelt diese Aussage ohne eine theologische Deutung hinzuzufügen; die formnähere Alternative wird in der Fußnote genannt.
- issue: Unausgesprochenes Objekt von מַחֲרִיד
  choice: Das Objekt wird mit „sie“ ergänzt
  alternative: „und niemand schreckt auf“
  rationale: Der Kontext legt die Vögel und Tiere als diejenigen nahe, die niemand verscheucht. Das Pronomen bleibt grammatisch auch auf die Leichen beziehbar; die Fußnote weist auf die im Hebräischen bestehende Auslassung hin.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Bildkraft. „Zum Fraß dienen“ ist natürlich und drastisch, ohne den Inhalt abzuschwächen. Die kollektive Bedeutung des hebräischen Singulars und die Ellipse im Schlusssatz werden durch die Fußnote offengehalten.
