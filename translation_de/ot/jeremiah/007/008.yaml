  text: הִנֵּ֤ה אַתֶּם֙ בֹּטְחִ֣ים לָ/כֶ֔ם עַל דִּבְרֵ֖י הַ/שָּׁ֑קֶר לְ/בִלְתִּ֖י הוֹעִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/008.yaml
  text: Look[b][a], you are trusting in deceptive words to no benefit.
translation:
  language: de
  text: Seht[a], ihr vertraut auf trügerische[b] Worte – ohne jeden Nutzen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Siehe«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »verlogene« oder »falsche«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »das nichts nützt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die aufmerksamkeitslenkende und nachdrückliche Funktion wird mit dem gegenwärtigen, verständlichen »Seht« wiedergegeben.
- source_word: בֹּטְחִים לָכֶם
  choice: ihr vertraut
  rationale: Das Partizip bezeichnet ein gegenwärtiges beziehungsweise anhaltendes Vertrauen. Das Dativpronomen לָכֶם gehört idiomatisch zur Verbfügung und muss im Deutschen nicht gesondert wiedergegeben werden.
- source_word: עַל
  choice: auf
  rationale: Bei »vertrauen« ist »auf« die natürliche deutsche Entsprechung und bewahrt das Bild des Sichstützens beziehungsweise Sichverlassens.
- source_word: דִּבְרֵי הַשָּׁקֶר
  choice: trügerische Worte
  rationale: Die Wendung bezeichnet Worte, die von Falschheit geprägt sind und in die Irre führen. »Trügerisch« gibt diese Wirkung in natürlichem modernem Deutsch wieder, ohne die möglichen Alternativen »verlogen« oder »falsch« auszuschließen.
- source_word: לְבִלְתִּי הוֹעִיל
  choice: ohne jeden Nutzen
  rationale: Die negierte Infinitivfügung drückt aus, dass dieses Vertrauen keinen Nutzen bringt. Die adverbiale Wiedergabe vermeidet es, die »Worte« unnötig zum grammatischen Subjekt von »nützen« zu machen.
