id: JER.7.13
reference: Jeremiah 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עַתָּ֗ה יַ֧עַן עֲשׂוֹתְ/כֶ֛ם אֶת כָּל הַ/מַּֽעֲשִׂ֥ים הָ/אֵ֖לֶּה נְאֻם יְהוָ֑ה וָ/אֲדַבֵּ֨ר אֲלֵי/כֶ֜ם הַשְׁכֵּ֤ם וְ/דַבֵּר֙ וְ/לֹ֣א שְׁמַעְתֶּ֔ם וָ/אֶקְרָ֥א אֶתְ/כֶ֖ם וְ/לֹ֥א עֲנִיתֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/013.yaml
  text: And now[a], because you have done all these deeds, declares Yahweh, and I spoke to you, rising early and speaking, but you did not listen, and I called to you, but you did not answer[b],
translation:
  language: de
  text: Und nun, weil ihr all diese Taten begangen habt – Ausspruch Jahwes – und ich immer wieder zu euch geredet habe[a], ihr aber nicht gehört habt[b], und ich euch gerufen habe, ihr aber nicht geantwortet habt,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „früh aufstehend und redend“; eine hebräische Wendung für beharrliches, wiederholtes Reden.'
    reason: cultural_note
  - marker: b
    text: „Gehört“ kann hier zugleich den Sinn „gehorcht“ oder „darauf gehört“ einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende als auch die folgernde Funktion des hebräischen Ausdrucks.
- source_word: יַעַן עֲשׂוֹתְכֶם אֶת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: weil ihr all diese Taten begangen habt
  rationale: Gibt die kausale Konstruktion natürlich wieder; „Taten“ wahrt den moralischen Kontext von מַעֲשִׂים, und „begangen“ entspricht hier dem negativen Zusammenhang.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ erhält den feierlichen Charakter der prophetischen Formel; „Jahwe“ gibt den Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וָאֲדַבֵּר אֲלֵיכֶם הַשְׁכֵּם וְדַבֵּר
  choice: und ich immer wieder zu euch geredet habe
  rationale: Die hebräische Wendung „früh aufstehen und reden“ bezeichnet beharrliches, wiederholtes Reden. Die idiomatische Bedeutung steht im Haupttext, der konkrete Wortlaut in der Fußnote.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: ihr aber nicht gehört habt
  rationale: „Gehört“ bewahrt das Bild des Hörens und lässt zugleich den möglichen Nebensinn des Gehorchens offen.
- source_word: וָאֶקְרָא אֶתְכֶם
  choice: und weil ich euch gerufen habe
  rationale: „Gerufen“ gibt den unmittelbaren göttlichen Ruf natürlich wieder; das wiederholte „weil“ macht die syntaktische Einbindung im Deutschen klar.
- source_word: וְלֹא עֲנִיתֶם
  choice: ihr aber nicht geantwortet habt
  rationale: „Geantwortet“ erhält die dialogische Gegenüberstellung von Gottes Rufen und der ausbleibenden Reaktion.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen; die deutsche Form „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Wiedergabe der Wendung הַשְׁכֵּם וְדַבֵּר
  choice: idiomatisch „immer wieder zu euch geredet“ mit wörtlicher Fußnote
  alternative: „früh aufstehend und redend“ im Haupttext
  rationale: Eine streng wörtliche Fassung wäre im modernen Deutschen missverständlich und unnatürlich. Die gewählte Form vermittelt die beharrliche Wiederholung, während die Fußnote das hebräische Bild erhält.
- issue: Bedeutungsumfang von שׁמע
  choice: „gehört“ im Haupttext, möglicher Sinn „gehorcht“ in der Fußnote
  alternative: „gehorcht“ im Haupttext
  rationale: So bleibt die im Hebräischen angelegte Spannung zwischen akustischem Hören und gehorsamem Beachten bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als syntaktisch offener Vordersatz mit Schlusskomma stehen, da der Gedanke im folgenden Vers fortgeführt wird. Die Gedankenstriche kennzeichnen die eingeschobene prophetische Formel.
