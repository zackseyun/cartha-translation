base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/009.yaml
  text: Will you steal[a], murder, commit adultery, swear falsely, burn incense to Baal[b], and go after other gods that you have not known—
translation:
  language: de
  text: Wollt ihr denn stehlen, morden, die Ehe brechen, falsch schwören, für Baal Räucherwerk verbrennen und anderen Göttern nachlaufen, die ihr nicht gekannt habt[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „die ihr nicht anerkannt habt“. Das hebräische Wort kann hier neben „kennen“ auch Anerkennung oder Beziehung andeuten.'
    reason: Die Anmerkung wahrt die mögliche relationale Nuance von ידע, ohne sie im Haupttext festzulegen.
lexical_decisions:
- source_word: הֲ/גָנֹב רָצֹחַ וְנָאֹף
  choice: Wollt ihr wirklich stehlen, morden, die Ehe brechen
  rationale: Die Fragepartikel הֲ eröffnet eine rhetorische Frage; die Infinitivformen führen die Reihe der Vergehen pointiert fort. „Wirklich“ gibt den vorwurfsvoll-ungläubigen Ton wieder, während „morden“ die Bedeutung von רצח als rechtswidriges Töten wahrt.
- source_word: וְהִשָּׁבֵעַ לַשֶּׁקֶר
  choice: falsch schwören
  rationale: Die knappe deutsche Wendung gibt den rechtlich-ethischen Sinn eines unwahren oder betrügerischen Eides unmittelbar wieder.
- source_word: וְקַטֵּר לַבָּעַל
  choice: dem Baal Räucheropfer darbringen
  rationale: קטר bezeichnet im kultischen Zusammenhang das Verbrennen von Räucherwerk beziehungsweise ein Rauchopfer. „Räucheropfer darbringen“ ist im Deutschen natürlich und macht den kultischen Vorgang deutlich.
- source_word: וְהָלֹךְ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern nachlaufen
  rationale: „Nachlaufen“ bewahrt das hebräische Bewegungsbild und bringt zugleich die darin liegende Hinwendung und Gefolgschaft zum Ausdruck.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: die ihr nicht gekannt habt
  rationale: Die Wiedergabe bleibt eng bei ידע und lässt offen, ob bloße Bekanntschaft, Anerkennung oder eine relationale Bindung gemeint ist.
theological_decisions:
- issue: Bedeutung des Nichtkennens anderer Götter
  choice: die ihr nicht gekannt habt
  alternative: die ihr nicht anerkannt habt
  rationale: ידע kann in einem religiös-bundestheologischen Zusammenhang mehr als gedankliches Wissen bezeichnen. Die Hauptfassung legt den Ausdruck jedoch nicht auf „anerkennen“ fest und bewahrt so seine Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Aufzählung bleibt knapp und anklagend; der Gedankenstrich zeigt an, dass die rhetorische Satzbewegung im folgenden Vers weitergeht.
