source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/לֹא יֵאָמֵ֨ר ע֤וֹד הַ/תֹּ֨פֶת֙ וְ/גֵ֣יא בֶן הִנֹּ֔ם כִּ֖י אִם גֵּ֣יא הַ/הֲרֵגָ֑ה וְ/קָבְר֥וּ בְ/תֹ֖פֶת מֵ/אֵ֥ין מָקֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/032.yaml
  text: Therefore, look, days are coming, declares the LORD, when it will no longer be called Topheth and the Valley of Ben-hinnom, but the Valley of Slaughter; and they will bury in Topheth because there is no place left.
translation:
  language: de
  text: Darum, siehe, es kommen Tage – so lautet der Ausspruch des HERRN –, da wird man es weder Tofet noch Tal Ben-Hinnom nennen, sondern Tal des Schlachtens. Und man wird im Tofet begraben, weil kein Platz mehr ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung mit dem vorausgehenden Gerichtswort knapp und natürlich wieder.
- source_word: הִנֵּה
  choice: seht
  rationale: Bewahrt das aufmerksamkeitslenkende Element der hebräischen Partikel in verständlichem modernem Deutsch.
- source_word: נְאֻם יְהוָה
  choice: so lautet der Ausspruch des HERRN
  rationale: Gibt die feste prophetische Formel und den Gottesnamen würdig wieder.
- source_word: הַתֹּפֶת
  choice: das Tofet
  rationale: Der Ortsname wird transliteriert und mit dem im Deutschen üblichen sächlichen Artikel verwendet.
- source_word: גֵיא בֶן הִנֹּם
  choice: das Tal Ben-Hinnom
  rationale: Bewahrt den Eigennamen und die geografische Bezeichnung eng am Hebräischen.
- source_word: גֵיא הַהֲרֵגָה
  choice: das Tal des Schlachtens
  rationale: הֲרֵגָה bezeichnet das gewaltsame Töten beziehungsweise Schlachten; die nominale Benennung bleibt erhalten.
- source_word: וְקָבְרוּ
  choice: Und man wird ... Tote begraben
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch mit »man« wiedergegeben; »Tote« verdeutlicht das im Verb sachlich vorausgesetzte Objekt, ohne eine bestimmte Personengruppe einzutragen.
- source_word: מֵאֵין מָקוֹם
  choice: weil sonst kein Platz mehr ist
  rationale: Gibt den Mangel an weiterem Begräbnisraum natürlich wieder; »sonst« macht den Bezug auf andere mögliche Begräbnisorte deutlich.
theological_decisions:
- issue: Wiedergabe des Tetragramms יהוה
  choice: HERRN
  alternative: JHWH / Jahwe
  rationale: Folgt der etablierten deutschsprachigen Bibelkonvention, ohne eine unsichere Aussprache festzulegen.
- issue: Benennung des Gerichtsfolgenortes
  choice: Tal des Schlachtens
  alternative: Tal der Erschlagenen
  rationale: Die abstrakte Form des hebräischen הֲרֵגָה wird bewahrt; zugleich wird nicht stillschweigend von der Handlung auf die Opfer umgedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Der Vers bleibt nah an der hebräischen Satzbewegung, wird aber durch deutsche Zeichensetzung und die unpersönliche Form »man wird« flüssig lesbar.
