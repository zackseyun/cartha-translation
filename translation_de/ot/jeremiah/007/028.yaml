review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die zentralen Lexeme insgesamt zuverlässig wieder: der prophetische Auftrag, das kollektive »Volk«, das Nicht-Hören auf Jahwes Stimme, die nicht angenommene Zurechtweisung sowie der Verlust von אֱמוּנָה. Die Wiedergabe von וְנִכְרְתָה mit »getilgt worden« schwächt jedoch das spezifische Bild von כרת (»abgeschnitten/ausgerottet«) unnötig ab. Außerdem ist »aus ihrem Mund« bei einem grammatisch singularischen Kollektiv im Deutschen weniger stimmig als »aus seinem Mund«; die hebräische Pluralform bezieht sich zwar auf die Angehörigen des Volkes, doch die deutsche Konstruktion kann idiomatisch den Kollektivsingular fortführen.'
  naturalness: Modernes, würdiges Deutsch. »Auf die Stimme … hören« und »Zurechtweisung annehmen« sind natürlich. »Aus seinem Mund abgeschnitten worden« ist als bewusst bildhafte, quellennähere Formulierung verständlich; »von seinen Lippen verschwunden« wäre glatter, aber weniger exakt.
  terminology: »Jahwe« ist eine angemessene deutsche Wiedergabe des Gottesnamens. »Treue« ist für אֱמוּנָה im Kontext gut vertretbar; die Fußnote bewahrt mit »Wahrheit« die wesentliche lexikalische Alternative. »Volk« ist für הַגּוֹי passend.
  issues:
  - severity: medium
    issue: »getilgt worden« für וְנִכְרְתָה
    rationale: »Tilgen« bedeutet vor allem löschen oder ausmerzen und gibt die Grundmetapher des Nifal von כרת, »abgeschnitten werden«, nicht hinreichend wieder. Eine Wiedergabe mit »abgeschnitten« erhält die Bildsprache und ist im Kontext verständlich.
  - severity: low
    issue: Wechsel von Kollektivsingular zu »ihrem Mund«
    rationale: Der Entwurf führt »das Volk« mit »seines Gottes« im Singular, wechselt dann aber zu einem pluralischen Possessivpronomen. Obwohl dies die hebräische Pluralendung abbildet, ist die deutsche Bezugnahme auf das kollektive »Volk« mit »seinem Mund« konsistenter und natürlich.
  revised_text: 'Dann sollst du zu ihnen sagen: »Das ist das Volk, das nicht auf die Stimme Jahwes, seines Gottes, gehört und keine Zurechtweisung angenommen hat. Die Treue[a] ist verloren gegangen und aus seinem Mund abgeschnitten worden.«'
  revised_footnotes:
