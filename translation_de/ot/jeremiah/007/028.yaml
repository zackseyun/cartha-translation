- from: 'Dann sollst du zu ihnen sagen: »Das ist das Volk, das nicht auf die Stimme Jahwes, seines Gottes, gehört und keine Zurechtweisung angenommen hat. Die Treue[a] ist verloren gegangen und aus ihrem Mund getilgt worden.«'
  to: 'Dann sollst du zu ihnen sagen: »Das ist das Volk, das nicht auf die Stimme Jahwes, seines Gottes, gehört und keine Zurechtweisung angenommen hat. Die Treue[a] ist verloren gegangen und aus seinem Mund abgeschnitten worden.«'
  rationale: 'Die Revision beschränkt sich auf die Schlussmetapher: »abgeschnitten worden« gibt כרת genauer wieder als »getilgt worden«. Das Possessivpronomen wird zur kohärenten deutschen Fortführung des kollektiven Singulars »das Volk« angepasst. Die ambige Bedeutung von אֱמוּנָה bleibt durch die Fußnote transparent.'
