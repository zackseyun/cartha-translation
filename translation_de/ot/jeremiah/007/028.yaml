  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֗ם זֶ֤ה הַ/גּוֹי֙ אֲשֶׁ֣ר לֽוֹא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔י/ו וְ/לֹ֥א לָקְח֖וּ מוּסָ֑ר אָֽבְדָה֙ הָֽ/אֱמוּנָ֔ה וְ/נִכְרְתָ֖ה מִ/פִּי/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/028.yaml
  text: Then you shall say to them[a], ‘This is the nation that did not listen to the voice of Yahweh its God and did not accept correction. Faithfulness has perished; it has been cut off from their mouth.’
translation:
  language: de
  text: 'Dann sollst du zu ihnen sagen: »Das ist das Volk, das nicht auf die Stimme Jahwes, seines Gottes, gehört und keine Zurechtweisung angenommen hat. Die Treue[a] ist verloren gegangen und aus seinem Mund abgeschnitten worden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Wahrheit«. Das hebräische Wort kann »Treue«, »Verlässlichkeit« oder »Wahrheit« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Dann sollst du zu ihnen sagen
  rationale: Das mit וְ angeschlossene Perfekt führt im prophetischen Auftrag die nächste Anweisung fort. „Dann sollst du“ gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: זֶה הַגּוֹי
  choice: Das ist das Volk
  rationale: גּוֹי bezeichnet hier das kollektiv angesprochene Gemeinwesen. „Volk“ ist im Deutschen in dieser Anrede natürlicher als „Nation“ und bewahrt den Singular.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: nicht auf die Stimme … gehört
  rationale: Die Wendung שׁמע בקול umfasst Hören und Gehorchen. „Auf die Stimme hören“ erhält das hebräische Hörbild und lässt den Gehorsamsaspekt mitschwingen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהָיו
  choice: seines Gottes
  rationale: Das maskuline Singularsuffix stimmt grammatisch mit dem kollektiven Singular הַגּוֹי überein; daher wird die Singularbeziehung bewahrt.
- source_word: לֹא לָקְחוּ מוּסָר
  choice: keine Zurechtweisung angenommen hat
  rationale: מוּסָר kann Erziehung, Mahnung, Zucht oder Zurechtweisung bedeuten. Im Zusammenhang der prophetischen Anklage trifft „Zurechtweisung“ den korrigierenden Sinn; „angenommen“ gibt לקח idiomatisch wieder.
- source_word: אָבְדָה הָאֱמוּנָה
  choice: Die Treue ist verloren gegangen
  rationale: אֱמוּנָה bezeichnet Treue, Verlässlichkeit oder Wahrheit. „Treue“ wahrt hier die ethische und relationale Dimension; „verloren gegangen“ gibt אָבדה verständlich wieder, ohne den Ausdruck unnötig zu dramatisieren.
- source_word: וְנִכְרְתָה מִפִּיהֶם
  choice: und aus ihrem Mund getilgt worden
  rationale: Das Nifal von כרת bezeichnet das Abgeschnitten- oder Beseitigtwerden. „Getilgt worden“ bewahrt die kraftvolle passive Aussage, klingt im Deutschen aber natürlicher als „abgeschnitten worden“; „aus ihrem Mund“ folgt dem hebräischen Bild.
theological_decisions:
- issue: Bedeutung von אֱמוּנָה im Kontext der Bundesanklage
  choice: Treue
  alternative: Wahrheit
  rationale: Der Ausdruck kann sowohl Wahrhaftigkeit und Wahrheit als auch Verlässlichkeit und Treue bezeichnen. „Treue“ passt zur Anklage gegen die Antwort des Volkes auf seinen Gott, ohne die Bedeutung „Wahrheit“ auszuschließen; diese bleibt deshalb in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und eindringlich; das Bild von der Stimme und vom Mund wird bewahrt. Die kollektive Singularform „Volk … seines Gottes“ folgt der hebräischen Grammatik.
