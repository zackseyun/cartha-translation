source:
  edition: WLC
  text: לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבֽוֹתֵי/כֶם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָ/אֶשְׁלַ֤ח אֲלֵי/כֶם֙ אֶת כָּל עֲבָדַ֣/י הַ/נְּבִיאִ֔ים י֖וֹם הַשְׁכֵּ֥ם וְ/שָׁלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/025.yaml
  text: From the day your fathers came out of the land of Egypt until this day[a], I have sent to you all my servants the prophets, day after day[b], rising early and sending them.
translation:
  language: de
  text: 'Von dem Tag an, als eure Vorfahren[a] aus dem Land Ägypten auszogen, bis zum heutigen Tag habe ich Tag für Tag alle meine Diener, die Propheten, zu euch gesandt: Immer wieder machte ich mich früh auf und sandte sie.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: eure Väter.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Wendung „sich früh aufmachen und senden“ beschreibt, wie beharrlich und immer wieder Gott die Propheten sandte.
    reason: cultural_note
lexical_decisions:
- source_word: לְמִן הַיּוֹם אֲשֶׁר
  choice: Von dem Tag an, als
  rationale: Die Wendung bezeichnet den Ausgangspunkt eines Zeitraums. Diese Formulierung gibt die zeitliche Struktur im Deutschen natürlich und präzise wieder.
- source_word: יָצְאוּ אֲבוֹתֵיכֶם
  choice: eure Vorfahren auszogen
  rationale: אָבוֹת bezeichnet hier die früheren Generationen Israels. „Vorfahren“ ist im heutigen Deutsch eindeutiger als das wörtliche „Väter“, ohne den geschichtlichen Bezug einzuengen.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die vollere hebräische Bundesgeschichtsformel wird bewahrt und nicht zum bloßen „aus Ägypten“ verkürzt.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: bis zum heutigen Tag
  rationale: Die geläufige deutsche Wendung drückt die Fortdauer bis zum gegenwärtigen Bezugspunkt aus.
- source_word: וָאֶשְׁלַח אֲלֵיכֶם
  choice: habe ich … zu euch gesandt
  rationale: Das deutsche Perfekt bringt die über den gesamten genannten Zeitraum wiederholte und bis zum Bezugspunkt reichende Handlung angemessen zum Ausdruck.
- source_word: אֶת כָּל עֲבָדַי הַנְּבִיאִים
  choice: alle meine Diener, die Propheten
  rationale: Die Apposition kennzeichnet die Propheten als Gottes beauftragte Diener. „Diener“ stellt hier den beauftragten Dienst, nicht einen rechtlichen Sklavenstatus, in den Vordergrund.
- source_word: יוֹם
  choice: Tag für Tag
  rationale: Das adverbial verwendete Substantiv bezeichnet eine fortwährend wiederholte Handlung; „Tag für Tag“ gibt diese iterative Kraft anschaulich wieder.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  choice: Immer wieder machte ich mich früh auf und sandte sie
  rationale: Die in Jeremia häufige Verbindung zweier Infinitive drückt Gottes nachdrückliches, beharrlich wiederholtes Senden aus. Die deutsche Fassung bewahrt das Bild des frühen Aufstehens und macht zugleich seine iterative Funktion kenntlich.
theological_decisions:
- issue: Wiedergabe von עֲבָדַי als Bezeichnung der Propheten
  choice: meine Diener
  alternative: meine Sklaven
  rationale: Der Zusammenhang betont die Propheten als von Gott beauftragte und gesandte Vertreter. „Diener“ wahrt dieses Verhältnis, ohne den hier nicht hervorgehobenen rechtlichen Status von Sklaven in den Vordergrund zu rücken.
- issue: Anthropomorphe Rede vom frühen Aufstehen Gottes
  choice: machte ich mich früh auf
  alternative: unermüdlich / mit Nachdruck
  rationale: Das hebräische Bild wird im Haupttext nicht aufgelöst. Eine Fußnote erläutert seine idiomatische Aussage, sodass sowohl die Bildsprache als auch ihre Funktion erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die historische Formel „Land Ägypten“ und das anschauliche hebräische Bild vom frühen Aufstehen bleiben erhalten; ungebräuchliche Satzstellung und missverständliche Wörtlichkeit werden durch natürliche Syntax und knappe Fußnoten ausgeglichen.
