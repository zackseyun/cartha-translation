  text: then I will let you dwell in this place[b][a], in the land that I gave to your fathers from of old and forever.
translation:
  language: de
  text: dann lasse ich euch an diesem Ort wohnen, in dem Land, das ich euren Vätern[a] von alters her bis in alle Zukunft gegeben habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euren Vorfahren“. Wörtlich: „euren Vätern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von Urzeit an bis in Ewigkeit“; die Wendung kann eine Zeitspanne von ferner Vergangenheit bis in unabsehbare Zukunft bezeichnen.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְשִׁכַּנְתִּי
  choice: dann lasse ich euch … wohnen
  rationale: 'Der Hifil von שׁכן ist hier kausativ: Gott lässt beziehungsweise ermöglicht dem Volk, weiterhin dort zu wohnen. Die Formulierung ist natürliches modernes Deutsch und bewahrt die kausative Aussage.'
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die räumliche Wendung bleibt bewusst allgemein und wird nicht über den hebräischen Wortlaut hinaus als Tempel, Jerusalem oder Juda präzisiert.
- source_word: בָּאָרֶץ אֲשֶׁר נָתַתִּי
  choice: in dem Land, das ich … gegeben habe
  rationale: אֶרֶץ bezeichnet hier das den Vorfahren gegebene Land. Das deutsche Perfekt entspricht in diesem Zusammenhang natürlichem gegenwärtigem Deutsch und stellt die fortdauernde Relevanz der früheren Gabe nicht infrage.
- source_word: לַאֲבוֹתֵיכֶם
  choice: euren Vätern
  rationale: Die Wiedergabe wahrt die konkrete maskuline Form des Hebräischen; die im Kontext mögliche inklusive Bedeutung „Vorfahren“ wird in einer Fußnote genannt.
- source_word: לְמִן עוֹלָם וְעַד עוֹלָם
  choice: von alters her und für alle Zeiten
  rationale: Die Wendung spannt den zeitlichen Bogen von ferner Vergangenheit in eine unabsehbare Zukunft. „Von alters her“ und „für alle Zeiten“ gibt beide Richtungen idiomatisch wieder, ohne עוֹלָם als metaphysische Ewigkeit festzulegen.
theological_decisions:
- issue: Bedingtheit oder Unbedingtheit der Verheißung des Wohnens im Land
  choice: 'Die Aussage wird als Folge der vorausgehenden Bedingungen formuliert: „dann lasse ich euch … wohnen“.'
  alternative: Die Landverheißung als von jedem Gehorsam unabhängige, unbedingte Besitzgarantie wiederzugeben.
  rationale: Der Zusammenhang bindet die Zusage an die vorausgehenden Aufforderungen. Zugleich wird die frühere Gabe des Landes an die Väter uneingeschränkt genannt; weitergehende lehrmäßige Fragen werden nicht entschieden.
- issue: Zeitliche Reichweite von עוֹלָם
  choice: „von alters her und für alle Zeiten“
  alternative: „von Ewigkeit zu Ewigkeit“
  rationale: Die erste Hälfte blickt hier auf ferne Vergangenheit, die zweite auf unabsehbare Zukunft. Die Übersetzung bewahrt diese zeitliche Spannung, ohne eine Aussage über metaphysische Ewigkeit zu erzwingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „An diesem Ort wohnen“ ist allgemein verständlich und lässt die örtliche Bezugnahme des Hebräischen offen. Die Zeitformel wird idiomatisch wiedergegeben; eine Fußnote dokumentiert ihre wörtlichere, stärker mehrdeutige Gestalt.
