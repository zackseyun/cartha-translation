  terminology: „Vätern“ ist eine quellentreue Wiedergabe von אֲבוֹתֵיכֶם; die Alternative „Vorfahren“ ist sinnvoll vermerkt. „Land“ ist im gegebenen Kontext terminologisch passend. Die Fußnote zur Zeitformel sollte die Spannweite von „von“ bis „bis“ genauer wiedergeben und nicht stärker als nötig als „Ewigkeit“ festlegen.
