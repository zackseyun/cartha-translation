source:
  edition: WLC
  text: הַ/בָּנִ֞ים מְלַקְּטִ֣ים עֵצִ֗ים וְ/הָֽ/אָבוֹת֙ מְבַעֲרִ֣ים אֶת הָ/אֵ֔שׁ וְ/הַ/נָּשִׁ֖ים לָשׁ֣וֹת בָּצֵ֑ק לַ/עֲשׂ֨וֹת כַּוָּנִ֜ים לִ/מְלֶ֣כֶת הַ/שָּׁמַ֗יִם וְ/הַסֵּ֤ךְ נְסָכִים֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֖עַן הַכְעִסֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/018.yaml
  text: The children gather wood[a], the fathers kindle the fire, and the women knead dough to make cakes for the Queen of Heaven and to pour out drink offerings to other gods, so as to provoke me to anger.
translation:
  language: de
  text: Die Kinder sammeln Holz, die Väter entzünden das Feuer, und die Frauen kneten Teig, um Kuchen für die Himmelskönigin[a] zu machen und anderen Göttern Trankopfer auszugießen, um mich zum Zorn zu reizen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck מְלֶכֶת הַשָּׁמַיִם wird traditionell als „Himmelskönigin“ verstanden, wahrscheinlich als Titel einer in Juda verehrten Göttin. Vorgeschlagen wurde auch „Werk des Himmels“; der Zusammenhang spricht hier jedoch eher für eine persönliche Gottheit, die Opfer empfängt.
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַקְּטִים עֵצִים
  choice: sammeln Holz
  rationale: Das Partizip bezeichnet das Sammeln; עֵצִים meint hier Holz beziehungsweise Holzstücke. „Holz sammeln“ ist natürlich und vermeidet die engeren, stärker deutenden Wiedergaben „Zweige“ oder „Brennholz“.
- source_word: מְבַעֲרִים אֶת הָאֵשׁ
  choice: entzünden das Feuer
  rationale: Die Wendung bezeichnet das Inbrandsetzen beziehungsweise Entfachen des Feuers. „Das Feuer entzünden“ ist im modernen Standarddeutsch konkret und idiomatisch.
- source_word: לָשׁוֹת בָּצֵק
  choice: kneten Teig
  rationale: Das Verb bezeichnet ausdrücklich das Kneten; die konkrete Tätigkeit wird ohne Verallgemeinerung zu „zubereiten“ wiedergegeben.
- source_word: כַּוָּנִים
  choice: Kuchen
  rationale: Das seltene Wort bezeichnet geformtes Gebäck im kultischen Zusammenhang. „Kuchen“ bleibt nah am Ausdruck; der Opfercharakter ergibt sich aus Empfängerin und Parallelhandlung.
- source_word: מְלֶכֶת הַשָּׁמַיִם
  choice: Himmelskönigin
  rationale: Die masoretische Lesung und der Kontext sprechen für den Titel einer weiblichen Gottheit. Das deutsche Kompositum ist verständlich, würdig und als Titel eindeutig.
- source_word: וְהַסֵּךְ נְסָכִים
  choice: und … Trankopfer auszugießen
  rationale: Die kultische Verbindung aus Verb und Substantiv wird mit der im Deutschen geläufigen Wendung „Trankopfer ausgießen“ wiedergegeben. Die Infinitivkonstruktion wird parallel zum vorangehenden Zweck ausgedrückt.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: anderen Göttern
  rationale: אֲחֵרִים bedeutet unmittelbar „andere“; „fremde“ wäre eine zusätzliche Deutung.
- source_word: לְמַעַן הַכְעִסֵנִי
  choice: um mich zum Zorn zu reizen
  rationale: 'Die Wiedergabe bewahrt sowohl die Zweckformulierung לְמַעַן als auch die kausative Bedeutung des Verbs: Gott wird zum Zorn gereizt.'
theological_decisions:
- issue: Identifikation von מְלֶכֶת הַשָּׁמַיִם
  choice: Himmelskönigin
  alternative: Werk des Himmels
  rationale: Der Zusammenhang beschreibt Opferhandlungen für eine persönliche Gottheit, und dieselbe Wendung erscheint in Jeremia erneut in diesem Kultzusammenhang. Die Hauptlesart wird deshalb als Gottheitstitel übersetzt; die diskutierte unpersönliche Alternative bleibt in der Fußnote sichtbar, ohne spätere religiöse Vorstellungen in den Text einzutragen.
- issue: Zweck oder Folge in לְמַעַן הַכְעִסֵנִי
  choice: um mich zum Zorn zu reizen
  alternative: sodass sie mich zum Zorn reizen
  rationale: לְמַעַן kann Ziel beziehungsweise beabsichtigte Wirkung ausdrücken. Die deutsche Zweckkonstruktion folgt der Form des Hebräischen, ohne zu behaupten, dass der göttliche Zorn das einzige subjektive Motiv der Handelnden sei.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Aufzählung der Tätigkeiten und die parallelen Familienrollen bleiben erhalten. Kultische Fachsprache wird nur dort verwendet, wo sie im Deutschen geläufig und sachlich erforderlich ist („Trankopfer“).
