  variant: modern standard German
source:
  edition: WLC
  text: גָּזִּ֤י נִזְרֵ/ךְ֙ וְֽ/הַשְׁלִ֔יכִי וּ/שְׂאִ֥י עַל שְׁפָיִ֖ם קִינָ֑ה כִּ֚י מָאַ֣ס יְהוָ֔ה וַ/יִּטֹּ֖שׁ אֶת דּ֥וֹר עֶבְרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/029.yaml
  text: Cut off your hair and throw it away[a], and raise a lament on the bare heights[b], for Yahweh has rejected and abandoned the generation of his wrath.
translation:
  language: de
  text: Schneide dein Haar ab und wirf es fort[a]; erhebe auf den kahlen Höhen eine Klage. Denn Jahwe hat die Generation seines Zorns[b] verworfen und verlassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deine Krone« beziehungsweise »dein geweihtes Haar«. Das hebräische Wort kann Weihe, Krone oder das mit einer Weihe verbundene Haar bezeichnen; die Aufforderungen zum Abschneiden und Fortwerfen sprechen hier für Haar.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »die Generation seines Zorns«; gemeint sein kann auch: »die Generation, die seinem Zorn verfallen ist«.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּזִּי
  choice: Schneide ... ab
  rationale: Der feminine Singularimperativ von גזז bezeichnet das Abschneiden oder Scheren und richtet sich an die personifizierte Stadt.
- source_word: נִזְרֵךְ
  choice: dein Haar
  rationale: נזר kann Weihe, Krone oder mit Weihe verbundenes Haar bezeichnen. Zusammen mit „abschneiden“ und „fortwerfen“ liegt Haar nahe; die Fußnote bewahrt die Mehrdeutigkeit.
- source_word: וְהַשְׁלִיכִי
  choice: und wirf es fort
  rationale: Der feminine Singularimperativ von שלך bezeichnet bewusstes Wegwerfen; „fortwerfen“ ist natürlich und würdig.
- source_word: וּשְׂאִי ... קִינָה
  choice: stimme ... ein Klagelied an
  rationale: נשׂא mit קינה bedeutet, eine Toten- oder Trauerklage zu erheben beziehungsweise anzustimmen.
- source_word: עַל שְׁפָיִם
  choice: auf den kahlen Höhen
  rationale: שְׁפָיִם bezeichnet kahle, unbewachsene oder ausgesetzte Anhöhen; die Wiedergabe vermeidet eine unnötige Festlegung auf kultische Höhen.
- source_word: כִּי מָאַס יְהוָה
  choice: Denn Jahwe hat ... verworfen
  rationale: מאס drückt Zurückweisung aus. „Verworfen“ erhält hier die scharfe prophetische und bundesbezogene Aussage.
- source_word: וַיִּטֹּשׁ
  choice: und verlassen
  rationale: נטש bedeutet verlassen, preisgeben oder im Stich lassen; „verlassen“ passt knapp zur Parallelität mit „verworfen“.
- source_word: דּוֹר עֶבְרָתוֹ
  choice: die Generation seines Zorns
  rationale: Die knappe hebräische Genitivverbindung wird formal bewahrt, statt ihre Beziehung eindeutig als Ziel oder Gegenstand des Zorns aufzulösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen; „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Deutung von נִזְרֵךְ
  choice: dein Haar
  alternative: deine Krone / dein geweihtes Haar
  rationale: Die Aufforderungen zum Abschneiden und Fortwerfen sprechen im Kontext für Haar. Da das Wort zugleich Weihe- und Kronenbezüge tragen kann, wird diese Spannung in einer Fußnote offengehalten.
- issue: Deutung von דּוֹר עֶבְרָתוֹ
  choice: die Generation seines Zorns
  alternative: die Generation, die seinem Zorn verfallen ist
  rationale: Die wörtlichere Form bewahrt die Härte und Mehrdeutigkeit der hebräischen Genitivverbindung, ohne ihre genaue Beziehung stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die personifizierte Stadt wird im femininen Singular angeredet. Der Semikolon trennt die symbolische Handlung von der öffentlichen Klage; der kurze Begründungssatz erhält den prophetischen Nachdruck.
