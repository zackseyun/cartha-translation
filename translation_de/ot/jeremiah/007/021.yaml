source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹלוֹתֵי/כֶ֛ם סְפ֥וּ עַל זִבְחֵי/כֶ֖ם וְ/אִכְל֥וּ בָשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Add your burnt offerings to your sacrifices, and eat the flesh.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen, der Gott Israels: Fügt eure Brandopfer euren Schlachtopfern[a] hinzu und esst das Fleisch!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heilsopfern“. Das hebräische Wort kann hier besonders Opfer bezeichnen, von deren Fleisch die Opfernden aßen.'
    reason: Bewahrt die im kultischen Gegensatz mögliche engere Bedeutung von זֶבַח, ohne sie im Haupttext festzuschreiben.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die im Deutschen geläufige prophetische Botenformel gibt die performative Gegenwartsbedeutung natürlich und würdevoll wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „der Herr der Heerscharen“ macht den Titel צְבָאוֹת in natürlichem Deutsch verständlich, ohne ihn auf irdische Armeen einzuengen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Direkte und idiomatische Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: עֹלוֹתֵיכֶם
  choice: eure Brandopfer
  rationale: עֹלָה bezeichnet das auf dem Altar vollständig verbrannte Opfer; „Brandopfer“ ist die etablierte knappe deutsche Entsprechung.
- source_word: סְפוּ עַל
  choice: Fügt … hinzu
  rationale: Die Imperativkonstruktion fordert zum Hinzufügen auf und bewahrt den scharf ironischen Ton der Aussage.
- source_word: זִבְחֵיכֶם
  choice: euren Schlachtopfern
  rationale: „Schlachtopfer“ bildet זֶבַח genauer als das sehr allgemeine „Opfer“ ab, ohne die im Kontext mögliche engere Bedeutung „Heilsopfer“ im Haupttext festzulegen.
- source_word: וְאִכְלוּ בָשָׂר
  choice: und esst das Fleisch
  rationale: „Fleisch“ entspricht בָשָׂר lexikalisch eng und passt zum kultischen Zusammenhang; der bestimmte Artikel verweist im Deutschen natürlich auf das Fleisch der genannten Opfer.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname wird als solcher wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutungsumfang von זִבְחֵיכֶם im Gegensatz zu Brandopfern
  choice: Schlachtopfer
  alternative: Heilsopfer
  rationale: Der Haupttext wahrt den breiteren Bedeutungsumfang. Die kultisch wahrscheinlichere engere Deutung als Opfer, von denen die Opfernden aßen, wird in der Fußnote genannt.
- issue: Ironischer Charakter der Aufforderung
  choice: Direkte Imperative ohne erklärenden Zusatz
  alternative: Ausdrückliche Kennzeichnung als Ironie
  rationale: Der spöttisch-kritische Sinn entsteht aus dem Zusammenhang; eine erklärende Einfügung würde mehr deuten, als der Vers ausdrücklich sagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der geläufigen prophetischen Formel „So spricht“. Der knappe imperativische Satzbau bewahrt die Schärfe und mögliche Ironie des Hebräischen. Der Fußnotenmarker steht unmittelbar bei dem mehrdeutigen Ausdruck.
