id: JER.7.31
reference: Jeremiah 7:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָנ֞וּ בָּמ֣וֹת הַ/תֹּ֗פֶת אֲשֶׁר֙ בְּ/גֵ֣יא בֶן הִנֹּ֔ם לִ/שְׂרֹ֛ף אֶת בְּנֵי/הֶ֥ם וְ/אֶת בְּנֹתֵי/הֶ֖ם בָּ/אֵ֑שׁ אֲשֶׁר֙ לֹ֣א צִוִּ֔יתִי וְ/לֹ֥א עָלְתָ֖ה עַל לִבִּֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/031.yaml
  text: They have built the high places of Topheth[a], which is in the Valley of Ben-hinnom, to burn their sons and their daughters in the fire—something I did not command, nor did it come up in my heart.
translation:
  language: de
  text: Sie haben die Kulthöhen des Tofet gebaut, das im Tal Ben-Hinnom liegt, um ihre Söhne und ihre Töchter im Feuer zu verbrennen – etwas, das ich nicht geboten habe und das mir nicht in den Sinn kam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und das nicht auf mein Herz heraufkam.“ Das hebräische Bild kann auch wiedergegeben werden mit: „und das in meinem Herzen nicht aufkam.“'
    reason: Die Anmerkung bewahrt das ungewöhnliche hebräische Bild und macht die wörtlichere Alternative sichtbar, ohne die Redewendung einseitig auszulegen.
lexical_decisions:
- source_word: וּבָנוּ
  choice: Sie haben … gebaut
  rationale: Das Qal Perfekt 3. Person Plural bezeichnet eine abgeschlossene Handlung, deren Ergebnis im Zusammenhang fortbesteht. Das deutsche Perfekt gibt dies natürlich wieder.
- source_word: בָּמוֹת הַתֹּפֶת
  choice: die Kulthöhen des Tofet
  rationale: בָּמוֹת bezeichnet kultisch genutzte Höhen beziehungsweise Heiligtümer. „Kulthöhen“ macht diese Bedeutung verständlich, ohne den Ausdruck zu einem bloßen „Schrein“ zu verengen; Tofet wird als Ortsbezeichnung transliteriert.
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: im Tal Ben-Hinnom
  rationale: גֵיא wird mit „Tal“ übersetzt; Ben-Hinnom bleibt als geografischer Eigenname erhalten.
- source_word: לִשְׂרֹף
  choice: um … zu verbrennen
  rationale: Der Infinitiv mit לְ drückt hier den Zweck des Baus aus.
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: ihre Söhne und ihre Töchter
  rationale: Die ausdrückliche Nennung beider Gruppen wird bewahrt und nicht zum allgemeineren „ihre Kinder“ zusammengezogen.
- source_word: בָּאֵשׁ
  choice: im Feuer
  rationale: Die Wendung gibt die lokale beziehungsweise instrumentale Funktion von בְּ in diesem Zusammenhang idiomatisch wieder.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: etwas, das ich nicht geboten habe
  rationale: Der Relativsatz bezieht sich auf die zuvor beschriebene Verbrennung. „Etwas“ verdeutlicht diesen Bezug im Deutschen.
- source_word: וְלֹא עָלְתָה עַל־לִבִּי
  choice: und das mir nicht in den Sinn kam
  rationale: Die deutsche Redewendung vermittelt die hebräische Aussage verständlich. Eine Fußnote bewahrt zugleich das konkrete Bild des hebräischen Wortlauts mit dem Herzen.
theological_decisions:
- issue: Gottes Zurückweisung von Kinderverbrennungen
  choice: Die Handlung wird als von Gott nicht geboten und seinem Herzen beziehungsweise Willen völlig fremd bezeichnet.
  alternative: Eine isoliert verstandene Wiedergabe wie „es kam mir nie in den Sinn“ könnte als ausdrückliche Aussage über fehlendes Vorwissen gelesen werden.
  rationale: Die hebräische Redewendung formuliert eine nachdrückliche Zurückweisung. Die Übersetzung erhält diese Aussage und legt den Vers nicht zusätzlich auf eine systematisch-theologische Behauptung über Gottes Wissen fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kulthöhen“ ist für heutige Leser verständlicher als das missverständliche „Höhen“ allein. Die Paarung „Söhne und Töchter“ sowie die scharfe göttliche Zurückweisung bleiben erhalten.
