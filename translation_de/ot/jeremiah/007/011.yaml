- from: Ist denn dieses Haus, über dem mein Name ausgerufen ist, in euren Augen zu einer Räuberhöhle[a] geworden? Doch auch ich selbst – seht! – habe es gesehen, spricht Jahwe.
  to: Ist denn dieses Haus, über dem mein Name ausgerufen wurde, in euren Augen zu einer Räuberhöhle[a] geworden? Auch ich selbst habe es ja gesehen, spricht Jahwe.
  rationale: Die Revision korrigiert die deutsche Wiedergabe der hebräischen Namensformel und glättet den emphatischen Einschub, ohne den Sinn, die rhetorische Form oder die begriffliche Offenheit des Ausgangstextes zu verändern. Die Fußnote bleibt sachgerecht und ist unverändert übernommen.
