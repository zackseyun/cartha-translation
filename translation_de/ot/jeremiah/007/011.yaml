    issue: Die Formulierung »über dem mein Name ausgerufen ist« ist im Deutschen unidiomatisch und bildet die hebräische Perfektform missverständlich ab.
    rationale: נִקְרָא ist eine passive Perfektform in der Formel »über dem mein Name ausgerufen wurde«. Die Revision erhält die bildhafte Bundes- und Zugehörigkeitsformel, ohne sie zu einer gegenwärtig andauernden Ausrufung umzudeuten.
  - severity: low
