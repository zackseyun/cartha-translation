  text: הַ/מְעָרַ֣ת פָּרִצִ֗ים הָיָ֨ה הַ/בַּ֧יִת הַ/זֶּ֛ה אֲשֶׁר נִקְרָֽא שְׁמִ֥/י עָלָ֖י/ו בְּ/עֵינֵי/כֶ֑ם גַּ֧ם אָנֹכִ֛י הִנֵּ֥ה רָאִ֖יתִי נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/011.yaml
  text: Has this house[a], which is called by my name, become a den of robbers in your eyes? Even I myself, look, I have seen it, declares Yahweh.
translation:
  language: de
  text: Ist denn dieses Haus, über dem mein Name ausgerufen wurde, in euren Augen zu einer Räuberhöhle[a] geworden? Auch ich selbst habe es ja gesehen, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Höhle von Gewalttätern« beziehungsweise »Banditenhöhle«. Das hebräische Wort kann neben Räubern allgemein gewalttätige und gesetzlose Menschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעָרַת פָּרִצִים
  choice: Räuberhöhle
  rationale: Die feste deutsche Wortverbindung bewahrt das Bild einer Höhle als Zufluchtsort gesetzloser Gewalttäter. »Räuber« gibt den kriminellen Sinn wieder, ohne die mögliche Bedeutung gewalttätiger oder marodierender Männer auszuschließen; diese Spannweite wird in der Fußnote genannt.
- source_word: הָיָה
  choice: ist ... geworden
  rationale: 'Das Perfekt bezeichnet im rhetorischen Zusammenhang den eingetretenen Zustand: Das Haus ist zu einem solchen Zufluchtsort gemacht worden.'
- source_word: הַבַּיִת הַזֶּה
  choice: dieses Haus
  rationale: »Haus« entspricht dem hebräischen Wortlaut und bezeichnet im Kontext eindeutig den Tempel, ohne die Bild- und Traditionssprache durch »Tempel« zu ersetzen.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: über dem mein Name ausgerufen ist
  rationale: Die Formulierung bildet die hebräische Besitz- und Bundesformel eng nach und vermeidet die mögliche Fehlvorstellung von »nach mir benannt«.
- source_word: בְּעֵינֵיכֶם
  choice: in euren Augen
  rationale: Die im Deutschen verständliche Wendung bewahrt den Bezug auf die Sichtweise und Bewertung der Angesprochenen.
- source_word: גַּם אָנֹכִי
  choice: Doch auch ich selbst
  rationale: »Auch« und »selbst« geben die nachdrückliche Subjektform wieder; »doch« macht den Kontrast zur Sichtweise der Angesprochenen natürlich hörbar.
- source_word: הִנֵּה
  choice: seht!
  rationale: Der kurze Aufmerksamkeitsruf erhält die deiktische und nachdrückliche Funktion, ohne das altertümliche »siehe« zu verwenden.
- source_word: רָאִיתִי
  choice: habe es gesehen
  rationale: Das im Hebräischen unausgesprochene Objekt wird im Deutschen durch »es« idiomatisch aufgenommen; der perfektive Aspekt bleibt erhalten.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige, würdige deutsche Prophetenformel gibt den autoritativen Ausspruch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Umschrift des Tetragramms bewahrt den offenbarten Eigennamen statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text bietet das Tetragramm als Eigennamen. »Jahwe« ist die gebräuchliche deutsche Umschrift und ersetzt den Namen nicht durch einen Titel.
- issue: Tempelbild als rhetorische Frage
  choice: Ist ... zu einer Räuberhöhle geworden?
  alternative: Ist ... eine Räuberhöhle?
  rationale: Die ingressiv-resultative Wiedergabe von הָיָה bringt den Vorwurf zum Ausdruck, dass das Haus diese Funktion angenommen hat, ohne die rhetorische Spannung der Frage aufzulösen.
- issue: Formel des über dem Haus ausgerufenen Namens
  choice: über dem mein Name ausgerufen ist
  alternative: das meinen Namen trägt
  rationale: Die quellennähere Form bewahrt die Bundes-, Zugehörigkeits- und Schutzkonnotationen der hebräischen Wendung, ohne sie auf nur eine davon festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener prophetischer Schärfe. Die rhetorische Frage und die Wiederholung des betonten göttlichen Subjekts bleiben bestehen; altertümliche Formen werden vermieden.
