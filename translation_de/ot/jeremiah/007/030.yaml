source:
  edition: WLC
  text: כִּֽי עָשׂ֨וּ בְנֵי יְהוּדָ֥ה הָ/רַ֛ע בְּ/עֵינַ֖/י נְאֻום יְהוָ֑ה שָׂ֣מוּ שִׁקּֽוּצֵי/הֶ֗ם בַּ/בַּ֛יִת אֲשֶׁר נִקְרָא שְׁמִ֥/י עָלָ֖י/ו לְ/טַמְּאֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/030.yaml
  text: For the sons of Judah have done what is evil in my sight[a], declares Yahweh. They have put their abominations in the house that is called by my name[c][b], to defile it.
translation:
  language: de
  text: Denn die Leute von Juda haben getan, was in meinen Augen böse ist, spricht Jahwe. Sie haben ihre Gräuel[a] in das Haus gestellt, das nach meinem Namen genannt ist[b][c], um es zu entweihen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort bezeichnet häufig verabscheute kultische Gegenstände, wahrscheinlich einschließlich Götzenbildern.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „das Haus, über dem mein Name ausgerufen ist“. Die Wendung drückt aus, dass das Haus Jahwe gehört und mit ihm verbunden ist.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint ist der Tempel in Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die zuvor angekündigte Gerichtsfolge ein und wahrt den Zusammenhang natürlich.
- source_word: בְנֵי יְהוּדָה
  choice: die Leute von Juda
  rationale: Die wörtliche Wendung „Söhne Judas“ bezeichnet hier kollektiv die Angehörigen Judas; „Leute von Juda“ ist im modernen Deutsch verständlich und schließt die Bevölkerung insgesamt ein.
- source_word: הָרַע בְּעֵינַי
  choice: was böse ist in meinen Augen
  rationale: Bewahrt sowohl das substantivierte Adjektiv als auch das hebräische Bild göttlicher Beurteilung.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die feste prophetische Botenformel würdig und idiomatisch wieder und verwendet für das Tetragramm den Eigennamen.
- source_word: שִׁקּוּצֵיהֶם
  choice: ihre abscheulichen Kultgegenstände
  rationale: Das Wort bezeichnet verabscheute Dinge und wird häufig für kultische Objekte gebraucht. Die Wiedergabe macht den wahrscheinlichen Bezug deutlich, ohne ihn ausschließlich auf Götzenbilder zu verengen.
- source_word: בַּבַּיִת
  choice: in das Haus
  rationale: Bewahrt die konkrete Bezeichnung „Haus“; der Kontext und die Fußnote identifizieren es als den Jerusalemer Tempel.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: über dem mein Name ausgerufen ist
  rationale: Gibt die ungewöhnliche hebräische Passivform nahe am Wortlaut wieder und bewahrt die Vorstellung göttlicher Beanspruchung und Zugehörigkeit.
- source_word: לְטַמְּאוֹ
  choice: und es dadurch entweiht
  rationale: Der Infinitiv kann Zweck oder Folge ausdrücken. „Dadurch entweiht“ erfasst hier die durch das Aufstellen bewirkte kultische Verunreinigung, ohne eine ausschließliche Absichtsaussage zu erzwingen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von שִׁקּוּצֵיהֶם
  choice: abscheuliche Kultgegenstände
  alternative: Gräuel; Götzenbilder
  rationale: Der Ausdruck ist kultisch geprägt, kann aber verschiedene verabscheute Gegenstände umfassen. Die Übersetzung wahrt diese Breite und deutet den Kontext an, ohne nur Götzenbilder festzulegen.
- issue: Funktion von לְטַמְּאוֹ
  choice: Folge bzw. bewirkte Entweihung
  alternative: 'Absicht: „um es zu entweihen“'
  rationale: Die לְ-Konstruktion lässt Zweck und Folge zu. Im Deutschen vermeidet „dadurch“ die unnötige Festlegung, die Täter hätten ausdrücklich mit dem Ziel gehandelt, den Tempel zu entweihen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Leute von Juda“ vermeidet das heute missverständliche rein männliche „Söhne Judas“. Die Syntax bleibt der prophetischen Anklage eng verbunden; der Gedankenstrich bindet die kulturelle Erläuterung lesbar ein.
