id: JER.7.14
reference: Jeremiah 7:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/עָשִׂ֜יתִי לַ/בַּ֣יִת אֲשֶׁ֧ר נִֽקְרָא שְׁמִ֣/י עָלָ֗י/ו אֲשֶׁ֤ר אַתֶּם֙ בֹּטְחִ֣ים בּ֔/וֹ וְ/לַ֨/מָּק֔וֹם אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֽוֹתֵי/כֶ֑ם כַּ/אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/שִׁלֽוֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/014.yaml
  text: So I will do to the house that is called by my name[a], in which you trust, and to the place that I gave to you and to your fathers[b], just as I did to Shiloh.
translation:
  language: de
  text: Darum werde ich mit dem Haus, das meinen Namen trägt[a] und auf das ihr vertraut, und mit dem Ort, den ich euch und euren Vätern gegeben habe, genauso verfahren wie mit Schilo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „über dem mein Name ausgerufen ist“. Diese hebräische Wendung besagt, dass das Haus dem HERRN gehört oder mit ihm identifiziert ist.'
    reason: lexical_alternative
  - marker: b
    text: Schilo war der frühere Ort des Heiligtums. Was dort geschehen war, dient hier als warnendes Beispiel; siehe 1. Samuel 4 und Jeremia 7,12.
    reason: cross_reference
lexical_decisions:
- source_word: וְעָשִׂיתִי
  choice: Darum werde ich … verfahren
  rationale: Das einleitende וְ verbindet den Satz folgernd mit der vorausgehenden Gerichtsankündigung. „Darum“ gibt diesen Zusammenhang natürlich wieder; „verfahren mit“ bewahrt, dass das Hebräische die konkrete Handlung unheilvoll unausgesprochen lässt.
- source_word: לַבַּיִת
  choice: mit dem Haus
  rationale: בַּיִת bedeutet wörtlich „Haus“ und bezeichnet hier den Tempel. „Haus“ erhält die Bild- und Wortwahl des Hebräischen, ohne die Bedeutung unnötig einzuengen.
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: das meinen Namen trägt
  rationale: Die hebräische Wendung bezeichnet ein Haus, das JHWH zugeordnet und durch seinen Namen gekennzeichnet ist. Die deutsche Formulierung gibt diesen Sinn klar und idiomatisch wieder; die wörtlichere Gestalt wird in der Fußnote genannt.
- source_word: אֲשֶׁר אַתֶּם בֹּטְחִים בּוֹ
  choice: auf das ihr vertraut
  rationale: Das Partizip beschreibt das fortdauernde Vertrauen der Angeredeten. „Auf etwas vertrauen“ ist im Deutschen die natürliche Verbindung.
- source_word: וְלַמָּקוֹם
  choice: und mit dem Ort
  rationale: „Ort“ bewahrt die Unterscheidung zwischen dem Tempelgebäude („Haus“) und dem umfassenderen heiligen Ort. Ein demonstratives „diesem“ steht im hebräischen Text dieses Verses nicht.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם וְלַאֲבוֹתֵיכֶם
  choice: den ich euch und euren Vätern gegeben habe
  rationale: Die Wiedergabe folgt der wiederholten Präposition ל und erhält mit „Vätern“ die konkrete covenantgeschichtliche Ausdrucksweise des Ausgangstextes.
- source_word: כַּאֲשֶׁר עָשִׂיתִי לְשִׁלֹה
  choice: genauso verfahren wie mit Schilo
  rationale: Die Vergleichskonstruktion wird im Deutschen ausdrücklich und flüssig wiedergegeben. „Schilo“ ist die übliche deutsche Form des Ortsnamens.
theological_decisions:
- issue: Bundes- und Heiligtumssprache ohne spätere dogmatische Präzisierung
  choice: „Haus“ und „Ort“ bleiben als verschiedene Bezeichnungen erhalten.
  alternative: „Tempel“ beziehungsweise „Heiligtum“
  rationale: Der hebräische Text unterscheidet das „Haus“ vom „Ort“. Diese Unterscheidung lässt den Umfang der Gerichtsankündigung bestehen, ohne ihn interpretierend zu verengen.
- issue: Bedeutung der Namensformel
  choice: „das meinen Namen trägt“ mit wörtlicherer Erklärung in der Fußnote
  alternative: „über dem mein Name ausgerufen ist“
  rationale: Die Hauptfassung vermittelt verständlich die Zugehörigkeit und Identifikation mit JHWH, während die Fußnote die eigentümliche hebräische Form transparent hält.
- issue: Wiedergabe von אֲבוֹתֵיכֶם
  choice: „euren Vätern“
  alternative: „euren Vorfahren“
  rationale: „Väter“ wahrt die konkrete Formulierung des Textes und ist in diesem geschichtlichen Zusammenhang im modernen Deutsch verständlich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstruktur folgt dem Hebräischen, wird aber durch „mit … verfahren“ idiomatisch geglättet. Die unausgesprochene Art des kommenden Gerichts bleibt bewusst offen.
