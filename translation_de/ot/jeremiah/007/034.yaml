  terminology: „Juda“, „Jerusalem“, „Bräutigam“, „Braut“ und „Land“ sind konsistent und kontextgerecht. „Straßen“ ist als Haupttextwahl für חֻצוֹת vertretbar; die mögliche Bedeutung öffentlicher Plätze wird korrekt in der Fußnote angezeigt.
