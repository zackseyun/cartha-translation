id: JER.7.34
reference: Jeremiah 7:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֣י מֵ/עָרֵ֣י יְהוּדָ֗ה וּ/מֵֽ/חֻצוֹת֙ יְר֣וּשָׁלִַ֔ם ק֤וֹל שָׂשׂוֹן֙ וְ/ק֣וֹל שִׂמְחָ֔ה ק֥וֹל חָתָ֖ן וְ/ק֣וֹל כַּלָּ֑ה כִּ֥י לְ/חָרְבָּ֖ה תִּהְיֶ֥ה הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/034.yaml
  text: And I will put an end[a], from the cities of Judah and from the streets of Jerusalem, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride[c][b], for the land will become a ruin.
translation:
  language: de
  text: Und ich werde in den Städten Judas und auf den Straßen Jerusalems[a] den Jubel und die Freude verstummen lassen, die Stimme des Bräutigams und die Stimme der Braut; denn das Land wird zur Einöde werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Plätzen Jerusalems“; das hebräische Wort kann Straßen oder öffentliche Plätze bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn das Land wird verwüstet sein“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: Und ich werde … verstummen lassen
  rationale: Der Hifil von שׁבת bezeichnet hier ein verursachtes Aufhören. „Verstummen lassen“ gibt die göttliche Verursachung natürlich wieder und passt zu den folgenden hörbaren Äußerungen.
- source_word: מֵעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Das hebräische מִן bezeichnet wörtlich den Bereich, aus dem die Laute entfernt werden. Im Deutschen ist bei „verstummen lassen“ die Ortsangabe mit „in“ natürlicher, ohne den Sinn der Beseitigung aus diesen Orten aufzugeben.
- source_word: וּמֵחֻצוֹת יְרוּשָׁלִַם
  choice: und auf den Straßen Jerusalems
  rationale: חֻצוֹת kann Straßen oder öffentliche Plätze bezeichnen. „Straßen“ ist im Haupttext klar und idiomatisch; die weitere Bedeutung wird in einer Fußnote bewahrt.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  choice: den Jubel und die Freude
  rationale: קוֹל meint den hörbaren Ausdruck; bei den Abstrakta שָׂשׂוֹן und שִׂמְחָה vermittelt die natürliche deutsche Paarung „Jubel und Freude“ die festlichen Laute, ohne schwerfälliges „Stimme der Freude“.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  choice: die Stimme des Bräutigams und die Stimme der Braut
  rationale: Bei den Personen ist „Stimme“ konkret und bewahrt die wiederholte hebräische Hochzeitsformel.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für das Ende der Festfreude ein.
- source_word: לְחָרְבָּה תִּהְיֶה הָאָרֶץ
  choice: das Land wird zur Einöde werden
  rationale: היה mit לְ und einem Substantiv drückt hier ein Werden aus. „Einöde“ gibt den Zustand der Verwüstung wieder, während „das Land“ den Bezug auf das von Gericht betroffene Gebiet wahrt.
theological_decisions:
- issue: Göttliches Handeln im Gericht
  choice: 'Die erste Person bleibt ausdrücklich erhalten: „ich werde … verstummen lassen“.'
  alternative: Eine unpersönliche Formulierung wie „Jubel und Freude werden verstummen“.
  rationale: Die hebräische Verbform stellt Gott ausdrücklich als den Handelnden dar; diese Aussage wird weder abgeschwächt noch verallgemeinert.
- issue: Umfang der Verwüstung
  choice: „das Land wird zur Einöde werden“
  alternative: „das Land wird verwüstet sein“
  rationale: Die gewählte Form bewahrt sowohl den nominalen Ausdruck חָרְבָּה als auch den Übergang in den Zustand der Verwüstung, ohne über dessen Dauer oder vollständigen Umfang hinauszugehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bewahrt die feierlich-düstere Aufzählung und die wiederholte Hochzeitsformel, vermeidet aber unnatürliche Abstraktformulierungen. Alle Fußnotenmarker stehen an der jeweils betroffenen Stelle im Haupttext.
