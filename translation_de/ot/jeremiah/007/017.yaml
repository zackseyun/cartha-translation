  text: הַֽ/אֵינְ/ךָ֣ רֹאֶ֔ה מָ֛ה הֵ֥מָּה עֹשִׂ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וּ/בְ/חֻצ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/017.yaml
  text: Do you not see what they are doing in the cities of Judah and in the streets of Jerusalem?[a]
translation:
  language: de
  text: Siehst du nicht, was sie in den Städten Judas und auf den Straßen Jerusalems tun?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Plätzen Jerusalems“ beziehungsweise „an den offenen Orten Jerusalems“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵינְךָ רֹאֶה
  choice: Siehst du nicht
  rationale: Gibt die verneinte rhetorische Frage mit direkter Anrede an Jeremia natürlich und nah am Hebräischen wieder.
- source_word: מָה הֵמָּה עֹשִׂים
  choice: was sie … tun
  rationale: Das Partizip bezeichnet das gegenwärtige beziehungsweise fortdauernde Handeln. Das selbstständige Pronomen הֵמָּה setzt zwar einen gewissen Nachdruck, doch eine stärkere Wiedergabe wie „sie selbst“ wäre im Deutschen hier unnötig markiert.
- source_word: בְּעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Bewahrt die Ortsangabe und die hebräische Genitivbeziehung in natürlichem Deutsch.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִָם
  choice: und auf den Straßen Jerusalems
  rationale: חֻצוֹת kann Straßen, Plätze oder offene Bereiche einer Stadt bezeichnen. „Auf den Straßen“ ist im Zusammenhang idiomatisch; die weiteren möglichen Bedeutungen werden in der Fußnote erhalten.
