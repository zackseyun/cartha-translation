source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ לָ/כֶ֔ם אֶל דִּבְרֵ֥י הַ/שֶּׁ֖קֶר לֵ/אמֹ֑ר הֵיכַ֤ל יְהוָה֙ הֵיכַ֣ל יְהוָ֔ה הֵיכַ֥ל יְהוָ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/004.yaml
  text: Do not trust in deceptive words[a], saying, “The temple of Yahweh, the temple of Yahweh[b], the temple of Yahweh are these.”
translation:
  language: de
  text: 'Verlasst euch nicht auf trügerische Worte[a], indem ihr sagt: »Der Tempel Jahwes, der Tempel Jahwes, der Tempel Jahwes – das sind sie!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf falsche Worte“. Das hebräische Wort kann sowohl die Unwahrheit als auch die täuschende Wirkung der Worte betonen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich folgt auf die dreimalige Formel „der Tempel Jahwes“ ein betontes pluralisches „sie“. Die ungewöhnliche Formulierung kann auf das sichtbare Heiligtum mit seinen Anlagen weisen. Die Wiederholung bringt das fehlgeleitete Vertrauen auf den Tempel selbst zum Ausdruck.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: אַל תִּבְטְחוּ לָכֶם
  choice: Verlasst euch nicht
  rationale: אַל mit dem Imperfekt formuliert ein Verbot. Die reflexive deutsche Wendung „sich auf etwas verlassen“ gibt בטח und zugleich die durch לָכֶם verstärkte persönliche Vertrauenshaltung natürlich wieder.
- source_word: אֶל דִּבְרֵי הַשֶּׁקֶר
  choice: auf trügerische Worte
  rationale: אֶל bezeichnet nach בטח das Objekt des Vertrauens. הַשֶּׁקֶר kann sowohl die Unwahrheit als auch die täuschende Wirkung der Worte hervorheben; „trügerisch“ hält beides offen.
- source_word: לֵאמֹר
  choice: indem ihr sagt
  rationale: Der Infinitiv leitet den Inhalt beziehungsweise die konkrete Äußerung ein, in der sich das beanstandete Vertrauen zeigt.
- source_word: הֵיכַל יְהוָה
  choice: der Tempel Jahwes
  rationale: הֵיכַל bezeichnet hier eindeutig das Jerusalemer Heiligtum; die Genitivverbindung wird im Deutschen natürlich wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird als persönlicher Gottesname wiedergegeben und nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: הֵמָּה
  choice: diese hier sind es
  rationale: Das betonte pluralische Pronomen weist offenbar auf das gegenwärtige Heiligtum beziehungsweise dessen sichtbare Anlagen. Die Formulierung bewahrt den demonstrativen und pluralischen Zug, ohne die ungewöhnliche hebräische Syntax einzuebnen.
theological_decisions:
- issue: Die dreifache Tempelformel
  choice: Die Wendung „der Tempel Jahwes“ wird dreimal unverändert wiederholt.
  alternative: Die Wiederholung zu „Dies ist der Tempel Jahwes“ umzuformen oder zu verkürzen.
  rationale: Die dreifache Wiederholung trägt die rhetorische Wucht der falschen Heilssicherheit. Ihre Beibehaltung lässt Jeremias Kritik stehen, ohne sie erklärend in den Vers einzubauen.
- issue: Bezug des pluralischen הֵמָּה
  choice: „diese hier sind es“ als demonstrativer Hinweis auf das sichtbare Heiligtum oder seine Anlagen
  alternative: Singularisch „dies ist er“ oder Bezug auf die zuvor genannten Worte
  rationale: Das Hebräische verwendet ein betontes Pluralpronomen, obwohl הֵיכַל singularisch ist. Die Übersetzung wahrt diese Spannung; eine Fußnote erläutert die ungewöhnliche Konstruktion, ohne ihren Bezug dogmatisch festzulegen.
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich יהוה. Die Umschrift bewahrt den persönlichen Namen und vermeidet die Ersetzung durch einen Titel.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verlasst euch nicht“ ist unmittelbar verständlich und entspricht dem warnenden Ton. Der Gedankenstrich markiert den nachgestellten demonstrativen Ausruf; die auffällige dreifache Wiederholung bleibt vollständig erhalten.
