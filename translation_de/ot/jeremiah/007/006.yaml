source:
  edition: WLC
  text: גֵּ֣ר יָת֤וֹם וְ/אַלְמָנָה֙ לֹ֣א תַֽעֲשֹׁ֔קוּ וְ/דָ֣ם נָקִ֔י אַֽל תִּשְׁפְּכ֖וּ בַּ/מָּק֣וֹם הַ/זֶּ֑ה וְ/אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים לֹ֥א תֵלְכ֖וּ לְ/רַ֥ע לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/006.yaml
  text: Do not oppress the foreigner[a], the fatherless, and the widow; do not shed innocent blood in this place[c][b]; and do not go after other gods to your own harm.
translation:
  language: de
  text: Unterdrückt den Fremden[a], die Waise[b] und die Witwe nicht. Vergießt an diesem Ort kein unschuldiges Blut, und geht anderen Göttern nicht nach – zu eurem eigenen Schaden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: den bei euch lebenden Fremden; gemeint ist ein Nichtisraelit, der als ansässiger Fremder unter Israel lebte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: den Vaterlosen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: der Fremde
  rationale: גֵּר bezeichnet hier einen nicht einheimischen Menschen, der dauerhaft unter Israel lebt und gesellschaftlich besonders schutzbedürftig ist. „Fremder“ ist im modernen Deutschen verständlich; eine Fußnote präzisiert den Status.
- source_word: יָתוֹם
  choice: die Waise
  rationale: יָתוֹם bezeichnet ein elternloses oder insbesondere vaterloses Kind. „Waise“ ist die natürliche moderne Bezeichnung; „Vaterloser“ bleibt als engere Alternative in der Fußnote erhalten.
- source_word: אַלְמָנָה
  choice: die Witwe
  rationale: „Witwe“ gibt die bezeichnete soziale Gruppe präzise und idiomatisch wieder.
- source_word: תַעֲשֹׁקוּ
  choice: unterdrückt
  rationale: Das Verb עָשַׁק bezeichnet bedrückende Ausbeutung oder Unterdrückung, besonders gegenüber sozial Schwachen.
- source_word: דָם נָקִי
  choice: unschuldiges Blut
  rationale: Die feste Wendung bezeichnet Blut, das durch ungerechtes Töten vergossen wird; die deutsche Entsprechung bewahrt ihre rechtlich-moralische Kraft.
- source_word: תִּשְׁפְּכוּ
  choice: vergießt
  rationale: In Verbindung mit Blut ist „vergießen“ die idiomatische deutsche Wiedergabe von שׁפך.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: an diesem Ort
  rationale: Die Formulierung bewahrt den ausdrücklichen Ortsbezug der Tempelrede.
- source_word: אַחֲרֵי ... לֹא תֵלְכוּ
  choice: lauft nicht ... nach
  rationale: Die Wiedergabe erhält das hebräische Bewegungsbild und bezeichnet zugleich verständlich religiöse Gefolgschaft und Loyalität.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: andere Götter
  rationale: Dies ist die direkte, etablierte Wiedergabe und fügt keine im Hebräischen nicht ausgedrückte ethnische Bedeutung hinzu.
- source_word: לְרַע לָכֶם
  choice: zu eurem eigenen Schaden
  rationale: Die Wendung benennt die schädliche Folge für die Angesprochenen. „Eigenen“ macht den im Pronomen enthaltenen Rückbezug im Deutschen natürlich deutlich.
theological_decisions:
- issue: Benennung der drei schutzbedürftigen Gruppen
  choice: der Fremde, die Waise und die Witwe
  alternative: der ansässige Fremde, der Vaterlose und die Witwe
  rationale: Die drei konkreten sozialen Gruppen bleiben erhalten und werden nicht zur allgemeinen Kategorie „Schutzbedürftige“ verflacht. Fußnoten bewahren die genaueren möglichen Bedeutungsnuancen von גֵּר und יָתוֹם.
- issue: Bild für die Hinwendung zu anderen Göttern
  choice: anderen Göttern nachlaufen
  alternative: anderen Göttern folgen
  rationale: „Nachlaufen“ bewahrt das hebräische Bild, ohne die religiöse Loyalität in eine bestimmte konfessionelle Deutung aufzulösen.
- issue: Bezug von לְרַע לָכֶם
  choice: 'als schädliche Folge des Nachlaufens: „zu eurem eigenen Schaden“'
  alternative: 'als Zweckangabe: „um euch zu schaden“'
  rationale: Die knappe deutsche Formulierung erhält die offene Zweck-/Folgennuance der hebräischen Präposition לְ, ohne Gott ausdrücklich als Urheber des Schadens einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativen im Plural. Die traditionelle Wendung „unschuldiges Blut vergießen“ bleibt wegen ihrer Genauigkeit und allgemeinen Verständlichkeit erhalten. Der Gedankenstrich vor der Schlusswendung markiert deren nachdrücklichen Folgencharakter, ohne die syntaktische Mehrdeutigkeit unnötig aufzulösen.
