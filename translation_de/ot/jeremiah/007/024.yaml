base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/024.yaml
  text: But they did not listen[a], and they did not incline their ear, but walked in their own counsels, in the stubbornness of their evil heart[c][b], and they went backward and not forward.
translation:
  language: de
  text: Doch sie hörten nicht[a] und neigten ihr Ohr nicht, sondern gingen nach ihren eigenen Plänen[b] und nach dem Starrsinn ihres bösen Herzens[c]; und sie gingen rückwärts und nicht vorwärts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehorchten nicht“. Das hebräische Wort kann sowohl Hören als auch ein Hören bezeichnen, das zum Befolgen führt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Ratschlägen“ oder „Vorhaben“.'
    reason: lexical_alternative
  - marker: c
    text: Im Hebräischen umfasst „Herz“ den inneren Willen und das Denken, nicht nur die Gefühle.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: hörten nicht
  rationale: Das hebräische Verb kann vom bloßen Hören bis zum Hören mit der Folge des Gehorchens reichen. „Hörten nicht“ bewahrt diese Bedeutungsbreite; der Parallelismus mit dem nicht geneigten Ohr macht die verweigerte Aufmerksamkeit deutlich.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: neigten ihr Ohr nicht
  rationale: Die anschauliche hebräische Wendung für aufmerksames Zuhören lässt sich im Deutschen verständlich und würdevoll beibehalten.
- source_word: וַיֵּלְכוּ בְּמֹעֵצוֹת
  choice: gingen nach ihren eigenen Plänen
  rationale: הלך mit ב beschreibt hier ein Verhalten, das sich an etwas ausrichtet. „Nach … gehen“ erhält das Bewegungsbild, während „Pläne“ die beratende und planende Bedeutung von מֹעֵצוֹת natürlich wiedergibt.
- source_word: בִּשְׁרִרוּת
  choice: nach dem Starrsinn
  rationale: Das Wort bezeichnet besonders bei Jeremia hartnäckigen Eigenwillen. „Starrsinn“ ist prägnant und im modernen Deutschen klar.
- source_word: לִבָּם הָרָע
  choice: ihres bösen Herzens
  rationale: „Herz“ bewahrt das biblische Bild und umfasst im Hebräischen Denken, Wollen und inneres Begehren, nicht nur Gefühle. Der Singular mit kollektiver Bedeutung bleibt erhalten.
- source_word: וַיִּהְיוּ לְאָחוֹר וְלֹא לְפָנִים
  choice: so gingen sie rückwärts und nicht vorwärts
  rationale: Die Wiedergabe erhält den ausdrücklichen Richtungskontrast und vermittelt zugleich das Bild des Rückschritts, ohne es weiter auszudeuten.
theological_decisions:
- issue: Moralische Aussage über das „böse Herz“
  choice: Die ausdrückliche moralische Bewertung wird unverändert als „böses Herz“ wiedergegeben.
  alternative: Eine dogmatisch erweiternde Umschreibung wie „sündige Natur“ oder „durch und durch böses Herz“.
  rationale: Der Text kennzeichnet das Herz als böse und seinen Willen als starrsinnig, formuliert hier aber keine umfassendere anthropologische Lehrdefinition.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bewegungsmetaphorik („gingen“, „rückwärts“, „vorwärts“) und die hebräische Ohr-Wendung bleiben erhalten. Das Semikolon gliedert die lange Satzfolge, ohne die enge inhaltliche Verbindung aufzulösen.
