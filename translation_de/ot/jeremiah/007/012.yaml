base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/012.yaml
  text: For go now to my place that was in Shiloh[a], where I made my name dwell at first, and see what I did to it because of the evil of my people Israel.
translation:
  language: de
  text: Denn geht doch zu meiner Stätte in Schilo, wo ich anfangs meinen Namen wohnen ließ,[a] und seht, was ich ihr angetan habe wegen der Bosheit meines Volkes Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo ich meinen Namen dort wohnen ließ“; der hebräische Ausdruck kann auch im Sinn von „wo ich meinen Namen dort Wohnsitz nehmen ließ“ wiedergegeben werden. Er bewahrt das Bild, dass Gottes Name dort wohnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung für die vorangehende Warnung ein und bewahrt den kausalen Zusammenhang.
- source_word: לְכוּ נָא
  choice: geht doch
  rationale: Der Pluralimperativ mit נָא drückt hier einen nachdrücklichen Aufruf aus; „doch“ ist im modernen Deutschen natürlich, ohne bloße Höflichkeit zu signalisieren.
- source_word: מְקוֹמִי
  choice: meiner Stätte
  rationale: „Stätte“ bezeichnet idiomatisch einen mit Gott und dem früheren Heiligtum verbundenen Ort und bewahrt zugleich die possessive Form.
- source_word: אֲשֶׁר בְּשִׁלוֹ
  choice: in Schilo
  rationale: Die knappe deutsche Fügung identifiziert die Stätte räumlich; ihre frühere Bedeutung ergibt sich aus „anfangs“ und dem anschließenden Gerichtsrückblick.
- source_word: שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: wo ich ... meinen Namen wohnen ließ
  rationale: Bewahrt das hebräische Wohnbild und gibt den kausativen Piel-Sinn natürlich wieder.
- source_word: בָּרִאשׁוֹנָה
  choice: anfangs
  rationale: Markiert Schilo als die frühere Stätte des Heiligtums in knapper, gegenwärtiger Standardsprache.
- source_word: וּרְאוּ
  choice: und seht
  rationale: Gibt den fortgesetzten Imperativ direkt wieder und fordert zur Betrachtung des geschichtlichen Beispiels auf.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי לוֹ
  choice: was ich mit ihr getan habe
  rationale: Das Suffix bezieht sich am natürlichsten auf die Stätte; das feminine Pronomen entspricht dem deutschen Genus von „Stätte“.
- source_word: מִפְּנֵי
  choice: wegen
  rationale: Gibt die kausale Bedeutung knapp und eindeutig wieder.
- source_word: רָעַת עַמִּי יִשְׂרָאֵל
  choice: der Bosheit meines Volkes Israel
  rationale: רָעָה bezeichnet hier das moralisch Böse, das Gottes Gericht veranlasst; „Bosheit“ macht diesen Sinn im Deutschen klar.
theological_decisions:
- issue: Sprache der göttlichen Gegenwart in שִׁכַּנְתִּי שְׁמִי שָׁם
  choice: wo ich anfangs meinen Namen wohnen ließ
  alternative: wo ich anfangs meinen Namen einsetzte
  rationale: Die gewählte Fassung bewahrt das konkrete hebräische Bild vom Wohnen des Namens, ohne Gottes Wesen räumlich auf Schilo zu begrenzen.
- issue: Zeitlicher Bezug der Stätte in Schilo
  choice: in Schilo, wo ich anfangs ...
  alternative: die in Schilo war
  rationale: Die Formulierung lässt den hebräischen Relativanschluss natürlich ins Deutsche übergehen. „Anfangs“ und der Rückblick auf Gottes Gericht kennzeichnen Schilo hinreichend als frühere Heiligtumsstätte, ohne die im Hebräischen nicht ausdrücklich markierte Vergangenheitsform einzufügen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Stätte“ trägt den Heiligtumsbezug besser als das allgemeinere „Ort“; „geht doch“ wahrt den nachdrücklichen Ton von לְכוּ נָא. Die Syntax bleibt nahe am Hebräischen, ohne im Deutschen schwerfällig zu wirken.
