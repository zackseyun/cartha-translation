translation:
  language: de
  text: Denn wenn ihr eure Wege und eure Taten wirklich bessert[a], wenn ihr wirklich Recht übt zwischen einem Mann und seinem Nächsten[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ihr eure Wege und eure Taten gründlich ändert“. Im Hebräischen wird das Verb in beiden Satzteilen durch die Verbindung eines Infinitivs mit dem finiten Verb nachdrücklich verstärkt.'
    reason: lexical_alternative
  - marker: b
