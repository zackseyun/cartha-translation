lexical_decisions:
- source_word: כִּי אִם
  choice: Denn nur wenn
  rationale: כִּי wahrt die begründende Verknüpfung mit dem Zusammenhang, während אִם die Bedingung einführt. „Nur wenn“ macht deutlich, dass nun die tatsächliche Voraussetzung genannt wird, ohne den Gegensatz unnötig auszudeuten.
- source_word: הֵיטֵיב תֵּיטִיבוּ
  choice: ihr ... wirklich bessert
  rationale: Der Infinitivus absolutus zusammen mit dem finiten Verb verstärkt die Aussage. „Wirklich“ gibt diese Betonung in natürlichem Deutsch wieder; „bessert“ passt zu den Objekten „Wege“ und „Taten“ und bewahrt den Veränderungssinn.
- source_word: דַּרְכֵיכֶם
  choice: eure Wege
  rationale: „Wege“ erhält das anschauliche hebräische Bild für die Lebensführung und ist im Deutschen verständlich und bibelsprachlich vertraut.
- source_word: מַעַלְלֵיכֶם
  choice: eure Taten
  rationale: Das Substantiv bezeichnet Handlungen oder Werke. „Taten“ ist gegenwärtig, würdig und bildet mit „Wege“ ein natürliches Paar.
- source_word: אִם עָשׂוֹ תַעֲשׂוּ
  choice: wenn ihr wirklich ... übt
  rationale: Auch hier verstärkt der Infinitivus absolutus das finite Verb. „Wirklich“ bildet die hebräische Emphase ab; „Recht üben“ ist im Deutschen eine natürliche Verbindung.
- source_word: מִשְׁפָּט
  choice: Recht
  rationale: Gemeint ist gerechtes Urteilen und Handeln im Verhältnis zwischen Menschen. „Recht üben“ bewahrt sowohl die rechtliche als auch die ethische Dimension.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: zwischen einem Menschen und seinem Mitmenschen
  rationale: Die Formulierung gibt die Beziehung zwischen אִישׁ und רֵעֵהוּ natürlich wieder. „Mensch“ kann im Deutschen die repräsentative Funktion des maskulinen hebräischen Singulars tragen, ohne den Geltungsbereich auf Männer zu beschränken.
theological_decisions:
- issue: Repräsentativ maskuline Sprache in אִישׁ
  choice: einem Menschen
  alternative: einem Mann
  rationale: אִישׁ ist formal maskulin, steht hier jedoch in einer allgemeinen rechtlich-sozialen Wendung. „Mensch“ wahrt den generischen Geltungsbereich im modernen Deutschen; die Fußnote nennt die formnähere Alternative.
- issue: Bedingungscharakter der Aufforderung
  choice: Denn nur wenn
  alternative: Denn wenn
  rationale: Der Vers formuliert Bedingungen für die zuvor angesprochene Verheißung. „Nur wenn“ entspricht einer möglichen kontextuellen Kraft von כִּי אִם, ohne die folgenden Handlungen als verdienstliche Heilsgrundlage dogmatisch auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener Wegmetaphorik. Die parallele hebräische Verstärkung wird in beiden Satzteilen durch „wirklich“ sichtbar gemacht. Der Vers bleibt wegen der Fortsetzung syntaktisch offen und endet daher mit einem Komma.
