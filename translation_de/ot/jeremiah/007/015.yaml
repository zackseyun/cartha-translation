base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/007/015.yaml
  text: And I will cast you out from before me[a], just as I cast out all your brothers[c][b], all the offspring of Ephraim.
translation:
  language: de
  text: Und ich werde euch von meinem Angesicht verstoßen[a], so wie ich alle eure Brüder[b], die ganze Nachkommenschaft Ephraims[c], verstoßen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „von über meinem Angesicht“. Gemeint sein kann auch: „aus meiner Gegenwart“ oder „aus meinen Augen“.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Brüdern“ sind die verwandten Israeliten Judas gemeint, besonders die Angehörigen des Nordreichs.
    reason: cultural_note
  - marker: c
    text: „Ephraim“ steht hier für das Nordreich Israel und seine Bevölkerung.
    reason: cross_reference
lexical_decisions:
- source_word: וְהִשְׁלַכְתִּי
  choice: Und ich werde … wegwerfen
  rationale: Das Hifil von שׁלך bezeichnet hier ein gewaltsames Verstoßen oder Entfernen. „Wegwerfen“ bewahrt das kräftige Bild und lässt sich bei der Wiederholung desselben Verbs konsequent verwenden.
- source_word: מֵעַל פָּנָי
  choice: von meinem Angesicht
  rationale: Die Wendung bedeutet wörtlich „von über/vor meinem Angesicht“. Die gewählte Form bleibt dem hebräischen Bild nahe; die idiomatischen Bedeutungen „aus meiner Gegenwart“ und „aus meinen Augen“ werden in der Fußnote genannt.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Kennzeichnet klar den Vergleich zwischen dem angekündigten Gericht über die Angeredeten und dem bereits vollzogenen Gericht über Ephraim.
- source_word: כָּל אֲחֵיכֶם
  choice: alle eure Brüder
  rationale: „Brüder“ erhält die familiäre und ethnische Bildsprache des maskulinen Plurals אחים. Gemeint sind hier die verwandten Israeliten des Nordreichs.
- source_word: אֵת כָּל זֶרַע אֶפְרָיִם
  choice: die ganze Nachkommenschaft Ephraims
  rationale: זֶרַע bezeichnet kollektiv die Nachkommen. „Nachkommenschaft“ ist im Deutschen würdevoll und präzise; „Ephraim“ bleibt als biblischer Eigenname stehen, statt im Haupttext interpretierend durch „Nordreich“ ersetzt zu werden.
theological_decisions:
- issue: Die Wendung מֵעַל פָּנָי als Ausdruck göttlicher Verwerfung
  choice: von meinem Angesicht
  alternative: aus meiner Gegenwart; aus meinen Augen
  rationale: Die bildhafte Rede vom Angesicht Gottes wird bewahrt, ohne daraus eine weitergehende Aussage über Gottes räumliche Gegenwart abzuleiten. Eine Fußnote macht die idiomatische Bedeutung transparent.
- issue: Der Bezug von אֲחֵיכֶם
  choice: Brüder
  alternative: Verwandte; Stammesbrüder
  rationale: Die Übersetzung erhält den Verwandtschaftsausdruck des Hebräischen. Die Fußnote erläutert, dass Judas israelitische Brüder, besonders die Angehörigen des Nordreichs, gemeint sind.
- issue: Die metonymische Bedeutung von Ephraim
  choice: Ephraim als Eigenname beibehalten
  alternative: das Nordreich Israel
  rationale: Der Ausgangstext nennt Ephraim. Die politische und korporative Bedeutung wird erläutert, aber nicht interpretierend in den Haupttext eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Wiederholung von שׁלך wird durch zweimaliges „wegwerfen“ erhalten. „Von meinem Angesicht“ ist bewusst bibelsprachlich, aber verständlich; die Fußnote bietet idiomatische Alternativen. Die Apposition „die ganze Nachkommenschaft Ephraims“ erklärt im Satz, wer mit den Brüdern gemeint ist, ohne den Eigennamen aufzulösen.
