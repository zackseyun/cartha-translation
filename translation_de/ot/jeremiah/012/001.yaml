source:
  edition: WLC
  text: צַדִּ֤יק אַתָּה֙ יְהוָ֔ה כִּ֥י אָרִ֖יב אֵלֶ֑י/ךָ אַ֤ךְ מִשְׁפָּטִים֙ אֲדַבֵּ֣ר אוֹתָ֔/ךְ מַדּ֗וּעַ דֶּ֤רֶךְ רְשָׁעִים֙ צָלֵ֔חָה שָׁל֖וּ כָּל בֹּ֥גְדֵי בָֽגֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/001.yaml
  text: 'You are righteous[a], O Yahweh, when I bring a case before you[c][b]; yet I would speak with you about matters of justice: Why does the way of the wicked prosper? Why are all who deal treacherously at ease?'
translation:
  language: de
  text: Du bist gerecht, Jahwe, auch wenn ich mit dir einen Rechtsstreit führe.[a] Doch über Fragen des Rechts möchte ich mit dir reden:[b] Warum hat der Weg der Frevler Erfolg? Warum leben alle ungestört, die durch und durch treulos handeln?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn ich mit dir streite“. Das hebräische Verb kann allgemein „streiten“ oder, wie hier im rechtlichen Zusammenhang, „einen Rechtsstreit führen“ bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „über Rechtssprüche“ oder „über Rechtsangelegenheiten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht eine verstärkende Verbindung: „alle Treulosen der Treulosigkeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: gerecht
  rationale: Das prädikative Adjektiv bezeichnet Jahwes moralische Gerechtigkeit und trägt zugleich dem rechtlichen Bildfeld des Verses Rechnung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben.
- source_word: כִּי אָרִיב אֵלֶיךָ
  choice: wenn ich mit dir einen Rechtsstreit führe
  rationale: ריב kann einen Streit, eine Auseinandersetzung oder das Führen einer Rechtssache bezeichnen. Die Formulierung bewahrt das rechtliche Bild und Jeremias spannungsvolle, aber ehrfürchtige Anrede.
- source_word: אַךְ מִשְׁפָּטִים אֲדַבֵּר אוֹתָךְ
  choice: Doch über Fragen des Rechts möchte ich mit dir reden
  rationale: אַךְ leitet hier den Einwand ein; מִשְׁפָּטִים bezeichnet im Plural Angelegenheiten des Rechts oder der Gerechtigkeit. „Möchte ich“ gibt den behutsam-volitiven Ton natürlich wieder.
- source_word: דֶּרֶךְ רְשָׁעִים
  choice: der Weg der Frevler
  rationale: „Weg“ bezeichnet idiomatisch Lebensführung und Lebenslauf; „Frevler“ gibt die moralische Schuld von רְשָׁעִים in würdigem, bibelnah verständlichem Deutsch wieder.
- source_word: צָלֵחָה
  choice: hat Erfolg
  rationale: Das Verb bezeichnet Gelingen oder Gedeihen. „Hat Erfolg“ ist im Deutschen natürlich und bewahrt die Klage über das sichtbare Wohlergehen der Bösen.
- source_word: שָׁלוּ
  choice: leben ungestört
  rationale: Das Verb bezeichnet Ruhe, Sorglosigkeit oder Sicherheit. „Leben ungestört“ vermeidet eine Übertragung mit dem theologisch stärker aufgeladenen Wort „Frieden“.
- source_word: בֹּגְדֵי בָגֶד
  choice: die durch und durch treulos handeln
  rationale: Die Verbindung aus Partizip und stammverwandtem Substantiv verstärkt den Gedanken der Treulosigkeit; „durch und durch“ bildet diese Intensivierung idiomatisch ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen; die Wiedergabe als „Jahwe“ bewahrt ihn als Eigennamen.
- issue: Jeremias Haltung in כִּי אָרִיב אֵלֶיךָ
  choice: rechtliche Auseinandersetzung innerhalb eines ausdrücklichen Bekenntnisses zu Gottes Gerechtigkeit
  alternative: feindseliges Streiten mit Gott
  rationale: Der Vers hält Gottes Gerechtigkeit und Jeremias offene Rechtsfrage nebeneinander. Die Übersetzung wahrt diese Spannung, ohne die Klage abzuschwächen oder als Auflehnung festzulegen.
- issue: Verhältnis von Gottes Gerechtigkeit zum anschließenden Einwand
  choice: „wenn“ mit offengehaltener zeitlich-konditionaler Beziehung
  alternative: „obwohl“ als ausdrücklich konzessive Deutung
  rationale: כִּי kann im Zusammenhang unterschiedlich nuanciert werden. Der Haupttext vermeidet es, die syntaktische und theologische Beziehung stärker festzulegen als der hebräische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem Rechtswortfeld. Die direkte Gottesrede bleibt respektvoll, ohne die Schärfe der Klage zu glätten. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
