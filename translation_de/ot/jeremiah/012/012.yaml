source:
  edition: WLC
  text: עַֽל כָּל שְׁפָיִ֣ם בַּ/מִּדְבָּ֗ר בָּ֚אוּ שֹֽׁדְדִ֔ים כִּ֣י חֶ֤רֶב לַֽ/יהוָה֙ אֹֽכְלָ֔ה מִ/קְצֵה אֶ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ אֵ֥ין שָׁל֖וֹם לְ/כָל בָּשָֽׂר־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/012.yaml
  text: Upon all the bare heights in the wilderness destroyers have come[a], for the sword of Yahweh is devouring from one end of the land to the other end of the land[c][b]; there is no peace for any flesh.
translation:
  language: de
  text: Auf alle kahlen Höhen in der Wildnis sind Verwüster gekommen[a]. Denn das Schwert Jahwes frisst sich vom einen Ende des Landes bis zum anderen Ende des Landes[b] hindurch; für alles Fleisch gibt es keinen Frieden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unbewachsenen Anhöhen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von einem Ende der Erde bis zum anderen Ende der Erde“. Das hebräische Wort אֶרֶץ kann sowohl „Land“ als auch „Erde“ bedeuten.'
    reason: alternative_reading
  - marker: c
    text: „Alles Fleisch“ ist eine hebräische Ausdrucksweise für alle Menschen oder, weiter gefasst, alle Lebewesen.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָיִם
  choice: kahle Höhen
  rationale: Die Wendung bezeichnet unbewachsene, offen daliegende Höhen. „Kahle Höhen“ bewahrt das Landschaftsbild, ohne kultische „Höhen“ anzudeuten.
- source_word: בַּמִּדְבָּר
  choice: in der Wildnis
  rationale: מִדְבָּר kann Wildnis, Steppe oder Wüste bezeichnen. „Wildnis“ lässt die genaue Landschaftsform angemessen offen.
- source_word: שֹׁדְדִים
  choice: Verwüster
  rationale: Das Partizip bezeichnet gewaltsame Plünderer und Zerstörer; „Verwüster“ erfasst hier besonders die militärische Verheerung.
- source_word: חֶרֶב לַיהוָה
  choice: das Schwert Jahwes
  rationale: Die Präposition kennzeichnet das Schwert als Jahwe zugehörig beziehungsweise von ihm geführt. Die bestimmte Form entspricht dem personifizierten Gerichtsbild.
- source_word: אֹכְלָה
  choice: verschlingt
  rationale: Die Form beschreibt das Schwert in fortdauernder, personifizierter Tätigkeit. „Verschlingt“ gibt das wörtliche Bild des Fressens in würdigem, natürlichem Deutsch wieder; „alles“ macht das im Deutschen erforderliche Objekt ausdrücklich, ohne den Umfang einzuengen.
- source_word: מִקְצֵה אֶרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: von einem Ende des Landes bis zum anderen
  rationale: אֶרֶץ meint im Zusammenhang wahrscheinlich das verwüstete Land. Die deutsche Paarform gibt die umfassende Ausdehnung der hebräischen Wiederholung natürlich wieder.
- source_word: אֵין שָׁלוֹם
  choice: es gibt keinen Frieden
  rationale: '„Frieden“ bewahrt sowohl den unmittelbaren Gegensatz zum Krieg als auch den weiteren Bedeutungsumfang von שָׁלוֹם: Sicherheit und Wohlergehen.'
- source_word: לְכָל בָּשָׂר
  choice: für alles Fleisch
  rationale: Die wörtliche Wiedergabe erhält die umfassende hebräische Redeweise für lebende Menschen beziehungsweise Lebewesen; die Fußnote erläutert das Idiom.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich den Gottesnamen. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von אֶרֶץ
  choice: Land
  alternative: Erde
  rationale: Der Zusammenhang handelt von der Verwüstung des Landes, wahrscheinlich Judas. Da אֶרֶץ jedoch auch „Erde“ bedeuten kann, bleibt diese weitere Lesart in der Fußnote sichtbar.
- issue: Reichweite von לְכָל בָּשָׂר
  choice: alles Fleisch
  alternative: alle Menschen / alle Lebewesen
  rationale: Die wörtliche Form wahrt die mögliche Breite des Ausdrucks, ohne vorschnell nur Menschen oder sämtliche Geschöpfe als Referenz festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Bildsprache. Der Satzbau folgt der poetischen Bewegung des Hebräischen, ohne unnötig altertümlich zu wirken. Die Ausdrücke „Land/Erde“ und „alles Fleisch“ werden nicht dogmatisch verengt; echte Bedeutungsbreite wird durch Fußnoten offengehalten.
