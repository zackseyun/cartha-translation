base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/008.yaml
  text: My inheritance has become to me like a lion in the forest[a]; she has lifted up her voice against me[c][b]; therefore I hate her.
translation:
  language: de
  text: Mein Erbteil ist für mich wie ein Löwe im Wald geworden. Es hat seine Stimme gegen mich erhoben[a]; darum hasse ich es.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es hat gegen mich gebrüllt.“ Wörtlich: „Sie gab gegen mich mit ihrer Stimme.“ Im Bild vom Löwen liegt ein feindseliges Brüllen nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Darum habe ich es gehasst.“ Die hebräische Verbform kann je nach Zusammenhang vergangenheitsbezogen oder mit gegenwärtiger Geltung wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָתִי
  choice: mein Erbteil
  rationale: נַחֲלָה bezeichnet Erbe, Erbteil oder zugewiesenen Besitz. „Erbteil“ bewahrt den Gedanken des Zugehörens und den bundestheologischen Klang, ohne im Deutschen unnötig abstrakt zu wirken.
- source_word: כְּאַרְיֵה
  choice: wie ein Löwe
  rationale: אַרְיֵה ist die gewöhnliche Bezeichnung für einen Löwen; כְּ kennzeichnet den Vergleich.
- source_word: בַיָּעַר
  choice: im Wald
  rationale: יַעַר bezeichnet Wald oder Waldland; „im Wald“ ist die direkte und natürliche deutsche Wiedergabe.
- source_word: נָתְנָה עָלַי בְּקוֹלָהּ
  choice: Es hat seine Stimme gegen mich erhoben
  rationale: Wörtlich steht hier sinngemäß „es gab seine Stimme gegen mich“. Die deutsche Wendung „die Stimme gegen jemanden erheben“ erhält sowohl den Stimmbezug als auch die feindselige Ausrichtung. Im Zusammenhang mit dem Löwen ist auch „brüllen“ möglich, wird aber nicht in den Haupttext eingetragen, damit die hebräische Ausdrucksweise erkennbar bleibt.
- source_word: עַל כֵּן
  choice: darum
  rationale: Die feste Folgerungsformel leitet die Konsequenz aus dem vorausgehenden feindseligen Auftreten ein.
- source_word: שְׂנֵאתִיהָ
  choice: hasse ich es
  rationale: Das Verb שׂנא bedeutet direkt „hassen“. Das deutsche Präsens gibt die aus dem vorausgehenden Geschehen resultierende Haltung natürlich wieder, ohne die Aussage zu „verwerfen“ oder „zurückweisen“ abzuschwächen.
- source_word: -הּ / -הָ (feminine Suffixe)
  choice: es
  rationale: Die femininen Formen beziehen sich auf das im Hebräischen feminine נַחֲלָה. Da „Erbteil“ im Deutschen sächlich ist, folgt das Pronomen dem deutschen grammatischen Geschlecht. Die handelnde Personifizierung bleibt durch das Erheben der Stimme erhalten.
theological_decisions:
- issue: Die in שְׂנֵאתִיהָ ausgedrückte Haltung Gottes
  choice: „darum hasse ich es“ – die scharfe Aussage wird unmittelbar beibehalten.
  alternative: „darum habe ich es verworfen“ oder „darum ist es mir verhasst geworden“
  rationale: Der Vers spricht in drastischer Gerichtssprache von Gottes Reaktion auf sein feindselig gewordenes Erbteil. Eine Abschwächung zu bloßer Zurückweisung würde die sprachliche und theologische Spannung des hebräischen Textes mindern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbteil“ hält den Erb- und Zugehörigkeitsgedanken fest; die Satzstruktur bleibt eng am Hebräischen, ohne unnatürlich zu klingen. Das sächliche Pronomen richtet sich nach dem deutschen Genus von „Erbteil“ und ist daher keine Aufhebung der hebräischen Personifizierung.
