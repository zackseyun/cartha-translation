  text: וְ/אַתָּ֤ה יְהוָה֙ יְדַעְתָּ֔/נִי תִּרְאֵ֕/נִי וּ/בָחַנְתָּ֥ לִבִּ֖/י אִתָּ֑/ךְ הַתִּקֵ/ם֙ כְּ/צֹ֣אן לְ/טִבְחָ֔ה וְ/הַקְדִּשֵׁ֖/ם לְ/י֥וֹם הֲרֵגָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/003.yaml
  text: But you[a], O Yahweh, know me; you see me, and you test my heart toward you. Pull them out like sheep for slaughter[c][b], and set them apart for the day of killing.
translation:
  language: de
  text: Du aber, Jahwe, kennst mich; du siehst mich und prüfst mein Herz in seiner Haltung zu dir.[a] Reiße sie fort wie Schafe zur Schlachtung und sondere sie aus[b] für den Tag des Gemetzels.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du prüfst mein Herz, das bei dir ist“; möglicherweise auch: „Mein Herz ist bei dir.“ Die knappe hebräische Wendung kann Jeremias innere Ausrichtung oder Treue gegenüber Jahwe ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „weihe sie“. Gemeint ist hier ein Aussondern zum Gericht, nicht zum Segen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für den Tag des Tötens“ oder „für den Tag der Schlachtung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen üblichen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: יְדַעְתָּנִי
  choice: kennst mich
  rationale: Das Perfekt bezeichnet hier eine gegenwärtig wirksame, persönliche Kenntnis; das deutsche Präsens ist natürlich und kontextgerecht.
- source_word: תִּרְאֵנִי
  choice: siehst mich
  rationale: Das Verb meint hier wahrnehmendes, durchschauendes Sehen und steht parallel zu „kennst“ und „prüfst“.
- source_word: וּבָחַנְתָּ לִבִּי אִתָּךְ
  choice: prüfst, wie mein Herz zu dir steht
  rationale: Die kompakte und syntaktisch schwierige Wendung wird verständlich als Prüfung der inneren Ausrichtung auf Jahwe wiedergegeben, ohne ihre mögliche Deutung als „mein Herz ist bei dir“ auszuschließen.
- source_word: הַתִּקֵם
  choice: Reiße sie fort
  rationale: Der Hifil von נתק bezeichnet ein gewaltsames Losreißen oder Fortziehen und bewahrt die Härte der Bitte.
- source_word: כְּצֹאן לְטִבְחָה
  choice: wie Schafe zum Schlachten
  rationale: Die Schlachtungsmetapher wird unmittelbar und in natürlichem Deutsch erhalten.
- source_word: וְהַקְדִּשֵׁם
  choice: sondere sie aus
  rationale: Der Hifil von קדש bedeutet „absondern, weihen“; im Kontext werden die Betroffenen zum Gericht bestimmt, nicht positiv geheiligt.
- source_word: לְיוֹם הֲרֵגָה
  choice: für den Tag des Tötens
  rationale: Die Formulierung gibt die ausdrückliche Tötungssprache des Hebräischen wieder und unterscheidet sie zugleich vom vorherigen טִבְחָה.
theological_decisions:
- issue: Fluchbitte gegen die Frevler
  choice: Die Bitte um gewaltsames göttliches Gericht wird direkt wiedergegeben.
  alternative: Die Aussage zu einer allgemeinen Vorbereitung auf das Gericht abschwächen oder nur bildlich verstehen.
  rationale: Der hebräische Text verwendet ausdrücklich Bilder des Schlachtens und Tötens; eine Abschwächung würde seine theologische Spannung verdecken.
- issue: Bedeutung von קדש im Gerichtskontext
  choice: „sondere sie aus“
  alternative: „heilige sie“ oder „weihe sie“
  rationale: Die Grundvorstellung des Absonderns bleibt erhalten, ohne im Deutschen fälschlich eine positive Heiligung nahezulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede, die dreigliedrige Aussage über Gottes Kenntnis Jeremias und die drastische Gerichtssprache bleiben erhalten. „Wie mein Herz zu dir steht“ dient der Verständlichkeit; die genuine Mehrdeutigkeit von אִתָּךְ wird in Fußnote [a] offengelegt.
