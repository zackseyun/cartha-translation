base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/009.yaml
  text: Is my inheritance to me a speckled bird of prey? Are the birds of prey against her all around? Go[a], gather all the beasts of the field[b]; bring them to devour.
translation:
  language: de
  text: Ist mein Erbbesitz für mich wie ein gesprenkelter Raubvogel?[a] Sind Raubvögel rings um ihn? Geht, versammelt alle Wildtiere des Feldes; bringt sie herbei, damit sie fressen!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie eine gefleckte Hyäne?“ Das hebräische Wort עַיִט bedeutet gewöhnlich „Raubvogel“ oder „Aasvogel“; einige verstehen es hier jedoch als Bezeichnung eines anderen Raubtiers, etwa einer Hyäne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעַיִט
  choice: Raubvogel
  rationale: עַיִט bezeichnet im biblischen Hebräisch gewöhnlich einen Raub- oder Aasvogel. „Raubvogel“ wahrt das Tierbild, ohne eine bestimmte Vogelart festzulegen.
- source_word: צָבוּעַ
  choice: bunt gefiedert
  rationale: Das Wort bezeichnet hier wahrscheinlich eine auffällige, verschiedenartige Färbung. In Verbindung mit einem Vogel gibt „bunt gefiedert“ das Bild natürlich und anschaulich wieder.
- source_word: נַחֲלָתִי
  choice: mein Erbbesitz
  rationale: נַחֲלָה ist ein durch Zuteilung oder Erbe erworbener Besitz. „Erbbesitz“ bewahrt sowohl den Besitzgedanken als auch die möglichen bundesgeschichtlichen Anklänge.
- source_word: לִי
  choice: für mich
  rationale: Die Dativform wird beibehalten, sodass die rhetorische Frage des Hebräischen hörbar bleibt.
- source_word: הַעַיִט סָבִיב עָלֶיהָ
  choice: die Raubvögel ringsum gegen ihn
  rationale: Der formal singularische Ausdruck kann kollektiv verstanden werden. Der Plural ist im Deutschen natürlich; „ringsum gegen ihn“ bewahrt sowohl die räumliche als auch die feindselige Bedeutung von סָבִיב עָלֶיהָ.
- source_word: לְכוּ אִסְפוּ
  choice: Geht, versammelt
  rationale: Die beiden Imperative bilden einen unmittelbaren Aufruf, die angreifenden Tiere zusammenzubringen.
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: alle wilden Tiere des Feldes
  rationale: Die Wendung bezeichnet die frei lebenden Tiere. „Wilde Tiere des Feldes“ ist verständlich und bewahrt den biblischen Bildbereich.
- source_word: הֵתָיוּ לְאָכְלָה
  choice: bringt sie her zum Fressen
  rationale: Der Imperativ mit der Zweckangabe fordert dazu auf, die Tiere zum Verzehren der Beute herbeizubringen. Die Formulierung bleibt absichtlich offen, ob „Fressen“ verbal oder als Mahl zu verstehen ist.
theological_decisions:
- issue: Bezug von „mein Erbbesitz“
  choice: Der Bezug bleibt im Text unausgesprochen.
  alternative: Ausdrückliche Identifizierung mit Juda, Jerusalem, dem Land oder dem Bundesvolk.
  rationale: נַחֲלָתִי nennt den Erbbesitz, ohne ihn in diesem Vers näher zu bestimmen. Der Kontext legt Gottes Volk beziehungsweise Land nahe, doch die Übersetzung engt die offene Formulierung nicht ein.
- issue: Numerus und Bild der umgebenden Raubvögel
  choice: Der singularische Ausdruck wird kollektiv als „die Raubvögel“ wiedergegeben.
  alternative: „der Raubvogel ringsum gegen ihn“ oder ein anderes Raubtier wie eine Hyäne.
  rationale: Die kollektive Lesart ergibt im Deutschen ein klares Bild mehrerer Fressfeinde, ohne den überlieferten Tiervergleich unnötig auf eine einzelne Kreatur zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Erbbesitz“ bewahrt den theologischen und rechtlichen Klang des hebräischen Ausdrucks; „bunt gefiedert“ macht die zoologische Bildsprache natürlich verständlich. Das grammatische Femininum des Hebräischen wird im Deutschen wegen des maskulinen Substantivs „Erbbesitz“ als „ihn“ wiedergegeben.
