- from: Ist mein Erbbesitz für mich wie ein bunt gefiederter Raubvogel?[a] Sind die Raubvögel ringsum gegen ihn? Geht, versammelt alle wilden Tiere des Feldes; bringt sie her zum Fressen!
  to: Ist mein Erbbesitz für mich wie ein gesprenkelter Raubvogel?[a] Sind Raubvögel rings um ihn? Geht, versammelt alle Wildtiere des Feldes; bringt sie herbei, damit sie fressen!
  rationale: Die Revision vermeidet eine nicht im Ausgangstext enthaltene Festlegung auf Gefieder, gibt die Umzingelung ohne überstarke explizite Gegnerpräposition wieder und formuliert den Zweck des Herbeiführens idiomatisch. Der offene Bezug von „mein Erbbesitz“ sowie die kollektiv verstandene Singularform von עַיִט bleiben erhalten.
