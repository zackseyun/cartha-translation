base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/015.yaml
  text: And it will happen[a], after I have uprooted them, that I will return and have compassion on them, and I will bring them back[c][b], each man to his inheritance and each man to his land.
translation:
  language: de
  text: 'Und nachdem ich sie ausgerissen habe[a], werde ich mich ihnen wieder zuwenden und mich über sie erbarmen[b]. Ich werde sie zurückbringen: jeden in seinen Erbbesitz und jeden in sein Land.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entwurzelt habe“. Das hebräische Verb beschreibt ein Herausreißen und ist bei Jeremia ein häufiges Bild für Gottes Gericht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihnen Erbarmen erweisen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „einen jeden in seinen Erbbesitz und einen jeden in sein Land“. Die männliche Singularform wird hier verteilend gebraucht und bezeichnet die einzelnen Angehörigen der wiederhergestellten Völker.'
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: וְהָיָה אַחֲרֵי
  choice: Und nachdem
  rationale: Die Wendung leitet einen zukünftigen Umstand ein. Im Deutschen gibt der temporale Nebensatz den Zusammenhang natürlich und vollständig wieder, ohne die schwerfällige Formulierung „Und es wird geschehen, nachdem“.
- source_word: נָתְשִׁי
  choice: ich sie ausgerissen habe
  rationale: נתש bezeichnet das Herausreißen beziehungsweise Entwurzeln und ist bei Jeremia ein prägnantes Bild für Gericht. „Ausgerissen“ bewahrt das Pflanzenbild und klingt im modernen Deutsch natürlicher als „ausgerottet“, das die Metapher abschwächen und endgültige Vernichtung nahelegen könnte.
- source_word: אָשׁוּב
  choice: werde ich mich ihnen wieder zuwenden
  rationale: Das intransitive שׁוב bezeichnet hier Gottes erneute Hinwendung zu den zuvor gerichteten Völkern. Die Wiedergabe bewahrt das „wieder“ und vermeidet das im Deutschen räumlich missverständliche „ich werde zurückkehren“.
- source_word: וְרִחַמְתִּים
  choice: und mich über sie erbarmen
  rationale: רחם drückt barmherzige, von Mitgefühl getragene Zuwendung aus. „Sich über jemanden erbarmen“ ist würdig, verständlich und semantisch nah am Hebräischen.
- source_word: וַהֲשִׁבֹתִים
  choice: Ich werde sie zurückbringen
  rationale: 'Der Hifil von שׁוב ist kausativ: Gott bewirkt ihre Rückkehr. „Zurückbringen“ erhält diese Bewegungsrichtung deutlicher als das abstraktere „wiederherstellen“.'
- source_word: אִישׁ ... וְאִישׁ
  choice: jeden ... und jeden
  rationale: Die zweimalige maskuline Singularform ist distributiv. Das substantivierte „jeden“ gibt die individuelle Zuordnung natürlich wieder, ohne im Deutschen unnötig ausschließlich erwachsene Männer als Referenten festzulegen.
- source_word: לְנַחֲלָתוֹ
  choice: in sein Erbland
  rationale: נחלה meint den ererbten beziehungsweise zugeteilten Landbesitz. „Erbland“ hält den territorialen und patrimonialen Sinn zusammen und unterscheidet ihn vom anschließenden allgemeinen „Land“.
- source_word: לְאַרְצוֹ
  choice: in sein Land
  rationale: אֶרֶץ bezeichnet hier das jeweilige Territorium oder Land. Bei einem Bewegungsverb ist „in sein Land“ im Deutschen idiomatisch.
theological_decisions:
- issue: Art der verheißenen Wiederherstellung nach dem Gericht
  choice: Nach dem Ausreißen im Gericht wendet Gott sich den Betroffenen erneut barmherzig zu und bringt sie in ihr jeweiliges Erbland und Land zurück.
  alternative: Eine ausschließlich geistliche Wiederherstellung ohne geografische Rückkehr.
  rationale: Die konkreten Begriffe נחלה und ארץ sowie das kausative Rückkehrverb verlangen im Haupttext eine territoriale Bedeutung. Zugleich wird keine weitergehende heilsgeschichtliche Deutung eingefügt.
- issue: Bezug von אָשׁוּב
  choice: Gottes erneute Hinwendung zu den Völkern.
  alternative: Gottes räumliche Rückkehr oder bloß adverbiales „wieder“ zum folgenden Verb.
  rationale: Die eigenständige Verbform lässt sich sinnvoll intransitiv verstehen. „Mich ihnen wieder zuwenden“ wahrt diese Lesart, ohne eine räumliche Bewegung Gottes zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber einer streng formalen Wiedergabe leicht geglättet; Gerichtmetapher, erneute göttliche Hinwendung, Erbarmen, kausative Rückkehr und die distributive Doppelung bleiben erkennbar.
