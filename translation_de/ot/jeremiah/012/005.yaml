id: JER.12.5
reference: Jeremiah 12:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י אֶת רַגְלִ֥ים רַ֨צְתָּה֙ וַ/יַּלְא֔וּ/ךָ וְ/אֵ֥יךְ תְּתַֽחֲרֶ֖ה אֶת הַ/סּוּסִ֑ים וּ/בְ/אֶ֤רֶץ שָׁלוֹם֙ אַתָּ֣ה בוֹטֵ֔חַ וְ/אֵ֥יךְ תַּעֲשֶׂ֖ה בִּ/גְא֥וֹן הַ/יַּרְדֵּֽן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/005.yaml
  text: If you have run with footmen and they have worn you out[a], then how will you compete with horses? And if in a land of peace you feel secure, then what will you do in the thicket of the Jordan?
translation:
  language: de
  text: Wenn du mit Fußläufern gelaufen bist und sie dich ermüdet haben, wie willst du dann mit Pferden wetteifern? Und wenn du dich in einem friedlichen Land sicher fühlst, was wirst du dann im Dickicht des Jordan[a] tun?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Stolz des Jordan“, „in der Hoheit des Jordan“ oder „beim Anschwellen des Jordan“. Die Bedeutung der hebräischen Wendung ist umstritten; sie kann den dichten Bewuchs am Jordan oder wörtlicher dessen „Stolz/Hoheit“ beziehungsweise sein Anschwellen bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַגְלִים
  choice: Fußläufer
  rationale: Wörtlich auf den Füßen Laufende beziehungsweise Männer zu Fuß; „Fußläufer“ bewahrt im Deutschen den Gegensatz zu den Pferden und die Laufmetaphorik, ohne unnötig ein militärisches Bild festzulegen.
- source_word: רַצְתָּה
  choice: du ... gelaufen bist
  rationale: Gibt das Verb „laufen“ direkt wieder und fügt sich natürlich in den deutschen Bedingungssatz ein.
- source_word: וַיַּלְאוּךָ
  choice: sie dich ermüdet haben
  rationale: Das Verb bezeichnet Ermüden oder Erschöpfen. „Ermüdet“ ist würdig und quellennah, ohne im modernen Deutsch unverständlich zu sein.
- source_word: תְּתַחֲרֶה
  choice: wirst du ... wetteifern
  rationale: Bezeichnet das Aufnehmen eines Wettstreits. „Wetteifern“ erhält den offenen Charakter des Vergleichs und passt zur Laufmetaphorik.
- source_word: הַסּוּסִים
  choice: Pferden
  rationale: Direkte Wiedergabe; der Gegensatz zu den Fußläufern steigert die rhetorische Frage.
- source_word: בְאֶרֶץ שָׁלוֹם
  choice: in einem friedlichen Land
  rationale: Gibt die sichere, ungestörte Umgebung natürlich wieder und bewahrt das konkrete Bild des Landes.
- source_word: בּוֹטֵחַ
  choice: du dich ... sicher fühlst
  rationale: בטח kann Vertrauen oder Sicherheit bezeichnen. Hier spricht der Zusammenhang eher von empfundener Sicherheit unter günstigen Umständen als ausdrücklich vom Vertrauen auf Gott.
- source_word: תַּעֲשֶׂה
  choice: was wirst du ... tun
  rationale: Direkte und idiomatische Wiedergabe des semantisch breiten Verbs עשה.
- source_word: גְּאוֹן הַיַּרְדֵּן
  choice: Dickicht des Jordan
  rationale: Die umstrittene Wendung kann auf den gefährlichen dichten Bewuchs am Jordan zielen. Die verständliche kontextuelle Wiedergabe steht im Haupttext; wörtlichere Alternativen werden in der Fußnote bewahrt.
theological_decisions:
- issue: Bedeutung von בּוֹטֵחַ im Zusammenhang
  choice: 'situative Sicherheit: „du dich ... sicher fühlst“'
  alternative: „du vertraust“ oder „du bist sicher“
  rationale: Der Vers stellt geringere Belastung und größere Gefahr gegenüber. Die Formulierung vermeidet es, ohne eindeutigen Textgrund eine Aussage über das Vertrauen auf Gott einzutragen.
- issue: Deutung von גְּאוֹן הַיַּרְדֵּן
  choice: gefährliches Dickicht am Jordan
  alternative: „Stolz/Hoheit des Jordan“ oder „Anschwellen des Jordan“
  rationale: Die hebräische Wendung bleibt umstritten. Der Haupttext nennt den wahrscheinlich gemeinten gefährlichen Uferbewuchs, während die Fußnote die echte lexikalische Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden parallelen rhetorischen Fragen und die Steigerung von Fußläufern zu Pferden sowie vom friedlichen Land zum gefährlichen Jordangebiet bleiben erhalten. Der Fußnotenmarker [a] steht unmittelbar bei der strittigen Wendung.
