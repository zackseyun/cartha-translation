id: JER.12.11
reference: Jeremiah 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שָׂמָ/הּ֙ לִ/שְׁמָמָ֔ה אָבְלָ֥ה עָלַ֖/י שְׁמֵמָ֑ה נָשַׁ֨מָּה֙ כָּל הָ/אָ֔רֶץ כִּ֛י אֵ֥ין אִ֖ישׁ שָׂ֥ם עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/011.yaml
  text: They have made it a desolation[a]; it mourns before me, desolate. The whole land is laid waste[c][b], because no one takes it to heart.
translation:
  language: de
  text: Sie haben es zur Einöde gemacht[a]; verwüstet trauert es vor mir. Das ganze Land[b] liegt öde da, denn niemand nimmt es sich zu Herzen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der hebräischen Singularform: „Er hat es zur Einöde gemacht.“ Im Zusammenhang können die zuvor genannten Verwüster als Subjekt gemeint sein.'
    reason: alternative_reading
  - marker: b
    text: „Land“ kann auch mit „Erde“ wiedergegeben werden; hier ist wahrscheinlich das verwüstete Land Juda gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂמָהּ
  choice: Sie haben es ... gemacht
  rationale: Die Verbform ist formal 3. Person Singular maskulin mit femininem Objektssuffix („er hat sie/es gemacht“). Der Plural nimmt als wahrscheinliches kontextuelles Subjekt die Verwüster aus dem vorherigen Vers auf; die formale Mehrdeutigkeit wird in Fußnote [a] bewahrt.
- source_word: לִשְׁמָמָה
  choice: zur Einöde
  rationale: Bewahrt den nominalen Charakter von שְׁמָמָה und den gehobenen prophetischen Ton, ohne die Verwüstung bloß als Vorgang zu paraphrasieren.
- source_word: אָבְלָה
  choice: trauert es
  rationale: Gibt das personifizierende Verb אבל unmittelbar wieder. Das deutsche Neutrum bezieht sich natürlich auf das zuvor vorausgesetzte Erbteil beziehungsweise Land.
- source_word: עָלַי
  choice: vor mir
  rationale: Im Zusammenhang göttlicher Rede bezeichnet die Wendung das Trauern in Gottes Gegenwart beziehungsweise vor seinen Augen; „vor mir“ ist im Deutschen natürlich und wahrt diese Perspektive.
- source_word: שְׁמֵמָה
  choice: verwüstet
  rationale: Das vorangestellte Prädikativ erhält die knappe Verbindung von Trauer und Verwüstung und vermeidet eine schwerfällige Wiederholung von „öde“ unmittelbar im selben Satz.
- source_word: נָשַׁמָּה
  choice: liegt öde da
  rationale: Gibt den resultativen Zustand idiomatisch und anschaulich wieder, ohne einen im Hebräischen nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: כָּל הָאָרֶץ
  choice: das ganze Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten. Der unmittelbare Zusammenhang handelt von der Verwüstung Judas, weshalb „Land“ sachlich näher liegt.
- source_word: כִּי אֵין אִישׁ
  choice: denn niemand
  rationale: אִישׁ ist hier generisch. „Niemand“ gibt die umfassende Verneinung im heutigen Standarddeutsch natürlich und genau wieder, ohne den Sinn auf männliche Personen einzuengen.
- source_word: שָׂם עַל לֵב
  choice: nimmt es sich zu Herzen
  rationale: 'Die deutsche Herzenswendung entspricht dem hebräischen Idiom und bewahrt zugleich dessen Bildsprache: etwas ernst nehmen und innerlich bedenken.'
theological_decisions:
- issue: Subjekt von שָׂמָהּ
  choice: „Sie haben“ mit Fußnote zur singularischen Form
  alternative: „Er hat“
  rationale: Die Zerstörer aus dem unmittelbaren Kontext sind das wahrscheinlichste sinngemäße Subjekt. Da die hebräische Verbform jedoch singularisch ist, darf diese Spannung nicht stillschweigend beseitigt werden.
- issue: Referenz von אֶרֶץ
  choice: Land
  alternative: Erde
  rationale: Der Nahkontext betrifft das verwüstete Erbteil und Land Juda. „Land“ vermeidet eine unbegründete Ausweitung auf die gesamte Erde, während Fußnote [b] die lexikalische Möglichkeit offenhält.
- issue: Generischer Ausdruck אֵין אִישׁ
  choice: niemand
  alternative: kein Mensch / kein Mann
  rationale: Im Satz bezeichnet die maskuline Singularform keine bestimmte männliche Person, sondern das völlige Fehlen eines Menschen, der die Verwüstung ernst nimmt. „Niemand“ wahrt diesen generischen Umfang im modernen Deutschen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Prägnanz. Die Personifikation des Landes und die Herzensmetapher bleiben erhalten. Die zweimalige Verwüstungssemantik des Hebräischen wird durch „Einöde“, „verwüstet“ und „öde“ variiert, ohne die eindringliche Wiederholung aufzulösen.
