source:
  edition: WLC
  text: נְטַעְתָּ/ם֙ גַּם שֹׁרָ֔שׁוּ יֵלְכ֖וּ גַּם עָ֣שׂוּ פֶ֑רִי קָר֤וֹב אַתָּה֙ בְּ/פִי/הֶ֔ם וְ/רָח֖וֹק מִ/כִּלְיוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/002.yaml
  text: You planted them; they have even taken root. They grow; they even produce fruit. You are near in their mouth[a], but far from their innermost being.
translation:
  language: de
  text: Du hast sie gepflanzt, und sie haben sogar Wurzeln geschlagen. Sie wachsen und tragen sogar Frucht. Du bist ihnen im Mund nahe, ihrem Innersten aber fern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „fern von ihren Nieren“. Die Nieren stehen im Hebräischen bildlich für das verborgene Innere eines Menschen, besonders für seine innersten Regungen und Beweggründe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַעְתָּם
  choice: Du hast sie gepflanzt
  rationale: Das Qal-Perfekt in der 2. Person Singular mit Suffix der 3. Person Plural spricht Gott unmittelbar an und bezeichnet sein Handeln.
- source_word: גַּם שֹׁרָשׁוּ
  choice: und sie haben sogar Wurzeln geschlagen
  rationale: שׁרשׁ bezeichnet das Wurzelschlagen; „Wurzeln schlagen“ bewahrt das Pflanzenbild, während „sogar“ die Hervorhebung durch גַּם wiedergibt.
- source_word: יֵלְכוּ
  choice: Sie wachsen
  rationale: הלך bedeutet grundsätzlich „gehen“; in der Abfolge von Pflanzen, Wurzelschlagen und Fruchtbringen bezeichnet es hier das weitere Vorankommen beziehungsweise Gedeihen. „Sie wachsen“ gibt diesen kontextuellen Sinn wieder, ohne ausdrücklich Wohlstand einzutragen.
- source_word: גַּם עָשׂוּ פֶרִי
  choice: und tragen sogar Frucht
  rationale: עשה mit פֶרִי bedeutet idiomatisch „Frucht hervorbringen/tragen“; „sogar“ bildet das zweite גַּם ab.
- source_word: קָרוֹב אַתָּה בְּפִיהֶם
  choice: Du bist in ihrem Mund nahe
  rationale: Die bewusst körperhafte Formulierung bewahrt das Bild des hebräischen Textes und den Gegensatz zwischen äußerem Reden und innerer Wirklichkeit.
- source_word: רָחוֹק מִכִּלְיוֹתֵיהֶם
  choice: doch ihrem Innersten fern
  rationale: כִּלְיוֹת bedeutet wörtlich „Nieren“, bezeichnet in der hebräischen Anthropologie aber den verborgenen inneren Menschen, einschließlich seiner Regungen und Beweggründe.
theological_decisions:
- issue: Anthropologische Metapher כִּלְיוֹתֵיהֶם
  choice: ihrem Innersten
  alternative: ihren Nieren / ihrem tiefsten Inneren
  rationale: Der Vers stellt das Reden über Gott der inneren Wirklichkeit gegenüber. Die idiomatische Wiedergabe vermittelt diese Aussage verständlich; die anatomische Ausgangsmetapher bleibt in der Fußnote transparent.
- issue: Deutung von יֵלְכוּ im landwirtschaftlichen Bild
  choice: Sie wachsen
  alternative: Sie kommen voran / sie gedeihen
  rationale: Der Kontext legt Wachstum beziehungsweise Gedeihen nahe. „Wachsen“ hält das Pflanzenbild zusammen, ohne das Verb ausdrücklich als materiellen Erfolg auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem poetischem Ton. Die Wiederholung von „sogar“ bildet beide Vorkommen von גַּם ab; das landwirtschaftliche Bild bleibt durchgehend erhalten.
