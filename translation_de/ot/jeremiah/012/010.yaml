source:
  edition: WLC
  text: רֹעִ֤ים רַבִּים֙ שִֽׁחֲת֣וּ כַרְמִ֔/י בֹּסְס֖וּ אֶת חֶלְקָתִ֑/י נָֽתְנ֛וּ אֶת חֶלְקַ֥ת חֶמְדָּתִ֖/י לְ/מִדְבַּ֥ר שְׁמָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/010.yaml
  text: Many shepherds have ruined my vineyard[a]; they have trampled my portion[b]; they have made my pleasant portion a desolate wilderness.
translation:
  language: de
  text: Viele Hirten[a] haben meinen Weinberg verwüstet; sie haben mein Landstück[b] zertreten; mein kostbares Landstück haben sie zu einer öden Wüste gemacht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Viele Herrscher“ oder „Viele Anführer“. Das hebräische Wort bedeutet wörtlich „Hirten“ und wird bei den Propheten häufig bildlich für Regierende oder andere Verantwortliche gebraucht.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „meinen Anteil“ beziehungsweise „mein Grundstück“. Das hebräische Wort bezeichnet ein Stück oder einen Anteil Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים רַבִּים
  choice: Viele Hirten
  rationale: Die wörtliche Hirtenmetapher bleibt erhalten; im prophetischen Sprachgebrauch kann sie zugleich Herrscher oder andere Verantwortliche bezeichnen.
- source_word: שִׁחֲתוּ
  choice: haben … verwüstet
  rationale: Das Verb bezeichnet Verderben oder Zerstören. „Verwüstet“ passt zum Weinberg- und Landbild, ohne vollständige Vernichtung zwingend vorauszusetzen.
- source_word: כַרְמִי
  choice: meinen Weinberg
  rationale: Direkte Wiedergabe des konkreten und zugleich metaphorisch deutbaren Bildes.
- source_word: בֹּסְסוּ
  choice: haben … zertreten
  rationale: Bewahrt das körperliche Bild des Niedertretens.
- source_word: חֶלְקָתִי
  choice: mein Landstück
  rationale: חלקה bezeichnet hier ein abgegrenztes Stück oder einen Anteil Land. „Landstück“ ist im Deutschen konkret und erhält den landwirtschaftlichen Zusammenhang.
- source_word: נָתְנוּ
  choice: haben … gemacht
  rationale: נתן mit לְ bezeichnet hier resultativ das Versetzen in einen Zustand; die deutsche Konstruktion „zu … gemacht“ gibt dies natürlich wieder.
- source_word: חֶלְקַת חֶמְדָּתִי
  choice: mein kostbares Landstück
  rationale: „Kostbar“ gibt den Wert- und Zuneigungsgehalt von חמדה wieder; die Wiederholung von „Landstück“ bildet die Wiederaufnahme von חלקה ab.
- source_word: לְמִדְבַּר שְׁמָמָה
  choice: zu einer öden Wüste
  rationale: Gibt sowohl מִדְבָּר („Wüste, Wildnis“) als auch שְׁמָמָה („Öde, Verwüstung“) knapp und idiomatisch wieder.
theological_decisions:
- issue: Deutung der „Hirten“ als politische oder geistliche Führer
  choice: Die Hirtenmetapher bleibt im Haupttext stehen.
  alternative: Herrscher; Anführer; Verantwortliche
  rationale: Der hebräische Text benennt die Verantwortlichen bildhaft. Eine erklärende Übersetzung würde die mögliche Bezugsspanne unnötig verengen.
- issue: Auflösung der Landbilder als ausdrücklicher Verweis auf Juda oder Israel
  choice: „Weinberg“ und „Landstück“ werden als konkrete, metaphorisch offene Bilder bewahrt.
  alternative: mein Land; mein Erbbesitz; Juda
  rationale: Die Bildsprache verbindet Land, Besitz und Gottes Zuneigung, ohne den Bezug in diesem Vers ausdrücklich auf nur eine Erklärung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Satzglieder und die Wiederholung von „Landstück“ bewahren die hebräische Bildführung; das vorangestellte „mein kostbares Landstück“ im letzten Glied setzt einen natürlichen poetischen Akzent.
