source:
  edition: WLC
  text: זָרְע֤וּ חִטִּים֙ וְ/קֹצִ֣ים קָצָ֔רוּ נֶחְל֖וּ לֹ֣א יוֹעִ֑לוּ וּ/בֹ֨שׁוּ֙ מִ/תְּבוּאֹ֣תֵי/כֶ֔ם מֵ/חֲר֖וֹן אַף יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/013.yaml
  text: They have sown wheat[a], but they have reaped thorns; they have exhausted themselves, but they profit nothing. Be ashamed of your produce because of the burning anger of Yahweh.
translation:
  language: de
  text: Sie haben Weizen gesät, doch Dornen geerntet; sie haben sich erschöpft, aber nichts gewonnen. Schämt euch[a] eurer Ernten aufgrund des glühenden Zorns Jahwes!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr werdet euch eurer Ernten schämen.“ Dabei wird וּבֹשׁוּ nicht als Aufforderung, sondern als Vorhersage verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרְעוּ חִטִּים
  choice: Sie haben Weizen gesät
  rationale: Das Qal Perfekt bezeichnet die vollzogene Aussaat; „Weizen“ gibt חִטִּים konkret wieder. Das deutsche Perfekt verbindet die abgeschlossene Handlung natürlich mit ihren gegenwärtigen Folgen.
- source_word: וְקֹצִים קָצָרוּ
  choice: doch Dornen geerntet
  rationale: קֹצִים bedeutet „Dornen“. „Doch“ macht den im Parallelismus liegenden Gegensatz deutlich; „geerntet“ ist im heutigen Deutsch natürlicher als „geschnitten“ und erhält das landwirtschaftliche Bild.
- source_word: נֶחְלוּ
  choice: sie haben sich erschöpft
  rationale: Die Form wird hier im Sinn des Schwach- oder Erschöpftwerdens durch vergebliche Arbeit verstanden. Diese Deutung passt besser zum Kontext als eine Ableitung im Sinn von „erben“.
- source_word: לֹא יוֹעִלוּ
  choice: aber nichts gewonnen
  rationale: Das Hifil von יעל bezeichnet Nutzen oder Gewinn. Die Formulierung gibt die Erfolglosigkeit knapp und idiomatisch wieder.
- source_word: וּבֹשׁוּ
  choice: Schämt euch
  rationale: Die Form wird als Imperativ der 2. Person Plural verstanden und entspricht dem Suffix der 2. Person Plural in „euren Ernten“. Die mögliche prädiktive Lesart bleibt in der Fußnote erhalten.
- source_word: מִתְּבוּאֹתֵיכֶם
  choice: wegen eurer Ernten
  rationale: תְּבוּאָה bezeichnet Ertrag, Ernte oder Ernteertrag. Der Plural „Ernten“ wahrt die Form des Hebräischen und passt zum vorausgehenden Bild.
- source_word: מֵחֲרוֹן אַף
  choice: wegen des glühenden Zorns
  rationale: Die feste Verbindung bezeichnet heftigen, bildlich brennenden Zorn. „Glühender Zorn“ bewahrt die Metaphorik in natürlichem Deutsch.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname „Jahwe“ und nicht durch einen Titel wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname wahrt diesen Unterschied gegenüber einem bloßen Herrschaftstitel.
- issue: Deutung von וּבֹשׁוּ
  choice: 'Imperativ: „Schämt euch“'
  alternative: 'Prädikativ: „Und ihr werdet euch … schämen“'
  rationale: Der Imperativ schafft einen prophetischen Wechsel von der Beschreibung zur direkten Anrede und passt zum nachfolgenden Suffix der 2. Person Plural. Da die Form auch prädiktiv verstanden werden kann, wird diese echte grammatische Mehrdeutigkeit nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klar erkennbarem landwirtschaftlichem Gegensatz. Der Wechsel zur direkten Anrede wird beibehalten; die Zeichensetzung unterstützt den prophetischen Nachdruck.
