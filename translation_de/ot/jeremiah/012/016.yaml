revisions:
- from: 'Und wenn sie wirklich die Wege meines Volkes lernen, sodass sie bei meinem Namen schwören: »So wahr Yahweh lebt!«, wie sie einst mein Volk lehrten, beim Baal zu schwören, dann werden sie inmitten meines Volkes aufgebaut werden.[a]'
  to: 'Und es wird geschehen: Wenn sie die Wege meines Volkes wirklich lernen – bei meinem Namen zu schwören: »So wahr Yahweh lebt!« –, so wie sie mein Volk gelehrt haben, beim Baal zu schwören, dann werden sie inmitten meines Volkes aufgebaut.[a]'
  rationale: Die Revision ergänzt die hebräische Einleitungsformel, gibt den verstärkenden Infinitivus absolutus mit „wirklich“ wieder und kennzeichnet das Schwören bei Yahwehs Namen als den zu erlernenden Brauch. Sie entfernt die durch „sodass“ erzeugte Bedeutungsverschiebung und glättet das deutsche Passiv, ohne die Metapher von נִבְנוּ oder ihre Auslegungsbreite aufzulösen.
