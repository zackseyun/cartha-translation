id: JER.12.16
reference: Jeremiah 12:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לָמֹ֣ד יִלְמְדוּ֩ אֶת דַּֽרְכֵ֨י עַמִּ֜/י לְ/הִשָּׁבֵ֤עַ בִּ/שְׁמִ/י֙ חַי יְהוָ֔ה כַּ/אֲשֶׁ֤ר לִמְּדוּ֙ אֶת עַמִּ֔/י לְ/הִשָּׁבֵ֖עַ בַּ/בָּ֑עַל וְ/נִבְנ֖וּ בְּ/ת֥וֹךְ עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/016.yaml
  text: And it will happen that if they indeed learn the ways of my people[a], to swear by my name, ‘As Yahweh lives,’ just as they taught my people to swear by Baal[c][b], then they will be built up in the midst of my people.
translation:
  language: de
  text: 'Und es wird geschehen: Wenn sie die Wege meines Volkes wirklich lernen – bei meinem Namen zu schwören: »So wahr Yahweh lebt!« –, so wie sie mein Volk gelehrt haben, beim Baal zu schwören, dann werden sie inmitten meines Volkes aufgebaut.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dann werden sie unter meinem Volk festen Bestand haben«. Wörtlich: »dann werden sie inmitten meines Volkes gebaut werden«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Und wenn … dann
  rationale: Die hebräische Zukunfts- und Bedingungskonstruktion wird im Deutschen natürlich als Wenn-dann-Satz wiedergegeben.
- source_word: לָמֹד יִלְמְדוּ
  choice: wirklich … lernen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage; »wirklich« gibt den Nachdruck wieder, ohne zusätzlich Fleiß oder Vollständigkeit einzutragen.
- source_word: דַּרְכֵי עַמִּי
  choice: die Wege meines Volkes
  rationale: Die direkte Wiedergabe bewahrt die umfassende Bedeutung von Lebensweise, Verhalten und Gottesverehrung.
- source_word: לְהִשָּׁבֵעַ בִּשְׁמִי
  choice: bei meinem Namen schwören
  rationale: Dies entspricht der deutschen Ausdrucksweise für einen Schwur unter Berufung auf einen Namen.
- source_word: חַי יְהוָה
  choice: So wahr Yahweh lebt!
  rationale: Die Formulierung gibt die feststehende hebräische Schwurformel idiomatisch und mit ihrer performativen Kraft wieder.
- source_word: כַּאֲשֶׁר לִמְּדוּ אֶת עַמִּי
  choice: wie sie einst mein Volk lehrten
  rationale: »Wie« bewahrt den Vergleich; »einst« macht den im Kontext vorausliegenden verderblichen Einfluss natürlich kenntlich, ohne den Sinn zu verändern.
- source_word: לְהִשָּׁבֵעַ בַּבָּעַל
  choice: beim Baal zu schwören
  rationale: Die Präposition und der bestimmte Artikel werden parallel zum Schwur bei Yahwehs Namen wiedergegeben; »der Baal« entspricht der markierten hebräischen Form.
- source_word: וְנִבְנוּ בְּתוֹךְ עַמִּי
  choice: dann werden sie inmitten meines Volkes aufgebaut werden
  rationale: Die Wiedergabe erhält das passive Bild des Bauens und lässt offen, ob vor allem Eingliederung, Wiederherstellung oder Festigung gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR / Jehova
  rationale: Der Eigenname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von וְנִבְנוּ בְּתוֹךְ עַמִּי
  choice: inmitten meines Volkes aufgebaut werden
  alternative: unter meinem Volk festen Bestand haben / in mein Volk eingegliedert werden
  rationale: Die wörtliche Baumetapher bewahrt die theologische Offenheit zwischen Aufbau, Festigung und Aufnahme in Gottes Volk.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist gegenüber dem Hebräischen leicht geglättet, die Vergleichsstruktur, die Schwurformel, der Gottesname und die abschließende Baumetapher bleiben jedoch sichtbar.
