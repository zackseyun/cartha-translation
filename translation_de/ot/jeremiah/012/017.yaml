id: JER.12.17
reference: Jeremiah 12:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אִ֖ם לֹ֣א יִשְׁמָ֑עוּ וְ/נָ֨תַשְׁתִּ֜י אֶת הַ/גּ֥וֹי הַ/ה֛וּא נָת֥וֹשׁ וְ/אַבֵּ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/017.yaml
  text: But if they do not listen[a], then I will uproot that nation, uprooting and destroying it, declares Yahweh.
translation:
  language: de
  text: Wenn sie aber nicht hören[a], werde ich jenes Volk vollständig ausreißen und vernichten – spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gehorchen“. Das hebräische Verb kann je nach Zusammenhang sowohl „hören“ als auch „gehorchen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Wenn … aber
  rationale: Die nachgestellte Partikel „aber“ gibt den bedingenden Gegensatz zum vorhergehenden Vers in natürlichem Deutsch wieder.
- source_word: לֹא יִשְׁמָעוּ
  choice: sie nicht hören
  rationale: שׁמע kann sowohl das Hören als auch das daraus folgende Gehorchen bezeichnen. „Hören“ bewahrt die Bild- und Bedeutungsnähe zum Hebräischen; die Gehorsamsnuance wird in einer Fußnote genannt.
- source_word: וְנָתַשְׁתִּי … נָתוֹשׁ
  choice: werde ich … vollständig ausreißen
  rationale: Das Verb נתשׁ bezeichnet das Herausreißen beziehungsweise Entwurzeln; der absolute Infinitiv verstärkt die finite Verbform. „Vollständig“ gibt diese emphatische Konstruktion idiomatisch wieder.
- source_word: הַגּוֹי הַהוּא
  choice: jenes Volk
  rationale: גּוֹי bezeichnet hier eines der umliegenden Völker als kollektive politische Größe. „Jenes Volk“ ist im Deutschen natürlich und wahrt den bestimmten Rückverweis.
- source_word: וְאַבֵּד
  choice: und vernichten
  rationale: Die Piel-Form von אבד bedeutet hier, etwas zugrunde zu richten beziehungsweise zu vernichten. Das Wort gibt die Schärfe des angekündigten Gerichts wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht Jahwe“ ist eine würdevolle und im deutschen Bibelstil verständliche Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsumfang von שׁמע
  choice: hören mit möglicher Gehorsamsnuance
  alternative: gehorchen
  rationale: Im Kontext geht es um eine Reaktion auf Jahwes Weisung. Da das hebräische Verb sowohl „hören“ als auch „gehorchen“ umfassen kann, bleibt „hören“ im Text stehen, während die Alternative in der Fußnote ausdrücklich erhalten wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konditionale Formulierung ist flüssig, die prophetische Schlussformel bewusst knapp. Die emphatische hebräische Wiederholung derselben Wurzel wird nicht unnatürlich nachgebildet, sondern durch „vollständig“ wiedergegeben.
