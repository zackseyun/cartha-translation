source:
  edition: WLC
  text: עַד מָתַי֙ תֶּאֱבַ֣ל הָ/אָ֔רֶץ וְ/עֵ֥שֶׂב כָּל הַ/שָּׂדֶ֖ה יִיבָ֑שׁ מֵ/רָעַ֣ת יֹֽשְׁבֵי בָ֗/הּ סָפְתָ֤ה בְהֵמוֹת֙ וָ/ע֔וֹף כִּ֣י אָמְר֔וּ לֹ֥א יִרְאֶ֖ה אֶת אַחֲרִיתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/004.yaml
  text: How long will the land mourn, and the grass of every field dry up? Because of the evil of those who dwell in it, beasts and birds are swept away, for they say, “He will not see our end.”
translation:
  language: de
  text: 'Wie lange noch soll das Land trauern und das Gras auf allen Feldern verdorren? Wegen der Bosheit seiner Bewohner werden Tiere und Vögel dahingerafft. Denn sie sagen: »Er wird unser Ende nicht sehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: trauern
  rationale: Das Verb bezeichnet Trauer und wird hier bildhaft auf das Land bezogen; die Personifikation des hebräischen Textes bleibt erhalten.
- source_word: וְעֵשֶׂב כָּל הַשָּׂדֶה
  choice: und das Gras auf allen Feldern
  rationale: Natürliches modernes Deutsch für die distributive Wendung; der umfassende Sinn von כָּל bleibt gewahrt.
- source_word: סָפְתָה
  choice: werden … dahingerafft
  rationale: Die Form beschreibt Vernichtung beziehungsweise Wegraffen. Das deutsche Passiv gibt den Vorgang treffend wieder, ohne einen im Satz nicht genannten Täter einzusetzen.
- source_word: אַחֲרִיתֵנוּ
  choice: unser Ende
  rationale: אַחֲרִית kann Ende, Ausgang oder Zukunft bezeichnen. Im Kontext ist »unser Ende« knapp und bewahrt die mögliche Aussage, Gott werde ihren letztlichen Ausgang nicht wahrnehmen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von »Er wird … nicht sehen«
  choice: Das Pronomen »Er« bleibt ohne erklärenden Zusatz stehen.
  alternative: »Gott wird unser Ende nicht sehen.«
  rationale: Der hebräische Text nennt das Bezugswort nicht ausdrücklich. Der Kontext legt Gott nahe, doch die Übersetzung sollte diese Explizierung nicht in den Haupttext eintragen.
- issue: Bedeutung von אַחֲרִיתֵנוּ
  choice: »unser Ende«
  alternative: »unsere Zukunft« oder »was aus uns wird«
  rationale: »Ende« bewahrt die Härte und Mehrdeutigkeit der Aussage, ohne sie auf Zukunft, Schicksal oder Gericht festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Personifikation des Landes und der kausale Aufbau bleiben erhalten; unnötige Archaismen und interpretierende Ergänzungen werden vermieden.
