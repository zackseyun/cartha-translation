  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עַל כָּל שְׁכֵנַ/י֙ הָֽ/רָעִ֔ים הַ/נֹּֽגְעִים֙ בַּֽ/נַּחֲלָ֔ה אֲשֶׁר הִנְחַ֥לְתִּי אֶת עַמִּ֖/י אֶת יִשְׂרָאֵ֑ל הִנְ/נִ֤י נֹֽתְשָׁ/ם֙ מֵ/עַ֣ל אַדְמָתָ֔/ם וְ/אֶת בֵּ֥ית יְהוּדָ֖ה אֶתּ֥וֹשׁ מִ/תּוֹכָֽ/ם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/014.yaml
  text: 'Thus says Yahweh concerning all my wicked neighbors who touch the inheritance that I caused my people Israel to inherit: behold[a], I am about to uproot them from upon their land[b], and I will uproot the house of Judah from among them.'
translation:
  language: de
  text: 'So spricht Jahwe über all meine bösen Nachbarn, die das Erbteil antasten[a], das ich meinem Volk Israel zum Erbe gegeben habe: Siehe, ich werde sie nun aus ihrem Land ausreißen[b], und das Haus Juda werde ich aus ihrer Mitte ausreißen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die in das Erbteil eindringen“. Das hebräische Verb bedeutet wörtlich „berühren“; im Zusammenhang ist ein feindlicher Übergriff gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Verb bezeichnet das Ausreißen oder Entwurzeln und ist bei Jeremia ein wiederkehrendes Bild für Gottes Gericht.
    reason: literary_image
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Prophetenformel gibt die hebräische Botenformel knapp und würdig wieder; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: שְׁכֵנַי הָרָעִים
  choice: meine bösen Nachbarn
  rationale: Der Suffix der ersten Person bleibt erhalten. „Böse“ bezeichnet hier die feindselige und moralisch verwerfliche Haltung der benachbarten Völker, ohne „Völker“ ausdrücklich in den Text einzufügen.
- source_word: הַנֹּגְעִים בַּנַּחֲלָה
  choice: die das Erbteil antasten
  rationale: „Antasten“ bewahrt das Bild des Berührens, lässt im Deutschen aber zugleich den aus dem Zusammenhang hervorgehenden feindlichen Übergriff erkennen. „Erbteil“ erhält den territorialen und bundestheologischen Klang von נַחֲלָה.
- source_word: אֲשֶׁר הִנְחַלְתִּי אֶת עַמִּי אֶת יִשְׂרָאֵל
  choice: das ich meinem Volk Israel zum Erbe gegeben habe
  rationale: Die causative Form von נחל wird natürlich wiedergegeben; zugleich bleibt die Wortverbindung zwischen „Erbteil“ und „zum Erbe gegeben“ hörbar.
- source_word: הִנְנִי נֹתְשָׁם
  choice: Siehe, ich werde sie nun ... ausreißen
  rationale: „Siehe“ erhält die emphatische Ankündigung. „Werde ... nun“ gibt die bevorstehende göttliche Handlung der Konstruktion הִנְנִי mit Partizip wieder.
- source_word: מֵעַל אַדְמָתָם
  choice: aus ihrem Land
  rationale: Die idiomatische deutsche Formulierung bezeichnet ihre eigene Erde beziehungsweise ihr Land und passt zum Bild des Ausreißens.
- source_word: וְאֶת בֵּית יְהוּדָה אֶתּוֹשׁ מִתּוֹכָם
  choice: und das Haus Juda werde ich aus ihrer Mitte ausreißen
  rationale: „Haus Juda“ bewahrt die kollektive nationale Bezeichnung; die Wiederholung von „ausreißen“ spiegelt bewusst dasselbe hebräische Verb נתש.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der persönliche Gottesname steht im hebräischen Text ausdrücklich; „Jahwe“ gibt ihn als Namen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Zeitlicher Aussagewert von הִנְנִי mit dem Partizip נֹתְשָׁם
  choice: ich werde sie nun ausreißen
  alternative: ich reiße sie aus / ich bin dabei, sie auszureißen
  rationale: Die Formulierung kennzeichnet eine nachdrücklich angekündigte, unmittelbar bevorstehende Handlung. „Werde ... nun“ bewahrt sowohl Zukunftsbezug als auch Unmittelbarkeit, ohne den Vollzug bereits als begonnen festzulegen.
- issue: Bezug des Gerichts auf die Nachbarvölker und Juda
  choice: Dasselbe Bild des Ausreißens wird für beide bewahrt
  alternative: Für Juda könnte neutraler von einem Herausführen gesprochen werden
  rationale: Der hebräische Text verwendet in beiden Aussagen dasselbe Verb נתש. Die Übersetzung lässt deshalb die Spannung bestehen, dass sowohl die feindlichen Nachbarn als auch Juda „ausgerissen“ werden, auch wenn Ziel und weiterer Verlauf nicht in diesem Vers erläutert werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener prophetischer Formel und dem wiederholten Bild des Ausreißens. „Erbteil“ ist leicht gehoben, aber allgemein verständlich und trägt die Land- und Bundesbedeutung des hebräischen Ausdrucks.
