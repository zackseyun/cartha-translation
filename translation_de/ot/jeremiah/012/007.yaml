id: JER.12.7
reference: Jeremiah 12:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: עָזַ֨בְתִּי֙ אֶת בֵּיתִ֔/י נָטַ֖שְׁתִּי אֶת נַחֲלָתִ֑/י נָתַ֛תִּי אֶת יְדִד֥וּת נַפְשִׁ֖/י בְּ/כַ֥ף אֹיְבֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/007.yaml
  text: I have forsaken my house[a]; I have abandoned my inheritance[c][b]; I have given the beloved of my soul into the hand of her enemies.
translation:
  language: de
  text: 'Ich habe mein Haus verlassen[a],

    meine Erbschaft aufgegeben;

    die Geliebte meiner Seele[b]

    habe ich in die Hand ihrer[c] Feinde gegeben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mein Haus“ kann im Zusammenhang an den Tempel oder an Gottes Hausgemeinschaft denken lassen; der hebräische Ausdruck legt dies hier nicht ausdrücklich fest.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich nahe am Hebräischen. Gemeint ist in inniger Sprache „die, die meine Seele liebt“ oder „meine innig Geliebte“.
    reason: lexical_alternative
  - marker: c
    text: '„In die Hand“ bedeutet hier: in die Gewalt oder unter die Kontrolle. Das hebräische „ihrer“ ist feminin; sein genauer Bezug bleibt offen und kann auf die Erbschaft, auf Juda beziehungsweise Jerusalem als weiblich personifizierte Größe oder auf die Geliebte weisen.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָזַבְתִּי
  choice: ich habe … verlassen
  rationale: Das Qal-Perfekt 1. Person Singular bezeichnet die aus Sicht des Sprechers vollzogene Handlung. „Verlassen“ ist im Deutschen würdevoll und natürlich und lässt den ernsten Beiklang des Aufgebens bestehen.
- source_word: בֵּיתִי
  choice: mein Haus
  rationale: בַּיִת bedeutet zunächst „Haus“. Mögliche Bezüge auf Tempel oder Hausgemeinschaft werden nicht in den Haupttext eingetragen, da der hebräische Ausdruck selbst unspezifisch bleibt.
- source_word: נָטַשְׁתִּי
  choice: ich habe … aufgegeben
  rationale: נָטַשׁ bezeichnet das Verlassen oder Aufgeben. Die Wiedergabe unterscheidet das Verb von עָזַבְתִּי und bewahrt zugleich den parallelen Satzbau.
- source_word: נַחֲלָתִי
  choice: meine Erbschaft
  rationale: נַחֲלָה bezeichnet Erbbesitz beziehungsweise das als Erbe Zugewiesene und kann im Bundeskontext Land und Volk umfassen. Das feminine „Erbschaft“ ermöglicht zudem, die grammatische Offenheit des späteren femininen Pronomens teilweise zu bewahren.
- source_word: נָתַתִּי
  choice: habe ich … gegeben
  rationale: נָתַן ist das gewöhnliche Verb für „geben“. Der folgende Ausdruck macht deutlich, dass es sich hier um eine Übergabe in feindliche Gewalt handelt.
- source_word: יְדִדוּת נַפְשִׁי
  choice: die Geliebte meiner Seele
  rationale: Die hebräische Fügung ist ein inniger Ausdruck der Zuneigung. Die formnahe Wendung bewahrt sowohl ihre emotionale Stärke als auch ihren poetischen Charakter.
- source_word: בְּכַף
  choice: in die Hand
  rationale: כַּף bedeutet wörtlich „Handfläche“, bezeichnet in dieser Wendung aber die Gewalt oder Verfügungsgewalt eines anderen. „In die Hand“ bewahrt Bild und Idiom.
- source_word: אֹיְבֶיהָ
  choice: ihrer Feinde
  rationale: Das Suffix steht in der 3. Person Singular feminin. „Ihrer“ gibt diese Form wieder, ohne den im Hebräischen nicht eindeutig benannten Bezug ausdrücklich festzulegen.
theological_decisions:
- issue: Bezug des femininen Suffixes in אֹיְבֶיהָ
  choice: Die feminine Form „ihrer Feinde“ wird beibehalten, ohne ihren Bezug im Haupttext weiter festzulegen.
  alternative: „in die Gewalt der Feinde Judas/Jerusalems“ oder eine eindeutige Zuordnung zu „der Geliebten“
  rationale: Das Hebräische lässt offen, ob die Erbschaft, Juda beziehungsweise Jerusalem in personifizierter Gestalt oder die Geliebte gemeint ist. Diese poetisch-theologische Spannung darf nicht durch eine erklärende Ergänzung aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischem Zeilenbau. Der Parallelismus der drei Verbformen wird gewahrt. „Erbschaft“ und „Geliebte meiner Seele“ erhalten die Bildsprache und ermöglichen, die feminine Mehrdeutigkeit des Ausgangstextes im Deutschen so weit wie möglich sichtbar zu halten.
