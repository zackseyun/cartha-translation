  text: כִּ֧י גַם אַחֶ֣י/ךָ וּ/בֵית אָבִ֗י/ךָ גַּם הֵ֨מָּה֙ בָּ֣גְדוּ בָ֔/ךְ גַּם הֵ֛מָּה קָרְא֥וּ אַחֲרֶ֖י/ךָ מָלֵ֑א אַל תַּאֲמֵ֣ן בָּ֔/ם כִּֽי יְדַבְּר֥וּ אֵלֶ֖י/ךָ טוֹבֽוֹת־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/012/006.yaml
  text: For even your brothers and your father’s house—even they have dealt treacherously with you[a]; even they have called out loudly after you. Do not trust them[b], though they speak good things to you.
translation:
  language: de
  text: Denn sogar deine Brüder[a] und das Haus deines Vaters – auch sie haben dich verraten; auch sie haben dir laut nachgerufen.[b] Vertraue ihnen nicht, auch wenn sie freundlich zu dir reden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Brüder“ ist im Hebräischen grammatisch maskulin und meint hier Jeremias Brüder oder nahe männliche Verwandte; „das Haus deines Vaters“ bezeichnet den weiteren väterlichen Familienverband.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Sie haben hinter dir her mit voller Stimme gerufen“; gemeint sein kann ein feindseliger öffentlicher Aufschrei oder eine Verfolgung unter Zurufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֶיךָ
  choice: deine Brüder
  rationale: Die maskuline Pluralform von אָח mit Suffix bezeichnet unmittelbar Jeremias Brüder beziehungsweise nahe männliche Verwandte; die geschlechtsspezifische Form des Hebräischen bleibt erhalten.
- source_word: וּבֵית אָבִיךָ
  choice: und das Haus deines Vaters
  rationale: Die Wendung bezeichnet den väterlichen Haushalt beziehungsweise Familienverband. Die konkrete hebräische Haus-Metapher bleibt erhalten, ohne den Ausdruck auf die Kernfamilie zu verengen.
- source_word: בָּגְדוּ בָךְ
  choice: haben dich verraten
  rationale: בגד bezeichnet treuloses, verräterisches Handeln. „Dich verraten“ gibt die starke persönliche Aussage im gegenwärtigen Deutsch natürlicher wieder als „treulos an dir gehandelt“.
- source_word: קָרְאוּ אַחֲרֶיךָ מָלֵא
  choice: haben dir mit voller Stimme nachgerufen
  rationale: קרא mit אַחֲרֵי beschreibt ein Rufen hinter jemandem her; מָלֵא verstärkt das Rufen im Sinn voller beziehungsweise lauter Stimme. Die Formulierung bewahrt das Bild und lässt offen, ob es sich um Schmährufe oder Verfolgung handelt.
- source_word: אַל תַּאֲמֵן בָּם
  choice: Vertraue ihnen nicht
  rationale: Die Hifil-Form von אמן bedeutet hier angesichts des trügerischen Redens am ehesten, jemandem Vertrauen zu schenken.
- source_word: כִּי יְדַבְּרוּ אֵלֶיךָ טוֹבוֹת
  choice: auch wenn sie freundlich zu dir reden
  rationale: טוֹבוֹת bezeichnet günstige, angenehme oder wohlwollend klingende Worte. Das konzessive „auch wenn“ bildet den Warnungszusammenhang natürlich ab, ohne die freundliche Rede als aufrichtig zu bewerten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „auch sie“ bildet die eindringliche hebräische Struktur ab. Der Gedankenstrich markiert die Hervorhebung, ohne die knappe Warnung unnötig auszubauen.
