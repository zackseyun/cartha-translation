source:
  edition: WLC
  text: וְ/אֶל הַ/כֹּהֲנִים֩ וְ/אֶל כָּל הָ/עָ֨ם הַ/זֶּ֜ה דִּבַּ֣רְתִּי לֵ/אמֹ֗ר כֹּה֮ אָמַ֣ר יְהוָה֒ אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י נְבִֽיאֵי/כֶ֗ם הַֽ/נִּבְּאִ֤ים לָ/כֶם֙ לֵ/אמֹ֔ר הִנֵּ֨ה כְלֵ֧י בֵית יְהוָ֛ה מוּשָׁבִ֥ים מִ/בָּבֶ֖לָ/ה עַתָּ֣ה מְהֵרָ֑ה כִּ֣י שֶׁ֔קֶר הֵ֖מָּה נִבְּאִ֥ים לָ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/016.yaml
  text: 'And to the priests and to all this people I spoke[a], saying, “Thus says Yahweh: Do not listen to the words of your prophets who are prophesying to you, saying, ‘Behold, the vessels of the house of Yahweh are being brought back from Babylon now, quickly,’ for they are prophesying falsely to you.”'
translation:
  language: de
  text: 'Und zu den Priestern und zu diesem ganzen Volk sagte ich: »So spricht Jahwe: Hört nicht auf die Worte eurer Propheten, die euch weissagen: ›Seht, die Geräte des Hauses Jahwes werden jetzt sehr bald[a] aus Babylon zurückgebracht!‹ Denn was sie euch weissagen, ist Lüge.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jetzt, schnell«; gemeint ist die unmittelbar bevorstehende Rückführung, welche die Propheten behaupten. Möglich ist auch: »werden sehr bald aus Babylon zurückgebracht«.'
    reason: Die knappe hebräische Wendung עַתָּה מְהֵרָה verbindet Gegenwartsbezug und Dringlichkeit; mehrere natürliche deutsche Wiedergaben sind möglich.
lexical_decisions:
- source_word: וְאֶל הַכֹּהֲנִים וְאֶל כָּל הָעָם הַזֶּה
  choice: Und zu den Priestern und zu diesem ganzen Volk
  rationale: Bewahrt die wiederholte Präposition und gibt עָם als kollektiven Singular mit Demonstrativpronomen wieder.
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: sagte ich
  rationale: Im heutigen Deutschen gibt die übliche Redeeinleitung den hebräischen Pleonasmus natürlich wieder; ein wörtliches »redete ich, indem ich sagte« wäre unnötig schwerfällig.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die traditionelle prophetische Botenformel und gibt den Gottesnamen ausdrücklich als Jahwe wieder.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: Hört nicht auf
  rationale: Bezeichnet nicht bloß akustisches Hören, sondern das Beachten und Befolgen der Worte.
- source_word: דִּבְרֵי נְבִיאֵיכֶם הַנִּבְּאִים לָכֶם
  choice: die Worte eurer Propheten, die euch weissagen
  rationale: Erhält sowohl die konkrete Bezeichnung »Worte« als auch die fortlaufende prophetische Tätigkeit.
- source_word: הִנֵּה
  choice: Seht
  rationale: Gibt die aufmerksamkeitslenkende Partikel in gegenwärtigem, würdigem Deutsch wieder.
- source_word: כְלֵי בֵית יְהוָה
  choice: die Geräte des Hauses Jahwes
  rationale: »Geräte« bezeichnet die kultischen Gegenstände; »Haus Jahwes« bewahrt die hebräische Tempelbezeichnung.
- source_word: מוּשָׁבִים מִבָּבֶלָה
  choice: werden aus Babylon zurückgebracht
  rationale: Gibt die passive beziehungsweise kausativ-passive Form von שוב wieder, ohne ausdrücklich zu bestimmen, wer die Gegenstände zurückbringt.
- source_word: עַתָּה מְהֵרָה
  choice: jetzt in Kürze
  rationale: Bewahrt sowohl den Gegenwartsbezug als auch die von den falschen Propheten behauptete unmittelbare Erfüllung.
- source_word: כִּי שֶׁקֶר הֵמָּה נִבְּאִים לָכֶם
  choice: Denn was sie euch weissagen, ist Lüge
  rationale: Gibt שֶׁקֶר prädikativ wieder und formuliert die Aussage im Deutschen natürlich, ohne ihren scharfen Vorwurf abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; »Jahwe« bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Bezeichnung der prophetischen Aussage als שֶׁקֶר
  choice: Was sie euch weissagen, ist Lüge
  alternative: Sie weissagen euch fälschlich
  rationale: Die substantivische Schärfe von שֶׁקֶר bleibt erhalten. Der Text bezeichnet den Inhalt der Weissagung als Lüge, ohne hier weiter über Motivation oder Selbsttäuschung der Propheten zu entscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Rede ist klar gegliedert; unnötig wörtliche hebräische Redundanz wurde geglättet, während Wiederholungen und theologisch bedeutsame Benennungen erhalten bleiben.
