  terminology: „Yahweh“, „weissagen“, „vertreiben“ und „umkommen“ sind sachgerecht. „Damit“ sollte die zweckgerichtete Formulierung von לְמַעַן bewahren, ohne eine über den Text hinausgehende theologische Erklärung einzutragen.
