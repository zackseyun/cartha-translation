source:
  edition: WLC
  text: כִּ֣י לֹ֤א שְׁלַחְתִּי/ם֙ נְאֻם יְהוָ֔ה וְ/הֵ֛ם נִבְּאִ֥ים בִּ/שְׁמִ֖/י לַ/שָּׁ֑קֶר לְמַ֨עַן הַדִּיחִ֤/י אֶתְ/כֶם֙ וַ/אֲבַדְתֶּ֔ם אַתֶּ֕ם וְ/הַ/נְּבִאִ֖ים הַֽ/נִּבְּאִ֥ים לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/015.yaml
  text: For I did not send them[a], declares Yahweh, and they are prophesying falsely in my name, so that I may drive you out[b], and you will perish—you and the prophets who are prophesying to you.
translation:
  language: de
  text: Denn ich habe sie nicht gesandt, spricht Yahweh, und sie weissagen in meinem Namen falsch[a], damit ich euch vertreibe[b] und ihr umkommt – ihr und die Propheten, die euch weissagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie weissagen in meinem Namen Lüge“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verbanne“; das hebräische Verb kann das Wegtreiben oder Verbannen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Warnung ein und stellt den erklärenden Zusammenhang natürlich her.
- source_word: לֹא שְׁלַחְתִּים
  choice: ich habe sie nicht gesandt
  rationale: Das Qal Perfekt mit Objektsuffix wird im Deutschen idiomatisch mit dem Perfekt wiedergegeben; der Bezug auf die falschen Propheten bleibt klar.
- source_word: נְאֻם יְהוָה
  choice: spricht Yahweh
  rationale: Gibt die feste prophetische Botenformel würdig und verständlich wieder und bewahrt den Eigennamen des Gottes Israels.
- source_word: וְהֵם נִבְּאִים
  choice: Dennoch weissagen sie
  rationale: Die adversative Wirkung ergibt sich aus dem Gegensatz zwischen Nichtsendung und prophetischem Auftreten. Das Präsens bildet die andauernde Tätigkeit des Partizips natürlich ab.
- source_word: בִּשְׁמִי לַשָּׁקֶר
  choice: in meinem Namen Lügen
  rationale: Die Formulierung bewahrt sowohl den Autoritätsanspruch von 'in meinem Namen' als auch den nominalen Charakter von שֶׁקֶר; die adverbiale Wiedergabe 'falsch' bleibt als Alternative vermerkt.
- source_word: לְמַעַן
  choice: sodass
  rationale: Die Konjunktion kann Zweck oder Folge ausdrücken. 'Sodass' bewahrt hier die Spannung, ohne ausdrücklich eine moralisch problematische Absicht Gottes zu behaupten.
- source_word: הַדִּיחִי אֶתְכֶם
  choice: ich euch vertreibe
  rationale: Im Zusammenhang des angekündigten Exils bezeichnet das Hiphil von נדח ein Wegtreiben beziehungsweise Verbannen, nicht bloß ein Irreführen.
- source_word: וַאֲבַדְתֶּם
  choice: und ihr umkommt
  rationale: Das Verb bezeichnet das Zugrundegehen, ohne dessen konkrete Art unnötig festzulegen; die Form hat im prophetischen Zusammenhang zukünftige Bedeutung.
- source_word: הַנְּבִאִים הַנִּבְּאִים לָכֶם
  choice: die Propheten, die euch weissagen
  rationale: Die Wiederholung von Substantiv und Partizip bleibt sinngemäß erhalten; 'euch weissagen' gibt die Adressatenangabe knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. Die Transliteration bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Zweck oder Folge bei לְמַעַן
  choice: sodass
  alternative: damit
  rationale: לְמַעַן kann einen Zweck oder eine Folge einführen. Im Zusammenhang kann die Aussage als gerichtliche Folge der falschen Prophetie verstanden werden; 'sodass' lässt die semantische Spannung offen, statt die Aussage eindeutig auf göttliche Absicht festzulegen.
- issue: Bedeutung von נדח im Gerichtskontext
  choice: vertreiben
  alternative: verbannen
  rationale: Der Exilkontext spricht für räumliche Entfernung aus dem Land. 'Vertreiben' ist gegenwärtig und anschaulich, während 'verbannen' als mögliche Nuance in der Fußnote genannt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ernst. Der Gedankenstrich hebt die abschließende Präzisierung hervor. 'Weissagen' hält die Wiederholung des hebräischen Wortstamms erkennbar, ohne altertümliche Satzformen zu verwenden.
