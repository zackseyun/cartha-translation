source:
  edition: WLC
  text: כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֣ים לָ/כֶ֑ם לְמַ֨עַן הַרְחִ֤יק אֶתְ/כֶם֙ מֵ/עַ֣ל אַדְמַתְ/כֶ֔ם וְ/הִדַּחְתִּ֥י אֶתְ/כֶ֖ם וַ/אֲבַדְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/010.yaml
  text: For they are prophesying lies to you[a], in order to remove you from your land; and I will drive you out[c][b], and you will perish.
translation:
  language: de
  text: Denn sie weissagen euch Lügen[a], um euch aus eurem Land zu entfernen; und ich werde euch vertreiben[b], und ihr werdet zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Falschheit“.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen wechselt die Aussage hier zur ausdrücklich benannten göttlichen Handlung: „Und ich werde euch vertreiben, und ihr werdet zugrunde gehen.“'
    reason: agency_clarification
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Lügen
  rationale: שֶׁקֶר bezeichnet Lüge, Täuschung oder Falschheit. Der Plural „Lügen“ ist im Deutschen bei „weissagen“ idiomatisch und gibt den falschen Inhalt ihrer fortgesetzten Verkündigung wieder.
- source_word: נִבְּאִים לָכֶם
  choice: sie weissagen euch
  rationale: Das Nifal von נבא bedeutet hier „weissagen“. Das Partizip beschreibt eine andauernde Tätigkeit; im gegenwärtigen Kontext gibt das deutsche Präsens diese angemessen wieder.
- source_word: לְמַעַן
  choice: um … zu
  rationale: Die Konstruktion kennzeichnet Zweck beziehungsweise beabsichtigte Folge. „Um … zu“ ist natürliches Deutsch und bewahrt die Zweckangabe.
- source_word: הַרְחִיק אֶתְכֶם מֵעַל אַדְמַתְכֶם
  choice: euch aus eurem Land zu entfernen
  rationale: 'Der Hifil von רחק ist kausativ: jemanden fernbringen beziehungsweise entfernen. „Aus eurem Land“ gibt die räumliche Trennung durch מֵעַל im Exilskontext natürlich wieder, ohne ein im Hebräischen nicht ausdrücklich vorhandenes „weit“ hinzuzufügen.'
- source_word: אַדְמַתְכֶם
  choice: euer Land
  rationale: אֲדָמָה kann Erdboden oder Land bezeichnen. Im Zusammenhang der drohenden Verbannung ist „Land“ die natürliche territoriale Wiedergabe.
- source_word: וְהִדַּחְתִּי אֶתְכֶם
  choice: dann werde ich euch vertreiben
  rationale: Der Hifil von נדח bezeichnet das Wegtreiben oder Verbannen. „Vertreiben“ ist kraftvoll und idiomatisch; „dann“ macht den Folgezusammenhang verständlich, während das ausdrückliche göttliche „ich“ erhalten bleibt.
- source_word: וַאֲבַדְתֶּם
  choice: und ihr werdet zugrunde gehen
  rationale: אבד bezeichnet hier Untergang oder Verderben. „Zugrunde gehen“ bewahrt den Ernst der Aussage, ohne die Art des Untergangs näher festzulegen.
theological_decisions:
- issue: Handelnde in der Abfolge des Gerichts
  choice: 'Die Propheten weissagen Lügen mit dem Zweck beziehungsweise der Folge, das Volk aus seinem Land zu entfernen; anschließend erklärt Gott ausdrücklich: „Ich werde euch vertreiben.“'
  alternative: Die falschen Propheten sind auch im gesamten Vertreibungsvorgang die allein gemeinten Handelnden.
  rationale: Der hebräische Satz unterscheidet die Zweckkonstruktion לְמַעַן הַרְחִיק von der ausdrücklich in der ersten Person formulierten göttlichen Handlung וְהִדַּחְתִּי. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Weissagen“ hält den prophetischen Kontext fest; „vertreiben“ und „zugrunde gehen“ sind verständlich und ernst, ohne unnötig altertümlich zu wirken.
