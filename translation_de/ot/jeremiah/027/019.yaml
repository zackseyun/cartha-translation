  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֶל הָֽ/עַמֻּדִ֔ים וְ/עַל הַ/יָּ֖ם וְ/עַל הַ/מְּכֹנ֑וֹת וְ/עַל֙ יֶ֣תֶר הַ/כֵּלִ֔ים הַ/נּוֹתָרִ֖ים בָּ/עִ֥יר הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/019.yaml
  text: 'For thus says Yahweh of Armies concerning the pillars[a], the Sea, the stands[b], and the rest of the vessels that remain in this city:'
translation:
  language: de
  text: 'Denn so spricht Yahweh der Heere über die Säulen, das Meer[a], die Gestelle[b] und die übrigen Geräte, die noch in dieser Stadt übrig sind:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Meer“ war das große Becken aus Bronze, das zur Ausstattung des Tempels gehörte.
    reason: cultural_note
  - marker: b
    text: 'Oder: Sockel; gemeint sind die Unterbauten der Tempelgeräte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung beziehungsweise Erläuterung zur vorhergehenden Aussage ein und gibt den hebräischen Diskursanschluss natürlich wieder.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Entspricht der festen prophetischen Botenformel und klingt im Deutschen zugleich geläufig und würdig.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh der Heere
  rationale: Bewahrt den Gottesnamen und übersetzt צְבָאוֹת konkret, ohne auf das heute weniger verständliche „Heerscharen“ auszuweichen.
- source_word: אֶל ... וְעַל ... וְעַל ... וְעַל
  choice: über
  rationale: Die Präpositionen führen hier die Gegenstände der folgenden Aussage an; das zusammenfassende deutsche „über“ vermeidet den falschen Eindruck einer Anrede an unbelebte Gegenstände.
- source_word: הָעַמֻּדִים
  choice: die Säulen
  rationale: Bezeichnet die architektonischen Säulen des Tempels; „Säulen“ ist im modernen Deutschen die natürliche Bezeichnung.
- source_word: הַיָּם
  choice: das Meer
  rationale: Gibt die traditionelle Benennung des großen Tempelbeckens knapp wieder; die Fußnote erklärt den Gegenstand.
- source_word: הַמְּכֹנוֹת
  choice: die Gestelle
  rationale: Bezeichnet die tragenden beziehungsweise fahrbaren Unterbauten der Tempelausstattung, ohne ihre genaue Bauart unnötig festzulegen.
- source_word: יֶתֶר הַכֵּלִים
  choice: die übrigen Geräte
  rationale: כֵּלִים ist ein weiter Begriff für Geräte und Gegenstände; „Geräte“ passt zum Inventar des Tempels besser als das engere „Gefäße“.
- source_word: הַנּוֹתָרִים
  choice: die ... zurückgeblieben sind
  rationale: Gibt das Partizip im Zusammenhang mit den noch in Jerusalem vorhandenen Gegenständen als natürliche deutsche Relativkonstruktion wieder.
- source_word: בָּעִיר הַזֹּאת
  choice: in dieser Stadt
  rationale: Direkte und idiomatische Wiedergabe der Ortsangabe; im Kontext ist Jerusalem gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Yahweh
  alternative: der HERR; Jahwe
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm; die Umschrift bewahrt den persönlichen Gottesnamen, statt ihn durch einen Titel zu ersetzen.
- issue: Wiedergabe des Gottesprädikats צְבָאוֹת
  choice: der Heere
  alternative: der Heerscharen; der himmlischen Heere
  rationale: „Der Heere“ wahrt den konkreten pluralischen und militärischen Sinn, während „der himmlischen Heere“ eine im Vers selbst nicht ausdrücklich genannte Deutung ergänzen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt bewusst formelhaft. Der Doppelpunkt erhält den offenen Anschluss an den folgenden Vers. „Meer“ wird als Name des Tempelbeckens beibehalten und durch eine Sachfußnote erläutert.
