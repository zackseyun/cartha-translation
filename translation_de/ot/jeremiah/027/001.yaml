  text: בְּ/רֵאשִׁ֗ית מַמְלֶ֛כֶת יְהוֹיָקִ֥ם בֶּן יֹאושִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying[b],
translation:
  language: de
  text: 'Zu Beginn der Regierungszeit Jojakims[a], des Sohnes Josias und Königs von Juda, erging dieses Wort von Jahwe an Jeremia:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Nennung Jojakims ist im Zusammenhang auffällig, da die Verse 3 und 12 Zedekia als König voraussetzen.
    reason: textual_variant
lexical_decisions:
- source_word: בְּרֵאשִׁית מַמְלֶכֶת
  choice: Zu Beginn der Regierungszeit
  rationale: Die Wendung bezeichnet die Anfangszeit der königlichen Herrschaft; „Regierungszeit“ gibt מַמְלֶכֶת hier idiomatisch und präzise wieder.
- source_word: יְהוֹיָקִם בֶּן יֹאושִׁיָּהוּ
  choice: Jojakims, des Sohnes Josias
  rationale: Die Namen folgen den im Deutschen üblichen biblischen Namensformen; das Abstammungsverhältnis bleibt ausdrücklich erhalten.
- source_word: מֶלֶךְ יְהוּדָה
  choice: Königs von Juda
  rationale: Der Königstitel und sein Herrschaftsgebiet werden formal entsprechend dem Hebräischen wiedergegeben.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל
  choice: erging dieses Wort … an
  rationale: „Erging … an“ ist eine natürliche deutsche Wiedergabe der prophetischen Wortereignisformel und bewahrt „Wort“ statt der deutenderen Alternative „Botschaft“.
- source_word: יִרְמְיָה
  choice: Jeremia
  rationale: Verwendet die etablierte deutsche Form des Personennamens.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: Die Herkunftsangabe wird bewahrt und das Tetragramm als Gottes Eigenname „Jahwe“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet im heutigen Deutsch die in den folgenden Versen einsetzende direkte Rede natürlich ein und erfüllt damit die Funktion des hebräischen Infinitivs לֵאמֹר.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm; „Jahwe“ bewahrt den Charakter als Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Historische Königsangabe am Kapitelanfang
  choice: Jojakim im Haupttext beibehalten
  alternative: Zedekia nach einigen Textzeugen und dem Zusammenhang
  rationale: Der maßgebliche hebräische WLC-Text liest יְהוֹיָקִם. Die Spannung zu den Versen 3 und 12 wird nicht stillschweigend harmonisiert, sondern in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle prophetische Formel bleibt mit „erging dieses Wort … an“ erkennbar; der anschließende Doppelpunkt vermeidet ein im Deutschen schwerfälliges „indem er sprach“.
