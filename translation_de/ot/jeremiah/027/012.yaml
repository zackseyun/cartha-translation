base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/012.yaml
  text: And to Zedekiah king of Judah I spoke all these words[a], saying, “Bring your necks under the yoke of the king of Babylon, and serve him and his people[b], and live.”
translation:
  language: de
  text: 'Auch zu Zedekia, dem König von Juda, sprach ich entsprechend all diesen Worten: »Beugt euren Nacken unter das Joch des Königs von Babel[a], dient ihm und seinem Volk und bleibt am Leben![b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Bringt eure Nacken in das Joch des Königs von Babel.«'
    reason: lexical_alternative
  - marker: b
    text: 'Das kann auch als Folge oder Zweck verstanden werden: »dann werdet ihr leben« oder »damit ihr am Leben bleibt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Auch zu Zedekia, dem König von Juda
  rationale: Die Präposition אֶל wird mit „zu“ wiedergegeben; die Apposition bezeichnet Zedekia natürlich und quellennah als König von Juda. Das einleitende וְ verbindet diese Anrede mit dem vorausgehenden Zusammenhang und wird daher als „Auch“ ausgedrückt.
- source_word: דִּבַּרְתִּי כְּכָל הַדְּבָרִים הָאֵלֶּה לֵאמֹר
  choice: sprach ich alle diese Worte
  rationale: „Sprach ich“ entspricht dem Piel von דבר. Das formelhafte לֵאמֹר wird im Deutschen durch den folgenden Doppelpunkt idiomatisch ausgedrückt. כְּכָל bezeichnet hier den Inhalt beziehungsweise die Übereinstimmung mit den zuvor genannten Worten; „alle diese Worte“ ist natürlich und bewahrt דְּבָרִים.
- source_word: הָבִיאוּ אֶת צַוְּארֵיכֶם בְּעֹל מֶלֶךְ בָּבֶל
  choice: Beugt euren Nacken unter das Joch des Königs von Babel
  rationale: Wörtlich steht „bringt eure Nacken in/unter das Joch“. Die deutsche Wendung „den Nacken unter ein Joch beugen“ erhält das konkrete Bild und vermittelt zugleich die geforderte politische Unterwerfung, ohne sie zu abstrahieren.
- source_word: וְעִבְדוּ אֹתוֹ וְעַמּוֹ
  choice: dient ihm und seinem Volk
  rationale: עבד bezeichnet hier den politischen Dienst beziehungsweise die Unterordnung unter den babylonischen König. „Dient“ wahrt die Breite des hebräischen Verbs; עַמּוֹ wird direkt als „seinem Volk“ wiedergegeben.
- source_word: וִחְיוּ
  choice: und bleibt am Leben
  rationale: Die knappe Imperativfolge wird als Aufforderung wiedergegeben. „Am Leben bleiben“ ist im Deutschen in diesem politischen Überlebenskontext natürlicher als das missverständliche „lebt“, ohne die mögliche konsekutive Nuance festzulegen.
theological_decisions:
- issue: Politische Unterwerfung unter die Herrschaft Babylons
  choice: Die Aufforderung wird als konkrete Unterordnung unter den König von Babel und als Dienst an ihm und seinem Volk wiedergegeben.
  alternative: Die Aussage als allgemeine Demut oder rein geistliche Unterordnung paraphrasieren.
  rationale: Der historische und prophetische Konflikt des Textes betrifft die babylonische Fremdherrschaft. Diese Spannung darf weder vergeistigt noch abgeschwächt werden.
- issue: Verhältnis zwischen Gehorsam und Überleben in וִחְיוּ
  choice: Die imperativische Form „bleibt am Leben“ steht im Haupttext; die mögliche Folge- oder Zweckbedeutung wird in einer Fußnote offengehalten.
  alternative: Eindeutig „dann werdet ihr leben“ oder „damit ihr lebt“ übersetzen.
  rationale: Die hebräische Verknüpfung kann Aufforderung, Folge oder Zweck nahelegen. Der Haupttext bewahrt die Form, während die Fußnote die semantische Spannung transparent macht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Babel“ folgt der geläufigen deutschen Bibeltradition für בָּבֶל; „Beugt euren Nacken unter das Joch“ erhält das anschauliche Herrschaftsbild in natürlicher deutscher Form. Der Doppelpunkt ersetzt die im Deutschen schwerfällige Redeeinleitung „indem ich sagte“.
