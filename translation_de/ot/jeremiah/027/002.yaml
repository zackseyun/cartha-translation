  variant: modern standard German
source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֵלַ֔/י עֲשֵׂ֣ה לְ/ךָ֔ מוֹסֵר֖וֹת וּ/מֹט֑וֹת וּ/נְתַתָּ֖/ם עַל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/002.yaml
  text: 'Thus said Yahweh to me: “Make for yourself bonds and yoke-bars[a], and put them on your neck.”'
translation:
  language: de
  text: 'So sprach Jahwe zu mir: »Mach dir Fesseln und Jochstangen[a] und lege sie auf deinen Nacken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Fesseln und Jochstangen«; gemeint sind bindende Bänder und die Stangen eines Jochs. Manche Übersetzungen vereinfachen zu »Riemen und Joche«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: So
  rationale: Leitet die prophetische Botenformel ein und bewahrt in natürlichem, gehobenem Deutsch deren formelhaften Charakter.
- source_word: אָמַר יְהוָה
  choice: sprach Jahwe
  rationale: Das Qal Perfekt wird im berichtenden Kontext als Vergangenheit wiedergegeben; »sprach« entspricht dem würdevollen prophetischen Register. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition אֶל mit Suffix bezeichnet hier den Empfänger der göttlichen Rede.
- source_word: עֲשֵׂה לְךָ
  choice: Mach dir
  rationale: Der Imperativ mit לְךָ trägt eine dativisch-reflexive Nuance; »Mach dir« ist eine knappe und natürliche deutsche Wiedergabe.
- source_word: מוֹסֵרוֹת
  choice: Fesseln
  rationale: Das Wort bezeichnet bindende Bänder oder Fesseln, die hier zum Jochgerät der symbolischen Handlung gehören.
- source_word: מֹטוֹת
  choice: Jochstangen
  rationale: Gemeint sind genauer die Stangen beziehungsweise Querhölzer eines Jochs, nicht zwingend das gesamte Joch; »Jochstangen« bewahrt diese Präzision.
- source_word: וּנְתַתָּם
  choice: und lege sie
  rationale: Das Perfekt mit vorangestelltem ו setzt in diesem Zusammenhang die Aufforderung fort. »Lege« passt im Deutschen zu einem Gegenstand, der auf den Nacken gebracht wird.
- source_word: עַל צַוָּארֶךָ
  choice: auf deinen Nacken
  rationale: צַוָּאר bezeichnet Hals beziehungsweise Nacken; bei einem Joch ist »Nacken« sachlich und idiomatisch passend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die konkrete Bildsprache der beiden Teile des Jochgeräts bleibt erhalten; die Konstruktion ist bewusst knapp und befehlend.
