  text: וְ/אִם נְבִאִ֣ים הֵ֔ם וְ/אִם יֵ֥שׁ דְּבַר יְהוָ֖ה אִתָּ֑/ם יִפְגְּעוּ נָא֙ בַּֽ/יהוָ֣ה צְבָא֔וֹת לְ/בִלְתִּי בֹ֜אוּ הַ/כֵּלִ֣ים הַ/נּוֹתָרִ֣ים בְּ/בֵית יְהוָ֗ה וּ/בֵ֨ית מֶ֧לֶךְ יְהוּדָ֛ה וּ/בִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/018.yaml
  text: But if they are prophets[a], and if the word of Yahweh is with them, let them now plead with Yahweh of hosts that the vessels remaining in the house of Yahweh, in the house of the king of Judah[c][b], and in Jerusalem may not go to Babylon.
translation:
  language: de
  text: Doch wenn sie Propheten sind und wenn das Wort Jahwes bei ihnen ist, dann sollen sie doch Jahwe, den Heerscharen, inständig bitten[a], damit die Geräte, die im Haus Jahwes, im Haus des Königs von Juda[b] und in Jerusalem übrig geblieben sind, nicht nach Babel kommen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei Jahwe, dem Herrn der Heerscharen, Fürbitte einlegen“. Das hebräische Verb kann sowohl inständiges Bitten als auch fürbittendes Eintreten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Palast des Königs von Juda“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „nicht nach Babel kommen“. Gemeint ist, dass die noch vorhandenen Geräte nicht dorthin weggeführt werden.'
    reason: clarification
lexical_decisions:
- source_word: וְאִם
  choice: Doch wenn
  rationale: Die Bedingung steht als herausfordernder Gegensatz zu den prophetischen Behauptungen im Kontext; „doch“ gibt diese Diskursfunktion wieder.
- source_word: דְּבַר יְהוָה אִתָּם
  choice: das Wort Jahwes bei ihnen ist
  rationale: Bewahrt die hebräische Existenz- und Präpositionalkonstruktion, ohne sie zu „sie haben das Wort Jahwes“ umzudeuten.
- source_word: יִפְגְּעוּ נָא בַּיהוָה צְבָאוֹת
  choice: sollen sie doch bei Jahwe der Heerscharen Fürbitte einlegen
  rationale: פגע mit ב bezeichnet hier ein inständiges Bitten beziehungsweise Eintreten. „Fürbitte einlegen“ passt zum prophetischen Kontext; „doch“ gibt die auffordernde und dringliche Nuance von נָא wieder.
- source_word: הַכֵּלִים הַנּוֹתָרִים
  choice: die Geräte, die ... übrig geblieben sind
  rationale: „Geräte“ bezeichnet die kultischen und königlichen Gegenstände idiomatisch; der Relativsatz bildet das Partizip הַנּוֹתָרִים natürlich ab.
- source_word: בְּבֵית יְהוָה
  choice: im Haus Jahwes
  rationale: Die formnahe Wiedergabe von בֵּית hält die Parallele zum folgenden „Haus des Königs“ aufrecht; gemeint ist der Tempel.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: im Haus des Königs von Juda
  rationale: Die Wiederholung von „Haus“ im Hebräischen bleibt erhalten; kontextuell ist der Königspalast gemeint.
- source_word: לְבִלְתִּי בֹאוּ ... בָּבֶלָה
  choice: damit ... nicht nach Babel kommen
  rationale: Gibt die verneinte Zweckkonstruktion und das Bewegungsverb בוא eng wieder; „Babel“ ist die im Deutschen geläufige biblische Namensform.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von יִפְגְּעוּ im prophetischen Zusammenhang
  choice: Fürbitte einlegen
  alternative: inständig bitten
  rationale: Der Zusammenhang fordert die angeblichen Propheten auf, für den Verbleib der Geräte bei Gott einzutreten. Die gewählte Formulierung bewahrt diesen interzessorischen Sinn, ohne eine Wirksamkeit der Bitte vorwegzunehmen.
- issue: Titel יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe Zebaot
  rationale: Die Bedeutung des Titels bleibt transparent und seine Heerscharen-Metaphorik wird nicht zum allgemeineren „Allmächtiger“ geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die herausfordernde Bedingung und die Dringlichkeit der Aufforderung werden durch „Doch wenn“ und „dann sollen sie doch“ hörbar. „Haus“ wahrt die hebräische Parallelität; erläuternde Alternativen stehen in den Fußnoten.
