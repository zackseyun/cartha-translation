source:
  edition: WLC
  text: וְ/שִׁלַּחְתָּ/ם֩ אֶל מֶ֨לֶךְ אֱד֜וֹם וְ/אֶל מֶ֣לֶךְ מוֹאָ֗ב וְ/אֶל מֶ֨לֶךְ֙ בְּנֵ֣י עַמּ֔וֹן וְ/אֶל מֶ֥לֶךְ צֹ֖ר וְ/אֶל מֶ֣לֶךְ צִיד֑וֹן בְּ/יַ֤ד מַלְאָכִים֙ הַ/בָּאִ֣ים יְרוּשָׁלִַ֔ם אֶל צִדְקִיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/003.yaml
  text: And send them to the king of Edom[a], the king of Moab, the king of the Ammonites, the king of Tyre, and the king of Sidon, by the hand of the messengers who are coming to Jerusalem to Zedekiah king of Judah.
translation:
  language: de
  text: Und sende sie den Königen von Edom und Moab, dem König der Ammoniter[a], den Königen von Tyrus und Sidon durch die Boten, die nach Jerusalem zu Zedekia, dem König von Juda, kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Söhne Ammons“, das heißt: die Ammoniter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתָּם
  choice: Und schick sie
  rationale: Das Piel Perfekt 2. Person Maskulin Singular mit Suffix der 3. Person Maskulin Plural hat in der fortlaufenden Anweisung Aufforderungscharakter. „Schick sie“ gibt diesen im heutigen Deutsch natürlich wieder; „Und“ bewahrt die Verknüpfung.
- source_word: מֶלֶךְ
  choice: den König von / den König der
  rationale: Die wiederholte Konstruktverbindung bezeichnet jeweils den Herrscher des folgenden Landes beziehungsweise Volkes. Der deutsche Akkusativ wird durch das Verb „schicken“ bestimmt.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Wörtlich „Söhne Ammons“, hier jedoch eine feste ethnische Bezeichnung. „Ammoniter“ ist im Deutschen präzise und idiomatisch; die wörtliche Form wird in einer Fußnote bewahrt.
- source_word: בְּיַד
  choice: durch
  rationale: Die Wendung „durch die Hand von“ bezeichnet hier die vermittelnde Tätigkeit der Boten. Das deutsche „durch“ überträgt die Funktion klar und ohne unnatürlichen Hebraismus.
- source_word: מַלְאָכִים
  choice: Boten
  rationale: Das Wort bezeichnet allgemein Überbringer einer Botschaft. Der Zusammenhang legt diplomatische Gesandte nahe, ohne dass der hebräische Ausdruck einen amtlichen Rang ausdrücklich festlegt.
- source_word: הַבָּאִים
  choice: die … kommen
  rationale: Das substantivierte Partizip beschreibt die Boten als diejenigen, die auf dem Weg sind beziehungsweise eintreffen. Das Präsens wahrt diesen aspektuellen Spielraum.
- source_word: אֶל צִדְקִיָּהוּ
  choice: zu Zedekia
  rationale: 'Die Präposition אֶל bezeichnet hier die Zielrichtung der Reise: Die Boten kommen zu Zedekia.'
theological_decisions:
- issue: Ethnische Bezeichnung בְּנֵי עַמּוֹן
  choice: Ammoniter
  alternative: Söhne Ammons
  rationale: In der Aufzählung von Herrschern fungiert die maskuline Konstruktverbindung als Volksname und bezeichnet nicht ausschließlich männliche Nachkommen. Die idiomatische Übersetzung vermeidet eine irreführende Verengung; die Form des Hebräischen bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Form „den König“ erhält den feierlichen Aufzählungsrhythmus. „Und zwar durch“ verdeutlicht, dass die Boten die zuvor genannten Gegenstände überbringen, und verhindert eine missverständliche Reihung zweier Zielangaben.
