source:
  edition: WLC
  text: וְ/עָבְד֤וּ אֹת/וֹ֙ כָּל הַ/גּוֹיִ֔ם וְ/אֶת בְּנ֖/וֹ וְ/אֶֽת בֶּן בְּנ֑/וֹ עַ֣ד בֹּא עֵ֤ת אַרְצ/וֹ֙ גַּם ה֔וּא וְ/עָ֤בְדוּ ב/וֹ֙ גּוֹיִ֣ם רַבִּ֔ים וּ/מְלָכִ֖ים גְּדֹלִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/007.yaml
  text: All the nations will serve him[a], and his son, and his grandson, until the time of his own land comes[c][b]; then many nations and great kings will make even him serve them.
translation:
  language: de
  text: Alle Nationen werden ihm, seinem Sohn und seinem Enkel dienen, bis die Zeit für sein eigenes Land kommt.[a] Dann werden viele Nationen und große Könige sogar ihn in ihren Dienst zwingen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »bis die Zeit seines Landes kommt«; gemeint ist die festgesetzte Zeit, die Babylonien selbst betrifft.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Wendung bedeutet hier wahrscheinlich, dass viele Nationen und große Könige Babylon in den Dienst zwingen. Wörtlicher könnte man übersetzen: »werden sich seiner zum Dienst bedienen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ אֹתוֹ
  choice: werden ihm dienen
  rationale: עבד bezeichnet hier im politischen Zusammenhang die Unterwerfung unter einen Herrscher beziehungsweise ein Reich; »dienen« gibt dies natürlich und prägnant wieder.
- source_word: כָּל הַגּוֹיִם
  choice: alle Nationen
  rationale: גוים meint hier politische Gemeinwesen unter babylonischer Herrschaft; »Nationen« passt zum geopolitischen Zusammenhang und vermeidet die religiöse Nebenbedeutung von »Heiden«.
- source_word: וְאֶת בְּנוֹ וְאֶת בֶּן בְּנוֹ
  choice: ebenso seinem Sohn und seinem Enkel
  rationale: Wörtlich steht »seinem Sohn und dem Sohn seines Sohnes«. »Enkel« ist die klare moderne Entsprechung und bewahrt die Aussage über die dynastische Nachfolge.
- source_word: עַד בֹּא עֵת אַרְצוֹ
  choice: bis die Zeit für sein eigenes Land kommt
  rationale: Die knappe hebräische Wendung bezeichnet die bestimmte Zeit, die Babylonien selbst betrifft. »für sein eigenes Land« macht den Bezug verständlich, ohne das angekündigte Geschehen ausdrücklich als Gericht auszudeuten.
- source_word: גַּם הוּא
  choice: sogar ihn
  rationale: Die Formulierung bewahrt den emphatischen Gedanken, dass schließlich auch er selbst beziehungsweise Babylon unter fremde Dienstbarkeit gerät.
- source_word: וְעָבְדוּ בוֹ
  choice: in ihren Dienst zwingen
  rationale: עבד mit ב bezeichnet hier wahrscheinlich auferlegten Dienst beziehungsweise das Indienstnehmen. Die Wiedergabe bringt den Machtwechsel zum Ausdruck und vermeidet die irreführende Bedeutung, die Nationen würden ihm weiterhin dienen.
- source_word: גּוֹיִם רַבִּים וּמְלָכִים גְּדֹלִים
  choice: viele Nationen und mächtige Könige
  rationale: »Nationen« erhält den politischen Bezug; »mächtige Könige« gibt גדלים im Herrschaftskontext idiomatisch wieder.
theological_decisions:
- issue: Umkehrung der Machtverhältnisse Babylons im letzten Satzteil
  choice: Viele Nationen und mächtige Könige zwingen Babylon beziehungsweise seinen Herrscher in ihren Dienst.
  alternative: Hölzerner ließe sich die Wendung etwa als »werden sich seiner zum Dienst bedienen« wiedergeben.
  rationale: Der weitere Zusammenhang kündigt Babylons zeitlich begrenzte Vorherrschaft und seine spätere Unterwerfung an. Die Konstruktion וְעָבְדוּ בוֹ wird daher als auferlegter Dienst wiedergegeben, ohne die sprachliche Schwierigkeit zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die politische Bedeutung von »dienen« bleibt erhalten; die komprimierte Zeitangabe und die schwierige Konstruktion im Schlusssatz werden durch Fußnoten transparent gemacht.
