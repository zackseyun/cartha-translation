id: JER.27.21
reference: Jeremiah 27:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עַל הַ/כֵּלִ֗ים הַ/נּֽוֹתָרִים֙ בֵּ֣ית יְהוָ֔ה וּ/בֵ֥ית מֶֽלֶךְ יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/021.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel, concerning the vessels that remain in the house of Yahweh, in the house of the king of Judah[b], and in Jerusalem:'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen, der Gott Israels, über die Geräte, die im Haus Jahwes[a], im Haus des Königs von Juda[b] und in Jerusalem übrig geblieben sind:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Tempel Jahwes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Palast des Königs von Juda“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet hier die vorausgehende Aussage und wird im Deutschen natürlich mit „Denn“ wiedergegeben.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Die etablierte prophetische Botenformel gibt den performativen Charakter der hebräischen Wendung prägnant und gegenwartsbezogen wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Die traditionelle, weiterhin verständliche Wiedergabe lässt die umfassende Bedeutung himmlischer und irdischer Scharen offen.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Genitivverbindung wird transparent und idiomatisch wiedergegeben.
- source_word: עַל
  choice: über
  rationale: Die Präposition führt hier das Thema des folgenden Gottesspruchs ein; „über“ ist im Deutschen knapp und natürlich.
- source_word: הַכֵּלִים
  choice: die Geräte
  rationale: „Geräte“ bezeichnet die Tempelgegenstände, ohne ihre jeweilige Art oder Funktion enger festzulegen.
- source_word: הַנּוֹתָרִים
  choice: die … übrig geblieben sind
  rationale: Das Partizip bezeichnet die Gegenstände, die nach früheren Wegführungen noch an den genannten Orten vorhanden sind.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: Die wörtliche Bildsprache von „Haus“ und die Wiederholung von בַּיִת im folgenden Ausdruck bleiben erhalten.
- source_word: וּבֵית מֶלֶךְ יְהוּדָה
  choice: im Haus des Königs von Juda
  rationale: Die Wiedergabe bewahrt das wiederholte „Haus“; sachlich ist der Königspalast gemeint.
- source_word: וִירוּשָׁלִָם
  choice: und in Jerusalem
  rationale: Präposition und Konjunktion werden gemäß der hebräischen Ortsreihe ausdrücklich wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst; „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite des Titels יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  alternative: Jahwe der Heere
  rationale: „Heerscharen“ vermeidet eine unnötige Beschränkung auf menschliche Armeen und erhält die traditionelle Weite des Titels.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel „so spricht“ und der Titel „der Heerscharen“ wahren den biblischen Ton; die Satzstellung ist zugleich natürlich und gut verständlich. Die Wiederholung von „Haus“ folgt bewusst dem hebräischen Wortlaut, während Fußnoten die kontextuell eindeutigen Bedeutungen „Tempel“ und „Palast“ nennen.
