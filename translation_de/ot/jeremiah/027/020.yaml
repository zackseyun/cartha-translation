base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/020.yaml
  text: which Nebuchadnezzar king of Babylon did not take when he exiled Jeconiah son of Jehoiakim[a], king of Judah, from Jerusalem to Babylon[c][b], along with all the nobles of Judah and Jerusalem.
translation:
  language: de
  text: die Nebukadnezar, der König von Babel, nicht mitnahm, als er Jechonja, den Sohn Jojakims, den König von Juda, samt allen Vornehmen[a] von Juda und Jerusalem aus Jerusalem nach Babel in die Verbannung führte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vornehmen“ kann auch mit „Adligen“, „führenden Männern“ oder „Würdenträgern“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לֹא לְקָחָם
  choice: die … nicht mitgenommen hatte
  rationale: Das Relativpronomen bezieht sich auf die Geräte des vorigen Verses. Der Plusquamperfekt verdeutlicht im deutschen Satz natürlich, dass Nebukadnezar sie bei der früheren Verschleppung nicht mitnahm.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, der König von Babel
  rationale: Gebräuchliche deutsche Namensform und traditionelle, im Bibeldeutsch verständliche Wiedergabe des Reichsnamens.
- source_word: בַּגְלוֹתוֹ
  choice: als er … in die Verbannung führte
  rationale: Die temporale Infinitivkonstruktion bezeichnet das Exilieren beziehungsweise Wegführen; die Formulierung ist gegenwärtig verständlich und bewahrt den Deportationssinn.
- source_word: יְכָונְיָה בֶן יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jechonja, den Sohn Jojakims, den König von Juda
  rationale: Die Apposition wird eng am Hebräischen beibehalten; „den König von Juda“ bezeichnet Jechonja.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: aus Jerusalem nach Babel
  rationale: Die Ausgangs- und Zielangabe wird idiomatisch und präzise wiedergegeben.
- source_word: וְאֵת כָּל חֹרֵי יְהוּדָה וִירוּשָׁלִָם
  choice: samt allen Vornehmen von Juda und Jerusalem
  rationale: חֹרֵי bezeichnet hier hochgestellte führende Männer. „Vornehme“ bewahrt den sozial-politischen Rang, ohne sie enger als Amtsträger festzulegen.
