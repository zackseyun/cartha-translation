  text: וְ/צִוִּיתָ֣ אֹתָ֔/ם אֶל אֲדֹֽנֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כֹּ֥ה תֹֽאמְר֖וּ אֶל אֲדֹֽנֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/004.yaml
  text: 'And command them to say to their masters[a], ‘Thus says Yahweh of hosts, the God of Israel: Thus you shall say to your masters,’'
translation:
  language: de
  text: 'Und befiehl ihnen, ihren Herren[a] zu sagen: »So spricht Jahwe der Heerscharen, der Gott Israels: So sollt ihr zu euren Herren sagen:«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »Herren« sind hier die menschlichen Herrscher der Gesandten gemeint, also ihre Könige, nicht ein göttlicher Herrentitel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִוִּיתָ
  choice: Und befiehl
  rationale: Die Form steht in einer Folge göttlicher Anweisungen an Jeremia. Der deutsche Imperativ gibt ihre direktive Funktion natürlich wieder.
- source_word: אֹתָם
  choice: ihnen
  rationale: Das Pronomen bezieht sich auf die im Zusammenhang genannten Gesandten; nach »befehlen« verlangt das Deutsche den Dativ.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: ihren Herren
  rationale: אדון bezeichnet hier die menschlichen Oberherren beziehungsweise Könige der Gesandten. »Herren« bewahrt den Autoritätsbegriff und passt zum politischen Kontext.
- source_word: לֵאמֹר
  choice: zu sagen
  rationale: Der Infinitiv leitet den Inhalt des Auftrags ein und verbindet sich im Deutschen idiomatisch mit »befiehl ihnen«.
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Wiedergabe der prophetischen Botenformel bewahrt deren feierlichen und autoritativen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als »Jahwe« wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Im festen Gottesnamen-Titel bezeichnet das Wort die himmlischen Heere beziehungsweise Scharen; »der Heerscharen« ist prägnant und im deutschen Bibelregister verständlich.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung wird unmittelbar und idiomatisch wiedergegeben.
- source_word: כֹּה תֹּאמְרוּ
  choice: So sollt ihr ... sagen
  rationale: Die zweite Person Plural richtet sich an die Gesandten. »sollt« erhält den verpflichtenden Charakter der Anweisung.
- source_word: אֶל אֲדֹנֵיכֶם
  choice: zu euren Herren
  rationale: Dieselbe Bezeichnung steht nun mit dem Suffix der zweiten Person Plural; die Wiederholung des Wortes »Herren« folgt dem hebräischen Text.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Transliteration »Jahwe« bewahrt den persönlichen Bundesnamen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bedeutung von אֲדֹנֵיהֶם / אֲדֹנֵיכֶם
  choice: ihren Herren / euren Herren
  alternative: ihren Gebietern / euren Gebietern
  rationale: Gemeint sind menschliche politische Oberherren, nicht Gott. »Herren« erhält die lexikalische Nähe und die wiederholte Formulierung des Ausgangstextes, während die Fußnote die Referenz klärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Botenformel. Die auffällige Wiederholung von »ihren Herren« und »euren Herren« folgt dem hebräischen Wortlaut. Der abschließende Doppelpunkt zeigt, dass die angekündigte Botschaft im folgenden Vers weitergeht.
