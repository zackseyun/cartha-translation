base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/013.yaml
  text: Why will you and your people die by the sword, by famine, and by pestilence, just as the LORD has spoken concerning the nation that will not serve the king of Babylon?
translation:
  language: de
  text: Warum sollt ihr, du und dein Volk, durch Schwert, Hunger und Pest sterben, so wie der HERR es über das Volk gesagt hat, das dem König von Babylon nicht dienen will?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה תָמוּתוּ
  choice: Warum sollst du … sterben
  rationale: Die rhetorische Frage warnt vor der vermeidbaren Todesfolge. Das deutsche Modalverb „soll“ gibt diesen warnenden Sinn natürlicher wieder als ein schlichtes Futur, ohne einen göttlichen Auftrag zum Sterben auszudrücken.
- source_word: אַתָּה וְעַמֶּךָ
  choice: du mit deinem Volk
  rationale: Das Hebräische nennt den angesprochenen König im Singular und sein Volk; die Formulierung erhält beides und klingt im Deutschen idiomatisch.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  choice: durch Schwert, Hunger und Pest
  rationale: Die traditionelle Dreierformel wird knapp und verständlich wiedergegeben; „Pest“ bezeichnet hier eine verheerende Seuche.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: so wie der HERR es … gesagt hat
  rationale: כַּאֲשֶׁר wird vergleichend als „so wie“ wiedergegeben. Das Tetragramm erscheint gemäß verbreiteter deutscher Bibelkonvention als „der HERR“.
- source_word: אֶל הַגּוֹי
  choice: über das Volk
  rationale: אֶל bezeichnet hier den Gegenstand der göttlichen Aussage; „über“ ist im Deutschen natürlicher als „zu“ oder „gegen“.
- source_word: יַעֲבֹד אֶת מֶלֶךְ בָּבֶל
  choice: dem König von Babylon … dienen
  rationale: עבד bezeichnet im politischen Kontext Unterordnung beziehungsweise Vasallendienst. „dienen“ bewahrt zugleich die direkte lexikalische Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe kennzeichnet den Gottesnamen durch Kapitälchen und vermeidet eine unsichere Vokalisierung; sie fügt keine konfessionelle Deutung hinzu.
- issue: Modalität der rhetorischen Todesfrage
  choice: Warum sollst du … sterben
  alternative: Warum wirst du … sterben
  rationale: Der Kontext ist eine Warnung mit einem Ausweg durch Unterwerfung. „sollst“ drückt die erwartbare, aber vermeidbare Folge aus und nicht einen unabänderlichen Heils- oder Verdammungsbeschluss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Warnung bleibt direkt; die traditionelle Unheilsreihe „Schwert, Hunger und Pest“ wird ohne erklärende Erweiterung bewahrt.
