id: JER.27.22
reference: Jeremiah 27:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: בָּבֶ֥לָ/ה יוּבָ֖אוּ וְ/שָׁ֣מָּ/ה יִֽהְי֑וּ עַ֠ד י֣וֹם פָּקְדִ֤/י אֹתָ/ם֙ נְאֻם יְהוָ֔ה וְ/הַֽעֲלִיתִי/ם֙ וַ/הֲשִׁ֣יבֹתִ֔י/ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/022.yaml
  text: They will be brought to Babylon[a], and there they will remain until the day I attend to them, declares Yahweh[b]. Then I will bring them up and restore them to this place.
translation:
  language: de
  text: Nach Babel werden sie gebracht, und dort werden sie bleiben bis zu dem Tag, an dem ich mich ihrer annehme[a] – Ausspruch Jahwes. Dann werde ich sie heraufführen[b] und an diesen Ort zurückbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nach ihnen sehe; auch: sie heimsuche. Das hebräische Verb kann ein Eingreifen zum Heil oder zum Gericht bezeichnen; hier weist der Zusammenhang auf die bevorstehende Rückführung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: sie hinaufführen. Das ist eine geläufige Ausdrucksweise für die Rückkehr aus dem Exil in das Land.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּבֶלָה
  choice: nach Babel
  rationale: Das He locale bezeichnet die Richtung auf Babel zu; im Deutschen gibt „nach Babel“ dies idiomatisch wieder.
- source_word: יוּבָאוּ
  choice: werden sie gebracht
  rationale: Der Hofal von בוא bezeichnet ein passives Gebrachtwerden.
- source_word: וְשָׁמָּה יִהְיוּ
  choice: und dort werden sie bleiben
  rationale: היה bedeutet wörtlich „sein“; zusammen mit der Ortsangabe drückt es hier den fortdauernden Aufenthalt aus.
- source_word: פָּקְדִי אֹתָם
  choice: an dem ich mich ihrer annehme
  rationale: פקד kann ein Aufsuchen beziehungsweise Eingreifen zum Gericht oder zum Heil bezeichnen. Der folgende Rückführungszuspruch legt hier ein gnädiges Eingreifen nahe, ohne dass die Bedeutungsbreite des Verbs völlig eingeebnet werden sollte.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Botenformel wird knapp und würdevoll wiedergegeben; der Gottesname erscheint als „Jahwe“.
- source_word: וְהַעֲלִיתִים
  choice: Dann werde ich sie heraufführen
  rationale: Der Hifil von עלה bewahrt mit „heraufführen“ das hebräische Bild des Hinaufziehens aus dem Exil ins Land.
- source_word: וַהֲשִׁיבֹתִים
  choice: und an diesen Ort zurückbringen
  rationale: Der Hifil von שוב mit Objekt bezeichnet das Zurückbringen; die folgende Zielangabe wird unmittelbar angeschlossen.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: an diesen Ort
  rationale: Die konkrete, aber nicht weiter erklärte Bezeichnung „dieser Ort“ wird nicht zu „Land“ oder „Jerusalem“ ausgeweitet.
theological_decisions:
- issue: Bedeutung von פקד im Zusammenhang der Wiederherstellung
  choice: gnädiges Sich-Annehmen, wobei die weitere Bedeutungsbreite in einer Fußnote erhalten bleibt
  alternative: heimsuchen, nach ihnen sehen oder sie zur Rechenschaft ziehen
  rationale: Die unmittelbar folgende Zusage, sie herauf- und zurückzubringen, weist auf ein rettendes Eingreifen. Die Übersetzung vermeidet deshalb eine eindeutig strafende Wiedergabe, während die Fußnote die echte lexikalische Spannung sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am Hebräischen; „heraufführen“ bewahrt dessen räumliches Bild, während „zurückbringen“ im Deutschen die Zielangabe natürlich aufnimmt.
