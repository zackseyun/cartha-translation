  variant: modern standard German
source:
  edition: WLC
  text: וְ/הַ/גּ֗וֹי אֲשֶׁ֨ר יָבִ֧יא אֶת צַוָּאר֛/וֹ בְּ/עֹ֥ל מֶֽלֶךְ בָּבֶ֖ל וַֽ/עֲבָד֑/וֹ וְ/הִנַּחְתִּ֤י/ו עַל אַדְמָת/וֹ֙ נְאֻם יְהוָ֔ה וַֽ/עֲבָדָ֖/הּ וְ/יָ֥שַׁב בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/011.yaml
  text: But the nation that brings its neck under the yoke of the king of Babylon and serves him[a], I will let remain on its own land, declares Yahweh[b], and it will till it and dwell in it.
translation:
  language: de
  text: Doch das Volk, das seinen Nacken unter das Joch des Königs von Babel bringt und ihm dient, werde ich in seinem eigenen Land bleiben lassen, spricht Jahwe; es wird das Land bearbeiten und darin wohnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגּוֹי
  choice: das Volk
  rationale: גּוֹי bezeichnet hier ein politisch verstandenes Volk beziehungsweise eine Nation. Im Deutschen ist „das Volk“ in diesem Satz natürlicher und vermeidet den modernen staatsrechtlichen Beiklang von „Nation“.
- source_word: יָבִיא אֶת צַוָּארוֹ בְּעֹל
  choice: seinen Nacken unter das Joch bringt
  rationale: Die konkrete und für Jeremia 27 zentrale Jochmetapher bleibt erhalten; zugleich ist die Formulierung im Deutschen verständlich.
- source_word: מֶלֶךְ בָּבֶל
  choice: des Königs von Babel
  rationale: Direkte Wiedergabe der hebräischen Status-constructus-Verbindung; „Babel“ entspricht der üblichen deutschen Bibelsprache für das Reich und die Stadt.
- source_word: וַעֲבָדוֹ
  choice: und ihm dient
  rationale: עבד bezeichnet hier die politische Unterordnung beziehungsweise den Vasallendienst gegenüber dem babylonischen König.
- source_word: וְהִנַּחְתִּיו עַל אַדְמָתוֹ
  choice: werde ich in seinem eigenen Land bleiben lassen
  rationale: Der Hifil von נוח drückt hier aus, dass Jahwe das betreffende Volk in seinem Land verbleiben lässt. „Eigenen“ verdeutlicht den Possessivsuffix, ohne den Sinn zu erweitern.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht“ ist eine geläufige, würdige Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וַעֲבָדָהּ
  choice: es wird das Land bearbeiten
  rationale: Das feminine Suffix bezieht sich auf אַדָמָה, „Land/Boden“. עבד bezeichnet in Verbindung mit Land dessen Bearbeitung oder Bewirtschaftung. Das explizite „das Land“ klärt den Bezug natürlich.
- source_word: וְיָשַׁב בָּהּ
  choice: und darin wohnen
  rationale: ישב bedeutet hier wohnen beziehungsweise ansässig bleiben; „darin“ nimmt das Land als Bezugswort auf.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Form und bewahrt den Unterschied zwischen dem Gottesnamen und dem Titel „Herr“.
- issue: Verhältnis von menschlicher Unterwerfung und göttlicher Gewährung
  choice: Die Bedingung des Dienens und Jahwes Zusage des Verbleibens werden ohne zusätzliche Deutung nebeneinandergestellt.
  alternative: Die Aussage ausdrücklich als Belohnung oder Billigung der babylonischen Herrschaft formulieren
  rationale: Der hebräische Text verbindet Unterwerfung, göttliches Bleibenlassen und weiteres Leben im Land, erklärt aber die theologische Beziehung nicht näher. Diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Jochmetapher. „Doch“ stellt den Kontrast zum vorausgehenden Gerichtswort her. Keine Fußnoten sind nötig, da die möglichen Nuancen von וְהִנַּחְתִּיו und וַעֲבָדָהּ im Haupttext klar und textnah wiedergegeben werden.
