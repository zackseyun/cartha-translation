id: JER.27.5
reference: Jeremiah 27:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אָנֹכִ֞י עָשִׂ֣יתִי אֶת הָ/אָ֗רֶץ אֶת הָ/אָדָ֤ם וְ/אֶת הַ/בְּהֵמָה֙ אֲשֶׁר֙ עַל פְּנֵ֣י הָ/אָ֔רֶץ בְּ/כֹחִ/י֙ הַ/גָּד֔וֹל וּ/בִ/זְרוֹעִ֖/י הַ/נְּטוּיָ֑ה וּ/נְתַתִּ֕י/הָ לַ/אֲשֶׁ֖ר יָשַׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/005.yaml
  text: I myself made the earth[a], mankind, and the animals that are on the face of the earth, by my great power and by my outstretched arm, and I give it to whomever is right in my eyes.
translation:
  language: de
  text: Ich selbst habe die Erde, den Menschen[a] und die Tiere auf der Erde gemacht – durch meine große Kraft und meinen ausgestreckten Arm. Und ich gebe sie, wem es in meinen Augen recht ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Menschheit“. Der hebräische Singular „der Mensch“ kann hier stellvertretend für die gesamte Menschheit stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Ich selbst
  rationale: Das selbstständige Pronomen betont das bereits im Verb enthaltene Subjekt; „Ich selbst“ gibt diese Hervorhebung natürlich wieder.
- source_word: עָשִׂיתִי
  choice: habe … gemacht
  rationale: עשה bedeutet hier schlicht „machen“; „erschaffen“ würde die spezifischere Wortwahl von ברא eintragen, die im Hebräischen nicht steht.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: Die Verbindung mit Mensch und Tieren in einer schöpfungsbezogenen Aussage spricht für die kosmische Bedeutung „Erde“ statt des örtlichen „Land“.
- source_word: הָאָדָם
  choice: den Menschen
  rationale: Der bestimmte Singular bezeichnet hier den Menschen repräsentativ beziehungsweise die Menschheit als Gattung. „Den Menschen“ bewahrt im Deutschen sowohl den Singular als auch den generischen Sinn.
- source_word: הַבְּהֵמָה
  choice: die Tiere
  rationale: Das hebräische Singularwort ist kollektiv gebraucht. Der deutsche Plural „Tiere“ gibt den umfassenden Schöpfungskontext natürlicher wieder als „Vieh“.
- source_word: אֲשֶׁר עַל־פְּנֵי הָאָרֶץ
  choice: auf der Erde
  rationale: Die wörtliche Wendung „auf dem Angesicht der Erde“ wäre im heutigen Deutsch unnötig schwerfällig; „auf der Erde“ bewahrt den Sinn.
- source_word: בְּכֹחִי הַגָּדוֹל
  choice: durch meine große Kraft
  rationale: Das instrumentale ב bezeichnet das Mittel; „durch“ ist hier idiomatisch und präzise.
- source_word: וּבִזְרוֹעִי הַנְּטוּיָה
  choice: und meinen ausgestreckten Arm
  rationale: „Ausgestreckter Arm“ bewahrt das biblische anthropomorphe Bild für wirksame göttliche Macht; das zweite „durch“ ist durch die Koordination mitgemeint.
- source_word: וּנְתַתִּיהָ
  choice: Und ich gebe sie
  rationale: Das Perfekt kann im Zusammenhang Gottes gegenwärtiges, souveränes Verfügungsrecht ausdrücken. Das feminine Pronomen bezieht sich am ehesten auf „die Erde“ und wird als „sie“ wiedergegeben.
- source_word: לַאֲשֶׁר יָשַׁר בְּעֵינַי
  choice: wem es in meinen Augen recht ist
  rationale: Die Formulierung bewahrt das hebräische Bild „in meinen Augen“ und gibt ישר als das wieder, was aus Sicht des Sprechers recht beziehungsweise angemessen ist.
theological_decisions:
- issue: Generischer Sinn von הָאָדָם im Schöpfungszusammenhang
  choice: den Menschen
  alternative: die Menschheit
  rationale: „Den Menschen“ wahrt den bestimmten Singular und kann im Deutschen zugleich die Menschheit repräsentieren, ohne den Ausdruck auf einen einzelnen Mann zu beschränken.
- issue: Zeitlicher beziehungsweise aspektueller Wert von וּנְתַתִּיהָ
  choice: ich gebe sie
  alternative: ich habe sie gegeben
  rationale: Im Kontext begründet die Schöpfung Gottes fortdauernde Souveränität, die Erde zuzuteilen. Das Präsens bildet diesen allgemeinen Herrschaftsanspruch ab, ohne die mögliche perfektive Färbung dogmatisch zu überdehnen.
- issue: Maßstab in יָשַׁר בְּעֵינַי
  choice: wem es in meinen Augen recht ist
  alternative: wem ich will
  rationale: 'Die gewählte Fassung erhält die Spannung des Textes: Gottes Entscheidung folgt dem, was in seinen Augen recht ist; sie wird weder zu bloßer Willkür verkürzt noch durch einen äußeren Maßstab erklärt.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich gliedert die lange hebräische Satzfolge, ohne ihren Zusammenhang aufzulösen. Die traditionelle Bildsprache vom ausgestreckten Arm und die Perspektivformel „in meinen Augen“ bleiben erhalten.
