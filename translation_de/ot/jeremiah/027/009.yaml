source:
  edition: WLC
  text: וְ֠/אַתֶּם אַל תִּשְׁמְע֨וּ אֶל נְבִיאֵי/כֶ֜ם וְ/אֶל קֹֽסְמֵי/כֶ֗ם וְ/אֶל֙ חֲלֹמֹ֣תֵי/כֶ֔ם וְ/אֶל עֹֽנְנֵי/כֶ֖ם וְ/אֶל כַּשָּׁפֵי/כֶ֑ם אֲשֶׁר הֵ֞ם אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֥לֶךְ בָּבֶֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/009.yaml
  text: But you[a], do not listen to your prophets, your diviners, your dreamers, your soothsayers, or your sorcerers, who are saying to you, ‘You will not serve the king of Babylon.’
translation:
  language: de
  text: 'Ihr aber hört nicht auf eure Propheten, eure Wahrsager, eure Träumer[a], eure Zeichendeuter und eure Zauberer, die zu euch sagen: »Ihr werdet dem König von Babel nicht dienen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »eure Träume«; in dieser Aufzählung sind wahrscheinlich Menschen gemeint, die sich auf Träume als Offenbarungen berufen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Ihr aber
  rationale: Die Konjunktion mit dem ausdrücklich gesetzten Pronomen markiert einen Kontrast; „Ihr aber“ gibt diesen im Deutschen knapp und natürlich wieder.
- source_word: אַל תִּשְׁמְעוּ אֶל
  choice: hört nicht auf
  rationale: שׁמע mit אֶל bedeutet hier, jemandem Gehör zu schenken beziehungsweise auf ihn zu hören. Die Wendung bewahrt den Sinn der Aufforderung, ohne bereits ausdrücklich „gehorchen“ zu sagen.
- source_word: נְבִיאֵיכֶם
  choice: eure Propheten
  rationale: Die übliche Entsprechung für נביאים; das Possessivsuffix bleibt erhalten und bezeichnet die Propheten, an die sich die Angesprochenen halten.
- source_word: קֹסְמֵיכֶם
  choice: eure Wahrsager
  rationale: קסם bezeichnet mantische beziehungsweise wahrsagerische Praxis. „Wahrsager“ ist im modernen Deutsch verständlicher als das fachsprachlichere „Divinatoren“.
- source_word: חֲלֹמֹתֵיכֶם
  choice: eure Träumer
  rationale: Die Form bedeutet wörtlich „eure Träume“, steht in der Reihe von Personenbezeichnungen jedoch wahrscheinlich metonymisch für Menschen, die sich auf Offenbarungsträume berufen. Die Fußnote bewahrt die formale Alternative.
- source_word: עֹנְנֵיכֶם
  choice: eure Zeichendeuter
  rationale: Das Wort bezeichnet Personen, die Vorzeichen beziehungsweise Omen deuten. „Zeichendeuter“ ist verständlich und legt sich nicht unnötig auf eine einzelne Methode wie Wolkenbeobachtung fest.
- source_word: כַּשָּׁפֵיכֶם
  choice: eure Zauberer
  rationale: כשף bezeichnet magische beziehungsweise zauberische Praxis; „Zauberer“ ist die direkte, geläufige deutsche Personenbezeichnung.
- source_word: אֲשֶׁר הֵם אֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: die zu euch sagen
  rationale: Die Relativkonstruktion führt den Inhalt ihrer fortlaufend verkündeten Botschaft ein. Im Deutschen ist das Präsens natürlicher als eine Verlaufsform.
- source_word: לֹא תַעַבְדוּ
  choice: Ihr werdet … nicht dienen
  rationale: 'Der Imperfekt ist innerhalb der berichteten Rede am besten als Zukunftsaussage zu verstehen: Die Unterwerfung unter Babel werde nicht eintreten. Eine Wiedergabe als Verbot würde die Aussageform verändern.'
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: dem König von Babel
  rationale: עבד mit einer Person als Objekt bezeichnet hier das Dienen beziehungsweise politische Unterworfensein. Wegen des im Deutschen von „dienen“ verlangten Dativs lautet die natürliche Wiedergabe „dem König von Babel“.
theological_decisions:
- issue: Benennung der nicht verlässlichen Offenbarungs- und Magiepraktiker
  choice: Die Bezeichnungen „Propheten, Wahrsager, Träumer, Zeichendeuter und Zauberer“ werden ohne Zusätze wiedergegeben; das Verbot, auf sie zu hören, kennzeichnet ihre Botschaft als unzuverlässig.
  alternative: „falsche Propheten“ oder „sogenannte Propheten“
  rationale: Der hebräische Vers nennt sie schlicht Propheten und entlarvt sie durch Kontext und Verbot. Ein Zusatz wie „falsch“ wäre sachlich naheliegend, stünde hier aber nicht ausdrücklich im Wortlaut.
- issue: Aussage über den Dienst für den König von Babel
  choice: 'Die Rede wird als Vorhersage wiedergegeben: „Ihr werdet … nicht dienen.“'
  alternative: „Dient dem König von Babel nicht.“
  rationale: Im Zusammenhang mit אֹמְרִים לֵאמֹר bezeichnet der Imperfekt die von diesen Personen verbreitete Zukunftsbehauptung, nicht einen eindeutig formulierten Imperativ. So bleibt der Gegensatz zu Jeremias Botschaft erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Babel“ folgt der in deutschen Bibelübersetzungen vertrauten Form des hebräischen Namens. Die Aufzählung bleibt rhythmisch und klar; seltene Fachwörter werden vermieden.
