source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/גּ֜וֹי וְ/הַ/מַּמְלָכָ֗ה אֲשֶׁ֨ר לֹֽא יַעַבְד֤וּ אֹת/וֹ֙ אֶת נְבוּכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/אֵ֨ת אֲשֶׁ֤ר לֹֽא יִתֵּן֙ אֶת צַוָּאר֔/וֹ בְּ/עֹ֖ל מֶ֣לֶךְ בָּבֶ֑ל בַּ/חֶרֶב֩ וּ/בָ/רָעָ֨ב וּ/בַ/דֶּ֜בֶר אֶפְקֹ֨ד עַל הַ/גּ֤וֹי הַ/הוּא֙ נְאֻם יְהוָ֔ה עַד תֻּמִּ֥/י אֹתָ֖/ם בְּ/יָדֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/008.yaml
  text: And it shall be that the nation or the kingdom that will not serve him[a], Nebuchadnezzar king of Babylon, and that will not put its neck under the yoke of the king of Babylon, I will punish that nation with the sword, with famine, and with pestilence, declares Yahweh[c][b], until I have finished them by his hand.
translation:
  language: de
  text: 'Und es wird geschehen: Das Volk oder das Königreich[a], das ihm, Nebukadnezar, dem König von Babel, nicht dienen und seinen Nacken nicht unter das Joch des Königs von Babel beugen wird[b] — dieses Volk werde ich mit dem Schwert, mit Hunger und mit Pest heimsuchen, spricht Jahwe, bis ich ihnen durch seine Hand ein Ende gemacht habe.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Volk und das Königreich«; die beiden politischen Bezeichnungen sind hier als allgemeine Warnung an jedes Gemeinwesen zu verstehen, das sich der babylonischen Herrschaft verweigert.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »seinen Nacken in das Joch geben« — ein Bild für die Unterwerfung unter die Herrschaft Babylons.'
    reason: cultural_note
  - marker: c
    text: 'Das Hebräische hat hier den Plural: »bis ich ihnen durch seine Hand ein Ende gemacht habe«. Gemeint sind kollektiv die Menschen des betreffenden Volkes oder Königreichs; »durch seine Hand« bezeichnet Nebukadnezar als Werkzeug des Gerichts.'
    reason: grammar_and_idiom_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Gibt die einleitende prophetische Zukunftsformel würdig und in modernem Standarddeutsch wieder.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: das Volk oder das Königreich
  rationale: Das hebräische וְ verbindet beide politischen Bezeichnungen formal mit »und«; im Kontext ist die Warnung jedoch distributiv auf jedes entsprechende Gemeinwesen bezogen. »Oder« macht diese Funktion im Deutschen verständlich, während eine Fußnote die Form des Hebräischen festhält.
- source_word: יַעַבְדוּ אֹתוֹ אֶת נְבוּכַדְנֶאצַּר
  choice: ihm, Nebukadnezar, dem König von Babel, nicht dienen
  rationale: עבד bezeichnet hier politische Unterordnung beziehungsweise Vasallendienst. Die Apposition identifiziert das vorausgehende Pronomen ausdrücklich.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Gebräuchliche deutsche Namensform, die der hier vorliegenden hebräischen Schreibung entspricht.
- source_word: יִתֵּן אֶת צַוָּארוֹ בְּעֹל
  choice: seinen Nacken unter das Joch beugen
  rationale: Bewahrt das konkrete Unterwerfungsbild; »beugen« ist im Deutschen natürlicher als eine mechanisch wörtliche Wiedergabe mit »geben«.
- source_word: בַּחֶרֶב וּבָרָעָב וּבַדֶּבֶר
  choice: mit Schwert, Hunger und Pest
  rationale: Bewahrt Jeremias wiederkehrende Gerichtstrias in knapper, würdiger und allgemein verständlicher Sprache.
- source_word: אֶפְקֹד עַל
  choice: heimsuchen
  rationale: פקד על bezeichnet hier strafendes Eingreifen. »Heimsuchen« erhält den prophetischen Gerichtsregisterton, ohne den Sinn zu verunklaren.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche und gewichtige Wiedergabe der prophetischen Botenformel; der Gottesname wird ausdrücklich als »Jahwe« wiedergegeben.
- source_word: עַד תֻּמִּי אֹתָם
  choice: bis ich ihm ein Ende gemacht habe
  rationale: Die Form von תמם bezeichnet das Zu-Ende-Bringen. Die Wiedergabe bewahrt die Härte des Gerichts, ohne die konkrete Art der Vernichtung stärker festzulegen als der hebräische Ausdruck.
- source_word: בְּיָדוֹ
  choice: durch seine Hand
  rationale: Bewahrt das hebräische Bild für die vermittelnde Handlungsmacht Nebukadnezars.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. »Jahwe« gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug und Zahlwechsel in עַד תֻּמִּי אֹתָם
  choice: bis ich ihm … ein Ende gemacht habe
  alternative: bis ich ihnen … ein Ende gemacht habe
  rationale: Das hebräische Objekt אֹתָם ist formal Plural und kann auf die kollektiv gedachten Angehörigen des zuvor singularisch genannten Volkes beziehungsweise Königreichs weisen. Für idiomatisches Deutsch wird das kollektive Gemeinwesen singularisch wiederaufgenommen; die Fußnote legt den hebräischen Zahlwechsel offen.
- issue: Ausmaß des Gerichts in תמם
  choice: ein Ende machen
  alternative: vollständig vernichten / aufreiben
  rationale: Die Formulierung lässt die im Verb liegende Vollendungs- beziehungsweise Beendigungsbedeutung stehen, ohne eine über den Text hinausgehende genaue Vernichtungsweise festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. »Babel« hält die traditionelle biblische Ortsbezeichnung fest. Das Jochbild und die Hand-Metapher bleiben erhalten; erläuterungsbedürftige beziehungsweise grammatisch mehrdeutige Stellen werden nicht stillschweigend geglättet, sondern in den Fußnoten offengelegt.
