source:
  edition: WLC
  text: וְ/עַתָּ֗ה אָֽנֹכִי֙ נָתַ֨תִּי֙ אֶת כָּל הָ/אֲרָצ֣וֹת הָ/אֵ֔לֶּה בְּ/יַ֛ד נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַבְדִּ֑/י וְ/גַם֙ אֶת חַיַּ֣ת הַ/שָּׂדֶ֔ה נָתַ֥תִּי ל֖/וֹ לְ/עָבְדֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/006.yaml
  text: And now I have given all these lands into the hand of Nebuchadnezzar king of Babylon[a], my servant[b]; and I have also given him the beasts of the field to serve him.
translation:
  language: de
  text: Und nun habe ich selbst all diese Länder in die Hand Nebukadnezars[a], des Königs von Babel, meines Dieners[b], gegeben. Auch die Tiere des Feldes habe ich ihm gegeben, damit sie ihm dienen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine andere gebräuchliche Wiedergabe des Königsnamens lautet „Nebukadrezzar“.
    reason: lexical_alternative
  - marker: b
    text: „Mein Diener“ bedeutet hier, dass Gott Nebukadnezar als sein Werkzeug gebraucht; damit wird sein Handeln nicht moralisch gutgeheißen.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Und nun
  rationale: Bewahrt sowohl die verbindende Konjunktion als auch den zeitlichen und folgernden Übergang der göttlichen Erklärung.
- source_word: אָנֹכִי
  choice: ich selbst
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen hebt den göttlichen Sprecher hervor; „ich selbst“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: נָתַתִּי
  choice: habe ... gegeben
  rationale: Das Perfekt bezeichnet hier eine vollzogene Verfügung mit gegenwärtiger Geltung; das deutsche Perfekt ist zugleich natürlich und treffend.
- source_word: כָּל הָאֲרָצוֹת הָאֵלֶּה
  choice: all diese Länder
  rationale: Gemeint sind die zuvor angesprochenen Territorien beziehungsweise Reiche; „Länder“ bewahrt die räumlich-politische Weite ohne moderne Staatlichkeit vorauszusetzen.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Bewahrt das hebräische Bild für die Übergabe in jemandes Gewalt oder Verfügungsbereich und ist im Deutschen verständlich.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Dies ist die im modernen Deutschen geläufige Form des Königsnamens und entspricht der Namensform des vorliegenden hebräischen Textes.
- source_word: מֶלֶךְ בָּבֶל
  choice: König von Babel
  rationale: Gibt die Statusbezeichnung und das Herrschaftsgebiet direkt wieder; „Babel“ ist die geläufige deutsche biblische Namensform.
- source_word: עַבְדִּי
  choice: meines Dieners
  rationale: „Diener“ bezeichnet Nebukadnezar hier als von Gott eingesetztes Werkzeug; „Sklave“ würde den im Kontext nicht vorrangigen sozialen Rechtsstatus betonen.
- source_word: וְגַם
  choice: Auch
  rationale: Die additive Aussage wird in einem neuen deutschen Satz klar und natürlich fortgeführt.
- source_word: חַיַּת הַשָּׂדֶה
  choice: die Tiere des Feldes
  rationale: Die kollektive Wendung wird bildnah wiedergegeben und lässt die mögliche Weite zwischen Feldtieren und wild lebenden Landtieren bestehen.
- source_word: לְעָבְדוֹ
  choice: damit sie ihm dienen
  rationale: Gibt die Zweck- beziehungsweise Ergebnisbedeutung des Infinitivs verständlich wieder; der deutsche Plural richtet sich natürlich nach „Tiere“.
theological_decisions:
- issue: Nebukadnezar als Gottes „Diener“
  choice: meines Dieners
  alternative: meines Sklaven
  rationale: Der Text bezeichnet den heidnischen König ausdrücklich als Gottes Beauftragten beziehungsweise Werkzeug. „Diener“ bewahrt diese theologische Spannung, ohne moralische Billigung zu unterstellen oder einen sozialen Sklavenstatus in den Vordergrund zu rücken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder „in die Hand“ und „Tiere des Feldes“ bleiben erhalten; „ich selbst“ macht die Betonung des ausdrücklich gesetzten Pronomens sichtbar. Die Apposition folgt weitgehend der markanten hebräischen Reihenfolge.
