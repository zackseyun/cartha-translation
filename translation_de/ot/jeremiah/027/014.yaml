source:
  edition: WLC
  text: וְ/אַֽל תִּשְׁמְע֞וּ אֶל דִּבְרֵ֣י הַ/נְּבִאִ֗ים הָ/אֹמְרִ֤ים אֲלֵי/כֶם֙ לֵ/אמֹ֔ר לֹ֥א תַעַבְד֖וּ אֶת מֶ֣לֶךְ בָּבֶ֑ל כִּ֣י שֶׁ֔קֶר הֵ֖ם נִבְּאִ֥ים לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/014.yaml
  text: And do not listen to the words of the prophets who are saying to you[a], ‘You will not serve the king of Babylon,’ for they are prophesying a lie to you.
translation:
  language: de
  text: 'Und hört nicht auf die Worte der Propheten, die zu euch sagen: »Ihr werdet dem König von Babylon nicht dienen.«[a] Denn sie prophezeien euch eine Lüge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dient dem König von Babylon nicht.« Die hebräische Form kann als Verbot verstanden werden; im Zusammenhang ist sie jedoch wahrscheinlich die falsche Vorhersage der Propheten, Juda werde dem König von Babylon nicht dienen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַל תִּשְׁמְעוּ
  choice: Und hört nicht auf
  rationale: וְ verbindet die Mahnung mit dem vorangehenden Zusammenhang; אַל mit dem Imperfekt formuliert ein Verbot. „Auf jemanden hören“ gibt hier nicht nur das Hören, sondern das vertrauende Beachten natürlich wieder.
- source_word: אֶל דִּבְרֵי הַנְּבִאִים
  choice: auf die Worte der Propheten
  rationale: Die konkrete Redeweise „Worte“ bleibt erhalten; der bestimmte Artikel bezeichnet die im Zusammenhang bekannte Prophetengruppe.
- source_word: הָאֹמְרִים אֲלֵיכֶם לֵאמֹר
  choice: die zu euch sagen
  rationale: Das Partizip bezeichnet ihre fortdauernde oder wiederholte Aussage. Im Deutschen ist die präsentische Relativkonstruktion natürlich und ausreichend.
- source_word: לֹא תַעַבְדוּ
  choice: Ihr werdet … nicht dienen
  rationale: עבד bezeichnet gegenüber einem König dienen beziehungsweise untertan sein. Im Kontext ist die mehrdeutige Imperfektform am ehesten eine falsche Vorhersage; die mögliche prohibitive Lesart wird in der Fußnote bewahrt.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: dem König von Babylon
  rationale: Beim deutschen Verb „dienen“ steht die Person im Dativ; „König von Babylon“ gibt die hebräische Status-constructus-Verbindung klar wieder.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion leitet die Begründung für die vorausgehende Warnung ein.
- source_word: שֶׁקֶר הֵם נִבְּאִים לָכֶם
  choice: sie prophezeien euch Lüge
  rationale: Die knappe Formulierung bewahrt שׁקר als singularisches Nomen und die an die Adressaten gerichtete prophetische Tätigkeit. „Lüge prophezeien“ ist würdevoll und verständlich, ohne zu „falsch prophezeien“ zu verflachen.
theological_decisions:
- issue: Art der falschen prophetischen Botschaft
  choice: 'Die Aussage wird als Vorhersage wiedergegeben: „Ihr werdet dem König von Babylon nicht dienen.“'
  alternative: „Dient dem König von Babylon nicht.“
  rationale: Im Zusammenhang warnen die Propheten vorgeblich nicht bloß vor Gehorsam, sondern bestreiten die kommende beziehungsweise fortdauernde babylonische Herrschaft. Dennoch kann die hebräische Form לֹא mit Imperfekt formal auch prohibitiv verstanden werden; deshalb bleibt diese Spannung durch eine Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf die Worte … hören“ ist idiomatisch und bewahrt den Gedanken des aufmerksamen Beachtens. Die direkte Rede wird klar markiert; die echte grammatische Mehrdeutigkeit wird nicht im Haupttext überladen, sondern in Fußnote [a] dokumentiert.
