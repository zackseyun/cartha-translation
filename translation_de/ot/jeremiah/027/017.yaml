source:
  edition: WLC
  text: אַל תִּשְׁמְע֣וּ אֲלֵי/הֶ֔ם עִבְד֥וּ אֶת מֶֽלֶךְ בָּבֶ֖ל וִֽ/חְי֑וּ לָ֧/מָּה תִֽהְיֶ֛ה הָ/עִ֥יר הַ/זֹּ֖את חָרְבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/027/017.yaml
  text: Do not listen to them[a]. Serve the king of Babylon and live[b]. Why should this city become a ruin?
translation:
  language: de
  text: Hört nicht auf sie[a]! Dient dem König von Babylon und bleibt am Leben! Warum sollte diese Stadt zu einer Ruine[b] werden?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gehorcht ihnen nicht.“ Das hebräische Verb kann sowohl das Hören als auch das Befolgen des Gehörten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „verwüstet werden“. Das hebräische Substantiv bezeichnet einen Zustand oder Ort der Zerstörung und Verwüstung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁמְעוּ אֲלֵיהֶם
  choice: Hört nicht auf sie
  rationale: שׁמע mit אֶל bedeutet hier, auf jemanden zu hören und seiner Botschaft Folge zu leisten. Die deutsche Wendung ist natürlich und bewahrt beide Bedeutungsaspekte.
- source_word: עִבְדוּ
  choice: Dient
  rationale: Das Verb bezeichnet hier den politisch verstandenen Dienst beziehungsweise die Unterordnung unter den babylonischen König. „Dient“ gibt die knappe Aufforderung breit genug wieder.
- source_word: אֶת מֶלֶךְ בָּבֶל
  choice: dem König von Babylon
  rationale: Die deutsche Dativkonstruktion wird vom Verb „dienen“ verlangt und gibt die hebräische Wortgruppe transparent wieder.
- source_word: וִחְיוּ
  choice: und bleibt am Leben
  rationale: 'Die mit וְ verbundene Aufforderung hat zugleich eine folgerichtige Nuance: Wer dem König dient, wird leben. „Bleibt am Leben“ drückt im Deutschen das hier gemeinte Überleben natürlicher aus als das bloße „lebt“.'
- source_word: לָמָּה תִהְיֶה
  choice: Warum sollte … werden?
  rationale: Die Formulierung gibt die rhetorische Frage und den Blick auf ein drohendes zukünftiges Ergebnis idiomatisch wieder.
- source_word: הָעִיר הַזֹּאת
  choice: diese Stadt
  rationale: Dies ist die natürliche Wiedergabe der hebräischen Verbindung aus Substantiv und Demonstrativpronomen.
- source_word: חָרְבָּה
  choice: Trümmerstätte
  rationale: Das Substantiv bezeichnet einen verwüsteten, zerstörten Ort. „Trümmerstätte“ bewahrt den nominalen Charakter und bezeichnet anschaulich den Zustand völliger Zerstörung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper prophetischer Eindringlichkeit. Die Imperative bleiben direkt; „bleibt am Leben“ macht den auf das Überleben gerichteten Sinn natürlich verständlich. Der zweite Fußnotenmarker steht bei dem Ausdruck, auf den sich die lexikalische Alternative tatsächlich bezieht.
