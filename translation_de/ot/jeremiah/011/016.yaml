revisions:
- from: Einen üppig grünen Olivenbaum, schön mit prächtiger Frucht, hatte der HERR dich genannt. Unter dem Lärm eines gewaltigen Getöses legte er Feuer an ihn, und seine Äste wurden vernichtet.
  to: Einen üppig grünen Olivenbaum, schön an Frucht und Gestalt, nannte der HERR dich. Beim Klang eines gewaltigen Getöses legte er Feuer an ihn, und seine Zweige gingen zugrunde.
  rationale: Die Revision ergänzt „Gestalt“ für תֹּאַר, präzisiert die akustisch-zeitliche Wendung לְקוֹל und mildert die unnötig absolute Formulierung „vernichtet“. Die Mehrdeutigkeit des Getöses sowie die Bildsprache und der Bezug des Pronomens auf den Olivenbaum bleiben erhalten.
