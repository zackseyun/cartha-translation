source:
  edition: WLC
  text: זַ֤יִת רַֽעֲנָן֙ יְפֵ֣ה פְרִי תֹ֔אַר קָרָ֥א יְהוָ֖ה שְׁמֵ֑/ךְ לְ/ק֣וֹל הֲמוּלָּ֣ה גְדֹלָ֗ה הִצִּ֥ית אֵשׁ֙ עָלֶ֔י/הָ וְ/רָע֖וּ דָּלִיּוֹתָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/016.yaml
  text: The LORD called your name, ‘A green olive tree, beautiful with good fruit.’ At the sound of a great roar he set fire to it, and its branches are ruined.
translation:
  language: de
  text: Einen üppig grünen Olivenbaum, schön an Frucht und Gestalt, nannte der HERR dich. Beim Klang eines gewaltigen Getöses legte er Feuer an ihn, und seine Zweige gingen zugrunde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זַיִת רַעֲנָן
  choice: einen üppig grünen Olivenbaum
  rationale: רַעֲנָן bezeichnet frisches, kräftiges Grün und üppiges Gedeihen; die Formulierung bewahrt das lebendige Baumbild.
- source_word: יְפֵה פְרִי תֹאַר
  choice: schön mit prächtiger Frucht
  rationale: Die ungewöhnliche Wortfolge verbindet Schönheit, Frucht und Erscheinung. Diese Wiedergabe ist natürlich, ohne die hebräische Konstruktion zu stark festzulegen.
- source_word: קָרָא יְהוָה שְׁמֵךְ
  choice: hatte der HERR dich genannt
  rationale: Das Idiom bedeutet, jemandem einen Namen bzw. eine Bezeichnung zu geben. Das Plusquamperfekt macht im Deutschen den Kontrast zur anschließenden Zerstörung klar.
- source_word: לְקוֹל הֲמוּלָּה גְדֹלָה
  choice: unter dem Lärm eines gewaltigen Getöses
  rationale: הֲמוּלָּה kann Getöse, Tumult oder das Brausen einer Menge bezeichnen. Die Übersetzung erhält das laute, überwältigende Klangbild und lässt dessen genaue Ursache offen.
- source_word: הִצִּית אֵשׁ עָלֶיהָ
  choice: legte er Feuer an ihn
  rationale: Das Verb bezeichnet das Entzünden; das deutsche Pronomen richtet sich natürlich nach dem maskulinen »Olivenbaum«, obwohl das Hebräische auf das feminine זַיִת zurückverweist.
- source_word: וְרָעוּ דָּלִיּוֹתָיו
  choice: und seine Äste wurden vernichtet
  rationale: Das seltene Verb רָעַע kann hier das Zerbrechen bzw. Verderben der Äste ausdrücken. »wurden vernichtet« gibt das Ergebnis wieder, ohne eine konkrete mechanische Einzelhandlung zu behaupten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen ist allgemein verständlich und kennzeichnet den Gottesnamen, ohne eine unsichere Aussprache festzulegen.
- issue: Handelnder beim Entzünden des Feuers
  choice: er
  alternative: unpersönliche oder passive Wiedergabe
  rationale: Das hebräische Verb steht im maskulinen Singular und verweist im unmittelbaren Zusammenhang am ehesten auf den HERRN. Die Übersetzung bewahrt diese grammatische Aussage und damit die Spannung des göttlichen Gerichts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bildhafter, aber gut verständlicher Sprache. Die Metapher des Olivenbaums und der abrupte Übergang von Schönheit zu Gericht bleiben erhalten.
