id: JER.11.12
reference: Jeremiah 11:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָֽלְכ֞וּ עָרֵ֣י יְהוּדָ֗ה וְ/יֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם וְ/זָֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֛ר הֵ֥ם מְקַטְּרִ֖ים לָ/הֶ֑ם וְ/הוֹשֵׁ֛עַ לֹֽא יוֹשִׁ֥יעוּ לָ/הֶ֖ם בְּ/עֵ֥ת רָעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/012.yaml
  text: Then the cities of Judah and the inhabitants of Jerusalem will go and cry out to the gods to whom they burn incense[a], but they will certainly not save them in the time of their trouble.
translation:
  language: de
  text: Dann werden die Städte Judas und die Bewohner Jerusalems hingehen und zu den Göttern um Hilfe schreien, denen sie Räucheropfer darbringen. Doch diese Götter werden sie in der Zeit ihres Unglücks[a] ganz gewiss nicht retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Zeit ihres Unheils“ oder „in der Zeit ihrer Not“.'
    reason: Lexikalische Alternativen für רָעָה, das hier erfahrenes Unheil beziehungsweise Bedrängnis bezeichnet.
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: Dann werden … hingehen
  rationale: Das Qal-Perfekt mit vorangestelltem Waw führt im prophetischen Zusammenhang die zukünftige Handlungsfolge weiter. „Dann“ gibt den Folgezusammenhang natürlich wieder.
- source_word: עָרֵי יְהוּדָה
  choice: die Städte Judas
  rationale: Die hebräische Status-constructus-Verbindung wird im Deutschen knapp und idiomatisch mit dem Genitiv wiedergegeben.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: und die Bewohner Jerusalems
  rationale: Das substantivisch gebrauchte Partizip bezeichnet kollektiv die dort ansässige Bevölkerung.
- source_word: וְזָעֲקוּ אֶל
  choice: und … um Hilfe schreien
  rationale: זעק bezeichnet hier einen verzweifelten Hilferuf. Die Ergänzung „um Hilfe“ verdeutlicht die im Verb enthaltene Notsituation, ohne den Sinn zu erweitern.
- source_word: הָאֱלֹהִים
  choice: die Götter
  rationale: Der Kontext und der pluralische Rückbezug zeigen, dass die verehrten fremden Gottheiten gemeint sind.
- source_word: אֲשֶׁר הֵם מְקַטְּרִים לָהֶם
  choice: denen sie Räucheropfer darbringen
  rationale: קטר bezeichnet in diesem kultischen Zusammenhang das Verbrennen beziehungsweise Darbringen von Räucherwerk. „Räucheropfer darbringen“ ist im Deutschen klar und würdevoll.
- source_word: וְהוֹשֵׁעַ לֹא יוֹשִׁיעוּ לָהֶם
  choice: Doch diese Götter werden sie … ganz gewiss nicht retten
  rationale: Infinitivus absolutus und finite Verbform von ישׁע verstärken zusammen die Verneinung. „Ganz gewiss nicht“ bewahrt diese emphatische Aussage; „diese Götter“ macht die sonst schwer verständliche Folge mehrerer Pronomen transparent.
- source_word: בְּעֵת רָעָתָם
  choice: in der Zeit ihres Unglücks
  rationale: רָעָה bezeichnet hier das erlittene Unheil, das ihren Hilferuf auslöst, nicht moralische Bosheit.
theological_decisions:
- issue: Bezug von אֱלֹהִים
  choice: die von Juda und Jerusalem verehrten Götter
  alternative: Gott beziehungsweise eine einzelne Gottheit
  rationale: Der Relativsatz über das Darbringen von Räucheropfern, der pluralische Rückbezug und der weitere Kontext der Götzenkritik sprechen eindeutig für mehrere fremde Gottheiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die hebräische Emphase wird bewahrt, während die Pronomenbezüge zur besseren Verständlichkeit ausdrücklich gemacht werden.
