  variant: modern standard German
source:
  edition: WLC
  text: וַ/יהוָ֤ה צְבָאוֹת֙ הַ/נּוֹטֵ֣עַ אוֹתָ֔/ךְ דִּבֶּ֥ר עָלַ֖יִ/ךְ רָעָ֑ה בִּ֠/גְלַל רָעַ֨ת בֵּֽית יִשְׂרָאֵ֜ל וּ/בֵ֣ית יְהוּדָ֗ה אֲשֶׁ֨ר עָשׂ֥וּ לָ/הֶ֛ם לְ/הַכְעִסֵ֖/נִי לְ/קַטֵּ֥ר לַ/בָּֽעַל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/017.yaml
  text: And Yahweh of Armies[a], who planted you, has spoken disaster against you because of the evil of the house of Israel and the house of Judah, which they have done to themselves, provoking me to anger by making offerings to Baal.
translation:
  language: de
  text: Und Jahwe der Heerscharen, der dich gepflanzt hat, hat Unheil über dich angekündigt wegen der Bosheit des Hauses Israel und des Hauses Juda, die sie für sich selbst verübt haben, um mich durch Räucheropfer für den Baal zum Zorn zu reizen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „indem sie für den Baal Rauch aufsteigen ließen“. Das hebräische Verb bezeichnet das Erzeugen von Rauch bei einer kultischen Opferhandlung, häufig besonders das Verbrennen von Räucherwerk.'
    reason: Lexikalische Präzisierung des kultischen Verbs קטר; die Formulierung wahrt, dass der Begriff Rauchopfer beziehungsweise Räucherwerk bezeichnen kann.
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt den Titel und dessen Vorstellung von Streitkräften beziehungsweise großen Scharen unter Gottes Befehl.
- source_word: הַנּוֹטֵעַ אוֹתָךְ
  choice: der dich gepflanzt hat
  rationale: Die Formulierung bewahrt das Pflanzbild und nimmt die Bildsprache vom Ölbaum aus dem unmittelbaren Zusammenhang auf.
- source_word: דִּבֶּר עָלַיִךְ רָעָה
  choice: hat Unheil über dich angekündigt
  rationale: רָעָה bezeichnet hier angekündigtes Gericht beziehungsweise Unheil, nicht moralische Bosheit; „angekündigt“ gibt den Sprechakt idiomatisch wieder.
- source_word: רָעַת בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: die Bosheit des Hauses Israel und des Hauses Juda
  rationale: Hier bezeichnet dasselbe hebräische Wortfeld moralische Bosheit. „Haus“ bewahrt den gemeinschaftlichen und familiären Ausdruck.
- source_word: אֲשֶׁר עָשׂוּ לָהֶם
  choice: die sie für sich selbst begingen
  rationale: Die ungewöhnliche Wendung mit לָהֶם wird ausdrücklich bewahrt, ohne eindeutig festzulegen, ob Eigennutz, eigene Verantwortlichkeit oder eine selbstschädigende Folge gemeint ist.
- source_word: לְהַכְעִסֵנִי
  choice: Sie reizten mich zum Zorn
  rationale: Die Hifilform bezeichnet das Hervorrufen von Zorn. Ein neuer Hauptsatz macht den Zusammenhang im Deutschen klar, ohne den Sinn zu verändern.
- source_word: לְקַטֵּר לַבָּעַל
  choice: indem sie dem Baal Räucheropfer darbrachten
  rationale: Das Verb bezeichnet kultisches Rauchaufsteigenlassen und häufig speziell das Verbrennen von Räucherwerk; „Räucheropfer darbringen“ ist im Deutschen präzise und verständlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens und des Titels יהוה צבאות
  choice: Jahwe der Heerscharen
  alternative: der HERR der Heerscharen; Jahwe der Heere
  rationale: Die gewählte Fassung unterscheidet den Eigennamen vom Titel und vermeidet, den militärischen beziehungsweise kosmischen Umfang des Titels einzuengen.
- issue: Die zwei Bedeutungen von רעה im selben Vers
  choice: zuerst „Unheil“, danach „Bosheit“
  alternative: beide Male „Böses“
  rationale: 'Die kontextuell unterschiedlichen Bedeutungen werden kenntlich gemacht: Jahwe kündigt Unheil als Gericht an, während Israel und Juda moralische Bosheit begehen. So bleibt das Wortspiel im Bedeutungsfeld erkennbar, ohne Gott moralische Bosheit zuzuschreiben.'
- issue: Bedeutung von לָהֶם in אֲשֶׁר עָשׂוּ לָהֶם
  choice: „für sich selbst“ ausdrücklich beibehalten
  alternative: im Deutschen auslassen oder als „zu ihrem eigenen Schaden“ deuten
  rationale: Der hebräische Ausdruck ist mehrdeutig. Die Übersetzung bewahrt diese Spannung und legt nicht fest, ob Eigennutz oder selbstschädigende Wirkung im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das traditionelle „Heerscharen“ bleibt wegen seines Titelcharakters erhalten; weniger geläufige kultische Bildsprache wird in der Fußnote erläutert. Der Doppelpunkt gliedert den langen hebräischen Satz lesefreundlich.
