source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָר֣וּר הָ/אִ֔ישׁ אֲשֶׁר֙ לֹ֣א יִשְׁמַ֔ע אֶת דִּבְרֵ֖י הַ/בְּרִ֥ית הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/003.yaml
  text: 'And you shall say to them, ‘Thus says the LORD, the God of Israel: Cursed is the man who does not listen to the words of this covenant,’'
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »So spricht der HERR, der Gott Israels: Verflucht ist der Mensch, der nicht auf die Worte dieses Bundes hört.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens wahrt den vertrauten biblischen Sprachgebrauch; die Großschreibung kennzeichnet den zugrunde liegenden Eigennamen.
- source_word: הָאִישׁ
  choice: der Mensch
  rationale: אִישׁ bezeichnet hier allgemein die einzelne Person, nicht ausschließlich einen männlichen Erwachsenen.
- source_word: לֹא יִשְׁמַע
  choice: nicht ... hört
  rationale: שׁמע bedeutet zunächst »hören«, kann im Bundeskontext aber auch gehorsames Hören einschließen. Die Wiedergabe mit »hört« bewahrt diese Bedeutungsweite, ohne sie auf »gehorcht« zu verengen.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: die Worte dieses Bundes
  rationale: Die formnahe Wiedergabe erhält die konkrete Rede von den Bundesworten beziehungsweise Bundesbestimmungen.
theological_decisions:
- issue: Bedeutungsumfang von שׁמע im Bundeskontext
  choice: hört
  alternative: gehorcht
  rationale: Der hebräische Ausdruck verbindet Hören und entsprechende Beachtung. »Hört« lässt diese theologische Spannung bestehen, während »gehorcht« die Bedeutung explizit festlegt.
translation_notes:
  register: Moderne, würdige Standardsprache mit traditioneller Gottesnamenwiedergabe. Der feierliche Botenformelsatz »So spricht der HERR« bleibt erhalten; die direkte Rede ist klar und natürlich gegliedert.
