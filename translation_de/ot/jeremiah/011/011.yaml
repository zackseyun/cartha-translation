id: JER.11.11
reference: Jeremiah 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֤יא אֲלֵי/הֶם֙ רָעָ֔ה אֲשֶׁ֥ר לֹֽא יוּכְל֖וּ לָ/צֵ֣את מִמֶּ֑/נָּה וְ/זָעֲק֣וּ אֵלַ֔/י וְ/לֹ֥א אֶשְׁמַ֖ע אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/011.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am bringing on them a disaster from which they will not be able to escape; and they will cry out to me, but I will not listen to them.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: Siehe, ich bringe Unheil[a] über sie, dem sie nicht entkommen können. Sie werden zu mir um Hilfe schreien, aber ich werde nicht auf sie hören.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Unglück«. Das hebräische Wort bezeichnet hier zerstörerisches Gericht, nicht moralisch Böses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Ankündigung als Folge der vorausgehenden Anklage und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die feierliche prophetische Botenformel und gibt den Gottesnamen als persönlichen Namen wieder.
- source_word: הִנְנִי
  choice: Siehe
  rationale: Erhält die eindringliche Aufmerksamkeitspartikel und den gehobenen prophetischen Ton.
- source_word: מֵבִיא אֲלֵיהֶם רָעָה
  choice: ich bringe Unheil über sie
  rationale: Die präsentische Form gibt die durch הִנְנִי ausgedrückte unmittelbar bevorstehende und gewisse Handlung wieder; „Unheil“ bezeichnet hier vernichtendes Gericht, nicht sittlich Böses.
- source_word: אֲשֶׁר לֹא יוּכְלוּ לָצֵאת מִמֶּנָּה
  choice: dem sie nicht entkommen können
  rationale: Gibt die hebräische Wendung „aus ihm hinausgehen“ idiomatisch als Unmöglichkeit der Rettung aus dem angekündigten Unheil wieder.
- source_word: וְזָעֲקוּ אֵלַי
  choice: Sie werden zu mir um Hilfe schreien
  rationale: זעק bezeichnet einen dringlichen Hilferuf aus Bedrängnis; „um Hilfe schreien“ macht diese Intensität ausdrücklich und natürlich verständlich.
- source_word: וְלֹא אֶשְׁמַע אֲלֵיהֶם
  choice: aber ich werde nicht auf sie hören
  rationale: „Auf jemanden hören“ vermittelt hier nicht bloß akustisches Hören, sondern die verweigerte Beachtung und Erhörung; „aber“ macht den sachlichen Gegensatz deutlich.
theological_decisions:
- issue: Bedeutung von רָעָה im Zusammenhang des göttlichen Gerichts
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im Kontext bezeichnet רָעָה die als Bundesgericht angekündigte zerstörerische Not. „Unheil“ wahrt den Gerichtssinn, ohne die Aussage fälschlich als Zuschreibung moralisch bösen Handelns an Gott aufzulösen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text verwendet den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn im Deutschen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem prophetischem Ernst. Die traditionelle Formel „so spricht Jahwe“ und das Aufmerksamkeitssignal „Siehe“ bleiben erhalten; die übrigen Wendungen sind idiomatisch und allgemein verständlich.
