id: JER.11.23
reference: Jeremiah 11:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/שְׁאֵרִ֕ית לֹ֥א תִֽהְיֶ֖ה לָ/הֶ֑ם כִּֽי אָבִ֥יא רָעָ֛ה אֶל אַנְשֵׁ֥י עֲנָת֖וֹת שְׁנַ֥ת פְּקֻדָּתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/023.yaml
  text: And no remnant will remain for them[a], for I will bring disaster on the men of Anathoth in the year of their punishment.
translation:
  language: de
  text: Und kein Rest wird ihnen bleiben; denn ich werde Unheil über die Männer von Anatot bringen im Jahr ihrer Bestrafung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Jahr ihrer Heimsuchung“. Das hebräische Wort kann allgemein ein Einschreiten oder eine Heimsuchung bezeichnen; hier ist eine strafende Heimsuchung gemeint.'
    reason: Lexikalische Alternative zu פְּקֻדָּה; die mögliche weitere Bedeutung soll sichtbar bleiben.
lexical_decisions:
- source_word: וּשְׁאֵרִית
  choice: Und kein Rest
  rationale: שְׁאֵרִית bezeichnet das, was übrig bleibt, also einen Rest oder Überrest. „Rest“ bewahrt die substantivische Form und ist im heutigen Deutsch verständlich.
- source_word: לֹא תִהְיֶה לָהֶם
  choice: wird ihnen bleiben
  rationale: Wörtlich lautet die Wendung „wird ihnen nicht sein“. Zusammen mit שְׁאֵרִית gibt „wird ihnen bleiben“ den Sinn natürlich wieder, ohne das Substantiv in „Überlebende“ umzudeuten.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung für die vorausgehende Gerichtsankündigung ein.
- source_word: אָבִיא
  choice: ich werde … bringen
  rationale: Der Hifil von בוא bedeutet hier „kommen lassen, bringen“; die Zukunftsform passt zur angekündigten Handlung.
- source_word: רָעָה
  choice: Unheil
  rationale: Im Zusammenhang des göttlichen Gerichts bezeichnet רָעָה eine verderbliche Not oder Katastrophe, nicht moralische Bosheit. „Unheil“ ist knapp, würdevoll und kontextgerecht.
- source_word: אֶל אַנְשֵׁי עֲנָתוֹת
  choice: über die Männer von Anatot
  rationale: אַנְשֵׁי bedeutet ausdrücklich „Männer von“. „Unheil über jemanden bringen“ gibt die Verbindung mit אֶל im Deutschen idiomatisch wieder.
- source_word: שְׁנַת פְּקֻדָּתָם
  choice: im Jahr ihrer Bestrafung
  rationale: פְּקֻדָּה kann eine Heimsuchung, ein Einschreiten oder eine Bestrafung bezeichnen. Der Gerichtskontext stützt „Bestrafung“; „Jahr“ wahrt die konkrete Zeitangabe von שְׁנַת.
theological_decisions:
- issue: Bedeutung von רָעָה, wenn Gott das Unheil bringt
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Der Vers spricht von einer als Gericht eintretenden Katastrophe. „Unheil“ vermittelt dies, ohne die Aussage unnötig als moralisches Böses zu deuten.
- issue: Bezugsgruppe von אַנְשֵׁי עֲנָתוֹת
  choice: die Männer von Anatot
  alternative: die Leute von Anatot; die Bewohner von Anatot
  rationale: Die hebräische Form ist maskulin und bezeichnet „Männer“. Der nähere Zusammenhang spricht von den Männern aus Jeremias Heimatort, die gegen ihn vorgehen; eine Verallgemeinerung zu allen Bewohnern wäre daher nicht erforderlich.
- issue: Gerichtlicher Sinn von פְּקֻדָּה
  choice: Bestrafung
  alternative: Heimsuchung
  rationale: Der Ausdruck besitzt eine gewisse lexikalische Spannweite. Im vorliegenden Gerichtswort ist die Heimsuchung strafend; die Hauptübersetzung macht diesen Kontext deutlich, während die Fußnote die formal nähere Alternative erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der hebräischen Gerichtsankündigung, wird aber durch das Semikolon übersichtlich gegliedert. Der Ortsname wird in der im Deutschen üblichen Form „Anatot“ wiedergegeben.
