  variant: modern standard German
source:
  edition: WLC
  text: שִׁמְע֕וּ אֶת דִּבְרֵ֖י הַ/בְּרִ֣ית הַ/זֹּ֑את וְ/דִבַּרְתָּ/ם֙ אֶל אִ֣ישׁ יְהוּדָ֔ה וְ/עַל יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/002.yaml
  text: Hear the words of this covenant[a], and speak them to the men of Judah and to the inhabitants of Jerusalem.
translation:
  language: de
  text: Hört die Worte dieses Bundes und redet zu den Männern Judas[a] und zu den Einwohnern Jerusalems.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu jedem Mann Judas“; die Einzahl ist kollektiv beziehungsweise distributiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört auf
  rationale: Der Qal-Imperativ Plural fordert zu aufmerksamem Hören auf. „Hört auf“ klingt im modernen Deutsch natürlich und bewahrt die mögliche Bundesnuance, ohne bereits eindeutig mit „gehorcht“ zu übersetzen.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: die Worte dieses Bundes
  rationale: Die konstruktive Verbindung wird direkt und idiomatisch wiedergegeben; „Bund“ ist hier die sachlich und theologisch angemessene Entsprechung für בְּרִית.
- source_word: וְדִבַּרְתָּם
  choice: und richtet sie
  rationale: Die Piel-Form mit Objektsuffix nimmt die „Worte“ wieder auf. Deutsch „Worte an jemanden richten“ gibt den Sprechakt samt Objekt und Adressaten natürlich wieder.
- source_word: אֶל אִישׁ יְהוּדָה
  choice: an die Männer von Juda
  rationale: אִישׁ steht im Singular kollektiv beziehungsweise distributiv. Die Formulierung erhält den männlichen Ausdruck des Hebräischen und ist im Deutschen verständlich.
- source_word: וְעַל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: und an die Einwohner Jerusalems
  rationale: עַל bezeichnet hier parallel zu אֶל die Angesprochenen; das substantivierte Partizip wird knapp und natürlich mit „Einwohner“ wiedergegeben.
theological_decisions:
- issue: Kollektiver beziehungsweise distributiver Gebrauch von אִישׁ יְהוּדָה
  choice: die Männer von Juda
  alternative: jeden Mann von Juda; die Menschen von Juda
  rationale: Der Haupttext bewahrt die grammatisch männliche Bezeichnung, während die Fußnote den distributiven Sinn sichtbar macht. „Menschen von Juda“ wäre inklusiver, würde aber die konkrete Quellform glätten.
- issue: Bedeutungsumfang von שׁמע im Bundeskontext
  choice: Hört auf
  alternative: Gehorcht
  rationale: Das Verb kann auf gehorsames Hören zielen, doch „gehorcht“ würde die im Hebräischen vorhandene Spannung zwischen Hören, Beachten und Gehorchen vorschnell festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Plural „Hört“ folgt dem hebräischen Imperativ; der anschließende Auftrag ist im Hebräischen singularisch an den angesprochenen Boten gerichtet, was im Deutschen durch „richtet“ formal nicht eigens markiert wird.
