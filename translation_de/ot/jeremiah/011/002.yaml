revisions:
- from: Hört auf die Worte dieses Bundes und richtet sie an die Männer von Juda[a] und an die Einwohner Jerusalems.
  to: Hört die Worte dieses Bundes und redet zu den Männern Judas[a] und zu den Einwohnern Jerusalems.
  rationale: Die Revision stellt die direkte Objektbeziehung von „die Worte“ zu „hört“ wieder her, gibt וְדִבַּרְתֶּם ohne hinzugefügtes Objekt als pluralisches „redet“ wieder und bewahrt die parallele Anrede der beiden Adressatengruppen. Die Fußnote erläutert die distributive Einzahl von אִישׁ, ohne den Haupttext unnötig zu verengen oder zu glätten.
