review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von בְּרִית als „Bund“ ist zutreffend. Der Entwurf macht jedoch aus וְדִבַּרְתֶּם/„und redet“ durch „richtet sie“ ein ausdrücklich pronominales Objekt, das im maßgeblichen hebräischen Vers nicht ausgedrückt ist. Zudem folgt auf den Pluralimperativ שִׁמְעוּ auch ein Plural „redet“; „richtet“ ist zwar ebenfalls Plural, die Übersetzungsbegründung und Notiz zur angeblich singularischen Botenanrede sind aber grammatisch unzutreffend. Die direkte Konstruktion „Hört die Worte“ ist quellentreuer als „Hört auf die Worte“, das stärker zu „beachtet“ tendieren kann.
  naturalness: „Hört die Worte dieses Bundes und redet zu den Männern Judas und zu den Einwohnern Jerusalems“ ist modernes, würdiges Standarddeutsch und bildet die parallelen Adressatenangaben klar ab. „Männer Judas“ ist im biblischen Register idiomatischer und knapper als „Männer von Juda“.
  terminology: „Bund“ ist für בְּרִית beizubehalten. „Männer Judas“ wahrt die männliche, kollektiv/distributiv verwendete Form אִישׁ; die Fußnote erläutert, dass nicht zwingend nur einzelne erwachsene Männer im modernen, engen Sinn gemeint sind. Die Orts- und Volksbezeichnung „Juda“ sowie „Jerusalem“ sind korrekt.
  issues:
  - severity: medium
    issue: Zusätzliches Objekt „sie“ bei „richtet sie“
    rationale: Der hebräische Text lautet hier in der üblichen masoretischen Vokalisierung וְדִבַּרְתֶּם, „und redet/sprecht“, ohne pronominales Objekt. Die Worte des Bundes sind semantisch der Gegenstand der Verkündigung, aber das Deutsche sollte kein im Ausgangstext nicht markiertes Objekt ergänzen.
  - severity: medium
    issue: Unzutreffende grammatische Notiz zur Singularanrede
    rationale: Die Übersetzungsnotiz behauptet, der zweite Auftrag sei singularisch an einen Boten gerichtet. In Jeremia 11,2 steht nach שִׁמְעוּ ebenfalls die Pluralform וְדִבַּרְתֶּם. Diese Behauptung muss entfallen.
  - severity: low
    issue: „Hört auf die Worte“
    rationale: Die Präposition ist im Deutschen möglich, kann aber „achtet auf/beachtet“ stärker nahelegen. Das direkte Objekt in „Hört die Worte“ entspricht אֶת und bleibt näher an der offenen Bedeutung von שׁמע.
  revised_text: Hört die Worte dieses Bundes und redet zu den Männern Judas[a] und zu den Einwohnern Jerusalems.
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „zu jedem Mann Judas“; die Einzahl ist kollektiv beziehungsweise distributiv gebraucht.'
    reason: lexical_alternative
