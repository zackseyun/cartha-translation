  text: אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבֽוֹתֵי/כֶ֡ם בְּ/י֣וֹם הוֹצִיאִֽ/י אוֹתָ֣/ם מֵ/אֶֽרֶץ מִצְרַיִם֩ מִ/כּ֨וּר הַ/בַּרְזֶ֜ל לֵ/אמֹ֗ר שִׁמְע֤וּ בְ/קוֹלִ/י֙ וַ/עֲשִׂיתֶ֣ם אוֹתָ֔/ם כְּ/כֹ֥ל אֲשֶׁר אֲצַוֶּ֖ה אֶתְ/כֶ֑ם וִ/הְיִ֤יתֶם לִ/י֙ לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/004.yaml
  text: which I commanded your fathers on the day I brought them out from the land of Egypt[a], from the iron furnace, saying, ‘Listen to my voice and do them, according to all that I command you; and you shall be my people[c][b], and I will be your God,’
translation:
  language: de
  text: 'den ich euren Vätern[a] an dem Tag gebot, als ich sie aus dem Land Ägypten, aus dem Eisenofen[b], herausführte, mit den Worten: »Hört auf meine Stimme[c] und tut alles, was ich euch gebiete. Und ihr werdet mein Volk sein, und ich werde euer Gott sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euren Vorfahren«. Wörtlich steht im Hebräischen »euren Vätern«.'
    reason: lexical_alternative
  - marker: b
    text: Der »Eisenofen« ist ein Bild für Ägypten als Ort harter Unterdrückung und Bedrängnis.
    reason: cultural_note
  - marker: c
    text: Die Wendung »auf meine Stimme hören« kann auch mit »meiner Stimme gehorchen« wiedergegeben werden; das hebräische Hören schließt hier gehorsames Handeln ein.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבוֹתֵיכֶם
  choice: den ich euren Vätern … gebot
  rationale: Der Relativsatz bezieht sich auf den zuvor genannten Bund. „Gebot“ bewahrt die verbindliche Autorität von צוה; das direkte Personenobjekt des Hebräischen wird im Deutschen idiomatisch als Dativ wiedergegeben.
- source_word: בְּיוֹם הוֹצִיאִי אוֹתָם
  choice: an dem Tag, als ich sie … herausführte
  rationale: Bewahrt die konkrete zeitliche Formulierung und gibt zugleich den deutschen Zusammenhang natürlich wieder.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Erhält die volle Exodusformel mit „Land“, statt sie auf „aus Ägypten“ zu verkürzen.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: aus dem Eisenschmelzofen
  rationale: Bewahrt das Ofenbild und macht im Deutschen deutlich, dass כּוּר einen Schmelzofen bezeichnet. Die metaphorische Bedeutung wird nicht in den Haupttext aufgelöst.
- source_word: שִׁמְעוּ בְקוֹלִי
  choice: Hört auf meine Stimme
  rationale: Bewahrt das Bild des Hörens; die im Ausdruck enthaltene Gehorsamsbedeutung bleibt durch „hört auf“ sowie die folgende Aufforderung zum Tun erkennbar.
- source_word: וַעֲשִׂיתֶם אוֹתָם כְּכֹל אֲשֶׁר אֲצַוֶּה אֶתְכֶם
  choice: und tut alles, was ich euch gebiete
  rationale: Gibt die umfassende Forderung idiomatisch wieder. Eine wörtliche Wiedergabe des pluralischen Pronomens als „tut sie“ wäre im Deutschen unklar und unnatürlich; gemeint sind die gebotenen Bestimmungen beziehungsweise Worte.
- source_word: וִהְיִיתֶם לִי לְעָם
  choice: Dann werdet ihr mein Volk sein
  rationale: Gibt die Bundesformel natürlich wieder. „Dann“ bringt den syntaktischen Zusammenhang zum vorangehenden Auftrag zum Ausdruck, ohne die Aussage theologisch weiter festzulegen.
- source_word: וְאָנֹכִי אֶהְיֶה לָכֶם לֵאלֹהִים
  choice: und ich werde euer Gott sein
  rationale: Bewahrt die wechselseitige Bundesformel in geläufigem, würdevollem Deutsch.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der früheren Generationen
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Das Hebräische verwendet ausdrücklich das maskuline Pluralwort אָבוֹת. Der Haupttext bewahrt diese Form; eine Fußnote nennt die im Kontext mögliche umfassendere Wiedergabe.
- issue: Gehorsamsgehalt von שִׁמְעוּ בְקוֹלִי
  choice: Hört auf meine Stimme
  alternative: Gehorcht meiner Stimme
  rationale: Die hebräische Wendung schließt gehorsames Hören ein. Die gewählte Form bewahrt jedoch das Hörbild und lässt die unmittelbar folgende Aufforderung zum Tun den Gehorsamsaspekt ausdrücklich entfalten.
- issue: Bundesformel und syntaktischer Zusammenhang
  choice: Dann werdet ihr mein Volk sein
  alternative: und ihr werdet mein Volk sein
  rationale: Das deutsche „Dann“ verdeutlicht den im Satz ausgedrückten Zusammenhang, ohne über die Aussage des Verses hinaus Art oder Bedingungen des Bundes dogmatisch zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt erkennbar Teil des längeren Zusammenhangs, beginnt daher mit dem Relativpronomen „den“. Die direkte Rede wird zur besseren Lesbarkeit in zwei Sätze gegliedert. Archaische Formen und unnötig technische Sprache wurden vermieden; das zentrale Exodus- und Bundesvokabular bleibt erhalten.
