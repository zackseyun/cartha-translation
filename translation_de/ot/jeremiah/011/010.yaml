source:
  edition: WLC
  text: שָׁ֩בוּ֩ עַל עֲוֺנֹ֨ת אֲבוֹתָ֜/ם הָ/רִֽאשֹׁנִ֗ים אֲשֶׁ֤ר מֵֽאֲנוּ֙ לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֔/י וְ/הֵ֣מָּה הָלְכ֗וּ אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָ֑/ם הֵפֵ֤רוּ בֵֽית יִשְׂרָאֵל֙ וּ/בֵ֣ית יְהוּדָ֔ה אֶת בְּרִיתִ֕/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת אֲבוֹתָֽ/ם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/010.yaml
  text: They have returned to the iniquities of their first fathers[a], who refused to hear my words, and they themselves have gone after other gods to serve them[c][b]. The house of Israel and the house of Judah have broken my covenant that I made with their fathers.
translation:
  language: de
  text: Sie sind zu den Sünden ihrer Vorfahren aus früherer Zeit[a] zurückgekehrt, die sich weigerten, auf meine Worte zu hören[b]. Sie selbst sind anderen Göttern nachgelaufen, um ihnen zu dienen. Das Haus Israel und das Haus Juda haben meinen Bund gebrochen, den ich mit ihren Vorfahren geschlossen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ihrer früheren/ersten Väter“, das heißt früherer Generationen.'
    reason: lexical_alternative
  - marker: b
    text: „Auf meine Worte hören“ kann hier zugleich bedeuten, ihnen zu gehorchen.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ עַל עֲוֺנֹת
  choice: sind zu den Verfehlungen … zurückgekehrt
  rationale: שוב על bezeichnet hier die Rückkehr zu einem früheren sündigen Verhaltensmuster. „Zurückkehren zu“ gibt diese Bewegung natürlich wieder; „Verfehlungen“ bewahrt die moralische Schwere von עָוֹן, ohne die mögliche Nebenbedeutung von Schuld auszuschließen.
- source_word: אֲבוֹתָם הָרִאשֹׁנִים
  choice: ihre Vorfahren aus früherer Zeit
  rationale: Wörtlich etwa „ihre früheren/ersten Väter“. Die gewählte Formulierung bezeichnet verständlich die früheren Generationen und vermeidet das im Deutschen missverständliche „erste Väter“.
- source_word: מֵאֲנוּ לִשְׁמוֹעַ אֶת דְּבָרַי
  choice: sich weigerten, auf meine Worte zu hören
  rationale: מָאֵן bedeutet „sich weigern“. שׁמע kann sowohl das Hören als auch das gehorsame Hören meinen; „auf … hören“ bewahrt diese Bedeutungsbreite im Deutschen.
- source_word: וְהֵמָּה
  choice: Auch sie
  rationale: Das selbstständige Pronomen trägt Nachdruck. „Auch sie“ hebt hervor, dass die gegenwärtige Generation das Verhalten der Vorfahren selbst wiederholt, ohne im Deutschen schwerfällig zu wirken.
- source_word: הָלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: sind anderen Göttern nachgelaufen
  rationale: הלך אחרי bezeichnet das Folgen in Loyalität und Verehrung. „Nachlaufen“ erhält das Bewegungsbild und klingt im Kontext natürlicher als das wörtliche „hinter … hergehen“.
- source_word: לְעָבְדָם
  choice: um ihnen zu dienen
  rationale: עבד bezeichnet im Blick auf Gottheiten kultischen Dienst und kann Verehrung einschließen. „Dienen“ ist die direkte Entsprechung und lässt den umfassenderen Sinn offen.
- source_word: הֵפֵרוּ אֶת בְּרִיתִי
  choice: haben meinen Bund gebrochen
  rationale: Der Hifil von פרר bedeutet im Bundeskontext „brechen“ oder „verletzen“. „Den Bund brechen“ ist im Deutschen die klare und etablierte Wendung.
- source_word: בֵּית יִשְׂרָאֵל וּבֵית יְהוּדָה
  choice: Das Haus Israel und das Haus Juda
  rationale: Die Wiederholung von „Haus“ wird als bedeutsame kollektive und bundessprachliche Bezeichnung bewahrt.
- source_word: כָּרַתִּי אֶת אֲבוֹתָם
  choice: den ich mit ihren Vorfahren geschlossen habe
  rationale: 'כרת ברית ist wörtlich „einen Bund schneiden“, im Deutschen jedoch idiomatisch „einen Bund schließen“. אֵת bezeichnet hier die Partner des Bundesschlusses: „mit ihren Vorfahren“.'
theological_decisions:
- issue: Bundeskontinuität zwischen der gegenwärtigen Generation und den Vorfahren
  choice: Die gegenwärtige Generation kehrt zu den Verfehlungen früherer Generationen zurück und bricht den mit ihren Vorfahren geschlossenen Bund.
  alternative: Den Bund lediglich als vergangenes historisches Abkommen ohne erkennbare Beziehung zur gegenwärtigen Generation wiederzugeben.
  rationale: Der hebräische Text verbindet die gegenwärtige Abkehr ausdrücklich mit den Verfehlungen der Vorfahren und mit dem Bund, den Gott mit ihnen geschlossen hatte. Diese Verbindung wird bewahrt, ohne ein späteres theologisches System einzutragen.
- issue: Bedeutungsumfang von שׁמע
  choice: „auf meine Worte zu hören“
  alternative: „meinen Worten zu gehorchen“
  rationale: Das Verb kann in diesem Zusammenhang gehorsames Hören einschließen. Die gewählte Formulierung wahrt sowohl den konkreten Hörbezug als auch die implizierte Bereitschaft zum Gehorsam.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haus Israel“ und „Haus Juda“ bewahren die bundessprachliche Form des Hebräischen; „Vorfahren aus früherer Zeit“ gibt die ungewöhnliche hebräische Wortgruppe verständlich wieder. Die Fußnotenmarker [a] und [b] stehen jeweils unmittelbar an der betreffenden Textstelle.
