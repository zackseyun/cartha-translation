source:
  edition: WLC
  text: וַֽ/יהוָ֤ה צְבָאוֹת֙ שֹׁפֵ֣ט צֶ֔דֶק בֹּחֵ֥ן כְּלָי֖וֹת וָ/לֵ֑ב אֶרְאֶ֤ה נִקְמָֽתְ/ךָ֙ מֵ/הֶ֔ם כִּ֥י אֵלֶ֖י/ךָ גִּלִּ֥יתִי אֶת רִיבִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/020.yaml
  text: But you[a], O Yahweh of hosts, who judge righteously, who test the kidneys and the heart, let me see your vengeance on them[c][b], for to you I have revealed my case.
translation:
  language: de
  text: Doch du, Jahwe der Heerscharen, der du gerecht richtest und Nieren und Herz prüfst[a], lass mich deine Rache an ihnen sehen[b]; denn dir habe ich meine Rechtssache offengelegt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Nieren und Herz“; im hebräischen Denken ein Bild für die tiefsten Gedanken, Empfindungen und Beweggründe.
    reason: cultural_note
  - marker: b
    text: Oder „deine Vergeltung“ beziehungsweise „wie du mir Recht verschaffst“.
    reason: lexical_alternative
  - marker: c
    text: Oder „meinen Streitfall“, „meine Sache“ oder „meine Klage“.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה צְבָאוֹת
  choice: Doch du, Jahwe der Heerscharen
  rationale: Die Konjunktion wird im Zusammenhang adversativ mit „Doch“ wiedergegeben. „Jahwe“ gibt den Gottesnamen wieder; „der Heerscharen“ bewahrt die umfassende und traditionsreiche Bedeutung des Titels צְבָאוֹת.
- source_word: שֹׁפֵט צֶדֶק
  choice: der du gerecht richtest
  rationale: Das Partizip beschreibt Jahwes fortdauerndes Handeln bzw. Wesen. Die Relativkonstruktion ist im Deutschen natürlich und erhält die verbale Aussage.
- source_word: בֹּחֵן כְּלָיוֹת וָלֵב
  choice: Nieren und Herz prüfst
  rationale: „Prüfen“ bezeichnet das tiefgehende Erforschen. Die konkrete hebräische Bildsprache „Nieren und Herz“ bleibt im Haupttext erhalten und wird in einer Fußnote erklärt.
- source_word: אֶרְאֶה
  choice: lass mich … sehen
  rationale: Der Imperfekt kann im Gebetszusammenhang einen Wunsch ausdrücken. „Lass mich … sehen“ gibt diese volitive Nuance wieder, ohne sie als sichere Zukunftsaussage festzulegen.
- source_word: נִקְמָתְךָ מֵהֶם
  choice: deine Rache an ihnen
  rationale: „Rache“ ist die direkte Entsprechung zu נְקָמָה und bezeichnet hier Gottes gerechte Vergeltung. „An ihnen“ gibt die durch מִן bezeichnete Zielrichtung idiomatisch wieder.
- source_word: כִּי אֵלֶיךָ גִּלִּיתִי אֶת רִיבִי
  choice: denn dir habe ich meine Rechtssache offengelegt
  rationale: „Denn“ führt den Grund der Bitte ein. „Dir“ steht betont am Anfang. „Offengelegt“ bewahrt das Bild von גלה, während „Rechtssache“ den rechtlichen Sinn von רִיב verständlich ausdrückt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: „Jahwe“ macht den Eigennamen im Ausgangstext sichtbar und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Anthropologische Bildsprache „Nieren und Herz“
  choice: Konkrete Körperbegriffe im Haupttext beibehalten
  alternative: das Innerste und das Herz / Gedanken und Beweggründe
  rationale: Die wörtliche Bildsprache bezeichnet die tiefsten Gedanken, Empfindungen und Beweggründe. Ihre Beibehaltung wahrt die hebräische Ausdrucksweise; die Bedeutung wird in der Fußnote erläutert.
- issue: Bedeutungsumfang von נְקָמָה
  choice: Rache
  alternative: Vergeltung / Rechtverschaffung
  rationale: „Rache“ ist lexikalisch direkt, kann hier aber nicht von Jahwes gerechtem Richten getrennt werden. Die Fußnote hält die mögliche Nuance von Vergeltung oder Rechtverschaffung offen.
- issue: Rechtliche Bedeutung von רִיב
  choice: Rechtssache
  alternative: Streitfall / Sache / Klage
  rationale: „Rechtssache“ erhält den forensischen Klang, ohne eindeutig festzulegen, ob der Ausdruck stärker den Streit, die Klage oder das vertretene Anliegen bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede und der Parallelismus bleiben erkennbar; traditionelle Ausdrücke wie „Jahwe der Heerscharen“ werden wegen ihrer quellennahen Prägnanz beibehalten. Ungewohnte hebräische Bildsprache wird nicht geglättet, sondern knapp erläutert.
