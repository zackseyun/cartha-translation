source:
  edition: WLC
  text: כִּ֚י מִסְפַּ֣ר עָרֶ֔י/ךָ הָי֥וּ אֱלֹהֶ֖י/ךָ יְהוּדָ֑ה וּ/מִסְפַּ֞ר חֻצ֣וֹת יְרוּשָׁלִַ֗ם שַׂמְתֶּ֤ם מִזְבְּחוֹת֙ לַ/בֹּ֔שֶׁת מִזְבְּח֖וֹת לְ/קַטֵּ֥ר לַ/בָּֽעַל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/013.yaml
  text: For your gods[a], O Judah, have become as numerous as your cities; and as numerous as the streets of Jerusalem, you have set up altars to Shame[b], altars to make offerings to Baal.
translation:
  language: de
  text: Denn deine Götter sind so zahlreich geworden wie deine Städte, Juda. Und entsprechend der Zahl der Straßen Jerusalems habt ihr Altäre für die Schande[a] errichtet, Altäre, um dem Baal Rauchopfer darzubringen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „für die Schande“; eine verächtliche Ersatzbezeichnung für eine heidnische Gottheit, wahrscheinlich Baal.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „um dem Baal Weihrauch zu verbrennen“. Das hebräische Verb bezeichnet häufig das Darbringen eines Opfers, das in Rauch aufgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die Begründung zum vorausgehenden Zusammenhang ein und gibt die erklärende Funktion natürlich wieder.
- source_word: מִסְפַּר ... מִסְפַּר
  choice: so zahlreich ... wie / entsprechend der Zahl
  rationale: Die Wendung bezeichnet zahlenmäßige Entsprechung. Die leicht variierte deutsche Wiedergabe vermeidet Schwerfälligkeit, ohne den Parallelismus aufzugeben.
- source_word: הָיוּ אֱלֹהֶיךָ יְהוּדָה
  choice: deine Götter sind so zahlreich geworden wie deine Städte, Juda
  rationale: Das Perfekt von היה beschreibt hier den eingetretenen Zustand; „sind ... geworden“ wahrt diese Nuance. „Juda“ bleibt als direkte Anrede stehen.
- source_word: חֻצוֹת
  choice: Straßen
  rationale: Bezeichnet öffentliche Straßen oder freie Plätze; „Straßen“ ist im Zusammenhang die allgemein verständliche Wiedergabe.
- source_word: שַׂמְתֶּם מִזְבְּחוֹת
  choice: habt ihr Altäre ... errichtet
  rationale: שׂים bezeichnet hier das Aufstellen beziehungsweise Einrichten von Kultstätten; „errichtet“ ist idiomatisches modernes Deutsch.
- source_word: לַבֹּשֶׁת
  choice: für die Schande
  rationale: בֹּשֶׁת bedeutet wörtlich „Schande“ und dient hier polemisch als Ersatzbezeichnung für eine heidnische Gottheit, wahrscheinlich Baal. Die Übersetzung bewahrt diese prophetische Wertung.
- source_word: לְקַטֵּר
  choice: Rauchopfer darzubringen
  rationale: Das Verb bezeichnet kultisches Verbrennen beziehungsweise das Aufsteigenlassen von Opferrauch, häufig von Weihrauch. „Rauchopfer darbringen“ ist präzise, ohne den im Hebräischen nicht genannten Opferstoff festzulegen.
- source_word: לַבָּעַל
  choice: dem Baal
  rationale: Die Präposition bezeichnet den Empfänger beziehungsweise die Widmung des Kultakts; der Gottesname wird als „Baal“ wiedergegeben.
theological_decisions:
- issue: Wechsel von der singularischen Anrede Judas zur pluralischen Anrede der Bevölkerung
  choice: „deine ... Juda“ und anschließend „habt ihr“
  alternative: Den ganzen Vers einheitlich singularisch oder pluralisch formulieren
  rationale: Der hebräische Text personifiziert Juda zunächst im Singular und wendet sich danach im Plural an seine Bewohner. Der Wechsel wird nicht eingeebnet.
- issue: Deutung von לַבֹּשֶׁת
  choice: „für die Schande“ im Haupttext, wahrscheinlicher Bezug auf Baal in der Fußnote
  alternative: Direkt „für Baal“ oder „für das Schandbild“ übersetzen
  rationale: Die polemische Ersatzbezeichnung des hebräischen Textes soll sichtbar bleiben, ohne ihre wahrscheinliche Referenz als sicher auszugeben.
- issue: Spezifität von לְקַטֵּר
  choice: „Rauchopfer darzubringen“
  alternative: „Weihrauch zu verbrennen“ oder allgemein „Opfer darzubringen“
  rationale: Die Wiedergabe wahrt den Bezug auf kultisch erzeugten Opferrauch, legt aber nicht fest, dass ausschließlich Weihrauch gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz erhält den poetischen Zahlenvergleich; im zweiten wird er mit „entsprechend der Zahl“ natürlich fortgeführt. Der auffällige Wechsel von Singular zu Plural bleibt erhalten.
