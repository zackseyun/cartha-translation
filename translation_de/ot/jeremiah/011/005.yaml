source:
  edition: WLC
  text: לְמַעַן֩ הָקִ֨ים אֶת הַ/שְּׁבוּעָ֜ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֽוֹתֵי/כֶ֗ם לָ/תֵ֤ת לָ/הֶם֙ אֶ֣רֶץ זָבַ֥ת חָלָ֛ב וּ/דְבַ֖שׁ כַּ/יּ֣וֹם הַ/זֶּ֑ה וָ/אַ֥עַן וָ/אֹמַ֖ר אָמֵ֥ן יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/005.yaml
  text: so that I may establish the oath that I swore to your fathers[a], to give them a land flowing with milk and honey, as it is this day.” And I answered and said, “Amen[b], Yahweh.”
translation:
  language: de
  text: 'damit ich den Eid erfülle, den ich euren Vätern[a] geschworen habe: ihnen ein Land zu geben, in dem Milch und Honig fließen, wie es heute der Fall ist.« Da antwortete ich und sagte: »Amen, Jahwe[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euren Vorfahren«. Wörtlich steht im Hebräischen »euren Vätern«.'
    reason: lexical_alternative
  - marker: b
    text: Hebräisch JHWH; traditionell wiedergegeben mit »der HERR«.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמַעַן
  choice: damit
  rationale: Gibt die Zweck- beziehungsweise Folgebeziehung knapp und natürlich wieder.
- source_word: הָקִים אֶת הַשְּׁבוּעָה
  choice: den Eid erfülle
  rationale: Das Hifil von קום bezeichnet beim Eid dessen Verwirklichung beziehungsweise Inkraftsetzung. »Erfülle« ist im Deutschen natürlich und bewahrt den Sinn, dass das Beschworene ausgeführt wird.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: den ich … geschworen habe
  rationale: Bewahrt die direkte Verbindung zwischen dem Eid und Gottes Schwören.
- source_word: לַאֲבוֹתֵיכֶם
  choice: euren Vätern
  rationale: Entspricht der ausdrücklich maskulinen hebräischen Form und dem covenantalen Bezug auf die Vorväter; die allgemeinere Möglichkeit wird in einer Fußnote genannt.
- source_word: לָתֵת לָהֶם
  choice: ihnen … zu geben
  rationale: Gibt die Infinitivkonstruktion als Inhalt des Eides unmittelbar wieder.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: ein Land, in dem Milch und Honig fließen
  rationale: Bewahrt das biblische Bild der Fülle in idiomatischem modernem Deutsch.
- source_word: כַּיּוֹם הַזֶּה
  choice: wie es heute der Fall ist
  rationale: Bezieht die Verheißung auf die am gegenwärtigen Tag bestehende Wirklichkeit und wahrt die demonstrative Aussage.
- source_word: וָאַעַן וָאֹמַר
  choice: Da antwortete ich und sagte
  rationale: Erhält die doppelte hebräische Redeformel, ohne im Deutschen unnötig steif zu klingen.
- source_word: אָמֵן
  choice: Amen
  rationale: Bewahrt Jeremias zustimmende Antwort ohne interpretierende Auflösung in »So sei es«.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen JHWH als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
theological_decisions:
- issue: Bedeutung von הָקִים beim Eid
  choice: den Eid erfülle
  alternative: den Eid bestätige / in Kraft setze
  rationale: Im Zusammenhang bezeichnet das Verb nicht bloß eine mündliche Bestätigung, sondern die Verwirklichung dessen, was Gott geschworen hat. »Erfüllen« drückt dies verständlich aus, ohne den Bundeseid umzudeuten.
- issue: Wiedergabe von לַאֲבוֹתֵיכֶם
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Die Hauptübersetzung bewahrt die maskuline und traditionsgeschichtliche Form; die mögliche allgemeinere Bedeutung bleibt durch die Fußnote sichtbar.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Tetragrammaton als Gottesnamen. »Jahwe« macht dies im Haupttext sichtbar; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bildhafte Wendung von Milch und Honig sowie die doppelte Redeformel bleiben erhalten. Der Doppelpunkt kennzeichnet den Inhalt des Eides klar. Die Fußnotenmarker [a] und [b] stehen beide im Haupttext.
