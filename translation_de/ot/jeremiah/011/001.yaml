id: JER.11.1
reference: Jeremiah 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: de
  text: 'Das Wort, das von Jahwe[a] an Jeremia erging, lautete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: der HERR.'
    reason: Traditionelle alternative Wiedergabe des Gottesnamens JHWH.
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. In der prophetischen Einleitungsformel wahrt »das Wort« die formelhafte und theologisch offene Ausdrucksweise des Hebräischen.
- source_word: הָיָה אֶל
  choice: an … erging
  rationale: Wörtlich steht »war/geschah zu«. Die im Deutschen geläufige prophetische Wendung »an jemanden ergehen« gibt die hebräische Formel präzise und würdig wieder.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Der Personenname wird gemäß der etablierten deutschen biblischen Namensform wiedergegeben.
- source_word: מֵאֵת
  choice: von
  rationale: Die Präposition bezeichnet hier Ursprung und Urheber des Wortes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn im Haupttext durch einen Titel zu ersetzen.
- source_word: לֵאמֹר
  choice: 'lautete:'
  rationale: Der Infinitiv leitet die nachfolgende Rede ein. »Lautete:« bildet diese Fortsetzungsfunktion im natürlichen modernen Deutsch ab, ohne das schwerfällige »indem er sagte«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. »Jahwe« macht diesen im Haupttext sichtbar; die traditionelle deutsche Ersatzlesung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Einleitungsformel bleibt erkennbar; der Doppelpunkt signalisiert, dass die angekündigte Rede im folgenden Vers beginnt.
