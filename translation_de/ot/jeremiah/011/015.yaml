source:
  edition: WLC
  text: מֶ֣ה לִֽ/ידִידִ֞/י בְּ/בֵיתִ֗/י עֲשׂוֹתָ֤/הּ הַֽ/מְזִמָּ֨תָ/ה֙ הָֽ/רַבִּ֔ים וּ/בְשַׂר קֹ֖דֶשׁ יַעַבְר֣וּ מֵֽ/עָלָ֑יִ/ךְ כִּ֥י רָעָתֵ֖/כִי אָ֥ז תַּעֲלֹֽזִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/015.yaml
  text: What right has my beloved in my house[c][b][a], when she has done her many wicked schemes? Can holy flesh remove your evil from you? Then you rejoice!
translation:
  language: de
  text: Was hat meine Geliebte in meinem Haus zu suchen,[a] während sie ihre vielen bösen Pläne ausführt?[b] Kann heiliges Opferfleisch[c] dein Böses von dir wegnehmen?[d] Dann jubelst du!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Was hat meine Geliebte in meinem Haus …?“ Gemeint ist Gottes Haus, der Tempel.'
    reason: lexical_alternative
  - marker: b
    text: 'Der hebräische Ausdruck ist schwierig. Wörtlich etwa: „beim Tun ihres bösen Plans/Anschlags, die Vielen“. Die Verbindung von „die Vielen“ ist unsicher; möglich ist auch: „wenn sie mit vielen Böses tut“.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich: „heiliges Fleisch“; wahrscheinlich ist Fleisch von Opfern gemeint.'
    reason: cultural_note
  - marker: d
    text: 'Die hebräische Satzfügung ist schwierig; wörtlich etwa: „Und heiliges Fleisch wird von dir weggehen/vorübergehen; denn dein Böses – dann jubelst du.“ „Dein Böses“ kann auch „dein Unheil“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֶה לִידִידִי בְּבֵיתִי
  choice: Was hat meine Geliebte in meinem Haus zu suchen
  rationale: Die Wendung מֶה לְ... בְּ... ist eine rhetorische Frage nach Berechtigung oder Zugehörigkeit. „Zu suchen haben“ gibt diese Kraft in natürlichem Deutsch wieder; „Haus“ bewahrt das Bild des hebräischen Textes, obwohl der Tempel gemeint ist.
- source_word: לִידִידִי
  choice: meine Geliebte
  rationale: יְדִיד bezeichnet eine geliebte oder nahestehende Person. Die feminine Form passt zur kollektiven Anrede Judas beziehungsweise Jerusalems und bewahrt den im Zusammenhang schmerzhaft-ironischen Beziehungston.
- source_word: עֲשׂוֹתָהּ הַמְזִמָּתָה הָרַבִּים
  choice: wenn sie ihre vielen schändlichen Pläne ausführt
  rationale: Der schwierige Ausdruck wird entsprechend seinem negativen prophetischen Zusammenhang als fortgesetztes verwerfliches Planen und Handeln verstanden. „Schändlich“ gibt die moralische Wertung wieder, ohne eine bestimmte Art der Verfehlung festzulegen; die alternative Zuordnung von הָרַבִּים wird in einer Fußnote bewahrt.
- source_word: וּבְשַׂר קֹדֶשׁ
  choice: heiliges Opferfleisch
  rationale: Wörtlich steht „heiliges Fleisch“. Gemeint ist wahrscheinlich Fleisch von geweihten Opfern; „Opferfleisch“ macht den kultischen Bezug für heutige Leser verständlich, während die Fußnote den wörtlichen Ausdruck nennt.
- source_word: יַעַבְרוּ מֵעָלָיִךְ כִּי רָעָתֵכִי
  choice: dein Böses von dir wegnehmen
  rationale: עבר bedeutet gewöhnlich „vorübergehen“ oder „weggehen“. Im schwierigen Satz wird רָעָה als das moralisch Böse verstanden und als das ergänzt, was durch das Ritual nicht beseitigt werden kann. Die ungewöhnliche Syntax und eine wörtlichere Wiedergabe werden in der Fußnote offengelegt.
- source_word: אָז תַּעֲלֹזִי
  choice: Dann jubelst du!
  rationale: עלז bezeichnet ausgelassenes, triumphierendes Freuen. „Jubeln“ bewahrt die starke und hier anklagend-ironische Färbung; „dann“ gibt אָז unmittelbar wieder.
theological_decisions:
- issue: Identität der „Geliebten“
  choice: Die feminine Kollektivgestalt Juda beziehungsweise Jerusalem wird als Gottes „Geliebte“ angeredet.
  alternative: Eine einzelne Gottesdienstbesucherin oder die Tempelgemeinde im Allgemeinen.
  rationale: Die femininen Verb- und Pronominalformen und der weitere Zusammenhang sprechen für Juda/Jerusalem. Die Bezeichnung „Geliebte“ bleibt stehen, weil gerade die Spannung zwischen Bundesnähe und Untreue zur Anklage gehört.
- issue: Bedeutung des heiligen Fleisches
  choice: Die Frage bestreitet, dass der Verzehr oder Besitz von Opferfleisch das moralisch Böse beseitigen kann.
  alternative: Allgemeine Kritik am Tempelritual; oder eine Aussage über das Abwenden drohenden Unheils.
  rationale: Die Nachbarschaft von „heiligem Fleisch“ und רָעָה legt eine Kritik am Vertrauen auf Kult trotz fortgesetzter Bosheit nahe. Da רָעָה auch „Unheil“ bedeuten kann und der hebräische Satz unsicher ist, wird diese Alternative in der Fußnote ausdrücklich genannt.
- issue: Logischer Anschluss von „Dann jubelst du“
  choice: Der Satz bleibt als knapper, ironischer Abschluss stehen, ohne den genauen zeitlichen oder folgernden Zusammenhang auszudeuten.
  alternative: „Wenn du Böses tust, jubelst du“ oder „wenn dein Unheil vorüber ist, dann jubelst du“.
  rationale: אָז bedeutet „dann“, doch der vorausgehende schwierige Satz erlaubt mehrere Verknüpfungen. Die knappe Wiedergabe bewahrt die Spannung statt sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe wird durch „zu suchen“, „schändlich“ und „jubeln“ hörbar. Zugleich legen Fußnoten die ungewöhnliche hebräische Syntax sowie wichtige Alternativen offen, statt die textliche und theologische Spannung zu verdecken.
