source:
  edition: WLC
  text: וַֽ/יהוָ֥ה הֽוֹדִיעַ֖/נִי וָֽ/אֵדָ֑עָ/ה אָ֖ז הִרְאִיתַ֥/נִי מַעַלְלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/018.yaml
  text: And Yahweh made it known to me[a], and I knew; then you showed me their deeds.
translation:
  language: de
  text: Und Jahwe machte es mir bekannt, und ich wusste es; da zeigtest du mir ihre Taten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Hebräischen wechselt die Rede von „Jahwe“ zur direkten Anrede „du“. Manche Übersetzungen glätten dies zu „da zeigte er mir“ und geben den Wechsel damit nicht wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Und Jahwe
  rationale: Das Waw wird mit „Und“ wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: הוֹדִיעַנִי
  choice: ließ es mich wissen
  rationale: Die Hifil-Form von ידע bezeichnet das Veranlassen des Wissens bzw. Bekanntmachen. Das im Hebräischen unausgesprochene Objekt wird im Deutschen idiomatisch durch „es“ vertreten.
- source_word: וָאֵדָעָה
  choice: und ich erkannte es
  rationale: Die koordinierende Verbindung bleibt erhalten; „erkannte“ bezeichnet hier das durch Offenbarung gewonnene Wissen, ohne eine zusätzliche Kausalrelation ausdrücklich einzutragen.
- source_word: אָז
  choice: da
  rationale: Das temporale Adverb markiert den anschließenden Zeitpunkt; „da“ ist knapp, natürlich und dem gehobenen Erzählregister angemessen.
- source_word: הִרְאִיתַנִי
  choice: zeigtest du mir
  rationale: Die Hifil-Form von ראה wird idiomatisch mit „zeigen“ wiedergegeben. Die zweite Person Singular bleibt erhalten.
- source_word: מַעַלְלֵיהֶם
  choice: ihre Taten
  rationale: „Taten“ gibt מַעֲלָל wieder und bewahrt die im Kontext mögliche moralische Färbung, ohne „böse“ in den Text einzutragen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der im Ausgangstext ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Wechsel von der dritten Person zur direkten Anrede Gottes
  choice: „Jahwe ließ …; da zeigtest du …“
  alternative: „Jahwe ließ …; da zeigte er …“
  rationale: Der hebräische Text wechselt vom genannten Gottesnamen zur zweiten Person. Die Übersetzung bewahrt diesen rhetorischen Wechsel, statt ihn zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt der knappen Abfolge des Hebräischen; der unvermittelte Personenwechsel wird bewusst bewahrt.
