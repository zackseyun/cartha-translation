id: JER.11.21
reference: Jeremiah 11:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ עַל אַנְשֵׁ֣י עֲנָת֔וֹת הַֽ/מְבַקְשִׁ֥ים אֶֽת נַפְשְׁ/ךָ֖ לֵ/אמֹ֑ר לֹ֤א תִנָּבֵא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/לֹ֥א תָמ֖וּת בְּ/יָדֵֽ/נוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/021.yaml
  text: Therefore[a], this is what Yahweh says concerning the men of Anathoth who are seeking your life, saying, “Do not prophesy in the name of Yahweh[c][b], lest you die by our hand.”
translation:
  language: de
  text: 'Darum spricht Jahwe über die Männer von Anatot, die dir nach dem Leben trachten: »Prophezeie nicht im Namen Jahwes, sonst stirbst du durch unsere Hand.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und klingt im modernen Deutsch natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die prophetische Botenformel knapp, würdig und im Deutschen idiomatisch wieder.
- source_word: עַל אַנְשֵׁי עֲנָתוֹת
  choice: über die Männer von Anatot
  rationale: עַל bezeichnet hier den Gegenstand des Ausspruchs; אַנְשֵׁי wird entsprechend seiner männlichen Form als »Männer« wiedergegeben.
- source_word: הַמְבַקְשִׁים אֶת נַפְשְׁךָ
  choice: die dir nach dem Leben trachten
  rationale: Die geläufige deutsche Wendung bewahrt das hebräische Bild und vermittelt eindeutig die Absicht, Jeremia zu töten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die direkte Rede im Deutschen natürlicher ein als ein zusätzliches »indem sie sagen«.
- source_word: לֹא תִנָּבֵא
  choice: Prophezeie nicht
  rationale: Der verneinte Imperfekt hat hier prohibitive Funktion und wird als direktes Verbot wiedergegeben.
- source_word: בְּשֵׁם יְהוָה
  choice: im Namen Jahwes
  rationale: Bezeichnet das Reden unter Berufung auf und in der Vollmacht Jahwes.
- source_word: וְלֹא תָמוּת בְּיָדֵנוּ
  choice: sonst stirbst du durch unsere Hand
  rationale: Die formal negative hebräische Konstruktion fungiert im Kontext als Drohung; »sonst« gibt diese pragmatische Beziehung im Deutschen klar wieder, während »durch unsere Hand« das Bild des Ausgangstextes erhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Reichweite von אַנְשֵׁי עֲנָתוֹת
  choice: die Männer von Anatot
  alternative: die Leute von Anatot
  rationale: Die spezifisch männliche Form des hebräischen Ausdrucks bleibt erhalten, ohne den Kreis auf die gesamte Bevölkerung auszuweiten.
- issue: Form und Funktion von וְלֹא תָמוּת
  choice: sonst stirbst du
  alternative: damit du nicht stirbst / und du wirst nicht sterben
  rationale: Im Zusammenhang ist die Aussage keine Verheißung oder fürsorgliche Warnung, sondern eine von den Männern ausgesprochene Todesdrohung. Die Übersetzung gibt diese Funktion wieder.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Drohung ist unmittelbar verständlich; die hebräischen Bilder »nach dem Leben trachten« und »durch unsere Hand« bleiben erhalten. Der Ortsname עֲנָתוֹת wird in der im Deutschen etablierten biblischen Form »Anatot« wiedergegeben.
