id: JER.11.14
reference: Jeremiah 11:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֗ה אַל תִּתְפַּלֵּל֙ בְּעַד הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַל תִּשָּׂ֥א בַעֲדָ֖/ם רִנָּ֣ה וּ/תְפִלָּ֑ה כִּ֣י אֵינֶ֣/נִּי שֹׁמֵ֗עַ בְּ/עֵ֛ת קָרְאָ֥/ם אֵלַ֖/י בְּעַ֥ד רָעָתָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/014.yaml
  text: But as for you[a], do not pray for this people, and do not lift up a cry or prayer on their behalf, for I am not listening at the time when they call to me because of their disaster.
translation:
  language: de
  text: Du aber, bete nicht für dieses Volk und erhebe für sie weder einen Hilferuf noch ein Gebet; denn ich höre nicht, wenn sie wegen ihres Unglücks[a] zu mir rufen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann auch „Böses“ oder „Bosheit“ bedeuten; hier bezeichnet es das Unglück, das sie getroffen hat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion zusammen mit dem selbstständigen Pronomen hebt Jeremia kontrastierend hervor; „Du aber“ gibt diesen Wechsel natürlich und knapp wieder.
- source_word: אַל תִּתְפַּלֵּל
  choice: sollst nicht beten
  rationale: אַל mit der Verbform drückt ein Verbot aus. „Sollst nicht beten“ ist im Deutschen würdig und eindeutig, ohne das allgemeinere Verb vorschnell auf „Fürbitte leisten“ zu verengen.
- source_word: בְּעַד הָעָם הַזֶּה
  choice: für dieses Volk
  rationale: בְּעַד bezeichnet hier das Eintreten zugunsten anderer; „für dieses Volk“ ist natürlich und bewahrt den fürbittenden Sinn.
- source_word: וְאַל תִּשָּׂא
  choice: und … weder … erheben
  rationale: נשׂא bedeutet wörtlich „heben, erheben“. Die deutsche Wendung „einen Flehruf/ein Gebet erheben“ bewahrt das Bild und klingt zugleich idiomatisch.
- source_word: בַעֲדָם
  choice: für sie
  rationale: Die pronominale Form von בְּעַד bezeichnet erneut das Eintreten für andere. „Für sie“ vermeidet eine schwerfällige Wiederholung und bleibt präzise.
- source_word: רִנָּה
  choice: Flehruf
  rationale: Das Wort bezeichnet einen lauten Ruf, der je nach Zusammenhang auch Freude ausdrücken kann. Hier steht es parallel zu „Gebet“ und meint einen dringlichen Hilferuf; „Flehruf“ bildet diesen Kontext klar ab.
- source_word: וּתְפִלָּה
  choice: noch ein Gebet
  rationale: Die hebräische Verbindung ist formal additiv. Nach einer Verneinung gibt die deutsche Paarung „weder … noch“ den Umfang des Verbots natürlich und vollständig wieder.
- source_word: כִּי אֵינֶנִּי שֹׁמֵעַ
  choice: denn ich höre nicht
  rationale: Das negierte Partizip beschreibt Gottes gegenwärtige Weigerung, den Ruf zu erhören. Die knappe Form wahrt die hebräische Aussage, ohne sie ausdrücklich futurisch zu machen.
- source_word: בְּעֵת קָרְאָם אֵלַי
  choice: wenn sie … zu mir rufen
  rationale: בְּעֵת kennzeichnet den Zeitpunkt ihres Rufens. Das deutsche „wenn“ drückt diesen zeitlichen Zusammenhang idiomatisch aus; eine wörtlichere Form wie „zu der Zeit, da“ wäre unnötig schwer.
- source_word: בְּעַד רָעָתָם
  choice: wegen ihres Unglücks
  rationale: רָעָה kann moralisches Böses oder widerfahrendes Unheil bezeichnen. Hier ist das Unglück der Anlass, aus dem das Volk zu Gott ruft; „Unglück“ lässt den Gerichtskontext erkennen, ohne moralische Schuld als Inhalt des Rufens auszugeben.
theological_decisions:
- issue: Bedeutung von רָעָה im Schlusssatz
  choice: Unglück, das sie getroffen hat
  alternative: ihr Böses beziehungsweise ihre Bosheit
  rationale: Der unmittelbare Satz beschreibt, wann und weshalb das Volk um Hilfe ruft. Daher bezeichnet רָעָה hier am ehesten das widerfahrende Unheil. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengelegt, statt die alternative moralische Bedeutung zu verschweigen.
- issue: Zeitliche beziehungsweise aspektuelle Aussage von אֵינֶנִּי שֹׁמֵעַ
  choice: 'gegenwärtige Weigerung: „ich höre nicht“'
  alternative: 'futurische Wiedergabe: „ich werde nicht hören“'
  rationale: Das negierte Partizip stellt Gottes Nicht-Hören als bestehende Haltung dar. Eine rein futurische Übersetzung würde die Form stärker festlegen, als es der hebräische Ausdruck verlangt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. „Du aber“ bewahrt die hervorgehobene Anrede, „Flehruf“ und „ein Gebet erheben“ geben die Gebetssprache anschaulich wieder. Die Satzstruktur bleibt eng am Hebräischen, ohne unnatürlich wörtlich zu wirken.
