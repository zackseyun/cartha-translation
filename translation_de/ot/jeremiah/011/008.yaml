base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/008.yaml
  text: Yet they did not listen or incline their ear[a], but each one walked in the stubbornness of his evil heart; so I brought upon them all the words of this covenant, which I commanded them to do[b], but they did not do them.
translation:
  language: de
  text: Doch sie hörten nicht zu und neigten ihr Ohr nicht[a], sondern jeder ging in der Verstocktheit seines bösen Herzens seinen Weg. So brachte ich über sie alle Worte dieses Bundes, die zu befolgen ich ihnen geboten hatte[b]; doch sie befolgten sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie gehorchten nicht“. Das hebräische Wort kann „hören“, „zuhören“ und „gehorchen“ bedeuten; hier schließt das Nichthören die Weigerung ein, dem Gehörten zu folgen.'
    reason: lexikalische Alternative
  - marker: b
    text: 'Wörtlich: „alle Worte dieses Bundes, die zu tun ich geboten hatte“. Zu den Bundesworten können hier neben den Geboten auch die für Ungehorsam angekündigten Folgen gehören.'
    reason: Wortlaut und Bedeutungsumfang
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: sie hörten nicht
  rationale: שׁמע kann „hören“, „zuhören“ oder „gehorchen“ bedeuten. Zusammen mit der Wendung vom Zuneigen des Ohres bleibt „hörten nicht“ bildnah und lässt die im Kontext mitschwingende Gehorsamsverweigerung offen.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: neigten ihr Ohr nicht zu
  rationale: Die hebräische Metapher für aufmerksames Hören wird in verständlichem, würdigem Deutsch bewahrt.
- source_word: וַיֵּלְכוּ אִישׁ
  choice: jeder ging … seinen Weg
  rationale: אִישׁ ist hier distributiv („jeder“), nicht auf erwachsene Männer beschränkt. Die Wegmetapher für die Lebensführung bleibt erhalten; „seinen Weg“ wird idiomatisch ergänzt.
- source_word: בִּשְׁרִירוּת
  choice: in der Verstocktheit
  rationale: Das Wort bezeichnet eigensinnige, hartnäckige Selbstbestimmung. „Verstocktheit“ entspricht dem prophetischen Register und ist im modernen Bibeldeutsch verständlich.
- source_word: לִבָּם הָרָע
  choice: seines bösen Herzens
  rationale: Der Singular „Herz“ mit pluralischem Suffix steht distributiv. Nach „jeder“ gibt „seines bösen Herzens“ die individuelle Zuordnung grammatisch natürlich wieder.
- source_word: וָאָבִיא עֲלֵיהֶם
  choice: So brachte ich über sie
  rationale: Das Waw führt hier die Folge ihrer Weigerung ein; „So“ macht diesen Zusammenhang natürlich deutlich.
- source_word: כָּל דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: alle Worte dieses Bundes
  rationale: Die wörtliche Weite von דְּבָרִים bleibt erhalten. Gemeint sein können sowohl Bundesbestimmungen als auch angekündigte Folgen, ohne dass die Übersetzung vorschnell verengt.
- source_word: אֲשֶׁר צִוִּיתִי לַעֲשׂוֹת
  choice: die zu befolgen ich ihnen geboten hatte
  rationale: Das hebräische „zu tun“ bezeichnet hier das Ausführen der Bundesworte. „Befolgen“ ist im Deutschen natürlich und hält den Bezug auf die pluralischen „Worte“ klar.
- source_word: וְלֹא עָשׂוּ
  choice: doch sie befolgten sie nicht
  rationale: Das nicht ausdrücklich genannte Objekt wird aus den vorausgehenden „Worten“ aufgenommen. Die Wiederholung von „befolgen“ verdeutlicht das Versagen, den gebotenen Inhalt auszuführen.
theological_decisions:
- issue: Umfang von „alle Worte dieses Bundes“
  choice: Die wörtliche Formulierung „alle Worte dieses Bundes“ bleibt im Haupttext stehen.
  alternative: „alle Flüche dieses Bundes“ oder „alle Bestimmungen dieses Bundes“
  rationale: Im Zusammenhang können besonders die angedrohten Bundesgerichte gemeint sein; der hebräische Wortlaut ist jedoch weiter. Die Übersetzung bewahrt diese Spannung, statt sie auf Flüche oder Gebote zu beschränken.
- issue: Bedeutungsumfang von שׁמע
  choice: „hörten nicht“ mit erklärender Fußnote
  alternative: „gehorchten nicht“
  rationale: Der Kontext schließt Ungehorsam ein, doch die Verbindung mit dem Ohr trägt ausdrücklich ein Hörbild. Die gewählte Fassung bewahrt beides, ohne die Bedeutung im Haupttext ausschließlich auf Gehorsam festzulegen.
- issue: Distributive Wiedergabe von אִישׁ
  choice: „jeder“
  alternative: „jeder Mann“
  rationale: Das Wort bezeichnet hier die einzelnen Angehörigen des Volkes insgesamt. Eine ausdrücklich männliche Eingrenzung wäre sachlich unnötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die hebräischen Bilder des geneigten Ohres, des Weges und des Herzens bleiben erhalten. „Verstocktheit“ trägt den prophetischen Ernst, ohne eine konfessionelle Sonderdeutung einzuführen.
