  source_fidelity: 'Der deutsche Text gibt die hebräische Syntax und Aussage zuverlässig wieder: Jeremias ahnungslose, wehrlose Lage wird durch das Bild eines zutraulichen Lammes angemessen vermittelt; die Verschwörer planen seine Vernichtung. Das schwierige „Baum mit seinem Brot/seiner Nahrung“ wird im Haupttext zurückhaltend und ohne ungesicherte Deutung wiedergegeben. „Ihn“ ist im Kontext mit dem maskulinen Suffix sowie „sein Name“ sachgerecht auf Jeremia bezogen.'
