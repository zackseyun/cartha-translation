id: JER.11.19
reference: Jeremiah 11:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/אֲנִ֕י כְּ/כֶ֥בֶשׂ אַלּ֖וּף יוּבַ֣ל לִ/טְב֑וֹחַ וְ/לֹֽא יָדַ֜עְתִּי כִּֽי עָלַ֣/י חָשְׁב֣וּ מַחֲשָׁב֗וֹת נַשְׁחִ֨יתָה עֵ֤ץ בְּ/לַחְמ/וֹ֙ וְ/נִכְרְתֶ֨/נּוּ֙ מֵ/אֶ֣רֶץ חַיִּ֔ים וּ/שְׁמ֖/וֹ לֹֽא יִזָּכֵ֥ר עֽוֹד־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/019.yaml
  text: 'But I was like a gentle lamb led to the slaughter[a], and I did not know that they had devised plans against me: ‘Let us destroy the tree with its food, and let us cut him off from the land of the living[b], so that his name will be remembered no more.’'
translation:
  language: de
  text: 'Ich aber war wie ein zutrauliches Lamm, das zum Schlachten geführt wird.[a] Ich wusste nicht, dass sie Anschläge gegen mich planten: »Lasst uns den Baum samt seiner Nahrung vernichten[b] und ihn aus dem Land der Lebenden ausrotten, sodass man sich nicht mehr an seinen Namen erinnert.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wie ein zahmes Lamm“ oder „wie ein an Menschen gewöhntes Lamm“; das hebräische Eigenschaftswort ist schwer zu bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „den Baum mit seinem Brot/seiner Nahrung“. Der hebräische Ausdruck ist dunkel; häufig wird er im Sinn einer vollständigen Vernichtung des Baumes samt seiner Frucht verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֶבֶשׂ אַלּוּף
  choice: wie ein zutrauliches Lamm
  rationale: כֶּבֶשׂ bezeichnet ein Lamm; אַלּוּף ist hier schwierig und beschreibt wahrscheinlich ein zahmes, an Menschen gewöhntes und daher argloses Tier. „Zutraulich“ gibt diese verletzliche Arglosigkeit natürlich wieder, ohne die Unsicherheit zu verdecken.
- source_word: יוּבַל לִטְבוֹחַ
  choice: das zum Schlachten geführt wird
  rationale: Die Passivform von יבל mit לִטְבוֹחַ bezeichnet das Geführt- oder Gebrachtwerden zum Schlachten. Die deutsche Formulierung wahrt Bild und Verbform.
- source_word: וְלֹא יָדַעְתִּי
  choice: Ich wusste nicht
  rationale: Direkte Wiedergabe des Perfekts in der ersten Person Singular; die fehlende Kenntnis unterstreicht Jeremias Arglosigkeit.
- source_word: חָשְׁבוּ מַחֲשָׁבוֹת
  choice: sie Anschläge gegen mich planten
  rationale: Die Verbindung des Verbs mit dem stammverwandten Substantiv betont absichtsvolles Planen. „Anschläge planen“ vermittelt im Kontext die feindliche, lebensbedrohliche Absicht idiomatisch.
- source_word: נַשְׁחִיתָה
  choice: Lasst uns … vernichten
  rationale: Der Kohortativ der ersten Person Plural leitet die direkte Rede der Verschwörer ein; „vernichten“ entspricht dem zerstörerischen Kontext.
- source_word: עֵץ בְּלַחְמוֹ
  choice: den Baum samt seiner Nahrung
  rationale: לֶחֶם bedeutet gewöhnlich „Brot“ beziehungsweise „Nahrung“. Die Wendung ist dunkel; die relativ formale Wiedergabe bewahrt das ungewöhnliche Bild, statt es im Haupttext als „Frucht“ auszudeuten.
- source_word: וְנִכְרְתֶנּוּ
  choice: und ihn … ausrotten
  rationale: כרת bedeutet wörtlich „abschneiden“. Das maskuline Suffix bezieht sich im Kontext auf Jeremia, wie „sein Name“ bestätigt. „Ausrotten“ vermittelt die beabsichtigte vollständige Beseitigung einer Person im Deutschen klar.
- source_word: מֵאֶרֶץ חַיִּים
  choice: aus dem Land der Lebenden
  rationale: Die feste hebräische Wendung bezeichnet den Bereich der Lebenden und wird durch die entsprechende deutsche Wendung genau wiedergegeben.
- source_word: וּשְׁמוֹ לֹא יִזָּכֵר עוֹד
  choice: sodass man sich nicht mehr an seinen Namen erinnert
  rationale: Das Niphal von זכר kann „erinnert“ oder „genannt werden“ bedeuten. Die gewählte Formulierung drückt die beabsichtigte Auslöschung seines Andenkens aus und bewahrt den Bezug auf seinen Namen.
theological_decisions:
- issue: Deutung des gewaltsamen Bildes in der Rede der Verschwörer
  choice: Das Bild wird im unmittelbaren Kontext als Mordanschlag auf Jeremia übersetzt, ohne im Haupttext eine messianische Allegorie einzutragen.
  alternative: Den Vers vorrangig als typologische Weissagung auf das Leiden Christi formulieren.
  rationale: Der hebräische Kontext gibt Jeremias Zeugnis über einen gegen ihn gerichteten Anschlag wieder. Mögliche spätere typologische Bezüge gehören zur Auslegung und dürfen die Übersetzung des unmittelbaren Sinnes nicht bestimmen.
- issue: Bezug des maskulinen Suffixes in וְנִכְרְתֶנּוּ
  choice: Das Pronomen „ihn“ bezieht sich auf Jeremia.
  alternative: Das Pronomen auf den metaphorischen Baum beziehen und mit „ihn/es“ rein bildlich fortführen.
  rationale: Die Fortsetzung „sein Name“ und der Ausdruck „aus dem Land der Lebenden“ machen deutlich, dass hinter dem Baumbild die Person Jeremias das Ziel des Anschlags ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich; das ungewöhnliche Baumbild wird wegen der Dunkelheit des Hebräischen im Haupttext möglichst wenig geglättet und in der Fußnote erläutert.
