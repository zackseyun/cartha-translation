  terminology: „Land der Lebenden“ ist eine treffende Wiedergabe der hebräischen Wendung. „Anschläge planten“, „vernichten“ und „ausrotten“ geben den feindselig-tödlichen Kontext idiomatisch wieder, ohne eine zusätzliche theologische oder allegorische Deutung einzutragen. Die Fußnoten markieren die beiden wesentlichen lexikalischen Unsicherheiten korrekt.
