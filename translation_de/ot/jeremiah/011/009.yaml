source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י נִֽמְצָא קֶ֨שֶׁר֙ בְּ/אִ֣ישׁ יְהוּדָ֔ה וּ/בְ/יֹשְׁבֵ֖י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/009.yaml
  text: And Yahweh said to me[b][a], “A conspiracy has been found among the men of Judah and among the inhabitants of Jerusalem.”
translation:
  language: de
  text: 'Da sagte Jahwe zu mir: »Unter den Männern von Juda und unter den Bewohnern Jerusalems ist eine Verschwörung aufgedeckt worden.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Komplott ist aufgedeckt worden«; das hebräische Wort kann eine verräterische Verschwörung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Da sagte
  rationale: Das Wayyiqtol führt das nächste Ereignis in der Erzählfolge ein; „Da sagte“ gibt diesen Fortgang in natürlichem Deutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als persönlicher Name wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die im Deutschen geläufige Form.
- source_word: אֵלָי
  choice: zu mir
  rationale: Direkte und idiomatische Wiedergabe der Präposition mit Suffix der ersten Person Singular.
- source_word: נִמְצָא
  choice: ist … aufgedeckt worden
  rationale: Das Niphal Perfekt bezeichnet hier das Entdecken beziehungsweise Bekanntwerden eines bestehenden Sachverhalts. Die deutsche Perfektform bewahrt dessen gegenwärtige Relevanz.
- source_word: קֶשֶׁר
  choice: eine Verschwörung
  rationale: קֶשֶׁר bezeichnet in politischen und prophetischen Zusammenhängen eine Verschwörung oder ein verräterisches Komplott; „Verschwörung“ ist klar und kontextgerecht.
- source_word: בְּאִישׁ יְהוּדָה
  choice: unter den Männern von Juda
  rationale: Das formal singularische אִישׁ wird hier kollektiv verstanden. „Unter den Männern von Juda“ bewahrt sowohl diesen kollektiven als auch den männlichen Ausdruck des Hebräischen.
- source_word: וּבְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: und unter den Bewohnern Jerusalems
  rationale: Das substantivisch gebrauchte Partizip von ישב bezeichnet die Menschen, die in Jerusalem wohnen; „Bewohner“ ist im Deutschen natürlich und präzise.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ erhält den persönlichen Gottesnamen, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich deutsch, während die beiden parallelen Gruppen mit „unter“ ausdrücklich erhalten bleiben. Das Passiv bewahrt die Unbestimmtheit darüber, wer die Verschwörung aufgedeckt hat.
