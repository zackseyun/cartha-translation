id: JER.11.6
reference: Jeremiah 11:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י קְרָ֨א אֶת כָּל הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/בְ/חֻצ֥וֹת יְרוּשָׁלִַ֖ם לֵ/אמֹ֑ר שִׁמְע֗וּ אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את וַ/עֲשִׂיתֶ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/006.yaml
  text: 'And Yahweh said to me[a], “Proclaim all these words in the cities of Judah and in the streets of Jerusalem[b], saying: Hear the words of this covenant and do them.”'
translation:
  language: de
  text: 'Und Jahwe sagte zu mir: „Rufe alle diese Worte in den Städten Judas und auf den Straßen Jerusalems[a] aus: Hört[b] die Worte dieses Bundes und setzt sie in die Tat um!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „auf den Plätzen Jerusalems“; das hebräische Wort bezeichnet öffentliche Bereiche innerhalb der Stadt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Hört auf die Worte“. Das hebräische Verb kann ein Hören meinen, das zum Gehorsam führt; die folgende Aufforderung nennt das Handeln jedoch noch einmal ausdrücklich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird in seiner im Deutschen geläufigen Form wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קְרָא
  choice: Rufe … aus
  rationale: Der Imperativ bezeichnet hier eine öffentliche Bekanntmachung; „ausrufen“ gibt diesen Sinn natürlich und würdig wieder.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: Im Zusammenhang prophetischer Verkündigung bezeichnet דְּבָרִים die auszusprechende Botschaft; zugleich bleibt die Wortverbindung zum späteren Ausdruck „Worte dieses Bundes“ erhalten.
- source_word: בְּעָרֵי יְהוּדָה
  choice: in den Städten Judas
  rationale: Die Formulierung bewahrt die örtliche und geografische Bestimmtheit des Hebräischen.
- source_word: וּבְחֻצוֹת יְרוּשָׁלִַם
  choice: und auf den Straßen Jerusalems
  rationale: חֻצוֹת bezeichnet öffentliche Bereiche innerhalb der Stadt. „Auf den Straßen“ ist im modernen Deutschen idiomatisch; „auf den Plätzen“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: לֵאמֹר
  choice: Doppelpunkt vor der direkten Rede
  rationale: Die deutsche Zeichensetzung führt den Inhalt des auszurufenden Wortes natürlicher ein als eine wörtliche Wiedergabe mit „indem du sagst“.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Die Grundbedeutung „hören“ wird beibehalten. Eine Wiedergabe mit „gehorcht“ würde die anschließende ausdrückliche Aufforderung zum Handeln vorwegnehmen.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: die Worte dieses Bundes
  rationale: Die formale Wiedergabe wahrt sowohl den Bezug zu den zuvor genannten „Worten“ als auch den Bundesrahmen; „Bestimmungen“ wäre stärker auslegend.
- source_word: וַעֲשִׂיתֶם אוֹתָם
  choice: und setzt sie in die Tat um
  rationale: Die Formulierung gibt das konkrete Tun der Bundesworte in natürlichem Deutsch wieder, ohne die Unterscheidung zwischen Hören und Handeln einzuebnen.
theological_decisions:
- issue: Wiedergabe des Bundesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der persönliche Name bleibt sichtbar und wird nicht durch einen Titel ersetzt. „Jahwe“ ist die im Deutschen übliche wissenschaftlich begründete Form.
- issue: Bedeutung von שִׁמְעוּ im Verhältnis zum folgenden וַעֲשִׂיתֶם
  choice: Hört … und setzt sie in die Tat um
  alternative: Gehorcht den Worten dieses Bundes
  rationale: Der hebräische Text unterscheidet rhetorisch zwischen dem Hören und dem anschließenden Tun. Die Übersetzung bewahrt diese theologisch bedeutsame Folge, statt beide Verben in „gehorchen“ zusammenzuziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die öffentliche Verkündigung wird idiomatisch mit „ausrufen“ formuliert. Die bewusst parallele Folge „Hört … und setzt sie in die Tat um“ erhält die Struktur und Spannung des hebräischen Textes, ohne unnatürlich wörtlich zu klingen.
