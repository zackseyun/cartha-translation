  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י פֹקֵ֖ד עֲלֵי/הֶ֑ם הַ/בַּֽחוּרִים֙ יָמֻ֣תוּ בַ/חֶ֔רֶב בְּנֵי/הֶם֙ וּ/בְנ֣וֹתֵי/הֶ֔ם יָמֻ֖תוּ בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/022.yaml
  text: 'Therefore thus says Yahweh of hosts: Behold[a], I am about to punish them. The young men will die by the sword; their sons and their daughters will die by famine.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe der Heerscharen: »Siehe, ich werde sie zur Rechenschaft ziehen.[a] Die jungen Männer werden durch das Schwert sterben; ihre Söhne und Töchter werden an einer Hungersnot sterben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Siehe, ich werde sie bestrafen.« Wörtlich: »Siehe, ich suche sie heim«; das hebräische Verb kann im Gerichtszusammenhang bedeuten, jemanden zur Rechenschaft zu ziehen oder zu bestrafen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und klingt im modernen Deutschen natürlicher als das formellere „Daher“.
- source_word: כֹּה אָמַר
  choice: spricht
  rationale: Die im Deutschen feste prophetische Botenformel „So spricht“ wird zusammen mit לָכֵן idiomatisch als „Darum spricht“ wiedergegeben; der Aussagegehalt von כֹּה bleibt in der feierlichen Formel erhalten, ohne das schwerfällige „Darum, so spricht“.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Gibt den Gottesnamen ausdrücklich wieder und bewahrt in „Heerscharen“ die mögliche Breite himmlischer und irdischer Streitkräfte, ohne sie auf menschliche Heere einzuengen.
- source_word: הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Siehe, ich werde sie zur Rechenschaft ziehen
  rationale: „Siehe“ bewahrt die nachdrückliche Ankündigung; die Zukunftsform vermittelt den bevorstehenden Vollzug. „Zur Rechenschaft ziehen“ gibt פקד mit עַל im gerichtlichen Zusammenhang verständlich wieder, ohne das im heutigen Deutsch missverständliche „heimsuchen“ zu verwenden.
- source_word: הַבַּחוּרִים
  choice: Die jungen Männer
  rationale: Bezeichnet junge erwachsene Männer, im Zusammenhang wahrscheinlich Männer im kampffähigen Alter.
- source_word: יָמֻתוּ בַחֶרֶב
  choice: werden durch das Schwert sterben
  rationale: Bewahrt die konkrete Gerichtsformel und das Bild des Schwertes als gewaltsame Todesursache.
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: ihre Söhne und Töchter
  rationale: Erhält die ausdrückliche Nennung männlicher und weiblicher Nachkommen, statt sie zum allgemeineren „Kinder“ zusammenzufassen.
- source_word: יָמֻתוּ בָּרָעָב
  choice: werden durch Hunger sterben
  rationale: רָעָב kann Hunger beziehungsweise Hungersnot bezeichnen. „Durch Hunger sterben“ ist natürliches Deutsch und erhält die Parallelität zum Tod durch das Schwert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Gerichtliche Bedeutung von הִנְנִי פֹקֵד עֲלֵיהֶם
  choice: Siehe, ich werde sie zur Rechenschaft ziehen
  alternative: Siehe, ich werde sie bestrafen
  rationale: Die gewählte Formulierung macht das bevorstehende göttliche Gericht deutlich, wahrt aber die weitere Bedeutung des Verbs als gerichtliches Aufsuchen und Zur-Verantwortung-Ziehen, statt es ausschließlich auf Strafvollzug zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. „Siehe“ und „Heerscharen“ bewahren den feierlichen Registerwert, während „zur Rechenschaft ziehen“ die gerichtliche Aussage für heutige Leser verständlich macht. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt.
