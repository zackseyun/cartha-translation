  text: כִּי֩ הָעֵ֨ד הַעִדֹ֜תִי בַּ/אֲבֽוֹתֵי/כֶ֗ם בְּ/יוֹם֩ הַעֲלוֹתִ֨/י אוֹתָ֜/ם מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה הַשְׁכֵּ֥ם וְ/הָעֵ֖ד לֵ/אמֹ֑ר שִׁמְע֖וּ בְּ/קוֹלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/011/007.yaml
  text: For I solemnly warned your fathers in the day I brought them up from the land of Egypt[a], and to this day, rising early and warning them, saying, ‘Listen to my voice.’
translation:
  language: de
  text: 'Denn ich habe eure Väter an dem Tag, als ich sie aus dem Land Ägypten heraufführte, eindringlich gewarnt; und bis zum heutigen Tag habe ich sie immer wieder früh am Morgen gewarnt und gesagt: »Hört auf meine Stimme![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gehorcht meiner Stimme!« Die hebräische Wendung kann besonders im Zusammenhang des Bundes ein Hören bezeichnen, das sich im Gehorsam zeigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aussage und stellt im Deutschen einen natürlichen Zusammenhang her.
- source_word: הָעֵד הַעִדֹתִי
  choice: ich habe … eindringlich gewarnt
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage. Im Zusammenhang bezeichnet עוּד eine nachdrückliche, feierliche Warnung.
- source_word: בַּאֲבוֹתֵיכֶם
  choice: eure Väter
  rationale: Die wörtliche verwandtschaftliche Bezeichnung bewahrt den heilsgeschichtlichen und bundestheologischen Sprachgebrauch des Hebräischen.
- source_word: בְּיוֹם הַעֲלוֹתִי אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: seit dem Tag, an dem ich sie aus dem Land Ägypten heraufführte
  rationale: Der Hifil von עלה gibt die geläufige Exodusformel »heraufführen« wieder. »Seit dem Tag« verbindet den Ausgangspunkt sinnvoll mit »bis zum heutigen Tag« und entspricht dem zeitlichen Verlauf der Aussage.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: und bis zum heutigen Tag
  rationale: Die feste Wendung bezeichnet das Fortdauern des göttlichen Warnens vom Exodus bis in die Gegenwart des Propheten.
- source_word: הַשְׁכֵּם וְהָעֵד
  choice: immer wieder früh am Morgen gewarnt
  rationale: Die in Jeremia häufige Wendung mit השׁכם drückt beharrliches, eifriges und wiederholtes Handeln aus. Zugleich bleibt das hebräische Bild des frühen Aufstehens erkennbar.
- source_word: לֵאמֹר
  choice: und gesagt
  rationale: Die übliche Zitatankündigung wird in natürlichem deutschem Satzbau wiedergegeben.
- source_word: שִׁמְעוּ בְּקוֹלִי
  choice: Hört auf meine Stimme!
  rationale: Die Formulierung bewahrt das Hörmotiv des Hebräischen; im Deutschen kann »auf meine Stimme hören« zugleich gehorsames Befolgen ausdrücken.
theological_decisions:
- issue: Bundestheologische Bedeutung von שִׁמְעוּ בְּקוֹלִי
  choice: Hört auf meine Stimme!
  alternative: Gehorcht meiner Stimme!
  rationale: Die Wendung schließt im Bundeskontext Gehorsam ein, ist aber bildlich als Hören formuliert. Der Haupttext bewahrt beides, während die Fußnote die ausdrücklichere Deutung nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »gewarnt« bildet die Wiederaufnahme desselben hebräischen Verbs ab; »früh am Morgen« bewahrt ein charakteristisches Bild aus Jeremia, ohne die beharrliche Wiederholung zu verschleiern.
