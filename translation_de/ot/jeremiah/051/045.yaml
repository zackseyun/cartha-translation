source:
  edition: WLC
  text: צְא֤וּ מִ/תּוֹכָ/הּ֙ עַמִּ֔/י וּ/מַלְּט֖וּ אִ֣ישׁ אֶת נַפְשׁ֑/וֹ מֵ/חֲר֖וֹן אַף יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/045.yaml
  text: Come out from her midst[a], my people, and let each man save his life from the burning anger of Yahweh.
translation:
  language: de
  text: Zieht aus ihrer Mitte hinaus, mein Volk! Jeder von euch rette sein Leben vor Jahwes glühendem Zorn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְאוּ
  choice: Zieht … hinaus
  rationale: Der pluralische Imperativ von יצא fordert zum Verlassen Babylons auf. „Hinausziehen“ ist im Deutschen natürlich, eindringlich und vermeidet die unnötige Festlegung auf die Perspektive von „kommt“ oder „geht“.
- source_word: מִתּוֹכָהּ
  choice: aus ihrer Mitte
  rationale: Die feminine Endung verweist im Zusammenhang auf die personifizierte Stadt Babylon. „Aus ihrer Mitte“ bewahrt dieses Bild, ohne den Namen erklärend in den Vers einzusetzen.
- source_word: עַמִּי
  choice: mein Volk
  rationale: Die übliche Bundesanrede erhält sowohl das Possessivverhältnis als auch dessen theologisches Gewicht.
- source_word: וּמַלְּטוּ אִישׁ
  choice: Jeder von euch rette
  rationale: Der pluralische Imperativ mit distributivem אִישׁ fordert jedes einzelne Glied des angesprochenen Volkes zur Rettung auf. Die deutsche Form gibt diese Verteilung natürlich wieder, auch wenn sie den hebräischen Numeruswechsel nicht formal nachbilden kann.
- source_word: אֶת נַפְשׁוֹ
  choice: sein Leben
  rationale: נפש bezeichnet hier das konkrete Leben beziehungsweise die eigene Person, nicht eine vom Körper getrennte Seele. „Sein Leben“ passt zum drohenden Gericht und bewahrt das direkte Objekt.
- source_word: מֵחֲרוֹן אַף
  choice: vor … glühendem Zorn
  rationale: Die feste Verbindung bezeichnet heftigen, bildlich erhitzten Zorn. „Glühender Zorn“ erhält das Wärmebild und klingt zugleich in modernem Deutsch natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form der wissenschaftlich üblichen Umschrift.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Wiedergabe als Eigenname bewahrt den Unterschied zwischen Gottes persönlichem Namen und einem bloßen Titel.
- issue: Distributive Bedeutung von אִישׁ
  choice: Jeder von euch
  alternative: jeder Mann
  rationale: אִישׁ steht hier nach einem pluralischen Imperativ distributiv und bezieht sich auf alle einzelnen Angehörigen des angesprochenen Volkes. „Jeder von euch“ bewahrt diese individuelle Zuspitzung, ohne im Deutschen eine möglicherweise engere Aussage nur über männliche Personen zu erzeugen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zweiteilung in zwei Ausrufesätze macht den dringlichen prophetischen Aufruf klar; die personifizierende feminine Rückbeziehung auf Babylon bleibt erhalten.
