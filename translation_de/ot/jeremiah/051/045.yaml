review_pass:
  verdict: approve
  source_fidelity: Der deutsche Text gibt die beiden pluralischen Aufforderungen und die distributive Zuspitzung des hebräischen Textes sachgerecht wieder. „Aus ihrer Mitte“ bewahrt den femininen Rückverweis auf die im Kontext personifizierte Babylon; „sein Leben“ trifft נפשׁ in diesem Gefährdungszusammenhang. „Vor Jahwes glühendem Zorn“ gibt die Rettung weg von חרון אף idiomatisch und mit erhaltenem Wärmebild wieder.
  naturalness: Modernes, würdiges Standarddeutsch. „Zieht aus ihrer Mitte hinaus“ ist als eindringliche prophetische Aufforderung verständlich und stilistisch vertretbar. Die Formulierung „Jeder von euch rette sein Leben“ ist natürlich und bringt den distributiven Charakter klar zum Ausdruck.
  terminology: „Jahwe“ ist im Deutschen eine etablierte Wiedergabe des Tetragramms und wahrt dessen Eigenname-Charakter. „Mein Volk“ ist die angemessene Wiedergabe der Bundesanrede. Die neutrale deutsche Formulierung „Jeder von euch“ ist hier vertretbar, da אִישׁ distributiv gebraucht wird und keine ausdrückliche Beschränkung auf erwachsene Männer im Kontext verlangt.
