  text: הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יִרְמְיָ֣הוּ הַ/נָּבִ֗יא אֶת שְׂרָיָ֣ה בֶן נֵרִיָּה֮ בֶּן מַחְסֵיָה֒ בְּ/לֶכְתּ֞/וֹ אֶת צִדְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בָּבֶ֔ל בִּ/שְׁנַ֥ת הָ/רְבִעִ֖ית לְ/מָלְכ֑/וֹ וּ/שְׂרָיָ֖ה שַׂ֥ר מְנוּחָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/059.yaml
  text: This is the word that Jeremiah the prophet commanded Seraiah son of Neriah[a], son of Mahseiah, when he went with Zedekiah king of Judah to Babylon, in the fourth year of his reign. Now Seraiah was the quartermaster.
translation:
  language: de
  text: Den folgenden Auftrag gab der Prophet Jeremia Seraja, dem Sohn Nerijas, des Sohnes Machsejas, als er mit Zedekia, dem König von Juda, im vierten Jahr seiner Herrschaft nach Babylon reiste. Seraja war der Quartiermeister[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hofmarschall«. Der seltene hebräische Titel ist nicht sicher zu deuten und kann einen Beamten bezeichnen, der für Unterkünfte, Rastplätze oder Reisevorkehrungen zuständig war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר צִוָּה
  choice: Folgenden Auftrag gab
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten, und צוה bezeichnet hier das Erteilen einer verbindlichen Anweisung. Die deutsche Wendung gibt beides natürlich und prägnant wieder.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: der Prophet Jeremia
  rationale: Die im Deutschen übliche Wortstellung bewahrt Name und Amtsbezeichnung vollständig.
- source_word: שְׂרָיָה בֶן נֵרִיָּה בֶּן מַחְסֵיָה
  choice: Seraja, dem Sohn Nerijas und Enkel Machsejas
  rationale: Das zweite בֶן bezeichnet in der deutschen Genealogie idiomatisch den Großvater; »Enkel« macht die Abstammungsfolge klar, ohne ihren Inhalt zu verändern.
- source_word: בְּלֶכְתּוֹ אֶת צִדְקִיָּהוּ ... בָּבֶל
  choice: als dieser mit Zedekia ... nach Babylon reiste
  rationale: Das Suffix von בְּלֶכְתּוֹ bezieht sich im Satz am natürlichsten auf Seraja; אֶת ist hier komitativ und bedeutet »mit«. »Reiste« passt zum Weg an den königlichen Hof besser als das im Deutschen schwerfällige »ging«.
- source_word: בִּשְׁנַת הָרְבִעִית לְמָלְכוֹ
  choice: im vierten Jahr seiner Herrschaft
  rationale: Natürliche Wiedergabe der hebräischen Regierungsdatierung; das Pronomen bezieht sich auf Zedekia.
- source_word: שַׂר מְנוּחָה
  choice: Quartiermeister
  rationale: Der seltene Titel verbindet שַׂר (Amtsträger) mit מְנוּחָה (Ruhe- oder Rastplatz). Im Reisekontext bezeichnet er wahrscheinlich einen Beamten, der für Unterkunft oder Reisevorkehrungen zuständig war.
