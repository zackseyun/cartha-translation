  source_fidelity: 'Die wesentlichen Satzbeziehungen sind richtig wiedergegeben: Jeremia erteilt Seraja einen Auftrag; Seraja reist mit Zedekia nach Babylon; die Datierung bezieht sich auf Zedekias Regierungszeit. Die genealogische Formulierung »Enkel Machsejas« legt jedoch eine spezifische Generationenfolge fest, während בֶּן auch in genealogischen Reihen stehen kann. Die deutsche Wiedergabe sollte die Quellform deshalb näher beibehalten.'
