base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/016.yaml
  text: At the sound of his voice, a multitude of waters is in the heavens; he makes clouds rise from the ends of the earth; he makes lightning for the rain, and brings out the wind from his storehouses.
translation:
  language: de
  text: Wenn er seine Stimme erschallen lässt, brausen Wassermassen am Himmel. Er lässt Wolken[a] von den Enden der Erde aufsteigen, macht Blitze zum Regen und holt den Wind aus seinen Vorratskammern[b] hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Dünste.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Schatzkammern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקוֹל תִּתּוֹ
  choice: Wenn er seine Stimme erschallen lässt
  rationale: Die hebräische Wendung bedeutet wörtlich etwa „beim Geben seiner Stimme“. Die deutsche Formulierung bewahrt sowohl den Vorgang des Ertönenlassens als auch den möglichen Anklang an Donner.
- source_word: הֲמוֹן מַיִם
  choice: braust eine Fülle von Wasser
  rationale: הֲמוֹן kann Menge, Fülle oder Getöse bezeichnen. Die Verbindung aus „braust“ und „Fülle“ hält Mengen- und Klangaspekt zusammen, ohne das Bild auf nur eine Bedeutung zu verengen.
- source_word: בַּשָּׁמַיִם
  choice: am Himmel
  rationale: Im Zusammenhang mit Wolken, Regen, Blitzen und Wind bezeichnet שָׁמַיִם hier natürlich den Himmel als Bereich des Wettergeschehens.
- source_word: נְשִׂאִים
  choice: Wolken
  rationale: Das Wort kann Wolken, Dunst oder aufsteigende Dünste bezeichnen. „Wolken“ ist im Sturmzusammenhang die klare, natürliche Hauptlesart; die Alternative wird in einer Fußnote erhalten.
- source_word: מִקְצֵה אָרֶץ
  choice: vom Ende der Erde
  rationale: Der Singular קְצֵה wird formal als „Ende“ wiedergegeben. Gemeint ist der fernste Rand beziehungsweise die äußerste Ferne der Erde.
- source_word: בְּרָקִים לַמָּטָר
  choice: Blitze für den Regen
  rationale: Die Wiedergabe erhält die ungewöhnliche und offene Verbindung mit ל, statt sie deutend zu „Blitze mit dem Regen“ oder „für den Regensturm“ aufzulösen.
- source_word: וַיֹּצֵא רוּחַ
  choice: holt den Wind ... hervor
  rationale: Im meteorologischen Kontext bedeutet רוּחַ eindeutig „Wind“. „Hervorholen“ bewahrt das räumliche Bild der göttlichen Vorratskammern.
- source_word: מֵאֹצְרֹתָיו
  choice: aus seinen Vorratskammern
  rationale: אוֹצָר bezeichnet einen Vorratsraum, ein Lager oder eine Schatzkammer. „Vorratskammern“ ist verständlich und passt zum Bild verwahrter Naturkräfte.
theological_decisions:
- issue: Poetische Darstellung von Gottes Herrschaft über das Wetter
  choice: Die kosmologischen Bilder von Wasser am Himmel, aufsteigenden Wolken, Blitzen und göttlichen Vorratskammern bleiben erhalten.
  alternative: Die Bilder zu einer allgemeinen Aussage zusammenzufassen, dass Gott Gewitter und Wetter hervorbringt.
  rationale: Der hebräische Text beschreibt Gottes Macht über die Schöpfung in konkreter, erhabener Bildsprache. Eine entmythologisierende Paraphrase würde diese Aussageform unnötig verflachen.
- issue: Mehrdeutigkeit von הֲמוֹן
  choice: Mengen- und Geräuschaspekt werden gemeinsam durch „braust eine Fülle“ ausgedrückt.
  alternative: Nur „eine Menge Wasser“ oder nur „das Tosen des Wassers“.
  rationale: Das hebräische Wort lässt beide Nuancen zu; die Übersetzung soll diese Spannung nicht stillschweigend beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Rhythmus. „Erschallen lässt“, „braust“ und „hervor“ tragen den erhabenen Charakter, bleiben aber allgemein verständlich. Die Satzfolge folgt eng der hebräischen Bildbewegung.
