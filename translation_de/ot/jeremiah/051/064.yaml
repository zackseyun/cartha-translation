source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ כָּ֠כָה תִּשְׁקַ֨ע בָּבֶ֤ל וְ/לֹֽא תָקוּם֙ מִ/פְּנֵ֣י הָ/רָעָ֗ה אֲשֶׁ֧ר אָנֹכִ֛י מֵבִ֥יא עָלֶ֖י/הָ וְ/יָעֵ֑פוּ עַד הֵ֖נָּה דִּבְרֵ֥י יִרְמְיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/064.yaml
  text: And you shall say[a], ‘Thus Babylon will sink and will not rise because of the disaster that I am bringing upon her, and they will grow weary.’ Up to this point are the words of Jeremiah.
translation:
  language: de
  text: 'Und du sollst sagen: »So wird Babel versinken und nicht aufstehen wegen des Unheils, das ich über sie bringe; und sie werden erschöpft sein[a].« Bis hierher reichen die Worte Jeremias.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sie werden müde werden« beziehungsweise »und sie werden ohnmächtig«. Das hebräische Verb kann Ermattung oder Erschöpfung bezeichnen. Der Plural bezieht sich wahrscheinlich auf die Menschen Babels, nicht auf die Stadt selbst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Und du sollst sagen
  rationale: Das Qal-Perfekt 2. Person maskulin Singular mit וְ setzt die Anweisungsfolge fort und hat hier auffordernden, zukunftsbezogenen Sinn.
- source_word: כָּכָה
  choice: So
  rationale: Das deiktische Adverb leitet knapp und würdig die Deutung der Zeichenhandlung ein.
- source_word: תִּשְׁקַע
  choice: wird ... versinken
  rationale: שׁקע bezeichnet das Sinken in die Tiefe und greift die unmittelbar vorausgehende Zeichenhandlung am Euphrat auf.
- source_word: בָּבֶל
  choice: Babel
  rationale: Babel ist die im deutschen Bibelgebrauch etablierte Form des Ortsnamens.
- source_word: וְלֹא תָקוּם
  choice: und nicht wieder aufsteigen
  rationale: קום steht im bildlichen Gegensatz zum Versinken. »Wieder« verdeutlicht idiomatisch die Endgültigkeit, ohne eine zusätzliche Aussage einzuführen.
- source_word: מִפְּנֵי הָרָעָה
  choice: wegen des Unheils
  rationale: מִפְּנֵי bezeichnet hier den Grund; רָעָה meint in diesem Gerichtskontext kommendes Unheil und nicht moralische Bosheit.
- source_word: אֲשֶׁר אָנֹכִי מֵבִיא עָלֶיהָ
  choice: das ich über es bringe
  rationale: Das Partizip מֵבִיא stellt das angekündigte Gericht als bevorstehendes Handeln dar. Das Pronomen bleibt grammatisch auf das sächliche deutsche »Babel« bezogen.
- source_word: וְיָעֵפוּ
  choice: und sie werden erschöpft sein
  rationale: יעף bezeichnet Ermattung oder Erschöpfung. Der Wechsel in den Plural lässt den Bezug offen, legt aber die Menschen Babels nahe.
- source_word: עַד הֵנָּה
  choice: Bis hierher
  rationale: Die Wendung markiert formelhaft den Abschluss eines Textabschnitts.
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: reichen die Worte Jeremias
  rationale: Die nominale Schlussformel wird im Deutschen mit einem idiomatischen Verb wiedergegeben; der genitivische Eigenname wahrt den würdigen Registerton.
theological_decisions:
- issue: Bedeutung von הָרָעָה in der Rede vom göttlichen Gericht
  choice: Unheil
  alternative: Böses; Katastrophe
  rationale: Im Zusammenhang bezeichnet das Wort die als Gericht angekündigte Not, nicht moralisch Böses. »Unheil« bewahrt sowohl die Schwere als auch die sachliche Offenheit des hebräischen Begriffs.
- issue: Subjekt des pluralischen וְיָעֵפוּ
  choice: Das unbestimmte »sie« bleibt im Haupttext erhalten
  alternative: ausdrückliche Ergänzung »die Bewohner Babels«
  rationale: Der hebräische Text nennt das Subjekt nicht ausdrücklich. Wahrscheinlich sind Babels Menschen gemeint; eine Ergänzung im Haupttext würde diese plausible Deutung jedoch festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Bildsprache. »Babel« folgt dem etablierten deutschen Bibelgebrauch. Der abrupte Wechsel von der Stadt im Singular zu einem nicht ausdrücklich genannten Subjekt im Plural bleibt sichtbar; die Fußnote erläutert ihn, ohne ihn im Haupttext aufzulösen.
