source:
  edition: WLC
  text: הוֹצִ֥יא יְהוָ֖ה אֶת צִדְקֹתֵ֑י/נוּ בֹּ֚אוּ וּ/נְסַפְּרָ֣ה בְ/צִיּ֔וֹן אֶֽת מַעֲשֵׂ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/010.yaml
  text: Yahweh has brought forth our vindication. Come[a], and let us recount in Zion the work of Yahweh our God.
translation:
  language: de
  text: Jahwe hat unser Recht[a] ans Licht gebracht. Kommt, lasst uns in Zion von der Tat Jahwes, unseres Gottes, erzählen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „unsere Gerechtigkeitserweise“ oder „unsere gerechten Taten“; ebenso möglich: „unsere Rechtfertigung“. Der hebräische Plural kann gerechte Taten oder die öffentliche Bestätigung einer gerechten Sache bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: hat … ans Licht gebracht
  rationale: Das Hifil von יצא bedeutet wörtlich „herausbringen“. Die deutsche Wendung „ans Licht bringen“ bewahrt dieses Bild und drückt hier aus, dass Jahwe das Recht seines Volkes öffentlich sichtbar macht.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: צִדְקֹתֵינוּ
  choice: unser Recht
  rationale: Der hebräische Plural kann gerechte Taten, Rechtserweise oder die öffentliche Bestätigung einer gerechten Sache bezeichnen. Im Zusammenhang mit Babylons Gericht und der Befreiung des Volkes bezeichnet „unser Recht“ am ehesten die von Jahwe öffentlich erwiesene Berechtigung ihrer Sache, ohne moralische Verdienstlichkeit zu unterstellen.
- source_word: בֹּאוּ
  choice: Kommt
  rationale: Der Imperativ im Plural lädt die Angesprochenen gemeinsam zum folgenden Bekenntnis ein.
- source_word: וּנְסַפְּרָה
  choice: lasst uns … erzählen
  rationale: Die Kohortativform drückt eine gemeinsame Aufforderung aus. „Erzählen“ gibt ספר natürlich wieder und passt zur öffentlichen Verkündigung in Zion.
- source_word: בְצִיּוֹן
  choice: in Zion
  rationale: Die Präposition ist hier örtlich zu verstehen.
- source_word: מַעֲשֵׂה
  choice: die Tat
  rationale: Das Substantiv steht im Singular und bezeichnet Jahwes machtvolles Handeln in Gericht und Rettung; „Tat“ erhält diese konkrete Einzahl.
- source_word: אֱלֹהֵינוּ
  choice: unseres Gottes
  rationale: Die Genitivform ist im deutschen Satz natürlich und bewahrt die Aussage der Zugehörigkeit.
theological_decisions:
- issue: Bedeutung von צִדְקֹתֵינוּ im Zusammenhang
  choice: unser Recht
  alternative: unsere Gerechtigkeitserweise / unsere gerechten Taten / unsere Rechtfertigung
  rationale: Der Zusammenhang feiert Jahwes öffentliches Eintreten für sein Volk. „Unser Recht“ erhält den rechtlich-relationalen Sinn, ohne die Stelle auf Israels moralische Leistungen festzulegen. Die Bedeutungsbreite des hebräischen Plurals wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ans Licht gebracht“ bewahrt das konkrete hebräische Bild, während „von der Tat … erzählen“ natürlich und öffentlich-bekenntnishaft klingt. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung, auf die sich die Anmerkung bezieht.
