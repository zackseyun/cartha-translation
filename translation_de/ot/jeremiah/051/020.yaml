source:
  edition: WLC
  text: מַפֵּץ אַתָּ֣ה לִ֔/י כְּלֵ֖י מִלְחָמָ֑ה וְ/נִפַּצְתִּ֤י בְ/ךָ֙ גּוֹיִ֔ם וְ/הִשְׁחַתִּ֥י בְ/ךָ֖ מַמְלָכֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/020.yaml
  text: You are my war club[a], my weapon of battle; with you I shatter nations[b], and with you I destroy kingdoms.
translation:
  language: de
  text: Du bist mein Streitkolben[a], meine Kriegswaffe. Mit dir zerschmettere ich Völker[b], und mit dir vernichte ich Königreiche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hammer«, »Keule« oder »Schlachtbeil«. Das hebräische Wort bezeichnet eine Waffe zum Zerschmettern; der folgende Ausdruck lautet formal »Kriegsgeräte/Waffen des Krieges«.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit »dir« angeredete Gegenüber steht im Hebräischen in der Einzahl. Dieser Vers nennt es nicht ausdrücklich; aus dem Zusammenhang werden unter anderem Babylon, Kyrus beziehungsweise Medien-Persien oder Israel/Jakob als Bezug erwogen.
    reason: alternative_reading
lexical_decisions:
- source_word: מַפֵּץ
  choice: Streitkolben
  rationale: Das Substantiv bezeichnet ein Werkzeug oder eine Waffe zum Zerschlagen. »Streitkolben« bewahrt das kriegerische Bild und passt zum folgenden Verb »zerschmettern«, ohne die Form der Waffe zu stark festzulegen.
- source_word: לִי
  choice: für mich
  rationale: Die Präposition bedeutet formal »mir/für mich« und stellt den Angeredeten als Werkzeug des Sprechers dar. Die Formulierung ist im Deutschen natürlich und bewahrt die instrumentale Nuance.
- source_word: כְּלֵי מִלְחָמָה
  choice: eine Kriegswaffe
  rationale: Wörtlich steht ein Ausdruck für »Kriegsgerät/Kriegswerkzeuge«. Wegen der singularischen Anrede wird die appositionelle Wendung idiomatisch im Singular wiedergegeben.
- source_word: וְנִפַּצְתִּי
  choice: zerschmettere ich
  rationale: Das Piel bezeichnet gewaltsames Zerschlagen. Das Präsens gibt die bildhafte prophetische Aussage im Deutschen prägnant wieder und greift die Bedeutung von מַפֵּץ auf.
- source_word: בְךָ
  choice: mit dir
  rationale: Die Präposition kennzeichnet hier das Mittel oder Werkzeug. »Mit dir« erhält zugleich die wiederholte Struktur des Hebräischen.
- source_word: גּוֹיִם
  choice: Völker
  rationale: Der Begriff bezeichnet hier kollektive politische oder ethnische Größen. »Völker« ist im Deutschen natürlich und lässt offen, ob jeweils Staaten oder Volksgemeinschaften im Vordergrund stehen.
- source_word: וְהִשְׁחַתִּי
  choice: vernichte ich
  rationale: Der Hifil-Stamm drückt hier das Herbeiführen von Verderben oder Zerstörung aus. »Vernichten« bildet einen klaren Parallelismus zu »zerschmettern«.
- source_word: מַמְלָכוֹת
  choice: Königreiche
  rationale: Das Wort bezeichnet Herrschaftsgebiete beziehungsweise monarchisch regierte Reiche und entspricht direkt dem politischen Kontext.
theological_decisions:
- issue: Identität des singularisch Angeredeten
  choice: Die zweite Person Singular bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Als mögliche Bezugspersonen oder -größen werden Babylon, Kyrus beziehungsweise Medien-Persien sowie Israel/Jakob genannt.
  rationale: Der hebräische Vers selbst nennt den Angeredeten nicht. Eine Festlegung im Haupttext würde eine umstrittene kontextuelle Deutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger militärischer Bildsprache. Die parallelen Satzteile und die wiederholte Wendung »mit dir« bilden die Struktur des Hebräischen nach. Die nicht ausdrücklich genannte Identität des Angeredeten bleibt bewusst offen.
