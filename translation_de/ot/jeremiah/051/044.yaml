  text: וּ/פָקַדְתִּ֨י עַל בֵּ֜ל בְּ/בָבֶ֗ל וְ/הֹצֵאתִ֤י אֶת בִּלְע/וֹ֙ מִ/פִּ֔י/ו וְ/לֹֽא יִנְהֲר֥וּ אֵלָ֛י/ו ע֖וֹד גּוֹיִ֑ם גַּם חוֹמַ֥ת בָּבֶ֖ל נָפָֽלָה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/044.yaml
  text: And I will punish Bel in Babylon[a], and I will bring out of his mouth what he has swallowed; nations will no longer stream to him[b]. Even the wall of Babylon has fallen.
translation:
  language: de
  text: Ich werde Bel in Babylon bestrafen und aus seinem Mund herausholen, was er verschlungen hat. Keine Völker werden mehr zu ihm strömen.[a] Auch die Mauer Babylons ist gefallen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keine Völker werden mehr zu ihm fließen.“ Das hebräische Verb zeichnet die Bewegung der Völker als einen Strom, der sich auf Bel zubewegt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auch die Mauer Babylons wird fallen.“ Das hebräische Perfekt kann hier ein zukünftiges Ereignis als bereits sicher darstellen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפָקַדְתִּי עַל
  choice: Ich werde … bestrafen
  rationale: פָקַד mit עַל bezeichnet in diesem Gerichtszusammenhang ein strafendes Einschreiten. „Bestrafen“ gibt dies in klarem, modernem Deutsch wieder.
- source_word: בֵּל
  choice: Bel
  rationale: Der Name beziehungsweise Titel der babylonischen Gottheit wird transliteriert und nicht übersetzt.
- source_word: בְּבָבֶל
  choice: in Babylon
  rationale: Die Präposition בְּ ist hier lokal zu verstehen und bezeichnet den Ort beziehungsweise den Kultbereich Bels.
- source_word: וְהֹצֵאתִי אֶת בִּלְעוֹ מִפִּיו
  choice: und aus seinem Mund herausholen, was er verschlungen hat
  rationale: Die kausative Form von יצא und das konkrete Bild des Verschlingens und Herausbringens werden bewahrt; der Relativsatz ist im Deutschen natürlicher als eine substantivische Wiedergabe.
- source_word: וְלֹא יִנְהֲרוּ אֵלָיו עוֹד גּוֹיִם
  choice: Keine Völker werden mehr zu ihm strömen
  rationale: נהר zeichnet die Bewegung der Völker als einen Strom. Die deutsche Formulierung erhält dieses prophetische Bild und bezieht „ihm“ auf Bel.
- source_word: גַּם
  choice: Auch
  rationale: גַּם fügt als weitere, gewichtige Gerichtsaussage den Fall der Mauer hinzu. „Auch“ ist hier natürlich und wahrt die additive Funktion.
- source_word: חוֹמַת בָּבֶל
  choice: die Mauer Babylons
  rationale: Die Singularform des Hebräischen bleibt erhalten; sie kann kollektiv für Babylons Befestigungsanlage stehen.
- source_word: נָפָלָה
  choice: ist gefallen
  rationale: 'Das hebräische Perfekt wird als prophetisches Perfekt wiedergegeben: Das angekündigte Geschehen wird als bereits eingetreten und damit als gewiss dargestellt.'
theological_decisions:
- issue: Bezug der Pronomen in den Aussagen über das Verschlungene und das Hinströmen
  choice: Die Pronomen beziehen sich auf Bel, die babylonische Gottheit beziehungsweise das Götzenbild.
  alternative: Sie könnten weiter gefasst auf das personifizierte Babylon bezogen werden.
  rationale: Bel ist der unmittelbare Bezugspunkt. Sowohl der Mund, aus dem das Verschlungene hervorgeholt wird, als auch das Hinströmen zu ihm führen die gegen Bel gerichtete Polemik fort, ohne die damit verbundene Niederlage Babylons auszuschließen.
- issue: Zeitbezug von נָפָלָה
  choice: 'Wiedergabe als prophetisches Perfekt: „ist gefallen“.'
  alternative: 'Futurische Wiedergabe: „wird fallen“.'
  rationale: Im prophetischen Reden kann das Perfekt ein zukünftiges Ereignis als sicher darstellen. Die gewählte Form bewahrt diese rhetorische Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anschaulichen Bilder des Verschlingens, Herausbringens und Strömens bleiben erhalten. Der kurze prophetische Satzbau und das prophetische Perfekt werden bewahrt; eine mögliche futurische Wiedergabe wird in der Fußnote genannt.
