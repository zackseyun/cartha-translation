  text: אֽוֹרִידֵ֖/ם כְּ/כָרִ֣ים לִ/טְב֑וֹחַ כְּ/אֵילִ֖ים עִם עַתּוּדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/040.yaml
  text: I will bring them down like lambs to the slaughter[a], like rams with male goats.
translation:
  language: de
  text: Ich werde sie hinabführen wie Lämmer zur Schlachtung, wie Widder zusammen mit Ziegenböcken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie junge Widder« für כָּרִים.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹרִידֵם
  choice: Ich führe sie hinab
  rationale: Der Hifil von ירד bezeichnet das Veranlassen des Hinabgehens und kann »hinabführen« oder »hinabbringen« bedeuten. Im Bild von Tieren, die zur Schlachtung geführt werden, ist »führe ... hinab« natürlich und bewahrt sowohl die kausative als auch die gerichtete Bedeutung.
- source_word: כְּכָרִים
  choice: wie Lämmer
  rationale: כָּרִים kann Lämmer beziehungsweise junge Widder bezeichnen. »Lämmer« ergibt im Deutschen ein klares Schlachtbild; die engere mögliche Bedeutung »junge Widder« wird in der Fußnote erhalten.
- source_word: לִטְבֹחַ
  choice: zum Schlachten
  rationale: Der Infinitiv von טבח bezeichnet das Schlachten. Nach »hinabführen« gibt »zum Schlachten« den Zweck prägnant und idiomatisch wieder.
- source_word: כְּאֵילִים
  choice: wie Widder
  rationale: אֵילִים bezeichnet hier eindeutig Widder; mögliche Nebenassoziationen von Stärke müssen nicht ausdrücklich ergänzt werden.
- source_word: עִם עַתּוּדִים
  choice: zusammen mit Ziegenböcken
  rationale: עַתּוּדִים bezeichnet männliche Ziegen. »Ziegenböcke« ist die geläufige, eindeutige deutsche Bezeichnung und bewahrt die Geschlechtsspezifik.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und würdige Standardsprache. Die parallele Tierbildfolge bleibt erhalten; »zusammen mit« macht die Zuordnung von עִם im Deutschen klar, ohne das Bild auszudeuten.
