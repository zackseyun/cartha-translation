  text: And with you I shattered horse and rider[c][b][a]; and with you I shattered chariot and rider.
translation:
  language: de
  text: Mit dir zerschmetterte ich Pferd und Reiter; mit dir zerschmetterte ich Streitwagen und seinen Reiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִפַּצְתִּי
  choice: zerschmetterte ich
  rationale: Das Piel von נָפַץ bezeichnet ein gewaltsames Zerschlagen oder Zertrümmern. „Zerschmettern“ bewahrt das kraftvolle militärische Bild; die Wiederholung wird beibehalten.
- source_word: בְךָ
  choice: mit dir
  rationale: Die Präposition בְּ bezeichnet hier das Mittel oder Werkzeug. „Mit dir“ lässt Gott als handelndes Subjekt erkennen und den Angesprochenen als sein Werkzeug, ohne dessen Identität innerhalb dieses Verses festzulegen.
- source_word: סוּס
  choice: Pferd
  rationale: Das Substantiv bedeutet schlicht „Pferd“. Der militärische Zusammenhang ist deutlich, doch „Kriegspferd“ wäre expliziter als der hebräische Wortlaut.
- source_word: רֹכְבוֹ (bei סוּס)
  choice: Reiter
  rationale: Die Form bezeichnet denjenigen, der darauf reitet. In der festen Paarung „Pferd und Reiter“ kann das Possessivverhältnis im Deutschen natürlich unausgesprochen bleiben.
- source_word: רֶכֶב
  choice: Streitwagen
  rationale: רֶכֶב kann auch kollektiv die Streitwagenmacht bezeichnen. Die singularische Verbindung mit רֹכְבוֹ legt hier jedoch einen einzelnen Wagen nahe; „Streitwagen“ macht den militärischen Kontext natürlich deutlich.
- source_word: רֹכְבוֹ (bei רֶכֶב)
  choice: Wagenlenker
  rationale: Wörtlich steht erneut „sein Reiter“. Bei einem Streitwagen ist „Wagenlenker“ im modernen Deutschen die natürliche sachliche Bezeichnung, ohne die parallele Person-Wagen-Beziehung aufzugeben.
theological_decisions:
- issue: Der Angesprochene als Werkzeug des göttlichen Gerichts
  choice: „Mit dir zerschmetterte ich“
  alternative: „Durch dich zerschmetterte ich“ / „mittels deiner zerschmetterte ich“
  rationale: Die hebräischen Verben stehen in der ersten Person Singular und lassen Gott als Handelnden hervortreten; בְךָ kennzeichnet den Angesprochenen als Mittel. „Mit dir“ wahrt diese Zuordnung und belässt die Identität des Angesprochenen im Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe parallele Satzstruktur und die zweimalige Verbform des Hebräischen bleiben erhalten. Das Semikolon wurde durch ein Komma ersetzt, da die asyndetische Parallelreihe so im Deutschen flüssig und dennoch markant klingt.
