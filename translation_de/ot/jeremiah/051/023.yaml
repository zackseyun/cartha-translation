base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/023.yaml
  text: And with you I shattered the shepherd and his flock[a]; and with you I shattered the farmer and his team[c][b]; and with you I shattered governors and deputies.
translation:
  language: de
  text: Mit dir habe ich den Hirten und seine Herde zerschmettert; mit dir habe ich den Bauern und sein Gespann zerschmettert; mit dir habe ich Statthalter und Beamte zerschmettert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי
  choice: zerschmettere ich
  rationale: נָפַץ bezeichnet ein gewaltsames Zerschlagen oder Zerschmettern. Das Präsens gibt die in der Reihe formulierte Verwendung Babylons als Werkzeug Gottes natürlich wieder und bewahrt die dreifache Wiederholung des Hebräischen.
- source_word: בְךָ
  choice: mit dir
  rationale: Die Präposition בְּ bezeichnet hier das Mittel oder Werkzeug. „Mit dir“ hält dieses instrumentale Verhältnis offen und entspricht der wiederholten hebräischen Satzstruktur.
- source_word: רֹעֶה
  choice: den Hirten
  rationale: In der Aufzählung gesellschaftlicher Tätigkeiten und zugehöriger Gruppen ist ein gewöhnlicher Viehhirte gemeint; „Pastor“ würde einen späteren kirchlichen Sinn eintragen.
- source_word: עֶדְרוֹ
  choice: seine Herde
  rationale: עֵדֶר bezeichnet eine Herde. Zusammen mit „Hirte“ ist „seine Herde“ die klare und idiomatische deutsche Wiedergabe.
- source_word: אִכָּר
  choice: den Bauern
  rationale: Das Wort bezeichnet einen Bearbeiter des Bodens. „Bauer“ ist modern und verständlich, ohne die Tätigkeit unnötig auf das Pflügen zu verengen.
- source_word: צִמְדּוֹ
  choice: sein Gespann
  rationale: צֶמֶד kann ein Paar beziehungsweise ein Joch von Zugtieren bezeichnen. „Gespann“ vermittelt im landwirtschaftlichen Zusammenhang am natürlichsten die gemeinte verbundene Tiergruppe.
- source_word: פַּחוֹת
  choice: Statthalter
  rationale: פַּחָה bezeichnet einen Provinzgouverneur oder Statthalter. „Statthalter“ gibt das antike Verwaltungsamt prägnant wieder.
- source_word: סְגָנִים
  choice: Stellvertreter
  rationale: סְגָנִים bezeichnet nachgeordnete hohe Amtsträger. „Stellvertreter“ wahrt ihren Rang unter beziehungsweise neben den Statthaltern, ohne ein nicht sicher bestimmbares Amt zu präzisieren.
theological_decisions:
- issue: Zeitwert der wiederholten Form וְנִפַּצְתִּי
  choice: deutsches Präsens („zerschmettere ich“)
  alternative: deutsches Präteritum („zerschmetterte ich“) oder Futur („werde ich zerschmettern“)
  rationale: Die hebräische Perfektform steht in einer rhetorischen Reihe, in der Babylon als Gottes Werkzeug bezeichnet wird; sie kann vergangene Verwendung, feststehende Wirkung oder prophetisch angekündigtes Handeln ausdrücken. Im deutschen Kontext gibt das Präsens die instrumentale Funktion am knappsten wieder, ohne sie ausschließlich auf Vergangenheit oder Zukunft festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreifache Parallelstruktur und das jeweils vorangestellte „Mit dir“ wurden zur Wahrung von Rhythmus und Nachdruck des Hebräischen beibehalten.
