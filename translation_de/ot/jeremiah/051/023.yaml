  naturalness: Die Parallelstruktur ist klar und würdig. „Habe ich zerschmettert“ ist im Deutschen in diesem prophetisch-rhetorischen Kontext natürlich. „Statthalter und Beamte“ ist idiomatischer und weniger interpretierend als „Statthalter und ihre Stellvertreter“.
