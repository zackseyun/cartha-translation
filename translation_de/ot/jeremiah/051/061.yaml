  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ אֶל שְׂרָיָ֑ה כְּ/בֹאֲ/ךָ֣ בָבֶ֔ל וְֽ/רָאִ֔יתָ וְֽ/קָרָ֔אתָ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/061.yaml
  text: And Jeremiah said to Seraiah[a], “When you come to Babylon, see that you read all these words.”
translation:
  language: de
  text: 'Und Jeremia sagte zu Seraja: „Wenn du nach Babel kommst, achte darauf,[a] dass du alle diese Worte vorliest.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und du sollst sehen und alle diese Worte lesen“. Das hebräische „sehen“ hat hier wahrscheinlich den Sinn „darauf achten“ oder „dafür sorgen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Und … sagte
  rationale: Die Wayyiqtol-Form führt die nächste Handlung im Erzählfluss ein; „Und … sagte“ gibt dies schlicht und quellennah wieder.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Gebräuchliche deutsche Form des Personennamens.
- source_word: שְׂרָיָה
  choice: Seraja
  rationale: Gebräuchliche deutsche Transkription des hebräischen Personennamens.
- source_word: כְּבֹאֲךָ בָבֶל
  choice: Wenn du nach Babel kommst
  rationale: כְּ mit dem Infinitiv von בוא und dem Suffix der 2. Person Singular hat temporalen Sinn. „Nach Babel kommen“ ist im Deutschen natürlich und bewahrt die Bewegungsrichtung.
- source_word: וְרָאִיתָ
  choice: achte darauf
  rationale: Wörtlich steht „und du wirst/sollst sehen“. Im Zusammenhang leitet das Verb wahrscheinlich idiomatisch die sorgfältige Ausführung des folgenden Auftrags ein; „achte darauf“ gibt diese auffordernde Funktion natürlich wieder, ohne die wörtlichere Lesart zu verschweigen.
- source_word: וְקָרָאתָ
  choice: dass du … vorliest
  rationale: קרא bezeichnet im Zusammenhang mit der Schriftrolle das Lesen beziehungsweise Rezitieren der niedergeschriebenen Worte. „Vorliest“ macht den naheliegenden hörbaren Vollzug deutlicher als das allgemeinere „liest“.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דברים bezeichnet hier den Inhalt der schriftlich festgehaltenen prophetischen Botschaft; „Worte“ bewahrt diesen Textbezug.
