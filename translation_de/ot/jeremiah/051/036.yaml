  text: לָ/כֵ֗ן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי רָב֙ אֶת רִיבֵ֔/ךְ וְ/נִקַּמְתִּ֖י אֶת נִקְמָתֵ֑/ךְ וְ/הַחֲרַבְתִּי֙ אֶת יַמָּ֔/הּ וְ/הֹבַשְׁתִּ֖י אֶת מְקוֹרָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/036.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to plead your case and take vengeance for you[c][b]; I will dry up her sea and make her spring dry.'
translation:
  language: de
  text: 'Darum, so spricht Jahwe: Siehe, ich werde deinen Rechtsstreit führen[a] und für dich Vergeltung üben. Ich werde ihr Meer[b] austrocknen und ihre Quelle[c] versiegen lassen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für deine Sache eintreten“. Im Hebräischen steht eine Wendung aus der Rechtssprache.'
    reason: lexical_alternative
  - marker: b
    text: Babylon wird als weibliche Stadtgestalt angesprochen; daher wörtlich „ihr Meer“.
    reason: referent_clarification
  - marker: c
    text: 'Oder: „ihren Quell“ beziehungsweise „ihren Ursprung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang knapp und natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die geläufige prophetische Botenformel und gibt den Gottesnamen ausdrücklich als Jahwe wieder.
- source_word: הִנְנִי רָב אֶת רִיבֵךְ
  choice: Siehe, ich werde deinen Rechtsstreit führen
  rationale: הִנְנִי hebt Jahwes unmittelbar bevorstehendes Handeln hervor; die Verbindung von ריב mit dem gleichstämmigen Substantiv bezeichnet einen Rechtsstreit beziehungsweise das Eintreten für eine Sache.
- source_word: וְנִקַּמְתִּי אֶת נִקְמָתֵךְ
  choice: und für dich Vergeltung üben
  rationale: Gibt die gleichstämmige hebräische Verbindung natürlich wieder und wahrt sowohl den persönlichen als auch den gerichtlichen Vergeltungssinn.
- source_word: וְהַחֲרַבְתִּי אֶת יַמָּהּ
  choice: Ich werde ihr Meer trockenlegen
  rationale: Mit dem Meer als Objekt bezeichnet das Verb hier das Austrocknen; das feminine Suffix bewahrt die Personifizierung Babylons.
- source_word: וְהֹבַשְׁתִּי אֶת מְקוֹרָהּ
  choice: und ihre Quelle versiegen lassen
  rationale: Die Kausativform bedeutet, etwas trocken werden zu lassen; bei einer Quelle ist „versiegen lassen“ im Deutschen präzise und idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält das Tetragramm ausdrücklich; „Jahwe“ gibt den persönlichen Bundesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Charakter der göttlichen Vergeltung
  choice: für dich Vergeltung üben
  alternative: dich rächen; deine Rache vollziehen
  rationale: Die Formulierung wahrt den Vergeltungsgedanken, legt ihn aber nicht vorschnell als bloß persönliche Rachsucht aus; der rechtliche Zusammenhang des vorausgehenden Ausdrucks bleibt hörbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachklang. „Siehe“ bewahrt den deiktischen Nachdruck, während „Rechtsstreit führen“, „Vergeltung üben“, „trockenlegen“ und „versiegen lassen“ für heutige Leser verständlich bleiben.
