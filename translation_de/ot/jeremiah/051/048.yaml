  text: וְ/רִנְּנ֤וּ עַל בָּבֶל֙ שָׁמַ֣יִם וָ/אָ֔רֶץ וְ/כֹ֖ל אֲשֶׁ֣ר בָּ/הֶ֑ם כִּ֧י מִ/צָּפ֛וֹן יָבוֹא לָ֥/הּ הַ/שּׁוֹדְדִ֖ים נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/048.yaml
  text: Then heaven and earth[a], and all that is in them, will shout for joy over Babylon, for from the north destroyers will come against her[c][b], declares Yahweh.
translation:
  language: de
  text: Dann werden Himmel und Erde[a] und alles, was in ihnen ist, über Babylon jubeln; denn von Norden werden Verwüster gegen sie kommen[b] – Ausspruch Jahwes.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden Himmel und Erde … über Babylon einen Jubelruf anstimmen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „kommen zu ihr“; im Zusammenhang ist eine feindliche Annäherung gemeint.'
    reason: lexical_alternative
  - marker: c
    text: „Jahwe“ gibt den Gottesnamen JHWH wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרִנְּנוּ
  choice: Dann werden … jubeln
  rationale: רנן bezeichnet lauten, freudigen Jubel. „Jubeln“ ist im Deutschen natürlich und bewahrt sowohl die Freude als auch ihren hörbaren Ausdruck; „Dann“ stellt den im Kontext naheliegenden Fortgang her.
- source_word: עַל בָּבֶל
  choice: über Babylon
  rationale: עַל bezeichnet bei einem Verb des Jubelns den Gegenstand oder Anlass der Freude. „Über Babylon“ lässt offen, ob Babylon selbst oder sein Fall als Anlass im Blick steht.
- source_word: שָׁמַיִם וָאָרֶץ וְכֹל אֲשֶׁר בָּהֶם
  choice: Himmel und Erde und alles, was in ihnen ist
  rationale: Die feste Wortverbindung umfasst die gesamte Schöpfung; die Formulierung bildet den hebräischen Relativsatz eng und zugleich idiomatisch ab.
- source_word: כִּי
  choice: denn
  rationale: כִּי führt hier die Begründung für den Jubel ein.
- source_word: מִצָּפוֹן
  choice: von Norden
  rationale: Die knappe Richtungsangabe entspricht dem wiederkehrenden Motiv des aus dem Norden kommenden Gerichts.
- source_word: יָבוֹא לָהּ
  choice: kommen … gegen sie
  rationale: Wörtlich steht „zu ihr kommen“; wegen der genannten Verwüster ist eine feindliche Annäherung gemeint. „Gegen sie“ macht dies verständlich, ohne das Bild weiter auszudeuten.
- source_word: הַשּׁוֹדְדִים
  choice: Verwüster
  rationale: Das Partizip von שׁדד bezeichnet Personen, die verheeren beziehungsweise plündern. „Verwüster“ bewahrt die umfassende zerstörerische Bedeutung besser als das engere „Plünderer“.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die traditionelle prophetische Formel wird knapp und feierlich wiedergegeben; der Gottesname wird als „Jahwe“ transliteriert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ gibt ihn im modernen Standarddeutsch als gebräuchliche wissenschaftliche Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Personifikation Babylons im femininen Pronomen לָהּ
  choice: gegen sie
  alternative: gegen es / gegen Babylon
  rationale: Das feminine Pronomen nimmt die als weiblich vorgestellte Stadt Babylon auf. „Sie“ bewahrt diese Personifikation und entspricht dem hebräischen Text.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist flüssig, bleibt aber nahe an der hebräischen Abfolge. Der Gedankenstrich hebt die feierliche prophetische Schlussformel ab.
