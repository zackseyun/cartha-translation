source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת חֹ֠מוֹת בָּבֶ֤ל הָֽ/רְחָבָה֙ עַרְעֵ֣ר תִּתְעַרְעָ֔ר וּ/שְׁעָרֶ֥י/הָ הַ/גְּבֹהִ֖ים בָּ/אֵ֣שׁ יִצַּ֑תּוּ וְ/יִֽגְע֨וּ עַמִּ֧ים בְּ/דֵי רִ֛יק וּ/לְאֻמִּ֥ים בְּ/דֵי אֵ֖שׁ וְ/יָעֵֽפוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/058.yaml
  text: 'Thus says Yahweh of hosts: Babylon’s broad wall shall be utterly razed[a], and her high gates shall be burned with fire. Peoples labor for emptiness, and nations for the fire[b], and they grow weary.'
translation:
  language: de
  text: 'So spricht Jahwe, der Herr der Heerscharen: Babylons breite Mauer wird völlig niedergerissen werden[a], und ihre hohen Tore werden im Feuer verbrannt. Völker mühen sich für Nichtiges ab und Nationen für das Feuer[b]; sie werden müde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Babylons breite Mauern werden völlig niedergerissen werden.“ Das hebräische Wort steht im Plural, kann aber kollektiv die Befestigungsanlage bezeichnen. Das hebräische Verb kann auch „völlig bloßgelegt“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hebräische Formulierung ist knapp: Die Arbeit der Nationen ist letztlich für das Feuer bestimmt, also dem Verbrennen preisgegeben.'
    reason: ambiguity
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: Bewahrt den Gottesnamen und gibt den traditionellen, semantisch weiten Titel צְבָאוֹת in würdigem, verständlichem Deutsch wieder.
- source_word: חֹמוֹת בָּבֶל הָרְחָבָה
  choice: Babylons breite Mauer
  rationale: חֹמוֹת ist formal Plural, kann hier aber kollektiv die gewaltige Befestigungsanlage Babylons bezeichnen; das singularische Adjektiv הָרְחָבָה unterstützt die kollektive Auffassung.
- source_word: עַרְעֵר תִּתְעַרְעָר
  choice: wird völlig niedergerissen werden
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Aussage; im Zusammenhang einer Stadtmauer bezeichnet das Bild vollständige Entblößung beziehungsweise Zerstörung.
- source_word: שְׁעָרֶיהָ הַגְּבֹהִים
  choice: seine hohen Tore
  rationale: Das feminine Suffix bezieht sich auf die Stadt Babylon; im Deutschen ist der Stadtname grammatisch sächlich, daher ‚seine‘.
- source_word: בָּאֵשׁ יִצַּתּוּ
  choice: werden mit Feuer verbrannt
  rationale: Gibt sowohl das Entzünden beziehungsweise Verbrennen als auch die ausdrückliche Nennung des Feuers wieder.
- source_word: וְיִגְעוּ עַמִּים בְּדֵי רִיק
  choice: Völker mühen sich für Nichtiges ab
  rationale: Bewahrt den Gedanken angestrengter, letztlich vergeblicher Arbeit und gibt רִיק als inhalts- und ergebnislose Nichtigkeit wieder.
- source_word: וּלְאֻמִּים בְּדֵי אֵשׁ
  choice: Nationen für das Feuer
  rationale: 'Erhält die knappe poetische Ellipse: Was die Nationen erarbeiten, ist letztlich dem Feuer bestimmt.'
- source_word: וְיָעֵפוּ
  choice: sie erschöpfen sich
  rationale: Das Verb bezeichnet das Ermüden als Ergebnis ihrer vergeblichen Anstrengung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den im hebräischen Text stehenden Eigennamen sichtbar; die traditionelle Ersatzlesung ‚der HERR‘ bleibt eine mögliche liturgische Wiedergabe.
- issue: Reichweite von צְבָאוֹת
  choice: Herr der Heerscharen
  alternative: Gott der Mächte / Herr der Armeen
  rationale: ‚Heerscharen‘ lässt offen, ob himmlische oder irdische Mächte oder beides gemeint sind, und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit poetischer Parallelität. Der Gottesname wird als „Jahwe“ wiedergegeben; archaische Satzformen werden vermieden, ohne den prophetischen Ton abzuschwächen.
