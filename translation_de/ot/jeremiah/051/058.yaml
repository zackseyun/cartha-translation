    issue: „sie erschöpfen sich“ für וְיָעֵפוּ
    rationale: Das hebräische Verb bezeichnet das Müdewerden. Die reflexive deutsche Form kann eine aktive Selbstverausgabung ausdrücken und verschiebt daher die Aussage leicht.
  - severity: low
    issue: „mit Feuer verbrannt“
    rationale: Die Formulierung ist im Deutschen stilistisch schwerfällig und tautologisch. „im Feuer verbrannt“ gibt בָּאֵשׁ idiomatisch wieder.
  - severity: low
    issue: „seine hohen Tore“
    rationale: Die Tore gehören semantisch zur Stadt Babylon; „ihre“ ist die im Deutschen natürliche Rückverweisung auf die Stadt.
