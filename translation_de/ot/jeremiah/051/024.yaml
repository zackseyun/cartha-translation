base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/024.yaml
  text: And I will repay Babylon and all the inhabitants of Chaldea for all their evil that they have done in Zion before your eyes[a], declares Yahweh.
translation:
  language: de
  text: Und ich werde Babylon und allen Bewohnern Chaldäas all das Böse[a] vergelten, das sie in Zion vor euren Augen getan haben, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „all das Unheil“ beziehungsweise „all das Unrecht“. Das hebräische Wort kann sowohl das moralisch Böse als auch das dadurch verursachte Leid und Unrecht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: Und ich werde … vergelten
  rationale: Das Piel von שׁלם bezeichnet hier eine erwidernde, vergeltende Bezahlung für begangene Taten. „Vergelten“ bewahrt den gerichtlichen Sinn und klingt im Deutschen würdig und natürlich.
- source_word: לְבָבֶל וּלְכֹל יוֹשְׁבֵי כַשְׂדִּים
  choice: Babylon und allen Bewohnern Chaldäas
  rationale: יוֹשְׁבֵי bezeichnet die dort Wohnenden; כַשְׂדִּים ist hier territorial als Chaldäa zu verstehen. Der Dativ entspricht den mit לְ markierten Empfängern der Vergeltung.
- source_word: אֵת כָּל רָעָתָם
  choice: all das Böse
  rationale: רָעָה kann sowohl moralisch Böses als auch schädigendes Unrecht oder Unheil bezeichnen. „Das Böse“ erhält die moralische Dimension, ohne die konkreten schädlichen Taten auszuschließen.
- source_word: אֲשֶׁר עָשׂוּ בְצִיּוֹן
  choice: das sie … in Zion getan haben
  rationale: בְ bedeutet seinem gewöhnlichen Sinn nach „in“. Die Formulierung bleibt daher bei den in Zion begangenen Taten, statt die Präposition deutend als „gegen“ wiederzugeben.
- source_word: לְעֵינֵיכֶם
  choice: vor euren Augen
  rationale: Die hebräische Wendung bezeichnet etwas, das die Angeredeten selbst offen mit angesehen haben. „Vor euren Augen“ bewahrt das anschauliche Bild.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Formel wird im Deutschen klar und feierlich mit „spricht Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den persönlichen Gottesnamen. „Jahwe“ gibt ihn als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Moralische Schuld oder verursachtes Unheil in רָעָתָם
  choice: all das Böse
  alternative: all das Unheil / all das Unrecht
  rationale: Im Gerichtszusammenhang umfasst das Wort sowohl die sittliche Verwerflichkeit als auch die schädigenden Taten. Der Haupttext wahrt die moralische Aussage; die Fußnote hält die weitere Bedeutungsbreite offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Satzstellung hält die Vergeltungsaussage eng am Hebräischen, ohne unnatürlich zu wirken.
