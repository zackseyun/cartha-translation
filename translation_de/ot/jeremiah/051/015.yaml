source:
  edition: WLC
  text: עֹשֵׂ֥ה אֶ֨רֶץ֙ בְּ/כֹח֔/וֹ מֵכִ֥ין תֵּבֵ֖ל בְּ/חָכְמָת֑/וֹ וּ/בִ/תְבוּנָת֖/וֹ נָטָ֥ה שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/015.yaml
  text: He made the earth by his power[a], he established the world by his wisdom, and by his understanding he stretched out the heavens.
translation:
  language: de
  text: Er hat die Erde durch seine Kraft geschaffen, den Erdkreis[a] durch seine Weisheit gegründet und durch seine Einsicht den Himmel ausgespannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die bewohnte Welt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֵׂה
  choice: hat … geschaffen
  rationale: Das Partizip von עשה bezeichnet hier im poetischen Schöpfungsbekenntnis Gottes schöpferisches Handeln. Das deutsche Perfekt ist natürlich und verbindet sich stimmig mit dem abschließenden Perfekt נָטָה.
- source_word: אֶרֶץ
  choice: die Erde
  rationale: Der kosmische Zusammenhang und die Gegenüberstellung zum Himmel sprechen für „Erde“ statt „Land“.
- source_word: בְּכֹחוֹ
  choice: durch seine Kraft
  rationale: בְּ ist instrumental gebraucht; „durch“ gibt dies idiomatisch wieder. כֹּחַ wird als „Kraft“ wiedergegeben.
- source_word: מֵכִין
  choice: gegründet
  rationale: Das Hifil von כון bezeichnet das feste Einrichten oder Gründen. „Gegründet“ bewahrt diesen stabilisierenden Sinn.
- source_word: תֵּבֵל
  choice: den Erdkreis
  rationale: תֵּבֵל meint die geordnete, bewohnte Welt. „Erdkreis“ unterscheidet den Ausdruck von אֶרֶץ und passt zum gehobenen poetischen Register, ohne unverständlich zu sein.
- source_word: בְּחָכְמָתוֹ
  choice: durch seine Weisheit
  rationale: Die instrumentale Wendung wird mit „durch“ wiedergegeben; „Weisheit“ ist die direkte und kontextgemäße Entsprechung von חָכְמָה.
- source_word: וּבִתְבוּנָתוֹ
  choice: und durch seine Einsicht
  rationale: „Einsicht“ hält die Bedeutungsnuance von תְּבוּנָה gegenüber der zuvor genannten „Weisheit“ erkennbar.
- source_word: נָטָה
  choice: ausgespannt
  rationale: נטה beschreibt in Schöpfungsaussagen das Ausspannen oder Ausbreiten des Himmels. „Ausgespannt“ ist prägnant und bildhaft.
- source_word: שָׁמָיִם
  choice: den Himmel
  rationale: Obwohl die hebräische Form morphologisch pluralisch ist, bezeichnet sie hier den Himmel als kosmischen Raum; der deutsche Singular ist dafür die natürliche Standardform.
theological_decisions:
- issue: Zeitliche Wiedergabe der beiden hebräischen Partizipien und des abschließenden Perfekts
  choice: Einheitliche Wiedergabe als vollzogenes Schöpfungshandeln im deutschen Perfekt
  alternative: 'Präsentische Wiedergabe: „Er schafft … gründet … spannt aus“; oder eine aspektuell gemischte Form'
  rationale: Die Zeile ist ein hymnisches Bekenntnis zu Gottes Schöpfungshandeln. Das deutsche Perfekt bildet den Rückblick auf dieses Handeln natürlich ab, ohne die grundsätzlich mögliche präsentische Aussage über Gott als Schöpfer dogmatisch auszuschließen.
translation_notes:
  register: Moderne, würdige poetische Standardsprache. Die parallele Dreierstruktur und die instrumentalen Wendungen „durch seine …“ bleiben erhalten. „Erdkreis“ wahrt die lexikalische Unterscheidung zwischen אֶרֶץ und תֵּבֵל.
