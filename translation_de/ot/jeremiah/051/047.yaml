review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und der Gerichtssinn sind zutreffend wiedergegeben. Allerdings beziehen sich die femininen Suffixe in „ihr ganzes Land“, „ihre Erschlagenen“ und „in ihrer Mitte“ im hebräischen Kontext auf Babylon. Der Wechsel zu „seine Erschlagenen“ und „in ihm“ lässt die Erschlagenen dagegen grammatisch zu „Land“ gehören und verwischt diesen Bezug. „Zur Rechenschaft ziehen“ ist für unbelebte Kultbilder zudem weniger unmittelbar als die gerichtliche Aussage von פקד על.
  naturalness: '„Darum seht“ wirkt im modernen Standarddeutsch als Anrede im Plural unnötig markiert; הִנֵּה ist eine aufmerksamkeitslenkende Partikel. „Darum: Siehe“ bewahrt den prophetischen Registerwert klarer. Der Bezug mit femininen Possessiv- und Ortspronomen ist auch im Deutschen bei Babylon natürlich.'
  terminology: „Götzenbilder“ ist im Kontext für פסילי Babylon sachgerecht. „Bestrafen“ gibt das strafende Einschreiten von פקד על verständlich und ohne unnötige Personifizierung durch die Wendung „zur Rechenschaft ziehen“ wieder. „Beschämt werden“ erhält die Scham-/Schandkomponente von תבוש.
  issues:
  - severity: medium
    issue: Pronomenbezug bei den Erschlagenen und der Ortsangabe
    rationale: „seine Erschlagenen“ und „in ihm“ werden im Deutschen auf das sächliche „Land“ bezogen. Die hebräischen femininen Suffixe setzen hingegen den Bezug auf Babylon fort; die Übersetzung sollte dies als „ihre Erschlagenen“ und „in ihrer Mitte“ kenntlich machen.
  - severity: low
    issue: Wiedergabe von הִנֵּה und פקד על
    rationale: „seht“ ist als pluralische Anrede nicht vom hebräischen Ausruf gefordert, und „zur Rechenschaft ziehen“ klingt gegenüber Kultbildern semantisch indirekt. „Siehe“ und „bestrafen“ sind näher am prophetischen Duktus und am Gerichtssinn.
  revised_text: 'Darum: Siehe, es kommen Tage, da werde ich die Götzenbilder Babylons bestrafen. Ihr ganzes Land wird beschämt werden, und alle ihre Erschlagenen werden in ihrer Mitte fallen.'
