- from: 'Darum seht: Es kommen Tage, da werde ich die Götzenbilder Babylons zur Rechenschaft ziehen. Ihr ganzes Land wird beschämt werden, und alle seine Erschlagenen werden mitten in ihm fallen.'
  to: 'Darum: Siehe, es kommen Tage, da werde ich die Götzenbilder Babylons bestrafen. Ihr ganzes Land wird beschämt werden, und alle ihre Erschlagenen werden in ihrer Mitte fallen.'
  rationale: Die Revision stellt den durchgehend auf Babylon bezogenen Suffixbezug wieder her und ersetzt zwei weniger präzise bzw. weniger natürliche Formulierungen. Die Aussage bleibt dabei in ihrer knappen, prophetischen Gerichtsankündigung erhalten.
