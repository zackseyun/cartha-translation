source:
  edition: WLC
  text: לָ/כֵן֙ הִנֵּ֣ה יָמִ֣ים בָּאִ֔ים וּ/פָקַדְתִּי֙ עַל פְּסִילֵ֣י בָבֶ֔ל וְ/כָל אַרְצָ֖/הּ תֵּב֑וֹשׁ וְ/כָל חֲלָלֶ֖י/הָ יִפְּל֥וּ בְ/תוֹכָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/047.yaml
  text: Therefore, look, days are coming when I will punish the carved images of Babylon, and all her land will be put to shame, and all her slain will fall in her midst.
translation:
  language: de
  text: 'Darum: Siehe, es kommen Tage, da werde ich die Götzenbilder Babylons bestrafen. Ihr ganzes Land wird beschämt werden, und alle ihre Erschlagenen werden in ihrer Mitte fallen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: הִנֵּה
  choice: seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Charakter der hebräischen Partikel in verständlichem, würdigem Deutsch.
- source_word: וּפָקַדְתִּי עַל
  choice: werde ich … zur Rechenschaft ziehen
  rationale: פָּקַד mit עַל bezeichnet hier ein strafendes Einschreiten; die Wendung bewahrt den Gerichtssinn, ohne ihn unnötig zu verengen.
- source_word: פְּסִילֵי בָבֶל
  choice: die Götzenbilder Babylons
  rationale: פְּסִילִים sind behauene beziehungsweise geschnitzte Kultbilder; „Götzenbilder“ macht ihre religiöse Funktion im Kontext deutlich.
- source_word: תֵּבוֹשׁ
  choice: wird beschämt werden
  rationale: Bewahrt die Scham- und Schandbedeutung des Verbs, statt sie lediglich als Niederlage zu paraphrasieren.
- source_word: חֲלָלֶיהָ
  choice: seine Erschlagenen
  rationale: Bezeichnet gewaltsam Getötete beziehungsweise Erschlagene; das deutsche Possessivpronomen bezieht sich grammatisch auf „Land“.
- source_word: בְתוֹכָהּ
  choice: mitten in ihm
  rationale: Gibt den räumlichen Ausdruck und den Bezug auf das Land wieder.
theological_decisions:
- issue: Art des göttlichen Vorgehens gegen die Kultbilder
  choice: zur Rechenschaft ziehen
  alternative: bestrafen/heimsuchen
  rationale: Die Übersetzung lässt die gerichtliche Bedeutung klar erkennen, ohne die semantische Spannweite von פָּקַד stärker als nötig festzulegen.
- issue: Bezeichnung der babylonischen Kultbilder
  choice: Götzenbilder
  alternative: Schnitzbilder/behauene Bilder
  rationale: Im Gerichtskontext ist die kultische Funktion wesentlich; zugleich wird keine bestimmte Gestalt oder Machart vorausgesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Ankündigungsstil wird durch „Es kommen Tage, da …“ erhalten. Nach dem Satzwechsel stehen die Pronomen grammatisch im Neutrum und beziehen sich eindeutig auf „Land“.
