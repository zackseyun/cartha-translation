source:
  edition: WLC
  text: אכל/נו הממ/נו נְבוּכַדְרֶאצַּר֮ מֶ֣לֶךְ בָּבֶל֒ הציג/נו כְּלִ֣י רִ֔יק בלע/נו כַּ/תַּנִּ֔ין מִלָּ֥א כְרֵשׂ֖/וֹ מֵֽ/עֲדָנָ֑/י הדיח/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/034.yaml
  text: Nebuchadnezzar king of Babylon has devoured me[a]; he has crushed me. He has set me down like an empty vessel; he has swallowed me like a sea monster; he has filled his belly with my delicacies[c][b]; he has cast me out.
translation:
  language: de
  text: Nebukadnezar, der König von Babylon, hat mich[c] verschlungen; er hat mich zermalmt. Er hat mich wie ein leeres Gefäß hingestellt; er hat mich wie ein Seeungeheuer[a] verschluckt. Er hat seinen Bauch mit meinen Köstlichkeiten[b] gefüllt; er hat mich ausgestoßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein Drache“ beziehungsweise „wie eine gewaltige Schlange“. Das hebräische Wort kann verschiedene große, bedrohliche Schlangen- oder Ungeheuerwesen bezeichnen; das Bild des Verschluckens spricht hier für „Seeungeheuer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit meinen erlesenen Dingen“ beziehungsweise „mit meinen Kostbarkeiten“.'
    reason: lexical_alternative
  - marker: c
    text: Als Sprecherin erscheint die personifizierte Stadt Zion/Jerusalem. Einige Formen des vorliegenden hebräischen Textes können auch pluralisch als „uns“ verstanden werden; der Zusammenhang und „meinen Köstlichkeiten“ stützen hier die Wiedergabe in der Einzahl.
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: אכלנו (אכל)
  choice: hat mich verschlungen
  rationale: Das Verb bedeutet wörtlich „essen, verzehren“. „Verschlungen“ bewahrt das gewaltsame Bild und verbindet sich natürlich mit dem späteren Bild des Ungeheuers.
- source_word: הממנו (המם)
  choice: und zermalmt
  rationale: Das Verb kann Verwirrung, Erschütterung oder vernichtende Zerstörung ausdrücken. „Zermalmt“ gibt im Parallelismus mit „verschlungen“ die zerstörerische Gewalt knapp und anschaulich wieder.
- source_word: הציגנו ... כלי ריק
  choice: hat mich hingestellt wie ein leeres Gefäß
  rationale: Die konkrete Handlung des Hinstellens bleibt erhalten; „wie ein leeres Gefäß“ gibt den Vergleich wieder, ohne ihn zu einer bloßen Zustandsaussage umzudeuten.
- source_word: בלענו
  choice: hat mich verschluckt
  rationale: Das unmittelbare Bild des Hinunterschluckens wird in natürlichem Deutsch beibehalten.
- source_word: כתנין
  choice: wie ein Seeungeheuer
  rationale: תנין kann eine große Schlange, ein drachenartiges Wesen oder ein Meeresungeheuer bezeichnen. Im Zusammenhang des Verschluckens passt „Seeungeheuer“, während die lexikalische Offenheit in einer Fußnote erhalten bleibt.
- source_word: מלא כרשו
  choice: hat seinen Bauch ... gefüllt
  rationale: כָּרֵשׂ bezeichnet den Bauch beziehungsweise Magen. „Bauch“ ist verständlich und bewahrt das drastische Fressbild.
- source_word: מעדני
  choice: mit meinen Köstlichkeiten
  rationale: Das Wort bezeichnet erlesene, angenehme oder kostbare Dinge. „Köstlichkeiten“ passt zum Bild des Fressens, kann hier aber zugleich Jerusalems wertvollen Besitz bezeichnen.
- source_word: הדיחנו
  choice: hat mich ausgestoßen
  rationale: Die Kausativform kann Vertreiben, Wegstoßen oder Wegspülen ausdrücken. „Ausgestoßen“ wahrt die gewaltsame Verwerfung und lässt zugleich eine Fortsetzung des Verschlingungsbildes anklingen, ohne sie physiologisch festzulegen.
theological_decisions:
- issue: Identität und Numerus der sprechenden Stimme
  choice: 'Die personifizierte Stadt Zion/Jerusalem spricht in der Einzahl: „mich“ und „meinen“.'
  alternative: 'Kollektive Wiedergabe im Plural: „uns“ und „unsere“.'
  rationale: Der Zusammenhang stellt Zion/Jerusalem als sprechende Person dar, und מֵעֲדָנָי ist eindeutig „meine Köstlichkeiten“. Da die im vorgelegten Text sichtbaren Suffixformen jedoch auch eine pluralische Auffassung nahelegen können, wird die Frage in einer Fußnote kenntlich gemacht und nicht stillschweigend bereinigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kräftiger poetischer Bildsprache. Die wiederholten Verben und das groteske Bild des verschlingenden Eroberers bleiben erhalten. „Hingestellt wie ein leeres Gefäß“ ist bewusst konkreter als eine glättende Wiedergabe wie „zu einem leeren Gefäß gemacht“.
