source:
  edition: WLC
  text: כִּ֠י לֹֽא אַלְמָ֨ן יִשְׂרָאֵ֤ל וִֽ/יהוּדָה֙ מֵֽ/אֱלֹהָ֔י/ו מֵֽ/יְהוָ֖ה צְבָא֑וֹת כִּ֤י אַרְצָ/ם֙ מָלְאָ֣ה אָשָׁ֔ם מִ/קְּד֖וֹשׁ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/005.yaml
  text: For Israel and Judah are not widowed from their God[a], from Yahweh of Armies[b], though their land is full of guilt against the Holy One of Israel.
translation:
  language: de
  text: Denn Israel und Juda sind nicht wie Witwen von ihrem Gott, von Jahwe der Heerscharen, zurückgelassen worden, obwohl ihr Land voller Schuld gegen den Heiligen Israels ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »voller Schuld vor dem Heiligen Israels«. Die hebräische Präposition kann hier unterschiedlich verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָן
  choice: verwitwet
  rationale: Die wörtliche Witwenmetapher bleibt erhalten und bringt zum Ausdruck, dass Israel und Juda von ihrem Bundesgott nicht verlassen sind.
- source_word: מֵאֱלֹהָיו מֵיְהוָה צְבָאוֹת
  choice: nicht von ihrem Gott, von Jahwe der Heerscharen
  rationale: Das wiederholte מִן bezeichnet nach אַלְמָן die Trennung, die ausdrücklich verneint wird. Der formal singularische Suffixbezug wird beim zusammengesetzten Kollektivsubjekt im Deutschen natürlich mit „ihrem“ wiedergegeben. „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ bewahrt die militärische und himmlische Bedeutungsbreite von צְבָאוֹת.
- source_word: כִּי (am Versanfang)
  choice: Denn
  rationale: Die Konjunktion begründet die vorausgehende Aufforderung im Kontext.
- source_word: כִּי (vor אַרְצָם)
  choice: obwohl
  rationale: Die konzessive Wiedergabe drückt den sachlichen Gegensatz zwischen Gottes fortbestehender Bindung an sein Volk und dessen wirklicher Schuld aus.
- source_word: מָלְאָה אָשָׁם
  choice: voller Schuld ist
  rationale: אָשָׁם bezeichnet hier am plausibelsten Schuld beziehungsweise Verschuldung, nicht ein Schuldopfer.
- source_word: מִקְּדוֹשׁ יִשְׂרָאֵל
  choice: gegen den Heiligen Israels
  rationale: מִן bezeichnet hier die Beziehung der Schuld zu demjenigen, dem gegenüber sie besteht. „Gegen“ ist im Deutschen idiomatisch, legt aber die mehrdeutige Präposition stärker aus; eine weniger festlegende Alternative wird in der Fußnote genannt.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: der Heilige Israels
  rationale: Der feste prophetische Gottestitel wird transparent und traditionsgemäß wiedergegeben.
theological_decisions:
- issue: Konzessive oder kausale Bedeutung des zweiten כִּי
  choice: 'konzessiv: „obwohl ihr Land voller Schuld … ist“'
  alternative: 'kausal: „denn ihr Land ist voller Schuld …“'
  rationale: Die konzessive Lesart wahrt die Spannung zwischen Gottes fortbestehender Treue und der Schuld des Volkes. Eine kausale Wiedergabe könnte missverständlich nahelegen, die Schuld begründe, weshalb Israel und Juda nicht verwitwet seien.
- issue: Beziehungsrichtung von מִקְּדוֹשׁ יִשְׂרָאֵל
  choice: „gegen den Heiligen Israels“
  alternative: „vor dem Heiligen Israels“ oder „vom Heiligen Israels her“
  rationale: Der Kontext spricht für Schuld gegenüber Gott, doch die hebräische Präposition lässt mehr als eine Nuance zu; diese Mehrdeutigkeit wird nicht verschwiegen, sondern in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche, aber verständliche Formulierung „nicht verwitwet“ erhält bewusst das Ehebild des hebräischen Textes. Die Wiederholung „nicht von ihrem Gott, von Jahwe …“ bildet die emphatische hebräische Konstruktion ab.
