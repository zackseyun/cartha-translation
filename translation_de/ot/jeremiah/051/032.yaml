base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/032.yaml
  text: The crossings have been seized[a], the marshes have been burned with fire[c][b], and the men of war are terrified.
translation:
  language: de
  text: Die Übergänge sind eingenommen worden[a], die Sümpfe hat man mit Feuer verbrannt[b], und die Krieger sind in Panik geraten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Die Furten sind eingenommen worden.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Teiche“; das hebräische Wort kann sumpfige Gewässer, Teiche oder Sumpfgebiete bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבָּרוֹת
  choice: die Übergänge
  rationale: מַעְבָּר bezeichnet eine Stelle oder einen Weg zum Überqueren. „Übergänge“ wahrt die mögliche Breite des Ausdrucks; im militärischen Zusammenhang sind wahrscheinlich Flussübergänge oder Furten gemeint.
- source_word: נִתְפָּשׂוּ
  choice: sind besetzt
  rationale: Der Nifal von תפש bezeichnet hier das Einnehmen bzw. In-die-Gewalt-Bekommen strategischer Übergänge. „Besetzt“ gibt das passive Ergebnis in natürlichem militärischem Deutsch wieder.
- source_word: הָאֲגַמִּים
  choice: die Sümpfe
  rationale: אֲגַמִּים kann sumpfige Gewässer, Teiche oder Schilfgebiete bezeichnen. „Sümpfe“ passt zur Landschaft Babyloniens und zu dem Bild des Verbrennens, ohne den Begriff auf Schilf zu verengen.
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: in Brand gesteckt
  rationale: 'Das Hebräische hat ein aktives Verb im unbestimmten Plural: „sie haben ... mit Feuer verbrannt“. Die deutsche unpersönliche Passivform fügt sich in die Meldungsfolge ein; „in Brand gesteckt“ ist natürlich und bewahrt die bewusste Brandlegung.'
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: die Kriegsleute
  rationale: Wörtlich „die Männer des Krieges“. „Kriegsleute“ wahrt die ausdrücklich männliche Gruppenbezeichnung und den militärischen Sinn in knapper, würdiger Sprache.
- source_word: נִבְהָלוּ
  choice: sind in Panik geraten
  rationale: Der Nifal von בהל bezeichnet Erschrecken, Bestürzung oder panische Angst. „In Panik geraten“ gibt sowohl die Intensität als auch den durch das Perfekt bezeichneten Eintritt des Zustands wieder.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die asyndetische Meldungsfolge wird beibehalten. Das aktive unbestimmte „sie verbrannten“ des Hebräischen wird idiomatisch unpersönlich wiedergegeben; eine Fußnote ist dafür nicht nötig, da kein sachlicher Akteur genannt wird. „Kriegsleute“ ist bewusst formnäher als „Krieger“, wirkt jedoch noch allgemein verständlich.
