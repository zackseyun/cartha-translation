source:
  edition: WLC
  text: אֶל חוֹמֹ֨ת בָּבֶ֜ל שְׂאוּ נֵ֗ס הַחֲזִ֨יקוּ֙ הַ/מִּשְׁמָ֔ר הָקִ֨ימוּ֙ שֹֽׁמְרִ֔ים הָכִ֖ינוּ הָ/אֹֽרְבִ֑ים כִּ֚י גַּם זָמַ֣ם יְהוָ֔ה גַּם עָשָׂ֕ה אֵ֥ת אֲשֶׁר דִּבֶּ֖ר אֶל יֹשְׁבֵ֥י בָבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/012.yaml
  text: Against the walls of Babylon[a], lift up a signal; strengthen the watch; station watchmen; prepare the ambushes[c][b]. For Yahweh has both planned and done what he spoke against the inhabitants of Babylon.
translation:
  language: de
  text: Gegen die Mauern Babylons richtet ein Feldzeichen auf[a]! Verstärkt die Wache, stellt Wächter auf, bereitet die Hinterhalte vor[b]! Denn Jahwe hat geplant und auch ausgeführt, was er den Bewohnern Babylons gesagt hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „richtet ein Signal auf“ beziehungsweise „hisst ein Banner“. Das hebräische Wort bezeichnet ein erhöhtes, weithin sichtbares, oft militärisches Zeichen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „macht die im Hinterhalt Liegenden bereit“. Das Hebräische kann sowohl die lauernden Männer als auch die Hinterhalte bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „was er zu den Bewohnern Babylons geredet hat“; im Zusammenhang ist ein gegen sie gerichtetes Gerichtswort gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חוֹמֹת בָּבֶל
  choice: Gegen die Mauern Babylons
  rationale: אֶל bezeichnet zunächst die Richtung („zu/auf … hin“); im militärischen Zusammenhang gibt „gegen“ die feindliche Ausrichtung der Befehle natürlich wieder.
- source_word: שְׂאוּ נֵס
  choice: richtet ein Feldzeichen auf
  rationale: נֵס ist ein weithin sichtbares Signal, Banner oder Feldzeichen. „Feldzeichen“ bewahrt hier den militärischen Charakter.
- source_word: הַחֲזִיקוּ הַמִּשְׁמָר
  choice: Verstärkt die Wache
  rationale: Der Hifil von חזק bedeutet hier „stärken/verstärken“, מִשְׁמָר die Wache beziehungsweise Bewachung.
- source_word: הָקִימוּ שֹׁמְרִים
  choice: stellt Wächter auf
  rationale: Der Hifil von קום bezeichnet mit שֹׁמְרִים das Aufstellen oder Stationieren von Wächtern.
- source_word: הָכִינוּ הָאֹרְבִים
  choice: bereitet die Hinterhalte vor
  rationale: הָאֹרְבִים kann die im Hinterhalt Liegenden oder die Hinterhalte selbst bezeichnen; die gewählte Form ist im Deutschen natürlich und lässt die militärische Maßnahme klar erkennen.
- source_word: כִּי גַּם זָמַם יְהוָה גַּם עָשָׂה
  choice: Denn Jahwe hat geplant und auch ausgeführt
  rationale: Die Korrespondenz גַּם … גַּם verbindet Plan und Verwirklichung. „ausgeführt“ verdeutlicht bei עשה die Umsetzung des Plans.
- source_word: אֵת אֲשֶׁר דִּבֶּר אֶל יֹשְׁבֵי בָבֶל
  choice: was er den Bewohnern Babylons angekündigt hat
  rationale: Wörtlich steht „was er zu den Bewohnern Babylons geredet hat“. „angekündigt“ bewahrt die Adressierung durch אֶל und lässt im Kontext erkennen, dass es sich um ein Gerichtswort handelt.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; „Jahwe“ ist die etablierte deutsche Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen, statt ihn durch den traditionellen Ersatztitel wiederzugeben.
- issue: Richtung des göttlichen Redens gegenüber Babylon
  choice: den Bewohnern Babylons angekündigt
  alternative: gegen die Bewohner Babylons geredet
  rationale: אֶל bedeutet formal „zu/an“. Der Gerichtskontext gibt dem Gesagten eine feindliche Wirkung, doch die Übersetzung löst die Präposition nicht unnötig zu „gegen“ auf; die Fußnote nennt die kontextuelle Alternative.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper militärischer Befehlsfolge. „Feldzeichen“ ist leicht gehoben, aber allgemein verständlich und sachlich genauer als das breitere „Zeichen“.
