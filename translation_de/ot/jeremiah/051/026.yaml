id: JER.51.26
reference: Jeremiah 51:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹֽא יִקְח֤וּ מִמְּ/ךָ֙ אֶ֣בֶן לְ/פִנָּ֔ה וְ/אֶ֖בֶן לְ/מֽוֹסָד֑וֹת כִּֽי שִׁמְמ֥וֹת עוֹלָ֛ם תִּֽהְיֶ֖ה נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/026.yaml
  text: And they will not take from you a stone for a corner or a stone for foundations[a], for you will be everlasting desolations[b], declares Yahweh.
translation:
  language: de
  text: Und man wird von dir keinen Stein für eine Ecke und keinen Stein für Fundamente[a] nehmen; denn du wirst eine Stätte ewiger Verwüstung sein[b] – so spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „keinen Eckstein und keinen Grundstein“. Wörtlich: „einen Stein für eine Ecke und einen Stein für Fundamente“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „du wirst ewige Verwüstungen sein“. Das Hebräische steht bei „Verwüstungen“ im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְחוּ
  choice: man wird … nehmen
  rationale: Das unbestimmte Subjekt der 3. Person Plural wird im Deutschen natürlich mit „man“ wiedergegeben; das Imperfekt hat hier im prophetischen Gerichtswort Zukunftsbedeutung.
- source_word: מִמְּךָ
  choice: von dir
  rationale: Das maskuline Singularsuffix bewahrt die direkte Anrede Babylons als personifizierte Größe.
- source_word: אֶבֶן לְפִנָּה
  choice: einen Stein für eine Ecke
  rationale: Die Wiedergabe bleibt nahe am wörtlichen Ausdruck und legt sich nicht vorschnell auf den technischen Begriff „Eckstein“ fest.
- source_word: וְאֶבֶן לְמוֹסָדוֹת
  choice: und keinen Stein für Fundamente
  rationale: Die Wiederholung von „keinen“ ist im Deutschen aufgrund der Negation erforderlich; „Fundamente“ erhält den Plural des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung dafür ein, dass kein brauchbarer Baustein von Babylon genommen werden wird.
- source_word: שִׁמְמוֹת עוֹלָם
  choice: für immer eine Trümmerstätte
  rationale: „Trümmerstätte“ gibt den Zustand völliger Verwüstung idiomatisch wieder; „für immer“ bewahrt die zeitliche Aussage von עוֹלָם. Die hebräische Pluralform wird in einer Fußnote sichtbar gehalten.
- source_word: תִּהְיֶה
  choice: du wirst … sein
  rationale: Die einfache Zukunft von היה wird direkt mit „wirst sein“ wiedergegeben, ohne den möglichen Ergebnisaspekt durch „werden“ festzuschreiben.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die geläufige, würdige deutsche Prophetenformel gibt נְאֻם idiomatisch wieder und bewahrt den Gottesnamen als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass der im Ausgangstext ausdrücklich verwendete Gottesname erkennbar bleibt.
- issue: Singular oder Plural bei שִׁמְמוֹת
  choice: eine Trümmerstätte
  alternative: Verwüstungen
  rationale: Der hebräische Plural kann die umfassende Verwüstung intensivieren. Im Deutschen ist der prädikative Singular idiomatischer; die formnähere Alternative wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetischem Ton. Das Semikolon gliedert Urteil und Begründung; die direkte Anrede Babylons bleibt erhalten.
