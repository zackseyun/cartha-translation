id: JER.51.53
reference: Jeremiah 51:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי תַעֲלֶ֤ה בָבֶל֙ הַ/שָּׁמַ֔יִם וְ/כִ֥י תְבַצֵּ֖ר מְר֣וֹם עֻזָּ֑/הּ מֵ/אִתִּ֗/י יָבֹ֧אוּ שֹׁדְדִ֛ים לָ֖/הּ נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/053.yaml
  text: Though Babylon should ascend to the heavens[a], and though she should fortify her lofty stronghold, destroyers will come to her from me[b], declares Yahweh.
translation:
  language: de
  text: Selbst wenn Babylon bis zum Himmel hinaufstiege und seine hoch gelegene Festung[a] uneinnehmbar machte, werden von mir Verwüster[b] gegen es kommen – so spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Höhe seiner Stärke“ beziehungsweise „Macht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Plünderer“. Das hebräische Wort kann Menschen bezeichnen, die durch Plündern Verwüstung anrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי ... וְכִי
  choice: Selbst wenn ... und ...
  rationale: 'Die beiden Partikeln leiten hier parallele, konzessive Bedingungen ein: Nicht einmal Babylons äußerste Erhöhung und Befestigung können das angekündigte Gericht verhindern.'
- source_word: תַעֲלֶה
  choice: hinaufstiege
  rationale: עלה bedeutet „hinaufgehen/aufsteigen“. Der Konjunktiv II gibt zusammen mit „selbst wenn“ die konzessive Aussage im natürlichen Deutschen wieder.
- source_word: בָבֶל
  choice: Babylon
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: הַשָּׁמַיִם
  choice: den Himmel
  rationale: Das hebräische Pluralwort bezeichnet hier den Himmel als unerreichbare Höhe; der deutsche Singular ist idiomatisch und bewahrt das Bild.
- source_word: תְבַצֵּר
  choice: uneinnehmbar machte
  rationale: Das Piel von בצר bezeichnet das Befestigen beziehungsweise Unzugänglichmachen. „Uneinnehmbar machte“ verdeutlicht die beabsichtigte militärische Sicherung.
- source_word: מְרוֹם עֻזָּהּ
  choice: seine hoch gelegene Festung
  rationale: Wörtlich steht „die Höhe seiner Stärke“. Im Zusammenhang mit dem Befestigen bezeichnet die Wendung den hoch gelegenen Ort, auf den Babylon seine Wehrkraft gründet. Die konkrete Wiedergabe bleibt in einer Fußnote transparent.
- source_word: מֵאִתִּי
  choice: von mir
  rationale: Die Präposition kennzeichnet Jahwe als Ursprung beziehungsweise Auftraggeber der kommenden Verwüster.
- source_word: יָבֹאוּ
  choice: werden ... kommen
  rationale: Das Verb kündigt im prophetischen Zusammenhang ein zukünftiges Geschehen an.
- source_word: שֹׁדְדִים
  choice: Verwüster
  rationale: Das Wort bezeichnet Menschen, die plündern und dabei verheeren. „Verwüster“ erfasst die umfassende Zerstörungswirkung; „Plünderer“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: לָהּ
  choice: gegen es
  rationale: Das Suffix bezieht sich im Hebräischen auf das grammatisch feminine Babylon. Wegen des feindlichen Kommens ist „gegen“ im Deutschen kontextgerecht; das deutsche „Babylon“ wird mit dem Neutrum aufgenommen.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die feste prophetische Schlussformel wird in würdigem, geläufigem Deutsch wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Konjunktiv in den beiden konzessiven Aussagen erhält die zugespitzte, hypothetische Bildsprache. Da „Babylon“ im Deutschen sächlich ist, stehen die Rückbezüge im Neutrum; die feminine Personifikation des Hebräischen wird nicht künstlich ins Deutsche übertragen.
