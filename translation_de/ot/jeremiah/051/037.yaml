  terminology: „Babylon“, „Trümmerhaufen“, „Behausung“, „Schakale“ und „Entsetzen“ sind für modernes, würdiges Standarddeutsch angemessen. Die Fußnote zu den Schakalen vermeidet eine unvertretbare zoologische Festlegung. Die Fußnote zu שְׁרֵקָה sollte die idiomatische Funktion als Reaktion auf die Verwüstung ausdrücklich benennen.
