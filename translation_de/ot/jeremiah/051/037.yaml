  text: וְ/הָיְתָה֩ בָבֶ֨ל לְ/גַלִּ֧ים מְעוֹן תַּנִּ֛ים שַׁמָּ֥ה וּ/שְׁרֵקָ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/037.yaml
  text: And Babylon will become heaps[a], a haunt of jackals, a horror and a hissing[c][b], with no inhabitant.
translation:
  language: de
  text: Und Babylon wird zu Trümmerhaufen werden, zur Behausung von Schakalen[a], zum Entsetzen und zum Gegenstand höhnischen Pfeifens[b], ohne Bewohner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Tierart ist unsicher; ältere Übersetzungen geben das Wort teilweise mit „Drachen“ wieder.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann „Pfeifen“ oder „Zischen“ bedeuten; gemeint ist eine höhnische Reaktion auf die verwüstete Stadt.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird … werden
  rationale: Das Qal-Perfekt mit vorangestelltem וְ hat im prophetischen Zusammenhang Zukunfts- und Ergebnissinn; die Wiedergabe bezeichnet den Übergang in den angekündigten Zustand.
- source_word: בָבֶל
  choice: Babylon
  rationale: Die im modernen Deutschen geläufige Bezeichnung der Stadt.
- source_word: לְגַלִּים
  choice: zu Trümmerhaufen
  rationale: Die pluralische Form גַּלִּים bezeichnet Haufen oder Schutthügel; „Trümmerhaufen“ bewahrt sowohl den Plural als auch das Bild einer zerstörten Stadt.
- source_word: מְעוֹן
  choice: zur Behausung
  rationale: Das Wort bezeichnet einen Wohn- oder Aufenthaltsort. „Behausung“ passt zu wilden Tieren in einer verlassenen Stadt und wahrt den gehobenen prophetischen Ton.
- source_word: תַּנִּים
  choice: von Schakalen
  rationale: In prophetischen Schilderungen verwüsteter Orte wird der Tiername gewöhnlich auf Schakale bezogen; die genaue zoologische Bestimmung bleibt jedoch unsicher.
- source_word: שַׁמָּה
  choice: zum Entsetzen
  rationale: Das Substantiv bezeichnet einen verwüsteten Zustand, der Bestürzung oder Entsetzen hervorruft. Die Wiedergabe hält Wirkung und Zustand zusammen.
- source_word: וּשְׁרֵקָה
  choice: und zum höhnischen Pfeifen
  rationale: Das Wort bezeichnet Pfeifen oder Zischen als Reaktion auf die Verwüstung. „Höhnisch“ macht die im Kontext naheliegende spöttische Funktion verständlich, ohne das Lautbild aufzugeben.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ohne einen Bewohner
  rationale: Die Konstruktion drückt das völlige Fehlen von Bewohnern aus und wird knapp sowie quellennah wiedergegeben.
