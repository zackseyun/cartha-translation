id: JER.51.18
reference: Jeremiah 51:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֶ֣בֶל הֵ֔מָּה מַעֲשֵׂ֖ה תַּעְתֻּעִ֑ים בְּ/עֵ֥ת פְּקֻדָּתָ֖/ם יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/018.yaml
  text: They are vanity[a], a work of delusion[b]; at the time of their punishment they will perish.
translation:
  language: de
  text: Sie sind nichtig, ein Machwerk der Täuschung[a]; zur Zeit ihrer Heimsuchung[b] werden sie vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Spottgebilde«, »ein Trugwerk« oder »ein Machwerk des Irrtums«.'
    reason: lexical_alternative
  - marker: b
    text: Das mit »Heimsuchung« wiedergegebene Wort kann hier auch »Bestrafung« oder »Abrechnung« bedeuten; gemeint ist die Zeit des Gerichts über sie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: nichtig
  rationale: Das Wort bezeichnet Leere, Nichtigkeit oder Unbeständigkeit. Im Götzenkontext gibt „nichtig“ ihre Wert- und Wirkungslosigkeit natürlich und prägnant wieder.
- source_word: הֵמָּה
  choice: sie sind
  rationale: Das selbstständige Pronomen bildet eine betonte Aussage; im Deutschen ist die Kopula erforderlich.
- source_word: מַעֲשֵׂה תַּעְתֻּעִים
  choice: ein Machwerk der Täuschung
  rationale: מַעֲשֵׂה bezeichnet etwas Gemachtes; „Machwerk“ passt zur polemischen Bezeichnung der Götzen. תַּעְתֻּעִים kann Täuschung, Trug, Irrtum oder Spott bezeichnen; „Täuschung“ bewahrt den Gedanken irreführender Unwirklichkeit.
- source_word: בְּעֵת פְּקֻדָּתָם
  choice: zur Zeit ihrer Heimsuchung
  rationale: Die Formulierung erhält sowohl die zeitliche Struktur als auch die Bedeutungsbreite von פְּקֻדָּה. Im Gerichtskontext meint die Heimsuchung ein strafendes Einschreiten.
- source_word: יֹאבֵדוּ
  choice: werden sie vergehen
  rationale: Die Wiedergabe bewahrt die intransitive Bedeutung von אבד und bezeichnet ihr Zugrundegehen, ohne ausdrücklich eine verursachende Passivform einzuführen.
theological_decisions:
- issue: Aussage der Götzenpolemik
  choice: Die Götzen werden als nichtige, täuschende Machwerke bezeichnet, die beim göttlichen Gericht vergehen.
  alternative: תַּעְתֻּעִים kann stärker als „Spottgebilde“, „Irrwerke“ oder „Trugwerk“ verstanden werden.
  rationale: Der unmittelbare Zusammenhang und die Parallele in Jeremia 10,15 verbinden die Nichtigkeit der Götzen mit ihrem Untergang zur Zeit der Heimsuchung. Die Übersetzung wahrt diese Spannung, ohne über den Text hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Machwerk“ trägt den polemischen Ton des Zusammenhangs, ohne umgangssprachlich zu wirken; „Heimsuchung“ bewahrt die Mehrdeutigkeit des hebräischen Gerichtsausdrucks und wird in der Fußnote erläutert.
