source:
  edition: WLC
  text: נִבְעַ֤ר כָּל אָדָם֙ מִ/דַּ֔עַת הֹבִ֥ישׁ כָּל צֹרֵ֖ף מִ/פָּ֑סֶל כִּ֛י שֶׁ֥קֶר נִסְכּ֖/וֹ וְ/לֹא ר֥וּחַ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/017.yaml
  text: Every man is made brutish[a], without knowledge; every metalworker is put to shame by his idol, for his cast image is falsehood, and there is no breath in them.
translation:
  language: de
  text: Jeder Mensch ist ohne Erkenntnis töricht geworden. Jeder Metallhandwerker wird durch sein Götzenbild beschämt; denn sein gegossenes Bild ist Lüge, und in ihnen ist kein Atem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: kein Geist. Das hebräische Wort kann „Atem“, „Wind“ oder „Geist“ bedeuten; hier hebt „Atem“ hervor, dass die Götzenbilder leblos sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְעַר
  choice: handelt töricht
  rationale: Das Nifal von בער bezeichnet ein vernunftloses, abgestumpftes oder törichtes Sein bzw. Verhalten. In Verbindung mit „ohne Erkenntnis“ gibt „handelt töricht“ den Sinn verständlich und mit der wertenden Schärfe des prophetischen Wortes wieder.
- source_word: כָּל אָדָם
  choice: Jeder Mensch
  rationale: אָדָם bezeichnet hier den Menschen allgemein. „Jeder Mensch“ bewahrt den distributiven Singular und ist im Deutschen zugleich eindeutig generisch.
- source_word: מִדַּעַת
  choice: ohne Erkenntnis
  rationale: מִן hat bei dem abstrakten Substantiv privative Bedeutung. „Ohne Erkenntnis“ entspricht der Aussage, dass dem Menschen Einsicht fehlt.
- source_word: הֹבִישׁ
  choice: wird beschämt
  rationale: 'Das Hifil von בוש hat kausative Bedeutung: Der Handwerker wird durch das Ergebnis seiner Arbeit der Beschämung preisgegeben.'
- source_word: צֹרֵף
  choice: Metallhandwerker
  rationale: Das Partizip kann einen Schmelzer, Läuterer oder einen mit Metall arbeitenden Handwerker bezeichnen. Im Zusammenhang der Herstellung eines gegossenen Bildes ist der breite Ausdruck „Metallhandwerker“ sachgerecht.
- source_word: מִפָּסֶל
  choice: durch sein Götzenbild
  rationale: פֶּסֶל bezeichnet ein kultisches Bild beziehungsweise einen Götzen. מִן bezeichnet hier den Anlass oder das Mittel der Beschämung. Das Possessivpronomen wird im Deutschen aus dem Zusammenhang mit dem jeweiligen Handwerker sinnvoll ergänzt.
- source_word: שֶׁקֶר
  choice: Lüge
  rationale: Das Prädikatsnomen bezeichnet Falschheit, Täuschung oder Lüge. „Lüge“ ist knapp, kräftig und bewahrt den polemischen Ton.
- source_word: נִסְכּוֹ
  choice: sein gegossenes Bild
  rationale: Der Ausdruck bezeichnet ein durch Gießen hergestelltes Kultbild. „Gegossenes Bild“ macht Herstellungsweise und Bezug zum Handwerker deutlich.
- source_word: וְלֹא רוּחַ בָּם
  choice: und kein Atem ist in ihnen
  rationale: רוּחַ kann Atem, Wind oder Geist bedeuten. Hier steht die Leblosigkeit der Götzenbilder im Vordergrund, weshalb „Atem“ im Haupttext am klarsten ist. Der Plural fasst die zuvor genannten Bilder als Gruppe auf.
theological_decisions:
- issue: Generische Bedeutung von אָדָם
  choice: Jeder Mensch
  alternative: Jeder Mann; alle Menschen
  rationale: Der Ausdruck ist eine allgemeine Aussage über den Menschen, nicht speziell über männliche Personen. „Jeder Mensch“ wahrt sowohl den generischen Sinn als auch die singularische, distributive Form.
- issue: Bedeutung von רוּחַ in der Götzenpolemik
  choice: Atem
  alternative: Geist
  rationale: Die Aussage betont, dass die von Menschen gefertigten Bilder kein Leben besitzen. „Atem“ bringt diesen Gegensatz unmittelbar zum Ausdruck; die semantisch mögliche Wiedergabe „Geist“ wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Schärfe. „Metallhandwerker“ vermeidet eine unbelegte Einschränkung auf Gold, und „Götzenbild“ macht den kultischen Zusammenhang für heutige Leser unmittelbar verständlich.
