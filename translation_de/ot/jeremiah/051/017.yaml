  naturalness: Modernes Standarddeutsch ist weitgehend erreicht. „In ihnen ist kein Atem“ ist im Deutschen flüssiger als „kein Atem ist in ihnen“ und bewahrt zugleich die hebräische Ortsbestimmung.
  terminology: „Jeder Mensch“, „Metallhandwerker“, „Götzenbild“, „gegossenes Bild“ und „Lüge“ sind tragfähige Wiedergaben. „Atem“ ist im Kontext der Leblosigkeit von Bildern gut begründet; die lexikalische Alternative „Geist“ bleibt in der Fußnote erhalten.
