  text: כִּֽי שֹׁדֵ֤ד יְהוָה֙ אֶת בָּבֶ֔ל וְ/אִבַּ֥ד מִמֶּ֖/נָּה ק֣וֹל גָּד֑וֹל וְ/הָמ֤וּ גַלֵּי/הֶם֙ כְּ/מַ֣יִם רַבִּ֔ים נִתַּ֥ן שְׁא֖וֹן קוֹלָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/055.yaml
  text: For Yahweh is devastating Babylon and destroying from her the great sound[a]. Their waves roar like many waters[b]; the noise of their voice is given.
translation:
  language: de
  text: Denn Jahwe verwüstet Babylon und tilgt den gewaltigen Lärm aus ihr.[a] Ihre Wellen brausen wie gewaltige Wasser, und das Tosen ihrer Stimme erschallt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den lauten Klang«. Das hebräische Wort kann »Stimme«, »Laut« oder »Lärm« bedeuten; gemeint ist wahrscheinlich der mächtige Tumult Babylons.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Das Tosen ihrer Stimme wird gegeben.« Gemeint ist, dass der Lärm ihrer Stimme hervorgebracht wird oder erschallt. Das »ihrer« kann sich auf Babylons Angreifer oder auf die im Bild dargestellten Mächte beziehen.'
    reason: idiom_and_ambiguity
lexical_decisions:
- source_word: שֹׁדֵד
  choice: verwüstet
  rationale: Das Partizip bezeichnet ein gegenwärtiges oder unmittelbar bevorstehendes, fortdauernd dargestelltes Handeln. »Verwüstet« gibt die umfassende Zerstörung einer Stadt treffend wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; »Jahwe« ist die im modernen Deutschen geläufige Form.
- source_word: וְאִבַּד מִמֶּנָּה
  choice: und tilgt … aus ihr
  rationale: Die Form bezeichnet hier das Beseitigen dessen, was in Babylon zu hören war. »Aus ihr« bewahrt die feminine Personifizierung der Stadt.
- source_word: קוֹל גָּדוֹל
  choice: den gewaltigen Lärm
  rationale: קוֹל kann Stimme, Laut oder Geräusch bedeuten; im Zusammenhang ist der laute Tumult Babylons wahrscheinlich, ohne dass die akustische Bildsprache eingeengt wird.
- source_word: וְהָמוּ גַלֵּיהֶם
  choice: Ihre Wellen brausen
  rationale: Das Verb beschreibt laute, unruhige Bewegung und passt idiomatisch zu Wellen. Das Possessivpronomen lässt den im Hebräischen nicht ausdrücklich genannten Bezug offen.
- source_word: כְּמַיִם רַבִּים
  choice: wie gewaltige Wasser
  rationale: Die Wendung bezeichnet eine überwältigende, tosende Wassermasse. »Gewaltige Wasser« klingt im Deutschen natürlich und bewahrt die Größe und Kraft des Bildes.
- source_word: נִתַּן שְׁאוֹן קוֹלָם
  choice: laut erhebt sich ihr Tosen
  rationale: Wörtlich wird das Tosen ihrer Stimme »gegeben«; die deutsche Formulierung gibt die idiomatische Bedeutung wieder, dass ein mächtiger Laut hervorgebracht wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen, nicht den Titel אֲדֹנָי. Die Umschrift bewahrt diesen Unterschied.
- issue: Bezug von גַלֵּיהֶם und קוֹלָם
  choice: Der Bezug bleibt durch »ihre« offen
  alternative: ausdrückliche Zuordnung zu Babylons Angreifern oder zu Babylon
  rationale: Die maskulin-pluralischen Suffixe haben im unmittelbaren Satz keinen eindeutig genannten Bezug. Eine ausdrückliche Identifizierung würde die echte Mehrdeutigkeit des hebräischen Bildes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Klangbildsprache wird mit »Lärm«, »brausen« und »Tosen« bewahrt; schwer verständliche hebräische Idiomatik wird maßvoll natürlich wiedergegeben.
