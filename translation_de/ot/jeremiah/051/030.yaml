reference: Jeremiah 51:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: חָדְלוּ֩ גִבּוֹרֵ֨י בָבֶ֜ל לְ/הִלָּחֵ֗ם יָֽשְׁבוּ֙ בַּ/מְּצָד֔וֹת נָשְׁתָ֥ה גְבוּרָתָ֖/ם הָי֣וּ לְ/נָשִׁ֑ים הִצִּ֥יתוּ מִשְׁכְּנֹתֶ֖י/הָ נִשְׁבְּר֥וּ בְרִיחֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/030.yaml
  text: The warriors of Babylon have stopped fighting; they sit in the strongholds[a]. Their strength has failed; they have become like women. Her dwellings are set on fire; her bars are broken.
translation:
  language: de
  text: Babylons Krieger haben aufgehört zu kämpfen; sie sitzen in den Festungen. Ihre Kraft ist versiegt; sie sind wie Frauen geworden[a]. Man hat ihre Wohnstätten in Brand gesteckt; ihre Riegel sind zerbrochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Sie sind zu Frauen geworden“ – ein hebräischer Spott über den Verlust des Mutes im Kampf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ ... לְהִלָּחֵם
  choice: haben aufgehört zu kämpfen
  rationale: חדל mit dem Infinitiv bezeichnet das Einstellen einer Tätigkeit. Die deutsche Wendung ist natürlich und gibt den vollzogenen Abbruch des Kampfes wieder.
- source_word: גִבּוֹרֵי בָבֶל
  choice: Babylons Krieger
  rationale: גִבּוֹרֵי meint im militärischen Zusammenhang kampferprobte oder starke Männer; „Krieger“ ist präzise und nicht archaisch.
- source_word: יָשְׁבוּ בַּמְּצָדוֹת
  choice: sie sitzen in den Festungen
  rationale: יָשְׁבוּ kann „sitzen“, „bleiben“ oder „wohnen“ bedeuten. Hier zeichnet „sitzen“ anschaulich ihren passiven Rückzug in befestigte Anlagen; מְצָדוֹת bezeichnet Festungen beziehungsweise befestigte Orte.
- source_word: נָשְׁתָה גְבוּרָתָם
  choice: Ihre Kraft ist versiegt
  rationale: נָשְׁתָה beschreibt ein Austrocknen oder Erschöpftsein. „Ist versiegt“ bewahrt das Bild des Schwindens und passt idiomatisch zu גְבוּרָה als Kraft beziehungsweise Kampfstärke.
- source_word: הָיוּ לְנָשִׁים
  choice: sie sind wie Frauen geworden
  rationale: Die Wendung ist ein antiker, geschlechtsspezifischer Spott über den Verlust von Kampfesmut. „Wie Frauen“ macht den gemeinten Vergleich deutlich, ohne die scharfe Rhetorik zu glätten.
- source_word: הִצִּיתוּ מִשְׁכְּנֹתֶיהָ
  choice: Man hat ihre Wohnstätten in Brand gesteckt
  rationale: Das hebräische Verb ist aktiv im Plural, nennt das handelnde Subjekt aber nicht. Das unpersönliche „man“ bewahrt diese Unbestimmtheit; „Wohnstätten“ gibt den breiten Sinn von מִשְׁכָּן wieder.
- source_word: נִשְׁבְּרוּ בְרִיחֶיהָ
  choice: ihre Riegel sind zerbrochen
  rationale: Der Nifal bezeichnet das Zerbrechen der Riegel. Im Zusammenhang sind die Verschlussriegel der Tore gemeint, doch das knappe „Riegel“ genügt wie im Hebräischen.
theological_decisions:
- issue: Wiedergabe von הָיוּ לְנָשִׁים
  choice: sie sind wie Frauen geworden
  alternative: sie sind zu Frauen geworden
  rationale: Der Text verwendet antike geschlechtsspezifische Kriegsrhetorik für verlorenen Mut oder zusammengebrochene Kampfkraft. Die vergleichende Wiedergabe vermittelt den beabsichtigten Spott, ohne eine wörtliche Veränderung des Geschlechts nahezulegen; die formnähere Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulichen, allgemein verständlichen Verben. Die kurzen Hauptsätze erhalten den gedrängten, militärischen Ton des hebräischen Verses. Das ungenannte Subjekt von הִצִּיתוּ wird nicht konkretisiert.
