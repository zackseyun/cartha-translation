  text: בְּ/חֻמָּ֞/ם אָשִׁ֣ית אֶת מִשְׁתֵּי/הֶ֗ם וְ/הִשְׁכַּרְתִּי/ם֙ לְמַ֣עַן יַעֲלֹ֔זוּ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/039.yaml
  text: When they are heated, I will set out their drink and make them drunk, so that they may exult, then sleep an everlasting sleep and not wake up, declares Yahweh.
translation:
  language: de
  text: Wenn sie erhitzt sind, werde ich ihnen ihr Trinkgelage[a] bereiten und sie betrunken machen, damit sie jubeln und in einen ewigen Schlaf sinken und nicht mehr erwachen[b] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr Festmahl“ oder „ihr Bankett“. Das hebräische Wort bezeichnet vor allem ein Trinkgelage, kann aber auch ein Festmahl meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der „ewige Schlaf“ ist hier ein Bild für den endgültigen Tod im Gericht; wörtlich: „einen Schlaf der Dauer“.'
    reason: cultural_note
lexical_decisions:
- source_word: בְּחֻמָּם
  choice: Wenn sie erhitzt sind
  rationale: Die Präposition ב mit dem Substantiv für „Hitze“ und dem Suffix der 3. Person Plural wird temporal-umständlich wiedergegeben. „Erhitzt“ bewahrt die mögliche körperliche wie leidenschaftlich-erregte Bedeutung, ohne den Kontext vorschnell auf Fieber oder Trunkenheit festzulegen.
- source_word: אָשִׁית אֶת מִשְׁתֵּיהֶם
  choice: werde ich ihnen ihren Trank vorsetzen
  rationale: שׂים bedeutet „setzen, stellen, legen“; zusammen mit מִשְׁתֶּה ergibt „vorsetzen“ eine natürliche deutsche Formulierung. „Trank“ erhält den Bezug zum folgenden Betrunkenmachen, während die mögliche Bedeutung „Trinkgelage/Festmahl“ in der Fußnote genannt wird.
- source_word: וְהִשְׁכַּרְתִּים
  choice: und sie betrunken machen
  rationale: Der Hifil von שׁכר bezeichnet das Verursachen von Trunkenheit. Die Wiedergabe ist direkt und bewahrt Gottes Handlung als Gericht.
- source_word: לְמַעַן יַעֲלֹזוּ
  choice: damit sie jubeln
  rationale: לְמַעַן ist final; עלז bezeichnet ausgelassenes Jubeln oder Frohlocken. „Jubeln“ ist verständlich und lässt den ironischen Unterton im Gerichtszusammenhang bestehen.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: und in einen ewigen Schlaf sinken
  rationale: Die hebräische Schlafmetapher bleibt erhalten. „In einen … Schlaf sinken“ ist im Deutschen natürlicher als „einen Schlaf schlafen“, ohne die Aussage ausdrücklich zu „sterben“ aufzulösen. Das einfache ו wird mit „und“ wiedergegeben, ohne ein zusätzliches „dann“ einzuführen.
- source_word: וְלֹא יָקִיצוּ
  choice: und nicht mehr erwachen
  rationale: קיץ bedeutet „erwachen“. „Nicht mehr“ gibt im Deutschen zusammen mit dem ewigen Schlaf idiomatisch dessen Endgültigkeit wieder.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die feste prophetische Botenformel wird würdig und idiomatisch wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im Text ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bedeutung von שְׁנַת עוֹלָם im Gerichtskontext
  choice: ewiger Schlaf
  alternative: Tod, aus dem sie nicht erwachen
  rationale: Die prophetische Metapher wird nicht in eine abstrakte Aussage über den Tod aufgelöst. So bleiben Bildkraft und mögliche theologische Spannung des Ausgangstextes erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Ton. Die Bildsprache des Hebräischen wird bewahrt; erklärungsbedürftige lexikalische Alternativen und die Todesmetapher werden in Fußnoten erschlossen.
