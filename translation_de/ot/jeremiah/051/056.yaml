  text: כִּי֩ בָ֨א עָלֶ֤י/הָ עַל בָּבֶל֙ שׁוֹדֵ֔ד וְ/נִלְכְּדוּ֙ גִּבּוֹרֶ֔י/הָ חִתְּתָ֖ה קַשְּׁתוֹתָ֑/ם כִּ֣י אֵ֧ל גְּמֻל֛וֹת יְהוָ֖ה שַׁלֵּ֥ם יְשַׁלֵּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/056.yaml
  text: For a destroyer has come against her[a], against Babylon, and her warriors have been captured; their bows are shattered. For Yahweh is a God of recompense[c][b]; he will surely repay.
translation:
  language: de
  text: Denn ein Verwüster[a] ist über sie gekommen, über Babylon. Ihre Krieger[b] sind gefangen genommen worden, ihre Bögen sind zerbrochen. Denn Jahwe ist ein Gott der Vergeltung[c]; er wird ganz gewiss vergelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Plünderer“ oder „ein Verwüster“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre mächtigen Männer“; im Zusammenhang ihre Kämpfer.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein Gott der Rache“. Das Hebräische betont gerechte Vergeltung oder angemessene Rückzahlung.'
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוֹדֵד
  choice: ein Verwüster
  rationale: Das Partizip bezeichnet jemanden, der verwüstet oder plündert. „Verwüster“ passt zum militärischen Gerichtskontext und bewahrt die aktive Rollenbezeichnung.
- source_word: בָא עָלֶיהָ עַל בָּבֶל
  choice: ist über sie gekommen, über Babylon
  rationale: Die zweimalige Verwendung von עַל wird beibehalten; die Apposition erläutert „sie“ ausdrücklich als Babylon.
- source_word: וְנִלְכְּדוּ גִּבּוֹרֶיהָ
  choice: Ihre Krieger sind gefangen genommen
  rationale: Der Nifal wahrt den passiven Sinn „gefangen genommen werden“; גִּבּוֹרֶיהָ bezeichnet im militärischen Zusammenhang Babylons kampffähige Männer.
- source_word: חִתְּתָה קַשְּׁתוֹתָם
  choice: ihre Bogen zerbrochen
  rationale: Das Verb bezeichnet das Zerbrechen oder Zerschmettern. „Zerbrochen“ ist anschaulich, natürlich und semantisch nicht überzeichnet.
- source_word: אֵל גְּמֻלוֹת
  choice: ein Gott der Vergeltung
  rationale: גְּמֻלוֹת bezeichnet erwidernde Zumessung beziehungsweise gerechte Rückzahlung. „Vergeltung“ ist im Deutschen idiomatisch und lässt sowohl Gericht als auch angemessene Erwiderung erkennen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: er wird ganz gewiss vergelten
  rationale: Infinitivus absolutus und finite Verbform verstärken gemeinsam die Aussage; „ganz gewiss“ gibt diese nachdrückliche Bekräftigung natürlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. Die Transliteration „Jahwe“ bewahrt ihn als Eigennamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutungsnuance von אֵל גְּמֻלוֹת
  choice: ein Gott der Vergeltung
  alternative: ein Gott der Rache / ein Gott der Vergeltungen
  rationale: „Vergeltung“ bewahrt den Gedanken angemessener Rückzahlung und göttlichen Gerichts, ohne den Ausdruck auf emotional verstandene Rache zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Wiederholung von „über“ bleiben erhalten. „Bogen“ wird entsprechend dem üblichen deutschen Plural ohne zusätzliche Markierung verwendet; „ganz gewiss“ bildet die hebräische Verstärkung idiomatisch ab.
