base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/003.yaml
  text: Let not the archer bend his bow[a], and let him not rise up in his armor. Do not spare her young men[c][b]; devote all her army to destruction.
translation:
  language: de
  text: Der Bogenschütze soll seinen Bogen nicht spannen[a], und er soll sich in seiner Rüstung nicht erheben[b]. Verschont ihre jungen Männer nicht; weiht ihr ganzes Heer dem Untergang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Versanfang ist wegen seiner ungewöhnlichen Wortfolge und einer Wiederholung schwer verständlich. Auch möglich: »Gegen den, der seinen Bogen spannt, soll der Bogenschütze seinen Bogen spannen.«'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »in seinem Panzerhemd« beziehungsweise »in seinem Schuppenpanzer«.'
    reason: lexical_alternative
  - marker: c
    text: 'Das hebräische Wort bezeichnet das Unter-den-Bann-Stellen: Menschen oder Dinge werden im göttlichen Gericht unwiderruflich dem Untergang geweiht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל / וְאֶל / וְאַל
  choice: soll … nicht / soll … nicht / Verschont … nicht
  rationale: Die Partikeln werden im Haupttext entsprechend der masoretischen Vokalisierung als Verneinungen mit auffordernder beziehungsweise verbietender Funktion wiedergegeben. Am Versanfang ist jedoch auch eine präpositionale Deutung »gegen« möglich; darauf weist Fußnote [a] hin.
- source_word: יִדְרֹךְ … הַדֹּרֵךְ קַשְׁתּוֹ
  choice: Der Bogenschütze soll seinen Bogen … spannen
  rationale: דרך mit קשת bezeichnet das Spannen beziehungsweise Schussbereitmachen eines Bogens. Die schwer verständliche Wiederholung im Hebräischen wird im Haupttext lesbar wiedergegeben, ohne die Unsicherheit zu verschweigen.
- source_word: יִתְעַל
  choice: sich … erheben
  rationale: Die Form bezeichnet hier wahrscheinlich das Sichaufrichten oder Sichbereitsmachen eines bewaffneten Kämpfers. »Sich erheben« bewahrt das Bild und vermeidet eine zu genaue militärische Ausdeutung.
- source_word: בְּסִרְיֹנוֹ
  choice: in seiner Rüstung
  rationale: סִרְיוֹן bezeichnet einen den Körper schützenden Panzer, möglicherweise ein Panzerhemd oder einen Schuppenpanzer. »Rüstung« ist im Haupttext verständlich und lässt die genaue Bauart offen.
- source_word: תַּחְמְלוּ
  choice: Verschont
  rationale: חמל kann Mitleid oder Schonung bezeichnen. Im Zusammenhang eines Kriegs- und Gerichtsorakels gibt »verschonen« die praktische Wirkung des Befehls treffend wieder.
- source_word: בַּחֻרֶיהָ
  choice: ihre jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich einen jungen Mann in der Blüte seiner Kraft; eine ausdrückliche Festlegung auf »Krieger« wäre stärker als das Wort selbst.
- source_word: הַחֲרִימוּ
  choice: weiht … dem Untergang
  rationale: Die Hifilform von חרם bezeichnet das Unter-den-Bann-Stellen und damit im Gerichtskontext die unwiderrufliche Preisgabe zur Vernichtung. Die Formulierung bewahrt sowohl den Weihe- als auch den Vernichtungsaspekt.
- source_word: כָּל צְבָאָהּ
  choice: ihr ganzes Heer
  rationale: צָבָא bezeichnet hier die Gesamtheit der militärischen Streitkräfte. »Heer« ist prägnant, würdig und im modernen Standarddeutsch verständlich.
theological_decisions:
- issue: Wiedergabe der חרם-Terminologie im Gerichtsorakel
  choice: weiht ihr ganzes Heer dem Untergang
  alternative: vernichtet ihr ganzes Heer vollständig / stellt ihr ganzes Heer unter den Bann
  rationale: חרם verbindet hier Bann, unwiderrufliche Aussonderung und Vernichtung im göttlichen Gericht. Die gewählte Fassung erhält dieses theologische Gewicht, ohne mit dem heute missverständlichen Wort »Bann« allein zu arbeiten oder den Begriff auf bloßes Töten zu reduzieren.
- issue: Deutung des schwierigen Versanfangs
  choice: Verbot an den Bogenschützen
  alternative: Aufforderung, den Bogen gegen den feindlichen Bogenschützen zu spannen
  rationale: Die masoretische Vokalisierung von אֶל stützt die verneinende Deutung und entspricht dem parallelen וְאַל im weiteren Vers. Da die Konsonanten auch als אֶל »gegen« verstanden werden können und die Wortfolge ungewöhnlich ist, bleibt die alternative militärische Aufforderung in Fußnote [a] ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer militärischer Bildsprache. Der Haupttext bleibt flüssig und verständlich; textkritische beziehungsweise lexikalische Unsicherheiten werden knapp in den Fußnoten offengelegt. Die parallelen Verbote werden syntaktisch parallel formuliert, während der anschließende direkte Pluralbefehl erhalten bleibt.
