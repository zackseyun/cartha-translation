reference: Jeremiah 51:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הָבֵ֣רוּ הַ/חִצִּים֮ מִלְא֣וּ הַ/שְּׁלָטִים֒ הֵעִ֣יר יְהוָ֗ה אֶת ר֨וּחַ֙ מַלְכֵ֣י מָדַ֔י כִּֽי עַל בָּבֶ֥ל מְזִמָּת֖/וֹ לְ/הַשְׁחִיתָ֑/הּ כִּֽי נִקְמַ֤ת יְהוָה֙ הִ֔יא נִקְמַ֖ת הֵיכָלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/011.yaml
  text: Sharpen the arrows[a]; fill the shields. Yahweh has stirred up the spirit of the kings of Media, because his plan is against Babylon, to destroy her; for it is the vengeance of Yahweh[b], vengeance for his temple.
translation:
  language: de
  text: Poliert die Pfeile; füllt die Schilde[a]! Jahwe hat den Geist der Könige von Medien erweckt, denn sein Plan richtet sich gegen Babel, um es zu vernichten; denn es ist Jahwes Vergeltung, die Vergeltung für seinen Tempel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Füllt die Köcher.« Das hebräische Wort bezeichnet gewöhnlich Schilde, wird im Zusammenhang mit den Pfeilen jedoch auch als »Köcher« verstanden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבֵרוּ
  choice: Schärft
  rationale: Der Imperativ bezeichnet im Zusammenhang mit Waffen das Bereiten der Pfeile, wohl durch Schärfen oder Polieren. „Schärft“ gibt den militärischen Sinn natürlich wieder.
- source_word: הַחִצִּים
  choice: die Pfeile
  rationale: Direkte Wiedergabe des bestimmten Plurals.
- source_word: מִלְאוּ הַשְּׁלָטִים
  choice: füllt die Schilde
  rationale: „Füllt“ bildet den Imperativ מִלְאוּ formal ab, und הַשְּׁלָטִים bezeichnet am sichersten Schilde. Die im Deutschen ungewöhnliche Verbindung wird nicht stillschweigend geglättet; eine kontextuell erwogene Alternative steht in der Fußnote.
- source_word: הֵעִיר ... אֶת רוּחַ
  choice: hat den Geist ... aufgestachelt
  rationale: Die Hifil-Form bezeichnet ein Wecken oder Antreiben zum Handeln. „Aufgestachelt“ macht die aktivierende Wirkung im Kriegskontext deutlich.
- source_word: מַלְכֵי מָדַי
  choice: die Könige von Medien
  rationale: Gibt sowohl den Plural „Könige“ als auch die geografische Bezeichnung Medien wieder.
- source_word: מְזִמָּתוֹ
  choice: sein Plan
  rationale: Bezeichnet hier Jahwes absichtsvolles Vorhaben, ohne eine zusätzliche moralische Wertung in das Wort selbst einzutragen.
- source_word: לְהַשְׁחִיתָהּ
  choice: um es zu vernichten
  rationale: Das Suffix bezieht sich auf Babel. Wegen des grammatischen Geschlechts von „Babel“ ist im Deutschen „es“ natürlich; die Vernichtungsabsicht bleibt ausdrücklich erhalten.
- source_word: נִקְמַת יְהוָה
  choice: Jahwes Vergeltung
  rationale: „Vergeltung“ bewahrt den gerichtlichen Ernst von נְקָמָה und klingt im modernen Deutsch natürlicher als „Rache“, ohne die göttliche Urheberschaft abzuschwächen.
- source_word: נִקְמַת הֵיכָלוֹ
  choice: die Vergeltung für seinen Tempel
  rationale: 'Der zweite Ausdruck erläutert den Anlass der Vergeltung: das an Jahwes Tempel begangene Unrecht.'
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Gottesnamen in einer im Deutschen etablierten Form.
- issue: Göttliche Wirksamkeit beim Fall Babels
  choice: Jahwe hat den Geist der Könige von Medien aufgestachelt
  alternative: Jahwe hat die Könige von Medien handeln lassen
  rationale: Der Text schreibt Jahwe ausdrücklich das Erwecken beziehungsweise Antreiben ihres Geistes zu; diese aktive Verursachung wird nicht zu bloßer Zulassung abgeschwächt.
- issue: Bezug der Vergeltung
  choice: Jahwes Vergeltung, die Vergeltung für seinen Tempel
  alternative: Vergeltung an seinem Tempel
  rationale: Der Tempel ist nicht Ziel, sondern Anlass der Vergeltung. Die Formulierung bewahrt zugleich die knappe Wiederholung des Hebräischen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knappen militärischen Imperativen. Die auffällige hebräische Wendung „füllt die Schilde“ bleibt im Haupttext erhalten und wird durch eine Fußnote transparent gemacht. Der Ortsname בָּבֶל wird traditionsgemäß als „Babel“ wiedergegeben; „Medien“ bezeichnet das Reich der Meder.
