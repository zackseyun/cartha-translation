  to: Poliert die Pfeile; füllt die Schilde[a]! Jahwe hat den Geist der Könige von Medien erweckt, denn sein Plan richtet sich gegen Babel, um es zu vernichten; denn es ist Jahwes Vergeltung, die Vergeltung für seinen Tempel.
