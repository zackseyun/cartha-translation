id: JER.51.29
reference: Jeremiah 51:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/תִּרְעַ֥שׁ הָ/אָ֖רֶץ וַ/תָּחֹ֑ל כִּ֣י קָ֤מָה עַל בָּבֶל֙ מַחְשְׁב֣וֹת יְהוָ֔ה לָ/שׂ֞וּם אֶת אֶ֧רֶץ בָּבֶ֛ל לְ/שַׁמָּ֖ה מֵ/אֵ֥ין יוֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/029.yaml
  text: And the earth quakes and writhes, for the plans of Yahweh have arisen against Babylon, to make the land of Babylon a desolation, without inhabitant.
translation:
  language: de
  text: Die Erde[a] erbebt und windet sich[b], denn Jahwes Pläne haben sich gegen Babylon erhoben, um das Land Babylon zur Einöde zu machen, in der niemand wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das Land.'
    reason: ארץ kann je nach Reichweite „Erde“ oder „Land“ bedeuten.
  - marker: b
    text: Das hebräische Verb kann auch das Winden in Geburtswehen bezeichnen.
    reason: Die Bildhaftigkeit von חול umfasst schmerzhaftes, wehenartiges Sichwinden.
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: erbebt
  rationale: רעשׁ bezeichnet heftiges Beben oder Erschüttern. Das Präsens vergegenwärtigt das prophetische Gerichtsgeschehen.
- source_word: וַתָּחֹל
  choice: windet sich
  rationale: חול kann hier das Sichwinden in Schmerz, besonders wie in Geburtswehen, ausdrücken. Die Formulierung bewahrt das körperlich-konvulsive Bild.
- source_word: הָאָרֶץ
  choice: die Erde
  rationale: ארץ kann sowohl „Erde“ als auch „Land“ bedeuten. Zusammen mit „erbebt und windet sich“ liegt die umfassendere kosmische Bedeutung nahe; die lokale Lesart bleibt in der Fußnote sichtbar.
- source_word: קָמָה ... מַחְשְׁבוֹת
  choice: die Pläne haben sich ... erhoben
  rationale: מַחְשְׁבוֹת meint hier beschlossene Vorhaben. Die personifizierende Wendung mit קום wird im Deutschen bewusst beibehalten, statt sie als bloßes „feststehen“ oder „in Kraft treten“ aufzulösen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im modernen Deutschen übliche Umschrift des Gottesnamens bewahrt den Eigennamen statt ihn durch einen Titel zu ersetzen.
- source_word: לָשׂוּם ... לְשַׁמָּה
  choice: zur Einöde machen
  rationale: שׂום mit Objekt und Prädikatsnomen bedeutet hier „zu etwas machen“; שַׁמָּה bezeichnet die durch das Gericht entstandene Verwüstung oder Einöde.
- source_word: מֵאֵין יוֹשֵׁב
  choice: in der niemand wohnt
  rationale: Die natürliche deutsche Formulierung gibt den Zustand ohne Bewohner wieder und bewahrt mit „wohnt“ den Sinn von ישׁב.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Eigenname wird in deutscher Standardumschrift wiedergegeben. So bleibt er als persönlicher Gottesname erkennbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite von הָאָרֶץ im ersten Satzteil
  choice: die Erde
  alternative: das Land
  rationale: Das Beben und Sichwinden legt eine kosmisch personifizierte Reaktion nahe. Da ארץ zugleich das betroffene Land bezeichnen kann, wird diese echte Mehrdeutigkeit durch eine Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Bildkraft. Die Personifikation der Erde und das ungewöhnliche Sich-Erheben der göttlichen Pläne bleiben erhalten; der abschließende Zweck wird zur klaren deutschen Satzführung mit „Er will“ entfaltet.
