source:
  edition: WLC
  text: פִּתְאֹ֛ם נָפְלָ֥ה בָבֶ֖ל וַ/תִּשָּׁבֵ֑ר הֵילִ֣ילוּ עָלֶ֗י/הָ קְח֤וּ צֳרִי֙ לְ/מַכְאוֹבָ֔/הּ אוּלַ֖י תֵּרָפֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/008.yaml
  text: Suddenly Babylon has fallen and been shattered[a]. Wail over her! Take balm for her pain; perhaps she may be healed.
translation:
  language: de
  text: Plötzlich ist Babel gefallen und zerschmettert. Klagt laut über sie! Holt Balsam[a] für ihren Schmerz; vielleicht wird sie geheilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heilbalsam“. Das hebräische Wort bezeichnet ein Harz, das als Heilmittel verwendet wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְאֹם
  choice: Plötzlich
  rationale: Das Adverb gibt die jähe, überraschende Art des Zusammenbruchs wieder und entspricht natürlichem modernem Deutsch.
- source_word: נָפְלָה
  choice: ist … gefallen
  rationale: Das Qal-Perfekt bezeichnet Babels vollzogenen Fall; das deutsche Perfekt stellt das eingetretene Ergebnis lebendig heraus.
- source_word: בָבֶל
  choice: Babel
  rationale: „Babel“ ist die im Deutschen etablierte biblische Namensform für die Stadt und das Reich.
- source_word: וַתִּשָּׁבֵר
  choice: und zerschmettert
  rationale: Das Nifal von שׁבר bezeichnet ein gewaltsames Zerbrechen. Die elliptische Verbindung mit „ist“ ist im Deutschen natürlich und bewahrt die Steigerung des Bildes.
- source_word: הֵילִילוּ
  choice: Klagt laut
  rationale: Der pluralische Imperativ fordert zu hörbarer, heftiger Toten- oder Trauerklage auf. „Klagt laut“ ist verständlich und würdevoll, ohne die Intensität zu verlieren.
- source_word: עָלֶיהָ
  choice: über sie
  rationale: עַל bezeichnet bei einem Klageausdruck den Gegenstand der Trauer. Das feminine Pronomen erhält die Personifikation Babels.
- source_word: קְחוּ
  choice: Holt
  rationale: Der pluralische Imperativ kann je nach Zusammenhang „nehmt“ oder „holt“ bedeuten. Bei einem Heilmittel ist „holt“ im Deutschen idiomatisch und vermittelt die Aufforderung, es herbeizuschaffen.
- source_word: צֳרִי
  choice: Balsam
  rationale: Das Wort bezeichnet ein medizinisch verwendetes Harz beziehungsweise einen daraus gewonnenen Heilbalsam. „Balsam“ ist im Deutschen knapp und verständlich; die Fußnote erläutert die Sachbedeutung.
- source_word: לְמַכְאוֹבָהּ
  choice: für ihren Schmerz
  rationale: מַכְאוֹב bezeichnet Schmerz, Leiden oder Verletzung. „Schmerz“ ist die lexikalisch direkte Wiedergabe und lässt die bildhafte Anwendung auf Babel offen.
- source_word: אוּלַי
  choice: vielleicht
  rationale: Das Wort drückt eine unsichere Möglichkeit aus und bewahrt die Spannung, ob Heilung überhaupt noch möglich ist.
- source_word: תֵּרָפֵא
  choice: wird sie geheilt
  rationale: Das Nifal-Imperfekt von רפא bezeichnet das Geheiltwerden. In Verbindung mit „vielleicht“ gibt das deutsche Präsenspassiv die mögliche künftige Heilung natürlich wieder.
theological_decisions:
- issue: Feminine Personifikation Babels
  choice: Babel wird mit „sie“ und „ihren“ als weibliche Gestalt personifiziert.
  alternative: Die Stadt beziehungsweise das Reich unpersönlich mit „es“ wiedergeben.
  rationale: Die feminine Kongruenz des Hebräischen wird im ganzen Vers rhetorisch eingesetzt. Ihre Beibehaltung bewahrt das Bild Babels als verwundete Frau, ohne dessen theologische Bedeutung weiter festzulegen.
- issue: Unsicherheit der möglichen Heilung
  choice: „vielleicht wird sie geheilt“
  alternative: Eine sichere Heilung oder eine endgültige Unheilbarkeit ausdrücken.
  rationale: אוּלַי lässt den Ausgang ausdrücklich offen. Die Übersetzung löst diese Spannung nicht zugunsten einer sicheren oder unmöglichen Wiederherstellung auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Sätze und der Ausruf bewahren die Dringlichkeit des hebräischen Verses; die weibliche Personifikation und die offene Möglichkeit einer Heilung bleiben erhalten.
