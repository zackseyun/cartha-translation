source:
  edition: WLC
  text: עָלָ֥ה עַל בָּבֶ֖ל הַ/יָּ֑ם בַּ/הֲמ֥וֹן גַּלָּ֖י/ו נִכְסָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/042.yaml
  text: The sea has come up against Babylon[b][a]; she is covered with the multitude of its waves.
translation:
  language: de
  text: Das Meer ist gegen Babylon heraufgestiegen[a]; sie ist von der Menge seiner Wellen bedeckt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild vom »Meer« steht wahrscheinlich für die überwältigende Macht, die über Babylon hereinbricht. Die Übersetzung bewahrt das Bild, statt es im Haupttext auszudeuten.
    reason: cultural_note
  - marker: b
    text: 'Oder: »vom Tosen seiner Wellen«. Das hebräische Wort kann sowohl Lärm und Getöse als auch eine große Menge oder Fülle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: ist … heraufgestiegen
  rationale: Das Qal Perfekt bezeichnet ein Heraufsteigen bzw. Herankommen; das deutsche Perfekt erhält die vollendete, anschaulich gegenwärtige Bewegung.
- source_word: עַל
  choice: gegen
  rationale: Bei einer feindlichen Bewegung gibt עַל idiomatisch die Stoßrichtung gegen Babylon an.
- source_word: בָּבֶל
  choice: Babylon
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: הַיָּם
  choice: Das Meer
  rationale: Der bestimmte Ausdruck wird wörtlich wiedergegeben; das Bild für die überwältigende Macht wird nicht durch eine Deutung ersetzt.
- source_word: בַּהֲמוֹן
  choice: vom Tosen
  rationale: הָמוֹן kann sowohl Menge/Fülle als auch Lärm, Getöse oder Tosen bezeichnen. Bei Wellen ist »Tosen« im Deutschen anschaulich und natürlich, ohne die lexikalische Alternative auszuschließen.
- source_word: גַּלָּיו
  choice: seiner Wellen
  rationale: Das Suffix der 3. Person maskulin Singular bezieht sich grammatisch auf הַיָּם, »das Meer«; im Deutschen entspricht dem »seiner«.
- source_word: נִכְסָתָה
  choice: ist sie bedeckt
  rationale: Das Nifal Perfekt der 3. Person feminin Singular bezeichnet das Bedecktsein; »sie« greift Babylon als personifizierte Stadt auf.
theological_decisions: []
