  text: ק֥וֹל זְעָקָ֖ה מִ/בָּבֶ֑ל וְ/שֶׁ֥בֶר גָּד֖וֹל מֵ/אֶ֥רֶץ כַּשְׂדִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/054.yaml
  text: The sound of a cry comes from Babylon[a], and great destruction from the land of the Chaldeans.
translation:
  language: de
  text: Aus Babylon ertönt ein Schrei, aus dem Land der Chaldäer kommt gewaltige Zerstörung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֥וֹל זְעָקָ֖ה
  choice: lautes Klagegeschrei
  rationale: קוֹל bezeichnet einen hörbaren Laut bzw. Schall, זְעָקָה einen Not- oder Klageschrei. Die deutsche Verbindung gibt das konkrete akustische Bild natürlich wieder; „laut“ bringt קוֹל nicht als bloßes Füllwort, sondern als hörbares Ergehen des Geschreis zur Geltung.
- source_word: מִ/בָּבֶ֑ל
  choice: Aus Babylon dringt
  rationale: מִן kennzeichnet die Herkunft. Da der hebräische Vers ohne ausdrückliches Verb formuliert ist, ergänzt „dringt“ idiomatisch die Bewegung des hörbaren Klagegeschreis aus Babylon heraus.
- source_word: וְ/שֶׁ֥בֶר גָּד֖וֹל
  choice: gewaltige Zerstörung
  rationale: שֶׁבֶר kann Bruch, Zusammenbruch, Verderben oder Zerstörung bezeichnen. Im Zusammenhang des Gerichts über Babylon trifft „Zerstörung“ die katastrophale Bedeutung; „gewaltig“ gibt die Verstärkung durch גָּדוֹל natürlich wieder.
- source_word: מֵ/אֶ֥רֶץ כַּשְׂדִּֽים
  choice: aus dem Land der Chaldäer
  rationale: Die Formulierung bewahrt sowohl die Herkunftsangabe durch מִן als auch die ethnogeografische Bezeichnung des Hebräischen, das die Chaldäer als Volk nennt.
theological_decisions: []
