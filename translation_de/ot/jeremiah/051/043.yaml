  text: הָי֤וּ עָרֶ֨י/הָ֙ לְ/שַׁמָּ֔ה אֶ֖רֶץ צִיָּ֣ה וַ/עֲרָבָ֑ה אֶ֗רֶץ לֹֽא יֵשֵׁ֤ב בָּ/הֵן֙ כָּל אִ֔ישׁ וְ/לֹֽא יַעֲבֹ֥ר בָּ/הֵ֖ן בֶּן אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/043.yaml
  text: Her cities have become a desolation[a], a dry land and a desert, a land where no one lives[c][b], and through which no son of man passes.
translation:
  language: de
  text: Ihre Städte sind zur Einöde geworden, zu dürrem Land und zur Wüste[a], zu einem Land, in dem niemand wohnt und das kein Mensch durchquert.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dürrem Land und Steppe“.'
    reason: lexical_alternative
  - marker: b
    text: Im Hebräischen stehen die Pronomen bei „wohnt“ und „durchquert“ im Plural und beziehen sich grammatisch auf die Städte. Die deutsche Fassung bezieht die Aussage idiomatisch auf das gesamte verwüstete Land.
    reason: source_grammar
lexical_decisions:
- source_word: עָרֶיהָ
  choice: Ihre Städte
  rationale: Das Suffix der 3. Person Singular feminin bezieht sich auf das im Zusammenhang personifizierte Babylon; „ihre Städte“ bewahrt diesen Bezug im Deutschen.
- source_word: לְשַׁמָּה
  choice: zur Einöde
  rationale: שַׁמָּה bezeichnet hier den durch das Gericht verursachten Zustand der Verwüstung; „Einöde“ ist knapp, anschaulich und passt zur folgenden Beschreibung.
- source_word: אֶרֶץ צִיָּה וַעֲרָבָה
  choice: zu dürrem Land und Wüste
  rationale: צִיָּה bezeichnet trockenes, ausgedörrtes Land; עֲרָבָה eine wüstenartige Ebene oder Steppe. „Wüste“ ist im Haupttext allgemein verständlich, während die genauere Alternative in der Fußnote genannt wird.
- source_word: לֹא יֵשֵׁב בָּהֵן כָּל אִישׁ
  choice: in dem niemand wohnt
  rationale: Die generische Aussage כָּל אִישׁ wird im heutigen Deutsch natürlich mit „niemand“ wiedergegeben. Das pluralische בָּהֵן nimmt grammatisch wahrscheinlich die Städte auf; im Satzbild wird die Aussage idiomatisch auf das unmittelbar genannte Land bezogen und die Formabweichung in einer Fußnote offengelegt.
- source_word: וְלֹא יַעֲבֹר בָּהֵן בֶּן אָדָם
  choice: und durch das kein Mensch zieht
  rationale: בֶּן אָדָם ist hier eine generische Bezeichnung für einen Menschen, nicht ein Titel. „Kein Mensch“ bewahrt die rhetorische Wiederholung, ohne im Deutschen das missverständliche „Menschensohn“ zu verwenden; עבר bezeichnet das Durchziehen oder Durchqueren.
- source_word: הָיוּ
  choice: sind … geworden
  rationale: Das Qatal beschreibt den eingetretenen und fortbestehenden Zustand; das deutsche Perfekt gibt sowohl den Übergang als auch sein Ergebnis natürlich wieder.
theological_decisions:
- issue: Wiedergabe von בֶּן אָדָם
  choice: kein Mensch
  alternative: kein Menschensohn
  rationale: Im vorliegenden Gerichtswort ist die Wendung generisch und bezeichnet irgendeinen Menschen beziehungsweise Reisenden. Eine titelartige Wiedergabe könnte unbeabsichtigt einen christologischen Bezug nahelegen, den der Kontext nicht fordert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge und das Bild der völligen Entvölkerung bleiben erhalten; generische Personenbezeichnungen werden idiomatisch wiedergegeben. Alle Fußnotenmarker erscheinen im Haupttext.
