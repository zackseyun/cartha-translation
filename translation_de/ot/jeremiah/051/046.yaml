source:
  edition: WLC
  text: וּ/פֶן יֵרַ֤ךְ לְבַבְ/כֶם֙ וְ/תִֽירְא֔וּ בַּ/שְּׁמוּעָ֖ה הַ/נִּשְׁמַ֣עַת בָּ/אָ֑רֶץ וּ/בָ֧א בַ/שָּׁנָ֣ה הַ/שְּׁמוּעָ֗ה וְ/אַחֲרָ֤י/ו בַּ/שָּׁנָה֙ הַ/שְּׁמוּעָ֔ה וְ/חָמָ֣ס בָּ/אָ֔רֶץ וּ/מֹשֵׁ֖ל עַל מֹשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/046.yaml
  text: And do not let your heart grow faint[a], and do not fear the report heard in the land; a report will come in one year, and after it in the next year another report, and violence in the land[c][b], ruler against ruler.
translation:
  language: de
  text: 'Euer Herz soll nicht mutlos werden,[a] und fürchtet euch nicht vor der Nachricht, die man im Land hört. In einem Jahr kommt eine Nachricht und im Jahr darauf eine weitere: Gewalt im Land und Herrscher gegen Herrscher.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Euer Herz soll nicht weich werden.“ Gemeint ist, dass sie nicht den Mut verlieren sollen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Herrscher über Herrscher“. Die Wendung kann einen Kampf zwischen Herrschern oder möglicherweise einen raschen Wechsel der Herrschaft bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּפֶן
  choice: soll nicht
  rationale: פֶּן leitet hier eine Warnung ein. Die deutsche Aufforderung „soll nicht“ gibt zusammen mit dem folgenden Imperativ den warnenden, negativen Sinn natürlich wieder.
- source_word: יֵרַךְ לְבַבְכֶם
  choice: Euer Herz soll nicht mutlos werden
  rationale: רכך bedeutet wörtlich „weich werden“. In Verbindung mit לֵב bezeichnet es idiomatisch den Verlust von Mut; „mutlos werden“ ist im modernen Deutsch klar und bewahrt das Herz-Motiv.
- source_word: וְתִירְאוּ
  choice: und fürchtet euch nicht
  rationale: ירא bedeutet im Qal „sich fürchten“. Die negative Aussage steht weiterhin unter der mit פֶּן eröffneten Warnung.
- source_word: בַּשְּׁמוּעָה הַנִּשְׁמַעַת בָּאָרֶץ
  choice: vor der Nachricht, die man im Land hört
  rationale: שְׁמוּעָה kann Nachricht, Kunde oder Gerücht bedeuten. „Nachricht“ bleibt hinsichtlich der Verlässlichkeit neutral; die unpersönliche Formulierung gibt das passive Partizip verständlich wieder.
- source_word: וּבָא בַשָּׁנָה הַשְּׁמוּעָה
  choice: In einem Jahr kommt eine Nachricht
  rationale: Die hebräische Wendung bezeichnet das Eintreffen neuer Kunde in einem Jahr; die deutsche indefinite Form lässt den genauen zeitlichen Bezug offen.
- source_word: וְאַחֲרָיו בַּשָּׁנָה הַשְּׁמוּעָה
  choice: und im Jahr darauf eine weitere
  rationale: אַחֲרָיו wird auf die vorausgehende Nachricht beziehungsweise Zeitfolge bezogen. „darauf“ und „weitere“ machen die Wiederholung im Deutschen deutlich, ohne zusätzliche Inhalte einzuführen.
- source_word: וְחָמָס בָּאָרֶץ
  choice: Gewalt herrscht im Land
  rationale: חָמָס bezeichnet Gewalt, Unrecht oder Gewalttat. Das im Hebräischen nominale „Gewalt im Land“ wird durch „herrscht“ zu einem natürlichen deutschen Satz ergänzt.
- source_word: וּמֹשֵׁל עַל מֹשֵׁל
  choice: ein Herrscher steht gegen den anderen
  rationale: עַל kann „über“ oder in diesem Zusammenhang eine Gegnerschaft ausdrücken. Die Hauptfassung folgt dem Kontext politischer Gewalt; die strukturelle Mehrdeutigkeit wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Deutung von מֹשֵׁל עַל מֹשֵׁל
  choice: Konflikt zwischen Herrschern
  alternative: Herrscher über Herrscher; möglicherweise rascher Herrscherwechsel
  rationale: Der unmittelbare Zusammenhang mit חָמָס stützt die Konfliktdeutung, doch עַל bedeutet gewöhnlich auch „über“. Daher wird die Alternative nicht dogmatisch ausgeschlossen, sondern vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede steht im Plural. „Nachricht“ wurde als neutraler Oberbegriff gewählt, damit die mögliche Bedeutung „Gerücht“ oder „Kunde“ nicht vorschnell festgelegt wird. Die knappe prophetische Reihung bleibt erhalten, wird aber durch idiomatische deutsche Syntax lesbar gemacht.
