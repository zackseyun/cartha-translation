  - marker: b
    text: 'Oder: „auf seinen Plätzen“ oder „an seinen öffentlichen Plätzen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָפְלוּ
  choice: Und … werden … fallen
  rationale: Das Qal-Perfekt mit vorangestelltem ו steht hier in prophetischer Gerichtsankündigung und bezeichnet natürlich das angekündigte zukünftige Geschehen.
- source_word: חֲלָלִים
  choice: Erschlagene
  rationale: Das Substantiv bezeichnet Getötete oder tödlich Verwundete. „Erschlagene“ ist knapp, würdevoll und bewahrt den kollektiven Sinn.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  choice: im Land der Chaldäer
  rationale: Die Wiedergabe folgt dem ausdrücklichen hebräischen Ethnonym und vermeidet, es im Haupttext deutend durch „Babylonier“ zu ersetzen.
- source_word: וּמְדֻקָּרִים
  choice: Durchbohrte
  rationale: Das passive Partizip von דקר bezeichnet Menschen, die vermutlich mit Waffen durchbohrt wurden. Die Wahl erhält das gewaltsame Bild und die Parallele zu „Erschlagene“.
- source_word: בְּחוּצוֹתֶיהָ
  choice: auf seinen Straßen
  rationale: חוּצוֹת kann Straßen, Plätze oder öffentliche Freiflächen bezeichnen. „Straßen“ ist hier natürlich; das feminine Suffix bezieht sich grammatisch auf „Land“, das im Deutschen sächlich ist, daher „seinen“.
