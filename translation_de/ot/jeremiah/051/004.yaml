  text: And the slain will fall in the land of the Chaldeans[b][a], and the pierced in her streets.
translation:
  language: de
  text: Und Erschlagene werden im Land der Chaldäer[a] fallen und Durchbohrte auf seinen Straßen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Chaldäa“ oder „im Land der Babylonier“. Wörtlich: „im Land der Chaldäer“.'
