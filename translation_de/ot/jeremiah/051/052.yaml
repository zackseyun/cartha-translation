id: JER.51.52
reference: Jeremiah 51:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּֽה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וּ/פָקַדְתִּ֖י עַל פְּסִילֶ֑י/הָ וּ/בְ/כָל אַרְצָ֖/הּ יֶאֱנֹ֥ק חָלָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/052.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will punish her carved images, and throughout all her land the wounded will groan.
translation:
  language: de
  text: Darum, siehe, es kommen Tage – Ausspruch Jahwes –, da werde ich ihre Schnitzbilder[a] bestrafen, und in ihrem ganzen Land wird der Verwundete[b] stöhnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihre Götzenbilder. Das hebräische Wort bezeichnet geschnitzte Kultbilder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: der Erschlagene; das hebräische Wort kann einen Verwundeten, tödlich Getroffenen oder Erschlagenen bezeichnen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Gerichtswort und klingt im modernen Standarddeutsch natürlich.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt die feierliche prophetische Hinweisfunktion, ohne den Diskursmarker auszulassen.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Gibt die prophetische Zukunftsformel nahe am Hebräischen und zugleich idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den formelhaften, autoritativen Charakter der prophetischen Redeeinleitung.
- source_word: וּפָקַדְתִּי עַל
  choice: da werde ich … bestrafen
  rationale: פקד על bezeichnet im Gerichtskontext das zur Rechenschaft Ziehen beziehungsweise Bestrafen; „da“ verbindet die angekündigten Tage zeitlich mit Gottes Handeln.
- source_word: פְּסִילֶיהָ
  choice: ihre Schnitzbilder
  rationale: Bezeichnet konkret geschnitzte Kultbilder; „Schnitzbilder“ erhält diesen gegenständlichen Sinn besser als das allgemeinere „Götzen“.
- source_word: וּבְכָל אַרְצָהּ
  choice: in ihrem ganzen Land
  rationale: Gibt die umfassende räumliche Ausdehnung des Gerichts schlicht und genau wieder.
- source_word: יֶאֱנֹק
  choice: wird … stöhnen
  rationale: Das Verb bezeichnet das Stöhnen oder Ächzen unter schwerem Leid.
- source_word: חָלָל
  choice: der Verwundete
  rationale: Die Singularform wird bewahrt. Im Zusammenhang mit „stöhnen“ ist „Verwundete“ naheliegend, doch kann das Wort auch einen tödlich Getroffenen oder Erschlagenen bezeichnen; diese Spannung wird in der Fußnote offengelegt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der im hebräischen Text ausdrücklich stehende Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von חָלָל im Gerichtswort
  choice: der Verwundete
  alternative: der Erschlagene
  rationale: Das folgende Stöhnen legt hier einen noch lebenden Verwundeten nahe. Da חָלָל häufig auch einen Erschlagenen bezeichnet, wird die lexikalische Mehrdeutigkeit nicht stillschweigend beseitigt, sondern vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formel „siehe“ und „Ausspruch Jahwes“. Gedankenstriche markieren die eingeschobene Redekennzeichnung; die hebräische Singularform „der Verwundete“ bleibt erhalten.
