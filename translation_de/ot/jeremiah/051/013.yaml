source:
  edition: WLC
  text: שכנתי עַל מַ֣יִם רַבִּ֔ים רַבַּ֖ת אֽוֹצָרֹ֑ת בָּ֥א קִצֵּ֖/ךְ אַמַּ֥ת בִּצְעֵֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/013.yaml
  text: You who dwell by many waters[a], rich in treasures, your end has come[b], the measure of your greed.
translation:
  language: de
  text: 'Die du an vielen Wassern[a] wohnst, reich an Schätzen: Dein Ende ist gekommen[b] – das Maß deines unrechtmäßigen Gewinns.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »auf vielen Wassern«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich folgt: »die Elle deines unrechtmäßigen Gewinns«; gemeint ist wahrscheinlich das Maß oder die Grenze dieses Gewinns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שכנתי
  choice: Die du … wohnst
  rationale: Das feminine Singularpartizip redet Babylon als personifizierte Stadt direkt an. Die Relativkonstruktion gibt diese Anrede im Deutschen natürlich wieder.
- source_word: עַל מַיִם רַבִּים
  choice: an vielen Wassern
  rationale: עַל kann »an«, »auf« oder »über« bedeuten. »An vielen Wassern« ist für Babylons Lage an und zwischen Wasserläufen idiomatisch und bewahrt zugleich das Bild.
- source_word: רַבַּת אֹצָרוֹת
  choice: reich an Schätzen
  rationale: רַבַּת bezeichnet hier eine große Fülle. »Reich an Schätzen« drückt sowohl die Menge als auch den Reichtum in natürlichem Deutsch aus.
- source_word: בָּא קִצֵּךְ
  choice: Dein Ende ist gekommen
  rationale: Das Perfekt stellt das angekündigte Ende als sicher eingetreten beziehungsweise unmittelbar erreicht dar.
- source_word: אַמַּת
  choice: das Maß
  rationale: Das Wort bedeutet wörtlich »Elle«, kann hier aber bildlich ein festgesetztes Maß oder eine erreichte Grenze bezeichnen. Die wörtliche Bedeutung wird in der Fußnote bewahrt.
- source_word: בִּצְעֵךְ
  choice: deines unrechtmäßigen Gewinns
  rationale: בֶּצַע bezeichnet häufig eigennützigen, gewaltsam oder unrechtmäßig erworbenen Gewinn. Diese Wiedergabe bewahrt den moralisch negativen Beiklang, ohne ihn auf das innere Motiv »Gier« zu verengen.
theological_decisions:
- issue: Personifizierte Adressatin
  choice: Babylon wird als weiblich personifizierte Stadt unmittelbar angeredet.
  alternative: Eine einzelne Bewohnerin oder kollektiv die Bevölkerung ist angesprochen.
  rationale: Die femininen Singularformen entsprechen der prophetischen Redeweise, eine Stadt beziehungsweise ein Reich als weibliche Gestalt anzureden; der weitere Zusammenhang weist auf Babylon.
- issue: Verhältnis der Schlusswendung zur Gerichtsankündigung
  choice: Die elliptische Apposition »das Maß deines unrechtmäßigen Gewinns« bleibt erhalten.
  alternative: 'Explizit ergänzen: »Das Maß deines unrechtmäßigen Gewinns ist voll.«'
  rationale: Der hebräische Text enthält kein ausdrückliches »ist voll«. Der Gedankenstrich macht den Zusammenhang lesbar, ohne die knappe und mehrdeutige Syntax vorschnell aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte, feminine Anrede Babylons und die knappe Gerichtsformel bleiben erhalten; ein Gedankenstrich kennzeichnet die elliptische Schlusswendung.
