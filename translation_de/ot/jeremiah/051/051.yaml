base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/051.yaml
  text: We are ashamed, for we have heard reproach; disgrace has covered our faces, for foreigners have come against the holy places of the house of the LORD.
translation:
  language: de
  text: Wir schämen uns, denn wir haben Schmach gehört; Schande hat unser Gesicht bedeckt, denn Fremde sind gegen die Heiligtümer des Hauses des HERRN gekommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Fremde sind in die Heiligtümer des Hauses des HERRN eingedrungen.'
    reason: Die Präposition עַל kann in diesem Kontext ein feindliches Vorgehen gegen die Heiligtümer oder, kontextuell weitergeführt, ein Eindringen in sie bezeichnen.
lexical_decisions:
- source_word: בֹּשְׁנוּ (bōšnû)
  choice: Wir schämen uns
  rationale: Gibt die Zustandsaussage in natürlichem modernem Deutsch wieder.
- source_word: חֶרְפָּה (ḥerpâ)
  choice: Schmähungen
  rationale: Bezeichnet entehrende Beschimpfung beziehungsweise Schmach; der idiomatische deutsche Plural passt zu „gehört“.
- source_word: כְלִמָּה (kĕlimmâ)
  choice: Schande
  rationale: Bewahrt die enge Bedeutungsnähe zum vorausgehenden Motiv der Beschämung, ohne beide hebräischen Wörter gleich wiederzugeben.
- source_word: מִקְדְּשֵׁי (miqdĕšê)
  choice: Heiligtümer
  rationale: Bewahrt die Pluralform des hebräischen Textes und bezeichnet die heiligen Bereiche des Tempelhauses.
- source_word: יְהוָה (YHWH)
  choice: der HERR
  rationale: Entspricht der etablierten deutschen Bibelkonvention für den Gottesnamen; die Kapitälchen werden durch Großschreibung angezeigt.
theological_decisions:
- issue: Richtung beziehungsweise Art des Eindringens der Fremden
  choice: in die Heiligtümer … eingedrungen
  alternative: gegen die Heiligtümer … vorgerückt / über die Heiligtümer … gekommen
  rationale: Die Präposition עַל ist mehrdeutig und kann „auf, über, gegen“ bedeuten. Im Kontext der Tempelentweihung bezeichnet בָּאוּ עַל eine feindliche Annäherung beziehungsweise ein Eindringen. Die gewählte Fassung ist im Deutschen klar und natürlich, während die Fußnote die formnähere Alternative bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus von Scham und Schande sowie die Pluralform „Heiligtümer“ bleiben erhalten.
