source:
  edition: WLC
  text: רפאנו אֶת בָּבֶל֙ וְ/לֹ֣א נִרְפָּ֔תָה עִזְב֕וּ/הָ וְ/נֵלֵ֖ךְ אִ֣ישׁ לְ/אַרְצ֑/וֹ כִּֽי נָגַ֤ע אֶל הַ/שָּׁמַ֨יִם֙ מִשְׁפָּטָ֔/הּ וְ/נִשָּׂ֖א עַד שְׁחָקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/009.yaml
  text: We tried to heal Babylon[a], but she was not healed. Leave her, and let each one go to his own land[c][b], for her judgment has reached to heaven and has been lifted up to the skies.
translation:
  language: de
  text: Wir versuchten, Babylon zu heilen, aber sie wurde nicht geheilt. Verlasst sie! Lasst uns gehen, jeder in sein eigenes Land.[a] Denn ihr Gericht[b] reicht bis an den Himmel und ist bis zu den Wolkenhöhen[c] emporgehoben worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ein Mann in sein Land“; gemeint ist, dass jeder in sein eigenes Land gehen soll.'
    reason: lexical_alternative
  - marker: b
    text: „Gericht“ kann hier auch Urteil, Rechtssache oder Strafe bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Wolkenhöhen“ bezeichnet die hohen Wolken beziehungsweise die oberen Himmelsregionen.
    reason: cultural_note
lexical_decisions:
- source_word: רפאנו
  choice: Wir versuchten, … zu heilen
  rationale: Das Qal Perfekt 1. Person Plural bedeutet formal „wir heilten“. Der folgende Gegensatz „aber sie wurde nicht geheilt“ zeigt, dass der Heilungsversuch erfolglos blieb; die gewählte Formulierung gibt diesen kontextuellen Sinn natürlich wieder.
- source_word: בָּבֶל
  choice: Babylon
  rationale: Geläufige moderne deutsche Bezeichnung der Stadt und des Reiches; das grammatisch feminine Pronomen des Hebräischen wird mit „sie“ fortgeführt.
- source_word: נִרְפָּתָה
  choice: sie wurde nicht geheilt
  rationale: Das Nifal Perfekt 3. Person Femininum Singular wird als Passiv wiedergegeben und wahrt die Wortwiederholung mit רפאנו.
- source_word: עִזְבוּהָ
  choice: Verlasst sie!
  rationale: Der pluralische Imperativ mit femininem Objektsuffix fordert die Angesprochenen unmittelbar auf, Babylon zu verlassen.
- source_word: וְנֵלֵךְ
  choice: Lasst uns gehen
  rationale: Die Kohortativform der 1. Person Plural drückt einen gemeinsamen Aufbruch aus und sollte nicht zu einem bloßen Imperativ an andere umgedeutet werden.
- source_word: אִישׁ לְאַרְצוֹ
  choice: jeder in sein eigenes Land
  rationale: Die distributive, wörtlich maskuline Singularform „ein Mann in sein Land“ wird im Deutschen natürlich mit „jeder … sein“ wiedergegeben; eine Fußnote macht die Form sichtbar.
- source_word: מִשְׁפָּטָהּ
  choice: das Gericht über sie
  rationale: מִשְׁפָּט hat einen rechtlich-richterlichen Bedeutungsbereich. Im Kontext von Babylons Untergang bezeichnet es am ehesten das über Babylon kommende beziehungsweise sie betreffende Gericht, ohne es ausschließlich als Strafe oder Urteil festzulegen.
- source_word: נָגַע אֶל הַשָּׁמַיִם
  choice: reicht bis an den Himmel
  rationale: נגע mit אֶל bezeichnet hier das Erreichen einer Höhe; die deutsche Wendung erhält das vertikale Bild.
- source_word: וְנִשָּׂא עַד שְׁחָקִים
  choice: hat sich bis zu den Wolkenhöhen erhoben
  rationale: Das Nifal von נשׂא bezeichnet das Erhobenwerden beziehungsweise Sich-Erheben. שְׁחָקִים meint die hohen Wolken oder oberen Himmelsregionen; „Wolkenhöhen“ bewahrt dieses Bild.
theological_decisions:
- issue: Bedeutung des bis zum Himmel reichenden מִשְׁפָּט Babylons
  choice: „das Gericht über sie“ als bewusst weiter richterlicher Ausdruck
  alternative: „ihr Urteil“, „ihre Strafe“ oder „ihre Rechtssache“
  rationale: Der Zusammenhang spricht von Babylons unabwendbarem Untergang, doch מִשְׁפָּט kann Gericht, Rechtsentscheidung oder vollzogene Strafe bezeichnen. Die Übersetzung wahrt den gerichtlichen Sinn, ohne die Spannung vorschnell auf nur eine Phase des Richtens zu beschränken.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, eindringlichen Aufforderungen. „Babylon“ ist für heutige Leser geläufiger als „Babel“. Die Wiederholung des Heilungsmotivs und die parallele Höhenbildsprache bleiben erhalten.
