base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/022.yaml
  text: And with you I will shatter man and woman; and with you I will shatter old man and youth; and with you I will shatter young man and virgin.
translation:
  language: de
  text: Mit dir werde ich Mann und Frau zerschmettern, mit dir werde ich Greis und jungen Mann zerschmettern, mit dir werde ich jungen Mann und Jungfrau zerschmettern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִפַּצְתִּי בְךָ
  choice: mit dir zerschmettere ich
  rationale: Die wiederholte Formel wird zur Wahrung von Nachdruck und Rhythmus jeweils gleich wiedergegeben. Das hebräische Perfekt steht im prophetischen Zusammenhang und bezeichnet das angekündigte Handeln; das deutsche Präsens wirkt als unmittelbare, entschlossene Erklärung natürlich.
- source_word: אִישׁ וְאִשָּׁה
  choice: Mann und Frau
  rationale: Direkte und idiomatische Wiedergabe des Geschlechterpaares.
- source_word: זָקֵן וָנָעַר
  choice: Alt und Jung
  rationale: Gibt das meristische Gegensatzpaar natürlich wieder, ohne נַעַר unnötig eng auf einen bestimmten Altersabschnitt festzulegen.
- source_word: בָּחוּר וּבְתוּלָה
  choice: jungen Mann und junge Frau
  rationale: בָּחוּר bezeichnet einen jungen Mann im heiratsfähigen Alter; בְּתוּלָה eine junge, gewöhnlich unverheiratete Frau. Die parallele deutsche Formulierung ist verständlich und vermeidet die im heutigen Deutsch teils technisch oder stark sexualethisch klingende Bezeichnung „Jungfrau“.
theological_decisions:
- issue: Zeitform der angekündigten Zerschmetterung
  choice: 'Präsens: „zerschmettere ich“'
  alternative: 'Futur: „werde ich zerschmettern“'
  rationale: Die hebräische Verbform kann im Kontext als fest angekündigtes beziehungsweise rhetorisch vergegenwärtigtes Handeln verstanden werden. Das Präsens erhält die Schlagkraft der Aufzählung; das Futur bleibt sachlich möglich.
- issue: Bezugsgröße von בְךָ
  choice: 'instrumental: „mit dir“'
  alternative: 'lokal oder adversativ: „an dir / in dir“'
  rationale: Im Zusammenhang der Verse 20–23 wird Babylon beziehungsweise der angesprochene „Hammer“ als Werkzeug verstanden, mit dem Gott andere zerschmettert. Deshalb ist die instrumentale Wiedergabe am wahrscheinlichsten.
translation_notes:
  register: Dignifizierte, zugleich heutige Standardsprache. Die dreifache Wiederholung bildet die eindringliche hebräische Anapher ab. „Alt und Jung“ ist bewusst idiomatisch, während das letzte Paar konkret als „junger Mann und junge Frau“ formuliert wird.
