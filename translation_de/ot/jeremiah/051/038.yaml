  text: יַחְדָּ֖ו כַּ/כְּפִרִ֣ים יִשְׁאָ֑גוּ נָעֲר֖וּ כְּ/גוֹרֵ֥י אֲרָיֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/038.yaml
  text: Together they roar like young lions[a]; they growl like lion cubs.
translation:
  language: de
  text: Gemeinsam brüllen sie wie junge Löwen; sie knurren[a] wie Löwenjunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie fauchen“. Das hebräische Verb kann einen rauen Tierlaut bezeichnen; „knurren“ passt hier am natürlichsten zum parallelen Bild der brüllenden Löwen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְדָּו
  choice: Gemeinsam
  rationale: Das Adverb bezeichnet gemeinschaftliches, gleichzeitiges Handeln; „gemeinsam“ gibt dies in natürlichem modernem Deutsch wieder.
- source_word: כְּפִרִים
  choice: junge Löwen
  rationale: כפיר bezeichnet gewöhnlich junge, bereits kräftige Löwen. „Junge Löwen“ ist klar und wahrt das Bild.
- source_word: יִשְׁאָגוּ
  choice: brüllen sie
  rationale: שאג ist das übliche Verb für das Brüllen eines Löwen; „brüllen“ ist im Deutschen die natürliche Entsprechung.
- source_word: נָעֲרוּ
  choice: sie knurren
  rationale: In diesem Zusammenhang bezeichnet das Verb einen rauen Tierlaut. „Knurren“ passt natürlich zum parallelen Löwenbild, ohne eine nicht ausdrücklich genannte Handlung hinzuzufügen.
- source_word: כְּגוֹרֵי אֲרָיוֹת
  choice: wie Löwenjunge
  rationale: Die Konstruktverbindung bezeichnet den Nachwuchs von Löwen. „Löwenjunge“ ist gegenwärtig und erhält zugleich die leichte begriffliche Unterscheidung zu „junge Löwen“ im ersten Halbvers.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle poetische Sprache. Der Parallelismus und die zwei leicht unterschiedlichen Bezeichnungen für junge Löwen bleiben erhalten.
