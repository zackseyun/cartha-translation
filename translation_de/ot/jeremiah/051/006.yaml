source:
  edition: WLC
  text: נֻ֣סוּ מִ/תּ֣וֹךְ בָּבֶ֗ל וּ/מַלְּטוּ֙ אִ֣ישׁ נַפְשׁ֔/וֹ אַל תִּדַּ֖מּוּ בַּ/עֲוֺנָ֑/הּ כִּי֩ עֵ֨ת נְקָמָ֥ה הִיא֙ לַֽ/יהוָ֔ה גְּמ֕וּל ה֥וּא מְשַׁלֵּ֖ם לָֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/006.yaml
  text: Flee from the midst of Babylon[a], and let each man save his life. Do not be cut off in her iniquity, for this is the time of Yahweh's vengeance; he is repaying her what she deserves.
translation:
  language: de
  text: Flieht aus der Mitte Babylons, und jeder rette sein Leben! Kommt nicht wegen ihrer Schuld um[a], denn dies ist die Zeit der Rache Jahwes; er zahlt ihr heim, was sie verdient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kommt nicht in ihrer Schuld um“ beziehungsweise: „Lasst euch nicht wegen ihres Unrechts vernichten.“ Das Hebräische kann sowohl eine Verstrickung in Babylons Schuld als auch den Untergang in dem Gericht bezeichnen, das wegen dieser Schuld kommt.'
    reason: Lexikalische und syntaktische Mehrdeutigkeit von בַּעֲוֺנָהּ sowie des Verbs דמה im Nifal.
lexical_decisions:
- source_word: נֻסוּ מִתּוֹךְ בָּבֶל
  choice: Flieht aus der Mitte Babylons
  rationale: Der pluralische Imperativ gibt den dringenden Fluchtbefehl wieder; „aus der Mitte“ bewahrt die räumliche Bildhaftigkeit von תּוֹךְ.
- source_word: וּמַלְּטוּ אִישׁ נַפְשׁוֹ
  choice: und jeder rette sein Leben
  rationale: Die deutsche Wendung gibt das hebräische Idiom, wörtlich die eigene נפשׁ entkommen zu lassen, knapp und natürlich wieder. אִישׁ bezeichnet hier distributiv jeden Einzelnen.
- source_word: אַל תִּדַּמּוּ בַּעֲוֺנָהּ
  choice: Kommt nicht wegen ihrer Schuld um
  rationale: Das Nifal von דמה bezeichnet hier wahrscheinlich das Umkommen im Gericht. עָוֹן kann Schuld, Vergehen oder die daraus folgende Strafe bezeichnen; die Hauptfassung liest ב kausal, während die Fußnote die echte Mehrdeutigkeit wahrt.
- source_word: עֵת נְקָמָה הִיא לַיהוָה
  choice: denn dies ist die Zeit der Rache Jahwes
  rationale: Die Formulierung bezeichnet den festgesetzten Zeitpunkt göttlicher Vergeltung. „Rache“ gibt נְקָמָה direkt wieder, ohne das gerechte Gericht in eine bloß menschliche Affektreaktion umzudeuten.
- source_word: גְּמוּל הוּא מְשַׁלֵּם לָהּ
  choice: er vergilt ihr, was sie getan hat
  rationale: גְּמוּל und שׁלם bilden zusammen eine Aussage über entsprechende Rückvergeltung. Die idiomatische deutsche Fassung vermeidet eine schwerfällige Doppelung wie „Vergeltung zurückzahlen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den offenbarten Eigennamen und folgt der vorgelegten theologischen Entscheidung, ohne einen Titel an seine Stelle zu setzen.
- issue: Beteiligung an Babylons Schuld oder Untergang infolge ihrer Schuld
  choice: Umkommen wegen ihrer Schuld
  alternative: Umkommen in ihrer Schuld / mit ihr in ihrer Schuld verstrickt werden
  rationale: Die Präposition ב und das Bedeutungsspektrum von עָוֹן lassen sowohl die Ursache des Gerichts als auch eine Beteiligung an Schuld und Gericht anklingen. Die Hauptfassung bleibt verständlich; die Fußnote hält die alternative Lesart offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, dringlichen Imperativen. „Jeder“ ist hier distributiv und allgemein gemeint. Die gerichtliche Schärfe von „Rache“ und „vergilt“ wird beibehalten, ohne die im Hebräischen vorhandene Spannung zwischen Schuld und deren Folgen aufzulösen.
