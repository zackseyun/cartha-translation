source:
  edition: WLC
  text: וְ/שִׁלַּחְתִּ֨י לְ/בָבֶ֤ל זָרִים֙ וְ/זֵר֔וּ/הָ וִ/יבֹקְק֖וּ אֶת אַרְצָ֑/הּ כִּֽי הָי֥וּ עָלֶ֛י/הָ מִ/סָּבִ֖יב בְּ/י֥וֹם רָעָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/002.yaml
  text: And I will send strangers against Babylon, and they will winnow her and empty her land, for they will be against her from every side in the day of disaster.
translation:
  language: de
  text: Und ich werde Fremde[a] gegen Babel schicken; sie werden Babel worfeln[b] und sein Land leer machen. Denn am Tag des Unheils[c] werden sie es von allen Seiten bedrängen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ausländer“. Das hebräische Wort bezeichnet Menschen von außerhalb, die gegen Babel geschickt werden.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „worfeln“ wiedergegebene Verb kann allgemeiner auch „zerstreuen“ bedeuten; wahrscheinlich ist jedoch das Bild vom Worfeln des Getreides beabsichtigt.
    reason: lexical_alternative
  - marker: c
    text: „Tag des Unheils“ bezeichnet die Zeit, in der das Unglück über Babel hereinbricht, nicht einen Tag moralischer Bosheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי לְבָבֶל
  choice: Und ich werde … gegen Babel schicken
  rationale: Die Perfektform steht im prophetischen Gerichtswort mit Zukunftsbezug. לְ bezeichnet formal das Ziel der Sendung; der feindliche Zusammenhang wird im Deutschen natürlich mit „gegen Babel“ ausgedrückt.
- source_word: זָרִים
  choice: Fremde
  rationale: Das Wort bezeichnet Außenstehende beziehungsweise Menschen, die nicht zu Babel gehören. „Fremde“ bewahrt diese Bedeutung, ohne ihre genaue Herkunft näher festzulegen.
- source_word: וְזֵרוּהָ
  choice: Sie werden es worfeln
  rationale: זרה bezeichnet das Worfeln beziehungsweise Zerstreuen von Getreide. „Worfeln“ erhält das wahrscheinlich beabsichtigte landwirtschaftliche Bild.
- source_word: וִיבֹקְקוּ אֶת־אַרְצָהּ
  choice: und sein Land leer machen
  rationale: בקק bedeutet hier ausleeren beziehungsweise durch Verwüstung entleeren. „Leer machen“ bewahrt das konkrete Bild und ist mit „Land“ im Deutschen verständlich.
- source_word: הָיוּ עָלֶיהָ מִסָּבִיב
  choice: sie werden von allen Seiten gegen es stehen
  rationale: Die Wendung beschreibt die feindliche Stellung rings um Babel. Die Zukunftsform entspricht dem prophetischen Zusammenhang; „von allen Seiten“ gibt die vollständige Umzingelung wieder.
- source_word: בְּיוֹם רָעָה
  choice: am Tag des Unheils
  rationale: רָעָה bezeichnet hier hereinbrechendes Unglück oder Verderben, nicht moralische Bosheit.
theological_decisions:
- issue: Zeitbezug der hebräischen Perfektformen im prophetischen Gerichtswort
  choice: 'Zukunftsformen: „werde schicken“, „werden … stehen“'
  alternative: 'Vergangenheitsformen: „habe geschickt“, „standen“'
  rationale: Der Zusammenhang kündigt das kommende Gericht über Babel an. Die Perfektformen stellen dieses prophetisch als gewiss dar; die deutsche Zukunft gibt den zeitlichen Bezug klar wieder, ohne die Gewissheit der Aussage abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Worfeln“ ist ein weniger alltägliches, aber präzises landwirtschaftliches Wort und wird deshalb in einer Fußnote erläutert. Da „Babel“ im Deutschen sächlich ist, werden die hebräischen femininen Rückverweise mit „es/sein“ wiedergegeben.
