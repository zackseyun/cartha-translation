source:
  edition: WLC
  text: הִנְ/נִ֨י אֵלֶ֜י/ךָ הַ֤ר הַ/מַּשְׁחִית֙ נְאֻם יְהוָ֔ה הַ/מַּשְׁחִ֖ית אֶת כָּל הָ/אָ֑רֶץ וְ/נָטִ֨יתִי אֶת יָדִ֜/י עָלֶ֗י/ךָ וְ/גִלְגַּלְתִּ֨י/ךָ֙ מִן הַ/סְּלָעִ֔ים וּ/נְתַתִּ֖י/ךָ לְ/הַ֥ר שְׂרֵפָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/025.yaml
  text: Behold, I am against you, O destroying mountain, declares Yahweh, which destroys the whole earth. I will stretch out my hand against you, and roll you down from the crags, and make you a burned mountain.
translation:
  language: de
  text: Siehe, ich bin gegen dich, du Berg, der Verderben bringt – Ausspruch Jahwes –, der die ganze Erde[a] verdirbt. Ich werde meine Hand gegen dich ausstrecken, dich von den Felsen hinabrollen und dich zu einem verbrannten Berg[b] machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das ganze Land“. Das hebräische Wort אֶרֶץ kann je nach Zusammenhang „Land“ oder „Erde“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu einem brennenden Berg“ oder „zu einem Berg des Brandes“. Die knappe hebräische Wendung kann den Vorgang des Brennens oder den dadurch entstandenen verbrannten Zustand hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי אֵלֶיךָ
  choice: Siehe, ich stelle mich gegen dich
  rationale: הִנְנִי signalisiert einen feierlichen prophetischen Aufruf; אֵלֶיךָ bezeichnet hier feindliche Zuwendung. Die Formulierung bewahrt Nachdruck und idiomatischen Sinn.
- source_word: הַר הַמַּשְׁחִית
  choice: Berg des Verderbens
  rationale: הַר wird als Bild für Babylon beibehalten. Das substantivierte Partizip הַמַּשְׁחִית kann aktiv verstanden werden; die kompakte Genitivfügung erhält zugleich die bildhafte und bedrohliche Kraft.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste Prophetenformel wird würdevoll und quellennah wiedergegeben; der Gottesname יהוה erscheint als Jahwe.
- source_word: הַמַּשְׁחִית אֶת כָּל הָאָרֶץ
  choice: der die ganze Erde verdirbt
  rationale: Das Partizip wird als Relativsatz auf den Berg bezogen und behält seine aktive Bedeutung. הָאָרֶץ wird angesichts der weitreichenden Verwüstung Babylons als Erde verstanden, ohne die Alternative Land zu verschweigen.
- source_word: וְנָטִיתִי אֶת יָדִי עָלֶיךָ
  choice: Ich werde meine Hand gegen dich ausstrecken
  rationale: Die geläufige Gerichtswendung und das körperhafte Bild göttlichen Handelns bleiben erhalten.
- source_word: וְגִלְגַּלְתִּיךָ מִן הַסְּלָעִים
  choice: dich von den Felsen hinabrollen
  rationale: Das Verb bezeichnet ein Rollen; „hinabrollen“ verdeutlicht im Bergbild die aus dem Zusammenhang naheliegende Richtung. סְלָעִים wird allgemein und natürlich mit „Felsen“ wiedergegeben.
- source_word: וּנְתַתִּיךָ לְהַר שְׂרֵפָה
  choice: dich zu einem ausgebrannten Berg machen
  rationale: Die Konstruktion mit נָתַן und לְ bezeichnet das herbeigeführte Ergebnis. „Ausgebrannt“ hebt den Zustand nach dem Verbrennen hervor, während eine Fußnote die kompakte hebräische Wendung offenhält.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den persönlichen Gottesnamen wieder, ohne ihn durch einen Titel zu ersetzen.
- issue: Reichweite von הָאָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Der Zusammenhang schildert Babylon als weitreichend verwüstende Macht und trägt die umfassende Aussage „Erde“. Da אֶרֶץ ebenso „Land“ bedeuten kann, wird diese echte lexikalische Alternative in einer Fußnote erhalten.
- issue: Sinn von הַר שְׂרֵפָה
  choice: ausgebrannter Berg
  alternative: brennender Berg / Berg des Brandes
  rationale: Die knappe hebräische Verbindung lässt sowohl den Verbrennungsvorgang als auch dessen Ergebnis anklingen. Der Haupttext wählt den resultativen Sinn, ohne die anderen Möglichkeiten dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Feierlichkeit. Das eröffnende „Siehe“ und die Formel „Ausspruch Jahwes“ bewahren den gehobenen biblischen Ton; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich. Das durchgehende Bergbild wird nicht erklärend auf Babylon reduziert.
