base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/041.yaml
  text: How Sheshak has been captured[c][b][a], and the praise of the whole earth seized! How Babylon has become a desolation among the nations!
translation:
  language: de
  text: Wie ist Scheschach[a] eingenommen worden und der Ruhm[b] der ganzen Erde ergriffen worden! Wie ist Babel unter den Nationen zum Entsetzen[c] geworden!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Scheschach gilt weithin als verschlüsselter Name für Babel.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „das Lob der ganzen Erde“; gemeint sein kann auch „das, was die ganze Erde rühmt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu einer Verwüstung“. Das hebräische Wort kann sowohl den verwüsteten Zustand als auch das Entsetzen darüber bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie ist …!
  rationale: Das Fragewort leitet hier keine echte Frage nach der Art und Weise ein, sondern einen erstaunten, klagenden Ausruf. Die deutsche Ausrufkonstruktion bewahrt diese rhetorische Wirkung.
- source_word: נִלְכְּדָה
  choice: ist … eingenommen worden
  rationale: Das Nifal Perfekt von לכד bezeichnet das Eingenommen- oder Gefangenwerden. Bei einer als Stadt verstandenen Größe ist „eingenommen“ im Deutschen treffend und natürlich.
- source_word: שֵׁשַׁךְ
  choice: Scheschach
  rationale: Der im hebräischen Text stehende Name wird transliteriert und nicht stillschweigend durch seine allgemein angenommene Referenz „Babel“ ersetzt.
- source_word: וַתִּתָּפֵשׂ
  choice: ist … ergriffen worden
  rationale: תפשׂ bedeutet ergreifen, packen oder gefangen nehmen. „Ergriffen“ erhält die enge Parallele zur Einnahme Scheschachs und die bildhafte Personifizierung des Ruhmes.
- source_word: תְּהִלַּת כָּל הָאָרֶץ
  choice: der Ruhm der ganzen Erde
  rationale: תְּהִלָּה kann „Lob“ und metonymisch das Gerühmte beziehungsweise „Ruhm“ bezeichnen. Da dieser Ruhm ergriffen wird, ist „Ruhm“ im Deutschen idiomatischer, ohne die positive Wertung aufzugeben.
- source_word: הָיְתָה לְשַׁמָּה
  choice: ist … zu einem Bild des Entsetzens geworden
  rationale: שַׁמָּה kann sowohl die Verwüstung als auch das dadurch ausgelöste Entsetzen bezeichnen. „Bild des Entsetzens“ lässt den Reaktionsaspekt erkennen; die Zustandsbedeutung wird in der Fußnote als Alternative offengehalten.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם bezeichnet hier allgemein die Völker beziehungsweise Nationen und nicht „Heiden“ in einem späteren theologischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Ausrufkonstruktion mit „Wie ist …!“ bewahrt den klagenden Parallelismus. „Babel“ folgt der im Deutschen etablierten biblischen Namensform; „Scheschach“ gibt die hebräische Textform wieder.
