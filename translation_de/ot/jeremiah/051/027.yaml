id: JER.51.27
reference: Jeremiah 51:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: שְׂאוּ נֵ֣ס בָּ/אָ֗רֶץ תִּקְע֨וּ שׁוֹפָ֤ר בַּ/גּוֹיִם֙ קַדְּשׁ֤וּ עָלֶ֨י/הָ֙ גּוֹיִ֔ם הַשְׁמִ֧יעוּ עָלֶ֛י/הָ מַמְלְכ֥וֹת אֲרָרַ֖ט מִנִּ֣י וְ/אַשְׁכְּנָ֑ז פִּקְד֤וּ עָלֶ֨י/הָ֙ טִפְסָ֔ר הַֽעֲלוּ ס֖וּס כְּ/יֶ֥לֶק סָמָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/027.yaml
  text: Raise a banner in the land[a]; blow a trumpet among the nations. Consecrate nations against her; summon against her the kingdoms of Ararat, Minni, and Ashkenaz. Appoint a marshal against her[d][c][b]; bring up horses like bristling locusts.
translation:
  language: de
  text: Richtet im Land ein Feldzeichen auf[a], blast unter den Nationen das Horn! Weiht Nationen zum Kampf gegen sie[b], ruft gegen sie die Königreiche Ararat, Minni und Aschkenas auf! Setzt einen Befehlshaber gegen sie ein[c], lasst Pferde heranrücken wie borstige Heuschrecken[d]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Richtet im Land ein Signalzeichen auf“; נֵס kann ein Feldzeichen, Banner oder weithin sichtbares Signal bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Weiht Nationen zum Kampf“ gebraucht die Sprache des Aussonderns für den Krieg und kann die Vorbereitung auf einen sakral verstandenen Feldzug anklingen lassen.
    reason: cultural_note
  - marker: c
    text: Das mit „Befehlshaber“ übersetzte Wort ist selten und bezeichnet einen Amts- oder Militärträger; möglich sind auch „Heerführer“ oder „Musterungsoffizier“.
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „wie struppige“ oder „wie raue Heuschrecken“. Der hebräische Ausdruck ist selten und bewusst bildhaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ נֵס
  choice: Richtet … ein Feldzeichen auf
  rationale: נֵס bezeichnet ein weithin sichtbares Signalzeichen oder militärisches Feldzeichen. Die Formulierung bewahrt sowohl das konkrete Bild als auch die Funktion des öffentlichen Aufrufs.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: אֶרֶץ kann „Land“ oder „Erde“ bedeuten; der militärische Zusammenhang spricht hier für ein bestimmtes Land beziehungsweise Gebiet, ohne es im Text ausdrücklich zu benennen.
- source_word: תִּקְעוּ שׁוֹפָר
  choice: blast … das Horn
  rationale: שׁוֹפָר ist ein Signalhorn, häufig ein Widderhorn. „Horn“ gibt den Gegenstand genauer wieder als „Trompete“ und passt zum militärischen Alarmruf.
- source_word: בַּגּוֹיִם
  choice: unter den Nationen
  rationale: גּוֹיִם meint hier die fremden Völker beziehungsweise politischen Mächte, die zum Krieg aufgerufen werden.
- source_word: קַדְּשׁוּ עָלֶיהָ גּוֹיִם
  choice: Weiht Nationen zum Kampf gegen sie
  rationale: קדשׁ bedeutet „heiligen, weihen, aussondern“ und kann im Kriegskontext die Bereitstellung von Truppen für einen sakral verstandenen Feldzug bezeichnen. „Zum Kampf“ macht den Kontext verständlich, ohne das Verb auf bloßes „vorbereiten“ zu reduzieren.
- source_word: הַשְׁמִיעוּ עָלֶיהָ
  choice: ruft gegen sie … auf
  rationale: Der Hifil von שמע bedeutet wörtlich „hören lassen, bekannt machen“. Im Zusammenhang ist damit das Aufbieten der anschließend genannten Königreiche gemeint.
- source_word: מַמְלְכוֹת אֲרָרַט מִנִּי וְאַשְׁכְּנָז
  choice: die Königreiche Ararat, Minni und Aschkenas
  rationale: Die geografisch-politischen Eigennamen werden in ihren im Deutschen etablierten biblischen Formen wiedergegeben; „Königreiche“ bewahrt den politischen Charakter der aufgerufenen Mächte.
- source_word: פִּקְדוּ עָלֶיהָ טִפְסָר
  choice: Setzt einen Befehlshaber gegen sie ein
  rationale: טִפְסָר ist ein seltenes Lehnwort für einen hohen Amts- oder Militärträger. „Befehlshaber“ ist verständlich und wahrt die militärische Funktion, ohne einen unsicheren exakten Rang festzulegen.
- source_word: הַעֲלוּ סוּס
  choice: lasst Pferde heranrücken
  rationale: Der Hifil von עלה bezeichnet hier das Heranführen oder Vorrückenlassen militärischer Kräfte. Das hebräische Singularwort סוּס kann kollektiv für die Reiterei beziehungsweise Pferde stehen.
- source_word: כְּיֶלֶק סָמָר
  choice: wie borstige Heuschrecken
  rationale: יֶלֶק bezeichnet eine Heuschreckenart, während סָמָר etwas Borstiges, Raues oder Gesträubtes beschreibt. Die ungewöhnliche und anschauliche Metapher bleibt bewusst erhalten.
theological_decisions:
- issue: Sakrale Bedeutung des militärischen Aufrufs קַדְּשׁוּ
  choice: „Weiht Nationen zum Kampf“ bewahrt die religiöse Bedeutung des Verbs.
  alternative: „Bereitet Nationen zum Kampf vor“ oder „Ruft Nationen zum heiligen Krieg“
  rationale: „Vorbereiten“ würde die sakrale Färbung abschwächen; „heiliger Krieg“ würde sie stärker ausdeuten, als der knappe hebräische Wortlaut verlangt. Die gewählte Fassung erhält die Spannung zwischen Weihe und Krieg.
translation_notes:
  register: Moderne, würdige Aufrufssprache mit parallelen Imperativen. „Feldzeichen“, „Horn“, „Befehlshaber“ und „heranrücken“ halten den militärischen Zusammenhang klar, ohne unnötig altertümlich zu wirken. Die seltene Schlussmetapher wird nicht geglättet.
