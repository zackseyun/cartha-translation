  terminology: „Feldzeichen“ trifft נֵס präzise; „Horn“ wahrt gegenüber „Trompete“ die Bedeutung von שׁוֹפָר. „Weiht Nationen zum Kampf“ erhält die sakrale Nuance von קדשׁ, ohne die Deutung „heiliger Krieg“ in den Text einzutragen. Ararat, Minni und Aschkenas sind als deutsche biblische Namensformen passend. „Befehlshaber“ lässt die genaue, beim seltenen טִפְסָר unsichere Amtsbezeichnung offen.
