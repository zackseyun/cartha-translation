  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Imperativcharakter des Hebräischen genau wieder: Feldzeichen aufrichten, Horn blasen, Nationen weihen, die genannten Königreiche aufbieten, einen Amtsträger einsetzen und Pferde heranführen. „Im Land“ bewahrt die konkrete, im Kontext nicht näher spezifizierte Bedeutung von בָּאָרֶץ. Das Kollektivverständnis von סוּס als „Pferde“ ist hier idiomatisch und sachgerecht. Die ungewöhnliche Metapher כְּיֶלֶק סָמָר wird mit „wie borstige Heuschrecken“ erkennbar bildhaft und ohne unzulässige Glättung wiedergegeben.'
