  naturalness: „Ihre Oberen“ ist eine knappe, natürliche und registergerechte Bezeichnung für die regierende Führungsschicht. Die durch Semikolon getrennte Satzfügung macht die Folge des Betrunkenmachens und den anschließenden Todesschlaf klar. „In einen ewigen Schlaf fallen“ ist modernes, würdiges Deutsch und bewahrt die Bildsprache.
  terminology: „Statthalter“ und „Stellvertreter“ unterscheiden die beiden Verwaltungstitel sinnvoll. „Jahwe der Heerscharen“ gibt den Gottesnamen und צְבָאוֹת angemessen wieder. Die Schlussformel „dessen Name Jahwe der Heerscharen ist“ gibt שְׁמוֹ präzise wieder, ohne den Namen durch einen Titel zu ersetzen.
