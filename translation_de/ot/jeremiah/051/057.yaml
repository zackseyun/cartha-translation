source:
  edition: WLC
  text: וְ֠/הִשְׁכַּרְתִּי שָׂרֶ֨י/הָ וַ/חֲכָמֶ֜י/הָ פַּחוֹתֶ֤י/הָ וּ/סְגָנֶ֨י/הָ֙ וְ/גִבּוֹרֶ֔י/הָ וְ/יָשְׁנ֥וּ שְׁנַת עוֹלָ֖ם וְ/לֹ֣א יָקִ֑יצוּ נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/057.yaml
  text: And I will make her officials drunk—her wise men[a], her governors, her deputies, and her warriors—and they will sleep an everlasting sleep and not wake up, declares the King[b], whose name is Yahweh of Armies.
translation:
  language: de
  text: Und ich werde ihre Oberen betrunken machen, ihre Weisen, ihre Statthalter, ihre Stellvertreter und ihre Krieger; dann werden sie in einen ewigen Schlaf fallen und nicht mehr aufwachen – Ausspruch des Königs, dessen Name Jahwe der Heerscharen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִשְׁכַּרְתִּי
  choice: ich werde … betrunken machen
  rationale: Der Hifil von שׁכר ist kausativ. Die Formulierung gibt Gottes aktives Gericht natürlich und genau wieder.
- source_word: שָׂרֶיהָ
  choice: ihre führenden Männer
  rationale: שׂר bezeichnet hier Angehörige der politischen Führungsschicht. Die Wiedergabe vermeidet die mögliche Verengung von „Fürsten“ auf Angehörige eines Königshauses.
- source_word: חֲכָמֶיהָ
  choice: ihre Weisen
  rationale: Die transparente Wiedergabe bewahrt die Bezeichnung der für ihre Weisheit bekannten Ratgeber oder Gelehrten.
- source_word: פַּחוֹתֶיהָ
  choice: ihre Statthalter
  rationale: פּחה bezeichnet einen administrativen Gebiets- oder Provinzverwalter; „Statthalter“ ist im Deutschen präzise und verständlich.
- source_word: סְגָנֶיהָ
  choice: ihre Stellvertreter
  rationale: סגן bezeichnet nachgeordnete Amtsträger oder Verwalter. „Stellvertreter“ hält den Rangunterschied zu den Statthaltern erkennbar.
- source_word: גִבּוֹרֶיהָ
  choice: ihre Helden
  rationale: גבור bezeichnet starke, kampferprobte Männer. „Helden“ bewahrt die traditionelle militärische Kraft des Ausdrucks, ohne ihn auf einfache Soldaten zu verengen.
- source_word: וְיָשְׁנוּ שְׁנַת עוֹלָם
  choice: dann werden sie in einen ewigen Schlaf fallen
  rationale: Die Formulierung bewahrt das Bild eines dauerhaften Todesschlafs und klingt zugleich natürlich im modernen Deutschen.
- source_word: וְלֹא יָקִיצוּ
  choice: und nicht mehr aufwachen
  rationale: Die Wiedergabe hält das Schlafbild aufrecht und bringt die Endgültigkeit im Zusammenhang klar zum Ausdruck.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: „Ausspruch“ gibt die autoritative prophetische Formel knapp und würdig wieder.
- source_word: הַמֶּלֶךְ
  choice: des Königs
  rationale: Der bestimmte Titel bezeichnet Gott als König und wird daher substantivisch großgeschrieben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben statt durch einen Titel ersetzt.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: „Heerscharen“ ist im Deutschen eine etablierte, würdige Wiedergabe für צבאות und lässt die umfassende himmlische wie militärische Bildwelt offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. Die Transliteration bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung des ewigen Schlafs
  choice: Das Bild vom Schlaf bleibt erhalten.
  alternative: sie werden für immer sterben
  rationale: Der Vers beschreibt das Gericht metaphorisch. Die Übersetzung legt weder eine bestimmte Lehre über Auferstehung noch über endgültige Vernichtung in das Bild hinein.
- issue: Wiedergabe von צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ bewahrt die mögliche Breite des Titels, während „Heere“ ihn stärker auf militärische Verbände verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der Amtsträgerliste und das Schlafbild bleiben erhalten; der Gedankenstrich markiert die abschließende prophetische Sprecherformel.
