- from: 'Und ich werde ihre führenden Männer betrunken machen: ihre Weisen, ihre Statthalter, ihre Stellvertreter und ihre Helden. Dann werden sie in einen ewigen Schlaf fallen und nicht mehr aufwachen – Ausspruch des Königs, dessen Name Jahwe der Heerscharen ist.'
  to: Und ich werde ihre Oberen betrunken machen, ihre Weisen, ihre Statthalter, ihre Stellvertreter und ihre Krieger; dann werden sie in einen ewigen Schlaf fallen und nicht mehr aufwachen – Ausspruch des Königs, dessen Name Jahwe der Heerscharen ist.
