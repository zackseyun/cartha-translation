  text: פְּלֵטִ֣ים מֵ/חֶ֔רֶב הִלְכ֖וּ אַֽל תַּעֲמֹ֑דוּ זִכְר֤וּ מֵֽ/רָחוֹק֙ אֶת יְהוָ֔ה וִ/ירֽוּשָׁלִַ֖ם תַּעֲלֶ֥ה עַל לְבַבְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/050.yaml
  text: You who have escaped the sword[a], go; do not stand still. Remember Yahweh from far away, and let Jerusalem come upon your heart.
translation:
  language: de
  text: Ihr, die ihr dem Schwert entkommen seid, zieht weiter, bleibt nicht stehen! Denkt aus der Ferne an Jahwe, und Jerusalem komme euch in den Sinn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jerusalem soll auf euer Herz hinaufsteigen.“ Das hebräische Herzbild kann sowohl das Erinnern als auch innere Anteilnahme einschließen.'
    reason: Erläuterung des hebräischen Idioms und seiner Bedeutungsweite
lexical_decisions:
- source_word: פְּלֵטִים מֵחֶרֶב
  choice: Ihr, die ihr dem Schwert entkommen seid
  rationale: Das passive Partizip im Plural wird als direkte Anrede wiedergegeben; „dem Schwert entkommen“ bezeichnet das Überleben tödlicher Kriegsgewalt.
- source_word: הִלְכוּ אַל תַּעֲמֹדוּ
  choice: zieht weiter, bleibt nicht stehen
  rationale: Die verbundenen Aufforderungen verlangen, den Weg fortzusetzen und nicht zu verweilen. „Zieht weiter“ gibt diesen Zusammenhang im Deutschen klar wieder.
- source_word: זִכְרוּ מֵרָחוֹק אֶת יְהוָה
  choice: Denkt aus der Ferne an Jahwe
  rationale: זכר bedeutet hier, sich erinnernd Gott zuzuwenden; מֵרָחוֹק bezeichnet die räumliche Ferne. Der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: וִירוּשָׁלִַם תַּעֲלֶה עַל לְבַבְכֶם
  choice: und Jerusalem soll euch zu Herzen gehen
  rationale: Die wörtliche Wendung „auf euer Herz hinaufsteigen“ beschreibt inneres Erinnern und Anteilnehmen. „zu Herzen gehen“ bewahrt das Herzbild in natürlichem Deutsch, ohne den Sinn auf bloßes Nachdenken zu verengen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ lässt den persönlichen Bundesnamen im Haupttext sichtbar.
- issue: Bedeutungsweite der Herzenswendung
  choice: Jerusalem soll euch zu Herzen gehen
  alternative: Jerusalem soll euch in den Sinn kommen
  rationale: Die gewählte Fassung wahrt sowohl Erinnerung als auch innere Anteilnahme und löst die offene Bildsprache nicht einseitig kognitiv auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der nachdrückliche Imperativ bleiben erhalten; das ungewöhnliche hebräische Herzbild wird idiomatisch, aber erkennbar bildhaft wiedergegeben.
