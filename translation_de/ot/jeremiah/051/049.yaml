source:
  edition: WLC
  text: גַּם בָּבֶ֕ל לִ/נְפֹּ֖ל חַֽלְלֵ֣י יִשְׂרָאֵ֑ל גַּם לְ/בָבֶ֥ל נָפְל֖וּ חַֽלְלֵ֥י כָל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/049.yaml
  text: Babylon also must fall for the slain of Israel[a], just as the slain of all the earth have fallen for Babylon.
translation:
  language: de
  text: Auch Babylon muss fallen wegen der Erschlagenen Israels[a], so wie die Erschlagenen der ganzen Erde wegen Babylon gefallen sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Auch Babylon ist gefallen, ihr Erschlagenen Israels.“ Die hebräische Satzfügung im ersten Halbvers ist stark verkürzt und wird unterschiedlich verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם בָּבֶל לִנְפֹּל
  choice: Auch Babylon muss fallen
  rationale: Die knappe, elliptische Konstruktion wird als Aussage über Babylons bestimmtes Gericht verstanden. „Muss fallen“ gibt dies in natürlichem Deutsch wieder, ohne die alternative syntaktische Deutung zu verschweigen.
- source_word: חַלְלֵי יִשְׂרָאֵל
  choice: die Erschlagenen Israels
  rationale: חָלָל bezeichnet besonders im prophetischen und kriegerischen Zusammenhang gewaltsam Getötete; „Erschlagene“ ist präzise und würdevoll.
- source_word: גַּם
  choice: so wie
  rationale: Das zweite גַּם stellt eine Entsprechung zwischen Babylons Fall und dem Fall seiner Opfer her; „so wie“ macht den Parallelismus im Deutschen verständlich.
- source_word: לְבָבֶל
  choice: wegen Babylon
  rationale: 'Das ל wird kausal beziehungsweise als Angabe des Verantwortlichen verstanden: Die Opfer sind durch Babylons Handeln gefallen. Die knappe Formulierung bewahrt zugleich die Nähe zum Hebräischen.'
- source_word: נָפְלוּ
  choice: gefallen sind
  rationale: Das Perfekt beschreibt das bereits geschehene Fallen der Erschlagenen; das deutsche Perfekt passt zur rückblickenden Aussage.
- source_word: חַלְלֵי כָל הָאָרֶץ
  choice: die Erschlagenen der ganzen Erde
  rationale: אָרֶץ kann „Land“ oder „Erde“ bedeuten. Im Kontext von Babylons weitreichender imperialer Gewalt ist hier die umfassendere Bedeutung „Erde“ sachgerecht.
theological_decisions:
- issue: Syntaktische Deutung des ersten Halbverses
  choice: Babylon muss wegen der Erschlagenen Israels fallen
  alternative: Babylon ist gefallen, ihr Erschlagenen Israels
  rationale: 'Die hebräische Syntax ist stark verdichtet. Die gewählte Deutung bildet eine inhaltliche Entsprechung zum zweiten Halbvers: Babylon fällt als Vergeltung für Israels Erschlagene. Die mögliche vokativische beziehungsweise resultative Deutung bleibt in der Fußnote erhalten.'
- issue: Reichweite von אָרֶץ
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Der Spruch stellt Israels Opfer den zahlreichen Opfern babylonischer Weltmacht gegenüber. Der weitere Sinn „Erde“ entspricht dieser universalen Gerichtsperspektive, ohne einen geografisch engeren Sinn grundsätzlich auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus des hebräischen Verses bleibt erkennbar; die ungewöhnliche Stellung von „wegen Babylon“ wahrt die formale Entsprechung der beiden Halbverse, bleibt aber verständlich.
