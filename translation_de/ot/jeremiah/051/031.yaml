  text: רָ֤ץ לִ/קְרַאת רָץ֙ יָר֔וּץ וּ/מַגִּ֖יד לִ/קְרַ֣את מַגִּ֑יד לְ/הַגִּיד֙ לְ/מֶ֣לֶךְ בָּבֶ֔ל כִּֽי נִלְכְּדָ֥ה עִיר֖/וֹ מִ/קָּצֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/031.yaml
  text: Runner runs to meet runner[a], and messenger to meet messenger[b], to tell the king of Babylon that his city has been captured from end to end.
translation:
  language: de
  text: 'Ein Läufer läuft dem anderen entgegen[a], ein Bote dem anderen, um dem König von Babel zu melden: Seine Stadt ist von einem Ende her eingenommen worden.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Ein Läufer läuft einem Läufer entgegen.“ Die Wiederholung im Hebräischen vermittelt Dringlichkeit und eine rasche Folge eintreffender Läufer.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von einem Ende bis zum anderen“. Der hebräische Ausdruck kann die Einnahme von einem äußersten Rand her bezeichnen; im Zusammenhang kann er auch besagen, dass die ganze Stadt gefallen ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָץ / יָרוּץ
  choice: Ein Läufer läuft dem anderen entgegen
  rationale: Die Verbindung aus רָץ und dem finiten Verb יָרוּץ zeichnet eine hastige Folge eintreffender Läufer. Die bewusste Wiederholung von „Läufer“ und „läuft“ bewahrt die eindringliche Bewegung des Hebräischen und klingt im Deutschen noch natürlich.
- source_word: לִקְרַאת
  choice: dem anderen entgegen
  rationale: Die Präposition bezeichnet die Bewegung auf jemanden zu. „Entgegen“ gibt diese Richtung idiomatisch wieder; „dem anderen“ macht die im Hebräischen durch die Wiederholung ausgedrückte wechselseitige Folge verständlich.
- source_word: וּמַגִּיד לִקְרַאת מַגִּיד
  choice: ein Bote dem anderen
  rationale: מַגִּיד bezeichnet hier jemanden, der Nachricht bringt oder Meldung erstattet. „Bote“ passt zur Übermittlung der Nachricht; die verblose Fortsetzung bewahrt die knappe Ellipse des Hebräischen.
- source_word: לְהַגִּיד
  choice: um … zu melden
  rationale: „Melden“ entspricht dem offiziellen Überbringen einer Nachricht an den König und nimmt zugleich die Bedeutung von מַגִּיד auf.
- source_word: לְמֶלֶךְ בָּבֶל
  choice: dem König von Babel
  rationale: Die Genitivverbindung wird direkt wiedergegeben. „Babel“ entspricht der im deutschen Bibelgebrauch etablierten Bezeichnung des Reiches und der Stadt.
- source_word: נִלְכְּדָה
  choice: ist … eingenommen worden
  rationale: Der Nifal von לכד bezeichnet das Ergriffen- oder Eingenommenwerden. Bei einer Stadt ist „eingenommen“ die natürliche militärische Wiedergabe des abgeschlossenen passiven Vorgangs.
- source_word: עִירוֹ
  choice: seine Stadt
  rationale: Das ausdrücklich vorhandene pronominale Suffix wird bewahrt, ohne die Stadt zusätzlich als Hauptstadt zu bestimmen.
- source_word: מִקָּצֶה
  choice: von einem Ende her
  rationale: Die Form bezeichnet wörtlich den Ausgangspunkt an einem Rand oder Ende. Diese Wiedergabe erhält die Mehrdeutigkeit, ob die Einnahme an einem Ende begann oder die ganze Ausdehnung der Stadt erfasste.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe, atemlose Stil wird durch die Wiederholung im ersten Satzglied und die Ellipse „ein Bote dem anderen“ erhalten. Nach dem Doppelpunkt folgt die gemeldete Nachricht unmittelbar.
