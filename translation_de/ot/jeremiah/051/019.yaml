source:
  edition: WLC
  text: לֹֽא כְ/אֵ֜לֶּה חֵ֣לֶק יַעֲק֗וֹב כִּֽי יוֹצֵ֤ר הַ/כֹּל֙ ה֔וּא וְ/שֵׁ֖בֶט נַחֲלָת֑/וֹ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/019.yaml
  text: Not like these is the Portion of Jacob[a], for he is the one who formed everything, and Israel is the tribe of his inheritance[c][b]; Yahweh of Armies is his name.
translation:
  language: de
  text: Nicht wie diese ist Jakobs Anteil[a]; denn er ist es, der alles geformt hat, und Jakob ist der Stamm seines Erbbesitzes[b]. Jahwe der Heerscharen[c] ist sein Name.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Anteil Jakobs“. Die hebräische Wortverbindung kann den Anteil bezeichnen, der Jakob zugeteilt ist, oder formal einen Anteil, den Jakob besitzt. Im Zusammenhang ist Jahwe als Jakobs Anteil gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht nur: „und der Stamm seines Erbbesitzes“. „Jakob“ ist hier als bereits genannter Bezug wieder aufgenommen. Die Parallelstelle Jeremia 10,16 nennt ausdrücklich „Israel“.'
    reason: alternative_reading
  - marker: c
    text: 'Traditionell: „Jahwe der Heerscharen“; auch möglich: „Jahwe der Heere“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כְאֵלֶּה
  choice: Nicht wie diese
  rationale: Gibt den demonstrativen Plural unmittelbar wieder und stellt Jakobs Anteil den zuvor genannten Götzen gegenüber.
- source_word: חֵלֶק יַעֲקֹב
  choice: Jakobs Anteil
  rationale: 'Die deutsche Genitivkonstruktion bewahrt die mögliche Doppeldeutigkeit: Gemeint sein kann vor allem der Anteil, der Jakob zugeteilt ist, formal aber auch ein Anteil, den Jakob besitzt.'
- source_word: יוֹצֵר הַכֹּל הוּא
  choice: er ist es, der alles geformt hat
  rationale: Die Spaltkonstruktion gibt die Hervorhebung durch הוּא wieder; „geformt“ wahrt das Bild des gestaltenden Schöpfers im Gegensatz zu menschengemachten Götzen.
- source_word: וְשֵׁבֶט נַחֲלָתוֹ
  choice: und Jakob ist der Stamm seines Erbbesitzes
  rationale: שֵׁבֶט bezeichnet hier die Volks- beziehungsweise Stammesgemeinschaft, nicht das Zepter. Da der masoretische Text kein ausdrückliches Subjekt in diesem Satzglied nennt, wird das bereits genannte „Jakob“ zur verständlichen deutschen Satzbildung aufgenommen und die Ergänzung in einer Fußnote offengelegt.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Heerscharen“ lässt sowohl den militärischen als auch den umfassenderen himmlischen Bezug offen und ist im Deutschen als würdige biblische Wendung verständlich.
- source_word: שְׁמוֹ
  choice: ist sein Name
  rationale: Vervollständigt den hebräischen Nominalsatz idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als Eigenname wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Unausgesprochenes Bezugswort bei „Stamm seines Erbbesitzes“
  choice: Jakob als bereits genannten Bezug im deutschen Satz wiederholen
  alternative: Israel aus der Parallelstelle Jeremia 10,16 ergänzen; das Satzglied unvollständig stehen lassen
  rationale: Der vorliegende hebräische Text enthält „Israel“ nicht. Die Wiederaufnahme von „Jakob“ macht den Satz verständlich, ohne die Parallelstelle stillschweigend in den Text einzutragen; die Ergänzung wird ausdrücklich vermerkt.
- issue: Beziehung zwischen Jahwe und Jakob
  choice: Jahwe ist Jakobs Anteil, Jakob der Stamm seines Erbbesitzes
  alternative: „Anteil Jakobs“ als von Jakob besessenen Anteil unbestimmt lassen
  rationale: Der Götzenkontrast und die parallele Zuordnung sprechen für die wechselseitige Bundesbeziehung, während die Fußnote die formale Mehrdeutigkeit der ersten Genitivverbindung wahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hervorhebung „er ist es“ bildet den Nachdruck des Hebräischen ab. „Erbbesitz“ bewahrt die sachliche Verbindung zu נַחֲלָה; „Heerscharen“ hält den traditionellen, zugleich noch verständlichen Ausdruck fest. Die im Deutschen notwendige Wiederaufnahme von „Jakob“ wird nicht verdeckt, sondern in Fußnote [b] textkritisch transparent gemacht.
