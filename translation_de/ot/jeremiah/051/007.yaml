  text: כּוֹס זָהָ֤ב בָּבֶל֙ בְּ/יַד יְהוָ֔ה מְשַׁכֶּ֖רֶת כָּל הָ/אָ֑רֶץ מִ/יֵּינָ/הּ֙ שָׁת֣וּ גוֹיִ֔ם עַל כֵּ֖ן יִתְהֹלְל֥וּ גוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/007.yaml
  text: Babylon was a golden cup in the hand of Yahweh[a], making all the earth drunk. Nations drank from her wine[b]; therefore the nations have gone mad.
translation:
  language: de
  text: Babylon war ein goldener Becher in der Hand Jahwes; sie berauschte die ganze Erde. Von ihrem Wein tranken die Völker; darum gerieten die Völker in Raserei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Auch möglich: „darum wurden die Völker wahnsinnig“ oder „darum gebärdeten sich die Völker wie Wahnsinnige“. Das hebräische Verb bezeichnet hier im Zusammenhang des Rausches wahrscheinlich Raserei oder Wahnsinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס זָהָב
  choice: ein goldener Becher
  rationale: Die Verbindung bezeichnet idiomatisch einen goldenen Becher und bewahrt das Bild Babylons als Werkzeug berauschenden Gerichts.
- source_word: בָּבֶל
  choice: Babylon
  rationale: Die im Deutschen übliche Form des Ortsnamens.
- source_word: בְּיַד יְהוָה
  choice: in der Hand Jahwes
  rationale: Die hebräische Wendung stellt Babylon als ein Werkzeug unter Jahwes Verfügung dar; die bildhafte Formulierung bleibt erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird in seiner im Deutschen üblichen Form wiedergegeben, statt durch einen Titel ersetzt zu werden.
- source_word: מְשַׁכֶּרֶת
  choice: der … berauschte
  rationale: Das feminine Partizip bezieht sich grammatisch auf den Becher und bezeichnet dessen berauschende Wirkung. Das Präteritum passt zur einleitenden Vergangenheitsform.
- source_word: כָּל הָאָרֶץ
  choice: die ganze Erde
  rationale: Der anschließende Bezug auf die Völker spricht für den weiten Sinn „Erde“ statt des engeren „Land“.
- source_word: מִיֵּינָהּ שָׁתוּ גוֹיִם
  choice: Von ihrem Wein tranken die Völker
  rationale: Die Präposition מִן wird mit „von“ wiedergegeben; das feminine Suffix verweist auf das personifizierte Babylon. Die Voranstellung wahrt den hebräischen Akzent natürlich.
- source_word: עַל כֵּן
  choice: darum
  rationale: „Darum“ gibt die kausal-konsekutive Verknüpfung knapp und idiomatisch wieder.
- source_word: יִתְהֹלְלוּ גוֹיִם
  choice: gerieten die Völker in Raserei
  rationale: Im Zusammenhang mit dem berauschenden Wein bezeichnet der Hitpolel von הלל wahnsinnige oder rasende Verwirrung. Die Formulierung lässt offen, ob der Zustand als Wahnsinn, Taumel oder rasendes Verhalten hervortritt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ bewahrt diesen als Namen und entspricht der im Deutschen geläufigen Umschrift.
- issue: Babylon als berauschendes Werkzeug des Gerichts
  choice: Babylon bleibt als goldener Becher in Jahwes Hand dargestellt
  alternative: Babylon lediglich als eigenständig wirkende politische Macht zu beschreiben
  rationale: Die Übersetzung bewahrt sowohl Babylons Wirkung auf die Völker als auch seine ausdrückliche Stellung in Jahwes Hand, ohne das Bild dogmatisch auszudeuten.
- issue: Bezugswort von מְשַׁכֶּרֶת
  choice: der Becher berauschte die ganze Erde
  alternative: Babylon berauschte die ganze Erde
  rationale: Das feminine Partizip kann sich grammatisch sowohl auf „Becher“ als auch auf das feminine „Babylon“ beziehen. Die Relativkonstruktion legt als nächstes Bezugswort den Becher nahe, ohne Babylon vom Gesamtbild zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bildkräftig und nah am Hebräischen; „in Raserei geraten“ ist verständlich, ohne die Mehrdeutigkeit zwischen innerem Wahnsinn und rasendem Verhalten unnötig festzulegen.
