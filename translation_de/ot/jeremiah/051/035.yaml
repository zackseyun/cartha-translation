  text: חֲמָסִ֤/י וּ/שְׁאֵרִ/י֙ עַל בָּבֶ֔ל תֹּאמַ֖ר יֹשֶׁ֣בֶת צִיּ֑וֹן וְ/דָמִ/י֙ אֶל יֹשְׁבֵ֣י כַשְׂדִּ֔ים תֹּאמַ֖ר יְרוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/035.yaml
  text: “My violence and my flesh be upon Babylon,” says the inhabitant of Zion[b][a]. “And my blood be upon the inhabitants of Chaldea,” says Jerusalem.
translation:
  language: de
  text: »Die an mir und meinem Fleisch[a] verübte Gewalt komme über Babel!«, sagt die Bewohnerin Zions. »Mein Blut komme über die Bewohner Chaldäas![b]«, sagt Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »meine Gewalt und mein Fleisch«. Die hebräische Wendung kann die Gewalt bezeichnen, die der Sprecherin und ihrem Fleisch angetan wurde; »Fleisch« kann auch mit »Leib« wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Hebräisch wörtlich »zu den Bewohnern Chaldäas«. Das nicht wiederholte Prädikat wird aus dem parallelen ersten Satz ergänzt; die Wiedergabe »über« bringt den im Kontext liegenden Vergeltungswunsch zum Ausdruck.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי
  choice: die an mir verübte Gewalt
  rationale: חָמָס bezeichnet Gewalt, Unrecht oder Frevel. Der Kontext zeigt, dass nicht Zions eigene Gewalttat, sondern die an ihr verübte Gewalt gemeint ist; die deutsche Passivform macht diesen Sinn deutlich.
- source_word: וּשְׁאֵרִי
  choice: und mein Leib
  rationale: שְׁאֵר bezeichnet hier nach traditionellem und kontextuell passendem Verständnis das Fleisch beziehungsweise den Leib. »Leib« bewahrt den körperlichen Bezug und klingt im Deutschen in diesem feierlichen Klagewort natürlicher als »Fleisch«; die wörtlichere Wiedergabe wird in einer Fußnote genannt.
- source_word: עַל בָּבֶל
  choice: sollen über Babel kommen
  rationale: עַל steht in einem elliptischen Fluch- oder Vergeltungswunsch. »Über Babel kommen« gibt die Vorstellung wieder, dass Schuld und Folgen Babel treffen sollen, ohne den knappen hebräischen Satz als bloße Ortsangabe misszuverstehen.
- source_word: תֹּאמַר
  choice: sagt
  rationale: Das Imperfekt führt hier im prophetischen Stil die direkte Rede ein. Das deutsche Präsens ist dafür idiomatisch.
- source_word: יֹשֶׁבֶת צִיּוֹן
  choice: die Bewohnerin Zions
  rationale: Das feminine singularische Partizip personifiziert Zion als weibliche Bewohnerin. Die Wiedergabe erhält Genus und Bild, ohne die hier nicht ausdrücklich stehende Formel »Tochter Zion« einzuführen.
- source_word: וְדָמִי
  choice: und mein Blut
  rationale: דָּם mit Suffix bezeichnet hier am ehesten das vergossene Blut Jerusalems und steht parallel zur erlittenen körperlichen Gewalt.
- source_word: אֶל יֹשְׁבֵי כַשְׂדִּים
  choice: komme über die Bewohner Chaldäas
  rationale: Das Hebräische hat wörtlich »zu/gegen die Bewohner Chaldäas« und lässt das Prädikat unausgesprochen. Die Übersetzung ergänzt aus dem parallelen ersten Satz den im Deutschen nötigen Vergeltungswunsch; eine Fußnote hält die formale Abweichung fest.
- source_word: כַשְׂדִּים
  choice: Chaldäa
  rationale: Nach »Bewohner« ist die territoriale Wiedergabe »Chaldäa« im Deutschen sachgerecht und vermeidet die unnatürliche Formulierung »Bewohner der Chaldäer«.
- source_word: יְרוּשָׁלִָם
  choice: Jerusalem
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Elliptischer Vergeltungswunsch
  choice: 'Die fehlenden Verben werden als Wunsch formuliert: »sollen … kommen« und »komme«.'
  alternative: Eine rein nominale Wiedergabe wie »Meine Gewalt und mein Fleisch auf Babel«.
  rationale: Der Parallelismus und der Zusammenhang verlangen einen gegen Babel und Chaldäa gerichteten Vergeltungsruf. Die Wunschform macht die im Hebräischen implizite Aussage verständlich, ohne festzulegen, auf welche Weise die Vergeltung erfolgt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die personifizierende feminine Form »Bewohnerin Zions« und der Vergeltungscharakter der beiden parallelen Aussagen bleiben erhalten. »Babel« folgt der geläufigen deutschen Bibelform für בָּבֶל; »Chaldäa« bezeichnet hier das Land der Chaldäer.
