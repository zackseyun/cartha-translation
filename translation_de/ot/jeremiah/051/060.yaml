  text: וַ/יִּכְתֹּ֣ב יִרְמְיָ֗הוּ אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר תָּב֥וֹא אֶל בָּבֶ֖ל אֶל סֵ֣פֶר אֶחָ֑ד אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה הַ/כְּתֻבִ֖ים אֶל בָּבֶֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/060.yaml
  text: And Jeremiah wrote in a single scroll all the disaster that would come upon Babylon—all these words written against Babylon[a].
translation:
  language: de
  text: 'Jeremia schrieb all das Unheil, das über Babylon kommen würde, auf eine einzige Schriftrolle: all diese Worte, die über Babylon geschrieben sind.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen Babylon“. Die hebräische Präposition kann hier den Gegenstand beziehungsweise die Ausrichtung der prophetischen Worte bezeichnen; im Zusammenhang sind Worte des Gerichts über Babylon gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: schrieb
  rationale: Das narrative Wayyiqtol von כתב wird im Deutschen schlicht und natürlich mit „schrieb“ wiedergegeben.
- source_word: אֵת כָּל הָרָעָה
  choice: all das Unheil
  rationale: רָעָה bezeichnet im Zusammenhang prophetischen Gerichts nicht moralische Bosheit, sondern kommendes Unheil.
- source_word: אֲשֶׁר תָּבוֹא אֶל בָּבֶל
  choice: das über Babylon kommen würde
  rationale: Bei בוא und angekündigtem Gericht gibt „über Babylon kommen“ die nachteilige Wirkung des Geschehens idiomatisch wieder.
- source_word: אֶל סֵפֶר אֶחָד
  choice: in eine einzige Schriftrolle
  rationale: סֵפֶר meint im historischen Kontext am ehesten eine Schriftrolle beziehungsweise ein Schriftstück; „eine einzige“ bewahrt den Nachdruck von אֶחָד.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: all diese Worte
  rationale: דְּבָרִים verweist hier auf die prophetischen Worte; „Worte“ erhält den textbezogenen Akzent.
- source_word: הַכְּתֻבִים
  choice: die ... geschrieben sind
  rationale: Das passive Partizip wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: אֶל בָּבֶל
  choice: über Babylon
  rationale: Bei geschriebenen prophetischen Worten bezeichnet אֶל hier wahrscheinlich ihren Gegenstand oder ihre Ausrichtung. „Über Babylon“ bewahrt die weitere, nicht zwingend adversative Aussage.
theological_decisions:
- issue: Ausrichtung der prophetischen Worte in אֶל בָּבֶל
  choice: über Babylon
  alternative: gegen Babylon
  rationale: Der Kontext handelt eindeutig vom Gericht über Babylon, doch die Präposition אֶל allein legt nicht zwingend die adversative Wiedergabe „gegen“ fest. Die Hauptübersetzung wahrt daher die lexikalische Offenheit; die kontextuell plausible Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Der Doppelpunkt bildet die erläuternde Wiederaufnahme des hebräischen Satzes natürlich ab, ohne den Inhalt zu glätten.
