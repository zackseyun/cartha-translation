  text: קַדְּשׁ֨וּ עָלֶ֤י/הָ גוֹיִם֙ אֶת מַלְכֵ֣י מָדַ֔י אֶת פַּחוֹתֶ֖י/הָ וְ/אֶת כָּל סְגָנֶ֑י/הָ וְ/אֵ֖ת כָּל אֶ֥רֶץ מֶמְשַׁלְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/028.yaml
  text: Consecrate the nations against her—the kings of Media[a], her governors and all her prefects[c][b], and every land of his dominion.
translation:
  language: de
  text: 'Weiht[b] die Nationen zum Kampf gegen sie: die Könige von Medien[a], ihre Statthalter und alle ihre hohen Beamten sowie jedes Land seines Herrschaftsbereichs.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Könige der Meder“.'
    reason: lexical_alternative
  - marker: b
    text: '„Weiht“ bedeutet hier: für den Kampf aussondern und zum heiligen Krieg aufbieten.'
    reason: cultural_note
  - marker: c
    text: Im Hebräischen wechselt die Form von „ihre Statthalter … ihre hohen Beamten“ zu „seines Herrschaftsbereichs“. Das letzte Pronomen kann sich auf den Herrscher von Medien als repräsentatives Oberhaupt beziehen; manche Übersetzungen gleichen den Wechsel an.
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ
  choice: Weiht … zum Kampf
  rationale: Der Imperativ von קדשׁ bezeichnet im Kriegskontext ein sakrales Aussondern bzw. Aufbieten zum Kampf. Die Ergänzung „zum Kampf“ macht diesen Sinn im heutigen Deutsch verständlich.
- source_word: עָלֶיהָ
  choice: gegen sie
  rationale: עַל bezeichnet hier die feindliche Ausrichtung gegen Babylon; das feminine Pronomen des Hebräischen bleibt erhalten.
- source_word: גוֹיִם
  choice: die Nationen
  rationale: „Nationen“ gibt die politischen Völker bzw. Reiche wieder, die zum Krieg aufgeboten werden.
- source_word: מַלְכֵי מָדַי
  choice: die Könige von Medien
  rationale: Die Wendung bezeichnet die mit dem Land Medien verbundenen Herrscher; „von Medien“ ist im Deutschen natürlich und geografisch präzise.
- source_word: פַּחוֹתֶיהָ
  choice: ihre Statthalter
  rationale: פֶּחָה bezeichnet Provinzverwalter oder Statthalter. Das feminine Suffix wird entsprechend der hebräischen Form mit „ihre“ wiedergegeben.
- source_word: סְגָנֶיהָ
  choice: ihre hohen Beamten
  rationale: סְגָן bezeichnet nachgeordnete ranghohe Amtsträger. „Hohe Beamte“ ist verständlich und unterscheidet sie von den Statthaltern.
- source_word: כָּל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: jedes Land seines Herrschaftsgebiets
  rationale: Die Formulierung bewahrt den distributiven Charakter von כָּל אֶרֶץ und das maskuline Singularsuffix in מֶמְשַׁלְתּוֹ, ohne den ungewöhnlichen Pronomenwechsel zu glätten.
theological_decisions:
- issue: Wechsel der pronominalen Suffixe
  choice: Bei den Amtsträgern steht feminin „ihre“, beim Herrschaftsgebiet maskulin „seines“.
  alternative: Alle Pronomen auf denselben Bezug vereinheitlichen oder den letzten Ausdruck mit „ihres Herrschaftsgebiets“ wiedergeben.
  rationale: Der hebräische Text wechselt von femininen Suffixen bei den Statthaltern und Beamten zu einem maskulinen Singularsuffix bei „Herrschaft“. Der Wechsel bleibt sichtbar, da der letzte Bezug möglicherweise den König von Medien als repräsentatives Oberhaupt meint, ohne dass dies eindeutig festgelegt werden kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die militärisch-sakrale Bedeutung von „weihen“ wird im Haupttext durch „zum Kampf“ verdeutlicht. Die ungewöhnliche Verschiebung vom femininen zum maskulinen Pronomen wird bewusst bewahrt und in einer Fußnote erläutert.
