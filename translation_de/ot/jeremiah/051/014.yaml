base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/014.yaml
  text: 'Yahweh of hosts has sworn by himself: Surely I will fill you with men[a], like locusts[c][b], and they will raise over you a shout.'
translation:
  language: de
  text: 'Jahwe der Heerscharen hat bei sich selbst geschworen: So gewiss werde ich dich mit Menschen, so zahlreich wie Heuschrecken, füllen[a], und sie werden über dich einen lauten Ruf erheben[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann eine bestimmte Heuschreckenart, ein Entwicklungsstadium der Heuschrecke oder einen Heuschreckenschwarm bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort bezeichnet einen lauten Ruf und kann je nach Zusammenhang auch einen Kampf- oder Siegesruf meinen; hier richtet sich der Ruf gegen Babylon.
    reason: cultural_note
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: hat geschworen
  rationale: Das Nifal von שׁבע bezeichnet das Ablegen eines Eides; das Perfekt gibt den vollzogenen Eid mit fortdauernder Geltung wieder.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben; „der Heerscharen“ bewahrt die militärische und kosmische Weite des festen Titels.
- source_word: בְּנַפְשׁוֹ
  choice: bei sich selbst
  rationale: Die Wendung „bei seiner nefesch schwören“ ist eine Selbstbeschwörungsformel. „Bei sich selbst“ ist im Deutschen natürlich und vermeidet die missverständliche wörtliche Wiedergabe „bei seiner Seele“.
- source_word: כִּי אִם
  choice: So gewiss
  rationale: In der Eidesformel führt כִּי אִם nachdrücklich den Inhalt des Schwurs ein und ist hier nicht als gewöhnliche Bedingung zu verstehen.
- source_word: מִלֵּאתִיךְ אָדָם
  choice: werde ich dich mit Menschen füllen
  rationale: Das feminine Suffix richtet sich an Babylon; אָדָם ist kollektiv gebraucht und bezeichnet die zahlreichen menschlichen Angreifer.
- source_word: כַּיֶּלֶק
  choice: wie mit Heuschrecken
  rationale: יֶלֶק bezeichnet eine Heuschreckenart oder ein Entwicklungsstadium; der Plural gibt im Deutschen das Bild der Schwarmmenge klar wieder, ohne die Art genauer festzulegen.
- source_word: וְעָנוּ עָלַיִךְ הֵידָד
  choice: und sie werden über dich den Schlachtruf anstimmen
  rationale: ענה bezeichnet hier das Erheben beziehungsweise Anstimmen eines Rufes. הֵידָד kann je nach Kontext Arbeits-, Jubel- oder Kampfruf bedeuten; gegen Babylon liegt ein Schlachtruf nahe.
theological_decisions:
- issue: Wiedergabe der göttlichen Selbstbeschwörung
  choice: Jahwe der Heerscharen hat bei sich selbst geschworen
  alternative: Der HERR der Heerscharen hat bei seinem Leben geschworen
  rationale: Die gewählte Fassung bewahrt den Gottesnamen und vermittelt die idiomatische Bedeutung von בְּנַפְשׁוֹ als Schwur bei Gottes eigener Person, ohne „nefesch“ unnötig als „Seele“ zu ontologisieren.
- issue: Bestimmung des Rufes הֵידָד
  choice: Schlachtruf
  alternative: Jubelruf oder lauter Ruf
  rationale: Der militärische Zusammenhang der gegen Babylon aufgebotenen Menschen spricht für „Schlachtruf“. Da das Wort auch andere laute Rufe bezeichnen kann, wird die weitere Bedeutungsbreite in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Eidesformel ist idiomatisch formuliert; das Bild des Heuschreckenschwarms und die gegen Babylon gerichtete militärische Spannung bleiben erhalten.
