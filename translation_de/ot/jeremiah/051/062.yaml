  variant: modern standard German
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֗ יְהוָה֙ אַתָּ֨ה דִבַּ֜רְתָּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ לְ/הַכְרִית֔/וֹ לְ/בִלְתִּ֤י הֱיֽוֹת בּ/וֹ֙ יוֹשֵׁ֔ב לְ/מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה כִּֽי שִׁמְמ֥וֹת עוֹלָ֖ם תִּֽהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/062.yaml
  text: and say[a], ‘O Yahweh, you yourself have spoken concerning this place, to cut it off so that no inhabitant will be in it, from man to beast[c][b]; for it will become everlasting desolations.’
translation:
  language: de
  text: 'Und du sollst sagen: »Jahwe, du selbst hast über diesen Ort gesprochen, um ihn zu vernichten[a], sodass weder Mensch noch Tier[b] darin wohnt; denn er wird für immer verwüstet sein[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihn abzuschneiden« beziehungsweise »auszurotten«; gemeint ist seine vollständige Vernichtung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »vom Menschen bis zum Vieh« – eine feste Wendung für die vollständige Entvölkerung von Menschen und Tieren.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: »denn zu dauernden Verwüstungen wird er werden«. Das mit »für immer« wiedergegebene Wort kann auch eine unabsehbar lange, fortdauernde Zeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Und du sollst sagen
  rationale: Das Qal Perfekt 2. Person Singular mit וְ setzt hier eine Anweisungsfolge fort. Im Deutschen gibt »sollst sagen« den direktiven Sinn klar und würdig wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אַתָּה
  choice: du selbst
  rationale: Das selbstständige Pronomen steht zusätzlich zur bereits im Verb enthaltenen Person und trägt daher Nachdruck.
- source_word: דִבַּרְתָּ אֶל הַמָּקוֹם הַזֶּה
  choice: hast über diesen Ort gesprochen
  rationale: אֶל bedeutet häufig »zu«, doch da ein Ort hier Gegenstand einer Gerichtsaussage ist, gibt »über« den Zusammenhang idiomatisch wieder, ohne die stärkere Deutung »gegen« festzuschreiben.
- source_word: לְהַכְרִיתוֹ
  choice: um ihn zu vernichten
  rationale: Das Hifil von כרת bezeichnet hier die völlige Beseitigung. »Vernichten« ist im Deutschen natürlicher als das wörtliche Bild »abschneiden«; dieses wird in der Fußnote kenntlich gemacht.
- source_word: לְבִלְתִּי הֱיוֹת בּוֹ יוֹשֵׁב
  choice: sodass … darin wohnt
  rationale: Die Konstruktion kann Zweck oder Folge ausdrücken. »Sodass« lässt diese enge Verbindung stehen und formuliert die vollständige Entvölkerung natürlich.
- source_word: לְמֵאָדָם וְעַד בְּהֵמָה
  choice: weder Mensch noch Tier
  rationale: Die hebräische Spannweitenformel lautet wörtlich »vom Menschen bis zum Vieh«. Die deutsche Paarformel vermittelt verständlich, dass Menschen wie Tiere vollständig fehlen werden.
- source_word: שִׁמְמוֹת עוֹלָם תִּהְיֶה
  choice: er soll für immer verwüstet bleiben
  rationale: Die idiomatische deutsche Formulierung bewahrt den dauerhaften Zustand, ohne das im Deutschen schwer verständliche hebräische Abstraktplural »Verwüstungen« mechanisch nachzubilden.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. »Jahwe« wahrt diesen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Dauer von שִׁמְמוֹת עוֹלָם
  choice: für immer verwüstet bleiben
  alternative: auf unabsehbare Zeit verwüstet bleiben
  rationale: עוֹלָם kann je nach Kontext »ewig«, »für immer« oder eine unabsehbar lange Dauer bezeichnen. Der Haupttext gibt die starke Dauerformulierung wieder; die Fußnote bewahrt die mögliche Nuance fortdauernder beziehungsweise unabsehbarer Verwüstung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die direkte Anrede behält den Nachdruck von אַתָּה durch »du selbst«. Die schwerfälligen hebräischen Formeln werden im Haupttext idiomatisch wiedergegeben und in den Fußnoten formal transparent gemacht.
