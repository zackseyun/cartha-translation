id: JER.51.1
reference: Jeremiah 51:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִי֙ מֵעִ֣יר עַל בָּבֶ֔ל וְ/אֶל יֹשְׁבֵ֖י לֵ֣ב קָמָ֑י ר֖וּחַ מַשְׁחִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/001.yaml
  text: 'Thus says Yahweh: Behold[a], I am stirring up against Babylon, and against the inhabitants of Leb-kamai[b], a destroying wind.'
translation:
  language: de
  text: 'So spricht Jahwe: Siehe, ich lasse gegen Babylon und gegen die Bewohner von Leb-Kamai[a] einen vernichtenden Wind[b] aufkommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Leb-Kamai“ ist wahrscheinlich ein verschlüsselter Name (eine Atbasch-Chiffre) für die Chaldäer; entsprechend kann er auch Chaldäa bezeichnen. Der Ausdruck kann auch wörtlicher als „das Herz meiner Widersacher“ verstanden werden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „einen vernichtenden Geist“. Das hebräische Wort kann „Wind“, „Geist“ oder „Atem“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Wiedergabe des Gottesnamens bewahrt ihn als Eigennamen.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: „Siehe“ erhält den aufmerksamkeitsweckenden, feierlichen Ton der unmittelbar bevorstehenden göttlichen Ankündigung.
- source_word: מֵעִיר
  choice: lasse … aufkommen
  rationale: Das Hifil-Partizip bezeichnet hier das Erregen oder Ingangsetzen eines Mittels zum Gericht; die deutsche Formulierung ist natürlich und gibt den kausativen Sinn wieder.
- source_word: עַל
  choice: gegen
  rationale: Im Zusammenhang der Gerichtsankündigung bezeichnet die Präposition eine feindliche Ausrichtung.
- source_word: בָּבֶל
  choice: Babylon
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: יֹשְׁבֵי
  choice: die Bewohner von
  rationale: Das Partizip bezeichnet kollektiv die Menschen, die an dem genannten Ort wohnen.
- source_word: לֵב קָמָי
  choice: Leb-Kamai
  rationale: Der Ausdruck ist wahrscheinlich eine Atbasch-Chiffre für Chaldäa und steht parallel zu Babylon. Die Transliteration bewahrt diese Besonderheit; die mögliche wörtliche Deutung wird in der Fußnote genannt.
- source_word: רוּחַ
  choice: Wind
  rationale: Im Zusammenhang mit dem zerstörenden Gericht über Babylon liegt die Bedeutung „Wind“ nahe; „Geist“ bleibt lexikalisch möglich und wird in der Fußnote bewahrt.
- source_word: מַשְׁחִית
  choice: vernichtenden
  rationale: Das Hifil-Partizip beschreibt רוּחַ nach seiner zerstörerischen Wirkung und behält mit „vernichtend“ seine aktive Kraft.
theological_decisions:
- issue: Ob רוּחַ hier meteorologisch oder geistlich-personal zu verstehen ist
  choice: Wind
  alternative: Geist
  rationale: Das Bild eines von Jahwe erregten Windes als Werkzeug des Gerichts passt am unmittelbarsten zum Kontext. Da das hebräische Wort auch „Geist“ bedeuten kann, wird diese echte Mehrdeutigkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ankündigungston. „Siehe“ wurde wegen seiner rhetorischen Funktion beibehalten; die Satzstellung bleibt natürlich und verständlich. Die Fußnotenmarker sind gegenüber der englischen Vorlage sachgerecht den jeweils erläuterten Ausdrücken zugeordnet.
