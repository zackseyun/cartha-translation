id: JER.51.33
reference: Jeremiah 51:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בַּת בָּבֶ֕ל כְּ/גֹ֖רֶן עֵ֣ת הִדְרִיכָ֑/הּ ע֣וֹד מְעַ֔ט וּ/בָ֥אָה עֵֽת הַ/קָּצִ֖יר לָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/033.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: The daughter of Babylon is like a threshing floor at the time it is trodden; yet a little while, and the time of harvest will come for her.'
translation:
  language: de
  text: 'Denn so spricht Jahwe der Heerscharen, der Gott Israels: Die Tochter Babel ist wie eine Tenne, wenn man sie festtritt.[a] Nur noch kurze Zeit, dann kommt für sie die Zeit der Ernte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der Zeit, da sie festgetreten wird“; im Hebräischen wird der Handelnde nicht ausdrücklich genannt.'
    reason: Bewahrt die mögliche passive deutsche Wiedergabe der hebräischen Formulierung mit unbestimmtem Handelnden.
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe der Heerscharen
  rationale: Bewahrt den Gottesnamen und gibt den feststehenden prophetischen Titel צְבָאוֹת würdevoll wieder, ohne ihn auf ausschließlich irdische Heere einzuengen.
- source_word: בַּת בָּבֶל
  choice: die Tochter Babel
  rationale: Erhält die prophetische Personifikation Babylons als weibliche Gestalt; „Babel“ entspricht dem in deutschen Bibelübersetzungen geläufigen Namen der Stadt und des Reiches.
- source_word: כְּגֹרֶן
  choice: wie eine Tenne
  rationale: Gibt den durch כ markierten Vergleich und das konkrete landwirtschaftliche Bild knapp und anschaulich wieder.
- source_word: עֵת הִדְרִיכָהּ
  choice: wenn man sie festtritt
  rationale: Das unbestimmte „man“ bewahrt den nicht genannten Handelnden; „festtritt“ passt zum Bearbeiten einer Tenne und lässt zugleich die auf Babel bezogene Gerichtsmetaphorik bestehen.
- source_word: עוֹד מְעַט
  choice: nur noch kurze Zeit
  rationale: Natürliches modernes Deutsch für die unmittelbar bevorstehende Erfüllung, mit weiterhin prophetisch-ernstem Ton.
- source_word: וּבָאָה עֵת הַקָּצִיר לָהּ
  choice: dann kommt für sie die Zeit der Ernte
  rationale: Bewahrt sowohl das Erntebild als auch den auf Babel bezogenen Dativ לָהּ, ohne die Gerichtsbedeutung erklärend in den Haupttext einzutragen.
theological_decisions:
- issue: Bedeutung der Dresch- und Erntebilder
  choice: Die landwirtschaftlichen Bilder bleiben im Haupttext stehen und deuten im Kontext das bevorstehende Gericht über Babel an.
  alternative: Die Ernte als neutrales jahreszeitliches Geschehen oder ausdrücklich als Vernichtung wiederzugeben.
  rationale: Der Zusammenhang des Gerichtswortes stützt die Gerichtsdeutung; eine ausdrückliche Auslegung im Vers würde jedoch mehr sagen als das Bild selbst.
- issue: Bezug des femininen Suffixes in הִדְרִיכָהּ
  choice: „sie“ wird auf die personifizierte Tochter Babel bezogen, die mit einer Tenne verglichen wird.
  alternative: 'Das Pronomen sachlich auf die Tenne zu beziehen: „wenn sie festgetreten wird“.'
  rationale: Das feminine Suffix passt unmittelbar zur personifizierten Tochter Babel, während גֹרֶן grammatisch maskulin ist; die Bildüberlagerung bleibt dennoch erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge ist gegenüber einer streng formalen Wiedergabe leicht geglättet; Personifikation, landwirtschaftliche Metaphorik und die zeitliche Dringlichkeit bleiben erhalten.
