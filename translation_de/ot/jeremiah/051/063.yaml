source:
  edition: WLC
  text: וְ/הָיָה֙ כְּ/כַלֹּ֣תְ/ךָ֔ לִ/קְרֹ֖א אֶת הַ/סֵּ֣פֶר הַ/זֶּ֑ה תִּקְשֹׁ֤ר עָלָי/ו֙ אֶ֔בֶן וְ/הִשְׁלַכְתּ֖/וֹ אֶל תּ֥וֹךְ פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/051/063.yaml
  text: And when you finish reading this scroll[a], tie a stone to it and throw it into the midst of the Euphrates[b],
translation:
  language: de
  text: Und wenn du diese Schriftrolle[a] zu Ende gelesen hast, binde einen Stein daran und wirf sie mitten in den Euphrat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieses Buch« beziehungsweise »dieses Schriftstück«. Das hebräische Wort סֵפֶר kann allgemein ein Schriftstück bezeichnen; hier ist wahrscheinlich eine Schriftrolle gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »in die Mitte des Euphrat«.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּתְךָ לִקְרֹא
  choice: Und wenn du … zu Ende gelesen hast
  rationale: Die hebräische Wendung leitet idiomatisch einen zukünftigen Zeitpunkt ein. Die deutsche Formulierung gibt dies natürlich wieder und bewahrt den Abschluss des Lesens als Voraussetzung.
- source_word: אֶת־הַסֵּפֶר הַזֶּה
  choice: diese Schriftrolle
  rationale: סֵפֶר bezeichnet allgemein ein Schriftstück oder Buch; im historischen Zusammenhang ist wahrscheinlich eine Schriftrolle gemeint.
- source_word: תִּקְשֹׁר עָלָיו אֶבֶן
  choice: binde einen Stein daran
  rationale: קשר bezeichnet das Festbinden; עָלָיו drückt hier die Befestigung des Steins an der Schriftrolle aus.
- source_word: וְהִשְׁלַכְתּוֹ
  choice: und wirf sie
  rationale: Der Hifil von שלך bedeutet werfen oder schleudern. Das Pronomen wird im Deutschen auf die feminine »Schriftrolle« bezogen.
- source_word: אֶל־תּוֹךְ פְּרָת
  choice: mitten in den Euphrat
  rationale: אֶל־תּוֹךְ bezeichnet eine Bewegung ins Innere beziehungsweise in die Mitte; »mitten in« bewahrt dieses räumliche Bild in natürlichem Deutsch.
