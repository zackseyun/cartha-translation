  text: וְ/הָי֤וּ בָנָי/ו֙ כְּ/קֶ֔דֶם וַ/עֲדָת֖/וֹ לְ/פָנַ֣/י תִּכּ֑וֹן וּ/פָ֣קַדְתִּ֔י עַ֖ל כָּל לֹחֲצָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/020.yaml
  text: His children will be as in former times[a], and his congregation will be established before me[d][c][b]; and I will punish all his oppressors.
translation:
  language: de
  text: Seine Kinder[a] werden wie früher[b] sein, und seine Gemeinschaft[c] wird vor mir fest bestehen. Alle, die ihn[d] bedrängen, werde ich bestrafen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: seine Söhne; gemeint sein können seine Kinder oder Nachkommen insgesamt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: wie einst; wie zuvor.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: seine Gemeinde; seine Versammlung.'
    reason: lexical_alternative
  - marker: d
    text: Die Einzahl bezieht sich wahrscheinlich auf Jakob beziehungsweise Israel als gemeinschaftliches Ganzes.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיוּ
  choice: werden sein
  rationale: Das Qal-Perfekt mit vorangestelltem ו setzt in diesem prophetischen Zusammenhang die zukünftige Wiederherstellungsankündigung fort.
- source_word: בָנָיו
  choice: seine Kinder
  rationale: בנים bedeutet wörtlich »Söhne«, kann aber kollektiv Kinder beziehungsweise Nachkommen bezeichnen. »Kinder« gibt den umfassenden Sinn in natürlichem Deutsch wieder.
- source_word: כְּקֶדֶם
  choice: wie früher
  rationale: Die Wendung vergleicht den angekündigten Zustand mit einem früheren; »wie früher« ist knapp, gegenwärtig und wahrt den Vergleich.
- source_word: וַעֲדָתוֹ
  choice: seine Gemeinschaft
  rationale: עֵדָה bezeichnet eine versammelte Gemeinschaft. »Gemeinschaft« ist hier verständlich und lässt sowohl die soziale als auch die versammlungsbezogene Bedeutung zu.
- source_word: לְפָנַי תִּכּוֹן
  choice: wird vor mir fest bestehen
  rationale: Das Niphal von כון bezeichnet ein Gefestigt- oder Beständigsein. »Fest bestehen« gibt den resultativen Sinn idiomatisch wieder und bewahrt לְפָנַי als »vor mir«.
- source_word: וּפָקַדְתִּי
  choice: werde ich bestrafen
  rationale: פקד besitzt ein breites Bedeutungsspektrum; mit עַל und den feindlichen Bedrängern hat es hier eindeutig gerichtlichen, strafenden Sinn.
- source_word: עַל כָּל לֹחֲצָיו
  choice: Alle, die ihn bedrängen
  rationale: Das Partizip von לחץ bezeichnet Menschen, die Druck ausüben oder unterdrücken. Die verbale Fassung ist in modernem Deutsch natürlich und erhält das singularische Suffix.
theological_decisions:
- issue: Bezug der singularischen Possessiv- und Objektsuffixe
  choice: Die singularischen Bezüge werden mit »seine« und »ihn« beibehalten.
  alternative: Die Suffixe kollektiv auf Jakob beziehungsweise Israel beziehen und mit Pluralpronomen wiedergeben.
  rationale: Der hebräische Text verwendet konsequent den Singular und stellt Jakob/Israel wahrscheinlich als eine kollektive Person dar. Die Übersetzung bewahrt diese Form, ohne den Bezug ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der hebräischen Abfolge, während »fest bestehen« und »Alle, die ihn bedrängen« natürlich verständlich sind. Die kollektive Einzahl wird nicht aufgelöst.
