source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אֶשְׁבֹּ֤ר עֻלּ/וֹ֙ מֵ/עַ֣ל צַוָּארֶ֔/ךָ וּ/מוֹסְרוֹתֶ֖י/ךָ אֲנַתֵּ֑ק וְ/לֹא יַעַבְדוּ ב֥/וֹ ע֖וֹד זָרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/008.yaml
  text: And it shall happen in that day[a], declares Yahweh of Armies, that I will break his yoke from off your neck, and I will tear off your bonds[b], and foreigners shall no longer make him their servant.
translation:
  language: de
  text: 'An jenem Tag wird es geschehen – Spruch Jahwes der Heerscharen[b]: Ich werde sein Joch von deinem Nacken brechen und deine Fesseln zerreißen. Fremde werden ihn nicht länger versklaven.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Fremde werden ihn nicht länger zu Dienst für sich zwingen.“ Der hebräische Schlusssatz ist stark verdichtet; im Zusammenhang ist gemeint, dass Jakob beziehungsweise Israel nicht länger fremder Zwangsherrschaft unterworfen sein wird.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionell: „der HERR der Heerscharen“; auch möglich: „Jahwe der Heere“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: An jenem Tag wird es geschehen
  rationale: Die prophetische Zukunftsformel wird in natürlichem, gegenwärtigem Deutsch wiedergegeben, ohne ihren feierlichen Charakter zu verlieren.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: Spruch Jahwes der Heerscharen
  rationale: נְאֻם bezeichnet eine autoritative prophetische Erklärung. Der Gottesname wird als „Jahwe“ wiedergegeben; „Heerscharen“ bewahrt die umfassende militärisch-kosmische Bedeutung von צְבָאוֹת.
- source_word: אֶשְׁבֹּר עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: Ich werde sein Joch von deinem Nacken brechen
  rationale: Die wechselnden Pronomina des Hebräischen („sein“, „dein“) bleiben erhalten, statt den möglichen Bezug stillschweigend zu vereinheitlichen. „Brechen“ entspricht der Jochmetaphorik.
- source_word: וּמוֹסְרוֹתֶיךָ אֲנַתֵּק
  choice: und deine Fesseln zerreißen
  rationale: מוֹסְרוֹת bezeichnet bindende Riemen oder Fesseln; נתק drückt das gewaltsame Auseinanderreißen beziehungsweise Lösen aus.
- source_word: וְלֹא יַעַבְדוּ בוֹ עוֹד זָרִים
  choice: Fremde werden ihn nicht länger für sich arbeiten lassen
  rationale: עבד mit ב kann hier ausdrücken, jemanden zur Arbeit beziehungsweise zum Dienst zu zwingen. Die Formulierung erhält das maskuline Singularpronomen und macht den Befreiungskontext verständlich, ohne die syntaktische Verdichtung zu verdecken.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Hebräischen ausdrücklich stehende Bundesname erkennbar bleibt.
- issue: Bedeutung des Titels צְבָאוֹת
  choice: der Heerscharen
  alternative: der Heere
  rationale: „Heerscharen“ kann sowohl irdische als auch himmlische Mächte umfassen und wahrt die traditionelle Würde des Gottesprädikats.
- issue: Bedeutung von עבד in der Schlussklausel
  choice: ihn nicht länger für sich arbeiten lassen
  alternative: ihn nicht länger versklaven
  rationale: Im Zusammenhang mit Joch und Fesseln ist erzwungener Dienst gemeint. Die gewählte Fassung bewahrt die Dienst-/Arbeitsbedeutung des Verbs, während die Alternative die Folge stärker ausdeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Sprachklang. Die auffälligen Wechsel zwischen „sein“, „dein“ und „ihn“ werden gemäß dem hebräischen Text beibehalten; eine Fußnote erläutert lediglich die verdichtete Schlussklausel.
