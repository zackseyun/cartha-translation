source:
  edition: WLC
  text: מַה תִּזְעַק֙ עַל שִׁבְרֵ֔/ךְ אָנ֖וּשׁ מַכְאֹבֵ֑/ךְ עַ֣ל רֹ֣ב עֲוֺנֵ֗/ךְ עָֽצְמוּ֙ חַטֹּאתַ֔יִ/ךְ עָשִׂ֥יתִי אֵ֖לֶּה לָֽ/ךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/015.yaml
  text: Why do you cry out over your injury? Your pain is incurable[a]. Because your iniquity is great, because your sins are many[b], I have done these things to you.
translation:
  language: de
  text: Warum schreist du wegen deiner Verletzung[a]? Dein Schmerz ist unheilbar[b]. Weil deine Schuld so groß und deine Sünden so zahlreich sind, habe ich dir all das angetan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wegen deiner Wunde“ beziehungsweise „wegen deines Bruchs“. Das hebräische Wort kann eine Verletzung, einen Bruch oder einen Zusammenbruch bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Adjektiv kann einen schwer kranken, hoffnungslosen oder nicht mehr heilbaren Zustand bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תִּזְעַק
  choice: Warum schreist du
  rationale: מַה leitet hier eine rhetorische Warum-Frage ein; זעק bezeichnet einen lauten Schrei aus Not. „Schreien“ gibt die Intensität in natürlichem Deutsch wieder.
- source_word: עַל שִׁבְרֵךְ
  choice: wegen deiner Verletzung
  rationale: שֶׁבֶר kann Bruch, Zusammenbruch oder Wunde bezeichnen. „Verletzung“ bewahrt die körperliche Metapher, ohne sie unnötig auf einen Knochenbruch einzuengen; עַל gibt hier den Anlass des Schreiens an.
- source_word: אָנושׁ מַכְאֹבֵךְ
  choice: Dein Schmerz ist unheilbar
  rationale: מַכְאוֹב bedeutet Schmerz oder Leiden. אָנושׁ bezeichnet einen schweren, verzweifelten beziehungsweise nicht mehr heilbaren Zustand; „unheilbar“ trifft im Zusammenhang die wahrscheinliche Aussage.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: Weil deine Schuld so groß ist
  rationale: עַל führt den Grund für das Gericht ein; רֹב bezeichnet Größe oder Fülle. עָוֹן kann Schuld, Vergehen oder deren Straffolge meinen, hier steht die moralische Schuld im Vordergrund.
- source_word: עָצְמוּ חַטֹּאתַיִךְ
  choice: deine Sünden so zahlreich sind
  rationale: עצם kann stark oder zahlreich sein bedeuten. Beim pluralischen „Sünden“ und parallel zur Größe der Schuld ist die quantitative Wiedergabe „so zahlreich“ idiomatisch und sachgerecht.
- source_word: עָשִׂיתִי אֵלֶּה לָךְ
  choice: habe ich dir all das angetan
  rationale: Das Perfekt עָשִׂיתִי bezeichnet die vollzogene Handlung des Sprechers. „All das“ gibt den pluralischen Demonstrativbezug אֵלֶּה im Deutschen natürlich wieder; „angetan“ wahrt die direkte Gerichtshandlung gegenüber der Angeredeten.
theological_decisions:
- issue: Göttliche Urheberschaft des Gerichts
  choice: „habe ich dir all das angetan“
  alternative: „all das ist dir widerfahren“
  rationale: Der hebräische Text verwendet ausdrücklich die erste Person Singular עָשִׂיתִי („ich habe getan“). Die Übersetzung bewahrt diese direkte Urheberschaft des im Kontext als HERR erkennbaren Sprechers und schwächt sie nicht zu einem unpersönlichen Geschehen ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage bleibt knapp und eindringlich; die weiblichen Singularformen des Hebräischen sind im Deutschen in der direkten Anrede nicht eigens markiert. Die parallelen Begründungen werden zu einem natürlichen deutschen Weil-Satz verbunden, ohne den kausalen Zusammenhang oder die direkte göttliche Gerichtsaussage abzuschwächen.
