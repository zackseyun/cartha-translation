source:
  edition: WLC
  text: ה֗וֹי כִּ֥י גָד֛וֹל הַ/יּ֥וֹם הַ/ה֖וּא מֵ/אַ֣יִן כָּמֹ֑/הוּ וְ/עֵֽת צָרָ֥ה הִיא֙ לְ/יַֽעֲקֹ֔ב וּ/מִמֶּ֖/נָּה יִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/007.yaml
  text: Alas! For that day is great[a]; there is none like it. It is a time of distress for Jacob[c][b], yet he will be saved out of it.
translation:
  language: de
  text: Wehe! Denn groß ist jener Tag[a], keiner ist wie er. Eine Zeit der Not ist er für Jakob[b]; doch aus ihr wird er gerettet werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ach!“; der einleitende Ruf drückt Erschrecken oder Klage aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Zeit der Bedrängnis für Jakob“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „doch aus ihr wird er befreit werden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Wehe!
  rationale: Die Interjektion drückt hier Klage und Erschrecken aus. „Wehe!“ bewahrt die eindringliche, prophetische Tonlage; die mögliche Wiedergabe „Ach!“ wird in einer Fußnote genannt.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die Begründung für den vorangestellten Klageruf ein.
- source_word: גָדוֹל
  choice: groß
  rationale: Das Adjektiv bezeichnet Größe beziehungsweise außerordentliche Bedeutung. Die bedrohliche Qualität ergibt sich aus dem Kontext und wird nicht durch „schrecklich“ in das Wort selbst hineingelesen.
- source_word: הַיּוֹם הַהוּא
  choice: jener Tag
  rationale: Die Formulierung erhält den bestimmten prophetischen Verweis und klingt zugleich in modernem Standarddeutsch natürlich und würdevoll.
- source_word: מֵאַיִן כָּמֹהוּ
  choice: keiner ist wie er
  rationale: Dies gibt die hebräische Aussage der Unvergleichlichkeit knapp wieder; das maskuline Pronomen bezieht sich auf „Tag“.
- source_word: וְעֵת צָרָה
  choice: Eine Zeit der Not
  rationale: עֵת bezeichnet eine Zeit oder Frist, צָרָה Bedrängnis, Not oder Drangsal. „Zeit der Not“ ist verständlich und wahrt den Ernst der Aussage.
- source_word: לְיַעֲקֹב
  choice: für Jakob
  rationale: Der Eigenname wird beibehalten, statt ihn deutend durch „Israel“ oder „Gottes Volk“ zu ersetzen.
- source_word: וּמִמֶּנָּה
  choice: doch aus ihr
  rationale: Das feminine Suffix verweist grammatisch auf die feminine „Zeit“ beziehungsweise die darin bezeichnete Notlage. „Aus ihr“ wahrt diesen Rückbezug.
- source_word: יִוָּשֵׁעַ
  choice: wird er gerettet werden
  rationale: Der Nifal von ישׁע bezeichnet Gerettet- oder Befreitwerden. „Gerettet werden“ erhält die Verbindung zum biblischen Rettungsvokabular, während „aus ihr“ die konkrete Rettung aus der Not bezeichnet.
theological_decisions:
- issue: Referent von „Jakob“
  choice: „Jakob“ bleibt als Name im Haupttext stehen und kann das personifizierte Bundesvolk bezeichnen.
  alternative: „Israel“, „Jakobs Nachkommen“ oder „Gottes Volk“
  rationale: Der hebräische Text nennt Jakob. Die Beibehaltung wahrt die prophetische und bundestheologische Ausdrucksweise, ohne die Metonymie im Haupttext auszudeuten.
- issue: Bedeutungsumfang von יִוָּשֵׁעַ
  choice: „wird er gerettet werden“
  alternative: „wird er befreit werden“ oder „wird er entkommen“
  rationale: Die gewählte Form bewahrt den weiteren theologischen Klang des Verbs, ohne eine ausschließlich geistliche oder ewige Rettung festzulegen; der Ausdruck „aus ihr“ bindet die Rettung an die genannte Not.
- issue: Verhältnis von Not und Rettung
  choice: Die Spannung zwischen der einzigartigen Not und der zugesagten Rettung bleibt durch „doch“ ausdrücklich bestehen.
  alternative: Eine stärker kausale oder zeitlich genauer bestimmte Verknüpfung
  rationale: Der Text verheißt Rettung aus der Not, legt hier aber weder deren Zeitpunkt noch ihren genauen Vollzug fest. Diese Offenheit wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Eindringlichkeit. Die Satzstellung bleibt relativ nah am Hebräischen, ohne unnatürlich zu wirken. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
