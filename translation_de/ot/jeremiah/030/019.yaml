source:
  edition: WLC
  text: וְ/יָצָ֥א מֵ/הֶ֛ם תּוֹדָ֖ה וְ/ק֣וֹל מְשַׂחֲקִ֑ים וְ/הִרְבִּתִי/ם֙ וְ/לֹ֣א יִמְעָ֔טוּ וְ/הִכְבַּדְתִּ֖י/ם וְ/לֹ֥א יִצְעָֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/019.yaml
  text: From them will come thanksgiving and the sound of those who rejoice[a]; I will multiply them, and they will not be few; I will honor them[b], and they will not be insignificant.
translation:
  language: de
  text: Von ihnen werden Dank und der Jubel der Feiernden ausgehen[a]. Ich werde sie zahlreich machen, und ihre Zahl wird nicht gering sein. Ich werde ihnen Ansehen verleihen[b], und sie werden nicht unbedeutend sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Klang der Lachenden/Spielenden“; das hebräische Wort kann festliches Lachen, Spielen oder ausgelassene Freude bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich werde sie zu Ehren bringen, und sie werden nicht klein sein.“ Die hebräischen Wörter können sowohl gesellschaftliches Ansehen als auch Größe beziehungsweise geringe Bedeutung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא מֵהֶם
  choice: Von ihnen werden … ausgehen
  rationale: Die Wortfolge gibt Herkunft und Hervorgehen wieder. Das Perfekt mit וְ steht im prophetischen Zusammenhang für das verheißene künftige Geschehen.
- source_word: תּוֹדָה
  choice: Dank
  rationale: Im Zusammenhang bezeichnet das Wort dankbares Lob, nicht notwendig ein konkretes Dankopfer. „Dank“ ist knapp und lässt die Form dieses Lobes offen.
- source_word: וְקוֹל מְשַׂחֲקִים
  choice: und der Jubel der Feiernden
  rationale: קוֹל bezeichnet den hörbaren Laut, während מְשַׂחֲקִים festliches Lachen, Spielen oder ausgelassene Freude ausdrücken kann. „Jubel der Feiernden“ gibt den festlichen Zusammenhang natürlich wieder; die weitere Bedeutungsbreite wird in der Fußnote bewahrt.
- source_word: וְהִרְבִּתִים
  choice: Ich werde sie zahlreich machen
  rationale: Der Hifil von רבה bezeichnet hier das Vermehren der wiederhergestellten Gemeinschaft. Die Formulierung ist im modernen Deutsch klarer als „ich werde sie mehren“.
- source_word: וְלֹא יִמְעָטוּ
  choice: und ihre Zahl wird nicht gering sein
  rationale: מעט kann „wenig/gering werden“ bedeuten. Nach der Zusage des Vermehrens liegt die zahlenmäßige Bedeutung nahe und wird im Deutschen ausdrücklich gemacht.
- source_word: וְהִכְבַּדְתִּים
  choice: Ich werde ihnen Ansehen verleihen
  rationale: Der Hifil von כבד kann „schwer/gewichtig machen“ und übertragen „ehren, zu Ansehen bringen“ bedeuten. Die gewählte Wendung bezeichnet soziale Würde, ohne „verherrlichen“ theologisch zu überladen.
- source_word: וְלֹא יִצְעָרוּ
  choice: und sie werden nicht unbedeutend sein
  rationale: צער kann Kleinheit oder geringe Bedeutung bezeichnen. Im Gegensatz zum verliehenen Ansehen tritt hier die Bedeutung des gesellschaftlichen Gewichts hervor, während die Fußnote die wörtlichere Alternative festhält.
theological_decisions:
- issue: Art der verheißenen Wiederherstellung
  choice: Die Aussage beschreibt die konkrete Wiederherstellung der Gemeinschaft durch Dank, Festfreude, zahlenmäßiges Wachstum und neues Ansehen.
  alternative: Die Segnungen ausschließlich zu vergeistigen oder ausschließlich als nationalpolitische Erhöhung festzulegen.
  rationale: Der hebräische Text nennt gemeinschaftlich wahrnehmbare Folgen der Wiederherstellung, bestimmt aber weder eine ausschließlich innerliche noch eine eng umrissene spätere heilsgeschichtliche Deutung.
- issue: Spannung zwischen Zahl und gesellschaftlicher Bedeutung
  choice: מעט wird im ersten Gegensatz zahlenmäßig, צער im zweiten Gegensatz als Bedeutungslosigkeit wiedergegeben.
  alternative: Beide Verben einheitlich mit „gering/klein sein“ wiederzugeben.
  rationale: Die jeweiligen Parallelglieder – Vermehrung einerseits und verliehenes Ansehen andererseits – stützen diese kontextuelle Differenzierung. Die semantische Überschneidung bleibt durch Fußnote [b] sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt der hebräischen Parallelität, ohne unnatürlich wörtlich zu klingen. „Jubel“ und „Ansehen verleihen“ sind idiomatische Wiedergaben; die jeweiligen Bedeutungsalternativen werden in den Fußnoten offengehalten.
