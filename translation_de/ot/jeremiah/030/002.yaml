source:
  edition: WLC
  text: כֹּֽה אָמַ֧ר יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כְּתָב לְ/ךָ֗ אֵ֧ת כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבַּ֥רְתִּי אֵלֶ֖י/ךָ אֶל סֵֽפֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Write for yourself in a scroll all the words that I have spoken to you.'
translation:
  language: de
  text: 'So spricht Jahwe, der Gott Israels: Schreibe dir alle Worte, die ich zu dir gesprochen habe, auf eine Schriftrolle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ein Buch“. Das hebräische Wort סֵפֶר bezeichnet ein Schriftstück, in diesem historischen Umfeld häufig eine Schriftrolle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird im Deutschen idiomatisch und zugleich feierlich mit dem Präsens wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Hebräischen ausdrücklich stehende Gottesbezeichnung wird als Eigenname wiedergegeben; „Jahwe“ ist die übliche deutsche Form.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die Status-constructus-Verbindung wird klar und in geläufiger biblischer Sprache wiedergegeben.
- source_word: כְּתָב לְךָ
  choice: Schreibe dir
  rationale: Der Imperativ und das persönliche Dativpronomen bleiben erhalten, ohne den möglichen Dativ des Interesses durch eine ausführlichere Deutung festzulegen.
- source_word: כָּל הַדְּבָרִים
  choice: alle Worte
  rationale: Im Zusammenhang mit Gottes Reden und dessen schriftlicher Aufzeichnung bezeichnet דְּבָרִים hier am ehesten die gesprochenen Worte, nicht allgemein Ereignisse oder Angelegenheiten.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: die ich zu dir gesprochen habe
  rationale: Das deutsche Perfekt stellt die vorausgegangene Rede mit ihrer fortdauernden Bedeutung für die nun angeordnete Niederschrift natürlich dar.
- source_word: אֶל־סֵפֶר
  choice: in eine Schriftrolle
  rationale: סֵפֶר bezeichnet ein schriftliches Dokument; im historischen Kontext ist eine Schriftrolle wahrscheinlicher als ein Buch in moderner Kodexform. Die Präposition אֶל wird hier zielgerichtet mit „in“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottesnamen. Die Wiedergabe „Jahwe“ erhält diesen Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die feste Formel „So spricht“ wahrt den traditionellen Klang, während Satzbau und Wortwahl gegenwärtig bleiben.
