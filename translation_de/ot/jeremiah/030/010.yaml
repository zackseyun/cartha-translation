id: JER.30.10
reference: Jeremiah 30:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אַתָּ֡ה אַל תִּירָא֩ עַבְדִּ֨/י יַעֲקֹ֤ב נְאֻם יְהֹוָה֙ וְ/אַל תֵּחַ֣ת יִשְׂרָאֵ֔ל כִּ֠י הִנְ/נִ֤י מוֹשִֽׁיעֲ/ךָ֙ מֵֽ/רָח֔וֹק וְ/אֶֽת זַרְעֲ/ךָ֖ מֵ/אֶ֣רֶץ שִׁבְיָ֑/ם וְ/שָׁ֧ב יַעֲקֹ֛ב וְ/שָׁקַ֥ט וְ/שַׁאֲנַ֖ן וְ/אֵ֥ין מַחֲרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/010.yaml
  text: But as for you[a], do not fear, my servant Jacob, declares Yahweh, and do not be dismayed, Israel; for behold, I am saving you from far away, and your offspring from the land of their captivity. Jacob will return and be quiet and at ease[c][b], with no one to make him afraid.
translation:
  language: de
  text: 'Du aber, fürchte dich nicht, mein Diener Jakob – Ausspruch Jahwes –, und sei nicht verzagt, Israel! Denn sieh: Ich rette dich[a] aus der Ferne und deine Nachkommen aus dem Land ihrer Gefangenschaft. Jakob wird zurückkehren und Ruhe und Sicherheit finden; niemand wird ihn in Schrecken versetzen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn sieh: Ich werde dich aus der Ferne retten und deine Nachkommen aus dem Land, in dem sie gefangen sind.“ Die hebräische Partizipialform kann mit „sieh, ich“ eine unmittelbar bevorstehende oder gewisse zukünftige Handlung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jakob wird zurückkehren, ruhig und unbesorgt sein, und niemand wird ihn in Schrecken versetzen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Du aber
  rationale: Die Konjunktion mit dem ausdrücklich gesetzten Pronomen markiert einen betonten Kontrast beziehungsweise Übergang; „Du aber“ gibt dies knapp und natürlich wieder.
- source_word: אַל תִּירָא
  choice: fürchte dich nicht
  rationale: Direkte und geläufige Wiedergabe des Verbots mit ירא.
- source_word: עַבְדִּי
  choice: mein Diener
  rationale: Hier ist עבד eine ehrende Bezeichnung für Jakob/Israel; „Diener“ passt besser als das statusbetonte „Sklave“.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den formelhaften, feierlichen Charakter der prophetischen Redewendung und gibt den Gottesnamen als „Jahwe“ wieder.
- source_word: וְאַל תֵּחַת
  choice: erschrick nicht
  rationale: חתת im Nifal bezeichnet hier Einschüchterung, Bestürzung oder Verzagtheit. „Erschrick nicht“ ist verständlich und bleibt vom vorausgehenden „fürchte dich nicht“ unterschieden.
- source_word: כִּי הִנְנִי מוֹשִׁיעֲךָ
  choice: 'Denn sieh: Ich rette dich'
  rationale: „Sieh“ erhält die hervorhebende Unmittelbarkeit von הִנְנִי; das deutsche Präsens gibt die partizipiale Darstellung einer unmittelbar bevorstehenden oder gewissen Rettung wieder.
- source_word: מֵרָחוֹק
  choice: aus der Ferne
  rationale: Idiomatiche und räumlich offene Wiedergabe der Herkunft aus großer Entfernung.
- source_word: זַרְעֲךָ
  choice: deine Nachkommen
  rationale: Das kollektive זרע bezeichnet hier die Nachkommenschaft; „Nachkommen“ ist im modernen Deutsch klarer als das wörtliche „Same“.
- source_word: מֵאֶרֶץ שִׁבְיָם
  choice: aus dem Land ihrer Gefangenschaft
  rationale: Folgt der hebräischen Konstruktion eng und wahrt, dass שׁבי Gefangenschaft beziehungsweise den Zustand als Gefangene bezeichnet.
- source_word: וְשָׁב יַעֲקֹב
  choice: Jakob wird zurückkehren
  rationale: שׁוב bezeichnet hier die verheißene Rückkehr und Wiederherstellung.
- source_word: וְשָׁקַט וְשַׁאֲנַן
  choice: Ruhe und Sicherheit finden
  rationale: Die beiden Verben beschreiben ungestörte Ruhe und sorglose Sicherheit. Die verbale deutsche Wendung gibt das Begriffspaar natürlich wieder, ohne beide Ausdrücke zusammenfallen zu lassen.
- source_word: וְאֵין מַחֲרִיד
  choice: niemand wird ihn aufschrecken
  rationale: Die Konstruktion bezeichnet das Fehlen eines Menschen oder einer Macht, die Schrecken verursacht; die Formulierung bewahrt diesen kausativen Sinn.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Eigennamen YHWH. „Jahwe“ gibt ihn im Deutschen als Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Jakob und Israel als parallele Namen
  choice: Beide Namen bleiben erhalten
  alternative: Beide Vorkommen einheitlich mit „Israel“ wiedergeben
  rationale: Der hebräische Text verwendet bewusst beide Bundesnamen in paralleler Anrede; ihre Beibehaltung wahrt die literarische und theologische Spannung.
- issue: Zeitbezug von מוֹשִׁיעֲךָ nach הִנְנִי
  choice: Ich rette dich
  alternative: Ich werde dich retten
  rationale: Das Partizip mit הִנְנִי kann unmittelbar einsetzendes oder gewiss bevorstehendes Handeln ausdrücken. Das Präsens wahrt die präsentische Unmittelbarkeit; die Fußnote nennt die mögliche futurische Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-feierlichem Klang. Die direkte Anrede und die Namen Jakob, Israel und Jahwe bleiben sichtbar. „Ruhe und Sicherheit finden“ vermeidet das im Deutschen missverständliche „still sein“ und vermittelt die zwei hebräischen Ruhebegriffe idiomatisch.
