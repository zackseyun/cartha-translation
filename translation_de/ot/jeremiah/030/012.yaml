  text: כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָנ֣וּשׁ לְ/שִׁבְרֵ֑/ךְ נַחְלָ֖ה מַכָּתֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/012.yaml
  text: 'For thus says Yahweh: Your fracture is incurable[a]; your wound is grievous.'
translation:
  language: de
  text: 'Denn so spricht Jahwe: Dein Bruch ist unheilbar[a], deine Wunde ist schwer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deine Verletzung ist unheilbar; deine Wunde ist schwer.“'
    reason: 'Lexikalische Alternative: שֶׁבֶר kann neben einem konkreten Bruch auch allgemeiner eine Verletzung oder Schädigung bezeichnen.'
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt die folgende göttliche Erklärung ein und knüpft begründend an den Zusammenhang an.
- source_word: כֹה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Die traditionelle deutsche Prophetenformel bewahrt den feierlichen Botenstil des Hebräischen.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אָנושׁ
  choice: unheilbar
  rationale: Im medizinischen Bild bezeichnet das Adjektiv einen verzweifelten, nicht mehr heilbaren Zustand.
- source_word: לְשִׁבְרֵךְ
  choice: dein Bruch
  rationale: שֶׁבֶר bezeichnet konkret einen Bruch oder Zusammenbruch; „Bruch“ erhält hier das körperlich-medizinische Bild.
- source_word: נַחְלָה
  choice: ist schwer
  rationale: Die feminine Form beschreibt die Wunde prädikativ als schwer beziehungsweise ernst; „schwer“ ist im Deutschen natürlich und vermeidet eine unbelegte Gleichsetzung mit „unheilbar“.
- source_word: מַכָּתֵךְ
  choice: deine Wunde
  rationale: Im Zusammenhang der Verletzungsmetaphorik ist „Wunde“ die natürliche Entsprechung und passt zu „Bruch“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Bundesnamen als Eigennamen wieder, ohne ihn durch einen Herrschaftstitel zu ersetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die knappe Parallelstruktur und die medizinische Bildsprache des Hebräischen bleiben erhalten.
