  text: וִ/הְיִ֥יתֶם לִ֖/י לְ/עָ֑ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/כֶ֖ם לֵ/אלֹהִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/022.yaml
  text: And you will be my people[a], and I will be your God.
translation:
  language: de
  text: Und ihr werdet mein Volk sein[a], und ich werde euer Gott sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ihr werdet mir zum Volk sein, und ich werde euch zum Gott sein.« Diese Bundesformel drückt wechselseitige Zugehörigkeit aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: ihr werdet … sein
  rationale: Die mit ו verbundene Qatal-Form von היה hat hier im prophetischen Zusammenhang Zukunftsbedeutung. Die Formulierung ist modernes, klares Deutsch.
- source_word: לִי לְעָם
  choice: mein Volk
  rationale: Die hebräische Wendung bedeutet wörtlich „mir zum Volk“, wird im Deutschen innerhalb der Bundesformel jedoch natürlich und treffend mit „mein Volk“ wiedergegeben.
- source_word: וְאָנֹכִי
  choice: und ich
  rationale: Das selbstständige Pronomen אָנֹכִי setzt einen gewissen Nachdruck auf das Ich; in der ausgewogenen deutschen Satzstruktur wird dieser durch das ausdrücklich gesetzte „ich“ hinreichend bewahrt.
- source_word: אֶהְיֶה
  choice: ich werde … sein
  rationale: Das Imperfekt von היה bezeichnet hier die Zukunft und entspricht symmetrisch dem ersten Satzglied.
- source_word: לָכֶם לֵאלֹהִים
  choice: euer Gott
  rationale: Wörtlich heißt die Konstruktion „euch zum Gott“. Im Kontext der Bundesformel drückt sie Zugehörigkeit aus und wird im Deutschen idiomatisch mit „euer Gott“ wiedergegeben; אֱלֹהִים bezeichnet hier den Gott Israels.
theological_decisions:
- issue: Wiedergabe der Bundesformel
  choice: Und ihr werdet mein Volk sein, und ich werde euer Gott sein.
  alternative: Und ihr werdet mir zum Volk sein, und ich werde euch zum Gott sein.
  rationale: Die gewählte Fassung bewahrt die wechselseitige Zugehörigkeit und die Zukunftsausrichtung der klassischen Bundesformel, ohne zusätzliche theologische Aussagen einzutragen. Die wörtlichere Konstruktion wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Bundesformel wird natürlich formuliert; ihre hebräische Konstruktion und Funktion werden in der Fußnote erläutert.
