source:
  edition: WLC
  text: הִנֵּ֣ה סַעֲרַ֣ת יְהוָ֗ה חֵמָה֙ יָֽצְאָ֔ה סַ֖עַר מִתְגּוֹרֵ֑ר עַ֛ל רֹ֥אשׁ רְשָׁעִ֖ים יָחֽוּל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/023.yaml
  text: Look[a], Yahweh’s storm of wrath has gone out, a sweeping tempest[b]; it will whirl down on the head of the wicked.
translation:
  language: de
  text: Siehe, Jahwes Zornessturm ist losgebrochen, ein wirbelnder Sturm.[a] Auf den Kopf der Frevler wird er herabwirbeln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Siehe, ein Sturm Jahwes, Zorn, ist losgebrochen, ein sich zusammenballender Sturm.“ Das Hebräische häuft Sturmbegriffe; die genaue Bedeutung des Partizips ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Auf den Kopf der Frevler wird er niedergehen.“ Das letzte Verb ist schwierig und kann eine wirbelnde, gewaltsam auf sie kommende Bewegung des Sturms bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt die aufmerksamkeitslenkende und eindringliche Funktion des hebräischen Ausrufs; im würdevollen modernen Bibelstil weiterhin verständlich.
- source_word: סַעֲרַת יְהוָה
  choice: ein Sturm Jahwes
  rationale: Gibt die Constructusverbindung unmittelbar wieder und lässt offen, ob der Sturm Jahwe zugehört oder von ihm gesandt wird.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im Ausgangstext ausdrücklich stehenden Gottesnamen als Eigennamen wieder.
- source_word: חֵמָה
  choice: Zorn
  rationale: Bezeichnet hier heftigen göttlichen Zorn; die substantivische Wiedergabe erhält die knappe, spannungsvolle Reihung des Hebräischen.
- source_word: יָצְאָה
  choice: ist losgebrochen
  rationale: Vermittelt sowohl das Herausgehen beziehungsweise Einsetzen als auch die gewaltsame Bewegung eines Sturms in natürlichem Deutsch.
- source_word: סַעַר מִתְגּוֹרֵר
  choice: ein wirbelnder Sturm
  rationale: Erhält die Häufung der Sturmbegriffe und gibt das Partizip als lebhafte, fortdauernde Bewegung wieder; die genaue Bedeutung des seltenen Ausdrucks bleibt unsicher.
- source_word: עַל רֹאשׁ רְשָׁעִים
  choice: über dem Kopf der Frevler
  rationale: Bewahrt das konkrete Bild des Gerichts über dem Kopf der Betroffenen. „Frevler“ bezeichnet Menschen, die schuldhaft und gottwidrig handeln.
- source_word: יָחוּל
  choice: wird er kreisen
  rationale: Die im Kontext wahrscheinliche Sturmbewegung wird aufgenommen, ohne ein im Hebräischen nicht eindeutig ausgedrücktes Hinabstürzen festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich; die Umschrift macht den Eigennamen sichtbar, ohne eine konfessionelle Deutung einzutragen.
- issue: Bezeichnung der רְשָׁעִים
  choice: Frevler
  alternative: Gottlose; Schuldige
  rationale: „Frevler“ bewahrt den moralisch-religiösen Gehalt, ohne den Ausdruck auf einen rein juristischen Status zu verengen.
- issue: Richtung und Art des abschließenden Gerichtsbildes
  choice: wird er kreisen
  alternative: wird er niederwirbeln; wird er niedergehen
  rationale: Das schwierige Verb wird im Sturmkontext als kreisende beziehungsweise wirbelnde Bewegung verstanden; eine eindeutige Abwärtsrichtung ist lexikalisch nicht sicher.
translation_notes:
  register: Knapper, eindringlicher prophetischer Stil in modernem Standarddeutsch. Die Wiederholung von „Sturm“ bildet die emphatische Häufung des Hebräischen ab; Doppelpunkt und kurze Apposition erhalten dessen spannungsvolle Syntax.
