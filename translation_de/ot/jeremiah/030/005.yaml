base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/005.yaml
  text: 'For thus says Yahweh: “We have heard a sound of trembling[a], of fear[b], and there is no peace.”'
translation:
  language: de
  text: 'Denn so spricht Jahwe:


    »Wir haben einen Laut des Entsetzens[a] gehört:

    Furcht und kein Frieden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Stimme des Zitterns« oder »einen Schreckensruf«. Das hebräische Wort kann je nach Zusammenhang »Stimme«, »Laut« oder »Geräusch« bedeuten; das folgende Wort bezeichnet Zittern, Bestürzung oder Entsetzen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Leitet die folgende Gottesrede mit erklärender beziehungsweise begründender Funktion ein, ohne die Beziehung zum Kontext enger festzulegen.
- source_word: כֹה אָמַר
  choice: so spricht
  rationale: Entspricht der geläufigen deutschen Wiedergabe der prophetischen Botenformel und wahrt deren feierlichen Charakter.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder; »Jahwe« ist die im modernen Deutschen übliche Form.
- source_word: קוֹל
  choice: eine Stimme
  rationale: קוֹל kann Stimme, Laut oder Geräusch bezeichnen. »Stimme« lässt hier offen, ob ein artikulierter Ruf oder allgemein ein hörbarer Ausdruck der Bestürzung gemeint ist.
- source_word: חֲרָדָה
  choice: des Bebens
  rationale: Bewahrt den körperlich erfahrbaren Aspekt des durch Schrecken ausgelösten Zitterns und bildet die Genitivverbindung קוֹל חֲרָדָה knapp nach.
- source_word: שָׁמָעְנוּ
  choice: haben wir gehört
  rationale: Gibt das hebräische Perfekt als gegenwartsrelevante Wahrnehmung wieder und erhält die erste Person Plural.
- source_word: פַּחַד
  choice: Angst
  rationale: Eine natürliche deutsche Entsprechung für starke Furcht; die Intensität wird nicht unnötig auf »Entsetzen« festgelegt.
- source_word: וְאֵין
  choice: und kein
  rationale: Bewahrt die einfache hebräische Koordination und die existentielle Verneinung in einer knappen deutschen Form.
- source_word: שָׁלוֹם
  choice: Frieden
  rationale: Passt zum Gegensatz von Angst und fehlender Sicherheit; zugleich bleibt das weitere Bedeutungsspektrum von Wohlergehen und Unversehrtheit anklingend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. Seine Wiedergabe als »Jahwe« macht dies transparent, ohne ihn durch einen Titel zu ersetzen.
- issue: Sprecher des Plurals שָׁמָעְנוּ
  choice: haben wir gehört
  alternative: man hört
  rationale: Der Sprecherkreis wird im Vers nicht ausdrücklich bestimmt. Der erste Person Plural bleibt deshalb erhalten, statt ihn unpersönlich zu deuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetischer Satzform. Die poetische Zeilengliederung und die abrupte Schlusswendung werden bewahrt. »Stimme des Bebens« erhält die Mehrdeutigkeit der hebräischen Wortgruppe; die Fußnote nennt natürlichere lexikalische Alternativen.
