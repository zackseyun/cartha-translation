id: JER.30.1
reference: Jeremiah 30:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָר֙ אֲשֶׁ֣ר הָיָ֣ה אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], saying,
translation:
  language: de
  text: 'Das Wort, das von Jahwe[a] an Jeremia erging:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell auch mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: דָּבָר kann »Wort«, »Sache« oder »Botschaft« bedeuten. In der prophetischen Einleitungsformel bewahrt »das Wort« die feste Ausdrucksweise des Hebräischen.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das … an … erging
  rationale: הָיָה bedeutet grundsätzlich »sein/geschehen«; zusammen mit אֶל bezeichnet es in dieser prophetischen Formel das Ergehen beziehungsweise Empfangen des göttlichen Wortes. »erging an« ist im Deutschen natürlich und zugleich formnah.
- source_word: יִרְמְיָהוּ
  choice: Jeremia
  rationale: Die im Deutschen etablierte Form des Personennamens.
- source_word: מֵאֵת
  choice: von
  rationale: Die zusammengesetzte Präposition kennzeichnet Herkunft oder Urheber des Wortes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname JHWH wird als Eigenname wiedergegeben, statt ihn durch den Titel »der HERR« zu ersetzen. »Jahwe« ist die geläufige deutsche Transkription.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Infinitiv »sagend/um zu sagen« leitet die folgende direkte Rede ein. Im natürlichen modernen Deutsch erfüllt ein Doppelpunkt dieselbe Diskursfunktion, ohne ein schwerfälliges »indem er sprach« einzufügen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der hebräische Text enthält den Gottesnamen JHWH. »Jahwe« bewahrt ihn als Eigennamen und entspricht der im modernen Deutschen verbreiteten wissenschaftlichen Transkription; die genaue antike Aussprache bleibt unsicher.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Eingangsformel bleibt mit »Das Wort … erging« erkennbar; der abschließende Doppelpunkt verbindet den Vers flüssig mit der folgenden direkten Rede.
