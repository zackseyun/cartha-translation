  source_fidelity: 'Die Übersetzung gibt die prophetische Formel präzise wieder: „Das Wort“ entspricht הַדָּבָר, „an Jeremia erging“ bildet die Konstruktion הָיָה אֶל idiomatisch und angemessen ab, und „von Jahwe“ bewahrt die Herkunftsangabe מֵאֵת יְהוָה. Der Doppelpunkt übernimmt die einleitende Funktion von לֵאמֹר für die im folgenden Vers anschließende Rede.'
  naturalness: „Das Wort, das von Jahwe an Jeremia erging:“ ist natürliches, würdiges modernes Standarddeutsch und als prophetische Überschrift gut verständlich. Die Satzstellung ist unmarkiert und der Doppelpunkt ist an der Versgrenze sinnvoll.
  terminology: „Jahwe“ ist eine im Deutschen etablierte wissenschaftliche Wiedergabe von יְהוָה. „Jeremia“ ist die übliche deutsche Namensform. Die Fußnote erläutert JHWH und die traditionelle Wiedergabe sachlich, ohne eine strittige Aussprache zu behaupten.
