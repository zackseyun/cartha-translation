source:
  edition: WLC
  text: וְ/הָיָ֨ה אַדִּיר֜/וֹ מִמֶּ֗/נּוּ וּ/מֹֽשְׁל/וֹ֙ מִ/קִּרְבּ֣/וֹ יֵצֵ֔א וְ/הִקְרַבְתִּ֖י/ו וְ/נִגַּ֣שׁ אֵלָ֑/י כִּי֩ מִ֨י הוּא זֶ֜ה עָרַ֧ב אֶת לִבּ֛/וֹ לָ/גֶ֥שֶׁת אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/021.yaml
  text: His ruler will be one of them[a], and his governor will come out from his midst. I will bring him near, and he will approach me[c][b], for who is this who has pledged his heart to approach me? declares Yahweh.
translation:
  language: de
  text: Sein Fürst[a] wird aus ihm stammen[b], und sein Herrscher wird aus seiner Mitte hervorgehen. Ich werde ihn nahe zu mir bringen, und er wird sich mir nahen. Denn wer ist es, der sein Herz verpfändet hat[c], um sich mir zu nahen? spricht der HERR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Mächtiger“ oder „sein Vornehmer“; das hebräische Wort kann einen mächtigen, angesehenen oder vornehmen Anführer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: aus den eigenen Reihen. Das Hebräische lautet wörtlich „aus ihm“ und kann sich kollektiv auf das Volk beziehungsweise die Gemeinschaft beziehen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder sinngemäß: „der es in seinem Herzen gewagt hat, sich mir zu nahen?“ Wörtlich ist davon die Rede, das eigene Herz zu verpfänden oder als Pfand einzusetzen.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדִּירוֹ
  choice: sein Fürst
  rationale: אַדִּיר kann einen mächtigen, angesehenen oder vornehmen Menschen bezeichnen. Im Parallelismus mit מֹשְׁלוֹ passt eine Führungsbezeichnung; „Fürst“ bewahrt zugleich den gehobenen Klang, ohne die Person genauer zu bestimmen.
- source_word: מִמֶּנּוּ
  choice: aus ihm selbst
  rationale: Die Form bezeichnet die Herkunft aus dem zuvor genannten Volk beziehungsweise Gemeinwesen. Die Wiedergabe hält die grammatische Einzahl und die mögliche kollektive Bedeutung offen.
- source_word: מֹשְׁלוֹ
  choice: sein Herrscher
  rationale: Das Partizip von משל bezeichnet jemanden, der Herrschaft ausübt. „Herrscher“ gibt diese Funktion unmittelbar und würdevoll wieder.
- source_word: מִקִּרְבּוֹ
  choice: aus seiner Mitte
  rationale: קֶרֶב bezeichnet das Innere oder die Mitte. Die Formulierung bewahrt das Bild eines Herrschers, der aus der Gemeinschaft selbst hervorgeht.
- source_word: וְהִקְרַבְתִּיו
  choice: Ich werde ihn nahe zu mir bringen
  rationale: Der Hifil von קרב ist kausativ und betont, dass der HERR selbst diesem Menschen die Annäherung ermöglicht.
- source_word: וְנִגַּשׁ אֵלָי
  choice: und er wird sich mir nahen
  rationale: נגשׁ bezeichnet das feierliche Herantreten und kann kultische oder höfische Untertöne haben. „Sich nahen“ bewahrt diesen würdevollen Ton.
- source_word: עָרַב אֶת־לִבּוֹ
  choice: sein Herz dafür verpfändet hat
  rationale: ערב kann „verpfänden“ oder „als Pfand einsetzen“ bedeuten. Die Übersetzung erhält das ungewöhnliche Bild einer kühnen, verbindlichen Selbsthingabe, statt es auf „wagen“ zu verengen.
- source_word: לָגֶשֶׁת אֵלַי
  choice: sich mir zu nahen
  rationale: Die Wiederholung von נגשׁ wird auch im Deutschen wiedergegeben und hält die mögliche Bedeutung eines besonderen Zugangs zu Gott offen.
- source_word: נְאֻם יְהוָה
  choice: spricht der HERR
  rationale: Die geläufige deutsche Prophetenformel gibt נְאֻם idiomatisch wieder; der Gottesname יהוה wird traditionsgemäß als „der HERR“ dargestellt.
theological_decisions:
- issue: Art des Zugangs des Herrschers zu Gott
  choice: Der Herrscher stammt aus der Gemeinschaft und darf sich Gott nahen, weil Gott selbst ihn nahe bringt; eine genauere Amts- oder Heilsidentifikation bleibt offen.
  alternative: Die Gestalt ausdrücklich als Messias, Priesterkönig oder nachexilischen politischen Statthalter bestimmen.
  rationale: Der hebräische Text hebt die Herkunft aus der eigenen Mitte und den von Gott gewährten Zugang hervor, nennt die Gestalt aber weder ausdrücklich Messias noch Priester. Die Übersetzung bewahrt daher die kultische und königliche Spannung, ohne sie konfessionell aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Fürst“ und „sich nahen“ erhalten den feierlichen Ton und mögliche königlich-kultische Anklänge; die ungewöhnliche Herz-Metapher bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
