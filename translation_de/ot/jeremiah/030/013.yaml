  source_fidelity: 'Der deutsche Text gibt die beiden Bildfelder des Hebräischen zutreffend wieder: die forensische Wendung אֵין דָּן דִּינֵךְ mit „Niemand vertritt deine Sache“ und die medizinische Aussage über das Fehlen von Heilung und תְּעָלָה. „Wegen deiner Wunde“ ist als verständliche Einordnung von לְמָזוֹר vertretbar. Die unsichere Bedeutung von תְּעָלָה wird im Haupttext nicht überbestimmt und in der Anmerkung angemessen kenntlich gemacht.'
  naturalness: „Niemand vertritt deine Sache wegen deiner Wunde; für dich gibt es keine Heilung, kein Heilmittel“ ist modernes, idiomatisches und würdiges Standarddeutsch. Die Wiederholung von „Heilung, kein Heilmittel“ ist stilistisch möglich und entspricht der hebräischen Häufung medizinischer Begriffe.
  terminology: „Sache vertreten“ bewahrt den Rechtsbezug, ohne eine bestimmte Rollenverteilung im Gerichtsbild festzuschreiben. „Wunde“, „Heilung“ und „Heilmittel“ sind sachgerecht. Die Fußnoten dokumentieren sowohl die juristische Alternative als auch die konkrete, lexikalisch unsichere medizinische Deutung von תְּעָלָה.
