source:
  edition: WLC
  text: אֵֽין דָּ֥ן דִּינֵ֖/ךְ לְ/מָז֑וֹר רְפֻא֥וֹת תְּעָלָ֖ה אֵ֥ין לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/013.yaml
  text: There is no one to plead your case for your wound[a]; there is no healing for you[b], no remedy.
translation:
  language: de
  text: Niemand vertritt deine Sache wegen deiner Wunde[a]; für dich gibt es keine Heilung, kein Heilmittel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Niemand entscheidet deinen Rechtsstreit wegen deiner Wunde.“ Das hebräische Rechtsbild kann sowohl das Vertreten als auch das Entscheiden einer Sache bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das seltene hebräische Wort kann möglicherweise konkreter einen Verband, neu wachsendes Fleisch oder das Schließen einer Wunde bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין דָּן דִּינֵךְ
  choice: Niemand vertritt deine Sache
  rationale: Die Wendung verbindet das Partizip von דין mit dem Substantiv derselben Wortfamilie und zeichnet ein rechtliches Bild. „Deine Sache vertreten“ gibt den forensischen Sinn in natürlichem Deutsch wieder, ohne die mögliche Bedeutung „entscheiden/richten“ auszuschließen; diese steht in der Fußnote.
- source_word: לְמָזוֹר
  choice: wegen deiner Wunde
  rationale: מָזוֹר bezeichnet eine Wunde oder ein Geschwür. Die Präposition ל wird hier als Bezug des Rechtsstreits auf die Wunde verstanden; „wegen“ ist im Deutschen idiomatisch.
- source_word: רְפֻאוֹת
  choice: Heilung
  rationale: Der formal pluralische Ausdruck kann kollektiv gebraucht sein. Das deutsche Singularwort „Heilung“ vermittelt den medizinischen Sinn klar und natürlich.
- source_word: תְּעָלָה
  choice: Heilmittel
  rationale: Das seltene Wort ist in seiner genauen Bedeutung unsicher und wird mit Wundversorgung, einem Verband oder neuem Fleisch beziehungsweise Wundverschluss verbunden. „Heilmittel“ wahrt den medizinischen Zusammenhang, ohne die unsichere konkrete Vorstellung im Haupttext festzulegen.
- source_word: אֵין לָךְ
  choice: für dich gibt es keine
  rationale: Die Existenzverneinung mit der Präposition bezeichnet das Fehlen von Heilung für die angesprochene Person. Die gewählte Formulierung ist modernes, natürliches Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rechtliche Bildsprache der ersten Vershälfte und die medizinische Bildsprache der zweiten bleiben erhalten; seltene oder mehrdeutige Begriffe werden nicht überpräzisiert.
