  text: כָּל מְאַהֲבַ֣יִ/ךְ שְׁכֵח֔וּ/ךְ אוֹתָ֖/ךְ לֹ֣א יִדְרֹ֑שׁוּ כִּי֩ מַכַּ֨ת אוֹיֵ֤ב הִכִּיתִי/ךְ֙ מוּסַ֣ר אַכְזָרִ֔י עַ֚ל רֹ֣ב עֲוֺנֵ֔/ךְ עָצְמ֖וּ חַטֹּאתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/014.yaml
  text: All your lovers have forgotten you[a]; they do not seek you. For I have struck you with the wound of an enemy, with cruel discipline, because of the greatness of your iniquity[b]; your sins are numerous.
translation:
  language: de
  text: Alle deine Liebhaber haben dich vergessen[a]; keiner fragt nach dir. Denn ich habe dich mit dem Schlag eines Feindes geschlagen, mit grausamer Zurechtweisung[b], wegen deiner großen Schuld; zahlreich sind deine Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „deine Verbündeten“. Wörtlich steht im Hebräischen „deine Liebhaber“; das Bild kann auf politische und geistliche Bindungen anspielen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit harter Zurechtweisung“ oder „mit grausamer Züchtigung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַהֲבַיִךְ
  choice: deine Liebhaber
  rationale: Bewahrt die wörtliche Liebhaber-Metapher Jeremias, die zugleich auf politische Verbündete und unerlaubte Bindungen anspielen kann.
- source_word: שְׁכֵחוּךְ
  choice: haben dich vergessen
  rationale: Gibt die Grundbedeutung von שכח wieder und lässt die gegenwärtige Folge des vollendeten Handelns erkennen.
- source_word: אוֹתָךְ לֹא יִדְרֹשׁוּ
  choice: keiner fragt nach dir
  rationale: דרש kann „suchen“ oder „sich nach jemandem erkundigen“ bedeuten; im Kontext klingt die idiomatische deutsche Wendung natürlich und bezeichnet die ausbleibende Fürsorge, ohne sie ausdrücklich einzutragen.
- source_word: מַכַּת אוֹיֵב הִכִּיתִיךְ
  choice: ich habe dich geschlagen wie ein Feind
  rationale: Die ungewöhnliche Verbindung von מכה und נכה wird in natürlichem Deutsch als Schlag eines Feindes wiedergegeben. „Wie ein Feind“ bewahrt den Vergleichswert der Genitivverbindung, ohne Gott und den Feind gleichzusetzen.
- source_word: מוּסַר אַכְזָרִי
  choice: mit grausamer Züchtigung
  rationale: מוּסָר bezeichnet Zurechtweisung, Züchtigung oder erzieherische Strafe; אַכְזָרִי ist „grausam, erbarmungslos“. Die Formulierung bewahrt die Härte und den Strafcharakter.
- source_word: עַל רֹב עֲוֺנֵךְ
  choice: wegen deiner großen Schuld
  rationale: עָוֹן kann Schuld oder Vergehen bezeichnen; רֹב drückt hier das große Ausmaß aus. „Schuld“ ist im Deutschen prägnant und lässt moralische Schuld wie Schuldlast anklingen.
- source_word: עָצְמוּ חַטֹּאתָיִךְ
  choice: zahlreich sind deine Sünden
  rationale: עצם kann Stärke oder große Zahl bezeichnen. Im Parallelismus mit רֹב ist die mengenbezogene Wiedergabe naheliegend; die vorangestellte Form bewahrt den Nachdruck, ohne einen zeitlichen Zuwachs zu behaupten.
theological_decisions:
- issue: Göttliche Urheberschaft des Gerichts
  choice: „ich habe dich geschlagen“ bleibt ausdrücklich in der ersten Person stehen
  alternative: Die Aussage als bloßes Handeln der Feinde oder als unpersönliche Folge wiederzugeben
  rationale: Der hebräische Text schreibt den Schlag ausdrücklich Gott zu und begründet ihn mit Schuld und Sünden. Diese Spannung wird weder abgeschwächt noch dogmatisch erweitert.
- issue: Bedeutung der „Liebhaber“
  choice: Die metaphorische Bezeichnung bleibt im Haupttext erhalten
  alternative: „Verbündete“
  rationale: Jeremias Bildsprache verbindet politische und geistliche Untreue. Eine Festlegung allein auf außenpolitische Bündnisse würde die Mehrdeutigkeit verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Liebhaber-Metapher und die schroffe Aussage über Gottes Gericht bleiben erhalten. „Züchtigung“ ist bewusst gehoben, aber allgemein verständlich und entspricht dem Bedeutungsfeld von מוּסָר.
