source:
  edition: WLC
  text: כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הֽוֹשִׁיעֶ֑/ךָ כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הֲפִצוֹתִ֣י/ךָ שָּׁ֗ם אַ֤ךְ אֹֽתְ/ךָ֙ לֹֽא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/011.yaml
  text: For I am with you—oracle of Yahweh—to save you[a]. For I will make a full end of all the nations where I have scattered you, but of you I will not make a full end. I will discipline you with justice[b], and I will by no means leave you unpunished.
translation:
  language: de
  text: Denn ich bin bei dir, um dich zu retten – Spruch Jahwes.[a] Denn ich werde mit allen Völkern, unter die ich dich zerstreut habe, ein völliges Ende machen; mit dir aber werde ich kein völliges Ende machen. Ich werde dich nach Recht züchtigen,[b] doch ich werde dich keinesfalls ungestraft lassen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „spricht der HERR“. Das hebräische נְאֻם יְהוָה ist eine feste prophetische Botenformel.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit Recht“ beziehungsweise „nach gerechtem Maß“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Doch freisprechen werde ich dich keinesfalls.“ Die hebräische Konstruktion verstärkt die Verneinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn im Haupttext durch einen Titel zu ersetzen.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Die knappe prophetische Botenformel bleibt als feierliche, im Deutschen verständliche Formel erhalten.
- source_word: לְהוֹשִׁיעֶךָ
  choice: um dich zu retten
  rationale: Der Hifil von ישׁע bezeichnet hier die Rettung aus der bedrohten Lage; „retten“ bewahrt die breite Bedeutung.
- source_word: כָלָה
  choice: ein völliges Ende
  rationale: Die Formulierung gibt die Vorstellung eines vollständigen, vernichtenden Endes wieder und wahrt die Wiederholung im Hebräischen.
- source_word: הֲפִצוֹתִיךָ
  choice: ich dich zerstreut habe
  rationale: Der Hifil von פוץ beschreibt die von Gott bewirkte Zerstreuung unter die Völker.
- source_word: אַךְ
  choice: aber
  rationale: Die Partikel hebt den scharfen Gegensatz zwischen dem Ende der Völker und der Bewahrung des angesprochenen Volkes hervor.
- source_word: וְיִסַּרְתִּיךָ
  choice: Ich werde dich ... zurechtweisen
  rationale: יסר bezeichnet eine korrigierende, zugleich schmerzhafte Zucht. „Zurechtweisen“ bringt den erzieherischen Zweck in modernem Deutsch zum Ausdruck, ohne die folgende Strafandrohung aufzuheben.
- source_word: לַמִּשְׁפָּט
  choice: dem Recht entsprechend
  rationale: מִשְׁפָּט bezeichnet hier den Maßstab rechtmäßigen, gerechten Handelns; die Wiedergabe vermeidet sowohl willkürliche Härte als auch eine unbelegte Abschwächung zu bloßer Milde.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  choice: aber ungestraft lasse ich dich keinesfalls
  rationale: 'Infinitivus absolutus und finite Verbform verstärken zusammen mit der Verneinung die Aussage: Gott wird das Volk keineswegs freisprechen oder von Strafe ausnehmen.'
theological_decisions:
- issue: Verhältnis von Rettung, Bewahrung und Gericht
  choice: Die Rettungszusage und die Zusage, kein völliges Ende zu machen, stehen neben gerechter Zurechtweisung und unausweichlicher Strafe.
  alternative: 'Die Schlussaussage rein forensisch wiederzugeben: „Ich werde dich keinesfalls freisprechen.“'
  rationale: Der unmittelbare Zusammenhang verbindet korrigierende Zucht mit der ausdrücklichen Verneinung von Straffreiheit. Die Übersetzung bewahrt diese Spannung, ohne Rettung als Straflosigkeit oder Strafe als völlige Vernichtung zu deuten.
- issue: Bedeutung von לַמִּשְׁפָּט
  choice: dem Recht entsprechend
  alternative: maßvoll; mit Gericht
  rationale: Die hebräische Wendung kann den rechtlichen beziehungsweise angemessenen Maßstab der Zurechtweisung bezeichnen. „Dem Recht entsprechend“ wahrt diesen Sinn, ohne die mögliche Härte des Gerichts vorschnell abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „ein völliges Ende machen“ bildet die hebräische Wiederholung bewusst ab. Der Gedankenstrich kennzeichnet die eingeschobene prophetische Formel; die Schlussstellung „keinesfalls“ bewahrt den Nachdruck der hebräischen Intensivkonstruktion.
