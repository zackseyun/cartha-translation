source:
  edition: WLC
  text: לֹ֣א יָשׁ֗וּב חֲרוֹן֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִ֖ים תִּתְבּ֥וֹנְנוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/024.yaml
  text: The burning anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart. In the latter days you will understand it.
translation:
  language: de
  text: Der glühende Zorn Jahwes wird sich nicht abwenden, bis er gehandelt und die Pläne seines Herzens verwirklicht hat. In den letzten Tagen[a] werdet ihr es verstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In späteren Tagen“ oder „In kommender Zeit“. Der hebräische Ausdruck kann auf die künftige Vollendung von Gottes Vorhaben hinweisen, ohne den genauen Zeitpunkt festzulegen.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרוֹן אַף
  choice: glühende Zorn
  rationale: Die feste Verbindung beschreibt anschaulich die Hitze des Zorns. „Glühender Zorn“ bewahrt dieses Bild und klingt im Deutschen zugleich natürlich und würdevoll.
- source_word: יָשׁוּב
  choice: wird sich nicht abwenden
  rationale: שׁוב bedeutet grundsätzlich „umkehren/zurückkehren“. Da der Zorn das grammatische Subjekt ist, gibt „sich abwenden“ das Ende oder die Umkehr seiner Wirkung idiomatisch wieder, ohne vorschnell „nachlassen“ oder „sich besänftigen lassen“ zu deuten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: עַד עֲשֹׂתוֹ
  choice: bis er gehandelt hat
  rationale: Die Infinitivkonstruktion bezeichnet Jahwe als Handelnden, lässt aber den Gegenstand des Handelns unausgesprochen. „Gehandelt“ wahrt diese Offenheit natürlicher als ein im Hebräischen nicht ausdrücklich vorhandenes „es“.
- source_word: הֲקִימוֹ
  choice: verwirklicht hat
  rationale: Das Hifil von קום kann „aufrichten“, „in Kraft setzen“ oder „verwirklichen“ bedeuten. Bei „Pläne“ bezeichnet „verwirklichen“ idiomatisch deren wirksame Ausführung.
- source_word: מְזִמּוֹת לִבּוֹ
  choice: die Pläne seines Herzens
  rationale: מְזִמּוֹת bezeichnet hier überlegte Pläne oder Absichten. „Pläne seines Herzens“ bewahrt das hebräische Herzensbild und den Gedanken eines fest gefassten Vorhabens.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  rationale: Die formnahe prophetische Wendung bewahrt sowohl den möglichen eschatologischen Nachdruck als auch die zeitliche Offenheit des Ausdrucks.
- source_word: תִּתְבּוֹנְנוּ בָהּ
  choice: werdet ihr es verstehen
  rationale: Die Verbform bezeichnet aufmerksames Erfassen oder Einsicht. Das feminine Suffix verweist auf die zuvor angesprochene Sache; im Deutschen wird dies idiomatisch mit „es“ wiedergegeben.
theological_decisions:
- issue: Zeitlicher Horizont von בְּאַחֲרִית הַיָּמִים
  choice: Am Ende der Tage
  alternative: In kommenden Tagen / In späterer Zeit
  rationale: Die prophetische Formel kann auf die künftige Vollendung von Gottes Vorhaben weisen, legt aber nicht für sich allein einen exakt bestimmten endzeitlichen Zeitpunkt fest. Die Übersetzung wahrt diese Spannung; die Fußnote nennt die breiteren möglichen Wiedergaben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des hebräischen Zorn-Ausdrucks und die prophetische Zeitformel bleiben erhalten; zugleich werden unnatürliche formale Nachbildungen vermieden.
