source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִי שָׁב֙ שְׁבוּת֙ אָהֳלֵ֣י יַֽעֲק֔וֹב וּ/מִשְׁכְּנֹתָ֖י/ו אֲרַחֵ֑ם וְ/נִבְנְתָ֥ה עִיר֙ עַל תִּלָּ֔/הּ וְ/אַרְמ֖וֹן עַל מִשְׁפָּט֥/וֹ יֵשֵֽׁב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/018.yaml
  text: 'Thus says Yahweh: Behold[a], I am restoring the fortunes of the tents of Jacob, and I will have compassion on his dwellings. The city will be rebuilt on its mound, and the palace will stand in its proper place.'
translation:
  language: de
  text: 'So spricht der HERR: Siehe, ich wende das Geschick der Zelte Jakobs[a] und erbarme mich seiner Wohnstätten. Die Stadt wird wieder auf ihrem Trümmerhügel erbaut, und der Palast wird an seinem rechten Platz stehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich bringe die Gefangenen Jakobs zurück“; auch möglich: „Ich stelle Jakob aus der Gefangenschaft wieder her.“ Die hebräische Wendung kann sowohl die Rückkehr aus der Gefangenschaft als auch allgemeiner die Wiederherstellung des Geschicks bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im Deutschen etablierte Wiedergabe des Gottesnamens mit Kapitälchen bewahrt seinen besonderen Charakter und ist für ein breites modernes Publikum unmittelbar verständlich.
- source_word: הִנְנִי
  choice: Siehe, ich
  rationale: „Siehe“ erhält die hinweisende und nachdrücklich-ankündigende Kraft der hebräischen Form und passt zum würdevollen prophetischen Register.
- source_word: שָׁב שְׁבוּת
  choice: wende das Geschick
  rationale: Die geläufige deutsche biblische Wendung gibt den idiomatischen Sinn einer umfassenden Wiederherstellung wieder, ohne ihn ausschließlich auf die Rückführung von Gefangenen zu begrenzen.
- source_word: אָהֳלֵי יַעֲקֹב
  choice: die Zelte Jakobs
  rationale: Die konkrete und zugleich gemeinschaftsbezogene Bildsprache des Hebräischen bleibt erhalten.
- source_word: מִשְׁכְּנֹתָיו
  choice: seiner Wohnstätten
  rationale: „Wohnstätten“ ist verständlich, würdevoll und bewahrt den Bezug auf bewohnte Orte, ohne eine kultische Bedeutung einzutragen.
- source_word: אֲרַחֵם
  choice: erbarme mich
  rationale: Die Formulierung gibt das tätige göttliche Mitgefühl knapp und in natürlicher biblischer Standardsprache wieder.
- source_word: וְנִבְנְתָה עִיר
  choice: Die Stadt wird wieder ... erbaut
  rationale: Der Kontext legt die bekannte zerstörte Stadt nahe; „wieder erbaut“ bringt den Wiederherstellungszusammenhang natürlich zum Ausdruck.
- source_word: עַל תִּלָּהּ
  choice: auf ihrem Hügel
  rationale: תל bezeichnet hier den eigenen Stadthügel beziehungsweise die Ruinenstätte. „Hügel“ ist im Haupttext natürlich; die Ruinennuance ergibt sich aus dem Wiederaufbaukontext.
- source_word: אַרְמוֹן
  choice: der Palast
  rationale: „Palast“ ist für den repräsentativen herrschaftlichen Bau die naheliegende Wiedergabe, ohne die militärische Funktion einer Zitadelle vorauszusetzen.
- source_word: עַל מִשְׁפָּטוֹ יֵשֵׁב
  choice: wird an seinem angestammten Platz stehen
  rationale: Die idiomatische Aussage bezeichnet wahrscheinlich die Wiederherstellung am rechtmäßigen beziehungsweise herkömmlichen Ort. „Angestammter Platz“ vermittelt dies verständlich, ohne ein abstraktes „Recht“ oder eine konkrete Bauordnung einzutragen.
theological_decisions:
- issue: Reichweite der Wiederherstellung in שָׁב שְׁבוּת
  choice: Umfassende Wendung des Geschicks Jakobs
  alternative: Rückführung der Gefangenen beziehungsweise Wiederherstellung aus der Gefangenschaft
  rationale: Die Formel kann konkret die Heimkehr aus Gefangenschaft bezeichnen, umfasst im prophetischen Sprachgebrauch aber häufig eine breitere Umkehr des Elends. Zelte, Wohnstätten, Stadt und Palast weisen hier auf eine umfassende Wiederherstellung; die engere Möglichkeit bleibt in der Fußnote sichtbar.
- issue: Bedeutung von עַל מִשְׁפָּטוֹ
  choice: am angestammten Platz
  alternative: nach seiner Ordnung beziehungsweise nach seinem Recht
  rationale: Der Ausdruck lässt sowohl den rechtmäßigen Ort als auch die geordnete, herkömmliche Wiederherstellung anklingen. Die Übersetzung entscheidet sich für die im Baukontext natürliche Ortsbedeutung, ohne daraus eine besondere theologische Ordnungsvorstellung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Feierlichkeit. „Siehe“ und „Wohnstätten“ sind leicht gehoben, bleiben jedoch allgemein verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen hebräischen Wendung.
