base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/017.yaml
  text: 'For I will bring healing to you[a], and I will heal you from your wounds, declares Yahweh, because they have called you an outcast: ‘It is Zion[c][b]; no one cares for her.’'
translation:
  language: de
  text: 'Denn ich lasse dir Heilung zuteilwerden[a], und ich werde dich von deinen Wunden heilen – Ausspruch Jahwes. Denn man hat dich eine Verstoßene genannt[b]: »Das ist Zion; niemand fragt nach ihr.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich stelle deine Gesundheit wieder her.“ Wörtlicher lautet die hebräische Wendung etwa: „Ich lasse dir Heilung emporwachsen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eine Vertriebene“ beziehungsweise „eine Ausgestoßene“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Zion ist sie; niemand sucht nach ihr.“ Die Worte können auch appositionell verstanden werden: „Zion, nach der niemand fragt.“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: אַעֲלֶה אֲרֻכָה
  choice: ich lasse dir Heilung zuteilwerden
  rationale: Die Wendung bezeichnet das Herbeiführen von Heilung beziehungsweise Genesung. Die gewählte Formulierung bewahrt den kausativen Sinn des Hifil und klingt zugleich natürlich und würdig.
- source_word: וּמִמַּכּוֹתַיִךְ אֶרְפָּאֵךְ
  choice: und von deinen Wunden werde ich dich heilen
  rationale: מַכָּה kann einen Schlag, eine Verletzung oder eine Wunde bezeichnen. Im Heilungskontext passt „Wunden“ am besten; die Formulierung erhält sowohl das direkte Objekt „dich“ als auch die mit מִן ausgedrückte Herkunft beziehungsweise Befreiung.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: „Ausspruch“ gibt die gewichtige prophetische Formel נְאֻם knapp wieder. Der Gottesname wird in der im Deutschen geläufigen Form „Jahwe“ wiedergegeben.
- source_word: נִדָּחָה
  choice: eine Verstoßene
  rationale: Das feminine passive Partizip bezeichnet eine fortgetriebene, ausgestoßene oder verstoßene Person. „Verstoßene“ bewahrt sowohl das feminine Bild Zions als auch die soziale und heilsgeschichtliche Schande.
- source_word: קָרְאוּ לָךְ
  choice: man hat dich … genannt
  rationale: Das unbestimmte „man“ entspricht dem nicht näher bezeichneten pluralischen Subjekt. Das Perfekt beschreibt eine bereits etablierte, weiterhin nachwirkende Benennung.
- source_word: צִיּוֹן הִיא דֹּרֵשׁ אֵין לָהּ
  choice: Das ist Zion; niemand fragt nach ihr
  rationale: „Nach jemandem fragen“ hält die Grundvorstellung von דרש – suchen, sich erkundigen, sich kümmern – fest und ist im Deutschen idiomatisch. Der Semikolon wahrt die knappe, zugespitzte Struktur des Hebräischen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Yahweh; Jehova
  rationale: Der Eigenname wird als Eigenname wiedergegeben. „Jahwe“ ist die geläufige deutsche Transkription und vermeidet, den Namen durch einen Titel zu ersetzen.
- issue: Bezug und Funktion von צִיּוֹן הִיא
  choice: 'als zitierte Identifizierung: „Das ist Zion“'
  alternative: 'als direkte Anrede oder Apposition: „Zion, nach der niemand fragt“'
  rationale: Die hebräische Wortfolge lässt die genaue Einbindung der Worte offen. Die Übersetzung folgt der naheliegenden spöttischen Äußerung, ohne die alternative syntaktische Auffassung in der Fußnote zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feminine Redeweise („Verstoßene“) entspricht der Anrede Zions. „Zuteilwerden“ ist leicht gehoben, bleibt aber allgemein verständlich und bildet den kausativen Heilungsausdruck besser ab als eine rein statische Gesundheitsformel.
