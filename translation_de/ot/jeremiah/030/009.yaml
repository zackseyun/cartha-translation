  text: וְ/עָ֣בְד֔וּ אֵ֖ת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וְ/אֵת֙ דָּוִ֣ד מַלְכָּ֔/ם אֲשֶׁ֥ר אָקִ֖ים לָ/הֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/009.yaml
  text: They will serve Yahweh their God and David their king[a], whom I will raise up for them.
translation:
  language: de
  text: Sie werden Jahwe, ihrem Gott, dienen und David, ihrem König,[a] den ich für sie erwecken werde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder im Sinn von: „einen künftigen König aus Davids Linie“. Viele verstehen „David“ hier als prophetischen Hinweis auf den Messias und nicht auf David selbst.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבְדוּ
  choice: Sie werden dienen
  rationale: עבד bedeutet hier „dienen“ und kann im Bundeszusammenhang auch gottesdienstliche Verehrung einschließen. „Dienen“ bewahrt den weiteren Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵיהֶם
  choice: ihrem Gott
  rationale: Die deutsche Dativform ergibt sich aus dem Verb „dienen“ und gibt das possessive Verhältnis des Hebräischen natürlich wieder.
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: und David, ihrem König
  rationale: Das zweite direkte Objekt bleibt mit „und“ an dasselbe Verb gebunden. Die Apposition „ihrem König“ bewahrt die königliche und davidische Bestimmtheit.
- source_word: אֲשֶׁר אָקִים לָהֶם
  choice: den ich für sie erwecken werde
  rationale: Das Hifil von קום kann „erwecken“, „aufrichten“ oder „einsetzen“ bedeuten. „Erwecken“ erhält das prophetische Idiom, ohne die Art der Erfüllung näher festzulegen.
theological_decisions:
- issue: Identität von „David, ihrem König“
  choice: Der Name „David“ bleibt unverändert im Haupttext.
  alternative: ein künftiger davidischer König; der Messias
  rationale: Der hebräische Text nennt ausdrücklich David. Ob damit David persönlich oder prophetisch ein künftiger davidischer Herrscher gemeint ist, wird nicht im Haupttext entschieden, sondern in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung „Jahwe, ihrem Gott“ und „David, ihrem König“ ist idiomatisch und erhält die Parallelität der beiden Objekte. Der Versanfang nimmt das hebräische ו nicht eigens mit „Und“ auf, da der Satz als Einzelvers auch ohne Konjunktion natürlich anschließt.
