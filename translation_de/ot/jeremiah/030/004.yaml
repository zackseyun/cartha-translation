source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל יִשְׂרָאֵ֖ל וְ/אֶל יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/004.yaml
  text: And these are the words that Yahweh spoke concerning Israel and Judah:[a]
translation:
  language: de
  text: Und dies sind die Worte, die Jahwe über Israel und Juda sprach:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu Israel und zu Juda“. So lässt sich die hebräische Präposition wörtlicher wiedergeben; hier leitet sie wahrscheinlich Worte ein, die beide Völker betreffen.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Und dies sind
  rationale: Das einleitende וְ bleibt als „Und“ erhalten und verknüpft den Satz mit dem vorherigen Zusammenhang; אֵלֶּה wird demonstrativ mit „dies“ wiedergegeben.
- source_word: הַ/דְּבָרִים
  choice: die Worte
  rationale: דְּבָרִים bezeichnet hier im Rahmen der prophetischen Einleitungsformel die von Gott gesprochenen Worte, nicht allgemein Dinge oder Angelegenheiten.
- source_word: אֲשֶׁר דִּבֶּר
  choice: die … sprach
  rationale: Die Relativkonstruktion wird in natürlichem Deutsch als „die … sprach“ wiedergegeben und wahrt den Bezug auf „die Worte“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen geläufigen Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel wie „der HERR“ zu ersetzen.
- source_word: אֶל יִשְׂרָאֵל וְ/אֶל יְהוּדָה
  choice: über Israel und Juda
  rationale: In dieser überschriftartigen Einleitung bezeichnet die Wendung am ehesten die Völker, auf die sich die folgende Botschaft bezieht. Die wörtlichere Richtungsangabe „zu Israel und zu Juda“ bleibt als mögliche Lesart in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutung von אֶל bei Israel und Juda in der prophetischen Überschrift
  choice: über Israel und Juda
  alternative: zu Israel und zu Juda
  rationale: Der Kontext legt eine Überschrift über eine Botschaft nahe, die beide Völker betrifft. Da אֶל jedoch gewöhnlich eine Richtung oder einen Adressaten bezeichnet, wird die echte Mehrdeutigkeit durch die alternative Wiedergabe in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Einleitungsformel und ihre Verbindung zum vorherigen Zusammenhang bleiben erhalten; der Doppelpunkt weist auf die folgenden Worte voraus.
