id: JER.30.3
reference: Jeremiah 30:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּ֠י הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ֠/שַׁבְתִּי אֶת שְׁב֨וּת עַמִּ֧/י יִשְׂרָאֵ֛ל וִֽ/יהוּדָ֖ה אָמַ֣ר יְהוָ֑ה וַ/הֲשִׁבֹתִ֗י/ם אֶל הָ/אָ֛רֶץ אֲשֶׁר נָתַ֥תִּי לַ/אֲבוֹתָ֖/ם וִֽ/ירֵשֽׁוּ/הָ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/003.yaml
  text: For look, days are coming, declares the LORD, when I will restore the fortunes of my people Israel and Judah, says the LORD, and I will bring them back to the land that I gave to their fathers, and they will possess it.
translation:
  language: de
  text: Denn seht, es kommen Tage, spricht der HERR, da werde ich das Geschick meines Volkes Israel und Juda wenden[a], spricht der HERR. Ich werde sie in das Land zurückbringen, das ich ihren Vorfahren gegeben habe, und sie werden es in Besitz nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Gefangenschaft meines Volkes Israel und Juda beenden und sie zurückführen.'
    reason: Die Wendung שׁוב שׁבות ist idiomatisch und lässt sowohl eine umfassende Wendung des Geschicks als auch die konkrete Rückführung aus Gefangenschaft anklingen.
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Denn seht
  rationale: כִּי knüpft begründend an den Kontext an; הִנֵּה lenkt nachdrücklich die Aufmerksamkeit auf die folgende Verheißung.
- source_word: נְאֻם יְהוָה / אָמַר יְהוָה
  choice: spricht der HERR
  rationale: Die beiden unterschiedlichen hebräischen Redeformeln werden im natürlichen deutschen prophetischen Register einheitlich wiedergegeben; der Gottesname wird gemäß verbreiteter deutscher Bibeltradition als HERR gesetzt.
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: da werde ich das Geschick … wenden
  rationale: Die feste Wendung bezeichnet eine grundlegende Wiederherstellung; die gewählte Formulierung bewahrt das hebräische Wortspiel zwischen שׁוב und שׁבות besser als eine rein erklärende Übersetzung.
- source_word: אֲבוֹתָם
  choice: ihren Vorfahren
  rationale: Im heutigen Deutsch ist „Vorfahren“ inklusiv und natürlich und bezeichnet hier die früheren Generationen, denen das Land gegeben wurde.
- source_word: וִירֵשׁוּהָ
  choice: und sie werden es in Besitz nehmen
  rationale: ירשׁ bezeichnet hier das Erlangen beziehungsweise Besitzen des Landes, nicht bloß das Wohnen darin.
theological_decisions:
- issue: Umfang der Wiederherstellungsverheißung
  choice: Die kollektive Nennung „Israel und Juda“ und die Rückkehr in das gegebene Land bleiben ohne zusätzliche Auslegung stehen.
  alternative: Die Aussage ausdrücklich auf eine bestimmte historische Rückkehr oder eine endzeitliche Erfüllung festlegen.
  rationale: Der Vers selbst nennt weder den alleinigen historischen Zeitpunkt noch eine erschöpfende theologische Deutung; diese Spannung soll nicht vorentschieden werden.
- issue: Bedeutung von שׁוב שׁבות
  choice: „das Geschick … wenden“ mit Fußnote zur möglichen Nuance „Gefangenschaft zurückführen“
  alternative: Nur „die Gefangenen zurückbringen“ oder nur „das Wohlergehen wiederherstellen“
  rationale: Die hebräische Wendung kann umfassende Wiederherstellung ausdrücken und zugleich im Exilskontext an die Rückführung von Gefangenen denken lassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seht“ bewahrt den auffordernden Aufmerksamkeitsruf; „das Geschick wenden“ erhält den prophetischen Klang, während die Fußnote die konkrete Exilsnuance sichtbar macht.
