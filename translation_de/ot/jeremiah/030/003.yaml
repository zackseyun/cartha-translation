  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des Hebräischen zuverlässig wieder: die Ankündigung kommender Tage, die Wiederherstellung von Israel und Juda, die Rückführung in das den Vorfahren gegebene Land und dessen Besitznahme. „Das Geschick ... wenden“ ist eine etablierte, angemessen offene Wiedergabe von וְשַׁבְתִּי אֶת־שְׁבוּת und wird durch die Fußnote sinnvoll erläutert.'
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. „Denn seht“ bewahrt den aufmerksamkeitslenkenden Charakter von כִּי הִנֵּה im prophetischen Register; die Satzteilung nach der zweiten Gottesredeformel ist im Deutschen natürlich und verändert die Aussage nicht.
  terminology: „HERR“ ist innerhalb der gewählten deutschen Bibelkonvention konsistent. „Vorfahren“ und „in Besitz nehmen“ treffen אֲבוֹתָם beziehungsweise וִירֵשׁוּהָ präzise. Die Fußnote wahrt die im Idiom enthaltene Exil- und Wiederherstellungsnuance, ohne sie zur alleinigen Bedeutung zu verengen.
