base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/016.yaml
  text: Therefore all who devour you will be devoured[a], and all your adversaries, every one of them, will go into captivity; those who plunder you will become plunder, and all who prey on you I will give up to prey.
translation:
  language: de
  text: Darum werden alle, die dich verschlingen, selbst verschlungen werden. Alle deine Bedränger, sie alle, werden in Gefangenschaft gehen. Die dich plündern, werden selbst zur Beute, und alle, die dich ausrauben, werde ich als Beute preisgeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Alle, die dich berauben, werde ich dem Raub preisgeben.« Im Hebräischen stehen hier eng verwandte Wörter für das Rauben und die Beute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus dem vorausgehenden Zusammenhang und klingt im modernen Deutschen natürlich und würdig.
- source_word: אֹכְלַיִךְ / יֵאָכֵלוּ
  choice: die dich verschlingen, werden selbst verschlungen werden
  rationale: Bewahrt das anschauliche Bild des Essens beziehungsweise Verschlingens und zugleich die genaue Umkehrung der hebräischen Wortfolge.
- source_word: צָרַיִךְ
  choice: deine Bedränger
  rationale: Gibt die feindselige und bedrückende Rolle der Gegner wieder, ohne den Ausdruck unnötig auf militärische Feinde zu verengen.
- source_word: כֻּלָּם
  choice: sie alle
  rationale: Erhält die nachdrückliche Wiederaufnahme von »alle deine Bedränger«.
- source_word: בַּשְּׁבִי יֵלֵכוּ
  choice: werden in Gefangenschaft gehen
  rationale: Gibt den konkreten Gedanken des Gefangenwerdens beziehungsweise der Gefangenschaft wieder und bewahrt das Motiv der Umkehrung.
- source_word: שֹׁאסַיִךְ / לִמְשִׁסָּה
  choice: Die dich plündern, werden selbst zur Beute
  rationale: Natürliches Deutsch, das die Vergeltungsstruktur und das Wortfeld von Plünderung und Beute erhält.
- source_word: בֹּזְזַיִךְ / אֶתֵּן לָבַז
  choice: alle, die dich ausrauben, werde ich als Beute preisgeben
  rationale: Der Wechsel zwischen »ausrauben« und »Beute« vermeidet schwerfällige Wiederholung und gibt die idiomatische Wendung נתן ל als Auslieferung beziehungsweise Preisgabe wieder.
theological_decisions:
- issue: Gericht als vergeltende Umkehrung
  choice: Die Bilder des Verschlingens, der Gefangenschaft und der Plünderung bleiben erhalten.
  alternative: Die Aussage allgemein als Bestrafung der Feinde wiederzugeben.
  rationale: 'Der hebräische Text formuliert das Gericht gerade durch die pointierte Umkehrung: Was die Gegner anderen antaten, trifft nun sie selbst. Eine Verallgemeinerung würde diese theologische und rhetorische Spannung abschwächen.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wiederholungen und Umkehrungen des Hebräischen werden bewusst sichtbar gehalten; die letzten beiden Aussagen werden zugleich idiomatisch voneinander unterschieden.
