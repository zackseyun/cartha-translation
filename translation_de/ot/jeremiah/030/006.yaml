base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/030/006.yaml
  text: 'Ask now[a], and see: does a male give birth? Why then do I see every man with his hands on his loins like a woman in labor, and every face turned pale?'
translation:
  language: de
  text: 'Fragt doch und seht: Bringt etwa ein Mann ein Kind zur Welt? Warum sehe ich dann jeden Mann mit den Händen an den Lenden wie eine Frau in den Wehen, und alle Gesichter sind fahl geworden[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „grünlich bleich“. Das hebräische Wort bezeichnet eine krankhafte Blässe mit grünlichem oder gelblichem Farbton.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲלוּ נָא וּרְאוּ
  choice: Fragt doch und seht
  rationale: Der pluralische Imperativ und die mahnend-auffordernde Partikel נָא werden mit dem natürlichen deutschen „doch“ wiedergegeben; „seht“ bewahrt die rhetorische Aufforderung zur Prüfung.
- source_word: אִם יֹלֵד זָכָר
  choice: Bringt etwa ein Mann ein Kind zur Welt?
  rationale: Die Frage ist rhetorisch und erwartet ein Nein. „Etwa“ markiert diese Fragerichtung; „ein Kind zur Welt bringen“ gibt יֹלֵד in heutigem Deutsch natürlich wieder, während „Mann“ den ausdrücklich männlichen Bezug von זָכָר erhält.
- source_word: מַדּוּעַ רָאִיתִי
  choice: Warum sehe ich dann
  rationale: Das Perfekt רָאִיתִי beschreibt hier anschaulich eine gegenwärtig vor Augen stehende Szene. „Dann“ verdeutlicht den folgernden Zusammenhang mit der vorausgehenden rhetorischen Frage.
- source_word: כָל גֶּבֶר
  choice: jeden Mann
  rationale: גֶּבֶר bezeichnet den Mann, häufig mit dem Beiklang männlicher Kraft. „Jeden Mann“ ist natürlich und bewahrt den Kontrast zur Haltung einer Gebärenden.
- source_word: יָדָיו עַל חֲלָצָיו
  choice: mit den Händen an den Hüften
  rationale: חֲלָצַיִם bezeichnet den Bereich von Lenden, Taille oder Hüften. „An den Hüften“ ist im modernen Deutsch körperlich anschaulich und weniger altertümlich als „an den Lenden“.
- source_word: כַּיּוֹלֵדָה
  choice: wie eine Frau in den Wehen
  rationale: Das feminine Partizip bezeichnet eine Gebärende. Die Formulierung macht das im Hebräischen vorausgesetzte weibliche Gegenbild ausdrücklich und idiomatisch verständlich.
- source_word: וְנֶהֶפְכוּ כָל פָּנִים לְיֵרָקוֹן
  choice: und jedes Gesicht fahl
  rationale: „Fahl“ gibt die krankhafte, erschreckte Blässe knapp und idiomatisch wieder. Die distributive Form „jedes Gesicht“ entspricht כָל פָּנִים; die Ellipse nach „sehe ich“ hält beide Wahrnehmungen unter derselben Warum-Frage zusammen.
