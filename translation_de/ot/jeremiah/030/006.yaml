translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen und das verstörende Bild bleiben knapp und unmittelbar; altertümliche Wendungen wie „an den Lenden“ werden vermieden. Der Fußnotenmarker steht bei „fahl“, auf das sich die lexikalische Alternative tatsächlich bezieht.
