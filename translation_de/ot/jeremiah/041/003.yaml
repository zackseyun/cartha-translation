id: JER.41.3
reference: Jeremiah 41:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/יְּהוּדִ֗ים אֲשֶׁר הָי֨וּ אִתּ֤/וֹ אֶת גְּדַלְיָ֨הוּ֙ בַּ/מִּצְפָּ֔ה וְ/אֶת הַ/כַּשְׂדִּ֖ים אֲשֶׁ֣ר נִמְצְאוּ שָׁ֑ם אֵ֚ת אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הִכָּ֖ה יִשְׁמָעֵֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
translation:
  language: de
  text: Auch alle Judäer[a], die bei Gedalja in Mizpa waren, und die Chaldäer[b], die dort angetroffen wurden – die Soldaten[c] –, erschlug Ismael.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Juden“. Der hebräische Ausdruck kann die Menschen aus Juda beziehungsweise Judäa bezeichnen; hier hebt „Judäer“ den historischen und geografischen Bezug hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Babylonier“. Im Hebräischen steht „Chaldäer“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Männer des Krieges“, das heißt kriegführende Männer oder Soldaten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  choice: Judäer
  rationale: Im historischen Zusammenhang bezeichnet der Ausdruck Menschen aus Juda beziehungsweise Judäa. „Judäer“ bewahrt diesen geografisch-politischen Bezug deutlicher als das ebenfalls mögliche „Juden“.
- source_word: אִתּוֹ אֶת גְּדַלְיָהוּ
  choice: die bei Gedalja waren
  rationale: Das Pronomen wird durch den folgenden Namen Gedalja näher bestimmt. Im Deutschen gibt „bei Gedalja“ den Sinn natürlich wieder, ohne Pronomen und Namen schwerfällig zu verdoppeln.
- source_word: בַּמִּצְפָּה
  choice: in Mizpa
  rationale: Bei einer Stadtbezeichnung ist „in Mizpa“ im Deutschen die übliche Ortsangabe.
- source_word: הַכַּשְׂדִּים
  choice: die Chaldäer
  rationale: Die Wiedergabe behält die konkrete historische Bezeichnung des Hebräischen bei; „Babylonier“ wäre eine erklärende Verallgemeinerung.
- source_word: נִמְצְאוּ שָׁם
  choice: die dort angetroffen wurden
  rationale: Die passive Form von מצא wird erkennbar wiedergegeben und nicht zur bloßen Ortsangabe „die dort waren“ abgeschwächt.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: die Soldaten
  rationale: Das wörtliche „Männer des Krieges“ bezeichnet hier kriegführende beziehungsweise bewaffnete Männer. „Soldaten“ ist in modernem Deutsch klar und natürlich; die hebräische Ausdrucksweise wird in der Fußnote genannt.
- source_word: הִכָּה
  choice: erschlug
  rationale: נכה bezeichnet hier im Erzählzusammenhang ein tödliches Niederschlagen. „Erschlug“ bewahrt sowohl die Gewalthandlung als auch ihren tödlichen Ausgang.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Voranstellung der beiden Objektgruppen folgt dem Nachdruck der hebräischen Wortfolge, bleibt im Deutschen aber lesbar. Gedankenstriche kennzeichnen „die Soldaten“ als erläuternde Apposition zu den dort angetroffenen Chaldäern.
