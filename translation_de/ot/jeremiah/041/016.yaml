source:
  edition: WLC
  text: וַ/יִּקַּח֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֣ים אֲשֶׁר אִתּ֗/וֹ אֵ֣ת כָּל שְׁאֵרִ֤ית הָ/עָם֙ אֲשֶׁ֣ר הֵ֠שִׁיב מֵ/אֵ֨ת יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ מִן הַ/מִּצְפָּ֔ה אַחַ֣ר הִכָּ֔ה אֶת גְּדַלְיָ֖ה בֶּן אֲחִיקָ֑ם גְּבָרִ֞ים אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/נָשִׁ֤ים וְ/טַף֙ וְ/סָ֣רִסִ֔ים אֲשֶׁ֥ר הֵשִׁ֖יב מִ/גִּבְעֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
translation:
  language: de
  text: 'Dann nahmen Jochanan, der Sohn Kareachs, und alle Heerführer, die bei ihm waren, den ganzen Rest des Volkes mit sich, den Jochanan von Ismael, dem Sohn Netanjas, aus Mizpa zurückgebracht hatte, nachdem Ismael Gedalja, den Sohn Ahikams, erschlagen hatte: Männer, Kriegsleute, Frauen, kleine Kinder und Hofbeamte[a]. Jochanan hatte sie aus Gibeon zurückgebracht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eunuchen“. Das hebräische Wort kann sowohl körperlich kastrierte Männer als auch Hofbeamte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Dann nahm ... mit sich
  rationale: Das Narrativ-Waw führt die Handlung weiter. »Nahm ... mit sich« macht im Deutschen deutlich, dass Jochanan die gerettete Gruppe anschließend weiterführte.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Heerführer
  rationale: Die Verbindung bezeichnet die militärischen Befehlshaber; »Heerführer« ist knapp, verständlich und dem erzählerischen Register angemessen.
- source_word: שְׁאֵרִית הָעָם
  choice: den ganzen Rest des Volkes
  rationale: »Rest« bewahrt den Gedanken der nach den vorangegangenen Ereignissen verbliebenen Volksgruppe, ohne im Deutschen unnötig fachsprachlich zu wirken.
- source_word: הֵשִׁיב מֵאֵת
  choice: aus der Gewalt ... zurückgeholt
  rationale: Der Hifil von שוב bedeutet zurückbringen oder zurückholen. »Aus der Gewalt« verdeutlicht den im Kontext gegebenen Entzug aus Ismaels Kontrolle, ohne eine wörtlich nicht vorhandene Hand-Formel nachzubilden.
- source_word: מִן הַמִּצְפָּה
  choice: die Menschen aus Mizpa
  rationale: Die Präpositionalgruppe bezeichnet am natürlichsten Herkunft beziehungsweise Ausgangsort der von Ismael verschleppten und zurückgeholten Gruppe. Die explizite Wiederaufnahme mit »die Menschen« verhindert eine missverständliche Zuordnung zu Ismael.
- source_word: אַחַר הִכָּה
  choice: nachdem Ismael ... erschlagen hatte
  rationale: נכה bezeichnet hier angesichts des Kontextes ein tödliches Niederschlagen. Das ausdrückliche Subjekt »Ismael« löst die im Deutschen sonst mögliche falsche Rückbeziehung auf Jochanan.
- source_word: גְּבָרִים אַנְשֵׁי הַמִּלְחָמָה
  choice: die Männer, die Kriegsleute
  rationale: Die beiden hebräischen Ausdrücke werden nicht zu nur einem Begriff zusammengezogen. »Kriegsleute« gibt אנשי המלחמה in würdigem, noch verständlichem Deutsch wieder.
- source_word: טַף
  choice: die kleinen Kinder
  rationale: טף bezeichnet besonders die kleinen, abhängigen Kinder und hebt ihre Schutzbedürftigkeit hervor.
- source_word: סָרִסִים
  choice: die Hofbeamten
  rationale: סָרִיסִים kann sowohl Eunuchen als auch Amtsträger am Hof bezeichnen. Im Haupttext steht die funktionale Bezeichnung; die körperliche Bedeutung bleibt in der Fußnote ausdrücklich offen.
- source_word: מִגִּבְעוֹן
  choice: aus Gibeon zurückgebracht
  rationale: מִן markiert den Ausgangsort; die Formulierung gibt die Rückführung aus Gibeon wieder.
- source_word: יוֹחָנָן; קָרֵחַ; יִשְׁמָעֵאל; נְתַנְיָה; גְּדַלְיָה; אֲחִיקָם
  choice: Jochanan; Kareach; Ismael; Netanja; Gedalja; Ahikam
  rationale: Die Namen folgen geläufigen deutschen Bibeltransliterationen und bleiben zugleich nahe an den hebräischen Formen.
