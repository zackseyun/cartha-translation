  to: 'Dann nahmen Jochanan, der Sohn Kareachs, und alle Heerführer, die bei ihm waren, den ganzen Rest des Volkes mit sich, den Jochanan von Ismael, dem Sohn Netanjas, aus Mizpa zurückgebracht hatte, nachdem Ismael Gedalja, den Sohn Ahikams, erschlagen hatte: Männer, Kriegsleute, Frauen, kleine Kinder und Hofbeamte[a]. Jochanan hatte sie aus Gibeon zurückgebracht.'
