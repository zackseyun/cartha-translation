source:
  edition: WLC
  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: The cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
translation:
  language: de
  text: Die Zisterne, in die Ismael alle Leichen der Männer geworfen hatte, die er im Zusammenhang mit Gedalja erschlagen hatte[a], war jene, die König Asa wegen Bascha, des Königs von Israel, hatte anlegen lassen[b]. Ismael, der Sohn Netanjas, füllte sie mit Erschlagenen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht etwa: „bei/an der Hand Gedaljas“. Der schwierige hebräische Ausdruck kann auch bedeuten: „die er wegen Gedalja erschlagen hatte“ oder „die er zusammen mit Gedalja erschlagen hatte“.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „aus Furcht vor Bascha, dem König von Israel“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  choice: die Zisterne
  rationale: בּוֹר kann eine Grube oder Zisterne bezeichnen. Da sie von König Asa angelegt wurde, passt hier eine künstlich geschaffene Zisterne am besten.
- source_word: הִשְׁלִיךְ שָׁם
  choice: in die … geworfen hatte
  rationale: Die Zielangabe שָׁם wird im Deutschen idiomatisch durch die Konstruktion „in die“ wiedergegeben; das Verb bewahrt die gewaltsame Bedeutung von „werfen“.
- source_word: פִּגְרֵי
  choice: Leichen
  rationale: פֶּגֶר bezeichnet tote Körper und hat hier eine betont drastische Bedeutung, die „Leichen“ angemessen wiedergibt.
- source_word: הָאֲנָשִׁים
  choice: der Männer
  rationale: Das hebräische Substantiv steht ausdrücklich im maskulinen Plural.
- source_word: הִכָּה
  choice: erschlagen hatte
  rationale: נכה bedeutet „schlagen“ und bezeichnet in diesem tödlichen Zusammenhang das Erschlagen oder Töten.
- source_word: בְּיַד גְּדַלְיָהוּ
  choice: im Zusammenhang mit Gedalja
  rationale: Die wörtliche Wendung „durch/an der Hand Gedaljas“ ist in diesem Zusammenhang schwierig. Die offene Formulierung bezeichnet eine Verbindung mit Gedalja, ohne eindeutig zwischen Ursache und gemeinsamem Erleiden zu entscheiden.
- source_word: הוּא אֲשֶׁר עָשָׂה
  choice: war jene, die … hatte anlegen lassen
  rationale: Die wiederaufnehmende Konstruktion identifiziert die genannte Zisterne mit der von Asa geschaffenen. Bei einem König ist „anlegen lassen“ natürlich und impliziert nicht, dass er sie eigenhändig baute.
- source_word: מִפְּנֵי בַּעְשָׁא
  choice: wegen Bascha
  rationale: מִפְּנֵי kann „wegen“, „vor“ oder „aus Furcht vor“ bedeuten. „Wegen“ wahrt die kausale Aussage, ohne das Motiv enger festzulegen.
- source_word: מִלֵּא
  choice: füllte
  rationale: Direkte Wiedergabe des Piel von מלא.
- source_word: חֲלָלִים
  choice: mit Erschlagenen
  rationale: חֲלָלִים bezeichnet gewaltsam Getötete; „Erschlagene“ bewahrt diesen Sinn und die düstere Wirkung.
theological_decisions:
- issue: Bezug der Wendung בְּיַד גְּדַלְיָהוּ
  choice: im Zusammenhang mit Gedalja
  alternative: wegen Gedalja; zusammen mit Gedalja; an der Seite Gedaljas
  rationale: Der hebräische Ausdruck ist syntaktisch und kontextuell ungewöhnlich. Die Übersetzung soll weder Gedalja irrtümlich zum Täter machen noch eindeutig festlegen, ob die Männer wegen Gedalja oder zusammen mit ihm getötet wurden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zisterne“, „Leichen“ und „Erschlagene“ erhalten die konkrete und düstere Sprache des Verses. Die schwierige Verbindung mit Gedalja wird im Haupttext bewusst offen gehalten und in der Fußnote erläutert.
