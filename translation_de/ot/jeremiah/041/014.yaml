  variant: modern standard German
source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ כָּל הָ/עָ֔ם אֲשֶׁר שָׁבָ֥ה יִשְׁמָעֵ֖אל מִן הַ/מִּצְפָּ֑ה וַ/יָּשֻׁ֨בוּ֙ וַ/יֵּ֣לְכ֔וּ אֶל יֽוֹחָנָ֖ן בֶּן קָרֵֽחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/014.yaml
  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
translation:
  language: de
  text: Da kehrten alle Leute um, die Ismael aus Mizpa gefangen weggeführt hatte[a], und gingen zurück zu Johanan, dem Sohn Kareachs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Ismael aus Mizpa gefangen genommen hatte“.'
    reason: Lexikalische Alternative für שָׁבָה; die Hauptfassung betont neben der Gefangennahme auch das Wegführen aus Mizpa.
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: kehrten … um
  rationale: Die Form von סבב bezeichnet hier die Umkehr der Bewegungsrichtung. „Umkehren“ ist im Deutschen natürlich und gibt die konkrete Richtungsänderung wieder.
- source_word: כָּל הָעָם
  choice: alle Leute
  rationale: הָעָם bezeichnet hier kollektiv die von Ismael fortgeführte Menschengruppe. „Alle Leute“ ist in diesem konkreten Erzählzusammenhang natürlicher als das stärker politische „das ganze Volk“.
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל מִן הַמִּצְפָּה
  choice: die Ismael aus Mizpa gefangen weggeführt hatte
  rationale: שבה bedeutet, Gefangene zu machen beziehungsweise gefangen wegzuführen; מן הַמִּצְפָּה nennt den Ausgangsort. Das Plusquamperfekt kennzeichnet die Gefangennahme als der Haupthandlung vorausgehend.
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ אֶל
  choice: und gingen zurück zu
  rationale: „Gingen zurück zu“ verbindet im natürlichen Deutschen die Rückkehr (שוב) mit der gerichteten Bewegung zu Johanan (הלך אל), ohne die hebräische Abfolge in eine schwerfällige Doppelung zu verwandeln.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Johanan, dem Sohn Kareachs
  rationale: Die Namen werden entsprechend der deutschen biblischen Form wiedergegeben; die Abstammungsangabe בן bleibt ausdrücklich erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzählungsdeutsch. Die eng zusammengehörigen Verben וַיָּשֻׁבוּ וַיֵּלְכוּ werden idiomatisch als „gingen zurück zu“ gebündelt, während die vorausgehende Richtungsumkehr eigenständig erhalten bleibt.
