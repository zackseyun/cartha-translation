  text: וַ/עֲשָׂרָ֨ה אֲנָשִׁ֜ים נִמְצְאוּ בָ֗/ם וַ/יֹּאמְר֤וּ אֶל יִשְׁמָעֵאל֙ אַל תְּמִתֵ֔/נוּ כִּֽי יֶשׁ לָ֤/נוּ מַטְמֹנִים֙ בַּ/שָּׂדֶ֔ה חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/שֶׁ֣מֶן וּ/דְבָ֑שׁ וַ/יֶּחְדַּ֕ל וְ/לֹ֥א הֱמִיתָ֖/ם בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
translation:
  language: de
  text: 'Doch unter ihnen fanden sich zehn Männer. Sie sagten zu Ismael: »Töte uns nicht! Wir haben auf dem Feld versteckte Vorräte[a]: Weizen und Gerste, Öl und Honig.« Da ließ er davon ab und tötete sie nicht unter ihren Brüdern[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »versteckte Schätze«. Wegen der anschließend genannten Lebensmittel sind hier wahrscheinlich verborgene Vorräte gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Mit »ihren Brüdern« sind hier wahrscheinlich die anderen Männer ihrer Gruppe gemeint, die getötet wurden.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  choice: Doch unter ihnen fanden sich zehn Männer
  rationale: Das einleitende וַ erhält im Zusammenhang mit dem vorausgehenden Töten eine adversative Nuance. Das deutsche »fanden sich« gibt das Niphal von מצא natürlich wieder, ohne den Sinn zu verändern, dass diese Männer innerhalb der größeren Gruppe angetroffen wurden.
- source_word: אַל תְּמִתֵנוּ
  choice: Töte uns nicht
  rationale: Der Hiphil von מות bezeichnet hier eindeutig das Töten. Die kurze, unmittelbare Bitte klingt im modernen Deutschen natürlicher als »Bring uns nicht zu Tode« und bewahrt den Ernst der Situation.
- source_word: כִּי יֵשׁ לָנוּ מַטְמֹנִים בַּשָּׂדֶה
  choice: Wir haben auf dem Feld versteckte Vorräte
  rationale: מַטְמֹנִים kann allgemein verborgene Dinge oder Schätze bezeichnen; die anschließende Aufzählung von Lebensmitteln legt hier versteckte Vorräte nahe. בַּשָּׂדֶה wird konkret mit »auf dem Feld« wiedergegeben.
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  choice: Weizen und Gerste, Öl und Honig
  rationale: Die vier genannten Vorräte werden direkt wiedergegeben. »Öl« meint im historischen Umfeld wahrscheinlich Olivenöl, doch der Ausgangstext spezifiziert dies nicht.
- source_word: וַיֶּחְדַּל
  choice: Da ließ er davon ab
  rationale: חדל bedeutet aufhören oder von etwas ablassen. Der Bezug auf das beabsichtigte Töten ist aus dem unmittelbaren Zusammenhang klar.
- source_word: וְלֹא הֱמִיתָם בְּתוֹךְ אֲחֵיהֶם
  choice: und tötete sie nicht zusammen mit ihren Brüdern
  rationale: Die Formulierung bewahrt sowohl die causative Tötungsaussage als auch das hebräische Verwandtschaftswort אֲחֵיהֶם. »Zusammen mit« vermittelt idiomatisch, dass die übrigen Männer derselben Gruppe getötet wurden.
theological_decisions:
- issue: Bedeutung von אֲחֵיהֶם
  choice: ihren Brüdern
  alternative: ihren Gefährten / ihren Landsleuten
  rationale: Der hebräische Text verwendet wörtlich »ihre Brüder«, kann damit aber Verwandte, Volksgenossen oder die Männer ihrer Gruppe meinen. Die Hauptübersetzung bewahrt die Verwandtschaftsbezeichnung; eine Fußnote macht die kontextuelle Weite sichtbar, ohne sie dogmatisch einzuengen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit direkter und knapper Rede. Die Übersetzung folgt dem hebräischen Satzgang, glättet ihn jedoch dort, wo eine wörtliche Wiedergabe im Deutschen schwerfällig wäre. Die beiden echten Bedeutungsweiten von מַטְמֹנִים und אֲחֵיהֶם werden in Fußnoten offengehalten.
