  text: וַ/יְהִ֛י בַּ/יּ֥וֹם הַ/שֵּׁנִ֖י לְ/הָמִ֣ית אֶת גְּדַלְיָ֑הוּ וְ/אִ֖ישׁ לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/004.yaml
  text: And it happened on the second day after he had killed Gedaliah[a], when no man yet knew it,
translation:
  language: de
  text: Und es geschah am zweiten Tag, nachdem er Gedalja getötet hatte, als noch niemand davon[a] wusste,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und niemand wusste“; worauf sich das Wissen bezieht, ist im Hebräischen nicht ausdrücklich gesagt.'
    reason: Das Deutsche ergänzt „davon“ zur Verdeutlichung des im Hebräischen vorausgesetzten Bezugs auf die Tötung Gedaljas.
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die übliche hebräische Erzählform führt das nächste Geschehen ein. Die Wendung wahrt den Erzählfluss und bleibt in modernem, würdigem Deutsch verständlich.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: am zweiten Tag
  rationale: Die ausdrücklich gezählte Tagesangabe wird beibehalten und nicht zu „am nächsten Tag“ geglättet.
- source_word: לְהָמִית אֶת גְּדַלְיָהוּ
  choice: nachdem er Gedalja getötet hatte
  rationale: Der Infinitiv mit לְ bezeichnet hier den zeitlichen Bezugspunkt. Die aktive Wiedergabe entspricht dem unmittelbaren Erzählzusammenhang, in dem Ismael Gedalja getötet hat; das im Hebräischen nicht eigens genannte Subjekt bleibt im Deutschen lediglich pronominal.
- source_word: גְּדַלְיָהוּ
  choice: Gedalja
  rationale: Der Personenname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: וְאִישׁ לֹא יָדָע
  choice: als noch niemand davon wusste
  rationale: „Niemand“ gibt das indefinite אִישׁ mit Verneinung natürlich und inklusiv wieder. „Noch“ verdeutlicht den zu diesem Zeitpunkt fortbestehenden Zustand; „davon“ macht den im Hebräischen nur aus dem Zusammenhang erschlossenen Gegenstand des Wissens deutlich.
