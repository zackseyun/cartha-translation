base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
translation:
  language: de
  text: Da zogen sie weiter und hielten sich in Gerut Kimham[a][b] auf, das bei Bethlehem liegt, um nach Ägypten weiterzuziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Herberge Kimhams“ beziehungsweise „am Aufenthaltsort Kimhams“. Das hebräische Wort גֵּרוּת wird hier wahrscheinlich als Ortsname gebraucht, kann aber auch einen Ort des Aufenthalts oder der Beherbergung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Schreibweise des Namens im vorgelegten hebräischen Text ist ungewöhnlich und könnte für sich genommen „wie sie“ gelesen werden. Der Zusammenhang spricht jedoch für den Eigennamen „Kimham“, der aus 2. Samuel 19,38–41 bekannt ist und mit einem Ort bei Bethlehem verbunden wurde.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Da zogen sie weiter
  rationale: Das Wayyiqtol führt die Erzählung fort. „Da“ gibt die Ereignisfolge natürlich wieder; „weiterziehen“ passt zum Reise- und Fluchtkontext.
- source_word: וַיֵּשְׁבוּ
  choice: und hielten sich ... auf
  rationale: ישׁב kann sitzen, wohnen oder bleiben bedeuten. Hier bezeichnet es einen vorübergehenden Aufenthalt auf dem Weg nach Ägypten.
- source_word: בְּגֵרוּת
  choice: in Gerut
  rationale: Das Wort kann eine Herberge oder einen Aufenthaltsort bezeichnen, wird hier aber wahrscheinlich als Bestandteil eines Ortsnamens gebraucht. Die Transliteration bewahrt diese naheliegende Deutung, ohne die lexikalische Alternative zu verdecken.
- source_word: כמו/הם
  choice: Kimham
  rationale: Die überlieferte Form im vorgelegten Text ist auffällig. Der Zusammenhang und die Verbindung mit dem aus 2. Samuel 19 bekannten Namen sprechen dafür, hier den Eigennamen Kimham zu lesen.
- source_word: אֲשֶׁר אֵצֶל בֵּית לָחֶם
  choice: bei Bethlehem
  rationale: אֵצֶל bezeichnet räumliche Nähe. Im Deutschen lässt sich der Relativsatz knapp und natürlich als Ortsangabe wiedergeben.
- source_word: לָלֶכֶת לָבוֹא מִצְרָיִם
  choice: um von dort nach Ägypten weiterzuziehen
  rationale: Die Infinitivkonstruktion mit ל drückt den Zweck beziehungsweise die beabsichtigte Weiterreise aus. „Weiterzuziehen“ erfasst den Reiseverlauf und die Bewegung nach Ägypten idiomatisch; „von dort“ macht den Bezug auf den Zwischenaufenthalt deutlich.
- source_word: מִצְרָיִם
  choice: Ägypten
  rationale: Übliche deutsche Wiedergabe des Ortsnamens.
