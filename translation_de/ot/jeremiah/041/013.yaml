  verdict: revise
  source_fidelity: Der Entwurf gibt die zeitliche Konstruktion, die bei Ismael befindliche Personengruppe, Johanan samt Patronym, die militärischen Befehlshaber und die anschließende Freude im Wesentlichen zutreffend wieder. Die Relativbestimmung zu den Heerführern sollte jedoch wie im Hebräischen ausdrücklich wiedergegeben werden.
  naturalness: „Als … sah, freuten sie sich“ ist verständlich, aber bei dem grammatisch singularischen Kollektivsubstantiv „Volk“ ist „freute es sich“ im modernen Standarddeutsch glatter. Die explizite Relativkonstruktion bei den Heerführern verbessert zudem die Satzklarheit.
  terminology: „Ismael“, „Johanan“, „Kareach“ und „Heerführer“ sind angemessen. „Heerführer“ trifft שָׂרֵי הַחֲיָלִים als knappe moderne militärische Bezeichnung.
