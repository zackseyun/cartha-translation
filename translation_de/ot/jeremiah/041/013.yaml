  - severity: low
    issue: Numeruskongruenz beim Kollektivsubstantiv „Volk“.
    rationale: Das hebräische Verb steht im Plural, während im Deutschen „das ganze Volk“ regulär ein Singularverb verlangt. „Freute es sich“ ist idiomatischer und beeinträchtigt die kollektive Aussage nicht.
  revised_text: Als nun das ganze Volk, das bei Ismael war, Johanan, den Sohn Kareachs, und alle Heerführer, die bei ihm waren, sah, freute es sich.
