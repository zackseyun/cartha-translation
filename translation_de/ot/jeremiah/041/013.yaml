  text: וַ/יְהִ֗י כִּ/רְא֤וֹת כָּל הָ/עָם֙ אֲשֶׁ֣ר אֶת יִשְׁמָעֵ֔אל אֶת יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/אֵ֛ת כָּל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ וַ/יִּשְׂמָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/013.yaml
  text: And when all the people who were with Ishmael saw Johanan son of Kareah and all the commanders of the forces who were with him[a], they rejoiced.
translation:
  language: de
  text: Als nun das ganze Volk, das bei Ismael war, Johanan, den Sohn Kareachs, und alle Heerführer, die bei ihm waren, sah, freute es sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Als nun … sah
  rationale: Die Konstruktion leitet in der Erzählung einen zeitlichen Umstand ein. „Als nun … sah“ gibt sowohl den Übergang als auch die zeitliche Bedeutung in natürlichem modernem Deutsch wieder, ohne die überlieferte Wendung „es geschah“ unnötig nachzubilden.
- source_word: כָּל הָעָם
  choice: das ganze Volk
  rationale: עַם bezeichnet hier die zuvor erwähnte Menschengruppe. „Das ganze Volk“ ist direkt, verständlich und bewahrt den kollektiven Ausdruck.
- source_word: אֲשֶׁר אֶת יִשְׁמָעֵאל
  choice: das bei Ismael war
  rationale: Die elliptische Relativkonstruktion verwendet אֵת komitativ. „Bei Ismael“ lässt offen, ob die Menschen freiwillig oder als Gefangene mit ihm unterwegs waren, und trägt so der knappen hebräischen Formulierung Rechnung.
- source_word: יֽוֹחָנָן בֶּן קָרֵחַ
  choice: Johanan, den Sohn Kareachs
  rationale: Der Personenname und das Patronym werden nach üblicher deutscher Bibelnamensform wiedergegeben; die Apposition wird zur besseren Lesbarkeit durch Kommas abgesetzt.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Heerführer
  rationale: שָׂרִים sind Befehlshaber, während חֲיָלִים hier die militärischen Kräfte bezeichnet. „Heerführer“ ist knapp, würdig und im Zusammenhang eindeutig militärisch.
- source_word: אֲשֶׁר אִתּוֹ
  choice: bei ihm
  rationale: Das Pronomen bezieht sich am natürlichsten auf Johanan. Die knappe Wiedergabe bewahrt den hebräischen Bezug, ohne den Namen erklärend zu wiederholen.
- source_word: וַיִּשְׂמָחוּ
  choice: freuten sie sich
  rationale: שׂמח bezeichnet Freude beziehungsweise Frohsein. „Sie freuten sich“ ist im heutigen Deutsch natürlicher als „sie frohlockten“ und gibt die emotionale Reaktion angemessen wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. Die knappe militärische Bezeichnung „Heerführer“ vermeidet sowohl archaisches als auch unnötig technisches Vokabular. Keine Fußnote ist erforderlich, da die möglichen lexikalischen Varianten den Sinn nicht wesentlich verändern.
