base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
translation:
  language: de
  text: 'Da ging Ismael, der Sohn Netanjas, aus Mizpa hinaus, ihnen entgegen. Während er weiterging, weinte er.[a] Als er ihnen begegnete, sagte er zu ihnen: »Kommt zu Gedalja, dem Sohn Ahikams!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »gehend, gehend und weinend«. Die hebräische Wiederholung drückt hier eine fortdauernde Handlung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Da ging … hinaus
  rationale: Die Narrativform führt die Handlung weiter. »Da« gibt die zeitliche Abfolge im modernen deutschen Erzählstil natürlich wieder; »hinausgehen« bewahrt zugleich den Bewegungsaspekt des Verbs.
- source_word: לִקְרָאתָם
  choice: ihnen entgegen
  rationale: Die Präpositionalfügung bezeichnet eine Bewegung auf Personen zu, um ihnen zu begegnen. »Ihnen entgegen« ist präzise und lässt sich natürlich mit »hinausgehen« verbinden.
- source_word: מִן הַמִּצְפָּה
  choice: von Mizpa
  rationale: Die Präposition markiert den Ausgangspunkt. Der Ortsname wird in der im Deutschen gebräuchlichen biblischen Form wiedergegeben.
- source_word: הֹלֵךְ הָלֹךְ
  choice: während er weiterging
  rationale: Die Verbindung aus Partizip und Infinitivus absolutus beschreibt hier eine fortdauernde Handlung. Die deutsche Formulierung gibt diesen durativen Sinn wieder, ohne die hebräische Wiederholung unnatürlich nachzuahmen.
- source_word: וּבֹכֶה
  choice: weinte er
  rationale: Das Verb bezeichnet Weinen. Im Zusammenhang mit der fortdauernden Bewegung wird auch das Weinen als begleitende Handlung dargestellt.
- source_word: וַיְהִי כִּפְגֹשׁ אֹתָם
  choice: Als er auf sie traf
  rationale: Die hebräische Konstruktion leitet einen temporalen Nebensatz ein. »Als er auf sie traf« entspricht dem Sinn klar und vermeidet eine hölzerne Wiedergabe von וַיְהִי.
- source_word: בֹּאוּ אֶל
  choice: Kommt zu
  rationale: Der Imperativ mit אֶל fordert die Männer auf, sich zu Gedalja zu begeben. »Kommt zu« bewahrt die direkte Einladung beziehungsweise Aufforderung.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  choice: Gedalja, dem Sohn Ahikams
  rationale: Die Eigennamen werden in geläufiger deutscher Transkription wiedergegeben. Der Patronym-Ausdruck bleibt ausdrücklich erhalten.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller deutscher Erzählstil. Die hebräische Dauerform wird im Haupttext idiomatisch wiedergegeben und in der Fußnote transparent gemacht; die möglichen Motive hinter Ismaels Weinen werden nicht ausgedeutet.
