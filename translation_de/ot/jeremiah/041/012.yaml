  text: וַ/יִּקְחוּ֙ אֶת כָּל הָ֣/אֲנָשִׁ֔ים וַ/יֵּ֣לְכ֔וּ לְ/הִלָּחֵ֖ם עִם יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֑ה וַ/יִּמְצְא֣וּ אֹת֔/וֹ אֶל מַ֥יִם רַבִּ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/012.yaml
  text: They took all the men and went to fight against Ishmael son of Nethaniah[a], and they found him by the great waters that are in Gibeon.
translation:
  language: de
  text: Sie nahmen alle Männer mit und zogen los, um gegen Ismael, den Sohn Netanjas, zu kämpfen. Sie fanden ihn bei den großen Wassern in Gibeon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bei den vielen/großen Wassern«. Gemeint kann ein größeres Gewässer sein; möglicherweise handelt es sich um ein großes Wasserbecken oder Reservoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ אֶת כָּל הָאֲנָשִׁים
  choice: Sie nahmen alle Männer mit
  rationale: לקח bedeutet grundsätzlich »nehmen«. Das im Deutschen ergänzte »mit« verdeutlicht kontextgemäß, dass Johanan und die Heerführer die Männer aus Vers 11 zum Kampf führten, ohne ein gewaltsames Ergreifen auszudrücken.
- source_word: וַיֵּלְכוּ לְהִלָּחֵם עִם
  choice: und zogen los, um gegen … zu kämpfen
  rationale: הלך bezeichnet hier den Aufbruch; der Infinitiv von לחם mit עִם gibt den Zweck und den feindlichen Gegner an. Die Formulierung ist natürlich und bewahrt beide Aussageelemente.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismaël, den Sohn Netanjas
  rationale: Die Namen werden in einer im Deutschen gebräuchlichen biblischen Form wiedergegeben; die Apposition mit »den Sohn« entspricht dem Patronymikon.
- source_word: וַיִּמְצְאוּ אֹתוֹ
  choice: Sie fanden ihn
  rationale: מצא hat hier die gewöhnliche Bedeutung »finden, antreffen«; »fanden« gibt die Verfolgungssituation knapp und direkt wieder.
- source_word: אֶל מַיִם רַבִּים אֲשֶׁר בְּגִבְעוֹן
  choice: bei den großen Wasserbecken in Gibeon
  rationale: אֶל bezeichnet in Verbindung mit dem Finden den erreichten Ort. מַיִם רַבִּים lautet wörtlich »viele/große Wasser« und kann größere Wasseranlagen oder ein großes Becken bezeichnen. »Wasserbecken« ist im Deutschen verständlich, während die Fußnote die Bildhaftigkeit und Unsicherheit des Hebräischen bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »zogen los« bildet den erzählerischen Aufbruch idiomatisch ab; die ungewöhnliche hebräische Ortsbezeichnung wird verständlich übersetzt und zugleich in der Fußnote offengehalten.
