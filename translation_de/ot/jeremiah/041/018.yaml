base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/018.yaml
  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
translation:
  language: de
  text: wegen der Chaldäer[a]. Denn sie fürchteten sich vor ihnen, weil Ismael, der Sohn Netanjas, Gedalja, den Sohn Ahikams, erschlagen hatte[b], den der König von Babylon über das Land eingesetzt hatte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Babyloniern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „getötet hatte“; das hebräische Verb bedeutet wörtlich „geschlagen hatte“, bezeichnet hier aber eine tödliche Tat.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit der Verantwortung für das Land betraut hatte“; möglich ist auch: „im Land eingesetzt hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  choice: aus Furcht vor den Chaldäern
  rationale: מִפְּנֵי kann hier ursächlich verstanden werden; zusammen mit dem folgenden ausdrücklichen Hinweis auf ihre Angst gibt „aus Furcht vor“ den Zusammenhang natürlich wieder. „Chaldäer“ bewahrt die hebräische Volksbezeichnung.
- source_word: כִּי יָרְאוּ מִפְּנֵיהֶם
  choice: Denn sie fürchteten sich vor ihnen
  rationale: Das erste כִּי leitet eine Begründung ein. ירא mit מִפְּנֵי bezeichnet hier die Furcht vor den Chaldäern; die deutsche Formulierung ist klar und idiomatisch.
- source_word: כִּי הִכָּה
  choice: weil ... erschlagen hatte
  rationale: Das zweite כִּי begründet ihre Furcht. נכה bedeutet wörtlich „schlagen“, bezeichnet in diesem tödlichen Zusammenhang jedoch das Erschlagen; das Plusquamperfekt verdeutlicht die vorangegangene Tat.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, der Sohn Netanjas
  rationale: Die Namen werden in geläufiger deutscher Bibelform wiedergegeben; die Abstammungsangabe wird natürlich als Apposition formuliert.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם
  choice: Gedalja, den Sohn Ahikams
  rationale: Die nicht übersetzbare Akkusativpartikel אֶת bleibt unberücksichtigt; die Abstammungsangabe folgt als Apposition.
- source_word: אֲשֶׁר הִפְקִיד מֶלֶךְ בָּבֶל בָּאָרֶץ
  choice: Diesen hatte der König von Babylon über das Land eingesetzt
  rationale: הפקיד im Hifil bezeichnet das Einsetzen beziehungsweise Beauftragen mit Verantwortung. „über das Land“ gibt die administrative Zuständigkeit wieder. Ein eigener Satz vermeidet einen schwerfälligen verschachtelten Relativsatz, ohne den Bezug zu verändern.
