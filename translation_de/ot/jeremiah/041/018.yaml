  to: wegen der Chaldäer[a]. Denn sie fürchteten sich vor ihnen, weil Ismael, der Sohn Netanjas, Gedalja, den Sohn Ahikams, erschlagen hatte[b], den der König von Babylon über das Land eingesetzt hatte[c].
  rationale: 'Die Revision ersetzt nur die zu stark vorwegnehmende Furchtformulierung am Versanfang durch die neutrale kausale Wendung „wegen der Chaldäer“. Dadurch bleibt die hebräische Struktur erhalten: Anlass durch die Chaldäer, ausdrückliche Furcht vor ihnen, dann deren Begründung durch die Tötung Gedaljas. Der Relativsatz bindet die Einsetzung unmittelbar und unmissverständlich an Gedalja an. Die Fußnote [c] wird sprachlich präzisiert, ohne die mögliche lokative Lesart auszuschließen.'
