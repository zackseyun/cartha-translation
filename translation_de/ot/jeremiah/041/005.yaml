  terminology: „Sichem“, „Silo“, „Samaria“, „Weihrauch“, „Speisopfer“ und „Jahwe“ sind treffend und im deutschen Bibeldeutsch gut verständlich. „Speisopfer“ ist im kultischen Kontext für מנחה angemessen; die Fußnote erhält die allgemeinere Lesemöglichkeit. Der Gottesname wird konsistent als „Jahwe“ wiedergegeben.
