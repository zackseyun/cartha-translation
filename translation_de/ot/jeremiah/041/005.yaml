source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ אֲ֠נָשִׁים מִ/שְּׁכֶ֞ם מִ/שִּׁל֤וֹ וּ/מִ/שֹּֽׁמְרוֹן֙ שְׁמֹנִ֣ים אִ֔ישׁ מְגֻלְּחֵ֥י זָקָ֛ן וּ/קְרֻעֵ֥י בְגָדִ֖ים וּ/מִתְגֹּֽדְדִ֑ים וּ/מִנְחָ֤ה וּ/לְבוֹנָה֙ בְּ/יָדָ֔/ם לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/005.yaml
  text: Then eighty men came from Shechem[a], from Shiloh, and from Samaria, with their beards shaved, their clothes torn, and gashing themselves[c][b], with grain offerings and frankincense in their hands to bring to the house of Yahweh.
translation:
  language: de
  text: Da kamen achtzig Männer aus Sichem, aus Silo und aus Samaria. Ihre Bärte waren abgeschoren, ihre Kleider zerrissen, und sie hatten sich Schnittwunden beigebracht.[a] Sie trugen Speisopfer[b] und Weihrauch in ihren Händen, um sie zum Haus Jahwes[c] zu bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und sie schnitten sich ein“. Gemeint ist ein damaliger Trauerbrauch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder allgemeiner: „Gaben“. Das hebräische Wort bezeichnet im kultischen Zusammenhang häufig ein Speisopfer.'
    reason: lexical_alternative
  - marker: c
    text: „Haus Jahwes“ kann hier die Tempelstätte bezeichnen, ohne vorauszusetzen, dass das Tempelgebäude noch unversehrt war.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Da kamen
  rationale: Das narrative Waw führt die Handlung weiter; „Da“ gibt die zeitlich-fortschreitende Erzählbewegung natürlich wieder.
- source_word: אֲנָשִׁים ... שְׁמֹנִים אִישׁ
  choice: achtzig Männer
  rationale: Der Ausdruck bezeichnet hier männliche Personen; die deutsche Pluralform entspricht dem Zahlwort idiomatisch.
- source_word: מִשְּׁכֶם מִשִּׁלוֹ וּמִשֹּׁמְרוֹן
  choice: aus Sichem, aus Silo und aus Samaria
  rationale: Die wiederholte Präposition wird beibehalten und die Ortsnamen folgen geläufigen deutschen Bibelschreibungen.
- source_word: מְגֻלְּחֵי זָקָן
  choice: Ihre Bärte waren abgeschoren
  rationale: Die passive Zustandsbeschreibung wird klar und konkret wiedergegeben; sie gehört zu den geschilderten Trauerzeichen.
- source_word: וּקְרֻעֵי בְגָדִים
  choice: ihre Kleider zerrissen
  rationale: Bewahrt das konkrete, im Alten Orient geläufige Trauerzeichen in natürlichem Deutsch.
- source_word: וּמִתְגֹּדְדִים
  choice: sie hatten sich Schnittwunden beigebracht
  rationale: Die Form bezeichnet das rituelle Einschneiden des eigenen Körpers; die Formulierung macht die Selbstverletzung deutlich, ohne ihre genaue Ausprägung unnötig festzulegen.
- source_word: וּמִנְחָה
  choice: Speisopfer
  rationale: Im kultischen Zusammenhang und neben Weihrauch bezeichnet minḥah wahrscheinlich ein aus pflanzlichen Erzeugnissen bestehendes Opfer; „Speisopfer“ ist die geläufige präzise Wiedergabe.
- source_word: וּלְבוֹנָה
  choice: Weihrauch
  rationale: Das hebräische Wort bezeichnet spezifisch Weihrauch und nicht Räucherwerk allgemein.
- source_word: בְּיָדָם
  choice: in ihren Händen
  rationale: Die konkrete Ausdrucksweise des Hebräischen bleibt erhalten.
- source_word: לְהָבִיא
  choice: um sie ... zu bringen
  rationale: Der Infinitiv drückt den Zweck aus; das Pronomen nimmt die mitgeführten Opfergaben auf.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: „Haus“ bewahrt die Ausdrucksweise des Ausgangstextes und vermeidet angesichts der Tempelzerstörung die Festlegung auf ein unversehrtes Tempelgebäude.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, damit der im Text stehende Gottesname erkennbar bleibt; die geläufige Ersatzlesung „der HERR“ ist möglich, würde den Eigennamen jedoch verdecken.
- issue: Bezug von בֵּית יְהוָה nach der Zerstörung Jerusalems
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: Die wörtlichere Wendung wahrt die mögliche Spannung, dass die Männer die heilige Stätte beziehungsweise den Ort des Tempels aufsuchen wollten, ohne ein noch intaktes Gebäude vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei Hauptsätze entlasten die lange hebräische Reihung, ohne Informationen oder Abfolge zu verändern. Konkrete Trauerzeichen und kultische Begriffe bleiben sichtbar; echte Unsicherheiten werden in Fußnoten kenntlich gemacht.
