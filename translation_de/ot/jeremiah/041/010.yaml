source:
  edition: WLC
  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
translation:
  language: de
  text: Dann nahm Ismael den ganzen Rest des Volkes, der in Mizpa war, gefangen[a] – die Töchter des Königs und das ganze Volk, das in Mizpa übrig geblieben war und das Nebusaradan, der Oberste der Leibwache[b], Gedalja, dem Sohn Ahikams, anvertraut hatte. Ismael, der Sohn Netanjas, nahm sie gefangen und brach auf, um zu den Ammonitern[c] hinüberzuziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verschleppte“. Das hebräische Verb bezeichnet das gewaltsame Wegführen in die Gefangenschaft.'
    reason: lexical_alternative
  - marker: b
    text: Die hebräische Amtsbezeichnung wird auch mit „Oberster der Wache“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „zu den Söhnen Ammons“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  choice: nahm … gefangen / nahm sie gefangen
  rationale: Das Qal von שׁבה bezeichnet hier das gewaltsame Gefangennehmen. Die Wiederholung gibt die Wiederaufnahme des Verbs im Hebräischen wieder.
- source_word: שְׁאֵרִית הָעָם
  choice: der ganze Rest des Volkes
  rationale: „Rest“ bezeichnet verständlich und zugleich thematisch passend den nach den vorangegangenen Ereignissen verbliebenen Teil des Volkes.
- source_word: בְּנוֹת הַמֶּלֶךְ
  choice: die Töchter des Königs
  rationale: Die direkte Wiedergabe bewahrt die konkrete Formulierung des Hebräischen; „Prinzessinnen“ wäre stärker deutend.
- source_word: הִפְקִיד
  choice: anvertraut hatte
  rationale: Im Kontext hatte Nebusaradan die Zurückgebliebenen der Aufsicht Gedaljas übergeben. „Anvertraut“ gibt dieses Verhältnis im Deutschen natürlich wieder.
- source_word: רַב טַבָּחִים
  choice: der Oberste der Leibwache
  rationale: Die idiomatische Amtsbezeichnung bezeichnet den ranghohen babylonischen Befehlshaber; eine wörtliche Wiedergabe mit „Schlächter“ wäre im Deutschen irreführend.
- source_word: לַעֲבֹר אֶל
  choice: um … hinüberzuziehen
  rationale: Die Formulierung bewahrt sowohl die zielgerichtete Bewegung als auch den durch עבר ausgedrückten Gedanken des Hinübergehens.
- source_word: בְּנֵי עַמּוֹן
  choice: die Ammoniter
  rationale: Dies ist die übliche deutsche Bezeichnung des Volkes, das im Hebräischen wörtlich „Söhne Ammons“ heißt.
