translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange hebräische Satzfolge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die Wiederaufnahme „ihn – ihn, den“ hält den Relativanschluss an Gedalja eindeutig. Die Patronymkette bleibt vollständig erhalten.
