  text: וַ/יָּקָם֩ יִשְׁמָעֵ֨אל בֶּן נְתַנְיָ֜ה וַ/עֲשֶׂ֥רֶת הָ/אֲנָשִׁ֣ים אֲשֶׁר הָי֣וּ אִתּ֗/וֹ וַ֠/יַּכּוּ אֶת גְּדַלְיָ֨הוּ בֶן אֲחִיקָ֧ם בֶּן שָׁפָ֛ן בַּ/חֶ֖רֶב וַ/יָּ֣מֶת אֹת֑/וֹ אֲשֶׁר הִפְקִ֥יד מֶֽלֶךְ בָּבֶ֖ל בָּ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
translation:
  language: de
  text: Da erhob sich Ismael, der Sohn Netanjas, zusammen mit den zehn Männern, die bei ihm waren. Sie schlugen Gedalja, den Sohn Ahikams, des Sohnes Schafans, mit dem Schwert nieder und töteten ihn[a] – ihn, den der König von Babylon im Land eingesetzt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen hier zwei Verben nacheinander: Sie schlugen ihn mit dem Schwert und verursachten seinen Tod.'
    reason: Die Anordnung unterscheidet den gewaltsamen Angriff von seinem tödlichen Ausgang; die deutsche Hauptfassung bewahrt beide Schritte.
lexical_decisions:
- source_word: וַיָּקָם
  choice: Da erhob sich
  rationale: Das Qal wayyiqtol von קום eröffnet die feindselige Handlung. „Erhob sich“ bewahrt den erzählerischen Impuls, ohne bereits ausdrücklich „lehnte sich auf“ zu sagen.
- source_word: וַעֲשֶׂרֶת הָאֲנָשִׁים אֲשֶׁר הָיוּ אִתּוֹ
  choice: zusammen mit den zehn Männern, die bei ihm waren
  rationale: Die Formulierung gibt die bestimmte, bereits bekannte Gruppe und ihre Zugehörigkeit zu Ismael natürlich wieder. „Zusammen mit“ ermöglicht im Deutschen einen klaren Singularanschluss an „Ismael“.
- source_word: וַיַּכּוּ ... בַּחֶרֶב
  choice: Sie schlugen ... mit dem Schwert nieder
  rationale: נכה bezeichnet hier einen gewaltsamen Angriff; „niederschlagen“ passt zum Mordkontext, während „mit dem Schwert“ das instrumentale ב bewahrt.
- source_word: וַיָּמֶת אֹתוֹ
  choice: und töteten ihn
  rationale: Der Hifil von מות bezeichnet das Verursachen des Todes. Die eigene Verbform bleibt neben dem vorausgehenden Angriff ausdrücklich erhalten.
- source_word: אֲשֶׁר הִפְקִיד
  choice: den ... eingesetzt hatte
  rationale: פקיד im Hifil bezeichnet hier eine amtliche Einsetzung beziehungsweise Beauftragung. „Einsetzen“ ist im politischen Zusammenhang natürlich und lässt die im Vers nicht genannte Amtsbezeichnung offen.
- source_word: בָּאָרֶץ
  choice: im Land
  rationale: Die Wiedergabe folgt der örtlichen Grundbedeutung der Präposition ב und vermeidet, eine ausdrücklich formulierte Amtsgewalt „über“ das Land in den Text einzutragen.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  choice: Gedalja, den Sohn Ahikams, des Sohnes Schafans
  rationale: Die Namens- und Abstammungskette wird vollständig bewahrt und durch deutsche Kasusformen verständlich gegliedert.
