base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/007.yaml
  text: And when they came into the midst of the city[a], Ishmael son of Nethaniah slaughtered them and threw them into the midst of the cistern, he and the men who were with him.
translation:
  language: de
  text: Als sie ins Innere der Stadt kamen, schlachtete Ismael, der Sohn Netanjas, sie ab und warf sie in die Zisterne[a] – er zusammen mit den Männern, die bei ihm waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Grube“. Das hebräische Wort kann sowohl eine Grube als auch eine Zisterne bezeichnen; im unmittelbaren Zusammenhang passt „Zisterne“ am besten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  choice: Als sie … gekommen waren
  rationale: Die hebräische Erzählungsform mit temporalem Infinitiv leitet das nächste Ereignis ein. Die deutsche Wiedergabe drückt das zeitliche Verhältnis natürlich aus, ohne die formelhafte Wendung „Und es geschah“ unnötig nachzubilden.
- source_word: אֶל תּוֹךְ הָעִיר
  choice: ins Innere der Stadt
  rationale: תּוֹךְ bezeichnet das Innere beziehungsweise die Mitte. „Ins Innere der Stadt“ bewahrt die räumliche Aussage und klingt im modernen Deutschen natürlicher als „in die Mitte der Stadt“.
- source_word: וַיִּשְׁחָטֵם
  choice: schlachtete … sie ab
  rationale: שׁחט bezeichnet ein Schlachten beziehungsweise gewaltsames Niedermetzeln. „abschlachten“ vermittelt hier die Brutalität deutlicher als das allgemeinere „töten“.
- source_word: אֶל תּוֹךְ הַבּוֹר
  choice: warf sie in die Zisterne
  rationale: Das Hebräische nennt nach dem Schlachten die Richtung „in die Zisterne hinein“, ohne ein zweites Verb ausdrücklich zu setzen. Im Deutschen wird die im Kontext vorausgesetzte Beseitigung der Getöteten mit „warf“ verständlich ausgedrückt.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: zusammen mit den Männern, die bei ihm waren
  rationale: Die nachgestellte Wendung nennt Ismaels Begleiter als Mitwirkende. „Zusammen mit“ erhält diese Funktion und vermeidet eine unnatürliche wörtliche Nachstellung von „er und die Männer“.
- source_word: בּוֹר
  choice: Zisterne
  rationale: בּוֹר kann eine Grube oder eine Zisterne bezeichnen. Im unmittelbaren Erzählzusammenhang ist ein Wasserspeicher gemeint; deshalb steht „Zisterne“ im Haupttext, während die lexikalische Alternative in der Fußnote erhalten bleibt.
