  terminology: „Zisterne“ ist im Kontext passend; die Fußnote bewahrt die lexikalische Alternative „Grube“. „abschlachten“ gibt die Härte von שׁחט angemessen wieder, ohne eine theologische Deutung einzutragen. Die Namensformen Ismael und Netanja sind im Deutschen vertretbar.
