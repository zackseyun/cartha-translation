translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Wortwahl „abschlachten“ entspricht der Gewalt des hebräischen Verbs. Der Gedankenstrich macht die nachgestellte Nennung der Mittäter lesbar, ohne Ismaels hervorgehobene Verantwortung abzuschwächen.
