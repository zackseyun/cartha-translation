  source_fidelity: 'Der Hauptsinn wird zutreffend wiedergegeben: die Ankunft im Stadtinneren, Ismaels gewaltsames Töten der Männer, die Zisterne und die Beteiligung seiner Begleiter. Das elliptisch ausgedrückte Verbringen in die Zisterne darf im Deutschen mit „warf“ expliziert werden; dies entspricht auch dem englischen Audit Trail und dem unmittelbaren Kontext. Die Wendung „zusammen mit den Männern“ ist jedoch syntaktisch missverständlich, weil sie sich unmittelbar an „warf sie“ anschließt und daher nahelegen kann, die Männer seien zusammen mit den Opfern in die Zisterne geworfen worden.'
