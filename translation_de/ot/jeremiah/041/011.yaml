  text: וַ/יִּשְׁמַע֙ יוֹחָנָ֣ן בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֵ֤ת כָּל הָֽ/רָעָה֙ אֲשֶׁ֣ר עָשָׂ֔ה יִשְׁמָעֵ֖אל בֶּן נְתַנְיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: de
  text: Als Johanan, der Sohn Kareachs, und alle Befehlshaber der Truppen, die bei ihm waren, von all dem Bösen hörten, das Ismael, der Sohn Netanjas, getan hatte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Als ... hörten
  rationale: Das narrative וַ wird im Zusammenhang mit dem folgenden Vers sinnvoll als temporaler Nebensatz wiedergegeben. Der Singular steht vor einem zusammengesetzten Subjekt; im natürlichen Deutschen wird das Prädikat im Plural formuliert.
- source_word: שָׂרֵי הַחֲיָלִים
  choice: Heerführer
  rationale: שָׂרֵי bezeichnet militärische Anführer, הַחֲיָלִים die Streitkräfte beziehungsweise Truppen. „Heerführer“ ist knapp, verständlich und dem militärischen Zusammenhang angemessen.
- source_word: אֲשֶׁר אִתּוֹ
  choice: die bei ihm waren
  rationale: Der Relativsatz bezeichnet die Heerführer, die Johanan begleiteten; „bei ihm“ gibt אִתּוֹ natürlich und genau wieder.
- source_word: אֵת כָּל הָרָעָה
  choice: von all dem Bösen
  rationale: רָעָה bezeichnet hier zugleich schweres Unrecht und dessen schädliche Taten. „das Böse“ bewahrt das moralische Gewicht, ohne die Bedeutung auf bloßen Schaden oder Unglück zu verengen.
- source_word: עָשָׂה
  choice: getan hatte
  rationale: Das Plusquamperfekt verdeutlicht im deutschen temporalen Satz, dass Ismaels Taten dem Hören vorausgingen, ohne das allgemeine Verb עשה interpretierend zu verschärfen.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  choice: Johanan, der Sohn Kareachs
  rationale: Die Namen werden in etablierter deutscher Bibelschreibung transliteriert; die Apposition mit Artikel klingt im Deutschen natürlich und würdig.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  choice: Ismael, der Sohn Netanjas
  rationale: Die Namen werden in etablierter deutscher Bibelschreibung transliteriert; „der Sohn“ bildet die hebräische Abstammungsangabe klar ab.
