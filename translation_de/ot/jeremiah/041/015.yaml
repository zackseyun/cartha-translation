  text: וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֗ה נִמְלַט֙ בִּ/שְׁמֹנָ֣ה אֲנָשִׁ֔ים מִ/פְּנֵ֖י יֽוֹחָנָ֑ן וַ/יֵּ֖לֶךְ אֶל בְּנֵ֥י עַמּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
translation:
  language: de
  text: Doch Ismael, der Sohn Netanjas, entkam Johanan zusammen mit acht Männern und ging zu den Ammonitern.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „und Ismael“; die Konjunktion kann mit „und“ wiedergegeben werden, doch „doch“ hebt den Gegensatz zum vorausgehenden Erzählzusammenhang hervor.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Angesicht Johanans“; die hebräische Wendung meint, dass Ismael aus seiner Gegenwart beziehungsweise vor seiner Verfolgung entkam.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebräisch: „zu den Söhnen Ammons“, das heißt zu den Ammonitern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Doch Ismael
  rationale: Das ו kann schlicht mit „und“ wiedergegeben werden; „doch“ macht hier den Gegensatz zum vorausgehenden Eingreifen Johanans natürlich deutlich.
- source_word: בֶּן נְתַנְיָה
  choice: der Sohn Netanjas
  rationale: Die hebräische Patronymkonstruktion wird im Deutschen klar und idiomatisch wiedergegeben.
- source_word: נִמְלַט
  choice: entkam
  rationale: Der Nifal von מלט bezeichnet hier die erfolgreiche Flucht aus einer bedrohlichen Lage oder vor einem Verfolger.
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  choice: mit acht Männern
  rationale: 'Die Präposition ב ist hier am besten komitativ zu verstehen: Acht Männer begleiteten Ismael bei seiner Flucht.'
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  choice: Johanan
  rationale: Wörtlich steht „vom Angesicht Johanans“; zusammen mit „entkam“ bezeichnet die Wendung das Entkommen aus seiner Gegenwart beziehungsweise vor seiner Verfolgung. Im Deutschen genügt das direkte Objekt nach „entkommen“.
- source_word: וַ/יֵּלֶךְ
  choice: und ging
  rationale: Die Wayyiqtol-Form führt die Erzählfolge weiter; „und ging“ bewahrt diese schlichte Abfolge.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: zu den Ammonitern
  rationale: „Söhne Ammons“ ist die übliche hebräische Volksbezeichnung für die Ammoniter und wird im modernen Deutschen entsprechend idiomatisch wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt nah an der knappen hebräischen Erzählweise, löst jedoch die Idiome in natürlichem Deutsch auf. Die Namensformen „Ismael“, „Netanja“ und „Johanan“ entsprechen geläufigen deutschen Bibeltransliterationen.
