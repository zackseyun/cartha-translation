source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: In the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
translation:
  language: de
  text: Im siebten Monat kam Ismael, der Sohn Netanjas und Enkel Elischamas, der aus königlichem Geschlecht[a] stammte und zu den Großen des Königs[b] gehörte, mit zehn Männern nach Mizpa zu Gedalja, dem Sohn Ahikams. Dort in Mizpa aßen sie gemeinsam Brot[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Samen des Königtums“, das heißt aus der königlichen Linie.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu den Würdenträgern des Königs“. Der hebräische Ausdruck bezeichnet hochrangige Männer am Königshof, ohne ihr Amt näher festzulegen.'
    reason: lexical_alternative
  - marker: c
    text: „Brot essen“ kann im Hebräischen allgemein bedeuten, gemeinsam eine Mahlzeit einzunehmen.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיְהִי
  choice: Im siebten Monat kam
  rationale: Die hebräische Erzählungsformel leitet die neue Szene ein. Im modernen Deutschen trägt der einleitende Zeitausdruck den Übergang natürlich, ohne ein in der Quelle nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: im siebten Monat
  rationale: Der bestimmte hebräische Zeitausdruck wird direkt und chronologisch präzise wiedergegeben.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: aus königlichem Geschlecht
  rationale: זֶרַע bezeichnet hier Abstammung, nicht wörtlich Samen. Die Formulierung gibt die Zugehörigkeit zur königlichen Linie idiomatisch wieder.
- source_word: וְרַבֵּי הַמֶּלֶךְ
  choice: und zu den Großen des Königs gehörte
  rationale: Der hebräische Plural bezeichnet die Gruppe hochrangiger Männer beziehungsweise Würdenträger des Königs. Die deutsche Formulierung bezieht Ismael als Einzelnen auf diese Gruppe und vermeidet eine nicht belegte genauere Amtsbezeichnung.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: mit zehn Männern
  rationale: Die Begleitung wird im Deutschen knapp und natürlich ausgedrückt; ein zusätzliches „bei ihm“ wäre redundant.
- source_word: אֶל גְּדַלְיָהוּ ... הַמִּצְפָּתָה
  choice: nach Mizpa zu Gedalja, dem Sohn Ahikams
  rationale: Die Richtungsform von Mizpa bezeichnet das Ziel der Bewegung. Die Wortstellung macht sowohl den Ort als auch die aufgesuchte Person eindeutig.
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  choice: Dort ... aßen sie gemeinsam Brot
  rationale: Das ausdrücklich genannte Brot bleibt im Haupttext erhalten; „gemeinsam“ gibt יַחְדָּו wieder. Eine Fußnote erklärt den idiomatischen Sinn einer gemeinsamen Mahlzeit.
- source_word: בַּמִּצְפָּה
  choice: Dort in Mizpa
  rationale: Die Wiederholung des Ortsnamens wird wie im Hebräischen bewahrt und zugleich in einen natürlichen deutschen Satz eingebettet.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Abstammungsangabe wird mit „Sohn ... und Enkel ...“ natürlich entfaltet. Die Wiederholung von Mizpa und das Bild vom Brotessen bleiben erhalten; schwer verständliche Hebraismen werden in Fußnoten erläutert.
