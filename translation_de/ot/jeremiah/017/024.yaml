source:
  edition: WLC
  text: וְ֠/הָיָה אִם שָׁמֹ֨עַ תִּשְׁמְע֤וּ/ן אֵלַ/י֙ נְאֻם יְהוָ֔ה לְ/בִלְתִּ֣י הָבִ֣יא מַשָּׂ֗א בְּ/שַׁעֲרֵ֛י הָ/עִ֥יר הַ/זֹּ֖את בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וּ/לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת לְ/בִלְתִּ֥י עֲשֽׂוֹת ב/ה כָּל מְלָאכָֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/024.yaml
  text: And it shall be[a], if you truly listen to me, declares Yahweh, by not bringing a load through the gates of this city on the Sabbath day, and by keeping the Sabbath day holy, by not doing any work on it[b],
translation:
  language: de
  text: Und es wird geschehen, wenn ihr wirklich auf mich hört[a] – Spruch Jahwes – und am Sabbattag keine Last[b] durch die Tore dieser Stadt bringt, den Sabbattag heiligt und an ihm keinerlei Arbeit verrichtet,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit verstärkender Wiederholung: „wenn ihr hörend hört“. Gemeint sein kann auch: „wenn ihr mir gewissenhaft gehorcht“.'
    reason: Die hebräische Wendung verstärkt das Verb „hören“ und kann gehorsames Hören bezeichnen.
  - marker: b
    text: 'Oder: „Bürde“. Gemeint ist hier etwas, das am Sabbat durch die Stadttore getragen beziehungsweise transportiert wird.'
    reason: Das hebräische Wort kann sowohl eine konkret getragene Last als auch allgemeiner eine Bürde bezeichnen.
lexical_decisions:
- source_word: וְהָיָה
  choice: Und es wird geschehen
  rationale: Bewahrt die hebräische Zukunfts- und Übergangsformel in würdigem, verständlichem Deutsch; der folgende Doppelpunkt führt den Bedingungssatz ein.
- source_word: אִם שָׁמֹעַ תִּשְׁמְעוּן אֵלַי
  choice: Wenn ihr wirklich auf mich hört
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt שׁמע. „Wirklich hört“ erhält sowohl den Höraspekt als auch den im Zusammenhang mitschwingenden Gehorsam, ohne diesen im Haupttext festzuschreiben.
- source_word: נְאֻם יְהוָה
  choice: Spruch Jahwes
  rationale: Gibt die feste prophetische Botenformel knapp und gewichtig wieder. Die Gedankenstriche grenzen den Einschub im deutschen Satz klar ab.
- source_word: לְבִלְתִּי הָבִיא
  choice: indem ihr … keine … bringt
  rationale: Die Konstruktion erläutert, worin das geforderte Hören besteht. „Indem“ verbindet die Handlungen natürlich mit dem Bedingungssatz.
- source_word: מַשָּׂא
  choice: Last
  rationale: Bezeichnet hier konkret etwas Getragenes beziehungsweise Transportiertes. „Last“ bewahrt zugleich die mögliche allgemeinere Bedeutung des Wortes.
- source_word: בְּשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: durch die Tore dieser Stadt
  rationale: Der Kontext beschreibt das Hinein- oder Hindurchtragen von Lasten an den Stadttoren; „durch“ gibt die Bewegung idiomatisch wieder.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: Bewahrt das ausdrücklich genannte „Tag“ und entspricht natürlichem modernem Deutsch.
- source_word: וּלְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: den Sabbattag heiligt
  rationale: '„Heiligen“ ist eine direkte und im Deutschen verständliche Wiedergabe von קדשׁ: den Tag als heilig behandeln.'
- source_word: לְבִלְתִּי עֲשׂוֹת בָהּ כָּל מְלָאכָה
  choice: an ihm keinerlei Arbeit verrichtet
  rationale: Das Pronomen bezieht sich auf den Sabbattag. „Keinerlei Arbeit“ bildet כָּל מְלָאכָה im negierten Satz vollständig und natürlich ab.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben; „Jahwe“ ist die im Deutschen geläufige Form und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsumfang von שׁמע
  choice: auf mich hört
  alternative: mir gehorcht
  rationale: Das Verb kann im Bundeszusammenhang gehorsames Hören meinen. Die gewählte Form bewahrt den konkreten Hörbegriff, während die folgenden Handlungen den Gehorsam inhaltlich entfalten.
- issue: Verhältnis der Infinitivkonstruktionen zum Hören
  choice: Erläuterung durch „indem“
  alternative: Nebenordnung als weitere Bedingungen
  rationale: Die negierten und positiven Infinitivkonstruktionen beschreiben, wie sich das Hören auf Jahwe zeigt. „Indem“ macht diesen Bezug verständlich, ohne eine zusätzliche theologische Folgerung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Versform bleibt als noch nicht abgeschlossener Bedingungssatz offen und endet daher mit einem Komma. „Spruch Jahwes“ wahrt den prophetischen Ton; „indem“ sorgt trotz der langen hebräischen Infinitivreihe für einen klaren deutschen Satzbau.
