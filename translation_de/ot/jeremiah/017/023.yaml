id: JER.17.23
reference: Jeremiah 17:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/לֹ֣א שָֽׁמְע֔וּ וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָ֑/ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם לְ/בִלְתִּ֣י שומע וּ/לְ/בִלְתִּ֖י קַ֥חַת מוּסָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/023.yaml
  text: But they did not listen[a], and they did not incline their ear[c][b], but stiffened their neck so as not to hear and not to accept discipline.
translation:
  language: de
  text: Doch sie hörten nicht[a] und neigten ihr Ohr nicht, sondern verhärteten ihren Nacken[b], um nicht zu hören und keine Zurechtweisung[c] anzunehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie hörten nicht darauf“ beziehungsweise „sie gehorchten nicht“. Das hebräische Verb kann Hören, aufmerksames Zuhören oder Gehorchen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ein körperliches Bild für hartnäckigen Widerstand.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Unterweisung“, „Erziehung“ oder „Disziplin“. Das hebräische Wort umfasst korrigierende und erziehende Anleitung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: hörten nicht
  rationale: שׁמע kann je nach Zusammenhang „hören“, „zuhören“ oder „gehorchen“ bedeuten. „Hörten nicht“ bewahrt hier die Mehrdeutigkeit und passt zur parallelen Aussage, dass sie ihr Ohr nicht neigten.
- source_word: הִטּוּ אֶת אָזְנָם
  choice: neigten ihr Ohr nicht
  rationale: Die Wiedergabe erhält das hebräische Bild bewusster, aufmerksamer Hinwendung. Die Wendung ist im modernen Deutschen gehoben, aber klar verständlich.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: verhärteten ihren Nacken
  rationale: Das körperliche Bild für hartnäckigen Widerstand wird bewahrt. „Verhärteten“ gibt die bewirkte Versteifung idiomatischer wieder als das wörtlichere „machten hart“.
- source_word: לְבִלְתִּי שֹׁמֵעַ
  choice: um nicht zu hören
  rationale: לְבִלְתִּי mit Infinitiv bezeichnet hier Zweck oder beabsichtigtes Ergebnis. Die Formulierung bewahrt diesen Zusammenhang, ohne ihn enger festzulegen.
- source_word: וּלְבִלְתִּי קַחַת מוּסָר
  choice: und keine Zurechtweisung anzunehmen
  rationale: קחת wird natürlich mit „annehmen“ wiedergegeben. מוּסָר umfasst korrigierende und erziehende Unterweisung; „Zurechtweisung“ bringt im Kontext den korrigierenden Akzent zur Geltung, ohne das heute missverständliche „Zucht“ zu verwenden.
- source_word: מוּסָר
  choice: Zurechtweisung
  rationale: Der Ausdruck kann „Zurechtweisung“, „Unterweisung“, „Erziehung“ oder „Disziplin“ bezeichnen. Im prophetischen Tadel ist „Zurechtweisung“ eine klare, gegenwärtige Entsprechung.
theological_decisions:
- issue: Bild für hartnäckigen Widerstand
  choice: Das Bild „verhärteten ihren Nacken“ bleibt im Haupttext erhalten.
  alternative: „wurden hartnäckig“ oder „widersetzten sich eigensinnig“
  rationale: Die hebräische Metapher ist verständlich und trägt die prophetische Darstellung bewussten Widerstands, ohne sie durch eine bloße Deutung zu ersetzen.
- issue: Bedeutungsumfang von שׁמע
  choice: Beide Vorkommen werden mit „hören“ wiedergegeben.
  alternative: „zuhören“ oder „gehorchen“
  rationale: „Hören“ bewahrt die Spannung zwischen akustischem Wahrnehmen, aufmerksamem Zuhören und gehorsamer Reaktion. Eine Übersetzung mit „gehorchen“ würde die im Kontext mitschwingende Folgerung ausdrücklich machen.
- issue: Bedeutungsumfang von מוּסָר
  choice: „Zurechtweisung“
  alternative: „Unterweisung“, „Erziehung“ oder „Disziplin“
  rationale: Die Wahl betont die korrigierende Funktion im prophetischen Kontext, während die Fußnote den weiteren erzieherischen Bedeutungsumfang offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur und die hebräischen Körperbilder bleiben weitgehend erhalten; „Zurechtweisung“ vermeidet das im heutigen Deutsch leicht missverständliche oder altertümliche „Zucht“.
