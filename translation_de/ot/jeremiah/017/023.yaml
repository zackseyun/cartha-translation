  terminology: Die Wiedergaben von Ohrneigen, Nackenverhärtung und Zurechtweisung sind terminologisch konsistent und bewahren die hebräischen Bilder ohne konfessionell interpretierende Erweiterung. Die Fußnoten erläutern die relevanten lexikalischen Alternativen sachgerecht; alle Marker sind korrekt verankert.
