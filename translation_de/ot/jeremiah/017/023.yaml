  source_fidelity: Der deutsche Text gibt die drei parallelen Verweigerungshandlungen und die abschließenden Zweckangaben des Hebräischen vollständig wieder. „hörten nicht“ bewahrt bei שׁמע die offene Nuance zwischen Hören, Zuhören und gehorsamem Reagieren; „um nicht zu hören“ bildet לְבִלְתִּי angemessen ab. „Zurechtweisung anzunehmen“ ist für קַחַת מוּסָר im prophetischen Tadelkontext tragfähig, während die Fußnote den weiteren Bedeutungsumfang offenlegt.
