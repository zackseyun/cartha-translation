  text: כִּ/זְכֹּ֤ר בְּנֵי/הֶם֙ מִזְבְּחוֹתָ֔/ם וַ/אֲשֵׁרֵי/הֶ֖ם עַל עֵ֣ץ רַֽעֲנָ֑ן עַ֖ל גְּבָע֥וֹת הַ/גְּבֹהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/002.yaml
  text: As their children remember their altars and their Asherim beside every green tree[a], on the high hills,
translation:
  language: de
  text: Wie ihre Kinder sich an ihre Altäre und ihre Ascheren[a] bei jedem grünen Baum und auf den hohen Hügeln erinnern,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Aschera-Pfähle« oder »ihre Kultpfähle«. Das hebräische Wort bezeichnet Kultobjekte, die mit der Göttin Aschera verbunden waren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּזְכֹּר
  choice: Wie … sich … erinnern
  rationale: Die Verbindung aus כְּ und dem Infinitiv von זכר leitet hier einen begleitenden bzw. vergleichenden Umstand ein. Die deutsche Formulierung bewahrt den Anschluss an den vorausgehenden Vers und gibt den mentalen Vorgang natürlich wieder.
- source_word: בְּנֵיהֶם
  choice: ihre Kinder
  rationale: בנים kann sowohl „Söhne“ als auch allgemeiner „Kinder“ bezeichnen. Hier ist die umfassendere Wiedergabe im Blick auf die nachfolgende Generation sachgerecht.
- source_word: מִזְבְּחוֹתָם
  choice: ihre Altäre
  rationale: מִזְבְּחוֹת bezeichnet eindeutig kultische Altäre; das Possessivsuffix bleibt erhalten.
- source_word: וַאֲשֵׁרֵיהֶם
  choice: und ihre Ascheren
  rationale: Die eingedeutschte, aber bewusst nicht näher bestimmte Bezeichnung wahrt, dass אֲשֵׁרִים Kultobjekte bezeichnet, die mit Aschera verbunden sind, ohne ihre genaue Gestalt festzulegen.
- source_word: עַל עֵץ רַעֲנָן
  choice: bei jedem grünenden Baum
  rationale: עַל bezeichnet hier die Lage bei einem Baum, nicht notwendig auf ihm. Der Singular hat in der wiederkehrenden kultischen Wendung verallgemeinernde Bedeutung; רַעֲנָן beschreibt frisches, üppiges Grün.
- source_word: עַל גְּבָעוֹת הַגְּבֹהוֹת
  choice: auf den hohen Hügeln
  rationale: Die Formulierung gibt sowohl die räumliche Lage als auch den Bezug auf erhöhte Kultstätten direkt und idiomatisch wieder.
theological_decisions:
- issue: Bestimmung der mit אֲשֵׁרִים bezeichneten Kultobjekte
  choice: ihre Ascheren
  alternative: ihre Aschera-Pfähle; ihre Kultpfähle
  rationale: Die genaue Gestalt dieser mit Aschera verbundenen Kultobjekte ist nicht sicher. Der Haupttext vermeidet daher eine Festlegung auf Pfähle, während die Fußnote die möglichen Bedeutungen erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers bleibt als syntaktisch an den Zusammenhang angeschlossener Satzteil mit abschließendem Komma stehen. „Ascheren“ bewahrt die sachliche Unbestimmtheit des hebräischen Kultbegriffs; die Fußnote erschließt ihn allgemeinverständlich.
