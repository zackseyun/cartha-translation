source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אָר֤וּר הַ/גֶּ֨בֶר֙ אֲשֶׁ֣ר יִבְטַ֣ח בָּֽ/אָדָ֔ם וְ/שָׂ֥ם בָּשָׂ֖ר זְרֹע֑/וֹ וּ/מִן יְהוָ֖ה יָס֥וּר לִבּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/005.yaml
  text: 'Thus says Yahweh: Cursed is the man who trusts in man and makes flesh his strength[b][a], whose heart turns away from Yahweh.'
translation:
  language: de
  text: 'So spricht Jahwe: Verflucht ist der Mann, der auf Menschen vertraut[a] und Fleisch zu seiner Stärke macht[b], dessen Herz sich von Jahwe abwendet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Mann“ gibt das hebräische maskuline Singularwort wieder; „Menschen“ gibt ein hebräisches Singularwort in allgemeiner Bedeutung wieder. Die Warnung ist nicht auf Männer beschränkt.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „Fleisch zu seinem Arm macht“. Der „Arm“ steht bildlich für Stärke oder Macht; „Fleisch“ bezeichnet hier menschliche Sterblichkeit und Schwäche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel in natürlichem, würdigem Deutsch und gibt den Gottesnamen als Jahwe wieder.
- source_word: אָרוּר
  choice: Verflucht
  rationale: Gibt die unheilverkündende, rechtlich-bundestheologische Aussage knapp und unmittelbar wieder.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: Entspricht der maskulinen Singularform und bewahrt ihre repräsentative Verwendung; die inklusive Reichweite wird in einer Fußnote erläutert.
- source_word: יִבְטַח בָּאָדָם
  choice: auf Menschen vertraut
  rationale: Das artikellose אָדָם bezeichnet hier den Menschen als sterbliches Gegenüber zu Jahwe. Der deutsche Singular ohne Artikel hat generische Kraft und klingt natürlicher als „auf den Menschen“ oder „auf einen Menschen“.
- source_word: וְשָׂם בָּשָׂר זְרֹעוֹ
  choice: und Fleisch zu seinem Arm macht
  rationale: Bewahrt sowohl בָּשָׂר („Fleisch“) als Bild menschlicher Vergänglichkeit als auch זְרוֹעַ („Arm“) als Bild für Kraft und Macht; eine Fußnote erschließt das Idiom.
- source_word: וּמִן יְהוָה יָסוּר לִבּוֹ
  choice: dessen Herz sich von Jahwe abwendet
  rationale: Die Relativkonstruktion verbindet die abschließende Aussage klar mit „der Mann“; „Herz“ bewahrt das umfassende biblische Bild für inneres Wollen und Vertrauen.
theological_decisions:
- issue: Repräsentatives Maskulinum in der Warnung
  choice: der Mann, der auf Menschen vertraut
  alternative: der Mensch, der auf einen Menschen vertraut
  rationale: גֶּבֶר bezeichnet ausdrücklich einen Mann, während אָדָם generisch den Menschen meint. Die Übersetzung wahrt diese lexikalische Unterscheidung, ohne die Warnung auf Männer zu beschränken.
- issue: Bildsprache von בָּשָׂר und זְרֹעוֹ
  choice: Fleisch zu seinem Arm macht
  alternative: menschliche Kraft zu seiner Stärke macht
  rationale: Die wörtlichere Fassung erhält die Spannung zwischen vergänglichem Fleisch und Jahwe sowie das biblische Bild des Arms als Kraft oder Macht. Die Alternative wäre glatter, würde aber beide Bilder abschwächen.
- issue: Beziehung des letzten Satzglieds zum vorhergehenden Handeln
  choice: dessen Herz sich von Jahwe abwendet
  alternative: und sein Herz wendet sich von Jahwe ab
  rationale: Das Relativpronomen gibt die sachliche Einheit von menschlichem Vertrauen und innerer Abkehr wieder, ohne eine zusätzliche zeitliche oder ursächliche Festlegung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem prophetischem Ton. Die knappe Botenformel und die konkrete Körperbildsprache des Hebräischen bleiben erhalten; erklärungsbedürftige repräsentative und idiomatische Wendungen werden durch Fußnoten erschlossen.
