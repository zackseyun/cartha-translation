id: JER.17.25
reference: Jeremiah 17:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָ֣אוּ בְ/שַׁעֲרֵ֣י הָ/עִ֣יר הַ/זֹּ֡את מְלָכִ֣ים וְ/שָׂרִ֡ים יֹשְׁבִים֩ עַל כִּסֵּ֨א דָוִ֜ד רֹכְבִ֣ים בָּ/רֶ֣כֶב וּ/בַ/סּוּסִ֗ים הֵ֚מָּה וְ/שָׂ֣רֵי/הֶ֔ם אִ֥ישׁ יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/יָשְׁבָ֥ה הָֽ/עִיר הַ/זֹּ֖את לְ/עוֹלָֽם׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/025.yaml
  text: then kings and officials will enter through the gates of this city[a], sitting on the throne of David, riding in chariots and on horses—they and their officials, the men of Judah and the inhabitants of Jerusalem—and this city will be inhabited forever.
translation:
  language: de
  text: Dann werden Könige und führende Beamte durch die Tore dieser Stadt einziehen, die auf dem Thron Davids sitzen und in Wagen fahren und auf Pferden reiten – sie und ihre führenden Beamten, die Männer von Juda[a] und die Einwohner Jerusalems –, und diese Stadt wird für immer bewohnt sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Bevölkerung Judas“. Wörtlich steht im Hebräischen „ein Mann aus Juda“, hier kollektiv gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: Dann werden ... einziehen
  rationale: Die Konjunktion führt die Folge der Bedingung aus dem vorhergehenden Vers weiter. „Dann“ macht diesen Zusammenhang im Deutschen natürlich deutlich; „einziehen“ passt zur Bewegung durch Stadttore.
- source_word: בְשַׁעֲרֵי הָעִיר הַזֹּאת
  choice: durch die Tore dieser Stadt
  rationale: Bei בוא mit ב bezeichnet die Wendung den Eintritt durch beziehungsweise in die Tore; „durch die Tore“ gibt das Bild eines feierlichen Einzugs idiomatisch wieder.
- source_word: מְלָכִים וְשָׂרִים
  choice: Könige und hohe Beamte
  rationale: שָׂרִים bezeichnet führende Amtsträger oder Würdenträger. „Hohe Beamte“ ist modern und verständlich, ohne erblichen Adel vorauszusetzen.
- source_word: יֹשְׁבִים עַל כִּסֵּא דָוִד
  choice: Sie sitzen auf dem Thron Davids
  rationale: Die Formulierung bewahrt das konkrete Thronbild und den dynastischen Bezug auf David. Der Plural des hebräischen Partizips bleibt sichtbar.
- source_word: רֹכְבִים בָּרֶכֶב וּבַסּוּסִים
  choice: fahren in Wagen oder reiten auf Pferden
  rationale: Das hebräische רכב kann sowohl das Fahren im Wagen als auch das Reiten bezeichnen. Die deutsche Formulierung verwendet für beide Fortbewegungsarten das jeweils natürliche Verb; „oder“ beschreibt die beiden genannten Arten, ohne eine gleichzeitige Nutzung zu suggerieren.
- source_word: הֵמָּה וְשָׂרֵיהֶם
  choice: Mit ihnen kommen ihre hohen Beamten
  rationale: Das betonte Pronomen nimmt die königliche Gruppe wieder auf. Die Ergänzung „kommen“ macht die lange hebräische Reihung im Deutschen verständlich, während „hohe Beamte“ שָׂרִים einheitlich wiedergibt.
- source_word: אִישׁ יְהוּדָה
  choice: die Männer Judas
  rationale: Wörtlich steht der maskuline Singular „Mann Judas“, der hier kollektiv gebraucht wird. „Die Männer Judas“ bewahrt sowohl den kollektiven als auch den maskulinen Ausdruck.
- source_word: וְיֹשְׁבֵי יְרוּשָׁלָ͏ִם
  choice: und die Einwohner Jerusalems
  rationale: „Einwohner“ ist die natürliche deutsche Kollektivbezeichnung für die in Jerusalem Wohnenden.
- source_word: וְיָשְׁבָה הָעִיר הַזֹּאת
  choice: Diese Stadt wird ... bewohnt sein
  rationale: Wenn eine Stadt Subjekt von ישב ist, bedeutet das Verb, dass sie bewohnt beziehungsweise besiedelt ist. Die deutsche Zustandsform gibt diesen Sinn klar wieder.
- source_word: לְעוֹלָם
  choice: für immer
  rationale: „Für immer“ ist die geläufige und würdige Wiedergabe der hier ausgedrückten dauerhaften Fortexistenz.
theological_decisions:
- issue: Dynastischer Bezug in „Thron Davids“
  choice: Die ausdrückliche Formulierung „Thron Davids“ bleibt erhalten.
  alternative: Davids Königsherrschaft; der davidische Thron
  rationale: Der Wortlaut trägt in Jeremia königliche und bundestheologische Bedeutung. Die Übersetzung bewahrt ihn, ohne eine weitergehende christologische oder konfessionelle Deutung einzufügen.
- issue: Bezug des pluralischen Partizips יֹשְׁבִים
  choice: Der grammatische Plural wird mit „Sie sitzen“ auf die unmittelbar genannte Gesamtgruppe bezogen.
  alternative: Nur die Könige als diejenigen kennzeichnen, die auf Davids Thron sitzen
  rationale: Die hebräische Syntax setzt das pluralische Partizip nach „Könige und hohe Beamte“. Auch wenn der Thron sachlich besonders mit den Königen verbunden ist, soll die Übersetzung die grammatische Spannung nicht stillschweigend auflösen.
- issue: Geschlecht und Kollektivgebrauch in אִישׁ יְהוּדָה
  choice: „die Männer Judas“ im Haupttext
  alternative: die Bevölkerung Judas; die Leute aus Juda
  rationale: Der hebräische maskuline Singular wird kollektiv gebraucht. Die gewählte Form bewahrt die grammatische Geschlechtsmarkierung; die Fußnote nennt die mögliche kollektive Sinnwiedergabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die lange hebräische Satzreihe ist zur besseren Verständlichkeit in kurze Sätze gegliedert; die Abfolge der beteiligten Gruppen und das Bild des Einzugs bleiben erhalten.
