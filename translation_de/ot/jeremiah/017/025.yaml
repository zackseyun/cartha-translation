  source_fidelity: 'Die Grundbedeutung ist weitgehend getroffen: Die bedingte Folge, der Einzug durch die Stadttore, Davids Thron, die beteiligten Gruppen und die dauerhafte Bewohnung der Stadt sind erhalten. Allerdings macht „oder“ aus der hebräischen Verbindung von Wagen und Pferden eine nicht belegte Alternative. Die Umstellung zu „Mit ihnen kommen ihre hohen Beamten“ fügt zudem ein eigenes Kommen hinzu und lockert die im Hebräischen fortlaufend koordinierte Aufzählung.'
  naturalness: Der Entwurf ist gut verständlich, doch die Aufteilung in mehrere Sätze schwächt die feierlich-aufzählende Satzbewegung. Eine Satzperiode mit Gedankenstrichen stellt die Wiederaufnahme „sie und ihre ...“ im Deutschen klarer dar. „führende Beamte“ ist modernes Standarddeutsch und für שרים angemessen.
  terminology: „Thron Davids“ ist korrekt und sollte ausdrücklich bleiben. Für שרים wird durchgehend „führende Beamte“ verwendet. „Männer von Juda“ bewahrt den maskulinen Kollektivausdruck besser als eine neutrale Umschreibung; die Fußnote erläutert den kollektiven Gebrauch und korrigiert die ungenaue wörtliche Angabe „der Mann Judas“.
