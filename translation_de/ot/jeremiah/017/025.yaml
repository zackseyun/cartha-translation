  - severity: medium
    issue: „Mit ihnen kommen ihre hohen Beamten“
    rationale: Das Verb „kommen“ wird hier zusätzlich eingeführt; außerdem wird die hebräische koordinierte Aufzählung der Einziehenden in eine neue, semantisch anders akzentuierte Aussage umgeformt.
  - severity: low
    issue: 'Fußnote: „der Mann Judas“'
    rationale: אִישׁ יְהוּדָה bedeutet wörtlich eher „ein Mann aus/von Juda“; die vorliegende Formulierung klingt im Deutschen possessiv und ist als Wort-für-Wort-Erklärung ungenau.
  revised_text: Dann werden Könige und führende Beamte durch die Tore dieser Stadt einziehen, die auf dem Thron Davids sitzen und in Wagen fahren und auf Pferden reiten – sie und ihre führenden Beamten, die Männer von Juda[a] und die Einwohner Jerusalems –, und diese Stadt wird für immer bewohnt sein.
