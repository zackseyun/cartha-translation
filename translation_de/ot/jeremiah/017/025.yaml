revisions:
- from: Dann werden Könige und hohe Beamte durch die Tore dieser Stadt einziehen. Sie sitzen auf dem Thron Davids und fahren in Wagen oder reiten auf Pferden. Mit ihnen kommen ihre hohen Beamten, die Männer Judas[a] und die Einwohner Jerusalems. Diese Stadt wird für immer bewohnt sein.
  to: Dann werden Könige und führende Beamte durch die Tore dieser Stadt einziehen, die auf dem Thron Davids sitzen und in Wagen fahren und auf Pferden reiten – sie und ihre führenden Beamten, die Männer von Juda[a] und die Einwohner Jerusalems –, und diese Stadt wird für immer bewohnt sein.
  rationale: Die Revision bewahrt die hebräische Reihung und die Wiederaufnahme durch das betonte Pronomen, ohne ein zusätzliches Kommen der Beamten einzuführen. Die Verbindung von Wagen und Pferden wird mit „und“ statt mit einer unbelegten Alternative wiedergegeben. Der explizite Davidbezug und der kollektive maskuline Ausdruck für Juda bleiben erhalten; die Fußnote erläutert Letzteren präziser.
