language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וּ/בָ֣אוּ מֵ/עָרֵֽי יְ֠הוּדָה וּ/מִ/סְּבִיב֨וֹת יְרוּשָׁלִַ֜ם וּ/מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מִן הַ/שְּׁפֵלָ֤ה וּ/מִן הָ/הָר֙ וּ/מִן הַ/נֶּ֔גֶב מְבִאִ֛ים עוֹלָ֥ה וְ/זֶ֖בַח וּ/מִנְחָ֣ה וּ/לְבוֹנָ֑ה וּ/מְבִאֵ֥י תוֹדָ֖ה בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/026.yaml
  text: And they will come from the cities of Judah and from the areas around Jerusalem[a], and from the land of Benjamin, and from the lowland, and from the hill country, and from the Negeb, bringing burnt offerings and sacrifices, grain offerings and frankincense[c][b], and bringing thank offerings to the house of Yahweh.
translation:
  language: de
  text: Und sie werden aus den Städten Judas und aus der Umgebung Jerusalems kommen, aus dem Land Benjamin, aus der Niederung[a], aus dem Bergland und aus dem Negev[b], und sie werden Brandopfer und Schlachtopfer, Getreideopfer und Weihrauch sowie Dankopfer zum Haus Jahwes[c] bringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „die Schefela“; gemeint ist die niedriger gelegene judäische Hügellandschaft westlich des Berglands.
    reason: geografische Erläuterung
  - marker: b
    text: Der Negev ist die südliche Region Judas; das hebräische Wort kann auch „Süden“ bedeuten.
    reason: lexikalische Alternative und geografische Erläuterung
  - marker: c
    text: Das „Haus Jahwes“ ist hier der Tempel.
    reason: kulturelle Erläuterung
lexical_decisions:
- source_word: וּבָאוּ
  choice: Und sie werden … kommen
  rationale: Die Verbform setzt im prophetisch-bedingten Zusammenhang die Folge als zukünftig fort; „und“ bewahrt die hebräische Anknüpfung.
- source_word: מֵעָרֵי יְהוּדָה
  choice: aus den Städten Judas
  rationale: עָרִים bezeichnet Städte beziehungsweise Ortschaften; die knappe Wiedergabe ist im Deutschen natürlich.
- source_word: וּמִסְּבִיבוֹת יְרוּשָׁלִַם
  choice: aus der Umgebung Jerusalems
  rationale: סְבִיבוֹת meint die umliegenden Gebiete; „Umgebung“ gibt dies idiomatisch und präzise wieder.
- source_word: וּמֵאֶרֶץ בִּנְיָמִן
  choice: aus dem Land Benjamin
  rationale: אֶרֶץ bezeichnet hier das dem Stamm Benjamin zugeordnete Gebiet.
- source_word: הַשְּׁפֵלָה
  choice: die Niederung
  rationale: Der Ausdruck bezeichnet die Schefela, das westliche Hügelland beziehungsweise Vorland Judas. „Niederung“ übersetzt die geografische Bezeichnung verständlich; eine Fußnote nennt den Eigennamen.
- source_word: הָהָר
  choice: das Bergland
  rationale: In dieser regionalen Aufzählung bezeichnet der Ausdruck das judäische Bergland, nicht lediglich einen einzelnen Berg.
- source_word: הַנֶּגֶב
  choice: der Negev
  rationale: Hier liegt die geografische Bezeichnung der südlichen Region Judas vor; der etablierte Eigenname bewahrt diesen Bezug.
- source_word: מְבִאִים
  choice: Sie bringen
  rationale: Das Partizip beschreibt die begleitende Handlung der Kommenden. Ein neuer deutscher Satz hält die Aufzählung gut verständlich, ohne den sachlichen Zusammenhang zu lösen.
- source_word: עוֹלָה וְזֶבַח
  choice: Brandopfer und Schlachtopfer
  rationale: Die kultischen Singularformen stehen in der Aufzählung kollektiv. „Schlachtopfer“ unterscheidet זֶבַח vom Brandopfer.
- source_word: מִנְחָה וּלְבוֹנָה
  choice: Speisopfer und Weihrauch
  rationale: מִנְחָה bezeichnet im kultischen Zusammenhang das unblutige, gewöhnlich aus Getreide bestehende Speisopfer; לְבוֹנָה ist spezifisch Weihrauch.
- source_word: וּמְבִאֵי תוֹדָה
  choice: und bringen Dankopfer
  rationale: תּוֹדָה kann Dank beziehungsweise ein Dankopfer bezeichnen; im Rahmen der Opferliste ist „Dankopfer“ sachgerecht, während die erneute Form von בוא sprachlich sichtbar bleibt.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Kultbezeichnung bleibt erhalten; im Kontext ist damit der Tempel gemeint.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen JHWH. „Jahwe“ gibt ihn in der im Deutschen geläufigen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von תוֹדָה in der Opferliste
  choice: Dankopfer
  alternative: Dank
  rationale: Die Stellung neben anderen Opfergaben und das Verb „bringen“ sprechen hier für eine konkrete Opfergabe, ohne eine weitergehende kultische oder konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange hebräische Reihung wird zur besseren Verständlichkeit in zwei Sätze gegliedert. Kultische Fachbegriffe bleiben präzise, werden aber in heute geläufigen deutschen Formen wiedergegeben; geografische Eigennamen und mögliche Alternativen werden knapp erläutert.
