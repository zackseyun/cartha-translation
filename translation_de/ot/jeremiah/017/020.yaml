source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲ֠לֵי/הֶם שִׁמְע֨וּ דְבַר יְהוָ֜ה מַלְכֵ֤י יְהוּדָה֙ וְ/כָל יְהוּדָ֔ה וְ/כֹ֖ל יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם הַ/בָּאִ֖ים בַּ/שְּׁעָרִ֥ים הָ/אֵֽלֶּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/020.yaml
  text: And say to them[a], “Hear the word of Yahweh, you kings of Judah, and all Judah, and all the inhabitants of Jerusalem who enter through these gates.”
translation:
  language: de
  text: 'Und du sollst zu ihnen sagen: »Hört das Wort Jahwes[a], ihr Könige von Juda, ganz Juda und alle Bewohner Jerusalems, die durch diese Tore kommen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: Alternative traditionelle Wiedergabe des Gottesnamens.
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Und du sollst zu ihnen sagen
  rationale: Das mit וְ verbundene Qal-Perfekt setzt im Zusammenhang die prophetische Anweisung fort. Die deutsche Konstruktion mit »sollst« gibt diesen Auftragscharakter natürlich wieder.
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der maskuline Pluralimperativ fordert die gesamte angesprochene Gruppe zum aufmerksamen Hören auf und bewahrt die Prägnanz der prophetischen Aufforderung.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: »Wort« erhält die feste prophetische Wendung und ihr Gewicht; der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: מַלְכֵי יְהוּדָה
  choice: ihr Könige von Juda
  rationale: »Ihr« kennzeichnet im modernen Deutschen klar die direkte Anrede, ohne das altertümliche »o« zu verwenden.
- source_word: וְכָל יְהוּדָה
  choice: ganz Juda
  rationale: Die knappe metonymische Bezeichnung des Landes beziehungsweise seiner Bevölkerung bleibt erhalten, ohne erläuternd »das ganze Volk« einzufügen.
- source_word: וְכֹל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: und alle Bewohner Jerusalems
  rationale: Die substantivierte Partizipialwendung bezeichnet die in Jerusalem Wohnenden; »Bewohner« ist klar und würdevoll.
- source_word: הַבָּאִים בַּשְּׁעָרִים הָאֵלֶּה
  choice: die durch diese Tore kommen
  rationale: Das Partizip beschreibt diejenigen, die durch die bezeichneten Tore eintreten. »Durch … kommen« gibt die Bewegung mit ב idiomatisch wieder, ohne ein Ziel zu ergänzen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. »Jahwe« bewahrt es als Eigennamen; eine Fußnote nennt die verbreitete traditionelle Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird durch »ihr« kenntlich gemacht; die prophetische Befehlsfolge und die kompakte Reihung der Adressaten bleiben erhalten.
