id: JER.17.15
reference: Jeremiah 17:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנֵּה הֵ֕מָּה אֹמְרִ֖ים אֵלָ֑/י אַיֵּ֥ה דְבַר יְהוָ֖ה יָ֥בוֹא נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/015.yaml
  text: Look[a], they are saying to me, “Where is the word of Yahweh? Let it come now!”
translation:
  language: de
  text: 'Sieh, sie sagen zu mir: »Wo ist das Wort Jahwes[a]? Es soll doch kommen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Botschaft Jahwes«. Die hebräische Wendung ist die übliche prophetische Bezeichnung für ein göttliches Wort oder einen prophetischen Ausspruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sieh
  rationale: Die aufmerksamkeitslenkende Interjektion wird mit dem knappen, würdevollen und im modernen Deutsch verständlichen »Sieh« wiedergegeben.
- source_word: הֵמָּה אֹמְרִים
  choice: sie sagen
  rationale: Das selbstständige Pronomen und das Partizip bezeichnen hervorgehoben die Sprechenden und eine gegenwärtige beziehungsweise wiederholte Äußerung. »Sie sagen« bewahrt diese Offenheit, ohne die Wiederholung stärker festzulegen, als es die Form allein verlangt.
- source_word: אֵלָי
  choice: zu mir
  rationale: Die Präposition bezeichnet hier am unmittelbarsten die Richtung der Rede auf Jeremia hin. »Gegen mich« würde die feindselige Haltung stärker ausdeuten.
- source_word: אַיֵּה
  choice: Wo ist
  rationale: Die Orts- beziehungsweise Existenzfrage wird direkt wiedergegeben; im Zusammenhang hat sie den Klang einer spöttischen Herausforderung.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: Die geläufige prophetische Wendung bezeichnet eine göttliche Mitteilung oder einen prophetischen Ausspruch. »Wort« bewahrt die traditionelle Form und den Bezug auf das konkrete Reden Gottes.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der hebräische Gottesname wird im Deutschen in seiner gebräuchlichen wissenschaftlichen Form wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: יָבוֹא נָא
  choice: Es soll doch kommen
  rationale: Der Imperfekt hat hier auffordernden Charakter; נָא verstärkt im Kontext die herausfordernde, spöttische Forderung. Das deutsche »doch« vermittelt diesen Ton natürlicher als ein höfliches »bitte«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den persönlichen Gottesnamen. Seine Wiedergabe als »Jahwe« bewahrt den Namen, ohne ihn stillschweigend durch den Titel »der HERR« zu ersetzen.
- issue: Charakter von יָבוֹא als Aufforderung
  choice: Es soll doch kommen!
  alternative: Es wird kommen.
  rationale: Die Form ist in der direkten Rede am besten als herausfordernder Jussiv zu verstehen. Eine bloße Zukunftsaussage würde die spöttische Forderung der Sprecher verdecken.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. »Sieh« erhält den aufmerksamkeitslenkenden Auftakt; »doch« gibt den spöttisch-herausfordernden Ton wieder, ohne zusätzliche Polemik einzutragen.
