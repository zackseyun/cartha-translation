  text: קֹרֵ֤א דָגַר֙ וְ/לֹ֣א יָלָ֔ד עֹ֥שֶׂה עֹ֖שֶׁר וְ/לֹ֣א בְ/מִשְׁפָּ֑ט בַּ/חֲצִ֤י ימ/ו יַעַזְבֶ֔/נּוּ וּ/בְ/אַחֲרִית֖/וֹ יִהְיֶ֥ה נָבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/011.yaml
  text: 'Like a partridge that gathers a brood it did not hatch[a], so is one who makes wealth unjustly: in the middle of his days it will leave him, and in his end he will be a fool.'
translation:
  language: de
  text: 'Wie ein Rebhuhn, das Eier ausbrütet, die es nicht gelegt hat[a], so ist, wer Reichtum auf ungerechte Weise erwirbt: Mitten in seinen Tagen wird der Reichtum ihn verlassen, und an seinem Ende wird er als Tor dastehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie ein Rebhuhn, das Junge sammelt, die es nicht ausgebrütet hat.“ Welches Verhalten des Vogels dem Sprichwort zugrunde liegt, ist ungewiss. Gemeint ist, dass unrechtmäßig Angeeignetes nicht bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵא
  choice: Rebhuhn
  rationale: Im Zusammenhang mit Brüten und Legen bezeichnet das Wort traditionell einen Vogel, wahrscheinlich das Rebhuhn; die zoologische Bestimmung bleibt jedoch nicht völlig sicher.
- source_word: דָגַר
  choice: ausbrütet
  rationale: Das Verb bezeichnet das Brüten beziehungsweise Bebrüten. „Ausbrütet“ ergibt zusammen mit „nicht gelegt“ ein natürliches deutsches Vogelbild, ohne die genaue zoologische Vorstellung endgültig festzulegen.
- source_word: וְלֹא יָלָד
  choice: was es nicht gelegt hat
  rationale: Das hebräische Verb bedeutet grundsätzlich „gebären/hervorbringen“; bei Eiern ist im Deutschen „legen“ idiomatisch und entspricht der im Kontext vorausgesetzten Vogelmetapher.
- source_word: עֹשֶׂה עֹשֶׁר
  choice: wer Reichtum … erwirbt
  rationale: Wörtlich steht „Reichtum macht“. Im Deutschen bringt „Reichtum erwirbt“ den Vorgang natürlichen und klaren zum Ausdruck.
- source_word: וְלֹא בְמִשְׁפָּט
  choice: auf ungerechte Weise
  rationale: מִשְׁפָּט bezeichnet hier Recht beziehungsweise Gerechtigkeit. Die Formulierung bewahrt den ethisch-rechtlichen Sinn und die adverbiale Funktion.
- source_word: בַּחֲצִי יָמָיו
  choice: Mitten in seinen Tagen
  rationale: Die nahe Wiedergabe wahrt das poetische Bild einer noch nicht vollendeten Lebenszeit.
- source_word: יַעַזְבֶנּוּ
  choice: wird er ihn verlassen
  rationale: Das grammatische Subjekt des maskulinen Singularverbs ist am natürlichsten der zuvor genannte Reichtum; das Suffix verweist auf den Menschen. Im Deutschen machen „er“ und „ihn“ diese Beziehung sichtbar, wenn auch mit einer gewissen pronominalen Dichte.
- source_word: וּבְאַחֲרִיתוֹ
  choice: an seinem Ende
  rationale: Die Formulierung erhält den persönlichen Suffixbezug und bezeichnet das Ende seines Lebens beziehungsweise seines Weges.
- source_word: נָבָל
  choice: als Tor dastehen
  rationale: נָבָל bezeichnet moralisch und geistlich verwerfliche Torheit, nicht bloß mangelnde Intelligenz. „Als Tor dastehen“ gibt zudem das resultative יִהְיֶה idiomatisch wieder.
theological_decisions:
- issue: Deutung des Vogelbildes
  choice: Ein Vogel brütet etwas aus, das nicht von ihm selbst stammt; dies veranschaulicht unrecht erworbenen Reichtum, der seinem Besitzer nicht bleibt.
  alternative: Das Rebhuhn sammelt fremde Junge oder sitzt auf Eiern, die es nicht selbst gelegt hat.
  rationale: Die genaue antike Vorstellung vom Verhalten des Vogels ist unsicher. Der Haupttext bewahrt das Bild, während die Fußnote die sachlich möglichen Deutungen nennt, ohne eine umstrittene zoologische Erklärung zum theologischen Aussagekern zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst poetischen Wendungen („Mitten in seinen Tagen“, „an seinem Ende“). Das Bild bleibt knapp und sprichwortartig; die Unsicherheit bei דָגַר wird in der Fußnote offengelegt.
