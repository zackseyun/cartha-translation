base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/003.yaml
  text: My mountain in the field—your wealth[a], all your treasures[c][b], and your high places because of sin throughout all your territory—I will give as plunder.
translation:
  language: de
  text: Meinen Berg im freien Feld[a], dein Vermögen[b], alle deine Schätze und deine Höhenheiligtümer wegen der Sünde in deinem ganzen Gebiet[c] werde ich zur Beute geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die hebräische Wendung ist schwierig. Auch möglich: „O mein Berg im freien Feld!“ Mit dem Berg kann der Berg des HERRN, Zion beziehungsweise Jerusalem, gemeint sein; denkbar ist auch ein Bezug auf das Bergland.'
    reason: alternative_reading
  - marker: b
    text: „Vermögen“ kann auch mit „Stärke“ oder, hier weniger wahrscheinlich, mit „Heer“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „für die Sünde in deinem ganzen Gebiet“ oder „in Sünde in deinem ganzen Gebiet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָרִי בַּשָּׂדֶה
  choice: meinen Berg im offenen Land
  rationale: הֲרָרִי bedeutet am ehesten „mein Berg“; durch den Zusammenhang mit אֶתֵּן wird die vorangestellte Wendung als Objekt wiedergegeben. בַּשָּׂדֶה bezeichnet wörtlich das Feld, kann hier aber das offene Land meinen. Die bildhafte und syntaktische Schwierigkeit bleibt durch eine Fußnote sichtbar.
- source_word: חֵילְךָ
  choice: dein Vermögen
  rationale: חַיִל kann Stärke, Besitz oder Heeresmacht bezeichnen. Neben „alle deine Schätze“ und in Verbindung mit der Preisgabe als Beute ist die wirtschaftliche Bedeutung am wahrscheinlichsten.
- source_word: כָל אוֹצְרוֹתֶיךָ
  choice: alle deine Schätze
  rationale: אוֹצָר kann sowohl den Schatz als auch den Vorrats- oder Schatzraum bezeichnen. Als Gegenstand der Plünderung passt hier „Schätze“ am besten.
- source_word: לָבַז אֶתֵּן
  choice: werde ich zur Beute geben
  rationale: Die feste Gerichtswendung wird quellenah und in natürlichem Deutsch wiedergegeben; das Imperfekt bezeichnet hier eine angekündigte zukünftige Handlung.
- source_word: בָּמֹתֶיךָ
  choice: deine Höhen
  rationale: Gemeint sind kultisch genutzte Höhen. „Höhen“ ist knapp, traditionsnah und vermeidet eine ausdeutende Ergänzung im Haupttext.
- source_word: בְּחַטָּאת בְּכָל גְּבוּלֶיךָ
  choice: wegen der Sünde in deinem ganzen Gebiet
  rationale: Das erste בְּ wird kausal verstanden, das zweite lokal beziehungsweise distributiv. Die Formulierung wahrt den kollektiven Singular „Sünde“ und bezieht das gesamte Gebiet ein.
theological_decisions:
- issue: Bezug und Satzfunktion von „mein Berg im offenen Land“
  choice: Der Berg des HERRN, wahrscheinlich Zion/Jerusalem, wird als vorangestelltes Objekt der angekündigten Preisgabe verstanden.
  alternative: Die Wendung kann als Anrede („O mein Berg im offenen Land“) oder allgemeiner als Bezeichnung des Berglands verstanden werden.
  rationale: Der Possessivsuffix „mein“ und Jeremias Zionsthematik sprechen für den Berg des HERRN; die schwierige Syntax erlaubt jedoch keine restlose Sicherheit. Deshalb wird Zion nicht ausdrücklich in den Haupttext eingesetzt.
- issue: Verhältnis der Sünde zu den Höhen und zum ganzen Gebiet
  choice: „Wegen der Sünde“ wird als Begründung des Gerichts gelesen, während „in deinem ganzen Gebiet“ die räumliche Ausdehnung bezeichnet.
  alternative: Die Wendung kann auch „für die Sünde in deinem ganzen Gebiet“ oder „in Sünde in deinem ganzen Gebiet“ bedeuten und enger mit den Höhen verbunden werden.
  rationale: Die kausale Lesart ergibt im Gerichtswort einen klaren Sinn, ohne die grammatisch möglichen Alternativen zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Voranstellung der umfangreichen Objektgruppe bildet die markierte hebräische Wortfolge nach; „zur Beute geben“ hält den prophetischen Gerichtston fest. Die schwierige Berg-Wendung und die Mehrdeutigkeit der Präpositionalfügung werden nicht im Haupttext aufgelöst, sondern in den Fußnoten kenntlich gemacht.
