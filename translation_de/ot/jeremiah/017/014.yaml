source:
  edition: WLC
  text: רְפָאֵ֤/נִי יְהוָה֙ וְ/אֵ֣רָפֵ֔א הוֹשִׁיעֵ֖/נִי וְ/אִוָּשֵׁ֑עָה כִּ֥י תְהִלָּתִ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/014.yaml
  text: Heal me[a], O Yahweh, and I will be healed; save me, and I will be saved[b], for you are my praise.
translation:
  language: de
  text: Heile mich, Jahwe, so werde ich geheilt; rette mich, so werde ich gerettet, denn du bist mein Lob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „denn du bist der, den ich lobe.“ Wörtlich: „denn du bist mein Lob“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאֵנִי
  choice: Heile mich
  rationale: Der Imperativ von רפא mit Suffix der 1. Person Singular wird unmittelbar wiedergegeben. „Heilen“ bewahrt sowohl den körperlichen als auch den übertragenen Sinn.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen geläufige Wiedergabe des Gottesnamens bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- source_word: וְאֵרָפֵא
  choice: dann werde ich geheilt
  rationale: Die Form bezeichnet hier die erwartete Folge des göttlichen Handelns. „Dann“ macht diesen Zusammenhang in natürlichem Deutsch deutlich, ohne ihn als bloße Möglichkeit abzuschwächen.
- source_word: הוֹשִׁיעֵנִי
  choice: rette mich
  rationale: Das Hifil von ישׁע kann Rettung und Befreiung aus Not bezeichnen. „Rette mich“ erhält diese Bedeutungsbreite und entspricht dem Parallelismus zu „Heile mich“.
- source_word: וְאִוָּשֵׁעָה
  choice: dann werde ich gerettet
  rationale: Die passive Form greift das vorausgehende „rette mich“ auf. Die Wiederholung erhält den nachdrücklichen Parallelismus des Hebräischen.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet den Grund für die Bitte und das Vertrauen des Sprechers ein.
- source_word: תְהִלָּתִי
  choice: mein Lob
  rationale: Die knappe Nominalform wird formal bewahrt. Sie kann sowohl das Lob selbst als auch denjenigen bezeichnen, der Gegenstand und Grund dieses Lobes ist; eine Fußnote weist auf die idiomatische Alternative hin.
- source_word: אָתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen hebt „du“ hervor; im Deutschen ist für die prädikative Aussage ein Kopulaverb erforderlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen und ersetzt ihn nicht durch einen Titel.
- issue: Bedeutungsumfang von ישׁע
  choice: rette mich / werde ich gerettet
  alternative: befreie mich / werde ich befreit
  rationale: „Retten“ umfasst im Deutschen konkrete Befreiung aus Not ebenso wie die weiter reichende heilsgeschichtliche Bedeutung und legt den Vers nicht auf nur eine davon fest.
- issue: Prädikative Wendung תְהִלָּתִי אָתָּה
  choice: du bist mein Lob
  alternative: dich lobe ich / du bist der, den ich lobe
  rationale: Die Hauptfassung erhält die auffällige, theologisch offene Bildsprache des Hebräischen. Die Fußnote bietet eine idiomatischere Deutung, ohne sie zum alleinigen Sinn zu erklären.
translation_notes:
  register: Poetische Gebetssprache in modernem Standarddeutsch. Die parallele Satzstruktur und die Wiederholung von „heilen/geheilt“ sowie „retten/gerettet“ werden bewahrt. „Mein Lob“ bleibt bewusst knapp und bildhaft; die idiomatischere Lesart steht in der Fußnote.
