source:
  edition: WLC
  text: וְ/הָיָה֙ כְּ/עַרְעָ֣ר בָּֽ/עֲרָבָ֔ה וְ/לֹ֥א יִרְאֶ֖ה כִּי יָב֣וֹא ט֑וֹב וְ/שָׁכַ֤ן חֲרֵרִים֙ בַּ/מִּדְבָּ֔ר אֶ֥רֶץ מְלֵחָ֖ה וְ/לֹ֥א תֵשֵֽׁב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/006.yaml
  text: He will be like a shrub in the desert[a], and he will not see when good comes. He will dwell in parched places in the wilderness[c][b], in a salt land that is not inhabited.
translation:
  language: de
  text: Er wird wie ein Strauch[a] in der Steppe[b] sein und nicht sehen, wenn Gutes kommt.[c] Er wird an dürren Orten in der Wüste wohnen, in einem salzigen Land, in dem niemand lebt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „wie ein Wacholder“, „wie eine Tamariske“ oder „wie ein kahler Strauch“; welche Pflanze das hebräische Wort genau bezeichnet, ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Oder „in der Araba“, falls die konkrete geografische Region gemeint ist und nicht allgemein trockenes Steppenland.
    reason: alternative_reading
  - marker: c
    text: 'Oder „und nicht wahrnehmen, wenn Wohlergehen kommt“. Wörtlich heißt es: „und nicht sehen, wenn Gutes kommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַרְעָר
  choice: wie ein Strauch
  rationale: Das hebräische Wort bezeichnet offenbar eine Pflanze der Wüste, doch ihre genaue botanische Bestimmung ist unsicher. „Strauch“ bewahrt das Bild, ohne eine bestimmte Art vorauszusetzen.
- source_word: בָּעֲרָבָה
  choice: in der Steppe
  rationale: עֲרָבָה kann allgemein trockenes Steppen- oder Wüstenland und möglicherweise auch die geografische Araba bezeichnen. „Steppe“ gibt hier die karge Umgebung natürlich wieder und unterscheidet den Ausdruck von מִדְבָּר im folgenden Satz.
- source_word: וְלֹא יִרְאֶה כִּי יָבוֹא טוֹב
  choice: und nicht sehen, wenn Gutes kommt
  rationale: Die Formulierung hält am hebräischen Bild des Sehens fest und lässt offen, ob die Person das Gute nicht wahrnimmt oder nicht erlebt beziehungsweise keinen Anteil daran hat.
- source_word: וְשָׁכַן
  choice: Er wird … wohnen
  rationale: שׁכן bedeutet „wohnen“ oder „sich aufhalten“. „Wohnen“ passt zum poetisch-prophetischen Register und zu den folgenden Ortsangaben.
- source_word: חֲרֵרִים
  choice: an dürren Orten
  rationale: Das seltene Wort bezeichnet ausgedörrte, versengte oder kahle Gegenden. „Dürre Orte“ vermittelt die aride Trostlosigkeit, ohne die genaue Geländeart festzulegen.
- source_word: בַּמִּדְבָּר
  choice: in der Wüste
  rationale: מִדְבָּר bezeichnet unbewohntes Wildnis- oder Wüstenland. „Wüste“ ist im Deutschen hier die klare und natürliche Entsprechung.
- source_word: אֶרֶץ מְלֵחָה
  choice: in einem salzigen Land
  rationale: Die Wendung beschreibt durch Salz geprägten und dadurch unfruchtbaren Boden. „Salziges Land“ bewahrt das konkrete Bild.
- source_word: וְלֹא תֵשֵׁב
  choice: in dem niemand lebt
  rationale: Das feminine Verb bezieht sich auf „Land“ und besagt, dass es nicht bewohnt wird. Die relative Formulierung ist im modernen Deutschen natürlich.
theological_decisions: []
