source:
  edition: WLC
  text: מִקְוֵ֤ה יִשְׂרָאֵל֙ יְהוָ֔ה כָּל עֹזְבֶ֖י/ךָ יֵבֹ֑שׁוּ יסור/י בָּ/אָ֣רֶץ יִכָּתֵ֔בוּ כִּ֥י עָזְב֛וּ מְק֥וֹר מַֽיִם חַיִּ֖ים אֶת יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/013.yaml
  text: O Yahweh[a], the hope of Israel, all who forsake you will be put to shame; those who turn away from you will be written in the earth, because they have forsaken Yahweh[c][b], the fountain of living waters.
translation:
  language: de
  text: Jahwe, Hoffnung Israels! Alle, die dich verlassen, werden beschämt. Die sich von mir abwenden[a], werden in die Erde geschrieben, denn sie haben Jahwe verlassen, die Quelle lebendigen Wassers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Text ist hier schwierig. Möglich ist auch: „Die sich von dir abwenden, werden in die Erde geschrieben.“ „In die Erde geschrieben“ kann das Bild einer vergänglichen Eintragung in den Boden ausdrücken; auch „im Land“ ist möglich.'
    reason: textual_variant_and_lexical_alternative
  - marker: b
    text: „Lebendiges Wasser“ bezeichnet wörtlich frisches, fließendes Wasser aus einer Quelle, nicht stehendes Wasser.
    reason: cultural_note
lexical_decisions:
- source_word: מִקְוֵה
  choice: Hoffnung
  rationale: Im Titel „Hoffnung Israels“ bezeichnet das Substantiv bildlich den Grund oder Gegenstand der Hoffnung, nicht eine Ansammlung beziehungsweise ein Wasserbecken.
- source_word: יְהוָה
  choice: HERR
  rationale: Die im modernen deutschen Bibelgebrauch etablierte Wiedergabe des Tetragramms als „HERR“ wahrt den Gottesnamen als besonders gekennzeichnete Anrede, ohne eine unsichere Aussprache in den Haupttext einzutragen.
- source_word: עֹזְבֶיךָ
  choice: die dich verlassen
  rationale: Die substantivisch gebrauchte Partizipialform bezeichnet Menschen, deren Handeln im Verlassen Gottes besteht; „verlassen“ ist natürlich und bewahrt die Beziehungsaussage.
- source_word: יֵבֹשׁוּ
  choice: werden beschämt werden
  rationale: Die Form bezeichnet hier die künftig eintretende Beschämung beziehungsweise das Scheitern derer, die Gott verlassen.
- source_word: יסורי
  choice: die sich von mir abwenden
  rationale: Die schwierige masoretische Überlieferung wird mit der ersten Person wiedergegeben. Dadurch bleibt der auffällige Wechsel von „dich“ zu „mir“ erhalten, statt ihn stillschweigend anzugleichen.
- source_word: בארץ
  choice: in die Erde
  rationale: „Erde“ bewahrt das Bild einer vergänglichen Eintragung in den Boden; „Land“ könnte vorrangig territorial verstanden werden. Die Präposition kann im Deutschen bei „schreiben“ idiomatisch mit „in“ plus Akkusativ wiedergegeben werden.
- source_word: יִכָּתֵבוּ
  choice: werden geschrieben
  rationale: Die passive Verbform und das konkrete Bild des Schreibens werden unmittelbar bewahrt.
- source_word: מְקוֹר מַיִם חַיִּים
  choice: die Quelle lebendigen Wassers
  rationale: „Quelle“ gibt den Ursprung frischen, fließenden Wassers treffend wieder. Der deutsche Kollektivsingular „Wasser“ ist idiomatisch, während „lebendig“ die wörtliche und theologisch bedeutsame Metapher erhält.
theological_decisions:
- issue: Wechsel der Person in „die sich von mir abwenden“
  choice: Die erste Person „von mir“ bleibt im Haupttext erhalten.
  alternative: „die sich von dir abwenden“
  rationale: Der hebräische Text ist an dieser Stelle schwierig, doch die überlieferte erste Person darf nicht allein zur Harmonisierung mit der vorausgehenden Anrede in die zweite Person geändert werden. Die Übersetzung bewahrt die textliche und sprecherbezogene Spannung.
- issue: Wiedergabe des Gottesnamens
  choice: HERR
  alternative: Jahwe
  rationale: „HERR“ ist die traditionelle, weithin verständliche deutsche Kennzeichnung des Tetragramms. Die Alternative wird in einer Fußnote transparent gemacht, damit der Eigenname nicht als bloßer Titel missverstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter poetischer Anrede. Der auffällige Personenwechsel wird nicht geglättet. Die Metaphern „in die Erde geschrieben“ und „Quelle lebendigen Wassers“ bleiben anschaulich erhalten.
