  variant: modern standard German
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִשָּׁמְר֖וּ בְּ/נַפְשֽׁוֹתֵי/כֶ֑ם וְ/אַל תִּשְׂא֤וּ מַשָּׂא֙ בְּ/י֣וֹם הַ/שַּׁבָּ֔ת וַ/הֲבֵאתֶ֖ם בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/021.yaml
  text: 'Thus says Yahweh: Take care for yourselves[b][a], and do not carry a load on the Sabbath day or bring it in through the gates of Jerusalem.'
translation:
  language: de
  text: 'So spricht Jahwe: Achtet auf euch selbst[a]! Tragt am Sabbattag keine Last[b] und bringt sie nicht durch die Tore Jerusalems hinein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Hütet euch hinsichtlich eures Lebens«. Das hebräische Wort kann sowohl »Leben« als auch die eigene Person bezeichnen; gemeint ist eine eindringliche Aufforderung, sorgfältig auf sich selbst zu achten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Bürde«. Im Zusammenhang ist wahrscheinlich etwas gemeint, das am Sabbat getragen oder befördert wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in natürlichem, würdevollem Deutsch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הִשָּׁמְרוּ בְּנַפְשׁוֹתֵיכֶם
  choice: Nehmt euch um eures Lebens willen in Acht
  rationale: Die Formulierung gibt sowohl den nachdrücklichen Aufruf zur Wachsamkeit als auch נֶפֶשׁ im Sinn von Leben beziehungsweise eigener Person wieder, ohne im Deutschen irreführend von den »Seelen« zu sprechen.
- source_word: וְאַל תִּשְׂאוּ
  choice: Tragt ... keine
  rationale: נשׂא bezeichnet zusammen mit מַשָּׂא das Tragen beziehungsweise Befördern einer konkreten Last; die deutsche Verneinung mit »keine« ist idiomatisch.
- source_word: מַשָּׂא
  choice: Last
  rationale: »Last« bewahrt den konkreten Sinn eines getragenen oder transportierten Gegenstands, lässt aber die lexikalische Breite des hebräischen Wortes bestehen.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: Die ausdrückliche Nennung von יוֹם wird beibehalten; »Sabbattag« ist klares, gegenwärtiges Standarddeutsch.
- source_word: וַהֲבֵאתֶם
  choice: und bringt sie nicht ... hinein
  rationale: Der zweite, durch waw angeschlossene Vorgang steht weiterhin im Geltungsbereich des Verbots. Das Pronomen greift die zuvor genannte Last auf, und »hinein« macht die Bewegungsrichtung deutlich.
- source_word: בְּשַׁעֲרֵי יְרוּשָׁלִָם
  choice: durch die Tore Jerusalems
  rationale: Gemeint ist das Hineinbringen in die Stadt auf dem Weg durch ihre Tore.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Tetragrammaton als Gottesnamen. »Jahwe« bewahrt in deutscher Form den Charakter eines Eigennamens, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bedeutung von בְּנַפְשׁוֹתֵיכֶם
  choice: um eures Lebens willen
  alternative: bei eurem Leben / hinsichtlich eurer selbst
  rationale: נֶפֶשׁ kann hier Leben oder eigene Person bezeichnen. Die Übersetzung wahrt den Ernst der Warnung, während die Fußnote die idiomatische Mehrdeutigkeit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit dem traditionellen prophetischen Sprachrhythmus. Der Satz bleibt unmittelbar und verständlich; unnötige Archaismen sowie eine konfessionelle Deutung des Sabbatgebots werden vermieden.
