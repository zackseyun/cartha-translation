  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/הָיָ֞ה כְּ/עֵ֣ץ שָׁת֣וּל עַל מַ֗יִם וְ/עַל יוּבַל֙ יְשַׁלַּ֣ח שָֽׁרָשָׁ֔י/ו וְ/לֹ֤א ירא כִּֽי יָבֹ֣א חֹ֔ם וְ/הָיָ֥ה עָלֵ֖/הוּ רַֽעֲנָ֑ן וּ/בִ/שְׁנַ֤ת בַּצֹּ֨רֶת֙ לֹ֣א יִדְאָ֔ג וְ/לֹ֥א יָמִ֖ישׁ מֵ/עֲשׂ֥וֹת פֶּֽרִי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/008.yaml
  text: He will be like a tree planted by water[a], that sends out its roots by a stream; it does not fear when heat comes, and its leaf remains green. In a year of drought it is not anxious[b], and it does not cease from bearing fruit.
translation:
  language: de
  text: Er wird sein wie ein Baum, der am Wasser gepflanzt ist und seine Wurzeln zum Wasserlauf hin ausstreckt.[a] Er fürchtet sich nicht, wenn die Hitze kommt; sein Laub bleibt frisch und grün.[b] In einem Dürrejahr sorgt er sich nicht und hört nicht auf, Frucht zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einem Bach“ oder „zu einem Kanal hin“. Das hebräische Wort kann einen natürlichen oder künstlichen Wasserlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Eigenschaftswort verbindet die Vorstellungen von Frische, kräftigem Gedeihen und sattem Grün.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעֵץ שָׁתוּל
  choice: wie ein Baum, der … gepflanzt ist
  rationale: Die Vergleichspartikel wird als natürliches deutsches Gleichnis wiedergegeben; das passive Partizip bezeichnet einen bewusst gesetzten Baum.
- source_word: עַל מַיִם
  choice: am Wasser
  rationale: Die räumliche Bedeutung von עַל bezeichnet hier die Nähe zur Wasserquelle; „am Wasser“ ist idiomatisch und bewahrt den Bildcharakter.
- source_word: יוּבַל
  choice: Wasserlauf
  rationale: Das Wort bezeichnet einen fließenden Wasserlauf beziehungsweise einen Kanal. „Wasserlauf“ hält die mögliche natürliche oder künstliche Ausprägung offen.
- source_word: יְשַׁלַּח שָׁרָשָׁיו
  choice: seine Wurzeln … hin ausstreckt
  rationale: Der Piel von שׁלח beschreibt hier das Ausbreiten der Wurzeln. „Ausstrecken“ gibt das Bild im Deutschen anschaulich wieder.
- source_word: לֹא ירא
  choice: Er fürchtet sich nicht
  rationale: Die im Hebräischen personifizierende Sprache des Baumes bleibt erhalten. Der masoretische Konsonantentext ירא wird kontextgemäß als Verb „fürchten“ verstanden.
- source_word: כִּי יָבֹא חֹם
  choice: wenn die Hitze kommt
  rationale: כִּי ist im Zusammenhang temporal aufzufassen; die Formulierung folgt knapp und natürlich der hebräischen Bildsprache.
- source_word: עָלֵהוּ רַעֲנָן
  choice: sein Laub bleibt frisch und grün
  rationale: רַעֲנָן umfasst Frische, üppiges Gedeihen und Grün. „Bleibt“ macht die im Kontext bestehende Widerstandskraft deutlich, ohne eine neue Aussage einzuführen.
- source_word: וּבִשְׁנַת בַּצֹּרֶת
  choice: In einem Dürrejahr
  rationale: Die konstruktgebundene Wendung wird im Deutschen idiomatisch und zugleich sprichwortartig allgemein wiedergegeben.
- source_word: לֹא יִדְאָג
  choice: sorgt er sich nicht
  rationale: דאג bezeichnet beunruhigte, ängstliche Sorge. Die Formulierung ist modernes, würdevolles Deutsch und wahrt die Personifikation.
- source_word: לֹא יָמִישׁ מֵעֲשׂוֹת פֶּרִי
  choice: hört nicht auf, Frucht zu tragen
  rationale: Die Konstruktion mit מן und Infinitiv bezeichnet das Nichtablassen beziehungsweise Nichtaufhören einer Tätigkeit. Die deutsche Wendung ist klar und quellennah.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Stil. Die Personifikation des Baumes sowie die parallelen Aussagen über Furcht, Sorge und Fruchttragen bleiben erhalten. Die maskulinen Pronomen greifen das grammatische Geschlecht von „Baum“ auf.
