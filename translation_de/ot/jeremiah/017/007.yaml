source:
  edition: WLC
  text: בָּר֣וּךְ הַ/גֶּ֔בֶר אֲשֶׁ֥ר יִבְטַ֖ח בַּֽ/יהוָ֑ה וְ/הָיָ֥ה יְהוָ֖ה מִבְטַחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/007.yaml
  text: Blessed is the man who trusts in Yahweh[b][a], and whose trust is Yahweh.
translation:
  language: de
  text: Gesegnet ist der Mann, der auf Jahwe vertraut und dessen Zuversicht Jahwe ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »und Jahwe der Grund seines Vertrauens ist« oder »und Jahwe seine Zuflucht sein wird«. Das hebräische Wort kann die Zuversicht selbst oder das bezeichnen, worauf sie sich stützt; die Verbform kann einen Zustand oder dessen Ergebnis ausdrücken.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Gesegnet
  rationale: Das passive Partizip beziehungsweise Adjektiv bezeichnet einen von Gott gesegneten Menschen; »gesegnet« bewahrt das theologische Gewicht besser als das stärker subjektive »glücklich«.
- source_word: הַגֶּבֶר
  choice: der Mann
  rationale: Das hebräische Wort ist maskulin Singular und wird hier sprichwortartig beziehungsweise stellvertretend gebraucht. Die konkrete Form des Ausgangstextes bleibt erhalten.
- source_word: יִבְטַח בַּיהוָה
  choice: auf Jahwe vertraut
  rationale: בטח bezeichnet hier das Setzen von Vertrauen auf jemanden; im Deutschen ist »auf Jahwe vertrauen« die natürliche Fügung.
- source_word: וְהָיָה
  choice: und … ist
  rationale: Die Form mit היה beschreibt im Zusammenhang den bestehenden beziehungsweise daraus hervorgehenden Zustand. Das Präsens passt zur allgemeinen Aussage des Segensspruchs; eine zukünftige Wiedergabe bleibt als Möglichkeit in der Fußnote erhalten.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als »Jahwe« wiedergegeben und damit als Eigenname erkennbar gehalten.
- source_word: מִבְטַחוֹ
  choice: dessen Zuversicht
  rationale: Das Substantiv aus derselben Wurzel wie »vertraut« kann sowohl die Zuversicht als auch deren Grundlage oder Gegenstand bezeichnen. »Zuversicht« ergibt einen würdigen deutschen Satz und bewahrt die Verbindung zum vorangehenden Vertrauen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt den Tetragrammaton ausdrücklich. »Jahwe« bewahrt den Charakter als offenbarter Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von מִבְטַחוֹ
  choice: dessen Zuversicht Jahwe ist
  alternative: Jahwe seine Zuflucht / der Grund seines Vertrauens ist
  rationale: Die Formulierung wahrt die enge Wortbeziehung zu בטח und zugleich die theologische Spannung, dass Jahwe nicht nur der Angesprochene, sondern auch Inhalt und Grund des Vertrauens ist. Die gegenständliche Bedeutung des Nomens wird in der Fußnote ausgewiesen.
- issue: Zeit- oder Zustandswert von וְהָיָה
  choice: ist
  alternative: wird sein
  rationale: Im Segensspruch ist eine allgemeine Zustandsaussage naheliegend. Da die hebräische Form auch resultativ oder zukünftig verstanden werden kann, wird diese Möglichkeit nicht ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der knappen Form eines Segensspruchs. Die Wiederholung des Gottesnamens und die maskuline Singularform des Hebräischen bleiben erhalten; die deutsche Relativkonstruktion sorgt für einen natürlichen Satzfluss.
