  text: כֹּה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָלֹ֤ךְ וְ/עָֽמַדְתָּ֙ בְּ/שַׁ֣עַר בְּנֵֽי עם אֲשֶׁ֨ר יָבֹ֤אוּ ב/וֹ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֖ר יֵ֣צְאוּ ב֑/וֹ וּ/בְ/כֹ֖ל שַׁעֲרֵ֥י יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/019.yaml
  text: 'Thus Yahweh said to me: Go and stand in the gate of the people[a], by which the kings of Judah enter and by which they go out, and in all the gates of Jerusalem.'
translation:
  language: de
  text: 'So sprach Jahwe zu mir: Geh und stell dich am Tor der Leute[a], durch das die Könige von Juda einziehen und durch das sie hinausgehen, und an allen Toren Jerusalems.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: »Tor der Söhne des Volkes«; möglicherweise die Bezeichnung eines bestimmten Tores, oft als »Volkstor« verstanden.'
    reason: Die hebräische Bezeichnung ist ungewöhnlich und lässt sowohl eine nähere Beschreibung als auch einen festen Tornamen zu.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So sprach
  rationale: Bewahrt die knappe prophetische Botenformel und klingt im Deutschen würdig und natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: הָלֹךְ וְעָמַדְתָּ
  choice: Geh und stell dich
  rationale: Der Infinitivus absolutus mit der finiten Verbform hat hier auffordernde Kraft; die deutsche Fassung gibt die zweigliedrige Anweisung direkt wieder.
- source_word: בְּשַׁעַר בְּנֵי עָם
  choice: in das Tor der Leute
  rationale: Die schwierige Verbindung bedeutet wörtlich etwa »Tor der Söhne des Volkes«. »Tor der Leute« bleibt nahe am Wortlaut, ohne eine unsichere Identifikation als festen Tornamen vorauszusetzen.
- source_word: אֲשֶׁר יָבֹאוּ בוֹ ... וַאֲשֶׁר יֵצְאוּ בוֹ
  choice: durch das ... einziehen und durch das sie hinausgehen
  rationale: Das wiederholte בוֹ bezeichnet das Tor als Weg des Hinein- und Hinausgehens; die Wiederholung der Relativkonstruktion wird bewahrt.
- source_word: מַלְכֵי יְהוּדָה
  choice: die Könige von Juda
  rationale: Natürliche deutsche Wiedergabe der hebräischen Status-constructus-Verbindung.
- source_word: וּבְכֹל שַׁעֲרֵי יְרוּשָׁלִָם
  choice: und in alle Tore Jerusalems
  rationale: Die Präposition בְּ steht unter der fortwirkenden Bewegungsaufforderung »Geh und stell dich«; daher ist im Deutschen der Akkusativ idiomatisch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet ausdrücklich das Tetragramm; die Transliteration bewahrt den Charakter als Gottesname.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Redeweise. Die ungewöhnliche Torbezeichnung wird im Text verständlich wiedergegeben, ihre echte lexikalische Unsicherheit jedoch in der Fußnote offengehalten.
