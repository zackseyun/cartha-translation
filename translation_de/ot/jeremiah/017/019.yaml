    text: 'Hebräisch: »Tor der Söhne des Volkes«; möglicherweise die Bezeichnung eines bestimmten Tores, oft als »Volkstor« verstanden.'
    reason: Die hebräische Bezeichnung ist ungewöhnlich und lässt sowohl eine nähere Beschreibung als auch einen festen Tornamen zu.
  revision_rationale: Die Revision korrigiert die beiden deutschen Richtungsangaben zu den vom Hebräischen geforderten Ortsangaben. Die vorsichtige Wiedergabe der unsicheren Torbezeichnung, der Name Jahwe und die übrige Satzstruktur bleiben erhalten.
