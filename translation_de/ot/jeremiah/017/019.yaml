review_pass:
  verdict: revise
  source_fidelity: 'Die Ortspräposition בְּ verlangt hier eine statische Ortsangabe: Jeremia soll am bzw. im Tor stehen. Die Fassung „in das Tor“ setzt dagegen eine nicht im Hebräischen ausgedrückte Bewegungsrichtung. Auch der abschließende Ausdruck bezeichnet den Standort an sämtlichen Toren, nicht eine Bewegung „in alle Tore“. Die schwierige Bezeichnung שַׁעַר בְּנֵי עָם wird mit „Tor der Leute“ vorsichtig wiedergegeben und durch die Fußnote transparent gehalten.'
  naturalness: „Geh und stell dich am Tor ... und an allen Toren Jerusalems“ ist modernes, verständliches Standarddeutsch und gibt die syntaktische Erweiterung des Auftrags idiomatisch wieder. „So sprach Jahwe“ ist für prophetische Gottesrede ein angemessen knapper, gehobener Registerton.
  terminology: „Jahwe“ gibt den Gottesnamen wieder; „Könige von Juda“ ist sachgerecht. Die Fußnote wahrt die lexikalische und mögliche onomastische Unsicherheit der ungewöhnlichen hebräischen Torbezeichnung, ohne eine Identifikation festzulegen.
  issues:
  - severity: medium
    issue: „stell dich in das Tor“
    rationale: „In das“ ist im Deutschen direktional und passt nicht zu עָמַד mit בְּ, das den Ort des Stehens bezeichnet. Erforderlich ist „am Tor“ (alternativ „im Tor“).
  - severity: medium
    issue: „und in alle Tore Jerusalems“
    rationale: Der hebräische Ausdruck וּבְכֹל שַׁעֲרֵי ירושלים ist ebenfalls lokal. Die deutsche Akkusativform erweckt den Eindruck, Jeremia solle sich in die Tore hineinbewegen; „an allen Toren Jerusalems“ gibt den Sinn korrekt wieder.
  revised_text: 'So sprach Jahwe zu mir: Geh und stell dich am Tor der Leute[a], durch das die Könige von Juda einziehen und durch das sie hinausgehen, und an allen Toren Jerusalems.'
