  variant: modern standard German
source:
  edition: WLC
  text: וְ/שָׁמַטְתָּ֗ה וּ/בְ/ךָ֙ מִ/נַּחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ֔/ךְ וְ/הַעֲבַדְתִּ֨י/ךָ֙ אֶת אֹ֣יְבֶ֔י/ךָ בָּ/אָ֖רֶץ אֲשֶׁ֣ר לֹֽא יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קְדַחְתֶּ֥ם בְּ/אַפִּ֖/י עַד עוֹלָ֥ם תּוּקָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/004.yaml
  text: And you[a] yourself will let go of your inheritance that I gave you, and I will make you serve your enemies in a land that you have not known; for you have kindled a fire in my anger[d][c][b]—it will burn forever.
translation:
  language: de
  text: Du selbst[a] wirst dein Erbteil, das ich dir gegeben habe, preisgeben[b], und ich werde dich deinen Feinden dienen lassen in einem Land, das du nicht gekannt hast. Denn ihr[c] habt in meinem Zorn[d] ein Feuer entfacht; es wird für immer[e] brennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch dich selbst“; die hebräische Wendung kann die Anrede hervorheben oder ausdrücken, dass dies durch den Angeredeten selbst beziehungsweise aus eigener Schuld geschieht.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „loslassen“ oder „fahren lassen“. Das hebräische Verb bezeichnet ein Freigeben, Fallenlassen oder Aufgeben.'
    reason: lexical_alternative
  - marker: c
    text: Das Hebräische wechselt hier vom Singular „du“ zum Plural „ihr“ – möglicherweise von Juda als personifizierter Einheit zum Volk als Ganzem.
    reason: alternative_reading
  - marker: d
    text: 'Wörtlich: „in meiner Nase“; dies ist eine hebräische Ausdrucksweise für Zorn.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: „auf unabsehbare Zeit“ beziehungsweise „dauernd“. Das hebräische Wort kann je nach Zusammenhang eine ewige oder eine nicht näher begrenzte Dauer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַטְתָּה
  choice: wirst … preisgeben
  rationale: שׁמט bezeichnet ein Loslassen, Fallenlassen oder Freigeben. „Preisgeben“ gibt im Gerichtszusammenhang verständlich wieder, dass Juda sein von Gott gegebenes Erbteil aufgeben muss, ohne den Vorgang lediglich als unbeabsichtigten Verlust darzustellen.
- source_word: וּבְךָ
  choice: du selbst
  rationale: Die schwierige Wendung wird als Verstärkung der direkten Anrede verstanden. „Du selbst“ ist natürliches Deutsch; die ebenfalls mögliche instrumentale oder kausale Nuance („durch dich selbst“, also aus eigener Schuld) wird in der Fußnote offengehalten.
- source_word: מִנַּחֲלָתְךָ
  choice: dein Erbteil
  rationale: נחלה bezeichnet einen ererbten beziehungsweise zugeteilten Besitz und hier besonders das von Gott gegebene Land. „Erbteil“ bewahrt sowohl den territorialen als auch den heilsgeschichtlichen Klang.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: das ich dir gegeben habe
  rationale: Die schlichte Relativkonstruktion und נתן werden direkt und idiomatisch wiedergegeben.
- source_word: וְהַעֲבַדְתִּיךָ אֶת אֹיְבֶיךָ
  choice: ich werde dich deinen Feinden dienen lassen
  rationale: 'Die Hifilform von עבד ist kausativ: Gott lässt den Angeredeten seinen Feinden dienen. Die Formulierung erhält diese Kausalität und vermeidet die stärkere, aber nicht zwingende Festlegung auf „versklaven“.'
- source_word: בָּאָרֶץ אֲשֶׁר לֹא יָדָעְתָּ
  choice: in einem Land, das du nicht gekannt hast
  rationale: ידע bezeichnet hier Vertrautheit aus Erfahrung. Das Perfekt bewahrt den rückblickenden Aspekt des hebräischen Perfekts und kennzeichnet das Exilsland als bislang unbekannt.
- source_word: אֵשׁ קְדַחְתֶּם
  choice: ihr habt … ein Feuer entfacht
  rationale: קדח beschreibt das Entzünden eines Feuers. Das deutsche „ihr“ macht den Wechsel vom Singular zum Plural sichtbar.
- source_word: בְּאַפִּי
  choice: in meinem Zorn
  rationale: אַף bedeutet wörtlich „Nase“ oder „Nasenflügel“, ist hier jedoch die übliche hebräische Ausdrucksweise für Zorn. „In meinem Zorn“ wahrt die ungewöhnliche Präposition, ohne den deutschen Text durch eine unverständliche Körpermetapher zu verfremden.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: עוֹלָם bezeichnet eine dauernde, unabsehbare oder ewige Zeitspanne. „Für immer“ gibt die volle Wucht der prophetischen Gerichtsankündigung wieder; die mögliche kontextuelle Offenheit wird in einer Fußnote genannt.
- source_word: תּוּקָד
  choice: es wird … brennen
  rationale: Die passive Imperfektform von יקד bezieht sich auf das Feuer. Im Deutschen drückt „wird brennen“ den fortdauernden Zustand idiomatisch aus; „wird angefacht werden“ wäre formaler, aber in diesem Zusammenhang schwerfällig.
theological_decisions:
- issue: Wechsel von der zweiten Person Singular zur zweiten Person Plural
  choice: Der Singular bleibt in der Anrede und in den Gerichtsfolgen erhalten; bei קְדַחְתֶּם steht ausdrücklich der Plural „ihr“.
  alternative: Den ganzen Vers einheitlich im Singular oder Plural formulieren.
  rationale: Der masoretische Text wechselt erkennbar die Zahl, möglicherweise von Juda als personifizierter Einheit zum Volk als Gesamtheit. Eine Angleichung würde diese prophetische Spannung beseitigen.
- issue: Bedeutung von וּבְךָ am Versanfang
  choice: Als Hervorhebung „du selbst“, mit Hinweis auf die instrumentale beziehungsweise kausale Alternative.
  alternative: „durch dich selbst“ oder deutender „durch eigene Schuld“.
  rationale: Die hebräische Wendung ist syntaktisch schwierig. Die Hauptfassung folgt der emphatischen Deutung, während die Fußnote die mögliche Aussage persönlicher Verantwortlichkeit wahrt, ohne sie dogmatisch festzuschreiben.
- issue: Reichweite von עַד עוֹלָם in der Gerichtsankündigung
  choice: „für immer“ im Haupttext.
  alternative: „auf unabsehbare Zeit“, „dauernd“ oder „für lange Zeit“.
  rationale: Die Wendung trägt hier eine offene, nachdrückliche Dauerbedeutung. Die starke Formulierung soll im Haupttext nicht abgeschwächt werden; ihre lexikalische Spannweite wird transparent angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Direktheit. „Erbteil“ bewahrt den land- und bundestheologischen Gehalt, während „preisgeben“ die konkrete Loslass-Metapher verständlich vermittelt. Der auffällige Numeruswechsel wird nicht geglättet; schwer verständliche Hebraismen werden im Haupttext idiomatisch und in den Fußnoten transparent wiedergegeben.
