source:
  edition: WLC
  text: עָקֹ֥ב הַ/לֵּ֛ב מִ/כֹּ֖ל וְ/אָנֻ֣שׁ ה֑וּא מִ֖י יֵדָעֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/009.yaml
  text: The heart is more deceitful than anything else[c][b][a], and desperately sick—who can know it?
translation:
  language: de
  text: Trügerischer als alles andere ist das Herz[a][c], und schwer krank ist es[b] – wer kann es erkennen?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Das Herz ist trügerisch über alles hinaus.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unheilbar“. Das hebräische Wort bezeichnet einen äußerst schweren oder nicht mehr heilbaren Zustand.'
    reason: lexical_alternative
  - marker: c
    text: Mit „Herz“ ist im Hebräischen der innere Mensch gemeint, einschließlich Denken, Wollen und Begehren, nicht nur das Gefühlsleben.
    reason: cultural_note
lexical_decisions:
- source_word: עָקֹב
  choice: trügerischer
  rationale: Das Adjektiv bezeichnet etwas Arglistiges, Verschlagenes oder Irreführendes. „Trügerisch“ bewahrt den moralischen Sinn und bildet zusammen mit מִכֹּל einen natürlichen deutschen Vergleich.
- source_word: הַלֵּב
  choice: das Herz
  rationale: לֵב meint im Hebräischen den inneren Menschen einschließlich Denken, Wollen und Begehren. „Herz“ bewahrt das biblische Bild; eine Fußnote erläutert den weiteren Bedeutungsumfang.
- source_word: מִכֹּל
  choice: als alles andere
  rationale: Die Verbindung mit מן hat hier vergleichende beziehungsweise superlativische Kraft. Die Formulierung ist im heutigen Deutsch verständlich, ohne die mögliche traditionelle Wiedergabe „über alles hinaus“ auszuschließen.
- source_word: וְאָנֻשׁ
  choice: und schwer krank
  rationale: אָנֻשׁ beschreibt einen äußerst schweren, möglicherweise unheilbaren Zustand. „Schwer krank“ erhält das Krankheitsbild und lässt die im Wort angelegte Frage der Unheilbarkeit offen.
- source_word: הוּא
  choice: ist es
  rationale: Das ausdrückliche Pronomen wird im Deutschen aufgenommen und bezieht sich eindeutig auf „das Herz“.
- source_word: מִי
  choice: wer
  rationale: Das schlichte Fragewort bewahrt die knappe rhetorische Form des Hebräischen.
- source_word: יֵדָעֶנּוּ
  choice: kann es erkennen
  rationale: ידע bedeutet grundsätzlich „kennen/wissen“. Im Zusammenhang mit dem verborgenen Zustand des Herzens gibt „erkennen“ den Sinn natürlich wieder, ohne ihn auf bloßes intellektuelles Verstehen einzuengen.
theological_decisions:
- issue: Anthropologische Bedeutung von „Herz“
  choice: „Herz“ als Bezeichnung für den inneren Menschen beibehalten
  alternative: „Verstand“ oder „Innerstes“
  rationale: Der hebräische Ausdruck umfasst Denken, Wollen und Begehren und darf nicht auf Gefühle verengt werden. Zugleich bewahrt „Herz“ das biblische Menschenbild und dessen Bildsprache.
- issue: Bedeutung von אָנֻשׁ
  choice: als schwere Krankheit wiedergeben
  alternative: „unheilbar“ oder eine ausdrücklich moralische Wiedergabe wie „abgrundtief böse“
  rationale: Der hebräische Text verwendet ein Krankheitsbild. Die Übersetzung bewahrt diese Spannung, statt sie in eine abstrakte moralische Aussage umzudeuten; „unheilbar“ bleibt als lexikalisch mögliche Alternative in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Voranstellung des Vergleichs unterstreicht die Aussage, ohne altertümlich zu wirken; der Gedankenstrich erhält die zugespitzte rhetorische Frage.
