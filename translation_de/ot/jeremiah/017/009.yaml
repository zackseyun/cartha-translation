  source_fidelity: 'Die Übersetzung gibt die hebräische Struktur und Aussage zuverlässig wieder: עָקֹב מִכֹּל als „trügerischer als alles andere“, אָנֻשׁ als schweres Krankheitsbild und die rhetorische Frage מִי יֵדָעֶנּוּ als „wer kann es erkennen?“. „Erkennen“ ist hier eine natürliche kontextuelle Wiedergabe von ידע und wahrt die Aussage, dass das Herz in seiner tatsächlichen Verfassung nicht zu durchschauen ist.'
  naturalness: „Trügerischer als alles andere ist das Herz, und schwer krank ist es – wer kann es erkennen?“ ist modernes, verständliches und würdiges Standarddeutsch. Die vorangestellte Vergleichsform ist markant, aber nicht unnatürlich; der Gedankenstrich unterstützt die rhetorische Zuspitzung.
