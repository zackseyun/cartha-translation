source:
  edition: WLC
  text: וְ/אִם לֹ֨א תִשְׁמְע֜וּ אֵלַ֗/י לְ/קַדֵּשׁ֙ אֶת י֣וֹם הַ/שַּׁבָּ֔ת וּ/לְ/בִלְתִּ֣י שְׂאֵ֣ת מַשָּׂ֗א וּ/בֹ֛א בְּ/שַׁעֲרֵ֥י יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וְ/הִצַּ֧תִּי אֵ֣שׁ בִּ/שְׁעָרֶ֗י/הָ וְ/אָֽכְלָ֛ה אַרְמְנ֥וֹת יְרוּשָׁלִַ֖ם וְ/לֹ֥א תִכְבֶּֽה־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/027.yaml
  text: But if you do not listen to me[a], to keep the Sabbath day holy, and not to carry a load and bring it in through the gates of Jerusalem on the Sabbath day, then I will kindle a fire in its gates, and it will consume the palaces of Jerusalem[b], and it will not be quenched.
translation:
  language: de
  text: Wenn ihr aber nicht auf mich hört, den Sabbattag heilig zu halten, keine Last[a] zu tragen und sie am Sabbattag durch die Tore Jerusalems hereinzubringen, dann werde ich in den Toren Jerusalems ein Feuer entzünden. Es wird die Paläste[b] Jerusalems verzehren und nicht erlöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Last heben/tragen“; gemeint sein können auch transportierte Waren.'
    reason: lexical_alternative
  - marker: b
    text: Das hebräische Wort kann auch befestigte Prachtbauten oder Zitadellen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמְעוּ אֵלַי
  choice: auf mich hört
  rationale: שׁמע mit אֶל bezeichnet hier ein Hören, das Befolgen einschließt. „Auf mich hört“ bewahrt das hebräische Hörbild, ohne die Bedeutung ausdrücklich auf „gehorchen“ zu verengen.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: den Sabbattag heilig zu halten
  rationale: Das Piel von קדשׁ bedeutet, etwas als heilig auszusondern beziehungsweise heilig zu behandeln. Die Formulierung ist im Deutschen natürlich und bewahrt die ausdrückliche Nennung des Tages.
- source_word: וּלְבִלְתִּי שְׂאֵת מַשָּׂא
  choice: keine Last zu tragen
  rationale: נשא mit מַשָּׂא bezeichnet wörtlich das Heben beziehungsweise Tragen einer Last; im Zusammenhang geht es um transportierte Güter am Sabbat.
- source_word: וּבֹא בְּשַׁעֲרֵי יְרוּשָׁלִַם
  choice: durch die Tore Jerusalems hereinzubringen
  rationale: בוא ist mit dem Tragen der zuvor genannten Last verbunden. Das im Deutschen ergänzte Objekt ist aus dem Kontext eindeutig und macht die Richtung in die Stadt hinein klar.
- source_word: וְהִצַּתִּי אֵשׁ
  choice: dann werde ich ... ein Feuer entzünden
  rationale: Das Hifil von יצת bedeutet „entzünden“. „Dann“ verdeutlicht im Deutschen die Folge des hebräischen Bedingungssatzes.
- source_word: בִּשְׁעָרֶיהָ
  choice: in seinen Toren
  rationale: Das Suffix bezieht sich auf Jerusalem. Da der Stadtname im Deutschen sächlich gebraucht wird, ist „seinen“ natürlich; die feminine Form des Hebräischen wird in einer Fußnote kenntlich gemacht.
- source_word: וְאָכְלָה אַרְמְנוֹת יְרוּשָׁלִַם
  choice: Es wird die Paläste Jerusalems verzehren
  rationale: Das feminine Verb nimmt „Feuer“ als Bezugswort auf. אַרְמְנוֹת kann Paläste beziehungsweise befestigte repräsentative Bauten bezeichnen; „Paläste“ ist hier die unmittelbarste Wiedergabe.
- source_word: וְלֹא תִכְבֶּה
  choice: und nicht erlöschen
  rationale: Das Qal von כבה bedeutet, dass ein Feuer erlischt oder gelöscht wird. „Nicht erlöschen“ wahrt die knappe, feierliche Gerichtsaussage und lässt offen, ob menschliches Löschen mitgedacht ist.
theological_decisions:
- issue: Sabbatterminologie
  choice: Sabbattag
  alternative: Sabbat
  rationale: Im Hebräischen steht ausdrücklich יוֹם, „Tag“. Die Wiedergabe „Sabbattag“ bildet dies ab, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Bedingungs- und Gerichtsstruktur
  choice: „dann werde ich“ als ausdrücklich markierte Folge
  alternative: bloße Fortführung mit „und ich werde“
  rationale: Die hebräische Satzfolge bildet die Konsequenz der vorausgehenden Bedingung. „Dann“ macht diesen Zusammenhang im Deutschen klar, ohne den Aussagegehalt zu verändern.
- issue: Unauslöschliches Feuer
  choice: „nicht erlöschen“
  alternative: „nicht gelöscht werden“
  rationale: Die Formulierung bewahrt die prophetische Gerichtssprache, ohne festzulegen, ob das Feuer von selbst nicht ausgeht oder von niemandem gelöscht werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Bedingungssatz des Hebräischen bleibt erkennbar, wird aber durch klare Infinitivgruppen lesbar gehalten. Die Bildsprache von Hören, Lasttragen, Feuer und Verzehren wird bewahrt.
