  naturalness: Die Formulierung „keine Last zu tragen und durch die Tore Jerusalems hereinzubringen“ lässt im Deutschen das Objekt zu weit zurück und wirkt dadurch leicht holprig. „… keine Last zu tragen und sie am Sabbattag durch die Tore Jerusalems hereinzubringen“ ist klarer und bleibt eng am Hebräischen. „In den Toren Jerusalems“ vermeidet zudem das im Deutschen etwas schwerfällige possessive „in seinen Toren“.
  terminology: „Sabbattag“, „Last“, „Feuer entzünden“, „Paläste“ und „erlöschen“ sind für modernes, würdiges Standarddeutsch passend. Die Fußnote zu אַרְמְנוֹת wahrt sinnvoll die mögliche Bedeutungskomponente befestigter Prachtbauten/Zitadellen.
