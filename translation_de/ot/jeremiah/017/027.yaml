revisions:
- from: Wenn ihr aber nicht auf mich hört, den Sabbattag heilig zu halten und am Sabbattag keine Last[a] zu tragen und durch die Tore Jerusalems hereinzubringen, dann werde ich in seinen Toren[b] ein Feuer entzünden. Es wird die Paläste[c] Jerusalems verzehren und nicht erlöschen.
  to: Wenn ihr aber nicht auf mich hört, den Sabbattag heilig zu halten, keine Last[a] zu tragen und sie am Sabbattag durch die Tore Jerusalems hereinzubringen, dann werde ich in den Toren Jerusalems ein Feuer entzünden. Es wird die Paläste[b] Jerusalems verzehren und nicht erlöschen.
  rationale: Die Revision ergänzt beim koordinierten Infinitiv „hereinzubringen“ das aus dem Kontext erschlossene Objekt „sie“ und ordnet die Zeitangabe so an, dass der Satz im modernen Standarddeutsch klar und flüssig ist. „In den Toren Jerusalems“ ersetzt das weniger natürliche possessive Pronomen; die dadurch gegenstandslose Fußnote zur hebräischen femininen Grammatik wird entfernt. Inhalt, Bildsprache und die offen gehaltene Aussage über das Erlöschen des Feuers bleiben erhalten.
