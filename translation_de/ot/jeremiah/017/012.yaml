id: JER.17.12
reference: Jeremiah 17:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: כִּסֵּ֣א כָב֔וֹד מָר֖וֹם מֵֽ/רִאשׁ֑וֹן מְק֖וֹם מִקְדָּשֵֽׁ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/012.yaml
  text: A glorious throne[a], exalted from the beginning, is the place of our sanctuary.
translation:
  language: de
  text: Ein Thron der Herrlichkeit[a], erhaben von Anfang an, ist der Ort unseres Heiligtums.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ein Thron der Herrlichkeit in der Höhe von Anfang an ist der Ort unseres Heiligtums.« Möglich ist auch eine Anrede: »O Thron der Herrlichkeit, erhaben von Anfang an, Ort unseres Heiligtums!« Der hebräische Text ist stark verdichtet und lässt mehrere syntaktische Deutungen zu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּסֵּא
  choice: Thron
  rationale: Das Substantiv bezeichnet gewöhnlich einen königlichen Thron oder Herrschersitz. »Thron« bewahrt die königliche und theologische Bildkraft.
- source_word: כָבוֹד
  choice: der Herrlichkeit
  rationale: Die Genitivverbindung »Thron der Herrlichkeit« bildet die hebräische Nominalfügung כִּסֵּא כָבוֹד nach und bewahrt ihren feierlichen Klang.
- source_word: מָרוֹם
  choice: erhaben
  rationale: Das Wort bezeichnet Höhe beziehungsweise das Hohe. Prädikativ auf den Thron bezogen vermittelt »erhaben« sowohl räumliche Höhe als auch Majestät, ohne die mögliche Lesart »in der Höhe« zu verschweigen.
- source_word: מֵרִאשׁוֹן
  choice: von Anfang an
  rationale: Die Wendung drückt zeitlichen Vorrang beziehungsweise hohes Alter aus; »von Anfang an« ist im modernen Deutsch natürlich und wahrt diese zeitliche Bedeutung.
- source_word: מְקוֹם
  choice: Ort
  rationale: »Ort« entspricht der Grundbedeutung direkt. Deutendere Wiedergaben wie »Wohnstätte« werden vermieden.
- source_word: מִקְדָּשֵׁנוּ
  choice: unseres Heiligtums
  rationale: Das Substantiv bezeichnet einen heiligen Ort beziehungsweise ein Heiligtum; der angefügte Genitiv gibt das Suffix der ersten Person Plural wieder.
theological_decisions:
- issue: Syntaktisches Verhältnis der verblosen Satzteile
  choice: Der Vers wird als Nominalsatz verstanden, der den Thron der Herrlichkeit, der von Anfang an erhaben ist, mit dem Ort des Heiligtums identifiziert.
  alternative: 'Möglich sind auch eine Zuordnung von מָרוֹם als »in der Höhe« sowie eine Anrede: »O Thron der Herrlichkeit, erhaben von Anfang an, Ort unseres Heiligtums!«'
  rationale: Der hebräische Text ist stark verdichtet und enthält kein ausdrückliches Verb. Die Hauptfassung bietet eine gut verständliche, verbreitete Satzverknüpfung; die Fußnote erhält die echten syntaktischen Alternativen und löst die theologische Bildspannung nicht vorschnell auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Genitivfügung »Thron der Herrlichkeit« wahrt die Dichte des Hebräischen; die notwendige Kopula »ist« macht den verblosen Satz im Deutschen verständlich. Die Fußnote dokumentiert die syntaktische Mehrdeutigkeit.
