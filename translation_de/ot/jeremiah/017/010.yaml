source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה חֹקֵ֥ר לֵ֖ב בֹּחֵ֣ן כְּלָי֑וֹת וְ/לָ/תֵ֤ת לְ/אִישׁ֙ כ/דרכ/ו כִּ/פְרִ֖י מַעֲלָלָֽי/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/010.yaml
  text: I[a], Yahweh, search the heart[b], testing the kidneys, to give to each man according to his way, according to the fruit of his deeds.
translation:
  language: de
  text: Ich, Jahwe, erforsche das Herz und prüfe die Nieren[a], um jedem Menschen entsprechend seinem Weg, entsprechend der Frucht seiner Taten zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Nieren“; im Hebräischen ein Bild für die verborgensten Gedanken und Empfindungen eines Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: חֹקֵר לֵב
  choice: erforsche das Herz
  rationale: „Erforschen“ bezeichnet die fortdauernde, gründliche Prüfung; „Herz“ bewahrt das hebräische Bild für das innere Denken, Wollen und Empfinden.
- source_word: בֹּחֵן כְּלָיוֹת
  choice: prüfe die Nieren
  rationale: Die konkrete Körpermetapher des Hebräischen bleibt erhalten; eine Fußnote erklärt ihre anthropologische Bedeutung.
- source_word: וְלָתֵת
  choice: um … zu geben
  rationale: Der Infinitiv lässt sich als Zweck oder Folge des Erforschens und Prüfens verstehen. Die Formulierung bewahrt diese Verbindung, ohne sie stärker festzulegen.
- source_word: לְאִישׁ
  choice: jedem Menschen
  rationale: Das maskuline Singularwort אִישׁ hat hier im distributiven Zusammenhang repräsentative Bedeutung. „Jedem Menschen“ gibt den gemeinten Umfang in natürlichem modernem Deutsch wieder.
- source_word: כִדְרָכוֹ
  choice: nach seinem Weg
  rationale: „Weg“ erhält die geläufige hebräische Metapher für Lebensführung und Verhalten.
- source_word: כִפְרִי מַעֲלָלָיו
  choice: nach der Frucht seiner Taten
  rationale: Die Fruchtmetapher wird bewahrt und „Taten“ gibt den moralisch gewichteten Sinn von מַעֲלָלִים knapp wieder.
theological_decisions:
- issue: Anthropologische Bildsprache beim göttlichen Gericht
  choice: „Herz“ und „Nieren“ als konkrete Bildwörter beibehalten
  alternative: „Inneres“ und „tiefste Gedanken und Empfindungen“
  rationale: Die hebräische Körperbildsprache beschreibt Gottes umfassende Kenntnis des inneren Menschen. Ihre Beibehaltung vermeidet eine Einengung auf moderne psychologische Kategorien.
- issue: Reichweite von לְאִישׁ
  choice: „jedem Menschen“
  alternative: „jedem Mann“
  rationale: Obwohl אִישׁ grammatisch maskulin ist, hat es hier repräsentative und distributive Kraft. Die Haupttextfassung macht diese allgemeine Reichweite deutlich; die wörtliche Form wird in der Fußnote genannt.
- issue: Verhältnis von Erkenntnis und Vergeltung
  choice: Den Zweck- beziehungsweise Folgezusammenhang mit „um … zu geben“ ausdrücken
  alternative: „und ich vergelte“
  rationale: Die Alternative macht den Gerichtssinn deutlicher, legt jedoch die Funktion des Infinitivs stärker fest und ersetzt das allgemeine Verb „geben“ durch eine interpretierende Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Bildsprache. Die parallelen Wendungen „nach seinem Weg“ und „nach der Frucht seiner Taten“ folgen bewusst der hebräischen Struktur; die ungewohnte Nierenmetapher wird nicht geglättet, sondern erläutert.
