source:
  edition: WLC
  text: יֵבֹ֤שׁוּ רֹדְפַ/י֙ וְ/אַל אֵבֹ֣שָׁה אָ֔נִי יֵחַ֣תּוּ הֵ֔מָּה וְ/אַל אֵחַ֖תָּה אָ֑נִי הָבִ֤יא עֲלֵי/הֶם֙ י֣וֹם רָעָ֔ה וּ/מִשְׁנֶ֥ה שִׁבָּר֖וֹן שָׁבְרֵֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/018.yaml
  text: Let my pursuers be put to shame[a], but let me not be put to shame; let them be dismayed, but let me not be dismayed. Bring upon them a day of disaster[c][b], and shatter them with double destruction.
translation:
  language: de
  text: Meine Verfolger sollen beschämt werden[a], doch ich soll nicht beschämt werden. Sie sollen bestürzt sein, doch ich soll nicht bestürzt sein. Bring über sie einen Tag des Unheils[b], und zerschmettere sie mit doppelter Zerschmetterung[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mir nachjagen“. Das hebräische Wort bezeichnet wörtlich diejenigen, die jemanden verfolgen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen Tag der Katastrophe“. Gemeint ist Unheil im Sinne von Gericht und Verderben, nicht moralisch Böses.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Zerbrich sie mit doppeltem Zerbrechen.“ Die Formulierung verbindet ein Verb und ein stammverwandtes Substantiv.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ / אֵבֹשָׁה
  choice: beschämt werden
  rationale: בושׁ bezeichnet hier das Erleiden von Schande, Bloßstellung oder enttäuschter Erwartung. „Beschämt werden“ wahrt den äußeren, öffentlichen Sinn besser als das eher innerlich verstandene „sich schämen“ und erhält den Parallelismus.
- source_word: רֹדְפַי
  choice: meine Verfolger
  rationale: Das Partizip von רדף meint wörtlich diejenigen, die dem Sprecher nachsetzen. „Verfolger“ ist im Deutschen natürlich, bewahrt das konkrete Bild und legt nicht unnötig eine ausschließlich religiöse Verfolgung fest.
- source_word: יֵחַתּוּ / אֵחַתָּה
  choice: bestürzt sein
  rationale: חתת im Nifal kann niedergeschmettert, erschreckt oder entmutigt sein bezeichnen. „Bestürzt sein“ gibt im Parallelismus mit der Beschämung den seelischen Zusammenbruch wieder, ohne die Aussage vorschnell körperlich zu deuten.
- source_word: הָבִיא עֲלֵיהֶם
  choice: Bring über sie
  rationale: Der Hifil-Imperativ von בוא mit עַל drückt aus, dass Gott etwas über Menschen kommen lässt. Die Formulierung ist idiomatisch und erhält die direkte Bitte an Gott.
- source_word: יוֹם רָעָה
  choice: einen Tag des Unheils
  rationale: רָעָה meint in diesem Zusammenhang Unheil oder Verderben, nicht moralische Bosheit. „Tag des Unheils“ lässt den Charakter als Gerichts- und Verderbenstag erkennen.
- source_word: מִשְׁנֶה
  choice: doppelter
  rationale: מִשְׁנֶה bezeichnet eine Verdoppelung beziehungsweise ein doppeltes Maß. Das Adjektiv bewahrt hier knapp die Intensivierung des folgenden Nomens.
- source_word: שִׁבָּרוֹן / שָׁבְרֵם
  choice: Zerschmetterung / zerschmettere sie
  rationale: 'Die Verbindung von Substantiv und stammverwandtem Verb erzeugt eine markante Wiederholung: wörtlich etwa „zerbrich sie mit doppeltem Zerbrechen“. Die deutsche Wortfamilie „zerschmettern/Zerschmetterung“ erhält sowohl die Gewalt des Bildes als auch das Wortspiel.'
theological_decisions:
- issue: Fluchbitte um göttliches Gericht
  choice: Die direkte Bitte Jeremias um Beschämung, Bestürzung und Zerschmetterung seiner Verfolger wird ungemildert wiedergegeben.
  alternative: Die Aussage als bloßen allgemeinen Wunsch nach Rechtfertigung oder Schutz abschwächen.
  rationale: Der hebräische Text verwendet direkte Wunschformen und Imperative. Die Spannung zwischen persönlicher Rechtfertigung und der Bitte um schweres göttliches Gericht gehört zum Text und darf nicht konfessionell oder harmonisierend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der symmetrische Parallelismus der ersten beiden Sätze und der schroffe Ton der Gerichtsbitte bleiben erhalten. „Zerschmetterung“ ist bewusst kräftig und leicht gehoben, um das hebräische Bild samt Wortwiederholung abzubilden.
