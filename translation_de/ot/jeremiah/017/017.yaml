id: JER.17.17
reference: Jeremiah 17:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַל תִּֽהְיֵה לִ֖/י לִ/מְחִתָּ֑ה מַֽחֲסִ/י אַ֖תָּה בְּ/י֥וֹם רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/017.yaml
  text: Do not be a terror to me[b][a]; you are my refuge in the day of disaster.
translation:
  language: de
  text: Sei mir nicht zum Schrecken[a]; du bist meine Zuflucht am Tag des Unheils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Entsetzen“, „zum Verderben“ oder „zum Anlass des Schreckens“.'
    reason: lexical_alternative
  - marker: b
    text: „Unheil“ bezeichnet hier Not oder Katastrophe, nicht moralisch Böses.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֵה
  choice: Sei nicht
  rationale: Die Negation אַל mit dem Imperfekt von היה formuliert hier eine bittende Abwehr. „Sei nicht“ bewahrt sowohl die direkte Anrede als auch den Gebetscharakter.
- source_word: לִי לִמְחִתָּה
  choice: mir zum Schrecken
  rationale: מְחִתָּה kann Schrecken, Entsetzen oder vernichtendes Unheil bezeichnen. Die deutsche Wendung „jemandem zum Schrecken sein“ gibt die Relation mit לִי natürlich wieder und lässt die bedrohliche Bedeutungsbreite erkennen.
- source_word: מַחֲסִי
  choice: meine Zuflucht
  rationale: מַחֲסֶה bezeichnet einen Schutz- oder Zufluchtsort. „Meine Zuflucht“ ist prägnant, verständlich und für die Gebetssprache angemessen.
- source_word: אַתָּה
  choice: du bist
  rationale: Das selbstständige Pronomen hebt den Angeredeten hervor; im Deutschen wird die Kopula ergänzt. Die direkte Form „du bist“ bewahrt diese persönliche Betonung.
- source_word: בְּיוֹם רָעָה
  choice: am Tag des Unheils
  rationale: Die Wendung bezeichnet eine Zeit der Not oder Katastrophe. „Am Tag des Unheils“ ist im modernen Deutschen würdevoll und macht deutlich, dass רָעָה hier widrige Umstände und nicht moralische Bosheit meint.
theological_decisions:
- issue: Ob רָעָה moralisch als „Böses“ oder als Not und Katastrophe wiederzugeben ist
  choice: Unheil
  alternative: Böses; Unglück; Not
  rationale: Im Zusammenhang spricht Jeremia von einem Tag der Bedrängnis beziehungsweise des Gerichts, an dem Gott seine Zuflucht ist. „Unheil“ wahrt die mögliche Schwere bis hin zur Katastrophe, ohne dem Wort hier eine moralische Bedeutung aufzuzwingen.
- issue: Ob מְחִתָּה ausschließlich als innerer Schrecken oder als tatsächlicher Zusammenbruch zu verstehen ist
  choice: Schrecken, mit erläuternder Fußnote zur Bedeutungsbreite
  alternative: Entsetzen; Verderben; Ursache des Entsetzens
  rationale: Der Kontext erlaubt die Vorstellung, Gott möge für Jeremia nicht zum Gegenstand oder Anlass des Schreckens werden; das Substantiv kann jedoch auch vernichtendes Unheil bezeichnen. Die Übersetzung legt die emotionale Seite in den Haupttext, ohne die weitergehende Bedeutung auszuschließen.
translation_notes:
  register: Moderne, würdige Gebetssprache mit knapper Satzstruktur. „Sei mir … zum Schrecken“ ist bewusst leicht gehoben, bleibt aber verständlich und bildet die hebräische Konstruktion eng ab. Das Semikolon bewahrt die Spannung zwischen der Bitte und dem anschließenden Vertrauensbekenntnis.
