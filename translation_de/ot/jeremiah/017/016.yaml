  text: וַ/אֲנִ֞י לֹא אַ֣צְתִּי מֵ/רֹעֶ֣ה אַחֲרֶ֗י/ךָ וְ/י֥וֹם אָנ֛וּשׁ לֹ֥א הִתְאַוֵּ֖יתִי אַתָּ֣ה יָדָ֑עְתָּ מוֹצָ֣א שְׂפָתַ֔/י נֹ֥כַח פָּנֶ֖י/ךָ הָיָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/016.yaml
  text: But as for me[a], I did not hurry away from being a shepherd after you, and I did not desire the day of disaster; you know. What came from my lips was before your face.
translation:
  language: de
  text: 'Ich aber bin nicht davor zurückgewichen, dir als Hirte zu folgen, und nach dem Tag des Unheils[a] habe ich mich nicht gesehnt. Du weißt es: Was über meine Lippen kam, war vor deinem Angesicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Tag schweren Leidens“, „Tag des Verderbens“; wörtlich bezeichnet der hebräische Ausdruck einen schweren, unheilbaren oder verzweifelten Tag.'
    reason: Die Wendung יוֹם אָנושׁ ist bildhaft und mehrdeutig; die Fußnote bewahrt ihre Nähe zu Krankheit und Unheilbarkeit.
lexical_decisions:
- source_word: אַצְתִּי מֵרֹעֶה אַחֲרֶיךָ
  choice: habe mich nicht gedrängt, dir nicht mehr als Hirte zu folgen
  rationale: אוץ bezeichnet Drängen oder Eilen. Mit מִן und dem Partizip רֹעֶה ergibt sich hier wahrscheinlich der Sinn, dass Jeremia nicht darauf gedrängt hat, seine Hirtenaufgabe in der Nachfolge JHWHs aufzugeben. Die Formulierung bewahrt sowohl das Drängen als auch das Hirtenbild, ohne das Verb stärker als nötig als „fliehen“ oder „sich entziehen“ festzulegen.
- source_word: יוֹם אָנ֛וּשׁ
  choice: Tag des Unheils
  rationale: אָנושׁ bezeichnet etwas Schweres, Unheilbares oder Verzweifeltes. Zusammen mit „Tag“ meint die Wendung im Kontext wahrscheinlich einen Tag schweren Unheils beziehungsweise Gerichts; die körperliche Krankheitsmetapher wird in der Fußnote sichtbar gehalten.
- source_word: הִתְאַוֵּיתִי
  choice: habe ich mich nicht gesehnt
  rationale: Das Hitpael von אוה drückt starkes Verlangen oder Sehnen aus. „Sich sehnen nach“ gibt diesen Nachdruck natürlich wieder.
- source_word: אַתָּה יָדָעְתָּ
  choice: Du weißt es
  rationale: Das Perfekt bezeichnet hier Gottes bestehendes Wissen und dient als unmittelbare Berufung auf ihn als Zeugen.
- source_word: מוֹצָא שְׂפָתַי
  choice: Was über meine Lippen kam
  rationale: Die konkrete Vorstellung dessen, was von den Lippen ausgeht, wird in natürlichem Deutsch bewahrt und zugleich eindeutig auf Jeremias Worte bezogen.
- source_word: נֹכַח פָּנֶיךָ הָיָה
  choice: lag offen vor deinem Angesicht
  rationale: נֹכַח פָּנֶיךָ bedeutet „vor deinem Angesicht/in deiner Gegenwart“. „Lag offen“ macht idiomatisch deutlich, dass Jeremias Worte Gott gegenwärtig und bekannt waren, während „vor deinem Angesicht“ die hebräische Bildsprache erhält.
theological_decisions:
- issue: Jeremias Selbstbeschreibung mit רֹעֶה
  choice: Das Hirtenbild wird ausdrücklich beibehalten.
  alternative: Die Rolle als „Prophet“ oder allgemein als „Diener“ benennen.
  rationale: Der hebräische Text verwendet „Hirte“. Eine Ersetzung durch eine Amtsbezeichnung würde die Metapher auslegen und möglicherweise verengen.
- issue: Bezug von יוֹם אָנושׁ
  choice: Als „Tag des Unheils“ wiedergegeben, ohne ausdrücklich „Gerichtstag“ zu ergänzen.
  alternative: „Tag des Gerichts“, „Tag des Verderbens“ oder wörtlicher „Tag der Krankheit“.
  rationale: Der Kontext legt schweres Unheil und vermutlich Gericht nahe, nennt jedoch das Gericht nicht ausdrücklich. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche Hirtenbild und „vor deinem Angesicht“ bleiben erhalten; die Syntax wird so geglättet, dass der Vers für heutige Leser verständlich ist.
