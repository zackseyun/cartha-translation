source:
  edition: WLC
  text: חַטַּ֣את יְהוּדָ֗ה כְּתוּבָ֛ה בְּ/עֵ֥ט בַּרְזֶ֖ל בְּ/צִפֹּ֣רֶן שָׁמִ֑יר חֲרוּשָׁה֙ עַל ל֣וּחַ לִבָּ֔/ם וּ/לְ/קַרְנ֖וֹת מִזְבְּחוֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/001.yaml
  text: The sin of Judah is written with an iron stylus[a]; with a diamond point it is engraved on the tablet of their heart and on the horns of your altars.
translation:
  language: de
  text: Die Sünde Judas ist mit einem eisernen Griffel geschrieben, mit einer Diamantspitze[a] auf die Tafel ihres Herzens und auf die Hörner eurer Altäre eingraviert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einer Spitze aus Adamant“; die genaue Bedeutung des hebräischen Wortes ist unsicher. Es bezeichnet allgemein ein äußerst hartes Material zum Gravieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: Sünde
  rationale: Im prophetischen Anklagekontext bezeichnet das Wort moralische Verfehlung, nicht ein Sündopfer.
- source_word: כְּתוּבָה
  choice: ist ... geschrieben
  rationale: Die passive Partizipialform beschreibt einen bestehenden, durch das Schreiben hervorgebrachten Zustand.
- source_word: עֵט בַּרְזֶל
  choice: eiserner Griffel
  rationale: „Griffel“ bezeichnet hier natürlich ein hartes Schreib- oder Ritzwerkzeug und bewahrt zusammen mit „eisern“ das Bild dauerhafter Einprägung.
- source_word: צִפֹּרֶן שָׁמִיר
  choice: diamantene Spitze
  rationale: צִפֹּרֶן bezeichnet funktional die Spitze des Ritzwerkzeugs; שָׁמִיר verweist auf einen außerordentlich harten Stoff, dessen genaue mineralogische Bestimmung unsicher ist.
- source_word: חֲרוּשָׁה
  choice: eingraviert
  rationale: Das passive Partizip verstärkt das Bild des Schreibens zu einem dauerhaften Einritzen.
- source_word: לוּחַ לִבָּם
  choice: die Tafel ihres Herzens
  rationale: „Tafel“ erhält die Inschriftenmetapher; der singularische Ausdruck „Herz“ mit pluralischem Bezug wird entsprechend der hebräischen Kollektivform bewahrt.
- source_word: קַרְנוֹת
  choice: Hörner
  rationale: Die Hörner sind ein festes bauliches und kultisches Merkmal altisraelitischer Altäre; die wörtliche Bezeichnung ist sachlich angemessen.
- source_word: מִזְבְּחוֹתֵיכֶם
  choice: eurer Altäre
  rationale: Die Anrede in der zweiten Person Plural wird beibehalten und nicht an die vorherige dritte Person angeglichen.
theological_decisions:
- issue: Wechsel der pronominalen Perspektive von der dritten zur zweiten Person
  choice: „ihres Herzens“ ... „eurer Altäre“
  alternative: „ihres Herzens“ ... „ihrer Altäre“
  rationale: Der masoretische Text wechselt von der Rede über Juda zur direkten prophetischen Anrede. Dieser markante Wechsel wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die harte, dauerhafte Inschriftenmetaphorik und der unvermittelte Wechsel zur direkten Anrede bleiben erhalten.
