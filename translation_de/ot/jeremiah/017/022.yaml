base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/017/022.yaml
  text: Do not carry a load out of your houses on the Sabbath day[a], and do not do any work, but sanctify the Sabbath day[b], just as I commanded your fathers.
translation:
  language: de
  text: Tragt am Sabbattag keine Last aus euren Häusern hinaus[a] und verrichtet keinerlei Arbeit, und heiligt den Sabbattag, so wie ich es euren Vätern[b] geboten habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Bringt keine Last aus euren Häusern hinaus.'
    reason: Lexikalische Alternative für den Hifil von יצא, der sowohl mit „hinaustragen“ als auch allgemeiner mit „hinausbringen“ wiedergegeben werden kann.
  - marker: b
    text: Mit „euren Vätern“ sind die früheren Generationen Israels gemeint, denen Gott dieses Gebot gegeben hatte.
    reason: Erläuterung des kulturell und geschichtlich gebrauchten Verwandtschaftsbegriffs.
lexical_decisions:
- source_word: תוֹצִיאוּ
  choice: tragt … hinaus
  rationale: Der Hifil von יצא bezeichnet das Herausbringen. Zusammen mit מַשָּׂא gibt „eine Last hinaustragen“ die konkrete Handlung im Zusammenhang des Sabbatgebots natürlich wieder.
- source_word: מַשָּׂא
  choice: Last
  rationale: Das Substantiv bezeichnet hier etwas, das getragen oder transportiert wird. „Last“ bewahrt den konkreten Sinn, ohne ihn unnötig auf Handelsware einzuengen.
- source_word: מִבָּתֵּיכֶם
  choice: aus euren Häusern hinaus
  rationale: Die Präposition מן bezeichnet den Ausgangspunkt; die deutsche Verbindung „aus … hinaustragen“ gibt die räumliche Bewegung klar wieder.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: am Sabbattag
  rationale: Die Wiedergabe erhält den ausdrücklich genannten „Tag“ und ist im modernen Standarddeutsch knapp und verständlich.
- source_word: מְלָאכָה
  choice: Arbeit
  rationale: Im Zusammenhang der Sabbatgebote bezeichnet מְלָאכָה die am heiligen Tag untersagte Arbeit. „Keinerlei Arbeit“ gibt die umfassende Verneinung כָל … לֹא idiomatisch wieder.
- source_word: וְקִדַּשְׁתֶּם
  choice: Heiligt
  rationale: Der Piel von קדש bedeutet, etwas als heilig auszusondern oder zu behandeln. „Heiligt“ bildet die aktive Aufforderung direkt ab und wahrt den würdigen Ton.
- source_word: כַּאֲשֶׁר
  choice: so wie
  rationale: Die Form leitet den Vergleich mit dem früher erteilten göttlichen Gebot ein; „so wie“ gibt diesen Bezug natürlich wieder.
- source_word: צִוִּיתִי
  choice: ich … geboten habe
  rationale: „Gebieten“ ist eine präzise und im biblischen Zusammenhang natürliche Wiedergabe von צוה; das Perfekt entspricht hier idiomatischem Deutsch.
- source_word: אֲבוֹתֵיכֶם
  choice: euren Vätern
  rationale: Die Übersetzung bewahrt den ausdrücklich maskulinen Verwandtschaftsbegriff des hebräischen Textes; eine Fußnote erläutert den kollektiven historischen Bezug.
theological_decisions:
- issue: Wiedergabe der Heiligung des Sabbats
  choice: Heiligt … den Sabbattag
  alternative: Haltet den Sabbattag heilig
  rationale: „Heiligt“ spiegelt die aktive Piel-Form וְקִדַּשְׁתֶּם unmittelbar wider und lässt sowohl das Aussondern als auch das Behandeln als heilig anklingen, ohne diese Spannung auf eine einzelne Form der Befolgung zu verengen.
- issue: Geschlechtsspezifische Bezeichnung früherer Generationen
  choice: euren Vätern
  alternative: euren Vorfahren
  rationale: Der Ausgangstext verwendet den maskulinen Verwandtschaftsbegriff אֲבוֹתֵיכֶם. Die formnahe Wiedergabe wird beibehalten und ihr historisch-kollektiver Bezug in der Fußnote erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sabbattag“, „Heiligt“ und „geboten“ bewahren den feierlichen Charakter des Gebots, bleiben aber allgemein verständlich. Die Satzteilung vermeidet eine schwerfällige Reihung; „vielmehr“ verdeutlicht den Übergang vom Verbot zur positiven Aufforderung.
