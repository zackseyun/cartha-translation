  variant: modern standard German
source:
  edition: WLC
  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
translation:
  language: de
  text: Denn ich habe Esau entblößt[a]; ich habe seine Verstecke aufgedeckt, und er wird sich nicht verbergen können. Seine Nachkommen, seine Brüder und seine Nachbarn sind verwüstet[b], und ihn gibt es nicht mehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch „Esau“; hier bezeichnet der Name das von Esau abstammende Volk, also Edom.
    reason: cross_reference
  - marker: b
    text: 'Auch: „ausgeplündert“ oder „vernichtet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂפְתִּי
  choice: habe … entblößt
  rationale: Das Verb bezeichnet das Freilegen durch Entfernen einer Bedeckung. „Entblößt“ bewahrt das konkrete Bild vollständiger Bloßstellung.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Der hebräische Text nennt Esau; im Zusammenhang steht der Name für das von ihm abstammende Volk Edom. Der Eigenname bleibt im Haupttext erhalten.
- source_word: גִּלֵּיתִי אֶת־מִסְתָּרָיו
  choice: habe seine Verstecke aufgedeckt
  rationale: Die Wendung bezeichnet das Offenlegen konkreter Orte der Verborgenheit. „Verstecke“ gibt diesen räumlichen Sinn natürlich wieder.
- source_word: וְנֶחְבָּה לֹא יוּכָל
  choice: sodass er sich nicht verbergen kann
  rationale: Die Konstruktion drückt aus, dass Esau nach der Aufdeckung seiner Verstecke außerstande ist, sich weiter zu verbergen.
- source_word: שֻׁדַּד
  choice: sind verwüstet
  rationale: Das Verb kann gewaltsames Ausplündern oder Verwüsten bezeichnen. „Verwüstet“ wahrt die Breite des Ausdrucks, ohne ihn vorschnell auf völlige Vernichtung einzuengen.
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: „Nachkommen“ gibt das kollektiv gebrauchte „Same“ in natürlichem modernem Deutsch wieder.
- source_word: אֶחָיו וּשְׁכֵנָיו
  choice: seine Brüder und seine Nachbarn
  rationale: Die konkreten Beziehungsbegriffe des Hebräischen werden beibehalten; im Völkerorakel können damit verwandte beziehungsweise benachbarte Gruppen gemeint sein.
- source_word: וְאֵינֶנּוּ
  choice: und ihn gibt es nicht mehr
  rationale: Die hebräische Existenzverneinung drückt sein Verschwinden beziehungsweise sein Ende knapp und endgültig aus.
- source_word: כִּי
  choice: Denn
  rationale: Die Konjunktion führt hier die Begründung für das zuvor angekündigte Gericht ein.
theological_decisions:
- issue: Bezug des Namens „Esau“ im Edom-Orakel
  choice: Der Personenname „Esau“ bleibt im Haupttext stehen; eine Fußnote erläutert den nationalen Bezug.
  alternative: Im Haupttext deutend „Edom“ schreiben.
  rationale: Der Ausgangstext nennt ausdrücklich Esau. So bleibt die metonymische Ausdrucksweise des Propheten erhalten, ohne den im Kontext erkennbaren Bezug auf Edom zu verschweigen.
- issue: Stärke von שֻׁדַּד
  choice: „verwüstet“ mit Fußnote zu möglichen Alternativen
  alternative: „vernichtet“ oder „ausgeplündert“
  rationale: Das Verb umfasst Plünderung und verheerende Zerstörung. „Verwüstet“ bewahrt diese Bedeutungsbreite und vermeidet eine unbegründete Festlegung auf vollständige Auslöschung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache von Entblößung und aufgedeckten Verstecken bleibt konkret; die abschließende Existenzverneinung ist bewusst knapp und feierlich formuliert.
