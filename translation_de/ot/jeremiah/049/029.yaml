source:
  edition: WLC
  text: אָהֳלֵי/הֶ֤ם וְ/צֹאנָ/ם֙ יִקָּ֔חוּ יְרִיעוֹתֵי/הֶ֧ם וְ/כָל כְּלֵי/הֶ֛ם וּ/גְמַלֵּי/הֶ֖ם יִשְׂא֣וּ לָ/הֶ֑ם וְ/קָרְא֧וּ עֲלֵי/הֶ֛ם מָג֖וֹר מִ/סָּבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
translation:
  language: de
  text: 'Ihre Zelte und ihre Herden werden sie nehmen; ihre Zeltbahnen, all ihre Gerätschaften und ihre Kamele werden sie für sich forttragen. Sie werden gegen sie rufen: »Schrecken ringsum!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Über sie werden sie rufen: ‚Schrecken ringsum!‘“ Die hebräische Verbindung kann einen Ruf über, hinsichtlich oder gegen sie bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  choice: ihre Zelte
  rationale: אֹהֶל bezeichnet hier im Zusammenhang mit den nomadischen Gruppen von Kedar und Hazor deren Zelte als Wohnstätten.
- source_word: צֹאנָם
  choice: ihre Herden
  rationale: צֹאן umfasst vor allem Kleinvieh wie Schafe und Ziegen; „Herden“ gibt den kollektiven Sinn natürlich wieder.
- source_word: יִקָּחוּ
  choice: werden sie nehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“. Der Zusammenhang macht deutlich, dass es sich um feindliche Wegnahme beziehungsweise Plünderung handelt, ohne dass dies im Verb selbst ausdrücklich festgelegt werden muss.
- source_word: יְרִיעוֹתֵיהֶם
  choice: ihre Zeltbahnen
  rationale: יְרִיעָה bezeichnet eine Stoffbahn beziehungsweise einen Vorhang, der zum Zelt gehört; „Zeltbahnen“ ist im nomadischen Kontext präzise und idiomatisch.
- source_word: כָּל־כְּלֵיהֶם
  choice: all ihre Gerätschaften
  rationale: כְּלִי kann Gefäß, Gerät, Gegenstand oder Ausrüstung bedeuten. „Gerätschaften“ wahrt hier die breite Bedeutung innerhalb der Aufzählung von Beutegut.
- source_word: גְּמַלֵּיהֶם
  choice: ihre Kamele
  rationale: Direkte Wiedergabe des pluralischen גָּמָל mit Possessivsuffix.
- source_word: יִשְׂאוּ לָהֶם
  choice: werden sie für sich forttragen
  rationale: נשא bezeichnet das Tragen beziehungsweise Wegtragen; לָהֶם bringt hier den Nutzen oder Erwerb für die Handelnden zum Ausdruck. „Für sich forttragen“ bildet beides ab.
- source_word: וְקָרְאוּ עֲלֵיהֶם
  choice: Über ihnen werden sie ausrufen
  rationale: קרא על kann einen Ruf über, hinsichtlich oder gegen jemanden bezeichnen. Die Hauptfassung bewahrt mit „über ihnen“ die räumlich-szenische und zugleich proklamatorische Offenheit.
- source_word: מָגוֹר מִסָּבִיב
  choice: Schrecken ringsum!
  rationale: Die wiederkehrende jeremianische Wendung bezeichnet ringsum drohenden Schrecken. Die knappe Form wahrt ihren formelhaften und eindringlichen Charakter.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die betonten Beutestücke im Vordergrund; „Zeltbahnen“ und „Gerätschaften“ sind konkret, ohne den Bedeutungsumfang unnötig einzuengen. Die Mehrdeutigkeit von וְקָרְאוּ עֲלֵיהֶם wird in Haupttext und Fußnote offengehalten.
