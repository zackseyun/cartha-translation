  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des Hebräischen zutreffend wieder: die prophetische Einleitungsformel, den Gottesnamen, den Titel „der Heerscharen“, die emphatische Selbstankündigung, das Präsens des bevorstehenden entschlossenen Handelns, den konkreten „Bogen Elams“ sowie dessen appositionelle Kennzeichnung als zentralen Bestandteil seiner Macht. „Hauptstütze ihrer Macht“ ist als kontextuelle Wiedergabe von רֵאשִׁית גְּבוּרָתָם vertretbar; die Fußnote bewahrt angemessen die lexikalische Spannweite.'
