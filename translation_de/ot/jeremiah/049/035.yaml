source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י שֹׁבֵ֖ר אֶת קֶ֣שֶׁת עֵילָ֑ם רֵאשִׁ֖ית גְּבוּרָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/035.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am breaking the bow of Elam, the chief of their might.'
translation:
  language: de
  text: 'So spricht Jahwe der Heerscharen: Seht, ich zerbreche den Bogen Elams, die Hauptstütze ihrer Macht.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den wichtigsten Teil ihrer Stärke“ oder „das Kernstück ihrer Macht“.'
    reason: רֵאשִׁית kann hier den vorrangigen Teil, das Kernstück oder die tragende Grundlage von Elams Stärke bezeichnen.
lexical_decisions:
- source_word: כֹּה
  choice: So
  rationale: Leitet in der üblichen prophetischen Formel einen Gottesspruch ein; „So spricht“ ist im Deutschen würdevoll und unmittelbar verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: der Heerscharen
  rationale: Bewahrt in der festen Gottesbezeichnung die breite Bedeutung, die himmlische wie irdische Heere umfassen kann.
- source_word: הִנְנִי
  choice: Seht, ich
  rationale: Gibt den Aufmerksamkeit weckenden und die entschlossene persönliche Beteiligung betonenden Ausdruck in natürlichem Deutsch wieder.
- source_word: שֹׁבֵר
  choice: zerbreche
  rationale: Das Partizip mit הִנְנִי bezeichnet ein unmittelbar bevorstehendes beziehungsweise fest beschlossenes Handeln; das deutsche Präsens wahrt diese Eindringlichkeit.
- source_word: קֶשֶׁת
  choice: den Bogen
  rationale: Bewahrt das konkrete militärische Bild, ohne die im Kontext naheliegende Bedeutung als Kriegswaffe ausdrücklich hinzuzufügen.
- source_word: עֵילָם
  choice: Elams
  rationale: Übliche deutsche Form des Orts- und Volksnamens; der Genitiv gibt die hebräische Status-constructus-Verbindung wieder.
- source_word: רֵאשִׁית
  choice: die Hauptstütze
  rationale: Bezeichnet hier appositionell den Bogen als vorrangigen beziehungsweise tragenden Bestandteil von Elams Macht. Die Alternativen werden wegen der Bedeutungsbreite in einer Fußnote erhalten.
- source_word: גְּבוּרָתָם
  choice: ihrer Macht
  rationale: Passt zum militärischen Zusammenhang und bewahrt den pluralischen Bezug des Suffixes auf die Menschen Elams.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet ausdrücklich das Tetragramm; die Wiedergabe als Eigenname bewahrt den persönlichen Gottesnamen, ohne ihn durch einen Hoheitstitel zu ersetzen.
- issue: Bildhafte Bedeutung des Bogens
  choice: Das konkrete Bild „Bogen“ bleibt stehen und wird als Hauptstütze der Macht Elams bezeichnet.
  alternative: freie Wiedergabe als „militärische Macht“ oder „stärkste Waffe“
  rationale: Der Text verbindet eine wirkliche, für Elam charakteristische Waffe mit einer Aussage über seine Macht. Die Bildsprache soll nicht auf eine einzige abstrakte Deutung reduziert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten prophetischen Einleitungsformel „So spricht“. „Seht“ ist als lebendiger Aufmerksamkeitssignal verständlicher als das altertümlichere „Siehe“. Die militärische Bildsprache und die Mehrdeutigkeit von רֵאשִׁית bleiben erhalten.
