source:
  edition: WLC
  text: וְ/הָיְתָ֨ה חָצ֜וֹר לִ/מְע֥וֹן תַּנִּ֛ים שְׁמָמָ֖ה עַד עוֹלָ֑ם לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
translation:
  language: de
  text: Hazor wird zu einer Wohnstätte für Schakale[a], zu einer Einöde für immer. Kein Mann wird dort wohnen, und kein Mensch[b] wird sich darin aufhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „zu einem Aufenthaltsort der Schakale“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich stehen hier die parallelen Ausdrücke „kein Mann … kein Menschenkind“; gemeint ist, dass dort überhaupt kein Mensch leben oder sich aufhalten wird. Das mit „sich aufhalten“ übersetzte Verb kann auch „als Fremder wohnen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird zu
  rationale: Im prophetischen Gerichtswort bezeichnet die Form eine künftige Zustandsveränderung; „wird zu“ gibt dies im Deutschen natürlich wieder.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: לִמְעוֹן
  choice: zu einer Wohnstätte für
  rationale: מָעוֹן bezeichnet einen Wohn- oder Aufenthaltsort. „Wohnstätte“ bewahrt das Bild und passt zum folgenden Gegensatz menschlicher Besiedlung.
- source_word: תַּנִּים
  choice: Schakale
  rationale: In prophetischen Schilderungen verwüsteter Orte bezeichnet das Wort wahrscheinlich Schakale beziehungsweise entsprechende Wüstentiere, nicht mythische Drachen.
- source_word: שְׁמָמָה
  choice: zur Einöde
  rationale: Die nominale Form bezeichnet einen verwüsteten, menschenleeren Ort; „Einöde“ ist knapp und erhält den Charakter der Gerichtsformel.
- source_word: עַד עוֹלָם
  choice: für immer
  rationale: Natürliche deutsche Wiedergabe der unbestimmt andauernden beziehungsweise dauerhaften Zeitangabe im Gerichtskontext.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: Kein Mann wird dort wohnen
  rationale: Die Formulierung erhält das maskuline Singularwort אִישׁ und gibt יָשַׁב im Siedlungskontext mit „wohnen“ wieder.
- source_word: וְלֹא יָגוּר בָּהּ
  choice: und … wird sich darin aufhalten
  rationale: גוּר kann den vorübergehenden Aufenthalt oder das Wohnen als Fremder bezeichnen. „Sich aufhalten“ wahrt den Unterschied zu „wohnen“, ohne eine im Kontext nicht sichere Einzelnuance festzulegen.
- source_word: בֶּן אָדָם
  choice: Menschenkind
  rationale: Die wörtlich geprägte deutsche Entsprechung bewahrt die parallele menschliche Bezeichnung und ist hier als allgemeiner Ausdruck für einen Menschen verständlich.
theological_decisions:
- issue: Generische menschliche Bezeichnungen in der Gerichtsformel
  choice: „Kein Mann … kein Menschenkind“ im Haupttext
  alternative: „Niemand … kein Mensch“
  rationale: Der hebräische Text setzt אִישׁ und בֶּן אָדָם parallel ein. Die gewählte Fassung erhält diese beiden unterschiedlichen, formal maskulinen Ausdrücke; die Fußnote erläutert ihren allgemeinen Bezug, ohne die poetische Parallelität stillschweigend einzuebnen.
- issue: Bedeutungsumfang von גוּר
  choice: „sich aufhalten“
  alternative: „als Fremder wohnen“
  rationale: Das Verb kann speziell den Aufenthalt als Fremder bezeichnen, doch die Ruinenformel kann allgemeiner jeden menschlichen Aufenthalt ausschließen. Die Hauptfassung lässt diesen Spielraum bestehen; die engere Möglichkeit wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper prophetischer Satzführung. „Wohnstätte“ und „Einöde“ sind gehoben, aber allgemein verständlich; „Menschenkind“ erhält die hebräische Parallelform, während die Fußnote den generischen Sinn klärt.
