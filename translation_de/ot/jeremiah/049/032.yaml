  text: וְ/הָי֨וּ גְמַלֵּי/הֶ֜ם לָ/בַ֗ז וַ/הֲמ֤וֹן מִקְנֵי/הֶם֙ לְ/שָׁלָ֔ל וְ/זֵרִתִ֥י/ם לְ/כָל ר֖וּחַ קְצוּצֵ֣י פֵאָ֑ה וּ/מִ/כָּל עֲבָרָ֛י/ו אָבִ֥יא אֶת אֵידָ֖/ם נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/032.yaml
  text: Their camels will become plunder[a], and their many livestock spoil. I will scatter to every wind those who cut the corners of their hair, and from all sides of them I will bring their disaster[b], declares Yahweh.
translation:
  language: de
  text: Ihre Kamele werden zur Beute und ihr zahlreiches Vieh zum Raubgut. Ich werde die, die das Haar an den Seiten stutzen[a], in alle Winde zerstreuen; von allen Seiten her werde ich Unheil über sie bringen[b] – Spruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die an der Seite/Ecke Gestutzten“. Gemeint ist wahrscheinlich eine charakteristische Haartracht mit kurz geschnittenem Haar an den Seiten; ob Haar oder Bart genauer gemeint ist, bleibt unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „aus jedem Gebiet rings um sie“. Das Hebräische hat wörtlicher „von all seinen Seiten“; die maskuline Singularform kann die betroffene Gruppe als Einheit auffassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְמַלֵּיהֶם
  choice: ihre Kamele
  rationale: Das Substantiv bezeichnet hier eindeutig Kamele; die allgemeine deutsche Bezeichnung ist natürlich und vermeidet eine unbelegte Spezifizierung als Dromedare.
- source_word: לָבַז
  choice: zur Beute
  rationale: Die Wendung beschreibt, dass die Kamele von Feinden erbeutet werden. „Zur Beute werden“ ist im Deutschen klar und idiomatisch.
- source_word: הֲמוֹן מִקְנֵיהֶם
  choice: ihr zahlreiches Vieh
  rationale: הֲמוֹן bezeichnet die große Menge, מִקְנֶה in diesem Zusammenhang den Viehbestand. Die kompakte Formulierung gibt beides natürlich wieder.
- source_word: לְשָׁלָל
  choice: zum Raubgut
  rationale: שָׁלָל bezeichnet erbeutetes Gut im Krieg. „Raubgut“ wahrt eine gewisse Unterscheidung zum parallelen בַז („Beute“).
- source_word: וְזֵרִתִים
  choice: ich werde … zerstreuen
  rationale: Das Verb bezeichnet hier die gewaltsame Zerstreuung eines Volkes; „zerstreuen“ passt zum folgenden Bild der Winde.
- source_word: לְכָל רוּחַ
  choice: in alle Winde
  rationale: Die bildhafte hebräische Wendung ist auch im Deutschen verständlich und bezeichnet eine Zerstreuung in alle Richtungen.
- source_word: קְצוּצֵי פֵאָה
  choice: die, die sich die Haarseiten stutzen
  rationale: Die Formulierung bezeichnet Menschen anhand einer charakteristischen Beschneidung der seitlichen Haarpartien. Die Wiedergabe erhält das Körperpflegebild, ohne Haar oder Bart übermäßig genau festzulegen.
- source_word: מִכָּל עֲבָרָיו
  choice: von allen Seiten her
  rationale: Die Wendung meint, dass das Unheil aus jeder Richtung kommt. Die deutsche Formulierung ist natürlich; die ungewöhnliche Singularendung des Hebräischen wird in einer Fußnote kenntlich gemacht.
- source_word: אָבִיא אֶת אֵידָם
  choice: werde ich ihr Unheil über sie bringen
  rationale: אֵיד bezeichnet schweres, im Gericht angekündigtes Unglück. „Unheil“ ist würdevoll und gewichtig, während „über sie bringen“ die Verursachung durch Jahwe ausdrückt.
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in geläufigem, feierlichem Deutsch wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm ausdrücklich. „Jahwe“ gibt den Eigennamen in der im Deutschen üblichen Form wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Identität der קְצוּצֵי פֵאָה
  choice: Beschreibung einer charakteristischen Haartracht
  alternative: spezifische Deutung als abgeschnittene Schläfen- oder Barthaare
  rationale: Der Ausdruck kennzeichnet die betroffene Volksgruppe durch das Beschneiden der „Seite/Ecke“. Da der genaue Körperbereich nicht völlig sicher ist, legt die Übersetzung ihn nicht enger als nötig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Begriffe בַז und שָׁלָל werden mit „Beute“ und „Raubgut“ unterschieden. Das Bild „in alle Winde“ bleibt erhalten; die schwerfällige wörtliche Wiedergabe des Suffixes in מִכָּל עֲבָרָיו wird zugunsten natürlichen Deutschen in die Fußnote verlagert.
