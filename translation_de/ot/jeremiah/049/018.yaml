source:
  edition: WLC
  text: כְּֽ/מַהְפֵּכַ֞ת סְדֹ֧ם וַ/עֲמֹרָ֛ה וּ/שְׁכֵנֶ֖י/הָ אָמַ֣ר יְהוָ֑ה לֹֽא יֵשֵׁ֥ב שָׁם֙ אִ֔ישׁ וְ/לֹֽא יָג֥וּר בָּ֖/הּ בֶּן אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
translation:
  language: de
  text: 'Wie beim Untergang Sodoms und Gomorras und ihrer Nachbarstädte[a], spricht Jahwe: Kein Mensch wird dort wohnen, und kein Menschenkind wird sich dort als Fremder aufhalten[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie Sodom und Gomorra samt ihren umliegenden Städten umgestürzt wurden.“'
    reason: lexical_alternative
  - marker: b
    text: „Menschenkind“ ist hier eine hebräische Ausdrucksweise für einen Menschen. Das Verb kann den Aufenthalt als Fremder oder zeitweiliger Bewohner bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  choice: Wie beim Untergang
  rationale: Das Präfix כ markiert einen Vergleich; מַהְפֵּכָה bezeichnet den katastrophalen Umsturz bzw. Untergang. Die nominale deutsche Fassung bewahrt die knappe hebräische Vergleichsform.
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  choice: Sodom und Gomorra und ihren Nachbarstädten
  rationale: שְׁכֵנֶיהָ bezeichnet die benachbarten Orte im Umfeld der genannten Städte. „Nachbarstädte“ macht den kollektiven Ortsbezug im Deutschen deutlich.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Die geläufige prophetische Formel wird präsentisch wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  choice: Kein Mensch wird dort wohnen
  rationale: ישׁב bezeichnet hier dauerhaftes Wohnen. אִישׁ ist in dieser Verneinungsformel generisch; „kein Mensch“ ist im modernen Deutschen natürlich und schließt alle Menschen ein.
- source_word: וְלֹא יָגוּר בָּהּ
  choice: und kein Menschenkind wird sich darin als Fremder aufhalten
  rationale: גור bezeichnet den Aufenthalt als Fremder oder zeitweiliger Bewohner und wird deshalb nicht mit dem allgemeineren „wohnen“ gleichgesetzt. בָּהּ wird sachbezogen mit „darin“ wiedergegeben.
- source_word: בֶּן אָדָם
  choice: Menschenkind
  rationale: Die wörtlich geprägte deutsche Wendung bewahrt die Parallelität mit אִישׁ und bezeichnet hier schlicht einen Menschen, nicht einen messianischen Titel.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt durch einen Titel ersetzt zu werden.
- issue: Anthropologische Sprache der Verwüstungsformel
  choice: Kein Mensch ... kein Menschenkind
  alternative: Niemand ... kein Sterblicher
  rationale: Die Formulierung bewahrt die zweigliedrige Ausdrucksweise des Hebräischen, ohne sie im Deutschen exklusiv männlich erscheinen zu lassen.
- issue: Bedeutung von בֶּן אָדָם in diesem Kontext
  choice: allgemeine Bezeichnung für einen Menschen
  alternative: messianischer Titel „Menschensohn“
  rationale: Im parallelen Verwüstungsspruch bezeichnet die Wendung einen gewöhnlichen Menschen; ein titularer oder messianischer Sinn liegt hier nicht nahe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Gerichtsformel und die Unterscheidung zwischen dauerhaftem Wohnen und dem Aufenthalt als Fremder bleiben erhalten.
