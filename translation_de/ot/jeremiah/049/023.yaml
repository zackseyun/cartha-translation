source:
  edition: WLC
  text: לְ/דַמֶּ֗שֶׂק בּ֤וֹשָֽׁה חֲמָת֙ וְ/אַרְפָּ֔ד כִּי שְׁמֻעָ֥ה רָעָ֛ה שָׁמְע֖וּ נָמֹ֑גוּ בַּ/יָּ֣ם דְּאָגָ֔ה הַשְׁקֵ֖ט לֹ֥א יוּכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
translation:
  language: de
  text: 'Über Damaskus:

    Hamat und Arpad stehen beschämt da,

    denn sie haben eine schlimme Nachricht gehört.

    Sie schmelzen dahin.

    Angst ist wie das Meer[a];

    es kann nicht zur Ruhe kommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hebräische Wortlaut ist schwierig; wörtlich etwa: „im/am Meer Angst; ruhig werden kann es nicht“. Gemeint sein kann, dass ihre Angst dem ruhelosen Meer gleicht, oder dass am Meer Angst herrscht und es sich nicht beruhigen kann.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  choice: Über Damaskus
  rationale: Das vorangestellte לְ leitet hier die Überschrift eines prophetischen Ausspruchs ein. „Über“ ist im Deutschen natürlich und legt die Aussage weniger stark als „gegen“ ausschließlich auf Gericht fest.
- source_word: בּוֹשָׁה
  choice: stehen beschämt da
  rationale: Die feminine Singularform steht in der poetischen Aussage bei den beiden Städten Hamat und Arpad. Die Wiedergabe erfasst ihre öffentliche Beschämung und behandelt beide Ortsnamen als gemeinsamen Bezug.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamat und Arpad
  rationale: Die Ortsnamen werden in geläufiger deutscher Form wiedergegeben.
- source_word: שְׁמֻעָה רָעָה
  choice: eine schlimme Nachricht
  rationale: Die Wortverbindung bezeichnet eine Nachricht von drohendem oder eingetretenem Unheil. „Schlimme Nachricht“ ist gegenwärtiges, verständliches Deutsch, ohne den Inhalt genauer festzulegen.
- source_word: שָׁמְעוּ
  choice: haben … gehört
  rationale: Das deutsche Perfekt bringt passend zum Ausdruck, dass das Hören der Nachricht ihren gegenwärtigen Zustand ausgelöst hat.
- source_word: נָמֹגוּ
  choice: Sie schmelzen dahin
  rationale: Die Wiedergabe bewahrt das eindringliche hebräische Bild des Schmelzens beziehungsweise Auflösens, das hier den Verlust von Mut und Halt ausdrückt.
- source_word: בַּיָּם דְּאָגָה
  choice: Angst ist wie das Meer
  rationale: Der schwierige hebräische Ausdruck wird als Vergleich verstanden, der die rastlose Angst mit dem Meer verbindet. Da auch eine örtliche Deutung möglich ist, wird die Unsicherheit in einer Fußnote offengelegt.
- source_word: הַשְׁקֵט לֹא יוּכָל
  choice: es kann nicht zur Ruhe kommen
  rationale: Das Pronomen bezieht sich in der gewählten Lesart auf das Meer. „Nicht zur Ruhe kommen“ gibt die Unfähigkeit zum Stillwerden in natürlichem Deutsch wieder.
