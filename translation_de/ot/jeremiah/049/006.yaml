source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֗ן אָשִׁ֛יב אֶת שְׁב֥וּת בְּנֵֽי עַמּ֖וֹן נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
translation:
  language: de
  text: Doch danach werde ich das Geschick der Ammoniter[a] wiederherstellen, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gefangenschaft der Ammoniter wenden“. Die hebräische Wendung kann die Umkehr einer Gefangenschaft oder allgemeiner die Wiederherstellung des Geschicks bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Doch danach
  rationale: Die Wendung bezeichnet eine zeitliche Folge („danach“); „doch“ markiert zugleich den inhaltlichen Umschwung vom Gericht zur Wiederherstellung.
- source_word: אָשִׁיב
  choice: werde ich … wiederherstellen
  rationale: Der Hifil von שוב bedeutet hier „zurückbringen/wiederherstellen“ und bildet mit שְׁבוּת eine feste Wiederherstellungsformel.
- source_word: אֶת שְׁבוּת
  choice: das Geschick
  rationale: Die hebräische Wendung kann die Beendigung einer Gefangenschaft meinen, bezeichnet aber häufig allgemeiner die Wiederherstellung früherer Verhältnisse. „Das Geschick wiederherstellen“ bewahrt diese Bedeutungsbreite in idiomatischem Deutsch.
- source_word: בְּנֵי עַמּוֹן
  choice: der Ammoniter
  rationale: Wörtlich „der Söhne Ammons“; „Ammoniter“ gibt die kollektive ethnisch-nationale Bezeichnung natürlich und präzise wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feste prophetische Botenformel wird in würdigem, vertrautem Deutsch wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
theological_decisions:
- issue: Verheißung einer Wiederherstellung Ammons nach dem Gericht
  choice: Der Vers wird als echte zukünftige Wiederherstellungsverheißung für die Ammoniter wiedergegeben, ohne ihre Art oder Reichweite näher festzulegen.
  alternative: Die Aussage ausschließlich politisch zu verstehen oder sie vom nationalen Bezug zu lösen und rein zu vergeistigen.
  rationale: Der hebräische Text verheißt eine künftige Wiederherstellung, bestimmt aber weder deren genaue Gestalt noch deren Umfang. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die traditionelle prophetische Formel „spricht Jahwe“ wahrt den feierlichen Ton; „das Geschick wiederherstellen“ ist idiomatisch und lässt die Bedeutungsbreite des Hebräischen bestehen.
