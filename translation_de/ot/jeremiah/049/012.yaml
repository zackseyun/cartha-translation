source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִ֠נֵּה אֲשֶׁר אֵ֨ין מִשְׁפָּטָ֜/ם לִ/שְׁתּ֤וֹת הַ/כּוֹס֙ שָׁת֣וֹ יִשְׁתּ֔וּ וְ/אַתָּ֣ה ה֔וּא נָקֹ֖ה תִּנָּקֶ֑ה לֹ֣א תִנָּקֶ֔ה כִּ֥י שָׁתֹ֖ה תִּשְׁתֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
translation:
  language: de
  text: 'Denn so spricht der HERR: Siehe, selbst die, denen es nicht zukam, aus dem Becher zu trinken, werden gewiss trinken. Und ausgerechnet du solltest ungestraft bleiben? Du wirst nicht ungestraft bleiben[a], denn du wirst gewiss trinken.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und du solltest wirklich freigesprochen werden? Du wirst nicht freigesprochen werden.“'
    reason: lexical_alternative
  - marker: b
    text: Der „Becher“ ist hier ein prophetisches Bild für das Gericht, das Gott Menschen und Völkern auferlegt.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: der HERR
  rationale: Die im Deutschen etablierte Wiedergabe des Gottesnamens in Kapitälchen bewahrt dessen besondere Funktion und ist für gewöhnliche Leser verständlicher als eine Transliteration.
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den nachdrücklichen prophetischen Hinweis in würdigem, weiterhin verständlichem Deutsch.
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  choice: die, denen es nicht zukam, aus dem Becher zu trinken
  rationale: מִשְׁפָּט bezeichnet hier die ihnen zukommende Rechtsfolge oder das ihnen bestimmte Los. „Denen es nicht zukam“ wahrt diese Offenheit besser als das enger forensische „die nicht verurteilt waren“.
- source_word: הַכּוֹס
  choice: der Becher
  rationale: Die konkrete prophetische Metapher bleibt erhalten, ohne sie im Haupttext ausdrücklich als Zorn oder Gericht auszudeuten.
- source_word: שָׁתוֹ יִשְׁתּוּ
  choice: müssen daraus trinken
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb betont Gewissheit beziehungsweise Unausweichlichkeit. „Müssen“ gibt dies idiomatisch wieder; „daraus“ macht den deutschen Bezug zum Becher klar.
- source_word: וְאַתָּה הוּא
  choice: Und ausgerechnet du
  rationale: Gibt die betonte und konfrontative Anrede natürlich wieder.
- source_word: נָקֹה תִּנָּקֶה ... לֹא תִנָּקֶה
  choice: solltest ungestraft bleiben? Du wirst nicht ungestraft bleiben
  rationale: נקה kann „freigesprochen/straflos sein“ bedeuten. Die Formulierung bewahrt den rhetorischen Gegensatz und den gerichtlichen Sinn.
- source_word: כִּי שָׁתֹה תִּשְׁתֶּה
  choice: denn du musst daraus trinken
  rationale: Die emphatische Konstruktion bezeichnet die sichere, unausweichliche Teilnahme am bildhaften Trinken.
theological_decisions:
- issue: Bedeutung des Bechers
  choice: Die Metapher „der Becher“ bleibt im Haupttext ohne ergänzendes „des Zorns“ oder „des Gerichts“ stehen.
  alternative: der Becher des Zorns / der Becher des Gerichts
  rationale: Der weitere prophetische Zusammenhang legt göttliches Gericht nahe, doch der hebräische Vers nennt nur den Becher. Eine explizite Ergänzung würde die Metapher stärker auslegen als der Ausgangstext.
- issue: Rechtliche Bedeutung von מִשְׁפָּט und נקה
  choice: מִשְׁפָּט wird offen mit „zukam“ wiedergegeben, נקה im Kontext mit „ungestraft bleiben“.
  alternative: „nicht dazu verurteilt waren“ und „freigesprochen werden“
  rationale: So bleibt bei מִשְׁפָּט die mögliche Bedeutung von Rechtsanspruch, Gebühr oder bestimmtem Los erhalten, während bei נקה die rhetorische Frage im Deutschen verständlich bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Siehe“ hält den feierlich-prophetischen Ton; „ausgerechnet du“ vermittelt die zugespitzte Anrede idiomatisch. Die Wiederholung von „ungestraft bleiben“ und „trinken“ bildet den Nachdruck des Hebräischen ab.
