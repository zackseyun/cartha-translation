source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
translation:
  language: de
  text: 'Seht: Wie ein Löwe wird er aus dem Dickicht am Jordan[a] heraufkommen, zu einer sicheren Weide. Denn in einem Augenblick werde ich ihn von ihr fortjagen; und wer ist der Erwählte, den ich über sie einsetzen werde? Denn wer ist mir gleich, und wer kann mich vorladen[b]? Und wer ist der Hirte, der vor mir bestehen kann?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „aus dem Stolz“ oder „aus der Pracht des Jordan“; die hebräische Wendung bezeichnet hier wahrscheinlich den dichten Bewuchs am Jordan.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „wer kann mir einen Zeitpunkt bestimmen?“ beziehungsweise „wer kann mich zu einer Begegnung bestellen?“ Das hebräische Verb kann einen rechtlichen Klang haben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Seht
  rationale: Die deiktische Einleitung wird als unmittelbarer Aufmerksamkeitsruf wiedergegeben; „Seht“ ist im heutigen Deutsch verständlich und bewahrt die anschauliche Dringlichkeit.
- source_word: כְּאַרְיֵה
  choice: wie ein Löwe
  rationale: Das ausdrücklich gesetzte Gleichnis wird formal bewahrt.
- source_word: יַעֲלֶה
  choice: wird er … heraufkommen
  rationale: עלה bezeichnet eine aufwärts gerichtete Bewegung; „heraufkommen“ passt zum Bild eines aus dem Jordantal vordringenden Löwen.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  choice: aus dem Dickicht am Jordan
  rationale: גאון bedeutet gewöhnlich „Stolz/Pracht/Hoheit“, bezeichnet in dieser wiederkehrenden Wendung aber wahrscheinlich den üppigen Uferbewuchs des Jordan. Die konkrete kontextuelle Bedeutung steht im Text, die wörtlichere Möglichkeit in der Fußnote.
- source_word: נְוֵה אֵיתָן
  choice: eine sichere Weide
  rationale: נוה kann Weide oder Wohnstätte bedeuten, איתן Festigkeit, Dauer oder Sicherheit. Die Wiedergabe erhält das Weidebild und den Gedanken vermeintlicher Sicherheit.
- source_word: כִּי אַרְגִּיעָה
  choice: Denn in einem Augenblick
  rationale: Die Form von רגע drückt hier wahrscheinlich Plötzlichkeit beziehungsweise Kürze aus. Die adverbiale Wiedergabe ist natürlich und lässt den folgenden Kausativsatz klar hervortreten.
- source_word: אֲרִיצֶנּוּ מֵעָלֶיהָ
  choice: werde ich ihn von ihr fortjagen
  rationale: Der Kausativ bezeichnet, dass jemand zum schnellen Weggehen gebracht wird. „Fortjagen“ gibt diese Wirkung knapp wieder; die männliche und weibliche Pronominalreferenz bleibt wie im Hebräischen stehen.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  choice: und wen immer ich erwähle, den werde ich über sie einsetzen
  rationale: Die gedrängte Konstruktion verbindet den Erwählten mit dem göttlichen Einsetzen. „Wen immer“ wahrt die Offenheit der Person, und „über sie einsetzen“ entspricht der Leitungsbedeutung von פקד.
- source_word: מִי כָמוֹנִי
  choice: wer ist mir gleich
  rationale: Die rhetorische Aussage der Unvergleichlichkeit wird direkt wiedergegeben.
- source_word: וּמִי יוֹעִידֶנִּי
  choice: wer kann mich vorladen
  rationale: Der Hiphil von יעד kann das Ansetzen einer Begegnung oder ein Vorladen bezeichnen. Der rechtliche Klang der göttlichen Herausforderung wird mit „vorladen“ bewahrt, ohne im Haupttext eine vollständige Gerichtsszene auszubauen.
- source_word: רֹעֶה
  choice: Hirte
  rationale: Die wörtliche Hirtenmetapher bleibt erhalten, obwohl damit im Zusammenhang ein Herrscher oder Anführer gemeint sein kann.
- source_word: יַעֲמֹד לְפָנָי
  choice: kann vor mir bestehen
  rationale: Die rhetorische Frage betrifft nicht nur zukünftiges Stehen, sondern die Fähigkeit, sich vor dem Sprecher zu behaupten. „Bestehen“ gibt diese Herausforderung idiomatisch wieder.
theological_decisions:
- issue: Identität des Sprechers in den Ich-Aussagen
  choice: Die erste Person wird als Rede Gottes bewahrt, ohne im Vers ausdrücklich „der HERR“ einzufügen.
  alternative: Den Sprecher durch „spricht der HERR“ oder ein ausdrücklich genanntes göttliches Subjekt identifizieren.
  rationale: Der Zusammenhang kennzeichnet die Rede als Gotteswort, doch der hebräische Vers selbst gebraucht nur die erste Person. Die Übersetzung fügt keinen Gottesnamen hinzu.
- issue: Bedeutung des Hirtenbildes
  choice: Das Bild „Hirte“ bleibt im Haupttext stehen.
  alternative: Mit „Herrscher“ oder „Anführer“ die politische Bedeutung ausdrücklich machen.
  rationale: Das Bild gehört zur inneren Bildwelt des Verses und darf nicht zugunsten einer einzigen metaphorischen Auslegung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Der Aufmerksamkeitsruf „Seht“ erhält die Lebendigkeit der Eröffnung. Das Löwen- und Hirtenbild sowie die nicht ausdrücklich aufgelösten Pronomen werden bewahrt; stärker erklärende Deutungen stehen nur in den Fußnoten.
