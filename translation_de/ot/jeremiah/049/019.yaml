  terminology: „Dickicht am Jordan“, „sichere Weide“, „vorladen“ und „Hirte“ sind tragfähige Wiedergaben. Die Fußnoten bewahren die wesentlichen lexikalischen Alternativen. „Erwählter“ erhält die passive/offene Nuance von בָּחוּר besser als das aktive „wen immer ich erwähle“.
