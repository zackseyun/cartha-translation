  text: מִ/קּ֣וֹל נִפְלָ֔/ם רָעֲשָׁ֖ה הָ/אָ֑רֶץ צְעָקָ֕ה בְּ/יַם ס֖וּף נִשְׁמַ֥ע קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/021.yaml
  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
translation:
  language: de
  text: Vom Schall ihres Falls erbebt die Erde; ihr Schrei ist am Schilfmeer[a] zu hören.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell: „Rotes Meer“. Hebräisch: „Schilfmeer“.'
