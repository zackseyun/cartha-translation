lexical_decisions:
- source_word: מִקּוֹל נִפְלָם
  choice: Vom Lärm ihres Falls
  rationale: מִן bezeichnet hier Quelle oder Anlass; קוֹל ist in Verbindung mit einem katastrophalen Fall natürlich als weithin vernehmbarer „Lärm“ wiedergegeben. „Falls“ bewahrt das Bild des hebräischen נפל, ohne es deutend zu „Untergang“ zu erweitern.
- source_word: רָעֲשָׁה הָאָרֶץ
  choice: erbebt die Erde
  rationale: רעשׁ bezeichnet heftiges Beben oder Erschüttern. „Erbebt“ gibt die Wucht des Bildes in natürlichem, würdigem Deutsch wieder; הָאָרֶץ bleibt als „die Erde“ in seiner umfassenden Aussage erhalten.
- source_word: צְעָקָה ... נִשְׁמַע קוֹלָהּ
  choice: ihr Schrei ist ... zu hören
  rationale: קוֹלָהּ („ihre Stimme/ihr Laut“) verweist mit femininem Suffix auf צְעָקָה („Schrei“). Die zusammengezogene Wiedergabe vermeidet im Deutschen eine schwerfällige Wiederholung und bewahrt den Sinn.
- source_word: בְּיַם סוּף
  choice: am Schilfmeer
  rationale: יַם סוּף bedeutet wörtlich „Schilfmeer“ und ist im Deutschen eine geläufige, quellennähere Bezeichnung. Die traditionelle Alternative „Rotes Meer“ wird in der Fußnote genannt.
