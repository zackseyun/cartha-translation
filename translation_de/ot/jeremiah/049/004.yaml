source:
  edition: WLC
  text: מַה תִּתְהַֽלְלִי֙ בָּֽ/עֲמָקִ֔ים זָ֣ב עִמְקֵ֔/ךְ הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה הַ/בֹּֽטְחָה֙ בְּ/אֹ֣צְרֹתֶ֔י/הָ מִ֖י יָב֥וֹא אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
translation:
  language: de
  text: 'Warum rühmst du dich deiner Täler – deines fließenden Tales[a] –, du treulose Tochter, die auf ihre Schätze vertraut und sagt: »Wer wird gegen mich ziehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »deines wasserreichen Tales«, »deines überfließenden Tales« oder »deines fruchtbaren Tales«. Der hebräische Ausdruck ist schwierig und kann auf den Wasserreichtum oder die Fruchtbarkeit des Tales, möglicherweise auch auf seine geschützte Lage, anspielen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלְלִי
  choice: rühmst du dich
  rationale: Der Hitpael von הלל bezeichnet hier reflexive Selbsterhebung. »Sich rühmen« ist idiomatisches, würdevolles Deutsch und bewahrt den tadelnden Ton.
- source_word: בָּעֲמָקִים
  choice: deiner Täler
  rationale: עֵמֶק bedeutet konkret »Tal«. Der deutsche Genitiv nach »sich rühmen« gibt die Verbindung natürlich wieder und bewahrt den geografischen Bezug.
- source_word: זָב עִמְקֵךְ
  choice: deines dahinfließenden Tales
  rationale: Die schwierige Verbindung wird möglichst bildnah wiedergegeben. זָב bezeichnet etwas Fließendes; ob Wasserreichtum, Überfluss oder ein Dahinschwinden gemeint ist, bleibt unsicher und wird in der Fußnote offengehalten.
- source_word: הַבַּת הַשּׁוֹבֵבָה
  choice: du treulose Tochter
  rationale: שׁוֹבֵבָה bezeichnet hier eine abtrünnige beziehungsweise widerspenstige Haltung. »Treulos« ist im heutigen Deutsch natürlich, wahrt den Beziehungskontext und legt nicht ausdrücklich vollständigen Abfall fest.
- source_word: הַבֹּטְחָה בְּאֹצְרֹתֶיהָ
  choice: die auf ihre Schätze vertraut
  rationale: אֹצָר kann Schatz, Vorrat oder Schatzkammer bezeichnen. »Schätze« erfasst den angehäuften Reichtum als Grundlage falscher Sicherheit; die feminine Personifikation bleibt erhalten.
- source_word: מִי יָבֹוא אֵלָי
  choice: Wer wird gegen mich ziehen?
  rationale: אֶל bedeutet grundsätzlich »zu/auf … hin«, erhält im feindlichen Kontext jedoch adversative Bedeutung. »Gegen mich ziehen« drückt den erwarteten Angriff aus, ohne die Aussage unnötig auszudeuten.
theological_decisions:
- issue: Personifikation Ammons als feminine Einzelfigur
  choice: Die feminine Personifikation wird als »Tochter« mit den entsprechenden Pronomen beibehalten.
  alternative: Interpretierend mit »treuloses Volk« übersetzen.
  rationale: Der hebräische Text redet die politische Größe ausdrücklich als Tochter an. Die Bewahrung dieses Bildes erhält die prophetische Rhetorik und vermeidet eine sachlich-abstrakte Glättung.
- issue: Bedeutung der Bezeichnung שׁוֹבֵבָה
  choice: »treulos«
  alternative: »abtrünnig«, »widerspenstig« oder »abgefallen«
  rationale: »Treulos« wahrt die moralisch-relationale Spannung, ohne eine bestimmte dogmatische Vorstellung von Abfall oder Rückkehr in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und das Bild der Tochter bleiben erhalten. Der eingeschobene Gedankenstrich markiert die schwer verständliche nähere Bestimmung des Tales, ohne ihre Mehrdeutigkeit im Haupttext aufzulösen.
