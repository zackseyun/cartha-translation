source:
  edition: WLC
  text: רָפְתָ֥ה דַמֶּ֛שֶׂק הִפְנְתָ֥ה לָ/נ֖וּס וְ/רֶ֣טֶט הֶחֱזִ֑יקָה צָרָ֧ה וַ/חֲבָלִ֛ים אֲחָזַ֖תָּ/ה כַּ/יּוֹלֵדָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
translation:
  language: de
  text: Damaskus ist kraftlos geworden[a]; es hat sich zur Flucht gewandt, und Zittern hat es gepackt[b]. Bedrängnis und Wehen[c] haben es ergriffen, wie eine Gebärende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ist schwach geworden“ beziehungsweise „hat den Mut verloren“. Das hebräische Verb kann sowohl das Nachlassen der Kraft als auch den Verlust des Mutes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Zittern“. Gemeint ist wahrscheinlich ein Beben aus Furcht; möglich wäre daher auch: „Schrecken hat es gepackt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Schmerzen“. Wegen des folgenden Vergleichs mit einer Gebärenden sind wahrscheinlich Geburtswehen gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  choice: ist kraftlos geworden
  rationale: Das Verb רפה bezeichnet hier ein Schwachwerden oder den Verlust von Kraft und Mut. „Kraftlos geworden“ bewahrt beide möglichen Aspekte, ohne die Aussage auf bloße Angst zu verengen.
- source_word: דַמֶּשֶׂק
  choice: Damaskus
  rationale: Eingebürgerte deutsche Form des Ortsnamens. Das grammatisch feminine Hebräisch personifiziert die Stadt; im Deutschen wird das sächliche Pronomen verwendet.
- source_word: הִפְנְתָה לָנוּס
  choice: hat sich zur Flucht gewandt
  rationale: Gibt die Verbindung aus „sich wenden“ und dem Infinitiv „fliehen“ eng und zugleich verständlich wieder.
- source_word: וְרֶטֶט
  choice: und Zittern
  rationale: רטט bezeichnet körperliches Zittern oder Beben, wahrscheinlich aus Furcht. „Zittern“ erhält das konkrete Bild und legt dessen Ursache nicht ausdrücklich fest.
- source_word: הֶחֱזִיקָה
  choice: hat es gepackt
  rationale: Die Hifil-Form von חזק beschreibt ein festes Ergreifen. „Gepackt“ ist im Deutschen mit „Zittern“ idiomatisch und anschaulich.
- source_word: צָרָה
  choice: Bedrängnis
  rationale: צרה kann Not, Bedrängnis oder Angst bezeichnen. „Bedrängnis“ wahrt die Breite des Ausdrucks und passt zum Parallelismus.
- source_word: וַחֲבָלִים
  choice: und Wehen
  rationale: חבלים kann Schmerzen oder Geburtswehen meinen. Der anschließende Vergleich mit einer Gebärenden macht hier die geburtliche Bedeutung wahrscheinlich.
- source_word: אֲחָזַתָּה
  choice: haben es ergriffen
  rationale: אחז bedeutet „ergreifen, festhalten“. Die Wiedergabe bewahrt die Personifikation, verwendet aber entsprechend dem deutschen Genus von „Damaskus“ das Pronomen „es“.
- source_word: כַּיּוֹלֵדָה
  choice: wie eine Gebärende
  rationale: Das feminine Partizip von ילד bezeichnet eine Frau beim Gebären. „Eine Gebärende“ ist prägnant, würdevoll und erhält den direkten Vergleich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die hebräische Bildsprache. Die Stadt bleibt personifiziert; wegen des deutschen grammatischen Geschlechts von „Damaskus“ stehen jedoch sächliche Pronomen. Die Wiederholung verschiedener Verben für „packen/ergreifen“ bildet die beiden unterschiedlichen hebräischen Verben ab.
