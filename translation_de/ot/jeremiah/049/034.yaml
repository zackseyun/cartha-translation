  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל עֵילָ֑ם בְּ/רֵאשִׁ֗ית מַלְכ֛וּת צִדְקִיָּ֥ה מֶֽלֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/034.yaml
  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
translation:
  language: de
  text: 'Das Wort Jahwes, das zu Beginn der Herrschaft Zedekias, des Königs von Juda, an den Propheten Jeremia über Elam erging, lautete:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר יְהוָה
  choice: Das Wort Jahwes
  rationale: Bewahrt die geprägte prophetische Offenbarungsformel und gibt den Gottesnamen als Eigennamen wieder.
- source_word: הָיָה ... אֶל יִרְמְיָהוּ הַנָּבִיא
  choice: das an den Propheten Jeremia erging
  rationale: „Erging an“ ist im Deutschen eine natürliche, würdige Entsprechung der prophetischen Wortereignisformel; Titel und Empfänger bleiben ausdrücklich erhalten.
- source_word: אֶל עֵילָם
  choice: über Elam
  rationale: Die neutrale Wiedergabe wahrt, dass die Präposition ein an beziehungsweise gegen Elam gerichtetes Orakel einleiten kann, ohne den feindlichen Sinn im Haupttext vorwegzunehmen.
- source_word: בְּרֵאשִׁית מַלְכוּת
  choice: zu Beginn der Herrschaft
  rationale: Bezeichnet den frühen Zeitraum der königlichen Regierung und klingt in modernem Standarddeutsch natürlich.
- source_word: צִדְקִיָּה מֶלֶךְ יְהוּדָה
  choice: Zedekias, des Königs von Juda
  rationale: Die deutsche Genitivapposition stellt Zedekia eindeutig als König von Juda vor und bewahrt die Information des hebräischen Ausdrucks.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt erfüllt im Deutschen idiomatisch die Funktion, die folgende Gottesrede einzuleiten; ein zusätzliches „indem er sprach“ wäre schwerfälliger.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen; „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Richtung des Orakels אֶל עֵילָם
  choice: über Elam
  alternative: gegen Elam
  rationale: Die Präposition kann hier das Thema oder die Zielrichtung des Orakels bezeichnen. Der Haupttext bleibt neutral; die mögliche Gerichtsrichtung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel wird knapp und bibelsprachlich vertraut wiedergegeben, ohne unnötige Archaismen; der abschließende Doppelpunkt leitet die folgende Rede natürlich ein.
