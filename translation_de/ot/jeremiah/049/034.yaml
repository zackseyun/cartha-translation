    rationale: Ein bloßer Doppelpunkt kann die Anschlussfunktion anzeigen, lässt die im Hebräischen ausdrücklich markierte Redeeinleitung aber nur implizit. »lautete:« gibt die Funktion präzise und natürlich wieder.
  revised_text: 'Das Wort Jahwes, das zu Beginn der Herrschaft Zedekias, des Königs von Juda, an den Propheten Jeremia über Elam erging, lautete:'
  revised_footnotes:
  - marker: a
    text: 'Oder: »gegen Elam«. Die hebräische Präposition kann ein an ein Volk gerichtetes Orakel einleiten und je nach Zusammenhang mit »über« oder »gegen« wiedergegeben werden.'
