source:
  edition: WLC
  text: וְ/הִצַּ֥תִּי אֵ֖שׁ בְּ/חוֹמַ֣ת דַּמָּ֑שֶׂק וְ/אָכְלָ֖ה אַרְמְנ֥וֹת בֶּן הֲדָֽד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/027.yaml
  text: And I will kindle a fire in the wall of Damascus[a], and it will consume the palaces of Ben-hadad.
translation:
  language: de
  text: Und ich werde ein Feuer in der Mauer von Damaskus entzünden[a], und es wird die Paläste Ben-Hadads verzehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an der Mauer von Damaskus“. Die Präposition lässt unterschiedliche räumliche Nuancen zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּתִּי
  choice: Und ich werde … Feuer … legen
  rationale: Das Hifil Perfekt 1. Person Singular von יצת mit vorangestelltem ו drückt im prophetischen Gerichtswort das unmittelbare Verursachen eines Feuers aus. Die deutsche Wendung „Feuer an etwas legen“ ist natürlich und bewahrt den kausativen Sinn.
- source_word: אֵשׁ
  choice: Feuer
  rationale: Im Deutschen steht der Stoff- bzw. Vorgangsbegriff in der festen Wendung „Feuer legen“ idiomatisch ohne unbestimmten Artikel.
- source_word: בְּחוֹמַת
  choice: an die Mauer von
  rationale: ב mit חוֹמָה kann hier eine räumliche Beziehung bezeichnen, deren genaue Nuance offenbleibt. „An die Mauer“ ist im Deutschen im Zusammenhang mit „Feuer legen“ idiomatisch; die Alternative „in der Mauer“ wird in der Fußnote erhalten.
- source_word: דַּמָּשֶׂק
  choice: Damaskus
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: וְאָכְלָה
  choice: und es wird … verzehren
  rationale: Das Qal Perfekt 3. Person Femininum Singular bezieht sich auf אֵשׁ. „Verzehren“ bewahrt das kraftvolle hebräische Bild vom fressenden Feuer und klingt in einem würdevollen modernen Register natürlich.
- source_word: אַרְמְנוֹת
  choice: die Paläste
  rationale: אַרְמוֹן bezeichnet häufig einen Palast oder einen befestigten herrschaftlichen Bau. „Paläste“ passt zum Bezug auf Ben-Hadad, ohne den Ausdruck einseitig als Festungen zu bestimmen.
- source_word: בֶּן הֲדָד
  choice: Ben-Hadad
  rationale: Geläufige deutsche Umschrift des zusammengesetzten Königsnamens bzw. Herrschertitels.
theological_decisions:
- issue: Unausgesprochener göttlicher Sprecher und Urheber des Gerichts
  choice: Die erste Person wird unmittelbar mit „ich werde“ wiedergegeben, ohne den Sprecher im Vers zusätzlich zu benennen.
  alternative: '„Der HERR sagt: Ich werde …“'
  rationale: Der Vers setzt die prophetische Gottesrede fort. Die Übersetzung bewahrt ihre Direktheit und fügt keine im hebräischen Vers fehlende Sprecherformel ein.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Das Bild des von Gott gelegten und die Paläste verzehrenden Feuers bleibt erhalten; die räumliche Mehrdeutigkeit der Präposition wird durch eine Fußnote kenntlich gemacht.
