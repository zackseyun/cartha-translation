id: JER.49.3
reference: Jeremiah 49:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
translation:
  language: de
  text: Jammere, Heschbon, denn Ai ist verwüstet! Schreit, ihr Töchter Rabbas! Legt Sackleinen an, trauert und zieht zwischen den Mauern umher! Denn ihr König[a] wird in die Verbannung gehen, zusammen mit seinen Priestern und seinen führenden Männern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Milkom wird in die Verbannung gehen.“ Der hebräische Konsonantentext kann hier statt „ihr König“ auch als Name des ammonitischen Gottes Milkom gelesen werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Jammere
  rationale: Der feminine Singularimperativ von ילל fordert die als Frau angeredete Stadt zu lautem Klagen auf. „Jammere“ ist im heutigen Deutsch verständlich und würdevoll; „heule“ wäre zwar lautmalerischer, klänge hier aber leicht abwertend.
- source_word: חֶשְׁבּוֹן
  choice: Heschbon
  rationale: Der Ortsname wird in der im Deutschen üblichen bibelnahen Form wiedergegeben.
- source_word: שֻׁדְּדָה
  choice: ist verwüstet
  rationale: Das Passiv von שׁדד bezeichnet gewaltsame Verheerung, häufig einschließlich Plünderung. „Verwüstet“ bewahrt diese Bedeutungsbreite besser als das engere „geplündert“.
- source_word: עַי
  choice: Ai
  rationale: Der masoretische Text bietet den Ortsnamen Ai; mögliche Textänderungen zu Ar werden nicht in den Haupttext übernommen.
- source_word: צְעַקְנָה
  choice: Schreit
  rationale: Der feminine Pluralimperativ von צעק bezeichnet einen lauten Hilferuf oder Klageschrei. „Schreit“ gibt die Dringlichkeit knapp und natürlich wieder.
- source_word: בְּנוֹת רַבָּה
  choice: ihr Töchter Rabbas
  rationale: Die wörtliche Bildrede „Töchter Rabbas“ kann Einwohnerinnen oder abhängige Ortschaften bezeichnen. Die feminine Anrede wird bewahrt, ohne die Mehrdeutigkeit durch eine erklärende Umschreibung festzulegen.
- source_word: חֲגֹרְנָה שַׂקִּים
  choice: Legt Sackleinen an
  rationale: Die Wendung bezeichnet das Anlegen groben Trauerstoffs. „Sackleinen“ hält den konkreten kulturellen Ausdruck fest und ist verständlicher als das wörtliche „gürtet euch mit Säcken“.
- source_word: סְפֹדְנָה
  choice: trauert
  rationale: ספד bezeichnet rituelles Klagen und Trauern angesichts von Tod oder Unheil. „Trauert“ fügt sich idiomatisch in die Imperativreihe ein.
- source_word: וְהִתְשׁוֹטַטְנָה
  choice: und irrt ... um
  rationale: Die Verbform beschreibt unruhiges Umherziehen. „Umherirren“ vermittelt sowohl die Bewegung als auch die Ratlosigkeit der Trauernden.
- source_word: בַּגְּדֵרוֹת
  choice: zwischen den Mauern
  rationale: גדרות kann Mauern, Zäune oder Einfriedungen bezeichnen. Im städtischen Klagekontext ist „zwischen den Mauern“ eine natürliche Wiedergabe, ohne genauer festzulegen, um welche eingefriedeten Bereiche es sich handelt.
- source_word: מַלְכָּם
  choice: ihr König
  rationale: Die masoretische Vokalisierung liest das Wort als „ihr König“. Der unvokalisierte Konsonantentext lässt zugleich den Namen des ammonitischen Gottes Milkom zu; diese bedeutsame Alternative wird in einer Fußnote erhalten.
- source_word: בַּגּוֹלָה יֵלֵךְ
  choice: wird in die Verbannung gehen
  rationale: Die Formulierung bezeichnet die Wegführung aus dem eigenen Land. „In die Verbannung gehen“ gibt die Exilvorstellung in klarem modernem Deutsch wieder.
- source_word: כֹּהֲנָיו וְשָׂרָיו
  choice: seinen Priestern und seinen führenden Männern
  rationale: כֹּהֲנָיו bedeutet „seine Priester“. שָׂרָיו bezeichnet ranghohe Amtsträger oder Obere; „führende Männer“ wahrt die soziale und politische Breite besser als das modern institutionelle „Beamte“.
theological_decisions:
- issue: Bezeichnet מַלְכָּם einen menschlichen König oder den ammonitischen Gott Milkom?
  choice: ihr König
  alternative: Milkom
  rationale: Die masoretische Punktierung stützt „ihr König“, und die folgenden Possessivformen „seine Priester“ und „seine führenden Männer“ lassen sich damit syntaktisch stimmig verbinden. Da derselbe Konsonantenbestand jedoch als Gottesname Milkom verstanden werden kann und der ammonitische Zusammenhang dafür spricht, wird die Alternative ausdrücklich in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftiger prophetischer Klagesprache. Die Folge kurzer Imperative bildet den Rhythmus des Hebräischen nach. Ortsnamen und das konkrete Trauerzeichen „Sackleinen“ bleiben sichtbar; echte lexikalische und theologische Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
