  text: אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ לֹ֥א יַשְׁאִ֖רוּ עֽוֹלֵל֑וֹת אִם גַּנָּבִ֥ים בַּ/לַּ֖יְלָה הִשְׁחִ֥יתוּ דַיָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
translation:
  language: de
  text: Wenn Traubenleser zu dir kämen, ließen sie nicht Nachlese übrig? Wenn Diebe nachts kämen, würden sie nur so viel zerstören, bis sie genug hätten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihr Genüge“. Die knappe hebräische Wendung ist idiomatisch; gemeint ist wohl, dass sie nur so viel zerstören würden, wie ihnen selbst genügte.'
    reason: Die Fußnote erläutert die Ellipse von דַּיָּם, ohne eine irreführende pseudo-wörtliche deutsche Satzfügung zu erzeugen.
lexical_decisions:
- source_word: בֹּצְרִים
  choice: Traubenleser
  rationale: Das Wort bezeichnet Menschen, die Trauben ernten. „Traubenleser“ bewahrt das konkrete Bild des Weinbergs und ist im modernen Deutsch verständlich.
- source_word: בָּאוּ לָךְ
  choice: zu dir kämen
  rationale: Die Verbindung kann ein Kommen zu oder über jemanden ausdrücken. „Zu dir kämen“ bleibt nahe am Hebräischen; der bedrohliche Sinn ergibt sich aus dem Zusammenhang.
- source_word: עֹלֵלוֹת
  choice: eine Nachlese
  rationale: Der Ausdruck bezeichnet die nach der Ernte zurückgebliebenen Trauben. „Nachlese“ gibt den landwirtschaftlichen Fachsinn knapp wieder.
- source_word: גַּנָּבִים בַּלַּיְלָה
  choice: Diebe in der Nacht
  rationale: „Diebe“ entspricht dem Substantiv, während „in der Nacht“ die heimliche Zeit ihres Handelns natürlich wiedergibt.
- source_word: הִשְׁחִיתוּ
  choice: würden sie … zerstören
  rationale: Der Hifil-Stamm bezeichnet hier das Verderben oder Zerstören. Der deutsche Konjunktiv führt den hypothetischen Vergleich aus dem ersten Satzteil fort.
- source_word: דַיָּם
  choice: bis sie genug hätten
  rationale: Wörtlich steht „ihr Genüge“. Die gewählte idiomatische Form wahrt den Sinn, dass selbst Diebe ihr zerstörerisches Handeln begrenzen, sobald es ihnen genügt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Vergleiche bleiben als rhetorische beziehungsweise hypothetische Sätze erkennbar; die Ellipse des Verbs „kommen“ im zweiten Vergleich wird für flüssiges Deutsch ergänzt.
