  verdict: revise
  source_fidelity: 'Die Grundwiedergabe trifft den Sinn des hebräischen Urteilswortes gegen das personifizierte Edom: täuschende Abschreckung bzw. Furchtbarkeit, Hochmut, schwer zugängliche Felswohnungen, Höhenlage und das Herabbringen durch Jahwe. Die konzessive Wiedergabe von כִּי ist angemessen. Die deutsche Formulierung zur Adlermetapher sollte jedoch geändert werden: Ein Nest kann nicht sinnvoll „so hoch ... wie der Adler“ gebaut werden; der Vergleich bezieht sich auf die hochgelegene Nestanlage nach Art eines Adlers.'
  naturalness: „..., hat dich getäuscht, ebenso der Hochmut ...“ ist als Ellipse möglich, klingt im modernen Standarddeutsch aber holprig. „Ebenso wie der Hochmut deines Herzens“ ist klar und natürlich. „Hoch oben baust wie ein Adler“ gibt das Bild idiomatisch wieder.
  terminology: „Hochmut deines Herzens“, „Felsspalten“, „Jahwe“ und die feminine Anrede an das personifizierte Edom sind passend. „Besetzt hältst“ ist im befestigungsgeografischen Kontext vertretbar. „Herabbringen“ ist dem kausativen hebräischen Verb näher und weniger umgangssprachlich als „herabholen“.
