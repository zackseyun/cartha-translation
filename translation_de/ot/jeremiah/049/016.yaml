  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
translation:
  language: de
  text: Der Schrecken, den du verbreitest, hat dich getäuscht,[a] ebenso wie der Hochmut deines Herzens — du, die du in den Felsspalten wohnst[b] und die Höhe des Hügels besetzt hältst. Auch wenn du dein Nest hoch oben baust wie ein Adler, werde ich dich von dort herabbringen, spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Schrecken« beziehungsweise »deine Furchtbarkeit«; das seltene hebräische Wort kann den Schrecken bezeichnen, den Edom verbreitet, oder allgemeiner seine erschreckende Erscheinung und seinen Ruf.'
    reason: lexical_alternative
  - marker: b
    text: Die Felsspalten erinnern an Edoms scheinbar uneinnehmbare Bergfestungen.
    reason: cultural_note
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  choice: der Schrecken, den du verbreitest
  rationale: Die seltene Form bezeichnet Schrecken oder Furchtbarkeit. Im Zusammenhang ist wahrscheinlich der Schrecken gemeint, den Edom anderen einflößt; die Fußnote wahrt die mögliche allgemeinere Lesart.
- source_word: הִשִּׁיא אֹתָךְ
  choice: hat dich getäuscht
  rationale: Der Hifil von נשׁא bedeutet hier täuschen oder irreführen.
- source_word: זְדוֹן לִבֶּךָ
  choice: der Hochmut deines Herzens
  rationale: זָדוֹן bezeichnet überheblichen Stolz oder Vermessenheit; die hebräische Wendung mit »Herz« bleibt erhalten.
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע
  choice: du, die du in den Felsspalten wohnst
  rationale: Das feminine Partizip spricht Edom personifiziert direkt an und beschreibt seine schwer zugänglichen Felsensitze.
- source_word: תֹּפְשִׂי מְרוֹם גִּבְעָה
  choice: die Höhe des Hügels besetzt hältst
  rationale: תפשׂ kann »ergreifen« bedeuten, bezeichnet hier aber natürlicher das Innehaben beziehungsweise Besetzthalten einer erhöhten Wohn- oder Befestigungslage.
- source_word: כִּי תַגְבִּיהַ כַּנֶּשֶׁר קִנֶּךָ
  choice: Selbst wenn du dein Nest so hoch baust wie der Adler
  rationale: כִּי hat im Zusammenhang konzessive Kraft. Die Wiedergabe erhält das Bild des hoch gelegenen Adlernestes und macht die trotzige Sicherheit Edoms verständlich.
- source_word: מִשָּׁם אוֹרִידְךָ
  choice: werde ich dich von dort herabholen
  rationale: Der Hifil von ירד bedeutet »herabbringen«; »herabholen« bildet den Gegensatz zwischen Edoms Höhe und Jahwes Gericht idiomatisch ab.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die prophetische Schlussformel wird natürlich wiedergegeben; der Gottesname יְהוָה erscheint als »Jahwe«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als »Jahwe« wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Charakter der Sicherheit Edoms
  choice: historisch-geografische Sicherheit und daraus erwachsender Hochmut
  alternative: rein innerpsychologische Angst oder eine vom Edom-Orakel gelöste endzeitliche Deutung
  rationale: Felsspalten, Hügelhöhe und Adlernest bezeichnen Edoms schwer zugängliche Lage; der Text verbindet diese Sicherheit mit Selbsttäuschung und Hochmut, ohne weitergehende Lehrannahmen einzuführen.
- issue: Bezug von תִּפְלַצְתְּךָ
  choice: der von Edom verbreitete Schrecken
  alternative: Edoms eigener Schrecken beziehungsweise seine Furchtbarkeit
  rationale: Der Kontext begünstigt die Wirkung auf andere, doch die seltene Lexik lässt eine allgemeinere Deutung zu; diese bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Anrede. Die feminine Anrede folgt der Personifizierung Edoms im hebräischen Text. »Besetzt hältst« ist im Deutschen natürlicher als ein wörtliches »ergreifst« und bewahrt zugleich den Gedanken einer festgehaltenen Höhenlage.
