revisions:
- from: Flieht, kehrt um, zieht euch tief zurück[a], ihr Bewohner von Dedan! Denn ich bringe Esaus Verderben über ihn[b] – die Zeit ist da, in der ich ihn zur Rechenschaft ziehe.[c]
  to: Flieht, kehrt um, zieht euch tief zurück, um dort zu wohnen[a], ihr Bewohner von Dedan! Denn ich bringe Esaus Unheil über ihn[b], wenn ich ihn zur Rechenschaft ziehe.[c]
  rationale: Die Revision entfernt die nicht ausdrücklich im Ausgangstext enthaltene Feststellung „die Zeit ist da“, erhält die zeitliche Verknüpfung der Strafheimsuchung und verdeutlicht bei der dritten Aufforderung den im Infinitiv לָשֶׁבֶת enthaltenen Zweck des Wohnens. Die prophetische Gegenwartsform „bringe“ bleibt als idiomatische Wiedergabe des prophetischen Perfekts möglich.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T08:59:21Z'
review_pass:
  verdict: revise
  source_fidelity: Die drei Imperative und die Anrede an Dedan sind grundsätzlich zutreffend. Die Wendung הֶעְמִיקוּ לָשֶׁבֶת bezeichnet jedoch nicht nur einen allgemeinen Rückzug, sondern ein Sich-zurückziehen, um an einem tief gelegenen bzw. unzugänglichen Ort zu wohnen. Die Schlussformel עֵת פְּקַדְתִּיו ist eine Zeitbestimmung zur göttlichen Strafheimsuchung; „die Zeit ist da“ fügt eine im Hebräischen nicht ausdrücklich vorhandene Aussage über das Eintreten der Zeit hinzu.
  naturalness: Der Entwurf ist überwiegend idiomatisches modernes Standarddeutsch. „Die Zeit ist da, in der …“ klingt zwar flüssig, ist aber eine unnötige Entfaltung. Die revidierte Fassung bleibt knapp und prophetisch, ohne unnatürlich wörtlich zu werden.
  terminology: „Unheil“ gibt אֵיד neutral und angemessen wieder. „Zur Rechenschaft ziehen“ ist für פקד im Gerichtszusammenhang möglich; die Fußnote wahrt mit „heimsuche“ und „bestrafe“ die lexikalische Spannweite. „Esau“ bleibt im Haupttext, mit sachlicher Erklärung der metonymischen Bezeichnung für Edom.
  issues:
  - severity: medium
    issue: Zusatz in der Schlusszeitangabe
    rationale: „Die Zeit ist da“ behauptet ausdrücklich das gegenwärtige Eintreten der Zeit. Der hebräische Text bietet lediglich „die Zeit, da/wenn ich ihn heimsuche“ und sollte nicht um diese Aussage erweitert werden.
  - severity: low
    issue: Fußnote a als angeblich wörtliche Wiedergabe
    rationale: „macht es tief, dort zu wohnen“ ist im Deutschen keine hilfreiche oder präzise wörtliche Glosse. Eine idiomatische Erklärung des hebräischen Ausdrucks ist sachgerechter.
