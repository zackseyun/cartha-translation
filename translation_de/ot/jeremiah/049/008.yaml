source:
  edition: WLC
  text: נֻ֤סוּ הָפְנוּ֙ הֶעְמִ֣יקוּ לָ/שֶׁ֔בֶת יֹשְׁבֵ֖י דְּדָ֑ן כִּ֣י אֵ֥יד עֵשָׂ֛ו הֵבֵ֥אתִי עָלָ֖י/ו עֵ֥ת פְּקַדְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
translation:
  language: de
  text: Flieht, kehrt um, zieht euch tief zurück, um dort zu wohnen[a], ihr Bewohner von Dedan! Denn ich bringe Esaus Unheil über ihn[b], wenn ich ihn zur Rechenschaft ziehe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Ausdruck meint, sich zum Wohnen an abgelegene oder schwer zugängliche Orte zurückzuziehen.
    reason: lexical_alternative
  - marker: b
    text: „Esau“ steht hier für Edom, das Volk der Nachkommen Esaus.
    reason: cultural_note
  - marker: c
    text: 'Oder: „zur Zeit, da ich ihn heimsuche“ beziehungsweise „bestrafe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  choice: Flieht
  rationale: Der pluralische Imperativ von נוס ist ein unmittelbarer Aufruf zur Flucht; „Flieht“ ist knapp, geläufig und dem prophetischen Gerichtswort angemessen.
- source_word: הָפְנוּ
  choice: kehrt um
  rationale: Der Imperativ von פנה bezeichnet hier im Zusammenhang mit der Flucht das Umkehren beziehungsweise den Rückzug. „Kehrt um“ bewahrt die Eigenständigkeit des zweiten Befehls.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: zieht euch tief zurück
  rationale: Die Verbindung aus dem Hifil von עמק und לשבת beschreibt den Rückzug an einen tief gelegenen, abgelegenen oder schwer zugänglichen Ort. Die Wiedergabe erhält das Bild der Tiefe, ohne im Deutschen unnatürlich „wohnt tief“ zu sagen.
- source_word: יֹשְׁבֵי דְּדָן
  choice: ihr Bewohner von Dedan
  rationale: Die Anrede gibt die hebräische Konstruktverbindung natürlich und würdig wieder.
- source_word: אֵיד עֵשָׂו
  choice: Esaus Verderben
  rationale: אֵיד bezeichnet schweres Unheil oder Verderben. „Esau“ bleibt entsprechend dem Ausgangstext stehen, obwohl damit hier Edom, also Esaus Nachkommenschaft, gemeint ist.
- source_word: הֵבֵאתִי עָלָיו
  choice: ich bringe ... über ihn
  rationale: Das hebräische Perfekt kann in der prophetischen Gerichtsankündigung die Gewissheit des bevorstehenden Geschehens ausdrücken. Das deutsche Präsens vermittelt die angekündigte Handlung natürlicher als ein missverständliches Perfekt.
- source_word: עֵת פְּקַדְתִּיו
  choice: die Zeit ist da, in der ich ihn zur Rechenschaft ziehe
  rationale: פקד hat in diesem Gerichtszusammenhang eine strafende Bedeutung. Die explizite Satzform macht die knappe hebräische Zeitangabe im modernen Deutschen verständlich.
theological_decisions:
- issue: Bedeutung von פקד in der Gerichtsankündigung
  choice: zur Rechenschaft ziehen
  alternative: heimsuchen; bestrafen
  rationale: Der Zusammenhang verlangt eine negative, gerichtliche Bedeutung. „Zur Rechenschaft ziehen“ bringt diese zur Geltung, ohne über die Aussage des Textes hinaus Art oder Ausmaß der Strafe festzulegen.
- issue: Bezug von „Esau“
  choice: Esau im Haupttext beibehalten und die kollektive Bedeutung in einer Fußnote erläutern
  alternative: Edom unmittelbar in den Haupttext setzen
  rationale: Der hebräische Text nennt ausdrücklich Esau. Die metonymische Beziehung zu Edom wird erklärt, aber nicht an die Stelle der Quellformulierung gesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei kurzen Imperative bewahren den eindringlichen Rhythmus des Hebräischen. Das Bild der räumlichen Tiefe bleibt erhalten, wird aber idiomatisch als Rückzug formuliert; die knappe abschließende Zeitangabe wird zur Verständlichkeit als Satz entfaltet.
