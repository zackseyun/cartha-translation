  text: ק֣וּמוּ עֲל֗וּ אֶל גּ֥וֹי שְׁלֵ֛יו יוֹשֵׁ֥ב לָ/בֶ֖טַח נְאֻם יְהוָ֑ה לֹא דְלָתַ֧יִם וְ/לֹֽא בְרִ֛יחַ ל֖/וֹ בָּדָ֥ד יִשְׁכֹּֽנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
translation:
  language: de
  text: Steht auf, zieht hinauf gegen ein unbekümmertes[a] Volk, das in Sicherheit lebt – so lautet der Ausspruch Jahwes. Es hat weder Türen noch Riegel[b]; abgesondert wohnen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ruhiges“ oder „sorgloses“. Das hebräische Wort kann ungestörte Ruhe, Sicherheit oder unbekümmerte Selbstsicherheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „keine Türen und keinen Riegel hat es“. Das Bild beschreibt ein Volk ohne verschlossene bzw. gesicherte Zugänge und damit ohne entsprechende Befestigung.'
    reason: cultural_note
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Steht auf
  rationale: Der Imperativ Plural von קום eröffnet den militärischen Aufruf. „Steht auf“ ist unmittelbar, verständlich und wahrt den Bildgehalt.
- source_word: עֲל֗וּ אֶל
  choice: zieht hinauf gegen
  rationale: עלה mit אֶל bezeichnet hier im Kriegsorakel das Vorrücken gegen ein Ziel. „Zieht hinauf gegen“ bewahrt sowohl die Bewegungsrichtung als auch den militärischen Sinn.
- source_word: גּ֥וֹי שְׁלֵ֛יו
  choice: ein sorgloses Volk
  rationale: גוי bezeichnet hier das angegriffene Volk; שׁליו kann ruhige Sicherheit, Unbekümmertheit oder daraus erwachsende Sorglosigkeit ausdrücken. „Sorglos“ passt zum folgenden Hinweis auf fehlende Befestigungen, ohne ausdrücklich moralische Selbstgefälligkeit zu behaupten.
- source_word: יוֹשֵׁ֥ב לָבֶ֖טַח
  choice: das in Sicherheit lebt
  rationale: Die Partizipialfügung beschreibt eine dauerhaft als sicher empfundene Lebensweise. Die deutsche Relativkonstruktion ist natürlich und erhält den Zustandssinn.
- source_word: נְאֻם יְהוָ֑ה
  choice: so lautet der Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird gewichtig und zugleich verständlich wiedergegeben. Der Eigenname יהוה erscheint als „Jahwe“.
- source_word: לֹא דְלָתַ֧יִם וְלֹֽא בְרִ֛יחַ ל֖וֹ
  choice: das weder Tore noch Riegel hat
  rationale: Wörtlich fehlen ihm „Türflügel/Türen“ und ein „Riegel“. Im Zusammenhang sind ungesicherte Zugänge beziehungsweise fehlende Befestigungen gemeint; „Tore“ und „Riegel“ ergibt im Deutschen ein klares, quellennahes Bild.
- source_word: בָּדָ֥ד יִשְׁכֹּֽנוּ
  choice: Abgesondert wohnen sie
  rationale: בדד bezeichnet ein Leben für sich beziehungsweise getrennt von anderen. Der Plural „sie wohnen“ bezieht sich sinngemäß auf die Angehörigen des zuvor singularisch bezeichneten Volkes; dieser Numeruswechsel bleibt erhalten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bewertung des sicheren Volkes durch שׁליו
  choice: sorglos
  alternative: ruhig / unbekümmert / selbstsicher
  rationale: Das Wort kann sowohl friedliche Ruhe als auch unvorsichtige Sorglosigkeit bezeichnen. „Sorglos“ lässt die Spannung zwischen erlebter Sicherheit und tatsächlicher Verwundbarkeit bestehen, ohne eine weitergehende moralische Verurteilung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der militärische Doppelimperativ bleibt erhalten. Der Wechsel vom singularisch aufgefassten „Volk“ zum pluralischen „sie“ folgt dem Hebräischen und lenkt den Blick von der Gemeinschaft auf ihre Angehörigen.
