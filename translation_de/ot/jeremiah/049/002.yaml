  source_fidelity: 'Die Übersetzung gibt die Satzfolge und die zentralen Elemente des Hebräischen zuverlässig wieder: die inferierende Einleitung, die prophetische Zukunftsankündigung, den kausativen Sinn von וְהִשְׁמַעְתִּי, die gegen Rabba gerichtete Kriegsankündigung, den Ruinenhügel, die abhängigen Orte sowie die Umkehrung in der abschließenden ירשׁ-Wendung. „Dann wird Israel die vertreiben, die es vertrieben haben“ ist im Kontext eine vertretbare, verständliche Wiedergabe; die Fußnote weist zudem zutreffend auf Besitznahme und Verdrängung als Bedeutungsspektrum hin.'
