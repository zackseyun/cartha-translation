id: JER.49.2
reference: Jeremiah 49:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
translation:
  language: de
  text: Darum, siehe, es kommen Tage – Ausspruch Jahwes –, da lasse ich gegen Rabba, die Stadt der Ammoniter, Kriegsgeschrei[a] erschallen. Sie wird zu einem öden Trümmerhügel werden, und ihre Tochterstädte[b] werden in Brand gesteckt. Dann wird Israel die vertreiben, die es vertrieben haben[c], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kriegslärm“ oder „Kriegsalarm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ihre Töchter“; gemeint sind kleinere, von der Hauptstadt abhängige Städte und Ortschaften.'
    reason: cultural_note
  - marker: c
    text: 'Im Hebräischen steht hier ein Wortspiel mit demselben Verb: Israel wird diejenigen „vertreiben“ beziehungsweise ihres Besitzes berauben, die zuvor Israel vertrieben und dessen Land in Besitz genommen hatten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die Folgerung aus der vorausgehenden Anklage und klingt im Deutschen natürlicher als das schwerere „Daher“.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt den feierlichen, aufmerksamkeitslenkenden Charakter der prophetischen Ankündigung.
- source_word: יָמִים בָּאִים
  choice: es kommen Tage
  rationale: Gibt die prophetische Zukunftsformel transparent und in würdigem Deutsch wieder.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Bewahrt den formelhaften Charakter von נְאֻם und unterscheidet die Wendung von אָמַר am Versende.
- source_word: וְהִשְׁמַעְתִּי
  choice: da lasse ich … erschallen
  rationale: Gibt den kausativen Hifil-Sinn wieder und ist zugleich natürliches Deutsch.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Rabba, die Stadt der Ammoniter
  rationale: Identifiziert Rabba verständlich als ammonitische Stadt, ohne die hebräische Wendung „Söhne Ammons“ unnatürlich nachzubilden.
- source_word: תְּרוּעַת מִלְחָמָה
  choice: Kriegsgeschrei
  rationale: Bezeichnet den lauten Kriegsruf beziehungsweise das militärische Alarmsignal, ohne die mögliche Nuance vorschnell festzulegen.
- source_word: וְהָיְתָה לְתֵל שְׁמָמָה
  choice: Sie wird zu einem öden Trümmerhügel werden
  rationale: „Trümmerhügel“ vermittelt das Bild eines תֵל als Ruinenhaufen klarer als das fachsprachliche „Tell“.
- source_word: וּבְנֹתֶיהָ
  choice: ihre Tochterstädte
  rationale: Bewahrt die hebräische Metapher und macht zugleich deutlich, dass abhängige Ortschaften gemeint sind.
- source_word: בָּאֵשׁ תִּצַּתְנָה
  choice: werden in Brand gesteckt
  rationale: Gibt die passive beziehungsweise resultative Aussage im Zusammenhang der Eroberung idiomatisch wieder.
- source_word: וְיָרַשׁ יִשְׂרָאֵל אֶת יֹרְשָׁיו
  choice: Dann wird Israel die vertreiben, die es vertrieben haben
  rationale: Bewahrt das Wortspiel mit derselben hebräischen Wurzel und drückt den hier wahrscheinlichen Sinn der Besitzergreifung durch Verdrängung verständlich aus.
- source_word: אָמַר יְהוָה
  choice: spricht Jahwe
  rationale: Gibt die abschließende Redeeinleitung knapp und im prophetischen Register wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher wiedergegeben; „Jahwe“ ist die im modernen Standarddeutsch geläufige Form.
- issue: Kollektiver Singular bei Israel
  choice: es
  alternative: ihn
  rationale: Im Deutschen ist „Israel“ grammatisch sächlich. „Es“ ist daher natürlich und verweist eindeutig auf das kollektiv verstandene Volk, auch wenn das hebräische Suffix maskulin singularisch ist.
- issue: Bedeutung und Wortspiel von ירשׁ
  choice: vertreiben … vertrieben haben
  alternative: in Besitz nehmen … in Besitz genommen hatten
  rationale: Die gewählte Fassung bewahrt die Wiederholung desselben Verbs und den Gedanken einer Umkehrung des früheren Landverlusts. Die Fußnote weist auf das Bedeutungsspektrum zwischen Vertreibung und Besitzergreifung hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener prophetischer Formelhaftigkeit. Die Gedankenstriche gliedern „Ausspruch Jahwes“ als eingeschobene Offenbarungsformel. Das feminine Pronomen „Sie“ bezieht sich auf die zuvor ausdrücklich als Stadt bezeichnete Ortschaft Rabba.
