  terminology: „Jahwe“ ist im Deutschen eine etablierte Wiedergabe des Gottesnamens. „Kriegsgeschrei“ lässt die Spannweite von martialischem Ruf und Alarm offen; die Alternativen in Fußnote a sind sinnvoll. „Trümmerhügel“ vermittelt תֵּל ohne unnötige Fachsprache. Die Tochter-Orte sind korrekt als abhängige kleinere Städte und Ortschaften erklärt.
