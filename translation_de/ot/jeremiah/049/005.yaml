id: JER.49.5
reference: Jeremiah 49:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
translation:
  language: de
  text: Siehe, ich bringe Schrecken über dich von allen Seiten, spricht der Herr, Jahwe der Heerscharen. Ihr werdet vertrieben, jeder geradewegs vor sich hin[a], und niemand wird den Flüchtenden[b] sammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „jeder vor sich“. Die knappe hebräische Wendung kann panische Flucht bezeichnen, bei der jeder geradeaus läuft, ohne auf die anderen zu achten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Umherirrenden“ beziehungsweise „den Vertriebenen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי מֵבִיא
  choice: Siehe, ich bringe
  rationale: Die Verbindung aus הִנְנִי und Partizip leitet eine feierliche göttliche Ankündigung ein und stellt das Handeln als unmittelbar bevorstehend dar.
- source_word: פַּחַד
  choice: Schrecken
  rationale: „Schrecken“ bezeichnet hier nicht nur innere Furcht, sondern einen von Gott herbeigeführten Zustand panischer Bedrohung.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  choice: spricht der Herr, Jahwe der Heerscharen
  rationale: „Spricht“ gibt die prophetische Botenformel נְאֻם natürlich wieder. אֲדֹנָי wird als Titel „der Herr“, der Gottesname יהוה als „Jahwe“ und צְבָאוֹת traditionsnah als „der Heerscharen“ wiedergegeben.
- source_word: מִכָּל סְבִיבַיִךְ
  choice: von allen Seiten
  rationale: Die knappe deutsche Wendung bewahrt das Bild einer Bedrohung, die die angesprochene Größe ringsum einschließt.
- source_word: וְנִדַּחְתֶּם
  choice: Ihr werdet vertrieben
  rationale: Der Niphal von נדח bezeichnet ein gewaltsames Wegtreiben oder Zerstreuen. „Vertrieben“ wahrt die passive Form und die Härte des Gerichts.
- source_word: אִישׁ לְפָנָיו
  choice: jeder geradewegs vor sich hin
  rationale: Die schwierige distributive Wendung schildert wahrscheinlich, wie jeder Einzelne ohne Rücksicht auf die anderen in die vor ihm liegende Richtung flieht. Die Übersetzung hält diesen Sinn fest, ohne die Unsicherheit zu verdecken.
- source_word: וְאֵין מְקַבֵּץ
  choice: und niemand wird … sammeln
  rationale: Die Formulierung bezeichnet das Fehlen eines Menschen, der die Zerstreuten wieder zusammenführt. Das futurische Deutsch passt zum angekündigten Gericht.
- source_word: לַנֹּדֵד
  choice: den Flüchtenden
  rationale: Das Partizip kann einen Flüchtenden, Umherirrenden oder Vertriebenen bezeichnen. Im Zusammenhang der panischen Zerstreuung ist „den Flüchtenden“ am unmittelbarsten.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung אֲדֹנָי יְהוִה צְבָאוֹת
  choice: der Herr, Jahwe der Heerscharen
  alternative: Gott, der HERR der Heerscharen
  rationale: Die Übersetzung unterscheidet den Titel אֲדֹנָי vom Eigennamen יהוה und bewahrt dadurch die ungewöhnliche volle Gottesbezeichnung des hebräischen Textes.
- issue: Numeruswechsel zwischen der angeredeten Einzelfigur und der betroffenen Gruppe
  choice: „über dich“ im Singular, danach „ihr werdet vertrieben“ im Plural
  alternative: Durchgehend pluralische Anrede
  rationale: Der hebräische Text wechselt bewusst vom femininen Singular עָלַיִךְ zur Pluralform וְנִדַּחְתֶּם. Dieser Wechsel wird nicht eingeebnet; die angesprochene politische Größe und ihre einzelnen Angehörigen bleiben so unterscheidbar.
- issue: Distributive, grammatisch maskuline Form אִישׁ
  choice: jeder
  alternative: jeder Mann
  rationale: אִישׁ hat hier distributive Kraft. „Jeder“ bewahrt die Einzelbezogenheit, ohne im Deutschen unnötig festzulegen, dass ausschließlich Männer gemeint seien.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischer Eindringlichkeit. Die feierliche Einleitung „Siehe“ und der Titel „Jahwe der Heerscharen“ erhalten den gehobenen biblischen Ton; Satzbau und Wortwahl bleiben zugleich allgemein verständlich. Die echte Mehrdeutigkeit von אִישׁ לְפָנָיו und לַנֹּדֵד wird in Fußnoten ausgewiesen.
