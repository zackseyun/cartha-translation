  text: כִּ֣י בִ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּֽי לְ/שַׁמָּ֧ה לְ/חֶרְפָּ֛ה לְ/חֹ֥רֶב וְ/לִ/קְלָלָ֖ה תִּֽהְיֶ֣ה בָצְרָ֑ה וְ/כָל עָרֶ֥י/הָ תִהְיֶ֖ינָה לְ/חָרְב֥וֹת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: de
  text: Denn ich habe bei mir selbst geschworen – Ausspruch des HERRN –, dass Bozra zu Entsetzen, Schande, Verwüstung und Fluch wird und alle seine Städte zu ewigen Ruinen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִי נִשְׁבַּעְתִּי
  choice: bei mir selbst habe ich geschworen
  rationale: Das pronominale בִי bezeichnet Gott selbst als denjenigen, bei dem er schwört; „bei mir selbst“ gibt den Sinn im Deutschen ausdrücklich und idiomatisch wieder.
- source_word: שַׁמָּה
  choice: Entsetzen
  rationale: Das Wort bezeichnet hier einen Zustand oder Anblick, der Entsetzen hervorruft; die Wiedergabe bewahrt die Wirkung des Gerichtsworts.
- source_word: חֶרְפָּה
  choice: Schande
  rationale: Gemeint ist öffentliche Entehrung beziehungsweise ein Gegenstand des Spotts; „Schande“ ist knapp und natürlich.
- source_word: חֹרֶב
  choice: Ruine
  rationale: Das Substantiv bezeichnet Verwüstung oder einen verwüsteten Ort. „Ruine“ passt zur parallelen Reihe von Zuständen, ohne es mit dem nachfolgenden Plural „Trümmerstätten“ gleichzusetzen.
- source_word: קְלָלָה
  choice: Fluch
  rationale: Bozra soll zum sprichwörtlichen Gegenstand einer Fluchformel werden; die knappe Wiedergabe „zum Fluch“ erhält die hebräische Ausdrucksweise.
- source_word: חָרְבוֹת עוֹלָם
  choice: ewige Trümmerstätten
  rationale: Der Plural bezeichnet dauerhaft verwüstete Orte. „Ewig“ bewahrt die starke zeitliche Aussage von עוֹלָם, ohne sie abzuschwächen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen beziehungsweise Großschreibung ist verständlich und kennzeichnet den Gottesnamen, ohne eine unsichere Vokalisierung festzulegen.
- issue: Gottes Schwur bei sich selbst
  choice: bei mir selbst habe ich geschworen
  alternative: bei mir habe ich geschworen
  rationale: Die reflexive Wiedergabe macht den Bezug des göttlichen Schwurs klar, ohne eine zusätzliche theologische Erklärung in den Text einzutragen.
- issue: Genus des Rückbezugs auf Bozra in „alle ihre/seine Städte“
  choice: alle seine Städte
  alternative: alle ihre Städte
  rationale: Im Deutschen ist der Ortsname Bozra grammatisch sächlich; „seine“ ist daher natürlich. Das feminine hebräische Suffix folgt der dortigen grammatischen beziehungsweise personifizierenden Auffassung der Stadt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Syntax und Bildsprache des Hebräischen. Die viergliedrige Gerichtsformel bleibt erhalten; der Gedankenstrich markiert die eingeschobene Botenformel „Ausspruch des HERRN“.
