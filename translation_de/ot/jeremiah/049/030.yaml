id: JER.49.30
reference: Jeremiah 49:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
translation:
  language: de
  text: Flieht! Zieht weit fort! Zieht euch tief ins Verborgene zurück[a], ihr Bewohner von Hazor! – Ausspruch Jahwes. Denn Nebukadnezar, der König von Babel, hat gegen euch Rat gehalten und gegen sie[b] einen Plan ersonnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Macht [euer] Wohnen tief“; gemeint ist der Rückzug an entlegene oder verborgene Orte.'
    reason: cultural_note
  - marker: b
    text: Der hebräische Text wechselt hier von „gegen euch“ zu „gegen sie“.
    reason: textual_variant
lexical_decisions:
- source_word: נֻסוּ
  choice: Flieht!
  rationale: Der Qal-Imperativ im Plural fordert unmittelbar zur Flucht auf; „Flieht!“ ist knapp, eindringlich und im prophetischen Warnruf natürlich.
- source_word: נֻּדוּ מְאֹד
  choice: Zieht weit fort!
  rationale: נוד bezeichnet hier die Bewegung weg vom bedrohten Ort; מְאֹד verstärkt die räumliche Entfernung. Die Wiedergabe unterscheidet den Ausdruck vom vorangehenden „Flieht!“.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  choice: Zieht euch tief ins Verborgene zurück
  rationale: Die wörtliche Vorstellung, „tief zu wohnen“, bezeichnet den Rückzug an entlegene oder schwer zugängliche Zufluchtsorte. Die Formulierung bewahrt das Bild der Tiefe und erschließt zugleich den idiomatischen Sinn.
- source_word: יֹשְׁבֵי חָצוֹר
  choice: ihr Bewohner von Hazor
  rationale: Das konstruktgebundene Partizip wird als direkte Anrede der Einwohner wiedergegeben; der Ortsname bleibt transliteriert.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Botenformel wird feierlich und quellennah wiedergegeben; der Gottesname erscheint in der im Deutschen geläufigen Form „Jahwe“.
- source_word: יָעַץ ... עֵצָה
  choice: hat ... Rat gehalten
  rationale: Die Verbindung aus Verb und stammverwandtem Substantiv betont bewusstes Beraten und Planen. „Rat halten“ wahrt dieses Bedeutungsfeld ohne unnatürliche Wiederholung.
- source_word: עֲלֵיכֶם
  choice: gegen euch
  rationale: Im Zusammenhang des angekündigten militärischen Angriffs hat עַל adversative Bedeutung.
- source_word: וְחָשַׁב ... מַחֲשָׁבָה
  choice: und ... einen Plan ersonnen
  rationale: Die stammverwandte Verb-Substantiv-Verbindung bezeichnet ein absichtsvolles Vorhaben; „einen Plan ersinnen“ ist idiomatisch und bewahrt den Gedanken gezielter Planung.
- source_word: עליהם
  choice: gegen sie
  rationale: Der masoretische Text wechselt ausdrücklich von der zweiten Person Plural zur dritten Person Plural; dieser Wechsel wird nicht harmonisiert.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt das Tetragramm. „Jahwe“ gibt den Eigennamen im modernen Standarddeutsch direkt wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Pronomenwechsel am Versende
  choice: Wechsel von „euch“ zu „sie“ bewahren
  alternative: Das letzte Pronomen zu „euch“ harmonisieren
  rationale: Die überlieferte masoretische Fassung wechselt unvermittelt von direkter Anrede zur dritten Person. Die Übersetzung bewahrt diese echte Spannung; eine Fußnote macht sie transparent.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, eindringlichen Imperativen. Das schwer verständliche Tiefenbild wird im Haupttext behutsam erschlossen und in der Fußnote wörtlicher erläutert. Der abrupte Pronomenwechsel des masoretischen Textes bleibt erhalten.
