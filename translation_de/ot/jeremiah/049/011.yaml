base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
translation:
  language: de
  text: Lass deine vaterlosen Kinder zurück; ich werde sie am Leben erhalten. Und deine Witwen mögen auf mich vertrauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Hebräische hat hier eine Form der 2. Person Plural, die nicht unmittelbar zu „deine Witwen“ passt. Sie wird meist im Sinn einer Aufforderung oder eines Wunsches verstanden; möglich ist auch eine Zusicherung: „Deine Witwen werden auf mich vertrauen.“'
    reason: textual_grammatical_ambiguity
lexical_decisions:
- source_word: עָזְבָה
  choice: Lass … zurück
  rationale: Der Qal-Imperativ 2. Person maskulin Singular bedeutet hier, jemanden zurückzulassen bzw. der Obhut eines anderen zu überlassen. „Lass … zurück“ bewahrt die Befehlsform, ohne die stärkere Bedeutung „verlass im Stich“ einzutragen.
- source_word: יְתֹמֶיךָ
  choice: deine Waisen
  rationale: יָתוֹם bezeichnet besonders ein vaterloses Kind. „Waisen“ ist im Deutschen die natürliche knappe Wiedergabe; die genauere soziale Bedeutung wird in der Fußnote genannt.
- source_word: אֲנִי אֲחַיֶּה
  choice: ich werde sie am Leben erhalten
  rationale: Das ausdrücklich gesetzte אֲנִי betont den Sprecher. Das Piel von חיה hat kausative bzw. lebenserhaltende Bedeutung, die „am Leben erhalten“ präzise und natürlich ausdrückt.
- source_word: וְאַלְמְנֹתֶיךָ
  choice: Und deine Witwen
  rationale: Die Konjunktion führt die zweite, parallele Aussage über die schutzbedürftigen Hinterbliebenen ein.
- source_word: עָלַי תִּבְטָחוּ
  choice: sollen auf mich vertrauen
  rationale: בטח mit עַל bezeichnet das Sichverlassen auf jemanden. Die Form kann hier auffordernd oder zusichernd verstanden werden; „sollen“ bewahrt diese modale Offenheit besser als ein eindeutiger Imperativ.
theological_decisions:
- issue: Sprecher und Zusage des Schutzes
  choice: Die direkte Ich-Aussage bleibt als Zusage des göttlichen Sprechers stehen, ohne den Sprecher im Vers eigens zu benennen.
  alternative: Den HERRN ausdrücklich ergänzen oder die Aussage als allgemeine Schutzverheißung formulieren.
  rationale: Im Zusammenhang spricht der HERR im Gerichtswort über Edom. Der hebräische Vers betont durch אֲנִי das „Ich“, nennt den Sprecher hier jedoch nicht erneut. Die Übersetzung bewahrt sowohl die göttliche Zusage als auch die sprachliche Form des Verses.
- issue: Modalität von תִּבְטָחוּ
  choice: „sollen auf mich vertrauen“
  alternative: „mögen auf mich vertrauen“ oder „werden auf mich vertrauen“
  rationale: Der Imperfekt kann in diesem Zusammenhang jussiv-auffordernd oder als Zusicherung verstanden werden. „Sollen“ lässt die Spannung zwischen Einladung, Aufforderung und Erwartung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Zweigliedrigkeit und die hervorgehobene Ich-Zusage des Hebräischen bleiben erhalten. „Waisen“ ist allgemein verständlich; im Hebräischen sind besonders vaterlose Kinder gemeint.
