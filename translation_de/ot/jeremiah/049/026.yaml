  variant: modern standard German
source:
  edition: WLC
  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה יִדַּ֨מּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
translation:
  language: de
  text: Darum werden ihre jungen Männer auf ihren Straßen[a] fallen, und alle Kriegsleute werden an jenem Tag verstummen[b] – Ausspruch Jahwes, des Herrn der Heere.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf ihren Plätzen“ beziehungsweise „auf ihren freien Plätzen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „umkommen“ beziehungsweise „vernichtet werden“. Das hebräische Verb kann verstummen oder still werden, im Gerichtszusammenhang aber auch zugrunde gehen bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Traditionell: „der HERR der Heerscharen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus dem vorausgehenden Gerichtswort ein; „Darum“ ist im Deutschen klar und natürlich.
- source_word: יִפְּלוּ
  choice: werden … fallen
  rationale: Das Verb bezeichnet im militärischen Zusammenhang das Fallen im Kampf und lässt wie das Hebräische unausgesprochen, ob ausdrücklich „sterben“ gemeint ist.
- source_word: בַחוּרֶיהָ
  choice: ihre jungen Männer
  rationale: בָּחוּר bezeichnet gewöhnlich junge Männer im wehrfähigen Alter; die Wiedergabe erhält sowohl das Alter als auch den konkreten Personenbezug.
- source_word: בִּרְחֹבֹתֶיהָ
  choice: auf ihren Straßen
  rationale: רְחוֹב kann eine breite Straße, einen Platz oder einen anderen offenen öffentlichen Raum bezeichnen. „Auf ihren Straßen“ passt natürlich zum städtischen Kriegsgeschehen; die Bedeutungsbreite wird in der Fußnote erhalten.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: ihre Kriegsleute
  rationale: Die feste Verbindung bezeichnet die am Krieg beteiligten Männer. „Kriegsleute“ wahrt den männlichen Personenbezug und klingt würdevoll, ohne das Hebräische unnötig auszudeuten.
- source_word: יִדַּמּוּ
  choice: werden … verstummen
  rationale: Das Nifal kann Verstummen, Stillwerden oder im Gerichtskontext Zugrundegehen bezeichnen. „Verstummen“ bewahrt das Bild und die Mehrdeutigkeit; stärkere Deutungen stehen in der Fußnote.
- source_word: בַּיּוֹם הַהוּא
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Entsprechung der üblichen prophetischen Zeitformel.
- source_word: נְאֻם
  choice: Ausspruch
  rationale: „Ausspruch Jahwes“ gibt die prophetische Beglaubigungsformel knapp und formal transparent wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Die im Deutschen übliche Form „Jahwe“ gibt den göttlichen Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: צְבָאוֹת
  choice: Herr der Heere
  rationale: צְבָאוֹת bezeichnet Heere beziehungsweise Heerscharen. Die Formulierung „Jahwe, der Herr der Heere“ macht den Titel im modernen Deutschen verständlich und erhält hier seine militärische Kraft.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen. Die deutsche Form „Jahwe“ wahrt diesen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
- issue: Wiedergabe des Titels יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heere
  alternative: der HERR der Heerscharen
  rationale: „Herr der Heere“ vermittelt heutigen Lesern den militärischen Sinn des Titels unmittelbar. Die traditionelle Form wird in der Fußnote dokumentiert, ohne den Titel auf ausschließlich menschliche Heere festzulegen.
- issue: Bedeutung von יִדַּמּוּ im Gerichtswort
  choice: verstummen
  alternative: umkommen / vernichtet werden
  rationale: Die bildhafte Grundbedeutung wird beibehalten, damit die mögliche Spannung zwischen Stillwerden und endgültigem Untergang nicht stillschweigend aufgelöst wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. Die Satzstruktur folgt dem hebräischen Gedankengang, bleibt aber gut lesbar. „Kriegsleute“ ist bewusst etwas gehoben, jedoch allgemein verständlich. Die Mehrdeutigkeit von רְחוֹב und יִדַּמּוּ wird durch Fußnoten offengehalten.
