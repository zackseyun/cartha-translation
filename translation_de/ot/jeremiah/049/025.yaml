source:
  edition: WLC
  text: אֵ֥יךְ לֹֽא עֻזְּבָ֖ה עִ֣יר תהלה קִרְיַ֖ת מְשׂוֹשִֽׂ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
translation:
  language: de
  text: Wie ist die gepriesene Stadt doch nicht verlassen worden, die Stadt meiner Freude![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine auffällige Verneinung: „Wie ist die gepriesene Stadt nicht verlassen worden?“ Das „meiner“ gibt das hebräische Ich-Suffix wieder; wer in dieser Klage spricht, ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Wie
  rationale: Die interrogativ-exklamative Partikel leitet hier einen Ausdruck des Erstaunens oder der Klage ein. „Wie“ bewahrt diese rhetorische Offenheit, ohne sie eindeutig als kausales „Warum“ zu deuten.
- source_word: לֹא
  choice: nicht
  rationale: Die ausdrückliche Verneinung wird trotz der im Deutschen ungewöhnlichen Aussage beibehalten, da ihre Tilgung den überlieferten hebräischen Text wesentlich verändern würde.
- source_word: עֻזְּבָה
  choice: verlassen worden
  rationale: Das passive feminine Perfekt von עזב bezieht sich auf die Stadt. „Verlassen worden“ gibt sowohl die passive Form als auch den Vorgangscharakter in natürlichem Deutsch wieder.
- source_word: עִיר תהלה
  choice: die gepriesene Stadt
  rationale: תהלה bezeichnet Lob oder Ruhm. „Die gepriesene Stadt“ ist eine natürliche deutsche Wiedergabe für eine Stadt, die Gegenstand des Lobes ist, und vermeidet das steife „Stadt des Lobes“.
- source_word: קִרְיַת
  choice: die Stadt
  rationale: Die konstruktusförmige Parallelbezeichnung wird als Apposition wiederholt, sodass die poetische Zweigliedrigkeit erhalten bleibt.
- source_word: מְשׂוֹשִׂי
  choice: meiner Freude
  rationale: Das Substantiv bezeichnet Freude oder Entzücken und trägt ein Suffix der ersten Person Singular. Die Übersetzung bewahrt dieses „meiner“, ohne festzulegen, wer hier spricht.
theological_decisions:
- issue: Identität der Stimme in „meiner Freude“
  choice: Das Ich-Suffix wird im Text unverändert als „meiner“ wiedergegeben.
  alternative: Die Stimme ausdrücklich Damaskus, dem Propheten oder Gott zuordnen.
  rationale: Der Vers selbst identifiziert die sprechende Stimme nicht eindeutig. Eine ausdrückliche Zuordnung würde eine umstrittene Auslegung in den Text eintragen.
- issue: Spannung zwischen Verneinung und Klageruf
  choice: Die Verneinung „nicht“ bleibt erhalten.
  alternative: 'Sinngemäß ohne Verneinung übersetzen: „Wie ist die gepriesene Stadt verlassen!“'
  rationale: Obwohl manche Deutungen die Formulierung als Klage über die verlassene Stadt verstehen, steht im masoretischen Text ausdrücklich לֹא. Die Übersetzung erhält diese echte textliche und semantische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das verstärkende „doch“ kennzeichnet den erstaunten Klageruf, ohne die auffällige hebräische Verneinung aufzulösen. Die poetische Apposition „die Stadt meiner Freude“ bleibt erhalten.
