  source_fidelity: Die Übersetzung bildet die hebräische interrogativ-exklamative Eröffnung אֵיךְ angemessen mit „Wie“ ab und bewahrt die ausdrücklich überlieferte Negation לֹא. „ist ... nicht verlassen worden“ gibt das feminine passive Perfekt עֻזְּבָה sachgerecht wieder. Die Erstperson in „meiner Freude“ erhält das Suffix von מְשׂוֹשִׂי, ohne die nicht eindeutig bestimmte Sprecherstimme auszudeuten.
  naturalness: Der Satz ist als bewusst spannungsvoller Klageruf in modernem, würdigem Deutsch verständlich. Das ergänzte „doch“ unterstützt den Ausrufcharakter, ohne die Negation aufzuheben. Die appositionelle Wiederaufnahme „die Stadt meiner Freude“ bewahrt den poetischen Parallelismus.
  terminology: „die gepriesene Stadt“ ist eine idiomatische Wiedergabe von עִיר תְּהִלָּה und lässt sowohl die Nähe zu „Lob“ als auch den Sinn einer weithin gerühmten Stadt erkennen. „Stadt“ für עִיר und קִרְיַת sowie „meiner Freude“ für מְשׂוֹשִׂי sind konsistent und quellentreu.
