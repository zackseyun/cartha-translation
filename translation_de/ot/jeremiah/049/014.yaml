source:
  edition: WLC
  text: שְׁמוּעָ֤ה שָׁמַ֨עְתִּי֙ מֵ/אֵ֣ת יְהוָ֔ה וְ/צִ֖יר בַּ/גּוֹיִ֣ם שָׁל֑וּחַ הִֽתְקַבְּצוּ֙ וּ/בֹ֣אוּ עָלֶ֔י/הָ וְ/ק֖וּמוּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
translation:
  language: de
  text: 'Ich habe eine Nachricht von Jahwe[a] gehört, und ein Bote wurde unter die Völker gesandt: »Versammelt euch, zieht gegen sie[b] heran und erhebt euch zum Kampf!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Gottesname lautet JHWH, hier mit »Jahwe« wiedergegeben.
    reason: divine_name
  - marker: b
    text: Mit »sie« ist im Zusammenhang Edom gemeint, das als Frau personifiziert wird.
    reason: referent_clarification
lexical_decisions:
- source_word: שְׁמוּעָה
  choice: eine Botschaft
  rationale: Das Substantiv bezeichnet etwas Gehörtes, also eine Nachricht, Kunde oder Botschaft. Im prophetischen Zusammenhang gibt »Botschaft« den Offenbarungscharakter natürlich wieder, ohne mehr festzulegen, als der hebräische Ausdruck sagt.
- source_word: שָׁמַעְתִּי
  choice: ich habe … gehört
  rationale: Das Perfekt bezeichnet hier den vollzogenen Empfang der Botschaft. Das deutsche Perfekt klingt gegenwärtig und natürlich.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet Herkunft beziehungsweise Quelle; der Gottesname יְהוָה wird als »Jahwe« wiedergegeben.
- source_word: צִיר
  choice: ein Bote
  rationale: צִיר kann einen Boten, Gesandten oder Abgesandten bezeichnen. »Bote« ist verständlich und lässt die genaue amtliche Stellung offen.
- source_word: בַּגּוֹיִם
  choice: unter die Völker
  rationale: Im Deutschen verbindet sich »senden« natürlich mit einer Richtungsangabe. »Völker« bezeichnet hier die fremden Nationen ohne eine spätere religiöse Nebenbedeutung.
- source_word: שָׁלוּחַ
  choice: wurde … gesandt
  rationale: Das passive Partizip stellt den Boten als ausgesandt dar. Das Präteritum fügt sich im Deutschen klar an den vorausgehenden Bericht an.
- source_word: הִתְקַבְּצוּ
  choice: Versammelt euch
  rationale: Der pluralische Hitpael-Imperativ ist ein unmittelbarer Aufruf an mehrere Völker, sich zusammenzufinden.
- source_word: וּבֹאוּ עָלֶיהָ
  choice: zieht gegen sie heran
  rationale: בוא על bezeichnet im militärischen Kontext eine feindliche Bewegung gegen ein Ziel. »Heranziehen« ist im Deutschen für das Vorrücken zum Angriff idiomatisch.
- source_word: וְקוּמוּ לַמִּלְחָמָה
  choice: und erhebt euch zum Kampf
  rationale: Die Wiedergabe bewahrt die konkrete Aufforderung קוּמוּ und den militärischen Sinn von מִלְחָמָה, ohne sie bloß als Vorbereitung zu paraphrasieren.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Text nennt ausdrücklich das Tetragramm. »Jahwe« gibt den persönlichen Gottesnamen wieder und vermeidet, ihn durch einen Titel zu ersetzen.
- issue: Bezug des femininen Pronomens עָלֶיהָ
  choice: sie, mit Erläuterung auf Edom
  alternative: Edom ausdrücklich im Haupttext nennen
  rationale: Der hebräische Text hat ein feminines Pronomen und setzt dessen Bezug aus dem Kontext voraus. Die Übersetzung bewahrt dieses Pronomen; eine Fußnote klärt den Bezug, ohne den Haupttext interpretierend zu erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der prophetische Kriegsaufruf bleibt knapp und eindringlich; die Imperative werden als direkte Rede gekennzeichnet. Die feminine Referenz des Hebräischen und die mögliche Bedeutungsbreite von צִיר werden nicht konfessionell oder dogmatisch eingeengt.
