source:
  edition: WLC
  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
translation:
  language: de
  text: 'Über die Ammoniter spricht Jahwe: »Hat Israel keine Söhne? Hat es keinen Erben? Warum hat dann ihr König Gad in Besitz genommen, und sein Volk hat sich in dessen Städten niedergelassen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  choice: Über die Ammoniter
  rationale: Das vorangestellte לְ leitet hier das Thema des Prophetenspruchs ein. „Ammoniter“ gibt den hebräischen Ausdruck „Söhne Ammons“ im modernen Deutschen natürlich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: הֲבָנִים אֵין לְיִשְׂרָאֵל
  choice: Hat Israel keine Söhne?
  rationale: „Söhne“ wahrt den Bezug auf erbberechtigte Nachkommen, auf dem die folgende rhetorische Frage beruht.
- source_word: אִם יוֹרֵשׁ אֵין לוֹ
  choice: Hat es keinen Erben?
  rationale: אִם führt hier im Zusammenhang eine weitere rhetorische Frage ein. Das singularische „Erbe“ entspricht יוֹרֵשׁ.
- source_word: מַדּוּעַ יָרַשׁ
  choice: Warum hat dann … in Besitz genommen
  rationale: ירש bezeichnet hier die Aneignung eines Gebiets; „in Besitz nehmen“ bewahrt zugleich den Zusammenhang mit Erbe und Landbesitz.
- source_word: מַלְכָּם
  choice: ihr König
  rationale: Die masoretische Vokalisierung des WLC liest מַלְכָּם als „ihr König“. Der Konsonantentext lässt zugleich die Deutung als Name des ammonitischen Gottes Milkom zu, die in einer Fußnote erhalten bleibt.
- source_word: אֶת־גָּד
  choice: Gad
  rationale: Der knappe Eigenname entspricht dem Hebräischen; im Kontext ist das Stammesgebiet Gads gemeint.
- source_word: וְעַמּוֹ בְּעָרָיו יָשָׁב
  choice: und sein Volk sich in dessen Städten niedergelassen
  rationale: „Sich niedergelassen“ gibt das vollendete ישב im Zusammenhang territorialer Besetzung natürlich wieder. „Dessen Städten“ macht verständlich, dass die Städte zu Gad beziehungsweise dessen Gebiet gehören.
theological_decisions:
- issue: Deutung von מַלְכָּם
  choice: ihr König
  alternative: Milkom, der Gott der Ammoniter
  rationale: Der vokalisierte masoretische Text bietet „ihr König“, während derselbe Konsonantenbestand auch als Gottesname Milkom gelesen werden kann. Die Hauptübersetzung folgt der angegebenen WLC-Vokalisierung; die religionsgeschichtlich gewichtige Alternative wird nicht unterdrückt, sondern in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorischen Fragen bleiben knapp und pointiert; die bildhafte Rede von Israel als einem erbenden Familienverband wird bewahrt.
