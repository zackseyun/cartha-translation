lexical_decisions:
- source_word: כִּי
  choice: Denn
  rationale: Gibt die begründende Verknüpfung mit dem vorausgehenden Zusammenhang natürlich und knapp wieder.
- source_word: הִנֵּה
  choice: siehe
  rationale: Bewahrt den feierlichen, aufmerksamkeitslenkenden Charakter der prophetischen Rede.
- source_word: קָטֹן נְתַתִּיךָ
  choice: ich habe dich klein gemacht
  rationale: Gibt die Konstruktion mit נתן und dem Prädikatsadjektiv eng wieder; gemeint ist eine geringe Stellung beziehungsweise Bedeutung.
- source_word: בַּגּוֹיִם
  choice: unter den Völkern
  rationale: Entspricht dem relationalen Gebrauch der Präposition und dem politischen Kontext.
- source_word: בָּזוּי בָּאָדָם
  choice: verachtet unter den Menschen
  rationale: Bewahrt die parallele Struktur des Hebräischen; der kollektive Singular אָדָם bezeichnet hier die Menschheit beziehungsweise Menschen allgemein.
theological_decisions:
- issue: Göttliches Handeln und gegenwärtiger Zustand Edoms
  choice: ich habe dich klein gemacht
  alternative: ich mache dich klein / ich werde dich klein machen
  rationale: Der hebräische Perfekt נְתַתִּיךָ wird formal als vollendetes göttliches Handeln wiedergegeben. Eine futurische Deutung als prophetisches Perfekt bleibt kontextuell möglich, wird aber nicht stillschweigend in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst prophetischem „siehe“. Die knappe Parallelität und die direkte Anrede des hebräischen Textes bleiben erhalten.
