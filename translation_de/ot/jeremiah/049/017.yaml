source:
  edition: WLC
  text: וְ/הָיְתָ֥ה אֱד֖וֹם לְ/שַׁמָּ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
translation:
  language: de
  text: Edom wird zur Einöde[a]. Jeder, der daran vorbeizieht, wird sich entsetzen und angesichts all seiner Wunden einen Pfiff ausstoßen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Entsetzen“ oder „zu einem Gegenstand des Entsetzens“. Das hebräische Wort bezeichnet eine Verwüstung und kann zugleich das Entsetzen ausdrücken, das sie hervorruft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zischen“. Das hebräische Verb bezeichnet einen scharfen Laut des Entsetzens, Erstaunens oder Spotts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: wird zu … werden
  rationale: Das Qal-Perfekt mit וְ steht im prophetischen Zusammenhang für ein zukünftiges Ergebnis. Die Formulierung gibt den eintretenden Zustand natürlich wieder.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Der Eigenname des Landes beziehungsweise Volkes wird in der geläufigen deutschen Form wiedergegeben.
- source_word: לְשַׁמָּה
  choice: zu einem Ort des Entsetzens
  rationale: שַׁמָּה bezeichnet sowohl die Verwüstung als auch das Entsetzen, das sie bei Betrachtern auslöst. Die gewählte Formulierung bewahrt beide Aspekte und verbindet sich mit dem folgenden יִשֹּׁם.
- source_word: כָּל עֹבֵר עָלֶיהָ
  choice: Jeder, der daran vorbeizieht
  rationale: Die kollektiv-singularische Wendung wird idiomatisch wiedergegeben. „Daran“ bezieht sich natürlich auf Edom als Land und vermeidet im Deutschen eine künstliche Personifizierung.
- source_word: יִשֹּׁם
  choice: wird sich entsetzen
  rationale: Das Verb שמם beschreibt hier die erschrockene, bestürzte Reaktion auf die Verwüstung. Zugleich bleibt die Wortverbindung mit שַׁמָּה erkennbar.
- source_word: וְיִשְׁרֹק
  choice: wird einen schrillen Pfiff ausstoßen
  rationale: Das Verb bezeichnet das Hervorbringen eines scharfen Lautes als Reaktion des Staunens, Entsetzens oder Spotts. Die konkrete Formulierung ist im heutigen Deutsch verständlicher als das isolierte „pfeifen“.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  choice: angesichts all seiner Wunden
  rationale: מַכּוֹת sind wörtlich Schläge und daraus entstandene Verletzungen oder Heimsuchungen. „Wunden“ veranschaulicht die sichtbaren Folgen; „angesichts“ gibt עַל als Anlass der Reaktion wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Entsetzens … entsetzen“ bildet die hebräische Verbindung zwischen שַׁמָּה und יִשֹּׁם ab. Edom wird grammatisch als Land behandelt; deshalb stehen „daran“ und „seiner“ statt einer im Deutschen unnatürlichen femininen Personifizierung.
