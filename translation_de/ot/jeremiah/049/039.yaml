base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/039.yaml
  text: But in the latter days I will restore the fortunes of Elam[a], declares Yahweh.
translation:
  language: de
  text: Doch am Ende der Tage werde ich das Geschick Elams wenden[a], spricht Jahwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werde ich Elam aus der Gefangenschaft zurückführen“ beziehungsweise „werde ich die Gefangenen Elams zurückbringen“. Die hebräische Wiederherstellungsformel kann konkret die Rückkehr aus der Gefangenschaft oder allgemeiner die Wiederherstellung guter Verhältnisse bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Doch
  rationale: Die Wendung leitet nach dem vorangehenden Gerichtswort eine zukünftige Umkehr ein. „Doch“ gibt diesen Gegensatz im Deutschen natürlich wieder, ohne die hebräische Konstruktion unnötig wörtlich nachzubilden.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: am Ende der Tage
  rationale: Die geläufige prophetische Zeitangabe bewahrt sowohl den Zukunftsbezug als auch mögliche endzeitliche Anklänge, ohne ein bestimmtes eschatologisches Schema festzulegen.
- source_word: אשוב אֶת שבית
  choice: werde ich das Geschick … wenden
  rationale: Die feste deutsche Wendung entspricht der hebräischen Wiederherstellungsformel und lässt eine umfassende Umkehr der Lage erkennen. Die engere Deutung als Rückführung von Gefangenen wird in der Fußnote bewahrt.
- source_word: עֵילָם
  choice: Elam
  rationale: Der Eigenname des Volkes beziehungsweise Landes wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feierliche prophetische Botenformel wird knapp und idiomatisch wiedergegeben; der Gottesname bleibt als persönlicher Name sichtbar.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Das Tetragramm wird mit der im Deutschen üblichen wissenschaftlichen Umschrift „Jahwe“ wiedergegeben, statt es durch einen Titel zu ersetzen.
theological_decisions:
- issue: Prophetisch-eschatologische Bedeutung von בְּאַחֲרִית הַיָּמִים
  choice: „am Ende der Tage“ ohne nähere zeitliche oder heilsgeschichtliche Festlegung
  alternative: „in künftigen Tagen“ oder „in den letzten Tagen“
  rationale: Der hebräische Ausdruck kann endzeitliches Gewicht tragen, bestimmt hier aber kein detailliertes eschatologisches Modell. Die Übersetzung bewahrt diese Offenheit und Spannung.
- issue: Bedeutung der Wiederherstellungsformel אשוב את שבית עילם
  choice: umfassende Wendung beziehungsweise Wiederherstellung des Geschicks Elams
  alternative: Rückführung Elams aus der Gefangenschaft oder Heimführung seiner Gefangenen
  rationale: Die Formel kann konkret die Rückkehr aus dem Exil bezeichnen, aber auch allgemeiner die Aufhebung des Gerichts und eine erneuerte gute Lage. Der Haupttext wahrt die Breite; die engere Möglichkeit steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Kürze und Feierlichkeit bleiben erhalten; „am Ende der Tage“ und „das Geschick wenden“ sind verständlich, ohne die Mehrdeutigkeit des Hebräischen vorschnell aufzulösen.
