  text: וְ/שַׂמְתִּ֥י כִסְאִ֖/י בְּ/עֵילָ֑ם וְ/הַאֲבַדְתִּ֥י מִ/שָּׁ֛ם מֶ֥לֶךְ וְ/שָׂרִ֖ים נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
translation:
  language: de
  text: Und ich werde meinen Thron in Elam aufstellen[a] und von dort den König und die Würdenträger[b] vernichten – Ausspruch Jahwes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meinen Thron in Elam hinstellen“ oder „errichten“. Das hebräische Verb kann „setzen“, „stellen“, „platzieren“ oder „errichten“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Fürsten“, „Machthaber“ oder „hohe Beamte“. Das hebräische Wort bezeichnet hochrangige Herrschafts- und Amtsträger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Und ich werde … aufstellen
  rationale: שׂים bedeutet hier „setzen, stellen, platzieren“. Mit dem konkreten Objekt „Thron“ ist „aufstellen“ im Deutschen natürlich und bewahrt die entschlossene Handlung, ohne ausdrücklich eine dauerhafte Herrschaftsordnung zu behaupten.
- source_word: כִסְאִי
  choice: meinen Thron
  rationale: כִּסֵּא bezeichnet im königlichen und richterlichen Zusammenhang einen Thron. Das konkrete Bild göttlicher Herrschaft und Gerichtsausübung bleibt erhalten.
- source_word: בְּעֵילָם
  choice: in Elam
  rationale: Die Präposition בְּ ist hier örtlich zu verstehen. „Gegen Elam“ würde eine adversative Bedeutung eintragen, die nicht ausdrücklich im Hebräischen steht.
- source_word: וְהַאֲבַדְתִּי
  choice: und … vernichten
  rationale: Der Hifil von אבד drückt das Zugrunde-Richten beziehungsweise Vernichten aus. „Vernichten“ ist klar, gewichtig und für prophetische Gerichtssprache angemessen.
- source_word: מִשָּׁם
  choice: von dort
  rationale: Die Form ist eindeutig örtlich und bezeichnet den Ausgangspunkt der Entfernung beziehungsweise Vernichtung.
- source_word: מֶלֶךְ
  choice: König
  rationale: Das hebräische Substantiv steht ohne Artikel. Auch im Deutschen kann „König“ hier ohne Artikel die königliche Herrschaft beziehungsweise den jeweiligen Herrscher bezeichnen, ohne ihn stärker zu bestimmen als der Ausgangstext.
- source_word: וְשָׂרִים
  choice: führende Männer
  rationale: שָׂרִים bezeichnet hochrangige Herrschaftsträger, Würdenträger oder Beamte. „Führende Männer“ ist gegenwärtig und verständlich, lässt aber die genaue institutionelle Stellung offen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: נְאֻם ist eine feierliche prophetische Botenformel. „Ausspruch Jahwes“ gibt ihre nominale und autoritative Prägung genauer wieder als ein schlichtes „sagt“; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. „Jahwe“ bewahrt ihn als Namen und ist die im modernen Deutschen übliche wissenschaftlich begründete Form, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung des Thrones im Gerichtswort
  choice: das konkrete Bild „meinen Thron“ beibehalten
  alternative: meine Herrschaft; meinen Richterstuhl
  rationale: Der Text verbindet königliche Herrschaft und Gericht, legt aber die Funktion des Thrones nicht ausdrücklich auf nur einen Aspekt fest. Daher wird das Bild nicht deutend aufgelöst.
- issue: Reichweite von König und שָׂרִים
  choice: König und führende Männer
  alternative: den König und die Fürsten; König und Beamte
  rationale: Die Formulierung bezeichnet Elams Herrschaftsspitze, ohne klar zu entscheiden, ob שָׂרִים dynastische Fürsten, politische Machthaber oder Amtsträger sind. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige prophetische Sprache. Die Satzstruktur folgt dem hebräischen Parallelismus, bleibt aber idiomatisch deutsch. Der Gedankenstrich hebt die abschließende Botenformel ab. Sämtliche Fußnotenmarker erscheinen im Haupttext.
