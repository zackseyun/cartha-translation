source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י אֶל עֵילָ֜ם אַרְבַּ֣ע רוּח֗וֹת מֵֽ/אַרְבַּע֙ קְצ֣וֹת הַ/שָּׁמַ֔יִם וְ/זֵ֣רִתִ֔י/ם לְ/כֹ֖ל הָ/רֻח֣וֹת הָ/אֵ֑לֶּה וְ/לֹֽא יִהְיֶ֣ה הַ/גּ֔וֹי אֲשֶׁ֛ר לֹֽא יָב֥וֹא שָׁ֖ם נִדְּחֵ֥י עולם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
translation:
  language: de
  text: Ich werde die vier Winde von den vier Enden des Himmels[a] gegen Elam heranführen und die Elamiter in alle diese Winde zerstreuen. Es wird kein Volk geben, zu dem die Vertriebenen Elams[b] nicht kommen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von den vier äußersten Punkten des Himmels“; traditionell auch: „von den vier Ecken des Himmels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Versprengten Elams“ beziehungsweise „die Verbannten Elams“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל עֵילָם
  choice: Ich werde … gegen Elam heranführen
  rationale: Das Hifil von בוא mit אֶל kann ein Heranbringen bezeichnen; im Gerichtskontext gibt „gegen Elam heranführen“ die feindliche Ausrichtung natürlich wieder.
- source_word: אַרְבַּע רוּחוֹת
  choice: die vier Winde
  rationale: רוּחוֹת bezeichnet hier angesichts der vier Himmelsenden die Winde beziehungsweise Himmelsrichtungen, nicht Geister.
- source_word: מֵאַרְבַּע קְצוֹת הַשָּׁמַיִם
  choice: von den vier Enden des Himmels
  rationale: קְצוֹת bezeichnet Enden oder äußerste Punkte. Die Formulierung bleibt bildhaft und nah am Hebräischen.
- source_word: וְזֵרִתִים
  choice: und die Elamiter … zerstreuen
  rationale: זרה bezeichnet das Zerstreuen, ursprünglich auch das Worfeln. „Die Elamiter“ macht den Bezug des männlichen Pluralpronomens auf das kollektiv genannte Elam im Deutschen verständlich.
- source_word: לְכֹל הָרֻחוֹת הָאֵלֶּה
  choice: in alle diese Windrichtungen
  rationale: „Windrichtungen“ bewahrt das Bild von רוּחוֹת und klingt im Deutschen natürlicher als „in alle diese Winde“.
- source_word: וְלֹא יִהְיֶה הַגּוֹי אֲשֶׁר לֹא יָבוֹא שָׁם
  choice: Es wird kein Volk geben, zu dem … nicht kommen werden
  rationale: Die doppelte Verneinung drückt die vollständige Zerstreuung aus; „zu dem“ gibt die durch das Bewegungsverb bezeichnete Zielrichtung präzise wieder.
- source_word: נִדְּחֵי עֵילָם
  choice: die Vertriebenen Elams
  rationale: נִדְּחֵי bezeichnet Menschen, die fortgetrieben oder zerstreut wurden. „Vertriebene“ gibt diesen erzwungenen Vorgang klar und würdig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-prophetischem Ton. Die kosmische Bildsprache der vier Winde und der Himmelsenden bleibt erhalten; „Windrichtungen“ vermeidet zugleich eine unnatürliche deutsche Formulierung.
