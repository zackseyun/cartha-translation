  to: Ich werde die vier Winde von den vier Enden des Himmels[a] gegen Elam heranführen und die Elamiter in alle diese Winde zerstreuen. Es wird kein Volk geben, zu dem die Vertriebenen Elams[b] nicht kommen werden.
