  source_fidelity: 'Der Entwurf gibt die Syntax und den Sinn des Hebräischen insgesamt zuverlässig wieder: JHWH bringt die vier Winde gegen Elam, zerstreut dessen Bewohner in alle Richtungen, und ihre Vertriebenen gelangen zu jeder Nation. „Windrichtungen“ erklärt jedoch das im Hebräischen bewusst wiederholte Bild von רוּחוֹת (»Winden«) und sollte deshalb im Text nicht an dessen Stelle treten.'
