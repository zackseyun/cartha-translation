  terminology: „Elam“, „die vier Winde“, „Enden des Himmels“ und „Vertriebenen Elams“ sind treffend. Die Fußnotenalternative „Verschleppten“ ist enger als נִדְּחֵי und kann eine konkrete Deportation nahelegen; „Verbannten“ ist als Alternative sachgerechter.
