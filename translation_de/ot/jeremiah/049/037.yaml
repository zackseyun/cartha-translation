source:
  edition: WLC
  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
translation:
  language: de
  text: Ich werde Elam vor seinen Feinden und vor denen, die ihm nach dem Leben trachten, zerschmettern[a]. Ich werde Unheil[c] über sie bringen, meinen glühenden Zorn, spricht Jahwe. Und ich werde das Schwert hinter ihnen her senden, bis ich sie vernichtet habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in Schrecken versetzen“ oder „bestürzen“; das hebräische Verb kann sowohl das Auslösen von Panik als auch einen Zusammenbruch bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Verderben“; das hebräische Wort bezeichnet hier Unheil als Gericht, nicht moralische Bosheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  choice: Ich werde … zerschmettern
  rationale: Das Hifil von חתת kann ein Erschrecken, Zusammenbrechen oder Zerschmettertwerden verursachen bezeichnen. Im Zusammenhang militärischen Gerichts bewahrt „zerschmettern“ sowohl den Gedanken des Zusammenbruchs als auch den einer vernichtenden Niederlage.
- source_word: עֵילָם
  choice: Elam
  rationale: Der Eigenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: vor seinen Feinden
  rationale: לִפְנֵי bedeutet hier „vor, angesichts, in der Gewalt/Gegenwart von“. Das kollektive Elam wird im Deutschen mit dem Singularpronomen aufgenommen.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: die ihm nach dem Leben trachten
  rationale: Die hebräische Wendung „sein/ihr Leben suchen“ meint, jemanden töten zu wollen. Die deutsche Redewendung ist natürlich und bildet das Bild eng nach.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  choice: Ich werde Unheil über sie bringen
  rationale: רָעָה bezeichnet in diesem prophetischen Gerichtskontext Unheil oder Verderben, nicht moralische Bosheit. Der Wechsel zum Plural folgt dem hebräischen Text und versteht Elam als Bevölkerung.
- source_word: אֶת חֲרוֹן אַפִּי
  choice: meinen glühenden Zorn
  rationale: Die Formulierung bewahrt das hebräische Bild der Hitze beziehungsweise des Brennens des Zorns.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht Jahwe“ ist eine knappe, würdige Wiedergabe der prophetischen Botenformel.
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת־הַחֶרֶב
  choice: ich werde das Schwert hinter ihnen herschicken
  rationale: Die Wiedergabe erhält das lebhafte Bild eines Schwertes, das den Fliehenden nachgesandt wird.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  choice: bis ich sie vernichtet habe
  rationale: כלה bezeichnet hier das vollständige Aufreiben oder Vernichten. „Vernichtet“ ist im modernen Deutschen klar und wahrt die umfassende Gerichtsandrohung.
theological_decisions:
- issue: רָעָה als Folge göttlichen Handelns
  choice: Unheil
  alternative: Böses; Verderben
  rationale: Im Kontext prophetischen Gerichts bezeichnet das Wort eine verhängte Katastrophe, nicht moralisches Böses. „Unheil“ erhält den Ernst der Aussage, ohne eine sachfremde moralische Deutung einzutragen.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, sodass der im hebräischen Text ausdrücklich stehende Gottesname sichtbar bleibt.
- issue: Numeruswechsel bei Elam
  choice: zunächst Singular, danach Plural
  alternative: durchgehend Plural oder durchgehend Singular
  rationale: Der hebräische Text nennt das kollektive Elam und verwendet anschließend Pluralsuffixe. Die deutsche Fassung bewahrt diese Spannung, indem sie Elam zunächst als Einheit und danach seine Angehörigen als Mehrzahl anspricht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Gerichtsrede bleibt bildkräftig und knapp. Der Wechsel von „seinen/ihm“ zu „sie/ihnen“ bildet den hebräischen Wechsel zwischen Elam als kollektivem Einzelgebilde und seinen Angehörigen nach.
