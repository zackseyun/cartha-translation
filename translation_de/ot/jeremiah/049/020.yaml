  terminology: „Jahwe“, „Ratschluss“, „Bewohner Temans“ und „Wohnstätte“ sind angemessen. „Die Kleinen der Herde“ wahrt die Bildsprache und die lexikalische Offenheit besser als „die Geringsten der Herde“; die mögliche metaphorische Deutung bleibt in der Anmerkung kenntlich.
