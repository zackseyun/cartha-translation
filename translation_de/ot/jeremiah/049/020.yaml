source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
translation:
  language: de
  text: 'Darum hört den Ratschluss Jahwes, den er gegen Edom gefasst hat, und seine Pläne, die er gegen die Bewohner Temans geschmiedet hat: Wahrlich, die Kleinen der Herde werden sie fortschleppen[a]; wahrlich, wird er ihre Wohnstätte über ihnen zur Wüstung machen[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Jüngsten“ bzw. „die Geringsten der Herde“. Die Wendung kann bildlich die geringsten oder schwächsten Angreifer bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Wohnstätte“ kann auch „Weide“ oder „Hürde“ bedeuten. Die hebräische Wendung „über ihnen“ ist ungewöhnlich und wird hier bewusst nicht als „ihretwegen“ gedeutet.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Die Folgerungspartikel leitet die Konsequenz aus dem vorausgehenden Gerichtswort ein; „Darum“ ist prägnant und natürlich.
- source_word: שִׁמְעוּ
  choice: hört
  rationale: Der Pluralimperativ bewahrt den feierlichen prophetischen Aufruf.
- source_word: עֲצַת יְהוָה
  choice: den Ratschluss Jahwes
  rationale: עֵצָה bezeichnet hier den beschlossenen Rat oder Plan Gottes. „Ratschluss“ wahrt den Aspekt göttlicher Beratung und Zielsetzung; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: יָעַץ אֶל אֱדוֹם
  choice: den er gegen Edom gefasst hat
  rationale: Im feindlichen Gerichtskontext gibt אֶל die Ausrichtung gegen Edom an; „einen Ratschluss fassen“ ist idiomatisches Deutsch.
- source_word: מַחְשְׁבוֹתָיו ... חָשַׁב
  choice: seine Pläne, die er ... geschmiedet hat
  rationale: Die bewusste, zielgerichtete Absicht wird natürlich ausgedrückt, während die begriffliche Unterscheidung zum vorherigen „Ratschluss“ erhalten bleibt.
- source_word: יֹשְׁבֵי תֵימָן
  choice: die Bewohner Temans
  rationale: Direkte und im Deutschen natürliche Wiedergabe der Konstruktverbindung.
- source_word: אִם לֹא
  choice: Wahrlich
  rationale: Die zweimalige Formel ist hier keine gewöhnliche Bedingung, sondern eine nachdrückliche, eidartige Bekräftigung.
- source_word: יִסְחָבוּם
  choice: werden sie fortschleppen
  rationale: סחב bezeichnet gewaltsames Schleppen oder Wegziehen; „fortschleppen“ erhält das drastische Bild.
- source_word: צְעִירֵי הַצֹּאן
  choice: selbst die Geringsten der Herde
  rationale: צָעִיר kann die Kleinen, Jungen oder Geringen bezeichnen. Im Kontext liegt eine metaphorische Bezeichnung der unbedeutendsten oder schwächsten Angreifer nahe; „der Herde“ bewahrt zugleich das Bild.
- source_word: נְוֵהֶם
  choice: ihre Wohnstätte
  rationale: נָוֶה kann Weide, Hürde oder Wohnstätte bedeuten. Da Edoms menschliche Bewohner gemeint sind und die Metapher nicht eindeutig durchgehend ist, bleibt „Wohnstätte“ sachlich offen.
- source_word: יַשִּׁים עֲלֵיהֶם נְוֵהֶם
  choice: ihre Wohnstätte wird er über ihnen verwüsten
  rationale: Die resultative Bedeutung des Hiphil wird idiomatisch als „verwüsten“ ausgedrückt; „über ihnen“ wahrt die ungewöhnliche räumliche Formulierung עֲלֵיהֶם, ohne sie kausal umzudeuten.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von צְעִירֵי הַצֹּאן
  choice: selbst die Geringsten der Herde
  alternative: die Jungen der Herde
  rationale: Die Formulierung kann wörtlich die kleinen oder jungen Tiere meinen, dürfte hier aber metaphorisch die geringsten Angreifer bezeichnen. Der Haupttext wahrt mit „der Herde“ das Bild und lässt die Fußnote die lexikalische Spannweite erkennen.
- issue: Subjekt der letzten Aussage
  choice: 'Jahwe als fortgeführtes Subjekt: „wird er ... verwüsten“'
  alternative: unpersönlich oder auf die Angreifer bezogen
  rationale: Die dritte Person Singular von יַשִּׁים legt den zuvor genannten Jahwe als Subjekt nahe; der Wechsel vom pluralischen יִסְחָבוּם wird dabei nicht eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-feierlichem Ton. Die Wiederholung „Wahrlich“ bildet die doppelte Bekräftigungsformel ab. Bildsprache und die ungewöhnliche Schlusskonstruktion bleiben erkennbar, ohne unnatürlich wörtlich zu werden.
