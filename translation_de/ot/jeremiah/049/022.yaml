  text: הִנֵּ֤ה כַ/נֶּ֨שֶׁר֙ יַעֲלֶ֣ה וְ/יִדְאֶ֔ה וְ/יִפְרֹ֥שׂ כְּנָפָ֖י/ו עַל בָּצְרָ֑ה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י אֱדוֹם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
translation:
  language: de
  text: Siehe, wie ein Adler[a] steigt er auf, fliegt und breitet seine Flügel über Bozra aus. An jenem Tag wird das Herz der Krieger Edoms wie das Herz einer Frau in den Wehen sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geier“. Das hebräische Wort kann allgemeiner einen großen Greifvogel bezeichnen; „Adler“ ist hier die herkömmliche Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Siehe
  rationale: Bewahrt den prophetischen Aufmerksamkeitsruf in würdiger, noch verständlicher Sprache.
- source_word: כַנֶּשֶׁר
  choice: wie ein Adler
  rationale: נֶשֶׁר bezeichnet einen großen Greifvogel und wird herkömmlich mit „Adler“ wiedergegeben; die mögliche Bedeutung „Geier“ bleibt in der Fußnote erhalten.
- source_word: יַעֲלֶה וְיִדְאֶה
  choice: steigt er auf, fliegt dahin
  rationale: Gibt die Aufwärtsbewegung und das schnelle beziehungsweise gleitende Fliegen wieder, ohne eine im Hebräischen nicht ausdrücklich genannte Abwärtsbewegung hinzuzufügen.
- source_word: וְיִפְרֹשׂ כְּנָפָיו עַל בָּצְרָה
  choice: und breitet seine Flügel über Bozra aus
  rationale: Bewahrt das konkrete Bild des bedrohlich über der Stadt ausgebreiteten Flügelpaars und gibt עַל räumlich mit „über“ wieder.
- source_word: לֵב גִּבּוֹרֵי אֱדוֹם
  choice: das Herz der Krieger Edoms
  rationale: „Krieger“ gibt den militärischen Sinn von גִּבּוֹרִים klar wieder; „Herz“ bleibt als hebräisches Menschenbild erhalten und wird nicht deutend durch „Mut“ ersetzt.
- source_word: בַּיּוֹם הַהוּא
  choice: An jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetischen Zeitangabe.
- source_word: וְהָיָה ... כְּלֵב אִשָּׁה מְצֵרָה
  choice: wird ... wie das Herz einer Frau in den Wehen sein
  rationale: Entspricht eng der Zustandsaussage und bewahrt das Bild von Angst und Qual während der Geburtswehen.
theological_decisions:
- issue: Bezug des mit einem Adler verglichenen Angreifers
  choice: Das grammatisch männliche Subjekt bleibt mit „er“ unbestimmt.
  alternative: Den Angreifer ausdrücklich als Nebukadnezar, den König von Babel, JHWH oder eine unbestimmte Invasionsmacht benennen.
  rationale: Der Zusammenhang legt den babylonischen Angreifer nahe, doch der Vers selbst nennt ihn nicht. Die Übersetzung bewahrt diese literarische und theologische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. „Siehe“ trägt die feierliche Signalwirkung des Hebräischen; Satzbau und Wortwahl bleiben zugleich für heutige Leser verständlich.
