  text: לֶ/אֱד֗וֹם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הַ/אֵ֥ין ע֛וֹד חָכְמָ֖ה בְּ/תֵימָ֑ן אָבְדָ֤ה עֵצָה֙ מִ/בָּנִ֔ים נִסְרְחָ֖ה חָכְמָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
translation:
  language: de
  text: 'Über Edom:


    So spricht Jahwe, der Herr der Heerscharen:


    Gibt es in Teman keine Weisheit mehr?


    Ist den Verständigen der Rat abhandengekommen?


    Ist ihre Weisheit verdorben?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ist den Einsichtigen der Rat verlorengegangen?“ Das hebräische Wort bezeichnet Menschen mit Verständnis, nicht leibliche „Söhne“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ist ihre Weisheit schlecht geworden?“ Das hebräische Verb kann etwas bezeichnen, das verdorben, ranzig oder unbrauchbar geworden ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  choice: Über Edom
  rationale: Die Präposition לְ kennzeichnet hier den Gegenstand des prophetischen Ausspruchs. „Über Edom“ wahrt die Offenheit gegenüber einem bloßen „an“ oder ausdrücklich feindlichen „gegen“.
- source_word: יְהוָה צְבָאוֹת
  choice: Jahwe, der Herr der Heerscharen
  rationale: „Jahwe“ gibt den Gottesnamen wieder; „Herr der Heerscharen“ bewahrt das militärische beziehungsweise himmlische Bild von צְבָאוֹת in geläufigem, würdigem Deutsch.
- source_word: הַאֵין עוֹד חָכְמָה
  choice: Gibt es ... keine Weisheit mehr?
  rationale: Die deutsche Existenzfrage bildet הַאֵין עוֹד natürlich ab und bringt das mögliche Aufhören der sprichwörtlichen Weisheit Temans zum Ausdruck.
- source_word: אָבְדָה עֵצָה מִבָּנִים
  choice: Ist den Verständigen der Rat abhandengekommen?
  rationale: מִבָּנִים bezeichnet hier Menschen mit Einsicht, nicht „Söhne“. „Abhandengekommen“ gibt אָבְדָה idiomatisch als Verlust wieder, ohne den Rat zu personifizieren.
- source_word: נִסְרְחָה חָכְמָתָם
  choice: Ist ihre Weisheit verdorben?
  rationale: Das Verb bezeichnet ein Verderben oder Schlechtwerden. „Verdorben“ bewahrt dieses kräftige Bild und lässt offen, ob moralische Korruption oder Untauglichkeit im Vordergrund steht.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift macht den persönlichen Bundesnamen im Ausgangstext sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von צְבָאוֹת
  choice: Herr der Heerscharen
  alternative: der Allmächtige
  rationale: Die gewählte Fassung erhält die konkrete militärische und himmlische Bildwelt; „der Allmächtige“ würde sie zugunsten einer theologischen Deutung verallgemeinern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Zeilenfall. Die drei rhetorischen Fragen und die zugespitzte Wiederholung von „Weisheit“ bleiben erhalten. „Verständige“ ist allgemein verständlich, während „verdorben“ die ungewöhnlich sinnliche Metapher des hebräischen Schlussverbs bewahrt.
