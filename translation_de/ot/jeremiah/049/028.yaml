  variant: modern standard German
source:
  edition: WLC
  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
translation:
  language: de
  text: 'Über Kedar und die Königreiche von Hazor[a], die Nebukadnezar[b], der König von Babel, niederschlug. So spricht Jahwe: Macht euch auf, zieht gegen Kedar und plündert die Leute des Ostens[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Identifizierung von Hazor an dieser Stelle ist unsicher; vermutlich ist nicht die bekannte kanaanäische Stadt Hazor gemeint.
    reason: historical_ambiguity
  - marker: b
    text: Die hebräische Schreibweise entspricht hier eher „Nebukadrezar“; „Nebukadnezar“ ist die geläufige deutsche Namensform.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die Söhne des Ostens“; gemeint sind Menschen oder Volksgruppen aus den östlichen Wüstengebieten.'
    reason: idiom
lexical_decisions:
- source_word: לְקֵדָר וּלְמַמְלְכוֹת חָצוֹר
  choice: Über Kedar und die Königreiche von Hazor
  rationale: Das vorangestellte לְ kennzeichnet hier am natürlichsten das Thema des prophetischen Ausspruchs. Der Plural מַמְלְכוֹת bleibt als „Königreiche“ erhalten.
- source_word: אֲשֶׁר הִכָּה
  choice: die … niederschlug
  rationale: נכה bezeichnet im militärischen Zusammenhang das Schlagen oder Besiegen. „Niederschlug“ wahrt die kräftige Bildsprache und lässt das Relativpronomen auf Kedar und die Königreiche bezogen sein.
- source_word: נבוכדראצור מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, der König von Babel
  rationale: „Nebukadnezar“ ist die im Deutschen geläufige Namensform; „Babel“ entspricht dem biblischen Orts- und Reichsnamen בָּבֶל.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die traditionelle deutsche Prophetenformel gibt כֹּה אָמַר knapp und würdig wieder; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: קוּמוּ עֲלוּ אֶל קֵדָר
  choice: Macht euch auf, zieht gegen Kedar
  rationale: Die beiden pluralischen Imperative werden bewahrt. Wegen des folgenden Plünderungsbefehls hat אֶל hier eindeutig feindliche Richtung; „gegen“ drückt dies natürlich aus.
- source_word: וְשָׁדְדוּ
  choice: und plündert
  rationale: שׁדד bezeichnet im Kriegskontext das Ausrauben beziehungsweise Plündern; „plündert“ ist klar, gegenwärtig und präzise.
- source_word: בְּנֵי קֶדֶם
  choice: die Leute des Ostens
  rationale: Wörtlich steht „Söhne des Ostens“, eine ethnogeografische Wendung für Menschen beziehungsweise Gruppen aus den östlichen Wüstengebieten. „Leute des Ostens“ gibt den Sinn verständlich wieder, ohne eine genauere Volkszugehörigkeit festzulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. „Jahwe“ gibt den persönlichen Gottesnamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug des göttlichen Befehls
  choice: Der Wortlaut bleibt als Befehl zum militärischen Vorgehen und Plündern stehen.
  alternative: Abschwächende Umschreibung als bloße Ankündigung einer Niederlage
  rationale: Die pluralischen Imperative קוּמוּ, עֲלוּ und שָׁדְדוּ sind ausdrücklich befehlend. Die theologische Spannung eines solchen Gerichtswortes darf nicht stillschweigend gemildert werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. „Macht euch auf“ und „So spricht Jahwe“ bewahren den gehobenen biblischen Klang, ohne veraltet zu wirken. Die Übersetzung folgt der knappen, überschriftartigen Syntax des Hebräischen.
