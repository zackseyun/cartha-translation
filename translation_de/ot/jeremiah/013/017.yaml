source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
translation:
  language: de
  text: Doch wenn ihr nicht darauf hört[a], wird meine Seele im Verborgenen über den Hochmut weinen. Bitterlich wird mein Auge weinen, und Tränen werden ihm entströmen, denn die Herde Jahwes ist gefangen weggeführt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „darauf achtet“ beziehungsweise „dem gehorcht“; das hebräische Verb kann sowohl Hören als auch Beachten und Gehorchen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  choice: darauf hört
  rationale: שׁמע umfasst Hören, Beachten und Gehorchen. Das feminine Suffix wird durch „darauf“ wiedergegeben und verweist am ehesten auf die zuvor ausgesprochene Mahnung, ohne den Bezug genauer festzulegen.
- source_word: בְּמִסְתָּרִים
  choice: im Verborgenen
  rationale: Die wörtlich pluralische Wendung „an verborgenen Orten“ bezeichnet verborgenes, unbeobachtetes Trauern; „im Verborgenen“ ist im Deutschen natürlich und bewahrt das Bild.
- source_word: תִּבְכֶּה נַפְשִׁי
  choice: wird meine Seele … weinen
  rationale: Die ausdrückliche Wiedergabe von נֶפֶשׁ bewahrt die poetische Innigkeit und Tiefe des Kummers.
- source_word: מִפְּנֵי גֵוָה
  choice: über den Hochmut
  rationale: Die Präposition bezeichnet hier den Anlass des Weinens. „Hochmut“ gibt גֵוָה prägnant wieder; „Überheblichkeit“ wäre ebenfalls möglich.
- source_word: וְדָמֹעַ תִּדְמַע
  choice: Bitterlich wird mein Auge weinen
  rationale: Infinitivus absolutus und finites Verb verstärken gemeinsam den Vorgang. „Bitterlich“ bringt die Intensität in natürlichem, würdigem Deutsch zum Ausdruck.
- source_word: וְתֵרַד עֵינִי דִּמְעָה
  choice: Tränen werden ihm entströmen
  rationale: Das poetische Singularwort „mein Auge“ bleibt erhalten; „entströmen“ gibt die abwärts fließenden Tränen idiomatisch und bildhaft wieder.
- source_word: נִשְׁבָּה
  choice: ist gefangen weggeführt worden
  rationale: Der Niphal von שׁבה bezeichnet das Gefangennehmen beziehungsweise die Wegführung in Gefangenschaft. Die Formulierung erhält beide Aspekte.
- source_word: עֵדֶר יְהוָה
  choice: die Herde Jahwes
  rationale: Der Genitiv bewahrt das Hirten- und Herdenbild sowie die Zugehörigkeit des Volkes zu Jahwe.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname transliteriert und nicht durch einen Titel ersetzt.
theological_decisions:
- issue: Bezug des femininen Suffixes in תִשְׁמָעוּהָ
  choice: „darauf“ verweist auf die zuvor ausgesprochene Mahnung oder Botschaft
  alternative: Das Suffix kann allgemeiner auf die Warnung bezogen oder als wenig eigenständiges Objektelement verstanden werden.
  rationale: Die Übersetzung bildet das Suffix ab, ohne seinen im Hebräischen nicht ausdrücklich benannten Bezug dogmatisch festzulegen.
- issue: Stimme der Klage
  choice: Die Ich-Stimme wird als persönliche Klage des Propheten wiedergegeben.
  alternative: Durch den Propheten kann zugleich Jahwes eigener Schmerz anklingen.
  rationale: Der Text spricht ausdrücklich in der ersten Person, lässt aber die theologische Spannung zwischen prophetischem und göttlichem Schmerz bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Ton. Der Parallelismus und das singularische Bild „mein Auge“ bleiben erhalten; schwerfällige Wörtlichkeit wird vermieden.
