  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/008.yaml
  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an mich[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und es geschah: Das Wort Jahwes kam zu mir, indem es sagte.“'
    reason: Die Fußnote macht die hebräische Satzform sichtbar, während der Haupttext die übliche deutsche Prophetenformel verwendet.
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Wayyiqtol-Form führt das nächste Ereignis der Erzählfolge ein. Zusammen mit דְבַר ergibt sich im Deutschen die natürliche prophetische Formel „Da erging das Wort …“, ohne das altertümliche „Und es geschah“.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt die lexikalische Gestalt und den etablierten prophetischen Sinn von דָּבָר besser als das stärker deutende „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird in seiner im Deutschen gebräuchlichen Form wiedergegeben, statt ihn durch den Titel „der HERR“ zu ersetzen.
- source_word: אֵלַי
  choice: an mich
  rationale: Bei der deutschen Wendung „das Wort erging“ ist „an mich“ die natürliche Entsprechung der Präposition אֶל mit dem Suffix der ersten Person Singular.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet die unmittelbar folgende Gottesrede im Deutschen idiomatisch ein und erfüllt hier die Funktion des hebräischen Infinitivs „sprechend/um zu sagen“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ bewahrt ihn als Namen; die Schreibweise ist an den modernen deutschen Sprachgebrauch angepasst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feste Wendung „das Wort Jahwes erging an mich“ klingt schriftsprachlich, ist aber klar und für prophetische Rede angemessen; der Doppelpunkt bereitet die Rede des folgenden Verses vor.
