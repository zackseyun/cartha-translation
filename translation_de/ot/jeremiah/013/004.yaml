id: JER.13.4
reference: Jeremiah 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קַ֧ח אֶת הָ/אֵז֛וֹר אֲשֶׁ֥ר קָנִ֖יתָ אֲשֶׁ֣ר עַל מָתְנֶ֑י/ךָ וְ/קוּם֙ לֵ֣ךְ פְּרָ֔תָ/ה וְ/טָמְנֵ֥/הוּ שָׁ֖ם בִּ/נְקִ֥יק הַ/סָּֽלַע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
translation:
  language: de
  text: Nimm den Gürtel, den du gekauft hast und um die Hüften trägst. Steh auf, geh nach Perat[a] und verstecke ihn dort in einer Felsspalte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perat wird traditionell mit dem Euphrat gleichgesetzt; viele Übersetzungen geben den Namen daher mit „Euphrat“ wieder.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵזוֹר
  choice: Gürtel
  rationale: Das Wort bezeichnet etwas, das um die Hüften getragen wird. „Gürtel“ ist im modernen Deutschen natürlich und verständlich, ohne die Form des Gegenstands so stark festzulegen wie „Lendenschurz“.
- source_word: קָנִיתָ
  choice: gekauft hast
  rationale: Das Verb kann „kaufen“ oder allgemeiner „erwerben“ bedeuten. Der unmittelbare Erzählzusammenhang legt hier die konkrete Bedeutung „kaufen“ nahe.
- source_word: עַל מָתְנֶיךָ
  choice: um die Hüften trägst
  rationale: מָתְנַיִם bezeichnet die Hüft- beziehungsweise Lendengegend. Die Formulierung gibt den Sinn in natürlichem modernem Deutsch wieder.
- source_word: וְקוּם
  choice: Steh auf
  rationale: Der Imperativ leitet die folgende Handlung nachdrücklich ein; „Steh auf“ ist unmittelbar, modern und dennoch würdig.
- source_word: פְּרָתָה
  choice: nach Perat
  rationale: Die Richtungsendung wird mit „nach“ wiedergegeben, während der hebräische Ortsname als „Perat“ transliteriert wird. Seine traditionelle Gleichsetzung mit dem Euphrat bleibt in der Fußnote erhalten.
- source_word: טָמְנֵהוּ
  choice: verstecke ihn
  rationale: Das Verb bedeutet „verbergen/verstecken“ und kann je nach Zusammenhang auch ein Vergraben einschließen. „Verstecken“ vermeidet eine nicht ausdrücklich genannte Art des Verbergens.
- source_word: נְקִיק הַסָּלַע
  choice: Felsspalte
  rationale: Die Verbindung bezeichnet eine Spalte oder Kluft im Fels. Das deutsche Kompositum ist knapp, anschaulich und idiomatisch.
theological_decisions:
- issue: Identifizierung von פְּרָתָה
  choice: Der Ortsname steht im Haupttext als „Perat“.
  alternative: „Euphrat“
  rationale: Die traditionelle Identifizierung mit dem Euphrat ist verbreitet, aber die Ortsbestimmung ist nicht völlig sicher. Der Haupttext bewahrt daher den hebräischen Namen, während die traditionelle Deutung in einer Fußnote genannt wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt handlungsnah; „Felsspalte“ und „um die Hüften trägst“ vermeiden archaische oder unnötig technische Ausdrucksweisen.
