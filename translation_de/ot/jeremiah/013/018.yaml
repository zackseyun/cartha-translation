id: JER.13.18
reference: Jeremiah 13:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אֱמֹ֥ר לַ/מֶּ֛לֶךְ וְ/לַ/גְּבִירָ֖ה הַשְׁפִּ֣ילוּ שֵׁ֑בוּ כִּ֤י יָרַד֙ מַרְאֲשׁ֣וֹתֵי/כֶ֔ם עֲטֶ֖רֶת תִּֽפְאַרְתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
translation:
  language: de
  text: 'Sag zum König und zur Königinmutter[a]: »Demütigt euch und setzt euch nieder, denn eure prächtige Krone[b] ist von euren Häuptern herabgesunken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hebräische Titel גְּבִירָה kann im königlichen Umfeld die Mutter des Königs bezeichnen und muss nicht dessen Ehefrau meinen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »die Krone eurer Pracht« oder »die Krone eurer Herrlichkeit«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: Sag
  rationale: Der Imperativ Singular leitet knapp und natürlich den prophetischen Auftrag zur direkten Anrede ein.
- source_word: לַמֶּלֶךְ
  choice: zum König
  rationale: Die bestimmte Singularform mit Präposition bezeichnet den regierenden König.
- source_word: וְלַגְּבִירָה
  choice: und zur Königinmutter
  rationale: גְּבִירָה ist im königlichen Umfeld ein Hoheitstitel und bezeichnet hier wahrscheinlich die Mutter des Königs, nicht seine Ehefrau.
- source_word: הַשְׁפִּילוּ
  choice: Demütigt euch
  rationale: Der Hifil-Imperativ Plural fordert dazu auf, eine niedrige Stellung einzunehmen; die Wiedergabe bewahrt sowohl die soziale Erniedrigung als auch die räumliche Abwärtsbewegung.
- source_word: שֵׁבוּ
  choice: setzt euch nieder
  rationale: Der Imperativ Plural von ישׁב wird im Deutschen idiomatisch mit »setzt euch nieder« wiedergegeben und bildet mit dem vorherigen Befehl eine passende Einheit.
- source_word: כִּי
  choice: denn
  rationale: Die Konjunktion führt die Begründung für die beiden Aufforderungen ein.
- source_word: יָרַד
  choice: ist … herabgesunken
  rationale: Das Qal Perfekt bezeichnet eine vollzogene Abwärtsbewegung. »Herabgesunken« erhält das Bild, ohne ausdrücklich festzulegen, ob die Krone fiel oder im Gericht abgenommen wurde.
- source_word: מַרְאֲשׁוֹתֵיכֶם
  choice: von euren Häuptern
  rationale: Das Wort kann den Platz am Kopf oder das Kopfende bezeichnen; zusammen mit der Krone ist der Bezug auf die Häupter der Angeredeten am plausibelsten. »Häupter« passt zum gehobenen königlichen Kontext.
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  choice: eure prächtige Krone
  rationale: Die natürliche deutsche Formulierung gibt die Genitivverbindung wörtlich »Krone eurer Pracht/Herrlichkeit« sinngemäß wieder; die formalere Alternative wird in der Fußnote erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt knapp und eindringlich; »Häupter« bewahrt den königlichen Ton, ohne den Vers insgesamt unnötig zu archaisieren.
