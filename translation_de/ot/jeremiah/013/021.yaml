  text: מַה תֹּֽאמְרִי֙ כִּֽי יִפְקֹ֣ד עָלַ֔יִ/ךְ וְ֠/אַתְּ לִמַּ֨דְתְּ אֹתָ֥/ם עָלַ֛יִ/ךְ אַלֻּפִ֖ים לְ/רֹ֑אשׁ הֲ/ל֤וֹא חֲבָלִים֙ יֹאחֱז֔וּ/ךְ כְּמ֖וֹ אֵ֥שֶׁת לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
translation:
  language: de
  text: Was wirst du sagen, wenn er diejenigen über dich setzt, die du selbst dazu angeleitet hast, Oberhäupter über dich zu sein?[a][b] Werden dich nicht Wehen packen wie eine Frau, die gebiert?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wenn er dich heimsucht / zur Rechenschaft zieht«; das hebräische Verb kann »sich jemandem zuwenden«, »heimsuchen«, »bestrafen« oder »einsetzen« bedeuten. Hier legt die Erwähnung von Oberhäuptern die Bedeutung »einsetzen« nahe.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Fürsten« oder »Vertraute«. Das hebräische Wort kann sowohl führende Personen als auch enge Vertraute bezeichnen; im Zusammenhang deutet es wahrscheinlich auf Personen, die über Juda gesetzt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  choice: Was wirst du sagen
  rationale: Die rhetorische Frage richtet sich im Hebräischen in der femininen Einzahl an das personifizierte Juda beziehungsweise Zion.
- source_word: כִּי יִפְקֹד עָלַיִךְ
  choice: wenn er über dich … einsetzt
  rationale: פקד kann unter anderem aufsuchen, heimsuchen, zur Rechenschaft ziehen oder einsetzen bedeuten. Die anschließende Rede von Führern und einem Haupt legt hier die administrative Bedeutung „einsetzen“ nahe; das unausgesprochene Subjekt bleibt als „er“ erhalten.
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  choice: die du selbst dazu erzogen hast
  rationale: Der Piel von למד bezeichnet Lehren, Schulen oder Einüben. „Selbst“ gibt die Betonung durch das selbstständige Pronomen וְאַתְּ wieder; „dazu erzogen“ drückt aus, dass Juda diese Mächte für die spätere Führungsrolle herangebildet beziehungsweise an sie gewöhnt hat.
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  choice: deine Führer zu sein
  rationale: אַלֻּפִים kann Anführer, Stammesoberhäupter oder Vertraute bezeichnen. Zusammen mit „über dich“ und לְרֹאשׁ („zum Haupt“) steht hier die Herrschaftsstellung im Vordergrund.
- source_word: חֲבָלִים יֹאחֱזוּךְ
  choice: Werden dich nicht Wehen packen
  rationale: Der Vergleich mit einer Gebärenden bestimmt חֲבָלִים eindeutig als Geburtswehen; אחז bedeutet ergreifen oder packen.
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  choice: wie eine Frau, die gebiert
  rationale: Die Formulierung gibt den Geburtsvorgang knapp und würdig wieder und bewahrt das konkrete Bild des Hebräischen.
theological_decisions:
- issue: Bezug des unausgesprochenen männlichen Subjekts von יִפְקֹד
  choice: Das Subjekt bleibt unbestimmt als „er“.
  alternative: „Der HERR setzt über dich ein“ oder Bezug auf einen feindlichen Herrscher.
  rationale: Der hebräische Text nennt das Subjekt nicht ausdrücklich. Es kann Gottes Handeln durch fremde Mächte oder das Handeln eines fremden Machthabers im Blick sein; die Übersetzung entscheidet diese Spannung nicht.
- issue: Bedeutung von אַלֻּפִים
  choice: Führer
  alternative: Oberhäupter, Fürsten oder Vertraute
  rationale: Der politische Herrschaftskontext spricht für „Führer“, doch die mögliche Bedeutung „Vertraute“ wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die feminine Anrede ist im Deutschen nur aus dem Kontext erkennbar. Die Satzstellung vermeidet die missverständliche Aussage, Juda habe die Betreffenden bereits als eigene Führer unterwiesen, und bringt stattdessen die Ziel- beziehungsweise Ergebnisbeziehung zum Ausdruck.
