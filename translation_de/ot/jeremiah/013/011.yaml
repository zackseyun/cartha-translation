    rationale: Das Hebräische schließt mit „aber sie hörten nicht“ und nennt kein Objekt. Zwar ist Jahwe aus dem Kontext naheliegend, doch die Übersetzung sollte die knappe, im Deutschen mögliche Offenheit bewahren.
  - severity: low
