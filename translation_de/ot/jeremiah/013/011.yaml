source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
translation:
  language: de
  text: Denn wie der Gürtel an den Hüften eines Mannes haftet[a], so habe ich das ganze Haus Israel und das ganze Haus Juda an mich gebunden, spricht Jahwe, damit sie mir zum Volk, zum Namen, zum Lob und zur Ehre würden; doch sie hörten nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schärpe“; möglicherweise ist ein Lendenschurz gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Hörten nicht“ kann hier auch den Sinn „gehorchten nicht“ einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵזוֹר
  choice: der Gürtel
  rationale: Das Wort bezeichnet hier ein um Hüften oder Lenden getragenes Kleidungsstück. „Gürtel“ bewahrt das konkrete Bild, ohne die Form unnötig auf eine Schärpe oder einen Lendenschurz festzulegen.
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  choice: haftet / ließ ... haften
  rationale: דבק bezeichnet ein enges Anhaften oder Sich-Anschließen. Die wiederholte Wiedergabe wahrt sowohl das körperliche Bild als auch dessen relationale, bundestheologische Kraft; der Hifil wird kausativ wiedergegeben.
- source_word: מָתְנֵי אִישׁ
  choice: an den Hüften eines Mannes
  rationale: מָתְנַיִם bezeichnet Hüften beziehungsweise Lenden. „Hüften“ ist gegenwärtiges, natürliches Deutsch; „eines Mannes“ bildet den generisch gebrauchten maskulinen Singular genau ab.
- source_word: כָּל בֵּית יִשְׂרָאֵל וְאֶת כָּל בֵּית יְהוּדָה
  choice: das ganze Haus Israel und das ganze Haus Juda
  rationale: „Haus“ erhält die korporative und familiäre Bundessprache des Hebräischen; „das ganze“ gibt כָּל idiomatisch wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Die feierliche prophetische Formel wird in natürlichem deutschen Bibelstil wiedergegeben; der Gottesname יְהוָה erscheint als „Jahwe“.
- source_word: לִהְיוֹת לִי לְעָם
  choice: damit sie mir zum Volk ... würden
  rationale: Die Konstruktion mit לִי und לְ wird formal und zugleich idiomatisch bewahrt. Der Plural „sie“ nimmt die beiden Häuser als Personengemeinschaften auf.
- source_word: לְשֵׁם וְלִתְהִלָּה וּלְתִפְאָרֶת
  choice: zum Namen, zum Ruhm und zur Zierde
  rationale: „Name“ bewahrt das hebräische Bild und seine Bedeutung von Ansehen; „Ruhm“ gibt die auf Jahwe bezogene תהלה idiomatisch wieder; „Zierde“ erhält bei תפארת den Aspekt schmückender Herrlichkeit, ohne die Reihe durch abstrakte Zusätze aufzulösen.
- source_word: וְלֹא שָׁמֵעוּ
  choice: doch sie hörten nicht auf mich
  rationale: „Auf jemanden hören“ hält die Bedeutungen Hören, Beachten und Gehorchen zusammen. „Doch“ macht den scharfen Gegensatz zu Jahwes Absicht deutlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- issue: Generisches Maskulinum in מָתְנֵי אִישׁ
  choice: an den Hüften eines Mannes
  alternative: an den Hüften eines Menschen
  rationale: Der hebräische maskuline Singular bleibt sichtbar; die Aussage ist ein repräsentativer Vergleich und keine Beschränkung der theologischen Aussage auf Männer.
- issue: Zweck der engen Bindung Israels und Judas an Jahwe
  choice: damit sie mir zum Volk, zum Namen, zum Ruhm und zur Zierde würden
  alternative: damit sie mein Volk, mein Ruhm und meine Herrlichkeit wären
  rationale: Die viergliedrige hebräische Zweckfolge bleibt erhalten. Dadurch wird die Spannung zwischen Jahwes Absicht für das Volk und dessen abschließender Weigerung nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener prophetischer Formel und korporativer Rede vom „Haus Israel“ und „Haus Juda“. Die wiederholte Haft-Metaphorik und die viergliedrige Zweckreihe bleiben hörbar; das Semikolon markiert den abschließenden Gegensatz, ohne ihn zu dramatisieren.
