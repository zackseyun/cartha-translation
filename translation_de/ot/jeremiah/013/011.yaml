  terminology: „Jahwe“, „Haus Israel“ und „Haus Juda“ sind konsequent. „Lob“ gibt תְהִלָּה präziser wieder als „Ruhm“; „Ehre“ gibt תִפְאֶרֶת im Kontext von Ansehen und Verherrlichung angemessen wieder, ohne eine unnötig konkrete Bedeutung wie „Zierde“ festzulegen.
