source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָל֞וֹךְ וְ/קָנִ֤יתָ לְּ/ךָ֙ אֵז֣וֹר פִּשְׁתִּ֔ים וְ/שַׂמְתּ֖/וֹ עַל מָתְנֶ֑י/ךָ וּ/בַ/מַּ֖יִם לֹ֥א תְבִאֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
translation:
  language: de
  text: 'So sprach Jahwe zu mir: »Geh und kauf dir einen Gürtel aus Leinen[a]. Lege ihn um deine Hüften; ins Wasser aber sollst du ihn nicht bringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »einen Leinengurt«, »eine Schärpe aus Leinen« oder möglicherweise »einen Lendenschurz aus Leinen«. Das hebräische Wort bezeichnet ein Kleidungsstück, das um die Hüften getragen wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So sprach
  rationale: Gibt die feste prophetische Botenformel würdevoll und in natürlichem Standarddeutsch wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Bewahrt den im hebräischen Text stehenden Gottesnamen; „Jahwe“ ist die geläufige deutsche Wiedergabe des Tetragramms.
- source_word: הָלוֹךְ וְקָנִיתָ לְּךָ
  choice: Geh und kauf dir
  rationale: Der Infinitivus absolutus leitet hier eine nachdrückliche Handlungsanweisung ein; „kauf dir“ bewahrt sowohl den Erwerbssinn als auch den Bezug auf den Empfänger selbst.
- source_word: אֵזוֹר פִּשְׁתִּים
  choice: einen Gürtel aus Leinen
  rationale: אֵזוֹר bezeichnet ein um die Taille getragenes Kleidungsstück, ohne dessen genaue Form eindeutig festzulegen; פִּשְׁתִּים bezeichnet hier Leinen beziehungsweise Flachs als Material.
- source_word: וְשַׂמְתּוֹ עַל מָתְנֶיךָ
  choice: Lege ihn um deine Hüften
  rationale: מָתְנַיִם bezeichnet die Hüft- oder Lendengegend. Bei einem Gürtel ist „um deine Hüften“ im Deutschen idiomatischer als eine mechanische Wiedergabe mit „auf“.
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  choice: ins Wasser aber sollst du ihn nicht bringen
  rationale: Bewahrt das Bild des hebräischen Kausativs „hineinbringen“, ohne enger festzulegen, ob Waschen, Eintauchen oder eine andere Berührung mit Wasser gemeint ist.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt ausdrücklich das Tetragramm. Die Umschrift „Jahwe“ bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Formel „So sprach“ erhält den feierlichen Ton; die genaue Art des Kleidungsstücks und die Art des Wasserkontakts bleiben entsprechend dem Hebräischen offen.
