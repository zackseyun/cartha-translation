  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
translation:
  language: de
  text: Kann ein Kuschit seine Haut ändern oder ein Leopard seine Flecken? Dann könnt auch ihr Gutes tun – ihr, die ihr an das Böse gewöhnt seid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Bösen unterwiesen/eingeübt“. Gemeint ist eine durch fortgesetzte Praxis entstandene Gewöhnung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: Kuschit
  rationale: Gibt die hebräische Volksbezeichnung unmittelbar wieder, ohne sie mit der späteren geografischen Bezeichnung „Äthiopier“ gleichzusetzen.
- source_word: הֲיַהֲפֹךְ
  choice: Kann … ändern
  rationale: Die rhetorische Frage bezeichnet hier die unmögliche Veränderung eines feststehenden Merkmals; „ändern“ ist dafür im Deutschen idiomatisch.
- source_word: עוֹרוֹ
  choice: seine Haut
  rationale: Direkte und natürliche deutsche Entsprechung.
- source_word: נָמֵר
  choice: Leopard
  rationale: Übliche lexikalische Entsprechung.
- source_word: חֲבַרְבֻּרֹתָיו
  choice: seine Flecken
  rationale: Bezeichnet die charakteristische Zeichnung des Leoparden; „Flecken“ ist kontextuell präzise und geläufig.
- source_word: גַּם אַתֶּם תּוּכְלוּ
  choice: Dann könntet auch ihr
  rationale: 'Der Konjunktiv bewahrt die ironische Folgerung: Nur wenn die zuvor genannten unmöglichen Veränderungen möglich wären, könnten auch die Angeredeten Gutes tun.'
- source_word: לְהֵיטִיב
  choice: Gutes tun
  rationale: Knappes, natürliches Deutsch für das Handeln in guter oder rechter Weise.
- source_word: לִמֻּדֵי הָרֵעַ
  choice: an das Böse gewöhnt
  rationale: Das passive Partizip beschreibt eine durch Einübung entstandene Gewöhnung. Diese Formulierung gibt die fest eingeprägte Neigung wieder, ohne einen ausdrücklich genannten Ausbilder vorauszusetzen.
theological_decisions:
- issue: Moralisches Unvermögen in einer rhetorischen Analogie
  choice: Die fest eingeübte Bindung Judas an das Böse wird durch einen Vergleich mit unveränderlichen körperlichen Merkmalen als praktisch unmöglich zu überwinden dargestellt.
  alternative: Eine universale Aussage über völliges menschliches Unvermögen in jeder Hinsicht oder lediglich eine folgenlose Übertreibung.
  rationale: Der hebräische Text spricht im unmittelbaren Zusammenhang zu Menschen, die im Bösen eingeübt sind. Die Übersetzung erhält die starke Unmöglichkeitsaussage, ohne sie zu einer umfassenderen systematisch-theologischen Lehre auszubauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kuschit“ bewahrt die historische Bezeichnung des hebräischen Textes. Der Konjunktiv „könntet“ macht die ironische, an die unmöglichen Vergleichsfälle gebundene Folgerung im Deutschen deutlich.
