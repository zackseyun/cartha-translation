  naturalness: Der prophetische Ton ist klar und modernes Standarddeutsch. „Wirst du nicht rein werden?“ ist als vorwurfsvolle rhetorische Frage idiomatischer und weniger voluntativ als „Willst du nicht rein werden?“. „Wie lange noch?“ gibt die knappe hebräische Schlussfrage natürlich wieder.
