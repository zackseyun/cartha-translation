  to: Deine Ehebrüche, dein lüsternes Wiehern, die Schändlichkeit deiner Hurerei – auf den Hügeln, im freien Land habe ich deine Gräuel gesehen. Wehe dir, Jerusalem! Wirst du nicht rein werden?[a] Wie lange noch?[b]
