  text: נִֽאֻפַ֤יִ/ךְ וּ/מִצְהֲלוֹתַ֨יִ/ךְ֙ זִמַּ֣ת זְנוּתֵ֔/ךְ עַל גְּבָעוֹת֙ בַּ/שָּׂדֶ֔ה רָאִ֖יתִי שִׁקּוּצָ֑יִ/ךְ א֥וֹי לָ/ךְ֙ יְר֣וּשָׁלִַ֔ם לֹ֣א תִטְהֲרִ֔י אַחֲרֵ֥י מָתַ֖י עֹֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
translation:
  language: de
  text: Deine Ehebrüche, dein lüsternes Wiehern, die Schändlichkeit deiner Hurerei – auf den Hügeln, im freien Land habe ich deine Gräuel gesehen. Wehe dir, Jerusalem! Wirst du nicht rein werden?[a] Wie lange noch?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wirst du nicht gereinigt werden?“ Das Hebräische kann sowohl Reinwerden als auch passiv verstandenes Gereinigtwerden ausdrücken.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich etwa: „Bis wann noch?“ Die hebräische Formulierung ist knapp und elliptisch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֻפַיִךְ
  choice: deine Ehebrüche
  rationale: Bewahrt den konkreten Plural und das Bild sexueller beziehungsweise bundeswidriger Untreue.
- source_word: וּמִצְהֲלוֹתַיִךְ
  choice: dein lüsternes Wiehern
  rationale: Erhält das drastische Pferdebild sexueller Begierde; der Singular als Sammelbegriff klingt im Deutschen natürlicher.
- source_word: זִמַּת זְנוּתֵךְ
  choice: die Schändlichkeit deiner Hurerei
  rationale: זִמָּה bezeichnet hier schändliche, sexuell-moralische Verworfenheit; die Formulierung wahrt die Schärfe des Prophetenwortes.
- source_word: עַל גְּבָעוֹת בַּשָּׂדֶה
  choice: auf den Hügeln, im freien Land
  rationale: Gibt die topografische Angabe natürlich wieder und lässt den Bezug auf kultische beziehungsweise sexuelle Verfehlungen bestehen.
- source_word: רָאִיתִי שִׁקּוּצַיִךְ
  choice: habe ich deine abscheulichen Taten gesehen
  rationale: שִׁקּוּצִים sind Abscheulichkeiten, häufig mit kultischem Beiklang; „abscheuliche Taten“ ist verständlich und passt zu den zuvor genannten Handlungen.
- source_word: לֹא תִטְהֲרִי
  choice: Willst du nicht rein werden?
  rationale: Gibt die rhetorische Frage und den medial-stativen Spielraum des Nifal wieder, ohne ausdrücklich festzulegen, wer die Reinigung bewirkt.
- source_word: אַחֲרֵי מָתַי עוֹד
  choice: Wie lange soll es noch dauern?
  rationale: Idiomatiche Wiedergabe der elliptischen Zeitfrage, die im Hebräischen ungefähr „bis wann noch?“ lautet.
theological_decisions:
- issue: Sexuelle Sprache als Bild für Jerusalems Untreue
  choice: Die konkreten Bilder „Ehebrüche“, „lüsternes Wiehern“ und „Hurerei“ bleiben erhalten.
  alternative: Abstraktere Wiedergabe mit „Untreue“ oder „Götzendienst“.
  rationale: Die drastische sexuelle Bildsprache gehört zur Aussageabsicht des hebräischen Textes und darf nicht durch eine bloße Deutung ersetzt werden.
- issue: Aussageform von לֹא תִטְהֲרִי
  choice: 'Rhetorische Frage: „Willst du nicht rein werden?“'
  alternative: 'Feststellung: „Du wirst nicht rein werden.“'
  rationale: Im Zusammenhang mit der anschließenden Zeitfrage ist eine vorwurfsvolle, drängende Frage gut begründet. Die Fußnote weist auf die ebenfalls mögliche stärker passive Wiedergabe hin.
translation_notes:
  register: Modernes, würdiges prophetisches Deutsch. Die anstößige Bildsprache wird nicht beschönigt; zugleich werden ungewöhnliche Hebraismen idiomatisch wiedergegeben. Alle Fußnotenmarker stehen unmittelbar an der betreffenden Textstelle.
