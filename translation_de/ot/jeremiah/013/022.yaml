  text: וְ/כִ֤י תֹאמְרִי֙ בִּ/לְבָבֵ֔/ךְ מַדּ֖וּעַ קְרָאֻ֣/נִי אֵ֑לֶּה בְּ/רֹ֧ב עֲוֺנֵ֛/ךְ נִגְל֥וּ שׁוּלַ֖יִ/ךְ נֶחְמְס֥וּ עֲקֵבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
translation:
  language: de
  text: 'Und wenn du in deinem Herzen sagst: »Warum ist mir das alles widerfahren?« – Wegen der Größe deiner Schuld wurden deine Kleidersäume aufgedeckt[a], und deine Fersen wurden misshandelt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild bezeichnet eine beschämende Entblößung.
    reason: imagery_clarification
  - marker: b
    text: 'Wörtlich nahe am Hebräischen; auch möglich: »deinen Fersen wurde Gewalt angetan«. Die genaue Art der Gewalt bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Und wenn
  rationale: Die Verbindung leitet einen möglichen beziehungsweise erwarteten Einwand ein und wahrt zugleich den Anschluss an den vorherigen Vers.
- source_word: תֹאמְרִי בִּלְבָבֵךְ
  choice: du in deinem Herzen sagst
  rationale: Die hebräische Wendung für inneres Reden bleibt erhalten; sie ist auch im Deutschen verständlich und trägt einen würdigen biblischen Ton.
- source_word: מַדּוּעַ קְרָאֻנִי אֵלֶּה
  choice: Warum ist mir das alles widerfahren?
  rationale: קרא bezeichnet in dieser Konstruktion idiomatisch das Widerfahren beziehungsweise Eintreffen der genannten Ereignisse. „Das alles“ gibt das pluralische אֵלֶּה natürlich wieder.
- source_word: בְּרֹב עֲוֺנֵךְ
  choice: Wegen der Größe deiner Schuld
  rationale: Die Präposition bezeichnet hier den Grund. „Größe“ bildet רֹב ab, und „Schuld“ bewahrt bei עָוֹן sowohl die moralische Verfehlung als auch ihre belastende Folge.
- source_word: נִגְלוּ שׁוּלַיִךְ
  choice: deine Kleidersäume wurden aufgedeckt
  rationale: שׁוּלַיִם bezeichnet die unteren Säume beziehungsweise herabhängenden Teile eines Gewandes. Die Formulierung erhält das Bild erzwungener, beschämender Entblößung.
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  choice: deine Fersen erlitten Gewalt
  rationale: Das Niphal von חמס bezeichnet gewaltsame oder unrechte Behandlung. Die Wiedergabe erhält das ungewöhnliche Körperbild und legt nicht genauer fest, welche Form der Misshandlung gemeint ist.
theological_decisions:
- issue: Prophetisches Bild beschämender und möglicherweise sexualisierter Entblößung
  choice: Das konkrete Bild von aufgedeckten Kleidersäumen und Gewalt an den Fersen bleibt stehen.
  alternative: Das Bild allgemein als Entblößung, Schändung oder ausdrücklich als sexuellen Übergriff wiedergeben.
  rationale: Der Text schildert das Gericht über die weiblich angeredete Stadt in drastischen Bildern öffentlicher Demütigung. Die Übersetzung darf diese Härte weder abschwächen noch eine bestimmte sexuelle Handlung festlegen, die der hebräische Wortlaut nicht ausdrücklich benennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die innere Rede bleibt als hebräisches Bild erhalten; die drastische Gerichtssprache wird weder euphemistisch abgeschwächt noch über den Wortlaut hinaus konkretisiert.
