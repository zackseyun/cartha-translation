  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כָּל נֵ֖בֶל יִמָּ֣לֵא יָ֑יִן וְ/אָמְר֣וּ אֵלֶ֔י/ךָ הֲ/יָדֹ֨עַ֙ לֹ֣א נֵדַ֔ע כִּ֥י כָל נֵ֖בֶל יִמָּ֥לֵא יָֽיִן־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: de
  text: 'Und du sollst ihnen dieses Wort sagen: So spricht der HERR, der Gott Israels: »Jeder Krug wird mit Wein gefüllt.« Und sie werden zu dir sagen: »Wissen wir nicht sehr wohl, dass jeder Krug mit Wein gefüllt wird?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵבֶל
  choice: Krug
  rationale: Bezeichnet hier ein Gefäß, das mit Wein gefüllt wird; »Krug« ist im Deutschen natürlich und bewahrt das konkrete Bild.
- source_word: יִמָּלֵא
  choice: wird … gefüllt
  rationale: Das Nifal Imperfekt wird als passivische Zukunftsaussage wiedergegeben; dieselbe Formulierung bleibt in beiden Vorkommen erhalten.
- source_word: הֲיָדֹעַ לֹא נֵדַע
  choice: Wissen wir etwa nicht genau
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt das Wissen; die rhetorische Frage erwartet Zustimmung und klingt zugleich leicht abweisend.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: der HERR
  alternative: JHWH / Jahwe
  rationale: Die traditionelle deutsche Wiedergabe in Kapitälchen entspricht dem jüdischen Lesegebrauch und bezeichnet den Eigennamen, ohne eine unsichere Aussprache in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Botenformel und die Wiederholung des Krug-Wein-Satzes bleiben eng am hebräischen Aufbau; die Antwort der Angeredeten wird als rhetorische, selbstverständliches Wissen betonende Frage formuliert.
