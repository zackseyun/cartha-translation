source:
  edition: WLC
  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
translation:
  language: de
  text: Gebt Jahwe, eurem Gott, die Ehre, bevor er Dunkelheit bringt und bevor eure Füße auf den Bergen in der Dämmerung straucheln. Dann werdet ihr auf Licht hoffen, doch er wird es in tiefe Finsternis[a] verwandeln; er wird es zu dichtem Dunkel machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »Schatten des Todes« oder »Todesschatten«. Das hebräische Wort kann sehr tiefe Finsternis bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ ... כָּבוֹד
  choice: Gebt ... die Ehre
  rationale: Die Verbindung aus נתן und כבוד ist eine feste Aufforderung, Gott die ihm gebührende Ehre zu erweisen. Die deutsche Wendung ist natürlich und bewahrt den Imperativ im Plural.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: Jahwe, eurem Gott
  rationale: Der Gottesname יהוה wird als „Jahwe“ wiedergegeben; der Pluralsuffix in אֱלֹהֵיכֶם wird mit „eurem“ bewahrt.
- source_word: יַחְשִׁךְ
  choice: er Dunkelheit bringt
  rationale: Die Hifil-Form legt eine verursachende Bedeutung nahe. Die Formulierung wahrt Gottes aktive Rolle im angekündigten Gericht, ohne ein im Hebräischen nicht genanntes Objekt einzuführen.
- source_word: יִתְנַגְּפוּ רַגְלֵיכֶם
  choice: eure Füße ... straucheln
  rationale: Die reflexiv-mediale Form von נגף beschreibt hier das Anstoßen oder Straucheln der Füße. „Straucheln“ gibt das Bild idiomatisch wieder.
- source_word: עַל הָרֵי נָשֶׁף
  choice: auf den Bergen in der Dämmerung
  rationale: נשף bezeichnet Dämmerung beziehungsweise Zwielicht. Die temporale Formulierung macht die Gefahr des schwindenden Lichts verständlich und behandelt die Wendung nicht als Ortsnamen.
- source_word: וְקִוִּיתֶם לְאוֹר
  choice: Dann werdet ihr auf Licht hoffen
  rationale: קוה kann „hoffen“ oder „warten“ bedeuten. Im Gerichtskontext bezeichnet die Wendung die Erwartung rettenden Lichts; „Dann“ verdeutlicht die durch ו ausgedrückte Folge.
- source_word: וְשָׂמָהּ לְצַלְמָוֶת
  choice: doch er wird es in tiefe Finsternis verwandeln
  rationale: Das Suffix nimmt das erhoffte Licht auf. צַלְמָוֶת kann todbringende beziehungsweise sehr tiefe Dunkelheit bezeichnen; die traditionelle Deutung wird in der Fußnote bewahrt.
- source_word: יָשִׁית לַעֲרָפֶל
  choice: er wird es zu dichtem Dunkel machen
  rationale: עֲרָפֶל bezeichnet dichtes Dunkel, Finsternis oder düsteren Wolkendunst. Die Formulierung erhält die zweite, steigernde Aussage und vermeidet eine ungerechtfertigte Präzisierung auf gewöhnlichen Nebel.
theological_decisions:
- issue: Göttliches Handeln in der kommenden Dunkelheit
  choice: Jahwe bringt die Dunkelheit aktiv als Gericht.
  alternative: Es wird lediglich von selbst dunkel oder die Nacht bricht auf natürliche Weise herein.
  rationale: Die Hifil-Form יַחְשִׁךְ ist am besten kausativ zu verstehen; auch die folgenden Verben haben Gott als handelndes Subjekt. So bleibt die prophetische Warnung erhalten, dass das Gericht von Jahwe ausgeht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Die Bildsprache von Licht, Dämmerung und zunehmender Finsternis bleibt erhalten; die beiden abschließenden Aussagen werden bewusst nicht zu einer einzigen geglättet.
