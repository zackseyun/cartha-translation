source:
  edition: WLC
  text: עָרֵ֥י הַ/נֶּ֛גֶב סֻגְּר֖וּ וְ/אֵ֣ין פֹּתֵ֑חַ הָגְלָ֧ת יְהוּדָ֛ה כֻּלָּ֖/הּ הָגְלָ֥ת שְׁלוֹמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
translation:
  language: de
  text: Die Städte des Negev sind verschlossen[a], und niemand öffnet sie. Ganz Juda ist ins Exil weggeführt worden – vollständig weggeführt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Städte des Südens«. Der Negev ist insbesondere das trockene Südland Judas.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Juda ist weggeführt worden, ganz und gar; es ist vollständig weggeführt worden.« שְׁלוֹמִים kann möglicherweise auch »in Frieden« bedeuten; im Zusammenhang ist jedoch eher die vollständige Wegführung gemeint.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  choice: die Städte des Negev
  rationale: נֶגֶב kann allgemein den Süden oder speziell das trockene Südland Judas bezeichnen. »Negev« bewahrt den geografischen Bezug; die allgemeinere Bedeutung wird in einer Fußnote genannt.
- source_word: סֻגְּרוּ
  choice: sind verschlossen
  rationale: Das passive Perfekt bezeichnet einen herbeigeführten Zustand. »Sind verschlossen« gibt das Bild abgeriegelter oder unzugänglicher Städte natürlich wieder.
- source_word: וְאֵין פֹּתֵחַ
  choice: und niemand öffnet sie
  rationale: Die Wendung stellt fest, dass keiner da ist, der die Verschließung rückgängig macht. Die knappe deutsche Form bewahrt die Aussage des hebräischen Partizips.
- source_word: הָגְלָת
  choice: ist in die Verbannung geführt worden
  rationale: Der Hophal von גלה ist kausativ-passiv und bezeichnet erzwungene Wegführung, nicht freiwilliges Fortgehen.
- source_word: יְהוּדָה כֻּלָּהּ
  choice: ganz Juda
  rationale: Die Formulierung gibt die umfassende Bedeutung von כֻּלָּהּ knapp und idiomatisch wieder.
- source_word: הָגְלָת שְׁלוֹמִים
  choice: vollständig in die Verbannung geführt
  rationale: שְׁלוֹמִים betont hier wahrscheinlich die Vollständigkeit. Die Wiederholung von »in die Verbannung geführt« bildet die emphatische hebräische Wiederholung ab.
theological_decisions:
- issue: Bedeutung von שְׁלוֹמִים in der Exilformel
  choice: 'adverbiale Angabe der Vollständigkeit: »vollständig«'
  alternative: »in Frieden« beziehungsweise »friedlich«
  rationale: Die Parallelität mit כֻּלָּהּ und die wiederholte Exilformel sprechen stärker für vollständige Wegführung. Da die Form sprachlich auch mit שָׁלוֹם zusammenhängt, bleibt die seltenere Deutung »in Frieden« in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Form und die emphatische Wiederholung des Hebräischen bleiben erhalten; eine mögliche geografische und eine seltenere semantische Alternative werden in den Fußnoten offengehalten.
