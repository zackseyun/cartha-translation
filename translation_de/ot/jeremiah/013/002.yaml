source:
  edition: WLC
  text: וָ/אֶקְנֶ֥ה אֶת הָ/אֵז֖וֹר כִּ/דְבַ֣ר יְהוָ֑ה וָ/אָשִׂ֖ם עַל מָתְנָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
translation:
  language: de
  text: Da kaufte ich den Hüftschurz[a] nach dem Wort Jahwes und legte ihn um meine Hüften.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Gürtel“ oder „Schärpe“; das hebräische Wort bezeichnet etwas, das um die Hüfte und möglicherweise eng am Körper getragen wurde.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְנֶה
  choice: Da kaufte ich
  rationale: Das Qal-Wajjiqtol in der 1. Person Singular führt die Handlung nach dem vorausgehenden Auftrag erzählerisch fort. „Da“ gibt diese Abfolge im Deutschen natürlich wieder.
- source_word: הָאֵזוֹר
  choice: den Hüftschurz
  rationale: אֵזוֹר bezeichnet ein um die Hüfte getragenes Kleidungsstück beziehungsweise einen Gürtel oder eine Schärpe. „Hüftschurz“ passt zum körpernah getragenen und später verborgenen Gegenstand, ohne die Bedeutung auf einen bloßen Schmuckgürtel zu verengen.
- source_word: כִּדְבַר יְהוָה
  choice: nach dem Wort Jahwes
  rationale: Die Wendung bedeutet wörtlich „gemäß dem Wort JHWHs“ und bezeichnet das Handeln in Übereinstimmung mit dem göttlichen Auftrag. Die gewählte Formulierung bewahrt den feierlichen Charakter und bleibt verständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: וָאָשִׂם
  choice: und legte ihn
  rationale: שׂים bedeutet „setzen, legen, anbringen“. Zusammen mit „um meine Hüften“ bezeichnet „legte“ idiomatisch das Anlegen des Kleidungsstücks.
- source_word: עַל מָתְנָי
  choice: um meine Hüften
  rationale: מָתְנַיִם bezeichnet den Hüft- oder Lendenbereich. Im Zusammenhang mit Kleidung ist „um meine Hüften“ natürliches modernes Deutsch.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Im hebräischen Text steht der Eigenname יְהוָה. „Jahwe“ macht den Namen im Haupttext sichtbar, während „der HERR“ ihn durch einen traditionellen Titel ersetzen würde.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah an der knappen hebräischen Erzählweise; die Fußnote bewahrt die lexikalische Spannweite von אֵזוֹר.
