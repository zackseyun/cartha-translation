source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
translation:
  language: de
  text: 'Dann sollst du zu ihnen sagen: »So spricht Jahwe: Siehe, ich werde alle Bewohner dieses Landes, die Könige, die auf Davids Thron sitzen,[a] die Priester, die Propheten und alle Bewohner Jerusalems mit Trunkenheit erfüllen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „die für David auf seinem Thron sitzen“. Die ungewöhnliche hebräische Formulierung hebt die dynastische Nachfolge Davids hervor.'
    reason: lexical_alternative
  - marker: b
    text: „Trunkenheit“ ist hier wahrscheinlich ein Bild für einen von Gott verhängten Taumel und für Gericht; das konkrete Bild wird bewusst beibehalten.
    reason: metaphorical_sense
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  choice: Dann sollst du zu ihnen sagen
  rationale: Das einleitende וְ führt die Anweisung aus dem vorherigen Zusammenhang fort; „dann“ gibt den Folgesinn natürlich wieder, während „sollst“ den Anweisungscharakter wahrt.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Die geläufige deutsche Botenformel bewahrt den prophetischen Ton; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: הִנְנִי מְמַלֵּא
  choice: Siehe, ich werde … erfüllen
  rationale: „Siehe“ erhält den nachdrücklichen Hinweischarakter von הִנְנִי. Das futurische „werde“ gibt die bevorstehende göttliche Handlung im Deutschen idiomatisch wieder.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: alle Bewohner dieses Landes
  rationale: „Bewohner“ ist eine natürliche Entsprechung für יֹשְׁבֵי; „Land“ bezeichnet hier kontextuell Juda und nicht die ganze Erde.
- source_word: הַמְּלָכִים הַיֹּשְׁבִים לְדָוִד עַל כִּסְאוֹ
  choice: die Könige, die auf Davids Thron sitzen
  rationale: Diese natürliche deutsche Formulierung gibt die davidische Thronfolge wieder. Die ungewöhnliche hebräische Konstruktion mit לְדָוִד wird in der Fußnote kenntlich gemacht.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: die Priester, die Propheten
  rationale: Direkte Wiedergabe der beiden religiösen beziehungsweise prophetischen Gruppen; der Ausdruck entscheidet nicht zwischen wahren und falschen Propheten.
- source_word: כָּל יֹשְׁבֵי יְרוּשָׁלִָם
  choice: alle Bewohner Jerusalems
  rationale: Die Wiederholung von „Bewohner“ entspricht der Wiederholung von יֹשְׁבֵי im Hebräischen.
- source_word: שִׁכָּרוֹן
  choice: Trunkenheit
  rationale: Das konkrete Bild aus dem Zusammenhang mit den Weinkrügen bleibt erhalten; abstraktere Deutungen wie „Verwirrung“ oder „Taumel“ würden die Metapher vorzeitig auflösen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird erkennbar als Gottesname wiedergegeben und nicht durch einen Titel ersetzt.
- issue: Bildhafte Bedeutung von שִׁכָּרוֹן
  choice: Trunkenheit als konkretes Bild beibehalten
  alternative: Taumel oder Verwirrung
  rationale: Im Zusammenhang bezeichnet das Bild wahrscheinlich einen von Gott verhängten Zustand der Orientierungslosigkeit und des Gerichts; der Haupttext lässt jedoch die bewusst konkrete und spannungsreiche Bildsprache stehen.
- issue: Davidische Thronfolge
  choice: auf Davids Thron sitzen
  alternative: für David auf seinem Thron sitzen
  rationale: Die Hauptfassung ist im Deutschen verständlich und bezeichnet die dynastische Nachfolge. Die ungewöhnlichere wörtliche Struktur wird als relevante Alternative in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar prophetischem Ton. „Siehe“ bleibt als gehobenes, aber allgemein verständliches Signalwort erhalten. Die Aufzählung nach dem Doppelpunkt macht deutlich, dass sämtliche genannten Gruppen zu den Bewohnern des Landes gehören und mit Trunkenheit erfüllt werden.
