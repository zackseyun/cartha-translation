  naturalness: „Erhebe deine Augen und sieh die, die aus dem Norden kommen“ ist modernes, würdiges Deutsch. Der Gedankenstrich macht die Apposition „deine prächtigen Schafe“ verständlich und bewahrt die Bildlichkeit.
