- from: Erhebt eure Augen und seht, wie sie aus dem Norden kommen! Wo ist die Herde, die dir anvertraut wurde, deine prächtigen[a] Schafe?
  to: Erhebe deine Augen[b] und sieh die, die aus dem Norden kommen! Wo ist die Herde, die dir gegeben wurde – deine prächtigen[a] Schafe?
  rationale: Die Revision gibt נִתַּן לָךְ mit dem weniger ausdeutenden „dir gegeben wurde“ wieder und bildet das substantivierte Partizip mit „die, die ... kommen“ unmittelbar ab. Die deutsche Singularanrede folgt den Imperativen; die abweichende Pluralendung bei „Augen“ wird mit einem korrekt gesetzten Anker erläutert. Die Herdenmetapher und die Mehrdeutigkeit von תפארת bleiben erhalten.
