base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/020.yaml
  text: Lift up your eyes and see those who are coming from the north. Where is the flock that was given to you[a], your beautiful sheep?
translation:
  language: de
  text: Erhebe deine Augen[b] und sieh die, die aus dem Norden kommen! Wo ist die Herde, die dir gegeben wurde – deine prächtigen[a] Schafe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hebräische Wort kann Schönheit, Pracht, Herrlichkeit oder Ruhm bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Im Hebräischen stehen die Aufforderungen im femininen Singular, während „Augen“ ein Suffix der zweiten Person Plural hat: wörtlich etwa „Erhebe eure Augen und sieh“.'
    reason: grammar_textual_feature
lexical_decisions:
- source_word: שאי עֵינֵיכֶם וראי
  choice: Erhebt eure Augen und seht
  rationale: Die Wendung mit „Augen erheben“ bezeichnet das Aufblicken. Der hebräische Text verbindet feminine Singularformen der Imperative mit einem Pluralsuffix bei „eure Augen“. Für verständliches Deutsch wird die erste Aufforderung im Plural wiedergegeben; der anschließende Singular „dir“ lässt den Wechsel in der Anrede teilweise bestehen. Eine Fußnote weist auf die grammatische Besonderheit hin.
- source_word: הַבָּאִים מִצָּפוֹן
  choice: wie sie aus dem Norden kommen
  rationale: Das substantivierte Partizip bezeichnet die sich nähernden Personen. „Wie sie … kommen“ gibt den anschaulichen Vorgang natürlich wieder, ohne die im Jeremiabuch naheliegende Deutung als Angreifer ausdrücklich in den Text einzutragen.
- source_word: הָעֵדֶר נִתַּן לָךְ
  choice: die Herde, die dir anvertraut wurde
  rationale: Das Passiv von נתן bedeutet wörtlich „die dir gegeben wurde“. „Anvertraut“ bringt im Deutschen den Zusammenhang einer zur Obhut übergebenen Herde idiomatisch zum Ausdruck, ohne deren metaphorischen Bezug festzulegen.
- source_word: צֹאן תִּפְאַרְתֵּךְ
  choice: deine prächtigen Schafe
  rationale: צאן bezeichnet Kleinvieh, hier im Zusammenhang besonders Schafe. תפארת kann Pracht, Schönheit, Herrlichkeit oder Ruhm bezeichnen. „Prächtig“ ist im Deutschen auf Schafe beziehungsweise eine Herde natürlich beziehbar; die weitere Bedeutungsbreite wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezug der Herdenmetapher
  choice: Die Herden- und Schafmetapher bleibt im Haupttext unausgelegt.
  alternative: Die Herde ausdrücklich als Volk Judas, Einwohner Jerusalems oder Untertanen der Herrschenden bezeichnen.
  rationale: Der hebräische Vers nennt den Bezug der Metapher nicht ausdrücklich. Eine Konkretisierung würde die rhetorische und theologische Offenheit des Bildes unnötig verengen.
- issue: Wechsel der angeredeten Person und Zahl
  choice: Die einleitende Aufforderung wird im natürlichen deutschen Plural formuliert, während „dir“ den femininen Singular des weiteren Satzes wiedergibt.
  alternative: Den grammatischen Bruch wörtlich als „Erhebe eure Augen und sieh“ nachbilden oder den gesamten Vers einheitlich singularisch beziehungsweise pluralisch harmonisieren.
  rationale: Eine streng formale Nachbildung wäre im Deutschen schwer verständlich. Die gewählte Fassung bleibt lesbar, verdeckt den überlieferten Wechsel aber nicht vollständig; die Fußnote dokumentiert ihn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Warnung bleibt knapp und bildhaft. „Prächtig“ ist verständlich und wahrt die positive Wertung von תפארת, während die Fußnote dessen größere Bedeutungsbreite nennt. Die Fußnote zur wechselnden Anrede ist am Satzende des ersten Satzes mit [b] zu markieren.
