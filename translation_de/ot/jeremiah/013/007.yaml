translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Die Wendung „Und siehe“ bewahrt bewusst die markierte rhetorische Aufmerksamkeit des hebräischen Textes. Der Haupttext muss den Fußnotenmarker [b] am ersten Auftreten von „Hüftschurz“ tragen.
