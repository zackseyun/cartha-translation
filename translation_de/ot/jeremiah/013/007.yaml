base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
translation:
  language: de
  text: Da ging ich nach Perat[a], grub und nahm den Gürtel[b] von der Stelle, an der ich ihn verborgen hatte. Und siehe, der Gürtel war verdorben; er war zu nichts mehr zu gebrauchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perat kann den Euphrat bezeichnen; im Hebräischen steht der Ortsname „Perat“.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Hüftschurz“, „Schärpe“. Das hebräische Wort bezeichnet ein um die Hüfte getragenes Kleidungsstück.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  choice: nach Perat
  rationale: Die hebräische Form nennt den Ortsnamen Perat mit Richtungsendung. Die mögliche Identifizierung mit dem Euphrat bleibt in einer Fußnote erhalten, statt im Haupttext festgelegt zu werden.
- source_word: אֵזוֹר
  choice: Hüftschurz
  rationale: Das Wort bezeichnet ein um die Hüfte getragenes Kleidungsstück. „Hüftschurz“ ist im Deutschen konkret und vermeidet die moderne Verengung auf einen starren Gürtel; andere mögliche Wiedergaben werden in der Fußnote genannt.
- source_word: וָאֶחְפֹּר
  choice: grub ... aus
  rationale: Das Verb bedeutet „graben“. Zusammen mit dem anschließenden Nehmen und dem verborgenen Gegenstand ergibt „grub ... aus“ eine natürliche deutsche Wiedergabe, ohne טמן selbst zwingend mit „begraben“ zu übersetzen.
- source_word: טְמַנְתִּיו
  choice: ich ihn verborgen hatte
  rationale: טמן bedeutet verstecken oder verbergen, häufig durch Eingraben. „Verborgen“ bewahrt den weiteren Sinn; das Ausgraben wird bereits durch וָאֶחְפֹּר ausgedrückt.
- source_word: וְהִנֵּה
  choice: Und siehe
  rationale: Die traditionelle, weiterhin verständliche Aufmerksamkeitsformel erhält die rhetorische Hervorhebung des überraschenden Fundzustands.
- source_word: נִשְׁחַת
  choice: war verdorben
  rationale: Der Niphal von שׁחת beschreibt hier einen Gegenstand, der beschädigt beziehungsweise unbrauchbar geworden ist. „Verdorben“ passt zur fortschreitenden Zerstörung und leitet natürlich zum folgenden Satz über.
- source_word: לֹא יִצְלַח לַכֹּל
  choice: er war zu nichts mehr zu gebrauchen
  rationale: Die Wendung bezeichnet vollständige Unbrauchbarkeit. Diese deutsche Formulierung ist idiomatisch und gibt den absoluten Sinn von לַכֹּל wieder.
