  text: וְ/נִפַּצְתִּי/ם֩ אִ֨ישׁ אֶל אָחִ֜י/ו וְ/הָ/אָב֧וֹת וְ/הַ/בָּנִ֛ים יַחְדָּ֖ו נְאֻם יְהוָ֑ה לֹֽא אֶחְמ֧וֹל וְ/לֹֽא אָח֛וּס וְ/לֹ֥א אֲרַחֵ֖ם מֵ/הַשְׁחִיתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
translation:
  language: de
  text: Und ich werde sie gegeneinander zerschmettern[a], einen gegen seinen Bruder, Väter und Söhne miteinander, spricht Jahwe. Ich werde weder schonen noch Mitleid haben noch mich erbarmen, um sie nicht zu vernichten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegeneinander zerschlagen“ beziehungsweise „gegeneinander schleudern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „vom Vernichten ihrer“. Die hebräische Konstruktion bezeichnet fehlende Schonung und fehlendes Erbarmen, die von ihrer Vernichtung absehen würden.'
    reason: translation_clarity
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  choice: Und ich werde sie aneinander zerschmettern
  rationale: Das Verb נפץ bezeichnet gewaltsames Zerschlagen oder Zerschmettern. „Aneinander zerschmettern“ gibt sowohl die Härte als auch die gegenseitige Stoßrichtung des folgenden Ausdrucks wieder.
- source_word: אִישׁ אֶל אָחִיו
  choice: jeden an seinem Bruder
  rationale: Die distributive Einzahl und die ausdrücklich genannte Bruderverwandtschaft bleiben erhalten. Die Formulierung bezeichnet, woran der Einzelne zerschmettert wird, ohne das Bild zu verallgemeinern.
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  choice: Väter und Söhne miteinander
  rationale: Die ausdrücklich männlichen Verwandtschaftsbezeichnungen des Hebräischen werden bewahrt; „miteinander“ gibt יחדו natürlich wieder.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: „Spricht Jahwe“ ist eine natürliche deutsche Wiedergabe der prophetischen Botenformel und gibt den Gottesnamen als Jahwe wieder.
- source_word: לֹא אֶחְמֹל
  choice: Ich werde sie weder schonen
  rationale: חמל bedeutet hier, aus Mitleid von der Vernichtung abzusehen. „Schonen“ passt zum Gerichtskontext und unterscheidet das erste Glied von den folgenden Mitleidsbegriffen.
- source_word: וְלֹא אָחוּס
  choice: noch Mitleid mit ihnen haben
  rationale: חוס kann Schonung oder Mitleid ausdrücken. „Mitleid haben“ wahrt hier die rhetorische Reihung, ohne das erste Verb zu wiederholen.
- source_word: וְלֹא אֲרַחֵם
  choice: noch mich ihrer erbarmen
  rationale: רחם bezeichnet Erbarmen beziehungsweise Mitgefühl. „Sich erbarmen“ ist im Deutschen würdig und erhält die begriffliche Abstufung der drei nahezu synonymen Verben.
- source_word: מֵהַשְׁחִיתָם
  choice: sondern sie vernichten
  rationale: Die Konstruktion mit מן und Infinitiv besagt, dass Jahwe sich durch Schonung oder Erbarmen nicht von ihrer Vernichtung abhalten lässt. Die adversative Formulierung gibt diesen Sinn in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ gibt ihn als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Geschlechtsspezifische Verwandtschaftssprache
  choice: jeden an seinem Bruder, Väter und Söhne
  alternative: einen am anderen, Eltern und Kinder
  rationale: Der Ausgangstext nennt Bruder, Väter und Söhne ausdrücklich. Die Übersetzung bewahrt diese konkreten Familienbeziehungen und neutralisiert sie nicht.
- issue: Verhältnis der drei Verneinungen zur Vernichtung
  choice: weder schonen noch Mitleid haben noch sich erbarmen, sondern vernichten
  alternative: nicht davon absehen, sie zu vernichten
  rationale: Die gewählte Form bewahrt die dreigliedrige rhetorische Häufung und macht zugleich deutlich, dass kein Erbarmen die angekündigte Vernichtung verhindert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst harter Gerichtssprache. Die prophetische Formel ist knapp gehalten; die konkrete männliche Verwandtschaftssprache und die dreifache Verneinung des Hebräischen bleiben erkennbar.
