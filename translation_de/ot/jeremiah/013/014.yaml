- from: Und ich werde sie aneinander zerschmettern[a], jeden an seinem Bruder, Väter und Söhne miteinander, spricht Jahwe. Ich werde sie weder schonen noch Mitleid mit ihnen haben noch mich ihrer erbarmen, sondern sie vernichten.[b]
  to: Und ich werde sie gegeneinander zerschmettern[a], einen gegen seinen Bruder, Väter und Söhne miteinander, spricht Jahwe. Ich werde weder schonen noch Mitleid haben noch mich erbarmen, um sie nicht zu vernichten.[b]
  rationale: Die Richtungsbeziehung der distributiven Wendung wird mit „einen gegen seinen Bruder“ korrekt und idiomatisch wiedergegeben. Der Schluss bewahrt die hebräische negative Ziel- bzw. Folgerelation, ohne eine nicht im Text ausgedrückte adversative Gegenüberstellung einzuführen. Die Fußnote erklärt die ungewöhnliche, quellennahe deutsche Formulierung präzise.
