  naturalness: „Gegeneinander zerschmettern“ und „einen gegen seinen Bruder“ sind im Deutschen natürlich und bewahren das Bild. Die bewusst quellennahe Schlussformulierung „um sie nicht zu vernichten“ ist im Deutschen etwas markiert, aber verständlich und für die rhetorisch zugespitzte Gerichtssprache angemessen.
  terminology: '„Jahwe“, „Väter und Söhne“, „schonen“, „Mitleid haben“ und „sich erbarmen“ sind registergerecht und sachlich. Die Fußnote zur Schlusskonstruktion muss korrigiert werden: „vom Vernichten ihrer“ ist kein korrektes Deutsch, und „ohne sie zu vernichten“ kann den Sinn verfälschen.'
