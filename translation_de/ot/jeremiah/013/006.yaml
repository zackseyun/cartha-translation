source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
translation:
  language: de
  text: 'Und es geschah nach vielen Tagen: Da sagte Jahwe zu mir: „Steh auf, geh nach Perat[a] und hol von dort den Gürtel[b], den ich dir dort zu verbergen[c] befohlen hatte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perat kann hier den Euphrat bezeichnen; der hebräische Name wird im Haupttext nicht näher festgelegt.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Hüftschurz“, „Hüfttuch“ oder „Schärpe“. Gemeint ist ein um die Hüfte getragenes Kleidungsstück.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zu vergraben“. Das hebräische Verb bedeutet „verbergen“ und kann ein Verbergen in der Erde bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Und es geschah
  rationale: Die Erzählformel eröffnet einen neuen Abschnitt. Die Wiedergabe bewahrt ihre Funktion und den würdevollen Erzählton, ohne die veraltete Formulierung „es begab sich“ zu verwenden.
- source_word: מִקֵּץ יָמִים רַבִּים
  choice: nach vielen Tagen
  rationale: Die idiomatische deutsche Formulierung gibt die Zeitangabe genau wieder; „nach langer Zeit“ wäre ebenfalls möglich, aber etwas stärker deutend.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen ausdrücklich stehende Gottesname wird in der im Deutschen üblichen Form „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: קוּם לֵךְ
  choice: Steh auf, geh
  rationale: Die beiden Imperative werden direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: פְּרָתָה
  choice: nach Perat
  rationale: Die Richtungsendung wird mit „nach“ ausgedrückt. Der Ortsname bleibt transliteriert, weil die Identifizierung mit dem Euphrat zwar naheliegt, aber im Haupttext nicht erzwungen werden soll.
- source_word: וְקַח מִשָּׁם
  choice: und hol von dort
  rationale: Im Zusammenhang geht es darum, den zuvor versteckten Gegenstand wieder an sich zu nehmen. „Hol“ ist dafür natürliches Deutsch, ohne einen zusätzlichen technischen Sinn einzutragen.
- source_word: הָאֵזוֹר
  choice: den Gürtel
  rationale: אֵזוֹר bezeichnet ein um die Hüfte getragenes Kleidungsstück. „Gürtel“ ist im Deutschen klar und knapp; mögliche genauere Vorstellungen wie Hüftschurz oder Schärpe bleiben in der Fußnote erhalten.
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: den ich dir … befohlen hatte
  rationale: Die relative Konstruktion und die Autorität des göttlichen Befehls werden gewahrt. Das Plusquamperfekt verdeutlicht im Deutschen, dass der Befehl vorausging.
- source_word: לְטָמְנוֹ שָׁם
  choice: dort zu verbergen
  rationale: טמן bedeutet verbergen oder verstecken und kann besonders das Verbergen in der Erde einschließen. Die allgemeinere Bedeutung steht im Text, die konkretere Möglichkeit in der Fußnote.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: Jehova
  rationale: Der hebräische Text verwendet den Eigennamen Gottes. „Jahwe“ bewahrt diesen als Namen und entspricht der heute üblichen deutschen wissenschaftlichen Transkription, ohne ihn durch „der HERR“ zu ersetzen.
- issue: Identifizierung von פְּרָת mit dem Euphrat
  choice: Perat im Haupttext
  alternative: Euphrat
  rationale: Die Form kann den Euphrat bezeichnen, doch die erzählerische Ortsangabe lässt auch eine Diskussion über die genaue Identifizierung zu. Die Transliteration hält diese Spannung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die einleitende Formel bleibt erkennbar, während „Steh auf“ und „hol“ natürliche heutige Sprache verwenden. Sämtliche Fußnotenmarker stehen unmittelbar bei dem Ausdruck, den sie erläutern.
