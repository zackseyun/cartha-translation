base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/005.yaml
  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
translation:
  language: de
  text: Da ging ich hin und versteckte ihn am Euphrat[a], wie der HERR mir geboten hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hebräisch Perat, gewöhnlich als der Euphrat verstanden; möglicherweise ist jedoch ein lokaler Ort namens „Perat“ gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵלֵךְ
  choice: Da ging ich hin
  rationale: Das Wayyiqtol führt die Erzählung weiter. „Da ging ich hin“ gibt die zeitliche und folgernde Abfolge natürlich wieder.
- source_word: וָאֶטְמְנֵהוּ
  choice: versteckte ihn
  rationale: טמן bedeutet „verbergen, verstecken“. Das maskuline Suffix nimmt den zuvor genannten Gürtel auf; „vergrub“ würde die Art des Verbergens unnötig festlegen.
- source_word: בִּפְרָת
  choice: am Euphrat
  rationale: פְרָת bezeichnet gewöhnlich den Euphrat. ב wird hier idiomatisch mit „am“ wiedergegeben; die mögliche Auffassung als örtlicher Name „Perat“ bleibt in der Fußnote erhalten.
- source_word: כַּאֲשֶׁר
  choice: wie
  rationale: Die Konjunktion bezeichnet die Übereinstimmung der Handlung mit dem ergangenen Befehl.
- source_word: צִוָּה
  choice: geboten hatte
  rationale: Das Plusquamperfekt verdeutlicht im Deutschen, dass der Befehl der ausgeführten Handlung vorausging.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die traditionelle deutsche Wiedergabe des Gottesnamens als „HERR“ ist verständlich, würdig und in Bibelübersetzungen fest etabliert.
- source_word: אוֹתִי
  choice: mir
  rationale: Obwohl אוֹתִי formal den Akkusativ „mich“ markiert, verlangt das deutsche Verb „gebieten“ in dieser Konstruktion idiomatisch den Dativ „mir“.
theological_decisions:
- issue: Identifizierung von פְרָת
  choice: Euphrat
  alternative: Perat als unübersetzter oder lokaler Ortsname
  rationale: Der übliche lexikalische Bezug von פְרָת ist der Euphrat. Weil aufgrund der geografischen Zusammenhänge auch ein näher gelegener Ort namens Perat erwogen wird, wird diese echte Ortsunsicherheit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Da ging ich hin“ wahrt den fortschreitenden Erzählfluss; „versteckte“ vermeidet eine unbelegte Festlegung auf Vergraben.
