id: JER.13.25
reference: Jeremiah 13:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
translation:
  language: de
  text: Das ist dein Los[a], der dir von mir zugemessene Anteil – so spricht Jahwe –, weil du mich vergessen und auf Täuschung vertraut hast.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dein Geschick“ oder „dein zugeteilter Anteil“. Die hebräischen Ausdrücke für „Los“ und „Anteil“ betonen, was ihr zugewiesen ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf Lüge“ beziehungsweise „auf Falschheit“. Das hebräische Wort kann Lüge, Falschheit oder Täuschung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה גוֹרָלֵךְ
  choice: Das ist dein Los
  rationale: Die Wendung eröffnet den richterlichen Ausspruch. „Los“ bewahrt den konkreten Sinn eines zugeteilten Anteils und kann zugleich das ergehende Geschick bezeichnen.
- source_word: מְנָת מִדַּיִךְ
  choice: der dir … zugemessene Anteil
  rationale: Die Verbindung aus „Anteil“ und einem maßbezogenen Ausdruck wird in natürlichem Deutsch als zugeteilter beziehungsweise zugemessener Anteil wiedergegeben.
- source_word: מֵאִתִּי
  choice: von mir
  rationale: 'Die Präposition bezeichnet die Quelle der Zuteilung: Das angekündigte Gericht kommt von Jahwe.'
- source_word: נְאֻם יְהוָה
  choice: so spricht Jahwe
  rationale: Die feste prophetische Formel wird würdig und idiomatisch wiedergegeben; der Gottesname יהוה erscheint als „Jahwe“.
- source_word: אֲשֶׁר
  choice: weil
  rationale: Das Relativwort leitet hier sachlich die Begründung für den angekündigten Urteilsspruch ein.
- source_word: שָׁכַחַתְּ אוֹתִי
  choice: du mich vergessen
  rationale: Die feminine Singularform bleibt als unmittelbare Anrede erhalten, ohne die angesprochene Größe im Vers ausdrücklich zu benennen.
- source_word: וַתִּבְטְחִי בַּשָּׁקֶר
  choice: und auf Täuschung vertraut hast
  rationale: „Auf etwas vertrauen“ ist im Deutschen die natürliche Verbindung. שֶׁקֶר kann Täuschung, Falschheit oder Lüge bezeichnen; „Täuschung“ lässt den Bezug bewusst offen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; die Transliteration bewahrt ihn, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug der femininen Singularformen
  choice: direkte Anrede mit „du/dein“ ohne ausdrückliche Benennung
  alternative: Ergänzung von „Jerusalem“ oder „Juda“
  rationale: Die Grammatik spricht eine feminine Einzahl an, doch der Vers nennt den Bezug nicht ausdrücklich. Die Übersetzung bewahrt diese Form und vermeidet eine erklärende Einfügung.
- issue: Gegenstand des Vertrauens bei שֶׁקֶר
  choice: Täuschung
  alternative: Lüge / Falschheit
  rationale: Der Ausdruck kann falsche religiöse, politische oder andere trügerische Sicherheiten umfassen. Die Übersetzung legt den konkreten Bezug nicht enger fest als der Ausgangstext.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die feminine Einzelanrede bleibt erhalten. Der Gedankenstrich hebt die Botenformel ab, ohne den Satzfluss unnötig zu erschweren.
