  text: וַ/אֲפִיצֵ֖/ם כְּ/קַשׁ עוֹבֵ֑ר לְ/ר֖וּחַ מִדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/024.yaml
  text: So I will scatter them like chaff passing away before the desert wind[a].
translation:
  language: de
  text: Darum werde ich sie zerstreuen wie Stroh, das vor dem Wüstenwind dahintreibt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie Stoppeln, die vor dem Wind der Wildnis vorüberziehen“.'
    reason: Lexikalische und syntaktische Alternativen für קַשׁ, עוֹבֵר und רוּחַ מִדְבָּר.
lexical_decisions:
- source_word: וַאֲפִיצֵם
  choice: Darum werde ich sie zerstreuen
  rationale: Das Hifil mit Subjekt in der 1. Person Singular und Objekt in der 3. Person Plural bezeichnet das Zerstreuen. Das Präfix וַ wird im Zusammenhang folgernd mit „Darum“ wiedergegeben; die Zukunftsform entspricht der Gerichtsankündigung.
- source_word: כקש
  choice: wie Stroh
  rationale: קַשׁ bezeichnet trockenes Stroh, Stoppeln oder häckselartigen Pflanzenrest. „Stroh“ bewahrt die lexikalische Breite und passt zum Bild des vom Wind fortgetragenen Materials.
- source_word: עובר
  choice: das … dahintreibt
  rationale: Das Qal-Partizip von עבר beschreibt etwas, das vorüberzieht oder sich weiterbewegt. „Dahintreibt“ gibt diese fortdauernde Bewegung im natürlichen Deutschen wieder, ohne das im Hebräischen nur implizite Verwehen zum Hauptverb zu machen.
- source_word: לרוח
  choice: vor dem … Wind
  rationale: לְ bezeichnet hier die Ausrichtung beziehungsweise das Preisgegebensein gegenüber dem Wind. Die deutsche Wendung „vor dem Wind dahintreiben“ vermittelt das Bild windgetragener Bewegung.
- source_word: מדבר
  choice: Wüstenwind
  rationale: מִדְבָּר kann „Wüste“ oder „Wildnis“ bedeuten. Als nähere Bestimmung des Windes ist das Kompositum „Wüstenwind“ idiomatisch und ruft die trockene, offene Landschaft des Bildes auf.
