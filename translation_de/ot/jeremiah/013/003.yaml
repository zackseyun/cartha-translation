  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֵלַ֖/י שֵׁנִ֥ית לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/003.yaml
  text: And the word of Yahweh came to me a second time[a], saying,
translation:
  language: de
  text: 'Da kam das Wort Jahwes zum zweiten Mal zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Da kam
  rationale: In der prophetischen Botenformel wird das hebräische וַיְהִי im Deutschen idiomatisch mit „da kam“ wiedergegeben, statt wörtlich und unnatürlich „und es geschah“ zu formulieren.
- source_word: דְבַר
  choice: das Wort
  rationale: „Wort“ entspricht dem hebräischen דָּבָר in der festen Wendung דְבַר יְהוָה und bewahrt den Charakter göttlicher Mitteilung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als „Jahwe“ wiedergegeben und nicht durch den Titel „der HERR“ ersetzt.
- source_word: אֵלַי
  choice: zu mir
  rationale: Die Präposition mit dem Suffix der ersten Person bezeichnet die Richtung der Mitteilung zu Jeremia.
- source_word: שֵׁנִית
  choice: zum zweiten Mal
  rationale: Die Form bezeichnet ausdrücklich die zweite Wiederholung; „zum zweiten Mal“ gibt dies genauer wieder als nur „wieder“.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der hebräische Infinitiv leitet die unmittelbar folgende Rede ein. Im modernen deutschen Erzählstil übernimmt ein Doppelpunkt diese Funktion natürlicher als „indem er sprach“ oder „mit den Worten“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen יהוה. „Jahwe“ bewahrt diesen als Namen, während „der HERR“ die traditionelle Ersatzlesung darstellt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe prophetische Formel bleibt erhalten; der Doppelpunkt leitet die im nächsten Vers folgende Gottesrede idiomatisch ein.
