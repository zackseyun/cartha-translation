  - severity: medium
    issue: „den Stolz ... verderben“ ist semantisch und idiomatisch schwächer
    rationale: „Verderben“ kann im Deutschen auch moralisches Korrumpieren bedeuten und ist mit „Stolz“ weniger geläufig. „Zugrunde richten“ gibt die gerichtliche, ruinierende Wirkung von שחת im Kontext deutlicher wieder.
