  source_fidelity: 'Die Grundstruktur ist zutreffend wiedergegeben: die Botenformel, der Gottesname, die zweimalige Nennung von גאון sowie die Verstärkung Jerusalems durch הָרָב. Das Hifil von שחת bezeichnet im Kontext des verdorbenen Gürtels ein Zugrunderichten bzw. Unbrauchbarmachen.'
  naturalness: „Ebenso werde ich ... verderben“ ist verständlich, wirkt im Deutschen aber leicht vergleichend und „Stolz verderben“ ist weniger idiomatisch; es kann zudem den Sinn von moralisch verderben nahelegen. „Auf diese Weise werde ich ... zugrunde richten“ ist klar, modern und wahrt den Bezug auf die vorausgehende Zeichenhandlung.
  terminology: „Jahwe“, „So spricht“ und „Stolz“ sind angemessen. „Stolz“ erhält die im hebräischen גאון angelegte Schwebe zwischen überheblichem Stolz und Ansehen/Pracht; die Fußnote benennt die Alternativen ohne sie in den Text einzutragen.
