  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה כָּ֠כָה אַשְׁחִ֞ית אֶת גְּא֧וֹן יְהוּדָ֛ה וְ/אֶת גְּא֥וֹן יְרוּשָׁלִַ֖ם הָ/רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
translation:
  language: de
  text: 'So spricht Jahwe: Auf diese Weise werde ich den Stolz Judas und den großen Stolz Jerusalems zugrunde richten[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verderben“, „zerstören“ oder „unbrauchbar machen“. Das hebräische Verb greift hier das Bild des verdorbenen Gürtels auf.'
    reason: lexical_alternative
  - marker: b
    text: „Stolz“ kann auch „Hochmut“ bedeuten, seltener an dieser Stelle „Hoheit“ oder „Pracht“.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die geläufige deutsche Prophetenformel bewahrt den feierlichen Botenstil und klingt zugleich natürlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: כָּכָה
  choice: Ebenso
  rationale: Das Adverb verweist auf die zuvor am verdorbenen Gürtel dargestellte Weise; „ebenso“ stellt diesen Bezug knapp und idiomatisch her.
- source_word: אַשְׁחִית
  choice: werde ich ... verderben
  rationale: Das Hifil von שׁחת bezeichnet hier das Zugrunderichten beziehungsweise Unbrauchbarmachen und greift die Bildhandlung mit dem verdorbenen Gürtel auf.
- source_word: גְּאוֹן
  choice: Stolz
  rationale: „Stolz“ wahrt die mögliche Spannung zwischen hochmütiger Selbstüberhebung und hohem Ansehen, wobei der Gerichtskontext eine negative Bedeutung nahelegt.
- source_word: גְּאוֹן יְרוּשָׁלִַם הָרָב
  choice: den großen Stolz Jerusalems
  rationale: Die Wiedergabe bewahrt die parallele Konstruktion und lässt הָרָב unmittelbar „Stolz“ näher bestimmen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den persönlichen Gottesnamen; „Jahwe“ macht diesen sichtbar, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von גְּאוֹן im Gerichtswort
  choice: Stolz
  alternative: Hochmut oder Hoheit
  rationale: Der Zusammenhang spricht vor allem für selbstüberheblichen Stolz, doch die allgemeinere Wiedergabe „Stolz“ erhält die mögliche Nebenbedeutung von Rang oder Pracht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der vertrauten prophetischen Formel „So spricht Jahwe“. Die Satzstellung bleibt klar und bewahrt den Parallelismus des Hebräischen.
