  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
translation:
  language: de
  text: Auch ich selbst habe deine Gewandsäume über dein Gesicht gehoben[a][b][c], und deine Schande ist sichtbar geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „habe deine Gewandsäume über dein Gesicht aufgedeckt“. Das hebräische Verb bedeutet „aufdecken, entblößen“.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild beschreibt eine erzwungene öffentliche Bloßstellung als Zeichen entehrenden Gerichts.
    reason: cultural_note
  - marker: c
    text: 'Die hebräischen Verbformen können das Gericht als bereits vollzogen oder als sicher bevorstehend darstellen; daher auch: „werde … heben, und deine Schande wird sichtbar werden“.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Und auch ich
  rationale: Die Verbindung aus Konjunktion, additivem Partikel und ausdrücklich gesetztem Pronomen führt die Gerichtsaussage fort und hebt zugleich hervor, dass Gott selbst handelt.
- source_word: חָשַׂפְתִּי
  choice: habe … hochgehoben
  rationale: Das Verb bedeutet grundsätzlich „aufdecken, entblößen“. In Verbindung mit Gewandsäumen gibt „hochheben“ das konkrete Bild im Deutschen natürlich wieder, ohne die erzwungene Bloßstellung abzuschwächen.
- source_word: שׁוּלַיִךְ
  choice: deine Gewandsäume
  rationale: Das Wort bezeichnet die unteren Ränder beziehungsweise Säume eines Kleidungsstücks. „Gewandsäume“ bewahrt das Kleidungsbild und klingt im Deutschen klarer als das isolierte „Säume“.
- source_word: עַל־פָּנָיִךְ
  choice: über dein Gesicht
  rationale: 'Die räumliche Bedeutung der Präposition wird beibehalten: Das Gewand wird über das Gesicht gezogen beziehungsweise gehoben.'
- source_word: וְנִרְאָה
  choice: sodass … sichtbar wurde
  rationale: Der Nifal bezeichnet hier das Sichtbarwerden als Ergebnis der vorausgehenden Handlung. „Sodass“ macht diesen im Hebräischen eng verbundenen Folgezusammenhang in natürlichem Deutsch deutlich.
- source_word: קְלוֹנֵךְ
  choice: deine Schande
  rationale: Das Substantiv bezeichnet öffentlich sichtbare Schmach oder Entehrung. „Schande“ bewahrt sowohl die soziale als auch die persönliche Dimension.
theological_decisions:
- issue: Bild öffentlicher Entblößung im göttlichen Gericht
  choice: Das konkrete Bild hochgehobener Gewandsäume und sichtbar gewordener Schande bleibt erhalten.
  alternative: Das Bild allgemein als Demütigung oder Entehrung umschreiben.
  rationale: Der hebräische Text verwendet bewusst eine drastische Metapher erzwungener Bloßstellung für Jerusalems öffentliche Demütigung im Gericht. Eine Verallgemeinerung würde die prophetische Schärfe mindern.
- issue: Zeitbezug der Gerichtsaussage
  choice: Die hebräischen Perfektformen werden im Haupttext mit deutschem Perfekt beziehungsweise Präteritum wiedergegeben.
  alternative: 'Futurisch übersetzen: „werde … hochheben, sodass … sichtbar wird“.'
  rationale: Die Verbformen stellen das Gericht als vollzogen oder gewiss dar. Da prophetische Gerichtsworte solche Formen auch für sicher bevorstehendes Geschehen gebrauchen können, wird die futurische Deutung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das drastische prophetische Kleidungsbild wird konkret, aber nicht unnötig explizit wiedergegeben. „Gewandsäume“ ist verständlich und zugleich dem poetisch-prophetischen Register angemessen.
