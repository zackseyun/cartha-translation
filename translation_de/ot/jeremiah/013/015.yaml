  text: שִׁמְע֥וּ וְ/הַאֲזִ֖ינוּ אַל תִּגְבָּ֑הוּ כִּ֥י יְהוָ֖ה דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/015.yaml
  text: Hear and listen; do not be proud[a], for Yahweh has spoken.
translation:
  language: de
  text: Hört und gebt Acht; seid nicht hochmütig, denn Jahwe hat gesprochen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Hört
  rationale: Der Imperativ Plural von שׁמע wird eigenständig wiedergegeben, damit die rhetorische Doppelung mit dem folgenden nahezu synonymen Imperativ erhalten bleibt.
- source_word: וְהַאֲזִינוּ
  choice: und horcht auf
  rationale: Der Hifil-Imperativ von אזן fordert zu aufmerksamem Hinhören auf. „Horcht auf“ ist natürlich und verstärkt „Hört“, ohne die Doppelung einzuebnen.
- source_word: אַל תִּגְבָּהוּ
  choice: Seid nicht hochmütig
  rationale: Die mit אַל verneinte Form von גבה bezeichnet hier das Sich-Erheben im Sinn von Überheblichkeit. „Hochmütig“ bewahrt das Bild der inneren Erhöhung besser als das im Deutschen auch positiv deutbare „stolz“.
- source_word: כִּי
  choice: denn
  rationale: כִּי leitet hier die Begründung der vorausgehenden Aufforderung ein; „denn“ entspricht dem knappen prophetischen Ton.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: דִּבֵּר
  choice: hat gesprochen
  rationale: Das Perfekt bezeichnet die vollzogene göttliche Rede mit bleibender Geltung; das deutsche Perfekt klingt zugleich natürlich und feierlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst. „Jahwe“ bewahrt ihn als persönlichen Namen, statt ihn durch einen Titel zu ersetzen.
- issue: Moralische Bedeutung von גבה
  choice: Seid nicht hochmütig
  alternative: Erhebt euch nicht
  rationale: Im Kontext bezeichnet das Verb wahrscheinlich arrogante Selbsterhöhung. Die Hauptfassung macht diese moralische Bedeutung verständlich; die Fußnote bewahrt die bildnähere Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden parallelen Hörbefehle bleiben als rhetorische Verstärkung sichtbar; der Ausruf markiert ihre dringliche prophetische Kraft.
