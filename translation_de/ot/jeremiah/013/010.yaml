source:
  edition: WLC
  text: הָ/עָם֩ הַ/זֶּ֨ה הָ/רָ֜ע הַֽ/מֵּאֲנִ֣ים לִ/שְׁמ֣וֹעַ אֶת דְּבָרַ֗/י הַ/הֹֽלְכִים֙ בִּ/שְׁרִר֣וּת לִבָּ֔/ם וַ/יֵּלְכ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם וִ/יהִי֙ כָּ/אֵז֣וֹר הַ/זֶּ֔ה אֲשֶׁ֥ר לֹא יִצְלַ֖ח לַ/כֹּֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
translation:
  language: de
  text: Dieses böse Volk, das sich weigert, auf meine Worte zu hören, das dem Starrsinn seines Herzens folgt und anderen Göttern folgt, um ihnen zu dienen und sich vor ihnen niederzuwerfen, wird wie dieser Gürtel[a] werden, der zu nichts taugt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Hüftband“, „Schärpe“ beziehungsweise „Hüfttuch“; das hebräische Wort אֵזוֹר bezeichnet ein um die Hüfte getragenes Kleidungsstück.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  choice: dieses böse Volk
  rationale: עָם bezeichnet hier das Volk als Kollektiv; רַע enthält eine deutliche moralische Verurteilung, die mit „böse“ gewahrt bleibt.
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת־דְּבָרַי
  choice: das sich weigert, auf meine Worte zu hören
  rationale: מָאֵן bezeichnet bewusste Weigerung. „Auf ... hören“ gibt im Deutschen sowohl das Hören als auch den darin liegenden Gehorsamsanspruch wieder; der hebräische Plural „Worte“ bleibt erhalten.
- source_word: הַהֹלְכִים בִּשְׁרִרוּת לִבָּם
  choice: das dem Starrsinn seines Herzens folgt
  rationale: Die idiomatische deutsche Formulierung bewahrt den Gedanken fortgesetzten Handelns nach innerer Halsstarrigkeit, ohne das hebräische Bild durch ein unnatürliches „im Starrsinn wandeln“ mechanisch nachzuahmen. Der kollektive Singular bleibt erhalten.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: und anderen Göttern nachläuft
  rationale: „Nachlaufen“ gibt die hebräische Wendung אַחֲרֵי ... הלך anschaulich wieder. Das Präsens fügt die Handlung natürlich in die fortlaufende Charakterisierung des Volkes ein, ohne ihre tatsächliche Abwendung zu verharmlosen.
- source_word: לְעָבְדָם
  choice: um ihnen zu dienen
  rationale: „Dienen“ bewahrt die eigene Bedeutung von עבד und unterscheidet sie vom folgenden körperlichen Akt des Niederwerfens.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: und sich vor ihnen niederzuwerfen
  rationale: Die Wiedergabe erhält die konkrete Bedeutung des Sich-Niederwerfens und fasst beide Verben nicht unterschiedslos als „anbeten“ zusammen.
- source_word: כָּאֵזוֹר הַזֶּה
  choice: wie dieser Gürtel
  rationale: אֵזוֹר bezeichnet ein um die Hüfte getragenes Kleidungsstück. „Gürtel“ ist im modernen Deutsch natürlich und passt zum Zeichenakt; die lexikalische Spannweite wird in einer Fußnote offengelegt.
- source_word: אֲשֶׁר לֹא יִצְלַח לַכֹּל
  choice: der zu nichts taugt
  rationale: Diese geläufige deutsche Wendung gibt die völlige Nutzlosigkeit der hebräischen Aussage knapp und kräftig wieder.
theological_decisions:
- issue: Unterschiedliche Ausdrücke für den Götzendienst
  choice: עבד mit „dienen“ und השתחוה mit „sich niederwerfen“ wiedergeben
  alternative: Beide Verben allgemein mit „anbeten“ wiedergeben
  rationale: Der hebräische Text nennt zwei unterscheidbare Formen der Hinwendung zu fremden Göttern. Ihre getrennte Wiedergabe bewahrt die rhetorische Fülle, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die parallelen Relativsätze und die konkrete Sprache des Götzendienstes bleiben erhalten; unnötige Hebraismen werden vermieden.
