source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אָנֹכִ֗י כָּרַ֤תִּֽי בְרִית֙ אֶת אֲב֣וֹתֵי/כֶ֔ם בְּ/י֨וֹם הוֹצִאִ֤/י אוֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בֵּ֥ית עֲבָדִ֖ים לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/013.yaml
  text: 'Thus says Yahweh, the God of Israel: I myself made a covenant with your fathers on the day I brought them out from the land of Egypt, from the house of servants, saying,'
translation:
  language: de
  text: 'So spricht Jahwe, der Gott Israels: Ich selbst schloss mit euren Vätern einen Bund[a] an dem Tag, als ich sie aus dem Land Ägypten, aus dem Sklavenhaus[b], herausführte, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „einen Bund schneiden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebräisch wörtlich: „aus dem Haus der Sklaven“; auch: „aus dem Haus der Knechtschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in gegenwärtigem, würdigem Standarddeutsch idiomatisch wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der persönliche Gottesname wird transliteriert und nicht durch einen Titel ersetzt.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: der Gott Israels
  rationale: Die hebräische Status-constructus-Verbindung wird direkt und natürlich wiedergegeben.
- source_word: אָנֹכִי
  choice: Ich selbst
  rationale: Das ausdrücklich gesetzte selbstständige Pronomen wird als mögliche Hervorhebung des handelnden Bundesstifters sichtbar gemacht.
- source_word: כָּרַתִּי בְרִית
  choice: schloss ... einen Bund
  rationale: „Einen Bund schließen“ ist die natürliche deutsche Entsprechung des hebräischen Idioms; dessen wörtliches Bild wird in einer Fußnote bewahrt.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: mit euren Vätern
  rationale: Bewahrt die ausdrücklich maskuline Bezeichnung des hebräischen Textes, ohne sie zu „Vorfahren“ zu verallgemeinern.
- source_word: בְּיוֹם
  choice: an dem Tag, als
  rationale: Erhält den formalen Tagesbezug und verbindet ihn zugleich idiomatisch mit dem folgenden Ereignis.
- source_word: הוֹצִיאִי אוֹתָם
  choice: ich sie ... herausführte
  rationale: Gibt den Hifil von יצא im Exoduszusammenhang wieder und bewahrt den Anklang an die etablierte Herausführungsformel.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: aus dem Land Ägypten
  rationale: Die vollständige heilsgeschichtliche Ortsangabe bleibt erhalten.
- source_word: מִבֵּית עֲבָדִים
  choice: aus dem Sklavenhaus
  rationale: Die kompakte deutsche Form bewahrt die konkrete Wirklichkeit der Sklaverei und das Bild eines „Hauses“, ohne es zum abstrakteren „Haus der Knechtschaft“ abzuschwächen.
- source_word: לֵאמֹר
  choice: 'und sagte:'
  rationale: Leitet im Deutschen natürlich die im nächsten Vers folgende direkte Rede ein; der Doppelpunkt zeigt die Fortsetzung an.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Transliteration bewahrt den persönlichen Bundesnamen, statt ihn durch den Titel „HERR“ zu ersetzen.
- issue: Mögliche Hervorhebung durch אָנֹכִי
  choice: Ich selbst
  alternative: Ich
  rationale: Das unabhängige Pronomen kann den bereits in der Verbform enthaltenen Sprecher hervorheben. „Ich selbst“ erhält diese mögliche Betonung, ohne sie weiter auszudeuten.
- issue: Wiedergabe von עֲבָדִים in der Exodusformel
  choice: Sklaven
  alternative: Knechtschaft
  rationale: Im Kontext der Befreiung aus Ägypten bezeichnet das Wort versklavte Menschen; die konkrete soziale Wirklichkeit sollte nicht durch eine abstrakte Formulierung abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der etablierten prophetischen Formel „So spricht“. Die Satzstruktur bleibt eng am Hebräischen, ist aber durch „als“ und „und sagte:“ im Deutschen gut verständlich. Der Doppelpunkt macht deutlich, dass die Rede im folgenden Vers weitergeht.
