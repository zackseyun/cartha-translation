  text: לָ/כֵן֮ כֹּה אָמַ֣ר יְהוָה֒ אַתֶּם֙ לֹֽא שְׁמַעְתֶּ֣ם אֵלַ֔/י לִ/קְרֹ֣א דְר֔וֹר אִ֥ישׁ לְ/אָחִ֖י/ו וְ/אִ֣ישׁ לְ/רֵעֵ֑/הוּ הִנְ/נִ֣י קֹרֵא֩ לָ/כֶ֨ם דְּר֜וֹר נְאֻם יְהוָ֗ה אֶל הַ/חֶ֨רֶב֙ אֶל הַ/דֶּ֣בֶר וְ/אֶל הָ/רָעָ֔ב וְ/נָתַתִּ֤י אֶתְ/כֶם֙ ל/זועה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/017.yaml
  text: 'Therefore thus says Yahweh: You have not listened to me[a], to proclaim liberty, each man to his brother and each man to his neighbor. Behold, I am proclaiming liberty for you, declares Yahweh—to the sword, to the pestilence[c][b], and to the famine—and I will make you a horror to all the kingdoms of the earth.'
translation:
  language: de
  text: 'Darum spricht Jahwe so: Ihr habt nicht auf mich gehört und keine Freilassung ausgerufen, jeder für seinen Bruder und jeder für seinen Nächsten. Seht, nun rufe ich für euch Freilassung aus – so lautet der Ausspruch Jahwes – für das Schwert, für die Seuche und für den Hunger.[a] Ich werde euch für alle Königreiche der Erde zu einem Schrecken machen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und mit bitterer Ironie steht in beiden Satzteilen dasselbe hebräische Wort für »Freilassung«: Weil sie einander nicht freiließen, ruft Jahwe ihnen nun Freilassung für Schwert, Seuche und Hunger aus.'
    reason: lexical_and_rhetorical_note
  - marker: b
    text: 'Oder: »zu einem Gegenstand des Entsetzens«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als im Deutschen gebräuchliche Transliteration wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: שְׁמַעְתֶּם אֵלַי
  choice: auf mich gehört
  rationale: Bewahrt die hebräische Hörmetapher und lässt den darin liegenden Sinn des Gehorchens mitschwingen.
- source_word: דְּרוֹר
  choice: Freilassung
  rationale: Bezeichnet im Kontext die rechtlich erklärte Entlassung hebräischer Sklaven. Dasselbe Wort wird an beiden Stellen beibehalten, um die bittere Ironie des Urteils zu bewahren.
- source_word: אִישׁ לְאָחִיו וְאִישׁ לְרֵעֵהוּ
  choice: jeder für seinen Bruder und jeder für seinen Nächsten
  rationale: Gibt die distributive Wiederholung von אִישׁ sowie die Unterscheidung zwischen Bruder und Nächstem wieder; »für« entspricht hier natürlich dem Begünstigten der ausgerufenen Freilassung.
- source_word: הִנְנִי
  choice: Seht, nun
  rationale: Markiert eine feierliche, unmittelbar bevorstehende göttliche Ankündigung in natürlichem modernem Deutsch.
- source_word: קֹרֵא לָכֶם דְרוֹר אֶל הַחֶרֶב ...
  choice: nun rufe ich für euch Freilassung aus … für das Schwert, für die Seuche und für den Hunger
  rationale: Erhält die auffällige Wiederholung von »Freilassung ausrufen« und die syntaktisch harte Zuordnung zu den drei Gerichtsgewalten, ohne die Ironie im Haupttext erklärend aufzulösen.
- source_word: לְזַוֲעָה
  choice: zu einem Bild des Entsetzens
  rationale: Drückt aus, dass die Betroffenen anderen zum Gegenstand beziehungsweise Anlass des Entsetzens werden; die idiomatische Ergänzung »Bild« vermeidet das missverständliche »zu einem Entsetzen machen«.
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: alle Königreiche der Erde
  rationale: Der Ausdruck hat hier internationalen Umfang und meint nicht nur die Königreiche des Landes Juda.
theological_decisions:
- issue: Ironische Umkehrung der Freilassung
  choice: »Freilassung« in beiden Satzteilen
  alternative: Im zweiten Satzteil »preisgeben« oder »freigeben«
  rationale: 'Die Wiederholung desselben hebräischen Wortes דְּרוֹר trägt die theologische und rhetorische Spannung: Weil das Volk anderen keine Freilassung gewährte, wird es selbst in bitterem Sinn für die Gerichtsgewalten »freigelassen«.'
- issue: Beziehung der Präpositionalphrasen zum göttlichen Urteil
  choice: »für das Schwert, für die Seuche und für den Hunger«
  alternative: »dem Schwert, der Seuche und dem Hunger preisgeben«
  rationale: Die gewählte Fassung folgt der auffälligen Form des Hebräischen und wahrt dessen Mehrdeutigkeit beziehungsweise Härte; die Alternative wäre deutlicher, würde die Metapher jedoch interpretierend auflösen.
- issue: Maskuline distributive Formulierung
  choice: »jeder für seinen Bruder und jeder für seinen Nächsten«
  alternative: »jeder für seinen Mitmenschen«
  rationale: Die konkrete männliche Einzelform des rechtlich-sozialen Zusammenhangs wird bewahrt, ebenso die beiden unterschiedlichen Beziehungsbegriffe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischer Feierlichkeit. »Seht, nun« ersetzt das altertümliche »Siehe«; »so lautet der Ausspruch Jahwes« gibt die feste Botenformel נְאֻם יְהוָה gehoben, aber verständlich wieder. Die Satzstellung wahrt soweit möglich die Wiederholung und die scharfe Ironie des Hebräischen.
