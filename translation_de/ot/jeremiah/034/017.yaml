  naturalness: Die prophetische Tonlage ist angemessen. Mit »keine Freilassung ausgerufen« und »zu einem Schrecken« wird der Satz klarer und modernes Standarddeutsch, ohne die absichtlich harte Ironie der zweiten Proklamation zu glätten.
  terminology: »Jahwe«, »Freilassung«, »Schwert«, »Seuche«, »Hunger« und »Königreiche der Erde« sind sachgerecht. Die identische Wiedergabe von דְּרוֹר in beiden Vorkommen muss erhalten bleiben.
