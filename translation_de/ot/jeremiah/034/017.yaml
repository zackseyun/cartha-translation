  to: 'Darum spricht Jahwe so: Ihr habt nicht auf mich gehört und keine Freilassung ausgerufen, jeder für seinen Bruder und jeder für seinen Nächsten. Seht, nun rufe ich für euch Freilassung aus – so lautet der Ausspruch Jahwes – für das Schwert, für die Seuche und für den Hunger.[a] Ich werde euch für alle Königreiche der Erde zu einem Schrecken machen.[b]'
