  text: הִנְ/נִ֨י מְצַוֶּ֜ה נְאֻם יְהוָ֗ה וַ/הֲשִׁ֨בֹתִ֜י/ם אֶל הָ/עִ֤יר הַ/זֹּאת֙ וְ/נִלְחֲמ֣וּ עָלֶ֔י/הָ וּ/לְכָד֖וּ/הָ וּ/שְׂרָפֻ֣/הָ בָ/אֵ֑שׁ וְ/אֶת עָרֵ֧י יְהוּדָ֛ה אֶתֵּ֥ן שְׁמָמָ֖ה מֵ/אֵ֥ין יֹשֵֽׁב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/022.yaml
  text: Behold[a], I am commanding, declares Yahweh, and I will bring them back to this city, and they will fight against it and capture it and burn it with fire. And I will make the cities of Judah a desolation[b], without inhabitant.
translation:
  language: de
  text: Siehe, ich erteile den Befehl – Ausspruch Jahwes – und werde sie zu dieser Stadt zurückbringen.[a] Sie werden gegen sie kämpfen, sie einnehmen und mit Feuer verbrennen. Die Städte Judas aber werde ich verwüsten, sodass niemand darin wohnt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit „sie“ sind die feindlichen Truppen gemeint, die sich von Jerusalem zurückgezogen hatten. Das hebräische Verb ist kausativ: Jahwe lässt sie zurückkehren beziehungsweise bringt sie zurück.'
    reason: Referenzklärung und Erläuterung der kausativen Verbform.
  - marker: b
    text: 'Wörtlich: „ohne Bewohner“. Die hebräische Wendung betont die völlige Verwüstung und Entvölkerung.'
    reason: Erläuterung der hebräischen Redewendung.
lexical_decisions:
- source_word: הִנְנִי מְצַוֶּה
  choice: Siehe, ich gebe Befehl
  rationale: הִנְנִי stellt die unmittelbar bevorstehende göttliche Handlung nachdrücklich heraus; das Partizip מְצַוֶּה bezeichnet hier das gegenwärtig ergehende Gebot. „Ich gebe Befehl“ ist im Deutschen natürlicher als „ich bin befehlend“ und lässt das im Hebräischen nicht genannte Objekt offen.
- source_word: נְאֻם יְהוָה
  choice: Ausspruch Jahwes
  rationale: Die feste prophetische Formel wird würdevoll und knapp wiedergegeben. „Ausspruch“ kennzeichnet die folgende Aussage als göttliches Orakel.
- source_word: וַהֲשִׁבֹתִים
  choice: und ich werde sie zu dieser Stadt zurückbringen
  rationale: 'Der Hifil von שׁוב ist kausativ: Jahwe bewirkt, dass die zuvor abgezogenen feindlichen Truppen zur Stadt zurückkehren. „Zurückbringen“ bewahrt sowohl die Kausativität als auch die Rückkehrvorstellung.'
- source_word: וְנִלְחֲמוּ עָלֶיהָ
  choice: Sie werden gegen sie kämpfen
  rationale: Die Formulierung gibt die militärische Auseinandersetzung gegen die Stadt direkt wieder; das feminine Pronomen bezieht sich im Deutschen natürlich auf „Stadt“.
- source_word: וּלְכָדוּהָ
  choice: sie einnehmen
  rationale: לכד bezeichnet im Zusammenhang einer Belagerung die Einnahme einer Stadt.
- source_word: וּשְׂרָפֻהָ בָאֵשׁ
  choice: sie mit Feuer verbrennen
  rationale: Die Wiedergabe erhält die ausdrückliche hebräische Wendung „mit Feuer“ und damit die Schärfe der Gerichtsankündigung.
- source_word: וְאֶת עָרֵי יְהוּדָה אֶתֵּן שְׁמָמָה
  choice: Die Städte Judas aber werde ich zur Einöde machen
  rationale: נתן mit שְׁמָמָה beschreibt das Herbeiführen eines verwüsteten Zustands. „Zur Einöde machen“ ist verständlich und wahrt die resultative Aussage.
- source_word: מֵאֵין יֹשֵׁב
  choice: sodass niemand mehr darin wohnt
  rationale: Die hebräische Wendung bezeichnet vollständige Entvölkerung. Die deutsche Formulierung gibt den Sinn natürlich wieder, ohne über die Aussage hinauszugehen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen ausdrücklich. „Jahwe“ ist die im modernen Deutschen übliche Transkription und bewahrt den Eigennamen, statt ihn durch einen Titel zu ersetzen.
- issue: Göttliche Veranlassung der Rückkehr der Feinde
  choice: ich werde sie ... zurückbringen
  alternative: sie werden ... zurückkehren
  rationale: Die Hifil-Form ist kausativ und schreibt Jahwe die Veranlassung der Rückkehr zu. Die Übersetzung bewahrt diese theologisch bedeutsame Handlungsträgerschaft, ohne das nicht ausdrücklich genannte Mittel zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Ton. „Siehe“ und „Ausspruch Jahwes“ bewahren die feierliche Ausdrucksweise; die übrige Syntax bleibt klar und für heutige Leser gut verständlich. Gedankenstriche grenzen die Botenformel lesefreundlich ab.
