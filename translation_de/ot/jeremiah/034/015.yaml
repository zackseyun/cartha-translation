base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/015.yaml
  text: And you yourselves had turned back today and had done what was right in my eyes[a], by proclaiming liberty, each man to his neighbor[b]; and you had cut a covenant before me in the house that is called by my name.
translation:
  language: de
  text: Ihr seid heute umgekehrt und habt getan, was in meinen Augen recht ist, indem jeder seinem Nächsten die Freilassung verkündete; und ihr habt vor mir einen Bund geschlossen in dem Haus, das nach meinem Namen genannt ist.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: einen Bund geschnitten.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Tempel in Jerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: seid ... umgekehrt
  rationale: שׁוב bezeichnet ein Umkehren bzw. Zurückkehren. Hier geht es um die Abkehr vom vorherigen Unrecht und die Rückkehr zum rechten Handeln, ohne dass ausdrücklich eine umfassende innere Buße behauptet wird.
- source_word: הַיּוֹם
  choice: heute
  rationale: Die direkte Zeitangabe bewahrt die Unmittelbarkeit des Hebräischen.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: was in meinen Augen recht ist
  rationale: Die Formulierung erhält das hebräische Bild und bezeichnet das Handeln, das Gottes eigener Beurteilung entspricht.
- source_word: לִקְרֹא דְרוֹר
  choice: Freilassung ausrufen
  rationale: דְּרוֹר bezeichnet in diesem Zusammenhang die öffentlich verkündete Entlassung aus der Sklaverei; „Freilassung“ gibt den rechtlich-sozialen Vorgang präziser wieder als das allgemeinere „Freiheit“.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: ein jeder seinem Nächsten
  rationale: Die distributive Wendung wird in natürlichem Deutsch wiedergegeben. „Ein jeder“ bewahrt die Einzelbezogenheit, während „Nächster“ רֵעַ in diesem Gemeinschaftskontext angemessen ausdrückt.
- source_word: וַתִּכְרְתוּ בְרִית
  choice: einen Bund geschlossen
  rationale: Das Deutsche verwendet für das Zustandebringen eines Bundes idiomatisch „einen Bund schließen“. Eine Fußnote dokumentiert das konkrete hebräische Bild „einen Bund schneiden“.
- source_word: לְפָנַי
  choice: vor mir
  rationale: Die knappe Wiedergabe bewahrt die Sprache der göttlichen Gegenwart und Aufsicht.
- source_word: בַּבַּיִת אֲשֶׁר נִקְרָא שְׁמִי עָלָיו
  choice: in dem Haus, das nach meinem Namen genannt ist
  rationale: Die traditionelle, verständliche deutsche Wendung bewahrt die Namensformel des Hebräischen und lässt Zugehörigkeit und göttliche Bezeichnung anklingen, ohne „Haus“ im Haupttext durch „Tempel“ zu ersetzen.
theological_decisions:
- issue: Wiedergabe der Bundesformel כרת ברית
  choice: einen Bund geschlossen
  alternative: 'wörtlich: einen Bund geschnitten'
  rationale: Die idiomatische deutsche Formulierung ist klar und würdevoll; die Fußnote erhält zugleich das rituell bedeutsame Bild des hebräischen Ausdrucks, das im weiteren Zusammenhang von Jeremia 34 eine Rolle spielt.
- issue: Distributive und grammatisch maskuline Wendung אִישׁ לְרֵעֵהוּ
  choice: ein jeder seinem Nächsten
  alternative: ein Mann seinem Nächsten; jeder seinem Mitmenschen
  rationale: „Ein jeder seinem Nächsten“ bildet die distributive Struktur und die grammatische Form ab, ohne im Deutschen unnötig zu behaupten, die Freilassung habe ausschließlich Männer betroffen; der Kontext nennt männliche und weibliche hebräische Sklaven.
- issue: Das nach Gottes Namen genannte Haus
  choice: Haus im Haupttext beibehalten, Tempelbezug in der Fußnote erläutern
  alternative: Tempel
  rationale: „Haus“ entspricht dem Quelltext und bewahrt die biblische Namensformel; die Fußnote macht den historischen Bezug verständlich, ohne die Bildsprache im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Die Gottesrede bleibt direkt; zentrale hebräische Bilder wie „in meinen Augen“ und das nach Gottes Namen genannte „Haus“ werden bewahrt. Die ungewöhnliche Bundesmetapher wird zugunsten natürlicher deutscher Sprache in einer Fußnote dokumentiert.
