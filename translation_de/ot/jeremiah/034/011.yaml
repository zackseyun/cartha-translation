  yaml_path: translation/ot/jeremiah/034/011.yaml
  text: But afterward they turned back and brought back the male servants and the female servants whom they had set free[a], and they forced them into slavery as male and female servants.
translation:
  language: de
  text: Doch danach kehrten sie um, holten die Sklaven und Sklavinnen zurück, die sie freigelassen hatten, und zwangen sie, wieder Sklaven und Sklavinnen zu sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder knapper: „und unterwarfen sie wieder als Sklaven und Sklavinnen.“ Das hebräische Verb bedeutet „unterwerfen, unter Gewalt bringen“; im Zusammenhang ist die erzwungene erneute Versklavung gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: sie kehrten um
  rationale: Das intransitive שוב bezeichnet hier nach der zuvor vollzogenen Freilassung eine Umkehr; „kehrten um“ bewahrt sowohl die Grundbedeutung als auch den Sinn einer Handlungsumkehr.
- source_word: אַחֲרֵי כֵן
  choice: danach
  rationale: Die Wendung markiert knapp und idiomatisch die zeitliche Abfolge.
- source_word: וַיָּשִׁבוּ
  choice: holten ... zurück
  rationale: Der Hifil von שוב ist kausativ. „holten ... zurück“ gibt im Deutschen die bewirkte Rückkehr natürlich wieder.
- source_word: הָעֲבָדִים וְאֶת הַשְּׁפָחוֹת
  choice: die Sklaven und Sklavinnen
  rationale: Im Zusammenhang von Freilassung und erneuter Versklavung ist „Sklaven“ sachlich klarer als „Knechte“. Die Paarung wahrt die ausdrücklich männliche und weibliche Bezeichnung des Hebräischen.
- source_word: שִׁלְּחוּ חָפְשִׁים
  choice: freigelassen hatten
  rationale: Die hebräische Verbindung bezeichnet idiomatisch die Entlassung aus der Unfreiheit; das Plusquamperfekt macht die vorausgehende Handlung deutlich.
- source_word: וַיִּכְבְּשׁוּם
  choice: zwangen sie wieder in den Sklavendienst
  rationale: כבש bedeutet unterwerfen beziehungsweise unter Gewalt bringen. Im Kontext der erneuten Versklavung bringt diese Formulierung den Zwang und das Ergebnis verständlich zum Ausdruck; „wieder“ ist aus dem vorausgehenden Freilassen und Zurückholen kontextuell begründet.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: als Sklaven und Sklavinnen
  rationale: Das ל bezeichnet den resultierenden Status; die Formulierung erhält die geschlechtlich differenzierte Paarung.
