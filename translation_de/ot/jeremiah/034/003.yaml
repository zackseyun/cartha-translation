base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/003.yaml
  text: And you will not escape from his hand[a], for you will surely be captured and given into his hand. Your eyes will see the eyes of the king of Babylon, and his mouth will speak to your mouth, and you will go to Babylon.
translation:
  language: de
  text: Du aber wirst seiner Hand nicht entkommen; denn du wirst ganz gewiss ergriffen und in seine Hand gegeben werden. Deine Augen werden die Augen des Königs von Babel sehen, und er wird direkt mit dir sprechen[a], und du wirst nach Babel kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sein Mund wird zu deinem Mund reden.« Gemeint ist ein direktes, persönliches Gespräch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִמָּלֵט מִיָּדוֹ
  choice: seiner Hand nicht entkommen
  rationale: Die Wendung bezeichnet das Entkommen aus der Gewalt oder Verfügungsgewalt eines anderen. Die deutsche Formulierung bewahrt das anschauliche Bild der Hand.
- source_word: כִּי תָפֹשׂ תִּתָּפֵשׂ
  choice: denn du wirst ganz gewiss ergriffen
  rationale: Die Verbindung aus Infinitivus absolutus und finitem Verb verstärkt die Aussage und drückt Nachdruck beziehungsweise Gewissheit aus.
- source_word: וּבְיָדוֹ תִּנָּתֵן
  choice: und in seine Hand gegeben werden
  rationale: Die passivische Wendung mit »in seine Hand« bezeichnet die Übergabe in die Gewalt eines anderen und hält zugleich das hebräische Bild fest.
- source_word: וְעֵינֶיךָ אֶת־עֵינֵי מֶלֶךְ בָּבֶל תִּרְאֶינָה
  choice: Deine Augen werden die Augen des Königs von Babel sehen
  rationale: Die konkrete Gegenüberstellung der Augen wird beibehalten, weil sie die unausweichliche persönliche Begegnung eindringlich ausdrückt.
- source_word: וּפִיהוּ אֶת־פִּיךָ יְדַבֵּר
  choice: und er wird unmittelbar mit dir reden
  rationale: Die ungewöhnliche wörtliche Rede von Mund zu Mund bezeichnet ein direktes persönliches Gespräch. Die Hauptfassung gibt den Sinn natürlich wieder; die konkrete hebräische Bildsprache bleibt in der Fußnote sichtbar.
- source_word: וּבָבֶל תָּבוֹא
  choice: und du wirst nach Babel kommen
  rationale: בוא bedeutet grundsätzlich »kommen/eintreten«. »Nach Babel kommen« ist im Deutschen natürlich und bewahrt gegenüber »gehen« die Perspektive des hebräischen Verbs.
