  terminology: „Seiner Hand entkommen“ und „in seine Hand gegeben werden“ bewahren die zusammenhängende hebräische Gewaltmetaphorik. „König von Babel“ und „Babel“ sind angemessen. „Direkt mit dir sprechen“ bleibt ohne weitergehende historische oder theologische Deutung.
