  naturalness: Die Formulierung ist grundsätzlich modernes, würdiges Standarddeutsch. Ein pluralisches Prädikat bei der klaren Aufzählung ist sowohl natürlicher als auch syntaktisch eindeutig. „lautete:“ stellt den Anschluss an die folgende Rede angemessen her.
  terminology: „Jahwe“, „Nebukadnezar“, „Heer“, „Völker“ und „Städte“ sind angemessen. Die Fußnote zur abweichenden hebräischen Namensform ist korrekt. Die Wendung „unter der Herrschaft seiner Hand“ bewahrt das Bild der Hand als Machtzeichen, bleibt aber verständlich.
