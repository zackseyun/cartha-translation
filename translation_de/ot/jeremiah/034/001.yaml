  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה וּ/נְבוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֣ל וְ/כָל חֵיל֡/וֹ וְ/כָל מַמְלְכ֣וֹת אֶרֶץ֩ מֶמְשֶׁ֨לֶת יָד֜/וֹ וְ/כָל הָ/עַמִּ֗ים נִלְחָמִ֧ים עַל יְרוּשָׁלִַ֛ם וְ/עַל כָּל עָרֶ֖י/הָ לֵ/אמֹֽר־־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/001.yaml
  text: The word that came to Jeremiah from Yahweh[a], when Nebuchadnezzar king of Babylon and all his army, and all the kingdoms of the earth under the dominion of his hand, and all the peoples, were fighting against Jerusalem and against all its cities, saying[b],
translation:
  language: de
  text: 'Das Wort, das von Jahwe an Jeremia erging, als Nebukadnezar[a], der König von Babylon, sein ganzes Heer, alle Königreiche der Erde[b], die unter der Herrschaft seiner Hand standen, und alle Völker gegen Jerusalem und gegen alle ihre Städte Krieg führten, lautete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „Nebukadrezar“; „Nebukadnezar“ ist die geläufigere deutsche Namensform.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „allen Königreichen des Landes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: Das Wort
  rationale: Die in prophetischen Überschriften übliche Wendung bezeichnet eine göttliche Mitteilung; „das Wort“ bewahrt die vertraute Formel.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: das … an Jeremia erging
  rationale: „An jemanden ergehen“ gibt die hebräische Offenbarungsformel im Deutschen natürlich und würdig wieder.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet den Ursprung der Botschaft; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: נְבוּכַדְרֶאצַּר
  choice: Nebukadnezar
  rationale: Die geläufige deutsche Namensform erleichtert das Erkennen; die nähere Wiedergabe der hebräischen Form wird in einer Fußnote genannt.
- source_word: חֵילוֹ
  choice: seinem ganzen Heer
  rationale: חַיִל bezeichnet hier die militärische Streitmacht; „Heer“ ist im historischen Kriegskontext klar und angemessen.
- source_word: מַמְלְכוֹת אֶרֶץ
  choice: allen Königreichen der Erde
  rationale: אֶרֶץ kann sowohl „Erde“ als auch „Land“ bedeuten. „Erde“ bewahrt hier die weit gefasste geopolitische Aussage, ohne die Alternative zu verdecken.
- source_word: מֶמְשֶׁלֶת יָדוֹ
  choice: die unter der Herrschaft seiner Hand standen
  rationale: Diese Formulierung erhält das konkrete hebräische Bild der Hand als Ausdruck ausgeübter Macht.
- source_word: הָעַמִּים
  choice: allen Völkern
  rationale: Der Plural bezeichnet verschiedene ethnisch-politische Gruppen; „Völker“ bildet dies präzise und idiomatisch ab.
- source_word: נִלְחָמִים עַל
  choice: Krieg führte gegen
  rationale: Das Partizip beschreibt eine andauernde Kriegshandlung. Wegen des zusammengesetzten Subjekts wird im Deutschen der Singular verwendet, dessen Kern „Nebukadnezar“ ist.
- source_word: כָּל עָרֶיהָ
  choice: alle ihre Städte
  rationale: Das feminine Suffix wird formal auf Jerusalem bezogen und bleibt in dieser knappen Form erhalten, auch wenn damit die zu Jerusalem beziehungsweise Juda gehörenden Städte gemeint sind.
- source_word: לֵאמֹר
  choice: 'lautete:'
  rationale: Der Infinitiv leitet die im folgenden Vers wiedergegebene Gottesrede ein; „lautete:“ stellt diesen Anschluss im Deutschen natürlich her.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR; Jehova
  rationale: Der Eigenname wird als Name wiedergegeben, statt ihn durch einen Titel zu ersetzen. „Jahwe“ ist die im modernen Deutschen übliche wissenschaftliche Form.
- issue: Reichweite von מַמְלְכוֹת אֶרֶץ
  choice: Königreiche der Erde
  alternative: Königreiche des Landes
  rationale: Der Ausdruck kann weit oder regional verstanden werden. Der Haupttext wahrt die umfassendere Formulierung; die engere lexikalische Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange hebräische Satzbau bleibt erkennbar, wird aber durch Appositionen und Relativsatz übersichtlich gegliedert. Die Bildsprache „Herrschaft seiner Hand“ bleibt bewusst erhalten.
