source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל הַ/שָּׂרִ֨ים וְ/כָל הָ/עָ֜ם אֲשֶׁר בָּ֣אוּ בַ/בְּרִ֗ית לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֤ישׁ אֶת שִׁפְחָת/וֹ֙ חָפְשִׁ֔ים לְ/בִלְתִּ֥י עֲבָד בָּ֖/ם ע֑וֹד וַֽ/יִּשְׁמְע֖וּ וַ/יְשַׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/010.yaml
  text: So all the officials and all the people who had entered into the covenant to send away[a], each man his male servant and each man his female servant, free, so as not to make them serve any longer[b], obeyed and sent them away.
translation:
  language: de
  text: Da hielten sich alle Amtsträger und das ganze Volk, die dem Bund beigetreten waren, daran, dass jeder seinen Sklaven und jeder seine Sklavin als freie Menschen freilassen und sie nicht länger in Sklaverei halten sollte.[a] Sie hielten sich daran und ließen sie frei.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu entlassen, jeder seinen Sklaven und jeder seine Sklavin, frei, um sie nicht länger zu versklaven“.'
    reason: lexical_clarification
  - marker: b
    text: 'Oder: „Sie hörten darauf“. Das hebräische Verb bedeutet wörtlich „hören“, bezeichnet hier angesichts der anschließenden Handlung jedoch Befolgung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: gehorchten
  rationale: שׁמע bedeutet grundsätzlich „hören/auf jemanden hören“, bezeichnet hier aber aufgrund der unmittelbar folgenden Freilassung die Befolgung der Bundesverpflichtung. Die Wiederholung im Hebräischen wird im Deutschen beibehalten.
- source_word: הַשָּׂרִים
  choice: führenden Männer
  rationale: שׂרים bezeichnet die politisch und gesellschaftlich führenden Amtsträger. „Führende Männer“ ist im Kontext natürlich und vermeidet das im Deutschen missverständliche „Fürsten“.
- source_word: בָּאוּ בַבְּרִית
  choice: den Bund eingegangen waren
  rationale: Die hebräische Wendung bezeichnet den verbindlichen Eintritt in einen Bund; „einen Bund eingehen“ ist die entsprechende natürliche deutsche Formulierung.
- source_word: לְשַׁלַּח ... חָפְשִׁים
  choice: freilassen
  rationale: שׁלח heißt wörtlich „fortschicken/gehen lassen“, bezeichnet zusammen mit חָפְשִׁים („frei“) hier eindeutig die Freilassung aus der Sklaverei.
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: seinen Sklaven und seine Sklavin
  rationale: Die beiden Wörter unterscheiden ausdrücklich einen männlichen und einen weiblichen versklavten Menschen. Im rechtlichen Kontext der Freilassung gibt „Sklave/Sklavin“ den sozialen Status deutlicher wieder als „Diener/Magd“.
- source_word: אִישׁ ... וְאִישׁ
  choice: Jeder ... seinen Sklaven und seine Sklavin
  rationale: 'Die doppelte distributive Formulierung wird in idiomatischem Deutsch zusammengezogen, ohne ihren Sinn zu verändern: Jeder betroffene Besitzer war zur Freilassung beider Gruppen verpflichtet.'
- source_word: לְבִלְתִּי עֲבָד בָּם עוֹד
  choice: sie nicht länger als Sklaven arbeiten lassen
  rationale: 'Die Formulierung beschreibt den Zweck der Freilassung: Von den Betroffenen sollte künftig keine Sklavenarbeit mehr verlangt werden. Die deutsche Wiedergabe macht diesen im Kontext liegenden Sinn verständlich, ohne eine bloße Dienstleistung anzudeuten.'
- source_word: וַיְשַׁלֵּחוּ
  choice: ließen sie frei
  rationale: Das Verb greift das vorherige שׁלח auf; das im Hebräischen unausgesprochene Objekt wird aus dem Kontext als „sie“ ergänzt.
theological_decisions:
- issue: Bezeichnung des unfreien Status
  choice: Sklave und Sklavin
  alternative: Diener und Magd
  rationale: Da der Vers von einer rechtlich verbindlichen Freilassung und vom Ende erzwungener Arbeit handelt, ist der Status der Betroffenen als versklavte Menschen wesentlich. Die mildere Dienstbotensprache würde diesen Sachverhalt verschleiern.
- issue: Bedeutung von שׁמע im Bundeszusammenhang
  choice: gehorchten
  alternative: hörten / hörten darauf
  rationale: Die Erzählung betont nicht nur die Wahrnehmung der Verpflichtung, sondern ihre tatsächliche Befolgung. Die Fußnote wahrt dennoch die Grundbedeutung und damit die sprachliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gehorchten“ bewahrt die auffällige hebräische Wiederaufnahme; die mittlere Satzstruktur wurde für gute Verständlichkeit leicht gegliedert. Die geschlechtsspezifischen Bezeichnungen des Ausgangstextes bleiben erhalten.
