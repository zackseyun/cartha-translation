base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/019.yaml
  text: the officials of Judah and the officials of Jerusalem[a], the court officials and the priests, and all the people of the land who passed between the pieces of the calf—
translation:
  language: de
  text: die führenden Amtsträger Judas und die führenden Amtsträger Jerusalems, die Hofbeamten[a] und die Priester sowie das ganze Volk des Landes, alle, die zwischen den Stücken des Kalbes hindurchgegangen waren —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Eunuchen. Das hebräische Wort kann sowohl Eunuchen als auch Amtsträger am königlichen Hof bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה וְשָׂרֵי יְרוּשָׁלִַם
  choice: die führenden Männer Judas und Jerusalems
  rationale: שַׂר bezeichnet einen Herrscher, führenden Amtsträger oder hohen Beamten. „Führende Männer“ gibt die gesellschaftlich-politische Stellung natürlich wieder; die wiederholte hebräische Konstruktion wird im Deutschen ohne Bedeutungsverlust zusammengezogen.
- source_word: הַסָּרִסִים
  choice: die Hofbeamten[a]
  rationale: סָרִיס kann sowohl einen Eunuchen als auch einen Amtsträger am königlichen Hof bezeichnen. In der Aufzählung gesellschaftlicher Gruppen ist die Amtsbezeichnung wahrscheinlich; die echte Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
- source_word: הַכֹּהֲנִים
  choice: die Priester
  rationale: Die übliche und eindeutige deutsche Wiedergabe von כֹּהֲנִים.
- source_word: כֹל עַם הָאָרֶץ
  choice: das ganze Volk des Landes
  rationale: Bewahrt den hebräischen Kollektivausdruck, ohne ihn durch Zusätze wie „das einfache Volk“ sozial enger festzulegen.
- source_word: הָעֹבְרִים
  choice: alle, die … hindurchgegangen waren
  rationale: Das Partizip bezeichnet die an dem zuvor beschriebenen Bundesritus Beteiligten. Das Plusquamperfekt stellt im deutschen Zusammenhang klar, dass sie den Gang zwischen den Stücken bereits vollzogen hatten.
- source_word: בֵּין בִּתְרֵי הָעֵגֶל
  choice: zwischen den Stücken des Kalbes
  rationale: Gibt die räumliche Wendung und den zerteilten Opferkörper direkt wieder. עֵגֶל wird seinem üblichen Sinn entsprechend mit „Kalb“ übersetzt.
theological_decisions:
- issue: Bedeutung von סָרִיסִים in der gesellschaftlichen Aufzählung
  choice: Hofbeamten im Haupttext
  alternative: Eunuchen
  rationale: Der Ausdruck kann eine körperliche Stellung als Eunuch oder ein Hofamt bezeichnen. Der Kontext spricht eher für eine administrative Gruppe, erlaubt aber keine sichere Festlegung; deshalb steht die wahrscheinlichere Funktionsbezeichnung im Text und die Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt eng am hebräischen Satzbau, wird aber durch die Zusammenziehung von „die führenden Männer Judas und Jerusalems“ und die Apposition „alle, die …“ natürlich lesbar. Der abschließende Gedankenstrich zeigt, dass der Satz in den folgenden Vers hinein weitergeführt wird.
