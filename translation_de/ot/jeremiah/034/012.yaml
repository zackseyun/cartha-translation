  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/012.yaml
  text: Then the word of Yahweh came to Jeremiah from Yahweh[a], saying,
translation:
  language: de
  text: 'Da erging an Jeremia das Wort Jahwes, das von Jahwe[a] kam, mit den Worten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH (der Gottesname), traditionell mit „der HERR“ wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Da erging
  rationale: Die Form führt einen neuen Schritt der Erzählung ein. „Da erging“ gibt dies in der geläufigen deutschen Prophetenformel natürlich und würdig wieder.
- source_word: דְבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ bewahrt den formalen Bezug auf die prophetische Offenbarung und ist weniger auslegend als „Botschaft“.
- source_word: אֶל יִרְמְיָהוּ
  choice: an Jeremia
  rationale: Bei der deutschen Wendung „ein Wort ergeht an jemanden“ bezeichnet „an“ den Empfänger idiomatisch.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: Die Präposition kennzeichnet Ursprung beziehungsweise Urheber. Die im Hebräischen auffällige erneute Nennung Jahwes bleibt erhalten.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt leitet die im folgenden Vers einsetzende direkte Rede im modernen Deutschen natürlich ein, ohne den hebräischen Anschluss inhaltlich zu erweitern.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext verwendet den Eigennamen YHWH. „Jahwe“ gibt ihn als Namen wieder, während die traditionelle Wiedergabe „der HERR“ einen Titel einsetzt.
- issue: Doppelte Nennung Jahwes
  choice: „das Wort Jahwes … von Jahwe“ beibehalten
  alternative: Die zweite Nennung aus stilistischen Gründen auslassen
  rationale: Die Wiederholung steht ausdrücklich im masoretischen Text. Obwohl sie im Deutschen ungewöhnlich wirkt, darf sie nicht stillschweigend geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte prophetische Formel „das Wort … erging an“ wird verwendet; die auffällige Wiederholung des Gottesnamens bleibt quellentreu stehen.
