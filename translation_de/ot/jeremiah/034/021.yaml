id: JER.34.21
reference: Jeremiah 34:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וְ/אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/אֶת שָׂרָ֗י/ו אֶתֵּן֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וּ/בְ/יַד חֵ֚יל מֶ֣לֶךְ בָּבֶ֔ל הָ/עֹלִ֖ים מֵ/עֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/021.yaml
  text: And I will give Zedekiah king of Judah and his officials into the hand of their enemies[a], into the hand of those who seek their life, and into the hand of the army of the king of Babylon, which has withdrawn from you.
translation:
  language: de
  text: Und Zedekia, den König von Juda, und seine führenden Beamten werde ich in die Hand ihrer Feinde geben, in die Hand derer, die ihnen nach dem Leben trachten, und in die Hand des Heeres des Königs von Babylon, das von euch abgezogen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das gerade von euch abzieht“. Wörtlich: „das von euch hinaufzieht“; gemeint ist, dass das Heer die Belagerung vorübergehend verlässt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Eingebürgerte deutsche Form des hebräischen Personennamens.
- source_word: שָׂרָיו
  choice: seine führenden Beamten
  rationale: שַׂר bezeichnet hier hochgestellte Amtsträger am königlichen Hof; die Wiedergabe wahrt den politischen Kontext, ohne einen ausschließlich militärischen Rang anzunehmen.
- source_word: אֶתֵּן ... בְּיַד
  choice: werde ich in die Hand ... geben
  rationale: Die im Hebräischen dreimal wiederholte Wendung bezeichnet die Auslieferung in fremde Gewalt. Die nahe Wiedergabe erhält sowohl das Bild als auch die rhetorische Wiederholung.
- source_word: אֹיְבֵיהֶם
  choice: ihre Feinde
  rationale: Direkte Wiedergabe des Plurals mit Suffix der dritten Person Plural.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: die ihnen nach dem Leben trachten
  rationale: Natürliche deutsche Entsprechung der hebräischen Wendung, die eine tödliche Absicht ausdrückt.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  choice: das Heer des Königs von Babylon
  rationale: חַיִל bezeichnet in diesem Zusammenhang die militärische Streitmacht.
- source_word: הָעֹלִים מֵעֲלֵיכֶם
  choice: das von euch abgezogen ist
  rationale: Die wörtliche Bewegung ‚von euch hinaufziehen‘ bezeichnet im Kontext das Aufheben beziehungsweise zeitweilige Verlassen der Belagerung. Der deutsche Ausdruck gibt diesen Sinn natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Formel „in die Hand“ bleibt als prägende rhetorische Wiederholung erhalten; der ungewöhnliche hebräische Bewegungsausdruck wird im Haupttext idiomatisch und in der Fußnote quellennah wiedergegeben.
