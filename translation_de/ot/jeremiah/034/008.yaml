  variant: modern standard German
source:
  edition: WLC
  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה אַחֲרֵ֡י כְּרֹת֩ הַ/מֶּ֨לֶךְ צִדְקִיָּ֜הוּ בְּרִ֗ית אֶת כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירֽוּשָׁלִַ֔ם לִ/קְרֹ֥א לָ/הֶ֖ם דְּרֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/008.yaml
  text: 'The word that came to Jeremiah from Yahweh after King Zedekiah had made a covenant with all the people who were in Jerusalem[b][a], to proclaim liberty to them:'
translation:
  language: de
  text: 'Das Wort, das von Jahwe an Jeremia erging, nachdem König Zedekia mit dem ganzen Volk in Jerusalem einen Bund geschlossen hatte[a], um ihnen Freilassung zu verkünden[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch wörtlich: „einen Bund geschnitten hatte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Freiheit“ beziehungsweise „Entlassung“. Gemeint ist hier eine förmliche Freilassung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  choice: Das Wort, das … an Jeremia erging
  rationale: Bewahrt die übliche prophetische Offenbarungsformel und klingt im modernen Standarddeutsch würdig und natürlich.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: Gibt den im hebräischen Text stehenden Gottesnamen direkt wieder und kennzeichnet Jahwe als Ursprung des Wortes.
- source_word: אַחֲרֵי כְּרֹת … בְּרִית
  choice: nachdem … einen Bund geschlossen hatte
  rationale: Die deutsche Wendung „einen Bund schließen“ entspricht idiomatisch dem hebräischen Ausdruck, wörtlich „einen Bund schneiden“.
- source_word: אֶת כָּל הָעָם אֲשֶׁר בִּירוּשָׁלִַם
  choice: mit dem ganzen Volk in Jerusalem
  rationale: Gibt die Gesamtheit des angesprochenen Volkes und dessen Aufenthaltsort knapp und sachgerecht wieder.
- source_word: לִקְרֹא לָהֶם דְּרוֹר
  choice: um ihnen Freilassung zu verkünden
  rationale: קרא bezeichnet hier eine förmliche Verkündigung; דְּרוֹר meint im Kontext die rechtliche Entlassung aus Abhängigkeit beziehungsweise Sklaverei.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Verwendet die im Deutschen etablierte Form des Personennamens.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext nennt das Tetragramm ausdrücklich. „Jahwe“ bewahrt den persönlichen Bundesnamen, ohne ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von דְּרוֹר
  choice: Freilassung
  alternative: Freiheit
  rationale: Im unmittelbaren rechtlichen Zusammenhang bezeichnet das Wort die förmliche Entlassung versklavter Personen. „Freilassung“ bildet diesen konkreten Sinn genauer ab, während die allgemeinere Bedeutung „Freiheit“ in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Einleitungsformel bleibt erkennbar; rechtliche Begriffe werden präzise, aber allgemein verständlich wiedergegeben.
