id: JER.34.4
reference: Jeremiah 34:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: אַ֚ךְ שְׁמַ֣ע דְּבַר יְהוָ֔ה צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ עָלֶ֔י/ךָ לֹ֥א תָמ֖וּת בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/004.yaml
  text: 'Yet hear the word of Yahweh, Zedekiah king of Judah: Thus says Yahweh concerning you, You shall not die by the sword.'
translation:
  language: de
  text: 'Doch höre das Wort Jahwes, Zedekia, König von Juda! So spricht Jahwe über dich: Du wirst nicht durch das Schwert sterben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: Doch
  rationale: Die Partikel leitet nach der vorausgehenden Gerichtsankündigung eine tröstliche Einschränkung beziehungsweise einen Gegensatz ein; „Doch“ gibt diese Funktion knapp und natürlich wieder.
- source_word: שְׁמַע
  choice: höre
  rationale: Der Imperativ fordert Zedekia auf, die göttliche Botschaft anzunehmen. „Höre das Wort“ bewahrt die geläufige prophetische Ausdrucksweise.
- source_word: דְּבַר יְהוָה
  choice: das Wort Jahwes
  rationale: „Wort“ wahrt den festen prophetischen Sprachgebrauch und ist weniger auslegend als „Botschaft“.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird im Deutschen in seiner etablierten Form „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Der Personenname wird nach üblicher deutscher Bibeltradition wiedergegeben.
- source_word: מֶלֶךְ יְהוּדָה
  choice: König von Juda
  rationale: Die Genitivverbindung bezeichnet Zedekias Amt und Herrschaftsgebiet; „König von Juda“ ist die natürliche deutsche Form.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Diese traditionelle und zugleich verständliche Wiedergabe bewahrt die feierliche prophetische Botenformel.
- source_word: עָלֶיךָ
  choice: über dich
  rationale: עַל bezeichnet hier den Gegenstand der göttlichen Aussage. „Über dich“ bleibt nahe an der hebräischen Formulierung, ohne eine feindselige Bedeutung wie „gegen dich“ einzutragen.
- source_word: לֹא תָמוּת
  choice: Du wirst nicht sterben
  rationale: Das negierte Imperfekt kündigt Zedekias zukünftiges Geschick an. „Wirst nicht sterben“ ist im heutigen Deutsch natürlicher als „sollst nicht sterben“, das als Gebot missverstanden werden könnte.
- source_word: בֶּחָרֶב
  choice: durch das Schwert
  rationale: Die Formulierung bezeichnet gewaltsamen Tod durch die Waffe und bewahrt das hebräische Bild, ohne es enger als Tod in einer Schlacht auszulegen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt den Gottesnamen ausdrücklich. „Jahwe“ bewahrt ihn als Eigennamen, statt ihn durch einen Hoheitstitel zu ersetzen.
- issue: Charakter der Aussage לֹא תָמוּת
  choice: 'Zukünftige Zusage: „Du wirst nicht sterben“'
  alternative: 'Normative Formulierung: „Du sollst nicht sterben“'
  rationale: Im Zusammenhang wird Zedekias Schicksal angekündigt, nicht ein Verbot ausgesprochen. Die Zukunftsform vermeidet diese mögliche Fehlinterpretation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem prophetischem Ton. Die direkte Anrede wird durch Kommas und ein Ausrufezeichen klar gegliedert; die feste Formel „So spricht Jahwe“ bleibt bewusst prägnant.
