source:
  edition: WLC
  text: מִ/קֵּ֣ץ שֶׁ֣בַע שָׁנִ֡ים תְּֽשַׁלְּח֡וּ אִישׁ֩ אֶת אָחִ֨י/ו הָ/עִבְרִ֜י אֲשֶֽׁר יִמָּכֵ֣ר לְ/ךָ֗ וַ/עֲבָֽדְ/ךָ֙ שֵׁ֣שׁ שָׁנִ֔ים וְ/שִׁלַּחְתּ֥/וֹ חָפְשִׁ֖י מֵֽ/עִמָּ֑/ךְ וְ/לֹֽא שָׁמְע֤וּ אֲבֽוֹתֵי/כֶם֙ אֵלַ֔/י וְ/לֹ֥א הִטּ֖וּ אֶת אָזְנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/014.yaml
  text: At the end of seven years[a], each of you shall send away his Hebrew brother who has been sold to you and has served you six years; you shall send him away free from you[c][b]. But your fathers did not listen to me or incline their ear.
translation:
  language: de
  text: Am Ende von sieben Jahren[a] soll jeder von euch seinen hebräischen Bruder[b], der an ihn verkauft worden ist[c] und ihm sechs Jahre gedient hat, entlassen; du sollst ihn frei aus deinem Dienst entlassen. Doch eure Vorfahren hörten nicht auf mich und neigten mir ihr Ohr nicht zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nach sieben Jahren.“ Die hebräische Wendung kann den Abschluss eines Siebenjahreszeitraums bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „seinen hebräischen Volksgenossen“ beziehungsweise „seinen hebräischen Verwandten“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der sich ihm verkauft hat“. Die hebräische Form kann in diesem rechtlichen Zusammenhang passiv oder reflexiv verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: Nach Ablauf von sieben Jahren
  rationale: Die Wendung bezeichnet das Ende beziehungsweise den Abschluss eines Siebenjahreszeitraums. „Nach Ablauf“ ist im Deutschen natürlich und lässt die genauen kalendarischen Modalitäten offen.
- source_word: תְּשַׁלְּחוּ אִישׁ
  choice: soll jeder von euch … entlassen
  rationale: אִישׁ hat hier distributive Funktion. „Jeder von euch“ gibt dies idiomatisch wieder; „entlassen“ trifft im rechtlichen Zusammenhang die Bedeutung von שׁלח als Freigabe aus einem Dienstverhältnis.
- source_word: אָחִיו הָעִבְרִי
  choice: seinen hebräischen Bruder
  rationale: Die Übersetzung bewahrt sowohl die maskuline Einzelform als auch die familiär-gemeinschaftliche Aussage von אָח, ohne sie auf eine rein leibliche Verwandtschaft festzulegen.
- source_word: אֲשֶׁר יִמָּכֵר לְךָ
  choice: der an dich verkauft worden ist
  rationale: Der Nifal von מכר lässt sich passiv oder in diesem Rechtszusammenhang reflexiv verstehen. Die passive Wiedergabe folgt der unmittelbarsten grammatischen Lesart; die Alternative wird in einer Fußnote genannt.
- source_word: וַעֲבָדְךָ שֵׁשׁ שָׁנִים
  choice: und dir sechs Jahre gedient hat
  rationale: „Gedient hat“ bezeichnet den vor der Freilassung abgeschlossenen Dienstzeitraum und wahrt den rechtlichen Dienstcharakter von עבד.
- source_word: וְשִׁלַּחְתּוֹ חָפְשִׁי מֵעִמָּךְ
  choice: du sollst ihn als freien Mann aus deinem Dienst entlassen
  rationale: „Als freien Mann“ gibt das maskuline Prädikativ חָפְשִׁי wieder. „Aus deinem Dienst“ macht den im Kontext gemeinten Ausgang „von dir weg“ in natürlichem Deutsch verständlich.
- source_word: וְלֹא שָׁמְעוּ אֲבוֹתֵיכֶם אֵלַי
  choice: Doch eure Vorfahren hörten nicht auf mich
  rationale: „Auf jemanden hören“ bewahrt im Deutschen das Hörbild und schließt zugleich die Bedeutung des Gehorchens ein. „Vorfahren“ ist im heutigen Deutsch natürlicher als „Väter“ und bezeichnet hier die früheren Generationen.
- source_word: וְלֹא הִטּוּ אֶת אָזְנָם
  choice: und neigten mir ihr Ohr nicht zu
  rationale: Die bildhafte hebräische Wendung für aufmerksames Hören wird in verständlichem, gehobenem Deutsch beibehalten.
theological_decisions:
- issue: Bundesgemeinschaftliche Verwandtschaftssprache in maskuliner Einzelform
  choice: seinen hebräischen Bruder
  alternative: seinen hebräischen Volksgenossen / seinen hebräischen Verwandten
  rationale: „Bruder“ bewahrt die familiäre und gemeinschaftliche Kraft des Ausgangstextes sowie dessen maskuline Einzelform, ohne vorschnell festzulegen, ob ein leiblicher Bruder gemeint ist.
- issue: Verkaufter Dienst und Freilassung
  choice: verkauft worden ist … gedient hat … als freien Mann aus deinem Dienst entlassen
  alternative: sich dir verkauft … für dich gearbeitet … freilassen
  rationale: Die Formulierung erhält den rechtlichen Zusammenhang eines durch Verkauf begründeten Dienstverhältnisses, ohne spätere Formen von Sklaverei in den Text einzutragen. Zugleich bleibt die mögliche reflexive Deutung des Verkaufs in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wechselnde Anrede zwischen der Gemeinschaft („ihr“, „euch“, „eure“) und dem einzelnen Verpflichteten („dich“, „dir“, „du“) wird entsprechend dem Hebräischen bewahrt. Die Wiederholung des Entlassungsgebots bleibt sichtbar, ohne das im Deutschen unnatürliche „von dir weg“ wörtlich nachzubilden.
