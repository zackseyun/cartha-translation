revisions:
- from: Nach Ablauf von sieben Jahren[a] soll jeder von euch seinen hebräischen Bruder[b], der an dich verkauft worden ist[c] und dir sechs Jahre gedient hat, entlassen; du sollst ihn als freien Mann aus deinem Dienst entlassen. Doch eure Vorfahren hörten nicht auf mich und neigten mir ihr Ohr nicht zu.
  to: Am Ende von sieben Jahren[a] soll jeder von euch seinen hebräischen Bruder[b], der an ihn verkauft worden ist[c] und ihm sechs Jahre gedient hat, entlassen; du sollst ihn frei aus deinem Dienst entlassen. Doch eure Vorfahren hörten nicht auf mich und neigten mir ihr Ohr nicht zu.
  rationale: Die zeitliche Hauptlesart wird näher am hebräischen Wortlaut ausgerichtet. Außerdem werden die distributiven Singularbezüge im Relativsatz idiomatisch als Drittperson wiedergegeben; dadurch bleibt der Wechsel zwischen Gemeinschaftsanrede und Einzelverpflichtung erhalten, ohne im Deutschen eine unnatürliche direkte Anrede innerhalb des Nominalausdrucks zu erzeugen. Die Fußnote c wird entsprechend angeglichen.
