  naturalness: Die Revision glättet den in modernem Standarddeutsch störenden Wechsel von „jeder von euch“ zu „dich/dir“. Die gehobene, verständliche Formulierung „neigten mir ihr Ohr nicht zu“ kann bleiben.
  terminology: „Hebräischen Bruder“, „verkauft“, „gedient“ und „entlassen“ bewahren die rechtliche und gemeinschaftliche Sprache des Ausgangstextes. „Frei aus seinem Dienst“ gibt חָפְשִׁי מֵעִמָּךְ kontextgemäß wieder, ohne eine bestimmte spätere Institution vorauszusetzen.
