revisions:
- from: Und ich werde die Männer hingeben, die meinen Bund übertreten[a] und die Worte des Bundes[b], den sie vor mir geschlossen haben[c], nicht eingehalten haben — das Kalb, das sie entzweigeschnitten haben und zwischen dessen Stücken sie hindurchgegangen sind.[d]
  to: Und ich werde die Männer ausliefern, die meinen Bund übertreten[a] und die Worte des Bundes[b], den sie vor mir geschlossen haben, nicht eingehalten haben – wie das Kalb, das sie in zwei Teile geschnitten haben und zwischen dessen Stücken sie hindurchgegangen sind.[c][d]
  rationale: Die Revision behebt den unverständlichen elliptischen Anschluss im Deutschen mit der minimalen Ergänzung „wie“, die der Kontext verlangt und die in der Fußnote transparent gemacht wird. Sie modernisiert „entzweigeschnitten“, wählt mit „ausliefern“ eine klare gerichtliche Wiedergabe von נתן und setzt beide ritualbezogenen Fußnoten an die tatsächlich erläuterte Textstelle.
