    issue: Unverständliche deutsche Schlussapposition
    rationale: Der Anschluss „— das Kalb“ kann im Deutschen nicht sinnvoll als Apposition zu „die Männer“ gelesen werden. Das Hebräische ist hier elliptisch; die deutsche Übersetzung benötigt eine minimale, kontextuell begründete Vergleichsmarkierung.
  - severity: medium
