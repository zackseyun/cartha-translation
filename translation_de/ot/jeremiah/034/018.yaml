source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת הָ/אֲנָשִׁ֗ים הָ/עֹֽבְרִים֙ אֶת בְּרִתִ֔/י אֲשֶׁ֤ר לֹֽא הֵקִ֨ימוּ֙ אֶת דִּבְרֵ֣י הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרְת֖וּ לְ/פָנָ֑/י הָ/עֵ֨גֶל֙ אֲשֶׁ֣ר כָּרְת֣וּ לִ/שְׁנַ֔יִם וַ/יַּעַבְר֖וּ בֵּ֥ין בְּתָרָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/018.yaml
  text: And I will hand over the men who transgressed my covenant[a], who did not uphold the words of the covenant that they made before me[c][b], the calf that they cut in two and passed between its pieces.
translation:
  language: de
  text: Und ich werde die Männer ausliefern, die meinen Bund übertreten[a] und die Worte des Bundes[b], den sie vor mir geschlossen haben, nicht eingehalten haben – wie das Kalb, das sie in zwei Teile geschnitten haben und zwischen dessen Stücken sie hindurchgegangen sind.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die meinen Bund verletzen“. Das hebräische Verb bedeutet wörtlich „hinübergehen/übertreten“ und nimmt klanglich das spätere Hindurchgehen zwischen den Stücken auf.'
    reason: lexical_alternative
  - marker: b
    text: „Die Worte des Bundes“ meint die Bestimmungen oder Verpflichtungen des Bundes.
    reason: lexical_alternative
  - marker: c
    text: Das Zerteilen eines Tieres und das Hindurchgehen zwischen seinen Stücken gehörten zu einem Bundesschluss. Die Handlung stellte dem Bundesbrecher sinnbildlich ein entsprechendes Gericht vor Augen; vergleiche 1. Mose 15,9–17.
    reason: cultural_note
  - marker: d
    text: Im Hebräischen steht vor „das Kalb“ kein ausdrückliches „wie“; die Schlussfügung ist elliptisch. Das ergänzte „wie“ macht im Deutschen die vom Zusammenhang nahegelegte Vergleichsbeziehung verständlich. Der folgende Vers führt das angekündigte Gericht weiter aus.
    reason: textual_or_syntactic_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Und ich werde … hingeben
  rationale: נתן bedeutet grundsätzlich „geben“, bezeichnet in Gerichtszusammenhängen aber häufig das Ausliefern oder Hingeben in fremde Gewalt. „Hingeben“ bewahrt sowohl den Ernst des Gerichts als auch die knappe Ausdrucksweise.
- source_word: הָאֲנָשִׁים
  choice: die Männer
  rationale: Der maskuline Plural von אִישׁ bezeichnet hier die konkret am Bundesschluss beteiligten Männer; eine geschlechtsneutrale Wiedergabe wäre weniger genau.
- source_word: הָעֹבְרִים אֶת־בְּרִיתִי
  choice: die meinen Bund übertreten
  rationale: עבר bezeichnet mit „Bund“ dessen Verletzung. „Übertreten“ gibt den rechtlich-moralischen Sinn wieder und erhält zugleich den im Hebräischen beabsichtigten Wortanklang an das spätere Hindurchgehen zwischen den Stücken.
- source_word: הֵקִימוּ אֶת דִּבְרֵי הַבְּרִית
  choice: die Worte des Bundes … nicht eingehalten
  rationale: הקים bezeichnet hier das Bestätigen, Aufrechterhalten oder Ausführen der Bundesbestimmungen. „Eingehalten“ ist im Deutschen natürlich; „Worte des Bundes“ bleibt als formnahe Wendung erhalten.
- source_word: כָּרְתוּ לְפָנַי
  choice: den sie vor mir geschlossen haben
  rationale: כרת ברית ist die feste Wendung für das Schließen eines Bundes. „Vor mir“ bewahrt den Gedanken der Gegenwart und Zeugenschaft Gottes, ohne den Idiomgebrauch mit „schneiden“ unnatürlich wörtlich wiederzugeben.
- source_word: הָעֵגֶל
  choice: das Kalb
  rationale: עגל bezeichnet ein junges Rind; „Kalb“ ist hier die naheliegende und traditionelle Wiedergabe.
- source_word: כָּרְתוּ לִשְׁנַיִם
  choice: entzweigeschnitten
  rationale: Die Wendung beschreibt anschaulich, dass das Tier in zwei Teile geschnitten wurde. „Entzweigeschnitten“ ist knapp und würdevoll.
- source_word: וַיַּעַבְרוּ בֵּין בְּתָרָיו
  choice: zwischen dessen Stücken sie hindurchgegangen sind
  rationale: Hier bezeichnet עבר die tatsächliche rituelle Bewegung. „Hindurchgegangen“ lässt den Wortanklang zu „übertreten“ noch erkennen; „Stücke“ passt zu den Teilen des zerteilten Tieres.
theological_decisions:
- issue: Verhältnis der abschließenden Kalb-Wendung zu den Männern unter dem Gericht
  choice: Die im Hebräischen gedrängte, elliptische Apposition bleibt erhalten; ein Gedankenstrich kennzeichnet den abrupten Anschluss.
  alternative: 'Eine ausdrückliche Vergleichspartikel ergänzen: „wie das Kalb“, oder die Folge ausformulieren: „Ich werde sie dem Kalb gleichmachen“.'
  rationale: Der hebräische Text setzt „das Kalb“ ohne ausdrückliches Vergleichswort appositionell nach den Männern. Der Zusammenhang, besonders der folgende Vers, legt eine Entsprechung zwischen dem Schicksal der Bundesbrecher und dem zerteilten Kalb nahe. Diese Folgerung wird jedoch nicht als bereits ausdrücklich im Vers stehender Vergleich in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist trotz des langen Relativsatzes gut nachvollziehbar. Der Gedankenstrich bewahrt die auffällige Ellipse des Hebräischen, statt sie durch einen nicht ausdrücklich vorhandenen Vergleich aufzulösen.
