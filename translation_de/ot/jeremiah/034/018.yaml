    rationale: Die Anmerkung über das Zerteilen eines Tieres und das Durchschreiten seiner Stücke ist an „geschlossen haben“ verankert, obwohl sie die abschließende Ritualhandlung erläutert. Sie sollte nach „Stücken“ stehen.
