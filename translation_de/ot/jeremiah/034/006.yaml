  text: Then Jeremiah the prophet spoke all these words to Zedekiah king of Judah in Jerusalem.
translation:
  language: de
  text: Da sprach der Prophet Jeremia in Jerusalem zu Zedekia, dem König von Juda, all diese Worte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Da redete
  rationale: Das Waw mit der Verbform führt die Erzählung weiter. „Da redete“ gibt diese Folge in natürlichem, würdigem Deutsch wieder; „redete“ passt zur Übermittlung der zuvor angeführten Botschaft.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: der Prophet Jeremia
  rationale: Der bestimmte Titel wird ausdrücklich bewahrt und in der im Deutschen natürlichen Wortstellung vor den Eigennamen gesetzt.
- source_word: אֶל צִדְקִיָּהוּ
  choice: zu Zedekia
  rationale: Die Präposition bezeichnet den Adressaten der Rede; „zu“ ist hier die natürliche deutsche Entsprechung.
- source_word: מֶלֶךְ יְהוּדָה
  choice: dem König von Juda
  rationale: Die hebräische Status-constructus-Verbindung wird idiomatisch mit „König von Juda“ wiedergegeben. Die Apposition steht im Dativ, passend zu „zu Zedekia“.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דברים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten; im Kontext bezeichnet es die prophetische Botschaft, weshalb „Worte“ sachlich und sprachlich am besten passt. „Alle“ und „diese“ bleiben erhalten.
- source_word: בִּירוּשָׁלִָם
  choice: in Jerusalem
  rationale: Die Ortsangabe wird direkt wiedergegeben und nahe beim Verb platziert, sodass eindeutig der Ort des Redens bezeichnet wird.
