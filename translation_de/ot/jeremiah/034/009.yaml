source:
  edition: WLC
  text: לְ֠/שַׁלַּח אִ֣ישׁ אֶת עַבְדּ֞/וֹ וְ/אִ֧ישׁ אֶת שִׁפְחָת֛/וֹ הָ/עִבְרִ֥י וְ/הָ/עִבְרִיָּ֖ה חָפְשִׁ֑ים לְ/בִלְתִּ֧י עֲבָד בָּ֛/ם בִּ/יהוּדִ֥י אָחִ֖י/הוּ אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/009.yaml
  text: that each man should set free his male servant and each man his female servant[a], the Hebrew man and the Hebrew woman, so that no one should enslave a Jew, his brother, among them.
translation:
  language: de
  text: dass jeder seinen Sklaven und jeder seine Sklavin, den Hebräer und die Hebräerin, freilassen sollte, damit niemand von ihnen seinen Bruder, einen Judäer, als Sklaven hielt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשַׁלַּח
  choice: freilassen sollte
  rationale: Im Zusammenhang des Bundes über die Freilassung aus Schuldknechtschaft bezeichnet das Verb eine rechtliche Entlassung in die Freiheit, nicht bloß ein Wegschicken.
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: seinen Sklaven ... seine Sklavin
  rationale: Der Kontext betrifft tatsächliche Unfreiheit und Freilassung. „Sklave“ und „Sklavin“ geben den Rechts- und Sozialstatus sowie den Geschlechterkontrast klar wieder.
- source_word: הָעִבְרִי וְהָעִבְרִיָּה
  choice: den Hebräer und die Hebräerin
  rationale: Die substantivierten männlichen und weiblichen Ethnonyme werden in ihrer ausdrücklich geschlechtsspezifischen Form bewahrt.
- source_word: חָפְשִׁים
  choice: freilassen
  rationale: Das prädikative „frei“ wird im Deutschen idiomatisch in das Verb „freilassen“ aufgenommen; der Zielzustand der Freilassung bleibt eindeutig.
- source_word: לְבִלְתִּי עֲבָד בָּם
  choice: damit unter ihnen niemand ... als Sklaven hielt
  rationale: Die Konstruktion drückt Zweck beziehungsweise Ergebnis aus. „Als Sklaven hielt“ bildet den kontextuell transitiven Sinn von עבד natürlich ab, ohne eine erneute Versklavung statt fortgesetzter Knechtschaft vorauszusetzen.
- source_word: בִּיהוּדִי אָחִיהוּ אִישׁ
  choice: einen Judäer, seinen Bruder
  rationale: Im spätmonarchischen historischen Kontext ist „Judäer“ präzise. „Seinen Bruder“ bewahrt die ausdrücklich verwandtschaftlich-bundestheologische Sprache des Hebräischen.
- source_word: אִישׁ ... וְאִישׁ ... אִישׁ
  choice: jeder ... und jeder ... niemand
  rationale: Die distributive Wiederholung wird in natürlichem Deutsch wiedergegeben; im letzten Glied verlangt die verneinte Zweckkonstruktion idiomatisch „niemand“.
theological_decisions:
- issue: Wiedergabe der Begriffe für den Status der Unfreien
  choice: Sklave/Sklavin
  alternative: Knecht/Magd oder Diener/Dienerin
  rationale: Da es um verpflichtende Freilassung aus rechtlicher Unfreiheit geht, würde „Diener“ den Status abschwächen; „Knecht/Magd“ wäre für viele heutige Leser weniger eindeutig.
- issue: Wiedergabe von יהודי
  choice: Judäer
  alternative: Jude
  rationale: Beide Bedeutungen sind lexikalisch möglich. In Jeremias historischem Umfeld bezeichnet das Wort hier am ehesten einen Angehörigen Judas; „Judäer“ wahrt diese historische Genauigkeit, ohne die mögliche spätere Bedeutung generell auszuschließen.
- issue: Bezug von אָחִיהוּ
  choice: seinen Bruder
  alternative: seinen Landsmann oder Mitjudäer
  rationale: Die wörtliche Verwandtschaftsbezeichnung bleibt erhalten und wird nicht auf eine rein ethnische oder politische Beziehung verengt.
- issue: Zeitlicher Aspekt von עבד
  choice: als Sklaven hielt
  alternative: versklavte
  rationale: Die Bestimmung untersagt im Kontext besonders die fortgesetzte Haltung hebräischer Schuldsklaven. „Hielt“ lässt diesen durativen Sinn erkennen, während „versklavte“ vor allem einen neuen Vorgang bezeichnen könnte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzform bleibt als abhängiger dass-Satz erhalten, weil der Vers syntaktisch an den vorausgehenden Kontext anschließt. Die doppelte Formulierung „jeder ... und jeder“ bewahrt die distributive Struktur des Hebräischen; „Judäer“ entspricht dem historischen Schauplatz im Königreich Juda.
