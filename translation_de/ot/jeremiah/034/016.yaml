  text: וַ/תָּשֻׁ֨בוּ֙ וַ/תְּחַלְּל֣וּ אֶת שְׁמִ֔/י וַ/תָּשִׁ֗בוּ אִ֤ישׁ אֶת עַבְדּ/וֹ֙ וְ/אִ֣ישׁ אֶת שִׁפְחָת֔/וֹ אֲשֶׁר שִׁלַּחְתֶּ֥ם חָפְשִׁ֖ים לְ/נַפְשָׁ֑/ם וַ/תִּכְבְּשׁ֣וּ אֹתָ֔/ם לִֽ/הְי֣וֹת לָ/כֶ֔ם לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָחֽוֹת־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/016.yaml
  text: 'But you turned back and profaned my name: each of you made his male servant and his female servant return, though you had set them free to go where they wished; then you subjugated them to be your male and female servants.'
translation:
  language: de
  text: 'Doch ihr kehrtet um und entweihtet meinen Namen: Jeder von euch ließ seinen Sklaven und seine Sklavin zurückkehren, obwohl ihr sie freigelassen hattet, nach eigenem Belieben; dann unterwarft ihr sie, um eure Sklaven und Sklavinnen zu sein.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: ihr machtet kehrt
  rationale: שׁוּב bezeichnet hier die Umkehrung des zuvor vollzogenen Handelns. Die deutsche Wendung bewahrt das konkrete Bild und den Vorwurf des Wortbruchs.
- source_word: וַתְּחַלְּלוּ אֶת־שְׁמִי
  choice: und entweihtet meinen Namen
  rationale: חלל im Piel bedeutet in Verbindung mit Gottes Namen, ihn zu entheiligen oder als unheilig zu behandeln. „Entweihen“ ist im Deutschen präzise und geläufig.
- source_word: וַתָּשִׁבוּ
  choice: ließ ... zurückkehren
  rationale: 'Der Hifil hat kausative Bedeutung: Die Freigelassenen wurden zur Rückkehr veranlasst beziehungsweise gezwungen. „Ließ ... zurückkehren“ erhält diese grammatische Struktur; der Zwang wird durch den folgenden Satz ausdrücklich.'
- source_word: אִישׁ ... וְאִישׁ
  choice: Jeder von euch
  rationale: Die Wiederholung von אִישׁ ist distributiv und nimmt jeden angesprochenen Sklavenhalter einzeln in die Verantwortung.
- source_word: עַבְדּוֹ ... שִׁפְחָתוֹ
  choice: seinen Sklaven und seine Sklavin
  rationale: Freilassung und erneute Unterwerfung machen den Status persönlicher Unfreiheit zum Kern des Zusammenhangs. „Sklave/Sklavin“ gibt dies deutlicher wieder als „Diener/Magd“ und bewahrt den Geschlechtsunterschied.
- source_word: שִׁלַּחְתֶּם חָפְשִׁים
  choice: ihr sie freigelassen hattet
  rationale: Die Verbindung bezeichnet nicht nur ein Wegschicken, sondern die Gewährung der Freiheit. Das Plusquamperfekt verdeutlicht die zeitliche Vorordnung.
- source_word: לְנַפְשָׁם
  choice: damit sie gehen konnten, wohin sie wollten
  rationale: Die Wendung beschreibt, dass die Freigelassenen über sich selbst und ihren Weg verfügen konnten. Die idiomatische Wiedergabe vermittelt diese persönliche Selbstbestimmung.
- source_word: וַתִּכְבְּשׁוּ אֹתָם
  choice: dann unterwarft ihr sie
  rationale: כבש bezeichnet das gewaltsame Unterwerfen beziehungsweise Unter-die-eigene-Gewalt-Bringen. „Unterwarft“ bewahrt die Härte, ohne eine im Verb nicht ausdrücklich enthaltene Richtung hinzuzufügen.
- source_word: לִהְיוֹת לָכֶם לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: sodass sie wieder eure Sklaven und Sklavinnen sein mussten
  rationale: Die Infinitivkonstruktion nennt den beabsichtigten oder herbeigeführten Status. „Sein mussten“ macht den Zwang deutlich; „wieder“ ergibt sich aus der zuvor beschriebenen Freilassung und Rückführung.
theological_decisions:
- issue: Bezeichnung des unfreien Status
  choice: Sklaven und Sklavinnen
  alternative: Diener und Mägde
  rationale: Der Zusammenhang handelt ausdrücklich von Freilassung, erzwungener Rückkehr und erneuter Unterwerfung. Die deutlichere Statusbezeichnung darf hier nicht abgeschwächt werden.
- issue: Entweihung des göttlichen Namens
  choice: entweihtet meinen Namen
  alternative: entehrtet meinen Namen
  rationale: Das Hebräische bezeichnet nicht lediglich einen Verlust an Ansehen, sondern die kultisch und theologisch gewichtige Profanierung des Namens. „Entweihen“ wahrt diese Spannung, ohne sie konfessionell auszudeuten.
- issue: Persönliche Freiheit der Freigelassenen
  choice: damit sie gehen konnten, wohin sie wollten
  alternative: für sich selbst / nach ihrem eigenen Wunsch
  rationale: Die Wiedergabe drückt die durch לְנַפְשָׁם bezeichnete Selbstverfügung aus, ohne festzulegen, ob ausschließlich räumliche Bewegungsfreiheit oder umfassendere persönliche Freiheit gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anklage bleibt direkt und rhythmisch gegliedert. „Sklave/Sklavin“ benennt den rechtlich-sozialen Zwang ungeschönt; die paarweise Formulierung bewahrt die geschlechtliche Unterscheidung des Hebräischen.
