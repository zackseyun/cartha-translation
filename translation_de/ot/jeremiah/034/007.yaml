source:
  edition: WLC
  text: וְ/חֵ֣יל מֶֽלֶךְ בָּבֶ֗ל נִלְחָמִים֙ עַל יְר֣וּשָׁלִַ֔ם וְ/עַ֛ל כָּל עָרֵ֥י יְהוּדָ֖ה הַ/נּֽוֹתָר֑וֹת אֶל לָכִישׁ֙ וְ/אֶל עֲזֵקָ֔ה כִּ֣י הֵ֗נָּה נִשְׁאֲר֛וּ בְּ/עָרֵ֥י יְהוּדָ֖ה עָרֵ֥י מִבְצָֽר־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/007.yaml
  text: while the army of the king of Babylon was fighting against Jerusalem and against all the remaining cities of Judah[a], against Lachish and against Azekah, for these alone remained among the cities of Judah as fortified cities.
translation:
  language: de
  text: während das Heer des Königs von Babylon gegen Jerusalem und gegen alle noch verbliebenen Städte Judas[a], gegen Lachisch und gegen Aseka kämpfte. Denn von den Städten Judas waren nur diese als befestigte Städte übrig geblieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nämlich Lachisch und Aseka“. Das Hebräische kann die beiden Namen als nähere Bestimmung der noch verbliebenen Städte Judas verstehen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: Heer
  rationale: Im militärischen Zusammenhang bezeichnet חֵיל die bewaffnete Streitmacht des babylonischen Königs; „Heer“ ist dafür die natürliche und präzise deutsche Wiedergabe.
- source_word: נִלְחָמִים
  choice: kämpfte
  rationale: Das Partizip beschreibt eine andauernde Kriegshandlung. Das grammatisch singularische Kollektiv „Heer“ verlangt im Deutschen die Singularform.
- source_word: הַנּוֹתָרוֹת
  choice: noch verbliebenen
  rationale: Das Partizip bezeichnet die Städte, die noch nicht gefallen waren. „noch verbliebenen“ gibt sowohl den fortdauernden Zustand als auch den Kontrast zu den bereits eroberten Städten wieder.
- source_word: אֶל לָכִישׁ וְאֶל עֲזֵקָה
  choice: gegen Lachisch und gegen Aseka
  rationale: Die Wiederholung von אֶל wird formal als „gegen … und gegen …“ bewahrt. So bleibt offen, ob die Namen appositionell die verbliebenen Städte bestimmen; diese naheliegende Lesart wird in der Fußnote genannt.
- source_word: כִּי הֵנָּה
  choice: Denn … nur diese
  rationale: כִּי leitet die Begründung ein, und das feminine Pronomen verweist auf die beiden genannten Städte. „nur“ macht die im Kontext erkennbare ausschließende Aussage idiomatisch deutlich.
- source_word: נִשְׁאֲרוּ
  choice: waren … übrig geblieben
  rationale: Die Form bezeichnet, dass diese Städte nach dem Fall anderer Städte noch bestanden; das Plusquamperfekt fügt sich natürlich in den deutschen Erzählzusammenhang.
- source_word: בְּעָרֵי יְהוּדָה
  choice: von den Städten Judas
  rationale: 'Die Präposition hat hier partitive Bedeutung: Lachisch und Aseka waren aus der Gesamtheit der judäischen Städte übrig geblieben.'
- source_word: עָרֵי מִבְצָר
  choice: befestigte Städte
  rationale: Die Wortverbindung bezeichnet Städte mit Verteidigungsanlagen; „befestigte Städte“ ist im modernen Deutschen klar und sachlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortlaufende Satzverknüpfung wird mit „während“ wiedergegeben; vor dem begründenden כִּי beginnt zur besseren Lesbarkeit ein neuer Satz. Die hebräische Wiederholung „gegen … gegen …“ bleibt im Haupttext erhalten, während die mögliche appositionelle Auffassung in der Fußnote dokumentiert wird.
