    issue: „im Feuer verbrennen“ für בָּאֵשׁ
    rationale: Die hebräische Wendung bezeichnet das Feuer als Mittel („mit Feuer“), nicht primär den Ort der Verbrennung. Die Korrektur wahrt die Formulierung des Ausgangstextes genauer.
  - severity: low
    issue: „rede mit Zedekia“ für אֶל־צִדְקִיָּהוּ
    rationale: „Mit“ kann ein Gespräch auf Gegenseitigkeit implizieren. „Zu Zedekia sprechen“ gibt die gerichtete prophetische Botschaft genauer wieder.
