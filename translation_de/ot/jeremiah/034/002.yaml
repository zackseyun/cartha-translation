source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָלֹךְ֙ וְ/אָ֣מַרְתָּ֔ אֶל צִדְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י נֹתֵ֜ן אֶת הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד מֶֽלֶךְ בָּבֶ֔ל וּ/שְׂרָפָ֖/הּ בָּ/אֵֽשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/002.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Go and speak to Zedekiah king of Judah, and say to him, ‘Thus says Yahweh: Behold, I am giving this city into the hand of the king of Babylon, and he will burn it with fire.’'
translation:
  language: de
  text: 'So spricht Jahwe, der Gott Israels: Geh und sprich zu Zedekia, dem König von Juda, und sag ihm: »So spricht Jahwe: Sieh, ich gebe diese Stadt in die Hand des Königs von Babylon[a], und er wird sie mit Feuer verbrennen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Gewalt des Königs von Babylon«.'
    reason: Lexikalische Alternative zur hebräischen Wendung בְּיַד, die das Ausgeliefertsein an die Macht eines anderen bezeichnet.
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: So spricht
  rationale: Die feste prophetische Botenformel wird in ihrer feierlichen, aber im Deutschen geläufigen Form wiedergegeben.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben und nicht durch einen Titel ersetzt; »Jahwe« ist die im modernen Deutschen übliche Form.
- source_word: הָלֹךְ
  choice: Geh
  rationale: Der als Befehl gebrauchte Infinitivus absolutus verlangt hier einen knappen Imperativ.
- source_word: וְאָמַרְתָּ ... וְאָמַרְתָּ אֵלָיו
  choice: und rede ... und sag zu ihm
  rationale: Die Wiederholung der beiden Redeanweisungen bleibt erhalten, ohne im Deutschen schwerfällig zu wirken.
- source_word: הִנְנִי
  choice: Sieh, ich
  rationale: »Sieh« bewahrt den Hinweis auf die unmittelbar bevorstehende, fest beschlossene Handlung und klingt natürlicher als das altertümliche »Siehe«.
- source_word: נֹתֵן
  choice: gebe
  rationale: Das Partizip bezeichnet die als unmittelbar und gewiss angekündigte Übergabe; das deutsche Präsens bildet dies prägnant ab.
- source_word: בְּיַד
  choice: in die Hand
  rationale: Die Bildsprache des hebräischen Macht- und Übergabeidioms bleibt im Haupttext erhalten; die gemeinte Bedeutung wird in einer Fußnote verdeutlicht.
- source_word: וּשְׂרָפָהּ בָּאֵשׁ
  choice: und er wird sie im Feuer verbrennen
  rationale: Das Suffix bezieht sich auf die Stadt; das maskuline Subjekt wird natürlich auf den unmittelbar zuvor genannten König von Babylon bezogen.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text verwendet den Gottesnamen selbst. Die Transliteration wahrt seinen Charakter als Eigenname, statt ihn durch einen Herrschaftstitel zu ersetzen.
- issue: Bildhafte Wendung בְּיַד
  choice: in die Hand des Königs von Babylon
  alternative: in die Gewalt des Königs von Babylon
  rationale: Der Haupttext bewahrt das konkrete hebräische Bild; die Fußnote macht deutlich, dass damit die Übergabe unter die Macht des Königs gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter prophetischer Formel. Die direkte Rede ist klar gegliedert; unnötig altertümliche Formen werden vermieden, während zentrale hebräische Bildsprache erhalten bleibt.
