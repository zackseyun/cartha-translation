  text: בְּ/שָׁל֣וֹם תָּמ֗וּת וּֽ/כְ/מִשְׂרְפ֣וֹת אֲ֠בוֹתֶי/ךָ הַ/מְּלָכִ֨ים הָ/רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ כֵּ֚ן יִשְׂרְפוּ לָ֔/ךְ וְ/ה֥וֹי אָד֖וֹן יִסְפְּדוּ לָ֑/ךְ כִּֽי דָבָ֥ר אֲנִֽי דִבַּ֖רְתִּי נְאֻם יְהוָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/005.yaml
  text: You will die in peace[a]. And as spices were burned for your fathers, the former kings who were before you, so they will burn spices for you, and they will lament for you, saying, “Alas, lord!” For I have spoken the word[b], declares Yahweh.
translation:
  language: de
  text: 'Du wirst in Frieden sterben. Und wie man für deine Väter, die früheren Könige, die vor dir waren, Räucherwerk verbrannte, so wird man auch für dich Räucherwerk verbrennen.[a] Man wird um dich klagen: »Ach, Herr!«[b] Denn ich habe dieses Wort gesprochen, spricht Jahwe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Verbrennungen“. Gemeint sind zeremonielle Verbrennungen zu Ehren verstorbener Könige, wahrscheinlich von Duftstoffen oder Räucherwerk, nicht die Verbrennung des Leichnams.'
    reason: cultural_note
  - marker: b
    text: 'Auch: »Wehe, Herr!« Der hebräische Ausdruck ist ein förmlicher Klageruf über einen Herrscher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׁלוֹם תָּמוּת
  choice: Du wirst in Frieden sterben
  rationale: Bewahrt die hebräische Wendung und bezeichnet die Umstände des Todes, ohne sie unnötig auf innere Gemütsruhe oder ausschließlich auf Gewaltlosigkeit einzuengen.
- source_word: וּכְמִשְׂרְפוֹת ... כֵּן יִשְׂרְפוּ לָךְ
  choice: wie man ... Totenfeuer entzündet hat, so wird man auch für dich eines entzünden
  rationale: מִשְׂרְפוֹת bezeichnet hier offenbar zeremonielle Verbrennungen zu Ehren verstorbener Könige. „Totenfeuer“ lässt den Gegenstand offen; die Fußnote schützt vor dem Missverständnis einer Einäscherung.
- source_word: אֲבוֹתֶיךָ הַמְּלָכִים הָרִאשֹׁנִים אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: deine Väter, die früheren Könige, die vor dir waren
  rationale: „Väter“ folgt dem Wortlaut; die nachfolgende Apposition macht deutlich, dass königliche Vorgänger gemeint sind.
- source_word: וְהוֹי אָדוֹן יִסְפְּדוּ לָךְ
  choice: 'Man wird um dich klagen: »Ach, Herr!«'
  rationale: יִסְפְּדוּ bezeichnet die förmliche Totenklage; הוֹי ist hier ein Klageruf und אָדוֹן eine ehrende Anrede an den verstorbenen König.
- source_word: כִּי דָבָר אֲנִי דִבַּרְתִּי
  choice: Denn ich habe dieses Wort gesprochen
  rationale: Gibt die betonte Verbindung des Substantivs דָבָר mit dem gleichstämmigen Verb wieder und bezieht „dieses Wort“ natürlich auf die vorangehende Zusage.
- source_word: נְאֻם יְהוָה
  choice: spricht Jahwe
  rationale: Natürliche deutsche Wiedergabe der prophetischen Botenformel; der Gottesname wird als „Jahwe“ wiedergegeben.
theological_decisions:
- issue: Bedeutung der königlichen Verbrennung
  choice: zeremonielles Totenfeuer, wahrscheinlich zum Verbrennen von Duftstoffen
  alternative: Einäscherung des Leichnams
  rationale: Der Zusammenhang verspricht ein ehrenvolles königliches Begräbnis. Vergleichbare alttestamentliche Belege sprechen für das Verbrennen von Duftstoffen oder anderen Gegenständen zu Ehren des Toten, nicht zwingend für die Verbrennung des Körpers.
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Die Umschrift bewahrt den im hebräischen Text stehenden Eigennamen und vermeidet seine Ersetzung durch einen Titel.
- issue: Anrede אָדוֹן im Klageruf
  choice: Herr
  alternative: Gebieter
  rationale: Hier ist nicht Gott gemeint, sondern der verstorbene König. „Herr“ wahrt die respektvolle Anrede, ohne eine weitergehende theologische Aussage einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wiederholung „die vor dir waren“ bewahrt den Nachdruck des Hebräischen. „Totenfeuer“ bleibt im Haupttext kulturell verständlich, während die Fußnote die wahrscheinliche Praxis präzisiert.
