source:
  edition: WLC
  text: וְ/נָתַתִּ֤י אוֹתָ/ם֙ בְּ/יַ֣ד אֹֽיְבֵי/הֶ֔ם וּ/בְ/יַ֖ד מְבַקְשֵׁ֣י נַפְשָׁ֑/ם וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַֽאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/034/020.yaml
  text: And I will give them into the hand of their enemies and into the hand of those who seek their life[c][b][a], and their dead bodies will become food for the birds of the sky and for the beasts of the earth.
translation:
  language: de
  text: Und ich werde sie in die Hand ihrer Feinde und in die Hand derer geben, die ihnen nach dem Leben trachten. Ihre Leichen werden den Vögeln des Himmels und den Tieren der Erde zum Fraß werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי אוֹתָם בְּיַד
  choice: Und ich werde sie in die Hand … geben
  rationale: Die Wendung נתן בְּיַד bezeichnet die Auslieferung in fremde Gewalt. Die konkrete hebräische Metapher bleibt im Deutschen verständlich und würdevoll erhalten.
- source_word: אֹיְבֵיהֶם
  choice: ihrer Feinde
  rationale: Direkte und kontextgemäße Wiedergabe von אֹיְבֵיהֶם.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  choice: derer, die ihnen nach dem Leben trachten
  rationale: Die deutsche feste Wendung gibt das hebräische Idiom, jemandes נֶפֶשׁ zu suchen, natürlich wieder und bezeichnet die Absicht, die Betroffenen zu töten.
- source_word: נִבְלָתָם
  choice: ihre Leichen
  rationale: נְבֵלָה bezeichnet hier die unbeerdigten toten Körper der Menschen. „Leichen“ ist präzise, gegenwärtig und bewahrt die Härte des Gerichtsbildes.
- source_word: לְמַאֲכָל
  choice: zum Fraß
  rationale: Bei Leichen, die von Vögeln und Landtieren gefressen werden, ist „zum Fraß werden“ eine natürliche deutsche Entsprechung und erhält die drastische Bildsprache.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: den Vögeln des Himmels
  rationale: Die kollektive Bezeichnung עוֹף wird idiomatisch als „Vögel“ wiedergegeben; „des Himmels“ wahrt das konkrete hebräische Bild.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: und den Tieren der Erde
  rationale: בְּהֵמָה bezeichnet Landtiere bzw. größere Tiere. „Tiere der Erde“ ist im modernen Deutsch natürlich und bildet die Parallelstruktur ab.
theological_decisions:
- issue: Gerichtsbild unbeerdigter, von Tieren gefressener Leichen
  choice: Die konkrete und entehrende Folge des göttlichen Gerichts bleibt ungemildert stehen.
  alternative: Das Bild allgemein als Tod oder Niederlage durch Feinde umschreiben.
  rationale: Der hebräische Text hebt nicht nur den Tod, sondern auch die schändliche Preisgabe der Leichen hervor. Dieses spannungsreiche Gerichtsbild darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die Wendungen „in die Hand geben“ und „nach dem Leben trachten“ bewahren die Bildlichkeit des Hebräischen, ohne im Deutschen gekünstelt zu wirken.
