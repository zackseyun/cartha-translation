  text: וְ/לֹ֣א פָחֲד֔וּ וְ/לֹ֥א קָרְע֖וּ אֶת בִּגְדֵי/הֶ֑ם הַ/מֶּ֨לֶךְ֙ וְ/כָל עֲבָדָ֔י/ו הַ/שֹּׁ֣מְעִ֔ים אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/024.yaml
  text: Yet neither the king nor any of his servants who heard all these words were afraid[b][a], nor did they tear their garments.
translation:
  language: de
  text: Doch weder der König noch irgendeiner seiner Diener, die all diese Worte hörten, hatten Angst, noch zerrissen sie ihre Gewänder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Zerreißen der eigenen Gewänder war im Alten Orient ein übliches Zeichen von Trauer, Entsetzen oder Reue.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא פָחֲדוּ
  choice: Doch ... erschraken
  rationale: Die Verbindung aus Konjunktion und Verneinung setzt die Erzählung mit einem deutlichen Gegensatz fort. פָּחַד bezeichnet Furcht oder Schrecken; „erschraken“ gibt hier die ausbleibende unmittelbare Reaktion natürlich wieder, ohne die Intensität zu übersteigern.
- source_word: וְלֹא קָרְעוּ אֶת־בִּגְדֵיהֶם
  choice: oder zerrissen ihre Gewänder
  rationale: Die zweite Verneinung wird im Deutschen nach „weder“ idiomatisch durch „noch“ beziehungsweise innerhalb des Prädikats durch „oder“ erfasst. „Ihre Gewänder zerreißen“ bewahrt den kulturellen und literarischen Charakter der Handlung.
- source_word: הַמֶּלֶךְ
  choice: der König
  rationale: Direkte Wiedergabe des bestimmten Substantivs.
- source_word: וְכָל־עֲבָדָיו
  choice: noch irgendeiner seiner Diener
  rationale: Unter der gemeinsamen Verneinung bedeutet כָּל hier idiomatisch „irgendeiner“. עֲבָדָיו bezeichnet im Hofkontext die Diener beziehungsweise Amtsträger des Königs; „Diener“ lässt den genauen Status offen.
- source_word: הַשֹּׁמְעִים
  choice: die ... hörten
  rationale: Das attributive Partizip kennzeichnet die Diener als diejenigen, die den Vortrag hörten. Die finite Relativsatzform ist im modernen Deutsch natürlich.
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דְּבָרִים kann „Worte“, „Dinge“ oder „Angelegenheiten“ bedeuten. Da unmittelbar vom Verlesen der Schriftrolle die Rede ist, entspricht „Worte“ dem Kontext am besten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Verneinung des Hebräischen wird mit der natürlichen deutschen Konstruktion „weder ... noch“ wiedergegeben; „Gewänder“ hält den kulturell-literarischen Ton, ohne altertümlich zu wirken.
