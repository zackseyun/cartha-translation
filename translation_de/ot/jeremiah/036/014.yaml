source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ כָל הַ/שָּׂרִ֜ים אֶל בָּר֗וּךְ אֶת יְהוּדִ֡י בֶּן נְ֠תַנְיָהוּ בֶּן שֶׁלֶמְיָ֣הוּ בֶן כּוּשִׁי֮ לֵ/אמֹר֒ הַ/מְּגִלָּ֗ה אֲשֶׁ֨ר קָרָ֤אתָ בָּ/הּ֙ בְּ/אָזְנֵ֣י הָ/עָ֔ם קָחֶ֥/נָּה בְ/יָדְ/ךָ֖ וָ/לֵ֑ךְ וַ֠/יִּקַּח בָּר֨וּךְ בֶּן נֵרִיָּ֤הוּ אֶת הַ/מְּגִלָּה֙ בְּ/יָד֔/וֹ וַ/יָּבֹ֖א אֲלֵי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
translation:
  language: de
  text: 'Da schickten alle führenden Beamten Jehudi, den Sohn Netanjas, des Sohnes Schelemjas, des Sohnes Kuschis, zu Baruch und ließen ihm sagen: »Nimm die Schriftrolle, aus der du dem Volk vorgelesen hast, in die Hand und komm[a]!« Da nahm Baruch, der Sohn Nerijas, die Schriftrolle in die Hand und kam zu ihnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und geh«. Im Deutschen sagt man bei einer Aufforderung, sich zum Sprecher zu begeben, gewöhnlich »komm«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  choice: die führenden Beamten
  rationale: שָׂר bezeichnet hier Amtsträger am königlichen Hof, nicht notwendig Prinzen im dynastischen Sinn. »Führende Beamte« gibt Rang und Verwaltungsfunktion in modernem Deutsch wieder.
- source_word: אֶת יְהוּדִי ... אֶל בָּרוּךְ
  choice: schickten ... Jehudi ... zu Baruch
  rationale: Die hebräische Konstruktion kennzeichnet Jehudi als den Gesandten und Baruch als Ziel; die deutsche Wortstellung macht dies eindeutig.
- source_word: יְהוּדִי
  choice: Jehudi
  rationale: Die anschließende Abstammungsangabe zeigt, dass hier ein Personenname und nicht die Bezeichnung »Judäer« gemeint ist.
- source_word: הַמְּגִלָּה
  choice: die Schriftrolle
  rationale: מְגִלָּה bezeichnet einen beschriebenen, aufgerollten Textträger. »Schriftrolle« ist im heutigen Deutsch klarer als bloß »Rolle«.
- source_word: קָרָאתָ בָּהּ בְּאָזְנֵי הָעָם
  choice: aus der du dem Volk vorgelesen hast
  rationale: קרא mit ב bezeichnet hier das laute Lesen aus einem Schriftstück. »Dem Volk vorgelesen« vermittelt natürlich, dass die öffentliche Lesung für das Volk hörbar war.
- source_word: קָחֶנָּה בְיָדְךָ
  choice: Nimm die Schriftrolle ... in die Hand
  rationale: Das feminine Objektsuffix bezieht sich auf die Schriftrolle. Die ausdrückliche Wiederaufnahme des Substantivs sorgt im Deutschen trotz des eingeschobenen Relativsatzes für Klarheit.
- source_word: וָלֵךְ
  choice: und komm
  rationale: Das Verb bedeutet formal »geh«. Da Baruch an den Standort der sprechenden Beamten gerufen wird, entspricht »komm« der natürlichen deutschen Perspektive; die wörtliche Alternative wird in einer Fußnote bewahrt.
- source_word: בְּיָדוֹ
  choice: in die Hand
  rationale: Die Wendung wird eng am Hebräischen wiedergegeben und greift den Wortlaut des Befehls auf, sodass Baruchs genaue Ausführung sichtbar wird.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: und kam zu ihnen
  rationale: »Kam zu ihnen« gibt die Bewegung zum zuvor genannten Ziel idiomatisch wieder.
theological_decisions: []
