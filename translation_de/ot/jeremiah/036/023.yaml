id: JER.36.23
reference: Jeremiah 36:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/קְר֣וֹא יְהוּדִ֗י שָׁלֹ֣שׁ דְּלָתוֹת֮ וְ/אַרְבָּעָה֒ יִֽקְרָעֶ֨/הָ֙ בְּ/תַ֣עַר הַ/סֹּפֵ֔ר וְ/הַשְׁלֵ֕ךְ אֶל הָ/אֵ֖שׁ אֲשֶׁ֣ר אֶל הָ/אָ֑ח עַד תֹּם֙ כָּל הַ/מְּגִלָּ֔ה עַל הָ/אֵ֖שׁ אֲשֶׁ֥ר עַל הָ/אָֽח׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
translation:
  language: de
  text: Und jedes Mal, wenn Jehudi drei oder vier Spalten[a] vorgelesen hatte, schnitt er sie mit dem Schreibermesser ab und warf sie in das Feuer im Kohlenbecken[b], bis die ganze Schriftrolle im Feuer des Kohlenbeckens verbrannt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „drei oder vier Türen“; gemeint sind hier Abschnitte der Schriftrolle, wahrscheinlich ihre Spalten oder Felder.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Feuerbecken“ beziehungsweise „Feuerstelle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּקְרֹא
  choice: jedes Mal, wenn … vorgelesen hatte
  rationale: Die Konstruktion bezeichnet im fortlaufenden Erzählzusammenhang eine wiederholte Handlung. „Vorgelesen“ entspricht der öffentlichen Lesesituation.
- source_word: יְהוּדִי
  choice: Jehudi
  rationale: Der Personenname wird nach geläufigen deutschen Umschriftkonventionen wiedergegeben.
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  choice: drei oder vier Spalten
  rationale: דְּלָתוֹת bedeutet wörtlich „Türen“, bezeichnet hier aber offenbar die aufeinanderfolgenden, türähnlichen Schriftfelder beziehungsweise Spalten einer Rolle.
- source_word: יִקְרָעֶהָ
  choice: schnitt er sie … ab
  rationale: קרע bedeutet häufig „zerreißen“. Das ausdrücklich genannte Messer weist hier jedoch auf ein Abschneiden der jeweils gelesenen Rollenabschnitte hin. Das Pronomen „er“ wahrt, wie das Hebräische, den nur implizit bezeichneten männlichen Handlungsträger.
- source_word: בְּתַעַר הַסֹּפֵר
  choice: mit dem Schreibermesser
  rationale: תַּעַר bezeichnet eine Klinge oder ein Rasiermesser; zusammen mit הַסֹּפֵר ist „Schreibermesser“ im Deutschen die natürliche Bezeichnung für das zum Bearbeiten der Rolle verwendete Werkzeug.
- source_word: וְהַשְׁלֵךְ
  choice: und warf sie
  rationale: Die Form setzt die wiederholte Handlungsfolge fort und wird in natürlichem modernem Deutsch aktiv wiedergegeben.
- source_word: הָאָח
  choice: Kohlenbecken
  rationale: אָח bezeichnet hier eine Feuerstelle beziehungsweise ein transportables Feuergefäß im Innenraum. „Kohlenbecken“ passt zum winterlichen Kontext, ohne eine fest eingebaute Feuerstelle vorauszusetzen.
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  choice: bis die ganze Schriftrolle … verbrannt war
  rationale: Die Wendung bezeichnet den Endpunkt des Vorgangs. Das Verbrennen ist durch das wiederholte Hineinwerfen ins Feuer klar impliziert und wird idiomatisch ausgedrückt.
- source_word: הַמְּגִלָּה
  choice: Schriftrolle
  rationale: מְגִלָּה ist die übliche Bezeichnung für eine beschriebene Rolle; „Schriftrolle“ ist im modernen Deutsch eindeutig.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von יִקְרָעֶהָ und וְהַשְׁלֵךְ
  choice: „er“ ohne ergänzende Identifizierung
  alternative: „der König“ oder „Jehudi“
  rationale: Die hebräischen Verbformen haben ein implizites männliches Singularsubjekt, nennen es in diesem Vers aber nicht ausdrücklich. Deshalb wird weder der König noch Jehudi als Subjekt in den Text eingefügt.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Die wiederholte Handlung wird durch „jedes Mal“ deutlich gemacht. Das nicht ausdrücklich genannte Handlungssubjekt bleibt durch „er“ unbestimmt; die Fußnoten erläutern die beiden sachlich unsicheren Bildbegriffe.
