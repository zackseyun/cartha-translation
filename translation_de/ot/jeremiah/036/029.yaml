  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
translation:
  language: de
  text: 'Über Jojakim, den König von Juda, sollst du sagen: »So spricht Jahwe: Du hast diese Schriftrolle verbrannt und gesagt: ›Warum hast du darauf geschrieben: Der König von Babel wird ganz gewiss kommen, dieses Land verwüsten und Menschen und Tiere daraus verschwinden lassen?[a]‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Mensch und Tier daraus aufhören lassen«. Die hebräische Wendung bezeichnet eine umfassende Entvölkerung des Landes.'
    reason: Die Fußnote erläutert die verursachende Bedeutung von הִשְׁבִּית sowie die formelhafte Singularverbindung אָדָם וּבְהֵמָה.
lexical_decisions:
- source_word: וְעַל
  choice: Über
  rationale: Mit dem folgenden Redeverb führt עַל den Gegenstand der Botschaft ein. „Über“ ist im Deutschen natürlich und lässt den feindlichen Inhalt aus dem Kontext hervorgehen.
- source_word: תֹּאמַר
  choice: sollst du sagen
  rationale: Das Imperfekt in instruktiver Funktion wird als verbindlicher Auftrag an Jeremia wiedergegeben.
- source_word: כֹּה אָמַר יְהוָה
  choice: So spricht Jahwe
  rationale: Bewahrt die traditionelle prophetische Botenformel und gibt den Gottesnamen ausdrücklich wieder.
- source_word: שָׂרַפְתָּ
  choice: hast ... verbrannt
  rationale: Das Perfekt bezeichnet Jojakims abgeschlossene Handlung; das deutsche Perfekt klingt in direkter Anklage natürlich.
- source_word: הַמְּגִלָּה הַזֹּאת
  choice: diese Schriftrolle
  rationale: מְגִלָּה bezeichnet ein beschriebenes, aufgerolltes Dokument; „Schriftrolle“ ist historisch und sachlich präzise.
- source_word: מַדּוּעַ כָּתַבְתָּ עָלֶיהָ
  choice: Warum hast du darauf geschrieben
  rationale: Die unmittelbare Frage und die lokale Bedeutung von עַל werden direkt und idiomatisch wiedergegeben.
- source_word: בֹּא יָבוֹא
  choice: wird ganz gewiss kommen
  rationale: Die Verbindung von Infinitivus absolutus und finitem Verb verstärkt die Gewissheit des Kommens.
- source_word: וְהִשְׁחִית
  choice: verwüsten
  rationale: Im Zusammenhang mit Land, Menschen und Tieren bezeichnet die Hifil-Form umfassende Zerstörung; „verwüsten“ passt im Deutschen besonders gut zum Land.
- source_word: וְהִשְׁבִּית מִמֶּנָּה
  choice: daraus verschwinden lassen
  rationale: Die Hifil-Form von שׁבת bedeutet hier, Menschen und Tiere aus dem Land aufhören beziehungsweise verschwinden zu lassen. Die Formulierung erhält die Verursachungsbedeutung, ohne die Art der Beseitigung enger festzulegen.
- source_word: אָדָם וּבְהֵמָה
  choice: Menschen und Tiere
  rationale: Die deutsche Paarformel gibt die umfassende Bedeutung des hebräischen Kollektivausdrucks natürlich und verständlich wieder.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ macht ihn im Deutschen als Namen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Umfang der Verwüstung in אָדָם וּבְהֵמָה
  choice: Menschen und Tiere
  alternative: Mensch und Vieh
  rationale: Die Wendung bezeichnet formelhaft die vollständige Entvölkerung. Der Plural ist im modernen Deutsch natürlich, ohne die Aussage auf einzelne Menschen oder lediglich Nutzvieh zu verengen.
- issue: Bedeutung von וְהִשְׁבִּית
  choice: verschwinden lassen
  alternative: ausrotten
  rationale: Der Ausgangstext betont das Aufhören beziehungsweise Entferntwerden aus dem Land, legt aber hier nicht ausdrücklich allein gewaltsame Tötung als Mittel fest. Die Übersetzung bewahrt diese Bedeutungsbreite.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Rede. Die verschachtelten Zitate werden durch deutsche Anführungszeichen kenntlich gemacht. „Babel“ folgt der geläufigen biblischen Namensform; „ganz gewiss“ bewahrt die hebräische Verstärkung.
