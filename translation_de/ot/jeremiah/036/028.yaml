base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/028.yaml
  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
translation:
  language: de
  text: Nimm dir noch einmal eine andere Schriftrolle[a] und schreibe darauf alle früheren Worte, die auf der ersten Schriftrolle standen, die Jojakim, der König von Juda, verbrannt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nimm dir wieder eine andere Schriftrolle.“ Das einleitende hebräische Verb bedeutet grundsätzlich „umkehren“ oder „zurückkehren“; zusammen mit „nimm“ drückt es hier idiomatisch aus, dass die Handlung erneut erfolgen soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב קַח לְךָ
  choice: Nimm dir noch einmal
  rationale: 'שׁוּב steht vor dem Imperativ קַח und hat hier adverbialen Sinn: Die Handlung soll erneut ausgeführt werden. „Nimm dir noch einmal“ gibt sowohl die Wiederholung als auch das ausdrücklich gesetzte לְךָ natürlich wieder.'
- source_word: מְגִלָּה אַחֶרֶת
  choice: eine andere Schriftrolle
  rationale: מְגִלָּה bezeichnet eine beschreibbare Rolle; „Schriftrolle“ ist im modernen Deutsch eindeutig. אַחֶרֶת bedeutet hier „eine andere“.
- source_word: וּכְתֹב עָלֶיהָ
  choice: und schreibe darauf
  rationale: Die fortgesetzte Aufforderung wird direkt wiedergegeben; „darauf“ ist für das Schreiben auf einer Schriftrolle idiomatisches Deutsch.
- source_word: אֵת כָּל הַדְּבָרִים הָרִאשֹׁנִים
  choice: alle früheren Worte
  rationale: דְּבָרִים meint in diesem Zusammenhang die Worte beziehungsweise den Inhalt der prophetischen Schriftrolle. הָרִאשֹׁנִים verweist auf die vorherige Fassung und wird daher mit „früheren“ wiedergegeben.
- source_word: אֲשֶׁר הָיוּ עַל הַמְּגִלָּה הָרִאשֹׁנָה
  choice: die auf der ersten Schriftrolle standen
  rationale: Bei geschriebenen Worten ist „auf der Schriftrolle standen“ natürliches Deutsch und bewahrt die Aussage, dass diese Worte auf der ursprünglichen Rolle vorhanden waren.
- source_word: אֲשֶׁר שָׂרַף
  choice: die … verbrannt hat
  rationale: Das Relativpronomen bezieht sich auf die erste Schriftrolle; שָׂרַף wird ohne zusätzliche Verstärkung schlicht mit „verbrannt hat“ wiedergegeben.
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: Jojakim, der König von Juda
  rationale: „Jojakim“ ist die gebräuchliche deutsche Namensform. Der Königstitel wird als klare Apposition wiedergegeben.
