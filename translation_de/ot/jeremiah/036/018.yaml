base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/018.yaml
  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
translation:
  language: de
  text: 'Da sagte Baruch zu ihnen: „Er sagte mir alle diese Worte vor[a], und ich schrieb sie mit Tinte auf die Schriftrolle.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er rief/las mir alle diese Worte aus seinem Mund vor.“ Das hebräische Verb bedeutet häufig „lesen“ oder „rufen“; hier legt der Zusammenhang mündliches Vorsprechen zum Niederschreiben nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם בָּרוּךְ
  choice: Da sagte Baruch zu ihnen
  rationale: Das Waw-Konsekutiv führt die Erzählung weiter; „Da“ gibt die zeitliche Abfolge in natürlichem deutschem Erzählstil wieder.
- source_word: מִפִּיו יִקְרָא אֵלַי
  choice: Er sagte mir ... Wort für Wort vor
  rationale: קרא bedeutet gewöhnlich „rufen“ oder „lesen“. Zusammen mit „aus seinem Mund“, dem Empfänger „mir“ und Baruchs gleichzeitigem Schreiben bezeichnet es hier mündliches Vorsprechen beziehungsweise Diktieren. „Wort für Wort vorsagen“ macht diese Funktion natürlich verständlich, ohne ausdrücklich das technischere „diktieren“ einzusetzen.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: דברים bezeichnet hier die gesprochenen und anschließend niedergeschriebenen prophetischen Worte.
- source_word: וַאֲנִי כֹּתֵב
  choice: und ich schrieb sie
  rationale: Das Partizip beschreibt Baruchs begleitende Tätigkeit. Im Deutschen gibt das Präteritum die Handlung im Erzählzusammenhang natürlich wieder; das ergänzte „sie“ verdeutlicht den Bezug auf die Worte.
- source_word: עַל הַסֵּפֶר
  choice: auf die Schriftrolle
  rationale: סֵפֶר bezeichnet in diesem Zusammenhang die beschriebene Rolle, nicht ein modernes gebundenes Buch.
- source_word: בַּדְּיוֹ
  choice: mit Tinte
  rationale: Die Präposition ב ist hier instrumental zu verstehen; „mit Tinte“ entspricht dem hebräischen Ausdruck präzise und idiomatisch.
