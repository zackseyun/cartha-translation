translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete hebräische Wendung „aus seinem Mund“ wird im Haupttext idiomatisch als „Wort für Wort vorsagen“ wiedergegeben; die ungewöhnlichere Form und die lexikalische Mehrdeutigkeit stehen in der Fußnote.
