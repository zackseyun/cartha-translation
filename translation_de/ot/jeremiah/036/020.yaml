base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/020.yaml
  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
translation:
  language: de
  text: Dann gingen sie zum König in den Hof, hinterlegten die Schriftrolle im Raum Elischamas, des Schreibers, und berichteten dem König alle Worte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „in den Ohren des Königs alle Worte“; eine Wendung für „dem König alle Worte berichten“.'
    reason: Die Fußnote dokumentiert die im Deutschen idiomatisch wiedergegebene hebräische Wendung und bewahrt zugleich die wörtliche Bezugnahme auf „alle Worte“.
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־הַמֶּלֶךְ חָצֵרָה
  choice: Dann gingen sie zum König in den Hof
  rationale: Das Narrativtempus führt die Handlung weiter; das Richtungs-ה an חָצֵר wird mit „in den Hof“ wiedergegeben. „Gingen“ entspricht im Kontext der Bewegung zum König natürlicher als „kamen“.
- source_word: וְאֶת־הַמְּגִלָּה הִפְקִדוּ
  choice: Die Schriftrolle hatten sie … verwahrt
  rationale: 'Die Voranstellung des Objekts hebt die Schriftrolle hervor. Das Plusquamperfekt gibt die naheliegende Begleitumstandslesart wieder: Vor ihrem Bericht beim König hatten sie die Rolle sicher untergebracht. „Verwahrt“ erfasst den Hifil von פקד als Hinterlegen zur sicheren Aufbewahrung.'
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע הַסֹּפֵר
  choice: im Amtsraum Elischamas, des Schreibers
  rationale: לִשְׁכָּה bezeichnet hier einen Raum innerhalb des Palastkomplexes, wahrscheinlich mit amtlicher Funktion. „Amtsraum“ ist gegenwärtiger als „Gemach“, ohne die konkrete Räumlichkeit durch „Büro“ zu modernisieren. סֹפֵר bleibt als „Schreiber“ wiedergegeben, obwohl auch eine höhere Sekretärsfunktion gemeint sein kann.
- source_word: וַיַּגִּידוּ
  choice: Darauf berichteten sie
  rationale: Der Hifil von נגד bezeichnet ein Mitteilen oder Berichten; „berichteten“ passt zum höfischen Kontext. „Darauf“ markiert den Fortgang der Erzählung.
- source_word: בְּאָזְנֵי הַמֶּלֶךְ אֵת כָּל־הַדְּבָרִים
  choice: dem König alles
  rationale: Die hebräische Wendung lautet wörtlich „in die Ohren des Königs“ und bedeutet idiomatisch, ihm etwas hörbar mitzuteilen. דְּבָרִים kann „Worte“ oder „Dinge/Angelegenheiten“ bedeuten; „alles“ bewahrt im Kontext diese Offenheit und klingt im Deutschen natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer höfischer Erzählsprache. Kurze Sätze vermeiden eine schwerfällige Reihung. „Amtsraum“ und „Schreiber“ erhalten den historischen Rahmen, ohne unnötig altertümlich zu wirken.
