  text: אוּלַ֞י תִּפֹּ֤ל תְּחִנָּתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה כִּֽי גָד֤וֹל הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל הָ/עָ֥ם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
translation:
  language: de
  text: Vielleicht kommt ihr Flehen vor Jahwe[a], und jeder kehrt von seinem bösen Weg um[b]; denn groß sind der Zorn und der Grimm, die Jahwe gegen dieses Volk angekündigt hat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Vielleicht fällt ihr Flehen vor Jahwe nieder“; gemeint ist, dass ihr Hilferuf vor ihn gelangt oder ihm vorgetragen wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht eine männliche Einzahl mit verteilender Bedeutung: „jeder Mann“ oder „ein jeder“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder formaler: „die Jahwe zu diesem Volk gesprochen hat“. Im Zusammenhang ist eine Gerichtsankündigung gegen das Volk gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Gibt die im Hebräischen ausgedrückte Hoffnung oder Möglichkeit wieder, ohne Gewissheit anzudeuten.
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  choice: ihr Flehen kommt vor Jahwe
  rationale: Bewahrt das hebräische Vor-Jahwe-Motiv in verständlichem Deutsch. Das wörtliche Bild des Niederfallens wäre im Deutschen bei einem Flehen leicht missverständlich.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Gibt den Gottesnamen als Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- source_word: וְיָשֻׁבוּ
  choice: und … kehrt … um
  rationale: „Umkehren“ erhält die Wegmetapher von שׁוב und vermeidet eine ausschließlich dogmatische Festlegung auf „Buße tun“.
- source_word: אִישׁ
  choice: jeder
  rationale: Gibt die distributive Einzahl natürlich wieder; im Deutschen trägt „jeder“ bereits die individualisierende Bedeutung von „jeder Einzelne“.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: von seinem bösen Weg
  rationale: Bewahrt die biblische Wegmetapher für die Lebensführung und gibt רָעָה direkt mit „böse“ wieder.
- source_word: גָדוֹל הָאַף וְהַחֵמָה
  choice: groß sind der Zorn und der Grimm
  rationale: Erhält beide sich verstärkenden Ausdrücke für heftigen göttlichen Zorn und bildet die vorangestellte Betonung von גָדוֹל nach.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל הָעָם הַזֶּה
  choice: die Jahwe gegen dieses Volk ausgesprochen hat
  rationale: „Ausgesprochen“ verbindet sich im Deutschen natürlich mit angekündigtem Zorn; „gegen“ bringt den Gerichtskontext zur Geltung, während die formale Alternative in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen; „Jahwe“ macht kenntlich, dass hier ein Eigenname und nicht lediglich ein Titel steht.
- issue: Umkehrsprache in וְיָשֻׁבוּ
  choice: kehrt … um
  alternative: tut Buße
  rationale: „Umkehren“ wahrt das konkrete Bild der Abwendung vom bösen Weg und legt den Ausdruck nicht auf eine spätere theologische Fachsprache fest.
- issue: Richtung der Gerichtsrede in אֶל הָעָם הַזֶּה
  choice: gegen dieses Volk
  alternative: zu diesem Volk
  rationale: Die Präposition אֶל bezeichnet formal die Richtung „zu“, doch der Zusammenhang handelt von einer angekündigten Gerichtsrede. Die Fußnote bewahrt die formale Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Flehen“, „Zorn“ und „Grimm“ halten den erhöhten biblischen Ton, bleiben aber allgemein verständlich. Die Weg- und Umkehrmetaphorik des Hebräischen wird bewahrt.
