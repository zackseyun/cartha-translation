  text: וַֽ/יְהִי֙ בַּ/שָּׁנָ֣ה הָ/רְבִיעִ֔ת לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָ֞ה הַ/דָּבָ֤ר הַ/זֶּה֙ אֶֽל יִרְמְיָ֔הוּ מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: In the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
translation:
  language: de
  text: 'Im vierten Jahr Jojakims, des Königs von Juda und Sohnes Josias, erging dieses Wort von Jahwe an Jeremia:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: '[nicht gesondert wiedergegeben]'
  rationale: Die Form eröffnet den neuen Erzählabschnitt; im modernen Deutschen wird diese Funktion durch die vorangestellte Zeitangabe natürlich ausgedrückt, ohne ein nicht ausdrücklich vorhandenes „nun“ einzufügen.
- source_word: בַּשָּׁנָה הָרְבִיעִת
  choice: Im vierten Jahr
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Jojakims, des Sohnes Josias, des Königs von Juda
  rationale: Die Appositionen bleiben sichtbar; die deutschen Genitivformen geben die Beziehungen knapp und würdig wieder.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָהוּ
  choice: erging dieses Wort … an Jeremia
  rationale: „Wort“ bewahrt die prophetische Offenbarungsformel und die Bedeutungsbreite von דָּבָר; „erging an“ ist dafür im Deutschen eine natürliche, gehobene Wendung.
- source_word: מֵאֵת יְהוָה
  choice: von Jahwe
  rationale: מֵאֵת bezeichnet den Ursprung; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Der Doppelpunkt führt die im nächsten Vers folgende direkte Rede im modernen Deutschen natürlicher ein als das formelhafte „folgendermaßen“ oder „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ macht diesen sichtbar, statt ihn durch einen Titel zu ersetzen.
- issue: Bedeutung von הַדָּבָר הַזֶּה in der prophetischen Formel
  choice: dieses Wort
  alternative: diese Botschaft
  rationale: „Wort“ erhält die konkrete Sprachgestalt und theologische Resonanz der Formel, ohne die mögliche Bedeutung vorschnell auf „Botschaft“ einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Hebräischen, wird aber durch „erging … an“ und einen Doppelpunkt am Versende idiomatisch gestaltet. Keine Fußnoten erforderlich.
