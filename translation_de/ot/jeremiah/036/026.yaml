  - severity: low
    issue: Namensformen mit Trema
    rationale: „Jerachmeël“, „Asriël“ und „Abdeël“ sind zwar verständlich, wirken aber in modernem Standarddeutsch unnötig fachtransliterierend. Formen ohne Trema sind lesbarer und verändern weder Referenz noch Bedeutung.
