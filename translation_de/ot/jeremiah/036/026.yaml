source:
  edition: WLC
  text: וַ/יְצַוֶּ֣ה הַ֠/מֶּלֶךְ אֶת יְרַחְמְאֵ֨ל בֶּן הַ/מֶּ֜לֶךְ וְ/אֶת שְׂרָיָ֣הוּ בֶן עַזְרִיאֵ֗ל וְ/אֶת שֶֽׁלֶמְיָ֨הוּ֙ בֶּֽן עַבְדְּאֵ֔ל לָ/קַ֨חַת֙ אֶת בָּר֣וּךְ הַ/סֹּפֵ֔ר וְ/אֵ֖ת יִרְמְיָ֣הוּ הַ/נָּבִ֑יא וַ/יַּסְתִּרֵ֖/ם יְהוָֽה־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
translation:
  language: de
  text: Dann befahl der König Jerachmeel, dem Sohn des Königs, Seraja, dem Sohn Asriels, und Schelemja, dem Sohn Abdeels, den Schreiber Baruch und den Propheten Jeremia zu ergreifen.[a] Doch Jahwe verbarg sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu nehmen«; im Zusammenhang: »zu ergreifen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: befahl
  rationale: Das Verb צוה bezeichnet hier einen verbindlichen königlichen Befehl; „befahl“ gibt diese Autorität knapp und natürlich wieder.
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  choice: Jerachmeël, dem Sohn des Königs
  rationale: Die ausdrückliche Verwandtschaftsbezeichnung בן המלך bleibt erhalten; die Wiedergabe als bloßer Titel „Prinz“ würde den hebräischen Wortlaut stärker deuten.
- source_word: שְׂרָיָהוּ בֶן עַזְרִיאֵל
  choice: Seraja, dem Sohn Asriëls
  rationale: Die Eigennamen werden in einer im Deutschen lesbaren Transliteration wiedergegeben; die patronymische Konstruktion wird ausdrücklich bewahrt.
- source_word: שֶׁלֶמְיָהוּ בֶּן עַבְדְּאֵל
  choice: Schelemja, dem Sohn Abdeëls
  rationale: Die Eigennamen werden transliteriert und das hebräische בן als Abstammungsangabe wiedergegeben.
- source_word: לָקַחַת
  choice: festzunehmen
  rationale: לקח bedeutet grundsätzlich „nehmen“, bezeichnet hier aber im Zusammenhang eines königlichen Zugriffs das Ergreifen der beiden Männer. „Festzunehmen“ macht den gemeinten Vorgang verständlich, ohne einen ausführlichen modernen Rechtsrahmen einzutragen.
- source_word: בָּרוּךְ הַסֹּפֵר
  choice: den Schreiber Baruch
  rationale: סֹפֵר kann einen Schreiber oder Sekretär bezeichnen. „Schreiber“ ist hier textnah und passt zu Baruchs Tätigkeit im unmittelbaren Erzählzusammenhang.
- source_word: יִרְמְיָהוּ הַנָּבִיא
  choice: den Propheten Jeremia
  rationale: נביא wird direkt mit „Prophet“ wiedergegeben; die im Deutschen geläufige Namensform „Jeremia“ wird verwendet.
- source_word: וַיַּסְתִּרֵם
  choice: verbarg sie
  rationale: Die Hifil-Form von סתר mit Objektsuffix bezeichnet, dass Jahwe beide dem Zugriff entzog beziehungsweise sie verborgen hielt. „Verbergen“ wahrt die ausdrücklich ausgesagte göttliche Handlung.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname יהוה wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen übliche Form der wissenschaftlichen Transliteration.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text nennt ausdrücklich das Tetragramm. Die Wiedergabe „Jahwe“ bewahrt den Charakter als Eigenname, statt ihn durch einen Titel zu ersetzen.
- issue: Art des göttlichen Eingreifens in וַיַּסְתִּרֵם יְהוָה
  choice: Doch Jahwe verbarg sie
  alternative: Doch Jahwe hielt sie verborgen
  rationale: Das Subjekt Jahwe und seine aktive Bewahrung werden ausdrücklich beibehalten. Der Text erklärt nicht, auf welche Weise das Verbergen geschah; diese Offenheit bleibt gewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die längere Aufzählung bleibt zur Wahrung der hebräischen Erzählstruktur erhalten; „sowie“ und die Appositionen sorgen für natürliche deutsche Lesbarkeit. Die adversative Wendung „Doch“ hebt den Gegensatz zwischen dem königlichen Befehl und Jahwes Eingreifen hervor.
