  text: וַ/יֵּ֤רֶד בֵּית הַ/מֶּ֨לֶךְ֙ עַל לִשְׁכַּ֣ת הַ/סֹּפֵ֔ר וְ/הִ֨נֵּה שָׁ֔ם כָּל הַ/שָּׂרִ֖ים יֽוֹשְׁבִ֑ים אֱלִישָׁמָ֣ע הַ/סֹּפֵ֡ר וּ/דְלָיָ֣הוּ בֶן שְׁ֠מַעְיָהוּ וְ/אֶלְנָתָ֨ן בֶּן עַכְבּ֜וֹר וּ/גְמַרְיָ֧הוּ בֶן שָׁפָ֛ן וְ/צִדְקִיָּ֥הוּ בֶן חֲנַנְיָ֖הוּ וְ/כָל הַ/שָּׂרִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: de
  text: 'Er ging hinab zum Königspalast, in das Amtszimmer des Schreibers. Dort saßen alle führenden Beamten: Elischama, der Schreiber, Delaja, Sohn Schemajas, Elnatan, Sohn Achbors, Gemarja, Sohn Schafans, Zedekia, Sohn Hananjas, und alle führenden Beamten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  choice: Königspalast
  rationale: Wörtlich »Haus des Königs«; im Kontext bezeichnet die Wendung den königlichen Palast beziehungsweise Verwaltungssitz.
- source_word: לִשְׁכַּת הַסֹּפֵר
  choice: zum Amtsraum des Schreibers
  rationale: לִשְׁכָּה bezeichnet einen Raum oder ein Amtsgemach innerhalb eines Gebäudekomplexes; »Amtsraum« ist natürlich und wahrt den Verwaltungskontext.
- source_word: וְהִנֵּה
  choice: Dort … gerade
  rationale: Die präsentative Funktion wird in natürlichem modernem Deutsch wiedergegeben, ohne das heute oft künstlich klingende »siehe«.
- source_word: הַשָּׂרִים
  choice: führenden Beamten
  rationale: שָׂרִים bezeichnet hier hohe königliche Amtsträger, nicht notwendig militärische oder erbliche »Fürsten«.
- source_word: וְכָל הַשָּׂרִים
  choice: und alle übrigen führenden Beamten
  rationale: Nach der Namensliste macht »übrigen« im Deutschen deutlich, dass weitere Amtsträger anwesend waren; es ist kontextuell impliziert.
theological_decisions: []
