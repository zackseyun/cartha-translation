source:
  edition: WLC
  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
translation:
  language: de
  text: Da nahm Jeremia eine andere Schriftrolle und gab sie dem Schreiber Baruch, dem Sohn Nerijas. Dieser schrieb darauf nach Jeremias Diktat[a] alle Worte der Schriftrolle, die Jojakim, der König von Juda, im Feuer verbrannt hatte. Außerdem wurden ihnen noch viele ähnliche Worte hinzugefügt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Mund Jeremias“.'
    reason: Die Fußnote bewahrt die anschauliche hebräische Formulierung hinter der idiomatischen Wiedergabe „nach Jeremias Diktat“.
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  choice: eine andere Schriftrolle
  rationale: מְגִלָּה bezeichnet hier konkret eine beschreibbare Rolle; „Schriftrolle“ ist im modernen Deutschen eindeutig und historisch passend. אַחֶרֶת bedeutet „eine andere“.
- source_word: וַיִּתְּנָהּ אֶל בָּרוּךְ
  choice: gab sie ... Baruch
  rationale: נתן mit אֶל bezeichnet schlicht das Geben an eine Person. Die deutsche Wortstellung bleibt natürlich und neutral.
- source_word: הַסֹּפֵר
  choice: der Schreiber
  rationale: סֹפֵר kann einen berufsmäßigen Schreiber oder Sekretär bezeichnen. „Schreiber“ wahrt den historischen Charakter, ohne ein modernes Verwaltungsamt nahezulegen.
- source_word: וַיִּכְתֹּב עָלֶיהָ
  choice: Dieser schrieb darauf
  rationale: Das nächstliegende Subjekt ist Baruch. „Dieser“ beseitigt im Deutschen eine mögliche pron nominale Unklarheit; עַל bezeichnet die Schriftrolle als Schreibfläche.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: nach Jeremias Diktat
  rationale: Wörtlich lautet die Wendung „aus dem Mund Jeremias“; idiomatisch bezeichnet sie hier das Schreiben nach mündlicher Ansage. Die wörtliche Bildform wird in der Fußnote bewahrt.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: alle Worte der Schriftrolle
  rationale: סֵפֶר kann „Buch“ oder „Schriftstück“ bedeuten; im unmittelbaren Zusammenhang ist dieselbe konkrete Rolle gemeint. „Worte“ gibt דְּבָרִים formal wieder.
- source_word: אֲשֶׁר שָׂרַף ... בָּאֵשׁ
  choice: die ... im Feuer verbrannt hatte
  rationale: Die deutsche Vorvergangenheit kennzeichnet das Verbrennen als vorausgehendes Ereignis; „im Feuer“ entspricht בָּאֵשׁ natürlich.
- source_word: וְעוֹד נוֹסַף עֲלֵיהֶם
  choice: Außerdem wurden ihnen noch ... hinzugefügt
  rationale: Das Nifal von יסף ist passiv. „Außerdem ... noch“ gibt die ergänzende Bedeutung von וְעוֹד wieder.
- source_word: דְּבָרִים רַבִּים כָּהֵמָּה
  choice: viele ähnliche Worte
  rationale: כָּהֵמָּה bedeutet „wie sie/ihnen ähnlich“. „Ähnliche“ ist im Deutschen flüssig und lässt offen, worin die Ähnlichkeit bestand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. „Schriftrolle“ und „Schreiber“ wahren das historische Milieu; kurze Sätze vermeiden eine schwerfällige Kettenstruktur. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
