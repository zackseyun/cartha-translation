  text: וַ/יַּ֗עַשׂ בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יִרְמְיָ֣הוּ הַ/נָּבִ֑יא לִ/קְרֹ֥א בַ/סֵּ֛פֶר דִּבְרֵ֥י יְהוָ֖ה בֵּ֥ית יְהֹוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: de
  text: 'Baruch, der Sohn Nerijas, tat alles, was der Prophet Jeremia ihm befohlen hatte: Er las im Haus des HERRN aus der Schriftrolle die Worte des HERRN vor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֵפֶר
  choice: Schriftrolle
  rationale: Im gegebenen historischen Zusammenhang bezeichnet das Wort den beschriebenen Rollenband, nicht ein modernes gebundenes Buch.
- source_word: לִקְרֹא
  choice: Er las … vor
  rationale: Der Infinitiv bezeichnet den Inhalt des Auftrags; im Deutschen gibt ein neuer Hauptsatz die ausgeführte öffentliche Lesung natürlich und eindeutig wieder.
- source_word: בֵּית יְהוָה
  choice: Haus des HERRN
  rationale: Die traditionelle und verständliche Wiedergabe bewahrt die wörtliche Tempelbezeichnung des Hebräischen.
- source_word: יְהוָה
  choice: der HERR
  rationale: Die etablierte deutsche Bibelkonvention kennzeichnet den Gottesnamen durch Kapitälchen und entspricht der vorgelegten redaktionellen Entscheidung.
theological_decisions:
- issue: Bezug und Funktion des Infinitivs לִקְרֹא
  choice: 'Als ausgeführter Inhalt des Befehls: „Er las … vor.“'
  alternative: „…, um … vorzulesen“ oder „…, nämlich … vorzulesen“
  rationale: Der Vers berichtet, dass Baruch den gesamten Auftrag Jeremias ausführte. Die Hauptsatzform vermeidet im Deutschen den möglichen Eindruck, nur ein Zweck, nicht aber die tatsächliche Ausführung werde genannt, ohne die Aussage theologisch zu erweitern.
- issue: Wiedergabe des Tetragramms
  choice: HERR
  alternative: JHWH oder Jahwe
  rationale: Die konventionelle Wiedergabe wahrt die jüdisch-christliche Lesetradition und folgt der ausdrücklich dokumentierten Revision, ohne eine bestimmte Aussprache festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vorlesen“ macht die öffentliche mündliche Darbietung deutlich; die Wiederholung „des HERRN“ bewahrt die markante Formulierung des Ausgangstextes.
