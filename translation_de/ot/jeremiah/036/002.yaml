id: JER.36.2
reference: Jeremiah 36:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
translation:
  language: de
  text: Nimm dir eine Schriftrolle und schreibe darauf alle Worte, die ich zu dir geredet habe über Israel, über Juda und über alle Völker[a] – von dem Tag an, als ich zu dir redete, von den Tagen Josias bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen Israel, gegen Juda und gegen alle Völker“. Die hebräische Präposition kann in prophetischen Zusammenhängen sowohl „über/betreffend“ als auch „gegen“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח לְךָ
  choice: Nimm dir
  rationale: Der Imperativ mit לְךָ drückt persönliche Beteiligung aus; „Nimm dir“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: מְגִלַּת סֵפֶר
  choice: eine Schriftrolle
  rationale: Die Konstruktverbindung bezeichnet eine zum Beschreiben bestimmte Rolle. „Schriftrolle“ ist die natürliche moderne Entsprechung, ohne die hebräische Formulierung unnötig wörtlich nachzubilden.
- source_word: וְכָתַבְתָּ אֵלֶיהָ
  choice: und schreibe darauf
  rationale: Das Perfekt mit vorangestelltem וְ setzt den Imperativ fort. „Darauf“ bezieht sich eindeutig auf die Schriftrolle.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alle Worte
  rationale: דְּבָרִים kann auch „Dinge“ oder „Angelegenheiten“ bedeuten; im Zusammenhang prophetischer Niederschrift steht jedoch die sprachliche Offenbarung im Vordergrund.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֵלֶיךָ
  choice: die ich zu dir geredet habe
  rationale: „Zu dir geredet“ bewahrt die Ausrichtung der göttlichen Rede auf Jeremia und passt zum gehobenen, aber verständlichen Register.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  choice: über Israel, über Juda und über alle Völker
  rationale: עַל kann hier „über“ beziehungsweise „betreffend“, in prophetischen Gerichtszusammenhängen aber auch „gegen“ bedeuten. „Über“ ist im zusammenfassenden Kontext weniger einengend; die Wiederholung erhält Rhythmus und Struktur des Hebräischen.
- source_word: כָּל הַגּוֹיִם
  choice: alle Völker
  rationale: גּוֹיִם bezeichnet hier die Völker beziehungsweise Nationen außerhalb Israels; „Völker“ ist im Deutschen natürlich und vermeidet spätere religiöse Konnotationen von „Heiden“.
- source_word: מִיּוֹם דִּבַּרְתִּי אֵלֶיךָ
  choice: von dem Tag an, als ich zu dir redete
  rationale: מִן kennzeichnet den zeitlichen Ausgangspunkt. Die Formulierung wahrt die rückblickende Einzelangabe, ohne sie mit der folgenden historischen Präzisierung zu verschmelzen.
- source_word: מִימֵי יֹאשִׁיָּהוּ וְעַד הַיּוֹם הַזֶּה
  choice: von den Tagen Josias bis zum heutigen Tag
  rationale: Die Wendung bewahrt Anfang und Endpunkt der Zeitspanne sowie die enge Wiederholung von „von“, die den vorherigen Ausdruck näher bestimmt.
theological_decisions:
- issue: Bedeutung von עַל bei Israel, Juda und allen Völkern
  choice: über Israel, über Juda und über alle Völker
  alternative: gegen Israel, gegen Juda und gegen alle Völker
  rationale: Der Vers fasst sämtliche Worte zusammen, die Jeremia über einen langen Zeitraum empfangen hat. Da diese nicht ausschließlich Gerichtsworte umfassen müssen, lässt „über“ die Aussage bewusst weiter. Die mögliche feindliche beziehungsweise gerichtliche Bedeutung wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem hebräischen Ablauf, wird jedoch durch einen Gedankenstrich vor der Zeitangabe lesbarer gemacht. Die doppelte zeitliche Ausgangsangabe bleibt als echte Struktur des Ausgangstextes erhalten.
