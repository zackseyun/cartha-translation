    issue: Doppelte Lesehandlung und zusätzliche Zustandsaussage
    rationale: 'Das Hebräische hat nur eine Hauptaussage: Baruch las. Die Formulierung „Baruch las … vor. Er befand sich … und las …“ wiederholt die Handlung und macht aus der Ortsangabe eine zusätzliche, nicht eigens behauptete Aussage.'
  - severity: medium
    issue: Anbindung des Titels „der Schreiber“
    rationale: „Gemarjas, des Sohnes des Schreibers Schafan“ ist zwar verständlich, aber die Zuordnung lässt sich natürlicher und eindeutig als „Schafan, dem Schreiber“ markieren. Damit folgt die Übersetzung der üblichen Analyse von שָׁפָן הַסֹּפֵר.
