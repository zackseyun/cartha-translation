revisions:
- from: Baruch las im Haus Jahwes[a] aus der Schriftrolle die Worte Jeremias vor. Er befand sich in der Kammer Gemarjas, des Sohnes des Schreibers Schafan, im oberen Vorhof, am Eingang des neuen Tores des Hauses Jahwes, und las vor dem ganzen Volk.
  to: Baruch las im Haus Jahwes[a], in der Kammer Gemarjas, des Sohnes Schafans, des Schreibers, im oberen Vorhof, am Eingang des neuen Tores des Hauses Jahwes, aus der Schriftrolle die Worte Jeremias vor dem ganzen Volk vor.
  rationale: Die Revision stellt die einmalige Lesehandlung des hebräischen Satzes wieder her, ohne eine zusätzliche Aussage über Baruchs Aufenthaltszustand einzuführen. Die zahlreichen Ortsangaben bleiben vollständig erhalten. Der Titel „der Schreiber“ wird durch die appositionelle Stellung eindeutig mit Schafan verbunden. Die Fußnote bleibt sachlich und korrekt verankert.
