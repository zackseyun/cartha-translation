source:
  edition: WLC
  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
translation:
  language: de
  text: Baruch las im Haus Jahwes[a], in der Kammer Gemarjas, des Sohnes Schafans, des Schreibers, im oberen Vorhof, am Eingang des neuen Tores des Hauses Jahwes, aus der Schriftrolle die Worte Jeremias vor dem ganzen Volk vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Tempel Jahwes«.'
    reason: בֵּית יְהוָה bedeutet wörtlich „Haus Jahwes“, bezeichnet hier aber den Tempel beziehungsweise die Tempelanlage.
lexical_decisions:
- source_word: וַיִּקְרָא ... בַּסֵּפֶר
  choice: las ... aus der Schriftrolle ... vor
  rationale: קרא bezeichnet hier das laute Vorlesen eines schriftlichen Textes. „Aus der Schriftrolle vorlesen“ gibt sowohl den historischen Gegenstand als auch die öffentliche Hörsituation natürlich wieder.
- source_word: דִּבְרֵי יִרְמְיָהוּ
  choice: die Worte Jeremias
  rationale: Die Formulierung bewahrt die hebräische Genitivverbindung und den prophetischen Sprachklang.
- source_word: בֵּית יְהוָה
  choice: Haus Jahwes
  rationale: Die wörtliche Wendung „Haus Jahwes“ bleibt erhalten; im Zusammenhang ist damit der Tempel beziehungsweise die Tempelanlage gemeint. Die deutsche Namensform „Jahwe“ gibt das Tetragramm ausdrücklich wieder.
- source_word: בְּלִשְׁכַּת
  choice: in der Kammer
  rationale: לִשְׁכָּה bezeichnet einen Raum innerhalb der Tempelanlage, häufig mit amtlicher Nutzung. „Kammer“ passt zum architektonischen Zusammenhang.
- source_word: גְּמַרְיָהוּ בֶן שָׁפָן הַסֹּפֵר
  choice: Gemarjas, des Sohnes des Schreibers Schafan
  rationale: Die Formulierung ordnet den Titel הַסֹּפֵר aufgrund seiner unmittelbaren Stellung Schafan zu und gibt die Abstammungsangabe klar wieder.
- source_word: בֶּחָצֵר הָעֶלְיוֹן
  choice: im oberen Vorhof
  rationale: חָצֵר bezeichnet hier einen Hof der Tempelanlage; „Vorhof“ ist im Deutschen für diesen sakralarchitektonischen Bereich geläufig.
- source_word: פֶּתַח שַׁעַר ... הֶחָדָשׁ
  choice: am Eingang des neuen Tores
  rationale: Die räumliche Angabe wird eng am Hebräischen und zugleich idiomatisch wiedergegeben.
- source_word: בְּאָזְנֵי כָּל הָעָם
  choice: vor dem ganzen Volk
  rationale: Die wörtliche Wendung „in den Ohren“ bezeichnet öffentliches, für alle vernehmbares Vorlesen. „Vor dem ganzen Volk“ gibt diese Funktion in natürlichem Deutsch wieder; das Verb „vorlesen“ macht die Hörbarkeit ausdrücklich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als „Jahwe“ wiedergegeben, statt ihn durch einen Titel zu ersetzen. Dies bewahrt den Charakter des hebräischen Gottesnamens; „Jahwe“ ist die geläufige deutsche Form.
- issue: Bedeutung von בֵּית יְהוָה
  choice: Haus Jahwes
  alternative: Tempel Jahwes
  rationale: „Haus Jahwes“ erhält die konkrete hebräische Ausdrucksweise. Da im Kontext die Tempelanlage gemeint ist, wird „Tempel Jahwes“ als sachlich zutreffende Alternative in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange hebräische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert, ohne Angaben auszulassen. „Vorlesen“ macht den öffentlichen Vortrag deutlich; Eigennamen folgen geläufigen deutschen Transliterationen.
