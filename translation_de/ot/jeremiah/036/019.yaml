source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ אֶל בָּר֔וּךְ לֵ֥ךְ הִסָּתֵ֖ר אַתָּ֣ה וְ/יִרְמְיָ֑הוּ וְ/אִ֥ישׁ אַל יֵדַ֖ע אֵיפֹ֥ה אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/019.yaml
  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: de
  text: 'Da sagten die führenden Beamten zu Baruch: »Geh und versteck dich, du und Jeremia! Niemand soll wissen, wo ihr seid.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Da sagten
  rationale: Das narrative וַ führt die Handlung weiter. »Da sagten« gibt die zeitlich-folgernde Erzählbewegung in natürlichem Deutsch wieder.
- source_word: הַשָּׂרִים
  choice: die führenden Beamten
  rationale: שׂרים bezeichnet hier hochgestellte Amtsträger der königlichen Verwaltung. »Führende Beamte« ist modern und macht ihren Rang deutlicher als das alleinstehende »Beamte«; »Fürsten« wäre im heutigen Deutsch missverständlich.
- source_word: לֵךְ הִסָּתֵר
  choice: Geh und versteck dich
  rationale: Die beiden Imperative werden als natürliche deutsche Befehlsfolge wiedergegeben. Der Nifal-Imperativ von סתר bezeichnet hier das Sichverbergen.
- source_word: אַתָּה וְיִרְמְיָהוּ
  choice: du und Jeremia
  rationale: Das ausdrücklich gesetzte Pronomen betont, dass der Befehl sowohl Baruch als auch Jeremia gilt; die Formulierung bewahrt diese Struktur.
- source_word: וְאִישׁ אַל יֵדַע
  choice: Niemand soll wissen
  rationale: אישׁ wird unter der Verneinung indefinit gebraucht. Die Soll-Konstruktion gibt den prohibitiv-jussivischen Sinn idiomatisch wieder, ohne eine zusätzliche Verursachungsbedeutung einzutragen.
- source_word: אֵיפֹה אַתֶּם
  choice: wo ihr seid
  rationale: Das pluralische אַתֶּם bezieht sich auf Baruch und Jeremia; »ihr« bildet diesen Numerus im Deutschen eindeutig ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Rede. Die Amtsbezeichnung ist kontextgerecht und nicht archaisierend; die ausdrückliche Einbeziehung Jeremias bleibt erhalten.
