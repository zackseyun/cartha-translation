  to: Vielleicht wird das Haus Juda von all dem Unheil hören, das ich über sie zu bringen gedenke[a], damit jeder von seinem bösen Weg umkehrt[b], und ich werde ihnen ihre Schuld und ihre Sünde vergeben.
  rationale: Die Revision stellt die finale Funktion von לְמַעַן mit „damit“ wieder her, entfernt die nicht ausdrücklich markierte Folgerung „Dann“ und verwendet eine im Deutschen idiomatischere Zukunftsform. Die Aussage und ihre theologische Offenheit bleiben unverändert; die Fußnotenanker bleiben an den entsprechenden Quellphrasen.
