source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
translation:
  language: de
  text: Vielleicht wird das Haus Juda von all dem Unheil hören, das ich über sie zu bringen gedenke[a], damit jeder von seinem bösen Weg umkehrt[b], und ich werde ihnen ihre Schuld und ihre Sünde vergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „all das Böse/Unglück, das ich ihnen zu tun gedenke“. Gemeint ist hier das angekündigte Gericht über Juda, nicht dass Gott moralisch Böses tut.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „ein jeder von seinem bösen Weg“. Der Singular bezeichnet die einzelnen Angehörigen Judas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Vielleicht
  rationale: Bewahrt den offenen, hoffnungsvollen Möglichkeitscharakter, ohne Gewissheit auszudrücken.
- source_word: יִשְׁמְעוּ
  choice: hört ... von
  rationale: Gibt das Wahrnehmen der angekündigten Botschaft natürlich wieder; die erhoffte Reaktion wird erst im folgenden Zwecksatz ausgedrückt.
- source_word: בֵּית יְהוּדָה
  choice: das Haus Juda
  rationale: Erhält die korporative und bundestheologische Ausdrucksweise des Hebräischen.
- source_word: אֵת כָּל הָרָעָה
  choice: von all dem Unheil
  rationale: רָעָה bezeichnet hier das angekündigte Gericht bzw. die Katastrophe, nicht moralisch Böses in Gott.
- source_word: חֹשֵׁב לַעֲשׂוֹת לָהֶם
  choice: das ich über sie zu bringen gedenke
  rationale: חֹשֵׁב mit Infinitiv bezeichnet Absicht oder Planung; „gedenke“ ist würdig und im modernen Standarddeutsch verständlich.
- source_word: לְמַעַן יָשׁוּבוּ
  choice: sodass ... umkehrt
  rationale: Bewahrt die Zielrichtung der Aussage und die prophetische Umkehrmetaphorik, ohne sie durch den theologischen Fachbegriff „Buße tun“ zu ersetzen.
- source_word: אִישׁ מִדַּרְכּוֹ הָרָעָה
  choice: jeder von seinem bösen Weg
  rationale: „Jeder“ gibt das distributive אִישׁ natürlich wieder; „von seinem bösen Weg“ bewahrt Bild und Singularstruktur.
- source_word: וְסָלַחְתִּי
  choice: Dann werde ich ... vergeben
  rationale: „Dann“ macht die im Satzablauf erkennbare Folge im Deutschen deutlich, ohne eine zusätzliche dogmatische Bedingungslehre einzutragen.
- source_word: לַעֲוֺנָם וּלְחַטָּאתָם
  choice: ihre Schuld und ihre Sünde
  rationale: Bewahrt die zwei Begriffe; „Schuld“ kann bei עָוֹן sowohl Verfehlung als auch daraus erwachsende Schuld anklingen lassen.
theological_decisions:
- issue: Bedeutung von רָעָה beim angekündigten göttlichen Gericht
  choice: Unheil
  alternative: Böses; Unglück
  rationale: Im Kontext bezeichnet das Wort die von Gott angedrohte Gerichtskatastrophe und nicht moralisches Böses. „Unheil“ erhält zugleich die Schärfe der Aussage.
- issue: Repräsentativer Singular אִישׁ
  choice: jeder ... seinem
  alternative: jeder Mann; alle ... ihrem
  rationale: „Jeder“ bewahrt den distributiven Singular und umfasst in natürlichem Deutsch die einzelnen Angehörigen Judas, ohne die Aussage unnötig auf erwachsene Männer zu begrenzen.
- issue: Verhältnis von Umkehr und Vergebung
  choice: Sodass ... umkehrt. Dann werde ich ... vergeben.
  alternative: damit ... umkehrt, und ich werde ... vergeben
  rationale: Die Abfolge des Hebräischen bleibt erkennbar, ohne über den Text hinaus festzulegen, wie Umkehr und Vergebung systematisch-theologisch zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haus Juda“ bewahrt die korporative Redeweise; „gedenke“ hebt den prophetischen Ton leicht an, bleibt aber allgemein verständlich. Die Satzteilung verhindert einen überlangen deutschen Satz und lässt die Folge von Umkehr und Vergebung klar hervortreten.
