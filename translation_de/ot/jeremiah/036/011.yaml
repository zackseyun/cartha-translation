source:
  edition: WLC
  text: וַ֠/יִּשְׁמַ֗ע מִכָ֨יְהוּ בֶן גְּמַרְיָ֧הוּ בֶן שָׁפָ֛ן אֶת כָּל דִּבְרֵ֥י יְהוָ֖ה מֵ/עַ֥ל הַ/סֵּֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/011.yaml
  text: And Micaiah son of Gemariah[a], son of Shaphan, heard all the words of Yahweh from the scroll.
translation:
  language: de
  text: Und Michaja, der Sohn Gemarjas und Enkel Schafans, hörte alle Worte Jahwes[a] aus der Schriftrolle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: JHWH; traditionell mit »der HERR« wiedergegeben.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Und … hörte
  rationale: Das Wayyiqtol führt die vergangene Erzählung fort. »Hörte« gibt שׁמע hier natürlich wieder und bezeichnet das Wahrnehmen der aus der Schriftrolle vorgelesenen Worte.
- source_word: מִכָיְהוּ
  choice: Michaja
  rationale: Die etablierte deutsche Namensform ist verständlich und entspricht der hebräischen Kurzform des Namens.
- source_word: בֶן גְּמַרְיָהוּ בֶן שָׁפָן
  choice: der Sohn Gemarjas und Enkel Schafans
  rationale: Die Verwandtschaftskette wird in natürlichem Deutsch präzise wiedergegeben; das zweite בֶן bezeichnet hier Michajas Großvater.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: alle Worte Jahwes
  rationale: »Alle Worte« bewahrt sowohl die umfassende Bedeutung von כָּל als auch die konkrete Mehrzahl von דִּבְרֵי. Der Gottesname wird als »Jahwe« wiedergegeben.
- source_word: מֵעַל הַסֵּפֶר
  choice: aus der Schriftrolle
  rationale: Die Wendung bezeichnet die Schriftrolle als Quelle des Gehörten beziehungsweise des Vorgelesenen. »Schriftrolle« passt zum historischen Schreibmedium besser als »Buch«.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Ausgangstext enthält den Eigennamen JHWH. »Jahwe« bewahrt diesen als persönlichen Gottesnamen; die traditionelle deutsche Ersatzwiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Angabe ist idiomatisch als »Sohn … und Enkel …« formuliert; die konkrete Rede von »Worten« und »Schriftrolle« bleibt erhalten.
