  text: The king was sitting in the winter house in the ninth month[a], with the brazier burning before him.
translation:
  language: de
  text: Der König saß im Winterhaus im neunten Monat; vor ihm brannte das Feuerbecken[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kohlenbecken; das hebräische Wort bezeichnet hier ein Gefäß mit Feuer oder glühenden Kohlen, das zum Wärmen diente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Der König
  rationale: Die bestimmte Form wird direkt wiedergegeben. Das einleitende ו ist hier ein erzählerischer Anschluss und muss im Deutschen nicht eigens mit „und“ übersetzt werden.
- source_word: יוֹשֵׁב
  choice: saß
  rationale: Das Partizip beschreibt den andauernden Zustand des Königs innerhalb der Szene; das deutsche Präteritum „saß“ gibt dies natürlich wieder.
- source_word: בֵּית הַחֹרֶף
  choice: im Winterhaus
  rationale: Wörtlich „Haus des Winters“; gemeint ist der für die kalte Jahreszeit genutzte Teil der königlichen Residenz. „Winterhaus“ bleibt nahe an der hebräischen Ausdrucksweise, ohne „Palast“ zusätzlich einzutragen.
- source_word: בַּחֹדֶשׁ הַתְּשִׁיעִי
  choice: denn es war der neunte Monat
  rationale: Die Zeitangabe wird als natürliche deutsche Hintergrundinformation formuliert. „Neunter Monat“ bewahrt die biblische Monatszählung.
- source_word: וְאֶת הָאָח לְפָנָיו
  choice: Vor ihm … ein Feuerbecken
  rationale: Die hebräische Begleitumstandsangabe wird im Deutschen als eigener Satz wiedergegeben. Der bestimmte Artikel kann kontextgerecht mit dem einführenden „ein“ wiedergegeben werden, da das Gefäß hier erstmals genannt wird.
- source_word: הָאָח
  choice: Feuerbecken
  rationale: Das seltene Wort bezeichnet hier ein Gefäß beziehungsweise Becken mit Feuer oder glühenden Kohlen, das zum Wärmen diente. „Feuerbecken“ ist verständlich und vermeidet die Vorstellung eines fest eingebauten Kamins.
- source_word: מְבֹעָרֶת
  choice: brannte
  rationale: Das feminine Partizip beschreibt das Feuerbecken als brennend; „brannte“ ist im Deutschen die natürliche Formulierung.
