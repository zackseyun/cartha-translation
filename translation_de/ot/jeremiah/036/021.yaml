  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ אֶת יְהוּדִ֗י לָ/קַ֨חַת֙ אֶת הַ/מְּגִלָּ֔ה וַ/יִּ֨קָּחֶ֔/הָ מִ/לִּשְׁכַּ֖ת אֱלִישָׁמָ֣ע הַ/סֹּפֵ֑ר וַ/יִּקְרָאֶ֤/הָ יְהוּדִי֙ בְּ/אָזְנֵ֣י הַ/מֶּ֔לֶךְ וּ/בְ/אָזְנֵי֙ כָּל הַ/שָּׂרִ֔ים הָ/עֹמְדִ֖ים מֵ/עַ֥ל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
translation:
  language: de
  text: Da schickte der König Jehudi, um die Schriftrolle zu holen. Er holte sie aus dem Amtsraum Elischamas, des Schreibers.[a] Dann las Jehudi sie dem König und allen führenden Beamten vor, die beim König standen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schreiber“ kann im königlichen Verwaltungszusammenhang auch „Sekretär“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die über dem König standen“; gemeint sind wahrscheinlich Amtsträger, die bei ihm standen oder ihm aufwarteten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: schickte
  rationale: Die übliche neuhochdeutsche Erzählform für das Wayyiqtol von שׁלח.
- source_word: יְהוּדִי
  choice: Jehudi
  rationale: Der Personenname wird nach gängiger deutscher Bibeltradition transliteriert.
- source_word: לָקַחַת אֶת הַמְּגִלָּה
  choice: um die Schriftrolle zu holen
  rationale: Der Infinitiv bezeichnet den Zweck des Sendens; „holen“ gibt den Vorgang im Kontext natürlich wieder, während „Schriftrolle“ מְגִלָּה klar bezeichnet.
- source_word: וַיִּקָּחֶהָ
  choice: Er holte sie
  rationale: Das feminine Pronomen verweist auf die Schriftrolle; „holte“ stellt den Bezug zum erteilten Auftrag her.
- source_word: מִלִּשְׁכַּת
  choice: aus dem Amtsraum
  rationale: לִשְׁכָּה bezeichnet hier einen Raum innerhalb des königlichen Verwaltungsbereichs; „Amtsraum“ macht den Hofkontext verständlich, ohne ein modernes Einzelbüro vorauszusetzen.
- source_word: אֱלִישָׁמָע הַסֹּפֵר
  choice: Elischamas, des Schreibers
  rationale: Der Name folgt der geläufigen deutschen Form. סֹפֵר kann einen Schreiber oder königlichen Sekretär bezeichnen; „Schreiber“ bewahrt die lexikalische Offenheit.
- source_word: וַיִּקְרָאֶהָ ... בְּאָזְנֵי
  choice: las ... vor
  rationale: קרא mit einem Schriftstück und die Wendung „in den Ohren von“ bezeichnen hier hörbares Vorlesen; das deutsche Verb „vorlesen“ gibt beides idiomatisch wieder.
- source_word: הַשָּׂרִים
  choice: führenden Beamten
  rationale: שׂרים meint im königlichen Hofkontext hochrangige Amtsträger, nicht notwendig Fürstensöhne. „Führende Beamte“ ist modern und sachgerecht.
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  choice: die beim König standen
  rationale: Die wörtlich schwierige räumliche Wendung bedeutet im Hofkontext wahrscheinlich, dass die Amtsträger nahe beim König standen bzw. ihm aufwarteten; „beim“ vermeidet eine falsche Vorstellung von Überordnung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer höfischer Verwaltungssprache. Das doppelte „in den Ohren von“ wird durch das natürliche deutsche „vorlesen“ gebündelt; die beiden Adressatengruppen bleiben ausdrücklich genannt. Die Satzfolge und die handelnden Personen bleiben gegenüber dem Hebräischen transparent.
