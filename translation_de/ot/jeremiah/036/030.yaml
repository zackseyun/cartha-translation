source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
translation:
  language: de
  text: 'Darum spricht Jahwe so über Jojakim, den König von Juda: Er wird niemanden haben, der auf dem Thron Davids sitzt. Sein Leichnam wird hinausgeworfen und der Hitze[a] am Tag sowie dem Frost in der Nacht ausgesetzt sein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Trockenheit“ beziehungsweise „der Dürre“. Das hebräische Wort kann Hitze, Trockenheit oder Dürre bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Darum
  rationale: Kennzeichnet die folgende Gerichtsankündigung als Konsequenz aus dem vorangehenden Geschehen und klingt im modernen Deutschen natürlich.
- source_word: כֹּה אָמַר יְהוָה
  choice: so spricht Jahwe
  rationale: Bewahrt die feste prophetische Botenformel und gibt den Gottesnamen ausdrücklich wieder.
- source_word: עַל יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: über Jojakim, den König von Juda
  rationale: עַל bezeichnet hier den Gegenstand des Gerichtswortes; „über“ lässt dessen feindlichen Charakter aus dem Kontext hervorgehen, ohne die Präposition mit „gegen“ zu verengen.
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  choice: Er wird niemanden haben, der auf dem Thron Davids sitzt
  rationale: Gibt die hebräische Besitzkonstruktion verständlich wieder, ohne das im Kontext naheliegende, aber nicht ausdrücklich genannte Wort „Nachkomme“ einzufügen.
- source_word: נִבְלָתוֹ
  choice: sein Leichnam
  rationale: „Leichnam“ ist im Deutschen klar, würdig und zugleich deutlich genug, um die Schändung des unbegrabenen Körpers auszudrücken.
- source_word: מֻשְׁלֶכֶת
  choice: wird hinausgeworfen werden
  rationale: Die passive Form bezeichnet ein verächtliches Wegwerfen beziehungsweise Hinauswerfen; die gewählte Formulierung bewahrt dieses konkrete Bild.
- source_word: לַחֹרֶב בַּיּוֹם
  choice: am Tag der Hitze preisgegeben
  rationale: חֹרֶב kann Hitze, Trockenheit oder Dürre bezeichnen. Im Parallelismus mit dem nächtlichen Frost steht hier die ungeschützte Aussetzung des Leichnams an extreme Witterung im Vordergrund.
- source_word: לַקֶּרַח בַּלָּיְלָה
  choice: in der Nacht dem Frost preisgegeben
  rationale: קֶרַח bezeichnet konkret Eis oder Frost; „Frost“ erhält das anschauliche Gegenbild zur Hitze des Tages.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen Gottes. „Jahwe“ gibt ihn im Deutschen ausdrücklich wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Dynastische Aussage über Jojakim
  choice: niemanden haben, der auf dem Thron Davids sitzt
  alternative: keinen Nachkommen haben, der auf dem Thron Davids sitzt
  rationale: Die Aussage hat erkennbar dynastische Tragweite, doch das Hebräische nennt einen „Nachkommen“ nicht ausdrücklich. Die Übersetzung bewahrt diese sprachliche Zurückhaltung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Ton. Die traditionelle deutsche Namensform „Jojakim“ wird verwendet. Der Fußnotenmarker steht unmittelbar bei „Hitze“, da sich die lexikalische Alternative auf dieses Wort bezieht.
