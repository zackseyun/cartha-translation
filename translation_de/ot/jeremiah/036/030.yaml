  source_fidelity: 'Die Aussage wird insgesamt zutreffend wiedergegeben: לָכֵן ist folgerichtig mit „Darum“ übersetzt, die Botenformel und der Gottesname sind angemessen wiedergegeben, und die dynastische Aussage vermeidet die nicht ausdrücklich genannte Ergänzung „Nachkomme“. „Jojakim“ und „Thron Davids“ entsprechen dem üblichen deutschen Bibelgebrauch. Für מֻשְׁלֶכֶת bewahrt „hinausgeworfen“ die beabsichtigte Schändung. Die Wendungen zu Hitze am Tag und Frost in der Nacht sollten jedoch syntaktisch enger an den Leichnam und an das Ausgesetztsein gebunden werden.'
  naturalness: 'Der bisherige zweite Satz ist nicht idiomatisch genug: „wird hinausgeworfen werden und am Tag der Hitze, in der Nacht dem Frost preisgegeben sein“ verbindet zwei unterschiedliche Passivkonstruktionen schwerfällig; zudem klingt „am Tag der Hitze“ im Deutschen weniger natürlich als „der Hitze am Tag“. Eine koordinierte Formulierung mit „ausgesetzt sein“ ist klar, modern und erhält den bildhaften Parallelismus.'
  terminology: „Jahwe“, „Jojakim“, „Juda“, „Thron Davids“, „Leichnam“ und „Frost“ sind sachgerecht. Die Fußnote wahrt die lexikalische Mehrdeutigkeit von חֹרֶב, ohne die im Kontext naheliegende Bedeutung „Hitze“ im Haupttext zu verdrängen.
