source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/שָּׁנָ֣ה הַ֠/חֲמִשִׁית לִ/יהוֹיָקִ֨ים בֶּן יֹאשִׁיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ בַּ/חֹ֣דֶשׁ הַ/תְּשִׁעִ֔י קָרְא֨וּ צ֜וֹם לִ/פְנֵ֧י יְהוָ֛ה כָּל הָ/עָ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/כָל הָ/עָ֗ם הַ/בָּאִ֛ים מֵ/עָרֵ֥י יְהוּדָ֖ה בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
translation:
  language: de
  text: Im fünften Regierungsjahr Jojakims, des Sohnes Josias, des Königs von Juda, im neunten Monat, geschah es, dass man vor Jahwe ein Fasten ausrief – für das ganze Volk in Jerusalem und für das ganze Volk, das aus den Städten Judas nach Jerusalem kam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: geschah es
  rationale: Die gebräuchliche hebräische Erzählungsform leitet hier ein neues Ereignis ein; „geschah es“ wahrt diese Funktion in würdigem, nicht altertümlichem Deutsch.
- source_word: בַשָּׁנָה הַחֲמִשִׁית לִיהוֹיָקִים
  choice: im fünften Regierungsjahr Jojakims
  rationale: In einer königlichen Datierungsformel bezeichnet die Wendung das fünfte Jahr seiner Herrschaft. „Regierungsjahr“ macht den im Deutschen vorausgesetzten Sinn knapp und eindeutig.
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Jojakims, des Sohnes Josias, des Königs von Juda
  rationale: Die Namen folgen den geläufigen deutschen biblischen Formen; die Apposition gibt Titel und Abstammung ohne inhaltliche Ergänzung wieder.
- source_word: בַחֹדֶשׁ הַתְּשִׁעִי
  choice: im neunten Monat
  rationale: Direkte Wiedergabe der kalendarischen Angabe, ohne einen Monatsnamen oder weitere Einzelheiten hinzuzufügen.
- source_word: קָרְאוּ צוֹם
  choice: man … ein Fasten ausrief
  rationale: קרא mit צום bedeutet idiomatisch, ein öffentliches Fasten auszurufen. Das unpersönliche „man“ bewahrt das im Hebräischen nicht ausdrücklich genannte Subjekt.
- source_word: לִפְנֵי יְהוָה
  choice: vor Jahwe
  rationale: לִפְנֵי bezeichnet die Ausrichtung beziehungsweise das Geschehen in Gottes Gegenwart; der Gottesname יהוה wird als „Jahwe“ wiedergegeben.
- source_word: כָּל הָעָם בִּירוּשָׁלָם
  choice: für das ganze Volk in Jerusalem
  rationale: Die Präposition ב lokalisiert die Menschen in Jerusalem und legt nicht fest, dass es ausschließlich gebürtige Einwohner der Stadt waren.
- source_word: וְכָל הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  choice: und für das ganze Volk, das aus den Städten Judas nach Jerusalem kam
  rationale: Das Partizip הַבָּאִים wird als Relativsatz wiedergegeben; aus dem Zusammenhang ergibt sich bei בִּירוּשָׁלָם die Zielrichtung „nach Jerusalem“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält ausdrücklich das Tetragramm. „Jahwe“ gibt den Eigennamen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Nicht genanntes Subjekt von קָרְאוּ
  choice: unpersönliches „man“
  alternative: das versammelte Volk als ausdrücklich handelndes Subjekt
  rationale: Die Verbform steht im Plural, nennt aber die Ausrufenden nicht. Die unpersönliche Wiedergabe vermeidet es, das Volk ohne textliche Grundlage selbst zu den Verkündigern des Fastens zu machen.
- issue: Bezug der beiden mit כָּל הָעָם bezeichneten Gruppen
  choice: Adressaten beziehungsweise Teilnehmer des ausgerufenen Fastens
  alternative: Subjekt des Ausrufens
  rationale: Die Präposition ל vor לִפְנֵי eröffnet hier die Angabe „vor Jahwe“, während die beiden Volksgruppen syntaktisch am natürlichsten als diejenigen verstanden werden, für die das Fasten ausgerufen wurde. Die Übersetzung bewahrt zugleich das unbestimmte Subjekt des Verbs.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Gedankenstrich verdeutlicht, dass beide anschließend genannten Gruppen zum ausgerufenen Fasten gehören, ohne ein im Hebräischen nicht genanntes handelndes Subjekt einzuführen.
