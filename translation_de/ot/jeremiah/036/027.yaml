source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר יְהוָ֖ה אֶֽל יִרְמְיָ֑הוּ אַחֲרֵ֣י שְׂרֹ֣ף הַ/מֶּ֗לֶךְ אֶת הַ/מְּגִלָּה֙ וְ/אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֨ר כָּתַ֥ב בָּר֛וּךְ מִ/פִּ֥י יִרְמְיָ֖הוּ לֵ/אמֹֽר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/027.yaml
  text: Then the word of Yahweh came to Jeremiah[a], after the king had burned the scroll and the words that Baruch had written from the mouth of Jeremiah, saying,
translation:
  language: de
  text: 'Da erging das Wort Jahwes an Jeremia, nachdem der König die Schriftrolle und die Worte verbrannt hatte, die Baruch nach Jeremias Diktat[a] aufgeschrieben hatte. Es lautete:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Mund Jeremias“.'
    reason: Die Fußnote macht die konkrete hebräische Ausdrucksweise sichtbar, während der Haupttext ihre idiomatische Bedeutung wiedergibt.
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֶל יִרְמְיָהוּ
  choice: Da erging das Wort Jahwes an Jeremia
  rationale: Die übliche prophetische Formel wird im Deutschen natürlich mit „das Wort … erging an“ wiedergegeben. „Da“ führt das nächste Ereignis der Erzählfolge ein, ohne das hebräische וַיְהִי hölzern nachzubilden.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im modernen Deutschen geläufige Form der wissenschaftlichen Umschrift.
- source_word: אַחֲרֵי שְׂרֹף הַמֶּלֶךְ
  choice: nachdem der König … verbrannt hatte
  rationale: Die Präposition mit Infinitivus constructus bezeichnet eine zeitlich vorausliegende Handlung. Das Plusquamperfekt macht dieses Verhältnis im Deutschen deutlich.
- source_word: הַמְּגִלָּה
  choice: die Schriftrolle
  rationale: מְגִלָּה bezeichnet ein beschriebenes, aufgerolltes Dokument; „Schriftrolle“ ist eindeutig und allgemein verständlich.
- source_word: וְאֶת הַדְּבָרִים
  choice: und die Worte
  rationale: Die Übersetzung bewahrt die ausdrückliche Unterscheidung zwischen der materiellen Schriftrolle und den darauf festgehaltenen prophetischen Worten.
- source_word: אֲשֶׁר כָּתַב בָּרוּךְ
  choice: die Baruch … aufgeschrieben hatte
  rationale: „Aufgeschrieben“ passt zum Festhalten mündlich vorgegebener Worte; das Plusquamperfekt kennzeichnet die Handlung als dem Verbrennen vorausgehend.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: nach Jeremias Diktat
  rationale: Die hebräische Wendung bedeutet wörtlich „aus dem Mund Jeremias“ und bezeichnet hier Jeremia als mündliche Quelle dessen, was Baruch niederschrieb. Die idiomatische deutsche Wiedergabe vermeidet eine missverständliche Körpermetapher.
- source_word: לֵאמֹר
  choice: 'Es lautete:'
  rationale: Der hebräische Redeeinleiter eröffnet die in Vers 28 folgende Gottesrede. Ein eigener kurzer Satz mit Doppelpunkt ist in modernem Deutsch natürlicher als das partizipiale „indem er sprach“.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Gottesnamen selbst und nicht den Titel אֲדֹנָי. Die Umschrift als Eigenname erhält diesen Unterschied; die deutsche Standardform ist „Jahwe“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Formel bleibt erkennbar; schwerfällige Nachbildung der hebräischen Satzverkettung wird vermieden. Der abschließende Doppelpunkt signalisiert, dass die Gottesrede im folgenden Vers beginnt.
