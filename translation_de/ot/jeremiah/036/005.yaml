source:
  edition: WLC
  text: וַ/יְצַוֶּ֣ה יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ לֵ/אמֹ֑ר אֲנִ֣י עָצ֔וּר לֹ֣א אוּכַ֔ל לָ/ב֖וֹא בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/005.yaml
  text: Then Jeremiah commanded Baruch[a], saying, “I am restrained; I cannot go into the house of Yahweh.”
translation:
  language: de
  text: 'Dann befahl Jeremia Baruch: »Ich bin gehindert[a] und kann nicht in das Haus Jahwes gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ich bin eingeschlossen«, »ich bin zurückgehalten« oder »ich werde festgehalten«. Das hebräische Wort lässt offen, worin Jeremias Einschränkung genau bestand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֶּה
  choice: befahl
  rationale: Das Piel von צוה bezeichnet einen verbindlichen Auftrag oder Befehl. „Befahl“ bewahrt die direktive Kraft des hebräischen Verbs.
- source_word: לֵאמֹר
  choice: durch den Doppelpunkt wiedergegeben
  rationale: Der übliche hebräische Redeeinleiter wird im natürlichen modernen Deutsch am besten durch einen Doppelpunkt vor der direkten Rede ausgedrückt.
- source_word: עָצוּר
  choice: werde zurückgehalten
  rationale: Die Form bezeichnet, dass Jeremia zurückgehalten oder am Gehen gehindert ist, ohne die Art oder Ursache dieser Einschränkung festzulegen. Die Wiedergabe vermeidet die zu enge Festlegung auf eine Inhaftierung.
- source_word: לֹא אוּכַל
  choice: kann nicht
  rationale: Dies ist die schlichte und idiomatische deutsche Wiedergabe der verneinten Form von יכל und drückt Unvermögen aus.
- source_word: לָבוֹא
  choice: gehen
  rationale: Aus der Perspektive Jeremias ist die Bewegung zum beziehungsweise in den Tempel gemeint. In Verbindung mit „in das Haus“ gibt „gehen“ dies im Deutschen natürlich wieder.
- source_word: בֵּית יְהוָה
  choice: das Haus Jahwes
  rationale: Die Übersetzung bewahrt das hebräische Bild „Haus“ und gibt den göttlichen Eigennamen ausdrücklich wieder.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der Gottesname wird als Eigenname wiedergegeben; „Jahwe“ ist die im Deutschen etablierte Form.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält das Tetragramm ausdrücklich. „Jahwe“ bewahrt den Charakter als Gottes Eigenname, ohne ihn durch einen Titel zu ersetzen.
- issue: Art von Jeremias Einschränkung
  choice: 'offengelassen: „werde zurückgehalten“'
  alternative: „bin eingesperrt“
  rationale: Der Kontext dieses Verses erklärt nicht eindeutig, ob Jeremia inhaftiert, anderweitig festgehalten oder aus einem anderen Grund am Tempelbesuch gehindert wird. Eine eindeutige Festlegung würde die Spannung des Ausgangstextes auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt ersetzt den im Deutschen schwerfälligen wörtlichen Redeeinleiter „indem er sagte“. Die Formulierung „Haus Jahwes“ wahrt die Bildsprache des Hebräischen; die Fußnote erhält die sachliche Mehrdeutigkeit von עָצוּר.
