  text: וַ/יַּגֵּ֤ד לָ/הֶם֙ מִכָ֔יְהוּ אֵ֥ת כָּל הַ/דְּבָרִ֖ים אֲשֶׁ֣ר שָׁמֵ֑עַ בִּ/קְרֹ֥א בָר֛וּךְ בַּ/סֵּ֖פֶר בְּ/אָזְנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/013.yaml
  text: And Micaiah told them all the words that he had heard when Baruch read the scroll in the hearing of the people[a].
translation:
  language: de
  text: Und Michaja berichtete ihnen alle Worte, die er gehört hatte, als Baruch aus der Schriftrolle vor dem Volk vorlas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was er gehört hatte, während Baruch aus der Schriftrolle vor dem Volk vorlas“.'
    reason: Die zeitliche Konstruktion kann den Vorgang des Vorlesens als andauernden Hintergrund zum Hören darstellen.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: berichtete
  rationale: Das Hifil von נגד bezeichnet hier das Mitteilen bzw. Berichten von Informationen. „Berichtete“ passt zum narrativen Vorgang und zur Weitergabe an die führenden Männer.
- source_word: לָהֶם
  choice: ihnen
  rationale: Das Pronomen ist das indirekte Objekt und verweist im Kontext auf die führenden Männer.
- source_word: מִכָיְהוּ
  choice: Michaja
  rationale: Gebräuchliche deutsche Wiedergabe des hebräischen Personennamens.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: alles
  rationale: דְּבָרִים kann sowohl einzelne „Worte“ als auch den gesamten mitgeteilten Inhalt bezeichnen. Natürliches Deutsch verwendet hier „alles“, ohne den inhaltlichen Umfang einzuschränken.
- source_word: אֲשֶׁר שָׁמֵעַ
  choice: was er gehört hatte
  rationale: Das Plusquamperfekt macht deutlich, dass Michajas Hören seinem anschließenden Bericht vorausging.
- source_word: בִּקְרֹא
  choice: als … vorlas
  rationale: Die Präposition mit Infinitivus constructus gibt den zeitlichen Umstand an. „Als … vorlas“ ist idiomatisch und trägt dem öffentlichen Vorlesen Rechnung.
- source_word: בָרוּךְ
  choice: Baruch
  rationale: Gebräuchliche deutsche Transliteration des Personennamens.
- source_word: בַּסֵּפֶר
  choice: aus der Schriftrolle
  rationale: סֵפֶר bezeichnet hier die in Jeremia 36 beschriebene beschriftete Rolle. Die Präposition ב wird beim deutschen Verb „vorlesen“ sinngemäß mit „aus“ wiedergegeben.
- source_word: בְּאָזְנֵי הָעָם
  choice: vor den Ohren des Volkes
  rationale: Die Wiedergabe bewahrt das konkrete hebräische Idiom und ist im Deutschen verständlich; gemeint ist öffentliches Vorlesen in Hörweite des Volkes.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Vor den Ohren des Volkes“ bewahrt bewusst das anschauliche hebräische Idiom; die Fußnote bietet die glattere idiomatische Alternative.
