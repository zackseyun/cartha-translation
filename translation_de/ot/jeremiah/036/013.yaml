  to: Und Michaja berichtete ihnen alle Worte, die er gehört hatte, als Baruch aus der Schriftrolle vor dem Volk vorlas.[a]
  rationale: Die Revision ersetzt allein die im Deutschen unnatürliche wörtliche Idiomübertragung durch die genaue idiomatische Entsprechung „vor dem Volk“ und stellt mit „alle Worte“ die hebräische Formulierung enger nach. Die Fußnote bewahrt die mögliche durative Nuance der Zeitangabe.
