  text: וַ/יִּקְרָ֣א יִרְמְיָ֔הוּ אֶת בָּר֖וּךְ בֶּן נֵֽרִיָּ֑ה וַ/יִּכְתֹּ֨ב בָּר֜וּךְ מִ/פִּ֣י יִרְמְיָ֗הוּ אֵ֣ת כָּל דִּבְרֵ֧י יְהוָ֛ה אֲשֶׁר דִּבֶּ֥ר אֵלָ֖י/ו עַל מְגִלַּת סֵֽפֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
translation:
  language: de
  text: Da rief Jeremia Baruch, den Sohn Nerijas, zu sich, und Baruch schrieb nach Jeremias Diktat[a] alle Worte Jahwes, die er zu ihm gesprochen hatte, auf eine Schriftrolle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus dem Mund Jeremias“, das heißt, während Jeremia diktierte.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf eine Buchrolle“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: rief … zu sich
  rationale: קרא bezeichnet hier das Herbeirufen einer Person. „Rief … zu sich“ ist im heutigen Deutsch eindeutig und vermeidet den möglichen Eindruck, Jeremia habe Baruch nur laut zugerufen.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  choice: Baruch, den Sohn Nerijas
  rationale: Die Namen werden in ihrer im Deutschen üblichen Form wiedergegeben; die Apposition entspricht der hebräischen Abstammungsangabe.
- source_word: וַיִּכְתֹּב
  choice: schrieb
  rationale: Das einfache „schrieb“ gibt כתב direkt wieder; die Richtungspartikel in „aufschreiben“ ist wegen der späteren Angabe „auf eine Schriftrolle“ nicht nötig.
- source_word: מִפִּי יִרְמְיָהוּ
  choice: nach Jeremias Diktat
  rationale: Wörtlich steht „aus dem Mund Jeremias“. Gemeint ist, dass Baruch die von Jeremia gesprochenen Worte niederschrieb. „Nach Jeremias Diktat“ gibt diesen Vorgang natürlich und präzise wieder; das hebräische Bild bleibt in der Fußnote erhalten.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: alle Worte Jahwes
  rationale: „Worte“ bewahrt die konkrete Ausdrucksweise des Hebräischen und bezeichnet die vollständige prophetische Botschaft.
- source_word: יְהוָה
  choice: Jahwe
  rationale: Der im Hebräischen stehende Gottesname wird als „Jahwe“ wiedergegeben und nicht durch einen Titel ersetzt.
- source_word: אֲשֶׁר דִּבֶּר אֵלָיו
  choice: die er zu ihm gesprochen hatte
  rationale: 'Die pronominale Form des Hebräischen bleibt erhalten: Im Zusammenhang bezieht sich „er“ auf Jahwe und „ihm“ auf Jeremia. Eine Wiedergabe mit ausdrücklich eingesetzten Namen würde die im Ausgangstext vorhandene Pronomenstruktur stärker ausdeuten.'
- source_word: עַל מְגִלַּת סֵפֶר
  choice: auf eine Schriftrolle
  rationale: Die hebräische Wortverbindung bezeichnet eine zum Beschreiben bestimmte Buch- beziehungsweise Dokumentrolle. „Schriftrolle“ ist die klare, natürliche deutsche Entsprechung.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יהוה
  choice: Jahwe
  alternative: der HERR
  rationale: Der Vers verwendet ausdrücklich das Tetragramm. „Jahwe“ bewahrt den persönlichen Gottesnamen, während „der HERR“ ihn durch einen Titel ersetzen würde.
- issue: Bezug der Pronomen in אֲשֶׁר דִּבֶּר אֵלָיו
  choice: „die er zu ihm gesprochen hatte“
  alternative: „die Jahwe zu Jeremia gesprochen hatte“
  rationale: Der Zusammenhang legt Jahwe als Sprecher und Jeremia als Empfänger nahe. Die Übersetzung bewahrt jedoch die pronominale Ausdrucksweise des Hebräischen, statt die Namen erklärend einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt dem hebräischen Erzählfluss, verwendet aber eine natürliche deutsche Wortstellung. „Nach Jeremias Diktat“ macht den beschriebenen Schreibvorgang verständlich; die wörtliche Bildsprache wird in der Fußnote dokumentiert.
