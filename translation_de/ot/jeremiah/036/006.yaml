revisions:
- from: Dann geh du selbst hin und lies aus der Schriftrolle, in die du nach meinem Diktat[a] die Worte Jahwes geschrieben hast. Lies sie dem Volk im Haus Jahwes[b] an einem Fastentag vor. Auch allen Leuten aus Juda, die aus ihren Städten kommen, sollst du sie vorlesen.
  to: Dann geh du selbst hin und lies aus der Schriftrolle, in die du nach meinem Diktat[a] die Worte Jahwes geschrieben hast, dem Volk im Haus Jahwes[b] an einem Fastentag die Worte Jahwes daraus vor. Auch allen Leuten aus Juda, die aus ihren Städten kommen, sollst du sie vorlesen.
  rationale: Die Revision klärt den im Deutschen sonst femininen Bezug von „sie“ und entspricht damit dem pluralischen Objekt des hebräischen Schlussverbs, den „Worten Jahwes“. Die Angaben zu Schriftrolle, Diktat, Tempel und Fastentag sowie beide Fußnoten bleiben inhaltlich unverändert erhalten.
