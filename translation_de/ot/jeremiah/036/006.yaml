  text: וּ/בָאתָ֣ אַתָּ֡ה וְ/קָרָ֣אתָ בַ/מְּגִלָּ֣ה אֲשֶׁר כָּתַֽבְתָּ מִ/פִּ/י֩ אֶת דִּבְרֵ֨י יְהוָ֜ה בְּ/אָזְנֵ֥י הָ/עָ֛ם בֵּ֥ית יְהוָ֖ה בְּ/י֣וֹם צ֑וֹם וְ/גַ֨ם בְּ/אָזְנֵ֧י כָל יְהוּדָ֛ה הַ/בָּאִ֥ים מֵ/עָרֵי/הֶ֖ם תִּקְרָאֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
translation:
  language: de
  text: Dann geh du selbst hin und lies aus der Schriftrolle, in die du nach meinem Diktat[a] die Worte Jahwes geschrieben hast, dem Volk im Haus Jahwes[b] an einem Fastentag die Worte Jahwes daraus vor. Auch allen Leuten aus Juda, die aus ihren Städten kommen, sollst du sie vorlesen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die du aus meinem Mund geschrieben hast“.'
    reason: lexical_alternative
  - marker: b
    text: Mit dem „Haus Jahwes“ ist der Tempel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  choice: Dann geh du selbst hin
  rationale: Das Waw mit der Perfektform führt die Anweisung mit auffordernder Bedeutung fort; das ausdrückliche אַתָּה wird durch „du selbst“ betont. Im Deutschen ist aus der Perspektive des Beauftragten „hingehen“ natürlich.
- source_word: וְקָרָאתָ בַמְּגִלָּה
  choice: und lies aus der Schriftrolle
  rationale: קרא bezeichnet bei einem Schriftstück das laute Lesen; ב markiert hier das Dokument, aus dem gelesen wird.
- source_word: אֲשֶׁר כָּתַבְתָּ מִפִּי
  choice: in die du nach meinem Diktat geschrieben hast
  rationale: Wörtlich steht „die du aus meinem Mund geschrieben hast“. „Nach meinem Diktat“ gibt den Sinn der hebräischen Wendung im natürlichen Deutschen präzise wieder; die wörtliche Ausdrucksweise wird in der Fußnote genannt.
- source_word: אֶת דִּבְרֵי יְהוָה
  choice: die Worte Jahwes
  rationale: Die Formulierung bezeichnet den Inhalt, den Baruch niedergeschrieben hat; der Gottesname wird als „Jahwe“ wiedergegeben.
- source_word: בְּאָזְנֵי הָעָם
  choice: dem Volk ... vor
  rationale: Die hebräische Wendung „in den Ohren des Volkes“ meint hörbares, öffentliches Vorlesen. Die deutsche Verbfügung „jemandem vorlesen“ bewahrt diesen Sinn natürlich.
- source_word: בֵּית יְהוָה
  choice: im Haus Jahwes
  rationale: Die wörtliche Bezeichnung „Haus Jahwes“ bleibt erhalten; im Zusammenhang ist damit der Tempel gemeint.
- source_word: בְּיוֹם צוֹם
  choice: an einem Fastentag
  rationale: Die artikellose Wendung bezeichnet einen Tag des Fastens, ohne zwingend einen bestimmten, fest benannten Feiertag vorauszusetzen.
- source_word: בְּאָזְנֵי כָל יְהוּדָה
  choice: allen Leuten aus Juda ... vorlesen
  rationale: „Ganz Juda“ bezeichnet kollektiv die Menschen aus Juda. Die Wiedergabe verhindert im Deutschen, dass das Gebiet selbst als hörende Größe missverstanden wird.
- source_word: הַבָּאִים מֵעָרֵיהֶם
  choice: die aus ihren Städten kommen
  rationale: Das Partizip beschreibt die aus den verschiedenen Städten Judas eintreffenden Menschen; „Städte“ ist eine direkte Wiedergabe von עָרִים.
theological_decisions:
- issue: Wiedergabe des Gottesnamens יְהוָה
  choice: Jahwe
  alternative: der HERR
  rationale: Der hebräische Text enthält den Eigennamen יהוה. „Jahwe“ gibt diesen als Namen wieder, statt ihn durch einen Titel zu ersetzen.
- issue: Bezug von „Haus Jahwes“
  choice: wörtliche Formulierung im Text, Erklärung als Tempel in der Fußnote
  alternative: Tempel Jahwes direkt im Text
  rationale: So bleibt das biblische Bild vom Gotteshaus erhalten, während die kulturelle Bedeutung für heutige Leser geklärt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „vorlesen“ gliedert die beiden Hörerkreise klar. „Schriftrolle“ ist historisch verständlich; „Fastentag“ lässt offen, ob es sich um einen eigens ausgerufenen oder regelmäßig begangenen Fasttag handelt.
