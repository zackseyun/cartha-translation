base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/025.yaml
  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
translation:
  language: de
  text: Doch auch Elnatan, Delaja und Gemarja baten den König eindringlich[a], die Schriftrolle nicht zu verbrennen. Aber er hörte nicht auf sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „flehten den König an“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Doch auch
  rationale: Gibt die additive Bedeutung von גַם wieder und lässt durch „doch“ den milden Gegensatz zum Kontext erkennen.
- source_word: הִפְגִּעוּ בַמֶּלֶךְ
  choice: baten den König eindringlich
  rationale: Der Hifil von פגע bezeichnet hier eine ernsthafte, an den König gerichtete Bitte. Die Formulierung ist im modernen Deutschen natürlich und bewahrt die Nachdrücklichkeit.
- source_word: לְבִלְתִּי שְׂרֹף
  choice: nicht zu verbrennen
  rationale: Die Infinitivkonstruktion bezeichnet den Inhalt der Bitte, nämlich die beabsichtigte Handlung zu unterlassen.
- source_word: הַמְּגִלָּה
  choice: die Schriftrolle
  rationale: מְגִלָּה bezeichnet in diesem Erzählzusammenhang eine beschriebene Rolle; „Schriftrolle“ ist eindeutig und gebräuchlich.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: Aber er hörte nicht auf sie
  rationale: „Aber“ bringt den kontextuellen Gegensatz zur eindringlichen Bitte zum Ausdruck; „auf jemanden hören“ ist eine natürliche deutsche Wiedergabe des Nichtbeachtens ihres Einspruchs.
