  source_fidelity: Die Übersetzung gibt וְגַם angemessen als „Doch auch“ wieder und bewahrt damit sowohl die additive als auch die im Kontext leicht kontrastierende Nuance. הִפְגִּיעוּ בַּמֶּלֶךְ ist mit „baten den König eindringlich“ treffend und idiomatisch wiedergegeben. Die Infinitivfügung macht klar, dass die Bitte darauf zielte, das Verbrennen der Schriftrolle zu verhindern. Der abschließende Satz gibt וְלֹא שָׁמַע אֲלֵיהֶם zutreffend wieder.
