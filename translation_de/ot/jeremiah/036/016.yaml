  text: וַ/יְהִ֗י כְּ/שָׁמְעָ/ם֙ אֶת כָּל הַ/דְּבָרִ֔ים פָּחֲד֖וּ אִ֣ישׁ אֶל רֵעֵ֑/הוּ וַ/יֹּֽאמְרוּ֙ אֶל בָּר֔וּךְ הַגֵּ֤יד נַגִּיד֙ לַ/מֶּ֔לֶךְ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
translation:
  language: de
  text: 'Als sie all die Worte gehört hatten, erschraken sie und sahen einander an[a]. Dann sagten sie zu Baruch: »Wir werden dem König ganz gewiss alle diese Worte berichten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sie fürchteten sich, einer dem anderen zugewandt.« Die ungewöhnliche hebräische Wendung beschreibt eine wechselseitige, von Furcht geprägte Reaktion; möglich ist auch: »Sie sahen einander voller Angst an.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Als sie … gehört hatten
  rationale: Die hebräische Erzählungsformel leitet hier eine zeitliche Folge ein. Die deutsche Wiedergabe drückt diese natürlich aus, ohne das formelhafte וַיְהִי hölzern mit »und es geschah« abzubilden.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: all die Worte
  rationale: דְּבָרִים bezeichnet im Kontext die vorgelesenen Worte der Schriftrolle. »All die Worte« unterscheidet diese erste, nicht demonstrative Formulierung von »alle diese Worte« am Versende.
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  choice: erschraken sie und sahen einander an
  rationale: פָּחֲדוּ bezeichnet ihre Furcht beziehungsweise ihr Erschrecken; אִישׁ אֶל רֵעֵהוּ beschreibt die wechselseitige Ausrichtung ihrer Reaktion. Die Übersetzung ist natürliches Deutsch, während die Fußnote die ungewöhnliche hebräische Fügung offenlegt.
- source_word: וַיֹּאמְרוּ אֶל בָּרוּךְ
  choice: Dann sagten sie zu Baruch
  rationale: »Dann« gibt die fortschreitende Erzählungsfolge idiomatisch wieder; »sagten« entspricht dem schlichten Sinn des Verbs.
- source_word: הַגֵּיד נַגִּיד
  choice: Wir werden … ganz gewiss berichten
  rationale: Der Infinitivus absolutus zusammen mit der ersten Person Plural Imperfekt verstärkt die Aussage. »Ganz gewiss« bewahrt die emphatische Entschlossenheit und die ausdrücklich plurale Verbform, ohne daraus einen Befehl allein an Baruch zu machen.
- source_word: לַמֶּלֶךְ
  choice: dem König
  rationale: Der bestimmte Ausdruck verweist auf den im Zusammenhang bekannten regierenden König.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: alle diese Worte
  rationale: »Worte« passt zum Inhalt der Schriftrolle; »diese« gibt den Demonstrativausdruck הָאֵלֶּה wieder und erhält die Wiederholung des hebräischen Textes.
