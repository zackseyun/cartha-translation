base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
translation:
  language: de
  text: Und ich werde ihn, seine Nachkommen und seine Diener für ihre Schuld zur Rechenschaft ziehen. Über sie, über die Einwohner Jerusalems und über jeden Mann von Juda[a] werde ich all das Unheil bringen, das ich ihnen angekündigt habe; doch sie haben nicht gehört.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hebräisch: „jeden Mann von Juda“. Die Form ist ein distributiver Singular und grammatisch maskulin; möglich sind im Zusammenhang auch allgemeinere Wiedergaben wie „alle in Juda“ oder „die Bevölkerung Judas“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלָיו
  choice: ich werde ihn … zur Rechenschaft ziehen
  rationale: פקד על bezeichnet hier im Gerichtszusammenhang kein neutrales Aufsuchen, sondern ein strafendes Rechenschaftfordern. Die deutsche Wendung wahrt den gerichtlichen Sinn und klingt natürlich.
- source_word: זַרְעוֹ
  choice: seine Nachkommen
  rationale: זרע meint hier die Nachkommenschaft, nicht buchstäblichen Samen. „Nachkommen“ ist im Deutschen klar und bewahrt den kollektiven Sinn.
- source_word: עֲבָדָיו
  choice: seine Diener
  rationale: Im Umfeld des Königshofes bezeichnet עבד die dem König unterstellten Diener oder Amtsträger; „Diener“ lässt den genauen sozialen Status offen.
- source_word: אֶת עֲוֺנָם
  choice: für ihre Schuld
  rationale: עון kann Verfehlung, Schuld oder deren Folge bezeichnen. Hier ist die zurechenbare Schuld der Grund des Gerichts; „Schuld“ erhält diese moralisch-rechtliche Bedeutung.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם
  choice: Über sie … werde ich … bringen
  rationale: הביא על ist eine feste Wendung für das Herbeiführen von Unheil über jemanden. Die deutsche Satzstellung bildet die wiederholten Zielangaben verständlich ab.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: die Einwohner Jerusalems
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die in Jerusalem wohnen. „Einwohner“ ist präzise und gegenwärtig.
- source_word: וְאֶל אִישׁ יְהוּדָה
  choice: und über jeden Mann von Juda
  rationale: איש ist distributiver Singular und grammatisch maskulin. „Jeden Mann von Juda“ bewahrt diese Form und Reichweite; die ungewöhnliche Präposition אל steht funktional parallel zu על als Ziel des Unheils.
- source_word: כָּל הָרָעָה
  choice: all das Unheil
  rationale: רעה bezeichnet im prophetischen Gerichtskontext angekündigte Katastrophe beziehungsweise Unheil, nicht moralische Bosheit. „Unheil“ ist würdig und idiomatisch.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיהֶם
  choice: das ich ihnen angekündigt habe
  rationale: Wörtlich steht „das ich zu ihnen geredet habe“. Da der Gegenstand das angekündigte Unheil ist, gibt „angekündigt“ die kommunikative Funktion natürlich wieder, ohne eine zusätzliche Deutung einzuführen.
- source_word: וְלֹא שָׁמֵעוּ
  choice: doch sie haben nicht gehört
  rationale: שמע umfasst Hören, Beachten und Gehorchen. „Nicht gehört“ bewahrt die hebräische Mehrdeutigkeit; „doch“ gibt den kontextuellen Gegensatz wieder.
theological_decisions:
- issue: Reichweite und Geschlecht von אִישׁ יְהוּדָה
  choice: jeden Mann von Juda
  alternative: alle Menschen in Juda / die Bevölkerung Judas
  rationale: Der distributive Singular איש und seine maskuline Form werden nicht in ein geschlechtsneutrales Kollektiv eingeebnet. Eine Fußnote weist auf mögliche allgemeinere Wiedergaben hin, ohne die Form des Ausgangstextes stillschweigend aufzulösen.
- issue: Bedeutungsumfang von שׁמע
  choice: nicht gehört
  alternative: nicht gehorcht / nicht darauf gehört
  rationale: Das Hebräische kann sowohl das Hören als auch das gehorsame Beachten meinen. Die Übersetzung wahrt diese theologisch relevante Spannung, statt ausschließlich Ungehorsam festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz wird gegenüber der langen hebräischen Reihung geteilt, um die Zielgruppen des angekündigten Unheils klar erkennbar zu machen. Der Fußnotenmarker steht bei der erklärungsbedürftigen maskulin-distributiven Form.
