  text: וְ/אֶ֨ת בָּר֔וּךְ שָׁאֲל֖וּ לֵ/אמֹ֑ר הַגֶּד נָ֣א לָ֔/נוּ אֵ֗יךְ כָּתַ֛בְתָּ אֶת כָּל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה מִ/פִּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/017.yaml
  text: And they asked Baruch[a], saying, “Please tell us, how did you write all these words from his mouth?”
translation:
  language: de
  text: 'Und sie fragten Baruch: »Sag uns bitte: Wie hast du all diese Worte nach seinem Diktat[a] aufgeschrieben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »aus seinem Mund«; gemeint ist, dass Jeremia die Worte mündlich vorgab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּרוּךְ שָׁאֲלוּ
  choice: Und sie fragten Baruch
  rationale: Die Voranstellung des markierten Objekts hebt Baruch als den Befragten hervor. Die deutsche Wortfolge gibt den Sinn natürlich wieder; »Und« wahrt den Erzählanschluss.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Die hebräische Redeeinleitung wird im modernen Deutschen idiomatisch durch einen Doppelpunkt vor der direkten Rede wiedergegeben.
- source_word: הַגֶּד נָא לָנוּ
  choice: Sag uns bitte
  rationale: Der Imperativ von נגד fordert zum Mitteilen auf; נָא verleiht der Aufforderung eine höflich-bittende Nuance.
- source_word: אֵיךְ כָּתַבְתָּ
  choice: Wie hast du … aufgeschrieben?
  rationale: אֵיךְ fragt nach der Art und Weise. »Aufgeschrieben« passt im Zusammenhang mit Baruchs Tätigkeit als Schreiber genauer als das allgemeinere »geschrieben«.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: all diese Worte
  rationale: דְּבָרִים kann auch »Dinge« oder »Angelegenheiten« bedeuten; im Zusammenhang mündlicher Weitergabe und schriftlicher Aufzeichnung sind konkrete »Worte« gemeint.
- source_word: מִפִּיו
  choice: aus seinem Mund
  rationale: Die wörtliche, bildhafte Wendung des Hebräischen bleibt erhalten. Im Kontext bezeichnet sie die mündliche Vorgabe beziehungsweise das Diktat Jeremias.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Rede ist natürlich gestaltet; die konkrete hebräische Wendung »aus seinem Mund« bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
