base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/015.yaml
  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
translation:
  language: de
  text: 'Da sagten sie zu ihm: „Setz dich bitte und lies sie uns vor.“ Und Baruch las sie ihnen vor.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Da sagten sie zu ihm
  rationale: Das narrative וַ führt die Handlung weiter. „Da“ gibt die Abfolge im modernen Deutschen natürlich wieder, ohne einen stärkeren Folgezusammenhang festzulegen.
- source_word: שֵׁב נָא
  choice: Setz dich bitte
  rationale: שֵׁב ist hier als Aufforderung zum Hinsetzen zu verstehen; נָא verleiht ihr einen höflichen oder bittenden Ton, der mit „bitte“ wiedergegeben wird.
- source_word: וּקְרָאֶנָּה
  choice: und lies sie uns vor
  rationale: קרא bezeichnet im Zusammenhang mit der zuvor erwähnten Schriftrolle das Lesen. Das feminine Suffix wird mit „sie“ aufgenommen; „vorlesen“ bringt zusammen mit dem folgenden Ausdruck natürlich zum Ausdruck, dass die Anwesenden hören sollen.
- source_word: בְּאָזְנֵינוּ
  choice: uns vor
  rationale: Wörtlich heißt die Wendung „in unsere Ohren“. Das deutsche „uns vorlesen“ gibt diese hebräische Hörformel idiomatisch und präzise wieder.
- source_word: וַיִּקְרָא בָרוּךְ
  choice: Und Baruch las
  rationale: Das narrative וַ berichtet Baruchs anschließende Reaktion. „Und“ bewahrt die schlichte Erzählfolge, ohne den Zusammenhang ausdrücklich als Folge zu deuten.
- source_word: בְּאָזְנֵיהֶם
  choice: sie ihnen vor
  rationale: Die entsprechende Wendung bedeutet wörtlich „in ihre Ohren“. „Ihnen vorlesen“ ist die natürliche deutsche Entsprechung und hält die Wiederholung der Aussage erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige hebräische Wendung „in die Ohren“ wird durch das idiomatische „vorlesen“ wiedergegeben; dadurch ist keine Fußnote erforderlich. Das feminine Pronomen „sie“ bezieht sich auf die im Kontext genannte Schriftrolle.
