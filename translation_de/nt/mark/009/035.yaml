id: MRK.9.35
reference: Mark 9:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: de
  text: 'Und er setzte sich, rief die Zwölf zu sich und sagt zu ihnen: »Wenn jemand der Erste sein will, wird er der Letzte von allen und der Diener aller sein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφώνησεν
  choice: rief … zu sich
  rationale: Das Verb bedeutet hier, dass Jesus die Zwölf zu sich ruft; die Ergänzung »zu sich« macht dies im Deutschen natürlich und eindeutig.
- source_word: πρῶτος
  choice: der Erste
  rationale: Der substantivierte Rangbegriff wird direkt wiedergegeben und bewahrt den Gegensatz zu »der Letzte«.
- source_word: ἔσχατος
  choice: der Letzte von allen
  rationale: Gibt die Rangumkehr und πάντων möglichst unmittelbar wieder.
- source_word: διάκονος
  choice: Diener
  rationale: »Diener« bezeichnet hier jemanden, der anderen dient, ohne einen späteren kirchlichen Amtstitel in den Vers hineinzulesen.
theological_decisions:
- issue: Aussagekraft des Futurs ἔσται
  choice: wird … sein
  alternative: soll … sein / muss … sein
  rationale: Das griechische Futur kann im Zusammenhang normativ wirken, formuliert aber wörtlich eine künftige beziehungsweise folgerichtige Umkehrung. »Wird … sein« bewahrt diese Spannung, statt sie ausdrücklich als Gebot oder Zwang festzulegen.
- issue: Tempuswechsel bei λέγει
  choice: sagt
  alternative: sagte
  rationale: Der griechische Text wechselt nach den Vergangenheitsformen ins historische Präsens. Die deutsche Fassung bildet diesen markierten Wechsel nach, ohne ihn zu glätten.
translation_notes:
  register: Natürliches, gegenwärtiges Standarddeutsch mit würdigem Erzählton. Der auffällige Wechsel zum historischen Präsens in »sagt« folgt bewusst dem griechischen Text; die parallele Formulierung »der Letzte von allen und der Diener aller« erhält die rhetorische Zuspitzung.
