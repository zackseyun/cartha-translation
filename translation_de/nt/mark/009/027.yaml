id: MRK.9.27
reference: Mark 9:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: de
  text: Jesus aber fasste ihn bei der Hand, richtete ihn auf[a], und er stand auf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hob ihn auf“. Das griechische Verb kann auch für das Aufwecken aus dem Schlaf oder das Auferwecken von den Toten gebraucht werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „er erhob sich“ beziehungsweise „er richtete sich auf“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den milden Gegensatz zwischen der Annahme der Umstehenden, der Junge sei tot, und Jesu anschließendem Handeln.
- source_word: κρατήσας
  choice: fasste ihn bei der Hand
  rationale: Gibt das konkrete Ergreifen natürlich und anschaulich wieder; die Hand bleibt als ausdrücklich genanntes Körperteil erhalten.
- source_word: τῆς χειρὸς αὐτοῦ
  choice: bei der Hand
  rationale: Die Genitivkonstruktion bei κρατέω wird im Deutschen idiomatisch mit „jemanden bei der Hand fassen“ wiedergegeben.
- source_word: ἤγειρεν
  choice: richtete ihn auf
  rationale: Bezeichnet hier, dass Jesus den am Boden liegenden Jungen aufrichtet. Die Formulierung ist gegenwartssprachlich und lässt durch die Fußnote die weiter reichende Bedeutung des griechischen Verbs sichtbar.
- source_word: ἀνέστη
  choice: er stand auf
  rationale: Beschreibt als resultierende Handlung, dass der Junge aufsteht; die Wiedergabe ist klar, modern und lexikalisch nah.
theological_decisions:
- issue: Möglicher Anklang an Auferstehungssprache in ἤγειρεν und ἀνέστη
  choice: Im Haupttext die konkrete körperliche Bewegung mit „richtete ihn auf“ und „stand auf“ wiedergeben, den weiteren Bedeutungsraum jedoch in den Fußnoten bewahren.
  alternative: „weckte ihn auf, und er erhob sich“ oder „ließ ihn auferstehen, und er stand auf“
  rationale: Der unmittelbare Zusammenhang schildert das Aufrichten des Jungen nach der Austreibung und behauptet nicht ausdrücklich eine Auferweckung von den Toten. Zugleich können beide griechischen Verben in Auferstehungszusammenhängen stehen; die Fußnoten erhalten diesen möglichen Anklang, ohne ihn dem Vers aufzuzwingen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Fasste ihn bei der Hand“ bewahrt die konkrete Berührung; „stand auf“ vermeidet das heute gehoben oder altertümlich wirkende „er erhob sich“ im Haupttext.
