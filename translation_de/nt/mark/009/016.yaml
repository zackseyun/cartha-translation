  text: καὶ ἐπηρώτησεν ⸀αὐτούς· Τί συζητεῖτε πρὸς ⸀αὑτούς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/016.yaml
  text: And he asked them[a], “What are you discussing with one another?”
translation:
  language: de
  text: 'Und er fragte sie: „Worüber sprecht ihr miteinander?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Worüber streitet ihr miteinander?“ Das Verb kann je nach Zusammenhang ein Gespräch, eine Debatte oder einen Streit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Der Aorist von ἐπερωτάω leitet hier in schlichter Erzählweise eine direkte Frage ein. „fragte“ ist die natürliche moderne deutsche Entsprechung.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bezeichnet eine Mehrzahl, ohne den Bezug in diesem Vers ausdrücklich näher einzugrenzen. „sie“ bewahrt diese Unbestimmtheit.
- source_word: Τί
  choice: Worüber
  rationale: τί fragt hier nach dem Gegenstand des Gesprächs. Im Deutschen gibt „worüber“ dies in Verbindung mit „sprechen“ idiomatisch wieder.
- source_word: συζητεῖτε
  choice: sprecht
  rationale: συζητέω kann je nach Zusammenhang ein Gespräch, eine Debatte oder einen Streit bezeichnen. „sprecht“ wahrt im Haupttext die weitere Bedeutung; die mögliche konflikthafte Nuance wird in der Fußnote genannt.
- source_word: πρὸς αὑτούς
  choice: miteinander
  rationale: Die Wendung bezeichnet die wechselseitige Interaktion innerhalb der angesprochenen Gruppe. „miteinander“ ist dafür natürliches, präzises Deutsch.
- source_word: καὶ
  choice: Und
  rationale: καί verbindet die Handlung schlicht mit dem vorhergehenden Erzählverlauf, ohne eine zusätzliche zeitliche Nuance einzutragen.
