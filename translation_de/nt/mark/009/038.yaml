source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: de
  text: 'Johannes sagte zu ihm: „Lehrer, wir sahen jemanden in deinem Namen Dämonen austreiben, und wir versuchten, ihn daran zu hindern[a], weil er uns nicht folgte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und wir hinderten ihn daran“ bzw. „und wir verboten es ihm“. Das griechische Imperfekt kann eine andauernde, wiederholte oder versuchte Handlung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: Johannes sagte zu ihm
  rationale: ἔφη ist hier das übliche erzählende Redeverb. Das einfache Präteritum klingt im deutschen Erzählstil natürlich; Subjekt und indirektes Objekt werden ausdrücklich wiedergegeben.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: διδάσκαλε ist die direkte Anredeform von „Lehrer“. „Meister“ wäre im heutigen Deutsch weniger präzise, „Rabbi“ stärker interpretierend.
- source_word: εἴδομέν τινα
  choice: wir sahen jemanden
  rationale: τινα bezeichnet unbestimmt eine Person. „Jemanden“ wahrt diese Unbestimmtheit, ohne ein Geschlecht ausdrücklich hinzuzufügen.
- source_word: ἐν τῷ ὀνόματί σου
  choice: in deinem Namen
  rationale: Die feste biblische Wendung bleibt erhalten und kann Handeln unter Berufung auf Jesu Namen und Autorität ausdrücken, ohne dies weiter auszudeuten.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: Dämonen austreiben
  rationale: ἐκβάλλω bezeichnet in diesem Zusammenhang das Austreiben von Dämonen. Die deutsche Infinitivkonstruktion nach „sahen“ gibt das griechische Partizip natürlich wieder.
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: und wir versuchten, ihn daran zu hindern
  rationale: Das Imperfekt kann einen andauernden, wiederholten oder versuchten Vorgang bezeichnen. Die gewählte Formulierung bringt den möglichen Versuchssinn idiomatisch zum Ausdruck; die offenere Alternative wird in der Fußnote genannt.
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: weil er uns nicht folgte
  rationale: ἡμῖν bedeutet ausdrücklich „uns“. Die wörtlich klare Wiedergabe bewahrt den auffälligen Bezug auf die Jüngergruppe.
theological_decisions:
- issue: Bezugspunkt der Nachfolge im Schlusssatz
  choice: „weil er uns nicht folgte“
  alternative: „weil er dir nicht folgte“ oder „weil er nicht zu uns gehörte“
  rationale: Der griechische Text nennt ausdrücklich „uns“ (ἡμῖν). Diese Wiedergabe wahrt die erzählerische Spannung, dass Johannes die Zugehörigkeit zur Jüngergruppe zum Maßstab macht; eine Änderung zu „dir“ würde eine nicht im Wortlaut stehende Deutung eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der geläufige biblische Ausdruck „in deinem Namen“ und die direkte Anrede „Lehrer“ bleiben erhalten. Die Satzstellung ist natürlich, ohne die inhaltliche Spannung des griechischen Textes zu glätten.
