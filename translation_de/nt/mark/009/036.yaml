  naturalness: Der Satz ist grundsätzlich verständlich, aber die Aufteilung mit „Dann sagte er“ ist weniger eng an die griechische Konstruktion gebunden und stilistisch unnötig. Eine durchgehende Verbreihe ist natürlich und bewahrt die Verknüpfung von Umarmen und Sprechen besser. Der Fußnotenmarker sollte vor dem Satzzeichen stehen.
