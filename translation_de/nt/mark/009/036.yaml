  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: de
  text: 'Und er nahm ein Kind, stellte es in ihre Mitte, nahm es in die Arme[a] und sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und umarmte es“. Das griechische Verb kann sowohl das In-die-Arme-Nehmen als auch das Umarmen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: nahm
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Handlung. Die finite Reihung ist im modernen Deutschen natürlich und wahrt die Abfolge.
- source_word: παιδίον
  choice: ein Kind
  rationale: παιδίον bezeichnet hier ein Kind; eine Verkleinerungsnuance muss nicht ausdrücklich mit „kleines Kind“ wiedergegeben werden.
- source_word: ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν
  choice: stellte es in ihre Mitte
  rationale: ἔστησεν ist hier kausativ („zum Stehen bringen, hinstellen“); die Formulierung erhält sowohl die konkrete Handlung als auch den räumlichen Mittelpunkt der Gruppe.
- source_word: ἐναγκαλισάμενος αὐτό
  choice: nahm es in die Arme
  rationale: Das Verb kann das In-die-Arme-Nehmen oder Umarmen bezeichnen. Diese Wiedergabe ist konkret, natürlich und lässt die fürsorgliche Geste erkennen.
- source_word: εἶπεν αὐτοῖς
  choice: Dann sagte er zu ihnen
  rationale: Die Standardbedeutung wird direkt wiedergegeben; „Dann“ macht nach der deutschen Satzteilung die im Griechischen ausgedrückte Handlungsfolge deutlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Partizipienfolge wird zur besseren Lesbarkeit in eine natürliche deutsche Verbfolge und zwei Sätze überführt. Das grammatisch sächliche Pronomen „es“ entspricht dem deutschen Substantiv „Kind“ und trifft keine Aussage über das Geschlecht des Kindes.
