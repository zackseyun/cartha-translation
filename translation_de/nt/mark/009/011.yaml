review_pass:
  verdict: approve
  source_fidelity: Der Text gibt den Sinn von καὶ ἐπηρώτων αὐτὸν λέγοντες angemessen wieder. Das deutsche Präteritum „fragten“ ist im erzählenden Kontext eine idiomatische Wiedergabe des griechischen Imperfekts, ohne eine unzulässige punktuelle Bedeutung zu erzwingen. „Warum“ gibt die hier interrogativ verwendete Einleitung ὅτι treffend wieder; die alternative Nuance ist in der Fußnote sachgerecht vermerkt. „Elija zuerst kommen muss“ entspricht δεῖ ἐλθεῖν πρῶτον vollständig und ohne ergänzende Deutung.
  naturalness: Modernes, klares Standarddeutsch. Der Doppelpunkt ist eine natürliche und knappe Wiedergabe des partizipialen λέγοντες. „Schriftgelehrten“, „Elija“ und die Satzstellung sind idiomatisch und dem würdevollen biblischen Register angemessen.
  terminology: „Schriftgelehrten“ ist für γραμματεῖς historisch und fachsprachlich passend. Die Namensform „Elija“ ist im gegenwärtigen deutschen Bibelgebrauch etabliert. „Muss“ bewahrt die Notwendigkeitsmodalität von δεῖ, ohne deren Grund dogmatisch zu präzisieren.
