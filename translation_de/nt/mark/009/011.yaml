id: MRK.9.11
reference: Mark 9:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: de
  text: 'Und sie fragten ihn: „Warum sagen die Schriftgelehrten, dass Elija zuerst kommen muss?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wie kommt es, dass die Schriftgelehrten sagen, Elija müsse zuerst kommen?“'
    reason: Lexikalisch-syntaktische Alternative für das interrogativ gebrauchte ὅτι; außerdem natürliche deutsche Wiedergabe der abhängigen Aussage.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: sie fragten
  rationale: Der Imperfekt bezeichnet im Erzählzusammenhang den einsetzenden bzw. andauernden Fragevorgang. Im natürlichen deutschen Erzählstil gibt das Präteritum „fragten“ dies angemessen wieder; „sie waren am Fragen“ wäre unidiomatisch.
- source_word: λέγοντες
  choice: durch Doppelpunkt wiedergegeben
  rationale: Das Partizip führt den Wortlaut der Frage ein. Ein Doppelpunkt ist im Deutschen natürlicher als das redundante „und sagten dabei“.
- source_word: Ὅτι
  choice: Warum
  rationale: Im interrogativen Zusammenhang leitet ὅτι idiomatisch eine Frage nach dem Grund bzw. Sachverhalt ein. „Warum“ ist klar und natürlich; die mögliche Nuance „Wie kommt es, dass“ wird in der Fußnote bewahrt.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die etablierte und historisch passende deutsche Bezeichnung für die jüdischen Ausleger und Lehrer der Schriften.
- source_word: Ἠλίαν
  choice: Elija
  rationale: Der Name wird in der im modernen deutschen Bibelgebrauch verbreiteten Form „Elija“ wiedergegeben.
- source_word: δεῖ
  choice: muss
  rationale: „Muss“ bewahrt knapp und deutlich den Ausdruck der Notwendigkeit, ohne deren theologischen Grund näher festzulegen.
- source_word: ἐλθεῖν
  choice: kommen
  rationale: „Kommen“ ist die direkte und im prophetischen Zusammenhang natürliche Wiedergabe des Infinitivs.
- source_word: πρῶτον
  choice: zuerst
  rationale: „Zuerst“ drückt den zeitlichen Vorrang idiomatisch aus.
theological_decisions:
- issue: Bedeutung der durch Ὅτι eingeleiteten Frage
  choice: Direkte Frage mit „Warum“
  alternative: „Wie kommt es, dass die Schriftgelehrten sagen …?“
  rationale: „Warum“ vermittelt die interrogative Funktion klar, ohne eine bestimmte Antwort oder Motivation der Schriftgelehrten vorwegzunehmen. Die sachbezogene Alternativnuance bleibt in der Fußnote sichtbar.
- issue: Art und Bezug von Elijas Kommen
  choice: „Elija zuerst kommen muss“ ohne interpretierende Ergänzung
  alternative: „Elija zuerst wiederkommen muss“ oder „Elija vor dem Messias kommen muss“
  rationale: Der griechische Text nennt weder ausdrücklich ein Wiederkommen noch den Messias als zeitlichen Bezugspunkt. Solche kontextuellen Deutungen werden daher nicht in den Vers eingefügt.
translation_notes:
  register: Moderner, klarer und würdevoller deutscher Erzählstil. Der Doppelpunkt ersetzt das griechische λέγοντες idiomatisch. Die traditionelle Fachbezeichnung „Schriftgelehrte“ bleibt erhalten; unnötige interpretierende Zusätze werden vermieden.
