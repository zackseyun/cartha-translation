  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: de
  text: 'Und er fragte den Vater des Jungen: „Wie lange ist das schon so bei ihm?“ Der antwortete: „Von Kindheit an[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seit seiner Kindheit.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Das Verb bezeichnet hier eine gewöhnliche Frage und wird im modernen Deutschen natürlich mit „fragte“ wiedergegeben.
- source_word: τὸν πατέρα αὐτοῦ
  choice: den Vater des Jungen
  rationale: Das Pronomen bezieht sich im Zusammenhang auf den betroffenen Jungen. „Seinen Vater“ könnte im Deutschen fälschlich auf das Subjekt Jesus bezogen werden; die ausdrückliche Formulierung schafft nur die grammatisch nötige Klarheit.
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: Wie lange … schon?
  rationale: Die griechische Wendung fragt nach der Dauer eines Zustands bis zur Gegenwart. „Wie lange … schon?“ ist dafür die natürliche deutsche Entsprechung.
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: geschieht ihm das
  rationale: Das Perfekt von γίνομαι beschreibt hier ein Geschehen beziehungsweise Leiden, das in der Vergangenheit begonnen hat und weiterhin besteht. Zusammen mit „schon“ wird diese fortdauernde Bedeutung klar ausgedrückt.
- source_word: ὁ δὲ εἶπεν
  choice: Der antwortete
  rationale: δέ führt hier die Reaktion des Vaters weiter. „Der antwortete“ gibt die Gesprächsfolge knapp und idiomatisch wieder, ohne einen stärkeren Gegensatz einzutragen.
- source_word: Ἐκ παιδιόθεν
  choice: Von Kindheit an
  rationale: ἐκ bezeichnet den Ausgangspunkt, und παιδιόθεν verweist auf die Kindheit. „Von Kindheit an“ bewahrt diese Nuance prägnant und natürlich.
