source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Amen, ich sage euch: Einige von denen, die hier stehen,[a] werden ganz gewiss den Tod nicht schmecken,[b] bis sie sehen, dass das Reich Gottes mit Macht gekommen ist.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Einige von den hier Stehenden“.'
    reason: lexical_alternative
  - marker: b
    text: „Den Tod schmecken“ ist eine bildhafte Wendung für „den Tod erfahren“ oder „sterben“.
    reason: lexical_alternative
  - marker: c
    text: Der Text sagt nicht ausdrücklich, auf welches Ereignis sich das machtvolle Kommen des Reiches Gottes bezieht. Vorgeschlagen wurden unter anderem die Verklärung, die Auferstehung und Erhöhung Jesu, Pfingsten, das Gericht über Jerusalem und die künftige Vollendung des Reiches.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt beschreibt das Sprechen aus der Erzählperspektive. Das deutsche Präteritum „sagte“ ist hier natürlicher als die schwerfällige Verlaufsform „war dabei, ihnen zu sagen“; ein wiederholtes Sagen verlangt der Kontext nicht eindeutig.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: „Amen“ bewahrt die markante, feierliche Einleitungsformel Jesu. Die Wendung ist im Deutschen verständlich und vermeidet das heute altertümliche „Wahrlich“.
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: Einige von denen, die hier stehen
  rationale: 'Die Formulierung gibt den partitiven Sinn ausdrücklich wieder: Gemeint sind einige aus der Gruppe der Anwesenden.'
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: werden ganz gewiss den Tod nicht schmecken
  rationale: „Ganz gewiss nicht“ bildet die nachdrückliche Verneinung οὐ μή ab. „Den Tod schmecken“ bewahrt das griechische Bild, das hier „sterben“ beziehungsweise „den Tod erfahren“ bedeutet.
- source_word: ἕως ἂν ἴδωσιν
  choice: bis sie sehen
  rationale: Die Wendung gibt die zukünftige zeitliche Grenze des griechischen ἕως ἄν mit Konjunktiv direkt und natürlich wieder.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist die etablierte deutsche Wiedergabe und lässt sowohl Gottes Herrschaft als auch deren eschatologische Verwirklichung anklingen.
- source_word: ἐληλυθυῖαν
  choice: gekommen ist
  rationale: Das Perfektpartizip bezeichnet das Reich als bereits in Macht gekommen und gegenwärtig wirksam. Der deutsche dass-Satz gibt diesen resultativen Aspekt idiomatisch wieder.
- source_word: ἐν δυνάμει
  choice: mit Macht
  rationale: „Mit Macht“ ist im Deutschen eine natürliche Wiedergabe und bezeichnet die machtvolle Erscheinungsweise, ohne sie auf ein bestimmtes Ereignis festzulegen.
theological_decisions:
- issue: Zeitpunkt und Bezug des Kommens des Reiches Gottes mit Macht
  choice: Die Aussage bleibt offen und wird keinem bestimmten Ereignis zugeordnet.
  alternative: Verklärung, Auferstehung und Erhöhung Jesu, Pfingsten, Gericht über Jerusalem oder die künftige Vollendung des Reiches
  rationale: Der griechische Text nennt das gemeinte Ereignis nicht ausdrücklich. Die Übersetzung bewahrt daher die sachliche und eschatologische Spannung, statt eine der verbreiteten Deutungen in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Formel „Amen, ich sage euch“ bleibt wegen ihrer Eigenart und Verständlichkeit erhalten. Satzbau und Tempus sind gegenüber einer formalen Nachbildung des Griechischen behutsam idiomatisiert.
