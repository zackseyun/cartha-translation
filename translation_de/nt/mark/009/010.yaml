id: MRK.9.10
reference: Mark 9:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον ἐκράτησαν πρὸς ἑαυτοὺς συζητοῦντες τί ἐστιν τὸ ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: de
  text: Und sie behielten diese Aussage[a] für sich und besprachen miteinander, was es bedeutet, von den Toten aufzuerstehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dieses Wort; oder: diesen Ausspruch.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: aus den Toten aufzuerstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν λόγον
  choice: diese Aussage
  rationale: λόγος bezeichnet hier die unmittelbar zuvor geäußerte Ankündigung Jesu. „Diese Aussage“ ist im Deutschen natürlicher als „das Wort“ und hält den Bezug zum vorangehenden Vers deutlich.
- source_word: ἐκράτησαν πρὸς ἑαυτούς
  choice: behielten … für sich
  rationale: Die Verbindung gibt idiomatisch wieder, dass die Jünger die Aussage in ihrem eigenen Kreis behielten. Zugleich lässt „behielten“ anklingen, dass sie die Aussage festhielten, statt sie einfach beiseitezuschieben.
- source_word: συζητοῦντες
  choice: besprachen miteinander
  rationale: Das Partizip beschreibt eine gemeinsame, prüfende Erörterung. „Besprachen“ wahrt die Offenheit des Tons, ohne unnötig Streit oder scharfen Widerspruch zu unterstellen.
- source_word: τί ἐστιν
  choice: was es bedeutet
  rationale: Wörtlich steht „was es ist“. Im Deutschen bringt „was es bedeutet“ idiomatisch zum Ausdruck, dass die Jünger den Sinn der Wendung zu verstehen suchen.
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: von den Toten aufzuerstehen
  rationale: Der substantivierte Infinitiv benennt den Gegenstand ihrer Erörterung. Die gewählte Formulierung ist klares, geläufiges Deutsch und bewahrt die Auferstehungsaussage; die genauere Nuance von ἐκ νεκρῶν wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Auferstehungssprache in der ratlosen Erörterung der Jünger
  choice: von den Toten aufzuerstehen
  alternative: aus der Mitte der Toten aufzuerstehen
  rationale: Die Übersetzung benennt Auferstehung klar, erklärt aber nicht vorweg, wie die Jünger Jesu Aussage hätten verstehen sollen. Ihre im Text erkennbare Unsicherheit und damit die theologische Spannung bleiben bestehen.
- issue: Bedeutung von ἐκράτησαν πρὸς ἑαυτούς
  choice: behielten diese Aussage für sich
  alternative: hielten an dieser Aussage fest und besprachen sie untereinander
  rationale: Der Zusammenhang mit Jesu Schweigegebot legt das Bewahren im eigenen Kreis nahe. Weil die griechische Formulierung zugleich ein Festhalten beziehungsweise Bewahren der Aussage zulässt, wird diese Nuance nicht durch eine stärker ausdeutende Formulierung ausgeschlossen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Aussage“ und „besprachen miteinander“ vermeiden sowohl altertümliche als auch unnötig fachsprachliche Formulierungen.
