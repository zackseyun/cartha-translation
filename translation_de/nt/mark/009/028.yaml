  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: de
  text: 'Als er ins Haus gekommen war, fragten ihn seine Jünger abseits von den anderen: »Warum konnten wir ihn[a] nicht austreiben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich der unreine Geist. Das griechische Pronomen steht im Neutrum; möglich ist auch ein Bezug auf den Jungen. Im Deutschen lautet das Pronomen in beiden Fällen »ihn«.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ εἰς οἶκον
  choice: Als er ins Haus gekommen war
  rationale: Der Genitivus absolutus mit Aoristpartizip gibt den zeitlichen Hintergrund an; das Plusquamperfekt macht deutlich, dass das Eintreten vor der Frage geschah. »Ins Haus« ist im deutschen Erzählstil natürlich und legt nicht unnötig fest, um welches Haus es sich handelte.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: »Jünger« ist im Evangelienkontext die geläufige und sachlich passende Wiedergabe für μαθηταί und bewahrt den Gedanken persönlicher Nachfolge und Unterweisung.
- source_word: κατ’ ἰδίαν
  choice: als sie unter sich waren
  rationale: Die Formulierung gibt die Absonderung von der Öffentlichkeit natürlich wieder. Sie vermeidet das bei einer Gruppe missverständliche »unter vier Augen«.
- source_word: ἐπηρώτων αὐτόν
  choice: fragten ihn
  rationale: Das Imperfekt beschreibt die Fragehandlung im Verlauf. Im Deutschen ist das einfache Präteritum hier idiomatischer als eine künstliche Verlaufsform.
- source_word: Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν
  choice: Warum konnten wir nicht
  rationale: Ὅτι hat in dieser Frage kausalen Sinn; »warum« ist die natürliche deutsche Wiedergabe. Das ausdrücklich gesetzte ἡμεῖς wird durch die Verbform und den Kontext hinreichend getragen, ohne ein unnatürlich betontes »wir« einzufügen.
- source_word: ἐκβαλεῖν αὐτό
  choice: ihn auszutreiben
  rationale: ἐκβάλλω bezeichnet in diesem Zusammenhang das Austreiben eines unreinen Geistes. Das deutsche Maskulinum »ihn« richtet sich grammatisch nach »Geist«, obwohl das griechische Pronomen Neutrum ist; die mögliche Bezugsmehrdeutigkeit wird in der Fußnote offengelegt.
theological_decisions:
- issue: Bezug des abschließenden Pronomens αὐτό
  choice: Im Haupttext bezieht sich »ihn« am ehesten auf den unreinen Geist.
  alternative: Das Pronomen kann auf den betroffenen Jungen bezogen werden.
  rationale: Das griechische Neutrum passt besonders gut zu πνεῦμα, »Geist«, das im Griechischen sächlich ist, und das Verb »austreiben« bezeichnet unmittelbar die exorzistische Handlung. Da auch ein Bezug auf den Jungen sprachlich erwogen werden kann und das Deutsche die griechische Genusunterscheidung hier nicht bewahrt, wird die Alternative nicht stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die private Situation wird mit »als sie unter sich waren« verständlich ausgedrückt; die Frage bleibt knapp und mündlich. Der Fußnotenmarker steht unmittelbar beim mehrdeutigen Pronomen.
