source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: de
  text: Und wenn dein Fuß dich zu Fall bringt, hau ihn ab. Es ist besser für dich, lahm in das Leben einzugehen, als mit beiden Füßen in die Gehenna[a] geworfen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Hölle“. Der griechische Ausdruck lautet Gehenna; er erinnert an das Hinnomtal und dessen Verbindung mit dem göttlichen Gericht.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: dich zu Fall bringt
  rationale: Die Wendung bewahrt das Bild des Stolperns beziehungsweise Fallens und lässt zugleich dessen übertragenen Sinn – zur Sünde oder zum Abfall verleiten – offen.
- source_word: ἀπόκοψον
  choice: hau ihn ab
  rationale: Der kräftige Imperativ gibt die anschauliche, drastische Formulierung des griechischen Textes wieder, ohne sie abzuschwächen.
- source_word: καλόν ἐστίν
  choice: Es ist besser
  rationale: In der Vergleichskonstruktion mit ἤ hat καλόν idiomatisch den Sinn „besser“.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: in das Leben hineinzugehen
  rationale: Die Formulierung erhält das Bild des Eintretens und ergänzt nicht „ewig“, da im griechischen Text nur ζωή steht.
- source_word: χωλὸν
  choice: lahm
  rationale: χωλός bezeichnet hier passend zum erwähnten Fuß eine Gehbehinderung; „lahm“ ist präzise und knapp.
- source_word: βληθῆναι
  choice: geworfen zu werden
  rationale: Die passive Infinitivform von βάλλω wird direkt und in heutigem Deutsch wiedergegeben.
- source_word: γέενναν
  choice: Gehenna
  rationale: Die Wiedergabe behält den spezifischen griechischen Begriff mit seinem Bezug zum Hinnomtal und zum göttlichen Gericht bei, statt ihn im Haupttext durch den allgemeineren traditionellen Begriff „Hölle“ zu ersetzen.
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: beide Füße zu haben
  rationale: Diese natürliche deutsche Formulierung gibt den Besitz der zwei Füße wieder und wahrt den Gegensatz zu „lahm“.
theological_decisions:
- issue: Wiedergabe von γέεννα im Zusammenhang des Gerichts
  choice: Gehenna
  alternative: Hölle
  rationale: Der griechische Text verwendet den spezifischen Ausdruck γέεννα. „Gehenna“ bewahrt dessen geschichtliche und jüdisch-eschatologische Bezüge; die geläufige Deutung „Hölle“ wird in der Fußnote genannt, ohne den Quellbegriff im Haupttext zu verallgemeinern.
- issue: Bedeutungsumfang von σκανδαλίζῃ
  choice: dich zu Fall bringt
  alternative: dich zur Sünde verleitet
  rationale: Die gewählte Formulierung wahrt die Bildsprache und lässt offen, ob besonders das Sündigen, das Abfallen oder allgemeiner ein geistliches Zu-Fall-Kommen gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drastische Körpermetaphorik und die eschatologische Spannung des Ausgangstextes bleiben erhalten; weder „Leben“ noch „Gehenna“ werden im Haupttext dogmatisch erweitert.
