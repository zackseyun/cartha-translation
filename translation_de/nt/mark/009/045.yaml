- from: Und wenn dein Fuß dich zu Fall bringt, hau ihn ab. Es ist besser für dich, lahm in das Leben hineinzugehen, als beide Füße zu haben und in die Gehenna[a] geworfen zu werden.
  to: Und wenn dein Fuß dich zu Fall bringt, hau ihn ab. Es ist besser für dich, lahm in das Leben einzugehen, als mit beiden Füßen in die Gehenna[a] geworfen zu werden.
  rationale: Die Revision beschränkt sich auf zwei stilistische Glättungen. Sie erhält die Metaphorik von „zu Fall bringt“, die Drastik von „hau ihn ab“, die eschatologisch offene Bezeichnung „Leben“ und den spezifischen Ausdruck „Gehenna“. Die Fußnotenverankerung bleibt unverändert und korrekt an γέεννα/„Gehenna“ angebracht.
