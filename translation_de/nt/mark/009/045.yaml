  terminology: „Gehenna“ ist als Haupttextwiedergabe sachgerecht und wahrt die Spezifität von γέεννα. Die Fußnote mit „Hölle“ als geläufiger Alternativwiedergabe ist angemessen. „Hinnomtal“ und „göttliches Gericht“ sind terminologisch unproblematisch.
