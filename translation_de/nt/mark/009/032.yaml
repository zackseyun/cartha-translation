  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα, καὶ ἐφοβοῦντο αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/032.yaml
  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: de
  text: Doch sie verstanden diese Aussage[a] nicht und fürchteten sich, ihn zu fragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wort“ oder „der Ausspruch“; das griechische ῥῆμα kann ein gesprochenes Wort, einen Ausspruch oder eine Aussage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Doch sie
  rationale: δέ stellt hier einen milden Gegensatz zu Jesu unmittelbar vorausgehender Ankündigung her; das substantivierte Artikelwort verweist im Zusammenhang auf die Jünger und wird im Deutschen natürlich mit „sie“ wiedergegeben.
- source_word: ἠγνόουν
  choice: verstanden … nicht
  rationale: ἀγνοέω bezeichnet hier das Nichtverstehen einer Äußerung. Das Imperfekt beschreibt ihren anhaltenden Zustand, der im idiomatischen Deutschen durch das Präteritum angemessen ausgedrückt wird.
- source_word: τὸ ῥῆμα
  choice: diese Aussage
  rationale: ῥῆμα bezeichnet hier das soeben von Jesus Gesagte. „Aussage“ ist im heutigen Deutsch klar; „diese“ stellt den natürlichen Rückbezug auf die vorhergehende Ankündigung her, ohne zusätzlichen Inhalt einzuführen.
- source_word: ἐφοβοῦντο
  choice: fürchteten sich
  rationale: Das Imperfekt bezeichnet einen fortdauernden Zustand der Furcht. Die reflexive Form ist eine natürliche und würdige deutsche Wiedergabe.
- source_word: αὐτὸν ἐπερωτῆσαι
  choice: ihn danach zu fragen
  rationale: ἐπερωτάω bedeutet „fragen“ oder „befragen“. „Danach“ macht im Deutschen idiomatisch deutlich, dass die Frage dem Inhalt der Aussage gelten sollte; das Pronomen αὐτόν bezieht sich auf Jesus.
