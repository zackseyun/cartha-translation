  naturalness: „Elia ist zwar zuerst gekommen und stellt alles wieder her“ ist modernes, verständliches Standarddeutsch und bildet die Abfolge von vorausgehendem Kommen und gegenwärtiger Wiederherstellung klarer ab. Die Formel „wie steht über den Menschensohn geschrieben“ ist im biblischen Register verständlich und akzeptabel.
  terminology: „Elia“, „Menschensohn“, „alles wieder her“ und „verachtet werden“ sind angemessen. „Verachtet werden“ deckt ἐξουδενηθῇ als „als nichts gelten/verächtlich behandelt werden“ hinreichend ab; eine Fußnote ist nicht erforderlich.
