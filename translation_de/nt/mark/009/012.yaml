source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Elia ist zwar zuerst gekommen und stellt alles wieder her. Und wie steht über den Menschensohn geschrieben, dass er viel leiden und verachtet werden soll?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: Er sagte zu ihnen
  rationale: Die schlichte Erzählform gibt das gewöhnliche griechische Redeverb und den Adressaten natürlich und genau wieder.
- source_word: Ἠλίας μὲν ἐλθὼν πρῶτον
  choice: Elia kommt zwar zuerst
  rationale: Die finite deutsche Form ist idiomatischer als eine wörtliche Partizipialkonstruktion. »zwar« bildet μέν ab und lässt die gedankliche Spannung zum folgenden Satz bestehen, ohne sie ausdrücklich aufzulösen.
- source_word: ἀποκαθιστάνει πάντα
  choice: stellt alles wieder her
  rationale: Die Wendung bewahrt das Präsens und den umfassenden Sinn von πάντα; »wiederherstellen« gibt die Rückführung in den rechten beziehungsweise früheren Zustand wieder.
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: wie steht über den Menschensohn geschrieben
  rationale: »steht geschrieben« ist die natürliche deutsche Formel für einen Schriftbezug; ἐπί wird als »über« im Sinn von »betreffend« wiedergegeben.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: Der etablierte und theologisch bedeutsame Titel wird beibehalten und nicht deutend umschrieben.
- source_word: ἵνα πολλὰ πάθῃ
  choice: dass er viel leiden ... soll
  rationale: ἵνα bezeichnet hier den Inhalt dessen, was geschrieben steht. Das deutsche »soll« drückt die schriftgemäße Erwartung aus; »viel leiden« ist im Deutschen natürlicher als »viele Dinge leiden«.
- source_word: ἐξουδενηθῇ
  choice: verachtet werden
  rationale: Das Verb bezeichnet, jemanden für nichts zu achten beziehungsweise geringschätzig zu behandeln. »verachtet werden« ist knapp, würdig und semantisch treffend.
theological_decisions:
- issue: Zusammenhang zwischen Elias Wiederherstellung und dem Leiden des Menschensohnes
  choice: Die zweite Aussage bleibt eine echte rhetorische Frage.
  alternative: 'Den Gegensatz erklärend ergänzen, etwa: »Doch wie kann dann geschrieben stehen ...?«'
  rationale: Der griechische Text stellt Wiederherstellung und Leiden unvermittelt nebeneinander. Die Übersetzung bewahrt diese Spannung und fügt keine harmonisierende Erklärung ein.
- issue: Bezug des Titels »Menschensohn«
  choice: Der Titel wird unverändert beibehalten.
  alternative: »der Messias« oder »der Menschliche«
  rationale: Eine interpretierende Auflösung würde Bedeutungsdimensionen festlegen, die der griechische Ausdruck selbst offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch eine idiomatische finite Wiedergabe des Partizips geglättet. Keine Fußnote ist nötig, da »verachtet werden« die Bedeutung von ἐξουδενηθῇ prägnant wiedergibt.
