id: MRK.9.23
reference: Mark 9:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: de
  text: 'Jesus aber sagte zu ihm: „‚Wenn du kannst‘?[a] Alles ist möglich für den, der glaubt.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Das ‚Wenn du kannst‘?“ Jesus greift die Worte des Vaters aus dem vorigen Vers auf und stellt sie infrage.'
    reason: lexical_alternative
  - marker: b
    text: „Der glaubt“ kann auch mit „der vertraut“ oder „der Glauben hat“ wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: „Wenn du kannst“?
  rationale: Der substantivierende Artikel τό kennzeichnet die Wendung als pointierte Wiederaufnahme der Worte des Vaters aus dem vorigen Vers. Die zitierende Rückfrage gibt diese idiomatische Kraft im heutigen Deutsch natürlich wieder.
- source_word: δύνῃ
  choice: du kannst
  rationale: δύναμαι bedeutet hier „fähig sein, können“; „du kannst“ ist in direkter Rede die natürliche deutsche Wiedergabe.
- source_word: πάντα
  choice: alles
  rationale: Das substantivisch gebrauchte Neutrum Plural bezeichnet umfassend „alles“; diese Formulierung bewahrt die knappe rhetorische Weite des Griechischen.
- source_word: δυνατά
  choice: ist möglich
  rationale: δυνατός bezeichnet in dieser prädikativen Konstruktion das, was möglich ist. Wegen des deutschen Sammelpronomens „alles“ steht das Prädikat im Singular.
- source_word: τῷ πιστεύοντι
  choice: für den, der glaubt
  rationale: Das substantivierte Präsenspartizip bezeichnet allgemein die glaubende Person. Die Formulierung bewahrt den verbalen Charakter und ist natürlicher als „für den Glaubenden“.
- source_word: πιστεύοντι
  choice: glaubt
  rationale: πιστεύω wird hier mit „glauben“ wiedergegeben. Je nach hervorgehobenem Beziehungsaspekt sind auch „vertrauen“ oder „Glauben haben“ möglich.
theological_decisions:
- issue: Reichweite der Aussage „Alles ist möglich“
  choice: Die uneingeschränkt klingende Aussage bleibt ohne erklärenden Zusatz im Haupttext stehen.
  alternative: „Mit Gott ist für den, der glaubt, alles möglich“ oder eine ausdrückliche Beschränkung auf Gottes Macht.
  rationale: Der griechische Text fügt an dieser Stelle weder „mit Gott“ noch eine andere Einschränkung hinzu. Die knappe Aussage und ihre theologische Spannung werden deshalb nicht durch eine Auslegung im Haupttext aufgelöst.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die zitierende Rückfrage macht Jesu pointierte Wiederaufnahme hörbar; die absolute Form der anschließenden Aussage bleibt erhalten.
