id: MRK.9.47
reference: Mark 9:47
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: de
  text: Und wenn dein Auge dich zu Fall bringt, wirf es weg. Es ist besser für dich, mit nur einem Auge in das Reich Gottes einzugehen, als mit zwei Augen in die Gehenna[a] geworfen zu werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Hölle«. Das griechische Wort lautet »Gehenna«; es geht auf das Tal Hinnom zurück und wird für das endzeitliche Gericht gebraucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: dich zu Fall bringt
  rationale: Bewahrt das griechische Bild des Stolperns beziehungsweise Fallens und lässt zugleich den moralischen Ernst des Zusammenhangs erkennen, ohne das Verb auf »zur Sünde verführen« zu verengen.
- source_word: ἔκβαλε
  choice: wirf es weg
  rationale: Gibt den kräftigen Imperativ von ἐκβάλλω unmittelbar und in natürlichem modernem Deutsch wieder; spezifischere Wiedergaben wie »reiß es aus« würden eine nicht ausdrücklich im Verb enthaltene Art der Entfernung ergänzen.
- source_word: καλόν ... ἤ
  choice: es ist besser ... als
  rationale: Obwohl καλόν für sich »gut« bedeutet, verlangt die Gegenüberstellung mit ἤ im Deutschen idiomatisch eine vergleichende Formulierung.
- source_word: μονόφθαλμον
  choice: mit nur einem Auge
  rationale: Gibt »einäugig« konkret und im Satzfluss natürlich wieder; »nur« verdeutlicht den Gegensatz zu den anschließend genannten zwei Augen.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die geläufige, transparente und theologisch offene deutsche Wiedergabe der griechischen Wendung.
- source_word: βληθῆναι
  choice: geworfen zu werden
  rationale: Entspricht dem passiven Infinitiv von βάλλω und erhält die gewaltsame Bildsprache.
- source_word: γέενναν
  choice: Gehenna
  rationale: Bewahrt den spezifischen griechischen Ausdruck und seine Verwurzelung im Tal Hinnom, statt ihn ohne Kennzeichnung in den allgemeineren deutschen Begriff »Hölle« aufgehen zu lassen.
theological_decisions:
- issue: Wiedergabe von γέεννα im Gerichtszusammenhang
  choice: Gehenna
  alternative: Hölle
  rationale: Der Ausgangstext verwendet den spezifischen Begriff γέεννα. Die Transliteration bewahrt dessen geschichtliche und eschatologische Bezüge; die traditionelle deutsche Wiedergabe wird zur Verständlichkeit in der Fußnote genannt.
- issue: Bedeutungsumfang von σκανδαλίζω
  choice: zu Fall bringen
  alternative: zur Sünde verführen
  rationale: Die gewählte Formulierung erhält die Stolper- und Fallmetapher und schließt moralisches Versagen im Kontext ein, ohne die genuine Bildhaftigkeit durch eine ausschließlich deutende Wiedergabe zu ersetzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die scharfe Bildsprache des Spruchs bleibt erhalten; traditionelle theologische Terminologie wird dort verwendet, wo sie den griechischen Ausdruck transparent wiedergibt.
