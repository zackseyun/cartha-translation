  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: de
  text: 'Jesus aber sagte: „Hindert ihn nicht! Denn niemand vollbringt in meinem Namen eine Machttat[a] und wird nicht so bald Böses über mich sagen[b] können.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „ein Wunder“ oder „eine Krafttat“; das griechische Wort bezeichnet Macht beziehungsweise eine machtvolle Tat.
    reason: lexical_alternative
  - marker: b
    text: 'Oder „mich schmähen“ oder „mich verleumden“; wörtlich: „Böses über mich sagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: Hindert ihn nicht
  rationale: Der verneinte Präsensimperativ bezeichnet hier das Unterbinden der Tätigkeit des Mannes. „Hindert ihn nicht“ ist idiomatisch und bewahrt den Sinn von κωλύω, ohne übermäßig förmlich zu wirken.
- source_word: δύναμιν
  choice: Machttat
  rationale: δύναμις bezeichnet hier eine machtvolle, außergewöhnliche Tat. „Machttat“ bewahrt den Bezug zu Kraft und Macht besser als das enger deutende „Wunder“ und ist im Deutschen verständlich.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die geläufige Wendung gibt Handeln unter Berufung auf Jesu Namen beziehungsweise Autorität angemessen wieder, ohne diese Bedeutung auszuformulieren.
- source_word: ταχὺ
  choice: kurz darauf
  rationale: Das Adverb bezeichnet hier zeitliche Nähe. „Kurz darauf“ klingt im Satz natürlicher als „schnell“ und vermeidet eine Deutung als Art und Weise des Redens.
- source_word: κακολογῆσαί με
  choice: Böses über mich sagen
  rationale: 'Die Formulierung wahrt die Breite des Verbs: abfällig oder verleumderisch über jemanden reden. Sie legt sich nicht unnötig auf den engeren Sinn „verleumden“ oder „verfluchen“ fest.'
- source_word: οὐδεὶς γάρ ἐστιν ὃς … καὶ δυνήσεται
  choice: Denn niemand … und kann
  rationale: Die präsentische deutsche Aussage gibt den allgemeinen Grundsatz der griechischen Konstruktion natürlich wieder; „kann“ bewahrt ausdrücklich den Gedanken der Fähigkeit aus δυνήσεται.
theological_decisions:
- issue: Art der im Namen Jesu vollbrachten Tat
  choice: „Machttat“ statt „Wunder“
  alternative: „Wunder“ oder „Krafttat“
  rationale: „Machttat“ lässt den semantischen Umfang von δύναμις offen und vermeidet eine engere moderne Definition des Wunderbegriffs.
- issue: Verhältnis des Handelnden zu Jesus
  choice: Die Aussage bleibt auf sein Handeln im Namen Jesu und sein anschließendes Reden über Jesus begrenzt.
  alternative: Eine Paraphrase, die ihn ausdrücklich als wahren Jünger oder als bloßen Opportunisten einordnet.
  rationale: Der Vers fällt kein umfassendes Urteil über Jüngerschaft oder Rechtgläubigkeit. Eine solche Folgerung soll nicht in die Übersetzung eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Ausruf nach dem Verbot entspricht der direkten imperativischen Rede. Die koordinierte Formulierung folgt dem griechischen Gedankengang, klingt aber natürlicher als zwei deutsche Futurformen.
