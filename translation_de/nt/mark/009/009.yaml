source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: de
  text: Als sie vom Berg hinabstiegen, wies er sie nachdrücklich an, niemandem zu erzählen, was sie gesehen hatten – außer dann, wenn[a] der Menschensohn von den Toten[b] auferstanden ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sinngemäß und im Deutschen geläufiger: „bis der Menschensohn von den Toten auferstanden ist“.'
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher: „aus der Mitte der Toten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Als sie vom Berg hinabstiegen
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig ablaufende Handlung. Die gewählte Formulierung gibt den fortlaufenden Abstieg in natürlichem Deutsch wieder.
- source_word: διεστείλατο αὐτοῖς
  choice: schärfte er ihnen ein
  rationale: Das Verb bezeichnet eine nachdrückliche Anweisung. „Schärfte … ein“ bewahrt diese Stärke, ohne altertümlich zu klingen.
- source_word: ἵνα μηδενὶ … διηγήσωνται
  choice: niemandem zu erzählen
  rationale: Die Infinitivkonstruktion gibt Inhalt und Verneinung der Anweisung idiomatisch wieder. „Erzählen“ passt zum narrativen Gehalt von διηγέομαι.
- source_word: ἃ εἶδον
  choice: was sie gesehen hatten
  rationale: Das deutsche Plusquamperfekt macht deutlich, dass das Gesehene der Anweisung zeitlich vorausging.
- source_word: εἰ μὴ ὅταν
  choice: außer wenn
  rationale: Die Formulierung folgt der Ausnahme-Konstruktion des Griechischen enger als das idiomatischere „bis“ und bewahrt deren ungewöhnliche zeitliche Spannung.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die geläufige deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung sowie ihre möglichen Anklänge an Daniel.
- source_word: ἐκ νεκρῶν
  choice: von den Toten
  rationale: Dies ist die natürliche und etablierte deutsche Formulierung für die Auferstehung; eine Fußnote weist auf die genauere räumlich-partitive Nuance des Griechischen hin.
- source_word: ἀναστῇ
  choice: auferstanden ist
  rationale: Der Aorist Konjunktiv nach ὅταν verweist auf ein künftig eingetretenes und dann abgeschlossenes Ereignis. Das deutsche Perfekt bringt dies in einem Zukunftssatz natürlich zum Ausdruck.
theological_decisions:
- issue: Wiedergabe von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Menschliche / der Mensch
  rationale: „Menschensohn“ erhält den Titelcharakter und die biblischen Bezüge, ohne die Aussage christologisch weiter auszudeuten.
- issue: Zeitliche Bedeutung von εἰ μὴ ὅταν
  choice: außer wenn der Menschensohn … auferstanden ist
  alternative: bis der Menschensohn … auferstanden ist
  rationale: Die Hauptfassung bewahrt die griechische Ausnahmeform. Die Fußnote bietet die im Deutschen idiomatischere, sachlich naheliegende zeitliche Wiedergabe, ohne die Spannung stillschweigend aufzulösen.
- issue: Nuance von ἐκ νεκρῶν
  choice: von den Toten
  alternative: aus der Mitte der Toten
  rationale: Die Hauptfassung bleibt natürlich und verständlich; die Fußnote bewahrt die mögliche Vorstellung des Hervorkommens aus der Gemeinschaft der Toten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Schärfte … ein“ vermittelt den Nachdruck des Befehls; der Gedankenstrich lässt die ungewöhnliche Ausnahmeform verständlich hervortreten. Die Fußnoten stehen unmittelbar bei den jeweils betroffenen Formulierungen am Satzende.
