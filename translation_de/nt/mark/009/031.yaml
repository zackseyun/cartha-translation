reference: Mark 9:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: de
  text: 'Denn er lehrte seine Jünger und sagte zu ihnen: „Der Menschensohn wird in die Hände von Menschen ausgeliefert, und sie werden ihn töten. Und nachdem er getötet worden ist, wird er nach drei Tagen auferstehen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier „nach drei Tagen“, nicht „am dritten Tag“.
    reason: Die Fußnote hält die in diesem Vers verwendete Zeitangabe fest, ohne die Partizipialkonstruktion ungenau als wörtliche Übersetzung auszugeben.
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Der Imperfekt beschreibt die fortdauernde Lehrtätigkeit im erzählerischen Hintergrund; das deutsche Präteritum gibt dies im Zusammenhang natürlich wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Konjunktion kennzeichnet eine Begründung beziehungsweise Erläuterung des vorausgehenden Geschehens.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ ist die etablierte und im Evangelienkontext angemessene Wiedergabe für μαθηταί.
- source_word: ἔλεγεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Das zweite Imperfekt bezeichnet die begleitende, wiederholte Mitteilung; im Deutschen ist die schlichte erzählerische Form natürlich.
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die traditionelle deutsche Wiedergabe bewahrt die feste Selbstbezeichnung und ihre möglichen Anklänge an Daniel.
- source_word: παραδίδοται
  choice: wird … ausgeliefert werden
  rationale: „Ausliefern“ lässt den nicht genannten Urheber und das breite Bedeutungsspektrum des Passivs offen; das deutsche Futur macht den im Kontext bevorstehenden Vorgang deutlich.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: in die Hände von Menschen
  rationale: Die konkrete Macht- und Gewaltmetapher „in die Hände“ sowie der Kontrast zwischen dem Menschensohn und Menschen bleiben erhalten.
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: sie werden ihn töten
  rationale: Die direkte Wiedergabe erhält das unbestimmte pluralische Subjekt und die Schärfe der Aussage.
- source_word: ἀποκτανθεὶς
  choice: nachdem er getötet worden ist
  rationale: Der passive Aoristpartizip bezeichnet eine dem Auferstehen vorausgehende Handlung; der deutsche Temporalsatz gibt Abfolge und Passiv klar wieder.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: nach drei Tagen
  rationale: μετά mit Akkusativ bedeutet hier regulär „nach“; die Formulierung wird nicht an „am dritten Tag“ angeglichen.
- source_word: ἀναστήσεται
  choice: wird er auferstehen
  rationale: Das griechische Futur Medium wird passend intransitiv wiedergegeben und nicht in ein Passiv umgedeutet.
theological_decisions:
- issue: Bedeutungsumfang und Agens von παραδίδοται
  choice: wird … ausgeliefert werden
  alternative: wird verraten / wird übergeben
  rationale: Das griechische Passiv nennt den Handelnden nicht und kann Verrat, Übergabe und göttliche Zulassung umfassen. „Ausgeliefert“ vermeidet eine vorschnelle Festlegung.
- issue: Kontrast zwischen Ὁ υἱὸς τοῦ ἀνθρώπου und ἀνθρώπων
  choice: der Menschensohn … in die Hände von Menschen
  alternative: der Menschensohn … in menschliche Hände
  rationale: Die gewählte Form bewahrt die lexikalische Wiederaufnahme von „Mensch“ und zugleich die konkrete Wendung „in die Hände“.
- issue: Zeitangabe μετὰ τρεῖς ἡμέρας
  choice: nach drei Tagen
  alternative: am dritten Tag / binnen drei Tagen
  rationale: Die Übersetzung folgt der Formulierung dieses Verses und harmonisiert sie nicht stillschweigend mit anders formulierten Leidensankündigungen.
- issue: Diathese von ἀναστήσεται
  choice: wird auferstehen
  alternative: wird auferweckt werden
  rationale: Die intransitive Wiedergabe entspricht der hier verwendeten griechischen Form, ohne damit andere neutestamentliche Aussagen über Gottes Handeln auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit vertrauter biblischer Terminologie. Die Satzstruktur ist gut verständlich, ohne die Wiederholung, das Passiv oder die zeitliche Spannung des griechischen Textes zu glätten.
