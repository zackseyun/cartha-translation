id: MRK.9.17
reference: Mark 9:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: de
  text: 'Da antwortete ihm einer aus der Menge: »Lehrer, ich habe meinen Sohn zu dir gebracht; er hat einen stummen Geist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Das übliche deutsche Erzählverb gibt den Aorist und die Reaktion auf die vorausgehende Frage natürlich wieder.
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: einer aus der Menge
  rationale: Bewahrt den partitiven Ausdruck und ergänzt nicht ausdrücklich »ein Mann«, obwohl dies im Kontext naheliegt.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Gibt die Anrede präzise und in modernem Deutsch verständlich wieder, ohne die zusätzliche Autoritätsnuance von »Meister« einzutragen.
- source_word: ἤνεγκα
  choice: ich habe … gebracht
  rationale: Das deutsche Perfekt ist in direkter Rede natürlich und bezeichnet die bereits vollzogene Handlung mit Gegenwartsbezug.
- source_word: υἱόν
  choice: Sohn
  rationale: Bewahrt die ausdrücklich bezeichnete familiäre Beziehung; »Kind« oder »Junge« wäre weniger genau.
- source_word: πρὸς σέ
  choice: zu dir
  rationale: Ist nach »bringen« die natürliche Wiedergabe von πρός mit Akkusativ.
- source_word: ἔχοντα
  choice: er hat
  rationale: Der auf »meinen Sohn« bezogene Partizipialsatz wird als eigener deutscher Hauptsatz verständlich wiedergegeben, ohne ihn kausal als »weil« festzulegen.
- source_word: πνεῦμα ἄλαλον
  choice: einen stummen Geist
  rationale: Die direkte Wiedergabe bewahrt sowohl den Geist als handelnde beziehungsweise besitzergreifende Größe als auch die Mehrdeutigkeit, ob ἄλαλον den Geist selbst oder seine Wirkung auf den Sohn beschreibt.
theological_decisions:
- issue: Bedeutung von πνεῦμα im Exorzismuskontext
  choice: Geist, wobei der Kontext einen bösen beziehungsweise dämonischen Geist nahelegt
  alternative: böser Geist; Dämon
  rationale: Der unmittelbare Kontext legt einen schädigenden, besitzergreifenden Geist nahe, doch der griechische Vers sagt lediglich »Geist«. Daher wird weder »böse« noch »Dämon« ergänzt.
- issue: Bezug und Wirkung von ἄλαλον
  choice: stummer Geist
  alternative: ein Geist, der ihn stumm macht
  rationale: Die attributive Form wird formal bewahrt. Eine ausdrückliche kausative Deutung wäre kontextuell möglich, steht aber nicht vollständig im Wortlaut.
translation_notes:
  register: Moderne, würdige Standardsprache. »Da antwortete« hält den erzählerischen Anschluss durch καί fest. Der Semikolonanschluss vermeidet das im Deutschen schwerfällige »meinen Sohn … habend« und legt zugleich keine ausdrücklich kausale Beziehung fest.
