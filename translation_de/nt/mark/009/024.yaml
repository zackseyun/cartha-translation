source:
  edition: SBLGNT
  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: de
  text: 'Sofort schrie der Vater des Kindes: „Ich glaube; hilf meinem Unglauben!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθύς
  choice: Sofort
  rationale: Bewahrt die Unmittelbarkeit und den für Markus charakteristischen dringlichen Erzählton in natürlichem modernem Deutsch.
- source_word: κράξας
  choice: schrie
  rationale: Gibt den lauten, emotional dringlichen Ruf knapp und idiomatisch wieder.
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: der Vater des Kindes
  rationale: Gibt die Genitivverbindung transparent wieder; „Kind“ wahrt hier die lexikalische Weite von παιδίον, obwohl der weitere Kontext von einem Sohn spricht.
- source_word: ἔλεγεν
  choice: im Deutschen nicht gesondert wiedergegeben
  rationale: Die Verbindung κράξας … ἔλεγεν führt die direkte Rede ein. „schrie … und sagte“ wäre im Deutschen schwerfällig; „schrie:“ vermittelt Handlung und Redeeinleitung natürlich, ohne den Sinn zu verändern.
- source_word: Πιστεύω
  choice: Ich glaube
  rationale: Entspricht dem Kontext von Glauben und Unglauben und bewahrt die unmittelbare begriffliche Spannung.
- source_word: βοήθει
  choice: hilf
  rationale: Der Präsensimperativ ist eine direkte, dringliche Bitte um Beistand; „hilf“ ist prägnant und idiomatisch.
- source_word: μου τῇ ἀπιστίᾳ
  choice: meinem Unglauben
  rationale: Der Dativ bezeichnet das, dem geholfen werden soll, während μου die Zugehörigkeit ausdrückt. „meinem Unglauben“ erhält die paradoxe Formulierung; gemeint ist sinngemäß Hilfe angesichts bzw. gegen den eigenen Unglauben.
theological_decisions:
- issue: Spannung zwischen Πιστεύω und ἀπιστίᾳ
  choice: „Ich glaube; hilf meinem Unglauben!“
  alternative: „Ich glaube; hilf mir, wo mir der Glaube fehlt!“
  rationale: Die Hauptfassung bewahrt die auffällige Spannung zwischen vorhandenem Glauben und zugleich bestehendem Unglauben, statt sie erklärend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, paradoxe Bitte bleibt bewusst ungemildert. Keine Fußnote ist nötig, da „Kind“ und „Unglaube“ den griechischen Wortlaut angemessen und verständlich wiedergeben.
