source:
  edition: SBLGNT
  text: καλὸν τὸ ἅλας· ἐὰν δὲ τὸ ἅλας ἄναλον γένηται, ἐν τίνι αὐτὸ ἀρτύσετε; ἔχετε ἐν ἑαυτοῖς ⸀ἅλα, καὶ εἰρηνεύετε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: de
  text: Salz ist gut. Wenn aber das Salz salzlos wird, womit werdet ihr es würzen? Habt Salz in euch[a] und lebt miteinander in Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild „Salz in euch“ wird nicht näher erklärt. Es kann unter anderem auf Reinheit, Weisheit, Bundestreue oder bewahrenden Einfluss bezogen werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: gut
  rationale: „Gut“ bewahrt die breite positive Bewertung und den prägnanten, sprichwortartigen Charakter.
- source_word: ἅλας / ἅλα
  choice: Salz
  rationale: Das Bild wird in beiden Vorkommen unverändert beibehalten; besonders der abschließende Imperativ wird nicht deutend aufgelöst.
- source_word: ἄναλον
  choice: salzlos
  rationale: „Salzlos“ bildet den griechischen Gegensatz zu „Salz“ eng nach und erhält das Wortspiel; möglich ist sinngemäß auch „seine Salzkraft verliert“.
- source_word: γένηται
  choice: wird
  rationale: Das Verb bezeichnet hier das Eintreten eines Zustands; im Deutschen ist „salzlos wird“ natürlich und präzise.
- source_word: ἐν τίνι
  choice: womit
  rationale: Die instrumentale Frage wird im Deutschen idiomatisch mit „womit“ wiedergegeben.
- source_word: ἀρτύσετε
  choice: werdet ihr es würzen
  rationale: „Würzen“ erhält das kulinarische Bild, ohne die Wiederherstellung der Salzigkeit interpretierend auszuschreiben.
- source_word: ἔχετε
  choice: habt
  rationale: Der direkte Imperativ entspricht der Form des griechischen Befehls und lässt dessen fortdauernden Anspruch im Kontext erkennen.
- source_word: ἐν ἑαυτοῖς
  choice: in euch
  rationale: Die knappe reflexive Wendung bewahrt die nach innen gerichtete Bildsprache; „unter euch“ wäre möglich, würde sie aber stärker gemeinschaftlich deuten.
- source_word: εἰρηνεύετε
  choice: lebt … in Frieden
  rationale: Die verbale Wendung gibt einen fortdauernden friedlichen Umgang in natürlichem modernem Deutsch wieder.
- source_word: ἐν ἀλλήλοις
  choice: miteinander
  rationale: „Miteinander“ drückt die wechselseitige Beziehung idiomatisch und knapp aus.
theological_decisions:
- issue: Bedeutung des Salzes im Imperativ
  choice: 'Das Bild bleibt wörtlich stehen: „Habt Salz in euch“.'
  alternative: Das Salz ausdrücklich als Reinheit, Weisheit, Bundestreue oder bewahrenden Einfluss deuten.
  rationale: Der Vers legt die genaue Bedeutung des Bildes nicht ausdrücklich fest. Eine auslegende Paraphrase würde die echte Mehrdeutigkeit und die Verbindung zum Kontext vorschnell auf eine Lesart beschränken.
- issue: Gestalt des abschließenden Friedensgebots
  choice: „lebt miteinander in Frieden“
  alternative: „seid untereinander in Frieden“
  rationale: Die gewählte Form gibt εἰρηνεύετε als fortdauernde Lebenspraxis verständlich wieder, ohne den ethischen Gehalt des Imperativs zu erweitern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwortartige Kürze und die nicht aufgelöste Salzmetapher bleiben erhalten; „salzlos“ ist bewusst markant und bildet den griechischen Wortzusammenhang eng ab.
