  text: ὅπου ὁ σκώληξ αὐτῶν οὐ τελευτᾷ καὶ τὸ πῦρ οὐ σβέννυται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/048.yaml
  text: where their worm does not die[b][a], and the fire is not quenched.
translation:
  language: de
  text: wo ihr Wurm nicht stirbt[a][b] und das Feuer nicht erlischt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wo ihre Made nicht zu einem Ende kommt und das Feuer nicht gelöscht wird“.'
    reason: lexical_alternative
  - marker: b
    text: Diese Aussage greift Jesaja 66,24 auf.
    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: wo
  rationale: Das relative Ortsadverb wird direkt und natürlich mit „wo“ wiedergegeben.
- source_word: ὁ σκώληξ αὐτῶν
  choice: ihr Wurm
  rationale: „Wurm“ bewahrt die konkrete Bildsprache und den Anklang an Jesaja 66,24, ohne die Art als „Made“ näher festzulegen; αὐτῶν wird als deutsches Possessivpronomen wiedergegeben.
- source_word: οὐ τελευτᾷ
  choice: nicht stirbt
  rationale: τελευτάω kann „enden“ oder „sterben“ bedeuten; bei einem Wurm als Subjekt ist „nicht stirbt“ im Deutschen idiomatisch und eindringlich.
- source_word: τὸ πῦρ
  choice: das Feuer
  rationale: Direkte Wiedergabe des konkreten Substantivs.
- source_word: οὐ σβέννυται
  choice: nicht erlischt
  rationale: „Nicht erlischt“ gibt den fortdauernden, unausgelöschten Zustand natürlich wieder; die mögliche formalere Wiedergabe „nicht gelöscht wird“ bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Art der Gerichtsbilder
  choice: Die konkreten Bilder von Wurm und Feuer bleiben ohne dogmatische Ausdeutung stehen.
  alternative: Die Aussage ausdrücklich als ewige bewusste Strafe, endgültige Vernichtung oder rein metaphorische Schande deuten.
  rationale: Der Vers greift Jesaja 66,24 auf, entscheidet aber für sich genommen nicht zwischen weitergehenden theologischen Deutungen. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „Ihr Wurm“ erhält die markante, traditionelle Bildsprache; „erlischt“ klingt natürlicher als das formellere Passiv „wird gelöscht“, ohne den Sinn abzuschwächen.
