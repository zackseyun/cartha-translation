source:
  edition: SBLGNT
  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: de
  text: Wer ein solches Kind in meinem Namen aufnimmt[a], nimmt mich auf; und wer mich aufnimmt, nimmt nicht mich auf, sondern den, der mich gesandt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „willkommen heißt“; dasselbe griechische Verb wird im ganzen Vers wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: Wer
  rationale: Das Relativpronomen mit ἄν bezeichnet einen unbestimmten allgemeinen Fall; das deutsche „Wer“ gibt dies knapp und idiomatisch wieder.
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: ein Kind wie dieses
  rationale: Die Formulierung bewahrt die qualitative Bedeutung von τοιούτων („von dieser Art“) und klingt im modernen Deutschen natürlicher als die wörtliche partitive Wendung „eines von solchen Kindern“. Zugleich vermeidet sie, τοιούτων lediglich deiktisch als „diese“ wiederzugeben.
- source_word: δέξηται / δέχεται / δέχηται
  choice: aufnimmt
  rationale: „Aufnehmen“ kann sowohl die konkrete gastfreundliche Aufnahme als auch die Annahme einer Person bezeichnen. Die konsequente Wiederholung erhält die im Griechischen hörbare Verbindung zwischen dem Kind, Jesus und dem Sendenden.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die geläufige Wendung wahrt den Bezug auf Jesu Person und Autorität, ohne die mögliche Bedeutung „um meines Namens willen“ vorschnell auszuschließen.
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: nimmt nicht mich auf, sondern
  rationale: Die griechische Gegenüberstellung wird ohne den erklärenden Zusatz „nicht nur“ bewahrt, sodass ihre rhetorische und theologische Spannung bestehen bleibt.
- source_word: τὸν ἀποστείλαντά με
  choice: den, der mich gesandt hat
  rationale: Die substantivierte Partizipialkonstruktion wird natürlich wiedergegeben und bewahrt die Sendungssprache des Ausgangstextes.
theological_decisions:
- issue: Aussagekraft des Schlusskontrasts „nicht mich, sondern den, der mich gesandt hat“
  choice: Den wörtlichen Kontrast beibehalten
  alternative: „nimmt nicht nur mich auf, sondern auch den, der mich gesandt hat“
  rationale: Der Zusatz „nicht nur … sondern auch“ würde den Sinn erklären, steht aber nicht ausdrücklich im Griechischen. Die Übersetzung bewahrt daher die zugespitzte Aussage, ohne daraus eine Trennung zwischen Jesus und dem Sendenden abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Ein Kind wie dieses“ ist bewusst natürlicher als eine starre Nachbildung der partitiven Konstruktion; die Fußnote dokumentiert deren Form. Die vierfache Wiederholung von „aufnehmen“ erhält die rhetorische Kette des griechischen Textes.
