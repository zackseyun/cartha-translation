  terminology: „Aufnehmen“ ist für δέχομαι geeignet und wird konsequent wiederholt. „Den, der mich gesandt hat“ gibt τὸν ἀποστείλαντά με klar und idiomatisch wieder. Der Schlusskontrast wird ohne dogmatische oder harmonisierende Erklärung beibehalten.
