  text: καὶ ἐξάπινα περιβλεψάμενοι οὐκέτι οὐδένα εἶδον ⸂ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: de
  text: Und plötzlich sahen sie sich um und sahen niemanden mehr außer Jesus, der allein bei ihnen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: plötzlich
  rationale: Gibt den unvermittelten zeitlichen Übergang natürlich und präzise wieder.
- source_word: περιβλεψάμενοι
  choice: sahen sie sich um
  rationale: Entspricht dem aoristischen Partizip und klingt im modernen Deutschen natürlich.
- source_word: οὐκέτι οὐδένα εἶδον
  choice: sahen niemanden mehr
  rationale: Bewahrt sowohl die zeitliche Aussage von οὐκέτι als auch die Verneinung οὐδένα.
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον μεθ’ ἑαυτῶν
  choice: bei sich außer Jesus allein
  rationale: Gibt die Ausnahme, die Hervorhebung durch μόνον und das Beisammensein durch μεθ’ ἑαυτῶν vollständig wieder.
theological_decisions:
- issue: Hervorhebung Jesu als einzig verbliebener Person
  choice: außer Jesus allein
  alternative: nur noch Jesus bei sich
  rationale: Die gewählte Fassung bewahrt die doppelte Ausdrucksstruktur des Griechischen—Ausnahme durch ἀλλά und Ausschließlichkeit durch μόνον—ohne sie theologisch auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die griechische Partizipialkonstruktion wird zur natürlichen deutschen Satzkoordination aufgelöst.
