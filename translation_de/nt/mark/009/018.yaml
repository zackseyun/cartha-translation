  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: de
  text: Und wo immer er ihn packt, reißt er ihn zu Boden; er schäumt, knirscht mit den Zähnen und wird starr.[a] Ich bat deine Jünger, den Geist auszutreiben, aber sie konnten es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trocknet aus“, „verdorrt“ oder „zehrt aus“. Das griechische Wort bedeutet wörtlich „trocken werden“; hier kann eine körperliche Erstarrung gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: wo immer
  rationale: Die Verbindung bezeichnet eine unbestimmte, wiederholt eintretende Situation. „Wo immer“ gibt diese Bedeutung im Deutschen natürlich wieder.
- source_word: καταλάβῃ
  choice: packt
  rationale: Das Verb beschreibt hier das feindliche Ergreifen des Jungen durch den Geist. „Packt“ ist anschaulich und idiomatisch, ohne über den griechischen Text hinauszugehen.
- source_word: ῥήσσει
  choice: reißt ... zu Boden
  rationale: Im Zusammenhang bezeichnet das Verb eine heftige körperliche Einwirkung, durch die der Junge niedergeworfen wird. Diese Formulierung vermeidet das missverständliche Bild eines körperlichen Zerreißens.
- source_word: ἀφρίζει
  choice: schäumt
  rationale: Das einfache deutsche Verb entspricht dem griechischen Ausdruck; „vor dem Mund“ wäre eine zwar naheliegende, aber nicht ausdrücklich genannte Ergänzung.
- source_word: τρίζει τοὺς ὀδόντας
  choice: knirscht mit den Zähnen
  rationale: Die Wendung beschreibt ein körperliches Symptom. „Mit den Zähnen knirschen“ ist dafür im heutigen Deutsch natürlicher als eine stärker bildhafte Formulierung.
- source_word: ξηραίνεται
  choice: wird starr
  rationale: Im Ablauf der beschriebenen Symptome ist eine körperliche Erstarrung wahrscheinlich gemeint. Da das Verb wörtlich „austrocknen“ oder „verdorren“ heißen kann, wird die echte lexikalische Unsicherheit in einer Fußnote bewahrt.
- source_word: εἶπα ... ἵνα
  choice: habe ... aufgefordert
  rationale: Die Konstruktion bezeichnet hier eine an die Jünger gerichtete Aufforderung. Das Perfekt ist im gegenwärtigen Bericht des Vaters natürlich.
- source_word: ἐκβάλωσιν
  choice: auszutreiben
  rationale: ἐκβάλλω ist im Exorzismuskontext das übliche Verb für das Vertreiben eines unreinen Geistes.
- source_word: οὐκ ἴσχυσαν
  choice: sie konnten es nicht
  rationale: Die Formulierung gibt die fehlende Fähigkeit oder Kraft knapp wieder, ohne den Grund ihres Scheiterns festzulegen.
theological_decisions:
- issue: Bezug des Geistes in den männlichen deutschen Pronomen
  choice: „er“ und „ihn“ beziehen sich auf den unreinen Geist
  alternative: Ein neutrales Pronomen könnte allgemeiner auf das Wesen oder die Leidenserfahrung bezogen werden.
  rationale: Das griechische αὐτό ist wegen πνεῦμα grammatisch sächlich; im Deutschen ist „Geist“ jedoch männlich. Der Erzählzusammenhang stellt den Geist als handelnden Urheber und als Gegenstand der Austreibung dar.
- issue: Art des Versagens der Jünger
  choice: „sie konnten es nicht“ lässt den Grund offen
  alternative: „sie hatten nicht die Kraft dazu“ könnte den Aspekt mangelnder Macht stärker hervorheben.
  rationale: οὐκ ἴσχυσαν bezeichnet Unvermögen, erklärt aber an dieser Stelle nicht abschließend, worauf dieses zurückzuführen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Symptomfolge bleibt knapp und anschaulich; das Semikolon gliedert die Handlung des Geistes von den anschließenden körperlichen Reaktionen. Die Fußnote bewahrt die Unsicherheit bei ξηραίνεται.
