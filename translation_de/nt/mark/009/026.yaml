  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: de
  text: 'Und nachdem er geschrien und den Jungen in heftige Krämpfe versetzt hatte[a], fuhr er aus. Der Junge wurde wie ein Toter, sodass viele sagten[b]: »Er ist gestorben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn heftig hin und her gezerrt hatte«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Er wurde wie ein Toter«; der Erzähler beschreibt damit seinen Anschein, während die folgende Aussage die Einschätzung vieler wiedergibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: nachdem er geschrien hatte
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Ausfahren vorausgeht. »Geschrien« bewahrt den verbalen Sinn, ohne die Art des Schreis näher festzulegen.
- source_word: πολλὰ σπαράξας
  choice: den Jungen heftig geschüttelt hatte
  rationale: σπαράσσω bezeichnet hier das gewaltsame Schütteln beziehungsweise Verkrampfen des Jungen durch den Geist; πολλὰ verstärkt die Handlung. Das im Griechischen unausgesprochene Objekt wird aus dem Kontext ergänzt.
- source_word: ἐξῆλθεν
  choice: fuhr er aus
  rationale: Das unausgesprochene Subjekt ist der unreine Geist. »Ausfahren« ist im Deutschen die natürliche Wendung für sein Verlassen des Jungen.
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: Der Junge wurde wie ein Toter
  rationale: Die Vergleichspartikel ὡσεὶ beschreibt den Anschein beziehungsweise Zustand, ohne den tatsächlichen Tod zu behaupten.
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: sodass viele sagten
  rationale: τοὺς πολλούς wird als »viele« verstanden, ohne zwingend eine Mehrheit zu behaupten. Die Konstruktion bezeichnet die Reaktion der Umstehenden als Folge.
- source_word: ὅτι ἀπέθανεν
  choice: »Er ist gestorben.«
  rationale: Die direkte Rede gibt die Schlussfolgerung der Menge idiomatisch wieder; das Perfekt bezeichnet im Deutschen den unmittelbar festgestellten Tod.
theological_decisions:
- issue: Ob der Junge tatsächlich tot war oder nur tot erschien
  choice: Der Erzähler beschreibt ihn vergleichend als »wie ein Toter« und berichtet anschließend nur die Einschätzung vieler.
  alternative: Der Junge war vorübergehend tatsächlich tot.
  rationale: ὡσεὶ und die als Aussage der Menge formulierte Todesfeststellung erlauben keine eindeutige Behauptung seines tatsächlichen Todes. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Pronomen werden durch »den Jungen« und »Der Junge« verdeutlicht, damit der Wechsel zwischen Geist und Junge eindeutig bleibt. »Fuhr aus« bewahrt den geläufigen exorzistischen Sprachgebrauch, ohne zusätzliche Deutung.
