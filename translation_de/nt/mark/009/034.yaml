id: MRK.9.34
reference: Mark 9:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσιώπων, πρὸς ἀλλήλους γὰρ διελέχθησαν ἐν τῇ ὁδῷ τίς μείζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: de
  text: Doch sie schwiegen, denn unterwegs hatten sie miteinander darüber gestritten, wer größer sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wer der Größte sei“. Das griechische Adjektiv steht im Komparativ: „größer“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπων
  choice: sie schwiegen
  rationale: Der deutsche Imperfekt gibt die anhaltende Reaktion auf Jesu Frage natürlich wieder; „sie schwiegen weiter“ würde einen bereits zuvor ausdrücklich begonnenen Schweigevorgang nahelegen.
- source_word: διελέχθησαν
  choice: hatten sie … gestritten
  rationale: Der Kontext eines Rangstreits spricht für das konfliktbetonte „gestritten“ statt des neutraleren „diskutiert“. Das Plusquamperfekt macht deutlich, dass dies vor ihrem Schweigen geschehen war.
- source_word: πρὸς ἀλλήλους
  choice: miteinander
  rationale: Die Formulierung bewahrt den wechselseitigen Sinn und ist in modernem Deutsch idiomatisch.
- source_word: ἐν τῇ ὁδῷ
  choice: unterwegs
  rationale: „Unterwegs“ ist die natürliche deutsche Wiedergabe für das Gespräch während ihres Weges und entspricht dem markinischen Reisezusammenhang.
- source_word: τίς μείζων
  choice: wer größer sei
  rationale: „Größer“ bewahrt den Komparativ μείζων. Der Konjunktiv I ist in der indirekten Frage nach einem vergangenen Streit idiomatisch und würdevoll.
- source_word: οἱ δὲ
  choice: Doch sie
  rationale: „Doch“ bringt den milden Gegensatz zwischen Jesu Frage und der ausbleibenden Antwort knapp zum Ausdruck.
- source_word: γὰρ
  choice: denn
  rationale: „Denn“ gibt die begründende Funktion von γάρ natürlich wieder und vermeidet einen schwerfälligen Nebensatz.
theological_decisions:
- issue: Komparativ μείζων gegenüber einer idiomatischen superlativischen Wiedergabe
  choice: wer größer sei
  alternative: wer der Größte sei
  rationale: Der Komparativ des griechischen Textes bleibt im Haupttext erhalten. Zugleich wird die im Deutschen naheliegende superlativische Deutung als mögliche Wiedergabe in der Fußnote genannt, ohne den Rangstreit stärker festzulegen, als es die Formulierung verlangt.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. „Unterwegs“ und „miteinander gestritten“ sind alltagssprachlich verständlich, ohne umgangssprachlich zu wirken; die Satzfolge bewahrt Gegensatz und Begründung des griechischen Textes.
