  text: οὐ γὰρ ᾔδει τί ⸀ἀποκριθῇ, ⸂ἔκφοβοι γὰρ ἐγένοντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/006.yaml
  text: For he did not know what he should answer[b][a], for they were terrified.
translation:
  language: de
  text: Denn er wusste nicht, was er antworten sollte[a], denn sie gerieten in große Angst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was er erwidern sollte“.'
    reason: lexical_alternative
  - marker: b
    text: 'Das griechische Verb betont, dass sie in diesen Zustand gerieten. Glatter: „denn sie hatten große Angst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: wusste nicht
  rationale: οἶδα bezeichnet hier Wissen beziehungsweise Bewusstsein; die idiomatische deutsche Wiedergabe im Präteritum lautet „wusste nicht“.
- source_word: τί ἀποκριθῇ
  choice: was er antworten sollte
  rationale: ἀποκρίνομαι bedeutet spezifisch „antworten/erwidern“. Der deliberative Konjunktiv nach τί wird natürlich mit „was er … sollte“ wiedergegeben.
- source_word: ἔκφοβοι
  choice: in große Angst
  rationale: ἔκφοβος bezeichnet starke, überwältigende Furcht. „Große Angst“ wahrt die Intensität in verständlichem modernem Deutsch.
- source_word: ἐγένοντο
  choice: waren … geraten
  rationale: γίνομαι markiert hier das Eintreten in einen Zustand. Die Verbindung „waren in … geraten“ bewahrt diesen dynamischen Aspekt und bleibt im Deutschen natürlich.
- source_word: γὰρ ... γὰρ
  choice: Denn ... nämlich
  rationale: Beide γάρ-Partikeln haben erklärende Funktion. Die Abwechslung von „denn“ und „nämlich“ erhält die doppelte Begründungsstruktur, ohne im Deutschen schwerfällig zu wirken.
theological_decisions:
- issue: Subjekt des Pluralsatzes
  choice: sie waren … geraten
  alternative: er war … geraten
  rationale: Das pluralische Adjektiv ἔκφοβοι und das pluralische Verb ἐγένοντο verlangen ein pluralisches Subjekt, das sich im Kontext auf Petrus und seine Begleiter bezieht. Eine Verengung allein auf Petrus wäre grammatisch nicht begründet.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das Semikolon macht die zweite Begründung deutlich; „in große Angst geraten“ erhält gegenüber einem bloßen „hatten Angst“ die Zustandsveränderung von ἐγένοντο.
