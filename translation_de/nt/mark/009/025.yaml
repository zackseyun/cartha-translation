source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: de
  text: 'Als Jesus aber sah, dass eine Menschenmenge rasch zusammenlief[a], wies er den unreinen Geist zurecht und sagte zu ihm: »Du stummer und tauber Geist, ich befehle dir: Fahr aus ihm heraus und geh nie wieder in ihn hinein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass eine Menschenmenge rasch zusammenströmte“. Das griechische Verb bezeichnet Menschen, die schnell an einem Ort zusammenkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Als Jesus aber sah
  rationale: Das Aoristpartizip gibt den zeitlichen Umstand der Haupthandlung an; δέ markiert einen leichten erzählerischen Übergang, der mit „aber“ gewahrt bleibt.
- source_word: ἐπισυντρέχει ὄχλος
  choice: eine Menschenmenge rasch zusammenlief
  rationale: ἐπισυντρέχω bezeichnet ein schnelles Zusammenlaufen bzw. Zusammenströmen. Die Formulierung bewahrt sowohl die Bewegung auf einen gemeinsamen Ort zu als auch die Dringlichkeit der Szene.
- source_word: ἐπετίμησεν
  choice: wies ... zurecht
  rationale: ἐπιτιμάω bezeichnet hier ein machtvolles, tadelndes Einschreiten. „Zurechtweisen“ ist im modernen Deutschen verständlich und wahrt Jesu autoritatives Handeln.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: den unreinen Geist
  rationale: „Unrein“ erhält die im Markusevangelium verwendete religiös-moralische Kategorie, ohne sie durch eine weitergehende Deutung zu ersetzen.
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: Du stummer und tauber Geist
  rationale: Der Nominativ mit Artikel dient als Anrede. „Stumm“ und „taub“ gibt die beiden unterschiedlichen Eigenschaften von ἄλαλος und κωφός klar wieder.
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: ich befehle dir
  rationale: ἐπιτάσσω bezeichnet einen verbindlichen, autoritativen Befehl. Das ausdrücklich gesetzte ἐγώ wird durch das deutsche „ich“ sichtbar bewahrt.
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: Fahr aus ihm aus
  rationale: Die feste deutsche Wendung für eine Austreibung gibt den Imperativ und die Bewegung aus der Person heraus knapp und kraftvoll wieder.
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: geh nie wieder in ihn hinein
  rationale: μηκέτι mit dem prohibitiv gebrauchten Aoristkonjunktiv untersagt jedes erneute Eindringen. „Nie wieder“ drückt dieses endgültige Verbot natürlich aus.
theological_decisions:
- issue: Bezeichnung des dämonischen Geistes und Jesu Vollmacht
  choice: „unreiner Geist“ sowie die starken Vollmachtsausdrücke „wies ... zurecht“ und „ich befehle dir“
  alternative: „böser Geist“ beziehungsweise abgeschwächt „sprach streng mit dem Geist“
  rationale: Der griechische Text stellt den Geist als persönlich angeredetes Wesen dar, das Jesu Befehl untersteht. Die Übersetzung wahrt diese Darstellung, ohne sie zu bloßer Krankheitssprache abzuschwächen oder dogmatisch auszubauen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und gebieterisch; „Fahr aus ihm aus“ ist als etablierte deutsche Austreibungsformel bewusst beibehalten.
