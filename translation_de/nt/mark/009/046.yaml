  yaml_path: translation/nt/mark/009/046.yaml
  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: de
  text: wo ihr Wurm nicht stirbt und das Feuer nicht erlischt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er steht jedoch in der byzantinischen Mehrheitstradition und in der lateinischen Überlieferung. Wahrscheinlich wurde er später von Abschreibern als Wiederholung der gleichen Worte aus Vers 48 eingefügt; dieselben Worte begegnen auch in Vers 44.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: Wurm
  rationale: Bezeichnet einen Wurm oder eine Made, die Verwesendes frisst. »Wurm« wahrt den direkten Bezug zu Jesaja 66,24 und die vertraute Bildsprache.
- source_word: τελευτᾷ
  choice: stirbt
  rationale: τελευτάω kann »enden« oder »sterben« bedeuten. Auf den Wurm bezogen ist »stirbt« im Deutschen natürlich und gibt das fortdauernde Nichtsterben des griechischen Präsens wieder.
- source_word: σβέννυται
  choice: erlischt
  rationale: Das Passiv von σβέννυμι bezeichnet das Löschen beziehungsweise Erlöschen eines Feuers. »Nicht erlischt« ist idiomatisches, würdevolles Deutsch und bewahrt das Bild eines unaufhörlichen Feuers.
theological_decisions:
- issue: Bezug von αὐτῶν (»ihr«)
  choice: »ihr Wurm« bleibt ohne ausdrückliche Auflösung des Bezugs stehen.
  alternative: »der Wurm, der sie frisst«
  rationale: Der griechische Text erklärt den Bezug nicht näher. Die knappe Form bewahrt die Anspielung auf Jesaja 66,24 und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Klang. Die Wortstellung folgt natürlichem Deutsch, während Parallelismus und Bildsprache des griechischen Textes erhalten bleiben.
