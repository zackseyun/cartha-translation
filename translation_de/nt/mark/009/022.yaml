  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: de
  text: Oft hat er ihn ins Feuer und ins Wasser geworfen, um ihn zu vernichten.[a] Doch wenn du etwas tun kannst, dann hilf uns und hab Erbarmen mit uns![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht hier der Plural: „in Wasser“ beziehungsweise „in Gewässer“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „von Erbarmen über uns bewegt“ oder „hab Mitleid mit uns“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: oft
  rationale: Das Adverb bezeichnet ein wiederholtes Geschehen; „oft“ ist im Deutschen natürlich und prägnant.
- source_word: ἔβαλεν
  choice: hat er ... geworfen
  rationale: Das Perfekt gibt den rückblickenden Bericht über wiederholte Vorfälle bis zur gegenwärtigen Situation idiomatisch wieder.
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: ins Feuer und ins Wasser
  rationale: Die Zielrichtung beider Wendungen bleibt erhalten. Der griechische Plural ὕδατα wird im Deutschen idiomatisch als Singular „Wasser“ wiedergegeben und in einer Fußnote kenntlich gemacht.
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: um ihn zu vernichten
  rationale: Die finale Konstruktion gibt die zerstörerische Absicht wieder, ohne ἀπόλλυμι auf den bloßen Tötungsakt zu verengen.
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: Doch wenn du etwas tun kannst
  rationale: „etwas“ bildet das indefinite τι ab; die Formulierung bewahrt die zögernde Unsicherheit des Vaters hinsichtlich Jesu Fähigkeit.
- source_word: βοήθησον ἡμῖν
  choice: dann hilf uns
  rationale: Der Imperativ ist unmittelbar und dringlich; „dann“ verbindet die Bitte im Deutschen natürlich mit dem vorausgehenden Konditionalsatz.
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: und hab Erbarmen mit uns
  rationale: Die koordinierte deutsche Imperativform vermittelt die tiefe Anteilnahme des Partizips idiomatisch, ohne sie als bloßen Begleitumstand abzuschwächen.
theological_decisions:
- issue: Unsicherheit des Vaters über Jesu Fähigkeit
  choice: „wenn du etwas tun kannst“
  alternative: „wenn du irgendwie helfen kannst“ oder eine geglättete, zuversichtlichere Bitte
  rationale: Die offene Bedingung des griechischen Textes wird nicht abgeschwächt oder in ein Glaubensbekenntnis umgedeutet; die Spannung bleibt für Jesu folgende Antwort erhalten.
- issue: Bezug der Bitte auf Vater und Sohn
  choice: „hilf uns ... hab Erbarmen mit uns“
  alternative: Singularische Beschränkung der Hilfe auf den Sohn
  rationale: Der griechische Plural ἡμῖν/ἡμᾶς schließt den bittenden Vater ausdrücklich mit ein und wird daher zweimal als „uns“ wiedergegeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, dringlichem Ton. „Er“ bezieht sich im Kontext auf den unreinen Geist. Die Wiederholung der griechischen Präposition wird im Deutschen zugunsten natürlicher Syntax nicht mechanisch nachgebildet; „sogar“ bringt die steigernde Kraft von καί vor εἰς πῦρ zur Geltung.
