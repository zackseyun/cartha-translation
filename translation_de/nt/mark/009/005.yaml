source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: de
  text: 'Da sagte Petrus zu Jesus: „Rabbi, es ist gut, dass wir hier sind. Lasst uns drei Hütten[a] bauen: eine für dich, eine für Mose und eine für Elija.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zelte“ beziehungsweise „Laubhütten“. Das griechische Wort bezeichnet einfache, vorübergehende Unterkünfte und kann entsprechende Fest- oder Heiligtumsanklänge haben, ohne dass diese hier ausdrücklich gemacht werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: Da sagte
  rationale: Die Verbindung ist eine geläufige griechische Erzählformel. Da weder eine ausdrückliche Frage noch eine unmittelbar vorausgehende Rede vorliegt, wäre „antwortete“ im heutigen Deutsch missverständlich. „Da sagte“ gibt den einsetzenden Redebeitrag natürlich wieder; das historische Präsens wird entsprechend deutscher Erzählkonvention als Vergangenheit wiedergegeben.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die semitisch geprägte respektvolle Anrede wird beibehalten und nicht durch das allgemeinere „Lehrer“ ersetzt.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: es ist gut, dass wir hier sind
  rationale: Die Formulierung bewahrt Peters positive Bewertung, ohne sie durch „wunderbar“ oder eine andere Verstärkung auszudeuten.
- source_word: ποιήσωμεν
  choice: Lasst uns ... bauen
  rationale: Der Konjunktiv ist auffordernd. Bei Hütten ist „bauen“ im Deutschen idiomatischer als das formal nähere „machen“, ohne den Sinn unnötig einzuengen.
- source_word: σκηνάς
  choice: Hütten
  rationale: σκηνή bezeichnet hier eine einfache, vorübergehende Unterkunft wie Hütte, Zelt oder Laubhütte. „Hütten“ ist im Deutschen verständlich und traditionsnah, ohne die kultische Bedeutung von „Stiftshütten“ ausdrücklich einzutragen.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: eine für dich, eine für Mose und eine für Elija
  rationale: Die dreifache Verteilung und der parallele Aufbau des griechischen Textes bleiben erhalten.
theological_decisions:
- issue: Mögliche Fest- oder Heiligtumsanklänge von σκηνάς
  choice: Im Haupttext steht das neutrale „Hütten“; mögliche Alternativen werden in einer Fußnote genannt.
  alternative: „Zelte“, „Laubhütten“ oder kultisch deutender „Stiftshütten“
  rationale: Der Vers bezeichnet die Bauten nicht ausdrücklich als Laubhütten des Festes und stellt auch keinen ausdrücklichen Bezug zum Heiligtum her. Daher wird eine mögliche theologische Assoziation nicht zur eindeutigen Aussage des Haupttextes gemacht.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Rabbi“ und die Namen Mose und Elija bewahren den historischen und biblischen Sprachraum; unnötig archaische oder konfessionell festgelegte Ausdrücke werden vermieden.
