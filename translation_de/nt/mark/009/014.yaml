  text: Καὶ ⸂ἐλθόντες πρὸς τοὺς μαθητὰς εἶδον⸃ ὄχλον πολὺν περὶ αὐτοὺς καὶ γραμματεῖς συζητοῦντας ⸂πρὸς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: de
  text: Als sie zu den Jüngern kamen, sahen sie eine große Menschenmenge um die Jünger herum und Schriftgelehrte, die mit ihnen stritten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: mit ihnen diskutierten. Das griechische Verb kann eine Diskussion oder eine Auseinandersetzung bezeichnen; hier deutet der Zusammenhang eher auf einen Streit hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: als sie zu den Jüngern kamen
  rationale: Das Aoristpartizip wird im natürlichen deutschen Erzählstil als temporaler Nebensatz wiedergegeben; πρός mit Akkusativ bezeichnet die Bewegung zu den Jüngern.
- source_word: εἶδον
  choice: sahen sie
  rationale: Der einfache narrative Aorist wird ohne unnötige Erweiterung wiedergegeben.
- source_word: ὄχλον πολύν
  choice: eine große Menschenmenge
  rationale: Die Wiedergabe bezeichnet klar eine große Ansammlung von Menschen und ist im modernen Deutsch natürlich.
- source_word: περὶ αὐτούς
  choice: um sie herum
  rationale: περί mit Akkusativ hat hier räumliche Bedeutung; das Pronomen bezieht sich im Erzählzusammenhang auf die Jünger.
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Dies ist die etablierte und sachlich passende deutsche Bezeichnung für die jüdischen Schrift- und Gesetzesexperten in den Evangelien.
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: die mit ihnen stritten
  rationale: συζητέω kann Diskussion oder Auseinandersetzung bezeichnen. Der konflikthafte Zusammenhang legt „stritten“ nahe; πρὸς αὐτούς wird idiomatisch mit „mit ihnen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Satzstruktur bleibt nahe am griechischen Ablauf, ohne im Deutschen hölzern zu wirken. Der Fußnotenmarker steht unmittelbar bei der lexikalisch mehrdeutigen Wiedergabe.
