  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: de
  text: 'Da kam eine Wolke und überschattete sie. Und aus der Wolke erklang eine Stimme: „Das ist mein geliebter Sohn. Hört auf ihn[a]!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Hört ihn.“ Gemeint ist aufmerksames, beherzigendes Hören, nicht nur akustisches Wahrnehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: Da kam eine Wolke
  rationale: γίνομαι bezeichnet hier das Eintreten beziehungsweise Erscheinen der Wolke. „Da kam“ gibt den plötzlichen Ereignischarakter natürlich wieder, ohne die Wolke deutend näher zu bestimmen.
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: und überschattete sie
  rationale: „Überschatten“ bewahrt das Bild des griechischen Verbs und mögliche Anklänge an Gottes Gegenwart, ohne ausdrücklich „einhüllen“ oder „bedecken“ einzutragen.
- source_word: ἐγένετο φωνὴ ἐκ τῆς νεφέλης
  choice: aus der Wolke erklang eine Stimme
  rationale: Das zweite ἐγένετο beschreibt idiomatisch das Auftreten der Stimme. „Erklang“ ist im Deutschen natürlicher als „eine Stimme kam“, während „aus der Wolke“ die räumliche Bedeutung von ἐκ wahrt.
- source_word: Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός
  choice: Das ist mein geliebter Sohn
  rationale: „Das ist“ ist die natürliche deutsche Identifikationsformel. „Mein geliebter Sohn“ gibt die Sohnschaft und ἀγαπητός direkt und ohne zusätzliche theologische Ausdeutung wieder.
- source_word: ἀκούετε αὐτοῦ
  choice: Hört auf ihn
  rationale: Der Imperativ verlangt aufmerksames, beherzigendes Hören. „Hört auf ihn“ bewahrt im Deutschen sowohl das Hören als auch den Gedanken, dem Gehörten Folge zu geben, ohne ausdrücklich mit „gehorcht“ zu übersetzen.
theological_decisions:
- issue: Die himmlische Erklärung über Jesu Identität
  choice: „Das ist mein geliebter Sohn“ als unmittelbare göttliche Erklärung
  alternative: Eine erläuternde Umschreibung der Sohnschaft Jesu
  rationale: Der griechische Text bezeichnet Jesus eindeutig als Gottes geliebten Sohn. Die Übersetzung wahrt diese christologische Aussage, ohne über den Wortlaut hinaus eine dogmatische Erklärung hinzuzufügen.
- issue: Bedeutungsumfang von ἀκούετε αὐτοῦ
  choice: „Hört auf ihn“
  alternative: „Hört ihn“ oder „Gehorcht ihm“
  rationale: Das Verb umfasst hier nicht nur akustisches Wahrnehmen, sondern aufmerksames und folgebereites Hören. „Gehorcht ihm“ würde diese responsive Seite zu eng festlegen; „Hört ihn“ wäre im modernen Deutschen missverständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze erhalten den erzählerischen Nachdruck. „Überschattete“ ist bewusst bildhaft und etwas feierlicher; „Hört auf ihn“ ist gegenwärtig und allgemein verständlich.
