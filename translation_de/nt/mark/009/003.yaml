  verdict: approve
  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des Griechischen zuverlässig wieder: Die Kleider wechseln ihren Zustand (ἐγένετο), sind glänzend (στίλβοντα) und sehr weiß (λευκὰ λίαν). Der Gradvergleich „so weiß, wie sie kein Tuchbleicher auf der Erde weiß machen kann“ bildet οἷα … οὐ δύναται οὕτως λευκᾶναι angemessen ab; das im Deutschen notwendige Objekt „sie“ bezieht sich eindeutig auf die Kleider.'
  naturalness: „Und seine Kleider wurden glänzend und sehr weiß“ ist modernes, verständliches Standarddeutsch. Der Gedankenstrich und die anschließende Vergleichsformulierung sind stilistisch flüssig. Die Wiederholung von „weiß“ entspricht dem im griechischen Satz ausgedrückten Gradvergleich und wirkt hier nicht störend.
  terminology: „Kleider“ ist für ἱμάτια passend. „Tuchbleicher“ vermittelt die für γναφεύς relevante Tätigkeit des Reinigens und Weißmachens von Stoffen verständlich; die Fußnote nennt mit „Walker“ die traditionelle fachsprachliche Alternative und erläutert sie sachgerecht. Es werden keine zusätzlichen theologischen Aussagen eingeführt.
