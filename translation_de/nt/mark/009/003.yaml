id: MRK.9.3
reference: Mark 9:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ ἱμάτια αὐτοῦ ⸀ἐγένετο στίλβοντα λευκὰ ⸀λίαν οἷα γναφεὺς ἐπὶ τῆς γῆς οὐ δύναται ⸀οὕτως λευκᾶναι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: de
  text: Und seine Kleider wurden glänzend und sehr weiß – so weiß, wie sie kein Tuchbleicher[a] auf der Erde weiß machen kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Walker; ein Handwerker, der Stoffe reinigte und aufhellte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: Kleider
  rationale: Der allgemeine Ausdruck für Kleidung wird mit dem natürlichen und nicht übermäßig feierlichen deutschen Wort „Kleider“ wiedergegeben.
- source_word: ἐγένετο
  choice: wurden
  rationale: Das Verb bezeichnet hier den Übergang in einen neuen Zustand während der Verklärung.
- source_word: στίλβοντα
  choice: glänzend
  rationale: Das Wort beschreibt einen hellen, aufleuchtenden Glanz, ohne diesen bereits theologisch als Herrlichkeit zu deuten.
- source_word: λευκὰ λίαν
  choice: sehr weiß
  rationale: „Sehr“ gibt die starke Intensivierung durch λίαν unmittelbar und in natürlichem Deutsch wieder.
- source_word: γναφεύς
  choice: Tuchbleicher
  rationale: Gemeint ist ein Handwerker, der Stoffe reinigte und aufhellte. „Tuchbleicher“ macht die im Kontext entscheidende Tätigkeit verständlich; die traditionelle Alternative wird in der Fußnote genannt.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Formulierung bewahrt den räumlichen Kontrast zur außergewöhnlichen Erscheinung.
- source_word: οὕτως λευκᾶναι
  choice: so weiß … weiß machen
  rationale: Die Wiederaufnahme von „weiß“ drückt den Gradvergleich des Griechischen klar und idiomatisch aus; „sie“ bezieht sich ausdrücklich auf die Kleider.
theological_decisions:
- issue: Sichtbare Wirkung der Verklärung
  choice: Die außergewöhnliche Helligkeit der Kleider wird anschaulich beschrieben, ohne eine theologische Erklärung hinzuzufügen.
  alternative: „von Herrlichkeit erfüllt“ oder eine ähnliche deutende Formulierung
  rationale: Der Vers schildert unmittelbar das sichtbare Geschehen. Eine ausdrückliche Deutung als Herrlichkeit würde mehr sagen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich und die Wiederholung „so weiß“ bilden den gesteigerten Vergleich natürlich ab; die Formulierung bleibt anschaulich und vermeidet altertümliche oder konfessionell geprägte Sprache.
