  text: Πᾶς γὰρ πυρὶ ⸀ἁλισθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/049.yaml
  text: For everyone will be salted with fire[a][b].
translation:
  language: de
  text: Denn jeder wird mit Feuer gesalzen werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn jeder wird mit Feuer gewürzt werden.“ Das Bild kann an Gericht, Reinigung oder Opfer erinnern; vergleiche 3. Mose 2,13.'
    reason: lexical_alternative
  - marker: b
    text: 'Einige Handschriften fügen hinzu: „und jedes Opfer wird mit Salz gesalzen werden“.'
    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: jeder
  rationale: Das substantivisch gebrauchte maskuline Singularwort bezeichnet im Zusammenhang am natürlichsten jeden Menschen. „Jeder“ bewahrt zudem die knappe Form des Griechischen.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ gibt die begründende Verbindung zur vorausgehenden Warnung ausdrücklich und idiomatisch wieder.
- source_word: πυρὶ
  choice: mit Feuer
  rationale: Der Dativ kann Mittel oder Begleitumstand bezeichnen. „Mit Feuer“ bewahrt die ungewöhnliche Verbindung mit dem Salzen, ohne sie auf „durch“ oder „im“ Feuer festzulegen.
- source_word: ἁλισθήσεται
  choice: wird gesalzen werden
  rationale: Die zukünftige Passivform von ἁλίζω bedeutet wörtlich „salzen“. Die auffällige Metapher soll erhalten und nicht deutend als Läuterung, Gericht oder Weihe umschrieben werden.
theological_decisions:
- issue: Deutung der Metapher „mit Feuer gesalzen“
  choice: Die wörtlich-metaphorische Formulierung bleibt bestehen, ohne ihre Bedeutung eindeutig festzulegen.
  alternative: Das Feuer ausdrücklich als Gericht, Reinigung, Opferweihe oder Erprobung in der Nachfolge deuten.
  rationale: Der griechische Text ist knapp und vieldeutig; Zusammenhang und mögliche Opferanspielung lassen mehrere miteinander verbundene Deutungen zu. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, standardsprachliches und würdevolles Deutsch. Die absichtlich befremdliche Bildsprache des griechischen Textes bleibt erhalten; die Fußnoten erläutern die lexikalische Alternative und die Textvariante.
