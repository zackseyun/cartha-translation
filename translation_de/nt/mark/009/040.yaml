  text: ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ἡμῶν, ὑπὲρ ἡμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: de
  text: Denn wer nicht gegen uns ist, ist für uns.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »steht auf unserer Seite«. Die griechische Wendung kann auch »zu unseren Gunsten« oder »auf unserer Seite« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: wer
  rationale: Das substantivisch und allgemein gebrauchte Relativpronomen wird im Deutschen natürlich mit „wer“ wiedergegeben und behält so den generischen Sinn.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet oder erläutert die vorausgehende Aussage; „denn“ stellt diesen Zusammenhang knapp und idiomatisch her.
- source_word: οὐκ ἔστιν
  choice: nicht … ist
  rationale: Die verneinte Kopula wird ohne unnötige Erweiterung direkt wiedergegeben.
- source_word: καθ’ ἡμῶν
  choice: gegen uns
  rationale: κατά mit Genitiv bezeichnet hier Gegnerschaft; „gegen uns“ ist klar und entspricht dem Gegenbegriff „für uns“.
- source_word: ὑπὲρ ἡμῶν
  choice: für uns
  rationale: ὑπέρ mit Genitiv kann „für“, „zugunsten von“ oder „auf der Seite von“ bedeuten. „Für uns“ erhält die knappe Antithese zu „gegen uns“.
- source_word: ἐστιν
  choice: ist
  rationale: Die abschließende Kopula wird unmittelbar und schlicht übersetzt.
theological_decisions:
- issue: Reichweite der mit „gegen uns“ und „für uns“ bezeichneten Zugehörigkeit
  choice: 'Die Ich-wir-Beziehung des griechischen Wortlauts bleibt unverändert: „gegen uns“ und „für uns“.'
  alternative: Ausdeutung als „gegen Gott/für Gott“ oder als „gegen unsere Mission/auf unserer Seite“.
  rationale: Der griechische Text spricht ausdrücklich in der ersten Person Plural. Eine nähere Bestimmung würde die im Kontext auszulegende Reichweite vorwegnehmen und die theologische Spannung auflösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Standarddeutsch. Die knappe Parallelstruktur des griechischen Satzes wird bewahrt.
