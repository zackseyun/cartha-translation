source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: de
  text: 'Doch ich sage euch: Auch Elia ist gekommen[a], und sie haben ihm angetan, was sie wollten, wie über ihn geschrieben steht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Elia ist bereits in der Person und im Wirken Johannes des Täufers gekommen; siehe Markus 9,11–12 und vergleiche Matthäus 11,14; 17,12–13.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Markiert den Gegensatz zur Erwartung der Jünger und klingt in diesem feierlichen Ausspruch natürlich.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Gibt die direkte Redeformel eng und zugleich idiomatisch wieder.
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: Elia ist auch schon gekommen
  rationale: Das Perfekt ἐλήλυθεν bezeichnet ein bereits eingetretenes Kommen mit gegenwärtiger Bedeutung; „auch schon“ bringt καὶ sowie den Kontext natürlich zum Ausdruck.
- source_word: ἐποίησαν αὐτῷ
  choice: sie haben mit ihm gemacht
  rationale: Bewahrt die offene und nachdrückliche Formulierung des Griechischen, die erst durch den folgenden Relativsatz näher bestimmt wird.
- source_word: ὅσα ἤθελον
  choice: was sie wollten
  rationale: Gibt die uneingeschränkte Bedeutung von ὅσα idiomatisch wieder, ohne das Ausmaß abzuschwächen.
- source_word: καθὼς γέγραπται
  choice: wie ... geschrieben steht
  rationale: Entspricht der geläufigen Schriftzitat-Formel und bewahrt den resultativen Sinn des Perfekts.
- source_word: ἐπ’ αὐτόν
  choice: über ihn
  rationale: Bei γράφω bezeichnet ἐπί mit Akkusativ hier am wahrscheinlichsten den Gegenstand der schriftlichen Aussage; „gegen ihn“ bleibt grammatisch denkbar, ist im Kontext aber weniger wahrscheinlich.
theological_decisions:
- issue: Identität Elias in diesem Ausspruch
  choice: Im Haupttext bleibt die ausdrückliche Bezeichnung „Elia“ ohne interpretierende Ergänzung stehen.
  alternative: Elia im Haupttext ausdrücklich mit Johannes dem Täufer identifizieren.
  rationale: Der Kontext legt eine Beziehung zu Johannes dem Täufer nahe, doch der Vers selbst nennt Elia. Die Identifikation wird daher als kontextuelle Deutung in der Fußnote erläutert, nicht in den Wortlaut eingefügt.
- issue: Bedeutung von ἐπ’ αὐτόν
  choice: „über ihn“
  alternative: „gegen ihn“
  rationale: Die Konstruktion mit γέγραπται bezeichnet gewöhnlich, was über jemanden geschrieben steht. Die seltenere adversative Lesart soll nicht ohne zwingenden Kontext in den Haupttext aufgenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch ich sage euch“ wahrt den kontrastierenden und feierlichen Ton; „mit ihm gemacht, was sie wollten“ ist klar, kräftig und nah an der griechischen Struktur.
