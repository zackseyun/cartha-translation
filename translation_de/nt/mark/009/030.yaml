  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: de
  text: Nachdem sie von dort aufgebrochen waren, zogen sie durch Galiläa, und Jesus wollte nicht, dass jemand davon erfuhr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text sagt nicht ausdrücklich, wovon niemand Kenntnis erlangen sollte; gemeint sein können Jesu Anwesenheit oder sein Weg durch Galiläa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: Nachdem sie von dort aufgebrochen waren
  rationale: Die Wendung gibt sowohl den Anschluss durch καί als auch den Aufbruch aus dem vorherigen Ort durch ἐξελθόντες wieder. Die temporale Formulierung ist im Deutschen natürlich und wahrt das zeitliche Verhältnis zum Hauptverb.
- source_word: παρεπορεύοντο
  choice: zogen sie
  rationale: Das Imperfekt bezeichnet die fortdauernde Reisebewegung. „Zogen sie durch“ klingt in einer Erzählung natürlich und bildet den Verlauf ab, ohne eine unnatürliche deutsche Verlaufsform zu erzwingen.
- source_word: διὰ τῆς Γαλιλαίας
  choice: durch Galiläa
  rationale: διά mit Genitiv bezeichnet die Bewegung durch ein Gebiet; der deutsche Ortsname steht idiomatisch ohne Artikel.
- source_word: οὐκ ἤθελεν
  choice: Jesus wollte aber nicht
  rationale: θέλω bezeichnet hier Wollen oder Wünschen. Der Name Jesus macht das im Griechischen nur durch den Kontext bestimmte Subjekt im Deutschen eindeutig; „aber“ gibt die narrative Spannung des καί idiomatisch wieder.
- source_word: ἵνα τις γνοῖ
  choice: dass jemand davon erfuhr
  rationale: Die ἵνα-Konstruktion hängt vom verneinten Willensverb ab. „Erfahren“ passt zum Bekanntwerden seiner Anwesenheit oder seines Weges; „davon“ hält den im Griechischen nicht ausdrücklich genannten Inhalt offen und verweist darauf, ohne ihn festzulegen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἤθελεν
  choice: Jesus
  alternative: „er“
  rationale: Die dritte Person Singular verweist im Erzählzusammenhang auf Jesus. Sein Name verhindert im Deutschen eine mögliche Mehrdeutigkeit, ohne zusätzliche theologische Aussage einzuführen.
- issue: Unausgesprochener Inhalt von γνοῖ
  choice: durch „davon“ offen gelassen
  alternative: „dass Jesus dort war“ oder „welchen Weg sie nahmen“
  rationale: Der griechische Text nennt nicht ausdrücklich, was niemand erfahren sollte. Die Übersetzung bewahrt diese Offenheit, statt Anwesenheit, Route oder Reiseabsicht festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Erzählregister. Die fortdauernde Bewegung des griechischen Imperfekts wird durch „zogen … durch“ natürlich wiedergegeben; die sachliche Unbestimmtheit des letzten Satzteils bleibt erhalten.
