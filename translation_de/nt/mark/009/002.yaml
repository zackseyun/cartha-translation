review_pass:
  verdict: revise
  source_fidelity: 'Die Grundwiedergabe ist zuverlässig: μετὰ ἡμέρας ἕξ, die historischen Präsensformen, der Aufstieg auf einen hohen Berg und die sichtbare Verwandlung sind angemessen erfasst. „Allein“ gibt jedoch die kombinierte, nachdrückliche Absonderung von κατ’ ἰδίαν μόνους nur verkürzt wieder. „Dort“ ist im Deutschen zwar verständlich, steht aber nicht im griechischen Text und ist unnötig.'
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Standarddeutsch. „Für sich allein“ ist idiomatisch und gibt die Betonung der Absonderung besser wieder als das bloße „allein“. Die direkte Satzfolge ohne „Dort“ ist klar und näher am markinischen Text.
  terminology: „Petrus“, „Jakobus“ und „Johannes“ entsprechen dem üblichen deutschen biblischen Namengebrauch. „Wurde vor ihren Augen verwandelt“ ist eine sachliche, nicht konfessionell einengende Wiedergabe von μετεμορφώθη ἔμπροσθεν αὐτῶν. Die Fußnote kann „verklärt“ als traditionelle Alternative nennen, ohne diese als zwingende Deutung vorzuschreiben.
  issues:
  - severity: medium
    issue: Die Wendung κατ’ ἰδίαν μόνους ist nur als „allein“ wiedergegeben.
    rationale: Die beiden Ausdrücke verstärken gemeinsam die Absonderung. „Für sich allein“ bewahrt diese Betonung auf natürliches Deutsch.
  - severity: low
    issue: „Dort“ ist eine nicht ausdrücklich im Ausgangstext vorhandene Ortsverweisung.
    rationale: Der Bezug auf den Berg ist selbstverständlich, aber das Wort kann ohne Bedeutungsverlust entfallen und die Satzfolge des Griechischen genauer abbilden.
  revised_text: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und Johannes mit und führt sie für sich allein auf einen hohen Berg. Und er wurde vor ihren Augen verwandelt.[b]
