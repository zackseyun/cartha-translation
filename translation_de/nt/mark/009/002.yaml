- from: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und Johannes mit und führt sie allein auf einen hohen Berg. Dort wurde er vor ihren Augen verwandelt.[b]
  to: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und Johannes mit und führt sie für sich allein auf einen hohen Berg. Und er wurde vor ihren Augen verwandelt.[b]
  rationale: Die Revision gibt die doppelte Absonderungsformel κατ’ ἰδίαν μόνους mit „für sich allein“ vollständiger wieder und entfernt das ergänzende „Dort“. Die passive, sichtbare Verwandlung bleibt bewusst ohne weitergehende dogmatische Erklärung formuliert.
