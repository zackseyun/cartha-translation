source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: de
  text: Und nach sechs Tagen[a] nimmt Jesus Petrus, Jakobus und Johannes mit und führt sie für sich allein auf einen hohen Berg. Und er wurde vor ihren Augen verwandelt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sechs Tage später“.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionell: „wurde vor ihnen verklärt“. Das griechische Verb bezeichnet eine Verwandlung der Gestalt oder Erscheinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: nach sechs Tagen
  rationale: Gibt die temporale Konstruktion mit μετά und Akkusativ eng und zugleich idiomatisch wieder; „sechs Tage später“ ist ebenfalls möglich.
- source_word: παραλαμβάνει
  choice: nimmt ... mit
  rationale: Das historische Präsens wird bewahrt; „mitnehmen“ drückt hier passend aus, dass Jesus die drei ausgewählten Jünger zu sich nimmt und mitführt.
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: führt sie ... auf einen hohen Berg
  rationale: „Hinaufführen“ bzw. „auf einen Berg führen“ erfasst die aufwärts gerichtete Bewegung und das Ziel der Handlung in natürlichem Deutsch.
- source_word: κατ’ ἰδίαν μόνους
  choice: allein
  rationale: 'Beide griechischen Ausdrücke betonen die Absonderung: Nur Jesus und diese drei sind dort. Eine doppelte Wiedergabe wie „für sich allein“ wäre möglich, klingt im Satz aber schwerer.'
- source_word: μετεμορφώθη
  choice: wurde ... verwandelt
  rationale: „Verwandelt“ gibt die passive Form und die sichtbare Veränderung wieder, ohne deren Wesen über den Text hinaus zu erklären. Das traditionelle „verklärt“ ist als Alternative vermerkt.
- source_word: ἔμπροσθεν αὐτῶν
  choice: vor ihren Augen
  rationale: Bringt idiomatisch zum Ausdruck, dass die Verwandlung sichtbar in ihrer Gegenwart geschah.
theological_decisions:
- issue: Wiedergabe von μετεμορφώθη im christologischen Kontext
  choice: wurde ... verwandelt
  alternative: wurde vor ihnen verklärt
  rationale: „Verwandelt“ bleibt lexikalisch transparent und lässt Art und Bedeutung des Geschehens offen; „verklärt“ ist die kirchlich und bibelsprachlich etablierte Bezeichnung, kann modernen Lesern aber bereits eine Deutung nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das markinische historische Präsens wird bei „nimmt“ und „führt“ erhalten; beim Passiv „wurde verwandelt“ ist das deutsche Präteritum natürlicher. „Dort“ löst den langen Satz übersichtlich auf, ohne zusätzliche Sachinformation einzuführen.
