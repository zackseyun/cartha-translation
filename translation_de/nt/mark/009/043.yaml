id: MRK.9.43
reference: Mark 9:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: de
  text: Und wenn deine Hand dich zu Fall bringt[a], dann schneide sie ab. Es ist besser für dich, verstümmelt in das Leben einzugehen, als mit beiden Händen in die Gehenna[b] zu gehen, in das unauslöschliche Feuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dich zur Sünde verführt“. Das griechische Verb kann bedeuten, jemanden zum Stolpern, zu Fall oder zur Sünde zu bringen.'
    reason: lexical_alternative
  - marker: b
    text: Gehenna ist die griechische Form eines Ortsnamens, der mit Gottes Gericht verbunden ist; traditionell mit „Hölle“ wiedergegeben.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: dich zu Fall bringt
  rationale: Bewahrt das griechische Bild des Stolperns beziehungsweise Fallens und lässt zugleich den im Zusammenhang naheliegenden Sinn des Verführens zur Sünde offen.
- source_word: ἀπόκοψον
  choice: hau sie ab
  rationale: Gibt den nachdrücklichen Imperativ konkret und ungemildert wieder; im Deutschen ist dies bei einem Körperglied natürlicher als „schneide sie ab“.
- source_word: καλόν
  choice: es ist besser
  rationale: Obwohl καλόν für sich „gut“ bedeutet, verlangt die Vergleichskonstruktion mit ἤ im Deutschen idiomatisch den Komparativ.
- source_word: κυλλόν
  choice: verstümmelt
  rationale: Bezeichnet hier den Zustand nach dem Verlust einer Hand und bewahrt die drastische Körperbildlichkeit, ohne eine allgemeine moderne Behinderungsbezeichnung zu verwenden.
- source_word: εἰσελθεῖν εἰς τὴν ζωήν
  choice: in das Leben einzugehen
  rationale: Bewahrt die eschatologische Wendung sowie den Gegensatz zwischen dem Eingehen in das Leben und dem Kommen in die Gehenna.
- source_word: ἀπελθεῖν
  choice: zu kommen
  rationale: Natürliches Deutsch im Zusammenhang mit einem Zielort; die vom Präfix ausgedrückte Bewegung weg vom bisherigen Ort lässt sich hier nicht elegant ausdrücklich wiedergeben, ohne den Satz zu beschweren.
- source_word: γέενναν
  choice: Gehenna
  rationale: Erhält den konkreten griechischen Namen mit seinem jüdischen Gerichtshintergrund, statt ihn bereits im Haupttext mit dem umfassenderen theologischen Begriff „Hölle“ gleichzusetzen.
- source_word: ἄσβεστον
  choice: unauslöschlich
  rationale: Gibt präzise wieder, dass das Feuer nicht gelöscht werden kann beziehungsweise nicht erlischt.
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: mit beiden Händen
  rationale: Ist die natürliche deutsche Entsprechung und erhält den ausdrücklichen Gegensatz zur abgehauenen Hand.
theological_decisions:
- issue: Wiedergabe von γέεννα in der Gerichtsaussage
  choice: Gehenna
  alternative: Hölle
  rationale: Der Eigenname bleibt erhalten, damit die besondere jüdische Orts- und Gerichtsvorstellung des Ausgangstextes nicht vorschnell in einen später breiter verwendeten theologischen Begriff überführt wird; die traditionelle Wiedergabe steht in der Fußnote.
- issue: Bedeutungsumfang von σκανδαλίζῃ
  choice: zu Fall bringt, mit erläuternder Fußnote
  alternative: zur Sünde verführt
  rationale: Das Fallbild und die moralisch-geistliche Tragweite werden beide sichtbar gehalten, ohne die Mehrdeutigkeit im Haupttext auf eine einzige Erklärung zu verengen.
- issue: Drastische Aufforderung zum Abhauen der Hand
  choice: konkrete Körperbildlichkeit unverändert beibehalten
  alternative: deutende Abschwächung als allgemeine Aufforderung, Sünde zu meiden
  rationale: Der Ausgangstext verwendet bewusst schockierende Sprache. Eine Erklärung oder Einschränkung ihrer beabsichtigten Anwendung wäre Auslegung und gehört nicht in den Übersetzungstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst drastischer Bildsprache. „Hau sie ab“ ist unmittelbar und idiomatisch, ohne die Härte des Ausgangstextes abzuschwächen. Die Satzstruktur bleibt klar und gut vorlesbar.
