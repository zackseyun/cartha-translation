source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: de
  text: Und sofort geriet die ganze Menge, als sie ihn sah, außer sich vor Staunen. Die Menschen liefen zu ihm hin und begrüßten ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus typische Dringlichkeit und ist in modernem Standarddeutsch natürlich.
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menschenmenge
  rationale: Gibt den kollektiven Singular samt der umfassenden Bedeutung von πᾶς wieder.
- source_word: ἰδόντες αὐτόν
  choice: als sie ihn sah
  rationale: Das Aoristpartizip wird als temporaler Umstand wiedergegeben, der die anschließende Reaktion auslöst.
- source_word: ἐξεθαμβήθησαν
  choice: geriet ... in große Aufregung
  rationale: Die Form bezeichnet eine intensive emotionale Reaktion zwischen Staunen, Bestürzung und Erschrecken. Diese Wiedergabe erhält die Intensität, ohne den Grund oder die genaue Gefühlsart festzulegen.
- source_word: προστρέχοντες
  choice: liefen auf ihn zu
  rationale: Gibt die zielgerichtete, rasche Bewegung anschaulich und idiomatisch wieder.
- source_word: ἠσπάζοντο αὐτόν
  choice: begrüßten ihn
  rationale: ἀσπάζομαι bezeichnet hier neutral das Begrüßen; das Imperfekt passt zur erzählten Handlung der Menge.
theological_decisions:
- issue: Art und Ursache der Reaktion der Menge auf Jesus
  choice: Eine intensive, nicht näher bestimmte Aufregung
  alternative: Großes Erstaunen, Erschrecken oder eine Reaktion auf eine übernatürliche Ausstrahlung Jesu
  rationale: Der Vers nennt weder die genaue Gefühlsmischung noch deren Ursache. Die Übersetzung bewahrt deshalb die semantische Spannung von ἐξεθαμβήθησαν und fügt keine Verklärungserklärung hinzu.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzähldeutsch. Der Wechsel zu »Die Leute« vermeidet eine unnatürliche Fortführung des grammatisch singularischen Kollektivums und macht die pluralischen Handlungen der Menge klar.
