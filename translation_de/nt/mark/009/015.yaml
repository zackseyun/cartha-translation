revisions:
- from: Und sofort geriet die ganze Menschenmenge, als sie ihn sah, in große Aufregung[a]. Die Leute liefen auf ihn zu und begrüßten ihn.
  to: Und sofort geriet die ganze Menge, als sie ihn sah, außer sich vor Staunen. Die Menschen liefen zu ihm hin und begrüßten ihn.
  rationale: Die Hauptwiedergabe wird von der allgemeinen »Aufregung« zu einer klaren starken Staunensreaktion präzisiert, entsprechend dem unmittelbaren Kontext und der englischen Audit-Entscheidung. Die alternative Bedeutungskomponente des Erschreckens bleibt in der Fußnote erhalten. Der zweite Satz behält die erzählerische Folge der griechischen Partizipialkonstruktion bei und verwendet eine kohärente Bezeichnung für die Menge.
