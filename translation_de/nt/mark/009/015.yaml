  source_fidelity: Die zeitliche Beziehung von ἰδόντες αὐτόν ist zutreffend erfasst, ebenso die umfassende Reaktion der Menge und das anschließende Herbeilaufen und Begrüßen. »In große Aufregung geraten« ist für ἐξεθαμβήθησαν jedoch zu unspezifisch und kann im Deutschen bloße Unruhe oder Betriebsamkeit bezeichnen, während das griechische Verb eine starke bestürzte/erstaunte Reaktion ausdrückt.
  naturalness: Der Satz ist grundsätzlich verständlich, aber der Wechsel von »die ganze Menschenmenge« zu »Die Leute« wirkt unnötig und schwächt den Bezug zur handelnden Menge. Die Revision formuliert die Kollektivhandlung idiomatisch und ohne diesen Wechsel.
  terminology: »Menge« ist für ὄχλος im erzählenden Kontext idiomatisch. »Außer sich vor Staunen« gibt die Intensität von ἐξεθαμβήθησαν klar wieder, ohne eine Ursache wie etwa eine übernatürliche Ausstrahlung einzutragen. Die Fußnote bewahrt die mögliche Nuance des Erschreckens/Bestürztseins.
  issues:
