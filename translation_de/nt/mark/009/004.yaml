  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: de
  text: Und Elia erschien ihnen zusammen mit Mose, und die beiden sprachen mit Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Der Aorist Passiv von ὁράω kann hier intransitiv im Sinn von »erschien« beziehungsweise »wurde sichtbar« verstanden werden. »Erschien« ist im Deutschen natürlich und gibt das unvermittelte Sichtbarwerden wieder.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Personen, denen Elia und Mose sichtbar wurden; »ihnen« bildet ihn knapp und unmittelbar ab.
- source_word: Ἠλίας
  choice: Elia
  rationale: Gebräuchliche deutsche Namensform.
- source_word: σὺν Μωϋσεῖ
  choice: zusammen mit Mose
  rationale: σύν bezeichnet Begleitung. »Zusammen mit« macht deutlich, dass Mose gemeinsam mit Elia erscheint, und folgt der ungewöhnlichen griechischen Reihenfolge Elia–Mose.
- source_word: ἦσαν συλλαλοῦντες
  choice: die beiden sprachen
  rationale: Die periphrastische Konstruktion bezeichnet ein andauerndes gemeinsames Sprechen. »Die beiden sprachen« gibt den wechselseitigen Vorgang natürlich wieder und macht den pluralischen Bezug auf Elia und Mose eindeutig.
- source_word: τῷ Ἰησοῦ
  choice: mit Jesus
  rationale: Beim Verb συλλαλέω bezeichnet der Dativ den Gesprächspartner; »mit Jesus« bringt den gegenseitigen Charakter idiomatisch zum Ausdruck.
theological_decisions:
- issue: Identität und Wirklichkeit von Elia und Mose in der Verklärungsszene
  choice: Elia und Mose werden ohne einschränkende Deutung als erscheinende und mit Jesus sprechende Personen dargestellt.
  alternative: Die Erscheinung ausdrücklich als nur visionär oder rein symbolisch kennzeichnen.
  rationale: Der griechische Erzähltext macht keine solche Einschränkung. Die Übersetzung gibt die Darstellung direkt wieder, ohne die Art der Erscheinung dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Ergänzung »die beiden« ist eine kontextuell eindeutige Explizierung des griechischen Plurals und verhindert, dass »sie« fälschlich auf die Jünger bezogen wird. Keine Fußnote nötig; die englische Fußnote betrifft eine englische Stilalternative und weist keine eigenständige textliche Variante aus.
