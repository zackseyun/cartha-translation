id: MRK.9.42
reference: Mark 9:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: de
  text: Und wer einen von diesen Kleinen, die an mich glauben, zu Fall bringt[a] – für den wäre es besser, wenn ihm ein von einem Esel angetriebener Mühlstein um den Hals gelegt und er ins Meer geworfen würde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Sünde verführt“; das griechische Wort kann auch das Abbringen vom Glauben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: zu Fall bringt
  rationale: Die Wendung bewahrt das Bild des Stolperns und kann zugleich Verführung zur Sünde oder Abfall einschließen. „Zur Sünde verführt“ wäre enger, „Anstoß erregt“ im heutigen Deutsch zu schwach.
- source_word: μικρῶν τούτων
  choice: diesen Kleinen
  rationale: Die Formulierung lässt offen, ob vor allem Kinder, gering Geachtete oder schutzbedürftige Jünger gemeint sind, und entspricht der Breite des griechischen Ausdrucks.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: die an mich glauben
  rationale: Dies gibt die auf Jesus gerichtete persönliche Glaubensbeziehung direkt und idiomatisch wieder.
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: für den wäre es besser
  rationale: Der deutsche Irrealis bringt den vergleichenden Sinn der drastischen Warnung natürlich zum Ausdruck.
- source_word: μύλος ὀνικός
  choice: ein von einem Esel angetriebener Mühlstein
  rationale: Der Ausdruck bezeichnet den großen Mühlstein einer von einem Esel betriebenen Mühle und unterscheidet ihn von einem kleineren Handmühlstein.
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: ihm ... um den Hals gelegt
  rationale: Die passive Formulierung gibt das Umlegen des Steins klar und in natürlichem Deutsch wieder.
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: er ins Meer geworfen würde
  rationale: Im Zusammenhang mit dem deutschen Vergleichssatz ist der Irrealis idiomatisch; der vollendete, folgenschwere Vorgang bleibt deutlich.
theological_decisions:
- issue: Bezug von „diesen Kleinen“
  choice: Die Übersetzung bleibt weit genug für gering geachtete oder schutzbedürftige Glaubende, Kinder eingeschlossen.
  alternative: Ausschließlich kleine Kinder oder allgemein alle demütigen Jünger.
  rationale: Der Zusatz „die an mich glauben“ kennzeichnet sie als Glaubende, legt aber keine ausschließliche Alters- oder Statusgruppe eindeutig fest.
- issue: Bedeutungsumfang von σκανδαλίζω
  choice: „zu Fall bringt“ bewahrt das Bild und lässt Verführung zur Sünde sowie Gefährdung des Glaubens offen.
  alternative: „zur Sünde verführt“ oder „vom Glauben abbringt“.
  rationale: Der Kontext enthält eine ernste geistliche Gefährdung, bestimmt deren genaue Form jedoch nicht ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung wahrt die feierliche Schärfe der Warnung; „von einem Esel angetriebener Mühlstein“ erklärt den antiken Sachbezug ohne unnötigen Fachausdruck.
