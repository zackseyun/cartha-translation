source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτο τὸ γένος ἐν οὐδενὶ δύναται ἐξελθεῖν εἰ μὴ ἐν ⸀προσευχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/029.yaml
  text: And he said to them[a], “This kind cannot come out by anything except prayer.”
translation:
  language: de
  text: 'Und er sagte zu ihnen[a]: »Diese Art kann durch nichts ausfahren außer durch Gebet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige spätere Handschriften lesen: »durch Gebet und Fasten«.'
    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: Diese Art
  rationale: γένος bezeichnet hier eine Art oder Klasse. Im Zusammenhang ist ein unreiner Geist gemeint; da das griechische Wort »Geist« jedoch nicht ausdrücklich wiederholt, ergänzt die Übersetzung es nicht.
- source_word: ἐν οὐδενὶ
  choice: durch nichts
  rationale: Die Wendung bezeichnet hier das Mittel. »Durch nichts« bewahrt die negative Form des Griechischen und fügt sich natürlich in die anschließende Ausnahme ein.
- source_word: δύναται ἐξελθεῖν
  choice: kann … ausfahren
  rationale: Die Verbindung drückt Unvermögen aus. »Ausfahren« ist im biblischen Erzählzusammenhang eine verständliche und präzise Bezeichnung dafür, dass ein unreiner Geist einen Menschen verlässt.
- source_word: εἰ μὴ
  choice: außer
  rationale: εἰ μὴ führt nach der Verneinung die einzige Ausnahme ein; »außer« gibt diese Beziehung knapp und natürlich wieder.
- source_word: ἐν προσευχῇ
  choice: durch Gebet
  rationale: Die Präposition bezeichnet das Mittel. Die Wiederholung von »durch« macht diesen instrumentalen Sinn im Deutschen klar.
theological_decisions:
- issue: Ob »und Fasten« in den Haupttext aufzunehmen ist
  choice: nur »Gebet«
  alternative: »Gebet und Fasten«
  rationale: Der vorgegebene SBLGNT-Text enthält nur προσευχῇ (»Gebet«). Die längere Lesart wird als bekannte Textvariante in der Fußnote bewahrt, aber nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Diese Art« bewahrt die knappe Ausdrucksweise und die implizite Bezugnahme auf den unreinen Geist. »Ausfahren« ist leicht bibelsprachlich, bleibt aber im Kontext klar und erhält die Vorstellung des Herausgehens besser als eine explizitere Ergänzung wie »ausgetrieben werden«.
