  verdict: approve
  source_fidelity: Der Text gibt ὅπου, ὁ σκώληξ αὐτῶν, οὐ τελευτᾷ und τὸ πῦρ οὐ σβέννυται vollständig und sinngetreu wieder. »ihr Wurm« bewahrt die possessive Bildsprache, »stirbt« ist für τελευτᾷ passend, und »das Feuer nicht erlischt« ist eine idiomatische deutsche Wiedergabe des passiven σβέννυται, ohne die Bildaussage weiter auszudeuten.
  naturalness: Die Formulierung ist knapp, würdevoll und im modernen Standarddeutsch natürlich. Die Satzstellung nach »wo« ist korrekt; die traditionsnahe Wortwahl wirkt nicht künstlich.
  terminology: »Wurm« erhält die Anspielung auf Jesaja 66,24 und vermeidet eine unnötige Festlegung auf »Made«. Die Wiedergabe von Feuer und Wurm bleibt bildhaft und konfessionell nicht interpretierend. Die textkritische Fußnote ist sachlich, verständlich und gibt die englische Audit-Information angemessen wieder.
