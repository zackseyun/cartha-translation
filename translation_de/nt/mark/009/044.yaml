  text: where[a] their worm does not die, and the fire is not quenched.
translation:
  language: de
  text: wo ihr Wurm nicht stirbt und das Feuer nicht erlischt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er steht jedoch im Codex Alexandrinus aus dem 5. Jahrhundert, in der lateinischen Überlieferung und in der späteren byzantinischen Mehrheit. Wahrscheinlich wurde er später von einem Abschreiber eingefügt; derselbe Wortlaut steht in Vers 48.
    reason: textual_critical
lexical_decisions:
- source_word: σκώληξ
  choice: Wurm
  rationale: Die direkte und traditionelle Entsprechung bewahrt die Bildsprache aus Jesaja 66,24; im Zusammenhang kann damit ein an Verwesendem fressender Wurm gemeint sein.
- source_word: τελευτᾷ
  choice: stirbt
  rationale: Das Verb bedeutet »zu Ende kommen« beziehungsweise bei einem Lebewesen »sterben«; hier ist »stirbt« natürlich und präzise.
- source_word: σβέννυται
  choice: erlischt
  rationale: Das Passiv bezeichnet, dass ein Feuer ausgelöscht wird beziehungsweise erlischt. Die deutsche Formulierung »nicht erlischt« ist idiomatisch und erhält das Bild eines unaufhörlichen Feuers.
theological_decisions:
- issue: Aussage über Wurm und Feuer
  choice: Die bildhafte Aussage wird ohne zusätzliche Deutung wiedergegeben.
  alternative: Die Bilder ausdrücklich als Aussage über ewige bewusste Strafe, Vernichtung oder Verwesung auslegen.
  rationale: Der griechische Text selbst benennt die Bilder, erklärt aber an dieser Stelle nicht abschließend ihre genaue theologische Tragweite; diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Wendung »ihr Wurm« bewahrt den Bezug zur alttestamentlichen Bildsprache; »erlischt« ist im Deutschen natürlicher als das stärker transitive »wird nicht ausgelöscht«.
