source:
  edition: SBLGNT
  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: de
  text: 'Und sie kamen nach Kafarnaum. Als er im Haus war, fragte er sie: »Worüber habt ihr unterwegs gesprochen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Worüber habt ihr unterwegs gestritten?« Das Verb kann ein Gespräch, eine Erörterung oder eine Auseinandersetzung bezeichnen; der folgende Vers zeigt, dass es darum ging, wer von ihnen der Größte sei.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: sie kamen
  rationale: Der Aorist von ἔρχομαι bezeichnet hier im Erzählzusammenhang die Ankunft in Kafarnaum; »sie kamen« gibt dies schlicht und natürlich wieder.
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Verwendet wird die im modernen Deutschen übliche Namensform.
- source_word: ἐν τῇ οἰκίᾳ
  choice: im Haus
  rationale: Die konkrete Ortsangabe und der bestimmte Artikel bleiben erhalten; »zu Hause« würde stärker interpretieren.
- source_word: γενόμενος
  choice: als er … war
  rationale: Das Partizip wird temporal wiedergegeben. Der im Kontext erkennbare Singularbezug auf Jesus wird im Deutschen ausdrücklich gemacht.
- source_word: ἐπηρώτα
  choice: fragte er sie
  rationale: Das Imperfekt kann einen andauernden oder wiederholten Vorgang ausdrücken, doch im Deutschen ist das Präteritum in dieser erzählerischen Frage natürlicher und legt den Aspekt nicht unnötig fest.
- source_word: Τί
  choice: worüber
  rationale: Da das Verb eine gemeinsame Erörterung bezeichnet, ist »worüber« im Deutschen idiomatischer als ein isoliertes »was«.
- source_word: ἐν τῇ ὁδῷ
  choice: unterwegs
  rationale: Dies ist die natürliche deutsche Entsprechung für die temporale und örtliche Bedeutung während des Weges.
- source_word: διελογίζεσθε
  choice: habt ihr … gesprochen
  rationale: Das Verb kann besprechen, erörtern, debattieren oder streiten bedeuten. »gesprochen« bewahrt im Haupttext die Offenheit; die schärfere mögliche Bedeutung wird in der Fußnote genannt.
theological_decisions:
- issue: Subjektwechsel vom pluralischen ἦλθον zum singularischen γενόμενος/ἐπηρώτα
  choice: Die Gruppe kommt nach Kafarnaum; anschließend wird Jesus als singularisches Subjekt ausdrücklich mit »er« bezeichnet.
  alternative: 'Expliziter formulieren: »Nachdem Jesus ins Haus gekommen war, fragte er sie …«'
  rationale: Der Kontext identifiziert Jesus als das singularische Subjekt. Die gewählte Form macht dies verständlich, ohne einen im Griechischen nicht ausdrücklich genannten Namen einzufügen.
- issue: Nuance von διελογίζεσθε
  choice: Im Haupttext neutral »gesprochen«, mit Hinweis auf »gestritten« in der Fußnote.
  alternative: Direkt im Haupttext »gestritten« oder »diskutiert«.
  rationale: Der folgende Vers lässt eine Auseinandersetzung über Rang erkennen, doch das Verb selbst umfasst ein breiteres Bedeutungsspektrum. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau ist natürlich deutsch; die anfängliche griechische Satzverknüpfung wird im ersten Satz mit »Und« bewahrt, vor dem temporalen Nebensatz jedoch nicht mechanisch wiederholt.
