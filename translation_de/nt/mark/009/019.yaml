  text: ὁ δὲ ἀποκριθεὶς ⸀αὐτοῖς λέγει· Ὦ γενεὰ ἄπιστος, ἕως πότε πρὸς ὑμᾶς ἔσομαι; ἕως πότε ἀνέξομαι ὑμῶν; φέρετε αὐτὸν πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: de
  text: 'Da antwortet er ihnen: „O ungläubige Generation[a], wie lange werde ich noch bei euch sein? Wie lange werde ich euch noch ertragen?[b] Bringt ihn zu mir!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „treulose Generation“ beziehungsweise „Generation ohne Glauben“. Das griechische Wort kann sowohl fehlenden Glauben als auch fehlende Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Wie lange soll ich euch noch aushalten?“ beziehungsweise „Wie lange soll ich noch Geduld mit euch haben?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς αὐτοῖς λέγει
  choice: Da antwortet er ihnen
  rationale: Die Wendung gibt das Partizip ἀποκριθείς zusammen mit dem markinischen historischen Präsens λέγει in natürlichem, lebendigem Deutsch wieder. „Da“ nimmt den fortführenden Charakter von δέ auf, ohne einen starken Gegensatz einzutragen.
- source_word: γενεὰ ἄπιστος
  choice: ungläubige Generation
  rationale: „Generation“ bewahrt den kollektiven und zeitbezogenen Sinn von γενεά. „Ungläubig“ bezeichnet im Kontext vor allem den Mangel an Glauben beziehungsweise Vertrauen; die mögliche Bedeutung „treulos“ wird in einer Fußnote offengehalten.
- source_word: ἕως πότε πρὸς ὑμᾶς ἔσομαι
  choice: wie lange werde ich noch bei euch sein?
  rationale: „Wie lange“ ist die natürliche deutsche Entsprechung von ἕως πότε. Das idiomatische „noch“ macht die vorausgesetzte bisherige Anwesenheit deutlich, ohne den Sinn zu erweitern; „bei euch sein“ gibt πρός mit dem Verb des Seins angemessen wieder.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: Wie lange werde ich euch noch ertragen?
  rationale: „Ertragen“ bewahrt sowohl den Gedanken des Aushaltens als auch den scharfen, von Enttäuschung geprägten Ton der Frage. Eine weniger scharf klingende mögliche Wiedergabe wird in der Fußnote genannt.
- source_word: φέρετε αὐτὸν πρός με
  choice: Bringt ihn zu mir!
  rationale: Der deutsche Imperativ gibt den direkten Befehl und die Richtung von πρός με knapp und natürlich wieder.
theological_decisions:
- issue: Bedeutung von ἄπιστος in Jesu Anrede
  choice: ungläubig
  alternative: treulos / ohne Glauben
  rationale: Im unmittelbaren Zusammenhang steht mangelndes Vertrauen im Vordergrund. Da ἄπιστος zugleich fehlende Treue bezeichnen kann, wird diese theologisch bedeutsame Mehrdeutigkeit nicht ausgeschlossen, sondern in der Fußnote erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, unmittelbarem Ton. Das historische Präsens erhält die für Markus typische Lebendigkeit. „O“ bewahrt die feierlich-klagende Anrede, während „Generation“ gegenüber dem missverständlichen oder altertümlich wirkenden „Geschlecht“ bevorzugt wird.
