source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: de
  text: 'Denn wer euch einen Becher Wasser zu trinken gibt, weil ihr zum Messias gehört,[a] – Amen, ich sage euch: Er wird seinen Lohn ganz gewiss nicht verlieren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »in Namen, dass/weil ihr des Messias seid«. Die griechische Verbindung ist ungewöhnlich. Möglich ist auch: »unter Berufung auf den Namen, weil ihr zum Messias gehört«.'
    reason: Der Ausgangstext verbindet ἐν ὀνόματι mit ὅτι χριστοῦ ἐστε auf ungewöhnliche Weise; die Fußnote dokumentiert die Form und eine alternative syntaktische Deutung.
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: Denn wer
  rationale: Die unbestimmte Relativkonstruktion wird im Deutschen natürlich mit „wer“ wiedergegeben; „denn“ bewahrt den Anschluss an den vorherigen Gedankengang.
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: euch einen Becher Wasser zu trinken gibt
  rationale: Die Formulierung gibt ποτίζω („zu trinken geben“) und ποτήριον ὕδατος eng am griechischen Ausdruck und zugleich verständlich wieder.
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: weil ihr zum Messias gehört
  rationale: Die ungewöhnliche griechische Verbindung bezeichnet den Namen beziehungsweise die Zugehörigkeit zum Messias als Grund für die Hilfe. Die klare kausale Wiedergabe ist im Deutschen natürlich; die formale Ungewöhnlichkeit und eine alternative Deutung werden in der Fußnote offengelegt.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: amen, ich sage euch
  rationale: „Amen“ bewahrt Jesu feierliche Bekräftigungsformel, während der folgende Satzbau modernes, verständliches Deutsch bleibt.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: wird ... ganz gewiss nicht verlieren
  rationale: „Ganz gewiss nicht“ bringt die nachdrückliche Verneinung οὐ μή mit Aoristkonjunktiv deutlich zum Ausdruck.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: seinen Lohn
  rationale: „Lohn“ ist die direkte und in diesem Zusammenhang geläufige Wiedergabe von μισθός; sie lässt den Charakter der verheißenen Vergeltung offen.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel in χριστοῦ ἐστε
  choice: zum Messias gehört
  alternative: Christus gehört / des Christus seid
  rationale: Χριστός bezeichnet hier den Titel Jesu. „Messias“ macht diesen Titelgehalt sichtbar; „gehört“ drückt den possessiven Genitiv in natürlichem Deutsch aus.
- issue: Verhältnis von ἐν ὀνόματι und ὅτι χριστοῦ ἐστε
  choice: 'kausal: weil ihr zum Messias gehört'
  alternative: unter Berufung auf den Namen, dass/weil ihr dem Messias gehört
  rationale: Der griechische Wortlaut ist syntaktisch ungewöhnlich. Die Hauptfassung versteht die Zugehörigkeit zum Messias als Beweggrund der Gabe, ohne „meinen Namen“ in den Text einzutragen; die Fußnote bewahrt die formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Amen“ erhält den markanten Sprachgebrauch Jesu; „ganz gewiss nicht“ vermeidet altertümliche Wendungen und bewahrt die emphatische Verneinung. Der Gedankenstrich markiert die feierliche Bekräftigung, ohne zusätzliche Aussage einzuführen.
