  terminology: „Der Geist“ ist terminologisch richtig und zurückhaltend. Die Umschreibung „in heftige Krämpfe versetzen“ ist verständlich und gibt συνεσπάραξεν sachgerecht wieder; „heftige“ ist als Wiedergabe der Intensität des Verbs vertretbar.
