source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: de
  text: Und sie brachten ihn zu Jesus. Als der Geist Jesus sah, versetzte er den Jungen sofort in heftige Krämpfe. Der Junge fiel zu Boden und wälzte sich schäumend hin und her.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤνεγκαν αὐτὸν πρὸς αὐτόν
  choice: sie brachten ihn zu Jesus
  rationale: φέρω bezeichnet hier das Herbeibringen des Jungen. Der Name „Jesus“ löst die im Deutschen schwer verständliche doppelte Pronomenfolge auf, ohne den Bezug zu verändern.
- source_word: ἰδὼν αὐτόν
  choice: Als der Geist Jesus sah
  rationale: Das Aoristpartizip wird natürlich temporal wiedergegeben. „Jesus“ verdeutlicht den Bezug des zweiten αὐτόν und verhindert eine falsche Rückbeziehung auf den Jungen.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der Vers selbst sagt nur „der Geist“. Die nähere Bestimmung als unreiner Geist ergibt sich aus dem Zusammenhang und wird nicht in den Haupttext eingefügt.
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ gibt die markinische Unmittelbarkeit in aktuellem, natürlichem Deutsch wieder.
- source_word: συνεσπάραξεν αὐτόν
  choice: versetzte er den Jungen in heftige Krämpfe
  rationale: Das Verb bezeichnet ein heftiges krampfartiges Schütteln. Die Umschreibung ist im Deutschen klarer als „verkrampfte ihn“; „den Jungen“ klärt, worauf αὐτόν zielt.
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: Der fiel zu Boden
  rationale: Das Partizip bezeichnet die anschließende Handlung des Jungen. Ein neuer deutscher Satz klärt den Subjektwechsel vom Geist zum Jungen.
- source_word: ἐκυλίετο
  choice: wälzte sich hin und her
  rationale: Der Imperfekt beschreibt eine fortdauernde Bewegung. „Sich hin und her wälzen“ ist dafür eine natürliche deutsche Wendung.
- source_word: ἀφρίζων
  choice: schäumend
  rationale: Die knappe Partizipialform bewahrt, dass der griechische Text den Ort des Schäumens nicht ausdrücklich nennt.
theological_decisions:
- issue: Identität von τὸ πνεῦμα
  choice: „der Geist“ ohne ergänzendes Adjektiv
  alternative: „der unreine Geist“ oder „der Dämon“
  rationale: Obwohl der weitere Kontext den Geist als unrein kennzeichnet, steht in diesem Vers ausdrücklich nur τὸ πνεῦμα. Die Übersetzung wahrt diese Formulierung, ohne die Identität abzuschwächen oder interpretierend auszubauen.
- issue: Handelnde Person beim Sehen und beim Krampfanfall
  choice: Der Geist sieht Jesus und versetzt den Jungen in Krämpfe
  alternative: Pronomengetreue, aber im Deutschen mehrdeutige Wiedergabe
  rationale: Die syntaktischen Bezüge werden zur Verständlichkeit explizit gemacht. Dies beschreibt die erzählte geistliche Ursache, ohne eine zusätzliche medizinische oder dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Explizite Namen beziehungsweise Nominalgruppen ersetzen mehrdeutige Pronomen; die knappe und bewegte Abfolge des griechischen Satzes bleibt erhalten.
