id: MRK.15.34
reference: Mark 15:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: de
  text: 'Und in der neunten Stunde[a] rief Jesus mit lauter Stimme: „Eloï, Eloï, lema sabachtani?“[b] Das heißt übersetzt: „Mein Gott, mein Gott, warum hast du mich verlassen?“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die neunte Stunde entspricht ungefähr drei Uhr nachmittags.
    reason: historical_context
  - marker: b
    text: Einige Handschriften haben hier „lama“ statt „lema“.
    reason: textual_variant
  - marker: c
    text: Der Ruf greift Psalm 22,2 auf (in anderer Verszählung Psalm 22,1).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: in der neunten Stunde
  rationale: Die quellsprachliche Zeitangabe bleibt im Haupttext erhalten; eine Fußnote erschließt sie heutigen Lesern als ungefähr drei Uhr nachmittags.
- source_word: ἐβόησεν … φωνῇ μεγάλῃ
  choice: rief … mit lauter Stimme
  rationale: Die Verbindung gibt sowohl den kräftigen Ruf als auch die ausdrücklich genannte Lautstärke natürlich und würdig wieder.
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: Eloï, Eloï, lema sabachtani?
  rationale: Wie Markus bewahrt die Übersetzung zunächst den semitischen Wortlaut in Umschrift. „Lema“ folgt der vorliegenden griechischen Textform; die Schreibweise „Eloï“ macht im Deutschen die getrennte Aussprache deutlich.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: Das heißt übersetzt
  rationale: Die Formulierung kennzeichnet klar, dass Markus die zuvor bewahrten semitischen Worte anschließend übersetzt.
- source_word: εἰς τί
  choice: warum
  rationale: „Warum“ ist im Deutschen die natürliche Wiedergabe der idiomatischen Frage nach Grund oder Anlass; die mögliche Zwecknuance wird nicht durch eine umständliche Formulierung in den Vordergrund gerückt.
- source_word: ἐγκατέλιπές με
  choice: hast du mich verlassen
  rationale: „Verlassen“ gibt die Erfahrung des Preisgegebenseins präzise und mit der vertrauten sprachlichen Resonanz von Psalm 22,2 wieder; das deutsche Perfekt ist in direkter Rede natürlich.
theological_decisions:
- issue: Verhältnis des Rufes Jesu zu Psalm 22
  choice: Den Ruf uneingeschränkt als direkte Frage wiedergeben und den Psalmbezug in einer Fußnote benennen.
  alternative: Den Ruf im Haupttext ausdrücklich als Psalmzitat deuten oder seine Aussage über das Verlassensein abschwächen.
  rationale: Der Vers lässt den Ruf in seiner ganzen Spannung stehen und erklärt lediglich seine sprachliche Bedeutung. Die Übersetzung soll diese Spannung weder dogmatisch auflösen noch abschwächen.
- issue: Wiedergabe der semitischen Worte Jesu
  choice: Zuerst die umschriftliche Form und danach die von Markus gebotene Übersetzung wiedergeben.
  alternative: Nur die deutsche Bedeutung nennen oder die Form an Matthäus angleichen.
  rationale: So bleibt die auffällige doppelte Darstellung des Markus erhalten, ohne den Wortlaut mit einer anderen Evangelienfassung zu harmonisieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählton. Die semitischen Worte bleiben gemäß der Darstellung des Markus in Umschrift stehen; unnötige Archaismen werden vermieden.
