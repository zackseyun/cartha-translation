  verdict: approve
  source_fidelity: 'Der griechische Wortlaut wird zuverlässig wiedergegeben: die Zeitangabe bleibt als „neunte Stunde“ erhalten, ἐβόησεν ... φωνῇ μεγάλῃ wird treffend durch „rief ... mit lauter Stimme“ erfasst, und Markus’ Abfolge aus semitischem Ruf und anschließender Übersetzung ist bewahrt. „Warum hast du mich verlassen?“ gibt εἰς τί ἐγκατέλιπές με idiomatisch und ohne theologische Abschwächung wieder.'
  naturalness: Das Deutsch ist modernes Standarddeutsch in einem angemessen würdigen Erzählregister. „Das heißt übersetzt:“ ist verständlich und als einleitende Formel für die nachfolgende Übersetzung gut verwendbar. Die Umschrift „Eloï, Eloï, lema sabachtani?“ ist im Deutschen etabliert und unterscheidet Markus’ Form sachgerecht von Matthäus.
  terminology: „Mein Gott, mein Gott“ und „verlassen“ bewahren sowohl den Sinn als auch den Psalmklang. Die Fußnote zu Psalm 22 berücksichtigt zutreffend die abweichende Verszählung. Die Anmerkung zu „lama“/„lema“ ist knapp, sachlich und passend am semitischen Wortlaut verankert.
