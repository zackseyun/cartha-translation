revisions:
- from: Da führten ihn die Soldaten in den Innenhof hinein, das heißt ins Prätorium[a], und riefen die ganze Kohorte[b] zusammen.
  to: Da führten ihn die Soldaten in den Hof hinein – das heißt in das Prätorium – und riefen die ganze Kohorte zusammen.
  rationale: Die Revision stellt die griechische Erläuterung „ὅ ἐστιν πραιτώριον“ klar als Erklärung des genannten Hofbereichs dar. Sie bewahrt die Fachbegriffe und den narrativen Sinn, während die Fußnoten historische Möglichkeiten erklären, ohne sie über das griechische Wort hinaus festzulegen.
