review_pass:
  verdict: revise
  source_fidelity: Die Abfolge, die Soldaten, das Hineinführen und das Zusammenrufen der ganzen Kohorte sind zutreffend wiedergegeben. Die deutsche Fassung sollte jedoch die erläuternde Gleichsetzung von Hof und Prätorium syntaktisch klarer abbilden, ohne den Hof durch die Konstruktion „das heißt ins Prätorium“ nachträglich zu einem abweichenden Ziel zu machen.
  naturalness: „In den Hof hinein“ ist im modernen Standarddeutsch flüssiger als „in den Innenhof hinein“ und vermeidet eine unnötige Dopplung. Die revidierte Satzfügung ist klar und erzählerisch natürlich.
  terminology: '„Prätorium“ und „Kohorte“ sind passende historische Fachbegriffe. Die Fußnoten werden vorsichtiger formuliert: Ein Prätorium konnte je nach Kontext Unterkunft, Residenz oder Hauptquartier eines römischen Amtsträgers bezeichnen; die knappe Erklärung soll keine zu enge historische Festlegung behaupten.'
  issues:
  - severity: medium
    issue: Die Verknüpfung „in den Innenhof hinein, das heißt ins Prätorium“ ist syntaktisch und semantisch leicht verschoben.
    rationale: ὅ ἐστιν πραιτώριον erläutert die Bezeichnung αὐλή als πραιτώριον. Im Deutschen sollte die Erklärung deshalb als appositionelle Erläuterung des Zielbereichs formuliert werden, nicht so, als sei „ins Prätorium“ ein nachträglich anderes Ziel.
  - severity: low
    issue: Die Fußnote zum Prätorium ist zu kategorisch auf „Amtssitz beziehungsweise Hauptquartier des römischen Statthalters“ festgelegt.
    rationale: πραιτώριον hat je nach Kontext einen weiteren institutionellen und örtlichen Gebrauch. Eine offenere Erklärung wahrt die historische Bedeutung ohne unnötige Präzisierung.
  revised_text: Da führten ihn die Soldaten in den Hof hinein – das heißt in das Prätorium – und riefen die ganze Kohorte zusammen.
  revised_footnotes:
  - marker: a
    text: Das Prätorium bezeichnete die Unterkunft, Residenz oder das Hauptquartier eines römischen Amtsträgers, hier wahrscheinlich des Statthalters.
    reason: cultural_note
  - marker: b
    text: Eine Kohorte war eine Einheit des römischen Heeres.
    reason: cultural_note
  revision_rationale: Die Revision stellt die griechische Erläuterung „ὅ ἐστιν πραιτώριον“ klar als Erklärung des genannten Hofbereichs dar. Sie bewahrt die Fachbegriffe und den narrativen Sinn, während die Fußnoten historische Möglichkeiten erklären, ohne sie über das griechische Wort hinaus festzulegen.
