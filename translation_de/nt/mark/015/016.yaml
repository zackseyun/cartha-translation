  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: de
  text: Da führten ihn die Soldaten in den Hof hinein – das heißt in das Prätorium – und riefen die ganze Kohorte zusammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Da
  rationale: δέ führt hier die Erzählung weiter, ohne einen starken Gegensatz auszudrücken; „Da“ entspricht dem natürlichen deutschen Erzählfluss.
- source_word: στρατιῶται
  choice: Soldaten
  rationale: Die direkte und im Kontext natürliche Wiedergabe der einzelnen Angehörigen des römischen Militärs.
- source_word: ἀπήγαγον
  choice: führten ... hinein
  rationale: ἀπάγω bezeichnet das Weg- oder Hinführen; zusammen mit ἔσω wird die Bewegung ins Innere im Deutschen idiomatisch durch „hineinführen“ ausgedrückt.
- source_word: ἔσω τῆς αὐλῆς
  choice: in den Innenhof hinein
  rationale: Die Formulierung bewahrt sowohl die gerichtete Bewegung als auch die räumliche Bedeutung von αὐλή als Hof eines amtlichen Gebäudekomplexes.
- source_word: ὅ ἐστιν πραιτώριον
  choice: das heißt ins Prätorium
  rationale: Der historische römische Verwaltungsbegriff bleibt erhalten; „das heißt“ gibt die erklärende Funktion des griechischen Relativsatzes natürlich wieder. „Ins“ macht im Deutschen deutlich, dass der Hof zum Prätorium gehört bzw. als dessen Bereich bezeichnet wird.
- source_word: συγκαλοῦσιν
  choice: riefen ... zusammen
  rationale: „Zusammenrufen“ bildet die Bedeutung des Kompositums präzise ab. Das historische Präsens wird im Deutschen zugunsten eines einheitlichen, natürlichen Erzähltempus als Präteritum wiedergegeben.
- source_word: ὅλην τὴν σπεῖραν
  choice: die ganze Kohorte
  rationale: „Kohorte“ bewahrt den technischen römischen Militärbegriff; „ganze“ entspricht ausdrücklich ὅλην.
