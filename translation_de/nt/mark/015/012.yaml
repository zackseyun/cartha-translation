review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Pilatus, die wiederholte Antwort, den folgernden Anschluss und die distanzierende Zuschreibung des Titels an die Angesprochenen zutreffend wieder. Allerdings macht „Was soll ich … tun?“ den ausdrücklichen Willen der Menge (θέλετε) nur indirekt kenntlich und kann im Deutschen primär nach einer Pflicht oder angemessenen Handlung fragen. Eine Formulierung mit „wollt ihr“ bildet die griechische Frage genauer ab.
  naturalness: Die vorliegende Fassung ist flüssiges modernes Standarddeutsch. „Was wollt ihr also, dass ich … tue?“ ist ebenfalls natürlich, wahrt aber die Satzlogik und den adressatenbezogenen Wunsch expliziter. „Wieder“ ist in erzählendem Bibeldeutsch etwas unmarkierter als „erneut“.
  terminology: „Pilatus“, „König der Juden“ und „nennt“ sind angemessen. Die Kleinschreibung von „König“ entspricht der beschreibenden politischen Titelform und der rhetorischen Distanz des Satzes.
  issues:
