source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: de
  text: 'Pilatus antwortete ihnen wieder: „Was wollt ihr also, dass ich mit dem tue, den ihr den König der Juden nennt?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: erneut
  rationale: Das Adverb kennzeichnet eine weitere Äußerung des Pilatus im fortlaufenden Wortwechsel; „erneut“ gibt dies knapp und natürlich wieder.
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: antwortete
  rationale: Die Verbindung aus Partizip und Imperfekt ist eine geläufige narrative Redeformel. „Antwortete“ entspricht natürlichem modernem Deutsch, ohne das schwerfällige „antwortete und sagte“.
- source_word: Τί οὖν
  choice: Was soll ich dann
  rationale: „Dann“ bewahrt den folgernden Anschluss von οὖν an die vorausgehende Forderung der Menge.
- source_word: θέλετε ποιήσω
  choice: Was soll ich ... tun
  rationale: Die Konstruktion bezeichnet die von der Menge gewünschte Handlung. Im Deutschen bringt „Was soll ich ... tun?“ dies idiomatisch zum Ausdruck; der Wille der Angesprochenen ergibt sich dabei aus der Frage im Kontext.
- source_word: ὃν λέγετε
  choice: den ihr ... nennt
  rationale: Der Relativsatz weist die Bezeichnung ausdrücklich der Menge zu und bewahrt so die rhetorische Distanz des Pilatus.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: den König der Juden
  rationale: Dies ist die etablierte und sachlich genaue Wiedergabe des politischen Titels in der Passionsgeschichte.
theological_decisions:
- issue: Ob Pilatus mit seiner Formulierung Jesu Königtum selbst bejaht oder die Bezeichnung der Menge zuschreibt
  choice: „den ihr den König der Juden nennt“
  alternative: „mit dem König der Juden, wie ihr ihn nennt“
  rationale: Der Relativsatz ὃν λέγετε hebt hervor, dass die Angesprochenen diese Bezeichnung gebrauchen. Die Übersetzung wahrt diese Distanz, ohne daraus eine persönliche Bejahung oder Verneinung durch Pilatus abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und mündlich, ohne umgangssprachlich zu wirken. Keine Fußnote ist nötig, da die syntaktische und theologische Spannung im Haupttext erhalten bleibt.
