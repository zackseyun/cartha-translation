    issue: θέλετε wird nicht ausdrücklich wiedergegeben.
    rationale: „Was soll ich dann … tun?“ kann den von der Menge geäußerten Wunsch zwar kontextuell nahelegen, übersetzt aber semantisch eher eine Sollensfrage. Das griechische θέλετε fragt ausdrücklich, was sie wollen, dass Pilatus tut.
