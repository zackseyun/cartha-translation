reference: Mark 15:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: de
  text: Und sie zwangen[a] einen Mann, der vorbeikam, Simon von Kyrene, der vom Land[b] kam und der Vater von Alexander und Rufus war, Jesu Kreuz[c] zu tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete Verb bezeichnet einen erzwungenen Dienst oder eine Zwangsverpflichtung.
    reason: cultural_note
  - marker: b
    text: 'Oder: „vom Feld“; das griechische Wort kann auch Land oder ländliches Gebiet bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Manche verstehen darunter genauer den Querbalken; im griechischen Text steht jedoch einfach „Kreuz“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: zwangen
  rationale: Das Verb bezeichnet einen erzwungenen Dienst beziehungsweise eine Zwangsverpflichtung, nicht lediglich eine Bitte. „Zwangen“ gibt diesen Sinn klar und natürlich wieder.
- source_word: παράγοντά τινα
  choice: einen Mann, der gerade vorbeikam
  rationale: Das Partizip bezeichnet jemanden, der vorbeigeht oder vorbeikommt; τις lässt die Person zunächst unbestimmt. Die Formulierung ist im Deutschen natürlich und wahrt den beiläufigen Charakter der Begegnung.
- source_word: Σίμωνα Κυρηναῖον
  choice: Simon von Kyrene
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben; die Herkunftsbezeichnung wird idiomatisch mit „von Kyrene“ ausgedrückt.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: der vom Land kam
  rationale: ἀγρός kann Feld, Land oder ländliches Gebiet bedeuten. „Vom Land“ wahrt die räumliche Aussage, ohne ein bestimmtes Feld oder einen bestimmten landwirtschaftlichen Zusammenhang vorauszusetzen.
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: der Vater von Alexander und Rufus war
  rationale: Die identifizierende Apposition wird zur besseren Verständlichkeit als Relativsatz wiedergegeben, ohne ihre Aussage inhaltlich zu erweitern.
- source_word: ἵνα ἄρῃ
  choice: zu tragen
  rationale: Der ἵνα-Satz bezeichnet hier den Zweck der Zwangsverpflichtung. Nach „zwangen“ ist der deutsche Infinitiv mit „zu“ die natürliche Entsprechung; „tragen“ passt zum konkreten Zusammenhang.
- source_word: σταυρὸν
  choice: Kreuz
  rationale: σταυρός wird sachgemäß und traditionell mit „Kreuz“ wiedergegeben. Eine Einengung auf den Querbalken wäre historisch denkbar, geht aber über den Wortlaut hinaus.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Pronomen bezieht sich im Zusammenhang auf Jesus. „Sein“ bewahrt die pronominale Form des griechischen Textes.
theological_decisions:
- issue: Art des auf Simon ausgeübten Zwangs
  choice: Simon wurde gezwungen, Jesu Kreuz zu tragen.
  alternative: Simon wurde lediglich gebeten oder ohne Zwang zum Dienst herangezogen.
  rationale: ἀγγαρεύω bezeichnet Zwangsdienst oder Requirierung. Die Übersetzung darf den Zwangscharakter nicht abschwächen.
- issue: Genaue Bezeichnung des von Simon getragenen Gegenstands
  choice: Kreuz
  alternative: Querbalken
  rationale: Historische Rekonstruktionen können einen Querbalken annehmen; der griechische Text verwendet jedoch das allgemeinere σταυρός. Die Übersetzung wahrt diese Ausdrucksweise.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die etwas dichte Identifizierung Simons wird durch Relativsätze verständlich gemacht. Die lexikalische Offenheit von ἀγρός und die mögliche historische Präzisierung von σταυρός werden in Fußnoten bewahrt.
