  rationale: Die Revision beseitigt die im Deutschen missverständliche mögliche Zuordnung von „sein Kreuz“ zu Simon und benennt daher den im Kontext gemeinten Bezug ausdrücklich als „Jesu Kreuz“. Außerdem wird das nicht erforderliche „gerade“ entfernt. Die Fußnote zu „vom Land“ wird sprachlich gestrafft und bewahrt die lexikalische Spannweite von ἀγρός.
