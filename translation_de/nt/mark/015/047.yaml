  text: ἡ δὲ Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ Ἰωσῆτος⸃ ἐθεώρουν ποῦ ⸀τέθειται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: de
  text: Maria aus Magdala und Maria, die Mutter des Joses, beobachteten, wo er hingelegt worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Maria des Joses“. Das Griechische kennzeichnet diese Maria durch ihre Beziehung zu Joses, ohne die Art der Beziehung ausdrücklich zu nennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: unübersetzt
  rationale: δέ verbindet hier den Satz nur locker mit dem vorausgehenden Begräbnisbericht. Im Deutschen ist die Fortführung ohne ausdrückliches „und“ natürlicher.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria aus Magdala
  rationale: Die Bezeichnung identifiziert Maria nach ihrer Herkunft; diese natürliche deutsche Form vermeidet, „Magdalena“ wie einen Familiennamen wirken zu lassen.
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: Maria, die Mutter des Joses
  rationale: Der Genitiv bezeichnet eine Beziehung zu Joses, lässt deren genaue Art jedoch formal offen. Im markinischen Zusammenhang ist die Mutter-Sohn-Beziehung am wahrscheinlichsten; die wörtlichere Alternative wird in der Fußnote bewahrt.
- source_word: ἐθεώρουν
  choice: sahen zu
  rationale: Der Imperfekt beschreibt ein andauerndes, bewusstes Beobachten. „Sahen zu“ gibt dies in natürlichem Deutsch wieder.
- source_word: ποῦ
  choice: wohin
  rationale: Beim Verb des Legens bezeichnet ποῦ idiomatisch den Zielort; „wohin“ entspricht dem deutschen Sprachgebrauch.
- source_word: τέθειται
  choice: er gelegt worden war
  rationale: Das Perfekt Passiv bezeichnet die vollzogene Niederlegung mit fortbestehendem Ergebnis. Das Plusquamperfekt passt zur deutschen Erzählfolge; „er“ ergänzt den im Griechischen unausgesprochenen, aus dem Zusammenhang eindeutigen Bezug auf Jesus.
theological_decisions:
- issue: Unausgesprochener Bezug des Passivs
  choice: „er“ ausdrücklich ergänzt
  alternative: „sein Leichnam“ oder eine unpersönliche Formulierung
  rationale: Im Griechischen ist Jesus als Bezug aus dem Kontext klar. „Er“ hält den Personenbezug fest, ohne Jesus auf seinen Leichnam zu reduzieren.
- issue: Beziehung Marias zu Joses
  choice: als Mutter-Sohn-Beziehung im Haupttext ausgedrückt
  alternative: „Maria des Joses“
  rationale: Der Genitiv selbst benennt die Beziehung nicht ausdrücklich, doch der markinische Kontext stützt „Mutter“. Die genuine formale Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Erzählweise bleibt erhalten; „sahen zu“ vermittelt den durativen Charakter, ohne unnötig feierlich oder altertümlich zu klingen.
