    rationale: ποῦ bedeutet „wo/wo sich ... befindet“, nicht „wohin“. Der griechische Text sagt, dass die Frauen beobachteten, wo Jesus hingelegt war bzw. lag, nicht wohin er gelegt wurde.
  - severity: low
    issue: „sahen zu“
    rationale: Die Formulierung ist verständlich, aber „beobachteten“ gibt ἐθεώρουν als fortgesetztes aufmerksames Beobachten im Kontext präziser und weniger umgangssprachlich wieder.
