review_pass:
  verdict: revise
  source_fidelity: Die Personenbezeichnungen und das imperfektische Beobachten sind zutreffend wiedergegeben. Die Wiedergabe von ποῦ mit „wohin“ verschiebt jedoch die Ortsfrage zu einer Richtungsfrage. ποῦ bezeichnet hier den Ort, an dem Jesus lag; das Perfektpassiv τέθειται kann im deutschen Erzählzusammenhang angemessen als „hingelegt worden war“ wiedergegeben werden.
  naturalness: „Sahen zu“ ist möglich, klingt hier aber etwas umgangssprachlich und kann eine Teilnahme am Vorgang nahelegen. „Beobachteten“ ist für gezieltes, andauerndes Wahrnehmen eines Ortes idiomatischer und würdig.
  terminology: „Maria aus Magdala“ ist modernes Standarddeutsch. „Maria, die Mutter des Joses“ ist im markinischen Kontext gut begründet; die Fußnote muss klarstellen, dass der griechische Genitiv die konkrete Beziehung nicht ausdrücklich benennt.
