source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: de
  text: „Der Messias, der König Israels, soll jetzt vom Kreuz herabsteigen, damit wir sehen und glauben!« Auch die, die mit ihm gekreuzigt waren, beschimpften ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός ist hier ein Titel innerhalb eines königlich-messianischen Spottrufs. »Messias« bewahrt den Sinn des Gesalbten deutlicher als die traditionelle Wiedergabe »Christus«.
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: der König Israels
  rationale: Die direkte Titelverbindung gibt den Genitiv natürlich wieder und erhält den Bezug auf Jesu beanspruchtes Königtum.
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: soll jetzt vom Kreuz herabsteigen
  rationale: Der Imperativ der dritten Person wird im Deutschen idiomatisch mit »soll« wiedergegeben; »jetzt« erhält die unmittelbare, höhnische Herausforderung, und »herabsteigen« bildet die Abwärtsbewegung ab.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: damit wir sehen und glauben
  rationale: Die Zweck- beziehungsweise Folgeaussage bleibt bewusst knapp; die Verbindung von Sehen und Glauben wird nicht interpretierend erweitert.
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: die, die mit ihm gekreuzigt waren
  rationale: Die Formulierung erhält den passiven Sinn des Partizips und vermeidet eine unnötige zusätzliche Festlegung.
- source_word: ὠνείδιζον αὐτόν
  choice: beschimpften ihn
  rationale: »Beschimpfen« gibt den feindseligen verbalen Angriff in verständlichem modernem Deutsch wieder. Der Imperfekt bezeichnet hier den fortlaufenden Vorgang im Erzählhintergrund.
theological_decisions:
- issue: Wiedergabe von Χριστός im Kontext des Spotts
  choice: Messias
  alternative: Christus
  rationale: Das Wort fungiert hier erkennbar als jüdischer königlich-messianischer Titel und nicht primär als namensähnliche Bezeichnung. »Messias« wahrt diesen Bedeutungsgehalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt scharf und höhnisch, ohne umgangssprachlich zu werden. Das zweite καί wird mit »Auch« wiedergegeben, um die Verbindung mit dem zuvor geschilderten Spott sichtbar zu machen.
