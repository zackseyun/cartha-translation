  source_fidelity: 'Der Text gibt alle wesentlichen Elemente des griechischen Satzes wieder: Josefs Herkunft, seine angesehene Stellung als βουλευτής ohne ungesicherte Identifizierung des Rates, seine eigene Erwartung des Reiches Gottes, den durch τολμήσας hervorgehobenen Mut, das Eintreten zu Pilatus und die Bitte um Jesu Leichnam. „Da kam“ bewahrt ἐλθών, das im aktuellen englischen Audittext ausgelassen wurde.'
  naturalness: Flüssiges modernes Standarddeutsch in würdigem erzählerischem Register. Die kurzen Sätze sind klar und machen die Betonung von καὶ αὐτός („Auch er“) gut verständlich. „Fasste sich ein Herz“ ist eine natürliche idiomatische Wiedergabe des Mutakts.
  terminology: „Mitglied des Rates“, „Reich Gottes“ und „Leichnam Jesu“ sind sachgerecht. „Leichnam“ ist im unmittelbaren Todeskontext eine natürliche deutsche Kontextwiedergabe von σῶμα und legt keine zusätzliche theologische Deutung nahe. Die Fußnoten sind korrekt verankert und bieten tatsächliche lexikalische Alternativen.
