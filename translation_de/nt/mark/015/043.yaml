id: MRK.15.43
reference: Mark 15:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: de
  text: Da kam Josef aus Arimathäa, ein angesehenes Mitglied des Rates.[a] Auch er wartete auf das Reich Gottes. Er fasste sich ein Herz,[b] ging zu Pilatus hinein und bat ihn um den Leichnam Jesu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein hochgestelltes« beziehungsweise »ehrenwertes Mitglied des Rates«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Er wagte es, zu Pilatus hineinzugehen«; das griechische Wort hebt Josefs Mut bei diesem Schritt hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Da kam
  rationale: Das vorangestellte Aoristpartizip führt Josefs Auftreten in der Szene ein. „Da kam“ gibt dies in natürlichem deutschem Erzählstil wieder.
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: aus Arimathäa
  rationale: Die Herkunftsangabe mit ἀπό wird direkt und idiomatisch wiedergegeben.
- source_word: εὐσχήμων
  choice: angesehenes
  rationale: Das Wort bezeichnet hier gesellschaftliches Ansehen beziehungsweise eine ehrenvolle Stellung; „angesehen“ ist klar, modern und nicht titelhaft.
- source_word: βουλευτής
  choice: Mitglied des Rates
  rationale: Die Wiedergabe bezeichnet die Funktion, ohne den im griechischen Wort nicht ausdrücklich genannten Rat mit dem Sanhedrin gleichzusetzen.
- source_word: ὃς καὶ αὐτὸς
  choice: Auch er
  rationale: Die eigenständige Formulierung bewahrt die Betonung, dass Josef persönlich ebenfalls diese Erwartung teilte.
- source_word: ἦν προσδεχόμενος
  choice: wartete auf
  rationale: Die periphrastische Konstruktion beschreibt eine fortdauernde erwartungsvolle Haltung.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die direkte und im Deutschen geläufige Wiedergabe der zentralen Evangelienformulierung.
- source_word: τολμήσας
  choice: Er fasste sich ein Herz
  rationale: Die idiomatische Wendung bringt den Mut zum Ausdruck, den Josef für den nun folgenden Gang zu Pilatus aufbringen musste.
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: ging zu Pilatus hinein
  rationale: „Hinein“ erhält die Bewegungsnuance von εἰσῆλθεν und lässt erkennen, dass Josef sich in die Gegenwart des Pilatus begab.
- source_word: ᾐτήσατο
  choice: bat ihn um
  rationale: Die Ergänzung „ihn“ macht im Deutschen das Ziel der Bitte natürlich verständlich; gemeint ist Pilatus.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: den Leichnam Jesu
  rationale: Da Jesus bereits gestorben ist, ist „Leichnam“ die natürliche, würdevolle deutsche Bezeichnung für σῶμα in diesem Zusammenhang.
theological_decisions:
- issue: Identität des mit βουλευτής bezeichneten Rates
  choice: Mitglied des Rates
  alternative: Mitglied des Sanhedrins
  rationale: Im Zusammenhang ist wahrscheinlich der jüdische Hohe Rat gemeint, doch βουλευτής nennt diesen nicht ausdrücklich. Der Haupttext bleibt daher bei der allgemeineren Quellenangabe.
- issue: Bedeutung von προσδεχόμενος für Josefs Haltung
  choice: wartete auf das Reich Gottes
  alternative: erwartete das Reich Gottes
  rationale: „Wartete auf“ bewahrt die Vorstellung einer anhaltenden, hoffnungsvollen Erwartung, ohne näher festzulegen, wie Josef das Kommen des Reiches verstand.
- issue: Mutcharakter von τολμήσας
  choice: fasste sich ein Herz
  alternative: wagte es
  rationale: Die gewählte Formulierung macht den im Partizip hervorgehobenen Mut sichtbar, ohne zusätzliche Motive oder Risiken in den Text einzutragen.
translation_notes:
  register: Moderner, würdevoller Erzählstil. Kurze Sätze vermeiden eine missverständliche Zuordnung des Relativsatzes zu „Rat“ oder „Mitglied“ und bewahren zugleich die Hervorhebung von καὶ αὐτός. „Leichnam“ ist im Todeskontext natürlicher und feierlicher als „Körper“.
