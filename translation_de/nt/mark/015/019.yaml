base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: de
  text: Und sie schlugen ihm mit einem Schilfrohr immer wieder auf den Kopf, spuckten ihn an, knieten nieder und huldigten ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: warfen sich vor ihm nieder; auch: beteten ihn an. Das griechische Verb kann das Niederwerfen vor jemandem, Huldigung oder Anbetung bezeichnen. Hier ahmen die Soldaten spöttisch die Ehrung eines Königs nach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: schlugen … immer wieder
  rationale: Der Imperfekt bezeichnet hier eine fortgesetzte oder wiederholte Handlung. „Immer wieder“ macht diesen Aspekt in natürlichem Deutsch deutlich, ohne die Stärke der Schläge zusätzlich auszudeuten.
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: ihm … auf den Kopf
  rationale: Die griechische Besitzkonstruktion wird idiomatisch mit dem possessiven Dativ wiedergegeben.
- source_word: καλάμῳ
  choice: mit einem Rohr
  rationale: κάλαμος bezeichnet ein Rohr beziehungsweise einen rohrartigen Stab. „Rohr“ bewahrt den Bezug zum Gegenstand der vorausgehenden Verspottung und vermeidet die stärker deutende Wiedergabe „Stock“.
- source_word: ἐνέπτυον αὐτῷ
  choice: spuckten ihn an
  rationale: Dies ist die natürliche deutsche Wiedergabe. In Verbindung mit „immer wieder“ und der gereihten Erzählung bleibt der fortgesetzte Charakter der Misshandlung erkennbar.
- source_word: τιθέντες τὰ γόνατα
  choice: gingen auf die Knie
  rationale: Die wörtliche Wendung „die Knie setzen“ ist ein Idiom für das Niederknien. „Auf die Knie gehen“ ist gegenwärtiges, verständliches Deutsch.
- source_word: προσεκύνουν αὐτῷ
  choice: warfen sich vor ihm nieder
  rationale: Die Wendung gibt die körperliche Gebärde von προσκυνέω wieder und passt zur spöttischen Nachahmung königlicher Huldigung, ohne die lexikalisch mögliche religiöse Bedeutung stillschweigend auszuschließen.
theological_decisions:
- issue: Bedeutung von προσκυνέω im Zusammenhang der Verspottung
  choice: warfen sich vor ihm nieder
  alternative: huldigten ihm; beteten ihn an
  rationale: Der unmittelbare Zusammenhang beschreibt eine spöttische Inszenierung königlicher Ehrerbietung. Die gewählte Formulierung bewahrt die sichtbare Gebärde und die narrative Ironie, ohne den Soldaten aufrichtige Anbetung zuzuschreiben. Die weiter reichenden Bedeutungen des Verbs werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vier Handlungen bleiben in einer flüssigen Reihung verbunden; die wiederholte Misshandlung wird durch „immer wieder“ kenntlich gemacht. Die Fußnote bewahrt die Bedeutungsbreite und theologische Spannung von προσκυνέω.
