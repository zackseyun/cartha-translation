  text: οἱ δὲ πάλιν ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/013.yaml
  text: But they cried out again, “Crucify him!”
translation:
  language: de
  text: 'Sie aber schrien wieder: »Kreuzige ihn!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ
  choice: sie
  rationale: Der substantivisch gebrauchte Pluralartikel verweist auf die bereits genannte Gruppe zurück. Im Deutschen gibt das Pronomen »sie« diesen Rückbezug natürlich und ohne zusätzliche Deutung als »Volk« oder »Menge« wieder.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise die Reaktion auf die vorausgehenden Worte des Pilatus. »Aber« bildet diese adversative Nuance angemessen ab.
- source_word: πάλιν
  choice: wieder
  rationale: πάλιν bezeichnet die Wiederholung des Rufens. »Wieder« ist knapp, idiomatisch und erzählerisch präzise.
- source_word: ἔκραξαν
  choice: schrien
  rationale: κράζω bezeichnet lautes Rufen oder Schreien. »Schrien« bewahrt die Intensität und klingt im modernen Deutschen natürlich.
- source_word: Σταύρωσον
  choice: Kreuzige
  rationale: Der Aorist Aktiv Imperativ in der zweiten Person Singular richtet die unmittelbare Aufforderung an Pilatus. »Kreuzige« gibt Form und Nachdruck direkt wieder, ohne sie zum indirekteren »Lass ihn kreuzigen« umzudeuten.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezeichnet Jesus als direktes Objekt und wird schlicht mit »ihn« wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die knappe Satzform und der unmittelbare Imperativ bewahren die Härte und Dringlichkeit des griechischen Wortlauts.
