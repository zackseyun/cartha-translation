  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: de
  text: 'Ebenso machten sich die führenden Priester zusammen mit den Schriftgelehrten über ihn lustig und sagten zueinander[a]: »Andere hat er gerettet, sich selbst kann er nicht retten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder kann sich „zueinander“ auf den Spott beziehen: Die führenden Priester und die Schriftgelehrten verspotteten ihn untereinander.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Ebenso
  rationale: Kennzeichnet die Parallele zum unmittelbar zuvor geschilderten Spott knapp und natürlich.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Bezeichnet im Plural die leitenden priesterlichen Autoritäten; die Wiedergabe vermeidet den missverständlichen Eindruck, mehrere Personen hätten gleichzeitig das Amt des Hohenpriesters innegehabt.
- source_word: ἐμπαίζοντες
  choice: verspotteten ihn
  rationale: Gibt den höhnischen Sinn des Partizips idiomatisch wieder. Das im Deutschen notwendige Objekt »ihn« ergibt sich eindeutig aus dem Kontext und bezieht sich auf Jesus.
- source_word: πρὸς ἀλλήλους
  choice: zueinander
  rationale: Bewahrt den wechselseitigen Charakter ihrer Äußerungen, ohne fälschlich zu besagen, sie hätten einander verspottet.
- source_word: μετὰ τῶν γραμματέων
  choice: zusammen mit den Schriftgelehrten
  rationale: Zeigt, dass die Schriftgelehrten an dem Spott und den Äußerungen beteiligt waren.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der deutsche Erzählstil gibt den durativen oder wiederholten Sinn des griechischen Imperfekts hier natürlich durch den Kontext wieder; eine Formulierung wie »sagten immer wieder« wäre stärker als der Ausgangstext.
- source_word: Ἄλλους ἔσωσεν
  choice: Andere hat er gerettet
  rationale: Bewahrt die direkte Aussage und die mögliche Bedeutungsbreite von körperlicher Rettung bis hin zur theologisch anklingenden Rettung.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: sich selbst kann er nicht retten
  rationale: Erhält die pointierte Gegenüberstellung sowie die Wiederholung desselben Verbs wie im ersten Satzteil.
theological_decisions:
- issue: Einheitliche Wiedergabe von σῴζω in beiden Satzteilen
  choice: gerettet … retten
  alternative: geholfen … helfen; befreit … befreien
  rationale: Die einheitliche Wortwahl bewahrt sowohl die griechische Wiederholung als auch die theologische Ironie des Spotts, ohne die Bedeutung auf einen rein körperlichen oder ausschließlich geistlichen Sinn festzulegen.
- issue: Bezug von πρὸς ἀλλήλους
  choice: sagten zueinander
  alternative: verspotteten ihn untereinander
  rationale: Die gewählte Fassung versteht die Wechselbeziehung vor allem als gegenseitiges Reden. Da die griechische Wortstellung auch eine engere Verbindung mit dem Partizip zulässt, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Führende Priester« ist für heutige Leser verständlicher und sachlich genauer als der pluralische Ausdruck »Hohepriester«. Die direkte Rede bleibt knapp und scharf; die Wiederholung von »retten« erhält die Ironie des griechischen Wortlauts.
