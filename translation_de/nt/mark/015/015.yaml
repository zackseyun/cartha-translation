source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: de
  text: Weil Pilatus die Menge zufriedenstellen wollte, ließ er ihnen Barabbas frei. Jesus aber ließ er auspeitschen und übergab ihn, um ihn kreuzigen zu lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Menge zu Gefallen handeln“. Wörtlich: „für die Menge das Genügende tun“.'
    reason: Die Fußnote dokumentiert die idiomatische griechische Wendung τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι und ihre mögliche alternative Wiedergabe.
lexical_decisions:
- source_word: βουλόμενος
  choice: wollte
  rationale: Das Partizip bezeichnet den Willen bzw. die Absicht des Pilatus; „wollte“ ist natürlich und bewahrt den Motivzusammenhang.
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: die Menge zufriedenstellen
  rationale: Die Wendung bedeutet wörtlich, für die Menge das Genügende zu tun, und bezeichnet hier das Erfüllen ihrer Forderung. „Zufriedenstellen“ gibt die politische Beschwichtigung treffend wieder.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: ließ er ihnen … frei
  rationale: Im gerichtlichen Zusammenhang bedeutet ἀπολύω die Freilassung eines Gefangenen; der Dativ αὐτοῖς bleibt mit „ihnen“ ausdrücklich erhalten.
- source_word: παρέδωκεν
  choice: übergab
  rationale: Das Verb bezeichnet die Übergabe in fremde Gewalt und behält damit das für die Passionsgeschichte bedeutsame Motiv bei.
- source_word: φραγελλώσας
  choice: ließ er auspeitschen
  rationale: Das vorzeitige Aoristpartizip bezeichnet eine der Übergabe vorausgehende Handlung. Die Formulierung macht idiomatisch deutlich, dass Pilatus die Auspeitschung veranlasste.
- source_word: ἵνα σταυρωθῇ
  choice: zur Kreuzigung
  rationale: Die Zweck- bzw. Zielangabe wird nach „übergab“ knapp und idiomatisch wiedergegeben, ohne das Ergebnis über den griechischen Text hinaus auszudeuten.
- source_word: Βαραββᾶν
  choice: Barabbas
  rationale: Der Personenname wird nach geläufiger deutscher Konvention wiedergegeben.
- source_word: Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
theological_decisions:
- issue: Motiv des Pilatus in τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: Pilatus wollte die Forderung der Menge erfüllen und sie dadurch zufriedenstellen.
  alternative: Pilatus wollte der Menge gefallen.
  rationale: „Zufriedenstellen“ bewahrt den Sinn politischer Beschwichtigung und lässt die moralische Spannung bestehen; „gefallen“ könnte zu harmlos wirken.
- issue: Verhältnis von Auspeitschung und Übergabe
  choice: Pilatus veranlasste zunächst die Auspeitschung und übergab Jesus dann zur Kreuzigung.
  alternative: Pilatus peitschte Jesus eigenhändig aus und übergab ihn anschließend.
  rationale: Das Aoristpartizip ist zeitlich vorgeordnet; im historischen und syntaktischen Kontext ist eine veranlasste Handlung gemeint, ohne Pilatus als unmittelbaren Vollstrecker darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze erhöhen die Verständlichkeit; „dagegen“ bildet den starken narrativen Kontrast zwischen der Freilassung des Barabbas und der Übergabe Jesu ab.
