base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: de
  text: Doch die führenden Priester wiegelten die Menge auf, damit Pilatus ihnen stattdessen Barabbas freiließ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit Pilatus ihnen lieber Barabbas freiließ“. Das griechische Wort bedeutet hier „eher“ oder „vielmehr“; „stattdessen“ gibt die aus dem Zusammenhang erkennbare Bevorzugung wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Doch
  rationale: δέ markiert hier einen leichten Gegensatz zur vorausgehenden Frage und Erwartung; „Doch“ gibt diesen narrativen Kontrast natürlich wieder.
- source_word: ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der Jerusalemer Priesterschaft. „Führende Priester“ ist im heutigen Deutsch verständlicher als das missverständliche „Hohepriester“, ohne die Gruppe auf nur einen Amtsinhaber zu verengen.
- source_word: ἀνέσεισαν
  choice: wiegelten … auf
  rationale: ἀνασείω bezeichnet hier das gezielte Aufstacheln einer Gruppe zu einer gewünschten Handlung; „aufwiegeln“ trifft diesen aktiven, beeinflussenden Sinn.
- source_word: τὸν ὄχλον
  choice: die Menge
  rationale: ὄχλος bezeichnet die versammelte Menschenmenge; „die Menge“ ist eine natürliche und präzise deutsche Wiedergabe.
- source_word: ἵνα
  choice: damit
  rationale: ἵνα leitet den beabsichtigten Ausgang des Aufwiegelns ein; „damit“ drückt diesen Zweck idiomatisch aus.
- source_word: μᾶλλον
  choice: stattdessen
  rationale: μᾶλλον bezeichnet hier eine Bevorzugung gegenüber der aus dem Kontext erschließbaren Alternative. „Stattdessen“ bewahrt den Vergleich, ohne Jesus ausdrücklich in den Vers einzufügen.
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Der Personenname wird in seiner im Deutschen etablierten Form wiedergegeben.
- source_word: ἀπολύσῃ
  choice: freiließ
  rationale: Der Aorist Konjunktiv nach ἵνα bezeichnet die beabsichtigte Handlung. Im deutschen damit-Satz ist „freiließ“ die natürliche Vergangenheitsform und schließt an die Erzählzeit an.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet diejenigen, denen Barabbas freigegeben werden sollte; „ihnen“ gibt dies knapp und direkt wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἀπολύσῃ
  choice: Pilatus wird ausdrücklich genannt.
  alternative: Das Subjekt bleibt als „er“ unausgesprochen beziehungsweise nur aus dem Kontext erschließbar.
  rationale: Im Griechischen ist Pilatus aufgrund des unmittelbaren Kontexts das grammatisch unausgesprochene Subjekt. Seine Nennung verhindert im Deutschen einen unklaren Pronomenbezug und fügt keine strittige Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Führende Priester“ vermeidet die im Deutschen mögliche Vorstellung mehrerer amtierender Hohepriester; „wiegelten … auf“ bewahrt die aktive Einflussnahme. Der einzige Fußnotenmarker [a] steht vollständig im Haupttext.
