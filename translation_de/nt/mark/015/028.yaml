  text: Καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα, Καὶ μετὰ ἀνόμων ἐλογίσθη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/028.yaml
  text: And[a] the scripture was fulfilled that says, "And he was numbered with the transgressors."
translation:
  language: de
  text: 'Und[a] die Schrift wurde erfüllt, die sagt: »Und er wurde zu den Gesetzlosen gerechnet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er ist jedoch in der byzantinischen Mehrheitstradition und in der lateinischen Überlieferung enthalten. Wahrscheinlich wurde er von späteren Abschreibern in Angleichung an Lukas 22,37 eingefügt, wo Jesaja 53,12 zitiert wird.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπληρώθη (πληρόω)
  choice: wurde erfüllt
  rationale: Im Zusammenhang mit einer prophetischen Schriftstelle gibt die etablierte Wendung »wurde erfüllt« den passiven Aorist präzise und natürlich wieder.
- source_word: ἀνόμων (ἄνομος)
  choice: Gesetzlosen
  rationale: Das substantivierte Adjektiv bezeichnet wörtlich Menschen, die ohne Gesetz beziehungsweise gesetzlos sind. »Gesetzlose« bewahrt den sprachlichen und theologischen Bezug der Anspielung auf Jesaja 53,12, ohne die Bedeutung vorschnell auf gewöhnliche Verbrecher einzuengen.
- source_word: ἐλογίσθη (λογίζομαι)
  choice: wurde … gerechnet
  rationale: Die passive Form bedeutet hier, dass er einer Gruppe zugerechnet oder unter sie eingeordnet wurde. »Zu den Gesetzlosen gerechnet« ist im Deutschen idiomatisch und hält sich eng an den griechischen Wortlaut.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: die Schrift …, die sagt
  rationale: Die personifizierende Redeweise des Griechischen bleibt erhalten und klingt in einer Schriftankündigung würdig und verständlich.
theological_decisions:
- issue: Deutung von ἀνόμων im Zitat aus Jesaja 53,12
  choice: Gesetzlosen
  alternative: Übeltätern / Verbrechern
  rationale: Die Übersetzung bewahrt den unmittelbaren Gesetzesbezug von ἄνομος und lässt offen, ob der Ausdruck rechtlich, moralisch oder theologisch akzentuiert ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die syntaktische Wiederholung von »Und« wurde beibehalten, weil sie sowohl den Versanschluss als auch den Wortlaut des Schriftzitats kennzeichnet. Der Fußnotenmarker steht unmittelbar beim textkritisch umstrittenen Versbeginn.
