reference: Mark 15:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: de
  text: 'Als aber der Hauptmann, der Jesus gegenüberstand, sah, dass er auf diese Weise seinen letzten Atemzug tat, sagte er: „Wahrhaftig, dieser Mensch war Gottes Sohn.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Sohn Gottes“. Der griechische Ausdruck kann qualitativ oder unbestimmt verstanden werden; im Zusammenhang des Markusevangeliums hat er jedoch wahrscheinlich die Bedeutung des Titels „Sohn Gottes“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Als aber … sah
  rationale: Das Partizip ἰδών wird hier natürlich als temporaler Nebensatz wiedergegeben. δέ ist ein leichter Anschluss; „aber“ erhält ihn, ohne einen starken Gegensatz zu behaupten.
- source_word: κεντυρίων
  choice: Hauptmann
  rationale: Gemeint ist der römische Zenturio. „Hauptmann“ ist die im Deutschen geläufige, allgemein verständliche Bezeichnung in diesem erzählerischen Zusammenhang.
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: der Jesus gegenüberstand
  rationale: „Gegenüberstand“ bewahrt die räumliche Aussage. Der Name „Jesus“ ersetzt das im Deutschen potenziell missverständliche Pronomen, ohne neue Sachinformation einzuführen.
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: dass er auf diese Weise seinen letzten Atemzug tat
  rationale: ἐκπνέω bezeichnet wörtlich das Aushauchen und idiomatisch das Sterben. Die Formulierung bewahrt dieses Bild und gibt οὕτως ausdrücklich wieder.
- source_word: Ἀληθῶς
  choice: Wahrhaftig
  rationale: „Wahrhaftig“ gibt den feierlichen, bekräftigenden Ton des Adverbs wieder und bleibt in gehobener moderner Erzählsprache verständlich.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: dieser Mensch
  rationale: Die Wiedergabe entspricht der ausdrücklichen Bezeichnung ἄνθρωπος und klingt im Deutschen natürlich.
- source_word: υἱὸς θεοῦ
  choice: Gottes Sohn
  rationale: Die Genitivfügung gibt den griechischen Ausdruck ohne einen im Griechischen nicht ausdrücklich gesetzten Artikel wieder und lässt zugleich seine christologische Titelfunktion im Markusevangelium erkennen.
- source_word: ἦν
  choice: war
  rationale: Der Imperfekt von εἰμί wird seinem Tempus entsprechend als Vergangenheit wiedergegeben.
theological_decisions:
- issue: Bedeutung und Bestimmtheit von υἱὸς θεοῦ im Bekenntnis des Hauptmanns
  choice: Gottes Sohn
  alternative: ein Sohn Gottes
  rationale: Im Erzählzusammenhang des Markusevangeliums trägt die Wendung wahrscheinlich die Kraft des christologischen Titels „Sohn Gottes“. Da die griechische Prädikatsfügung artikellos ist und auch qualitativ oder indefinit verstanden werden kann, wird die alternative Lesart in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache. „Hauptmann“ ist zugänglicher als das fachsprachlich präzisere „Zenturio“. Die bildhafte Sterbeformulierung des Griechischen und die echte Mehrdeutigkeit von υἱὸς θεοῦ bleiben erhalten.
