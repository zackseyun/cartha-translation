  source_fidelity: 'Die Wiedergabe von ἐσμυρνισμένον οἶνον als „mit Myrrhe versetzten Wein“ und von ὃς δὲ als „doch er“ ist treffend. „Sie wollten ihm ... geben“ ist jedoch keine sichere Wiedergabe von ἐδίδουν: Das Imperfekt beschreibt das Geben/Anbieten als Vorgang, nicht lediglich eine Absicht. Im Kontext seiner Nichtannahme ist „boten ... an“ im Deutschen angemessen und vermeidet zugleich die unzutreffende Implikation einer vollzogenen Übergabe.'
  naturalness: „Sie boten ihm mit Myrrhe versetzten Wein an, doch er nahm ihn nicht“ ist modernes, klares Standarddeutsch und bewahrt die knappe Erzählweise.
