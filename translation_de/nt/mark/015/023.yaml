  text: καὶ ἐδίδουν ⸀αὐτῷ ἐσμυρνισμένον οἶνον, ⸀ὃς δὲ οὐκ ἔλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/023.yaml
  text: And they were giving him wine mixed with myrrh[b][a], but he did not take it.
translation:
  language: de
  text: Und sie boten ihm mit Myrrhe versetzten Wein an, doch er nahm ihn nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίδουν
  choice: sie wollten … geben
  rationale: Der Imperfekt kann hier den versuchten bzw. nicht vollendeten Vorgang ausdrücken. Diese natürliche deutsche Formulierung wahrt den Bezug zu δίδωμι („geben“), ohne fälschlich nahezulegen, Jesus habe den Wein tatsächlich entgegengenommen.
- source_word: ἐσμυρνισμένον οἶνον
  choice: mit Myrrhe versetzten Wein
  rationale: Das Partizip bezeichnet Wein, der mit Myrrhe zubereitet bzw. vermischt wurde. „Mit Myrrhe versetzt“ ist präzise, verständlich und stilistisch würdig.
- source_word: ὃς δὲ
  choice: doch er
  rationale: Das formal relative ὃς nimmt Jesus resumptiv wieder auf; δέ trägt hier eine leicht adversative Bedeutung. „Doch er“ gibt die Konstruktion natürlich wieder.
- source_word: ἔλαβεν
  choice: nahm ihn nicht
  rationale: λαμβάνω bedeutet hier „nehmen“ bzw. „annehmen“. Das Pronomen „ihn“ bezieht sich im Deutschen grammatisch eindeutig auf den Wein.
theological_decisions:
- issue: Grund für Jesu Ablehnung des Getränks
  choice: Die Handlung wird ohne Angabe eines Beweggrundes beschrieben.
  alternative: Die Ablehnung als bewussten Verzicht auf ein schmerzlinderndes oder betäubendes Mittel erklären.
  rationale: Der griechische Text nennt weder Zweck noch Wirkung des mit Myrrhe versetzten Weins und erklärt nicht, warum Jesus ihn nicht nahm. Eine solche Deutung gehört daher nicht in den Haupttext.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die leichte Gegenüberstellung durch δέ wird mit „doch“ erhalten; unnötige Fach- oder altertümliche Sprache wird vermieden.
