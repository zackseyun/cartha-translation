source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτὸν ἐπὶ ⸀τὸν ⸀Γολγοθᾶν τόπον, ὅ ἐστιν ⸀μεθερμηνευόμενον Κρανίου Τόπος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: de
  text: 'Sie bringen ihn an den Ort Golgatha, das heißt übersetzt: Schädelstätte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: bringen
  rationale: Das historische Präsens wird im Deutschen als Präsens beibehalten. „Bringen“ gibt die Bewegung zu einem Ziel wieder, ohne unnötig festzulegen, ob Jesus geführt oder körperlich getragen wurde.
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: an den Ort Golgatha
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung zu einem Ort. Die Wiedergabe bewahrt sowohl τόπος als auch den Eigennamen, ohne ein im Griechischen nicht ausdrücklich vorhandenes „genannt“ einzufügen.
- source_word: Γολγοθᾶν
  choice: Golgatha
  rationale: Der Ortsname wird in seiner im Deutschen etablierten transliterierten Form wiedergegeben.
- source_word: μεθερμηνευόμενον
  choice: das heißt übersetzt
  rationale: Die Form bezeichnet ausdrücklich eine Übersetzung beziehungsweise sprachliche Deutung. Die deutsche Wendung ist natürlich und erhält diese erklärende Funktion.
- source_word: Κρανίου Τόπος
  choice: Schädelstätte
  rationale: „Schädelstätte“ ist die etablierte, knappe und natürliche deutsche Wiedergabe der Genitivverbindung. Anders als im Englischen zwingt das Deutsche bei diesem Kompositum nicht zur Entscheidung zwischen „eines Schädels“ und „des Schädels“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens und die erklärende Namensübersetzung des griechischen Textes bleiben erhalten; unnötige Erläuterungen werden vermieden.
