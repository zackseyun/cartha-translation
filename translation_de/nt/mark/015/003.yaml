base_translation:
  language: en
  yaml_path: translation/nt/mark/015/003.yaml
  text: And the chief priests were accusing him of many things[a].
translation:
  language: de
  text: Und die führenden Priester erhoben viele Anklagen gegen ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „beschuldigten ihn in vielen Punkten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den schlichten, parataktischen Erzählfluss des Markus und verbindet den Satz unmittelbar mit dem vorherigen Geschehen.
- source_word: κατηγόρουν
  choice: erhoben … Anklagen
  rationale: Das Imperfekt bezeichnet ein andauerndes oder wiederholtes Anklagen. Die deutsche Wendung ist natürlich und gibt zusammen mit „viele“ den gerichtlichen Kontext wieder.
- source_word: αὐτοῦ
  choice: gegen ihn
  rationale: Der Genitiv bezeichnet bei κατηγορέω die angeklagte Person; „gegen ihn“ entspricht dieser syntaktischen Beziehung idiomatisch.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Bezeichnet die leitenden Angehörigen der Priesterschaft und nicht mehrere gleichzeitig amtierende Hohepriester. Die Formulierung ist für heutige Leser klar und vermeidet ein irreführendes Amtsverständnis.
- source_word: πολλά
  choice: viele Anklagen
  rationale: Das substantivisch beziehungsweise adverbial gebrauchte Neutrum Plural bezeichnet zahlreiche Anklagepunkte oder Anschuldigungen, ohne deren Inhalt näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Verlaufsbedeutung des griechischen Imperfekts wird im Deutschen durch den narrativen Zusammenhang und die Mehrzahl „viele Anklagen“ vermittelt; eine schwerfällige Umschreibung mit „waren dabei“ wird vermieden.
