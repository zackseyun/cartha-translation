source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: de
  text: Nachdem er ein Leinentuch[a] gekauft hatte, nahm er ihn herab, wickelte ihn in das Leinentuch und legte ihn in ein Grab, das aus Fels herausgehauen war[b]. Dann wälzte er einen Stein vor den Eingang des Grabes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leinenlaken“ oder „Leichentuch“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „das aus dem Felsen gehauen war“.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „vor die Tür des Grabes“; das griechische Wort kann „Tür“ oder „Eingang“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: Leinentuch / das Leinentuch
  rationale: σινδών bezeichnet ein Tuch aus Leinen, das hier zur Bestattung verwendet wird. „Leinentuch“ wahrt Material und Funktion, ohne das spezifischere „Leichentuch“ in den Text einzutragen.
- source_word: καθελών
  choice: nahm ihn vom Kreuz herab
  rationale: καθαιρέω bedeutet hier, Jesus herabzunehmen. „Vom Kreuz“ ist im unmittelbaren Erzählzusammenhang eindeutig mitgemeint und macht den deutschen Satz natürlich und klar.
- source_word: ἐνείλησεν
  choice: wickelte ihn
  rationale: Das Verb bezeichnet das Einwickeln oder Einhüllen. „Wickelte ihn“ ist im Bestattungskontext natürlich und fügt keine weiteren Einzelheiten hinzu.
- source_word: ἔθηκεν
  choice: legte ihn
  rationale: „Legte ihn“ gibt τίθημι sachlich und zugleich würdig wieder.
- source_word: μνημείῳ / μνημείου
  choice: Grab / des Grabes
  rationale: μνημεῖον bezeichnet hier eine in den Felsen gearbeitete Grabanlage. „Grab“ ist im Deutschen die geläufige biblische Bezeichnung und wird durch den Relativsatz näher bestimmt.
- source_word: λελατομημένον ἐκ πέτρας
  choice: das aus dem Felsen gehauen war
  rationale: Das Perfektpartizip beschreibt den bestehenden Zustand des Grabes als aus Fels herausgearbeitet. „Aus dem Felsen gehauen“ ist präzise, verständlich und idiomatisch.
- source_word: προσεκύλισεν
  choice: wälzte
  rationale: Das Verb bezeichnet eine rollende Bewegung hin zu etwas. Bei einem schweren Verschlussstein ist „wälzte“ im Deutschen treffender als das neutralere „rollte“.
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: vor den Eingang des Grabes
  rationale: θύρα kann „Tür“ oder „Eingang/Öffnung“ bedeuten. Im Zusammenhang eines Felsengrabes ist „Eingang“ für heutige Leser klar; „vor“ gibt die Funktion des Steins als Verschluss natürlich wieder.
- source_word: ἀγοράσας
  choice: Er kaufte
  rationale: Das Aoristpartizip bezeichnet eine der folgenden Handlung vorausgehende Handlung. Die deutsche Reihung „Er kaufte …, nahm …“ gibt diese Abfolge flüssig wieder.
