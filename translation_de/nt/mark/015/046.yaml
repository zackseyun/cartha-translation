  terminology: „Leinentuch“, „wickelte“, „Grab“ und „Eingang“ sind sachgerecht. Die Fußnoten werden in der Revision vollständig und eindeutig an den jeweiligen Ausdrücken verankert; insbesondere wird die im englischen Audit Trail dokumentierte Alternative zu „aus dem Felsen gehauen“ nicht ausgelassen.
