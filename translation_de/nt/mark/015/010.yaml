review_pass:
  verdict: revise
  source_fidelity: 'Der Satz gibt die Satzstruktur und die zentralen Aussagen des griechischen Textes zutreffend wieder: γάρ ist begründend, das Imperfekt ἐγίνωσκεν wird idiomatisch mit »wusste« wiedergegeben, und das Plusquamperfekt παραδεδώκεισαν mit »ausgeliefert hatten« wahrt die Vorzeitigkeit. »Aus Neid« entspricht διὰ φθόνον angemessen.'
  naturalness: Die Formulierung ist flüssiges modernes Standarddeutsch und bewahrt den knappen erzählerischen Registerton. »Denn er wusste, dass …« ist natürlich und kontextuell anschlussfähig.
  terminology: ἀρχιερεῖς ist im Passionskontext die etablierte Bezeichnung für die führenden priesterlichen Amtsträger und wird im Deutschen am präzisesten mit »die Hohenpriester« wiedergegeben. »Führende Priester« ist verständlich, aber weniger terminologisch bestimmt. Die Fußnotenalternative »weil sie neidisch auf ihn waren« ergänzt zudem ein im griechischen Text nicht ausdrücklich genanntes Bezugsobjekt und sollte nicht als gleichwertige lexikalische Alternative stehen bleiben.
  issues:
  - severity: low
    issue: Terminologische Präzisierung von οἱ ἀρχιερεῖς
    rationale: »Die Hohenpriester« ist die im deutschen Bibelgebrauch etablierte, quellennahe Wiedergabe des pluralischen Amtstitels. Sie meint nicht mehrere gleichzeitig amtierende einzelne Hohepriester, sondern die priesterliche Führungsschicht.
  - severity: low
    issue: Fußnotenalternative fügt einen Bezug hinzu
    rationale: »weil sie neidisch auf ihn waren« expliziert »auf ihn«, obwohl φθόνος hier nur den Beweggrund nennt. Die Fußnote sollte bei echten lexikalischen Alternativen wie »aus Eifersucht« bleiben.
  revised_text: Denn er wusste, dass die Hohenpriester ihn aus Neid ausgeliefert hatten.[a]
