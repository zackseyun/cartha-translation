  text: ἐγίνωσκεν γὰρ ὅτι διὰ φθόνον παραδεδώκεισαν αὐτὸν οἱ ἀρχιερεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/010.yaml
  text: For he knew that the chief priests had handed him over because of envy[a].
translation:
  language: de
  text: Denn er wusste, dass die Hohenpriester ihn aus Neid ausgeliefert hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus Eifersucht«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: er wusste
  rationale: Das Imperfekt bezeichnet hier das bestehende bzw. gefestigte Wissen des Pilatus; im natürlichen Deutschen gibt »wusste« dies treffend wieder.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion begründet die vorangehende Aussage und bewahrt den erklärenden Zusammenhang.
- source_word: ὅτι
  choice: dass
  rationale: Leitet den Inhalt dessen ein, was Pilatus wusste.
- source_word: διὰ φθόνον
  choice: aus Neid
  rationale: διά mit Akkusativ bezeichnet hier den Beweggrund. »Aus Neid« ist im Deutschen eine natürliche und präzise Wiedergabe; »Eifersucht« bleibt als mögliche Bedeutungsnuance in der Fußnote erhalten.
- source_word: παραδεδώκεισαν
  choice: ausgeliefert hatten
  rationale: Das Plusquamperfekt wahrt die Vorzeitigkeit gegenüber Pilatus’ Wissen. »Ausliefern« passt zum gerichtlichen Zusammenhang, ohne die Bedeutung auf »verraten« zu verengen.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Pronomen bezieht sich auf Jesus.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führungsschicht, nicht mehrere gleichzeitig amtierende Hohepriester. »Führende Priester« macht dies für heutige Leser verständlich.
theological_decisions:
- issue: Das den führenden Priestern zugeschriebene Motiv
  choice: Der Text gibt Pilatus’ Erkenntnis wieder, dass sie Jesus aus Neid ausgeliefert hatten.
  alternative: »aus Eifersucht«
  rationale: Die Übersetzung lässt die Aussage als Pilatus’ Einschätzung stehen und fügt keine weitergehende theologische Deutung hinzu; die Bedeutungsnähe von Neid und Eifersucht wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. »Führende Priester« vermeidet das im Plural potenziell missverständliche »Hohepriester« und bezeichnet transparent die priesterliche Führung.
