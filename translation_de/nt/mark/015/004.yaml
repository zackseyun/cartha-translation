id: MRK.15.4
reference: Mark 15:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: de
  text: 'Doch Pilatus fragte ihn erneut: »Antwortest du nichts? Sieh, wie viele Anklagen sie gegen dich vorbringen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sieh, wie vieles sie dir vorwerfen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet die Fortführung der Erzählung mit einem leichten Gegensatz zu Jesu Schweigen; »Doch« ist im Deutschen natürlich und würdevoll.
- source_word: πάλιν
  choice: erneut
  rationale: Gibt die Wiederholung der Handlung knapp und idiomatisch wieder.
- source_word: ἐπηρώτα
  choice: fragte
  rationale: Das Imperfekt beschreibt das Fragen im Fortgang der Szene. »Fragte« passt zum gerichtlichen Zusammenhang, ohne die stärkere Bedeutung »verhörte« einzutragen.
- source_word: λέγων
  choice: direkte Rede nach Doppelpunkt
  rationale: Der griechische Rede einleitende Partizipialausdruck wird im natürlichen Deutschen durch einen Doppelpunkt wiedergegeben; ein zusätzliches »und sagte« wäre unnötig schwerfällig.
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: Antwortest du nichts?
  rationale: Bewahrt die zugespitzte negative Frage und Jesu Schweigen in knapper, verständlicher Form.
- source_word: ἴδε
  choice: Sieh
  rationale: Gibt den aufmerksamkeitslenkenden Imperativ direkt wieder und wahrt einen würdevollen, nicht altertümlichen Ton.
- source_word: πόσα
  choice: wie viele Anklagen
  rationale: Wörtlich steht »wie vieles«; der gerichtliche Kontext und κατηγοροῦσιν machen deutlich, dass Anklagen gemeint sind. Die Ergänzung schafft im Deutschen Klarheit.
- source_word: σου
  choice: gegen dich
  rationale: Der Genitiv bezeichnet bei κατηγορέω die angeklagte Person und wird idiomatisch mit »gegen dich« wiedergegeben.
- source_word: κατηγοροῦσιν
  choice: sie gegen dich vorbringen
  rationale: Im gerichtlichen Kontext bedeutet das Verb, Anklagen zu erheben beziehungsweise vorzubringen. Das Präsens lässt die in der Szene laufende Anklage erkennen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die griechische Redeformel wurde idiomatisch gestrafft; die juristische Bedeutung des letzten Satzes bleibt klar, während die Fußnote den wörtlicheren Ausdruck von πόσα sichtbar macht.
