  source_fidelity: 'Der Text gibt den griechischen Satzgehalt zuverlässig wieder: δέ/πάλιν sind als „Doch“/„erneut“ erfasst, ἐπηρώτα wird im erzählerischen Kontext angemessen mit „fragte“ wiedergegeben, und die beiden Fragen bewahren sowohl den Nachdruck als auch den juristischen Kontext. „wie viele Anklagen sie gegen dich vorbringen“ expliziert das bei πόσα und κατηγοροῦσιν im Kontext Gemeinte, ohne zusätzlichen Inhalt einzutragen.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählregister. Die direkte Rede nach Doppelpunkt ist idiomatisch. „Antwortest du nichts?“ ist knapp und verständlich und bewahrt die rhetorisch zugespitzte Form der griechischen Frage.
  terminology: „Anklagen“ und „gegen dich vorbringen“ treffen die forensische Bedeutung von κατηγορεῖν passend. Die Fußnote bietet mit „wie vieles“ eine sinnvolle stärker formnahe Alternative; „dir vorwerfen“ ist im Deutschen die natürliche Rektion von „vorwerfen“ und verändert die Aussage nicht.
