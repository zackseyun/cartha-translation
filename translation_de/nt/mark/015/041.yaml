base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: de
  text: Diese Frauen folgten Jesus, als er in Galiläa war, und sorgten für ihn[a]. Und viele andere Frauen waren mit ihm nach Jerusalem hinaufgezogen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: dienten ihm. Das griechische Verb kann praktische Hilfe, Versorgung oder Unterstützung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: mit ihm nach Jerusalem hinaufgestiegen waren. Die Formulierung entspricht der üblichen biblischen Redeweise, nach Jerusalem „hinaufzugehen“.'
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: Diese Frauen
  rationale: Das Relativpronomen greift die im vorherigen Vers genannten Frauen auf. Ein neuer deutscher Hauptsatz mit „Diese Frauen“ stellt den Bezug natürlich und eindeutig her.
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: schon in Galiläa
  rationale: Die zeitliche Angabe wird idiomatisch in den deutschen Satz eingebunden; „schon“ macht deutlich, dass ihr Folgen und Sorgen während Jesu Zeit in Galiläa geschah.
- source_word: ἠκολούθουν αὐτῷ
  choice: waren Jesus … gefolgt
  rationale: Das Plusquamperfekt bezeichnet aus der Perspektive der Kreuzigung das frühere Geschehen. Der Zusammenhang und die parallele imperfektische Form lassen eine fortdauernde beziehungsweise wiederholte Nachfolge erkennen.
- source_word: διηκόνουν αὐτῷ
  choice: hatten für ihn gesorgt
  rationale: διακονέω bezeichnet hier praktische Hilfe und Unterstützung. „Für ihn gesorgt“ ist gegenwärtiges, würdevolles Deutsch und vermeidet sowohl eine Verengung auf häusliche Arbeit als auch den möglichen Eindruck eines späteren kirchlichen Amts.
- source_word: ἄλλαι πολλαὶ
  choice: viele andere Frauen
  rationale: Das feminine Substantiv ist im Griechischen aus dem Zusammenhang zu ergänzen; im Deutschen wird „Frauen“ zur Klarheit ausdrücklich genannt.
- source_word: αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα
  choice: die mit ihm nach Jerusalem hinaufgezogen waren
  rationale: „Mit ihm“ bewahrt die gemeinsame Reise, und „hinaufgezogen“ gibt sowohl das Verb als auch die biblisch-kulturelle Rede vom Hinaufgehen nach Jerusalem wieder.
theological_decisions:
- issue: Art des durch διηκόνουν bezeichneten Dienstes der Frauen
  choice: hatten für ihn gesorgt
  alternative: hatten ihm gedient
  rationale: Die gewählte Formulierung lässt praktische Versorgung und persönliche Unterstützung zu, ohne den Dienst auf niedere Tätigkeiten zu beschränken oder ein kirchliches Amt in den Text hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Satzbau löst den griechischen Relativanschluss in zwei natürliche Hauptsätze auf. Das Plusquamperfekt ordnet beide Handlungen als Vorgeschichte zur Szene am Kreuz ein; „hinaufgezogen“ bewahrt zugleich das traditionelle Jerusalem-Idiom.
