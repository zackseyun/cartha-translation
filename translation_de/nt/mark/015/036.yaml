  variant: modern standard German
source:
  edition: SBLGNT
  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: de
  text: 'Da lief einer hin, füllte einen Schwamm mit saurem Wein[a], steckte ihn auf ein Rohr und gab ihm zu trinken. Dabei sagte er: »Lasst ihn![b] Wir wollen sehen, ob Elija kommt, um ihn herunterzuholen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »saurem Wein« ist ein einfacher, säuerlicher Weintrank gemeint, nicht unbedingt Essig im heutigen Sinn.
    reason: cultural_note
  - marker: b
    text: '»Lasst ihn!« kann hier auch bedeuten: »Wartet! Wir wollen sehen, ob Elija kommt, um ihn herunterzuholen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν δέ
  choice: Da lief einer hin
  rationale: Das Aoristpartizip eröffnet die nächste Handlung der Erzählfolge; die finite Formulierung ist im Deutschen natürlich und bewahrt das schnelle Hinlaufen.
- source_word: τις καὶ
  choice: einer
  rationale: τις bezeichnet eine nicht näher bestimmte Person. Das textlich bezeugte καί verlangt hier im Deutschen kein eigenes »auch«.
- source_word: γεμίσας σπόγγον ὄξους
  choice: füllte einen Schwamm mit saurem Wein
  rationale: ὄξος bezeichnet sauren Wein beziehungsweise einen einfachen säuerlichen Weintrank; »saurer Wein« vermeidet die moderne Verengung von »Essig« auf ein Küchenwürzmittel.
- source_word: περιθεὶς καλάμῳ
  choice: steckte ihn auf ein Rohr
  rationale: κάλαμος bezeichnet ein Rohr beziehungsweise Schilfrohr. »Steckte ihn auf« gibt die praktische Befestigung des Schwamms idiomatisch wieder, ohne die genaue Konstruktion unnötig festzulegen.
- source_word: ἐπότιζεν αὐτόν
  choice: gab ihm zu trinken
  rationale: Die deutsche Wendung gibt die kausative Bedeutung natürlich wieder. Obwohl das Imperfekt einen Verlauf oder Versuch anzeigen kann, wäre eine künstliche Verlaufsform im Deutschen schwerfällig.
- source_word: Ἄφετε
  choice: Lasst ihn!
  rationale: Der Imperativ kann zum Ablassen beziehungsweise Gewährenlassen auffordern. Die knappe Form bewahrt zugleich die kontextuelle Offenheit; die idiomatische Alternative »Wartet!« wird in einer Fußnote genannt.
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: Wir wollen sehen, ob Elija kommt
  rationale: Die deutsche Kohortativform gibt ἴδωμεν natürlich wieder; »ob ... kommt« bewahrt die offene Erwartung und das Präsens.
- source_word: καθελεῖν αὐτόν
  choice: um ihn herunterzuholen
  rationale: Im Kreuzigungskontext bezeichnet καθαιρέω das Herunternehmen von einer erhöhten Stelle, hier vom Kreuz.
theological_decisions:
- issue: Bedeutung und Bezug von Ἄφετε
  choice: »Lasst ihn!« als Aufforderung, Jesus vorerst in Ruhe zu lassen beziehungsweise nicht einzugreifen
  alternative: »Wartet!« als idiomatische Aufforderung an die Umstehenden
  rationale: Der griechische Imperativ lässt im Kontext beide Nuancen zu. Der Haupttext bleibt näher am lexikalischen Sinn, während die Fußnote die idiomatische Möglichkeit bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Elija« folgt der heute üblichen deutschen Form; »Rohr« wahrt den konkreten Sinn von κάλαμος. Alle Fußnotenmarker stehen an der jeweils erläuterten Textstelle.
