source:
  edition: SBLGNT
  text: Ἦσαν δὲ καὶ γυναῖκες ἀπὸ μακρόθεν θεωροῦσαι, ἐν ⸀αἷς καὶ ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸀ἡ Ἰακώβου τοῦ μικροῦ καὶ ⸀Ἰωσῆτος μήτηρ καὶ Σαλώμη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/040.yaml
  text: There were also women watching from a distance[a], among whom were Mary Magdalene, Mary the mother of James the younger and of Joses, and Salome[c][b],
translation:
  language: de
  text: Es waren auch Frauen da, die aus der Ferne zusahen[a]. Unter ihnen waren Maria aus Magdala, Maria, die Mutter von Jakobus dem Kleinen[b] und von Joses[c], und Salome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: von fern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Jakobus dem Jüngeren oder dem Geringeren. Die Bezeichnung kann sich auf Alter, Körpergröße oder Stellung beziehen.'
    reason: lexical_ambiguity
  - marker: c
    text: Im Griechischen steht hier Joses, eine Namensform, die sich von Josef unterscheidet.
    reason: name_distinction
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: Es waren auch … da
  rationale: Gibt das Imperfekt von εἰμί sowie die ergänzende Kraft von καί in natürlichem deutschem Erzählstil wieder; δέ wird nicht unnötig mit einem eigenen Bindewort überladen.
- source_word: γυναῖκες
  choice: Frauen
  rationale: Die sachgemäße und allgemein verständliche Wiedergabe des Plurals von γυνή.
- source_word: ἀπὸ μακρόθεν
  choice: aus der Ferne
  rationale: Bewahrt die räumliche Bedeutung der Wendung und klingt im modernen Standarddeutsch natürlich.
- source_word: θεωροῦσαι
  choice: die … zusahen
  rationale: Das Präsenspartizip bezeichnet anhaltendes, aufmerksames Sehen; „zusahen“ passt zum Geschehen und vermeidet eine unnötig fachsprachliche Formulierung.
- source_word: ἐν αἷς
  choice: Unter ihnen waren
  rationale: Kennzeichnet die anschließend genannten Frauen als Teil der größeren Gruppe und ist idiomatischer als eine formale Nachbildung des Relativsatzes.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Maria aus Magdala
  rationale: Macht die Herkunftsbezeichnung im Deutschen transparent, ohne Maria mit einem modernen Familiennamen zu versehen.
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: Maria, die Mutter von Jakobus dem Jüngeren und von Joses
  rationale: Bezieht μήτηρ verständlich auf beide Genitive. Die Wiederholung von „von“ verdeutlicht, dass Maria die Mutter beider Genannten ist.
- source_word: τοῦ μικροῦ
  choice: dem Jüngeren
  rationale: Ist als Personenbezeichnung verständlich, lässt aber mittels Fußnote offen, ob μικρός Alter, Körpergröße oder geringere Bedeutung bezeichnet.
- source_word: Ἰωσῆτος
  choice: Joses
  rationale: Bewahrt die im griechischen Text vorhandene Namensform und gleicht sie nicht stillschweigend an Josef an.
- source_word: Σαλώμη
  choice: Salome
  rationale: Übliche deutsche Form des griechischen Personennamens.
theological_decisions:
- issue: Bedeutung der Bezeichnung τοῦ μικροῦ bei Jakobus
  choice: Jakobus der Jüngere
  alternative: Jakobus der Kleine / der Geringere
  rationale: Die Wendung dient der Unterscheidung, doch der Text legt nicht fest, ob Alter, Körpergröße oder Stellung gemeint ist. Die Hauptfassung ist gut verständlich; die Fußnote erhält die echte Bedeutungsbreite.
- issue: Identität der genannten Maria und ihrer Söhne
  choice: Keine weitergehende Identifizierung über den Wortlaut hinaus
  alternative: Gleichsetzung mit anderen neutestamentlichen Personen gleichen Namens
  rationale: Der Vers selbst nennt lediglich die familiäre Beziehung. Eine Harmonisierung oder genealogische Festlegung wäre interpretativ und wird daher vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Herkunftsbezeichnung „aus Magdala“ ist transparent; traditionelle, aber missverständliche Festlegungen bei τοῦ μικροῦ werden nicht ohne Hinweis übernommen. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
