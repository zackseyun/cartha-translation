  text: Ἦν δὲ ὥρα τρίτη καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/025.yaml
  text: It was the third hour[a], and they crucified him.
translation:
  language: de
  text: Es war die dritte Stunde[a], und sie kreuzigten ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das entspricht nach der üblichen jüdischen Zeiteinteilung ungefähr neun Uhr morgens.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν
  choice: Es war
  rationale: Das Imperfekt von εἰμί steht hier idiomatisch bei einer Zeitangabe; im Deutschen entspricht dem natürlich „Es war“.
- source_word: δὲ
  choice: und
  rationale: δέ ist hier ein schwaches Bindewort der Erzählfolge, kein deutlicher Gegensatz. Zusammen mit dem folgenden καί lässt sich der fortlaufende Zusammenhang im Deutschen knapp mit „und“ wiedergeben, ohne ein unbelegtes „nun“ einzuführen.
- source_word: ὥρα τρίτη
  choice: die dritte Stunde
  rationale: Die formale Wiedergabe bewahrt die antike Zeitangabe und vermeidet, eine Umrechnung oder chronologische Harmonisierung in den Haupttext einzutragen.
- source_word: καὶ ἐσταύρωσαν
  choice: und sie kreuzigten
  rationale: καί verbindet den Satzteil, und der Aorist ἐσταύρωσαν bezeichnet unmittelbar die vollzogene Kreuzigung. „Kreuzigten“ ist die geläufige und genaue deutsche Entsprechung.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich auf Jesus und wird im Deutschen schlicht mit „ihn“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe der Zeitangabe im Blick auf die Chronologie
  choice: Die wörtliche Angabe „die dritte Stunde“ bleibt im Haupttext erhalten.
  alternative: „gegen neun Uhr morgens“
  rationale: Der griechische Text nennt die antike Stundenangabe, ohne sie in moderne Uhrzeit umzurechnen. Die wörtliche Wiedergabe bewahrt eine mögliche chronologische Spannung und verlagert die kulturelle Erläuterung in die Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die traditionelle Zeitangabe bleibt wegen ihrer textlichen und chronologischen Bedeutung erhalten; die moderne Entsprechung steht in der Fußnote.
