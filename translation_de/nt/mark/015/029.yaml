  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: de
  text: 'Die Vorübergehenden beschimpften ihn, schüttelten den Kopf und sagten: „Ha! Du, der du den Tempel[a] niederreißt und ihn in drei Tagen aufbaust[b],“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder genauer: „das Tempelheiligtum“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb bedeutet einfach „bauen/aufbauen“; im Zusammenhang kann „wieder aufbaust“ mitverstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: die Vorübergehenden
  rationale: Die substantivierte Partizipialform bezeichnet Menschen, die am Ort des Geschehens vorbeigingen; „die Vorübergehenden“ ist natürlich und nah am griechischen Ausdruck.
- source_word: ἐβλασφήμουν
  choice: beschimpften
  rationale: Im Kontext bezeichnet das Verb ehrverletzende, feindselige Rede gegen Jesus. „Beschimpften“ gibt dies wieder, ohne vorschnell den engeren religiösen Sinn „lästerten“ festzulegen; der griechische Imperfekt beschreibt das fortlaufende Geschehen.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: schüttelten den Kopf
  rationale: Die deutsche Wendung vermittelt die im Kontext gemeinte verächtliche Gebärde idiomatisch und verständlich.
- source_word: Οὐὰ
  choice: Ha!
  rationale: Der Ausruf hat hier spöttische und höhnische Kraft. „Ha!“ gibt diese Funktion im modernen Deutschen natürlicher wieder als „Wehe!“.
- source_word: ὁ καταλύων
  choice: Du, der du … niederreißt
  rationale: Der substantivierte Partizipialausdruck dient als direkte, spöttische Anrede. „Niederreißen“ passt zum Gebäude und bewahrt den präsentischen Wortlaut der Anschuldigung.
- source_word: ναὸν
  choice: den Tempel
  rationale: ναός kann genauer das Tempelheiligtum bezeichnen; „Tempel“ ist hier jedoch die verständliche und kontextuell passende Hauptübersetzung.
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: in drei Tagen wieder aufbaust
  rationale: οἰκοδομέω bedeutet wörtlich „bauen/aufbauen“. Nach „niederreißen“ macht „wieder aufbauen“ den im Deutschen nötigen Bezug idiomatisch deutlich, ohne eine zusätzliche theologische Deutung einzutragen.
theological_decisions:
- issue: Bezug des Tempelwortes
  choice: Die Worte werden als spöttische Anschuldigung der Vorübergehenden wiedergegeben, ohne den Tempel im Haupttext ausdrücklich mit Jesu Leib gleichzusetzen.
  alternative: Durch eine interpretierende Formulierung kenntlich machen, dass Jesus bildlich von seinem Leib gesprochen habe.
  rationale: Markus gibt an dieser Stelle die Perspektive der Spötter wieder. Die Übersetzung sollte die intertextuelle und theologische Spannung bewahren, statt sie durch eine Erklärung aus dem Johannesevangelium aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Satz bleibt wie im Ausgangstext syntaktisch offen, da die direkte Rede im folgenden Vers weitergeht.
