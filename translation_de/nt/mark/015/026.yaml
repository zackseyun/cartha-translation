id: MRK.15.26
reference: Mark 15:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἦν ἡ ἐπιγραφὴ τῆς αἰτίας αὐτοῦ ἐπιγεγραμμένη· Ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/026.yaml
  text: 'And the inscription of the charge against him was written: “The King of the Jews.”[a]'
translation:
  language: de
  text: 'Und die Aufschrift mit der Anklage gegen ihn lautete: »Der König der Juden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der König der Judäer.«'
    reason: Lexikalische Alternative für Ἰουδαίων.
lexical_decisions:
- source_word: ἐπιγραφή
  choice: Aufschrift
  rationale: Bezeichnet die schriftliche Bekanntgabe am oder über dem Kreuz. »Aufschrift« ist im Deutschen natürlich und bewahrt den formalen Sinn einer sichtbar angebrachten schriftlichen Angabe.
- source_word: αἰτία
  choice: Anklage gegen ihn
  rationale: Im gerichtlichen Zusammenhang bezeichnet das Wort den gegen Jesus erhobenen Anklagegrund. Die Formulierung gibt den rechtlichen Sinn knapp und verständlich wieder.
- source_word: ἐπιγεγραμμένη
  choice: lautete
  rationale: Die Verbindung mit ἦν beschreibt, was als Aufschrift geschrieben dastand. »Lautete« vermeidet im Deutschen die schwerfällige Wiederholung von »Aufschrift« und »geschrieben«, ohne den Inhalt zu erweitern.
- source_word: βασιλεὺς
  choice: König
  rationale: Das Wort bezeichnet den königlichen Titel, der hier als Wortlaut der Anklage wiedergegeben wird.
- source_word: Ἰουδαίων
  choice: der Juden
  rationale: Die Wendung ist in den Passionsberichten die geläufige Bezeichnung des Volkes in dem Jesus zugeschriebenen Königstitel. »Judäer« ist lexikalisch möglich und wird deshalb in einer Fußnote genannt.
theological_decisions:
- issue: Wiedergabe von Ἰουδαίων im Kreuzigungstitel
  choice: der Juden
  alternative: der Judäer
  rationale: Der Vers gibt den römischen Anklage- beziehungsweise Königstitel wieder. »König der Juden« bewahrt die im Deutschen bekannte und im unmittelbaren Kontext naheliegende Volksbezeichnung. Da Ἰουδαῖος je nach Kontext auch geografisch als »Judäer« verstanden werden kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzform ist knapp und öffentlich-rechtlich gefärbt; »lautete« gibt idiomatisch wieder, dass die Aufschrift in dieser Form dastand.
