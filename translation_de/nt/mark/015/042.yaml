  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤδη ὀψίας γενομένης, ἐπεὶ ἦν παρασκευή, ὅ ἐστιν ⸀προσάββατον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/042.yaml
  text: And when evening had already come[a], since it was the Preparation Day—that is[c][b], the day before the Sabbath—
translation:
  language: de
  text: Und als es schon Abend geworden war[a] – denn es war Rüsttag[b], das heißt, der Tag vor dem Sabbat[c] –,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als der Abend schon gekommen war“.'
    reason: lexical_alternative
  - marker: b
    text: Der „Rüsttag“ war die Bezeichnung für den Vorbereitungstag vor dem Sabbat.
    reason: cultural_note
  - marker: c
    text: 'Oder: „der Vortag des Sabbats“. Gemeint ist der Tag vor dem Sabbat, traditionell der Freitag.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den für Markus typischen parataktischen Erzählstil und schließt unmittelbar an den vorausgehenden Zusammenhang an.
- source_word: ἤδη ὀψίας γενομένης
  choice: als es schon Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand; „schon“ gibt ἤδη wieder, und die Formulierung bewahrt den Eintritt des Abends, ohne ihn unnötig genauer festzulegen.
- source_word: ἐπεὶ
  choice: nämlich
  rationale: Gibt hier die erklärend-begründende Funktion natürlich wieder und passt gut in den eingeschobenen Hinweis zum Kalendertag.
- source_word: παρασκευή
  choice: Rüsttag
  rationale: „Rüsttag“ ist im Deutschen ein etablierter biblischer Ausdruck für den Vorbereitungstag vor dem Sabbat; die beigefügte Erklärung verhindert, dass der Ausdruck unverständlich bleibt.
- source_word: ὅ ἐστιν
  choice: das heißt
  rationale: Natürliche moderne Wiedergabe der erklärenden Formel.
- source_word: προσάββατον
  choice: der Tag vor dem Sabbat
  rationale: Gibt die schlichte Bedeutung des seltenen Ausdrucks verständlich wieder, ohne direkt „Freitag“ einzusetzen und damit stärker zu interpretieren als die Wortform selbst.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt entsprechend dem griechischen Ausgangstext syntaktisch offen, da Vers 42 in den folgenden Vers weiterführt. Gedankenstriche markieren die erklärende Einschaltung klar, ohne Markus’ Erzählfluss aufzulösen.
