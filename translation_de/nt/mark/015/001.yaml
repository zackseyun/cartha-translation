id: MRK.15.1
reference: Mark 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: de
  text: Sogleich am frühen Morgen hielten die führenden Priester zusammen mit den Ältesten, Schriftgelehrten und dem gesamten Hohen Rat[a] eine Beratung ab. Dann fesselten sie Jesus, führten ihn ab und übergaben ihn Pilatus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem gesamten Synedrium“. Das griechische συνέδριον bezeichnet den jüdischen obersten Rat.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς πρωῒ
  choice: gleich früh am Morgen
  rationale: Gibt sowohl die für Markus typische Unmittelbarkeit von εὐθύς als auch die frühe Tageszeit von πρωΐ in natürlichem Deutsch wieder.
- source_word: συμβούλιον ποιήσαντες
  choice: berieten sich
  rationale: Die griechische Wendung bezeichnet eine gemeinsame, wahrscheinlich förmliche Beratung; die finite deutsche Form löst das Partizip idiomatisch auf.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural meint die maßgeblichen Angehörigen der priesterlichen Führung, nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Bezeichnet in diesem Leitungskontext anerkannte Repräsentanten und Amtsträger.
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: Die etablierte deutsche Bezeichnung trifft ihre Funktion als kundige Ausleger des Gesetzes.
- source_word: ὅλον τὸ συνέδριον
  choice: dem gesamten Hohen Rat
  rationale: Bezeichnet den jüdischen obersten Rat; „Hoher Rat“ ist im Deutschen verständlich und historisch hinreichend bestimmt.
- source_word: δήσαντες
  choice: fesselten sie
  rationale: Gibt das tatsächliche Binden Jesu direkt und in diesem Haftkontext natürlich wieder.
- source_word: ἀπήνεγκαν
  choice: führten ihn ab
  rationale: In der Situation einer Gefangenenüberstellung ist dies idiomatischer als ein wörtliches „trugen ihn weg“.
- source_word: παρέδωκαν
  choice: übergaben ihn
  rationale: Bewahrt den gerichtlichen beziehungsweise hoheitlichen Sinn der Überstellung in die Gewalt des Pilatus, ohne zusätzliche theologische Deutung einzutragen.
- source_word: Πιλάτῳ
  choice: Pilatus
  rationale: Übliche deutsche Namensform; der Dativ wird durch die deutsche Satzkonstruktion ausgedrückt.
theological_decisions:
- issue: Bedeutung von συνέδριον
  choice: der gesamte Hohe Rat
  alternative: das gesamte Synedrium
  rationale: „Hoher Rat“ vermittelt heutigen Lesern unmittelbar die institutionelle Funktion. Die Transliteration „Synedrium“ wäre historisch spezifisch, bedürfte aber eher einer Erklärung.
- issue: Erzähltheologische Tragweite von παρέδωκαν
  choice: übergaben ihn
  alternative: lieferten ihn aus
  rationale: „Übergaben“ bezeichnet klar den Wechsel der Verfügungsgewalt an Pilatus. „Ausliefern“ könnte die negative oder theologische Wertung stärker zuspitzen, als es das Verb an dieser Stelle allein verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Partizipialkonstruktion wird zur besseren Verständlichkeit in zwei Hauptsätze aufgelöst; Reihenfolge und rascher Fortgang der Handlungen bleiben erhalten.
