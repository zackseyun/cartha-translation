    issue: Unidiomatische Zeitangabe
    rationale: „Gleich früh am Morgen“ klingt gegenüber „sogleich am frühen Morgen“ weniger flüssig und kann die unmittelbare Folge von εὐθύς weniger eindeutig ausdrücken.
  - severity: low
    issue: Fußnote zur Institutionsbezeichnung fehlt
    rationale: Die englische Audit-Fußnote dokumentiert die mögliche Wiedergabe von συνέδριον als „Sanhedrin“; im Deutschen ist die entsprechende Form „Synedrium“ als markierte Alternative sinnvoll.
