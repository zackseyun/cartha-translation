  timestamp: '2026-07-14T21:20:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Handlungsfolge und die wesentlichen Bedeutungen sind zutreffend wiedergegeben: die umgehende morgendliche Beratung, das Binden Jesu, sein Abführen und die Übergabe an Pilatus. „Führende Priester“ ist für ἀρχιερεῖς angemessen, und „Hoher Rat“ gibt συνέδριον sinnvoll wieder.'
  naturalness: „Gleich früh am Morgen“ ist im modernen Standarddeutsch weniger idiomatisch. „Sogleich am frühen Morgen“ verbindet die von εὐθύς markierte Unmittelbarkeit klar und natürlich mit πρωΐ. Eine leicht umgestellte Satzführung macht zudem deutlich, dass alle genannten Gruppen an der Beratung beteiligt sind.
  terminology: „Führende Priester“, „Älteste“, „Schriftgelehrte“, „Hoher Rat“, „fesselten“, „führten ... ab“ und „übergaben“ sind registergerecht und terminologisch konsistent. Die englische Audit-Fußnote zur möglichen Bezeichnung „Synedrium“ sollte mit Anker übernommen werden.
