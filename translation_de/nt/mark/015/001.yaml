revisions:
- from: Gleich früh am Morgen berieten sich die führenden Priester mit den Ältesten und Schriftgelehrten sowie dem gesamten Hohen Rat. Dann fesselten sie Jesus, führten ihn ab und übergaben ihn Pilatus.
  to: Sogleich am frühen Morgen hielten die führenden Priester zusammen mit den Ältesten, Schriftgelehrten und dem gesamten Hohen Rat[a] eine Beratung ab. Dann fesselten sie Jesus, führten ihn ab und übergaben ihn Pilatus.
  rationale: Die Revision ersetzt die weniger natürliche Zeitformulierung durch „Sogleich am frühen Morgen“, ohne die Nuancen von εὐθύς und πρωΐ abzuschwächen. Die Satzstellung zeigt klar, dass die Priester, Ältesten, Schriftgelehrten und der gesamte Hohe Rat gemeinsam berieten. Die Fußnote dokumentiert die historische Alternativbezeichnung, ohne sie dem verständlichen Haupttext vorzuziehen.
