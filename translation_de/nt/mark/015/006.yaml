  text: Κατὰ δὲ ἑορτὴν ἀπέλυεν αὐτοῖς ἕνα δέσμιον ⸂ὃν παρῃτοῦντο⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: de
  text: Zum Fest ließ er ihnen jeweils einen Gefangenen frei, um den sie baten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: Zum Fest
  rationale: κατά mit Akkusativ bezeichnet hier den regelmäßig wiederkehrenden Zeitpunkt. „Zum Fest“ ist knapp und natürlich; die leicht fortführende Partikel δέ muss im Deutschen nicht eigens wiedergegeben werden.
- source_word: ἀπέλυεν
  choice: ließ … jeweils … frei
  rationale: Der Imperfekt beschreibt eine wiederholte Gewohnheit. „Jeweils“ macht diesen habituellen Sinn in natürlichem Deutsch deutlich, ohne das Verb schwerfällig mit „pflegte“ wiederzugeben.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Menschen, zu deren Gunsten die Freilassung geschah; das deutsche „ihnen“ wahrt die knappe Form des Ausgangstextes.
- source_word: ἕνα δέσμιον
  choice: einen Gefangenen
  rationale: ἕνα hebt die Einzahl hervor; im Deutschen leistet „einen“ dies ausreichend. „Gefangener“ ist im gerichtlichen Zusammenhang die natürliche Entsprechung für δέσμιος.
- source_word: ὃν παρῃτοῦντο
  choice: um den sie baten
  rationale: παραιτέομαι bedeutet hier, jemanden zu erbitten beziehungsweise um seine Freilassung zu bitten. Die Formulierung ist verständlich und erhält den Bezug auf den ausgewählten Gefangenen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung bleibt nahe am griechischen Text, während „jeweils“ den gewohnheitsmäßigen Sinn des Imperfekts idiomatisch ausdrückt.
