id: MRK.15.9
reference: Mark 15:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: de
  text: 'Pilatus aber antwortete ihnen: »Wollt ihr, dass ich euch den König der Juden[a] freilasse?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »den König der Judäer«. Das griechische Wort Ἰουδαίων kann sowohl »Juden« als auch »Judäer« bedeuten; in diesem festen Titel der Passionsgeschichte ist »Juden« die traditionelle und kontextuell passende Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet hier einen leichten Gegensatz beziehungsweise die erzählerische Weiterführung; »aber« passt zu Pilatus’ Reaktion auf die Menge.
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: antwortete ihnen
  rationale: Gibt den responsiven Sinn natürlich wieder. Das griechische Partizip λέγων muss im modernen Deutschen nicht eigens mit »indem er sagte« ausgedrückt werden, da die folgende direkte Rede die Sprechhandlung bereits deutlich macht.
- source_word: Θέλετε
  choice: Wollt ihr
  rationale: θέλω bezeichnet hier Wunsch oder Absicht; »Wollt ihr« ist idiomatisch, direkt und dem Kontext angemessen.
- source_word: ἀπολύσω ὑμῖν
  choice: dass ich euch … freilasse
  rationale: Der Konjunktiv in der Frage wird im Deutschen natürlich durch einen dass-Satz wiedergegeben. »Freilassen« bezeichnet im gerichtlichen Zusammenhang präzise die Entlassung eines Gefangenen; »euch« bewahrt den Dativbezug.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: den König der Juden
  rationale: Bewahrt den festen politischen und zugleich ironisch aufgeladenen Titel der Passionsgeschichte. Die Großschreibung von »König« folgt der deutschen Substantivschreibung und trifft keine zusätzliche theologische Vorentscheidung.
theological_decisions:
- issue: Wiedergabe des Titels τὸν βασιλέα τῶν Ἰουδαίων
  choice: den König der Juden
  alternative: den König der Judäer
  rationale: Der Ausdruck fungiert in der Passionsgeschichte als politischer Titel im Mund römischer und anderer Figuren. »Juden« ist dafür die traditionelle und kontextuell passende Wiedergabe; die mögliche regionale Bedeutung »Judäer« wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe direkte Frage bewahrt die erzählerische Unmittelbarkeit; die griechische Wendung »antwortete … sagend« wird ohne schwerfällige Nachbildung idiomatisch wiedergegeben.
