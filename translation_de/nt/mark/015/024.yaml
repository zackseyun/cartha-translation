  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes angemessen wieder: das historische Präsens von σταυροῦσιν („kreuzigen“), das Verteilen der Kleidungsstücke, das Loswerfen über diese sowie die distributive Wendung τίς τί ἄρῃ („wer was bekommen soll“). „Unter sich“ macht den bei der Handlung vorausgesetzten Kreis der Beteiligten idiomatisch deutlich, ohne den Sinn zu verändern.'
