  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: de
  text: Und sie kreuzigen ihn und verteilen seine Kleider unter sich, indem sie das Los darüber werfen, wer was bekommen soll.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυροῦσιν
  choice: kreuzigen
  rationale: Das historische Präsens bewahrt die für Markus typische lebendige Erzählweise und lässt sich im Deutschen hier natürlich wiedergeben.
- source_word: διαμερίζονται
  choice: verteilen unter sich
  rationale: Das Verb bezeichnet das Aufteilen beziehungsweise Verteilen in Anteile; mit mehreren Kleidungsstücken ist diese Formulierung im Deutschen klar und idiomatisch.
- source_word: ἱμάτια
  choice: Kleider
  rationale: „Kleider“ bezeichnet hier konkret die Kleidungsstücke Jesu und entspricht dem würdigen biblischen Erzählregister, ohne altertümlich zu wirken.
- source_word: βάλλοντες κλῆρον
  choice: das Los werfen
  rationale: Die Wendung gibt das antike Verfahren wieder, durch ein Los die Zuteilung zu bestimmen. Sie bleibt nahe an der Bildlichkeit des griechischen Ausdrucks.
- source_word: ἐπ’ αὐτὰ
  choice: darüber
  rationale: Das Pronomen verweist auf die Kleidungsstücke als Gegenstände der Auslosung; „darüber“ bewahrt den knappen Anschluss des griechischen Textes.
- source_word: τίς τί ἄρῃ
  choice: wer was bekommen soll
  rationale: 'Die doppelte Frageform bezeichnet die durch das Los bestimmte Zuordnung: welche Person welches Kleidungsstück erhält. „Bekommen“ gibt in diesem Zusammenhang den Sinn von ἄρῃ natürlich wieder.'
theological_decisions:
- issue: Historisches Präsens im Passionsbericht
  choice: „sie kreuzigen“ im Präsens
  alternative: „sie kreuzigten“ im Präteritum
  rationale: Markus verwendet das historische Präsens zur Vergegenwärtigung des Geschehens. Die deutsche Wiedergabe im Präsens bewahrt diese Erzählwirkung, ohne eine zusätzliche theologische Aussage einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Das historische Präsens und die knappe Satzbewegung des griechischen Textes bleiben erhalten. Keine Fußnote ist nötig, da „wer was bekommen soll“ die distributive Bedeutung von τίς τί verständlich wiedergibt, ohne die Aussage unnötig auszudeuten.
