base_translation:
  language: en
  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: de
  text: Und die Menge kam herauf und begann ihn zu bitten, für sie zu tun, was er gewöhnlich tat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und die Menge, nachdem sie heraufgekommen war, begann zu bitten, wie er gewöhnlich für sie tat.“ Das Griechische lässt sowohl den Adressaten der Bitte als auch die erbetene Handlung unausgesprochen.'
    reason: Die Anmerkung bewahrt die formale, elliptische Struktur des Griechischen und erläutert die zurückhaltenden Ergänzungen im Haupttext.
lexical_decisions:
- source_word: ἀναβὰς
  choice: kam herauf
  rationale: Das Aoristpartizip von ἀναβαίνω bezeichnet eine aufwärts gerichtete Bewegung bzw. ein Herankommen. „Kam herauf“ bewahrt diese räumliche Nuance in natürlichem Deutsch.
- source_word: ὁ ὄχλος
  choice: die Menge
  rationale: ὄχλος bezeichnet hier die versammelte Menschenmenge; „die Menge“ ist die übliche, verständliche deutsche Wiedergabe.
- source_word: ἤρξατο αἰτεῖσθαι
  choice: begann ihn zu bitten
  rationale: ἄρχομαι mit Infinitiv bedeutet „beginnen“; das mediale αἰτεῖσθαι bezeichnet hier ein Erbitten. „Ihn zu bitten“ ergänzt den aus dem Kontext ersichtlichen Adressaten auf natürliche Weise.
- source_word: καθὼς
  choice: so … wie
  rationale: καθώς drückt einen Vergleich mit dem üblichen Handeln des Pilatus aus. Die Korrelativform „so … wie“ erhält diesen Bezug, ohne den konkreten Gegenstand der Bitte vorwegzunehmen.
- source_word: ἐποίει
  choice: gewöhnlich … tat
  rationale: Der Imperfekt hat hier iterative bzw. gewohnheitsmäßige Bedeutung. „Gewöhnlich tat“ gibt diese Nuance klar wieder.
- source_word: αὐτοῖς
  choice: für sie
  rationale: 'Der Dativ ist in diesem Zusammenhang benefaktiv: Pilatus erwies der Menge den üblichen Gefallen. Daher ist „für sie“ angemessener als „ihnen“.'
