- from: Und die Menge kam herauf und begann ihn zu bitten, es so zu machen, wie er es gewöhnlich für sie tat.[a]
  to: Und die Menge kam herauf und begann ihn zu bitten, für sie zu tun, was er gewöhnlich tat.[a]
