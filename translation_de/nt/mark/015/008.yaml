  source_fidelity: Der Entwurf gibt die Bewegung der Menge, den Beginn der Bitte und den gewohnheitsmäßigen Imperfekt von ἐποίει im Grundsatz zutreffend wieder. Das unbestimmte Objekt der Bitte darf im Deutschen aus dem Kontext behutsam ergänzt werden. Die Formulierung „es so zu machen“ verschiebt jedoch den Akzent auf die Art und Weise eines nicht benannten Handelns und ist ohne Bezugswort unnötig vage. „für sie zu tun, was er gewöhnlich tat“ gibt die hier gemeinte Bitte um die übliche Handlung idiomatisch wieder.
  naturalness: „Kam herauf“ ist möglich und bewahrt die Bewegungsnuance. Der Satz wird deutlich natürlicher, wenn das unbegründete Pronomen „es“ entfällt und die Infinitivkonstruktion die erbetene übliche Handlung direkt ausdrückt.
  terminology: „Menge“, „bitten“ und „gewöhnlich“ sind moderne, sachgerechte Wiedergaben. „Für sie“ kann den Dativ αὐτοῖς im gegebenen Kontext angemessen wiedergeben. Es sind keine theologischen Fachbegriffe betroffen.
