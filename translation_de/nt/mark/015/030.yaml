  text: σῶσον σεαυτὸν ⸀καταβὰς ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: de
  text: Rette dich selbst[a] und steig vom Kreuz herab!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Partizip kann hier als eng begleitende Aufforderung verstanden werden: „Rette dich selbst – steig vom Kreuz herab!“; möglich sind auch eine Auffassung als Mittel („indem du … herabsteigst“) oder als vorgängige Handlung („nachdem du … herabgestiegen bist“).'
    reason: Das Partizip καταβάς lässt das genaue Verhältnis zum Imperativ σῶσον offen; die Anmerkung benennt die Möglichkeiten, ohne eine davon unzutreffend als wörtlicher auszugeben.
lexical_decisions:
- source_word: σῶσον
  choice: Rette
  rationale: Der Aoristimperativ in der zweiten Person Singular ist hier eine spöttische Aufforderung. „Rette“ ist direkt, idiomatisch und bewahrt zugleich den Anklang an die Heilssprache.
- source_word: σεαυτόν
  choice: dich selbst
  rationale: Das Reflexivpronomen steht als direktes Objekt zu σῶσον und betont in der Verspottung, dass Jesus sich selbst retten solle.
- source_word: καταβάς
  choice: und steig … herab
  rationale: Das Aoristpartizip bezeichnet eine eng mit dem Imperativ verbundene Begleithandlung. Die koordinierte Aufforderung klingt im modernen Deutschen natürlich, ohne eindeutig festzulegen, ob das Herabsteigen als Mittel, Begleithandlung oder vorgängige Handlung gemeint ist.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: vom Kreuz
  rationale: Die Präpositionalphrase bezeichnet die Bewegung vom Kreuz weg; „vom Kreuz“ ist in diesem Passionszusammenhang die übliche und natürliche Wiedergabe.
theological_decisions:
- issue: Verhältnis des Partizips καταβάς zum Imperativ σῶσον
  choice: „Rette dich selbst und steig vom Kreuz herab!“
  alternative: „Rette dich selbst, indem du vom Kreuz herabsteigst!“ beziehungsweise „Rette dich selbst, nachdem du vom Kreuz herabgestiegen bist!“
  rationale: Die griechische Konstruktion lässt das genaue logische Verhältnis der Handlungen offen. Die Beiordnung gibt die zugespitzte spöttische Aufforderung natürlich wieder und vermeidet es, eine instrumentale oder zeitliche Beziehung als eindeutig festzuschreiben.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Herabsteigen“ entspricht dem Passionskontext und wahrt gegenüber dem umgangssprachlicheren „herunterkommen“ einen angemessenen Ton.
