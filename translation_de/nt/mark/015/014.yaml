  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: de
  text: 'Pilatus aber sagte zu ihnen: „Was hat er denn Böses getan?“ Doch sie schrien noch viel lauter: „Kreuzige ihn!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt stellt Pilatus’ Sprechen als andauernden Vorgang dar; im natürlichen deutschen Erzählstil genügt hier „sagte“, ohne eine ausdrücklich wiederholte Frage zu behaupten.
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: Was hat er denn Böses getan?
  rationale: „Denn“ gibt das in der Frage begründend beziehungsweise nachdrücklich gebrauchte γάρ idiomatisch wieder; „Böses“ bewahrt die moralische Stärke von κακόν.
- source_word: περισσῶς
  choice: nur noch lauter
  rationale: Die Wendung bringt die gesteigerte Heftigkeit des Zurufs in natürlichem modernem Deutsch zum Ausdruck.
- source_word: ἔκραξαν
  choice: schrien
  rationale: Das Verb bezeichnet einen lauten öffentlichen Aufschrei oder Zuruf; „schrien“ wahrt dessen Kraft.
- source_word: Σταύρωσον αὐτόν
  choice: Kreuzige ihn!
  rationale: Der Aoristimperativ formuliert eine unmittelbare, nachdrückliche Forderung an Pilatus.
- source_word: δὲ
  choice: aber / doch
  rationale: Die beiden Vorkommen markieren jeweils einen Gegensatz; die Variation ist im Deutschen natürlich und bewahrt die adversative Bewegung.
- source_word: Πιλᾶτος
  choice: Pilatus
  rationale: Der Personenname folgt der etablierten deutschen Namensform.
theological_decisions:
- issue: Moralische Stärke von κακόν in Pilatus’ Frage
  choice: „Böses“
  alternative: „Unrecht“
  rationale: „Böses“ erhält die moralische und zugleich anklagende Kraft des griechischen Ausdrucks, ohne Pilatus’ Frage dogmatisch über ihren Wortlaut hinaus auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Gegensätze und der scharfe Wechsel von Pilatus’ Frage zum gesteigerten Ruf der Menge bleiben erhalten.
