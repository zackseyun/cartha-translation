revisions:
- from: Pilatus aber wunderte sich, dass er schon tot sein sollte.[a] Er ließ den Hauptmann rufen und fragte ihn, ob Jesus bereits seit einiger Zeit tot sei.
  to: Pilatus aber wunderte sich, ob er schon tot sei. Er rief den Zenturio zu sich und fragte ihn, ob Jesus schon vor einiger Zeit gestorben sei.
  rationale: Die Revision folgt den beiden griechischen εἰ-Sätzen als indirekten Fragen, entfernt die nicht markierte Modalnuance von „sollte“, bewahrt bei πάλαι ἀπέθανεν die ereignishafte Aussage des Sterbens und verwendet die präzise historische Rangbezeichnung „Zenturio“. Die Einfügung von „Jesus“ im zweiten Satz bleibt zur eindeutigen Referenz zulässig.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:20:52Z'
review_pass:
  verdict: revise
  source_fidelity: Der erste εἰ-Satz ist am besten als indirekte Frage mit „ob“ wiederzugeben. „dass er schon tot sein sollte“ macht daraus eine Feststellung und fügt mit „sollte“ eine im Griechischen nicht ausgedrückte Vorläufigkeit bzw. Distanz hinzu. Im zweiten Fragesatz bezeichnet πάλαι einen bereits verstrichenen Zeitraum; „vor einiger Zeit gestorben“ gibt dies näher am Aorist ἀπέθανεν wieder als „seit einiger Zeit tot“.
  naturalness: Die überarbeitete Fassung ist flüssiges modernes Standarddeutsch. „Rief ... zu sich“ gibt die zeitliche Folge des Partizips natürlich wieder.
  terminology: „Zenturio“ wahrt die konkrete römische Amtsbezeichnung κεντυρίων besser als „Hauptmann“, das im heutigen Deutsch vor allem eine andersartige militärische Rangbezeichnung hervorruft.
  issues:
  - severity: medium
    issue: „dass er schon tot sein sollte“ für εἰ ἤδη τέθνηκεν
    rationale: εἰ leitet hier eine indirekte Frage ein. Das Modalverb „sollte“ ist keine Entsprechung im griechischen Text und verändert Pilatus’ Verwunderung zu einer distanzierten, nur behaupteten Information.
  - severity: low
    issue: „seit einiger Zeit tot sei“ für εἰ πάλαι ἀπέθανεν
    rationale: Die Formulierung ist sinngemäß möglich, verschiebt aber den Blick vom griechischen Aorist „gestorben“ auf einen Zustandsausdruck. „vor einiger Zeit gestorben“ erhält Ereignis und Zeitangabe.
  - severity: low
    issue: „Hauptmann“ für κεντυρίων
    rationale: „Zenturio“ ist im modernen Deutschen verständlich und historisch präziser.
  revised_text: Pilatus aber wunderte sich, ob er schon tot sei. Er rief den Zenturio zu sich und fragte ihn, ob Jesus schon vor einiger Zeit gestorben sei.
  revised_footnotes: []
  revision_rationale: Die Revision folgt den beiden griechischen εἰ-Sätzen als indirekten Fragen, entfernt die nicht markierte Modalnuance von „sollte“, bewahrt bei πάλαι ἀπέθανεν die ereignishafte Aussage des Sterbens und verwendet die präzise historische Rangbezeichnung „Zenturio“. Die Einfügung von „Jesus“ im zweiten Satz bleibt zur eindeutigen Referenz zulässig.
