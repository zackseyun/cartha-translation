source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: de
  text: Pilatus aber wunderte sich, ob er schon tot sei. Er rief den Zenturio zu sich und fragte ihn, ob Jesus schon vor einiger Zeit gestorben sei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: wunderte sich
  rationale: Das Verb bezeichnet hier Pilatus’ Verwunderung über den unerwartet schnellen Tod Jesu; „wunderte sich“ ist natürliches, modernes Deutsch.
- source_word: εἰ ἤδη τέθνηκεν
  choice: dass er schon tot sein sollte
  rationale: εἰ leitet inhaltlich eine indirekte Frage ein, während der deutsche Ausdruck nach „sich wundern“ die gemeldete, von Pilatus zunächst nicht ohne Weiteres angenommene Tatsache idiomatisch wiedergibt. Das Perfekt τέθνηκεν hebt den Zustand des Totseins hervor.
- source_word: προσκαλεσάμενος
  choice: ließ … rufen
  rationale: Die mediale Partizipform bezeichnet, dass Pilatus den Hauptmann zu sich rufen ließ; diese deutsche Formulierung ist natürlich und bewahrt die zeitliche Abfolge.
- source_word: κεντυρίωνα
  choice: Hauptmann
  rationale: „Hauptmann“ ist die im deutschen Bibelstil geläufige, verständliche Bezeichnung für den römischen Zenturio; der historische Rang bleibt aus dem Zusammenhang hinreichend erkennbar.
- source_word: ἐπηρώτησεν
  choice: fragte ihn
  rationale: Die schlichte Formulierung entspricht dem erzählerischen Gebrauch des Verbs und klingt im modernen Deutschen natürlich.
- source_word: εἰ πάλαι ἀπέθανεν
  choice: ob Jesus bereits seit einiger Zeit tot sei
  rationale: πάλαι fragt hier nach einem schon bestehenden zeitlichen Abstand zum Tod, nicht nach einem absolut weit zurückliegenden Ereignis. Die Formulierung gibt zugleich das Sterben (ἀπέθανεν) und dessen zeitliche Einordnung idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit flüssiger Erzählweise. Im zweiten Satz wird „Jesus“ eingesetzt, um die beiden männlichen Bezugspersonen Pilatus und Hauptmann eindeutig vom Gegenstand der Frage zu unterscheiden.
