  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: de
  text: Der Mann namens Barabbas war zusammen mit den Aufständischen gefesselt, die bei dem Aufstand einen Mord begangen hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusammen mit den Aufrührern, die bei dem Aufruhr einen Mord begangen hatten“. Im Griechischen sind die Bezeichnungen für die Beteiligten und das Ereignis sprachlich miteinander verwandt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: war
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort, das im Deutschen nicht eigens wiedergegeben werden muss; ἦν bezeichnet den bestehenden Zustand.
- source_word: ὁ λεγόμενος Βαραββᾶς
  choice: der sogenannte Barabbas
  rationale: Die substantivierte Partizipialfügung bezeichnet den Mann, der Barabbas genannt wurde. „Sogenannte“ ist knapp und idiomatisch, ohne hier zwingend Zweifel an seinem Namen auszudrücken.
- source_word: μετὰ τῶν στασιαστῶν
  choice: zusammen mit den Aufständischen
  rationale: στασιασταί bezeichnet Beteiligte an einem Aufstand. „Aufständische“ ist präzise, modern und bewahrt den Wortstammbezug zu στάσις.
- source_word: δεδεμένος
  choice: gefesselt
  rationale: Das Perfektpartizip von δέω beschreibt den fortdauernden Zustand des Gebundenseins; „gefesselt“ bleibt näher am griechischen Ausdruck als das allgemeinere „inhaftiert“.
- source_word: οἵτινες
  choice: die
  rationale: Das Relativpronomen leitet eine charakterisierende Aussage über die Aufständischen ein und wird natürlich mit „die“ wiedergegeben.
- source_word: ἐν τῇ στάσει
  choice: bei dem Aufstand
  rationale: στάσις bezeichnet hier einen politischen Aufruhr beziehungsweise Aufstand. „Bei“ lässt offen, ob die Tat während oder im Zusammenhang mit diesem Aufstand geschah.
- source_word: φόνον πεποιήκεισαν
  choice: einen Mord begangen hatten
  rationale: Die Form bezeichnet eine vorzeitig abgeschlossene Tat. Der Singular φόνον wird mit „einen Mord“ wiedergegeben, ohne Zahl oder Identität der Opfer näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Aufständische/Aufstand“ bildet die verwandten griechischen Wörter στασιασταί/στάσις bewusst ab. Der Fußnotenmarker steht im Haupttext.
