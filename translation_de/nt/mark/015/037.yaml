id: MRK.15.37
reference: Mark 15:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀφεὶς φωνὴν μεγάλην ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: de
  text: Jesus aber stieß einen lauten Schrei[a] aus und atmete zum letzten Mal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ einen lauten Ruf erschallen“; wörtlicher auch: „eine laute Stimme“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „starb“; wörtlich: „atmete aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ ist ein schwaches Bindewort. „Aber“ bewahrt hier die erzählerische Wendung beziehungsweise den Kontrast und fügt sich in der Stellung „Jesus aber“ natürlich ins Deutsche ein.
- source_word: ἀφεὶς
  choice: stieß … aus
  rationale: Das Partizip von ἀφίημι bezeichnet zusammen mit φωνή idiomatisch das Hervorbringen eines Lautes. Die finite Koordination ist im modernen Deutschen natürlicher als eine partizipiale Konstruktion.
- source_word: φωνὴν μεγάλην
  choice: einen lauten Schrei
  rationale: φωνή kann „Stimme“, „Laut“ oder „Schrei“ bedeuten; mit ἀφεὶς bezeichnet es hier am ehesten einen kraftvollen Schrei. μεγάλην gibt in diesem Zusammenhang dessen Lautstärke beziehungsweise Stärke an.
- source_word: ἐξέπνευσεν
  choice: atmete zum letzten Mal
  rationale: ἐκπνέω bedeutet wörtlich „ausatmen“ und idiomatisch „sterben“. Die Formulierung bewahrt das Atembild und macht zugleich in natürlichem Deutsch deutlich, dass Jesus starb.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jesus aber
  rationale: Der griechische Artikel vor dem Eigennamen wird im Deutschen nicht eigens wiedergegeben; die Nachstellung von „aber“ ist idiomatisch und würdevoll.
theological_decisions:
- issue: Jesu Tod wiedergeben, ohne zusätzliche theologische Deutung einzutragen
  choice: atmete zum letzten Mal
  alternative: starb; hauchte sein Leben aus
  rationale: Die gewählte Fassung gibt den Tod Jesu klar wieder und erhält zugleich das Atembild des griechischen Verbs. „Hauchte sein Leben aus“ würde das im Text nicht ausdrücklich genannte „Leben“ ergänzen; eine Formulierung wie „gab seinen Geist auf“ könnte an den abweichenden Wortlaut anderer Evangelien angleichen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Stieß einen lauten Schrei aus“ ist kräftig, ohne pathetisch zu wirken; „atmete zum letzten Mal“ bewahrt das konkrete Bild des griechischen Verbs ohne Harmonisierung mit anderen Passionsberichten.
