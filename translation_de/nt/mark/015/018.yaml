  text: καὶ ἤρξαντο ἀσπάζεσθαι αὐτόν· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/018.yaml
  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: de
  text: 'Und sie begannen, ihn zu grüßen[a]: »Sei gegrüßt, König der Juden[b]!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn zu begrüßen«. Das griechische Verb kann einen gewöhnlichen Gruß bezeichnen; die förmliche Anrede steht hier im Kontext der Verspottung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »König der Judäer«. Der griechische Ausdruck kann sowohl Juden als auch Judäer bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss bewahrt den parataktischen Erzählstil des Markus.
- source_word: ἤρξαντο
  choice: sie begannen
  rationale: Die Verbindung von ἄρχομαι mit dem Infinitiv bezeichnet den Beginn der Handlung und wird im Deutschen natürlich mit »begannen« wiedergegeben.
- source_word: ἀσπάζεσθαι
  choice: spöttisch zu begrüßen
  rationale: Das Verb bedeutet gewöhnlich »grüßen«; der unmittelbare Kontext macht den Gruß zu einer inszenierten Verspottung. »Spöttisch« gibt diese pragmatische Funktion knapp wieder, ohne die Art des Grußes zu überbestimmen.
- source_word: Χαῖρε
  choice: Sei gegrüßt
  rationale: Die Grußformel hat hier den Klang einer förmlichen, höhnischen Königsakklamation. »Sei gegrüßt« ist im Deutschen würdig und verständlich; das wörtliche »Freue dich« wäre idiomatisch irreführend.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: König der Juden
  rationale: Der Vokativ wird als direkte Anrede wiedergegeben. Ἰουδαῖοι kann Juden oder Judäer bezeichnen; im Passionstitel ist »König der Juden« die etablierte und kontextuell naheliegende Wiedergabe.
theological_decisions:
- issue: Die ironische Königsakklamation Jesu
  choice: Die direkte Rede als förmlichen Spottgruß wiedergeben
  alternative: »Freue dich, König der Juden!« oder neutral »Guten Tag, König der Juden!«
  rationale: Die Soldaten führen Jesu Königsanspruch spöttisch vor. Die Übersetzung erhält sowohl die königliche Förmlichkeit als auch die Ironie, ohne eine weitergehende theologische Deutung einzutragen.
- issue: Bedeutungsumfang von Ἰουδαίων
  choice: »der Juden« im Haupttext
  alternative: »der Judäer«
  rationale: Beide Bedeutungen sind sprachlich möglich. Im römischen Passionstitel ist »König der Juden« die geläufige und sachlich passende Lesart; die geografisch-ethnische Alternative bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die leicht gehobene Formel »Sei gegrüßt« bewahrt den förmlichen Charakter der spöttischen Akklamation; die erläuternde Angabe »spöttisch« macht die im Kontext klare Funktion für heutige Leser unmittelbar erkennbar.
