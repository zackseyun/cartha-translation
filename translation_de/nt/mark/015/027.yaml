  text: καὶ σὺν αὐτῷ σταυροῦσιν δύο λῃστάς, ἕνα ἐκ δεξιῶν καὶ ἕνα ἐξ εὐωνύμων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: de
  text: Und zusammen mit ihm kreuzigen sie zwei Räuber[a], einen zu seiner Rechten und einen zu seiner Linken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Banditen«; möglicherweise »Aufständische«, falls der Ausdruck politisch gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: zusammen mit ihm
  rationale: σύν mit dem Dativ bezeichnet Begleitung beziehungsweise Gemeinschaft; „zusammen mit ihm“ gibt die Verbindung klar und natürlich wieder.
- source_word: σταυροῦσιν
  choice: kreuzigen sie
  rationale: Das historische Präsens des griechischen Erzählstils wird im Deutschen als Präsens bewahrt und erhält so die anschauliche Unmittelbarkeit des Markustextes.
- source_word: δύο λῃστάς
  choice: zwei Räuber
  rationale: λῃστής kann Räuber, Bandit oder Wegelagerer bezeichnen und je nach Kontext auch politische Untertöne tragen. „Räuber“ ist die verständliche, hinreichend breite Wiedergabe; mögliche Alternativen werden in der Fußnote offengehalten.
- source_word: ἕνα ἐκ δεξιῶν
  choice: einen zu seiner Rechten
  rationale: Die Wendung bezeichnet die räumliche Position auf Jesu rechter Seite. Die deutsche Formulierung ist idiomatisch und würdevoll.
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: einen zu seiner Linken
  rationale: εὐώνυμος bezeichnet hier euphemistisch die linke Seite. Das Pronomen αὐτοῦ wird im Deutschen in beiden parallelen Satzgliedern ausdrücklich aufgenommen.
theological_decisions:
- issue: Bedeutung von λῃσταί im Kreuzigungsbericht
  choice: Räuber
  alternative: Banditen; möglicherweise Aufständische
  rationale: Der Ausdruck kann gewalttätige Räuber oder Banditen bezeichnen und in bestimmten Zusammenhängen mit Aufruhr verbunden sein. Dieser Vers allein legt die politisch spezifischere Bedeutung „Aufständische“ jedoch nicht fest; die begriffliche Offenheit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens und die parallele Satzstruktur des griechischen Textes werden bewahrt.
