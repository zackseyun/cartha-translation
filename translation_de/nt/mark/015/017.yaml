  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: de
  text: Und sie kleiden ihn in Purpur[a] und setzen ihm, nachdem sie eine Krone aus Dornen geflochten haben, diese auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sie bekleiden ihn mit Purpur«. Im Griechischen steht hier nicht ausdrücklich »Mantel«; der Zusammenhang weist jedoch auf ein Kleidungsstück hin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: sie kleiden ihn in
  rationale: Das Verb bezeichnet das Bekleiden einer Person. »Jemanden in etwas kleiden« gibt den Vorgang im Deutschen natürlich und nah am griechischen Ausdruck wieder.
- source_word: πορφύραν
  choice: Purpur
  rationale: Das Substantiv kann Purpurstoff oder ein purpurfarbenes Kleidungsstück bezeichnen. »Purpur« vermeidet es, das im Vers nicht ausdrücklich genannte Wort »Mantel« einzufügen, lässt im Zusammenhang aber ein Kleidungsstück erkennen.
- source_word: περιτιθέασιν
  choice: setzen sie ihm auf
  rationale: Das Verb bedeutet, etwas um jemanden zu legen oder auf jemanden zu setzen. Bei einer Krone ist »aufsetzen« die natürliche deutsche Wiedergabe; der Bezug auf den Kopf ergibt sich aus dem Gegenstand.
- source_word: πλέξαντες
  choice: dann flechten sie
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Aufsetzen vorausgeht. Die koordinierte Form mit »dann« macht diese Abfolge in natürlichem Deutsch deutlich, ohne den Sinn zu erweitern.
- source_word: ἀκάνθινον
  choice: aus Dornen
  rationale: Das Adjektiv bezeichnet etwas, das aus Dornen besteht. »Aus Dornen« ist idiomatisch und bewahrt die konkrete Materialangabe.
- source_word: στέφανον
  choice: Krone
  rationale: στέφανος kann einen Kranz bezeichnen; im Zusammenhang der verspotteten Königswürde vermittelt »Krone« jedoch die beabsichtigte königliche Bildsprache am klarsten.
theological_decisions:
- issue: Königliche Spottinszenierung bei Jesu Erniedrigung
  choice: Für στέφανος steht »Krone«.
  alternative: Kranz
  rationale: Purpur und die aus Dornen gefertigte Kopfbedeckung inszenieren spöttisch ein Königtum. »Krone« erhält diese erzählerische Ironie, ohne eine über den Text hinausgehende Deutung einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens des griechischen Textes bleibt erhalten. Die Formulierung »in Purpur« wahrt die lexikalische Offenheit zwischen Stoff und Kleidungsstück.
