id: MRK.15.20
reference: Mark 15:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: de
  text: Nachdem sie ihn verspottet hatten, zogen sie ihm das Purpurgewand[a] aus und seine eigenen Kleider wieder an. Dann führten sie ihn hinaus, um ihn zu kreuzigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „den Purpur“; gemeint ist das purpurfarbene Kleidungsstück, das man Jesus angezogen hatte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: verspottet hatten
  rationale: Das Verb bezeichnet höhnische, herabsetzende Behandlung. Das Plusquamperfekt gibt im deutschen Erzählzusammenhang die vorzeitige Handlung des mit ὅτε eingeleiteten Nebensatzes natürlich wieder.
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: zogen sie ihm das Purpurgewand aus
  rationale: ἐκδύω bezeichnet hier das Ausziehen eines Kleidungsstücks. Bei πορφύρα steht wörtlich nur die Farbbezeichnung „Purpur“; aus dem Zusammenhang ist ein Kleidungsstück gemeint.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: seine eigenen Kleider wieder an
  rationale: „Kleider“ ist die natürliche moderne Wiedergabe von ἱμάτια, und „eigenen“ bewahrt τὰ ἴδια. „Wieder“ verdeutlicht ohne inhaltlichen Zusatz, dass Jesus nach dem Ablegen des Spottgewands erneut seine persönlichen Kleider angezogen wurden.
- source_word: ἐξάγουσιν
  choice: führten sie ihn hinaus
  rationale: Der griechische historische Präsens verlebendigt die Erzählung; im modernen deutschen Erzählstil ist hier das Präteritum natürlicher und hält die Zeitfolge klar.
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: um ihn zu kreuzigen
  rationale: Die Infinitivgruppe gibt den von ἵνα mit Konjunktiv ausgedrückten Zweck idiomatisch und präzise wieder.
theological_decisions:
- issue: Darstellung der Erniedrigung Jesu vor der Kreuzigung
  choice: Die Handlungen werden nüchtern als Verspottung, Ablegen des Spottgewands, erneutes Anlegen seiner eigenen Kleider und Hinausführen zur Kreuzigung wiedergegeben.
  alternative: Die königliche Symbolik des Purpurs oder die Bedeutung des Hinausführens ausdrücklich theologisch deuten.
  rationale: Der Vers berichtet die Vorgänge unmittelbar. Die Übersetzung bewahrt die erkennbare Erniedrigung, ohne eine über den Wortlaut hinausgehende theologische Auslegung einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. „Purpurgewand“ erhält den historischen und königlichen Beiklang; „Kleider“ bleibt alltagssprachlich verständlich. Das Präteritum bei „führten“ entspricht natürlicher deutscher Erzählweise.
