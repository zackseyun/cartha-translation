  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: de
  text: Als die sechste Stunde gekommen war,[a] kam über das ganze Land Finsternis bis zur neunten Stunde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: etwa um zwölf Uhr mittags.'
    reason: cultural_note
  - marker: b
    text: Die neunte Stunde entspricht etwa drei Uhr nachmittags. „Das ganze Land“ kann auch mit „die ganze Erde“ übersetzt werden; das griechische Wort kann beides bedeuten.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: als die sechste Stunde gekommen war
  rationale: Der Genitivus absolutus wird natürlich als temporaler Nebensatz wiedergegeben. Die antike Stundenangabe bleibt im Haupttext erhalten.
- source_word: σκότος
  choice: Finsternis
  rationale: Das Wort bezeichnet Dunkelheit; „Finsternis“ ist in diesem feierlichen Erzählzusammenhang klar und würdevoll.
- source_word: ἐγένετο
  choice: kam
  rationale: „Kam über“ gibt den ereignishaften Ausdruck natürlich wieder, ohne zusätzliche Deutung einzutragen.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: über das ganze Land
  rationale: γῆ kann sowohl „Land“ als auch „Erde“ bedeuten. „Land“ vermeidet eine vorschnelle Festlegung auf weltweite Ausdehnung; die andere Möglichkeit wird in einer Fußnote bewahrt.
- source_word: ἕως ὥρας ἐνάτης
  choice: bis zur neunten Stunde
  rationale: Die ursprüngliche Zeitangabe wird parallel zur „sechsten Stunde“ beibehalten und in einer Fußnote für heutige Leser erläutert.
theological_decisions:
- issue: Reichweite der Finsternis bei γῆ
  choice: das ganze Land
  alternative: die ganze Erde
  rationale: Der griechische Ausdruck lässt beide Bedeutungen zu. Der Haupttext entscheidet nicht zugunsten einer ausdrücklich globalen Deutung; die echte lexikalische Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die antiken Stundenangaben bleiben im Haupttext stehen; moderne Entsprechungen und die Mehrdeutigkeit von γῆ werden in den Fußnoten erklärt.
