  text: καὶ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη εἰς δύο ἀπ’ ἄνωθεν ἕως κάτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: de
  text: Und der Vorhang des Tempels[a] wurde von oben bis unten in zwei Teile zerrissen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vorhang des Tempelheiligtums“. Das griechische Wort kann genauer das eigentliche Tempelheiligtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: Vorhang
  rationale: Bezeichnet einen hängenden Vorhang im Tempel; „Vorhang“ ist im modernen Deutschen klar und anschaulich, ohne eine Deutung einzutragen.
- source_word: ναοῦ
  choice: Tempelheiligtum
  rationale: ναός bezeichnet hier genauer das eigentliche Heiligtum und nicht den gesamten Tempelbezirk. „Tempelheiligtum“ wahrt diese Präzision und bleibt allgemein verständlich.
- source_word: ἐσχίσθη
  choice: zerriss
  rationale: Der Aorist Passiv von σχίζω beschreibt, dass der Vorhang zerrissen wurde. Das deutsche intransitive „zerriss“ gibt das Geschehen natürlich wieder, ohne einen Handelnden ausdrücklich zu benennen.
- source_word: εἰς δύο
  choice: in zwei Teile
  rationale: Die Wendung bezeichnet die Teilung in zwei; „in zwei Teile“ ist im Deutschen eindeutig und idiomatisch.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: von oben bis unten
  rationale: Bewahrt Richtung und Ausdehnung des Zerreißens in natürlichem Deutsch.
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Erzählung fort, ohne eine zusätzliche zeitliche oder folgernde Nuance einzutragen.
theological_decisions:
- issue: Deutung des zerreißenden Tempelvorhangs
  choice: Das Ereignis wird ohne symbolische Erklärung wiedergegeben.
  alternative: Das Zerreißen ausdrücklich als Zugang zu Gott oder als Gericht über den Tempel deuten.
  rationale: Der Vers berichtet das Geschehen, erklärt aber seine theologische Bedeutung nicht. Die Übersetzung bewahrt diese Offenheit.
- issue: Unausgedrückter Handelnder beim Passiv ἐσχίσθη
  choice: „zerriss“ ohne ausdrückliches Subjekt oder Agens
  alternative: „wurde von Gott zerrissen“
  rationale: Der griechische Text nennt keinen Handelnden. Eine ausdrückliche Zuschreibung an Gott wäre interpretierend, auch wenn ein göttliches Passiv erwogen werden kann.
translation_notes:
  register: Modernes, würdevolles Erzählungsdeutsch. „Tempelheiligtum“ ist präziser als das allgemeinere „Tempel“, während die Fußnote die vertraute Alternative dokumentiert.
