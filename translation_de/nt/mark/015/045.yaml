  text: καὶ γνοὺς ἀπὸ τοῦ κεντυρίωνος ἐδωρήσατο τὸ ⸀πτῶμα τῷ Ἰωσήφ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/045.yaml
  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: de
  text: Und nachdem er vom Hauptmann erfahren hatte, überließ er Josef den Leichnam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: nachdem er es … erfahren hatte
  rationale: Das Aoristpartizip ist hier temporal bzw. begleitend zu verstehen und bezeichnet die vorausgehende Auskunft, die Pilatus vom Hauptmann erhielt. Das im Deutschen nötige „es“ nimmt den aus dem Kontext erschließbaren Sachverhalt auf, ohne einen ausdrücklich genannten griechischen Gegenstand vorzutäuschen.
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: von dem Hauptmann
  rationale: ἀπό mit Genitiv kennzeichnet die Quelle der Auskunft. „Hauptmann“ ist die geläufige deutsche Bezeichnung für den römischen Zenturio und passt zum bisherigen erzählerischen Kontext.
- source_word: ἐδωρήσατο
  choice: überließ
  rationale: Das Medium von δωρέομαι bezeichnet ein Gewähren bzw. Überlassen als Gunst. „Überließ“ gibt im Kontext die amtliche Freigabe des Leichnams natürlich wieder.
- source_word: πτῶμα
  choice: Leichnam
  rationale: πτῶμα bezeichnet ausdrücklich einen toten Körper. „Leichnam“ bewahrt diese Bedeutung in würdigem, erzählerisch angemessenem Deutsch.
- source_word: τῷ Ἰωσήφ
  choice: Josef
  rationale: Der Dativ bezeichnet den Empfänger; bei „überlassen“ wird er im Deutschen ebenfalls als Dativ ohne Präposition ausgedrückt.
theological_decisions: []
