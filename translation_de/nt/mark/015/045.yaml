  source_fidelity: Der zeitliche Anschluss von γνούς und die Quelle ἀπὸ τοῦ κεντυρίωνος sind zutreffend wiedergegeben. Das unbestimmte „es“ setzt jedoch im Deutschen einen Gegenstand ein, den der griechische Text in diesem Vers nicht nennt; der aus dem Kontext erschließbare Inhalt sollte nicht als eigenes Pronomen im Zieltext erscheinen. „Leichnam“ gibt πτῶμα präzise wieder.
