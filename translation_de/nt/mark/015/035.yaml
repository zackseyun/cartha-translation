id: MRK.15.35
reference: Mark 15:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: de
  text: 'Und einige von denen, die dabeistanden, hörten es und sagten: »Seht, er ruft Elija[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »er ruft nach Elija«.'
    reason: 'Lexikalische Alternative: φωνεῖ mit dem Namen als Objekt kann im Zusammenhang als Rufen nach Elija verstanden werden.'
lexical_decisions:
- source_word: καί
  choice: Und
  rationale: Der gewöhnliche Anschluss führt die Reaktion unmittelbar an den vorausgehenden Schrei Jesu an, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: τινες τῶν παρεστηκότων
  choice: einige von denen, die dabeistanden
  rationale: Die Formulierung bezeichnet einen unbestimmten Teil der am Ort stehenden Personen und bewahrt den konkreten räumlichen Sinn des Partizips.
- source_word: ἀκούσαντες
  choice: hörten es
  rationale: Das vorzeitige Partizip wird im Deutschen natürlich als koordinierte Handlung wiedergegeben. Das ergänzte »es« verweist aus dem Zusammenhang auf Jesu vorausgehenden Ruf.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Imperfekt stellt ihre Äußerung als Vorgang in der Szene dar. Das schlichte deutsche Präteritum ist hier idiomatisch; eine Wiedergabe wie »sagten immer wieder« würde Wiederholung stärker festlegen, als der Kontext verlangt.
- source_word: Ἴδε
  choice: Seht
  rationale: Der aufmerksamkeitslenkende Ausruf wird in gegenwärtigem, verständlichem Deutsch wiedergegeben. Obwohl die griechische Form formal Singular ist, ist »Seht« als an die Umstehenden gerichteter Ausruf im Deutschen natürlich.
- source_word: Ἠλίαν
  choice: Elija
  rationale: Dies ist die im modernen Deutschen übliche biblische Namensform.
- source_word: φωνεῖ
  choice: ruft
  rationale: Das Verb kann hier mit direktem Objekt bedeuten, dass Jesus Elija ruft; die deutsche Form bewahrt diese knappe Aussage, ohne bereits ausdrücklich ein Hilfegesuch daraus zu machen.
theological_decisions:
- issue: Ob ausdrücklich erklärt werden soll, dass die Umstehenden Jesu Schrei als Anrufung Elijas missverstanden
  choice: 'Die direkte Äußerung bleibt ohne erklärenden Zusatz stehen: »er ruft Elija«.'
  alternative: »Sie meinten, er rufe Elija« oder »er ruft nach Elija«
  rationale: Der griechische Text berichtet die Worte der Umstehenden, erläutert ihr Missverständnis aber nicht ausdrücklich. Der Zusammenhang lässt es erkennen; eine Erklärung im Haupttext würde über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Erzählfluss, ist aber ohne partizipiale Schwerfälligkeit formuliert. Der Fußnotenmarker steht unmittelbar bei der betroffenen Wendung.
