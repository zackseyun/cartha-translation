id: MRK.15.2
reference: Mark 15:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: de
  text: 'Und Pilatus fragte ihn: „Bist du der König der Juden?“ Er antwortete ihm: „Du sagst es.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Du sagst.“ Auch möglich: „Das sagst du.“ Jesu knappe Antwort lässt bewusst offen, in welchem Sinn er den von Pilatus genannten Titel gelten lässt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Das Verb bezeichnet hier eine Frage beziehungsweise Befragung. „Fragte“ ist natürlich und überzeichnet die Szene nicht als förmliches Verhör.
- source_word: Σὺ εἶ
  choice: Bist du
  rationale: Die Formulierung steht als direkte Frage; das ausdrücklich gesetzte Pronomen verleiht dem angesprochenen „du“ Nachdruck, der im Deutschen durch die Wortstellung hinreichend erkennbar bleibt.
- source_word: βασιλεὺς
  choice: König
  rationale: „König“ bewahrt sowohl den königlichen Anspruch als auch die politische Tragweite der vor Pilatus erhobenen Anklage.
- source_word: Ἰουδαίων
  choice: der Juden
  rationale: In diesem Zusammenhang ist „König der Juden“ die etablierte politische Titulierung. „Der Judäer“ wäre lexikalisch möglich, klingt hier jedoch weniger idiomatisch und könnte den feststehenden Anklagewortlaut verdecken.
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: Er antwortete ihm
  rationale: Die griechische Verbindung aus Partizip und historischem Präsens wird in natürliches deutsches Erzähltempus übertragen, ohne die Aussage zu erweitern.
- source_word: Σὺ λέγεις
  choice: Du sagst es
  rationale: Die knappe Wendung bleibt indirekt und legt Jesus weder ein ausdrückliches „Ja“ noch eine Verneinung in den Mund.
theological_decisions:
- issue: Aussagekraft von Jesu Antwort Σὺ λέγεις
  choice: „Du sagst es“ als zurückhaltende, mehrdeutige Erwiderung
  alternative: „Ja, so ist es“ als eindeutige Bestätigung oder wörtlicher „Du sagst“
  rationale: 'Im Griechischen steht kein ausdrückliches „Ja“. Die Übersetzung soll die Spannung bewahren: Jesus weist die Bezeichnung nicht einfach zurück, formuliert sie aber auch nicht selbst als uneingeschränkte Bestätigung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die politische Formel „König der Juden“ bleibt erhalten. Das historische Präsens λέγει wird zugunsten eines natürlichen deutschen Erzählflusses als Präteritum wiedergegeben; die Mehrdeutigkeit der Schlussantwort wird nicht aufgelöst.
