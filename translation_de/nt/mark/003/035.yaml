id: MRK.3.35
reference: Mark 3:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: de
  text: Denn wer den Willen Gottes tut, der[a] ist mein Bruder und meine Schwester und meine Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dieser“. Das griechische Demonstrativpronomen hebt die betreffende Person hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν ποιήσῃ
  choice: Denn wer … tut
  rationale: Die Verbindung aus Relativpronomen, ἄν und Aorist Konjunktiv bezeichnet einen unbestimmten allgemeinen Fall. „Wer … tut“ gibt dies im Deutschen natürlich und zeitlos wieder; „denn“ bewahrt zugleich die begründende Funktion von γάρ.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: den Willen Gottes
  rationale: Die Formulierung folgt der griechischen Genitivverbindung eng und ist im modernen Standarddeutsch klar und geläufig.
- source_word: οὗτος
  choice: der
  rationale: Im deutschen Korrelativsatz „wer …, der …“ nimmt „der“ die zuvor genannte Person betont wieder auf. Es klingt natürlicher als das wörtlichere „dieser“ und legt die gemeinte Person trotz seines grammatischen Genus nicht auf männliches Geschlecht fest.
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: mein Bruder und meine Schwester und meine Mutter
  rationale: Die drei konkreten Verwandtschaftsbezeichnungen und die wiederholten Verknüpfungen bleiben erhalten. Das Possessivpronomen wird im Deutschen bei jedem Substantiv ergänzt, damit die Aufzählung eindeutig und natürlich ist.
- source_word: ἐστίν
  choice: ist
  rationale: Die einfache Kopula wird direkt wiedergegeben und stimmt mit dem singularischen Bezug „wer … der“ überein.
theological_decisions:
- issue: Geschlechtliche Reichweite des singularischen Subjekts
  choice: wer … der
  alternative: wer … ist; dieser ist
  rationale: Das griechische Subjekt steht grammatisch im maskulinen Singular, doch die Aussage gilt unbestimmt jedem Menschen und nennt ausdrücklich männliche wie weibliche Familienrollen. Die deutsche Korrelativform bewahrt den Singular und die rückverweisende Hervorhebung, ohne die Aussage inhaltlich auf Männer zu beschränken.
- issue: Bildhafte Neudefinition von Jesu Familie
  choice: Bruder, Schwester und Mutter als einzelne Verwandtschaftsbegriffe beibehalten
  alternative: Familienangehöriger
  rationale: 'Die konkreten Begriffe tragen die rhetorische und theologische Spannung der Aussage: Zugehörigkeit zu Jesus wird anhand des Tuns von Gottes Willen beschrieben. Eine Verallgemeinerung würde diese Wirkung abschwächen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die bekannte biblische Wendung „den Willen Gottes tun“ bleibt erhalten; die korrelative Form „wer …, der …“ gibt den griechischen Nachdruck idiomatisch wieder.
