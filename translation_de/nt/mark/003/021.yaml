  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: de
  text: 'Als die Seinen davon hörten[a], brachen sie auf, um ihn festzuhalten; denn sie sagten: „Er ist außer sich.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Familie“, „seine Angehörigen“ oder „seine Leute“. Die griechische Wendung ist idiomatisch und kann Menschen aus Jesu Haushalt oder engem Kreis bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Er hat den Verstand verloren“ oder „Er ist nicht bei Sinnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: die Menschen aus seinem engsten Umfeld
  rationale: Die idiomatische Wendung bezeichnet Menschen, die zu Jesus gehören oder ihm nahestehen, wahrscheinlich seine Familie oder sein enger Kreis. Die gewählte Formulierung bleibt im Deutschen natürlich, ohne die im Griechischen nicht ausdrücklich genannte Verwandtschaft festzulegen.
- source_word: ἀκούσαντες
  choice: als ... davon hörten
  rationale: Das Aoristpartizip wird als temporaler Nebensatz wiedergegeben. Das ergänzte „davon“ ist im Deutschen idiomatisch und verweist auf die vorausgehende berichtete Situation.
- source_word: ἐξῆλθον
  choice: machten sie sich auf den Weg
  rationale: Im Zusammenhang beschreibt das Verb wahrscheinlich das Aufbrechen zu Jesus. „Machten sich auf den Weg“ ist natürlicher als das kontextlos missverständliche „gingen hinaus“, ohne das Ziel näher festzulegen.
- source_word: κρατῆσαι
  choice: um ihn festzuhalten
  rationale: κρατέω bezeichnet hier ein kräftiges Ergreifen beziehungsweise Festhalten. Die Wiedergabe bewahrt den körperlich-eingreifenden Sinn, ohne einen rechtlichen Vorgang wie eine Festnahme zu unterstellen.
- source_word: ἔλεγον
  choice: sie sagten
  rationale: Das Imperfekt kann andauerndes oder wiederholtes Reden anzeigen. Im Deutschen trägt das Präteritum den Erzählfluss natürlicher; der Kontext lässt offen, ob die Aussage mehrfach wiederholt wurde.
- source_word: ἐξέστη
  choice: Er ist außer sich
  rationale: Die Wendung gibt den Vorwurf wieder, Jesus sei nicht bei sich beziehungsweise habe die Kontrolle über sich verloren. Sie bewahrt etwas von der Bildhaftigkeit des griechischen Verbs und vermeidet die stärker diagnostische Aussage „Er ist verrückt“.
theological_decisions:
- issue: Identität von οἱ παρ’ αὐτοῦ
  choice: die Menschen aus seinem engsten Umfeld
  alternative: seine Familie; seine Angehörigen; seine Leute
  rationale: Der nähere Kontext legt Jesu Familie nahe, doch die griechische Wendung nennt kein ausdrückliches Verwandtschaftsverhältnis. Der Haupttext bewahrt diese Offenheit; die wahrscheinlichere spezifische Deutung wird in der Fußnote genannt.
- issue: Bedeutung des Urteils ἐξέστη
  choice: Er ist außer sich
  alternative: Er hat den Verstand verloren; Er ist nicht bei Sinnen
  rationale: Die Aussage bleibt als Urteil der Sprechenden kenntlich und wird nicht in eine moderne medizinische Diagnose überführt. Die gewählte Form lässt sowohl vorübergehenden Kontrollverlust als auch den Vorwurf geistiger Verwirrung anklingen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Engstes Umfeld“ bewahrt die Mehrdeutigkeit der Personengruppe; „festhalten“ vermeidet eine unbelegte rechtliche Deutung. Die Satzstruktur bleibt erzählerisch klar und gut vorlesbar.
