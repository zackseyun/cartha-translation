source:
  edition: SBLGNT
  text: καὶ ἐὰν οἰκία ἐφ’ ἑαυτὴν μερισθῇ, οὐ ⸀δυνήσεται ⸂ἡ οἰκία ἐκείνη σταθῆναι⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/025.yaml
  text: And if a house is divided against itself[a], that house will not be able to stand.
translation:
  language: de
  text: Und wenn ein Haus in sich gespalten ist[a], wird jenes Haus nicht bestehen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Hausgemeinschaft, die gegen sich selbst entzweit ist“. Das griechische Wort οἰκία kann sowohl ein Haus als Gebäude als auch die darin lebende Hausgemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: Haus
  rationale: „Haus“ bewahrt das konkrete Bild und passt natürlich zu σταθῆναι („bestehen“); zugleich kann οἰκία auch die Hausgemeinschaft bezeichnen, was in einer Fußnote vermerkt wird.
- source_word: ἐφ’ ἑαυτὴν
  choice: in sich
  rationale: In Verbindung mit μερισθῇ bezeichnet die Wendung eine innere Spaltung beziehungsweise einen Konflikt innerhalb des Hauses. „In sich gespalten“ ist im Deutschen idiomatisch und erhält den reflexiven Sinn.
- source_word: μερισθῇ
  choice: gespalten ist
  rationale: Der Aorist Passiv Konjunktiv nach ἐὰν formuliert eine allgemeine Bedingung. „Gespalten ist“ gibt die passive Form und den Zustand innerer Zerrissenheit klar wieder.
- source_word: δυνήσεται
  choice: kann
  rationale: Das Futur von δύναμαι bezeichnet im Bedingungssatz die daraus folgende Unfähigkeit. Im natürlichen Deutschen drückt „kann … nicht“ dies knapper und ebenso präzise aus als „wird nicht … können“.
- source_word: σταθῆναι
  choice: bestehen
  rationale: Das Verb bedeutet hier, standzuhalten beziehungsweise intakt zu bleiben. „Bestehen“ bewahrt im Deutschen sowohl den bildhaften Bezug zum Haus als auch den übertragenen Sinn des Fortbestands.
- source_word: ἡ οἰκία ἐκείνη
  choice: jenes Haus
  rationale: „Jenes“ gibt den Nachdruck des Demonstrativpronomens ἐκείνη wieder und verweist ausdrücklich auf das zuvor genannte Haus.
- source_word: καὶ ἐὰν
  choice: Und wenn
  rationale: „Und“ erhält die argumentative Verbindung zum vorherigen Satz; „wenn“ führt die allgemeine Bedingung natürlich ein.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Formulierung „in sich gespalten“ ist allgemein verständlich; „bestehen“ erhält die Spannung zwischen dem konkreten Bild eines Hauses und dem übertragenen Gedanken einer Gemeinschaft, die keinen Bestand hat.
