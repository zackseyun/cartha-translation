  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: de
  text: Und Jesus zog sich mit seinen Jüngern an den See[a] zurück, und eine große Menschenmenge aus Galiläa folgte ihm, und aus Judäa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum See hin“. Die griechische Präposition kann eine Bewegung in Richtung des Sees bezeichnen.'
