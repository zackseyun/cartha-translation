translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste griechische Satzteil wird zur besseren deutschen Lesbarkeit als eigener Satz wiedergegeben. Die Aufzählung bleibt durch das Schlusskomma bewusst offen und führt in Vers 8 weiter.
