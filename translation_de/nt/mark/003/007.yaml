lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: zog sich … zurück
  rationale: Das Verb bezeichnet ein Sichzurückziehen oder Fortgehen und kann angesichts des vorausgehenden Widerstands den Unterton eines Ausweichens tragen. „Zog sich zurück“ bewahrt diese Nuance und klingt im Deutschen natürlich.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: mit seinen Jüngern
  rationale: „Jünger“ ist im Evangelienkontext die geläufige und sachlich passende Wiedergabe für Lernende und Anhänger Jesu.
- source_word: πρὸς τὴν θάλασσαν
  choice: an den See
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung zum Gewässer hin. Obwohl θάλασσα wörtlich „Meer“ bedeutet, heißt das betreffende Binnengewässer im natürlichen modernen Deutsch „See“; die Fußnote benennt es genauer.
- source_word: πολὺ πλῆθος
  choice: eine große Menschenmenge
  rationale: Die Wendung bezeichnet eine große Ansammlung von Menschen. „Große Menschenmenge“ ist klar, gegenwärtig und bewahrt die Betonung der Größe.
- source_word: ἠκολούθησεν
  choice: folgte ihm
  rationale: ἀκολουθέω bezeichnet hier zunächst das tatsächliche Hinterhergehen der Menge. Das im Deutschen für ein direktes Objekt nötige Pronomen „ihm“ macht den Bezug auf Jesus deutlich.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: aus Galiläa
  rationale: Direkte und idiomatische Wiedergabe der Herkunftsangabe.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: ebenso aus Judäa,
  rationale: Die zweite Herkunftsangabe gehört zu der über die Versgrenze hinaus fortgesetzten Aufzählung. „Ebenso“ verdeutlicht im Deutschen knapp, dass auch Menschen aus Judäa folgten; das abschließende Komma bewahrt den offenen Satzanschluss.
