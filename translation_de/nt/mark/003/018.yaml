  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: de
  text: und Andreas und Philippus und Bartholomäus und Matthäus und Thomas und Jakobus, den Sohn des Alphäus, und Thaddäus und Simon, den Zeloten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Griechisch Kananäer, wahrscheinlich eine gräzisierte Form eines aramäischen Wortes für »Zelot« bzw. »Eiferer«; vgl. Lukas 6,15. Gemeint ist wohl keine Herkunft aus Kanaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Das wiederholte »und« bewahrt den parataktischen Aufbau der griechischen Namensliste.
- source_word: Ἀνδρέαν
  choice: Andreas
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Φίλιππον
  choice: Philippus
  rationale: Die im Deutschen geläufige biblische Namensform.
- source_word: Βαρθολομαῖον
  choice: Bartholomäus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Μαθθαῖον
  choice: Matthäus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Θωμᾶν
  choice: Thomas
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: Jakobus, den Sohn des Alphäus
  rationale: Die Verbindung aus Artikel und Genitiv bezeichnet Jakobus durch seine Abstammung; »Sohn des Alphäus« macht diese Beziehung im Deutschen eindeutig.
- source_word: Θαδδαῖον
  choice: Thaddäus
  rationale: Die im Deutschen herkömmliche Form des Personennamens.
- source_word: Σίμωνα τὸν Καναναῖον
  choice: Simon, den Kananäer
  rationale: Die formnahe Wiedergabe bewahrt die markinische Bezeichnung, ohne ihre wahrscheinlich aramäische Bedeutung stillschweigend in den Haupttext einzutragen; die Fußnote erläutert sie.
theological_decisions:
- issue: Bedeutung des Beinamens Καναναῖος bei Simon
  choice: Kananäer
  alternative: der Eiferer (Zelot)
  rationale: Κανανaῖος geht wahrscheinlich auf ein aramäisches Wort für einen Eiferer zurück und entspricht dem ζηλωτής in Lukas 6,15. Da Markus jedoch die gräzisierte Form verwendet, bewahrt der Haupttext diese sprachliche Eigenart; die Fußnote verhindert das Missverständnis, Simon werde als Angehöriger Kanaans bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Konjunktionen bilden die bewusst reihende Struktur des griechischen Textes nach. Die Akkusativformen in den Appositionen berücksichtigen, dass Vers 18 die in den vorangehenden Versen begonnene Aufzählung fortsetzt.
