  text: Καὶ εἰσῆλθεν πάλιν ⸀εἰς συναγωγήν, καὶ ἦν ἐκεῖ ἄνθρωπος ἐξηραμμένην ἔχων τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/001.yaml
  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: de
  text: Und er ging wieder in eine Synagoge. Dort war ein Mann mit einer verdorrten Hand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit einer ausgetrockneten Hand“; auch: „mit einer geschrumpften Hand“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging … hinein / ging in
  rationale: Der Aorist von εἰσέρχομαι bezeichnet im Erzählzusammenhang schlicht das Hineingehen; mit der Richtungsangabe wird dies im Deutschen natürlich als „ging in eine Synagoge“ wiedergegeben.
- source_word: πάλιν
  choice: wieder
  rationale: πάλιν kennzeichnet eine wiederholte Handlung; „wieder“ ist im modernen deutschen Erzählstil direkt und idiomatisch.
- source_word: εἰς συναγωγήν
  choice: in eine Synagoge
  rationale: εἰς drückt bei einem Bewegungsverb die Richtung aus. Da συναγωγήν ohne Artikel steht, liegt „eine Synagoge“ nahe, ohne auszuschließen, dass im Kontext eine bestimmte Synagoge gemeint sein könnte.
- source_word: ἦν ἐκεῖ
  choice: Dort war
  rationale: Diese Formulierung gibt sowohl das Verb ἦν als auch das Ortsadverb ἐκεῖ knapp und natürlich wieder.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: ἄνθρωπος kann allgemein „Mensch“ bedeuten; für die hier eingeführte einzelne männliche Person ist „ein Mann“ die natürliche kontextuelle Wiedergabe.
- source_word: ἐξηραμμένην
  choice: verkümmert
  rationale: Das Perfektpartizip von ξηραίνω beschreibt einen anhaltenden Zustand des Verdorrt- oder Ausgetrocknetseins. Bei einer Hand bezeichnet „verkümmert“ im Deutschen verständlich eine bleibende körperliche Beeinträchtigung, ohne deren medizinische Ursache festzulegen.
- source_word: ἔχων τὴν χεῖρα
  choice: mit einer verkümmerten Hand
  rationale: Die partizipiale Konstruktion wird im Deutschen idiomatisch mit „mit“ wiedergegeben; der griechische Artikel wird dabei entsprechend deutschem Sprachgebrauch als unbestimmter Artikel ausgedrückt.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Der einleitende Anschluss mit „Und“ bleibt erhalten. Zwei deutsche Sätze vermeiden eine schwerfällige Reihung und geben καὶ ἦν ἐκεῖ natürlich wieder. Die mögliche Bestimmtheit von συναγωγήν wird nicht durch eine Fußnote überbetont, da der fehlende griechische Artikel nicht mechanisch Unbestimmtheit erzwingt, „eine Synagoge“ hier aber die formnahe und natürliche Hauptlesart ist.
