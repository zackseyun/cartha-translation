    issue: „verkümmert“ für ἐξηραμμένην
    rationale: „Verkümmert“ kann eine Unterentwicklung oder allgemein atrophische Schädigung bezeichnen. Das griechische Partizip von ξηραίνω bezeichnet dagegen wörtlich einen Zustand des Ausgetrocknet- bzw. Verdorrtseins. „Verdorrt“ bewahrt diese spezifische Bildsprache und die diagnostische Offenheit besser.
  - severity: low
    issue: Fußnote ist grammatisch uneinheitlich formuliert
    rationale: Die Wendung „auch ‚verdorrten‘ oder ‚geschrumpften Hand‘ ist möglich“ verbindet nicht sauber zitierte Alternativen und Prädikat. Eine knappe Alternativangabe ist klarer.
