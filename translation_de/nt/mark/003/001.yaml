  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Aussagen des griechischen Textes zutreffend wieder: Jesus geht erneut in eine Synagoge, und dort befindet sich ein Mann mit einer beeinträchtigten Hand. „In eine Synagoge“ gibt εἰς συναγωγήν angemessen wieder; die fehlende griechische Artikelform erzwingt keine Aussage über eine unbekannte Synagoge.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch. Die Aufteilung in zwei Sätze ist natürlich und beeinträchtigt die enge narrative Verknüpfung nicht. Die Formulierung „verkümmerte Hand“ ist jedoch weniger präzise als die Bildsprache des griechischen ἐξηραμμένην und kann eher eine Entwicklungs- oder Wachstumsstörung nahelegen.
  terminology: „Verdorrte Hand“ entspricht dem Grundsinn von ἐξηραμμένην („ausgetrocknet/verwelkt“) genauer und ist trotz seines bildhaften Charakters im modernen Deutschen gut verständlich. Sie legt weder eine medizinische Ursache noch eine bestimmte Diagnose fest. Die Fußnote wird entsprechend sprachlich und semantisch bereinigt.
