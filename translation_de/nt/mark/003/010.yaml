  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: de
  text: Denn er hatte viele geheilt, sodass alle, die an Leiden litten,[a] sich an ihn herandrängten,[b] um ihn zu berühren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Geißeln hatten“; das griechische Wort bezeichnet hier bildlich Leiden oder Krankheiten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „auf ihn eindrangen“; wörtlicher: „sich auf ihn stürzten“. Das griechische Verb schildert den heftigen Andrang der Menschen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: viele
  rationale: Das substantivisch gebrauchte Akkusativobjekt bezeichnet viele Menschen; im Deutschen ist „viele“ natürlich und eindeutig.
- source_word: γὰρ
  choice: denn
  rationale: Kennzeichnet den Satz als Erklärung für die im Zusammenhang geschilderte Situation.
- source_word: ἐθεράπευσεν
  choice: hatte geheilt
  rationale: Das Plusquamperfekt macht im Deutschen passend deutlich, dass Jesu vorausgehende Heilungen den gegenwärtigen Andrang erklären.
- source_word: ὥστε
  choice: sodass
  rationale: Gibt die tatsächliche Folge der Heilungen idiomatisch wieder.
- source_word: ἐπιπίπτειν αὐτῷ
  choice: sich an ihn herandrängten
  rationale: Im Zusammenhang einer Menschenmenge bezeichnet das kräftige Verb ein körperliches Andrängen auf Jesus; die Fußnote bewahrt das wörtlichere Bild.
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: um ihn zu berühren
  rationale: Gibt den Zweck des Andrängens und die übliche Bedeutung von ἅπτομαι mit Genitiv klar wieder.
- source_word: ὅσοι εἶχον μάστιγας
  choice: alle, die von schweren Leiden geplagt waren
  rationale: „Alle, die“ erhält den umfassenden Sinn von ὅσοι. Die Formulierung bewahrt sowohl den übertragenen Leidenssinn als auch etwas von der Bildkraft des wörtlich „Geißeln“ bedeutenden μάστιγας.
theological_decisions:
- issue: Art der μάστιγες im Heilungszusammenhang
  choice: schwere Leiden
  alternative: Krankheiten; Plagen; Geißeln
  rationale: Der Ausdruck umfasst schwere körperliche Bedrängnisse, ist aber anschaulicher und weiter als ein rein medizinischer Begriff. „Schwere Leiden“ vermeidet eine unbegründete diagnostische Einengung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich an ihn herandrängen“ klingt natürlich und vermittelt die körperliche Wucht der Szene, ohne eine feindselige Absicht zu unterstellen. Die Stellung der Fußnotenmarker folgt unmittelbar auf die jeweils erläuterte Wendung.
