lexical_decisions:
- source_word: ἐποίησεν
  choice: setzte … ein
  rationale: Das Verb bedeutet wörtlich „machte“, bezeichnet hier aber, dass Jesus die Gruppe der Zwölf einsetzt bzw. konstituiert. „setzte … ein“ gibt diesen Sinn natürlich wieder, ohne ein späteres kirchliches Amt vorauszusetzen.
- source_word: τοὺς δώδεκα
  choice: die Zwölf
  rationale: Die substantivierte Zahl bezeichnet die fest umrissene Gruppe der zwölf von Jesus ausgewählten Jünger. Die Großschreibung macht diese gruppenbezogene Verwendung im Deutschen deutlich.
- source_word: ἐπέθηκεν ὄνομα
  choice: gab … den Namen
  rationale: Die Wendung bedeutet wörtlich, jemandem einen Namen aufzulegen. „gab … den Namen“ bewahrt den ausdrücklichen Benennungsakt und ist zugleich idiomatisches Deutsch.
- source_word: Σίμωνι
  choice: Simon
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: Πέτρον
  choice: Petrus
  rationale: Da das Wort hier als verliehener Personenname gebraucht wird, steht im Haupttext die im Deutschen übliche Namensform „Petrus“. Seine Bedeutung wird in einer Fußnote erklärt.
theological_decisions:
- issue: Jesu Handeln an den Zwölf
  choice: setzte die Zwölf ein
  alternative: machte die Zwölf
  rationale: Die Formulierung beschreibt, wie Jesus diese Gruppe konstituiert. „setzte … ein“ vermittelt dies verständlich, ohne eine spezifische spätere Amtslehre in den Text einzutragen.
- issue: Wiedergabe von Πέτρος
  choice: Petrus
  alternative: Fels
  rationale: Πέτρος fungiert hier als Personenname. Die Übersetzung behält daher die gebräuchliche Namensform bei und erläutert den Bedeutungsgehalt in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers ist syntaktisch Teil der fortlaufenden Aufzählung und endet daher mit einem Komma.
