source:
  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: de
  text: Und wenn ein Reich mit sich selbst entzweit wird, kann dieses Reich nicht bestehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte Verknüpfung mit dem vorausgehenden Gedankengang.
- source_word: ἐὰν
  choice: wenn
  rationale: Gibt die mit dem Konjunktiv gebildete Bedingung in dieser allgemein formulierten Aussage natürlich wieder.
- source_word: βασιλεία
  choice: Reich
  rationale: Bezeichnet hier das Reich als zusammengehörige politische beziehungsweise soziale Größe; „Herrschaft“ wäre zu abstrakt.
- source_word: ἐφ’ ἑαυτὴν μερισθῇ
  choice: mit sich selbst entzweit wird
  rationale: Gibt sowohl die innere Gegnerschaft als auch die passive Form von μερίζω idiomatisch wieder, ohne den Verursacher zu benennen.
- source_word: οὐ δύναται σταθῆναι
  choice: kann … nicht bestehen
  rationale: „Bestehen“ bewahrt den Sinn des Standhaltens und Fortbestehens in natürlichem modernem Deutsch.
- source_word: ἡ βασιλεία ἐκείνη
  choice: dieses Reich
  rationale: Die Wiederholung von „Reich“ und das Demonstrativpronomen erhalten die rhetorische Betonung des griechischen Textes.
theological_decisions:
- issue: Charakter der Aussage
  choice: Als allgemeiner Grundsatz innerhalb von Jesu Argument wiedergeben, ohne zusätzliche politische oder dämonologische Folgerungen einzutragen.
  alternative: Als ausdrücklich universale gesellschaftspolitische Maxime auslegen.
  rationale: Der Vers dient im Kontext als Vergleich in Jesu Erwiderung. Die sprichwortartige Kraft bleibt erhalten, während der Übersetzung keine weitergehende Lehraussage hinzugefügt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mit sich selbst entzweit“ ist geläufig, prägnant und erhält das Bild innerer Spaltung; „bestehen“ klingt natürlicher als das wörtlichere „stehen bleiben“.
