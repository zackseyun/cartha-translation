  - severity: low
    issue: Die Fußnote formuliert die mögliche Einbeziehung von Frauen zu bestimmt.
    rationale: Der maskuline Plural lautet im Griechischen ἀδελφοί. Der Kontext kann eine weitere Gruppe umfassen, aber der Vers selbst benennt Frauen nicht ausdrücklich. Eine vorsichtigere Formulierung erhält diese Offenheit.
