source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: de
  text: 'Und er blickte ringsum auf die, die im Kreis um ihn saßen, und sagte: »Seht, meine Mutter und meine Brüder![a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »meine Geschwister«. Im Griechischen steht »Brüder«; im weiteren Kreis um Jesus könnten jedoch auch Frauen eingeschlossen sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: er blickte … an
  rationale: Das Aoristpartizip beschreibt, wie Jesus seinen Blick bewusst über die Anwesenden schweifen lässt. Die finite deutsche Form ist natürlich und wahrt die anschauliche Handlung.
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: die, die rings um ihn saßen
  rationale: »Rings um ihn« gibt sowohl περὶ αὐτόν als auch κύκλῳ knapp wieder; »saßen« entspricht καθημένους und klingt in modernem Deutsch natürlich.
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens belebt die Erzählung. Im Deutschen ist hier das erzählende Präteritum idiomatischer, ohne den Aussagegehalt zu verändern.
- source_word: Ἴδε
  choice: Seht
  rationale: Der Aufmerksamkeitsruf weist auf die versammelten Menschen hin. »Seht« ist gegenwärtig, würdig und weniger altertümlich als »Siehe«.
- source_word: μήτηρ
  choice: Mutter
  rationale: Die übliche und kontextuell eindeutige Entsprechung.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der griechische Ausdruck steht im maskulinen Plural. »Brüder« bewahrt diese Form; die mögliche Einbeziehung von Frauen wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Das maskuline ἀδελφοί kann in der versammelten Jüngerschaft möglicherweise Frauen mit einschließen.
  choice: Brüder
  alternative: Geschwister
  rationale: Der Haupttext bewahrt die grammatisch maskuline Gestalt und lässt die mögliche weitere Reichweite des Ausdrucks offen. Die Fußnote nennt die inklusive Übersetzungsmöglichkeit, ohne sie dem Text aufzuzwingen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das doppelte »die, die« ist grammatisch klar; »rings um ihn« erhält die räumliche Betonung des griechischen Ausdrucks.
