reference: Mark 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Darf man am Sabbat[a] Gutes tun oder Böses tun, ein Leben retten oder töten?“ Sie aber schwiegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen die Mehrzahl „an den Sabbaten“; sie wird hier idiomatisch für „am Sabbat“ gebraucht.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔξεστιν
  choice: Darf man
  rationale: Die unpersönliche Frage nach dem Erlaubten wird im Deutschen natürlich mit „Darf man …?“ wiedergegeben; im Zusammenhang geht es um das nach dem Sabbatgebot Zulässige.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der griechische Plural ist eine geläufige Wendung für den Sabbat. Der idiomatische deutsche Singular passt zudem zu dem konkreten Sabbat der Erzählung.
- source_word: ἀγαθοποιῆσαι ἢ κακοποιῆσαι
  choice: Gutes tun oder Böses tun
  rationale: Die parallele Formulierung bewahrt den zugespitzten ethischen Gegensatz der beiden Verben. „Böses tun“ lässt sowohl moralisches Unrecht als auch schädigendes Handeln anklingen.
- source_word: ψυχὴν σῶσαι
  choice: ein Leben retten
  rationale: ψυχή bezeichnet hier angesichts des Gegensatzes zum Töten das menschliche Leben, nicht eigens eine immaterielle Seele.
- source_word: ἀποκτεῖναι
  choice: töten
  rationale: Die schlichte Wiedergabe vermeidet die zusätzlichen rechtlichen oder moralischen Bedeutungsanteile von „hinrichten“ oder „ermorden“.
- source_word: ἐσιώπων
  choice: sie schwiegen
  rationale: Das Imperfekt beschreibt ihre anhaltende ausbleibende Antwort; das deutsche Präteritum gibt dies im Erzählzusammenhang knapp und natürlich wieder.
theological_decisions:
- issue: Reichweite der Gegenüberstellung von Gutestun und Bösestun am Sabbat
  choice: Die allgemeine, zugespitzte Frageform bleibt erhalten.
  alternative: Die Aussage ausdrücklich auf Heilen beziehungsweise Nichtheilen einengen.
  rationale: Jesus formuliert mit allgemeinen ethischen Verben und verschärft den Gegensatz anschließend durch „ein Leben retten oder töten“. Eine ausdrückliche Einengung auf Heilung würde die Spannung des Wortlauts auflösen.
- issue: Bedeutung von ψυχή
  choice: „Leben“
  alternative: „Seele“
  rationale: Der unmittelbare Gegensatz zu ἀποκτεῖναι („töten“) zeigt, dass hier die Bewahrung des Lebens gemeint ist; „Seele“ könnte eine nicht ausdrücklich gesetzte anthropologische Unterscheidung eintragen.
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. „Darf man“ ist natürlicher als das schwerere „Ist es erlaubt“, während „Sie aber schwiegen“ die knappe, pointierte Schlusswendung des griechischen Satzes bewahrt.
