  source_fidelity: Der Entwurf gibt die Ellipse „zwölf“, die beiden parallelen Zweckangaben und das Aussenden zum Predigen grundsätzlich zutreffend wieder. „Bestimmte zwölf“ ist jedoch im heutigen Deutsch weniger idiomatisch und kann stärker nach bloßer Auswahl als nach der im Kontext gemeinten Einsetzung einer Gruppe klingen.
  naturalness: „Damit sie bei ihm wären“ und „aussenden könnte“ verwenden den Konjunktiv II, der im modernen Deutsch leicht einen irrealen oder nur hypothetischen Beiklang erzeugt. Der Konjunktiv I („seien“, „aussende“) bildet die zweckbezogene griechische Konstruktion präziser und in einem würdigen, verständlichen Bibelregister natürlich ab.
  terminology: „Einsetzen“ ist hier für ἐποίησεν mit der Ellipse δώδεκα idiomatisch und sachgerecht. „Aussenden“ und „predigen“ geben ἀποστέλλῃ und κηρύσσειν angemessen wieder. Die Fußnote bewahrt korrekt die längere, im SBLGNT-Haupttext nicht enthaltene Lesart mit „Apostel“.
