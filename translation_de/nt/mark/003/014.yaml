- from: Und er bestimmte zwölf[a], damit sie bei ihm wären und damit er sie aussenden könnte, um zu predigen[b],
  to: Und er setzte zwölf[a] ein, damit sie bei ihm seien und damit er sie aussende, um zu predigen[b],
  rationale: Die Revision ersetzt die weniger natürliche und potenziell enger verstandene Formulierung „bestimmte zwölf“ durch „setzte zwölf ein“. Außerdem werden die beiden griechischen Zweckangaben mit Konjunktiv I wiedergegeben, damit keine irreal-hypothetische Lesart entsteht. Die Ellipse „zwölf“, die Textvariante und das offene Bedeutungsfeld von κηρύσσειν bleiben erhalten. Das Schlusskomma bleibt, weil der Satz in Vers 15 weiterläuft.
