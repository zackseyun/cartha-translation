    rationale: Die Formulierung ist zwar verständlich, wirkt ohne ergänztes Substantiv im modernen Standarddeutsch ungewohnt und kann vornehmlich „zwölf auswählen“ bedeuten. „Setzte zwölf ein“ gibt die konstituierende bzw. beauftragende Handlung in diesem Kontext klarer wieder, ohne „Apostel“ in den Haupttext einzutragen.
  - severity: medium
    issue: Konjunktiv II in den Zweckangaben.
    rationale: „Wären“ und „könnte“ können als Irrealis gelesen werden. Der griechische ἵνα-Satz drückt Zweck aus; „damit sie bei ihm seien und damit er sie aussende“ wahrt dies ohne hypothetische Nuance.
