lexical_decisions:
- source_word: ἐποίησεν
  choice: bestimmte
  rationale: Wörtlich kann das Verb „machen“ bedeuten; mit „zwölf“ als Objekt bezeichnet es hier jedoch das Einsetzen bzw. Bestimmen einer Gruppe. „Bestimmte“ ist im Deutschen natürlich und wahrt den konstituierenden Sinn.
- source_word: δώδεκα
  choice: zwölf
  rationale: Der griechische Text nennt ohne ausdrücklich ergänztes Substantiv schlicht „zwölf“. Diese Ellipse lässt sich im Deutschen ebenso bewahren; „die Zwölf“ würde die Gruppe stärker als bereits feststehenden Kreis kennzeichnen.
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: damit sie bei ihm wären
  rationale: ἵνα mit Konjunktiv bezeichnet hier den Zweck. Der deutsche Konjunktiv wahrt dabei die auf den Zweck bezogene Aussage, ohne sie als bloße Möglichkeit abzuschwächen.
- source_word: ἀποστέλλῃ
  choice: er sie aussenden könnte
  rationale: ἀποστέλλω bedeutet „senden, aussenden“ und kann eine Beauftragung einschließen. „Aussenden“ passt zum öffentlichen Auftrag, ohne den im Ausgangstext nicht stehenden Titel „Apostel“ einzuführen.
- source_word: κηρύσσειν
  choice: um zu predigen
  rationale: κηρύσσω bezeichnet öffentliches Verkündigen. „Predigen“ ist im Evangelienkontext knapp und geläufig; „verkündigen“ bleibt eine sachlich mögliche Alternative.
theological_decisions:
- issue: Ob der Aposteltitel im Haupttext ergänzt werden soll
  choice: „Apostel“ wird im Haupttext nicht ergänzt.
  alternative: „Und er bestimmte zwölf, die er auch Apostel nannte …“
  rationale: Der vorgegebene SBLGNT-Text enthält nur „er bestimmte zwölf“. Die längere Lesart ist textkritisch relevant, gehört aber nicht in den Haupttext dieser Übersetzung und wird deshalb in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die zweimalige Zweckangabe mit „damit“ bildet die parallele griechische Konstruktion ab. Das abschließende Komma bleibt erhalten, da der Vers syntaktisch in Vers 15 weitergeführt wird.
