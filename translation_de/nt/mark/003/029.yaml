  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: de
  text: Wer aber gegen den Heiligen Geist lästert, hat in Ewigkeit keine Vergebung[a], sondern ist einer ewigen Sünde schuldig[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „hat keine Vergebung bis in das Zeitalter hinein“; gemeint sein kann: „hat niemals Vergebung“ oder „hat für immer keine Vergebung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sondern ist einer ewigen Sünde verfallen“ beziehungsweise „für eine ewige Sünde haftbar“.'
    reason: lexical_alternative
  - marker: c
    text: Einige Handschriften haben statt „ewige Sünde“ die Lesart „ewiges Gericht“ oder „ewige Verdammnis“.
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Wer aber
  rationale: ὃς mit ἄν leitet einen indefiniten Relativsatz ein; „wer“ gibt dessen allgemeine Geltung natürlich wieder. δέ markiert den Kontrast zum vorherigen Satz und wird mit „aber“ wiedergegeben.
- source_word: βλασφημήσῃ
  choice: lästert
  rationale: „lästern“ bewahrt im Deutschen das religiöse Gewicht von βλασφημέω und gibt den generischen Sinn des Aorist-Konjunktivs mit ἄν idiomatisch wieder.
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: gegen den Heiligen Geist
  rationale: εἰς bezeichnet bei βλασφημέω das Ziel der Schmähung; „gegen“ ist dafür die natürliche deutsche Entsprechung.
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: findet in Ewigkeit keine Vergebung
  rationale: Die Formulierung bewahrt sowohl ἄφεσις als „Vergebung“ als auch die zeitliche Tragweite von εἰς τὸν αἰῶνα. „findet … keine Vergebung“ ist im Deutschen natürlicher als das wörtliche „hat keine Vergebung“.
- source_word: ἀλλὰ
  choice: sondern
  rationale: Nach der Verneinung kennzeichnet ἀλλά eine scharfe Gegenüberstellung; im Deutschen ist „sondern“ hier treffender als ein zweites „aber“.
- source_word: ἔνοχός ἐστιν
  choice: ist … schuldig
  rationale: ἔνοχος kann Schuld oder Haftbarkeit bezeichnen. Mit dem Genitiv αἰωνίου ἁμαρτήματος ist „einer … Sünde schuldig sein“ eine formnahe und verständliche Wiedergabe.
- source_word: αἰωνίου ἁμαρτήματος
  choice: einer ewigen Sünde
  rationale: Die Übersetzung folgt unmittelbar der SBLGNT-Lesart ἁμαρτήματος („Sünde“) und gibt αἰωνίου mit „ewig“ wieder, ohne die schwierige Aussage auszudeuten.
theological_decisions:
- issue: Wesen der unvergebbaren Verfehlung
  choice: Die Verfehlung wird ohne erklärenden Zusatz als Lästerung gegen den Heiligen Geist bezeichnet.
  alternative: Die Wendung im Haupttext als beharrliche Zurückweisung des Zeugnisses des Geistes oder als Zuschreibung seines Wirkens an dämonische Macht erklären.
  rationale: Der Kontext ist für die Auslegung bedeutsam, doch der Vers selbst nennt unmittelbar die Lästerung gegen den Heiligen Geist. Die Übersetzung wahrt diese theologische Spannung.
- issue: Textvariante am Versende
  choice: „ewige Sünde“ gemäß αἰωνίου ἁμαρτήματος im SBLGNT
  alternative: „ewiges Gericht“ oder „ewige Verdammnis“
  rationale: Der Haupttext folgt der vorgegebenen griechischen Edition; die abweichende Überlieferung wird transparent in einer Fußnote genannt.
- issue: Bedeutung von ἔνοχος mit dem Genitiv
  choice: „einer ewigen Sünde schuldig“
  alternative: „einer ewigen Sünde verfallen/haftbar“
  rationale: „schuldig“ wahrt den forensisch-moralischen Gehalt, ohne abschließend zu entscheiden, ob primär Schuld oder Strafhaftung gemeint ist; die alternative Nuance erscheint in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lästern“ erhält das religiöse Gewicht des Ausgangsworts; „in Ewigkeit keine Vergebung finden“ ist natürlich verständlich und lässt die uneingeschränkte zeitliche Aussage stehen. Alle textlichen und lexikalischen Alternativen werden in Fußnoten kenntlich gemacht.
