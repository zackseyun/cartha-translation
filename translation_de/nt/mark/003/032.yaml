  text: καὶ ἐκάθητο ⸂περὶ αὐτὸν ὄχλος⸃, ⸂καὶ λέγουσιν⸃ αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί ⸀σου ἔξω ζητοῦσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: de
  text: 'Und eine Menschenmenge saß um ihn herum. Da sagten sie zu ihm: »Sieh, deine Mutter und deine Brüder sind draußen und suchen dich[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach dir suchen«. Das griechische Verb kann »suchen« oder »nach jemandem suchen« bedeuten; hier geht es wahrscheinlich darum, Jesus zu finden beziehungsweise zu erreichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: saß
  rationale: Der Imperfekt schildert die andauernde Hintergrundsituation; im Deutschen gibt das Präteritum »saß« diese Szene natürlich wieder.
- source_word: περὶ αὐτὸν ὄχλος
  choice: eine Menschenmenge saß um ihn herum
  rationale: περί mit Akkusativ bezeichnet hier die räumliche Umgebung; »um ihn herum« bewahrt das Bild der ihn umgebenden Menge.
- source_word: λέγουσιν
  choice: da sagten sie
  rationale: Das griechische Präsens ist ein historisches Präsens. Für einen flüssigen deutschen Erzählstil wird es im Präteritum wiedergegeben; »sie« wahrt den Plural der Verbform.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Die Aufmerksamkeitspartikel wird mit einer modernen, knappen Aufforderung wiedergegeben, ohne den altertümlichen Klang von »siehe«.
- source_word: μήτηρ
  choice: Mutter
  rationale: Direkte und kontextgemäße Wiedergabe des gewöhnlichen Verwandtschaftsbegriffs.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Die grammatisch maskuline Pluralform wird ohne deutende Erweiterung als gewöhnlicher Verwandtschaftsbegriff wiedergegeben.
- source_word: ἔξω
  choice: draußen
  rationale: Im Gegensatz zu der im Haus versammelten Menge ist »draußen« die natürliche räumliche Wiedergabe.
- source_word: ζητοῦσίν σε
  choice: suchen dich
  rationale: ζητέω bedeutet hier am naheliegendsten, jemanden finden beziehungsweise erreichen zu wollen; »suchen dich« ist direkt und natürlich.
theological_decisions:
- issue: Bedeutung von »Brüder«
  choice: ἀδελφοί wird ohne nähere Erklärung mit »Brüder« übersetzt.
  alternative: »Geschwister« oder »Brüder beziehungsweise nahe Verwandte«
  rationale: Der Vers selbst erläutert das genaue Verwandtschaftsverhältnis nicht. Die direkte Wiedergabe vermeidet es, konfessionelle Deutungen in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der historische Präsenswechsel des Griechischen wird zugunsten eines natürlichen deutschen Erzählflusses im Präteritum wiedergegeben. Die direkte Rede bleibt knapp und anschaulich.
