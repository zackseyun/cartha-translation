  text: καὶ παρετήρουν αὐτὸν εἰ τοῖς σάββασιν θεραπεύσει αὐτόν, ἵνα ⸀κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: de
  text: Und sie beobachteten ihn genau, ob er ihn am Sabbat heilen würde, damit sie ihn anklagen könnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετήρουν
  choice: sie beobachteten ihn genau
  rationale: Der Imperfekt bezeichnet eine andauernde Beobachtung; παρατηρέω trägt hier im Konfliktzusammenhang den Beiklang aufmerksamer, feindseliger Überwachung.
- source_word: εἰ
  choice: ob
  rationale: Nach dem Verb des Beobachtens leitet εἰ eine indirekte Frage ein; im Deutschen ist „ob“ die natürliche und genaue Wiedergabe.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Die griechische Pluralform kann idiomatisch den einzelnen Sabbattag bezeichnen. „Am Sabbat“ ist im modernen Deutschen natürlich und bewahrt den gemeinten Zeitbezug.
- source_word: θεραπεύσει
  choice: heilen würde
  rationale: Der Futur Indikativ steht in einer indirekten Frage nach einem Vergangenheitstempus; „heilen würde“ gibt diese zeitliche Perspektive natürlich wieder.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: damit sie ihn anklagen könnten
  rationale: ἵνα mit Aorist Konjunktiv bezeichnet den Zweck ihrer Beobachtung. „Anklagen“ wahrt die mögliche forensische Färbung, ohne bereits ein förmliches Gerichtsverfahren vorauszusetzen.
theological_decisions:
- issue: Absicht der Beobachter
  choice: Feindselige Beobachtung mit dem Ziel, einen Anlass zur Anklage zu finden
  alternative: Eine ausdrücklich formelle Strafverfolgung oder gerichtliche Anklage
  rationale: Der Zusammenhang und παρατηρέω zeigen feindselige Aufmerksamkeit; κατηγορέω bezeichnet eine Anklage, doch der Vers legt Art und Stadium eines möglichen Verfahrens nicht fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau folgt dem griechischen Gedankengang, ohne unnatürlich zu wirken.
