  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: de
  text: 'Amen, ich sage euch: Den Menschen[a] werden alle Sünden und Lästerungen vergeben werden, wie viel sie auch lästern mögen;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen der Menschen«. Die griechische Wendung bezeichnet hier Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Amen
  rationale: Die im Deutschen geläufige feierliche Einleitungsformel Jesu bewahrt die semitische Prägung des griechischen Ausdrucks; gemeint ist eine nachdrückliche Wahrheitsbekräftigung.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte und feierliche Anrede wird in natürlichem, bibelkundlich vertrautem Deutsch wiedergegeben.
- source_word: πάντα
  choice: alle
  rationale: Das Neutrum Plural hat hier umfassende Bedeutung und bezieht sich auf die anschließend genannten Sünden und Lästerungen.
- source_word: ἀφεθήσεται
  choice: werden … vergeben werden
  rationale: Im Zusammenhang mit Sünden bezeichnet ἀφίημι das Vergeben; das Passiv und der Zukunftsbezug bleiben erhalten.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: den Söhnen der Menschen
  rationale: Die semitisch geprägte, grammatisch maskuline Wendung wird formal bewahrt; eine Fußnote erklärt ihren allgemeinen, die gesamte Menschheit einschließenden Sinn.
- source_word: τὰ ἁμαρτήματα
  choice: Sünden
  rationale: Der Plural bezeichnet hier konkrete Verfehlungen; im Deutschen ist die artikellose Form nach „alle“ idiomatisch.
- source_word: αἱ βλασφημίαι
  choice: alle Lästerungen
  rationale: „Lästerungen“ bewahrt angesichts des unmittelbaren Zusammenhangs die religiöse und theologische Tragweite; das wiederholte „alle“ macht den umfassenden Bezug von πάντα im Deutschen klar.
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: die sie aussprechen mögen
  rationale: Der Relativsatz mit ἐάν und Aorist Konjunktiv bezeichnet einen offenen, unbestimmten Umfang; „mögen“ erhält diese Nuance ohne unnötige Paraphrase.
theological_decisions:
- issue: Reichweite der Vergebung im Verhältnis zur folgenden Warnung vor der Lästerung gegen den Heiligen Geist
  choice: Der Vers wird für sich als umfassende Verheißung der Vergebung wiedergegeben.
  alternative: Die im folgenden Vers genannte Ausnahme bereits hier einschränkend einarbeiten.
  rationale: Dieser Vers formuliert zunächst die umfassende Aussage; die Spannung zur unmittelbar folgenden Ausnahme soll nicht vorzeitig aufgelöst werden.
- issue: Allgemeiner Sinn der maskulinen Wendung τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: „den Söhnen der Menschen“ im Haupttext, mit inklusiver Erläuterung in der Fußnote
  alternative: „den Menschen“ oder „allen Menschen“
  rationale: So bleibt die konkrete semitische Ausdrucksweise sichtbar, während die Fußnote klarstellt, dass nicht ausschließlich Männer gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter semitischer Feierlichkeit. Der abschließende Strichpunkt folgt dem offenen Satzanschluss an die Warnung des nächsten Verses.
