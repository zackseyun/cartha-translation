  source_fidelity: Die Aussage von ἀφεθήσεται, der Zukunftsbezug und die umfassende Zusammenfassung von Sünden und Lästerungen sind im Entwurf grundsätzlich zutreffend wiedergegeben. Die Wendung ὅσα ἐὰν βλασφημήσωσιν bezeichnet jedoch den offenen Umfang dessen, was Menschen lästern; »die sie aussprechen mögen« ist weniger präzise und schwächt die quantitative/indefinite Nuance ab.
  naturalness: »Den Söhnen der Menschen« ist im heutigen Standarddeutsch keine natürliche generische Personenbezeichnung und kann unnötig exklusiv-männlich verstanden werden. »Den Menschen« gibt den generischen Sinn idiomatisch wieder; die wörtliche Form kann in der Fußnote dokumentiert werden. »wie viel sie auch lästern mögen« ist eine natürliche, würdige und quellentreue Formulierung.
  terminology: »Amen, ich sage euch«, »Sünden«, »Lästerungen« und »vergeben werden« sind angemessen. Die Fußnote soll bei einer idiomatischen Haupttextübersetzung die wörtliche griechische Form benennen, statt »den Menschen« lediglich als Alternative anzubieten.
