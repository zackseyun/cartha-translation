  naturalness: Die revidierte Fassung ist modernes Standarddeutsch und bewahrt die knappe, bildhafte Argumentation. Die Wiederholung von »plündern« bildet die Wiederholung von διαρπάζω erkennbar ab.
  terminology: »Starker Mann« bewahrt die substantivierte maskuline Bezeichnung und die Metapher. »Besitz« gibt τὰ σκεύη im gegebenen Kontext idiomatisch als Habe bzw. Gegenstände wieder, ohne die konkrete Bildsprache im Schlusssatz aufzulösen.
  issues:
