  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: de
  text: Doch niemand kann in das Haus des starken Mannes hineingehen und seinen Besitz plündern,[b] wenn er nicht zuerst den starken Mann fesselt.[a] Dann wird er sein Haus plündern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »starke Mann« gehört zu Jesu Bild für die Überwindung Satans; das Bild wird im Haupttext nicht ausdrücklich aufgelöst.
    reason: cross_reference
  - marker: b
    text: 'Oder: »seine Sachen«, »seine Habe«; wörtlicher: »seine Gegenstände/Geräte«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Kennzeichnet den Gegensatz zu der vorausgehenden Anschuldigung und leitet Jesu Gegenargument natürlich ein.
- source_word: οὐδεὶς δύναται
  choice: niemand kann
  rationale: Gibt die verneinte Möglichkeit knapp und idiomatisch wieder.
- source_word: εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθών
  choice: in das Haus des Starken eindringen
  rationale: „Eindringen“ entspricht dem gewaltsamen Kontext des Raubens und gibt die Bewegung in das Haus natürlich wieder; „des Starken“ bewahrt das substantivierte Adjektiv und die Metapher.
- source_word: τὰ σκεύη αὐτοῦ
  choice: seinen Besitz
  rationale: σκευή bezeichnet hier die im Haus befindlichen Gegenstände beziehungsweise Habe; „Besitz“ ist im Deutschen verständlich, ohne das kontextuell unpassende wörtliche „Gefäße“ zu verwenden.
- source_word: διαρπάσαι
  choice: rauben
  rationale: Gibt das gewaltsame Wegnehmen wieder und verbindet sich im Deutschen natürlich mit „Besitz“.
- source_word: ἐὰν μὴ πρῶτον
  choice: wenn er nicht zuerst
  rationale: Bewahrt sowohl die notwendige Bedingung als auch die zeitliche Reihenfolge.
- source_word: τὸν ἰσχυρὸν δήσῃ
  choice: den Starken fesselt
  rationale: „Fesseln“ gibt δέω anschaulich und dem Bild entsprechend wieder; die Wiederholung „der Starke“ bleibt erhalten.
- source_word: καὶ τότε
  choice: Dann
  rationale: Markiert klar die Folge nach Erfüllung der vorherigen Bedingung; das deutsche „Dann“ trägt die nötige Konsequenz ohne zusätzliche Verstärkung.
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: wird er sein Haus ausrauben
  rationale: Bewahrt Futur, Hausmetapher und die intensive Vorstellung einer umfassenden Plünderung.
theological_decisions:
- issue: Metaphorische Bedeutung des „Starken“ im Zusammenhang mit Satan
  choice: Die Metapher bleibt im Haupttext unverändert stehen.
  alternative: Den Starken ausdrücklich als Satan bezeichnen.
  rationale: Der Zusammenhang legt Satan als den Gemeinten nahe, doch der griechische Text formuliert ein Bild. Die Übersetzung soll diese Bildsprache und ihre theologische Spannung nicht durch eine ausdeutende Ersetzung auflösen.
- issue: Reichweite von „sein Haus ausrauben“
  choice: Das konkrete Bild des Hauses wird bewahrt.
  alternative: Abstrakter mit „seinen Machtbereich berauben“ oder „alles rauben, was ihm gehört“ übersetzen.
  rationale: οἰκία bezeichnet im Bild das Haus, kann aber weiter den Herrschafts- oder Besitzbereich andeuten. Der Haupttext sollte diese mögliche Mehrschichtigkeit offenhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bildkräftigem Ton. „Des Starken“ klingt leicht markiert, bewahrt aber die substantivische Wiederholung des Griechischen und die traditionelle Prägnanz des Bildworts. Alle Fußnotenmarker stehen im Haupttext.
