revisions:
- from: Doch niemand kann in das Haus des Starken eindringen und seinen Besitz rauben, wenn er nicht zuerst den Starken fesselt.[a] Dann wird er sein Haus ausrauben.[b]
  to: Doch niemand kann in das Haus des starken Mannes hineingehen und seinen Besitz plündern,[b] wenn er nicht zuerst den starken Mann fesselt.[a] Dann wird er sein Haus plündern.
  rationale: Die Revision vermeidet die nicht ausdrücklich im Quelltext enthaltene Nuance eines gewaltsamen Eindringens, macht die maskuline Bildfigur transparent, erhält die Wiederholung des Verbs »plündern« und ordnet die lexikalische Fußnote dem tatsächlich erläuterten Ausdruck zu. Die metaphorische Deutung bleibt, wie im griechischen Text, außerhalb des Haupttexts.
