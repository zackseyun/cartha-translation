    rationale: εἰσέρχομαι bedeutet »hineingehen/eintreten«; ein gewaltsames oder heimliches Eindringen wird nicht durch dieses Wort selbst ausgesagt.
  - severity: medium
    issue: Die lexikalische Fußnote ist am Schlussvers verankert, obwohl sie den ersten Gegenstand des Plünderns erläutern soll.
    rationale: Die Anmerkung zu »Hausstand« bezieht sich sachlich auf τὰ σκεύη (»Besitz«), nicht auf τὴν οἰκίαν (»Haus«). Der Marker wird daher direkt nach »Besitz« gesetzt und die Erläuterung präzisiert.
  - severity: low
