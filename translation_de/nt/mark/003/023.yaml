  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: de
  text: 'Da rief er sie zu sich und sprach in Gleichnissen zu ihnen: »Wie kann Satan den Satan austreiben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Da rief er sie zu sich
  rationale: Das Aoristpartizip bezeichnet die dem Sprechen vorausgehende Handlung. »Da rief er sie zu sich« gibt sowohl die Hinwendung als auch die natürliche Erzählfolge im Deutschen wieder.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Die Wendung bezeichnet bildhafte Vergleiche beziehungsweise Gleichnisreden. Der Plural bleibt erhalten, ohne die genaue Form stärker festzulegen als der griechische Text.
- source_word: ἔλεγεν
  choice: sprach
  rationale: Das Imperfekt kann fortlaufendes oder wiederholtes Reden anzeigen. Im deutschen Erzählstil ist »sprach« natürlich; die Art des folgenden Lehrgesprächs trägt den durativen Zusammenhang mit.
- source_word: Πῶς δύναται
  choice: Wie kann
  rationale: Die knappe deutsche Frage bewahrt die rhetorische Frage nach Möglichkeit beziehungsweise Fähigkeit.
- source_word: Σατανᾶς ... Σατανᾶν
  choice: Satan den Satan
  rationale: Der erste Ausdruck ist Subjekt, der zweite bestimmtes Objekt. Der Artikel vor dem zweiten »Satan« macht die deutsche Kasusbeziehung eindeutig und entspricht der Verwendung des Namens beziehungsweise Titels.
- source_word: ἐκβάλλειν
  choice: austreiben
  rationale: »Austreiben« ist im markinischen Kontext die natürliche und etablierte deutsche Wiedergabe des Verbs für die Vertreibung dämonischer Mächte.
theological_decisions:
- issue: Aussagekraft der Frage, ob Satan gegen Satan handelt
  choice: »Wie kann Satan den Satan austreiben?« als rhetorische Frage
  alternative: »Wie ist Satan imstande, Satan auszutreiben?«
  rationale: Der Text fragt nach Möglichkeit oder Fähigkeit und stellt damit die innere Unstimmigkeit des Vorwurfs heraus, ohne die Folgerung bereits erklärend in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die direkte Rede bleibt knapp und pointiert; keine konfessionell geprägte Zusatzdeutung.
