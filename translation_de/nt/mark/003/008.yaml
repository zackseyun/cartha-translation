  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: de
  text: und aus Jerusalem und aus Idumäa und von jenseits des Jordans[a] und aus der Gegend um Tyrus und Sidon[b] kamen sehr viele Menschen zu ihm, als sie hörten, was er alles tat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: aus dem Gebiet auf der anderen Seite des Jordans.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „um Tyrus und Sidon“; gemeint ist die umliegende Region, nicht unbedingt nur die beiden Städte.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „weil sie hörten, was er alles tat“. Das griechische Partizip lässt offen, ob der zeitliche Zusammenhang oder der Beweggrund hervorgehoben wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: aus Jerusalem
  rationale: ἀπό mit Genitiv bezeichnet hier Herkunft; der Ortsname wird in seiner üblichen deutschen Form wiedergegeben.
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: aus Idumäa
  rationale: Die Formulierung bewahrt den Herkunftssinn von ἀπό und verwendet die gebräuchliche deutsche Bezeichnung der Region.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: von jenseits des Jordans
  rationale: πέραν mit Genitiv bezeichnet das Gebiet auf der anderen Seite des Flusses; „von“ ergibt sich aus der fortwirkenden Herkunftskonstruktion der Aufzählung.
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: aus der Gegend um Tyrus und Sidon
  rationale: περί mit Akkusativ ist räumlich und verweist auf das Umland, nicht zwingend nur auf die beiden Städte selbst.
- source_word: πλῆθος πολύ
  choice: sehr viele Menschen
  rationale: Die idiomatische Wiedergabe bezeichnet eine große Menschenmenge und ermöglicht im Deutschen einen natürlichen Pluralanschluss an ἀκούοντες und ἦλθον.
- source_word: ἀκούοντες
  choice: als sie hörten
  rationale: Der präsentische Partizipialsatz wird natürlich temporal wiedergegeben, ohne auszuschließen, dass das Hören zugleich der Anlass ihres Kommens war.
- source_word: ὅσα ἐποίει
  choice: was er alles tat
  rationale: ὅσα kann einen umfassenden Sinn tragen; der deutsche Ausdruck „was … alles“ gibt dies idiomatisch wieder, während das Imperfekt die fortdauernde Tätigkeit erkennen lässt.
- source_word: ἦλθον πρὸς αὐτόν
  choice: kamen … zu ihm
  rationale: Die Wendung bezeichnet eine Bewegung auf Jesus zu und wird im Deutschen idiomatisch mit „zu ihm kommen“ ausgedrückt.
- source_word: καὶ … καὶ … καὶ
  choice: und … und … und
  rationale: Die wiederholten Konjunktionen bewahren den für Markus typischen, sich steigernden Aufzählungsrhythmus.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers beginnt mit „und“, weil er die Herkunftsaufzählung aus dem vorhergehenden Vers fortsetzt. Die geografische Reihung und die wiederholten Konjunktionen bleiben erhalten; die kollektive Wendung πλῆθος πολύ wird für einen natürlichen deutschen Satz als „sehr viele Menschen“ wiedergegeben.
