  text: καὶ πολλὰ ἐπετίμα αὐτοῖς ἵνα μὴ ⸂αὐτὸν φανερὸν⸃ ⸀ποιήσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: de
  text: Und er wies sie eindringlich an, ihn nicht bekannt zu machen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn offenbar zu machen“ oder „ihn öffentlich zu machen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: immer wieder
  rationale: Das adverbial gebrauchte Neutrum Plural bezeichnet hier wiederholtes beziehungsweise nachdrückliches Handeln. „Immer wieder“ klingt im modernen Deutsch natürlich und wahrt den Wiederholungsaspekt.
- source_word: ἐπετίμα
  choice: schärfte … ein
  rationale: Das Verb bezeichnet ein nachdrückliches Zurechtweisen oder Befehlen. In Verbindung mit dem folgenden Verbot gibt „schärfte … ein“ den strengen, autoritativen Ton idiomatisch wieder.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das Dativpronomen verweist im unmittelbaren Zusammenhang auf die unreinen Geister.
- source_word: ἵνα μὴ
  choice: nicht zu
  rationale: Die Konstruktion bezeichnet hier den Inhalt beziehungsweise Zweck der nachdrücklichen Anweisung und lässt sich im Deutschen knapp mit einem verneinten Infinitiv wiedergeben.
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: ihn bekannt zu machen
  rationale: Die Wendung φανερὸν ποιεῖν bedeutet, jemanden offenbar, öffentlich erkennbar oder bekannt zu machen. Die gewählte Formulierung ist natürlich und legt nicht genauer fest, welche Identitätsaussage gemeint ist.
theological_decisions:
- issue: Gegenstand des Verbots an die unreinen Geister
  choice: Das Verbot betrifft, Jesus bekannt zu machen, ohne die Art der Bekanntmachung näher zu bestimmen.
  alternative: Ausdrücklich ergänzen, dass sie ihn als Sohn Gottes offenbaren sollten.
  rationale: Der unmittelbare Kontext legt eine Enthüllung seiner Identität nahe, doch der Vers selbst sagt lediglich, sie sollten ihn nicht bekannt beziehungsweise offenbar machen. Die Übersetzung ergänzt daher keine christologische Bezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schärfte ihnen immer wieder ein“ verbindet den nachdrücklichen Charakter von ἐπετίμα mit der wiederholenden Kraft von πολλὰ, ohne eine zusätzliche Deutung einzutragen.
