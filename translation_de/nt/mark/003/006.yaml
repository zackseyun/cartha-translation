  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: de
  text: Und die Pharisäer gingen hinaus und begannen sofort, gemeinsam mit den Herodianern Pläne gegen ihn zu schmieden, um ihn zu vernichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Zusammenhang ausdrücklicher: „ihn zu töten“ oder „ihn umzubringen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: gingen hinaus
  rationale: Das Aoristpartizip bezeichnet hier eine die Haupthandlung begleitende beziehungsweise ihr vorausgehende Bewegung. Die finite Form ist im deutschen Erzählstil natürlich und bewahrt den Bezug auf das Verlassen des vorherigen Schauplatzes.
- source_word: εὐθὺς
  choice: sofort
  rationale: Das Wort vermittelt die für Markus charakteristische Dringlichkeit. „Sofort“ ist prägnant und in modernem Standarddeutsch natürlich.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: gemeinsam mit den Herodianern
  rationale: μετά mit Genitiv bezeichnet die Beteiligung einer verbündeten Gruppe. „Herodianer“ ist die etablierte Bezeichnung für Anhänger beziehungsweise Parteigänger des herodianischen Herrscherhauses.
- source_word: συμβούλιον ἐδίδουν
  choice: begannen … Pläne … zu schmieden
  rationale: Die Wendung bedeutet, Rat zu halten beziehungsweise einen Plan zu fassen. Wegen der feindlichen Zielsetzung ist „Pläne schmieden“ sachgerecht; „begannen“ gibt den einsetzenden oder fortschreitenden Aspekt des Imperfekts wieder.
- source_word: κατ’ αὐτοῦ
  choice: gegen ihn
  rationale: κατά mit Genitiv hat hier angesichts der feindlichen Absicht adversative Bedeutung.
- source_word: ὅπως
  choice: um
  rationale: Mit dem folgenden Konjunktiv leitet ὅπως hier den beabsichtigten Zweck der Beratung ein. Die deutsche Infinitivkonstruktion mit „um“ gibt diesen Zusammenhang klar und idiomatisch wieder.
- source_word: ἀπολέσωσιν
  choice: ihn zu vernichten
  rationale: ἀπόλλυμι kann vernichten, zugrunde richten oder töten bedeuten. „Vernichten“ bewahrt die breitere Ausdrucksweise des griechischen Verbs, während der Kontext eine tödliche Absicht erkennen lässt.
theological_decisions:
- issue: Ob die Absicht der Gegner im Haupttext ausdrücklich als Tötungsabsicht bezeichnet werden soll
  choice: Die breitere Formulierung „ihn zu vernichten“ steht im Haupttext.
  alternative: „ihn zu töten“ oder „ihn umzubringen“
  rationale: Im Kontext zielt der Plan wahrscheinlich auf Jesu Tod, doch ἀπόλλυμι besitzt einen weiteren Bedeutungsumfang als ein ausschließliches Verb für „töten“. Der Haupttext wahrt diese Breite; die Fußnote nennt die im Zusammenhang naheliegende ausdrückliche Bedeutung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Pläne schmieden“ gibt die feindliche Beratung idiomatisch wieder; „Herodianer“ bleibt als etablierte historische Gruppenbezeichnung erhalten.
