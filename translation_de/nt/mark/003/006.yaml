  source_fidelity: 'Der Text gibt die Abfolge und die Aussage des Griechischen zuverlässig wieder: Die Pharisäer gehen hinaus, beraten sich sofort mit den Herodianern gegen Jesus und verfolgen dabei das Ziel, ihn zu vernichten. „Sofort“ entspricht εὐθὺς; „gemeinsam mit den Herodianern“ gibt μετὰ τῶν Ἡρῳδιανῶν angemessen wieder; „gegen ihn“ trifft die adversative Bedeutung von κατ’ αὐτοῦ. Die Zweckkonstruktion „um ihn zu vernichten“ ist eine natürliche deutsche Wiedergabe von ὅπως mit Konjunktiv.'
  naturalness: Modernes Standarddeutsch, klar und flüssig. „Pläne gegen ihn zu schmieden“ ist idiomatisch und wahrt den feindseligen Charakter der Beratung. Die Satzstellung ist für einen erzählenden Bibeltext natürlich.
  terminology: „Pharisäer“ und „Herodianer“ sind etablierte und sachgerechte historische Bezeichnungen. „Vernichten“ wahrt die weitere lexikalische Reichweite von ἀπολέσωσιν, ohne die im Kontext naheliegende tödliche Stoßrichtung auszublenden; diese wird zutreffend in der Fußnote erläutert.
