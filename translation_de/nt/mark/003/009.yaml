  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die indirekte Aufforderung wird idiomatisch mit »sie sollten« formuliert; die Bedeutungsbreite von θλίβω bleibt durch Haupttext und Fußnote erhalten.
