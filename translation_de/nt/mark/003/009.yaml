  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: de
  text: Und er sagte seinen Jüngern, sie sollten wegen der Menge ein kleines Boot für ihn bereithalten, damit die Menge ihn nicht bedrängte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit die Menge ihn nicht erdrückte« beziehungsweise »gegen ihn drängte«. Das griechische Verb kann körperliches Drängen, Pressen oder Quetschen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: sagte zu
  rationale: Mit dem anschließenden indirekten Inhalt gibt »sagte zu seinen Jüngern, sie sollten …« die griechische Konstruktion natürlich und genau wieder.
- source_word: μαθηταῖς
  choice: Jüngern
  rationale: »Jünger« ist in den Evangelien die etablierte und sachgerechte Wiedergabe für μαθητής und bewahrt das Lehrer-Nachfolger-Verhältnis.
- source_word: πλοιάριον
  choice: ein kleines Boot
  rationale: Die Verkleinerungsform wird mit »kleines Boot« sichtbar gemacht, ohne unnatürlich zu klingen.
- source_word: προσκαρτερῇ
  choice: bereithalten
  rationale: Im Zusammenhang bezeichnet das Verb fortdauernde Verfügbarkeit beziehungsweise Bereitschaft; die Jünger sollen dafür sorgen, dass das Boot Jesus zur Verfügung steht.
- source_word: αὐτῷ
  choice: für ihn
  rationale: Der Dativ bezeichnet hier die Verfügbarkeit des Bootes für Jesus.
- source_word: διὰ τὸν ὄχλον
  choice: weil so viele Menschen da waren
  rationale: διά mit Akkusativ gibt den Grund an. Die kontextbezogene Umschreibung macht im Deutschen deutlich, dass die Menschenmenge den Anlass für das bereitgehaltene Boot bildet.
- source_word: θλίβωσιν
  choice: bedrängten
  rationale: Das Verb kann körperliches Drängen, Pressen oder Quetschen bezeichnen. »Bedrängen« klingt im Deutschen natürlich und lässt die Stärke der körperlichen Einwirkung bewusst offen.
