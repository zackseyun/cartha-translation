  text: ὅτι ἔλεγον· Πνεῦμα ἀκάθαρτον ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/030.yaml
  text: because they were saying[a], “He has an unclean spirit.”
translation:
  language: de
  text: 'Denn sie sagten: »Er hat[a] einen unreinen Geist.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder idiomatischer: »Er ist von einem unreinen Geist besessen.«'
    reason: Idiomatische, stärker interpretierende Übersetzungsalternative zu »hat«; der Haupttext bewahrt den knappen Wortlaut des Griechischen.
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Die Konjunktion ist hier kausal und begründet Jesu unmittelbar vorausgehende Aussage. »Denn« stellt diesen Zusammenhang im Deutschen natürlich her.
- source_word: ἔλεγον
  choice: sie sagten immer wieder
  rationale: Der Imperfekt bezeichnet hier am ehesten eine fortgesetzte oder wiederholte Äußerung. Die Formulierung macht diesen Aspekt verständlich, ohne nur eine einmalige Aussage nahezulegen.
- source_word: Πνεῦμα ἀκάθαρτον
  choice: einen unreinen Geist
  rationale: Dies bewahrt die im Markusevangelium übliche Bezeichnung für einen dämonischen Geist und gibt ἀκάθαρτον lexikalisch eng mit »unrein« wieder.
- source_word: ἔχει
  choice: hat
  rationale: Das griechische Verb bedeutet unmittelbar »hat«. Die Hauptzeile wahrt diese knappe, anstößige Anschuldigung, statt sie bereits als Besessenheit auszulegen.
theological_decisions:
- issue: Art der gegen Jesus erhobenen Anschuldigung
  choice: »Er hat einen unreinen Geist.«
  alternative: »Er ist von einem unreinen Geist besessen.«
  rationale: Die wörtlichere Fassung erhält die direkte Form und theologische Schärfe der Anschuldigung. Die alternative idiomatische Deutung wird in der Fußnote genannt, aber nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Unreiner Geist« bewahrt die etablierte neutestamentliche Ausdrucksweise. Die Zeichensetzung und deutschen Anführungszeichen folgen heutiger Standardsprache.
