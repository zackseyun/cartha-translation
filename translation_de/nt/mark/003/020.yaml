  to: Und er kommt in ein Haus[a]. Wieder strömt die Menge zusammen, sodass sie nicht einmal essen können[b].
  rationale: Die Revision hält die unbestimmte Referenz von εἰς οἶκον und das historische Präsens bei. Sie ersetzt die freiere deutsche Redewendung „zum Essen kommen“ durch eine unmittelbare Wiedergabe der resultativen Unmöglichkeit zu essen. „Wieder strömt die Menge zusammen“ ist eine natürliche kontextgerechte Wiedergabe von συνέρχεται πάλιν, ohne die im Griechischen nicht ausdrücklich benannte Personengruppe hinter „sie“ zu präzisieren.
