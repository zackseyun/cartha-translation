  text: Καὶ ⸀ἔρχεται εἰς οἶκον· καὶ συνέρχεται πάλιν ⸀ὁ ὄχλος, ὥστε μὴ δύνασθαι αὐτοὺς ⸀μηδὲ ἄρτον φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/020.yaml
  text: And he comes into a house[a], and the crowd gathers again[c][b], so that they are not even able to eat bread.
translation:
  language: de
  text: Und er kommt in ein Haus[a]. Wieder strömt die Menge zusammen, sodass sie nicht einmal essen können[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Hause“. Wörtlich steht im Griechischen „in ein Haus“; die Wendung kann jedoch idiomatisch die Heimkehr bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „nicht einmal Brot essen können“; gemeint ist, eine Mahlzeit einzunehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens bewahrt Markus’ lebendige Erzählweise.
- source_word: εἰς οἶκον
  choice: in ein Haus
  rationale: Die artikellose Wendung bezeichnet das Haus nicht ausdrücklich als Jesu Zuhause; die idiomatische Möglichkeit „nach Hause“ bleibt in der Fußnote erhalten.
- source_word: συνέρχεται πάλιν ὁ ὄχλος
  choice: Wieder versammelt sich die Menschenmenge
  rationale: „Sich versammeln“ gibt den intransitiven Sinn natürlich wieder; „wieder“ markiert die Wiederholung.
- source_word: ὥστε μὴ δύνασθαι αὐτοὺς
  choice: sodass sie nicht … kommen
  rationale: Die Konstruktion mit ὥστε und Infinitiv bezeichnet die tatsächliche Folge; „sie“ wahrt den pluralischen Bezug auf Jesus und seine Begleiter.
- source_word: μηδὲ ἄρτον φαγεῖν
  choice: nicht einmal zum Essen kommen
  rationale: ἄρτον φαγεῖν bedeutet hier idiomatisch, eine Mahlzeit einzunehmen. Die natürliche deutsche Wendung vermeidet das missverständliche wörtliche „Brot essen“; dieses wird in der Fußnote dokumentiert.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens wird entsprechend dem griechischen Text beibehalten. Die idiomatische Wiedergabe „zum Essen kommen“ klingt natürlich und bewahrt zugleich die Aussage, dass der Andrang eine Mahlzeit unmöglich machte.
