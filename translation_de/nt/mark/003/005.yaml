id: MRK.3.5
reference: Mark 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: de
  text: 'Nachdem er sie ringsum mit Zorn angesehen hatte und zugleich über die Verhärtung ihrer Herzen[a] betrübt war, sagt er zu dem Mann: „Streck deine Hand aus!“ Er streckte sie aus, und seine Hand wurde wiederhergestellt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen „ihres Herzens“ im Singular, wahrscheinlich als kollektive Ausdrucksweise.
    reason: Die Fußnote bewahrt die formale Mehrdeutigkeit zwischen kollektivem Singular und idiomatischem Plural.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: nachdem er sie ringsum … angesehen hatte
  rationale: Der Aoristpartizip bezeichnet hier eine dem Hauptverb vorausgehende Handlung. Die Formulierung gibt sowohl den Rundblick als auch die zeitliche Abfolge natürlich wieder.
- source_word: μετ’ ὀργῆς
  choice: voller Zorn
  rationale: μετά mit Genitiv bezeichnet die begleitende Art und Weise. „Voller Zorn“ bewahrt die ausdrückliche emotionale Stärke, ohne sie abzuschwächen.
- source_word: συλλυπούμενος
  choice: zugleich … betrübt war
  rationale: Das Partizip bezeichnet schmerzliche Betrübnis. „Zugleich“ bringt die Gleichzeitigkeit von Zorn und Trauer verständlich zum Ausdruck, ohne eine zusätzliche Deutung einzuführen.
- source_word: ἐπὶ τῇ πωρώσει
  choice: über die Verhärtung
  rationale: ἐπί mit Dativ nennt hier den Anlass der Betrübnis. „Verhärtung“ erhält die körperlich-moralische Metapher von πώρωσις.
- source_word: τῆς καρδίας αὐτῶν
  choice: ihrer Herzen
  rationale: Der griechische Singular „Herz“ steht bei einem pluralischen Besitzer wahrscheinlich kollektiv. Der deutsche Plural ist idiomatisch; die formale Besonderheit des Ausgangstextes wird in einer Fußnote bewahrt.
- source_word: λέγει
  choice: sagt er
  rationale: Das historische Präsens wird beibehalten, um den für Markus charakteristischen lebendigen Erzählstil nicht einzuebnen.
- source_word: τῷ ἀνθρώπῳ
  choice: zu dem Mann
  rationale: ἄνθρωπος bezeichnet in diesem Zusammenhang den bereits genannten männlichen Menschen; „Mann“ ist konkret und natürlich.
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: Streck deine Hand aus!
  rationale: Die knappe Aufforderung gibt den Aoristimperativ und die übliche Bedeutung von ἐκτείνω in diesem Zusammenhang direkt wieder.
- source_word: ἐξέτεινεν
  choice: Er streckte sie aus
  rationale: Die Wiederholung des Verbs greift Jesu Aufforderung auf; das Pronomen vermeidet im Deutschen unnötige Redundanz.
- source_word: ἀπεκατεστάθη
  choice: wurde wiederhergestellt
  rationale: Das Passiv bezeichnet die Wiederherstellung in den früheren unversehrten Zustand und ist lexikalisch genauer als eine bloße Wiedergabe mit „geheilt“.
theological_decisions:
- issue: Jesu Zorn und Betrübnis
  choice: 'Beide Emotionen werden ausdrücklich und gleichzeitig wiedergegeben: „voller Zorn“ und „betrübt“.'
  alternative: ὀργή mit „Unwillen“ abschwächen oder συλλυπούμενος erweiternd als „tieftraurig“ wiedergeben.
  rationale: Der griechische Text stellt Jesu Zorn und Betrübnis spannungsvoll nebeneinander. Die Übersetzung bewahrt beides, ohne die Aussage aus theologischen Gründen abzuschwächen oder auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens „sagt“ erhält die markinische Erzähllebendigkeit; die übrige Syntax bleibt klar und gut vorlesbar.
