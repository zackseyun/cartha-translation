source:
  edition: SBLGNT
  text: καὶ λέγει τῷ ἀνθρώπῳ τῷ ⸂τὴν χεῖρα ἔχοντι ξηράν⸃· ⸀Ἔγειρε εἰς τὸ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/003.yaml
  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: de
  text: 'Und er sagt zu dem Mann mit der verdorrten Hand: „Steh auf und tritt in die Mitte!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Stell dich in die Mitte!“; sinngemäß auch: „Komm nach vorn!“'
    reason: Die knappe griechische Aufforderung Ἔγειρε εἰς τὸ μέσον lässt sowohl das Aufstehen als auch das Sich-in-die-Mitte-Begeben erkennen; idiomatische Übersetzungen gewichten diese Aspekte unterschiedlich.
lexical_decisions:
- source_word: λέγει
  choice: er sagt
  rationale: Das historische Präsens bewahrt den für Markus typischen lebendigen Erzählstil und ist auch im Deutschen natürlich verständlich.
- source_word: ἀνθρώπῳ
  choice: Mann
  rationale: Im Kontext ist ein erwachsener männlicher Mensch gemeint; „Mann“ gibt den konkreten Referenten passend wieder.
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: mit der verdorrten Hand
  rationale: Die attributive Wendung ist knapp und natürlich; „verdorrt“ bildet die Grundvorstellung von ξηρός ab, ohne die medizinische Ursache näher festzulegen.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Der Imperativ kann hier das Aufstehen bezeichnen. „Steh auf“ ist im modernen Deutschen unmittelbar und weniger gehoben als „Erhebe dich“.
- source_word: εἰς τὸ μέσον
  choice: tritt in die Mitte
  rationale: Die Formulierung bewahrt die durch εἰς ausgedrückte Bewegung in den mittleren Bereich und klingt als Aufforderung idiomatisch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens bleibt erhalten. Die direkte Rede ist knapp und bestimmt; „verdorrte Hand“ folgt dem traditionellen, weiterhin verständlichen biblischen Sprachgebrauch, ohne eine konkrete Diagnose einzutragen.
