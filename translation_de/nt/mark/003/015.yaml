  text: and to have authority to cast out demons[a].
translation:
  language: de
  text: und Vollmacht zu haben, die Dämonen auszutreiben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Dämonen zu vertreiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die gewöhnliche koordinierende Konjunktion verbindet diesen Infinitiv mit den vorangehenden Aussagen über den Auftrag der Zwölf.
- source_word: ἔχειν
  choice: zu haben
  rationale: Der Präsensinfinitiv wird direkt und im Deutschen natürlich wiedergegeben.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Im Zusammenhang der Beauftragung bezeichnet ἐξουσία eine verliehene Befugnis und wirksame Autorität, nicht nur unbestimmte Kraft. „Vollmacht“ ist dafür im biblischen Erzählzusammenhang präzise und verständlich.
- source_word: ἐκβάλλειν
  choice: auszutreiben
  rationale: Das Verb bezeichnet hier das gewaltsame Entfernen beziehungsweise Vertreiben von Dämonen; „austreiben“ ist die natürliche deutsche Wendung im Exorzismuskontext.
- source_word: τὰ δαιμόνια
  choice: die Dämonen
  rationale: Der griechische Ausdruck nennt ausdrücklich Dämonen und nicht „unreine Geister“; die Übersetzung bewahrt diese lexikalische Unterscheidung.
theological_decisions:
- issue: Bedeutung von ἐξουσία im Auftrag der Jünger
  choice: Vollmacht
  alternative: Macht
  rationale: „Vollmacht“ betont die von Jesus verliehene und autorisierte Fähigkeit zum Handeln, ohne die tatsächliche übernatürliche Wirksamkeit abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Infinitivkonstruktion bleibt erhalten, da der Vers syntaktisch an Markus 3,14 anschließt. „Vollmacht“ und „Dämonen austreiben“ sind geläufige, präzise Formulierungen.
