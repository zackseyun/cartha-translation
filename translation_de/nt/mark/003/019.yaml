  text: καὶ Ἰούδαν ⸀Ἰσκαριώθ, ὃς καὶ παρέδωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/019.yaml
  text: and Judas Iscariot[a], who also betrayed him.
translation:
  language: de
  text: und Judas Iskariot[a], der ihn auch verriet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der ihn auch übergab“ oder „der ihn auch auslieferte“. Das griechische Verb kann „übergeben“ oder „ausliefern“ bedeuten; hier wird „verriet“ gewählt, weil Judas’ Handeln an Jesus im Zusammenhang diesen Sinn hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: und
  rationale: Die einfache Konjunktion verbindet den letzten Namen der Apostelliste mit den vorhergehenden Namen.
- source_word: Ἰούδαν
  choice: Judas
  rationale: Der Personenname wird gemäß der etablierten deutschen Namensform wiedergegeben.
- source_word: Ἰσκαριώθ
  choice: Iskariot
  rationale: Die herkömmliche deutsche Transliteration bewahrt die im Kontext etymologisch nicht sicher aufzulösende Bezeichnung.
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen bezieht sich auf Judas und leitet eine ihn näher bestimmende Aussage ein.
- source_word: καὶ
  choice: auch
  rationale: Im Relativsatz hat καί adverbiale Funktion und fügt Judas’ spätere Tat als weitere Kennzeichnung hinzu.
- source_word: παρέδωκεν
  choice: verriet
  rationale: Das Verb bedeutet grundsätzlich „übergeben/ausliefern“, bezeichnet in diesem Zusammenhang mit Judas als Handelndem jedoch kontextuell seinen Verrat an Jesus. „Verriet“ gibt diesen erzählerischen und moralischen Sinn natürlich wieder.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen verweist im Zusammenhang eindeutig auf Jesus.
theological_decisions:
- issue: Wiedergabe von παραδίδωμι für Judas’ Handeln an Jesus
  choice: verriet
  alternative: übergab / auslieferte
  rationale: Das griechische Verb benennt zunächst das Übergeben oder Ausliefern und trägt nicht in jedem Kontext von sich aus den Sinn „verraten“. Bei Judas und Jesus erhält es diesen Sinn jedoch durch den Erzählzusammenhang. Die Hauptlesart „verriet“ vermittelt diese Bedeutung, während die Fußnote die lexikalisch wörtlicheren Möglichkeiten bewahrt.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die geläufigen Namensformen „Judas Iskariot“ bleiben erhalten; die knappe Satzstruktur des griechischen Listenschlusses wird bewahrt.
