  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: de
  text: 'Und sooft die unreinen Geister ihn sahen, fielen sie vor ihm nieder[a] und schrien: „Du bist der Sohn Gottes!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warfen sie sich vor ihm nieder“. Das griechische Verb kann das Niederfallen vor jemandem als Ausdruck von Unterordnung oder Bitte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: die unreinen Geister
  rationale: Die direkte Wiedergabe bewahrt die im Markusevangelium etablierte Begrifflichkeit und legt ἀκάθαρτα nicht vorschnell als bloß moralisch „böse“ aus.
- source_word: ὅταν
  choice: sooft
  rationale: In Verbindung mit den folgenden Imperfektformen bezeichnet ὅταν ein wiederholtes Geschehen. „Sooft“ gibt diesen iterativen Sinn knapp und natürlich wieder.
- source_word: ἐθεώρουν
  choice: sahen
  rationale: Im narrativen Zusammenhang ist „sahen“ eine natürliche Wiedergabe; der wiederholte Charakter wird bereits durch „sooft“ ausgedrückt.
- source_word: προσέπιπτον αὐτῷ
  choice: fielen sie vor ihm nieder
  rationale: Die Formulierung bezeichnet die körperliche Niederwerfung, ohne deren Bedeutung vorschnell als Anbetung, Bitte oder freiwillige Unterwerfung festzulegen.
- source_word: ἔκραζον λέγοντα
  choice: schrien
  rationale: „Schrien“ bewahrt die Intensität von κράζω. Der Inhalt des Schreiens kann im Deutschen idiomatisch unmittelbar nach dem Doppelpunkt folgen, ohne λέγοντα eigens mit „und sagten“ abzubilden.
- source_word: Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ
  choice: Du bist der Sohn Gottes
  rationale: Die Formulierung erhält den hervorgehobenen Identitätsausspruch sowie die titelartige und christologisch gewichtige Wendung „der Sohn Gottes“.
theological_decisions:
- issue: Ob das Niederfallen der unreinen Geister als Anbetung zu bezeichnen ist
  choice: „fielen sie vor ihm nieder“
  alternative: „beteten sie ihn an“ oder „warfen sie sich vor ihm nieder“
  rationale: προσπίπτω kann eine Niederwerfung aus Unterordnung, Furcht oder Bitte bezeichnen. Da der Vers nicht ausdrücklich von Anbetung spricht, bleibt die körperliche Handlung benannt und ihre theologische Bedeutung dem Kontext überlassen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Sooft“ macht den wiederholten Vorgang deutlich; der direkte Ausruf bleibt knapp und eindringlich.
