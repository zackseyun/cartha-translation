id: MRK.3.22
reference: Mark 3:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: de
  text: 'Und die Schriftgelehrten, die aus Jerusalem herabgekommen waren, sagten: „Er hat Beelzebul[a][b]“, und: „Durch den Herrscher[c] der Dämonen treibt er die Dämonen aus.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder ausführlicher: „Er ist von Beelzebul besessen.“'
    reason: lexical_alternative
  - marker: b
    text: Griechisch Βεελζεβούλ; traditionell „Beelzebub“ genannt.
    reason: alternative_reading
  - marker: c
    text: 'Oder: „Durch den Obersten der Dämonen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Die übliche und sachlich passende Bezeichnung für anerkannte jüdische Ausleger und Lehrer des Gesetzes; sie vermeidet das Missverständnis, es handle sich lediglich um Abschreiber.
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: die aus Jerusalem herabgekommen waren
  rationale: Die Relativsatzkonstruktion klingt im Deutschen natürlich. „Herabgekommen“ bewahrt die räumliche Perspektive des griechischen καταβάντες auf das hoch gelegene Jerusalem.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das Präteritum ist im deutschen Erzählstil die natürliche Wiedergabe. Der griechische Imperfekt beschreibt die andauernde Äußerung im Rahmen der Szene, ohne zwingend eine ausdrücklich wiederholte Aussage zu verlangen.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Dies gibt die Namensform des griechischen Ausgangstextes direkt wieder; die traditionelle Form „Beelzebub“ steht in einer Fußnote.
- source_word: ἔχει
  choice: hat
  rationale: Die knappe griechische Formulierung wird bewusst bewahrt. Dass damit Besessenheit oder Beherrschung gemeint sein kann, wird in einer Fußnote erläutert, statt die Mehrdeutigkeit im Haupttext aufzulösen.
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: durch den Herrscher der Dämonen
  rationale: 'ἐν hat hier instrumentalen Sinn: Die Ankläger behaupten, Jesus handle durch die Macht des dämonischen Herrschers. „Herrscher“ ist im heutigen Deutsch klarer als das traditionelle „Oberster“.'
- source_word: δαιμονίων / δαιμόνια
  choice: Dämonen
  rationale: Dies entspricht unmittelbar dem griechischen δαιμόνιον; „unreine Geister“ wäre die Übertragung eines anderen, wenn auch verwandten Ausdrucks.
- source_word: ἐκβάλλει
  choice: treibt … aus
  rationale: „Austreiben“ ist die natürliche und etablierte deutsche Wiedergabe für das gewaltsame Entfernen von Dämonen.
theological_decisions:
- issue: Die Anklage Βεελζεβοὺλ ἔχει
  choice: Er hat Beelzebul
  alternative: Er ist von Beelzebul besessen
  rationale: Der Haupttext bewahrt die auffällig knappe griechische Wendung und damit ihre Spannung. Die im Kontext naheliegende ausdrückliche Deutung als Besessenheit wird als Alternative in der Fußnote genannt.
- issue: Wiedergabe von ἄρχων
  choice: Herrscher der Dämonen
  alternative: Oberster der Dämonen
  rationale: „Herrscher“ vermittelt die gemeinte Autoritätsstellung in gegenwärtigem Standarddeutsch. Die traditionelle Alternative wird in einer Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit geläufiger biblischer Terminologie. Die Satzstruktur bleibt nahe am griechischen Ausgangstext, ohne im Deutschen unnatürlich zu wirken; die doppelte Anklage wird klar als direkte Rede gestaltet.
