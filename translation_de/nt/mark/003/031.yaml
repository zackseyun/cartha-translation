  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Καὶ ἔρχονται⸃ ⸂ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ⸃ καὶ ἔξω ⸀στήκοντες ἀπέστειλαν πρὸς αὐτὸν ⸀καλοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: de
  text: Dann kamen seine Mutter und seine Brüder, und sie standen draußen und sandten zu ihm und ließen ihn rufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Dann
  rationale: Das satzanfängliche καί führt die Erzählung weiter; „Dann“ ist dafür im modernen deutschen Erzählstil natürlich.
- source_word: ἔρχονται
  choice: kamen
  rationale: Das griechische Präsens ist hier ein historisches Präsens; im Deutschen entspricht ihm natürlich das Präteritum.
- source_word: ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: seine Mutter und seine Brüder
  rationale: Die Verwandtschaftsbezeichnungen werden ohne interpretierende Festlegung auf die genaue Art des Bruderverhältnisses wiedergegeben.
- source_word: ἔξω στήκοντες
  choice: Sie blieben draußen stehen
  rationale: Das Partizip bezeichnet ihre Stellung außerhalb; „blieben … stehen“ gibt den andauernden Zustand idiomatisch wieder, ohne zwingend zu behaupten, dass sie zuvor im Haus waren.
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: schickten jemanden zu ihm
  rationale: Da kein ausdrückliches Objekt genannt ist, lässt die Wendung offen, ob ein Bote oder eine Botschaft geschickt wurde. Im Zusammenhang macht die personale Formulierung den Vorgang im Deutschen verständlich.
- source_word: καλοῦντες αὐτόν
  choice: um ihn rufen zu lassen
  rationale: 'Das Partizip bezeichnet hier den Zweck des Sendens: Jesus sollte herausgerufen beziehungsweise herbeigerufen werden. Die Formulierung verbindet diesen Zweck natürlich mit dem entsandten Boten.'
theological_decisions:
- issue: Bedeutung von „seine Brüder“
  choice: Wörtlich „seine Brüder“, ohne nähere Bestimmung des Verwandtschaftsverhältnisses
  alternative: „seine Verwandten“ oder eine ausdrückliche Deutung als leibliche Brüder
  rationale: ἀδελφοί bedeutet hier dem Wortlaut nach „Brüder“. Der Vers selbst entscheidet nicht ausdrücklich zwischen den in verschiedenen Traditionen vertretenen genaueren Verwandtschaftsdeutungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Partizipialkonstruktion wurde in zwei Hauptsätze und eine finale Infinitivgruppe aufgelöst, um einen natürlichen und klaren deutschen Erzählfluss zu schaffen.
