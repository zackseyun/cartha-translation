review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von „seine Mutter und seine Brüder“ sowie „draußen“ entspricht dem griechischen Wortlaut. „schickten jemanden zu ihm“ ergänzt jedoch einen ausdrücklich nicht genannten Boten und verengt damit die offene Formulierung ἀπέστειλαν πρὸς αὐτόν. Die finale Wendung „um ihn rufen zu lassen“ macht den Zweck zwar verständlich, verschiebt das koordinierte Partizip καλοῦντες jedoch stärker in eine Kausativkonstruktion.
  naturalness: „Sie blieben draußen stehen“ ist verständlich, aber weniger unmittelbar als „Sie standen draußen“. Die revidierte Satzverbindung ist modernes, klares Standarddeutsch und wahrt zugleich den knappen Erzählstil.
  terminology: „Brüder“ ist beizubehalten; eine Deutung des Verwandtschaftsverhältnisses ist nicht einzutragen. „ließen ihn rufen“ gibt καλοῦντες αὐτόν idiomatisch wieder, ohne die Richtung des Rufens weiter auszudeuten.
  issues:
  - severity: medium
    issue: „schickten jemanden zu ihm“ ergänzt einen Boten.
    rationale: Das griechische ἀπέστειλαν πρὸς αὐτόν nennt kein Objekt. Zwar legt der Kontext einen Boten oder eine Nachricht nahe, doch die Übersetzung sollte diese Einzelheit nicht ausdrücklich festlegen.
  - severity: low
    issue: „Sie blieben draußen stehen“ ist unnötig aspektuell erweitert.
    rationale: στήκοντες beschreibt ihre Stellung außerhalb; „Sie standen draußen“ ist direkter und näher am Wortlaut.
  - severity: low
    issue: Die finale Kausativgruppe gliedert die griechische Partizipialverbindung um.
    rationale: „sandten zu ihm und ließen ihn rufen“ bewahrt die Folge von Senden und Rufen klarer und bleibt idiomatisch.
  revised_text: Dann kamen seine Mutter und seine Brüder, und sie standen draußen und sandten zu ihm und ließen ihn rufen.
  revised_footnotes: []
