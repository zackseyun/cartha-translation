revisions:
- from: Dann kamen seine Mutter und seine Brüder. Sie blieben draußen stehen und schickten jemanden zu ihm, um ihn rufen zu lassen.
  to: Dann kamen seine Mutter und seine Brüder, und sie standen draußen und sandten zu ihm und ließen ihn rufen.
  rationale: Die Revision entfernt die nicht im Text genannte Ergänzung „jemanden“, gibt die räumliche Partizipialangabe unmittelbar wieder und erhält die knappe Verbindung von Senden und Rufen. Sie legt weder die Art des Gesandten noch das genaue Verwandtschaftsverhältnis der Brüder aus.
