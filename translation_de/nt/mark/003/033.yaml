base_translation:
  language: en
  yaml_path: translation/nt/mark/003/033.yaml
  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: de
  text: 'Darauf antwortet er ihnen[a]: »Wer ist meine Mutter, und wer sind meine Brüder?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher in der griechischen Satzform: »Und ihnen antwortend sagt er«. Das Griechische verbindet ein Partizip (»antwortend«) mit einem historischen Präsens (»sagt«).'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich folgt auf »Wer ist meine Mutter« die Wendung »oder meine Brüder?«; das Verb steht im Singular und richtet sich nach dem zuerst genannten Satzglied »meine Mutter«.
    reason: source_form
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: Darauf antwortet er ihnen
  rationale: Die griechische Verbindung aus Partizip und historischem Präsens wird in natürlichem Deutsch als lebendige Erzählgegenwart wiedergegeben. »Darauf« macht den Antwortbezug deutlich, ohne zusätzlichen Inhalt einzuführen.
- source_word: Τίς
  choice: Wer
  rationale: Das Interrogativpronomen fragt nach der Identität und wird unmittelbar mit »wer« wiedergegeben.
- source_word: μήτηρ
  choice: Mutter
  rationale: »Mutter« ist die sachliche, würdevolle und gegenwartssprachliche Entsprechung.
- source_word: ἢ
  choice: und
  rationale: Das griechische ἢ lautet wörtlich »oder«. In dieser zweiteiligen Identitätsfrage ist »und« im Deutschen idiomatischer; die formale Gestalt mit »oder« bleibt in der Fußnote sichtbar.
- source_word: ἀδελφοί
  choice: Brüder
  rationale: Der maskuline Plural bezeichnet im unmittelbaren Zusammenhang Jesu Brüder. »Brüder« bewahrt diese konkrete Geschlechtsangabe, ohne den Ausdruck interpretierend zu erweitern.
theological_decisions:
- issue: Familienbezeichnung ἀδελφοί
  choice: Brüder
  alternative: Geschwister; Brüder und Schwestern
  rationale: Der griechische Ausdruck ist maskuliner Plural und bezieht sich im unmittelbaren Zusammenhang konkret auf die zuvor genannten Brüder Jesu. Die Wiedergabe bleibt beim Wortlaut und entscheidet keine weitergehende konfessionelle Frage über Jesu Familie.
- issue: Form der rhetorischen Frage
  choice: Wer ist meine Mutter, und wer sind meine Brüder?
  alternative: Wer ist meine Mutter oder meine Brüder?
  rationale: Die natürliche deutsche Frage unterscheidet Singular und Plural und verwendet »und«. Die ungewöhnliche griechische Konstruktion wird nicht theologisch geglättet, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens des Markus bleibt erhalten; eine im Deutschen schwerfällige Nachbildung der griechischen Kongruenz und Konjunktion wird in die Fußnote verlagert.
