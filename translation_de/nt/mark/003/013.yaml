  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: de
  text: Dann stieg er auf den Berg und rief die zu sich, die er selbst wollte[a], und sie gingen zu ihm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die er wollte“; im Griechischen steht ein betontes „er selbst“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sie kamen zu ihm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναβαίνει
  choice: stieg … hinauf / stieg auf
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Vergangenheit wiedergegeben. Mit „auf den Berg steigen“ bleibt die Aufwärtsbewegung erhalten.
- source_word: εἰς τὸ ὄρος
  choice: auf den Berg
  rationale: In Verbindung mit ἀναβαίνει bezeichnet die Wendung die Bewegung auf einen Berg beziehungsweise in die Berglage; „auf den Berg“ ist im Deutschen idiomatisch und präzise.
- source_word: προσκαλεῖται
  choice: rief … zu sich
  rationale: Die mediale Form lässt Jesu persönliche Beteiligung hervortreten. „Zu sich rufen“ gibt dies natürlicher wieder als das förmlichere „herbeirufen“ oder „zusammenrufen“.
- source_word: οὓς ἤθελεν αὐτός
  choice: die er selbst wollte
  rationale: „Wollte“ gibt θέλω schlicht wieder; „selbst“ bewahrt die durch das ausdrückliche αὐτός gesetzte Betonung, ohne darüber hinaus eine Lehrdeutung einzutragen.
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: sie gingen zu ihm
  rationale: ἀπέρχομαι bezeichnet grundsätzlich ein Weggehen beziehungsweise Gehen. Mit πρὸς αὐτόν ist das Ziel Jesus; „gingen zu ihm“ wahrt sowohl das Verb als auch die Zielrichtung.
theological_decisions:
- issue: Betonung von Jesu eigener Auswahl
  choice: die er selbst wollte
  alternative: die er wollte
  rationale: Das ausdrückliche αὐτός betont Jesu eigene Initiative. Die Formulierung bewahrt diese Betonung, ohne daraus eine weitergehende Aussage über Erwählung oder freien Willen abzuleiten.
translation_notes:
  register: Moderner, würdiger Erzählstil. Das griechische historische Präsens wird idiomatisch im Präteritum wiedergegeben. Die knappe Wiederholung von „ihm“ folgt der Struktur des Ausgangstextes und bleibt im Deutschen verständlich.
