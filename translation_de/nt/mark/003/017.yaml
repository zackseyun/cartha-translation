id: MRK.3.17
reference: Mark 3:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: de
  text: und Jakobus, den Sohn des Zebedäus, und Johannes, den Bruder des Jakobus (er gab ihnen den Namen Boanerges[a], das heißt »Donnersöhne«),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Namen« (Mehrzahl); vermutlich ist damit ein gemeinsamer Beiname für die beiden Brüder gemeint.'
    reason: Der griechische Plural ὀνόματα wird im idiomatischen deutschen Haupttext als Singular wiedergegeben, bleibt aber als mögliche Bedeutungsnuance sichtbar.
lexical_decisions:
- source_word: Ἰάκωβον
  choice: Jakobus
  rationale: Die im Deutschen übliche neutestamentliche Namensform; sie unterscheidet den Apostel gemäß etablierter Konvention von Jakob.
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: den Sohn des Zebedäus
  rationale: Die griechische Artikel-Genitiv-Konstruktion bezeichnet hier idiomatisch die Abstammung; im Deutschen wird die Beziehung ausdrücklich mit »Sohn« wiedergegeben.
- source_word: Ἰωάννην
  choice: Johannes
  rationale: Die übliche deutsche Form des neutestamentlichen Personennamens.
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: den Bruder des Jakobus
  rationale: ἀδελφός bezeichnet hier den leiblichen Bruder; die Formulierung bildet zugleich die griechische Apposition natürlich ab.
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: ihnen gab er den Namen
  rationale: ἐπιτίθημι mit ὄνομα bedeutet idiomatisch, jemandem einen Namen oder Beinamen zu geben. Der deutsche Singular ist angesichts der einen gemeinsamen Bezeichnung »Boanerges« natürlich; der griechische Plural wird in einer Fußnote kenntlich gemacht.
- source_word: Βοανηργές
  choice: Boanerges
  rationale: Die überlieferte semitische Bezeichnung wird wie im Ausgangstext transliteriert und anschließend erklärt.
- source_word: ὅ ἐστιν
  choice: das heißt
  rationale: Die Formel leitet hier die Bedeutung beziehungsweise Übersetzung der fremdsprachigen Bezeichnung ein.
- source_word: Υἱοὶ Βροντῆς
  choice: Donnersöhne
  rationale: Das natürliche deutsche Kompositum bewahrt das markante Bild und die Funktion als gemeinsamer Beiname.
theological_decisions:
- issue: Wiedergabe des Beinamens der beiden Brüder
  choice: Die fremdsprachige Form »Boanerges« und ihre Erklärung »Donnersöhne« werden beide beibehalten.
  alternative: Nur die Bedeutung »Donnersöhne« wiedergeben.
  rationale: Der griechische Text bewahrt ausdrücklich sowohl die fremde Namensform als auch deren Deutung. Beide wiederzugeben erhält diese narrative und sprachliche Struktur, ohne den Beinamen theologisch auszudeuten.
- issue: Numerus bei ὀνόματα
  choice: Im Haupttext steht idiomatisch der Singular »den Namen«, ergänzt durch eine textnahe Fußnote zum griechischen Plural.
  alternative: Wörtlich »die Namen Boanerges«.
  rationale: Der Plural kann kollektiv auf den gemeinsamen Beinamen der zwei Brüder bezogen sein. Da unmittelbar nur eine Bezeichnung folgt, wäre der deutsche Plural missverständlich; die Fußnote bewahrt die echte formale Spannung.
translation_notes:
  register: Moderner, würdiger Standardstil. Die einleitende Kleinschreibung und das abschließende Komma spiegeln wider, dass Vers 17 syntaktisch die in Vers 16 begonnene Aufzählung fortsetzt. »Donnersöhne« ist knapp, anschaulich und im Deutschen natürlicher als »Söhne des Donners«.
