  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: de
  text: Und wenn Satan sich gegen sich selbst erhoben hat und gespalten ist, kann er nicht bestehen, sondern es ist zu Ende mit ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sondern er hat ein Ende.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: Satan
  rationale: Die im Deutschen übliche Form des Eigennamens; der griechische Artikel wird bei Eigennamen im natürlichen deutschen Sprachgebrauch nicht wiedergegeben.
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: sich gegen sich selbst erhoben hat
  rationale: Die Wendung bezeichnet hier feindseliges Auftreten gegen die eigene Person. Das Perfekt gibt im deutschen Bedingungssatz die vorausgesetzte Handlung mit ihrer fortwirkenden Folge natürlich wieder.
- source_word: ἐμερίσθη
  choice: gespalten ist
  rationale: Das Passiv bezeichnet eine innere Spaltung und zugleich den daraus entstandenen Zustand.
- source_word: οὐ δύναται στῆναι
  choice: kann er nicht bestehen
  rationale: „Bestehen“ bewahrt das Bild des Standhaltens und drückt zugleich idiomatisch aus, dass seine Herrschaft keinen Fortbestand haben kann.
- source_word: ἀλλὰ τέλος ἔχει
  choice: sondern sein Ende ist gekommen
  rationale: Diese natürliche deutsche Wendung gibt die unmittelbare Konsequenz des fehlenden Fortbestands wieder. Die wörtlichere, im Deutschen jedoch härtere Form wird in der Fußnote bewahrt.
theological_decisions:
- issue: Reichweite der Aussage über Satans Ende
  choice: Die Schlusswendung wird als logische Folge der im Bedingungssatz angenommenen Selbstspaltung formuliert.
  alternative: Die Aussage als uneingeschränkte Erklärung der endgültigen eschatologischen Niederlage Satans wiederzugeben.
  rationale: 'Im Zusammenhang führt Jesus die Anklage seiner Gegner ad absurdum: Eine in sich gespaltene satanische Herrschaft könnte nicht fortbestehen. Der Vers allein wird daher nicht zu einer umfassenderen dogmatischen Aussage erweitert.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und argumentativ; „bestehen“ nimmt die Bildsprache von στῆναι auf, ohne unnatürlich wörtlich zu wirken.
