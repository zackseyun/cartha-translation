revisions:
- from: Und wenn Satan sich gegen sich selbst erhoben hat und gespalten ist, kann er nicht bestehen, sondern sein Ende ist gekommen.[a]
  to: Und wenn Satan sich gegen sich selbst erhoben hat und gespalten ist, kann er nicht bestehen, sondern es ist zu Ende mit ihm.[a]
  rationale: Die Revision wahrt die logische Konsequenz von Jesu Argument, ohne die Aussage zu einer über den unmittelbaren Kontext hinausgehenden Erklärung eines bereits vollzogenen endgültigen Endes zu verstärken. Die idiomatische deutsche Wendung „es ist zu Ende mit ihm“ gibt τέλος ἔχει knapp und natürlich wieder; die Fußnote dokumentiert die wörtlichere Form.
