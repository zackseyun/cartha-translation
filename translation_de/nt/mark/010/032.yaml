  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: de
  text: Sie waren auf dem Weg hinauf nach Jerusalem, und Jesus ging ihnen voraus. Sie waren erstaunt, aber diejenigen, die folgten, hatten Angst. Da nahm er die Zwölf wieder beiseite[a] und begann, ihnen zu sagen, was ihm bevorstand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: nahm er die Zwölf wieder zu sich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: auf dem Weg
  rationale: Gibt sowohl die konkrete Reisesituation als auch die geläufige Wendung natürlich wieder.
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: hinauf nach Jerusalem
  rationale: Bewahrt die durch Höhenlage und Pilgergebrauch geprägte Richtungsaussage, ohne im Deutschen schwerfällig zu wirken.
- source_word: προάγων αὐτούς
  choice: ging ihnen voraus
  rationale: Beschreibt transparent Jesu Position vor der Gruppe, ohne das stärker deutende „führte sie an“ einzutragen.
- source_word: ἐθαμβοῦντο
  choice: sie waren erstaunt
  rationale: Wahrt die starke Verwunderung der ersten Gruppe und unterscheidet sie von der ausdrücklich genannten Angst der Nachfolgenden.
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: die Nachfolgenden aber
  rationale: Erhält die substantivierte Partizipialform und legt die genaue Zusammensetzung dieser Gruppe nicht fest.
- source_word: ἐφοβοῦντο
  choice: hatten Angst
  rationale: Ist eine klare, natürliche Wiedergabe des anhaltenden emotionalen Zustands.
- source_word: παραλαβὼν πάλιν τοὺς δώδεκα
  choice: nahm er die Zwölf wieder zu sich
  rationale: Gibt das erneute Heranziehen beziehungsweise Mitnehmen der Zwölf wieder, ohne eine räumliche Absonderung zwingend in den Haupttext einzutragen.
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: begann, ihnen zu sagen
  rationale: Bewahrt den inchoativen Sinn und die Angabe der Adressaten in natürlichem Deutsch.
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: was ihm bevorstand
  rationale: Drückt die bevorstehenden Ereignisse knapp und idiomatisch aus, ohne einen über den griechischen Wortlaut hinausgehenden Schicksalsbegriff einzuführen.
theological_decisions:
- issue: Unterschiedliche Reaktionen der beiden erzählten Gruppen
  choice: „sie waren erstaunt, die Nachfolgenden aber hatten Angst“
  alternative: Beide Reaktionen allgemein als Erschrecken oder Furcht wiedergeben
  rationale: Die zwei verschiedenen griechischen Verben und der Gegensatz mit δέ werden beibehalten; die narrative Spannung wird nicht harmonisiert.
- issue: Bedeutung von παραλαμβάνω im Verhältnis zu den Zwölf
  choice: „nahm er die Zwölf wieder zu sich“
  alternative: „nahm er die Zwölf wieder beiseite“
  rationale: Der Haupttext lässt offen, ob vor allem das Mitnehmen/Heranziehen oder eine ausdrückliche Absonderung gemeint ist; die kontextuell plausible engere Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, gut verständlichen Sätzen. Der Kontrast der Reaktionen bleibt sichtbar; die genaue Identität der „Nachfolgenden“ und die räumliche Nuance von παραλαμβάνω werden nicht unnötig festgelegt.
