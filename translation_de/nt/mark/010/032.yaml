  verdict: revise
  source_fidelity: Der Entwurf gibt Weg, Aufstieg nach Jerusalem, Jesu Vorausgehen, die unterschiedlichen Reaktionen und die bevorstehenden Ereignisse zuverlässig wieder. „Nahm ... wieder zu sich“ ist für παραλαβών jedoch semantisch etwas zu eng bzw. im Deutschen weniger treffend; im Kontext ist „nahm ... beiseite“ die klarere Wiedergabe, während die weniger spezifizierende Alternative in der Fußnote stehen kann.
  naturalness: „Die Nachfolgenden“ wirkt im modernen Standarddeutsch ungebräuchlich und leicht verwaltungssprachlich. „Diejenigen, die folgten“ ist natürlich und bewahrt die im Griechischen nicht näher bestimmte Gruppenbezeichnung.
  terminology: „Die Zwölf“ und „Jerusalem“ sind korrekt. „Erstaunt“ und „hatten Angst“ unterscheiden die beiden griechischen Reaktionsverben angemessen. „Was ihm bevorstand“ gibt τὰ μέλλοντα αὐτῷ συμβαίνειν idiomatisch wieder, ohne eine theologische Deutung einzutragen.
