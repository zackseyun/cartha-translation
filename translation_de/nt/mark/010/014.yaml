    rationale: »Unwillig« kann bloße Missstimmung oder Widerwillen bezeichnen, während ἠγανάκτησεν starke Entrüstung/Empörung ausdrückt. »War er empört« wahrt diese Stärke ohne unbeherrschten Zorn zu unterstellen.
  - severity: medium
    issue: Die Fußnote »Denn solcher ist das Reich Gottes« ist fehlerhaft.
    rationale: Sie gibt τῶν τοιούτων nicht als Plural wieder und erzeugt im Deutschen eine missverständliche bzw. ungrammatische Zuordnung. »Denn von solchen ist das Reich Gottes« bildet die formnähere Konstruktion verständlich ab.
