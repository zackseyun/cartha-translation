source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: de
  text: 'Aber als Jesus das sah, war er empört und sagte zu ihnen: »Lasst die Kinder zu mir kommen; hindert sie nicht! Denn solchen gehört das Reich Gottes.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Denn von solchen ist das Reich Gottes.«'
    reason: Die Fußnote dokumentiert die formnähere genitivische Wendung des Griechischen, während der Haupttext sie idiomatisch als Zugehörigkeitsaussage wiedergibt.
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: Als Jesus das sah
  rationale: Das Aoristpartizip bezeichnet den Anlass für Jesu Reaktion; »das« nimmt im Deutschen natürlich den Vorgang aus dem Kontext auf. δέ markiert hier den Übergang mit leichtem Gegensatz, der durch die Satzfolge ausreichend erkennbar bleibt.
- source_word: ἠγανάκτησεν
  choice: wurde er unwillig
  rationale: Das Verb bezeichnet starken Unwillen bzw. Entrüstung. »Wurde unwillig« ist würdig und präzise, ohne unbeherrschten Zorn zu unterstellen.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Natürliche und formgerechte Wiedergabe der griechischen Redeformel.
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: Lasst die Kinder zu mir kommen
  rationale: ἄφετε bedeutet hier »erlaubt/lasst«; die gewählte Formulierung ist im modernen Deutschen idiomatisch und bewahrt die direkte Aufforderung.
- source_word: μὴ κωλύετε αὐτά
  choice: hindert sie nicht
  rationale: κωλύω bezeichnet das Hindern oder Abhalten. Der verneinte Präsensimperativ gibt eine nachdrückliche Aufforderung wieder.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: Denn solchen gehört
  rationale: τοιούτων bezeichnet Menschen dieser Art und hat repräsentative Kraft. »Solchen gehört« gibt die Genitivkonstruktion idiomatisch wieder, ohne festzulegen, welche Eigenschaft der Kinder gemeint ist.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte deutsche Wendung bewahrt sowohl den Herrschafts- als auch den Reichsbezug des griechischen βασιλεία, ohne ihn einseitig aufzulösen.
theological_decisions:
- issue: Bedeutung von τῶν τοιούτων
  choice: »solchen« verweist repräsentativ auf Menschen wie diese Kinder
  alternative: Die Aussage ausschließlich auf die konkret anwesenden Kinder beziehen
  rationale: Das Demonstrativpronomen τοιοῦτος bezeichnet Personen dieser Art. Der Text nennt jedoch nicht ausdrücklich die maßgebliche kindliche Eigenschaft; daher wird keine Lehre über Unschuld, Status oder automatische Zugehörigkeit ergänzt.
- issue: Genitivische Aussage τῶν ... ἐστὶν ἡ βασιλεία
  choice: »solchen gehört das Reich Gottes«
  alternative: 'Wörtlicher: »denn solcher ist das Reich Gottes«'
  rationale: Die idiomatische Besitz- bzw. Zugehörigkeitsform wahrt den Sinn der griechischen Konstruktion. Eine Fußnote dokumentiert die formal nähere, aber im Deutschen sperrigere Fassung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede bleibt knapp und nachdrücklich; »unwillig« vermeidet sowohl Verharmlosung als auch eine Überzeichnung zu unbeherrschtem Zorn.
