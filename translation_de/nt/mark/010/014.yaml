  verdict: revise
  source_fidelity: Der Haupttext gibt den Satzbau, die Aufforderungen und die repräsentative Bedeutung von τῶν τοιούτων zutreffend wieder. »Unwillig« schwächt ἠγανάκτησεν jedoch merklich ab; das Verb bezeichnet hier deutliches Entrüstetsein. Die Fußnote ist zudem grammatisch und semantisch fehlerhaft, weil »solcher« weder den griechischen Plural noch dessen genitivische Konstruktion angemessen abbildet.
  naturalness: »Aber als Jesus das sah, war er empört« ist modernes, natürliches Standarddeutsch und trägt sowohl den Kontrast von δέ als auch die Stärke der Reaktion. Die direkte Rede bleibt knapp und würdig.
  terminology: »Kinder«, »hindert sie nicht«, »solchen gehört« und »Reich Gottes« sind treffend und konsistent. Die Formulierung legt keine bestimmte Eigenschaft der Kinder und keine weitergehende theologische Folgerung fest.
