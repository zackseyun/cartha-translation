  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δὸς ἡμῖν ἵνα εἷς ⸂σου ἐκ δεξιῶν⸃ καὶ εἷς ἐξ ⸀ἀριστερῶν καθίσωμεν ἐν τῇ δόξῃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: de
  text: 'Sie sagten zu ihm: »Gewähre uns, dass wir, einer zu deiner Rechten und einer zu deiner Linken, in deiner Herrlichkeit sitzen dürfen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: Gewähre uns
  rationale: Gibt die Bitte idiomatisch und würdevoll wieder; das ausdrückliche ἡμῖν bleibt als »uns« erhalten.
- source_word: εἷς … καὶ εἷς
  choice: einer von uns … und einer
  rationale: Im Kontext sind die beiden Sprecher selbst gemeint; »von uns« macht den im Griechischen kontextuell erschlossenen Bezug im Deutschen natürlich verständlich.
- source_word: ἐκ δεξιῶν … ἐξ ἀριστερῶν
  choice: zu deiner Rechten … zu deiner Linken
  rationale: Bewahrt die traditionelle und im Deutschen natürliche Bezeichnung der Ehrenplätze an beiden Seiten.
- source_word: ἐν τῇ δόξῃ σου
  choice: wenn du in deiner Herrlichkeit bist
  rationale: Gibt die situative Bedeutung von ἐν natürlich wieder, ohne die Herrlichkeit mit einem Ort oder einem politischen Reich gleichzusetzen.
theological_decisions:
- issue: Bedeutung von »in deiner Herrlichkeit«
  choice: wenn du in deiner Herrlichkeit bist
  alternative: in deiner Herrlichkeit
  rationale: Die gewählte Formulierung zeigt, dass die erbetenen Sitzplätze mit Jesu Offenbarung in Herrlichkeit verbunden sind, legt aber weder Zeitpunkt noch genaue Gestalt dieser Herrlichkeit fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede bleibt knapp und eindringlich; die parallele Satzstruktur des Griechischen wird bewahrt.
