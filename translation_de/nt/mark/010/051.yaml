  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: de
  text: 'Jesus antwortete ihm und fragte: „Was willst du, dass ich für dich tue?“ Der Blinde sagte zu ihm: „Rabbuni[a], dass ich wieder sehen kann.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabbuni ist eine aramäische Anrede und bedeutet „mein Lehrer“ oder „mein Meister“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: fragte
  rationale: Die griechische Verbindung aus Partizip und finitem Verb ist eine geläufige Redeformel. Im Deutschen gibt „fragte“ die Funktion der direkten Frage natürlich und knapp wieder; ein vorausgehendes „antwortete“ wäre hier trotz der formalen Nähe unidiomatisch, da Jesus keine ausgesprochene Frage beantwortet.
- source_word: Τί σοι θέλεις ποιήσω
  choice: Was soll ich für dich tun?
  rationale: „Für dich“ bildet den Dativ σοι ab. Die deutsche Wendung mit „soll“ gibt im Kontext den vom Angesprochenen gewünschten Auftrag natürlich wieder, ohne den Sinn von θέλεις zu verlieren.
- source_word: ὁ … τυφλὸς
  choice: Der Blinde
  rationale: Das substantivierte Adjektiv lässt sich im Deutschen unmittelbar und idiomatisch mit „der Blinde“ wiedergeben.
- source_word: Ραββουνι
  choice: Rabbuni
  rationale: Die im griechischen Text bewahrte semitische Anrede wird transliteriert, damit ihre besondere sprachliche Färbung erhalten bleibt; die Bedeutung wird in einer Fußnote erläutert.
- source_word: ἵνα ἀναβλέψω
  choice: ich möchte wieder sehen können
  rationale: In diesem Heilungskontext bedeutet ἀναβλέπω, das Augenlicht wiederzuerlangen. Die Formulierung ist eine natürliche deutsche Antwort auf Jesu Frage und gibt den begehrten Inhalt der ἵνα-Konstruktion wieder.
theological_decisions:
- issue: Wiedergabe der Anrede Ραββουνι
  choice: „Rabbuni“ im Haupttext mit erklärender Fußnote
  alternative: „mein Lehrer“ oder „mein Meister“
  rationale: Da bereits der griechische Text die semitische Anrede transliteriert, bewahrt auch die deutsche Fassung diese Textgestalt. Die Fußnote erklärt den Bedeutungsumfang, ohne ihn im Haupttext vorschnell auf eine einzige deutsche Entsprechung festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist natürlich formuliert; die semitische Anrede bleibt als historisch markantes Element erhalten.
