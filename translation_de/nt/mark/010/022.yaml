  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: de
  text: Doch bei diesem Wort verdüsterte sich sein Gesicht[a], und er ging bekümmert weg; denn er hatte viele Besitztümer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „wurde er bei diesem Wort düster“; gemeint ist wahrscheinlich eine sichtbar finstere oder niedergeschlagene Miene.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „viel Eigentum“ beziehungsweise „viele Güter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: verdüsterte sich sein Gesicht
  rationale: Das Partizip bezeichnet ein sichtbar düsteres oder finsteres Reagieren. Die deutsche Wendung bewahrt das Bild eines verdunkelten Gesichtsausdrucks, ohne dem Mann Zorn oder eine andere im Text nicht ausdrücklich genannte Haltung zuzuschreiben.
- source_word: ἐπὶ τῷ λόγῳ
  choice: bei diesem Wort
  rationale: Die Formulierung gibt den Anlass beziehungsweise Grund seiner Reaktion wieder und bewahrt den Singular von λόγος. „Diesem“ stellt im Deutschen den natürlichen Rückbezug auf Jesu unmittelbar vorausgehende Aussage her.
- source_word: ἀπῆλθεν
  choice: ging … weg
  rationale: Diese Formulierung ist in modernem Deutsch natürlich und gibt die erzählte Bewegung schlicht wieder.
- source_word: λυπούμενος
  choice: bekümmert
  rationale: Das präsentische Partizip beschreibt den anhaltenden Kummer, mit dem der Mann weggeht. „Bekümmert“ ist würdevoll und gewichtig, ohne den Ausdruck unnötig zu verstärken.
- source_word: κτήματα πολλά
  choice: viele Besitztümer
  rationale: κτήματα bezeichnet erworbenen Besitz, Eigentum oder Güter; πολλά hebt deren Vielzahl beziehungsweise großen Umfang hervor. „Viele Besitztümer“ folgt dieser Aussage genauer als eine bloße allgemeine Bezeichnung als reich.
- source_word: ἦν γὰρ ἔχων
  choice: denn er hatte
  rationale: Die periphrastische Konstruktion bezeichnet seinen fortdauernden Besitzstand. Im natürlichen Deutschen wird dies knapp mit „er hatte“ ausgedrückt.
theological_decisions:
- issue: Art der emotionalen Reaktion des Mannes auf Jesu Aussage
  choice: Die Übersetzung schildert einen sichtbar verdüsterten Ausdruck und anhaltenden Kummer, ohne eine moralische Bewertung hinzuzufügen.
  alternative: Die Reaktion ausdrücklich als Zorn, Trotz oder bloße Enttäuschung zu bestimmen.
  rationale: Der griechische Text beschreibt sichtbare Düsternis und Bekümmernis, benennt aber weder Zorn noch offene Auflehnung. Die erzählerische und theologische Spannung bleibt daher bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das Semikolon hält die begründende Nachsatzstruktur deutlich; die Bildhaftigkeit der sichtbaren Reaktion wird bewahrt.
