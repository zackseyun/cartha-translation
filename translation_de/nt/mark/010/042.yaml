source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: de
  text: 'Jesus rief sie zu sich und sagte zu ihnen: „Ihr wisst, dass diejenigen, die als Herrscher der Völker[a] gelten[b], gebieterisch über sie herrschen und ihre Großen Macht über sie ausüben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Nichtjuden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Herrscher der Völker zu sein scheinen“.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: rief … zu sich
  rationale: Die mediale Form bezeichnet hier, dass Jesus die Jünger zu sich ruft. Die deutsche Wendung ist natürlich und bewahrt diese räumlich-relationale Nuance.
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Οἴδατε
  choice: Ihr wisst
  rationale: οἶδα hat trotz seiner Perfektform präsentische Bedeutung; „ihr wisst“ ist die direkte und idiomatische Entsprechung.
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: diejenigen, die als Herrscher … gelten
  rationale: δοκέω kann ausdrücken, dass jemand als etwas gilt oder angesehen wird. Die Formulierung lässt die öffentliche Anerkennung ihrer Herrschaft erkennen, ohne die mögliche Nuance bloß scheinbarer Herrschaft ganz auszuschließen.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: ἔθνη bezeichnet hier die nichtjüdischen Völker. „Völker“ ist im modernen Deutsch natürlich und bewahrt die kollektive Bedeutung; die kontextuelle Bedeutung „Nichtjuden“ wird in einer Fußnote genannt.
- source_word: κατακυριεύουσιν
  choice: spielen sich als Herren über sie auf
  rationale: Das zusammengesetzte Verb bezeichnet ein beherrschendes, übergriffiges Herrsein. Die Wendung gibt die negative Färbung wieder und greift zugleich das Motiv des Herrseins auf.
- source_word: οἱ μεγάλοι αὐτῶν
  choice: ihre Großen
  rationale: Gemeint sind die gesellschaftlich Mächtigen oder Bedeutenden. „Ihre Großen“ bewahrt die knappe, parallele und nicht auf ein bestimmtes Amt festgelegte Ausdrucksweise.
- source_word: κατεξουσιάζουσιν
  choice: lassen sie ihre Macht spüren
  rationale: Das Verb bezeichnet die machtvolle, hier negativ gefärbte Ausübung von Autorität. Die Formulierung klingt im Deutschen natürlich und unterscheidet sich zugleich vom stärkeren Bild des vorherigen Verbs.
theological_decisions:
- issue: Bezug von τῶν ἐθνῶν
  choice: Völker
  alternative: Nichtjuden
  rationale: Im jüdischen Kontext kann ἔθνη ausdrücklich die nichtjüdischen Völker bezeichnen. „Völker“ bleibt näher an der Grundbedeutung und vermeidet eine unnötige Festlegung im Haupttext; die kontextuelle Alternative steht in der Fußnote.
- issue: Bedeutung von δοκοῦντες
  choice: als Herrscher gelten
  alternative: Herrscher zu sein scheinen
  rationale: Die Wendung kann öffentliche Anerkennung oder bloßen Anschein ausdrücken. Der Haupttext wählt die im Kontext wahrscheinlichere Bedeutung, ohne die echte lexikalische Mehrdeutigkeit zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und eindringlich. Die beiden negativen Verben werden idiomatisch, aber mit unterschiedlicher Bildwirkung wiedergegeben.
