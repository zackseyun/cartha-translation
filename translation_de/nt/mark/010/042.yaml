revisions:
- from: 'Da rief Jesus sie zu sich und sagte zu ihnen: „Ihr wisst: Diejenigen, die als Herrscher der Völker[a] gelten[b], spielen sich als Herren über sie auf, und ihre Großen lassen sie ihre Macht spüren.“'
  to: 'Jesus rief sie zu sich und sagte zu ihnen: „Ihr wisst, dass diejenigen, die als Herrscher der Völker[a] gelten[b], gebieterisch über sie herrschen und ihre Großen Macht über sie ausüben.“'
  rationale: Die Revision ersetzt zwei interpretierendere, stärker umgangssprachliche Wendungen durch direkte, natürliche Formulierungen. Sie bewahrt die negative bzw. dominante Färbung von κατακυριεύω mit „gebieterisch“, ohne die tatsächliche Herrscherstellung zu bestreiten, und gibt κατεξουσιάζω als Ausübung von Macht wieder. Die Fußnotenanker bleiben am passenden Ausdruck; Fußnote b wird inhaltlich vervollständigt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:42:14Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzstruktur, die öffentliche Zuschreibung in δοκοῦντες und den Bezug von τῶν ἐθνῶν grundsätzlich zutreffend wieder. „Spielen sich als Herren ... auf“ kann jedoch nahelegen, die Betreffenden nähmen lediglich eine nicht bestehende Stellung für sich in Anspruch. κατακυριεύουσιν bezeichnet vielmehr die tatsächliche, dominierende Ausübung von Herrschaft. Die zweite Wendung sollte die Ausübung von Autorität bzw. Macht direkter wiedergeben.
  naturalness: „Herrscher der Völker“ und „ihre Großen“ sind in einem knappen, würdigen Bibelregister verständlich. „Gebieterisch über sie herrschen“ und „Macht über sie ausüben“ sind modernes Standarddeutsch und bewahren zugleich die parallele, abgestufte Aussage besser als die umgangssprachlichere Formulierung des Entwurfs.
  terminology: „Völker“ ist eine zulässige, quellennahe Wiedergabe von ἐθνῶν; die Fußnote nennt mit „Nichtjuden“ die kontextuell mögliche Alternative. Die Fußnote zu δοκοῦντες wird vollständig formuliert, damit auch dort der Bezug zu den Völkern erhalten bleibt.
