  - severity: medium
    issue: „spielen sich als Herren über sie auf“ für κατακυριεύουσιν
    rationale: Die deutsche Redewendung hebt den Anschein bzw. die Anmaßung stärker hervor als der griechische Ausdruck. Dadurch kann sie die tatsächliche Herrschaft, die der Satz voraussetzt, unnötig infrage stellen.
  - severity: low
    issue: „lassen sie ihre Macht spüren“ für κατεξουσιάζουσιν
    rationale: Die Formulierung ist idiomatisch, fügt aber das Bild eines ausdrücklich spürbaren Leidens hinzu. „Macht über sie ausüben“ bildet die verbale Aussage unmittelbarer ab und wahrt die Unterscheidung zum vorangehenden Verb.
  - severity: low
