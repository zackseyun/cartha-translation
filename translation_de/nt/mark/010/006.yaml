    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: Doch von Anfang der Schöpfung an
  rationale: δέ setzt hier einen Gegensatz zur vorausgehenden Zugeständnisregelung über die Scheidung. Die Wendung „von … an“ gibt ἀπό als zeitlichen Ausgangspunkt im Deutschen natürlich wieder; κτίσεως bleibt als „der Schöpfung“ breit und unverkürzt.
- source_word: ἄρσεν καὶ θῆλυ
  choice: als Mann und Frau
  rationale: Die Formulierung gibt das geschlechtliche Gegenüber der Genesis-Anspielung in natürlichem, würdevollem Deutsch wieder. Die formal nähere Wiedergabe „männlich und weiblich“ wird in der Fußnote genannt.
- source_word: ἐποίησεν
  choice: machte
  rationale: „Machte“ entspricht dem gewöhnlichen Sinn von ποιέω und vermeidet, das im griechischen Text nicht verwendete κτίζω einzutragen. Wegen des Schöpfungshintergrunds ist „schuf“ jedoch eine sachlich mögliche Alternative.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen wird ohne den nicht ausdrücklich vorhandenen Zusatz „beide“ wiedergegeben; sein Bezug ergibt sich aus „Mann und Frau“.
theological_decisions:
- issue: Wiedergabe der Geschlechtsbegriffe im Genesis-Zitat
  choice: als Mann und Frau
  alternative: männlich und weiblich
  rationale: Die Hauptfassung ist im modernen Deutschen idiomatisch und bewahrt das geschlechtliche Gegenüber. Die Fußnote hält die formal engere Wiedergabe sichtbar, ohne die Aussage durch soziale oder konfessionelle Zusatzbegriffe auszudeuten.
- issue: Nicht ausdrücklich genanntes göttliches Subjekt
  choice: er machte sie
  alternative: Gott machte sie
  rationale: Die Verbform hat ein nur aus Zusammenhang und Genesis-Zitat erschließbares Subjekt. Das Pronomen „er“ wahrt diese Implizitheit; „Gott“ wäre eine erklärende Ergänzung.
- issue: ποιέω im Schöpfungskontext
  choice: machte
  alternative: schuf
  rationale: Die Hauptfassung folgt dem verwendeten Verb möglichst transparent. Zugleich wird „schuf“ als vom Genesis-Hintergrund gestützte Alternative angegeben, ohne beide Verben gleichzusetzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung ist natürlich deutsch; „Doch“ macht den Gegensatz zum vorigen Kontext deutlich. Die beiden Fußnoten dokumentieren sowohl die quellennähere Form der Geschlechtsbegriffe als auch die durch Genesis nahegelegte Verbalalternative.
