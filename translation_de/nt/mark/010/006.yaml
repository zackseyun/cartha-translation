  text: But from the beginning of creation[b][a], he made them male and female.
translation:
  language: de
  text: Doch von Anfang der Schöpfung an machte[b] er sie männlich und weiblich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Mann und Frau“.'
