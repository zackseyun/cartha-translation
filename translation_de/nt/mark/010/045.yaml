  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: de
  text: Denn auch der Menschensohn ist nicht gekommen, um sich dienen zu lassen, sondern um zu dienen und sein Leben als Lösegeld für viele[a] zu geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als Lösegeld anstelle vieler«. Die griechische Präposition, die hier mit »für« wiedergegeben ist, kann Austausch oder Stellvertretung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Denn auch
  rationale: Die Verbindung begründet die vorausgehende Aussage und hebt zugleich den Menschensohn als maßgebliches Beispiel hervor.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung und ihren Bezug zu Daniel 7.
- source_word: οὐκ ἦλθεν
  choice: ist nicht gekommen
  rationale: Die schlichte Wiedergabe lässt die folgenden Infinitive den Zweck seines Kommens ausdrücken.
- source_word: διακονηθῆναι
  choice: um sich dienen zu lassen
  rationale: Diese natürliche deutsche Formulierung gibt das Passiv wieder und bildet mit »um zu dienen« einen klaren rhetorischen Gegensatz.
- source_word: ἀλλὰ διακονῆσαι
  choice: sondern um zu dienen
  rationale: Die Wiederholung desselben deutschen Wortstamms bewahrt die pointierte Umkehrung des griechischen Satzes.
- source_word: δοῦναι
  choice: zu geben
  rationale: »Geben« entspricht der Grundbedeutung des Verbs, ohne eine speziellere Art der Hingabe in den Wortlaut einzutragen.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή bezeichnet hier das Leben, das bis in den Tod hingegeben wird, nicht bloß eine vom Körper unterschiedene Seele.
- source_word: λύτρον
  choice: Lösegeld
  rationale: Der Ausdruck bezeichnet einen Preis zur Freilassung und bewahrt das prägnante Bild des griechischen Wortes.
- source_word: ἀντὶ πολλῶν
  choice: für viele
  rationale: »Für viele« ist im Deutschen idiomatisch und traditionsnah; die bei ἀντί naheliegende Bedeutung von Stellvertretung oder Austausch wird in der Fußnote ausdrücklich festgehalten.
theological_decisions:
- issue: Bedeutung von ἀντί in der Lösegeld-Aussage
  choice: Im Haupttext steht das idiomatische »für viele«, ergänzt durch eine Fußnote zur stellvertretenden Bedeutung.
  alternative: »an der Stelle vieler« oder »anstelle vieler«
  rationale: ἀντί bezeichnet hier am ehesten Austausch beziehungsweise Stellvertretung. Die Hauptfassung bleibt natürlich lesbar, während die Fußnote die stärkere lexikalische Nuance offenlegt, ohne die theologische Spannung stillschweigend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung »sich dienen zu lassen … zu dienen« erhält den rhetorischen Gegensatz; »Menschensohn« und »Lösegeld« bewahren die intertextuelle und bildhafte Prägung.
