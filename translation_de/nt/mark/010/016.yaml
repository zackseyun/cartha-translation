  text: καὶ ἐναγκαλισάμενος αὐτὰ ⸂κατευλόγει τιθεὶς τὰς χεῖρας ἐπ’ αὐτά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: de
  text: Und er nahm sie in die Arme und segnete sie immer wieder[a], wobei er ihnen die Hände auflegte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Verbform kann ein fortgesetztes, wiederholtes oder besonders nachdrückliches Segnen bezeichnen; auch möglich: „segnete sie innig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: nahm sie in die Arme
  rationale: Das Partizip bezeichnet konkret das Aufnehmen in die Arme. Diese natürliche deutsche Formulierung bewahrt die körperliche Zuwendung genauer als das allgemeinere „umarmte“.
- source_word: κατευλόγει
  choice: segnete sie immer wieder
  rationale: Das Imperfekt stellt die Handlung als andauernd oder wiederholt dar; zudem kann die verstärkte Verbform ein nachdrückliches Segnen ausdrücken. „segnete sie immer wieder“ gibt den Verlaufsaspekt verständlich wieder, ohne die Art des Segens näher festzulegen.
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: wobei er ihnen die Hände auflegte
  rationale: Das Partizip beschreibt eine begleitende Handlung. „die Hände auflegen“ ist im Deutschen idiomatisch und bewahrt die konkrete Geste des griechischen Textes.
- source_word: αὐτὰ ... αὐτά
  choice: sie ... ihnen
  rationale: Die Pronomen beziehen sich auf die zuvor genannten Kinder. Deutsche Pronomen genügen im unmittelbaren Zusammenhang und vermeiden eine unnötige Wiederholung.
- source_word: καὶ
  choice: Und
  rationale: Die schlichte Verbindung entspricht Markus’ Erzählstil, ohne zusätzlich eine zeitliche oder folgernde Beziehung einzutragen.
theological_decisions:
- issue: Art von Jesu Handeln an den Kindern
  choice: Die konkreten Handlungen – in die Arme nehmen, segnen und die Hände auflegen – werden ohne zusätzliche kultische oder sakramentale Terminologie wiedergegeben.
  alternative: „Er vollzog an ihnen unter Handauflegung einen Segen.“
  rationale: Der griechische Text schildert liebevolle körperliche Zuwendung und Segnung, bestimmt jedoch keine spätere lehrmäßige Kategorie. Diese Offenheit bleibt erhalten.
- issue: Aspekt und Intensität von κατευλόγει
  choice: „segnete sie immer wieder“ gibt vor allem den durativen beziehungsweise wiederholten Aspekt wieder.
  alternative: „segnete sie innig“ oder schlicht „segnete sie“
  rationale: Die genaue Verbindung von Imperfekt und verstärkter Verbform lässt sowohl fortgesetztes beziehungsweise wiederholtes als auch nachdrückliches Segnen anklingen. Der Haupttext stellt den gut erkennbaren Verlaufsaspekt dar; die Fußnote bewahrt die weitere Möglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt flüssig und anschaulich; „wobei“ macht die Gleichzeitigkeit der Handauflegung natürlich verständlich. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
