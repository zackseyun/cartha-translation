id: MRK.10.34
reference: Mark 10:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: de
  text: Und sie werden ihn verspotten, ihn anspucken und auspeitschen und töten. Und nach drei Tagen[a] wird er auferstehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in drei Tagen“. Im Griechischen bei Markus steht „nach drei Tagen“; andere Stellen formulieren die Zeitangabe als „am dritten Tag“.'
    reason: Die Fußnote kennzeichnet die mögliche idiomatische Wiedergabe der Zeitangabe und erklärt zugleich den Unterschied zu anders formulierten Parallelstellen, ohne den markinischen Wortlaut im Haupttext zu harmonisieren.
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: werden ihn verspotten
  rationale: „Verspotten“ gibt die feindselige Verhöhnung und verächtliche Behandlung präzise, natürlich und würdig wieder.
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: ihn anspucken
  rationale: Die Verbindung bezeichnet ein gegen ihn gerichtetes Spucken als Erniedrigung; „jemanden anspucken“ ist dafür die idiomatische deutsche Formulierung.
- source_word: μαστιγώσουσιν
  choice: werden auspeitschen
  rationale: „Auspeitschen“ ist im heutigen Deutsch verständlich und vermittelt eine schwere körperliche Bestrafung, ohne das altertümliche „geißeln“ zu verwenden.
- source_word: ἀποκτενοῦσιν
  choice: werden töten
  rationale: Das schlichte „töten“ entspricht dem Verb, ohne eine rechtliche Einordnung wie „hinrichten“ oder eine zusätzliche moralische Wertung wie „ermorden“ einzutragen.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: nach drei Tagen
  rationale: μετά mit Akkusativ bedeutet hier regulär „nach“. Die markinische Formulierung wird beibehalten und nicht stillschweigend an „am dritten Tag“ in anderen Stellen angeglichen.
- source_word: ἀναστήσεται
  choice: wird er auferstehen
  rationale: Die mediale Zukunftsform lässt sich natürlich intransitiv wiedergeben. „Auferstehen“ ist im Deutschen für die Rückkehr vom Tod zum Leben klarer als das allgemeinere „aufstehen“; ein zusätzliches „wieder“ steht nicht ausdrücklich im Griechischen.
theological_decisions:
- issue: Formulierung der Auferstehung
  choice: wird er auferstehen
  alternative: wird er auferweckt werden; wird er wieder auferstehen
  rationale: Die griechische mediale Form ἀναστήσεται stützt eine intransitive Wiedergabe. Dadurch wird die Formulierung dieser Stelle bewahrt, ohne andere neutestamentliche Aussagen, nach denen Gott Jesus auferweckt, in den Vers einzutragen. „Wieder“ wird nicht ergänzt, da es nicht ausdrücklich im Ausgangstext steht.
- issue: Zeitangabe der Auferstehung
  choice: nach drei Tagen
  alternative: am dritten Tag; binnen drei Tagen
  rationale: Die eigentliche Formulierung des Markus wird bewahrt. Eine Harmonisierung mit anders formulierten Parallelstellen würde die sprachliche Spannung voreilig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die koordinierten Verben folgen der eindringlichen Reihung des Griechischen; vor dem abschließenden Auferstehungssatz steht zur natürlichen deutschen Gliederung ein Satzpunkt.
