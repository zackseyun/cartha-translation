  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτῷ· Διδάσκαλε, ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: de
  text: 'Er sagte zu ihm: »Lehrer, all das habe ich von meiner Jugend an befolgt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Das gewöhnliche deutsche Erzählverb gibt das griechische Redeverb natürlich und präzise wieder.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Der Vokativ bezeichnet unmittelbar einen Lehrenden; »Lehrer« bewahrt den schlichten lexikalischen Sinn besser als das traditionellere »Meister«.
- source_word: ταῦτα πάντα
  choice: das alles
  rationale: Die idiomatische deutsche Wendung fasst die unmittelbar zuvor genannten Gebote zusammen, ohne einen zusätzlichen Gegenstand einzuführen.
- source_word: ἐφυλαξάμην
  choice: habe ich … gehalten
  rationale: Im Zusammenhang mit Geboten bedeutet φυλάσσω, sie zu halten beziehungsweise zu beachten. Das deutsche Perfekt stellt die bisherige Lebensführung als bis zur Gegenwart reichend dar.
- source_word: ἐκ νεότητός μου
  choice: von meiner Jugend an
  rationale: Die Wendung gibt den zeitlichen Ausgangspunkt von ἐκ mit Genitiv genau und im Deutschen natürlich wieder.
- source_word: ὁ δὲ
  choice: Er
  rationale: δέ ist hier ein leichter narrativer Anschluss. Im Deutschen kann der Zusammenhang ohne ein ausdrücklich wiedergegebenes »und« oder das stärker kontrastierende »aber« natürlich fortgeführt werden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng am griechischen Satz und vermeidet sowohl altertümliches »Meister« als auch das stärker deutende »befolgt«.
