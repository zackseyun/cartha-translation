  source_fidelity: 'Der Entwurf gibt alle Sinnelemente des griechischen Textes wieder: die narrative Anknüpfung, die Anrede, die Gesamtheit des zuvor Genannten, das Halten/Beachten und den Zeitraum seit der Jugend. Die aoristische Aussage kann im Deutschen idiomatisch als Perfekt stehen.'
  naturalness: „Das alles … gehalten“ ist zwar verständlich, klingt im heutigen Standarddeutsch bei einem nicht ausdrücklich genannten Objekt jedoch weniger idiomatisch. Mit „befolgt“ wird die im Kontext von Geboten übliche deutsche Verbindung erreicht, ohne den Sinn zu verändern.
  terminology: „Lehrer“ ist für Διδάσκαλε sachgerecht und vermeidet die zusätzlich konnotierte traditionelle Anrede „Meister“. „Befolgt“ ist hier eine natürliche kontextuelle Wiedergabe von ἐφυλαξάμην; es behauptet nicht mehr als das Halten der zuvor genannten Weisungen.
  issues:
