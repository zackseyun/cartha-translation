source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: de
  text: 'Du kennst die Gebote: Du sollst nicht morden[a], du sollst nicht die Ehe brechen, du sollst nicht stehlen, du sollst kein falsches Zeugnis ablegen, du sollst niemandem vorenthalten, was ihm zusteht[b]; ehre deinen Vater und deine Mutter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du sollst nicht töten.“ Das griechische Verb bezeichnet hier genauer Mord oder widerrechtliches Töten; deshalb steht im Text „morden“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Du sollst nicht vorenthalten.“ Gemeint ist, einem Menschen das zu entziehen oder vorzuenthalten, was ihm zusteht; je nach Zusammenhang kann das auch „betrügen“ oder „berauben“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολάς
  choice: die Gebote
  rationale: Die bestimmte Formulierung und die folgende Aufzählung verweisen deutlich auf die Gebote des Dekalogs; „Gebote“ ist dafür die natürliche und vertraute deutsche Bezeichnung.
- source_word: οἶδας
  choice: du kennst
  rationale: Das formal perfekte οἶδα hat im Koine-Griechischen präsentische Bedeutung. Bei bekannten Vorschriften ist „du kennst die Gebote“ im Deutschen idiomatischer als „du weißt die Gebote“.
- source_word: Μὴ φονεύσῃς
  choice: Du sollst nicht morden
  rationale: φονεύω bezeichnet hier nicht jedes Töten unterschiedslos, sondern insbesondere Mord beziehungsweise widerrechtliches Töten. Die Soll-Form wahrt den vertrauten Gebotsstil.
- source_word: Μὴ μοιχεύσῃς
  choice: du sollst nicht die Ehe brechen
  rationale: Die Wendung gibt μοιχεύω im rechtlich-moralischen Zusammenhang präzise und in vertrauter deutscher Gebotssprache wieder.
- source_word: Μὴ κλέψῃς
  choice: du sollst nicht stehlen
  rationale: Dies ist die direkte und geläufige Wiedergabe von κλέπτω innerhalb einer Gebotsreihe.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: du sollst kein falsches Zeugnis ablegen
  rationale: Die Wiedergabe bewahrt die rechtliche und zeugenschaftliche Bedeutung von ψευδομαρτυρέω und verengt die Aussage nicht auf ein allgemeines Lügenverbot.
- source_word: Μὴ ἀποστερήσῃς
  choice: du sollst niemandem vorenthalten, was ihm zusteht
  rationale: ἀποστερέω bezeichnet, jemandem das zu entziehen oder vorzuenthalten, worauf er Anspruch hat, oft in einem ausbeuterischen Zusammenhang. Die Formulierung ist im heutigen Deutsch klarer und semantisch breiter als das mögliche „betrügen“.
- source_word: Τίμα
  choice: ehre
  rationale: „Ehre“ bewahrt im Gebotszusammenhang den stärkeren Sinn von τιμάω und ist treffender als das schwächere „respektiere“.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: deinen Vater und deine Mutter
  rationale: Die Wiederholung des Possessivartikels entspricht natürlichem Deutsch und bewahrt die ausdrückliche Nennung beider Elternteile.
theological_decisions:
- issue: Wiedergabe der Dekaloggebote
  choice: Vertraute deutsche Gebotssprache mit „Du sollst nicht“, verbunden mit lexikalischer Präzision
  alternative: Durchgehend unmittelbare Verbote mit „Morde nicht“ oder die traditionell weitere Formulierung „Du sollst nicht töten“
  rationale: Die erkennbare Anspielung auf den Dekalog spricht für den vertrauten Gebotsstil. Zugleich verlangt φονεύω die präzisere Wiedergabe „morden“, damit das Verbot nicht ohne textliche Grundlage auf jede Form des Tötens ausgeweitet wird.
- issue: Bedeutungsumfang von ἀποστερέω
  choice: niemandem vorenthalten, was ihm zusteht
  alternative: nicht betrügen; nicht berauben
  rationale: Der griechische Ausdruck kann Entzug, Vorenthaltung, Ausbeutung oder betrügerische Schädigung bezeichnen. Die gewählte Formulierung erhält diesen Umfang, ohne ihn ausschließlich auf eine bestimmte juristische Form des Betrugs oder Raubes festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die wiederholte Form „Du sollst nicht“ macht den Dekalogbezug unmittelbar erkennbar. Das Semikolon vor dem positiven Schlussgebot gliedert die Reihe, ohne den Zusammenhang aufzulösen.
