  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: de
  text: 'Und viele wiesen ihn scharf zurecht, damit er schweige. Er aber rief nur umso mehr: „Sohn Davids, hab Erbarmen mit mir!“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sohn Davids“ ist ein königlich-messianischer Titel; sinngemäß könnte man auch „Messias“ sagen, doch hier bleibt der griechische Wortlaut erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: wiesen ihn scharf zurecht
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Zurechtweisen; „scharf zurechtweisen“ bewahrt die deutliche Kraft des Verbs im Zusammenhang des Versuchs, ihn zum Schweigen zu bringen.
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv wird direkt wiedergegeben, ohne ausdrücklich „die Menge“ einzutragen.
- source_word: ἵνα σιωπήσῃ
  choice: damit er schweige
  rationale: Die Formulierung gibt den Zwecksinn von ἵνα wieder und entspricht einem natürlichen, würdigen deutschen Sprachgebrauch.
- source_word: πολλῷ μᾶλλον
  choice: nur umso mehr
  rationale: Die idiomatische Wiedergabe drückt die starke Steigerung aus, ohne die nicht ausdrücklich genannte Angabe „lauter“ hinzuzufügen.
- source_word: ἔκραζεν
  choice: rief
  rationale: „Rief“ vermittelt den nachdrücklichen Ruf; zusammen mit „umso mehr“ bleibt der fortdauernde Charakter des Imperfekts im Kontext erkennbar, ohne im Deutschen schwerfällig zu wirken.
- source_word: Υἱὲ Δαυίδ
  choice: Sohn Davids
  rationale: Die wörtliche Wiedergabe bewahrt den königlich-messianischen Titel und seine biblischen Anklänge.
- source_word: ἐλέησόν με
  choice: hab Erbarmen mit mir
  rationale: Die feste deutsche Bittform gibt den dringlichen Imperativ angemessen wieder und bewahrt das theologische Gewicht von ἐλεέω.
theological_decisions:
- issue: Messianische Bedeutung von „Sohn Davids“
  choice: Der Titel wird als „Sohn Davids“ beibehalten.
  alternative: „Messias“
  rationale: Der griechische Text nennt ausdrücklich den davidischen Sohnestitel. Seine Übersetzung statt einer deutenden Ersetzung bewahrt Wortlaut, königliche Erwartung und messianische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die fortlaufenden Imperfektformen werden durch den Kontext und „nur umso mehr“ natürlich vermittelt. Der Fußnotenmarker steht unmittelbar nach dem vollständigen Ausruf, auf den sich die Erläuterung bezieht.
