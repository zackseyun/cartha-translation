id: MRK.10.29
reference: Mark 10:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: de
  text: 'Jesus sagte: „Amen, ich sage euch: Niemand hat Haus oder Brüder oder Schwestern oder Mutter oder Vater oder Kinder oder Felder um meinetwillen und um des Evangeliums willen verlassen,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: sagte
  rationale: Die Aoristform von φημί leitet Jesu Rede schlicht ein; „sagte“ ist natürlich und fügt keine zusätzliche Nuance hinzu.
- source_word: Ἀμὴν
  choice: Amen
  rationale: Das vorangestellte „Amen“ ist als feierliche Bekräftigungsformel Jesu auch im heutigen biblischen Deutsch verständlich und bewahrt die markante Form des griechischen Ausdrucks.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wiedergabe erhält die direkte, feierliche Aussageformel des Griechischen.
- source_word: οὐδείς ἐστιν ὃς
  choice: Niemand hat …
  rationale: Diese deutsche Konstruktion gibt zusammen mit dem Partizip „verlassen“ die allgemeine Verneinung idiomatisch wieder, ohne das schwerfällige „Es gibt niemanden, der“ zu benötigen.
- source_word: ἀφῆκεν
  choice: hat … verlassen
  rationale: Das Perfekt passt im Deutschen zu der allgemein formulierten, bereits vollzogenen Trennung; „aufgegeben“ oder „im Stich gelassen“ wäre stärker und deutender.
- source_word: οἰκίαν
  choice: Haus
  rationale: „Haus“ ist die direkte, konkrete Entsprechung und lässt offen, ob besonders Gebäude, Besitz oder Zuhause im Blick ist.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: Brüder oder Schwestern
  rationale: Da der griechische Text männliche und weibliche Geschwister getrennt nennt, wird diese Unterscheidung beibehalten.
- source_word: μητέρα / πατέρα
  choice: Mutter oder Vater
  rationale: Direkte und natürliche Wiedergabe der ausdrücklich genannten Elternteile in der Reihenfolge des SBLGNT-Haupttextes.
- source_word: τέκνα
  choice: Kinder
  rationale: „Kinder“ bezeichnet wie τέκνα Nachkommen ohne Festlegung auf das Geschlecht.
- source_word: ἀγρούς
  choice: Felder
  rationale: „Felder“ gibt kultivierte Landflächen konkret und enger als das allgemeinere „Ländereien“ wieder.
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: um meinetwillen und um des Evangeliums willen
  rationale: Die wiederholte Zweck- beziehungsweise Beweggrundangabe wird bewahrt; die Formulierung ist würdevoll und im modernen Standarddeutsch verständlich.
theological_decisions:
- issue: Die Trennung von Familie und Besitz nicht als endgültige Verstoßung überzeichnen
  choice: verlassen
  alternative: aufgegeben / im Stich gelassen
  rationale: ἀφίημι bezeichnet hier das Zurücklassen im Zusammenhang der Nachfolge. „Verlassen“ bewahrt die Schärfe der geforderten Hingabe, ohne zusätzlich zu behaupten, familiäre Verantwortung werde moralisch verworfen.
- issue: Das Verhältnis der beiden Beweggründe bewahren
  choice: um meinetwillen und um des Evangeliums willen
  alternative: für mich, das heißt für das Evangelium
  rationale: Das wiederholte ἕνεκεν und das verbindende καί nennen Jesus und das Evangelium nebeneinander. Eine erklärende Gleichsetzung würde die Form des Textes unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Einleitungsformel „Amen, ich sage euch“ und die konkrete Aufzählung bleiben erhalten. Das abschließende Komma steht innerhalb des Zitats, weil der Satz in Vers 30 weitergeführt wird.
