  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: de
  text: Darum wird ein Mann seinen Vater und seine Mutter verlassen und sich an seine Frau binden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seiner Frau anhängen“. Das griechische Verb kann enge Bindung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: Darum
  rationale: Gibt die begründende Wendung knapp, natürlich und mit ihrem folgernden Sinn wieder.
- source_word: καταλείψει
  choice: wird … verlassen
  rationale: Entspricht dem Futur und bezeichnet hier das Verlassen des elterlichen Haushalts, ohne die stärkere Nebenbedeutung von „im Stich lassen“ einzutragen.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Obwohl das Wort allgemein „Mensch“ bedeuten kann, bezeichnet es hier wegen der ausdrücklich genannten Ehefrau den männlichen Ehepartner.
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: seinen Vater und seine Mutter
  rationale: Bewahrt beide koordinierten Satzglieder und klingt im modernen Standarddeutsch natürlich.
- source_word: προσκολληθήσεται
  choice: wird sich … verbinden
  rationale: Gibt die enge, dauerhafte Bindung in der Ehe idiomatisch wieder. Die griechische Form ist formal passiv, kann hier jedoch intransitiv bzw. medial verstanden werden; eine rein passive deutsche Wiedergabe würde unnatürlich klingen.
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: mit seiner Frau
  rationale: γυνή bedeutet im Ehekontext „Frau“ im Sinn von „Ehefrau“; die Präposition wird passend zum deutschen Verb mit „mit“ wiedergegeben.
theological_decisions:
- issue: Geschlechtsspezifische Sprache im Ehezitat
  choice: ein Mann … seine Frau
  alternative: ein Mensch … seinen Ehepartner
  rationale: Der unmittelbare Zusammenhang bezeichnet ausdrücklich das männlich-weibliche Ehepaar. Die geschlechtsspezifische Form wird daher nicht verallgemeinert.
- issue: Art der ehelichen Bindung
  choice: sich mit seiner Frau verbinden
  alternative: seiner Frau anhängen
  rationale: Die Übersetzung bewahrt die Aussage einer engen Bindung, ohne über den griechischen Wortlaut hinaus eine bestimmte dogmatische Deutung der Verbindung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Darum“ ist knapp und geläufig; „sich mit seiner Frau verbinden“ ist verständlicher als das heute weniger alltägliche „anhängen“, dessen nähere lexikalische Färbung in der Fußnote erhalten bleibt.
