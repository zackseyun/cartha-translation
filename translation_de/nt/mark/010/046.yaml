source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: de
  text: Und sie kamen nach Jericho.[a] Als er dann mit seinen Jüngern und einer großen Menschenmenge Jericho verließ, saß Bartimäus, der Sohn des Timäus, ein blinder Bettler, am Straßenrand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen das historische Präsens: „Und sie kommen nach Jericho.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kamen
  rationale: Das griechische historische Präsens wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben; der Ereignisablauf bleibt dabei erhalten.
- source_word: ἐκπορευομένου αὐτοῦ
  choice: als er … verließ
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig stattfindende Handlung. „Als er … verließ“ gibt dies im Deutschen flüssig wieder.
- source_word: ὄχλου ἱκανοῦ
  choice: einer großen Menschenmenge
  rationale: ἱκανός bezeichnet hier eine beträchtliche Größe. „Große Menschenmenge“ ist klar, idiomatisch und vermeidet das heute leicht gehobene „ansehnlich“.
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: Bartimäus, der Sohn des Timäus
  rationale: Die Apposition nennt sowohl den semitischen Namen als auch dessen erklärende Zuordnung und bleibt dabei im Deutschen verständlich.
- source_word: τυφλὸς προσαίτης
  choice: ein blinder Bettler
  rationale: Die beiden Bezeichnungen werden direkt und in natürlicher deutscher Wortstellung wiedergegeben.
- source_word: παρὰ τὴν ὁδόν
  choice: am Straßenrand
  rationale: Die Wendung bezeichnet den Platz neben dem Weg beziehungsweise der Straße. „Am Straßenrand“ ist die natürliche moderne deutsche Entsprechung.
- source_word: Ἰεριχώ
  choice: Jericho
  rationale: Verwendet wird die im Deutschen etablierte Form des Ortsnamens.
- source_word: καί
  choice: dann / mit
  rationale: Die wiederholten καί-Verknüpfungen werden ihrer jeweiligen syntaktischen Funktion entsprechend idiomatisch wiedergegeben, ohne den Zusammenhang der Erzählung aufzulösen.
theological_decisions:
- issue: Erzählerische Identifizierung des Bartimäus
  choice: Sowohl „Bartimäus“ als auch „der Sohn des Timäus“ stehen im Haupttext.
  alternative: Nur den Namen oder nur seine erklärende Zuordnung wiedergeben.
  rationale: Der griechische Text bietet beide Angaben. Ihre Beibehaltung wahrt das erzählerische Detail, ohne eine weitergehende Deutung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das zusätzliche „wieder“ verdeutlicht idiomatisch, dass Jesus nach der Ankunft nun aus Jericho hinausgeht, ohne dem Geschehen eine theologische Deutung hinzuzufügen.
