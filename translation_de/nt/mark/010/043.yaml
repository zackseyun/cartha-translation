  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: de
  text: 'Doch so ist es unter euch nicht.[a] Vielmehr: Wer unter euch groß werden will, wird euer Diener sein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch auf diese Weise ist es unter euch nicht.“'
    reason: lexical_alternative
  - marker: b
    text: 'Das Futur „wird … sein“ kann hier auch verpflichtenden Sinn haben: Wer unter euch groß werden will, muss euer Diener sein.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: Doch so ist es unter euch nicht
  rationale: Die Formulierung gibt die verneinte Art und Weise natürlich wieder. „Doch“ markiert den Gegensatz zum zuvor beschriebenen Herrschaftsverhalten.
- source_word: ἀλλ’
  choice: Vielmehr
  rationale: „Vielmehr“ bringt den starken korrigierenden Gegensatz prägnant und in würdigem modernem Deutsch zum Ausdruck.
- source_word: ὃς ἂν θέλῃ
  choice: Wer … will
  rationale: Die unbestimmte Relativkonstruktion mit ἄν und Konjunktiv bezeichnet allgemein jeden, auf den die Bedingung zutrifft; „Wer … will“ bewahrt zugleich den Willensaspekt von θέλω.
- source_word: μέγας γενέσθαι
  choice: groß werden
  rationale: „Werden“ erhält den ingressiven Sinn von γενέσθαι; „groß“ bewahrt die Statussprache von μέγας, ohne sie auf Berühmtheit einzuengen.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Die Wendung bezeichnet hier die gemeinschaftliche und soziale Sphäre. „Unter euch“ ist dafür idiomatisch und wird bei beiden Vorkommen beibehalten.
- source_word: ἔσται ὑμῶν διάκονος
  choice: wird euer Diener sein
  rationale: „Diener“ bezeichnet hier einen Menschen, der anderen dient, ohne das spätere kirchliche Amt „Diakon“ einzutragen. Das Futur „wird … sein“ wahrt die griechische Verbform.
theological_decisions:
- issue: Aussagekraft des Futurs ἔσται in der Weisung Jesu
  choice: wird euer Diener sein
  alternative: muss euer Diener sein
  rationale: Das Futur hat im Zusammenhang normativen beziehungsweise auffordernden Sinn. Die Hauptfassung bewahrt dennoch die griechische Verbform; eine Fußnote weist auf die mögliche Wiedergabe der verpflichtenden Kraft hin.
- issue: Bedeutung von διάκονος
  choice: Diener
  alternative: Diakon
  rationale: Gemeint ist hier dem Kontext nach dienendes Verhalten innerhalb der Gemeinschaft, nicht eindeutig ein kirchliches Amt. „Diener“ vermeidet daher einen späteren amtstheologischen Beiklang.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die zweimalige Stellung von „unter euch“ folgt jeweils möglichst eng der griechischen Satzstruktur. Der Doppelpunkt nach „Vielmehr“ macht die folgende Gegenregel lesbar, ohne ihren Inhalt auszudeuten.
