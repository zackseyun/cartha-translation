  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: de
  text: 'Jesus sah sie an und sagte: »Für Menschen ist es unmöglich, aber nicht für Gott; denn für Gott ist alles möglich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: sah sie an
  rationale: Gibt den gezielten Blick Jesu natürlich und prägnant wieder.
- source_word: Παρὰ ἀνθρώποις
  choice: Für Menschen
  rationale: Drückt im Deutschen idiomatisch aus, was im menschlichen Bereich bzw. aus menschlicher Kraft möglich ist.
- source_word: ἀδύνατον
  choice: unmöglich
  rationale: Entspricht direkt der Bedeutung des griechischen Adjektivs; das im Kontext vorausgesetzte Subjekt bleibt wie im Ausgangstext unausgesprochen.
- source_word: πάντα γὰρ δυνατὰ παρὰ τῷ θεῷ
  choice: denn für Gott ist alles möglich
  rationale: Bewahrt die begründende Funktion von γάρ und gibt die Wiederholung von παρά mit einer natürlichen deutschen Formulierung wieder.
theological_decisions:
- issue: Umfang von »alles«
  choice: Die uneingeschränkte Formulierung »alles« bleibt stehen.
  alternative: Eine kontextuell einschränkende Wiedergabe wie »auch das ist Gott möglich«.
  rationale: Der griechische Text sagt πάντα; eine ausdrückliche Einschränkung würde die Spannung und Weite der Aussage stärker festlegen als die Quelle.
- issue: Göttliche Möglichkeit gegenüber menschlicher Unmöglichkeit
  choice: Der scharfe Gegensatz wird ohne erklärenden Zusatz bewahrt.
  alternative: Eine Auslegung wie »Was Menschen aus eigener Kraft nicht können, kann Gott tun«.
  rationale: Die Quelle formuliert knapp und lässt die genaue Wirkweise offen; eine Paraphrase würde zusätzliche theologische Deutung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historische Präsenswechsel von λέγει wird zugunsten eines natürlichen deutschen Erzählflusses mit »sagte« wiedergegeben. Keine Fußnoten erforderlich.
