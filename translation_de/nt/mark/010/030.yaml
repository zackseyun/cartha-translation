  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: de
  text: 'der nicht jetzt in dieser Zeit hundertmal so viel[a] empfängt: Häuser und Brüder und Schwestern und Mütter und Kinder und Äcker – mit Verfolgungen – und im kommenden Zeitalter[b] ewiges Leben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hundertfach“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in der kommenden Weltzeit“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάβῃ
  choice: empfängt
  rationale: Im Zusammenhang einer verheißenen Wiedervergeltung bezeichnet λαμβάνω das Empfangen, nicht ein eigenmächtiges Nehmen.
- source_word: ἑκατονταπλασίονα
  choice: hundertmal so viel
  rationale: Die Wendung gibt den hundertfachen Umfang in klarem, heutigem Deutsch wieder; „hundertfach“ bleibt als knappere Alternative möglich.
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: jetzt in dieser Zeit
  rationale: Die doppelte Zeitangabe bleibt erhalten und bildet den ausdrücklichen Gegensatz zur kommenden Weltzeit.
- source_word: οἰκίας
  choice: Häuser
  rationale: Die konkrete Pluralform des griechischen Ausdrucks wird direkt bewahrt.
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: Brüder und Schwestern
  rationale: Da der griechische Text beide Gruppen ausdrücklich nennt, werden sie getrennt wiedergegeben.
- source_word: μητέρας καὶ τέκνα
  choice: Mütter und Kinder
  rationale: Beide Pluralformen werden direkt und ohne zusätzliche Deutung wiedergegeben.
- source_word: ἀγρούς
  choice: Äcker
  rationale: ἀγρός bezeichnet hier landwirtschaftlich genutztes Land; „Äcker“ bewahrt das konkrete Bild und passt zur Aufzählung materieller Güter.
- source_word: μετὰ διωγμῶν
  choice: unter Verfolgungen
  rationale: Die Formulierung hält fest, dass die gegenwärtige Fülle Verfolgungen nicht ausschließt, ohne Verfolgungen selbst als Teil der Belohnung erscheinen zu lassen.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: in der kommenden Weltzeit
  rationale: „Weltzeit“ gibt αἰών als Zeitalter wieder und bewahrt den eschatologischen Gegensatz zur jetzigen Zeit.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Dies ist die natürliche und sachlich passende deutsche Wiedergabe der feststehenden eschatologischen Wendung.
theological_decisions:
- issue: Art der verheißenen Wiedervergeltung in der gegenwärtigen Zeit
  choice: Die Häuser, verwandtschaftlichen Beziehungen und Äcker werden als wirkliche gegenwärtige Gabe genannt; zugleich bleiben die Verfolgungen ausdrücklich stehen.
  alternative: Die Verheißung ausschließlich vergeistigen oder als leidensfreie materielle Wohlstandsverheißung auslegen.
  rationale: Der griechische Text stellt überreiche Gabe und Verfolgung unaufgelöst nebeneinander; die Übersetzung bewahrt diese Spannung.
- issue: Wiedergabe der familiären Geschlechtsbezeichnungen
  choice: ἀδελφοὺς und ἀδελφὰς werden getrennt mit „Brüder und Schwestern“ wiedergegeben.
  alternative: Beide Wörter zu „Geschwister“ zusammenziehen.
  rationale: Die Vorlage unterscheidet hier ausdrücklich männliche und weibliche Geschwister.
- issue: Verhältnis von gegenwärtiger und kommender Erfüllung
  choice: Die zeitliche Zweiteilung zwischen „jetzt in dieser Zeit“ und „in der kommenden Weltzeit“ bleibt ausdrücklich erhalten.
  alternative: Alle genannten Gaben nur auf die Gegenwart oder nur auf das Jenseits beziehen.
  rationale: Die Satzstruktur weist die hundertfache Wiedervergeltung der jetzigen Zeit und das ewige Leben der kommenden Weltzeit zu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt erschließt die Aufzählung als Inhalt des hundertfachen Empfangens; Gedankenstriche heben „unter Verfolgungen“ hervor, ohne die theologische Spannung zu glätten. Der Vers bleibt als syntaktischer Anschluss an Vers 29 ein Satzfragment.
