  naturalness: „Und als sie wieder im Haus waren, fragten ihn die Jünger danach“ ist modernes, flüssiges Standarddeutsch. Die Fußnotenalternative sollte jedoch idiomatischer formuliert werden; „im Haus fragten ihn die Jünger wieder danach“ wirkt wegen der Stellung von „ihn“ und „wieder“ etwas schwerfällig.
