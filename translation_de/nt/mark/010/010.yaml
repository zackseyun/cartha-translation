source:
  edition: SBLGNT
  text: Καὶ ⸂εἰς τὴν οἰκίαν⸃ πάλιν οἱ μαθηταὶ ⸂περὶ τούτου⸃ ⸀ἐπηρώτων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/010.yaml
  text: And in the house again[b][a], the disciples were asking him about this.
translation:
  language: de
  text: Und als sie wieder im Haus waren, fragten ihn die Jünger danach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und im Haus fragten die Jünger ihn wieder danach.«'
    reason: Das griechische πάλιν („wieder“) kann entweder die erneute Situation im Haus oder das erneute Fragen näher bestimmen.
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den schlichten erzählerischen Anschluss an die vorausgehende Szene.
- source_word: εἰς τὴν οἰκίαν
  choice: als sie … im Haus waren
  rationale: Das wörtliche »in das Haus« bezeichnet hier im Zusammenhang den Wechsel zurück in eine private häusliche Umgebung; die temporale Formulierung ist im Deutschen natürlich.
- source_word: πάλιν
  choice: wieder
  rationale: Die Stellung im Griechischen lässt offen, ob »wieder« vor allem die Rückkehr ins Haus oder das erneute Fragen bezeichnet. Im Haupttext wird es natürlich auf die Situation im Haus bezogen; die andere Möglichkeit steht in der Fußnote.
- source_word: οἱ μαθηταὶ
  choice: die Jünger
  rationale: Bezeichnet die bereits bekannte Gruppe der Jünger; ein ergänztes »seine« ist nicht nötig.
- source_word: περὶ τούτου
  choice: danach
  rationale: Natürliches modernes Deutsch für »darüber/diesbezüglich«; der Bezug auf die vorausgehende Lehre über Scheidung bleibt erhalten.
- source_word: ἐπηρώτων
  choice: fragten
  rationale: Gibt das imperfektische Fragen idiomatisch wieder, ohne einen im Griechischen nicht ausdrücklich markierten Beginn hinzuzufügen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich im Zusammenhang auf Jesus.
theological_decisions:
- issue: Bezug von πάλιν (»wieder«)
  choice: 'Im Haupttext auf die erneute Situation im Haus bezogen: »als sie wieder im Haus waren«'
  alternative: 'Auf das Fragen bezogen: »fragten ihn die Jünger wieder danach«'
  rationale: Die griechische Wortstellung ist syntaktisch mehrdeutig. Beide Deutungen berühren keine Lehrfrage, doch die echte sprachliche Offenheit wird durch eine Fußnote bewahrt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzform ist natürlich, ohne die griechische Aussage durch ein ausdrückliches »begannen« zu erweitern.
