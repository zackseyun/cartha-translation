source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: de
  text: 'Amen, ich sage euch: Wer das Reich Gottes nicht wie ein Kind annimmt, wird auf keinen Fall hineinkommen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das im Deutschen geläufige „Amen“ bewahrt die feierliche, bekräftigende Einleitung eines autoritativen Ausspruchs. „Wahrlich“ wäre altertümlicher, „Ja“ weniger markant.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Formulierung gibt Verb und Dativpronomen direkt und zugleich natürlich wieder.
- source_word: ὃς ἂν
  choice: wer
  rationale: Im Deutschen drückt das generische Relativpronomen „wer“ die unbestimmte, allgemein geltende Aussage idiomatisch aus.
- source_word: μὴ δέξηται
  choice: nicht … annimmt
  rationale: δέχομαι kann „empfangen“, „annehmen“ oder „willkommen heißen“ bedeuten. Beim Reich Gottes ist „annehmen“ natürlich und wahrt den Gedanken des Empfangens statt eigener Leistung.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Dies ist die etablierte und sachlich offene deutsche Wiedergabe; sie lässt sowohl Gottes Herrschaft als auch deren Bereich mitklingen.
- source_word: ὡς παιδίον
  choice: wie ein Kind
  rationale: Die Wendung bewahrt den Vergleich, ohne festzulegen, ob Demut, Vertrauen, Abhängigkeit oder ein anderer Gesichtspunkt gemeint ist.
- source_word: οὐ μὴ εἰσέλθῃ εἰς αὐτήν
  choice: wird auf keinen Fall hineinkommen
  rationale: „Auf keinen Fall“ gibt die nachdrückliche Verneinung οὐ μή wieder. „Hineinkommen“ nimmt die Richtungsangabe εἰς auf und bezieht sich natürlich auf das zuvor genannte Reich.
theological_decisions:
- issue: Bedeutung davon, das Reich Gottes „wie ein Kind“ anzunehmen
  choice: Der Vergleich bleibt ohne nähere Bestimmung stehen.
  alternative: Den Vergleich ausdrücklich auf kindliche Demut, kindliches Vertrauen oder Abhängigkeit beziehen.
  rationale: Der griechische Text nennt keine bestimmte kindliche Eigenschaft. Eine Konkretisierung würde eine mögliche Deutung zur Aussage des Textes machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Amen“ ist kirchlich vertraut, aber auch allgemein verständlich; die übrige Satzgestaltung vermeidet altertümliche Formen.
