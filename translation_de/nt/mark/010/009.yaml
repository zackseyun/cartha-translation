  text: ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: de
  text: Was nun Gott zusammengefügt hat, soll kein Mensch[a] trennen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „Mensch“ steht in der Einzahl und ist allgemein gemeint; es bezieht sich nicht nur auf Männer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: Was
  rationale: Das substantivisch gebrauchte sächliche Relativpronomen bezieht sich zusammenfassend auf die zuvor beschriebene eheliche Verbindung; „was“ gibt dies im Deutschen natürlich wieder.
- source_word: οὖν
  choice: nun
  rationale: „Nun“ kennzeichnet hier die Folgerung aus Jesu vorausgehendem Rückgriff auf Gottes Schöpfungsordnung. Im Deutschen ist die Stellung „Was nun …“ zugleich klar und idiomatisch.
- source_word: ὁ θεὸς
  choice: Gott
  rationale: Direktes Subjekt; im Deutschen steht der Gottesname in dieser Verwendung ohne Artikel.
- source_word: συνέζευξεν
  choice: zusammengefügt hat
  rationale: Das Verb bezeichnet das Verbinden beziehungsweise Zusammenjochen. Das Perfekt „zusammengefügt hat“ gibt die vollendete göttliche Handlung mit bleibender Bedeutung natürlich wieder, ohne das Bild des Jochs unnötig zu verstärken.
- source_word: ἄνθρωπος
  choice: kein Mensch
  rationale: Der artikellose Singular ist generisch. In Verbindung mit dem verneinten Imperativ gibt „kein Mensch“ die Aussage idiomatisch und ausdrücklich allgemein wieder; sie ist nicht auf Männer beschränkt.
- source_word: μὴ χωριζέτω
  choice: soll … trennen
  rationale: Der verneinte Imperativ untersagt die Trennung. „Soll kein Mensch trennen“ bewahrt den gebietenden Charakter in würdigem, geläufigem Deutsch.
theological_decisions:
- issue: Generische Bedeutung von ἄνθρωπος im Ehespruch
  choice: „kein Mensch“ als ausdrücklich allgemeine Bezeichnung
  alternative: „der Mensch“ oder „ein Mensch“
  rationale: ἄνθρωπος bezeichnet hier jeden Menschen, der Gottes Verbindung trennen könnte. „Kein Mensch“ bewahrt den generischen Singular und verdeutlicht im Deutschen den universalen Umfang, ohne eine ausschließlich männliche Anwendung nahezulegen.
- issue: Bezug des sächlichen Relativpronomens ὃ
  choice: „Was“ bezieht sich zusammenfassend auf die von Gott gestiftete eheliche Einheit
  alternative: Personenbezogenes „die“ oder abstrakteres „die Verbindung, die“
  rationale: Die sächliche Form des griechischen Relativpronomens sollte nicht stillschweigend personalisiert oder durch eine ausdrückliche Deutung ersetzt werden. „Was“ bewahrt Form und Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Wendung „Was nun Gott zusammengefügt hat“ wahrt den folgernden Zusammenhang; „soll kein Mensch trennen“ formuliert das Verbot klar und geschlechtsübergreifend.
