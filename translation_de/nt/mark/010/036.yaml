  text: ὁ δὲ εἶπεν αὐτοῖς· Τί θέλετε ⸀ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Was wollt ihr, dass ich für euch tun soll?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Er
  rationale: Die idiomatische Verbindung aus Artikel und δέ führt die Erzählung mit dem aus dem Kontext erschlossenen Subjekt weiter. Im Deutschen genügt hier das Pronomen; eine ausdrückliche Wiedergabe von δέ wäre möglich, aber für den natürlichen Erzählfluss nicht nötig.
- source_word: εἶπεν
  choice: sagte
  rationale: λέγω bezeichnet hier schlicht das Sprechen. Obwohl eine Frage folgt, bleibt »sagte« die unmittelbare lexikalische Entsprechung.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ Plural wird direkt wiedergegeben. Dass es sich im Kontext um Jakobus und Johannes handelt, wird nicht zusätzlich in den Vers eingetragen.
- source_word: Τί
  choice: Was
  rationale: Das substantivisch gebrauchte neutrale Fragepronomen leitet eine direkte Frage nach der gewünschten Handlung ein.
- source_word: θέλετε
  choice: wollt ihr
  rationale: θέλω bezeichnet Wollen oder Wünschen. »Wollt ihr« ist im modernen Deutschen direkt und idiomatisch.
- source_word: ποιήσω
  choice: das ich … tun soll
  rationale: Der Aorist Konjunktiv nach θέλετε bezeichnet die gewünschte Handlung. Die deutsche Konstruktion mit »dass« und »soll« gibt den abhängigen Willensinhalt natürlich wieder; »tun« passt hier besser als »machen«.
- source_word: ὑμῖν
  choice: für euch
  rationale: 'Der Dativ ist hier benefaktiv: Jesus fragt nach einer Handlung, die er zu ihren Gunsten ausführen soll.'
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdevolle Standardsprache. Die direkte Frage bleibt knapp; das griechische δέ wird nicht eigens markiert, da weder ein deutlicher Gegensatz noch ein zwingender zeitlicher Übergang vorliegt.
