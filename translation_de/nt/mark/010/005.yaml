id: MRK.10.5
reference: Mark 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Wegen eurer Herzenshärte[a] schrieb er[b] euch dieses Gebot[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Hartherzigkeit“.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist Mose, der im vorhergehenden Vers erwähnt wird.
    reason: cross_reference
  - marker: c
    text: 'Oder: „diese Anordnung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen milden Gegensatz beziehungsweise die weiterführende Antwort Jesu auf den Hinweis der Gesprächspartner auf Mose.
- source_word: Πρὸς
  choice: wegen
  rationale: 'Die Präposition mit Akkusativ bezeichnet hier den Anlass beziehungsweise Grund: Die Vorschrift wurde im Hinblick auf ihren verhärteten Zustand gegeben.'
- source_word: σκληροκαρδίαν
  choice: Herzenshärte
  rationale: Bewahrt das anschauliche biblische Bild des verhärteten Herzens und gibt zugleich die gemeinte innere Unnachgiebigkeit wieder.
- source_word: ἔγραψεν
  choice: schrieb er
  rationale: Das im Griechischen unausgesprochene Subjekt verweist auf Mose im vorhergehenden Vers. Die deutsche Formulierung bewahrt diesen Rückbezug, ohne den Namen in den Haupttext einzufügen.
- source_word: ἐντολήν
  choice: Gebot
  rationale: Bezeichnet eine verbindliche Anordnung und passt zum rechtlichen Zusammenhang der mosaischen Vorschrift.
- source_word: ταύτην
  choice: dieses
  rationale: Der Demonstrativ verweist auf die konkrete, unmittelbar zuvor erwähnte Vorschrift.
theological_decisions:
- issue: Subjekt von „schrieb“
  choice: Das implizite Subjekt bleibt als „er“ wiedergegeben.
  alternative: „Mose schrieb euch dieses Gebot.“
  rationale: Der griechische Text nennt Mose in diesem Vers nicht erneut, sondern setzt den Bezug aus dem vorhergehenden Vers voraus. Die Wiedergabe mit „er“ vermeidet eine unnötige Explizierung.
- issue: Wiedergabe von σκληροκαρδία
  choice: „Herzenshärte“
  alternative: „Hartherzigkeit“ oder „Starrsinn“
  rationale: „Herzenshärte“ erhält die moralisch-anthropologische Bildsprache, ohne sie auf bloße Sturheit zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Stellung „Jesus aber“ spiegelt den milden Kontrast des griechischen δὲ; „Herzenshärte“ bewahrt bewusst die biblische Metapher.
