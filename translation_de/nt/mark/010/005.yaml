  source_fidelity: 'Der Text gibt die Satzstruktur und den Sinn des griechischen Ausgangstextes zuverlässig wieder: δέ ist mit „aber“ angemessen aufgenommen; Πρός mit Akkusativ ist hier treffend kausal als „wegen“ gefasst. „eurer Herzenshärte“ entspricht σκληροκαρδία ὑμῶν, und das nicht explizit genannte Subjekt von ἔγραψεν wird korrekt durch „er“ unter Rückbezug auf Mose im vorigen Vers wiedergegeben. „dieses Gebot“ gibt τὴν ἐντολὴν ταύτην präzise wieder.'
  naturalness: Die Formulierung ist flüssiges modernes Standarddeutsch und bewahrt zugleich einen angemessen würdigen biblisch-erzählenden Ton. „Herzenshärte“ ist verständlich und als bewusste biblische Bildsprache natürlich genug; eine Umstellung zu „der Härte eures Herzens“ wäre möglich, aber nicht erforderlich.
  terminology: „Gebot“ ist für ἐντολή im rechtlich-mosaischen Kontext passend. „Herzenshärte“ bewahrt die Metapher, ohne sie auslegend zu „Starrsinn“ zu verflachen. Die Fußnoten sind korrekt verankert und ihre Alternativen beziehungsweise der Bezug von „er“ sind sachgerecht.
