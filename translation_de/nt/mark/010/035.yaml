  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: de
  text: 'Da kamen Jakobus und Johannes, die Söhne des Zebedäus, zu ihm und sagten: „Lehrer, wir wollen, dass du für uns tust, worum auch immer wir dich bitten.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: kamen … zu ihm
  rationale: Das historische Präsens wird im deutschen Erzählstil natürlich als Präteritum wiedergegeben. „Zu ihm kommen“ bewahrt die im Verb ausgedrückte Bewegung auf Jesus zu.
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: die Söhne des Zebedäus
  rationale: Die appositionelle Identifizierung und das Genitivverhältnis werden unmittelbar wiedergegeben.
- source_word: λέγοντες αὐτῷ
  choice: und sagten
  rationale: Die griechische Partizipialkonstruktion wird für einen natürlichen deutschen Erzählfluss als finites Verb koordiniert; der Bezug auf Jesus ist durch „zu ihm“ bereits eindeutig.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die Anrede bezeichnet Jesus hier ausdrücklich als Lehrenden. „Meister“ wäre traditioneller, könnte aber einen breiteren Autoritätsbegriff eintragen.
- source_word: θέλομεν
  choice: wir möchten
  rationale: „Wir möchten“ gibt das Begehren in idiomatischem Deutsch wieder, ohne die anschließende dreiste, umfassende Bitte abzuschwächen; „wir wollen“ wäre formal näher, klingt im heutigen Deutschen aber leicht wie eine Forderung.
- source_word: ἵνα … ποιήσῃς ἡμῖν
  choice: dass du für uns tust
  rationale: Nach „möchten“ bewahrt ein dass-Satz die griechische Satzstruktur und gibt ἡμῖν mit „für uns“ wieder, ohne ποιέω als „gewähren“ auszudeuten.
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: worum wir dich bitten
  rationale: Die Verbindung von Relativpronomen und ἐάν bezeichnet einen unbestimmten Inhalt. Im Deutschen ist „worum wir dich bitten“ natürlich und erhält die Offenheit der erbetenen Handlung.
theological_decisions: []
