  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: de
  text: Und wer unter euch der Erste sein will, wird der Sklave aller sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener aller“. Das griechische Wort δοῦλος ist stärker als διάκονος („Diener“) im vorhergehenden Vers und bezeichnet einen Sklaven.'
    reason: Die Fußnote nennt die weniger harte deutsche Wiedergabe und erklärt, weshalb der Haupttext die Steigerung mit „Sklave“ sichtbar macht.
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: wer … sein will
  rationale: Das Relativpronomen mit ἄν und Konjunktiv bezeichnet allgemein jeden, auf den die Bedingung zutrifft. „Wer … sein will“ ist im Deutschen natürlich und bewahrt den Willensaspekt von θέλω.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Im Zusammenhang sozialer Rangordnung bezeichnet die Wendung die Stellung innerhalb der Jüngergruppe, nicht bloß einen räumlichen Ort.
- source_word: πρῶτος
  choice: der Erste
  rationale: Die substantivierte Form gibt den Rang- und Vorranganspruch klar wieder und bewahrt die prägnante Aussage des griechischen Textes.
- source_word: ἔσται
  choice: wird … sein
  rationale: Die Zukunftsform wird formal als Futur wiedergegeben. Ihr auffordernder Ernst ergibt sich aus dem Zusammenhang, ohne dass sie ausdrücklich mit „muss“ verstärkt wird.
- source_word: πάντων
  choice: aller
  rationale: Der Genitiv bezeichnet die Unterordnung gegenüber allen und erhält den umfassenden Geltungsbereich.
- source_word: δοῦλος
  choice: Sklave
  rationale: δοῦλος ist stärker als διάκονος im vorhergehenden Vers und bezeichnet hier radikale Unterordnung und niedrigsten sozialen Rang. „Sklave“ bewahrt diese bewusste Steigerung.
theological_decisions:
- issue: Wiedergabe von δοῦλος in Jesu Lehre über dienende Größe
  choice: Sklave
  alternative: Diener
  rationale: Der unmittelbare Zusammenhang steigert die Aussage von διάκονος („Diener“) in Vers 43 zu δοῦλος in Vers 44. „Sklave“ erhält die scharfe Umkehrung menschlichen Rangstrebens, ohne sie konfessionell auszudeuten.
- issue: Aussagekraft des Futurs ἔσται
  choice: wird … sein
  alternative: muss … sein
  rationale: Die Übersetzung bewahrt die grammatische Zukunftsform und lässt deren normativen Charakter aus Jesu Aussage hervorgehen, statt die Spannung durch eine ausdrücklich modale Wiedergabe aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist idiomatisch und zugleich eng am griechischen Aufbau; „der Erste“ bezeichnet erkennbar den Rang innerhalb der Gruppe.
