  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Ihr wisst nicht, worum ihr bittet. Könnt ihr den Kelch trinken, den ich trinke,[a] oder mit der Taufe getauft werden, mit der ich getauft werde?[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der „Kelch“ ist in der Bibel ein Bild für den Anteil, der jemandem bestimmt ist; hier weist er besonders auf Jesu bevorstehendes Leiden.
    reason: cross_reference
  - marker: b
    text: 'Sinngemäß auch: „die Taufe durchmachen, die ich durchmache“. Im Griechischen werden das Substantiv „Taufe“ und das zugehörige Verb zur Betonung wiederholt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jesus aber sagte zu ihnen
  rationale: δέ markiert hier den korrigierenden Gegensatz zu der vorausgehenden Bitte. Die Nachstellung von „aber“ ist idiomatisches, würdiges Standarddeutsch.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: Ihr wisst nicht, worum ihr bittet
  rationale: οἶδα wird grundnah mit „wissen“ wiedergegeben; αἰτέω bezeichnet hier das Erbitten einer Sache. „Worum ihr bittet“ ist im Deutschen natürlicher als „was ihr bittet“ und bewahrt die direkte Zurechtweisung.
- source_word: δύνασθε
  choice: Könnt ihr
  rationale: δύναμαι fragt nach Fähigkeit beziehungsweise Vermögen. „Könnt ihr“ ist die natürliche moderne deutsche Frageform und nicht bloß eine Bitte um Erlaubnis.
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: den Kelch trinken, den ich trinke
  rationale: Die konkrete Metapher und die präsentische Form „ich trinke“ bleiben erhalten; eine Ausdeutung als Leiden würde mehr festlegen als der Wortlaut.
- source_word: ποτήριον
  choice: Kelch
  rationale: „Kelch“ ist im Deutschen die etablierte biblische Wiedergabe der metaphorisch aufgeladenen Bezeichnung und bleibt zugleich verständlich.
- source_word: ἢ
  choice: oder
  rationale: Die disjunktive Konjunktion der SBLGNT-Ausgabe wird ohne Angleichung an andere Überlieferungsformen als „oder“ wiedergegeben.
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: mit der Taufe getauft werden, mit der ich getauft werde
  rationale: Die Wiederholung des griechischen Wortstamms βάπτισμα/βαπτίζω wird durch „Taufe/getauft“ sichtbar gehalten. Die Passivformen und die metaphorische Offenheit bleiben gewahrt.
theological_decisions:
- issue: Metaphorik von Kelch und Taufe
  choice: Beide Bilder bleiben im Haupttext unaufgelöst stehen.
  alternative: Ausdeutend von Jesu Leiden, Tod oder dem Tragen göttlichen Zorns sprechen.
  rationale: Der Kontext weist auf Jesu bevorstehendes Leiden, doch der Vers selbst entfaltet die Bilder nicht vollständig. Die wörtliche Bildsprache bewahrt ihre biblischen Bezüge und theologische Spannung.
- issue: Zeitform bei ἐγὼ πίνω und βαπτίζομαι
  choice: Die griechischen Präsensformen werden mit „ich trinke“ und „ich getauft werde“ wiedergegeben.
  alternative: 'Futurisch formulieren: „den ich trinken werde“ beziehungsweise „mit der ich getauft werden werde“.'
  rationale: Das Präsens kann die bereits einsetzende beziehungsweise sicher bevorstehende Erfahrung lebendig vergegenwärtigen. Eine ausdrückliche Futurform würde die grammatische Spannung glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die biblisch geprägten Metaphern „Kelch“ und „Taufe“ sowie die auffällige Wortwiederholung bleiben erhalten; Fußnoten erläutern, ohne den Haupttext dogmatisch zu verengen.
