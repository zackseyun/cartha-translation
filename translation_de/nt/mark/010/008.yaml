  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: de
  text: und die beiden werden zu einem Fleisch. Somit sind sie nicht mehr zwei, sondern ein Fleisch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: werden … sein
  rationale: Die Form von εἰμί bedeutet grundsätzlich „sein“. Zusammen mit εἰς bezeichnet sie hier das Eintreten in die Einheit; die deutsche Wendung „werden ein Fleisch sein“ bewahrt sowohl den Wortlaut als auch den resultativen Sinn.
- source_word: οἱ δύο
  choice: die beiden
  rationale: „Die beiden“ ist im modernen Deutschen die natürliche Wiedergabe des substantivierten Zahlworts und hält die ausdrücklich betonte Zweiheit fest.
- source_word: εἰς σάρκα μίαν
  choice: ein Fleisch
  rationale: Die feste biblische Wendung bezeichnet die eheliche Einheit. Im Deutschen kann die Zielrichtung von εἰς durch die Konstruktion mit „werden“ ausgedrückt werden, ohne ein unnatürliches „in ein Fleisch hinein“ zu verwenden.
- source_word: σάρκα / σάρξ
  choice: Fleisch
  rationale: „Fleisch“ bewahrt den konkreten Ausdruck und den Bezug auf Genesis; „Körper“ würde die Bedeutung unnötig verengen.
- source_word: ὥστε
  choice: somit
  rationale: ὥστε leitet hier die Folgerung aus dem vorangehenden Zitat ein. „Somit“ macht diesen logischen Zusammenhang in würdigem, gegenwärtigem Deutsch deutlich.
- source_word: οὐκέτι
  choice: nicht mehr
  rationale: Die Wendung bringt klar zum Ausdruck, dass der frühere Zustand der Zweiheit nicht länger besteht.
- source_word: ἀλλὰ μία σάρξ
  choice: sondern ein Fleisch
  rationale: Die adversative Gegenüberstellung ist für die Aussage entscheidend; die Wiederholung von „ein Fleisch“ erhält die Form und den Nachdruck des griechischen Textes.
theological_decisions:
- issue: Bedeutung von „ein Fleisch“ im Genesis-Zitat Jesu
  choice: Die eheliche Bundesformel „ein Fleisch“ bleibt ohne erklärende Erweiterung stehen.
  alternative: ein Körper; eine Person; sexuell vereint
  rationale: Der Ausdruck trägt eine umfassende anthropologische und theologische Bedeutung, die der Vers nicht auf einen einzelnen Aspekt begrenzt. Die wörtliche biblische Formel bewahrt diese Offenheit.
translation_notes:
  register: Natürliches, modernes Standarddeutsch mit würdigem biblischem Ton. „Die beiden“ klingt idiomatischer als „die zwei“, während „nicht mehr zwei“ den ausdrücklichen Kontrast des Ausgangstextes wahrt.
