  to: „Seht, wir gehen hinauf nach Jerusalem, und der Menschensohn wird den Hohenpriestern und den Schriftgelehrten ausgeliefert[a] werden. Sie werden ihn zum Tod verurteilen und ihn den Völkern[b] ausliefern.“
