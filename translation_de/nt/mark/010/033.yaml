source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: de
  text: „Seht, wir gehen hinauf nach Jerusalem, und der Menschensohn wird den Hohenpriestern und den Schriftgelehrten ausgeliefert[a] werden. Sie werden ihn zum Tod verurteilen und ihn den Völkern[b] ausliefern.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder in beiden Vorkommen: „übergeben“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „den Heiden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Der aufmerksamkeitslenkende Diskursmarker wird in natürlichem, würdigem Deutsch wiedergegeben und behält seinen nachdrücklichen Aufforderungscharakter.
- source_word: ἀναβαίνομεν
  choice: wir gehen hinauf
  rationale: Die Verlaufsbedeutung ergibt sich im Deutschen aus dem Kontext; „hinaufgehen“ bewahrt zudem die geografisch und traditionell passende Bewegung nach Jerusalem.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte wörtliche Wiedergabe bewahrt die Selbstbezeichnung und ihre biblisch-theologische Resonanz, ohne sie auszudeuten.
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: wird … ausgeliefert werden / werden … ausliefern
  rationale: Die gleiche deutsche Wortfamilie bildet die Wiederholung des griechischen Verbs und die Abfolge der Übergabe in fremde Gewalt ab; „verraten“ wäre an der ersten Stelle zu eng.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: den führenden Priestern
  rationale: Gemeint ist die Gruppe der obersten priesterlichen Autoritäten, nicht eine Mehrzahl amtierender Hoher Priester. Die Formulierung ist für heutige Leser unmittelbar verständlich.
- source_word: τοῖς γραμματεῦσιν
  choice: den Schriftgelehrten
  rationale: Dies ist die etablierte, präzise deutsche Bezeichnung und vermeidet eine weitergehende Deutung als bloße Gesetzeslehrer.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: sie werden ihn zum Tod verurteilen
  rationale: Die Wendung bewahrt den formellen gerichtlichen Sinn und gibt die Dativkonstruktion idiomatisch wieder.
- source_word: τοῖς ἔθνεσιν
  choice: den Völkern
  rationale: Die wörtliche Wiedergabe erhält die lexikalische und heilsgeschichtliche Spannung des Ausdrucks. Im unmittelbaren Zusammenhang sind damit die nichtjüdischen Machthaber beziehungsweise Heiden gemeint.
theological_decisions:
- issue: Wiedergabe von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Mensch / der menschliche Eine
  rationale: „Menschensohn“ bewahrt Wortlaut, traditionelle Erkennbarkeit und die mögliche Daniel-Resonanz, ohne die Selbstbezeichnung interpretierend zu verflachen.
- issue: Wiedergabe von τοῖς ἔθνεσιν
  choice: den Völkern
  alternative: den Heiden
  rationale: „Völker“ gibt den griechischen Ausdruck formal wieder; die Fußnote macht deutlich, dass hier im Kontext Nichtjuden beziehungsweise Heiden gemeint sind, ohne die semantische Breite im Haupttext aufzulösen.
- issue: Passivform παραδοθήσεται
  choice: wird … ausgeliefert werden
  alternative: wird … übergeben werden
  rationale: Das Passiv lässt den zunächst handelnden Urheber unausgesprochen, wie im Griechischen. Die Übersetzung ergänzt weder einen menschlichen noch einen göttlichen Akteur.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze bilden die eindringliche Vorhersage und ihre Abfolge klar ab. Das im Satzanschluss stehende ὅτι wird nicht eigens übersetzt, da es den Inhalt der im vorherigen Vers begonnenen Rede einleitet. „Dort“ verdeutlicht idiomatisch den Bezug Jerusalems auf die folgende Handlung, ohne einen neuen Sachinhalt einzuführen.
