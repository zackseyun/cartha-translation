  naturalness: Modernes, würdiges Standarddeutsch. »Das können wir« ist als direkte Antwort natürlich. Die bewusst wiederholte Konstruktion »mit der Taufe, mit der ich getauft werde« ist im Deutschen zwar gehoben, aber idiomatisch und für die rhetorische Parallelität des griechischen Textes angemessen.
  terminology: »Becher« und »Taufe« sind etablierte, quellentreue Begriffe. Die Passivformen bewahren die Verbindung von βάπτισμα, βαπτίζομαι und βαπτισθήσεσθε. Die Fußnote erläutert die Bildsprache kontextgemäß, ohne eine konfessionelle oder übermäßig enge Deutung in den Text einzutragen.
