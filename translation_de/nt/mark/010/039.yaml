id: MRK.10.39
reference: Mark 10:39
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: de
  text: 'Sie sagten zu ihm: »Das können wir.« Doch Jesus sagte zu ihnen: »Den Becher, den ich trinke, werdet ihr trinken, und mit der Taufe, mit der ich getauft werde,[a] werdet ihr getauft werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Becher« und »Taufe« sind hier Bilder für das Leiden und das Geschick, das Jesus bevorsteht und an dem auch seine Jünger Anteil haben werden.
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: Das können wir
  rationale: Die natürliche deutsche Entsprechung gibt die gegenwärtige Fähigkeit wieder; »Wir sind dazu imstande« wäre formeller, aber im Dialog schwerfälliger.
- source_word: ποτήριον
  choice: Becher
  rationale: Bewahrt das biblische Bild für ein zugeteiltes Geschick, hier besonders Jesu bevorstehendes Leiden, ohne es im Haupttext auszudeuten.
- source_word: πίνω / πίεσθε
  choice: ich trinke / werdet ihr trinken
  rationale: Erhält die Parallelität von Präsens und Futur sowie das Bild des gemeinsamen Trinkens aus demselben Becher.
- source_word: βάπτισμα
  choice: Taufe
  rationale: Die übliche deutsche Entsprechung bewahrt das im Griechischen verwendete Bild und seine biblischen Anklänge; »Untertauchen« wäre hier weniger idiomatisch.
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: ich getauft werde / werdet ihr getauft werden
  rationale: Gibt die Passivformen wieder und bewahrt die Wortverbindung mit »Taufe«, statt das Bild interpretierend durch »erleiden« zu ersetzen.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Doch Jesus sagte zu ihnen
  rationale: »Doch« markiert den leichten Gegensatz zwischen ihrer selbstsicheren Antwort und Jesu ernster Erwiderung.
theological_decisions:
- issue: Bildsprache von Becher und Taufe
  choice: Beide Bilder bleiben im Haupttext erhalten und bezeichnen im Zusammenhang Jesu bevorstehendes Leiden und das Geschick, an dem seine Jünger Anteil haben werden.
  alternative: Die Bilder unmittelbar mit »Leiden«, »Tod« oder »Martyrium« wiedergeben.
  rationale: Der griechische Text verwendet gewichtige biblische Metaphern. Ihre Beibehaltung wahrt die Bildsprache und vermeidet eine unnötige interpretierende Verengung.
- issue: Verhältnis der Aussage zur sakramentalen Taufe
  choice: βάπτισμα wird mit »Taufe« übersetzt; eine Fußnote erläutert den metaphorischen Sinn im unmittelbaren Kontext.
  alternative: »Untertauchen« oder »Leiden« schreiben, um einen sakramentalen Bezug auszuschließen.
  rationale: »Taufe« entspricht dem griechischen Ausdruck und erhält mögliche Anklänge, während der Kontext eindeutig auf ein überwältigendes Leiden und Geschick weist, ohne jede weitere Resonanz ausdrücklich auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Das können wir« klingt im direkten Gespräch natürlich; »Becher« und »Taufe« bewahren die markante Parallelstruktur und Bildsprache des griechischen Textes. Der Fußnotenmarker steht unmittelbar nach der vollständigen zweiten Bildaussage.
