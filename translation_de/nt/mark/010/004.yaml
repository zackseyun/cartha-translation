base_translation:
  language: en
  yaml_path: translation/nt/mark/010/004.yaml
  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: de
  text: 'Sie sagten: „Mose hat erlaubt, eine Scheidungsurkunde[a] zu schreiben und die Frau fortzuschicken[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Scheidebrief“. Der griechische Ausdruck bezeichnet ein schriftliches Rechtsdokument zur Scheidung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und sich von ihr zu scheiden“. Wörtlich: „und fortzuschicken“; im vorliegenden Zusammenhang ist damit die Entlassung aus der Ehe gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Sie sagten
  rationale: Der substantivisch gebrauchte Artikel bezeichnet die zuvor genannten Gesprächspartner. δέ markiert hier eine Fortführung oder einen leichten Gegensatz; im natürlichen Deutschen muss es nicht eigens wiedergegeben werden.
- source_word: Ἐπέτρεψεν
  choice: hat erlaubt
  rationale: ἐπιτρέπω bezeichnet ein Erlauben oder Gestatten. „Hat erlaubt“ bewahrt den für den Zusammenhang wichtigen Unterschied zwischen einer Erlaubnis und einem Gebot.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Dies ist die gebräuchliche deutsche Namensform.
- source_word: βιβλίον ἀποστασίου
  choice: eine Scheidungsurkunde
  rationale: Die Wortgruppe bezeichnet das schriftliche Rechtsdokument, das die Scheidung bestätigt. „Scheidungsurkunde“ ist im heutigen Deutsch klar und rechtlich präzise.
- source_word: γράψαι
  choice: auszustellen
  rationale: Wörtlich bedeutet γράψαι „zu schreiben“. Bei einer Urkunde ist „ausstellen“ im Deutschen idiomatisch und gibt den rechtlichen Vorgang angemessen wieder.
- source_word: καὶ ἀπολῦσαι
  choice: und die Frau fortzuschicken
  rationale: ἀπολύω kann entlassen oder fortschicken bedeuten und bezeichnet hier im ehelichen Zusammenhang die Scheidung. „Fortzuschicken“ erhält das konkrete Sprachbild; „die Frau“ wird aus dem Zusammenhang ergänzt, da im Griechischen kein ausdrückliches Objekt steht.
theological_decisions:
- issue: Art der mosaischen Regelung zur Scheidung
  choice: Mose erlaubte die Scheidung, statt sie ausdrücklich zu gebieten.
  alternative: Mose gebot einem Mann, eine Scheidungsurkunde auszustellen.
  rationale: Ἐπέτρεψεν bedeutet ausdrücklich „erlaubte“. Diese Unterscheidung ist für den unmittelbaren Zusammenhang wesentlich, in dem Jesus die Zugeständnisregelung wegen der Herzenshärte dem ursprünglichen Schöpfungswillen Gottes gegenüberstellt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rechtliche Bedeutung wird klar ausgedrückt, während das konkrete Bild von ἀπολύω im Haupttext erhalten bleibt.
