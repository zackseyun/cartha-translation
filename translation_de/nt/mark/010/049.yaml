source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: de
  text: 'Und Jesus blieb stehen und sagte: „Ruft ihn!“ Da riefen sie den blinden Mann und sagten zu ihm: „Nur Mut! Steh auf, er ruft dich.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: blieb stehen
  rationale: Das Partizip von ἵστημι bezeichnet hier im Erzählzusammenhang, dass Jesus seine Bewegung unterbrach. „Blieb stehen“ ist natürliches Deutsch und bildet die Handlung genauer ab als eine wörtlich-partizipiale Wiedergabe.
- source_word: Φωνήσατε αὐτόν
  choice: Ruft ihn!
  rationale: φωνέω bedeutet hier, jemanden zu rufen beziehungsweise herbeizurufen. „Ruft ihn!“ ist direkt und bewahrt die Wiederholung desselben Verbs im weiteren Vers.
- source_word: φωνοῦσι
  choice: riefen sie
  rationale: Die Wiedergabe mit „rufen“ hält die lexikalische Verbindung zu Jesu vorausgehendem Auftrag und zu φωνεῖ am Versende aufrecht.
- source_word: τὸν τυφλὸν
  choice: den blinden Mann
  rationale: Das substantivierte Adjektiv bezeichnet im Kontext einen männlichen Blinden. „Den blinden Mann“ ist im modernen Deutsch natürlich und eindeutig.
- source_word: Θάρσει
  choice: Nur Mut!
  rationale: Der Imperativ spricht Ermutigung und Zuversicht zu. „Nur Mut!“ gibt seine knappe, unmittelbare Kraft in idiomatischem modernem Deutsch wieder.
- source_word: ἔγειρε
  choice: Steh auf!
  rationale: Der Imperativ fordert den Mann auf, sich zu erheben. „Steh auf!“ ist klar, unmittelbar und dem erzählten Geschehen angemessen.
- source_word: φωνεῖ σε
  choice: er ruft dich
  rationale: Der griechische Präsens bezeichnet den gegenwärtigen Ruf Jesu. Die deutsche Präsensform bewahrt sowohl die Unmittelbarkeit als auch die dreifache Wiederholung von „rufen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappen direkten Reden. Die Wiederholung von φωνέω wird konsequent durch „rufen“ abgebildet. Das erste καί wird mit „Und“, das zweite zur natürlichen Fortführung der Erzählung mit „Da“ wiedergegeben.
