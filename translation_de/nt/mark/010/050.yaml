base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: de
  text: Da warf er seinen Mantel ab, sprang auf und kam zu Jesus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβαλών
  choice: warf … ab
  rationale: Das Aoristpartizip von ἀποβάλλω bezeichnet hier ein entschiedenes Ablegen beziehungsweise Wegwerfen. „warf … ab“ bewahrt die abrupte, anschauliche Bewegung.
- source_word: ἱμάτιον
  choice: Mantel
  rationale: ἱμάτιον bezeichnet häufig das äußere Kleidungsstück. „Mantel“ ist im modernen Deutsch knapp, natürlich und im erzählerischen Zusammenhang treffend.
- source_word: ἀναπηδήσας
  choice: sprang auf
  rationale: Das Partizip beschreibt eine plötzliche, energische Aufwärtsbewegung. „sprang auf“ gibt die Unmittelbarkeit und Entschlossenheit natürlich wieder.
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: kam zu Jesus
  rationale: ἔρχομαι mit πρός bezeichnet hier die Bewegung hin zu Jesus. „kam zu Jesus“ ist eine natürliche und genaue deutsche Wiedergabe.
- source_word: δὲ
  choice: Da
  rationale: δέ führt die Erzählung mit einem leichten Anschluss weiter. Das narrative „Da“ gibt die zeitliche Folge flüssig wieder, ohne einen stärkeren Gegensatz einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, lebendiger Erzählweise. Die Folge der drei Handlungen und ihre Dynamik bleiben erhalten.
