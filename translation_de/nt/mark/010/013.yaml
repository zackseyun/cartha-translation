  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: de
  text: Und die Leute brachten Kinder zu ihm, damit er sie berührte[a]. Doch die Jünger wiesen sie zurecht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er sie anrührte“. Das griechische Wort meint eine Berührung und sagt hier nicht ausdrücklich, dass Jesus ihnen die Hände auflegen sollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέφερον
  choice: brachten
  rationale: Das Imperfekt bezeichnet eine andauernde oder wiederholte Handlung. Im Deutschen kann das schlichte Präteritum „brachten“ dies im Erzählzusammenhang natürlich ausdrücken; „waren dabei, ... zu bringen“ wäre unnötig schwerfällig.
- source_word: παιδία
  choice: Kinder
  rationale: παιδία bezeichnet hier allgemein Kinder und kann auch kleine Kinder einschließen. „Kinder“ ist natürlich und vermeidet eine nicht ausdrücklich markierte Verengung.
- source_word: ἵνα αὐτῶν ἅψηται
  choice: damit er sie berührte
  rationale: ἵνα mit dem Konjunktiv drückt den Zweck aus; ἅπτομαι bedeutet unmittelbar „berühren“. Die Wiedergabe vermeidet, das Händeauflegen aus Parallelstellen einzutragen.
- source_word: ἐπετίμησαν
  choice: wiesen ... zurecht
  rationale: ἐπιτιμάω bezeichnet ein tadelndes, entschiedenes Zurechtweisen. Die Formulierung ist im modernen Deutsch klar und bewahrt die Schärfe, ohne unnötig altertümlich zu wirken.
- source_word: αὐτοῖς
  choice: sie
  rationale: Das Pronomen bezieht sich am natürlichsten auf die nicht ausdrücklich genannten Leute, die die Kinder brachten. „Sie“ wahrt die pronominale Ausdrucksweise des griechischen Textes.
- source_word: δὲ
  choice: Doch
  rationale: δέ kennzeichnet hier den Gegensatz zwischen dem Bringen der Kinder und der Reaktion der Jünger; „Doch“ gibt diesen Kontrast idiomatisch wieder.
theological_decisions:
- issue: Bezug des Zurechtweisens der Jünger
  choice: Die Jünger wiesen die Leute zurecht, die die Kinder brachten.
  alternative: Die Jünger wiesen die Kinder zurecht.
  rationale: Der sachlich und erzählerisch naheliegende Bezug von αὐτοῖς ist das unausgedrückte Subjekt von προσέφερον, also die bringenden Personen. Das Pronomen im Haupttext bewahrt zugleich die formale Kürze des Originals.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Die Leute“ macht das im griechischen Verb enthaltene unbestimmte Subjekt natürlich sichtbar. Das Imperfekt wird nicht umständlich als Verlaufsform nachgebildet; der Kontext lässt wiederholtes oder fortgesetztes Bringen zu.
