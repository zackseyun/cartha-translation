  verdict: approve
  source_fidelity: Die Übersetzung gibt προσέφερον angemessen als erzählerisches Präteritum „brachten“ wieder; das deutsche Präteritum muss den imperfektiven Aspekt nicht durch eine umständliche Verlaufsform ausdrücken. παιδία ist treffend mit „Kinder“ wiedergegeben. „Damit er sie berührte“ entspricht dem Zweck von ἵνα ... ἅψηται, ohne ein Händeauflegen einzutragen. „Wiesen sie zurecht“ gibt ἐπετίμησαν sachgerecht wieder. Das deutsche „sie“ bewahrt zudem die im griechischen αὐτοῖς vorhandene, grammatisch nicht aufgelöste Referenzmöglichkeit, auch wenn der Kontext die bringenden Personen nahelegt.
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und wahrt einen würdevollen biblischen Erzählton. „Die Leute“ ist eine natürliche explizite Wiedergabe des im griechischen Verb mitgedachten unbestimmten Subjekts. Der Kontrast mit „Doch“ ist idiomatisch.
  terminology: „Kinder“, „berührte“ und „wiesen ... zurecht“ sind klare, theologisch nicht überladene und dem Kontext angemessene Begriffe. Die Fußnote ist korrekt am Wort „berührte“ verankert und erläutert sinnvoll, dass kein Händeauflegen in den Vers hineingelesen werden soll.
