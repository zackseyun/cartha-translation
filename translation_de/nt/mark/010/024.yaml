  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: de
  text: 'Doch die Jünger waren über seine Worte erstaunt. Jesus sagte ihnen[a] noch einmal: »Kinder, wie schwer ist es, in das Reich Gottes hineinzukommen!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: »Kinder, wie schwer ist es für die, die auf Reichtum vertrauen, in das Reich Gottes hineinzukommen!«'
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: waren … bestürzt
  rationale: Das Imperfekt beschreibt ihre anhaltende starke Reaktion. »Bestürzt« gibt hier sowohl das Erstaunen als auch die beunruhigende Wirkung von Jesu Worten wieder, ohne das Verb zu übersteigern.
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: über seine Worte
  rationale: ἐπί mit Dativ bezeichnet hier den Anlass beziehungsweise Gegenstand ihrer Reaktion. »Über seine Worte« ist im Deutschen natürlich und bleibt nahe am griechischen Ausdruck.
- source_word: πάλιν
  choice: noch einmal
  rationale: Die Wendung kennzeichnet Jesu erneutes Sprechen und stellt den Erzählzusammenhang klar her.
- source_word: ἀποκριθεὶς λέγει αὐτοῖς
  choice: Da sagte Jesus … zu ihnen
  rationale: Die griechische Verbindung aus Partizip von »antworten« und historischem Präsens von »sagen« ist eine geläufige narrative Formel. Im modernen Deutschen gibt »sagte … zu ihnen« ihre kommunikative Funktion natürlich wieder; ein ausdrückliches »antwortete und sagte« wäre unnötig schwerfällig.
- source_word: Τέκνα
  choice: Kinder
  rationale: Die direkte Anrede ist herzlich und familiär. »Kinder« bewahrt dies, ohne das im Griechischen nicht ausdrücklich vorhandene Possessivpronomen »meine« hinzuzufügen.
- source_word: πῶς δύσκολόν ἐστιν
  choice: wie schwer ist es
  rationale: Das exklamative πῶς verstärkt die Aussage. »Wie schwer ist es« bildet sowohl die Ausrufstruktur als auch die Bedeutung von δύσκολον idiomatisch ab.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: in das Reich Gottes zu kommen
  rationale: Der Infinitiv bezeichnet den Inhalt der Schwierigkeit. »In das Reich Gottes zu kommen« ist klares, heutiges Deutsch und entspricht dem gerichteten Eintritt, den εἰς … εἰσελθεῖν ausdrückt.
theological_decisions:
- issue: Ob die längere Lesart »für die, die auf Reichtum vertrauen« in den Haupttext gehört
  choice: 'Der kürzeren Lesart des SBLGNT folgen: »wie schwer ist es, in das Reich Gottes zu kommen«'
  alternative: »Kinder, wie schwer ist es für die, die auf Reichtum vertrauen, in das Reich Gottes zu kommen!«
  rationale: Die vorgegebene griechische Ausgangsausgabe bietet die kürzere, gut bezeugte Lesart. Sie lässt die weitreichende Spannung von Jesu Aussage bestehen. Die längere Lesart schränkt die Aussage erklärend ein und wird deshalb nicht in den Haupttext aufgenommen, aber wegen ihrer Überlieferung und interpretatorischen Bedeutung in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung ist flüssig formuliert, während die herzliche Anrede »Kinder« und der eindringliche Ausruf Jesu erhalten bleiben. Der Fußnotenmarker steht unmittelbar nach der Redeeinleitung, bevor die abweichende Formulierung relevant wird.
