source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: de
  text: 'Als Jesus sich auf den Weg machte,[a] lief ein Mann herbei, kniete vor ihm nieder und fragte ihn: »Guter Lehrer, was muss ich tun, damit ich ewiges Leben erbe?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Als Jesus auf den Weg hinausging«. Der griechische Ausdruck kann sowohl das Hinausgehen auf den Weg als auch den Beginn einer Reise bezeichnen.'
    reason: lexikalische Alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: Als Jesus sich auf den Weg machte
  rationale: Der Genitivus absolutus bezeichnet die gleichzeitig ablaufende Hintergrundhandlung. Die deutsche Wendung gibt den idiomatischen Sinn eines Aufbruchs natürlich wieder; der Name Jesus ersetzt zur Klarheit das im Griechischen kontextgebundene Pronomen.
- source_word: προσδραμὼν
  choice: lief ... herbei
  rationale: Die Form schildert anschaulich und knapp, dass der Mann im Laufen zu Jesus kam.
- source_word: εἷς
  choice: ein Mann
  rationale: Das substantivisch gebrauchte maskuline Zahlwort führt eine einzelne männliche Person in die Erzählung ein.
- source_word: γονυπετήσας αὐτόν
  choice: kniete vor ihm nieder
  rationale: Die Wiedergabe bezeichnet die ehrerbietige oder bittende Körperhaltung klar und in natürlichem Deutsch, ohne zusätzliche Motive einzutragen.
- source_word: ἐπηρώτα αὐτόν
  choice: fragte ihn
  rationale: Obwohl der griechische Imperfekt den Vorgang hervorheben kann, ist das einfache Präteritum im deutschen Erzählstil die natürliche Wiedergabe.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Guter Lehrer
  rationale: Die direkte Anrede bewahrt sowohl den Titel »Lehrer« als auch das für den folgenden Austausch bedeutsame Adjektiv »gut«.
- source_word: τί ποιήσω
  choice: was muss ich tun
  rationale: Die deliberative Frage zielt auf die erforderliche Handlung; »muss« bringt diese praktische Tragweite in heutigem Deutsch zum Ausdruck.
- source_word: ἵνα
  choice: damit
  rationale: »Damit« kennzeichnet den Zweck beziehungsweise das angestrebte Ergebnis knapp und ausdrücklich.
- source_word: ζωὴν αἰώνιον
  choice: ewiges Leben
  rationale: Dies ist die sachlich genaue, geläufige Wiedergabe, die sowohl den zeitlichen als auch den theologischen Gehalt offenhält.
- source_word: κληρονομήσω
  choice: ich ... erbe
  rationale: »Erben« bewahrt das Bild des Empfangens eines Erbteils und vermeidet die Verflachung zu bloßem Erlangen.
theological_decisions:
- issue: Anrede Jesu
  choice: Guter Lehrer
  alternative: Guter Meister
  rationale: διδάσκαλος bezeichnet hier einen Lehrer, nicht ausdrücklich einen Herrn. Die Übersetzung verstärkt den Titel daher nicht, bewahrt aber »gut« als Grundlage für Jesu Antwort im nächsten Vers.
- issue: Geschlecht von εἷς
  choice: ein Mann
  alternative: jemand / eine Person
  rationale: Die maskuline Singularform und der erzählerische Zusammenhang stützen die konkrete Wiedergabe »ein Mann«.
- issue: Verhältnis von Tun und Erben
  choice: was muss ich tun, damit ich ewiges Leben erbe?
  alternative: was soll ich tun, um ewiges Leben zu erlangen?
  rationale: Die Übersetzung lässt die im Wortlaut liegende Spannung zwischen menschlichem Tun und dem Empfangen eines Erbes bestehen, ohne sie theologisch aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt schlicht und eindringlich; die echte Mehrdeutigkeit der Wegformulierung wird in einer Fußnote erhalten.
