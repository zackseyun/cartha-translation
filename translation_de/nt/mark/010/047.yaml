    rationale: Der griechische Text sagt, dass er „zu rufen und zu sagen“ begann. Das bloße „laut zu rufen:“ glättet die Doppelung des Ausgangstextes. Eine sichere Ergänzung von „und zu sagen“ stellt die formale und stilistische Entsprechung wieder her.
