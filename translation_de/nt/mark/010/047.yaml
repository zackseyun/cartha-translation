  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: de
  text: 'Als er hörte, dass es Jesus, der Nazarener,[a] war, fing er an, laut zu rufen und zu sagen: »Jesus, Sohn Davids, hab Erbarmen mit mir!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus aus Nazareth«. Im Griechischen steht »Jesus, der Nazarener« – eine Beinamenform statt einer ausdrücklichen Herkunftsangabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Als er hörte
  rationale: Das vorzeitige Aoristpartizip wird im Deutschen natürlich als temporaler Nebensatz wiedergegeben und wahrt die zeitliche Abfolge.
- source_word: Ναζαρηνός
  choice: der Nazarener
  rationale: Die adjektivisch-beinameartige Bezeichnung wird enger am griechischen Ausdruck wiedergegeben als die geografisch explizitere Formulierung »aus Nazareth«.
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: fing er an, laut zu rufen
  rationale: »Fing an« bildet den Beginn der Handlung ab. Im natürlichen Deutschen umfasst »rufen« hier zugleich das laute Äußern der folgenden Worte; »laut« verdeutlicht die Dringlichkeit von κράζειν.
- source_word: Υἱὲ Δαυὶδ
  choice: Sohn Davids
  rationale: Die wörtliche, geläufige Titelform bewahrt sowohl den genealogischen Wortlaut als auch die königlich-messianische Resonanz.
- source_word: ἐλέησόν με
  choice: hab Erbarmen mit mir
  rationale: Die imperative Bitte wird würdig und verständlich wiedergegeben; »Erbarmen« bewahrt Gewicht und biblische Resonanz, ohne die Bitte auszudeuten.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird nach der etablierten deutschen Form wiedergegeben.
theological_decisions:
- issue: Messianische Bedeutung von »Sohn Davids«
  choice: Die Anrede »Sohn Davids« bleibt als Titel im Haupttext erhalten.
  alternative: »Nachkomme Davids«
  rationale: Die wörtliche Titelform lässt ihre königlich-messianische Bedeutung im Markusevangelium hervortreten, ohne sie auf eine rein genealogische Aussage zu verengen.
- issue: Wiedergabe von Ναζαρηνός
  choice: »der Nazarener«
  alternative: »Jesus aus Nazareth«
  rationale: Der griechische Text verwendet eine Beinamenform. Die gewählte Fassung bewahrt diese Form, während die Fußnote die geläufige geografische Wiedergabe nennt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist eindringlich, aber nicht altertümlich formuliert; »hab« entspricht natürlicher heutiger Anrede.
