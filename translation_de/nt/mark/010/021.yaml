source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: de
  text: 'Jesus sah ihn aufmerksam an, liebte ihn und sagte zu ihm: „Eines fehlt dir: Geh, verkaufe alles, was du hast,[a] und gib es den Armen; und du wirst einen Schatz im Himmel haben. Komm, folge mir!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „was immer du hast“. Die griechische Wendung ὅσα ἔχεις kann entweder „was immer du hast“ oder „alles, was du hast“ bedeuten; im Zusammenhang ist der gesamte Besitz gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας αὐτῷ
  choice: sah ihn aufmerksam an
  rationale: Das Partizip bezeichnet einen gezielten, aufmerksamen Blick. Die Formulierung ist natürlich und gibt mehr als ein beiläufiges Hinsehen wieder, ohne die Intensität unnötig zu steigern.
- source_word: ἠγάπησεν αὐτόν
  choice: gewann ihn lieb
  rationale: Die Wendung gibt die echte persönliche Zuwendung des Aorists idiomatisch wieder und bewahrt den erzählerischen Zusammenhang zwischen Jesu Blick und seiner Liebe. Sie schwächt die Liebe weder zu bloßer Freundlichkeit ab noch deutet sie diese technisch-dogmatisch.
- source_word: Ἕν σε ὑστερεῖ
  choice: Eines fehlt dir
  rationale: Das substantivierte Neutrum ἕν wird im Deutschen natürlich mit „Eines“ wiedergegeben; ὑστερεῖ bezeichnet den gegenwärtigen Mangel.
- source_word: ὕπαγε
  choice: Geh
  rationale: Schlichte und direkte Wiedergabe des Imperativs der Bewegung.
- source_word: ὅσα ἔχεις
  choice: alles, was du hast
  rationale: Die relative Wendung kann „was immer du hast“ oder umfassend „alles, was du hast“ bedeuten. Im Zusammenhang erstreckt sich der Auftrag auf den gesamten Besitz; die gewählte Form ist im Deutschen klar und natürlich.
- source_word: πώλησον
  choice: verkaufe
  rationale: Direkte Wiedergabe des Aoristimperativs mit gewöhnlicher kommerzieller Bedeutung.
- source_word: δὸς τοῖς πτωχοῖς
  choice: gib es den Armen
  rationale: Der substantivierte Plural bezeichnet arme Menschen. Das ergänzte Pronomen „es“ stellt im Deutschen den Bezug zum Erlös beziehungsweise Besitz natürlich her, ohne den Empfängerkreis zu verändern.
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: einen Schatz im Himmel
  rationale: Idiomatiche deutsche Wiedergabe der verheißenen himmlischen Gegenwirklichkeit; der unbestimmte Artikel ist im Deutschen erforderlich.
- source_word: δεῦρο
  choice: komm
  rationale: Das imperativisch gebrauchte Adverb fordert zur Bewegung zum Sprecher hin auf; „komm“ ist die natürliche deutsche Entsprechung.
- source_word: ἀκολούθει μοι
  choice: folge mir
  rationale: Der Präsensimperativ bezeichnet den Ruf in die Nachfolge, deren fortdauernder Charakter im Ausdruck selbst und im Kontext enthalten ist.
theological_decisions:
- issue: Bedeutung der Liebe Jesu zu dem Mann
  choice: „gewann ihn lieb“ als wirkliche persönliche Liebe und Zuwendung
  alternative: bloße äußere Freundlichkeit oder technisch verstandene erwählende beziehungsweise bundestheologische Liebe
  rationale: ἠγάπησεν αὐτόν sagt ausdrücklich, dass Jesus ihn liebte. Die Übersetzung wahrt die Spannung zwischen dieser Liebe und der anspruchsvollen Aufforderung, ohne eine spätere Lehrsystematik einzutragen.
- issue: Umfang des Auftrags bezüglich des Besitzes
  choice: „verkaufe alles, was du hast“
  alternative: „verkaufe, was immer du hast“ oder eine Abschwächung zu allgemeiner Freigebigkeit
  rationale: ὅσα ἔχεις lässt sprachlich beide Formulierungen zu, trägt im Kontext aber umfassende Bedeutung. Die Übersetzung erhält die volle Schärfe des Auftrags.
- issue: Verhältnis von Besitzverzicht und Schatz im Himmel
  choice: Die zeitliche beziehungsweise folgernde Verbindung wird mit „dann“ ausgedrückt, ohne die Art des Zusammenhangs systematisch zu erklären.
  alternative: eine ausdrückliche Deutung als Verdienst, Bedingung des Heils oder bloßes äußeres Zeichen
  rationale: Das griechische καί verbindet Auftrag und Verheißung, legt aber keine ausgearbeitete dogmatische Erklärung des Verhältnisses vor. Diese Offenheit bleibt bestehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Erzählton. Die Imperative bleiben knapp und eindringlich. „Gewann ihn lieb“ ist bewusst idiomatisch und persönlich; die Fußnote dokumentiert die echte lexikalische Alternative bei ὅσα ἔχεις.
