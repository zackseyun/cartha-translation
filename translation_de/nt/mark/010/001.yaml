id: MRK.10.1
reference: Mark 10:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: de
  text: Von dort bricht er auf und kommt in das Gebiet Judäas und in das Gebiet jenseits des Jordans.[a] Wieder strömen Menschenmengen zu ihm, und wie er es gewohnt war, lehrte er sie wieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung kann entweder zwei Ortsangaben meinen – das Gebiet Judäas und das Gebiet jenseits des Jordans – oder „jenseits des Jordans“ als nähere Bestimmung zu „Gebiet Judäas“ verstehen.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν ἀναστὰς
  choice: von dort macht er sich auf
  rationale: Die Wendung gibt den räumlichen Ausgangspunkt und das Aufbrechen idiomatisch wieder. ἀναστάς bezeichnet hier das Sichaufmachen, nicht eine Auferstehung.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das Präsens bewahrt Markus’ anschauliches historisches Präsens.
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: das Gebiet von Judäa
  rationale: ὅρια bezeichnet hier eher ein Gebiet beziehungsweise Territorium als nur eine Grenzlinie.
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: und jenseits des Jordans
  rationale: Die knappe Wiedergabe folgt der griechischen Wortfolge und lässt offen, ob ein weiterer Bereich oder eine nähere Bestimmung des Gebiets gemeint ist.
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: Menschenmengen strömen zu ihm
  rationale: Das Verb bezeichnet hier das gemeinsame Hinziehen beziehungsweise Zusammenkommen bei Jesus; „strömen“ gibt die Bewegung vieler Menschen natürlich wieder.
- source_word: πάλιν
  choice: wieder
  rationale: Beide Vorkommen werden beibehalten, um Markus’ Wiederholung und den wiederkehrenden Vorgang sichtbar zu machen.
- source_word: ὡς εἰώθει
  choice: wie es seine Gewohnheit war
  rationale: Die Formulierung bringt die gewohnheitsmäßige Tätigkeit klar und würdevoll zum Ausdruck.
- source_word: ἐδίδασκεν αὐτούς
  choice: lehrte er sie
  rationale: „Lehrte“ entspricht dem Imperfekt in einem Zusammenhang wiederholter beziehungsweise gewohnheitsmäßiger Tätigkeit.
theological_decisions:
- issue: Historisches Präsens in der Erzählung
  choice: Das Präsens „kommt“ wird beibehalten.
  alternative: Durchgehend mit „ging/kam“ in die deutsche Vergangenheit wechseln.
  rationale: Das historische Präsens gehört zu Markus’ lebendiger Erzählweise. Die deutsche Formulierung bleibt verständlich, ohne diese Eigenart vollständig einzuebnen.
- issue: Bezug von καὶ πέραν τοῦ Ἰορδάνου
  choice: „in das Gebiet von Judäa und jenseits des Jordans“
  alternative: „in das jenseits des Jordans gelegene Gebiet von Judäa“ oder zwei ausdrücklich getrennte Zielgebiete
  rationale: Der griechische Satz ist syntaktisch knapp und lässt den genauen Bezug der Ortsangabe offen. Haupttext und Fußnote bewahren diese Spannung, statt sie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markinische Wiederholung von „wieder“ bleibt erhalten. „Menschenmengen“ wahrt den Plural von ὄχλοι und ist verständlicher als das altertümliche „Scharen“.
