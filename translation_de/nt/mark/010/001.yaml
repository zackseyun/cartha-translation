  rationale: Die Revision glättet die deutsche Ortskoordination und formuliert die Gewohnheitsangabe idiomatischer. Die Fußnote hält die im griechischen Satzbau bestehende alternative Zuordnung von πέραν τοῦ Ἰορδάνου ausdrücklich offen, ohne eine der Lesarten als alleinige Aussage des Ausgangstextes auszugeben.
