    issue: Die koordinierte Ortsangabe ist im deutschen Haupttext syntaktisch und semantisch missverständlich.
    rationale: „in das Gebiet von Judäa und jenseits des Jordans“ verbindet ein Akkusativziel mit einer adverbialen Ortsbestimmung. Die Wiederholung von „in das Gebiet“ macht die als Hauptlesart gewählte Deutung zweier Zielbereiche sprachlich tragfähig; die Fußnote bewahrt die alternative Einordnung.
  - severity: low
    issue: „Wie es seine Gewohnheit war“ ist weniger idiomatisch als eine auf die Handlung bezogene Wendung.
    rationale: ὡς εἰώθει bezeichnet Jesu übliches Tun. „Wie er es gewohnt war“ stellt diesen habitualen Handlungsbezug im modernen Deutschen natürlicher her.
