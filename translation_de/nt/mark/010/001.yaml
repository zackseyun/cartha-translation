  source_fidelity: 'Die Wiedergabe trifft die wesentlichen Elemente des griechischen Textes: das historische Präsens bei „kommt“ und „strömen“, die wiederholte Markierung „wieder“, den Plural „Menschenmengen“ sowie den gewohnheitsmäßigen Sinn von ὡς εἰώθει. Die Ortsphrase ist im Griechischen jedoch syntaktisch umstritten; die deutsche Haupttextformulierung sollte nicht durch eine missverständliche Ellipse unnötig ungrammatisch wirken.'
  naturalness: „… kommt in das Gebiet von Judäa und jenseits des Jordans“ ist im Deutschen holprig, da „in das Gebiet“ nicht ohne Weiteres zugleich mit „jenseits des Jordans“ koordiniert werden kann. Eine ausdrückliche Wiederholung von „in das Gebiet“ ist klar und natürlich. „Wie er es gewohnt war“ ist für die gewohnheitsmäßige Handlung idiomatischer als „wie es seine Gewohnheit war“.
  terminology: „Judäa“, „Jordan“, „Menschenmengen“ und „lehrte“ sind angemessenes modernes Standarddeutsch mit würdigem biblischem Register. „Von dort bricht er auf“ gibt ἐκεῖθεν ἀναστὰς idiomatisch wieder, ohne den Partizip als Auferstehung zu missverstehen.
  issues:
