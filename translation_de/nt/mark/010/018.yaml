review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Frage mit dem idiomatischen »Warum« und die Wiederholung von ἀγαθός durchgehend mit »gut« zutreffend wieder. Die bisherige Schlussformulierung »außer dem einen: Gott« bildet zwar die griechische Hervorhebung von εἷς ab, ist im Deutschen jedoch syntaktisch und idiomatisch zu abrupt.'
  naturalness: '»Doch Jesus sagte zu ihm« und »Warum nennst du mich gut?« sind modernes Standarddeutsch. »Außer einem einzigen: Gott« ist gegenüber »außer dem einen: Gott« deutlich natürlicher, ohne die vorangestellte Betonung der Einzigkeit oder die appositionelle Identifikation aufzugeben.'
  terminology: »Gott« und »gut« sind angemessen und bewahren sowohl den Bezug des Artikels ὁ θεός als auch die rhetorische Wortwiederholung. Die Formulierung vermeidet jede christologische Ausdeutung.
  issues:
