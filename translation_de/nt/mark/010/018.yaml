id: MRK.10.18
reference: Mark 10:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: de
  text: 'Doch Jesus sagte zu ihm: »Warum nennst du mich gut?[a] Niemand ist gut außer einem einzigen: Gott.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Wozu nennst du mich gut?«'
    reason: Lexikalische Alternative zu dem adverbial verstandenen Τί; sie bewahrt die formalere Ausdrucksweise des Griechischen.
lexical_decisions:
- source_word: δὲ
  choice: Doch
  rationale: Markiert knapp den leichten Gegensatz beziehungsweise die antwortende Wendung nach der Anrede des Mannes.
- source_word: εἶπεν αὐτῷ
  choice: sagte zu ihm
  rationale: Gibt λέγω mit indirektem Objekt transparent und idiomatisch wieder.
- source_word: Τί
  choice: Warum
  rationale: Τί wird in dieser Verbindung adverbial gebraucht; im heutigen Deutsch ist „Warum“ die natürliche Wiedergabe. Die formalere Alternative wird in der Fußnote bewahrt.
- source_word: με λέγεις ἀγαθόν
  choice: nennst du mich gut
  rationale: Bewahrt die direkte prädikative Aussage über Jesus und klingt im Deutschen natürlich.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: gut
  rationale: Die identische Wiedergabe erhält die lexikalische Wiederholung und die rhetorische Spannung, ohne „gut“ näher zu deuten.
- source_word: οὐδεὶς
  choice: Niemand
  rationale: Klare und natürliche Wiedergabe der umfassenden Verneinung.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: 'außer dem einen: Gott'
  rationale: Bewahrt die Ausnahmeformulierung, die Betonung der Einzigkeit und die nachgestellte Identifizierung als Gott.
theological_decisions:
- issue: Mögliche christologische Folgerung aus Jesu Aussage über das Gutsein
  choice: Die Aussage wird ohne deutende Zusätze wiedergegeben und behält ihre Spannung.
  alternative: Eine Formulierung, die entweder eine Leugnung der Göttlichkeit Jesu oder eine ausdrückliche Behauptung seiner Göttlichkeit nahelegt.
  rationale: Der griechische Wortlaut fordert die Anrede des Mannes heraus, zieht in diesem Satz aber die mögliche christologische Folgerung nicht ausdrücklich. Die Übersetzung entscheidet diese Spannung daher nicht.
translation_notes:
  register: 'Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Doch“ bildet die antwortende Wendung knapp ab; „dem einen: Gott“ erhält die markierte Einzigkeit und die rhetorische Nachstellung.'
