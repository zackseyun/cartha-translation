    issue: Unidiomatische Schlussformulierung
    rationale: '»Niemand ist gut außer dem einen: Gott« klingt im modernen Deutschen elliptisch und künstlich. Das griechische εἰ μὴ εἷς ὁ θεός lässt sich natürlich und zugleich eng als »außer einem einzigen: Gott« wiedergeben.'
