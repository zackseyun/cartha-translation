  revision_rationale: Die Revision beschränkt sich auf die Schlussaussage. Sie ersetzt die im Deutschen schwer verständliche Nominalgruppe »dem einen« durch »einem einzigen«, erhält aber die vom griechischen εἷς markierte Einzigkeit und die nachgestellte Benennung Gottes. Die Fußnote ist korrekt verankert und gibt eine vertretbare formalere Alternative wieder.
