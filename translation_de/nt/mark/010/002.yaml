  - severity: low
    issue: Ungenaue Formulierung in der Fußnotenbegründung
    rationale: „Entlassen“ ist zwar eine mögliche wörtlichere deutsche Annäherung an ἀπολύω, aber die Aussage über eine „aktive Form des griechischen Verbs“ ist sprachlich unpräzise und für Leser der Fußnote nicht nötig.
