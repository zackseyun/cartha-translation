  source_fidelity: 'Die Grundbedeutung wird zutreffend wiedergegeben: Die Pharisäer richten eine Rechtsfrage zur Scheidung an Jesus. Die Umschreibung „Damit stellten sie ihn auf die Probe“ ist jedoch weniger eng an das zugleich mit dem Fragen ausgedrückte Ziel des Partizips πειράζοντες gebunden als eine finale Wiedergabe mit „um ... zu“.'
  naturalness: Die vorgeschlagene Fassung ist modernes, idiomatisches Standarddeutsch. „Sich von seiner Frau scheiden lassen“ ist die normale heutige deutsche Ausdrucksweise; sie kann die historisch einseitigere Form des griechischen Scheidungsbegriffs nicht vollständig abbilden, ohne unnatürlich oder missverständlich zu werden.
  terminology: „Mann“, „Frau“, „scheiden lassen“ und „auf die Probe stellen“ sind angemessen. Die Fußnote kann die mögliche Lesart „Ehemann“ sowie das wörtlichere „entlassen“ nennen, sollte aber nicht behaupten, dass die griechische Verbform selbst im Deutschen einfach als „aktive Form“ abzubilden sei.
