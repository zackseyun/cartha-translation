  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: de
  text: Und sie fragten ihn, ob ein Mann sich von seiner Frau scheiden lassen dürfe[a], um ihn auf die Probe zu stellen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ob ein Ehemann seine Frau entlassen dürfe.'
    reason: ἀνήρ und γυνή können im ehelichen Zusammenhang ausdrücklich als „Ehemann“ und „Ehefrau“ verstanden werden. ἀπολύω kann wörtlicher mit „entlassen“ wiedergegeben werden; im heutigen Deutsch ist dies im Scheidungskontext jedoch weniger eindeutig.
lexical_decisions:
- source_word: ἐπηρώτων
  choice: sie fragten ihn
  rationale: Das Imperfekt beschreibt die im Gang befindliche Befragung. Im natürlichen deutschen Erzählstil gibt das Präteritum dies ohne eine unbelegte Betonung von Wiederholung wieder.
- source_word: ἔξεστιν
  choice: dürfe
  rationale: Das Modalverb „dürfen“ gibt in der indirekten Frage knapp und idiomatisch die rechtliche beziehungsweise religiös-rechtliche Erlaubnis wieder.
- source_word: ἀνδρὶ
  choice: ein Mann
  rationale: ἀνήρ kann „Mann“ oder „Ehemann“ bedeuten. „Ein Mann“ bewahrt die allgemeine Form der Rechtsfrage; durch „seiner Frau“ ist der eheliche Zusammenhang eindeutig.
- source_word: γυναῖκα
  choice: seiner Frau
  rationale: γυνή bezeichnet im Zusammenhang mit Scheidung die Ehefrau. Das Possessivpronomen ist im Deutschen für eine natürliche Formulierung erforderlich, obwohl es im Griechischen nicht ausdrücklich steht.
- source_word: ἀπολῦσαι
  choice: sich von seiner Frau scheiden
  rationale: Im ehe- und rechtsbezogenen Kontext bedeutet ἀπολύω idiomatisch „scheiden“. Die reflexive deutsche Wendung ist modern und eindeutig; „entlassen“ könnte außerhalb des historischen Kontexts missverstanden werden.
- source_word: πειράζοντες
  choice: Damit stellten sie ihn auf die Probe
  rationale: Die Wendung gibt das begleitende Partizip natürlich wieder und bewahrt den Sinn eines prüfenden, im Kontext feindseligen Vorgehens, ohne bereits ausdrücklich eine Falle zu unterstellen.
- source_word: Καὶ
  choice: Und
  rationale: Der einfache Anschluss bewahrt den fortlaufenden Erzählfluss, ohne zusätzliche zeitliche oder logische Nuancen einzutragen.
theological_decisions:
- issue: Mehrdeutigkeit von ἀνήρ zwischen „Mann“ und „Ehemann“
  choice: ein Mann
  alternative: ein Ehemann
  rationale: Die generische Einzelform der Rechtsfrage bleibt erhalten. Der Ehebezug ergibt sich bereits aus „seiner Frau“, sodass keine Auslegung zur Scheidungsfrage hinzugefügt wird.
- issue: Bedeutung von πειράζω
  choice: auf die Probe stellen
  alternative: versuchen, ihm eine Falle zu stellen
  rationale: „Auf die Probe stellen“ bewahrt die lexikalische Breite. Die feindselige Absicht ist im Zusammenhang erkennbar, wird aber nicht stärker ausformuliert, als der Vers selbst es verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der griechische Partizipialsatz wird zur Klarheit als eigener Satz wiedergegeben. Der Konjunktiv „dürfe“ kennzeichnet die indirekte Frage natürlich.
