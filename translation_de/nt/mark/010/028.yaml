id: MRK.10.28
reference: Mark 10:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἤρξατο ⸂λέγειν ὁ Πέτρος⸃ αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ⸀ἠκολουθήκαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: de
  text: 'Da begann Petrus zu ihm zu sagen: „Sieh, wir haben alles verlassen und sind dir nachgefolgt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: begann … zu sagen
  rationale: Die Verbindung aus ἤρξατο und Infinitiv bezeichnet idiomatisch den Beginn des Sprechens; die etwas markierte Formulierung wahrt zugleich den griechischen Ausdruck.
- source_word: ὁ Πέτρος
  choice: Petrus
  rationale: Der Personenname wird gemäß etablierter deutscher Bibeltradition wiedergegeben.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Das Pronomen verweist im Kontext auf Jesus; der Name wird nicht erläuternd ergänzt.
- source_word: Ἰδοὺ
  choice: Sieh
  rationale: Der Aufmerksamkeitsmarker leitet die betonte Aussage ein. „Sieh“ ist würdig und verständlich; „Siehe“ wäre stärker traditionell geprägt, „Schau“ umgangssprachlicher.
- source_word: ἡμεῖς
  choice: wir
  rationale: Das ausdrücklich gesetzte Pronomen trägt Nachdruck, der im Deutschen durch die Stellung direkt nach „Sieh“ erkennbar bleibt.
- source_word: ἀφήκαμεν
  choice: haben … verlassen
  rationale: Das Perfekt ist im Deutschen für eine zurückliegende Handlung mit gegenwärtiger Bedeutung natürlich; „aufgegeben“ würde die Aussage stärker ausdeuten.
- source_word: πάντα
  choice: alles
  rationale: Die umfassende Aussage wird knapp und idiomatisch wiedergegeben, ohne ihren Bezug auf Besitz und bisherige Bindungen einzuengen.
- source_word: ἠκολουθήκαμέν
  choice: sind … nachgefolgt
  rationale: Das griechische Perfekt bezeichnet vollzogene Nachfolge mit fortdauernder Bedeutung. Das deutsche Perfekt mit „nachfolgen“ bildet dies natürlich ab.
- source_word: σοι
  choice: dir
  rationale: Der Dativ bei ἀκολουθέω wird entsprechend der deutschen Rektion von „nachfolgen“ als „dir“ wiedergegeben.
theological_decisions:
- issue: Petrus’ Anspruch auf umfassenden Verzicht und Nachfolge
  choice: Die Aussage wird ohne wertende oder abschwächende Ergänzung als Petrus’ eigener Anspruch wiedergegeben.
  alternative: Die Aussage als „wir haben alles aufgegeben“ deuten oder durch einen Zusatz im Licht der folgenden Antwort Jesu einordnen.
  rationale: Der Vers berichtet Petrus’ betonte Aussage, ohne sie an dieser Stelle ausdrücklich zu bestätigen oder zu korrigieren. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sieh“ bewahrt die aufmerksamkeitslenkende Funktion von ἰδού, ohne das stärker altertümliche „Siehe“ zu verwenden. Die etwas feierliche Wendung „begann … zu sagen“ folgt der griechischen Erzählform eng und bleibt gut verständlich.
