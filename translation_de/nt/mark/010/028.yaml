review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt ἤρξατο λέγειν mit „begann … zu sagen“ eng und zutreffend wieder, bewahrt das an Jesus zurückverweisende Pronomen „zu ihm“ und erhält sowohl die umfassende Aussage „alles“ als auch die vollzogene Nachfolge im deutschen Perfekt. Die betonte Selbstbezeichnung ἡμεῖς bleibt in „wir“ erkennbar. Das einleitende „Da“ ist eine geringfügige, im deutschen Erzählstil unauffällige Verknüpfung und verändert den Sinn nicht.
  naturalness: Das Deutsch ist verständlich, modern-standardsprachlich und für einen würdevollen Bibeltext angemessen. „Begann … zu sagen“ ist leicht literarisch, aber eine legitime und gut verständliche formnahe Wiedergabe der griechischen Konstruktion. „Sieh“ ist weniger umgangssprachlich als „Schau“ und wahrt die aufmerksamkeitslenkende Funktion von ἰδού.
  terminology: „Petrus“, „verlassen“ und „nachfolgen“ sind etablierte, sachgerechte Begriffe. Die Wiedergabe bleibt bei Petrus’ Aussage und fügt keine theologische Wertung hinzu. Es sind keine Fußnoten erforderlich; die mit ἰδού verbundenen möglichen stilistischen Alternativen begründen keine notwendige deutsche Anmerkung.
