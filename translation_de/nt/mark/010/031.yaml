  text: πολλοὶ δὲ ἔσονται πρῶτοι ἔσχατοι καὶ ⸀οἱ ἔσχατοι πρῶτοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: de
  text: Doch viele Erste werden Letzte sein und die Letzten Erste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet eine offene, nicht allumfassende Gruppe. „Viele“ ist im Deutschen knapp und natürlich.
- source_word: δὲ
  choice: doch
  rationale: δέ kennzeichnet hier einen leichten Gegensatz beziehungsweise eine überleitende Gegenüberstellung zum vorangehenden Vers. „Doch“ wahrt diesen Ton ohne ihn zu verschärfen.
- source_word: ἔσονται
  choice: werden … sein
  rationale: Die Futurform von εἰμί wird als schlichtes zukünftiges Sein wiedergegeben.
- source_word: πρῶτοι
  choice: Erste
  rationale: πρῶτοι bezeichnet hier Rang oder Stellung. Das substantivierte „Erste“ erhält die prägnante Gegenüberstellung zu „Letzte“.
- source_word: ἔσχατοι
  choice: Letzte
  rationale: ἔσχατοι steht im Gegensatz zu πρῶτοι und bezeichnet Stellung oder Rang. „Letzte“ bewahrt diesen direkten Gegensatz.
- source_word: οἱ ἔσχατοι
  choice: die Letzten
  rationale: Der Artikel macht das Adjektiv substantivisch; „die Letzten“ bildet dies unmittelbar und idiomatisch ab.
- source_word: καὶ
  choice: und
  rationale: Die Konjunktion verbindet schlicht die beiden parallelen Hälften des Ausspruchs.
theological_decisions:
- issue: Art der Umkehrung von Ersten und Letzten
  choice: Der Satz bleibt als allgemeiner Grundsatz einer künftigen Umkehrung formuliert, ohne die Gruppen näher festzulegen.
  alternative: „Erste“ und „Letzte“ ausdrücklich etwa auf Reiche und Arme, Jünger und Außenstehende oder auf jeden Einzelfall beziehen.
  rationale: Der Vers benennt die Kategorien nicht näher. Die knappe, offene Formulierung bewahrt deshalb die theologische Spannung und vermeidet eine nicht im Text ausgesprochene Eingrenzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe, sprichwortartige Parallelstruktur des griechischen Textes bleibt erhalten; die Nominalformen „Erste“ und „Letzte“ sind im Deutschen eindeutig auf Personen bezogen.
