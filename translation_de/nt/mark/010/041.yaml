  source_fidelity: Der Entwurf gibt die Abfolge des aoristischen Partizips, „die Zehn“, das einsetzende Reagieren (ἤρξαντο) und die Mehrdeutigkeit von περί sachgerecht wieder. „Unwillig“ ist jedoch im heutigen Deutsch weniger eindeutig und kann auch „nicht bereit/widerwillig“ bedeuten; es trifft ἀγανακτεῖν daher nicht so präzise wie „sich empören“.
  naturalness: „Wurden sie unwillig“ wirkt im modernen Standarddeutsch leicht gehoben und semantisch unscharf. „Begannen sie, sich ... zu empören“ ist natürlich, klar und bildet die ingressive Verbfügung des Griechischen direkt ab.
  terminology: Jakobus und Johannes sind die üblichen deutschen Namensformen. „Sich empören“ gibt die starke missbilligende Reaktion von ἀγανακτεῖν angemessen wieder, ohne eine weitergehende Deutung einzutragen.
