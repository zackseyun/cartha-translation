source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ δέκα ἤρξαντο ἀγανακτεῖν περὶ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/041.yaml
  text: And when the ten heard it[a], they began to be indignant with James and John.
translation:
  language: de
  text: Als die Zehn das hörten, begannen sie, sich über Jakobus und Johannes zu empören.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wegen Jakobus und Johannes«. Die griechische Präposition kann sowohl die Personen bezeichnen, gegen die sich ihr Unmut richtet, als auch den Anlass ihres Unmuts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Als
  rationale: Die griechische Satzverknüpfung wird zusammen mit dem vorangestellten Aoristpartizip als natürlicher deutscher Temporalsatz wiedergegeben; ein zusätzliches »Und« wäre im modernen Deutsch unnötig schwerfällig.
- source_word: ἀκούσαντες
  choice: als ... das hörten
  rationale: Das Aoristpartizip bezeichnet eine der Hauptreaktion vorausgehende Wahrnehmung. »Das« nimmt den unmittelbar vorangehenden Inhalt aus dem Kontext auf.
- source_word: οἱ δέκα
  choice: die Zehn
  rationale: Bewahrt die knappe Form des Griechischen. Dass die übrigen zehn Jünger gemeint sind, ergibt sich aus dem Kontext und wird nicht erläuternd in den Text eingefügt.
- source_word: ἤρξαντο ἀγανακτεῖν
  choice: wurden ... unwillig
  rationale: Die Konstruktion bezeichnet das Einsetzen starken Unmuts. Das deutsche »wurden unwillig« gibt diesen Beginn idiomatisch wieder, ohne ein umständliches »begannen, unwillig zu sein«.
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: über Jakobus und Johannes
  rationale: »Über« kann im Deutschen sowohl die Zielrichtung als auch den Anlass des Unmuts ausdrücken und bewahrt damit die Bedeutungsbreite von περί.
- source_word: Ἰακώβου
  choice: Jakobus
  rationale: Eingebürgerte deutsche Namensform von Ἰάκωβος.
- source_word: Ἰωάννου
  choice: Johannes
  rationale: Eingebürgerte deutsche Namensform von Ἰωάννης.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Unwillig« bewahrt den starken, wertenden Unmut von ἀγανακτεῖν; »die Zehn« hält sich eng an die knappe griechische Bezeichnung.
