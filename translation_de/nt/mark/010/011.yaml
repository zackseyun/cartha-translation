id: MRK.10.11
reference: Mark 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: de
  text: 'Und er sagt zu ihnen: „Wer sich von seiner Frau scheiden lässt und eine andere heiratet, begeht ihr gegenüber Ehebruch.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt das für Markus typische historische Präsens und klingt im Deutschen in einer lebendigen Erzählung natürlich.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Der Dativ bezeichnet die Adressaten der Aussage und wird idiomatisch mit „zu ihnen“ wiedergegeben.
- source_word: Ὃς ἂν
  choice: Wer
  rationale: Relativpronomen mit ἄν formuliert einen allgemeinen, unbestimmten Fall; deutsches „Wer“ gibt dies knapp und natürlich wieder.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: sich von seiner Frau scheiden lässt
  rationale: Im ehelichen Zusammenhang bezeichnet ἀπολύω die Scheidung. Die Formulierung ist in modernem Deutsch eindeutig und macht den im Griechischen vorausgesetzten Ehemann zum Handelnden, ohne beim wörtlichen, heute missverständlichen „entlässt“ zu bleiben.
- source_word: γαμήσῃ ἄλλην
  choice: eine andere heiratet
  rationale: ἄλλην ist feminin und bezeichnet eine andere Frau; durch „eine andere“ wird dies im Deutschen grammatisch ausdrücklich sichtbar.
- source_word: μοιχᾶται
  choice: begeht Ehebruch
  rationale: Dies ist die geläufige und präzise deutsche Wiedergabe des Verbs im ehelichen Zusammenhang.
- source_word: ἐπ’ αὐτήν
  choice: ihr gegenüber
  rationale: Die Wendung bewahrt den Bezug auf die geschiedene Frau und bringt zum Ausdruck, dass die Tat ein ihr zugefügtes Unrecht ist.
theological_decisions:
- issue: Beibehaltung des Bezugs von ἐπ’ αὐτήν auf die Ehefrau
  choice: „begeht ihr gegenüber Ehebruch“
  alternative: „begeht Ehebruch“ oder „begeht mit der anderen Ehebruch“
  rationale: Die griechische Präpositionalphrase darf nicht eingeebnet werden. „Ihr gegenüber“ bewahrt sowohl den Bezug auf die erste Frau als auch den Gedanken des gegen sie gerichteten Unrechts, ohne die Wendung übermäßig auszudeuten.
- issue: Allgemeine Bedingungsform trotz maskulinem Singular
  choice: „Wer … seine Frau“
  alternative: „Jeder Mann, der …“
  rationale: „Wer“ gibt die unbestimmte Konstruktion ὃς ἄν natürlich wieder; durch „seine Frau“ bleibt zugleich klar, dass im unmittelbaren Satz von einem Ehemann die Rede ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das markinische historische Präsens bleibt erhalten. Die rechtlich-eheliche Bedeutung von ἀπολύω wird idiomatisch ausgedrückt; die ungewöhnliche, aber inhaltlich wichtige Wendung ἐπ’ αὐτήν wird mit „ihr gegenüber“ bewahrt.
