source:
  edition: SBLGNT
  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: de
  text: Doch das Sitzen zu meiner Rechten oder zu meiner Linken zu gewähren, steht nicht mir zu[a], sondern ist für diejenigen bestimmt, für die es vorbereitet ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es steht mir nicht zu, dies zu gewähren.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι
  choice: wer ... sitzt
  rationale: Der substantivierte Infinitiv bezeichnet hier das Sitzen auf den genannten Ehrenplätzen. Die deutsche Satzform mit „wer ... sitzt“ gibt den Sinn natürlich wieder und verbindet sich klar mit „für die“ im zweiten Satzteil.
- source_word: ἐκ δεξιῶν μου
  choice: zu meiner Rechten
  rationale: Die feste deutsche Wendung bezeichnet die Position an Jesu rechter Seite und entspricht dem räumlichen griechischen Ausdruck.
- source_word: ἢ ἐξ εὐωνύμων
  choice: oder zu meiner Linken
  rationale: Die parallele Formulierung wahrt die ausgewogene Gegenüberstellung der beiden Seiten.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: das zu vergeben, steht nicht mir zu
  rationale: Diese Wiedergabe drückt idiomatisch aus, dass die Vergabe nicht Jesus zukommt, ohne den Grund oder Umfang dieser Aussage näher zu bestimmen.
- source_word: ἀλλ’ οἷς
  choice: sondern ist für die bestimmt, für die
  rationale: Der griechische Ausdruck ist elliptisch. „Ist für die bestimmt“ ergänzt im Deutschen nur das zum Verständnis notwendige Prädikat und erhält den Gegensatz.
- source_word: ἡτοίμασται
  choice: es vorbereitet ist
  rationale: Das Perfekt Passiv bezeichnet eine vollzogene Vorbereitung mit fortbestehendem Ergebnis; „vorbereitet ist“ gibt dies in natürlichem Deutsch wieder, ohne den Handelnden hinzuzufügen.
theological_decisions:
- issue: Ob Jesu Aussage seine Vollmacht absolut verneint oder eine im Kontext geltende Zuständigkeit beschreibt
  choice: „steht nicht mir zu“ ohne erklärenden Zusatz
  alternative: „steht nicht mir zu, außer nach dem Willen des Vaters“
  rationale: Der griechische Text nennt keine Begründung und keinen ausdrücklichen Vorbehalt. Die Übersetzung bewahrt daher die theologische Spannung, statt sie durch eine harmonisierende Ergänzung aufzulösen.
- issue: Wer die Plätze vorbereitet hat
  choice: Passiv ohne Nennung des Handelnden
  alternative: „die Gott dafür vorbereitet hat“
  rationale: Das griechische Passiv lässt den Handelnden unausgesprochen. Obwohl ein göttliches Passiv möglich ist, soll diese Deutung nicht in den Haupttext eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu meiner Rechten/Linken“ bewahrt den biblisch-räumlichen Ton, während „steht nicht mir zu“ gegenwärtig und allgemein verständlich ist. Der Fußnotenmarker [a] steht unmittelbar an der betreffenden Wendung.
