- from: 'Jesus blickte sich um und sagte zu seinen Jüngern: „Wie schwer ist es für Menschen, die Reichtum besitzen,[a] in das Reich Gottes zu kommen!“'
  to: 'Jesus blickte sich um und sagte zu seinen Jüngern: „Wie schwer wird es für diejenigen sein, die Reichtum haben,[a] in das Reich Gottes hineinzukommen!“'
  rationale: Die Revision bewahrt die natürliche deutsche Erzählform mit Präteritum für das markinische historische Präsens, stellt aber den von εἰσελεύσονται getragenen Zukunftsbezug ausdrücklich wieder her. „Diejenigen, die Reichtum haben“ entspricht der offenen partizipialen Personenbezeichnung ohne ein festes soziales Etikett. „Hineinzukommen“ gibt εἰσελεύσονται in Verbindung mit εἰς genauer wieder. Die Fußnote wurde als klare, nicht einengende lexikalische Alternative formuliert.
