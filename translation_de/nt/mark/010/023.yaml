review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: Jesu Umschauen, die Anrede an die Jünger, die Schwierigkeit für Besitzende und das Eintreten in das Reich Gottes. Allerdings gibt „ist es“ den durch εἰσελεύσονται bestimmten Zukunftsbezug nicht ausreichend wieder. „Menschen“ ist gegenüber dem substantivierten Partizip zwar möglich, aber unnötig ergänzend.'
  naturalness: Der Satz ist verständlich und idiomatisch. „Wie schwer wird es für diejenigen sein, die Reichtum haben“ ist im modernen Standarddeutsch ebenso natürlich und bildet den griechischen Zukunftsbezug genauer ab. „in das Reich Gottes hineinzukommen“ ist hier präziser als das etwas allgemeinere „zu kommen“.
  terminology: „Reich Gottes“ ist angemessen und etabliert. „Reichtum haben“ wahrt die offene Bedeutung von χρήματα (Geld, Vermögen, Besitz) besser als eine soziale Festlegung auf „die Reichen“. Die Fußnote sollte als echte Alternative nicht die im Haupttext bereits verwendete Bedeutung lediglich umschreiben.
  issues:
  - severity: medium
    issue: Der Zukunftsbezug von εἰσελεύσονται fehlt in der deutschen Hauptaussage.
    rationale: Das finite Verb εἰσελεύσονται steht im Futur. In der exklamativ-idiomatischen deutschen Konstruktion sollte dies mit „Wie schwer wird es ... sein“ sichtbar bleiben; „Wie schwer ist es“ verallgemeinert die Aussage und schwächt den grammatischen Bezug.
  - severity: low
    issue: „Menschen“ ergänzt eine im griechischen Text nicht ausdrücklich vorhandene allgemeine Personenbezeichnung.
    rationale: οἱ τὰ χρήματα ἔχοντες lässt sich im Deutschen knapp und natürlich als „diejenigen, die Reichtum haben“ wiedergeben, ohne die Aussage inhaltlich zu verändern.
  - severity: low
    issue: Die Fußnote bietet keine klar abgegrenzte lexikalische Alternative zur gewählten Wendung.
    rationale: Bei Haupttext „Reichtum besitzen“ ist „Besitz haben“ sehr nahe, während „Geld haben“ den Bereich verengen kann. Eine Fußnote mit „Vermögen“ und „Besitz“ bildet χρήματα als materielle Mittel bzw. Güter klarer ab.
  revised_text: 'Jesus blickte sich um und sagte zu seinen Jüngern: „Wie schwer wird es für diejenigen sein, die Reichtum haben,[a] in das Reich Gottes hineinzukommen!“'
