source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: de
  text: 'Jesus blickte sich um und sagte zu seinen Jüngern: „Wie schwer wird es für diejenigen sein, die Reichtum haben,[a] in das Reich Gottes hineinzukommen!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Vermögen haben“ oder „Besitz haben“.'
    reason: Lexikalische Alternativen für χρήματα, das Geldmittel, Vermögen oder materiellen Besitz bezeichnen kann.
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: blickte sich um
  rationale: Das Aoristpartizip beschreibt, wie Jesus die Umstehenden in den Blick nimmt. Die koordinierte Form ist im Deutschen natürlich und bewahrt die anschauliche Bewegung, ohne ein bloß flüchtiges Schauen anzudeuten.
- source_word: λέγει
  choice: sagte
  rationale: Das Präsens ist das für Markus typische historische Präsens. Im modernen deutschen Erzählstil gibt das Präteritum die Erzählhandlung natürlich wieder, ohne die Bedeutung zu verändern.
- source_word: Πῶς δυσκόλως
  choice: Wie schwer ist es
  rationale: Die Verbindung ist ein betonter Ausruf über die große Schwierigkeit. Eine wörtlich-adverbiale Wiedergabe wäre im Deutschen unnatürlich.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: Menschen, die Reichtum besitzen
  rationale: Die partizipiale Wendung bezeichnet Personen, die über Geld oder materiellen Besitz verfügen. Die Umschreibung vermeidet, sie vorschnell auf das feste soziale Etikett „die Reichen“ zu reduzieren.
- source_word: χρήματα
  choice: Reichtum
  rationale: Das Wort kann Geld, Vermögen oder Besitz bezeichnen. „Reichtum“ erfasst hier den umfassenden materiellen Sinn; die Fußnote bewahrt engere mögliche Wiedergaben.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: Reich Gottes
  rationale: Die geläufige und transparente deutsche Wiedergabe bewahrt das konkrete Reich-Motiv und die Kontinuität des markinischen Sprachgebrauchs.
- source_word: εἰσελεύσονται
  choice: zu kommen
  rationale: Der griechische Futur bezeichnet das Eintreten beziehungsweise Hineinkommen. In der deutschen Konstruktion „Wie schwer ist es … zu kommen“ wird der generelle Zukunftsbezug idiomatisch mitgetragen.
theological_decisions:
- issue: Bezeichnet Jesu Aussage große Schwierigkeit oder Unmöglichkeit?
  choice: 'große Schwierigkeit: „Wie schwer ist es …“'
  alternative: eine zugespitzte Wiedergabe als praktische oder absolute Unmöglichkeit
  rationale: δυσκόλως bedeutet „mit Mühe/schwer“ und nicht „unmöglich“. Die Übersetzung bewahrt die Spannung der Aussage, ohne über den Wortlaut dieses Verses hinauszugehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aussage bleibt ausrufend und eindringlich; der griechische Satzbau wird zugunsten einer natürlichen deutschen Form behutsam umgestellt.
