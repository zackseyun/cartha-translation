  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: de
  text: 'Sie aber waren über alle Maßen erstaunt und sagten zueinander[a]: »Wer kann dann gerettet werden?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »zu sich selbst«; im Plural kann die Wendung auch »untereinander« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie aber
  rationale: Der substantivierte Artikel greift die zuvor genannten Jünger beziehungsweise Zuhörer auf; δέ markiert eine leichte Gegenbewegung oder Weiterführung, die im Deutschen mit „aber“ angemessen wiedergegeben wird.
- source_word: περισσῶς
  choice: über alle Maßen
  rationale: Die Wendung gibt die starke Steigerung des Erstaunens würdig und idiomatisch wieder, ohne die Intensität abzuschwächen.
- source_word: ἐξεπλήσσοντο
  choice: waren … erstaunt
  rationale: Das Imperfekt bezeichnet ihre anhaltende beziehungsweise sich entfaltende Reaktion; „erstaunt“ bewahrt den starken Sinn des Verbs im Zusammenhang mit der verstärkenden Angabe.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das gleichzeitige Partizip wird im natürlichen Deutschen als beigeordnete, zeitgleich verlaufende Handlung wiedergegeben.
- source_word: πρὸς ἑαυτούς
  choice: zueinander
  rationale: In dieser Gesprächssituation hat das pluralische Reflexivpronomen naheliegend reziproken Sinn. Die wörtlichere Form und ihre mögliche Nuance werden in der Fußnote erhalten.
- source_word: Καὶ
  choice: dann
  rationale: καί führt hier angesichts der vorausgehenden Aussage Jesu die folgernde Frage ein; „dann“ bildet diese kontextuelle Konsequenz im Deutschen natürlich ab.
- source_word: τίς δύναται
  choice: Wer kann
  rationale: Die Verbindung fragt rhetorisch nach der Möglichkeit beziehungsweise Fähigkeit irgendeines Menschen und wird direkt und idiomatisch wiedergegeben.
- source_word: σωθῆναι
  choice: gerettet werden
  rationale: Der passive Infinitiv trägt im Kontext des Eingehens in Gottes Reich heilsgeschichtliches und eschatologisches Gewicht; „gerettet werden“ bewahrt dies, ohne den genauen Umfang der Rettung weiter festzulegen.
theological_decisions:
- issue: Bedeutung der Rettung im Kontext
  choice: gerettet werden
  alternative: befreit werden / bewahrt werden
  rationale: Im unmittelbaren Zusammenhang geht es um das Eingehen in das Reich Gottes. Daher ist die etablierte, zugleich transparente Rettungssprache angemessen; sie wahrt das theologische Gewicht, ohne eine bestimmte konfessionelle Heilslehre in den Wortlaut einzutragen.
- issue: Folgernder Sinn von Καὶ in der Frage
  choice: dann
  alternative: und / also
  rationale: „Dann“ macht die aus Jesu Aussage entstehende erschrockene Schlussfrage sichtbar, ohne zusätzliche theologische Erklärung einzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Über alle Maßen erstaunt“ erhält die starke Intensität des griechischen Ausdrucks; die direkte Frage bleibt knapp und eindringlich.
