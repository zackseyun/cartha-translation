  verdict: approve
  source_fidelity: Der Text gibt οἱ δὲ περισσῶς ἐξεπλήσσοντο treffend als „Sie aber waren über alle Maßen erstaunt“ wieder. Die starke Intensivierung durch περισσῶς bleibt erhalten, und die imperfektische Verlaufsnuance wird mit „waren ... erstaunt“ angemessen abgebildet. „zueinander“ ist für πρὸς ἑαυτούς im pluralischen Gesprächskontext eine sachgerechte idiomatische Wiedergabe. „dann“ gibt den im Kontext naheliegenden folgernden Gebrauch von Καὶ wieder, ohne mehr zu behaupten als der Text. „gerettet werden“ bewahrt die Bedeutung von σωθῆναι im Kontext des Reiches Gottes.
  naturalness: Modernes Standarddeutsch und gut lesbar. „Über alle Maßen erstaunt“ ist leicht gehoben, aber idiomatisch und für den biblischen Erzählton passend. Die direkte Rede ist knapp und natürlich.
  terminology: „Gerettet werden“ ist als theologisch gewichtige, zugleich nicht konfessionell einengende Wiedergabe von σωθῆναι angemessen. Die Fußnote dokumentiert die wörtlichere und die alternative gemeinschaftliche Nuance von πρὸς ἑαυτούς korrekt.
