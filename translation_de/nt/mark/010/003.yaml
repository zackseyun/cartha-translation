  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des griechischen Satzes zuverlässig wieder: die Antwort Jesu, die Adressaten („ihnen“), die Inhaltsfrage sowie Mose als Subjekt der verbindlichen Weisung. „Was hat Mose euch geboten?“ entspricht dem Sinn von Τί ὑμῖν ἐνετείλατο Μωϋσῆς genau. Das nicht eigens wiedergegebene δέ ist ein milder Gesprächsübergang und kann im natürlichen Deutschen entfallen, ohne einen relevanten Bedeutungsverlust zu verursachen.'
  naturalness: '„Er antwortete ihnen: »Was hat Mose euch geboten?«“ ist klares, modernes und zugleich würdiges Standarddeutsch. Das Perfekt ist für die weiterhin maßgebliche, vergangene Anordnung Moses idiomatisch und verständlich.'
  terminology: „Mose“ ist die etablierte deutsche Namensform. „Geboten“ bewahrt den autoritativen Charakter von ἐνετείλατο, ohne den Text zu „Gesetz“ oder zu einer ausdrücklichen Gottesrede zu erweitern.
