  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: de
  text: 'Er antwortete ihnen: »Was hat Mose euch geboten?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ markiert hier einen leichten Übergang beziehungsweise die Reaktion auf die vorausgehende Frage. Im Deutschen wird dieser Zusammenhang durch »Er antwortete« bereits natürlich erkennbar; »aber« würde einen stärkeren Gegensatz nahelegen, als das griechische Bindewort zwingend ausdrückt.
- source_word: ἀποκριθεὶς εἶπεν
  choice: Er antwortete
  rationale: Die im Griechischen übliche Verbindung »antwortend sagte er« wird idiomatisch als einheitlicher Sprechakt wiedergegeben. So bleibt der responsive Sinn erhalten, ohne im Deutschen unnötig doppelt zu formulieren.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Adressaten der Antwort und wird im Deutschen natürlich mit »ihnen« wiedergegeben.
- source_word: Τί
  choice: Was
  rationale: Das Fragepronomen fragt nach dem Inhalt des Gebots; »Was« ist die direkte und natürliche deutsche Entsprechung.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger des Gebots. Die Wortstellung »Mose euch geboten« ist im Deutschen klar und idiomatisch.
- source_word: ἐνετείλατο
  choice: hat … geboten
  rationale: ἐντέλλομαι bezeichnet eine verbindliche Anordnung. »Gebieten« bewahrt den autoritativen und rechtlichen Charakter und passt zugleich zum biblischen Kontext.
- source_word: Μωϋσῆς
  choice: Mose
  rationale: Verwendet wird die im modernen deutschen Bibel- und Sprachgebrauch etablierte Namensform.
theological_decisions:
- issue: Bezug auf die mosaische Autorität in Jesu Antwort
  choice: Mose bleibt ausdrücklich als der genannte Vermittler des Gebots stehen.
  alternative: »Was gebietet euch das Gesetz des Mose?« oder »Was hat Gott euch durch Mose geboten?«
  rationale: Der griechische Text nennt Mose selbst und erweitert die Aussage weder zu »Gesetz des Mose« noch zu »Gott durch Mose«. Die knappe Form bewahrt die Aussage und ihre mögliche theologische Spannung, ohne eine Erklärung in den Text einzutragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die direkte Rede ist knapp gehalten. Das Perfekt klingt in heutiger gesprochener und allgemein verständlicher deutscher Prosa natürlicher als das Präteritum, ohne den Vergangenheitsbezug zu verändern.
