base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: de
  text: Und wenn sie sich von ihrem Mann scheidet und einen anderen heiratet[a], begeht sie Ehebruch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nachdem sie ihren Mann weggeschickt hat“. Im ehelichen Zusammenhang bedeutet dies, sich von ihrem Mann zu scheiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der übliche Anschluss führt die parallele Aussage des vorhergehenden Verses fort.
- source_word: ἐὰν
  choice: wenn
  rationale: Leitet einen Bedingungssatz ein und klingt in dieser allgemeinen moralischen Aussage natürlich.
- source_word: αὐτὴ
  choice: sie
  rationale: Bewahrt das ausdrücklich feminine Subjekt; die leichte griechische Betonung erfordert im Deutschen kein „sie selbst“.
- source_word: ἀπολύσασα
  choice: sich ... scheiden lässt
  rationale: ἀπολύω bezeichnet im ehelichen Zusammenhang die Scheidung. Die reflexive deutsche Wendung ist idiomatisch, wenn die Frau die Scheidung von ihrem Mann veranlasst.
- source_word: τὸν ἄνδρα αὐτῆς
  choice: von ihrem Mann
  rationale: ἀνήρ bedeutet im gegebenen ehelichen Zusammenhang „Ehemann“ beziehungsweise idiomatisch „Mann“.
- source_word: γαμήσῃ ἄλλον
  choice: einen anderen heiratet
  rationale: Das maskuline ἄλλον bezeichnet einen anderen Mann; im Deutschen macht bereits „einen anderen“ das grammatische und sachliche Geschlecht deutlich.
- source_word: μοιχᾶται
  choice: begeht sie Ehebruch
  rationale: Direkte und natürliche Wiedergabe des präsentischen Verbs, ohne daraus eine dauerhafte Personenbezeichnung zu machen.
theological_decisions:
- issue: Geschlechtsspezifische Formulierung der Aussage
  choice: 'Das feminine Subjekt und das maskuline Objekt werden bewahrt: „wenn sie ... einen anderen heiratet“'
  alternative: „wenn eine Frau ihren Mann verlässt und wieder heiratet“
  rationale: Der griechische Text formuliert ausdrücklich mit einer Frau als handelnder Person und einem anderen Mann als neuem Ehepartner. Dies erhält zugleich die beabsichtigte Parallele zu Vers 11.
- issue: Wiedergabe von ἀπολύω als wörtliches „wegschicken“ oder als ehelicher Rechtsbegriff
  choice: „sich von ihrem Mann scheiden lässt“
  alternative: „ihren Mann wegschickt“
  rationale: Im Zusammenhang bezeichnet das Wort die Auflösung der Ehe. Die idiomatische Übersetzung vermittelt diesen Sinn klar, während die Fußnote die wörtlichere Ausdrucksweise dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Mann“ ist hier als geläufige Bezeichnung für „Ehemann“ eindeutig; die Satzstruktur bleibt knapp und parallel zum vorausgehenden Vers.
