id: MRK.10.25
reference: Mark 10:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: de
  text: Eher geht ein Kamel durch ein Nadelöhr, als dass ein Reicher in das Reich Gottes hineinkommt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „durch die Öffnung einer Nadel“.'
    reason: lexical_alternative
  - marker: b
    text: Manche haben statt „Kamel“ die Bedeutung „Seil“ vorgeschlagen; der griechische Text hier lautet jedoch „Kamel“.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: Eher
  rationale: Der Komparativ bezeichnet, was leichter bzw. eher möglich ist. In der deutschen Vergleichsformel gibt „eher … als“ die zugespitzte Aussage natürlich und präzise wieder.
- source_word: κάμηλον
  choice: ein Kamel
  rationale: Das griechische Wort bedeutet „Kamel“. Die konkrete, bewusst extreme Bildsprache wird unverändert bewahrt.
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: durch ein Nadelöhr
  rationale: Die Wendung bezeichnet die Öffnung einer Nähnadel. „Nadelöhr“ ist die klare und feste deutsche Bezeichnung dafür.
- source_word: διελθεῖν
  choice: geht … durch
  rationale: διέρχομαι bedeutet hier „hindurchgehen“. Die finite deutsche Form innerhalb der Vergleichskonstruktion klingt natürlich und erhält das konkrete Bewegungsbild.
- source_word: πλούσιον
  choice: ein Reicher
  rationale: Das substantivierte Adjektiv steht im maskulinen Singular. „Ein Reicher“ bildet diese Form knapp ab und kann im Sinnspruch repräsentativ verstanden werden.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: in das Reich Gottes
  rationale: „Reich Gottes“ ist die etablierte und sachlich genaue Wiedergabe der zentralen Markus-Wendung βασιλεία τοῦ θεοῦ.
- source_word: εἰσελθεῖν
  choice: hineinkommt
  rationale: Das Verb bedeutet „hineingehen/eintreten“. „In das Reich Gottes hineinkommen“ ist modernes, verständliches Deutsch und vermeidet das stilistisch schwerere doppelte „eintreten in“.
theological_decisions:
- issue: Deutung des Bildes vom Kamel und Nadelöhr
  choice: Das wörtliche, hyperbolische Bild von einem Kamel und der Öffnung einer Nadel bleibt stehen.
  alternative: Deutung des „Nadelöhrs“ als kleines Jerusalemer Tor oder Ersetzung von „Kamel“ durch „Seil“.
  rationale: Der griechische Text zeichnet ein scharfes Bild äußerster Unmöglichkeit. Spätere Erklärungsversuche sollen die theologische Spannung der Aussage nicht abschwächen.
- issue: Reichweite von πλούσιον
  choice: „ein Reicher“ in der grammatisch maskulinen Singularform, repräsentativ gebraucht
  alternative: „ein reicher Mensch“ als ausdrücklich geschlechtsübergreifende Wiedergabe
  rationale: Die gewählte Form folgt der Gestalt des griechischen Ausdrucks, ohne die Aussage auf eine einzige konkrete Person zu begrenzen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sprichwortartigem Rhythmus. Die Konstruktion „Eher … als dass …“ bewahrt die zugespitzte Vergleichsform; „Nadelöhr“ erhält das vertraute konkrete Bild.
