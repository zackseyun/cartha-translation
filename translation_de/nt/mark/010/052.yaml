id: MRK.10.52
reference: Mark 10:52
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: de
  text: 'Und Jesus sagte zu ihm: „Geh! Dein Glaube[a] hat dich gerettet[b].“ Und sofort konnte er wieder sehen und folgte ihm auf dem Weg[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Glaube“ kann hier auch mit „Vertrauen“ wiedergegeben werden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „hat dich gesund gemacht“ oder „hat dich geheilt“. Das griechische Verb kann sowohl Heilung als auch Rettung bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „auf der Straße“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: Geh!
  rationale: Der Imperativ fordert schlicht zum Gehen auf. „Geh!“ ist im modernen Deutsch klar und fügt keinen im Griechischen nicht ausdrücklich vorhandenen Besitzbezug hinzu.
- source_word: πίστις
  choice: Glaube
  rationale: Hier bezeichnet das Wort das vertrauende Sichverlassen des Mannes auf Jesus. „Glaube“ wahrt zugleich den neutestamentlichen Schlüsselbegriff; „Vertrauen“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: σέσωκέν
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω kann Rettung wie auch Heilung bezeichnen. „Hat dich gerettet“ erhält die weitere Bedeutungsbreite und die Spannung zwischen körperlicher Heilung und umfassender Rettung.
- source_word: εὐθύς
  choice: sofort
  rationale: „Sofort“ gibt die für Markus typische Unmittelbarkeit knapp und natürlich wieder.
- source_word: ἀνέβλεψεν
  choice: konnte er wieder sehen
  rationale: Im Zusammenhang mit dem blinden Mann bezeichnet das Verb die Wiederherstellung des Sehvermögens. Die Formulierung ist idiomatisches modernes Deutsch.
- source_word: ἠκολούθει
  choice: folgte
  rationale: Der Imperfekt beschreibt ein einsetzendes beziehungsweise fortdauerndes Folgen. Das deutsche Präteritum ist hier natürlich und lässt den Verlauf aus dem Zusammenhang erkennen.
- source_word: ἐν τῇ ὁδῷ
  choice: auf dem Weg
  rationale: Die Wendung bezeichnet konkret den Reiseweg, kann bei Markus aber zugleich an Nachfolge denken lassen. „Auf dem Weg“ bewahrt beide Ebenen besser als eine rein räumliche Festlegung auf „Straße“.
- source_word: καὶ ὁ Ἰησοῦς
  choice: Und Jesus
  rationale: Das einleitende καί wird beibehalten und verbindet den Satz mit dem fortlaufenden Erzählgang.
theological_decisions:
- issue: Bedeutung von σῴζω in Jesu Aussage
  choice: „hat dich gerettet“ als bewusst weite Wiedergabe
  alternative: „hat dich gesund gemacht“ oder „hat dich geheilt“
  rationale: Der unmittelbare Zusammenhang berichtet von der Wiederherstellung des Sehvermögens, doch das griechische Verb umfasst auch Rettung in einem weiteren Sinn. Die Hauptfassung beschränkt Jesu Aussage daher nicht auf körperliche Heilung.
- issue: Bedeutungsweite von πίστις
  choice: „Glaube“
  alternative: „Vertrauen“
  rationale: Im Kontext steht das vertrauende Sichverlassen auf Jesus im Vordergrund. „Glaube“ bewahrt den etablierten theologischen Begriff, ohne die konkrete Bedeutung „Vertrauen“ auszuschließen.
- issue: Möglicher Doppelsinn von ἐν τῇ ὁδῷ
  choice: „auf dem Weg“
  alternative: „auf der Straße“
  rationale: Die Formulierung erhält sowohl die konkrete Wegszene als auch einen möglichen Anklang an Nachfolge, ohne diesen ausdrücklich in den Text hineinzulesen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die kurzen Sätze erhalten das rasche Erzähltempo. „Auf dem Weg“ und „hat dich gerettet“ bewahren die im Griechischen angelegte Mehrdeutigkeit, ohne sie konfessionell festzulegen.
