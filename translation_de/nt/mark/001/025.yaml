  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: de
  text: 'Und Jesus wies ihn scharf zurecht und sagte: »Schweig[a] und komm aus ihm heraus!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Lass dir einen Maulkorb anlegen!«; gemeint ist: »Verstumme!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: wies ihn scharf zurecht
  rationale: ἐπιτιμάω bezeichnet hier eine autoritative, scharfe Zurechtweisung. Die Formulierung gibt sowohl den Tadel als auch Jesu Vollmacht natürlich wieder.
- source_word: αὐτῷ
  choice: ihn
  rationale: Das maskuline Pronomen bezieht sich im Zusammenhang auf den unreinen Geist, den Jesus direkt anspricht, nicht auf den betroffenen Mann.
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip leitet den Inhalt der Zurechtweisung ein. Die finite Koordination ist im modernen Deutschen natürlicher, ohne den Sinn zu verändern.
- source_word: Φιμώθητι
  choice: Schweig
  rationale: φιμόω bedeutet wörtlich, einen Maulkorb anzulegen, wird hier aber als schroffer Befehl zum Verstummen gebraucht. »Schweig« bewahrt Kürze und Nachdruck; die Bildlichkeit wird in der Fußnote genannt.
- source_word: ἔξελθε
  choice: fahr ... heraus
  rationale: ἐξέρχομαι bezeichnet im Exorzismuszusammenhang das Herauskommen aus dem Menschen. »Herausfahren« ist im Deutschen verständlich und bildet die energische direkte Aufforderung ab.
- source_word: ἐξ αὐτοῦ
  choice: aus ihm heraus
  rationale: ἐξ kennzeichnet eine Bewegung aus dem Inneren heraus. Die Wiedergabe wahrt die Unterscheidung zwischen dem angesprochenen Geist und dem Mann.
theological_decisions:
- issue: Bezug der Zurechtweisung
  choice: Jesus spricht den unreinen Geist direkt an.
  alternative: Jesus weist den Mann als unmittelbaren Bezug des Pronomens zurecht.
  rationale: Der Befehl »fahr aus ihm heraus« unterscheidet den Angesprochenen vom betroffenen Mann und weist den Geist als Adressaten aus, ohne darüber hinausgehende dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. »Wies ... scharf zurecht« vermeidet eine zu schwache Wiedergabe; die Fußnote bewahrt das anschauliche Bild des griechischen Verbs.
