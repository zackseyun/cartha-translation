  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: de
  text: Als er ein Stück weitergegangen war, sah er Jakobus, den Sohn des Zebedäus, und dessen Bruder Johannes im Boot, wie sie die Netze ausbesserten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „die Netze in Ordnung brachten“ beziehungsweise „die Netze vorbereiteten“; das griechische Verb kann bedeuten, etwas wiederherzustellen, herzurichten oder in den richtigen Zustand zu versetzen.
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: als er ein Stück weitergegangen war
  rationale: 'Das Aoristpartizip bezeichnet hier einen vorausgehenden Begleitumstand: Jesus ging noch eine kurze Strecke weiter. Die Formulierung ist natürlich und bewahrt die zeitliche Abfolge.'
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Erzählform von ὁράω wird ohne zusätzliche Hervorhebung wiedergegeben.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jakobus, den Sohn des Zebedäus
  rationale: Die Genitivkonstruktion identifiziert Jakobus durch seine Abstammung; die deutsche Apposition gibt dies klar wieder.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: dessen Bruder Johannes
  rationale: αὐτοῦ bezieht sich am natürlichsten auf Jakobus. „Dessen Bruder Johannes“ macht den Bezug im Deutschen eindeutig.
- source_word: καὶ αὐτοὺς ἐν τῷ πλοίῳ
  choice: Auch sie waren im Boot
  rationale: καὶ αὐτούς knüpft die beiden an die zuvor erwähnten Fischer an und bleibt zugleich Objekt von „sah“. Die Aufteilung in zwei deutsche Sätze vermeidet eine schwerfällige Konstruktion und erhält den Sinn.
- source_word: καταρτίζοντας
  choice: besserten … aus
  rationale: Im Zusammenhang mit Fischernetzen bezeichnet καταρτίζω am ehesten das Wiederherstellen oder Instandsetzen. „Ausbessern“ ist dafür eine natürliche, präzise deutsche Wiedergabe; die weitere Bedeutungsbreite wird in der Fußnote festgehalten.
- source_word: τὰ δίκτυα
  choice: die Netze
  rationale: Der bestimmte Artikel wird bewahrt; ein im Griechischen nicht ausdrücklich vorhandenes Besitzpronomen wird nicht ergänzt.
