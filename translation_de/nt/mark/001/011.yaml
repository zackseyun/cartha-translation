  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: de
  text: 'Und eine Stimme ertönte aus den Himmeln[a]: »Du bist mein geliebter Sohn; an dir habe ich Gefallen gefunden.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »aus dem Himmel«. Im Griechischen steht der Plural: »aus den Himmeln«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Ich habe Freude an dir« oder »an dir habe ich Wohlgefallen«.'
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: eine Stimme kam
  rationale: Die Verbindung mit ἐγένετο bezeichnet hier idiomatisch das Auftreten beziehungsweise Ergehen einer Stimme. »Eine Stimme kam« bewahrt den erzählerischen Vorgang und klingt im Deutschen natürlich.
- source_word: ἐκ τῶν οὐρανῶν
  choice: aus den Himmeln
  rationale: Der griechische Plural wird beibehalten. »Aus den Himmeln« ist verständlich und bildet die Form des Ausgangstextes genauer ab als der vertrautere Singular.
- source_word: Σὺ εἶ
  choice: Du bist
  rationale: Das ausdrücklich gesetzte Pronomen wird durch »Du« wiedergegeben und wahrt die unmittelbare, nachdrückliche Anrede.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mein geliebter Sohn
  rationale: Diese natürliche deutsche Wortstellung verbindet die Sohnschaft mit der göttlichen Liebe, ohne den Artikel künstlich nachzubilden. »Geliebter« bewahrt den würdigen Ton von ἀγαπητός.
- source_word: ἐν σοὶ
  choice: an dir
  rationale: Bei »Gefallen finden« ist »an dir« die natürliche deutsche Entsprechung der griechischen Wendung ἐν σοὶ. Sie hält den Bezug eindeutig bei der angesprochenen Person.
- source_word: εὐδόκησα
  choice: habe ich Gefallen gefunden
  rationale: Das Perfekt gibt den griechischen Aorist als festgestellte göttliche Zustimmung idiomatisch wieder, ohne ihn stillschweigend in ein rein gegenwärtiges »ich habe Wohlgefallen« umzudeuten. Die mögliche Nuance von Freude beziehungsweise Wohlgefallen wird in einer Fußnote genannt.
theological_decisions:
- issue: Christologische Aussage der göttlichen Anrede
  choice: mein geliebter Sohn
  alternative: mein Sohn, der Geliebte
  rationale: Die gewählte Form bewahrt sowohl die Sohnschaft als auch die besondere Liebe, ohne spätere dogmatische Fachbegriffe einzutragen oder ἀγαπητός als eigenständigen Titel festzulegen.
- issue: Plural von οὐρανῶν
  choice: aus den Himmeln
  alternative: aus dem Himmel
  rationale: Der echte Plural des griechischen Textes bleibt im Haupttext sichtbar; der im Deutschen traditionellere Singular wird als mögliche Wiedergabe angegeben.
- issue: Zeit- und Bedeutungswert von εὐδόκησα
  choice: habe ich Gefallen gefunden
  alternative: an dir habe ich Freude / an dir habe ich Wohlgefallen
  rationale: Der Aorist wird formal wahrnehmbar gelassen, während die deutsche Wendung fortbestehende Zustimmung zulässt. So wird weder ausschließlich ein vergangenes Ereignis noch ausschließlich ein gegenwärtiger Zustand festgeschrieben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und feierlich, ohne altertümliche Formen. Der seltenere Plural »Himmel« wird bewusst als »Himmeln« erhalten und erläutert.
