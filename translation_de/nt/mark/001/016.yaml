  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: de
  text: Als er am See von Galiläa entlangging, sah er Simon und Andreas, Simons Bruder, wie sie ein Netz in den See auswarfen; denn sie waren Fischer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: als er am See … entlangging
  rationale: Das Präsenspartizip bezeichnet eine zur Haupthandlung gleichzeitige, fortlaufende Bewegung; παρά mit Akkusativ gibt hier die Bewegung am Ufer entlang wieder.
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: den See von Galiläa
  rationale: Obwohl θάλασσα wörtlich „Meer“ heißen kann, bezeichnet es hier den galiläischen Binnensee. „See von Galiläa“ ist im modernen Deutsch geografisch klar und quellennah.
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Wiedergabe bewahrt den unmarkierten Sinn des Aorists von ὁράω, ohne zusätzliche Nuancen wie „bemerkte“ einzutragen.
- source_word: Σίμωνα καὶ Ἀνδρέαν
  choice: Simon und Andreas
  rationale: Die Personennamen folgen den im Deutschen etablierten biblischen Namensformen.
- source_word: τὸν ἀδελφὸν Σίμωνος
  choice: den Bruder Simons
  rationale: Die Apposition identifiziert Andreas als Simons Bruder; die deutsche Genitivkonstruktion ist knapp und natürlich.
- source_word: ἀμφιβάλλοντας
  choice: wie sie ein Wurfnetz … warfen
  rationale: Das Verb bezeichnet spezifisch das Auswerfen eines Netzes. „Wurfnetz“ macht die im Verb enthaltene Bedeutung präzise sichtbar, während die Konstruktion mit „wie“ das Partizip idiomatisch an „sah“ anschließt.
- source_word: ἐν τῇ θαλάσσῃ
  choice: in den See
  rationale: Bei der gerichteten Handlung des Werfens verlangt natürliches Deutsch den Akkusativ „in den See“, der das Hineinwerfen ausdrückt.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: denn sie waren Fischer
  rationale: „Denn“ erhält die erklärende Funktion von γάρ und passt zum würdigen Erzählregister.
