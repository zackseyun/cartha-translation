  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: de
  text: 'Und er wurde zornig[a], streckte seine Hand aus, berührte ihn und sagte zu ihm: »Ich will; werde rein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben statt »er wurde zornig«: »von Mitgefühl bewegt«.'
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: er wurde zornig
  rationale: Das Partizip von ὀργίζομαι bezeichnet im gedruckten SBLGNT-Text das Zornigwerden bzw. Zornigsein. „Er wurde zornig“ gibt den ingressiven Aspekt natürlich wieder, ohne den möglichen Anlass oder die Zielrichtung des Zorns festzulegen.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: streckte seine Hand aus
  rationale: Die finite Verbform bildet die Handlungsfolge im Deutschen natürlich ab und bewahrt die konkrete körperliche Geste.
- source_word: ἥψατο
  choice: berührte ihn
  rationale: ἅπτομαι bedeutet hier am natürlichsten „berühren“; dies erhält die bedeutsame körperliche Berührung des Aussätzigen.
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Das historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: Θέλω
  choice: Ich will
  rationale: Im unmittelbaren Zusammenhang antwortet Jesus auf die Bedingung „wenn du willst“ und erklärt knapp seine Bereitschaft. Das natürliche deutsche „Ich will“ bewahrt zugleich die sprachliche Direktheit des griechischen Ausdrucks.
- source_word: καθαρίσθητι
  choice: werde rein
  rationale: Der passive Imperativ bewahrt sowohl die körperliche als auch die kultische Dimension der Reinigung; „rein“ ist im Zusammenhang mit Aussatz sachgerecht und verständlich.
theological_decisions:
- issue: Textvariante zur Gefühlsregung Jesu
  choice: Die SBLGNT-Lesart ὀργισθείς wird im Haupttext mit „er wurde zornig“ wiedergegeben.
  alternative: 'Einige Handschriften lesen σπλαγχνισθείς: „von Mitgefühl bewegt“ bzw. „voller Mitgefühl“.'
  rationale: Der vorgegebene griechische Ausgangstext hat Vorrang. Da die Variante das Bild der Gefühlsregung Jesu erheblich verändert, wird sie transparent in einer Fußnote genannt. Die Übersetzung legt weder Anlass noch Zielrichtung seines Zorns fest.
- issue: Bedeutungsumfang der Reinigung
  choice: „Werde rein!“
  alternative: „Sei gereinigt!“ oder „Werde gesund!“
  rationale: „Werde rein“ erhält die körperliche und kultische Spannung von καθαρίσθητι, ohne die Aussage auf bloße Heilung oder ausschließlich rituelle Reinheit einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe direkte Rede spiegelt die Prägnanz des griechischen Textes; die ungewöhnliche Hauptlesart wird nicht geglättet.
