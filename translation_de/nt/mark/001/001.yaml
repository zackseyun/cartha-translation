base_translation:
  language: en
  yaml_path: translation/nt/mark/001/001.yaml
  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: de
  text: Der Anfang der guten Botschaft[a] von Jesus, dem Messias[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „des Evangeliums“. Das griechische Wort εὐαγγέλιον bedeutet „gute Botschaft“ und wird traditionell mit „Evangelium“ wiedergegeben.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Christus“. Das griechische Χριστός bedeutet als Titel „Messias“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἀρχὴ
  choice: Der Anfang
  rationale: Der bestimmte Artikel wird für einen natürlichen deutschen nominalen Auftakt ergänzt. Die Formulierung bleibt offen dafür, ob sie als Überschrift oder als Beginn der folgenden Darstellung zu verstehen ist.
- source_word: εὐαγγελίου
  choice: der guten Botschaft
  rationale: Die Bedeutung des griechischen Wortes wird transparent und in gegenwärtigem, würdigem Deutsch wiedergegeben; die traditionelle Wiedergabe „Evangelium“ wird in einer Fußnote genannt.
- source_word: Ἰησοῦ
  choice: von Jesus
  rationale: Der Personenname wird in seiner üblichen deutschen Form wiedergegeben. „Von“ lässt im Deutschen passend offen, ob die Botschaft Jesus zum Inhalt hat oder von ihm ausgeht.
- source_word: χριστοῦ
  choice: dem Messias
  rationale: 'Χριστός bezeichnet hier am ehesten den Titel Jesu. Nach „von Jesus“ steht die erläuternde Apposition idiomatisch im Dativ: „dem Messias“.'
theological_decisions:
- issue: Wiedergabe von Χριστοῦ als übersetzter Titel oder als traditionelle, namensähnliche Form
  choice: Messias
  alternative: Christus
  rationale: Im programmatischen Auftakt bezeichnet Χριστός Jesu messianische Stellung. „Messias“ bewahrt die Titelfunktion; „Christus“ bleibt als traditionelle Alternative in der Fußnote erhalten.
- issue: Beziehung des Genitivs Ἰησοῦ zum Evangelium
  choice: von Jesus
  alternative: über Jesus / durch Jesus
  rationale: Die knappe deutsche Genitivumschreibung bewahrt die im Griechischen mögliche Spannung zwischen der Botschaft über Jesus und der von ihm ausgehenden Botschaft, statt sie einseitig festzulegen.
translation_notes:
  register: Knapper, überschriftartiger Satzanfang in modernem Standarddeutsch. „Gute Botschaft“ ist verständlich und würdig; „Messias“ macht den Titelcharakter sichtbar. Die nominale Form des griechischen Textes wird ohne ergänzendes Verb bewahrt.
