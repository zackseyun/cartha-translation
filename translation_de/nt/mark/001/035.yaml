  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: de
  text: Ganz früh am Morgen, als es noch dunkel war, stand er auf, ging hinaus und begab sich an einen menschenleeren Ort[a], und dort betete er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen verlassenen Ort“ oder „an einen einsamen Ort“. Das griechische Wort kann einen unbewohnten, menschenleeren oder wüstenartigen Ort bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ ἔννυχα λίαν
  choice: Ganz früh am Morgen, als es noch dunkel war
  rationale: Die zusammengehörige Zeitangabe betont sowohl die sehr frühe Morgenstunde als auch die noch herrschende Dunkelheit. Die Formulierung ist im modernen Deutsch natürlich und bewahrt beide Aspekte.
- source_word: ἀναστὰς
  choice: stand er auf
  rationale: Das vorangestellte Aoristpartizip bezeichnet die dem Hinausgehen vorausgehende Handlung; die finite Wiedergabe bildet die Abfolge im Deutschen klar ab.
- source_word: ἐξῆλθεν καὶ ἀπῆλθεν
  choice: ging hinaus und begab sich
  rationale: 'Die beiden Bewegungsverben bleiben unterscheidbar: Zuerst verlässt Jesus seinen bisherigen Aufenthaltsort, dann bewegt er sich gezielt zu einem anderen Ort.'
- source_word: εἰς ἔρημον τόπον
  choice: an einen menschenleeren Ort
  rationale: ἔρημος beschreibt hier einen unbewohnten oder verlassenen Ort. „Menschenleer“ bewahrt diese räumliche Aussage, ohne ausdrücklich eine geografische Wüste oder Jesu Absicht, allein zu sein, vorauszusetzen.
- source_word: κἀκεῖ
  choice: Dort
  rationale: Die Zusammenziehung von καὶ ἐκεῖ verweist knapp auf den eben genannten Ort. Ein neuer deutscher Satz gibt den natürlichen Erzählfluss wieder.
- source_word: προσηύχετο
  choice: betete er
  rationale: Das Imperfekt stellt das Beten als andauernde Hintergrundhandlung dar. Das Deutsche kennzeichnet diesen Aspekt gewöhnlich durch Kontext und Satzführung; eine Umschreibung wie „war am Beten“ wäre für den angestrebten würdigen Registerton zu umgangssprachlich.
theological_decisions:
- issue: Erzählerischer Schwerpunkt auf Jesu Gebet
  choice: Der Vers berichtet schlicht, dass Jesus sich früh an einen menschenleeren Ort begab und dort betete.
  alternative: Die Einsamkeit ausdrücklich als Vorbild für Jüngerschaft oder das Gebet als Aussage über Jesu Abhängigkeit deuten.
  rationale: Solche theologischen Folgerungen können aus dem Zusammenhang erwogen werden, stehen aber nicht ausdrücklich im griechischen Wortlaut und werden daher nicht in die Übersetzung eingebaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit ruhigem, würdigem Erzählton. Die markinische Abfolge der Bewegungen wird erhalten, ohne eine im Deutschen schwerfällige wörtliche Doppelung zu erzeugen.
