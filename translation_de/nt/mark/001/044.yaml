source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: de
  text: 'Und er sagt zu ihm: „Sieh zu, dass du niemandem etwas sagst! Geh vielmehr, zeig dich dem Priester und bring für deine Reinigung dar, was Mose angeordnet hat – ihnen zum Zeugnis.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihnen gegenüber als Beweis“. Gemeint kann ein Nachweis für die Priester oder für andere sein; manche verstehen die Wendung schärfer im Sinn von „zum Zeugnis gegen sie“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: Sieh zu
  rationale: Der Imperativ leitet eine nachdrückliche Warnung beziehungsweise Aufforderung ein. „Sieh zu“ gibt diese Kraft im modernen Deutschen idiomatisch wieder.
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: dass du niemandem etwas sagst
  rationale: In Verbindung mit „Sieh zu“ formuliert die deutsche Negation ein umfassendes Verbot und bewahrt sowohl den Adressatenbezug („niemandem“) als auch den Inhalt („etwas“).
- source_word: ἀλλὰ
  choice: vielmehr
  rationale: Kennzeichnet den korrigierenden Gegensatz zwischen dem untersagten Reden und dem gebotenen Handeln.
- source_word: ὕπαγε
  choice: Geh
  rationale: Direkte und natürliche Wiedergabe des Bewegungsimperativs.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: zeig dich dem Priester
  rationale: Bewahrt das reflexive Objekt und verweist verständlich auf die priesterliche Begutachtung.
- source_word: ἱερεῖ
  choice: dem Priester
  rationale: Der Artikel bezeichnet wahrscheinlich die für die vorgeschriebene Untersuchung zuständige priesterliche Autorität.
- source_word: προσένεγκε
  choice: bring … dar
  rationale: „Darbringen“ lässt den kultisch-opferbezogenen Zusammenhang erkennen, ohne den Gegenstand über den griechischen Text hinaus zu bestimmen.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: für deine Reinigung
  rationale: Gibt den Bezug beziehungsweise Zweck der vorgeschriebenen Darbringung knapp wieder und passt zum levitischen Reinigungskontext.
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: was Mose angeordnet hat
  rationale: Das substantivische Relativpronomen fasst die mosaischen Vorschriften im Deutschen natürlich zusammen; „angeordnet“ bewahrt den verbindlichen Charakter.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ihnen zum Zeugnis
  rationale: Bewahrt Zweck beziehungsweise Ergebnis sowie den offenen Zeugnischarakter, ohne „gegen sie“ in den Text einzutragen.
theological_decisions:
- issue: Bezug und Aussagekraft von εἰς μαρτύριον αὐτοῖς
  choice: „ihnen zum Zeugnis“ bleibt hinsichtlich der gemeinten Personen und einer neutralen oder konfrontativen Wirkung bewusst offen.
  alternative: „den Priestern als Beweis“ oder „zum Zeugnis gegen sie“
  rationale: Der griechische Wortlaut nennt weder ausdrücklich nur die Priester als Bezugsgruppe noch enthält er ein Wort für „gegen“. Die offene Formulierung erhält die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historische Präsensgebrauch „sagt“ folgt dem griechischen Text. „Bring … dar“ macht den kultischen Zusammenhang verständlich, während „ihnen zum Zeugnis“ die syntaktische und theologische Offenheit des Schlusses bewahrt.
