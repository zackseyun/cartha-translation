source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: de
  text: Nachdem Johannes ausgeliefert worden war[a], kam Jesus nach Galiläa und verkündete die gute Nachricht Gottes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Nachdem Johannes verhaftet worden war.“ Das griechische Verb bedeutet wörtlicher „ausliefern“ oder „übergeben“; dasselbe Wort begegnet bei Markus später im Zusammenhang mit Jesu Leiden.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Evangelium Gottes“. Der Ausdruck „Gottes“ kann die gute Nachricht bezeichnen, die von Gott kommt, Gott gehört oder Gott zum Inhalt hat.'
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: Nachdem ... ausgeliefert worden war
  rationale: Die Konstruktion mit μετά und substantiviertem Infinitiv bezeichnet eine Vorzeitigkeit. „Ausgeliefert“ bewahrt den weiteren Sinn von παραδίδωμι und zugleich den sprachlichen Bezug zu Markus’ späterer Passionsdarstellung; „verhaftet“ wäre kontextuell möglich, aber enger.
- source_word: Ἰωάννην
  choice: Johannes
  rationale: Im Deutschen ist „Johannes“ die etablierte Namensform.
- source_word: ἦλθεν
  choice: kam
  rationale: „Kam“ gibt den Aorist von ἔρχομαι natürlich und ohne unnötige Präzisierung wieder.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: „Nach Galiläa“ ist die natürliche deutsche Wiedergabe einer gerichteten Bewegung zu beziehungsweise in eine Region und erhält die Richtungsbedeutung von εἰς.
- source_word: κηρύσσων
  choice: verkündete
  rationale: Das finite „verkündete“ bildet das begleitende Partizip in natürlichem Deutsch ab und bewahrt den Sinn öffentlicher Bekanntmachung.
- source_word: εὐαγγέλιον
  choice: gute Nachricht
  rationale: „Gute Nachricht“ macht die Grundbedeutung von εὐαγγέλιον unmittelbar verständlich, ohne den Ausdruck auf kirchliche Fachsprache zu beschränken.
- source_word: τοῦ θεοῦ
  choice: Gottes
  rationale: 'Der deutsche Genitiv bewahrt die Offenheit des griechischen Genitivs: Die Nachricht kann als von Gott kommend, Gott zugehörig oder auf Gott bezogen verstanden werden.'
theological_decisions:
- issue: Wiedergabe von παραδοθῆναι im Zusammenhang mit Markus’ wiederkehrender Passionssprache
  choice: ausgeliefert worden war
  alternative: verhaftet worden war
  rationale: „Ausgeliefert“ erhält die Erzählresonanz mit der späteren Auslieferung Jesu und fügt keinen ausdrücklich ungenannten Vorgang hinzu. Eine Verhaftung ist im Kontext naheliegend, schöpft den griechischen Ausdruck aber nicht vollständig aus.
- issue: Bedeutungsbreite des Genitivs in τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: die gute Nachricht Gottes
  alternative: die gute Nachricht von Gott / über Gott
  rationale: Die genitivische Form lässt offen, ob Herkunft, Zugehörigkeit oder Inhalt im Vordergrund steht. Die Übersetzung entscheidet diese theologisch bedeutsame Mehrdeutigkeit nicht einseitig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist flüssig und allgemein verständlich; „ausgeliefert“ erhält bewusst die markinische Wortverbindung zur Passion, während die Fußnoten sowohl die kontextuelle Alternative „verhaftet“ als auch die traditionelle Wiedergabe „Evangelium“ dokumentieren.
