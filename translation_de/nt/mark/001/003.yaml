id: MRK.1.3
reference: Mark 1:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: de
  text: 'Eine Stimme ruft in der Wüste: »Bereitet den Weg des Herrn[b][a], macht seine Pfade gerade!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei anderer Zeichensetzung des Jesajazitats: »Eine Stimme ruft: ›Bereitet in der Wüste den Weg des Herrn …‹«'
    reason: alternative_reading
  - marker: b
    text: »Herr« gibt das griechische kyrios wieder; das Zitat greift Jesaja 40,3 auf, wo der hebräische Text vom HERRN (JHWH) spricht.
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: Eine Stimme
  rationale: φωνή bezeichnet hier eine Stimme; der artikellose Ausdruck wird im Deutschen natürlich mit dem unbestimmten Artikel wiedergegeben.
- source_word: βοῶντος
  choice: ruft
  rationale: Das substantivierte Partizip bezeichnet kraftvolles, öffentliches Rufen. Die natürliche deutsche Wendung »Eine Stimme ruft« gibt den griechischen Genitivanschluss idiomatisch wieder.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: ἔρημος bezeichnet unbewohntes, ödes Gebiet. »Wüste« entspricht dem unmittelbaren markinischen Kontext und der vertrauten Sprache des Jesajazitats.
- source_word: Ἑτοιμάσατε
  choice: Bereitet
  rationale: Der Aoristimperativ Plural fordert entschieden zur Vorbereitung auf; »Bereitet« ist prägnant und würdevoll.
- source_word: τὴν ὁδὸν
  choice: den Weg
  rationale: ὁδός bewahrt als »Weg« sowohl das konkrete Bild als auch die prophetisch-metaphorische Bedeutung.
- source_word: κυρίου
  choice: des Herrn
  rationale: Der Genitiv wird formal und idiomatisch als »des Herrn« wiedergegeben. Der Bezug des Jesajazitats auf JHWH wird in einer Fußnote erläutert.
- source_word: εὐθείας ποιεῖτε
  choice: macht … gerade
  rationale: Die Verbindung bedeutet, die Pfade gerade beziehungsweise unmittelbar gangbar zu machen; die deutsche Formulierung bildet Imperativ und Prädikativum klar ab.
- source_word: τὰς τρίβους αὐτοῦ
  choice: seine Pfade
  rationale: τρίβος bezeichnet einen Pfad oder gebahnten Weg. Der Plural und das auf den Herrn bezogene Pronomen bleiben erhalten.
theological_decisions:
- issue: Wiedergabe von κύριος in einem Jesajazitat, dessen hebräische Vorlage JHWH nennt
  choice: Herr
  alternative: HERR
  rationale: Der griechische Text hat κύριος und wird daher mit »Herr« übersetzt. Dass Jesaja 40,3 im Hebräischen den Gottesnamen JHWH verwendet, wird kenntlich gemacht, ohne ihn in den griechischen Haupttext einzutragen.
- issue: Syntaktische Zuordnung von »in der Wüste«
  choice: 'Zu »ruft« gezogen: »Eine Stimme ruft in der Wüste«'
  alternative: 'Zum Imperativ gezogen: »In der Wüste bereitet den Weg des Herrn«'
  rationale: Wortstellung und unmittelbarer markinischer Zusammenhang legen die Zuordnung zum Rufenden nahe. Die andere mögliche Zeichensetzung des Jesajazitats bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem prophetischem Klang. Die Imperative stehen im Plural. Die Fußnotenmarker folgen entsprechend ihrer Position im Haupttext unmittelbar auf »Herrn«.
