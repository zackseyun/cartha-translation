source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: de
  text: 'Und sagte: „Die Zeit ist erfüllt, und das Reich Gottes[a] ist nahe gekommen. Kehrt um und glaubt an die gute Nachricht.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Herrschaft Gottes ist nahe gekommen.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „an das Evangelium.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: ist erfüllt
  rationale: Das griechische Perfekt bezeichnet eine vollendete Entwicklung mit fortbestehendem Ergebnis. „Ist erfüllt“ gibt dies im Deutschen natürlich und prägnant wieder.
- source_word: ὁ καιρὸς
  choice: die Zeit
  rationale: καιρός meint hier den entscheidenden, bestimmten Zeitpunkt. „Die Zeit“ bewahrt die knappe Formulierung; die heilsgeschichtliche Zuspitzung ergibt sich aus dem Zusammenhang.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Das Perfekt betont, dass die Annäherung geschehen ist und die Nähe nun besteht. „Ist nahe gekommen“ wahrt sowohl Bewegung als auch gegenwärtiges Ergebnis.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: „Reich Gottes“ ist im Deutschen die etablierte, breite Wiedergabe und lässt offen, ob Herrschaft, Herrschaftsbereich oder beides im Vordergrund steht.
- source_word: μετανοεῖτε
  choice: Kehrt um
  rationale: Der Imperativ fordert eine grundlegende Neuorientierung von Denken und Leben. „Kehrt um“ ist verständlich, würdig und umfassender als das bloß gedankliche „ändert eure Meinung“.
- source_word: πιστεύετε
  choice: glaubt
  rationale: „Glaubt“ entspricht dem üblichen Bedeutungsbereich von πιστεύω und bewahrt dessen mögliche Nuancen von Glauben und Vertrauen.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: an die gute Nachricht
  rationale: Nach „glauben“ wird ἐν im Deutschen idiomatisch mit „an“ wiedergegeben. „Gute Nachricht“ erschließt die Grundbedeutung von εὐαγγέλιον unmittelbar; der traditionelle Ausdruck steht in der Fußnote.
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip führt die Erzählung aus dem vorherigen Vers weiter. Im natürlichen deutschen Erzählstil ist die finite Form „und sagte“ angemessener als „und sagend“.
theological_decisions:
- issue: Wiedergabe von βασιλεία τοῦ θεοῦ
  choice: das Reich Gottes
  alternative: die Herrschaft Gottes
  rationale: „Reich Gottes“ bewahrt die traditionelle kanonische Wendung und die semantische Weite des griechischen Ausdrucks, ohne ihn ausschließlich auf den dynamischen Herrschaftsvollzug zu beschränken.
- issue: Wiedergabe von εὐαγγέλιον
  choice: gute Nachricht
  alternative: Evangelium
  rationale: „Gute Nachricht“ ist für heutige Leser unmittelbar verständlich und bildet die Bedeutung des griechischen Wortes transparent ab. „Evangelium“ bleibt als traditionelle Alternative in der Fußnote erhalten.
- issue: Aspekt von μετανοεῖτε καὶ πιστεύετε
  choice: Kehrt um und glaubt
  alternative: Kehrt immer wieder um und glaubt beständig
  rationale: Die griechischen Präsensimperative können fortdauerndes Handeln nahelegen, doch eine ausdrückliche Erweiterung würde den Aspekt im Deutschen überdeuten. Die einfachen Imperative bewahren Dringlichkeit und Offenheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Verkündigungscharakter. Die Satzstruktur bleibt knapp und nahe am Griechischen; traditionelle Fachsprache wird nur dort im Haupttext verwendet, wo sie weiterhin breit verständlich ist.
