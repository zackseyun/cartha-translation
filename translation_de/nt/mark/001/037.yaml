  text: καὶ ⸂εὗρον αὐτὸν καὶ⸃ λέγουσιν αὐτῷ ὅτι Πάντες ⸂ζητοῦσίν σε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/037.yaml
  text: And they found him and said to him[a], “Everyone is looking for you.”
translation:
  language: de
  text: 'Und sie fanden ihn und sagten zu ihm: „Alle suchen dich.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Alle sind auf der Suche nach dir.“'
    reason: Lexikalische Alternative zu ζητοῦσίν; die Formulierung kann den fortdauernden Suchvorgang stärker hervorheben.
lexical_decisions:
- source_word: εὗρον
  choice: fanden
  rationale: Der Aorist von εὑρίσκω bezeichnet hier das erfolgreiche Ende der zuvor geschilderten Suche; „fanden“ ist im deutschen Erzählzusammenhang direkt und natürlich.
- source_word: λέγουσιν
  choice: sagten
  rationale: Das griechische historische Präsens wird im idiomatischen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: ὅτι
  choice: Doppelpunkt und direkte Rede
  rationale: ὅτι leitet hier den Inhalt der Äußerung ein; im Deutschen gibt die direkte Rede dies natürlich wieder.
- source_word: Πάντες
  choice: Alle
  rationale: Das substantivierte Πάντες bezeichnet im Zusammenhang die Gesamtheit der Menschen, die nach Jesus suchen, ohne notwendig eine ausnahmslos universale Aussage zu machen.
- source_word: ζητοῦσίν σε
  choice: suchen dich
  rationale: ζητέω kann „suchen“, „nach jemandem suchen“ oder „erstreben“ bedeuten. Hier steht die konkrete Suche nach Jesus im Vordergrund; „suchen dich“ bewahrt zugleich die knappe Form des Griechischen.
- source_word: καὶ … καὶ
  choice: und
  rationale: Die zweite Verbindung wird mit „und“ bewahrt. Das anlautende καί wird im Deutschen nicht eigens wiedergegeben, weil der Vers als Fortsetzung des vorausgehenden Satzgefüges mit „Sie“ natürlich einsetzt.
- source_word: αὐτὸν / αὐτῷ / σε
  choice: ihn / ihm / dich
  rationale: Die Pronomen werden ihren syntaktischen Funktionen entsprechend direkt wiedergegeben; die Anredeform „dich“ entspricht dem Singular σε.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Das Präteritum entspricht deutscher Erzählkonvention; die knappe, parataktische Ausdrucksweise des Markus bleibt weitgehend erhalten.
