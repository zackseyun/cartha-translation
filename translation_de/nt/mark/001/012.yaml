id: MRK.1.12
reference: Mark 1:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: de
  text: Und sofort treibt ihn der Geist in die Wildnis hinaus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „stößt ihn hinaus“ oder „schickt ihn hinaus“. Das griechische Verb ist kraftvoll; Markus verwendet dasselbe Verb häufig für das Austreiben von Dämonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der schlichte Anschluss bewahrt den für Markus typischen fortlaufenden Erzählfluss, ohne die zeitliche Beziehung stärker auszudeuten.
- source_word: εὐθὺς
  choice: sofort
  rationale: Das geläufige moderne Wort gibt die Dringlichkeit und schnelle Erzählbewegung des markinischen εὐθύς prägnant wieder.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Die bestimmte Form entspricht dem Griechischen und verweist im Kontext auf den bei Jesu Taufe genannten Geist, ohne das ausdrücklichere „der Heilige Geist“ einzufügen.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich eindeutig auf Jesus.
- source_word: ἐκβάλλει
  choice: treibt ... hinaus
  rationale: Die Formulierung wahrt die auffällige Kraft des Verbs ἐκβάλλω sowie dessen Bewegung nach draußen und klingt zugleich in modernem Deutsch natürlich.
- source_word: εἰς τὴν ἔρημον
  choice: in die Wildnis
  rationale: ἔρημος bezeichnet hier eine unbewohnte, öde Gegend. „Wildnis“ vermeidet die unnötige Festlegung auf eine Sandwüste und bewahrt die biblischen Bezüge zum Ort der Prüfung.
theological_decisions:
- issue: Kraft des Handelns des Geistes an Jesus
  choice: „treibt ihn ... hinaus“
  alternative: „führt ihn in die Wildnis“ oder „schickt ihn in die Wildnis hinaus“
  rationale: Das kraftvolle ἐκβάλλει wird nicht abgeschwächt. So bleibt die Spannung bestehen, dass Jesu Gang in die Wildnis auf die Initiative des Geistes zurückgeht, ohne daraus gegen seinen Willen ausgeübten Zwang ausdrücklich abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wildnis“ ist allgemein verständlich und sachlich weiter als „Wüste“. Die Verbwahl bewahrt die markinische Eindringlichkeit; die Fußnote macht den Bedeutungsumfang und die auffällige Wortwahl transparent.
