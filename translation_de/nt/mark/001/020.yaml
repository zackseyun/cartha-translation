  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: de
  text: Und sofort rief er sie. Sie ließen ihren Vater Zebedäus mit den Lohnarbeitern im Boot zurück und gingen hinter ihm her.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „folgten ihm“. Die griechische Formulierung kann sowohl die räumliche Bewegung hinter ihm her als auch den Beginn der Nachfolge bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt den für Markus charakteristischen Ausdruck der Dringlichkeit und klingt im modernen Deutsch natürlich.
- source_word: ἐκάλεσεν
  choice: rief
  rationale: Gibt καλέω direkt wieder, ohne die Autorität eines Befehls oder die Unverbindlichkeit einer Einladung zusätzlich festzulegen.
- source_word: ἀφέντες
  choice: ließen … zurück
  rationale: Drückt die dem Hauptverb vorausgehende Begleithandlung idiomatisch aus, ohne die stärkere Wertung „verließen“ oder „ließen im Stich“ einzutragen.
- source_word: πατέρα αὐτῶν Ζεβεδαῖον
  choice: ihren Vater Zebedäus
  rationale: Natürliche deutsche Wortstellung; der Name folgt der etablierten deutschen Form.
- source_word: πλοίῳ
  choice: Boot
  rationale: Passt sachlich zum galiläischen Fischereikontext besser als „Schiff“.
- source_word: μισθωτῶν
  choice: Tagelöhnern
  rationale: Bezeichnet hier plausibel gegen Lohn beschäftigte Arbeiter und ist im handwerklich-fischereilichen Kontext prägnant; das Griechische legt jedoch nicht zwingend eine tägliche Entlohnung fest.
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: gingen hinter ihm her
  rationale: Gibt sowohl die räumliche Bewegung als auch den anklingenden Beginn der Nachfolge wieder, ohne eine der beiden Ebenen auszuschließen.
theological_decisions:
- issue: Nachfolgebedeutung von ὀπίσω αὐτοῦ
  choice: hinter ihm her
  alternative: folgten ihm
  rationale: „Hinter ihm her“ bewahrt den unmittelbar räumlichen Sinn und lässt zugleich die Jüngerschaft anklingen; „folgten ihm“ würde die theologische Nachfolgebedeutung deutlicher festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweite Satz wird mit „Da“ angeschlossen, um die griechische Partizipialkonstruktion natürlich wiederzugeben. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
