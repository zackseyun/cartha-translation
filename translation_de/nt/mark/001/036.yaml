lexical_decisions:
- source_word: κατεδίωξεν
  choice: suchten überall nach
  rationale: Das Verb καταδιώκω bezeichnet ein nachdrückliches Verfolgen oder eifriges Nachsuchen. Im Kontext suchen Simon und seine Begleiter Jesus; „suchten überall nach“ gibt die Intensität natürlich wieder, ohne im Deutschen eine feindselige Verfolgung anzudeuten.
- source_word: αὐτόν
  choice: ihm
  rationale: Das Pronomen bezieht sich im unmittelbaren Zusammenhang auf Jesus. Nach „nach jemandem suchen“ steht im Deutschen der Dativ.
- source_word: Σίμων
  choice: Simon
  rationale: Der Personenname wird nach der üblichen deutschen Form wiedergegeben.
- source_word: οἱ μετ’ αὐτοῦ
  choice: seine Begleiter
  rationale: Die Wendung bedeutet wörtlich „die mit ihm“. „Seine Begleiter“ ist knapp und natürlich, ohne die Gruppe genauer zu bestimmen, als es der griechische Text tut.
- source_word: καί
  choice: und
  rationale: Die Konjunktion verbindet den Satz schlicht mit der vorausgehenden Erzählung und bewahrt den reihenden Stil des Markusevangeliums.
