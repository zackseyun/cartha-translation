id: MRK.1.5
reference: Mark 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: de
  text: Und ganz Judäa und alle Einwohner Jerusalems zogen zu ihm hinaus. Sie ließen sich von ihm im Jordan taufen und bekannten dabei ihre Sünden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: zogen … hinaus
  rationale: Der deutsche Erzählzusammenhang gibt den fortlaufenden beziehungsweise wiederholten Vorgang des Imperfekts mit dem Präteritum natürlich wieder; die Richtung zu Johannes bleibt durch „zu ihm“ erhalten.
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: das ganze judäische Umland
  rationale: χώρα bezeichnet hier das Gebiet beziehungsweise Land außerhalb des städtischen Zentrums. „Umland“ ist idiomatisch und bewahrt den Kontrast zu Jerusalem, ohne mathematische Universalität zu erzwingen.
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: alle Einwohner Jerusalems
  rationale: Die substantivische Einwohnerbezeichnung wird in natürlichem modernem Deutsch wiedergegeben; πάντες bleibt durch „alle“ sichtbar.
- source_word: ἐβαπτίζοντο
  choice: ließen sich … taufen
  rationale: Diese idiomatische deutsche Form wahrt, dass Johannes die Taufe an ihnen vollzog, und gibt den wiederholten Vorgang im Erzählfluss natürlich wieder.
- source_word: ὑπ’ αὐτοῦ
  choice: von ihm
  rationale: Das Pronomen wird wie im Griechischen beibehalten und nicht durch den Namen Johannes ersetzt.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: im Jordan
  rationale: „Jordan“ ist im Deutschen die übliche Bezeichnung des Flusses; die explizite Wiedergabe von ποταμός als „Fluss“ wäre möglich, aber hier unnötig schwerfällig.
- source_word: ἐξομολογούμενοι
  choice: bekannten dabei
  rationale: Das Partizip bezeichnet eine die Taufe begleitende Handlung. „Dabei“ macht diese Beziehung im Deutschen klar, ohne eine genauere zeitliche oder theologische Abfolge festzulegen.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: ihre Sünden
  rationale: Direkte und natürliche Wiedergabe des Akkusativobjekts mit Possessivbezug.
theological_decisions:
- issue: Reichweite von πᾶσα und πάντες
  choice: „das ganze“ und „alle“ beibehalten
  alternative: abschwächend „viele aus Judäa und Jerusalem“
  rationale: Die umfassende Rhetorik des griechischen Textes soll sichtbar bleiben, kann im narrativen Zusammenhang aber als idiomatische Kollektivaussage verstanden werden und muss keine ausnahmslose mathematische Gesamtheit behaupten.
- issue: Bedeutung und Vollzugsweise der Taufe
  choice: mit „taufen“ wiedergeben
  alternative: „untertauchen“ oder „waschen“
  rationale: „Taufen“ gibt die berichtete Handlung wieder, ohne eine bestimmte Vollzugsweise oder spätere konfessionelle Deutung in den Vers einzutragen.
- issue: Verhältnis von Sündenbekenntnis und Taufe
  choice: durch „dabei“ als begleitende Handlung ausdrücken
  alternative: eine feste zeitliche Reihenfolge oder sakramentale Kausalität formulieren
  rationale: Das griechische Partizip beschreibt das Bekennen als Begleitumstand, legt aber keine ausgearbeitete dogmatische Beziehung oder eindeutige zeitliche Reihenfolge fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die Wiederholung von „alle/das ganze“ bewahrt die markinische Zuspitzung. Keine Fußnote ist erforderlich, da keine für das Verständnis notwendige textliche oder lexikalische Alternative in den Haupttext ausgelagert werden muss.
