  naturalness: Der Text ist flüssiges modernes Standarddeutsch. „Ganz Judäa“ ist als narrative, metonymische Kollektivbezeichnung in diesem Kontext idiomatisch und bewahrt die knappe markinische Ausdrucksweise besser als „judäisches Umland“.
  terminology: „taufen“, „Sünden“ und „Jordan“ sind angemessen und konfessionell nicht vorentscheidend. Die Beibehaltung von „ihm“ entspricht dem griechischen Pronomen. Eine Fußnote ist nicht erforderlich.
