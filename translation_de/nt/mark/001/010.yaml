id: MRK.1.10
reference: Mark 1:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: de
  text: Und sofort, als er aus dem Wasser heraufstieg, sah er, wie die Himmel aufgerissen wurden[a] und der Geist wie eine Taube auf ihn[b] herabkam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie die Himmel gespalten wurden“. Das Verb ist stärker als ein bloßes „Öffnen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in ihn hinein“. Das griechische εἰς kann „in … hinein“ bedeuten; hier passt „auf ihn“ jedoch gut zum Herabkommen des Geistes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus charakteristische erzählerische Dringlichkeit in natürlichem, modernem Deutsch.
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: als er aus dem Wasser heraufstieg
  rationale: Die mit dem Hauptverb gleichzeitige Handlung des Präsenspartizips wird durch „als“ wiedergegeben; „aus dem Wasser“ bildet ἐκ präzise ab.
- source_word: εἶδεν
  choice: sah er
  rationale: Direkte und natürliche Wiedergabe des Wahrnehmungsverbs im Aorist.
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: wie die Himmel aufgerissen wurden
  rationale: „Aufgerissen“ erhält die kräftige, dramatische Bedeutung von σχίζω und schwächt sie nicht zu einem bloßen Öffnen ab; der Plural von οὐρανούς bleibt erhalten.
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der Zusammenhang verweist auf Gottes Geist, doch der griechische Text sagt lediglich „der Geist“ und wird daher nicht zu „der Heilige Geist“ erweitert.
- source_word: ὡς περιστερὰν
  choice: wie eine Taube
  rationale: Die Vergleichsform bleibt offen und legt nicht fest, ob Gestalt, Bewegung oder eine andere Ähnlichkeit gemeint ist.
- source_word: καταβαῖνον
  choice: herabkam
  rationale: Natürliches, würdevolles Deutsch für die abwärts gerichtete Bewegung zum Blickpunkt Jesu.
- source_word: εἰς αὐτόν
  choice: auf ihn
  rationale: Beim Herabkommen des Geistes ist „auf ihn“ im Deutschen idiomatisch; die mögliche räumliche Lesart „in ihn hinein“ wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Bezug von „der Geist“
  choice: Gottes Geist, wiedergegeben als „der Geist“
  alternative: „der Heilige Geist“
  rationale: Der Kontext identifiziert den göttlichen Geist, doch die Übersetzung fügt das im griechischen Wortlaut fehlende Adjektiv „heilig“ nicht hinzu.
- issue: Bedeutung des Taubenvergleichs
  choice: „wie eine Taube“ ohne nähere Festlegung
  alternative: „in Gestalt einer Taube“ oder „auf taubenähnliche Weise“
  rationale: ὡς bezeichnet einen Vergleich, bestimmt aber nicht ausdrücklich dessen genauen Bezug; diese echte Mehrdeutigkeit bleibt erhalten.
- issue: Zielrichtung von εἰς αὐτόν
  choice: „auf ihn“
  alternative: „in ihn hinein“
  rationale: „Auf ihn“ passt idiomatisch zur Herabkunft des Geistes, während die mögliche stärkere Innenrichtung von εἰς nicht verschwiegen, sondern in der Fußnote genannt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Die Himmel“ bewahrt bewusst den griechischen Plural und dessen biblische Resonanz; „aufgerissen“ erhält die markante Bildkraft des Ausgangstextes.
