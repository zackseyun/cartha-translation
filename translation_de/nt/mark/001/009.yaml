id: MRK.1.9
reference: Mark 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: de
  text: 'Und es geschah in jenen Tagen: Jesus kam aus Nazaret in Galiläa und wurde von Johannes im Jordan[a] getauft.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Jordan hinein“. Die griechische Präposition kann wörtlicher so wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Und es geschah
  rationale: Bewahrt die erzählerische Übergangsformel und ihren würdevollen Ton, ohne die altertümlichere Formulierung „es begab sich“ zu verwenden.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Gibt die Zeitangabe direkt und in natürlichem, leicht feierlichem Deutsch wieder.
- source_word: ἦλθεν
  choice: kam
  rationale: Entspricht dem schlichten Bewegungsverb, ohne wie „traf ein“ den Zielpunkt zusätzlich zu betonen.
- source_word: Ἰησοῦς
  choice: Jesus
  rationale: Verwendet die im Deutschen etablierte Namensform.
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: aus Nazaret in Galiläa
  rationale: Kennzeichnet Nazaret in natürlichem Deutsch als Ort innerhalb Galiläas; die wörtlichere Genitivwiedergabe „Nazaret Galiläas“ wäre unnötig steif.
- source_word: ἐβαπτίσθη
  choice: wurde getauft
  rationale: Gibt den Aorist Passiv direkt wieder und vermeidet eine konfessionell verengende Festlegung auf einen bestimmten Taufmodus.
- source_word: εἰς τὸν Ἰορδάνην
  choice: im Jordan
  rationale: Ist im Deutschen die natürliche Ortsangabe für die Taufe. Da εἰς wörtlicher eine Bewegung „in … hinein“ bezeichnen kann, wird diese Möglichkeit in einer Fußnote erhalten.
- source_word: ὑπὸ Ἰωάννου
  choice: von Johannes
  rationale: Gibt ὑπό mit Genitiv als Bezeichnung der handelnden Person in der Passivkonstruktion präzise wieder.
theological_decisions:
- issue: Wiedergabe von βαπτίζω in einem konfessionell sensiblen Zusammenhang
  choice: wurde getauft
  alternative: wurde untergetaucht
  rationale: „Getauft“ bezeichnet das berichtete Geschehen treu, ohne aus dem Verb allein eine über den Vers hinausgehende Festlegung auf den genauen Vollzugsmodus abzuleiten.
- issue: Räumliche oder gerichtete Bedeutung von εἰς beim Jordan
  choice: im Jordan
  alternative: in den Jordan hinein
  rationale: Die Hauptübersetzung folgt dem natürlichen deutschen Sprachgebrauch für den Ort der Taufe; die mögliche gerichtete Nuance der griechischen Präposition bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach der erzählerischen Formel schafft einen natürlichen Satzfluss und bewahrt zugleich deren Eigenständigkeit. Die Form „Nazaret“ folgt der verbreiteten deutschen biblischen Schreibweise.
