id: MRK.1.29
reference: Mark 1:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: de
  text: Und sofort, nachdem sie die Synagoge verlassen hatten, gingen sie zusammen mit Jakobus und Johannes in das Haus von Simon und Andreas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Das für Markus charakteristische Adverb treibt die Erzählung voran; „sofort“ ist gegenwärtiges, natürliches Deutsch und bewahrt die Unmittelbarkeit.
- source_word: ἐκ τῆς συναγωγῆς
  choice: die Synagoge verlassen hatten
  rationale: Zusammen mit ἐξελθόντες bezeichnet ἐκ die Bewegung aus der Synagoge heraus. Die deutsche Nebensatzform gibt den vorausgehenden Vorgang idiomatisch wieder.
- source_word: ἐξελθόντες ἦλθον
  choice: nachdem sie ... verlassen hatten, gingen sie
  rationale: 'Das Aoristpartizip bezeichnet hier die dem Hauptverb vorausgehende Handlung: Erst verließen sie die Synagoge, dann begaben sie sich zum Haus.'
- source_word: ἦλθον
  choice: gingen sie
  rationale: ἔρχομαι kann je nach Erzählperspektive „kommen“ oder „gehen“ bedeuten. Da die Bewegung von der Synagoge zu einem genannten Ziel beschrieben wird, ist „gingen“ im Deutschen natürlich.
- source_word: εἰς τὴν οἰκίαν
  choice: in das Haus
  rationale: εἰς bezeichnet die Bewegung hinein; „in das Haus“ bewahrt diese Richtung genauer als bloß „zum Haus“.
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: von Simon und Andreas
  rationale: Die Genitive kennzeichnen das Haus als die Wohnung beziehungsweise das Haus von Simon und Andreas; die von-Konstruktion ist im modernen Deutsch klar und natürlich.
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: zusammen mit Jakobus und Johannes
  rationale: μετά mit Genitiv bezeichnet Begleitung. „Zusammen mit“ macht eindeutig, dass Jakobus und Johannes sie begleiteten.
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: Simon / Andreas / Jakobus / Johannes
  rationale: Die Personennamen folgen ihren etablierten deutschen Bibelformen.
theological_decisions: []
