base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: de
  text: Und er zog[a] durch ganz Galiläa, verkündigte in ihren Synagogen und trieb Dämonen aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er kam, verkündigte in ihren Synagogen in ganz Galiläa und trieb Dämonen aus.“ Das griechische Verb kann „kam“ bedeuten; im Zusammenhang beschreibt es wahrscheinlich sein Umherziehen in der Region.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: er zog durch
  rationale: Der Aorist von ἔρχομαι kann formal „er kam“ oder „er ging“ bedeuten. Zusammen mit der Gebietsangabe beschreibt er hier am natürlichsten Jesu Wanderbewegung durch Galiläa; „zog durch“ gibt dies knapp wieder.
- source_word: κηρύσσων
  choice: verkündigte
  rationale: κηρύσσω bezeichnet öffentliches Ausrufen oder Verkündigen. „Verkündigte“ ist im Deutschen natürlich, würdig und bewahrt den Charakter öffentlicher Proklamation.
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: in ihren Synagogen
  rationale: Obwohl εἰς grundsätzlich eine Richtung anzeigen kann, bezeichnet die Wendung hier idiomatisch den Ort der Verkündigung. Das Pronomen αὐτῶν bleibt mit „ihren“ erhalten.
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: durch ganz Galiläa
  rationale: Die Formulierung bezeichnet die räumliche Ausdehnung seines Wirkens. „Durch ganz Galiläa“ gibt sowohl εἰς als auch ὅλην in natürlichem Deutsch wieder.
- source_word: τὰ δαιμόνια
  choice: Dämonen
  rationale: δαιμόνια bezeichnet hier Dämonen. Im Deutschen steht der artikellose Plural bei einer allgemein beschriebenen, wiederholten Tätigkeit natürlicher als „die Dämonen“.
- source_word: ἐκβάλλων
  choice: trieb … aus
  rationale: ἐκβάλλω bedeutet in diesem Zusammenhang „austreiben“. Die finite Reihung ist im Deutschen flüssig und bildet die gleichzeitigen Begleithandlungen der griechischen Partizipien angemessen ab.
theological_decisions:
- issue: Wesen der δαιμόνια
  choice: Als „Dämonen“ wiedergegeben, entsprechend der personal-geistlichen Darstellung des Textes.
  alternative: böse Geister
  rationale: „Dämonen“ ist die direkte lexikalische Entsprechung und fügt keine weitergehende dogmatische Deutung hinzu.
- issue: Bewegungsrichtung von ἦλθεν
  choice: Als Wanderbewegung „zog durch“ verstanden.
  alternative: „kam“ beziehungsweise „ging“
  rationale: Der unmittelbare Zusammenhang mit ganz Galiläa und den begleitenden Tätigkeiten legt ein umherziehendes Wirken nahe; die mögliche formale Wiedergabe „kam“ wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur ist bewusst knapp; „zog durch“ vermeidet eine schwerfällige wörtliche Wiedergabe der beiden εἰς-Fügungen, während die Fußnote die echte lexikalisch-syntaktische Alternative bewahrt.
