lexical_decisions:
- source_word: ἐμβριμησάμενος
  choice: nachdem er ihn eindringlich ermahnt hatte
  rationale: Das Partizip bezeichnet eine Äußerung mit starker emotionaler Intensität und kann eine strenge Mahnung oder Entrüstung ausdrücken. „Eindringlich ermahnt“ gibt hier die nachdrückliche Anweisung natürlich wieder, ohne eine persönliche Verurteilung des Mannes festzulegen.
- source_word: αὐτῷ
  choice: ihn
  rationale: Das Dativpronomen bezieht sich auf den geheilten Mann und wird als Objekt von „ermahnen“ idiomatisch wiedergegeben.
- source_word: εὐθύς
  choice: sofort
  rationale: Das Wort markiert die für Markus typische Unmittelbarkeit und das rasche Erzähltempo.
- source_word: ἐξέβαλεν
  choice: schickte ... fort
  rationale: Das Verb ist kräftiger als ein neutrales Entlassen und kann „hinaustreiben“ oder „hinauswerfen“ bedeuten. Im Zusammenhang mit dem geheilten Mann ist „fortschicken“ idiomatisch; eine Fußnote bewahrt die ungewöhnliche Stärke des Ausdrucks.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Akkusativpronomen verweist auf denselben Mann.
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verknüpfung bewahrt den fortlaufenden, parataktischen Erzählstil des Markus.
theological_decisions:
- issue: Der Ton von Jesu Verhalten gegenüber dem geheilten Mann
  choice: Jesus ermahnt ihn mit deutlichem Nachdruck und schickt ihn unverzüglich fort, ohne dass die Übersetzung feindselige oder sündhafte Wut unterstellt.
  alternative: Jesus weist ihn lediglich sachlich an; oder Jesus weist den Mann persönlich scharf zurecht.
  rationale: Sowohl ἐμβριμησάμενος als auch ἐξέβαλεν sind auffallend starke Ausdrücke. Die Übersetzung erhält diesen Nachdruck, legt aber nicht fest, ob persönliche Entrüstung oder eine Verurteilung des Mannes gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Erzählstil. Die Wortstellung hält den Markus typischen zügigen Fortgang fest; die Fußnoten bewahren die starke und teilweise mehrdeutige emotionale Färbung der griechischen Verben.
