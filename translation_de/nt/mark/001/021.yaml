  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: de
  text: Und sie kamen nach Kafarnaum. Gleich am Sabbat lehrte er in der Synagoge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „lehrte er gerade“ beziehungsweise „begann er zu lehren“. Der griechische Imperfekt kann den Verlauf oder den Beginn der Handlung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: sie kamen nach
  rationale: Der historische Präsens ist für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben. Bei Ortsnamen bezeichnet εἰς mit einem Verb des Hineingehens idiomatisch das Ziel; „nach Kafarnaum“ klingt im Deutschen natürlicher als „in Kafarnaum hinein“.
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Verwendet wird die im Deutschen etablierte Form des Ortsnamens.
- source_word: εὐθύς
  choice: gleich
  rationale: „Gleich“ bewahrt die von εὐθύς ausgedrückte Unmittelbarkeit und entspricht einem natürlichen, lebendigen deutschen Erzählstil.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der formal pluralische Ausdruck ist hier eine übliche Zeitangabe mit singularischer Bedeutung. „Am Sabbat“ ist die natürliche deutsche Wiedergabe.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das deutsche Präteritum gibt die Handlung im Erzählzusammenhang natürlich wieder, ohne den griechischen Imperfekt zwingend als einsetzend oder ausdrücklich andauernd festzulegen.
- source_word: συναγωγήν
  choice: Synagoge
  rationale: Im jüdischen Kontext bezeichnet συναγωγή die örtliche Synagoge, nicht lediglich eine allgemeine Versammlung.
theological_decisions: []
