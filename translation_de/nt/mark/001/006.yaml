  source_fidelity: 'Der Text gibt die Beschreibung des Griechischen zuverlässig wieder: Kamelhaar als Bekleidungsmaterial, Ledergürtel im Hüft-/Lendenbereich sowie Heuschrecken und wilder Honig als Nahrung. „Trug“ ist eine natürliche deutsche Umsetzung der Zustandsbeschreibung mit ἐνδεδυμένος. Die fehlende ausdrückliche Wiedergabe von καὶ ἦν ist im Deutschen stilistisch unproblematisch, zumal die Wortfolge im SBLGNT textkritisch markiert ist.'
