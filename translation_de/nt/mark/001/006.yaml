  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ἦν⸃ ὁ Ἰωάννης ἐνδεδυμένος τρίχας καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, καὶ ἔσθων ἀκρίδας καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/006.yaml
  text: John was clothed with camel’s hair and a leather belt around his waist[a], and he was eating locusts and wild honey.
translation:
  language: de
  text: Johannes trug ein Gewand aus Kamelhaar und einen Ledergürtel um die Hüften[a]; er aß Heuschrecken und wilden Honig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Kleidung des Johannes erinnert an die Beschreibung Elias in 2. Könige 1,8 und trägt dazu bei, Johannes als prophetischen Wegbereiter darzustellen.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος τρίχας καμήλου
  choice: trug ein Gewand aus Kamelhaar
  rationale: Das Perfektpartizip beschreibt Johannes in seinem bekleideten Zustand. Da τρίχας καμήλου das Material bezeichnet, macht „ein Gewand aus Kamelhaar“ im Deutschen natürlich und eindeutig klar, dass nicht bloß einzelne Haare getragen wurden.
- source_word: ζώνην δερματίνην
  choice: einen Ledergürtel
  rationale: ζώνη bezeichnet einen Gürtel oder eine Leibbinde, δερματίνην das Material Leder. „Ledergürtel“ ist die präzise und geläufige Wiedergabe.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: um die Hüften
  rationale: ὀσφύς bezeichnet den Hüft- beziehungsweise Lendenbereich. „Um die Hüften“ ist modern und bewahrt den körperlichen Bezug besser als das heute altertümliche „um seine Lenden“.
- source_word: ἔσθων
  choice: er aß
  rationale: Das Präsenspartizip gehört zum beschreibenden Porträt und kann eine fortdauernde oder gewohnheitsmäßige Tätigkeit ausdrücken. Im Deutschen gibt „er aß“ diese Ernährungsweise idiomatisch wieder, ohne eine unnatürliche Verlaufsform zu erzwingen.
- source_word: ἀκρίδας
  choice: Heuschrecken
  rationale: ἀκρίς bezeichnet hier regulär die als Nahrung dienende Heuschrecke; für eine abweichende botanische Deutung gibt der griechische Text keinen Anlass.
- source_word: μέλι ἄγριον
  choice: wilden Honig
  rationale: Die direkte Adjektivverbindung bezeichnet Honig aus der freien Natur. „Wilder Honig“ ist die natürliche deutsche Entsprechung.
- source_word: ⸂καὶ ἦν⸃
  choice: Johannes trug
  rationale: Die eingeklammerte Wortfolge ist textkritisch markiert. Im Deutschen wird die fortlaufende Beschreibung ohne einen eigens hinzugefügten temporalen Diskursmarker eröffnet; die prädikative Konstruktion mit ἦν und Partizip wird idiomatisch durch „trug“ wiedergegeben.
theological_decisions:
- issue: Anspielung auf Elia durch Kleidung und Gürtel
  choice: Die mögliche Elia-Anspielung bleibt aus dem Haupttext heraus und wird in einer Fußnote erläutert.
  alternative: Johannes im Haupttext ausdrücklich als Elia ähnlichen Propheten oder Vorläufer bezeichnen.
  rationale: Die Beschreibung erinnert deutlich an 2. Könige 1,8, doch Markus 1,6 spricht die Identifikation nicht ausdrücklich aus. Der Haupttext bleibt daher deskriptiv und bewahrt die intertextuelle Schlussfolgerung für die Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gewand aus Kamelhaar“ verhindert das Missverständnis, Johannes habe lediglich Kamelhaare am Körper getragen. Das Semikolon bildet die beiden mit καί verbundenen Teile des Porträts flüssig ab. Der Fußnotenmarker [a] steht unmittelbar bei der einschlägigen Kleidungsbeschreibung.
