  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: de
  text: 'Und ein Mann mit Aussatz[a] kommt zu ihm, bittet ihn inständig, kniet nieder und sagt zu ihm: »Wenn du willst, kannst du mich rein machen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das traditionell mit »Aussatz« wiedergegebene griechische Wort kann verschiedene schwere Hautkrankheiten bezeichnen und meint nicht zwingend die heute als Lepra bekannte Krankheit. Wörtlicher: »ein Aussätziger«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »mich reinigen«. Das griechische Verb kann sowohl die Befreiung von Unreinheit als auch die körperliche Wiederherstellung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: ein Mann, der an Aussatz erkrankt ist
  rationale: Die substantivierte Form bezeichnet einen von einer als »Aussatz« eingeordneten Hautkrankheit betroffenen Menschen. Die personenbezogene Formulierung ist im heutigen Deutsch natürlich und vermeidet, die Person auf ihre Krankheit zu reduzieren.
- source_word: παρακαλῶν
  choice: bittet ihn inständig
  rationale: Im Zusammenhang bezeichnet παρακαλέω eine eindringliche persönliche Bitte. »Inständig bitten« gibt deren Ernst wieder, ohne eine über den Text hinausgehende Verzweiflung vorauszusetzen.
- source_word: γονυπετῶν
  choice: fällt vor ihm auf die Knie
  rationale: Das Verb bezeichnet das Einnehmen einer knienden Haltung. Die Wendung ist idiomatisches Deutsch und macht die Bewegung anschaulich.
- source_word: Ἐὰν θέλῃς
  choice: Wenn du willst
  rationale: θέλω bezeichnet hier Jesu Willen beziehungsweise Bereitschaft. Die knappe Formulierung ist natürlich und bewahrt die Bedingung des Appells.
- source_word: δύνασαί
  choice: kannst du
  rationale: δύναμαι bezeichnet Fähigkeit oder Macht. Das deutsche Modalverb gibt dies in diesem Satz unmittelbar und idiomatisch wieder.
- source_word: καθαρίσαι
  choice: mich rein machen
  rationale: καθαρίζω umfasst hier sowohl die körperliche Wiederherstellung als auch die Befreiung von kultischer Unreinheit. »Rein machen« hält beide Aspekte offen und ersetzt das Verb nicht einengend durch »heilen«.
- source_word: ἔρχεται
  choice: kommt
  rationale: Der historische Präsens wird beibehalten, um den lebendigen Erzählstil des Markus nicht unnötig in die Vergangenheit zu glätten.
theological_decisions:
- issue: Art der Reinigung im Zusammenhang mit Aussatz
  choice: mich rein machen
  alternative: mich heilen; mich reinigen
  rationale: Der griechische Text verwendet ein Verb für Reinigung, nicht das übliche Verb für Heilung. Die gewählte Wiedergabe bewahrt die Spannung zwischen körperlicher Wiederherstellung und Aufhebung kultischer Unreinheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Das historische Präsens des Markus bleibt erhalten. Die direkte Rede ist bewusst schlicht und eindringlich formuliert.
