  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς γενέσθαι ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihnen: »Kommt, folgt mir nach! Ich werde euch zu Menschenfischern machen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: Kommt, folgt mir nach!
  rationale: Die idiomatische Aufforderung bedeutet, sich Jesus anzuschließen und ihm als Jünger zu folgen. Die Wiedergabe ist im modernen Deutschen natürlich und bewahrt zugleich den Rufcharakter.
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: Ich werde euch zu … machen
  rationale: Die Verbindung von ποιήσω und γενέσθαι betont, dass Jesus diese Veränderung bewirken wird. Im Deutschen gibt die Konstruktion »zu … machen« den Sinn klar und ohne unnötige Schwerfälligkeit wieder.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: Menschenfischer
  rationale: Das geläufige deutsche Kompositum bewahrt das anschauliche Fischfangbild und gibt ἀνθρώπων hier inklusiv als »Menschen« wieder.
theological_decisions:
- issue: Jesu Verheißung und Wirken bei der Berufung
  choice: Ich werde euch zu Menschenfischern machen
  alternative: Ihr sollt Menschenfischer werden
  rationale: Der griechische Text stellt Jesu eigenes zukünftiges Wirken heraus, nicht bloß einen Auftrag oder eine Erwartung an die Berufenen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp und eindringlich; das traditionelle, allgemein verständliche Bildwort »Menschenfischer« bleibt erhalten.
