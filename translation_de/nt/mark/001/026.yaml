id: MRK.1.26
reference: Mark 1:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: de
  text: Da versetzte ihn der unreine Geist in Krämpfe, schrie mit lauter Stimme und fuhr aus ihm heraus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν
  choice: versetzte ihn in Krämpfe
  rationale: Das Aoristpartizip bezeichnet hier eine heftige körperliche Erschütterung, die der Geist vor seinem Ausfahren verursacht. Die Formulierung ist im heutigen Deutsch klarer als das missverständliche wörtliche »zerrte ihn«.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: der unreine Geist
  rationale: Die feste neutestamentliche Wendung bewahrt sowohl den Gedanken der Unreinheit als auch die im Kontext erkennbare persönliche Handlungsfähigkeit des Geistes.
- source_word: φωνῆσαν
  choice: schrie
  rationale: Das Partizip beschreibt eine laute Äußerung des Geistes. »Schrie« gibt deren Heftigkeit natürlich wieder, ohne einen bestimmten Gefühlszustand hinzuzufügen.
- source_word: φωνῇ μεγάλῃ
  choice: mit lauter Stimme
  rationale: Die Wendung gibt den modalen Dativ und das ausdrücklich verwendete Wort »Stimme« transparent wieder.
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: fuhr aus ihm heraus
  rationale: Die Formulierung bewahrt die räumliche Vorstellung des griechischen Exorzismusausdrucks und ist im Deutschen verständlich und idiomatisch.
- source_word: καὶ ... καὶ
  choice: Da ... und
  rationale: »Da« führt die Handlung als unmittelbare Folge des vorausgehenden Befehls fort; die anschließende Koordination erhält den knappen Erzählfluss des Markus.
theological_decisions:
- issue: Wesen des besitzergreifenden Akteurs
  choice: Die Wendung bezeichnet einen persönlich handelnden unreinen Geist.
  alternative: eine unpersönliche böse Kraft
  rationale: 'Im erzählten Geschehen handelt der Geist als Subjekt: Er versetzt den Mann in Krämpfe, schreit und fährt aus ihm heraus. Die Übersetzung erhält diese personale Darstellung, ohne sie dogmatisch weiter auszudeuten.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung der Handlungen entspricht dem raschen Erzählstil des Markus; »fuhr ... heraus« erhält zugleich die konkrete Bildlichkeit des Ausgangstextes.
