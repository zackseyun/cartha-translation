source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: de
  text: 'Und alle gerieten in Staunen, sodass sie miteinander diskutierten: „Was ist das? Eine neue Lehre mit Vollmacht[a]! Sogar den unreinen Geistern befiehlt er, und sie gehorchen ihm.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder mit anderer Zeichensetzung: „Was ist das? Was ist das für eine neue Lehre mit Vollmacht?“ Der griechische Text lässt zu, „neue Lehre“ unmittelbarer in die Frage einzubeziehen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: waren außer sich vor Staunen
  rationale: Das Verb bezeichnet ein starkes Erstaunen oder Erschrecken. Die Wendung gibt die Intensität natürlich wieder, ohne eine bestimmte Gefühlsrichtung festzulegen.
- source_word: ἅπαντες
  choice: alle
  rationale: Gibt die betonte Gesamtheit der Anwesenden knapp und unmittelbar wieder.
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: sodass sie miteinander darüber sprachen
  rationale: ὥστε mit Infinitiv bezeichnet hier die Folge; συζητεῖν meint gemeinsames Erörtern. „Miteinander“ gibt den wechselseitigen Sinn von πρὸς ἑαυτούς wieder, während „darüber“ im Deutschen das Gesprächsthema natürlich aufnimmt.
- source_word: Τί ἐστιν τοῦτο;
  choice: Was ist das?
  rationale: Bewahrt die knappe, erstaunte Frage des griechischen Textes ohne erklärende Erweiterung.
- source_word: διδαχὴ καινή
  choice: Eine neue Lehre
  rationale: „Lehre“ ist in diesem Zusammenhang verständlich und würdevoll; „neu“ wahrt die unmittelbare Charakterisierung καινή.
- source_word: κατ’ ἐξουσίαν
  choice: mit Vollmacht
  rationale: „Vollmacht“ bezeichnet hier wirksame, legitime Autorität und entspricht dem markinischen Zusammenhang besser als das allgemeinere „Autorität“.
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: den unreinen Geistern
  rationale: „Unrein“ bewahrt die religiös-moralische Bedeutungsbreite von ἀκάθαρτος und die traditionelle, weiterhin verständliche Ausdrucksweise.
- source_word: ἐπιτάσσει
  choice: befiehlt er
  rationale: Gibt den autoritativen Befehl des Präsens direkt wieder.
- source_word: ὑπακούουσιν αὐτῷ
  choice: sie gehorchen ihm
  rationale: Bezeichnet eindeutig die gehorsame Reaktion auf seinen Befehl.
theological_decisions:
- issue: Syntaktischer Bezug von κατ’ ἐξουσίαν
  choice: „Eine neue Lehre mit Vollmacht!“ als ausrufende Beurteilung
  alternative: „Was ist das? Was ist das für eine neue Lehre mit Vollmacht?“ oder Bezug auf das folgende Befehlen
  rationale: Wortfolge und Zeichensetzung lassen mehrere Gliederungen zu. Die Hauptfassung verbindet die Vollmacht mit der neuen Lehre, ohne auszuschließen, dass der folgende Machterweis diese Vollmacht erläutert; die Fußnote bewahrt die mögliche Fragegliederung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Außer sich vor Staunen“ wahrt die Stärke der Reaktion; „Vollmacht“ erhält den biblischen Autoritätsgedanken, ohne ihn konfessionell auszudeuten.
