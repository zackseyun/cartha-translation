  text: λέγων· ⸀Τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: de
  text: 'und sagte: „Was haben wir mit dir zu schaffen[a], Jesus von Nazaret[b]? Bist du gekommen, um uns zu vernichten? Ich weiß, wer du bist: der Heilige Gottes.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was haben wir mit dir zu tun?“ Die griechische Wendung drückt Abgrenzung oder Feindseligkeit aus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Jesus, Nazarener“. Griechisch: „Jesus, Nazarener“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: und sagte
  rationale: Das Partizip wird im fortlaufenden deutschen Erzählstil natürlich als beigeordnete finite Verbform wiedergegeben.
- source_word: Τί ἡμῖν καὶ σοί
  choice: Was haben wir mit dir zu schaffen
  rationale: Die feste Wendung drückt Abgrenzung beziehungsweise feindselige Zurückweisung aus. Die deutsche idiomatische Form bewahrt diesen Sinn und die gegenseitige Relation, ohne sie weiter auszudeuten.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jesus, du Nazarener
  rationale: Der Vokativ und die adjektivisch-titelhafte Bezeichnung werden direkt bewahrt. Die Anrede mit „du“ macht den Vokativ im modernen Deutschen deutlich.
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: Bist du gekommen, um uns zu vernichten?
  rationale: Das Perfekt ist im Deutschen für ein Kommen mit gegenwärtiger Relevanz natürlich; der finale Infinitiv wird mit „um ... zu“ wiedergegeben. „Vernichten“ trifft hier die starke Bedeutung von ἀπόλλυμι.
- source_word: οἶδά σε τίς εἶ
  choice: Ich weiß, wer du bist
  rationale: Dies ist die klare und natürliche deutsche Entsprechung der Identifizierungsaussage.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: der Heilige Gottes
  rationale: Die bestimmte Form wird als Titel wiedergegeben; der Genitiv „Gottes“ bewahrt die knappe Beziehung des griechischen Ausdrucks.
theological_decisions:
- issue: Christologischer Titel in der Erkenntnisrede des unreinen Geistes
  choice: der Heilige Gottes
  alternative: Gottes Heiliger
  rationale: Die Formulierung bleibt ein knapper Erkenntnistitel und wird nicht zu einem ausführlicheren dogmatischen Bekenntnis erweitert.
- issue: Plural in der Rede eines einzelnen unreinen Geistes
  choice: wir/uns
  alternative: ich/mich
  rationale: Der auffällige Wechsel zwischen dem Plural ἡμῖν/ἡμᾶς und dem Singular οἶδα wird unverändert bewahrt, ohne die Identität oder Zahl der mitgemeinten Wesen zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feindselige idiomatische Frage bleibt verständlich, der Vokativ wird deutlich markiert, und der christologische Titel sowie der auffällige Numeruswechsel werden ohne harmonisierende Erklärung bewahrt.
