id: MRK.1.28
reference: Mark 1:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: de
  text: Und die Nachricht über ihn verbreitete sich sofort überall in der ganzen Umgebung Galiläas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Kunde von ihm«; auch möglich: »sein Ruf«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: verbreitete sich
  rationale: Wörtlich bezeichnet das Verb ein Hinausgehen. Zusammen mit ἀκοή beschreibt es hier idiomatisch, wie eine Nachricht nach außen dringt und sich ausbreitet.
- source_word: ἀκοὴ
  choice: Nachricht
  rationale: Das Substantiv bezeichnet hier das, was über Jesus gehört und weitererzählt wurde. „Nachricht“ ist modernes, verständliches Deutsch und legt weniger als „Ruhm“ den Schwerpunkt auf seinen Ruf.
- source_word: αὐτοῦ
  choice: über ihn
  rationale: 'Der Genitiv gibt hier am natürlichsten den Inhalt der Nachricht an: Sie handelte von Jesus.'
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ gibt die für Markus charakteristische Unmittelbarkeit knapp und natürlich wieder.
- source_word: πανταχοῦ
  choice: überall
  rationale: Die direkte Entsprechung bewahrt die ausdrückliche Betonung der weiten Verbreitung.
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: in der ganzen Umgebung Galiläas
  rationale: Bei einem Verb des Sichverbreitens wird das griechische εἰς im Deutschen idiomatisch durch „in“ wiedergegeben. „Die ganze Umgebung Galiläas“ bewahrt sowohl den umfassenden Umfang als auch die geografische Zuordnung, ohne ein Gebiet außerhalb Galiläas festzulegen.
theological_decisions:
- issue: Bedeutung von ἀκοὴ αὐτοῦ
  choice: die Nachricht über ihn
  alternative: sein Ruf; die Kunde von ihm
  rationale: Gemeint ist zunächst das, was man über Jesus hörte. „Sein Ruf“ würde stärker eine bereits gefestigte Bekanntheit oder Berühmtheit ausdrücken, als der griechische Wortlaut verlangt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die leichte Häufung von „überall“ und „in der ganzen Umgebung“ bleibt erhalten, weil beide Umfangsangaben im griechischen Text ausdrücklich stehen.
