  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: de
  text: Als es Abend geworden und die Sonne untergegangen war, brachten sie[a] alle Kranken und die von Dämonen Besessenen[b] zu ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Imperfekt kann hier einen fortdauernden oder wiederholten Vorgang ausdrücken.
    reason: grammatical_aspect
  - marker: b
    text: 'Für „von Dämonen Besessene“ auch: Menschen, die unter dämonischem Einfluss standen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Übergang zum Abend. Die Formulierung ist im modernen Deutschen natürlich und bewahrt die zeitliche Funktion.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: und die Sonne untergegangen war
  rationale: Die mit ὅτε eingeleitete Zeitangabe präzisiert den Abend als Zeitpunkt nach Sonnenuntergang. Die koordinierte Form vermeidet im Deutschen eine schwerfällige Wiederholung von „als“, ohne die Aussage zu verändern.
- source_word: ἔφερον
  choice: brachten sie
  rationale: Das Imperfekt beschreibt einen andauernden oder wiederholten Vorgang. Das deutsche Präteritum ist hier erzählerisch natürlich; eine Fußnote weist auf den im Griechischen deutlicher hervortretenden Verlauf hin.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu. Das Pronomen bleibt erhalten, da der griechische Text den Namen Jesus nicht wiederholt.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: alle Kranken
  rationale: κακῶς ἔχειν ist eine idiomatische Bezeichnung für Kranksein. „Alle Kranken“ gibt den Sinn knapp, verständlich und mit der umfassenden Kraft von πάντας wieder.
- source_word: τοὺς δαιμονιζομένους
  choice: die von Dämonen Besessenen
  rationale: Die Formulierung bewahrt den ausdrücklichen Bezug auf dämonische Einwirkung und entspricht dem üblichen deutschen Sprachgebrauch, ohne die Aussage auf Krankheit zu reduzieren.
theological_decisions:
- issue: Wiedergabe von δαιμονιζομένους ohne Entmythologisierung oder übermäßige Präzisierung
  choice: die von Dämonen Besessenen
  alternative: die unter dämonischem Einfluss standen
  rationale: Die gewählte Formulierung nimmt den Bezug auf Dämonen als Bestandteil der Aussage ernst. Die Alternative ist sprachlich möglich, könnte die Stärke des griechischen Ausdrucks jedoch abschwächen.
- issue: Aspekt von ἔφερον
  choice: brachten sie, mit erläuternder Fußnote zum fortlaufenden Vorgang
  alternative: sie brachten immer wieder
  rationale: Das Imperfekt lässt einen andauernden oder wiederholten Vorgang erkennen. Im Haupttext bleibt die deutsche Erzählweise natürlich; die Fußnote bewahrt die aspektuelle Nuance, ohne „immer wieder“ als zwingende Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden eng verbundenen Zeitangaben wurden zu einer natürlichen deutschen Satzkonstruktion zusammengezogen. Die parallelen Personengruppen bleiben klar unterschieden; die Formulierung vermeidet sowohl eine medizinische Umdeutung dämonischer Einwirkung als auch zusätzliche Aussagen über deren genaue Art.
