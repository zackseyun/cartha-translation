id: MRK.1.4
reference: Mark 1:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: de
  text: Johannes der Täufer trat in der Wüste auf und verkündete eine Taufe der Umkehr zur Vergebung der Sünden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Johannes, der Taufende, trat in der Wüste auf und verkündete …“ Das griechische Partizip bezeichnet Johannes durch seine Tätigkeit des Taufens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: trat ... auf
  rationale: Die Wendung führt Johannes in die Erzählung ein. „Trat ... auf“ gibt diese markinische Erzählfunktion im Deutschen natürlich wieder.
- source_word: Ἰωάννης
  choice: Johannes
  rationale: Verwendet die im Deutschen etablierte Form des biblischen Namens.
- source_word: ὁ βαπτίζων
  choice: der Täufer
  rationale: Das substantivierte Partizip kennzeichnet Johannes durch seine Tauftätigkeit; „der Täufer“ ist die etablierte und natürliche deutsche Bezeichnung.
- source_word: ἐν τῇ ἐρήμῳ
  choice: in der Wüste
  rationale: „Wüste“ ist die übliche biblische Wiedergabe und bewahrt die geografischen sowie intertextuellen Bezüge, ohne eine Sandwüste festzulegen.
- source_word: κηρύσσων
  choice: verkündete
  rationale: „Verkündete“ gibt den öffentlichen, heroldartigen Charakter des Verbs wieder und fügt sich natürlich in den deutschen Satz.
- source_word: βάπτισμα
  choice: Taufe
  rationale: „Taufe“ ist die sachlich und sprachlich etablierte Entsprechung im gegebenen Kontext.
- source_word: μετανοίας
  choice: der Umkehr
  rationale: „Umkehr“ bezeichnet verständlich eine grundlegende innere und praktische Hinwendung und vermeidet die mögliche Verengung von „Buße“ auf Reue oder Bußleistung.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: zur Vergebung der Sünden
  rationale: Die Formulierung gibt Ziel beziehungsweise Ergebnis wieder, ohne das genaue Verhältnis von Taufe, Umkehr und Vergebung dogmatisch festzulegen.
theological_decisions:
- issue: Verhältnis von Taufe, Umkehr und Sündenvergebung
  choice: „eine Taufe der Umkehr zur Vergebung der Sünden“
  alternative: „eine Taufe als Zeichen der Umkehr“ oder „eine Taufe, die durch Umkehr Vergebung bewirkt“
  rationale: Die griechische Konstruktion verbindet Taufe, Umkehr und Vergebung, bestimmt aber nicht eindeutig, ob die Taufe instrumental, symbolisch oder deklarativ zu verstehen ist. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Form „trat ... auf und verkündete“ löst das griechische Partizip idiomatisch auf. Der etablierte Titel „der Täufer“ steht im Haupttext; die wörtlichere Tätigkeitsbezeichnung wird in der Fußnote bewahrt.
