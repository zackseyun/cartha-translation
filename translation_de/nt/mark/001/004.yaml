  source_fidelity: 'Der Text gibt alle Elemente des griechischen Satzes wieder: die narrative Einführung (ἐγένετο), Johannes’ Kennzeichnung als Täufer, den Ort in der Wüste, das Verkündigen sowie „Taufe der Umkehr zur Vergebung der Sünden“. Die koordinierte deutsche Formulierung löst das griechische Partizip idiomatisch auf, ohne den Sinn zu verändern. „Zur“ wahrt die im εἰς-Ausdruck vorhandene Ziel-/Ergebnisoffenheit.'
  naturalness: „Johannes der Täufer trat in der Wüste auf und verkündete eine Taufe der Umkehr zur Vergebung der Sünden“ ist würdiges, gut verständliches modernes Standarddeutsch. „Taufe der Umkehr“ ist leicht gehoben, aber für den biblischen Register angemessen und präzise.
  terminology: „Johannes der Täufer“, „Wüste“, „Taufe“, „Umkehr“, „Vergebung“ und „Sünden“ sind fachlich wie sprachlich geeignete Entsprechungen. „Umkehr“ gibt μετάνοια verständlich wieder, ohne eine spezifische Lehre über das Verhältnis von Taufe und Vergebung festzulegen. Die Fußnote bietet mit „der Taufende“ eine sachgerechte, näher am Partizip liegende Alternative.
