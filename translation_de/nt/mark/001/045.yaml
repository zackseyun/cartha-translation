  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: de
  text: Doch nachdem er weggegangen war, begann er, viel davon zu verkünden und die Nachricht weithin zu verbreiten. Deshalb konnte Jesus nicht mehr öffentlich in eine Stadt hineingehen, sondern hielt sich draußen an abgelegenen Orten auf. Und von überall her kamen die Menschen zu ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: die Sache überall zu verkünden
  rationale: Die Wendung bedeutet hier, dass der Mann ausgiebig beziehungsweise weithin verkündete. „Überall“ gibt die Reichweite im Kontext natürlich wieder; „die Sache“ ergänzt das im Griechischen nicht ausdrücklich genannte, aber aus dem Zusammenhang erkennbare Objekt.
- source_word: διαφημίζειν τὸν λόγον
  choice: die Nachricht zu verbreiten
  rationale: λόγος bezeichnet hier am natürlichsten den Bericht beziehungsweise die Nachricht über das Geschehene; „verbreiten“ trifft διαφημίζειν idiomatisch.
- source_word: φανερῶς
  choice: öffentlich
  rationale: Bezeichnet ein offenes, für alle sichtbares Auftreten im Gegensatz zum Aufenthalt außerhalb der Ortschaften.
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: an einsamen Orten
  rationale: ἐρήμοις meint hier unbewohnte oder abgelegene Orte, nicht zwingend Wüsten im geografischen Sinn.
- source_word: ἤρχοντο ... πάντοθεν
  choice: von überall her kamen die Menschen
  rationale: Das unbestimmte Pluralverb wird im Deutschen natürlich mit „die Menschen“ wiedergegeben; der fortlaufende Zustrom bleibt durch die Verbform im Kontext erkennbar.
theological_decisions:
- issue: Bezugswort von αὐτόν in „μηκέτι αὐτὸν δύνασθαι“
  choice: Jesus ausdrücklich nennen
  alternative: „er“
  rationale: Grammatisch verweist das Pronomen im Erzählzusammenhang auf Jesus. Die ausdrückliche Nennung verhindert im Deutschen eine mögliche Verwechslung mit dem geheilten Mann, ohne eine theologische Deutung hinzuzufügen.
- issue: Inhalt der Verkündigung des geheilten Mannes
  choice: „die Sache“ und „die Nachricht“
  alternative: „das Wort“ oder ausdrückliche Benennung der Heilung
  rationale: Der griechische Text lässt den genauen Inhalt zunächst unausgesprochen und nennt dann τὸν λόγον. Die Übersetzung bewahrt diese allgemeine Formulierung, statt eine spezifische Botschaft dogmatisch festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bewahrt Ursache, Folge und den abschließenden Zustrom der Menschen. Keine Fußnoten erforderlich.
