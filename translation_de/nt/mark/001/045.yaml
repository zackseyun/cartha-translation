review_pass:
  verdict: revise
  source_fidelity: 'Die Folgebeziehung, die ausdrückliche Bezugnahme auf Jesus, sein Aufenthalt außerhalb der Städte und der Zustrom von allen Seiten sind zutreffend wiedergegeben. „Die Sache überall zu verkünden“ ist jedoch keine genaue Entsprechung von κηρύσσειν πολλὰ: πολλὰ bezeichnet hier die Ausführlichkeit bzw. Intensität der Verkündigung, nicht ausdrücklich eine räumliche Verteilung, und „die Sache“ ist im Deutschen unnötig unbestimmt. Die zweite Wendung kann den λόγος angemessen als „Nachricht“ wiedergeben.'
  naturalness: Der Text ist insgesamt flüssiges modernes Standarddeutsch. „Viel davon zu verkünden“ bewahrt die im Griechischen nur kontextuell erschließbare Referenz, klingt idiomatischer als die objektlose Konstruktion und vermeidet die zusätzliche Ortsangabe „überall“. „Abgelegene Orte“ ist für ἐρήμοι τόποι natürlich und weniger missverständlich als „einsame Orte“.
  terminology: „verkünden“ entspricht κηρύσσειν; „Nachricht weithin verbreiten“ gibt διαφημίζειν τὸν λόγον verständlich und ohne unangemessene theologische Festlegung wieder. „Öffentlich“, „Stadt“ und „von überall her“ sind passend.
  issues:
  - severity: medium
    issue: „die Sache überall zu verkünden“ für κηρύσσειν πολλὰ
    rationale: Die Formulierung fügt mit „überall“ eine räumliche Aussage hinzu, die πολλὰ nicht zwingend enthält, und ersetzt die elliptische, aber kontextuell verständliche Referenz durch das sehr vage „die Sache“. Eine Formulierung mit „viel davon“ bildet die Ausführlichkeit und die Ellipse besser ab.
  - severity: low
    issue: „einsamen Orten“ für ἐρήμοις τόποις
    rationale: „Einsam“ kann im Deutschen primär emotional verstanden werden. „Abgelegen“ bezeichnet klarer unbewohnte bzw. menschenleere Orte, ohne eine geografische Wüste vorauszusetzen.
  revised_text: Doch nachdem er weggegangen war, begann er, viel davon zu verkünden und die Nachricht weithin zu verbreiten. Deshalb konnte Jesus nicht mehr öffentlich in eine Stadt hineingehen, sondern hielt sich draußen an abgelegenen Orten auf. Und von überall her kamen die Menschen zu ihm.
  revised_footnotes: []
  revision_rationale: Die Revision beseitigt die nicht im griechischen Text festgelegte räumliche Nuance von „überall“ bei κηρύσσειν πολλὰ und ersetzt „die Sache“ durch die idiomatische, kontextbezogene Ellipse „davon“. Zugleich wird ἐρήμοι τόποις mit „abgelegenen Orten“ präziser und natürlich wiedergegeben. Fußnoten sind nicht erforderlich.
