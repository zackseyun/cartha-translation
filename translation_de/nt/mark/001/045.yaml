revisions:
- from: Doch nachdem er weggegangen war, begann er, die Sache überall zu verkünden und die Nachricht zu verbreiten. Deshalb konnte Jesus nicht mehr öffentlich in eine Stadt hineingehen, sondern hielt sich draußen an einsamen Orten auf. Und von überall her kamen die Menschen zu ihm.
  to: Doch nachdem er weggegangen war, begann er, viel davon zu verkünden und die Nachricht weithin zu verbreiten. Deshalb konnte Jesus nicht mehr öffentlich in eine Stadt hineingehen, sondern hielt sich draußen an abgelegenen Orten auf. Und von überall her kamen die Menschen zu ihm.
  rationale: Die Revision beseitigt die nicht im griechischen Text festgelegte räumliche Nuance von „überall“ bei κηρύσσειν πολλὰ und ersetzt „die Sache“ durch die idiomatische, kontextbezogene Ellipse „davon“. Zugleich wird ἐρήμοι τόποις mit „abgelegenen Orten“ präziser und natürlich wiedergegeben. Fußnoten sind nicht erforderlich.
