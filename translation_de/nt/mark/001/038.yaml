  source_fidelity: 'Der Satzbau und die zentralen Bedeutungen werden insgesamt zutreffend wiedergegeben: Der hortative Aufruf, die benachbarten κωμοπόλεις, der Zweck des Predigens und die begründende Schlussaussage bleiben erhalten. „Ausgezogen“ ist für ἐξῆλθον jedoch im heutigen Standarddeutsch missverständlich und stilistisch unnatürlich; es kann besonders an Auszug aus einer Wohnung oder an militärisches Ausziehen denken lassen.'
  naturalness: „Lasst uns anderswohin gehen“ und „benachbarten kleineren Ortschaften“ sind verständlich und registergerecht. „Dazu bin ich aufgebrochen“ ist für die abschließende Aussage idiomatischer als „bin ich ausgezogen“ und wahrt zugleich deren offene Reichweite. Ein Komma vor „denn“ ist im deutschen Fließtext natürlicher als ein Semikolon.
  terminology: „Predigen“ ist für κηρύσσω im Kontext angemessen. „Kleinere Ortschaften“ gibt die zwischen Dorf und Stadt liegende, nicht scharf festgelegte Größe von κωμοπόλεις sachgerecht wieder. Die Fußnote erläutert dies sinnvoll.
