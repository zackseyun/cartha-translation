    rationale: Die Formulierung ist im modernen Standarddeutsch mehrdeutig und markiert (Wohnung verlassen, militärisch ausziehen) und klingt hier weniger natürlich. „bin ich aufgebrochen“ gibt die Bewegung aus dem bisherigen Ort idiomatisch wieder, ohne die umstrittene Reichweite der Aussage dogmatisch festzulegen.
  - severity: low
    issue: Semikolon vor „denn“
    rationale: Nicht falsch, aber ein Komma entspricht der üblichen deutschen Verbindung einer begründenden denn-Konstruktion und liest sich flüssiger.
