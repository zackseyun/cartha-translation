  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Lasst uns anderswohin gehen, zu den benachbarten kleineren Ortschaften[a], damit ich auch dort predige, denn dazu bin ich aufgebrochen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet kleinere Siedlungen, die zwischen Dörfern und Städten eingeordnet werden können.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „denn zu diesem Zweck bin ich herausgekommen.“ Die Wendung kann sich auf das Verlassen des bisherigen Ortes beziehen oder weiter gefasst auf Jesu Aufbruch zum Predigen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: Lasst uns … gehen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird im modernen Deutschen natürlich als gemeinsame Aufforderung wiedergegeben.
- source_word: ἀλλαχοῦ
  choice: anderswohin
  rationale: Das Adverb bezeichnet das Ziel einer Bewegung an einen anderen Ort; „anderswohin“ ist präzise und idiomatisch.
- source_word: τὰς ἐχομένας κωμοπόλεις
  choice: die benachbarten kleineren Ortschaften
  rationale: ἐχόμενος bezeichnet hier nahe beziehungsweise angrenzende Orte. κωμόπολις meint eine kleinere Siedlung mit einem gewissen städtischen Charakter; „kleinere Ortschaften“ vermeidet eine zu starre Einordnung als Dorf oder Stadt.
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: damit ich auch dort predige
  rationale: „damit“ bewahrt den Zwecksinn von ἵνα; „predigen“ gibt κηρύσσω im Kontext öffentlicher Verkündigung klar und geläufig wieder, während „auch dort“ die Stellung von καὶ ἐκεῖ angemessen abbildet.
- source_word: εἰς τοῦτο
  choice: denn dazu
  rationale: Die knappe deutsche Wendung erhält den erklärenden Zwecksinn, ohne ihn näher auszudeuten.
- source_word: ἐξῆλθον
  choice: bin ich ausgezogen
  rationale: „ausziehen“ bewahrt die Bewegung aus einem Ausgangsort und lässt offen, ob nur das Verlassen des gegenwärtigen Ortes oder ein weiter gefasster Auftrag gemeint ist.
- source_word: λέγει αὐτοῖς
  choice: er sagte zu ihnen
  rationale: Das griechische historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
theological_decisions:
- issue: Reichweite von ἐξῆλθον
  choice: „bin ich ausgezogen“ ohne nähere Angabe des Ausgangspunktes
  alternative: „bin ich herausgekommen“ oder „bin ich aufgebrochen“
  rationale: Die Formulierung kann sich unmittelbar auf Jesu Verlassen des bisherigen Ortes beziehen, im Zusammenhang aber auch einen umfassenderen Zweck seines öffentlichen Auftretens anklingen lassen. Der Text legt keine ausdrückliche Aussage über seine himmlische Herkunft fest; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Kleinere Ortschaften“ ist im Haupttext verständlicher als das künstliche „Dorfstädte“. Das semantisch offene „ausgezogen“ vermeidet sowohl eine rein lokale als auch eine ausdrücklich dogmatische Festlegung.
