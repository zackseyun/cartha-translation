source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: de
  text: 'Und er verkündete: »Nach mir kommt einer, der stärker ist als ich,[a] dessen ich nicht würdig bin, mich zu bücken und den Riemen seiner Sandalen zu lösen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der mächtiger ist als ich«; traditioneller: »der Mächtigere als ich«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: verkündete
  rationale: Das Imperfekt bezeichnet die fortdauernde oder wiederholte Verkündigung des Johannes; „verkündete“ bewahrt zugleich den öffentlichen, heroldartigen Charakter des Verbs, ohne unnötig kirchensprachlich zu wirken.
- source_word: λέγων
  choice: Doppelpunkt vor der direkten Rede
  rationale: Das begleitende Partizip leitet den Inhalt der Verkündigung ein. Im natürlichen Deutschen erfüllt der Doppelpunkt diese Funktion, ohne das schwerfällige „indem er sagte“.
- source_word: Ἔρχεται … ὀπίσω μου
  choice: Nach mir kommt
  rationale: Die Stellung von „nach mir“ bewahrt sowohl die zeitliche Abfolge als auch den möglichen Nachfolge- beziehungsweise Rangbezug; das Präsens vermittelt die Unmittelbarkeit der Ankündigung.
- source_word: ὁ ἰσχυρότερός μου
  choice: einer, der stärker ist als ich
  rationale: Der substantivierte Komparativ wird in klarem, idiomatischem Deutsch wiedergegeben. „Stärker“ ist die unmittelbare Bedeutung; „mächtiger“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: ἱκανὸς
  choice: es wert
  rationale: Im Zusammenhang einer erniedrigenden Sklaventätigkeit bezeichnet der Ausdruck vor allem persönliche Unwürdigkeit gegenüber dem Kommenden, nicht bloß fehlende Fähigkeit.
- source_word: κύψας λῦσαι
  choice: mich zu bücken und … zu lösen
  rationale: Die koordinierte deutsche Infinitivkonstruktion gibt die mit dem Lösen verbundene beziehungsweise ihm vorausgehende Körperbewegung natürlich wieder.
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: den Riemen seiner Sandalen
  rationale: „Riemen“ bezeichnet den ledernen Verschluss präzise und verständlich; „Sandalen“ entspricht dem antiken Schuhwerk.
theological_decisions:
- issue: Grad und Art der Selbsterniedrigung des Johannes
  choice: Ich bin es nicht wert
  alternative: Ich bin nicht geeignet / nicht imstande
  rationale: Der soziale Kontext des Lösens von Sandalen hebt den tiefen Rangunterschied und die Unwürdigkeit des Johannes hervor. Da ἱκανός auch Eignung oder Hinlänglichkeit ausdrücken kann, wird diese lexikalische Offenheit in einer Fußnote genannt.
- issue: Bedeutung von ὀπίσω μου
  choice: Nach mir
  alternative: hinter mir
  rationale: „Nach mir“ bewahrt die naheliegende zeitliche Abfolge des Auftretens, ohne einen weitergehenden theologischen Rang- oder Nachfolgebegriff ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig formuliert, ohne die öffentliche Verkündigung, die unmittelbare Erwartung oder die starke Demut des Johannes abzuschwächen.
