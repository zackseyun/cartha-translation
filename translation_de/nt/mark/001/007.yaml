review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des griechischen Textes ist weitgehend getroffen: Johannes verkündigt fortlaufend, der Kommende folgt ihm und ist ihm überlegen; die Geste des Sichbückens und Lösens des Sandalenriemens wird angemessen wiedergegeben. Allerdings ist die durch οὗ eingeleitete Relativkonstruktion im Deutschen besser unmittelbar an „der“ anzuschließen, statt sie als neuen Hauptsatz zu formulieren. So bleibt der Bezug enger und der Vergleich mit dem Kommenden klarer.'
  naturalness: Der Entwurf ist verständlich und modernes Standarddeutsch. „Nach mir kommt einer, der stärker ist als ich“ ist idiomatisch. Die Satzfolge „Ich bin es nicht wert“ ist zwar möglich, aber die engere Relativkonstruktion ist zugleich natürlicher für die vorliegende griechische Struktur.
  terminology: '„verkündete“, „stärker“, „Riemen“ und „Sandalen“ sind sachgerecht. Die Fußnote zu ἱκανός sollte „geeignet“ nicht als gleichwertige Hauptnuance darstellen: Im Kontext ist „würdig/wert“ die treffende Wiedergabe, während „fähig/imstande“ als lexikalische Alternative möglich bleibt. „Mächtiger“ ist als traditionelle bzw. gehobenere Alternative vertretbar.'
  issues:
  - severity: low
    issue: Relativsatzbezug von οὗ
    rationale: οὗ bezieht sich unmittelbar auf den Kommenden. Die Formulierung als Relativsatz („dessen ich nicht würdig bin“) bildet diesen Zusammenhang präziser ab als ein abgetrennter Hauptsatz.
  - severity: low
    issue: Fußnote b formuliert die Alternativen zu stark
    rationale: „Nicht geeignet“ klingt im Deutschen primär nach sachlicher Eignung und erfasst die kontextuelle Selbsterniedrigung weniger gut. „Nicht würdig“ und, als mögliche lexikalische Alternative, „nicht imstande“ sind angemessener.
  revised_text: 'Und er verkündete: »Nach mir kommt einer, der stärker ist als ich,[a] dessen ich nicht würdig bin, mich zu bücken und den Riemen seiner Sandalen zu lösen.«'
