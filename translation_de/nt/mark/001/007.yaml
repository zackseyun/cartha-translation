revisions:
- from: 'Und er verkündete: »Nach mir kommt einer, der stärker ist als ich.[a] Ich bin es nicht wert,[b] mich zu bücken und den Riemen seiner Sandalen zu lösen.«'
  to: 'Und er verkündete: »Nach mir kommt einer, der stärker ist als ich,[a] dessen ich nicht würdig bin, mich zu bücken und den Riemen seiner Sandalen zu lösen.«'
  rationale: Die Revision bindet die Aussage über die eigene Unwürdigkeit als Relativsatz an den Kommenden zurück und gibt damit die Syntax und den Bezug von οὗ klarer wieder. Die koordinierte Infinitivgruppe „mich zu bücken und … zu lösen“ bleibt als natürliche Wiedergabe von κύψας λῦσαι erhalten. Fußnote b wird sprachlich und semantisch präzisiert.
