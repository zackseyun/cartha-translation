  text: καὶ ⸀εὐθὺς ἀπῆλθεν ἀπ’ αὐτοῦ ἡ λέπρα, καὶ ἐκαθαρίσθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/042.yaml
  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: de
  text: Und sofort wich der Aussatz von ihm, und er wurde rein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er wurde gereinigt“. Das Verb kann hier sowohl körperliche Heilung als auch die Wiederherstellung kultischer Reinheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Das Wort bezeichnet bei Markus regelmäßig Unmittelbarkeit und Dringlichkeit; „sofort“ ist im modernen Deutsch natürlich und prägnant.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: verschwand … von ihm
  rationale: Wörtlich geht der Aussatz „von ihm weg“. Die Formulierung „verschwand … von ihm“ gibt den Vorgang im Deutschen verständlich wieder und bewahrt durch „von ihm“ die Struktur des griechischen Ausdrucks.
- source_word: ἡ λέπρα
  choice: der Aussatz
  rationale: λέπρα bezeichnet im biblischen Sprachgebrauch verschiedene schwere Hautkrankheiten und ist nicht auf die moderne Hansen-Krankheit beschränkt. „Aussatz“ ist die etablierte biblische Bezeichnung, darf jedoch nicht medizinisch verengt verstanden werden.
- source_word: ἐκαθαρίσθη
  choice: er wurde rein
  rationale: Das Passiv von καθαρίζω umfasst hier sowohl die körperliche Befreiung von der Hautkrankheit als auch die Wiederherstellung kultischer Reinheit. „Wurde rein“ erhält diese doppelte Bedeutung natürlicher als „wurde gereinigt“.
theological_decisions:
- issue: Verhältnis von körperlicher Heilung und kultischer Reinheit in ἐκαθαρίσθη
  choice: „er wurde rein“
  alternative: „er wurde geheilt“ oder „er wurde gereinigt“
  rationale: „Geheilt“ würde die kultische Dimension ausblenden; „gereinigt“ könnte im Deutschen eine äußerlich vorgenommene Säuberung nahelegen. „Wurde rein“ bewahrt beide Bedeutungsebenen, ohne den theologischen Gehalt weiter auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Aussatz“ wird als etablierter biblischer Begriff verwendet; die Fußnote erläutert die doppelte körperliche und kultische Bedeutung von „rein werden“.
