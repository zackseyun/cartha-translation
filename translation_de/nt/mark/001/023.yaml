  text: καὶ ⸀εὐθὺς ἦν ἐν τῇ συναγωγῇ αὐτῶν ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ καὶ ἀνέκραξεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/023.yaml
  text: And immediately there was in their synagogue a man with an unclean spirit[a], and he cried out[b],
translation:
  language: de
  text: Und sofort war in ihrer Synagoge ein Mann mit einem unreinen Geist[a], und er schrie auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in einem unreinen Geist“. Die Wiedergabe „von einem unreinen Geist besessen“ ist eine deutende Erweiterung der griechischen Formulierung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sogleich
  rationale: „Sogleich“ bewahrt das für Markus charakteristische schnelle Erzähltempo und klingt zugleich würdig und verständlich.
- source_word: ἦν
  choice: war
  rationale: In Verbindung mit dem unbestimmten Subjekt gibt „war … ein Mann“ die existenzielle Aussage des Griechischen knapp und natürlich wieder.
- source_word: συναγωγῇ αὐτῶν
  choice: ihrer Synagoge
  rationale: „Synagoge“ bezeichnet hier eindeutig den jüdischen Versammlungs- und Gottesdienstort; αὐτῶν wird als „ihrer“ ausdrücklich bewahrt.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Im konkreten Erzählzusammenhang bezeichnet das maskuline Substantiv eine männliche Einzelperson.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: mit einem unreinen Geist
  rationale: Die idiomatische deutsche Fassung macht die Verbindung zwischen dem Mann und dem Geist verständlich, ohne mit „besessen“ eine stärkere Deutung in den Haupttext einzutragen. Die wörtlichere Konstruktion wird in der Fußnote genannt.
- source_word: ἀκαθάρτῳ
  choice: unrein
  rationale: „Unrein“ bewahrt die religiösen und moralischen Bedeutungsanklänge des griechischen Ausdrucks und entspricht dem etablierten Sprachgebrauch in diesem Zusammenhang.
- source_word: ἀνέκραξεν
  choice: er schrie laut auf
  rationale: Das Verb bezeichnet einen lauten Ausruf. „Schrie laut auf“ gibt seine Intensität natürlich wieder, ohne die Gemütslage näher festzulegen.
theological_decisions:
- issue: Wiedergabe der dämonischen Bedrängnis in ἐν πνεύματι ἀκαθάρτῳ
  choice: mit einem unreinen Geist
  alternative: in einem unreinen Geist; von einem unreinen Geist besessen
  rationale: Die griechische Präpositionalfügung lautet formal „in einem unreinen Geist“, ist im Deutschen jedoch schwer verständlich. „Mit einem unreinen Geist“ wahrt die Aussage einer engen Verbindung, ohne durch „besessen“ Art oder Grad dieser Einwirkung über den Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die markinische Unmittelbarkeit bleibt durch „sogleich“ erhalten; die ungewöhnliche Geistaussage wird im Haupttext idiomatisch und in der Fußnote formal genauer wiedergegeben.
