source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: de
  text: Ich habe euch mit Wasser getauft; er aber wird euch mit dem Heiligen Geist taufen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Heiligen Geist“. Die griechische Präposition kann hier auf beide Arten wiedergegeben werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen bewahrt den betonten Gegensatz zu αὐτός im zweiten Satzteil.
- source_word: ἐβάπτισα … βαπτίσει
  choice: habe … getauft; wird … taufen
  rationale: „Taufen“ ist im Deutschen die geläufige Wiedergabe von βαπτίζω und erhält hier den rituellen sowie intertextuellen Gehalt, ohne die Art der Handlung auf „untertauchen“ einzuengen. Aorist und Futur werden ihrer Funktion entsprechend wiedergegeben.
- source_word: ὑμᾶς
  choice: euch
  rationale: „Euch“ gibt den Plural der direkten Anrede eindeutig wieder.
- source_word: ὕδατι
  choice: mit Wasser
  rationale: Der Dativ kann Mittel oder Bereich bezeichnen; „mit Wasser“ ist natürliches Deutsch und bildet eine klare Parallele zur folgenden Geist-Taufe.
- source_word: αὐτὸς δὲ
  choice: er aber
  rationale: Die nachgestellte Formulierung bewahrt sowohl den betonten Subjektwechsel als auch den von δέ markierten Gegensatz.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: mit dem Heiligen Geist
  rationale: „Mit dem Heiligen Geist“ ist im Deutschen idiomatisch und lässt sich instrumental verstehen. Die ebenfalls mögliche räumlich-sphärische Wiedergabe „im Heiligen Geist“ wird in der Fußnote erhalten.
theological_decisions:
- issue: Bezeichnet πνεύματι ἁγίῳ den göttlichen Heiligen Geist oder eine unpersönliche heilige Kraft?
  choice: dem Heiligen Geist
  alternative: heiligem Geist / einer heiligen Geisteskraft
  rationale: Im Zusammenhang von Markus bezeichnet die Wendung am natürlichsten den göttlichen Heiligen Geist. Der bestimmte Artikel ist im Deutschen idiomatisch erforderlich, obwohl das Griechische hier artikellos ist; zusätzliche dogmatische Einzelheiten werden nicht eingetragen.
- issue: Wie ist ἐν vor πνεύματι ἁγίῳ wiederzugeben?
  choice: mit dem Heiligen Geist
  alternative: im Heiligen Geist
  rationale: ἐν mit Dativ kann hier Mittel oder Sphäre ausdrücken. Der Haupttext verwendet die natürliche instrumentale Formulierung, während die Fußnote die sachlich bedeutsame Alternative bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das Semikolon macht den knappen Gegensatz zwischen Johannes und dem Kommenden deutlich; „er aber“ erhält die Hervorhebung des griechischen αὐτός.
