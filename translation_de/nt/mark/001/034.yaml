    issue: Unnötig technische Wortwahl bei „verschiedenartigen Krankheiten“
    rationale: ποικίλαις νόσοις bezeichnet unterschiedliche beziehungsweise vielfältige Krankheiten. „Verschiedenen Krankheiten“ ist im modernen Deutsch idiomatischer und gibt die Bedeutung ohne stilistische Überhöhung wieder.
  - severity: low
    issue: Die Formulierung „Wörtlich steht“ in der Fußnote ist etwas zu stark
    rationale: „Weil sie ihn kannten“ ist eine sehr nahe Übersetzung, aber ὅτι und ᾔδεισαν werden dabei bereits idiomatisch deutsch gefasst. „Im Griechischen steht knapp“ ist präziser.
  revised_text: Und er heilte viele, die an verschiedenen Krankheiten litten, und trieb viele Dämonen aus. Er ließ die Dämonen nicht reden, weil sie ihn kannten.[a]
