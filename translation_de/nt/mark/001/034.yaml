  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des griechischen Textes zuverlässig wieder: Jesus heilt viele Kranke, treibt viele Dämonen aus und hindert sie am Reden, weil sie ihn kannten. Die knappe Formulierung der Erkenntnis der Dämonen wird nicht unzulässig christologisch ausgeweitet. Das Imperfekt ἤφιεν wird mit „ließ ... nicht“ im erzählerischen Zusammenhang angemessen wiedergegeben.'
  naturalness: Der Text ist insgesamt flüssiges modernes Standarddeutsch. „Verschiedenartigen Krankheiten“ ist zwar verständlich, wirkt jedoch unnötig fachsprachlich und weniger natürlich als „verschiedenen Krankheiten“.
  terminology: „heilte“, „trieb ... aus“ und „Dämonen“ sind im neutestamentlichen Erzählkontext treffende, etablierte deutsche Wiedergaben. „Sie ihn kannten“ bewahrt die Kürze von ᾔδεισαν αὐτόν; die Fußnote kennzeichnet die idiomatisch interpretierende Alternative angemessen.
  issues:
