source:
  edition: SBLGNT
  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: de
  text: Und er heilte viele, die an verschiedenen Krankheiten litten, und trieb viele Dämonen aus. Er ließ die Dämonen nicht reden, weil sie ihn kannten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil sie wussten, wer er war“. Im Griechischen steht knapp: „weil sie ihn kannten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: heilte
  rationale: θεραπεύω bezeichnet hier das Heilen von Krankheiten; „heilte“ ist im Deutschen natürlich, präzise und im Erzählzusammenhang angemessen.
- source_word: πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις
  choice: viele, die an verschiedenartigen Krankheiten litten
  rationale: Das Idiom κακῶς ἔχω wird sinngemäß als Kranksein wiedergegeben. „An … Krankheiten litten“ verbindet es idiomatisch mit dem instrumentalen beziehungsweise ursächlichen Dativ ποικίλαις νόσοις; „verschiedenartig“ bewahrt den Gedanken der Vielfalt.
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: trieb viele Dämonen aus
  rationale: ἐκβάλλω beschreibt in diesem Zusammenhang das gewaltsame Entfernen beziehungsweise Austreiben; „austreiben“ ist die natürliche deutsche Entsprechung.
- source_word: οὐκ ἤφιεν λαλεῖν
  choice: ließ … nicht reden
  rationale: Die Konstruktion ἀφίημι mit Infinitiv bedeutet hier „zulassen/erlauben“. Das Imperfekt bezeichnet das fortdauernde Verhindern innerhalb der Szene; die idiomatische Formulierung „ließ … nicht reden“ wahrt dies ohne unnötige Schwerfälligkeit.
- source_word: ὅτι
  choice: weil
  rationale: ὅτι leitet hier am natürlichsten den Grund für das Schweigegebot ein.
- source_word: ᾔδεισαν αὐτόν
  choice: sie ihn kannten
  rationale: Der griechische Text hat lediglich das Pronomen αὐτόν als Objekt. Die knappe Wiedergabe vermeidet eine nicht ausdrücklich formulierte Erklärung ihrer Erkenntnis.
theological_decisions:
- issue: Ob die Erkenntnis der Dämonen als ausdrückliche christologische Identifikation entfaltet werden soll
  choice: weil sie ihn kannten
  alternative: weil sie wussten, wer er war
  rationale: Der Ausgangstext sagt wörtlich nur, dass sie ihn kannten. Die gewählte Form bewahrt diese Kürze und die damit verbundene theologische Spannung, statt aus dem weiteren Kontext eine bestimmte Identitätsaussage einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der lange griechische Satz wird zur besseren deutschen Lesbarkeit nach dem Austreiben der Dämonen geteilt; die inhaltlichen Verknüpfungen bleiben erhalten.
