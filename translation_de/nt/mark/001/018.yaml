  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: de
  text: Und sofort ließen sie die Netze zurück und folgten ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache koordinierende Konjunktion bewahrt den für Markus typischen Erzählfluss, ohne eine zusätzliche zeitliche Deutung einzutragen.
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ ist eine natürliche, moderne Wiedergabe der von εὐθύς ausgedrückten Unmittelbarkeit und Dringlichkeit.
- source_word: ἀφέντες
  choice: ließen … zurück
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die der Haupthandlung vorausgeht. Die deutsche finite Koordination gibt dies idiomatisch wieder; „verließen“ könnte sich eher auf einen Ort beziehen, „gaben auf“ wäre zu stark.
- source_word: τὰ δίκτυα
  choice: die Netze
  rationale: Der bestimmte Artikel wird direkt wiedergegeben. Der Kontext zeigt zwar, dass es ihre Netze waren, doch das Possessivpronomen steht nicht ausdrücklich im Griechischen.
- source_word: ἠκολούθησαν
  choice: folgten
  rationale: Die Wiedergabe bewahrt sowohl die konkrete Bewegung hinter Jesus her als auch den im Kontext entstehenden Jüngerschaftssinn, ohne ihn erklärend auszuweiten.
- source_word: αὐτῷ
  choice: ihm
  rationale: Das Pronomen verweist im unmittelbaren Kontext auf Jesus und wird entsprechend als Pronomen beibehalten.
theological_decisions:
- issue: Jüngerschaftsnuance von ἠκολούθησαν
  choice: „folgten ihm“ ohne erklärende Erweiterung
  alternative: „wurden seine Jünger“ oder „schlossen sich ihm an“
  rationale: Das Verb trägt im Kontext bereits eine konkrete und zugleich theologische Bedeutung. Eine Erweiterung würde die entstehende Jüngerschaft stärker ausdeuten, als der Wortlaut es tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe Satzbau und das einleitende „Und“ erhalten Markus’ zügigen Erzählrhythmus.
