source:
  edition: SBLGNT
  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: de
  text: Und sie staunten sehr über seine Lehre, denn er lehrte sie wie einer, der Vollmacht hat, und nicht wie die Schriftgelehrten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: waren außer sich vor Staunen
  rationale: Das Imperfekt bezeichnet ihre anhaltende Reaktion; die Wendung gibt die starke Erschütterung und das Staunen des Verbs im heutigen Deutsch wieder.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: über seine Lehre
  rationale: „Lehre“ bezeichnet hier das von Jesus Gelehrte beziehungsweise seine Art zu lehren; „über“ gibt den Anlass ihrer Reaktion natürlich wieder.
- source_word: ἦν γὰρ διδάσκων
  choice: denn er lehrte sie
  rationale: Das natürliche deutsche Präteritum gibt den im Erzählzusammenhang fortdauernden Lehrvorgang wieder, ohne die griechische periphrastische Konstruktion unidiomatisch nachzubilden.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: wie einer, der Vollmacht hat
  rationale: Die Formulierung bewahrt den durch ὡς eingeführten Vergleich und gibt ἐξουσία mit dem im biblischen Kontext treffenden „Vollmacht“ wieder.
- source_word: γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Dies ist die etablierte und sachlich genaue deutsche Bezeichnung für die jüdischen Schrift- und Gesetzesexperten.
theological_decisions:
- issue: Wesen der Vollmacht Jesu im Gegensatz zu den Schriftgelehrten
  choice: Die Aussage wird beschreibend als „wie einer, der Vollmacht hat“ wiedergegeben.
  alternative: „mit göttlicher Vollmacht“
  rationale: Der Vers hebt Jesu Vollmacht hervor, bestimmt deren Ursprung oder Wesen in diesem Satz aber nicht ausdrücklich. Die Übersetzung vermeidet daher eine dogmatische Erweiterung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Vergleich, klingt aber natürlich. „Vollmacht“ und „Schriftgelehrte“ sind verständliche, im deutschen Bibelsprachgebrauch etablierte Begriffe.
