translation:
  language: de
  text: Und die ganze Stadt war vor der Tür[a] versammelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zur Tür“. Die griechische Präposition kann stärker richtungsbezogen wiedergegeben werden; im Zusammenhang ist die am Hauseingang versammelte Menge gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν … ἐπισυνηγμένη
  choice: hatte sich … versammelt
  rationale: Die Verbindung aus Imperfekt von εἰμί und Perfektpartizip beschreibt den bestehenden Zustand nach dem Zusammenkommen. Im Deutschen gibt das Plusquamperfekt mit reflexivem „sich versammeln“ diesen resultativen Sinn natürlich wieder.
- source_word: ὅλη ἡ πόλις
  choice: die ganze Stadt
  rationale: Die Formulierung bewahrt die anschauliche Verallgemeinerung des Griechischen, ohne sie abzuschwächen oder als mathematisch erschöpfende Angabe auszudeuten.
- source_word: πρὸς τὴν θύραν
  choice: vor der Tür
  rationale: πρός mit Akkusativ bezeichnet hier im Zusammenhang mit dem erreichten Zustand die Lage der Menge am Hauseingang. „Vor der Tür“ ist dafür im modernen Deutschen idiomatisch; die stärker richtungsbezogene Wiedergabe bleibt als Alternative in der Fußnote erhalten.
- source_word: θύραν
  choice: Tür
  rationale: θύρα bedeutet unmittelbar „Tür“ und bezeichnet hier kontextuell den Eingang des Hauses. Die konkrete Bezeichnung wird gegenüber dem erklärenden „Eingang“ bewahrt.
