id: MRK.1.13
reference: Mark 1:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἦν ἐν τῇ ἐρήμῳ ⸂τεσσεράκοντα ἡμέρας⸃ πειραζόμενος ὑπὸ τοῦ Σατανᾶ, καὶ ἦν μετὰ τῶν θηρίων, καὶ οἱ ἄγγελοι διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: de
  text: Und er war vierzig Tage lang in der Wüste und wurde vom Satan versucht.[a] Er war bei den wilden Tieren, und die Engel dienten ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und wurde vom Satan auf die Probe gestellt“. Das griechische Verb kann sowohl „versuchen“ als auch „auf die Probe stellen“ bedeuten; weil Satan hier ausdrücklich als Handelnder genannt wird, liegt „versucht“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: Wüste
  rationale: „Wüste“ ist die natürliche und traditionsnahe Wiedergabe für einen unbewohnten, öden Ort, ohne die Landschaft auf eine Sandwüste festzulegen.
- source_word: τεσσεράκοντα ἡμέρας
  choice: vierzig Tage lang
  rationale: Gibt den Akkusativ der zeitlichen Dauer idiomatisch und genau wieder; mögliche biblische Anklänge bleiben unausgesprochen.
- source_word: πειραζόμενος
  choice: wurde versucht
  rationale: Das Partizip bezeichnet einen während des Aufenthalts andauernden Vorgang. Da Satan ausdrücklich als Handelnder genannt wird, liegt „versuchen“ näher; die ebenfalls mögliche Bedeutung „auf die Probe stellen“ wird in der Fußnote bewahrt.
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: vom Satan
  rationale: „Satan“ ist im Deutschen die etablierte Wiedergabe des Namens beziehungsweise Titels des persönlichen Widersachers.
- source_word: μετὰ τῶν θηρίων
  choice: bei den wilden Tieren
  rationale: Bewahrt die schlichte μετὰ-Konstruktion und bezeichnet verständlich die nicht domestizierten Tiere der Wildnis, ohne ihre Gefährlichkeit ausdrücklich auszudeuten.
- source_word: ἄγγελοι
  choice: Engel
  rationale: Der übernatürliche Zusammenhang macht deutlich, dass himmlische Boten gemeint sind.
- source_word: διηκόνουν αὐτῷ
  choice: dienten ihm
  rationale: „Dienten“ gibt διακονέω klar und würdig wieder; die Vergangenheitsform im Kontext lässt den fortdauernden Charakter des Imperfekts erkennen.
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: Und er war ... Er war ... und ...
  rationale: Die wiederholte parataktische Verbindung des Markus bleibt weitgehend hörbar, während die Satzteilung den deutschen Text natürlich lesbar macht.
theological_decisions:
- issue: Bedeutung von πειραζόμενος in Verbindung mit Satan
  choice: wurde vom Satan versucht
  alternative: wurde vom Satan auf die Probe gestellt
  rationale: Das Verb kann sowohl Versuchung als auch Erprobung bezeichnen. Die ausdrückliche Urheberschaft Satans legt hier die feindliche Bedeutung „versuchen“ nahe; die echte lexikalische Alternative wird jedoch nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markinische Reihung bleibt erkennbar, wird aber durch eine Satzgrenze lesefreundlich gestaltet. „Dienten“ ist bewusst schlicht und vermeidet eine unnötig kirchensprachliche Überhöhung.
