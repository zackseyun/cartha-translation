id: MRK.1.2
reference: Mark 1:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: de
  text: 'Wie beim Propheten Jesaja[a] geschrieben steht: »Siehe, ich sende meinen Boten vor dir her[b]; er wird deinen Weg bereiten.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen »bei den Propheten« statt »beim Propheten Jesaja«.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: »vor deinem Angesicht«.'
    reason: lexical_alternative
  - marker: c
    text: Das Zitat verbindet Formulierungen aus Maleachi 3,1 und Jesaja 40,3.
    reason: cross_reference
lexical_decisions:
- source_word: Καθὼς
  choice: Wie
  rationale: Leitet die Entsprechung zum folgenden Schriftwort natürlich und prägnant ein.
- source_word: γέγραπται
  choice: geschrieben steht
  rationale: Die geläufige deutsche Zitierformel gibt den fortdauernden Geltungszustand des griechischen Perfekts wieder.
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: beim Propheten Jesaja
  rationale: Natürliche deutsche Formel für die Angabe der prophetischen Schriftquelle; sie bewahrt ausdrücklich die Zuschreibung an Jesaja.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen, Aufmerksamkeit weckenden Ton des prophetischen Zitats, ohne umgangssprachlich zu wirken.
- source_word: ἀποστέλλω
  choice: ich sende
  rationale: Gibt das griechische Präsens unmittelbar wieder und passt zum gehobenen Zitatcharakter.
- source_word: ἄγγελόν
  choice: Boten
  rationale: ἄγγελος bezeichnet hier im Zusammenhang den vorausgehenden menschlichen Gesandten; „Bote“ wahrt zugleich die Grundbedeutung.
- source_word: πρὸ προσώπου σου
  choice: vor dir her
  rationale: Gibt die räumlich-direktionale Bedeutung der Wendung idiomatisch wieder; die wörtliche Form „vor deinem Angesicht“ wird in der Fußnote erhalten.
- source_word: κατασκευάσει
  choice: wird … bereiten
  rationale: Entspricht dem Sinn „vorbereiten, bereitmachen“ und fügt sich natürlich in die traditionelle Wegmetaphorik ein.
- source_word: τὴν ὁδόν σου
  choice: deinen Weg
  rationale: Bewahrt sowohl das konkrete Wegbild als auch dessen übertragene prophetische Bedeutung.
theological_decisions:
- issue: Die Zitierformel nennt Jesaja, obwohl das folgende Zitat Formulierungen aus Maleachi 3,1 und Jesaja 40,3 verbindet.
  choice: Die Hauptlesart „beim Propheten Jesaja“ bleibt im Haupttext erhalten.
  alternative: Einige Handschriften lesen „bei den Propheten“.
  rationale: Die Übersetzung folgt der SBLGNT-Hauptlesart und harmonisiert die Spannung der zusammengesetzten Anführung nicht; Lesart und Quellenbezug werden in Fußnoten transparent gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Siehe“ und „geschrieben steht“ wahren den prophetisch-schriftgemäßen Ton; „vor dir her“ vermeidet eine im Deutschen unnötig hölzerne Wiedergabe des semitisch geprägten Ausdrucks.
