  source_fidelity: 'Der deutsche Text gibt die Abfolge und die wesentlichen Elemente des griechischen Textes zuverlässig wieder: Jesu Herantreten, das Ergreifen ihrer Hand und Aufrichten, das Weichen des Fiebers sowie ihr Dienst an der anwesenden Gruppe. „Richtete sie auf“ ist im Heilungskontext eine angemessene Wiedergabe von ἤγειρεν, ohne eine Auferstehungsaussage hineinzulesen. Die Imperfektform διηκόνει wird mit „diente“ offen und sachgerecht wiedergegeben.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit passendem biblisch-narrativem Ton. Die parataktische Satzfolge bildet den knappen, raschen Stil des Markusverses angemessen nach. „Da verließ sie das Fieber“ ist stilistisch markiert, aber idiomatisch und verständlich.
  terminology: „Bei der Hand nehmen“, „aufrichten“, „Fieber“ und „dienen“ sind treffende und registergerechte Entscheidungen. Das Pluralpronomen „ihnen“ wahrt zutreffend αὐτοῖς. Die Fußnote behandelt die mögliche ingressive Nuance des Imperfekts, ohne sie dem Haupttext aufzuzwingen.
