id: MRK.1.31
reference: Mark 1:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἤγειρεν αὐτὴν κρατήσας τῆς ⸀χειρός· καὶ ἀφῆκεν αὐτὴν ὁ ⸀πυρετός, καὶ διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: de
  text: Dann trat er zu ihr, nahm sie bei der Hand und richtete sie auf. Da verließ sie das Fieber, und sie diente ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie fing an, ihnen zu dienen“. Das griechische Imperfekt kann ihr Dienen beschreiben; im Zusammenhang kann es auch den Beginn ihres Dienens unmittelbar nach der Heilung bezeichnen.'
    reason: Aspektuelle Übersetzungsalternative bei διηκόνει.
lexical_decisions:
- source_word: προσελθὼν
  choice: trat er zu ihr
  rationale: Das Aoristpartizip bezeichnet Jesu Herantreten vor dem Aufrichten. Die Ergänzung „zu ihr“ ergibt sich unmittelbar aus dem weiblichen Pronomen und ist im Deutschen natürlich.
- source_word: ἤγειρεν αὐτὴν
  choice: richtete sie auf
  rationale: ἐγείρω bezeichnet hier das Aufrichten der Kranken. „Richtete sie auf“ ist idiomatisch und bewahrt mehr von der Kraft des Verbs als „half ihr auf“.
- source_word: κρατήσας τῆς χειρός
  choice: nahm sie bei der Hand
  rationale: κρατέω bedeutet ergreifen oder festhalten; die Verbindung mit dem Genitiv χείρ wird im Deutschen natürlich mit „bei der Hand nehmen“ wiedergegeben.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: da verließ sie das Fieber
  rationale: Die Satzstellung lässt das Fieber als handelndes Subjekt hervortreten. „Verließ sie“ gibt ἀφίημι präzise und verständlich wieder.
- source_word: διηκόνει αὐτοῖς
  choice: sie diente ihnen
  rationale: Das Imperfekt beschreibt ihr Dienen, ohne zwingend einen ausdrücklich markierten Beginn auszudrücken. „Diente“ ist würdevoll, verständlich und weniger einengend als „bediente“.
theological_decisions:
- issue: Möglicher Anklang von ἐγείρω an die Sprache des Auferstehens
  choice: richtete sie auf
  alternative: half ihr auf
  rationale: Die Formulierung bezeichnet im Zusammenhang eine körperliche Aufrichtung, bewahrt aber die stärkere verbale Färbung, ohne den Vers ausdrücklich als Auferstehungsaussage auszulegen.
- issue: Aspekt des Imperfekts διηκόνει
  choice: sie diente ihnen
  alternative: sie fing an, ihnen zu dienen
  rationale: Das Imperfekt kann den einsetzenden oder fortdauernden Dienst nach der Heilung darstellen. Der Haupttext legt sich nicht unnötig auf eine ingressive Deutung fest; die mögliche Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, natürliches Standarddeutsch mit würdigem biblischem Ton. Die kurzen Hauptsätze bilden die rasche Abfolge von Annäherung, Aufrichtung, Heilung und Dienst ab.
