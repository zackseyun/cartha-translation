  text: ἡ δὲ πενθερὰ Σίμωνος κατέκειτο πυρέσσουσα, καὶ ⸀εὐθὺς λέγουσιν αὐτῷ περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: de
  text: Simons Schwiegermutter lag mit Fieber im Bett, und sofort berichteten[a] sie ihm von ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und sofort sagen sie ihm von ihr“. Das Griechische verwendet zur lebendigen Erzählung die Gegenwartsform („sagen“).'
    reason: lexical_alternative
lexical_decisions:
- source_word: πενθερὰ
  choice: Schwiegermutter
  rationale: Das griechische Verwandtschaftswort bezeichnet hier Simons Schwiegermutter; die deutsche Entsprechung ist eindeutig und natürlich.
- source_word: κατέκειτο
  choice: lag … im Bett
  rationale: Das Imperfekt beschreibt ihren andauernden liegenden Zustand. Im Zusammenhang mit dem Fieber gibt „im Bett liegen“ dies natürlich wieder, ohne eine dauerhafte Bettlägerigkeit zu behaupten.
- source_word: πυρέσσουσα
  choice: mit Fieber
  rationale: Das Partizip bezeichnet das Leiden an Fieber. Zusammen mit „lag … im Bett“ ergibt sich eine knappe, idiomatische deutsche Formulierung.
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ bewahrt die von Markus häufig hervorgehobene Unmittelbarkeit und klingt in heutiger Standardsprache natürlich.
- source_word: λέγουσιν
  choice: erzählten
  rationale: Der historische Präsens des Griechischen wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben. „Von ihr erzählen“ bezeichnet hier idiomatisch das Mitteilen ihrer Lage.
- source_word: περὶ αὐτῆς
  choice: von ihr
  rationale: περί mit Genitiv bedeutet hier „über/von ihr“; in Verbindung mit „erzählen“ ist „von ihr“ die natürliche deutsche Fügung.
- source_word: δὲ
  choice: und
  rationale: δέ führt die Erzählung mit einer schwachen Verbindung weiter. „Und“ bildet diesen Anschluss ab, ohne einen starken Gegensatz einzutragen.
