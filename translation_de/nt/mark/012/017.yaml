  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν ⸀αὐτοῖς· ⸂Τὰ Καίσαρος ἀπόδοτε⸃ Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ. καὶ ⸀ἐξεθαύμαζον ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Gebt dem Kaiser zurück[a], was dem Kaiser gehört, und Gott, was Gott gehört.“ Und sie waren sehr erstaunt über ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebt dem Kaiser, was ihm zusteht.“ Das Verb kann bedeuten, etwas zurückzugeben, zu erstatten oder das Geschuldete zu entrichten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Gebt … zurück
  rationale: Der Aorist-Imperativ von ἀποδίδωμι kann bedeuten, etwas zurückzugeben, zu erstatten oder als Geschuldetes zu entrichten. „Gebt … zurück“ bewahrt diesen Grundton, ohne die Aussage allein auf Steuerzahlung einzuengen.
- source_word: Τὰ Καίσαρος … Καίσαρι
  choice: dem Kaiser …, was dem Kaiser gehört
  rationale: Der substantivierte neutrale Plural mit Genitiv bezeichnet das, was dem Kaiser gehört. Die deutsche Formulierung ist natürlich und hält den Umfang der kaiserlichen Ansprüche bewusst offen.
- source_word: τὰ τοῦ θεοῦ … τῷ θεῷ
  choice: Gott, was Gott gehört
  rationale: Die Formulierung spiegelt bewusst den ersten Satzteil und bewahrt den pointierten Parallelismus.
- source_word: ἐξεθαύμαζον
  choice: sie staunten sehr
  rationale: ἐκθαυμάζω bezeichnet ein starkes Staunen; „sehr“ gibt die Intensivierung in verständlichem, gegenwärtigem Deutsch wieder. Das Imperfekt schildert ihre anhaltende Reaktion.
- source_word: ἐπ’ αὐτῷ
  choice: über ihn
  rationale: Bei einem Verb des Staunens bezeichnet ἐπί mit Dativ den Gegenstand oder Anlass des Staunens. „Über ihn“ bleibt nah am Griechischen, ohne die Reaktion ausdrücklich nur auf seine Worte zu begrenzen.
- source_word: δὲ
  choice: aber
  rationale: δέ markiert hier einen leichten Gegensatz beziehungsweise den Übergang zu Jesu Antwort; „aber“ passt zur konfrontativen Gesprächssituation.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Die schlichte Wiedergabe bewahrt die Redeeinleitung ohne zusätzliche Deutung.
theological_decisions:
- issue: Verhältnis zwischen Verpflichtungen gegenüber der staatlichen Macht und gegenüber Gott
  choice: Die beiden parallelen Aussagen werden ohne weitergehende politische oder kirchliche Deutung wiedergegeben.
  alternative: Die Aussage ausdrücklich als starke Bestätigung staatlicher Autorität oder als Einschränkung und Untergrabung der Ansprüche des Kaisers formulieren.
  rationale: Der Vers erkennt Ansprüche des Kaisers und Gottes an, entwickelt aber keine umfassende Lehre über ihr Verhältnis. Die Übersetzung bewahrt diese Spannung und lässt insbesondere offen, wie beide Bereiche voneinander abzugrenzen sind.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Satzbau. Der parallele Aufbau des Jesuswortes bleibt erhalten; „Kaiser“ gibt Καῖσαρ als Herrschertitel wieder.
