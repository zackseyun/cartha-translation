  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: de
  text: Und die sieben hinterließen keine Nachkommen. Zuletzt starb auch die Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: die sieben
  rationale: Der substantivisch gebrauchte Zahlbegriff verweist auf die sieben Brüder aus dem vorausgehenden Zusammenhang. „Die sieben“ ist knapp und im Kontext eindeutig.
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: hinterließen keine Nachkommen
  rationale: Wörtlich steht „hinterließen keinen Samen“. Gemeint ist, dass keiner von ihnen Nachkommen hinterließ; die gewählte Formulierung gibt die idiomatische Bedeutung in natürlichem modernem Deutsch wieder.
- source_word: ἔσχατον πάντων
  choice: Zuletzt
  rationale: Die adverbiale Wendung bezeichnet das letzte Ereignis in der Abfolge. „Zuletzt“ ist prägnant und bewahrt die zeitliche Reihenfolge.
- source_word: καὶ ἡ γυνὴ
  choice: auch die Frau
  rationale: 'καί hat hier additive Funktion: Nach den sieben Männern starb ebenfalls die bereits genannte Frau.'
- source_word: ἀπέθανεν
  choice: starb
  rationale: Das Verb bezeichnet direkt den Tod; „starb“ entspricht dieser schlichten und ungeschönten Aussage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die idiomatische Wendung mit σπέρμα wird verständlich als „Nachkommen“ wiedergegeben; eine Fußnote ist nicht nötig, da dadurch weder eine sachliche Mehrdeutigkeit noch eine theologisch erhebliche Spannung verloren geht.
