id: MRK.12.33
reference: Mark 12:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: de
  text: und ihn von ganzem Herzen, mit allem Verständnis und mit ganzer Kraft zu lieben und seinen Nächsten wie sich selbst zu lieben, ist mehr als alle Brandopfer[a] und Schlachtopfer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Brandopfer wurden vollständig auf dem Altar verbrannt.
    reason: Der griechische Ausdruck ὁλοκαύτωμα bezeichnet spezifisch ein Opfer, das ganz verbrannt wurde; der etablierte deutsche Ausdruck „Brandopfer“ macht dieses Merkmal nicht für alle heutigen Leser unmittelbar sichtbar.
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: zu lieben
  rationale: Der substantivierte Infinitiv wird im Deutschen idiomatisch als Infinitiv mit „zu“ wiedergegeben; die parallele Struktur beider Vorkommen bleibt erhalten.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist im Kontext auf Gott. „Ihn“ bewahrt die Ausdrucksweise des griechischen Textes, ohne den Bezugsnamen einzusetzen.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: von ganzem Herzen
  rationale: Die geläufige deutsche Wendung drückt die umfassende innere Hingabe natürlich und würdig aus.
- source_word: συνέσεως
  choice: Verständnis
  rationale: σύνεσις bezeichnet Verstehen, Einsicht oder Urteilsvermögen. „Verständnis“ wahrt diesen Akzent besser als das allgemeinere „Denken“.
- source_word: ἰσχύος
  choice: Kraft
  rationale: „Kraft“ gibt die gesamte verfügbare Stärke oder Fähigkeit in diesem ethischen Zusammenhang klar wieder.
- source_word: πλησίον
  choice: Mitmenschen
  rationale: Der artikulierte Singular ist generisch. „Seinen Mitmenschen“ vermittelt im modernen Deutsch die allgemeine ethische Bedeutung natürlich, ohne auf räumliche Nachbarschaft einzuengen.
- source_word: ὡς ἑαυτόν
  choice: wie sich selbst
  rationale: Die reflexive Form bleibt entsprechend der indirekt berichteten, allgemeinen Aussage erhalten und wird nicht in eine direkte Anrede umgewandelt.
- source_word: περισσότερόν ἐστιν
  choice: ist mehr als
  rationale: Die knappe Vergleichsformulierung bewahrt die ausdrücklich ausgesagte Überlegenheit, ohne diese weiter auszudeuten.
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: als alle Brandopfer und Schlachtopfer
  rationale: ὁλοκαύτωμα bezeichnet ein vollständig verbranntes Opfer; „Brandopfer“ ist dafür der etablierte deutsche Fachausdruck. θυσία bezeichnet hier im kultischen Gegensatz das Schlachtopfer. Die Genitivkonstruktion nach dem Komparativ wird idiomatisch mit „als“ wiedergegeben.
theological_decisions:
- issue: Verhältnis der Liebesgebote zum Opferkult
  choice: Die uneingeschränkte Liebe zu Gott und die Liebe zum Mitmenschen werden über alle Brand- und Schlachtopfer gestellt.
  alternative: Die Aussage hebt den Opferkult ausdrücklich vollständig auf.
  rationale: περισσότερόν ἐστιν formuliert eindeutig eine Rangordnung. Der Vers erklärt jedoch nicht ausdrücklich die Abschaffung des Opferwesens; diese Spannung bleibt bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Infinitivparallele und die generische Aussageform wurden bewahrt. „Mit allem Verständnis“ folgt der besonderen Wortwahl σύνεσις, während „von ganzem Herzen“ und „mit ganzer Kraft“ natürliche deutsche Wendungen sind.
