  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: de
  text: 'David selbst hat im Heiligen Geist[a] gesagt: »Der Herr sagte zu meinem Herrn[b]: ›Setze dich zu meiner Rechten, bis ich deine Feinde unter deine Füße lege.‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch den Heiligen Geist«.'
    reason: alternative_reading
  - marker: b
    text: Das Zitat stammt aus Psalm 110,1. Im hebräischen Text steht an der ersten Stelle der Gottesname JHWH, der traditionell mit »der HERR« wiedergegeben wird; die zweite Stelle bezeichnet Davids Herrn.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυίδ
  choice: David selbst
  rationale: Die Stellung von αὐτός hebt David als Sprecher hervor; „David selbst“ gibt diese Betonung im Deutschen natürlich wieder.
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: im Heiligen Geist
  rationale: Die Wiedergabe folgt der Präposition ἐν und wahrt die Offenheit, ob damit Zustand, Sphäre oder Wirken des Geistes bezeichnet wird.
- source_word: κύριος / τῷ κυρίῳ μου
  choice: der Herr / zu meinem Herrn
  rationale: Die Wiederholung von κύριος bleibt erhalten. So wird Jesu Argument nicht durch unterschiedliche deutsche Begriffe vorentschieden.
- source_word: Κάθου
  choice: Setze dich
  rationale: Der Imperativ wird in natürlichem, würdigem Deutsch wiedergegeben und passt zum Bild der Einsetzung auf den Ehrenplatz.
- source_word: ἐκ δεξιῶν μου
  choice: an meine rechte Seite
  rationale: Die griechische Wendung bezeichnet idiomatisch den Ehrenplatz rechts von jemandem; „an meine rechte Seite“ ist im heutigen Deutsch klarer als „zu meiner Rechten“.
- source_word: ἕως ἂν θῶ
  choice: bis ich … lege
  rationale: Die Konstruktion bezeichnet den Zeitpunkt, bis zu dem die Aufforderung gilt, und blickt auf Gottes künftiges Handeln.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: unter deine Füße
  rationale: Dies folgt genau der markinischen Formulierung, ohne das im Psalmkontext bekannte Bild eines Fußschemels in den Haupttext einzutragen.
theological_decisions:
- issue: Formulierung von Davids Reden im Heiligen Geist
  choice: im Heiligen Geist
  alternative: durch den Heiligen Geist
  rationale: „Im Heiligen Geist“ entspricht der griechischen Präposition unmittelbar und bekräftigt das Wirken des Geistes, ohne dessen genaue Wirkweise enger festzulegen.
- issue: Christologische Aussage des Zitats aus Psalm 110,1
  choice: Der Herr sagte zu meinem Herrn
  alternative: Der HERR sagte zu meinem Herrn
  rationale: Da der griechische Text an beiden Stellen κύριος verwendet, bleibt die Wiederholung im Haupttext sichtbar. Dass die erste Stelle im hebräischen Psalm den Gottesnamen wiedergibt, wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede ist typografisch in zwei Ebenen gegliedert. „An meine rechte Seite“ vermeidet eine unnötig altertümliche Formulierung, ohne das königliche Bild abzuschwächen.
