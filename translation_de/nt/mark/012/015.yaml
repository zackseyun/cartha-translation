id: MRK.12.15
reference: Mark 12:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: de
  text: 'Doch er wusste um ihre Heuchelei und sagte zu ihnen: „Warum stellt ihr mich auf die Probe[b]? Bringt mir einen Denar[a], damit ich ihn mir ansehe.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar war eine römische Silbermünze und entsprach häufig dem Lohn für einen Arbeitstag.
    reason: cultural_note
  - marker: b
    text: 'Oder: „Warum versucht ihr mich?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: erkannte
  rationale: Das Partizip bezeichnet Jesu sicheres Wissen um ihre Absicht. „Erkannte“ ist im Deutschen natürlich und gibt die kognitive Wahrnehmung wieder, ohne näher zu erklären, wie sie zustande kam.
- source_word: ὑπόκρισιν
  choice: Heuchelei
  rationale: „Heuchelei“ bewahrt die starke moralische Aussage des griechischen Wortes und passt zu der im Zusammenhang vorgeschützten Aufrichtigkeit.
- source_word: Τί
  choice: Warum
  rationale: Τί wird in dieser Verbindung idiomatisch kausal gebraucht; „Warum“ ist die natürliche deutsche Wiedergabe.
- source_word: πειράζετε
  choice: stellt ihr mich auf die Probe
  rationale: Die Formulierung gibt den feindseligen Prüfungs- und Fallencharakter wieder, ohne den Sinn auf eine Verlockung zur Sünde einzuengen.
- source_word: φέρετέ
  choice: Bringt
  rationale: Der Imperativ fordert die Angesprochenen unmittelbar auf, Jesus den Gegenstand zu bringen.
- source_word: δηνάριον
  choice: einen Denar
  rationale: Die historische Münzbezeichnung bleibt erhalten; eine Fußnote erklärt ihren kulturellen Hintergrund.
- source_word: ἵνα ἴδω
  choice: damit ich ihn mir ansehe
  rationale: Die deutsche Zweckkonstruktion gibt ἵνα wieder. Das auf den Denar bezogene Pronomen ist ergänzt; „sich ansehen“ entspricht hier dem beabsichtigten Betrachten natürlicher als das bloße „sehen“.
theological_decisions:
- issue: Bedeutung von πειράζετε in Jesu Gegenfrage
  choice: feindseliges Auf-die-Probe-Stellen
  alternative: „versucht ihr mich“
  rationale: Im Zusammenhang wollen die Fragesteller Jesus mit seiner Antwort in eine Falle locken. Die Hauptfassung bewahrt diese gegnerische Stoßrichtung, während die Fußnote die lexikalisch mögliche Wiedergabe „versuchen“ offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Ablauf, wird aber idiomatisch formuliert. Die Fußnotenmarker wurden bei den jeweils tatsächlich erläuterten Ausdrücken platziert.
