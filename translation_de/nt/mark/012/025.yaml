source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: de
  text: Denn wenn sie von den Toten auferstehen, heiraten sie weder noch werden sie verheiratet, sondern sie sind wie Engel im Himmel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in den Himmeln“. Das griechische Wort steht im Plural.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: Denn wenn
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ, während „wenn“ den zeitlichen Bezug von ὅταν natürlich wiedergibt.
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: sie von den Toten auferstehen
  rationale: Die aktive Form „auferstehen“ entspricht dem griechischen Aktiv und ist im Deutschen die übliche Wendung für die Auferstehung von den Toten.
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: heiraten sie weder, noch werden sie verheiratet
  rationale: Die zweiteilige Verneinung wird bewahrt. Die aktive und die passive Form bleiben unterscheidbar, ohne beide Verben mit derselben deutschen Wendung einzuebnen.
- source_word: ἀλλ’ εἰσὶν
  choice: sondern sie sind
  rationale: Nach der Verneinung gibt „sondern“ den deutlichen Gegensatz im Deutschen idiomatisch wieder.
- source_word: ὡς ἄγγελοι
  choice: wie Engel
  rationale: „Wie“ bezeichnet einen Vergleich und vermeidet die Aussage, auferstandene Menschen würden zu Engeln.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: im Himmel
  rationale: „Im Himmel“ ist die natürliche deutsche Ortsangabe; der griechische Plural wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Art des Vergleichs mit den Engeln
  choice: Auferstandene Menschen sind hinsichtlich des Nichtheiratens wie Engel.
  alternative: Auferstandene Menschen werden zu Engeln.
  rationale: Die Vergleichspartikel ὡς bezeichnet Ähnlichkeit, nicht Wesensgleichheit. Die Übersetzung „wie Engel“ wahrt diese grammatische Unterscheidung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am griechischen Argumentationsgang; „werden sie verheiratet“ bewahrt den Gegensatz zwischen Aktiv und Passiv. Der Fußnotenmarker steht bei „Himmel“, auf das sich die Anmerkung bezieht.
