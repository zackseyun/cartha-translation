source:
  edition: SBLGNT
  text: Καὶ ἔρχονται Σαδδουκαῖοι πρὸς αὐτόν, οἵτινες λέγουσιν ἀνάστασιν μὴ εἶναι, καὶ ⸀ἐπηρώτων αὐτὸν λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/018.yaml
  text: And Sadducees came to him, who say there is no resurrection, and they began questioning him, saying,
translation:
  language: de
  text: 'Da kamen Sadduzäer zu ihm, die sagen, es gebe keine Auferstehung, und begannen, ihn zu befragen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἔρχονται
  choice: Dann kamen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben; καί führt hier den nächsten Vorgang ein.
- source_word: Σαδδουκαῖοι
  choice: Sadduzäer
  rationale: Die im modernen Standarddeutsch übliche Bezeichnung dieser jüdischen Gruppierung.
- source_word: ἀνάστασιν μὴ εἶναι
  choice: es gebe keine Auferstehung
  rationale: Die indirekte Rede mit Konjunktiv I bildet die von den Sadduzäern vertretene Auffassung ab, ohne sie sich als Erzählerbehauptung zu eigen zu machen.
- source_word: ἐπηρώτων
  choice: fragten
  rationale: Das Imperfekt bezeichnet die einsetzende beziehungsweise fortlaufende Befragung; vor der anschließenden direkten Rede ist die idiomatische knappe Wiedergabe „fragten ihn“ angemessen.
- source_word: λέγοντες
  choice: ':'
  rationale: Der Doppelpunkt leitet im Deutschen die unmittelbar folgende wörtliche Rede natürlich ein und vermeidet das schwerfällige „indem sie sagten“.
theological_decisions:
- issue: Behauptung über die Auferstehung
  choice: „die sagen, es gebe keine Auferstehung“
  alternative: „die sagen, dass es keine Auferstehung gibt“
  rationale: Der Konjunktiv bewahrt die Distanz des Erzählers zur Lehre der Sadduzäer und verhindert, dass ihre Verneinung als Aussage des Textes selbst missverstanden wird.
- issue: Aspekt von ἐπηρώτων
  choice: „fragten ihn“
  alternative: „begannen ihn zu befragen“
  rationale: Das griechische Imperfekt kann einen einsetzenden oder andauernden Vorgang anzeigen, verlangt aber nicht ausdrücklich ein Hilfsverb wie „begannen“. Die schlichte deutsche Erzählform lässt den Aspekt im Kontext offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt als Einleitung zur folgenden direkten Rede bewusst offen; der Doppelpunkt entspricht dieser syntaktischen Funktion.
