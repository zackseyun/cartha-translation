source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: de
  text: 'Was aber die Toten betrifft, dass sie auferweckt werden: Habt ihr nicht im Buch des Mose in dem Abschnitt über den Dornbusch[a] gelesen, wie Gott zu ihm sagte: »Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »beim Dornbusch«; die griechische Wendung kann die Schriftstelle anhand der Dornbusch-Episode bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: Was aber die Toten betrifft
  rationale: περί mit Genitiv führt das Thema ein; δέ wird mit einem leichten, zugleich kontrastierenden »aber« wiedergegeben.
- source_word: ὅτι ἐγείρονται
  choice: dass sie auferweckt werden
  rationale: Die passive Verbform wird bewahrt und bezeichnet hier die Auferweckung der Toten als allgemeine Wirklichkeit.
- source_word: οὐκ ἀνέγνωτε
  choice: Habt ihr nicht ... gelesen
  rationale: Die im Deutschen natürliche rhetorische Frage verweist auf eine den Hörern bekannte Schriftstelle.
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: im Buch des Mose
  rationale: βίβλος kann Buch oder Schriftrolle bedeuten; »Buch des Mose« ist verständlich und entspricht dem Bezug auf die mosaische Schrift.
- source_word: ἐπὶ τοῦ βάτου
  choice: in dem Abschnitt über den Dornbusch
  rationale: Die Wendung kann eine Schriftstelle nach der dort erzählten Dornbusch-Episode bezeichnen; die funktionale Bedeutung wird im Haupttext verständlich ausgedrückt.
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: wie Gott zu ihm sagte
  rationale: Das deutsche Redeeinleitungsverb gibt εἶπεν und das quotative Partizip λέγων natürlich wieder, ohne das redundante »sagend« nachzubilden.
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs
  rationale: Das prädikative Präsens und die dreimalige Wiederholung von »der Gott« bleiben erhalten, da Form und Zeitstufe für den Gedankengang bedeutsam sind.
theological_decisions:
- issue: Auferstehungssprache in ὅτι ἐγείρονται
  choice: dass sie auferweckt werden
  alternative: dass sie auferstehen
  rationale: »Auferweckt werden« bewahrt die passive Form und damit die mögliche Nuance göttlichen Handelns, ohne den Text weiter auszudeuten.
- issue: Präsens und Wiederholung in der göttlichen Selbstbezeichnung
  choice: Ich bin der Gott Abrahams und der Gott Isaaks und der Gott Jakobs
  alternative: Ich bin Abrahams, Isaaks und Jakobs Gott
  rationale: Das ausdrücklich beibehaltene Präsens und die wiederholte Formulierung spiegeln die zitierte Aussage möglichst genau und bewahren ihre argumentative Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt trotz der langen Themeneinleitung gut verständlich; das Schriftzitat bewahrt seine feierliche Wiederholung.
