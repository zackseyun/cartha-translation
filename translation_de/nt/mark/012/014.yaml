reference: Mark 12:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: de
  text: 'Da kamen sie und sagten zu ihm: »Lehrer, wir wissen, dass du wahrhaftig bist und dich von niemandem beeinflussen lässt; denn du achtest nicht auf das Ansehen der Menschen, sondern lehrst in Wahrheit den Weg Gottes. Ist es erlaubt, dem Kaiser die Kopfsteuer[a] zu zahlen, oder nicht? Sollen wir sie zahlen oder nicht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort κῆνσος bezeichnet hier die römische Kopfsteuer (Zensussteuer).
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die übliche, natürliche deutsche Anrede für διδάσκαλος bewahrt Jesu Rolle als Lehrender ohne altertümlichen Klang.
- source_word: ἀληθὴς
  choice: wahrhaftig
  rationale: Das Prädikativ bezeichnet Jesus als einen Menschen, der der Wahrheit entspricht und wahrheitsgemäß redet; »wahrhaftig« ist im Deutschen würdig und personenbezogen.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: du lässt dich von niemandem beeinflussen
  rationale: Die idiomatische Wendung besagt im Zusammenhang nicht, dass Jesus Menschen gleichgültig wären, sondern dass niemand sein Urteil oder seine Lehre bestimmt.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: denn du achtest nicht auf das Ansehen der Menschen
  rationale: Die Wiedergabe erhält das Motiv gesellschaftlichen Ansehens und vermittelt den idiomatischen Sinn, dass Rang, Stellung oder äußere Erscheinung Jesus nicht beeinflussen.
- source_word: ἐπ’ ἀληθείας
  choice: in Wahrheit
  rationale: Die adverbiale Wendung bezieht sich auf das Lehren und wird mit einer natürlichen, zugleich quellennahen deutschen Formulierung wiedergegeben.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: den Weg Gottes
  rationale: Die vertraute biblische Weg-Metapher bleibt erhalten und wird nicht zu einer bloßen Lehre oder Verhaltensregel verengt.
- source_word: ἔξεστιν
  choice: Ist es erlaubt
  rationale: Die Formulierung bewahrt die Frage nach dem rechtlich beziehungsweise religiös Zulässigen, ohne vorwegzunehmen, auf welches Recht sich die Fragenden berufen.
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: dem Kaiser die Kopfsteuer zu zahlen
  rationale: κῆνσος bezeichnet hier die römische Zensus- oder Kopfsteuer; »zahlen« ist für δοῦναι in diesem Zusammenhang idiomatisches Deutsch.
- source_word: Καίσαρι
  choice: dem Kaiser
  rationale: Im Deutschen ist »Kaiser« die etablierte Wiedergabe des römischen Herrschertitels Caesar in diesem Kontext.
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: Sollen wir sie zahlen oder nicht?
  rationale: Die knappe Wiederholung der Entscheidungsfrage bleibt erhalten; das Pronomen »sie« nimmt eindeutig die Kopfsteuer auf.
theological_decisions:
- issue: Bedeutung der Aussage, Jesus kümmere sich um niemanden
  choice: du lässt dich von niemandem beeinflussen
  alternative: du kümmerst dich um niemanden
  rationale: Eine wörtliche deutsche Wiedergabe könnte fälschlich moralische Gleichgültigkeit gegenüber Menschen ausdrücken. Der folgende Satz über das Ansehen der Menschen verdeutlicht, dass Unabhängigkeit von menschlichem Einfluss gemeint ist.
- issue: Bezug der Erlaubnisfrage
  choice: Ist es erlaubt
  alternative: Ist es nach dem Gesetz erlaubt
  rationale: Der griechische Text nennt kein bestimmtes Gesetz. Die offenere Formulierung bewahrt die Spannung zwischen römischer Verpflichtung und religiös-ethischer Zulässigkeit.
- issue: Weg-Metapher
  choice: den Weg Gottes
  alternative: Gottes Willen
  rationale: Die Metapher des Ausgangstextes bleibt stehen und wird nicht auf eine einzelne theologische Deutung reduziert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Rede bleibt direkt und zugespitzt; unnötige Archaismen sowie missverständliche Wörtlichkeit wurden vermieden.
