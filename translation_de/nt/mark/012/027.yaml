id: MRK.12.27
reference: Mark 12:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀θεὸς νεκρῶν ⸀ἀλλὰ ζώντων· ⸀πολὺ πλανᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: de
  text: Er ist nicht der Gott der Toten, sondern der Lebenden. Ihr irrt euch sehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: Gott
  rationale: Das artikellose θεός bezeichnet in diesem Prädikatsgefüge den Gott Abrahams, Isaaks und Jakobs, nicht unbestimmt »einen Gott«.
- source_word: νεκρῶν
  choice: der Toten
  rationale: Der substantivisch gebrauchte Genitiv Plural bewahrt den knappen Gegensatz zu »der Lebenden«.
- source_word: ἀλλὰ ζώντων
  choice: sondern der Lebenden
  rationale: Das substantivierte Partizip bezeichnet die Lebenden; »sondern« gibt nach der Verneinung den scharfen griechischen Gegensatz natürlich wieder.
- source_word: πολὺ
  choice: sehr
  rationale: Das adverbial gebrauchte πολὺ verstärkt πλανᾶσθε; »sehr« ist im heutigen Deutsch klar und idiomatisch.
- source_word: πλανᾶσθε
  choice: ihr irrt euch
  rationale: Die mediale/passive Form bezeichnet hier, dass die Angesprochenen einem erheblichen Irrtum unterliegen, ohne festzulegen, ob sie sich selbst verirren oder von außen getäuscht werden.
- source_word: οὐκ ἔστιν
  choice: Er ist nicht
  rationale: Das im Deutschen nötige Pronomen wird aus dem unmittelbaren Kontext aufgenommen und ergibt eine natürliche, zugleich eng am Sinn orientierte Formulierung.
theological_decisions:
- issue: Folgerung über das Leben vor Gott und die Auferstehung
  choice: Der Gegensatz zwischen den Toten und den Lebenden bleibt ohne dogmatische Erläuterung stehen.
  alternative: Die Aussage ausdrücklich als Lehre über den Zwischenzustand oder die künftige Auferstehung ausformulieren.
  rationale: Jesu Aussage dient seinem Auferstehungsargument, doch der Vers selbst erklärt nicht näher, in welchem Sinn die Genannten leben. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Antithese des Griechischen bleibt erhalten; die abschließende Zurechtweisung ist deutlich, aber nicht unnötig verschärft.
