source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: de
  text: 'Da sagte der Schriftgelehrte zu ihm[a]: »Richtig, Lehrer. Du hast die Wahrheit gesagt: Er ist einer, und außer ihm gibt es keinen anderen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Zusammenhang ausdrücklich formuliert: »Gott ist einer.« Im Griechischen steht nur »Er ist einer«; wer gemeint ist, ergibt sich aus dem vorausgehenden Zusammenhang.'
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: Schriftgelehrter
  rationale: Die etablierte und präzise deutsche Bezeichnung für einen anerkannten Kenner und Ausleger der Tora in den Evangelien.
- source_word: Καλῶς
  choice: Gut
  rationale: Das adverbiale Lob bestätigt Jesu vorausgehende Antwort knapp und natürlich; zusammen mit der Anrede entspricht es dem Sinn von »gut/richtig gesagt«.
- source_word: διδάσκαλε
  choice: Lehrer
  rationale: Die direkte moderne Entsprechung für die respektvolle Anrede διδάσκαλε, ohne zusätzliche Autoritätsnuancen einzutragen.
- source_word: ἐπ’ ἀληθείας
  choice: der Wahrheit entsprechend
  rationale: Gibt die adverbiale Wendung klar und würdig wieder und vermeidet eine mögliche Verwechslung mit der formelhaften Bekräftigung »wahrlich«.
- source_word: εἶπες
  choice: du hast … gesagt
  rationale: Das deutsche Perfekt klingt im unmittelbaren Dialog natürlich und bezieht sich auf die gerade zuvor gegebene Antwort.
- source_word: ὅτι
  choice: Doppelpunkt
  rationale: Der Doppelpunkt leitet idiomatisch den Inhalt dessen ein, was Jesus gesagt hat; funktional entspricht er hier dem inhaltseinleitenden ὅτι.
- source_word: εἷς ἐστιν
  choice: Er ist einer
  rationale: Bewahrt die elliptische Form des Griechischen, das Gott in diesem Vers nicht ausdrücklich erneut nennt. Der Bezug ergibt sich aus dem vorausgehenden Kontext.
- source_word: οὐκ ἔστιν ἄλλος
  choice: es gibt keinen anderen
  rationale: Eine natürliche deutsche Existenzkonstruktion, die den griechischen Sinn direkt wiedergibt.
- source_word: πλὴν αὐτοῦ
  choice: außer ihm
  rationale: Gibt die ausschließende Bedeutung von πλήν mit Genitiv knapp und genau wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt in εἷς ἐστιν
  choice: »Er ist einer« im Haupttext
  alternative: »Gott ist einer« oder »Es gibt nur einen Gott«
  rationale: Der Kontext identifiziert den Bezug eindeutig als Gott, doch der Vers selbst wiederholt θεός nicht. Die elliptische Wiedergabe wahrt die Form und Spannung des Ausgangstextes; eine Fußnote erläutert den Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und mündlich nachvollziehbar. »Schriftgelehrter« folgt dem etablierten biblischen Sprachgebrauch; die elliptische Gottesbezeichnung wird bewusst erhalten.
