  source_fidelity: 'Die Übersetzung gibt die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: der Schriftgelehrte, die Anrede Jesu, die Bestätigung der Wahrheit seiner Aussage, die elliptische Form »Er ist einer« sowie die ausschließende Aussage »außer ihm ... keinen anderen«. Die Fußnote erläutert die im Griechischen nicht erneut ausgedrückte Referenz sachgerecht.'
  naturalness: »Der Wahrheit entsprechend gesagt« ist zwar verständlich, wirkt in direkter Rede jedoch deutlich schwerfälliger und weniger idiomatisch als eine natürliche moderne Entsprechung. Auch die Verbindung »Gut, Lehrer!« klingt im Deutschen als Reaktion auf eine Aussage etwas abgehackt. »Richtig, Lehrer. Du hast die Wahrheit gesagt« ist würdig, modern und dialogisch natürlich.
  terminology: »Schriftgelehrter« und »Lehrer« sind angemessen. Die bewusste Beibehaltung von »Er ist einer« wahrt die Ellipse des griechischen Textes; die Fußnote verhindert, dass der Bezug im isolierten Vers unklar bleibt.
