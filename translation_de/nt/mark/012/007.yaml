base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: de
  text: 'Doch jene Pächter sagten zueinander[a]: »Das ist der Erbe. Kommt, wir wollen ihn töten, dann wird das Erbe uns gehören.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sagten untereinander«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: Doch jene Weinbauern
  rationale: δέ trägt hier einen milden Gegensatz weiter und wird natürlich mit »Doch« wiedergegeben; ἐκεῖνοι bleibt als »jene« ausdrücklich erhalten. γεωργοί bezeichnet im Kontext die mit dem Weinberg betrauten Pächter; »Weinbauern« ist im Deutschen natürlich und macht den parabelspezifischen landwirtschaftlichen Zusammenhang deutlich.
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: sagten zueinander
  rationale: Die Wendung bezeichnet das Reden innerhalb der Gruppe. »Zueinander« bewahrt den Gedanken gemeinsamer Beratung, ohne sie als bloß inneres Selbstgespräch darzustellen.
- source_word: ὅτι
  choice: Doppelpunkt und direkte Rede
  rationale: ὅτι leitet hier direkte Rede ein; deutsche Zeichensetzung gibt dies natürlicher wieder als ein ausdrückliches »dass«.
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: Das ist der Erbe
  rationale: »Erbe« ist der natürliche rechtliche und familiäre Ausdruck für κληρονόμος. Das Demonstrativpronomen wird für die unmittelbare Identifizierung bewahrt.
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: Kommt, wir wollen ihn töten
  rationale: δεῦτε ist ein auffordernder Zuruf; der hortative Aoristkonjunktiv wird im modernen Deutschen natürlich mit »wir wollen« wiedergegeben. »Töten« bleibt direkt und fügt keine im Verb selbst nicht ausdrücklich enthaltene juristische Wertung hinzu.
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: dann wird das Erbe uns gehören
  rationale: Das anschließende καί drückt im Gedankengang die erwartete Folge aus und wird idiomatisch mit »dann« wiedergegeben. »Uns gehören« bewahrt den betonten Besitzanspruch von ἡμῶν; ein nicht ausdrücklich vorhandenes »sein Erbe« wird nicht ergänzt.
theological_decisions:
- issue: Parabelspezifische Wiedergabe von γεωργοί
  choice: Weinbauern
  alternative: Pächter; Winzer; Bauern
  rationale: Der Kontext verlangt Personen, denen der Weinberg zur Bewirtschaftung überlassen wurde. »Weinbauern« wahrt diesen Kontext in allgemein verständlicher Sprache, ohne eine zusätzliche allegorische Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bedrohlich. »Kommt, wir wollen« bildet die gemeinschaftliche Aufforderung natürlich ab; »dann« verdeutlicht den im Griechischen kontextuell angelegten Folgezusammenhang.
