  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: de
  text: Und du sollst den Herrn, deinen Gott, lieben mit deinem ganzen Herzen und mit deiner ganzen Seele[a] und mit deinem ganzen Verstand[b] und mit deiner ganzen Kraft[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit deinem ganzen Leben“ für „mit deiner ganzen Seele“ (ψυχῆς).'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „mit deinem ganzen Denken“ für „mit deinem ganzen Verstand“ (διανοίας).'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „mit deiner ganzen Stärke“ für „mit deiner ganzen Kraft“ (ἰσχύος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: du sollst ... lieben
  rationale: Der Futur Indikativ hat im Zitat Gebotskraft. „Du sollst“ bewahrt die Form eines Schriftgebots und ist im modernen Standarddeutsch weiterhin natürlich und würdig.
- source_word: κύριον τὸν θεόν σου
  choice: den Herrn, deinen Gott
  rationale: „Herr“ ist die übliche Wiedergabe von κύριος; die Apposition mit Komma gibt die Bundesformel klar und eng am Griechischen wieder.
- source_word: ἐξ ὅλης
  choice: mit deinem ganzen
  rationale: Wörtlich bezeichnet ἐξ den Ausgangspunkt („aus“); bei den genannten menschlichen Fähigkeiten drückt idiomatisches Deutsch mit „mit deinem ganzen“ die völlige Hingabe aus und erhält die wiederholte Totalität.
- source_word: καρδίας
  choice: Herzen
  rationale: „Herz“ ist die etablierte, sachgerechte Wiedergabe für das innere Zentrum des Wollens und Empfindens, ohne den Begriff erklärend einzuengen.
- source_word: ψυχῆς
  choice: Seele
  rationale: ψυχή kann „Seele“, „Leben“ oder „Selbst“ bedeuten. „Seele“ erhält in dieser Reihung die lexikalische Eigenständigkeit und ist im Deutschen verständlich; „Leben“ wird als Alternative vermerkt.
- source_word: διανοίας
  choice: Verstand
  rationale: διάνοια bezeichnet hier das Denk- und Erkenntnisvermögen. „Verstand“ ist im Deutschen präzise und unterscheidet den Begriff klar von „Herz“; „Denken“ bleibt als mögliche Alternative erhalten.
- source_word: ἰσχύος
  choice: Kraft
  rationale: ἰσχύς bezeichnet Kraft oder Stärke. „Kraft“ ist natürlich, knapp und passt zur vertrauten viergliedrigen Formulierung.
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: und ... und ... und ... und
  rationale: Die wiederholten Konjunktionen werden beibehalten, um den kumulativen, nachdrücklichen Rhythmus des griechischen Textes wiederzugeben.
theological_decisions:
- issue: Wiedergabe von κύριος im Zitat des Gebots
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text hat κύριος. „Der Herr“ bildet diesen Wortlaut ab und bewahrt zugleich den Bezug auf Israels Bekenntnis, ohne eine typografische Konvention für den Gottesnamen in den griechischen Text einzutragen.
- issue: Anthropologische Begriffe des viergliedrigen Gebots
  choice: Herz / Seele / Verstand / Kraft
  alternative: Herz / Leben / Denken / Stärke
  rationale: Die vier unterschiedlichen Begriffe bleiben erhalten, statt sie zu einer allgemeinen Aussage über Ganzhingabe zusammenzuziehen. So bleiben die rhetorische Struktur und die mögliche begriffliche Spannung des Textes sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Glieder und das jeweilige „ganzen“ bewahren Nachdruck und Rhythmus des Originals. Die Satzstellung hält das Verb „lieben“ nahe am Gebotsanfang und vermeidet einen schwerfälligen Verbabschluss.
