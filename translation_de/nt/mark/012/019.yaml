- from: '»Lehrer, Mose hat uns vorgeschrieben: Wenn jemandes Bruder stirbt und eine Frau hinterlässt, aber kein Kind, dann soll sein Bruder die Frau nehmen und seinem Bruder Nachkommen erwecken.«[a][b]'
  to: '»Lehrer, Mose[b] hat uns geschrieben: Wenn jemandes Bruder stirbt und eine Ehefrau hinterlässt und kein Kind hinterlässt, soll sein Bruder die Frau heiraten und seinem Bruder Nachkommen verschaffen.«[a]'
  rationale: Die Revision stellt das explizite „schreiben“ des griechischen Textes wieder her, macht beide Vorkommen von „hinterlassen“ sichtbar und verdeutlicht die eheliche Bedeutung von γυνή. Die Rechtsidiomatik von ἐξαναστήσῃ σπέρμα wird in natürlichem modernen Deutsch wiedergegeben und in der Fußnote wörtlich abgesichert. Die Fußnotenanker stehen unmittelbar bei ihrem jeweiligen Bezug.
