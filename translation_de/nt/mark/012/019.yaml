source:
  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: de
  text: '»Lehrer, Mose[b] hat uns geschrieben: Wenn jemandes Bruder stirbt und eine Ehefrau hinterlässt und kein Kind hinterlässt, soll sein Bruder die Frau heiraten und seinem Bruder Nachkommen verschaffen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »seinem Bruder Samen erwecken«; eine Wendung für die Zeugung von Nachkommenschaft im Rahmen der Schwagerehe.'
    reason: lexical_alternative
  - marker: b
    text: Siehe 5. Mose 25,5 zur hier angeführten Vorschrift des Mose.
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Die Anrede gibt διδάσκαλος klar und im heutigen Deutsch natürlich wieder, ohne die zusätzliche Herrschaftsnuance von »Meister« einzutragen.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Mose hat uns vorgeschrieben
  rationale: Im Zusammenhang mit dem angeführten mosaischen Gesetz bezeichnet γράφω nicht nur den Schreibvorgang, sondern die schriftlich festgehaltene Vorschrift. »Uns« bewahrt den Dativ ἡμῖν und den Bezug auf Israel.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: Wenn jemandes Bruder stirbt
  rationale: τινος ist ein unbestimmter Genitiv; »jemandes« hält die Aussage allgemein und bewahrt zugleich den ausdrücklich männlichen Verwandtschaftsbegriff ἀδελφός.
- source_word: καταλίπῃ γυναῖκα
  choice: eine Frau hinterlässt
  rationale: καταλείπω bezeichnet hier das Zurücklassen beim Tod. γυνή kann Frau oder Ehefrau bedeuten; der rechtliche Zusammenhang macht die eheliche Beziehung deutlich, während »Frau« die Formulierung knapp hält.
- source_word: μὴ ἀφῇ τέκνον
  choice: aber kein Kind
  rationale: τέκνον steht im Singular und wird daher formal genau mit »Kind« wiedergegeben. Das adversative »aber« bildet καὶ in seiner hier kontrastierenden Funktion natürlich ab; »hinterlässt« ist aus dem parallelen Zusammenhang mitzudenken.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: dann soll sein Bruder die Frau nehmen
  rationale: Der durch ἵνα ausgedrückte Inhalt der Vorschrift wird idiomatisch mit »soll« wiedergegeben. »Die Frau nehmen« bleibt nahe am griechischen Wortlaut; im Kontext der Schwagerehe bedeutet es, sie zu heiraten.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: Nachkommen erwecken
  rationale: Die Wendung bedeutet im Rahmen der Schwagerehe, einem Verstorbenen Nachkommenschaft zu verschaffen. »Nachkommen« ist verständlicher als das wörtliche »Samen«, während »erwecken« das Bild der griechischen Wendung bewahrt.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: seinem Bruder
  rationale: Der Dativ bezeichnet die Zuordnung beziehungsweise den Begünstigten. Der Tod des Bruders ist bereits aus dem vorausgehenden Bedingungssatz klar.
theological_decisions:
- issue: Rechtliche Bildsprache der Schwagerehe
  choice: »die Frau nehmen und seinem Bruder Nachkommen erwecken«
  alternative: »die Witwe heiraten und für seinen verstorbenen Bruder Kinder zeugen«
  rationale: Die gewählte Fassung macht den ehe- und familienrechtlichen Sinn verständlich, ohne die griechischen Ausdrücke durch eine vollständig erklärende Paraphrase zu ersetzen.
- issue: Geschlechtsspezifische Sprache
  choice: »Bruder«, »Frau« und »Kind«
  alternative: Geschlechtsneutrale Umschreibung mit »Geschwisterteil« oder »Ehepartner«
  rationale: Der griechische Text spricht ausdrücklich von einem Bruder und einer Frau im Rahmen der Schwagerehe. Diese Geschlechtsangaben werden nicht neutralisiert.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist flüssig formuliert, bleibt aber bei den zentralen Rechtsbegriffen nahe am griechischen Text. Sämtliche Fußnotenmarker stehen im Haupttext.
