  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: de
  text: Und er setzte sich dem Opferkasten[a] gegenüber und beobachtete, wie die Menge Kupfergeld in den Opferkasten einwarf. Viele Reiche warfen viel hinein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Schatzkammer“; das griechische Wort kann die Schatzkammer des Tempels, den dazugehörigen Bereich oder die dort aufgestellten Opferbehälter bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: er setzte sich
  rationale: Das vorzeitige Aoristpartizip wird im Deutschen natürlich als koordinierte, der Beobachtung vorausgehende Handlung wiedergegeben.
- source_word: κατέναντι
  choice: gegenüber
  rationale: Bezeichnet die Position direkt gegenüber und entspricht dem räumlichen Szenenaufbau.
- source_word: γαζοφυλάκιον
  choice: Opferkasten
  rationale: Im Zusammenhang des Einwerfens von Geld bezeichnet der Ausdruck am ehesten einen mit dem Tempelschatz verbundenen Sammelbehälter; die mögliche weitere Bedeutung wird in der Fußnote bewahrt.
- source_word: ἐθεώρει
  choice: beobachtete
  rationale: Das Imperfekt schildert eine fortdauernde, aufmerksame Wahrnehmung; im natürlichen deutschen Erzählstil kann dies mit dem Präteritum ausgedrückt werden.
- source_word: πῶς
  choice: wie
  rationale: Bewahrt den möglichen Akzent auf Art und Vorgang des Gebens, statt den Ausdruck auf die bloße Tatsache zu reduzieren.
- source_word: ὁ ὄχλος
  choice: die Menschen
  rationale: Gibt die versammelte Menge in modernem Deutsch natürlich wieder, ohne das Bild einer unpersönlichen Masse zu stark hervortreten zu lassen.
- source_word: βάλλει / ἔβαλλον
  choice: einwarfen / warfen … hinein
  rationale: Im Zusammenhang mit Münzgeld und einem Sammelbehälter ist „einwerfen“ idiomatisch und näher am konkreten Bild von βάλλω als das allgemeinere „hineinlegen“.
- source_word: χαλκόν
  choice: Geld
  rationale: Wörtlich Kupfer beziehungsweise Kupfergeld; hier bezeichnet es Münzgeld allgemein. „Geld“ ist im Deutschen natürlich, während die materielle Nuance nicht entscheidend für den Satz ist.
- source_word: πολλοὶ πλούσιοι
  choice: viele Reiche
  rationale: Eine knappe, natürliche substantivierte Wiedergabe der generisch gebrauchten maskulinen Pluralform.
- source_word: πολλά
  choice: viel
  rationale: Der neutrale Plural bezeichnet im Geldkontext eine große Menge beziehungsweise hohe Beträge; „viel“ erhält die bewusste Entsprechung zu „viele Reiche“.
