review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἐν τῇ ἀναστάσει und ὅταν ἀναστῶσιν als „Bei der Auferstehung, wenn sie auferstehen“ ist quellennah und bewahrt die im Griechischen vorhandene Wiederholung. „Wessen Frau wird sie sein?“ gibt τίνος αὐτῶν ἔσται γυνή idiomatisch und präzise wieder. „Alle“ in „Denn alle sieben“ ist jedoch eine nicht ausdrücklich formulierte Verstärkung; οἱ ἑπτά ist schlicht „die sieben“ und sollte nicht erweitert werden.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch und wahrt einen angemessenen biblischen Registerton. Die Wiederholung von „Auferstehung/auferstehen“ ist zwar stilistisch markant, aber textlich begründet. „Sie hatten sie zur Frau“ ist natürlich genug und erhält den Beziehungszustand statt eines punktuellen Heiratsereignisses.
  terminology: „Auferstehung“ und „auferstehen“ sind für ἀνάστασις und ἀναστῶσιν die passenden etablierten Begriffe. „Frau“ ist im gegebenen ehelichen Kontext die richtige Wiedergabe von γυνή. Die Fußnote ist in ihrer vorliegenden Form nicht sinnvoll, weil ihr angebliches „Oder“ denselben Wortlaut wiederholt; sie wird entfernt.
  issues:
  - severity: low
    issue: „alle“ in „Denn alle sieben“ ergänzt den Ausgangstext.
    rationale: οἱ γὰρ ἑπτά bedeutet „denn die sieben“. Der Kontext lässt erkennen, dass alle sieben Brüder gemeint sind, doch die explizite Quantifizierung „alle“ steht nicht im griechischen Wortlaut.
  - severity: medium
    issue: Die Fußnote bietet keine tatsächliche Alternative.
    rationale: Die Fußnote kündigt mit „Oder“ denselben Wortlaut „wenn sie auferstehen“ an, der bereits im Text steht. Dadurch ist der Anker inhaltlich irreführend und erfüllt keine nachvollziehbare Fußnotenfunktion.
  revised_text: Bei der Auferstehung, wenn sie auferstehen, wessen Frau wird sie sein? Denn die sieben hatten sie zur Frau.
