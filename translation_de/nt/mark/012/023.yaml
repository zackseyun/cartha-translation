  text: ἐν τῇ ἀναστάσει ⸂ὅταν ἀναστῶσιν⸃ τίνος αὐτῶν ἔσται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: de
  text: Bei der Auferstehung, wenn sie auferstehen, wessen Frau wird sie sein? Denn die sieben hatten sie zur Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἀναστάσει
  choice: Bei der Auferstehung
  rationale: Die Wendung bezeichnet hier die endzeitliche Auferstehung, über die mit den Sadduzäern gesprochen wird. Der bestimmte Artikel wird im Deutschen natürlich wiedergegeben.
- source_word: ὅταν ἀναστῶσιν
  choice: wenn sie auferstehen
  rationale: ὅταν mit dem Aorist Konjunktiv bildet hier einen zukunftsbezogenen Temporalsatz. „Auferstehen“ gibt das Verb im Kontext präzise wieder, ohne ein im Griechischen nicht ausdrücklich vorhandenes „wieder“ hinzuzufügen.
- source_word: τίνος αὐτῶν
  choice: wessen
  rationale: Die Verbindung aus interrogativem und partitivem Genitiv wird im Deutschen idiomatisch mit „wessen“ ausgedrückt; aus dem Kontext ist klar, dass nach einem der sieben gefragt wird.
- source_word: ἔσται γυνή
  choice: Frau wird sie sein
  rationale: γυνή bezeichnet hier aufgrund des ehelichen Zusammenhangs die Ehefrau. Die deutsche Frage „Wessen Frau wird sie sein?“ bildet die prädikative Konstruktion natürlich ab.
- source_word: οἱ γὰρ ἑπτὰ
  choice: Denn alle sieben
  rationale: γάρ begründet die Frage. Das ergänzende „alle“ macht im Deutschen den umfassenden Sinn der artikulierten Zahlengruppe klar, ohne eine neue Personengruppe einzuführen.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: hatten sie zur Frau
  rationale: Die Konstruktion ἔχω mit doppeltem Akkusativ bezeichnet das eheliche Verhältnis. „Jemanden zur Frau haben“ ist im Deutschen verständlich, würdevoll und näher am Zustandsausdruck als „heiraten“.
theological_decisions:
- issue: Auferstehungssprache im Streitgespräch mit den Sadduzäern
  choice: Bei der Auferstehung … wenn sie auferstehen
  alternative: Bei der Auferstehung von den Toten … wenn sie wieder auferstehen
  rationale: Die Formulierung wahrt die Aussage über eine künftige Auferstehung, erweitert den griechischen Wortlaut aber weder um „von den Toten“ noch um „wieder“. So bleibt die knappe Ausdrucksweise des Ausgangstextes erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die idiomatische Frageform wird bewahrt; „zur Frau haben“ hält die eheliche Beziehung fest, ohne sie bloß als Heiratsereignis wiederzugeben.
