  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: de
  text: Sie verschlingen die Häuser der Witwen und beten zum Schein lange.[a] Diese werden ein strengeres Urteil erhalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter einem Vorwand lange beten“; auch: „zum Schein lange Gebete sprechen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „ein größeres Urteil“; auch: „eine strengere Verurteilung“ oder „ein strengeres Gericht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: verschlingen
  rationale: Das bildhafte Verb bezeichnet hier die rücksichtslose Aneignung fremden Besitzes. „Verschlingen“ bewahrt die drastische Metapher, ohne sie durch eine bloße Deutung wie „ausbeuten“ zu ersetzen.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: die Häuser der Witwen
  rationale: „Häuser“ gibt den konkreten griechischen Ausdruck wieder; im Zusammenhang können damit auch Hausstand oder Besitz der Witwen gemeint sein, doch diese Auslegung wird nicht in den Haupttext eingetragen.
- source_word: προφάσει
  choice: zum Schein
  rationale: Die Wendung bezeichnet einen Vorwand beziehungsweise eine äußerlich zur Schau gestellte Frömmigkeit. „Zum Schein“ ist knapp, gegenwärtig und lässt den heuchlerischen Charakter erkennen.
- source_word: μακρὰ προσευχόμενοι
  choice: sprechen … lange Gebete
  rationale: μακρά ist adverbial gebraucht und bezeichnet die Dauer des Betens. Die deutsche Formulierung klingt natürlich und bewahrt die Aussage, ohne die Länge näher zu bewerten.
- source_word: λήμψονται
  choice: werden … empfangen
  rationale: Das Futur kündigt den sicheren Empfang des Urteils an. „Empfangen“ entspricht dem feierlich-ernsten Ton des Gerichtswortes.
- source_word: περισσότερον κρίμα
  choice: ein umso härteres Strafurteil
  rationale: κρίμα kann „Urteil“ oder im Kontext ein verurteilendes Strafurteil bedeuten; περισσότερον bezeichnet dessen gesteigertes Maß. „Umso härter“ stellt zugleich den Bezug zum zuvor beschriebenen Verhalten her.
theological_decisions:
- issue: Bedeutung von κρίμα in der Warnung vor religiöser Heuchelei
  choice: Strafurteil
  alternative: Urteil oder Verurteilung
  rationale: Der Zusammenhang und der Komparativ weisen auf ein belastendes, strafendes Gericht hin. „Strafurteil“ macht diese Kraft deutlich, ohne Art, Zeitpunkt oder endgültige Tragweite des göttlichen Gerichts näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische Bildsprache von „verschlingen“ und der konkrete Ausdruck „Häuser der Witwen“ bleiben erhalten. Die griechischen Partizipien werden für einen eigenständig lesbaren deutschen Vers als finite Verben wiedergegeben; der Anschluss an den vorangehenden Kontext bleibt inhaltlich erkennbar.
