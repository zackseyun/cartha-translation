  naturalness: „Sie schicken einige von den Pharisäern und von den Herodianern zu ihm“ ist modernes Standarddeutsch und macht die Entsendung von Angehörigen beider Gruppen klar. „Ihn bei einem Wort zu fangen“ ist eine verständliche, knappe deutsche Entsprechung, die das Bild und den Bezug auf Jesu Rede wahrt.
  terminology: „Pharisäer“ und „Herodianer“ sind die üblichen deutschen Gruppenbezeichnungen. Die Fußnote soll das Jagdbild erläutern, ohne die grammatisch knappe Wendung unnötig zu einer bestimmten Formulierung Jesu auszubauen.
