  text: Καὶ ἀποστέλλουσιν πρὸς αὐτόν τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν ἵνα αὐτὸν ἀγρεύσωσιν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: de
  text: Und sie schicken einige von den Pharisäern und von den Herodianern zu ihm, um ihn bei einem Wort zu fangen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihn durch das, was er sagte, zu fangen“. Das griechische Verb ist ein Ausdruck aus der Jagd und wird hier bildlich gebraucht: Sie wollten ihn aufgrund einer Äußerung von ihm fangen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: sie schicken
  rationale: Das historische Präsens des griechischen Erzählstils wird beibehalten; „schicken“ gibt die Handlung natürlich wieder, ohne die Bedeutung von „entsenden“ unnötig zu verstärken.
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: einige von den Pharisäern und den Herodianern
  rationale: „Einige von“ bildet die partitive Konstruktion ab. Die koordinierte Form bezeichnet Vertreter aus beiden genannten Gruppen, ohne im Deutschen schwerfällig „einige von … und einige von …“ zu wiederholen.
- source_word: Φαρισαίων
  choice: Pharisäern
  rationale: Die im Deutschen übliche Bezeichnung der jüdischen Gruppierung.
- source_word: Ἡρῳδιανῶν
  choice: Herodianern
  rationale: Die im Deutschen übliche Bezeichnung für die mit Herodes verbundene Gruppierung.
- source_word: ἵνα
  choice: um … zu
  rationale: Die deutsche Infinitivkonstruktion drückt den Zweck der Sendung klar und idiomatisch aus.
- source_word: ἀγρεύσωσιν
  choice: in die Falle zu locken
  rationale: Die Wendung bewahrt das Bild des Fangens aus der Jagd und vermittelt zugleich die feindselige Absicht in natürlichem Deutsch.
- source_word: λόγῳ
  choice: mit einem Wort
  rationale: Die instrumentale Bedeutung des Dativs und der Singular werden gewahrt; gemeint ist, Jesus durch eine mündliche Äußerung zu Fall zu bringen.
theological_decisions:
- issue: Das Subjekt des griechischen Pluralverbs bleibt unausgesprochen
  choice: sie
  alternative: die führenden Priester, Schriftgelehrten und Ältesten; die Verantwortlichen
  rationale: Der Vers nennt das Subjekt nicht erneut. „Sie“ bewahrt diese Zurückhaltung, statt eine Identifizierung aus dem vorhergehenden Zusammenhang ausdrücklich in den Text einzutragen.
- issue: Bezug von λόγῳ auf die beabsichtigte Falle
  choice: mit einem Wort
  alternative: durch das, was er sagte
  rationale: Die Hauptfassung bewahrt den knappen Singular und die instrumentale Offenheit des Griechischen; die Fußnote verdeutlicht die im Kontext naheliegende Beziehung auf Jesu eigene Antwort, ohne sie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens und das nicht näher bestimmte Subjekt werden bewahrt; das Jagdbild bleibt erkennbar.
