  text: ἑπτὰ ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος ἔλαβεν γυναῖκα, καὶ ἀποθνῄσκων οὐκ ἀφῆκεν σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: de
  text: Es waren sieben Brüder. Der erste heiratete eine Frau, und als er starb, hinterließ er keine Nachkommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Er hinterließ keinen Samen.“ Das griechische Wort wird hier im Sinn von Nachkommenschaft gebraucht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: Es waren sieben Brüder
  rationale: Natürliche deutsche Wiedergabe des Existenzsatzes; „Brüder“ bewahrt den im Zusammenhang ausdrücklich männlichen Bezug.
- source_word: ὁ πρῶτος
  choice: der erste
  rationale: Bezeichnet die Reihenfolge innerhalb der sieben Brüder; „der älteste“ würde eine nicht ausdrücklich genannte Altersabstufung hinzufügen.
- source_word: ἔλαβεν γυναῖκα
  choice: nahm eine Frau
  rationale: Bewahrt die griechische Heiratswendung in verständlichem, würdigem Deutsch. Gemeint ist, dass er sie zur Frau nahm.
- source_word: ἀποθνῄσκων
  choice: als er starb
  rationale: Gibt das Partizip als natürlichen deutschen Temporalsatz wieder.
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: hinterließ er keine Nachkommen
  rationale: ἀφίημι bezeichnet hier das Hinterlassen beim Tod; σπέρμα ist idiomatisch auf leibliche Nachkommenschaft bezogen. „Nachkommen“ erhält den weiteren Sinn, ohne ihn auf ein einzelnes Kind zu verengen.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt quellennah; das semitisch geprägte „nahm eine Frau“ wird wegen seiner Verständlichkeit und Formnähe beibehalten.
