  yaml_path: translation/nt/mark/012/039.yaml
  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: de
  text: und die Ehrenplätze in den Synagogen und die Ehrenplätze bei den Gastmählern[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »die ersten Liegeplätze«; gemeint sind die ranghöchsten Plätze beim Mahl.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: die Ehrenplätze
  rationale: Das Substantiv bezeichnet die ranghöchsten, angesehensten Sitzplätze in einer Versammlung. »Ehrenplätze« gibt den sozialen Status natürlich und präzise wieder.
- source_word: συναγωγαῖς
  choice: in den Synagogen
  rationale: Hier sind die jüdischen Versammlungsstätten gemeint; »Synagogen« ist die übliche und genaue Wiedergabe.
- source_word: πρωτοκλισίας
  choice: die Ehrenplätze
  rationale: Gemeint sind die bevorzugten Liege- beziehungsweise Sitzplätze bei einem Mahl. »Ehrenplätze« vermittelt ihre gesellschaftliche Bedeutung, ohne modernen Lesern eine unzutreffende Tischordnung nahezulegen.
- source_word: δείπνοις
  choice: bei den Festmählern
  rationale: Das Wort bezeichnet Mahlzeiten und kann in diesem Zusammenhang gesellschaftlich bedeutsame Essen meinen. »Festmähler« passt zum Kontext öffentlichen Ansehens.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die wiederholte Konjunktion bleibt erhalten und führt die begehrten Auszeichnungen aufzählend weiter.
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: in den Synagogen ... bei den Festmählern
  rationale: Die Präposition wird im Deutschen je nach Bezug idiomatisch mit »in« für den Ort und »bei« für die Mahlzeit wiedergegeben.
