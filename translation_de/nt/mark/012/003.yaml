  text: ⸀καὶ λαβόντες αὐτὸν ἔδειραν καὶ ἀπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: de
  text: Da ergriffen sie ihn, schlugen ihn und schickten ihn mit leeren Händen fort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: packten
  rationale: Das Aoristpartizip bezeichnet die erste Handlung der Abfolge. „Packten“ gibt das gewaltsame Ergreifen im Kontext natürlich wieder, ohne die Aussage unnötig zu präzisieren.
- source_word: ἔδειραν
  choice: schlugen
  rationale: δέρω bezeichnet hier körperliches Misshandeln bzw. Schlagen. „Schlugen“ ist klar und lässt offen, ob es sich um eine formelle Auspeitschung handelte.
- source_word: ἀπέστειλαν
  choice: schickten ... fort
  rationale: ἀποστέλλω bedeutet „senden“; im Zusammenhang bezeichnet es das Wegschicken des Knechtes nach der Misshandlung.
- source_word: κενόν
  choice: mit leeren Händen
  rationale: Das prädikativ bzw. adverbial gebrauchte Adjektiv bedeutet wörtlich „leer“ und besagt hier, dass der Knecht nichts erhielt. Die deutsche Wendung „mit leeren Händen“ vermittelt diesen Sinn idiomatisch und präzise.
- source_word: καὶ ... καὶ
  choice: und ... und
  rationale: Die wiederholten Konjunktionen verbinden die Handlungen in schlichter erzählerischer Folge; die parataktische Struktur bleibt im Deutschen erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die dreigliedrige Handlungsfolge des Griechischen bleibt erhalten.
