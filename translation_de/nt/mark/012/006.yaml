  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: de
  text: 'Einen hatte er noch: einen geliebten Sohn.[a] Ihn sandte er als Letzten zu ihnen und sagte: »Sie werden Achtung vor meinem Sohn haben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Sohn, den er sehr liebte“.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch „sich vor jemandem schämen“ oder „jemandem gegenüber Scheu zeigen“ bedeuten; im Zusammenhang ist „Achtung haben“ beziehungsweise „respektieren“ gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: Einen hatte er noch
  rationale: Die Formulierung bewahrt die hervorgehobene Zahl und bringt natürlich zum Ausdruck, dass nach den zuvor gesandten Knechten noch einer übrig war.
- source_word: υἱὸν ἀγαπητόν
  choice: einen geliebten Sohn
  rationale: „Geliebt“ gibt ἀγαπητός präzise wieder und bewahrt den für das Markusevangelium bedeutsamen Anklang an Jesus als den geliebten Sohn, ohne ihn im Text auszudeuten.
- source_word: ἀπέστειλεν αὐτὸν ἔσχατον πρὸς αὐτούς
  choice: Ihn schickte er als Letzten zu ihnen
  rationale: „Als Letzten“ erhält die zugespitzte Stellung des Sohnes am Ende der Sendungen deutlicher als das bloße „zuletzt“.
- source_word: λέγων ὅτι
  choice: und sagte
  rationale: Die griechische Partizipialkonstruktion wird in natürlichem Deutsch als koordinierter Begleitsatz mit direkter Rede wiedergegeben.
- source_word: Ἐντραπήσονται τὸν υἱόν μου
  choice: Vor meinem Sohn werden sie Achtung haben
  rationale: Das Verb bezeichnet hier im Zusammenhang die erwartete respektvolle Zurückhaltung oder Ehrerbietung. Die Konstruktion mit „vor“ lässt zugleich den Grundton von Beschämung oder Scheu anklingen.
theological_decisions:
- issue: Christologischer Anklang von „geliebter Sohn“
  choice: Die Wendung „einen geliebten Sohn“ bleibt ohne erklärende Erweiterung im Haupttext stehen.
  alternative: einen Sohn, den er sehr liebte
  rationale: Die wörtlichere Wendung bewahrt den markinischen Anklang an die Bezeichnung Jesu als geliebten Sohn, ohne eine christologische Deutung ausdrücklich in das Gleichnis einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die leicht markierte Anfangsstellung „Einen hatte er noch“ bewahrt die Betonung des einzigen noch verbleibenden Gesandten; die direkte Rede bleibt knapp und eindringlich.
