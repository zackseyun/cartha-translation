id: MRK.12.28
reference: Mark 12:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: de
  text: 'Einer der Schriftgelehrten kam hinzu und hörte, wie sie miteinander diskutierten. Als er erkannte, dass Jesus ihnen gut geantwortet hatte, fragte er ihn: »Welches Gebot ist das erste von allen[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das wichtigste von allen« oder »das an erster Stelle stehende«.'
    reason: 'Lexikalische Alternative: πρώτη kann hier Vorrang oder höchste Bedeutung ausdrücken.'
lexical_decisions:
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: Der etablierte deutsche Ausdruck bezeichnet im Evangelienkontext anerkannte jüdische Fachleute für Schrift und Gesetz, ohne ihre Aufgabe unnötig einzuengen.
- source_word: προσελθὼν
  choice: kam hinzu
  rationale: Gibt die Bewegung des Herantretens natürlich und knapp wieder.
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: hörte, wie sie miteinander diskutierten
  rationale: συζητέω bezeichnet hier eine öffentliche Erörterung oder Debatte; »diskutierten« wahrt dies, ohne unnötig Feindseligkeit anzudeuten.
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: als er erkannte, dass Jesus ihnen gut geantwortet hatte
  rationale: »Erkannte« gibt die wahrnehmende Beurteilung wieder; der Name »Jesus« klärt im Deutschen den sonst missverständlichen Pronomenbezug, ohne den Sinn zu verändern.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: Schlichte und natürliche Wiedergabe des Verbs für Fragen.
- source_word: Ποία
  choice: Welches
  rationale: Die Frage zielt auf die Bestimmung eines Gebots unter mehreren.
- source_word: ἐντολή
  choice: Gebot
  rationale: »Gebot« ist die geläufige und sachlich passende deutsche Bezeichnung im Zusammenhang des mosaischen Gesetzes.
- source_word: πρώτη πάντων
  choice: das erste von allen
  rationale: Bewahrt die Rang- und Erstheitsaussage des griechischen πρῶτος, ohne sie im Haupttext ausdrücklich als »wichtigste« auszulegen.
theological_decisions:
- issue: Bedeutung von πρώτη in der Frage nach dem Gebot
  choice: das erste von allen
  alternative: das wichtigste von allen; das vornehmste von allen; steht an erster Stelle
  rationale: πρώτη kann sowohl Erstheit als auch Vorrang bezeichnen. Die wörtlich nahe Formulierung bewahrt diese Bedeutungsweite und überlässt dem folgenden Kontext ihre nähere Bestimmung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzfolge wurde gegenüber der griechischen Partizipialkonstruktion gegliedert, um natürliche Lesbarkeit zu erreichen; die sachliche Spannung von »das erste« bleibt erhalten.
