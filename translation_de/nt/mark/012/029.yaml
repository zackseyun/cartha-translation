  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: de
  text: 'Jesus antwortete: „Das erste ist: Höre, Israel: Der Herr[b], unser Gott, der Herr ist einer[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Der Herr, unser Gott, ist ein Herr“ oder: „Der Herr ist unser Gott, der Herr allein.“ Das Griechische greift Deuteronomium 6,4 auf und kann Gottes Einheit, seinen ausschließlichen Anspruch oder beides betonen.'
    reason: alternative_reading
  - marker: b
    text: Diese Zeile zitiert das Schma Jisrael (Deuteronomium 6,4). „Herr“ gibt hier das griechische κύριος wieder, das in der Septuaginta für den Gottesnamen JHWH steht.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: antwortete
  rationale: Die übliche, natürliche Wiedergabe von ἀποκρίνομαι im Dialog; der antwortende Charakter bleibt erhalten.
- source_word: Πρώτη
  choice: Das erste
  rationale: Das feminine Adjektiv steht substantivisch und bezieht sich auf das aus dem Kontext ergänzbare Gebot. Die knappe Form vermeidet eine unnötige ausdrückliche Ergänzung.
- source_word: Ἄκουε
  choice: Höre
  rationale: Bewahrt als Auftakt des Schema Israel aus Deuteronomium 6,4 dessen feierlichen und bundestheologischen Klang und ist zugleich modernes Standarddeutsch.
- source_word: Ἰσραήλ
  choice: Israel
  rationale: Der Eigenname wird in seiner üblichen deutschen Form als direkte Anrede wiedergegeben.
- source_word: κύριος
  choice: der Herr
  rationale: Entspricht dem griechischen κύριος. Im Zitat aus Deuteronomium 6,4 steht es zugleich für die Wiedergabe des Gottesnamens JHWH in der Septuaginta; dieser Hintergrund wird in einer Fußnote erläutert.
- source_word: ὁ θεὸς ἡμῶν
  choice: unser Gott
  rationale: Direkte und natürliche Wiedergabe der griechischen Nominalgruppe.
- source_word: εἷς
  choice: einer
  rationale: Das prädikative Zahlwort wird in Kongruenz mit dem maskulinen Titel „Herr“ als „einer“ wiedergegeben. So bleibt die griechische Aussage knapp und ihre mögliche Betonung von Einheit beziehungsweise Einzigkeit offen.
theological_decisions:
- issue: Wiedergabe des Schlusses des Schema Israel und Bewahrung seiner theologischen Spannung
  choice: Der Herr, unser Gott, der Herr ist einer
  alternative: 'Der Herr, unser Gott, ist ein Herr; oder: Der Herr ist unser Gott, der Herr allein'
  rationale: Die gewählte Fassung folgt eng der griechischen Wortfolge κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν und bewahrt die Spannung zwischen Gottes Einheit und seinem ausschließlichen Anspruch. Die idiomatisch möglichen Alternativen werden in der Fußnote genannt, ohne die Mehrdeutigkeit einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Höre, Israel“ bewahrt die bekannte feierliche Form des Schema, ohne das im Deutschen altertümlich wirkende Anredewort „o“. Die Satzstellung bleibt bewusst nahe am griechischen Zitat.
