source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: de
  text: 'Habt ihr nicht einmal diese Schriftstelle gelesen: »Der Stein, den die Bauleute verworfen haben, der ist zum Eckstein[a] geworden«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Haupt der Ecke«; möglicherweise ist der wichtigste Eckstein oder ein oberer Abschlussstein gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφήν
  choice: Schriftstelle
  rationale: Im neutestamentlichen Zusammenhang bezeichnet γραφή einen Text der Heiligen Schrift. »Diese Schriftstelle« ist im modernen Deutschen natürlicher als »diese Schrift« und passt zur folgenden Einzelzitierung.
- source_word: ἀνέγνωτε
  choice: habt ihr ... gelesen
  rationale: Das griechische Aorist-Indikativ wird in dieser rhetorischen Frage idiomatisch mit dem deutschen Perfekt wiedergegeben.
- source_word: οὐδὲ
  choice: nicht einmal
  rationale: οὐδέ verstärkt die Verneinung und verleiht der Frage einen tadelnden Nachdruck.
- source_word: Λίθον
  choice: Der Stein
  rationale: Obwohl im Griechischen ohne Artikel, ist der aus Psalm 118 zitierte Stein bestimmt gemeint; im Deutschen ist daher der bestimmte Artikel angemessen.
- source_word: ἀπεδοκίμασαν
  choice: verworfen haben
  rationale: ἀποδοκιμάζω bezeichnet die Ablehnung nach Prüfung. »Verwerfen« bewahrt diesen stärkeren Sinn besser als das allgemeinere »ablehnen«.
- source_word: οἱ οἰκοδομοῦντες
  choice: die Bauleute
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die bauen. »Bauleute« ist knapp, natürlich und bewahrt das Bild.
- source_word: ἐγενήθη
  choice: ist ... geworden
  rationale: Das deutsche Perfekt gibt das abgeschlossene Geschehen und dessen fortbestehendes Ergebnis natürlich wieder.
- source_word: εἰς κεφαλὴν γωνίας
  choice: zum Eckstein
  rationale: Wörtlich steht »zum Haupt der Ecke«. »Eckstein« ist die etablierte, verständliche Wiedergabe, ohne eindeutig zwischen einem tragenden Grundstein und einem möglichen oberen Abschlussstein zu entscheiden.
theological_decisions:
- issue: Messianische Verwendung des Bildes aus Psalm 118,22
  choice: Das Bild von Stein, Bauleuten und Eckstein bleibt ohne erklärende Erweiterung im Haupttext erhalten.
  alternative: Den Stein in der Übersetzung ausdrücklich als den Messias oder Jesus bezeichnen.
  rationale: Der Kontext bezieht das Psalmwort auf Jesus, doch der Wortlaut selbst spricht bildhaft. Die Übersetzung sollte diese Bildsprache und ihre theologische Spannung bewahren, statt ihre Deutung in den Text einzutragen.
- issue: Bedeutung von κεφαλὴ γωνίας
  choice: Eckstein mit einer Fußnote zur wörtlichen und möglichen alternativen Auffassung.
  alternative: Haupt der Ecke; Schlussstein; oberster Eckstein.
  rationale: Die genaue architektonische Funktion der Wendung ist nicht völlig sicher. »Eckstein« ist verständlich und traditionsnah, während die Fußnote die echte lexikalische Offenheit sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Schärfe von οὐδέ wird durch »nicht einmal« bewahrt. Das Zitat bleibt knapp und bildhaft; »Bauleute« wirkt natürlicher als »die Bauenden«.
