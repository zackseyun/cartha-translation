  text: καὶ ὁ δεύτερος ἔλαβεν αὐτήν, καὶ ἀπέθανεν ⸂μὴ καταλιπὼν⸃ σπέρμα, καὶ ὁ τρίτος ὡσαύτως·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: de
  text: Und der zweite nahm sie zur Frau[a] und starb, ohne Nachkommen zu hinterlassen; und der dritte ebenso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nahm sie“. Gemeint ist, dass er sie heiratete.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: der zweite
  rationale: Der substantivierte Ordinalausdruck wird knapp wiedergegeben. „Bruder“ ist aus dem Zusammenhang klar, steht hier jedoch nicht ausdrücklich.
- source_word: ἔλαβεν αὐτήν
  choice: nahm sie zur Frau
  rationale: λαμβάνω bedeutet wörtlich „nehmen“, bezeichnet in diesem Zusammenhang aber die Eheschließung mit der Witwe. Die feste deutsche Wendung ist natürlich und bewahrt zugleich das Bild des griechischen Ausdrucks.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Schlichte und direkte Wiedergabe des Aorists von ἀποθνῄσκω, entsprechend dem nüchternen Erzählstil.
- source_word: μὴ καταλιπὼν
  choice: ohne … zu hinterlassen
  rationale: Die Partizipialkonstruktion mit μή bezeichnet den begleitenden Umstand beziehungsweise das Ergebnis beim Tod; die deutsche Infinitivkonstruktion gibt dies idiomatisch wieder.
- source_word: σπέρμα
  choice: Nachkommen
  rationale: σπέρμα meint hier im Zusammenhang der Leviratsehe menschliche Nachkommenschaft. „Nachkommen“ wahrt die kollektive Offenheit besser als das enger gefasste „Kind“ und ist verständlicher als das wörtliche „Samen“.
- source_word: ὁ τρίτος ὡσαύτως
  choice: ebenso der dritte
  rationale: Die knappe Ellipse des Griechischen bleibt erhalten; die zuvor genannten Handlungen sind aus dem Zusammenhang zu ergänzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählung und die Ellipse am Versende werden bewahrt; „nahm sie zur Frau“ macht den ehelichen Sinn ohne konfessionelle Auslegung deutlich.
