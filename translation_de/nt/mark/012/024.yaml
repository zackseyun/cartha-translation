source:
  edition: SBLGNT
  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: de
  text: 'Jesus sagte zu ihnen: »Irrt ihr[a] nicht deshalb, weil ihr weder die Schriften kennt noch die Kraft Gottes?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geht ihr nicht deshalb in die Irre …?«'
    reason: 'Lexikalische Alternative: πλανᾶσθε kann neben »ihr irrt« auch im Sinn von »ihr geht in die Irre« verstanden werden.'
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: Jesus sagte zu ihnen
  rationale: φημί führt hier direkte Rede ein; »sagte zu ihnen« gibt die schlichte Erzählfunktion natürlich wieder, ohne das nicht ausdrücklich bezeichnete »antwortete« hinzuzufügen.
- source_word: Οὐ διὰ τοῦτο
  choice: nicht deshalb
  rationale: οὐ kennzeichnet eine rhetorische Frage, die Zustimmung erwartet; διὰ τοῦτο bezeichnet den Grund. Die Verbindung »Irrt ihr nicht deshalb ...?« ist im Deutschen natürlich und wahrt die kausale Aussage.
- source_word: πλανᾶσθε
  choice: irrt ihr
  rationale: Die mediale/passive Form kann ein Sich-Irren oder Irregeführtwerden ausdrücken. Im Zusammenhang mit dem mangelnden Verständnis von Schrift und Auferstehung ist »irrt ihr« prägnant, lässt aber die Stärke des Tadels bestehen.
- source_word: μὴ εἰδότες
  choice: weil ihr ... nicht kennt
  rationale: Das negierte Partizip nennt den Grund des Irrtums. Ein deutscher Kausalsatz macht diesen Zusammenhang klar und idiomatisch.
- source_word: τὰς γραφὰς
  choice: die Schriften
  rationale: Der Plural γραφαί bezeichnet im jüdischen und frühchristlichen Sprachgebrauch die anerkannten heiligen Schriften. »Die Schriften« ist sachlich genau und vermeidet eine unnötige Ergänzung.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: noch die Kraft Gottes
  rationale: δύναμις bezeichnet Gottes Macht oder Kraft. »Kraft Gottes« ist eine unmittelbare, würdige Wiedergabe und steht ausgewogen neben »die Schriften«.
theological_decisions:
- issue: Art des durch πλανᾶσθε bezeichneten Irrtums
  choice: »irrt ihr« bezeichnet einen wirklichen Irrtum, ohne festzulegen, ob vor allem intellektuelles Missverständnis oder geistliches Irregehen gemeint ist.
  alternative: »werdet ihr irregeführt« oder »geht ihr in die Irre«
  rationale: Das Griechische erlaubt sowohl die Aussage eines Irrtums als auch die Vorstellung des Irregehens. Der unmittelbare Zusammenhang betont die Unkenntnis der Schriften und der Kraft Gottes; die Übersetzung verschärft dies nicht zu einer ausdrücklich fremdverursachten Täuschung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die rhetorische Frage und der kausale Zusammenhang bleiben erhalten; »die Schriften« und »die Kraft Gottes« folgen eng der griechischen Ausdrucksweise.
