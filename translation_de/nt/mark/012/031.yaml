source:
  edition: SBLGNT
  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: de
  text: 'Das zweite lautet: »Du sollst deinen Nächsten lieben wie dich selbst.« Kein anderes Gebot ist größer als diese.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische »diese« steht im Plural und bezieht sich im Zusammenhang wahrscheinlich auf die beiden Gebote zusammen.
    reason: lexical_alternative
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: Das zweite lautet
  rationale: Die elliptische griechische Wendung meint das zweite Gebot. Die Formulierung ist im Deutschen natürlich und bewahrt die Hervorhebung des »zweiten«.
- source_word: Ἀγαπήσεις
  choice: Du sollst lieben
  rationale: Der Futur Indikativ hat im Schriftzitat gebietende Funktion. »Du sollst« bewahrt sowohl den Gebotscharakter als auch den vertrauten biblischen Klang.
- source_word: τὸν πλησίον σου
  choice: deinen Nächsten
  rationale: »Nächster« ist in diesem ethischen und schriftbezogenen Zusammenhang die sachgemäße deutsche Wiedergabe und erhält den Bezug zu 3. Mose 19,18.
- source_word: ὡς σεαυτόν
  choice: wie dich selbst
  rationale: Die knappe Vergleichsform entspricht dem Griechischen, ohne das nicht ausdrücklich wiederholte Verb erklärend hinzuzufügen.
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: Kein anderes Gebot ist größer als diese beiden
  rationale: Die Wiedergabe erhält den Komparativ und macht den natürlichen pluralischen Rückbezug von τούτων auf die beiden im Kontext genannten Gebote im Deutschen verständlich.
- source_word: ἐντολή
  choice: Gebot
  rationale: »Gebot« ist die übliche, präzise und würdevolle Wiedergabe im Kontext der Tora.
theological_decisions:
- issue: Bezug von τούτων (»diesen«) im Schlusssatz
  choice: Bezug auf die beiden Gebote zusammen
  alternative: Wörtlich »als diese«, wobei der Rückbezug formal unbestimmter bleibt
  rationale: Der Plural weist im Zusammenhang am natürlichsten auf das erste und das zweite Gebot. »Diese beiden« verdeutlicht den grammatischen Bezug, ohne die beiden Gebote zu einem einzigen zusammenzuziehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Das traditionelle »Du sollst« erhält den Charakter des Schriftzitats; »diese beiden« vermeidet im Deutschen einen unklaren Rückbezug.
