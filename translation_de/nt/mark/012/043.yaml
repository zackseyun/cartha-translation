source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: de
  text: 'Und er rief seine Jünger zu sich und sagte zu ihnen: „Amen, ich sage euch: Diese arme Witwe hat mehr eingelegt als alle, die etwas in den Opferkasten[a] einlegen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Schatzkammer des Tempels“. Das griechische Wort kann den Schatzbereich des Tempels oder die dortigen Behälter für Geldgaben bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: er rief ... zu sich
  rationale: Das reflexive Verb bezeichnet hier, dass Jesus seine Jünger zu sich ruft. Die koordinierte Wiedergabe ist im Deutschen natürlich und lässt die Abfolge erkennen, ohne sie stärker als im griechischen Partizip festzulegen.
- source_word: μαθητὰς
  choice: Jünger
  rationale: Die etablierte und kontextgerechte deutsche Wiedergabe bezeichnet die Menschen, die Jesus nachfolgen und von ihm lernen.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Bewahrt Jesu charakteristische feierliche Einleitungsformel und gibt Ἀμήν als in modernem Bibeldeutsch verständliches Lehnwort wieder.
- source_word: χήρα ... πτωχὴ
  choice: diese arme Witwe
  rationale: Direkte, natürliche Wiedergabe ohne die Armut durch Begriffe wie „mittellos“ oder „verarmt“ über den Wortlaut hinaus zu steigern.
- source_word: πλεῖον πάντων
  choice: mehr ... als alle
  rationale: Bewahrt den offenen Vergleich des griechischen Textes. Der folgende Vers erläutert dessen Maßstab; dieser Vers selbst wird nicht interpretierend erweitert.
- source_word: ἔβαλεν
  choice: hat ... eingelegt
  rationale: Das Perfekt klingt in Jesu gegenwärtiger Bewertung der abgeschlossenen Gabe natürlich. „Einlegen“ passt idiomatisch zum Einwerfen einer Gabe in einen Opferkasten.
- source_word: τῶν βαλλόντων
  choice: die etwas ... einlegen
  rationale: Das Präsens bewahrt den durativen beziehungsweise gegenwärtigen Charakter des Partizips. „Etwas“ macht im Deutschen die Ergänzung natürlich, ohne Art oder Höhe der Gaben festzulegen.
- source_word: γαζοφυλάκιον
  choice: Opferkasten
  rationale: Im unmittelbaren Kontext bezeichnet das Wort die Einrichtung im Tempel, in die Gaben eingelegt wurden. „Opferkasten“ ist für heutige Leser konkreter als das mehrdeutige „Schatzkammer“; die Fußnote nennt den weiteren Bedeutungsrahmen.
theological_decisions:
- issue: Maßstab der Aussage, die Witwe habe „mehr“ eingelegt
  choice: Der Haupttext behält den uneingeschränkten Vergleich „mehr ... als alle“ bei.
  alternative: Den Vergleich ausdrücklich als relativ zur Armut, als Anteil am Besitz oder als qualitative Wertung auslegen.
  rationale: Vers 44 erklärt die paradoxe Wertung, doch Vers 43 selbst nennt den Maßstab nicht ausdrücklich. Die Übersetzung bewahrt deshalb die Spannung und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wörtlich geprägte Formel „Amen, ich sage euch“ wahrt den markanten Ton Jesu; Satzbau und Wortwahl bleiben zugleich allgemein verständlich.
