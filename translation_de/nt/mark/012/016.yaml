  text: οἱ δὲ ἤνεγκαν. καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή; οἱ δὲ εἶπαν αὐτῷ· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: de
  text: 'Da brachten sie einen[a]. Und er sagt zu ihnen: »Wessen Bild ist das, und wessen Aufschrift ist es?« Sie antworteten ihm: »Des Kaisers.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Da brachten sie ihn.« Gemeint ist aus dem vorherigen Zusammenhang der Denar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: Da brachten sie einen
  rationale: Das Verb bedeutet »bringen«; das im Griechischen unausgesprochene Objekt ergibt sich aus dem vorherigen Vers als Denar. Das deutsche Pronomen »einen« nimmt die maskuline Münzbezeichnung natürlich auf, ohne das Objekt ausdrücklich zu wiederholen.
- source_word: λέγει
  choice: er sagt
  rationale: Das Präsens wird als markinisches historisches Präsens beibehalten und verleiht der Erzählung ihre unmittelbare Wirkung.
- source_word: Τίνος
  choice: Wessen
  rationale: Der interrogative Genitiv fragt hier nach Zugehörigkeit beziehungsweise Zuordnung; »wessen« ist die idiomatische deutsche Entsprechung.
- source_word: εἰκών
  choice: Bild
  rationale: »Bild« bezeichnet passend und allgemein verständlich die bildliche Darstellung auf der Münze.
- source_word: ἐπιγραφή
  choice: Aufschrift
  rationale: »Aufschrift« gibt die eingeprägte Schrift auf einer Münze präzise und allgemein verständlich wieder.
- source_word: Καίσαρος
  choice: des Kaisers
  rationale: Der Genitiv beantwortet die Frage nach der Zuordnung. »Kaiser« ist im Deutschen die geläufige Wiedergabe des als Herrschertitel gebrauchten Καῖσαρ.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Das historische Präsens bleibt erhalten; die knappe dialogische Form des griechischen Textes wird gewahrt.
