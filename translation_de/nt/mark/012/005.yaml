source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: de
  text: 'Und er schickte noch einen; auch ihn töteten sie. Und er schickte viele andere: Von ihnen schlugen sie einige, andere töteten sie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: noch einen
  rationale: Im fortlaufenden Zusammenhang bezeichnet ἄλλον einen weiteren Knecht in der Reihe. „Noch einen“ ist im modernen Deutsch natürlicher als „einen anderen“ und vermeidet den möglichen Eindruck, es gehe um einen andersartigen Knecht.
- source_word: ἀπέστειλεν
  choice: er schickte
  rationale: Das Aoristverb bezeichnet schlicht das Senden. „Er schickte“ ist klar, natürlich und wahrt den Erzählfluss.
- source_word: κἀκεῖνον
  choice: auch ihn
  rationale: Die Verschmelzung von καί und ἐκεῖνον enthält sowohl den additiven Sinn als auch den Rückbezug auf den eben genannten Knecht. „Auch ihn“ gibt beides knapp und idiomatisch wieder.
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: sie töteten
  rationale: ἀποκτείνω bedeutet hier unmittelbar „töten“. Die einheitliche Wiedergabe erhält die Wiederholung und die zunehmende Gewalt der Erzählung.
- source_word: πολλοὺς ἄλλους
  choice: viele weitere
  rationale: Gemeint sind zahlreiche zusätzliche Knechte. „Viele weitere“ passt natürlich zur fortgesetzten Reihe der Gesandten.
- source_word: οὓς μὲν ... οὓς δὲ
  choice: die einen ... die anderen
  rationale: Diese deutsche Korrelativkonstruktion gibt die Verteilung der unterschiedlichen Misshandlungen auf zwei Gruppen präzise und idiomatisch wieder.
- source_word: δέροντες
  choice: sie schlugen
  rationale: δέρω bezeichnet hier Schlagen beziehungsweise Misshandeln. „Schlugen“ bewahrt die Bedeutungsbreite, ohne eine förmliche Auspeitschung vorauszusetzen.
theological_decisions:
- issue: Wiedergabe der verkürzten Konstruktion καὶ πολλοὺς ἄλλους
  choice: „Dann schickte er viele weitere“ mit wiederholtem Prädikat
  alternative: „und viele andere – die einen schlagend, die anderen tötend“
  rationale: Im Griechischen hängt „viele andere“ elliptisch vom zuvor genannten „schickte“ ab. Das erneute Aussprechen des Verbs macht diesen Zusammenhang im Deutschen verständlich, ohne eine zusätzliche Handlung oder theologische Deutung einzuführen.
- issue: Wiedergabe der partizipialen Zusammenfassung
  choice: 'Finite Verben: „Die einen schlugen sie, die anderen töteten sie“'
  alternative: 'Partizipien: „die einen schlagend, die anderen tötend“'
  rationale: Die griechischen Präsenspartizipien fassen die wiederholte Behandlung der vielen Gesandten zusammen. Finite Verben geben die verteilende Struktur in natürlichem modernem Deutsch wieder und legen keinen vom Text nicht verlangten zeitlichen Unterschied fest.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Erzähldeutsch. Die knappen Hauptsätze erhalten das Tempo und die Härte der griechischen Darstellung; unnötig fachsprachliche oder konfessionell geprägte Ausdrücke werden vermieden.
