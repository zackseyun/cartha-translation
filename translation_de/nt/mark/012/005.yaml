revisions:
- from: 'Und er schickte noch einen; auch ihn töteten sie. Dann schickte er viele weitere: Die einen schlugen sie, die anderen töteten sie.'
  to: 'Und er schickte noch einen; auch ihn töteten sie. Und er schickte viele andere: Von ihnen schlugen sie einige, andere töteten sie.'
  rationale: Die Revision stellt im letzten Satz eindeutig wieder her, dass dieselben Gegner die Handelnden sind und dass „einige“ und „andere“ die weiteren Gesandten bezeichnen. Sie bewahrt die griechische Ellipse nicht künstlich, sondern ergänzt das im Deutschen erforderliche Verb „schickte“. Die einfache Verbindung „Und“ vermeidet eine nicht notwendige Verstärkung der zeitlichen Abfolge.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:42:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wiederholte Tötung grundsätzlich wieder. Im letzten Satz kehrt jedoch die Formulierung „Die einen schlugen sie“ die Rollen syntaktisch um: Als Subjekt stehen dadurch „die einen“ (die Gesandten), während im Griechischen die Pächter weiterhin handeln und einige der weiteren Gesandten schlagen bzw. töten.'
  naturalness: „Und er schickte noch einen; auch ihn töteten sie“ ist natürliches modernes Erzähldeutsch. Die zweite Satzhälfte ist in der vorliegenden Wortstellung jedoch nicht nur missverständlich, sondern grammatisch in der falschen Handlungsrichtung. „Von ihnen schlugen sie einige, andere töteten sie“ ist klar und idiomatisch.
  terminology: „schickte“, „töteten“ und „schlugen“ sind angemessene, quellentreue Wiedergaben. „Viele weitere“ kann die elliptisch mit ἀπέστειλεν verbundene Gruppe bezeichnen; „andere“ ist hier noch unmittelbarer an πολλοὺς ἄλλους. Keine theologisch geprägte Terminologie ist betroffen.
  issues:
  - severity: high
    issue: Vertauschung von Handelnden und Betroffenen im verteilenden Schlusssatz
    rationale: „Die einen schlugen sie, die anderen töteten sie“ macht „die einen/die anderen“ zu den Handelnden. Die griechischen Partizipien δέροντες und ἀποκτέννοντες beziehen sich dagegen auf die weiterhin vorausgesetzten Pächter; οὓς μὲν ... οὓς δὲ bezeichnet die unterschiedlichen Gruppen der von ihnen behandelten weiteren Gesandten.
  - severity: low
    issue: „Dann“ ist gegenüber καὶ leicht stärker sequenzierend
    rationale: Das einfache καὶ verbindet die nächste Angabe; ein zusätzliches „Dann“ ist nicht nötig. Die Reihung lässt sich ohne Bedeutungsverlust enger am Ausgangstext formulieren.
  revised_text: 'Und er schickte noch einen; auch ihn töteten sie. Und er schickte viele andere: Von ihnen schlugen sie einige, andere töteten sie.'
  revised_footnotes: []
