  naturalness: „Vom Herrn ist dies geschehen“ ist in modernem, würdigem Standarddeutsch als Psalmzitat natürlich und klar. Die Inversion trägt den gehobenen Zitatcharakter, ohne unverständlich oder unnötig archaisch zu wirken.
