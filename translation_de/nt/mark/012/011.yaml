id: MRK.12.11
reference: Mark 12:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: de
  text: Vom Herrn ist dies geschehen[a], und es ist wunderbar in unseren Augen.«[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Durch den Herrn ist dies geschehen.« Die griechische Wendung kann Herkunft oder Urheberschaft ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: Dieses Wort zitiert Psalm 118,23.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: vom Herrn
  rationale: παρά mit dem Genitiv bezeichnet hier Herkunft bzw. Ursprung. »Vom Herrn« bewahrt diese Nuance und kann im Deutschen zugleich sein Wirken anklingen lassen.
- source_word: ἐγένετο
  choice: ist … geschehen
  rationale: Die feste Wendung »Vom Herrn ist dies geschehen« gibt das Zustandekommen natürlich und würdig wieder, ohne den Vorgang als zufällig erscheinen zu lassen.
- source_word: αὕτη
  choice: dies
  rationale: Das feminine Demonstrativpronomen verweist auf den zuvor genannten Sachverhalt, dass der verworfene Stein zum Eckstein geworden ist. »Dies« lässt den Bezug wie im Griechischen unausgeführt.
- source_word: θαυμαστὴ
  choice: wunderbar
  rationale: »Wunderbar« bezeichnet etwas staunenswertes und bewahrt den gehobenen Klang des Psalmzitats, ohne im heutigen Deutsch unnatürlich zu wirken.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: in unseren Augen
  rationale: Die bildhafte semitisch-griechische Wendung bleibt erhalten und ist im Deutschen verständlich; gemeint ist »für uns« bzw. »in unserer Wahrnehmung«.
theological_decisions:
- issue: Wiedergabe von κύριος in einem auf Gott bezogenen Psalmzitat
  choice: der Herr
  alternative: der HERR
  rationale: Der neutestamentliche griechische Text bietet κύριος. Daher steht im Haupttext »Herr«; der alttestamentliche Hintergrund mit dem Gottesnamen wird nicht stillschweigend in die Übersetzung eingetragen.
- issue: Herkunft oder Urheberschaft in παρὰ κυρίου
  choice: vom Herrn
  alternative: durch den Herrn
  rationale: Die griechische Präposition mit Genitiv kann Herkunft oder Urheberschaft ausdrücken. »Vom Herrn« hält die Herkunftsnuance im Vordergrund, ohne Gottes Wirken auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Bildsprache des Psalmzitats. Das schließende Anführungszeichen setzt das bereits im vorherigen Vers begonnene Zitat voraus.
