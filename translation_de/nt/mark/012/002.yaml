source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: de
  text: Zur rechten Zeit schickte er einen Sklaven zu den Weinbauern, damit der Besitzer von den Weinbauern einen Teil der Früchte des Weinbergs erhielte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Natürliche erzählende Wiedergabe des Aorists von ἀποστέλλω; sie bezeichnet die Entsendung ohne unnötig gehobenen Ton.
- source_word: γεωργοὺς / γεωργῶν
  choice: Weinbauern
  rationale: γεωργός bezeichnet Menschen, die Land bearbeiten. Im Zusammenhang eines Weinbergs ist „Weinbauern“ die natürliche spezifische Wiedergabe; ein Pachtverhältnis wird vom Wort selbst nicht ausdrücklich bezeichnet.
- source_word: τῷ καιρῷ
  choice: zur gegebenen Zeit
  rationale: καιρός bezeichnet hier die passende beziehungsweise festgesetzte Zeit, vermutlich die Erntezeit, ohne dass der griechische Text dies ausdrücklich ausführt.
- source_word: δοῦλον
  choice: Sklaven
  rationale: δοῦλος bezeichnet in diesem sozialen Zusammenhang einen unfreien Menschen im Dienst des Besitzers. „Sklave“ wahrt diesen Status deutlicher als das allgemeinere „Diener“.
- source_word: ἵνα ... λάβῃ
  choice: damit er ... erhielte
  rationale: Die Formulierung gibt den Zweck der Sendung und die abhängige Verbform in idiomatischem Deutsch wieder.
- source_word: παρὰ τῶν γεωργῶν
  choice: von den Weinbauern
  rationale: παρά mit Genitiv kennzeichnet hier die Quelle, von der der Ertrag entgegengenommen werden soll.
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: einen Teil von den Früchten des Weinbergs
  rationale: 'ἀπό mit Genitiv hat hier einen partitiven Sinn: Der Beauftragte soll etwas aus dem Gesamtertrag erhalten. „Einen Teil“ macht dies verständlich, ohne den nicht ausdrücklich genannten Gedanken eines vertraglichen Anteils einzuführen.'
- source_word: ἀμπελῶνος
  choice: Weinbergs
  rationale: „Weinberg“ ist die übliche und sachlich genaue deutsche Entsprechung von ἀμπελών.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Sklave“ bildet den antiken sozialen Status unverdeckt ab; „Weinbauern“ hält die landwirtschaftliche Bedeutung fest, ohne das mögliche Pachtverhältnis als ausdrücklich genannt darzustellen.
