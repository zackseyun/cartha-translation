revisions:
- from: Zur gegebenen Zeit schickte er einen Sklaven zu den Weinbauern, damit er von den Weinbauern einen Teil von den Früchten des Weinbergs erhielte.[a]
  to: Zur rechten Zeit schickte er einen Sklaven zu den Weinbauern, damit der Besitzer von den Weinbauern einen Teil der Früchte des Weinbergs erhielte.
  rationale: Die Revision verbessert idiomatisches modernes Deutsch und beseitigt eine relevante Bezugsmehrdeutigkeit, ohne den Sinn zu erweitern. „Der Besitzer“ expliziert lediglich den im Kontext bereits gegebenen Sender und bewahrt das griechische Subjekt von λάβῃ. Die partitive Konstruktion bleibt erhalten; die bisherige Fußnote wird wegen Redundanz entfernt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:42:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf trifft die wesentlichen griechischen Elemente: die passende Zeit (τῷ καιρῷ), die Sendung eines Sklaven, die Weinbauern als Empfänger der Sendung, den Zweck und den partitiven Bezug auf die Früchte des Weinbergs. Die Wendung „einen Teil von den Früchten“ ist jedoch im heutigen Standarddeutsch unnötig schwerfällig; „einen Teil der Früchte“ gibt den partitiven Sinn von ἀπό + Genitiv ebenso zuverlässig wieder.'
  naturalness: „Zur gegebenen Zeit“ ist zwar verständlich, aber im erzählenden modernen Deutsch weniger idiomatisch als „Zur rechten Zeit“. Zudem kann das unmarkierte „er“ im damit-Satz wegen des unmittelbar zuvor genannten Sklaven missverständlich sein. Die ausdrückliche Wiederaufnahme „der Besitzer“ beseitigt diese syntaktische Mehrdeutigkeit.
  terminology: „Sklave“ gibt δοῦλος angemessen wieder. „Weinbauern“ ist im Weinberg-Kontext eine vertretbare, natürliche Konkretisierung von γεωργοί, ohne ein Pachtverhältnis als lexikalisch ausdrücklich behauptet auszugeben. „Weinberg“ und „Früchte“ sind sachgerecht. Die englische Audit-Spur stützt insbesondere die partitive Wiedergabe, verlangt aber keine zusätzliche Fußnote.
  issues:
  - severity: low
    issue: Unidiomatische Zeitangabe
    rationale: „Zur gegebenen Zeit“ wirkt im modernen Standarddeutsch formelhaft und weniger natürlich. „Zur rechten Zeit“ bewahrt den Sinn von τῷ καιρῷ als passender/angesetzter Zeit, ohne die Erntezeit ausdrücklich einzutragen.
  - severity: medium
    issue: Mehrdeutiger Bezug von „er“ im Zwecksatz
    rationale: In „damit er ... erhielte“ kann sich „er“ formal auf den zuvor genannten Sklaven beziehen, während das griechische Verb λάβῃ den Besitzer als Subjekt hat. „Der Besitzer“ stellt den Bezug klar.
  - severity: low
    issue: Schwerfällige partitive Formulierung und entbehrliche Fußnote
    rationale: „Einen Teil der Früchte“ ist idiomatischer als „einen Teil von den Früchten“ und erhält den partitiven Sinn. Die Fußnote erklärt dann nichts, was im Haupttext nicht bereits klar ausgedrückt wäre.
  revised_text: Zur rechten Zeit schickte er einen Sklaven zu den Weinbauern, damit der Besitzer von den Weinbauern einen Teil der Früchte des Weinbergs erhielte.
  revised_footnotes: []
