revisions:
- from: Da suchten sie ihn festzunehmen, doch sie fürchteten die Volksmenge; denn sie hatten erkannt, dass er das Gleichnis auf sie bezogen hatte.[a] Da ließen sie ihn stehen und gingen weg.
  to: Da suchten sie ihn festzunehmen, doch sie fürchteten die Menge; denn sie hatten erkannt, dass er das Gleichnis gegen sie gesagt hatte.[a] So ließen sie ihn und gingen weg.
  rationale: Die Revision verbindet πρὸς αὐτούς unmittelbar mit dem Sagen des Gleichnisses und gibt dessen im Kontext gegnerische Ausrichtung mit „gegen sie“ wieder. Die Fußnote erhält die semantisch möglichen, weniger zugespitzten Wiedergaben. „Menge“ verbessert die idiomatische Natürlichkeit, während „ließen sie ihn“ die Bedeutung von ἀφέντες αὐτόν ohne die mögliche Zusatzvorstellung von „stehen lassen“ wahrt.
