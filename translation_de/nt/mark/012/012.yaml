source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: de
  text: Da suchten sie ihn festzunehmen, doch sie fürchteten die Menge; denn sie hatten erkannt, dass er das Gleichnis gegen sie gesagt hatte.[a] So ließen sie ihn und gingen weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass er das Gleichnis auf sie bezogen gesagt hatte“ oder „zu ihnen gesagt hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: sie suchten
  rationale: Der Imperfekt bezeichnet ein anhaltendes Bestreben. In Verbindung mit dem Infinitiv gibt „suchten sie … festzunehmen“ diesen Verlauf nah am Griechischen wieder.
- source_word: κρατῆσαι
  choice: festzunehmen
  rationale: κρατέω bedeutet hier, sich Jesu zu bemächtigen. „Festnehmen“ ist im Deutschen kontextgemäß und setzt nicht notwendig ein förmliches Rechtsverfahren voraus.
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: sie fürchteten die Volksmenge
  rationale: Die direkte Wiedergabe bewahrt sowohl die Furcht vor der Menge als auch den knappen Erzählstil.
- source_word: ἔγνωσαν
  choice: sie hatten erkannt
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Erkenntnis den zuvor beschriebenen Handlungsversuch begründet; „erkannt“ gibt den punktuellen Erkenntnischarakter des Aorists natürlich wieder.
- source_word: πρὸς αὐτοὺς
  choice: auf sie bezogen
  rationale: πρός mit Akkusativ kann hier „auf sie bezogen“, „an sie gerichtet“ oder kontextuell „gegen sie“ bedeuten. Die Hauptfassung bewahrt den Bezug, ohne die feindliche Stoßrichtung stärker als sprachlich nötig festzulegen.
- source_word: τὴν παραβολὴν εἶπεν
  choice: er das Gleichnis … gesprochen hatte
  rationale: „Das Gleichnis sprechen“ ist im Deutschen verständlich; in der Satzfassung wird das Verb mit „auf sie bezogen hatte“ idiomatisch verbunden, um die Funktion von πρὸς αὐτούς auszudrücken.
- source_word: ἀφέντες αὐτὸν
  choice: da ließen sie ihn stehen
  rationale: Das Partizip bezeichnet, dass sie von Jesus abließen beziehungsweise ihn zurückließen. „Ihn stehen lassen“ ist natürlich und vermeidet die mögliche Fehlvorstellung, Jesus sei zuvor bereits in ihrer Gewalt gewesen.
- source_word: ἀπῆλθον
  choice: gingen weg
  rationale: Die schlichte moderne Formulierung gibt die räumliche und erzählerische Bewegung direkt wieder.
theological_decisions:
- issue: Stoßrichtung des Gleichnisses in πρὸς αὐτούς
  choice: auf sie bezogen
  alternative: gegen sie gerichtet / an sie gerichtet
  rationale: Der Kontext legt eine kritische Stoßrichtung nahe, doch die Präposition selbst kann allgemeiner den Bezug oder die Adressierung ausdrücken. Die Übersetzung hält diese Spannung offen; die Fußnote nennt die naheliegenden Alternativen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knappem markinischem Erzählfluss. „Volksmenge“ ist präziser als das mehrdeutige „Volk“. Die Satzverknüpfungen bilden die griechische Begründungsstruktur ab, ohne unnötig altertümlich zu wirken.
