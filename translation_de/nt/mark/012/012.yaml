review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Aussagen des griechischen Textes weitgehend zutreffend wieder. Das Imperfekt in „suchten ... festzunehmen“, die Furcht vor der Menge und das abschließende Weggehen sind angemessen erfasst. Die Hauptformulierung „dass er das Gleichnis auf sie bezogen hatte“ verschiebt jedoch die Syntax: Im Griechischen gehört πρὸς αὐτούς zu εἶπεν („zu/gegen sie sagte“), nicht zu „Gleichnis“ im Sinn eines von Jesus vorgenommenen Bezugs. Außerdem ist „die Volksmenge“ zwar möglich, aber „die Menge“ ist im modernen biblischen Deutsch natürlicher und präzise genug.'
  naturalness: „Da suchten sie ihn festzunehmen“ und „gingen weg“ sind natürlich. „Das Gleichnis auf sie bezogen hatte“ klingt dagegen weniger idiomatisch und kann nahelegen, Jesus habe ein Gleichnis, das bereits unabhängig vorlag, auf sie angewandt. „Dass er das Gleichnis gegen sie gesagt hatte“ ist klarer, flüssig und gibt den im Kontext deutlich feindseligen Bezug wieder.
  terminology: „Festnehmen“ ist für κρατῆσαι kontextgemäß, ohne zwingend ein formelles Verfahren zu behaupten. „Gleichnis“ entspricht παραβολή. Für πρὸς αὐτούς ist angesichts des unmittelbaren Kontextes „gegen sie“ als Haupttext gerechtfertigt; eine Fußnote sollte die weniger zugespitzten Möglichkeiten „auf sie bezogen“ bzw. „zu ihnen“ bewahren.
  issues:
  - severity: medium
    issue: πρὸς αὐτούς wird syntaktisch als „das Gleichnis auf sie bezogen“ wiedergegeben.
    rationale: Die Präpositionalgruppe bestimmt im Griechischen das Sagen des Gleichnisses. Die deutsche Fassung kann die Aussage semantisch zwar ungefähr treffen, legt aber eine andere Konstruktion und einen stärker interpretierenden Vorgang des „Beziehens“ nahe.
  - severity: low
    issue: „Volksmenge“ ist hier unnötig schwerfällig.
    rationale: ὄχλος wird im modernen Standarddeutsch gewöhnlich und ausreichend präzise mit „Menge“ wiedergegeben.
