  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐλθοῦσα μία χήρα πτωχὴ ἔβαλεν λεπτὰ δύο, ὅ ἐστιν κοδράντης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/042.yaml
  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: de
  text: Da kam eine arme Witwe und warf zwei Lepta[a] ein; das entspricht einem Quadrans[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ein Lepton war eine sehr kleine Münze; zwei Lepta entsprachen einem römischen Quadrans. Möglich ist auch die Wiedergabe: „zwei kleine Kupfermünzen“.'
    reason: Kulturgeschichtliche Erklärung und lexikalische Alternative zum historischen Münznamen.
  - marker: b
    text: Quadrans ist die im griechischen Text genannte römische Münze.
    reason: Erläuterung des historischen Münzbegriffs.
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: Da kam
  rationale: Das Aoristpartizip wird im Deutschen idiomatisch als finites Verb wiedergegeben; „da“ führt die neu auftretende Person natürlich in die Erzählung ein.
- source_word: μία
  choice: eine
  rationale: μία bezeichnet hier eine einzelne, neu eingeführte Person, ohne dass die Zahl „eins“ hervorgehoben wird.
- source_word: χήρα πτωχὴ
  choice: eine arme Witwe
  rationale: Die übliche deutsche Wortstellung gibt beide Begriffe präzise und natürlich wieder; πτωχή bezeichnet Armut, ohne für sich allein zwingend den stärkeren Ausdruck „völlig mittellos“ zu verlangen.
- source_word: ἔβαλεν
  choice: warf … ein
  rationale: „Einwerfen“ ist im Zusammenhang mit dem Opferkasten eine natürliche deutsche Wiedergabe und bewahrt zugleich das Bild des griechischen βάλλω, ohne eine besonders kraftvolle Handlung nahezulegen.
- source_word: λεπτὰ δύο
  choice: zwei Lepta
  rationale: Der historische Münzname bleibt erhalten; die Fußnote erklärt Größe und Wert und vermeidet sowohl einen anachronistischen modernen Geldwert als auch eine ungenaue Umschreibung im Haupttext.
- source_word: ὅ ἐστιν
  choice: das entspricht
  rationale: Die Wendung macht deutlich, dass die beiden Lepta zusammen wertmäßig einem Quadrans entsprechen, statt Münzen unterschiedlicher Benennung miteinander gleichzusetzen.
- source_word: κοδράντης
  choice: einem Quadrans
  rationale: Der im Griechischen verwendete römische Münzname wird historisch präzise transliteriert; moderne Währungsbezeichnungen wären irreführend.
