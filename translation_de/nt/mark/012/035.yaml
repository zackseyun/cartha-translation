id: MRK.12.35
reference: Mark 12:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: de
  text: 'Während Jesus im Tempel lehrte, nahm er das Wort und sagte: »Wie können die Schriftgelehrten sagen, der Messias[a] sei Davids Sohn?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Christus«. Das griechische Wort Christos wird hier als messianischer Titel gebraucht.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔλεγεν
  choice: nahm er das Wort und sagte
  rationale: ἀποκριθείς kann eine Reaktion auf die vorausgehende Situation einleiten, auch wenn keine ausdrückliche Frage gestellt wurde. Die deutsche Wendung bewahrt diesen responsiven Charakter, ohne das hier unnatürliche »antwortete« zu erzwingen; ἔλεγεν wird idiomatisch mit »sagte« wiedergegeben.
- source_word: διδάσκων
  choice: Während Jesus … lehrte
  rationale: Das Präsenspartizip bezeichnet die gleichzeitig stattfindende Lehrtätigkeit und wird im Deutschen natürlich durch einen temporalen Nebensatz ausgedrückt.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier den Tempel beziehungsweise den Tempelbezirk, nicht speziell das innere Heiligtum; »im Tempel« ist die übliche verständliche Wiedergabe.
- source_word: Πῶς λέγουσιν
  choice: Wie können … sagen
  rationale: Πῶς leitet eine rhetorische Frage ein, die die Aussage der Schriftgelehrten problematisiert. »Wie können … sagen« gibt diese Kraft im Deutschen wieder, ohne die im folgenden Zusammenhang entfaltete Antwort vorwegzunehmen.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: »Schriftgelehrte« ist die etablierte historische Bezeichnung für die fachkundigen Ausleger und Lehrer der heiligen Schriften.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Χριστός wird hier eindeutig als jüdischer messianischer Titel gebraucht; »Messias« macht diesen Kontext im Deutschen unmittelbar erkennbar.
- source_word: υἱὸς Δαυίδ
  choice: Davids Sohn
  rationale: Die idiomatische deutsche Genitivkonstruktion bewahrt die Aussage über die anerkannte davidische Abstammung beziehungsweise Bezeichnung des Messias.
theological_decisions:
- issue: Wiedergabe des Titels Χριστός
  choice: Messias
  alternative: Christus
  rationale: Im vorliegenden Streitgespräch ist Χριστός ein Titel innerhalb jüdischer messianischer Erwartung. »Messias« ist deshalb im Haupttext vorzuziehen; die traditionelle Wiedergabe »Christus« bleibt in der Fußnote erhalten.
- issue: Kraft der rhetorischen Frage
  choice: Wie können die Schriftgelehrten sagen …?
  alternative: Wie sagen die Schriftgelehrten …?
  rationale: Die Formulierung gibt den problematisierenden Charakter der Frage wieder, ohne Jesu spätere Erklärung so auszulegen, als würde sie die davidische Abstammung des Messias schlicht verneinen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Nahm das Wort« ist eine natürliche deutsche Redeeinleitung, die den responsiven Charakter von ἀποκριθείς wahrt. Die indirekte Aussage steht idiomatisch im Konjunktiv I (»sei«).
