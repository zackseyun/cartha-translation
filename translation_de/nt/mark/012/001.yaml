id: MRK.12.1
reference: Mark 12:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: de
  text: 'Und er begann, in Gleichnissen zu ihnen zu reden: „Ein Mann pflanzte einen Weinberg[d], zog eine Umfriedung darum[a], grub ein Auffangbecken für die Kelter[b], baute einen Turm, verpachtete den Weinberg an Weinbauern[c] und ging fort.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zog einen Zaun darum“ beziehungsweise „legte eine Hecke darum an“. Das griechische Wort kann einen Zaun, eine Hecke oder eine andere Umgrenzung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist das untere Becken beziehungsweise die Grube der Kelter, in der der ausgepresste Saft aufgefangen wurde. Auch möglich: „grub eine Keltergrube“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „verpachtete ihn an Pächter“ beziehungsweise „an Winzer“. Gemeint sind Bauern, die einen fremden Weinberg bewirtschaften.'
    reason: lexical_alternative
  - marker: d
    text: Das Bild erinnert an Jesaja 5,1–2, wo ein Weinberg angelegt, umfriedet und mit Kelter und Turm ausgestattet wird.
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο … λαλεῖν
  choice: begann … zu reden
  rationale: Die Verbindung aus ἄρχομαι und Infinitiv bezeichnet den Beginn einer Handlung. „Begann … zu reden“ ist im Deutschen natürlich und wahrt den erzählerischen Ton.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Die Formulierung gibt sowohl die griechische Präposition als auch die verwendete Redeform knapp und idiomatisch wieder.
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: Ein Mann pflanzte einen Weinberg
  rationale: Die Voranstellung von „Weinberg“ im Griechischen muss im Deutschen nicht nachgeahmt werden; die gewählte Wortfolge ist natürlich und bewahrt den Inhalt vollständig.
- source_word: περιέθηκεν φραγμόν
  choice: zog eine Umfriedung darum
  rationale: φραγμός kann einen Zaun, eine Hecke oder allgemein eine schützende Begrenzung bezeichnen. „Umfriedung“ lässt die konkrete Ausführung offen.
- source_word: ὤρυξεν ὑπολήνιον
  choice: grub ein Auffangbecken für die Kelter
  rationale: ὑπολήνιον bezeichnet das untere Becken beziehungsweise die Grube einer Kelter, in der der Saft aufgefangen wurde. Die Formulierung ist präziser als das allgemeinere „Kelter“.
- source_word: ᾠκοδόμησεν πύργον
  choice: baute einen Turm
  rationale: Direkte und natürliche Wiedergabe der baulichen Vorbereitung des Weinbergs.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: verpachtete den Weinberg an Weinbauern
  rationale: ἐκδίδομαι bezeichnet hier das Verpachten; γεωργοί sind die Bewirtschafter des fremden Weinbergs. Die Wiederholung von „den Weinberg“ beseitigt im Deutschen eine mögliche falsche Zuordnung des Pronomens zum Turm.
- source_word: ἀπεδήμησεν
  choice: ging fort
  rationale: Das Verb bezeichnet das Fortgehen an einen anderen Ort, häufig für längere Zeit. „Ging fort“ bleibt knapp und fügt weder Reisezweck noch Reiseziel hinzu.
theological_decisions:
- issue: Anspielung auf Jesaja 5,1–2
  choice: Die Anspielung wird in einer Fußnote kenntlich gemacht, ohne sie in den Wortlaut hineinzudeuten.
  alternative: Keine Kennzeichnung der Anspielung oder ausdrückliche Identifizierung des Weinbergs im Haupttext
  rationale: Die Abfolge von Pflanzen, Umfriedung, Kelter und Turm greift deutlich das Weinberglied in Jesaja auf. Der Text selbst erklärt die Bedeutung an dieser Stelle jedoch noch nicht; daher bleibt die Spannung des Gleichnisses erhalten.
- issue: Soziale Stellung der γεωργοί
  choice: Weinbauern im Haupttext; das Pachtverhältnis wird durch „verpachtete“ und die Fußnote deutlich
  alternative: Pächter oder Winzer
  rationale: „Weinbauern“ bezeichnet ihre Tätigkeit natürlich, während das Verb das Rechts- und Besitzverhältnis ausdrückt. Dadurch wird weder bloß allgemeine Landwirtschaft noch moderner Weinhandel nahegelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Fachlich unnötig enge Begriffe werden vermieden; wo der griechische Ausdruck mehrere konkrete Formen zulässt, hält der Haupttext diese Offenheit fest und erläutert sie in Fußnoten.
