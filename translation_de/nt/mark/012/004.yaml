  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: de
  text: Und wieder schickte er einen anderen Sklaven[a] zu ihnen. Auch ihm schlugen sie auf den Kopf[b] und entehrten ihn.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen anderen Knecht“. Das griechische Wort bezeichnet einen unfreien Diener und kann je nach Zusammenhang mit „Sklave“ oder „Knecht“ wiedergegeben werden.'
    reason: alternative_reading
  - marker: b
    text: 'Das seltene griechische Verb bezeichnet Gewalt gegen den Kopf; möglich ist auch: „verwundeten ihn am Kopf“. Es bedeutet hier wahrscheinlich nicht „enthaupteten ihn“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „behandelten ihn schändlich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Kennzeichnet die wiederholte Handlung in der Abfolge des Gleichnisses; „wieder“ ist im Deutschen knapp und natürlich.
- source_word: ἀπέστειλεν
  choice: schickte er
  rationale: Der Aorist erzählt ein einmaliges vergangenes Geschehen; „schickte“ ist in einer modernen Gleichniserzählung idiomatisch.
- source_word: πρὸς αὐτούς
  choice: zu ihnen
  rationale: Bei einem Verb des Sendens wird πρός mit Akkusativ im Deutschen natürlich mit „zu“ wiedergegeben.
- source_word: ἄλλον δοῦλον
  choice: einen anderen Knecht
  rationale: δοῦλος bezeichnet einen unfreien Diener beziehungsweise Sklaven. „Knecht“ bewahrt hier das Abhängigkeitsverhältnis und passt zum würdevollen Gleichnisregister; die sozialgeschichtlich deutlichere Alternative „Sklaven“ wird in einer Fußnote genannt.
- source_word: κἀκεῖνον
  choice: Auch den
  rationale: Die Krasis aus καί und ἐκεῖνον setzt die Reihe nachdrücklich fort. „Auch den“ gibt sowohl den Anschluss als auch den Rückbezug natürlich wieder.
- source_word: ἐκεφαλίωσαν
  choice: schlugen sie auf den Kopf
  rationale: Das seltene Verb bezeichnet eine gegen den Kopf gerichtete Gewalttat. Die Wiedergabe vermeidet die unbelegte Festlegung auf eine Enthauptung und lässt die mögliche Bedeutung „am Kopf verwunden“ in der Fußnote erkennen.
- source_word: ἠτίμασαν
  choice: behandelten ihn verächtlich
  rationale: Das Verb bezeichnet entehrende, beschämende Behandlung. Diese Formulierung klingt im modernen Deutschen natürlicher als „entehrten ihn“ und wahrt den Aspekt der Missachtung.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. „Knecht“ hält den sozialen Abstand zum Besitzer aufrecht, ohne altertümliche Satzbildung; die Fußnote macht die stärkere soziale Bedeutung „Sklave“ transparent. Der kurze zweite Satz bildet die Zuspitzung der Gewalt im griechischen Text nach.
