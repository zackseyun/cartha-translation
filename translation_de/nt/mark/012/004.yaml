revisions:
- from: Und wieder schickte er einen anderen Knecht[a] zu ihnen. Auch den schlugen sie auf den Kopf[b] und behandelten ihn verächtlich.[c]
  to: Und wieder schickte er einen anderen Sklaven[a] zu ihnen. Auch ihm schlugen sie auf den Kopf[b] und entehrten ihn.[c]
  rationale: Die Revision ersetzt die im modernen Deutschen präzisere Hauptbezeichnung „Sklave“ für δοῦλος und gibt ἠτίμασαν direkter mit „entehrten ihn“ wieder. Die Fußnoten erhalten die tragfähigen Alternativen und die notwendige lexikalische Vorsicht bei ἐκεφαλίωσαν. Die umstrittene genaue Art der Kopfverletzung wird nicht überbestimmt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:45:02Z'
review_pass:
  verdict: revise
  source_fidelity: Die Satzglieder und die Abfolge entsprechen dem griechischen Text. Die seltene Form ἐκεφαλίωσαν wird zutreffend nicht als Enthauptung festgelegt. Für δοῦλος ist „Sklave“ im deutschen Haupttext jedoch die präzisere, zeitgemäße Bezeichnung des unfreien Status; „Knecht“ wirkt heute sowohl altertümlich als auch sozialgeschichtlich weniger eindeutig.
  naturalness: Die Erzählung ist insgesamt klar. „Auch den schlugen sie auf den Kopf“ ist zwar verständlich, aber „Auch ihm schlugen sie auf den Kopf“ ist im modernen Deutschen flüssiger. „Entehrten ihn“ gibt ἠτίμασαν unmittelbarer wieder als „behandelten ihn verächtlich“.
  terminology: „Sklave“ wahrt die soziale Realität von δοῦλος ohne eine zusätzliche theologische Deutung. „Entehren“ gibt die Schande bzw. Ehrverletzung von ἀτιμάζω wieder; die weiter gefasste Umschreibung „behandelten ihn schändlich“ kann als Alternative stehen bleiben.
  issues:
