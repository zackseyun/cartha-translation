    issue: „Knecht“ als Hauptwiedergabe von δοῦλος
    rationale: Im modernen Standarddeutsch ist „Knecht“ überwiegend historisierend und kann eine Dienststellung statt eines unfreien Status bezeichnen. Der Kontext des Gleichnisses und δοῦλος rechtfertigen „Sklave“ als präzisere Hauptwiedergabe; „Knecht“ bleibt als mögliche traditionellere Alternative in der Fußnote.
  - severity: low
    issue: Wiedergabe von ἠτίμασαν
    rationale: „Behandelten ihn verächtlich“ ist möglich, benennt aber stärker die Haltung als die dem Mann zugefügte Entehrung. „Entehrten ihn“ entspricht dem Verb direkter.
