  source_fidelity: Der Text gibt die rhetorische Frage sowie die drei zukünftigen Handlungen des griechischen Textes vollständig und in derselben Reihenfolge wieder. „Besitzer des Weinbergs“ trifft den innerparabolischen Sinn von ὁ κύριος τοῦ ἀμπελῶνος. „Vernichten“ bildet die Schwere, aber auch die gegenüber „töten“ weitere Bedeutung von ἀπολέσει angemessen ab. „Anderen“ bewahrt die offene Referenz von ἄλλοις.
  naturalness: Die Formulierung ist klares modernes Standarddeutsch und erhält den knappen, eindringlichen Stil des Gleichnisses. „Weinbauern“ ist verständlich und im Kontext idiomatisch; die Fußnote sichert die wichtige Pachtbeziehung zusätzlich ab.
  terminology: „Besitzer“, „Weinberg“ und „Weinbauern“ sind kontextgerecht. Die Fußnote bietet mit „Pächter“ eine sachlich passende Alternative, ohne den griechischen Ausdruck im Haupttext unnötig einzuengen. Es bestehen keine problematischen theologischen oder namensbezogenen Entscheidungen.
