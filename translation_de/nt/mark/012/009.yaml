id: MRK.12.9
reference: Mark 12:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: de
  text: Was wird der Besitzer des Weinbergs tun? Er wird kommen, die Weinbauern[a] vernichten und den Weinberg anderen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pächter“; das griechische Wort bezeichnet hier die Männer, die den Weinberg eines anderen bewirtschaften.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: Was wird … tun?
  rationale: Gibt die rhetorische Frage mit dem Futur direkt und natürlich wieder, ohne einen im Griechischen nicht ausdrücklich vorhandenen Anschluss hinzuzufügen.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: der Besitzer des Weinbergs
  rationale: κύριος bezeichnet hier innerhalb des Gleichnisses den Eigentümer des Weinbergs. „Besitzer“ vermittelt diesen kontextuellen Sinn, ohne einen ausdrücklichen theologischen Titel einzutragen.
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: Weinberg
  rationale: Die übliche und kontextgerechte deutsche Entsprechung für ἀμπελών.
- source_word: ἐλεύσεται
  choice: Er wird kommen
  rationale: Direkte, anschauliche Wiedergabe des Futurs von ἔρχομαι.
- source_word: ἀπολέσει
  choice: vernichten
  rationale: Bewahrt die Härte des angekündigten Gerichts und bleibt weiter gefasst als das mögliche, aber engere „töten“.
- source_word: τοὺς γεωργούς
  choice: die Weinbauern
  rationale: γεωργοί sind hier die Bewirtschafter eines fremden Weinbergs. „Weinbauern“ ist im Deutschen natürlich und erhält die landwirtschaftliche Dimension; ihr Pachtverhältnis wird in der Fußnote verdeutlicht.
- source_word: δώσει
  choice: geben
  rationale: Entspricht dem breiten Sinn von δίδωμι, ohne die Handlung als Verpachtung oder Anvertrauen näher festzulegen.
- source_word: ἄλλοις
  choice: anderen
  rationale: Erhält wie das griechische substantivierte Adjektiv offen, wer diese anderen sind.
theological_decisions:
- issue: Wiedergabe von κύριος bei einer nicht ausdrücklich göttlichen Figur im Gleichnis
  choice: Besitzer
  alternative: Herr des Weinbergs; Eigentümer des Weinbergs
  rationale: Der unmittelbare Bezugspunkt ist der Besitzer des Weinbergs innerhalb der erzählten Welt. „Besitzer“ vermeidet eine vorzeitige theologische Titulierung, ohne die weitergehende Bedeutung des Gleichnisses auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und knappem Gleichnisstil. Die parallelen Futurformen und die Offenheit von „anderen“ bleiben erhalten.
