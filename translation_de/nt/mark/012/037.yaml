id: MRK.12.37
reference: Mark 12:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: de
  text: David selbst nennt ihn »Herr«. Wie kann er dann sein Sohn sein?[a] Und die große Menschenmenge hörte ihm gern zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und woher ist er sein Sohn?« »Sohn« kann hier auch »Nachkomme« bedeuten und klingt an den messianischen Titel »Sohn Davids« an.'
    reason: Bewahrt die wörtliche Form von πόθεν und macht die dynastische Bedeutungsweite von υἱός sichtbar.
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: David selbst
  rationale: Die intensive Verwendung von αὐτός hebt David persönlich hervor; die deutsche Stellung »David selbst« bewahrt diesen Nachdruck natürlich.
- source_word: λέγει αὐτὸν κύριον
  choice: nennt ihn »Herr«
  rationale: Die Konstruktion bezeichnet hier eine Benennung bzw. Prädikation. »Nennt ihn Herr« ist im Deutschen idiomatischer als eine wörtliche Wiedergabe mit »sagt«.
- source_word: κύριον
  choice: »Herr«
  rationale: »Herr« bewahrt den Titel und seine christologische sowie schriftbezogene Tragweite, ohne die Aussage erklärend zu erweitern.
- source_word: καὶ πόθεν αὐτοῦ ἐστιν υἱός
  choice: Wie kann er dann sein Sohn sein?
  rationale: πόθεν bedeutet wörtlich »woher«, fragt hier aber nach der logischen Grundlage. »Wie kann … dann« gibt die argumentative Kraft in natürlichem Deutsch wieder; »Sohn« wahrt den Anklang an den messianischen Titel.
- source_word: ὁ πολὺς ὄχλος
  choice: die große Menschenmenge
  rationale: Die Wendung bezeichnet eine zahlenmäßig große Menge. »Menschenmenge« ist modernes, klares Deutsch und vermeidet die mögliche qualitative Lesart von »die große Menge«.
- source_word: ἤκουεν αὐτοῦ
  choice: hörte ihm … zu
  rationale: Das Imperfekt bezeichnet ein fortdauerndes Zuhören; »hörte ihm zu« bildet dies im Zusammenhang natürlich ab.
- source_word: ἡδέως
  choice: gern
  rationale: »Gern« drückt die Freude bzw. das Wohlgefallen am Zuhören knapp und idiomatisch aus.
theological_decisions:
- issue: Christologische Spannung darin, dass David den Messias »Herr« nennt
  choice: Der Titel »Herr« und die rhetorische Frage bleiben ohne erklärenden Zusatz stehen.
  alternative: David selbst nennt den Messias »Herr«; in welchem Sinn ist er also sein Sohn?
  rationale: Der Vers deutet an, dass der Messias mehr als nur Davids Nachkomme ist, entfaltet dies aber nicht. Die Übersetzung bewahrt diese Spannung, ohne eine dogmatische Erklärung in den Text einzutragen.
- issue: Bedeutung von υἱός im davidisch-messianischen Zusammenhang
  choice: Sohn
  alternative: Nachkomme
  rationale: »Sohn« erhält den Wortlaut und den Anklang an den messianischen Titel »Sohn Davids«. Die weitere Bedeutung »Nachkomme« wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird mit deutschen Anführungszeichen markiert. »Wie kann … dann« formuliert die rhetorische Logik natürlich; die Fußnote dokumentiert die wörtlichere und bewusst ungewöhnliche Ausgangsform.
