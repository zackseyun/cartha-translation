  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: de
  text: 'Und in seiner Lehre sagte er: »Hütet euch vor den Schriftgelehrten[a], die gern in langen Gewändern[b] umhergehen und sich auf den Marktplätzen grüßen lassen,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Nehmt euch vor den Schriftgelehrten in Acht« oder »Seid auf der Hut vor den Schriftgelehrten«.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »langen Gewändern« sind auffällige Obergewänder gemeint, die gesellschaftlichen Rang und öffentliche Ehre erkennen ließen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: in seiner Lehre
  rationale: Die Formulierung bewahrt die griechische Wendung und bezeichnet natürlich den Rahmen beziehungsweise Bereich seines Lehrens.
- source_word: ἔλεγεν
  choice: sagte er
  rationale: Das griechische Imperfekt stellt das Reden als im Verlauf befindlich dar; im Deutschen ist das Präteritum hier die natürliche Erzählform, ohne eine nicht ausdrücklich markierte Wiederholung hinzuzufügen.
- source_word: Βλέπετε ἀπὸ
  choice: Hütet euch vor
  rationale: Die Verbindung drückt eine ernste Warnung und die Aufforderung aus, sich vor den Genannten in Acht zu nehmen.
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die etablierte, quellennahe deutsche Bezeichnung für die mit Auslegung und Vermittlung der Schrift befasste Gruppe.
- source_word: τῶν θελόντων
  choice: die gern … umhergehen und sich … grüßen lassen
  rationale: „Gern“ gibt die charakteristische Neigung wieder; die parallele deutsche Konstruktion erfasst, dass sowohl das Auftreten in Gewändern als auch die öffentlichen Grüße begehrt werden.
- source_word: ἐν στολαῖς περιπατεῖν
  choice: in langen Gewändern umhergehen
  rationale: στολή bezeichnet hier ein langes beziehungsweise repräsentatives Obergewand; „umhergehen“ gibt περιπατεῖν direkt und natürlich wieder.
- source_word: ἀσπασμοὺς
  choice: sich … grüßen lassen
  rationale: Die reflexive Formulierung macht im Deutschen deutlich, dass die Schriftgelehrten öffentliche Begrüßungen als Zeichen der Anerkennung empfangen möchten, ohne zusätzliche Ehrentitel in den Text einzutragen.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: auf den Marktplätzen
  rationale: Die ἀγοραί waren öffentliche Markt- und Versammlungsplätze; „auf den Marktplätzen“ ist im modernen Deutschen idiomatisch.
theological_decisions:
- issue: Bezug und Tragweite der Warnung vor den Schriftgelehrten
  choice: Die Warnung gilt den durch öffentliches Geltungsstreben gekennzeichneten Schriftgelehrten.
  alternative: Pauschale Verurteilung sämtlicher Schriftgelehrter als Gruppe.
  rationale: Der Relativsatz beschreibt näher, vor welchen Schriftgelehrten gewarnt wird. Die Übersetzung lässt diese grammatische Einschränkung wirken, ohne die im Text genannte Gruppe umzubenennen oder die Spannung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt wegen des fortlaufenden Satzes am Versende offen; die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
