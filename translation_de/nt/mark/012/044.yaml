source:
  edition: SBLGNT
  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: de
  text: Denn sie alle haben von ihrem Überfluss eingelegt; sie aber hat aus ihrer Armut alles eingelegt, was sie hatte – ihren ganzen Lebensunterhalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, wovon sie lebte“.'
    reason: Die Alternative gibt die kontextuelle Bedeutung von ὅλον τὸν βίον αὐτῆς als gesamte Mittel zum Leben idiomatisch wieder, ohne die zusätzliche Nuance von „musste“ einzutragen.
lexical_decisions:
- source_word: πάντες γὰρ
  choice: Denn sie alle
  rationale: „Denn“ bewahrt den begründenden Anschluss an Jesu vorheriges Urteil; „sie alle“ gibt die umfassende Aussage natürlich wieder.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: von ihrem Überfluss
  rationale: Die Wendung bezeichnet das, was über den eigenen Bedarf hinaus vorhanden ist. „Überfluss“ erhält den deutlichen Gegensatz zur Armut der Witwe.
- source_word: ἔβαλον / ἔβαλεν
  choice: haben eingelegt / hat eingelegt
  rationale: Im Zusammenhang mit dem Tempelschatz bezeichnet βάλλω das Einlegen einer Gabe. Die Wiederholung bildet die parallele und kontrastierende Struktur des Griechischen ab.
- source_word: αὕτη δὲ
  choice: sie aber
  rationale: Die Formulierung wahrt den ausdrücklichen Gegensatz zu den übrigen Gebenden, ohne die im Kontext bereits bezeichnete Witwe unnötig nochmals zu benennen.
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: aus ihrer Armut
  rationale: ὑστέρησις bezeichnet Mangel oder Bedürftigkeit; im wirtschaftlichen Kontext ist „Armut“ konkret und verständlich.
- source_word: πάντα ὅσα εἶχεν
  choice: alles, was sie hatte
  rationale: Die umfassende Aussage und ihre emphatische Totalität werden unmittelbar bewahrt.
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: ihren ganzen Lebensunterhalt
  rationale: βίος bezeichnet hier angesichts der Geldgabe die Mittel zum Leben beziehungsweise den Lebensunterhalt, nicht vorrangig das biologische Leben.
theological_decisions:
- issue: Bedeutung von βίος bei der Gabe der Witwe
  choice: wirtschaftliche Lebensgrundlage („Lebensunterhalt“)
  alternative: ihr ganzes Leben
  rationale: Der unmittelbare Kontext handelt von Geld und Besitz. „Lebensunterhalt“ wahrt den Sinn der gesamten materiellen Existenzgrundlage, ohne fälschlich zu behaupten, sie habe in diesem Augenblick ihr biologisches Leben gegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wiedergabe von βάλλω mit „einlegen“ bewahrt den Parallelismus des Ausgangstextes; der Gedankenstrich hebt die abschließende Zuspitzung hervor.
