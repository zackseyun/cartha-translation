id: MRK.12.34
reference: Mark 12:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: de
  text: 'Als Jesus sah, dass er verständig geantwortet hatte, sagte er zu ihm: „Du bist nicht weit vom Reich Gottes entfernt.“[a] Und niemand wagte mehr, ihm eine Frage zu stellen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Du bist dem Reich Gottes nahe.“ Das Griechische bezeichnet Nähe, nicht ausdrücklich den Eintritt in das Reich Gottes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: als … sah
  rationale: Die temporale Konstruktion gibt das vorausgehende Wahrnehmen des Partizips natürlich wieder; im Zusammenhang schwingt zugleich der Anlass für Jesu Antwort mit.
- source_word: νουνεχῶς
  choice: verständig
  rationale: Das Adverb bezeichnet eine von Einsicht und gutem Urteilsvermögen geprägte Antwort. „Verständig“ ist würdig und präziser als das möglicherweise stärker wertende „weise“.
- source_word: ἀπεκρίθη
  choice: geantwortet hatte
  rationale: 'Das Plusquamperfekt verdeutlicht im Deutschen die zeitliche Abfolge: Zuerst antwortete der Schriftgelehrte, dann äußerte sich Jesus dazu.'
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: Du bist nicht weit … entfernt
  rationale: Die Formulierung bewahrt das räumliche Bild und bezeichnet Nähe, ohne Zugehörigkeit oder Eintritt ausdrücklich festzustellen.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Reich Gottes
  rationale: Die etablierte synoptische Wendung bleibt im Deutschen verständlich und lässt sowohl Herrschaft als auch Herrschaftsbereich anklingen.
- source_word: οὐκέτι
  choice: mehr
  rationale: In Verbindung mit der Verneinung gibt „mehr“ idiomatisch wieder, dass von diesem Zeitpunkt an niemand weiterzufragen wagte.
- source_word: ἐτόλμα
  choice: wagte
  rationale: „Wagte“ trifft unmittelbar den Sinn des Verbs und gibt den zusammenfassenden Charakter des Imperfekts im Deutschen natürlich wieder.
- source_word: ἐπερωτῆσαι
  choice: ihm eine Frage zu stellen
  rationale: Die Wendung bezeichnet das gezielte Befragen Jesu. Sie klingt im Deutschen natürlicher als „ihn zu befragen“, ohne die prüfende Haltung des Kontexts zu einer förmlichen Vernehmung zu steigern.
theological_decisions:
- issue: Stellung des Schriftgelehrten zum Reich Gottes
  choice: „Du bist nicht weit vom Reich Gottes entfernt“
  alternative: „Du bist dem Reich Gottes nahe“
  rationale: Der griechische Text stellt Nähe fest, erklärt aber weder ausdrücklich einen Eintritt noch eine bereits bestehende Zugehörigkeit. Die Übersetzung wahrt diese Spannung zwischen Jesu Anerkennung seiner Einsicht und der noch bestehenden Distanz.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau bleibt nah an der griechischen Gedankenfolge, ohne unnatürlich zu wirken; die theologische Spannung der Näheaussage wird nicht aufgelöst.
