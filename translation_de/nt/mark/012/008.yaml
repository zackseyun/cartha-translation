  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: de
  text: Und sie nahmen ihn, töteten ihn und warfen ihn aus dem Weinberg hinaus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Da packten sie ihn
  rationale: Das vorangestellte Aoristpartizip bezeichnet die erste Handlung der raschen Abfolge. „Packten“ gibt das Ergreifen im gewaltsamen Kontext natürlich wieder, ohne die Aussage unnötig auszubauen.
- source_word: ἀπέκτειναν
  choice: töteten
  rationale: ἀποκτείνω bedeutet hier schlicht „töten“. Die knappe Wiedergabe bewahrt die Härte und Direktheit der Erzählung.
- source_word: ἐξέβαλον
  choice: warfen ... hinaus
  rationale: ἐκβάλλω bezeichnet ein gewaltsames Hinauswerfen. Die Formulierung ist in modernem Deutsch natürlich und erhält die Kraft des Verbs.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: aus dem Weinberg hinaus
  rationale: ἔξω mit dem Genitiv bezeichnet hier die Bewegung nach draußen. Zusammen mit „warfen ... hinaus“ wird die Richtung eindeutig und idiomatisch ausgedrückt.
- source_word: ἀμπελῶνος
  choice: Weinberg
  rationale: ἀμπελών ist die übliche Bezeichnung für einen Weinberg und entspricht dem parabolischen Zusammenhang.
theological_decisions:
- issue: Reihenfolge von Tötung und Hinauswerfen im Gleichnis
  choice: 'Die Übersetzung folgt der griechischen Abfolge: Sie töteten ihn und warfen ihn danach aus dem Weinberg hinaus.'
  alternative: Nach der parallelen Gleichnisüberlieferung könnte man erwarten, dass sie ihn zuerst hinauswarfen und dann töteten.
  rationale: Der griechische Text von Markus 12,8 nennt ausdrücklich zuerst das Töten und danach das Hinauswerfen. Diese Reihenfolge wird nicht an Parallelstellen oder traditionelle Erwartungen angeglichen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die knappe Reihung der drei Handlungen bewahrt das schnelle Erzähltempo und die schonungslose Wirkung des griechischen Textes.
