id: MRK.11.17
reference: Mark 11:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: de
  text: 'Und er lehrte und sagte zu ihnen: „Steht nicht geschrieben: ‚Mein Haus wird ein Haus des Gebets für alle Völker[a] genannt werden‘? Ihr aber habt es zu einer Räuberhöhle[b] gemacht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „für alle Nationen“. Das griechische Wort bezeichnet hier die Völker beziehungsweise Nationen; die Formulierung greift Jesaja 56,7 auf.'
    reason: lexical_alternative
  - marker: b
    text: „Räuberhöhle“ greift Jeremia 7,11 auf. Das griechische Wort kann je nach Zusammenhang auch „Banditen“ oder „Wegelagerer“ bezeichnen.
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: er lehrte und sagte
  rationale: Die beiden Imperfektformen beschreiben das fortdauernde Lehren und Reden in der Tempelszene. Im Deutschen gibt es keine eigene Verlaufsform; die koordinierte Präteritalform ist natürlich und wahrt den erzählerischen Aspekt, ohne künstliche Umschreibung.
- source_word: Οὐ γέγραπται
  choice: Steht nicht geschrieben
  rationale: Die geläufige deutsche Schriftformel gibt das griechische Perfekt Passiv und den bleibenden Geltungsanspruch des Geschriebenen knapp und würdig wieder.
- source_word: Ὁ οἶκός μου
  choice: Mein Haus
  rationale: Die direkte Entsprechung bewahrt den Wortlaut und den Bezug auf Jesaja 56,7; eine Festlegung auf „Tempel“ ist im Kontext zwar möglich, aber nicht nötig.
- source_word: οἶκος προσευχῆς
  choice: ein Haus des Gebets
  rationale: Die Genitivverbindung wird formal und zugleich idiomatisch wiedergegeben und bewahrt die bekannte biblische Wendung.
- source_word: κληθήσεται
  choice: wird … genannt werden
  rationale: Entspricht dem Futur Passiv und erhält die Form der prophetischen Aussage.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: für alle Völker
  rationale: „Völker“ ist im Deutschen die natürliche Wiedergabe von ἔθνη und bewahrt die universale Reichweite des Jesaja-Zitats. Das Dativgefüge wird im Zitat sinnvoll mit „für“ wiedergegeben.
- source_word: ὑμεῖς δὲ
  choice: Ihr aber
  rationale: Das ausdrücklich gesetzte Pronomen und δέ bilden einen starken Kontrast zwischen Gottes Bestimmung des Hauses und dem Handeln der Angesprochenen.
- source_word: πεποιήκατε
  choice: habt … gemacht
  rationale: Das Perfekt bezeichnet eine Handlung mit gegenwärtigem Ergebnis; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: σπήλαιον λῃστῶν
  choice: Räuberhöhle
  rationale: Das idiomatische deutsche Kompositum bewahrt das Bild eines Verstecks von Räubern sowie den Anklang an Jeremia 7,11. Es vermeidet eine nicht zwingende politische Präzisierung als Aufständische.
theological_decisions:
- issue: Universale Reichweite des prophetischen Zitats
  choice: für alle Völker
  alternative: für alle Nationen; von allen Völkern
  rationale: Die Übersetzung hält fest, dass Gottes Haus über Israel hinaus bestimmt ist, ohne diese Aussage systematisch-theologisch weiter auszudeuten. „Für“ entspricht dem Sinn des Jesaja-Zitats im Kontext besser als ein agentiales „von“.
- issue: Bedeutung von λῃστῶν in Jesu Anklage
  choice: Räuber
  alternative: Banditen; Aufständische
  rationale: Der Bezug auf Jeremia 7,11 legt die allgemeine Bedeutung „Räuber“ nahe. Eine politische Deutung als Aufständische ist lexikalisch möglich, wird von diesem Vers aber nicht eindeutig verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Schriftzitat. Die traditionelle Formel „Steht nicht geschrieben“ und „Haus des Gebets“ bleiben wegen ihrer Prägnanz und intertextuellen Bedeutung erhalten; unnötig altertümliche Formen werden vermieden.
