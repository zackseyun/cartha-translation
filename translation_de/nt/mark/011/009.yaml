id: MRK.11.9
reference: Mark 11:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: de
  text: 'Und die, die vorausgingen, und die, die folgten, riefen immer wieder: „Hosanna![a] Gesegnet ist, wer im Namen des Herrn kommt!“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hosanna“ ist ein hebräisch-aramäischer liturgischer Ruf und bedeutet ursprünglich etwa „Hilf doch!“ oder „Rette jetzt!“. Hier dient er zugleich als Jubelruf.
    reason: lexical_alternative
  - marker: b
    text: Dieser Zuruf greift Psalm 118,26 auf.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: die, die vorausgingen
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen vor Jesus beziehungsweise vor dem Zug. Die Formulierung ist im modernen Deutsch natürlich und wahrt die parallele Struktur zum folgenden Ausdruck.
- source_word: οἱ ἀκολουθοῦντες
  choice: die, die folgten
  rationale: Das substantivierte Präsenspartizip bezeichnet die Menschen hinter Jesus. Die Wiedergabe bleibt eng am griechischen Parallelismus mit οἱ προάγοντες.
- source_word: ἔκραζον
  choice: riefen immer wieder
  rationale: Der Imperfekt beschreibt ein andauerndes oder wiederholtes öffentliches Rufen. „Immer wieder“ macht diesen Aspekt im Deutschen deutlich, ohne die Aussage unnötig zu steigern.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: Der aus dem Hebräischen beziehungsweise Aramäischen übernommene liturgische Ruf war Bitte und Jubelruf zugleich. Die eingebürgerte Umschrift erhält seinen festlichen und biblischen Klang; die ursprüngliche Bedeutung wird in einer Fußnote erläutert.
- source_word: Εὐλογημένος
  choice: Gesegnet
  rationale: Die passive Form der Segensformel und der Anklang an Psalm 118,26 werden unmittelbar bewahrt.
- source_word: ὁ ἐρχόμενος
  choice: wer … kommt
  rationale: Das substantivierte Partizip wird idiomatisch wiedergegeben. Die Formulierung bleibt offen und fügt keinen im griechischen Wortlaut nicht ausdrücklich genannten messianischen Titel hinzu.
- source_word: ἐν ὀνόματι κυρίου
  choice: im Namen des Herrn
  rationale: Die vertraute biblische Wendung bewahrt sowohl den Psalmanklang als auch die Vorstellung, unter der Vollmacht beziehungsweise als Beauftragter des Herrn zu kommen.
- source_word: κυρίου
  choice: des Herrn
  rationale: κύριος wird gemäß seiner üblichen biblischen Bedeutung mit „Herr“ wiedergegeben; der bestimmte Artikel ergibt sich im Deutschen aus der festen Wendung „im Namen des Herrn“.
theological_decisions:
- issue: Soll die messianische Bedeutung des Zurufs ausdrücklich in die Übersetzung aufgenommen werden?
  choice: Die zitathafte Formulierung „Gesegnet ist, wer im Namen des Herrn kommt“ bleibt ohne ergänzenden Titel stehen.
  alternative: „Gesegnet ist der Messias/König, der im Namen des Herrn kommt.“
  rationale: Im Erzählzusammenhang besitzt der Ruf messianische Bedeutung, doch der griechische Text nennt an dieser Stelle weder „Messias“ noch „König“. Die offene Form bewahrt den Wortlaut und die theologische Spannung des Psalmzitats.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „die, die“ bildet den griechischen Parallelismus verständlich ab. „Riefen immer wieder“ vermittelt den durativen beziehungsweise iterativen Sinn des Imperfekts. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, den sie erläutern.
