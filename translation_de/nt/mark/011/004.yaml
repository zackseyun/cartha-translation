  text: ⸂καὶ ἀπῆλθον⸃ καὶ εὗρον πῶλον δεδεμένον ⸀πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου, καὶ λύουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/004.yaml
  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: de
  text: Sie gingen weg und fanden ein Fohlen, das bei einer Tür draußen an der Straße[a] angebunden war, und sie banden es los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „draußen an einer Tür auf der Straße“. Die griechische Wortfolge lässt bei der räumlichen Zuordnung unterschiedliche Akzente zu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: gingen sie los
  rationale: Das Verb bezeichnet das Weggehen von dem Ort, an dem Jesus die Anweisung gab. „Gingen sie los“ gibt die Bewegung natürlich und erzählerisch wieder.
- source_word: εὗρον
  choice: fanden
  rationale: Die übliche und in diesem Erzählzusammenhang treffende Wiedergabe von εὑρίσκω.
- source_word: πῶλον
  choice: Fohlen
  rationale: πῶλος bezeichnet ein junges Tier. „Fohlen“ bewahrt die in diesem Vers bestehende Unbestimmtheit, ohne bereits ausdrücklich „Eselfohlen“ zu sagen.
- source_word: δεδεμένον
  choice: angebunden war
  rationale: Das Perfektpartizip beschreibt den bestehenden Zustand des Tieres. Im konkreten Zusammenhang klingt „angebunden“ im Deutschen natürlicher als „gebunden“.
- source_word: πρὸς θύραν
  choice: an einer Tür
  rationale: πρός mit Akkusativ bezeichnet hier räumliche Nähe; „an einer Tür“ ist eine natürliche deutsche Ortsangabe.
- source_word: ἔξω
  choice: draußen
  rationale: Das Adverb kennzeichnet den Ort als außerhalb eines Innenraums; „draußen“ ist klar und idiomatisch.
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: auf der Straße
  rationale: ἄμφοδον kann eine Straße, Gasse oder einen öffentlichen Durchgang bezeichnen. „Auf der Straße“ ist verständlich, lässt aber in Verbindung mit den übrigen Ortsangaben eine gewisse räumliche Mehrdeutigkeit bestehen.
- source_word: λύουσιν αὐτόν
  choice: sie banden es los
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben. „Losbinden“ bezeichnet die konkrete Handlung präzise.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die räumliche Mehrdeutigkeit von πρὸς θύραν ἔξω ἐπὶ τοῦ ἀμφόδου wird nicht stillschweigend aufgelöst, sondern durch eine alternative Lesart in der Fußnote kenntlich gemacht.
