  source_fidelity: Der Text gibt die historischen Präsensformen idiomatisch im deutschen Präteritum wieder und bewahrt sowohl πάλιν („wieder“) als auch die erneute Bewegung nach Jerusalem. Der Genitivus absolutus wird angemessen als begleitende Situation wiedergegeben. „Tempelbezirk“ trifft ἱερόν als den weiteren Tempelkomplex und vermeidet eine Gleichsetzung mit dem inneren Heiligtum. Die drei genannten Autoritätsgruppen sowie ihre Bewegung zu Jesus sind vollständig und sachgerecht wiedergegeben.
