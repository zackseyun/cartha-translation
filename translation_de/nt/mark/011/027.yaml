source:
  edition: SBLGNT
  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: de
  text: Und sie kamen wieder nach Jerusalem. Als Jesus im Tempelbezirk[a] umherging, kamen die führenden Priester, die Schriftgelehrten und die Ältesten zu ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Tempel« beziehungsweise »in der Tempelanlage«; das griechische Wort bezeichnet den gesamten Tempelkomplex, nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kamen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet die erneute Ankunft in Jerusalem.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage und nicht speziell das innere Heiligtum (ναός).
- source_word: περιπατοῦντος αὐτοῦ
  choice: als Jesus ... umherging
  rationale: Der Genitivus absolutus liefert den begleitenden Hintergrund; „umherging“ gibt die andauernde Bewegung natürlich wieder. Der Name „Jesus“ verdeutlicht im Deutschen ohne inhaltliche Veränderung den Bezug des Pronomens.
- source_word: ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die leitenden Angehörigen der priesterlichen Autorität und nicht mehrere gleichzeitig amtierende Hohepriester.
- source_word: γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Dies ist die etablierte und sachlich passende deutsche Bezeichnung für die fachkundigen Ausleger und Lehrer der heiligen Schriften.
- source_word: πρεσβύτεροι
  choice: die Ältesten
  rationale: Im institutionellen Zusammenhang sind anerkannte jüdische Führungspersonen gemeint, nicht lediglich ältere Männer.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: Die Wendung gibt die Bewegung auf Jesus zu idiomatisch wieder.
theological_decisions:
- issue: Räumliche Bedeutung von ἱερόν
  choice: Tempelbezirk
  alternative: Tempel; Tempelanlage
  rationale: „Tempelbezirk“ macht deutlich, dass die öffentliche Begegnung im weiteren Tempelkomplex stattfand, ohne den Ort auf das innere Heiligtum einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben; die Wiederholung von καί wird im zweiten Satz zugunsten natürlicher deutscher Syntax nicht mechanisch abgebildet.
