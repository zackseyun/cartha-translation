  terminology: „Schriftgelehrten“ und „Ältesten“ sind etablierte, quellennahe Bezeichnungen. „Führende Priester“ gibt ἀρχιερεῖς im hier gemeinten pluralischen institutionellen Sinn verständlich wieder, ohne fälschlich mehrere gleichzeitig amtierende einzelne Hohepriester vorauszusetzen. Die Fußnote zu „Tempelbezirk“ erläutert die relevante räumlich-lexikalische Unterscheidung zutreffend.
