source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: de
  text: Wenn ihr aber nicht vergebt,[a] wird auch euer Vater im Himmel euch eure Verfehlungen nicht vergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt in den frühesten griechischen Handschriften, darunter dem Codex Sinaiticus und dem Codex Vaticanus aus dem 4. Jahrhundert, sowie in frühen koptischen Übersetzungen. Er steht jedoch in der byzantinischen Mehrheitstradition, in der lateinischen Überlieferung und in den meisten syrischen Handschriften. Wahrscheinlich wurde er von späteren Abschreibern eingefügt, um den Wortlaut an Jesu Aussage in Matthäus 6,15 anzugleichen.
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: vergeben
  rationale: Im Zusammenhang zwischenmenschlicher Schuld und göttlicher Vergebung ist „vergeben“ die natürliche und genaue deutsche Wiedergabe; die Wiederholung bildet die Wiederholung des griechischen Verbs ab.
- source_word: παράπτωμα
  choice: Verfehlungen
  rationale: „Verfehlungen“ bewahrt die Vorstellung eines Fehltritts beziehungsweise einer Übertretung und unterscheidet den Ausdruck vom allgemeineren Wort „Sünden“, ohne unnatürlich zu klingen.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: euer Vater im Himmel
  rationale: Diese im Deutschen geläufige Formulierung gibt die griechische Bestimmung idiomatisch und vollständig wieder.
theological_decisions:
- issue: Verhältnis menschlicher und göttlicher Vergebung
  choice: Die konditionale Aussage bleibt ohne erklärende Abschwächung stehen.
  alternative: Die Aussage durch Zusätze als bloßen Hinweis auf den Erweis bereits empfangener Vergebung deuten.
  rationale: Der griechische Text stellt ausdrücklich einen Zusammenhang zwischen dem Nichtvergeben der Angesprochenen und dem Nichtvergeben des Vaters her; wie dieser theologisch einzuordnen ist, soll die Übersetzung nicht vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Stellung von [a] nach „vergebt“ hält den Satz gut lesbar und kennzeichnet dennoch den gesamten Vers als textkritisch umstritten.
