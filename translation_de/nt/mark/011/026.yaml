- from: Wenn ihr aber nicht vergebt,[a] wird auch euer Vater im Himmel eure Verfehlungen nicht vergeben.
  to: Wenn ihr aber nicht vergebt,[a] wird auch euer Vater im Himmel euch eure Verfehlungen nicht vergeben.
  rationale: Die Übersetzung wird ausschließlich um die im Deutschen notwendige Dativergänzung „euch“ ergänzt. Dadurch wird die im griechischen Text durch ὑμῶν ausgedrückte Beziehung klar und die Rektion von „vergeben“ erfüllt. Die textkritische Fußnote bleibt unverändert, da sie die umstrittene Stellung des gesamten Verses zutreffend und ohne Übersetzungsentscheidung zulasten einer Texttradition kennzeichnet.
