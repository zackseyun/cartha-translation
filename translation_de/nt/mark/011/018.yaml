id: MRK.11.18
reference: Mark 11:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: de
  text: Und die obersten Priester und die Schriftgelehrten hörten davon und suchten nach einer Möglichkeit, ihn zu vernichten[a]; denn sie fürchteten ihn, weil die ganze Menge über seine Lehre außer sich vor Staunen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn zu töten« oder »ihn umzubringen«. Das griechische Verb kann allgemeiner »vernichten« bedeuten; der Zusammenhang legt jedoch eine Tötungsabsicht nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: hörten davon
  rationale: Das ergänzte »davon« stellt im Deutschen idiomatisch den Rückbezug auf Jesu vorausgehendes Handeln und Reden im Tempel her, ohne den Inhalt näher festzulegen.
- source_word: ἀρχιερεῖς
  choice: obersten Priester
  rationale: Die übliche Gruppenbezeichnung für die führenden Jerusalemer Priester; sie vermeidet das missverständliche »Hohepriester« im Plural.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Etablierte und sachlich passende Bezeichnung für die jüdischen Schrift- und Gesetzeskundigen.
- source_word: ἐζήτουν πῶς
  choice: suchten nach einer Möglichkeit
  rationale: Gibt den andauernden, beratenden Charakter des Imperfekts und die Frage nach dem Vorgehen in natürlichem Deutsch wieder.
- source_word: ἀπολέσωσιν
  choice: ihn zu vernichten
  rationale: Bewahrt die breitere Bedeutung von ἀπόλλυμι; der Kontext legt eine Tötungsabsicht nahe, ohne dass diese im Haupttext ausdrücklich enger formuliert werden muss.
- source_word: ἐφοβοῦντο
  choice: sie fürchteten ihn
  rationale: Knapp und würdig; das Imperfekt bezeichnet ihre fortdauernde Furcht vor Jesus beziehungsweise seinem Einfluss.
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menge
  rationale: Gibt die kollektive und nachdrückliche Aussage idiomatisch wieder.
- source_word: ἐξεπλήσσετο
  choice: war außer sich vor Staunen
  rationale: Bringt die starke, anhaltende Erschütterung bzw. Verblüffung des griechischen Verbs deutlicher zum Ausdruck als ein bloßes »staunte«.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: über seine Lehre
  rationale: Natürliches Deutsch für den Anlass beziehungsweise Gegenstand des Staunens.
theological_decisions:
- issue: Reichweite der Absicht der führenden Priester und Schriftgelehrten in ἀπολέσωσιν
  choice: »ihn zu vernichten«
  alternative: »ihn zu töten« / »ihn umzubringen«
  rationale: Der Zusammenhang weist auf eine tödliche Absicht, doch das griechische Verb ist lexikalisch weiter. Der Haupttext bewahrt diese Weite; die Fußnote nennt die im Kontext naheliegende engere Wiedergabe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die Satzverknüpfungen und der begründende Aufbau des Griechischen bleiben erhalten; die zweimalige griechische γάρ-Verbindung wird im Deutschen natürlich mit »denn« und »weil« wiedergegeben.
