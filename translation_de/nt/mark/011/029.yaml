source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: de
  text: 'Jesus aber sagte zu ihnen: „Ich will euch eine Frage stellen.[a] Antwortet mir, dann werde ich euch sagen, mit welcher Vollmacht ich das alles tue.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „ein Wort“; im Zusammenhang kann es auch „eine Sache“ oder „eine Angelegenheit“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet die antwortende Wendung gegenüber der Frage der führenden Männer im vorherigen Vers; „aber“ gibt den leichten Kontrast natürlich wieder.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Entspricht der üblichen erzählenden Verwendung von λέγω mit indirektem Objekt und bleibt nah an der griechischen Formulierung.
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: Ich will euch … stellen
  rationale: Das Futur kündigt Jesu Gegenfrage an. Die deutsche Wendung „eine Frage stellen“ ist natürlich und bewahrt den direkten Sinn.
- source_word: ἕνα λόγον
  choice: eine Frage
  rationale: λόγος bedeutet wörtlich „Wort“, bezeichnet hier im Zusammenhang aber eine einzelne Frage beziehungsweise Angelegenheit, auf die eine Antwort verlangt wird.
- source_word: ἀποκρίθητέ μοι
  choice: Antwortet mir
  rationale: Der Aoristimperativ fordert eine unmittelbare Antwort; der deutsche Imperativ bewahrt diese direkte Aufforderung.
- source_word: καὶ ἐρῶ ὑμῖν
  choice: dann werde ich euch sagen
  rationale: 'Das zweite καί drückt im Zusammenhang die Folge aus: Auf ihre Antwort hin wird Jesus ihnen Auskunft geben. „Dann“ macht diesen Zusammenhang in natürlichem Deutsch deutlich, ohne ihn als ausdrückliche Bedingung umzuformen.'
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: mit welcher Vollmacht
  rationale: „Vollmacht“ bezeichnet hier die legitime Befugnis und Autorisierung zu Jesu Handeln und ist die im Deutschen idiomatische Wiedergabe dieser Streitfrage.
- source_word: ταῦτα ποιῶ
  choice: ich das tue
  rationale: Das zusammenfassende Singularpronomen „das“ bezieht sich im Deutschen natürlich auf die umstrittenen Handlungen; das Präsens gibt den griechischen Gegenwartsbezug wieder.
theological_decisions:
- issue: Bedeutung von ἐξουσία im Kontext
  choice: Vollmacht
  alternative: Autorität; Recht; Macht
  rationale: Im Streit mit den religiösen Verantwortlichen geht es um Jesu legitime Befugnis zu handeln, nicht bloß um seine Fähigkeit oder Kraft. „Vollmacht“ erhält die institutionelle und theologische Spannung, ohne die Herkunft dieser Vollmacht vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die griechische Parataxe wird zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; „dann“ gibt den folgernden Zusammenhang des zweiten καί wieder. Der Fußnotenmarker steht unmittelbar nach der idiomatischen Wiedergabe von ἕνα λόγον.
