source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: de
  text: Und sie kamen nach Jerusalem. Als er in den Tempelbereich[a] hineingegangen war, begann er, die Verkäufer und Käufer im Tempelbereich hinauszutreiben. Die Tische der Geldwechsler und die Sitze der Taubenverkäufer stieß er um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Tempelanlage« beziehungsweise »die Tempelvorhöfe«. Das griechische Wort bezeichnet hier den größeren Tempelkomplex, nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kamen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Vergangenheit wiedergegeben, ohne die Abfolge zu verändern.
- source_word: εἰσελθὼν
  choice: als er … hineingegangen war
  rationale: Die adverbiale Aoristpartizipialform bezeichnet hier eine Handlung, die dem mit ἤρξατο ausgedrückten Beginn vorausgeht; der deutsche Temporalsatz gibt dies klar und idiomatisch wieder.
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: der Tempelbereich / im Tempelbereich
  rationale: ἱερόν bezeichnet hier die größere Tempelanlage und nicht speziell das innere Heiligtum. „Tempelbereich“ macht diese räumliche Bedeutung bereits im Haupttext verständlich.
- source_word: ἤρξατο ἐκβάλλειν
  choice: begann er, … hinauszutreiben
  rationale: Die Konstruktion hebt den Beginn der nachdrücklichen Vertreibung hervor; „hinaustreiben“ ist im Deutschen kraftvoll und kontextgerecht.
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: die … verkauften und kauften
  rationale: Die substantivierten Partizipien werden verbal und parallel wiedergegeben, sodass sowohl Verkäufer als auch Käufer ausdrücklich betroffen sind.
- source_word: κολλυβιστῶν
  choice: Geldwechsler
  rationale: Dies ist die geläufige und sachlich passende deutsche Bezeichnung für Personen, die dort Münzen beziehungsweise Währungen wechselten.
- source_word: καθέδρας
  choice: Sitze
  rationale: „Sitze“ wahrt die allgemeine Bedeutung, ohne eine bestimmte Bauform wie Stuhl oder Bank vorauszusetzen.
- source_word: περιστερὰς
  choice: Tauben
  rationale: „Tauben“ ist im Opferkontext die natürliche deutsche Wiedergabe und legt keine im Griechischen nicht markierte Unterart fest.
- source_word: κατέστρεψεν
  choice: stieß er um
  rationale: Im Zusammenhang mit Tischen und Sitzen bezeichnet das Verb ein gewaltsames Umwerfen; „stieß … um“ klingt natürlich und anschaulich.
theological_decisions:
- issue: Räumlicher Umfang von ἱερόν in der Tempelhandlung
  choice: „Tempelbereich“ im Haupttext, bezogen auf die gesamte zugängliche Tempelanlage
  alternative: „Tempel“ mit erläuternder Fußnote oder „Tempelvorhöfe“
  rationale: ἱερόν ist vom inneren Heiligtum (ναός) zu unterscheiden. „Tempelbereich“ verhindert, dass die Handlung irrtümlich im inneren Heiligtum verortet wird, ohne einen einzelnen Vorhof zu spezifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bewahrt den knappen griechischen Erzählrhythmus. Im zweiten Satz wurde die lange griechische Reihung zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert; die Hervorhebung des abschließenden Umstoßens bleibt erhalten.
