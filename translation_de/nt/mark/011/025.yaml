id: MRK.11.25
reference: Mark 11:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: de
  text: Und jedes Mal, wenn ihr dasteht und betet, vergebt, falls ihr etwas gegen jemanden habt, damit auch euer Vater, der in den Himmeln ist,[a] euch eure Verfehlungen[b] vergibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euer Vater im Himmel«. Wörtlich steht im Griechischen der Plural: »in den Himmeln«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Übertretungen« beziehungsweise »Vergehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: ihr dasteht und betet
  rationale: Die konkrete Gebetshaltung des Verbs bleibt erhalten; das gleichzeitige Partizip wird im natürlichen Deutschen durch zwei koordinierte Verben wiedergegeben.
- source_word: ἀφίετε
  choice: vergebt
  rationale: Im zwischenmenschlichen Zusammenhang bezeichnet ἀφίημι das Vergeben beziehungsweise Erlassen eines Unrechts. Der Imperativ wird unmittelbar beibehalten.
- source_word: εἴ τι ἔχετε κατά τινος
  choice: falls ihr etwas gegen jemanden habt
  rationale: Die Formulierung bewahrt sowohl die Bedingung als auch die unbestimmte, umfassende Aussage von τι und τινος.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: euer Vater, der in den Himmeln ist
  rationale: Die Wiedergabe erhält den ausdrücklich pluralischen griechischen Ausdruck und bleibt im Deutschen verständlich.
- source_word: ἀφῇ
  choice: vergibt
  rationale: Nach »damit« drückt der deutsche Indikativ natürlich den mit ἵνα bezeichneten Zweck beziehungsweise die Folge aus; »auch« erhält die Verknüpfung mit dem menschlichen Vergeben.
- source_word: παραπτώματα
  choice: Verfehlungen
  rationale: »Verfehlungen« gibt das Bild und Bedeutungsspektrum von παράπτωμα verständlich wieder und unterscheidet den Ausdruck vom allgemeineren Wort für Sünden.
theological_decisions:
- issue: Zusammenhang zwischen menschlichem und göttlichem Vergeben
  choice: Die mit ἵνα ausgedrückte Verknüpfung wird direkt mit »damit auch … vergibt« wiedergegeben.
  alternative: Die Aussage als bloßes Anzeichen bereits empfangener Vergebung oder als abgeschwächte Folge zu umschreiben.
  rationale: Der griechische Text stellt einen echten Zusammenhang zwischen dem Vergeben gegenüber anderen und dem Vergeben des Vaters her. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Jedes Mal, wenn« gibt den wiederholenden Sinn von ὅταν wieder; »dasteht und betet« ist idiomatisch und bewahrt zugleich die konkrete Körperhaltung.
