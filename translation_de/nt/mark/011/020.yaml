  text: Καὶ ⸂παραπορευόμενοι πρωῒ⸃ εἶδον τὴν συκῆν ἐξηραμμένην ἐκ ῥιζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/020.yaml
  text: And as they were passing by early in the morning[a], they saw the fig tree withered from the roots.
translation:
  language: de
  text: Als sie früh am Morgen vorbeikamen, sahen sie, dass der Feigenbaum von den Wurzeln her verdorrt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: als sie … vorbeikamen
  rationale: Das Präsenspartizip bezeichnet eine Begleithandlung zum Hauptverb. Die temporale Konstruktion mit „als“ gibt dies im Deutschen natürlich wieder.
- source_word: πρωῒ
  choice: früh am Morgen
  rationale: Die Wendung bewahrt sowohl den Zeitbezug auf den Morgen als auch die Bedeutung der frühen Tageszeit.
- source_word: εἶδον
  choice: sahen sie
  rationale: Die direkte Wiedergabe des Wahrnehmungsverbs bleibt eng am griechischen Text und vermeidet die stärker deutende Formulierung „bemerkten sie“.
- source_word: συκῆν
  choice: der Feigenbaum
  rationale: Dies ist die übliche und kontextgemäße deutsche Bezeichnung.
- source_word: ἐξηραμμένην
  choice: verdorrt war
  rationale: Das Perfektpartizip beschreibt den eingetretenen, fortbestehenden Zustand des Baumes. „Verdorrt“ ist für einen Baum natürlich und „war“ bringt den resultierenden Zustand zum Ausdruck.
- source_word: ἐκ ῥιζῶν
  choice: von den Wurzeln her
  rationale: Die Formulierung bewahrt die mögliche Bedeutung von Ausgangspunkt und Ausmaß, ohne die Bildrichtung durch „bis in die Wurzeln“ umzudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzkonstruktion ist flüssig und hält zugleich die zeitliche Begleithandlung sowie den resultierenden Zustand des Feigenbaums fest.
