  text: Καὶ τῇ ἐπαύριον ἐξελθόντων αὐτῶν ἀπὸ Βηθανίας ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/012.yaml
  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: de
  text: Und am nächsten Tag, nachdem sie Betanien verlassen hatten, hatte er Hunger.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Setzt die Erzählung fort und bewahrt den für Markus typischen verbindenden Stil.
- source_word: τῇ ἐπαύριον
  choice: am nächsten Tag
  rationale: Gibt die adverbiale Zeitangabe idiomatisch und ohne altertümliche Färbung wieder.
- source_word: ἐξελθόντων αὐτῶν
  choice: als sie … verlassen hatten
  rationale: Der Genitivus absolutus bezeichnet eine der Haupthandlung vorausgehende Begleithandlung. Das Plusquamperfekt macht diese zeitliche Beziehung deutlich; „verlassen“ gibt das Herausgehen aus dem Ort natürlich wieder.
- source_word: ἀπὸ Βηθανίας
  choice: Betanien
  rationale: Bei „Betanien verlassen“ ist die durch ἀπό bezeichnete Bewegung vom Ort weg bereits im deutschen Verb enthalten; der Ortsname folgt der üblichen deutschen Form.
- source_word: ἐπείνασεν
  choice: bekam er Hunger
  rationale: Die Form kann den Eintritt des Hungers bezeichnen. „Bekam Hunger“ ist modernes, natürliches Deutsch und bildet diese ingressive Nuance ab, ohne die Aussage auszudeuten.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐπείνασεν
  choice: Das kontextuell auf Jesus bezogene Subjekt wird mit „er“ wiedergegeben.
  alternative: Den Namen „Jesus“ zur Verdeutlichung ergänzen.
  rationale: Im Griechischen bleibt das Subjekt unausgesprochen, ist im Zusammenhang aber eindeutig. „Er“ bewahrt die knappe Ausdrucksweise der Vorlage und bezeugt ohne erklärenden Zusatz seinen wirklichen menschlichen Hunger.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Erzählregister. Die Wortstellung bleibt flüssig; „Betanien verlassen“ vermeidet das im Deutschen schwerfälligere „aus Betanien hinausgegangen waren“.
