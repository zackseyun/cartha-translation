  text: Καὶ ⸀ὅταν ὀψὲ ἐγένετο, ⸀ἐξεπορεύοντο ἔξω τῆς πόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: de
  text: Und sooft es Abend wurde, gingen sie aus der Stadt hinaus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: sooft
  rationale: In Verbindung mit dem Imperfekt bezeichnet ὅταν hier am natürlichsten einen wiederholten oder gewohnheitsmäßigen Vorgang; „sooft“ gibt diesen iterativen Sinn prägnant wieder.
- source_word: ὀψὲ ἐγένετο
  choice: es Abend wurde
  rationale: Die Wendung bezeichnet das Eintreten der späten Tageszeit. „Es Abend wurde“ ist im Deutschen natürlich und bleibt nah an der griechischen Ausdrucksweise.
- source_word: ἐξεπορεύοντο
  choice: gingen sie … hinaus
  rationale: Das Imperfekt trägt im Zusammenhang mit ὅταν einen gewohnheitsmäßigen Sinn. Dieser wird bereits durch „sooft“ klar ausgedrückt, sodass das idiomatische deutsche Präteritum genügt.
- source_word: ἔξω τῆς πόλεως
  choice: aus der Stadt hinaus
  rationale: Die Formulierung bewahrt sowohl die Bewegung aus der Stadt als auch die räumliche Ausrichtung nach draußen.
- source_word: πόλεως
  choice: der Stadt
  rationale: Der griechische Text nennt Jerusalem nicht ausdrücklich, sondern spricht von „der Stadt“; diese Offenheit wird beibehalten.
