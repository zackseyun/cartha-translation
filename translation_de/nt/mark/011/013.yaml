id: MRK.11.13
reference: Mark 11:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: de
  text: Als er von Weitem einen Feigenbaum sah, der Blätter trug, ging er hin, um zu sehen, ob er vielleicht etwas an ihm finden würde. Doch als er zu ihm kam, fand er nichts als Blätter; denn es war nicht die Zeit für Feigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn es war nicht die Feigensaison.“'
    reason: Lexikalische Alternative für καιρός im gegebenen Zusammenhang.
lexical_decisions:
- source_word: ἰδὼν
  choice: Als er … sah
  rationale: Die temporale Partizipialkonstruktion wird im Deutschen natürlich als Nebensatz wiedergegeben, ohne eine darüber hinausgehende zeitliche Abfolge festzulegen.
- source_word: συκῆν
  choice: einen Feigenbaum
  rationale: Dies ist die übliche und kontextgemäße deutsche Entsprechung.
- source_word: ἀπὸ μακρόθεν
  choice: von Weitem
  rationale: Die Formulierung gibt die räumliche Distanz idiomatisch und präzise wieder.
- source_word: ἔχουσαν φύλλα
  choice: der Blätter trug
  rationale: Die Wendung bleibt nah am griechischen Ausdruck und klingt im modernen Deutschen natürlich.
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: ging er hin, um zu sehen, ob er vielleicht etwas an ihm finden würde
  rationale: Die Wiedergabe wahrt sowohl den Zweck der Bewegung als auch die durch εἰ ἄρα ausgedrückte Ungewissheit.
- source_word: ἐν αὐτῇ
  choice: an ihm
  rationale: Bei Früchten an einem Baum ist „an ihm“ im Deutschen idiomatischer als das wörtliche „in ihm“.
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: als er zu ihm kam
  rationale: Die partizipiale Konstruktion wird flüssig und ohne unnötige Bedeutungszusätze wiedergegeben.
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: fand er nichts als Blätter
  rationale: „Nichts als“ bildet die ausschließende Bedeutung von εἰ μὴ knapp und idiomatisch ab.
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: denn es war nicht die Zeit für Feigen
  rationale: καιρός kann hier „Zeit“ oder „Saison“ bezeichnen. „Zeit für Feigen“ bewahrt die direkte Aussage und vermeidet eine erklärende landwirtschaftliche Deutung.
theological_decisions:
- issue: Aussagekraft des erklärenden Satzes über die Zeit der Feigen
  choice: 'Direkte Wiedergabe als Erzählerkommentar: „denn es war nicht die Zeit für Feigen“'
  alternative: „denn es war nicht die Feigensaison“ oder eine erweiternde Erklärung über den Fruchtstand von Feigenbäumen
  rationale: Die Spannung, dass Jesus nach Früchten sucht, obwohl es nicht deren Zeit war, bleibt bestehen und wird weder abgeschwächt noch durch ergänzende Annahmen aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gut verständlich, bleibt aber dem erzählerischen Aufbau und der bewusst ungelösten Spannung des griechischen Textes nahe.
