  source_fidelity: Die inhaltliche Wiedergabe ist weitgehend zutreffend. „Vollmacht“ gibt ἐξουσία gut wieder, und „das alles“ wahrt den Umfang von ταῦτα. Allerdings fügt „Dann“ einen folgernden Sinn hinzu, den οὐδέ nicht ausdrücklich hat; die griechischen historischen Präsensformen werden zudem ohne zwingenden Grund als Präteritum wiedergegeben.
  naturalness: Der Entwurf ist gut verständliches modernes Standarddeutsch. Ein durchgängiges historisches Präsens ist hier ebenfalls natürlich und bildet den erzählerischen Stil des Ausgangstextes genauer ab. „Auch ich sage euch nicht“ ist idiomatisch und rhetorisch klar, ohne die zusätzliche Folgerung von „Dann“.
  terminology: „Vollmacht“ ist für ἐξουσία präzise und im kirchlich-literarischen Register etabliert, ohne den Ursprung dieser Vollmacht vorwegzunehmen. Die Alternative „Autorität“ ist nicht erforderlich.
