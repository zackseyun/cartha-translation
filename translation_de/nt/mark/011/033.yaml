  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: de
  text: 'Sie antworten Jesus: „Wir wissen es nicht.“ Und Jesus sagt zu ihnen: „Auch ich sage euch nicht, mit welcher Vollmacht ich dies alles tue.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: Da antworteten sie
  rationale: Das adverbiale Partizip leitet ihre unmittelbare Antwort ein; die finite deutsche Form gibt den Zusammenhang natürlich und präzise wieder.
- source_word: λέγουσιν / λέγει / λέγω
  choice: antworteten / sagte / sage
  rationale: Deutsch verwendet in erzählenden Texten natürlicherweise das Präteritum; im direkten Wort Jesu bleibt das Präsens erhalten. Das erste λέγουσιν ist zusammen mit ἀποκριθέντες idiomatisch durch „antworteten“ wiedergegeben.
- source_word: Οὐκ οἴδαμεν
  choice: Wir wissen es nicht
  rationale: Die Form hat präsentische Bedeutung. Das ergänzte „es“ nimmt die zuvor gestellte Frage natürlich auf.
- source_word: Οὐδὲ ἐγὼ
  choice: Dann sage auch ich ... nicht
  rationale: „Dann ... auch ich nicht“ bewahrt die rhetorische Entsprechung zwischen ihrer verweigerten Antwort und Jesu Gegenantwort und klingt im Deutschen natürlich.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: mit welcher Vollmacht
  rationale: „Mit welcher Vollmacht“ bezeichnet hier die Befugnis beziehungsweise autorisierte Grundlage des Handelns und ist im Deutschen idiomatisch.
- source_word: ταῦτα
  choice: das alles
  rationale: Die Wendung fasst die mehreren zuvor angesprochenen Handlungen Jesu natürlich zusammen und wahrt den pluralischen Umfang des griechischen Demonstrativpronomens.
- source_word: ποιῶ
  choice: ich ... tue
  rationale: Das Präsens entspricht der griechischen Form und bezeichnet Jesu gegenwärtiges beziehungsweise charakteristisches Handeln.
theological_decisions:
- issue: Bedeutung von ἐξουσία
  choice: Vollmacht
  alternative: Autorität / Befugnis
  rationale: „Vollmacht“ wahrt sowohl den Gedanken legitimer Befugnis als auch den theologischen Nachhall der Frage nach dem Ursprung von Jesu Handeln, ohne diesen Ursprung im Vers bereits festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der griechische historische Präsensstil wird zugunsten natürlicher deutscher Erzählweise im Hauptsatz mit Präteritum wiedergegeben; Jesu direkte Rede bleibt im Präsens. Keine Fußnote ist erforderlich.
