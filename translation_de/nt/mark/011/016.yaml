  text: καὶ οὐκ ἤφιεν ἵνα τις διενέγκῃ σκεῦος διὰ τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/016.yaml
  text: And he would not allow anyone to carry a vessel through the temple courts[a][b].
translation:
  language: de
  text: Und er ließ nicht zu, dass jemand irgendeinen Gegenstand[a] durch den Tempelbezirk[b] trug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gefäß“, „einen Behälter“ oder „ein Gerät“. Das griechische Wort bezeichnet allgemein einen Gegenstand und legt dessen Art nicht fest.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch das Tempelgelände“. Gemeint ist die gesamte Tempelanlage, nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤφιεν
  choice: ließ nicht zu
  rationale: Der Imperfekt bezeichnet hier ein andauerndes beziehungsweise wiederholtes Verhindern. „Ließ nicht zu“ gibt dies in natürlichem Deutsch wieder, ohne den Vorgang auf einen einzigen Augenblick zu beschränken.
- source_word: ἵνα τις διενέγκῃ
  choice: dass jemand … trug
  rationale: Nach ἤφιεν bezeichnet ἵνα mit Konjunktiv das Geschehen, das Jesus nicht zuließ. Der deutsche dass-Satz ist idiomatisch; das Indefinitpronomen τις wird mit „jemand“ wiedergegeben.
- source_word: διενέγκῃ
  choice: durch … trug
  rationale: Das Verb bezeichnet hier das Tragen oder Befördern von einem Ort zu einem anderen. Die Bewegung durch das Gelände wird durch „durch“ ausdrücklich erfasst.
- source_word: σκεῦος
  choice: irgendeinen Gegenstand
  rationale: σκεῦος ist ein weiter Begriff für einen Gegenstand, ein Gerät, Gefäß oder Behältnis. „Gegenstand“ vermeidet eine unbelegte Festlegung auf Art oder Zweck; „irgendeinen“ macht im Deutschen die unbestimmte Reichweite natürlich deutlich.
- source_word: διὰ τοῦ ἱεροῦ
  choice: durch den Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage und nicht speziell das innere Heiligtum (ναός). „Tempelbezirk“ ist präzise, verständlich und umfasst Höfe sowie weitere Bereiche der Anlage.
theological_decisions:
- issue: Umfang der Bezeichnung ἱερόν beim Jerusalemer Tempel
  choice: Tempelbezirk als Bezeichnung für die gesamte Tempelanlage
  alternative: Tempel; Tempelgelände; Tempelhöfe
  rationale: Die Wiedergabe unterscheidet die umfassendere Tempelanlage vom inneren Heiligtum, ohne genauer festzulegen, durch welchen einzelnen Hof die Gegenstände getragen wurden.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Satzstellung bleibt nah am griechischen Gedankengang, während „Tempelbezirk“ und „Gegenstand“ unnötige sachliche Verengungen vermeiden.
