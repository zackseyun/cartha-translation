  source_fidelity: 'Der Text gibt die wesentlichen Elemente des griechischen Satzes zuverlässig wieder: die narrative Einleitung, die direkte Anrede des aufgrund von »Feigenbaum« maskulinen deutschen Bezugsworts, den volitiven und endgültigen Urteilsspruch sowie das Hören der Jünger. »Nie wieder soll jemand … essen« trifft μηκέτι … εἰς τὸν αἰῶνα und den Optativ φάγοι idiomatisch und ohne ihn zu einer bloßen Zukunftsprognose abzuschwächen.'
  naturalness: Modernes, verständliches Standarddeutsch mit angemessen würdigem Erzählregister. »Da sagte er zu ihm« ist als natürliche Glättung des griechischen Erzählidioms vertretbar; die genauere Form ist sachgerecht erläutert. »Hörten es« ist idiomatisch und lässt die mögliche durative Nuance des Imperfekts offen.
  terminology: Die direkte Anrede »von dir« bewahrt die Personifikation des Feigenbaums. »Frucht«, »Jünger« und die Formulierung des Urteilsspruchs sind terminologisch angemessen. Die Fußnoten erklären die idiomatische Einleitung, die Dauerform und die Wendung εἰς τὸν αἰῶνα ausreichend, ohne eine konfessionelle Deutung einzutragen.
