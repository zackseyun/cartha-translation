id: MRK.11.14
reference: Mark 11:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: de
  text: 'Da sagte er zu ihm[a]: »Nie wieder soll jemand eine Frucht von dir essen!«[b] Und seine Jünger hörten es.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Und antwortend sagte er zu ihm.« »Antworten« ist im Griechischen auch dann eine geläufige Erzählwendung, wenn keine vorausgehende Äußerung berichtet wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »In Ewigkeit soll niemand mehr eine Frucht von dir essen.« Wörtlich steht für »in Ewigkeit«: »bis ins Zeitalter hinein«.'
    reason: alternative_reading
  - marker: c
    text: 'Der griechische Imperfekt kann auch den andauernden Vorgang betonen: »Und seine Jünger hörten dabei zu.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Da sagte er
  rationale: Das griechische Partizip bedeutet wörtlich »antwortend«, ist hier jedoch eine geläufige Erzählwendung, obwohl keine vorausgehende Äußerung des Baumes berichtet wird. »Da sagte er« gibt den natürlichen deutschen Erzählfluss wieder; die wörtlichere Form wird in einer Fußnote genannt.
- source_word: αὐτῇ
  choice: zu ihm
  rationale: Das Pronomen ist im Griechischen feminin, weil συκῆ (»Feigenbaum«) feminin ist. Im Deutschen richtet sich das Pronomen nach dem maskulinen Substantiv »Feigenbaum«.
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: Nie wieder
  rationale: Die Verbindung von »nicht mehr« mit der Wendung »in Ewigkeit« bezeichnet eine endgültige Beendigung. »Nie wieder« ist im Deutschen knapp, natürlich und nachdrücklich.
- source_word: ἐκ σοῦ
  choice: von dir
  rationale: Der Baum wird unmittelbar in der zweiten Person angesprochen. »Von dir« bewahrt diese anschauliche direkte Anrede.
- source_word: μηδεὶς
  choice: jemand (im negierten Satz)
  rationale: Zusammen mit »nie wieder« ergibt »soll jemand« die natürliche deutsche Entsprechung zu »niemand soll jemals wieder«.
- source_word: καρπὸν
  choice: eine Frucht
  rationale: Der griechische Singular kann generisch verstanden werden. Im Deutschen passt »eine Frucht« idiomatisch zur verneinten Aussage und macht ihren umfassenden Sinn deutlich.
- source_word: φάγοι
  choice: soll … essen
  rationale: Der Aorist Optativ drückt hier einen Wunsch beziehungsweise einen Fluch- oder Urteilsspruch aus. Die Konstruktion mit »soll« bewahrt diesen volitiven Charakter und vermeidet die Umdeutung in eine bloße Zukunftsvorhersage.
- source_word: ἤκουον
  choice: hörten es
  rationale: Der griechische Imperfekt bezeichnet das Hören der ausgesprochenen Worte und kann einen andauernden Vorgang hervorheben. »Hörten es« ist im Deutschen natürlich; die aspektuell stärker durative Möglichkeit wird in der Fußnote genannt.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Dies ist die natürliche standarddeutsche Wiedergabe der griechischen Possessivverbindung.
theological_decisions:
- issue: Art des Ausspruchs Jesu über den Feigenbaum
  choice: 'Wiedergabe als wirksamer Wunsch- beziehungsweise Urteilsspruch: »Nie wieder soll jemand … essen!«'
  alternative: 'Wiedergabe als reine Vorhersage: »Niemand wird je wieder … essen.«'
  rationale: Der Optativ φάγοι ist volitiv und kein Futur Indikativ. Die Übersetzung erhält daher den Charakter eines Fluch- oder Gerichtswortes, ohne seine theologische Bedeutung weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede des Feigenbaums bleibt erhalten. Der griechische Erzählidiom bei ἀποκριθείς wird im Haupttext natürlich wiedergegeben und in der Fußnote formal genauer ausgewiesen; der Optativ bleibt als Urteilsspruch statt als bloße Zukunftsaussage erkennbar.
