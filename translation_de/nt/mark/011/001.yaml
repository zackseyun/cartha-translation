  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: de
  text: Als sie sich Jerusalem nähern, bei Betfage und Betanien nahe dem Ölberg[a], schickt er zwei seiner Jünger.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechischen Ortsangaben können auch stärker als Richtungsangaben verstanden werden: „nach Betfage und Betanien, auf den Ölberg zu“.'
    reason: lexical_alternative
  - marker: b
    text: 'Markus erzählt hier im Präsens. Dem üblichen deutschen Erzähltempus entsprechend kann man auch übersetzen: „Als sie sich Jerusalem näherten …, schickte er …“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: sie sich … nähern
  rationale: Das Präsens des griechischen Erzähltexts wird beibehalten; „sich Jerusalem nähern“ gibt die Annäherungsbewegung idiomatisch und ohne unnötige Ergänzung wieder.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Beim deutschen Verb „sich nähern“ steht das Ziel im Dativ ohne Präposition; so wird die Funktion von εἰς natürlich wiedergegeben.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: bei Betfage und Betanien
  rationale: Im Zusammenhang bezeichnet die Wendung plausibel die Gegend, in der sich die Reisenden Jerusalem nähern. Eine Fußnote bewahrt die stärker direktionale Wiedergabemöglichkeit.
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: nahe dem Ölberg
  rationale: πρός bezeichnet hier wahrscheinlich die räumliche Nähe beziehungsweise Lage am Ölberg; die mögliche Richtungsangabe wird in der Fußnote genannt.
- source_word: ἀποστέλλει
  choice: schickt
  rationale: Das historische Präsens des Markus bleibt erhalten und verleiht der Erzählung Unmittelbarkeit.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: zwei seiner Jünger
  rationale: 'Diese natürliche deutsche Formulierung bewahrt die partitive Bedeutung: zwei aus der Gruppe seiner Jünger.'
- source_word: Βηθφαγὴ
  choice: Betfage
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: Βηθανίαν
  choice: Betanien
  rationale: Gebräuchliche deutsche Form des Ortsnamens.
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: Ölberg
  rationale: Eingebürgerte deutsche Bezeichnung des Ortes.
