  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: de
  text: 'Da antwortete Jesus ihnen: »Habt Glauben an Gott.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Glauben Gottes«. Dies kann auch als »Gottes Treue« oder als »von Gott geschenkter Glauben« verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: antwortete
  rationale: Das Partizip leitet hier Jesu Erwiderung ein. Im natürlichen deutschen Erzählstil wird es zusammen mit λέγει als finites Verb wiedergegeben.
- source_word: λέγει
  choice: Da antwortete Jesus ihnen
  rationale: Das historische Präsens wird idiomatisch im deutschen Erzählpräteritum wiedergegeben. Zusammen mit ἀποκριθεὶς ergibt sich eine natürliche Redeeinleitung; »Da« stellt den Anschluss an die vorausgehende Äußerung her.
- source_word: Ἔχετε
  choice: Habt
  rationale: Der Präsensimperativ fordert zu einer bestehenden beziehungsweise fortdauernden Haltung auf. »Habt« ist knapp und deutet den Aspekt nicht durch Zusätze wie »bewahrt« übermäßig aus.
- source_word: πίστιν
  choice: Glauben
  rationale: Im Kontext der anschließenden Lehre über Glauben und Gebet ist »Glauben« die natürliche Wiedergabe. Die mögliche Bedeutung »Treue« wird wegen der mehrdeutigen Genitivverbindung in der Fußnote berücksichtigt.
- source_word: θεοῦ
  choice: an Gott
  rationale: Als objektiver Genitiv verstanden bezeichnet θεοῦ das Ziel des Glaubens. Diese Lesart passt am besten zur Aufforderung und zum unmittelbaren Kontext, ohne die grammatischen Alternativen zu verschweigen.
theological_decisions:
- issue: Mehrdeutiger Genitiv in πίστιν θεοῦ
  choice: 'objektiver Genitiv: »Glauben an Gott«'
  alternative: »Glauben Gottes«, ferner möglicherweise »Gottes Treue« oder »Glauben von Gott«
  rationale: Der Zusammenhang mit Jesu anschließender Aufforderung zu glaubendem Gebet spricht dafür, dass der Glaube auf Gott gerichtet ist. Da die griechische Formulierung die Beziehung jedoch nicht ausdrücklich festlegt, werden die weniger wahrscheinlichen Lesarten in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Erzählpräteritum entspricht natürlichem deutschem Bibelstil; die direkte Rede bleibt knapp und eindringlich.
