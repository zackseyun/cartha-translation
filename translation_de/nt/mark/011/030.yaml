  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων; ἀποκρίθητέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/030.yaml
  text: Was John's baptism from heaven or from men? Answer me[a][b].
translation:
  language: de
  text: War die Taufe des Johannes vom Himmel[a] oder von Menschen[b]? Antwortet mir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von Gott«. Im Griechischen steht »vom Himmel«, eine jüdische Ausdrucksweise für göttlichen Ursprung oder göttliche Vollmacht.'
    reason: lexical_alternative
  - marker: b
    text: '»Von Menschen« bedeutet hier: menschlichen Ursprungs oder menschlicher Autorität.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ βάπτισμα τὸ Ἰωάννου
  choice: die Taufe des Johannes
  rationale: Der Genitiv bezeichnet die mit Johannes verbundene beziehungsweise von ihm vollzogene Taufe. „Die Taufe des Johannes“ ist im Deutschen natürlich und quellenah.
- source_word: ἐξ οὐρανοῦ
  choice: vom Himmel
  rationale: Die Wendung wird wörtlich bewahrt. Sie ist eine jüdische ehrerbietige Ausdrucksweise für göttlichen Ursprung oder göttliche Vollmacht.
- source_word: ἐξ ἀνθρώπων
  choice: von Menschen
  rationale: Die generische Bedeutung von ἄνθρωποι wird inklusiv und idiomatisch wiedergegeben; zugleich bleibt der Gegensatz zu „vom Himmel“ erhalten.
- source_word: ἀποκρίθητέ μοι
  choice: Antwortet mir
  rationale: Der Imperativ verlangt eine unmittelbare Antwort. Die Pluralform entspricht den angesprochenen Gesprächspartnern und wahrt den Nachdruck.
- source_word: ἦν ἢ
  choice: War … oder …?
  rationale: Die Formulierung folgt dem griechischen ἦν und ist auch im Deutschen klar und natürlich.
theological_decisions:
- issue: Bedeutung von „vom Himmel“ in Jesu Frage
  choice: Die Wendung „vom Himmel“ bleibt im Haupttext erhalten und bezeichnet göttlichen Ursprung beziehungsweise göttliche Vollmacht.
  alternative: von Gott
  rationale: So bleibt die jüdische Umschreibung und damit die rhetorische Gestalt der Frage erhalten, ohne ihre theologische Bedeutung im Haupttext ausdrücklich auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Gegenüberstellung und der nachdrückliche Imperativ des Ausgangstextes bleiben erhalten.
