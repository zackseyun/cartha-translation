reference: Mark 11:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: de
  text: Und er zog in Jerusalem ein und ging in den Tempelbezirk[a]. Nachdem er sich alles angesehen hatte, ging er, da es schon spät war[b], mit den Zwölf[c] hinaus nach Betanien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in die Tempelanlage“ beziehungsweise einfach „in den Tempel“. Das griechische Wort bezeichnet den gesamten Tempelbezirk, nicht speziell das innere Heiligtum.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „weil es schon spät am Tag war“. Die Formulierung kann sowohl den zeitlichen Umstand als auch den Grund für den Aufbruch hervorheben.'
    reason: lexical_alternative
  - marker: c
    text: Gemeint sind Jesu zwölf Jünger.
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: ging ... hinein
  rationale: Gibt die erzählerische Bewegung des Aorists natürlich wieder und bewahrt den Richtungssinn des Eintretens.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: Etablierte deutsche Form des Ortsnamens.
- source_word: τὸ ἱερόν
  choice: den Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage und nicht speziell das innere Heiligtum (ναός). „Tempelbezirk“ ist räumlich präzise und verständlich.
- source_word: περιβλεψάμενος πάντα
  choice: Nachdem er sich dort alles angesehen hatte
  rationale: Das Partizip beschreibt ein umfassendes Umschauen; die temporale Wiedergabe macht die Abfolge der Handlungen im Deutschen klar. „dort“ verdeutlicht idiomatisch den örtlichen Bezug, ohne den Sinn einzuengen.
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: da es schon spät war
  rationale: Die Genitivus-abs.-Konstruktion bezeichnet einen zeitlichen Umstand, der zugleich den Aufbruch begründet; „da“ bewahrt diese zeitlich-kausale Offenheit.
- source_word: ἐξῆλθεν εἰς Βηθανίαν
  choice: ging ... hinaus nach Betanien
  rationale: Bewahrt die Richtungsbedeutung von ἐξέρχομαι und gibt εἰς beim Ortsziel idiomatisch mit „nach“ wieder.
- source_word: Βηθανίαν
  choice: Betanien
  rationale: Etablierte moderne deutsche Form des Ortsnamens.
- source_word: μετὰ τῶν δώδεκα
  choice: mit den Zwölf
  rationale: Die substantivierte Zahl bezeichnet die bekannte Gruppe der zwölf Jünger. Die Großschreibung ist im Deutschen bei substantivierten Zahlwörtern orthografisch angemessen und keine zusätzliche Amtsbezeichnung.
theological_decisions:
- issue: Räumlicher Bezug von τὸ ἱερόν
  choice: Tempelbezirk, also die gesamte Tempelanlage
  alternative: Tempel
  rationale: Die Wiedergabe unterscheidet ἱερόν vom inneren Heiligtum (ναός) und passt dazu, dass Jesus den zugänglichen Bereich betritt und überschaut, ohne über den genauen Standort innerhalb der Anlage hinauszugehen.
- issue: Bezeichnung οἱ δώδεκα
  choice: die Zwölf
  alternative: die zwölf Jünger
  rationale: Die knappe Form des griechischen Textes bleibt erhalten. Eine Fußnote identifiziert die Gruppe, ohne „Jünger“ in den Haupttext einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. „Tempelbezirk“ hält die räumliche Unterscheidung des griechischen Wortschatzes fest; „da es schon spät war“ bewahrt den zeitlich-kausalen Spielraum der Genitivus-abs.-Konstruktion.
