  source_fidelity: Der Text gibt den griechischen Satz vollständig und zutreffend wieder. „Da erinnerte sich Petrus“ bildet das vorzeitige Aoristpartizip ἀναμνησθείς idiomatisch ab; „sagt“ bewahrt das historische Präsens λέγει. „Zu ihm“, „Rabbi“, „sieh doch“, „Feigenbaum“, „den du verflucht hast“ und „ist verdorrt“ entsprechen jeweils dem Ausgangstext. Das Perfekt ἐξήρανται wird mit gegenwartsbezogenem Ergebnis angemessen wiedergegeben.
  naturalness: Modernes Standarddeutsch, gut lesbar und der direkte Ausruf klingt natürlich. Die Kombination aus vorzeitigem Präteritum („erinnerte sich“) und historischem Präsens („sagt“) ist im erzählerisch-biblischen Register verständlich und bildet die griechische Gestaltung sinnvoll nach.
  terminology: „Rabbi“ bewahrt die Anredeform und den jüdischen Kontext. „Feigenbaum“, „verflucht“ und „verdorrt“ sind semantisch treffend und registergerecht. „Sieh doch!“ ist eine natürliche deutsche Wiedergabe des aufmerksam machenden ἴδε, ohne den Sinn wesentlich einzuengen.
