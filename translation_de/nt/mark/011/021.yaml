  text: καὶ ἀναμνησθεὶς ὁ Πέτρος λέγει αὐτῷ· Ῥαββί, ἴδε ἡ συκῆ ἣν κατηράσω ἐξήρανται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/021.yaml
  text: And Peter[a], remembering, says to him, “Rabbi, look—the fig tree that you cursed has withered.”
translation:
  language: de
  text: 'Da erinnerte sich Petrus und sagt zu ihm: „Rabbi, sieh doch! Der Feigenbaum, den du verflucht hast, ist verdorrt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναμνησθεὶς
  choice: Da erinnerte sich
  rationale: Das Aoristpartizip bezeichnet hier, dass Petrus sich erinnert bzw. daran erinnert wird. Die finite deutsche Wendung gibt den zeitlich-sachlichen Anschluss natürlich wieder, ohne eine Ursache ausdrücklich festzulegen.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt das für Markus typische historische Präsens und damit die lebendige Erzählweise.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Das Pronomen bleibt wie im Griechischen stehen; aus dem Zusammenhang ist Jesus als Bezugsperson eindeutig.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die im griechischen Text transliterierte jüdische Anrede wird beibehalten und nicht erklärend mit „Lehrer“ ersetzt.
- source_word: ἴδε
  choice: sieh doch
  rationale: Die Aufforderung wird in natürlichem, gegenwärtigem Deutsch wiedergegeben; „doch“ bringt den aufmerksam machenden Ausruf zur Geltung, ohne zusätzliche Sachinformation einzuführen.
- source_word: συκῆ
  choice: Feigenbaum
  rationale: Im Zusammenhang bezeichnet das Substantiv den Baum, nicht die Frucht.
- source_word: κατηράσω
  choice: den du verflucht hast
  rationale: Die direkte Formulierung entspricht dem Aorist von καταράομαι und lässt Petrus Jesus unmittelbar auf dessen vorherige Handlung ansprechen.
- source_word: ἐξήρανται
  choice: ist verdorrt
  rationale: „Verdorren“ ist bei einem Baum idiomatisch und deckt sowohl Austrocknen als auch Welken ab. Das deutsche Ergebnisperfekt vermittelt den abgeschlossenen Vorgang mit gegenwärtigem Resultat.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem historischem Präsens. Die direkte Rede klingt spontan und anschaulich; „Rabbi“ erhält das jüdische Kolorit des Ausgangstextes.
