  source_fidelity: Der erste Teilsatz gibt πολλοὶ, ἱμάτια und das Ausbreiten auf den Weg zutreffend wieder. Im zweiten Teilsatz ist die im Griechischen bei ἄλλοι δέ ausgesparte Wiederaufnahme von ἔστρωσαν zwar grundsätzlich erkennbar, im Deutschen führt die Ellipse jedoch zu einem unvollständigen und missverständlichen Satz. στιβάδες bezeichnet hier geschnittenes grünes Pflanzenmaterial bzw. belaubte Zweige; „Büschel“ fügt die nicht ausdrücklich bezeichnete Vorstellung gebundener Bündel hinzu.
  naturalness: „Andere aber Büschel von Zweigen …“ besitzt im modernen Standarddeutsch kein finites Prädikat und ist nicht als natürliche Erzählprosa verständlich. Die Wiederholung von „breiteten … aus“ macht den Satz vollständig und klar.
  terminology: „Mäntel“ ist für ἱμάτια im Kontext angemessen. „Laubzweige“ gibt die Vegetationsbedeutung von στιβάδες idiomatisch wieder, ohne Palmzweige zu unterstellen. Die Fußnote wahrt die lexikalische Offenheit und die Abgrenzung von spezifischen Palmzweigen.
