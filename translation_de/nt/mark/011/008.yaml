  text: ⸂καὶ πολλοὶ⸃ τὰ ἱμάτια αὐτῶν ἔστρωσαν εἰς τὴν ὁδόν, ἄλλοι δὲ στιβάδας ⸂κόψαντες ἐκ τῶν ἀγρῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: de
  text: Viele breiteten ihre Mäntel auf dem Weg aus, andere aber breiteten Laubzweige aus, die sie auf den Feldern abgeschnitten hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zweige“ oder „abgeschnittenes Laub“. Das griechische Wort bezeichnet allgemein abgeschnittenes Pflanzenmaterial oder Laubzweige, nicht ausdrücklich Palmzweige.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Gibt das quantitative Adjektiv schlicht und ohne zusätzliche Verstärkung wieder.
- source_word: ἱμάτια
  choice: Mäntel
  rationale: Bezeichnet hier die Obergewänder, die auf dem Weg ausgebreitet wurden; „Mäntel“ ist im heutigen Deutsch natürlich und anschaulich.
- source_word: ἔστρωσαν εἰς τὴν ὁδόν
  choice: breiteten … auf dem Weg aus
  rationale: Gibt die Handlung idiomatisch wieder; εἰς bezeichnet in Verbindung mit dem Verb die Ablage auf die Oberfläche des Weges.
- source_word: ἄλλοι δὲ
  choice: andere aber
  rationale: Bewahrt den leichten weiterführenden Kontrast von δέ, ohne ihn zu überbetonen.
- source_word: στιβάδας
  choice: Büschel von Zweigen
  rationale: Das Wort bezeichnet zusammengetragenes oder geschichtetes Pflanzenmaterial, etwa Laub, Zweige oder Schilf. Die Formulierung vermeidet die sachlich zu enge Festlegung auf Palmzweige.
- source_word: κόψαντες ἐκ τῶν ἀγρῶν
  choice: die sie auf den Feldern abgeschnitten hatten
  rationale: Der vorzeitige Aoristpartizip wird in natürlichem Deutsch als Relativsatz mit Plusquamperfekt wiedergegeben; ἀγροί wird unmittelbar mit „Felder“ übersetzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt erzählerisch knapp; die Wiederholung des Verbs wird wie im Griechischen durch Ellipse vermieden. Die ungewöhnliche Breite von στιβάδας wird im Text annähernd und in der Fußnote ausdrücklich wiedergegeben.
