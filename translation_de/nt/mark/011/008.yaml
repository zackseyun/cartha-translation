  - severity: low
    issue: „Büschel von Zweigen“ ist zu konkret und stilistisch unnatürlich.
    rationale: στιβάδες besagt nicht, dass die Zweige zu Büscheln gebunden waren. „Laubzweige“ ist kontextgerecht und vermeidet diesen Zusatz.
