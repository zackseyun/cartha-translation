reference: Mark 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: de
  text: 'Und wenn jemand zu euch sagt: »Warum tut ihr das?«, dann sagt: »Der Herr braucht es und wird es sofort wieder hierherschicken.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und schickt es sofort wieder hierher«. Das griechische Präsens kann hier futurische Bedeutung haben und bezeichnet die unmittelbar folgende Rücksendung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: wenn jemand zu euch sagt
  rationale: ἐάν mit Aorist Konjunktiv bezeichnet eine offene, auf die Zukunft bezogene Bedingung; die deutsche Formulierung gibt sie natürlich wieder.
- source_word: Τί ποιεῖτε τοῦτο;
  choice: Warum tut ihr das?
  rationale: τί hat hier im Zusammenhang den Sinn einer Nachfrage beziehungsweise Beanstandung des Handelns. Die idiomatische deutsche Frage bewahrt diese Funktion.
- source_word: εἴπατε
  choice: dann sagt
  rationale: Der Aorist Imperativ Plural wird direkt als Aufforderung wiedergegeben; »dann« macht den Zusammenhang mit dem Bedingungssatz im Deutschen deutlich.
- source_word: Ὁ κύριος
  choice: Der Herr
  rationale: κύριος wird als Titel wiedergegeben. Im Erzählzusammenhang bezieht sich die Aussage am naheliegendsten auf Jesus; die mögliche allgemeinere Bedeutung »Herr« oder »Besitzer« wird nicht in den Haupttext eingetragen.
- source_word: αὐτοῦ χρείαν ἔχει
  choice: braucht es
  rationale: Die natürliche deutsche Entsprechung der Wendung »hat Bedarf an ihm/ihm nötig« ist »braucht es«. Das Pronomen bezieht sich auf das Fohlen aus dem vorherigen Vers; für ein Tier ist im Deutschen das grammatische Neutrum sachgerecht.
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus typische Dringlichkeit und ist in modernem Deutsch natürlich.
- source_word: ἀποστέλλει
  choice: schickt
  rationale: Das griechische Präsens bleibt als Präsens erhalten. Es kann im Zusammenhang futurische Bedeutung haben, doch die deutsche Präsensform kann ebenfalls auf die unmittelbar bevorstehende Handlung verweisen und erhält die Tempusspannung.
- source_word: πάλιν ὧδε
  choice: wieder hierher
  rationale: πάλιν bezeichnet hier die Rücksendung, während ὧδε das Ziel »hierher« angibt.
theological_decisions:
- issue: Bedeutung und Bezug von κύριος
  choice: »Der Herr« als Titel mit naheliegendem Bezug auf Jesus
  alternative: »der Herr/Besitzer« in gewöhnlichem, nichttitelhaftem Sinn
  rationale: Der Kontext legt Jesus als denjenigen nahe, der das Fohlen benötigt. »Der Herr« bewahrt zugleich die mögliche titelartige Kraft von κύριος, ohne weitergehende christologische Aussagen in den Vers hineinzulesen.
- issue: Subjekt von ἀποστέλλει
  choice: Das unausgesprochene Subjekt bleibt im Deutschen unbestimmt und ergibt sich aus »jemand« im Bedingungssatz
  alternative: Ausdrücklich »er wird es schicken« beziehungsweise eine Deutung, nach der der Herr es zurückschickt
  rationale: Die dritte Person Singular hat kein ausdrücklich genanntes Subjekt. Die fortlaufende Syntax lässt am ehesten die fragende Person beziehungsweise den Verfügungsberechtigten als Handelnden verstehen; durch die deutsche Verbform bleibt dies kontextuell, ohne einen zusätzlichen Referenten einzusetzen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede wird idiomatisch formuliert; das griechische Präsens in ἀποστέλλει bleibt bewusst erhalten, während die Fußnote die futurische Auffassung nennt.
