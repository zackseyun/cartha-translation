source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: de
  text: 'Darum sage ich euch: Was immer ihr im Gebet erbittet, glaubt, dass ihr es empfangen habt[a], und es wird euch zuteilwerden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben sinngemäß: „dass ihr es empfangt“. Der hier zugrunde gelegte griechische Text lautet: „dass ihr es empfangen habt“.'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Darum
  rationale: Die knappe Folgerungsformel verbindet den Satz natürlich mit der vorausgehenden Lehre über Glauben und Gebet.
- source_word: πάντα ὅσα προσεύχεσθε καὶ αἰτεῖσθε
  choice: Was immer ihr im Gebet erbittet
  rationale: Diese idiomatische deutsche Formulierung bewahrt sowohl den umfassenden Sinn von πάντα ὅσα als auch die Verbindung von Beten und Bitten, ohne die im Deutschen schwerfällige Koordination „betet und bittet“ nachzuahmen.
- source_word: πιστεύετε
  choice: glaubt
  rationale: Der Imperativ fordert zum Glauben an den Inhalt des folgenden dass-Satzes auf; „glaubt“ gibt diese Konstruktion unmittelbar wieder.
- source_word: ἐλάβετε
  choice: ihr es empfangen habt
  rationale: Das Perfekt im Deutschen bringt die im griechischen Aorist dargestellte abgeschlossene Handlung mit gegenwärtiger Bedeutung zum Ausdruck und erhält die auffällige zeitliche Spannung.
- source_word: ἔσται ὑμῖν
  choice: es wird euch zuteilwerden
  rationale: Die Wendung gibt das zukünftige „Es wird für euch/bei euch sein“ natürlich und würdig wieder, ohne genauer festzulegen, auf welche Weise die Bitte erfüllt wird.
theological_decisions:
- issue: Zeitliches Verhältnis zwischen glaubendem Gebet und Erfüllung
  choice: „glaubt, dass ihr es empfangen habt, und es wird euch zuteilwerden“
  alternative: „glaubt, dass ihr es empfangt, und es wird euch zuteilwerden“
  rationale: Der zugrunde gelegte griechische Text hat ἐλάβετε und stellt den Empfang als abgeschlossen dar, während die anschließende Erfüllung zukünftig formuliert ist. Diese Spannung bleibt erhalten, statt durch eine bestimmte Lehre über Gebet erklärt oder geglättet zu werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Im Gebet erbittet“ ist idiomatischer als eine wörtliche Doppelung der beiden griechischen Verben; „zuteilwerden“ erhält die offene, nicht mechanistisch erklärte Form der Verheißung.
