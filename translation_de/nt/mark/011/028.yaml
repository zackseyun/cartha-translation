  source_fidelity: Die Wiedergabe von ἐξουσία mit „Vollmacht“ und die neutrale Formulierung der Herausforderung entsprechen dem griechischen Text gut. Die zweimalige Singularisierung von ταῦτα („das“) glättet jedoch den ausdrücklichen Plural unnötig. Außerdem ist die Begründung, das Imperfekt sei „einsetzend“, aspektuell nicht zutreffend; die Vergangenheitsform „fragten“ ist im Deutschen zwar möglich, bildet das Imperfekt aber nicht eigens ab.
  naturalness: „Mit welcher Vollmacht tust du diese Dinge?“ ist modernes, natürliches und zugleich würdiges Standarddeutsch. Die Wiederholung von „diese Dinge“ ist angesichts der gezielten Wiederholung von ταῦτα im Ausgangstext angemessen.
  terminology: „Vollmacht“ trifft ἐξουσία im Kontext einer angefochtenen Befugnis sehr gut. Es legt weder die Quelle der Vollmacht noch eine konfessionelle Deutung fest.
