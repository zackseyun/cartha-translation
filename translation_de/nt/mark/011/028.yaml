  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: de
  text: 'Und sie fragten ihn: „Mit welcher Vollmacht tust du diese Dinge? Oder wer hat dir diese Vollmacht gegeben, diese Dinge zu tun?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sie fragten
  rationale: Das Imperfekt bezeichnet hier den einsetzenden bzw. andauernden Sprechakt. Im natürlichen deutschen Erzählstil gibt „sie fragten“ die als Fragen formulierte Rede treffend wieder, ohne eine Wiederholung zu behaupten.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: Mit welcher Vollmacht
  rationale: ἐν mit dem Dativ bezeichnet hier die Grundlage bzw. Befugnis des Handelns. „Mit welcher Vollmacht“ ist im Deutschen idiomatisch und wahrt den Gedanken einer erteilten oder beanspruchten Autorisierung.
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: Vollmacht
  rationale: ἐξουσία bezeichnet hier Befugnis, Recht und autorisierte Handlungsmacht. „Vollmacht“ passt zur Herausforderung von Jesu Legitimation im Tempel und lässt die Quelle dieser Befugnis offen.
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: tust du das / das zu tun
  rationale: Obwohl ταῦτα formal Plural ist, fasst das idiomatische deutsche „das“ die unmittelbar gemeinten Handlungen und das Lehren als Gesamtkomplex zusammen. „Diese Dinge“ wäre zwar formnäher, klänge hier jedoch unnatürlich.
- source_word: ἢ
  choice: Oder
  rationale: ἢ führt eine zweite, eng verwandte Frage ein, welche die erste durch die Frage nach dem Geber der Vollmacht näher bestimmt.
- source_word: τίς σοι ἔδωκεν
  choice: wer hat dir … gegeben
  rationale: Das deutsche Perfekt ist in direkter mündlicher Rede die natürliche Wiedergabe des Aorists ἔδωκεν und bezeichnet die vorausliegende Erteilung der Vollmacht.
- source_word: ἵνα ταῦτα ποιῇς
  choice: das zu tun
  rationale: Nach „Vollmacht gegeben“ gibt der Infinitiv den Zweck- bzw. Inhaltsbezug der ἵνα-Konstruktion knapp und idiomatisch wieder.
theological_decisions:
- issue: Ursprung von Jesu Vollmacht
  choice: Die Frage bleibt neutral als Herausforderung seiner Vollmacht formuliert.
  alternative: Den Wortlaut ausdrücklich auf göttliche Vollmacht beziehen.
  rationale: Der Vers selbst nennt die Quelle nicht, sondern gibt die Frage der Gegner wieder. Die Übersetzung darf die theologische Spannung nicht vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vollmacht“ ist im biblisch-religiösen Kontext verständlich und präziser als das mehrdeutige „Macht“; der Satzbau bleibt mündlich und direkt.
