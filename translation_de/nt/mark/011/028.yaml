  - severity: low
    issue: Die lexikalische Begründung zu ἔλεγον bezeichnet das Imperfekt als „einsetzend“.
    rationale: Das Imperfekt ist hier nicht als ingressive Form zu erklären. Die Übersetzung „fragten“ ist als idiomatische Wiedergabe der fragenden direkten Rede vertretbar, sollte aber nicht mit einem angeblich einsetzenden Aspekt begründet werden.
