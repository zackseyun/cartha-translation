review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von ἀφῆκαν αὐτούς als „ließen sie gehen“ ist kontextgerecht. „was Jesus ihnen aufgetragen hatte“ ist jedoch enger und stärker als καθὼς εἶπεν ὁ Ἰησοῦς: Der griechische Text sagt schlicht, dass die Jünger so sprachen, wie Jesus gesagt hatte, nicht ausdrücklich, dass er ihnen etwas aufgetragen hatte.'
  naturalness: Der Entwurf ist insgesamt gut verständlich. Die doppelte Pronomenfolge „ließen sie sie gewähren“ ist jedoch stilistisch schwerfällig und lässt die wechselnden Bezugsgruppen weniger klar erkennen. Die ausdrückliche Nennung der Umstehenden macht den Satz natürlich und klar.
  terminology: „aufgetragen“ sollte durch „gesagt“ ersetzt werden, um die schlichte Ausdrucksweise von εἶπεν zu bewahren. Die Fußnote kann die kontextuelle Bedeutung von ἀφίημι sachlich erläutern, ohne die Übersetzung übermäßig festzulegen.
  issues:
  - severity: medium
    issue: „was Jesus ihnen aufgetragen hatte“ verstärkt εἶπεν.
    rationale: εἶπεν bedeutet „sagte“. Zwar enthält der unmittelbare Kontext eine Anweisung Jesu, doch Vers 6 bezeichnet die Rede der Jünger nur als entsprechend dem, was Jesus gesagt hatte.
  - severity: low
    issue: Die Referenten in „da ließen sie sie gewähren“ sind unnötig schwer erkennbar.
    rationale: Das erste „sie“ bezeichnet die Umstehenden, das zweite die Jünger. Eine explizite Subjektbezeichnung verbessert die Lesbarkeit und ändert den Sinn nicht.
