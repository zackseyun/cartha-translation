revisions:
- from: Sie sagten ihnen, was Jesus ihnen aufgetragen hatte, und da ließen sie sie gewähren.[a]
  to: Sie sagten ihnen, wie Jesus es gesagt hatte, und die Umstehenden ließen sie gehen.[a]
  rationale: Die Revision gibt καθώς εἶπεν mit „wie Jesus es gesagt hatte“ wieder und vermeidet damit die nicht ausdrücklich im Wortlaut enthaltene Verstärkung „aufgetragen“. „Die Umstehenden“ klärt beim zweiten Satzteil die aus dem Kontext erschlossene Personengruppe; „ließen sie gehen“ bewahrt die lexikalische Offenheit von ἀφίημι, die die Fußnote erläutert.
