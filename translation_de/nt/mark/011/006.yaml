  text: οἱ δὲ εἶπαν αὐτοῖς καθὼς ⸀εἶπεν ὁ Ἰησοῦς· καὶ ἀφῆκαν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/006.yaml
  text: And they said to them just as Jesus had said[a], and they let them go.
translation:
  language: de
  text: Sie sagten ihnen, wie Jesus es gesagt hatte, und die Umstehenden ließen sie gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Umstehenden erlaubten es ihnen“ oder „gaben sie frei“. Das griechische Verb kann unter anderem „gehen lassen“, „freigeben“ oder „erlauben“ bedeuten. Im Zusammenhang hören die Umstehenden auf, die Jünger am Mitnehmen des Fohlens zu hindern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie
  rationale: Der substantivierte Artikel verweist im Kontext auf die Jünger; δέ dient hier dem Erzählfortgang und braucht im natürlichen Deutschen nicht eigens wiedergegeben zu werden.
- source_word: εἶπαν αὐτοῖς
  choice: sagten ihnen
  rationale: Die schlichte Wiedergabe entspricht dem gewöhnlichen Gebrauch von λέγω mit dem Dativ.
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: was Jesus ihnen aufgetragen hatte
  rationale: καθώς bezeichnet die Übereinstimmung mit Jesu vorheriger Anweisung. Im Deutschen gibt das Plusquamperfekt die zeitliche Vorordnung wieder; „aufgetragen“ nimmt den Kontext von Vers 3 auf, ohne den Inhalt auszuschmücken.
- source_word: ἀφῆκαν αὐτούς
  choice: da ließen sie sie gewähren
  rationale: ἀφίημι bedeutet hier, dass die Umstehenden die Jünger nicht länger am Mitnehmen des Fohlens hinderten. „Sie gewähren lassen“ ist in diesem Zusammenhang natürlich und vermeidet das missverständliche „sie gehen lassen“.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das doppelte Pronomen in „ließen sie sie gewähren“ ist grammatisch eindeutig, wird durch die Fußnote aber sachlich erläutert.
