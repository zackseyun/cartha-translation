  source_fidelity: Die Ergänzung „Warum“ macht aus der griechischen Frage nach dem Tun eine ausdrückliche Frage nach dem Grund und geht damit über den Wortlaut hinaus. Auch „da“ ist nicht als Bestimmung der Handlung ausgedrückt; ἐκεῖ bezieht sich auf die dort Stehenden. Die partizipiale Handlung λύοντες sollte ohne diese Zusätze wiedergegeben werden.
