  text: καί τινες τῶν ἐκεῖ ἑστηκότων ἔλεγον αὐτοῖς· Τί ποιεῖτε λύοντες τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/005.yaml
  text: And some of those standing there were saying to them[a], “What are you doing, untying the colt?”
translation:
  language: de
  text: 'Und einige von denen, die dort standen, sagten zu ihnen: „Was tut ihr, indem ihr das Jungtier[a] losbindet?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den jungen Esel“. Das griechische Wort πῶλος kann ein junges Tier bezeichnen; in diesem Zusammenhang kann ein junger Esel gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: einige
  rationale: Gibt die unbestimmte Teilmenge der anwesenden Personen natürlich und genau wieder.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: von denen, die dort standen
  rationale: Bewahrt die substantivische Partizipialkonstruktion und die Ortsangabe, ohne sie zum stärker deutenden Wort „Umstehende“ zu verdichten.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das deutsche Präteritum ist in erzählender Prosa natürlich. Eine Verlaufsform wie „waren am Sagen“ wäre unidiomatisch; „sagten immer wieder“ würde eine Wiederholung überbetonen.
- source_word: Τί ποιεῖτε λύοντες
  choice: Was tut ihr da? Warum bindet ihr … los?
  rationale: Im Deutschen wird die idiomatische Frage beim Beanstanden einer gerade ausgeführten Handlung oft zweigliedrig formuliert. „Was tut ihr, indem ihr …“ wäre formal näher, aber steif; das ergänzte „Warum“ macht die pragmatische Stoßrichtung deutlich, geht jedoch leicht über die explizite Form hinaus.
- source_word: τὸν πῶλον
  choice: das Fohlen
  rationale: πῶλος bezeichnet allgemein ein Jungtier. „Fohlen“ bewahrt diese lexikalische Offenheit besser als „junger Esel“, während der Kontext ein Eselsfohlen erkennen lässt.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Erzählsprache. Die direkte Rede ist idiomatisch zugespitzt; „Fohlen“ hält die allgemeinere Bedeutung des griechischen πῶλος im Haupttext offen.
