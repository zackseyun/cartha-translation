  terminology: πῶλος bezeichnet ein junges Tier, besonders aus dem Bereich Pferd/Esel. Im Markustext selbst wird die Tierart nicht ausdrücklich genannt. „Jungtier“ erhält diese Offenheit; die Fußnote kann die kontextuell mögliche Deutung als jungen Esel nennen, ohne sie in den Haupttext zu verlagern.
