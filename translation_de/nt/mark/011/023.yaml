source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: de
  text: 'Amen, ich sage euch: Wer zu diesem Berg sagt: »Heb dich empor und wirf dich ins Meer!«, und in seinem Herzen nicht zweifelt[a], sondern glaubt, dass geschieht, was er sagt[b], für den wird es geschehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht schwankt« oder »innerlich nicht gespalten ist«; das griechische Verb kann neben Zweifel auch inneres Schwanken oder Geteiltsein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »dass das, was er sagt, gerade geschieht« beziehungsweise »eintrifft«. Im Griechischen steht hier Präsens, bevor der folgende Satz das Ergebnis in der Zukunft ausdrückt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das im Deutschen geläufige »Amen« bewahrt die feierliche Bekräftigungsformel Jesu und klingt in dieser Einleitung natürlich und würdig.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die Wendung bildet die direkte und feierliche Anrede knapp und idiomatisch ab.
- source_word: ὃς ἂν εἴπῃ
  choice: Wer ... sagt
  rationale: Die Konstruktion mit ἄν und Konjunktiv bezeichnet einen unbestimmten allgemeinen Fall; »Wer ... sagt« gibt dies natürlich wieder.
- source_word: τῷ ὄρει τούτῳ
  choice: zu diesem Berg
  rationale: »Berg« ist die gewöhnliche Bedeutung von ὄρος; das Demonstrativpronomen erhält die Anschaulichkeit.
- source_word: Ἄρθητι
  choice: Heb dich empor
  rationale: Die reflexive deutsche Befehlsform gibt den passiven griechischen Imperativ idiomatisch wieder und bewahrt das konkrete Bild des Anhebens beziehungsweise Forthebens.
- source_word: βλήθητι
  choice: wirf dich
  rationale: Die reflexive Befehlsform ist im Deutschen natürlicher als ein wörtliches Passiv und bewahrt das kräftige Bild des Werfens.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: Die Übersetzung entspricht der üblichen Bedeutung von θάλασσα und erhält das übersteigerte Bild.
- source_word: μὴ διακριθῇ
  choice: nicht zweifelt
  rationale: Im Zusammenhang bezeichnet das Verb inneres Zweifeln oder Schwanken; »zweifelt« ist die klarste moderne Wiedergabe.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: in seinem Herzen
  rationale: Die Formulierung bewahrt das biblische Bild des Herzens als inneres Zentrum des Denkens und Wollens sowie den grammatischen maskulinen Singular.
- source_word: πιστεύῃ
  choice: glaubt
  rationale: »Glaubt« ist hier die direkte und kontextgerechte Wiedergabe von πιστεύω.
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: dass geschieht, was er sagt
  rationale: Das Präsens γίνεται bleibt als Präsens erhalten, ohne im Deutschen den womöglich irreführenden progressiven Eindruck »gerade geschieht« zu erzwingen; die Wortstellung ist natürlich.
- source_word: ἔσται αὐτῷ
  choice: für den wird es geschehen
  rationale: Die Formulierung gibt den zukünftigen Ergebnissatz wieder und lässt dessen offenen Bezug bestehen, ohne den Wirkmechanismus näher festzulegen.
theological_decisions:
- issue: Charakter der Aussage Jesu über Glauben und wirksames Sprechen
  choice: Die bedingte Zusage wird unmittelbar und ungeschmälert wiedergegeben.
  alternative: Die Aussage ausschließlich als Hyperbel deuten oder als uneingeschränkte Blankovollmacht ausformulieren.
  rationale: Der Vers selbst verbindet das eindrückliche Bild mit zweifelsfreiem Glauben, nennt aber keine später entwickelten theologischen Einschränkungen oder Systeme. Die Übersetzung wahrt diese Spannung.
- issue: Generisches Maskulinum in αὐτοῦ und αὐτῷ
  choice: 'Maskuliner Singular: »seinem« und »für den«'
  alternative: Geschlechtsneutrale Plural- oder Paarform
  rationale: Die griechische Form steht im maskulinen Singular mit allgemein-repräsentativer Funktion; die Übersetzung erhält diese grammatische Gestalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Ausspruch. Die direkte Rede bleibt bildkräftig; das griechische Präsens in γίνεται sowie die Bedeutungsbreite von διακρίνω werden im Text beziehungsweise in den Fußnoten gewahrt.
