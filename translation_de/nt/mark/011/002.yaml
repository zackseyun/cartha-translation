source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Geht in das Dorf, das euch gegenüberliegt. Sobald ihr hineinkommt, werdet ihr dort ein angebundenes Fohlen[a] finden, auf dem noch kein Mensch gesessen hat[b]. Bindet es los und bringt es her!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann ein junges Tier bezeichnen, etwa ein Pferd oder einen Esel; hier ist das Tier gemeint, auf dem Jesus reiten wird.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf dem noch keiner der Menschen gesessen hat“. Die Formulierung hebt hervor, dass bis dahin kein Mensch auf dem Tier gesessen hat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Geht
  rationale: Der Bewegungsimperativ wird im modernen Deutschen schlicht und unmittelbar wiedergegeben.
- source_word: κώμην τὴν κατέναντι ὑμῶν
  choice: das Dorf, das euch gegenüberliegt
  rationale: κώμη bezeichnet ein Dorf; die Relativkonstruktion gibt κατέναντι natürlich wieder, ohne eine bestimmte räumliche Anordnung hinzuzufügen.
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτήν
  choice: Sobald ihr hineinkommt
  rationale: Die temporale Verknüpfung wird idiomatisch ausgedrückt und bewahrt den unmittelbaren zeitlichen Zusammenhang.
- source_word: πῶλον
  choice: Fohlen
  rationale: πῶλος bezeichnet ein junges Reit- oder Lasttier. „Fohlen“ ist knapp und lässt die im griechischen Wort selbst nicht ausdrücklich genannte Tierart offen.
- source_word: δεδεμένον
  choice: angebundenes
  rationale: Das Perfektpartizip beschreibt den fortbestehenden Zustand des festgebundenen Tieres; „angebunden“ passt im Deutschen besonders zu einem Tier.
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: auf dem noch nie ein Mensch gesessen hat
  rationale: „Ein Mensch“ gibt das ausdrückliche ἀνθρώπων natürlich wieder; „noch nie“ bezeichnet den bis zu diesem Zeitpunkt nicht eingetretenen Vorgang.
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: Bindet es los und bringt es her
  rationale: „Losbinden“ entspricht der konkreten Handlung an einem angebundenen Tier; „herbringen“ bewahrt die Richtung auf den Sprecher zu, die im deutschen Kontext natürlich mitgedacht und ausgedrückt wird.
theological_decisions:
- issue: Tierart des πῶλος
  choice: Die Tierart wird im Haupttext mit „Fohlen“ nicht ausdrücklich als Esel festgelegt.
  alternative: „junger Esel“ oder „Eselsfohlen“
  rationale: Das Substantiv πῶλος bezeichnet für sich genommen ein Jungtier und spezifiziert die Tierart nicht eindeutig. Die weitere Erzählung und ihre intertextuellen Bezüge können auf einen Esel weisen, doch diese Deutung soll nicht unmarkiert in das einzelne Wort eingetragen werden.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Das historische Präsens λέγει wird im Deutschen als erzählendes Präteritum wiedergegeben. Kurze Hauptsätze erhalten die Unmittelbarkeit der Anweisung; „Fohlen“ bewahrt die lexikalische Offenheit des griechischen Ausdrucks.
