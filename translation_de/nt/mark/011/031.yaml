id: MRK.11.31
reference: Mark 11:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: de
  text: 'Und sie berieten miteinander und sagten: »Was sollen wir sagen? Wenn wir sagen: ›Vom Himmel[a]‹, wird er sagen: ›Warum habt ihr ihm dann nicht geglaubt?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vom Himmel“ ist eine ehrfürchtige jüdische Ausdrucksweise für „von Gott“ oder „göttlichen Ursprungs“.
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο
  choice: berieten
  rationale: Das Imperfekt bezeichnet eine andauernde gemeinsame Überlegung. „Sie berieten miteinander“ gibt sowohl den gedanklichen als auch den wechselseitigen Aspekt natürlich wieder.
- source_word: πρὸς ἑαυτοὺς
  choice: miteinander
  rationale: Die Wendung bezeichnet hier die Beratung innerhalb der Gruppe, nicht bloß das stille Nachdenken jedes Einzelnen.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip leitet den Wortlaut ihrer Beratung ein; im Deutschen ist die koordinierte Form flüssig und inhaltlich genau.
- source_word: Τί εἴπωμεν;
  choice: Was sollen wir sagen?
  rationale: Der deliberative Aorist Konjunktiv fragt nach der Antwort, die sie geben sollen. Diese Formulierung ist gegenwärtig und bewahrt die offene Beratungssituation.
- source_word: ἐὰν εἴπωμεν
  choice: Wenn wir sagen
  rationale: Die schlichte Konditionalform entspricht dem griechischen Bedingungssatz und klingt im Deutschen natürlich.
- source_word: Ἐξ οὐρανοῦ
  choice: Vom Himmel
  rationale: Die wörtliche Wendung bewahrt die jüdische ehrfürchtige Redeweise für göttlichen Ursprung oder göttliche Bevollmächtigung, ohne sie im Haupttext auszudeuten.
- source_word: ἐρεῖ
  choice: wird er sagen
  rationale: Das Futur von λέγω führt die erwartete Reaktion Jesu direkt ein; der folgende Fragesatz trägt selbst die interrogative Bedeutung.
- source_word: Διὰ τί οὖν
  choice: Warum ... dann
  rationale: „Dann“ gibt den folgernden Sinn von οὖν in natürlicher deutscher Wortstellung wieder.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: habt ihr ihm nicht geglaubt
  rationale: πιστεύω mit Dativ bedeutet hier, jemandem beziehungsweise seinem Zeugnis Glauben zu schenken. „Ihm geglaubt“ vermeidet die stärkere und anders konstruierte Aussage „an ihn geglaubt“.
theological_decisions:
- issue: Bedeutung von „vom Himmel“ im Blick auf die Taufe beziehungsweise Vollmacht des Johannes
  choice: Die Wendung „Vom Himmel“ bleibt im Haupttext erhalten.
  alternative: „Von Gott“
  rationale: Die Formulierung bezeichnet in ehrfürchtiger jüdischer Redeweise den göttlichen Ursprung oder die göttliche Bevollmächtigung. Die wörtliche Wiedergabe erhält die Ausdrucksweise und rhetorische Spannung des Ausgangstextes; die Fußnote erläutert das Gemeinte.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist klar gegliedert; „berieten miteinander“ vermeidet sowohl einen unnötig psychologisierenden als auch einen zu umgangssprachlichen Ausdruck.
