id: MRK.11.32
reference: Mark 11:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: de
  text: 'Doch wenn wir sagen[a]: »Von Menschen«? — Sie fürchteten die Menge, denn alle waren überzeugt, dass Johannes wirklich ein Prophet war.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Doch sollen wir sagen: ›Von Menschen‹?«'
    reason: Die Form kann im Beratungsgang auch als unmittelbare abwägende Frage wiedergegeben werden.
  - marker: b
    text: 'Auch möglich: »Denn alle hielten Johannes tatsächlich für einen Propheten.«'
    reason: Die griechische Wortfolge lässt eine prädikative Wiedergabe mit »für einen Propheten halten« zu.
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: Doch wenn wir sagen
  rationale: Gibt den adversativen Übergang und den in diesem abgebrochenen Beratungsgang impliziten Bedingungssinn des Aorist-Konjunktivs knapp und natürlich wieder.
- source_word: Ἐξ ἀνθρώπων
  choice: Von Menschen
  rationale: Bewahrt die wörtliche Herkunftsangabe und den Gegensatz zwischen menschlichem und göttlichem Ursprung, ohne ihn ausdeutend aufzulösen.
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: Sie fürchteten die Menge
  rationale: Das Imperfekt bezeichnet ihre anhaltende beziehungsweise situationsbedingte Furcht; »die Menge« entspricht dem markinischen Gebrauch von ὄχλος.
- source_word: ἅπαντες γὰρ εἶχον
  choice: denn alle waren überzeugt
  rationale: ἔχω bezeichnet hier eine feste Einschätzung. »Waren überzeugt« ist im modernen Deutsch natürlicher als eine formnahe Wiedergabe mit »hielten« und erhält die Stärke der allgemeinen Auffassung.
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: dass Johannes wirklich ein Prophet war
  rationale: Gibt ὄντως ausdrücklich mit »wirklich« wieder und belässt die Aussage innerhalb der Überzeugung der Menge.
theological_decisions:
- issue: Ursprung der Taufe beziehungsweise Vollmacht des Johannes in Ἐξ ἀνθρώπων
  choice: Von Menschen
  alternative: Menschlichen Ursprungs
  rationale: Die Hauptfassung erhält das konkrete Herkunftsbild des Griechischen und den unausgesprochenen Gegensatz »vom Himmel / von Menschen«; die Alternative wäre deutlicher, aber stärker interpretierend.
- issue: Status des Johannes in ὄντως ὅτι προφήτης ἦν
  choice: alle waren überzeugt, dass Johannes wirklich ein Prophet war
  alternative: alle hielten Johannes tatsächlich für einen Propheten
  rationale: Die Formulierung wahrt sowohl die emphatische Kraft von ὄντως als auch die Perspektive der Menge, statt die Aussage unmarkiert als neuen Erzählerkommentar erscheinen zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzabbruch und die innere Beratung werden durch Fragezeichen und Gedankenstrich sichtbar gehalten; die doppelte Zeichensetzung der englischen Vorlage wird nicht mechanisch nachgebildet.
