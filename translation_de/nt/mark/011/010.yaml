base_translation:
  language: en
  yaml_path: translation/nt/mark/011/010.yaml
  text: Blessed is the coming kingdom of our father David! Hosanna in the highest![a]
translation:
  language: de
  text: Gesegnet sei das kommende Reich unseres Vaters David! Hosanna in den höchsten Höhen![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Hosanna“ kann auf die Bitte „Rette doch!“ oder „Rette jetzt!“ zurückgehen; hier fungiert das Wort jedoch als liturgischer Jubelruf.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογημένη
  choice: Gesegnet sei
  rationale: Das prädikative Adjektiv eröffnet einen Zuruf. Die deutsche Wunschformel gibt den akklamatorischen Sinn natürlich und würdig wieder.
- source_word: ἡ ἐρχομένη βασιλεία
  choice: das kommende Reich
  rationale: Die attributive Wiedergabe bewahrt die Kraft des Präsenspartizips und bleibt natürlicher als eine stärker festgelegte Formulierung wie „das künftige Reich“.
- source_word: βασιλεία
  choice: Reich
  rationale: Im davidischen Zusammenhang bezeichnet das Wort königliche Herrschaft, die zugleich als anbrechende Herrschaftsordnung vorgestellt wird. „Reich“ bewahrt diese konkrete dynastische Färbung besser als „Herrschaft“ allein.
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: unseres Vaters David
  rationale: Die Genitivgruppe wird direkt auf „Reich“ bezogen. „Unser Vater David“ bewahrt die ehrende Bezeichnung des Ahnherrn ohne zusätzliche Auslegung.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: Im neutestamentlichen Zusammenhang ist dies ein etablierter liturgischer Ruf. Die Transliteration erhält seine erkennbare Form; die zugrunde liegende Bitte um Rettung wird in der Fußnote erläutert.
- source_word: ἐν τοῖς ὑψίστοις
  choice: in den höchsten Höhen
  rationale: Die substantivierte Pluralform weist auf die höchsten himmlischen Bereiche. „In den höchsten Höhen“ ist im Deutschen verständlicher und näher am griechischen Plural als das missverständliche „in der Höhe“.
theological_decisions:
- issue: Art des davidischen Reichsrufs
  choice: Das kommende Reich wird unmittelbar mit David verbunden, ohne es im Haupttext ausdrücklich „messianisch“ zu nennen.
  alternative: Gesegnet sei das kommende messianische Reich unseres Vaters David!
  rationale: Der Zusammenhang trägt eine messianische Erwartung, doch der griechische Wortlaut nennt lediglich „das kommende Reich unseres Vaters David“. Die direkte Wiedergabe wahrt die Anspielung und vermeidet eine auslegende Ergänzung.
- issue: Funktion von Ὡσαννά
  choice: „Hosanna“ bleibt als liturgischer Ruf im Haupttext stehen.
  alternative: „Rette doch!“ oder „Rette jetzt!“
  rationale: Der Ruf geht sprachgeschichtlich auf eine Rettungsbitte zurück, fungiert hier jedoch wahrscheinlich zugleich als feststehender Jubel- und Lobpreisruf. Haupttext und Fußnote bewahren beide Dimensionen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit liturgischem Klang. Die Satzstellung ist bewusst knapp und ausrufartig; traditionelle Fachprägungen werden beibehalten, wo sie im Deutschen allgemein verständlich sind.
