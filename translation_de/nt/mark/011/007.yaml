  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀φέρουσιν τὸν πῶλον πρὸς τὸν Ἰησοῦν, καὶ ⸀ἐπιβάλλουσιν αὐτῷ τὰ ἱμάτια αὐτῶν, καὶ ἐκάθισεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: de
  text: Sie brachten das Fohlen zu Jesus, legten ihre Gewänder darauf, und er setzte sich darauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: Fohlen
  rationale: Das griechische Wort bezeichnet ein Jungtier; der nähere Kontext (Markus 11,2) macht deutlich, dass ein junges Reittier gemeint ist. „Fohlen“ ist natürlich und wahrt die Tierart-Unbestimmtheit des einzelnen Wortes.
- source_word: ἐπιβάλλουσιν
  choice: legten … darauf
  rationale: Im Zusammenhang mit Gewändern, die als provisorische Satteldecke auf das Tier gelegt werden, gibt „legten“ die Handlung idiomatisch und präzise wieder; „warfen“ wäre im Deutschen unnötig missverständlich.
- source_word: ἱμάτια
  choice: Gewänder
  rationale: Bezeichnet äußere Kleidungsstücke beziehungsweise Umhänge; „Gewänder“ ist würdig, verständlich und weniger eng als „Mäntel“.
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Die aoristische Verbform beschreibt hier das Sichsetzen Jesu auf das Tier; die reflexive deutsche Wendung ist natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Satzfolge des Griechischen bleibt in knapper Form erhalten; das wiederholte „darauf“ bildet die beiden Bezüge auf das Fohlen transparent ab.
