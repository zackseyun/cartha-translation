  variant: modern standard German
source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/017.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: de
  text: Doch wehe den Schwangeren und den stillenden Frauen in jenen Tagen!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: wehe
  rationale: Bewahrt die prophetische Ausrufekraft zwischen Klage und Warnung und entspricht dem ernsten Zusammenhang.
- source_word: δὲ
  choice: Doch
  rationale: Kennzeichnet den leichten Übergang von der vorausgehenden Fluchtanweisung und wirkt im Deutschen natürlich, ohne einen zu starken Gegensatz zu erzeugen.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: den Schwangeren
  rationale: Gibt die griechische Wendung »im Mutterleib haben« idiomatisch, knapp und in modernem Deutsch wieder.
- source_word: θηλαζούσαις
  choice: den Frauen, die … stillen
  rationale: Gibt die Tätigkeit des Stillens natürlich wieder. Dass Säuglinge gestillt werden, ist im Deutschen bereits hinreichend deutlich und muss nicht ergänzt werden.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Bewahrt den zeitlichen und kontextuellen Rückverweis der griechischen Wendung.
theological_decisions:
- issue: Funktion von οὐαί
  choice: »wehe« als zugleich klagender und warnender Ausruf
  alternative: reiner Fluch- oder Verdammungsspruch
  rationale: Der Kontext beschreibt die besondere Notlage dieser Frauen; der griechische Ausruf lässt Klage und Warnung zu und sollte nicht einseitig als Verurteilung verstanden werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Ausrufform erhält die Dringlichkeit des griechischen Satzes; »Schwangeren« und »stillen« sind geläufig und nicht unnötig medizinisch.
