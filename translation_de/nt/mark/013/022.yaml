id: MRK.13.22
reference: Mark 13:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: de
  text: Denn es werden falsche Messiasse und falsche Propheten auftreten und Zeichen und Wunder vollbringen, um, wenn möglich,[a] die Erwählten in die Irre zu führen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn es möglich wäre“. Der griechische Wortlaut lässt offen, ob die Erwählten tatsächlich in die Irre geführt werden können.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: werden auftreten
  rationale: Das futurische Passiv von ἐγείρω bezeichnet hier idiomatisch das Auftreten solcher Personen. „Auftreten“ ist im modernen Deutsch natürlich und vermeidet die mögliche Vorstellung, sie würden von Gott „erweckt“.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die vorausgehende Warnung; „denn“ gibt diesen erklärenden Anschluss knapp und idiomatisch wieder.
- source_word: ψευδόχριστοι
  choice: falsche Messiasse
  rationale: Das Kompositum bezeichnet Personen, die zu Unrecht als Messias auftreten. „Falsche Messiasse“ erschließt den Titel Χριστός im jüdisch-messianischen Kontext unmittelbar.
- source_word: ψευδοπροφῆται
  choice: falsche Propheten
  rationale: Dies ist die klare und etablierte Wiedergabe des griechischen Kompositums.
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: Zeichen und Wunder vollbringen
  rationale: Wörtlich steht „Zeichen und Wunder geben“. Im Deutschen ist „vollbringen“ bei dieser festen Wortverbindung natürlicher, ohne die außergewöhnlichen Phänomene näher auszudeuten.
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: um … in die Irre zu führen
  rationale: Die Konstruktion drückt eine Absicht aus. „In die Irre führen“ bewahrt gegenüber dem allgemeineren „täuschen“ das Bild des Abbringens vom richtigen Weg.
- source_word: εἰ δυνατόν
  choice: wenn möglich
  rationale: Die knappe Bedingungsformel wird ebenso knapp wiedergegeben und lässt offen, ob die beabsichtigte Irreführung der Erwählten tatsächlich möglich ist.
- source_word: τοὺς ἐκλεκτούς
  choice: die Erwählten
  rationale: „Die Erwählten“ ist eine natürliche, theologisch gewichtige und zugleich nicht konfessionell festgelegte Wiedergabe von ἐκλεκτοί.
theological_decisions:
- issue: Wiedergabe von ψευδόχριστοι und des darin enthaltenen Titels Χριστός
  choice: falsche Messiasse
  alternative: falsche Christusse
  rationale: Hier ist Χριστός eindeutig als Titel gemeint. „Messiasse“ macht den Anspruch der betreffenden Personen verständlich und bewahrt den jüdischen Erwartungshorizont.
- issue: Aussage von εἰ δυνατόν über die mögliche Irreführung der Erwählten
  choice: wenn möglich
  alternative: wenn es möglich wäre
  rationale: Der griechische Wortlaut formuliert eine Bedingung, entscheidet aber nicht ausdrücklich, ob sie erfüllt werden kann. Die Übersetzung darf daraus weder eine sichere Möglichkeit noch eine grundsätzliche Unmöglichkeit machen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Auftreten“ und „vollbringen“ vermeiden eine unnatürlich wörtliche Ausdrucksweise; die Stellung von „wenn möglich“ folgt der griechischen Sinnstruktur und bewahrt die theologische Offenheit.
