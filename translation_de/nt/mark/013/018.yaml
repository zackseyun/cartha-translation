  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: de
  text: Betet aber, dass es nicht im Winter geschieht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, im Blick auf den Zusammenhang ausdrücklich: „dass eure Flucht nicht im Winter geschieht“. Im griechischen Text des Markus bleibt der Bezug unausgesprochen; Matthäus 24,20 formuliert ihn ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: Betet
  rationale: Präsens Imperativ, zweite Person Plural. Der einfache Imperativ ist im Deutschen natürlich und gibt den Plural ausdrücklich wieder; „Betet weiterhin“ würde den Aspekt unnötig festlegen.
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten Anschluss mit möglicher adversativer Nuance. „Aber“ passt zur Warnung im vorausgehenden Zusammenhang.
- source_word: ἵνα μὴ
  choice: dass ... nicht
  rationale: Leitet den verneinten Inhalt des Gebets ein. Nach „beten“ ist „dass ... nicht“ eine natürliche moderne deutsche Entsprechung.
- source_word: γένηται
  choice: es ... geschieht
  rationale: Aorist Konjunktiv Medium von γίνομαι. Die unpersönliche Formulierung bewahrt die Ellipse des griechischen Textes, ohne „eure Flucht“ aus der Parallelstelle einzutragen.
- source_word: χειμῶνος
  choice: im Winter
  rationale: Adverbial gebrauchter Genitiv der Zeit beziehungsweise Jahreszeit; „im Winter“ ist die knappe, idiomatische deutsche Wiedergabe.
theological_decisions:
- issue: Unausgesprochener Bezug von γένηται
  choice: Die erwartete Flucht beziehungsweise das zuvor beschriebene Krisengeschehen wird unpersönlich mit „es ... geschieht“ wiedergegeben.
  alternative: „dass eure Flucht nicht im Winter geschieht“
  rationale: Markus nennt „eure Flucht“ im griechischen Text nicht ausdrücklich, anders als Matthäus 24,20. Die Übersetzung bewahrt deshalb die knappe Mehrdeutigkeit und erläutert den wahrscheinlichen Kontextbezug nur in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Ellipse des Ausgangstextes bleibt im Haupttext erhalten; die kontextuell naheliegende Ergänzung steht in der Fußnote.
