source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ ἐκ τοῦ ἱεροῦ λέγει αὐτῷ εἷς τῶν μαθητῶν αὐτοῦ· Διδάσκαλε, ἴδε ποταποὶ λίθοι καὶ ποταπαὶ οἰκοδομαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: de
  text: 'Als er den Tempelbezirk[a] verließ, sagt einer seiner Jünger zu ihm: »Lehrer, sieh, was für eindrucksvolle Steine und was für eindrucksvolle Bauten!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet die gesamte Tempelanlage beziehungsweise den Tempelbezirk, nicht nur das innere Heiligtum.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Was für großartige Steine und was für großartige Bauten!« Das griechische Adjektiv drückt Staunen oder Bewunderung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: Als Jesus … hinausging
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitig ablaufende Handlung. Der Name Jesus macht den im Deutschen sonst schwerfälligen Pronomenbezug natürlich und eindeutig.
- source_word: τοῦ ἱεροῦ
  choice: aus dem Tempelbezirk
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage beziehungsweise den Tempelbezirk, nicht speziell das innere Heiligtum (ναός).
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens bewahrt den lebendigen Erzählstil des Markus.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: einer seiner Jünger
  rationale: Natürliche und genaue Wiedergabe des partitiven Ausdrucks.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: Gibt die Anrede direkt und in modernem Deutsch verständlich wieder.
- source_word: ἴδε
  choice: sieh nur
  rationale: Der Imperativ lenkt nachdrücklich die Aufmerksamkeit auf das Folgende; „nur“ vermittelt im Deutschen den staunenden Ton, ohne zusätzliche Sachinformation einzuführen.
- source_word: ποταποὶ λίθοι
  choice: was für gewaltige Steine
  rationale: ποταπός ist hier ausrufend und drückt Staunen über Art beziehungsweise Ausmaß aus. „Gewaltige“ passt besonders zu den Steinen, ohne die mögliche Bedeutung auf bloße Größe festzulegen.
- source_word: ποταπαὶ οἰκοδομαί
  choice: was für beeindruckende Bauten
  rationale: Die wiederholte exklamative Konstruktion wird beibehalten. „Beeindruckende“ gibt die Bewunderung idiomatisch wieder; „Bauten“ passt zur Mehrzahl der Gebäude der Tempelanlage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens von λέγει bleibt erhalten. Die exklamative Wiederholung des griechischen Satzes wird im Deutschen nachgebildet; die beiden kontextgerechten Adjektive vermitteln das Staunen natürlich.
