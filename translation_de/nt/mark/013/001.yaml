    issue: Explizite Nennung von „Jesus“ statt des griechischen Pronomens
    rationale: Der griechische Text sagt lediglich „als er ...“. Auch wenn der Bezug im Kontext eindeutig ist, sollte die Ergänzung eines Namens ohne Not vermieden werden.
  - severity: medium
    issue: Uneinheitliche und semantisch verengende Wiedergabe von ποταποὶ / ποταπαὶ
    rationale: Dasselbe Adjektiv wird mit „gewaltige“ beziehungsweise „beeindruckende“ verschieden wiedergegeben. „Gewaltige“ legt besonders körperliche Größe nahe; die Quelle drückt offen staunende Hervorhebung aus. Eine einheitliche, weniger einengende Formulierung ist vorzuziehen.
