  rationale: Die Revision belässt den Bezug wie im griechischen Text pronominal, glättet die deutsche Bewegungsformulierung und gibt die zweimal verwendete exklamative Beschreibung einheitlich wieder. Die Fußnotenanker und ihre lexikalische Funktion bleiben erhalten.
