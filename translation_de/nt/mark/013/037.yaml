  text: ⸀ὃ δὲ ὑμῖν λέγω πᾶσιν λέγω· γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: de
  text: 'Und was ich euch sage, das sage ich allen: Bleibt wach[a]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wacht!“ oder „Seid wachsam!“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: was ... das
  rationale: Das substantivisch gebrauchte Relativpronomen wird im Deutschen natürlich durch die Korrelativkonstruktion „was ... das“ wiedergegeben; sie bewahrt zugleich den resumptiven Nachdruck.
- source_word: δὲ
  choice: und
  rationale: δέ verbindet hier eher weiterführend als gegensätzlich; „und“ schließt den Satz natürlich an den vorherigen Zusammenhang an.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ der zweiten Person Plural bezeichnet zunächst die unmittelbar Angesprochenen; „euch“ bildet den Plural im Deutschen ausdrücklich ab.
- source_word: λέγω ... λέγω
  choice: sage ... sage
  rationale: Die Wiederholung wird beibehalten, weil sie die rhetorische Struktur und den Nachdruck des griechischen Textes trägt.
- source_word: πᾶσιν
  choice: allen
  rationale: „Allen“ bewahrt die knappe, umfassende Aussage, ohne ein im Griechischen nicht ausdrücklich genanntes Bezugswort hinzuzufügen.
- source_word: γρηγορεῖτε
  choice: Bleibt wach
  rationale: Der Imperativ Präsens Plural fordert fortdauernde Wachsamkeit. „Bleibt wach“ erhält das anschauliche Wach-Motiv; „Wacht“ und „Seid wachsam“ sind ebenfalls mögliche Wiedergaben.
theological_decisions:
- issue: Reichweite der Aufforderung Jesu
  choice: Was Jesus den unmittelbar Angesprochenen sagt, richtet er ausdrücklich an alle.
  alternative: Die Aufforderung könnte im Erzählzusammenhang ausschließlich auf die unmittelbar anwesenden Jünger bezogen werden.
  rationale: Der Gegensatz zwischen ὑμῖν („euch“) und πᾶσιν („allen“) erweitert den Adressatenkreis ausdrücklich. Die Übersetzung bewahrt diese universalisierende Aussage, ohne näher festzulegen, wer mit „allen“ gemeint ist.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Wiederholung „sage ... sage“ bleibt bewusst erhalten; der Doppelpunkt gibt die zugespitzte Schlussaufforderung wieder.
