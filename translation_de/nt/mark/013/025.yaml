  source_fidelity: 'Der Entwurf gibt die Satzglieder und Zeitformen des griechischen Textes zutreffend wieder: Die Sterne fallen „vom Himmel“, und die in den Himmeln befindlichen Mächte werden künftig passiv erschüttert. Die deutsche Zukunftsform „werden ... fallen“ ist eine idiomatische Wiedergabe der griechischen periphrastischen Zukunft, ohne eine nicht sicher ausdrückbare Verlaufsnuance zu überladen.'
  naturalness: Modernes, würdiges Standarddeutsch. Die doppelte werden-Konstruktion in „werden erschüttert werden“ ist zwar stilistisch markiert, aber grammatisch korrekt, verständlich und als direkte Wiedergabe des futurischen Passivs in diesem feierlich-apokalyptischen Register vertretbar.
  terminology: „Sterne“, „Himmel“, „Mächte“ und „erschüttert“ sind sachgerecht. Insbesondere wahrt „Mächte in den Himmeln“ die im Griechischen vorhandene Offenheit hinsichtlich himmlischer Wesen, kosmischer Kräfte oder der Himmelsordnung. „Himmeln“ bildet den griechischen Plural angemessen ab.
