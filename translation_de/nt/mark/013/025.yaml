id: MRK.13.25
reference: Mark 13:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: de
  text: Und die Sterne werden vom Himmel fallen, und die Mächte in den Himmeln werden erschüttert werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Mächte in den Himmeln“ kann himmlische Mächte, kosmische Kräfte oder die Ordnungen der Himmel bezeichnen; der griechische Ausdruck legt dies nicht genauer fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: Sterne
  rationale: Die gewöhnliche astronomisch-kosmische Bedeutung passt zum apokalyptischen Zusammenhang.
- source_word: ἔσονται ... πίπτοντες
  choice: werden ... fallen
  rationale: Die periphrastische Futurform bezeichnet zukünftiges, anschaulich vorgestelltes Geschehen. Im Deutschen ist „werden fallen“ natürlicher als eine Verlaufsumschreibung und bewahrt den Zukunftsbezug.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: „Himmel“ wahrt den erhabenen kosmischen Sprachklang; das deutsche Wort kann hier wie das griechische οὐρανός sowohl den sichtbaren Himmel als auch den himmlischen Bereich bezeichnen.
- source_word: δυνάμεις
  choice: Mächte
  rationale: „Mächte“ lässt offen, ob kosmische Kräfte, himmlische Wesen oder Ordnungen des Himmels gemeint sind.
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Der Plural des griechischen Textes wird beibehalten und der kosmische Umfang der Aussage sichtbar gemacht.
- source_word: σαλευθήσονται
  choice: werden erschüttert werden
  rationale: Die passive Futurform wird direkt wiedergegeben; „erschüttert“ entspricht dem starken Bewegungsvorgang von σαλεύω.
theological_decisions:
- issue: Bedeutung der „Mächte in den Himmeln“
  choice: Die allgemeine Formulierung „die Mächte in den Himmeln“ bleibt stehen.
  alternative: „die himmlischen Mächte“ im Sinn von Engelwesen oder „die Kräfte/Ordnungen der Himmel“ im kosmischen Sinn
  rationale: Der griechische Ausdruck legt nicht fest, ob Wesen, Kräfte oder kosmische Strukturen gemeint sind. Die Übersetzung bewahrt diese echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „werden ... werden“ ist durch die Satzstruktur verständlich; die zweite Passivform gibt das Griechische präzise wieder. „Himmel“ benötigt keine eigene Fußnote, da das deutsche Wort die lexikalische Spannweite von sichtbarem Himmel und himmlischem Bereich ebenfalls weitgehend trägt.
