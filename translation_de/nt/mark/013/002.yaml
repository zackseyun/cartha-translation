reference: Mark 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihm: „Siehst du diese großen Bauwerke[a]? Hier wird kein Stein auf dem anderen bleiben[b], der nicht niedergerissen wird[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „diese großen Tempelbauten“. Gemeint sind im Zusammenhang die Bauten des Tempelkomplexes; im Griechischen steht jedoch nur „Bauwerke“.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „kein Stein auf dem anderen“ bezeichnet eine vollständige Zerstörung.
    reason: cultural_note
  - marker: c
    text: 'Oder: „zerstört“ beziehungsweise „zum Einsturz gebracht“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: Und Jesus sagte zu ihm
  rationale: Gibt die schlichte erzählerische Verbindung mit καί und die Redeformel εἶπεν αὐτῷ wieder, ohne zusätzlich die Bedeutung „antwortete“ einzutragen.
- source_word: Βλέπεις
  choice: Siehst du
  rationale: Das Präsens steht hier als direkte Frage. „Siehst du“ ist im Deutschen natürlich und bewahrt die Frageform, ohne daraus einen Imperativ wie „Sieh dir … an“ zu machen.
- source_word: μεγάλας οἰκοδομάς
  choice: diese großen Bauwerke
  rationale: „Bauwerke“ bezeichnet die errichteten Gebäude des Tempelkomplexes, ohne das im Griechischen nicht ausdrücklich vorhandene Wort „Tempel“ einzufügen. „Groß“ lässt sowohl räumliche Größe als auch eindrucksvolle Wirkung zu.
- source_word: οὐ μὴ ἀφεθῇ
  choice: wird kein … bleiben
  rationale: Die Verbindung οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche zukünftige Verneinung aus. Die deutsche Konstruktion mit „kein“ und Futur vermittelt die bestimmte Ankündigung idiomatisch.
- source_word: ὧδε
  choice: hier
  rationale: Das Ortsadverb wird unmittelbar und anschaulich mit „hier“ wiedergegeben.
- source_word: λίθος ἐπὶ λίθον
  choice: Stein auf dem anderen
  rationale: Bewahrt das konkrete Bild der griechischen Wendung und entspricht einer geläufigen deutschen Ausdrucksweise für vollständige Zerstörung.
- source_word: καταλυθῇ
  choice: niedergerissen wird
  rationale: καταλύω bezeichnet bei einem Bauwerk dessen Abbruch oder Zerstörung. „Niedergerissen“ ist anschaulich, gegenwärtig verständlich und passt zum Tempelbau.
- source_word: ὃς
  choice: der
  rationale: Das Relativpronomen und damit die spannungsreiche griechische Satzform werden beibehalten, statt den Relativsatz in eine erklärende Aussage wie „alles wird zerstört“ aufzulösen.
theological_decisions:
- issue: Umfang der Ankündigung über den Tempelkomplex
  choice: Im Haupttext steht allgemein „Bauwerke“.
  alternative: „diese großen Tempelbauten“
  rationale: Der unmittelbare Zusammenhang identifiziert die Gebäude als Teile des Tempelkomplexes; οἰκοδομάς selbst bedeutet jedoch lediglich „Bauwerke/Gebäude“. Die allgemeinere Wiedergabe vermeidet eine nicht ausdrücklich vorhandene Präzisierung.
- issue: Stärke und Bildhaftigkeit der Zerstörungsankündigung
  choice: Die doppelte Verneinung und das Bild von Stein auf Stein bleiben in der deutschen Satzstruktur erkennbar.
  alternative: „Alles wird vollständig zerstört werden.“
  rationale: Eine zusammenfassende Formulierung wäre verständlich, würde aber das konkrete Bild und die emphatische Form des griechischen Textes einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Frage und das eindringliche Bild bleiben erhalten. „Bauwerke“ ist etwas gehobener als „Gebäude“, passt aber zum monumentalen Zusammenhang und bewahrt die Allgemeinheit des griechischen Ausdrucks.
