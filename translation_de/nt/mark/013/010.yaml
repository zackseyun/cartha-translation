  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Satzes zutreffend wieder: καὶ als fortführendes „Und“, εἰς πάντα τὰ ἔθνη als umfassendes „allen Völkern“, πρῶτον als „zuerst“, δεῖ als notwendiges „muss“, den passiven Infinitiv κηρυχθῆναι als „verkündet werden“ und τὸ εὐαγγέλιον als „die gute Nachricht“. Die vorgezogene Stellung von „zuerst“ ist im Deutschen natürlich und erhält den Nachdruck des griechischen Textes.'
  naturalness: „Und zuerst muss die gute Nachricht allen Völkern verkündet werden“ ist idiomatisches modernes Standarddeutsch und hat einen sachlich-biblischen, nicht altertümlichen Ton. Die Dativfügung „allen Völkern verkündet“ ist sprachlich korrekt.
  terminology: „Die gute Nachricht“ ist eine transparente und vertretbare Wiedergabe von εὐαγγέλιον; die traditionelle Alternative „das Evangelium“ ist angemessen dokumentiert. „Völkern“ bewahrt die weite Bedeutung von ἔθνη, ohne den Ausdruck einseitig als „Nichtjuden“ festzulegen. Die zweite Fußnote hält diese kontextabhängige Möglichkeit sowie die Nuance „unter allen Völkern“ vorsichtig fest.
