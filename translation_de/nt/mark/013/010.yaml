  text: καὶ εἰς πάντα τὰ ἔθνη ⸂πρῶτον δεῖ⸃ κηρυχθῆναι τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: de
  text: Und zuerst muss die gute Nachricht allen Völkern verkündet werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Evangelium“. Das griechische Wort εὐαγγέλιον bedeutet „gute Nachricht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unter allen Völkern“; das griechische Wort ἔθνη kann in manchen Zusammenhängen auch „Nichtjuden“ bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Das Bindewort führt den Gedankengang fort, ohne einen Gegensatz einzutragen.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: allen Völkern
  rationale: Bei einem Verb des Verkündigens kann εἰς Zielrichtung oder Reichweite bezeichnen. „Allen Völkern“ gibt den weltweiten Umfang natürlich wieder; die mögliche Bedeutung „unter allen Völkern“ wird in einer Fußnote bewahrt.
- source_word: πρῶτον
  choice: zuerst
  rationale: πρῶτον bezeichnet zeitlichen Vorrang; „zuerst“ wahrt diese Abfolge, ohne sie chronologisch weiter auszudeuten.
- source_word: δεῖ
  choice: muss
  rationale: δεῖ drückt Notwendigkeit aus, deren göttlicher oder endzeitlicher Hintergrund hier nicht ausdrücklich benannt wird.
- source_word: κηρυχθῆναι
  choice: verkündet werden
  rationale: Der passive Infinitiv bezeichnet die öffentliche Bekanntmachung einer Botschaft. „Verkündet werden“ ist im Deutschen klar, würdig und sachlich passend.
- source_word: τὸ εὐαγγέλιον
  choice: die gute Nachricht
  rationale: εὐαγγέλιον bedeutet eine gute Nachricht oder Heilsbotschaft. Die transparente deutsche Wiedergabe wird gewählt; der traditionelle Ausdruck „Evangelium“ bleibt als Alternative in der Fußnote erhalten.
theological_decisions:
- issue: Reichweite von ἔθνη
  choice: allen Völkern
  alternative: unter allen Völkern; allen Nichtjuden
  rationale: Die Formulierung bewahrt den umfassenden, weltweiten Sinn, ohne ἔθνη vorschnell auf Nichtjuden einzuengen. Die örtlich-soziale Nuance „unter“ wird als echte Übersetzungsmöglichkeit dokumentiert.
- issue: Kraft von δεῖ
  choice: muss
  alternative: es ist notwendig
  rationale: „Muss“ erhält die starke Notwendigkeit, nennt aber deren Ursprung nicht ausdrücklich und vermeidet damit eine theologische Ergänzung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung hebt wie der griechische Text „zuerst“ hervor; die beiden Fußnotenmarker stehen vollständig im Haupttext.
