base_translation:
  language: en
  yaml_path: translation/nt/mark/013/033.yaml
  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: de
  text: Seht euch vor und bleibt wach, denn ihr wisst nicht, wann die Zeit[a] kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der festgelegte Zeitpunkt“ beziehungsweise „der entscheidende Zeitpunkt“. Das griechische Wort καιρός bezeichnet häufig eine entscheidende oder festgelegte Zeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: Seht euch vor
  rationale: Der Imperativ wird hier idiomatisch als Warnung gebraucht, nicht im Sinn bloßen Sehens. „Seht euch vor“ ist natürlich und unterscheidet sich von der folgenden Aufforderung zum Wachbleiben.
- source_word: ἀγρυπνεῖτε
  choice: bleibt wach
  rationale: Bewahrt das Bild des Wachseins und kann zugleich wörtliche wie übertragene Wachsamkeit ausdrücken.
- source_word: οὐκ οἴδατε γὰρ
  choice: denn ihr wisst nicht
  rationale: Gibt die begründende Funktion von γάρ und die schlichte Verneinung des Wissens direkt wieder.
- source_word: πότε
  choice: wann
  rationale: Natürliche und genaue deutsche Entsprechung des temporalen Frageadverbs.
- source_word: ὁ καιρός ἐστιν
  choice: die Zeit da ist
  rationale: καιρός bezeichnet hier den entscheidenden Zeitpunkt; „da ist“ formuliert die deutsche Zeitangabe idiomatisch, ohne sie näher festzulegen.
theological_decisions:
- issue: Bedeutungsnuance von καιρός im endzeitlichen Zusammenhang
  choice: die Zeit
  alternative: der festgesetzte Zeitpunkt; der entscheidende Zeitpunkt
  rationale: Der Haupttext wahrt die semantische Offenheit des griechischen Ausdrucks. Die Alternativen machen dessen mögliche Nuance eines entscheidenden oder festgesetzten Zeitpunkts sichtbar, ohne diese im Haupttext verbindlich festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Mahnton. Die beiden Imperative bleiben unterscheidbar; das Wachheitsbild wird bewahrt.
