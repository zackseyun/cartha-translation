id: MRK.13.15
reference: Mark 13:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: de
  text: Wer auf dem Dach ist, soll nicht hinuntersteigen und auch nicht hineingehen, um etwas aus seinem Haus zu holen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist das damals übliche flache, begehbare Hausdach, das auch als Aufenthaltsbereich diente.
    reason: Kulturelle Erläuterung zum antiken Hausdach.
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: Wer auf dem Dach ist
  rationale: Die substantivierte Wendung bezeichnet allgemein die Person, die sich auf dem begehbaren Flachdach befindet. Die deutsche Relativkonstruktion gibt diesen allgemeinen Sinn natürlich wieder.
- source_word: δώματος
  choice: Dach
  rationale: „Dach“ ist im modernen Deutschen die klare, natürliche Bezeichnung; eine Fußnote erläutert, dass ein begehbares Flachdach gemeint ist.
- source_word: μὴ καταβάτω
  choice: soll nicht hinuntersteigen
  rationale: Der verneinte Imperativ der dritten Person wird mit „soll nicht“ wiedergegeben. „Hinuntersteigen“ bewahrt die räumliche Bewegung vom Dach nach unten.
- source_word: μηδὲ εἰσελθάτω
  choice: und auch nicht hineingehen
  rationale: μηδέ verbindet eine zweite, nachdrückliche Untersagung. „Hineingehen“ lässt das im Zusammenhang naheliegende Ziel, das Hausinnere, bestehen, ohne zusätzliche Einzelheiten einzuführen.
- source_word: τι ἆραι
  choice: um etwas … zu holen
  rationale: Der Infinitiv bezeichnet den Zweck des Hineingehens. In diesem Zusammenhang gibt „holen“ das Aufnehmen und Herausbringen eines Gegenstands idiomatisch wieder.
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: aus seinem Haus
  rationale: „Aus“ entspricht ἐκ und bezeichnet die Bewegung aus dem Inneren. „Seinem“ bewahrt den grammatisch maskulinen repräsentativen Singular der Vorlage.
theological_decisions:
- issue: Repräsentativer maskuliner Singular in einer allgemein geltenden Anweisung
  choice: aus seinem Haus
  alternative: aus dem Haus / aus ihrem Haus
  rationale: Die griechische Vorlage verwendet einen maskulinen Singular mit allgemeiner Reichweite. Die Übersetzung bewahrt diese Form, während „Wer“ den allgemeinen Anwendungsbereich natürlich erkennen lässt.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die Formulierung ist dringlich, ohne unnötig altertümlich zu wirken; die kulturelle Besonderheit des Flachdachs wird in der Fußnote erläutert.
