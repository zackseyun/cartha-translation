id: MRK.13.20
reference: Mark 13:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: de
  text: Und wenn der Herr die Tage nicht verkürzt hätte, wäre kein Mensch[a] gerettet worden. Doch um der Erwählten willen, die er erwählt hat, hat er die Tage verkürzt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „alles Fleisch“; in dieser verneinten Aussage: „kein Fleisch“. Gemeint ist: kein Mensch; im Zusammenhang auch: Niemand wäre am Leben geblieben.'
    reason: Die Fußnote bewahrt die konkrete griechische Wendung πᾶσα σάρξ, erläutert ihre Funktion unter der Verneinung und nennt die kontextuelle Nuance körperlicher Bewahrung.
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: verkürzt
  rationale: Das Verb bezeichnet ein Verkürzen oder Abkürzen. „Verkürzt“ ist im Deutschen natürlich und gibt an beiden Stellen denselben zeitlichen Vorgang wieder.
- source_word: κύριος
  choice: der Herr
  rationale: Das artikellose κύριος bezeichnet hier einen bestimmten Referenten und wird entsprechend als „der Herr“ wiedergegeben.
- source_word: τὰς ἡμέρας
  choice: die Tage
  rationale: Die wörtliche Wiedergabe bewahrt den Rückbezug auf die zuvor beschriebenen Tage der Bedrängnis, ohne den Zeitraum näher festzulegen.
- source_word: οὐκ ἂν ἐσώθη
  choice: wäre … nicht gerettet worden
  rationale: Die Konstruktion mit ἄν bezeichnet eine nicht eingetretene Folge. „Gerettet“ bewahrt die lexikalische Weite von σῴζω, obwohl im unmittelbaren Zusammenhang die Bewahrung des Lebens im Vordergrund steht.
- source_word: πᾶσα σάρξ
  choice: kein Mensch
  rationale: 'Unter der vorangehenden Verneinung bezeichnet die biblische Wendung „alles Fleisch“ die gesamte lebende Menschheit: Kein Mensch wäre gerettet worden. Die natürliche deutsche Wiedergabe steht im Haupttext; die konkrete Wendung „kein Fleisch“ wird in der Fußnote dokumentiert.'
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: um der Erwählten willen
  rationale: διά mit Akkusativ drückt hier den Grund beziehungsweise das Handeln zugunsten der Erwählten aus. Die Formulierung ist würdig und im modernen Standarddeutsch verständlich.
- source_word: ἐκλεκτούς
  choice: die Erwählten
  rationale: „Die Erwählten“ gibt die theologisch geprägte Bezeichnung wieder, ohne im Text eine bestimmte Lehre über Art oder Umfang der Erwählung festzulegen.
- source_word: οὓς ἐξελέξατο
  choice: die er erwählt hat
  rationale: Die bewusste Wiederholung von „Erwählten“ und „erwählt“ entspricht der Wortverwandtschaft im Griechischen und erhält den Nachdruck des Relativsatzes.
theological_decisions:
- issue: Bedeutung von „gerettet“ im Zusammenhang
  choice: „gerettet worden“ bleibt im Haupttext stehen; der unmittelbare Zusammenhang legt die Bewahrung menschlichen Lebens nahe.
  alternative: „am Leben geblieben“ oder „überlebt“
  rationale: Eine rein auf ewiges Heil bezogene Deutung wird vom Zusammenhang nicht verlangt. Zugleich würde „überlebt“ die Bedeutungsweite von σῴζω unnötig verengen.
- issue: Referent der Erwählten
  choice: Die Bezeichnung „die Erwählten“ wird ohne weitere dogmatische Festlegung beibehalten.
  alternative: Eine ausdrücklich individuelle oder ausdrücklich kollektive Deutung der Erwählung
  rationale: Der Vers sagt, dass der Herr diese Menschen erwählt hat und ihretwegen die Tage verkürzt; weitergehende Fragen zur Erwählungslehre entscheidet er an dieser Stelle nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Formen „Erwählten“ und „erwählt“ wirken leicht markiert, bilden aber die gezielte griechische Wortwiederholung transparent ab. Der Haupttext bleibt verständlich, während die Fußnote das biblische Bild „Fleisch“ erhält.
