source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: de
  text: Denn ein Volk wird sich gegen ein anderes erheben und ein Reich gegen ein anderes. An verschiedenen Orten wird es Erdbeben geben; und Hungersnöte wird es geben. All dies ist der Anfang der Geburtswehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „der Anfang der Wehen“ oder „der Geburtsschmerzen“. Das griechische Wort bezeichnet die mit einer Geburt verbundenen Schmerzen und wird hier bildlich für Leiden gebraucht, die dem Folgenden vorausgehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: wird sich erheben
  rationale: Das formal passive Verb bezeichnet hier idiomatisch das Aufstehen beziehungsweise Losschlagen einer Gruppe gegen eine andere. Die reflexive deutsche Wendung gibt den Konfliktsinn natürlich wieder, ohne eine ungenannte handelnde Instanz einzuführen.
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: ein Volk ... gegen ein anderes
  rationale: ἔθνος kann Volk, Nation oder Volksgruppe bedeuten. Im Parallelismus mit βασιλεία passt „Volk“ gut und vermeidet eine unnötige Beschränkung auf moderne Nationalstaaten.
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: ein Reich ... gegen ein anderes
  rationale: βασιλεία bezeichnet hier ein politisches Herrschaftsgebiet. „Reich“ erhält den politischen Sinn und den Parallelismus.
- source_word: σεισμοὶ
  choice: Erdbeben
  rationale: σεισμός bezeichnet in diesem Zusammenhang eindeutig Erdbeben; die deutsche Wiedergabe ist direkt und allgemein verständlich.
- source_word: κατὰ τόπους
  choice: an verschiedenen Orten
  rationale: Die distributive Konstruktion bezeichnet mehrere, räumlich verteilte Orte. Die Formulierung ist natürlich und bewahrt diesen Sinn.
- source_word: λιμοί
  choice: Hungersnöte
  rationale: λιμός meint eine Hungersnot und nicht bloß individuellen Hunger oder eine geringfügige Lebensmittelknappheit.
- source_word: ἀρχὴ
  choice: der Anfang
  rationale: Das artikellose Prädikatsnomen wird im Deutschen idiomatisch mit bestimmtem Artikel wiedergegeben und bezeichnet den Beginn, nicht die Gesamtheit des folgenden Geschehens.
- source_word: ὠδίνων
  choice: der Geburtswehen
  rationale: ὠδίν bezeichnet die Schmerzen beziehungsweise Wehen einer Geburt. „Geburtswehen“ bewahrt das anschauliche Bild und bleibt in modernem Deutsch klar.
- source_word: ταῦτα
  choice: All dies
  rationale: Der neutrale Plural verweist zusammenfassend auf die zuvor genannten Ereignisse. „All dies“ ermöglicht im Deutschen die natürliche Singularform „ist“ und macht den Gesamtbezug deutlich.
theological_decisions:
- issue: Apokalyptisches Bild in ἀρχὴ ὠδίνων
  choice: „der Anfang der Geburtswehen“ bewahrt das Bild eines beginnenden leidvollen Prozesses, der auf Weiteres vorausweist.
  alternative: Die Wendung könnte zu „der Anfang der Leiden“ verallgemeinert oder ausdrücklich auf ein bestimmtes endzeitliches Schema festgelegt werden.
  rationale: Die Übersetzung erhält sowohl das konkrete Geburtsbild als auch seine offene zeitliche und theologische Spannung, ohne das Folgende näher zu bestimmen, als es der Vers selbst tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „wird es geben“ spiegelt die Gliederung des griechischen Textes, während „auch“ den Anschluss der Hungersnöte im Deutschen verdeutlicht. Der Fußnotenmarker steht unmittelbar bei der erläuterten Wendung.
