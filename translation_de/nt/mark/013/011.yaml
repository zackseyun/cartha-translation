  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: de
  text: Und wenn sie euch abführen und ausliefern[a], macht euch nicht im Voraus Sorgen, was ihr sagen sollt. Sagt vielmehr, was euch in jener Stunde gegeben wird. Denn nicht ihr seid es, die reden, sondern der Heilige Geist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wenn sie euch abführen, um euch auszuliefern“. Das Griechische verbindet „abführen“ mit einem begleitenden Partizip („ausliefernd“).'
    reason: syntaktische_alternative
lexical_decisions:
- source_word: καὶ ὅταν
  choice: Und wenn
  rationale: Bewahrt sowohl den Anschluss an den vorherigen Zusammenhang als auch den erwarteten zukünftigen Fall.
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: sie euch abführen und ausliefern
  rationale: „Abführen“ gibt die erzwungene Wegführung im Verfolgungskontext natürlich wieder; „ausliefern“ bewahrt den juridischen Sinn von παραδίδωμι. Die Koordination löst das griechische Partizip idiomatisch auf.
- source_word: μὴ προμεριμνᾶτε
  choice: macht euch nicht im Voraus Sorgen
  rationale: Gibt sowohl die besorgte gedankliche Vorwegnahme als auch die zeitliche Komponente des Präfixes προ- verständlich wieder.
- source_word: τί λαλήσητε
  choice: was ihr sagen sollt
  rationale: „Sagen“ ist in dieser indirekten Frage natürliches modernes Deutsch; die modale Färbung des Konjunktivs bleibt durch „sollt“ erhalten.
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: was euch ... gegeben wird
  rationale: Die passive Form bleibt erhalten und deutet göttliche Gabe an, ohne den Geber ausdrücklich zu ergänzen.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: in jener Stunde
  rationale: Bewahrt die feierliche und zeitlich zugespitzte Formulierung des Griechischen.
- source_word: τοῦτο λαλεῖτε
  choice: Sagt vielmehr, was euch ... gegeben wird
  rationale: Eine natürliche deutsche Umstellung; der Inhalt des demonstrativen τοῦτο bleibt als genau das wiedergegeben, was gegeben wird.
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: Denn nicht ihr seid es, die reden
  rationale: Die Spaltsatzkonstruktion wahrt die ausdrückliche Betonung von ὑμεῖς und den Kontrast zum Heiligen Geist.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: der Heilige Geist
  rationale: Entspricht der etablierten, modernen deutschen Bezeichnung.
theological_decisions:
- issue: Wirksamkeit des Heiligen Geistes und menschliches Reden in der Verfolgung
  choice: Die Jünger sollen tatsächlich reden, doch als entscheidender Ursprung ihres in dieser Stunde gegebenen Redens wird der Heilige Geist bezeichnet.
  alternative: Entweder ein mechanisches Diktat ohne echte menschliche Beteiligung oder lediglich eine unbestimmte religiöse Ermutigung.
  rationale: 'Der griechische Text hält beides zusammen: Die Angesprochenen erhalten den Auftrag zu reden, zugleich wird das Reden im emphatischen Gegensatz dem Heiligen Geist zugeschrieben. Die Übersetzung löst diese Spannung nicht einseitig auf.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „In jener Stunde“ bewahrt bewusst die biblische Prägnanz; „macht euch nicht im Voraus Sorgen“ ist gegenwärtig und zugänglich. Der Wechsel zwischen „sagen“ und „reden“ dient natürlichem Deutsch, ohne den wiederholten Gebrauch von λαλέω theologisch zu überfrachten.
