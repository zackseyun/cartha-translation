  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: de
  text: 'Viele werden in meinem Namen kommen und sagen: »Ich bin es[a]«, und sie werden viele in die Irre führen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Ich bin.« Im Griechischen wird kein Prädikat ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Viele
  rationale: Das substantivierte Adjektiv bezeichnet eine unbestimmte große Zahl von Menschen; »Viele« ist knapp und natürlich.
- source_word: ἐλεύσονται
  choice: werden kommen
  rationale: Die direkte und im Zusammenhang passende Wiedergabe des Futurs von ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die feste deutsche Wendung bewahrt den Gedanken, dass die Betreffenden unter Berufung auf Jesu Namen beziehungsweise mit beanspruchter Verbindung zu ihm auftreten.
- source_word: λέγοντες
  choice: und sagen
  rationale: Das Partizip bezeichnet die begleitende Äußerung; die Beiordnung klingt im modernen Deutsch natürlicher, ohne den Sinn zu erweitern.
- source_word: ὅτι Ἐγώ εἰμι
  choice: Ich bin es[a]
  rationale: »Ich bin es« gibt die im Kontext naheliegende Selbstidentifikation idiomatisch wieder. Da im Griechischen kein Prädikatsnomen oder Pronomen ausdrücklich steht, wird die formal nähere Wiedergabe in der Fußnote erhalten.
- source_word: πολλοὺς
  choice: viele
  rationale: Das substantivierte Akkusativobjekt wird entsprechend dem einleitenden πολλοὶ knapp mit »viele« wiedergegeben.
- source_word: πλανήσουσιν
  choice: werden … in die Irre führen
  rationale: Die Wendung bewahrt das Bild des Abbringens vom richtigen Weg und passt zu einer Warnung vor falschen Ansprüchen.
theological_decisions:
- issue: Wiedergabe von Ἐγώ εἰμι bei den falschen Anspruchstellern
  choice: Ich bin es
  alternative: Ich bin
  rationale: Der Zusammenhang legt eine Selbstidentifikation beziehungsweise den Anspruch nahe, der Erwartete zu sein. »Ich bin es« ist im Deutschen verständlich, legt aber keinen ausdrücklichen Titel wie »der Christus« in den Text hinein. Die Fußnote bewahrt zugleich die Offenheit der prädikatlosen griechischen Formulierung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nah am griechischen Ausgangstext; das Partizip wird aus Gründen natürlicher deutscher Syntax beigeordnet.
