  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: de
  text: 'Jesus aber begann zu ihnen zu sprechen: „Gebt acht, dass euch niemand in die Irre führt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ ist hier ein schwaches Bindewort. „Aber“ markiert im Deutschen natürlich den Übergang von der Frage der Jünger zu Jesu warnender Antwort, ohne einen starken Gegensatz zu behaupten.
- source_word: ἤρξατο λέγειν
  choice: begann … zu sagen
  rationale: Die Übersetzung bewahrt die markinische Erzählformel und bleibt zugleich in modernem Deutsch verständlich. Ein zusätzliches „antwortete“ steht nicht im griechischen Text.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Das Pronomen wird entsprechend dem ausdrücklichen Wortlaut wiedergegeben; der aus dem Zusammenhang erkennbare Bezug auf die Jünger wird nicht erklärend in den Haupttext eingefügt.
- source_word: Βλέπετε
  choice: Seht zu
  rationale: Der präsentische Imperativ fordert anhaltende Wachsamkeit. „Seht zu“ verbindet sich im Deutschen natürlich mit dem folgenden dass-Satz und gibt den warnenden Ton wieder.
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: dass euch niemand irreführt
  rationale: Die Konstruktion warnt vor einem zu verhindernden Geschehen. „Irreführen“ bewahrt sowohl den Gedanken der Täuschung als auch den des Abbringens vom richtigen Weg.
theological_decisions:
- issue: Bedeutungsumfang der Warnung πλανήσῃ
  choice: Warnung vor einer Täuschung, die vom richtigen Weg abbringt
  alternative: Warnung ausschließlich vor intellektueller Täuschung
  rationale: πλανάω kann sowohl täuschen als auch in die Irre führen bezeichnen. „Irreführt“ erhält diesen weiteren moralischen und theologischen Bedeutungsraum, ohne ihn über den Text hinaus festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Wortfolge wird soweit möglich bewahrt, ohne unnatürlich zu wirken. Gegenüber der englischen Konsultationsfassung ist keine Fußnote nötig, da „irreführen“ die dort auf Haupttext und Alternative verteilten Bedeutungsaspekte idiomatisch bündelt.
