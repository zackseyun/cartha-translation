- from: Ihr aber, nehmt euch in Acht! Man wird euch an Gerichte ausliefern, und in Synagogen werdet ihr geschlagen werden. Meinetwegen werdet ihr vor Statthalter und Könige gestellt werden – ihnen zum Zeugnis.[a]
  to: Gebt aber auf euch selbst acht! Man wird euch an Gerichte ausliefern, und in Synagogen werdet ihr geschlagen werden. Meinetwegen werdet ihr vor Statthalter und Könige gestellt werden – ihnen zum Zeugnis.[a]
  rationale: Die Revision glättet den Warnruf und bewahrt zugleich die durch ὑμεῖς ἑαυτούς hervorgehobene Selbstbezüglichkeit. Die knappe Fußnote dokumentiert präzise die mögliche gegengerichtete Lesart von εἰς μαρτύριον αὐτοῖς, ohne sie in den Haupttext einzutragen oder eine begünstigende Bedeutung von „für sie“ nahezulegen.
