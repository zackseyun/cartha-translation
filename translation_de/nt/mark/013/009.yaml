review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Textes insgesamt zuverlässig wieder: Wachsamkeitsaufforderung, Auslieferung an lokale Gerichtsinstanzen, Misshandlung in Synagogen, erzwungenes Erscheinen vor Statthaltern und Königen um Jesu willen sowie das Zeugnis für diese Machthaber. „Gerichte“, „Statthalter“ und „gestellt werden“ sind in diesem Kontext tragfähig. Die Formulierung der Fußnote erzeugt jedoch eine nicht hilfreiche, scheinbare Alternative zu der bereits gewählten offenen Wiedergabe.'
  naturalness: „Ihr aber, nehmt euch in Acht!“ ist verständlich, aber die Stellung von „Ihr aber“ mit Komma klingt etwas abgehackt. „Gebt aber auf euch selbst acht!“ ist modernes, natürliches Standarddeutsch und bildet die betonte reflexive Wendung βλέπετε δὲ ὑμεῖς ἑαυτούς genauer ab.
  terminology: „Synagogen“, „Gerichte“, „Statthalter und Könige“ sowie „Zeugnis“ sind sachgerecht. „Ihnen zum Zeugnis“ bewahrt die im Griechischen nicht ausdrücklich festgelegte Frage, ob das Zeugnis lediglich an sie gerichtet oder gegen sie gerichtet ist.
  issues:
  - severity: low
    issue: Die Fußnote nennt „als Zeugnis für sie“ als Alternative.
    rationale: „Für sie“ kann im Deutschen einen begünstigenden Sinn nahelegen und ist zudem gegenüber „ihnen zum Zeugnis“ keine klar abgegrenzte textliche Alternative. Die wesentliche, zu dokumentierende Deutungsalternative ist der mögliche adversative Sinn „gegen sie“.
  - severity: low
    issue: Der einleitende Warnruf ist stilistisch leicht holprig.
    rationale: Die emphatische Verbindung von explizitem Personalpronomen und Reflexivpronomen lässt sich mit „Gebt aber auf euch selbst acht!“ idiomatischer und zugleich quellennäher wiedergeben.
