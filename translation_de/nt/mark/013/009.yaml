source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: de
  text: Gebt aber auf euch selbst acht! Man wird euch an Gerichte ausliefern, und in Synagogen werdet ihr geschlagen werden. Meinetwegen werdet ihr vor Statthalter und Könige gestellt werden – ihnen zum Zeugnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „als Zeugnis gegen sie“.'
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: Ihr aber, nehmt euch in Acht!
  rationale: Der präsentische Imperativ fordert zu fortdauernder Wachsamkeit auf. „Nehmt euch in Acht“ gibt die Warnung natürlich wieder; „ihr“ bewahrt die Betonung durch das ausdrückliche Pronomen und das Reflexivpronomen.
- source_word: παραδώσουσιν
  choice: Man wird euch … ausliefern
  rationale: Im Verfolgungs- und Gerichtskontext bezeichnet das Verb die Übergabe an zuständige Instanzen. „Ausliefern“ bewahrt diesen rechtlich-zwanghaften Sinn.
- source_word: συνέδρια
  choice: Gerichte
  rationale: Der Plural meint örtliche Rats- beziehungsweise Gerichtsorgane und nicht ausschließlich den Jerusalemer Hohen Rat. „Gerichte“ macht ihre judizielle Funktion verständlich, ohne eine einzelne Institution vorauszusetzen.
- source_word: συναγωγάς
  choice: Synagogen
  rationale: Die übliche deutsche Bezeichnung bewahrt sowohl den institutionellen als auch den örtlichen Bezug des griechischen Wortes.
- source_word: δαρήσεσθε
  choice: werdet ihr geschlagen werden
  rationale: Das Passiv bezeichnet körperliche Misshandlung, ohne die konkrete Art des Schlagens so eng festzulegen wie „auspeitschen“.
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε
  choice: werdet ihr vor Statthalter und Könige gestellt werden
  rationale: Die passive Form kann ausdrücken, dass die Jünger gezwungen werden, vor diesen Herrschern zu erscheinen. „Gestellt werden“ bewahrt diesen Zwang deutlicher als das bloße „stehen“.
- source_word: ἕνεκεν ἐμοῦ
  choice: meinetwegen
  rationale: Das Wort gibt knapp und idiomatisch an, dass die Bindung an Jesus der Grund für die Verfolgung ist.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ihnen zum Zeugnis
  rationale: Diese bewusst offene Formulierung gibt die Ziel- beziehungsweise Ergebnisbeziehung wieder und legt nicht unnötig fest, ob das Zeugnis für, gegenüber oder gegen die Machthaber wirkt.
theological_decisions:
- issue: Aussageabsicht von εἰς μαρτύριον αὐτοῖς
  choice: „ihnen zum Zeugnis“ lässt das erzwungene Erscheinen als an die Herrscher gerichtetes Zeugnis verstehen, ohne dessen Wirkung festzulegen.
  alternative: „als Zeugnis gegen sie“ würde ausdrücklich einen anklagenden beziehungsweise verurteilenden Sinn annehmen.
  rationale: μαρτύριον bezeichnet ein Zeugnis, und αὐτοῖς verlangt für sich genommen keinen gegnerischen Sinn. Die offene deutsche Wendung bewahrt die mögliche Spannung zwischen Zeugnis für die Angesprochenen und Zeugnis gegen sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kurze Warnruf bleibt eindringlich; die anschließenden Passivformen lassen die Gewalt und den Zwang hervortreten. Der Gedankenstrich hebt die Zweck- beziehungsweise Ergebnisangabe hervor, ohne ihre theologische Mehrdeutigkeit aufzulösen.
