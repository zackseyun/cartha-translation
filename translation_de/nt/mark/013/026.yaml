  terminology: „Menschensohn“ ist für τὸν υἱὸν τοῦ ἀνθρώπου die etablierte und sachgerechte deutsche Titelwiedergabe. „Macht und Herrlichkeit“ trifft δύναμις und δόξα im biblisch-apokalyptischen Register treffend. Die Fußnote erhält die mögliche Wiedergabe von ἐν νεφέλαις als „mit den Wolken“ und benennt den Daniel-7,13-Anklang, ohne ihn in den Haupttext einzutragen.
