  source_fidelity: 'Der Text gibt alle Elemente des griechischen Satzes zutreffend wieder: das zukünftige Sehen, den Titel „den Menschensohn“, das Kommen in den Wolken sowie die Begleitung durch große Macht und Herrlichkeit. Die deutsche Infinitivkonstruktion „kommen sehen“ ist eine angemessene Entsprechung zum griechischen Partizip ἐρχόμενον.'
