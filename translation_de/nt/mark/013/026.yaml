  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: de
  text: Und dann werden sie den Menschensohn in den Wolken kommen sehen, mit großer Macht und Herrlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit den Wolken kommen«. Wörtlich steht im Griechischen »in Wolken«; die alternative Wiedergabe lässt den wahrscheinlichen Anklang an Daniel 7,13 deutlicher hervortreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: werden sie … sehen
  rationale: Das Futur von ὁράω bezeichnet hier schlicht ein zukünftiges Sehen. Die deutsche Futurform ist natürlich und bewahrt den öffentlichen, sichtbaren Charakter des Geschehens.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe des Titels und bewahrt seinen Bezug zu Daniel 7 sowie seine christologische und apokalyptische Bedeutung.
- source_word: ἐρχόμενον
  choice: kommen
  rationale: Der Partizipialausdruck wird in der deutschen Infinitivkonstruktion „kommen sehen“ idiomatisch wiedergegeben. „Kommen“ bewahrt die Bewegung und den apokalyptischen Sprachklang.
- source_word: ἐν νεφέλαις
  choice: in den Wolken
  rationale: ἐν bezeichnet zunächst die Sphäre beziehungsweise den Bereich des Kommens. Im Deutschen ist „in den Wolken“ die natürliche Formulierung; die alternative Wiedergabe „mit den Wolken“ macht den wahrscheinlichen Anklang an Daniel 7,13 deutlicher und wird deshalb in einer Fußnote genannt.
- source_word: μετὰ δυνάμεως πολλῆς
  choice: mit großer Macht
  rationale: μετά mit Genitiv bezeichnet Begleitung; „mit großer Macht“ ist die natürliche deutsche Wiedergabe von δυνάμεως πολλῆς.
- source_word: καὶ δόξης
  choice: und Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem biblischen Gebrauch von δόξα als offenbar werdender Majestät und bewahrt die intertextuelle sowie theologische Prägung des Begriffs.
theological_decisions:
- issue: Apokalyptischer Titel und Wolkenmotiv
  choice: Den Titel „Menschensohn“ und das Kommen in den Wolken ohne erklärende Erweiterung beibehalten.
  alternative: „der Mensch“ beziehungsweise eine ausdrückliche Paraphrase des Bezugs auf Daniel 7
  rationale: Der Wortlaut ruft Daniel 7,13 auf, soll diesen Bezug aber im Haupttext anklingen lassen, statt ihn auszudeuten. „Menschensohn“ bewahrt zugleich die christologische und endzeitliche Spannung des griechischen Textes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute biblische Wendung „Menschensohn“ und „Herrlichkeit“ bleibt erhalten; die Syntax „kommen sehen“ ist zugleich idiomatisch und quellennah.
