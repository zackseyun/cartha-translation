  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: de
  text: 'Und dann, wenn jemand zu euch sagt: „Seht, hier ist der Messias[a]!“, oder: „Seht, dort!“, glaubt es nicht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Christus“.'
    reason: Alternative traditionelle Wiedergabe des griechischen Titels χριστός.
lexical_decisions:
- source_word: καὶ τότε
  choice: Und wenn dann
  rationale: „Und“ bewahrt die Verknüpfung mit dem vorausgehenden Abschnitt, während „dann“ den zeitlichen Bezug ausdrückt. In Verbindung mit dem folgenden Bedingungssatz ist diese Wortstellung im Deutschen natürlich.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: wenn jemand zu euch sagt
  rationale: Die Formulierung gibt die allgemeine Bedingung und das unbestimmte τις klar und idiomatisch wieder.
- source_word: Ἴδε
  choice: Seht
  rationale: Ἴδε dient hier als nachdrücklicher Aufmerksamkeitsruf. Das moderne „Seht“ passt zu den mehreren Angesprochenen und vermeidet das altertümliche „Siehe“.
- source_word: ὧδε
  choice: hier
  rationale: „Hier“ ist die direkte und idiomatische Entsprechung des lokalen Adverbs.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: Mit Artikel und im Kontext endzeitlicher Anspruchsteller bezeichnet χριστός einen Titel, den erwarteten Gesalbten, und nicht bloß einen namensähnlichen Bestandteil. „Messias“ macht diese Titelfunktion im heutigen Deutsch deutlich.
- source_word: ἐκεῖ
  choice: dort
  rationale: „Dort“ bildet den knappen räumlichen Gegensatz zu „hier“ ab.
- source_word: μὴ πιστεύετε
  choice: dann glaubt es nicht
  rationale: Das im Griechischen unausgesprochene Objekt ist dem Zusammenhang nach die aufgestellte Behauptung. „Es“ lässt den Bezug auf die Meldung offen, statt ihn unnötig auf den Sprecher einzuengen; „dann“ kennzeichnet im Deutschen natürlich den Hauptsatz der Bedingung.
theological_decisions:
- issue: Wiedergabe von Χριστός
  choice: Messias
  alternative: Christus
  rationale: Hier steht der Ausdruck als Titel in einer Warnung vor falschen endzeitlichen Anspruchstellern. „Messias“ bewahrt diese Funktion als Bezeichnung des erwarteten Gesalbten; die traditionelle Wiedergabe „Christus“ bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und eindringlich; die Ellipse „Seht, dort!“ wird wie im Griechischen nicht erklärend ergänzt.
