  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: de
  text: Und ein Bruder wird seinen Bruder dem Tod ausliefern[a] und ein Vater sein Kind; und Kinder werden sich gegen ihre Eltern erheben und sie töten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verraten“. Das griechische Verb kann „übergeben“, „ausliefern“ oder im Zusammenhang „verraten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: wird … ausliefern
  rationale: „Ausliefern“ bewahrt den konkreten Sinn, jemanden in die Gewalt anderer und damit dem Tod zu übergeben; anders als „verraten“ legt es den Schwerpunkt nicht einseitig auf den persönlichen Treuebruch.
- source_word: ἀδελφὸς ἀδελφὸν
  choice: ein Bruder … seinen Bruder
  rationale: Die maskulinen Verwandtschaftsbezeichnungen bleiben erhalten. Das Possessivpronomen macht die im Griechischen vorausgesetzte familiäre Beziehung in natürlichem Deutsch deutlich.
- source_word: εἰς θάνατον
  choice: dem Tod
  rationale: In Verbindung mit „ausliefern“ gibt „dem Tod“ das Ziel beziehungsweise Ergebnis der Auslieferung knapp und idiomatisch wieder.
- source_word: πατὴρ τέκνον
  choice: ein Vater sein Kind
  rationale: „Vater“ entspricht der spezifisch maskulinen Bezeichnung πατήρ; „Kind“ wahrt den weiteren Bedeutungsumfang von τέκνον und legt das Geschlecht nicht fest.
- source_word: ἐπαναστήσονται … ἐπὶ
  choice: werden sich gegen … erheben
  rationale: Die Wendung bewahrt das anschauliche Bild eines feindseligen Aufstehens gegen die Eltern, ohne es auf bloßen Ungehorsam oder eine allgemeine Entfremdung abzuschwächen.
- source_word: γονεῖς
  choice: Eltern
  rationale: Der Plural bezeichnet beide Eltern beziehungsweise Eltern allgemein; „Eltern“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: θανατώσουσιν αὐτούς
  choice: sie töten
  rationale: „Töten“ gibt das kausative Verb klar und unmittelbar wieder. Der Zusammenhang kann eine Hinrichtung oder Tötung durch Verfolger einschließen, ohne dass die deutsche Formulierung deren genaue Art festlegt.
theological_decisions:
- issue: Geschlechtsspezifische und umfassende Familienbezeichnungen
  choice: „Bruder“ und „Vater“ werden entsprechend den spezifisch maskulinen griechischen Formen beibehalten; τέκνον und γονεῖς werden weiter gefasst mit „Kind“ und „Eltern“ wiedergegeben.
  alternative: Alle Bezeichnungen geschlechtsneutral als „Geschwister“ beziehungsweise „Elternteil“ formulieren.
  rationale: Die Übersetzung folgt den jeweiligen Bedeutungsumfängen des griechischen Wortlauts, ohne die spezifischen Formen zu neutralisieren oder die umfassenderen Begriffe unnötig zu verengen.
- issue: Art der familiären Preisgabe
  choice: „dem Tod ausliefern“
  alternative: „verraten“
  rationale: Der Vers beschreibt eindeutig eine tödliche Preisgabe, lässt aber offen, ob der Vorgang primär als persönlicher Verrat, als Anzeige oder als förmliche Übergabe an Verfolger zu verstehen ist. „Ausliefern“ wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappen parallelen Familiensätze und die Härte der Aussage bleiben erhalten; zugleich werden im Deutschen nötige Possessivbezüge ergänzt.
