source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: de
  text: 'Doch was jenen Tag oder jene Stunde betrifft: Niemand weiß es – auch nicht die Engel im Himmel und auch nicht der Sohn, sondern nur der Vater.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Manche Ausleger beziehen »auch nicht der Sohn« auf den Auftrag des menschgewordenen Sohnes oder auf seine menschliche Natur. Die Übersetzung gibt den griechischen Wortlaut wieder, ohne diese Erklärung in den Haupttext einzufügen.
    reason: theological_clarification
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Doch was … betrifft
  rationale: περί mit Genitiv führt das Thema ein; δέ markiert hier einen leichten Übergang beziehungsweise Gegensatz. Die deutsche Wendung ist natürlich und bewahrt beide Funktionen.
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: jenen Tag oder jene Stunde
  rationale: Die beiden Genitive bezeichnen den fraglichen Zeitpunkt. Die Wiederholung von »jene« entspricht der griechischen Artikelfolge und klingt im Deutschen klar und idiomatisch.
- source_word: οὐδεὶς οἶδεν
  choice: Niemand weiß es
  rationale: οὐδείς bedeutet »niemand«; οἶδα ist formal ein Perfekt, hat aber Präsensbedeutung. Das ergänzte »es« nimmt den genannten Zeitpunkt natürlich wieder auf.
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: auch nicht die Engel im Himmel
  rationale: οὐδέ führt die Verneinung mit hervorhebender Wirkung fort. ἐν οὐρανῷ wird lokativ auf die Engel bezogen.
- source_word: οὐδὲ ὁ υἱός
  choice: und auch nicht der Sohn
  rationale: Das wiederholte οὐδέ setzt die verneinte Reihe fort. »Der Sohn« bleibt als christologischer Titel unverändert und wird nicht erklärend umschrieben.
- source_word: εἰ μὴ ὁ πατήρ
  choice: sondern nur der Vater
  rationale: εἰ μή bezeichnet nach der Verneinung die einzige Ausnahme. »Sondern nur« gibt diese Ausschließlichkeit in natürlichem Deutsch wieder.
theological_decisions:
- issue: Die Aussage, dass der Sohn den Tag oder die Stunde nicht weiß
  choice: Die klare Formulierung »auch nicht der Sohn« bleibt ohne abschwächenden oder erklärenden Zusatz im Haupttext stehen.
  alternative: Im Haupttext einen Zusatz wie »seiner menschlichen Natur nach« oder »in seinem irdischen Auftrag« einfügen.
  rationale: Der griechische Text enthält ausdrücklich οὐδὲ ὁ υἱός. Die Übersetzung wahrt diese theologische Spannung und überlässt ihre systematische Einordnung der Auslegung, statt sie in den Bibeltext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den thematischen Auftakt; der Gedankenstrich hebt die überraschende Reihe hervor. Die Formulierung bleibt verständlich, ohne die christologische Spannung des Ausgangstextes aufzulösen.
