review_pass:
  verdict: revise
  source_fidelity: Der Haupttext gibt die Satzstruktur, den Daniel-Anklang, die Parenthese und den dringlichen Imperativ insgesamt treffend wieder. „Dort“ ist jedoch im griechischen ὅπου nicht enthalten und sollte entfallen. Bei ὅπου οὐ δεῖ ist eine Wiedergabe mit „sein darf“ näher am elliptischen griechischen Ausdruck als die Wiederholung von „stehen“.
  naturalness: Die Formulierung ist gut verständlich und würdig. „Wenn ihr aber“ ist möglich; „Wenn ihr nun aber“ wäre unnötig. Die Parenthese lässt sich mit Gedankenstrichen natürlich beibehalten. „alle, die in Judäa sind“ fügt gegenüber οἱ ἐν τῇ Ἰουδαίᾳ eine leichte Verallgemeinerung hinzu; „diejenigen in Judäa“ ist genauer und idiomatisch.
  terminology: „Gräuel der Verwüstung“ bewahrt die bewusst offene, an Daniel anknüpfende Formulierung angemessen. Die Fußnote zur maskulinen griechischen Partizipform ist sachlich richtig, sollte aber präzisieren, dass nicht einfach ein „Wort für stehend“ maskulin ist, sondern das Partizip ἑστηκότα. Das deutsche Maskulinum von „Gräuel“ darf die griechische Spannung nicht als im Haupttext erhalten erscheinen.
  issues:
