revisions:
- from: Wenn ihr aber den Gräuel der Verwüstung[b] dort stehen seht, wo er nicht stehen darf[a] – wer liest, soll verstehen! –, dann sollen alle, die in Judäa sind, in die Berge fliehen.
  to: Wenn ihr aber den Gräuel der Verwüstung[b] stehen seht, wo er nicht sein darf[a] – wer liest, soll verstehen! –, dann sollen diejenigen in Judäa in die Berge fliehen.
  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene Ortsverstärkung „dort“, bildet die Ellipse von ὅπου οὐ δεῖ mit „wo er nicht sein darf“ enger nach und vermeidet die leichte Erweiterung durch „alle“. Die Daniel-Anspielung und die umstrittene bzw. auffällige maskuline Partizipform bleiben ohne historische oder theologische Festlegung erhalten. Die Fußnote erläutert die grammatische Beobachtung präzise und bewahrt die Ambiguität.
