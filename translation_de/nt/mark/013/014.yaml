source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: de
  text: Wenn ihr aber den Gräuel der Verwüstung[b] stehen seht, wo er nicht sein darf[a] – wer liest, soll verstehen! –, dann sollen diejenigen in Judäa in die Berge fliehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen ist „Gräuel“ sächlich, das Partizip „stehend“ (ἑστηκότα) jedoch männlich. Das kann auf einen persönlichen oder personifizierten Bezug hinter dem Ausdruck hindeuten. Da „Gräuel“ im Deutschen männlich ist, wird diese Auffälligkeit in der Übersetzung nicht sichtbar.
    reason: alternative_reading
  - marker: b
    text: „Gräuel der Verwüstung“ greift die Ausdrucksweise des Danielbuches auf (siehe Dan 9,27; 11,31; 12,11).
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Wenn ihr aber
  rationale: Ὅταν leitet eine zeitlich bedingte Situation ein; δέ wird als milde Fortführung mit „aber“ wiedergegeben, ohne einen scharfen Gegensatz zu erzeugen.
- source_word: ἴδητε
  choice: ihr ... seht
  rationale: Der Aorist Konjunktiv von ὁράω wird im deutschen Temporalsatz natürlich mit dem Präsens wiedergegeben.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: den Gräuel der Verwüstung
  rationale: Die quellnahe, in Daniel verankerte Wendung bewahrt ihren apokalyptischen Anklang und legt weder Gegenstand, Tat noch Person als Referenten fest.
- source_word: ἑστηκότα
  choice: dort stehen
  rationale: Das Partizip von ἵστημι bezeichnet einen bestehenden Zustand; „stehen“ bewahrt das anschauliche Bild, während „dort“ die folgende Ortsangabe idiomatisch anbindet.
- source_word: ὅπου οὐ δεῖ
  choice: wo er nicht stehen darf
  rationale: δεῖ bezeichnet hier das, was sich nicht gehört beziehungsweise nicht sein darf. Das deutsche Pronomen richtet sich grammatisch nach dem maskulinen „Gräuel“; die auffällige Genusabweichung im Griechischen wird in einer Fußnote erläutert.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: wer liest, soll verstehen
  rationale: Die substantivierte Partizipialform wird inklusiv und natürlich mit „wer liest“ wiedergegeben; „soll verstehen“ bewahrt den auffordernden Charakter von νοείτω.
- source_word: τότε
  choice: dann
  rationale: Kennzeichnet die als Folge gebotene Handlung.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: alle, die in Judäa sind
  rationale: Gibt die substantivierte Ortsangabe klar und ohne zusätzliche Bestimmung der betroffenen Personen wieder.
- source_word: φευγέτωσαν
  choice: sollen ... fliehen
  rationale: Die Konstruktion gibt den dringlichen Imperativ der dritten Person im modernen Deutschen natürlich wieder.
- source_word: εἰς τὰ ὄρη
  choice: in die Berge
  rationale: „Berge“ ist die direkte und topografisch passende Wiedergabe von ὄρη; „in“ entspricht der im Deutschen üblichen Zielangabe.
theological_decisions:
- issue: Deutung von βδέλυγμα τῆς ἐρημώσεως
  choice: Die quellnahe Wendung „Gräuel der Verwüstung“ bleibt im Haupttext ohne Festlegung eines historischen Referenten erhalten.
  alternative: „verwüstender Gräuel“ oder „Gräuel, der Verwüstung bringt“
  rationale: Die Daniel-Anspielung kann auf einen entweihenden Gegenstand, eine Tat oder eine Person bezogen werden. Eine erklärende Umschreibung würde diese echte Deutungsoffenheit unnötig einschränken.
- issue: Maskulines ἑστηκότα bei neutralem βδέλυγμα
  choice: Im Haupttext steht wegen des grammatisch maskulinen deutschen Substantivs „Gräuel“ das Pronomen „er“; die auffällige griechische Form wird in einer Fußnote dokumentiert.
  alternative: Eine ausdrücklich unpersönliche Wiedergabe, etwa „wo es nicht stehen darf“
  rationale: Im Griechischen ist βδέλυγμα sächlich, während ἑστηκότα männlich ist; dies kann auf einen persönlichen oder personifizierten Referenten hindeuten. Da „Gräuel“ im Deutschen ohnehin männlich ist, lässt sich die Spannung im Haupttext nicht unverzerrt sichtbar machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parenthese wird durch Gedankenstriche hervorgehoben; der Ausruf unterstreicht die auffordernde Kraft, ohne den Inhalt zu erweitern. Die Formulierung bleibt quellnah, vermeidet konfessionelle Festlegungen und erläutert die im Deutschen nicht abbildbare Genusspannung in der Fußnote.
