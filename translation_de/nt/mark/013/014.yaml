    issue: Das Adverb „dort“ ergänzt den Ausgangstext.
    rationale: ὅπου bedeutet „wo“, ohne ein zusätzliches deiktisches „dort“. Die Ergänzung ist nicht sinnentstellend, aber für eine optimal äquivalente Übersetzung entbehrlich.
  - severity: low
    issue: „wo er nicht stehen darf“ wiederholt „stehen“ interpretierend.
    rationale: ὅπου οὐ δεῖ lautet wörtlich etwa „wo es/er nicht sein darf/sollte“. Die elliptische Aussage sollte nicht unnötig zu „stehen“ ausgebaut werden.
  - severity: low
    issue: „alle, die in Judäa sind“ ist gegenüber dem griechischen Ausdruck leicht expansiv.
    rationale: οἱ ἐν τῇ Ἰουδαίᾳ bezeichnet schlicht „diejenigen in Judäa“; „alle“ ist zwar naheliegend, aber nicht ausdrücklich gesetzt.
  - severity: low
    issue: Die Erklärung der griechischen Genusspannung ist terminologisch ungenau formuliert.
    rationale: Nicht ein eigenständiges „Wort für ‚stehend‘“, sondern das maskuline Partizip ἑστηκότα steht bei dem neutralen βδέλυγμα.
