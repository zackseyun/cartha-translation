  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: de
  text: Himmel und Erde werden vergehen, aber meine Worte werden ganz gewiss nicht vergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Himmel
  rationale: In der festen kosmischen Verbindung mit »Erde« bezeichnet οὐρανός den Himmel als Teil der gesamten Schöpfungsordnung, nicht bloß den sichtbaren Luftraum.
- source_word: ἡ γῆ
  choice: Erde
  rationale: In der Wendung »Himmel und Erde« meint γῆ die Erde beziehungsweise die geschaffene Welt, nicht ein bestimmtes Land.
- source_word: παρελεύσονται
  choice: werden vergehen
  rationale: παρέρχομαι bezeichnet hier das Vergehen beziehungsweise das Zu-Ende-Kommen. »Vergehen« gibt den eschatologischen Sinn knapp und natürlich wieder, ohne die Art dieses Vergehens näher festzulegen.
- source_word: δὲ
  choice: aber
  rationale: δέ stellt die Vergänglichkeit von Himmel und Erde der bleibenden Geltung von Jesu Worten gegenüber; »aber« macht diesen Kontrast deutlich.
- source_word: οἱ λόγοι μου
  choice: meine Worte
  rationale: λόγοι bezeichnet hier Jesu Äußerungen beziehungsweise Aussagen. »Meine Worte« ist direkt, idiomatisch und lässt Singularität oder Umfang der gemeinten Aussagen offen.
- source_word: οὐ μὴ παρελεύσονται
  choice: werden ganz gewiss nicht vergehen
  rationale: Die Verbindung οὐ μή mit dem Futur ist eine nachdrückliche Verneinung. »Ganz gewiss nicht« macht diese Verstärkung in gegenwärtigem Deutsch hörbar, ohne altertümlich zu wirken.
theological_decisions:
- issue: Nachdruck der Verneinung hinsichtlich der Worte Jesu
  choice: »werden ganz gewiss nicht vergehen«
  alternative: »werden niemals vergehen«; »werden keinesfalls vergehen«
  rationale: Die Übersetzung bewahrt den starken Gegensatz zwischen der Vergänglichkeit der geschaffenen Ordnung und der unerschütterlichen Beständigkeit von Jesu Worten. Sie gibt die emphatische griechische Verneinung ausdrücklich wieder, ohne zusätzliche dogmatische Aussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etablierte Paarformel »Himmel und Erde« und das wiederholte Verb »vergehen« bewahren die knappe Parallelstruktur des griechischen Satzes. Die emphatische Negation wird im Haupttext wiedergegeben; daher ist keine Fußnote erforderlich.
