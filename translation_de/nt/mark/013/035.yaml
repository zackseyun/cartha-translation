id: MRK.13.35
reference: Mark 13:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: de
  text: 'Bleibt also wachsam[a], denn ihr wisst nicht, wann der Hausherr kommt: ob am Abend, um Mitternacht, beim Hahnenschrei[b] oder am Morgen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Bleibt wach.“ Der Befehl meint anhaltende Aufmerksamkeit und Bereitschaft.'
    reason: lexical_alternative
  - marker: b
    text: Der „Hahnenschrei“ bezeichnet hier auch die nach dem Krähen des Hahns benannte Nachtwache.
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Bleibt wachsam
  rationale: Der Imperativ fordert anhaltende Wachheit und Bereitschaft. „Bleibt wachsam“ ist im modernen Deutschen natürlich und umfasst sowohl das Wachbleiben als auch das aufmerksame Wachen.
- source_word: οὖν
  choice: also
  rationale: Kennzeichnet die Folgerung aus dem vorangehenden Gleichnis und klingt im Deutschen natürlicher als das förmlichere „daher“.
- source_word: οὐκ οἴδατε
  choice: ihr wisst nicht
  rationale: Gibt die verneinte Aussage des Wissens ohne unnötige Erweiterung direkt wieder.
- source_word: πότε
  choice: wann
  rationale: Natürliche und genaue Wiedergabe der indirekten Zeitfrage.
- source_word: ὁ κύριος τῆς οἰκίας
  choice: der Hausherr
  rationale: Bezeichnet im häuslichen Bild denjenigen, der Autorität über das Haus besitzt. „Hausherr“ ist knapp, verständlich und vermeidet hier eine vorschnelle Wiedergabe als direkten Hoheitstitel.
- source_word: ἔρχεται
  choice: kommt
  rationale: Das griechische Präsens bezeichnet im Kontext die erwartete Ankunft; das deutsche Präsens ist dafür idiomatisch.
- source_word: ὀψὲ
  choice: am Abend
  rationale: Bezeichnet in der Abfolge der Nachtwachen die Abendwache, nicht lediglich einen unbestimmten späten Zeitpunkt.
- source_word: μεσονύκτιον
  choice: um Mitternacht
  rationale: Übliche deutsche Zeitangabe für die zweite genannte Nachtwache.
- source_word: ἀλεκτοροφωνίας
  choice: beim Hahnenschrei
  rationale: Bewahrt das konkrete Bild und bezeichnet zugleich die nach dem Hahnenschrei benannte Nachtwache.
- source_word: πρωΐ
  choice: am Morgen
  rationale: Gibt die letzte Nachtwache beziehungsweise den frühen Morgen wieder, ohne den Zeitpunkt enger als der griechische Ausdruck festzulegen.
theological_decisions:
- issue: Wiedergabe von κύριος in einem häuslichen Bild, das mittelbar auf Jesus bezogen sein kann
  choice: Hausherr
  alternative: Herr des Hauses
  rationale: Im unmittelbaren Satz bezeichnet der Ausdruck die Autoritätsperson innerhalb des Hausbildes. „Hausherr“ wahrt diesen natürlichen Sinn, ohne die weitergehende christologische Anwendung des Gleichnisses auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vier Zeitangaben bleiben als Abfolge der Nachtwachen erkennbar; „Hausherr“ hält das häusliche Bild klar und idiomatisch.
