  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: de
  text: 'Amen, ich sage euch: Diese Generation wird ganz gewiss nicht vergehen, bis dies alles geschieht.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dieses Volk“ oder „dieses Geschlecht“; das griechische Wort γενεά kann weitere Bedeutungen haben, doch „Generation“ ist hier die naheliegendste Wiedergabe.'
    reason: lexical_alternative
  - marker: b
    text: „Wird ganz gewiss nicht vergehen“ gibt eine nachdrückliche Verneinung im Griechischen wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Das im Deutschen geläufige „Amen“ bewahrt die feierliche, autoritative Einleitungsformel Jesu und bleibt der markanten griechischen Wendung nahe.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte Anrede wird formal nah und zugleich natürlich wiedergegeben.
- source_word: οὐ μὴ παρέλθῃ
  choice: wird ganz gewiss nicht vergehen
  rationale: Die Verbindung οὐ μή mit dem Aorist Konjunktiv ist eine nachdrückliche Verneinung; „ganz gewiss nicht“ macht diese Verstärkung in heutigem Deutsch deutlich.
- source_word: ἡ γενεὰ αὕτη
  choice: diese Generation
  rationale: „Generation“ ist im zeitlichen und diskursiven Zusammenhang die naheliegendste Bedeutung und wahrt die Auslegungsspannung des Ausdrucks.
- source_word: μέχρις οὗ
  choice: bis
  rationale: Die Wendung bezeichnet eine zeitliche Grenze und wird knapp und idiomatisch mit „bis“ wiedergegeben.
- source_word: ταῦτα πάντα
  choice: dies alles
  rationale: Die natürliche deutsche Sammelformulierung gibt den Rückbezug auf sämtliche genannten Ereignisse präzise wieder.
- source_word: γένηται
  choice: geschehen ist
  rationale: γίνομαι bezeichnet hier das Eintreten der angekündigten Ereignisse; im durch „bis“ eingeleiteten Nebensatz ist das Perfekt im Deutschen idiomatisch.
theological_decisions:
- issue: Bedeutung von ἡ γενεὰ αὕτη in der endzeitlichen Rede
  choice: diese Generation
  alternative: dieses Volk / dieses Geschlecht; eine künftige Generation, die den Beginn der Zeichen erlebt
  rationale: Der griechische Ausdruck bezeichnet am natürlichsten „diese Generation“. Die Übersetzung legt keine bestimmte endzeitliche Deutung fest, sondern bewahrt die Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Amen“ erhält die charakteristische feierliche Einleitungsformel; „ganz gewiss nicht“ vermittelt die emphatische Verneinung verständlich. Die umstrittene Referenz von „diese Generation“ bleibt bewusst unausgelegt.
