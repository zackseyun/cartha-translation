  source_fidelity: Der Haupttext gibt ὑμεῖς δέ, βλέπετε sowie προείρηκα ὑμῖν πάντα insgesamt treffend wieder. Die explizite Gegenüberstellung in „Ihr aber“ und die Warnfunktion von „Seid auf der Hut“ sind angemessen. Die alternative Fußnote „Ich habe euch alles vorhergesagt“ verschiebt jedoch das Verb in Richtung einer Vorhersage; προείρηκα bedeutet primär „im Voraus gesagt/mitgeteilt“ und kann im Kontext auch den Sinn des Vorwarnens tragen.
  naturalness: „Ihr aber, seid auf der Hut!“ enthält eine unangebrachte Trennung von Subjekt und Prädikat durch ein Komma. Ein Doppelpunkt nach der hervorgehobenen Anrede bzw. Gegenüberstellung ist im Deutschen klar und idiomatisch.
  terminology: „Seid auf der Hut“ ist eine natürliche, würdige Wiedergabe des warnenden Imperativs βλέπετε. „Alles im Voraus gesagt“ bewahrt die Weite von πάντα und die Voraus-Mitteilung von προείρηκα, ohne den Umfang dogmatisch einzuengen.
