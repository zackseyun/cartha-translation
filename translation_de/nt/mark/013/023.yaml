base_translation:
  language: en
  yaml_path: translation/nt/mark/013/023.yaml
  text: But you[a], watch out[b]; I have told you all things beforehand.
translation:
  language: de
  text: 'Ihr aber: Seid auf der Hut[a]! Ich habe euch alles im Voraus gesagt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Passt auf!; oder: Seht euch vor!'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Ich habe euch alles vorher mitgeteilt; oder: Ich habe euch vor allem gewarnt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: ihr
  rationale: Das ausdrücklich gesetzte Personalpronomen trägt einen kontrastiven Nachdruck; „ihr aber“ bewahrt diesen gegenüber dem vorher Gesagten.
- source_word: δὲ
  choice: aber
  rationale: Die Partikel markiert hier einen Kontrast beziehungsweise eine warnende Weiterführung.
- source_word: βλέπετε
  choice: seid auf der Hut
  rationale: Der präsentische Imperativ bezeichnet in diesem Zusammenhang anhaltende Wachsamkeit, nicht bloß körperliches Sehen.
- source_word: προείρηκα
  choice: habe … im Voraus gesagt
  rationale: Die Form bezeichnet ein vorausgehendes Sagen mit fortdauernder Bedeutung; die Wendung gibt sowohl den zeitlichen Vorgriff als auch den gegenwärtigen Bezug wieder.
- source_word: ὑμῖν
  choice: euch
  rationale: Der Dativ bezeichnet die Empfänger der vorausgehenden Mitteilung.
- source_word: πάντα
  choice: alles
  rationale: „Alles“ ist die natürliche deutsche Entsprechung des substantivisch gebrauchten Neutrums und lässt den kontextuellen Umfang offen.
theological_decisions:
- issue: Reichweite der vorherigen Mitteilung Jesu
  choice: „alles“ bleibt ohne erläuternde Einschränkung im Haupttext stehen.
  alternative: „alles Nötige“ oder „das alles“ als ausdrückliche Begrenzung auf die unmittelbar genannten Warnungen.
  rationale: Der griechische Text sagt πάντα. Der Zusammenhang legt die relevanten Warnungen nahe, doch die Übersetzung soll den Umfang nicht enger bestimmen, als es der Ausgangstext tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seid auf der Hut“ vermittelt die dringliche, fortdauernde Warnung idiomatisch; „im Voraus gesagt“ wahrt die sachliche Breite des griechischen Verbs.
