  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: de
  text: damit er euch nicht, wenn er plötzlich kommt, schlafend findet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ
  choice: damit … nicht
  rationale: Gibt im Deutschen natürlich den verneinten Zweck beziehungsweise die Warnung im Zusammenhang wieder.
- source_word: ἐλθὼν ἐξαίφνης
  choice: wenn er plötzlich kommt
  rationale: Bewahrt sowohl das Kommen als auch dessen unvermittelten Charakter; der griechische Partizipialsatz wird idiomatisch als temporaler Nebensatz wiedergegeben.
- source_word: εὕρῃ ὑμᾶς καθεύδοντας
  choice: euch … schlafend findet
  rationale: Folgt der Bildsprache und Satzstruktur eng; »schlafend« bleibt bewusst wörtlich und wird nicht deutend durch »unvorbereitet« ersetzt.
theological_decisions:
- issue: Wörtlicher oder metaphorischer Sinn von καθεύδοντας
  choice: schlafend
  alternative: unwachsam / unvorbereitet
  rationale: Der Ausgangstext verwendet das konkrete Bild des Schlafens. Die mögliche übertragene Bedeutung wird nicht in den Haupttext hineinerklärt.
- issue: Bezug des unausgesprochenen Subjekts
  choice: er
  alternative: der Hausherr / der Menschensohn
  rationale: Der Vers selbst setzt lediglich ein männliches Subjekt aus dem Kontext voraus; die Übersetzung benennt es nicht genauer und bewahrt damit den Textbezug ohne zusätzliche Identifikation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wortstellung hält den warnenden Nachdruck auf dem unerwarteten Kommen und dem möglichen Schlafen der Angesprochenen.
