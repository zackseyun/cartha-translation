source:
  edition: SBLGNT
  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: de
  text: Und wer auf dem Feld ist, soll nicht umkehren, um seinen Mantel[a] zu holen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sein Obergewand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: wer auf dem Feld ist
  rationale: Die substantivierte Konstruktion bezeichnet allgemein die Person, die sich auf dem Feld befindet. Die deutsche Formulierung ist natürlich und bewahrt den generischen Singular.
- source_word: ἀγρός
  choice: Feld
  rationale: ἀγρός bezeichnet hier ein Feld beziehungsweise landwirtschaftlich genutztes Gelände; „Feld“ ist im Fluchtkontext die unmittelbarste Wiedergabe.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: soll nicht umkehren
  rationale: Der Aoristimperativ mit μή drückt ein dringendes Verbot aus. „Soll nicht umkehren“ gibt dies in würdigem, heutigem Deutsch wieder; die Rückwärtsrichtung des Idioms εἰς τὰ ὀπίσω ist in „umkehren“ enthalten.
- source_word: ἆραι
  choice: zu holen
  rationale: Der Infinitiv bezeichnet den Zweck des Umkehrens. Im Zusammenhang mit einem zurückgelassenen Kleidungsstück ist „holen“ natürlicher als das wörtlichere „aufzuheben“ oder das allgemeinere „zu nehmen“.
- source_word: ἱμάτιον
  choice: Mantel
  rationale: ἱμάτιον bezeichnet hier das äußere Kleidungsstück. „Mantel“ ist knapp, verständlich und kontextgerecht; die allgemeinere Alternative wird in der Fußnote genannt.
- source_word: αὐτοῦ
  choice: seinen
  rationale: Das maskuline Singularpronomen stimmt mit der generisch gebrauchten singularischen Personenbezeichnung überein. „Seinen“ bewahrt diese Form, ohne die Aussage ausdrücklich auf Männer zu beschränken.
theological_decisions:
- issue: Generisches Maskulinum im Singular
  choice: Singularische allgemeine Formulierung „wer … seinen Mantel“ beibehalten
  alternative: Pluralisieren („wer auf den Feldern ist … ihre Mäntel“) oder neutralisieren („die betreffende Person … den eigenen Mantel“)
  rationale: Der griechische Text verwendet eine maskuline substantivierte Singularform und ein dazugehöriges maskulines Pronomen. Die gewählte deutsche Konstruktion bewahrt den generischen Singular und vermeidet eine unnötige Festlegung auf ausschließlich männliche Personen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. „Wer auf dem Feld ist“ klingt natürlicher als die formal engere Konstruktion „der auf dem Feld“. Das dringende Verbot bleibt durch „soll nicht umkehren“ deutlich.
