source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: de
  text: Und ihr werdet von allen gehasst werden wegen meines Namens.[a] Wer aber bis zum Ende standhält,[b] wird gerettet werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um meines Namens willen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ausharrt“ beziehungsweise „bis zum Ende treu bleibt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wird aus Gefahr gerettet werden“. Das griechische Wort kann Rettung aus Gefahr oder Heil im umfassenderen Sinn bezeichnen; der Zusammenhang lässt den vollen Bedeutungsumfang offen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι
  choice: gehasst werden
  rationale: Das Partizip bildet mit ἔσεσθε eine umschriebene Zukunftsform; die natürliche deutsche Wiedergabe lautet „werdet … gehasst werden“.
- source_word: ὑπὸ πάντων
  choice: von allen
  rationale: Die uneingeschränkte Formulierung bewahrt die zugespitzte Allgemeinheit des griechischen Textes, ohne sie erklärend abzuschwächen.
- source_word: διὰ τὸ ὄνομά μου
  choice: wegen meines Namens
  rationale: διά mit Akkusativ bezeichnet hier den Grund. „Name“ bleibt erhalten und kann im biblischen Sinn Jesu Person, Autorität und die Zugehörigkeit zu ihm einschließen.
- source_word: ὁ δὲ ὑπομείνας
  choice: Wer aber … standhält
  rationale: Das substantivierte Aoristpartizip bezeichnet denjenigen, der unter Belastung ausharrt. „standhält“ ist gegenwärtig, verständlich und vermeidet eine unnötig fachtheologische Festlegung.
- source_word: εἰς τέλος
  choice: bis zum Ende
  rationale: Die Formulierung bezeichnet das Durchhalten bis zu einem Endpunkt, ohne festzulegen, ob das Ende der Bedrängnis, des Lebens oder das endzeitliche Ende gemeint ist.
- source_word: οὗτος
  choice: durch die deutsche Wer-Konstruktion ausgedrückt
  rationale: Das resumptive und hervorhebende Pronomen wird nicht mit dem im Deutschen schwerfälligen „dieser“ wiederholt; die Konstruktion „Wer …, wird …“ gibt den Bezug natürlich und eindeutig wieder.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Die Wendung bewahrt sowohl den Gedanken der Rettung aus Gefahr als auch die umfassendere heilsgeschichtliche Bedeutung, ohne den Kontext vorschnell auf nur eine Nuance festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von σωθήσεται im Zusammenhang mit dem Standhalten
  choice: wird gerettet werden
  alternative: wird Heil erlangen
  rationale: „Gerettet werden“ lässt offen, ob konkrete Bewahrung, endgültige Rettung oder beides im Blick ist, und bewahrt so die theologische Spannung des griechischen Ausdrucks.
- issue: Reichweite von πάντων
  choice: von allen
  alternative: von allen Menschen
  rationale: Die knappe, umfassende Aussage des Textes bleibt stehen, ohne sie als mathematisch ausnahmslose Behauptung zu erläutern oder abzuschwächen.
- issue: Verhältnis von Standhalten und Rettung
  choice: konditional klingende Aussage unverändert wiedergegeben
  alternative: erklärende Einordnung als Beweis oder Ursache der Rettung
  rationale: Der Text verbindet Standhalten bis zum Ende mit Rettung, erklärt aber an dieser Stelle nicht näher, ob und in welchem Sinn das Standhalten Ursache, Kennzeichen oder Weg der Rettung ist. Die Übersetzung löst diese Spannung nicht konfessionell auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte und zugespitzte Aussage bleibt erhalten; die griechische resumptive Konstruktion mit οὗτος wird zugunsten einer natürlichen deutschen Wer-Konstruktion geglättet. Sämtliche Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
