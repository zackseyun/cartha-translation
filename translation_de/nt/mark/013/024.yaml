  terminology: „Bedrängnis“ ist eine sachgerechte, nicht konfessionell festgelegte Wiedergabe von θλῖψις. Die Fußnote bietet mit „Not“ und „Drangsal“ sinnvolle lexikalische Alternativen, ohne die Auslegung der endzeitlichen Aussage festzulegen. Die Begriffe für Sonne, Mond, Verfinsterung und Licht sind präzise und konsistent.
