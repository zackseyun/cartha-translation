source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: de
  text: Doch in jenen Tagen, nach jener Bedrängnis[a], wird die Sonne verfinstert werden, und der Mond wird sein Licht nicht geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach jener Not“ oder „nach jener Drangsal“.'
    reason: Lexikalische Alternativen für θλῖψις; der Ausdruck kann Bedrängnis, Not oder Drangsal bezeichnen.
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Doch
  rationale: Kennzeichnet den deutlichen Gegensatz beziehungsweise Übergang zum Vorhergehenden und klingt im modernen Deutschen natürlich und würdig.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: in jenen Tagen
  rationale: Bewahrt die griechische Zeitangabe und ihren eschatologischen Klang ohne unnötige Erweiterung.
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: nach jener Bedrängnis
  rationale: μετά mit Akkusativ bezeichnet hier die zeitliche Folge. „Bedrängnis“ gibt die Schwere von θλῖψις wieder, bleibt zugleich verständlich und legt kein bestimmtes endzeitliches Schema fest.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: die Sonne wird verfinstert werden
  rationale: Gibt Zukunft und Passiv des griechischen Verbs genau wieder und erhält die feierliche Bildsprache.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: der Mond wird sein Licht nicht geben
  rationale: Bewahrt die anschauliche Formulierung mit δίδωμι („geben“); „sein Licht“ ist die natürliche deutsche Wiedergabe von τὸ φέγγος αὐτῆς.
theological_decisions:
- issue: Wiedergabe von θλῖψις in der apokalyptischen Rede
  choice: Bedrängnis
  alternative: Drangsal; Not; Bedrückung
  rationale: „Bedrängnis“ wahrt das Gewicht und die apokalyptische Spannung des Ausdrucks, ist aber im heutigen Standarddeutsch verständlicher und weniger traditionssprachlich als „Drangsal“. Die Übersetzung bestimmt weder Art noch genaue endzeitliche Einordnung des Geschehens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Orientierung an Satzbau und Bildsprache des griechischen Textes. Das Futurpassiv wird ausdrücklich erhalten; die Wiederholung von „jener“ spiegelt die demonstrative Hervorhebung des Originals.
