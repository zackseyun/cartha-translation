  source_fidelity: 'Die Übersetzung gibt sämtliche Elemente des griechischen Satzes zuverlässig wieder: Ἀλλά als kontrastierendes „Doch“, die Zeitangabe „in jenen Tagen“, die zeitliche Abfolge nach der συγκεκριμένη θλῖψις sowie die beiden zukünftigen kosmischen Aussagen. Das Futurpassiv von σκοτισθήσεται ist mit „wird ... verfinstert werden“ korrekt erhalten. „sein Licht nicht geben“ bildet δίδωμι und die personifizierte Bildsprache des Originals eng ab.'
