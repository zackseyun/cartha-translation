  source_fidelity: 'Die Ortsangabe, die vier Namen und die Satzverknüpfung geben den griechischen Text zuverlässig wieder. „Fragten“ ist für das Imperfekt ἐπηρώτα im deutschen Erzählstil vertretbar, auch wenn der griechische Aspekt einen Verlauf andeuten kann. Die Wendung κατ’ ἰδίαν verlangt jedoch eine Korrektur: Sie bezeichnet ein Gespräch abseits von anderen, nicht ein Gespräch zwischen genau zwei Personen.'
