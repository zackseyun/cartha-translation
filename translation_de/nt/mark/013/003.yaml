  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ καθημένου αὐτοῦ εἰς τὸ Ὄρος τῶν Ἐλαιῶν κατέναντι τοῦ ἱεροῦ ⸀ἐπηρώτα αὐτὸν κατ’ ἰδίαν Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/003.yaml
  text: And as he was sitting on the Mount of Olives opposite the temple, Peter and James and John and Andrew were asking him privately,
translation:
  language: de
  text: 'Als er auf dem Ölberg saß, dem Tempel[a] gegenüber, fragten ihn Petrus, Jakobus, Johannes und Andreas für sich allein:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ἱερόν bezeichnet den gesamten Tempelbezirk, nicht speziell das innere Heiligtum (ναός).
    reason: lexical_alternative
lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: Als er … saß
  rationale: Der Genitivus absolutus mit präsentischem Partizip beschreibt die begleitende Situation. Das deutsche Präteritum ist in erzählender Prosa natürlich, ohne den durativen Charakter des Sitzens aufzugeben.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: auf dem Ölberg
  rationale: Bei einem Verb des Sich-Befindens bezeichnet εἰς hier idiomatisch den Ort. „Ölberg“ ist die etablierte deutsche geografische Bezeichnung.
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: dem Tempel gegenüber
  rationale: κατέναντι bezeichnet die Lage gegenüber bzw. mit Blick auf etwas. „Tempel“ ist im Deutschen die klare, übliche Wiedergabe; die genauere Bedeutung von ἱερόν wird in der Fußnote erläutert.
- source_word: ἐπηρώτα
  choice: fragten
  rationale: Das Imperfekt stellt das Fragen als einsetzenden bzw. im Verlauf befindlichen Vorgang dar. Im natürlichen deutschen Erzählstil gibt „fragten“ diesen Vorgang passend wieder; ein schwerfälliges „waren dabei, ihn zu fragen“ ist nicht erforderlich.
- source_word: κατ’ ἰδίαν
  choice: unter vier Augen
  rationale: Die Wendung bedeutet, dass die vier genannten Jünger Jesus abseits von den anderen befragten. „Unter vier Augen“ wird im modernen Deutschen auch für ein vertrauliches Gespräch in einer kleinen, abgeschlossenen Gruppe gebraucht und klingt hier natürlich.
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: Petrus, Jakobus, Johannes und Andreas
  rationale: Die Namen folgen ihren etablierten deutschen biblischen Formen. Eine normale deutsche Aufzählung ist verständlicher und würdevoller als die mechanische Wiederholung von „und“.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Satzstellung hält zunächst die räumliche Szene fest und nennt danach die vier Fragenden. Der abschließende Doppelpunkt zeigt an, dass ihre Frage im folgenden Vers wiedergegeben wird.
