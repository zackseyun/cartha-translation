source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: de
  text: Wenn ihr aber von Kriegen und Berichten über Kriege[a] hört, geratet nicht in Schrecken; das muss geschehen, aber das Ende ist noch nicht da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerüchten über Kriege“. Das griechische Wort kann Nachrichten, Berichte oder auch Gerüchte bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Wenn ihr aber
  rationale: ὅταν bezeichnet hier eine zukünftige zeitliche Eventualität; δέ stellt eine milde Weiterführung beziehungsweise Gegenüberstellung her. „Wenn ihr aber“ ist natürlich und bewahrt beides.
- source_word: ἀκούσητε
  choice: hört
  rationale: Der Aorist Konjunktiv nach ὅταν wird in der zukunftsbezogenen deutschen Bedingungs- und Zeitkonstruktion idiomatisch mit Präsens wiedergegeben.
- source_word: πολέμους καὶ ἀκοὰς πολέμων
  choice: von Kriegen und Kriegsnachrichten
  rationale: πόλεμοι sind „Kriege“. ἀκοαί bezeichnet Gehörtes, Nachrichten oder Berichte; „Kriegsnachrichten“ gibt den Ausdruck knapp wieder, ohne zwingend unbestätigte Gerüchte anzunehmen.
- source_word: μὴ θροεῖσθε
  choice: erschreckt nicht
  rationale: θροέομαι bezeichnet Beunruhigung, Bestürzung oder Alarmiertsein. „Erschreckt nicht“ ist klar, gegenwärtig und bewahrt die warnende Kraft.
- source_word: δεῖ γενέσθαι
  choice: Das muss geschehen
  rationale: δεῖ drückt Notwendigkeit aus, γενέσθαι ein Eintreten oder Geschehen. Das demonstrative „Das“ greift den zuvor genannten Sachverhalt auf, ohne ihn weiter auszudeuten.
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: aber das Ende ist noch nicht da
  rationale: Die Wiedergabe bewahrt das eschatologisch offene „Ende“ und gibt οὔπω idiomatisch als „noch nicht da“ wieder.
theological_decisions:
- issue: Eschatologische Notwendigkeit in δεῖ γενέσθαι
  choice: „muss geschehen“
  alternative: „wird geschehen“ oder „ist notwendig“
  rationale: „Muss“ bewahrt die im Griechischen ausgesagte Notwendigkeit, ohne deren göttlichen, prophetischen oder geschichtlichen Mechanismus näher festzulegen.
- issue: Referenz von τὸ τέλος
  choice: „das Ende“ ohne nähere Bestimmung
  alternative: „das Ende der Welt“ oder „das Endgericht“
  rationale: Der Vers selbst konkretisiert τὸ τέλος nicht. Die offene Formulierung verhindert, dass ein bestimmtes Endzeitschema in den Text eingetragen wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzführung. „Kriegsnachrichten“ vermeidet das altertümlich wirkende „Kriegsgeschrei“ und hält die Bedeutungsbreite durch die Fußnote offen.
