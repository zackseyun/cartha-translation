id: MRK.13.28
reference: Mark 13:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: de
  text: 'Lernt vom Feigenbaum das Gleichnis[a]: Wenn sein Zweig schon zart geworden ist und Blätter treibt, erkennt ihr, dass der Sommer nahe ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Lehre“, „das Bildwort“ oder „den Vergleich“.'
    reason: Lexikalische Alternativen für παραβολή in diesem bildhaften Lehrsatz.
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: vom Feigenbaum
  rationale: ἀπό mit Genitiv bezeichnet hier die Quelle, von der gelernt wird. Das leicht weiterführende δέ benötigt im natürlichen Deutschen kein eigenes Wort.
- source_word: μάθετε
  choice: Lernt
  rationale: Der Aoristimperativ von μανθάνω fordert dazu auf, eine Lehre aufzunehmen; „Lernt“ gibt dies direkt und verständlich wieder.
- source_word: τὴν παραβολήν
  choice: das Gleichnis
  rationale: παραβολή bezeichnet hier einen bildhaften Vergleich, aus dem eine Lehre gezogen wird. „Gleichnis“ bewahrt den etablierten Begriff und die sprachliche Verbindung zu Jesu sonstiger Lehrweise.
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: sein Zweig schon zart geworden ist
  rationale: ἤδη wird mit „schon“ wiedergegeben; ἁπαλός beschreibt den weichen, zarten Zustand jungen Wachstums. Die Formulierung „geworden ist“ bezeichnet den erreichten Zustand.
- source_word: ἐκφύῃ τὰ φύλλα
  choice: Blätter treibt
  rationale: ἐκφύω meint das Hervorsprießen oder Hervorbringen. „Blätter treiben“ ist dafür im heutigen Deutschen die natürliche botanische Wendung.
- source_word: γινώσκετε
  choice: erkennt ihr
  rationale: Im Zusammenhang beschreibt die Form, was die Angesprochenen am sichtbaren Zeichen erkennen. „Erkennt ihr“ vermittelt sowohl Wahrnehmung als auch daraus gewonnenes Wissen.
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: dass der Sommer nahe ist
  rationale: θέρος bezeichnet hier im jahreszeitlichen Bild des Feigenbaums den Sommer; ἐγγύς drückt zeitliche Nähe aus.
theological_decisions:
- issue: Bedeutung von παραβολή in diesem Zusammenhang
  choice: Im Haupttext steht „Gleichnis“.
  alternative: „Lehre“, „Bildwort“ oder „Vergleich“
  rationale: Der Ausdruck bezeichnet hier eine anschauliche Lehre anhand des Feigenbaums. „Gleichnis“ erhält die für die Evangelien wichtige Wortverbindung, ohne dem Bild zusätzliche allegorische Einzeldeutungen aufzuerlegen.
- issue: Aussage oder Aufforderung bei γινώσκετε
  choice: 'Als Aussage wiedergegeben: „erkennt ihr“.'
  alternative: 'Als Aufforderung: „so erkennt“ beziehungsweise „so wisst“'
  rationale: Die griechische Form kann morphologisch Indikativ oder Imperativ sein. Der allgemeine Erfahrungssatz nach dem Wenn-Satz spricht hier für die Aussage; die alternative Auffassung verändert den grundlegenden Sinn des Bildes nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung bleibt natürlich; das schwach weiterführende δέ wird nicht durch ein missverständlich zeitliches „nun“ überzeichnet.
