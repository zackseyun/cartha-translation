  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: de
  text: Und dann wird er die Engel aussenden und die Auserwählten aus den vier Winden[a] sammeln, vom Ende der Erde bis zum Ende des Himmels.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die vier Winde“ ist eine bildhafte Wendung für alle Richtungen.
    reason: cultural_note
  - marker: b
    text: 'Die Schlusswendung kann auch verdeutlichend übersetzt werden: „vom äußersten Ende der Erde bis zum äußersten Ende des Himmels“.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: dann
  rationale: Das temporale Adverb kennzeichnet die Abfolge im endzeitlichen Geschehen; „dann“ ist im Deutschen natürlich und präzise.
- source_word: ἀποστελεῖ
  choice: wird er ... aussenden
  rationale: Das Futur von ἀποστέλλω bezeichnet hier die Entsendung beauftragter Wesen; „aussenden“ gibt diesen Sinn knapp und idiomatisch wieder.
- source_word: ἀγγέλους
  choice: die Engel
  rationale: Im apokalyptischen Kontext sind himmlische Wesen gemeint, nicht menschliche Boten.
- source_word: ἐπισυνάξει
  choice: sammeln
  rationale: „Sammeln“ gibt ἐπισυνάγω natürlich wieder; ein zusätzliches „zusammen“ wäre im Deutschen nicht nötig.
- source_word: ἐκλεκτούς
  choice: die Auserwählten
  rationale: Das substantivierte Adjektiv bezeichnet die von Gott Erwählten. „Die Auserwählten“ ist im Deutschen verständlich und bewahrt den theologischen Gehalt, ohne eine weitergehende Lehrbestimmung einzutragen.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: aus den vier Windrichtungen
  rationale: Die Formulierung bewahrt das Windmotiv und macht zugleich die idiomatische Bedeutung – aus allen Richtungen – im heutigen Deutsch verständlich.
- source_word: ἀπ’ ἄκρου γῆς
  choice: vom Ende der Erde
  rationale: Die Wendung gibt den äußersten Rand beziehungsweise fernsten Punkt wieder und hält die räumliche Bildsprache des Griechischen fest.
- source_word: ἕως ἄκρου οὐρανοῦ
  choice: bis zum Ende des Himmels
  rationale: Die parallele Formulierung erhält den Merismus und die kosmische Spannweite; „Himmel“ lässt dabei die im Kontext mögliche Bedeutungsweite gegenüber dem engeren „Himmelsgewölbe“ bestehen.
- source_word: καὶ τότε ... καὶ
  choice: Und dann ... und
  rationale: Die beiden Verknüpfungen werden beibehalten, um Markus’ fortlaufenden Erzählstil und die Koordination der Handlungen abzubilden.
theological_decisions:
- issue: Wiedergabe von ἐκλεκτούς im endzeitlichen Zusammenhang
  choice: die Auserwählten
  alternative: die Erwählten
  rationale: „Die Auserwählten“ bezeichnet die von Gott Ausgewählten, ohne den Vers auf ein späteres konfessionelles Lehrsystem festzulegen. Das im Griechischen fehlende Possessivpronomen wird nicht ergänzt.
- issue: Reichweite des Sammlungsbildes
  choice: aus den vier Windrichtungen, vom Ende der Erde bis zum Ende des Himmels
  alternative: aus allen Himmelsrichtungen, von einem Ende der Erde bis zum anderen
  rationale: Die Übersetzung wahrt sowohl das Richtungsidiom als auch den ungewöhnlichen Merismus von Erde und Himmel, statt die Spannung durch eine traditionelle Paraphrase einzuebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung „Und dann“ bewahrt den markinischen Erzählfluss. „Windrichtungen“ vermittelt das antike Idiom verständlich, während die Fußnote den wörtlichen Bildlaut dokumentiert. Die ungewöhnliche räumliche Spannung zwischen Erde und Himmel bleibt erhalten.
