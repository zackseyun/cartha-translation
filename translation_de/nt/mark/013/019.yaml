source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: de
  text: Denn in jenen Tagen wird eine Bedrängnis sein, wie es sie seit dem Anfang der Schöpfung, die Gott geschaffen hat, bis jetzt noch nie gegeben hat und auch nie mehr geben wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch verdichtet: „Denn jene Tage werden Bedrängnis sein, wie es eine solche seit dem Anfang der Schöpfung, die Gott geschaffen hat, bis jetzt nicht gegeben hat und nie geben wird.“'
    reason: Die Fußnote macht die im Griechischen prädikativ und vergleichend verdichtete Formulierung sichtbar, während der Haupttext sie in idiomatisches modernes Deutsch überträgt.
lexical_decisions:
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: „Bedrängnis“ bezeichnet verständlich und würdig eine schwere, außergewöhnliche Notlage und bewahrt im endzeitlichen Zusammenhang die apokalyptische Tragweite, ohne unnötig fachsprachlich zu wirken.
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: wie es sie … nicht gegeben hat
  rationale: Die deutsche Vergleichsformel gibt die Einzigartigkeit der Bedrängnis natürlich wieder und bildet die inhaltliche Verstärkung der griechischen Wendung ab.
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: seit dem Anfang der Schöpfung
  rationale: „Seit“ passt im Deutschen idiomatisch zum bis in die Gegenwart reichenden Zeitraum; „Schöpfung“ bewahrt den ausdrücklichen Bezug auf κτίσις.
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: die Gott geschaffen hat
  rationale: Der Relativsatz wird trotz seiner im Deutschen leicht pleonastischen Wirkung ausdrücklich erhalten und nennt Gott wie der Ausgangstext als Schöpfer.
- source_word: ἕως τοῦ νῦν
  choice: bis jetzt
  rationale: Die Wendung gibt die zeitliche Grenze knapp und unmittelbar wieder.
- source_word: οὐ μὴ γένηται
  choice: auch nie mehr geben wird
  rationale: „Nie mehr“ bringt die nachdrückliche zukünftige Verneinung von οὐ μή zum Ausdruck. „Geben wird“ nimmt die vorherige deutsche Existenzformel wieder auf, ohne ein zusätzliches Ereignisverb einzuführen.
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: jene Tage werden eine Bedrängnis sein
  rationale: 'Die prädikative, im Griechischen verdichtete Aussage bleibt formal erkennbar: Die Tage selbst werden als Zeit der Bedrängnis bezeichnet.'
theological_decisions:
- issue: Reichweite der Schöpfungsaussage
  choice: „seit dem Anfang der Schöpfung, die Gott geschaffen hat“
  alternative: „seit Anfang der Welt“
  rationale: Die Übersetzung erhält sowohl κτίσις als auch den anschließenden Relativsatz mit Gott als handelndem Schöpfer. Sie verengt die Aussage weder auf einen lokalen noch auf einen ausschließlich bundestheologischen Anfang.
- issue: Absolute Einzigartigkeit der Bedrängnis
  choice: 'Vergangenheit und Zukunft werden ausdrücklich umfasst: „nicht gegeben hat … und auch nie mehr geben wird“'
  alternative: Die Aussage als bloß rhetorischen Vergleich oder als Wiederholung ähnlicher Notzeiten abschwächen
  rationale: Die starke Vergleichsformel und die emphatische Verneinung werden ohne Festlegung auf ein bestimmtes endzeitliches System wiedergegeben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Jene Tage“ hält die textliche Rückverweisung fest; „Bedrängnis“ ist gravierend, aber weniger kirchlich-fachsprachlich als „Drangsal“. Der Relativsatz zur Schöpfung wurde bewusst nicht geglättet oder ausgelassen.
