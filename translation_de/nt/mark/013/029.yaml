id: MRK.13.29
reference: Mark 13:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: de
  text: 'So auch ihr: Wenn ihr seht, dass diese Dinge geschehen, dann erkennt, dass es[a] nahe ist – unmittelbar vor der Tür.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er ist nahe“. Im Griechischen wird das Subjekt nicht ausdrücklich genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: So auch ihr
  rationale: οὕτως stellt den Bezug zum vorausgehenden Feigenbaumvergleich her; καὶ ὑμεῖς hebt die Jünger als entsprechende Beobachter hervor. „So auch ihr“ bewahrt beides knapp und natürlich.
- source_word: ὅταν ἴδητε
  choice: wenn ihr seht
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier einen zukünftigen Fall. Das deutsche „wenn“ gibt dies idiomatisch wieder.
- source_word: ταῦτα γινόμενα
  choice: dass diese Dinge geschehen
  rationale: Der Plural ταῦτα bleibt als „diese Dinge“ erhalten; γινόμενα bezeichnet ihr Eintreten beziehungsweise Geschehen.
- source_word: γινώσκετε
  choice: dann erkennt
  rationale: Der Imperativ fordert dazu auf, aus dem Wahrgenommenen die entsprechende Schlussfolgerung zu ziehen. „Erkennt“ bringt diese folgernde Bedeutung deutlicher zum Ausdruck als ein bloßes „wisst“.
- source_word: ὅτι ἐγγύς ἐστιν
  choice: dass es nahe ist
  rationale: Im Griechischen ist das Subjekt von ἐστιν nicht ausdrücklich genannt. Das unpersönliche „es“ lässt den Bezug bewusst offen, statt vorschnell den Menschensohn oder ein bestimmtes endzeitliches Ereignis einzusetzen.
- source_word: ἐπὶ θύραις
  choice: unmittelbar vor der Tür
  rationale: Die griechische Wendung mit dem Plural θύραις ist eine Nahheitsformel. Im heutigen Deutschen ist „vor der Tür“ die natürliche entsprechende Redewendung; „unmittelbar“ verdeutlicht die starke räumliche Metapher.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐστιν („ist nahe“)
  choice: Im Haupttext unpersönlich mit „es ist nahe“ wiedergeben.
  alternative: „er ist nahe“
  rationale: Der griechische Text nennt kein Subjekt. „Es“ kann auf das bevorstehende Geschehen beziehungsweise die angekündigte Vollendung weisen, ohne den Bezug festzulegen. Da „er“ als Bezug auf den Menschensohn grammatisch und kontextuell möglich ist, wird diese Lesart in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt und „dann“ machen die Folgerungsstruktur klar; der Gedankenstrich bewahrt den bildhaften Nachdruck der abschließenden Nahheitsformel.
