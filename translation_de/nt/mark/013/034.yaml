reference: Mark 13:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: de
  text: Es ist wie bei einem Mann, der verreist ist, sein Haus verlassen und seinen Sklaven[a] Vollmacht gegeben hat, jedem seine Aufgabe, und dem Türhüter befohlen hat, wach zu bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dienern“. Das griechische Wort bezeichnet hier unfreie Hausangehörige unter der Autorität ihres Herrn.'
    reason: Die geläufigere deutsche Alternative wird genannt, während die soziale Bedeutung des griechischen Ausdrucks transparent bleibt.
lexical_decisions:
- source_word: ὡς
  choice: Es ist wie bei
  rationale: Macht den im Griechischen knappen, an den vorherigen Zusammenhang anschließenden Vergleich im Deutschen natürlich verständlich.
- source_word: ἄνθρωπος ἀπόδημος
  choice: einem Mann, der verreist ist
  rationale: ἄνθρωπος bezeichnet hier die männliche Gestalt des Vergleichs; ἀπόδημος beschreibt jemanden, der sich auf einer Reise fern von zu Hause befindet.
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: Er verließ sein Haus
  rationale: Gibt das Aoristpartizip in einer natürlichen deutschen Satzfolge wieder und bewahrt οἰκία als „Haus“.
- source_word: δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν
  choice: übertrug seinen Sklaven die Vollmacht
  rationale: „Übertrug“ bringt die delegierende Funktion von δοὺς im Zusammenhang idiomatisch zum Ausdruck; „Vollmacht“ bezeichnet hier verliehene Handlungsbefugnis.
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: jedem seine Aufgabe
  rationale: Bewahrt die distributive Form und gibt ἔργον im Kontext der zugeteilten Arbeit knapp und verständlich als „Aufgabe“ wieder.
- source_word: τῷ θυρωρῷ
  choice: dem Türhüter
  rationale: Bezeichnet den mit der Bewachung des Eingangs betrauten Hausbediensteten präzise und in gehobenem, verständlichem Deutsch.
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: befahl …, wach zu bleiben
  rationale: Bewahrt sowohl die verbindliche Kraft von ἐνετείλατο als auch das Wachbleiben bzw. die Wachsamkeit von γρηγορέω.
theological_decisions:
- issue: Wiedergabe von δοῦλος im antiken Haushaltskontext
  choice: Sklaven
  alternative: Dienern; unfreien Dienern
  rationale: δοῦλος bezeichnet hier Menschen in einem rechtlich und sozial unfreien Abhängigkeitsverhältnis zum Hausherrn. „Sklaven“ bildet diese Realität klarer ab als das weiter gefasste „Diener“, ohne die Bildaussage darüber hinaus dogmatisch festzulegen.
- issue: Wiedergabe von γρηγορέω
  choice: wach zu bleiben
  alternative: Wache zu halten; wachsam zu sein
  rationale: Die konkrete Bedeutung des Wachbleibens bleibt erhalten und trägt zugleich den im Kontext beabsichtigten Sinn der Wachsamkeit, ohne die Metapher aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den knappen griechischen Vergleich natürlich; die Reihung „jedem seine Aufgabe“ bewahrt bewusst die Ellipse des Ausgangstextes.
