    issue: Die temporale ὅταν-Konstruktion wird als dass-Satz wiedergegeben.
    rationale: Das Griechische fragt nach dem Zeichen „wenn“ bzw. zu dem Zeitpunkt, da alle Dinge zur Vollendung ansetzen; „Zeichen dafür, dass“ macht daraus stärker einen Nachweisinhalt.
  - severity: medium
    issue: „kurz vor seiner Vollendung steht“ ersetzt die passive Verbkonstruktion durch eine possessive Singularformulierung.
    rationale: Die Formulierung ist nicht unverständlich, verdeckt aber das passivische „vollendet werden“ und kann so klingen, als habe „dies alles“ eine eigene, einheitliche Vollendung.
