  verdict: revise
  source_fidelity: Die erste Frage ist treffend wiedergegeben. In der zweiten Frage verschiebt die Formulierung „dass dies alles kurz vor seiner Vollendung steht“ jedoch die griechische temporale Konstruktion ὅταν („wenn“) zu einem Inhaltssatz und formuliert den passiven Infinitiv συντελεῖσθαι als possessive, singuläre „Vollendung“. Die revidierte Fassung bewahrt die Frage nach dem Zeichen zu dem Zeitpunkt, an dem alle diese Dinge im Begriff sind, vollendet zu werden, einschließlich der prospektiven Nuance von μέλλῃ.
  naturalness: „Wenn all dies im Begriff ist, vollendet zu werden“ ist modernes Standarddeutsch in einem gehobenen, bibeltauglichen Register. Es ist etwas formeller als „kurz davorsteht“, bildet aber die griechische Konstruktion genauer ab und vermeidet das missverständliche „seiner Vollendung“.
  terminology: „Zeichen“ für σημεῖον und „vollendet werden“ für das passive συντελεῖσθαι sind angemessen. „All dies“ gibt ταῦτα πάντα idiomatisch wieder, ohne die Pluralität sachlich einzuebnen.
  issues:
