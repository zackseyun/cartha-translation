  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: de
  text: '»Sag uns: Wann wird das geschehen, und was wird das Zeichen sein, wenn all dies im Begriff ist, vollendet zu werden?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »… und was wird das Zeichen sein, wenn all dies vollendet wird?« Das griechische μέλλῃ mit Infinitiv kann genauer ausdrücken, dass etwas unmittelbar bevorsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: Sag uns
  rationale: Der Aoristimperativ mit Dativ wird im Deutschen natürlich als direkte Bitte »Sag uns« wiedergegeben.
- source_word: πότε ταῦτα ἔσται
  choice: Wann wird das geschehen
  rationale: Obwohl ταῦτα formal Plural ist, verweist das idiomatische deutsche »das« gesammelt auf die zuvor angekündigten Vorgänge; »geschehen« gibt das kontextuelle Ereignisverständnis von ἔσται natürlich wieder.
- source_word: τί τὸ σημεῖον
  choice: was wird das Zeichen dafür sein
  rationale: »Zeichen« ist die übliche und sachgerechte Entsprechung; »dafür« stellt im Deutschen den Bezug zum folgenden Temporalsatz klar, ohne dessen Inhalt näher auszulegen.
- source_word: ὅταν μέλλῃ
  choice: dass … kurz vor … steht
  rationale: Die Formulierung bewahrt den prospektiven, möglicherweise auf unmittelbares Bevorstehen zielenden Sinn von μέλλω mit Infinitiv und klingt zugleich natürlich deutsch.
- source_word: ταῦτα … πάντα
  choice: dies alles
  rationale: Diese Wortstellung ist die idiomatische deutsche Wiedergabe der Gesamtheit »all dieser Dinge«.
- source_word: συντελεῖσθαι
  choice: seiner Vollendung
  rationale: Das passive Infinitivverb bezeichnet das Zu-Ende-Gelangen beziehungsweise Vollendetwerden. Die substantivische Formulierung bewahrt diesen resultativen Sinn, ohne ausdrücklich eine Prophetieerfüllung einzutragen.
theological_decisions:
- issue: Eschatologische Aussage von μέλλῃ mit Infinitiv
  choice: »kurz vor seiner Vollendung steht« bewahrt den Aspekt des Bevorstehens
  alternative: »wenn dies alles vollendet werden wird«
  rationale: μέλλω fügt dem bloßen Futur eine prospektive beziehungsweise imminente Nuance hinzu. Diese wird erhalten, ohne daraus eine bestimmte endzeitliche Chronologie abzuleiten.
- issue: Bedeutung von συντελεῖσθαι
  choice: Vollendung
  alternative: Erfüllung; Abschluss; Ende
  rationale: »Vollendung« lässt offen, ob vor allem Abschluss, Zu-Ende-Führung oder umfassende Verwirklichung gemeint ist, und vermeidet die stärkere Festlegung auf ausdrückliche Prophetieerfüllung.
translation_notes:
  register: Moderne, würdevolle direkte Rede. Der Satz bleibt gut verständlich und bewahrt zugleich die prospektive Nuance sowie die eschatologische Offenheit des griechischen Wortlauts.
