id: MRK.14.10
reference: Mark 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: de
  text: Und Judas Iskariot, einer der Zwölf, ging zu den Hohenpriestern, um ihn an sie auszuliefern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um ihn an sie zu verraten“. Das griechische Verb kann „übergeben“ oder „ausliefern“ bedeuten; bei Judas ist dieses Ausliefern zugleich ein Verrat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt als gewöhnliches erzählerisches Bindewort den Anschluss an den vorhergehenden Abschnitt, ohne eine zusätzliche zeitliche oder deutende Nuance einzuführen.
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: Judas Iskariot
  rationale: Der Personenname und der Beiname werden in ihrer im Deutschen etablierten Form wiedergegeben.
- source_word: ὁ εἷς τῶν δώδεκα
  choice: einer der Zwölf
  rationale: Die Formulierung bezeichnet Judas als Mitglied des bekannten Zwölferkreises; die Großschreibung macht den Gruppencharakter deutlich.
- source_word: ἀπῆλθεν
  choice: ging
  rationale: Gibt das erzählerische Bewegungsverb knapp und in natürlichem modernem Deutsch wieder.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: zu den Hohenpriestern
  rationale: Der Plural bezeichnet hier die führenden Jerusalemer Priester beziehungsweise die priesterliche Führungsschicht; „Hohenpriester“ ist die etablierte deutsche Wiedergabe.
- source_word: ἵνα
  choice: um … zu
  rationale: Bringt den Zweck von Judas’ Gang in idiomatischem Deutsch ausdrücklich zum Ausdruck.
- source_word: παραδοῖ
  choice: auszuliefern
  rationale: Das Verb παραδίδωμι bezeichnet grundsätzlich das Übergeben oder Ausliefern. „Ausliefern“ bewahrt diesen Handlungssinn und lässt zugleich im Kontext den Verratscharakter erkennen, ohne ihn allein zur lexikalischen Bedeutung zu machen.
- source_word: αὐτὸν … αὐτοῖς
  choice: ihn an sie
  rationale: 'Beide Pronomen bleiben ausdrücklich erhalten: „ihn“ bezeichnet Jesus, „sie“ verweist auf die Hohenpriester.'
theological_decisions:
- issue: Wiedergabe von παραδοῖ im Zusammenhang mit Judas’ Verrat
  choice: ihn an sie auszuliefern
  alternative: ihn an sie zu verraten
  rationale: Judas’ Handlung ist ihrem Wesen nach Verrat, doch παραδίδωμι hat den weiteren Sinn „übergeben/ausliefern“ und wird in der Passionsgeschichte wiederholt für das Übergeben Jesu gebraucht. Die Haupttextfassung erhält diese erzählerische und theologische Spannung; die Fußnote nennt die im Kontext naheliegende Deutung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satzbau folgt dem knappen Erzählstil des griechischen Textes. „Die Zwölf“ und „Hohenpriester“ werden als etablierte Gruppen- beziehungsweise Amtsbezeichnungen verwendet.
