  yaml_path: translation/nt/mark/014/059.yaml
  text: And not even in this way was their testimony consistent[a].
translation:
  language: de
  text: Und nicht einmal so stimmten ihre Aussagen überein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Nicht einmal so war ihr Zeugnis gleich«; auch: »Ihre Zeugenaussagen stimmten nicht miteinander überein«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Doch
  rationale: Der Anschluss führt die vorausgehende Schilderung weiter und markiert zugleich den Gegensatz zum Versuch, eine übereinstimmende Aussage vorzubringen. Im Deutschen gibt „Doch“ diesen Zusammenhang natürlich wieder.
- source_word: οὐδὲ
  choice: nicht einmal
  rationale: 'Bewahrt die verstärkende Verneinung: Selbst bei dieser Fassung der Anschuldigung kam keine Übereinstimmung zustande.'
- source_word: οὕτως
  choice: so
  rationale: Verweist knapp und idiomatisch auf die unmittelbar zuvor wiedergegebene Form der Aussage.
- source_word: ἴση
  choice: stimmten … überein
  rationale: ἴση bedeutet wörtlich „gleich“. Im gerichtlichen Zusammenhang bezeichnet es, dass die Zeugenaussagen einander nicht entsprachen; die verbale Wendung ist im modernen Deutschen klar und natürlich.
- source_word: ἦν
  choice: stimmten
  rationale: Das Imperfekt von εἰμί wird innerhalb der idiomatischen deutschen Konstruktion durch das Präteritum „stimmten“ ausgedrückt.
- source_word: ἡ μαρτυρία
  choice: Aussagen
  rationale: μαρτυρία bezeichnet hier die vor Gericht abgelegten Zeugenaussagen. Der Plural macht im Deutschen verständlich, dass die Aussagen mehrerer Zeugen miteinander verglichen werden.
- source_word: αὐτῶν
  choice: ihre
  rationale: Gibt den Genitiv Plural als natürliches deutsches Possessivpronomen wieder.
