  text: ὁ δὲ ἤρξατο ἀναθεματίζειν καὶ ὀμνύναι ὅτι Οὐκ οἶδα τὸν ἄνθρωπον τοῦτον ὃν λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: de
  text: 'Da fing er an, Flüche auszustoßen und zu schwören[a]: »Ich kenne diesen Menschen nicht, von dem ihr redet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu fluchen«; möglicherweise: »einen Fluch auf sich selbst herabzurufen«. Der griechische Text nennt nicht ausdrücklich, gegen wen sich der Fluch richtet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Da … er
  rationale: δέ führt die Erzählung mit einer leichten kontrastiven Zuspitzung fort. Im Deutschen gibt »Da« den nächsten, eskalierenden Schritt natürlich wieder.
- source_word: ἤρξατο
  choice: fing … an
  rationale: Die ingressiv gebrauchte Form mit ergänzenden Infinitiven wird im modernen Deutschen idiomatisch mit »fing an« wiedergegeben.
- source_word: ἀναθεματίζειν
  choice: Flüche herabzurufen
  rationale: Das Verb bezeichnet das Aussprechen oder Herbeirufen eines Fluches, nicht bloß Kraftausdrücke. Die Formulierung lässt offen, gegen wen sich die Flüche richten.
- source_word: ὀμνύναι
  choice: zu schwören
  rationale: Das Verb bezeichnet das Schwören beziehungsweise Ablegen eines Eides. »Schwören« ist prägnant und im Zusammenhang eindeutig.
- source_word: ὅτι
  choice: Doppelpunkt mit direkter Rede
  rationale: ὅτι leitet hier den Inhalt von Petrus’ Schwur und Leugnung ein; direkte Rede ist dafür im Deutschen die natürliche Form.
- source_word: Οὐκ οἶδα
  choice: Ich kenne … nicht
  rationale: Bei einer Person entspricht οἶδα im Deutschen natürlich »kennen«. Die knappe, entschiedene Leugnung bleibt erhalten.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: diesen Menschen
  rationale: »Diesen« bewahrt die deiktische Kraft von τοῦτον; »Menschen« entspricht ἄνθρωπον, ohne zusätzliche Geringschätzung einzutragen.
- source_word: ὃν λέγετε
  choice: von dem ihr redet
  rationale: Die Wendung gibt den Bezug auf die von den Umstehenden erwähnte Person natürlich und genau wieder.
theological_decisions:
- issue: Art und Zielrichtung des Fluchens in ἀναθεματίζειν
  choice: Das Herabrufen von Flüchen wird ausgedrückt, ohne deren Ziel ausdrücklich zu bestimmen.
  alternative: »sich selbst zu verfluchen« oder schlicht »zu fluchen«
  rationale: Im Zusammenhang kann eine Selbstverfluchung zur Bekräftigung des Schwurs gemeint sein. Der griechische Text nennt jedoch kein Objekt; daher darf die Übersetzung weder Jesus noch Petrus selbst ausdrücklich als Ziel des Fluches festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Flüche herabrufen« bewahrt den feierlich-ernsten Charakter und vermeidet das mögliche Missverständnis, Petrus habe lediglich Schimpfwörter gebraucht.
