id: MRK.14.36
reference: Mark 14:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: de
  text: 'Und er sagte[a]: »Abba, Vater[b], alles ist dir möglich. Nimm diesen Kelch[c] von mir weg! Doch nicht, was ich will, sondern was du willst.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Und er sagte immer wieder« oder »Und er sprach weiter«. Das griechische Imperfekt kann eine andauernde oder wiederholte Äußerung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Abba« ist eine aramäische Anrede für den Vater; der griechische Text behält sie neben dem griechischen Wort für »Vater« bei.
    reason: cultural_note
  - marker: c
    text: Der »Kelch« ist ein biblisches Bild für das ihm bestimmte Leiden; vergleiche Markus 10,38.
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das griechische Imperfekt kann einen andauernden oder wiederholten Vorgang bezeichnen; im Deutschen ist das einfache Präteritum hier erzählerisch natürlicher. Die mögliche Verlaufsbedeutung wird in einer Fußnote bewahrt.
- source_word: Αββα ὁ πατήρ
  choice: Abba, Vater
  rationale: Die aramäische Anrede bleibt erhalten, ebenso die unmittelbar folgende griechische Wiedergabe als Anrede. Ein im Griechischen nicht ausdrücklich vorhandenes »mein« wird nicht ergänzt.
- source_word: πάντα δυνατά σοι
  choice: alles ist dir möglich
  rationale: Diese geläufige deutsche Formulierung gibt den umfassenden Sinn des griechischen Neutrums im Plural und des Dativs prägnant wieder.
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: Nimm diesen Kelch von mir weg
  rationale: Die Formulierung gibt den Aoristimperativ und die räumliche Wendung klar und natürlich wieder, ohne das Bild des Kelches aufzulösen.
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: Doch nicht, was ich will, sondern was du willst
  rationale: Das im zweiten Glied ausgelassene Verb wird im Deutschen ergänzt. »wollen« bewahrt die Parallelität und das Gewicht von θέλω, ohne altertümlich zu klingen.
theological_decisions:
- issue: Doppelte Gottesanrede in aramäischer und griechischer Form
  choice: Abba, Vater
  alternative: Abba, mein Vater
  rationale: Der Ausgangstext bewahrt sowohl die aramäische Anrede als auch ihre griechische Entsprechung. Beide bleiben stehen; ein Possessivpronomen wird nicht hinzugefügt.
- issue: Bildsprache des Kelches
  choice: diesen Kelch
  alternative: dieses Leiden
  rationale: Das biblisch geprägte Bild wird nicht interpretierend aufgelöst. Im Kontext bezeichnet es das Jesus bevorstehende Leiden, behält aber seine intertextuelle und theologische Spannung.
- issue: Verhältnis des Willens Jesu zum Willen des Vaters
  choice: Doch nicht, was ich will, sondern was du willst
  alternative: Doch nicht mein Wille geschehe, sondern deiner
  rationale: Die knappe Gegenüberstellung des griechischen Textes wird möglichst direkt bewahrt. »geschehe« wird nicht ergänzt, da es zwar sinngemäß wäre, aber über den ausdrücklichen Wortlaut hinausginge.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Gebetston. Das einfache Präteritum ist idiomatisch; Aspekte des griechischen Imperfekts werden in der Fußnote ausgewiesen. Die Metapher »Kelch« und die doppelte Anrede »Abba, Vater« bleiben erhalten.
