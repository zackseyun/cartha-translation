source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: de
  text: Die führenden Priester und der ganze Rat[a] suchten nach einer Zeugenaussage gegen Jesus, um ihn zu töten, doch sie fanden keine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: der ganze Hohe Rat; traditionell auch „Sanhedrin“ genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Die
  rationale: δέ markiert hier nur einen milden narrativen Übergang. Ein ausdrückliches „nun“ wäre im Deutschen unnötig und würde ein nicht vorhandenes Zeitadverb nahelegen.
- source_word: ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die Jerusalemer priesterliche Führung. „Führende Priester“ ist verständlich und vermeidet den möglichen Eindruck, mehrere Personen hätten gleichzeitig das einzelne Amt des Hohenpriesters inne.
- source_word: ὅλον τὸ συνέδριον
  choice: der gesamte Rat[a]
  rationale: συνέδριον bezeichnet das führende Ratsgremium; „Rat“ übersetzt die Bedeutung, während „gesamte“ ὅλον wiedergibt. Die historische Bezeichnung wird in der Fußnote genannt.
- source_word: ἐζήτουν
  choice: suchten nach
  rationale: Das Imperfekt beschreibt eine andauernde Suche. Die deutsche Präteritalform ist in Verbindung mit „nach“ natürlich und lässt diesen Verlauf im Zusammenhang erkennen.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: gegen Jesus
  rationale: κατά mit Genitiv hat hier im gerichtlichen Zusammenhang eine gegen eine Person gerichtete Bedeutung.
- source_word: μαρτυρίαν
  choice: eine Zeugenaussage
  rationale: Das Wort bezeichnet hier den Inhalt eines Zeugnisses im gerichtlichen Zusammenhang. „Zeugenaussage“ ist präziser als das allgemeinere „Beweis“.
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: um ihn zu töten
  rationale: Die Konstruktion drückt den Zweck aus, und θανατόω bedeutet „töten/zu Tode bringen“. Die schlichte Formulierung bewahrt die Aussage, ohne eine bloße Verurteilung oder eine ausdrücklich delegierte Hinrichtung hineinzulesen.
- source_word: καὶ οὐχ ηὕρισκον
  choice: doch sie fanden keine
  rationale: Obwohl καί gewöhnlich „und“ bedeutet, macht „doch“ den sachlichen Gegensatz zwischen der Suche und ihrem ausbleibenden Erfolg in natürlichem Deutsch deutlich. „Keine“ nimmt „Zeugenaussage“ auf.
theological_decisions:
- issue: Identifizierung von συνέδριον
  choice: Im Haupttext steht „der gesamte Rat“.
  alternative: „der gesamte Hohe Rat“ oder „das gesamte Synhedrium“
  rationale: Der griechische Ausdruck benennt das Ratsgremium, ohne eine deutsche historische Fachbezeichnung vorzuschreiben. Die allgemein verständliche Übersetzung bleibt im Haupttext; die genauere historische Benennung steht in der Fußnote.
- issue: Zweck der Suche nach einer Zeugenaussage
  choice: „um ihn zu töten“
  alternative: „um ihn hinrichten zu lassen“
  rationale: Die gewählte Fassung gibt den Zweck und das Verb θανατόω direkt wieder. Sie legt nicht zusätzlich fest, ob der Rat die Tötung selbst vollziehen oder durch andere vollziehen lassen wollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist für heutige Leser verständlich, wahrt den gerichtlichen Kontext und vermeidet unnötige kirchliche Fachsprache.
