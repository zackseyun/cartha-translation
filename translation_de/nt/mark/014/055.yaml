revisions:
- from: Die führenden Priester und der gesamte Rat[a] suchten nach einer Zeugenaussage gegen Jesus, um ihn zu töten, doch sie fanden keine.
  to: Die führenden Priester und der ganze Rat[a] suchten nach einer Zeugenaussage gegen Jesus, um ihn zu töten, doch sie fanden keine.
  rationale: Die Revision beschränkt sich auf die idiomatischere deutsche Form „der ganze Rat“ und eine neutrale, knappe Fußnote zur historischen Bezeichnung. Der Sinn des griechischen Textes, einschließlich des gerichtlichen Charakters der μαρτυρία und des Zweckes εἰς τὸ θανατῶσαι αὐτόν, bleibt unverändert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:20:29Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Akteure, die gegen Jesus gerichtete Zeugensuche, den Zweck und das Ausbleiben einer passenden Zeugenaussage zutreffend wieder. Das deutsche Präteritum kann die griechischen Imperfekte ἐζήτουν und ηὕρισκον in diesem Erzählkontext angemessen wiedergeben. „Doch“ macht den aus dem Kontext entstehenden Gegensatz idiomatisch deutlich, ohne eine starke adversative Partikel im Griechischen zu behaupten.
  naturalness: „Der gesamte Rat“ ist verständlich, wirkt im Deutschen jedoch weniger idiomatisch als „der ganze Rat“. Die übrige Satzführung ist klar, modernes Standarddeutsch und dem gerichtlichen Kontext angemessen.
  terminology: „Führende Priester“, „Zeugenaussage“ und „töten“ sind sachgerecht. Die Fußnote sollte die historische Fachbezeichnung knapp als Alternative bieten; „Hoher Rat“ ist dabei die geläufige deutsche Bezeichnung, während „Sanhedrin“ als traditionelle Bezeichnung genannt werden kann.
  issues:
  - severity: low
    issue: Unidiomatische Nominalgruppe „der gesamte Rat“
    rationale: Bei einem zählbaren kollektiven Substantiv ist „der ganze Rat“ im heutigen Standarddeutsch die natürlichere Formulierung. Die Änderung betrifft weder Bedeutung noch Register.
  - severity: low
    issue: Fußnote ist unnötig umständlich formuliert
    rationale: „Oder genauer“ suggeriert, die Hauptübersetzung sei ungenau. Die Fachbezeichnung kann neutral als lexikalische Alternative angegeben werden.
  revised_text: Die führenden Priester und der ganze Rat[a] suchten nach einer Zeugenaussage gegen Jesus, um ihn zu töten, doch sie fanden keine.
