language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: de
  text: 'Und er kommt zum dritten Mal und sagt zu ihnen: „Schlaft ihr immer noch und ruht euch aus?[a] Es ist genug![b] Die Stunde ist gekommen. Seht, der Menschensohn wird in die Hände der Sünder ausgeliefert.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder als ironische Erlaubnis: „Schlaft nur weiter und ruht euch aus.“ Der griechische Wortlaut kann als Aussage beziehungsweise Aufforderung oder als rhetorische Frage verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: Die griechische Wendung ist schwer zu deuten. Möglich sind auch „Genug!“ und – hier weniger wahrscheinlich – ein kaufmännischer Sinn wie „Die Zahlung ist vollständig eingegangen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: er kommt zum dritten Mal
  rationale: Das historische Präsens bewahrt die lebendige Erzählweise; τὸ τρίτον wird im Deutschen idiomatisch mit „zum dritten Mal“ wiedergegeben.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Schlaft ihr immer noch und ruht euch aus?
  rationale: Die formal indikativischen Verben und die schwierige adverbiale Wendung können im Zusammenhang als vorwurfsvolle rhetorische Frage verstanden werden. „Immer noch“ gibt die kontextuelle Fortdauer natürlich wieder; die ironisch-erlaubende Alternative bleibt in einer Fußnote erhalten.
- source_word: ἀπέχει
  choice: Es ist genug!
  rationale: Die schwierige, kontextabhängige Wendung markiert hier am ehesten den Abschluss des Wartens und den Übergang zur entscheidenden Stunde, ohne eine spekulative technische Bedeutung einzutragen.
- source_word: ἦλθεν ἡ ὥρα
  choice: Die Stunde ist gekommen
  rationale: „Stunde“ bewahrt das konkrete Bild und die theologische Resonanz des bestimmten, nun eingetretenen Zeitpunkts.
- source_word: ἰδοὺ
  choice: Seht
  rationale: „Seht“ ist eine natürliche, würdige deutsche Aufforderung zur Aufmerksamkeit und vermeidet das altertümliche „Siehe“.
- source_word: παραδίδοται
  choice: wird … ausgeliefert
  rationale: „Ausgeliefert“ wahrt den breiten Sinn von παραδίδωμι und verengt ihn nicht vorschnell auf den Verrat des Judas.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Dies ist die etablierte deutsche Wiedergabe der Selbstbezeichnung und bewahrt ihren titularen wie idiomatischen Charakter.
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: in die Hände der Sünder
  rationale: Die konkrete Übergabe in die Gewalt anderer wird entsprechend dem griechischen Bild bewahrt; das substantivierte Adjektiv wird natürlich als „Sünder“ wiedergegeben.
theological_decisions:
- issue: Aussage oder Frage bei Καθεύδετε … καὶ ἀναπαύεσθε
  choice: 'Vorwurfsvolle rhetorische Frage: „Schlaft ihr immer noch und ruht euch aus?“'
  alternative: 'Ironische Erlaubnis oder Aufforderung: „Schlaft nur weiter und ruht euch aus.“'
  rationale: Die älteste griechische Überlieferung entscheidet die Interpunktion nicht; beide Auffassungen sind grammatisch und kontextuell möglich. Die Frage klingt im modernen Deutschen in der dramatischen Situation natürlich, während die alternative Deutung ausdrücklich dokumentiert wird.
- issue: Bedeutung von ἀπέχει
  choice: „Es ist genug!“
  alternative: „Genug!“; möglicherweise „Die Zahlung ist vollständig eingegangen“
  rationale: Die idiomatische Wiedergabe passt zum unmittelbaren Übergang vom Schlaf der Jünger zum Eintreffen der Stunde. Eine kaufmännische Bedeutung ist hier weniger wahrscheinlich und würde eine unsichere Deutung in den Haupttext eintragen.
- issue: Bedeutungsumfang von παραδίδοται
  choice: „wird ausgeliefert“
  alternative: „wird verraten“ oder „wird übergeben“
  rationale: Die gewählte Formulierung bewahrt sowohl die menschliche Übergabe als auch den weiteren Verlauf der Passion, ohne die Aussage ausschließlich auf Judas’ Verrat zu beschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens bleibt erhalten. Die Satzfolge ist knapp und dramatisch; echte textliche und semantische Mehrdeutigkeit wird durch Fußnoten kenntlich gemacht.
