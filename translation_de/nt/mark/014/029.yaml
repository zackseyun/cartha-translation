  source_fidelity: „Petrus aber sagte zu ihm“ gibt ὁ δὲ Πέτρος ἔφη αὐτῷ präzise wieder. „Auch wenn“ trifft den konzessiv-konditionalen Nachdruck von εἰ καί. „Alle zu Fall kommen“ ist eine angemessene, bewusst nicht überinterpretierende Wiedergabe von σκανδαλισθήσονται; die knappe Gegenüberstellung „ich nicht“ bewahrt die durch ἀλλ’ οὐκ ἐγώ ausgedrückte Selbstabgrenzung.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. Der Gedankenstrich und die elliptische Schlusswendung sind in direkter Rede stilistisch natürlich und geben Petrus’ Nachdruck gut wieder.
  terminology: „Zu Fall kommen“ wahrt das bildhafte Versagensvokabular, ohne den Ausdruck einseitig als endgültigen Abfall festzulegen. Die Fußnote bietet sinnvolle lexikalische Alternativen und erläutert die passive Bedeutungsnuance, ohne sie als zwingende theologische Aussage auszugeben. Der Fußnotenanker steht sachgerecht bei „zu Fall kommen“.
