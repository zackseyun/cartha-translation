  text: ὁ δὲ Πέτρος ἔφη αὐτῷ· ⸂Εἰ καὶ⸃ πάντες σκανδαλισθήσονται, ἀλλ’ οὐκ ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/029.yaml
  text: But Peter said to him[a], “Even if all fall away, I will not.”
translation:
  language: de
  text: 'Petrus aber sagte zu ihm: „Auch wenn alle zu Fall kommen[a] – ich nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „straucheln“, „Anstoß nehmen“ oder „sich abwenden“. Das griechische Verb kann bezeichnen, dass jemand zu Fall gebracht wird, Anstoß nimmt oder vom bisherigen Weg abkommt.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet den Gegensatz zwischen Jesu vorausgehender Ankündigung und dem Widerspruch des Petrus.
- source_word: ἔφη αὐτῷ
  choice: sagte zu ihm
  rationale: Gibt das gewöhnliche Redeverb und das auf Jesus bezogene Pronomen schlicht und quellentreu wieder.
- source_word: Εἰ καὶ
  choice: Auch wenn
  rationale: Drückt die konzessive Bedingung im heutigen Deutsch natürlich aus.
- source_word: πάντες
  choice: alle
  rationale: Bezieht sich im Kontext auf die Gesamtheit der Jünger und wahrt den uneingeschränkten Umfang des griechischen Ausdrucks.
- source_word: σκανδαλισθήσονται
  choice: zu Fall kommen
  rationale: Bewahrt das griechische Bild des Strauchelns und erfasst zugleich das Versagen und Abwenden der Jünger, ohne über dessen endgültige geistliche Bedeutung zu entscheiden.
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: – ich nicht
  rationale: Die knappe Ellipse und die betonte Selbstabgrenzung des Petrus werden im Deutschen durch den Gedankenstrich natürlich und nachdrücklich wiedergegeben.
theological_decisions:
- issue: Bedeutung von σκανδαλισθήσονται im Zusammenhang des Versagens der Jünger
  choice: zu Fall kommen
  alternative: Anstoß nehmen; straucheln; sich abwenden
  rationale: „Zu Fall kommen“ lässt sowohl schweres Versagen als auch Abwendung anklingen, legt aber weder bloße Kränkung noch endgültigen Abfall dogmatisch fest und bewahrt damit die Spannung des Kontextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Schlusswendung „ich nicht“ bildet die Kürze und Betonung des griechischen οὐκ ἐγώ ab; der Gedankenstrich macht den Kontrast für heutige Leser unmittelbar verständlich.
