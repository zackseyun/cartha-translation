id: MRK.14.25
reference: Mark 14:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: de
  text: 'Amen, ich sage euch: Ich werde ganz gewiss nicht mehr von der Frucht des Weinstocks trinken[a][b] bis zu jenem Tag, an dem ich im Reich Gottes neu davon trinke[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ich werde nie wieder von der Frucht des Weinstocks trinken.“ Im Griechischen steht eine nachdrückliche Verneinung.'
    reason: lexical_alternative
  - marker: b
    text: „Frucht des Weinstocks“ entspricht der griechischen Ausdrucksweise und bezeichnet hier das aus dem Weinstock stammende Getränk beim Mahl.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „aufs Neue davon trinke“. Das griechische Adjektiv bedeutet „neu“ und kann auf die endzeitliche Neuheit hinweisen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Die semitisch-griechische Bekräftigungsformel bleibt mit „Amen“ erkennbar; „ich sage euch“ gibt die feierliche direkte Anrede schlicht und genau wieder.
- source_word: οὐκέτι οὐ μὴ πίω
  choice: Ich werde ganz gewiss nicht mehr trinken
  rationale: „Nicht mehr“ bewahrt den zeitlichen Sinn von οὐκέτι; „ganz gewiss nicht“ bringt die nachdrückliche zukünftige Verneinung οὐ μή zum Ausdruck.
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: von der Frucht des Weinstocks
  rationale: Die feste Bildformulierung des Griechischen wird beibehalten, ohne sie enger als „Wein“ auszulegen.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: bis zu jenem Tag
  rationale: „Jenem“ erhält die demonstrative Hervorhebung von ἐκείνης und klingt in der feierlichen Aussage natürlich.
- source_word: ὅταν αὐτὸ πίνω
  choice: an dem ich … davon trinke
  rationale: Die Wendung hat Zukunftsbezug. „Davon“ nimmt im Deutschen natürlich die zuvor genannte „Frucht des Weinstocks“ beziehungsweise das daraus stammende Getränk wieder auf.
- source_word: καινὸν
  choice: neu
  rationale: „Neu“ bewahrt die mögliche qualitative oder endzeitliche Neuheit, ohne den Sinn auf das bloße „wieder/aufs Neue“ festzulegen.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: im Reich Gottes
  rationale: Dies ist die genaue und im modernen Deutschen geläufige Wiedergabe der neutestamentlichen Wendung.
theological_decisions:
- issue: Bedeutung von καινὸν im Schlusssatz
  choice: „neu“ ohne nähere Bestimmung
  alternative: „aufs Neue“ oder „in neuer Weise“
  rationale: Das Adjektiv kann eine neue Qualität beziehungsweise endzeitliche Neuheit bezeichnen, lässt aber auch eine adverbiale Auffassung zu. Die Übersetzung hält diese Spannung offen.
- issue: Bezug und Bedeutung von „Frucht des Weinstocks“
  choice: Die griechische Bildformulierung wird beibehalten.
  alternative: „Wein“
  rationale: Im Zusammenhang ist das Getränk des Mahls gemeint, doch der griechische Text nennt ausdrücklich die „Frucht“ beziehungsweise das „Erzeugnis des Weinstocks“. Eine Konkretisierung zu „Wein“ wäre interpretierend.
- issue: Stärke der Verneinung
  choice: „ganz gewiss nicht mehr“
  alternative: „nie wieder“
  rationale: Die Formulierung gibt sowohl οὐκέτι als auch die emphatische Konstruktion οὐ μή wieder, ohne die Aussage über ihren zeitlich begrenzenden Folgesatz hinaus zu verabsolutieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formel „Amen, ich sage euch“ bewahrt den feierlichen Charakter und die Nähe zum griechischen Wortlaut. „Ganz gewiss nicht mehr“ ist nachdrücklich, aber idiomatisch; „neu davon trinke“ hält die Mehrdeutigkeit von καινόν offen.
