  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: de
  text: Als Jesus in Betanien im Haus Simons des Aussätzigen zu Tisch lag, kam eine Frau mit einem Alabastergefäß, das sehr kostbares Duftöl aus reiner Narde[a] enthielt. Sie zerbrach das Gefäß und goss ihm das Öl über den Kopf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: echter Narde. Die genaue Bedeutung des griechischen Wortes πιστική ist umstritten.'
    reason: Lexikalische Alternative bei einem seltenen und unsicher gedeuteten Adjektiv.
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: Als Jesus ... zu Tisch lag
  rationale: Der Genitivus absolutus zeichnet den Hintergrund der Handlung. „Zu Tisch lag“ gibt die damalige Esshaltung natürlich und präzise wieder; der Name „Jesus“ schafft im Einzelvers einen klaren Bezug.
- source_word: Βηθανίᾳ
  choice: Betanien
  rationale: Eingebürgerte deutsche Form des Ortsnamens.
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: im Haus Simons des Aussätzigen
  rationale: Die Formulierung bewahrt die Bezeichnung des griechischen Textes, ohne unbelegt „ehemals aussätzig“ hinzuzufügen.
- source_word: γυνὴ
  choice: eine Frau
  rationale: Markus nennt die Frau an dieser Stelle nicht näher.
- source_word: ἀλάβαστρον
  choice: Alabastergefäß
  rationale: Das Wort bezeichnet hier ein Behältnis für Duftöl. „Gefäß“ ist verständlich und vermeidet eine unbelegte Festlegung auf eine bestimmte Form.
- source_word: μύρου
  choice: Duftöl
  rationale: μύρον bezeichnet ein wohlriechendes Öl beziehungsweise Salbmittel. „Duftöl“ ist im modernen Deutsch anschaulich, ohne dessen Konsistenz zu stark festzulegen.
- source_word: νάρδου
  choice: Narde
  rationale: Die konkrete aromatische Pflanze beziehungsweise der daraus gewonnene Duftstoff bleibt erhalten.
- source_word: πιστικῆς
  choice: rein
  rationale: Das seltene und umstrittene Adjektiv wird im Sinn von unverfälscht beziehungsweise echt verstanden. Die verbleibende Unsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: πολυτελοῦς
  choice: sehr kostbar
  rationale: Die Wendung bringt den hohen materiellen Wert zum Ausdruck und bereitet die folgende Reaktion im Erzählzusammenhang vor.
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: Sie zerbrach das Gefäß
  rationale: Das Partizip bezeichnet die dem Ausgießen vorausgehende Handlung. Die deutsche Satzfolge gibt diese Abfolge klar wieder.
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: goss ihm das Öl über den Kopf
  rationale: Die Formulierung gibt die Richtung des Ausgießens idiomatisch wieder; „das Öl“ macht den Bezug im Deutschen eindeutig.
theological_decisions:
- issue: Ob „Simon der Aussätzige“ zu „Simon, der früher aussätzig gewesen war“ abgeschwächt werden soll
  choice: Simons des Aussätzigen
  alternative: Simons, der früher aussätzig gewesen war
  rationale: Der Ausgangstext bezeichnet Simon ohne zeitliche Einschränkung als „den Aussätzigen“. Die Ergänzung „früher“ wäre eine plausible, aber nicht ausdrücklich ausgesagte Folgerung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu Tisch lag“ bewahrt den historischen Hintergrund, bleibt aber allgemein verständlich. Der Marker [a] steht unmittelbar bei der umstrittenen Wendung.
