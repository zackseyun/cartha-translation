  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: de
  text: 'Als sie Petrus sah, der sich wärmte, blickte sie ihn aufmerksam an und sagte: »Auch du warst mit Jesus, dem Nazarener, zusammen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασα αὐτῷ
  choice: blickte sie ihn aufmerksam an
  rationale: Das Verb bezeichnet ein gezieltes, eingehendes Anblicken; „aufmerksam ansehen“ gibt dies in natürlichem Deutsch wieder.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird im Deutschen idiomatisch als Erzählpräteritum wiedergegeben, ohne den Handlungswert zu verändern.
- source_word: τοῦ Ναζαρηνοῦ … τοῦ Ἰησοῦ
  choice: Jesus, dem Nazarener
  rationale: Bewahrt sowohl den Namen als auch die Herkunftsbezeichnung und bildet die griechische Apposition natürlich ab.
- source_word: μετά
  choice: zusammen mit
  rationale: Drückt die behauptete Zugehörigkeit beziehungsweise Begleitung verständlich aus, ohne sie näher zu bestimmen.
theological_decisions: []
