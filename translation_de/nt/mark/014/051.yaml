source:
  edition: SBLGNT
  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: de
  text: Und ein junger Mann folgte ihm, nur mit einem Leinentuch[a] über seinem nackten Körper bekleidet, und sie packen ihn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Leinenlaken“. Das griechische Wort kann ein Leinentuch, ein Laken oder ein leinenes Gewand bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: ein junger Mann
  rationale: νεανίσκος bezeichnet einen jungen Mann; das indefinite τις führt ihn als nicht näher bezeichnete Einzelperson ein. Das deutsche „ein junger Mann“ gibt dies natürlich wieder, ohne das im heutigen Deutsch auffällig wirkende „ein gewisser“.
- source_word: συνηκολούθει
  choice: folgte ihm
  rationale: Der Imperfekt bezeichnet ein im damaligen Geschehen andauerndes Folgen. Im Deutschen vermittelt das Präteritum diesen Verlauf im Erzählzusammenhang natürlich.
- source_word: περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ
  choice: Er trug nur ein Leinentuch über dem nackten Körper
  rationale: Das Partizip beschreibt, dass der Stoff umgelegt beziehungsweise getragen wurde; ἐπὶ γυμνοῦ besagt, dass er unmittelbar auf dem unbekleideten Körper lag. „nur“ macht idiomatisch deutlich, dass darunter nichts getragen wurde.
- source_word: σινδόνα
  choice: Leinentuch
  rationale: σινδών bezeichnet ein Tuch aus Leinen, möglicherweise auch ein größeres, als Umhüllung dienendes Tuch. „Leinentuch“ wahrt diese Offenheit.
- source_word: κρατοῦσιν αὐτόν
  choice: sie packen ihn
  rationale: Das historische Präsens erzeugt einen unvermittelten, lebhaften Tempuswechsel; „packen“ gibt den gewaltsamen Zugriff wieder, ohne bereits die spezifischere Deutung „verhaften“ festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Der erste griechische Satzteil wurde zur besseren Verständlichkeit in zwei deutsche Hauptsätze gegliedert. Das historische Präsens „sie packen“ und das abschließende Komma bleiben erhalten, da der Satz in Vers 52 weitergeführt wird.
