  text: ⸀ἤρξαντο λυπεῖσθαι καὶ λέγειν αὐτῷ εἷς κατὰ εἷς· Μήτι ⸀ἐγώ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: de
  text: 'Sie begannen, traurig zu werden, und sagten zu ihm, einer nach dem anderen: „Doch nicht etwa ich?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit μήτι eingeleitete griechische Frage erwartet eine verneinende Antwort.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο λυπεῖσθαι
  choice: Da wurden sie traurig
  rationale: Die Wendung gibt den einsetzenden Zustand idiomatisch wieder. Eine formalere Fassung wie „Sie begannen, traurig zu werden“ wäre im Deutschen schwerfälliger.
- source_word: καὶ λέγειν αὐτῷ
  choice: und … sagte zu ihm
  rationale: λέγειν bedeutet hier „sagen“; obwohl eine Frage folgt, wird nicht unnötig zum spezifischeren „fragen“ verdeutlicht. Das griechische Pronomen bleibt als „ihm“ erhalten.
- source_word: εἷς κατὰ εἷς
  choice: einer nach dem anderen
  rationale: Die distributive Wendung bezeichnet die aufeinanderfolgenden Äußerungen der Einzelnen und wird so natürlich und präzise wiedergegeben.
- source_word: Μήτι ἐγώ;
  choice: Doch nicht etwa ich?
  rationale: Die knappe, elliptische Form des Griechischen bleibt erhalten; „doch nicht etwa“ bringt zugleich die durch μήτι angezeigte Erwartung einer verneinenden Antwort zum Ausdruck.
theological_decisions:
- issue: Aussagekraft der Frage der Jünger
  choice: 'Die Frage wird als eine verneinende Antwort erwartend wiedergegeben: „Doch nicht etwa ich?“'
  alternative: „Bin ich es?“
  rationale: μήτι signalisiert, dass der Sprecher mit „nein“ rechnet. Die neutralere Alternative würde die im Griechischen erkennbare besorgte Zurückweisung abschwächen, ohne dass darüber hinaus ein bestimmtes Motiv der Jünger festgelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde für natürliches Deutsch leicht umgestellt; die knappe und beunruhigte Frage bleibt bewusst elliptisch.
