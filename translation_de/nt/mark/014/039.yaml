  text: καὶ πάλιν ἀπελθὼν προσηύξατο τὸν αὐτὸν λόγον εἰπών.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/039.yaml
  text: And again he went away and prayed[b][a], saying the same words.
translation:
  language: de
  text: Und wieder ging er weg und betete, wobei er dasselbe sagte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „indem er dasselbe Wort sagte“; gemeint ist derselbe Gebetsinhalt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb bezeichnet die Wiederholung und führt die Erzählung knapp und natürlich fort.
- source_word: ἀπελθὼν
  choice: ging er weg
  rationale: Das Aoristpartizip bezeichnet das Weggehen, das dem Gebet vorausgeht; die finite deutsche Form gibt die Abfolge natürlich wieder.
- source_word: προσηύξατο
  choice: betete
  rationale: Die übliche und klare Wiedergabe von προσεύχομαι; das griechische Medium verlangt hier im Deutschen keine besondere Kennzeichnung.
- source_word: τὸν αὐτὸν λόγον
  choice: dasselbe
  rationale: λόγος bezeichnet hier den Inhalt der erneut gesprochenen Bitte. „Dasselbe“ ist idiomatisches Deutsch, vermeidet das missverständliche „dasselbe Wort“ und erhält den Bezug auf den gleichen Gebetsinhalt.
- source_word: εἰπών
  choice: wobei er … sagte
  rationale: Das Partizip erläutert, was beim Beten gesprochen wurde. Die Konstruktion vermeidet im Deutschen die schwerfällige Verbindung „betete und sagte“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfügung folgt dem griechischen Handlungsablauf, ohne dessen Partizipien unnatürlich nachzubilden.
