source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: de
  text: 'Und sofort krähte der Hahn zum zweiten Mal. Da erinnerte sich Petrus an das Wort, das Jesus zu ihm gesagt hatte: »Bevor der Hahn zweimal kräht, wirst du mich dreimal verleugnen.« Und er fing an zu weinen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bedeutung des griechischen Partizips ἐπιβαλών ist unsicher. Es kann bedeuten: »als er darüber nachdachte«; andere Deutungen beziehen es auf eine äußere Geste, etwa das Bedecken des Kopfes. Die Wiedergabe »fing an zu weinen« gibt den erzählerischen Zusammenhang wieder, ohne eine dieser Deutungen festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus charakteristische Unmittelbarkeit und ist im modernen Deutschen natürlich.
- source_word: ἐκ δευτέρου
  choice: zum zweiten Mal
  rationale: Gibt die ausdrückliche Zählung idiomatisch und genau wieder.
- source_word: ἀλέκτωρ
  choice: der Hahn
  rationale: Im Deutschen ist der generische bestimmte Artikel in dieser festen Wendung natürlich; er bezeichnet keinen zuvor eigens identifizierten Hahn.
- source_word: ἐφώνησεν / φωνῆσαι
  choice: krähte / kräht
  rationale: Beim Hahn ist „krähen“ die kontextgemäße deutsche Entsprechung des allgemeineren Verbs für das Ertönen.
- source_word: ἀνεμνήσθη
  choice: erinnerte sich
  rationale: Gibt die deponentisch gebrauchte Form direkt und idiomatisch wieder.
- source_word: τὸ ῥῆμα ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: das Wort, das Jesus zu ihm gesagt hatte
  rationale: „Wort“ bleibt formal nahe an ῥῆμα; der Relativsatz gibt den Inhalt bzw. Bezug der Erinnerung in natürlichem Deutsch wieder.
- source_word: τρίς με ἀπαρνήσῃ
  choice: wirst du mich dreimal verleugnen
  rationale: „Verleugnen“ ist die etablierte und sachlich passende Wiedergabe von ἀπαρνέομαι in diesem Zusammenhang.
- source_word: ἐπιβαλών
  choice: er brach zusammen
  rationale: Die schwierige Partizipialform wird als Einsetzen eines emotionalen Zusammenbruchs verstanden, ohne eine nicht eindeutig belegte körperliche Geste festzulegen; andere Deutungen werden in der Fußnote offengelegt.
- source_word: ἔκλαιεν
  choice: weinte
  rationale: Das Imperfekt bezeichnet fortdauerndes Weinen; das deutsche Präteritum ist im Erzählzusammenhang natürlich und lässt diesen Verlauf zu.
theological_decisions:
- issue: Darstellung von Petrus’ Reaktion durch das umstrittene ἐπιβαλών
  choice: „er brach zusammen und weinte“
  alternative: „als er darüber nachdachte, weinte er“; möglicherweise auch eine äußere Geste wie das Verhüllen des Kopfes
  rationale: Die Formulierung bewahrt die starke emotionale Wirkung, legt aber keine bestimmte Bußgeste oder innere Handlung als sicher fest. Wegen der erheblichen lexikalischen Unsicherheit werden Alternativen transparent in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Erzählsprache. „Da erinnerte sich“ stellt den zeitlichen und folgerichtigen Anschluss natürlich her. Die direkte Rede folgt heutiger deutscher Zeichensetzung. Der Fußnotenmarker steht nach dem vollständigen Satz, da er die schwierige Schlusswendung erläutert.
