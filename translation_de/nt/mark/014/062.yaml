id: MRK.14.62
reference: Mark 14:62
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: de
  text: 'Jesus aber sagte: „Ich bin es[a], und ihr werdet den Menschensohn zur Rechten der Macht[b] sitzen und mit den Wolken des Himmels kommen sehen.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Ich bin.“ Das Griechische enthält kein ausdrückliches „es“.'
    reason: alternative_reading
  - marker: b
    text: „Die Macht“ ist hier eine ehrfürchtige Umschreibung für Gott.
    reason: cultural_note
  - marker: c
    text: Die Aussage greift Psalm 110,1 und Daniel 7,13 auf.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Zusammenhang ist dies die natürliche deutsche Antwort auf die Frage des Hohenpriesters. Das ergänzte „es“ ist im Deutschen idiomatisch, während eine Fußnote den prädikatlosen griechischen Wortlaut „Ich bin“ sichtbar hält und dessen mögliche weitergehende Resonanz nicht ausschließt.
- source_word: ὄψεσθε
  choice: ihr werdet … sehen
  rationale: Die direkte Zukunftsform gibt die Ankündigung klar wieder. Die deutsche Satzklammer erlaubt es, beide Partizipien als das zu kennzeichnen, was die Angeredeten sehen werden.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: den Menschensohn
  rationale: „Menschensohn“ ist die etablierte deutsche Wiedergabe dieser Selbstbezeichnung Jesu und bewahrt den Bezug zu Daniel 7.
- source_word: ἐκ δεξιῶν
  choice: zur Rechten
  rationale: Die feste biblische Wendung bezeichnet den Ehren- und Herrschaftsplatz und klingt im Deutschen natürlich und würdig.
- source_word: τῆς δυνάμεως
  choice: der Macht
  rationale: Die wörtliche Wiedergabe bewahrt die ehrfürchtige Umschreibung für Gott, statt sie erklärend durch „Gott“ zu ersetzen.
- source_word: καθήμενον
  choice: sitzen
  rationale: In Verbindung mit „sehen“ gibt der Infinitiv die partizipiale Konstruktion natürlich wieder; der Zusammenhang zur Rechten der Macht vermittelt den Gedanken des Thronens.
- source_word: ἐρχόμενον
  choice: kommen
  rationale: „Kommen“ bewahrt die eschatologische und danielische Resonanz der Aussage.
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: mit den Wolken des Himmels
  rationale: Die formnahe Wiedergabe erhält die apokalyptische Bildsprache und den deutlichen Bezug zu Daniel 7,13.
- source_word: καὶ … καὶ
  choice: und … und
  rationale: Das wiederholte „und“ verbindet die beiden Aussagen über den Menschensohn kumulativ, ohne ihr Verhältnis näher auszudeuten.
theological_decisions:
- issue: Wiedergabe des prädikatlosen Ἐγώ εἰμι
  choice: „Ich bin es“ im Haupttext mit Hinweis auf den wörtlichen Wortlaut
  alternative: „Ich bin“
  rationale: „Ich bin es“ beantwortet im modernen Deutschen die vorausgehende Frage unmittelbar und idiomatisch. Die Fußnote hält fest, dass im Griechischen kein ausdrückliches „es“ steht, und bewahrt so die Spannung zwischen schlichter Bejahung und möglicher tieferer Resonanz.
- issue: Benennung Gottes durch τῆς δυνάμεως
  choice: „der Macht“
  alternative: „Gottes“ oder „des Mächtigen“
  rationale: Der griechische Text verwendet eine ehrfürchtige Umschreibung. Ihre Beibehaltung wahrt Wortlaut und Ton, während die Fußnote ihre Funktion erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Stellung „Jesus aber sagte“ bewahrt den leichten Kontrast des griechischen ὁ δὲ Ἰησοῦς. Die Satzklammer „werdet … sitzen und … kommen sehen“ ist idiomatisch und hält beide griechischen Partizipien eng zusammen.
