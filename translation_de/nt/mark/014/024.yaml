id: MRK.14.24
reference: Mark 14:24
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Das ist mein Blut des Bundes,[a] das für viele[c] ausgegossen wird.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften und Parallelüberlieferungen haben: „mein Blut des neuen Bundes“. Der griechische Text des Markus ist hier am besten als „mein Blut des Bundes“ zu lesen.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „das gerade ausgegossen wird“; traditionell: „das vergossen wird“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „zugunsten vieler“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: Das ist
  rationale: Die direkte Wiedergabe der Kopula entspricht dem griechischen Wortlaut und legt nicht zusätzlich fest, ob die Aussage symbolisch, sakramental oder anders zu deuten ist.
- source_word: τὸ αἷμά μου
  choice: mein Blut
  rationale: Die wörtliche Possessivverbindung bewahrt die im Kontext ausdrücklich aufgerufene Opfer- und Bundesvorstellung; eine Umschreibung wie „mein Tod“ wäre interpretierend.
- source_word: τῆς διαθήκης
  choice: des Bundes
  rationale: Im Zusammenhang mit dem Blut und dem Anklang an Exodus 24,8 bezeichnet διαθήκη einen Bund. Das im vorgelegten griechischen Text nicht enthaltene „neuen“ wird nicht ergänzt.
- source_word: ἐκχυννόμενον
  choice: das … ausgegossen wird
  rationale: Der passive Präsenspartizip wird im Deutschen natürlich als Relativsatz wiedergegeben. „Ausgegossen“ erhält das konkrete Bild des griechischen Verbs deutlicher als das traditionelle „vergossen“.
- source_word: ὑπὲρ πολλῶν
  choice: für viele
  rationale: Diese natürliche deutsche Wendung lässt die Bedeutung „zugunsten/stellvertretend für“ anklingen, ohne eine bestimmte Sühnetheorie festzuschreiben oder „viele“ durch „alle“ zu ersetzen.
theological_decisions:
- issue: Bundes- oder Testamentsbedeutung von διαθήκη
  choice: Bund
  alternative: Testament
  rationale: Das Blutwort beim letzten Mahl erinnert an die Bundesschließung in Exodus 24,8; „Testament“ beziehungsweise „letztwillige Verfügung“ passt hier nicht zum unmittelbaren Bild.
- issue: Ob „neu“ vor „Bund“ ergänzt werden soll
  choice: des Bundes
  alternative: des neuen Bundes
  rationale: Im zugrunde gelegten SBLGNT-Text von Markus 14,24 fehlt καινῆς („neu“). Die Übersetzung harmonisiert Markus daher nicht mit parallelen Überlieferungen; die Variante wird in einer Fußnote genannt.
- issue: Reichweite der Aussage ὑπὲρ πολλῶν
  choice: für viele
  alternative: für alle; zugunsten vieler
  rationale: Die Übersetzung bewahrt „viele“ und entscheidet damit keine weitergehende Lehrfrage über die Reichweite der Sühne. „Für alle“ wäre keine Übersetzung des vorliegenden Wortlauts.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstellung bleibt nahe am Griechischen, klingt aber natürlich. „Ausgegossen“ bewahrt das konkrete Opferbild; die Fußnoten dokumentieren sowohl die Textvariante als auch sachlich mögliche Übersetzungsalternativen.
