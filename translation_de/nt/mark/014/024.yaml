  source_fidelity: 'Der deutsche Text gibt den SBLGNT-Wortlaut präzise wieder: „Das ist“ entspricht Τοῦτό ἐστιν, „mein Blut des Bundes“ bewahrt sowohl αἷμά μου als auch τῆς διαθήκης ohne das nicht im Haupttext stehende „neu“, und „das für viele ausgegossen wird“ gibt das präsente passive ἐκχυννόμενον sowie ὑπὲρ πολλῶν angemessen wieder.'
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch mit angemessen würdigem biblischem Register. „Blut des Bundes“ ist im Kontext natürlich und traditionssprachlich klar; der Relativsatz mit „ausgegossen wird“ ist idiomatisch.
  terminology: „Bund“ ist für διαθήκη in diesem Kontext zutreffend. „Ausgegossen“ erhält das Bild des griechischen Verbs, ohne es zu einer stärker traditionell geprägten Deutung wie „vergossen“ einzuengen. „Für viele“ wahrt die Formulierung des Ausgangstextes und legt keine weitergehende theologische Folgerung fest.
