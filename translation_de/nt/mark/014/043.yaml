id: MRK.14.43
reference: Mark 14:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: de
  text: Und sofort, noch während er redete, kam Judas, einer der Zwölf. Mit ihm kam eine Menschenmenge, mit Schwertern und Knüppeln bewaffnet, von den führenden Priestern, den Schriftgelehrten und den Ältesten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Von“ bezeichnet hier die Herkunft beziehungsweise Beauftragung der Menschenmenge. Möglich ist daher auch: „gesandt von den führenden Priestern, den Schriftgelehrten und den Ältesten“.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus typische zeitliche Dringlichkeit in natürlichem modernem Deutsch.
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: noch während er redete
  rationale: Gibt den Genitivus absolutus und die Gleichzeitigkeit samt ἔτι knapp und idiomatisch wieder.
- source_word: παραγίνεται
  choice: kam
  rationale: Das historische Präsens wird entsprechend üblicher deutscher Erzählweise im Präteritum wiedergegeben; „kam“ wahrt die Bewegungsbedeutung ohne zusätzliche Deutung.
- source_word: εἷς τῶν δώδεκα
  choice: einer der Zwölf
  rationale: Bewahrt die kompakte, titelartige Bezeichnung der griechischen Vorlage, ohne „Jünger“ ergänzend einzufügen.
- source_word: ὄχλος
  choice: Menschenmenge
  rationale: Gibt den neutralen lexikalischen Grundsinn wieder; die feindselige Absicht ergibt sich aus dem Zusammenhang, ohne durch „Mob“ vorweggenommen zu werden.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: mit Schwertern und Knüppeln bewaffnet
  rationale: μάχαιραι bezeichnet hier Schwerter beziehungsweise kurze Schwerter; ξύλα meint im Waffenkontext hölzerne Schlagwaffen. „bewaffnet“ macht die instrumentale Funktion im Deutschen natürlich deutlich.
- source_word: ἀρχιερέων
  choice: führenden Priestern
  rationale: Der Plural bezeichnet die hohepriesterliche Führungsschicht und nicht mehrere gleichzeitig amtierende Hohepriester; die Formulierung ist für heutige Leser verständlich.
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: Entspricht der etablierten und direkten deutschen Bezeichnung für diese sachkundigen Ausleger des Gesetzes.
- source_word: πρεσβυτέρων
  choice: Ältesten
  rationale: Bewahrt die institutionelle Bezeichnung anerkannter jüdischer Führungspersonen.
theological_decisions:
- issue: Historisches Präsens παραγίνεται
  choice: Präteritum „kam“
  alternative: Präsens „kommt“
  rationale: Das griechische historische Präsens belebt die Szene; im modernen deutschen Erzählstil ist hier das Präteritum natürlicher, ohne den Inhalt zu verändern.
- issue: Bedeutung von παρά mit Genitiv bei den Autoritäten
  choice: „von den führenden Priestern, den Schriftgelehrten und den Ältesten“
  alternative: „gesandt von den führenden Priestern, den Schriftgelehrten und den Ältesten“
  rationale: Die Präposition bezeichnet Herkunft beziehungsweise institutionelle Autorisierung, sagt aber nicht ausdrücklich, auf welche Weise die Gruppe entsandt wurde. Die direktere Formulierung wahrt diese Offenheit.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung „kam … kam“ strukturiert den langen griechischen Satz lesefreundlich. „Menschenmenge“ vermeidet die stärkere Vorwertung „Mob“; „Knüppel“ gibt das wörtliche „Holz/Hölzer“ im Waffenkontext sachgerecht wieder.
