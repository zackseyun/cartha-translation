  source_fidelity: 'Der Text gibt alle Satzglieder der griechischen Vorlage zuverlässig wieder: εὐθύς („sofort“), die Gleichzeitigkeit von ἔτι αὐτοῦ λαλοῦντος, Judas als „einer der Zwölf“, die bewaffnete Menge sowie ihre Zuordnung zu den führenden jüdischen Autoritäten. „Mit Schwertern und Knüppeln bewaffnet“ ist im gegebenen Waffenkontext eine natürliche und sachlich gedeckte Wiedergabe von μετὰ μαχαιρῶν καὶ ξύλων. „Von“ bewahrt die offene Herkunfts- bzw. Autorisierungsrelation von παρά mit Genitiv, ohne eine ausdrückliche Entsendung zu behaupten.'
