  terminology: „Einer der Zwölf“, „Schriftgelehrte“ und „Älteste“ entsprechen den etablierten deutschen Bibeltermini. „Führende Priester“ vermittelt bei pluralischem ἀρχιερεῖς sachgerecht die gemeinte priesterliche Führungsschicht, ohne fälschlich mehrere amtierende Hohepriester nahezulegen.
