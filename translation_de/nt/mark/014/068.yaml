  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: de
  text: 'Er aber stritt es ab und sagte: „Ich weiß nicht und verstehe auch nicht, was du sagst.“ Dann ging er hinaus in den Vorhof, und ein Hahn krähte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen die Worte „und ein Hahn krähte“ aus.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: stritt es ab
  rationale: Das Medium bezeichnet hier das Leugnen beziehungsweise Bestreiten der gerade erhobenen Behauptung. „Stritt es ab“ ist im Deutschen idiomatisch und vermeidet die stärkere Auslegung „verleugnete ihn“, da Jesus in diesem Satz nicht ausdrücklich als Objekt genannt wird.
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: Ich weiß nicht und verstehe auch nicht
  rationale: Die beiden Verben steigern die Zurückweisung. Die deutsche Formulierung bewahrt die Doppelung von Wissen und Verstehen, ohne unnatürlich zu klingen.
- source_word: σὺ τί λέγεις
  choice: wovon du redest
  rationale: Die Wendung bedeutet wörtlich etwa „was du sagst“. Im Zusammenhang einer bestrittenen Anschuldigung ist „wovon du redest“ natürliches modernes Deutsch und wahrt den Sinn, ohne den Gegenstand näher festzulegen.
- source_word: ἐξῆλθεν ἔξω
  choice: ging er hinaus
  rationale: „Hinausgehen“ gibt die durch Verb und Adverb betonte Bewegung nach außen knapp und idiomatisch wieder.
- source_word: προαύλιον
  choice: Vorhof
  rationale: Der Ausdruck bezeichnet den vorgelagerten Bereich vor dem inneren Hof beziehungsweise am Eingang. „Vorhof“ bewahrt diese räumliche Unterscheidung.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: ein Hahn krähte
  rationale: Dies ist die natürliche deutsche Wiedergabe. Der unbestimmte Artikel entspricht zugleich dem artikellosen griechischen Substantiv.
theological_decisions:
- issue: Aufnahme der Klausel καὶ ἀλέκτωρ ἐφώνησεν
  choice: 'Im Haupttext aufgenommen: „und ein Hahn krähte“'
  alternative: Die Klausel auslassen
  rationale: Der vorgegebene SBLGNT-Text führt die Klausel als textkritisch unsichere Lesart. Sie wird daher übersetzt und ihre Überlieferungsunsicherheit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Peters Antwort klingt als direkte, nachdrückliche Zurückweisung natürlich; „Vorhof“ erhält die räumliche Präzision des Ausgangstextes.
