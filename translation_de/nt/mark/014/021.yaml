    issue: Die Wendung „Es wäre gut für ihn“ gibt die idiomatische Spitze von καλὸν αὐτῷ εἰ ... im Deutschen nur abgeschwächt wieder.
    rationale: Obwohl καλόν formal „gut“ bedeutet, ist die gesamte griechische Konstruktion eine konventionelle nachdrückliche Wertung; „Es wäre besser für ihn, wenn ...“ gibt sie im modernen Deutschen natürlich und präzise wieder, ohne eine lehrmäßige Deutung hinzuzufügen.
  - severity: low
    issue: Der Fußnotenanker steht nach dem Ausrufezeichen statt direkt beim erläuterten Verb.
    rationale: Da die Fußnote ausschließlich die lexikalische Alternative zu „ausgeliefert wird“ erklärt, sollte ihr Anker unmittelbar diesem Ausdruck folgen.
