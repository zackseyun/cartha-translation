  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: de
  text: Denn der Menschensohn geht dahin, wie über ihn geschrieben steht; doch wehe jenem Menschen, durch den der Menschensohn ausgeliefert wird[a]. Es wäre besser für ihn, wenn jener Mensch nicht geboren worden wäre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verraten wird“. Wörtlicher bezeichnet das griechische Verb ein Übergeben oder Ausliefern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Denn
  rationale: Leitet hier die Begründung bzw. Erläuterung der vorausgehenden Aussage Jesu ein und gibt die kausale Kraft natürlich wieder.
- source_word: ὁ μὲν ... δὲ
  choice: geht dahin ... doch wehe
  rationale: Die Gegenüberstellung wird im Deutschen idiomatisch durch „doch“ ausgedrückt; μέν bleibt wie häufig unausgesprochen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Bewahrt Jesu etablierte Selbstbezeichnung und ihre mögliche Anspielung auf Daniel.
- source_word: ὑπάγει
  choice: geht dahin
  rationale: Gibt die Bewegung auf den bevorstehenden Tod hin wieder, ohne das Ziel ausdrücklich in den Text einzutragen.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: wie über ihn geschrieben steht
  rationale: Bewahrt den Vergleich sowie den bleibenden Geltungsanspruch des Perfekts γέγραπται in natürlichem Bibeldeutsch.
- source_word: οὐαὶ
  choice: wehe
  rationale: Die herkömmliche und treffende prophetische Weheformel bewahrt den ernsten Gerichtscharakter.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: jenem Menschen
  rationale: Gibt den demonstrativen Ausdruck präzise wieder und vermeidet das im modernen Deutschen potenziell distanzierende „Mann“, obwohl im Kontext Judas gemeint ist.
- source_word: δι’ οὗ
  choice: durch den
  rationale: Bewahrt die durch διά mit Genitiv ausgedrückte Vermittlung bzw. Agency.
- source_word: παραδίδοται
  choice: ausgeliefert wird
  rationale: Gibt die Grundbedeutung „übergeben, ausliefern“ wieder und bewahrt den wiederkehrenden Wortlaut der Passionsüberlieferung; die verräterische Dimension ergibt sich aus dem Kontext.
- source_word: καλὸν αὐτῷ
  choice: Es wäre gut für ihn
  rationale: Bildet zusammen mit der irrealen Bedingung eine klare kontrafaktische Aussage, ohne das wertende καλόν zu „besser“ zu steigern.
- source_word: εἰ οὐκ ἐγεννήθη
  choice: wenn ... nicht geboren worden wäre
  rationale: Gibt die irreale Bedingung der Vergangenheit präzise und idiomatisch wieder.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: jener Mensch
  rationale: Bewahrt die feierlich-ernste Wiederholung des Demonstrativausdrucks.
theological_decisions:
- issue: Wiedergabe von παραδίδοται im Passionskontext
  choice: ausgeliefert wird
  alternative: verraten wird
  rationale: Die Grundbedeutung des Verbs und seine breitere Verwendung in der Passion werden im Haupttext sichtbar gehalten. Zugleich wird die kontextuell klare Bedeutung „verraten“ in einer Fußnote genannt.
- issue: Göttliche Bestimmung und menschliche Verantwortung
  choice: wie über ihn geschrieben steht; doch wehe jenem Menschen
  alternative: keine Auflösung der Spannung durch erklärende Zusätze
  rationale: 'Der Text hält beides nebeneinander: Das Geschick des Menschensohnes entspricht der Schrift, und der handelnde Mensch bleibt verantwortlich. Die Übersetzung löst diese Spannung nicht einseitig auf.'
- issue: καλὸν als „gut“ oder idiomatisch „besser“
  choice: gut
  alternative: besser
  rationale: „Gut“ entspricht καλόν formal genauer. Die kontrafaktische Konstruktion vermittelt auch ohne Komparativ die gemeinte negative Bewertung seiner Geburt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geht dahin“ wahrt die zurückhaltende Bildlichkeit von ὑπάγει; „geschrieben steht“ entspricht etabliertem, weiterhin gut verständlichem Schriftregister. Die wiederholte Formulierung „jener Mensch“ erhält die feierliche Eindringlichkeit des griechischen Textes.
