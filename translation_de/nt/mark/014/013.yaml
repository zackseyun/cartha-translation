  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: de
  text: 'Und er schickt zwei seiner Jünger los und sagt zu ihnen: „Geht in die Stadt. Ein Mann wird euch begegnen, der einen Krug mit Wasser[a] trägt. Folgt ihm.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Tonkrug mit Wasser“.'
    reason: Lexikalische Alternative zu κεράμιον ὕδατος; κεράμιον kann ein Gefäß aus Ton bezeichnen.
lexical_decisions:
- source_word: ἀποστέλλει
  choice: schickt ... los
  rationale: Das Präsens bewahrt Markus’ anschauliches historisches Präsens; „losschicken“ gibt den Sendungsaspekt im modernen Deutschen natürlich wieder.
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: zwei seiner Jünger
  rationale: Die partitive Konstruktion wird im Deutschen idiomatisch mit „zwei seiner Jünger“ wiedergegeben; „Jünger“ ist hier die etablierte und sachlich passende Entsprechung.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens erhält entsprechend dem griechischen Text das historische Präsens.
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: Geht in die Stadt
  rationale: Die Formulierung gibt den Imperativ und die durch εἰς bezeichnete Bewegung in die Stadt klar und idiomatisch wieder.
- source_word: ἀπαντήσει ὑμῖν
  choice: Dort wird euch ... begegnen
  rationale: „Begegnen“ verlangt im Deutschen den Dativ und trifft den zukünftigen Vorgang natürlich; „dort“ verdeutlicht lediglich den durch den vorigen Satz gesetzten Ort.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Im Kontext bezeichnet das maskuline Substantiv einen konkreten männlichen Menschen.
- source_word: κεράμιον ὕδατος
  choice: einen Wasserkrug[a]
  rationale: „Wasserkrug“ ist knappes, natürliches Deutsch; das Gefäß kann genauer als Tonkrug verstanden werden, was in der Fußnote festgehalten wird.
- source_word: βαστάζων
  choice: trägt
  rationale: Das finite deutsche Relativsatzverb gibt das gleichzeitig stattfindende Tragen des griechischen Partizips natürlich wieder.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Folgt ihm
  rationale: Der direkte Imperativ bewahrt die klare Aufforderung des Ausgangstextes.
