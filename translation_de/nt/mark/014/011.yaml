  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: de
  text: Als sie das hörten, freuten sie sich und versprachen, ihm Geld[a] zu geben. Und er suchte danach, wie er ihn bei günstiger Gelegenheit ausliefern[b] könnte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Silber. Das griechische Wort kann das Edelmetall oder allgemein Geld bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: verraten; auch: übergeben. Das griechische Verb bezeichnet ein Übergeben oder Ausliefern; im Zusammenhang mit Judas hat die Handlung verräterischen Charakter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: Als sie das hörten
  rationale: Das substantivierte Partizip mit δέ bezeichnet die zeitliche Reaktion der führenden Priester. „Das“ nimmt im Deutschen natürlich den vorausgehenden Vorschlag des Judas auf.
- source_word: ἐχάρησαν
  choice: freuten sie sich
  rationale: Die Form von χαίρω bezeichnet ihre Freude über das Gehörte. Die idiomatische deutsche Wendung bewahrt die moralisch auffällige Reaktion, ohne sie zusätzlich zu bewerten.
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: versprachen, ihm Geld zu geben
  rationale: ἐπαγγέλλομαι bedeutet hier „versprechen“ oder „zusagen“. ἀργύριον bezeichnet wörtlich Silber, im Kontext einer Bezahlung jedoch natürlich Geld; weder Betrag noch Münzart werden genannt.
- source_word: ἐζήτει
  choice: er suchte danach
  rationale: Der Imperfekt beschreibt ein fortdauerndes Bemühen. Die Formulierung gibt diesen Verlauf wieder, ohne die nicht zwingend festgelegte inchoative Deutung („er begann zu suchen“) zum Haupttext zu machen.
- source_word: πῶς … εὐκαίρως
  choice: wie … bei günstiger Gelegenheit
  rationale: πῶς fragt nach Art und Weise beziehungsweise Möglichkeit; εὐκαίρως bezeichnet einen passenden, günstigen Zeitpunkt. Die Formulierung ist im Deutschen natürlich und lässt die näheren Umstände offen.
- source_word: παραδοῖ
  choice: ausliefern könnte
  rationale: παραδίδωμι bezeichnet grundlegend das Übergeben beziehungsweise Ausliefern. „Ausliefern“ bewahrt diesen konkreten Sinn und lässt zugleich im Judas-Kontext den verräterischen Charakter erkennen.
theological_decisions:
- issue: Wiedergabe von παραδίδωμι bei der Handlung des Judas
  choice: ausliefern
  alternative: verraten; übergeben
  rationale: „Ausliefern“ hält die Grundbedeutung des Verbs fest und passt zur Übergabe Jesu an seine Gegner. „Verraten“ macht den treulosen Charakter stärker ausdrücklich, während „übergeben“ neutraler klingt. Die Fußnote bewahrt diese kontextuelle Bedeutungsbreite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der fortdauernde Aspekt von ἐζήτει wird bewahrt; die lexikalische Mehrdeutigkeit von ἀργύριον und παραδίδωμι wird durch korrekt platzierte Fußnoten sichtbar gemacht.
