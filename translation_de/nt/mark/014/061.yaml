id: MRK.14.61
reference: Mark 14:61
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: de
  text: 'Doch er schwieg und antwortete nichts. Wieder fragte ihn der Hohepriester und sagt zu ihm: »Bist du der Messias[a], der Sohn des Hochgelobten[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Christus«. Das griechische Χριστός (Christos) bezeichnet hier den verheißenen Messias.
    reason: alternative_reading
  - marker: b
    text: »Der Hochgelobte« ist eine ehrfürchtige jüdische Umschreibung für Gott.
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: schwieg
  rationale: Das Imperfekt beschreibt sein anhaltendes Schweigen; im Deutschen gibt »schwieg« dies im Erzählzusammenhang natürlich wieder.
- source_word: ἀπεκρίνατο οὐδέν
  choice: antwortete nichts
  rationale: Die Formulierung bewahrt die nachdrückliche vollständige Verneinung und klingt zugleich in modernem Deutsch natürlich.
- source_word: πάλιν
  choice: Wieder
  rationale: Kennzeichnet knapp und idiomatisch, dass der Hohepriester die Befragung fortsetzt beziehungsweise erneut ansetzt.
- source_word: ἀρχιερεὺς
  choice: Hohepriester
  rationale: Die übliche und genaue deutsche Bezeichnung für dieses jüdische Priesteramt.
- source_word: ἐπηρώτα
  choice: fragte
  rationale: Das Imperfekt steht im Rahmen der fortgesetzten Befragung. »Fragte« ist natürlich und lässt den gerichtlichen Zusammenhang aus dem Kontext hervorgehen, ohne die Intensität durch »verhörte« zu überzeichnen.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt Markus’ anschauliches historisches Präsens auch nach einem Verb in der Vergangenheit.
- source_word: χριστός
  choice: Messias
  rationale: Hier ist Χριστός ein messianischer Titel im jüdischen Verhörkontext; »Messias« macht diese Funktion unmittelbarer deutlich als das im Deutschen teils namenhaft verstandene »Christus«.
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: der Sohn des Hochgelobten
  rationale: »Der Hochgelobte« bewahrt die ehrfürchtige jüdische Umschreibung für Gott, ohne das indirekte griechische Ausdrucksweise aufzulösen.
theological_decisions:
- issue: Wiedergabe von Χριστός als direkter messianischer Titel
  choice: Messias
  alternative: Christus
  rationale: Im jüdischen Prozesszusammenhang fungiert der Ausdruck als Titel. »Messias« bewahrt diesen Sinn, während die traditionelle Alternative in einer Fußnote genannt wird.
- issue: Wiedergabe von τοῦ εὐλογητοῦ
  choice: des Hochgelobten
  alternative: Gottes
  rationale: Die ehrfürchtige Umschreibung wird im Haupttext erhalten, statt sie durch die ausdrücklichere, aber interpretierende Bezeichnung »Gott« zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens in »sagt« erhält den markinischen Erzählstil. »Hochgelobter« ist leicht gehoben, aber als bewusste Gottesumschreibung verständlich und wird durch die Fußnote erläutert.
