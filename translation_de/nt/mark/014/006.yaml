  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: de
  text: 'Jesus aber sagte: „Lasst sie in Ruhe! Warum macht ihr ihr Schwierigkeiten? Sie hat etwas Schönes für mich getan.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie hat eine gute Tat an mir vollbracht.“ Das Griechische kann hier formnäher „an mir“ wiedergegeben werden.'
    reason: καλός kann „schön“ oder „gut“ bedeuten; ἔργον kann als „Tat“ wiedergegeben werden. ἐν ἐμοί lautet wörtlich etwa „an mir“ und wird im Haupttext idiomatisch als „für mich“ ausgedrückt.
lexical_decisions:
- source_word: ὁ δὲ Ἰησοῦς εἶπεν
  choice: Jesus aber sagte
  rationale: δέ markiert hier den Gegensatz zwischen der Kritik und Jesu Antwort; die nachgestellte deutsche Partikel „aber“ gibt diesen Erzählfortgang natürlich wieder.
- source_word: Ἄφετε αὐτήν
  choice: Lasst sie in Ruhe!
  rationale: Der Aoristimperativ fordert dazu auf, das gegenwärtige Behelligen sofort zu beenden. „Lasst sie in Ruhe“ ist im modernen Deutsch klar, idiomatisch und bewahrt den schützenden Ton.
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: Warum macht ihr ihr Schwierigkeiten?
  rationale: Die Wendung bezeichnet das Bereiten von Mühe, Belastung oder Verdruss. „Schwierigkeiten machen“ erhält das Bild der verursachten Belastung besser als das schwächere „stören“.
- source_word: καλὸν ἔργον
  choice: ein schönes Werk
  rationale: καλός umfasst hier das Gute, Schöne und anerkennenswert Angemessene. „Schönes Werk“ bewahrt diese positive Mehrdeutigkeit, ohne den Ausdruck bloß moralisch zu verengen.
- source_word: ἠργάσατο
  choice: hat … getan
  rationale: Das Verb bezeichnet das Vollbringen einer Tat. Im Deutschen ist „ein Werk tun“ zwar gehoben, aber verständlich und bildet die Verbindung mit ἔργον eng ab.
- source_word: ἐν ἐμοί
  choice: an mir
  rationale: „An mir“ ist im Deutschen eine natürliche, zugleich relativ formnahe Wiedergabe von ἐν ἐμοί und passt zur im Kontext an Jesus vollzogenen Salbung. Es vermeidet die stärkere Abstraktion „für mich“.
theological_decisions:
- issue: Wertungsbreite von καλὸν ἔργον
  choice: „ein schönes Werk“
  alternative: „ein gutes Werk“ oder „eine edle Tat“
  rationale: „Schön“ hält neben der moralischen Güte auch die Angemessenheit und besondere Schönheit der Handlung offen. Damit wird weder eine Verdienstlehre eingetragen noch Jesu Anerkennung abgeschwächt.
- issue: Beziehung der Handlung zu Jesus in ἐν ἐμοί
  choice: „an mir“
  alternative: „für mich“, „mir“ oder wörtlich „in mir“
  rationale: „An mir“ wahrt den konkreten Bezug der Handlung auf Jesu Person und den Salbungskontext, ohne eine weitergehende theologische Deutung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die leicht gehobene Wendung „ein schönes Werk an mir getan“ bewahrt die Struktur und Bedeutungsbreite des Griechischen; die Fußnote nennt eine natürlichere lexikalische Alternative.
