  text: ὁ δὲ καταλιπὼν τὴν σινδόνα γυμνὸς ⸀ἔφυγεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/052.yaml
  text: But he left the linen cloth behind and fled naked[a][b].
translation:
  language: de
  text: Er aber ließ das Leinentuch zurück und floh nackt.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für „Leinentuch“ (σινδόνα) auch: „Leinentuch zum Umhüllen“ oder „Leinengewand“.'
    reason: lexical_alternative
  - marker: b
    text: „Nackt“ (γυμνός) kann in manchen Zusammenhängen auch „ungenügend bekleidet“ bedeuten; hier besagt es unmittelbar, dass er ohne das Tuch entkam.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: δέ setzt die Flucht des jungen Mannes leicht kontrastierend beziehungsweise erzählerisch fort; „aber“ gibt die Wendung natürlich wieder.
- source_word: καταλιπὼν
  choice: ließ … zurück
  rationale: Das Aoristpartizip von καταλείπω bezeichnet hier, dass er das Tuch zurückließ, um zu entkommen. Die finite deutsche Konstruktion ist natürlich und wahrt die zeitliche Abfolge.
- source_word: σινδόνα
  choice: Leinentuch
  rationale: σινδών bezeichnet ein Tuch aus Leinen, das auch als Umhüllung oder Kleidungsstück dienen konnte. „Leinentuch“ lässt seine genaue Form offen.
- source_word: γυμνὸς
  choice: nackt
  rationale: 'γυμνός bedeutet hier am naheliegendsten „nackt“: Nachdem er das einzige erwähnte Tuch zurückgelassen hatte, floh er ohne dieses.'
- source_word: ἔφυγεν
  choice: floh
  rationale: φεύγω bezeichnet eine eilige Flucht; „floh“ ist knapp, würdevoll und entspricht dem narrativen Aorist.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die genaue Form und Funktion der σινδών wird nicht überbestimmt.
