  source_fidelity: Die Übersetzung gibt den erzählerischen Gegensatz bzw. Anschluss von δέ („aber“), das Zurücklassen (καταλιπών), die bewusst allgemein gehaltene σινδών („Leinentuch“), γυμνός („nackt“) und die dringliche Flucht (ἔφυγεν, „floh“) sachgerecht wieder. Die deutsche finite Satzkonstruktion bildet die vom Partizip ausgedrückte Begleithandlung idiomatisch ab.
