source:
  edition: SBLGNT
  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: de
  text: 'Derjenige, der ihn auslieferte, hatte ihnen ein Erkennungszeichen[a] gegeben und gesagt: »Der, den ich küssen werde[b], der ist es. Ergreift ihn und führt ihn sicher ab.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein verabredetes Zeichen«. Gemeint ist ein zuvor vereinbartes Signal, durch das Jesus eindeutig identifiziert werden sollte.'
    reason: lexical_alternative
  - marker: b
    text: Ein Kuss war eine übliche Form der Begrüßung; hier diente er als Erkennungszeichen.
    reason: cultural_note
  - marker: c
    text: 'Oder: »führt ihn so ab, dass er sicher unter Kontrolle bleibt«. Das griechische Wort kann auch »sicher« oder »ohne Gefahr« bedeuten.'
    reason: alternative_reading
lexical_decisions:
- source_word: δεδώκει
  choice: hatte … vereinbart
  rationale: Der griechische Plusquamperfekt bezeichnet eine schon vor der Festnahme getroffene Abmachung. Zusammen mit σύσσημον ist im Deutschen „ein Erkennungszeichen vereinbaren“ natürlicher und sachlich genauer als „ein Zeichen geben“.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: der ihn auslieferte
  rationale: Die substantivierte Partizipialkonstruktion bleibt erhalten. „Ausliefern“ gibt die konkrete Übergabe Jesu in die Gewalt seiner Gegner wieder, ohne die im Kontext vorhandene Dimension des Verrats auszuschließen.
- source_word: σύσσημον
  choice: Erkennungszeichen
  rationale: Das Wort bezeichnet hier ein verabredetes Signal zur eindeutigen Identifizierung. „Erkennungszeichen“ macht diese Funktion im Deutschen klar.
- source_word: Ὃν ἂν φιλήσω
  choice: Der, den ich küssen werde
  rationale: Die unbestimmte Relativkonstruktion mit ἄν und der Aorist Konjunktiv bezieht sich auf die bevorstehende identifizierende Handlung. Das Futur klingt in der angekündigten wörtlichen Rede natürlich.
- source_word: αὐτός ἐστιν
  choice: der ist es
  rationale: Die Wiederaufnahme mit „der“ bewahrt die nachdrückliche Identifizierung des griechischen αὐτός.
- source_word: κρατήσατε
  choice: Nehmt ihn fest
  rationale: Im Festnahmekontext bezeichnet κρατέω ein gewaltsames Ergreifen und Festhalten. „Festnehmen“ ist idiomatisch, lässt aber den körperlichen Zugriff erkennen.
- source_word: ἀπάγετε
  choice: führt ihn … ab
  rationale: „Abführen“ entspricht der Bewegung vom Ort weg und ist im Zusammenhang einer Festnahme natürlich.
- source_word: ἀσφαλῶς
  choice: sicher
  rationale: Das Adverb kann „sicher“ oder „zuverlässig unter Kontrolle“ bedeuten. Im Kontext geht es wahrscheinlich darum, Jesu Entkommen zu verhindern; die knappe Wiedergabe wahrt zugleich die lexikalische Offenheit.
theological_decisions:
- issue: Bedeutung von παραδίδωμι im Passionsbericht
  choice: auslieferte
  alternative: verriet
  rationale: „Ausliefern“ bildet die konkrete Übergabe in fremde Gewalt ab und lässt die moralische Bedeutung des Verrats aus dem Erzählzusammenhang hervorgehen, statt sie im Verb allein festzuschreiben.
- issue: Bezug von ἀσφαλῶς
  choice: sicher abführen
  alternative: unversehrt abführen
  rationale: Der Festnahmekontext legt sichere Verwahrung beziehungsweise feste Kontrolle näher als die Sorge um Jesu körperliches Wohlergehen; die Formulierung „sicher“ bewahrt jedoch die mögliche Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und befehlend. „Erkennungszeichen vereinbart“ gibt die Vorzeitigkeit und den verabredeten Charakter idiomatisch wieder; die Fußnoten bewahren relevante lexikalische und kulturelle Informationen.
