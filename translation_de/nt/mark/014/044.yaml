  rationale: Die Revision stellt den Empfängerbezug von δεδώκει („hatte ihnen ... gegeben“) wieder her, erhält die Vorzeitigkeit und belässt die Vereinbarungsdimension von σύσσημον in der Fußnote. Sie gibt κρατήσατε mit dem unmittelbareren „Ergreift ihn“ wieder. Der Fußnotenanker zur kulturellen Erklärung steht nun direkt bei „küssen werde“; der Anker zu ἀσφαλῶς bleibt bei der abschließenden Befehlsformulierung.
