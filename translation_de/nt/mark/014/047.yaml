  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: de
  text: Doch einer von denen, die dabeistanden, zog sein Schwert, schlug den Sklaven[a] des Hohenpriesters und hieb ihm das Ohr ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diener“. Das griechische Wort bezeichnet einen Sklaven beziehungsweise einen unfreien Diener.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: Doch einer
  rationale: Die idiomatische Verbindung bezeichnet unbestimmt eine einzelne Person aus der Gruppe. „Doch“ gibt δέ als leichten erzählerischen Gegensatz wieder, ohne die Person näher zu bestimmen.
- source_word: τῶν παρεστηκότων
  choice: von denen, die dabeistanden
  rationale: Das Partizip bezeichnet die dort Stehenden beziehungsweise Anwesenden. „Die dabeistanden“ bewahrt den räumlichen Gehalt und klingt im modernen Deutsch natürlich.
- source_word: σπασάμενος τὴν μάχαιραν
  choice: zog sein Schwert
  rationale: σπάομαι bezeichnet bei einer Waffe das Ziehen; μάχαιρα kann Schwert, Kurzschwert oder größeres Messer bedeuten. „Schwert“ ist hier die klare, traditionelle Sachentsprechung. Der deutsche Possessivartikel gibt die idiomatisch vorausgesetzte Zuordnung wieder.
- source_word: ἔπαισεν
  choice: schlug auf ... ein
  rationale: παίω bezeichnet einen gewaltsamen Schlag. Zusammen mit dem anschließenden Abhauen des Ohres macht „schlug auf ... ein“ den Angriff natürlich und anschaulich wieder.
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: den Sklaven des Hohen Priesters
  rationale: δοῦλος bezeichnet hier eine rechtlich und sozial untergeordnete Person im Haushalt beziehungsweise Machtbereich des Hohen Priesters. „Sklave“ bewahrt diesen Status deutlicher als das weichere „Diener“.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: hieb ihm das Ohr ab
  rationale: ἀφαιρέω bedeutet grundsätzlich wegnehmen oder entfernen, bezeichnet hier aber als Folge des Schwerthiebs das Abtrennen. „Hieb ... ab“ ist präzise und verbindet Ursache und Ergebnis. Das Diminutiv ὠτάριον wird im Deutschen schlicht mit „Ohr“ wiedergegeben.
theological_decisions:
- issue: Wiedergabe von δοῦλος als sozialem Statusbegriff
  choice: Sklave
  alternative: Diener
  rationale: Der Kontext beschreibt die Zugehörigkeit und Unterordnung gegenüber dem Hohen Priester. „Sklave“ wahrt die historische soziale Realität, während „Diener“ den Status abschwächen könnte; die geläufige Alternative wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Die Satzfolge bleibt zügig und handlungsorientiert; weder die Identität des Angreifers noch die in Parallelberichten genannte Seite des Ohres wird ergänzt.
