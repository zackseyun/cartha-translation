  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: de
  text: Tag für Tag war ich bei euch im Tempel[a] und lehrte, und ihr habt mich nicht ergriffen.[b] Doch dies geschieht, damit die Schriften erfüllt werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Tempel“ ist hier die gesamte Tempelanlage mit ihren Vorhöfen gemeint, nicht nur das innere Heiligtum.
    reason: cultural_note
  - marker: b
    text: 'Oder: „ihr habt mich nicht festgenommen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Doch damit die Schriften erfüllt werden.“ Im Griechischen ist der Satz verkürzt; der Hauptsatz bleibt unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Tag für Tag
  rationale: Die distributive Wendung bezeichnet ein wiederholtes tägliches Geschehen. „Tag für Tag“ ist natürliches Deutsch und hebt die fortgesetzte öffentliche Anwesenheit Jesu hervor.
- source_word: ἤμην πρὸς ὑμᾶς
  choice: war ich bei euch
  rationale: πρός mit Personen bezeichnet hier die Anwesenheit in ihrer Nähe beziehungsweise unter ihnen. „Bei euch“ gibt dies idiomatisch wieder.
- source_word: ἐν τῷ ἱερῷ
  choice: im Tempel
  rationale: ἱερόν bezeichnet hier die gesamte Tempelanlage, nicht ausschließlich das innere Heiligtum. Die übliche deutsche Bezeichnung „Tempel“ bleibt im Haupttext erhalten; eine Fußnote präzisiert den Umfang.
- source_word: διδάσκων
  choice: und lehrte
  rationale: Das Präsenspartizip beschreibt Jesu fortdauernde Tätigkeit während seiner Anwesenheit. Die finite Koordination klingt im Deutschen natürlich und bewahrt den zeitlichen Zusammenhang.
- source_word: οὐκ ἐκρατήσατέ με
  choice: ihr habt mich nicht ergriffen
  rationale: κρατέω kann ein gewaltsames Ergreifen und im Kontext auch eine Festnahme bezeichnen. „Ergriffen“ bewahrt beide Aspekte besser als der enger gefasste Rechtsbegriff „festgenommen“.
- source_word: ἀλλ’ ἵνα
  choice: Doch dies geschieht, damit
  rationale: Nach ἀλλά folgt im Griechischen elliptisch ein ἵνα-Satz ohne ausdrücklichen Hauptsatz. Für verständliches modernes Deutsch wird die kontextuell vorausgesetzte Aussage knapp mit „dies geschieht“ ergänzt; die Ellipse wird in einer Fußnote offengelegt.
- source_word: πληρωθῶσιν
  choice: erfüllt werden
  rationale: Der Aorist Passiv Konjunktiv nach ἵνα wird mit einer deutschen damit-Konstruktion und Passiv wiedergegeben. So bleibt offen, ob Zweck oder Ergebnis stärker betont ist.
- source_word: αἱ γραφαί
  choice: die Schriften
  rationale: Der Plural bezeichnet die als heilig anerkannten Schriften Israels. „Die Schriften“ wahrt den griechischen Plural, statt ihn zur geläufigen deutschen Einzahl „die Schrift“ zu vereinheitlichen.
theological_decisions:
- issue: Elliptischer ἵνα-Satz und göttlicher Zweck
  choice: Doch dies geschieht, damit die Schriften erfüllt werden.
  alternative: Doch damit die Schriften erfüllt werden. / Doch die Schriften sollen erfüllt werden.
  rationale: Das Griechische lässt den Hauptsatz unausgesprochen. Die Ergänzung „dies geschieht“ macht den Satz im Deutschen verständlich, ohne ein ausdrückliches „muss“ einzuführen oder die Spannung zwischen Zweck und Ergebnis einseitig aufzulösen. Die Fußnote dokumentiert die Ellipse.
- issue: Singular oder Plural bei αἱ γραφαί
  choice: die Schriften
  alternative: die Schrift
  rationale: Der Ausgangstext hat ausdrücklich den Plural. Dessen Beibehaltung verhindert, dass eine im Deutschen traditionelle theologische Sammelbezeichnung an die Stelle der grammatischen Form des Quelltexts tritt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „Tag für Tag“ und „bei euch“ sind allgemein verständlich; „ergriffen“ hält die körperliche und die rechtliche Bedeutung des Verbs offen. Der Plural „die Schriften“ folgt bewusst dem griechischen Wortlaut. Alle Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Stelle.
