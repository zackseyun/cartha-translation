id: MRK.14.69
reference: Mark 14:69
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: de
  text: 'Und als die junge Dienerin ihn sah, begann sie wieder, zu den Umstehenden zu sagen: »Dieser Mann ist einer von ihnen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: Dienerin
  rationale: Bezeichnet hier eine junge weibliche Dienstperson. »Dienerin« ist im modernen Deutschen natürlich und lässt offen, ob sie rechtlich eine Sklavin war; dieser Status steht an dieser Stelle nicht im Mittelpunkt.
- source_word: ἰδοῦσα
  choice: als … sah
  rationale: Der Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben und bezeichnet den Umstand, der ihr erneutes Reden auslöst.
- source_word: ἤρξατο πάλιν λέγειν
  choice: begann sie wieder … zu sagen
  rationale: Bewahrt sowohl den Beginn der Handlung als auch das ausdrücklich genannte »wieder«.
- source_word: τοῖς παρεστῶσιν
  choice: zu den Umstehenden
  rationale: Gibt die anwesenden beziehungsweise dabeistehenden Personen knapp und idiomatisch wieder, ohne eine zusätzliche räumliche Bestimmung einzutragen.
- source_word: Οὗτος
  choice: Dieser Mann
  rationale: Das Demonstrativpronomen weist direkt auf Petrus; »Mann« wird für ein natürliches deutsches Verständnis ergänzt, ohne einen abwertenden Unterton hinzuzufügen.
- source_word: ἐξ αὐτῶν
  choice: ist einer von ihnen
  rationale: Entspricht der idiomatischen Aussage über die Zugehörigkeit zu der zuvor gemeinten Gruppe.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die griechische Reihenfolge und Wiederholungsstruktur bleiben soweit möglich erkennbar, während der Partizipialsatz natürlich ins Deutsche übertragen wird.
