  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: de
  text: 'Während sie aßen, nahm er Brot, sprach den Segen, brach es, gab es ihnen und sagte: »Nehmt; das ist mein Leib[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das stellt meinen Leib dar« oder »Das bedeutet: mein Leib.« Im Griechischen steht wörtlich: »Das ist mein Leib.«'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: Während sie aßen
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet eine gleichzeitig andauernde Handlung. »Während sie aßen« gibt dies natürlich und präzise wieder.
- source_word: λαβὼν ἄρτον
  choice: nahm er Brot
  rationale: Das Aoristpartizip wird im deutschen Erzählstil passend als finites Verb wiedergegeben. Der artikellose Ausdruck ἄρτον wird als »Brot« übersetzt, ohne die Form als Laib näher festzulegen.
- source_word: εὐλογήσας
  choice: sprach den Segen
  rationale: Im Zusammenhang einer Mahlzeit bezeichnet εὐλογέω das Sprechen eines Segens über dem Brot. Die Formulierung ist im modernen Deutsch idiomatischer als »segnete es« und legt nicht ausdrücklich fest, ob Gott oder das Brot grammatisch Gegenstand des Segens ist.
- source_word: ἔκλασεν
  choice: brach es
  rationale: Das ergänzte Pronomen bezieht sich eindeutig auf das Brot und bildet die knappe Handlungsfolge natürlich ab.
- source_word: ἔδωκεν αὐτοῖς
  choice: gab es ihnen
  rationale: Das im Griechischen aus dem Zusammenhang erschlossene Objekt wird im Deutschen zur Klarheit aufgenommen; »gab« vermeidet die stärker deutende Wiedergabe »verteilte«.
- source_word: Λάβετε
  choice: Nehmt
  rationale: Der Aoristimperativ fordert die Jünger unmittelbar auf, das Brot zu nehmen. Ein zusätzliches Objekt ist im Deutschen nicht erforderlich.
- source_word: τοῦτό ἐστιν
  choice: das ist
  rationale: Die Kopulakonstruktion wird unmittelbar wiedergegeben, ohne sie im Haupttext als »bedeutet« oder »stellt dar« auszulegen.
- source_word: τὸ σῶμά μου
  choice: mein Leib
  rationale: »Leib« ist in diesem Zusammenhang eine natürliche, würdevolle deutsche Wiedergabe von σῶμα und vermeidet den vorwiegend anatomischen Klang von »Körper«.
theological_decisions:
- issue: Jesu Aussage über das Brot beim Mahl
  choice: »das ist mein Leib«
  alternative: »das bedeutet meinen Leib« / »das stellt meinen Leib dar«
  rationale: Der griechische Text verwendet die gewöhnliche Kopula ἐστιν. Der Haupttext bewahrt deshalb die direkte Aussage und ihre theologische Spannung, ohne eine sakramentale oder rein symbolische Deutung festzuschreiben.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die kurzen koordinierten Verben bewahren den Rhythmus des griechischen Satzes. Der Fußnotenmarker steht unmittelbar bei der Aussage, auf die sich die Deutungsalternative bezieht.
