  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: de
  text: 'Doch er beteuerte noch nachdrücklicher[a]: »Wenn ich mit dir zusammen sterben muss, werde ich dich ganz bestimmt nicht verleugnen[b].« Und alle sagten dasselbe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch er redete mit größtem Nachdruck.“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „werde ich dich niemals verleugnen.“ Das Griechische verwendet eine besonders starke Verneinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς ἐλάλει
  choice: beteuerte noch nachdrücklicher
  rationale: Das Adverb bezeichnet eine außergewöhnlich starke Intensität; zusammen mit dem Imperfekt und dem Kontext fortgesetzten Widerspruchs gibt „beteuerte noch nachdrücklicher“ die Steigerung und den nachdrücklichen Charakter der Rede natürlich wieder.
- source_word: Ἐὰν δέῃ με
  choice: Wenn ich … muss
  rationale: δέῃ drückt Notwendigkeit aus. Die knappe deutsche Wendung bewahrt diese Bedeutung und die konditionale Form.
- source_word: συναποθανεῖν σοι
  choice: mit dir zusammen sterben
  rationale: Das Präfix συν- bezeichnet ausdrücklich das gemeinsame Sterben; „zusammen“ macht diese Bedeutung im Deutschen sichtbar.
- source_word: οὐ μή
  choice: ganz bestimmt nicht
  rationale: Die Verbindung οὐ μή mit dem Futur ist eine besonders starke Verneinung. „Ganz bestimmt nicht“ wahrt den emphatischen Schwur in gegenwärtigem, natürlichem Deutsch.
- source_word: ἀπαρνήσομαι
  choice: verleugnen
  rationale: „Verleugnen“ ist im Erzählzusammenhang die präzise und geläufige Bezeichnung für Petrus’ angekündigte und später tatsächlich erfolgende Abstreitung seiner Beziehung zu Jesus.
- source_word: ὡσαύτως δὲ καὶ πάντες ἔλεγον
  choice: Dasselbe sagten auch alle anderen
  rationale: ὡσαύτως verweist hier auf den Inhalt der Aussage; „Dasselbe“ macht diesen Bezug klar. „Alle anderen“ gibt πάντες im Zusammenhang idiomatisch wieder, wobei Petrus als zuvor genannter Sprecher aus der Gruppe hervorgehoben ist.
theological_decisions:
- issue: Stärke von Petrus’ Versprechen
  choice: „werde ich dich ganz bestimmt nicht verleugnen“
  alternative: „werde ich dich niemals verleugnen“
  rationale: Die starke griechische Verneinung wird deutlich wiedergegeben, ohne die erzählerische Spannung zwischen Petrus’ Selbstsicherheit und seinem späteren Versagen auszulegen oder abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Beteuerte“ erfasst den Kontext eines wiederholten, nachdrücklichen Widerspruchs; „noch nachdrücklicher“ stellt die Steigerung gegenüber Jesu vorheriger Aussage heraus. Die Satzstruktur bleibt nah am griechischen Ablauf, ohne unnatürlich zu wirken.
