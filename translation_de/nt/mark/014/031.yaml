  source_fidelity: Die Wiedergabe von ἐκπερισσῶς ἐλάλει als „beteuerte noch nachdrücklicher“ trifft Intensivierung und imperfektiven, anhaltenden Charakter gut. „Wenn ich mit dir zusammen sterben muss“ gibt die notwendige Bedingung und συναποθανεῖν zutreffend wieder; „ganz bestimmt nicht“ wahrt die Nachdrücklichkeit von οὐ μή. Die Formulierung „alle anderen“ fügt bei πάντες jedoch eine ausdrückliche Abgrenzung von Petrus hinzu, die der griechische Text nicht formuliert.
