id: MRK.14.23
reference: Mark 14:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: de
  text: Und er nahm einen Becher[a], dankte und gab ihn ihnen; und sie tranken alle daraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Becher“. Im Griechischen steht „Becher“ ohne Artikel; der Zusammenhang des Mahls kann jedoch einen bestimmten Becher nahelegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: nahm
  rationale: Das vorzeitige Aoristpartizip bezeichnet die Handlung, die dem Geben vorausgeht. Die finite Wiedergabe mit „nahm“ ist im Deutschen natürlich und bleibt durch die Satzfolge zeitlich eindeutig.
- source_word: ποτήριον
  choice: einen Becher
  rationale: Das griechische Substantiv steht ohne Artikel und bezeichnet ein Trinkgefäß. „Einen Becher“ bildet dies unmittelbar und in gegenwärtigem Deutsch ab; „Kelch“ wäre stärker von kirchlicher und liturgischer Tradition geprägt.
- source_word: εὐχαριστήσας
  choice: dankte
  rationale: Das Verb bedeutet, Dank auszusprechen. Die knappe Wiedergabe vermeidet sowohl eine unnötig schwerfällige Partizipialkonstruktion als auch die Eintragung späterer liturgischer Fachsprache.
- source_word: ἔδωκεν αὐτοῖς
  choice: gab ihn ihnen
  rationale: Das im Deutschen erforderliche Objektpronomen „ihn“ nimmt den grammatisch maskulinen „Becher“ auf; der griechische Zusammenhang setzt dasselbe Gefäß als Objekt des Gebens voraus.
- source_word: ἔπιον ἐξ αὐτοῦ
  choice: tranken daraus
  rationale: „Daraus trinken“ ist die natürliche deutsche Entsprechung für das Trinken aus dem zuvor genannten Gefäß.
- source_word: πάντες
  choice: sie tranken alle
  rationale: Die Stellung von „alle“ beim Verb macht klar und betont, dass sämtliche Anwesenden davon tranken.
theological_decisions:
- issue: Mögliche eucharistische Anklänge von εὐχαριστήσας
  choice: „dankte“
  alternative: „sprach das Dankgebet“ oder „segnete ihn“
  rationale: εὐχαριστέω bezeichnet hier ausdrücklich das Danken. Die Übersetzung wahrt die spätere sakramentale Bedeutung des Zusammenhangs, ohne sie durch liturgische Terminologie oder durch ein im Verb nicht genanntes Segnen des Bechers vorwegzunehmen.
- issue: Traditionelle Wiedergabe von ποτήριον im Abendmahlsbericht
  choice: „Becher“
  alternative: „Kelch“
  rationale: „Becher“ gibt das allgemeine griechische Wort für ein Trinkgefäß wieder. „Kelch“ ist im Deutschen möglich, würde den Ausdruck jedoch stärker liturgisch festlegen, als es das griechische Wort für sich allein tut.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die koordinierte Satzform folgt dem schlichten Erzählstil des Markus; das Semikolon hält Geben und gemeinsames Trinken eng zusammen. „Becher“ vermeidet unnötig kirchlich geprägte Fachsprache.
