  source_fidelity: Die Übersetzung gibt die narrative Folge von οἱ δέ sowie die zwei griechischen Verben grundsätzlich zutreffend wieder. „Hand an ihn legen“ ist jedoch im heutigen Deutsch semantisch weiter und kann besonders ein gewaltsames Vorgehen andeuten, ohne das konkrete Zugreifen so klar auszudrücken wie das Griechische.
  naturalness: „Da packten sie ihn und nahmen ihn fest“ ist modernes, natürliches Standarddeutsch. Es macht die Abfolge von Zugriff und Festnahme klar erkennbar.
  terminology: „Festnehmen“ trifft den Verhaftungskontext von ἐκράτησαν angemessen. „Packten“ gibt ἐπέβαλαν τὰς χεῖρας αὐτῷ idiomatisch wieder, ohne eine übermäßig formale oder technische Bedeutung einzutragen.
