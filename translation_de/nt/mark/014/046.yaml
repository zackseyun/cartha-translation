  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: de
  text: Da packten sie ihn und nahmen ihn fest[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie legten ihre Hände an ihn und ergriffen ihn.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Da legten sie
  rationale: Das substantivische οἱ bezeichnet die handelnden Personen, während δέ den nächsten Erzählschritt markiert. „Da“ gibt diesen Fortgang im Deutschen natürlich wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: legten sie Hand an ihn
  rationale: Die griechische Wendung bezeichnet hier das gewaltsame Ergreifen einer Person. „Hand an jemanden legen“ bewahrt den idiomatischen Charakter und die feindselige Absicht, ohne die folgende Aussage vorwegzunehmen.
- source_word: ἐκράτησαν αὐτόν
  choice: nahmen ihn fest
  rationale: κρατέω bezeichnet in dieser Verhaftungsszene das Ergreifen und Festhalten Jesu. „Festnehmen“ ist im modernen Deutsch natürlich und gibt den kontextuellen Sinn präzise wieder; „ergriffen ihn“ wäre formnäher, aber weniger eindeutig.
theological_decisions: []
translation_notes:
  register: 'Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Erzählweise. Die Abfolge der beiden griechischen Verben bleibt erkennbar: zuerst das gewaltsame Handanlegen, dann die Festnahme.'
