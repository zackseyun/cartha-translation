  terminology: „Duftöl“ ist eine natürliche, kontextgerechte Wiedergabe von μύρον. Die Fußnote bewahrt „Salböl“ als mögliche Alternative. „Denare“ erhält den historischen Geldbegriff, und „die Armen“ entspricht der gruppenbezeichnenden Verwendung von τοῖς πτωχοῖς.
