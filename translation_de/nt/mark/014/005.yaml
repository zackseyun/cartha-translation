  source_fidelity: Der Entwurf gibt die irreal gedachte Möglichkeit von ἠδύνατο ... πραθῆναι ... καὶ δοθῆναι treffend wieder. „Für mehr als dreihundert Denare“ entspricht ἐπάνω δηναρίων τριακοσίων. Die explizite Ergänzung „das Geld“ macht im Deutschen den beim Verkauf implizierten Erlös verständlich, ohne den Sinn zu verändern. „Sie machten ihr heftige Vorwürfe“ gibt die starke gegen die Frau gerichtete Missbilligung von ἐνεβριμῶντο αὐτῇ angemessen wieder.
