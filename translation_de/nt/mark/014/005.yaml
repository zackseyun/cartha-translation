id: MRK.14.5
reference: Mark 14:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: de
  text: „Denn man hätte dieses Duftöl[a] für mehr als dreihundert Denare verkaufen und das Geld den Armen geben können.“ Und sie machten ihr heftige Vorwürfe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Salböl; gemeint ist ein wohlriechendes, parfümiertes Öl.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: Und sie wiesen sie scharf zurecht. Das griechische Verb drückt starke Missbilligung oder scharfen Tadel aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: Duftöl
  rationale: Das Wort bezeichnet ein wohlriechendes Öl beziehungsweise eine parfümierte Salbe. „Duftöl“ ist im modernen Deutsch natürlich und vermeidet die mögliche kultische Engführung von „Salböl“.
- source_word: πραθῆναι
  choice: verkaufen
  rationale: Der passive Infinitiv steht bei ἠδύνατο und bezeichnet eine nicht verwirklichte Möglichkeit. Die unpersönliche deutsche Konstruktion „man hätte … verkaufen können“ gibt dies idiomatisch wieder.
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: für mehr als dreihundert Denare
  rationale: ἐπάνω mit dem Genitiv einer Summe bezeichnet hier einen Betrag oberhalb der genannten Grenze. „Denare“ bewahrt den historischen Geldbegriff ohne moderne Umrechnung.
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: das Geld den Armen geben
  rationale: Gemeint ist dem Zusammenhang nach der Verkaufserlös. Die aktive deutsche Fassung macht den sachlichen Bezug verständlich; „den Armen“ bezeichnet wie im Griechischen die sozial Bedürftigen als Gruppe.
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: sie machten ihr heftige Vorwürfe
  rationale: Das Verb drückt eine nach außen gerichtete, starke Missbilligung oder scharfe Zurechtweisung aus. Die Formulierung wahrt diese Intensität in natürlichem modernem Deutsch.
- source_word: γὰρ
  choice: Denn
  rationale: γάρ begründet die unmittelbar vorausgehende Beanstandung und wird mit dem entsprechenden deutschen Begründungskonnektor wiedergegeben.
- source_word: ἠδύνατο
  choice: hätte … können
  rationale: Das Imperfekt von δύναμαι bezeichnet im Kontext eine nicht genutzte Möglichkeit. Der deutsche Konjunktiv II der Vergangenheit bringt diesen irrealen Rückblick idiomatisch zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aktive unpersönliche Formulierung vermeidet eine im Deutschen missverständliche passive Reihung, bei der scheinbar das Duftöl selbst den Armen gegeben würde. Die direkte Rede endet entsprechend dem erzählerischen Zusammenhang vor dem letzten Satz.
