  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: de
  text: Und er ging ein kleines Stück weiter[a], fiel zu Boden und betete, dass, wenn es möglich wäre, die Stunde an ihm vorüberginge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ging ein kleines Stück voraus.'
    reason: Lexikalische Alternative für προελθὼν μικρόν; „voraus“ hebt die Bewegung vor die anderen stärker hervor.
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: ging ein kleines Stück weiter
  rationale: Die Wendung bezeichnet eine Bewegung über den bisherigen Standort hinaus, jedoch nur über eine kurze Entfernung. Diese Formulierung ist im modernen Deutschen natürlich und wahrt beide Bedeutungselemente.
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: fiel zu Boden
  rationale: Der deutsche Erzählstil gibt den hier beschreibenden beziehungsweise ingressiven Imperfekt natürlich mit dem Präteritum wieder. „Zu Boden“ bezeichnet idiomatisch die gerichtete Bewegung.
- source_word: προσηύχετο
  choice: betete
  rationale: Das Präteritum ist im deutschen Erzählzusammenhang natürlich; der fortdauernde Gebetsvorgang ergibt sich aus der folgenden Inhaltsangabe, ohne dass eine schwerfällige Verlaufsform nötig wäre.
- source_word: ἵνα
  choice: dass
  rationale: Hier leitet ἵνα den Inhalt beziehungsweise das Ziel des Gebets ein. „Dass“ gibt dies im Deutschen ohne unnötige Festlegung auf eine ausschließlich finale Bedeutung wieder.
- source_word: εἰ δυνατόν ἐστιν
  choice: wenn es möglich wäre
  rationale: Der Konjunktiv wahrt die Bedingtheit und den zurückhaltenden Charakter der Bitte. Obwohl das Griechische ἐστιν im Präsens hat, verlangt die deutsche indirekte Wiedergabe hier idiomatisch eine konjunktivische Form.
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: die Stunde … an ihm vorübergehen möge
  rationale: „An ihm vorübergehen“ bildet die räumlich-metaphorische Ausdrucksweise des Griechischen natürlich ab. „Die Stunde“ bleibt als gewichtige, aber nicht ausgedeutete Bezeichnung erhalten; „möge“ kennzeichnet den Inhalt der Bitte.
theological_decisions:
- issue: Bedeutung von „die Stunde“
  choice: Die bildhafte Wendung „die Stunde“ wird unverändert als Bezeichnung des bevorstehenden Geschehens beibehalten.
  alternative: die Zeit; die Leidensstunde; der Zeitpunkt seines Leidens
  rationale: Der Ausdruck ist im markinischen Zusammenhang theologisch aufgeladen. Eine erklärende Umschreibung würde die offene Spannung des Textes vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt gut verständlich, bewahrt aber die feierliche Bedingtheit des Gebets und die theologisch bedeutsame Wendung „die Stunde“.
