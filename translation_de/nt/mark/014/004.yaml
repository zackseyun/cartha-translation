  text: ἦσαν δέ τινες ἀγανακτοῦντες πρὸς ⸀ἑαυτούς· Εἰς τί ἡ ἀπώλεια αὕτη τοῦ μύρου γέγονεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/004.yaml
  text: 'But some were indignant among themselves: “Why has this waste of the perfume happened?”[a][b]'
translation:
  language: de
  text: 'Einige aber waren empört und fragten sich[a]: „Wozu diese Verschwendung des Salböls[b]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „sagten zueinander“ oder „waren bei sich selbst empört“. Die griechische Wendung kann eine Reaktion innerhalb der Gruppe oder eine innere Reaktion bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Oder „Duftöls“ oder „wohlriechenden Öls“. Das griechische Wort bezeichnet ein parfümiertes Öl beziehungsweise eine Salbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: aber waren
  rationale: δέ markiert hier einen leichten Gegensatz zur vorausgehenden Handlung der Frau und führt zugleich die Erzählung weiter.
- source_word: τινες
  choice: einige
  rationale: Das unbestimmte Pluralpronomen lässt die Betreffenden bewusst ungenannt.
- source_word: ἀγανακτοῦντες
  choice: empört
  rationale: Das Wort bezeichnet starken, als moralisch begründet empfundenen Unwillen und ist stärker als bloßes Verärgertsein.
- source_word: πρὸς ἑαυτούς
  choice: untereinander
  rationale: Im Zusammenhang mit der folgenden ausgesprochenen Klage liegt eine wechselseitige Reaktion innerhalb der Gruppe nahe; die Formulierung kann jedoch auch eine innere Reaktion bezeichnen.
- source_word: Εἰς τί
  choice: wozu
  rationale: Die Wendung fragt wörtlich nach Zweck oder Ergebnis. „Wozu“ bewahrt diese Nuance natürlicher als eine rein kausale Frage mit „warum“.
- source_word: ἡ ἀπώλεια αὕτη
  choice: diese Verschwendung
  rationale: ἀπώλεια kann Verlust, Verderben oder Verschwendung bedeuten; hier gibt „Verschwendung“ die wertende Klage über das ausgegossene kostbare Salböl wieder.
- source_word: τοῦ μύρου
  choice: des Salböls
  rationale: μύρον bezeichnet ein wohlriechendes Öl beziehungsweise eine Salbe. „Salböl“ ist verständlich und bildet die ölige Substanz deutlicher ab als „Parfüm“.
- source_word: γέγονεν
  choice: '[in der idiomatischen Frage „Wozu diese Verschwendung …?“ enthalten]'
  rationale: Das Perfekt von γίνομαι beschreibt das eingetretene, nun vorliegende Geschehen. Im Deutschen ist eine verblosen Ausruffrage idiomatisch; der eingetretene Zustand bleibt durch „diese Verschwendung“ erkennbar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist knapp und empört formuliert. „Untereinander“ bildet die wahrscheinlich wechselseitige Klage der Gruppe ab; die im Griechischen mögliche Bedeutung „bei sich selbst“ wird nicht dogmatisch ausgeschlossen. Der Fußnotenmarker steht unmittelbar beim erklärten Ausdruck.
