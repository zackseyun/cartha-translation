id: MRK.14.30
reference: Mark 14:30
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: de
  text: 'Und Jesus sagt zu ihm: „Amen, ich sage dir: Heute, noch in dieser Nacht, wirst du mich dreimal verleugnen, bevor ein Hahn zweimal kräht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt Markus’ historisches Präsens und damit die Lebendigkeit seines Erzählstils.
- source_word: Ἀμὴν λέγω σοι
  choice: Amen, ich sage dir
  rationale: Die im Deutschen vertraute feierliche Einleitungsformel bewahrt sowohl das semitische Lehnwort Ἀμήν als auch die direkte Aussage λέγω σοι.
- source_word: σὺ
  choice: du (durch die Verbform „wirst du“ ausgedrückt)
  rationale: Die betonte persönliche Anrede wird im natürlichen deutschen Satz durch die Stellung von „wirst du“ klar aufgenommen, ohne ein unidiomatisches zusätzliches Pronomen einzufügen.
- source_word: σήμερον ταύτῃ τῇ νυκτί
  choice: Heute, noch in dieser Nacht
  rationale: Beide Zeitangaben bleiben erhalten. „Noch in dieser Nacht“ gibt ihre enge Verbindung und die unmittelbare zeitliche Zuspitzung natürlich wieder.
- source_word: πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι
  choice: bevor ein Hahn zweimal kräht
  rationale: Die Infinitivkonstruktion wird als natürlicher deutscher Temporalsatz wiedergegeben; δὶς bleibt ausdrücklich erhalten.
- source_word: τρίς με ἀπαρνήσῃ
  choice: wirst du mich dreimal verleugnen
  rationale: „Verleugnen“ ist hier die präzise und im biblischen Zusammenhang etablierte Wiedergabe von ἀπαρνέομαι; „dreimal“ bewahrt den zahlenmäßigen Kontrast zu „zweimal“.
theological_decisions:
- issue: Verhältnis von σήμερον und ταύτῃ τῇ νυκτί
  choice: Beide Angaben werden mit „Heute, noch in dieser Nacht“ wiedergegeben.
  alternative: Nur „heute Nacht“ oder „noch heute Nacht“
  rationale: Der griechische Text enthält beide Zeitangaben. Ihre getrennte Wiedergabe wahrt die eindringliche Unmittelbarkeit, ohne sie zu einer einzigen Angabe zu verschmelzen.
- issue: Historisches Präsens λέγει
  choice: „sagt“
  alternative: „sagte“
  rationale: Das Präsens lässt Markus’ Erzählweise sichtbar, statt sie an gewöhnliche deutsche Vergangenheitsprosa anzugleichen.
- issue: Zeitliches Verhältnis von Hahnenschrei und Verleugnung
  choice: „wirst du mich dreimal verleugnen, bevor ein Hahn zweimal kräht“
  alternative: „bevor ein Hahn zweimal kräht, wirst du mich dreimal verleugnen“
  rationale: Beide Satzstellungen drücken denselben zeitlichen Bezug aus. Die gewählte Fassung ist im Deutschen flüssig und lässt zugleich den markinischen Kontrast zwischen dreimaligem Verleugnen und zweimaligem Krähen klar hervortreten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Jesusformel „Amen, ich sage dir“ ist bewusst beibehalten; sonst ist die Syntax gegenwartsnah und gut verständlich.
