source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: de
  text: 'Da stand der Hohepriester auf, trat in die Mitte und fragte Jesus: „Antwortest du gar nichts? Was sagen diese Männer gegen dich aus?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: stand … auf
  rationale: Das Aoristpartizip von ἀνίστημι bezeichnet hier das körperliche Aufstehen; die deutsche Verbklammer ergibt sich natürlich aus der Satzstellung.
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohepriester
  rationale: Übliche und kontextgerechte Bezeichnung für den amtierenden jüdischen Hohepriester.
- source_word: εἰς μέσον
  choice: in der Mitte
  rationale: Bewahrt die räumliche Aussage, dass der Hohepriester eine zentrale Position in der Versammlung einnahm, ohne altertümliche Formulierung.
- source_word: ἐπηρώτησεν
  choice: fragte
  rationale: ἐπερωτάω bedeutet fragen oder befragen. Im Zusammenhang vermittelt „fragte“ die gerichtliche Befragung, ohne die Stärke durch „verhörte“ zu überzeichnen.
- source_word: ἀποκρίνῃ οὐδέν
  choice: Antwortest du gar nichts?
  rationale: Die rhetorische Herausforderung und die Verneinung werden in natürlichem, nachdrücklichem Deutsch wiedergegeben.
- source_word: οὗτοί
  choice: diese Männer
  rationale: Das maskuline Demonstrativpronomen im Plural verweist auf die anwesenden männlichen Zeugen; die ausdrückliche Wiedergabe macht den Bezug im Deutschen klar.
- source_word: καταμαρτυροῦσιν
  choice: sagen … gegen dich aus
  rationale: Die idiomatische deutsche Gerichtsformel „gegen jemanden aussagen“ bewahrt sowohl den Zeugnischarakter als auch die gegen Jesus gerichtete Aussage im Präsens.
theological_decisions:
- issue: Geschlechtsspezifischer Bezug von οὗτοί
  choice: diese Männer
  alternative: diese / diese Leute
  rationale: Die maskuline Pluralform bezieht sich in der Prozessszene auf konkrete männliche Zeugen. „Diese Männer“ wahrt diesen Bezug, ohne eine allgemeine Aussage über gemischte Gruppen zu erzeugen.
- issue: Art der gegen Jesus gerichteten Rede
  choice: gegen dich aussagen
  alternative: dich beschuldigen
  rationale: καταμαρτυρέω bezeichnet Zeugenaussage gegen jemanden. Die Übersetzung hält den forensischen Zeugnischarakter fest und reduziert ihn nicht auf die weiter gefasste Bedeutung „beschuldigen“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und konfrontativ. „In der Mitte“ gibt die zentrale räumliche Stellung natürlich wieder; „sagen … aus“ entspricht dem gerichtlichen Kontext.
