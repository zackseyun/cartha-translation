reference: Mark 14:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: de
  text: 'Während sie zu Tisch lagen[a] und aßen, sagte Jesus: „Amen, ich sage euch: Einer von euch wird mich verraten[b] – einer, der mit mir isst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zu Tisch zu liegen war damals bei festlichen Mahlzeiten üblich.
    reason: cultural_note
  - marker: b
    text: 'Oder: „wird mich ausliefern“. Das griechische Verb kann „übergeben“, „ausliefern“ oder in diesem Zusammenhang „verraten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: zu Tisch lagen
  rationale: Die Formulierung gibt die damals übliche liegende Haltung bei einem Mahl historisch genau wieder und ist im Deutschen verständlich.
- source_word: ἐσθιόντων / ἐσθίων
  choice: aßen / der mit mir isst
  rationale: Das schlichte Verb „essen“ entspricht dem griechischen Ausdruck direkt; das artikulierte Partizip am Versende wird als Relativsatz wiedergegeben.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Die im Deutschen geläufige feierliche Formel bewahrt das semitische Lehnwort Ἀμήν und die markante Ausdrucksweise Jesu.
- source_word: εἷς ἐξ ὑμῶν
  choice: Einer von euch
  rationale: Dies ist die natürliche deutsche Wiedergabe des partitiven Ausdrucks und bezeichnet einen aus der anwesenden Gruppe.
- source_word: παραδώσει
  choice: wird mich verraten
  rationale: Im Zusammenhang bezeichnet das Verb die treulose Auslieferung Jesu durch einen Tischgefährten. „Verraten“ gibt diese Beziehungsdimension natürlich wieder; die wörtlichere Möglichkeit steht in der Fußnote.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: Die knappe deutsche Wendung entspricht der einfachen Begleitung im griechischen Text.
theological_decisions:
- issue: Wiedergabe von παραδώσει in der Passionsgeschichte
  choice: wird mich verraten
  alternative: wird mich ausliefern / übergeben
  rationale: Das Verb kann allgemein „übergeben“ oder „ausliefern“ bedeuten. Hier kennzeichnet der Zusammenhang die Handlung eines engen Gefährten gegen Jesus als Verrat, ohne dass diese Übersetzung zusätzliche Lehrannahmen einführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historisch konkrete Tischhaltung bleibt sichtbar; die feierliche Amen-Formel wird formal bewahrt. Der Gedankenstrich bildet die nachgestellte Präzisierung des Verräters als Mitessenden ab.
