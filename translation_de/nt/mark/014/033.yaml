  text: καὶ παραλαμβάνει τὸν Πέτρον καὶ ⸂Ἰάκωβον καὶ⸃ Ἰωάννην μετ’ ⸀αὐτοῦ, καὶ ἤρξατο ἐκθαμβεῖσθαι καὶ ἀδημονεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/033.yaml
  text: And he takes Peter and James and John with him[a], and he began to be greatly distressed and troubled,
translation:
  language: de
  text: Und er nimmt Petrus und Jakobus und Johannes mit sich, und er begann, zu erschrecken[a] und sich zu ängstigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von Entsetzen erfasst zu werden“ oder „zutiefst bestürzt zu sein“. Das griechische Verb kann hier heftigen Schrecken, Schock oder tiefe Bestürzung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: nimmt … mit sich
  rationale: Das historische Präsens wird als Präsens bewahrt; die Wendung gibt zugleich wieder, dass Jesus die drei ausgewählten Jünger mitnimmt.
- source_word: μετ’ αὐτοῦ
  choice: mit sich
  rationale: Im Deutschen verbindet sich diese Angabe natürlich mit „nimmt“ und bezeichnet die Begleitung Jesu.
- source_word: ἤρξατο
  choice: er begann
  rationale: Der Beginn des beschriebenen Zustands wird ausdrücklich wiedergegeben und nicht geglättet.
- source_word: ἐκθαμβεῖσθαι
  choice: zutiefst bestürzt
  rationale: Die Formulierung vermittelt den starken Schock und die heftige innere Erschütterung des Verbs, ohne es auf bloßes Erstaunen zu reduzieren.
- source_word: ἀδημονεῖν
  choice: geängstigt zu sein
  rationale: Das Wort bezeichnet schwere innere Bedrängnis oder Angst. „Geängstigt“ wahrt das Gewicht des Ausdrucks und bleibt von „bestürzt“ unterscheidbar.
- source_word: καὶ … καὶ
  choice: und … und
  rationale: Die wiederholten Verknüpfungen bleiben erhalten und spiegeln den parataktischen Erzählstil des Markus.
theological_decisions:
- issue: Jesu Gefühlszustand in Gethsemane
  choice: 'Die beiden Verben werden als wirkliche, intensive menschliche Erschütterung und Angst wiedergegeben: „zutiefst bestürzt und geängstigt“.'
  alternative: Mildere Wiedergabe wie „erstaunt und beunruhigt“ oder stärker deutende Wiedergabe wie „von Entsetzen überwältigt und voller Todesangst“.
  rationale: Der Text beschreibt Jesu tiefes menschliches Leiden, ohne es theologisch zu erklären. Die Übersetzung schwächt dieses Leiden nicht ab, steigert es aber auch nicht durch Begriffe, die über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens in „nimmt“ und der anschließende Beginn mit „begann“ bleiben erhalten. Die Reihung der drei Namen mit wiederholtem „und“ folgt bewusst dem markinischen Stil.
