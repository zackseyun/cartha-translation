review_pass:
  verdict: revise
  source_fidelity: Die drei Jünger, das Mitnehmen Jesu und die ingressive Bedeutung von ἤρξατο sind vorhanden. Die bisherige Konstruktion „begann, zutiefst bestürzt und geängstigt zu sein“ ist jedoch semantisch und syntaktisch schwerfällig. „Geängstigt“ legt zudem eher ein passives Erschrecktwerden nahe, während ἀδημονεῖν innere Bedrängnis bzw. Angst bezeichnet.
  naturalness: „Und er nimmt … mit sich“ ist idiomatisch. Die prädikative Reihung nach „begann“ klingt im modernen Standarddeutsch jedoch unnatürlich. Zwei koordinierte Infinitive geben die markinische Doppelung klar und flüssig wieder.
  terminology: „erschrecken“ gibt ἐκθαμβεῖσθαι in diesem Kontext als heftiges Erschrecken/Entsetzen wieder; die Fußnote wahrt die mögliche Nuance von Schock oder tiefer Bestürzung. „sich ängstigen“ ist für ἀδημονεῖν angemessen, ohne die intensivere, aber mögliche Deutung „in Todesangst sein“ einzutragen. Die Namen sind korrekt und die Wiedergabe bleibt nichtkonfessionell.
  issues:
  - severity: medium
    issue: Unnatürliche Infinitivkonstruktion
    rationale: „Er begann, zutiefst bestürzt und geängstigt zu sein“ wirkt im Deutschen statisch und gestelzt. Sie bildet die beiden griechischen Verben nicht so klar ab wie koordinierte Infinitive.
  - severity: medium
    issue: „geängstigt“ für ἀδημονεῖν
    rationale: „Geängstigt“ wird gewöhnlich als Partizip eines von außen verursachten Erschreckens verstanden. Das griechische Verb bezeichnet hier Jesu eigene akute innere Bedrängnis.
  revised_text: Und er nimmt Petrus und Jakobus und Johannes mit sich, und er begann, zu erschrecken[a] und sich zu ängstigen.
