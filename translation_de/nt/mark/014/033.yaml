revisions:
- from: Und er nimmt Petrus und Jakobus und Johannes mit sich, und er begann, zutiefst bestürzt[a] und geängstigt zu sein.
  to: Und er nimmt Petrus und Jakobus und Johannes mit sich, und er begann, zu erschrecken[a] und sich zu ängstigen.
  rationale: Die Revision bewahrt das historische Präsens von „nimmt“, die wiederholte Reihung mit „und“ sowie die ausdrückliche Beginnangabe. „Zu erschrecken und sich zu ängstigen“ ist modernes, natürliches Deutsch und hält die zwei unterschiedlichen, intensiven Ausdrücke des griechischen Textes auseinander. Die Fußnote dokumentiert die umstrittene bzw. kontextabhängige Nuance von ἐκθαμβεῖσθαι, ohne sie im Haupttext zu überdeuten.
