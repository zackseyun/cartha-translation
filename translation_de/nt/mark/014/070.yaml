  naturalness: „Doch er stritt es wieder ab“, „Kurz darauf“ und „die Umstehenden“ sind natürliches modernes Standarddeutsch in würdig-erzählendem Register. „Deine Sprechweise ähnelt der ihren“ ist idiomatischer und stellt den aus dem Kontext erschließbaren Vergleich her.
  terminology: „Galiläer“, „Sprechweise“ und „einer von ihnen“ sind angemessen. „Sprechweise“ wahrt die Bandbreite von λαλιά (Redeweise, Dialekt, Akzent), ohne sie auf Akzent zu verengen.
