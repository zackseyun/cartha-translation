source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: de
  text: 'Doch er stritt es wieder ab. Kurz darauf sagten die Umstehenden erneut zu Petrus: »Du bist wirklich einer von ihnen; denn du bist auch ein Galiläer, und deine Sprechweise ähnelt der ihren.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lassen den Satzteil »und deine Sprechweise ähnelt der ihren« aus.
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: stritt es wieder ab
  rationale: Das Imperfekt bezeichnet hier die erneut einsetzende beziehungsweise fortgesetzte Verleugnung; „es“ nimmt den im Zusammenhang klaren Vorwurf auf.
- source_word: μετὰ μικρὸν
  choice: kurz darauf
  rationale: Gibt den kurzen zeitlichen Abstand idiomatisch und prägnant wieder.
- source_word: οἱ παρεστῶτες
  choice: die Umstehenden
  rationale: Bewahrt sowohl die räumliche Vorstellung der Dabeistehenden als auch den natürlichen deutschen Ausdruck.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das deutsche Präteritum ist in erzählender Prosa natürlich; das erneute beziehungsweise wiederholte Ansprechen wird bereits durch πάλιν („erneut“) deutlich.
- source_word: Ἀληθῶς
  choice: wirklich
  rationale: Drückt die nachdrückliche Gewissheit der Sprecher in natürlicher direkter Rede aus.
- source_word: ἐξ αὐτῶν εἶ
  choice: du bist einer von ihnen
  rationale: Gibt die Zugehörigkeit zu der mit Jesus verbundenen Gruppe idiomatisch wieder.
- source_word: καὶ γὰρ Γαλιλαῖος εἶ
  choice: denn du bist auch ein Galiläer
  rationale: „Denn“ bewahrt die begründende Funktion von γάρ, „auch“ die von καί.
- source_word: ἡ λαλιά σου ὁμοιάζει
  choice: deine Sprechweise klingt ähnlich
  rationale: „Sprechweise“ hält die Bandbreite von λαλιά zwischen Redeweise, Dialekt und Akzent offen; „klingt ähnlich“ gibt ὁμοιάζει ohne ausdrücklich ergänztes Vergleichsobjekt wieder.
theological_decisions:
- issue: Zugehörigkeit zu Jesu Anhängern
  choice: einer von ihnen
  alternative: gehörst zu ihnen
  rationale: Die Formulierung wahrt die schlichte Gruppenzuordnung des griechischen ἐξ αὐτῶν, ohne die Art dieser Zugehörigkeit theologisch näher zu bestimmen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die direkte Rede klingt natürlich und nachdrücklich. „Sprechweise“ vermeidet die unnötige Festlegung auf einen bloßen Akzent; die bedeutende Textvariante wird in der Fußnote kenntlich gemacht.
