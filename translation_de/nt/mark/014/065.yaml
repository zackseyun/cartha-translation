  to: 'Und einige fingen an, ihn anzuspucken, sein Gesicht zu verhüllen[a], ihn mit Fäusten zu schlagen und zu ihm zu sagen: »Prophezeie!« Und die Gerichtsdiener schlugen ihn.'
