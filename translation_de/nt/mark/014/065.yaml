review_pass:
  verdict: revise
  source_fidelity: Die erste Misshandlungsreihe gibt den ingressiven Beginn (ἤρξαντο), die unbestimmte Gruppe (τινες), das Bedecken des Gesichts und die Faustschläge (κολαφίζειν) treffend wieder. Die deutsche Wendung „ihn mit Schlägen in Empfang nehmen“ hat jedoch anders als das griechische Idiom keine Bedeutung von körperlichem Misshandeln, sondern bezeichnet gewöhnlich ein begrüßendes oder empfangendes Handeln. Hier ist eine idiomatische Wiedergabe als Schlagen erforderlich.
  naturalness: Bis auf „nahmen ihn mit Schlägen in Empfang“ ist der Text flüssiges, modernes Standarddeutsch. „Die Gerichtsdiener schlugen ihn“ ist eindeutig, natürlich und im gerichtlichen Kontext angemessen.
  terminology: „Gerichtsdiener“ ist für οἱ ὑπηρέται in diesem Kontext vertretbar. „Prophezeie!“ bewahrt den knappen Imperativ. „Schlugen ihn“ gibt die idiomatische Gesamtbedeutung von ῥαπίσμασιν αὐτὸν ἔλαβον wieder, ohne ungesichert zwischen Ohrfeigen, Faustschlägen oder anderen Schlägen zu unterscheiden.
  issues:
