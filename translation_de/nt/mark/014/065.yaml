source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: de
  text: 'Und einige fingen an, ihn anzuspucken, sein Gesicht zu verhüllen[a], ihn mit Fäusten zu schlagen und zu ihm zu sagen: »Prophezeie!« Und die Gerichtsdiener schlugen ihn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihm die Augen zu verbinden. Wörtlich: sein Gesicht zu bedecken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό τινες
  choice: einige fingen an
  rationale: Gibt den ingressiven Sinn von ἄρχομαι mit Infinitiven und die unbestimmte Mehrzahl τινες natürlich und knapp wieder.
- source_word: ἐμπτύειν αὐτῷ
  choice: ihn anzuspucken
  rationale: Das deutsche Verb mit Akkusativ gibt die gegen Jesus gerichtete entehrende Handlung idiomatisch wieder.
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: sein Gesicht zu verhüllen
  rationale: Bleibt nahe bei der ausdrücklichen Aussage, dass sein Gesicht bedeckt wurde, ohne die naheliegende Funktion als Augenbinde in den Haupttext einzutragen.
- source_word: κολαφίζειν αὐτόν
  choice: ihn mit Fäusten zu schlagen
  rationale: κολαφίζω bezeichnet besonders einen Faustschlag; die Formulierung bewahrt diese gegenüber dem allgemeineren »schlagen« genauere Bedeutung.
- source_word: Προφήτευσον
  choice: Prophezeie!
  rationale: Der bloße Imperativ bewahrt den knappen, spöttischen Zuruf, ohne seine unausgesprochene Bedeutung erklärend zu erweitern.
- source_word: οἱ ὑπηρέται
  choice: die Gerichtsdiener
  rationale: Im Umfeld des Verhörs bezeichnet der Ausdruck untergeordnete Amtsträger beziehungsweise Wachen; »Gerichtsdiener« macht ihre institutionelle Funktion verständlich, ohne sie als Hausdiener erscheinen zu lassen.
- source_word: ῥαπίσμασιν αὐτὸν ἔλαβον
  choice: nahmen ihn mit Schlägen in Empfang
  rationale: Die Wendung bildet die ungewöhnliche, anschauliche griechische Konstruktion weitgehend nach. »Schläge« vermeidet eine unbelegte Festlegung darauf, ob mit der flachen Hand, der Faust oder einem Gegenstand geschlagen wurde.
theological_decisions:
- issue: Der spöttische Befehl Προφήτευσον angesichts der Identität Jesu
  choice: »Prophezeie!« ohne erläuternden Zusatz
  alternative: »Sag uns als Prophet, wer dich geschlagen hat!« oder »Beweise, dass du ein Prophet bist!«
  rationale: Markus überliefert hier nur den knappen Imperativ. Die Übersetzung wahrt die erzählerische Ironie und theologische Spannung, ohne aus Parallelüberlieferungen oder Auslegung ergänzende Worte einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Misshandlungen folgt der griechischen Satzbewegung. »Prophezeie!« bleibt bewusst knapp; »nahmen ihn mit Schlägen in Empfang« bewahrt die Härte und auffällige Bildlichkeit des Originals.
