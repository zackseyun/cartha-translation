  text: καί τινες ἀναστάντες ἐψευδομαρτύρουν κατ’ αὐτοῦ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: de
  text: 'Da standen einige auf und legten falsches Zeugnis gegen ihn ab.[a] Sie sagten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionell auch: „legten falsches Zeugnis wider ihn ab“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Da
  rationale: Leitet im markinischen Erzählfluss den nächsten Vorgang ein; im Deutschen verbindet „Da“ diesen natürlich mit der vorausgehenden Szene.
- source_word: τινες
  choice: einige
  rationale: Bewahrt die unbestimmte Mehrzahl, ohne die Personen näher festzulegen.
- source_word: ἀναστάντες
  choice: standen … auf
  rationale: Gibt das vorzeitige Partizip im gerichtlichen Kontext idiomatisch als begleitende Handlung wieder.
- source_word: ἐψευδομαρτύρουν
  choice: legten falsches Zeugnis … ab
  rationale: Drückt den forensischen Sinn deutlich aus. Das griechische Imperfekt schildert den laufenden Vorgang; im natürlichen deutschen Erzählstil kann dieser mit dem Präteritum wiedergegeben werden.
- source_word: κατ’ αὐτοῦ
  choice: gegen ihn
  rationale: κατά mit Genitiv hat hier im feindseligen Verhörkontext adversative Bedeutung.
- source_word: λέγοντες
  choice: 'Sie sagten:'
  rationale: Leitet den in Vers 58 folgenden Inhalt des Zeugnisses klar und natürlich ein; der Doppelpunkt entspricht dieser Funktion.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Falsches Zeugnis ablegen“ bewahrt den rechtlichen und biblischen Anklang, bleibt aber allgemein verständlich; „wider“ wird nur als traditionelle Alternative in der Fußnote genannt.
