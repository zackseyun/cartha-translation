  source_fidelity: 'Der Text gibt alle Elemente des Griechischen angemessen wieder: καί als narrativer Anschluss („Da“), τινες als unbestimmtes „einige“, ἀναστάντες als „standen ... auf“, ἐψευδομαρτύρουν im forensischen Sinn als „legten falsches Zeugnis ... ab“, κατ’ αὐτοῦ als „gegen ihn“ und λέγοντες als Einleitung der folgenden Aussage. Die imperfektische Verlaufsnuance wird im deutschen Erzählpräteritum hinreichend idiomatisch wiedergegeben.'
  naturalness: „Da standen einige auf und legten falsches Zeugnis gegen ihn ab. Sie sagten:“ ist klares, modernes und zugleich angemessen würdiges Standarddeutsch. Die Satztrennung vor der in V. 58 folgenden Rede ist natürlich.
