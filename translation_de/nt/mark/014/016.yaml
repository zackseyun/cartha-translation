source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: de
  text: Die Jünger gingen hinaus, kamen in die Stadt und fanden es so vor, wie er es ihnen gesagt hatte. Dann bereiteten sie das Passah[a] vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Passahmahl«.'
    reason: 'Lexikalische Alternative: τὸ πάσχα kann das Passah allgemein oder hier insbesondere das Passahmahl bezeichnen.'
lexical_decisions:
- source_word: ἐξῆλθον
  choice: gingen hinaus
  rationale: Gibt die Bewegung vom bisherigen Ort weg direkt und natürlich wieder.
- source_word: μαθηταὶ
  choice: die Jünger
  rationale: Etablierte und sachlich passende Bezeichnung für Jesu Schüler und Anhänger.
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: kamen in die Stadt
  rationale: Bewahrt die Bewegungsrichtung von εἰς und die Unterscheidung zum vorhergehenden »gingen hinaus«.
- source_word: εὗρον καθὼς εἶπεν αὐτοῖς
  choice: fanden alles so vor, wie er es ihnen gesagt hatte
  rationale: Das ergänzte »alles« macht den im Griechischen unausgesprochenen Gegenstand im Deutschen idiomatisch deutlich, ohne ihn inhaltlich enger festzulegen.
- source_word: ἡτοίμασαν
  choice: bereiteten … vor
  rationale: Natürliche deutsche Wiedergabe des transitiven ἑτοιμάζω in diesem Zusammenhang.
- source_word: τὸ πάσχα
  choice: das Passah
  rationale: Bewahrt den weiteren Bedeutungsumfang des griechischen Ausdrucks, der das Passahfest beziehungsweise im Kontext das Passahmahl bezeichnen kann.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die wiederholten griechischen καί-Verknüpfungen werden teilweise durch deutsche Satzführung geglättet; »Dann« markiert natürlich den abschließenden Handlungsschritt.
