  text: πολλοὶ γὰρ ἐψευδομαρτύρουν κατ’ αὐτοῦ, καὶ ἴσαι αἱ μαρτυρίαι οὐκ ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/056.yaml
  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: de
  text: Denn viele legten gegen ihn falsches Zeugnis ab, und ihre Zeugenaussagen stimmten nicht überein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: viele
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet zahlreiche Personen. „Viele“ bleibt knapp und ergänzt nicht ausdrücklich „Zeugen“, obwohl dies aus dem Verb hervorgeht.
- source_word: γὰρ
  choice: denn
  rationale: Die Partikel begründet beziehungsweise erläutert den vorangehenden Erzählzusammenhang; „denn“ bewahrt diese Verknüpfung natürlich.
- source_word: ἐψευδομαρτύρουν
  choice: sagten falsch … aus
  rationale: Das Imperfekt schildert fortdauernde oder wiederholte falsche Zeugenaussagen. „Falsch aussagen“ ist im modernen Deutschen verständlich und bewahrt den gerichtlichen Sinn.
- source_word: κατ’ αὐτοῦ
  choice: gegen ihn
  rationale: κατά mit Genitiv bezeichnet hier die feindlich gegen Jesus gerichtete Aussage im Gerichtsverfahren.
- source_word: ἴσαι
  choice: stimmten … überein
  rationale: Wörtlich bedeutet das Wort „gleich“. Auf Zeugenaussagen bezogen bezeichnet es ihre Übereinstimmung; die verbale Wiedergabe ist im Deutschen idiomatisch.
- source_word: αἱ μαρτυρίαι
  choice: ihre Aussagen
  rationale: Der Artikel verweist auf die zuvor genannten Aussagen. Das Possessivpronomen stellt den Bezug zu den vielen Personen natürlich her; „Aussagen“ passt zum gerichtlichen Kontext.
- source_word: οὐκ ἦσαν
  choice: stimmten nicht
  rationale: Die verneinte Form von „sein“ wird zusammen mit ἴσαι idiomatisch als „stimmten nicht überein“ wiedergegeben.
- source_word: καί
  choice: doch
  rationale: Die Konjunktion verbindet die beiden Sätze; im Kontext tritt der Gegensatz zwischen der Vielzahl falscher Aussagen und ihrer fehlenden Übereinstimmung hervor. „Doch“ macht diesen im Deutschen natürlich sichtbar.
theological_decisions: []
