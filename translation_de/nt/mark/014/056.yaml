revisions:
- from: Denn viele sagten falsch gegen ihn aus, doch ihre Aussagen stimmten nicht überein.
  to: Denn viele legten gegen ihn falsches Zeugnis ab, und ihre Zeugenaussagen stimmten nicht überein.
  rationale: Die Revision ersetzt die weniger natürliche Wendung „falsch aussagen“ durch die etablierte forensische Formulierung „falsches Zeugnis ablegen“, verwendet für καί die neutrale Verbindung „und“ und benennt die anschließenden μαρτυρίαι als „Zeugenaussagen“. Die Bedeutung sowie die im Imperfekt angelegte wiederholte Handlung bleiben erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:20:28Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft den Sinn insgesamt. „sagten falsch gegen ihn aus“ ist jedoch im modernen Deutschen weniger idiomatisch und kann schwächer als die forensisch geprägte Bedeutung von ἐψευδομαρτύρουν wirken. „falsches Zeugnis ablegen“ gibt den gerichtlichen Charakter und die falsche Bezeugung unmittelbar wieder. Das einfache καί wird besser mit „und“ wiedergegeben; ein ausdrückliches „doch“ verstärkt einen Gegensatz, der zwar sachlich naheliegt, aber nicht markiert ist.
  naturalness: „Falsches Zeugnis gegen ihn ablegen“ und „Zeugenaussagen stimmten nicht überein“ sind natürliche, verständliche Formulierungen im modernen Standarddeutsch und passen zum gerichtlichen Erzählkontext.
  terminology: „Zeugnis ablegen“ bewahrt den juristisch-religiösen Wortschatz von ψευδομαρτυρέω. „Zeugenaussagen“ macht bei μαρτυρίαι den Kontext klar, ohne über die Aussage hinauszugehen.
  issues:
  - severity: medium
    issue: „sagten falsch gegen ihn aus“ ist stilistisch und semantisch weniger präzise.
    rationale: Die Formulierung ist zwar verständlich, klingt jedoch ungewohnt und bringt die Bedeutung des Verbs als „falsches Zeugnis ablegen“ nicht so klar zum Ausdruck.
  - severity: low
    issue: „doch“ gibt καί einen stärker adversativen Akzent.
    rationale: Die fehlende Übereinstimmung steht inhaltlich im Kontrast zur Vielzahl der Aussagen, doch der griechische Text verbindet die Sätze schlicht mit καί.
  revised_text: Denn viele legten gegen ihn falsches Zeugnis ab, und ihre Zeugenaussagen stimmten nicht überein.
  revised_footnotes: []
