  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: de
  text: 'Da zerriss der Hohepriester seine Gewänder[a] und sagte[b]: »Wozu brauchen wir noch Zeugen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Untergewänder«; das griechische Wort bezeichnet genauer ein hemdartiges Gewand beziehungsweise eine Tunika.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Griechischen das historische Präsens: »sagt«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀρχιερεὺς
  choice: der Hohe Priester
  rationale: Die übliche und präzise deutsche Bezeichnung für den einzelnen amtierenden ἀρχιερεύς in dieser Verhörszene.
- source_word: διαρρήξας
  choice: zerriss
  rationale: Gibt das kräftige Zerreißen des Aoristpartizips klar und in natürlichem modernem Deutsch wieder.
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: seine Gewänder
  rationale: Bewahrt den Plural und vermeidet die unbelegte Festlegung auf Amtsgewänder; χιτών kann genauer ein Untergewand oder eine Tunika bezeichnen.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens des griechischen Erzählstils wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben; die wörtliche Alternative wird in einer Fußnote genannt.
- source_word: Τί ἔτι χρείαν ἔχομεν μαρτύρων
  choice: Wozu brauchen wir noch Zeugen?
  rationale: Natürliche deutsche Frageform, die sowohl χρεία als auch ἔτι wiedergibt und ausdrückt, dass weitere Zeugen nun als unnötig gelten.
theological_decisions:
- issue: Bedeutung des Zerreißens der Kleidung
  choice: Die Handlung wird ohne Deutung als Zerreißen seiner Gewänder wiedergegeben.
  alternative: Die Geste ausdrücklich als Trauer, Empörung oder Reaktion auf vermeintliche Gotteslästerung erklären.
  rationale: Der Vers selbst erzählt die Handlung, deutet ihr Motiv jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese narrative und theologische Zurückhaltung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Da« setzt die Handlung erzählerisch fort; »Wozu brauchen wir noch Zeugen?« ist idiomatisch, ohne die rhetorische Aussage über den Wortlaut hinaus auszudeuten.
