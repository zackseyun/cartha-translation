  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: de
  text: 'Jesus erwiderte ihnen: „Seid ihr mit Schwertern und Knüppeln ausgezogen, um mich festzunehmen, als ginge es gegen einen Räuber[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Bandit“ oder „Aufständischer“; das griechische Wort kann einen gewalttätigen Räuber oder einen Aufständischen bezeichnen, nicht nur einen Dieb.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: erwiderte
  rationale: Die griechische Redeformel wird im modernen Deutschen natürlich und ohne unnötige Doppelung wiedergegeben.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: Bin ich etwa ein Räuber, dass …
  rationale: 'Diese idiomatische Frageform bewahrt den vorwurfsvollen, rhetorischen Sinn: Die Bewaffneten behandeln Jesus wie einen gefährlichen Räuber.'
- source_word: λῃστὴν
  choice: Räuber
  rationale: „Räuber“ ist eine klare, geläufige Wiedergabe; der mögliche Sinn eines gewalttätigen Bandenmitglieds oder Aufständischen wird in der Fußnote offengehalten.
- source_word: ἐξήλθατε
  choice: seid ihr … ausgezogen
  rationale: „Ausziehen“ gibt die gezielte bewaffnete Unternehmung und den Aorist im Kontext treffend wieder.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: mit Schwertern und Knüppeln
  rationale: μάχαιρα bezeichnet hier Schwerter beziehungsweise größere Klingenwaffen; ξύλα sind im Zusammenhang als Schlagwaffen gebrauchte Holzknüppel.
- source_word: συλλαβεῖν με
  choice: um mich festzunehmen
  rationale: Die Zweckangabe bezeichnet hier die beabsichtigte Verhaftung Jesu; „festnehmen“ ist im modernen Deutschen präzise und natürlich.
theological_decisions:
- issue: Bedeutungsumfang von λῃστής in Jesu rhetorischer Frage
  choice: „Räuber“ im Haupttext mit erläuternder Fußnote
  alternative: „Bandit“, „Gesetzloser“ oder „Aufständischer“
  rationale: Der griechische Ausdruck kann einen gewalttätigen Räuber oder auch einen Aufständischen bezeichnen. Der Haupttext bleibt verständlich, während die Fußnote die historisch relevante Mehrdeutigkeit bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Doppelwendung „antwortete und sagte“ wird idiomatisch zu „erwiderte“ verdichtet; der rhetorische Vorwurf und die bewaffnete Szenerie bleiben deutlich.
