  - severity: medium
    issue: „überschwänglich“ deutet den Kuss als besonders herzlich oder gefühlsbetont.
    rationale: Das Verb καταφιλέω ist gegenüber φιλέω verstärkt, doch ob die Verstärkung Wiederholung, Nachdruck oder Wärme bezeichnet, ist nicht eindeutig. Eine weniger emotional festgelegte Wiedergabe ist sachgerechter.
