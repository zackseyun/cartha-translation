  text: καὶ ἐλθὼν ⸀εὐθὺς προσελθὼν αὐτῷ λέγει· ⸀Ῥαββί, καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: de
  text: 'Und als er kam, trat er sofort an ihn heran und sagte: »Rabbi!« Und er küsste ihn mit Nachdruck.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »küsste ihn wiederholt« oder »küsste ihn innig«. Das griechische Verb ist stärker als das einfache Wort für »küssen«, legt aber nicht eindeutig fest, ob Wiederholung, besondere Herzlichkeit oder Nachdruck gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: als er kam
  rationale: Das Aoristpartizip bezeichnet hier natürlich den Zeitpunkt der folgenden Handlung.
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt das für Markus typische schnelle Erzähltempo in klarem, modernem Deutsch.
- source_word: προσελθὼν αὐτῷ
  choice: ging er auf Jesus zu
  rationale: Gibt die körperliche Annäherung natürlich wieder. Der Name Jesus verdeutlicht den Bezug von αὐτῷ, ohne den Sinn zu verändern.
- source_word: λέγει
  choice: sagte
  rationale: Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Die im griechischen Text übernommene semitische Anrede bleibt erhalten und bewahrt das historische Kolorit sowie die Ironie der Szene.
- source_word: κατεφίλησεν
  choice: küsste er ihn überschwänglich
  rationale: Das zusammengesetzte Verb kann einen betonten, innigen oder wiederholten Kuss bezeichnen. „Überschwänglich“ macht den demonstrativ verstärkten Charakter erkennbar, ohne eindeutig Wiederholung festzulegen.
theological_decisions:
- issue: Anrede Jesu durch Judas mit Ῥαββί
  choice: Rabbi
  alternative: Lehrer
  rationale: Die Beibehaltung der tatsächlich verwendeten Anrede wahrt die historische Gestalt und die Spannung der Szene, ohne sie theologisch auszudeuten.
- issue: Intensität von κατεφίλησεν
  choice: küsste er ihn überschwänglich
  alternative: küsste er ihn wiederholt / küsste ihn innig
  rationale: Die Übersetzung signalisiert die gegenüber einem schlichten „küssen“ mögliche Verstärkung, lässt aber durch die Fußnote offen, ob sie als Herzlichkeit, Nachdruck oder Wiederholung zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit zügigem Erzählfluss. „Dann“ gliedert die Folge der Handlungen natürlich; „überschwänglich“ bewahrt die auffällige Intensität des griechischen Verbs, während die Fußnote dessen echte Bedeutungsbreite offenhält.
