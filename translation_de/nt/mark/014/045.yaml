  verdict: revise
  source_fidelity: Die Abfolge von Ankunft, unverzüglichem Herantreten, Anrede und Kuss ist getroffen. Der Zusatz „Jesus“ ist zwar kontextuell eindeutig, steht jedoch nicht im griechischen Text, der zweimal nur αὐτῷ/αὐτόν („ihm/ihn“) verwendet. „Überschwänglich“ legt zudem eine emotionale Herzlichkeit nahe, die καταφιλέω hier nicht eindeutig verlangt.
  naturalness: „trat er sofort an ihn heran“ ist modernes, natürliches Standarddeutsch und bewahrt die zwei Bewegungsverben ohne die Wiederholung von „kam“. „küsste ihn mit Nachdruck“ ist idiomatisch genug und gibt die markierte Intensität wieder, ohne Wiederholung oder Herzlichkeit als alleinige Bedeutung festzulegen.
  terminology: „Rabbi“ soll als im griechischen Text erhaltene semitische Anrede beibehalten werden. Für καταφιλέω ist eine neutrale Intensivierung vorzuziehen; die Fußnote dokumentiert die möglichen spezifischeren Lesarten.
