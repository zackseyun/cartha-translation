  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: de
  text: Bleibt wach und betet, damit ihr nicht in Versuchung[a] geratet. Der Geist ist zwar willig, aber das Fleisch ist schwach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in eine Prüfung“ oder „in eine Erprobung“. Das griechische Wort πειρασμός kann sowohl Versuchung als auch Prüfung oder Erprobung bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Bleibt wach
  rationale: Der Imperativ Plural bezeichnet hier im unmittelbaren Zusammenhang von Getsemani zunächst das Wachbleiben und schließt zugleich Wachsamkeit ein.
- source_word: προσεύχεσθε
  choice: betet
  rationale: Der schlichte Imperativ gibt die fortdauernde Aufforderung im natürlichen modernen Deutsch angemessen wieder.
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: damit ihr nicht in Versuchung geratet
  rationale: Die Formulierung bewahrt den Zweck- beziehungsweise Verhütungssinn von ἵνα μή. „In Versuchung geraten“ ist idiomatischer als „in Versuchung hineingehen“, ohne das Bild des Eintretens vollständig aufzugeben.
- source_word: πειρασμόν
  choice: Versuchung
  rationale: Im Warnzusammenhang ist „Versuchung“ die naheliegendste Bedeutung; das Wort kann jedoch auch Prüfung oder Erprobung bezeichnen, was in der Fußnote erhalten bleibt.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: Der Geist ist zwar willig
  rationale: „Geist“ erhält die anthropologische Gegenüberstellung mit dem Fleisch. „Zwar“ bildet zusammen mit „aber“ die μέν–δέ-Struktur natürlich ab; „willig“ bezeichnet die vorhandene innere Bereitschaft.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: aber das Fleisch ist schwach
  rationale: „Fleisch“ wahrt die konkrete und zugleich anthropologisch offene Ausdrucksweise. „Schwach“ gibt die menschliche Gebrechlichkeit wieder, ohne σάρξ als „sündige Natur“ auszudeuten.
theological_decisions:
- issue: Bezug von πνεῦμα
  choice: menschlicher Geist beziehungsweise innere Bereitschaft; Kleinschreibung innerhalb des Satzes wäre im Deutschen nicht unterscheidbar, doch der Artikel „der Geist“ bleibt ohne Zusatz
  alternative: der Heilige Geist
  rationale: Die Gegenüberstellung mit dem Fleisch und die an die schläfrigen Jünger gerichtete Mahnung sprechen vorrangig für den menschlichen Geist. Die Übersetzung ergänzt jedoch keine erklärende Festlegung.
- issue: Bedeutung von σάρξ
  choice: Fleisch
  alternative: Körper; sündige Natur
  rationale: Hier steht menschliche Schwachheit im Vordergrund, nicht ausdrücklich eine ausgearbeitete Lehre von der sündigen Natur. „Fleisch“ bewahrt die theologische Spannung und den Gegensatz zum Geist.
- issue: Bedeutungsumfang von πειρασμός
  choice: Versuchung im Haupttext mit Hinweis auf Prüfung/Erprobung
  alternative: Prüfung oder Erprobung im Haupttext
  rationale: „Versuchung“ passt zur warnenden Aussage, während eine Fußnote die echte lexikalische Mehrdeutigkeit offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vertraute Wendung „Der Geist ist zwar willig, aber das Fleisch ist schwach“ bleibt wegen ihrer Genauigkeit und Verständlichkeit erhalten. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den er sich bezieht.
