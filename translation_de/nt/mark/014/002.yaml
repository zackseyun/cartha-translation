base_translation:
  language: en
  yaml_path: translation/nt/mark/014/002.yaml
  text: For they were saying[a], “Not during the feast, lest there be an uproar from the people.”
translation:
  language: de
  text: 'Denn sie sagten immer wieder: »Nicht während des Festes, sonst könnte es unter dem Volk[a] zu einem Aufruhr kommen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch das Volk«. Der griechische Genitiv τοῦ λαοῦ kann bezeichnen, dass der Aufruhr vom Volk ausgeht oder innerhalb der Volksmenge entsteht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: sie sagten immer wieder
  rationale: Der Imperfekt bezeichnet hier ein andauerndes oder wiederholtes Reden; die Formulierung gibt diesen Aspekt in natürlichem Deutsch wieder.
- source_word: γάρ
  choice: Denn
  rationale: Die Konjunktion erklärt die vorhergehende Aussage und behält den argumentativen Anschluss bei.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Nicht während des Festes
  rationale: Die knappe, elliptische Verneinung des Griechischen bleibt erhalten; der zeitliche Gebrauch von ἐν wird idiomatisch mit „während“ wiedergegeben.
- source_word: μήποτε ἔσται
  choice: sonst könnte es … kommen
  rationale: μήποτε führt eine befürchtete mögliche Folge ein. „Sonst könnte“ klingt im modernen Deutsch natürlich und bewahrt den vorsorglichen Charakter der Aussage.
- source_word: θόρυβος
  choice: Aufruhr
  rationale: Das Wort bezeichnet eine laute öffentliche Unruhe oder tumultartige Störung, ohne zwingend einen voll entwickelten Aufstand zu meinen.
- source_word: τοῦ λαοῦ
  choice: unter dem Volk
  rationale: Der Genitiv kann den Bereich beziehungsweise die beteiligte Menge bezeichnen. „Unter dem Volk“ ist idiomatisch und lässt erkennen, wo der Aufruhr entstehen würde; die mögliche Lesart als Urheberangabe wird in der Fußnote bewahrt.
