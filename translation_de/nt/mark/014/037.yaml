source:
  edition: SBLGNT
  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: de
  text: 'Und er kommt und findet sie schlafend und sagt zu Petrus: »Simon, schläfst du? Konntest du nicht eine Stunde wach bleiben[a]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine Stunde Wache halten«.'
    reason: 'Lexikalische Alternative: γρηγορέω kann neben dem Wachbleiben auch wachsames Aufpassen beziehungsweise Wachehalten bezeichnen.'
lexical_decisions:
- source_word: ἔρχεται
  choice: er kommt
  rationale: Das historische Präsens wird beibehalten, um Markus’ lebendigen Erzählstil wiederzugeben.
- source_word: εὑρίσκει
  choice: findet
  rationale: Auch dieses historische Präsens bleibt erhalten und entspricht der unmittelbaren Erzählweise des griechischen Textes.
- source_word: καθεύδοντας
  choice: schlafend
  rationale: Das Partizip beschreibt den andauernden Vorgang und wird knapp sowie verbal wiedergegeben.
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens wird wie bei den vorangehenden Verben bewahrt.
- source_word: τῷ Πέτρῳ
  choice: zu Petrus
  rationale: Der Dativ bezeichnet den Angesprochenen; im Deutschen ist »zu Petrus« natürlich und eindeutig.
- source_word: Σίμων
  choice: Simon
  rationale: Jesus spricht Petrus mit seinem persönlichen Namen Simon an; der Unterschied zur Erzählerbezeichnung Petrus bleibt erhalten.
- source_word: καθεύδεις
  choice: schläfst du?
  rationale: Die direkte Frage im Präsens wird idiomatisch und mit dem unmittelbaren vorwurfsvollen Ton wiedergegeben.
- source_word: οὐκ ἴσχυσας
  choice: Konntest du nicht
  rationale: ἰσχύω bezeichnet hier praktische Fähigkeit beziehungsweise Vermögen; »konntest du nicht« ist im Deutschen natürlicher als eine ausdrückliche Formulierung mit »stark genug«.
- source_word: μίαν ὥραν
  choice: eine Stunde
  rationale: Der Akkusativ bezeichnet die zeitliche Dauer und lässt sich im Deutschen ohne zusätzliche Präposition natürlich ausdrücken.
- source_word: γρηγορῆσαι
  choice: wach bleiben
  rationale: Im unmittelbaren Gegensatz zum Schlafen steht das Wachbleiben im Vordergrund; zugleich kann das Verb auch wachsames Aufpassen meinen.
theological_decisions:
- issue: Historisches Präsens bei Markus
  choice: 'Die erzählenden Verben stehen im Präsens: »kommt«, »findet«, »sagt«.'
  alternative: 'Wiedergabe im Präteritum: »kam«, »fand«, »sagte«.'
  rationale: Das Präsens bewahrt Markus’ lebendige Erzählweise, ohne im modernen Deutschen unverständlich zu wirken.
- issue: Bedeutungsumfang von γρηγορέω
  choice: Im Haupttext steht »wach bleiben«.
  alternative: »Wache halten« oder »wachen«.
  rationale: Der unmittelbare Kontext stellt das Verb dem Schlafen gegenüber. Die mögliche Nuance des wachsamen Aufpassens wird in einer Fußnote bewahrt, ohne sie im Haupttext einseitig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historischen Präsentia bleiben erhalten. Der Wechsel von der Mehrzahl »sie« zur persönlichen Anrede Simons wird deutlich wiedergegeben; die Satzgliederung ist gegenüber der griechischen Reihung leicht geglättet.
