  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: de
  text: 'Er sagte zu ihnen: »Einer von den Zwölf – der, der mit mir in die Schüssel[a] eintaucht.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Schale«. Das griechische Wort bezeichnet ein Essgefäß, etwa eine Schüssel oder Schale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein schwaches erzählerisches Bindewort. Im modernen Deutschen ergibt die unmittelbare Fortsetzung mit »Er sagte« einen natürlichen Zusammenhang, ohne einen nicht vorhandenen starken Gegensatz einzutragen.
- source_word: εἶπεν αὐτοῖς
  choice: Er sagte zu ihnen
  rationale: Die Formulierung gibt das schlichte Verb λέγω und das indirekte Objekt genau und idiomatisch wieder.
- source_word: Εἷς τῶν δώδεκα
  choice: Einer von den Zwölf
  rationale: Die Wendung bezeichnet einen Angehörigen des engsten Jüngerkreises. Die Großschreibung von »Zwölf« macht die gruppenbezeichnende Verwendung im Deutschen kenntlich.
- source_word: ὁ ἐμβαπτόμενος
  choice: der, der … eintaucht
  rationale: Die substantivierte Präsenspartizipialform hat identifizierende Kraft und stellt die Handlung als gleichzeitig beziehungsweise gegenwärtig dar. Ein deutscher Relativsatz klingt natürlicher als eine nominale Partizipialkonstruktion.
- source_word: μετ’ ἐμοῦ
  choice: mit mir
  rationale: μετά mit Genitiv bezeichnet Begleitung beziehungsweise gemeinsames Handeln und wird direkt mit »mit mir« wiedergegeben.
- source_word: εἰς τὸ τρύβλιον
  choice: in die Schüssel
  rationale: Die Akkusativkonstruktion »in die« bewahrt die durch εἰς bezeichnete Richtung des Eintauchens. τρύβλιον bezeichnet ein schüssel- oder schalenartiges Essgefäß; »Schüssel« ist im heutigen Deutsch anschaulich und verständlich.
theological_decisions: []
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der Gedankenstrich bewahrt den knappen, elliptischen Charakter der Antwort: Zunächst wird der Verräter als einer der Zwölf bezeichnet, danach durch die gleichzeitig ausgeführte Handlung näher bestimmt.'
