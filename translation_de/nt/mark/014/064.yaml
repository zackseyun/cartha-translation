revisions:
- from: Ihr habt die Gotteslästerung gehört. Was meint ihr? Da verurteilten ihn alle als des Todes schuldig.[a]
  to: Ihr habt die Gotteslästerung gehört. Was meint ihr? Sie alle verurteilten ihn als todeswürdig.[a]
  rationale: Die Revision beseitigt eine moderne mögliche Fehlassoziation von „des Todes schuldig“, ohne die offene juristische Bedeutungsweite von ἔνοχον εἶναι θανάτου einzuengen. Die Fußnote dokumentiert sowohl eine nahe traditionelle Wiedergabe als auch die Alternative „dem Tod verfallen“.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:20:32Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe trifft den Ablauf und die juristische Aussage des griechischen Textes insgesamt. Die Perfektform „Ihr habt ... gehört“, „Gotteslästerung“, die idiomatische Beratungsfrage und die betonte Geschlossenheit von πάντες sind angemessen. Die Wendung „des Todes schuldig“ ist zwar traditionssprachlich möglich, kann im modernen Deutsch jedoch missverständlich so klingen, als sei Jesus eines durch den Tod selbst begangenen Delikts schuldig. ἔνοχον εἶναι θανάτου bezeichnet hier seine angenommene Todeswürdigkeit bzw. Strafbarkeit mit dem Tod.
  naturalness: „Was meint ihr?“ ist knapp, idiomatisch und dem Register angemessen. „Da verurteilten ihn alle“ ist verständlich, doch „Da“ setzt einen zeitlichen bzw. folgernden Akzent, den δέ nicht eigens verlangt. „Sie alle“ gibt die griechische Hervorhebung natürlicher wieder.
  terminology: „Gotteslästerung“ wahrt den religiös-rechtlichen Charakter der erhobenen Anklage, ohne deren Berechtigung zu bestätigen. „Todeswürdig“ ist für die juristische Wendung hier klarer und modernes Standarddeutsch; die näher am traditionellen Wortlaut liegende Alternative kann in der Fußnote stehen.
  issues:
  - severity: medium
    issue: „als des Todes schuldig“ ist im heutigen Deutsch missverständlich.
    rationale: Die Formulierung ist zwar an traditionelle Bibelsprache angelehnt, kann aber nahelegen, Jesus sei eines Verbrechens „des Todes“ schuldig. Der griechische Ausdruck meint, dass er nach dem Urteil der Anwesenden die Todesstrafe verdiene bzw. ihr verfalle.
  - severity: low
    issue: „Da“ fügt eine nicht notwendige zeitlich-folgernde Nuance ein.
    rationale: δέ verbindet den folgenden Satz, ohne zwingend ein deutsches „da“ zu verlangen. Eine direkte Satzfolge ist genauer und flüssiger.
  revised_text: Ihr habt die Gotteslästerung gehört. Was meint ihr? Sie alle verurteilten ihn als todeswürdig.[a]
  revised_footnotes:
  - marker: a
    text: 'Oder: „dem Tod verfallen“; wörtlicher: „des Todes schuldig“.'
    reason: lexical_alternative
  revision_rationale: Die Revision beseitigt eine moderne mögliche Fehlassoziation von „des Todes schuldig“, ohne die offene juristische Bedeutungsweite von ἔνοχον εἶναι θανάτου einzuengen. Die Fußnote dokumentiert sowohl eine nahe traditionelle Wiedergabe als auch die Alternative „dem Tod verfallen“.
