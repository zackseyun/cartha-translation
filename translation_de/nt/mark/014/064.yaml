  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: de
  text: Ihr habt die Gotteslästerung gehört. Was meint ihr? Sie alle verurteilten ihn als todeswürdig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Tod verfallen“; wörtlicher: „des Todes schuldig“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: Ihr habt … gehört
  rationale: Das deutsche Perfekt gibt im unmittelbaren Redekontext natürlich wieder, dass die Angesprochenen die Äußerung soeben gehört haben.
- source_word: τῆς βλασφημίας
  choice: die Gotteslästerung
  rationale: Der bestimmte Ausdruck bezeichnet die konkrete, soeben erhobene Anklage; „Gotteslästerung“ bewahrt ihr religiös-rechtliches Gewicht.
- source_word: τί ὑμῖν φαίνεται
  choice: Was meint ihr?
  rationale: Die idiomatische deutsche Frage gibt die Aufforderung zu Urteil oder Stellungnahme klar wieder, ohne den Sinn auf eine förmliche Urteilsformel zu verengen.
- source_word: οἱ δὲ πάντες
  choice: Da … alle
  rationale: „Alle“ erhält die im Griechischen betonte Einstimmigkeit; „da“ führt die Reaktion natürlich fort.
- source_word: κατέκριναν
  choice: verurteilten
  rationale: 'Das Verb hat hier einen klaren gerichtlichen Sinn: ein verurteilendes Urteil fällen.'
- source_word: ἔνοχον εἶναι θανάτου
  choice: als des Todes schuldig
  rationale: Die formell-rechtliche Wendung bewahrt die Spannung zwischen Schuld, Strafwürdigkeit und Verfallenheit an den Tod, ohne sie vorschnell auf eine moderne strafrechtliche Kategorie festzulegen.
theological_decisions:
- issue: βλασφημία als Anklage im Prozess
  choice: Gotteslästerung
  alternative: Lästerung
  rationale: Die Wiedergabe nennt die vom Hohen Rat erhobene Anklage, ohne damit deren Berechtigung durch den Erzähler zu bestätigen.
- issue: ἔνοχον … θανάτου zwischen Schuld und Todeswürdigkeit
  choice: des Todes schuldig
  alternative: dem Tod verfallen / todeswürdig
  rationale: Die gewählte Formulierung wahrt die genuine Bedeutungsbreite der griechischen Rechtswendung. Die verständlicheren Deutungsmöglichkeiten werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist idiomatisch knapp; die abschließende Rechtsformel bleibt bewusst etwas feierlich, um Bedeutungsbreite und theologischen Ernst des griechischen Ausdrucks zu erhalten.
