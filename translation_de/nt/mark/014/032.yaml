    rationale: Die Konstruktion ἕως mit Aoristkonjunktiv setzt den zeitlichen Endpunkt, ohne dass im Deutschen ein Perfekt erforderlich ist. »bis ich bete« wahrt dies knapper und näher am Ausdruck der Vorlage.
