  verdict: revise
  source_fidelity: Der Haupttext bewahrt die historischen Präsensformen von ἔρχονται und λέγει angemessen. »Ort namens Getsemani«, »seinen Jüngern« und »Setzt euch hierher« entsprechen dem Griechischen gut. Bei ἕως προσεύξωμαι ist jedoch »bis ich gebetet habe« stärker abschließend als nötig; das deutsche Präsens »bis ich bete« bildet die offene, durch ἕως gesetzte zeitliche Grenze unmittelbarer ab.
  naturalness: Das historische Präsens ist im deutschen Erzählstil möglich und hier klar. »bis ich bete« ist in einer direkten Aufforderung idiomatisch und vermeidet die leicht unnötige Perfekt-Explizierung. »Setzt euch hierher« ist verständlich; »Setzt euch hier hin« wäre alltagssprachlicher, aber nicht erforderlich.
  terminology: »Getsemani« ist eine vertretbare, quellennähere Wiedergabe von Γεθσημανί; »Jünger« ist der etablierte und sachgerechte Begriff für μαθηταί. Keine theologisch problematische Terminologie.
