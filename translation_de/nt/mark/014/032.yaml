source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: de
  text: 'Und sie kommen zu einem Ort namens Getsemani[a]. Er sagt zu seinen Jüngern: »Setzt euch hierher, bis ich bete.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und sie kamen zu einem Ort namens Getsemani. Er sagte …« Das Griechische verwendet erzählendes Präsens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kommen
  rationale: Das historische Präsens wird beibehalten, da es auch im modernen deutschen Erzählen verständlich ist und Markus’ lebendige Darstellungsweise wiedergibt.
- source_word: χωρίον
  choice: Ort
  rationale: χωρίον kann einen Ort, ein Grundstück oder ein Landgut bezeichnen. »Ort« wahrt die im Kontext bestehende Bedeutungsbreite, ohne die Örtlichkeit näher zu bestimmen.
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: namens Getsemani
  rationale: Die knappe deutsche Wendung gibt die Namensangabe natürlich wieder. Die Form »Getsemani« folgt der griechischen Namensform Γεθσημανί.
- source_word: λέγει
  choice: er sagt
  rationale: Auch hier wird das historische Präsens des griechischen Textes bewahrt.
- source_word: μαθηταῖς
  choice: Jüngern
  rationale: »Jünger« ist im Evangelienkontext die geläufige und präzise Bezeichnung für μαθηταί und erhält das Lehrer-Schüler-Verhältnis.
- source_word: Καθίσατε
  choice: Setzt euch
  rationale: Der Aoristimperativ ist eine direkte Aufforderung. »Setzt euch« ist in diesem Zusammenhang natürlicher als das mögliche, aber statischere »Sitzt«.
- source_word: ὧδε
  choice: hierher
  rationale: In Verbindung mit dem Vorgang des Sichsetzens ist »hierher« idiomatisches Deutsch; gemeint ist der von Jesus bezeichnete Platz.
- source_word: ἕως προσεύξωμαι
  choice: bis ich gebetet habe
  rationale: ἕως mit dem Aoristkonjunktiv bezeichnet hier eine zeitliche Grenze. Das deutsche Perfekt im Nebensatz bringt den Abschluss des Gebets vor dem nächsten Handlungsschritt natürlich zum Ausdruck, ohne dessen Inhalt oder Dauer festzulegen.
