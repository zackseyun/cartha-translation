id: MRK.14.53
reference: Mark 14:53
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: de
  text: Und sie führten Jesus zum Hohen Priester. Da kommen[a] alle führenden Priester, die Ältesten und die Schriftgelehrten zusammen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „kommen zusammen“; im griechischen Text steht hier ein lebendiges historisches Präsens innerhalb der Vergangenheitserzählung.'
    reason: historical_present
lexical_decisions:
- source_word: ἀπήγαγον (ἀπάγω)
  choice: führten … zum
  rationale: Das Verb bezeichnet hier das Wegführen Jesu unter Bewachung. Im Deutschen ist „jemanden zu jemandem führen“ natürlich; das Ziel wird durch πρὸς angegeben, sodass ein zusätzliches „weg“ unnötig wirkt.
- source_word: ἀρχιερέα (ἀρχιερεύς)
  choice: Hohen Priester
  rationale: Der Singular bezeichnet hier den amtierenden beziehungsweise vorsitzenden Hohen Priester und wird von der später genannten Gruppe der ἀρχιερεῖς unterschieden.
- source_word: συνέρχονται (συνέρχομαι)
  choice: kommen … zusammen
  rationale: Die Präsensform wird als historisches Präsens beibehalten. „Zusammenkommen“ gibt die kollektive Versammlung natürlich und genau wieder.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ bewahrt die ausdrückliche umfassende Aussage des griechischen Textes.
- source_word: ἀρχιερεῖς
  choice: führenden Priester
  rationale: Der Plural bezeichnet die hochpriesterliche Führungsschicht. „Führende Priester“ unterscheidet diese Gruppe im modernen Deutsch klar vom einzelnen Hohen Priester.
- source_word: πρεσβύτεροι
  choice: Ältesten
  rationale: Im institutionellen Zusammenhang bezeichnet das Wort anerkannte jüdische Führungspersonen, nicht lediglich ältere Männer.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Die traditionelle und weiterhin verständliche Bezeichnung gibt die schrift- und gesetzeskundigen Fachleute im jüdischen Führungskreis wieder.
theological_decisions:
- issue: Historisches Präsens συνέρχονται innerhalb einer Vergangenheitserzählung
  choice: „Da kommen … zusammen“ im Präsens
  alternative: „Da kamen … zusammen“ im erzählenden Präteritum
  rationale: Das Präsens des Ausgangstextes wird bewahrt, weil es den Szenenwechsel lebendig markiert. Die Fußnote erklärt die für deutsche Leser möglicherweise auffällige Tempusverschiebung, ohne ihr eine besondere theologische Bedeutung zuzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Hoher Priester“ und „Schriftgelehrte“ bleiben als geläufige biblische Amts- beziehungsweise Gruppenbezeichnungen erhalten; „führende Priester“ vermeidet die missverständliche Vorstellung mehrerer gleichzeitiger Hoher Priester. Der zweite Satz bewahrt bewusst das historische Präsens.
