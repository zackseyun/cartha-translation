  text: ἀλλὰ μετὰ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: de
  text: Doch nachdem ich auferweckt worden bin[a], werde ich euch nach Galiläa vorausgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nachdem ich auferweckt worden bin“. Das Griechische verwendet die Passivform von „auferwecken“, eine geläufige Ausdrucksweise für die Auferstehung.'
    reason: Die Anmerkung macht die passivische Form und ihren Auferstehungsbezug ausdrücklich sichtbar.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Die adversative Konjunktion setzt Jesu Ankündigung in Gegensatz zur zuvor vorausgesagten Zerstreuung. „Doch“ ist im Deutschen knapp, natürlich und würdevoll.
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: nachdem ich auferweckt worden bin
  rationale: μετά mit substantiviertem Infinitiv bezeichnet die zeitliche Folge. Die Formulierung bewahrt sowohl die Vorzeitigkeit als auch das Passiv des griechischen Verbs.
- source_word: προάξω ὑμᾶς
  choice: werde ich euch … vorausgehen
  rationale: Das zukünftige προάξω bezeichnet hier, dass Jesus den Jüngern voraus zu einem Ziel geht. „Euch vorausgehen“ ist natürliches modernes Deutsch und erhält die Richtungsbedeutung.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: Bei einer Bewegung zu einem geografischen Ziel wird εἰς im Deutschen idiomatisch mit „nach“ wiedergegeben.
theological_decisions:
- issue: Passivische Auferstehungsformulierung ἐγερθῆναί με
  choice: nachdem ich auferweckt worden bin
  alternative: nachdem ich auferstanden bin
  rationale: Die gewählte Fassung bewahrt das grammatische Passiv und legt nicht stillschweigend eine intransitive Formulierung zugrunde. Zugleich bezeichnet sie im Kontext eindeutig Jesu Auferstehung, ohne den Handelnden ausdrücklich zu benennen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Auferweckt worden bin“ ist bewusst formnäher als das flüssigere „auferstanden bin“; „nach Galiläa“ entspricht dem natürlichen deutschen Sprachgebrauch.
