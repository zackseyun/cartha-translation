  source_fidelity: „Doch“ gibt die adversative Funktion von ἀλλά angemessen wieder. „Nachdem ich auferweckt worden bin“ bildet die zeitliche Vorordnung von μετὰ τὸ ... sowie das Passiv von ἐγερθῆναί με sachgerecht ab, ohne einen Handelnden zu ergänzen. „Werde ich euch nach Galiläa vorausgehen“ entspricht dem Futur προάξω, dem pluralischen Objekt und der Zielangabe εἰς τὴν Γαλιλαίαν.
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch mit einem passenden zurückhaltend-biblischen Register. Die passivische Wendung ist etwas formeller als „auferstanden bin“, aber hier bewusst quellennah und dennoch idiomatisch.
  terminology: „Auferweckt“ bewahrt die für den griechischen Text wichtige passive Auferstehungsformulierung. „Galiläa“ und „euch vorausgehen“ sind terminologisch und stilistisch passend. Die Fußnote erklärt den sprachlichen Befund neutral und ohne konfessionelle Auslegung.
