  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: de
  text: Das Passafest und das Fest der Ungesäuerten Brote standen in zwei Tagen bevor.[a] Die Hohenpriester und die Schriftgelehrten suchten danach, wie sie ihn mit List festnehmen[c] und töten könnten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nach zwei Tagen“. Gemeint ist, dass das Passafest und das Fest der Ungesäuerten Brote unmittelbar bevorstanden.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ergreifen“ beziehungsweise „sich seiner bemächtigen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: waren
  rationale: Das singularische ἦν steht bei der verbundenen Nennung beider Feste; im natürlichen Deutschen verlangt das zusammengesetzte Subjekt den Plural. δέ markiert nur einen milden Übergang und muss hier nicht eigens mit „nun“ wiedergegeben werden.
- source_word: τὸ πάσχα
  choice: das Passafest
  rationale: Im Zusammenhang bezeichnet πάσχα das jüdische Fest, nicht speziell das Passalamm. „Passafest“ ist eindeutig und allgemein verständlich.
- source_word: τὰ ἄζυμα
  choice: das Fest der Ungesäuerten Brote
  rationale: Wörtlich steht „die ungesäuerten [Brote/Dinge]“; im Festkontext ist damit das Fest der Ungesäuerten Brote gemeint. Die Ergänzung „Fest“ macht den Bezug im Deutschen klar.
- source_word: μετὰ δύο ἡμέρας
  choice: waren noch zwei Tage entfernt
  rationale: Die Wendung bedeutet wörtlicher „nach zwei Tagen“ und bezeichnet hier das unmittelbar bevorstehende Fest. Die deutsche Formulierung gibt diesen Zeitbezug idiomatisch wieder.
- source_word: ἐζήτουν
  choice: suchten nach einer Möglichkeit
  rationale: Der Imperfekt beschreibt ein andauerndes Bemühen. Zusammen mit πῶς ist „suchten nach einer Möglichkeit, wie“ im Deutschen natürlich.
- source_word: οἱ ἀρχιερεῖς
  choice: die führenden Priester
  rationale: Der Plural bezeichnet die maßgeblichen Angehörigen der priesterlichen Führung, nicht mehrere amtierende Hohepriester. „Führende Priester“ ist für heutige Leser verständlicher als die traditionelle, potenziell missverständliche Bezeichnung „Hohepriester“.
- source_word: οἱ γραμματεῖς
  choice: die Schriftgelehrten
  rationale: Die etablierte deutsche Bezeichnung trifft die fachkundigen Ausleger und Lehrer der heiligen Schriften.
- source_word: ἐν δόλῳ
  choice: durch eine List
  rationale: δόλος bezeichnet Täuschung, Arglist oder ein listiges Vorgehen. „Durch eine List“ bewahrt die moralische Färbung, ohne den Sinn auf bloße Heimlichkeit zu verengen.
- source_word: κρατήσαντες
  choice: festnehmen
  rationale: Das Partizip bezeichnet hier das Ergreifen Jesu durch feindliche Autoritäten mit dem Ziel, ihn in Gewahrsam zu bringen. „Festnehmen“ ist kontextgerecht; „ergreifen“ bleibt als mögliche wörtlichere Wiedergabe in der Fußnote erhalten.
- source_word: ἀποκτείνωσιν
  choice: töten
  rationale: Das Verb bedeutet direkt „töten“. Die Wiedergabe vermeidet eine unnötig stärker juristische Deutung wie „hinrichten“.
theological_decisions:
- issue: Verhältnis von Passa und dem Fest der Ungesäuerten Brote
  choice: Beide Feste werden ausdrücklich und getrennt genannt.
  alternative: Beide Ausdrücke als einen einzigen Festnamen zusammenziehen.
  rationale: Markus nennt τὸ πάσχα und τὰ ἄζυμα nebeneinander. Die Übersetzung bewahrt diese sprachliche Unterscheidung, ohne ihre enge kalendarische Verbindung zu leugnen.
- issue: Moralische Kennzeichnung des Plans
  choice: ἐν δόλῳ wird mit „durch eine List“ ausdrücklich wiedergegeben.
  alternative: „heimlich“ oder „unbemerkt“
  rationale: Der griechische Ausdruck bezeichnet nicht nur Geheimhaltung, sondern Täuschung beziehungsweise Arglist. Diese ethische Spannung soll im Text erhalten bleiben.
- issue: Art des geplanten Todes
  choice: ἀποκτείνωσιν wird neutral-direkt mit „töten“ übersetzt.
  alternative: „hinrichten“ oder „zu Tode bringen“
  rationale: „Hinrichten“ würde den Vorgang stärker als rechtlich geregelte Exekution bestimmen, als es das Verb an dieser Stelle für sich genommen tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Erzählgang, wird jedoch für einen flüssigen deutschen Satzbau leicht geglättet. „Jesus“ ersetzt das im Griechischen kontextuell eindeutige Pronomen „ihn“, damit der Einzelvers für sich verständlich bleibt. Die Fußnotenmarker [a] und [c] stehen unmittelbar bei den jeweils erläuterten Wendungen.
