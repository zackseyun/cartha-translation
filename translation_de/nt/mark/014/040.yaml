  text: καὶ ⸂πάλιν ἐλθὼν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ ⸂αὐτῶν οἱ ὀφθαλμοὶ⸃ ⸀καταβαρυνόμενοι, καὶ οὐκ ᾔδεισαν τί ⸂ἀποκριθῶσιν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/040.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: de
  text: Und als er wiederkam, fand er sie schlafend; denn ihre Augen waren schwer[a], und sie wussten nicht, was sie ihm antworten sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »denn ihre Augen waren beschwert«; das griechische Bild beschreibt vor Müdigkeit beschwerte oder schwere Augen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλθὼν
  choice: als er wiederkam
  rationale: Die temporale Wiedergabe des vorangestellten Aoristpartizips ist im Deutschen natürlich; »wieder« kennzeichnet die wiederholte Rückkehr.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: fand er sie schlafend
  rationale: Bewahrt sowohl das Verb des Findens als auch den andauernden Vorgang des Schlafens.
- source_word: ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ καταβαρυνόμενοι
  choice: denn ihre Augen waren schwer geworden
  rationale: Gibt die erklärende Funktion von γάρ und das griechische Bild belasteter, schwerer Augen in natürlichem Deutsch wieder.
- source_word: οὐκ ᾔδεισαν
  choice: sie wussten nicht
  rationale: Entspricht der schlichten Aussage fehlenden Wissens, ohne sie als bloßes Nichtverstehen umzudeuten.
- source_word: τί ἀποκριθῶσιν αὐτῷ
  choice: was sie ihm antworten sollten
  rationale: Die indirekte Frage mit dem Konjunktiv wird idiomatisch wiedergegeben und behält die Ausrichtung der Antwort auf Jesus bei.
theological_decisions:
- issue: Grund ihres Schweigens
  choice: Keine Ursache über das Nichtwissen hinaus ergänzt
  alternative: Ihr Schweigen ausdrücklich als Scham oder Schuldgefühl erklären
  rationale: Der griechische Text sagt nur, dass sie nicht wussten, was sie antworten sollten; eine psychologische oder theologische Erklärung wäre eine nicht ausdrücklich belegte Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzfluss bleibt erzählerisch knapp; das Semikolon trennt Feststellung und Begründung, ohne die enge Verbindung aufzulösen.
