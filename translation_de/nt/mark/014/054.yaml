source:
  edition: SBLGNT
  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: de
  text: Und Petrus folgte ihm aus der Ferne bis hinein in den Hof des Hohen Priesters. Dort saß er mit den Dienern zusammen und wärmte sich am Feuer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: am Licht; gemeint ist wahrscheinlich der Feuerschein im Hof.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: mit Abstand
  rationale: Natürliches modernes Deutsch; bewahrt sowohl die räumliche Distanz als auch die erzählerische Vorsicht des Petrus.
- source_word: ἠκολούθησεν αὐτῷ
  choice: folgte ihm
  rationale: Der Aorist wird im deutschen Erzählstil schlicht im Präteritum wiedergegeben.
- source_word: ἕως ἔσω εἰς
  choice: bis hinein in
  rationale: Gibt die ungewöhnlich nachdrückliche Richtungsangabe wieder und macht deutlich, dass Petrus in den Hof gelangte.
- source_word: τὴν αὐλὴν τοῦ ἀρχιερέως
  choice: den Hof des Hohen Priesters
  rationale: αὐλή bezeichnet hier den umschlossenen Hof der Residenz; „Hoher Priester“ ist die etablierte deutsche Bezeichnung.
- source_word: ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν
  choice: Dort saß er mit den Dienern zusammen
  rationale: Die fortdauernde, szenische Handlung wird idiomatisch ausgedrückt; „Diener“ lässt die genaue Funktion der ὑπηρέται offen und vermeidet die möglicherweise zu enge Festlegung auf Wachen oder Amtsträger.
- source_word: θερμαινόμενος
  choice: wärmte sich
  rationale: Gibt die reflexive Bedeutung des Partizips knapp und natürlich wieder.
- source_word: πρὸς τὸ φῶς
  choice: am Feuer
  rationale: Wörtlich steht „beim/gegenüber dem Licht“; im Zusammenhang ist das wärmende Feuer beziehungsweise dessen Feuerschein gemeint. Die idiomatische Wiedergabe steht im Haupttext, die lexikalische Besonderheit in der Fußnote.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Sätze bilden den griechischen Szenenwechsel natürlich ab. „Diener“ bewahrt die funktionale Offenheit von ὑπηρέται; „bis hinein in“ erhält die nachdrückliche Bewegungsangabe.
