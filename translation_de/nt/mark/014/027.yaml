source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: de
  text: 'Und Jesus sagt zu ihnen: „Ihr alle werdet an mir Anstoß nehmen[a], denn es steht geschrieben: ‚Ich werde den Hirten schlagen, und die Schafe werden zerstreut werden.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr alle werdet zu Fall kommen“; auch möglich: „Ihr alle werdet von mir abfallen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: sagte
  rationale: Das griechische historische Präsens belebt die Erzählung; im natürlichen deutschen Erzählstil wird es hier idiomatisch mit dem Präteritum wiedergegeben.
- source_word: σκανδαλισθήσεσθε
  choice: werdet an mir Anstoß nehmen
  rationale: Die Wendung bewahrt das Bild und die Bedeutungsbreite von σκανδαλίζω besser als eine eindeutige Festlegung auf dauerhaften Glaubensabfall. Das sinngemäß ergänzte „an mir“ ergibt sich aus dem unmittelbaren Zusammenhang.
- source_word: γέγραπται
  choice: es steht geschrieben
  rationale: Die feste deutsche Formel gibt das griechische Perfekt Passiv und den fortdauernden Geltungsanspruch des Schriftwortes angemessen wieder.
- source_word: Πατάξω
  choice: Ich werde … schlagen
  rationale: Direkte, moderne Wiedergabe mit der Kraft des griechischen Verbs, ohne altertümliche Sprache.
- source_word: τὸν ποιμένα
  choice: den Hirten
  rationale: Bewahrt den bestimmten Artikel, den Singular und das prophetische Hirtenbild.
- source_word: τὰ πρόβατα
  choice: die Schafe
  rationale: Natürliche und direkte Wiedergabe des Herdenbildes.
- source_word: διασκορπισθήσονται
  choice: werden zerstreut werden
  rationale: Bewahrt Futur und Passiv sowie das Bild einer auseinandergetriebenen Herde.
theological_decisions:
- issue: Bedeutung von σκανδαλισθήσεσθε für das Versagen der Jünger
  choice: werdet an mir Anstoß nehmen
  alternative: werdet zu Fall kommen / werdet von mir abfallen
  rationale: Das Griechische kann Anstoß, Straucheln und Abfall bezeichnen. Die Hauptfassung lässt die Spannung zwischen innerem Anstoß und anschließendem Verlassen Jesu bestehen, statt vorschnell einen endgültigen Glaubensabfall auszudrücken; die Alternativen werden in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das Präteritum entspricht natürlichem deutschem Erzählstil; das Schriftzitat bleibt formal und bildkräftig.
