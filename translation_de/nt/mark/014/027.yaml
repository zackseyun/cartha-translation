  source_fidelity: 'Die Übersetzung gibt σκανδαλισθήσεσθε angemessen als „werdet an mir Anstoß nehmen“ wieder und wahrt damit die im Kontext liegende, aber nicht auf einen endgültigen Abfall festgelegte Bedeutung. Das Schriftzitat ist in Futur, Passiv und Bildsprache zutreffend wiedergegeben. Die Gegenwartsform λέγει sollte jedoch auch im Deutschen als erzählerisches Präsens stehen: „Jesus sagt“ entspricht dem griechischen historischen Präsens unmittelbar und ist in moderner deutscher Bibelerzählung natürlich.'
