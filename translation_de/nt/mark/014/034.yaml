id: MRK.14.34
reference: Mark 14:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: de
  text: 'Und er sagt zu ihnen: „Meine Seele ist zutiefst betrübt, bis zum Tod.[a] Bleibt hier und wacht![b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „bis an den Tod“ oder „zu Tode betrübt“. Der griechische Ausdruck bezeichnet Betrübnis von äußerster, bis zum Tod reichender Intensität.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bleibt wach“. Der Befehl kann sowohl körperliches Wachbleiben als auch wachsame Aufmerksamkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: er sagt
  rationale: Das Präsens bewahrt das für Markus charakteristische historische Präsens und damit die Unmittelbarkeit der Erzählung.
- source_word: Περίλυπός
  choice: zutiefst betrübt
  rationale: Die Formulierung gibt die außerordentlich starke Trauer und Bedrängnis natürlich und würdig wieder, ohne ihre genaue Art enger festzulegen.
- source_word: ἡ ψυχή μου
  choice: meine Seele
  rationale: „Seele“ entspricht der Ausdrucksweise des griechischen Textes und bezeichnet hier Jesu Inneres beziehungsweise seine ganze Person in ihrer tiefen Bedrängnis.
- source_word: ἕως θανάτου
  choice: bis zum Tod
  rationale: Die knappe Wiedergabe bewahrt die Mehrdeutigkeit zwischen einer bis an den Tod reichenden Betrübnis und einer Betrübnis von tödlicher Intensität.
- source_word: μείνατε ὧδε
  choice: Bleibt hier
  rationale: Der Imperativ fordert die Jünger schlicht auf, an diesem Ort zu bleiben; „Bleibt hier“ ist im modernen Deutsch klar und natürlich.
- source_word: γρηγορεῖτε
  choice: wacht
  rationale: „Wacht“ umfasst im Zusammenhang sowohl das Wachbleiben als auch die aufmerksame, wachsame Haltung und erhält die knappe Eindringlichkeit des Befehls.
theological_decisions:
- issue: Bedeutung von ψυχή in Jesu Aussage
  choice: Seele
  alternative: Innerstes; Leben; ich selbst
  rationale: Die Übersetzung wahrt die anthropologische Bildsprache des griechischen Textes und bezeugt Jesu wirkliche menschliche Bedrängnis, ohne eine spätere lehrmäßige Erklärung in den Vers einzutragen.
- issue: Reichweite von γρηγορεῖτε
  choice: wacht
  alternative: bleibt wach
  rationale: Der Zusammenhang schließt körperliches Wachbleiben ein, doch das Verb kann zugleich auf wachsame Aufmerksamkeit zielen. „Wacht“ hält beide Aspekte offen.
- issue: Sinn von ἕως θανάτου
  choice: bis zum Tod
  alternative: bis an den Tod; zu Tode betrübt
  rationale: Der Ausdruck bezeichnet die äußerste Intensität von Jesu Betrübnis, lässt aber offen, ob stärker die Todesnähe, die tödliche Wirkung oder die Grenze „bis zum Tod“ hervorgehoben wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem und eindringlichem Ton. Das markinische historische Präsens bleibt erhalten; die Imperative sind knapp formuliert.
