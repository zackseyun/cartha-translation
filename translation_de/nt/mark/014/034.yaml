  verdict: approve
  source_fidelity: 'Der Entwurf gibt alle Elemente des griechischen Textes präzise wieder: das markinische historische Präsens („er sagt“), die intensive Betrübnis (Περίλυπος), ψυχή als „Seele“, die idiomatische Steigerung ἕως θανάτου („bis zum Tod“), den Ortsbezug („hier“) sowie die beiden Imperative. „Bis zum Tod“ bewahrt die knappe, intensive und nicht weiter aufgelöste Ausdrucksweise des Grundtexts.'
  naturalness: Das Deutsch ist modernes Standarddeutsch und zugleich dem ernsten Erzählton angemessen. „Zutiefst betrübt“ und „Bleibt hier und wacht!“ sind klar, idiomatisch und eindringlich. Das historische Präsens ist in diesem narrativen Kontext gut vertretbar.
  terminology: „Seele“ ist als traditionelle und semantisch tragfähige Wiedergabe von ψυχή angemessen, ohne eine technische anthropologische Aussage zu erzwingen. „Wacht“ gibt γρηγορεῖτε knapp wieder und lässt sowohl Wachbleiben als auch wachsame Aufmerksamkeit offen. Die Fußnoten bieten sinnvolle Alternativen, ohne den Text dogmatisch einzuengen.
