id: MRK.14.9
reference: Mark 14:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: de
  text: 'Amen, ich sage euch: Wo immer die gute Nachricht[a] in der ganzen Welt verkündet wird, wird man auch davon erzählen, was diese Frau getan hat – zu ihrem Gedenken.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Evangelium“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „als Erinnerung an sie“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Amen
  rationale: Die übernommene semitische Bekräftigungsformel ist im Deutschen geläufig und bewahrt den feierlichen, autoritativen Klang der Aussage.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: Die schwache weiterführende Partikel wird durch den natürlichen Anschluss der Aussage ausreichend vermittelt; ein ausdrückliches „aber“ würde einen zu starken Gegensatz erzeugen.
- source_word: λέγω ὑμῖν
  choice: ich sage euch
  rationale: Die direkte, im Deutschen etablierte Formulierung bewahrt Anrede und Nachdruck.
- source_word: ὅπου ἐὰν
  choice: wo immer
  rationale: Die Verbindung bezeichnet unbestimmt jeden Ort, an dem die genannte Voraussetzung erfüllt ist.
- source_word: κηρυχθῇ
  choice: verkündet wird
  rationale: „Verkündet“ gibt den Sinn öffentlicher Bekanntmachung wieder, ohne ihn auf eine Predigt im engeren Sinn zu beschränken.
- source_word: τὸ εὐαγγέλιον
  choice: die gute Nachricht
  rationale: Die Formulierung gibt den Bedeutungsgehalt des griechischen Wortes verständlich wieder; der traditionelle Fachausdruck „das Evangelium“ bleibt in einer Fußnote erhalten.
- source_word: εἰς ὅλον τὸν κόσμον
  choice: in der ganzen Welt
  rationale: Die Wendung gibt die umfassende räumliche Reichweite idiomatisch und ohne unnötige Einengung wieder.
- source_word: καὶ
  choice: auch
  rationale: '„Auch“ macht die additive Aussage deutlich: Mit der Verkündigung der guten Nachricht wird ebenso von der Tat der Frau erzählt werden.'
- source_word: ὃ ἐποίησεν αὕτη
  choice: was diese Frau getan hat
  rationale: Das feminine Demonstrativpronomen verweist im unmittelbaren Zusammenhang eindeutig auf die Frau; ihre ausdrückliche Benennung schafft im Deutschen Klarheit.
- source_word: λαληθήσεται
  choice: wird man davon erzählen
  rationale: Die unpersönliche deutsche Konstruktion gibt die passive Zukunftsaussage natürlich wieder und passt zur Weitergabe der Tat in der mündlichen Verkündigung.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: zu ihrem Gedenken
  rationale: Die Formulierung bewahrt Zweck beziehungsweise Ergebnis des Erinnerns und lässt die knappe griechische Wendung in würdigem, natürlichem Deutsch erklingen.
theological_decisions:
- issue: Wiedergabe von εὐαγγέλιον in der Aussage über die weltweite Verkündigung
  choice: die gute Nachricht
  alternative: das Evangelium
  rationale: „Gute Nachricht“ legt den griechischen Bedeutungsgehalt offen und bleibt allgemein verständlich. Der kirchlich etablierte Ausdruck „Evangelium“ wird als gleichberechtigte lexikalische Alternative in der Fußnote genannt.
- issue: Bezug des femininen Demonstrativpronomens αὕτη
  choice: diese Frau
  alternative: sie; diese
  rationale: Der unmittelbare Erzählzusammenhang identifiziert die bezeichnete Person als die Frau. Die Explizierung klärt den Bezug, ohne eine zusätzliche theologische Deutung einzutragen.
- issue: Bedeutungsnuance von εἰς μνημόσυνον αὐτῆς
  choice: zu ihrem Gedenken
  alternative: als Erinnerung an sie
  rationale: Die Hauptfassung bewahrt den memorialen Charakter und die mögliche Zwecknuance. Die Alternative verdeutlicht, dass sowohl das Erinnern an die Frau als auch die erinnernde Funktion der Erzählung im Blick sein kann.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Ton. „Amen, ich sage euch“ bewahrt die markante Redeform Jesu; die übrige Satzführung ist idiomatisch und gut vorlesbar.
