  source_fidelity: 'Die Grundstruktur und die wesentlichen Elemente des griechischen Textes sind zutreffend wiedergegeben: der Nachdruck in αὐτός, das Futur, der große Raum im oberen Teil des Hauses, dessen Zustand sowie der an die Jünger gerichtete Pluralimperativ mit „für uns“. „Bereitstehend“ trifft ἕτοιμον jedoch nicht idiomatisch und verschiebt den Sinn leicht in Richtung bloßer Verfügbarkeit. ἕτοιμον bezeichnet hier, dass der Raum bereit/vorbereitet ist.'
  naturalness: „Raum im Obergeschoss“ ist modernes, klares Standarddeutsch. Die Verbindung „hergerichtet und bereitstehend“ klingt allerdings unnatürlich; insbesondere ist „bereitstehend“ bei einem Raum ungebräuchlich. Ein Relativsatz mit „hergerichtet und bereit ist“ ist flüssig und bewahrt die zwei griechischen Prädikativa.
  terminology: „Raum im Obergeschoss“ ist eine angemessene moderne Wiedergabe von ἀνάγαιον. „Hergerichtet“ kann ἐστρωμένον im Kontext sachgerecht wiedergeben, ohne die Auslegung auf bloße Möblierung zu beschränken. „bereit“ ist die direkte, natürliche Entsprechung von ἕτοιμον. Die Fußnote bewahrt die lexikalische Offenheit von ἐστρωμένον angemessen.
