base_translation:
  language: en
  yaml_path: translation/nt/mark/014/015.yaml
  text: And he himself will show you a large upper room[a], furnished and ready; prepare for us there.
translation:
  language: de
  text: Und er selbst wird euch einen großen Raum im Obergeschoss zeigen, der hergerichtet und bereit ist; dort bereitet alles für uns vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen großen Raum oben, ausgelegt und bereit“. Das Partizip ἐστρωμένον kann einen ausgelegten oder hergerichteten Raum bezeichnen und meint nicht zwingend nur, dass er möbliert war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: er selbst
  rationale: Die ausdrückliche Verwendung des Pronomens trägt Nachdruck; „er selbst“ bewahrt ihn natürlich im Deutschen.
- source_word: δείξει
  choice: wird … zeigen
  rationale: Das Futur von δείκνυμι bezeichnet hier ein künftiges Zeigen bzw. Vorweisen.
- source_word: ἀνάγαιον
  choice: Raum im Obergeschoss
  rationale: Das Wort bezeichnet einen Raum im oberen Teil eines Hauses; diese Wiedergabe ist im heutigen Deutsch klarer als das traditionellere „Obergemach“.
- source_word: μέγα
  choice: großen
  rationale: Gibt die schlichte Größenangabe direkt wieder.
- source_word: ἐστρωμένον
  choice: hergerichteten
  rationale: Das Partizip kann einen ausgelegten oder für die Nutzung eingerichteten Raum bezeichnen. „Hergerichtet“ wahrt diese Breite, ohne bloße Möblierung festzulegen.
- source_word: ἕτοιμον
  choice: bereitstehenden
  rationale: Bewahrt die Aussage, dass der Raum bereits zur Verfügung steht, und vermeidet eine unnötige Wiederholung von „vorbereitet“.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Direkte und natürliche Wiedergabe des lokalen Adverbs.
- source_word: ἑτοιμάσατε
  choice: bereitet alles … vor
  rationale: Der Aoristimperativ Plural fordert die angesprochenen Jünger zur nötigen Vorbereitung auf. Das idiomatische „alles“ ist nicht als zusätzliches Objekt gemeint, sondern macht den absoluten Gebrauch von „vorbereiten“ im Deutschen natürlich.
- source_word: ἡμῖν
  choice: für uns
  rationale: Gibt den Dativ schlicht wieder, ohne die gemeinte Personengruppe näher auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. „Raum im Obergeschoss“ vermeidet das veraltete „Obergemach“. Die beiden Sätze geben den griechischen Anschluss natürlich wieder, ohne das zweite καί eigens mit „und“ abzubilden.
