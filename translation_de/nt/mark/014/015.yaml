revisions:
- from: Und er selbst wird euch einen großen, hergerichteten und bereitstehenden Raum im Obergeschoss[a] zeigen. Dort bereitet alles für uns vor.
  to: Und er selbst wird euch einen großen Raum im Obergeschoss zeigen, der hergerichtet und bereit ist; dort bereitet alles für uns vor.[a]
  rationale: Die Revision ersetzt das unidiomatische und in der Nuance ungenaue „bereitstehenden“ durch „bereit ist“. Die Umformung in einen Relativsatz ermöglicht im modernen Deutsch die natürliche Wiedergabe der beiden auf „Raum“ bezogenen griechischen Prädikativa ἐστρωμένον und ἕτοιμον. Der Satzinhalt, der Nachdruck von „er selbst“, die Ortsangabe sowie der Imperativ bleiben erhalten. Der Fußnotenanker wird an das erläuterte Wort ἐστρωμένον gesetzt.
  reviewer_model: gpt-5.6-terra
