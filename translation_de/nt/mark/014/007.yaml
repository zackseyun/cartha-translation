id: MRK.14.7
reference: Mark 14:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: de
  text: Denn die Armen habt ihr immer bei euch, und sooft ihr wollt, könnt ihr ihnen Gutes tun; mich aber habt ihr nicht immer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντοτε
  choice: immer
  rationale: Die gewöhnliche adverbiale Bedeutung bezeichnet fortdauernde Verfügbarkeit und bewahrt die Wiederholung sowie den Kontrast im Vers.
- source_word: γὰρ
  choice: denn
  rationale: Leitet die Begründung zur vorausgehenden Aussage ein, ohne den logischen Zusammenhang stärker festzulegen.
- source_word: τοὺς πτωχούς
  choice: die Armen
  rationale: Das substantivierte Adjektiv bezeichnet arme Menschen als Gruppe; „die Armen“ ist knapp, natürlich und würdevoll.
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: habt ihr bei euch
  rationale: Gibt die fortdauernde Gegenwart und Erreichbarkeit direkt und idiomatisch wieder.
- source_word: ὅταν θέλητε
  choice: sooft ihr wollt
  rationale: ὅταν mit Konjunktiv bezeichnet einen zeitlich unbestimmten, wiederholbaren Fall. „Sooft“ bringt hier die jederzeit wiederkehrende Gelegenheit prägnant zum Ausdruck.
- source_word: δύνασθε
  choice: könnt ihr
  rationale: Drückt Fähigkeit beziehungsweise Möglichkeit in natürlichem modernem Deutsch aus.
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: ihnen Gutes tun
  rationale: Bewahrt die Bedeutung der griechischen Wendung, ihnen wohltätig beziehungsweise zu ihrem Nutzen zu handeln, ohne sie auf Almosen zu verengen.
- source_word: ἐμὲ δὲ
  choice: mich aber
  rationale: Bewahrt durch die vorangestellte Akkusativform und „aber“ den deutlichen Kontrast zu den Armen.
- source_word: οὐ πάντοτε ἔχετε
  choice: habt ihr nicht immer
  rationale: Gibt Präsens und πάντοτε unmittelbar wieder; vermeidet die interpretierende Verschiebung ins Futur.
theological_decisions:
- issue: Mögliches Missverständnis, Jesus werte die Fürsorge für Arme ab
  choice: 'Der zeitliche und situative Kontrast bleibt stehen: Den Armen kann jederzeit Gutes getan werden, während Jesus nicht immer bei ihnen ist.'
  alternative: Jesus weist die Sorge für Arme zugunsten der Hingabe an ihn zurück.
  rationale: Die ausdrückliche Aussage, dass sie den Armen sooft sie wollen Gutes tun können, bestätigt die fortdauernde Möglichkeit helfenden Handelns. Der Text stellt keine allgemeine Pflicht gegen die andere aus und sollte nicht konfessionell aufgelöst werden.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die parallele Stellung von „immer“ bewahrt den rhetorischen Kontrast; „Gutes tun“ erhält die Breite des griechischen Idioms.
