  text: Καὶ ὀψίας γενομένης ἔρχεται μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/017.yaml
  text: And when evening came[a], he comes with the twelve.
translation:
  language: de
  text: Und als es Abend geworden war, kommt er mit den Zwölf[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit den zwölf“; die Wendung kann als feste Bezeichnung für Jesu Jüngerkreis verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Der übliche erzählerische Anschluss bewahrt den parataktischen Stil des Markus.
- source_word: ὀψίας γενομένης
  choice: als es Abend geworden war
  rationale: Die Genitivus-absolute-Konstruktion bezeichnet den zeitlichen Umstand. Die Formulierung ist natürlich und gibt zugleich den Eintritt des Abends wieder.
- source_word: ἔρχεται
  choice: kommt er
  rationale: Das Präsens wird als historisches Präsens beibehalten und wahrt die lebendige Erzählweise des griechischen Textes.
- source_word: μετὰ τῶν δώδεκα
  choice: mit den Zwölf
  rationale: μετά mit Genitiv bezeichnet Begleitung. „Die Zwölf“ ist im Deutschen eine geläufige Bezeichnung für den engeren Jüngerkreis Jesu, ohne erläuternd „Jünger“ oder „Apostel“ hinzuzufügen.
theological_decisions:
- issue: Bezug von „den Zwölf“
  choice: Die Wendung bezeichnet Jesu engeren Kreis der zwölf Jünger, zu dem an dieser Stelle der Erzählung auch Judas gehört.
  alternative: Explizit „mit seinen zwölf Jüngern“ oder „mit den zwölf Aposteln“
  rationale: Die knappe Bezeichnung des Ausgangstextes bleibt erhalten; eine interpretierende Ergänzung wird vermieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens „kommt“ und der schlichte Anschluss „Und“ bewahren den markinischen Erzählstil. Die Großschreibung „die Zwölf“ kennzeichnet die im Deutschen geläufige Gruppenbezeichnung.
