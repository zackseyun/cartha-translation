  text: Καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/026.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: de
  text: Und nachdem sie ein Loblied gesungen hatten,[a] gingen sie hinaus zum Ölberg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „nachdem sie ein Loblied gesungen hatten“. Das griechische Partizip bezeichnet eine Handlung, die ihrem Hinausgehen vorausging.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine zusätzliche zeitliche oder deutende Nuance einzutragen.
- source_word: ὑμνήσαντες
  choice: nachdem sie den Lobgesang gesungen hatten
  rationale: Das Partizip Aorist bezeichnet eine der Haupthandlung vorausgehende Handlung. „Lobgesang“ gibt den Sinn eines gesungenen Hymnus oder Loblieds in diesem Zusammenhang natürlich wieder.
- source_word: ἐξῆλθον
  choice: gingen sie hinaus
  rationale: Entspricht dem einfachen erzählerischen Sinn von ἐξέρχομαι und bewahrt die im Verb enthaltene Bewegung nach draußen.
- source_word: εἰς
  choice: zum
  rationale: Bei einer Zielangabe ist „zum“ im Deutschen idiomatisch und gibt die gerichtete Bewegung angemessen wieder.
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: Ölberg
  rationale: „Ölberg“ ist die etablierte deutsche geografische Bezeichnung für diesen Ort.
theological_decisions: []
