  source_fidelity: 'Die Abfolge ist zutreffend wiedergegeben: Das Aoristpartizip ὑμνήσαντες bezeichnet eine dem Hinausgehen vorausgehende Handlung. „gingen sie hinaus“ entspricht ἐξῆλθον, und „zum Ölberg“ gibt die Zielrichtung von εἰς τὸ Ὄρος τῶν Ἐλαιῶν idiomatisch und als etablierten Ortsnamen wieder. „den Lobgesang“ ist jedoch bestimmter als das Griechische, das keinen bestimmten einzelnen Gesang identifiziert.'
