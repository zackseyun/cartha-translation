source:
  edition: SBLGNT
  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: de
  text: '„Wir haben ihn sagen hören: ‚Ich werde diesen Tempel, der von Menschenhand gemacht ist[b], niederreißen und innerhalb von drei Tagen[a] einen anderen bauen, der nicht von Menschenhand gemacht ist.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „in drei Tagen“. Die griechische Wendung bezeichnet hier am ehesten die Zeitspanne, innerhalb deren die Handlung geschehen soll.'
    reason: lexical_alternative
  - marker: b
    text: „Von Menschenhand gemacht“ und „nicht von Menschenhand gemacht“ geben den ausdrücklichen Gegensatz der beiden griechischen Wörter wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: ὅτι führt hier den Inhalt der Zeugenaussage ein. Im natürlichen Deutschen wird diese Funktion nach „sagen hören“ am klarsten durch einen Doppelpunkt ausgedrückt.
- source_word: Ἡμεῖς
  choice: Wir
  rationale: Das ausdrücklich gesetzte Pronomen wird beibehalten und bewahrt die Betonung der Selbstbehauptung der Zeugen.
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: wir haben ihn sagen hören
  rationale: Die deutsche Infinitivkonstruktion gibt das Wahrnehmen seiner Äußerung natürlich und eng am griechischen Genitiv mit Partizip wieder.
- source_word: καταλύσω
  choice: ich werde … niederreißen
  rationale: Bei einem Bauwerk bezeichnet das Verb das Abbrechen beziehungsweise Zerstören. „Niederreißen“ ist im Deutschen anschaulich und idiomatisch.
- source_word: τὸν ναὸν τοῦτον
  choice: diesen Tempel
  rationale: „Tempel“ ist hier die allgemein verständliche Wiedergabe; das Demonstrativpronomen erhält den Hinweis auf den konkret vor Augen stehenden Tempel.
- source_word: χειροποίητον
  choice: von Menschenhand gemacht
  rationale: Diese Formulierung ist verständlich und bewahrt den sprachlichen Gegensatz zu ἀχειροποίητον, ohne ihn als bloß „menschlich“ oder ausdrücklich „göttlich“ auszudeuten.
- source_word: διὰ τριῶν ἡμερῶν
  choice: innerhalb von drei Tagen
  rationale: διά mit Genitiv bezeichnet hier am ehesten die Zeitspanne, in deren Verlauf die Handlung geschehen soll. Die mögliche knappere Wiedergabe „in drei Tagen“ wird in einer Fußnote genannt.
- source_word: ἄλλον
  choice: einen anderen
  rationale: Die Wiedergabe wahrt die Aussage, dass an die Stelle des ersten ein anderer Tempel treten soll.
- source_word: ἀχειροποίητον
  choice: nicht von Menschenhand gemacht
  rationale: Die parallele Formulierung erhält den ausdrücklichen Gegensatz zu χειροποίητον und lässt dessen mögliche theologische Tragweite offen.
- source_word: οἰκοδομήσω
  choice: ich werde … bauen
  rationale: Das Verb bedeutet schlicht „bauen“. „Wiederaufbauen“ wäre eine über den griechischen Wortlaut hinausgehende Präzisierung.
theological_decisions:
- issue: Kennzeichnung der Aussage als Zeugenaussage statt als vom Erzähler bestätigtes Jesuswort
  choice: Die Äußerung bleibt als direkte Rede innerhalb der berichteten Aussage der Zeugen stehen.
  alternative: Durch einen Zusatz ausdrücklich von einer angeblichen oder verfälschten Aussage sprechen.
  rationale: Der Zusammenhang kennzeichnet die Worte als Zeugenaussage. Eine harmonisierende oder wertende Erläuterung im Vers selbst würde mehr sagen als der griechische Wortlaut.
- issue: Mögliche theologische Bedeutung des Gegensatzes χειροποίητον / ἀχειροποίητον
  choice: „von Menschenhand gemacht“ / „nicht von Menschenhand gemacht“
  alternative: „menschlich“ / „göttlich“ oder eine ausdrückliche Deutung auf einen geistlichen Tempel
  rationale: Die konkrete sprachliche Gegenüberstellung wird erhalten, während ihre theologische Deutung nicht vorweggenommen wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Niederreißen“ ist bei einem Tempel natürlicher als das allgemeinere „zerstören“. Die parallelen Formulierungen mit „Menschenhand“ bleiben bewusst erhalten.
