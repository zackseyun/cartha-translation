  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ὁ παραδιδούς με ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/042.yaml
  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: de
  text: Steht auf, lasst uns gehen! Seht, der mich verrät[a], ist nahe gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: »der mich ausliefert«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Steht auf
  rationale: Der Imperativ in der zweiten Person Plural fordert die Jünger im unmittelbaren Zusammenhang dazu auf, sich zu erheben und mit Jesus weiterzugehen; »Steht auf« ist dafür natürlich und präzise.
- source_word: ἄγωμεν
  choice: lasst uns gehen
  rationale: Der hortative Konjunktiv der ersten Person Plural wird im modernen Deutsch idiomatisch mit »lasst uns gehen« wiedergegeben.
- source_word: ἰδού
  choice: Seht
  rationale: Die aufmerksamkeitslenkende Interjektion wird mit dem verständlichen, würdigen »Seht« wiedergegeben, ohne das altertümlichere »Siehe« zu verwenden.
- source_word: ὁ παραδιδούς με
  choice: der mich verrät
  rationale: Das substantivierte Präsenspartizip wird im Deutschen natürlich durch einen Relativsatz wiedergegeben. Im Zusammenhang mit Judas bezeichnet παραδίδωμι sein verräterisches Ausliefern Jesu; die wörtlichere Bedeutung »ausliefern« bleibt in der Fußnote erhalten.
- source_word: ἤγγικεν
  choice: ist nahe gekommen
  rationale: Das Perfekt bezeichnet eine vollzogene Annäherung mit gegenwärtigem Ergebnis. »Ist nahe gekommen« bewahrt sowohl die Bewegung als auch die nun bestehende Nähe.
theological_decisions:
- issue: Wiedergabe von παραδίδωμι in der Passionsgeschichte
  choice: verrät
  alternative: ausliefert
  rationale: Bei Judas tritt der Beziehungsbruch des Verrats deutlich hervor. Zugleich kann das Verb sachlicher das Übergeben oder Ausliefern bezeichnen; diese echte lexikalische Spannung wird durch die Fußnote offengehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Kurze Imperative erhalten die Dringlichkeit der Szene; der griechische Partizipialausdruck wird zugunsten natürlichen Deutschen als Relativsatz formuliert.
