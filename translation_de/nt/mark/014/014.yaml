  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: de
  text: 'Und wo immer er hineingeht, sagt zu dem Hausherrn: »Der Lehrer sagt: ›Wo ist mein Gästezimmer[a], in dem ich mit meinen Jüngern das Passamahl essen kann?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Unterkunft“ oder „Raum“; das griechische Wort bezeichnet einen Ort zum Übernachten, hier wahrscheinlich ein Gästezimmer in einem Privathaus und keine gewerbliche Herberge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: wo immer er hineingeht
  rationale: ὅπου mit ἐάν und Aorist Konjunktiv bildet einen unbestimmten Relativsatz. „Wo immer“ gibt diesen Sinn natürlich wieder; „hineingeht“ wahrt die Bewegungsrichtung von εἰσέρχομαι.
- source_word: εἴπατε
  choice: sagt
  rationale: Der Aorist Imperativ Plural richtet sich an beide Jünger. „Sagt“ leitet die folgende direkte Rede knapp und quellennah ein.
- source_word: οἰκοδεσπότῃ
  choice: dem Hausherrn
  rationale: Das Wort bezeichnet den Mann, der dem Haus beziehungsweise Haushalt vorsteht. „Hausherr“ ist im Deutschen prägnant und erhält die im Ausdruck liegende Zuständigkeit.
- source_word: Ὁ διδάσκαλος
  choice: Der Lehrer
  rationale: διδάσκαλος bezeichnet Jesus hier mit einer erkennbaren Anrede beziehungsweise Rollenbezeichnung. „Der Lehrer“ gibt den gewöhnlichen lexikalischen Sinn wieder, ohne einen stärkeren Hoheitstitel einzutragen.
- source_word: τὸ κατάλυμά μου
  choice: mein Gästezimmer
  rationale: κατάλυμα bezeichnet hier im Zusammenhang eines Privathauses am ehesten einen Unterkunfts- oder Gästeraum, nicht eine gewerbliche Herberge. Das ausdrücklich überlieferte μου wird mit „mein“ wiedergegeben.
- source_word: τὸ πάσχα
  choice: das Passamahl
  rationale: πάσχα kann das Fest oder das Mahl bezeichnen. In Verbindung mit „essen“ ist im Deutschen „Passamahl“ die natürliche und kontextuell klare Wiedergabe.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: mit meinen Jüngern
  rationale: „Jünger“ ist die etablierte deutsche Wiedergabe für μαθηταί im Evangelienkontext und bewahrt das Verhältnis zu Jesus.
- source_word: φάγω
  choice: essen kann
  rationale: Der Aorist Konjunktiv steht in einem Relativsatz, der den gesuchten Raum nach seiner vorgesehenen Nutzung bestimmt. „Essen kann“ drückt diese beabsichtigte Möglichkeit im heutigen Deutsch natürlich aus, ohne sie als bloße Zukunftsaussage festzulegen.
theological_decisions:
- issue: Wiedergabe der Selbstbezeichnung διδάσκαλος
  choice: Der Lehrer
  alternative: Der Meister
  rationale: „Lehrer“ entspricht dem gewöhnlichen Sinn des griechischen Ausdrucks und bewahrt die erzählerische Bezeichnung, ohne die stärkere Autoritätsnuance von „Meister“ einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die verschachtelte direkte Rede wird durch deutsche Anführungszeichen klar gegliedert; der Relativsatz bleibt einschränkend und steht daher ohne Komma nach „Gästezimmer“ nur soweit es die deutsche Grammatik erlaubt—im Deutschen ist das Komma vor dem Relativsatz obligatorisch.
