  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: de
  text: 'Sie hat getan, was sie konnte[a]: Sie hat meinen Körper im Voraus für die Bestattung mit Salböl gesalbt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Was sie hatte, hat sie getan.«'
    reason: Die Fußnote bewahrt die formale Struktur von ὃ ἔσχεν ἐποίησεν, während der Haupttext die idiomatische Bedeutung wiedergibt.
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: Sie hat getan, was sie konnte
  rationale: Die Wendung bedeutet idiomatisch, dass sie tat, was in ihren Möglichkeiten lag. Das Perfekt gibt die abgeschlossene Handlung im Deutschen natürlich wieder; die wörtlichere Lesart bleibt in der Fußnote erhalten.
- source_word: προέλαβεν
  choice: im Voraus
  rationale: Das Verb bezeichnet eine vorweggenommene Handlung. Die adverbiale Wiedergabe bezieht es natürlich auf das anschließende Salben.
- source_word: μυρίσαι
  choice: mit Salböl gesalbt
  rationale: μυρίζω bezeichnet hier das Auftragen wohlriechenden Salböls. Die Formulierung wahrt den Bezug zum kostbaren Duftöl des Kontextes und ist im Bestattungszusammenhang verständlich.
- source_word: τὸ σῶμά μου
  choice: meinen Körper
  rationale: Direkte, moderne Wiedergabe der griechischen Nominalgruppe.
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: für die Bestattung
  rationale: Die Präpositionalgruppe bezeichnet die Ausrichtung beziehungsweise den Zweck der Handlung im Hinblick auf Jesu Bestattung.
theological_decisions:
- issue: Das im griechischen Satz nur durch die Verbformen bezeichnete weibliche Subjekt
  choice: Sie
  alternative: Das Subjekt unausgesprochen lassen
  rationale: Der unmittelbare Kontext identifiziert die Frau eindeutig. Im Deutschen muss das Subjekt ausdrücklich genannt werden; dadurch wird keine zusätzliche theologische Aussage eingeführt.
- issue: Bezug von προέλαβεν auf die bevorstehende Bestattung
  choice: Sie hat meinen Körper im Voraus für die Bestattung mit Salböl gesalbt
  alternative: Sie ist zuvor gekommen, um meinen Körper für die Bestattung zu salben
  rationale: προέλαβεν bezeichnet hier das vorzeitige Handeln, nicht eine Bewegung oder ein Kommen. Die gewählte Fassung vermeidet diese sachlich unnötige Ergänzung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. »Bestattung« ist gegenwärtiger als »Begräbnis« und weniger technisch als »Beisetzung«; »mit Salböl gesalbt« verdeutlicht den konkreten Vorgang und den Kontext wohlriechenden Öls.
