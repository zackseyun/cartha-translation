  verdict: revise
  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: τὸ πάσχα bezeichnet beim Schlachten das Passalamm und beim Essen das Passamahl. Die direkte Frage sollte jedoch θέλεις ausdrücklich mit »willst du« wiedergeben; »sollen wir« verschiebt den Akzent von Jesu Wunsch auf eine allgemeine Auftragsfrage. Zudem lautet Ποῦ primär »wo«, nicht »wohin«.'
  naturalness: Der Text ist insgesamt gut verständlich und angemessen im modernen Standarddeutsch. Die Formulierung »Wo willst du, dass wir hingehen und das Passamahl vorbereiten« ist zugleich idiomatischer und näher an der griechischen Satzführung als »Wohin sollen wir gehen und alles vorbereiten«.
  terminology: »Ungesäuerte Brote«, »Passalamm« und »Passamahl« sind passende, etablierte Sachbegriffe. Das ausdrücklich genannte »Passamahl« als Objekt von »vorbereiten« macht den im Griechischen ausgelassenen Gegenstand verständlich und wird durch den folgenden Bezug aufs Essen sachlich getragen.
