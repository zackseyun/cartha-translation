source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: de
  text: 'Am ersten Tag der Ungesäuerten Brote, als man das Passalamm schlachtete,[a] fragten ihn seine Jünger: »Wo willst du, dass wir hingehen und das Passamahl vorbereiten, damit du es essen kannst?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »als sie das Passa schlachteten«. Gemeint ist hier wahrscheinlich das Passalamm.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: Am ersten Tag der Ungesäuerten Brote
  rationale: Die feststehende deutsche Bezeichnung gibt die Genitivkonstruktion natürlich wieder, ohne das im Griechischen nicht ausdrücklich vorhandene Wort »Fest« einzufügen.
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: an dem man das Passalamm schlachtete
  rationale: In Verbindung mit θύω bezeichnet πάσχα hier das Opfertier. Das unpersönliche »man« bildet den nicht näher genannten pluralischen Handlungsträger idiomatisch ab; »schlachtete« passt zum kultischen Vorgang und vermeidet im Deutschen die missverständliche Formulierung, ein Fest werde geopfert.
- source_word: λέγουσιν
  choice: fragten
  rationale: Das historische Präsens wird in natürlichem deutschem Erzählstil als Präteritum wiedergegeben. Wegen der folgenden direkten Frage ist »fragten« kontextgemäß.
- source_word: Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν
  choice: Wohin sollen wir gehen und alles vorbereiten
  rationale: Die idiomatische Frage mit »sollen wir« gibt Jesu gewünschten Auftrag wieder. Das Partizip ἀπελθόντες wird als beigeordnete Handlung ausgedrückt; »alles« macht den absoluten Gebrauch von ἑτοιμάζω natürlich verständlich, ohne einen konkreten zusätzlichen Gegenstand festzulegen.
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: damit du das Passamahl essen kannst
  rationale: »damit« bewahrt den Zweckbezug von ἵνα. Beim Verb »essen« bezeichnet πάσχα kontextuell das Passamahl; »essen kannst« ist modernes, natürliches Deutsch und drückt die durch die Vorbereitungen geschaffene Möglichkeit aus.
theological_decisions:
- issue: Bezug von πάσχα bei den zwei Vorkommen im Vers
  choice: Beim Schlachten als »Passalamm«, beim Essen als »Passamahl« wiedergegeben
  alternative: Beide Vorkommen lediglich mit »Passa« oder beide mit »Passalamm« wiedergeben
  rationale: 'Der jeweilige verbale Kontext bestimmt die Bedeutungsschattierung: θύω weist auf das Opfertier, ἐσθίω auf das Mahl. Damit wird die kultische Situation verständlich, ohne die beiden Verwendungen künstlich gleichzusetzen.'
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Ungesäuerte Brote«, »Passalamm« und »Passamahl« sind etablierte biblische Sachbegriffe; die direkte Rede bleibt natürlich und klar.
