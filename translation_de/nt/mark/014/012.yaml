    issue: Die Wiedergabe von Ποῦ θέλεις mit »Wohin sollen wir«
    rationale: 'Ποῦ fragt nach dem Ort, und θέλεις richtet sich direkt an Jesus: »Wo willst du, dass wir …?« Die Fassung mit »Wohin sollen wir« ist zwar verständlich, gibt aber weder die Ortsfrage noch Jesu Wunsch so genau wieder.'
  - severity: low
    issue: Fußnote bezeichnet die unpersönliche Haupttextfassung als wörtlich
    rationale: Der griechische Text hat bei ἔθυον ein pluralisches Verb (»sie schlachteten«), nicht das deutsche unpersönliche »man schlachtete«. Die Fußnote sollte dies bei einer wörtlichen Angabe korrekt ausweisen.
