  text: καὶ ἀφέντες αὐτὸν ⸂ἔφυγον πάντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/050.yaml
  text: And leaving him, they all fled.
translation:
  language: de
  text: Und alle verließen ihn und flohen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Da
  rationale: Die Konjunktion verbindet die Reaktion unmittelbar mit der vorausgehenden Verhaftung. „Da“ gibt den erzählerischen Fortgang im modernen Deutschen natürlich wieder, ohne eine stärkere Folgerung auszudrücken.
- source_word: ἀφέντες
  choice: verließen
  rationale: Das Aoristpartizip von ἀφίημι bezeichnet hier das Zurücklassen beziehungsweise Verlassen Jesu. Eine koordinierte Verbform ist im Deutschen natürlicher als „ihn verlassend“; „verließen“ bewahrt die Knappheit, ohne die stärkere Wertung von „ließen im Stich“ ausdrücklich einzutragen.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen bezieht sich im Kontext eindeutig auf Jesus und wird direkt mit „ihn“ wiedergegeben.
- source_word: ἔφυγον
  choice: flohen
  rationale: Der Aorist von φεύγω bezeichnet die Flucht aus der Gefahr. „Flohen“ ist knapp, würdevoll und semantisch genauer als das umgangssprachlichere „liefen davon“.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ erhält die betonte Gesamtheit derjenigen, die Jesus begleitet hatten. Durch die deutsche Wortstellung „verließen ihn alle“ erstreckt sich das Subjekt natürlich auf beide Verben.
theological_decisions:
- issue: Umfang des Verlassens Jesu
  choice: alle
  alternative: sie alle / alle von ihnen
  rationale: Der griechische Text betont, dass Jesus in diesem Augenblick von sämtlichen anwesenden Begleitern verlassen wurde. „Alle“ bewahrt diese uneingeschränkte Aussage, ohne die Bezugsgruppe über den unmittelbaren Erzählkontext hinaus zu erweitern.
translation_notes:
  register: Knapper, moderner und würdevoller Erzählstil. Die griechische Partizipialkonstruktion wird für natürliches Deutsch als Folge zweier finiter Verben wiedergegeben; die Reihenfolge der Handlungen bleibt erhalten.
