  text: Καὶ ὄντος τοῦ Πέτρου ⸂κάτω ἐν τῇ αὐλῇ⸃ ἔρχεται μία τῶν παιδισκῶν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/066.yaml
  text: And while Peter was below in the courtyard[a], one of the high priest’s servant girls came,
translation:
  language: de
  text: Während Petrus unten im Innenhof war, kam eine der Dienerinnen[a] des Hohen Priesters.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sklavinnen“. Das griechische Wort παιδίσκη kann eine weibliche Hausbedienstete oder Sklavin bezeichnen; hier steht „Dienerinnen“, weil im Erzählzusammenhang vor allem ihre Aufgabe im Haushalt hervortritt, nicht ihr rechtlicher Status.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: Während Petrus … war
  rationale: Der Genitivus absolutus mit Präsenspartizip bezeichnet hier den zeitlichen Hintergrund; ein deutscher Nebensatz mit „während“ gibt den fortdauernden, szenischen Charakter natürlich wieder.
- source_word: κάτω
  choice: unten
  rationale: Das Wort bezeichnet eine tiefere räumliche Lage. „Unten“ ist im Deutschen natürlich und bewahrt den möglichen Kontrast zu den Vorgängen im oberen Bereich des Hauses.
- source_word: ἐν τῇ αὐλῇ
  choice: im Innenhof
  rationale: αὐλή bezeichnet hier den Hofbereich des Hauses des Hohen Priesters. „Innenhof“ macht die Lage innerhalb des Gebäudekomplexes klar, ohne zusätzliche Einzelheiten einzutragen.
- source_word: ἔρχεται
  choice: kam
  rationale: Das historische Präsens wird für eine flüssige deutsche Erzählung im Präteritum wiedergegeben.
- source_word: μία τῶν παιδισκῶν
  choice: eine der Dienerinnen
  rationale: παιδίσκη kann eine junge weibliche Hausbedienstete oder Sklavin bezeichnen. „Dienerin“ gibt ihre Funktion im Haushalt natürlich wieder; die mögliche Rechtsstellung als Sklavin bleibt in der Fußnote sichtbar.
- source_word: τοῦ ἀρχιερέως
  choice: des Hohen Priesters
  rationale: Der Genitiv bezeichnet ihre Zugehörigkeit zum Haushalt des Hohen Priesters; die knappe deutsche Genitivverbindung bewahrt diese Offenheit.
