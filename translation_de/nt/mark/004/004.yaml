source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ σπείρειν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ἦλθεν τὰ πετεινὰ καὶ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/004.yaml
  text: And as he was sowing[a], some seed fell along the path, and the birds came and devoured it.
translation:
  language: de
  text: Als er säte, fiel ein Teil der Saat an den Weg[a]. Da kamen die Vögel und fraßen ihn auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: neben den Weg.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: Als er säte
  rationale: Die idiomatische Erzählkonstruktion bezeichnet, was während des Säens geschah. Die zeitliche Wiedergabe ist im Deutschen natürlich und vermeidet das schwerfällige »Es geschah beim Säen«.
- source_word: ὃ μὲν
  choice: ein Teil der Saat
  rationale: Das substantivisch gebrauchte Neutrum mit μέν bezeichnet verteilend einen Teil dessen, was ausgesät wurde. Da das Deutsche ein ausdrückliches Bezugswort benötigt, macht »der Saat« den im Zusammenhang vorausgesetzten Bezug verständlich.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Direkte und kontextgerechte Wiedergabe von πίπτω.
- source_word: παρὰ τὴν ὁδόν
  choice: an den Weg
  rationale: παρά mit Akkusativ bezeichnet hier den Bereich seitlich beziehungsweise längs des Weges. »An den Weg« bewahrt diese räumliche Offenheit und passt natürlich zum Bild eines Feldwegs.
- source_word: τὰ πετεινὰ
  choice: die Vögel
  rationale: Das substantivierte πετεινά bezeichnet hier schlicht Vögel; ein Zusatz wie »des Himmels« steht in diesem Vers nicht.
- source_word: κατέφαγεν
  choice: fraßen … auf
  rationale: Das trennbare Verb »auffressen« gibt die verstärkende Bedeutung von κατεσθίω natürlich wieder und passt sachlich zu Vögeln, die Saat aufnehmen.
- source_word: αὐτό
  choice: ihn
  rationale: Das Pronomen bezieht sich auf den als Einheit dargestellten »Teil der Saat«. Das grammatische Geschlecht richtet sich im Deutschen nach »Teil«.
