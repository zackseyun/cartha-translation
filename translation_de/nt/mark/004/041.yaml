  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: de
  text: 'Und sie wurden von großer Furcht erfüllt[a] und sagten zueinander: »Wer ist dieser denn, dass ihm sogar der Wind und das Meer gehorchen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Sie fürchteten eine große Furcht.« Das Griechische verwendet eine verstärkende Ausdrucksweise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: sie wurden von großer Furcht erfüllt
  rationale: Die Verbindung aus Verb und stammverwandtem Akkusativ verstärkt die Aussage. Die gewählte Formulierung gibt diese Intensität in natürlichem, würdigem Deutsch wieder; die wörtliche Struktur wird in der Fußnote kenntlich gemacht.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der Imperfekt kann fortdauerndes oder wiederholtes Reden bezeichnen, doch im deutschen Erzählstil gibt das Präteritum den Vorgang hier natürlich wieder, ohne eine nicht zwingende Dauer hervorzuheben.
- source_word: πρὸς ἀλλήλους
  choice: zueinander
  rationale: Die knappe deutsche Wiedergabe erhält den wechselseitigen Charakter des Gesprächs.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Wer ist dieser eigentlich
  rationale: „Eigentlich“ vermittelt hier die aus Schlussfolgerung und Verwunderung bestehende Nuance von ἄρα idiomatisch, ohne die Frage erklärend auszuweiten.
- source_word: ὅτι
  choice: dass
  rationale: „Dass“ leitet natürlich den erstaunlichen Sachverhalt ein, der die Frage der Jünger begründet.
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: sogar der Wind und das Meer
  rationale: Das erste καί trägt hervorhebende Bedeutung („sogar“), während das zweite die beiden Subjekte verbindet.
- source_word: ὑπακούει αὐτῷ
  choice: ihm gehorchen
  rationale: „Gehorchen“ bewahrt die personifizierende Darstellung der Naturgewalten und die Aussage über Jesu Befehlsgewalt.
theological_decisions:
- issue: Jesu Vollmacht über die Schöpfung
  choice: Die erstaunte Frage der Jünger und der Gehorsam von Wind und Meer werden unmittelbar wiedergegeben.
  alternative: Die Aussage durch eine ausdrückliche Erklärung der göttlichen Identität Jesu erweitern.
  rationale: Der Vers lässt Jesu außergewöhnliche Vollmacht deutlich hervortreten, formuliert aber selbst eine offene Frage. Die Übersetzung bewahrt diese theologische Spannung und fügt keine ausdrückliche Schlussfolgerung hinzu.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Von großer Furcht erfüllt“ vermeidet eine im Deutschen hölzerne Nachbildung des stammverwandten Akkusativs; die Fußnote bewahrt den Einblick in die griechische Ausdrucksweise. Die Anredeform und Satzstellung bleiben knapp und eindringlich.
