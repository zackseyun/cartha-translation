source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: de
  text: Und wenn es ausgesät ist, geht es auf und wird größer als alle Gartenpflanzen. Es treibt große Zweige, sodass sich die Vögel des Himmels[a] in seinem Schatten niederlassen können[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Vögel am Himmel“; traditionell auch: „die Vögel der Luft“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nisten können“ beziehungsweise „wohnen können“. Die Formulierung kann an alttestamentliche Bilder erinnern, in denen Vögel in einem großen Baum Schutz finden (zum Beispiel Ez 17,23; Dan 4,9.18).'
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: es ausgesät ist
  rationale: Der Aorist Passiv Konjunktiv nach ὅταν bezeichnet einen unbestimmten wiederkehrenden Zeitpunkt. „Ausgesät“ bewahrt das Bild des Samens und den sprachlichen Zusammenhang des Gleichnisses.
- source_word: ἀναβαίνει
  choice: geht es auf
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet das Verb das Hervorkommen aus dem Boden; „aufgehen“ ist dafür im Deutschen die natürliche Wendung.
- source_word: γίνεται
  choice: wird
  rationale: Das Verb bezeichnet hier den erreichten Zustand und bewahrt mit „wird“ den Entwicklungsgedanken.
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: größer als alle Gartenpflanzen
  rationale: Der Komparativ wird direkt wiedergegeben. λάχανα meint hier im Garten gezogene Kräuter oder Pflanzen; „Gartenpflanzen“ ist weiter und sachgerechter als das moderne, enger verstandene „Gemüse“.
- source_word: ποιεῖ κλάδους μεγάλους
  choice: treibt große Zweige
  rationale: „Zweige treiben“ ist eine natürliche deutsche Wiedergabe des pflanzlichen Wachstums und entspricht der Bedeutung von ποιεῖ in dieser Verbindung.
- source_word: ὥστε δύνασθαι
  choice: sodass … können
  rationale: Die Konstruktion drückt eine Folge aus; „sodass … können“ gibt sie idiomatisch und knapp wieder.
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: in seinem Schatten
  rationale: Im Deutschen hält man sich idiomatisch „im Schatten“ einer Pflanze auf. Die Formulierung bewahrt das Schutzmotiv, ohne den Ausdruck unnötig wörtlich als „unter seinen Schatten“ wiederzugeben.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: die Vögel des Himmels
  rationale: Die formal nahe, würdige Wendung bewahrt den möglichen Anklang an alttestamentliche Bilder. Im heutigen Deutsch wäre auch „die Vögel am Himmel“ möglich.
- source_word: κατασκηνοῦν
  choice: sich niederlassen
  rationale: Das Verb kann wohnen, lagern oder sich ansiedeln bedeuten. „Sich niederlassen“ passt zu Vögeln und bewahrt zugleich die mögliche alttestamentliche Bildsprache besser als die stärker festlegende Wiedergabe „nisten“.
theological_decisions:
- issue: Möglicher Anklang an alttestamentliche Bilder von Vögeln, die in einem großen Baum Schutz finden
  choice: Das Bild wird ohne ausdrückliche Deutung beibehalten; κατασκηνοῦν wird mit „sich niederlassen“ wiedergegeben.
  alternative: „nisten“, wodurch das Bild unmittelbar auf das Verhalten von Vögeln eingeengt würde.
  rationale: Die Formulierung kann an Ezechiel 17,23 und Daniel 4,9.18 erinnern, erklärt diesen möglichen Bezug aber nicht ausdrücklich. Die Übersetzung lässt daher offen, ob und wie weit das Bild auf Völker oder andere theologische Zusammenhänge zu beziehen ist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Gartenpflanzen“ vermeidet die zu enge moderne Bedeutung von „Gemüse“; „Vögel des Himmels“ und „sich niederlassen“ erhalten die mögliche intertextuelle Resonanz, ohne sie im Haupttext auszudeuten.
