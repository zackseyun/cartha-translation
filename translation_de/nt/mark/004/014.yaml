  text: ὁ σπείρων τὸν λόγον σπείρει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/014.yaml
  text: The sower sows the word[a].
translation:
  language: de
  text: Der Sämann sät das Wort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Botschaft“. Das griechische Wort λόγος kann je nach Zusammenhang „Wort“ oder „Botschaft“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: der Sämann
  rationale: Das substantivierte Partizip bezeichnet denjenigen, der sät. „Der Sämann“ ist knapp und natürlich und bewahrt das Bild des Gleichnisses, ohne wie „der Bauer“ eine allgemeinere Berufsbezeichnung einzutragen.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: λόγος kann hier „Wort“ oder „Botschaft“ bedeuten. „Das Wort“ wahrt die knappe Formulierung des Griechischen und legt den Inhalt nicht ausdrücklich als „Wort Gottes“ oder „Evangelium“ fest.
- source_word: σπείρει
  choice: sät
  rationale: Das Präsens beschreibt die für die Gleichnisdeutung charakteristische Handlung allgemein. Die Verbindung „Sämann sät“ erhält zudem die Wiederholung derselben griechischen Wortwurzel.
theological_decisions:
- issue: Bezug von τὸν λόγον in der Gleichnisdeutung
  choice: das Wort
  alternative: die Botschaft; das Wort Gottes; das Evangelium
  rationale: Der griechische Vers nennt nur τὸν λόγον. Der Zusammenhang weist zwar auf die verkündete göttliche Botschaft, doch eine ausdrückliche Ergänzung würde den offenen Wortlaut interpretierend verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Gleichnisstil. Die lautliche und begriffliche Wiederholung „Sämann sät“ bildet die griechische Wortwurzel σπειρ- angemessen nach.
