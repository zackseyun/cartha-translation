  terminology: »Meer« folgt θάλασσα und ist mit der geografischen Fußnote angemessen erläutert. »Schweig! Verstumme!« erhält zwei nachdrückliche Imperative; die Fußnote sollte die Maulkorbmetapher von πεφίμωσο präzise, aber idiomatisch erklären.
