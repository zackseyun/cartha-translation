source:
  edition: SBLGNT
  text: καὶ διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ εἶπεν τῇ θαλάσσῃ· Σιώπα, πεφίμωσο. καὶ ἐκόπασεν ὁ ἄνεμος, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: de
  text: 'Da wachte er auf, bedrohte den Wind und sagte zum Meer[a]: »Schweig! Verstumme!«[b] Da legte sich der Wind, und es entstand eine große Ruhe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der See Gennesaret; im Griechischen steht »Meer«.
    reason: Die Fußnote erläutert den geografischen Bezug, ohne den Wortlaut des Haupttextes zu ersetzen.
  - marker: b
    text: 'Wörtlicher etwa: »Schweig! Lass dir einen Maulkorb anlegen!« Das zweite Verb gebraucht das Bild eines Maulkorbs.'
    reason: Die Fußnote bewahrt die ungewöhnliche, nachdrückliche Bildsprache von πεφίμωσο, die sich im natürlichen deutschen Haupttext nicht vollständig abbilden lässt.
lexical_decisions:
- source_word: διεγερθεὶς
  choice: Da wachte er auf
  rationale: Das Partizip bezeichnet im Zusammenhang Jesu Erwachen aus dem Schlaf. Die Formulierung gibt den zeitlichen Fortgang natürlich wieder, ohne ausdrücklich festzulegen, ob er selbst erwachte oder geweckt wurde.
- source_word: ἐπετίμησεν
  choice: wies ... zurecht
  rationale: ἐπιτιμάω bezeichnet bei Markus ein nachdrückliches, autoritatives Zurechtweisen. Die deutsche Wendung bewahrt diese Schärfe und passt zur direkten Anrede von Wind und Meer.
- source_word: ἀνέμῳ
  choice: den Wind
  rationale: Das Substantiv bezeichnet hier ausdrücklich den Wind, nicht allgemein den Sturm.
- source_word: θαλάσσῃ
  choice: zum Meer
  rationale: θάλασσα bedeutet wörtlich „Meer“. Diese Wiedergabe folgt dem griechischen Wortlaut, auch wenn das Gewässer geografisch der See Gennesaret ist.
- source_word: Σιώπα
  choice: Schweig!
  rationale: Der Imperativ fordert unmittelbar zum Schweigen auf und ist im Deutschen knapp und kraftvoll.
- source_word: πεφίμωσο
  choice: Sei still!
  rationale: Die wörtliche Vorstellung ist das Anlegen eines Maulkorbs beziehungsweise das Verstummenlassen. „Sei still!“ ist in direkter Rede natürlich und bewahrt die befehlende Kraft; die bildhafte Grundbedeutung wird in der Fußnote genannt.
- source_word: ἐκόπασεν
  choice: legte sich
  rationale: κοπάζω bezeichnet das Nachlassen oder Aufhören von Wind. „Der Wind legte sich“ ist die natürliche deutsche Entsprechung.
- source_word: ἐγένετο γαλήνη μεγάλη
  choice: es entstand eine große Stille
  rationale: Die Formulierung erhält das markinische „groß“ und beschreibt den plötzlich eintretenden Zustand nach dem Sturm, ohne ihn durch „völlig“ interpretierend zu verstärken.
theological_decisions:
- issue: Schärfe und Bildhaftigkeit des Befehls an das Meer
  choice: Im Haupttext „Schweig! Sei still!“, mit Hinweis auf die wörtliche Maulkorbvorstellung in der Fußnote
  alternative: „Schweig! Sei mit einem Maulkorb versehen!“ beziehungsweise „Verstumme!“
  rationale: Der griechische Text enthält zwei Imperative und kein Substantiv für „Friede“. Die gewählte Fassung vermeidet die traditionelle, aber weniger genaue Formel „Friede! Sei still!“; zugleich bleibt sie verständliches, natürliches Deutsch und macht die stärkere Bildsprache transparent.
- issue: Wiedergabe von θάλασσα
  choice: Meer
  alternative: See
  rationale: „Meer“ folgt der gewöhnlichen Bedeutung des griechischen Wortes und bewahrt die Erzählweise des Ausgangstextes. Die geografische Einordnung als See Gennesaret wird lediglich in der Fußnote erläutert.
- issue: Agens des Erwachens Jesu
  choice: 'Keine ausdrückliche Festlegung: „Da wachte er auf“'
  alternative: „Nachdem er geweckt worden war“
  rationale: Die passive Form kann im Kontext auf das Wecken durch die Jünger bezogen werden, wird aber auch intransitiv verstanden. Der Haupttext lässt diese geringe grammatische Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, kraftvoller direkter Rede. Die wiederholte Satzverknüpfung des Griechischen wird zugunsten eines natürlichen deutschen Erzählflusses leicht geglättet; die Folge der Handlungen und das betonte „groß“ bleiben erhalten.
