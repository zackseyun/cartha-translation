source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: de
  text: 'Und dies sind die am Weg, wo das Wort gesät wird: Wenn sie es hören, kommt sofort der Satan und nimmt das Wort weg, das in sie gesät worden ist.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das in ihnen gesät worden ist“.'
    reason: Idiomatiche deutsche Wiedergabe von εἰς αὐτούς; die Hauptfassung bewahrt stärker die Richtungsnuance von εἰς.
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδόν
  choice: Und bei denen am Weg ist es so
  rationale: Die Formulierung gibt die identifizierende Erklärung des Gleichnisses in natürlichem Deutsch wieder. δέ wird leicht verbindend mit „Und“ ausgedrückt; „am Weg“ bewahrt das Bild des Saatguts am Wegrand.
- source_word: ὅπου σπείρεται ὁ λόγος
  choice: Dort wird das Wort gesät
  rationale: „Dort“ nimmt den bildhaften Ort auf. Das Passiv und die wiederkehrende Saatmetaphorik bleiben erhalten; „Wort“ bewahrt die terminologische und biblische Resonanz von λόγος.
- source_word: ὅταν ἀκούσωσιν
  choice: Sobald sie es hören
  rationale: ὅταν mit Aorist Konjunktiv bezeichnet hier den allgemein eintretenden Zeitpunkt. „Sobald“ verbindet das Hören idiomatisch mit dem unmittelbar folgenden Handeln Satans; das Pronomen „es“ bezieht sich eindeutig auf das Wort.
- source_word: εὐθὺς ἔρχεται ὁ Σατανᾶς
  choice: kommt der Satan … sofort
  rationale: „Sofort“ bewahrt die für Markus kennzeichnende Unmittelbarkeit von εὐθύς. Der bestimmte Artikel bei „der Satan“ entspricht üblichem deutschem Sprachgebrauch und der personalen Bezeichnung im Griechischen.
- source_word: αἴρει τὸν λόγον
  choice: nimmt … das Wort weg
  rationale: „Wegnehmen“ gibt den breiten Sinn von αἴρω wieder, ohne das stärker deutende „entreißen“ einzuführen.
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: das in sie hineingesät worden ist
  rationale: Das Partizip wird als Relativsatz wiedergegeben. „In sie hineingesät“ bildet die Richtung von εἰς deutlich ab und lässt das ungewöhnliche, bewusst bildhafte Ineinander von Saat und innerer Aufnahme stehen.
theological_decisions:
- issue: Personale Handlung Satans
  choice: „der Satan“ als handelnde personale Gestalt
  alternative: „der Widersacher“ oder eine unpersönliche Umschreibung
  rationale: ὁ Σατανᾶς bezeichnet in Jesu Gleichniserklärung unmittelbar den persönlich handelnden Satan. Die Übersetzung schwächt dies nicht zu einer bloßen abstrakten Gegenkraft ab.
- issue: Ort beziehungsweise Ziel des gesäten Wortes
  choice: „in sie hineingesät“
  alternative: „unter ihnen gesät“
  rationale: εἰς αὐτούς legt im Zusammenhang mit den Hörenden die Aufnahme in die Menschen nahe. Da εἰς bei Personen je nach Verständnis auch gruppenbezogen aufgefasst werden kann, wird die weniger wahrscheinliche Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „bei denen am Weg ist es so“ macht die Gleichnisdeutung für heutige Leser verständlich, ohne die Bildsprache aufzulösen. Die auffällige Formulierung „in sie hineingesät“ bleibt bewusst erhalten, weil sie die griechische Metapher und ihre mögliche Spannung präzise wiedergibt.
