  verdict: revise
  source_fidelity: 'Der erste Satz gibt ἀφέντες, παραλαμβάνουσιν und die ambige Verbindung ὡς ἦν ἐν τῷ πλοίῳ im Wesentlichen angemessen wieder. „Auch andere Boote begleiteten ihn“ ist jedoch stärker als ἄλλα πλοῖα ἦν μετ’ αὐτοῦ („andere Boote waren bei/mit ihm“): Es macht aus der knappen Orts- bzw. Begleitnotiz ausdrücklich eine aktive Begleitung.'
  naturalness: „wie er im Boot war“ ist zwar verständlich, klingt im modernen Standarddeutsch aber etwas holprig. „so wie er war, im Boot“ bewahrt die griechische Mehrdeutigkeit besser und ist als bewusst knappe erzählerische Formulierung gut lesbar. „waren bei ihm“ ist natürlich und weniger interpretierend als „begleiteten ihn“.
  terminology: „Menschenmenge“ und „Boot(e)“ sind passende moderne Wiedergaben. Es liegen keine besonderen theologischen Terminologiefragen vor.
  issues:
