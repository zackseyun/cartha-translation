    issue: „begleiteten ihn“ interpretiert ἦν μετ’ αὐτοῦ zu aktiv.
    rationale: Das griechische ἦν mit μετὰ αὐτοῦ stellt lediglich fest, dass die anderen Boote bei/mit ihm waren. Eine ausdrückliche Begleithandlung wird nicht gesagt.
  - severity: low
    issue: Die Stellung von „im Boot“ in „wie er im Boot war“ ist im Deutschen leicht schwerfällig.
    rationale: Die Formulierung kann beibehalten werden, aber „so wie er war, im Boot“ bildet die knappe, diskutierte griechische Verbindung idiomatischer ab und erhält beide möglichen Akzente.
  revised_text: Sie ließen die Menschenmenge zurück und nahmen ihn, so wie er war, im Boot mit.[a] Auch andere Boote waren bei ihm.
