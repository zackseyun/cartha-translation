source:
  edition: SBLGNT
  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: de
  text: Sie ließen die Menschenmenge zurück und nahmen ihn, so wie er war, im Boot mit.[a] Auch andere Boote waren bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie nahmen ihn im Boot mit, so wie er war.“ Die griechische Formulierung kann betonen, dass Jesus bereits im Boot war, oder dass sie ihn ohne weitere Vorbereitung mitnahmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες
  choice: ließen … zurück
  rationale: Das Aoristpartizip bezeichnet eine der Haupthandlung vorausgehende Begleithandlung. „Zurücklassen“ gibt das Fortgehen von der Menschenmenge natürlich wieder, ohne eine förmliche Entlassung vorauszusetzen.
- source_word: τὸν ὄχλον
  choice: die Menschenmenge
  rationale: ὄχλος bezeichnet hier die versammelte Menge; „Menschenmenge“ ist gegenwärtiges, allgemein verständliches Deutsch.
- source_word: παραλαμβάνουσιν αὐτόν
  choice: nahmen ihn mit
  rationale: παραλαμβάνω bedeutet in diesem Zusammenhang, jemanden mitzunehmen. Das deutsche Präteritum entspricht dem natürlichen Erzählstil, obwohl das Griechische ein historisches Präsens verwendet.
- source_word: ὡς ἦν ἐν τῷ πλοίῳ
  choice: wie er im Boot war
  rationale: Die Formulierung folgt der griechischen Wortverbindung eng und macht deutlich, dass Jesus sich bereits im Boot befand, bewahrt aber durch die Fußnote die mögliche Betonung seines unveränderten Zustands beziehungsweise fehlender weiterer Vorbereitung.
- source_word: ἄλλα πλοῖα
  choice: andere Boote
  rationale: πλοῖον bezeichnet im erzählten Umfeld ein Boot. Eine Größenangabe wie „klein“ steht nicht im griechischen Text und wird daher nicht ergänzt.
- source_word: ἦν μετ’ αὐτοῦ
  choice: begleiteten ihn
  rationale: Die idiomatische deutsche Wiedergabe bringt zum Ausdruck, dass die anderen Boote mit Jesus unterwegs waren. Der griechische Singular bei einem sächlichen Pluralsubjekt wird sinngemäß pluralisch wiedergegeben.
theological_decisions:
- issue: Bezug und Sinn von ὡς ἦν ἐν τῷ πλοίῳ
  choice: „wie er im Boot war“ betont, dass Jesus bereits im Boot war
  alternative: „so wie er war, im Boot“ kann stärker hervorheben, dass er ohne weitere Vorbereitung mitgenommen wurde
  rationale: Die knappe griechische Wortfolge lässt beide Akzentsetzungen zu. Der Haupttext wahrt den unmittelbaren erzählerischen Zusammenhang; die Fußnote hält die andere plausible Nuance offen, ohne eine theologische Folgerung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Erzähldeutsch. Das historische Präsens des Griechischen wird entsprechend üblichem deutschem Erzählstil im Präteritum wiedergegeben. „Begleiteten ihn“ vermeidet das im Deutschen schwerfällige „waren bei ihm“.
