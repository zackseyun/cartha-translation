  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: de
  text: Wenn aber die Frucht reif ist[a], setzt er sofort die Sichel ein, denn die Ernte ist da.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich zur Ernte freigibt“; auch: „Ertrag bringt“. Wörtlicher etwa: „sich ausliefert“. Im Griechischen steht eine ungewöhnliche aktive Wendung mit „die Frucht“ als Subjekt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Sobald aber
  rationale: ὅταν leitet einen unbestimmten zeitlichen Nebensatz ein; δέ markiert einen leichten Übergang oder Gegensatz. „Sobald aber“ gibt den Fortgang und die zeitliche Unmittelbarkeit im Zusammenhang natürlich wieder.
- source_word: παραδοῖ
  choice: es zulässt
  rationale: 'παραδίδωμι bedeutet gewöhnlich „übergeben, ausliefern“. Mit „die Frucht“ als Subjekt liegt hier eine ungewöhnliche aktive Wendung vor: Die Frucht gibt sich gleichsam zur Ernte frei. „Es zulässt“ bewahrt etwas von dieser Eigenart, ohne die Aussage bloß zu „reif ist“ zu glätten.'
- source_word: ὁ καρπός
  choice: die Frucht
  rationale: καρπός bezeichnet Frucht oder Ertrag. „Die Frucht“ bleibt im Deutschen weit genug und passt zum landwirtschaftlichen Bild, ohne eine bestimmte Getreideart vorauszusetzen.
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ gibt die für Markus typische Unmittelbarkeit klar und in heutigem Deutsch wieder.
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: setzt die Sichel ein
  rationale: Wörtlich steht „schickt die Sichel“. Gemeint ist der Beginn des Mähens. „Setzt die Sichel ein“ ist im Deutschen natürlich und erhält das konkrete Erntebild, auch wenn die Personifizierung des griechischen Ausdrucks abgeschwächt wird.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι nennt hier den Grund für das sofortige Handeln. „Denn“ verbindet die Begründung knapp und würdig mit dem Hauptsatz.
- source_word: παρέστηκεν
  choice: ist da
  rationale: 'Das Perfekt bezeichnet ein eingetretenes und nun bestehendes Gegenwärtigsein: Die Ernte ist gekommen und steht jetzt an. „Ist da“ bringt beides knapp zum Ausdruck.'
- source_word: ὁ θερισμός
  choice: die Ernte
  rationale: θερισμός bezeichnet das Ernten beziehungsweise die Ernte. „Die Ernte“ ist die natürliche und im Kontext hinreichend offene Wiedergabe.
theological_decisions:
- issue: Bildhafte Erntereife im Gleichnis vom Reich Gottes
  choice: Die ungewöhnliche aktive Aussage über die Frucht bleibt in „es zulässt“ erkennbar, ohne den theologischen Bezug der Ernte festzulegen.
  alternative: Deutender mit „reif ist“ übersetzen oder die Ernte ausdrücklich auf Gericht, Mission oder Vollendung beziehen.
  rationale: Der Vers selbst entfaltet die Bedeutung des Erntebildes nicht ausdrücklich. Die Übersetzung bewahrt daher die landwirtschaftliche Metapher und lässt ihre eschatologische oder sonstige theologische Zuordnung offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die ungewöhnliche Formulierung „die Frucht es zulässt“ ist bewusst beibehalten und durch die Fußnote erläutert; konfessionell festgelegte Ausdeutungen des Erntebildes werden vermieden.
