  naturalness: „Wenn aber die Frucht reif ist“ ist modernes, idiomatisches Standarddeutsch. „Die Frucht es zulässt“ bleibt ohne klaren Bezug von „es“ unnötig sperrig. „Sofort die Sichel einsetzen“ und „die Ernte ist da“ sind natürlich und knapp.
