source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: de
  text: 'Und ebenso ist es bei denen, die auf den felsigen Boden gesät sind: Wenn sie das Wort hören, nehmen sie es sofort mit Freude auf,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: ebenso
  rationale: Das Adverb stellt die entsprechende Verbindung zur vorherigen Deutung her und klingt im modernen Deutschen natürlich.
- source_word: ἐπὶ τὰ πετρώδη
  choice: auf den felsigen Boden
  rationale: Die Wendung bezeichnet den durch felsigen Untergrund geprägten Ort. „Felsiger Boden“ bewahrt das landwirtschaftliche Bild und ist idiomatisch.
- source_word: σπειρόμενοι
  choice: die … gesät sind
  rationale: Das Partizip wird als Kennzeichnung der im Gleichnis dargestellten Menschen wiedergegeben; zugleich bleibt das Bild des Säens erhalten.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Das Wort“ wahrt die wiederkehrende Begrifflichkeit und den biblischen Klang; gemeint ist in diesem Zusammenhang die verkündete Botschaft.
- source_word: εὐθύς
  choice: sofort
  rationale: „Sofort“ gibt die zeitliche Unmittelbarkeit prägnant und in natürlichem modernem Deutsch wieder.
- source_word: μετὰ χαρᾶς
  choice: mit Freude
  rationale: Die Präpositionalphrase wird direkt wiedergegeben und beschreibt die Art der Aufnahme.
- source_word: λαμβάνουσιν αὐτόν
  choice: nehmen sie es … auf
  rationale: „Aufnehmen“ entspricht hier dem Hören und Annehmen des Wortes, ohne eine dauerhafte Glaubensreaktion vorwegzunehmen.
theological_decisions:
- issue: Bezug der Gesäten in der Gleichnisdeutung
  choice: Das Bild der Menschen, die auf felsigen Boden gesät sind, wird beibehalten.
  alternative: 'Interpretierend formulieren: Menschen, deren Herzen felsigem Boden gleichen.'
  rationale: Der griechische Text identifiziert die dargestellten Menschen innerhalb des fortgeführten Säbildes. Eine Deutung über ihre Herzen würde nicht ausdrücklich vorhandene Erklärungssprache eintragen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch in würdigem Erzählstil. Die etwas ungewöhnliche Bildaussage „Menschen werden gesät“ bleibt bewusst erhalten, da sie zur Gleichnisdeutung gehört.
