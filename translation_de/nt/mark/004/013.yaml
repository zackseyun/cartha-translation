  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: de
  text: 'Und er sagt zu ihnen: „Versteht ihr dieses Gleichnis nicht? Wie werdet ihr dann all die Gleichnisse verstehen?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Kennt ihr dieses Gleichnis nicht? Und wie werdet ihr all die Gleichnisse erkennen?“ Beide griechischen Verben können Wissen oder Erkennen bezeichnen; hier geht es darum, den Sinn der Gleichnisse zu verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: er sagt
  rationale: Das Präsens bewahrt Markus’ charakteristisches historisches Präsens und die Lebendigkeit der Erzählung.
- source_word: οἴδατε
  choice: versteht ihr
  rationale: οἶδα bedeutet häufig „wissen“ oder „kennen“, bezeichnet hier beim Gleichnis aber das Erfassen seines Sinnes.
- source_word: παραβολὴν
  choice: Gleichnis
  rationale: „Gleichnis“ ist die geläufige und kontextuell genaue Bezeichnung für diese Lehrform Jesu.
- source_word: ταύτην
  choice: dieses
  rationale: Das Demonstrativ verweist unmittelbar auf das zuvor erzählte Gleichnis.
- source_word: καὶ πῶς
  choice: Wie … dann
  rationale: Die Formulierung gibt den folgernden Zusammenhang der beiden Fragen in natürlichem Deutsch wieder; das griechische καί wird dabei idiomatisch durch „dann“ ausgedrückt.
- source_word: πάσας τὰς παραβολὰς
  choice: all die Gleichnisse
  rationale: Die Wendung bezeichnet umfassend die Gleichnisse; „all die“ klingt im Deutschen natürlich und bewahrt den bestimmten Bezug.
- source_word: γνώσεσθε
  choice: werdet ihr … verstehen
  rationale: γινώσκω kann „erkennen“ oder „kennenlernen“ bedeuten; hier geht es um das Erfassen der Bedeutung der Gleichnisse. „Verstehen“ entspricht dem Kontext und erhält die rhetorische Parallelität.
theological_decisions:
- issue: Verhältnis von οἴδατε und γνώσεσθε
  choice: Beide Verben werden mit „verstehen“ wiedergegeben.
  alternative: Das erste Verb mit „kennen/wissen“ und das zweite mit „erkennen/verstehen“ wiedergeben.
  rationale: Im Zusammenhang geht es um das inhaltliche Erfassen der Gleichnisse. Die einheitliche Wiedergabe wahrt die rhetorische Kraft, ohne einen sachfremden Unterschied einzutragen; die lexikalische Differenz wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das historische Präsens bleibt erhalten. Die zwei rhetorischen Fragen und ihre logische Verbindung werden natürlich wiedergegeben.
