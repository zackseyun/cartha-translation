id: MRK.4.8
reference: Mark 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλα ἔπεσεν εἰς τὴν γῆν τὴν καλήν, καὶ ἐδίδου καρπὸν ἀναβαίνοντα καὶ ⸀αὐξανόμενα, καὶ ἔφερεν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: de
  text: 'Und anderes Saatgut[a] fiel auf den guten Boden und brachte Frucht: Es ging auf, wuchs heran und trug dreißigfach, sechzigfach und hundertfach.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „anderes fiel auf den guten Boden“; „Saatgut“ ist aus dem Zusammenhang ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: anderes Saatgut
  rationale: Das substantivisch gebrauchte Neutrum Plural greift im Zusammenhang das zuvor erwähnte Saatgut auf. Im Deutschen wird „Saatgut“ ergänzt, damit der Bezug klar und der Satz natürlich ist.
- source_word: γῆν τὴν καλήν
  choice: den guten Boden
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet γῆ den Ackerboden, in den gesät wird; „Boden“ ist die klare und geläufige deutsche Entsprechung.
- source_word: ἐδίδου καρπὸν
  choice: brachte Frucht
  rationale: Die Wendung gibt den fortdauernden Ertrag des Saatguts idiomatisch wieder. Der Imperfektcharakter wird zusammen mit den anschließenden Wachstumsverben als sich entfaltender Vorgang erkennbar.
- source_word: ἀναβαίνοντα
  choice: ging auf
  rationale: Das Partizip beschreibt im Bild der Aussaat das Emporkommen beziehungsweise Aufgehen der Pflanze.
- source_word: αὐξανόμενα
  choice: wuchs heran
  rationale: Die Wiedergabe bezeichnet die weitere Zunahme nach dem Aufgehen und erhält so die Abfolge des Wachstums, ohne im Deutschen unnatürlich „nahm zu“ zu sagen.
- source_word: ἔφερεν
  choice: trug
  rationale: „Trug“ nimmt die Fruchtsprache natürlich auf und gibt den fortdauernden Ertrag des Imperfekts im Zusammenhang wieder.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: dreißigfach, sechzigfach und hundertfach
  rationale: Die Zahlen bezeichnen Ertragsverhältnisse. Die deutschen Bildungen mit „-fach“ geben diese Vervielfachung knapp und verständlich wieder.
theological_decisions: []
