base_translation:
  language: en
  yaml_path: translation/nt/mark/004/002.yaml
  text: 'And he was teaching them many things in parables[a], and in his teaching he was saying to them:'
translation:
  language: de
  text: 'Und er lehrte sie vieles in Gleichnissen[a] und sprach zu ihnen in seiner Lehre:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er lehrte sie viel in Gleichnissen.“ Das griechische πολλά kann „vieles“ oder zusammenfassender „viel“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Imperfekt schildert das Lehren als fortlaufenden Vorgang. Im Deutschen kann das Präteritum diesen narrativen Verlauf natürlich ausdrücken, ohne eine schwerfällige Verlaufsform zu bilden.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Die Formulierung gibt ἐν mit Dativ als Art beziehungsweise Medium des Lehrens eng und idiomatisch wieder.
- source_word: πολλά
  choice: vieles
  rationale: Das substantivierte Neutrum Plural bezeichnet den umfangreichen Inhalt seiner Unterweisung. „Vieles“ ist im Deutschen natürlich und bewahrt gegenüber „viel“ die mögliche Nuance zahlreicher einzelner Inhalte.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Auch dieses Imperfekt führt in die anschließende Rede hinein. Das deutsche Präteritum ist dafür im Erzählstil natürlich; die Fortdauer ergibt sich aus dem Zusammenhang.
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: in seiner Lehre
  rationale: Die Wiedergabe bleibt nahe an der griechischen Nominalkonstruktion und bewahrt die mögliche Bedeutung von διδαχή als Lehrtätigkeit beziehungsweise Lehrinhalt.
- source_word: καὶ
  choice: Und
  rationale: Das einleitende καί wird beibehalten, um Markus’ parataktischen Erzählstil und den Anschluss an den vorherigen Vers wiederzugeben.
- source_word: αὐτοὺς / αὐτοῖς
  choice: sie / zu ihnen
  rationale: Der Akkusativ bezeichnet die Belehrten als direktes Objekt; der Dativ beim Redeverb wird natürlich mit „zu ihnen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Satzstruktur und Markus’ wiederholtes καί bleiben erkennbar, während die Imperfekte durch das im deutschen Erzählstil natürliche Präteritum wiedergegeben werden. Der Doppelklang „lehrte … in seiner Lehre“ ist bewusst erhalten, da er dem Ausgangstext entspricht.
