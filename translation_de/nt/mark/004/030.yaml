    text: 'Oder: »In welchem Gleichnis sollen wir es darstellen?« Die griechische Formulierung ἐν τίνι παραβολῇ θῶμεν kann instrumental verstanden werden und bezeichnet dann das Gleichnis als Mittel der Darstellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte weiter
  rationale: Das Imperfekt bezeichnet die fortlaufende Rede im Erzählzusammenhang. „Sagte weiter“ gibt diesen Aspekt im Deutschen natürlicher wieder als „war am Sagen“.
- source_word: Πῶς
  choice: Wie
  rationale: Das Fragewort fragt nach der Art und Weise des Vergleichs; „wie“ ist die direkte und natürliche deutsche Entsprechung.
- source_word: ὁμοιώσωμεν
  choice: sollen wir … vergleichen
  rationale: Der deliberative Aorist Konjunktiv wird durch „sollen wir“ angemessen wiedergegeben. „Vergleichen“ ist gegenwartssprachlich und bewahrt den Sinn von ὁμοιόω.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: das Reich Gottes
  rationale: Die etablierte Wendung bewahrt sowohl den Herrschaftsaspekt als auch die im Evangelium gebräuchliche Reich-Metaphorik.
- source_word: ἢ
  choice: oder
  rationale: Verbindet die zweite überlegende Frage als alternative Formulierung der ersten.
- source_word: ἐν τίνι … παραβολῇ
  choice: in welchem Gleichnis
  rationale: Bewahrt die örtlich-assoziative Formulierung mit ἐν, während die instrumentale Deutung „mit welchem Gleichnis“ als echte Alternative in der Fußnote erhalten bleibt.
- source_word: παραβολῇ
  choice: Gleichnis
  rationale: „Gleichnis“ ist der etablierte und kontextuell präzise deutsche Begriff für diese Lehr- und Erzählform.
- source_word: αὐτὴν … θῶμεν
  choice: sollen wir es darstellen
  rationale: Das Pronomen nimmt das Reich Gottes auf. „Darstellen“ gibt die idiomatische Bedeutung von τίθημι in Verbindung mit einem Gleichnis natürlich wieder, ohne beim wörtlichen „setzen“ stehenzubleiben.
