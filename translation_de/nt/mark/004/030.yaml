  naturalness: „In welchem Gleichnis sollen wir es darstellen?“ ist im Deutschen deutlich weniger idiomatisch als „durch/mit welchem Gleichnis“. Die revidierte Fassung ist moderne Standardsprache und bewahrt den würdigen, knappen Erzählton.
  terminology: „Reich Gottes“ und „Gleichnis“ sind etablierte, kontextgerechte Begriffe. „Darstellen“ ist für αὐτὴν … θῶμεν in diesem Zusammenhang eine angemessene idiomatische Wiedergabe.
