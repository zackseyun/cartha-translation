id: MRK.4.25
reference: Mark 4:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: de
  text: Denn wer hat, dem wird gegeben werden; und wer nicht hat, dem wird auch das, was er hat, genommen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: wer
  rationale: Das indefinite Relativpronomen hat allgemeinen, sprichwortartigen Sinn; „wer“ gibt ihn im Deutschen natürlich und knapp wieder.
- source_word: γὰρ
  choice: denn
  rationale: Die Partikel begründet bzw. erläutert die vorangehende Aussage; „denn“ bewahrt diese Verknüpfung.
- source_word: ἔχει
  choice: hat
  rationale: Die einfache Besitzangabe bleibt bewusst ohne ausdrücklich genanntes Objekt und wahrt so die Offenheit des griechischen Textes.
- source_word: δοθήσεται αὐτῷ
  choice: dem wird gegeben werden
  rationale: Das Griechische nennt kein Objekt. Auch im Deutschen ist die objektlose passive Form verständlich und bewahrt die genuine Unbestimmtheit, ohne „mehr“ ausdrücklich hinzuzufügen.
- source_word: καὶ
  choice: und / auch
  rationale: Das erste καί verbindet die beiden gegensätzlichen Satzhälften; das zweite ist steigernd und wird natürlich mit „auch“ wiedergegeben.
- source_word: οὐκ ἔχει
  choice: nicht hat
  rationale: Schlichte Verneinung des Habens; die parallele Formulierung erhält den prägnanten Charakter des Spruches.
- source_word: ὃ ἔχει
  choice: das, was er hat
  rationale: Das sächliche Relativpronomen bezeichnet unbestimmt das Vorhandene; „das, was er hat“ gibt dies klar wieder.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: wird ihm genommen werden
  rationale: Das Futur Passiv von αἴρω mit ἀπό bezeichnet Entzug bzw. Entfernung; die deutsche Wendung ist natürlich und entspricht der passiven Aussage.
theological_decisions:
- issue: Ungenanntes Objekt bei δοθήσεται
  choice: 'Kein Objekt ergänzen: „dem wird gegeben werden“'
  alternative: „dem wird mehr gegeben werden“
  rationale: Der Gegensatz legt zwar eine Zunahme nahe, doch der griechische Wortlaut lässt das Gegebene unausgesprochen. Die deutsche Form ist verständlich und bewahrt diese Offenheit, statt die Folgerung ausdrücklich in den Haupttext einzutragen.
- issue: Generischer maskuliner Singular
  choice: „wer ... dem ... er“
  alternative: Pluralische oder geschlechtsneutrale Umformulierung
  rationale: Die deutsche Konstruktion mit „wer“ und dem anschließenden generischen Singular entspricht Form und allgemeiner Geltung des griechischen Spruches, ohne den Bezug auf Männer zu beschränken.
translation_notes:
  register: Knappes, würdiges und sprichwortartiges Standarddeutsch. Die parallele Satzstruktur und die nicht näher bestimmte Bedeutung von „haben“ und „gegeben werden“ bleiben erhalten.
