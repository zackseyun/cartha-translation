  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: de
  text: 'Und andere sind diejenigen, die in die Dornen gesät werden[a]: Das sind diejenigen, die das Wort gehört haben[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwischen die Dornen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Botschaft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: andere
  rationale: Das substantivisch gebrauchte Adjektiv bezeichnet im Kontrast zu den zuvor genannten Gruppen eine weitere Gruppe; „andere“ ist im Deutschen natürlich und präzise.
- source_word: εἰς τὰς ἀκάνθας
  choice: unter die Dornen
  rationale: „Unter die Dornen“ bewahrt die Richtungsbedeutung von εἰς und entspricht der vertrauten, natürlichen Ausdrucksweise für das Säen in einen bereits von Dornen geprägten Bereich.
- source_word: ἀκάνθας
  choice: Dornen
  rationale: „Dornen“ ist die übliche und hinreichend konkrete Wiedergabe im Zusammenhang des Gleichnisses.
- source_word: σπειρόμενοι
  choice: gesät werden
  rationale: Die präsentische Passivform wird ausdrücklich wiedergegeben und erhält die Gleichsetzung der Menschen mit dem ausgesäten Samen.
- source_word: οὗτοί εἰσιν
  choice: Das sind
  rationale: Die resumptive Identifikationsformel wird knapp und idiomatisch wiedergegeben; „Das“ nimmt die zuvor bezeichnete Gruppe als Ganzes auf.
- source_word: οἱ ... ἀκούσαντες
  choice: diejenigen, die ... gehört haben
  rationale: Das Partizip Aorist bezeichnet das Hören als der folgenden Entwicklung vorausgehenden Vorgang; das deutsche Perfekt gibt dies natürlich wieder.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Das Wort“ erhält den biblischen Sprachgebrauch und die Bezüge innerhalb des Gleichnisses; sachlich ist die verkündete Botschaft gemeint.
theological_decisions:
- issue: Bildhafte Gleichsetzung der Menschen mit dem Saatgut in der Gleichnisauslegung
  choice: „die unter die Dornen gesät werden“
  alternative: „die auf dornigen Boden gesät werden“
  rationale: Die Formulierung erhält die ausdrückliche Saatmetapher des griechischen Textes und entfaltet sie nicht vorschnell durch eine erklärende Umschreibung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt wegen des versübergreifenden Zusammenhangs offen und endet mit einem Komma. Die Wiederholung „andere sind die, die … Das sind diejenigen“ folgt der identifizierenden Struktur des griechischen Textes, ohne die Saatmetapher aufzulösen.
