- from: 'Und andere sind die, die unter die Dornen gesät werden[a]: Das sind diejenigen, die das Wort gehört haben[b],'
  to: 'Und andere sind diejenigen, die in die Dornen gesät werden[a]: Das sind diejenigen, die das Wort gehört haben[b],'
