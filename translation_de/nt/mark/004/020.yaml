source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: de
  text: 'Und diejenigen, die auf den guten Boden gesät worden sind, sind es: Sie hören das Wort, nehmen es an[a] und bringen Frucht – das Dreißigfache, das Sechzigfache und das Hundertfache.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „es willkommen heißen“.'
    reason: Lexikalische Alternative für παραδέχονται; die Formulierung hebt die bereitwillige Aufnahme hervor.
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: bei denen … ist es so
  rationale: Der Rückverweis bezeichnet die zuletzt genannte Gruppe. Die deutsche Konstruktion verbindet ihn natürlich mit dem substantivierten Passivpartizip und der anschließenden Beschreibung.
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: die auf den guten Boden gesät wurden
  rationale: Bewahrt das passive Bild vom ausgesäten Samen und gibt ἐπί mit Akkusativ im Zusammenhang des Gleichnisses als „auf“ wieder.
- source_word: γῆν τὴν καλὴν
  choice: den guten Boden
  rationale: „Boden“ bezeichnet hier idiomatisch die für den Anbau geeignete Erde und erhält den Gegensatz zu den anderen Bodenarten.
- source_word: οἵτινες
  choice: Sie
  rationale: Ein neuer Hauptsatz gibt die kennzeichnende Erklärung im modernen Deutsch natürlich wieder, ohne ihren definierenden Sinn zu verlieren.
- source_word: ἀκούουσιν τὸν λόγον
  choice: hören das Wort
  rationale: „Das Wort“ wahrt die wiederkehrende Begrifflichkeit des Gleichnisses und lässt dessen Bezug auf die verkündete Botschaft bestehen.
- source_word: παραδέχονται
  choice: nehmen es an
  rationale: Das Verb bezeichnet eine positive, zustimmende Aufnahme. „Es“ greift im Deutschen eindeutig „das Wort“ auf.
- source_word: καρποφοροῦσιν
  choice: bringen Frucht
  rationale: Die geläufige Wendung bewahrt das landwirtschaftliche Bild und seine übertragene Bedeutung, ohne diese näher auszudeuten.
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: das Dreißigfache, das Sechzigfache und das Hundertfache
  rationale: Die substantivierten Zahlwörter machen den Ertrag idiomatisch deutlich. Das abschließende „und“ erhält den aufzählenden Rhythmus, ohne im Deutschen unnötig schwer zu wirken.
theological_decisions:
- issue: Art der Reaktion auf das Wort beim guten Boden
  choice: Der Vers beschreibt das Hören, die positive Annahme des Wortes und die daraus folgende Fruchtbarkeit.
  alternative: Die Aussage ausdrücklich als Beleg entweder für notwendiges endgültiges Beharren oder lediglich für eine anfängliche Reaktion auszulegen.
  rationale: Der griechische Text nennt Hören, Annehmen und Fruchtbringen, legt aber kein darüber hinausgehendes Lehrsystem über Beharren oder Abfall fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aussaat- und Fruchtmetaphorik bleibt erhalten; die Satzgliederung vermeidet zugleich eine unnatürlich wörtliche griechische Syntax.
