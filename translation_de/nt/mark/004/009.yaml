base_translation:
  language: en
  yaml_path: translation/nt/mark/004/009.yaml
  text: And he was saying[a], “Whoever has ears to hear, let him hear.”
translation:
  language: de
  text: 'Und er sagte: „Wer Ohren hat zu hören, der höre!“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine im griechischen Bindewort nicht ausdrücklich enthaltene zeitliche Nuance hinzuzufügen.
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das Imperfekt kann im Zusammenhang eine fortlaufende oder wiederholte Redeweise anzeigen. Im heutigen Deutsch ist „er sagte“ hier jedoch die natürliche Erzählform; „er pflegte zu sagen“ würde Wiederholung zu stark hervorheben, „er war am Sagen“ wäre unidiomatisch.
- source_word: Ὃς ἔχει
  choice: Wer ... hat
  rationale: Die substantivierte Relativkonstruktion ist allgemein gemeint. „Wer ... hat“ gibt diesen generischen Sinn im Deutschen knapp und natürlich wieder, ohne ein männliches Geschlecht festzulegen.
- source_word: ὦτα
  choice: Ohren
  rationale: Wörtliche und im Deutschen idiomatische Wiedergabe des Plurals.
- source_word: ἀκούειν
  choice: zu hören
  rationale: Bewahrt sowohl die Verbindung mit „Ohren“ als auch die lexikalische Wiederholung mit dem anschließenden Imperativ desselben Verbs.
- source_word: ἀκουέτω
  choice: der höre
  rationale: Der deutsche Konjunktiv in dieser festen Aufforderungsform gibt den Imperativ der dritten Person würdig und prägnant wieder und erhält den rhetorischen Gleichklang mit „zu hören“.
theological_decisions:
- issue: Generische maskuline Singularform in einem sprichwortartigen Aufruf
  choice: „Wer Ohren hat zu hören, der höre“
  alternative: „Derjenige, der Ohren hat zu hören, soll hören“
  rationale: Das griechische Maskulinum Singular hat generische Funktion. Die deutsche Konstruktion mit „wer ... der“ bewahrt Singular und Allgemeingültigkeit, ohne eine ausschließlich männliche Personengruppe nahezulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, einprägsamem Klang. Die traditionelle Wendung „der höre“ ist weiterhin geläufig und bildet den Imperativ der dritten Person präziser und knapper ab als eine Umschreibung mit „soll“.
