  source_fidelity: Der Komparativ μικρότερον ist korrekt als „kleiner“ wiederzugeben, und die Wiederholung der Ortsbestimmung sowie der weiterführende Gedankenstrich werden beibehalten. Die Relativbeziehung von ὃς sollte jedoch im Deutschen ausdrücklich abgebildet werden. „auf den Boden/auf dem Boden“ macht den landwirtschaftlichen Sinn von γῆ klarer als das potenziell kosmisch verstandene „Erde“.
  naturalness: „Es ist wie mit einem Senfkorn“ ist im Deutschen weniger unmittelbar als „Es ist wie ein Senfkorn“. Ein Relativsatz ergibt zudem einen flüssigeren und genauer strukturierten Satz als ein nach dem Doppelpunkt selbständig anschließender Wenn-Satz.
  terminology: „Senfkorn“ ist die übliche, treffende Bezeichnung für κόκκος σινάπεως. Die Fußnote mit „Senfsamen“ ist als lexikalische Alternative angemessen. Keine theologische Terminologie ist betroffen.
