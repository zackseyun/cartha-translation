source:
  edition: SBLGNT
  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: de
  text: Es ist wie ein Senfkorn[a], das, wenn es auf den Boden gesät wird, kleiner ist als alle Samen auf dem Boden—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einem Senfsamen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Es ist wie mit
  rationale: Die Vergleichsformel ist im Griechischen elliptisch und knüpft an die Frage des vorhergehenden Verses an; die Ergänzung ergibt im Deutschen eine natürliche Einleitung des Gleichnisses.
- source_word: κόκκῳ σινάπεως
  choice: einem Senfkorn
  rationale: κόκκος bezeichnet ein Korn beziehungsweise einen Samen; „Senfkorn“ ist die geläufige und idiomatische deutsche Bezeichnung.
- source_word: ὅταν σπαρῇ
  choice: wenn es … gesät wird
  rationale: ὅταν mit Aorist Konjunktiv hat hier allgemeinen zeitlichen Sinn; das deutsche „wenn“ gibt diesen im Gleichnis natürlich wieder.
- source_word: ἐπὶ τῆς γῆς
  choice: auf die Erde
  rationale: Die Wendung bezeichnet im landwirtschaftlichen Bild den Erdboden. „Auf die Erde“ bewahrt bei σπαρῇ die räumliche Perspektive von ἐπί, ohne γῆ kosmisch als Welt zu verstehen.
- source_word: μικρότερον ὂν
  choice: ist es kleiner
  rationale: Die partizipiale Konstruktion wird für klares, natürliches Deutsch als finiter Satz wiedergegeben; der Komparativ „kleiner“ bleibt erhalten.
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: als alle Samen auf der Erde
  rationale: Der Vergleich mit dem Genitiv wird direkt wiedergegeben; die wiederholte Ortsangabe bleibt entsprechend dem griechischen Text erhalten.
theological_decisions:
- issue: Komparativ oder Superlativ bei der Größe des Senfkorns
  choice: kleiner als alle Samen
  alternative: der kleinste von allen Samen
  rationale: Der griechische Text hat ausdrücklich den Komparativ μικρότερον. Die Übersetzung bewahrt diese Form und glättet sie nicht zum traditionellen Superlativ.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der Gedankenstrich am Ende bleibt stehen, weil der Satz in Vers 32 weitergeführt wird.
