  text: Ἀκούετε. ἰδοὺ ἐξῆλθεν ὁ ⸀σπείρων σπεῖραι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/003.yaml
  text: Listen! Behold[a], the sower went out to sow.
translation:
  language: de
  text: Hört zu! Seht! Der Sämann ging hinaus, um zu säen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούετε
  choice: Hört zu!
  rationale: Der Präsensimperativ in der zweiten Person Plural fordert die Zuhörenden nachdrücklich zur Aufmerksamkeit auf. „Hört zu!“ ist im modernen Deutsch natürlich und bewahrt diese Funktion.
- source_word: ἰδού
  choice: Seht!
  rationale: Die Aufmerksamkeitspartikel hebt das Folgende hervor. „Seht!“ gibt ihren markierten, hinweisenden Charakter würdig und verständlich wieder.
- source_word: ἐξῆλθεν
  choice: ging hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier eine nach außen gerichtete Bewegung; „ging hinaus“ ist kontextgerecht und idiomatisch.
- source_word: ὁ σπείρων
  choice: der Sämann
  rationale: Das substantivierte Partizip bezeichnet die handelnde Person nach ihrer Tätigkeit. „Der Sämann“ ist die natürliche deutsche Rollenbezeichnung.
- source_word: σπεῖραι
  choice: um zu säen
  rationale: Der Aoristinfinitiv drückt nach dem Bewegungsverb den Zweck aus; die deutsche Konstruktion „um zu säen“ macht diese Beziehung eindeutig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die beiden Aufmerksamkeitssignale des griechischen Textes bleiben als getrennte Aufforderungen erhalten.
