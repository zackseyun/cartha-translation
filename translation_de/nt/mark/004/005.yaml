  text: ⸂καὶ ἄλλο⸃ ἔπεσεν ἐπὶ τὸ πετρῶδες ⸀ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ ⸀εὐθὺς ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: de
  text: Anderes Saatgut fiel auf felsigen Boden[a], wo nur wenig Erde war; und es ging sofort auf, weil die Erdschicht nicht tief war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „steinigen Boden“. Gemeint ist felsiger Untergrund, über dem nur eine dünne Erdschicht liegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: Anderes Saatgut
  rationale: Das substantivierte Neutrum verweist im Zusammenhang elliptisch auf das zuvor erwähnte Saatgut. Die Ergänzung macht den Bezug im Deutschen klar.
- source_word: πετρῶδες
  choice: felsigen Boden
  rationale: Das Wort bezeichnet felsigen Untergrund mit nur dünner Erdschicht, nicht lediglich einen Boden mit einzelnen Steinen.
- source_word: γῆν πολλήν
  choice: nicht viel Erde
  rationale: γῆ bezeichnet hier die für das Wachstum verfügbare Erd- bzw. Bodenschicht. „Erde“ ist in diesem landwirtschaftlichen Bild natürlich und konkret.
- source_word: εὐθύς
  choice: sofort
  rationale: Bewahrt die Aussage des unverzüglichen Aufgehens in gegenwärtigem, allgemein verständlichem Deutsch.
- source_word: ἐξανέτειλεν
  choice: ging ... auf
  rationale: Die übliche deutsche Wendung für das Keimen und Hervorkommen von Saatgut gibt den landwirtschaftlichen Sinn präzise wieder.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: weil die Erde nicht tief war
  rationale: Die Konstruktion bezeichnet den Grund. Die finite deutsche Formulierung ist natürlich und bewahrt das Bild einer dünnen Erdschicht.
- source_word: ὅπου
  choice: wo
  rationale: Direkte und idiomatische Wiedergabe des lokalen Relativadverbs.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Saatgut“ verdeutlicht die im Griechischen ausgelassene, aus dem Kontext erschließbare Bezugsgröße; „ging ... auf“ entspricht dem natürlichen deutschen Sprachgebrauch für keimende Saat.
