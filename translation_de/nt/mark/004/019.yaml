source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: de
  text: und die Sorgen des Zeitalters[a], der trügerische Reichtum und die Begierden nach anderen Dingen dringen ein und ersticken das Wort, und es wird unfruchtbar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sorgen der Welt“. Das griechische Wort kann „Zeitalter“ und erweitert auch die gegenwärtige Weltordnung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und es wird unfruchtbar“. Der nächste grammatische Bezugspunkt ist „das Wort“; sinngemäß kann auch daran gedacht sein, dass der Hörer oder die Saat keine Frucht bringt.'
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: Sorgen
  rationale: „Sorgen“ gibt sowohl belastende Lebensangelegenheiten als auch innere Besorgnis wieder, ohne den Ausdruck unnötig auf psychische Angst zu verengen.
- source_word: αἰῶνος
  choice: dieses Zeitalters
  rationale: αἰών bezeichnet grundlegend ein Zeitalter und kann darüber hinaus die gegenwärtige Weltordnung meinen. „Dieses Zeitalter“ bewahrt die zeitliche Nuance des griechischen Ausdrucks.
- source_word: ἀπάτη τοῦ πλούτου
  choice: der trügerische Reichtum
  rationale: Die adjektivische Wiedergabe ist im Deutschen natürlicher als „die Täuschung des Reichtums“ und bringt dennoch zum Ausdruck, dass Reichtum irreführt.
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: die Begierden nach anderen Dingen
  rationale: „Begierden“ bewahrt die Stärke von ἐπιθυμίαι; „nach anderen Dingen“ gibt die breite, nicht näher eingegrenzte Bedeutung von τὰ λοιπά verständlich wieder.
- source_word: εἰσπορευόμεναι
  choice: dringen ein
  rationale: Das Partizip wird als finites Verb wiedergegeben. So wird im Deutschen klar, dass die genannten Einflüsse eindringen; zugleich bleibt das anschauliche Geschehen erhalten.
- source_word: συμπνίγουσιν
  choice: ersticken
  rationale: „Ersticken“ wahrt das kräftige Bild des Verbs und passt zur Saatmetaphorik des Gleichnisses.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Das Wort“ bewahrt den biblischen Sprachgebrauch und bezeichnet hier die verkündete Botschaft.
- source_word: ἄκαρπος γίνεται
  choice: es wird unfruchtbar
  rationale: Die Formulierung folgt dem griechischen Ergebniszustand eng und lässt das Wort als nächsten grammatischen Bezugspunkt bestehen.
theological_decisions:
- issue: Bezug des abschließenden Singulars ἄκαρπος γίνεται
  choice: Das Pronomen „es“ bezieht sich im Haupttext auf „das Wort“.
  alternative: Gemeint sein könnte der Hörer oder innerhalb des Bildes die Saat beziehungsweise die daraus wachsende Pflanze.
  rationale: Der nächste ausdrücklich genannte Singular ist τὸν λόγον („das Wort“). Zugleich lässt die Bildsprache weitere gedankliche Bezugsmöglichkeiten zu; diese werden in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die wiederholte Reihung des Griechischen bleibt erkennbar, wird aber durch ein gemeinsames finites Prädikat natürlich ins Deutsche übertragen. „Zeitalter“ ist bewusst etwas markanter als „Welt“, um die zeitliche Nuance des Ausgangstextes zu erhalten.
