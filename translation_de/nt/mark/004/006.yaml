  text: ⸂καὶ ὅτε ἀνέτειλεν ὁ ἥλιος⸃ ⸀ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/006.yaml
  text: And when the sun rose[a], it was scorched, and because it had no root, it withered.
translation:
  language: de
  text: Und als die Sonne aufging, wurde es versengt; und weil es keine Wurzel hatte, verdorrte es[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „trocknete es aus“. Das griechische Verb kann sowohl das Trockenwerden als auch das Verdorren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: Und als die Sonne aufging
  rationale: Gibt den einfachen Anschluss καί und den durch ὅτε eingeleiteten Zeitpunkt natürlich wieder; ἀνατέλλω bezeichnet bei der Sonne ihr Aufgehen.
- source_word: ἐκαυματίσθη
  choice: wurde es versengt
  rationale: Das Passiv bezeichnet eine Schädigung durch starke Hitze. „Versengt“ bewahrt das landwirtschaftliche Bild, ohne eine vollständige Verbrennung zu behaupten.
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: weil es keine Wurzel hatte
  rationale: διά mit substantiviertem Infinitiv drückt hier den Grund aus. Der Singular „Wurzel“ entspricht dem griechischen Text und ist im Deutschen idiomatisch.
- source_word: ἐξηράνθη
  choice: verdorrte es
  rationale: Das Verb kann das Trockenwerden oder Verwelken einer Pflanze bezeichnen. „Verdorren“ verbindet beides in natürlichem, präzisem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das wiederholte „es“ lässt das im Zusammenhang genannte Saatkorn beziehungsweise Gewächs als Bezug offen. Das Semikolon macht den Folgezusammenhang lesbar, ohne eine zusätzliche Deutung einzuführen.
