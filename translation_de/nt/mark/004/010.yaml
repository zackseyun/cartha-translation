source:
  edition: SBLGNT
  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: de
  text: Und als er für sich war,[a] fragten ihn diejenigen, die um ihn waren, zusammen mit den Zwölf nach den Gleichnissen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als er abseits war“. Die Wendung bezeichnet eine Situation außerhalb der Öffentlichkeit und bedeutet nicht zwingend, dass Jesus völlig allein war.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Als … dann
  rationale: Gibt sowohl den zeitlichen Anschluss durch ὅτε als auch den markinischen Erzählfortgang durch καί in natürlichem Deutsch wieder.
- source_word: ἐγένετο κατὰ μόνας
  choice: er für sich war
  rationale: Die Wendung bezeichnet, dass Jesus sich nicht mehr vor der öffentlichen Menge, sondern im privaten Kreis befand. „Für sich“ bewahrt diesen Sinn, ohne völlige Abwesenheit anderer zu behaupten.
- source_word: ἠρώτων
  choice: fragten
  rationale: Das deutsche Präteritum ist im Erzählstil natürlich; der imperfektive Aspekt des griechischen Imperfekts lässt sich hier nicht ohne stärkere Deutung elegant ausdrücken.
- source_word: οἱ περὶ αὐτὸν
  choice: die Menschen in seinem Umfeld
  rationale: Bezeichnet den weiteren Kreis um Jesus und vermeidet eine Beschränkung auf räumlich unmittelbar Umstehende oder allein die Zwölf.
- source_word: σὺν τοῖς δώδεκα
  choice: zusammen mit den Zwölf
  rationale: Bewahrt die Begleitung und zugleich die syntaktische Unterscheidung zwischen dem weiteren Umfeld Jesu und den Zwölf.
- source_word: τὰς παραβολάς
  choice: nach den Gleichnissen
  rationale: Gibt den gut bezeugten Plural wieder und verwendet mit „nach etwas fragen“ eine natürliche deutsche Konstruktion.
theological_decisions:
- issue: Identität der Fragenden
  choice: Ein weiterer Kreis um Jesus fragte ihn zusammen mit den Zwölf.
  alternative: Nur die Zwölf fragten ihn; oder ein enger Kreis, der von den Zwölf getrennt war.
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα unterscheidet am natürlichsten die Menschen um Jesus von den Zwölf, verbindet beide Gruppen jedoch als Fragende.
- issue: Bedeutung von κατὰ μόνας
  choice: Jesus befand sich außerhalb der Öffentlichkeit in einem privaten Kreis.
  alternative: Jesus war völlig allein.
  rationale: Da unmittelbar darauf Menschen aus seinem Umfeld samt den Zwölf bei ihm sind, darf „allein“ nicht so verstanden werden, als sei niemand bei ihm gewesen. Die Übersetzung erhält die Spannung, ohne einen Widerspruch zu erzeugen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Die Menschen in seinem Umfeld“ ist etwas ausführlicher als das Griechische, macht aber den weiteren Jüngerkreis verständlich und grenzt ihn nicht auf die Zwölf ein.
