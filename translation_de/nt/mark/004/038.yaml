  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: de
  text: 'Er selbst aber war hinten im Boot und schlief auf dem Kissen. Da weckten sie ihn und sagten zu ihm: »Lehrer, kümmert es dich nicht, dass wir untergehen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: Er selbst aber war
  rationale: Das ausdrücklich gesetzte αὐτός trägt eine hervorhebende beziehungsweise kontrastierende Kraft. »Er selbst« bewahrt diese; »aber« gibt den Zusammenhangskontrast idiomatisch wieder.
- source_word: ἐν τῇ πρύμνῃ
  choice: hinten im Boot
  rationale: πρύμνα bezeichnet das Heck. »Hinten im Boot« ist im modernen Deutsch unmittelbar verständlich und vermeidet den fachsprachlicheren Ausdruck »im Heck«.
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: auf dem Kissen
  rationale: προσκεφάλαιον bezeichnet eine Unterlage für den Kopf, also ein Kissen beziehungsweise Kopfkissen. »Auf dem Kissen« bleibt knapp und legt weder Material noch genaue Verwendung zusätzlich fest.
- source_word: καθεύδων
  choice: schlief
  rationale: Das Partizip beschreibt den gleichzeitig andauernden Zustand Jesu. Im Deutschen verbindet ein finites Verb den Satz natürlicher, ohne den zeitlichen Sinn zu verändern.
- source_word: ἐγείρουσιν
  choice: weckten
  rationale: Das historische Präsens wird im gewöhnlichen deutschen Erzählstil als Präteritum wiedergegeben. »Weckten« trifft hier die konkrete Bedeutung.
- source_word: λέγουσιν
  choice: sagten
  rationale: Auch dieses historische Präsens wird dem deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Διδάσκαλε
  choice: Lehrer
  rationale: διδάσκαλος bedeutet direkt »Lehrer«. »Meister« wäre traditionell möglich, aber lexikalisch weniger genau und könnte eine zusätzliche Rangnuance eintragen.
- source_word: οὐ μέλει σοι
  choice: kümmert es dich nicht
  rationale: Die Wendung fragt zugespitzt nach Anteilnahme oder Sorge. Diese Formulierung bewahrt den vorwurfsvollen Ton und klingt im Deutschen natürlich.
- source_word: ἀπολλύμεθα
  choice: wir untergehen
  rationale: Im Zusammenhang des Sturms bezeichnet das Verb unmittelbar drohenden Tod beziehungsweise Verderben. »Untergehen« ist zugleich nautisch passend und bewahrt die Dringlichkeit.
theological_decisions:
- issue: Vorwurfsvoller Charakter der Frage der Jünger
  choice: »Kümmert es dich nicht, dass wir untergehen?«
  alternative: »Ist es dir gleichgültig, dass wir umkommen?«
  rationale: Die gewählte Fassung erhält die scharfe, angstvolle Anklage, ohne Jesu Haltung zu deuten oder die Spannung zwischen seiner Ruhe und der Not der Jünger aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Hinten im Boot« wurde gegenüber dem präziseren, aber etwas fachsprachlichen »im Heck« bevorzugt. Eine Fußnote ist nicht nötig, da »Kissen« die lexikalische Spannweite von προσκεφάλαιον im Deutschen angemessen abdeckt.
