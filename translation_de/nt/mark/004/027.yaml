  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: de
  text: und er schläft und steht auf, Nacht und Tag, und die Saat geht auf und wächst[a], ohne dass er selbst weiß, wie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schießt empor“. Das zweite Verb bezeichnet genauer ein Länger- oder Höherwerden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „wie er selbst nicht weiß“. Gemeint ist, dass er selbst nicht weiß, wie es geschieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ
  choice: er schläft
  rationale: Das Präsens im Konjunktiv beschreibt innerhalb des Gleichnisses einen wiederkehrenden Vorgang; das deutsche Präsens gibt dies natürlich wieder.
- source_word: ἐγείρηται
  choice: steht auf
  rationale: Die medial-passive Form wird hier intransitiv im Sinn von Aufstehen beziehungsweise Erwachen gebraucht. „Steht auf“ vermeidet einen unbeabsichtigten Anklang an Auferweckung.
- source_word: νύκτα καὶ ἡμέραν
  choice: Nacht und Tag
  rationale: Die adverbial gebrauchten Akkusative bezeichnen den fortlaufenden Wechsel der Zeit; die knappe deutsche Wendung bewahrt Reihenfolge und Rhythmus des Griechischen.
- source_word: ὁ σπόρος
  choice: die Saat
  rationale: Der bestimmte Ausdruck verweist auf das zuvor ausgesäte Saatgut. „Die Saat“ ist im Deutschen natürlich und hält den Bezug zum Säen deutlich fest.
- source_word: βλαστᾷ
  choice: geht auf
  rationale: Beim Saatgut bezeichnet das Verb das Hervorsprießen beziehungsweise Keimen. „Geht auf“ ist dafür eine klare, geläufige deutsche Wendung.
- source_word: μηκύνηται
  choice: wächst
  rationale: Das Verb bezeichnet genauer ein Länger- oder Höherwerden. Im Zusammenhang mit aufgehender Saat ist „wächst“ die natürlichste Haupttextfassung; die spezifischere Nuance wird in einer Fußnote bewahrt.
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: ohne dass er selbst weiß, wie
  rationale: Die idiomatische deutsche Formulierung gibt wieder, dass dem Mann die Art und Weise des Wachstums unbekannt ist. „Selbst“ spiegelt das betonte αὐτός.
theological_decisions:
- issue: Urheberschaft des Wachstums der Saat im Gleichnis
  choice: Der Vorgang des Wachstums bleibt aus der Sicht des säenden Menschen unerklärt; eine handelnde Ursache wird nicht ausdrücklich benannt.
  alternative: Das Wachstum ausdrücklich als Gottes Wirken oder lediglich als natürlichen Vorgang bezeichnen.
  rationale: Der Vers hebt hervor, dass der Mensch nicht weiß, wie das Wachstum geschieht. Die Übersetzung bewahrt diese Spannung, ohne eine theologische Erklärung in den Text einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählrhythmus. Die wiederholten Verbindungen mit „und“ und die Reihenfolge „Nacht und Tag“ bewahren die Struktur des griechischen Textes; idiomatisch unverständliche Wörtlichkeit wird nur dort geglättet, wo das Deutsche sie verlangt.
