source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Achtet darauf, was ihr hört. Mit dem Maß, mit dem ihr messt, wird euch zugemessen werden, und es wird euch hinzugefügt werden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das griechische Imperfekt beschreibt die Rede im fortlaufenden Erzählgeschehen. Im natürlichen modernen Deutsch wird dies hier am besten mit dem Präteritum wiedergegeben; „sagte immer wieder“ würde eine Wiederholung stärker behaupten, als der Kontext verlangt.
- source_word: Βλέπετε
  choice: Achtet darauf
  rationale: Das Verb hat hier die übertragene Bedeutung einer eindringlichen Aufforderung zur Aufmerksamkeit, nicht die wörtliche Bedeutung „sehen“.
- source_word: τί ἀκούετε
  choice: was ihr hört
  rationale: τί ist ein direktes Fragepronomen und bezeichnet den Inhalt des Hörens. Die Formulierung bewahrt den Unterschied zu Lukas 8,18 („wie ihr hört“) und vermeidet eine Harmonisierung.
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: Mit dem Maß, mit dem ihr messt
  rationale: Die Formulierung erhält das Bild des Messens und gibt die instrumentale Wendung idiomatisch und zugleich eng am griechischen Wortlaut wieder.
- source_word: μετρηθήσεται ὑμῖν
  choice: wird euch zugemessen werden
  rationale: Das Passiv und der Gedanke einer entsprechenden Zumessung bleiben erhalten. „Zurück“ wird nicht ergänzt, da es im griechischen Text nicht ausdrücklich steht.
- source_word: προστεθήσεται ὑμῖν
  choice: euch wird noch hinzugefügt werden
  rationale: „Hinzufügen“ entspricht dem Verb προστεθήσεται. „Noch“ macht im Deutschen die additive Bedeutung natürlich verständlich, ohne festzulegen, was genau hinzugefügt wird.
theological_decisions:
- issue: Deutung des wechselseitigen Zumessens
  choice: Das Bild bleibt allgemein formuliert und wird im Zusammenhang mit dem aufmerksamen Hören wiedergegeben.
  alternative: Die Aussage ausdrücklich auf Gericht, Großzügigkeit oder zunehmendes geistliches Verständnis zu beziehen.
  rationale: Der unmittelbare Kontext handelt vom Hören auf Jesu Botschaft, doch der Satz benennt die genaue Art des Zugemessenen und Hinzugefügten nicht. Die Übersetzung bewahrt diese Offenheit und die theologische Spannung.
- issue: Unausgesprochener Gegenstand von προστεθήσεται
  choice: Der Gegenstand dessen, was hinzugefügt wird, bleibt unausgesprochen.
  alternative: „Mehr Verständnis“, „mehr Erkenntnis“ oder „mehr wird euch gegeben“ einzusetzen.
  rationale: Der griechische Text nennt keinen Gegenstand. Eine ausdrückliche Ergänzung würde eine plausible Kontextdeutung in den Haupttext aufnehmen und die Mehrdeutigkeit verringern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Maß“ und „messen“ bewahrt das prägnante Bild des Ausgangstextes. Der letzte Satzteil bleibt bewusst knapp und offen, auch wenn er im Deutschen leicht ungewöhnlich klingt.
