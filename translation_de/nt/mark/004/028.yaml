source:
  edition: SBLGNT
  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: de
  text: 'Die Erde bringt von selbst Frucht hervor: zuerst den Halm, dann die Ähre, dann volles Korn in der Ähre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: von selbst
  rationale: Das Adjektiv bezieht sich auf ἡ γῆ und bezeichnet ein Hervorbringen ohne sichtbares menschliches Zutun. „Von selbst“ ist im modernen Deutsch natürlich und vermeidet den mechanischen Klang von „automatisch“.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: Im Gleichnis ist der bestellte Erdboden gemeint. „Die Erde“ ist idiomatisch, würdevoll und bildet zusammen mit „bringt … hervor“ die eigenständige Tätigkeit des Bodens klar ab.
- source_word: καρποφορεῖ
  choice: bringt … Frucht hervor
  rationale: Die Wendung bewahrt das landwirtschaftliche Bild und den weiteren biblischen Bedeutungsraum von „Frucht“, während sie im Deutschen natürlich klingt.
- source_word: πρῶτον χόρτον
  choice: zuerst den Halm
  rationale: χόρτος bezeichnet hier das erste sichtbare Grün der Getreidepflanze. „Halm“ passt verständlich in die Wachstumsfolge, ohne das allgemeinere „Gras“ nahezulegen.
- source_word: εἶτα στάχυν
  choice: dann die Ähre
  rationale: στάχυς bezeichnet die Ähre beziehungsweise den Fruchtstand des Getreides. „Ähre“ ist der präzise und allgemein verständliche deutsche Ausdruck.
- source_word: πλήρης σῖτον
  choice: das volle Korn
  rationale: Die textkritisch schwierige Formulierung wird entsprechend dem griechischen Wortlaut knapp wiedergegeben. „Voll“ bewahrt πλήρης, ohne die zusätzliche Deutung „reif“ einzutragen; „Korn“ gibt σῖτος im Kontext natürlich wieder.
- source_word: ἐν τῷ στάχυϊ
  choice: in der Ähre
  rationale: Die Ortsangabe wird wörtlich und mit derselben Bezeichnung für στάχυς wie zuvor wiedergegeben.
theological_decisions: []
