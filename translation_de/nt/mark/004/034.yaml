  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: de
  text: Ohne ein Gleichnis sprach er nicht zu ihnen; wenn er aber mit seinen eigenen Jüngern[a] allein war, erklärte er ihnen alles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich mit besonderer Betonung der Zugehörigkeit: „seinen eigenen Jüngern“.'
    reason: lexical_emphasis
  - marker: b
    text: 'Oder: „legte er alles aus“ beziehungsweise „deutete er alles“. Das griechische Verb kann „erklären“, „auslegen“ oder „deuten“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς παραβολῆς
  choice: ohne ein Gleichnis
  rationale: Die konkrete singularische Formulierung des Griechischen bleibt erhalten und klingt im Deutschen natürlich.
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: sprach er nicht zu ihnen
  rationale: Das Imperfekt beschreibt in dieser zusammenfassenden Aussage ein wiederholtes beziehungsweise charakteristisches Sprechen. Das deutsche Präteritum fügt sich natürlich in den Erzählstil ein.
- source_word: κατ’ ἰδίαν
  choice: im privaten Kreis
  rationale: Die Wendung bezeichnet den nicht öffentlichen Rahmen. Diese Wiedergabe vermeidet das bei mehreren Personen missverständliche „unter vier Augen“.
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: seinen eigenen Jüngern
  rationale: „eigenen“ bewahrt die im griechischen Adjektiv ἰδίοις liegende Hervorhebung der Zugehörigkeit.
- source_word: ἐπέλυεν
  choice: erklärte
  rationale: Das Verb kann hier erklären, auslegen oder deuten bedeuten. „erklärte“ ist im heutigen Deutsch klar und zugänglich.
- source_word: πάντα
  choice: alles
  rationale: Die umfassende, im Griechischen nicht näher eingegrenzte Aussage wird nicht auf Gleichnisse oder bestimmte Lehrinhalte beschränkt.
theological_decisions:
- issue: Umfang dessen, was Jesus im privaten Kreis erklärte
  choice: „alles“ ohne nähere Einschränkung
  alternative: „alle Gleichnisse“ oder „alles, was er gesagt hatte“
  rationale: Der unmittelbare Zusammenhang legt Jesu Lehre beziehungsweise die Gleichnisse nahe, doch πάντα selbst bedeutet schlicht „alles“. Die Übersetzung soll den Umfang nicht enger bestimmen als der griechische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wahrt den Gegensatz zwischen dem öffentlichen Reden in Gleichnissen und der privaten Erklärung, ohne den knappen griechischen Text unnötig auszubauen.
