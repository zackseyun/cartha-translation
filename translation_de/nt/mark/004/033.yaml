revisions:
- from: Und mit vielen solchen Gleichnissen verkündete er ihnen das Wort[a], soweit sie es hören konnten.[b]
  to: Und mit vielen solchen Gleichnissen redete er das Wort zu ihnen, soweit sie es hören konnten.[a]
  rationale: Die Übersetzung ersetzt das interpretativ stärkere „verkündete“ durch „redete ... das Wort zu ihnen“, das die Verbindung von ἐλάλει mit τὸν λόγον enger abbildet. Da beide bisherigen Fußnoten unmittelbar denselben Satzteil beziehungsweise die abschließende Maßangabe erläutern, werden sie unter einem regelkonformen Anker zusammengeführt, ohne Bedeutungsgehalt zu verlieren.
