source:
  edition: SBLGNT
  text: Καὶ τοιαύταις παραβολαῖς πολλαῖς ἐλάλει αὐτοῖς τὸν λόγον, καθὼς ἠδύναντο ἀκούειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: de
  text: Und mit vielen solchen Gleichnissen redete er das Wort zu ihnen, soweit sie es hören konnten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Botschaft“ oder „die Lehre“. Auch: „so, wie sie es hören konnten“ oder „in dem Maß, wie sie es hören konnten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: solchen
  rationale: Das Demonstrativadjektiv verweist auf Gleichnisse der zuvor gegebenen Art; „solchen“ bewahrt diesen Rückbezug knapp und natürlich.
- source_word: παραβολαῖς
  choice: Gleichnissen
  rationale: „Gleichnis“ ist die etablierte und kontextuell genaue Bezeichnung für diese bildhaften Lehrreden Jesu.
- source_word: πολλαῖς
  choice: vielen
  rationale: Direkte und idiomatische Wiedergabe der Mengenangabe.
- source_word: ἐλάλει
  choice: verkündete
  rationale: Das Imperfekt bezeichnet ein fortdauerndes bzw. wiederholtes Reden. „Verkündete“ gibt im Zusammenhang den kommunikativen Charakter der Rede natürlich wieder, ohne ihren Inhalt näher festzulegen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ bezeichnet die Adressaten der Rede.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: „Das Wort“ bewahrt den griechischen Ausdruck und seine Resonanz im Markusevangelium; die möglichen kontextuellen Bedeutungen „Botschaft“ und „Lehre“ werden in der Fußnote genannt.
- source_word: καθὼς
  choice: soweit
  rationale: Hier bezeichnet καθὼς wahrscheinlich das Maß bzw. den Grad, in dem die Zuhörer hören konnten; „soweit“ drückt diese Entsprechung im Deutschen prägnant aus.
- source_word: ἠδύναντο
  choice: sie … konnten
  rationale: Die Form bezeichnet ihre fortbestehende Fähigkeit; das deutsche Modalverb ist die natürliche Entsprechung.
- source_word: ἀκούειν
  choice: hören
  rationale: „Hören“ wahrt die lexikalische Grundbedeutung. Ein mögliches Mitschwingen von Verstehen oder Aufnehmen wird nicht interpretierend in den Haupttext eingebaut.
theological_decisions:
- issue: Bedeutung von τὸν λόγον im Lehr- und Verkündigungsdienst Jesu
  choice: „das Wort“ im Haupttext
  alternative: „die Botschaft“ oder „die Lehre“
  rationale: Die Wendung bezeichnet den Inhalt der Verkündigung Jesu. „Das Wort“ hält sich eng an den griechischen Ausdruck und bewahrt den markinischen Sprachgebrauch, ohne ihn auf eine bestimmte dogmatische Deutung zu verengen.
- issue: Bedeutungsumfang von ἀκούειν
  choice: „hören“
  alternative: „verstehen“ oder „aufnehmen“
  rationale: Der Text spricht ausdrücklich vom Hören. Obwohl im Kontext verstehendes oder aufnehmendes Hören mitschwingen kann, bleibt die Spannung erhalten, wenn die Übersetzung nicht über die lexikalische Aussage hinausgeht.
- issue: Maßangabe in καθὼς ἠδύναντο ἀκούειν
  choice: „soweit sie es hören konnten“
  alternative: „so, wie sie es hören konnten“ oder „in dem Maß, wie sie es hören konnten“
  rationale: „Soweit“ gibt die wahrscheinlich gemeinte Abstufung der Aufnahmefähigkeit knapp wieder, ohne festzulegen, ob physisches Hören, Verstehen oder empfängliches Aufnehmen im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Verkündete“ vermeidet die im heutigen Deutsch schwerfällige Formulierung „redete ihnen das Wort“, während „das Wort“ als bewusst bibelnaher Ausdruck erhalten bleibt. Die Satzstruktur ist klar und für ein allgemeines Publikum gut verständlich.
