id: MRK.4.1
reference: Mark 4:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: de
  text: Und wieder begann er, am See zu lehren. Da versammelte sich eine sehr große Menschenmenge bei ihm, sodass er in ein Boot stieg und sich auf dem See hinsetzte.[a] Die ganze Menschenmenge aber war am Seeufer an Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: Er saß in dem Boot auf dem Wasser, während die Menschenmenge auf dem Land blieb.'
    reason: Erläutert die räumlich knappe griechische Formulierung und verhindert das Missverständnis, Jesus habe hier unmittelbar auf dem Wasser gesessen.
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die Wiederholung von Jesu Lehrtätigkeit knapp und natürlich wieder.
- source_word: ἤρξατο διδάσκειν
  choice: begann er … zu lehren
  rationale: Bewahrt die ingressive Konstruktion mit ergänzendem Infinitiv in idiomatischem Deutsch.
- source_word: παρὰ τὴν θάλασσαν
  choice: am See
  rationale: παρά bezeichnet hier die Lage am Ufer. Im Deutschen ist „am See“ für den See Gennesaret natürlich; „Meer“ wäre zwar formnäher, aber geografisch und idiomatisch missverständlich.
- source_word: συνάγεται
  choice: Da versammelte sich
  rationale: Das griechische historische Präsens belebt die Erzählung; das deutsche Präteritum ist in fortlaufender Erzählprosa natürlicher. „Da“ markiert den narrativen Fortgang, ohne zusätzliche Kausalität einzutragen.
- source_word: ὄχλος πλεῖστος
  choice: eine sehr große Menschenmenge
  rationale: Bewahrt die verstärkende beziehungsweise superlativische Kraft von πλεῖστος und ist allgemein verständlich.
- source_word: πρὸς αὐτόν
  choice: bei ihm
  rationale: Im Zusammenhang des Sich-Versammelns drückt „bei ihm“ das Zusammenkommen an Jesu Standort natürlich aus; die gerichtete Bewegung bleibt durch „versammelte sich“ erkennbar.
- source_word: ὥστε
  choice: sodass
  rationale: Leitet wie im Griechischen die tatsächliche Folge der großen Menschenmenge ein.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: er in ein Boot stieg
  rationale: Löst das griechische Partizip in eine koordinierte deutsche Verbform auf und erhält die zeitliche Abfolge.
- source_word: καθῆσθαι
  choice: sich … hinsetzte
  rationale: Gibt im Deutschen deutlicher als bloßes „saß“ das Einnehmen der sitzenden Lehrposition als Folge wieder.
- source_word: ἐν τῇ θαλάσσῃ
  choice: auf dem See
  rationale: Bei einem Boot bezeichnet die Wendung die Lage auf dem Wasser; die Fußnote verhindert die wörtliche Fehlvorstellung, Jesus habe unmittelbar auf dem Wasser gesessen.
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menschenmenge
  rationale: Bewahrt den kollektiven Singular und den umfassenden Sinn von πᾶς.
- source_word: πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: am See auf dem Land
  rationale: Erhält die räumliche Gegenüberstellung zwischen Jesus im Boot auf dem Wasser und der Menge am Ufer auf festem Land.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Erzählsyntax. „See“ wird im Deutschen kontextgerecht für θάλασσα am See Gennesaret verwendet. Das historische Präsens συνάγεται wird zugunsten natürlicher deutscher Erzählprosa im Präteritum wiedergegeben; die lebendige Fortführung trägt „Da“.
