  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: de
  text: Sie haben keine Wurzel in sich, sondern halten nur eine Zeit lang durch. Wenn dann Bedrängnis oder Verfolgung wegen des Wortes entsteht, kommen sie sofort zu Fall.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fallen sie sofort ab«, »nehmen sie sofort Anstoß« oder »straucheln sie sofort«. Das griechische Verb kann Straucheln, Anstoßnehmen oder Abfallen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: Wurzel in sich
  rationale: Bewahrt das landwirtschaftliche Bild und den reflexiven Sinn, ohne die nicht ausdrücklich genannten Vorstellungen von Tiefe oder Festigkeit hinzuzufügen.
- source_word: πρόσκαιροί εἰσιν
  choice: halten nur eine Zeit lang durch
  rationale: Gibt die begrenzte Dauer im Zusammenhang natürlich wieder. Das bloße »sind vorübergehend« wäre im Deutschen auf Personen bezogen unidiomatisch.
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: wenn ... Bedrängnis oder Verfolgung ... entsteht
  rationale: Gibt den Genitivus absolutus temporal wieder. »Bedrängnis« erhält den Gedanken von Druck und Not; »Verfolgung« bezeichnet gezielte Anfeindung.
- source_word: διὰ τὸν λόγον
  choice: wegen des Wortes
  rationale: Bewahrt die wiederkehrende Terminologie des Gleichnisses und bezeichnet hier das verkündete Wort beziehungsweise die Botschaft.
- source_word: εὐθὺς
  choice: sofort
  rationale: Natürliches modernes Deutsch, das die für Markus charakteristische Unmittelbarkeit wahrt.
- source_word: σκανδαλίζονται
  choice: kommen zu Fall
  rationale: Bewahrt das Bild des Strauchelns und vermittelt im Kontext ein ernstes Scheitern, ohne die mögliche Bedeutung vorschnell auf einen präzisen dogmatischen Begriff des Abfalls festzulegen.
theological_decisions:
- issue: Bedeutung von σκανδαλίζονται im Zusammenhang von Nachfolge und Abkehr
  choice: kommen zu Fall
  alternative: fallen ab; nehmen Anstoß; straucheln
  rationale: 'Der Kontext beschreibt das Scheitern unter Bedrängnis oder Verfolgung. »Kommen zu Fall« lässt die Bildhaftigkeit und die theologische Spannung bestehen: Es ist stärker als bloßes Verärgertsein, legt aber nicht ausdrücklich eine abschließende Aussage über den Heilsstatus fest.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzfluss bleibt eng am griechischen Aufbau; idiomatische Anpassung bei πρόσκαιροί εἰσιν. Der Fußnotenmarker steht unmittelbar nach der mehrdeutigen Wendung.
