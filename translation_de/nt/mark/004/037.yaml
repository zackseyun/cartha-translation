- from: Da erhob sich ein heftiger Sturm[a], und die Wellen schlugen immer wieder in das Boot[b], sodass sich das Boot bereits mit Wasser füllte[c].
  to: Da erhob sich ein heftiger Windsturm[a], und die Wellen schlugen immer wieder ins Boot[b], sodass sich das Boot bereits mit Wasser füllte[c].
  rationale: Die Revision ergänzt im Haupttext »Wind-« als Entsprechung zu ἀνέμου und glättet die idiomatische Verbindung »ins Boot«. Die Aussage, dass Wasser das Boot füllte, bleibt eine im unmittelbaren Bildzusammenhang eindeutige Explizierung und verändert den Sinn nicht. Die Fußnoten bleiben an den betreffenden Ausdrücken verankert und bieten nachvollziehbare Alternativen.
