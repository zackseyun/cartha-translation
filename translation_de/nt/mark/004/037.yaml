  text: καὶ γίνεται λαῖλαψ ⸂μεγάλη ἀνέμου⸃, ⸂καὶ τὰ⸃ κύματα ἐπέβαλλεν εἰς τὸ πλοῖον, ὥστε ⸂ἤδη γεμίζεσθαι τὸ πλοῖον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: de
  text: Da erhob sich ein heftiger Windsturm[a], und die Wellen schlugen immer wieder ins Boot[b], sodass sich das Boot bereits mit Wasser füllte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „ein großer Windsturm“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Wellen schlugen fortwährend ins Boot“. Die griechische Verbform beschreibt einen andauernden oder wiederholten Vorgang.'
    reason: aspectual_alternative
  - marker: c
    text: 'Oder: „sodass das Boot bereits gefüllt wurde“.'
    reason: voice_alternative
lexical_decisions:
- source_word: γίνεται
  choice: Da erhob sich
  rationale: Das historische Präsens schildert das Einsetzen des Sturms lebhaft; „erhob sich“ ist im Deutschen eine natürliche Erzählform.
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: ein heftiger Sturm
  rationale: λαῖλαψ bezeichnet einen heftigen Sturm oder eine Bö; ἀνέμου kennzeichnet ihn als Windsturm. „Heftiger Sturm“ gibt die Stärke natürlich und ohne unnötige Doppelung wieder.
- source_word: τὰ κύματα
  choice: die Wellen
  rationale: Die gewöhnliche und kontextgerechte Wiedergabe von κύματα.
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: schlugen immer wieder in das Boot
  rationale: Das Imperfekt beschreibt einen fortlaufenden beziehungsweise wiederholten Vorgang. „Immer wieder“ macht sichtbar, dass eine Welle nach der anderen ins Boot schlug.
- source_word: τὸ πλοῖον
  choice: das Boot
  rationale: Für das Fahrzeug auf dem See Gennesaret ist „Boot“ im heutigen Deutsch sachlich und natürlich; „Schiff“ könnte ein größeres Fahrzeug nahelegen.
- source_word: ὥστε
  choice: sodass
  rationale: Die Konjunktion leitet die tatsächliche Folge des Wellenschlags ein.
- source_word: ἤδη
  choice: bereits
  rationale: Das Wort zeigt, dass der Füllvorgang schon eingesetzt hatte und fortgeschritten war.
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: sich das Boot mit Wasser füllte
  rationale: Die mediale/passive Form bezeichnet den fortschreitenden Füllvorgang. Die reflexive deutsche Form ist idiomatisch; „mit Wasser“ verdeutlicht den im Zusammenhang eindeutig gemeinten Inhalt.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Heftiger Sturm“ vermeidet das im Deutschen schwerfällige „großer Sturm von Wind“; die Fußnote bewahrt die formalere Struktur. Die wiederholte Wirkung des griechischen Imperfekts wird ausdrücklich wiedergegeben.
