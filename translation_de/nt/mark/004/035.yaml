  text: Καὶ λέγει αὐτοῖς ἐν ἐκείνῃ τῇ ἡμέρᾳ ὀψίας γενομένης· Διέλθωμεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/035.yaml
  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: de
  text: 'An jenem Tag, als es Abend wurde, sagt er zu ihnen: »Lasst uns ans andere Ufer hinüberfahren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens bewahrt Markus’ charakteristisches historisches Präsens und ist auch im Deutschen natürlich verständlich.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: dieses Tages
  rationale: In Verbindung mit »am Abend« gibt diese idiomatische Formulierung den zeitlichen Bezug prägnant wieder.
- source_word: ὀψίας γενομένης
  choice: Am Abend
  rationale: Der Genitivus absolutus bezeichnet den Zeitpunkt. Die knappe deutsche Wendung ist natürlich und bewahrt den zeitlichen Sinn.
- source_word: Διέλθωμεν
  choice: Lasst uns … hinüberfahren
  rationale: Der hortative Aorist-Konjunktiv wird als Aufforderung in der ersten Person Plural wiedergegeben. »Hinüberfahren« macht im unmittelbaren Kontext der Überfahrt über den See die gemeinte Fortbewegung natürlich deutlich.
- source_word: εἰς τὸ πέραν
  choice: ans andere Ufer
  rationale: Im Kontext bezeichnet τὸ πέραν die gegenüberliegende Seite des Sees; »ans andere Ufer« ist dafür eine klare und idiomatische deutsche Wiedergabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens bleibt erhalten; die Satzstellung wurde für einen natürlichen deutschen Erzählfluss angepasst.
