review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Begriffe des griechischen Textes zuverlässig wieder: das empfangene „Geheimnis“ des Reiches Gottes, den Kontrast zu „jenen, die draußen sind“, sowie die bewusst auffällige Aussage, dass alles „in Gleichnissen“ geschieht. „Geschieht“ bildet γίνεται angemessen dynamisch ab, ohne eine nicht im Text stehende Sprech- oder Zweckangabe einzutragen.'
  naturalness: Modernes, verständliches Standarddeutsch mit einem bewusst leicht ungewohnten, aber quellennahen Ausdruck in „geschieht alles in Gleichnissen“. „Für jene aber, die draußen sind“ ist grammatisch möglich und bewahrt die räumliche Metapher. Die abschließende Kommasetzung kann als verseinteilungsbedingte Fortführung in den folgenden Satz verstanden werden.
  terminology: „Geheimnis“, „Reich Gottes“ und „Gleichnisse“ sind etablierte und treffende Wiedergaben. Die Umschreibung „jene, die draußen sind“ vermeidet eine übermäßig festlegende Deutung von τοῖς ἔξω.
