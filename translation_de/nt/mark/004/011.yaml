id: MRK.4.11
reference: Mark 4:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Euch ist das Geheimnis des Reiches Gottes gegeben; für jene aber, die draußen sind, geschieht alles in Gleichnissen,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Bewahrt den Gedanken einer zuvor verborgenen und von Gott erschlossenen Wirklichkeit; „Mysterium“ wäre im modernen Deutsch unnötig fachsprachlich.
- source_word: βασιλείας τοῦ θεοῦ
  choice: Reich Gottes
  rationale: Die geläufige, zugleich sachlich weite Wiedergabe für Gottes Königsherrschaft und deren Wirkungsbereich.
- source_word: τοῖς ἔξω
  choice: jene, die draußen sind
  rationale: Gibt die räumliche Metapher des griechischen Textes wieder, ohne die bezeichnete Gruppe interpretierend festzulegen.
- source_word: ἐν παραβολαῖς
  choice: in Gleichnissen
  rationale: Entspricht der üblichen Bezeichnung für Jesu bildhafte Vergleichserzählungen und bewahrt die präpositionale Form.
- source_word: τὰ πάντα γίνεται
  choice: geschieht alles
  rationale: Gibt das dynamische γίνεται näher als ein bloßes „ist“ wieder und lässt die auffällige, im Kontext deutungsbedürftige Formulierung stehen.
theological_decisions:
- issue: Göttliche Gabe des Geheimnisses
  choice: „Euch ist das Geheimnis … gegeben“
  alternative: „Euch ist es gegeben, das Geheimnis … zu erkennen“
  rationale: Der griechische Text nennt keinen ausdrücklichen Infinitiv des Erkennens. Die knappe Passivform bewahrt sowohl die göttliche Initiative als auch die Offenheit dessen, was genau gegeben wurde.
- issue: Funktion der Gleichnisse für Außenstehende
  choice: „für jene aber, die draußen sind, geschieht alles in Gleichnissen“
  alternative: „den Außenstehenden wird alles nur in Gleichnissen dargeboten“
  rationale: Die Übersetzung fügt weder „nur“ noch eine ausdrückliche Aussage über Zweck oder Wirkung der Gleichnisse hinzu und bewahrt so die theologische Spannung des Kontextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der leicht ungewöhnliche Ausdruck „geschieht alles in Gleichnissen“ ist bewusst quellennah gewählt, da eine glattere Formulierung wie „wird alles in Gleichnissen gesagt“ dem Verb zusätzliche Sprechbedeutung geben würde.
