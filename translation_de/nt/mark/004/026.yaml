  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: de
  text: 'Und er sagte[a]: »Mit dem Reich Gottes ist es so, wie wenn ein Mensch den Samen auf die Erde streut.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Imperfekt kann auch andauerndes oder wiederholtes Sprechen ausdrücken: »Und er sagte immer wieder« oder »Und er pflegte zu sagen«.'
    reason: aspectual_ambiguity
  - marker: b
    text: 'Wörtlicher: »den Samen auf die Erde wirft«; gemeint ist das Ausstreuen bei der Aussaat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Das griechische Imperfekt stellt das Sprechen als andauernd oder wiederholt dar; im deutschen Erzählstil gibt »sagte« den Vorgang natürlich wieder, während eine Fußnote die aspektuelle Möglichkeit offenhält.
- source_word: Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: Mit dem Reich Gottes ist es so
  rationale: Diese im Deutschen geläufige Wendung gibt die einleitende Vergleichsformel wieder und lässt »Reich Gottes« sowohl als Herrschaft als auch als Herrschaftsbereich offen.
- source_word: ὡς
  choice: wie wenn
  rationale: »Wie wenn« führt den Vergleich idiomatisch ein und bewahrt seine Fortsetzung über diesen Vers hinaus.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: »Ein Mensch« entspricht dem repräsentativen ἄνθρωπος, ohne die Figur unnötig näher zu bestimmen; das grammatische Maskulinum bleibt in der deutschen Form erhalten.
- source_word: βάλῃ
  choice: streut
  rationale: Im landwirtschaftlichen Zusammenhang bezeichnet βάλλω das Ausbringen des Samens. »Streut« ist verständlich und bewahrt mehr von der konkreten Bewegung als das stärker fachsprachlich deutende »sät«.
- source_word: τὸν σπόρον
  choice: den Samen
  rationale: Die bestimmte Form des Griechischen wird beibehalten und kann hier zugleich generisch verstanden werden.
- source_word: ἐπὶ τῆς γῆς
  choice: auf die Erde
  rationale: γῆ bezeichnet in diesem Bild den Erdboden, nicht die Erde als Welt; »auf die Erde« gibt zugleich die Richtung des Ausstreuens natürlich wieder.
theological_decisions:
- issue: Die syntaktisch gedrängte und über den Vers hinausführende Vergleichsformel
  choice: »Mit dem Reich Gottes ist es so, wie wenn …«
  alternative: »Das Reich Gottes gleicht einem Menschen, der …«
  rationale: Die gewählte Fassung bewahrt die offene Vergleichsstruktur von Οὕτως … ὡς und glättet sie nicht zu einer Aussage, die das Reich Gottes unmittelbar mit dem Menschen gleichsetzt.
- issue: Bedeutungsumfang von βασιλεία τοῦ θεοῦ
  choice: »Reich Gottes«
  alternative: »Herrschaft Gottes«
  rationale: »Reich Gottes« ist die vertraute und kontextgerechte Wiedergabe, ohne festzulegen, ob vor allem Gottes Herrschaftsausübung oder ihr Wirkungsbereich gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die geläufige Formel »Mit dem Reich Gottes ist es so, wie wenn …« trägt die im Griechischen über Vers 26 hinaus offene Satzbewegung. »Streut« vermeidet das im Deutschen unnatürlich harte »wirft«, ohne das landwirtschaftliche Bild abstrakt zu paraphrasieren.
