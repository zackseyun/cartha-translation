source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: de
  text: Denn nichts ist verborgen, außer um offenbar zu werden, und nichts wurde verborgen, außer um ans Licht zu kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn nichts ist verborgen, außer dass es offenbar wird, und nichts wurde verborgen, außer dass es ans Licht kommt.“ Die griechischen ἵνα-Nebensätze können sowohl eine Absicht als auch ein Ergebnis ausdrücken.'
    reason: alternative_reading
lexical_decisions:
- source_word: κρυπτόν
  choice: verborgen
  rationale: Das Adjektiv bezeichnet etwas, das verborgen beziehungsweise nicht sichtbar ist. „Verborgen“ bewahrt den Grundsinn, ohne absichtliche Geheimhaltung vorauszusetzen.
- source_word: ἐὰν μὴ ἵνα
  choice: außer um … zu
  rationale: Die Wendung verbindet eine Ausnahme mit der durch ἵνα bezeichneten Ziel- oder Ergebnisrichtung. „Außer um … zu“ gibt die vorwiegend finale Nuance knapp und verständlich wieder.
- source_word: φανερωθῇ
  choice: offenbar zu werden
  rationale: Das Passiv von φανερόω bezeichnet das Sichtbar- oder Bekanntwerden. „Offenbar werden“ ist im Deutschen würdig und verständlich und bewahrt die passive beziehungsweise intransitive Ausdrucksweise.
- source_word: ἀπόκρυφον
  choice: verborgen
  rationale: Das Wort bezeichnet, was dem Blick entzogen oder verborgen ist. Die Wiederholung von „verborgen“ ist im Deutschen natürlicher als eine stärker absichtliche Formulierung wie „verheimlicht“ und bewahrt die enge Parallelität.
- source_word: ἐγένετο
  choice: ist … geworden
  rationale: γίνομαι bezeichnet hier den Eintritt in einen Zustand. „Ist verborgen geworden“ gibt diesen Zustandswechsel wieder, ohne einen handelnden Urheber hinzuzufügen.
- source_word: ἔλθῃ εἰς φανερόν
  choice: ans Licht zu kommen
  rationale: Die feste deutsche Wendung ist natürlich und bewahrt sowohl die Bewegungsmetapher von ἔρχομαι als auch den Gegensatz zum Verborgenen.
- source_word: γάρ
  choice: Denn
  rationale: „Denn“ kennzeichnet den Vers als Begründung beziehungsweise Erläuterung des vorausgehenden Ausspruchs.
theological_decisions:
- issue: Zweck- oder Ergebnisnuance der beiden ἵνα-Sätze
  choice: Die Sätze werden mit „außer um … zu“ vorwiegend final wiedergegeben.
  alternative: „Außer dass es offenbar wird … außer dass es ans Licht kommt“ mit stärkerer Ergebnisnuance.
  rationale: ἵνα hat gewöhnlich finale Kraft, kann im Koine-Griechischen jedoch in Richtung eines Ergebnisses weisen. Die Übersetzung erhält die Zielrichtung, während die Fußnote die echte grammatische Mehrdeutigkeit offenlegt und keine ausdrückliche Aussage über göttliche Verursachung hinzufügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der Gegensatz zwischen Verborgenheit und Offenbarwerden bleiben erhalten; die etwas markierte Formulierung „ist verborgen geworden“ spiegelt bewusst ἐγένετο, ohne einen Handelnden zu ergänzen.
