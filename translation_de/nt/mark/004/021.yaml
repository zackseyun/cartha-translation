  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Kommt etwa eine Lampe, damit man sie unter ein Messgefäß[a] oder unter ein Bett stellt? Kommt sie nicht vielmehr, damit man sie auf den Lampenständer stellt?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ein Gefäß zum Abmessen trockener Waren; traditionell wird hier auch „Scheffel“ übersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Der griechische Imperfekt kann fortlaufendes oder wiederholtes Reden anzeigen; im natürlichen deutschen Erzählstil genügt hier das Präteritum „sagte“, ohne den Zusammenhang auf einen einmaligen Sprechakt festzulegen.
- source_word: Μήτι
  choice: Kommt etwa ...?
  rationale: „Etwa“ kennzeichnet eine rhetorische Frage, auf die eine verneinende Antwort erwartet wird, und klingt im modernen Deutsch natürlich.
- source_word: ἔρχεται ὁ λύχνος
  choice: Kommt etwa eine Lampe
  rationale: Die aktive, personifizierende Ausdrucksweise des Griechischen bleibt bewusst erhalten; der unbestimmte Artikel gibt die sprichwörtlich-allgemeine Aussage im Deutschen natürlich wieder.
- source_word: λύχνος
  choice: Lampe
  rationale: Gemeint ist die konkrete tragbare Öllampe, nicht abstrakt das Licht.
- source_word: μόδιον
  choice: Hohlmaß
  rationale: Der μόδιος war ein Gefäß beziehungsweise Maß für trockene Waren. „Hohlmaß“ wahrt den kulturellen Sachbezug genauer als das allgemeinere „Korb“; eine Fußnote erläutert das ungewohnte Wort.
- source_word: κλίνην
  choice: Bett
  rationale: „Bett“ ist in diesem häuslichen Bild die klare und allgemein verständliche Wiedergabe; „Liege“ wäre ebenfalls möglich.
- source_word: λυχνίαν
  choice: Lampenständer
  rationale: Das Wort bezeichnet eigens einen Ständer für eine Lampe und wird daher konkret wiedergegeben.
- source_word: τεθῇ
  choice: man sie ... stellt / sie ... kommt
  rationale: Beim ersten Vorkommen gibt „man sie stellt“ das Passiv idiomatisch wieder. Im zweiten Fragesatz ermöglicht „kommt sie ... auf“ die natürliche Fortführung der personifizierenden Bildsprache, wobei der Zweck des Aufstellens aus dem Gegensatz deutlich bleibt.
- source_word: ἵνα ... τεθῇ
  choice: damit man sie ... stellt
  rationale: „Damit“ erhält den Zweckcharakter der ἵνα-Konstruktion ausdrücklich.
theological_decisions:
- issue: Personifizierung der Lampe
  choice: Die aktive Wendung „Kommt etwa eine Lampe“ bleibt erhalten.
  alternative: „Bringt man etwa eine Lampe ...?“
  rationale: Das griechische Bild ist auffällig und lebendig. Eine passive oder unpersönliche Glättung wäre zwar idiomatischer, würde aber diesen Zug des Ausspruchs abschwächen.
- issue: Generische oder bestimmte Referenz von ὁ λύχνος
  choice: „eine Lampe“ als generische Aussage
  alternative: „die Lampe“
  rationale: Obwohl im Griechischen der Artikel steht, bezeichnet die sprichwörtliche Frage eine Lampe allgemein. Der unbestimmte Artikel vermittelt dies im Deutschen am natürlichsten.
- issue: Zweites ἵνα und Zweckbestimmung der Lampe
  choice: „Kommt sie nicht vielmehr auf den Lampenständer?“
  alternative: „Kommt sie nicht, damit man sie auf den Lampenständer stellt?“
  rationale: Die kürzere deutsche Gegenfrage bewahrt den rhetorischen Gegensatz und die Personifizierung. Sie legt keine zusätzliche symbolische Deutung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Personifizierung „eine Lampe kommt“ ist absichtlich beibehalten, weil sie dem griechischen Wortlaut und seiner sprichwörtlichen Lebendigkeit entspricht. Das kulturgeschichtlich genaue, heute weniger geläufige „Hohlmaß“ wird in einer Fußnote erklärt.
