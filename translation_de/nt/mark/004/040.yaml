  text: καὶ εἶπεν αὐτοῖς· Τί δειλοί ἐστε; ⸀οὔπω ἔχετε πίστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Warum seid ihr so furchtsam?[a] Habt ihr noch immer keinen Glauben?[b][c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder stärker: „Warum seid ihr so feige?“'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Habt ihr noch keinen Glauben?“'
    reason: lexical_alternative
  - marker: c
    text: „Glauben“ kann hier auch im Sinn von „Vertrauen“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die einfache Konjunktion führt Jesu Worte als Fortsetzung der vorangehenden Erzählung ein.
- source_word: εἶπεν αὐτοῖς
  choice: er sagte zu ihnen
  rationale: Eine transparente und im Deutschen natürliche Wiedergabe der narrativen Redeeinleitung mit Dativobjekt.
- source_word: Τί
  choice: Warum
  rationale: 'In Verbindung mit dem prädikativen Adjektiv und εἰμί hat τί hier idiomatisch fragend-begründende Funktion: „Warum seid ihr …?“'
- source_word: δειλοί
  choice: so furchtsam
  rationale: „Furchtsam“ bewahrt den tadelnden Charakter von δειλός, ohne im Haupttext zwingend das stärkere charakterliche Urteil „feige“ festzulegen. „So“ gibt die im Deutschen naheliegende Intensität des Vorwurfs wieder.
- source_word: οὔπω
  choice: noch immer keinen
  rationale: Im rhetorischen Zusammenhang bringt „noch immer keinen“ den zeitlichen Vorwurf natürlich zum Ausdruck; die formal nähere Wiedergabe „noch keinen“ bleibt in der Fußnote erhalten.
- source_word: ἔχετε πίστιν
  choice: Habt ihr … Glauben?
  rationale: ἔχω wird als „haben“ wiedergegeben; „Glauben“ wahrt den üblichen theologischen und lexikalischen Umfang von πίστις, während das kontextuell mögliche „Vertrauen“ in einer Fußnote genannt wird.
theological_decisions:
- issue: Bedeutung von πίστις angesichts der Gefahr im Sturm
  choice: Glauben
  alternative: Vertrauen
  rationale: Der Kontext legt Vertrauen zu Jesus nahe, doch πίστις bezeichnet dieses nicht ausdrücklich nur als Vertrauen. „Glauben“ erhält den weiteren Bedeutungsraum; „Vertrauen“ wird als mögliche kontextuelle Wiedergabe ausgewiesen.
- issue: Stärke des Tadels in δειλοί
  choice: furchtsam
  alternative: feige
  rationale: Das Wort kann einen schärferen Vorwurf der Feigheit ausdrücken. Im Zusammenhang reagiert Jesus jedoch unmittelbar auf die Angst der Jünger; daher steht die weniger festlegende Wiedergabe im Haupttext, während die stärkere lexikalische Möglichkeit in der Fußnote bleibt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und tadelnd. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
