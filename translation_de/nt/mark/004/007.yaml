source:
  edition: SBLGNT
  text: καὶ ἄλλο ἔπεσεν εἰς τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ συνέπνιξαν αὐτό, καὶ καρπὸν οὐκ ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/007.yaml
  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: de
  text: Anderes fiel zwischen die Dornen, und die Dornen wuchsen empor und erstickten es, und es brachte keine Frucht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: Anderes
  rationale: Das substantivierte Neutrum gibt die Ellipse des griechischen Textes knapp wieder; aus dem Zusammenhang ist klar, dass weiteres Saatgut gemeint ist.
- source_word: ἔπεσεν
  choice: fiel
  rationale: Entspricht unmittelbar dem Aorist von πίπτω und vermeidet die interpretierende Wiedergabe „wurde gesät“.
- source_word: εἰς τὰς ἀκάνθας
  choice: unter die Dornen
  rationale: „Unter“ ist in diesem landwirtschaftlichen Zusammenhang natürliches Deutsch und bewahrt zugleich den Richtungssinn von εἰς.
- source_word: ἀνέβησαν
  choice: wuchsen empor
  rationale: Gibt das Aufkommen beziehungsweise Hochwachsen der Dornen anschaulich und idiomatisch wieder.
- source_word: συνέπνιξαν
  choice: erstickten
  rationale: Bewahrt das kräftige Bild des griechischen Verbs für Pflanzen, die das Wachstum der Saat unterdrücken.
- source_word: αὐτό
  choice: es
  rationale: Das Pronomen nimmt das elliptisch vorausgesetzte Saatgut im Neutrum wieder auf.
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: es brachte keine Frucht
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Aussage „gab keine Frucht“; sie erhält das landwirtschaftliche Bild.
