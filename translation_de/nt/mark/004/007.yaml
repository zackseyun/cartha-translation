revisions:
- from: Anderes fiel unter die Dornen[a]. Die Dornen wuchsen empor und erstickten es, und es brachte keine Frucht.
  to: Anderes fiel zwischen die Dornen, und die Dornen wuchsen empor und erstickten es, und es brachte keine Frucht.
  rationale: Die Revision ersetzt die räumlich missverständlichere Formulierung „unter die Dornen“ durch „zwischen die Dornen“ und passt die Fußnote als echte lexikalische Alternative an. Der übrige Wortlaut bleibt erhalten, da er den griechischen Text genau und in natürlichem modernem Deutsch wiedergibt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:39:12Z'
review_pass:
  verdict: revise
  source_fidelity: Die Satzfolge und die wesentlichen Bildfelder sind zutreffend wiedergegeben. „Unter die Dornen“ kann jedoch im Deutschen vor allem eine Lage unter bereits vorhandenen Dornen bezeichnen und gibt die Bewegungsrichtung von εἰς weniger klar wieder als „zwischen die Dornen“.
  naturalness: Der Text ist insgesamt gut verständlich. „Zwischen die Dornen“ ist in modernem Standarddeutsch für in dorniges Gestrüpp fallendes Saatgut idiomatischer und zugleich räumlich präziser.
  terminology: „Dornen“, „erstickten“ und „brachte keine Frucht“ sind treffende, registergerechte Wiedergaben von ἄκανθαι, συνέπνιξαν und καρπὸν οὐκ ἔδωκεν. Die elliptische Wiedergabe „Anderes“ ist im Kontext der Parabel vertretbar.
  issues:
  - severity: low
    issue: „unter die Dornen“ ist räumlich weniger genau als „zwischen die Dornen“.
    rationale: εἰς bezeichnet die Bewegung in einen Bereich hinein. „Zwischen die Dornen“ bewahrt diesen Aspekt im Deutschen, ohne das Bild unnötig zu konkretisieren. Die bisherige Fußnote deutet zudem mit „von Dornen bewachsene[r] Boden“ einen Sachverhalt aus, der im griechischen Wortlaut nicht ausdrücklich genannt wird.
  revised_text: Anderes fiel zwischen die Dornen, und die Dornen wuchsen empor und erstickten es, und es brachte keine Frucht.
  revised_footnotes:
  - marker: a
    text: 'Oder: „in die Dornen“.'
    reason: lexical_alternative
  revision_rationale: Die Revision ersetzt die räumlich missverständlichere Formulierung „unter die Dornen“ durch „zwischen die Dornen“ und passt die Fußnote als echte lexikalische Alternative an. Der übrige Wortlaut bleibt erhalten, da er den griechischen Text genau und in natürlichem modernem Deutsch wiedergibt.
