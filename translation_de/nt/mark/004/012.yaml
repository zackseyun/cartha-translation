  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: de
  text: damit sie sehend sehen und nicht erkennen[a] und hörend hören und nicht verstehen[b], damit sie nicht etwa umkehren[c] und ihnen vergeben wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wahrnehmen“ beziehungsweise „erfassen“.'
    reason: lexical_alternative
  - marker: b
    text: Jesus greift Jesaja 6,9–10 auf. Dabei bleibt die Spannung zwischen göttlichem Gericht und dem Versagen der Menschen, darauf zu antworten, bestehen.
    reason: cross_reference
  - marker: c
    text: „Umkehren“ kann auch „sich wieder zuwenden“ oder im Zusammenhang „sich bekehren“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: damit
  rationale: Bewahrt die Zweck- beziehungsweise Folgesprache der griechischen Konjunktion, ohne sie erklärend abzuschwächen.
- source_word: βλέποντες βλέπωσι
  choice: sehend sehen
  rationale: Die bewusst paradoxe Wiederholung von Partizip und finitem Verb bleibt erhalten; die ungewöhnliche Formulierung spiegelt den Nachdruck des griechischen Wortlauts und den Jesaja-Anklang.
- source_word: ἴδωσιν
  choice: erkennen
  rationale: Unterscheidet das wirkliche Erfassen vom zuvor wiederholten bloßen Sehen und ist im Deutschen klar und würdig.
- source_word: ἀκούοντες ἀκούωσι
  choice: hörend hören
  rationale: Bewahrt parallel zur Sehensklausel die emphatische Doppelung des griechischen Ausdrucks.
- source_word: συνιῶσιν
  choice: verstehen
  rationale: Gibt das geistige beziehungsweise innere Erfassen natürlich und ohne zusätzliche Auslegung wieder.
- source_word: μήποτε
  choice: damit ... nicht etwa
  rationale: Bewahrt die negative, auf eine mögliche Folge gerichtete Aussage. Die Wiederaufnahme mit „damit“ ist im Deutschen verständlicher als das heute altertümliche „auf dass nicht“.
- source_word: ἐπιστρέψωσιν
  choice: umkehren
  rationale: Erhält das Bild des Sichwendens und lässt zugleich den im prophetischen Zusammenhang möglichen Sinn von Bekehrung oder Reue offen.
- source_word: ἀφεθῇ αὐτοῖς
  choice: ihnen vergeben wird
  rationale: Bewahrt das unpersönliche Passiv und nennt weder den Handelnden noch einen im Griechischen unausgesprochenen Gegenstand der Vergebung.
theological_decisions:
- issue: Zweck- oder Folgecharakter des Jesaja-Anklangs und die mögliche Aussage, dass die Gleichnisse Umkehr verhindern
  choice: Die zweckartige Formulierung mit „damit ... damit ... nicht etwa“ bleibt stehen.
  alternative: 'Abschwächend als bloße Folge formulieren: „sodass ... andernfalls könnten sie umkehren“.'
  rationale: Der griechische Text bewahrt bewusst die Spannung zwischen göttlichem Gericht und dem ausbleibenden menschlichen Verstehen. Die Übersetzung löst diese Spannung nicht zugunsten nur einer Deutung auf.
- issue: Bedeutung von ἐπιστρέψωσιν im Blick auf Umkehr und Buße
  choice: umkehren
  alternative: sich bekehren; Buße tun; sich wieder zuwenden
  rationale: „Umkehren“ hält die konkrete Wortbedeutung und ihre geistliche Tragweite zusammen, ohne den Ausdruck auf einen theologischen Fachbegriff festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markanten Wendungen „sehend sehen“ und „hörend hören“ sind absichtlich ungewöhnlich, weil sie die rhetorische Doppelung und den prophetischen Klang des griechischen Textes bewahren. Auf altertümliche Formen wie „auf dass“ und „es werde ihnen vergeben“ wurde verzichtet.
