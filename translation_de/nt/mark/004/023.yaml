  text: εἴ τις ἔχει ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: de
  text: Wer Ohren hat zu hören, soll hören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ τις
  choice: Wer
  rationale: Die griechische Bedingungsformel ist allgemein und offen formuliert. Das deutsche „Wer …“ gibt diese generische Aussage natürlicher wieder als das schwerfällige „Wenn jemand …“.
- source_word: ἔχει
  choice: hat
  rationale: Schlichte und idiomatische Wiedergabe des Präsens mit Besitzbedeutung.
- source_word: ὦτα
  choice: Ohren
  rationale: Der konkrete Plural wird beibehalten und entspricht der geläufigen deutschen Ausdrucksweise.
- source_word: ἀκούειν
  choice: zu hören
  rationale: Der Infinitiv bezeichnet Fähigkeit beziehungsweise Bestimmung; „zu hören“ bewahrt zugleich die Wiederholung desselben Verbs.
- source_word: ἀκουέτω
  choice: soll hören
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen natürlich mit „soll“ wiedergegeben. „hören“ erhält die prägnante Wortwiederholung und kann auf aufmerksames, verstehendes Annehmen zielen.
theological_decisions:
- issue: Generischer Singular des Aufrufs
  choice: Wer … soll hören
  alternative: Wenn jemand Ohren hat zu hören, höre er.
  rationale: Die Konstruktion bleibt singularisch und allgemein, ohne ein grammatisches Geschlecht einzuführen. Damit wird weder der Adressatenkreis eingeschränkt noch die individuelle Verantwortung abgeschwächt.
translation_notes:
  register: Kurzer, würdevoller und idiomatischer Merksatz in modernem Standarddeutsch. Die Wiederholung von „hören“ bildet die griechische Wortfigur ab; die Formulierung wahrt sowohl den wörtlichen Hörsinn als auch den Aufruf zu aufmerksamer Aufnahme.
