  source_fidelity: 'Die Übersetzung gibt die Aussage des griechischen Textes zuverlässig wieder: Die allgemeine, auf den Einzelnen bezogene Aufforderung bleibt erhalten, ebenso der Plural „Ohren“ und die bewusste Wiederholung von ἀκούειν/ἀκουέτω durch „hören“/„hören“. „Wer“ ist hier eine idiomatische deutsche Entsprechung der offenen Bedingungsformel εἴ τις und verändert den Sinn nicht.'
