  to: Doch als eine Frau, deren kleine Tochter[a] einen unreinen Geist[b] hatte, von ihm hörte, kam sie sofort und fiel ihm zu Füßen.
  rationale: Die Satzgestaltung bringt εὐθύς mit dem Hören der Frau und ihrer unverzüglichen Reaktion in Verbindung, ohne eine überpräzise grammatische Deutung aufzuzwingen. Die etablierten Wiedergaben der diminutiven Tochterbezeichnung und von πνεῦμα ἀκάθαρτον bleiben erhalten; die nicht benötigte syntaktische Fußnote entfällt.
