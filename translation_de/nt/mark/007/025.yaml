  source_fidelity: 'Die Hauptaussage wird zutreffend wiedergegeben: eine Frau, deren kleine Tochter einen unreinen Geist hatte, hörte von Jesus, kam und fiel ihm zu Füßen. In der vorliegenden Satzfassung wird „sofort“ jedoch unmittelbar mit „kam“ verbunden, während es im Griechischen bei ἀκούσασα („nachdem/als sie hörte“) steht und den unmittelbaren Zusammenhang von Hören und Reagieren ausdrückt.'
  naturalness: Der Entwurf ist grundsätzlich verständlich und würdig, doch „Doch sofort kam eine Frau, die von ihm gehört hatte ...“ verschiebt die zeitliche Akzentsetzung und wirkt gegenüber einer als-Satz-Konstruktion weniger klar. Die Revision ist modernes, flüssiges Standarddeutsch.
  terminology: „kleine Tochter“ gibt θυγάτριον angemessen wieder; „unreiner Geist“ bewahrt die markinische Terminologie und ist gegenüber „böser Geist“ oder „Dämon“ vorzuziehen. „fiel ihm zu Füßen“ ist idiomatisch und quellennah.
