id: MRK.7.25
reference: Mark 7:25
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: de
  text: Doch als eine Frau, deren kleine Tochter[a] einen unreinen Geist[b] hatte, von ihm hörte, kam sie sofort und fiel ihm zu Füßen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ist eine Verkleinerungsform von „Tochter“ und kann auch mit „Töchterchen“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „einen bösen Geist“; traditionell auch als Dämon verstanden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: Doch
  rationale: Gibt den milden Gegensatz beziehungsweise den weiterführenden Übergang zum vorausgehenden Geschehen natürlich wieder.
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus charakteristische Dringlichkeit; die Stellung am Satzanfang entspricht der Hervorhebung im Griechischen.
- source_word: ἀκούσασα ... περὶ αὐτοῦ
  choice: die von ihm gehört hatte
  rationale: Das Partizip bezeichnet, dass die Frau Berichte über Jesus gehört hatte. Die deutsche Formulierung ist idiomatisch und lässt das zeitliche Verhältnis zum Kommen erkennen.
- source_word: γυνὴ
  choice: eine Frau
  rationale: Das artikellose Substantiv führt eine bis dahin nicht genannte Frau in die Erzählung ein.
- source_word: θυγάτριον
  choice: kleine Tochter
  rationale: Die Verkleinerungsform wird durch „kleine Tochter“ wiedergegeben, ohne das Verwandtschaftsverhältnis aufzugeben.
- source_word: πνεῦμα ἀκάθαρτον
  choice: unreinen Geist
  rationale: Bewahrt die feste Ausdrucksweise des Markus und vermeidet die deutendere Ersetzung durch „Dämon“.
- source_word: ἐλθοῦσα
  choice: kam
  rationale: Das Partizip wird als fortlaufende Erzählhandlung in natürlichem Deutsch wiedergegeben.
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: fiel ihm zu Füßen
  rationale: Gibt die körperliche Geste dringlicher Bitte und Demut idiomatisch wieder, ohne die genaue Körperhaltung stärker festzulegen als der Ausgangstext.
theological_decisions:
- issue: Wiedergabe von πνεῦμα ἀκάθαρτον
  choice: unreiner Geist
  alternative: böser Geist; Dämon
  rationale: „Unreiner Geist“ hält an der Terminologie des Markus sowie ihren kultischen und moralischen Anklängen fest. „Dämon“ wäre eine mögliche sachliche Deutung, aber keine unmittelbare lexikalische Entsprechung.
- issue: Zeitlicher Bezug von εὐθὺς ἀκούσασα
  choice: „sofort“ hebt in der Hauptfassung ihr Kommen hervor, nachdem sie von Jesus gehört hatte
  alternative: „Sobald sie von ihm hörte, kam …“ beziehungsweise „Sofort hörte …“
  rationale: Die griechische Wortfolge verbindet εὐθύς eng mit dem Partizip ἀκούσασα, kann im Erzählfluss aber die unmittelbare Reaktion der Frau als Ganzes markieren. Die Fußnote bewahrt diese Spannung, statt sie stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fiel ihm zu Füßen“ bewahrt das konkrete Bild und ist allgemein verständlich. Die relativ komplexe Satzfügung folgt bewusst dem griechischen Ablauf; eine Fußnote dokumentiert die mögliche alternative Zuordnung von „sofort“.
