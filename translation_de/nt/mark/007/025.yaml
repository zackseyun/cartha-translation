    rationale: Die vorgeschlagene Alternative ist nicht erforderlich, wenn der deutsche Haupttext den zeitlichen Zusammenhang direkt ausdrückt. Die behauptete syntaktische Spannung sollte nicht als wesentliche Textunsicherheit behandelt werden.
