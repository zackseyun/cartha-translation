  text: ἔλεγεν δὲ ὅτι Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον ἐκεῖνο κοινοῖ τὸν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/020.yaml
  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: de
  text: 'Er sagte weiter: »Was aus dem Menschen herauskommt, das verunreinigt den Menschen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »macht den Menschen unrein«. Das griechische Verb ist ein Begriff aus der Reinheitssprache und bezeichnet das Unreinmachen beziehungsweise Verunreinigen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ
  choice: Weiter sagte er
  rationale: Die Wendung gibt den milden Anschluss durch δέ und den fortlaufenden Charakter des Imperfekts in natürlichem deutschem Erzählstil wieder.
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: Was aus dem Menschen herauskommt
  rationale: Die substantivierte Partizipialkonstruktion wird idiomatisch wiedergegeben; »aus … herauskommt« bewahrt die räumliche Bildsprache und den wiederholten Bezug auf den Menschen.
- source_word: ἐκεῖνο
  choice: das
  rationale: Das Demonstrativpronomen greift das Vorangehende betont auf und erhält die parallele Satzstruktur.
- source_word: κοινοῖ
  choice: verunreinigt
  rationale: Im Zusammenhang bezeichnet das Verb das Unreinmachen beziehungsweise Entweihen; »verunreinigt« ist knapp, verständlich und bewahrt die Reinheitssprache.
theological_decisions:
- issue: Reinheitssprache von κοινόω
  choice: verunreinigt
  alternative: macht unrein
  rationale: »Verunreinigt« vermittelt sowohl die moralische als auch die kultisch-religiöse Dimension, ohne die Aussage auf nur eine davon festzulegen. Die wörtlichere Umschreibung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »den Menschen« und die demonstrative Hervorhebung durch »das« bleiben erhalten; »Weiter sagte er« vermeidet eine schwerfällige Verlaufsform.
