source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: de
  text: 'Und wenn sie vom Markt kommen, essen sie nicht, ohne sich zu waschen[a]. Außerdem gibt es vieles andere, was sie übernommen haben und einhalten: Waschungen von Bechern, Krügen, Kupfergefäßen und Liegebänken[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne sich unterzutauchen“. Das griechische Verb wird häufig mit „taufen“ wiedergegeben, bezeichnet hier im Zusammenhang der Reinheitsbräuche jedoch eine rituelle Waschung.'
    reason: lexical_alternative
  - marker: b
    text: In einigen Handschriften fehlen die Worte „und Liegebänken“.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγορᾶς
  choice: Markt
  rationale: ἀγορά bezeichnet hier den öffentlichen Markt beziehungsweise Marktplatz. „Vom Markt kommen“ ist im modernen Deutschen natürlich und wahrt den räumlichen Bezug.
- source_word: βαπτίσωνται
  choice: sich gewaschen zu haben
  rationale: Die mediale Form bezeichnet in diesem Reinheitskontext eine an sich selbst vollzogene rituelle Waschung. „Sich waschen“ vermeidet unangebrachte sakramentale Assoziationen, ohne eine bestimmte Art der Waschung festzulegen.
- source_word: παρέλαβον κρατεῖν
  choice: übernommen haben und einhalten
  rationale: Die Wendung verbindet das Empfangen überlieferter Praktiken mit ihrem fortgesetzten Befolgen. Die Übersetzung gibt beide Aspekte verständlich wieder.
- source_word: βαπτισμοὺς
  choice: Waschungen
  rationale: βαπτισμός bezeichnet hier rituelle Waschungen von Gefäßen und anderem Hausrat. „Waschungen“ bleibt konkret und legt die genaue Methode nicht fest.
- source_word: ξεστῶν
  choice: Krügen
  rationale: ξέστης bezeichnet ein Gefäß, wahrscheinlich einen Krug oder eine Kanne. „Krüge“ ist ein verständlicher, nicht übermäßig genauer Oberbegriff.
- source_word: χαλκίων
  choice: Kupfergefäßen
  rationale: χαλκίον bezeichnet einen Gegenstand aus Kupfer beziehungsweise einer Kupferlegierung. „Kupfergefäße“ gibt Material und Gegenstandsart klar wieder.
- source_word: κλινῶν
  choice: Liegebänken
  rationale: κλίνη kann Bett oder Liege bedeuten; im Zusammenhang mit Mahlzeiten und Reinheitsvorschriften sind Liegebänke zum Speisen wahrscheinlich. Die Wahl wahrt den antiken kulturellen Rahmen, ohne daraus moderne Tische zu machen.
- source_word: ἄλλα πολλά
  choice: vieles andere
  rationale: Die griechische Formulierung bleibt allgemein. „Vieles andere“ vermeidet die interpretierende Einengung auf ausdrücklich so genannte Traditionen oder Bräuche.
theological_decisions:
- issue: Bedeutung von βαπτίσωνται und βαπτισμοὺς im Zusammenhang ritueller Reinheit
  choice: „sich gewaschen zu haben“ und „Waschungen“
  alternative: „sich untergetaucht zu haben“ und „Tauchungen“ beziehungsweise „sich getauft zu haben“ und „Taufen“
  rationale: Der Zusammenhang betrifft jüdische Reinheitsbräuche, nicht die christliche Taufe. Die gewählte Wiedergabe lässt offen, wie die Reinigung technisch vollzogen wurde, und vermeidet anachronistische sakramentale Festlegungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem Gedankengang des Griechischen, wird aber idiomatisch geglättet. Der Gedankenstrich am Versende bleibt erhalten, da der Satz in den folgenden Kontext weiterführt.
