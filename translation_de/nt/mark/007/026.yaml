id: MRK.7.26
reference: Mark 7:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: de
  text: Die Frau war Griechin[a], ihrer Herkunft nach Syrophönizierin[b], und sie bat ihn immer wieder, den Dämon aus ihrer Tochter auszutreiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine Nichtjüdin“. Wörtlich steht hier „Griechin“; im Zusammenhang kennzeichnet das Wort sie wahrscheinlich auch als nichtjüdisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dem Geschlecht beziehungsweise der Abstammung nach eine Syrophönizierin“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: Griechin
  rationale: Dies entspricht der konkreten griechischen Bezeichnung. Im Zusammenhang kennzeichnet sie die Frau zugleich als Nichtjüdin; diese weiter gefasste Bedeutung wird in einer Fußnote erläutert, nicht an die Stelle des Wortlauts gesetzt.
- source_word: Συροφοινίκισσα τῷ γένει
  choice: ihrer Herkunft nach Syrophönizierin
  rationale: Die Formulierung bewahrt die ethnisch-geografische Herkunftsangabe und gibt τῷ γένει in natürlichem modernem Deutsch wieder, ohne den heute missverständlichen Ausdruck „der Rasse nach“ zu verwenden.
- source_word: ἠρώτα
  choice: sie bat ihn immer wieder
  rationale: Der Imperfekt bezeichnet eine fortdauernde oder wiederholte Bitte. „Bat ihn immer wieder“ bildet diesen Aspekt natürlich ab, ohne das Verb unnötig zu „anflehen“ zu steigern.
- source_word: ἵνα ... ἐκβάλῃ
  choice: den Dämon ... auszutreiben
  rationale: Der ἵνα-Satz gibt hier den Inhalt der Bitte an. „Austreiben“ ist im Deutschen die klare, übliche Entsprechung von ἐκβάλλω im Zusammenhang einer Dämonenaustreibung.
- source_word: τὸ δαιμόνιον
  choice: den Dämon
  rationale: Der Ausgangstext nennt ausdrücklich einen Dämon und nicht lediglich allgemein einen bösen oder unreinen Geist.
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: aus ihrer Tochter
  rationale: „Aus“ entspricht ἐκ und bewahrt die räumlich-konkrete Ausdrucksweise des griechischen Textes.
- source_word: δὲ
  choice: unmarkiert durch den Satzanschluss wiedergegeben
  rationale: δέ trägt hier nur einen leichten erzählerischen Übergang. Im Deutschen ist kein zusätzliches „nun“, „aber“ oder „und“ nötig; eine solche Einfügung könnte einen zeitlichen oder gegensätzlichen Akzent überbetonen.
theological_decisions:
- issue: Ethnische und kulturelle Bezeichnung der Frau
  choice: 'Beide Angaben bleiben erhalten: „Griechin“ und „ihrer Herkunft nach Syrophönizierin“.'
  alternative: „Nichtjüdin syrophönizischer Herkunft“
  rationale: Der griechische Text bietet zwei unterscheidbare Identitätsangaben. Die Übersetzung fasst sie nicht zu einer einzigen religiös-ethnischen Kategorie zusammen und bewahrt so die soziale und historische Spannung der Erzählung.
- issue: Art der Bedrängnis der Tochter
  choice: „den Dämon ... auszutreiben“
  alternative: „den bösen Geist ... zu vertreiben“
  rationale: Die Übersetzung folgt dem ausdrücklichen Wort δαιμόνιον und deutet die im Text behauptete übernatürliche Bedrängnis weder um noch ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Griechin“ und „Syrophönizierin“ sind präzise und gut verständlich; „ihrer Herkunft nach“ vermeidet biologisierende Sprache. Die wiederholte Bitte wird durch „immer wieder“ sichtbar gemacht. Alle Fußnotenmarker stehen unmittelbar bei den erläuterten Ausdrücken.
