  naturalness: „Versammeln sich um ihn“ ist modernes, idiomatisches Deutsch und passt zur erzählerischen Szene. Es vermeidet sowohl das zu lokative „bei ihm“ als auch das weniger natürliche „versammeln sich zu ihm“.
  terminology: „Pharisäer“ und „Schriftgelehrte“ sind etablierte, sachliche deutsche Bezeichnungen. Keine theologisch lenkende Terminologie liegt vor.
