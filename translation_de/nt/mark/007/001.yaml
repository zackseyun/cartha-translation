id: MRK.7.1
reference: Mark 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: de
  text: Und die Pharisäer und einige der Schriftgelehrten, die aus Jerusalem gekommen waren, versammeln sich um ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „versammeln sich bei ihm“. Wörtlicher: „versammeln sich zu ihm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den für Markus typischen erzählerischen Anschluss, ohne einen stärkeren Einschnitt einzuführen.
- source_word: συνάγονται
  choice: versammeln sich
  rationale: Das historische Präsens wird als deutsches Präsens wiedergegeben und erhält so die lebendige Erzählweise. Das reflexive Verb ist im Deutschen für das Zusammenkommen einer Gruppe natürlich.
- source_word: πρὸς αὐτόν
  choice: bei ihm
  rationale: Gibt die Ausrichtung der Versammlung auf Jesus in natürlichem Deutsch wieder, ohne zwingend eine räumliche Anordnung rings um ihn zu behaupten. Wörtlicher ist „zu ihm“.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Übliche und sachlich angemessene deutsche Bezeichnung dieser jüdischen Gruppierung.
- source_word: τινες τῶν γραμματέων
  choice: einige der Schriftgelehrten
  rationale: 'Bildet den partitiven Genitiv präzise ab: Gemeint ist ein Teil der Schriftgelehrten.'
- source_word: γραμματέων
  choice: Schriftgelehrten
  rationale: Etablierte deutsche Wiedergabe für die mit Auslegung und Anwendung der heiligen Schriften befassten Fachleute; präziser im neutestamentlichen Kontext als das missverständliche „Schreiber“.
- source_word: ἐλθόντες
  choice: die ... gekommen waren
  rationale: Der Aoristpartizip bezeichnet eine der Haupthandlung vorausliegende Ankunft. Der Relativsatz im Plusquamperfekt ist im modernen Deutsch natürlich und bewahrt die zeitliche Abfolge.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: aus Jerusalem
  rationale: „Aus“ bezeichnet bei einer Stadt als Ausgangsort idiomatisch die Herkunft beziehungsweise vorangegangene Bewegung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens des griechischen Hauptverbs bleibt erhalten. Der Relativsatz vermeidet eine schwerfällige partizipiale Konstruktion; die Fußnote dokumentiert die wörtlichere räumlich-direktionale Fassung.
