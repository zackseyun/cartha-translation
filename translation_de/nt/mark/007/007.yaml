  variant: modern standard German
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: de
  text: Doch vergeblich beten sie mich an, indem sie Menschengebote als Lehren weitergeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „indem sie Lehren weitergeben, die Menschengebote sind.“'
    reason: Der griechische Ausdruck stellt „Lehren“ und „Menschengebote“ knapp nebeneinander; sowohl die Wiedergabe „Menschengebote als Lehren“ als auch eine erläuternde prädikative Umschreibung ist möglich.
lexical_decisions:
- source_word: μάτην
  choice: vergeblich
  rationale: Das Adverb bezeichnet etwas Zweckloses oder Wirkungsloses. „Vergeblich“ gibt die Schärfe des prophetischen Zitats natürlich und prägnant wieder.
- source_word: δὲ
  choice: Doch
  rationale: Die Partikel setzt die nichtige Anbetung in Gegensatz zum zuvor genannten Lippenbekenntnis und der Ferne des Herzens.
- source_word: σέβονταί με
  choice: beten sie mich an
  rationale: σέβομαι bezeichnet hier die auf Gott gerichtete Verehrung; „anbeten“ ist im Deutschen die klare und kontextgemäße Wiedergabe.
- source_word: διδάσκοντες
  choice: indem sie … verkünden
  rationale: Das Partizip beschreibt, wodurch beziehungsweise in welcher Weise ihre Anbetung vergeblich ist. „Indem“ wahrt diesen Zusammenhang; „verkünden“ vermeidet zusammen mit „Lehren“ die im Deutschen schwerfällige Wiederholung von „lehren“.
- source_word: διδασκαλίας
  choice: als Lehren
  rationale: Das Substantiv bezeichnet Lehrinhalte. „Als Lehren“ verdeutlicht idiomatisch, dass menschliche Gebote mit dem Rang verbindlicher Lehre vermittelt werden.
- source_word: ἐντάλματα ἀνθρώπων
  choice: Menschengebote
  rationale: Das Kompositum gibt knapp und natürlich wieder, dass die Gebote menschlichen Ursprungs sind, und bewahrt den Gegensatz zu göttlicher Autorität.
theological_decisions:
- issue: Verhältnis von „Lehren“ und „Menschengeboten“ im verdichteten griechischen Ausdruck
  choice: Menschengebote als Lehren verkünden
  alternative: Lehren verkünden, die Menschengebote sind
  rationale: Die gewählte Fassung macht verständlich, dass menschliche Gebote als maßgebliche Lehre vermittelt werden, ohne die Kritik auf eine bestimmte spätere Lehrtradition festzulegen. Die Fußnote bewahrt eine formal nähere Deutungsmöglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch“ markiert den Kontrast zum vorangehenden Vers; „Menschengebote“ ist verständlich und bewahrt den religiös-rechtlichen Ton des Zitats.
