source:
  edition: SBLGNT
  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: de
  text: Denn die Pharisäer und alle Juden essen nicht, wenn sie sich nicht mit der Faust[a] die Hände waschen, und halten dabei an der Überlieferung der Ältesten fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit der Faust“. Der schwierige griechische Ausdruck kann möglicherweise „bis zum Handgelenk“ oder „gründlich“ bedeuten und bezeichnet wohl eine herkömmliche Art des rituellen Händewaschens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Denn
  rationale: Leitet den erklärenden Einschub ein und bewahrt den begründenden Zusammenhang natürlich im Deutschen.
- source_word: Φαρισαῖοι
  choice: Pharisäer
  rationale: Eingebürgerte deutsche Bezeichnung der jüdischen Gruppe.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: alle Juden
  rationale: Bewahrt die ausdrücklich umfassende, rhetorische Verallgemeinerung des griechischen Textes; gemeint ist hier die jüdische Bevölkerung im ethnisch-religiösen Sinn, nicht nur die Bewohner Judäas.
- source_word: ἐὰν μὴ
  choice: wenn sie sich nicht
  rationale: Gibt die negative Bedingung idiomatisch wieder; zusammen mit dem Hauptsatz entspricht dies dem deutschen Muster „nicht … wenn nicht“.
- source_word: πυγμῇ
  choice: mit der Faust
  rationale: Die formal nahe Wiedergabe bewahrt den ungewöhnlichen und umstrittenen Ausdruck, ohne eine bestimmte Rekonstruktion des rituellen Waschvorgangs stillschweigend festzulegen; mögliche Bedeutungen werden in der Fußnote genannt.
- source_word: νίψωνται τὰς χεῖρας
  choice: sich … die Hände waschen
  rationale: Natürliche deutsche Wiedergabe für das Waschen eines Körperteils; das reflexive Dativpronomen ist idiomatisch.
- source_word: οὐκ ἐσθίουσιν
  choice: essen nicht
  rationale: Bewahrt die allgemeine, gewohnheitsmäßige Aussage ohne ein im Griechischen nicht genanntes Objekt hinzuzufügen.
- source_word: κρατοῦντες
  choice: damit halten sie … fest
  rationale: Gibt das beharrliche Festhalten an einer überlieferten Praxis verständlich wieder und macht den Bezug des Partizips im Deutschen klar.
- source_word: παράδοσιν
  choice: Überlieferung
  rationale: Bezeichnet hier weitergegebene Lehren und Bräuche; „Überlieferung“ bewahrt den Gedanken des Tradierens.
- source_word: τῶν πρεσβυτέρων
  choice: der Ältesten
  rationale: Gibt den Genitiv knapp wieder und lässt dessen Beziehung als Herkunft beziehungsweise Zuordnung der Überlieferung bestehen.
theological_decisions:
- issue: Umfang und Aussagekraft von „alle Juden“
  choice: Die umfassende Formulierung „alle Juden“ bleibt als erklärende Verallgemeinerung des Markus erhalten.
  alternative: alle Judäer; viele Juden
  rationale: Der griechische Text sagt ausdrücklich „alle Juden“. Eine Abschwächung wäre eine über den Wortlaut hinausgehende Deutung; zugleich ist die Aussage als rhetorisch allgemeine Beschreibung zu verstehen, nicht notwendig als statistische Behauptung über jede einzelne Person.
- issue: Bedeutung von πυγμῇ
  choice: Im Haupttext steht formal „mit der Faust“, ergänzt durch eine Fußnote zur lexikalischen Unsicherheit.
  alternative: bis zum Handgelenk; gründlich; sorgfältig
  rationale: Der Ausdruck ist schwer zu deuten und bezeichnet wahrscheinlich eine herkömmliche Art oder ein bestimmtes Ausmaß rituellen Händewaschens. Die Übersetzung legt keine der umstrittenen Rekonstruktionen als sicher fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erklärende Charakter des Verses bleibt durch „Denn“ erhalten. Die ungewöhnliche Haupttextformulierung „mit der Faust“ ist bewusst quellennah und wird durch die Fußnote gegen ein vorschnelles wörtliches Missverständnis abgesichert.
