id: MRK.7.31
reference: Mark 7:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: de
  text: Wieder verließ Jesus das Gebiet von Tyrus und kam über Sidon[a] an den See von Galiläa, mitten durch das Gebiet der Dekapolis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Sidon“. Die griechische Wendung kann eine Reise durch Sidon oder auf dem Weg über Sidon bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder wörtlicher: „zwischen den Gebieten der Dekapolis“. Die griechische Wendung kann „mitten durch“, „inmitten“ oder „zwischen“ bedeuten; die beschriebene Route ist geografisch schwer nachzuvollziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Kennzeichnet die erneute Bewegung im Erzählverlauf und entspricht knapp und natürlich dem griechischen Adverb.
- source_word: ἐξελθὼν ἐκ τῶν ὁρίων Τύρου
  choice: verließ Jesus das Gebiet von Tyrus
  rationale: Das vorzeitige Aoristpartizip wird in natürlichem Deutsch als finite Verbform wiedergegeben. ὅρια bezeichnet hier das Territorium beziehungsweise die Gegend, nicht nur eine Grenzlinie. Das im Kontext eindeutige Subjekt wird zur Verständlichkeit als „Jesus“ benannt.
- source_word: ἦλθεν
  choice: kam
  rationale: Bewahrt die gewöhnliche Erzählperspektive von ἔρχομαι, ohne die Bewegung kartografisch zu glätten.
- source_word: διὰ Σιδῶνος
  choice: über Sidon
  rationale: διά mit Genitiv bezeichnet hier den Weg durch beziehungsweise über einen Ort; „über Sidon“ ist eine natürliche deutsche Routenangabe und lässt offen, ob die Stadt selbst oder ihr Gebiet gemeint ist.
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: an den See von Galiläa
  rationale: „See von Galiläa“ ist die geläufige deutsche geografische Bezeichnung; „an“ gibt das Erreichen des Gewässers idiomatisch wieder.
- source_word: ἀνὰ μέσον
  choice: mitten durch
  rationale: Bewahrt den räumlichen Sinn von Bewegung inmitten beziehungsweise zwischen Gebieten, ohne die ungewöhnliche und geografisch schwierige Routenbeschreibung aufzulösen.
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: das Gebiet der Dekapolis
  rationale: Das pluralische ὅρια bezeichnet den territorialen Bereich. „Dekapolis“ bleibt als etablierter Name der Region erhalten.
theological_decisions: []
