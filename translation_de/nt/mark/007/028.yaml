id: MRK.7.28
reference: Mark 7:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: de
  text: 'Sie aber antwortete und sagte zu ihm: „Herr[a], auch die Hündchen[b] unter dem Tisch essen von den Krümeln der Kinder.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann sowohl eine respektvolle Anrede als auch den Titel „Herr“ bezeichnen.
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort ist eine Verkleinerungsform und kann kleine oder zum Haushalt gehörende Hunde bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: antwortete und sagte zu ihm
  rationale: Die Wendung bildet beide griechischen Verben ab. Das historische Präsens λέγει wird im natürlichen deutschen Erzählstil als Vergangenheit wiedergegeben.
- source_word: Κύριε
  choice: Herr
  rationale: „Herr“ bewahrt die übliche Anrede und mögliche Titelfunktion; im Kontext kann das Wort zugleich als respektvolle Anrede verstanden werden.
- source_word: καὶ
  choice: auch
  rationale: Das additive καί bezieht die Hündchen in das Bild ein, ohne den Gedankengang stärker als im Griechischen concessiv auszudeuten.
- source_word: κυνάρια
  choice: Hündchen
  rationale: Die Verkleinerungsform bezeichnet kleine beziehungsweise zum Haushalt gehörende Hunde; „Hündchen“ erhält diese Nuance.
- source_word: ὑποκάτω τῆς τραπέζης
  choice: unter dem Tisch
  rationale: Direkte und idiomatische Wiedergabe der räumlichen Angabe.
- source_word: ἐσθίουσιν
  choice: essen
  rationale: Das Präsens beschreibt hier einen allgemeinen beziehungsweise gewöhnlichen Vorgang.
- source_word: ἀπὸ τῶν ψιχίων
  choice: von den Krümeln
  rationale: „Krümel“ gibt die kleinen Speisereste präzise wieder; „von“ bewahrt die partitive Nuance von ἀπό.
- source_word: τῶν παιδίων
  choice: der Kinder
  rationale: Der Genitiv wird natürlich als Zugehörigkeit der Krümel zu den Kindern wiedergegeben, ohne ein zusätzliches Substantiv wie „Essen“ einzufügen.
theological_decisions:
- issue: Bedeutung von κύριε in der Anrede an Jesus
  choice: Herr
  alternative: mein Herr / Herr im Sinn einer höflichen Anrede
  rationale: Die Wiedergabe „Herr“ lässt sowohl die respektvolle Anrede als auch die mögliche Titelfunktion stehen und entscheidet die christologische Tragweite nicht über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas formelhafte Doppelung „antwortete und sagte“ wurde beibehalten, weil beide Verben im griechischen Text stehen. Die Bildsprache und ihre Spannung bleiben ohne erklärende Zusätze erhalten.
