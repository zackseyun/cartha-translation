  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: de
  text: 'Und die Pharisäer und die Schriftgelehrten fragten ihn: „Warum richten sich deine Jünger nicht nach der Überlieferung der Ältesten, sondern essen das Brot mit unreinen Händen[a]?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit gewöhnlichen (oder: gemeinen) Händen“; gemeint sind Hände, die nach der Überlieferung als rituell unrein gelten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: fragten
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben; eine wiederholte Befragung wird vom Verb hier nicht zwingend ausgedrückt.
- source_word: γραμματεῖς
  choice: Schriftgelehrten
  rationale: Dies ist die etablierte und verständliche Bezeichnung für die damaligen Ausleger und Rechtskundigen der heiligen Schriften.
- source_word: Διὰ τί
  choice: Warum
  rationale: Die direkte und idiomatische deutsche Entsprechung der Frageformel.
- source_word: περιπατοῦσιν
  choice: richten sich
  rationale: Das griechische Bildwort „gehen/wandeln“ bezeichnet hier das Verhalten gemäß einer Norm. „Sich nach … richten“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: κατὰ τὴν παράδοσιν
  choice: nach der Überlieferung
  rationale: „Nach“ drückt die von κατά bezeichnete Übereinstimmung mit einer maßgebenden Tradition knapp und idiomatisch aus.
- source_word: τῶν πρεσβυτέρων
  choice: der Ältesten
  rationale: Die Genitivverbindung bleibt erhalten und bezeichnet frühere anerkannte Autoritäten, ohne sie näher auszudeuten.
- source_word: κοιναῖς χερσὶν
  choice: mit unreinen Händen
  rationale: κοινός bedeutet in diesem Zusammenhang rituell unrein beziehungsweise profaniert, nicht bloß körperlich schmutzig. Die Fußnote bewahrt zugleich die wörtliche Bedeutung „gewöhnlich/gemein“.
- source_word: τὸν ἄρτον
  choice: das Brot
  rationale: Die konkrete Bedeutung „Brot“ wird gegenüber dem weiter gefassten „Essen“ bewahrt, auch wenn Brot hier für die Mahlzeit stehen kann.
theological_decisions:
- issue: Ritueller Status in κοιναῖς χερσίν
  choice: „mit unreinen Händen“ mit erläuternder Fußnote
  alternative: „mit entweihten Händen“ oder wörtlich „mit gewöhnlichen Händen“
  rationale: Der Streit betrifft rituelle Reinheit nach der Überlieferung, nicht Hygiene oder moralische Schuld. „Unrein“ vermittelt diesen kultischen Bezug, während die Fußnote die ungewöhnliche griechische Wortwahl offenlegt.
- issue: Metaphorischer Gebrauch von περιπατεῖν
  choice: „sich nach … richten“
  alternative: „nach … leben/wandeln“
  rationale: Die Bedeutung regelkonformen Verhaltens wird natürlich wiedergegeben, ohne eine besondere geistliche oder konfessionelle Bedeutung in das Bildwort hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schriftgelehrte“, „Überlieferung“ und „Älteste“ bewahren den historischen und religiösen Kontext; die Frage selbst bleibt mündlich und unmittelbar verständlich.
