  text: Καὶ προσκαλεσάμενος ⸀πάλιν τὸν ὄχλον ἔλεγεν αὐτοῖς· ⸀Ἀκούσατέ μου πάντες καὶ ⸀σύνετε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: de
  text: 'Dann rief er die Menge wieder zu sich und sagte zu ihnen: »Hört mir alle zu und versteht!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: rief … zu sich
  rationale: Gibt das Herbeirufen der Menge natürlich und präzise wieder.
- source_word: πάλιν
  choice: wieder
  rationale: Bewahrt die ausdrückliche Wiederholung im griechischen Text.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt leitet hier idiomatisch die folgende direkte Rede ein; deutsches »sagte« wahrt den Sinn, ohne einen unnatürlichen durativen Ausdruck zu erzwingen.
- source_word: Ἀκούσατέ μου πάντες
  choice: Hört mir alle zu
  rationale: Natürliches modernes Deutsch; πάντες wird durch »alle« ausdrücklich erhalten.
- source_word: σύνετε
  choice: versteht
  rationale: Bewahrt den knappen pluralischen Imperativ und den Aufruf, das Gesagte geistig zu erfassen.
theological_decisions:
- issue: Aspekt von ἔλεγεν
  choice: sagte zu ihnen
  alternative: sprach immer wieder zu ihnen / war dabei, zu ihnen zu sagen
  rationale: Der griechische Imperfekt kann fortlaufende oder wiederholte Rede anzeigen, dient in Erzählungen aber häufig als Einleitung direkter Rede. Eine schwerfällige Verlaufsform würde im Deutschen mehr Dauer betonen, als der Zusammenhang sicher verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, gut verständlicher Rede. Keine Fußnoten erforderlich.
