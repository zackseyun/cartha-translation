source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: de
  text: Und als sie nach Hause gegangen war, fand sie das Kind auf dem Bett liegen; der Dämon war fort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Der Dämon war hinausgegangen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: als sie nach Hause gegangen war
  rationale: Der Aoristpartizip bezeichnet eine dem Hauptverb vorausgehende Handlung. „Nach Hause“ gibt die Bewegung zu ihrer eigenen Wohnung im Deutschen natürlich wieder; das Plusquamperfekt wahrt die zeitliche Abfolge.
- source_word: εὗρεν
  choice: fand sie
  rationale: Die gewöhnliche narrative Bedeutung von εὑρίσκω wird direkt und idiomatisch wiedergegeben.
- source_word: παιδίον
  choice: das Kind
  rationale: Die neutrale Bezeichnung des griechischen Textes bleibt erhalten; aus dem Kontext ist bekannt, dass es sich um ihre Tochter handelt.
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: auf dem Bett liegen
  rationale: Das Perfektpassiv beschreibt hier den vorgefundenen Zustand des Kindes. „Liegen“ ist im Deutschen natürlich und vermeidet die unbegründete Vorstellung, das Kind sei gewaltsam hingeworfen worden.
- source_word: δαιμόνιον
  choice: der Dämon
  rationale: Der konkrete Ausdruck δαιμόνιον wird beibehalten und nicht mit dem zuvor gebrauchten Ausdruck „unreiner Geist“ vereinheitlicht.
- source_word: ἐξεληλυθός
  choice: war fort
  rationale: Das griechische Perfektpartizip betont den vollzogenen Ausgang und den daraus folgenden Zustand der Abwesenheit. „War fort“ gibt diesen Ergebniszustand knapp und natürlich wieder; die formalere Fassung steht in der Fußnote.
theological_decisions:
- issue: Beschreibung des Ergebnisses der Dämonenaustreibung
  choice: der Dämon war fort
  alternative: der Dämon war hinausgegangen
  rationale: Die Übersetzung bezeugt die tatsächliche, abgeschlossene Entfernung des Dämons, ohne den knappen griechischen Wortlaut auszuschmücken. Die alternative, formalere Wiedergabe macht die Ausgangsbewegung ausdrücklich.
translation_notes:
  register: Modernes, würdiges Erzählregister. Das Semikolon verdeutlicht, dass sowohl der Zustand des Kindes als auch die Abwesenheit des Dämons Gegenstand dessen sind, was die Frau vorfand, ohne die griechische Satzspannung aufzulösen.
