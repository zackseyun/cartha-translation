  text: ⸀οὐκέτι ἀφίετε αὐτὸν οὐδὲν ποιῆσαι τῷ ⸀πατρὶ ἢ τῇ ⸀μητρί,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/012.yaml
  text: you no longer allow him to do anything for his father or mother,[a]
translation:
  language: de
  text: Dann erlaubt ihr ihm nicht mehr, irgendetwas für seinen Vater oder seine Mutter zu tun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann erlaubt ihr ihm nicht mehr, seinem Vater oder seiner Mutter irgendwie zu helfen.“ Der weitere Zusammenhang kann praktische oder finanzielle Unterstützung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: nichts mehr
  rationale: In Verbindung mit οὐδέν gibt diese im Deutschen natürliche Formulierung die zeitliche Bedeutung „nicht länger“ wieder.
- source_word: ἀφίετε
  choice: lasst
  rationale: ἀφίημι bedeutet hier „zulassen, erlauben“. „Lasst“ ist knapp, natürlich und bewahrt die direkte Anrede im Plural.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Singularpronomen bezeichnet den zuvor genannten Menschen und bleibt ausdrücklich erhalten.
- source_word: οὐδέν
  choice: nichts
  rationale: Zusammen mit ποιῆσαι bezeichnet es umfassend jede Handlung, die den Eltern zugutekommen könnte.
- source_word: ποιῆσαι
  choice: tun
  rationale: Die allgemeine Bedeutung des Verbs wird bewahrt, ohne die vom Kontext nahegelegte materielle Hilfe in den Haupttext einzutragen.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: für seinen Vater oder seine Mutter
  rationale: Der Dativ bezeichnet hier die begünstigten Personen. Das Possessivpronomen macht im Deutschen den kontextuell eindeutigen Familienbezug natürlich verständlich.
theological_decisions:
- issue: Soll die im Korban-Kontext nahegelegte materielle oder finanzielle Unterstützung ausdrücklich genannt werden?
  choice: Die allgemeine Formulierung „für seinen Vater oder seine Mutter tun“ bleibt im Haupttext erhalten.
  alternative: „seinem Vater oder seiner Mutter irgendwie helfen“ beziehungsweise „für den Unterhalt seines Vaters oder seiner Mutter sorgen“
  rationale: Der weitere Zusammenhang legt praktische oder materielle Hilfe nahe, doch der griechische Wortlaut dieses Verses bleibt allgemeiner. Die Übersetzung verengt ihn daher nicht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Satzbau. „Dann“ bindet den Vers natürlich an den vorausgehenden Konditionalsatz an; das griechische οὐκέτι trägt selbst jedoch nur die Bedeutung „nicht mehr“.
