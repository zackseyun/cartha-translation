  text: μοιχεῖαι⸃, πλεονεξίαι, πονηρίαι, δόλος, ἀσέλγεια, ὀφθαλμὸς πονηρός, βλασφημία, ὑπερηφανία, ἀφροσύνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: de
  text: Ehebrüche, Habgier, Bosheiten, Betrug, Ausschweifung, ein böses Auge[a], Lästerung[b], Hochmut, Unvernunft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Neid“ oder „ein missgünstiger Blick“; wörtlich: „ein böses Auge“, eine Wendung für eine neidische, missgünstige oder böswillige Haltung.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Verleumdung“ beziehungsweise „Gotteslästerung“. Das griechische Wort kann schmähende Rede gegen Menschen oder gegen Gott bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: Ehebrüche
  rationale: Der Plural wird bewahrt und bezeichnet einzelne Akte des Ehebruchs innerhalb der Aufzählung.
- source_word: πλεονεξίαι
  choice: Habgier
  rationale: Das Wort bezeichnet ein maßloses, zugreifendes Mehrhabenwollen; „Habgier“ ist im heutigen Deutsch klar und prägnant.
- source_word: πονηρίαι
  choice: Bosheiten
  rationale: Der deutsche Plural bildet den griechischen Plural ab und lässt verschiedene Äußerungen moralischer Schlechtigkeit erkennen.
- source_word: δόλος
  choice: Betrug
  rationale: „Betrug“ gibt vorsätzliche Täuschung natürlich und verständlich wieder.
- source_word: ἀσέλγεια
  choice: Ausschweifung
  rationale: Der Ausdruck bezeichnet schamloses, zügelloses Verhalten, häufig mit sexueller Färbung; „Ausschweifung“ wahrt diese Breite.
- source_word: ὀφθαλμὸς πονηρός
  choice: ein böses Auge
  rationale: Die semitisch geprägte Metapher wird im Haupttext bewahrt; ihre Bedeutung als neidische, missgünstige oder böswillige Haltung wird in der Fußnote erklärt.
- source_word: βλασφημία
  choice: Lästerung
  rationale: „Lästerung“ kann im Deutschen verletzende Schmährede und, besonders im religiösen Zusammenhang, Gotteslästerung bezeichnen und bewahrt damit die Bedeutungsbreite.
- source_word: ὑπερηφανία
  choice: Hochmut
  rationale: Das Wort bezeichnet überhebliche Selbsterhöhung; „Hochmut“ ist würdig, verständlich und präzise.
- source_word: ἀφροσύνη
  choice: Unvernunft
  rationale: Gemeint ist moralische und praktische Einsichtslosigkeit, nicht bloß geringe Intelligenz; „Unvernunft“ bringt dies deutlich zum Ausdruck.
theological_decisions:
- issue: Bedeutungsumfang von βλασφημία in der Lasterliste
  choice: Lästerung
  alternative: Verleumdung; Gotteslästerung
  rationale: Der griechische Ausdruck kann schmähende Rede gegen Menschen wie auch Lästerung gegen Gott bezeichnen. Das breitere deutsche „Lästerung“ hält diese Spannung offen; eine Fußnote nennt beide möglichen Zielrichtungen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe Reihung der griechischen Lasterliste bleibt erhalten; explizite Plurale werden, wo im Deutschen natürlich, als Plurale wiedergegeben. Die Metapher „ein böses Auge“ bleibt aus Transparenzgründen im Text und wird erläutert.
