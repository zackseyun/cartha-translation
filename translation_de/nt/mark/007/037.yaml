  source_fidelity: Die Aussage wird insgesamt zutreffend wiedergegeben. Allerdings gibt „gerieten völlig außer sich vor Staunen“ den imperfektischen, fortdauernden Zustand von ἐξεπλήσσοντο weniger genau wieder und kann im Deutschen eine stärkere emotionale Selbstkontrolllosigkeit nahelegen. „waren über alle Maßen erstaunt“ bewahrt Intensität und Aspekt besser. Das hervorhebende „Sogar“ ist bei der einfachen griechischen Koordination καὶ … καὶ nicht erforderlich und sollte nicht als explizite Akzentsetzung in den Haupttext aufgenommen werden.
  naturalness: „Sie waren über alle Maßen erstaunt“ ist modernes, würdiges und idiomatisches Standarddeutsch. Die kausative Wendung „bringt ... zum Hören/zum Sprechen“ bleibt klar und parallel.
  terminology: „Gehörlose“ und „Stumme“ sind in diesem knappen, parallel gebauten Heilungsausspruch semantisch passend. „Alles gut gemacht“ ist eine natürliche Wiedergabe von καλῶς πάντα πεποίηκεν. Die Fußnoten benennen mögliche Schriftanklänge zurückhaltend, ohne sie als zwingende Auslegung auszugeben.
