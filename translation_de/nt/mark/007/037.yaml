  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: de
  text: 'Und sie waren über alle Maßen erstaunt und sagten: »Er hat alles gut gemacht.[a] Die Gehörlosen bringt er zum Hören und die Stummen zum Sprechen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: »Er hat alle Dinge gut gemacht.« Die Formulierung kann an biblische Aussagen über Gottes Werke erinnern.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Worte erinnern an Jesaja 35,5–6: Bei Gottes Wiederherstellung hören Gehörlose, und Stumme sprechen.'
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς ἐξεπλήσσοντο
  choice: sie gerieten völlig außer sich vor Staunen
  rationale: Die Verbindung aus stark intensivierendem Adverb und Imperfekt bezeichnet ein außergewöhnliches, anhaltendes Erstaunen. Die deutsche Wendung gibt diese Steigerung natürlich und nachdrücklich wieder.
- source_word: λέγοντες
  choice: und sagten
  rationale: Das Partizip führt die Äußerung ein; die finite Beiordnung ist im modernen Deutschen flüssiger.
- source_word: Καλῶς πάντα πεποίηκεν
  choice: Er hat alles gut gemacht
  rationale: Die Formulierung bewahrt die umfassende Aussage von πάντα, die Qualitätsangabe καλῶς und die durch das Perfekt ausgedrückte vollendete Tat mit gegenwärtiger Bedeutung.
- source_word: τοὺς κωφοὺς ποιεῖ ἀκούειν
  choice: die Gehörlosen bringt er zum Hören
  rationale: ποιεῖ mit Infinitiv ist kausativ. »Zum Hören bringen« gibt dies klar wieder und vermeidet die mögliche deutsche Nebenbedeutung von »jemanden hören lassen«.
- source_word: ἀλάλους λαλεῖν
  choice: die Stummen zum Sprechen
  rationale: Die substantivierte Bezeichnung und der Infinitiv werden knapp und parallel zum ersten Glied wiedergegeben.
- source_word: καὶ … καὶ
  choice: Sogar … und
  rationale: Das erste καί der koordinierten Aussage erhält in der deutschen Satzgestaltung eine hervorhebende Funktion; »sogar« lässt die ganze Wunderbeschreibung als bemerkenswerten Höhepunkt erscheinen, während das zweite Glied mit »und« parallel angeschlossen wird.
theological_decisions:
- issue: Mögliche Anspielung auf Jesaja 35,5–6 und möglicher Nachhall von Schöpfungssprache
  choice: Die Aussage bleibt im Haupttext schlicht und nahe am griechischen Wortlaut; die möglichen Schriftanklänge werden in Fußnoten genannt.
  alternative: »Er hat alle Dinge gut gemacht« könnte einen Schöpfungsanklang formaler bewahren, klingt im heutigen Deutschen jedoch weniger natürlich.
  rationale: Der Text kann sowohl Jesajas Wiederherstellungsbild als auch eine umfassendere Bewertung der Werke Jesu anklingen lassen. Die Übersetzung macht keine dieser Resonanzen zur ausdrücklich behaupteten Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die starke emotionale Reaktion wird idiomatisch wiedergegeben; die direkte Rede bleibt klar, prägnant und für eine öffentliche Bibellesung geeignet.
