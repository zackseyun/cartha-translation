id: MRK.7.21
reference: Mark 7:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: de
  text: 'Denn von innen, aus dem Herzen der Menschen, kommen die bösen Gedanken hervor: sexuelle Verfehlungen, Diebstähle, Morde,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσωθεν
  choice: von innen
  rationale: Bewahrt die räumliche Metapher und den Gegensatz zwischen innerer Quelle und äußerer Verunreinigung im Kontext.
- source_word: γὰρ
  choice: Denn
  rationale: Kennzeichnet den Satz als Begründung der vorhergehenden Aussage.
- source_word: καρδίας
  choice: Herzen
  rationale: Erhält den biblisch-anthropologischen Ausdruck für das innere Zentrum des Denkens, Wollens und moralischen Handelns.
- source_word: ἀνθρώπων
  choice: der Menschen
  rationale: Das griechische Maskulinum bezeichnet hier Menschen allgemein; die deutsche generische Form gibt den Sinn natürlich und genau wieder.
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: die bösen Gedanken
  rationale: Gibt innere Überlegungen oder Gedankengänge mit ihrer ausdrücklich moralisch schlechten Qualität verständlich wieder.
- source_word: ἐκπορεύονται
  choice: kommen … hervor
  rationale: Bewahrt das Bild, dass das Genannte aus dem Inneren herauskommt.
- source_word: πορνεῖαι
  choice: sexuelle Verfehlungen
  rationale: Bezeichnet breit unerlaubte sexuelle Handlungen und wahrt durch den Plural den Charakter der griechischen Aufzählung, ohne den Begriff unnötig einzuengen.
- source_word: κλοπαί
  choice: Diebstähle
  rationale: Natürliche deutsche Pluralform für konkrete Akte des Stehlens.
- source_word: φόνοι
  choice: Morde
  rationale: Gibt die moralisch und rechtlich verwerfliche Tötung genauer wieder als das allgemeinere „Tötungen“.
theological_decisions:
- issue: Generischer Gebrauch von ἀνθρώπων
  choice: der Menschen
  alternative: der Männer
  rationale: Im Kontext ist die gesamte Menschheit gemeint, nicht ausschließlich männliche Personen; „Menschen“ wahrt den generischen Sinn ohne sachliche Verengung.
- issue: Bedeutungsumfang und Numerus von πορνεῖαι
  choice: sexuelle Verfehlungen
  alternative: sexuelle Unmoral
  rationale: Die gewählte pluralische Form spiegelt die Mehrzahl des griechischen Textes und bezeichnet unerlaubte sexuelle Handlungen breit, ohne eine einzelne Kategorie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang eng, bleibt aber idiomatisch; die pluralische Lasteraufzählung wird beibehalten.
