  text: πάντα ταῦτα τὰ πονηρὰ ἔσωθεν ἐκπορεύεται καὶ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/023.yaml
  text: All these evil things come out from within and defile the man[a].
translation:
  language: de
  text: All diese bösen Dinge kommen von innen heraus und machen den Menschen unrein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Menschen“. Das Griechische hat „den Menschen“ im bestimmten Singular und meint damit Menschen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: All diese bösen Dinge
  rationale: Die substantivierte Wortgruppe bezeichnet zusammenfassend die zuvor aufgezählten Laster. „All diese bösen Dinge“ bewahrt Nachdruck, Rückbezug und konkrete Mehrzahl.
- source_word: ἔσωθεν
  choice: von innen heraus
  rationale: Die Wendung gibt den inneren Ursprung wieder und erhält den Gegensatz zwischen äußerer und innerer Verunreinigung im Kontext.
- source_word: ἐκπορεύεται
  choice: kommen … heraus
  rationale: Das griechische Verb steht bei einem sächlichen Subjekt im Plural idiomatisch im Singular. Im Deutschen verlangt das pluralische Subjekt „Dinge“ den Plural; „herauskommen“ gibt die Bewegung vom Inneren nach außen natürlich wieder.
- source_word: κοινοῖ
  choice: machen … unrein
  rationale: Im Reinheitskontext bezeichnet κοινόω das Verunreinigen. „Unrein machen“ ist im modernen Deutsch verständlich und bewahrt den kultisch-moralischen Bedeutungsraum deutlicher als eine bloß moralische Umschreibung.
- source_word: τὸν ἄνθρωπον
  choice: den Menschen
  rationale: „Den Menschen“ entspricht dem generisch gebrauchten Singular von ἄνθρωπος, ist im Deutschen natürlich inklusiv und bewahrt die anthropologische Allgemeingültigkeit der Aussage.
theological_decisions:
- issue: Bedeutung von κοινόω im Zusammenhang von Reinheit und menschlicher Bosheit
  choice: machen den Menschen unrein
  alternative: verunreinigen den Menschen
  rationale: Die analytische Formulierung hält den für den Abschnitt wichtigen Begriff „unrein“ hörbar und lässt die kultische sowie moralische Spannung bestehen.
- issue: Generischer Bezug von τὸν ἄνθρωπον
  choice: den Menschen
  alternative: einen Menschen
  rationale: Der bestimmte Singular greift die wiederholte Formulierung des Zusammenhangs auf und bezeichnet den Menschen repräsentativ, ohne die Aussage auf Männer zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist natürlich, während die Wiederholung von „innen“ und „heraus“ den inneren Ursprung und das Hervortreten der bösen Dinge betont.
