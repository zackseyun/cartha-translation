base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: de
  text: 'Denn Mose sagte: »Ehre deinen Vater und deine Mutter«, und: »Wer Vater oder Mutter beschimpft,[a] muss sterben.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verflucht«; auch: »schmäht« oder »böse über Vater oder Mutter redet«. Das Verb kann beschimpfen, schmähen, übelreden oder verfluchen bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »muss unbedingt sterben« oder »muss getötet werden«. Wörtlich steht eine feierliche Rechtsformel: »muss mit dem Tod sterben«.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς γὰρ εἶπεν
  choice: Denn Mose hat gesagt
  rationale: γάρ begründet Jesu Argument; das deutsche Perfekt ist in gegenwärtiger Standardsprache eine natürliche Form zur Einführung des weiterhin maßgeblichen Schriftworts.
- source_word: Τίμα
  choice: Ehre
  rationale: Der Imperativ bewahrt Gewicht und vertrauten Wortlaut des Gebots, ohne ihn auf bloßen Respekt zu verengen.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: deinen Vater und deine Mutter
  rationale: Beide Objekte und das jeweils zugehörige Possessivverhältnis werden ausdrücklich wiedergegeben.
- source_word: Ὁ κακολογῶν
  choice: Wer … verflucht
  rationale: κακολογέω kann übelreden, beschimpfen oder verfluchen bedeuten. Im Kontext des zitierten Rechtssatzes ist »verfluchen« prägnant und idiomatisch; die weitere Bedeutungsbreite wird in der Fußnote offengehalten.
- source_word: πατέρα ἢ μητέρα
  choice: Vater oder Mutter
  rationale: Die Alternative mit ἤ wird direkt bewahrt; wie im Griechischen wird kein Possessivpronomen ergänzt.
- source_word: θανάτῳ τελευτάτω
  choice: muss des Todes sterben
  rationale: Die feierliche deutsche Rechtsformel bildet die emphatische Todesformel und den verpflichtenden dritten Imperativ ab, ohne ausdrücklich einen Vollstrecker einzutragen.
theological_decisions:
- issue: Wiedergabe der gesetzlichen Strafformel θανάτῳ τελευτάτω
  choice: muss des Todes sterben
  alternative: muss getötet werden / muss unbedingt sterben
  rationale: Die gewählte Form bewahrt den formelhaften, feierlichen Charakter und lässt offen, ob der griechische Wortlaut ausdrücklich als passive Hinrichtungsaussage auszulegen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst schriftgemäßem Klang in den Zitaten. »Des Todes sterben« ist gehoben und formelhaft, aber verständlich; die Fußnote bietet geläufigere Alternativen.
