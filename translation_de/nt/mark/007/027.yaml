  text: ⸂καὶ ἔλεγεν⸃ αὐτῇ· Ἄφες πρῶτον χορτασθῆναι τὰ τέκνα, οὐ γὰρ ⸂καλόν ἐστιν⸃ λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ ⸂τοῖς κυναρίοις βαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: de
  text: 'Und er sagte zu ihr: »Lass zuerst die Kinder satt werden; denn es ist nicht gut, den Kindern das Brot wegzunehmen und es den kleinen Hunden[a] hinzuwerfen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Haushunden«; auch schlicht: »Hunden«. Im Griechischen steht eine Verkleinerungsform, die eher kleine oder zum Haushalt gehörende Hunde als umherstreunende Hunde nahelegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt kann einen andauernden oder wiederholten Vorgang bezeichnen; im Deutschen ist in dieser einzelnen Gesprächsszene jedoch das natürliche Präteritum »sagte« idiomatischer, ohne einen für den Zusammenhang wesentlichen Aspekt zu verlieren.
- source_word: Ἄφες
  choice: Lass
  rationale: Der Imperativ von ἀφίημι bedeutet hier idiomatisch, etwas geschehen zu lassen.
- source_word: πρῶτον
  choice: zuerst
  rationale: »Zuerst« bewahrt die zeitliche Rangfolge und damit die Offenheit für ein späteres Teilhaben anderer.
- source_word: χορτασθῆναι
  choice: satt werden
  rationale: Das Passiv bezeichnet, bis zur Sättigung gespeist zu werden. »Satt werden« ist natürliches Deutsch und erhält das Mahlbild.
- source_word: τὰ τέκνα
  choice: die Kinder
  rationale: Die gewöhnliche Bedeutung bewahrt das familiäre Bild, ohne Alter, Geschlecht oder metaphorische Referenten ausdeutend festzulegen.
- source_word: καλόν ἐστιν
  choice: es ist nicht gut
  rationale: καλόν bezeichnet hier das Gute beziehungsweise Angemessene. »Nicht gut« entspricht dem griechischen Ausdruck unmittelbar und lässt dessen moralische und situative Nuance offen.
- source_word: λαβεῖν τὸν ἄρτον τῶν τέκνων
  choice: den Kindern das Brot wegzunehmen
  rationale: Die deutsche Konstruktion gibt natürlich wieder, dass das Brot den Kindern gehört und ihnen genommen würde; »Brot« erhält das konkrete Haushaltsbild.
- source_word: κυναρίοις
  choice: kleinen Hunden
  rationale: Das Diminutiv κυνάριον legt kleine beziehungsweise zum Haushalt gehörende Hunde nahe. »Kleine Hunde« bildet die Form transparent ab, ohne sie verniedlichend als »Hündchen« oder zu spezifisch als »Welpen« wiederzugeben.
- source_word: βαλεῖν
  choice: hinzuwerfen
  rationale: Das Verb bewahrt die anschauliche Bewegung des Werfens; das im Deutschen ergänzte Pronomen »es« bezieht sich eindeutig auf das Brot.
theological_decisions:
- issue: Metaphorische Bedeutung von »Kinder« und »kleine Hunde«
  choice: Das Haushaltsbild bleibt im Haupttext unausgelegt.
  alternative: »Kinder« ausdrücklich als Israel beziehungsweise Juden und »Hunde« als Nichtjuden wiederzugeben.
  rationale: Der griechische Text nennt die Gruppen nicht ausdrücklich, sondern spricht bildhaft. Die Beibehaltung der Metapher verhindert, dass eine Auslegung in den Wortlaut eingetragen wird.
- issue: Bedeutung von πρῶτον
  choice: Die zeitliche Nuance wird mit »zuerst« ausdrücklich bewahrt.
  alternative: Die Rangfolge zugunsten eines glatteren Satzes wegzulassen.
  rationale: »Zuerst« drückt Vorrang aus, ohne eine spätere Zuwendung an andere auszuschließen, und erhält so die narrative und theologische Spannung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, bildhaftem Ton. »Satt werden« und »hinzuwerfen« klingen natürlich, während die familiäre Metapher und ihre Spannung erhalten bleiben.
