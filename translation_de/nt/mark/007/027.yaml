  source_fidelity: Der Text gibt den griechischen Satz vollständig und treffend wieder. »Lass ... satt werden« entspricht dem imperativischen Ἄφες mit passivischem χορτασθῆναι; »zuerst« bewahrt πρῶτον. »Es ist nicht gut« ist eine angemessene, nicht überinterpretierende Wiedergabe von οὐ γὰρ καλόν ἐστιν. »Den Kindern das Brot wegzunehmen und es den kleinen Hunden hinzuwerfen« erhält Besitzbezug, Kontrast und Bildlichkeit von λαβεῖν ... καὶ τοῖς κυναρίοις βαλεῖν. Das Imperfekt ἔλεγεν wird mit dem im deutschen Erzählstil natürlichen »sagte« vertretbar wiedergegeben.
  naturalness: Modernes Standarddeutsch und ein angemessen würdiger Erzählton. Der Satz ist klar und idiomatisch. »Kleinen Hunden hinzuwerfen« bewahrt die konkrete Bewegung des griechischen Verbs, ohne im Deutschen unnatürlich zu wirken.
  terminology: »Kinder«, »Brot« und »kleine Hunde« bewahren die nicht ausgedeutete Haushaltsmetapher. Die Fußnote benennt zurückhaltend mögliche Nuancen von κυνάρια und macht daraus keine zwingende historische oder theologische Festlegung.
