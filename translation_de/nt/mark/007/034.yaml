id: MRK.7.34
reference: Mark 7:34
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: de
  text: 'Und er blickte zum Himmel auf, seufzte und sagte zu ihm: »Effata!«, das heißt: »Öffne dich!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Aramäisch: »Effata« bedeutet »Öffne dich!« Das mit »seufzte« übersetzte Verb kann auch »stöhnte« bedeuten.'
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: blickte zum Himmel auf
  rationale: Die Formulierung gibt das vorzeitige Begleithandeln des Aoristpartizips und die aufwärts gerichtete Bewegung natürlich und präzise wieder; οὐρανός bezeichnet hier im Zusammenhang der Gebärde den Himmel.
- source_word: ἐστέναξεν
  choice: seufzte
  rationale: στενάζω kann ein Seufzen oder Stöhnen bezeichnen. »Seufzte« wahrt die mögliche emotionale Tiefe, ohne ihre Stärke gegenüber dem griechischen Text festzulegen.
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Das historische Präsens λέγει wird dem natürlichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben; αὐτῷ bleibt als persönliche Anrede erhalten.
- source_word: Εφφαθα
  choice: Effata
  rationale: Der von Markus bewahrte aramäische Ausdruck wird in der im Deutschen geläufigen Transliteration wiedergegeben und anschließend gemäß der Erklärung des Evangelisten übersetzt.
- source_word: Διανοίχθητι
  choice: Öffne dich
  rationale: Der passive Aoristimperativ Singular wird im Deutschen idiomatisch mit dem reflexiven »Öffne dich« wiedergegeben. Das ist natürlicher als »Werde geöffnet« und erhält die direkte Befehlsform.
theological_decisions:
- issue: Bezug von αὐτῷ und Διανοίχθητι
  choice: 'Jesus spricht den Mann persönlich an: »sagte zu ihm … Öffne dich!«'
  alternative: Der Befehl könnte sinngemäß unmittelbar auf Ohren und Sprachvermögen bezogen paraphrasiert werden.
  rationale: Das Dativpronomen bezieht sich am natürlichsten auf den Mann. Die Übersetzung lässt offen, wie der Befehl auf seine beeinträchtigten Fähigkeiten wirkt, statt den Gegenstand ausdrücklich einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parataktische Erzählweise des griechischen Textes bleibt erhalten. Die aramäische Äußerung wird bewahrt; ihre Bedeutung und die lexikalische Spannweite von στενάζω werden knapp in einer Fußnote erläutert.
