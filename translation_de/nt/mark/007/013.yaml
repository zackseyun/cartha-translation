id: MRK.7.13
reference: Mark 7:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀκυροῦντες τὸν λόγον τοῦ θεοῦ τῇ παραδόσει ὑμῶν ᾗ παρεδώκατε· καὶ παρόμοια τοιαῦτα πολλὰ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: de
  text: So setzt ihr das Wort Gottes durch eure Überlieferung außer Kraft, die ihr weitergegeben habt.[a] Und viele andere ähnliche Dinge tut ihr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die ihr überliefert habt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: setzt … außer Kraft
  rationale: Die Wendung gibt das Ungültig- beziehungsweise Wirkungslosmachen natürlich und mit der nötigen Schärfe wieder; das Partizip führt den Vorwurf aus dem vorherigen Zusammenhang fort.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: das Wort Gottes
  rationale: Dies entspricht der griechischen Genitivverbindung unmittelbar und bewahrt den gewichtigen Gegensatz zwischen Gottes Wort und ihrer Überlieferung.
- source_word: τῇ παραδόσει ὑμῶν
  choice: durch eure Überlieferung
  rationale: 'Der Dativ ist hier instrumental: Ihre Überlieferung ist das Mittel, durch das sie Gottes Wort außer Kraft setzen. „Überlieferung“ bildet zudem die Wortverwandtschaft mit dem folgenden Verb gut ab.'
- source_word: ᾗ παρεδώκατε
  choice: die ihr weitergegeben habt
  rationale: Die Formulierung gibt die Weitergabe der Überlieferung idiomatisch wieder, ohne genauer festzulegen, an wen sie übermittelt wurde.
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: viele andere ähnliche Dinge
  rationale: Die Wendung bewahrt den verstärkenden Sinn der teilweise überlappenden griechischen Ausdrücke, klingt aber im modernen Deutschen natürlich.
- source_word: ποιεῖτε
  choice: tut ihr
  rationale: Das Präsens bezeichnet ein gegenwärtiges beziehungsweise wiederholtes Verhalten; das deutsche Präsens lässt diese Reichweite offen.
theological_decisions:
- issue: Charakter der Überlieferung in Jesu Vorwurf
  choice: „eure Überlieferung“ ohne erklärenden Zusatz
  alternative: „eure menschliche Überlieferung“
  rationale: Der Kontext stellt diese Überlieferung Gottes Wort entgegen, doch in diesem Vers steht kein ausdrückliches Wort für „menschlich“. Die Übersetzung bewahrt daher die Aussage und Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Außer Kraft setzen“ ist idiomatisch und präzise; „Überlieferung“ wahrt sowohl den sachlichen Gehalt als auch das Wortspiel mit „überliefert/weitergegeben“.
