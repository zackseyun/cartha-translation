  source_fidelity: 'Die Übersetzung gibt die zentrale Aussage präzise wieder: ἀκυροῦντες als „setzt … außer Kraft“, τὸν λόγον τοῦ θεοῦ als „das Wort Gottes“ und den instrumentalen Dativ τῇ παραδόσει ὑμῶν als „durch eure Überlieferung“. Der Relativsatz „die ihr weitergegeben habt“ entspricht ᾗ παρεδώκατε, ohne ein Objekt der Weitergabe zu ergänzen. „Viele andere ähnliche Dinge“ ist eine idiomatische Wiedergabe der emphatisch überlappenden Wortgruppe παρόμοια τοιαῦτα πολλὰ.'
  naturalness: Modernes Standarddeutsch, klar und angemessen würdig. „So setzt ihr … außer Kraft“ bindet den partizipialen Anschluss verständlich an den vorausgehenden Gedankengang. Die Stellung „tut ihr“ ist leicht gehoben, aber im biblischen Register natürlich und gut verständlich.
  terminology: „Wort Gottes“ und „Überlieferung“ sind sachgerecht und bewahren den im Griechischen angelegten Kontrast sowie die Wortverwandtschaft von παράδοσις und παρεδώκατε. „Überlieferung“ wird nicht unzulässig durch „menschliche Überlieferung“ spezifiziert. Die Fußnote bietet mit „überliefert“ eine echte, passende lexikalische Alternative.
