  terminology: „Heuchler“, „prophezeit“, „ehrt“ und „Herz“ sind sachgerecht und traditionsübergreifend verständlich. „Weit entfernt von mir“ bewahrt die bildhafte relationale Distanz, ohne sie ausdeutend zu präzisieren. Eine Fußnote ist nicht erforderlich, da das Deutsche den kollektivischen Singular idiomatisch abbildet.
