  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes angemessen wieder: den adversativen Übergang („Er aber“), Jesu Rede an die Angesprochenen, die positive Bewertung von Jesajas Prophetie, die direkte Bezeichnung als „Heuchler“, die Schriftzitat-Einleitung sowie die Gegenüberstellung von Lippenbekenntnis und fernem Herzen. Die Singularformen des Zitats werden mit „Dieses Volk … sein Herz“ zutreffend bewahrt.'
