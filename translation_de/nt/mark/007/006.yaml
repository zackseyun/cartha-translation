id: MRK.7.6
reference: Mark 7:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Treffend hat Jesaja über euch Heuchler prophezeit, wie geschrieben steht: ‚Dieses Volk ehrt mich mit den Lippen, doch sein Herz ist weit entfernt von mir.‘“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten Gegensatz beziehungsweise den Übergang zu Jesu Erwiderung; die Nachstellung in „Er aber“ entspricht dem griechischen Erzählstil und bleibt im Deutschen würdig und verständlich.
- source_word: Καλῶς
  choice: treffend
  rationale: Gibt die positive Bewertung der Prophetie natürlich wieder, ohne einseitig nur moralische Richtigkeit oder bloße Genauigkeit zu behaupten.
- source_word: ἐπροφήτευσεν
  choice: hat … prophezeit
  rationale: Ist die direkte, heute geläufige Wiedergabe und wahrt den ausdrücklichen prophetischen Charakter des Jesajazitats.
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: über euch Heuchler
  rationale: Bewahrt die direkte Anwendung auf die Angesprochenen und gibt die appositionelle Bezeichnung als Heuchler ohne Abschwächung wieder.
- source_word: ὡς γέγραπται ὅτι
  choice: 'wie geschrieben steht:'
  rationale: Natürliche deutsche Zitierformel; der Doppelpunkt übernimmt die im Deutschen übliche Einführung des folgenden Schriftworts.
- source_word: Οὗτος ὁ λαὸς
  choice: Dieses Volk
  rationale: Bewahrt Singular und demonstrative Form des griechischen Jesajazitats sowie dessen feierlich-prophetischen Ton.
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: ehrt mich mit den Lippen
  rationale: Gibt τιμάω unmittelbar mit „ehren“ wieder und erhält das konkrete Bild der Lippen.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: doch sein Herz
  rationale: Das deutsche „Volk“ erlaubt einen natürlichen singularischen Rückbezug. So bleibt auch der im Griechischen singularische Kollektivbegriff „Herz“ erhalten.
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: ist weit entfernt von mir
  rationale: Bewahrt das Bild großer Distanz und lässt dessen räumliche wie relationale beziehungsweise geistliche Dimension offen.
theological_decisions:
- issue: Jesu Anwendung von Jesaja 29,13 auf seine Gesprächspartner
  choice: Die direkte Anklage „über euch Heuchler“ und das prophetische „Dieses Volk“ bleiben ungemildert erhalten.
  alternative: Eine verallgemeinernde oder abschwächende Wiedergabe ohne direkte Bezeichnung der Angesprochenen.
  rationale: Der griechische Text wendet das Jesajawort ausdrücklich auf die gegenwärtigen Gesprächspartner an; die Übersetzung bewahrt diese Spannung, ohne sie weiter auszudeuten.
- issue: Bedeutung der Entfernung des Herzens von Gott
  choice: „sein Herz ist weit entfernt von mir“
  alternative: Eine erklärende Wiedergabe wie „innerlich hat es sich von mir abgewandt“.
  rationale: Die bildhafte Aussage bezeichnet relationale beziehungsweise geistliche Distanz, legt deren genaue Art aber nicht näher fest. Die Übersetzung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Zitierstruktur. „Prophezeit“ ist gegenwärtig geläufiger als „geweissagt“, während „Dieses Volk“ und „wie geschrieben steht“ den Ton des Schriftzitats bewahren. Da das Deutsche mit „Volk … sein Herz“ den griechischen Singular natürlich wiedergeben kann, ist keine Fußnote zur Numerusfrage nötig.
