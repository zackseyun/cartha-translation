  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: de
  text: Nichts, was von außen in einen Menschen hineinkommt, kann ihn unrein machen[a]; vielmehr macht das, was aus dem Menschen herauskommt, den Menschen unrein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verunreinigen“. Das griechische Verb bezeichnet hier, jemanden im Sinn der Reinheit unrein zu machen, und kann im Zusammenhang zugleich sittliche Verunreinigung einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: Nichts
  rationale: Das substantivisch gebrauchte Neutrum wird im Deutschen natürlich und genau mit „nichts“ wiedergegeben.
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: was von außen … in einen Menschen
  rationale: „Von außen“ wahrt den räumlichen und rhetorischen Gegensatz zu dem, was anschließend „aus dem Menschen herauskommt“.
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: in einen Menschen hineinkommt
  rationale: Die Relativsatzkonstruktion gibt das auf οὐδέν bezogene Partizip in natürlichem Deutsch wieder; „hineinkommt“ bewahrt die gerichtete Bewegung.
- source_word: δύναται
  choice: kann
  rationale: „Kann“ ist die knappe, idiomatische deutsche Entsprechung für die ausgedrückte Fähigkeit oder Möglichkeit.
- source_word: κοινῶσαι / κοινοῦντα
  choice: unrein machen
  rationale: Im Zusammenhang der Reinheitsdebatte bezeichnet κοινόω das Verunreinigen. „Unrein machen“ erhält den kultischen Bezug und lässt zugleich die im Kontext entfaltete moralische Dimension offen.
- source_word: ἀλλὰ
  choice: vielmehr
  rationale: „Vielmehr“ bringt den starken korrigierenden Gegensatz deutlich zum Ausdruck.
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: das, was aus dem Menschen herauskommt
  rationale: Die deutsche Kollektivform gibt das substantivierte neutrale Pluralpartizip natürlich wieder und bewahrt mit „aus … herauskommt“ den Kontrast zum Hineinkommen.
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: einen Menschen / den Menschen
  rationale: ἄνθρωπος ist hier generisch. „Mensch“ bewahrt im Deutschen den Singular und die repräsentative Aussage ohne eine unnötige Beschränkung auf Männer.
theological_decisions:
- issue: Bedeutung von κοινόω im Streit über Reinheit
  choice: unrein machen
  alternative: verunreinigen; entweihen
  rationale: „Unrein machen“ verankert die Aussage in ihrem Reinheitskontext, ohne sie ausschließlich auf rituelle Unreinheit festzulegen; der folgende Kontext entfaltet auch ihre sittliche Tragweite.
- issue: Generische Bedeutung von ἄνθρωπος
  choice: Mensch
  alternative: Person; Mann
  rationale: „Mensch“ ist im modernen Standarddeutsch die natürliche generische Entsprechung und bewahrt Singular sowie rhetorische Wiederholung.
- issue: Bezug des substantivierten Plurals τὰ … ἐκπορευόμενα
  choice: das, was … herauskommt
  alternative: die Dinge, die … herauskommen
  rationale: Das Griechische bleibt hinsichtlich der konkreten austretenden Dinge zunächst allgemein. Die kollektive deutsche Form erhält diese Offenheit und klingt weniger gegenständlich als „die Dinge“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Bewegungsverben „hineinkommt“ und „herauskommt“ bilden den Gegensatz des griechischen Satzes ab; die Wiederholung von „Mensch“ wahrt seine rhetorische Struktur.
