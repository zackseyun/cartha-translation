id: MRK.7.17
reference: Mark 7:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: de
  text: Und als er, von der Menschenmenge weg, ein Haus betrat, fragten ihn seine Jünger nach dem Gleichnis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Ausspruch“ oder „dem Bildwort“. Das griechische Wort lautet παραβολή (parabolē).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: Als er dann
  rationale: Die temporale Verknüpfung wird in natürlichem deutschem Erzählstil wiedergegeben; „dann“ bewahrt zugleich den markinischen Erzählanschluss von Καί.
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: in ein Haus gegangen war
  rationale: Das artikellose οἶκον wird als „ein Haus“ wiedergegeben. Das Plusquamperfekt macht im deutschen Satz klar, dass das Hineingehen dem Fragen vorausging.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: weg von der Menschenmenge
  rationale: Die Formulierung bezeichnet hier die räumliche Trennung von der Menschenmenge und bleibt nahe an der griechischen Präposition.
- source_word: ἐπηρώτων
  choice: fragten
  rationale: Das Imperfekt kann einen andauernden oder wiederholten Vorgang bezeichnen; im deutschen Erzählzusammenhang ist das einfache Präteritum die natürliche, nicht überbestimmende Wiedergabe.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: Natürliche deutsche Wiedergabe der griechischen Possessivkonstruktion.
- source_word: τὴν παραβολήν
  choice: nach dem Gleichnis
  rationale: „Gleichnis“ entspricht dem üblichen Bedeutungsbereich von παραβολή und bewahrt Markus’ eigene Bezeichnung, ohne die Äußerung enger als bloßen Spruch festzulegen.
theological_decisions:
- issue: Bedeutung von παραβολή bei einer kurzen bildhaften Äußerung
  choice: das Gleichnis
  alternative: der Ausspruch; das Bildwort
  rationale: Die direkte Wiedergabe als „Gleichnis“ erhält die offene Gattungsbezeichnung des griechischen Textes. Eine Festlegung auf „Ausspruch“ oder „Bildwort“ würde den Ausdruck stärker interpretieren, als es der Ausgangstext verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält die Trennung von der Menschenmenge eng mit dem Eintritt in das Haus verbunden; „Menschenmenge“ ist im heutigen Deutsch klarer und natürlicher als das hier missverständliche „Volk“.
