  source_fidelity: Die Grundhandlung ist korrekt wiedergegeben. όμως „sodass sie für sich waren“ verschiebt κατ’ ἰδίαν zu einer resultativen Aussage über beide Personen und ist weniger präzise als „für sich/abseits“. Die Abfolge bei πτύσας wird im Deutschen besser ausdrücklich als vorzeitig markiert.
  naturalness: „Er nahm ihn beiseite, weg von der Menschenmenge“ ist verständlich, aber leicht redundant. „Er nahm ihn aus der Menge beiseite“ ist idiomatischer. „Dann steckte er ihm die Finger in die Ohren“ ist natürlich und anschaulich.
  terminology: „Menschenmenge“, „Ohren“, „spuckte“ und „Zunge“ sind registergerecht. Die Fußnote zur Spuckhandlung bewahrt zutreffend die textliche Zurückhaltung; ihre zeitliche Paraphrase sollte jedoch nicht stärker sein als der Text.
