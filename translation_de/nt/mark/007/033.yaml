base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: de
  text: Er nahm ihn aus der Menge beiseite, für sich.[a] Dann steckte er ihm die Finger in die Ohren; nachdem er gespuckt hatte,[b] berührte er seine Zunge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abseits“; wörtlich: „für sich“.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text sagt nur, dass Jesus spuckte und die Zunge des Mannes berührte; er sagt nicht ausdrücklich, dass Jesus Speichel auf dessen Zunge tat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: Er nahm ihn beiseite, weg von der Menschenmenge
  rationale: Das Partizip bezeichnet die Absonderung des Mannes von der Menge. „Beiseite nehmen“ ist natürliches modernes Deutsch; „weg von der Menschenmenge“ gibt ἀπὸ τοῦ ὄχλου ausdrücklich wieder.
- source_word: κατ’ ἰδίαν
  choice: sodass sie für sich waren
  rationale: Die Wendung bezeichnet ein Handeln abseits beziehungsweise nicht öffentlich. Die Formulierung gibt den adverbialen Sinn natürlich wieder, ohne eine besondere Vertraulichkeit des Gesprächs zu unterstellen.
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: Dann steckte er ihm die Finger in die Ohren
  rationale: In diesem Handlungskontext bedeutet βάλλω „hineintun/stecken“, nicht wörtlich „werfen“. Die deutsche Dativkonstruktion macht natürlich und eindeutig deutlich, dass es die Ohren des Mannes sind.
- source_word: πτύσας
  choice: spuckte
  rationale: Das Aoristpartizip bezeichnet eine der Berührung vorausgehende oder eng mit ihr verbundene Handlung. Die koordinierte deutsche Verbform wahrt die knappe Erzählweise und fügt kein Ziel des Spuckens hinzu.
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: berührte seine Zunge
  rationale: ἅπτομαι mit Genitiv bedeutet hier „berühren“. Aus dem Zusammenhang ist klar, dass die Zunge des Mannes gemeint ist.
theological_decisions:
- issue: Beschreibung von Jesu Heilungsgeste
  choice: Die körperlichen Handlungen werden sachlich wiedergegeben; insbesondere bleibt offen, ob Speichel auf die Zunge gelangte.
  alternative: Ausdrücklich sagen, Jesus habe Speichel auf die Zunge des Mannes getan.
  rationale: Der griechische Text sagt lediglich, dass Jesus spuckte und die Zunge berührte. Ziel, Verwendung und Bedeutung des Speichels werden nicht ausdrücklich genannt und dürfen daher nicht ergänzend festgelegt werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die konkreten Körperhandlungen bleiben anschaulich; unnötige Fachsprache und interpretierende Zusätze werden vermieden.
