  - severity: low
    issue: Unmittelbare Reihung „spuckte und berührte“
    rationale: Das Aoristpartizip πτύσας kann im Deutschen knapp als „nachdem er gespuckt hatte“ wiedergegeben werden. Dies bildet die im englischen Audit Trail hervorgehobene Vorzeitigkeit klar ab, ohne zu behaupten, wohin der Speichel gelangte.
