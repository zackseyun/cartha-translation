source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Seid auch ihr so verständnislos? Begreift ihr nicht, dass nichts, was von außen in den Menschen hineinkommt, ihn unrein machen kann[a],«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihn verunreinigen kann«. Das griechische Wort hat in diesem Zusammenhang besonders den Sinn kultischer Unreinheit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: er sagte
  rationale: Das griechische historische Präsens wird für einen natürlichen deutschen Erzählstil im Präteritum wiedergegeben.
- source_word: Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε
  choice: Seid auch ihr so verständnislos?
  rationale: Die Wortstellung gibt den vorwurfsvollen Nachdruck von οὕτως, καί und ὑμεῖς idiomatisch wieder; »verständnislos« bezeichnet fehlende Einsicht, ohne unnötig abwertend zu klingen.
- source_word: οὐ νοεῖτε
  choice: Begreift ihr nicht
  rationale: »Begreifen« bezeichnet hier das geistige Erfassen und vermeidet eine schwerfällige unmittelbare Wiederholung von »Verständnis«.
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: nichts, was von außen ... hineinkommt
  rationale: Die Umformung der griechischen Aussage »alles ... kann nicht« zu »nichts ... kann« ist im Deutschen natürlich und bewahrt den umfassenden Sinn; »von außen« gibt ἔξωθεν ausdrücklich wieder.
- source_word: εἰς τὸν ἄνθρωπον
  choice: in den Menschen
  rationale: Der Singular mit Artikel wird als generische Bezeichnung des Menschen beibehalten und meint hier den Menschen allgemein.
- source_word: κοινῶσαι
  choice: unrein machen
  rationale: Im Zusammenhang der Reinheitsvorschriften bezeichnet κοινόω das Versetzen in einen unreinen, besonders kultisch unreinen Zustand; »unrein machen« erhält diesen Kontext deutlicher als das stärker moralisch klingende »beflecken«.
theological_decisions:
- issue: Reinheitsterminologie bei κοινόω
  choice: unrein machen
  alternative: beflecken / entweihen
  rationale: Die Formulierung wahrt den unmittelbaren Bezug zur Reinheitsfrage, ohne die Unreinheit ausschließlich als moralisch oder ausschließlich als kultisch festzulegen.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Standardsprache. Der vorwurfsvolle Fragesatz bleibt erhalten. Der Vers bildet syntaktisch eine in sich verständliche Aussage, steht im griechischen Zusammenhang jedoch in enger Verbindung mit dem folgenden Vers.
