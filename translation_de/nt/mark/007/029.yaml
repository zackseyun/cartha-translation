  terminology: »Dämon« ist die angemessene Wiedergabe von τὸ δαιμόνιον. Die Revision schwächt die Aussage weder zu Krankheit noch zu einem unpersönlichen Einfluss ab. Die Fußnote hält die näher am griechischen Ausdruck orientierte Formulierung als Alternative fest.
