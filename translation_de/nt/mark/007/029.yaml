  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: de
  text: 'Und er sagte zu ihr: »Weil du das gesagt hast[a], geh: Der Dämon hat deine Tochter verlassen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Wegen dieses Wortes.«'
    reason: Διὰ τοῦτον τὸν λόγον bezeichnet den Grund und verweist auf die unmittelbar vorausgehende Äußerung der Frau.
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῇ
  choice: Und er sagte zu ihr
  rationale: Die Formulierung gibt die schlichte narrative Verbindung mit καί wieder, ohne eine stärkere zeitliche Folgerung hineinzulesen.
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: Wegen dieses Wortes
  rationale: διά mit Akkusativ bezeichnet hier den Grund; λόγος verweist auf die unmittelbar vorausgehende Äußerung der Frau. Die Wiedergabe bewahrt den Singular und die kausale Aussage des Griechischen.
- source_word: ὕπαγε
  choice: geh!
  rationale: Der Imperativ dient hier als knappe Entlassungsaufforderung. »Geh!« ist im modernen Deutschen klar und fügt dem griechischen Ausdruck nichts hinzu.
- source_word: ἐξελήλυθεν
  choice: ist ausgefahren
  rationale: Das Perfekt bezeichnet ein vollzogenes Geschehen mit fortbestehendem Ergebnis. »Ist ausgefahren« bewahrt zugleich die im Kontext einer Dämonenaustreibung geläufige räumliche Bildsprache.
- source_word: ἐκ τῆς θυγατρός σου
  choice: aus deiner Tochter
  rationale: ἐκ bezeichnet die Person, aus der der Dämon herausgegangen ist. »Aus deiner Tochter« bildet diese räumliche Aussage direkt und idiomatisch ab.
- source_word: τὸ δαιμόνιον
  choice: der Dämon
  rationale: δαιμόνιον bezeichnet hier ausdrücklich einen Dämon. Die direkte Wiedergabe vermeidet sowohl eine Abschwächung als auch die Eintragung des anderslautenden Ausdrucks »unreiner Geist«.
theological_decisions:
- issue: Übernatürliche Aussage der Dämonenaustreibung
  choice: Der Dämon ist aus deiner Tochter ausgefahren.
  alternative: Der böse Geist hat deine Tochter verlassen.
  rationale: Der griechische Text nennt ausdrücklich ein δαιμόνιον und beschreibt dessen Herausgehen aus der Tochter. Die Übersetzung bewahrt diese personale und übernatürliche Aussage, ohne sie als Krankheit oder bloßen Einfluss umzudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markierte Wendung »wegen dieses Wortes« hält sich eng an die griechische Formulierung; die Fußnote bietet die natürlichere sinngemäße Alternative. »Ausgefahren« bewahrt die biblische Exorzismussprache, bleibt aber allgemein verständlich.
