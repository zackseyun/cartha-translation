  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: de
  text: 'Ihr aber sagt: »Wenn jemand zu seinem Vater oder seiner Mutter sagt: ›Korban‹[a] – das heißt: eine Gabe[b] –, was auch immer dir von mir zugutekommen könnte …«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Korban“ bezeichnet etwas, das Gott als Gabe geweiht und dadurch dem gewöhnlichen Gebrauch innerhalb der Familie entzogen wurde.
    reason: cultural_note
  - marker: b
    text: 'Oder: „eine Opfergabe“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Ihr aber sagt
  rationale: Das betonte ὑμεῖς und das kontrastierende δὲ werden durch „Ihr aber“ wiedergegeben; das Präsens λέγετε bezeichnet die von Jesus kritisierte gängige Aussage beziehungsweise Lehre.
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: Wenn jemand … sagt
  rationale: Ἐὰν mit Aorist Konjunktiv bezeichnet einen möglichen Fall. „Wenn … sagt“ ist im Deutschen idiomatisch; „jemand“ gibt das hier allgemein und stellvertretend gebrauchte ἄνθρωπος natürlich wieder.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: zu seinem Vater oder seiner Mutter
  rationale: Der Dativ bezeichnet die angesprochenen Personen. Die ausgewogene Nennung beider Elternteile bleibt erhalten.
- source_word: Κορβᾶν
  choice: Korban
  rationale: Der griechische Text bewahrt das semitische Lehnwort und erklärt es anschließend selbst. Die Transliteration erhält den historischen und religiösen Charakter des Ausdrucks.
- source_word: ὅ ἐστιν Δῶρον
  choice: 'das heißt: eine Gabe'
  rationale: Markus erläutert den semitischen Ausdruck. „Gabe“ ist die direkte, im Kontext kultisch deutbare Entsprechung von δῶρον; „Opfergabe“ bleibt als Alternative in der Fußnote erhalten.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: was auch immer dir von mir zugutegekommen wäre
  rationale: Das Relativpronomen mit ἐὰν hat verallgemeinernden Sinn („was auch immer“). Die passive Form von ὠφελέω wird mit „dir … zugutegekommen“ wiedergegeben, ohne die mögliche materielle oder sonstige Unterstützung enger festzulegen. Die Auslassungspunkte zeigen an, dass der Satz in Vers 12 syntaktisch weitergeführt wird.
theological_decisions:
- issue: Wiedergabe der Korban-Formel im Zusammenhang einer Gott geweihten Gabe und menschlicher Überlieferung
  choice: '„Korban“ im Haupttext beibehalten und mit „das heißt: eine Gabe“ erklären'
  alternative: Den Ausdruck unmittelbar als „Opfergabe“ oder „Gott geweihte Gabe“ übersetzen
  rationale: Der Ausgangstext übernimmt selbst den semitischen Fachausdruck und fügt eine Erklärung hinzu. Diese Struktur wird bewahrt, ohne über den Wortlaut hinaus eine bestimmte spätere Auffassung über Gelübde oder Tempelpraxis einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; „jemand“ ist die natürliche generische Wiedergabe von ἄνθρωπος. Die bewusst unvollständige Konstruktion am Versende bleibt erhalten, da erst Vers 12 den Satz fortführt.
