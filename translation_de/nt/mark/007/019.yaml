  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: de
  text: Denn es gelangt nicht in sein Herz, sondern in den Magen, und geht in die Latrine hinaus« – und so werden alle Speisen gereinigt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Schluss ist syntaktisch umstritten. Er kann als erklärender Einschub verstanden werden: »Damit erklärte Jesus alle Speisen für rein.« Er kann auch auf den Verdauungsvorgang bezogen werden: »alle Speisen reinigend« bzw. »wodurch alle Speisen ausgeschieden werden«.'
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: Herz
  rationale: Die wörtliche Wiedergabe bewahrt den Gegensatz zwischen dem Inneren des Menschen und dem Verdauungstrakt, ohne ihn als »Verstand« oder »Inneres« auszudeuten.
- source_word: κοιλίαν
  choice: Magen
  rationale: Im Zusammenhang der Verdauung ist »Magen« im heutigen Deutsch natürlicher und genauer als das allgemeinere »Bauch«.
- source_word: ἀφεδρῶνα
  choice: Latrine
  rationale: Das Wort bezeichnet den Ort der Ausscheidung. »Latrine« ist konkret und würdevoll; »Kanalisation« würde eine nicht vorauszusetzende Infrastruktur nahelegen.
- source_word: καθαρίζων
  choice: und so reinigt er
  rationale: Die Übersetzung bleibt nahe am Partizip »reinigend« und gibt seine folgernde Beziehung zum vorangehenden Satz wieder. Das Subjekt bleibt im Deutschen durch »er« ebenso deutungsoffen, wie es die umstrittene griechische Konstruktion zulässt.
- source_word: βρώματα
  choice: alle Speisen
  rationale: »Speisen« gibt den griechischen Plural wieder und passt zur Frage nach verschiedenen essbaren Dingen und ihrer Reinheit.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Pronomen verweist auf den zuvor besprochenen Menschen; die repräsentative maskuline Einzahl entspricht der Satzführung.
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: gelangt / geht hinaus
  rationale: Die Bewegungsrichtung beim Aufnehmen und Ausscheiden wird schlicht und idiomatisch bewahrt.
theological_decisions:
- issue: Deutung von καθαρίζων πάντα τὰ βρώματα
  choice: »und so reinigt er alle Speisen« als bewusst zurückhaltende Wiedergabe
  alternative: 'Erzählerischer Einschub: »Damit erklärte er alle Speisen für rein«; oder physiologisch: »wodurch alle Speisen ausgeschieden werden«'
  rationale: Das maskuline Partizip kann als erklärender Kommentar des Markus mit Bezug auf Jesus verstanden werden, doch auch eine Anbindung an den Verdauungsvorgang wird vertreten. Der Haupttext vermeidet das stärker interpretierende »erklärte ... für rein« und bewahrt mit »reinigt« die sprachliche und theologische Spannung; die Fußnote nennt die wesentlichen Deutungen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevoller, konkreter Ausdrucksweise. Die etwas ungewöhnliche Formulierung »reinigt er alle Speisen« ist bewusst quellennah und erhält die syntaktische Mehrdeutigkeit des griechischen Partizips.
