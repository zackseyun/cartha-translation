review_pass:
  verdict: revise
  source_fidelity: Der Entwurf trifft Herz, Magen, Latrine und Speisen grundsätzlich gut. Die Wiedergabe „und so reinigt er“ fügt jedoch ein maskulines Subjekt („er“) ein und legt damit stärker als der griechische, syntaktisch umstrittene Partizipialausdruck auf Jesus fest. Die umstrittene Schlusswendung sollte im Deutschen ohne ein hinzugefügtes persönliches Subjekt wiedergegeben und durch eine passend verankerte Anmerkung erläutert werden.
  naturalness: „Denn es gelangt nicht …“ ist modernes, verständliches Deutsch. Die passive, subjektneutrale Formulierung „und so werden alle Speisen gereinigt“ ist zwar leicht markiert, aber als bewusst knappe Wiedergabe des schwierigen Schlussglieds gut lesbar und weniger irreführend als „reinigt er“.
  terminology: „Herz“, „Magen“, „Latrine“ und „Speisen“ sind sachgerecht. „Latrine“ wahrt einen konkreten, würdevollen Registerton. Die Fußnote soll an der tatsächlich erläuterten Schlussphrase stehen, nicht bei „Latrine“.
  issues:
  - severity: medium
    issue: Hinzugefügtes Subjekt in „und so reinigt er alle Speisen“
    rationale: Das griechische καθαρίζων ist ein maskulines Partizip mit umstrittener syntaktischer Anbindung. Das deutsche „er“ macht Jesus zum ausdrücklichen Subjekt und verengt dadurch die im Ausgangstext und in der englischen Auditspur bewahrte Mehrdeutigkeit.
  - severity: medium
    issue: Fußnotenanker steht bei „Latrine“ statt bei der Schlusswendung
    rationale: Die Anmerkung behandelt καθαρίζων πάντα τὰ βρώματα, nicht ἀφεδρών. Der Anker muss an „gereinigt“ bzw. der Schlussphrase stehen.
  - severity: low
    issue: Physiologische Alternative in der Fußnote zu frei formuliert
    rationale: „ausgeschieden werden“ erläutert eine vertretene Deutung, gibt aber nicht unmittelbar die Bedeutung von καθαρίζων wieder. Die Anmerkung sollte zuerst die wörtlichere Alternative „alle Speisen reinigend“ nennen und die physiologische Deutung als Erklärung ergänzen.
  revised_text: Denn es gelangt nicht in sein Herz, sondern in den Magen, und geht in die Latrine hinaus« – und so werden alle Speisen gereinigt[a].
