  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des griechischen Textes zuverlässig wieder: Das Beiseitelassen des Gebots Gottes steht dem entschiedenen Festhalten an menschlicher Überlieferung gegenüber. „Außer Acht lassen“ ist für ἀφέντες eine angemessene, nicht übersteigerte Wiedergabe; die präsentische deutsche Form beschreibt den vorgeworfenen Sachverhalt idiomatisch.'
  naturalness: Der Satz ist knapp, klar und modernes Standarddeutsch. „An der Überlieferung der Menschen festhalten“ ist eine natürliche und dem Kontext angemessene Verbindung. Das ausdrücklich gesetzte „Ihr“ passt zur direkten Anrede und wirkt nicht störend.
  terminology: „Gebot Gottes“ entspricht ἐντολὴ τοῦ θεοῦ; „Überlieferung der Menschen“ gibt παράδοσις τῶν ἀνθρώπων präzise wieder und erhält den Gegensatz zwischen Gott und Menschen. „Menschen“ ist gegenüber dem generischen griechischen ἀνθρώπων sachgerecht. Eine Fußnote ist nicht erforderlich, da im Deutschen keine vergleichbare geschlechtsspezifische Mehrdeutigkeit entsteht.
