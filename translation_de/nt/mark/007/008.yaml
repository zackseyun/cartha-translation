  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: de
  text: Ihr lasst das Gebot Gottes außer Acht und haltet an der Überlieferung der Menschen fest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες
  choice: Ihr lasst … außer Acht
  rationale: Das Aoristpartizip bezeichnet das Beiseitelassen des göttlichen Gebots in Verbindung mit dem folgenden Hauptverb. „Außer Acht lassen“ gibt den Vorwurf natürlich und deutlich wieder, ohne ihn durch „aufgeben“ oder „verwerfen“ unnötig zu verschärfen.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: das Gebot Gottes
  rationale: „Gebot“ ist die geläufige und religiös angemessene Wiedergabe von ἐντολή; der Genitiv bezeichnet Gott als Ursprung beziehungsweise Urheber des Gebots.
- source_word: κρατεῖτε
  choice: haltet … fest
  rationale: κρατέω bezeichnet hier ein entschiedenes Festhalten. Die getrennte deutsche Verbform „haltet … fest“ bewahrt diese Stärke und klingt zugleich idiomatisch.
- source_word: τὴν παράδοσιν
  choice: an der Überlieferung
  rationale: „Überlieferung“ bezeichnet hier eine weitergegebene menschliche Tradition und passt zum religiösen Streitgespräch. Die Präposition „an“ wird durch die idiomatische deutsche Verbindung „an etwas festhalten“ verlangt.
- source_word: τῶν ἀνθρώπων
  choice: der Menschen
  rationale: ἄνθρωποι meint hier Menschen allgemein, nicht speziell männliche Personen. „Der Menschen“ bewahrt den scharfen Gegensatz zwischen menschlicher Überlieferung und Gottes Gebot.
theological_decisions:
- issue: Gegensatz zwischen Gottes Gebot und menschlicher Überlieferung
  choice: Der Haupttext stellt „das Gebot Gottes“ und „die Überlieferung der Menschen“ unmittelbar gegenüber.
  alternative: „Menschliche Überlieferung“ oder „Tradition der Menschen“
  rationale: Die Genitivformulierungen spiegeln die Gegenüberstellung des griechischen Textes klar wider. Der Vers kritisiert hier die Missachtung des göttlichen Gebots zugunsten menschlicher Überlieferung, ohne damit jede Form von Überlieferung pauschal zu verurteilen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural wird durch „Ihr“ ausdrücklich gemacht, obwohl sie im Griechischen in der Verbform enthalten ist. Der Satz bleibt knapp und bewahrt die rhetorische Gegenüberstellung des Originals.
