  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: de
  text: Und er befahl ihnen, niemandem davon zu erzählen. Doch je mehr er es ihnen einschärfte, desto mehr verkündeten sie es.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Doch je eindringlicher er es ihnen einschärfte, umso mehr verkündeten sie es.“'
    reason: Die griechische Korrelativkonstruktion ὅσον … μᾶλλον περισσότερον kann die Steigerung mit „je mehr … desto mehr“ oder „je eindringlicher … umso mehr“ ausdrücken.
lexical_decisions:
- source_word: διεστείλατο
  choice: befahl
  rationale: Das Verb bezeichnet hier eine nachdrückliche Weisung. „Befahl“ gibt deren verbindlichen Charakter in natürlichem, modernem Deutsch wieder, ohne eine zusätzliche Deutung einzutragen.
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: niemandem davon zu erzählen
  rationale: Die Konstruktion nennt den Inhalt des Befehls. „Davon“ bezeichnet kontextgemäß das Geschehene und macht die im Griechischen nur implizite Mitteilung idiomatisch verständlich.
- source_word: ὅσον ... αὐτοῖς διεστέλλετο
  choice: je mehr er es ihnen einschärfte
  rationale: Das Imperfekt und ὅσον ergeben eine fortgesetzte beziehungsweise steigernde Gegenüberstellung. „Einschärfte“ vermeidet eine monotone Wiederholung von „befahl“ und bewahrt den Nachdruck der Weisung.
- source_word: μᾶλλον περισσότερον
  choice: desto mehr
  rationale: Die gehäuften Vergleichsadverbien verstärken die Zunahme. Die deutsche Korrelativform „je mehr … desto mehr“ gibt diese Steigerung natürlich wieder; eine Fußnote weist auf die auch mögliche Wiedergabe „umso mehr“ hin.
- source_word: ἐκήρυσσον
  choice: verkündeten sie es
  rationale: κηρύσσω bezeichnet öffentliches Bekanntmachen oder Ausrufen. „Verkündeten“ wahrt diesen öffentlichen Charakter; „es“ ergänzt im Deutschen den aus dem Kontext erschlossenen Inhalt.
theological_decisions:
- issue: Schweigegebot und seine Missachtung
  choice: Das Verbot wird als wirklicher, nachdrücklicher Befehl wiedergegeben, dem die Beteiligten durch ihr öffentliches Verkünden zuwiderhandelten.
  alternative: Den Grund des Schweigegebots zu erklären oder mit einer bestimmten Theorie des sogenannten Messiasgeheimnisses zu verbinden.
  rationale: Der Vers nennt keinen Grund für den Befehl. Die Übersetzung bewahrt daher die Spannung zwischen Jesu Weisung und der Reaktion der Menschen, ohne sie theologisch aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Der erste Satz bleibt knapp und verbindlich; der zweite bildet die griechische Steigerung idiomatisch ab. Der Fußnotenmarker [a] steht im Haupttext.
