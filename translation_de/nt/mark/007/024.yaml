  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: de
  text: Von dort brach Jesus auf und ging in das Gebiet von Tyrus.[a] Er ging in ein Haus und wollte, dass niemand davon erfuhr;[b] doch er konnte nicht unbemerkt bleiben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Landstrich von Tyrus“. Das griechische Wort kann das Gebiet beziehungsweise die Grenzregion bezeichnen, nicht nur die Grenzlinie.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Er wollte, dass niemand erfuhr“. Was niemand erfahren sollte, bleibt im Griechischen unausgesprochen; gemeint ist seine Anwesenheit oder sein Aufenthaltsort.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „doch es gelang ihm nicht, verborgen zu bleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: Von dort
  rationale: Ἐκεῖθεν bezeichnet den Ausgangspunkt der Bewegung; das leicht weiterführende δέ wird im natürlichen deutschen Erzählfluss nicht eigens wiedergegeben.
- source_word: ἀναστὰς
  choice: brach Jesus auf
  rationale: Das Partizip leitet idiomatisch die nächste Handlung ein. „Aufbrechen“ gibt hier den Beginn des Ortswechsels natürlich wieder; der Name Jesus macht das im Griechischen implizite Subjekt für einen einzeln gelesenen Vers klar.
- source_word: ἀπῆλθεν
  choice: ging
  rationale: ἀπέρχομαι bezeichnet das Fortgehen. Zusammen mit „brach … auf“ ist „ging“ präzise und vermeidet die schwerfällige Doppelung „brach auf und ging fort“.
- source_word: εἰς τὰ ὅρια Τύρου
  choice: in das Gebiet von Tyrus
  rationale: ὅρια kann Grenzen, Gebiet oder Landstrich bezeichnen. Im Kontext ist das zu Tyrus gehörende Gebiet gemeint, nicht zwingend nur eine Grenzlinie.
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: Er ging in ein Haus
  rationale: Das Partizip bezeichnet die nächste Handlung; οἰκίαν ist ohne Artikel und wird daher als „ein Haus“ wiedergegeben.
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: wollte, dass niemand davon erfuhr
  rationale: Der Gegenstand des Wissens bleibt im Griechischen unausgesprochen und bezieht sich auf Jesu Anwesenheit beziehungsweise Aufenthaltsort. „Davon“ wahrt diese Unbestimmtheit in idiomatischem Deutsch.
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: doch er konnte nicht unbemerkt bleiben
  rationale: λανθάνω bedeutet hier, der Wahrnehmung zu entgehen. „Doch“ bringt den sachlichen Gegensatz zu seinem Wunsch zum Ausdruck.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Erzählfluss. Die Wiederholung von „Jesus“ statt eines bloßen Pronomens dient der Verständlichkeit des einzeln präsentierten Verses. Die implizite Aussage nach γνῶναι wird nicht auf einen bestimmten Inhalt verengt.
