  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: de
  text: Und seine Ohren[a] wurden geöffnet, und die Fessel seiner Zunge wurde gelöst[b], und er sprach deutlich[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Hörvermögen“. Das griechische Wort kann sowohl die Ohren als auch die Fähigkeit zu hören bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Fessel seiner Zunge wurde gelöst“; gemeint ist, dass seine Sprachbehinderung beseitigt wurde.'
    reason: lexical_clarification
  - marker: c
    text: 'Oder: „richtig“ oder „verständlich“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: wurden geöffnet
  rationale: Der Aorist Passiv wird ausdrücklich passiv wiedergegeben und bezeichnet die plötzlich bewirkte Wiederherstellung des Hörens.
- source_word: αἱ ἀκοαί
  choice: seine Ohren
  rationale: Das griechische Wort kann sowohl die Ohren als auch das Hörvermögen bezeichnen. Der Plural und der konkrete Heilungszusammenhang sprechen im Deutschen für die natürliche Wiedergabe „Ohren“.
- source_word: ἐλύθη
  choice: wurde gelöst
  rationale: Die passive Form und das Bild des Lösens einer Fessel bleiben erhalten; zugleich ist die Formulierung in modernem Deutsch verständlich.
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: die Fessel seiner Zunge
  rationale: „Fessel“ bewahrt die konkrete Metapher von δεσμός, statt sie bereits als „Sprachbehinderung“ auszudeuten.
- source_word: ἐλάλει
  choice: er sprach
  rationale: Das Imperfekt bezeichnet hier die nun ausgeübte Fähigkeit zu sprechen. „Er sprach“ ist im deutschen Erzählstil natürlich, ohne den nicht ausdrücklich vorhandenen Beginn stärker zu betonen.
- source_word: ὀρθῶς
  choice: deutlich
  rationale: Im Zusammenhang der Heilung bezeichnet das Adverb verständliches, richtig funktionierendes Sprechen. „Deutlich“ vermittelt diesen Sinn natürlicher als das möglicherweise grammatisch oder moralisch verstandene „richtig“.
theological_decisions:
- issue: Wörtliche oder ausdeutende Wiedergabe der Heilung der Sprache
  choice: Das Bild „die Fessel seiner Zunge wurde gelöst“ bleibt im Haupttext erhalten.
  alternative: „Seine Sprachbehinderung wurde beseitigt“ oder „seine Zunge wurde frei“.
  rationale: Der griechische Text beschreibt die wunderbare Heilung mit einer konkreten Metapher. Deren Bewahrung vermeidet eine unnötige klinische oder theologische Ausdeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Reihung mit „und“ folgt dem schlichten Erzählrhythmus des griechischen Textes; die bildhafte Rede von der „Fessel“ bleibt bewusst erhalten.
