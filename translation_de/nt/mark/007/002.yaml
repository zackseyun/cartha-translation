  source_fidelity: 'Die Übersetzung gibt die Konstruktion und den Sinn des griechischen Textes zuverlässig wieder: τινάς τῶν μαθητῶν αὐτοῦ als „einige seiner Jünger“, ὅτι als Inhaltssatz, κοιναῖς χερσίν im Reinheitskontext als „mit unreinen Händen“, die markinische Erläuterung τοῦτ’ ἔστιν ἀνίπτοις sowie das Essen von Brot. „Als sie sahen“ ist eine natürliche Wiedergabe des einleitenden Aoristpartizips und bewahrt den absichtlich fortlaufenden Satzanschluss.'
  naturalness: Modernes Standarddeutsch, klar und angemessen würdig. „Mit unreinen Händen, das heißt mit ungewaschenen Händen“ ist idiomatisch und verständlich. Der abschließende Gedankenstrich ist angesichts des im folgenden Kontext fortgesetzten Satzes sachgerecht.
  terminology: „Unrein“ trifft den rituellen Sinn von κοινός hier besser als eine wörtliche, im Deutschen missverständliche Wiedergabe wie „gewöhnlich“ oder „gemein“. Die Fußnote bewahrt die wörtliche Nuance und grenzt rituelle Unreinheit zutreffend von bloßem Schmutz ab. Dies entspricht auch dem englischen Audit, das den kultisch-reinheitsrechtlichen Sinn gegenüber einer rein hygienischen Lesart hervorhebt.
