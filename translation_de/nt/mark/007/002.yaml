id: MRK.7.2
reference: Mark 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἰδόντες τινὰς τῶν μαθητῶν αὐτοῦ ⸂ὅτι κοιναῖς χερσίν, τοῦτ’ ἔστιν ἀνίπτοις, ἐσθίουσιν⸃ ⸀τοὺς ⸀ἄρτους—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/002.yaml
  text: and they saw that some of his disciples were eating the bread with defiled hands—that is[a], unwashed hands—
translation:
  language: de
  text: Und als sie sahen, dass einige seiner Jünger mit unreinen[a] Händen, das heißt mit ungewaschenen Händen, Brot aßen –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »gewöhnlichen« Händen; gemeint ist rituelle Unreinheit, nicht lediglich sichtbarer Schmutz.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: als sie sahen
  rationale: Das Aoristpartizip leitet den zeitlichen Umstand ein, der in Vers 5 zum Fragen der Pharisäer und Schriftgelehrten führt. Die finite deutsche Nebensatzform ist natürlich und bewahrt den Zusammenhang der griechischen Konstruktion.
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: einige seiner Jünger
  rationale: τινάς mit partitivem Genitiv bezeichnet eine unbestimmte Teilmenge der Jünger.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι führt hier den Inhalt der Wahrnehmung ein, nicht deren Ursache.
- source_word: κοιναῖς χερσίν
  choice: mit unreinen Händen
  rationale: κοινός bedeutet in diesem jüdischen Reinheitszusammenhang kultisch beziehungsweise rituell unrein. Das wörtliche deutsche »mit gewöhnlichen/gemeinen Händen« wäre missverständlich und unnatürlich; »unrein« gibt den kontextuellen Sinn verständlich wieder.
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: das heißt mit ungewaschenen Händen
  rationale: Markus erläutert den vorausgehenden Reinheitsausdruck. Die Wiederholung von »Händen« macht die Erklärung im Deutschen eindeutig und flüssig.
- source_word: ἐσθίουσιν
  choice: aßen
  rationale: Das griechische Präsens bezeichnet die beobachtete, gerade stattfindende Handlung; das deutsche Präteritum fügt sich natürlich in die Erzählung ein.
- source_word: τοὺς ἄρτους
  choice: Brot
  rationale: Der griechische Plural kann Brot beziehungsweise die bei der Mahlzeit gegessenen Brote bezeichnen. Das kollektive deutsche »Brot« ist hier idiomatisch; der Artikel muss im Deutschen in dieser Wendung nicht wiedergegeben werden.
theological_decisions:
- issue: Reinheitssprache bei κοινός
  choice: unrein
  alternative: gewöhnlich; gemein; entweiht
  rationale: Gemeint ist nicht bloß sichtbarer Schmutz, sondern ein Verstoß gegen rituelle Reinheitspraxis. »Unrein« vermittelt diesen Sinn, während die unmittelbar folgende Erklärung »ungewaschen« die konkrete Praxis benennt. Eine Fußnote bewahrt die ungewöhnliche wörtliche Bedeutung und schützt vor einer rein hygienischen Lesart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich bleibt stehen, weil die Konstruktion nach den erklärenden Versen 3–4 in Vers 5 fortgeführt wird. Die Formulierung wahrt daher bewusst den offenen Satzbau des griechischen Textes.
