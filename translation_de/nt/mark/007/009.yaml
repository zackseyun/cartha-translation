  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Geschickt setzt ihr Gottes Gebot außer Kraft, damit ihr eure Überlieferung bewahrt[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Trefflich setzt ihr Gottes Gebot außer Kraft, um eure Überlieferung zu bewahren.« Das griechische Adverb ist hier ironisch gemeint, nicht anerkennend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Der Imperfekt kann einen fortlaufenden Redegang markieren; im natürlichen deutschen Erzählstil wird er hier idiomatisch mit dem Präteritum wiedergegeben.
- source_word: Καλῶς
  choice: geschickt
  rationale: Das Adverb ist im Zusammenhang ironisch. »Geschickt« vermittelt den scharfen Vorwurf, ohne wie eine echte Anerkennung zu klingen.
- source_word: ἀθετεῖτε
  choice: setzt … außer Kraft
  rationale: Die Wendung gibt das bewusste Aufheben oder Unwirksammachen des göttlichen Gebots deutlich wieder und bildet einen starken Gegensatz zu τηρήσητε.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: Gottes Gebot
  rationale: Die kompakte Genitivkonstruktion ist natürliches modernes Deutsch und bewahrt das Gewicht göttlicher Autorität.
- source_word: ἵνα
  choice: damit
  rationale: »Damit« wahrt die mögliche Zweck- beziehungsweise Folgerelation der griechischen Konstruktion, ohne sie unnötig festzulegen.
- source_word: τὴν παράδοσιν ὑμῶν
  choice: eure Überlieferung
  rationale: »Überlieferung« bezeichnet hier das von Menschen Weitergegebene und stellt den Kontrast zu Gottes Gebot klar heraus.
- source_word: τηρήσητε
  choice: bewahren könnt
  rationale: »Bewahren« gibt das Festhalten an der Überlieferung natürlich wieder; das Modalverb macht die mit ἵνα verbundene Zielrichtung idiomatisch verständlich.
theological_decisions:
- issue: Ton von Jesu Aussage
  choice: ironischer Tadel
  alternative: 'wörtlich klingende Anerkennung: »Gut setzt ihr Gottes Gebot außer Kraft …«'
  rationale: Der Zusammenhang zeigt keine Billigung, sondern Kritik daran, dass menschliche Überlieferung über Gottes Gebot gestellt wird. »Geschickt« erhält die Ironie, ohne den Tadel in eine ausdrückliche Paraphrase aufzulösen.
- issue: Verhältnis von Zweck und Folge bei ἵνα
  choice: mit »damit« offen wiedergegeben
  alternative: 'eindeutig zweckhaft: »um … zu«'
  rationale: Die Formulierung wahrt die Spannung zwischen beabsichtigtem Zweck und erreichter Folge und vermeidet eine stärkere psychologische Festlegung als der griechische Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ironische Schärfe wird durch »geschickt« vermittelt; »außer Kraft setzen« ist klar und gegenwärtig, während »Überlieferung« den religiösen und traditionsbezogenen Kontext bewahrt.
