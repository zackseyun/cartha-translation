id: MRK.7.32
reference: Mark 7:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ φέρουσιν αὐτῷ κωφὸν ⸀καὶ ⸀μογιλάλον, καὶ παρακαλοῦσιν αὐτὸν ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: de
  text: Da bringen sie einen gehörlosen Mann zu ihm, der nur mit Mühe sprechen kann, und bitten ihn eindringlich, ihm die Hand aufzulegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: Da bringen sie
  rationale: Das historische Präsens des Markus wird im Deutschen natürlich als Präsens beibehalten; „Da“ bindet den Vorgang erzählerisch an den Kontext an.
- source_word: κωφόν
  choice: einen gehörlosen Mann
  rationale: κωφός bezeichnet hier Gehörlosigkeit; die folgende eigene Angabe μογιλάλον beschreibt zusätzlich die Sprechbeeinträchtigung.
- source_word: μογιλάλον
  choice: der nur mit Mühe sprechen kann
  rationale: Das seltene Wort bezeichnet erschwertes beziehungsweise beeinträchtigtes Sprechen, nicht völlige Stummheit. Die Formulierung ist klar und idiomatisch.
- source_word: παρακαλοῦσιν
  choice: bitten ihn eindringlich
  rationale: παρακαλέω bezeichnet in diesem Heilungskontext eine dringliche Bitte; die Wiedergabe wahrt die Intensität, ohne unnötig drastisch zu klingen.
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: ihm die Hand aufzulegen
  rationale: Der Infinitiv gibt den Inhalt der Bitte natürlich wieder. Der Singular „die Hand“ entspricht τὴν χεῖρα und bewahrt die Heilungsgeste.
theological_decisions:
- issue: Art der Beeinträchtigung des Mannes
  choice: Der Mann ist gehörlos und kann nur mit Mühe sprechen.
  alternative: Der Mann ist taubstumm.
  rationale: Die getrennten Bezeichnungen κωφός und μογιλάλος weisen auf Gehörlosigkeit und erschwertes Sprechen hin. „Taubstumm“ würde μογιλάλος als völlige Unfähigkeit zu sprechen überdehnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das markinische historische Präsens bleibt erhalten. „Gehörlos“ ist gegenwärtig und präzise; die relative Formulierung erklärt die zusätzliche Sprechbeeinträchtigung ohne medizinischen Fachjargon.
