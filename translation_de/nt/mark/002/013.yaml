source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν πάλιν παρὰ τὴν θάλασσαν· καὶ πᾶς ὁ ὄχλος ἤρχετο πρὸς αὐτόν, καὶ ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/013.yaml
  text: And he went out again beside the sea[a], and the whole crowd was coming to him[c][b], and he was teaching them.
translation:
  language: de
  text: Und er ging wieder hinaus am See entlang. Die ganze Menschenmenge kam zu ihm, und er lehrte sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Verbformen für „kam“ und „lehrte“ können andauernde oder wiederholte Handlungen in der Vergangenheit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ging hinaus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet hier schlicht das Hinausgehen; „ging hinaus“ ist natürlich und fügt keinen im Griechischen ungenannten Ausgangsort hinzu.
- source_word: πάλιν
  choice: wieder
  rationale: „Wieder“ gibt die Wiederholung knapp und idiomatisch wieder.
- source_word: παρὰ τὴν θάλασσαν
  choice: an den See
  rationale: παρά mit Akkusativ bezeichnet hier die Bewegung in den Bereich am Ufer. Im Kontext des Sees Gennesaret ist „an den See“ im Deutschen natürlicher als das wörtlichere „neben den See“.
- source_word: πᾶς ὁ ὄχλος
  choice: die ganze Menschenmenge
  rationale: Die Verbindung πᾶς ὁ mit einem kollektiven Substantiv wird idiomatisch mit „die ganze Menschenmenge“ wiedergegeben; dies ist klarer als „die ganze Menge“ und bewahrt den kollektiven Sinn.
- source_word: ἤρχετο
  choice: kam
  rationale: Das griechische Imperfekt stellt das Kommen als verlaufende Handlung dar. Da „war am Kommen“ im Deutschen schwerfällig klingt, steht im Haupttext das natürliche „kam“; die Aspektnuance wird in der Fußnote erläutert.
- source_word: πρὸς αὐτόν
  choice: zu ihm
  rationale: πρός mit Akkusativ bezeichnet die Bewegung auf eine Person zu; „zu ihm“ ist die direkte und natürliche Entsprechung.
- source_word: ἐδίδασκεν
  choice: lehrte
  rationale: Das Imperfekt beschreibt fortdauerndes Lehren. Das deutsche Präteritum ist im Erzählstil idiomatisch; die Verlaufsnuance wird durch die Fußnote offengehalten.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen bezieht sich sinngemäß auf die Menschen der zuvor genannten Menge; „sie“ ist die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Der Satzbau bleibt nah am griechischen Ablauf, wird aber durch einen Satzpunkt und „Da“ natürlich gegliedert. Die schwerfällige deutsche Verlaufsform wird vermieden; ihre im Imperfekt liegende Aspektnuance bleibt in der Fußnote erhalten.
