id: MRK.2.4
reference: Mark 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ μὴ δυνάμενοι ⸀προσενέγκαι αὐτῷ διὰ τὸν ὄχλον ἀπεστέγασαν τὴν στέγην ὅπου ἦν, καὶ ἐξορύξαντες χαλῶσι τὸν κράβαττον ⸀ὅπου ὁ παραλυτικὸς κατέκειτο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: de
  text: Weil sie ihn wegen der Menschenmenge nicht zu ihm bringen konnten,[a] deckten sie dort, wo er war, das Dach ab. Nachdem sie es aufgebrochen hatten,[b] lassen sie die Matte hinunter, auf der der Gelähmte[c] lag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste „ihn“ bezeichnet den Gelähmten, das zweite Jesus.
    reason: Referenzklärung bei zwei gleichlautenden Pronomen.
  - marker: b
    text: 'Wörtlicher: „Nachdem sie es aufgegraben hatten.“ Gemeint ist, dass sie das Dach öffneten; sein Material wird nicht genannt.'
    reason: Lexikalische Alternative und Vermeidung einer unnötigen Festlegung auf eine bestimmte Dachkonstruktion.
  - marker: c
    text: 'Wörtlich: „der Paralytische“; gemeint ist ein gelähmter Mann.'
    reason: Erläuterung der natürlichen deutschen Wiedergabe eines substantivierten griechischen Adjektivs.
lexical_decisions:
- source_word: μὴ δυνάμενοι
  choice: weil sie … nicht … konnten
  rationale: Das Partizip bezeichnet hier den Umstand beziehungsweise Grund für das folgende Handeln. Der Nebensatz gibt diesen Zusammenhang in natürlichem Deutsch wieder.
- source_word: προσενέγκαι αὐτῷ
  choice: ihn … zu ihm bringen
  rationale: 'Beide griechischen Pronomen bleiben erhalten: Das erste bezeichnet den Gelähmten, das zweite Jesus. Die leichte Wiederholung bewahrt die Struktur und Referenz des Ausgangstextes.'
- source_word: διὰ τὸν ὄχλον
  choice: wegen der Menschenmenge
  rationale: διά mit Akkusativ bezeichnet den hindernden Grund. „Menschenmenge“ ist klar und idiomatisch.
- source_word: ἀπεστέγασαν τὴν στέγην
  choice: deckten … das Dach ab
  rationale: Die etymologische Wiederholung des Griechischen wird in einer geläufigen deutschen Wendung wiedergegeben, die das Entfernen der Dachdeckung ausdrückt.
- source_word: ὅπου ἦν
  choice: dort, wo er war
  rationale: Die Ortsangabe bleibt so knapp wie im Griechischen; der Dachkontext macht die räumliche Beziehung verständlich.
- source_word: ἐξορύξαντες
  choice: nachdem sie es aufgebrochen hatten
  rationale: Die Form bezeichnet das Herstellen einer Öffnung durch Graben beziehungsweise Aufbrechen. „Aufgebrochen“ ist für ein antikes Dach natürlich, ohne dessen Material näher festzulegen.
- source_word: χαλῶσι
  choice: lassen sie … hinunter
  rationale: Das historische Präsens des griechischen Erzähltextes wird beibehalten. „Hinunterlassen“ gibt die kontrollierte Abwärtsbewegung idiomatisch wieder.
- source_word: κράβαττον
  choice: Matte
  rationale: Gemeint ist eine einfache Liegeunterlage, nicht notwendig ein festes Bett. „Matte“ ist modern und anschaulich.
- source_word: ὁ παραλυτικὸς
  choice: der Gelähmte
  rationale: Das substantivierte Adjektiv wird mit der üblichen, knappen deutschen Personenbezeichnung wiedergegeben.
- source_word: ὅπου ὁ παραλυτικὸς κατέκειτο
  choice: auf der der Gelähmte lag
  rationale: Im Zusammenhang bezieht sich der Relativsatz auf die Matte. „Auf der“ macht diese Beziehung im Deutschen eindeutig und natürlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Das historische Präsens bei „lassen“ bewahrt die Lebendigkeit des griechischen χαλῶσι; die übrigen Handlungen stehen entsprechend ihrem griechischen Aspekt und ihrer zeitlichen Abfolge im Präteritum beziehungsweise Plusquamperfekt.
