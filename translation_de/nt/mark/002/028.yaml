  variant: modern standard German
source:
  edition: SBLGNT
  text: ὥστε κύριός ἐστιν ὁ υἱὸς τοῦ ἀνθρώπου καὶ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: de
  text: Daher ist der Menschensohn Herr sogar über den Sabbat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Daher ist der Menschensohn auch Herr über den Sabbat.“ Das griechische Wort kann schlicht „auch“ bedeuten; hier hat es wahrscheinlich den steigernden Sinn „sogar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Daher
  rationale: Leitet eine Folgerung aus der vorausgehenden Aussage ein und klingt im modernen Standarddeutsch natürlich und würdig.
- source_word: κύριος
  choice: Herr
  rationale: Bewahrt die starke Aussage von Vollmacht und Herrschaft; in Bezug auf den Menschensohn ist die Großschreibung angemessen.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Bewahrt Jesu etablierte Selbstbezeichnung sowie ihre christologische und mögliche danielische Resonanz, ohne sie aufzulösen.
- source_word: καὶ
  choice: sogar
  rationale: Gibt hier wahrscheinlich den steigernden Sinn wieder und hebt die überraschende Reichweite der Herrschaft des Menschensohns hervor.
- source_word: σαββάτου
  choice: den Sabbat
  rationale: Die Präposition „über“ macht das im griechischen Genitiv ausgedrückte Herrschaftsverhältnis im Deutschen idiomatisch deutlich.
theological_decisions:
- issue: Christologische Tragweite des Anspruchs auf Vollmacht über den Sabbat
  choice: Die Aussage wird unmittelbar als Herrschaft des Menschensohns über den Sabbat wiedergegeben.
  alternative: „hat Vollmacht in Bezug auf den Sabbat“
  rationale: κύριος bezeichnet hier Herrschaft und nicht lediglich eine begrenzte Befugnis; die starke Aussage bleibt erhalten, ohne zusätzliche Dogmatik einzutragen.
- issue: Bezug der Bezeichnung „Menschensohn“
  choice: Die traditionelle und etablierte Bezeichnung „der Menschensohn“ wird beibehalten.
  alternative: „der Mensch“ oder „der menschliche Eine“
  rationale: Im Markusevangelium dient die Wendung als Selbstbezeichnung Jesu und bewahrt eine theologische Spannung sowie mögliche Anklänge an Daniel.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Daher“ hält den Folgerungszusammenhang fest; „sogar über den Sabbat“ ist idiomatisch und bewahrt die Hervorhebung des griechischen καί.
