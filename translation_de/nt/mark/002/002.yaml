  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: de
  text: Und viele Menschen kamen zusammen, sodass kein Platz mehr war, nicht einmal an der Tür. Und er verkündete ihnen das Wort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: die Botschaft. Wörtlich: das Wort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: Da kamen so viele Menschen zusammen
  rationale: Das substantivisch gebrauchte πολλοί wird im Deutschen natürlich mit „viele Menschen“ wiedergegeben. „Kamen … zusammen“ vermittelt das Versammeln idiomatisch, ohne einen im Kontext nicht ausdrücklich genannten Handelnden für das griechische Passiv einzuführen.
- source_word: ὥστε μηκέτι χωρεῖν
  choice: dass kein Platz mehr war
  rationale: Die resultative Konstruktion mit ὥστε und χωρεῖν bezeichnet hier die erschöpfte Raumkapazität; die deutsche Formulierung ist klar und bewahrt das „nicht mehr“ von μηκέτι.
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: nicht einmal vor der Tür
  rationale: Der substantivierte Ausdruck bezeichnet den Bereich an beziehungsweise vor der Tür. „Vor der Tür“ passt natürlich zur räumlichen Situation eines überfüllten Hauses; „nicht einmal“ gibt μηδέ wieder.
- source_word: ἐλάλει αὐτοῖς
  choice: er verkündete ihnen
  rationale: Der Imperfekt beschreibt ein fortlaufendes Reden. Im Zusammenhang bezeichnet λαλεῖν τὸν λόγον die Mitteilung beziehungsweise Verkündigung der Botschaft; „verkündete“ ist im Deutschen idiomatischer als „sprach ihnen das Wort“.
- source_word: τὸν λόγον
  choice: das Wort
  rationale: Die formal transparente Wiedergabe bewahrt die Ausdrucksweise des griechischen Textes und legt nicht ausdrücklich „Gottes“ fest. Die mögliche Bedeutung „Botschaft“ wird in der Fußnote genannt.
theological_decisions:
- issue: Bedeutung von τὸν λόγον
  choice: das Wort
  alternative: die Botschaft; das Wort Gottes
  rationale: „Das Wort“ wahrt die knappe Formulierung und ihre theologische Offenheit. „Die Botschaft“ ist sachlich möglich, während „das Wort Gottes“ eine im Vers nicht ausdrücklich vorhandene Bestimmung ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Reihung. „Vor der Tür“ beschreibt den Außenbereich am Eingang; „verkündete“ gibt die kontextuelle Funktion des fortlaufenden Redens natürlich wieder.
