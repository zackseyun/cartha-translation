  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: de
  text: Niemand näht einen Flicken aus nicht eingelaufenem Stoff auf ein altes Kleidungsstück[a]. Sonst reißt der neue Flicken vom alten Kleidungsstück ab[b], und der Riss wird noch schlimmer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus ungewalktem Stoff“. Gemeint ist Stoff, der noch nicht so verarbeitet beziehungsweise vorgeschrumpft wurde, dass er beim späteren Einlaufen keinen zusätzlichen Zug mehr ausübt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Sonst nimmt das Füllstück von ihm weg, das Neue vom Alten, und ein schlimmerer Riss entsteht.“ Die knappe griechische Formulierung beschreibt, dass sich der neue Flicken vom alten Kleidungsstück löst und der Riss dadurch schlimmer wird.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐπίβλημα
  choice: Flicken
  rationale: Bezeichnet ein aufgesetztes Stoffstück zur Ausbesserung; „Flicken“ ist im Deutschen die natürliche und konkrete Entsprechung.
- source_word: ῥάκους ἀγνάφου
  choice: aus nicht eingelaufenem Stoff
  rationale: ἄγναφος bezeichnet Stoff, der noch nicht gewalkt beziehungsweise vorgeschrumpft wurde. Die Formulierung vermittelt verständlich, warum der Flicken später Zug ausübt.
- source_word: ἐπιράπτει ἐπὶ
  choice: näht ... auf
  rationale: Gibt das konkrete Annähen eines Flickens idiomatisch und quellennah wieder.
- source_word: ἱμάτιον παλαιόν
  choice: ein altes Kleidungsstück
  rationale: ἱμάτιον bezeichnet hier allgemein ein Kleidungsstück; die Wiedergabe vermeidet die unnötige Festlegung auf Mantel oder Gewand.
- source_word: εἰ δὲ μή
  choice: Sonst
  rationale: Drückt die im Griechischen knapp formulierte negative Folge natürlich aus.
- source_word: αἴρει τὸ πλήρωμα ἀπ’ αὐτοῦ
  choice: reißt das neue Stück etwas von dem alten ab
  rationale: Im Kontext ist das ergänzende Stoffstück Subjekt des Los- beziehungsweise Abreißens. Die Wiedergabe macht den Vorgang verständlich, ohne das Bild aufzulösen.
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: das neue Stück ... von dem alten
  rationale: Bewahrt den betonten Gegensatz von Neuem und Altem und ergänzt „Stück“ nur zur natürlichen deutschen Verständlichkeit.
- source_word: χεῖρον σχίσμα γίνεται
  choice: der Riss wird noch schlimmer
  rationale: Gibt den resultierenden verschlimmerten Riss schlicht und idiomatisch wieder.
