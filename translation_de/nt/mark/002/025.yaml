  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Habt ihr nie gelesen, was David tat, als er in Not war und Hunger hatte, er und die, die bei ihm waren?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: in Not war
  rationale: Die Wendung bezeichnet, dass David Bedarf beziehungsweise Not hatte; »in Not war« ist natürliches modernes Deutsch und bewahrt den situativen Druck.
- source_word: ἐπείνασεν
  choice: Hunger hatte
  rationale: Gibt das finite Verb ausdrücklich wieder und hält es, wie im griechischen Text, neben Davids Not fest.
- source_word: οἱ μετ’ αὐτοῦ
  choice: die, die bei ihm waren
  rationale: Eine klare und quellennah formulierte Wiedergabe der Begleiter Davids, ohne zusätzliche Deutung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und die nachgestellte Hervorhebung »er und die, die bei ihm waren« bleiben erhalten.
