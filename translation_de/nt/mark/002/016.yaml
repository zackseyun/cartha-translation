source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: de
  text: 'Und als die Schriftgelehrten der Pharisäer sahen, dass er mit Sündern und Zolleinnehmern aß, sagten sie zu seinen Jüngern: »Warum isst er mit Zolleinnehmern und Sündern?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »Warum hält er mit Zolleinnehmern und Sündern Tischgemeinschaft?« Das griechische „isst mit“ kann in diesem Zusammenhang Tischgemeinschaft einschließen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: Schriftgelehrte
  rationale: Die etablierte deutsche Wiedergabe bezeichnet anerkannte Fachleute für die heiligen Schriften und das Gesetz, ohne ihre Funktion unnötig einzuengen.
- source_word: τῶν Φαρισαίων
  choice: der Pharisäer
  rationale: Der Genitiv wird als Zugehörigkeit beziehungsweise Verbindung zu den Pharisäern wiedergegeben; die Formulierung bewahrt die knappe griechische Konstruktion.
- source_word: ἰδόντες
  choice: als … sahen
  rationale: Der Aoristpartizip wird im Deutschen idiomatisch als temporaler Nebensatz wiedergegeben.
- source_word: ὅτι ἐσθίει
  choice: dass er … aß
  rationale: Das Imperfekt beschreibt die im Gang befindliche Mahlzeit; im deutschen Erzählstil gibt das Präteritum dies natürlich wieder.
- source_word: ἁμαρτωλῶν
  choice: Sündern
  rationale: Die direkte Entsprechung bewahrt die scharfe sozial-religiöse Bezeichnung der betreffenden Menschen.
- source_word: τελωνῶν
  choice: Zolleinnehmern
  rationale: Die Bezeichnung ist für heutige Leser verständlich und meint die gesellschaftlich verachteten Einnehmer von Zöllen und Abgaben.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das schlichte Verb wahrt den Charakter der anschließenden direkten Rede; der deutsche Kontext benötigt keine ausdrücklich durative Form.
- source_word: μαθηταῖς
  choice: Jüngern
  rationale: Dies ist die geläufige Wiedergabe für Schüler und Anhänger eines Lehrers im Evangelienkontext.
- source_word: Ὅτι
  choice: Warum
  rationale: In der direkten Frage leitet ὅτι idiomatisch den Grund der beanstandeten Handlung ein; »Warum« ist die natürliche deutsche Wiedergabe.
- source_word: μετὰ … ἐσθίει
  choice: isst … mit
  rationale: Die wörtliche und natürliche Formulierung lässt die im Kontext bedeutsame Tischgemeinschaft anklingen, ohne sie im Haupttext auszudeuten.
theological_decisions:
- issue: Sozial-religiöse Bedeutung der Tischgemeinschaft
  choice: Die Anklage wird schlicht als Essen mit »Zolleinnehmern und Sündern« wiedergegeben.
  alternative: »Warum hält er Tischgemeinschaft mit Zolleinnehmern und Sündern?«
  rationale: Der griechische Text verwendet das gewöhnliche Verb »essen« mit »mit«. Die Übersetzung bewahrt diese Schlichtheit und lässt die soziale und theologische Spannung durch den Erzählzusammenhang hervortreten.
- issue: Reihenfolge der bezeichneten Gruppen
  choice: 'Die wechselnde Reihenfolge wird bewahrt: zunächst »Sünder und Zolleinnehmer«, dann »Zolleinnehmer und Sünder«.'
  alternative: Beide Vorkommen in derselben Reihenfolge wiedergeben.
  rationale: Die unterschiedliche Reihenfolge steht im vorliegenden griechischen Text und kann ohne Verlust an Natürlichkeit erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Schriftgelehrte«, »Jünger« und »Sünder« bewahren die vertraute biblische Begrifflichkeit; »Zolleinnehmer« ist gegenüber dem heute missverständlichen »Zöllner« transparenter.
