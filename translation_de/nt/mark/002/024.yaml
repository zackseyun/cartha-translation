  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: de
  text: 'Und die Pharisäer sagten zu ihm: »Sieh doch! Warum[a] tun sie am Sabbat, was nicht erlaubt ist?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sieh doch, was sie am Sabbat tun, was nicht erlaubt ist!« Das griechische τί kann hier als »was« verstanden werden; im Zusammenhang liegt jedoch wahrscheinlich die Bedeutung »warum« näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den einfachen erzählerischen Anschluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Die im Deutschen übliche Bezeichnung der religiösen Gruppe.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das griechische Imperfekt kann einen andauernden oder wiederholten Vorgang bezeichnen. Im natürlichen deutschen Erzählstil kann dies hier schlicht mit »sagten« wiedergegeben werden; eine ausdrücklich iterative Übersetzung wäre stärker als nötig.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Natürliche Wiedergabe des Dativs als indirektes Objekt; gemeint ist Jesus.
- source_word: Ἴδε
  choice: Sieh doch!
  rationale: Gibt den aufmerksamkeitsheischenden Imperativ in gegenwärtigem, nachdrücklichem Deutsch wieder, ohne das altertümliche »Siehe«.
- source_word: τί
  choice: warum
  rationale: τί bedeutet formal »was« oder in solchen Fragen »warum«. Im vorliegenden Vorwurf ist die adverbiale Bedeutung »warum« im Deutschen am natürlichsten; die formnähere Lesart wird in der Fußnote bewahrt.
- source_word: ποιοῦσιν
  choice: tun sie
  rationale: Das Präsens der direkten Rede wird beibehalten.
- source_word: τοῖς σάββασιν
  choice: am Sabbat
  rationale: Der griechische Plural ist eine übliche semitisch beeinflusste Bezeichnung für den einzelnen Sabbattag; idiomatisches Deutsch verwendet den Singular.
- source_word: ὃ οὐκ ἔξεστιν
  choice: was nicht erlaubt ist
  rationale: Bewahrt den rechtlich-religiösen Sinn der fehlenden Erlaubnis, ohne festzulegen, auf welche konkrete Norm oder Auslegung sich der Vorwurf stützt.
theological_decisions:
- issue: Grundlage des pharisäischen Vorwurfs
  choice: »was nicht erlaubt ist«
  alternative: »was gegen das Gesetz verstößt« / »was ungesetzlich ist«
  rationale: Der griechische Text nennt nur das fehlende Erlaubtsein. Die Übersetzung lässt offen, ob sich der Vorwurf auf das biblische Gesetz, pharisäische Überlieferung oder eine halachische Auslegung bezieht.
- issue: Deutung von τί
  choice: »warum« im Haupttext
  alternative: »was« in der formnäheren Satzdeutung
  rationale: Der Kontext legt eine Warum-Frage nahe, doch die grammatisch mögliche Was-Lesart wird nicht verworfen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Sieh doch!« gibt den Nachdruck natürlich wieder; »am Sabbat« und »nicht erlaubt« sind klar, ohne konfessionelle oder juristisch überpräzise Festlegung.
