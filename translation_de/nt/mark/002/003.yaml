  text: καὶ ἔρχονται ⸂φέροντες πρὸς αὐτὸν παραλυτικὸν⸃ αἰρόμενον ὑπὸ τεσσάρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/003.yaml
  text: And they came[a], bringing to him a paralyzed man carried by four.
translation:
  language: de
  text: Und sie kamen und brachten einen Gelähmten zu ihm, der von vier[a] getragen wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »von vier«; das Griechische bezeichnet die vier nicht näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den einfachen, für Markus typischen Anschluss an die vorhergehende Erzählung.
- source_word: ἔρχονται
  choice: sie kamen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: φέροντες
  choice: und brachten
  rationale: Gibt das begleitende Partizip idiomatisch als koordinierte Handlung wieder und vermeidet eine schwerfällige Partizipialkonstruktion.
- source_word: πρὸς αὐτὸν
  choice: zu ihm
  rationale: Natürliche Wiedergabe der auf Jesus gerichteten Bewegung.
- source_word: παραλυτικὸν
  choice: einen Gelähmten
  rationale: Das substantivierte Adjektiv bezeichnet einen gelähmten Menschen; die gewählte Form ist im Deutschen geläufig und prägnant.
- source_word: αἰρόμενον
  choice: der ... getragen wurde
  rationale: Macht das passive Partizip und die körperliche Tragehandlung im Deutschen klar.
- source_word: ὑπὸ τεσσάρων
  choice: von vier Leuten
  rationale: Die Ergänzung „Leuten“ macht die im Griechischen elliptische Personenangabe im Deutschen verständlich, ohne das Geschlecht der vier ausdrücklich festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Koordination „kamen und brachten“ bildet die griechische Hauptverb-Partizip-Struktur natürlich ab; die Fußnote bewahrt die Ellipse des Ausgangstextes.
