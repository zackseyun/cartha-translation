  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: de
  text: 'Damit ihr aber wisst, dass der Menschensohn[a] Vollmacht hat, auf der Erde Sünden zu vergeben – sagt er zu dem Gelähmten:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der Sohn des Menschen“. Die griechische Bezeichnung kann einen Bezug zur Menschheit haben und möglicherweise auf Daniel 7 anspielen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Damit ihr aber wisst
  rationale: „Damit“ gibt den Zweck der folgenden Demonstration wieder; „aber“ markiert den leichten Gegensatz beziehungsweise Fortgang, und „wisst“ entspricht dem Erkenntnisverb direkt.
- source_word: ἐξουσίαν ἔχει
  choice: Vollmacht hat
  rationale: „Vollmacht“ bezeichnet hier die legitime Befugnis, Sünden zu vergeben, nicht bloß die Fähigkeit oder Kraft dazu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die eingebürgerte deutsche Wiedergabe bewahrt Jesu Selbstbezeichnung sowie ihre mögliche Anspielung auf Daniel 7, ohne die Mehrdeutigkeit aufzulösen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Die Formulierung bezeichnet den irdischen Bereich und lässt einen möglichen Gegensatz zum Himmel offen.
- source_word: ἀφιέναι ἁμαρτίας
  choice: Sünden zu vergeben
  rationale: Im Kontext bedeutet ἀφίημι das Erlassen beziehungsweise Vergeben von Sünden; die gewählte Formulierung ist klar und idiomatisch.
- source_word: λέγει τῷ παραλυτικῷ
  choice: sagt er zu dem Gelähmten
  rationale: Das historische Präsens bleibt erhalten. Das substantivierte „dem Gelähmten“ gibt die griechische Personenbezeichnung knapp und natürlich wieder.
theological_decisions:
- issue: Wiedergabe von ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  alternative: der Sohn des Menschen
  rationale: „Menschensohn“ ist im Deutschen als Jesu Selbstbezeichnung etabliert und bewahrt sowohl den Bezug zur Menschheit als auch den möglichen Daniel-7-Hintergrund, ohne eine bestimmte christologische Deutung festzuschreiben.
- issue: Bedeutung von ἐξουσία beim Vergeben von Sünden
  choice: Vollmacht
  alternative: Macht; Recht
  rationale: Der Zusammenhang betont Jesu legitime Befugnis zum Vergeben von Sünden. „Vollmacht“ hält diesen Anspruch deutlicher fest als ein Ausdruck bloßer Wirksamkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gedankenstrich bildet die im griechischen Satz beginnende Unterbrechung ab; der Doppelpunkt zeigt an, dass Jesu anschließende Worte in Vers 11 folgen.
