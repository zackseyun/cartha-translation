source:
  edition: SBLGNT
  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: de
  text: Als er nach einigen Tagen wieder nach Kafarnaum kam, wurde bekannt, dass er zu Hause[a] war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: im Haus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: als er … kam
  rationale: Das vorzeitige Aoristpartizip wird als natürlicher temporaler Nebensatz wiedergegeben. Bei einer Stadt ist „nach Kafarnaum kommen“ im Deutschen idiomatischer als das formale „hineingehen“.
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die Wiederholung beziehungsweise Rückkehr knapp und idiomatisch wieder.
- source_word: Καφαρναούμ
  choice: Kafarnaum
  rationale: Entspricht der im modernen Deutschen üblichen Schreibweise des Ortsnamens.
- source_word: δι’ ἡμερῶν
  choice: nach einigen Tagen
  rationale: Bewahrt die unbestimmte Zeitspanne des griechischen Ausdrucks, ohne sie auf „wenige“ Tage einzuengen.
- source_word: ἠκούσθη
  choice: wurde bekannt
  rationale: Gibt die unpersönliche Passivform als natürliche deutsche Bekanntwerdungsformel wieder; „es wurde gehört“ wäre unnötig hölzern.
- source_word: ἐν οἴκῳ
  choice: zu Hause
  rationale: Ist eine idiomatische mögliche Bedeutung des artikellosen Ausdrucks; die ebenso mögliche örtliche Lesart „im Haus“ wird in der Fußnote offengelegt.
- source_word: ἐστίν
  choice: war
  rationale: Das griechische Präsens innerhalb der berichteten Aussage wird im deutschen Erzählzusammenhang natürlich an die Vergangenheitsform des einleitenden Verbs angeglichen.
theological_decisions:
- issue: Bezeichnet ἐν οἴκῳ Jesu Zuhause oder lediglich das Haus, in dem er sich befand?
  choice: zu Hause
  alternative: im Haus
  rationale: Der Ausdruck lässt beide Deutungen zu. Die idiomatische Haupttextfassung wird gewählt, ohne ein eigenes Haus Jesu vorauszusetzen; die räumlich wörtlichere Alternative bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und erzählerisch; die unpersönliche Nachrichtformel des Griechischen wird natürlich wiedergegeben. Der Fußnotenmarker steht unmittelbar bei der mehrdeutigen Wendung.
