  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: de
  text: Warum redet dieser Mann so? Er lästert! Wer kann Sünden vergeben außer Gott allein?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „außer dem einen Gott“.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ... οὕτως λαλεῖ
  choice: Warum redet ... so?
  rationale: Die griechische Wendung fragt idiomatisch nach dem Grund beziehungsweise beanstandet die Art dieser Rede; im Deutschen gibt „Warum ... so?“ dies natürlich wieder.
- source_word: οὗτος
  choice: dieser Mann
  rationale: Die Formulierung bewahrt die distanzierende Bezugnahme auf Jesus, ohne stärkere Verachtung in den Text hineinzutragen.
- source_word: βλασφημεῖ
  choice: Er lästert Gott!
  rationale: Im Deutschen bezeichnet „Gott lästern“ den hier gemeinten religiösen Vorwurf klarer und natürlicher als das weniger allgemeinverständliche „blasphemieren“.
- source_word: ἀφιέναι ἁμαρτίας
  choice: Sünden vergeben
  rationale: In diesem Zusammenhang hat ἀφίημι die etablierte Bedeutung „vergeben“.
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: außer Gott allein
  rationale: Die Wiedergabe drückt die Ausschließlichkeit knapp und idiomatisch aus, ohne die mögliche syntaktische Nuance von „der eine Gott“ stillschweigend auszuschließen.
theological_decisions:
- issue: Stärke der abwertenden Färbung von οὗτος
  choice: dieser Mann
  alternative: dieser da
  rationale: Die Schriftgelehrten sprechen distanziert und feindselig, doch eine stärker abschätzige deutsche Wendung würde den Ton über das ausdrücklich Gesagte hinaus verschärfen.
- issue: Wiedergabe des Vorwurfs βλασφημεῖ
  choice: Er lästert Gott!
  alternative: Er redet Gotteslästerungen!
  rationale: Die Übersetzung gibt den theologischen Vorwurf der Schriftgelehrten wieder, entscheidet aber nicht vorweg, ob ihr Urteil über Jesus zutrifft; so bleibt die christologische Spannung der Erzählung erhalten.
- issue: Verständnis von εἷς ὁ θεός
  choice: Gott allein
  alternative: der eine Gott
  rationale: Im unmittelbaren Zusammenhang steht die ausschließliche Vollmacht zur Sündenvergebung im Vordergrund. Die alternative Fassung ist grammatisch möglich und wird deshalb in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. „Gott lästern“ ist gegenüber „blasphemieren“ natürlicher und hält den religiösen Gehalt des Vorwurfs ausdrücklich fest.
