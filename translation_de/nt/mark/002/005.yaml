  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: de
  text: 'Und als Jesus ihren Glauben sah, sagt er zu dem Gelähmten: »Kind[a], deine Sünden sind vergeben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Sohn« möglich; griechisch τέκνον ist eine liebevolle Anrede und bedeutet wörtlich »Kind«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: als … sah
  rationale: Das aoristische Partizip bezeichnet hier den Umstand, der dem Hauptverb vorausgeht. Ein temporaler Nebensatz ist im modernen Deutschen natürlicher und bewahrt den Zusammenhang.
- source_word: πίστιν αὐτῶν
  choice: ihren Glauben
  rationale: πίστις bezeichnet hier den erkennbaren Glauben beziehungsweise das Vertrauen der beteiligten Gruppe. Der Pluralbezug von αὐτῶν bleibt erhalten, ohne festzulegen, ob der Gelähmte eingeschlossen ist.
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens wird beibehalten und bewahrt die für Markus typische lebendige Erzählweise.
- source_word: παραλυτικῷ
  choice: dem Gelähmten
  rationale: Das substantivierte Adjektiv bezeichnet einen gelähmten Menschen. Die Formulierung ist im heutigen Deutsch natürlich und knapp.
- source_word: Τέκνον
  choice: Mein Kind
  rationale: τέκνον ist eine warmherzige, fürsorgliche Anrede. »Mein Kind« klingt im Deutschen als direkte Anrede natürlicher als das isolierte »Kind«; das ergänzte Possessivpronomen drückt dabei die im Anredeton liegende Nähe aus.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: deine Sünden sind vergeben
  rationale: Die präsentische Passivform wird als gegenwärtig gültige Feststellung wiedergegeben. Wie im Griechischen bleibt der Handelnde des Passivs unausgesprochen.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Die übliche Entsprechung erhält sowohl die religiös-moralische Bedeutung als auch den Plural.
theological_decisions:
- issue: Charakter und Zeitpunkt des Vergebungsausspruchs
  choice: »deine Sünden sind vergeben« als unmittelbare Feststellung
  alternative: »deine Sünden werden vergeben« oder »deine Sünden sind dir vergeben worden«
  rationale: Die Formulierung wahrt die präsentische Aussagekraft und lässt offen, ob der Satz vor allem als Erklärung, Zuspruch oder wirksamer Vollzug zu verstehen ist. Sie fügt weder einen Zeitpunkt noch eine Erklärung der göttlichen Urheberschaft hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens des Markus bleibt erhalten. Die Anrede ist bewusst warm, ohne eine besondere Lehrdeutung einzutragen.
