id: MRK.2.22
reference: Mark 2:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: de
  text: Und niemand füllt jungen Wein in alte Weinschläuche. Sonst zerreißt der Wein die Schläuche, und der Wein geht verloren[a] und die Schläuche ebenso. Sondern junger Wein gehört in neue Weinschläuche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird unbrauchbar“.'
    reason: Das griechische Verb kann hier sowohl den Verlust als auch das Verderben beziehungsweise Unbrauchbarwerden des Weins bezeichnen.
lexical_decisions:
- source_word: βάλλει
  choice: füllt … in
  rationale: Das allgemeine Verb bedeutet wörtlich „tun/geben“. Bei Wein und einem Behälter ist „füllt … in“ im Deutschen natürlich, ohne die Art des Einfüllens unnötig festzulegen.
- source_word: οἶνον νέον
  choice: jungen Wein
  rationale: „Junger Wein“ ist die geläufige deutsche Bezeichnung für neu bereiteten, noch gärenden Wein und bewahrt das Bild sachgerecht.
- source_word: ἀσκούς
  choice: Weinschläuche
  rationale: Gemeint sind Behälter aus Tierhaut zur Aufbewahrung von Wein. „Weinschläuche“ ist die klare und kulturell passende deutsche Entsprechung.
- source_word: παλαιούς
  choice: alte
  rationale: „Alt“ gibt den direkten Gegensatz zu den am Ende genannten neuen Weinschläuchen wieder, ohne die Folgerung „abgenutzt“ in den Text einzutragen.
- source_word: ῥήξει
  choice: zerreißt
  rationale: Das Verb bezeichnet hier das Aufreißen der Schläuche durch den Druck des gärenden Weins. „Zerreißt“ ist für das ausdrücklich genannte Subjekt „der Wein“ natürlicher als „lässt platzen“.
- source_word: ἀπόλλυται
  choice: geht verloren
  rationale: Die mediale/intransitive Form bezeichnet, dass der Wein verloren geht beziehungsweise unbrauchbar wird. „Geht verloren“ wahrt den breiten Bedeutungsumfang; „verdirbt“ wäre enger.
- source_word: καινούς
  choice: neue
  rationale: καινός bezeichnet Neues beziehungsweise Frisches in qualitativer Hinsicht. Im Deutschen ist „neue Weinschläuche“ natürlich; zusammen mit „junger Wein“ bleibt die Unterscheidung zwischen νέος und καινός erkennbar.
- source_word: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινούς
  choice: Sondern junger Wein gehört in neue Weinschläuche
  rationale: Der griechische Schlusssatz ist ohne ausdrückliches Verb elliptisch. „Gehört in“ ergänzt ihn als knappen allgemeinen Grundsatz, ohne einen ausdrücklichen Befehl oder ein nicht vorhandenes Modalverb einzuführen.
theological_decisions:
- issue: Aussageform des elliptischen Schlusssatzes
  choice: 'Als allgemeinen Grundsatz wiedergegeben: „junger Wein gehört in neue Weinschläuche“'
  alternative: „Jungen Wein muss man in neue Weinschläuche füllen“ oder „Man füllt jungen Wein in neue Weinschläuche“
  rationale: Im Griechischen fehlt im Schlusssatz ein Verb. Die gewählte Fassung erhält die sprichwortartige Kürze und vermeidet es, den Satz ausdrücklich als Gebot zu deuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. „Junger Wein“ ist idiomatisch und bildet mit „neue Weinschläuche“ die unterschiedliche griechische Wortwahl νέος/καινός angemessen ab.
