id: MRK.2.17
reference: Mark 2:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: de
  text: 'Und als Jesus das hörte, sagt er zu ihnen: »Die Starken[a] brauchen keinen Arzt, sondern die Kranken. Ich bin nicht gekommen, Gerechte[b] zu rufen, sondern Sünder.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Die Gesunden brauchen keinen Arzt, sondern die Kranken.« Das griechische Wort bezeichnet wörtlich die Starken beziehungsweise diejenigen, die bei Kräften sind.'
    reason: lexical_alternative
  - marker: b
    text: »Gerechte« kann im Zusammenhang ironisch gemeint sein, also Menschen bezeichnen, die als gerecht gelten oder sich selbst dafür halten; im griechischen Text steht jedoch einfach »Gerechte«.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: als Jesus das hörte
  rationale: Der vorausgehende Aoristpartizip wird als zeitlicher Nebensatz natürlich wiedergegeben; »das« nimmt den aus dem Zusammenhang erschließbaren Inhalt auf.
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens bewahrt Markus’ anschauliches historisches Präsens.
- source_word: οἱ ἰσχύοντες
  choice: die Starken
  rationale: Die Wiedergabe hält am Grundsinn »stark, bei Kräften« fest, statt ihn bereits als »gesund« auszulegen.
- source_word: χρείαν ἔχουσιν
  choice: brauchen
  rationale: Die deutsche idiomatische Entsprechung ist klar und bewahrt den sprichwortartigen Gegensatz.
- source_word: ἰατροῦ
  choice: einen Arzt
  rationale: »Arzt« ist die natürliche, gegenwärtige und würdige deutsche Bezeichnung.
- source_word: οἱ κακῶς ἔχοντες
  choice: die Kranken
  rationale: Die Wendung bezeichnet im medizinischen Zusammenhang Menschen, denen es schlecht geht, also Kranke.
- source_word: οὐκ ἦλθον
  choice: Ich bin nicht gekommen
  rationale: Das deutsche Perfekt ist bei einem Kommen mit gegenwärtiger Zielsetzung idiomatisch und gibt Jesu Sendungsaussage natürlich wieder.
- source_word: καλέσαι
  choice: zu rufen
  rationale: »Rufen« bewahrt die Offenheit zwischen Aufforderung, Berufung und Einladung, ohne sie einseitig festzulegen.
- source_word: δικαίους
  choice: Gerechte
  rationale: Das substantivierte Adjektiv wird direkt wiedergegeben, ohne eine mögliche Ironie in den Haupttext einzutragen.
- source_word: ἁμαρτωλούς
  choice: Sünder
  rationale: Dies ist die etablierte und sachlich genaue Wiedergabe der moralisch-religiösen Personenbezeichnung.
theological_decisions:
- issue: Ob »Gerechte« ironisch oder einschränkend auszulegen ist
  choice: Gerechte
  alternative: Menschen, die sich für gerecht halten
  rationale: Der griechische Text bezeichnet sie schlicht als »Gerechte«. Eine ironische Lesart ist im Zusammenhang möglich, soll aber nicht stillschweigend in den Haupttext aufgenommen werden.
- issue: Sinnweite von καλέσαι
  choice: zu rufen
  alternative: einzuladen / zu berufen
  rationale: »Rufen« lässt die theologisch bedeutsame Spannweite des Verbs bestehen und legt weder ausschließlich Einladung noch formelle Berufung fest.
- issue: Bildlicher Gegensatz zwischen Starken und Kranken
  choice: die Starken … die Kranken
  alternative: die Gesunden … die Kranken
  rationale: Die Formulierung bewahrt den wörtlicheren Ausdruck des ersten Glieds und zugleich den klaren medizinischen Sinn des zweiten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchcharakter. Das historische Präsens wurde beibehalten; konfessionell geprägte Zusätze wurden vermieden.
