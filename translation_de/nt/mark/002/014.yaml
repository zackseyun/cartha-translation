source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: de
  text: 'Als Jesus vorbeiging, sah er Levi, den Sohn des Alphäus, an der Zollstelle[a] sitzen. Er sagt zu ihm: »Folge mir!« Da stand Levi auf und folgte ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an der Steuerstelle« bzw. »an der Mautstelle«. Das griechische Wort bezeichnet einen Ort, an dem Steuern, Zölle oder andere Abgaben erhoben wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: als Jesus weiterging
  rationale: Das präsentische Partizip zeichnet eine gleichzeitig andauernde Begleithandlung. „Als Jesus weiterging“ ist natürliches Deutsch und nennt zur Klarheit das im Kontext gegebene Subjekt.
- source_word: εἶδεν
  choice: sah er
  rationale: Die schlichte Wiedergabe von ὁράω vermeidet die zusätzliche Nuance von „bemerkte“.
- source_word: Λευὶν
  choice: Levi
  rationale: Der Personenname wird in der im Deutschen üblichen Form wiedergegeben.
- source_word: τὸν τοῦ Ἁλφαίου
  choice: den Sohn des Alphäus
  rationale: Die Genitivkonstruktion bezeichnet Levis Abstammung; „Sohn“ muss im Deutschen ergänzt werden.
- source_word: καθήμενον
  choice: sitzen
  rationale: Der präsentische Partizip beschreibt Levis Haltung in dem Augenblick, als Jesus ihn sah.
- source_word: ἐπὶ τὸ τελώνιον
  choice: an der Zollstelle
  rationale: τελώνιον bezeichnet den Ort, an dem Steuern, Zölle oder Abgaben erhoben wurden. „Zollstelle“ ist konkret und lässt die genaue Art der Abgabe offen.
- source_word: λέγει
  choice: er sagt
  rationale: Das historische Präsens des Markus bleibt erhalten und bewahrt die Lebendigkeit der Erzählung.
- source_word: Ἀκολούθει μοι
  choice: Folge mir!
  rationale: Die direkte Aufforderung gibt den präsentischen Imperativ knapp wieder, ohne ein im Griechischen nicht ausdrückliches „Komm“ hinzuzufügen.
- source_word: ἀναστὰς
  choice: da stand Levi auf
  rationale: Der Aoristpartizip bezeichnet die der Haupthandlung vorausgehende Reaktion. Die erneute Nennung Levis verhindert im Deutschen eine mögliche Verwechslung mit Jesus.
- source_word: ἠκολούθησεν αὐτῷ
  choice: folgte ihm
  rationale: Die Formulierung wahrt die verbale Verbindung zwischen Jesu Ruf und Levis Antwort.
theological_decisions:
- issue: Historisches Präsens in der markinischen Erzählung
  choice: λέγει wird mit „er sagt“ im Präsens wiedergegeben, während die umgebenden Aoristformen in der Vergangenheit stehen.
  alternative: 'Einheitliche Vergangenheitsform: „er sagte“.'
  rationale: Die Tempusspannung gehört zum lebendigen Erzählstil des griechischen Textes und lässt sich auch in verständlichem modernem Deutsch bewahren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens wird bewusst erhalten. „Da“ macht die unmittelbare Reaktion Levis idiomatisch deutlich, ohne einen zusätzlichen theologischen Gehalt einzutragen.
