  terminology: „Levi“, „Alphäus“, „Folge mir“ und „Zollstelle“ sind angemessen. „Zollstelle“ wahrt die konkrete Bedeutung von τελώνιον, ohne die erhobene Abgabe zu eng festzulegen. Die Fußnote bietet sachgerechte lexikalische Alternativen.
