id: MRK.2.26
reference: Mark 2:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: de
  text: wie er zur Zeit des Hohen Priesters Abjatar[a] in das Haus Gottes ging und die Brote der Gegenwart[b] aß, die außer den Priestern niemand essen darf, und auch denen davon gab, die bei ihm waren?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während der Amtszeit des Hohen Priesters Abjatar“. Die Wendung kann auch allgemeiner die mit dem Hohen Priester Abjatar verbundene Zeit oder den entsprechenden Erzählzusammenhang bezeichnen.'
    reason: alternative_reading
  - marker: b
    text: Die „Brote der Gegenwart“ waren geweihte Brote, die im Heiligtum vor Gott ausgelegt wurden; traditionell „Schaubrote“ genannt.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: wie
  rationale: Leitet den Inhalt dessen ein, was David tat, und gibt die erzählende Rückfrage natürlich wieder.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: in das Haus Gottes ging
  rationale: Gibt Verb und Richtungsangabe eng und in natürlichem modernem Deutsch wieder; „Haus Gottes“ bewahrt die griechische Ausdrucksweise.
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: zur Zeit des Hohen Priesters Abjatar
  rationale: ἐπί mit Genitiv kann in zeitlicher Bedeutung „zur Zeit von“ heißen. Die Formulierung wahrt die zeitliche Zuordnung, ohne sie unnötig auf die Amtszeit zu verengen.
- source_word: ἄρτους τῆς προθέσεως
  choice: die Brote der Gegenwart
  rationale: Eine transparente Wiedergabe des kultischen Ausdrucks für die vor Gott ausgelegten geweihten Brote; die Erläuterung erfolgt in der Fußnote.
- source_word: ἔφαγεν
  choice: aß
  rationale: Schlichte und natürliche Wiedergabe des erzählenden Aorists.
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: die außer den Priestern niemand essen darf
  rationale: Bringt sowohl das Verbot als auch die Ausnahme idiomatisch und eindeutig zum Ausdruck.
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: und auch denen davon gab, die bei ihm waren
  rationale: Bewahrt die nicht näher bestimmte Bezeichnung der Begleiter. „davon“ nimmt das im Griechischen vorausgesetzte Objekt natürlich wieder auf.
theological_decisions:
- issue: Zeitangabe mit Abjatar und ihr Verhältnis zum alttestamentlichen Parallelbericht
  choice: zur Zeit des Hohen Priesters Abjatar
  alternative: während der Amtszeit des Hohen Priesters Abjatar; im Abschnitt über den Hohen Priester Abjatar
  rationale: Die griechische Wendung erlaubt eine breitere zeitliche beziehungsweise erzählerische Zuordnung. Der Haupttext wahrt diese Offenheit; die Spannung zu 1. Samuel 21 wird nicht durch eine engere Übersetzung stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzgestalt bleibt als abhängige Frage erhalten. „Brote der Gegenwart“ ist bewusst transparent und wird kulturell erläutert; die Abjatar-Wendung bleibt hinsichtlich ihrer genauen zeitlichen Reichweite offen.
