  source_fidelity: Die Übersetzung gibt die Satzfrage, die zeitlich offene Wendung ἐπὶ Ἀβιαθὰρ ἀρχιερέως, das Eintreten in das Haus Gottes, die kultischen Brote, die priesterliche Ausnahme und die Gabe an Davids Begleiter zuverlässig wieder. „zur Zeit des Hohen Priesters Abjatar“ wahrt die im Griechischen bestehende Auslegungsweite, ohne die bekannte chronologische Frage aufzulösen.
  naturalness: Der Satz ist idiomatisches, modernes und würdiges Standarddeutsch. Die abhängige Frage bleibt sinnvoll erhalten. „die außer den Priestern niemand essen darf“ ist klar und natürlich; „davon“ macht das im Griechischen ausgelassene Objekt im Deutschen angemessen explizit.
  terminology: „Haus Gottes“, „Brote der Gegenwart“ und „Priester“ sind konsistent und sachlich passend. Die Fußnote erläutert den kultischen Begriff verständlich und nennt „Schaubrote“ lediglich als traditionelle Bezeichnung. Die Schreibung „Hoher Priester“ ist verständlich und im gegebenen Kontext vertretbar.
