id: MRK.2.19
reference: Mark 2:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihnen: „Können etwa die Hochzeitsgäste[a] fasten, solange der Bräutigam bei ihnen ist? Solange sie den Bräutigam bei sich haben, können sie nicht fasten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Söhne des Hochzeitssaals“ oder „die Söhne des Brautgemachs“; eine Redewendung für die Menschen, die an der Hochzeitsfeier teilnehmen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: Können etwa ... fasten?
  rationale: μή mit dem Indikativ leitet hier eine rhetorische Frage ein, auf die eine verneinende Antwort erwartet wird. „Können etwa …?“ gibt diese Erwartung im Deutschen natürlich wieder, ohne die Frage in eine bloße Aussage umzuwandeln.
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: die Hochzeitsgäste
  rationale: Die wörtliche Wendung „Söhne des Hochzeitssaals/Brautgemachs“ ist ein Idiom für die an der Hochzeitsfeier Beteiligten. „Hochzeitsgäste“ vermittelt die soziale Rolle verständlich und legt sich nicht unnötig auf einen engeren Kreis von Begleitern des Bräutigams fest.
- source_word: ἐν ᾧ ... ἐστιν
  choice: solange ... bei ihnen ist
  rationale: Die Konstruktion hat hier zeitlichen Sinn. „Solange“ drückt sowohl die Gleichzeitigkeit als auch die begrenzte Dauer klar aus.
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: der Bräutigam / den Bräutigam
  rationale: „Bräutigam“ bewahrt das Bild und seine biblisch-theologische Resonanz und ist zugleich modernes Standarddeutsch.
- source_word: μετ’ αὐτῶν
  choice: bei ihnen / bei sich
  rationale: μετά mit Genitiv bezeichnet Begleitung beziehungsweise Anwesenheit. Die idiomatischen deutschen Formulierungen geben dies direkt wieder.
- source_word: ὅσον χρόνον
  choice: Solange
  rationale: Die Wendung bezeichnet die gesamte Dauer eines Zustands; „solange“ ist dafür die natürliche deutsche Entsprechung.
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: sie den Bräutigam bei sich haben
  rationale: Diese Wiedergabe erhält das ausdrücklich verwendete ἔχουσιν („haben“) und bleibt im Deutschen idiomatisch.
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Und Jesus sagte zu ihnen
  rationale: Eine direkte, natürliche und dem erzählenden Register angemessene Wiedergabe der griechischen Einleitung.
theological_decisions:
- issue: Bildliche Identifikation Jesu mit dem Bräutigam
  choice: Das Bräutigambild bleibt ohne zusätzliche Ausdeutung im Haupttext erhalten.
  alternative: Die messianische oder heilsgeschichtliche Bedeutung des Bräutigambildes ausdrücklich erläutern.
  rationale: Der Vers legt durch Jesu Antwort eine Verbindung zu ihm nahe, formuliert deren volle theologische Bedeutung aber nicht ausdrücklich. Die Übersetzung bewahrt daher das Bild und lässt seine Deutung offen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die rhetorische Frage wird als echte Frage bewahrt; die idiomatische Personenbezeichnung wird im Haupttext verständlich wiedergegeben und in der Fußnote wörtlich erläutert.
