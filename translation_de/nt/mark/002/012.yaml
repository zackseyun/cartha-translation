  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: de
  text: 'Und er stand auf, nahm sofort die Matte und ging vor den Augen aller hinaus, sodass alle außer sich vor Staunen gerieten, Gott priesen und sagten: »So etwas haben wir noch nie gesehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγέρθη
  choice: er stand auf
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Verb, dass der zuvor Gelähmte Jesu Aufforderung körperlich ausführt. Die Form kann zwar passiv verstanden werden, doch »wurde aufgerichtet« wäre hier unnatürlich und würde eine nicht im Vordergrund stehende theologische Deutung nahelegen.
- source_word: εὐθύς
  choice: sofort
  rationale: Bewahrt die für Markus typische Unmittelbarkeit in natürlichem, prägnantem Deutsch.
- source_word: ἄρας τὸν κράβαττον
  choice: nahm ... die Matte
  rationale: αἴρω bezeichnet hier das Aufnehmen zum Tragen; κράβαττος ist eine einfache Schlaf- oder Liegematte, nicht notwendig ein Bett oder eine Trage.
- source_word: ἔμπροσθεν πάντων
  choice: vor den Augen aller
  rationale: Gibt die öffentliche Sichtbarkeit des Vorgangs idiomatisch wieder, ohne einen Weg mitten durch die Menge zwingend festzulegen.
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: Da gerieten alle außer sich vor Staunen
  rationale: ἐξίστημι drückt eine starke, überwältigende Bestürzung beziehungsweise Verwunderung aus; diese Fassung erhält die Intensität deutlicher als nur »waren erstaunt«.
- source_word: δοξάζειν τὸν θεόν
  choice: priesen Gott
  rationale: Im Deutschen bezeichnet »Gott preisen« die hier gemeinte anerkennende, Gott ehrende Reaktion natürlicher als das mögliche, aber weniger geläufige »Gott verherrlichen«.
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: So etwas haben wir noch nie gesehen
  rationale: Gibt die knappe griechische Wendung idiomatisch wieder und bewahrt ihre Aussage, dass das Erlebte für die Anwesenden beispiellos war.
theological_decisions:
- issue: Mögliche Auferstehungsanklänge von ἠγέρθη
  choice: »er stand auf« entsprechend der konkreten Heilungsszene
  alternative: »er wurde aufgerichtet« oder »er wurde auferweckt«
  rationale: Obwohl ἐγείρω andernorts Auferstehung bezeichnen kann, steht hier das körperliche Aufstehen des geheilten Gelähmten als Antwort auf Jesu Befehl im Vordergrund. Die Übersetzung schließt mögliche lexikalische Anklänge nicht grundsätzlich aus, importiert sie aber nicht in den Hauptsinn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze erhalten das zügige Erzähltempo des Markus; »außer sich vor Staunen« wahrt zugleich die ungewöhnliche Stärke von ἐξίστασθαι.
