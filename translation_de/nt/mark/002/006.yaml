base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: de
  text: 'Doch einige der Schriftgelehrten saßen dort und überlegten in ihren Herzen[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dachten bei sich“ beziehungsweise „überlegten in Gedanken“. Wörtlich steht im Griechischen „in ihren Herzen“, eine biblische Ausdrucksweise für inneres Denken und Erwägen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν δέ
  choice: Doch ... saßen
  rationale: δέ leitet einen leichten Kontrast und den Blickwechsel zur inneren Reaktion einer anderen Gruppe ein. „Doch“ gibt dies knapp wieder; das finite „saßen“ verbindet ἦσαν mit dem Partizip καθήμενοι natürlich im Deutschen.
- source_word: τινες τῶν γραμματέων
  choice: einige der Schriftgelehrten
  rationale: Die partitive Fügung bezeichnet einen Teil der Schriftgelehrten, nicht notwendig die gesamte Gruppe. „Schriftgelehrte“ ist die etablierte und sachgerechte Wiedergabe im Evangelienkontext.
- source_word: ἐκεῖ
  choice: dort
  rationale: Das lokale Adverb wird unmittelbar und idiomatisch wiedergegeben.
- source_word: καθήμενοι
  choice: saßen
  rationale: Das Partizip beschreibt ihre Haltung in der Szene. Zusammen mit ἦσαν ist im Deutschen die finite Form „saßen“ am natürlichsten.
- source_word: διαλογιζόμενοι
  choice: überlegten
  rationale: Das Verb bezeichnet hier inneres Erwägen beziehungsweise Nachdenken, bevor der Einwand ausgesprochen wird. „Überlegten“ wahrt diesen Vorgang, ohne bereits ein Streitgespräch anzudeuten.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: in ihren Herzen
  rationale: Die wörtliche Wiedergabe bewahrt die biblische Rede vom Herzen als Ort inneren Denkens und Erwägens, statt sie auf die moderne Kategorie „Verstand“ zu verengen.
theological_decisions:
- issue: Anthropologische Bedeutung von καρδίαις
  choice: in ihren Herzen
  alternative: bei sich / in Gedanken
  rationale: Die Formulierung bewahrt die Vorstellungswelt des Ausgangstextes, in der das Herz auch inneres Denken und Erwägen umfasst. Eine moderne Trennung von Gefühl und Verstand wird dem Text nicht aufgezwungen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der Doppelpunkt bleibt erhalten, da der folgende Vers den Inhalt ihrer inneren Überlegung nennt.
