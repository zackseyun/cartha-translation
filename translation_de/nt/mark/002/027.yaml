  text: καὶ ἔλεγεν αὐτοῖς· Τὸ σάββατον διὰ τὸν ἄνθρωπον ἐγένετο ⸀καὶ οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Der Sabbat ist um des Menschen willen entstanden und nicht der Mensch um des Sabbats willen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Sabbat ist um der Menschen willen entstanden und nicht die Menschen um des Sabbats willen.“ Das griechische Wort für „Mensch“ steht im Singular und ist allgemein auf Menschen bezogen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Der griechische Imperfekt kann den fortlaufenden Verlauf markieren; im natürlichen deutschen Erzählstil wird eine einzelne Äußerung jedoch idiomatisch mit dem Präteritum „sagte“ wiedergegeben.
- source_word: τὸ σάββατον
  choice: der Sabbat
  rationale: Der Ausdruck bezeichnet hier den Sabbat als Tag und Einrichtung; „der Sabbat“ ist die etablierte und hinreichend klare deutsche Wiedergabe.
- source_word: διὰ τὸν ἄνθρωπον
  choice: für den Menschen
  rationale: διά mit Akkusativ bezeichnet hier Zweck oder Nutzen. Der Singular ἄνθρωπος wird repräsentativ gebraucht und lässt sich im Deutschen natürlich und zugleich formal entsprechend mit „der Mensch“ wiedergeben.
- source_word: ἐγένετο
  choice: ist … da
  rationale: γίνομαι bezeichnet ein Ins-Dasein-Kommen. In Verbindung mit der Zweckangabe gibt „ist für … da“ den Sinn idiomatisch und klar wieder, ohne ausdrücklich eine Herstellung zu behaupten.
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: nicht der Mensch für den Sabbat
  rationale: Die knappe elliptische Gegenüberstellung des Griechischen wird beibehalten und bewahrt die rhetorische Symmetrie der beiden Satzhälften.
theological_decisions:
- issue: Repräsentativer Singular ἄνθρωπος in einer allgemeinen Aussage
  choice: „der Mensch“ im Haupttext
  alternative: „die Menschen“ oder „die Menschheit“
  rationale: Die Aussage gilt allen Menschen. „Der Mensch“ wahrt den repräsentativen Singular und ist im Deutschen geschlechtsübergreifend verständlich, ohne die Form zu einem Plural oder Abstraktum zu verändern.
- issue: Bedeutung von ἐγένετο im Blick auf Ursprung und Zweck des Sabbats
  choice: „ist für den Menschen da“
  alternative: „wurde um des Menschen willen geschaffen“ oder „kam für den Menschen ins Dasein“
  rationale: Die gewählte Formulierung hebt den im Kontext zentralen Zweck beziehungsweise Nutzen hervor, ohne die Aussage auf eine bestimmte Art des Entstehens festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe antithetische Form bleibt erhalten; „ist … da“ ist allgemeinverständlich und gibt die Zweckrelation natürlich wieder.
