id: MRK.2.8
reference: Mark 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: de
  text: 'Und sofort erkannte Jesus in seinem Geist[a], dass sie so bei sich überlegten, und sagte zu ihnen: »Warum überlegt ihr das in euren Herzen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch seinen Geist«; auch möglich: »in sich selbst«. Das Griechische legt nicht ausdrücklich fest, auf welche Weise Jesus dies erkannte.'
    reason: Lexikalische und grammatische Mehrdeutigkeit des Dativs τῷ πνεύματι αὐτοῦ.
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt das für Markus typische drängende Erzähltempo in natürlichem modernem Deutsch.
- source_word: ἐπιγνοὺς
  choice: erkannte
  rationale: Gibt die klare Wahrnehmung bzw. Erkenntnis des Aoristpartizips wieder, ohne die Art dieser Erkenntnis näher festzulegen.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: in seinem Geist
  rationale: Spiegelt die griechische Formulierung eng wider und lässt offen, ob der Dativ vor allem den inneren Bereich oder das Mittel der Wahrnehmung bezeichnet.
- source_word: οὕτως διαλογίζονται ἐν ἑαυτοῖς
  choice: sie so bei sich überlegten
  rationale: Kennzeichnet den Vorgang als inneres Überlegen und nicht als ausgesprochenes Streitgespräch.
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: Warum überlegt ihr das
  rationale: Τί hat hier idiomatisch begründungsfragende Kraft; die Formulierung ist im Deutschen natürlich und bewahrt den Bezug auf diese Gedanken.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: in euren Herzen
  rationale: Bewahrt die biblische Rede vom Herzen als Zentrum des Denkens und Wollens, statt sie auf den Verstand zu verengen.
theological_decisions:
- issue: Art der Erkenntnis Jesu in τῷ πνεύματι αὐτοῦ
  choice: Die Formulierung „in seinem Geist“ bleibt stehen, ohne den Erkenntnisweg zu bestimmen.
  alternative: Deutung als ausdrückliche Aussage über göttliche Allwissenheit, als Wirken des Heiligen Geistes oder ausschließlich als menschliche Intuition.
  rationale: Der Vers sagt eindeutig, dass Jesus ihr inneres Überlegen erkannte; die griechische Wendung legt jedoch nicht ausdrücklich fest, auf welche Weise. Die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Das historische Präsens λέγει wird für einen flüssigen deutschen Erzählstil mit „sagte“ wiedergegeben; die Wiederholung von „überlegen“ erhält die sprachliche Verknüpfung des griechischen διαλογίζομαι.
