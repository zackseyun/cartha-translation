review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt εὐθύς mit „sofort“ treffend wieder und bewahrt die zeitliche Abfolge des Partizips ἐπιγνούς: Jesus erkennt unmittelbar, dass die anderen innerlich überlegen. „In seinem Geist“ entspricht τῷ πνεύματι αὐτοῦ eng, ohne die Art dieser Erkenntnis festzulegen. „Bei sich“ gibt ἐν ἑαυτοῖς idiomatisch als inneres Denken wieder; „in euren Herzen“ bewahrt die bildhafte und anthropologische Ausdrucksweise von ἐν ταῖς καρδίαις ὑμῶν. Die begründungsfragende Wiedergabe von Τί mit „Warum“ ist im Deutschen und im Kontext angemessen.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch und zugleich angemessen würdevoll. Die Wiederaufnahme von „überlegen“ verbindet Jesu Wahrnehmung mit seiner Frage, wie im griechischen διαλογίζομαι. „Warum überlegt ihr das in euren Herzen?“ ist verständlich; das demonstrative „das“ bezieht sich natürlich auf die zuvor gemeinten Überlegungen.
  terminology: „Geist“ und „Herzen“ sind theologisch und biblisch angemessen, ohne eine konfessionelle Deutung einzutragen. Die Fußnote wahrt die grammatische und semantische Offenheit des Dativs und vermeidet eine Festlegung auf Allwissenheit, Geisteswirken oder bloße Intuition. Der Fußnotenanker steht unmittelbar bei der mehrdeutigen Wendung.
