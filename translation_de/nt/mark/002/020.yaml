source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: de
  text: Doch es werden Tage kommen, da der Bräutigam von ihnen weggenommen wird; dann werden sie an jenem Tag fasten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an diesem Tag“. Im Griechischen steht „Tag“ im Singular, nicht „an/in jenen Tagen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Doch es werden Tage kommen
  rationale: Die geläufige Wendung gibt das zukünftige Eintreten einer veränderten Lage wieder. „Doch“ bildet den durch δέ bezeichneten Gegensatz zur gegenwärtigen Hochzeitssituation ab.
- source_word: ὅταν
  choice: da
  rationale: In Verbindung mit dem Aorist Konjunktiv bezeichnet ὅταν hier ein zukünftiges Geschehen. Das zeitliche „da“ fügt sich im Deutschen natürlich an „es werden Tage kommen“ an, ohne eine wiederholte Handlung anzudeuten.
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: von ihnen weggenommen wird
  rationale: Die passive Form und die Trennung von der Gruppe bleiben erhalten. Die Formulierung lässt sowohl den Handelnden als auch die genaue Art der Wegnahme offen.
- source_word: ὁ νυμφίος
  choice: der Bräutigam
  rationale: „Bräutigam“ ist die genaue und im biblischen Sprachgebrauch vertraute Wiedergabe der Hochzeitsmetapher.
- source_word: καὶ τότε
  choice: dann
  rationale: „Dann“ stellt die zeitliche Folge klar heraus; das griechische καί muss vor dem deutschen Semikolon nicht zusätzlich mit „und“ wiedergegeben werden.
- source_word: νηστεύσουσιν
  choice: werden sie fasten
  rationale: „Fasten“ ist die direkte, allgemein verständliche Bezeichnung für den religiös bedeutsamen Verzicht auf Nahrung.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: an jenem Tag
  rationale: Im Deutschen ist „an jenem Tag“ die natürliche Wiedergabe von ἐν mit dem Dativ bei einer Tagesangabe. Der griechische Singular und die hervorgehobene Bezugnahme bleiben erhalten.
theological_decisions:
- issue: Bildhafte Bezeichnung Jesu als Bräutigam
  choice: Die Bezeichnung „der Bräutigam“ bleibt als Metapher stehen.
  alternative: „wenn ich von ihnen weggenommen werde“
  rationale: Aus dem Zusammenhang ist der Selbstbezug Jesu erkennbar, doch der griechische Wortlaut spricht bildhaft vom Bräutigam. Die Übersetzung bewahrt daher die literarische und theologische Spannung.
- issue: Art und Urheber der Wegnahme des Bräutigams
  choice: Das Passiv „weggenommen wird“ bleibt ohne nähere Bestimmung erhalten.
  alternative: „im Tod weggenommen wird“ oder „ihnen gewaltsam entrissen wird“
  rationale: Der Ausspruch weist auf Jesu bevorstehende Entfernung hin, die im größeren Zusammenhang auf seinen Tod bezogen werden kann. Der Vers selbst nennt jedoch weder den Handelnden noch ausdrücklich Todesart oder Gewalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzkonstruktion „Es werden Tage kommen, da …“ bewahrt den feierlichen Ton, bleibt aber allgemein verständlich. Das Semikolon macht die zeitliche und gedankliche Folge deutlich.
