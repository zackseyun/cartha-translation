  source_fidelity: 'Der deutsche Haupttext gibt die griechische Satzfolge, das unbestimmte zukünftige Eintreten („Tage werden kommen“), das unbestimmte Passiv der Wegnahme, die Metapher „Bräutigam“, die Folge des Fastens sowie den Singular von ἐν ἐκείνῃ τῇ ἡμέρᾳ zuverlässig wieder. Die Fußnote ist jedoch nicht quellentreu formuliert: ἐκείνῃ bedeutet „jenem“, nicht „diesem“, und „einen“ ist im griechischen Text nicht ausdrücklich enthalten.'
