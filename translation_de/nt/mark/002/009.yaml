  variant: modern standard German
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: de
  text: 'Was ist leichter: zu dem gelähmten Mann zu sagen: »Deine Sünden sind vergeben«, oder zu sagen: »Steh auf, nimm deine Matte und geh«?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Was ist leichter
  rationale: Die Formulierung gibt die vergleichende Frage direkt und idiomatisch im modernen Deutschen wieder.
- source_word: εἰπεῖν
  choice: zu sagen
  rationale: Das Verb leitet in beiden Satzteilen direkte Rede ein; die gleiche Wiedergabe bewahrt die Parallelität.
- source_word: τῷ παραλυτικῷ
  choice: zu dem Gelähmten
  rationale: Die substantivierte Bezeichnung ist im Deutschen natürlich und bezeichnet die von Lähmung betroffene Person ohne zusätzliche medizinische Präzisierung.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Deine Sünden sind vergeben
  rationale: Das Präsens wird als bestehender Zustand der Vergebung wiedergegeben. Die Formulierung wahrt das Passiv und legt weder den Zeitpunkt noch den unausgesprochenen Handelnden näher fest.
- source_word: Ἔγειρε
  choice: Steh auf
  rationale: Der Imperativ bezeichnet hier das körperliche Aufstehen und wird klar und gegenwärtig formuliert.
- source_word: ἆρον
  choice: nimm
  rationale: Im Zusammenhang bedeutet das Verb, die Matte aufzunehmen und mitzunehmen. Das knappe »nimm« ist im Deutschen in dieser Befehlsfolge natürlich.
- source_word: τὸν κράβαττόν σου
  choice: deine Matte
  rationale: κράβαττος bezeichnet eine einfache, tragbare Schlafunterlage; »Matte« vermeidet die Vorstellung eines schweren modernen Bettes.
- source_word: περιπάτει
  choice: geh umher
  rationale: Die Wiedergabe bewahrt gegenüber einem bloßen »geh« deutlicher die Bedeutung des Gehens bzw. Umhergehens und passt zur sichtbaren Wiederherstellung der Gehfähigkeit.
theological_decisions:
- issue: Form der Vergebungszusage
  choice: Deine Sünden sind vergeben
  alternative: Deine Sünden sind dir vergeben worden
  rationale: Die gewählte Fassung bewahrt die präsentische Zustandsaussage und die theologische Spannung um Jesu Vollmacht, ohne Zeitpunkt oder Handelnden über den griechischen Wortlaut hinaus festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Konstruktion »zu sagen … oder zu sagen« bleibt erhalten. Keine Fußnote ist nötig, da die aspektuelle Offenheit der Vergebungsformel in der Hauptübersetzung angemessen gewahrt wird.
