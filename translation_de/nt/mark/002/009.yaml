  verdict: revise
  source_fidelity: Die Satzstruktur, die Vergleichsfrage, die Vergebungszusage und die Befehlsfolge entsprechen dem griechischen Text. »Geh umher« gibt περιπάτει jedoch enger als ein Umhergehen bzw. Herumlaufen wieder; im vorliegenden Heilungsbefehl ist das unmarkierte »geh« die treffendere und idiomatischere Entsprechung.
  naturalness: Die Übersetzung ist insgesamt modernes, würdiges Standarddeutsch. »zu dem gelähmten Mann« ist gegenüber der Substantivierung »zu dem Gelähmten« gegenwartsnäher und klar, ohne den Sinn zu verändern. »Geh« ist hier natürlicher als »geh umher«.
  terminology: »Sünden sind vergeben« bewahrt die passive, präsentische Vergebungsformel und lässt Handelnden sowie zeitliche Nuance offen. »Matte« ist für κράβαττος passend. Die Bezeichnung »gelähmter Mann« ist sachlich und nicht medizinisch überpräzisiert.
