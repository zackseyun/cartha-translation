  - severity: low
    issue: Substantivierung »der Gelähmte«
    rationale: Sie ist nicht falsch, doch »der gelähmte Mann« ist im modernen Standarddeutsch personbezogener und entspricht dem im griechischen Maskulinum mitgemeinten Mann.
