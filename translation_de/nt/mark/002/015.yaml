review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft die zentralen Begriffe und bewahrt die Mehrdeutigkeit von αὐτοῦ („seinem Haus“) zutreffend. Die Satzverknüpfung des griechischen καί nach dem einleitenden γίνεται-Konstrukt sollte jedoch im Deutschen enger abgebildet werden: Die vielen Zolleinnehmer und Sünder gehören zum selben geschilderten Geschehen, nicht zu einem abgetrennten neuen Satz.'
  naturalness: „Zu Tisch liegen“ ist im modernen Standarddeutsch verständlich und für die antike Mahlhaltung angemessen. Mit einem einleitenden Temporalsatz wird der Vers zugleich natürlicher und klarer lesbar.
  terminology: „Zolleinnehmer“, „Sünder“ und „Jünger“ sind sachgerecht. Die Fußnote wahrt die textliche Offenheit hinsichtlich des Hausbesitzers und erläutert die Deutungsoptionen ohne sie zur Übersetzung zu machen.
  issues:
  - severity: medium
    issue: Der zweite Hauptsatz ist vom einleitenden „Und es geschah“ syntaktisch abgetrennt.
    rationale: Im Griechischen verbindet καί die Aussage über die vielen Zolleinnehmer und Sünder unmittelbar mit dem geschilderten Mahl. Die deutsche Fassung lässt „Es geschah, dass er … zu Tisch lag“ als vollständige, aber inhaltlich zu eng gefasste Einheit stehen. Ein Temporalsatz verbindet beide Aussagen idiomatisch und treuer.
  revised_text: Und es geschah, als er in seinem Haus[a] zu Tisch lag, dass viele Zolleinnehmer und Sünder zusammen mit Jesus und seinen Jüngern zu Tisch lagen; denn es waren viele, und sie folgten ihm.
  revised_footnotes:
