source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: de
  text: Und es geschah, als er in seinem Haus[a] zu Tisch lag, dass viele Zolleinnehmer und Sünder zusammen mit Jesus und seinen Jüngern zu Tisch lagen; denn es waren viele, und sie folgten ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »im Haus von Levi«; manche verstehen: »im Haus von Jesus«. Im Griechischen steht nur: »in seinem Haus«.'
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεται
  choice: es geschah
  rationale: Das historische Präsens führt bei Markus die Erzählung lebhaft weiter; im natürlichen deutschen Erzählstil steht hier das Präteritum.
- source_word: κατακεῖσθαι
  choice: zu Tisch lag
  rationale: Das Verb bezeichnet die damalige Körperhaltung beim Essen und nicht ein bloßes Liegen. Die Wendung macht den Mahlzusammenhang deutlich.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: in seinem Haus
  rationale: Die Formulierung gibt die Ortsangabe und das mehrdeutige Possessivpronomen direkt wieder, ohne dessen Bezug im Haupttext festzulegen.
- source_word: τελῶναι
  choice: Zolleinnehmer
  rationale: Eine klare moderne Bezeichnung für Personen, die im damaligen Abgaben- und Zollsystem Einnahmen einzogen.
- source_word: ἁμαρτωλοὶ
  choice: Sünder
  rationale: Die direkte und im biblischen Sprachgebrauch verständliche Wiedergabe bewahrt die religiös und gesellschaftlich markierte Bezeichnung des Textes.
- source_word: συνανέκειντο
  choice: lagen zusammen mit … zu Tisch
  rationale: Die Wiedergabe bewahrt sowohl die gemeinsame Tischgemeinschaft als auch die damalige Essenshaltung.
- source_word: μαθηταῖς
  choice: Jüngern
  rationale: Die etablierte deutsche Wiedergabe bezeichnet Menschen, die Jesus nachfolgen und von ihm lernen.
- source_word: ἦσαν γὰρ πολλοί
  choice: denn es waren viele
  rationale: Die knappe Formulierung erhält den erklärenden Charakter von γάρ und die im Griechischen offenbleibende Bezugsweite.
- source_word: ἠκολούθουν αὐτῷ
  choice: sie folgten ihm
  rationale: Das Präteritum gibt im Kontext die andauernde beziehungsweise wiederholte Nachfolge des Imperfekts natürlich wieder.
theological_decisions:
- issue: Bezugswort von αὐτοῦ in „seinem Haus“
  choice: Das Haus wird im Haupttext keinem Namen ausdrücklich zugeordnet.
  alternative: Levis Haus; nach anderer Auffassung Jesu Haus
  rationale: Das griechische Pronomen ist im unmittelbaren Zusammenhang mehrdeutig. Die Übersetzung bewahrt diese Mehrdeutigkeit und nennt die verbreiteten Deutungen in einer Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu Tisch liegen“ ist etwas ungewohnt, vermittelt jedoch verständlich die antike Essenshaltung; die Wiederholung hält sich eng an die markinische Darstellung. Die Mehrdeutigkeit des Hausbesitzers bleibt erhalten.
