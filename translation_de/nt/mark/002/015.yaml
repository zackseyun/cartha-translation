  to: Und es geschah, als er in seinem Haus[a] zu Tisch lag, dass viele Zolleinnehmer und Sünder zusammen mit Jesus und seinen Jüngern zu Tisch lagen; denn es waren viele, und sie folgten ihm.
  rationale: Die Revision stellt die im griechischen Satz durch καί verbundene Mahlgemeinschaft wieder als Teil desselben erzählten Geschehens dar. Sie lässt sowohl den nicht näher bestimmten Besitzer des Hauses als auch die Bezugsweite von „viele“ und „sie“ offen. Weitere inhaltliche Änderungen sind nicht erforderlich.
