source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: de
  text: Und es geschah, dass er an einem Sabbat durch die Kornfelder[a] ging. Seine Jünger begannen, beim Gehen Ähren[c] zu pflücken[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Saatfelder“ beziehungsweise „durch das stehende Getreide“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einen Weg zu machen“. Die Wendung kann hier das Vorankommen durch das Feld bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Das heißt: Getreideähren.'
    reason: clarification
lexical_decisions:
- source_word: ἐγένετο
  choice: es geschah
  rationale: Die geläufige Erzählformel bleibt erkennbar, ohne im modernen Deutsch altertümlich zu wirken.
- source_word: ἐν τοῖς σάββασιν
  choice: an einem Sabbat
  rationale: Die griechische Pluralform kann im Koine-Griechischen idiomatisch einen einzelnen Sabbattag bezeichnen; die indefinite Form passt zur Einführung dieses Ereignisses.
- source_word: παραπορεύεσθαι
  choice: ging … durch
  rationale: Die Form beschreibt das Unterwegssein durch ein Gebiet. Die einfache deutsche Vergangenheitsform ist in erzählender Prosa natürlicher als eine künstliche Verlaufsform.
- source_word: διὰ τῶν σπορίμων
  choice: durch die Kornfelder
  rationale: σπόριμα bezeichnet besäte beziehungsweise mit Getreide bestandene Felder. „Kornfelder“ ist anschaulich und allgemein verständlich.
- source_word: ἤρξαντο
  choice: begannen
  rationale: Gibt den Beginn der folgenden Handlung unmittelbar wieder.
- source_word: ὁδὸν ποιεῖν
  choice: sich einen Weg zu bahnen
  rationale: Die Formulierung bewahrt das Bild von „einen Weg machen“, funktioniert im Deutschen aber zugleich als natürliche Wendung für das Vorankommen durch das Feld.
- source_word: τίλλοντες
  choice: indem sie … abrissen
  rationale: Das Partizip bezeichnet die begleitende Art und Weise des Vorankommens; τίλλω meint das Ab- oder Ausrupfen beziehungsweise Abpflücken.
- source_word: τοὺς στάχυας
  choice: Ähren
  rationale: στάχυς bezeichnet die Ähre beziehungsweise den ährenförmigen Fruchtstand des Getreides. „Ähren“ ist im Deutschen präzise und geläufig.
- source_word: αὐτὸν
  choice: er
  rationale: Obwohl das Pronomen in der griechischen Konstruktion im Akkusativ steht, verlangt der deutsche dass-Satz ein Subjekt im Nominativ.
theological_decisions:
- issue: Sabbatterminologie
  choice: an einem Sabbat
  alternative: an den Sabbaten
  rationale: Der formale Plural wird hier als idiomatische Bezeichnung eines einzelnen Sabbattages verstanden. Die Entscheidung ist sprachlich und nimmt der folgenden Auseinandersetzung nichts von ihrem Sabbatbezug.
- issue: Bedeutung von ὁδὸν ποιεῖν im Zusammenhang des Sabbatstreits
  choice: sich einen Weg zu bahnen
  alternative: einen Weg zu machen / ihres Weges zu gehen
  rationale: Die gewählte Formulierung hält sowohl das konkrete Weg-Bild als auch den idiomatischen Sinn des Vorankommens fest. Sie behauptet weder ausdrücklich Straßenbau noch beseitigt sie die mögliche Vorstellung, dass die Jünger sich durch das Getreide bewegten.
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. Die einleitende Formel „Und es geschah“ wahrt den biblischen Erzählton; der anschließende Satzbau bleibt dennoch klar und gegenwärtig. Die Aufteilung in zwei deutsche Sätze verbessert die Verständlichkeit, ohne die zeitliche und sachliche Verbindung der Handlungen zu lösen.
