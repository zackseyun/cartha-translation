  naturalness: Die Formulierung ist insgesamt natürliches modernes Standarddeutsch. „Und sie kommen und sagen zu ihm“ ist als bewusst beibehaltenes historisches Präsens verständlich und näher am griechischen Erzählstil als die Ergänzung „einige“. Die Fußnote muss erklären, dass „sie“ keinen im Text eindeutig bestimmten Bezug hat.
