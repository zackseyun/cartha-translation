source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: de
  text: 'Die Jünger des Johannes und die Pharisäer fasteten. Und sie kommen und sagen zu ihm[a]: »Warum fasten die Jünger des Johannes und die Jünger der Pharisäer, deine Jünger aber nicht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische lässt offen, wer mit „sie“ gemeint ist; wörtlich: »sie kommen und sagen zu ihm«.'
    reason: Bewahrt die im griechischen Text nicht näher bestimmte Identität der Kommenden und Sprechenden, ohne im Haupttext eine Gruppe oder Quantität zu ergänzen.
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: fasteten
  rationale: Die Umschreibung aus Imperfekt von εἰμί und Präsenspartizip bezeichnet ein in der Vergangenheit andauerndes Geschehen. Das deutsche Imperfekt gibt dies hier natürlich wieder; der Zusammenhang macht den Verlauf deutlich.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: die Jünger des Johannes
  rationale: Der Genitiv bezeichnet die Zugehörigkeit zu Johannes. Diese Formulierung ist im Deutschen klar, geläufig und würdevoll.
- source_word: οἱ Φαρισαῖοι
  choice: die Pharisäer
  rationale: Dies ist die im Deutschen etablierte Bezeichnung der jüdischen Gruppe.
- source_word: ἔρχονται καὶ λέγουσιν
  choice: Da kommen einige und sagen
  rationale: Die Präsensformen sind markinische historische Präsentia und werden im Präsens belassen, um die lebendige Erzählweise zu bewahren. „Da“ stellt den erzählerischen Anschluss natürlich her; „einige“ macht im Deutschen ein grammatisches Subjekt erforderlich, ohne eine bestimmte Personengruppe festzulegen.
- source_word: Διὰ τί
  choice: Warum
  rationale: „Warum“ ist die direkte und idiomatische deutsche Entsprechung der Frage nach dem Grund.
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: die Jünger der Pharisäer
  rationale: Die Genitivverbindung wird formal und verständlich wiedergegeben, ohne ihre genaue soziale Ausgestaltung näher zu bestimmen.
- source_word: νηστεύουσιν
  choice: fasten
  rationale: Das Präsens bezeichnet hier die beobachtete beziehungsweise übliche Praxis. Das schlichte Verb „fasten“ erhält den Gegensatz zu Jesu Jüngern.
- source_word: οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν
  choice: deine Jünger aber nicht
  rationale: Die deutsche Ellipse vermeidet eine schwerfällige Wiederholung von „fasten“, während δέ als klarer Gegensatz durch „aber“ erhalten bleibt.
theological_decisions:
- issue: Identität der Sprechenden bei ἔρχονται καὶ λέγουσιν
  choice: Mit dem unbestimmten „einige“ wiedergegeben und durch eine Fußnote erläutert.
  alternative: Das Pronomen „sie“ verwenden oder die zuvor genannten Jünger und Pharisäer ausdrücklich als Sprecher identifizieren.
  rationale: Im Griechischen ist das Subjekt nicht ausdrücklich genannt. Ein deutsches „sie“ könnte fälschlich einen eindeutigen Rückbezug auf die unmittelbar zuvor genannten Gruppen nahelegen; eine konkrete Identifizierung würde mehr festlegen, als der Text sagt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Die historischen Präsentia werden bewahrt. Die Formulierung vermeidet konfessionelle Zusätze und lässt die Identität der Fragenden offen.
