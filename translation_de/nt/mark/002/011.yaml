  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: de
  text: 'Ich sage dir: Steh auf, nimm deine Matte und geh nach Hause[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „geh in dein Haus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: Ich sage dir
  rationale: Die vorangestellte Dativform Σοί hebt den Angesprochenen hervor. „Ich sage dir“ gibt die direkte, autoritative Anrede im modernen Deutschen natürlich wieder.
- source_word: ἔγειρε
  choice: Steh auf
  rationale: Der Aoristimperativ bezeichnet die unmittelbar auszuführende Handlung. „Steh auf“ ist im Zusammenhang mit dem Gelähmten klarer und natürlicher als das gehobenere „Erhebe dich“.
- source_word: ἆρον
  choice: nimm
  rationale: Der Aoristimperativ von αἴρω fordert dazu auf, die Matte aufzunehmen. Zusammen mit dem tragbaren Gegenstand ist „nimm deine Matte“ idiomatisch; „heb ... auf“ wäre ebenfalls möglich, betonte aber stärker nur den ersten Bewegungsakt.
- source_word: κράβαττόν
  choice: Matte
  rationale: κράβαττος bezeichnet eine einfache, tragbare Schlafunterlage oder ein schlichtes Lager. „Matte“ vermeidet die Vorstellung eines schweren Bettgestells; „Tragbahre“ wäre zu medizinisch.
- source_word: ὕπαγε
  choice: geh
  rationale: Der Imperativ wird als schlichte Aufforderung zum Fortgehen wiedergegeben. „Geh“ entspricht dem natürlichen modernen Sprachgebrauch.
- source_word: εἰς τὸν οἶκόν σου
  choice: nach Hause
  rationale: Wörtlich steht „zu/in dein Haus“. Die feste deutsche Richtungsangabe „nach Hause“ gibt im Kontext denselben Sinn natürlicher wieder.
theological_decisions:
- issue: Ton und Vollmacht des Heilungsbefehls Jesu
  choice: 'Direkte persönliche Befehlsfolge: „Ich sage dir: Steh auf, nimm deine Matte und geh nach Hause.“'
  alternative: 'Traditioneller: „Ich sage dir: Erhebe dich, nimm dein Bett auf und geh in dein Haus.“'
  rationale: Die Übersetzung bewahrt die unmittelbare, autoritative Rede, ohne ihre theologische Bedeutung über den Wortlaut hinaus auszudeuten. Zeitgemäße Imperative halten den Satz verständlich und würdevoll.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, direktem Ton. Die knappe Befehlsfolge des Griechischen bleibt erhalten. Der Fußnotenmarker steht unmittelbar nach dem Ausdruck, auf den er sich bezieht.
