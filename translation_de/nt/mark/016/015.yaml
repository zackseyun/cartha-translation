id: MRK.16.15
reference: Mark 16:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Geht in die ganze Welt und verkündet der ganzen Schöpfung[a] die gute Nachricht[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jedem Geschöpf«. Die griechische Wendung kann kollektiv als »der ganzen Schöpfung« oder distributiv als »jedem Geschöpf« verstanden werden.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »das Evangelium«. Das griechische Wort εὐαγγέλιον bedeutet »gute Nachricht« oder »Freudenbotschaft«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευθέντες
  choice: Geht
  rationale: Das vorangestellte Aoristpartizip steht in enger Verbindung mit dem Imperativ κηρύξατε und hat hier den Sinn eines begleitenden Auftrags. Der deutsche Imperativ »Geht« gibt diesen Sendungscharakter natürlicher wieder als das schwerfällige »Nachdem ihr gegangen seid«.
- source_word: εἰς τὸν κόσμον ἅπαντα
  choice: in die ganze Welt
  rationale: κόσμος bezeichnet hier die Welt als umfassenden Wirkungsbereich der Sendung; ἅπαντα betont ihre Gesamtheit. »In die ganze Welt« ist im modernen Deutsch klar und wahrt den universalen Umfang.
- source_word: κηρύξατε
  choice: verkündet
  rationale: κηρύσσω bezeichnet das öffentliche, autoritative Bekanntmachen einer Botschaft. »Verkündet« bewahrt diesen Sinn, ohne ihn auf eine kirchliche Predigtform zu beschränken.
- source_word: τὸ εὐαγγέλιον
  choice: die gute Nachricht
  rationale: εὐαγγέλιον bedeutet wörtlich eine gute Nachricht beziehungsweise Freudenbotschaft. »Die gute Nachricht« erschließt den Sinn unmittelbar; das traditionelle Lehnwort »Evangelium« wird in einer Fußnote als Alternative bewahrt.
- source_word: πάσῃ τῇ κτίσει
  choice: der ganzen Schöpfung
  rationale: κτίσις kann sowohl »Schöpfung« als auch »Geschöpf« bedeuten. Die kollektive Wiedergabe »der ganzen Schöpfung« erhält die Weite und mögliche kosmische Dimension der Formulierung, ohne die distributive Lesart auszuschließen.
- source_word: εἶπεν αὐτοῖς
  choice: er sagte zu ihnen
  rationale: Dies ist die direkte und unmarkierte deutsche Wiedergabe der gewöhnlichen erzählerischen Einleitung.
theological_decisions:
- issue: Reichweite von πάσῃ τῇ κτίσει im Sendungsauftrag
  choice: der ganzen Schöpfung
  alternative: jedem Geschöpf
  rationale: Die griechische Wendung lässt sich kollektiv beziehungsweise kosmisch oder distributiv verstehen. Die Hauptfassung bewahrt den umfassenden Horizont, während die Fußnote die mögliche Einzelperspektive ausdrücklich offenhält. Eine Einschränkung auf Menschen allein wird nicht in den Text eingetragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Erzählton. Der Imperativ ist direkt und kraftvoll; »verkündet« wahrt den öffentlichen Charakter des Auftrags. Die Wortstellung setzt das weit gefasste Gegenüber der Verkündigung vor die Botschaft, bleibt dabei aber idiomatisch.
