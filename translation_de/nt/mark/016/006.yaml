reference: Mark 16:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: de
  text: 'Er aber sagt zu ihnen: „Seid nicht bestürzt! Ihr sucht Jesus, den Nazarener[a], der gekreuzigt worden ist. Er ist auferweckt worden[b]; er ist nicht hier. Seht – die Stelle, wo sie ihn hingelegt haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Nazoräer“ beziehungsweise „Jesus aus Nazareth“. Das griechische Wort ist eine von Nazareth abgeleitete Bezeichnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Er ist auferstanden.“ Die griechische Verbform ist passiv: „Er ist auferweckt worden.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκθαμβεῖσθε
  choice: Erschreckt nicht
  rationale: Das Verb bezeichnet eine starke emotionale Erschütterung beziehungsweise Bestürzung. „Erschreckt nicht“ ist im heutigen Deutsch natürlich und passt zur Situation am Grab.
- source_word: Ναζαρηνὸν
  choice: den Nazarener
  rationale: Die substantivisch gebrauchte Herkunftsbezeichnung bleibt als Beiname erhalten, statt zu „aus Nazareth“ aufgelöst zu werden.
- source_word: ἐσταυρωμένον
  choice: der gekreuzigt worden ist
  rationale: Das deutsche Perfekt im Passiv gibt sowohl die passive Form als auch die abgeschlossene Handlung mit fortdauernder Bedeutung wieder.
- source_word: ἠγέρθη
  choice: Er ist auferweckt worden
  rationale: Die Form ist passiv. Diese Wiedergabe bewahrt den Hinweis auf ein an Jesus vollzogenes Handeln, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: ζητεῖτε
  choice: Ihr sucht
  rationale: Das deutsche Präsens gibt den gegenwärtigen Vorgang idiomatisch und knapp wieder.
- source_word: ἴδε
  choice: Seht
  rationale: Der Ausdruck lenkt die Aufmerksamkeit nachdrücklich auf die Grabstelle; „Seht“ ist modern und würdevoll.
- source_word: τόπος
  choice: Stelle
  rationale: Im Zusammenhang bezeichnet das Wort konkret die Stelle im Grab, an der Jesus gelegen hatte.
- source_word: ἔθηκαν
  choice: sie ihn hingelegt haben
  rationale: „Hinlegen“ ist im Bestattungskontext verständlich und gibt die aktive Handlung der nicht näher genannten Personen wieder.
- source_word: λέγει αὐταῖς
  choice: er aber sagt zu ihnen
  rationale: Das Präsens bewahrt Markus’ anschauliches historisches Präsens; „aber“ gibt δέ als leichten erzählerischen Übergang wieder.
theological_decisions:
- issue: Passivische Aussage über die Auferstehung
  choice: Er ist auferweckt worden
  alternative: Er ist auferstanden
  rationale: ἠγέρθη ist grammatisch passiv. Die gewählte Fassung bewahrt diese Form und die mögliche implizite göttliche Urheberschaft, ohne sie erklärend in den Haupttext einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens und die knappe, eindringliche Redeweise des Markus bleiben erhalten; der Gedankenstrich bildet die deiktische Kürze von ἴδε ὁ τόπος nach.
