id: MRK.16.14
reference: Mark 16:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: de
  text: Später[a] erschien er den Elf, als sie zu Tisch lagen[b]. Er tadelte ihren Unglauben und ihre Herzenshärte, weil sie denen nicht geglaubt hatten, die ihn gesehen hatten, nachdem er auferweckt worden war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Danach«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist die damals übliche liegende Haltung beim Essen.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: »die ihn als Auferweckten gesehen hatten«; auch möglich: »die ihn auferstanden gesehen hatten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: Später
  rationale: Das temporale Adverb kennzeichnet eine nachfolgende Erscheinung. »Später« ist natürliches modernes Deutsch und wahrt die zeitliche Abfolge.
- source_word: ἀνακειμένοις
  choice: als sie zu Tisch lagen
  rationale: Das Partizip bezeichnet die damals übliche liegende Haltung bei einer Mahlzeit. Die Wendung macht den kulturellen Zusammenhang verständlich, ohne daraus modernes Sitzen zu machen.
- source_word: αὐτοῖς τοῖς ἕνδεκα
  choice: den Elf
  rationale: Gemeint ist die nach dem Verlust des Judas so bezeichnete Jüngergruppe. Im Deutschen ist »den Elf« klar und natürlich; eine zusätzliche Wiedergabe von αὐτοῖς als »selbst« wäre hier missverständlich oder unnötig schwerfällig.
- source_word: ἐφανερώθη
  choice: erschien er
  rationale: In Berichten von Auferstehungserscheinungen gibt »erschien« die passive griechische Form idiomatisch und sachgerecht wieder.
- source_word: ὠνείδισεν
  choice: tadelte
  rationale: »Tadelte« vermittelt die deutliche Zurechtweisung in gegenwärtigem, würdigem Deutsch, ohne altertümlich zu klingen.
- source_word: ἀπιστίαν
  choice: Unglauben
  rationale: Das Substantiv bezeichnet hier ihr Nichtglauben gegenüber dem Zeugnis der Augenzeugen; »Unglauben« gibt dies unmittelbar wieder.
- source_word: σκληροκαρδίαν
  choice: Herzenshärte
  rationale: Die Wiedergabe bewahrt das biblische Bild für eine innerlich verhärtete, widerstrebende Haltung, statt es auf »Starrsinn« zu verengen.
- source_word: θεασαμένοις
  choice: die ihn gesehen hatten
  rationale: Die Form bezeichnet diejenigen, die Jesus als Augenzeugen gesehen hatten. Die schlichte Wiedergabe ist im Deutschen klar und wahrt den Zeugnischarakter des Zusammenhangs.
- source_word: ἐγηγερμένον
  choice: nachdem er auferweckt worden war
  rationale: Die Form ist ein perfektes Passivpartizip. Der temporale Nebensatz bewahrt sowohl den passiven Charakter als auch den fortwirkenden Sachverhalt der Auferweckung in natürlichem Deutsch.
- source_word: οὐκ ἐπίστευσαν
  choice: nicht geglaubt hatten
  rationale: Das Plusquamperfekt verdeutlicht, dass ihr Nichtglauben dem nun geschilderten Erscheinen vorausging, und passt zum begründenden ὅτι-Satz.
theological_decisions:
- issue: Auferstehungsformulierung in ἐγηγερμένον
  choice: nachdem er auferweckt worden war
  alternative: die ihn als Auferweckten gesehen hatten / die ihn auferstanden gesehen hatten
  rationale: Die gewählte Fassung erhält das grammatische Passiv und macht keine ausdrückliche Angabe zum Handelnden, wo der griechische Text ihn nicht nennt. Die Fußnote bewahrt die näher am Partizip liegende Alternative.
- issue: Bedeutung von σκληροκαρδία
  choice: Herzenshärte
  alternative: Starrsinn / Hartherzigkeit
  rationale: Das körperlich-geistliche Bild des griechischen Ausdrucks bleibt erhalten. So wird die theologische Spannung einer inneren Widerständigkeit nicht auf eine bloße Charaktereigenschaft reduziert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Das biblische Bild »Herzenshärte« und das Passiv der Auferweckungsformulierung wurden bewusst bewahrt.
