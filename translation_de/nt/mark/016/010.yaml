  text: ἐκείνη πορευθεῖσα ἀπήγγειλεν τοῖς μετ’ αὐτοῦ γενομένοις πενθοῦσι καὶ κλαίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/010.yaml
  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: de
  text: Sie ging zu denen, die mit ihm gewesen waren, und berichtete es ihnen. Sie trauerten und weinten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: Sie
  rationale: Das Demonstrativpronomen verweist auf Maria Magdalena im vorhergehenden Vers; im natürlichen Deutschen ist „sie“ angemessen.
- source_word: πορευθεῖσα
  choice: ging zu
  rationale: Das vorangestellte Aoristpartizip bezeichnet die dem Berichten vorausgehende Bewegung. Zusammen mit dem Dativ der Empfänger gibt „ging zu“ den Zusammenhang idiomatisch wieder.
- source_word: ἀπήγγειλεν
  choice: berichtete es ihnen
  rationale: ἀπαγγέλλω bezeichnet das Überbringen oder Berichten einer Nachricht. „Es“ nimmt den aus dem Kontext erschlossenen Inhalt auf; „ihnen“ macht die im griechischen Dativ bezeichneten Empfänger natürlich wieder.
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: denen, die mit ihm gewesen waren
  rationale: Die substantivierte Partizipialfügung bezeichnet diejenigen, die zuvor mit Jesus zusammen gewesen waren. Die Formulierung bewahrt den zeitlichen Rückblick und vermeidet die engere Deutung „Jünger“.
- source_word: πενθοῦσι καὶ κλαίουσιν
  choice: Sie trauerten und weinten
  rationale: Die Präsenspartizipien beschreiben den gleichzeitigen Zustand der Empfänger. Ein eigener deutscher Satz ist klar und bewahrt sowohl die Trauer um den Verstorbenen als auch das sichtbare Weinen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei kurzen Sätze vermeiden eine schwerfällige doppelte Relativsatzkonstruktion, ohne Information hinzuzufügen oder die Bezugsgruppe theologisch näher zu bestimmen.
