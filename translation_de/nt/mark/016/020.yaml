- from: Sie aber zogen hinaus und verkündeten überall. Der Herr wirkte mit ihnen und bestätigte die Botschaft[a] durch die Zeichen, die darauf folgten.[b]
  to: Sie aber zogen hinaus und verkündeten überall, während der Herr mit ihnen wirkte und die Botschaft[a] durch die begleitenden Zeichen[b] bestätigte.
  rationale: Die Revision ersetzt die unnötig festlegende und im Deutschen zeitlich missverständliche Formulierung „die darauf folgten“ durch „die begleitenden Zeichen“. Sie erhält die im griechischen Partizip vorhandene Offenheit hinsichtlich eines ausdrücklich genannten Bezugsobjekts und entspricht zugleich dem syntaktischen Zusammenhang, in dem die Zeichen die Botschaft bestätigen.
