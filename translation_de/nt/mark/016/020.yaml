source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: de
  text: Sie aber zogen hinaus und verkündeten überall, während der Herr mit ihnen wirkte und die Botschaft[a] durch die begleitenden Zeichen[b] bestätigte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Wort“. Das griechische Wort kann „Wort“ bedeuten; hier bezeichnet es die verkündete Botschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch die Zeichen, die folgten“. Der griechische Ausdruck kann sowohl ein Folgen als auch ein Begleiten bezeichnen und nennt nicht ausdrücklich, worauf die Zeichen folgen oder was sie begleiten.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐκεῖνοι δὲ
  choice: Sie aber
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannten Jünger; im Deutschen ist „sie“ natürlich. δέ führt den Erzählgang mit einer leichten Gegenüberstellung zur vorausgehenden Himmelfahrt fort.
- source_word: ἐξελθόντες
  choice: zogen hinaus
  rationale: Das Aoristpartizip bezeichnet eine der Verkündigung vorausgehende beziehungsweise sie einleitende Handlung. „Zogen hinaus“ klingt idiomatisch und bewahrt die missionarische Bewegung.
- source_word: ἐκήρυξαν πανταχοῦ
  choice: verkündeten überall
  rationale: κηρύσσω bezeichnet öffentliches Bekanntmachen; „verkündeten“ ist im Deutschen verständlich und weniger auf eine Predigtform eingeengt als „predigten“. πανταχοῦ wird direkt mit „überall“ wiedergegeben.
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: Der Herr wirkte mit ihnen
  rationale: Der Genitivus absolutus beschreibt das gleichzeitige unterstützende Handeln des Herrn. „Wirkte mit ihnen“ bewahrt den συνεργ- Gedanken, ohne eine stärkere dogmatische Präzisierung einzutragen.
- source_word: τὸν λόγον
  choice: die Botschaft
  rationale: λόγος meint im Zusammenhang den verkündeten Inhalt. „Botschaft“ ist für heutige Leser transparent; die formalere Alternative „das Wort“ bleibt in einer Fußnote erhalten.
- source_word: βεβαιοῦντος
  choice: bestätigte
  rationale: βεβαιόω bezeichnet das Bekräftigen oder Beglaubigen; „bestätigte“ trifft hier die Funktion der Zeichen.
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: durch die Zeichen, die darauf folgten
  rationale: διά mit Genitiv bezeichnet das Mittel. ἐπακολουθούντων kann sowohl zeitlich „folgten“ als auch begleitend verstanden werden. „Darauf folgten“ lässt den Bezug bewusst offen und wird durch eine Fußnote ergänzt.
theological_decisions:
- issue: Bezug von „der Herr“
  choice: Der Titel bleibt als „der Herr“ stehen; im unmittelbaren Zusammenhang bezieht er sich auf den auferstandenen Jesus.
  alternative: Gott allgemein
  rationale: Markus 16,19 nennt unmittelbar zuvor Jesus „den Herrn“. Die Übersetzung bewahrt dennoch die Titelbezeichnung des griechischen Textes, statt den Namen erläuternd einzusetzen.
- issue: Funktion der Zeichen
  choice: Die Zeichen sind das Mittel, durch das der Herr die Botschaft bestätigt.
  alternative: Die Zeichen folgen lediglich, ohne bestätigende Funktion.
  rationale: Die Konstruktion verbindet „die Botschaft bestätigte“ ausdrücklich mit διά und den Zeichen. Daraus folgt eine beglaubigende Funktion, ohne dass der Vers Aussagen über ihre spätere Dauer oder allgemeine Normativität macht.
- issue: Bezugsgröße von ἐπακολουθούντων
  choice: Die deutsche Formulierung „die darauf folgten“ bewahrt eine gewisse Offenheit darüber, ob die Zeichen der Verkündigung, der Botschaft oder den Verkündigenden folgten.
  alternative: „die sie begleiteten“ oder „die die Botschaft begleiteten“
  rationale: Das griechische Partizip nennt sein Bezugsobjekt nicht ausdrücklich. Eine explizite Ergänzung würde eine mögliche Deutung festlegen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem biblischem Ton. Zwei Hauptsätze vermeiden eine schwere Partizipialkonstruktion. Die Formulierung wahrt die Mehrdeutigkeit von ἐπακολουθούντων, ohne den theologischen Zusammenhang der bestätigenden Zeichen abzuschwächen.
