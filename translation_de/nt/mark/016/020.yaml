  naturalness: „Sie aber zogen hinaus und verkündeten überall“ ist idiomatisch. Die Verbindung mit „während“ gibt die Gleichzeitigkeit des Genitivus absolutus klar und flüssig wieder. „Begleitende Zeichen“ ist modernes, verständliches Deutsch und vermeidet die missverständliche zeitliche Abfolge von „darauf folgten“.
  terminology: „Der Herr“, „verkündeten“, „Botschaft“ und „bestätigte“ sind angemessene Wiedergaben. Die Fußnote zu „das Wort“ bewahrt die mögliche formnähere Alternative für λόγος.
