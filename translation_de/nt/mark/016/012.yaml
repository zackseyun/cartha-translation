  source_fidelity: 'Der Entwurf gibt alle wesentlichen Elemente des griechischen Textes zutreffend wieder: die zeitliche Fortführung (Μετὰ δὲ ταῦτα), die Beschränkung auf zwei aus der Gruppe, das Erscheinen, die andere Gestalt sowie das gleichzeitige Unterwegssein mit dem Ziel in den ländlichen Raum. „Aufs Land“ ist für εἰς ἀγρόν im Kontext eine sachgerechte, natürliche Wiedergabe; die Alternative „zu einem Feld“ ist angemessen vermerkt.'
  naturalness: „Danach aber erschien er zweien von ihnen in anderer Gestalt, als sie zu Fuß aufs Land unterwegs waren“ ist modernes, verständliches Standarddeutsch mit angemessen zurückhaltendem biblischem Erzählton. Die Verbindung von „zu Fuß“ und „unterwegs“ bildet die beiden griechischen Bewegungs-Partizipien ohne unnatürliche Verbwiederholung ab.
