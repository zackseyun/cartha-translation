id: MRK.16.12
reference: Mark 16:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: de
  text: Danach aber erschien er zweien von ihnen in anderer Gestalt[a], als sie zu Fuß aufs Land[b] unterwegs waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit einem anderen Aussehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu einem Feld“; hier ist wahrscheinlich der ländliche Raum gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Danach aber
  rationale: „Danach“ gibt die zeitliche Folge von μετά mit Akkusativ natürlich wieder; „aber“ bewahrt die fortführende beziehungsweise leicht absetzende Funktion von δέ.
- source_word: δυσὶν ἐξ αὐτῶν
  choice: zweien von ihnen
  rationale: Die Formulierung bezeichnet zwei Personen aus der zuvor genannten größeren Gruppe und ist im Deutschen zugleich präzise und idiomatisch.
- source_word: περιπατοῦσιν
  choice: als sie zu Fuß … unterwegs waren
  rationale: Die Wendung bringt die gleichzeitig andauernde Handlung des Gehens zum Ausdruck und unterscheidet sie zugleich von allgemeinem Reisen.
- source_word: ἐφανερώθη
  choice: erschien er
  rationale: Das Passiv von φανερόω bezeichnet hier idiomatisch ein Sichtbarwerden beziehungsweise eine Erscheinung; „erschien“ ist dafür im Kontext einer Auferstehungserscheinung die klare, natürliche Wiedergabe.
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: in anderer Gestalt
  rationale: Die Wiedergabe erhält die Aussage von Andersartigkeit und äußerer Gestalt, ohne zu erklären, worin die Veränderung bestand.
- source_word: πορευομένοις
  choice: unterwegs waren
  rationale: Die Formulierung gibt die zielgerichtete Bewegung wieder, ohne neben „zu Fuß“ das Verb „gehen“ unnötig zu verdoppeln.
- source_word: εἰς ἀγρόν
  choice: aufs Land
  rationale: ἀγρός kann ein einzelnes Feld bezeichnen, meint in diesem Erzählzusammenhang aber wahrscheinlich den ländlichen Raum. „Aufs Land“ ist dafür eine natürliche moderne deutsche Ortsangabe.
theological_decisions:
- issue: Art der Erscheinung, die mit ἐν ἑτέρᾳ μορφῇ beschrieben wird
  choice: in anderer Gestalt
  alternative: mit einem anderen Aussehen
  rationale: Der Vers sagt, dass Jesus in anderer Gestalt erschien, erläutert aber nicht, ob sich sein äußeres Erscheinungsbild, die Wahrnehmung der beiden oder die Weise des Erkanntwerdens veränderte. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Danach aber“ hält die erzählerische Verknüpfung sichtbar; „zu Fuß … unterwegs“ vermeidet eine schwerfällige Wiederholung zweier Bewegungsverben.
