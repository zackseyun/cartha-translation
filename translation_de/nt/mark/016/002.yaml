  text: καὶ λίαν πρωῒ ⸂τῇ μιᾷ τῶν⸃ σαββάτων ἔρχονται ἐπὶ τὸ μνημεῖον ἀνατείλαντος τοῦ ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: de
  text: Und sehr früh am ersten Tag der Woche[a] kommen[b] sie zum Grab, als die Sonne aufgegangen war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am ersten der Sabbate“; eine damalige Ausdrucksweise für den ersten Tag der Woche.'
    reason: lexical_alternative
  - marker: b
    text: Markus verwendet hier das erzählende Präsens „kommen“; im Deutschen könnte auch mit „kamen“ übersetzt werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „nachdem die Sonne aufgegangen war“. Die griechische Konstruktion gibt den Zeitpunkt ihres Kommens an.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: sehr früh
  rationale: λίαν verstärkt πρωῒ. „Sehr früh“ gibt die Betonung knapp und natürlich wieder.
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: am ersten Tag der Woche
  rationale: Die wörtliche Wendung „am ersten der Sabbate“ ist eine semitisch-koinegriechische Zeitangabe für den ersten Wochentag.
- source_word: ἔρχονται
  choice: kommen sie
  rationale: Das Präsens wird als markinisches historisches Präsens beibehalten und verleiht der Erzählung Unmittelbarkeit.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: zum Grab
  rationale: μνημεῖον bezeichnet hier die Grabanlage; ἐπί mit Akkusativ drückt die Bewegung auf dieses Ziel hin aus.
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: als die Sonne aufgegangen war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. „Als“ wahrt die zeitliche Zuordnung, ohne ein stärkeres ausdrückliches „nachdem“ in den Text einzutragen; das Plusquamperfekt gibt das vollendete Aufgehen relativ zum Kommen wieder.
theological_decisions: []
