base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: de
  text: Nachdem er auferstanden war[a], erschien er früh am ersten Tag der Woche zuerst Maria Magdalena, aus der er sieben Dämonen ausgetrieben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 9–20 fehlen in einigen frühen Handschriften des Markusevangeliums; andere Handschriften enthalten sie, teilweise mit Abweichungen.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: Nachdem er auferstanden war
  rationale: Das Aoristpartizip bezeichnet hier eine Handlung, die dem Hauptverb ἐφάνη zeitlich vorausgeht. Die Formulierung gibt diese Abfolge in natürlichem Deutsch wieder.
- source_word: δὲ
  choice: nicht eigens wiedergegeben
  rationale: δέ ist hier ein leichter erzählerischer Anschluss. Im deutschen Satzfluss ist kein zusätzliches „nun“, „aber“ oder „und“ nötig.
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: früh am ersten Tag der Woche
  rationale: πρωῒ bezeichnet den frühen Morgen; πρώτῃ σαββάτου ist die geläufige jüdisch-griechische Bezeichnung für den ersten Wochentag.
- source_word: ἐφάνη
  choice: erschien
  rationale: Die Form bezeichnet in diesem Auferstehungszusammenhang ein Sichtbarwerden beziehungsweise eine Erscheinung; „erschien“ ist die natürliche deutsche Entsprechung.
- source_word: πρῶτον
  choice: zuerst
  rationale: Das Adverb gibt die Reihenfolge der Erscheinungen an.
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: Maria aus Magdala
  rationale: Die Bezeichnung identifiziert Maria anhand ihrer Herkunft und wird so für heutige Leser transparent wiedergegeben.
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: aus der er … ausgetrieben hatte
  rationale: Die Präposition bezeichnet zusammen mit ἐκβάλλω den Ausgangspunkt der ausgetriebenen Dämonen. Das Plusquamperfekt wahrt die Vorzeitigkeit.
- source_word: ἑπτὰ δαιμόνια
  choice: sieben Dämonen
  rationale: Die konkrete Zahl und die im Exorzismuskontext übliche Bedeutung von δαιμόνια werden direkt bewahrt.
theological_decisions:
- issue: Textkritischer Status von Markus 16,9 innerhalb des längeren Markusschlusses
  choice: Der im SBLGNT gebotene Vers wird übersetzt und mit einem textkritischen Hinweis versehen.
  alternative: Einige frühe Handschriften beenden das Markusevangelium mit 16,8; andere enthalten 16,9–20, teils mit Abweichungen.
  rationale: Die eckige Klammer im SBLGNT signalisiert eine erhebliche Überlieferungsfrage. Diese wird nicht stillschweigend entschieden, sondern für Leser offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen zeitlichen Abfolge, ohne einen im Deutschen unnötigen Diskursmarker für δέ einzufügen.
