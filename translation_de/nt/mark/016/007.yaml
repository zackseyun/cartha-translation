id: MRK.16.7
reference: Mark 16:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: de
  text: 'Doch geht und sagt seinen Jüngern und Petrus[a]: »Er geht euch voraus nach Galiläa. Dort werdet ihr ihn sehen, wie er es euch gesagt hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Petrus wird neben »seinen Jüngern« eigens genannt. Das kann nach seiner Verleugnung auf seine Wiederannahme hindeuten; im Griechischen steht jedoch nicht ausdrücklich »besonders Petrus«.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Doch
  rationale: Markiert den deutlichen Gegensatz beziehungsweise Übergang zum vorausgehenden Zusammenhang und klingt im modernen Deutschen knapp und würdig.
- source_word: ὑπάγετε
  choice: geht
  rationale: Der präsentische Imperativ Plural fordert die Frauen unmittelbar auf, sich auf den Weg zu machen; »geht« gibt dies natürlich wieder, ohne den Aspekt zu überdeuten.
- source_word: εἴπατε
  choice: sagt
  rationale: Der Aoristimperativ bezeichnet den konkreten Auftrag, den genannten Empfängern die folgende Botschaft mitzuteilen.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: seinen Jüngern
  rationale: Natürliche deutsche Wiedergabe der Dativgruppe mit possessivem αὐτοῦ.
- source_word: καὶ τῷ Πέτρῳ
  choice: und Petrus
  rationale: Bewahrt die schlichte Koordination und die auffällige gesonderte Nennung des Petrus, ohne interpretierend »besonders« oder »einschließlich« einzufügen.
- source_word: ὅτι
  choice: direkte Rede
  rationale: ὅτι leitet den Inhalt der auszurichtenden Botschaft ein; direkte Rede ist im Deutschen klar und natürlich.
- source_word: Προάγει ὑμᾶς
  choice: Er geht euch voraus
  rationale: Gibt sowohl die gegenwärtig dargestellte Bewegung als auch die Richtung vor den Jüngern knapp und idiomatisch wieder.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: nach Galiläa
  rationale: Bei geografischen Zielangaben ist »nach Galiläa« die natürliche deutsche Entsprechung von εἰς; die Bewegungsrichtung bleibt erhalten.
- source_word: ἐκεῖ
  choice: Dort
  rationale: Direkte und natürliche lokative Rückverweisung auf Galiläa.
- source_word: αὐτὸν ὄψεσθε
  choice: werdet ihr ihn sehen
  rationale: Gibt den Futur von ὁράω ohne zusätzliche Deutung als Begegnung oder Erscheinung wieder.
- source_word: καθὼς εἶπεν ὑμῖν
  choice: wie er es euch gesagt hat
  rationale: Bewahrt den Vergleich mit Jesu früherer Ankündigung; das ergänzte »es« ist im Deutschen idiomatisch und bezieht sich auf den Inhalt der Verheißung.
theological_decisions:
- issue: Gesonderte Nennung des Petrus nach den Jüngern
  choice: »seinen Jüngern und Petrus«
  alternative: »seinen Jüngern, besonders Petrus« oder »seinen Jüngern einschließlich Petrus«
  rationale: Der griechische Text nennt Petrus ausdrücklich neben den Jüngern. Dies kann im Erzählzusammenhang seine Wiederannahme nach der Verleugnung anklingen lassen, sagt aber grammatisch weder »besonders« noch »einschließlich«. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die Satzstellung bleibt nah am griechischen Auftrag und vermeidet konfessionell geprägte Zusätze.
