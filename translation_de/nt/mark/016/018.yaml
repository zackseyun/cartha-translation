source:
  edition: SBLGNT
  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: de
  text: Sie werden Schlangen aufheben[a], und wenn sie etwas Tödliches trinken, wird es ihnen keinesfalls schaden. Sie werden Kranken die Hände auflegen, und diese werden gesund werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige frühe Handschriften enthalten Markus 16,9–20 nicht; dieser Vers gehört zum längeren Markusschluss.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „Sie werden wohlauf sein.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: Schlangen
  rationale: „Schlangen“ ist die natürliche moderne Entsprechung und bewahrt die konkrete Bedeutung des griechischen Plurals.
- source_word: ἀροῦσιν
  choice: werden … aufheben
  rationale: αἴρω bezeichnet hier am ehesten das Aufheben oder Aufnehmen eines Gegenstands; „aufheben“ bleibt nah am Wortlaut, ohne eine bestimmte Absicht zu unterstellen.
- source_word: κἂν θανάσιμόν τι πίωσιν
  choice: und wenn sie etwas Tödliches trinken
  rationale: Die Formulierung gibt die Bedingung natürlich wieder und lässt θανάσιμόν τι bewusst breit; sie beschränkt die Aussage nicht ausdrücklich auf Gift.
- source_word: οὐ μὴ αὐτοὺς βλάψῃ
  choice: wird es ihnen keinesfalls schaden
  rationale: „Keinesfalls“ bringt die nachdrückliche Verneinung οὐ μή zum Ausdruck; „schaden“ entspricht dem weiten Sinn von βλάπτω.
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: Sie werden Kranken die Hände auflegen
  rationale: Die deutsche Wendung „die Hände auflegen“ entspricht dem griechischen Ausdruck idiomatisch und klar; ἀρρώστους bezeichnet kranke Menschen.
- source_word: καὶ καλῶς ἕξουσιν
  choice: und diese werden gesund werden
  rationale: Im Zusammenhang mit Kranken gibt „gesund werden“ den gemeinten Ausgang natürlich wieder. Der wörtlichere, etwas weitere Ausdruck wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Reichweite der verheißenen Bewahrung und Heilung
  choice: Die angekündigten Zeichen und ihre Ergebnisse werden ohne einschränkende Deutung wiedergegeben.
  alternative: Die Zeichen ausdrücklich als jederzeit für alle Glaubenden geltend, auf die apostolische Zeit begrenzt oder rein symbolisch verstehen.
  rationale: Der griechische Text nennt zukünftige Handlungen und Folgen, entscheidet aber nicht ausdrücklich die späteren theologischen Fragen nach Dauer, Allgemeingültigkeit oder Symbolik.
- issue: Textkritischer Status von Markus 16,9–20
  choice: Der vorgegebene Vers wird übersetzt; die Überlieferungslage des längeren Markusschlusses wird in einer Fußnote offengelegt.
  alternative: Den Vers auslassen oder im Haupttext einklammern.
  rationale: Der Vers steht in der vorgegebenen Ausgangsform, doch das Fehlen von Markus 16,9–20 in einigen frühen Handschriften ist für Leserinnen und Leser wesentlich.
- issue: Bedeutung von καλῶς ἕξουσιν
  choice: Im Krankheitszusammenhang mit „gesund werden“ wiedergegeben, ergänzt durch die wörtlichere Möglichkeit „es wird ihnen gut gehen“.
  alternative: Ausschließlich „es wird ihnen gut gehen“ schreiben und die gesundheitliche Bedeutung offenlassen.
  rationale: Der Kontext legt Genesung nahe, während die Fußnote die größere sprachliche Weite des griechischen Ausdrucks bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Sätze bleiben knapp und nah an der griechischen Struktur; die starke Verneinung wird mit „keinesfalls“ bewahrt.
