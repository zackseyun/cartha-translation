source:
  edition: SBLGNT
  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: de
  text: Als der Sabbat vorüber war, kauften Maria Magdalena, Maria, die Mutter des Jakobus,[a] und Salome Duftstoffe, um hinzugehen und ihn zu salben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Maria, die des Jakobus«; die Beziehung zu Jakobus wird im Griechischen nicht ausdrücklich genannt. »Mutter« ist zur Verständlichkeit ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: Als der Sabbat vorüber war
  rationale: Der Genitivus absolutus bezeichnet einen Zeitpunkt vor der Haupthandlung. Die Formulierung ist natürlich und bewahrt die zeitliche Abfolge.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Maria Magdalena
  rationale: Dies ist die geläufige deutsche Namensform.
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: Maria, die Mutter des Jakobus
  rationale: Der griechische Ausdruck lautet elliptisch »Maria, die des Jakobus«. Im Zusammenhang liegt die Identifikation als Mutter nahe; die im Griechischen offenbleibende Beziehung wird in einer Fußnote kenntlich gemacht.
- source_word: Σαλώμη
  choice: Salome
  rationale: Dies ist die geläufige deutsche Umschrift des Namens.
- source_word: ἠγόρασαν
  choice: kauften
  rationale: Die schlichte Erzählform wird mit dem gebräuchlichen deutschen Verb direkt wiedergegeben.
- source_word: ἀρώματα
  choice: wohlriechende Öle
  rationale: Gemeint sind duftende Substanzen zur Behandlung eines Leichnams. »Wohlriechende Öle« ist im heutigen Deutsch verständlicher als das missverständliche »Gewürze«, ohne den Bestattungszweck vorwegzunehmen.
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: um hinzugehen und ihn zu salben
  rationale: ἵνα bezeichnet den Zweck; das Partizip ἐλθοῦσαι beschreibt die dem Salben vorausgehende Bewegung. Die deutsche Infinitivkonstruktion gibt Zweck und Reihenfolge natürlich wieder.
- source_word: ἀλείψωσιν
  choice: zu salben
  rationale: Das Verb bezeichnet das Auftragen einer öligen oder wohlriechenden Substanz und wird direkt mit »salben« wiedergegeben.
theological_decisions:
- issue: Ergänzung der Beziehung zwischen Maria und Jakobus
  choice: Maria, die Mutter des Jakobus
  alternative: Maria, die zu Jakobus gehört / Maria des Jakobus
  rationale: Das Griechische nennt die Beziehung nicht ausdrücklich. »Mutter« entspricht dem markinischen Zusammenhang und ergibt eine verständliche Identifikation, doch die echte Ellipse wird durch die Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung stellt die Frauen gemeinsam als Subjekt vor das Prädikat; die Fußnote dokumentiert die im griechischen Wortlaut nicht ausdrücklich bestimmte Beziehung Marias zu Jakobus.
