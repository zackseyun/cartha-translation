  text: καὶ ἔλεγον πρὸς ἑαυτάς· Τίς ἀποκυλίσει ἡμῖν τὸν λίθον ⸀ἐκ τῆς θύρας τοῦ μνημείου;
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/003.yaml
  text: And they were saying to one another[a], “Who will roll away the stone for us from the entrance of the tomb?”
translation:
  language: de
  text: 'Und sie sagten zueinander: „Wer wird uns den Stein vom Eingang des Grabes wegrollen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sie sagten
  rationale: Das Imperfekt bezeichnet die im Verlauf ihres Weges stattfindende Unterhaltung. Im natürlichen Deutschen gibt das Präteritum „sagten“ dies zusammen mit „zueinander“ angemessen wieder; „sie waren am Sagen“ wäre unidiomatisch.
- source_word: πρὸς ἑαυτάς
  choice: zueinander
  rationale: 'Die wörtlich reflexive Form hat hier bei mehreren Frauen reziproke Bedeutung: Sie sprechen miteinander.'
- source_word: Τίς
  choice: Wer
  rationale: Das Interrogativpronomen fragt nach der Person, die die Handlung ausführen könnte.
- source_word: ἀποκυλίσει
  choice: wird … wegrollen
  rationale: Das Verb bezeichnet konkret das Wegrollen eines Gegenstands; die deutsche Futurform bewahrt die auf die bevorstehende Handlung gerichtete Frage.
- source_word: ἡμῖν
  choice: uns
  rationale: Der Dativ bezeichnet die Begünstigten der Handlung. Im Deutschen drückt „uns den Stein … wegrollen“ natürlich aus, dass es für sie geschieht.
- source_word: τὸν λίθον
  choice: den Stein
  rationale: Der bestimmte Artikel und das Substantiv werden direkt wiedergegeben; eine Größenangabe steht in diesem Vers nicht.
- source_word: ἐκ τῆς θύρας
  choice: vom Eingang
  rationale: θύρα kann Tür, Türöffnung oder Eingang bedeuten. Bei einem Felsengrab ist „Eingang“ im modernen Deutschen sachlich und idiomatisch; ἐκ bezeichnet das Entfernen von dieser Stelle.
- source_word: τοῦ μνημείου
  choice: des Grabes
  rationale: μνημεῖον bezeichnet hier die Grabstätte beziehungsweise das Grab, in das Jesus gelegt worden war.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und bewahrt die konkrete Bildsprache. Keine Fußnote ist nötig, da „Eingang“ die kontextuell passende Bedeutung von θύρα klar wiedergibt.
