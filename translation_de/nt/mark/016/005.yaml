source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: de
  text: Als sie das Grab betraten, sahen sie auf der rechten Seite einen jungen Mann[a] sitzen, der ein weißes Gewand trug. Da erschraken sie sehr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mögliche Deutung: ein Engel. Markus beschreibt ihn hier als „jungen Mann“; der weitere Zusammenhang und die Parallelberichte weisen auf einen Engel als Boten hin.'
    reason: Die Anmerkung kennzeichnet die engelhafte Identifikation als kontextuelle Deutung statt als Übersetzungsalternative und wahrt damit den ausdrücklichen Wortlaut von νεανίσκος.
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: Als sie … hineingingen
  rationale: Das feminine aoristische Partizip bezieht sich auf die Frauen und wird als natürliche deutsche Zeitangabe wiedergegeben; „hineingingen“ macht die Bewegung in das Grab deutlich.
- source_word: μνημεῖον
  choice: Grab
  rationale: Im Bestattungskontext bezeichnet das Wort die Grabanlage; „Grab“ ist die übliche und klare deutsche Wiedergabe.
- source_word: νεανίσκον
  choice: einen jungen Mann
  rationale: Der griechische Text beschreibt die Gestalt ausdrücklich als jungen Mann und nennt sie in diesem Vers nicht ausdrücklich einen Engel.
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: auf der rechten Seite … sitzen
  rationale: Die Formulierung gibt sowohl die sitzende Haltung als auch die Position innerhalb des Grabes idiomatisch wieder.
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: der ein weißes Gewand trug
  rationale: Das Perfektpartizip bezeichnet den bekleideten Zustand; „Gewand“ wahrt den Sinn eines auffälligen, längeren Kleidungsstücks, ohne unnötig zu spezifizieren.
- source_word: ἐξεθαμβήθησαν
  choice: Da erschraken sie sehr
  rationale: Das Verb bezeichnet heftige Bestürzung oder Erschrockenheit und ist stärker als bloßes Erstaunen. „Sehr erschrecken“ gibt diese Intensität in natürlichem Deutsch wieder.
theological_decisions:
- issue: Identität des νεανίσκος
  choice: Im Haupttext beschreibend als „junger Mann“ wiedergeben.
  alternative: Engel
  rationale: Obwohl Kleidung, Funktion und Parallelberichte auf einen Engel als Boten hinweisen, nennt Markus die Gestalt hier νεανίσκος. Die Übersetzung bewahrt diese Erzählformulierung; die mögliche Identifikation wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der lange griechische Satz wird zur natürlichen deutschen Gewichtung vor „Da erschraken sie sehr“ geteilt; das einleitende καί bleibt implizit, da ein vorangestelltes „Und“ im Deutschen hier schwerfälliger wäre.
