  source_fidelity: 'Die Übersetzung gibt die griechische Satzfolge und die Bezüge zuverlässig wieder: κἀκεῖνοι als „Und sie“, das vorzeitige ἀπελθόντες idiomatisch als „gingen weg“, ἀπήγγειλαν als „berichteten es“, τοῖς λοιποῖς als „den Übrigen“ sowie οὐδὲ ... ἐπίστευσαν als „doch auch ihnen glaubten sie nicht“. Das Dativpronomen „ihnen“ bezieht sich klar auf die beiden Berichtenden.'
  naturalness: Modernes, verständliches Standarddeutsch mit angemessen würdigem biblischem Erzählregister. Die Stellung „auch ihnen glaubten sie nicht“ ist natürlich und hebt die additive Verneinung passend hervor.
