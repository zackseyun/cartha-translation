id: MRK.16.13
reference: Mark 16:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: κἀκεῖνοι ἀπελθόντες ἀπήγγειλαν τοῖς λοιποῖς· οὐδὲ ἐκείνοις ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: de
  text: Und sie gingen weg und berichteten es den Übrigen[a]; doch auch ihnen glaubten sie nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den anderen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Und sie
  rationale: Die Verbindung aus καί und ἐκεῖνοι bedeutet hier „und jene“ beziehungsweise kontextbezogen „und sie“. Das natürliche deutsche Pronomen wahrt den Rückbezug auf die beiden zuvor Genannten, ohne das im Griechischen nicht ausdrücklich stehende Substantiv „Männer“ einzufügen.
- source_word: ἀπελθόντες
  choice: gingen weg
  rationale: Das Aoristpartizip bezeichnet eine der Meldung vorausgehende Bewegung. Die finite deutsche Nebenordnung gibt die zeitliche Abfolge natürlich wieder.
- source_word: ἀπήγγειλαν
  choice: berichteten es
  rationale: ἀπαγγέλλω bezeichnet das Überbringen oder Berichten einer Nachricht. „Es“ ergänzt im Deutschen das aus dem Kontext erschließbare, im Griechischen unausgesprochene Objekt.
- source_word: τοῖς λοιποῖς
  choice: den Übrigen
  rationale: λοιπός bezeichnet die verbleibenden Angehörigen der Gruppe. „Den Übrigen“ ist knapp und bewahrt diesen Bezug; „den anderen“ ist ebenfalls möglich.
- source_word: οὐδὲ
  choice: doch auch … nicht
  rationale: οὐδέ verbindet die erneute Reaktion des Unglaubens additiv mit dem Vorhergehenden. Die deutsche Fügung bringt sowohl den erzählerischen Gegensatz als auch das „ebenfalls nicht“ zum Ausdruck.
- source_word: ἐκείνοις
  choice: ihnen
  rationale: Der Dativ verweist auf die beiden Berichtenden zurück und wird nach „glauben“ im Deutschen idiomatisch mit „ihnen“ wiedergegeben.
- source_word: ἐπίστευσαν
  choice: glaubten … nicht
  rationale: πιστεύω meint in diesem Erzählzusammenhang, dem überbrachten Zeugnis Glauben zu schenken. „Glauben“ wahrt die gewöhnliche Bedeutung, ohne sie unnötig zu „vertrauen“ oder zu einer dogmatischen Formel zu erweitern.
theological_decisions:
- issue: Bedeutung von πιστεύω im Zusammenhang eines berichteten Zeugnisses
  choice: ihnen glaubten sie nicht
  alternative: sie vertrauten ihnen nicht
  rationale: Hier geht es unmittelbar um die Nichtannahme des Berichts. „Glauben“ trifft diesen Sinn genauer als „vertrauen“, das stärker eine persönliche Verlässlichkeit oder Beziehung betonen könnte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung „doch auch ihnen glaubten sie nicht“ erhält den Bezug von ἐκείνοις auf die beiden Berichtenden und gibt die additive Kraft von οὐδέ klar wieder.
