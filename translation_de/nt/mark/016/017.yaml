source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: de
  text: 'Diese Zeichen aber werden die begleiten, die zum Glauben gekommen sind: In meinem Namen werden sie Dämonen austreiben; sie werden in neuen Zungen[a] sprechen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sprachen“. Das griechische Wort kann sowohl „Zungen“ als auch „Sprachen“ bedeuten; die Art dieses Sprechens wird hier nicht näher bestimmt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: Zeichen
  rationale: „Zeichen“ bewahrt den Hinweischarakter des griechischen Wortes und verengt es nicht auf den allgemeineren Begriff „Wunder“.
- source_word: τοῖς πιστεύσασιν
  choice: die, die zum Glauben gekommen sind
  rationale: Die Formulierung gibt das Aoristpartizip als erfolgten Eintritt in den Glauben wieder und bleibt zugleich auf die betreffende Personengruppe allgemein anwendbar.
- source_word: παρακολουθήσει
  choice: werden … begleiten
  rationale: Das Verb bezeichnet hier ein Mitgehen oder Begleiten. „Begleiten“ vermeidet den möglichen Eindruck, die Zeichen folgten lediglich zeitlich nach.
- source_word: ἐν τῷ ὀνόματί μου
  choice: in meinem Namen
  rationale: Die natürliche deutsche Wendung bringt Handeln unter der Autorität Jesu zum Ausdruck, ohne die Präposition unnötig auszudeuten.
- source_word: δαιμόνια ἐκβαλοῦσιν
  choice: werden … Dämonen austreiben
  rationale: „Dämonen“ entspricht dem verwendeten Substantiv; „austreiben“ ist im Deutschen die klare und geläufige Bezeichnung für die hier gemeinte Vertreibung.
- source_word: γλώσσαις … καιναῖς
  choice: in neuen Sprachen
  rationale: γλῶσσα kann die Zunge oder eine Sprache bezeichnen. „Sprachen“ ist in modernem Deutsch verständlich; die Fußnote hält die wörtliche Ausdrucksweise und die sachliche Offenheit fest.
- source_word: λαλήσουσιν
  choice: sie werden … sprechen
  rationale: „Sprechen“ ist die natürliche, stilistisch angemessene Wiedergabe des gewöhnlichen griechischen Verbs.
theological_decisions:
- issue: Art des Sprechens „in neuen Sprachen/Zungen“
  choice: Der Haupttext lautet „in neuen Sprachen“, ohne das Phänomen näher zu bestimmen.
  alternative: „mit/in neuen Zungen sprechen“ oder ausdrückliche Festlegung auf bekannte Fremdsprachen beziehungsweise ekstatische Rede
  rationale: Der griechische Ausdruck benennt das Phänomen nicht so genau, dass zwischen menschlichen Fremdsprachen und andersartiger Zungenrede sicher entschieden werden könnte. Die Fußnote bewahrt diese Offenheit.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. „Zum Glauben gekommen“ ist natürlicher als „gläubig geworden“; „begleiten“ gibt die Beziehung der Zeichen zu den Glaubenden präziser wieder als das traditionelle „folgen“.
