  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: de
  text: Und als sie hörten, dass er lebt[a] und von ihr gesehen worden war[b], glaubten sie es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „er sei am Leben“. Im Griechischen steht ein Verb im Präsens: „er lebt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „von ihr gesehen wurde“. Die deutsche Zeitform „gesehen worden war“ ordnet das Sehen als dem Hören vorausgehend ein.'
    reason: translation_note
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: Und … sie
  rationale: Die Verbindung aus καί und ἐκεῖνοι knüpft an die zuvor erwähnte Gruppe an. Im Deutschen verweist „sie“ natürlich auf diese Gruppe; „und“ bewahrt den erzählerischen Anschluss.
- source_word: ἀκούσαντες
  choice: als sie hörten
  rationale: Das adverbiale Aoristpartizip bezeichnet hier am natürlichsten den Zeitpunkt beziehungsweise Anlass ihres Unglaubens.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was sie hörten.
- source_word: ζῇ
  choice: er lebt
  rationale: Das griechische Präsens bezeichnet Jesus als lebend. Das deutsche Präsens gibt diese Zeitform und die fortdauernde Aussage unmittelbar wieder.
- source_word: καὶ
  choice: und
  rationale: 'Die Konjunktion verbindet die beiden Inhalte der Botschaft: dass Jesus lebt und dass er von ihr gesehen worden war.'
- source_word: ἐθεάθη
  choice: gesehen worden war
  rationale: Die passive Form bezeichnet, dass Jesus gesehen wurde. Das Plusquamperfekt macht im deutschen Erzählzusammenhang deutlich, dass dieses Sehen dem Hören vorausging, ohne aus dem Verb ausdrücklich „erschien“ zu machen.
- source_word: ὑπ’ αὐτῆς
  choice: von ihr
  rationale: Die Formulierung bewahrt das Pronomen und die Agensangabe des Griechischen, ohne den Namen aus dem Kontext in den Vers einzusetzen.
- source_word: ἠπίστησαν
  choice: glaubten sie es nicht
  rationale: Die Wendung gibt die Verneinung von πιστεύω direkt und idiomatisch wieder. Das im Deutschen nötige „es“ bezieht sich auf die gehörte Botschaft und fügt keinen neuen Inhalt hinzu.
theological_decisions:
- issue: Zeitform der Aussage über das Auferstehungsleben Jesu
  choice: er lebt
  alternative: er sei am Leben / er war am Leben
  rationale: Das Präsens ζῇ wird im Deutschen als Präsens wiedergegeben und wahrt so die Aussage fortdauernden Lebens. Eine Form der indirekten Rede oder eine Vergangenheitsform wäre sprachlich möglich, würde die griechische Zeitform aber weniger unmittelbar abbilden.
- issue: Art der Begegnung mit Maria
  choice: von ihr gesehen worden war
  alternative: ihr erschienen war
  rationale: Die passive Form ἐθεάθη mit ὑπ’ αὐτῆς stellt das Gesehenwerden in den Vordergrund. „Erschienen“ ist im Auferstehungskontext möglich, verschiebt die Perspektive jedoch stärker auf Jesu Selbstoffenbarung und wird deshalb nur als Alternative genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Ablauf, ist aber idiomatisch. Das Präsens „er lebt“ bewahrt die markante Zeitform der Auferstehungsaussage; die passive Wahrnehmungsform wird nicht vorschnell als Erscheinungsterminologie festgelegt.
