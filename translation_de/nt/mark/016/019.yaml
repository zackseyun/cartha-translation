source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: de
  text: Der Herr Jesus wurde nun, nachdem er zu ihnen gesprochen hatte, in den Himmel aufgenommen und setzte sich zur Rechten Gottes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὲν οὖν
  choice: Daraufhin
  rationale: Die Partikelverbindung leitet folgernd und zugleich zusammenfassend zum nächsten Geschehen über. „Daraufhin“ gibt den Übergang und die zeitlich-folgernde Verknüpfung natürlich wieder, ohne die Partikeln übermäßig auszudeuten.
- source_word: κύριος Ἰησοῦς
  choice: der Herr Jesus
  rationale: „Herr“ bewahrt das Gewicht des christologischen Titels κύριος; der griechische Artikel wird im Deutschen mit „der“ wiedergegeben.
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: nachdem er zu ihnen gesprochen hatte
  rationale: μετά mit substantiviertem Infinitiv bezeichnet hier die zeitliche Vorordnung. Der deutsche Nebensatz macht das Subjekt und die Abfolge klar und gibt αὐτοῖς mit „zu ihnen“ wieder.
- source_word: ἀνελήμφθη
  choice: wurde ... aufgenommen
  rationale: Die passive Form bleibt erhalten. „Aufgenommen“ bezeichnet in Verbindung mit dem folgenden Ziel die Himmelfahrt, ohne den Handelnden ausdrücklich zu ergänzen.
- source_word: εἰς τὸν οὐρανόν
  choice: in den Himmel
  rationale: „In den Himmel“ entspricht der gerichteten Bewegung von εἰς mit Akkusativ und ist im Deutschen idiomatisch.
- source_word: ἐκάθισεν
  choice: setzte sich
  rationale: Die Form bezeichnet das Einnehmen einer sitzenden Stellung; „setzte sich“ gibt diesen vollzogenen Vorgang natürlicher und genauer wieder als das bloße „saß“.
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: zur Rechten Gottes
  rationale: Die feste Wendung ἐκ δεξιῶν bezeichnet die Ehrenstellung an Gottes rechter Seite. „Zur Rechten Gottes“ ist die etablierte, würdevolle deutsche Entsprechung und vermeidet eine unpassende wörtliche Wiedergabe von ἐκ.
theological_decisions:
- issue: Himmelfahrt und Erhöhung ohne dogmatische Erweiterung wiedergeben
  choice: wurde ... in den Himmel aufgenommen und setzte sich zur Rechten Gottes
  alternative: wurde in den Himmel hinaufgenommen und nahm seinen Platz an der rechten Seite Gottes ein
  rationale: Die Fassung bewahrt das Passiv der Aufnahme sowie das anschließende Sichsetzen und damit die Aussagen des griechischen Textes, ohne einen nicht ausdrücklich genannten Handelnden oder zusätzliche Aussagen über die Art der Erhöhung einzufügen.
- issue: κύριος als christologischen Titel wiedergeben
  choice: der Herr Jesus
  alternative: Jesus, der Herr
  rationale: „Herr“ erhält die im Neuen Testament übliche und theologisch gewichtige Titulatur. Die Wortfolge folgt dem griechischen Ausdruck, ohne ihn auf eine rein gesellschaftliche Anrede wie „Meister“ zu verengen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem biblischem Register. Die Satzstruktur bleibt nah am griechischen Ablauf, klingt jedoch natürlich. Keine Fußnote ist erforderlich, da die idiomatischen Wendungen im Haupttext klar und ohne wesentlichen Bedeutungsverlust wiedergegeben werden.
