  naturalness: Der temporale Nebensatz ist idiomatisches modernes Standarddeutsch. Die kausale Erläuterung liest sich mit Komma und „denn“ natürlicher und enger an den griechischen Satz angeschlossen als mit Semikolon und „nämlich“.
  terminology: „Stein“ ist korrekt und setzt keine zusätzliche Erklärung voraus. „Außerordentlich groß“ gibt die starke Intensivierung μέγας σφόδρα präziser wieder als das etwas schwächere „sehr groß“, ohne unnatürlich zu wirken.
