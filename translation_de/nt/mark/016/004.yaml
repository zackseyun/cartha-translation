  text: καὶ ἀναβλέψασαι θεωροῦσιν ὅτι ⸀ἀποκεκύλισται ὁ λίθος, ἦν γὰρ μέγας σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/004.yaml
  text: And looking up[a], they saw that the stone had been rolled away, for it was extremely large.
translation:
  language: de
  text: Und als sie aufblickten, sahen sie, dass der Stein weggewälzt worden war, denn er war außerordentlich groß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψασαι
  choice: als sie aufblickten
  rationale: Das aoristische Partizip bezeichnet hier am natürlichsten das Aufheben des Blicks. Ein temporaler Nebensatz gibt die Beziehung zum Hauptverb in idiomatischem Deutsch wieder.
- source_word: θεωροῦσιν
  choice: sahen sie
  rationale: Das historische Präsens wird im deutschen Erzählstil natürlich als Präteritum wiedergegeben. „Sahen“ vermittelt die visuelle Wahrnehmung ohne unnötige Feierlichkeit.
- source_word: ὅτι
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt dessen ein, was die Frauen sahen.
- source_word: ἀποκεκύλισται
  choice: weggewälzt war
  rationale: 'Das Perfekt Passiv bezeichnet eine vollzogene Handlung mit fortbestehendem Ergebnis: Als die Frauen hinsahen, befand sich der Stein bereits in weggewälztem Zustand.'
- source_word: ὁ λίθος
  choice: der Stein
  rationale: Die schlichte Wiedergabe ist im Zusammenhang eindeutig und fügt keine im griechischen Text nicht ausdrücklich enthaltene Erklärung hinzu.
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: er war nämlich sehr groß
  rationale: „Nämlich“ gibt die erklärende Funktion von γάρ wieder; „sehr groß“ ist eine natürliche und nachdrückliche Entsprechung für μέγας σφόδρα.
- source_word: καὶ
  choice: Und
  rationale: Die einfache Verbindung setzt den Erzählfluss des vorangehenden Verses fort.
