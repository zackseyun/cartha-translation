  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πιστεύσας καὶ βαπτισθεὶς σωθήσεται, ὁ δὲ ἀπιστήσας κατακριθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: de
  text: Wer geglaubt hat und getauft worden ist, wird gerettet werden; wer aber nicht geglaubt hat, wird verurteilt werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Markus 16,9–20 fehlt in einigen der ältesten und wichtigsten Handschriften; andere Handschriften bieten einen kürzeren oder einen abweichenden Schluss. Der sogenannte längere Markusschluss ist jedoch in zahlreichen Handschriften und frühkirchlichen Zeugnissen überliefert.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: wer geglaubt hat
  rationale: Der substantivierte Aoristpartizip bezeichnet allgemein die Person, auf die die Handlung zutrifft. „Wer geglaubt hat“ gibt den repräsentativen Singular und die dem zukünftigen Ergebnis vorausgehende Handlung in natürlichem Deutsch wieder.
- source_word: βαπτισθεὶς
  choice: getauft worden ist
  rationale: Das passive Aoristpartizip wird als dem zukünftigen Ergebnis vorausgehend wiedergegeben. Die Formulierung wahrt ausdrücklich das Passiv und koordiniert die Taufe eng mit dem Glauben.
- source_word: σωθήσεται
  choice: wird gerettet werden
  rationale: Das Futur Passiv von σῴζω hat hier den üblichen heilsgeschichtlichen Sinn. „Gerettet werden“ ist direkt, verständlich und fügt keine nähere dogmatische Erklärung hinzu.
- source_word: ὁ δὲ ἀπιστήσας
  choice: wer aber nicht geglaubt hat
  rationale: Die Formulierung erhält den Gegensatz zu πιστεύσας, den substantivischen Gebrauch und den Aoristaspekt. „Aber“ gibt die kontrastierende Funktion von δέ wieder.
- source_word: κατακριθήσεται
  choice: wird verurteilt werden
  rationale: Das Futur Passiv bezeichnet ein nachteiliges Gerichtsurteil. „Verurteilt werden“ ist dafür die direkte und natürliche deutsche Entsprechung.
theological_decisions:
- issue: Verhältnis von Glauben und Taufe zur Rettung
  choice: Beide Partizipien werden gleichrangig als Beschreibung dessen wiedergegeben, der gerettet werden wird; im zweiten Satz wird allein der Unglaube als Grund der Verurteilung genannt.
  alternative: Die Taufe ausdrücklich als wirksame Heilsursache darstellen oder ihre Verbindung mit der Rettung sprachlich abschwächen.
  rationale: Der griechische Text verbindet Glauben und Getauftwerden mit καί, nennt im Gegensatzsatz jedoch nur den Unglauben. Die Übersetzung bewahrt diese Spannung, ohne eine konfessionelle Deutung einzutragen.
- issue: Generischer maskuliner Singular
  choice: Die Konstruktion wird mit dem generischen „wer“ wiedergegeben.
  alternative: Eine formalere Wiedergabe wie „derjenige, der“ oder eine Pluralform.
  rationale: „Wer“ erfasst den allgemein-repräsentativen Sinn der substantivierten maskulinen Singularpartizipien, ohne den Bezug fälschlich auf Männer zu beschränken, und klingt im heutigen Deutsch natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Perfektformen bewahren die dem zukünftigen Ergebnis vorausgehende Perspektive der Aoristpartizipien; das doppelte Futur Passiv hält die Parallelität der beiden Hauptsätze aufrecht.
