  source_fidelity: 'Die Übersetzung bildet die Struktur des griechischen Textes genau ab: beide aoristischen Partizipien im ersten Glied werden als dem zukünftigen Ergebnis vorausliegend dargestellt, das Passiv von βαπτισθείς bleibt erhalten, und der Kontrast von δέ wird mit „aber“ angemessen wiedergegeben. „Wer aber nicht geglaubt hat“ wahrt den verbalen Gegensatz zu „geglaubt hat“, ohne die im zweiten Glied nicht genannte Taufe ergänzend einzutragen.'
  naturalness: „Wer geglaubt hat und getauft worden ist, wird gerettet werden; wer aber nicht geglaubt hat, wird verurteilt werden“ ist grammatisch korrektes, modernes und würdiges Standarddeutsch. Die doppelte Futurpassivform ist etwas formeller, aber für einen eng am Ausgangstext orientierten Bibeltext natürlich und klar.
  terminology: „Gerettet“ gibt den soteriologischen Sinn von σωθήσεται sachgerecht wieder; „verurteilt“ ist eine treffende, idiomatische Wiedergabe von κατακριθήσεται. Die generische Form „wer“ ist für die substantivierten maskulinen Singularpartizipien angemessen. Die Fußnote formuliert die textkritische Lage des längeren Markusschlusses ausgewogen und ohne überzogene Sicherheit.
