  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: de
  text: Und sie gingen hinaus und flohen vom Grab[a], denn Zittern und Bestürzung hatten sie ergriffen. Sie sagten niemandem etwas, denn sie fürchteten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen den sogenannten kürzeren Schluss hinzu: „Alles, was ihnen aufgetragen worden war, berichteten sie kurz denen um Petrus. Danach sandte auch Jesus selbst durch sie vom Osten bis zum Westen die heilige und unvergängliche Verkündigung des ewigen Heils aus. Amen.“'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: da gingen sie hinaus
  rationale: Das feminine Partizip im Aorist bezieht sich auf die Frauen und bezeichnet die dem Fliehen vorausgehende Handlung; die Wiedergabe mit „da“ wahrt den Ablauf in natürlichem Deutsch.
- source_word: ἔφυγον
  choice: flohen
  rationale: Die direkte Wiedergabe erhält die Eindringlichkeit von φεύγω.
- source_word: μνημείου
  choice: Grab
  rationale: Im Zusammenhang der Auferstehung bezeichnet μνημεῖον die Grabanlage; „Grab“ ist die klare und übliche deutsche Entsprechung.
- source_word: εἶχεν αὐτὰς
  choice: hatten sie ergriffen
  rationale: Die idiomatische Verbindung beschreibt, dass die genannten Regungen von den Frauen Besitz ergriffen hatten. Der deutsche Plural richtet sich natürlich nach dem zusammengesetzten Subjekt „Zittern und Bestürzung“.
- source_word: τρόμος
  choice: Zittern
  rationale: „Zittern“ bewahrt den körperlich wahrnehmbaren Aspekt des Wortes und nimmt die abschließende Aussage über ihre Furcht nicht vorweg.
- source_word: ἔκστασις
  choice: Bestürzung
  rationale: Hier bezeichnet das Wort einen Zustand überwältigenden Erstaunens oder Außer-sich-Seins. „Bestürzung“ gibt den erschütternden Kontext wieder, ohne den heute missverständlichen Ausdruck „Ekstase“ zu verwenden.
- source_word: οὐδενὶ οὐδὲν
  choice: niemandem etwas
  rationale: Zusammen mit der deutschen Verneinung „nicht“ gibt diese Formulierung die umfassende griechische Negation idiomatisch wieder.
- source_word: ἐφοβοῦντο
  choice: sie fürchteten sich
  rationale: Das Imperfekt beschreibt ihren anhaltenden Zustand; die reflexive Form ist würdig, verständlich und nahe am griechischen Ausdruck.
- source_word: γάρ
  choice: denn
  rationale: Beide Vorkommen werden kausal mit „denn“ wiedergegeben. Beim letzten bewahrt dies besonders den erklärenden und zugleich abrupten Schluss des Verses.
theological_decisions:
- issue: Behandlung des in Doppelklammern gesetzten kürzeren Markusschlusses
  choice: Der Zusatz steht nicht im Haupttext, wird aber vollständig in einer textkritischen Fußnote wiedergegeben.
  alternative: Den kürzeren Schluss in den Haupttext aufnehmen oder beide Schlüsse dort abdrucken.
  rationale: Der SBLGNT kennzeichnet diese Sätze mit Doppelklammern als sekundären Zusatz. Der Haupttext folgt daher dem dort gebotenen Ausgang von Vers 8, während die Fußnote die Überlieferungsvariante transparent dokumentiert.
- issue: Abrupter Abschluss mit ἐφοβοῦντο γάρ
  choice: „denn sie fürchteten sich“
  alternative: Den Satz stilistisch ergänzen oder den erklärenden Anschluss glätten.
  rationale: Die Übersetzung bewahrt den auffälligen, spannungsvollen Abschluss des griechischen Haupttextes, ohne eine nicht ausgesprochene Folgerung hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die kurzen Hauptsätze und das zweimalige „denn“ erhalten die knappe, spannungsvolle Gestalt des griechischen Textes; der textkritische Zusatz wird nicht stillschweigend in den Vers aufgenommen.
