  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο παρακαλεῖν αὐτὸν ἀπελθεῖν ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: de
  text: Und sie fingen an, ihn eindringlich zu bitten, ihr Gebiet zu verlassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Gegend zu verlassen“.'
    reason: Lexikalische Alternative für ὅρια, das sowohl „Gebiet“ als auch „Gegend/Region“ bezeichnen kann.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die einfache Verknüpfung mit dem vorausgehenden Erzählgeschehen, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ἤρξαντο
  choice: sie fingen an
  rationale: Gibt den ingressiven Sinn von ἄρχομαι mit Infinitiv natürlich und nah an der griechischen Form wieder.
- source_word: παρακαλεῖν
  choice: eindringlich zu bitten
  rationale: παρακαλέω bezeichnet hier eine dringliche Bitte. Die Formulierung bewahrt die Intensität, ohne das stärkere deutsche „anflehen“ zwingend vorauszusetzen.
- source_word: αὐτὸν
  choice: ihn
  rationale: Das Akkusativpronomen bezieht sich im Erzählzusammenhang auf Jesus.
- source_word: ἀπελθεῖν
  choice: zu verlassen
  rationale: Der Infinitiv nennt den Inhalt ihrer Bitte; „ihr Gebiet verlassen“ ist im modernen Deutschen idiomatisch.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: ihr Gebiet
  rationale: ὅρια bezeichnet wörtlich Grenzen, im Plural hier aber das von diesen Grenzen umschlossene Gebiet. „Ihr Gebiet“ gibt die räumliche Bedeutung klar wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzählregister. „Eindringlich zu bitten“ vermittelt die Dringlichkeit von παρακαλεῖν in natürlichem Standarddeutsch; die Satzstruktur bleibt eng am Griechischen.
