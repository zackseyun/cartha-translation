id: MRK.5.40
reference: Mark 5:40
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ. ⸀αὐτὸς δὲ ἐκβαλὼν πάντας παραλαμβάνει τὸν πατέρα τοῦ παιδίου καὶ τὴν μητέρα καὶ τοὺς μετ’ αὐτοῦ, καὶ εἰσπορεύεται ὅπου ἦν τὸ ⸀παιδίον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: de
  text: Und sie lachten ihn aus.[a] Er aber schickte alle hinaus, nahm den Vater und die Mutter des Kindes sowie seine Begleiter[b] mit und ging hinein, wo das Kind war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie verspotteten ihn“. Das griechische Verb bezeichnet spöttisches, höhnisches Lachen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint sind Petrus, Jakobus und Johannes, die Jesus begleiteten; siehe Vers 37.
    reason: cross_reference
lexical_decisions:
- source_word: κατεγέλων
  choice: sie lachten ihn aus
  rationale: Das Imperfekt beschreibt das anhaltende bzw. einsetzende spöttische Lachen; „auslachen“ gibt die von καταγελάω bezeichnete Verhöhnung natürlich und präzise wieder.
- source_word: ἐκβαλὼν πάντας
  choice: schickte alle hinaus
  rationale: Das vorzeitige Partizip bezeichnet, dass Jesus zunächst alle Anwesenden hinausbrachte. „Hinausschicken“ wahrt die nachdrückliche Handlung, ohne im Deutschen unnötig an eine gewaltsame Vertreibung oder Dämonenaustreibung denken zu lassen.
- source_word: παραλαμβάνει
  choice: nahm … mit
  rationale: Das historische Präsens wird im Deutschen idiomatisch als Erzählpräteritum wiedergegeben. „Mitnehmen“ drückt aus, dass Jesus eine ausgewählte Gruppe zu sich nimmt und hineinführt.
- source_word: παιδίου / παιδίον
  choice: Kind
  rationale: Das griechische παιδίον ist hier grammatisch sächlich und bezeichnet allgemein ein Kind. Obwohl der Kontext das Kind als Tochter des Jaïrus ausweist, bewahrt „Kind“ die Ausdrucksweise dieses Verses.
- source_word: τοὺς μετ’ αὐτοῦ
  choice: seine Begleiter
  rationale: Die Wendung bezeichnet diejenigen, die mit Jesus waren. „Seine Begleiter“ ist im Deutschen natürlich, ohne ihre Identität im Haupttext ausdrücklich festzulegen.
- source_word: εἰσπορεύεται
  choice: ging hinein
  rationale: Das historische Präsens wird entsprechend natürlichem deutschen Erzählstil im Präteritum wiedergegeben; die Bewegung in den Raum wird mit „hineingehen“ klar ausgedrückt.
- source_word: ὅπου ἦν τὸ παιδίον
  choice: wo das Kind war
  rationale: Die schlichte Ortsangabe wird bewahrt; „lag“ wäre aus dem Zusammenhang plausibel, steht aber nicht ausdrücklich im griechischen Wortlaut.
theological_decisions:
- issue: Historisches Präsens und Erzählstil
  choice: Die historischen Präsensformen παραλαμβάνει und εἰσπορεύεται werden im deutschen Erzählpräteritum wiedergegeben.
  alternative: 'Die Formen wörtlich als Präsens wiedergeben: „nimmt … mit und geht hinein“.'
  rationale: Anders als im Englischen wirkt ein unvermittelter Wechsel ins historische Präsens in diesem deutschen Erzählzusammenhang markiert und weniger natürlich. Das Präteritum wahrt den Handlungsablauf, ohne eine theologische Deutung einzutragen.
- issue: Identität von τοὺς μετ’ αὐτοῦ
  choice: Im Haupttext allgemein „seine Begleiter“, mit Erläuterung in der Fußnote.
  alternative: Im Haupttext ausdrücklich „seine Jünger“.
  rationale: Der unmittelbare griechische Wortlaut nennt die Personen nicht ausdrücklich Jünger; der Kontext von Markus 5,37 macht jedoch deutlich, dass Petrus, Jakobus und Johannes gemeint sind. Die Übersetzung bewahrt diese textliche Abstufung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt flüssig und erzählerisch. „Lachten ihn aus“ ist allgemein verständlich und bewahrt den spöttischen Sinn; „Kind“ folgt bewusst der neutralen Bezeichnung des griechischen Textes.
