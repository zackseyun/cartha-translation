source:
  edition: SBLGNT
  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: de
  text: Und ununterbrochen, Nacht und Tag, hielt er sich in den Gräbern und in den Bergen auf, schrie und schlug sich mit Steinen wund.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „fügte sich mit Steinen Schnittwunden zu“.'
    reason: Das griechische Verb kann heftiges Wundschlagen ebenso wie Aufschneiden beziehungsweise das Zufügen von Schnittwunden bezeichnen.
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: ständig, Nacht und Tag
  rationale: Die Wendung bezeichnet ein fortwährendes Geschehen über Nacht und Tag hinweg; die deutsche Formulierung gibt sowohl die Dauer als auch den Zeitumfang natürlich wieder.
- source_word: μνήμασιν
  choice: Grabhöhlen
  rationale: μνῆμα bezeichnet eine Grabstätte. Im erzählten Umfeld sind wahrscheinlich in Fels gehauene Gräber gemeint; „Grabhöhlen“ ist für moderne Leser anschaulich und vermeidet die Vorstellung bloßer Erdgräber.
- source_word: ὄρεσιν
  choice: Bergen
  rationale: ὄρος bezeichnet gewöhnlich einen Berg oder eine bergige Erhebung. „Bergen“ ist die direkte Entsprechung und lässt die Geländehöhe offen.
- source_word: ἦν κράζων
  choice: war er …, schrie
  rationale: Die Verbindung aus Imperfekt und Partizip beschreibt fortdauerndes beziehungsweise wiederholtes Schreien. Zusammen mit „ständig“ wird dieser durative Aspekt im Deutschen klar ausgedrückt.
- source_word: κατακόπτων ἑαυτὸν
  choice: schlug sich … wund
  rationale: κατακόπτω kann heftiges Schlagen oder Aufschneiden bezeichnen. Da Steine als Werkzeug genannt werden, wahrt „schlug sich wund“ die Art der Verletzung besser als das enger festlegende „schnitt sich“.
- source_word: λίθοις
  choice: mit Steinen
  rationale: Der Dativ ist instrumental und wird im Deutschen natürlich mit „mit“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, gut verständliche und zugleich würdige Erzählsprache. Die Satzstellung hält die Schauplätze zusammen und vermittelt durch „ständig, Nacht und Tag“ sowie die fortlaufenden Verben das unablässige Geschehen.
