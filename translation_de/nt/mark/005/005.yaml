  source_fidelity: Die Zeitangabe und die fortdauernden Handlungen sind grundsätzlich treffend wiedergegeben. „Grabhöhlen“ legt jedoch eine im griechischen Wort μνήματα nicht ausdrücklich enthaltene Bauform fest; „Gräbern“ ist quellennäher. Die Verknüpfung „war er …, schrie und schlug“ ist im Deutschen zudem syntaktisch und aspektuell weniger klar als eine Konstruktion mit „hielt er sich … auf“.
  naturalness: Die Überarbeitung bietet eine idiomatische moderne Erzählsprache. „Ununterbrochen, Nacht und Tag“ gibt die nachdrückliche Zeitangabe natürlich wieder, und „hielt er sich … auf“ verbindet die Ortsangaben sauber mit den fortlaufenden Handlungen.
  terminology: „Gräber“ entspricht μνήματα ohne zusätzliche Lokalisierung auf Fels- oder Höhlengräber. „Sich mit Steinen wund schlagen“ erhält die gewaltsame, selbstzugefügte Verletzung und lässt wie das Griechische offen, ob dabei eher Schlagen oder Schneiden/Gashing im Vordergrund steht; die Fußnote dokumentiert die mögliche präzisere Alternative.
