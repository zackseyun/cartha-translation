id: MRK.5.20
reference: Mark 5:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: de
  text: Da ging er fort und begann in der Dekapolis zu verkünden, wie viel Jesus für ihn getan hatte[a]. Und alle staunten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was Jesus für ihn getan hatte“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ging er fort
  rationale: Die Aoristform von ἀπέρχομαι bezeichnet das Weggehen vom Schauplatz; „ging fort“ ist natürlich und bewahrt die Bewegungsbedeutung.
- source_word: ἤρξατο κηρύσσειν
  choice: begann … zu verkünden
  rationale: ἤρξατο mit Infinitiv bezeichnet den Beginn der Handlung. „Verkünden“ gibt die öffentliche Bekanntmachung wieder, ohne eine förmliche Predigtsituation vorauszusetzen.
- source_word: ἐν τῇ Δεκαπόλει
  choice: in der Dekapolis
  rationale: ἐν wird direkt mit „in“ wiedergegeben; „Dekapolis“ ist die gebräuchliche Bezeichnung für dieses Gebiet der zehn Städte.
- source_word: ὅσα
  choice: wie viel
  rationale: ὅσα kann hier den Umfang dessen hervorheben, was Jesus getan hat. Die mögliche Wiedergabe „alles, was“ wird in der Fußnote bewahrt.
- source_word: ἐποίησεν αὐτῷ
  choice: für ihn getan hatte
  rationale: Der Dativ αὐτῷ bezeichnet hier den Begünstigten. Das deutsche Plusquamperfekt stellt natürlich klar, dass Jesu Handeln der Verkündigung vorausging.
- source_word: πάντες
  choice: alle
  rationale: „Alle“ gibt πάντες knapp und direkt wieder, ohne eine im Griechischen nicht ausdrücklich genannte Personengruppe hinzuzufügen.
- source_word: ἐθαύμαζον
  choice: staunten
  rationale: Das Imperfekt beschreibt die anhaltende oder wiederholte Reaktion. „Staunten“ ist modernes, natürliches Deutsch.
- source_word: ὁ Ἰησοῦς
  choice: Jesus
  rationale: Der Personenname wird nach der im Deutschen üblichen Form wiedergegeben.
theological_decisions:
- issue: Tragweite der Verkündigung des Mannes im Blick auf Jesu Identität
  choice: Der Mann verkündet ohne erläuternde Erweiterung, was Jesus für ihn getan hat.
  alternative: Eine ausdrücklich theologische Paraphrase, die Jesu göttliche Vollmacht hervorhebt.
  rationale: Der Vers berichtet von dem Zeugnis des Mannes und vom Staunen aller. Er setzt Jesu außergewöhnliche Vollmacht voraus, formuliert hier aber keine ausdrückliche lehrhafte Schlussfolgerung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Dekapolis“ bewahrt den historischen Gebietsnamen; Satzbau und Wortwahl bleiben für heutige Leser klar und natürlich.
