  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: de
  text: Und sofort stand das Mädchen auf[a] und ging umher, denn es war zwölf Jahre alt. Und sie gerieten sofort ganz außer sich vor großem Staunen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erhob sich“. Das griechische Verb kann sowohl das gewöhnliche Aufstehen als auch – je nach Zusammenhang – ein Auferstehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Sie gerieten in großes Staunen.“ Im Griechischen stehen ein Verb und ein stammverwandtes Substantiv zusammen und verstärken den Ausdruck.'
    reason: source_idiom
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Das zweimalige „sofort“ bewahrt sowohl Markus’ lebhaftes Erzähltempo als auch die Wiederholung des griechischen Textes.
- source_word: ἀνέστη
  choice: stand … auf
  rationale: ἀνίστημι bezeichnet hier zunächst das körperliche Aufstehen des Mädchens. „Stand auf“ ist natürliches Deutsch und legt die mögliche Auferstehungsnuance nicht stärker fest als der Kontext.
- source_word: κοράσιον
  choice: das Mädchen
  rationale: κοράσιον bezeichnet ein Mädchen; die unmittelbar folgende Altersangabe macht eine zusätzliche Wiedergabe als „junges“ oder „kleines Mädchen“ unnötig.
- source_word: περιεπάτει
  choice: ging umher
  rationale: Der Imperfekt stellt das fortdauernde Gehen nach dem Aufstehen anschaulich dar. „Ging umher“ gibt περιπατέω idiomatisch und sichtbar wieder.
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: denn es war zwölf Jahre alt
  rationale: Die Formulierung gibt die griechische Altersangabe in natürlichem modernem Deutsch wieder; „denn“ bewahrt die erklärende Funktion von γάρ.
- source_word: ἐξέστησαν … ἐκστάσει μεγάλῃ
  choice: gerieten sie völlig außer sich vor Staunen
  rationale: Die idiomatische Wendung vermittelt die starke Erschütterung und bildet die Intensität der griechischen Verbindung aus Verb und stammverwandtem Substantiv ab, ohne das heute missverständliche „Ekstase“ zu verwenden.
theological_decisions:
- issue: Mögliche Auferstehungsnuance von ἀνέστη
  choice: Als körperliches Aufstehen („stand … auf“) wiedergeben
  alternative: „erhob sich“ oder „stand von den Toten auf“
  rationale: Der Zusammenhang beschreibt eindeutig die Wiederherstellung zum Leben, doch das Verb selbst kann schlicht „aufstehen“ bedeuten. Die Übersetzung lässt die Bedeutung aus dem erzählten Geschehen hervorgehen, ohne sie terminologisch zu verstärken.
translation_notes:
  register: 'Modernes, klares und zugleich würdevolles Erzählregister. Die zweimalige Stellung von „sofort“ am Satzanfang wahrt die markinische Wiederholung. Die Pronomen „es“ und „sie“ folgen dem natürlichen deutschen Sprachgebrauch: „es“ bezieht sich auf „das Mädchen“, „sie“ auf die anwesenden Personen.'
