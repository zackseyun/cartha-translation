  text: καὶ ⸀γυνὴ οὖσα ἐν ῥύσει αἵματος ⸂δώδεκα ἔτη⸃
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/025.yaml
  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: de
  text: Und da war eine Frau, die seit zwölf Jahren an Blutungen litt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in einem Blutfluss“; auch: „an einem Blutfluss“ oder „an einer Blutung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den für Markus typischen parataktischen Erzählstil und führt eine weitere Person in die Szene ein.
- source_word: γυνὴ
  choice: eine Frau
  rationale: Das artikellose Substantiv führt eine neue Beteiligte ein; im Deutschen ist der unbestimmte Artikel natürlich.
- source_word: οὖσα
  choice: die … litt
  rationale: Das Partizip bezeichnet zusammen mit der Zustandsangabe und der Zeitdauer ein anhaltendes Leiden; ein Relativsatz ist im modernen Deutsch natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: ἐν ῥύσει αἵματος
  choice: an Blutungen
  rationale: Die Präposition mit Dativ beschreibt hier den Zustand der Frau. „An Blutungen leiden“ gibt die fortdauernde Erkrankung idiomatisch wieder, ohne ihre genaue medizinische Ursache festzulegen.
- source_word: ῥύσει
  choice: Blutungen
  rationale: ῥύσις bezeichnet ein Fließen oder einen Ausfluss. Der Plural „Blutungen“ ist im Deutschen die natürliche Bezeichnung für anhaltendes oder wiederkehrendes Bluten.
- source_word: αἵματος
  choice: Blut-
  rationale: Der Genitiv bestimmt den Ausfluss als Blut; im Deutschen wird dies idiomatisch im Kompositum „Blutungen“ ausgedrückt.
- source_word: δώδεκα ἔτη
  choice: seit zwölf Jahren
  rationale: Der Akkusativ bezeichnet die zeitliche Ausdehnung. Mit dem Präteritum „litt“ drückt „seit zwölf Jahren“ aus, dass der Zustand bis zu diesem Zeitpunkt andauerte.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdiges Erzählregister. „Blutungen“ ist natürlicher als das fachsprachlichere „Hämorrhagie“ und weniger altertümlich als „Blutfluss“; die Fußnote bewahrt die konkrete Ausdrucksweise des griechischen Textes.
