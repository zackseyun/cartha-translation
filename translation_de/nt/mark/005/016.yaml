id: MRK.5.16
reference: Mark 5:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: de
  text: Und die Augenzeugen erzählten ihnen, wie es dem von Dämonen besessenen Mann ergangen war und was mit den Schweinen geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ διηγήσαντο
  choice: Und … erzählten
  rationale: διηγέομαι bezeichnet ein erzählendes Berichten oder Schildern. „erzählten“ ist natürliches modernes Deutsch und gibt den berichtenden Charakter des Verbs wieder; καί wird mit „Und“ erhalten.
- source_word: οἱ ἰδόντες
  choice: die Augenzeugen
  rationale: Das substantivierte Partizip bezeichnet diejenigen, die das Geschehen gesehen hatten. „die Augenzeugen“ drückt dies im Deutschen knapp und eindeutig aus, ohne zusätzliche Personen oder Inhalte einzuführen.
- source_word: πῶς ἐγένετο τῷ δαιμονιζομένῳ
  choice: wie es dem von Dämonen besessenen Mann ergangen war
  rationale: Die Konstruktion γίνομαι mit Dativ kann ausdrücken, was jemandem widerfuhr beziehungsweise wie es ihm erging. Diese Wiedergabe bewahrt πῶς („wie“) und vermeidet ein unnatürliches deutsches „wie es … geschah“.
- source_word: τῷ δαιμονιζομένῳ
  choice: dem von Dämonen besessenen Mann
  rationale: Das substantivierte Partizip bezeichnet den zuvor von unreinen Geistern beherrschten Mann. Der Plural „Dämonen“ entspricht dem Kontext der vielen Geister, während die Form selbst die Zahl nicht ausdrücklich festlegt.
- source_word: καὶ περὶ τῶν χοίρων
  choice: und was mit den Schweinen geschehen war
  rationale: Wörtlich steht „und über die Schweine“. Im Deutschen ergänzt diese Formulierung idiomatisch den Inhalt des Berichts und macht die elliptische Beziehung zu διηγήσαντο verständlich.
theological_decisions:
- issue: Wiedergabe der dämonischen Bedrängnis in τῷ δαιμονιζομένῳ
  choice: dem von Dämonen besessenen Mann
  alternative: dem von einem Dämon besessenen Mann; dem Besessenen
  rationale: Die Erzählung stellt die dämonische Macht als real dar. „besessen“ gibt dies klar wieder; „von Dämonen“ berücksichtigt den unmittelbaren Kontext der Legion, ohne die Person auf die Bezeichnung „der Besessene“ zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Augenzeugen“ ist knapp und allgemein verständlich; „Schweine“ ist gegenüber dem altertümlichen „Säue“ vorzuziehen. Keine Fußnote ist erforderlich, da die im Englischen genannten Alternativen im Deutschen keinen wesentlichen, im Haupttext nicht vermittelten Bedeutungsunterschied erzeugen.
