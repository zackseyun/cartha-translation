  text: καὶ παρεκάλει αὐτὸν πολλὰ ἵνα μὴ ⸀αὐτὰ ἀποστείλῃ ἔξω τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/010.yaml
  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: de
  text: Und er flehte ihn immer wieder an, sie nicht aus der Gegend fortzuschicken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er flehte ihn eindringlich an, sie nicht aus dem Gebiet hinauszuschicken.“'
    reason: Lexikalische Alternativen für πολλὰ und χώρα sowie eine formnähere Wiedergabe von ἔξω.
lexical_decisions:
- source_word: παρεκάλει
  choice: flehte … an
  rationale: Im Zusammenhang der Dämonenaustreibung bezeichnet das Verb eine dringende Bitte. „Anflehen“ gibt diese Intensität in natürlichem, würdigem Deutsch wieder.
- source_word: πολλὰ
  choice: immer wieder
  rationale: Der adverbiale Akkusativ verstärkt die Bitte und kann wiederholtes Bitten ausdrücken. „Immer wieder“ klingt idiomatisch und bewahrt diesen iterativen Zug.
- source_word: ἵνα μὴ
  choice: sie nicht … fortzuschicken
  rationale: Die Infinitivkonstruktion gibt den Inhalt der Bitte im Deutschen natürlich und mit unveränderter Verneinung wieder.
- source_word: αὐτὰ
  choice: sie
  rationale: Das griechische Pronomen steht im Neutrum Plural und verweist auf die unreinen Geister beziehungsweise Dämonen. Das deutsche Personalpronomen bewahrt den Plural.
- source_word: ἀποστείλῃ
  choice: fortzuschicken
  rationale: Das Verb bedeutet hier „weg-/fortschicken“. „Fortschicken“ verbindet sich natürlich mit „aus der Gegend“ und fügt keine im Verb nicht ausdrücklich enthaltene Gewalt hinzu.
- source_word: ἔξω τῆς χώρας
  choice: aus der Gegend
  rationale: χώρα bezeichnet hier das örtliche Gebiet oder die Region, nicht einen modernen Nationalstaat. „Gegend“ ist klar und natürlich.
theological_decisions:
- issue: Numeruswechsel zwischen dem singularischen Sprecher und dem pluralischen Pronomen
  choice: „er flehte ihn … an, sie … fortzuschicken“
  alternative: Den Satz kollektiv glätten und den Numeruswechsel beseitigen
  rationale: Der griechische Text wechselt bewusst zwischen einem einzelnen Sprecher beziehungsweise Wortführer und den vielen Dämonen. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Erzählstil. Der auffällige Wechsel von Singular zu Plural bleibt erhalten.
