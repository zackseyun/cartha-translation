  terminology: „Gegend“ ist eine angemessene alltagssprachliche Wiedergabe von χώρα im Sinn eines örtlichen Gebiets, nicht eines modernen Staates. Die Fußnote bietet mit „Gebiet“ eine sinnvolle lexikalische Alternative. Keine theologisch lenkende Terminologie wird eingeführt.
