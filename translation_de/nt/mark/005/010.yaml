  source_fidelity: 'Die Übersetzung bildet den griechischen Numeruswechsel sorgfältig ab: Der singularische Sprecher („er“) bittet Jesus, die pluralischen Geister („sie“) nicht wegzusenden. „Flehte … an“ gibt παρεκάλει im Kontext zutreffend als dringliche Bitte wieder. „Immer wieder“ ist für πολλὰ als adverbiale Verstärkung mit iterativem Sinn gut vertretbar. „Aus der Gegend fortzuschicken“ gibt ἀποστείλῃ ἔξω τῆς χώρας idiomatisch und ohne unzulässige Zusatzdeutung wieder.'
