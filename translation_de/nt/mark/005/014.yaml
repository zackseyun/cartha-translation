source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: de
  text: Da flohen ihre Hüter und berichteten in der Stadt und auf dem Land[a] davon, und sie kamen, um zu sehen, was geschehen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf den Feldern“. Das griechische Wort bezeichnet wörtlich Felder oder Äcker, kann hier im Gegensatz zur Stadt aber das ländliche Umland meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: die Männer, die sie hüteten
  rationale: Das Partizip bezeichnet die Hüter der Schweineherde. „hüteten“ erfasst ihre Betreuung natürlich; „die Männer“ macht die substantivische Funktion im Deutschen verständlich, ohne den Bezug durch „Schweinehirten“ unnötig zu explizieren.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf die Schweine des vorigen Verses. Die pronominale Form des Griechischen bleibt erhalten, da der Bezug aus dem Kontext hervorgeht.
- source_word: ἔφυγον
  choice: flohen
  rationale: „flohen“ gibt die plötzliche Flucht knapp und mit angemessener erzählerischer Kraft wieder.
- source_word: ἀπήγγειλαν
  choice: berichteten … davon
  rationale: Das Verb bezeichnet das Überbringen einer Nachricht. Die deutsche Verbindung „davon berichten“ ist idiomatisch und lässt den Inhalt aus dem Zusammenhang hervorgehen.
- source_word: εἰς τὴν πόλιν
  choice: in der Stadt
  rationale: Obwohl εἰς grundsätzlich eine Richtung bezeichnen kann, nennt die Wendung beim Verb des Berichtens idiomatisch den Bereich, in dem die Nachricht verbreitet wurde.
- source_word: εἰς τοὺς ἀγρούς
  choice: auf dem Land
  rationale: Im Gegensatz zur Stadt meint der Plural ἀγρούς wahrscheinlich das ländliche Umland. „auf dem Land“ ist im modernen Deutsch natürlicher als das wörtliche „auf den Feldern“.
- source_word: ἦλθον
  choice: darauf kamen die Leute
  rationale: Das griechische Verb hat ein unausgedrücktes plurales Subjekt. „die Leute“ gibt die aus Stadt und Umland Herbeikommenden natürlich wieder; „darauf“ bildet den Fortgang der Erzählung ab.
- source_word: ἰδεῖν
  choice: um zu sehen
  rationale: Der Infinitiv drückt hier den Zweck ihres Kommens aus.
- source_word: τί ἐστιν τὸ γεγονός
  choice: was geschehen war
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den rückblickenden Aspekt des Perfektpartizips γεγονός im Erzählzusammenhang.
