source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: de
  text: 'Und als er hineingeht, sagt er zu ihnen: »Warum macht ihr solchen Lärm und weint? Das Kind ist nicht gestorben, sondern schläft.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Das Kind starb nicht, sondern schläft.« Angesichts der unmittelbar folgenden Auferweckung kann Jesus mit »schläft« bildhaft vom Tod sprechen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: nachdem er hineingegangen ist
  rationale: Das vorangestellte Aoristpartizip bezeichnet hier natürlich die dem Sprechen vorausgehende Handlung; die deutsche Nebensatzkonstruktion gibt diesen Zusammenhang klar wieder.
- source_word: λέγει
  choice: sagt er
  rationale: Das Präsens bewahrt das für Markus typische lebendige historische Präsens.
- source_word: Τί
  choice: Warum
  rationale: In dieser Frage gibt Τί idiomatisch den Grund der beschriebenen Handlungen an.
- source_word: θορυβεῖσθε
  choice: macht ihr solchen Lärm
  rationale: Das Verb bezeichnet eine hörbare Unruhe bzw. einen Aufruhr; die Formulierung ist natürlich und passt zur lauten Trauerszene.
- source_word: κλαίετε
  choice: weint
  rationale: Die schlichte, würdevolle Wiedergabe vermeidet die nicht zwingende Präzisierung auf rituelles Klagen.
- source_word: παιδίον
  choice: das Kind
  rationale: Die allgemeine Bezeichnung des griechischen Textes bleibt erhalten, obwohl aus dem Zusammenhang hervorgeht, dass es sich um ein Mädchen handelt.
- source_word: οὐκ ἀπέθανεν
  choice: ist nicht gestorben
  rationale: Das deutsche Perfekt gibt das vollendete Ereignis mit gegenwärtiger Relevanz wieder, ohne das Verb in die Zustandsaussage ‚ist nicht tot‘ umzudeuten.
- source_word: καθεύδει
  choice: schläft
  rationale: Das Präsens und das Bild des Schlafens werden unmittelbar bewahrt, ohne die Aussage interpretierend aufzulösen.
theological_decisions:
- issue: Ob Jesu Aussage den Tod wörtlich bestreitet oder ‚Schlaf‘ als Bild für den Tod angesichts der bevorstehenden Auferweckung gebraucht
  choice: Die spannungsvolle Formulierung „ist nicht gestorben, sondern schläft“ bleibt im Haupttext unverändert stehen.
  alternative: „Das Kind ist nicht endgültig tot, sondern schläft nur“ oder eine ausdrückliche Deutung als bildhafte Rede vom Tod.
  rationale: Der griechische Wortlaut formuliert den Gegensatz ohne Erklärung. Die Übersetzung bewahrt daher die mögliche metaphorische bzw. vorausblickende Bedeutung, statt sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Das historische Präsens und die knappe, spannungsvolle Aussage Jesu bleiben erhalten.
