  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: de
  text: Die Frau aber, die sich fürchtete und zitterte und wusste, was mit ihr geschehen war, kam, fiel vor ihm nieder[a] und sagte ihm die ganze Wahrheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „warf sich vor ihm nieder“; auch: „fiel ihm zu Füßen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet einen leichten Kontrast beziehungsweise die Weiterentwicklung der Erzählung; „aber“ schließt natürlich an Jesu Frage und die Reaktion der Umstehenden an.
- source_word: ἡ γυνὴ
  choice: die Frau
  rationale: Der bestimmte Ausdruck verweist auf die bereits eingeführte Frau.
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: fürchtete sich und zitterte
  rationale: Die finite Wiedergabe ist im modernen Deutsch natürlich und bewahrt sowohl die Furcht als auch das körperliche Zittern der beiden Partizipien.
- source_word: εἰδυῖα
  choice: Da sie wusste
  rationale: Gibt den begleitenden Umstand natürlich wieder. „Da“ lässt den im Kontext naheliegenden begründenden Zusammenhang erkennen, ohne ihn übermäßig zu verstärken.
- source_word: ὃ γέγονεν αὐτῇ
  choice: was mit ihr geschehen war
  rationale: Idiomatiche deutsche Wiedergabe des Relativsatzes mit Dativ; gemeint ist das von ihr erfahrene Heilungsgeschehen.
- source_word: ἦλθεν
  choice: kam sie
  rationale: Bewahrt die schlichte Bewegungsangabe des narrativen Aorists.
- source_word: προσέπεσεν αὐτῷ
  choice: fiel vor ihm nieder
  rationale: Bezeichnet das Niederfallen vor Jesus und wahrt dessen ehrerbietigen oder flehentlichen Charakter, ohne ausdrücklich Anbetung oder eine genaue Körperhaltung festzulegen.
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: sagte ihm die ganze Wahrheit
  rationale: Natürliches Deutsch, das sowohl den Empfänger als auch die Vollständigkeit ihrer Aussage bewahrt.
theological_decisions:
- issue: Haltung gegenüber Jesus in προσέπεσεν αὐτῷ
  choice: fiel vor ihm nieder
  alternative: warf sich vor ihm nieder / fiel ihm zu Füßen
  rationale: Die Formulierung bewahrt die ehrerbietige oder flehentliche Handlung, ohne eine ausdrückliche Aussage über Anbetung oder die exakte Körperhaltung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die griechische Partizipialkonstruktion wird zur besseren Verständlichkeit in zwei Hauptsätze und einen Nebensatz aufgelöst; die Abfolge und die inhaltlichen Beziehungen bleiben erhalten.
