id: MRK.5.35
reference: Mark 5:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: de
  text: 'Noch während er redete, kamen Leute aus dem Haus des Synagogenvorstehers[a] und sagten: „Deine Tochter ist gestorben. Warum bemühst du den Lehrer noch?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: vom Synagogenvorsteher.'
    reason: Die Ergänzung „Haus“ verdeutlicht den im Kontext naheliegenden, im Griechischen aber nur impliziten Bezug.
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Noch während er redete
  rationale: Der Genitivus absolutus bezeichnet eine gleichzeitig andauernde Handlung; „noch während“ gibt auch die Bedeutung von ἔτι natürlich wieder.
- source_word: ἔρχονται
  choice: kamen
  rationale: Das historische Präsens wird im flüssigen deutschen Erzählstil als Vergangenheit wiedergegeben.
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: aus dem Haus des Synagogenvorstehers
  rationale: Wörtlich steht „vom Synagogenvorsteher“. Im Kontext ist der Vorsteher selbst bei Jesus; die Wendung bezeichnet daher naheliegend sein Haus beziehungsweise seinen Haushalt. Die Ergänzung „Haus“ macht diesen impliziten Bezug verständlich und wird in einer Fußnote offengelegt.
- source_word: λέγοντες ὅτι
  choice: 'und sagten:'
  rationale: Das Partizip leitet direkte Rede ein; die finite Koordination klingt im modernen Deutschen natürlich.
- source_word: Ἡ θυγάτηρ σου ἀπέθανεν
  choice: Deine Tochter ist gestorben
  rationale: Das Perfekt ist im Deutschen die natürliche Form für ein abgeschlossenes Ereignis mit unmittelbarer Gegenwartsrelevanz.
- source_word: τί ἔτι σκύλλεις
  choice: Warum bemühst du … noch?
  rationale: σκύλλω bedeutet hier, jemanden weiter in Anspruch zu nehmen oder ihm Mühe zu machen. „bemühen“ ist knapp, verständlich und weniger abwertend als „belästigen“.
- source_word: τὸν διδάσκαλον
  choice: den Lehrer
  rationale: Die Sachbezeichnung wird ohne Erweiterung zum Namen Jesu wiedergegeben und bewahrt damit die Perspektive der Sprecher.
theological_decisions:
- issue: Bezeichnung Jesu als διδάσκαλος
  choice: den Lehrer
  alternative: Jesus; den Meister
  rationale: Der griechische Text verwendet einen Titel, nicht den Namen. „Lehrer“ wahrt den unmittelbaren Wortsinn und trägt keine zusätzliche christologische oder herrschaftliche Deutung ein.
- issue: Herkunft der Boten
  choice: aus dem Haus des Synagogenvorstehers
  alternative: vom Synagogenvorsteher
  rationale: Die kontextuell implizierte Herkunft aus seinem Haus beziehungsweise Haushalt wird im Haupttext verständlich ausgedrückt; die formal mögliche wörtliche Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Moderner, würdiger Erzählstil. „Synagogenvorsteher“ ist präzise und im biblisch-historischen Kontext verständlich; „bemühen“ wahrt den ernsten Ton, ohne die stärkere negative Färbung von „belästigen“ einzutragen.
