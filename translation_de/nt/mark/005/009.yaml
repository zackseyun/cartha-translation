source:
  edition: SBLGNT
  text: καὶ ἐπηρώτα αὐτόν· Τί ⸂ὄνομά σοι⸃; καὶ ⸂λέγει αὐτῷ⸃· ⸀Λεγιὼν ὄνομά μοι, ὅτι πολλοί ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: de
  text: 'Und er fragte ihn: „Wie heißt du?“ Er sagt zu ihm: „Ich heiße Legion,[a] denn wir sind viele.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Legion“ ist ein lateinischer militärischer Begriff, der ins Griechische übernommen wurde und eine große römische Truppeneinheit bezeichnet. Hier dient er als angegebener Name und deutet zugleich auf eine Vielzahl hin.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: fragte
  rationale: Das Imperfekt bezeichnet die laufende Handlung im Erzählverlauf. Im natürlichen deutschen Erzählstil gibt das Präteritum „fragte“ dies angemessen wieder; „fragte immer wieder“ würde eine Wiederholung stärker festlegen, als der Kontext verlangt.
- source_word: Τί ὄνομά σοι
  choice: Wie heißt du?
  rationale: Natürliche moderne deutsche Wiedergabe der griechischen idiomatischen Wendung mit ὄνομα und Dativ.
- source_word: λέγει αὐτῷ
  choice: Er sagt zu ihm
  rationale: Das Präsens wird als historisches Präsens beibehalten und bewahrt so den lebendigen Erzählstil des Markus.
- source_word: Λεγιών
  choice: Legion
  rationale: Das aus dem Lateinischen übernommene Wort fungiert hier als Name beziehungsweise Selbstbezeichnung und wird deshalb nicht aufgelöst.
- source_word: ὄνομά μοι
  choice: Ich heiße
  rationale: Dies ist die natürliche deutsche Entsprechung der griechischen nominalen Namensformel und bewahrt die Selbstidentifikation im Singular.
- source_word: ὅτι πολλοί ἐσμεν
  choice: denn wir sind viele
  rationale: ὅτι begründet hier den Namen. „Denn“ klingt in direkter Rede natürlich und bewahrt ausdrücklich den bedeutungsvollen Wechsel zum Plural.
theological_decisions:
- issue: Wechsel von singularischer zu pluralischer Selbstbezeichnung
  choice: „Ich heiße Legion … denn wir sind viele“
  alternative: „Wir heißen Legion“ oder eine andere Glättung des Numeruswechsels
  rationale: Der griechische Text verbindet die Selbstbezeichnung im Singular mit der Erklärung im Plural. Diese Spannung wird bewahrt und nicht harmonisiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählton. Das historische Präsens in „Er sagt“ sowie der Wechsel von „ich“ zu „wir“ bleiben erhalten.
