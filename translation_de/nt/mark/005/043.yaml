id: MRK.5.43
reference: Mark 5:43
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ διεστείλατο αὐτοῖς πολλὰ ἵνα μηδεὶς γνοῖ τοῦτο, καὶ εἶπεν δοθῆναι αὐτῇ φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: de
  text: Und er schärfte ihnen nachdrücklich ein, niemand solle davon erfahren,[a] und sagte, man solle ihr etwas zu essen geben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »niemand solle dies erfahren«. Die griechische Wendung für die Anweisung enthält außerdem ein verstärkendes Wort, wörtlich »viel«; möglich ist daher auch: »Er gab ihnen sehr strenge Anweisungen« oder »Er schärfte es ihnen wiederholt ein«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »ihr zu essen gegeben werden solle«; gemeint ist, dass man ihr etwas zu essen geben soll.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: er schärfte ihnen nachdrücklich ein
  rationale: Das mediale διαστέλλομαι bezeichnet hier eine strenge Anweisung; πολλά verstärkt sie. Die deutsche Wendung gibt die Intensität natürlich wieder, ohne eine Wiederholung der Anweisung zu behaupten.
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: niemand solle davon erfahren
  rationale: ἵνα mit dem Aorist Konjunktiv bezeichnet den beabsichtigten Inhalt beziehungsweise Zweck der Anweisung. »Davon erfahren« gibt das kontextuelle Bekanntwerden des Geschehens idiomatisch wieder.
- source_word: εἶπεν
  choice: sagte
  rationale: Die schlichte Wiedergabe bewahrt das gewöhnliche Verb λέγω und vermeidet, eine stärkere Befehlsnuance ausdrücklich in das Verb hineinzulesen.
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: man solle ihr etwas zu essen geben
  rationale: Die unpersönliche deutsche Konstruktion bildet den passiven Infinitiv sinngemäß ab. »Etwas« ergänzt das im Griechischen nicht ausgesprochene, im Deutschen aber idiomatisch erforderliche Objekt zu »essen«.
theological_decisions:
- issue: Umfang und Bedeutung des Schweigegebots
  choice: Die starke Anweisung wird ohne theologische Erklärung wiedergegeben.
  alternative: Die Aussage ausdrücklich als Teil des markinischen Messiasgeheimnisses deuten oder auf einen näher bestimmten Personenkreis begrenzen.
  rationale: Der Vers sagt lediglich, dass niemand davon erfahren solle. Eine weitergehende Deutung oder Einschränkung wäre eine nicht ausdrücklich im Satz enthaltene Erklärung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Nachdrücklich einschärfen« vermittelt die Stärke der Anweisung ohne archaische Formulierungen; der Konjunktiv I kennzeichnet die abhängigen Aufforderungen klar.
