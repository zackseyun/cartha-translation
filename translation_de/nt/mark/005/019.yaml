  terminology: „Der Herr“ ist die angemessene Standardwiedergabe von ὁ κύριος und lässt den im Kontext möglichen Bezug auf Gott sowie die erzählerische Verbindung zu Jesu Handeln offen. Die Fußnote zu „den Deinen“ erläutert die Ellipse angemessen, ohne den Ausdruck auf Familie zu verengen.
