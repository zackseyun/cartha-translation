source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: de
  text: 'Er aber erlaubte es ihm nicht, sondern sagte zu ihm: „Geh nach Hause zu den Deinen[a] und berichte ihnen, was der Herr[b] alles für dich getan und wie er sich deiner erbarmt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zu deinen [Leuten]“; gemeint sein können die Familie und weitere nahestehende Menschen.'
    reason: lexical_alternative
  - marker: b
    text: „Der Herr“ kann hier auf Gott bezogen werden; zugleich stellt der Zusammenhang eine Verbindung zwischen dem Erbarmen des Herrn und Jesu eigenem Handeln her.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἀφῆκεν αὐτόν
  choice: er erlaubte es ihm nicht
  rationale: ἀφίημι bedeutet hier, etwas zu gestatten. Das unpersönliche „es“ nimmt im Deutschen natürlich die zuvor geäußerte Bitte auf.
- source_word: λέγει αὐτῷ
  choice: sagte zu ihm
  rationale: Der historische Präsensgebrauch des Griechischen wird dem üblichen deutschen Erzählstil entsprechend im Präteritum wiedergegeben.
- source_word: Ὕπαγε εἰς τὸν οἶκόν σου
  choice: Geh nach Hause
  rationale: οἶκος bezeichnet hier den häuslichen und sozialen Lebensbereich; „nach Hause“ ist idiomatisch und bewahrt die Zielrichtung des Imperativs.
- source_word: πρὸς τοὺς σούς
  choice: zu den Deinen
  rationale: Die substantivierte Wendung meint wörtlich „zu deinen [Leuten]“. „Zu den Deinen“ erhält ihre absichtliche Weite und verengt sie nicht auf die Kernfamilie.
- source_word: ἀπάγγειλον αὐτοῖς
  choice: berichte ihnen
  rationale: ἀπαγγέλλω bezeichnet das Überbringen beziehungsweise Berichten einer Nachricht; „berichte“ passt zum Auftrag, Rechenschaft über das Geschehene zu geben.
- source_word: ὅσα ὁ κύριός σοι πεποίηκεν
  choice: was der Herr alles für dich getan
  rationale: ὅσα bezeichnet hier den ganzen Umfang dessen, was geschehen ist. „Was … alles“ ist natürliches Deutsch; σοι wird als Dativ des Begünstigten mit „für dich“ wiedergegeben.
- source_word: ἠλέησέν σε
  choice: wie er sich deiner erbarmt hat
  rationale: ἐλεάω bezeichnet tätiges Erbarmen. Die Formulierung bewahrt das biblisch-theologische Gewicht des Begriffs und ist zugleich verständlich.
theological_decisions:
- issue: Bezug von κύριος in Jesu Aussage über das vollbrachte Werk
  choice: der Herr
  alternative: Gott
  rationale: „Der Herr“ gibt κύριος unmittelbar wieder und lässt offen, wie der Leser die Tat Gottes und Jesu eigene heilende Vollmacht aufeinander bezieht. Die Übersetzung löst diese theologische Spannung nicht durch die Einsetzung von „Gott“ auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Zu den Deinen“ ist etwas gehobener, aber geläufig und erhält die Offenheit des griechischen Ausdrucks. Die Satzstruktur bleibt nah am griechischen Text, ohne unnatürlich zu wirken.
