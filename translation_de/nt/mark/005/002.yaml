  terminology: »unreiner Geist« ist quellennahe, etablierte und theologisch nicht überdeutende Terminologie. Die Fußnote soll die wörtliche Präposition ἐν genauer als »in« ausweisen, während der Haupttext mit »mit« natürlich bleibt.
