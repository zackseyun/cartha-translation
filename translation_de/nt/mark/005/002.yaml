source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: de
  text: Und als er aus dem Boot stieg, kam ihm sofort aus den Gräbern ein Mann mit einem unreinen Geist entgegen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der von einem unreinen Geist besessen war“. Wörtlicher: „in einem unreinen Geist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: als er aus dem Boot stieg
  rationale: Der Genitivus absolutus mit Aoristpartizip wird natürlich als temporaler Nebensatz wiedergegeben. „Aus dem Boot steigen“ ist im Deutschen die idiomatische Formulierung.
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt den für Markus typischen unmittelbaren und lebhaften Erzählfortgang in natürlichem modernem Deutsch.
- source_word: ὑπήντησεν αὐτῷ
  choice: kam ihm … entgegen
  rationale: Gibt die zielgerichtete Begegnung idiomatisch wieder und lässt sich natürlich mit der Herkunftsangabe verbinden.
- source_word: ἐκ τῶν μνημείων
  choice: aus den Grabhöhlen
  rationale: Im Kontext bezeichnet μνημεῖον die als Grab dienenden Anlagen; „Grabhöhlen“ vermittelt anschaulich, dass der Mann aus ihrem Bereich herauskam.
- source_word: ἄνθρωπος
  choice: ein Mann
  rationale: Das maskuline Singularwort bezeichnet im Kontext eine konkrete männliche Person.
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: mit einem unreinen Geist
  rationale: Die Wiedergabe bleibt eng bei der griechischen Konstruktion und vermeidet, mit „besessen“ den beschriebenen Zustand stärker auszudeuten.
theological_decisions:
- issue: Wiedergabe der dämonischen Bedrängnis
  choice: mit einem unreinen Geist
  alternative: von einem unreinen Geist besessen
  rationale: Das Griechische lautet wörtlich „in/mit einem unreinen Geist“. Die gewählte Form bewahrt diese Ausdrucksweise und legt den genauen Charakter der Beziehung nicht stärker fest, als es der Vers selbst tut.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. Die Wortstellung erhält den lebhaften Erzählfluss; „unreiner Geist“ bewahrt die traditionelle und quellennah formulierte Bezeichnung.
