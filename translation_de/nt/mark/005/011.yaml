  source_fidelity: „Dort am Berg weidete eine große Schweineherde“ gibt ἐκεῖ, πρὸς τῷ ὄρει, ἀγέλη χοίρων μεγάλη und das partizipiale βοσκομένη sachgerecht wieder. Die idiomatische deutsche Verbkonstruktion darf die griechische Existenzkonstruktion ἦν … βοσκομένη zusammenziehen; ein eigenständiges deutsches „es war“ wäre hier unnötig schwerfällig. Das schwache δέ verlangt keinen ausdrücklichen Konnektor.
  naturalness: Der Satz ist klares, modernes Standarddeutsch und hat einen passenden erzählerischen Ton. „Am Berg“ ist im Deutschen eine natürliche Ortsangabe und kann, wie πρός mit Dativ, Nähe bzw. Lage beim Berg bezeichnen.
  terminology: „Schweineherde“ ist die angemessene moderne Bezeichnung für ἀγέλη χοίρων; „große“ und „weidete“ sind kontextgemäß. Die Fußnote bietet mit „nahe beim Berg“ eine sinnvolle räumliche Präzisierung, ohne eine strittige Engführung zu erzwingen.
