  text: ἦν δὲ ἐκεῖ πρὸς τῷ ὄρει ἀγέλη χοίρων μεγάλη βοσκομένη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/011.yaml
  text: There was there near the mountain a large herd of pigs feeding[a][b].
translation:
  language: de
  text: Dort am Berg weidete eine große Schweineherde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nahe beim Berg«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: Dort … weidete
  rationale: Die deutsche Satzkonstruktion gibt die Ortsangabe ἐκεῖ natürlich wieder; das existentielle ἦν wird zusammen mit dem prädikativen Partizip als fortlaufende Handlung ausgedrückt. Das schwache δέ erfordert hier keinen eigenen deutschen Konnektor.
- source_word: πρὸς τῷ ὄρει
  choice: am Berg
  rationale: πρός mit Dativ bezeichnet hier eine Lage nahe bei oder an etwas. „Am Berg“ ist idiomatisch und lässt die genaue räumliche Beziehung angemessen offen.
- source_word: ἀγέλη χοίρων μεγάλη
  choice: eine große Schweineherde
  rationale: Das Genitivattribut χοίρων wird im Deutschen natürlich durch das Kompositum „Schweineherde“ wiedergegeben; μεγάλη bezeichnet die Größe beziehungsweise Zahl der Herde.
- source_word: βοσκομένη
  choice: weidete
  rationale: Das präsentische Medium/Passiv-Partizip beschreibt die Herde beim Fressen auf der Weide. „weidete“ ist im Kontext einer Herde natürlich; die ebenfalls mögliche passive Lesart „wurde gehütet“ ist weniger wahrscheinlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung vermeidet das im Deutschen schwerfällige existentielle „Es war dort …“ und bewahrt den erzählerischen Charakter. „Schweine“ ist die geläufige heutige Bezeichnung; eine zusätzliche Fußnote mit „Säue“ wäre keine sachlich hilfreiche Alternative.
