  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἦλθον εἰς τὸ πέραν τῆς θαλάσσης εἰς τὴν χώραν τῶν ⸀Γερασηνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/001.yaml
  text: And they came to the other side of the sea[a], to the region of the Gerasenes.
translation:
  language: de
  text: Und sie kamen auf die andere Seite des Sees, in das Gebiet der Gerasener.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen „Gadarener“, andere „Gergesener“.
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den für Markus typischen parataktischen Erzählfluss, ohne ihn durch „Dann“ zu glätten.
- source_word: ἦλθον
  choice: sie kamen
  rationale: Gibt den Aorist Indikativ Plural schlicht wieder; der Plural umfasst Jesus und seine Begleiter aus dem vorhergehenden Zusammenhang.
- source_word: εἰς τὸ πέραν τῆς θαλάσσης
  choice: auf die andere Seite des Sees
  rationale: Gibt die Zielrichtung der Wendung natürlich wieder. Obwohl θάλασσα wörtlich „Meer“ bedeutet, ist im Deutschen für den See Gennesaret die Bezeichnung „See“ idiomatisch und geografisch klar.
- source_word: εἰς τὴν χώραν
  choice: in das Gebiet
  rationale: χώρα bezeichnet hier ein Gebiet oder eine Landschaft, nicht ein Land im modernen staatlichen Sinn.
- source_word: Γερασηνῶν
  choice: der Gerasener
  rationale: Gibt die von Gerasa abgeleitete Einwohnerbezeichnung der SBLGNT-Lesart in geläufiger deutscher Form wieder.
theological_decisions:
- issue: Textliche und geografische Variante des Ortsnamens
  choice: Gerasener
  alternative: Gadarener; Gergesener
  rationale: Der Haupttext folgt der SBLGNT-Lesart Γερασηνῶν. Die bedeutenden abweichenden Handschriftenlesarten werden wegen der alten textlichen und geografischen Diskussion in einer Fußnote bewahrt, ohne die Spannung aufzulösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Erzählton. Die Satzverknüpfung mit „Und“ wahrt den markinischen Stil; „See“ vermeidet im heutigen Deutschen ein geografisches Missverständnis.
