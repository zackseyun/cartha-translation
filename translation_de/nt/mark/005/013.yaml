id: MRK.5.13
reference: Mark 5:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: de
  text: Und er erlaubte es ihnen. Da kamen die unreinen Geister heraus und gingen in die Schweine hinein. Die Herde – etwa zweitausend Tiere – raste den Steilhang[a] hinab ins Meer[b], und die Schweine ertranken im Meer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „den steilen Abhang“ beziehungsweise „die Klippe“; das griechische Wort kann einen steilen Hang oder einen jähen Abgrund bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Meer“; gemeint ist der See Genezareth.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: er erlaubte es ihnen
  rationale: ἐπιτρέπω bedeutet „erlauben, gestatten“. Das ergänzte „es“ ist im Deutschen idiomatisch; „ihnen“ verweist im unmittelbaren Zusammenhang auf die unreinen Geister.
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: die unreinen Geister
  rationale: Die Formulierung bewahrt die personale geistliche Sprache des griechischen Textes sowie die religiösen und moralischen Bedeutungsanteile von ἀκάθαρτος.
- source_word: ἐξελθόντα ... εἰσῆλθον εἰς τοὺς χοίρους
  choice: kamen ... heraus und gingen in die Schweine hinein
  rationale: Die Wiedergabe bildet die Abfolge des Partizips und des finiten Verbs natürlich ab und bezeichnet klar das Verlassen des Menschen und das Eingehen in die Schweine.
- source_word: χοίρους
  choice: Schweine
  rationale: „Schweine“ ist die klare, gegenwärtige Standardbezeichnung für χοῖροι.
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: die Herde ... raste
  rationale: ὁρμάω bezeichnet eine plötzliche, heftige Bewegung. „Raste“ ist im Deutschen natürlich und fügt anders als „stürzte sich“ keine Absicht hinzu.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: den Steilhang hinab
  rationale: κρημνός kann einen steilen Abhang oder eine Felskante bezeichnen. „Steilhang“ vermittelt die Gefährlichkeit, ohne zwingend eine senkrechte Klippe vorauszusetzen.
- source_word: ὡς δισχίλιοι
  choice: etwa zweitausend Tiere
  rationale: ὡς kennzeichnet die Zahl als ungefähr. „Tiere“ macht im Deutschen deutlich, dass die Anzahl die Schweine der Herde bezeichnet.
- source_word: εἰς τὴν θάλασσαν
  choice: ins Meer
  rationale: Die Wiedergabe folgt dem griechischen θάλασσα („Meer“), obwohl das bezeichnete Gewässer geografisch ein See ist.
- source_word: ἐπνίγοντο
  choice: ertranken
  rationale: Das Imperfekt beschreibt das Geschehen in seinem Verlauf; im deutschen Erzählstil gibt „ertranken“ den tödlichen Ausgang natürlich und ohne eine zusätzliche äußere Verursachung wieder.
theological_decisions:
- issue: Bezugswort von αὐτοῖς („ihnen“)
  choice: Die unreinen Geister
  alternative: Ein unbestimmter oder anderer Bezug
  rationale: Der unmittelbare Kontext identifiziert die Geister als diejenigen, denen Jesus die erbetene Erlaubnis erteilt; dies wird nicht durch eine erklärende Ergänzung im Vers ausgebaut.
- issue: Personale oder unpersönliche Wiedergabe der unreinen Geister
  choice: „unreine Geister“ als personale geistliche Wesen der Erzählung
  alternative: „böse Kräfte“ als unpersönliche Mächte
  rationale: πνεύματα und ihre im Kontext geschilderte Bitte werden durch personale Sprache dargestellt. Die Übersetzung wahrt diese Darstellung, ohne darüber hinausgehende Dämonologie einzutragen.
- issue: Aktivische oder passivische Deutung von ἐπνίγοντο
  choice: „ertranken“
  alternative: „wurden ertränkt“
  rationale: Die Form kann formal medial/passiv sein, bezeichnet hier aber idiomatisch das Ertrinken. Die intransitive deutsche Form vermeidet die unbegründete Festlegung auf einen äußeren Täter.
translation_notes:
  register: Moderner, würdiger Erzählstil mit gut verständlicher Syntax. „Raste“ vermittelt die jähe Bewegung ohne unnötig altertümliche Sprache; die Wiederholung von „im Meer“ bleibt entsprechend dem griechischen Text erhalten.
