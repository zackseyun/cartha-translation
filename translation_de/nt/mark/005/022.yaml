review_pass:
  verdict: revise
  source_fidelity: Die partitive Wendung „einer der Synagogenvorsteher“, die Namensangabe, die temporale Wiedergabe von ἰδὼν αὐτόν und die körperlich nicht weiter ausgedeutete Geste „fällt ihm zu Füßen“ geben den griechischen Text sachgerecht wieder. Das historische Präsens wird angemessen beibehalten. Das einleitende καί sollte jedoch regulär als „Und“ wiedergegeben werden; „Da“ fügt eine stärker folgernde bzw. szenisch-deiktische Nuance hinzu.
  naturalness: Die Satzfolge ist modernes, gut verständliches Standarddeutsch. „Und einer der Synagogenvorsteher namens Jairus kommt“ ist flüssig und hält die Subjektgruppe zusammen. Die Zweiteilung bleibt idiomatisch und wahrt den narrativen Zusammenhang.
  terminology: „Synagogenvorsteher“ ist eine etablierte und präzise Wiedergabe von ἀρχισυνάγωγος. Für den Eigennamen ist im modernen deutschen Bibelgebrauch „Jairus“ die übliche Schreibung; ein Trema ist weder zur Verständlichkeit erforderlich noch hier die bevorzugte Standardform. Die Übersetzung deutet das Niederfallen nicht als ausdrückliche Anbetung aus.
  issues:
  - severity: low
    issue: Einleitendes „Da“ statt „Und“
    rationale: καί ist hier eine einfache narrative Verbindung. „Da“ ist mögliches Erzählidiom, kann aber einen stärker demonstrativen oder folgernden Akzent setzen. „Und“ ist näher am Ausgangstext und im Deutschen natürlich.
  - severity: low
    issue: Namensschreibung „Jaïrus“
    rationale: Die Schreibung mit Trema ist eine mögliche philologische Umschrift, aber „Jairus“ ist die im heutigen deutschen Bibelgebrauch übliche Namensform und daher für modernes Standarddeutsch vorzuziehen.
  revised_text: Und einer der Synagogenvorsteher namens Jairus kommt. Als er ihn sieht, fällt er ihm zu Füßen.
  revised_footnotes: []
