  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: de
  text: Und einer der Synagogenvorsteher namens Jairus kommt. Als er ihn sieht, fällt er ihm zu Füßen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: kommt
  rationale: Das historische Präsens wird beibehalten, weil es auch im Deutschen eine natürliche, anschauliche Erzählweise ermöglicht.
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: einer der Synagogenvorsteher
  rationale: Die partitive Konstruktion wird genau wiedergegeben. „Synagogenvorsteher“ bezeichnet einen für Leitung und Organisation der Synagoge verantwortlichen Amtsträger.
- source_word: ὀνόματι Ἰάϊρος
  choice: namens Jaïrus
  rationale: Die knappe deutsche Namensformel gibt den idiomatischen Dativ ὀνόματι natürlich wieder; die Schreibung „Jaïrus“ macht die getrennte Aussprache der Vokale kenntlich.
- source_word: ἰδὼν αὐτὸν
  choice: Als er ihn sieht
  rationale: Das Aoristpartizip wird als temporaler Nebensatz wiedergegeben. Das Pronomen bleibt erhalten, statt den Namen Jesus erläuternd einzusetzen.
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: fällt er ihm zu Füßen
  rationale: Die deutsche Wendung entspricht der körperlichen Bewegung und bewahrt zugleich deren möglichen Sinn als Ausdruck von Ehrfurcht, Not oder flehentlicher Bitte. Auch hier bleibt das historische Präsens erhalten.
theological_decisions:
- issue: Bedeutung des Niederfallens vor Jesus
  choice: fällt er ihm zu Füßen
  alternative: wirft er sich anbetend vor ihm nieder
  rationale: Der griechische Text beschreibt die Handlung, verwendet aber keinen ausdrücklichen Begriff für Anbetung. Die Übersetzung legt daher nicht fest, ob Ehrfurcht, Verzweiflung, Bitte oder Anbetung im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens des Markus wird zur Wahrung der erzählerischen Unmittelbarkeit beibehalten. Die Aufteilung in zwei Sätze vermeidet eine schwerfällige Reihung, ohne den inhaltlichen Zusammenhang zu verändern.
