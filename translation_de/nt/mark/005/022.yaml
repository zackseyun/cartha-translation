revisions:
- from: Da kommt einer der Synagogenvorsteher namens Jaïrus. Als er ihn sieht, fällt er ihm zu Füßen.
  to: Und einer der Synagogenvorsteher namens Jairus kommt. Als er ihn sieht, fällt er ihm zu Füßen.
  rationale: Die Revision ersetzt nur die leicht interpretierende Satzanbindung „Da“ durch das textnähere „Und“ und normalisiert die Namensschreibung zu „Jairus“. Historisches Präsens, partitive Amtsbezeichnung, pronominale Bezugnahme und die theologisch offene Beschreibung der Geste bleiben erhalten.
  reviewer_model: gpt-5.6-terra
