source:
  edition: SBLGNT
  text: καὶ ἔλεγον αὐτῷ οἱ μαθηταὶ αὐτοῦ· Βλέπεις τὸν ὄχλον συνθλίβοντά σε, καὶ λέγεις· Τίς μου ἥψατο;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/031.yaml
  text: And his disciples were saying to him[a], “You see the crowd pressing in on you, and you say, ‘Who touched me?’”
translation:
  language: de
  text: 'Da sagten seine Jünger zu ihm: »Du siehst doch, wie die Menschenmenge sich um dich drängt, und fragst: ›Wer hat mich berührt?‹«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: da sagten
  rationale: Das Imperfekt beschreibt die einsetzende bzw. im Gang befindliche Reaktion der Jünger. Im natürlichen deutschen Erzählstil gibt »da sagten« den Zusammenhang angemessen wieder, ohne eine ungesicherte Wiederholung zu behaupten.
- source_word: μαθηταὶ
  choice: Jünger
  rationale: »Jünger« ist die etablierte, verständliche Bezeichnung für Jesu μαθηταί und bewahrt sowohl die Lern- als auch die Nachfolgebeziehung.
- source_word: Βλέπεις
  choice: Du siehst doch
  rationale: Das Präsens wird als direkte Feststellung wiedergegeben; »doch« bringt den im Kontext erkennbaren Einwand der Jünger natürlich zum Ausdruck, ohne den Aussagegehalt zu verändern.
- source_word: ὄχλον
  choice: die Menschenmenge
  rationale: »Menschenmenge« ist modern und eindeutig und bezeichnet die um Jesus versammelte Menge ohne altertümlichen Klang.
- source_word: συνθλίβοντά
  choice: wie die Menschenmenge sich um dich drängt
  rationale: Das Verb bezeichnet starken körperlichen Druck von mehreren Seiten. »Sich um dich drängen« vermittelt die räumliche Enge natürlich, ohne mit »zerquetschen« die Wirkung zu überzeichnen.
- source_word: λέγεις
  choice: fragst
  rationale: Obwohl λέγεις wörtlich »sagst« bedeutet, folgt eine direkte Frage. Das deutsche »fragst« gibt die kommunikative Funktion idiomatisch und präzise wieder.
- source_word: Τίς μου ἥψατο
  choice: Wer hat mich berührt?
  rationale: ἅπτομαι mit Genitiv bezeichnet hier die konkrete, bereits erfolgte Berührung. Das deutsche Perfekt ist in direkter Rede natürlich und bewahrt den Bezug auf dieses einzelne Ereignis.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil mit natürlicher deutscher direkter Rede. Die Verwunderung der Jünger wird durch »doch« und die Satzstellung hörbar gemacht. Keine Fußnote nötig, da »sich um dich drängt« den körperlichen Druck des griechischen συνθλίβω im Kontext ausreichend abbildet.
