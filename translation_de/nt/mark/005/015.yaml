  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: de
  text: Sie kamen zu Jesus und sahen den Mann, der von Dämonen besessen gewesen war, dasitzen, bekleidet und bei klarem Verstand – den, der von der Legion[a] besessen gewesen war. Und sie fürchteten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Legion“. Der Ausdruck greift die vorausgehende Selbstbezeichnung der Dämonen auf und kann daher als Name verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kamen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: θεωροῦσιν
  choice: sie sahen
  rationale: Das Verb bezeichnet hier das wahrnehmende Betrachten der sichtbaren Szene; „sahen“ ist natürlich und hinreichend genau.
- source_word: τὸν δαιμονιζόμενον
  choice: den Mann, der von Dämonen besessen gewesen war
  rationale: Die substantivierte Form bezeichnet den bekannten Betroffenen. Das Plusquamperfekt macht im Kontext deutlich, dass dieser Zustand nun beendet ist, ohne die reale dämonische Besessenheit abzuschwächen.
- source_word: καθήμενον
  choice: dasitzen
  rationale: Die Form beschreibt anschaulich seine sichtbare, nun ruhige Haltung.
- source_word: ἱματισμένον
  choice: bekleidet
  rationale: Die Wiedergabe bewahrt knapp den Gegensatz zu seinem früheren Zustand.
- source_word: σωφρονοῦντα
  choice: bei klarem Verstand
  rationale: Die Wendung gibt wiedergewonnene geistige Klarheit und Selbstbeherrschung in natürlichem modernem Deutsch wieder.
- source_word: τὸν ἐσχηκότα τὸν λεγιῶνα
  choice: den, der die Legion gehabt hatte
  rationale: Das griechische Perfekt identifiziert ihn rückblickend über seinen früheren, für die gegenwärtige Szene noch relevanten Zustand. Das deutsche Plusquamperfekt markiert klar, dass er die Legion nicht mehr hat.
- source_word: ἐφοβήθησαν
  choice: Da bekamen sie Angst
  rationale: Die Form kann ingressiv verstanden werden; die deutsche Wendung stellt ihre einsetzende Reaktion idiomatisch dar.
theological_decisions:
- issue: Beschreibung der dämonischen Besessenheit
  choice: von Dämonen besessen gewesen war
  alternative: der Besessene
  rationale: Die Übersetzung wahrt die übernatürliche Aussage des Textes und zeigt zugleich, dass die Besessenheit bei der Begegnung beendet war.
- issue: λεγιών als Bezeichnung oder Eigenname
  choice: die Legion
  alternative: Legion
  rationale: Der Artikel und der Rückbezug erlauben eine appellativische Wiedergabe; zugleich kann der Ausdruck aufgrund der vorausgehenden Selbstbezeichnung als Name verstanden werden. Diese echte Offenheit wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die historischen Präsensformen werden erzählerisch im Präteritum wiedergegeben. „Bei klarem Verstand“ ist verständlich und vermeidet sowohl archaische als auch unnötig klinische Sprache.
