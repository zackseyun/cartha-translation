revisions:
- from: Sie kamen zu Jesus und sahen den Mann, der von Dämonen besessen gewesen war, dasitzen, bekleidet und bei klarem Verstand – den, der die Legion[a] gehabt hatte. Da bekamen sie Angst.
  to: Sie kamen zu Jesus und sahen den Mann, der von Dämonen besessen gewesen war, dasitzen, bekleidet und bei klarem Verstand – den, der von der Legion[a] besessen gewesen war. Und sie fürchteten sich.
  rationale: Die Revision ersetzt die im Deutschen missverständliche Wendung „die Legion gehabt hatte“ durch eine eindeutige Bezeichnung der früheren Besessenheit. Damit wird der Rückbezug auf die „Legion“ bewahrt, ohne Besitz als Sinn nahezulegen. Die Satzfolge und die wiederhergestellte Verhaltensbeschreibung bleiben eng am griechischen Text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:39:42Z'
review_pass:
  verdict: revise
  source_fidelity: Die Satzglieder und die erzählerische Vergangenheitswiedergabe entsprechen dem Griechischen im Wesentlichen. Das Perfekt ἐσχηκότα kennzeichnet den Mann rückblickend als denjenigen, der „die Legion“ gehabt hatte. Im Deutschen ist „die Legion gehabt hatte“ jedoch missverständlich und kann Besitz statt Besessenheit nahelegen.
  naturalness: „Da bekamen sie Angst“ ist idiomatisch, aber „sie fürchteten sich“ bildet die knappe abschließende Reaktion des griechischen Satzes etwas unmittelbarer ab. Die doppelte Kennzeichnung des Mannes bleibt als Apposition verständlich, sollte aber die Bedeutung von „Legion“ klar ausdrücken.
  terminology: „von Dämonen besessen“ und „bei klarem Verstand“ sind moderne, sachgerechte Wiedergaben. „Legion“ bleibt als bewusst nicht erzwungene Namensschreibung mit Fußnote erhalten.
  issues:
  - severity: medium
    issue: „der die Legion gehabt hatte“ ist im Deutschen semantisch missverständlich.
    rationale: Die Formulierung kann bedeuten, dass der Mann über eine Legion verfügte oder sie besaß. Im Kontext und bei τὸν ἐσχηκότα τὸν λεγιῶνα geht es um seine frühere dämonische Besessenheit. Die Übersetzung sollte dies ohne unnötige Auslegung klar markieren.
  revised_text: Sie kamen zu Jesus und sahen den Mann, der von Dämonen besessen gewesen war, dasitzen, bekleidet und bei klarem Verstand – den, der von der Legion[a] besessen gewesen war. Und sie fürchteten sich.
  revised_footnotes:
