  edition: SBLGNT
  text: καὶ περιεβλέπετο ἰδεῖν τὴν τοῦτο ποιήσασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/032.yaml
  text: And he kept looking around to see the one who had done this[a].
translation:
  language: de
  text: Und er blickte sich weiter um, um die zu sehen, die das getan hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Form von „die … getan hatte“ ist feminin und bezeichnet somit eine Frau.
    reason: Das grammatische Geschlecht des substantivierten Partizips trägt eine Information, die für Leserinnen und Leser ausdrücklich kenntlich gemacht wird.
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den schlichten erzählerischen Anschluss, ohne eine zusätzliche Folgerung oder zeitliche Abstufung einzutragen.
- source_word: περιεβλέπετο
  choice: er blickte sich weiter um
  rationale: Das Imperfekt bezeichnet eine andauernde Handlung; die mediale Form wird im Deutschen idiomatisch mit „sich umblicken“ wiedergegeben.
- source_word: ἰδεῖν
  choice: um … zu sehen
  rationale: Gibt den Infinitiv als Zweckangabe direkt und natürlich wieder.
- source_word: τὴν … ποιήσασαν
  choice: die, die … getan hatte
  rationale: Der substantivierte feminine Partizipialausdruck wird ohne Ergänzung des im Griechischen nicht ausdrücklich vorhandenen Substantivs „Frau“ wiedergegeben; die feminine Form bleibt im Deutschen erkennbar.
- source_word: τοῦτο
  choice: das
  rationale: Natürliches deutsches Demonstrativpronomen mit Rückbezug auf die unmittelbar zuvor beschriebene Handlung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Blickte sich weiter um“ wahrt den andauernden Aspekt des griechischen Imperfekts; die Wiederholung „die, die“ ist idiomatisch und erhält die feminine Referenz ohne das Substantiv „Frau“ in den Haupttext einzufügen.
