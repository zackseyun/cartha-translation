source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: de
  text: Denn er war oft mit Fußfesseln und Ketten gefesselt worden, und er hatte die Ketten auseinandergerissen und die Fußfesseln zertrümmert; niemand war stark genug, ihn zu bändigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ihn zu zähmen. Das griechische Verb kann „zähmen“ oder allgemeiner „bändigen, unter Kontrolle bringen“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: Denn er war … worden
  rationale: διά mit artikuliertem Infinitiv gibt den Grund für die vorausgehende Aussage an. „Denn“ bewahrt diesen kausalen Zusammenhang in natürlichem Deutsch.
- source_word: πολλάκις
  choice: schon oft
  rationale: „Oft“ gibt die wiederholten Fesselungsversuche wieder; „schon“ unterstreicht idiomatisch, dass dies zuvor wiederholt geschehen war.
- source_word: πέδαις / τὰς πέδας
  choice: Fußfesseln / die Fußfesseln
  rationale: πέδη bezeichnet speziell eine Fessel für die Füße. „Fußfesseln“ ist präzise und unterscheidet den Ausdruck von den allgemeinen Ketten.
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: Ketten / die Ketten
  rationale: ἅλυσις bezeichnet Ketten; die eigenständige Wiedergabe erhält die beiden verschiedenen Arten von Fesseln im Griechischen.
- source_word: δεδέσθαι
  choice: gefesselt worden
  rationale: Der Perfektinfinitiv beschreibt das Ergebnis wiederholter Versuche, den Mann zu fesseln. Das deutsche Plusquamperfekt Passiv passt zum erzählerischen Rückblick.
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ
  choice: er hatte … auseinandergerissen
  rationale: διασπάω bezeichnet ein gewaltsames Auseinanderreißen. Die aktive deutsche Form benennt den Mann natürlich als den durch ὑπό bezeichneten Handelnden.
- source_word: συντετρῖφθαι
  choice: zertrümmert
  rationale: συντρίβω bezeichnet ein heftiges Zerbrechen oder Zerschmettern. „Zertrümmert“ ist kräftig, verständlich und knapp.
- source_word: οὐδεὶς ἴσχυεν
  choice: niemand war stark genug
  rationale: ἰσχύω betont Stärke beziehungsweise ausreichende Kraft; diese Nuance bleibt deutlicher erhalten als bei dem allgemeineren „niemand konnte“.
- source_word: δαμάσαι
  choice: zu bändigen
  rationale: δαμάζω kann „zähmen“, „bändigen“ oder „unter Kontrolle bringen“ bedeuten. „Bändigen“ passt zu einem gewaltsam unbeherrschbaren Menschen, ohne unnötig die Vorstellung von Tierdressur hervorzurufen.
theological_decisions:
- issue: Ursache der außergewöhnlichen Kraft und Unbezwingbarkeit des Mannes
  choice: Der Vers beschreibt nur die wiederholt gescheiterten Fesselungsversuche und die außergewöhnliche Kraft des Mannes.
  alternative: Die Formulierung ausdrücklich als unmittelbare Wirkung dämonischer Macht zu deuten.
  rationale: Der griechische Satz erklärt an dieser Stelle die außergewöhnliche Kraft nicht eigens. Die Übersetzung belässt die Ursache im Zusammenhang der Erzählung und fügt keine theologische Erklärung hinzu.
- issue: Bedeutungsbreite von δαμάζω
  choice: „bändigen“ im Haupttext
  alternative: „zähmen“
  rationale: Beide Bedeutungen sind lexikalisch möglich. „Bändigen“ ist im Kontext natürlicher, während die Fußnote die wörtlichere beziehungsweise weiter reichende Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die präzise Unterscheidung zwischen Fußfesseln und Ketten bleibt erhalten. Das Semikolon gliedert die lange Begründung lesbar, ohne den engen Zusammenhang der Aussagen aufzulösen.
