source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: de
  text: 'Und er nahm die Hand des Kindes und sagte zu ihr: »Talitha kum!« Das heißt übersetzt: »Mädchen, ich sage dir: Steh auf!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: er nahm die Hand des Kindes
  rationale: Die Verbindung von κρατέω mit dem Genitiv bezeichnet hier das Ergreifen bzw. Halten der Hand. Die gewählte Formulierung ist im Deutschen natürlich und wahrt die konkrete, dem Zusammenhang angemessene Handlung.
- source_word: λέγει αὐτῇ
  choice: sagte zu ihr
  rationale: Das griechische historische Präsens ist ein typisches Erzählmittel bei Markus. Im modernen deutschen Erzählstil gibt das Präteritum den Zusammenhang natürlicher wieder, ohne den Inhalt zu verändern.
- source_word: Ταλιθα κουμ
  choice: Talitha kum
  rationale: Die im griechischen Text bewahrten aramäischen Worte werden transliteriert und anschließend entsprechend der Erklärung des Evangelisten übersetzt. „kum“ bildet κουμ im Deutschen direkt und verständlich ab.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: Das heißt übersetzt
  rationale: Die Wendung kennzeichnet ausdrücklich die nachfolgende Übersetzung der aramäischen Worte. Die deutsche Form ist klar und idiomatisch.
- source_word: Τὸ κοράσιον
  choice: Mädchen
  rationale: κοράσιον bezeichnet ein junges Mädchen und kann eine diminutive bzw. liebevolle Färbung haben. „Mädchen“ ist im Deutschen selbst eine Diminutivbildung und gibt Alter und Geschlecht natürlich wieder.
- source_word: σοὶ λέγω
  choice: ich sage dir
  rationale: Die im Griechischen ausdrückliche Wendung bleibt erhalten und wahrt die persönliche, nachdrückliche Anrede.
- source_word: ἔγειρε
  choice: Steh auf
  rationale: Der Imperativ von ἐγείρω fordert hier zum Aufstehen auf. „Steh auf“ ist gegenwärtiges, klares Deutsch und passt zur unmittelbar folgenden Handlung.
theological_decisions:
- issue: Bewahrung der aramäischen Worte Jesu
  choice: „Talitha kum“ bleibt im Haupttext stehen und wird mit der von Markus gegebenen Übersetzung verbunden.
  alternative: Nur die deutsche Übersetzung wiedergeben oder die traditionelle lateinisch beeinflusste Schreibweise „Talitha kumi/cum“ verwenden.
  rationale: Der Quelltext bewahrt die aramäische Äußerung ausdrücklich und erklärt sie anschließend. Beides zu erhalten wahrt die besondere Erzählgestalt, ohne die Bedeutung zu verdunkeln.
- issue: Bedeutungsspektrum von ἔγειρε
  choice: „Steh auf“
  alternative: „Wach auf“ oder „Erhebe dich“
  rationale: ἐγείρω kann sowohl Aufwecken/Auferwecken als auch Aufstehen bezeichnen. Im unmittelbaren Handlungsablauf ist „Steh auf“ die natürliche Aufforderung; die erzählerische und theologische Spannung des Geschehens wird dadurch nicht zusätzlich ausgedeutet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die aramäischen Worte bleiben als markante Originaläußerung erhalten; die deutsche Wiedergabe folgt unmittelbar. Das historische Präsens wurde zugunsten eines natürlichen deutschen Erzählpräteritums geglättet.
