id: MRK.5.38
reference: Mark 5:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: de
  text: Und sie kommen zum Haus des Synagogenvorstehers, und er sieht einen Tumult und Menschen, die weinen und laut klagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kommen
  rationale: Das historische Präsens wird für die lebendige Erzählweise beibehalten; »kommen« gibt die Bewegung zum Haus direkt wieder.
- source_word: οἶκον
  choice: Haus
  rationale: »Haus« ist die naheliegende, kontextuell passende Entsprechung und vermeidet die zusätzliche emotionale Färbung von »Zuhause«.
- source_word: ἀρχισυναγώγου
  choice: Synagogenvorsteher
  rationale: Der etablierte deutsche Ausdruck bezeichnet den leitenden beziehungsweise vorsitzenden Amtsträger einer Synagoge präzise und verständlich.
- source_word: θεωρεῖ
  choice: sieht
  rationale: Das Verb steht im Singular und bezieht sich im Kontext auf Jesus; »sieht« ist schlicht und direkt.
- source_word: θόρυβον
  choice: Tumult
  rationale: θόρυβος bezeichnet hier nicht bloß Lärm, sondern laute Unruhe im Zusammenhang mit der Totenklage; »Tumult« bildet beide Aspekte knapp ab.
- source_word: κλαίοντας
  choice: Menschen, die weinen
  rationale: Das substantivisch gebrauchte Partizip wird im Deutschen natürlich durch einen Relativsatz mit ergänztem »Menschen« wiedergegeben.
- source_word: ἀλαλάζοντας
  choice: laut klagen
  rationale: Das Verb bezeichnet lautes Rufen oder Wehklagen, besonders in einer Trauerszene; »klagen« trifft den Kontext, während πολλά die Lautstärke ausdrückt.
- source_word: πολλά
  choice: laut
  rationale: πολλά verstärkt hier adverbial das Klagen; idiomatisches Deutsch gibt dies mit »laut« statt mit dem wörtlicheren »viel« wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens und die Abfolge der Wahrnehmungen bleiben erhalten. Der wiederholte griechische Anschluss mit καί wird durch einen neuen Satz und »und« natürlich wiedergegeben, ohne die Szene syntaktisch zu überladen.
