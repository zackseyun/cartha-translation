source:
  edition: SBLGNT
  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: de
  text: Und als er gerade in das Boot stieg, bat ihn der Mann, der von Dämonen besessen gewesen war,[a] immer wieder, bei ihm sein zu dürfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „der von Dämonen Besessene“.'
    reason: Die Fußnote zeigt die knappere substantivische Form des griechischen Partizips; der Haupttext verdeutlicht aus dem Zusammenhang, dass die Besessenheit bereits beendet war.
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον
  choice: als er in das Boot stieg
  rationale: Der Genitivus absolutus bezeichnet eine zur Haupthandlung gleichzeitige Handlung. Die deutsche Konstruktion mit „als“ gibt den zeitlichen Zusammenhang natürlich wieder; „Boot“ passt zum erzählten Umfeld am See Gennesaret.
- source_word: παρεκάλει
  choice: bat ihn … immer wieder
  rationale: Das Imperfekt stellt die Bitte als anhaltend oder wiederholt dar. „bat … immer wieder“ bewahrt diesen Aspekt und die Eindringlichkeit, ohne unnötig pathetisch zu klingen.
- source_word: ὁ δαιμονισθείς
  choice: der Mann, der von Dämonen besessen gewesen war
  rationale: Das substantivierte Partizip bezeichnet den zuvor dämonisch beherrschten und inzwischen befreiten Mann. Die Umschreibung macht den Rückbezug und den im Erzählzusammenhang vergangenen Zustand verständlich.
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: bei ihm sein zu dürfen
  rationale: Die Infinitivkonstruktion gibt im Deutschen den Inhalt der Bitte idiomatisch wieder. „bei ihm sein“ bewahrt den persönlichen, relationalen Sinn von μετ’ αὐτοῦ; „zu dürfen“ entspricht dem erbetenen Einverständnis.
theological_decisions:
- issue: Wiedergabe der dämonischen Beherrschung in δαιμονισθείς
  choice: von Dämonen besessen gewesen war
  alternative: dämonisiert gewesen war; unter der Macht von Dämonen gestanden hatte
  rationale: Die Formulierung nimmt die im Evangelium erzählte reale dämonische Bedrängnis ernst und macht zugleich deutlich, dass der Mann nun befreit war. Sie vermeidet sowohl eine rein klinische Umdeutung als auch eine über den Text hinausgehende dogmatische Präzisierung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstellung hält Jesus als Bezugspunkt der Pronomen erkennbar und bewahrt die fortdauernde Eindringlichkeit der Bitte.
