  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: de
  text: 'Denn er sagte zu ihm: »Fahr aus dem Menschen aus, du unreiner Geist!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Imperfekt kann auch eine fortdauernde oder wiederholte Aufforderung ausdrücken: »Denn er sagte immer wieder zu ihm: ›Fahr aus dem Menschen aus, du unreiner Geist!‹« Das Pronomen »ihm« kann grammatisch auch auf den unreinen Geist bezogen werden.'
    reason: Aspekt- und Bezugsalternativen im griechischen Text
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Der Imperfekt beschreibt hier die bereits einsetzende und den Vorgang erklärende Rede Jesu. Im Deutschen gibt das Präteritum dies im erzählenden Zusammenhang natürlicher wieder als »er war dabei zu sagen«; eine wiederholte Aufforderung ist möglich, aber nicht zwingend.
- source_word: γὰρ
  choice: Denn
  rationale: Die Konjunktion führt die Erklärung für die Reaktion des Mannes im vorangehenden Vers ein.
- source_word: αὐτῷ
  choice: zu ihm
  rationale: Das maskuline Dativpronomen bezieht sich im Erzählrahmen am natürlichsten auf den Mann; der folgende Befehl richtet sich ausdrücklich an den unreinen Geist.
- source_word: Ἔξελθε … ἐκ
  choice: Fahr … aus … aus
  rationale: »Ausfahren« ist im Deutschen die natürliche und würdige Wendung für das Verlassen eines Menschen durch einen Geist und gibt die nachdrückliche Aufforderung mit der Bewegung aus dem Inneren wieder.
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: du unreiner Geist
  rationale: Die formal artikulierte Nominativgruppe dient nach dem Imperativ als direkte Anrede. »Du unreiner Geist« macht diese syntaktische Funktion im Deutschen eindeutig.
- source_word: τοῦ ἀνθρώπου
  choice: dem Menschen
  rationale: ἄνθρωπος bezeichnet hier den konkreten Mann, betont in dieser Aussage jedoch den Menschen im Gegensatz zu dem Geist. »Dem Menschen« bewahrt diese Wortwahl des griechischen Textes.
theological_decisions:
- issue: Wiedergabe von πνεῦμα ἀκάθαρτον im Zusammenhang einer Austreibung
  choice: unreiner Geist
  alternative: böser Geist
  rationale: Der griechische Ausdruck bezeichnet ausdrücklich einen »unreinen Geist«. »Böser Geist« wäre deutender und würde den Reinheitsaspekt einebnen.
- issue: Bezugswort von αὐτῷ
  choice: zu ihm, bezogen auf den Mann
  alternative: zu ihm, bezogen auf den Geist
  rationale: Der unmittelbare Erzählzusammenhang legt den Mann als Bezug nahe, während die direkte Anrede anschließend den Geist als Empfänger des Befehls kennzeichnet. Die Übersetzung lässt die pronominale Form des Originals stehen und erläutert die mögliche Ambiguität in der Fußnote.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. »Fahr aus« ist in diesem Kontext idiomatisch, ohne den Ausdruck »unreiner Geist« interpretierend abzuschwächen. Der Fußnotenmarker steht unmittelbar nach dem Zitat, auf das sich die sprachlichen Alternativen beziehen.
