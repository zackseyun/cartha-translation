source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: de
  text: 'Er aber sagte zu ihr: „Tochter, dein Glaube hat dich gerettet.[a] Geh in Frieden und sei von deinem Leiden geheilt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hat dich gesund gemacht“ oder „hat dich geheilt“. Das griechische Verb kann Rettung, Bewahrung oder Heilung bezeichnen.'
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Tochter
  rationale: Die wörtliche Anrede bewahrt sowohl die Zuwendung als auch den familiären Klang, ohne ein im Griechischen nicht vorhandenes Possessivpronomen hinzuzufügen.
- source_word: πίστις
  choice: Glaube
  rationale: Hier bezeichnet das Wort das vertrauende Sich-Zuwenden der Frau zu Jesus. „Glaube“ bewahrt zugleich die Verbindung zum zentralen neutestamentlichen Begriff.
- source_word: σέσωκέν
  choice: hat dich gerettet
  rationale: Das Perfekt von σῴζω wird als vollendete Handlung mit fortdauernder Wirkung wiedergegeben. „Gerettet“ erhält die mögliche Bedeutung, die über körperliche Heilung hinausgeht, während die folgende Aussage ausdrücklich ihre Gesundheit betrifft.
- source_word: ὕπαγε εἰς εἰρήνην
  choice: Geh in Frieden
  rationale: Die geläufige deutsche Wendung gibt den Aufbruch in einen Zustand des Friedens natürlich und würdig wieder.
- source_word: ἴσθι ὑγιὴς
  choice: sei … geheilt
  rationale: Die griechische Wendung bezeichnet den Zustand körperlicher Gesundheit. In Verbindung mit ἀπό und dem Leiden ist „sei von deinem Leiden geheilt“ im modernen Deutschen natürlicher als das formnähere, aber ungebräuchliche „sei gesund von“.
- source_word: μάστιγος
  choice: Leiden
  rationale: Das wörtlich eine Geißel oder Plage bezeichnende Wort beschreibt hier bildlich die quälende Krankheit der Frau. „Leiden“ ist verständlich und bewahrt den umfassenden Charakter ihrer Bedrängnis.
theological_decisions:
- issue: Bedeutungsumfang von σῴζω zwischen Rettung und Heilung
  choice: hat dich gerettet
  alternative: hat dich gesund gemacht / hat dich geheilt
  rationale: „Gerettet“ bewahrt die theologische und lexikalische Spannung des Verbs, das Rettung wie auch Heilung bezeichnen kann. Da die folgende Wendung die körperliche Heilung eigens ausspricht, werden die beiden griechischen Ausdrücke nicht stillschweigend gleichgesetzt.
- issue: Bedeutung von πίστις
  choice: Glaube
  alternative: Vertrauen
  rationale: Im Zusammenhang steht das Vertrauen der Frau zu Jesus im Vordergrund; „Glaube“ lässt diese Bedeutung zu und erhält zugleich den wiederkehrenden theologischen Leitbegriff.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die leicht markierte Anfangsstellung „Er aber“ bildet den erzählerischen Gegensatz des griechischen ὁ δέ ab. Die direkte Anrede „Tochter“ bleibt bewusst knapp und zärtlich.
