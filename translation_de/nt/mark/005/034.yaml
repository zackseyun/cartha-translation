  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle Sinnelemente des griechischen Textes wieder: die zärtliche Anrede „Tochter“, πίστις als „Glaube“, das Perfekt σέσωκέν mit „hat dich gerettet“, den Weggang „Geh in Frieden“ sowie den anhaltenden Zustand der Gesundheit nach der Bedrängnis. „Sei von deinem Leiden geheilt“ ist eine idiomatische deutsche Wiedergabe von ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen würdigem Erzählton. „Er aber sagte zu ihr“ ist leicht literarisch, aber für den biblischen Kontext natürlich und bildet den griechischen Anschluss angemessen ab. Die Formulierung „von deinem Leiden geheilt“ ist im Deutschen deutlich idiomatischer als eine formnähere Wiedergabe mit „gesund von“.
  terminology: „Glaube“ wahrt den zentralen Begriff πίστις. „Gerettet“ erhält den weiteren Bedeutungsraum von σῴζω und lässt die nachfolgend ausdrücklich genannte körperliche Heilung davon unterschieden. Die Fußnote dokumentiert die möglichen heilungsbezogenen Lesarten ausgewogen. „Leiden“ gibt die metaphorische μάστιξ im Kontext angemessen wieder.
