source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: de
  text: 'Jesus aber hörte, was gesagt wurde,[a] und sagt zu dem Synagogenvorsteher: »Hab keine Angst; glaube nur!«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Jesus aber beachtete die Nachricht nicht« bzw. »ignorierte sie«. Das griechische Wort kann hier entweder »hören« oder »nicht beachten/übergehen« bedeuten.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Vertraue nur« oder »Habe nur Glauben«. Das griechische Verb lautet πιστεύω.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: hörte
  rationale: Das Partizip kann hier entweder das Hören einer Äußerung oder deren Nichtbeachtung bezeichnen. Da Jesus unmittelbar auf die eben überbrachte Nachricht reagiert, passt »hörte« gut zum Erzählfluss; die andere Möglichkeit bleibt in einer Fußnote erhalten.
- source_word: τὸν λόγον λαλούμενον
  choice: was gesagt wurde
  rationale: Diese natürliche deutsche Wendung gibt die gerade ausgesprochene Nachricht wieder, ohne das im Deutschen schwerfällige »das gesprochene Wort« zu verwenden.
- source_word: λέγει
  choice: sagt
  rationale: Das Präsens bewahrt Markus’ lebendiges historisches Präsens.
- source_word: ἀρχισυναγώγῳ
  choice: Synagogenvorsteher
  rationale: Der etablierte, verständliche deutsche Titel bezeichnet den leitenden Amtsträger der Synagoge.
- source_word: Μὴ φοβοῦ
  choice: Hab keine Angst
  rationale: Dies ist eine natürliche, gegenwärtige und direkte deutsche Wiedergabe des Verbots.
- source_word: μόνον
  choice: nur
  rationale: »Nur« gibt die einschränkende Kraft von μόνον knapp und idiomatisch wieder.
- source_word: πίστευε
  choice: glaube
  rationale: »Glaube« ist die direkte Entsprechung des Verbs πιστεύω. Der mögliche Aspekt des fortgesetzten Glaubens und die Nuance »vertrauen« werden in der Fußnote transparent gemacht.
theological_decisions:
- issue: Bedeutung von παρακούσας
  choice: Jesus hörte die Nachricht und wandte sich daraufhin an den Synagogenvorsteher.
  alternative: Jesus beachtete beziehungsweise berücksichtigte die Nachricht nicht.
  rationale: Beide Bedeutungen sind sprachlich möglich. Der unmittelbare Erzählzusammenhang legt das Hören nahe, doch die echte interpretative Alternative wird nicht verschwiegen.
- issue: Bedeutung von πιστεύω im Gebot Jesu
  choice: glaube
  alternative: vertraue beziehungsweise halte am Glauben fest
  rationale: »Glaube« wahrt den direkten lexikalischen Bezug. »Vertraue« kann die relationale Nuance hervorheben, während die Präsensform auch fortgesetztes Glauben nahelegen kann; beides bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das historische Präsens »sagt« bewahrt den lebendigen Erzählstil des Markus; die direkte Rede ist natürlich und eindringlich formuliert.
