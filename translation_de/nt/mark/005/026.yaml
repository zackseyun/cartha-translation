  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Partizipienkette wird als flüssige deutsche Reihung wiedergegeben; die Spannung zwischen ausbleibendem Nutzen und tatsächlicher Verschlechterung bleibt erhalten.
