review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird getroffen. „unter den Behandlungen vieler Ärzte“ legt jedoch stärker als der griechische Ausdruck ὑπὸ πολλῶν ἰατρῶν fest, dass gerade Behandlungen gemeint sind; dieser kann allgemeiner die Ärzte als Handelnde bzw. die Erfahrung unter ihrer Behandlung bezeichnen. „noch schlimmer“ ist zudem nicht nötig und kann gegenüber εἰς τὸ χεῖρον eine zusätzliche Steigerung nahelegen.
  naturalness: Die Reihung ist gut verständlich. „ohne dass es ihr etwas genützt hätte“ ist im modernen Standarddeutsch besonders idiomatisch und gibt den empfangenen, aber ausgebliebenen Nutzen klar wieder. „war es schlimmer mit ihr geworden“ ist eine natürliche, nicht überdeutende Wiedergabe der Verschlechterung.
  terminology: „Ärzte“, „alles ausgegeben“ und „genützt“ sind registergerecht. Die alternative Fußnote soll am Ausdruck für die Beziehung zu den Ärzten verankert werden, nicht am weiter gefassten „viel gelitten“.
