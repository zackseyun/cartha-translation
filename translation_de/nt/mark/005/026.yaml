  - severity: low
    issue: „noch schlimmer geworden“ kann eine zusätzliche Nuance ausdrücken.
    rationale: εἰς τὸ χεῖρον bezeichnet die Verschlechterung; „noch“ ist für den Kontrast durch ἀλλὰ μᾶλλον nicht erforderlich.
  revised_text: Sie hatte viel unter vielen Ärzten[a] gelitten, alles ausgegeben, was sie besaß, ohne dass es ihr etwas genützt hätte; vielmehr war es schlimmer mit ihr geworden.
