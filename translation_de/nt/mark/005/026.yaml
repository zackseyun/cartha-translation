source:
  edition: SBLGNT
  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: de
  text: Sie hatte viel unter vielen Ärzten[a] gelitten, alles ausgegeben, was sie besaß, ohne dass es ihr etwas genützt hätte; vielmehr war es schlimmer mit ihr geworden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch viele Ärzte« oder »von vielen Ärzten«. Das Griechische kann die Ärzte als Handelnde oder ihr Erleiden im Zusammenhang mit deren Behandlung hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: viel gelitten
  rationale: Gibt das vorzeitige Partizip natürlich wieder und bewahrt die Erfahrungsbedeutung von πάσχω.
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: unter den Behandlungen vieler Ärzte
  rationale: Verdeutlicht, dass ihr Leiden mit dem ärztlichen Handeln beziehungsweise den Behandlungen verbunden war, ohne eine über den griechischen Wortlaut hinausgehende Absicht zu unterstellen.
- source_word: δαπανήσασα
  choice: alles ausgegeben
  rationale: Das Partizip bezeichnet die bereits erfolgte Ausgabe; zusammen mit τὰ παρ’ αὐτῆς πάντα wird der vollständige Verbrauch ihrer Mittel ausgedrückt.
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: alles, was sie besaß
  rationale: Natürliche deutsche Wiedergabe für alles, was ihr gehörte oder ihr zur Verfügung stand.
- source_word: μηδὲν ὠφεληθεῖσα
  choice: keinerlei Besserung erfahren
  rationale: Bewahrt den passiven Sinn, dass sie keinen Nutzen beziehungsweise keine gesundheitliche Hilfe erhielt, und passt idiomatisch zum Krankheitskontext.
- source_word: ἀλλὰ μᾶλλον
  choice: vielmehr
  rationale: 'Markiert knapp die gesteigerte Gegenüberstellung: nicht nur kein Nutzen, sondern eine Verschlechterung.'
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: war ihr Zustand noch schlimmer geworden
  rationale: Gibt die Bewegung in einen schlechteren Zustand idiomatisch und klar wieder; „noch“ bringt den komparativen Gedanken zum Ausdruck.
theological_decisions: []
