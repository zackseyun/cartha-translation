  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: de
  text: 'Und er schrie mit lauter Stimme und sagte: „Was habe ich mit dir zu schaffen[a], Jesus, Sohn des höchsten Gottes? Ich beschwöre dich bei Gott[b]: Quäle mich nicht!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Was ist mir und dir?“ Die griechische Wendung drückt Distanz, Zurückweisung oder Konflikt aus; sinngemäß auch: „Was willst du von mir?“'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Ich flehe dich bei Gott an“; auch im Sinn von: „Ich nehme dich bei Gott unter Eid.“ Das griechische Verb bezeichnet eine feierliche Beschwörung oder Verpflichtung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: er schrie mit lauter Stimme
  rationale: Die Formulierung gibt den vorausgehenden Aoristpartizip und die Intensität des lauten, dringlichen Rufes in natürlichem Deutsch wieder.
- source_word: λέγει
  choice: und sagte
  rationale: Das historische Präsens wird im deutschen Erzählfluss mit dem Präteritum wiedergegeben; dadurch bleibt die Abfolge klar und idiomatisch.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Was habe ich mit dir zu schaffen
  rationale: Diese geläufige deutsche Wendung bewahrt den knappen, abweisenden Charakter des semitisch geprägten griechischen Idioms, das Distanz oder Konflikt ausdrückt.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Sohn Gottes, des Höchsten
  rationale: Die Wiedergabe erhält sowohl den Sohnestitel als auch die Gottesbezeichnung »der Höchste« und lässt die grammatische Zuordnung zu Gott deutlich erkennen.
- source_word: ὁρκίζω σε τὸν θεόν
  choice: Ich beschwöre dich bei Gott
  rationale: »Beschwören« bewahrt im Deutschen den feierlichen, eidartigen Nachdruck von ὁρκίζω, ohne die Äußerung zu einer bloßen Bitte abzuschwächen.
- source_word: μή με βασανίσῃς
  choice: Quäle mich nicht
  rationale: »Quälen« gibt die starke Bedeutung von βασανίζω natürlich wieder, ohne eine bestimmte Art körperlicher Folter festzulegen.
theological_decisions:
- issue: Die Anerkennung der Identität Jesu durch den unreinen Geist
  choice: Jesus, Sohn Gottes, des Höchsten
  alternative: Jesus, Sohn des höchsten Gottes
  rationale: Die gewählte Fassung bewahrt den ausdrücklichen Sohnestitel und die Bezeichnung Gottes als »der Höchste«, ohne die Aussage durch spätere dogmatische Begriffe zu erweitern.
- issue: Die Wirkung von ὁρκίζω in der Bitte des unreinen Geistes
  choice: Ich beschwöre dich bei Gott
  alternative: Ich flehe dich bei Gott an / Ich nehme dich bei Gott unter Eid
  rationale: Die Formulierung erhält die auffällige Spannung, dass der unreine Geist Gott anruft, um Jesus feierlich zu verpflichten, statt die Wendung zu einer gewöhnlichen Bitte zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt scharf und eindringlich; seltene oder altertümliche Wörter werden vermieden. »Beschwöre« ist bewusst gehoben, aber im Deutschen verständlich und sachlich passend.
