  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: de
  text: Und sofort versiegte die Quelle ihrer Blutung[a], und sie merkte an ihrem Körper, dass sie von ihrem Leiden[b] geheilt war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Die Quelle ihres Blutes trocknete aus.« Das Griechische verwendet das anschauliche Bild einer Quelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »von ihrer Plage« beziehungsweise »von ihrer Geißel«. Gemeint ist hier ihr quälendes Leiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus typische Unmittelbarkeit und klingt in modernem Deutsch natürlich.
- source_word: ἐξηράνθη
  choice: versiegte
  rationale: Gibt das Austrocknen einer Quelle idiomatisch wieder und erhält zugleich das anschauliche Bild des griechischen Ausdrucks.
- source_word: ἡ πηγὴ τοῦ αἵματος αὐτῆς
  choice: die Quelle ihrer Blutung
  rationale: πηγή bezeichnet eine Quelle oder einen Ursprung. Die Formulierung bewahrt die Metapher und macht im Deutschen deutlich, dass eine anhaltende Blutung gemeint ist.
- source_word: ἔγνω τῷ σώματι
  choice: sie spürte an ihrem Körper
  rationale: ἔγνω bedeutet erkannte oder wusste; zusammen mit dem Dativ τῷ σώματι bezeichnet es hier eine körperlich wahrgenommene Gewissheit. „Spürte“ ist natürliches Deutsch, ohne die Erkenntnis auf ein bloßes Gefühl zu reduzieren.
- source_word: ἴαται
  choice: dass sie ... geheilt war
  rationale: Das Perfekt bezeichnet eine vollzogene Heilung mit fortbestehendem Ergebnis; im deutschen abhängigen Satz gibt „geheilt war“ dies natürlich wieder.
- source_word: ἀπὸ τῆς μάστιγος
  choice: von ihrem Leiden
  rationale: μάστιξ bedeutet wörtlich Geißel und übertragen eine schwere, quälende Plage. Im Kontext bezeichnet es die Erkrankung; „Leiden“ ist verständlich und bewahrt deren schmerzlichen Charakter.
theological_decisions:
- issue: Art der Heilungsaussage
  choice: Die objektive Beendigung der Blutung und die körperliche Wahrnehmung der bereits vollzogenen Heilung werden beide ausgedrückt.
  alternative: Die Aussage könnte stärker als bloß subjektives Empfinden paraphrasiert werden.
  rationale: Der griechische Text verbindet das tatsächliche Versiegen der Blutquelle mit der leiblichen Erkenntnis der Frau, ohne den Mechanismus oder die theologische Bedeutung weiter zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Versiegte“ erhält die Quellenmetapher in natürlicher Form; „spürte an ihrem Körper“ vermittelt die leibliche Erkenntnis idiomatisch.
