source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: de
  text: 'Und sofort merkte Jesus, dass Kraft von ihm ausgegangen war. Er wandte sich in der Menge um und fragte: »Wer hat meine Kleider berührt?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt das für Markus typische schnelle Erzähltempo und ist modernes, natürliches Deutsch.
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: merkte Jesus in sich
  rationale: Gibt die innere, klare Wahrnehmung wieder, ohne sie als äußerliche Beobachtung oder bloßes Gefühl umzudeuten.
- source_word: δύναμιν
  choice: Kraft
  rationale: Bezeichnet hier wirksame, von Jesus ausgehende Kraft. Das deutsche »Kraft« ist direkt und lässt den Heilungsbezug aus dem Kontext hervorgehen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: ἐξ αὐτοῦ … ἐξελθοῦσαν
  choice: dass Kraft von ihm ausgegangen war
  rationale: Das Plusquamperfekt stellt die bereits erfolgte Handlung gegenüber dem Wahrnehmen angemessen dar.
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: Er wandte sich in der Menge um
  rationale: Gibt die körperliche Wendung und Jesu Standort innerhalb der Menschenmenge natürlich wieder.
- source_word: ἔλεγεν
  choice: fragte
  rationale: Die direkte Rede ist eine Frage; »fragte« ist im Deutschen idiomatischer als das formal nähere »sagte«, ohne den Inhalt zu verändern.
- source_word: ἥψατο τῶν ἱματίων
  choice: hat meine Kleider berührt
  rationale: »Kleider« ist verständliches, würdiges Standarddeutsch und wahrt den Plural von ἱμάτια; »Gewänder« wäre gehobener und altertümlicher, »Mantel« zu spezifisch.
theological_decisions:
- issue: Die von Jesus ausgehende δύναμις
  choice: Die Aussage, dass Kraft von ihm ausgegangen war, wird als reale Erzählbehauptung beibehalten.
  alternative: 'Deutender: »dass heilende Kraft von ihm ausgegangen war«; abschwächend: Darstellung als bloß subjektives Empfinden.'
  rationale: Der griechische Text spricht schlicht von Kraft und erklärt weder die genaue Art noch die Wirkungsweise. Die Übersetzung bewahrt diese Aussage und ihre theologische Spannung ohne Zusatz.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung vermeidet eine schwerfällige Partizipialkonstruktion. Keine Fußnote ist nötig; die im englischen Material angegebene Fußnote ist inhaltlich inkonsistent, da ihr Wortlaut keine echte Alternative zu der dortigen Haupttextfassung bietet.
