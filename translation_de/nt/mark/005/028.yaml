  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: de
  text: 'Denn sie sagte immer wieder: „Wenn ich auch nur eines seiner Kleider berühre, werde ich geheilt[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb bedeutet wörtlich „gerettet werden“ und kann je nach Zusammenhang auch „geheilt werden“ oder „gesund werden“ bedeuten. Hier weist der Zusammenhang auf körperliche Heilung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sie sagte sich immer wieder
  rationale: Der Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Sagen. Das reflexive „sagte sich“ passt zum erzählerischen Zusammenhang, ohne festzulegen, ob sie hörbar sprach.
- source_word: γὰρ
  choice: Denn
  rationale: Leitet die Begründung für ihr vorausgehendes Handeln ein und entspricht dem griechischen Erklärungspartikel natürlich.
- source_word: ὅτι
  choice: durch Doppelpunkt und direkte Rede wiedergegeben
  rationale: ὅτι führt hier den Inhalt ihres Sagens ein; direkte Rede ist im Deutschen natürlich.
- source_word: ἐὰν ... ἅψωμαι
  choice: Wenn ich ... berühre
  rationale: Gibt die Bedingung mit Konjunktiv idiomatisch als reale Zukunftserwartung wieder.
- source_word: κἂν
  choice: auch nur
  rationale: 'Bewahrt den hervorhebenden und minimierenden Sinn: Schon die bloße Berührung ihrer Kleider genügt nach ihrer Erwartung.'
- source_word: τῶν ἱματίων αὐτοῦ
  choice: seine Kleider
  rationale: Der Plural bezeichnet allgemein die Kleidung Jesu; „Kleider“ ist präzise, verständlich und würdevoll, ohne auf ein einzelnes Gewand einzuengen.
- source_word: σωθήσομαι
  choice: werde ich gerettet
  rationale: Bewahrt die Grundbedeutung und semantische Spannung von σῴζω zwischen Rettung und Heilung. Im Kontext ist körperliche Heilung gemeint; dies wird in der Fußnote erläutert.
theological_decisions:
- issue: Bedeutung von σωθήσομαι im Heilungsbericht
  choice: werde ich gerettet
  alternative: werde ich geheilt / werde ich gesund
  rationale: Der unmittelbare Zusammenhang verweist auf körperliche Heilung, doch σῴζω kann sowohl „retten“ als auch „heilen/gesund machen“ bedeuten. Die formal nähere Wiedergabe lässt Markus’ mögliche Bedeutungsweite stehen, während die Fußnote den kontextuellen Sinn klärt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. „Auch nur“ bildet die emphatische Einschränkung natürlich ab; „gerettet“ wahrt mit erklärender Fußnote die lexikalische und theologische Spannung des griechischen Verbs.
