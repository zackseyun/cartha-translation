review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: καὶ παρεκάλεσαν αὐτὸν λέγοντες ist idiomatisch als „Und sie flehten ihn an:“ wiedergegeben; Πέμψον ἡμᾶς entspricht „Schick uns“; εἰς τοὺς χοίρους und εἰς αὐτοὺς bleiben als Bewegung in die Schweine bzw. in sie erhalten. „Damit“ bildet die durch ἵνα eingeleitete Zielangabe angemessen ab.'
  naturalness: Der Satz ist modernes, flüssiges und würdiges Erzähldeutsch. Der Doppelpunkt ist eine natürliche deutsche Umsetzung des partizipialen „sagend“. „In sie hineinfahren“ ist im Kontext von Geistern idiomatisch und verständlich; es vermeidet ein im Deutschen bei Tieren weniger natürliches „in sie eintreten“, ohne den Aussagegehalt wesentlich zu erweitern.
  terminology: „Flehten ihn an“ trifft die Dringlichkeit von παρεκάλεσαν gut. „Schweine“ ist die normale moderne Bezeichnung für χοίρους. Die Wendung „in sie hineinfahren“ steht im etablierten deutschen Sprachgebrauch für das Eingehen von Geistern in Lebewesen und ist hier kontextgerecht. Es sind keine Fußnoten erforderlich; die englische lexikalische Alternative „swine“ verlangt im Deutschen keine entsprechende Anmerkung.
