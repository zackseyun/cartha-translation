source:
  edition: SBLGNT
  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: de
  text: 'Und sie flehten ihn an: „Schick uns in die Schweine, damit wir in sie hineinfahren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: flehten ihn an
  rationale: Das Verb bezeichnet hier eine dringliche Bitte. „Anflehen“ gibt die Intensität im Zusammenhang natürlich wieder und ist stärker als das schlichtere „bitten“.
- source_word: λέγοντες
  choice: ':'
  rationale: Der Doppelpunkt führt im modernen Deutschen die wörtliche Rede natürlich ein und gibt damit die Funktion des griechischen Partizips wieder, ohne das schwerfällige „indem sie sagten“.
- source_word: Πέμψον ἡμᾶς
  choice: Schick uns
  rationale: Die direkte Aufforderung bewahrt die Grundbedeutung von πέμπω und paraphrasiert sie nicht lediglich als Bitte um Erlaubnis.
- source_word: εἰς τοὺς χοίρους
  choice: in die Schweine
  rationale: „Schweine“ ist die sachlich genaue und im heutigen Deutsch übliche Bezeichnung; die Präposition wahrt die im Griechischen ausgedrückte Bewegung hinein.
- source_word: ἵνα εἰς αὐτοὺς εἰσέλθωμεν
  choice: damit wir in sie hineinfahren
  rationale: „Damit“ kennzeichnet den Zweck der Bitte. Bei Geistern ist „in jemanden oder etwas hineinfahren“ im Deutschen eine natürliche Entsprechung für das Eintreten in ein Lebewesen und vermeidet das unidiomatische „sie betreten“.
theological_decisions:
- issue: Verhältnis der bittenden Geister zu Jesu Vollmacht
  choice: Die Geister flehen Jesus an und fordern ihn auf, sie in die Schweine zu schicken.
  alternative: Die Geister bitten lediglich um einen Ortswechsel, ohne dass Jesu Vollmacht besonders hervortritt.
  rationale: Die eindringliche Bitte und der Imperativ „Schick uns“ stellen die Geister als von Jesu Entscheidung abhängig dar, ohne über die Aussage des Verses hinauszugehen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzähldeutsch. Die direkte Rede bleibt knapp und eindringlich; die griechische Partizipialkonstruktion wird idiomatisch durch einen Doppelpunkt wiedergegeben.
