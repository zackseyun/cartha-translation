  text: καὶ οὐκ ἀφῆκεν οὐδένα ⸂μετ’ αὐτοῦ⸃ συνακολουθῆσαι εἰ μὴ ⸀τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν Ἰακώβου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/037.yaml
  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: de
  text: Und er erlaubte niemandem, ihn zu begleiten, außer Petrus, Jakobus und Johannes, dem Bruder des Jakobus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: ließ
  rationale: Mit einem Infinitiv bedeutet ἀφίημι hier, dass Jesus jemandem gestattet, mitzugehen. „ließ … gehen“ ist im modernen Deutsch natürlich und bewahrt den Sinn des Erlaubens.
- source_word: οὐδένα
  choice: niemanden
  rationale: Das Akkusativobjekt unter der Verneinung bezeichnet den vollständigen Ausschluss aller anderen Personen.
- source_word: μετ’ αὐτοῦ συνακολουθῆσαι
  choice: mit sich gehen
  rationale: Die Verbindung beschreibt das begleitende Mitgehen. „mit sich gehen“ gibt sowohl μετ’ αὐτοῦ als auch den Begleitsinn des zusammengesetzten Verbs knapp und idiomatisch wieder.
- source_word: εἰ μὴ
  choice: außer
  rationale: εἰ μὴ führt hier eine Ausnahme und keine Bedingung ein.
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Petrus, Jakobus und Johannes
  rationale: Die herkömmlichen deutschen Namensformen sind verständlich und angemessen; die deutsche Aufzählungsweise vermeidet eine unnötig schwerfällige Wiederholung von „und“.
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: dem Bruder des Jakobus
  rationale: Die Apposition bezeichnet Johannes näher. Der Dativ entspricht der Kasusführung nach „außer“ in dieser deutschen Formulierung.
