  source_fidelity: Die Aussage und die Ausnahmegruppe sind korrekt wiedergegeben. Das griechische συνακολουθῆσαι bezeichnet jedoch spezifisch ein Begleiten bzw. Mitfolgen; die Verbindung „mit sich gehen“ ist im Deutschen semantisch missverständlich und nicht idiomatisch.
  naturalness: „Mit sich gehen“ ist im modernen Standarddeutsch keine natürliche Formulierung für das Begleiten einer anderen Person und kann reflexiv missverstanden werden. „Ihn zu begleiten“ ist klar, idiomatisch und wahrt den Sinn.
  terminology: Die etablierten deutschen Namensformen Petrus, Jakobus und Johannes sind angemessen. „dem Bruder des Jakobus“ ist als nähere Bestimmung zu Johannes nach „außer“ grammatisch möglich und verständlich.
