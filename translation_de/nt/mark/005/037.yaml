- from: Und er ließ niemanden mit sich gehen außer Petrus, Jakobus und Johannes, dem Bruder des Jakobus.
  to: Und er erlaubte niemandem, ihn zu begleiten, außer Petrus, Jakobus und Johannes, dem Bruder des Jakobus.
