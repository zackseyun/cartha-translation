  text: ⸀ἀκούσασα περὶ τοῦ Ἰησοῦ, ἐλθοῦσα ἐν τῷ ὄχλῳ ὄπισθεν ἥψατο τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: de
  text: Sie hatte von Jesus gehört, kam in der Menge von hinten heran und berührte sein Gewand.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seinen Mantel« oder »seine Kleidung«. Das griechische Wort bezeichnet allgemein ein Kleidungsstück, häufig ein Obergewand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: Sie hatte … gehört
  rationale: Das feminine Aoristpartizip bezeichnet eine Handlung, die der folgenden Annäherung und Berührung vorausgeht. Das Plusquamperfekt gibt diese zeitliche Abfolge im natürlichen modernen Deutsch wieder.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: von Jesus
  rationale: περί mit Genitiv bedeutet hier »über/von«. In Verbindung mit »hören« ist »von Jesus gehört« idiomatisch und bewahrt den Sinn, dass sie Berichte über ihn vernommen hatte.
- source_word: ἐλθοῦσα
  choice: kam … heran
  rationale: Das Aoristpartizip beschreibt ihre Annäherung vor der Haupthandlung. »kam … heran« gibt die zielgerichtete Bewegung zu Jesus natürlich wieder.
- source_word: ἐν τῷ ὄχλῳ
  choice: in der Menge
  rationale: ἐν mit Dativ bezeichnet hier den räumlichen Rahmen; »in der Menge« ist präzise und geläufig.
- source_word: ὄπισθεν
  choice: von hinten
  rationale: Das Adverb bezeichnet eine Annäherung von der Rückseite. Der Bezug auf Jesus ergibt sich eindeutig aus dem Zusammenhang, sodass kein zusätzliches Pronomen nötig ist.
- source_word: ἥψατο
  choice: berührte
  rationale: Der mediale Aorist von ἅπτω mit Genitiv bezeichnet hier das Berühren bzw. Anfassen. »berührte« vermeidet eine nicht ausdrücklich angegebene Vorstellung von festem oder längerem Ergreifen.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: sein Gewand
  rationale: ἱμάτιον kann allgemein ein Kleidungsstück und häufig das Obergewand bezeichnen. »Gewand« hält den Singular und bleibt hinsichtlich der genauen Art des Kleidungsstücks offen.
