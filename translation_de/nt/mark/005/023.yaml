  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: de
  text: 'Und er flehte ihn inständig an: „Meine kleine Tochter liegt im Sterben. Komm und leg ihr die Hände auf, damit sie gerettet wird[a] und weiterlebt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geheilt wird“ oder „gesund wird“. Das griechische Verb kann retten, heilen oder gesund machen bedeuten; hier geht es unmittelbar um körperliche Heilung.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ … πολλὰ
  choice: flehte ihn inständig an
  rationale: παρακαλέω bezeichnet hier angesichts der Todesgefahr eine dringende Bitte; πολλὰ verstärkt sie. Die Formulierung gibt Verzweiflung und Nachdruck natürlich wieder, ohne „wiederholt“ festzulegen.
- source_word: θυγάτριόν
  choice: Töchterchen
  rationale: Das Diminutiv bewahrt sowohl den Hinweis auf das junge Alter als auch den liebevollen Ton.
- source_word: ἐσχάτως ἔχει
  choice: liegt im Sterben
  rationale: Die idiomatische Wendung bezeichnet hier einen äußersten, unmittelbar lebensbedrohlichen Zustand. „Liegt im Sterben“ ist im Deutschen klar, würdevoll und eindringlich.
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: Komm und leg ihr die Hände auf
  rationale: Der Aoristpartizip wird im Zusammenhang der Bitte natürlich als vorgeordnete Aufforderung wiedergegeben; der Plural „die Hände“ bleibt erhalten.
- source_word: σωθῇ
  choice: gerettet wird
  rationale: σῴζω kann retten, bewahren oder im Zusammenhang von Krankheit heilen bedeuten. „Gerettet“ erhält die größere Bedeutungsweite, während der unmittelbare Zusammenhang die körperliche Heilung erkennen lässt.
- source_word: ζήσῃ
  choice: lebt
  rationale: Die direkte Wiedergabe bewahrt die Aussage, dass das Mädchen infolge der Rettung am Leben sein soll.
theological_decisions:
- issue: Bedeutung von σωθῇ im Heilungszusammenhang
  choice: gerettet wird
  alternative: geheilt wird / gesund wird
  rationale: Der unmittelbare Zusammenhang legt körperliche Heilung nahe, doch das Verb besitzt die weitere Bedeutung „retten“. Der Haupttext wahrt diese lexikalische und theologische Spannung; die Fußnote nennt die kontextuell naheliegende Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Töchterchen“ wahrt das Diminutiv; „flehte … inständig an“ vermittelt die Dringlichkeit, ohne eine nicht sichere Wiederholung der Bitte zu behaupten.
