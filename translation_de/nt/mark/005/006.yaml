source:
  edition: SBLGNT
  text: ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν ἀπὸ μακρόθεν ἔδραμεν καὶ προσεκύνησεν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/006.yaml
  text: And seeing Jesus from a distance[a], he ran and bowed down before him,
translation:
  language: de
  text: Und als er Jesus von Weitem sah, lief er zu ihm und warf sich vor ihm nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „betete ihn an“ oder „huldigte ihm“. Das griechische Verb kann je nach Zusammenhang Anbetung, Huldigung oder das Niederwerfen vor jemandem bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: als er … sah
  rationale: Das Aoristpartizip wird als natürliche deutsche Temporalkonstruktion wiedergegeben; sie bewahrt die zeitliche Abfolge, ohne eine stärkere Vorzeitigkeit festzulegen.
- source_word: ἀπὸ μακρόθεν
  choice: von Weitem
  rationale: Die Wendung bezeichnet räumliche Entfernung. „Von Weitem“ ist knapp, idiomatisch und gegenwartssprachlich.
- source_word: ἔδραμεν
  choice: lief er zu ihm
  rationale: Das Verb bedeutet schlicht „laufen/rennen“. Das im Deutschen ergänzte „zu ihm“ ergibt sich aus der gerichteten Handlung im Kontext und sorgt für einen natürlichen Satzanschluss.
- source_word: προσεκύνησεν αὐτόν
  choice: warf sich vor ihm nieder
  rationale: προσκυνέω kann je nach Kontext Anbetung, Huldigung oder körperliche Niederwerfung bezeichnen. Diese Formulierung stellt die sichtbare Handlung dar, ohne ihre religiöse Bedeutung vorschnell festzulegen.
- source_word: καὶ
  choice: Und
  rationale: Die einfache Satzverknüpfung erhält den parataktischen Erzählstil des Markus.
- source_word: τὸν Ἰησοῦν
  choice: Jesus
  rationale: Der Personenname wird im Deutschen ohne Artikel wiedergegeben.
theological_decisions:
- issue: Ob προσεκύνησεν ausdrücklich als Anbetung Jesu wiederzugeben ist
  choice: Im Haupttext steht „warf sich vor ihm nieder“.
  alternative: „betete ihn an“ oder „huldigte ihm“
  rationale: Das griechische Verb lässt sowohl eine religiöse Verehrung als auch eine Geste der Unterwerfung oder Huldigung zu. Die Haupttextformulierung wahrt diese Spannung; die möglichen stärkeren Bedeutungen werden in der Fußnote offengelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Anfangsverknüpfung „Und“ bewahrt Markus’ schlichten, fortlaufenden Stil; „warf sich … nieder“ ist anschaulich, ohne die theologische Nuance des Verbs einseitig festzulegen.
