  source_fidelity: Der Text gibt die Abfolge von καὶ ἰδὼν … ἔδραμεν καὶ προσεκύνησεν αὐτόν sachgerecht wieder. „Als er Jesus von Weitem sah“ ist eine natürliche Wiedergabe des Aoristpartizips ἰδών und von ἀπὸ μακρόθεν. „Lief er zu ihm“ gibt ἔδραμεν idiomatisch wieder; die Richtung ergibt sich im Deutschen sinnvoll aus der anschließenden Handlung. „Warf sich vor ihm nieder“ bewahrt die körperliche und semantisch offene Bedeutung von προσεκύνησεν.
  naturalness: Modernes Standarddeutsch, flüssig und dem knappen, parataktischen Markusstil angemessen. „Von Weitem“ und „warf sich vor ihm nieder“ sind idiomatisch und haben einen passenden würdigen Erzählton.
  terminology: Die Wiedergabe von προσεκύνησεν vermeidet zu Recht eine voreilige Festlegung auf „anbeten“. Die Fußnote nennt mit „betete ihn an“ und „huldigte ihm“ die wesentlichen lexikalischen Alternativen und erläutert die kontextabhängige Spannweite angemessen.
