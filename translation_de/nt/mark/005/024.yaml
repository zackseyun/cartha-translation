  text: καὶ ἀπῆλθεν μετ’ αὐτοῦ. Καὶ ἠκολούθει αὐτῷ ὄχλος πολύς, καὶ συνέθλιβον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/024.yaml
  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: de
  text: Und er ging mit ihm. Eine große Menschenmenge folgte ihm und drängte sich dicht um ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „bedrängte ihn“ oder „drängte gegen ihn“. Das griechische Verb beschreibt, wie die Menge Jesus körperlich eng umdrängte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ging
  rationale: Der Aorist erzählt Jesu Aufbruch mit Jairus. „Ging“ ist im Deutschen natürlich und gibt die Bewegung im Zusammenhang klar wieder.
- source_word: μετ’ αὐτοῦ
  choice: mit ihm
  rationale: μετά mit Genitiv bezeichnet Begleitung; „mit ihm“ ist die direkte und idiomatische Wiedergabe.
- source_word: ἠκολούθει
  choice: folgte
  rationale: Der Imperfekt bezeichnet den fortlaufenden Vorgang. Im Deutschen kann das Präteritum diesen Verlauf im erzählenden Zusammenhang natürlich ausdrücken, ohne eine schwerfällige Verlaufsform zu bilden.
- source_word: ὄχλος πολύς
  choice: eine große Menschenmenge
  rationale: ὄχλος bezeichnet eine Menschenmenge, πολύς deren beträchtliche Größe. „Eine große Menschenmenge“ ist klar und gegenwärtig.
- source_word: συνέθλιβον αὐτόν
  choice: drängte sich um ihn
  rationale: συνθλίβω vermittelt dichtes, körperliches Zusammendrängen. Die Formulierung wahrt diesen Sinn, ohne eine tatsächliche Verletzung oder ein wörtliches Zerquetschen zu behaupten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden griechischen Hauptsätze werden natürlich verbunden; die wiederholte Eröffnung mit καί wird nicht mechanisch jeweils mit „und“ wiedergegeben. Der Imperfekt erscheint idiomatisch im deutschen Erzählpräteritum.
