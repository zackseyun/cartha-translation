  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: de
  text: Nachdem Jesus im Boot wieder ans andere Ufer[a] übergesetzt hatte, versammelte sich eine große Menschenmenge um ihn, und er war am See.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist der See Gennesaret, der auch Galiläisches Meer genannt wird.
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: Nachdem … übergesetzt hatte
  rationale: Der Aoristpartizip im Genitivus absolutus bezeichnet hier eine Handlung, die der folgenden vorausgeht. Die deutsche Konstruktion mit „nachdem“ gibt diese zeitliche Abfolge natürlich wieder.
- source_word: ἐν τῷ πλοίῳ
  choice: im Boot
  rationale: Die Präpositionalphrase wird ausdrücklich wiedergegeben; „Boot“ passt in modernem Deutsch zum erzählten Schauplatz besser als „Schiff“.
- source_word: πάλιν
  choice: wieder
  rationale: Das Adverb kennzeichnet die erneute Überfahrt und wird direkt wiedergegeben.
- source_word: εἰς τὸ πέραν
  choice: ans andere Ufer
  rationale: Im Zusammenhang einer Seeüberfahrt bezeichnet die Wendung die gegenüberliegende Seite. „Ans andere Ufer“ ist im Deutschen natürlicher und räumlich präziser als „auf die andere Seite“.
- source_word: συνήχθη
  choice: versammelte sich
  rationale: Obwohl die griechische Form passiv ist, bezeichnet sie hier idiomatisch das Zusammenkommen der Menge. Das reflexive deutsche Verb bewahrt diesen Sinn ohne ein ungenanntes handelndes Subjekt einzuführen.
- source_word: ὄχλος πολὺς
  choice: eine große Menschenmenge
  rationale: Die Formulierung gibt die Größe der Menge klar und in modernem Deutsch wieder.
- source_word: ἐπ’ αὐτόν
  choice: um ihn
  rationale: Mit συνάγω bezeichnet ἐπί mit Akkusativ hier das Zusammenströmen zu Jesus und räumlich um ihn herum.
- source_word: παρὰ τὴν θάλασσαν
  choice: am See
  rationale: παρά mit Akkusativ bezeichnet hier die Lage am Ufer. „Am See“ ist im Deutschen die natürliche Ortsangabe und hält den Bezug zum Gewässer fest.
- source_word: θάλασσαν
  choice: See
  rationale: θάλασσα kann ein großes Binnengewässer bezeichnen. Da hier der See Gennesaret gemeint ist, ist „See“ im modernen Deutschen sachlich und idiomatisch treffend; die Fußnote erklärt zugleich die geografische Identität.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Erzähldeutsch. Die zwei griechischen Hauptsätze werden in zwei deutsche Sätze gegliedert. „Noch“ macht den in ἦν liegenden fortdauernden Schauplatzbezug idiomatisch deutlich, ohne den Handlungsablauf zu verändern.
