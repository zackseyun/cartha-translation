source:
  edition: SBLGNT
  text: ὃς τὴν κατοίκησιν εἶχεν ἐν τοῖς μνήμασιν, καὶ ⸂οὐδὲ ἁλύσει οὐκέτι⸃ οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/003.yaml
  text: who had his dwelling among the tombs[a], and no one could bind him anymore, not even with a chain.
translation:
  language: de
  text: Er hatte seine Wohnstätte in den Grabstätten, und niemand konnte ihn mehr binden, nicht einmal mit einer Kette.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: hatte seine Behausung
  rationale: Die Wendung bewahrt die konkrete griechische Konstruktion und bezeichnet seinen Aufenthalts- bzw. Wohnort, ohne die häuslichen Assoziationen von „Zuhause“ hervorzurufen.
- source_word: ἐν τοῖς μνήμασιν
  choice: in den Grabhöhlen
  rationale: μνήματα bezeichnet hier Grabstätten; im erzählerischen Umfeld sind in Fels gehauene bzw. begehbare Gräber gemeint. „Grabhöhlen“ macht verständlich, dass er sich darin aufhalten konnte, ohne eine einzelne Höhle festzulegen.
- source_word: οὐκέτι
  choice: mehr
  rationale: In Verbindung mit der Verneinung gibt „mehr“ natürlich wieder, dass eine zuvor bestehende Möglichkeit nun nicht mehr bestand.
- source_word: οὐδὲ ἁλύσει
  choice: nicht einmal mit einer Kette
  rationale: Die Formulierung erhält sowohl die verstärkende Bedeutung von οὐδέ als auch den Singular von ἅλυσις.
- source_word: ἐδύνατο ... δῆσαι
  choice: konnte ... binden
  rationale: Die Übersetzung gibt die fortdauernde Unfähigkeit in der Vergangenheit sowie die konkrete körperliche Fesselung knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Erzähldeutsch. „Behausung“ spiegelt die markante Wendung κατοίκησιν εἶχεν; „Grabhöhlen“ ist im Deutschen anschaulicher als „Gräber“ und passt zum begehbaren Schauplatz. Der Fußnotenmarker steht unmittelbar bei der betreffenden Ortsangabe.
