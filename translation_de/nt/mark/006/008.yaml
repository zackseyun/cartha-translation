  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: de
  text: 'Und er wies sie an, für den Weg nichts mitzunehmen außer einem Stab: kein Brot, keine Tasche[a] und kein Kupfergeld im Gürtel[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Reisetasche“, besonders eine Tasche für Proviant.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Kupfer“; gemeint ist Kupfergeld, das im Gürtel getragen wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: wies sie an
  rationale: Das Verb bezeichnet eine verbindliche Weisung. „Wies sie an“ klingt im modernen Deutschen natürlich und bewahrt den autoritativen Charakter.
- source_word: μηδὲν αἴρωσιν
  choice: nichts mitzunehmen
  rationale: Im Zusammenhang mit Reiseausrüstung bedeutet αἴρω hier, etwas mitzunehmen beziehungsweise zu tragen. „Nichts mitzunehmen“ ist idiomatisch und sachlich genau.
- source_word: εἰς ὁδὸν
  choice: für den Weg
  rationale: Die Wendung bezeichnet das, was für die bevorstehende Reise mitgenommen wird. „Für den Weg“ ist knapp und natürlich.
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: außer einem Stab
  rationale: ῥάβδος ist hier der Wanderstab. Die ausschließende Bedeutung von μόνον kommt bereits durch „nichts … außer“ eindeutig zum Ausdruck, ohne die im Deutschen schwerfällige Dopplung „außer nur“.
- source_word: ἄρτον
  choice: Brot
  rationale: Die konkrete Bezeichnung wird beibehalten und nicht verallgemeinernd als „Nahrung“ wiedergegeben.
- source_word: πήραν
  choice: Vorratstasche
  rationale: πήρα bezeichnet eine Tasche, die Reisende insbesondere für Proviant verwendeten. „Vorratstasche“ macht diese Funktion verständlich, ohne einen modernen Rucksack vorauszusetzen.
- source_word: ζώνην
  choice: Gürtel
  rationale: ζώνη bezeichnet den Gürtel beziehungsweise die Leibbinde, in der Geld verwahrt werden konnte.
- source_word: χαλκόν
  choice: Kupfermünzen
  rationale: Wörtlich bezeichnet das Wort Kupfer, hier metonymisch Kupfergeld. „Kupfermünzen“ vermittelt den konkreten Sinn im Deutschen; die wörtliche Form wird in der Fußnote genannt.
