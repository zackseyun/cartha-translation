base_translation:
  language: en
  yaml_path: translation/nt/mark/006/032.yaml
  text: And they went away in the boat to a desolate place by themselves[a][b].
translation:
  language: de
  text: Und sie fuhren im Boot für sich allein an einen einsamen Ort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abseits von den anderen“; auch: „privat“.'
