lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den für Markus typischen fortlaufenden, parataktischen Erzählstil.
- source_word: ἀπῆλθον
  choice: sie fuhren … an
  rationale: Im Zusammenhang mit ἐν τῷ πλοίῳ bezeichnet das Verb den Aufbruch und die Bewegung zum Ziel; „fuhren … an“ ist im Deutschen für eine Fahrt mit dem Boot natürlich.
- source_word: ἐν τῷ πλοίῳ
  choice: im Boot
  rationale: Gibt die griechische Präpositionalfügung eng wieder; „Boot“ passt zum erzählten Umfeld.
- source_word: εἰς ἔρημον τόπον
  choice: an einen einsamen Ort
  rationale: ἔρημος bezeichnet hier einen unbewohnten, abgelegenen Ort. „Einsam“ ist natürlich und vermeidet die mögliche geografische Überbestimmung durch „Wüste“.
- source_word: κατ’ ἰδίαν
  choice: um für sich zu sein
  rationale: Die idiomatische Wendung drückt Absonderung von anderen beziehungsweise Ungestörtheit aus; die Formulierung macht den Bezug auf das pluralische Subjekt klar.
theological_decisions: []
