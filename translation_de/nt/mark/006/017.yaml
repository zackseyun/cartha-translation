source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: de
  text: Denn Herodes selbst hatte durch ausgesandte Leute Johannes festnehmen und ihn im Gefängnis fesseln lassen, wegen Herodias, der Frau seines Bruders Philippus; denn er hatte sie geheiratet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: Denn Herodes selbst
  rationale: „Denn“ bewahrt den erklärenden Anschluss von γάρ; „selbst“ gibt die emphatische Stellung von Αὐτός wieder und betont Herodes’ Verantwortung.
- source_word: ἀποστείλας ἐκράτησεν
  choice: hatte … festnehmen … lassen
  rationale: Die Verbindung aus ἀποστείλας („nachdem er gesandt hatte“) und ἐκράτησεν bezeichnet Herodes als Veranlasser der Festnahme. Die deutsche Kausativkonstruktion gibt natürlich wieder, dass er Beauftragte sandte, ohne eine persönliche Festnahme durch Herodes nahezulegen.
- source_word: τὸν Ἰωάννην
  choice: Johannes
  rationale: Die übliche deutsche Namensform steht als Objekt von „festnehmen lassen“.
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: im Gefängnis fesseln lassen
  rationale: „Fesseln“ bewahrt den konkreten Sinn von δέω; „im Gefängnis“ gibt φυλακή als Haftort wieder. Das fortgeführte „lassen“ entspricht Herodes’ Handeln durch Beauftragte im narrativen Zusammenhang.
- source_word: διὰ Ἡρῳδιάδα
  choice: und zwar wegen Herodias
  rationale: διά mit Akkusativ nennt den Grund. „Und zwar“ macht im Deutschen deutlich, dass nun der Anlass der Festnahme erläutert wird.
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: der Frau seines Bruders Philippus
  rationale: γυνή bedeutet hier „Frau“ im Sinn von Ehefrau. Die deutsche Wortstellung ordnet Philippus eindeutig als Herodes’ Bruder ein.
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: die er geheiratet hatte
  rationale: Das Relativpronomen bezieht sich auf Herodias; das Plusquamperfekt stellt die Heirat als vorausliegendes Geschehen dar. Dadurch wird zugleich die im Deutschen schwerfällige Wiederholung von „wegen … weil“ vermieden.
theological_decisions:
- issue: Historisch-moralische Einordnung der Ehe des Herodes
  choice: Die Heirat wird als Anlass der Festnahme genannt, ohne sie in diesem Vers ausdrücklich moralisch oder rechtlich zu bewerten.
  alternative: Die Verbindung bereits hier als unrechtmäßige Ehe zu bezeichnen.
  rationale: Die ausdrückliche rechtliche Bewertung folgt im Kontext; der vorliegende Vers nennt zunächst die beteiligten Personen und den geschichtlichen Anlass.
- issue: Handelnder bei Festnahme und Fesselung
  choice: Herodes wird als verantwortlicher Veranlasser dargestellt, der die Maßnahmen durch Beauftragte ausführen ließ.
  alternative: Die Verben so wiederzugeben, als habe Herodes Johannes persönlich ergriffen und gefesselt.
  rationale: Das vorangestellte ἀποστείλας zeigt, dass Herodes jemanden aussandte; die deutsche Konstruktion wahrt seine Verantwortung, ohne unmittelbare persönliche Ausführung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Kausativkonstruktion „festnehmen und … fesseln lassen“ ist idiomatisch und gibt die griechische Handlungskette präziser wieder als das missverständliche „sandte und nahm fest“. Keine Fußnote ist nötig, da die relevante Handlungsperspektive im Haupttext klar ausgedrückt wird.
