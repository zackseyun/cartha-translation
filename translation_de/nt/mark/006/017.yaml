  terminology: „Herodes“, „Johannes“, „Herodias“ und „Philippus“ sind die üblichen deutschen Namensformen. „Frau“ ist hier als Ehefrau korrekt; „Gefängnis“ und „fesseln“ geben φυλακή bzw. δέω sachgerecht wieder.
