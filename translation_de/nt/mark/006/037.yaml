id: MRK.6.37
reference: Mark 6:37
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: de
  text: 'Er aber antwortete ihnen: »Gebt ihr ihnen zu essen!« Da sagten sie zu ihm: »Sollen wir etwa losgehen, für zweihundert Denare[a] Brot[b] kaufen und ihnen zu essen geben?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Denar entsprach ungefähr dem üblichen Tageslohn eines Arbeiters oder Soldaten.
    reason: cultural_note
  - marker: b
    text: 'Oder: »Brote«. Das griechische Wort kann sowohl Brot als auch einzelne Brote bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Er aber antwortete ihnen
  rationale: Die deutsche Wendung gibt sowohl den antwortenden Charakter als auch den narrativen Gegensatz δέ natürlich wieder; ein wörtliches „antwortete und sagte“ wäre im modernen Deutschen unnötig schwerfällig.
- source_word: Δότε ... ὑμεῖς
  choice: Gebt ihr
  rationale: Das ausdrücklich gesetzte ὑμεῖς ist emphatisch. Die Nachstellung von „ihr“ nach dem Imperativ bildet diese Betonung im Deutschen klar und natürlich ab.
- source_word: φαγεῖν
  choice: zu essen
  rationale: Nach „geben“ entspricht „ihnen zu essen geben“ der griechischen Konstruktion und ist im Deutschen idiomatisch.
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: Sollen wir etwa losgehen ... kaufen
  rationale: Der Aoristpartizip bezeichnet die dem Kauf vorausgehende Bewegung, während der deliberative Konjunktiv als Frage „Sollen wir ...?“ wiedergegeben wird. „Etwa“ lässt den kontextuell naheliegenden ungläubigen bzw. einwendenden Ton anklingen, ohne die Frage in eine bloße Aussage umzudeuten.
- source_word: δηναρίων διακοσίων
  choice: für zweihundert Denare
  rationale: Der Genitiv bezeichnet den Preis. „Für“ ist dafür im modernen Deutschen direkt und idiomatisch.
- source_word: ἄρτους
  choice: Brot
  rationale: ἄρτος kann Brot als Nahrung oder einzelne Brote bezeichnen. Im Haupttext klingt „Brot kaufen“ natürlich; die konkrete Alternative „Brote“ wird in einer Fußnote bewahrt.
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: ihnen zu essen geben
  rationale: Die Formulierung erhält die verbale Parallele zu Jesu Aufforderung und vermeidet die stärker paraphrasierende Wiedergabe „sie speisen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher direkter Rede. Die emphatische Stellung von ὑμεῖς wird durch „Gebt ihr“ erhalten. Die beiden Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Begriffen; ihre Reihenfolge folgt dem Auftreten im deutschen Haupttext.
