  terminology: „Bruchstücke“ gibt κλάσματα präzise und ohne die zusätzliche Festlegung auf Brot wieder. „Körbe“ für κόφινοι ist angemessen. Die Fußnote sollte die ungewöhnliche griechische Mengenformulierung erläutern, ohne eine nur scheinbar wörtliche deutsche Zerlegung zu behaupten.
