  text: And they picked up twelve basketfuls of broken pieces[a], and some of the fish.
translation:
  language: de
  text: Und sie sammelten zwölf Körbe voll Bruchstücke auf, auch von den Fischen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwölf volle Körbe mit Bruchstücken“. Die griechische Formulierung nennt „Bruchstücke“, „zwölf Körbe“ und „Füllungen/volle Inhalte“ in einer verdichteten Mengenangabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: sie sammelten … auf
  rationale: Das Verb αἴρω bezeichnet hier im Erzählzusammenhang das Aufsammeln der nach der Speisung übrig gebliebenen Stücke.
- source_word: κλάσματα
  choice: Brotstücke
  rationale: κλάσματα sind abgebrochene Stücke; aus dem Zusammenhang der Speisung ist Brot gemeint. „Brotstücke“ ist natürlich und verständlich, macht den Kontextbezug jedoch ausdrücklich kenntlich.
- source_word: δώδεκα κοφίνων πληρώματα
  choice: zwölf Körbe voll
  rationale: Die Wendung verbindet zwölf Körbe mit deren Füllungen beziehungsweise vollem Inhalt. „Zwölf Körbe voll“ bildet die ungewöhnliche Konstruktion idiomatisch und quellennah ab.
- source_word: κόφινος
  choice: Korb
  rationale: κόφινος bezeichnet einen Korb. Eine nähere Größenangabe wäre hier nicht durch den Text gefordert.
- source_word: πληρώματα
  choice: voll
  rationale: Das Substantiv bezeichnet hier Füllungen oder volle Mengen; im Deutschen gibt „Körbe voll“ diesen Gehalt knapp und natürlich wieder.
- source_word: ἀπὸ τῶν ἰχθύων
  choice: dazu Reste von den Fischen
  rationale: ἀπό bezeichnet die Herkunft weiterer aufgesammelter Stücke von den Fischen. „Reste“ wird aus dem Sammelkontext erschlossen und vermeidet das unnatürliche bloße „und von den Fischen“.
