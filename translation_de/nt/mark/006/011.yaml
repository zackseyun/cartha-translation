review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzfolge, Aufnahme, Hören, Weggehen und das Abschütteln des Staubes im Wesentlichen zutreffend wieder. Bei εἰς μαρτύριον αὐτοῖς ist „gegen sie“ jedoch keine ausdrückliche Aussage des griechischen Textes. Da die Richtung des Zeugnisses sprachlich nicht eindeutig als feindlich markiert ist, sollte die Hauptübersetzung die Mehrdeutigkeit nicht vorentscheiden.
  naturalness: Das Deutsch ist überwiegend natürlich und verständlich. „Wenn ihr von dort weggeht“ bildet die temporale Funktion von ἐκπορευόμενοι unmittelbarer ab als „dann geht von dort weg“. Das unpersönliche „man dort“ vermeidet zudem die nicht ausdrücklich genannte Ergänzung „die Menschen dort“, ohne den Sinn zu verdunkeln.
  terminology: „aufnimmt“, „auf euch hört“, „den Staub ... abschütteln“ und „Zeugnis“ sind angemessene moderne standarddeutsche Entsprechungen. „Ihnen zum Zeugnis“ wahrt die Dativbeziehung von αὐτοῖς und lässt die im Kontext mögliche warnende bzw. belastende Funktion offen.
