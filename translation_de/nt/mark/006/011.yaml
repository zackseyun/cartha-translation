revisions:
- from: Und wenn euch ein Ort nicht aufnimmt und die Menschen dort nicht auf euch hören, dann geht von dort weg und schüttelt den Staub unter euren Füßen ab – als Zeugnis gegen sie.[a][b]
  to: Und wenn euch ein Ort nicht aufnimmt und man dort nicht auf euch hört, dann schüttelt, wenn ihr von dort weggeht, den Staub unter euren Füßen ab – ihnen zum Zeugnis.[a][b]
  rationale: Die Revision ersetzt die interpretierende Hauptlesart „gegen sie“ durch „ihnen zum Zeugnis“, die den griechischen Dativ αὐτοῖς enger abbildet und die mögliche negative Funktion des Zeichens in der Fußnote erläutert. Zugleich wird der temporale Bezug des griechischen Partizips klarer wiedergegeben, ohne den Sinn zu verändern.
