source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: de
  text: Und wenn euch ein Ort nicht aufnimmt und man dort nicht auf euch hört, dann schüttelt, wenn ihr von dort weggeht, den Staub unter euren Füßen ab – ihnen zum Zeugnis.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Zeugnis für sie“. Das Griechische sagt nicht ausdrücklich „gegen sie“. Im Zusammenhang kann die Handlung jedoch als warnendes oder belastendes Zeugnis gegenüber denen verstanden werden, die die Botschaft ablehnen.'
    reason: alternative_reading
  - marker: b
    text: Den Staub von den Füßen abzuschütteln war eine symbolische Handlung der Distanzierung und Warnung angesichts von Ablehnung.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: wenn euch ein Ort
  rationale: Die generalisierende Konstruktion wird im Deutschen natürlich mit „wenn … ein Ort“ wiedergegeben; der ausdrücklich genannte τόπος bleibt erhalten.
- source_word: μὴ δέξηται ὑμᾶς
  choice: euch … nicht aufnimmt
  rationale: „Aufnehmen“ bewahrt sowohl den allgemeinen Sinn als auch den kontextuellen Aspekt gastlicher Aufnahme.
- source_word: μηδὲ ἀκούσωσιν ὑμῶν
  choice: die Menschen dort nicht auf euch hören
  rationale: Das im Griechischen implizite Subjekt wird zur Verständlichkeit aufgenommen. „Auf euch hören“ bezeichnet mehr als bloßes akustisches Hören, ohne so stark wie „euch gehorchen“ zu interpretieren.
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: dann geht von dort weg
  rationale: Der begleitende bzw. temporale Sinn des Partizips wird in eine natürliche deutsche Satzfolge übertragen.
- source_word: ἐκτινάξατε
  choice: schüttelt … ab
  rationale: „Abschütteln“ ist die idiomatische deutsche Entsprechung für das Entfernen des Staubes durch Schütteln.
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: den Staub unter euren Füßen
  rationale: Die konkrete Ortsangabe ὑποκάτω wird knapp und anschaulich bewahrt.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: als Zeugnis gegen sie
  rationale: „Zeugnis“ entspricht μαρτύριον; „gegen sie“ gibt die im Ablehnungskontext wahrscheinlich nachteilige Funktion wieder. Die formal nähere, weniger festlegende Alternative steht in der Fußnote.
theological_decisions:
- issue: Richtung und Funktion des Zeugnisses beim Abschütteln des Staubes
  choice: als Zeugnis gegen sie
  alternative: als Zeugnis für sie / ihnen zum Zeugnis
  rationale: Der griechische Dativ αὐτοῖς bezeichnet formal die Bezugsrichtung und legt „gegen“ nicht ausdrücklich fest. Der Ablehnungskontext lässt jedoch ein warnendes, belastendes Zeugnis wahrscheinlich erscheinen. Die Fußnote erhält die echte sprachliche Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Satzbau wurde gegenüber dem Griechischen leicht entfaltet, um das wechselnde Subjekt von Ort zu den dort lebenden Menschen eindeutig zu machen; die theologisch relevante Mehrdeutigkeit von εἰς μαρτύριον αὐτοῖς bleibt durch Fußnote [a] sichtbar.
