id: MRK.6.2
reference: Mark 6:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: de
  text: 'Als der Sabbat gekommen war, begann er in der Synagoge zu lehren. Viele, die ihm zuhörten, waren außer sich vor Staunen und sagten: »Woher hat dieser Mann das alles? Was ist das für eine Weisheit, die ihm gegeben wurde, und was sind das für machtvolle Taten[a], die durch seine Hände geschehen?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wundertaten« oder »Machterweise«. Der griechische Plural δυνάμεις kann außergewöhnliche Taten oder sichtbare Wirkungen von Macht bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: Als der Sabbat gekommen war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. Das deutsche Plusquamperfekt gibt das Eintreten des Sabbats vor dem Beginn des Lehrens klar wieder.
- source_word: ἤρξατο διδάσκειν
  choice: begann er … zu lehren
  rationale: Die ingressiv gebrauchte Verbindung von ἄρχομαι mit Infinitiv wird im Deutschen direkt und natürlich wiedergegeben.
- source_word: ἐν τῇ συναγωγῇ
  choice: in der Synagoge
  rationale: Im jüdischen Kontext ist die örtlich-institutionelle Bedeutung eindeutig.
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: Viele, die ihm zuhörten
  rationale: οἱ πολλοί bezeichnet hier eine große Zahl der Anwesenden; das Partizip wird als natürlicher deutscher Relativsatz wiedergegeben. »Zuhörten« passt zum fortlaufenden Lehren.
- source_word: ἐξεπλήσσοντο
  choice: waren außer sich vor Staunen
  rationale: Die Form bezeichnet eine starke und anhaltende Reaktion. Die Wendung wahrt die Intensität stärker als das schlichtere »staunten«.
- source_word: Πόθεν τούτῳ ταῦτα
  choice: Woher hat dieser Mann das alles?
  rationale: Πόθεν fragt nach dem Ursprung; »dieser Mann« bewahrt die demonstrative, im Kontext leicht distanzierende Färbung von τούτῳ. »Das alles« fasst das mehrdeutige ταῦτα natürlich zusammen.
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: Was ist das für eine Weisheit, die ihm gegeben wurde
  rationale: Die Formulierung bewahrt sowohl den fragenden Charakter als auch das passive »gegeben«, ohne den Geber zu bestimmen.
- source_word: αἱ δυνάμεις τοιαῦται
  choice: solche machtvollen Taten
  rationale: Der Plural δυνάμεις bezeichnet im markinischen Kontext außergewöhnliche Machterweise oder Wundertaten. »Machtvolle Taten« bewahrt den Bezug zur Kraft, ohne die Bedeutung vorschnell ausschließlich auf »Wunder« festzulegen.
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: die durch seine Hände geschehen
  rationale: Die Wiedergabe erhält sowohl das instrumentale διά als auch das konkrete Bild der Hände und den medial-passiven Vorgangscharakter von γινόμεναι.
theological_decisions:
- issue: Bedeutungsumfang von δυνάμεις
  choice: machtvolle Taten
  alternative: Wunder; Wundertaten; Machterweise
  rationale: Im Kontext sind außergewöhnliche Taten Jesu gemeint. Die gewählte Formulierung lässt den Bezug auf Wunder erkennen, bewahrt aber zugleich den Grundgedanken wirksamer Macht und vermeidet eine unnötige dogmatische Festlegung.
- issue: Nicht genannter Geber der Weisheit
  choice: die ihm gegeben wurde
  alternative: die Gott ihm gegeben hat
  rationale: Der griechische Passivsatz nennt den Geber nicht. Die Übersetzung ergänzt ihn daher nicht und bewahrt die offene Formulierung des Textes.
- issue: Ton von τούτῳ
  choice: dieser Mann
  alternative: ihm; dieser da
  rationale: »Dieser Mann« vermittelt die Distanz des Demonstrativpronomens, ohne eine stärkere Verachtung in den Text hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Fragefolge wurde für die deutsche Verständlichkeit leicht gegliedert; das wiederholte »was sind das für« macht den im Griechischen elliptisch angeschlossenen zweiten Gegenstand hörbar. Das Bild »durch seine Hände« bleibt bewusst erhalten.
