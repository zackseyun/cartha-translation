  source_fidelity: Die Übersetzung gibt die zeitliche Einleitung, den ingressiven Beginn des Lehrens, die anhaltende starke Reaktion der Hörenden und die Fragefolge des griechischen Textes zuverlässig wieder. »Durch seine Hände geschehen« bewahrt das konkrete instrumentale Bild von διὰ τῶν χειρῶν αὐτοῦ. Die ungenannte Herkunft der Weisheit bleibt wie im Passiv δοθεῖσα offen.
  naturalness: Modernes, gut verständliches und zugleich würdiges Standarddeutsch. »Außer sich vor Staunen« ist eine idiomatische, ausreichend starke Wiedergabe von ἐξεπλήσσοντο. Die explizite Wiederholung »Was ist/sind das für« macht die im Griechischen elliptisch gereihten Fragen im Deutschen flüssig.
