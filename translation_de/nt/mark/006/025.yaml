    rationale: Die beiden griechischen Ausdrücke sollen unterschieden bleiben, aber »sofort eilig« klingt im Deutschen holprig. »Sofort hastig« bewahrt Unmittelbarkeit und Eile.
  - severity: low
    issue: »Schale« für πίναξ
    rationale: Eine Schale kann ein tiefes Gefäß bezeichnen; πίναξ meint hier eher eine flache Servier- oder Präsentierplatte. »Auf einer Platte« ist präziser.
