review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Handlungsablauf, die zweifache zeitliche Dringlichkeit (εὐθύς und ἐξαυτῆς), die direkte Willensäußerung sowie den ungemilderten Inhalt der Forderung zuverlässig wieder. »König« entspricht dem narrativen βασιλέα, und »Johannes der Täufer« ist eine genaue, im Deutschen idiomatische Wiedergabe des Titels.
  naturalness: »Sofort eilig« wirkt im modernen Standarddeutsch jedoch als unnatürliche Adverbhäufung. »Sofort hastig« erhält beide Nuancen in einer geläufigeren Form. Für πίναξ ist »Platte« präziser als »Schale«, da ein flaches Serviergefäß bzw. eine Präsentierplatte gemeint ist.
  terminology: »Johannes der Täufer« ist sowohl terminologisch etabliert als auch als Übersetzung von ὁ βαπτιστής transparent. »Platte« gibt πίναξ im Bankettkontext sachgerecht wieder, ohne den Gegenstand zu modernistisch einzuengen.
