  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: de
  text: 'Da ging sie sofort hastig zum König hinein und bat ihn: »Ich will, dass du mir jetzt gleich auf einer Platte den Kopf von Johannes dem Täufer gibst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: ging … hinein
  rationale: Das Aoristpartizip bezeichnet ihre Bewegung hinein beziehungsweise vor den König; die deutsche Verbform gibt die fortschreitende Erzählung natürlich wieder.
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt die für Markus typische Unmittelbarkeit und bleibt von ἐξαυτῆς im späteren Wunsch unterschieden.
- source_word: μετὰ σπουδῆς
  choice: eilig
  rationale: Drückt das hastige, dringliche Handeln aus, ohne eine positive Begeisterung zu unterstellen.
- source_word: πρὸς τὸν βασιλέα
  choice: zum König
  rationale: Gibt βασιλεύς entsprechend der Erzählperspektive als »König« wieder, auch wenn Herodes Antipas historisch Tetrarch war.
- source_word: ᾐτήσατο
  choice: bat ihn
  rationale: Das Verb bezeichnet hier eine Bitte oder Forderung; »bat ihn« ist im Kontext natürlich, während die Entschiedenheit durch die direkte Rede zum Ausdruck kommt.
- source_word: Θέλω
  choice: Ich will
  rationale: Gibt die unverblümte Willensäußerung stärker und genauer wieder als das höflichere »Ich möchte«.
- source_word: ἵνα … δῷς μοι
  choice: dass du mir … gibst
  rationale: Die deutsche dass-Konstruktion gibt den Inhalt ihres Willens idiomatisch und genau wieder.
- source_word: ἐξαυτῆς
  choice: jetzt gleich
  rationale: Bezeichnet die verlangte unverzügliche Ausführung und hält dieses Adverb semantisch vom vorausgehenden εὐθύς getrennt.
- source_word: ἐπὶ πίνακι
  choice: auf einer Schale
  rationale: πίναξ bezeichnet hier ein flaches Serviergefäß; »Schale« ist im Bankettkontext verständlich und entspricht dem etablierten deutschen Ausdruck.
- source_word: τὴν κεφαλὴν
  choice: den Kopf
  rationale: Die konkrete und grausame Formulierung des Ausgangstextes wird ungemildert bewahrt.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Johannes dem Täufer
  rationale: »Täufer« gibt den beschreibenden Titel βαπτιστής im Deutschen direkt und zugleich in seiner geläufigen Form wieder.
theological_decisions:
- issue: Titel Ἰωάννου τοῦ βαπτιστοῦ
  choice: Johannes der Täufer
  alternative: Johannes der Taufende
  rationale: »Der Täufer« ist eine echte Übersetzung des beschreibenden griechischen Titels und im modernen Deutschen natürlich; eine künstliche substantivierte Partizipialform ist nicht nötig.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die doppelte Dringlichkeit des Verses bleibt durch »sofort eilig« für ihr Hineingehen und »jetzt gleich« für ihre Forderung erhalten. Die direkte Rede ist bewusst schroff formuliert.
