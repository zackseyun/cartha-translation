id: MRK.6.20
reference: Mark 6:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: de
  text: Denn Herodes fürchtete Johannes, weil er wusste, dass er ein gerechter und heiliger Mann war, und er beschützte ihn. Wenn er ihn hörte, war er sehr ratlos[a], und doch hörte er ihm gern zu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben: „tat er vieles“ statt: „war er sehr ratlos“.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: fürchtete
  rationale: Das Imperfekt bezeichnet eine anhaltende Haltung Herodes’ gegenüber Johannes. „Fürchtete“ bewahrt die direkte Bedeutung und lässt offen, in welchem Maß Ehrfurcht oder Respekt mitschwingt.
- source_word: εἰδὼς
  choice: weil er wusste
  rationale: Das Partizip hat hier naheliegend begründende Funktion. Die finite deutsche Formulierung macht den Zusammenhang natürlich und klar.
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: ein gerechter und heiliger Mann
  rationale: „Gerecht“ gibt die moralische Rechtschaffenheit von δίκαιος wieder; „heilig“ bewahrt die religiöse Aussage von ἅγιος, ohne sie abzuschwächen.
- source_word: συνετήρει αὐτόν
  choice: er beschützte ihn
  rationale: Im Kontext bezeichnet das Verb am ehesten, dass Herodes Johannes vor Schaden bewahrte. „Beschützte“ ist im heutigen Deutsch natürlicher und deutlicher als „bewahrte ihn“.
- source_word: ἀκούσας αὐτοῦ
  choice: wenn er ihn hörte
  rationale: Der Genitiv bei ἀκούω bezeichnet die gehörte Person. Die wiederholte Situation passt zum Imperfekt der folgenden Verben; „wenn“ gibt dies idiomatisch wieder.
- source_word: πολλὰ ἠπόρει
  choice: war er sehr ratlos
  rationale: ἠπόρει bezeichnet Ratlosigkeit oder Verlegenheit; πολλὰ verstärkt diese. „Sehr ratlos“ ist natürliches modernes Deutsch und wahrt Herodes’ innere Spannung.
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: doch hörte er ihm gern zu
  rationale: „Gern zuhören“ gibt ἡδέως und das Hören einer Person idiomatisch wieder. „Doch“ verdeutlicht den sachlichen Gegensatz zur Ratlosigkeit, ohne ihn aufzulösen.
theological_decisions:
- issue: Textvariante nach der Aussage über Herodes’ Hören auf Johannes
  choice: 'Dem SBLGNT folgen: „war er sehr ratlos“ (ἠπόρει)'
  alternative: „tat er vieles“ (ἐποίει)
  rationale: Die kritische Textausgabe liest ἠπόρει. Diese Lesart bewahrt die Spannung zwischen Herodes’ Ratlosigkeit und seinem bereitwilligen Zuhören. Da die Variante den Sinn erheblich verändert, wird sie in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur ist gut verständlich; „doch“ bringt den im Griechischen inhaltlich angelegten Gegensatz zur Geltung. Der Fußnotenmarker steht unmittelbar bei der von der Textvariante betroffenen Wendung.
