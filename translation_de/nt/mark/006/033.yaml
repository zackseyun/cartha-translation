  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: de
  text: Und viele sahen sie wegfahren und erkannten sie. Sie liefen zu Fuß aus allen Ortschaften dorthin zusammen und kamen vor ihnen an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον αὐτοὺς ὑπάγοντας
  choice: sahen sie wegfahren
  rationale: Der Kontext nennt die Fahrt im Boot (V. 32). „Wegfahren“ gibt die Bewegung hier natürlich wieder, ohne ein zusätzliches Ziel einzutragen.
- source_word: ἐπέγνωσαν
  choice: erkannten sie
  rationale: Im Zusammenhang bezeichnet das Verb das Wiedererkennen beziehungsweise Identifizieren der Reisenden.
- source_word: πολλοί
  choice: viele … die Leute
  rationale: Das substantivierte „viele“ wird im zweiten Satz durch „die Leute“ aufgenommen; das ergibt einen klaren, natürlichen deutschen Satzbau.
- source_word: πεζῇ
  choice: zu Fuß
  rationale: Die Wendung bezeichnet den Landweg zu Fuß und bewahrt den Kontrast zur Bootsfahrt.
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: aus allen Ortschaften
  rationale: πόλις kann je nach Größe Stadt oder Ort bezeichnen. „Ortschaften“ ist im galiläischen Kontext umfassend und vermeidet eine unnötige Festlegung auf größere Städte.
- source_word: συνέδραμον ἐκεῖ
  choice: liefen … dort zusammen
  rationale: Die Form drückt sowohl rasches Laufen als auch das Zusammenströmen aus; die deutsche Wendung bewahrt beide Aspekte.
- source_word: προῆλθον αὐτούς
  choice: kamen noch vor ihnen an
  rationale: Gemeint ist, dass die Menschen das Ziel früher als Jesus und die Jünger erreichten. „Noch“ unterstreicht idiomatisch die überraschende frühere Ankunft, ohne den Sinn zu verändern.
