revisions:
- from: Doch viele sahen sie wegfahren und erkannten sie. Aus allen Ortschaften liefen die Leute zu Fuß dort zusammen und kamen noch vor ihnen an.
  to: Und viele sahen sie wegfahren und erkannten sie. Sie liefen zu Fuß aus allen Ortschaften dorthin zusammen und kamen vor ihnen an.
  rationale: Die Revision ersetzt allein die nicht belegte adversative Nuance von „Doch“ durch das erzählerisch neutrale „Und“ und gestaltet die Rückbeziehung auf „viele“ unmittelbarer. Die Aussage, Bewegungsart und zeitliche Reihenfolge des griechischen Textes bleiben erhalten.
