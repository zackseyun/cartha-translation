  timestamp: '2026-07-14T20:40:08Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe des passiven Perfekts in »ist von den Toten auferweckt worden« ist quellentreu. Im Entwurf ist jedoch »sein Name« im Deutschen ohne ausdrücklichen Bezug auf Jesus missverständlich und wird nach dem unmittelbar vorausgehenden »König Herodes« naheliegend als dessen Name gelesen. Im griechischen Kontext bezieht sich αὐτοῦ auf Jesus. Außerdem gibt »die Kräfte« den bestimmten Artikel αἱ ohne nicht erforderliche demonstrative Zuspitzung besser wieder als »diese Kräfte«.
  naturalness: Der Ton ist modernes, verständliches Standarddeutsch. Die explizite Nennung Jesu beseitigt eine reale Referenzmehrdeutigkeit; »man sagte« ist für das unbestimmte griechische Plural-Subjekt idiomatisch. Die Satzverbindung mit Semikolon bewahrt den engen Zusammenhang der griechischen Erzählfolge.
  terminology: »König Herodes«, »Johannes der Täufer« und »von den Toten auferweckt« sind sachgerecht und etabliert. »Kräfte« wahrt die offene Bedeutung von δυνάμεις; die Fußnote bietet mögliche kontextuelle Konkretisierungen, ohne sie in den Haupttext einzutragen.
  issues:
  - severity: medium
    issue: Unklarer Bezug von »sein Name«
    rationale: Der griechische Kontext meint Jesu Namen, während das deutsche Possessivpronomen nach »König Herodes« gewöhnlich auf Herodes bezogen wird. Die Referenz muss im Deutschen ausdrücklich gemacht werden.
  - severity: low
    issue: »diese Kräfte« ist stärker demonstrativ als αἱ δυνάμεις
    rationale: Der griechische bestimmte Artikel verlangt hier kein Demonstrativpronomen. »die Kräfte« ist näher am Wortlaut und natürlicher.
