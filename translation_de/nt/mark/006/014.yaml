- from: 'Und König Herodes hörte davon, denn sein Name war bekannt geworden. Die Leute sagten: »Johannes der Täufer ist von den Toten auferweckt worden[a]; deshalb sind diese Kräfte[b] in ihm am Werk.«'
  to: 'Und König Herodes hörte davon; denn Jesu Name war bekannt geworden. Und man sagte: »Johannes der Täufer ist von den Toten auferweckt worden[a]; deshalb sind die Kräfte[b] in ihm am Werk.«'
  rationale: Die Revision klärt den im Deutschen sonst falsch naheliegenden Bezug von αὐτοῦ als Bezug auf Jesus und vermeidet beim Artikel αἱ eine zusätzliche demonstrative Nuance. Die passive Auferweckungsform, die unbestimmte Redeweise und die semantische Offenheit von δυνάμεις bleiben erhalten.
