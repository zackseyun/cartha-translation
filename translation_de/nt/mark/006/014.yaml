  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: de
  text: 'Und König Herodes hörte davon; denn Jesu Name war bekannt geworden. Und man sagte: »Johannes der Täufer ist von den Toten auferweckt worden[a]; deshalb sind die Kräfte[b] in ihm am Werk.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ist von den Toten auferstanden«. Das griechische Verb steht im Passiv: »ist auferweckt worden«.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »Wunderkräfte« beziehungsweise »Wundertaten«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: König Herodes
  rationale: Die im Deutschen natürliche Titelform gibt βασιλεύς direkt wieder.
- source_word: ἤκουσεν
  choice: hörte davon
  rationale: Das im Zusammenhang vorausgesetzte Objekt ist Jesu Wirken und Bekanntwerden; „davon“ macht dies idiomatisch deutlich, ohne neue Information einzuführen.
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: denn sein Name war bekannt geworden
  rationale: Die Formulierung bewahrt das griechische „Name“ und gibt φανερὸν ἐγένετο in natürlichem Deutsch als Bekanntwerden wieder.
- source_word: ἔλεγον
  choice: Die Leute sagten
  rationale: Das Verb im Plural hat ein unbestimmtes Subjekt; „die Leute“ gibt dieses idiomatisch wieder.
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: Johannes der Täufer
  rationale: „Der Täufer“ ist im Deutschen zugleich transparent vom Verb „taufen“ abgeleitet und die natürliche, allgemein verständliche Bezeichnung.
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: ist von den Toten auferweckt worden
  rationale: Das Perfekt Passiv wird ausdrücklich bewahrt; „von den Toten“ ist die etablierte idiomatische Entsprechung zu ἐκ νεκρῶν.
- source_word: διὰ τοῦτο
  choice: deshalb
  rationale: Die kausale Folgerung wird knapp und natürlich ausgedrückt.
- source_word: ἐνεργοῦσιν
  choice: sind ... am Werk
  rationale: Die Wendung bezeichnet fortdauernde Wirksamkeit und passt im Deutschen natürlich zum Subjekt „Kräfte“.
- source_word: αἱ δυνάμεις
  choice: diese Kräfte
  rationale: „Kräfte“ wahrt die Mehrzahl und lässt die mögliche Bedeutung zwischen wirksamen Kräften und Wundertaten offen; eine Fußnote nennt die idiomatische Alternative.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die direkte räumlich-instrumentale Formulierung des Griechischen bleibt erhalten, statt sie deutend in „durch ihn“ aufzulösen.
theological_decisions:
- issue: Wiedergabe von ἐγήγερται im Auferstehungskontext
  choice: ist von den Toten auferweckt worden
  alternative: ist von den Toten auferstanden
  rationale: Die gewählte Fassung erhält das im Griechischen eindeutige Passiv und vermeidet eine Verschiebung zur intransitiven Form.
- issue: Deutung von αἱ δυνάμεις
  choice: diese Kräfte
  alternative: diese Wunderkräfte / diese Wundertaten
  rationale: Die relativ offene Formulierung bewahrt die Spannung zwischen Kräften, die wirksam sind, und machtvollen Wunderwirkungen, ohne sich unnötig auf eine Deutung festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist klar abgesetzt; traditionelle kirchliche Verständlichkeit wird gewahrt, ohne die griechische Form und Mehrdeutigkeit einzuebnen.
