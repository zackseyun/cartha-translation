  text: καὶ ἀνέπεσαν πρασιαὶ πρασιαὶ ⸀κατὰ ἑκατὸν καὶ ⸁κατὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/040.yaml
  text: And they reclined in groups of hundreds and of fifties[a].
translation:
  language: de
  text: Und sie ließen sich in Gruppen zu je hundert und zu je fünfzig nieder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Beete, Beete“; das Bild lässt an geordnet angelegte Reihen oder Abschnitte denken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέπεσαν
  choice: ließen sich … nieder
  rationale: Das Verb bezeichnet hier das Einnehmen eines Platzes, typischerweise zum Essen. „Sich niederlassen“ bewahrt diesen Zusammenhang, klingt im heutigen Deutsch jedoch natürlicher als „sich zu Tisch legen“.
- source_word: πρασιαὶ πρασιαὶ
  choice: in Gruppen
  rationale: Das wiederholte Substantiv bezeichnet wörtlich Gartenbeete und beschreibt bildhaft die geordnete Anordnung der Menschen. Im Haupttext gibt „in Gruppen“ den gemeinten Sinn klar wieder; das Bild und die Wiederholung werden in der Fußnote festgehalten.
- source_word: κατὰ ἑκατὸν
  choice: zu je hundert
  rationale: κατά mit der Zahl hat hier verteilenden Sinn. „Zu je hundert“ bringt die Gruppengröße präzise und idiomatisch zum Ausdruck.
- source_word: κατὰ πεντήκοντα
  choice: zu je fünfzig
  rationale: Wie zuvor kennzeichnet κατά eine verteilende Anordnung. Die parallele Formulierung wahrt die Struktur des griechischen Satzes.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches und würdiges Standarddeutsch. Die Mahlzeitnuance von ἀναπίπτω wird durch „sich niederlassen“ angedeutet, ohne eine im Deutschen unnatürliche Liegehaltung ausdrücklich zu behaupten.
