  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: de
  text: Und als sie aus dem Boot ausgestiegen waren, erkannten ihn die Leute sofort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen ist das Subjekt von „erkannten“ nicht ausdrücklich genannt; die Form ist ein Partizip im Plural. Aus dem Zusammenhang, besonders dem folgenden Vers, ergibt sich, dass die Leute aus der Gegend Jesus erkannten.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: Als sie … gestiegen waren
  rationale: Der Genitivus absolutus wird als natürlicher deutscher Temporalsatz wiedergegeben. Das Plusquamperfekt macht deutlich, dass das Aussteigen der unmittelbar folgenden Reaktion vorausgeht.
- source_word: ἐκ τοῦ πλοίου
  choice: aus dem Boot
  rationale: πλοῖον bezeichnet hier ein kleineres Wasserfahrzeug auf dem See Gennesaret; „Boot“ ist im heutigen Deutsch die passende Bezeichnung.
- source_word: εὐθὺς
  choice: sofort
  rationale: „Sofort“ bewahrt die für Markus charakteristische Unmittelbarkeit und klingt zugleich natürlich.
- source_word: ἐπιγνόντες
  choice: erkannten
  rationale: ἐπιγινώσκω bezeichnet hier das Wiedererkennen beziehungsweise Identifizieren Jesu beim Anblick.
- source_word: αὐτόν
  choice: ihn
  rationale: Das Pronomen verweist im Erzählzusammenhang auf Jesus.
- source_word: implicit subject of ἐπιγνόντες
  choice: die Leute
  rationale: Das nominativische Partizip kann grammatisch nicht unmittelbar auf das genitivische αὐτῶν des Genitivus absolutus zurückbezogen werden. Der folgende Vers zeigt, dass Menschen aus der Gegend Jesus erkannten. „Die Leute“ macht dieses im Griechischen nur erschließbare Subjekt verständlich.
theological_decisions:
- issue: Wer Jesus erkannte
  choice: Die Leute aus der Gegend werden als Subjekt ausdrücklich genannt.
  alternative: 'Das Subjekt bleibt wie im Griechischen unausgesprochen: „Als sie aus dem Boot gestiegen waren, erkannte man ihn sofort.“'
  rationale: Die Entscheidung ist syntaktisch und kontextuell, nicht konfessionell. Das unpersönliche „man“ könnte die griechische Konstruktion zwar nachbilden, verschleiert aber, dass nach dem Zusammenhang die örtliche Bevölkerung handelt. „Die Leute“ gibt den naheliegenden Bezug wieder, ohne eine bestimmte Gruppe enger zu definieren.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Erzählregister. Die Wortstellung mit „sofort“ am Satzende ist im Deutschen flüssig und bewahrt den Nachdruck auf der unmittelbaren Wiedererkennung.
