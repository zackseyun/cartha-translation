id: MRK.6.46
reference: Mark 6:46
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: de
  text: Und nachdem er sich von ihnen verabschiedet hatte[a], ging er auf den Berg, um zu beten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von ihnen Abschied genommen hatte“.'
    reason: Lexikalische Alternative für ἀποταξάμενος; beide deutschen Wendungen geben das Abschiednehmen sachgerecht wieder.
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: nachdem er sich von ihnen verabschiedet hatte
  rationale: Das mediale Partizip bedeutet hier am natürlichsten, von jemandem Abschied zu nehmen bzw. sich zu verabschieden. Die Formulierung ist modernes, idiomatisches Deutsch und wahrt zugleich den Bezug des Dativs αὐτοῖς.
- source_word: αὐτοῖς
  choice: von ihnen
  rationale: Das Dativpronomen bezeichnet die zuvor erwähnten Menschen und wird im Deutschen idiomatisch in die Wendung „sich von ihnen verabschieden“ aufgenommen.
- source_word: ἀπῆλθεν
  choice: ging er
  rationale: Das Verb bezeichnet das Weggehen. Da die Trennung bereits durch „verabschiedet“ deutlich wird, gibt „ging er“ den Erzählfluss natürlich wieder, ohne mit „ging weg“ unnötig zu verdoppeln.
- source_word: εἰς τὸ ὄρος
  choice: auf den Berg
  rationale: Bei einer Bewegung zu einem Berg hin ist „auf den Berg“ im Deutschen die natürliche konkrete Wiedergabe. Der bestimmte Artikel des Griechischen bleibt erhalten, ohne dem Ort zusätzliche symbolische Bedeutung zuzuschreiben.
- source_word: προσεύξασθαι
  choice: um zu beten
  rationale: Der Infinitiv bezeichnet den Zweck seines Weggehens; die deutsche Konstruktion „um zu beten“ bringt diese Funktion klar und direkt zum Ausdruck.
- source_word: καὶ
  choice: Und
  rationale: Die einfache narrative Verknüpfung wird formal und natürlich mit „Und“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von „dem Berg“
  choice: Als konkreten Ort mit bestimmtem Artikel wiedergeben, ohne symbolische Deutung
  alternative: „auf einen Berg“ oder eine Deutung als besonderer Offenbarungsort
  rationale: Der griechische Text verwendet den bestimmten Artikel, erklärt aber keine symbolische oder theologische Bedeutung. Die Übersetzung bewahrt deshalb die konkrete Erzählangabe und fügt keine Deutung hinzu.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die vorzeitige Partizipialhandlung wird mit einem Nebensatz im Plusquamperfekt wiedergegeben; der Hauptsatz bleibt knapp und erzählerisch.
