  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ προσκαλεῖται τοὺς δώδεκα, καὶ ἤρξατο αὐτοὺς ἀποστέλλειν δύο δύο, καὶ ἐδίδου αὐτοῖς ἐξουσίαν τῶν πνευμάτων τῶν ἀκαθάρτων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: de
  text: Und er rief die Zwölf zu sich und begann, sie jeweils zu zweit[a] auszusenden; dabei gab er ihnen Vollmacht über die unreinen Geister.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »paarweise«.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »Macht über die unreinen Geister«.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεῖται
  choice: rief … zu sich
  rationale: Das historische Präsens wird für einen natürlichen deutschen Erzählfluss im Präteritum wiedergegeben; die mediale Form und die Präverb-Bedeutung werden mit »zu sich rufen« angemessen erfasst.
- source_word: τοὺς δώδεκα
  choice: die Zwölf
  rationale: Die substantivierte Zahl bezeichnet die fest umrissene Gruppe der Zwölf und wird daher als Titel großgeschrieben.
- source_word: ἤρξατο … ἀποστέλλειν
  choice: begann, sie … auszusenden
  rationale: Die Verbindung aus ἄρχομαι und Infinitiv wird formal und idiomatisch mit »begann … auszusenden« wiedergegeben, ohne die Bezeichnung »Apostel« einzutragen.
- source_word: δύο δύο
  choice: jeweils zu zweit
  rationale: Die distributive Wiederholung bedeutet, dass sie paarweise ausgesandt wurden; »jeweils zu zweit« bewahrt diese Verteilung in natürlichem Deutsch.
- source_word: ἐδίδου
  choice: dabei gab er ihnen
  rationale: Das Imperfekt bezeichnet den begleitenden beziehungsweise fortlaufenden Vorgang des Bevollmächtigens. »Dabei gab er« stellt den zeitlichen Zusammenhang idiomatisch dar.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: »Vollmacht« bezeichnet verliehene, wirksame Autorität und bildet den delegierten Charakter von ἐξουσία im Deutschen präziser ab als bloße »Macht«.
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: die unreinen Geister
  rationale: Die Formulierung bewahrt Markus’ Terminologie, ohne sie interpretierend durch »Dämonen« zu ersetzen.
theological_decisions:
- issue: Art der den Zwölf verliehenen ἐξουσία über die unreinen Geister
  choice: Vollmacht über die unreinen Geister
  alternative: Macht über die unreinen Geister
  rationale: »Vollmacht« hält fest, dass Jesus den Zwölf Autorität zum Handeln verleiht, statt lediglich eine unbestimmte Kraft zu übertragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präteritum glättet den markinischen Wechsel vom historischen Präsens zum Aorist, ohne den Handlungsablauf zu verändern. Das Semikolon mit »dabei« macht die begleitende imperfektive Handlung verständlich. Alle Fußnotenmarker stehen im Haupttext.
