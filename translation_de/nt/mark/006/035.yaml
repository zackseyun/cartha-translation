source:
  edition: SBLGNT
  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: de
  text: 'Als es schon sehr spät geworden war, kamen seine Jünger zu ihm und sagten: »Dieser Ort ist abgelegen[a], und es ist schon sehr spät.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dieser Ort ist menschenleer.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: schon
  rationale: Kennzeichnet in beiden Vorkommen das fortgeschrittene Tagesgeschehen und ist im Deutschen unmittelbar und natürlich.
- source_word: ὥρας πολλῆς γενομένης
  choice: als es schon sehr spät geworden war
  rationale: Der Genitivus absolutus bezeichnet das Eintreten einer späten Tageszeit; diese Formulierung gibt die Wendung idiomatisch wieder und bewahrt zugleich ihren aspektuellen Verlauf.
- source_word: προσελθόντες αὐτῷ
  choice: kamen seine Jünger zu ihm
  rationale: Gibt das Herantreten in natürlichem erzählendem Deutsch wieder.
- source_word: ἔλεγον
  choice: sagten
  rationale: Das deutsche Präteritum ist im Erzählzusammenhang natürlicher als eine Verlaufsform; der Imperfekt muss hier weder Wiederholung noch nachdrückliche Dauer bedeuten.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: Dieser Ort ist abgelegen
  rationale: ἔρημος beschreibt hier einen unbewohnten beziehungsweise einsamen Ort. »Abgelegen« passt zum Kontext, ohne Verlassenheit im emotionalen Sinn nahezulegen.
- source_word: καὶ ἤδη ὥρα πολλή
  choice: und es ist schon sehr spät
  rationale: Gibt die erneute Feststellung der fortgeschrittenen Tageszeit klar und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wörtlich schwerfällige Zeitangabe wurde idiomatisch wiedergegeben; die Wiederholung von »schon sehr spät« bleibt erhalten, weil sie im griechischen Text ausdrücklich vorkommt.
