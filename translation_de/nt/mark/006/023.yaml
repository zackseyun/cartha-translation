  source_fidelity: Die Übersetzung gibt ὤμοσεν, den Dativ αὐτῇ, die unbegrenzte Relativkonstruktion ὅ τι ἐάν, das Zukunftsversprechen sowie die Umfangsgrenze ἕως ἡμίσους τῆς βασιλείας μου sachgerecht wieder. „Königreich“ ist im höfisch-hyperbolischen Kontext eine angemessene Wiedergabe von βασιλεία.
  naturalness: „Was du mich auch bittest“ ist im modernen Standarddeutschen nicht idiomatisch, da bitten bei einer Sache gewöhnlich mit „worum“ beziehungsweise „um etwas“ konstruiert wird. Die revidierte Formulierung ist natürlich und wahrt die offene Weite der griechischen Aussage.
  terminology: „schwor“, „geben“ und „Königreich“ sind treffend und registergerecht. Die kulturelle Anmerkung ist angemessen; sie ist als Erklärung der Angebotsformel formuliert und erhebt keinen weitergehenden historischen Anspruch.
