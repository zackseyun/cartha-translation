  rationale: Die einzige nötige Änderung betrifft die deutsche Rektion von „bitten“. „Worum du mich auch bittest“ entspricht dem offenen Umfang von ὅ τι ἐάν με αἰτήσῃς; das erforderliche „es“ nimmt den im Deutschen mitverstandenen erbetenen Gegenstand auf. Aussagegehalt, Register, Hyperbel und Fußnoteninhalt bleiben erhalten.
