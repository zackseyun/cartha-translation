  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: de
  text: 'Und er schwor ihr: „Worum du mich auch bittest, ich werde es dir geben – bis zur Hälfte meines Königreichs.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bis zur Hälfte meines Königreichs“ ist eine herkömmliche, bewusst übertriebene königliche Angebotsformel.
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν αὐτῇ
  choice: er schwor ihr
  rationale: Das Verb bezeichnet das Ablegen eines Eides; der Dativ αὐτῇ gibt die Person an, der gegenüber der Eid ausgesprochen wird. Die Formulierung ist präzise und im modernen Deutschen natürlich.
- source_word: Ὅ τι ἐάν με αἰτήσῃς
  choice: Was du mich auch bittest
  rationale: Die Verbindung aus Relativausdruck, ἐάν und Konjunktiv bezeichnet eine unbestimmte, uneingeschränkte Möglichkeit. „Was … auch“ gibt diesen offenen Sinn idiomatisch wieder.
- source_word: δώσω σοι
  choice: werde ich dir geben
  rationale: Der Futur Indikativ bewahrt den ausdrücklichen Versprechenscharakter; σοι wird als indirektes Objekt mit „dir“ wiedergegeben.
- source_word: ἕως ἡμίσους
  choice: bis zur Hälfte
  rationale: ἕως bezeichnet hier eine Grenze des Umfangs, nicht der Zeit. „Bis zur Hälfte“ ist die geläufige deutsche Formulierung.
- source_word: τῆς βασιλείας μου
  choice: meines Königreichs
  rationale: βασιλεία kann Herrschaft, Königtum oder Reich bezeichnen. In der höfischen Angebotsformel liegt die konkrete Bedeutung „Königreich“ beziehungsweise „Reich“ nahe; „Königreich“ erhält zugleich den Wortlaut und die königliche Übertreibung.
theological_decisions:
- issue: Bedeutung von βασιλεία in der Rede des Herodes
  choice: Königreich
  alternative: Herrschaft; königliche Macht
  rationale: Der Zusammenhang beschreibt ein überschwängliches höfisches Versprechen und keine lehrhafte Aussage über Herrschaft. „Königreich“ bewahrt die konkrete Bildsprache, ohne dem Begriff hier eine technische theologische Bedeutung zu geben.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Gedankenstrich hebt die zugespitzte Reichweite des Schwurs hervor. Die offene Formulierung des griechischen Relativsatzes bleibt mit „Was … auch“ erhalten.
