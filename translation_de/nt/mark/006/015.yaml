source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: de
  text: 'Andere aber sagten: „Er ist Elia.“ Wieder andere sagten: „Er ist ein Prophet, wie einer der Propheten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder, weniger wahrscheinlich, könnte προφήτης als „der Prophet“ im Sinn einer bestimmten endzeitlichen Gestalt verstanden werden. Der Zusatz „wie einer der Propheten“ spricht hier jedoch eher für „ein Prophet“.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: Andere aber / Wieder andere
  rationale: ἄλλοι unterscheidet jeweils eine weitere Gruppe, während δέ einen milden Gegensatz beziehungsweise die Fortführung markiert. Die Variation ist im Deutschen natürlich und hält die Gruppen auseinander.
- source_word: ἔλεγον
  choice: sagten
  rationale: Der deutsche Kontext kann den durativen oder wiederholten Sinn des Imperfekts durch die parallelen Gruppenäußerungen vermitteln; „sagten“ klingt hier natürlicher als „waren am Sagen“.
- source_word: ὅτι Ἠλίας ἐστίν
  choice: „Er ist Elia.“
  rationale: Die direkte Rede gibt die griechische Aussage klar und idiomatisch wieder; Ἠλίας entspricht der etablierten deutschen Namensform „Elia“.
- source_word: προφήτης
  choice: ein Prophet
  rationale: Das artikellose Prädikatsnomen ist hier am ehesten unbestimmt zu verstehen, besonders wegen des folgenden Vergleichs mit einem der Propheten.
- source_word: ὡς εἷς τῶν προφητῶν
  choice: wie einer der Propheten
  rationale: ὡς drückt einen Vergleich aus; die Formulierung bewahrt sowohl den individuellen Vergleich als auch die Anknüpfung an die bekannte Gruppe der Propheten.
theological_decisions:
- issue: Ist προφήτης allgemein als „ein Prophet“ oder als endzeitlicher Titel „der Prophet“ zu verstehen?
  choice: ein Prophet
  alternative: der Prophet
  rationale: Der fehlende Artikel und die unmittelbar folgende Wendung „wie einer der Propheten“ sprechen stärker für eine allgemeine prophetische Einordnung. Die alternative titulare Deutung wird dennoch in der Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die zweimalige Redeformel und der Wechsel zwischen den Gruppen bleiben erhalten; unnötig schwerfällige Verlaufsformen werden vermieden.
