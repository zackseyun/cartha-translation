id: MRK.6.22
reference: Mark 6:22
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: de
  text: 'Als die Tochter der Herodias[a] hereinkam und tanzte, gefiel sie Herodes und denen, die mit ihm zu Tisch lagen[b]. Da sagte der König zu dem Mädchen: »Bitte mich um alles, was du willst, und ich werde es dir geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften und Überlieferungen werden im Sinn von »seine Tochter Herodias« verstanden. Der hier zugrunde gelegte griechische Text lautet »die Tochter der Herodias«.
    reason: textual_variant
  - marker: b
    text: 'Oder: »die mit ihm aßen«. Beim antiken Festmahl lag man gewöhnlich zu Tisch.'
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: als ... hereinkam
  rationale: Der temporale Genitivus absolutus wird natürlich mit »als« wiedergegeben; »hereinkam« bewahrt die Bewegung in den Festsaal.
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: die Tochter der Herodias
  rationale: Die Genitivkonstruktion bezeichnet nach dem zugrunde gelegten griechischen Text am natürlichsten Herodias als Mutter des Mädchens.
- source_word: ὀρχησαμένης
  choice: tanzte
  rationale: Die finite Form fügt sich flüssig in den deutschen Temporalsatz und gibt die Handlung ohne zusätzliche Wertung wieder.
- source_word: ἀρεσάσης
  choice: gefiel sie
  rationale: ἀρέσκω bedeutet hier »gefallen«; die Formulierung bleibt neutral und steigert die Wirkung nicht zu »entzücken«.
- source_word: τοῖς συνανακειμένοις
  choice: denen, die mit ihm zu Tisch lagen
  rationale: Die Wendung bewahrt das konkrete antike Bild der beim Festmahl liegenden Tischgenossen.
- source_word: εἶπεν ὁ βασιλεὺς
  choice: Da sagte der König
  rationale: »König« entspricht unmittelbar βασιλεύς; der Text wird nicht durch den historisch präziseren Titel »Tetrarch« korrigiert.
- source_word: τῷ κορασίῳ
  choice: zu dem Mädchen
  rationale: »Mädchen« ist die natürliche moderne Wiedergabe von κοράσιον und vermeidet das altertümliche »Maid«.
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: Bitte mich um was du willst
  rationale: Die offene Aufforderung wird in natürlichem Gegenwartsdeutsch wiedergegeben; »um was« nimmt idiomatisch das Erbetene auf.
- source_word: δώσω σοι
  choice: ich werde es dir geben
  rationale: Das Pronomen »es« greift den Inhalt der vorausgehenden offenen Bitte auf und ergibt einen vollständigen deutschen Satz.
theological_decisions:
- issue: Bezeichnung des Herodes Antipas als βασιλεύς
  choice: der König
  alternative: der Tetrarch; der Herrscher
  rationale: Die Übersetzung folgt Markus’ eigener Bezeichnung und ersetzt sie nicht durch einen historisch-technischen Titel.
- issue: Identität des Mädchens in der textkritisch schwierigen Genitivfolge
  choice: die Tochter der Herodias
  alternative: seine Tochter Herodias
  rationale: Der vorgelegte SBLGNT-Text wird in seiner am nächsten liegenden syntaktischen Deutung übersetzt; die abweichende Überlieferung beziehungsweise Deutung wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Tischhaltung bleibt im Haupttext erhalten und wird durch eine Kulturfußnote erläutert. Die textkritische Unsicherheit bei der Bezeichnung des Mädchens wird nicht stillschweigend beseitigt.
