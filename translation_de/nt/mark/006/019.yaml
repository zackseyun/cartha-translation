base_translation:
  language: en
  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: de
  text: Herodias aber hegte Groll gegen ihn[a] und wollte ihn töten, doch sie konnte es nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hegte einen tiefen Groll gegen ihn“ oder „trug ihm etwas nach“. Die griechische Wendung bezeichnet anhaltende feindselige Verbitterung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: aber
  rationale: Kennzeichnet hier im Zusammenhang einen Gegensatz beziehungsweise eine Weiterführung mit adversativer Färbung.
- source_word: Ἡρῳδιὰς
  choice: Herodias
  rationale: Der Personenname wird nach der etablierten deutschen Namensform wiedergegeben.
- source_word: ἐνεῖχεν αὐτῷ
  choice: hegte Groll gegen ihn
  rationale: Die Wendung bezeichnet anhaltende feindselige Verbitterung; das Imperfekt wird durch die durative Formulierung angemessen wiedergegeben.
- source_word: ἤθελεν
  choice: wollte
  rationale: Gibt den Wunsch beziehungsweise die Absicht direkt und idiomatisch wieder.
- source_word: αὐτὸν ἀποκτεῖναι
  choice: ihn töten
  rationale: Direkte Wiedergabe ohne die im griechischen Verb nicht ausdrücklich enthaltene rechtlich-moralische Wertung von „ermorden“.
- source_word: καὶ οὐκ ἠδύνατο
  choice: doch sie konnte es nicht
  rationale: Das formal verbindende καί hat hier nach dem Tötungswunsch adversative Wirkung; „doch“ macht diesen Gegensatz im Deutschen natürlich deutlich.
