  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Wo immer ihr in ein Haus kommt, bleibt dort, bis ihr von dort fortgeht.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: er sagte
  rationale: Der griechische Imperfekt kann den fortlaufenden Redevorgang markieren; im natürlichen deutschen Erzählstil wird er hier idiomatisch mit dem Präteritum wiedergegeben.
- source_word: Ὅπου ἐὰν
  choice: wo immer
  rationale: Die Verbindung bezeichnet einen unbestimmten Ort und wird im modernen Deutsch prägnant mit „wo immer“ wiedergegeben.
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: ihr in ein Haus kommt
  rationale: Die Formulierung bewahrt die Bewegung in das Haus hinein, klingt aber natürlicher als das formellere „in ein Haus eintretet“.
- source_word: οἰκίαν
  choice: ein Haus
  rationale: Im Zusammenhang ist vor allem die konkrete Unterkunft gemeint; „Haus“ wahrt zugleich die mögliche weitere Bedeutung des Haushalts.
- source_word: ἐκεῖ μένετε
  choice: dort bleibt
  rationale: „Bleiben“ entspricht μένω unmittelbar und ist als Anweisung klar und idiomatisch.
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: bis ihr von dort weggeht
  rationale: Die Wiedergabe folgt der räumlichen Formulierung des Griechischen und lässt offen, ob sich „dort“ enger auf das Haus oder weiter auf den jeweiligen Ort bezieht.
theological_decisions:
- issue: Bezug von ἐκεῖθεν in der abschließenden Weggangsklausel
  choice: Die räumliche Unbestimmtheit wird mit „von dort weggeht“ bewahrt.
  alternative: „bis ihr diesen Ort verlasst“, verstanden als Weggang aus der betreffenden Ortschaft
  rationale: Der Kontext legt nahe, dass die Jünger in derselben Unterkunft bleiben sollen, bis sie den Einsatzort verlassen. Der griechische Wortlaut benennt die Ortschaft jedoch nicht ausdrücklich; deshalb wird die mögliche Spannung zwischen Haus und Ort nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist klar und mündlich verständlich; „wo immer“ und „von dort weggeht“ vermeiden unnötig gehobene oder hölzerne Formulierungen.
