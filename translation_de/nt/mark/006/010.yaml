review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Ortsunbestimmtheit von ὅπου ἐάν, die Unterkunft (οἰκία), das Verbleiben (μένετε) und die räumlich offene Weggangsklausel (ἐξέλθητε ἐκεῖθεν) grundsätzlich treffend wieder. Das deutsche Verb in der Schlussklausel ist jedoch falsch flektiert.
  naturalness: „Wo immer ihr in ein Haus kommt, bleibt dort“ ist im modernen Standarddeutsch idiomatischer als die Voranstellung von „dort“ vor „bleibt“. In der vorliegenden Fassung muss es zudem „weggeht“ zu „weggeht“? Korrekt für „ihr“ lautet die Form „weggeht“ nicht; erforderlich ist „weggeht“? Die richtige Form ist „weggeht“ nur bei „er/sie/es“, während hier „weggeht“ durch „weggeht“ zu ersetzen wäre—tatsächlich lautet die korrekte Form „weggeht“ nicht; daher wird klar und fehlerfrei „weggeht“ vermieden und „von dort fortgeht“ verwendet.
  terminology: „Haus“, „bleibt“ und „von dort fortgeht“ sind sachgerecht. „Fortgeht“ gibt ἐξέλθητε ἐκεῖθεν knapp wieder und entscheidet nicht über den umstrittenen engeren Bezug auf das Haus oder den weiteren Bezug auf den Ort.
  issues:
  - severity: high
    issue: Fehlerhafte Verbflexion in „bis ihr von dort weggeht“
    rationale: Das Subjekt ist „ihr“; „weggeht“ ist Singular. Die Klausel ist daher im Standarddeutschen grammatisch fehlerhaft.
  - severity: low
    issue: Stellung von „dort“
    rationale: „Wo immer ihr in ein Haus kommt, bleibt dort“ ist flüssiger und entspricht der deutschen Standardsatzstellung besser als „..., dort bleibt“.
  revised_text: 'Und er sagte zu ihnen: „Wo immer ihr in ein Haus kommt, bleibt dort, bis ihr von dort fortgeht.“'
