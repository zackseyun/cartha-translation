- from: 'Und er sagte zu ihnen: „Wo immer ihr in ein Haus kommt, dort bleibt, bis ihr von dort weggeht.“'
  to: 'Und er sagte zu ihnen: „Wo immer ihr in ein Haus kommt, bleibt dort, bis ihr von dort fortgeht.“'
  rationale: Die zwingend erforderliche Korrektur der Verbform wurde vorgenommen. Zugleich wurde die Stellung von „dort“ geglättet. „Von dort fortgeht“ erhält die räumliche Offenheit des griechischen ἐκεῖθεν und vermeidet eine kontextuell zwar naheliegende, aber im Wortlaut nicht ausdrücklich benannte Einschränkung auf die Ortschaft.
