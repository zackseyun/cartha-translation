id: MRK.6.29
reference: Mark 6:29
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: de
  text: Als seine Jünger davon hörten, kamen sie, nahmen seinen Leichnam mit und legten ihn in ein Grab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: als ... davon hörten
  rationale: Das Aoristpartizip hat hier temporale Bedeutung. „Davon“ macht im Deutschen natürlich deutlich, dass die Jünger von der Hinrichtung hörten, ohne zusätzliche Sachinformation einzuführen.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ gibt μαθηταί präzise und im neutestamentlichen Zusammenhang geläufig wieder; das Pronomen bezieht sich im unmittelbaren Kontext auf Johannes den Täufer.
- source_word: ἦλθον
  choice: kamen sie
  rationale: Die schlichte Bewegungsangabe „kamen“ entspricht ἦλθον und bewahrt die Erzählfolge.
- source_word: ἦραν
  choice: holten
  rationale: αἴρω kann das Aufnehmen und Wegtragen bezeichnen. Im Bestattungszusammenhang fasst „holten“ diesen Vorgang natürlich zusammen, ohne das Ziel vorwegzunehmen.
- source_word: τὸ πτῶμα αὐτοῦ
  choice: seinen Leichnam
  rationale: πτῶμα bezeichnet ausdrücklich einen toten Körper. „Leichnam“ ist im Deutschen präzise, würdevoll und natürlich; eine abschwächende Wiedergabe mit „Körper“ ist daher nicht nötig.
- source_word: ἔθηκαν
  choice: legten
  rationale: „Legten“ ist im Bestattungskontext eine natürliche und würdevolle Entsprechung zu τίθημι.
- source_word: ἐν μνημείῳ
  choice: in ein Grab
  rationale: μνημεῖον bezeichnet hier eine Begräbnisstätte. „Grab“ ist die natürliche allgemeine deutsche Wiedergabe und legt die bauliche Form nicht genauer fest, als der griechische Ausdruck es verlangt.
theological_decisions:
- issue: Bezug von „seine Jünger“
  choice: die Jünger Johannes des Täufers
  alternative: die Jünger Jesu
  rationale: Der unmittelbare Zusammenhang erzählt von der Hinrichtung Johannes des Täufers; daher bezieht sich αὐτοῦ auf Johannes. Der deutsche Text belässt den pronominalen Ausdruck und vermeidet eine erklärende Einfügung.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Der Satz folgt der knappen Erzählbewegung des Griechischen. „Leichnam“ bewahrt die ausdrückliche Bedeutung von πτῶμα; „Grab“ vermeidet eine unnötige Festlegung auf eine bestimmte Grabarchitektur.
