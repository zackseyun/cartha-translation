  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: de
  text: Und er stieg zu ihnen ins Boot, und der Wind legte sich. Und sie waren völlig außer sich vor Staunen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verstärkt ihr Erstaunen ungewöhnlich stark: wörtlich etwa „sie waren über die Maßen erstaunt“. Die Wendung kann zudem „in/bei sich selbst“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: er stieg zu ihnen ins Boot
  rationale: ἀναβαίνω bezeichnet hier im Zusammenhang mit εἰς das Einsteigen. „Zu ihnen ins Boot“ gibt sowohl die Bewegung als auch πρὸς αὐτούς natürlich wieder.
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: der Wind legte sich
  rationale: κοπάζω bezeichnet das Nachlassen oder Aufhören des Windes; „legte sich“ ist im Deutschen idiomatisch und lässt offen, ob ein allmähliches Abflauen gemeint ist.
- source_word: λίαν ἐκ περισσοῦ
  choice: vor Staunen
  rationale: Die ungewöhnliche Häufung verstärkender Ausdrücke wird zusammen mit „gerieten außer sich“ als überwältigendes Staunen wiedergegeben; ihre wörtlichere Intensität wird in der Fußnote kenntlich gemacht.
- source_word: ἐν ἑαυτοῖς
  choice: in ihrer inneren Reaktion mitgedacht
  rationale: Die Wendung bezeichnet ihre eigene, innere Reaktion. Eine ausdrückliche Wiedergabe als „bei sich selbst“ wäre im Deutschen neben „außer sich“ missverständlich und stilistisch widersprüchlich.
- source_word: ἐξίσταντο
  choice: gerieten sie außer sich vor Staunen
  rationale: Das Imperfekt von ἐξίστημι beschreibt hier starkes Erstaunen bis hin zum Außer-sich-Geraten. Die Formulierung bewahrt die ungewöhnliche Intensität stärker als bloßes „sie staunten“.
theological_decisions:
- issue: Stärke der Reaktion der Jünger
  choice: „gerieten sie außer sich vor Staunen“
  alternative: „waren sie über die Maßen erstaunt“
  rationale: Der Text schildert eine überwältigende Reaktion auf Jesu Handeln, ohne deren theologische Bedeutung in diesem Vers weiter auszudeuten. Die gewählte Fassung erhält die starke Bedeutung von ἐξίσταντο und die Intensivierung.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Ins Boot steigen“ und „der Wind legte sich“ sind natürliches Standarddeutsch; die Fußnote bewahrt die ungewöhnliche griechische Intensivierung und die innere Dimension der Reaktion.
