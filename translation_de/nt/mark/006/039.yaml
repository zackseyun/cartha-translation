base_translation:
  language: en
  yaml_path: translation/nt/mark/006/039.yaml
  text: And he commanded them all to recline in groups on the green grass[a][b].
translation:
  language: de
  text: Und er befahl ihnen, alle in Gruppen auf dem grünen Gras lagern zu lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gruppe für Gruppe“; wörtlich etwa: „Mahlgruppen, Mahlgruppen“. Die Wiederholung des griechischen Ausdrucks hebt die geordnete Aufteilung in einzelne Gruppen hervor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: befahl
  rationale: Das Verb bezeichnet eine verbindliche, autoritative Anweisung; „befahl“ bewahrt diese Stärke.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das Dativpronomen bezeichnet im Kontext die Jünger als Empfänger des Befehls, ohne sie im Text ausdrücklich zu benennen.
- source_word: ἀνακλῖναι
  choice: lagern zu lassen
  rationale: Der Aoristinfinitiv bezeichnet hier das Sich-Niederlegen beziehungsweise Lagern zum Essen. Die Konstruktion mit „lassen“ macht deutlich, dass die Angesprochenen alle anderen entsprechend anordnen sollen.
- source_word: πάντας
  choice: alle
  rationale: Der Akkusativ bezeichnet sämtliche Menschen der Menge als logisches Subjekt des Infinitivs und wird so von „ihnen“, den Empfängern des Befehls, unterschieden.
- source_word: συμπόσια συμπόσια
  choice: in Gruppen
  rationale: Die Wiederholung hat distributiven Sinn und beschreibt voneinander abgegrenzte Tisch- oder Essgruppen; „in Gruppen“ ist im modernen Deutsch klar und natürlich.
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: auf dem grünen Gras
  rationale: Die Wendung wird direkt und idiomatisch wiedergegeben; χλωρός bezeichnet hier die grüne beziehungsweise frische Beschaffenheit des Grases.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Lagern“ bewahrt den antiken Mahlzeitkontext besser als „sich setzen“, während „lagern zu lassen“ zugleich die klare griechische Unterscheidung zwischen den Empfängern des Befehls (αὐτοῖς) und allen, die sich lagern sollen (πάντας), wiedergibt.
