  text: ⸀καὶ ἐξελθοῦσα εἶπεν τῇ μητρὶ αὐτῆς· Τί ⸀αἰτήσωμαι; ἡ δὲ εἶπεν· Τὴν κεφαλὴν Ἰωάννου τοῦ ⸀βαπτίζοντος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: de
  text: 'Sie ging hinaus und sagte zu ihrer Mutter: »Worum soll ich bitten?« Ihre Mutter sagte: »Um den Kopf von Johannes dem Täufer.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Sie ging hinaus und sagte
  rationale: Das vorangestellte Aoristpartizip bezeichnet eine Handlung, die dem Fragen vorausgeht. Die deutsche Beiordnung gibt diese Abfolge natürlich und knapp wieder.
- source_word: Τί αἰτήσωμαι
  choice: Worum soll ich bitten?
  rationale: Der deliberative Aorist Konjunktiv fragt nach dem zu erbittenden Gegenstand. „Worum soll ich bitten?“ ist idiomatisches Deutsch und bewahrt den abwägenden Sinn.
- source_word: μητρὶ αὐτῆς
  choice: zu ihrer Mutter
  rationale: Direkte und natürliche Wiedergabe der Dativ- und Possessivkonstruktion.
- source_word: Τὴν κεφαλήν
  choice: Um den Kopf
  rationale: Die Antwort ergänzt sinngemäß das in der Frage verwendete „bitten“. Die drastische Konkretheit von κεφαλή wird ohne Abschwächung bewahrt.
- source_word: Ἰωάννου τοῦ βαπτίζοντος
  choice: von Johannes dem Täufer
  rationale: Das substantivierte Partizip bezeichnet Johannes durch seine charakteristische Tätigkeit. „Johannes der Täufer“ ist im Deutschen die geläufige, semantisch transparente Bezeichnung und erzeugt keine notwendige konfessionelle Zuordnung.
theological_decisions:
- issue: Wiedergabe des Beinamens βαπτίζων
  choice: Johannes dem Täufer
  alternative: Johannes, dem Taufenden
  rationale: „Täufer“ gibt die Tätigkeit des Partizips in natürlichem Deutsch wieder. Die wörtlichere Form „der Taufende“ wäre schwerfällig und könnte hier fälschlich wie eine gerade stattfindende Handlung wirken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; die Härte der verlangten Enthauptung wird nicht euphemistisch abgeschwächt.
