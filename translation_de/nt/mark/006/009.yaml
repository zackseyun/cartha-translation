  text: ἀλλὰ ὑποδεδεμένους σανδάλια, καὶ μὴ ⸀ἐνδύσησθε δύο χιτῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/009.yaml
  text: but wear sandals[a], and do not put on two tunics.
translation:
  language: de
  text: Aber tragt Sandalen und zieht nicht zwei Untergewänder an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: sondern
  rationale: Setzt die Anweisung kontrastierend von den vorherigen Reisevorschriften ab und klingt nach einer verneinten beziehungsweise einschränkenden Vorgabe im Deutschen natürlich.
- source_word: ὑποδεδεμένους
  choice: Sandalen an den Füßen tragen
  rationale: Das Perfektpartizip von ὑποδέομαι bezeichnet den Zustand, beschuht zu sein; die Formulierung gibt diesen Sinn in natürlichem modernem Deutsch wieder.
- source_word: σανδάλια
  choice: Sandalen
  rationale: Direkte und allgemein verständliche Wiedergabe der antiken Fußbekleidung.
- source_word: μὴ ἐνδύσησθε
  choice: nicht … anziehen
  rationale: Der Aorist Konjunktiv Medium mit μή formuliert ein Verbot; »anziehen« bewahrt den Handlungsaspekt des Sichkleidens.
- source_word: δύο
  choice: zwei
  rationale: Direkte Wiedergabe des Zahlworts.
- source_word: χιτῶνας
  choice: Untergewänder
  rationale: Ein χιτών war ein unmittelbar am Körper getragenes Grundgewand. »Untergewand« ist präziser als »Kleidungsstück« und im Deutschen weniger irreführend als das moderne »Hemd«.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die koordinierte Satzform bleibt erhalten; die Ergänzung »an den Füßen« macht das imperativisch gebrauchte Partizip idiomatisch, ohne den sachlichen Gehalt zu erweitern.
