  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: de
  text: Der König wurde tief betrübt. Wegen seiner Eide und der Tischgäste[a] wollte er sie jedoch nicht abweisen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „derer, die zu Tisch lagen“. Bei festlichen Mahlzeiten lag man damals üblicherweise zu Tisch.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zurückweisen“ beziehungsweise „ihr gegenüber sein Wort brechen“. Gemeint ist, dass er ihre Forderung nicht ablehnen wollte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίλυπος γενόμενος
  choice: wurde tief betrübt
  rationale: Die Formulierung gibt sowohl den Eintritt des Zustands durch γενόμενος als auch die starke Betrübnis von περίλυπος in natürlichem modernem Deutsch wieder.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Entspricht der erzählerischen Bezeichnung des Herodes im griechischen Text, auch wenn sein amtlicher Titel genauer Tetrarch war.
- source_word: διὰ τοὺς ὅρκους
  choice: wegen seiner Eide
  rationale: διά mit Akkusativ bezeichnet hier den Grund. Das Possessivpronomen ist aus dem Kontext eindeutig und im Deutschen idiomatisch.
- source_word: τοὺς ἀνακειμένους
  choice: die Gäste, die mit ihm zu Tisch lagen
  rationale: Die Wiedergabe bewahrt die im griechischen Verb bezeichnete damalige liegende Haltung beim Mahl und macht zugleich verständlich, dass die anwesenden Tischgäste gemeint sind.
- source_word: οὐκ ἠθέλησεν
  choice: wollte er nicht
  rationale: 'Bewahrt den volitionalen Sinn: Es geht um fehlende Bereitschaft, nicht um fehlende Fähigkeit.'
- source_word: ἀθετῆσαι αὐτήν
  choice: sie abweisen
  rationale: Im Kontext bedeutet das Verb, ihre Forderung zurückzuweisen beziehungsweise das ihr gegebene Versprechen nicht einzulösen. „Abweisen“ ist prägnant und natürlich.
theological_decisions:
- issue: Verhältnis zwischen der Betrübnis des Königs und seiner anschließenden Entscheidung
  choice: Zwei Sätze mit „Doch“
  alternative: Eine eng am griechischen Satzbau bleibende Partizipialkonstruktion ohne ausdrücklich markierten Gegensatz
  rationale: Das griechische Partizip lässt den genauen logischen Bezug offen, doch der Kontext enthält einen deutlichen Gegensatz zwischen tiefer Betrübnis und Weigerung, das Mädchen abzuweisen. „Doch“ macht diesen erzählerischen Kontrast verständlich, ohne einen besonderen theologischen Beweggrund hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung vermeidet eine schwerfällige Verschachtelung; die konkrete antike Tischhaltung bleibt im Haupttext sichtbar.
