  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: de
  text: Denn sie hatten das mit den Broten nicht verstanden,[a] sondern ihr Herz war verhärtet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie hatten die Bedeutung der Brote nicht erfasst.“'
