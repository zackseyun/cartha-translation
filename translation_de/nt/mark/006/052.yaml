  - marker: b
    text: 'Oder: „ihr Herz war abgestumpft“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: hatten … nicht verstanden
  rationale: Das Plusquamperfekt gibt im Deutschen natürlich wieder, dass ihr fehlendes Verstehen der Brote den Hintergrund der vorausgehenden Reaktion bildet; „verstehen“ wahrt die kognitive und geistliche Dimension.
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: bei den Broten
  rationale: „Bei den Broten“ bleibt nahe an der idiomatisch offenen Präpositionalfügung und verweist im Kontext auf das Geschehen und die Bedeutung der Speisung, ohne diese im Haupttext auszudeuten.
- source_word: ἄρτοις
  choice: Broten
  rationale: Der Plural bezeichnet die konkreten Brote der Speisung und wird daher gegenüber dem allgemeineren Singular „Brot“ bewahrt.
- source_word: αὐτῶν ἡ καρδία
  choice: ihr Herz
  rationale: Der kollektive Singular des Griechischen wird beibehalten. „Herz“ bezeichnet hier das innere Wahrnehmungs- und Erkenntnisvermögen der Jünger.
- source_word: πεπωρωμένη
  choice: verhärtet
  rationale: „Verhärtet“ gibt die Metapher geistlicher Unempfindlichkeit idiomatisch und traditionsübergreifend wieder, ohne deren Ursache näher festzulegen.
- source_word: ἀλλ’ ἦν
  choice: sondern … war
  rationale: „Sondern“ bringt den starken Gegensatz zur vorausgehenden Verneinung im Deutschen prägnant zum Ausdruck; „war“ bewahrt die zuständliche Aussage.
theological_decisions:
- issue: Art und Ursache der Verhärtung
  choice: ihr Herz war verhärtet
  alternative: ihr Herz war abgestumpft
  rationale: Die passive Zustandsbeschreibung bleibt erhalten, ohne festzulegen, wer oder was die Verhärtung verursacht hat. Damit wird die theologische Spannung des Textes nicht aufgelöst.
- issue: Bedeutung der Brote
  choice: bei den Broten nicht verstanden
  alternative: die Bedeutung der Brote nicht erfasst
  rationale: Der Haupttext belässt die Beziehung zu den Broten in ihrer knappen Form. Die mögliche Bedeutung, dass die Jünger die Tragweite des Speisungswunders nicht begriffen, wird als Erläuterung in der Fußnote angeboten statt in den Text hineingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der kollektive Singular „ihr Herz“ und der konkrete Plural „Brote“ folgen bewusst dem griechischen Ausdruck; die Fußnoten erläutern dessen semantische Spannweite.
