source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: de
  text: Ist das nicht der Zimmermann, der Sohn Marias und der Bruder von Jakobus, Joses, Judas und Simon?[a] Sind nicht auch seine Schwestern hier bei uns? Und sie nahmen Anstoß an ihm.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Bruder“ und „Schwestern“ sind die gewöhnlichen Bedeutungen der griechischen Wörter. Manche christlichen Traditionen verstehen sie hier jedoch weiter als Verwandte oder als Stiefgeschwister.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „Und sie kamen durch ihn zu Fall“ oder „sie ärgerten sich über ihn“; das griechische Verb kann bildlich ein Sich-Ärgern, Anstoßnehmen oder Zu-Fall-Kommen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: Zimmermann
  rationale: Der Begriff bezeichnet einen Handwerker und kann auch weiter gefasst „Bauhandwerker“ bedeuten. „Zimmermann“ ist die geläufige, traditionsnahe Wiedergabe und passt zur dörflichen Erkennungsszene.
- source_word: υἱὸς τῆς Μαρίας
  choice: der Sohn Marias
  rationale: Die auffällige Bezeichnung über die Mutter wird direkt bewahrt, ohne ihre mögliche soziale Nebenbedeutung auszudeuten.
- source_word: ἀδελφὸς / ἀδελφαί
  choice: Bruder / Schwestern
  rationale: Dies sind die gewöhnlichen Bedeutungen der griechischen Verwandtschaftsbegriffe. Die umstrittene genaue verwandtschaftliche Beziehung wird nicht im Haupttext entschieden.
- source_word: Ἰωσῆτος
  choice: Joses
  rationale: Die im griechischen Text stehende Namensform wird als „Joses“ wiedergegeben und nicht zu „Josef“ vereinheitlicht.
- source_word: ὧδε πρὸς ἡμᾶς
  choice: hier bei uns
  rationale: Die Wendung bezeichnet die örtliche und soziale Nähe zu den Sprechenden; „hier bei uns“ ist im Deutschen natürlich.
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: sie nahmen Anstoß an ihm
  rationale: Die Wendung bezeichnet hier keine wörtliche Stolperbewegung, sondern eine ablehnende Reaktion auf Jesus. „Anstoß nehmen an“ bewahrt zugleich das Bild und den Sinn.
theological_decisions:
- issue: Verwandtschaftsverhältnis der Brüder und Schwestern Jesu
  choice: Die gewöhnlichen Bezeichnungen „Bruder“ und „Schwestern“ bleiben im Haupttext stehen.
  alternative: Nahe Verwandte oder Stiefgeschwister
  rationale: Der griechische Wortlaut legt die gewöhnlichen Verwandtschaftsbezeichnungen nahe, entscheidet aber die in christlichen Traditionen unterschiedlich verstandene genaue Beziehung nicht ausdrücklich.
- issue: Soziale Bedeutung von „Sohn Marias“
  choice: Die mütterliche Identifizierung wird ohne erklärenden Zusatz direkt übersetzt.
  alternative: Die Formulierung ausdrücklich als neutral oder herabsetzend kennzeichnen
  rationale: Ein abwertender Unterton ist im Kontext möglich, wird vom Text jedoch nicht ausdrücklich erklärt.
- issue: Reaktion auf Jesus
  choice: „sie nahmen Anstoß an ihm“
  alternative: „sie kamen durch ihn zu Fall“ oder „sie ärgerten sich über ihn“
  rationale: Die gewählte Formulierung erhält die metaphorische Spannung des Verbs und gibt zugleich die ablehnende Reaktion verständlich wieder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Fragen behalten den mündlichen Ton der Einwohner bei. „leben“ ergänzt idiomatisch die im Griechischen mit εἰσίν ausgedrückte örtliche Anwesenheit; „hier bei uns“ bewahrt die soziale Nähe.
