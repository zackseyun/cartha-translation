  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: de
  text: Als Jesus aus dem Boot stieg, sah er eine große Menschenmenge. Er hatte tiefes Mitgefühl mit ihnen, denn sie waren wie Schafe, die keinen Hirten haben.[a] Und er begann, sie vieles zu lehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild von den »Schafen ohne Hirten« erinnert an biblische Aussagen über Menschen ohne Führung; vergleiche 4. Mose 27,17; 1. Könige 22,17; Hesekiel 34,5.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: als Jesus aus dem Boot stieg
  rationale: Wörtlich »als er hinausging«. Der unmittelbare Kontext der Bootsfahrt (Mk 6,32–33) macht das Aussteigen aus dem Boot zur wahrscheinlichsten situativen Bedeutung. Das ausdrückliche »Jesus« stellt im Deutschen den Bezug des Partizips klar.
- source_word: πολὺν ὄχλον
  choice: eine große Menschenmenge
  rationale: Gibt sowohl ὄχλος als auch die Größenangabe πολύν in natürlichem, modernem Deutsch wieder.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: er hatte tiefes Mitgefühl mit ihnen
  rationale: Das Verb bezeichnet ein innerlich starkes Erbarmen. »Tiefes Mitgefühl« ist verständlich und bewahrt die Intensität, ohne eine körperliche Metapher künstlich nachzubilden.
- source_word: ὅτι
  choice: denn
  rationale: Leitet den Grund für Jesu Mitgefühl ein. »Denn« verbindet die Sätze in würdigem, natürlichem Deutsch; »weil« wäre ebenfalls möglich.
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: wie Schafe ohne Hirten
  rationale: Bewahrt das biblische Hirtenbild knapp und unverdeutlicht. Der generische Singular ποιμένα wird idiomatisch mit »Hirten« wiedergegeben.
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: er begann, sie vieles zu lehren
  rationale: Bewahrt die ingressivische Wendung »begann zu lehren« und gibt πολλά als umfangreichen Inhalt der Lehre wieder, ohne es zu »lange« umzudeuten.
theological_decisions:
- issue: Hirtenbild für ein führungsloses Volk
  choice: Das Bild »wie Schafe ohne Hirten« bleibt im Haupttext unverändert stehen.
  alternative: Interpretierende Erweiterung wie »ohne geistliche Führung«.
  rationale: Die Formulierung greift wahrscheinlich alttestamentliche Sprache über Gottes Volk und seine Leitung auf. Der Text selbst deutet das Bild hier jedoch nicht ausdrücklich aus; daher wird seine theologische Spannung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze sorgen für gute Verständlichkeit; das traditionelle Hirtenbild bleibt erhalten. Der im englischen Material bei Fußnote a angegebene Alternativtext gehört sachlich zu ἐσπλαγχνίσθη, während dessen Marker nach »ashore« offenbar fehlerhaft platziert ist; deshalb wurde daraus keine deutsche Fußnote übernommen.
