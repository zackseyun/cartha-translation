  source_fidelity: Die Übersetzung gibt den situativ im Bootskontext verständlichen Sinn von ἐξελθών („aus dem Boot stieg“), die große Menge, Jesu tiefes Erbarmen, die Begründung und den Beginn seines ausgedehnten Lehrens zuverlässig wieder. Für μὴ ἔχοντα ποιμένα ist die explizite Wiedergabe „die keinen Hirten haben“ näher am griechischen Singular und erhält die Satzstruktur der Vorlage.
  naturalness: Der Text ist flüssiges, modernes und zugleich würdiges Standarddeutsch. „Sie vieles zu lehren“ ist idiomatisch und gibt πολλά angemessen wieder.
