  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: de
  text: Und als er sah, wie sie sich beim Rudern abmühten, denn der Wind stand ihnen entgegen, kommt er um die vierte Nachtwache[a] zu ihnen, auf dem See gehend[b]. Und er wollte an ihnen vorübergehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vierte Nachtwache war nach römischer Zeiteinteilung ungefähr die Zeit zwischen 3 und 6 Uhr morgens.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „auf dem Meer gehend“. Das griechische Wort kann hier den See Gennesaret bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: „An ihnen vorübergehen“ kann schlicht bedeuten, dass er an ihnen vorbeigehen wollte. Die Wendung kann aber auch an alttestamentliche Berichte erinnern, in denen Gott vorübergeht und sich offenbart (zum Beispiel 2. Mose 33,19.22; 34,6; 1. Könige 19,11).
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: als er sah
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben, ohne eine weitergehende zeitliche Abfolge festzulegen.
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: wie sie sich beim Rudern abmühten
  rationale: βασανίζω bezeichnet hier schwere Bedrängnis oder Qual; im Zusammenhang mit dem Rudern gibt „sich abmühen“ die große Anstrengung idiomatisch wieder, ohne das Bild einer äußeren Folter einzutragen.
- source_word: ἐναντίος αὐτοῖς
  choice: stand ihnen entgegen
  rationale: Diese geläufige Wendung beschreibt einen Gegenwind präzise und bewahrt die adversative Kraft.
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: um die vierte Nachtwache
  rationale: Die antike Zeitangabe bleibt im Haupttext erhalten; „um“ gibt περὶ wieder. Eine Fußnote erläutert den Zeitraum.
- source_word: ἔρχεται
  choice: kommt er
  rationale: Das historische Präsens wird bewahrt, um den lebendigen Erzählstil des Markus wiederzugeben.
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: auf dem See gehend
  rationale: „See“ entspricht θάλασσα im galiläischen Kontext und bewahrt die konkrete Quellenformulierung; die partizipiale Form erhält den griechischen Erzählfluss.
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: er wollte an ihnen vorübergehen
  rationale: Die Formulierung bleibt bewusst offen zwischen einem schlichten Vorübergehen und einem möglichen Anklang an alttestamentliche Gotteserscheinungen.
theological_decisions:
- issue: Bedeutung von „er wollte an ihnen vorübergehen“
  choice: Die wörtlich offene Formulierung bleibt im Haupttext erhalten.
  alternative: '„Er wollte an ihnen vorbeigehen“ oder ausdrücklich: „Er wollte sich ihnen in göttlicher Herrlichkeit zeigen.“'
  rationale: Der griechische Text erklärt die Absicht nicht. Die gewählte Fassung wahrt sowohl den einfachen räumlichen Sinn als auch den möglichen Anklang an alttestamentliche Szenen, in denen Gott vorübergeht und sich offenbart.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historische Präsenswechsel des griechischen Textes wird bewusst beibehalten. Die antike Zeitangabe bleibt im Haupttext stehen und wird in einer Fußnote erklärt.
