revisions:
- from: Und er wunderte sich über ihren Unglauben.[a] Dann zog er durch die Dörfer ringsum und lehrte.[b]
  to: Und er wunderte sich über ihren Unglauben.[a] Und er zog durch die Dörfer ringsum und lehrte.[b]
  rationale: Die Revision entfernt lediglich die durch „Dann“ eingeführte, im griechischen Text nicht ausdrücklich bezeichnete zeitliche Zuspitzung. Die räumliche Mehrdeutigkeit von κύκλῳ bleibt mit „ringsum“ im Text und der Alternative „im Umkreis von Dorf zu Dorf“ in der Fußnote erhalten. Die Gleichzeitigkeit des Lehrens wird im Deutschen idiomatisch durch die koordinierte Verbform wiedergegeben.
