  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: de
  text: Und er wunderte sich über ihren Unglauben.[a] Und er zog durch die Dörfer ringsum und lehrte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er war wegen ihres Unglaubens erstaunt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: Er zog lehrend im Umkreis von Dorf zu Dorf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: wunderte sich
  rationale: Das Imperfekt beschreibt Jesu Reaktion in der damaligen Situation; „wunderte sich“ gibt θαυμάζω natürlich und ohne abschwächende Erklärung wieder.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: über ihren Unglauben
  rationale: διά mit Akkusativ bezeichnet hier den Grund. Die im Deutschen idiomatische Verbindung „sich über etwas wundern“ bewahrt diesen kausalen Sinn; „Unglaube“ gibt ἀπιστία als Nichtglauben beziehungsweise Weigerung zu glauben wieder.
- source_word: περιῆγεν
  choice: zog … durch
  rationale: Das Imperfekt bezeichnet fortgesetzte Bewegung von Ort zu Ort. „zog durch“ ist im Zusammenhang eines umherziehenden Lehrers natürlich und würdevoll.
- source_word: τὰς κώμας
  choice: die Dörfer
  rationale: κώμη bezeichnet ein Dorf oder eine ländliche Siedlung; „Dörfer“ ist die klare, übliche deutsche Entsprechung.
- source_word: κύκλῳ
  choice: ringsum
  rationale: Das adverbiale κύκλῳ kann die umliegende Gegend oder eine Bewegung im Kreis beziehungsweise von Ort zu Ort bezeichnen. „ringsum“ hält diese räumliche Weite knapp fest.
- source_word: διδάσκων
  choice: und lehrte
  rationale: Das Präsenspartizip beschreibt die Tätigkeit, die Jesu Umherziehen begleitete. Die finite Nebenhandlung ist im modernen Deutschen natürlicher als „lehrend“, ohne die Gleichzeitigkeit aufzugeben.
theological_decisions:
- issue: Jesu Verwunderung über den Unglauben
  choice: Und er wunderte sich über ihren Unglauben.
  alternative: Und er war wegen ihres Unglaubens erstaunt.
  rationale: Die Aussage des Textes über Jesu Verwunderung bleibt unvermindert stehen. Es wird weder erklärt, wie sie christologisch zu verstehen ist, noch wird die erzählerische und theologische Spannung abgeschwächt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der zweite Satz beginnt mit „Dann“, um die fortschreitende Erzählung des griechischen Καί natürlich wiederzugeben. Die zweimalige finite Form „zog … und lehrte“ vermeidet das im heutigen Deutsch schwerfälligere Partizip „lehrend“.
