source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: de
  text: Und wo immer er in Dörfer, Städte oder ländliche Gebiete hineinging, legten sie die Kranken auf die Marktplätze und baten ihn inständig, wenigstens den Saum seines Gewandes[a] berühren zu dürfen. Und alle, die ihn berührten[b], wurden geheilt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Rand seines Gewandes“; möglicherweise ist eine Quaste am Gewand gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Griechisch: „ihn berührten“. Im unmittelbaren Zusammenhang steht zuvor die Berührung des Gewandsaums.'
    reason: referential_ambiguity
  - marker: c
    text: 'Wörtlich auch: „wurden gerettet“ oder „wurden gesund gemacht“. Das griechische Verb kann sowohl Rettung als auch Heilung bezeichnen; hier weist der Zusammenhang auf körperliche Heilung.'
    reason: lexical_and_theological_range
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: wo immer er ... kam
  rationale: ὅπου mit ἄν verallgemeinert die Ortsangabe; zusammen mit dem Imperfekt bezeichnet die Form wiederholtes Geschehen. Die deutsche Wendung gibt beides natürlich wieder.
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: Dörfer, Städte oder ländliche Gebiete
  rationale: ἀγροί bezeichnet in dieser Aufzählung am ehesten Landbezirke oder ländliche Gegenden, nicht bloß einzelne Äcker.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: auf die Marktplätze
  rationale: ἀγορά bezeichnet den öffentlichen Markt- oder Versammlungsplatz. Mit dem Verb des Hinlegens ist im Deutschen „auf“ idiomatisch.
- source_word: ἐτίθεσαν
  choice: legte man
  rationale: Das Imperfekt beschreibt die wiederholte Praxis. Das unbestimmte Pluralobjekt wird im Deutschen natürlich durch „man“ wiedergegeben; der iterative Sinn ergibt sich aus „wo immer“.
- source_word: παρεκάλουν αὐτόν
  choice: bat ihn inständig
  rationale: παρακαλέω bezeichnet hier eine eindringliche Bitte. „Inständig bitten“ ist würdig und verständlich, ohne unnötig dramatisch zu wirken.
- source_word: ἵνα κἂν ... ἅψωνται
  choice: sie dürften auch nur ... berühren
  rationale: 'κἄν hebt die minimale erhoffte Handlung hervor: Schon eine Berührung des Saums sollte genügen.'
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: den Saum seines Gewandes
  rationale: κράσπεδον kann den Rand oder Saum, im jüdischen Kontext möglicherweise auch eine Quaste am Gewand bezeichnen. „Saum“ ist im Haupttext konkret, natürlich und nicht überpräzis.
- source_word: ὅσοι ἂν ἥψαντο αὐτοῦ
  choice: alle, die ihn berührten
  rationale: Das ausdrückliche αὐτοῦ ist maskuliner Genitiv und bezieht sich grammatisch auf Jesus. Der unmittelbare Kontext erklärt, dass die Berührung über den Gewandsaum geschah.
- source_word: ἐσῴζοντο
  choice: wurden geheilt
  rationale: σῴζω hat ein breiteres Bedeutungsspektrum einschließlich „retten“, bezeichnet hier bei den Kranken jedoch ihre körperliche Heilung.
theological_decisions:
- issue: Bedeutung von ἐσῴζοντο
  choice: wurden geheilt
  alternative: wurden gerettet / wurden gesund
  rationale: Der unmittelbare Zusammenhang handelt von Kranken und ihrer körperlichen Wiederherstellung. Eine rein soteriologische Deutung würde dem Kontext mehr aufladen, als hier ausdrücklich gesagt wird; eine Fußnote bewahrt dennoch die weitere Bedeutungsbreite.
- issue: Bezugswort von αὐτοῦ nach ἥψαντο
  choice: ihn berührten
  alternative: den Saum beziehungsweise sein Gewand berührten
  rationale: Das Pronomen verweist grammatisch auf Jesus, während der vorherige Satzteil die konkrete Berührung seines Gewandsaums beschreibt. Die Übersetzung wahrt diese Spannung, statt das Pronomen stillschweigend durch „ihn“ oder „es“ zu interpretieren, ohne die Alternative kenntlich zu machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. „Wo immer“ und „legte man“ vermitteln die wiederholte Handlung ohne schwerfällige Verlaufsformen. Die Satzfolge bleibt nahe am griechischen Aufbau, wird aber in natürlicher deutscher Syntax wiedergegeben.
