source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: de
  text: Und sofort nötigte er seine Jünger[a], ins Boot zu steigen und voraus ans andere Ufer in Richtung Betsaida[b] zu fahren, bis er selbst die Menge entließ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch „zwang“ bedeuten; es bezeichnet ein starkes Veranlassen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „nach Betsaida“. Die griechische Präposition kann die Richtung oder das Ziel bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Bewahrt das für Markus charakteristische Erzähltempo und ist im heutigen Deutsch unmittelbar verständlich.
- source_word: ἠνάγκασεν
  choice: drängte
  rationale: Gibt den starken Nachdruck von ἀναγκάζω natürlich wieder, ohne zwingend körperlichen Zwang anzudeuten; die stärkere wörtliche Möglichkeit wird in der Fußnote genannt.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: seine Jünger
  rationale: „Jünger“ ist die präzise und etablierte Bezeichnung für μαθηταί im Lehrer-Schüler-Verhältnis der Evangelien.
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: ins Boot zu steigen
  rationale: Natürliche moderne Wiedergabe des Einsteigens in das Boot.
- source_word: προάγειν
  choice: vorauszufahren
  rationale: Drückt aus, dass die Jünger vor Jesus aufbrechen sollen; im Kontext eines Bootes ist „fahren“ natürlicher als das allgemeinere „gehen“.
- source_word: εἰς τὸ πέραν
  choice: ans andere Ufer
  rationale: Die Wendung bezeichnet im Zusammenhang die gegenüberliegende Seite des Sees; „Ufer“ macht den räumlichen Bezug im Deutschen idiomatisch deutlich.
- source_word: πρὸς Βηθσαϊδάν
  choice: in Richtung Betsaida
  rationale: Bewahrt den Richtungscharakter von πρός mit Akkusativ, ohne die Ankunft in Betsaida ausdrücklich als Endpunkt festzulegen.
- source_word: ἕως
  choice: während
  rationale: Im Zusammenhang beschreibt die Zeit, in der die Jünger vorausfahren und Jesus die Menge entlässt. Da ἕως auch „bis“ bedeuten kann, bleibt diese formnähere Möglichkeit in der Fußnote erhalten.
- source_word: αὐτὸς
  choice: er selbst
  rationale: Erhält die ausdrückliche Betonung des griechischen Pronomens.
- source_word: ἀπολύει τὸν ὄχλον
  choice: die Menschenmenge verabschiedete
  rationale: ἀπολύω bedeutet hier, die versammelten Menschen fortzuschicken. Das deutsche Präteritum entspricht dem Erzählzusammenhang, obwohl im Griechischen Präsens steht.
theological_decisions: []
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. „Menschenmenge“ ist natürlicher als das gehobenere „Volksmenge“; „verabschiedete“ bezeichnet hier das geordnete Fortschicken. Die Richtungsangabe nach Betsaida und die zeitliche Mehrdeutigkeit des Schlusssatzes werden nicht unnötig vereindeutigt.
