  text: And they went out and proclaimed that people should repent[a].
translation:
  language: de
  text: Sie zogen los und verkündeten, die Menschen sollten umkehren[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „dass sie umkehren sollten“; „sie“ meint die Menschen, die ihre Verkündigung hörten.'
    reason: Die Fußnote bewahrt die griechische ἵνα-Konstruktion und das nur in der Verbform enthaltene Subjekt, während der Haupttext eine mögliche Verwechslung mit den Jüngern vermeidet.
lexical_decisions:
- source_word: Καὶ
  choice: Sie
  rationale: Das einfache καί verbindet den Vers mit dem vorherigen Geschehen. Im Deutschen kann diese Verbindung ohne ein ausdrückliches „Und“ natürlich durch die fortlaufende Erzählung wiedergegeben werden.
- source_word: ἐξελθόντες
  choice: zogen los
  rationale: Das vorzeitige bzw. begleitende Partizip bezeichnet den Aufbruch der Jünger. „Zogen los“ ist eine natürliche erzählerische Wiedergabe, ohne die griechische Partizipialkonstruktion steif nachzubilden.
- source_word: ἐκήρυξαν
  choice: verkündeten
  rationale: κηρύσσω bezeichnet öffentliches Ausrufen oder Verkündigen. „Verkündeten“ bewahrt diesen Sinn und ist im modernen Deutschen verständlich, ohne die Tätigkeit auf eine spätere kirchliche Predigtform einzuengen.
- source_word: ἵνα
  choice: die Menschen sollten
  rationale: ἵνα leitet hier die verlangte bzw. beabsichtigte Reaktion auf die Verkündigung ein. Die Konstruktion mit „sollten“ gibt dies idiomatisch wieder; „die Menschen“ verdeutlicht das im griechischen Verb nur mitgedachte Subjekt.
- source_word: μετανοῶσιν
  choice: umkehren
  rationale: μετανοέω bezeichnet im Evangelium eine grundlegende Sinnes- und Lebenswende zu Gott. „Umkehren“ ist prägnant, verständlich und vermeidet mögliche Missverständnisse von „Buße tun“ als bloße Straf- oder Sühneleistung.
theological_decisions:
- issue: Das unausgesprochene Subjekt von μετανοῶσιν
  choice: die Menschen sollten umkehren
  alternative: sie sollten umkehren
  rationale: Die dritte Person Plural bezieht sich sinngemäß auf die Hörer der Verkündigung, nicht auf die ausgesandten Jünger. „Die Menschen“ macht diesen Bezug klar, ohne eine bestimmte Personengruppe oder zusätzliche Lehraussage einzutragen.
- issue: Bedeutungsumfang von μετανοέω
  choice: umkehren
  alternative: Buße tun; ihr Denken ändern
  rationale: „Umkehren“ wahrt die im Kontext gemeinte Wende von Denken und Leben, ohne den Ausdruck auf einen rein gedanklichen Meinungswechsel zu reduzieren oder mit späteren Vorstellungen einer Bußleistung zu belasten.
- issue: Funktion von ἵνα
  choice: Inhalt bzw. Ziel der Verkündigung offen wiedergegeben
  alternative: damit sie umkehrten
  rationale: ἵνα kann hier Ziel, Absicht oder den Inhalt einer Aufforderung markieren. Die Formulierung mit „sollten“ lässt diese Nähe von verkündetem Inhalt und beabsichtigter Reaktion bestehen, statt sie enger festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlichem Erzählfluss. „Verkündeten“ erhält den öffentlichen Charakter des Auftrags; „umkehren“ ist verständlich und trägt die religiös-ethische Tiefe des griechischen Ausdrucks, ohne konfessionell verengte Terminologie.
