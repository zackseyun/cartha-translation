id: MRK.6.13
reference: Mark 6:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: de
  text: Und sie trieben viele Dämonen aus, salbten viele Kranke mit Öl[a] und heilten sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »mit Olivenöl«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δαιμόνια
  choice: Dämonen
  rationale: Das Substantiv bezeichnet hier böse Geister; »Dämonen« ist die direkte, natürliche deutsche Entsprechung und übernimmt nicht die anderslautende Bezeichnung »unreine Geister« aus benachbarten Zusammenhängen.
- source_word: πολλὰ
  choice: viele
  rationale: Das Wort bestimmt »Dämonen« quantitativ und wird ohne verstärkenden Zusatz wiedergegeben.
- source_word: ἐξέβαλλον
  choice: trieben … aus
  rationale: Der Imperfekt beschreibt in dieser zusammenfassenden Erzählung wiederholtes bzw. fortlaufendes Handeln. Das Präteritum ist im Deutschen die natürliche Erzählform; der wiederholte Charakter ergibt sich aus dem Kontext und »viele«.
- source_word: ἤλειφον
  choice: salbten
  rationale: ἀλείφω bedeutet salben bzw. auftragen. In Verbindung mit Öl und Kranken ist »salbten« idiomatisch und wahrt den sachlichen Bericht.
- source_word: ἐλαίῳ
  choice: mit Öl
  rationale: ἔλαιον bezeichnet Öl, im antiken Mittelmeerraum gewöhnlich Olivenöl. Der Haupttext bleibt bei der lexikalisch weniger spezifizierten Wiedergabe »Öl«; die kulturell wahrscheinliche Präzisierung steht in der Fußnote.
- source_word: πολλοὺς ἀρρώστους
  choice: viele Kranke
  rationale: Das substantivierte Adjektiv bezeichnet kranke Menschen. »Viele Kranke« ist knapp, natürlich und in modernem Deutsch gut verständlich.
- source_word: ἐθεράπευον
  choice: heilten sie
  rationale: θεραπεύω bedeutet hier heilen. Das Pronomen bezieht sich eindeutig auf die Kranken; die Formulierung bildet die fortlaufende Reihe der berichteten Handlungen natürlich ab.
- source_word: καὶ
  choice: und
  rationale: Das erste καί verbindet diesen Satz mit dem vorhergehenden Zusammenhang; die weiteren Vorkommen koordinieren die Handlungen. Im Deutschen wird die schlichte Reihung gewahrt, ohne jedes καί mechanisch wiederzugeben.
theological_decisions:
- issue: Funktion der Salbung mit Öl im Verhältnis zur Heilung
  choice: Die Salbung und die Heilung werden als berichtete Handlungen nebeneinandergestellt, ohne einen Wirkmechanismus festzulegen.
  alternative: Das Öl bewirkte selbst die Heilung; oder die Salbung war ausschließlich symbolisch und hatte keinerlei Anteil an der Heilungshandlung.
  rationale: Der griechische Text berichtet, dass die Jünger Kranke mit Öl salbten und sie heilten, erklärt aber weder die genaue Beziehung zwischen beiden Handlungen noch begründet er ausdrücklich eine sakramentale Lehre. Die Übersetzung lässt diese theologische Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlicher biblischer Erzählweise. Das Präteritum gibt die griechischen Imperfektformen im deutschen Erzählregister wieder; der zusammenfassend-wiederholte Charakter bleibt durch den Kontext erkennbar. Der Fußnotenmarker [a] steht unmittelbar bei »Öl«.
