source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: de
  text: Und er nahm die fünf Brote und die zwei Fische, blickte zum Himmel auf, sprach den Segen[a] und brach die Brote. Dann gab er sie immer wieder seinen Jüngern, damit sie sie den Leuten vorlegten; auch die zwei Fische verteilte er unter allen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dankte“. Das griechische Verb bedeutet wörtlich „segnen“; im Zusammenhang einer Mahlzeit kann es sich mit dem Sinn von „Dank sagen“ überschneiden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: er nahm
  rationale: Das einleitende Aoristpartizip wird im Deutschen natürlich als beigeordnete finite Handlung wiedergegeben.
- source_word: ἄρτους
  choice: Brote
  rationale: Da fünf einzelne, zählbare Brote gemeint sind, ist „Brote“ konkreter als der Stoffbegriff „Brot“.
- source_word: ἰχθύας
  choice: Fische
  rationale: Direkte und natürliche Wiedergabe des griechischen Plurals.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: blickte zum Himmel auf
  rationale: Bewahrt die aufwärts gerichtete Bewegung und klingt in modernem Deutsch natürlich und würdevoll.
- source_word: εὐλόγησεν
  choice: sprach den Segen
  rationale: Bewahrt die lexikalische Verbindung zu „segnen“, ohne einen im Griechischen nicht ausdrücklich genannten Gegenstand des Segnens einzuführen.
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: brach die Brote
  rationale: Gibt Verb und ausdrücklich genanntes Objekt konkret wieder.
- source_word: ἐδίδου
  choice: gab ... immer wieder
  rationale: Bringt den fortlaufenden beziehungsweise wiederholten Aspekt des Imperfekts bei der Austeilung zum Ausdruck.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: seinen Jüngern
  rationale: Gibt den ausdrücklich vorhandenen Possessivbezug αὐτοῦ wieder.
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: damit sie sie den Leuten vorlegten
  rationale: Bewahrt den Zweck und die konkrete Bedeutung von παρατίθημι; „den Leuten“ klärt den Bezug des zweiten αὐτοῖς auf die versammelte Menge.
- source_word: ἐμέρισεν πᾶσιν
  choice: verteilte ... unter allen
  rationale: „Verteilte“ gibt das Aufteilen und Austeilen idiomatisch wieder; „unter allen“ bewahrt den umfassenden distributiven Sinn von πᾶσιν.
theological_decisions:
- issue: Bedeutung von εὐλόγησεν im Zusammenhang einer Mahlzeit
  choice: sprach den Segen
  alternative: dankte
  rationale: Das griechische Verb lautet εὐλογέω („segnen“), kann aber im Mahlkontext funktional an ein Dankgebet heranreichen. „Sprach den Segen“ bleibt lexikalisch transparent und legt nicht fest, ob ausdrücklich Gott gedankt oder die Speise gesegnet wurde.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die griechische Satzfolge wird lesbar gegliedert; das Imperfekt ἐδίδου wird als fortlaufend-wiederholte Austeilung kenntlich gemacht. Die mögliche Mehrdeutigkeit von εὐλόγησεν bleibt durch Haupttext und Fußnote erhalten.
