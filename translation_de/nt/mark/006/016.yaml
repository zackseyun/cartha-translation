source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: de
  text: 'Als Herodes aber davon hörte, sagte er[a]: »Johannes, den ich enthauptet habe – der ist auferweckt worden[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sagte immer wieder«. Das griechische Imperfekt kann wiederholtes oder andauerndes Reden ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »wurde auferweckt«; sinngemäß: »ist auferstanden«. Im Griechischen steht das Verb im Passiv.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: als … davon hörte
  rationale: Das Aoristpartizip wird als natürlicher deutscher Temporalsatz wiedergegeben. »Davon« nimmt das zuvor Berichtete auf, ohne im griechischen Satz ein ausdrücklich genanntes Objekt vorauszusetzen.
- source_word: δὲ
  choice: aber
  rationale: δέ kennzeichnet hier einen leichten narrativen Gegensatz beziehungsweise die Rückkehr zu Herodes’ Reaktion.
- source_word: ἔλεγεν
  choice: sagte er
  rationale: Das Imperfekt kann andauerndes oder wiederholtes Reden bezeichnen; im deutschen Erzählstil ist »sagte er« jedoch die natürliche Hauptwiedergabe. Die mögliche iterative Nuance wird in Fußnote [a] bewahrt.
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: Johannes, den ich enthauptet habe
  rationale: Die auffällige griechische Voranstellung wird in idiomatischer deutscher Wortfolge wiedergegeben. »Enthauptet« bewahrt die konkrete Bedeutung von ἀποκεφαλίζω; das Perfekt klingt in direkter Rede natürlich.
- source_word: οὗτος
  choice: der
  rationale: Das wiederaufnehmende, betonte »der« bewahrt die demonstrative Kraft von οὗτος nach dem vorangestellten Johannes, ohne im Deutschen gekünstelt zu wirken.
- source_word: ἠγέρθη
  choice: ist auferweckt worden
  rationale: Die passive Form wird auch im Deutschen passiv wiedergegeben. Das Perfekt bezeichnet Herodes’ Schlussfolgerung über den gegenwärtigen Zustand des zuvor getöteten Johannes.
theological_decisions:
- issue: Wiedergabe von ἠγέρθη als Auferstehungsaussage
  choice: ist auferweckt worden
  alternative: ist auferstanden
  rationale: Das griechische Verb steht formal im Passiv. Die passive Wiedergabe lässt offen, wer handelt, und glättet Herodes’ erschrockene Deutung nicht zu einer aktiven Auferstehungsformel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich bildet die emphatische Wiederaufnahme durch οὗτος ab; »der« klingt dabei natürlicher als das wörtlichere »dieser«.
