  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ὀψίας γενομένης ἦν τὸ πλοῖον ἐν μέσῳ τῆς θαλάσσης, καὶ αὐτὸς μόνος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/047.yaml
  text: And when evening had come[a], the boat was in the middle of the sea, and he was alone on the land.
translation:
  language: de
  text: Als es Abend geworden war, befand sich das Boot mitten auf dem See, und er war allein an Land.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: Als es Abend geworden war
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand. Die Formulierung gibt den vollzogenen Eintritt des Abends natürlich und nah am Griechischen wieder.
- source_word: πλοῖον
  choice: das Boot
  rationale: Für das Fahrzeug auf dem See Gennesaret ist „Boot“ im heutigen Deutsch sachlich und sprachlich passender als „Schiff“.
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: mitten auf dem See
  rationale: Die Wendung bezeichnet die Lage fern vom Ufer. Im Deutschen sagt man bei einem Binnengewässer idiomatisch „auf dem See“; „mitten“ bewahrt μέσῳ.
- source_word: θάλασσα
  choice: See
  rationale: Das griechische Wort kann je nach Kontext „Meer“ oder „See“ bezeichnen. Da hier der See Gennesaret gemeint ist, ist „See“ im modernen Deutschen die natürliche und geografisch klare Wiedergabe.
- source_word: αὐτὸς μόνος
  choice: er war allein
  rationale: Die Verbindung hebt Jesu Alleinsein hervor. „Er war allein“ gibt dies natürlich wieder, ohne das im Deutschen unnötig steife „er selbst“ einzufügen.
- source_word: ἐπὶ τῆς γῆς
  choice: an Land
  rationale: Im Gegensatz zum Boot auf dem Wasser bezeichnet die Wendung Jesu Standort auf dem Land beziehungsweise am Ufer. „An Land“ ist dafür die natürliche deutsche Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Wiederholung von καί wird im Deutschen durch eine einzige koordinierende Verbindung natürlich abgebildet; der räumliche Gegensatz zwischen Boot und Jesus bleibt erhalten.
