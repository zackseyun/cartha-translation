source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: de
  text: 'Denn Johannes hatte Herodes immer wieder gesagt: „Es ist dir nicht erlaubt[a], die Frau deines Bruders zu haben.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Du darfst die Frau deines Bruders nicht haben.“'
    reason: Lexikalisch und syntaktisch mögliche, unmittelbarere Wiedergabe von Οὐκ ἔξεστίν σοι; die Hauptfassung bewahrt deutlicher den Sinn des rechtlich bzw. moralisch Nicht-Erlaubten.
lexical_decisions:
- source_word: ἔλεγεν
  choice: hatte … gesagt
  rationale: Das Imperfekt bezeichnet hier eine in der erzählten Vergangenheit bereits andauernde oder wiederholt geäußerte Aussage. Das deutsche Plusquamperfekt fügt sich natürlich in den rückblickenden Begründungszusammenhang ein, ohne eine ausdrücklich einmalige Äußerung zu behaupten.
- source_word: γὰρ
  choice: Denn
  rationale: „Denn“ bewahrt die erklärende Verknüpfung mit dem vorausgehenden Zusammenhang.
- source_word: Ἡρῴδῃ
  choice: zu Herodes
  rationale: Der Name wird in seiner üblichen deutschen Form wiedergegeben; „zu Herodes gesagt“ macht den Adressaten der Aussage idiomatisch deutlich.
- source_word: Οὐκ ἔξεστίν σοι
  choice: Es ist dir nicht erlaubt
  rationale: Die Formulierung bewahrt den rechtlich-moralischen Sinn dessen, was gestattet oder zulässig ist, ohne die im Vers nicht ausdrücklich genannte Gesetzesgrundlage zu ergänzen.
- source_word: ἔχειν
  choice: zu haben
  rationale: Die wörtliche Bedeutung „haben“ ist auch im ehelichen Zusammenhang verständlich und vermeidet eine unnötige Präzisierung als „nehmen“ oder „behalten“.
- source_word: γυναῖκα
  choice: Frau
  rationale: Im Deutschen bezeichnet „die Frau deines Bruders“ eindeutig dessen Ehefrau und klingt natürlicher als die schwerfällige Form „Ehefrau deines Bruders“.
- source_word: τοῦ ἀδελφοῦ σου
  choice: deines Bruders
  rationale: Der deutsche Genitiv gibt das Besitz- beziehungsweise Beziehungsverhältnis knapp und natürlich wieder.
theological_decisions:
- issue: Art von Johannes’ Zurechtweisung
  choice: 'Als Aussage über das rechtlich und moralisch nicht Erlaubte wiedergegeben: „Es ist dir nicht erlaubt“'
  alternative: 'Schwächer: „Es ist nicht richtig für dich“; unmittelbarer: „Du darfst nicht“'
  rationale: ἔξεστιν bezeichnet, was erlaubt oder rechtmäßig ist. Die Übersetzung erhält diese rechtlich-moralische Spannung, ohne ausdrücklich auf eine bestimmte Vorschrift der Tora zu verweisen, die der Vers selbst nicht nennt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt bewusst knapp und eindringlich; „Frau deines Bruders“ ist im Deutschen eindeutig ehelich zu verstehen.
