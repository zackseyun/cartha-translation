  naturalness: „Ein Prophet ist nirgends ohne Ansehen außer …“ ist modernes, idiomatisches und zugleich sprichworttaugliches Standarddeutsch. „In seinem Haus“ lässt, wie οἰκία, sowohl das Haus als auch den häuslichen Familienverband offen.
  terminology: „Prophet“ ist korrekt. „Ansehen“ gibt den sozialen Ehrbegriff von ἄτιμος angemessen wieder, ohne die stärkere Bedeutung „verachtet“ einzutragen. „Heimat“, „Verwandte“ und „Haus“ bewahren die lexikalischen Spielräume des griechischen Textes.
