source:
  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: de
  text: 'Und Jesus sagte zu ihnen: „Ein Prophet ist nirgends ohne Ansehen außer in seiner Heimat[a], bei seinen Verwandten[b] und in seinem Haus[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in seinem Heimatort“. Das griechische Wort bezeichnet den eigenen Herkunftsort oder die Heimat; im Zusammenhang ist besonders Nazaret gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „unter seinen Verwandten“ oder „bei seinen Angehörigen“. Gemeint sind Angehörige seiner Verwandtschaftsgruppe.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „in seiner Hausgemeinschaft“ oder „in seiner Familie“. Das griechische Wort kann sowohl das Haus als Gebäude als auch die darin lebende Gemeinschaft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: sagte
  rationale: Der griechische Imperfekt beschreibt hier Jesu Äußerung im fortlaufenden Erzählgeschehen. Im natürlichen modernen Deutsch ist das Präteritum „sagte“ dafür die unmarkierte und idiomatische Wiedergabe; „sagte immer wieder“ würde eine Wiederholung stärker behaupten, als der Kontext verlangt.
- source_word: προφήτης
  choice: Prophet
  rationale: Die übliche und sachlich genaue deutsche Entsprechung.
- source_word: ἄτιμος
  choice: gilt … weniger
  rationale: Ἄτιμος bezeichnet das Fehlen von Ehre beziehungsweise Ansehen. Die sprichwortartige deutsche Formulierung „Nirgends gilt ein Prophet weniger als …“ gibt die verneinte Ausnahmeform natürlich und würdevoll wieder, ohne stärkere Bedeutungen wie „verachtet“ einzutragen.
- source_word: εἰ μὴ
  choice: nirgends … als
  rationale: Nach der Verneinung leitet εἰ μή die Ausnahme ein. Die deutsche Vergleichsform „nirgends … als“ bildet diese Aussage idiomatisch ab.
- source_word: πατρίδι
  choice: Heimat
  rationale: Πατρίς meint den eigenen Herkunftsort oder die Heimat. „Heimat“ bewahrt die mögliche Spannweite zwischen Heimatort und Herkunftsgebiet; im Kontext ist besonders Nazaret gemeint.
- source_word: συγγενεῦσιν
  choice: Verwandten
  rationale: Das Wort bezeichnet Angehörige derselben Verwandtschaftsgruppe; „Verwandte“ ist die klare moderne Standardform.
- source_word: οἰκίᾳ
  choice: eigenen Haus
  rationale: Οἰκία kann sowohl das Haus als auch die darin lebende Hausgemeinschaft beziehungsweise Familie bezeichnen. „Im eigenen Haus“ bewahrt diese Ambiguität besser als die eindeutige Festlegung auf „Haushalt“ oder „Familie“.
- source_word: καὶ … καὶ … καὶ
  choice: in …, bei … und in …
  rationale: Die drei Bereiche bleiben als kumulative, sich verengende soziale Kreise erkennbar. Im Deutschen genügt in der Aufzählung vor dem letzten Glied ein ausdrückliches „und“.
theological_decisions:
- issue: Geltungsbereich des Sprichworts über die Ehre eines Propheten
  choice: Die Aussage bleibt ein allgemeines Sprichwort, das Jesus im Kontext auf sich selbst bezieht.
  alternative: Ausdrücklich ergänzen, Jesus bezeichne sich als verworfenen Messias, oder die Aussage allgemein auf Unglauben beziehen.
  rationale: Der griechische Text spricht von einem Propheten und erklärt die christologische oder soteriologische Bedeutung nicht ausdrücklich. Die Übersetzung wahrt diese Spannung und fügt keine Lehrdeutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartigem Klang. Die idiomatische Wendung „Nirgends gilt ein Prophet weniger als …“ wahrt den Ehr-/Ansehensgegensatz. „Eigenen“ gibt die dreifache Rückbeziehung auf αὐτοῦ natürlich wieder, ohne sie in jedem Glied schwerfällig zu wiederholen.
