  text: καὶ ⸀εὐθὺς ἀποστείλας ὁ βασιλεὺς σπεκουλάτορα ἐπέταξεν ⸀ἐνέγκαι τὴν κεφαλὴν αὐτοῦ. ⸀καὶ ἀπελθὼν ἀπεκεφάλισεν αὐτὸν ἐν τῇ φυλακῇ
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/027.yaml
  text: And immediately the king sent an executioner and ordered him to bring his head[a]. And he went and beheaded him in the prison.
translation:
  language: de
  text: Und sofort schickte der König einen Scharfrichter[a] und befahl ihm, den Kopf des Johannes zu bringen. Er ging hin und enthauptete ihn im Gefängnis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen Wachmann“ beziehungsweise „einen Leibwächter“. Im Griechischen steht ein lateinisches Lehnwort (spekoulatōr) für einen Angehörigen der Herrscherwache, der hier als Scharfrichter handelt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sofort
  rationale: Gibt die für Markus charakteristische Unmittelbarkeit in natürlichem, modernem Deutsch wieder.
- source_word: ὁ βασιλεὺς
  choice: der König
  rationale: Bewahrt die ausdrückliche Erzählbezeichnung bei Markus, obwohl Herodes Antipas historisch den Titel Tetrarch trug.
- source_word: σπεκουλάτορα
  choice: einen Scharfrichter
  rationale: Das lateinische Lehnwort bezeichnet einen Angehörigen der Herrscherwache, der hier mit der Hinrichtung beauftragt wird; „Scharfrichter“ vermittelt seine konkrete Funktion klar.
- source_word: ἐπέταξεν ἐνέγκαι
  choice: befahl ihm, … zu bringen
  rationale: Gibt die Befehlsform samt Infinitiv idiomatisch und mit angemessener Stärke wieder.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: den Kopf des Johannes
  rationale: Das griechische Pronomen bedeutet wörtlich „seinen Kopf“. Die Nennung des Johannes beseitigt im Deutschen eine mögliche falsche Zuordnung zum Scharfrichter, ohne den Bezug inhaltlich zu verändern.
- source_word: ἀπεκεφάλισεν
  choice: enthauptete
  rationale: Präzise, allgemein verständliche und dem würdigen Erzählregister entsprechende Wiedergabe.
- source_word: ἐν τῇ φυλακῇ
  choice: im Gefängnis
  rationale: Gibt den bestimmten, bereits im Kontext etablierten Haftort natürlich wieder.
theological_decisions: []
