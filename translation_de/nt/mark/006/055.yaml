  - severity: low
    issue: Zusatznuance „gerade“
    rationale: ὅτι ἐστίν besagt, dass Jesus an dem berichteten Ort ist; „gerade“ fügt eine besondere Momentanität hinzu, die nicht notwendig im Ausgangstext liegt.
  - severity: medium
    issue: 'Fußnote: „Tragbahren“ ist als Alternative zu eng'
    rationale: κράβαττος bezeichnet einfache portable Lagerstätten, Matten oder Liegen. Eine „Tragbahre“ kann im Deutschen ein spezielleres Transportgerät nahelegen.
