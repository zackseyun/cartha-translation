base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: de
  text: Sie liefen in jener ganzen Gegend umher und begannen, die Kranken auf Matten dorthin zu tragen, wo Jesus sich, wie sie hörten, aufhielt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf Lagerstätten“ beziehungsweise „auf einfachen Liegen“; das griechische Wort bezeichnet eine einfache tragbare Schlafunterlage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: liefen ... umher
  rationale: Das Kompositum bezeichnet eilige Bewegung durch ein Gebiet; die Formulierung bewahrt sowohl die Dringlichkeit als auch die räumliche Verteilung.
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: in jener ganzen Gegend
  rationale: χώρα meint hier das umliegende Gebiet, nicht ein Land im modernen politischen Sinn; ἐκείνην wird mit „jener“ wiedergegeben.
- source_word: ἤρξαντο ... περιφέρειν
  choice: begannen ... zu tragen
  rationale: Die Konstruktion mit ἤρξαντο und Infinitiv kennzeichnet den Beginn der Handlung und bleibt im Deutschen natürlich.
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: auf ihren Schlafmatten
  rationale: κράβαττος bezeichnet eine einfache tragbare Schlafunterlage. „Schlafmatten“ ist verständlich und vermeidet die moderne Vorstellung feststehender Betten.
- source_word: τοὺς κακῶς ἔχοντας
  choice: die Kranken
  rationale: Die griechische Wendung ist eine übliche idiomatische Bezeichnung für Menschen, denen es körperlich schlecht geht.
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: dorthin ..., wo Jesus, wie sie hörten, gerade war
  rationale: ὅπου hat im Zusammenhang Zielbedeutung; die eingeschobene Formulierung gibt den indirekten Bericht natürlich wieder. Das ausdrücklich genannte „Jesus“ klärt im Deutschen den Bezug des im Griechischen impliziten Subjekts.
