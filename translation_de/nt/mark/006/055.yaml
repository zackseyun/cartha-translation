- from: Sie liefen in jener ganzen Gegend umher und begannen, die Kranken auf ihren Schlafmatten dorthin zu tragen, wo Jesus, wie sie hörten, gerade war.[a]
  to: Sie liefen in jener ganzen Gegend umher und begannen, die Kranken auf Matten dorthin zu tragen, wo Jesus sich, wie sie hörten, aufhielt.[a]
  rationale: Die Revision entfernt zwei nicht ausdrücklich markierte Ergänzungen („ihren“, „gerade“) und präzisiert die lexikalische Fußnote. Die Aussage, dass die Kranken zu jedem Ort gebracht wurden, an dem Jesus nach den Berichten anwesend war, bleibt vollständig erhalten.
