  verdict: revise
  source_fidelity: Der Satz gibt die Bewegung durch das gesamte Gebiet, den einsetzenden Vorgang des Herbeitragens und das Ziel bei Jesus zutreffend wieder. Das possessive „ihren“ in „ihren Schlafmatten“ ist jedoch im griechischen Text nicht ausgedrückt. Zudem ist „gerade“ eine nicht erforderliche zeitliche Präzisierung. Die Fußnotenalternative „Tragbahren“ ist für κράβαττοι zu spezifisch, da eher eine einfache Liege, Matte oder Lagerstätte gemeint ist als eine eigentliche Bahre.
  naturalness: Die revidierte Fassung bleibt flüssiges modernes Standarddeutsch. „auf Matten“ ist im Kontext verständlich und vermeidet sowohl die unbelegte Besitzzuordnung als auch die heute teils irreführende Vorstellung einer festen Schlafmatte.
  terminology: „Kranke“ gibt τοὺς κακῶς ἔχοντας idiomatisch wieder. „Matten“ ist eine angemessene Hauptwiedergabe von κράβαττοι; die Fußnote wahrt die möglichen Nuancen „Lagerstätten“ und „einfache Liegen“. Die explizite Nennung Jesu verdeutlicht den im Kontext klaren Bezug, ohne eine zusätzliche Deutung einzutragen.
