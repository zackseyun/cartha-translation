source:
  edition: SBLGNT
  text: ἀπόλυσον αὐτούς, ἵνα ἀπελθόντες εἰς τοὺς κύκλῳ ἀγροὺς καὶ κώμας ἀγοράσωσιν ἑαυτοῖς ⸂τί φάγωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: de
  text: Schick sie weg, damit sie in die umliegenden Gehöfte und Dörfer gehen und sich etwas zu essen kaufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλυσον αὐτούς
  choice: Schick sie weg
  rationale: Der Aoristimperativ bezeichnet hier die Aufforderung, die Menschenmenge fortzuschicken. „Schick sie weg“ ist natürliches, gegenwärtiges Deutsch und bewahrt die direkte Kraft der Aufforderung.
- source_word: ἵνα
  choice: damit
  rationale: Leitet den beabsichtigten Zweck ein und wird im Deutschen idiomatisch mit „damit“ wiedergegeben.
- source_word: ἀπελθόντες
  choice: gehen
  rationale: 'Das vorzeitige Aoristpartizip wird natürlich in den deutschen Zwecksatz integriert; die Abfolge ergibt sich aus dem Zusammenhang: Sie sollen fortgehen und anschließend Nahrung kaufen.'
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: die umliegenden Gehöfte und Dörfer
  rationale: κύκλῳ bedeutet „ringsum, umliegend“. ἀγροί kann hier ländliche Anwesen oder Gehöfte bezeichnen, während κῶμαι Dörfer meint. „Gehöfte und Dörfer“ erhält die zwei koordinierten Ortskategorien und passt zum Erwerb von Lebensmitteln.
- source_word: ἀγοράσωσιν
  choice: kaufen
  rationale: Gibt den gewöhnlichen Sinn des Verbs präzise und in modernem Deutsch wieder.
- source_word: ἑαυτοῖς
  choice: sich
  rationale: Der reflexive Dativ des Vorteils wird idiomatisch mit „sich etwas … kaufen“ ausgedrückt.
- source_word: τί φάγωσιν
  choice: etwas zu essen
  rationale: Die griechische Wendung wird in natürlichem Deutsch als „etwas zu essen“ wiedergegeben und bewahrt ihren unbestimmten Sinn.
theological_decisions: []
