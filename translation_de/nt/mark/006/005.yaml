id: MRK.6.5
reference: Mark 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: de
  text: Und er konnte dort keine Machttat vollbringen[a], außer dass er wenigen Kranken die Hände auflegte und sie heilte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „kein Wunder“ oder „keine machtvolle Tat“; wörtlich steht im Griechischen „keine Kraft/Macht“, eine bei Markus verwendete Bezeichnung für Wundertaten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: konnte
  rationale: Gibt die ausdrücklich verneinte Fähigkeit von δύναμαι unmittelbar wieder, ohne die Aussage zu bloßer Unwilligkeit abzuschwächen.
- source_word: ποιῆσαι
  choice: vollbringen
  rationale: Im Deutschen verbindet sich „vollbringen“ natürlich mit „Machttat“ und gibt ποιέω in diesem Zusammenhang würdig und verständlich wieder.
- source_word: οὐδεμίαν δύναμιν
  choice: keine Machttat
  rationale: „Machttat“ bezeichnet hier eine machtvolle, wunderhafte Tat und bewahrt den sprachlichen Bezug zu δύναμις besser als das stärker deutende „Wunder“.
- source_word: εἰ μὴ
  choice: außer dass
  rationale: Kennzeichnet klar die Ausnahme von der vorausgehenden Verneinung und führt den folgenden Satzteil idiomatisch ein.
- source_word: ὀλίγοις ἀρρώστοις
  choice: einigen Kranken
  rationale: Gibt die kleine, unbestimmte Zahl natürlich wieder; „einigen“ ist im heutigen Deutsch flüssiger als „wenigen“ in Verbindung mit der folgenden Handlung, ohne den begrenzten Umfang aufzuheben.
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: die Hände auflegte
  rationale: Entspricht der üblichen deutschen Wendung für das körperliche Auflegen der Hände.
- source_word: ἐθεράπευσεν
  choice: sie heilte
  rationale: „Heilte“ ist die direkte und kontextgemäße Wiedergabe von θεραπεύω; das Pronomen macht den deutschen Bezug eindeutig.
theological_decisions:
- issue: Ob οὐκ ἐδύνατο abgeschwächt werden soll, um keine Begrenzung Jesu anzudeuten
  choice: Die klare Aussage „er konnte dort keine Machttat vollbringen“ beibehalten
  alternative: „Er wollte dort keine Machttat vollbringen“ oder „er vollbrachte dort keine Machttat“
  rationale: Der griechische Text verwendet ausdrücklich das verneinte δύναμαι und spricht damit von Nicht-Können. Die Übersetzung bewahrt diese theologische Spannung, statt sie durch eine Erklärung als bloße Unwilligkeit aufzulösen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. „Machttat“ ist bibelsprachlich geprägt, aber transparent und bewahrt den Bezug zum griechischen δύναμις.
