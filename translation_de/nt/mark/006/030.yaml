  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: de
  text: Und die Apostel versammelten sich bei Jesus und berichteten ihm alles, was sie getan und was sie gelehrt hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάγονται
  choice: kamen … zusammen
  rationale: Das historische Präsens wird im Deutschen natürlich im Präteritum wiedergegeben. „Zusammenkommen“ bewahrt den gemeinschaftlichen Sinn des Verbs.
- source_word: ἀπόστολοι
  choice: Apostel
  rationale: Hier bezeichnet der etablierte Ausdruck die von Jesus ausgesandte Gruppe in ihrer beauftragten Rolle.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: bei Jesus
  rationale: In Verbindung mit „zusammenkommen“ gibt „bei Jesus“ das Zusammenfinden zu seiner Person im natürlichen Deutschen wieder, ohne ein bloß statisches Beisammensein zu behaupten.
- source_word: ἀπήγγειλαν
  choice: berichteten
  rationale: Das Verb bezeichnet hier die Rückmeldung über den zuvor ausgeführten Auftrag; „berichteten“ trifft diesen Sinn präzise.
- source_word: πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν
  choice: alles, was sie getan und was sie gelehrt hatten
  rationale: „Alles“ bewahrt die umfassende Aussage von πάντα. Die Wiederholung von „was“ bildet die beiden parallelen griechischen Relativsätze ab, während das Plusquamperfekt die vor dem Bericht liegenden Tätigkeiten natürlich ausdrückt.
theological_decisions:
- issue: Bezeichnung der zurückkehrenden Jünger als ἀπόστολοι
  choice: Apostel
  alternative: Boten / Gesandte
  rationale: „Apostel“ bewahrt die im Kontext erkennbare Rollenbezeichnung der ausgesandten Jünger; eine allgemeine Wiedergabe als „Boten“ würde diese Bezeichnung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Erzählzeit. Die parallele Struktur von Tun und Lehren bleibt sichtbar; unnötige Explizierungen wie „wieder“ oder „von ihrer Reise“ wurden vermieden.
