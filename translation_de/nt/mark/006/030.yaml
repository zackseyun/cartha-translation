- from: Und die Apostel kamen bei Jesus zusammen und berichteten ihm alles, was sie getan und was sie gelehrt hatten.
  to: Und die Apostel versammelten sich bei Jesus und berichteten ihm alles, was sie getan und was sie gelehrt hatten.
  rationale: Eine geringe stilistisch-semantische Glättung ersetzt „kamen bei Jesus zusammen“ durch das idiomatischere „versammelten sich bei Jesus“. Sinn, Erzählzeit, die umfassende Aussage und die parallele Struktur des griechischen Textes bleiben unverändert erhalten.
