review_pass:
  verdict: approve
  source_fidelity: Der Entwurf gibt den griechischen Text vollständig und zutreffend wieder. „Kommt mit ... nur ihr allein“ erfasst sowohl die Einladung Δεῦτε als auch den Nachdruck von ὑμεῖς αὐτοὶ κατ’ ἰδίαν. „Einsamer Ort“ gibt ἔρημος angemessen als abgelegenen bzw. unbewohnten Ort wieder, ohne eine moderne Sandwüste vorauszusetzen. Die fortlaufende Bewegung vieler Menschen und die fehlende Möglichkeit zu essen sind sachgerecht wiedergegeben.
  naturalness: Modernes Standarddeutsch, flüssig und idiomatisch. „Ruht euch ein wenig aus“ sowie „nicht einmal Zeit zum Essen“ sind besonders natürlich. Die Stellung von „nur ihr allein“ ist leicht markiert, aber als emphatische Wiedergabe der griechischen Doppelbetonung gut verständlich und stilistisch vertretbar.
  terminology: Keine problematischen theologischen oder namensbezogenen Entscheidungen. „Menschen“ ist eine sinnvolle, nicht sinnverändernde Verdeutlichung der substantivierten Partizipien. Die Fußnote zu „einsamen Ort“ wahrt die lexikalische Spannweite von ἔρημος; die zweite Fußnote bietet die passende Alternative zu εὐκαιρέω.
