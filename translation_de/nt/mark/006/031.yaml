id: MRK.6.31
reference: Mark 6:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Kommt mit an einen einsamen Ort[a], nur ihr allein, und ruht euch ein wenig aus.“ Denn viele Menschen kamen und gingen, und sie hatten nicht einmal Zeit zum Essen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen abgelegenen Ort“ oder „an einen menschenleeren Ort“. Das griechische Wort bezeichnet einen unbewohnten oder abgeschiedenen Ort, nicht unbedingt eine Wüste im heutigen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „sie hatten nicht einmal Gelegenheit zu essen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: er sagte
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben; die Handlung und ihre Erzählfunktion bleiben erhalten.
- source_word: Δεῦτε
  choice: Kommt mit
  rationale: Die auffordernde Partikel lädt die Angesprochenen ein, sich mit Jesus von der Menge wegzubewegen. „Kommt mit“ ist im Deutschen natürlicher als ein isoliertes „Kommt“.
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: nur ihr allein
  rationale: Die betonten Pronomen und die Wendung κατ’ ἰδίαν unterstreichen gemeinsam, dass die Jünger abgesondert von den übrigen Menschen gehen sollen. Die deutsche Formulierung bewahrt diesen Nachdruck, ohne unnötig zu wiederholen.
- source_word: ἔρημον τόπον
  choice: einen einsamen Ort
  rationale: ἔρημος bezeichnet hier einen unbewohnten, abgelegenen oder menschenleeren Ort, nicht zwingend eine Wüste. „Einsam“ vermittelt die beabsichtigte Abgeschiedenheit klar und natürlich.
- source_word: ἀναπαύσασθε ὀλίγον
  choice: ruht euch ein wenig aus
  rationale: Die mediale Imperativform bezeichnet Erholung von der Arbeit; ὀλίγον gibt eine kurze Dauer an. Die Wendung ist idiomatisches modernes Deutsch.
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: viele Menschen kamen und gingen
  rationale: Die substantivierten Partizipien beschreiben einen anhaltenden Zustrom und Weggang. „Menschen“ wird zur natürlichen deutschen Verdeutlichung ergänzt; „kamen und gingen“ wahrt den fortlaufenden Charakter im Kontext.
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: sie hatten nicht einmal Zeit zum Essen
  rationale: εὐκαιρέω bedeutet, Zeit, Muße oder Gelegenheit zu haben. „Zeit haben“ ist in diesem Zusammenhang die natürliche deutsche Entsprechung; οὐδέ wird durch „nicht einmal“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp und einladend; die griechische Betonung der Absonderung wird durch „nur ihr allein“ bewahrt.
