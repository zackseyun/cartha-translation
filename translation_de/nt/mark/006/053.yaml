source:
  edition: SBLGNT
  text: Καὶ διαπεράσαντες ⸂ἐπὶ τὴν γῆν ἦλθον εἰς⸃ Γεννησαρὲτ καὶ προσωρμίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: de
  text: Und nachdem sie hinübergefahren waren, kamen sie bei Gennesaret ans Land und legten an.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gingen vor Anker“. Das griechische Verb bezeichnet im nautischen Sinn das Anlegen oder Festmachen eines Bootes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καί
  choice: Und
  rationale: Der einfache Anschluss setzt die fortlaufende Erzählung natürlich fort, ohne eine stärkere zeitliche Folgerung einzutragen.
- source_word: διαπεράσαντες
  choice: nachdem sie hinübergefahren waren
  rationale: Das Aoristpartizip bezeichnet eine Handlung, die dem Eintreffen und Anlegen vorausgeht; „hinüberfahren“ passt zum Kontext der Bootsfahrt.
- source_word: ἐπὶ τὴν γῆν ἦλθον εἰς Γεννησαρέτ
  choice: kamen sie bei Gennesaret ans Land
  rationale: Die Formulierung gibt sowohl das Erreichen des Landes als auch Gennesaret als Ziel wieder. „Bei Gennesaret“ ist im Deutschen idiomatisch, ohne γῆ unnötig zu verallgemeinern.
- source_word: Γεννησαρέτ
  choice: Gennesaret
  rationale: Der Ortsname wird in seiner etablierten deutschen Form wiedergegeben.
- source_word: προσωρμίσθησαν
  choice: legten an
  rationale: Das Verb hat einen spezifisch nautischen Sinn und bezeichnet das Heranbringen beziehungsweise Festmachen eines Bootes; „legten an“ ist dafür eine natürliche deutsche Wiedergabe.
theological_decisions: []
