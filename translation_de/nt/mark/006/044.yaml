revisions:
- from: Und die, die von den Broten gegessen hatten, waren fünftausend Männer.[a]
  to: Und diejenigen, die die Brote gegessen hatten, waren fünftausend Männer.[a]
  rationale: Die Revision glättet die deutsche Formulierung und gibt die konkreten Brote als direktes Objekt wieder. Die Zahl und die ausdrücklich männliche Bezeichnung bleiben unverändert erhalten; aus ihr wird keine Aussage über mögliche weitere Anwesende abgeleitet.
  reviewer_model: gpt-5.6-terra
