  text: καὶ ἦσαν οἱ φαγόντες ⸂τοὺς ἄρτους⸃ πεντακισχίλιοι ἄνδρες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: de
  text: Und diejenigen, die die Brote gegessen hatten, waren fünftausend Männer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort bezeichnet ausdrücklich Männer, nicht Menschen im Allgemeinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: waren
  rationale: Das Imperfekt von εἰμί dient hier als einfache Kopula zur Angabe der Zahl; „waren“ ist direkt und fügt keine im Griechischen nicht ausdrücklich enthaltene Zählvorstellung hinzu.
- source_word: οἱ φαγόντες
  choice: die, die … gegessen hatten
  rationale: Das substantivierte Aoristpartizip bezeichnet die Gruppe anhand des abgeschlossenen Essens. Im Deutschen gibt das Plusquamperfekt die gegenüber der anschließenden Zahlenangabe bereits vollzogene Handlung natürlich wieder.
- source_word: τοὺς ἄρτους
  choice: von den Broten
  rationale: ἄρτος kann „Brot“ oder „Brotlaib“ bezeichnen. Der Plural verweist hier konkret auf die Brote der Speisung; nach „essen“ ist die partitive Formulierung „von den Broten“ im Deutschen natürlich.
- source_word: πεντακισχίλιοι
  choice: fünftausend
  rationale: Die Kardinalzahl wird unmittelbar und ohne idiomatische Anpassung wiedergegeben.
- source_word: ἄνδρες
  choice: Männer
  rationale: ἀνήρ bezeichnet hier spezifisch Männer und nicht allgemein Menschen; diese Geschlechtsspezifik bleibt erhalten.
theological_decisions:
- issue: Geschlechtsspezifische Bezeichnung der Gezählten
  choice: ἄνδρες im Haupttext mit „Männer“ wiedergeben.
  alternative: Menschen
  rationale: Der griechische Text verwendet nicht einen allgemeinen Ausdruck für Personen, sondern das spezifisch männliche ἀνήρ. Die Übersetzung bewahrt diese Aussage, ohne daraus zu folgern, ob oder wie viele weitere Personen anwesend waren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung „die, die“ ist idiomatisch und bildet die substantivierte Partizipialkonstruktion klar ab. Nur die sachlich hilfreiche Fußnote zur geschlechtsspezifischen Zählbezeichnung wurde beibehalten; die mögliche Wiedergabe von ἄρτοι als „Brot“ statt „Brote“ erfordert im Deutschen hier keine eigene Fußnote.
