source:
  edition: SBLGNT
  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: de
  text: 'Denn sie alle sahen ihn und erschraken. Doch er redete sofort mit ihnen und sagte: »Habt Mut! Ich bin es[a]. Habt keine Angst!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Ich bin.'
    reason: Bewahrt die knappe griechische Formulierung und ihre mögliche theologische Resonanz neben der idiomatischen deutschen Selbstidentifikation.
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: erschraken
  rationale: Das Verb bezeichnet hier eine starke innere Erschütterung durch die unerwartete Erscheinung; »erschraken« ist im Kontext natürlich und verständlich.
- source_word: Θαρσεῖτε
  choice: Habt Mut!
  rationale: Der Imperativ fordert die Jünger auf, angesichts ihrer Angst neuen Mut zu fassen; die knappe deutsche Wendung bewahrt den auffordernden Ton.
- source_word: ἐγώ εἰμι
  choice: Ich bin es
  rationale: Im unmittelbaren Gespräch ist dies eine natürliche Selbstidentifikation. Eine Fußnote bewahrt zugleich den auffälligen wörtlichen Wortlaut »Ich bin«, ohne eine mögliche theologische Anspielung festzulegen.
- source_word: μὴ φοβεῖσθε
  choice: Habt keine Angst!
  rationale: Gibt das Verbot in natürlichem modernem Deutsch wieder und nimmt die konkrete Furcht der Jünger auf.
theological_decisions:
- issue: Mögliche Gottesoffenbarungs-Anspielung in ἐγώ εἰμι
  choice: '»Ich bin es« im Haupttext mit der Fußnote »Wörtlich: Ich bin«'
  alternative: »Ich bin« unmittelbar im Haupttext
  rationale: Die griechische Formulierung kann im Kontext schlicht der Selbstidentifikation dienen, kann aber zugleich einen tieferen biblisch-theologischen Nachklang tragen. Haupttext und Fußnote bewahren diese Spannung, ohne sie einseitig aufzulösen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die kurzen Zurufe Jesu bleiben unmittelbar; der historische Präsenswechsel bei λέγει wird für einen natürlichen deutschen Erzählfluss als »sagte« wiedergegeben.
