  terminology: „Geistererscheinung“ ist eine tragfähige, nicht unnötig festlegende Wiedergabe von φάντασμα. Die Fußnote bietet mit „Gespenst“ eine geläufige Alternative und erläutert die Bedeutungsrichtung angemessen. „See“ ist für den erzählten Gewässerkontext natürlich, ohne den Sinn von ἐπὶ τῆς θαλάσσης abzuschwächen.
