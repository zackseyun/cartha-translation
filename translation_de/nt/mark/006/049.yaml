id: MRK.6.49
reference: Mark 6:49
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: de
  text: Als sie ihn aber auf dem See gehen sahen, meinten sie, es sei eine Geistererscheinung,[a] und schrien auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ein Gespenst; das griechische Wort bezeichnet eine geisterhafte Erscheinung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Als sie ... aber
  rationale: δέ markiert einen leichten Gegensatz bzw. den Übergang zur Reaktion der Jünger; das substantivierte οἱ bezeichnet die bereits genannte Gruppe.
- source_word: ἰδόντες αὐτόν
  choice: als sie ihn ... sahen
  rationale: Das aoristische Partizip wird im natürlichen Deutschen temporal wiedergegeben; αὐτόν bezieht sich auf Jesus.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: auf dem See gehen
  rationale: ἐπί mit Genitiv bezeichnet hier das Gehen auf der Wasserfläche. Im Deutschen ist „See“ für den See Gennesaret natürlicher als „Meer“, ohne den Wundercharakter abzuschwächen.
- source_word: ἔδοξαν
  choice: meinten sie
  rationale: δοκέω bezeichnet hier eine irrtümliche Annahme; „meinten“ ist idiomatisch und wahrt diesen Sinn.
- source_word: ὅτι φάντασμά ἐστιν
  choice: es sei eine Geistererscheinung
  rationale: Der Konjunktiv I gibt die indirekte Rede nach dem vergangenen Hauptverb natürlich wieder. φάντασμα bezeichnet eine gespenstische Erscheinung, ohne ihre vermeintliche Natur genauer festzulegen.
- source_word: καὶ ἀνέκραξαν
  choice: und schrien auf
  rationale: ἀνακράζω bezeichnet einen lauten, plötzlichen Schrei; „schrien auf“ passt zum erschrockenen Reagieren, ohne zusätzliche Einzelheiten einzutragen.
theological_decisions:
- issue: Art von Jesu Bewegung am Wasser
  choice: auf dem See gehen
  alternative: am See entlanggehen
  rationale: Im Erzählzusammenhang bezeichnet ἐπὶ τῆς θαλάσσης das Gehen auf der Wasseroberfläche und nicht lediglich am Ufer.
- issue: Natur des vermeintlich Wahrgenommenen
  choice: Geistererscheinung
  alternative: Gespenst
  rationale: φάντασμα benennt eine geisterhafte Erscheinung. „Geistererscheinung“ bewahrt die Offenheit des griechischen Ausdrucks besser als das konkretere „Gespenst“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Erzählstil. Die Satzstellung bleibt flüssig; „See“ entspricht im deutschen Sprachgebrauch dem See Gennesaret, während die Fußnote die lexikalische Spannweite von φάντασμα transparent macht.
