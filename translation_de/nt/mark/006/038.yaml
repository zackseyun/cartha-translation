  text: ὁ δὲ λέγει αὐτοῖς· Πόσους ⸂ἔχετε ἄρτους⸃; ⸀ὑπάγετε ἴδετε. καὶ γνόντες λέγουσιν· Πέντε, καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: de
  text: 'Er aber sagte zu ihnen: „Wie viele Brote habt ihr? Geht und seht nach.“ Als sie es herausgefunden hatten, sagten sie: „Fünf, und zwei Fische.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: Brote
  rationale: Bezeichnet hier die vorhandenen Brotlaibe; „Brote“ ist im Deutschen natürlich und bewahrt die zählbare Form des griechischen Plurals.
- source_word: ὑπάγετε ἴδετε
  choice: Geht und seht nach
  rationale: Gibt die beiden Imperative natürlich wieder; „seht nach“ drückt das verlangte Überprüfen des Vorrats aus.
- source_word: γνόντες
  choice: als sie es herausgefunden hatten
  rationale: Das Partizip bezeichnet, dass sie sich Gewissheit über die Menge verschafft hatten, bevor sie antworteten.
- source_word: ἰχθύας
  choice: Fische
  rationale: Direkte und kontextgemäße Wiedergabe des griechischen Plurals.
