source:
  edition: SBLGNT
  text: καὶ ἤνεγκεν τὴν κεφαλὴν αὐτοῦ ἐπὶ πίνακι καὶ ἔδωκεν αὐτὴν τῷ κορασίῳ, καὶ τὸ κοράσιον ἔδωκεν αὐτὴν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/028.yaml
  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: de
  text: Und er brachte dessen Kopf auf einer Platte[a] und gab ihn dem Mädchen; und das Mädchen gab ihn ihrer Mutter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf einem Tablett. Das griechische Wort bezeichnet eine Servierplatte oder einen Servierteller.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: brachte
  rationale: Der Aorist von φέρω bezeichnet hier das konkrete Herbeibringen des abgeschlagenen Kopfes. „Brachte“ ist natürlich und legt die Art des Tragens nicht unnötig fest.
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: seinen Kopf
  rationale: Die idiomatische deutsche Possessivkonstruktion gibt den Rückbezug auf Johannes den Täufer klar wieder.
- source_word: ἐπὶ πίνακι
  choice: auf einer Platte
  rationale: πίναξ bezeichnet hier im Festmahlkontext eine größere Servierplatte oder einen Servierteller. „Platte“ ist prägnant und wahrt das konkrete Bild.
- source_word: ἔδωκεν
  choice: gab
  rationale: „Gab“ entspricht δίδωμι unmittelbar. Die Wiederholung in beiden Satzteilen bleibt wie im Griechischen erhalten.
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: dem Mädchen / das Mädchen
  rationale: κοράσιον bezeichnet ein Mädchen. Die schlichte Wiedergabe ist modern und vermeidet das altertümliche „Maid“.
- source_word: τῇ μητρὶ αὐτῆς
  choice: ihrer Mutter
  rationale: Die Formulierung gibt den Bezug des griechischen Possessivpronomens auf das Mädchen idiomatisch und eindeutig wieder.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Erzählsprache. Das wiederholte „gab“ bildet die knappe Abfolge des griechischen Textes ab; das Semikolon trennt die beiden aufeinanderfolgenden Übergaben, ohne ihre enge Verbindung aufzulösen.
