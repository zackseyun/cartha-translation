lexical_decisions:
- source_word: ἔφαγον
  choice: aßen
  rationale: Der Aorist von ἐσθίω bezeichnet hier schlicht das Essen. „Aßen“ ist die natürliche deutsche Entsprechung; ein ergänztes Objekt ist nicht nötig.
- source_word: πάντες
  choice: sie … alle
  rationale: Das substantivisch gebrauchte Adjektiv bezieht sich im Kontext auf die gesamte Menge. Die Stellung „sie aßen alle“ klingt natürlich und bewahrt den umfassenden Sinn.
- source_word: ἐχορτάσθησαν
  choice: wurden satt
  rationale: Das Passiv von χορτάζω besagt, dass alle vollständig zu essen bekamen und gesättigt waren. „Wurden satt“ ist im modernen Deutsch idiomatisch und gibt sowohl Vorgang als auch Ergebnis treffend wieder.
- source_word: καὶ … καὶ
  choice: Und … und …
  rationale: Die wiederholte Konjunktion verbindet die beiden Handlungen in Markus’ schlichter, parataktischer Erzählweise, ohne den Zusammenhang weiter auszudeuten.
