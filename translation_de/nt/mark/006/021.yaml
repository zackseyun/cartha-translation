source:
  edition: SBLGNT
  text: Καὶ γενομένης ἡμέρας εὐκαίρου ὅτε Ἡρῴδης τοῖς γενεσίοις αὐτοῦ δεῖπνον ⸀ἐποίησεν τοῖς μεγιστᾶσιν αὐτοῦ καὶ τοῖς χιλιάρχοις καὶ τοῖς πρώτοις τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/021.yaml
  text: And when an opportune day came[a], Herod gave a banquet on his birthday for his nobles and military commanders and the leading men of Galilee[d][c][b],
translation:
  language: de
  text: Und als sich eine günstige Gelegenheit ergab[a], veranstaltete Herodes anlässlich seines Geburtstags ein Festmahl für seine hohen Würdenträger, die militärischen Befehlshaber und die führenden Männer Galiläas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als ein geeigneter Tag kam“. Das griechische Wort kann einen passenden oder strategisch günstigen Zeitpunkt bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „machte ein Mahl“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Bewahrt den für Markus typischen erzählerischen Anschluss.
- source_word: γενομένης ἡμέρας εὐκαίρου
  choice: als ein geeigneter Tag kam
  rationale: Der Genitivus absolutus beschreibt den Eintritt eines passenden, im Erzählzusammenhang strategisch günstigen Zeitpunkts. „Geeignet“ wahrt die mögliche Unheilsperspektive, ohne sie ausdrücklich hinzuzufügen.
- source_word: ὅτε
  choice: in die Satzkonstruktion mit „als“ einbezogen
  rationale: Der ὅτε-Satz bestimmt, wodurch dieser geeignete Tag gekennzeichnet war. Im Deutschen vermeidet eine zusammengezogene Konstruktion die schwerfällige Wiederholung „als … als“.
- source_word: τοῖς γενεσίοις αὐτοῦ
  choice: an seinem Geburtstag
  rationale: γενέσια bezeichnet die Feier beziehungsweise den Anlass des Geburtstags; die deutsche Formulierung ist idiomatisch und genau.
- source_word: δεῖπνον ἐποίησεν
  choice: gab … ein Festmahl
  rationale: Die wörtliche Wendung „machte ein Mahl“ wird idiomatisch als Ausrichtung eines festlichen Mahls wiedergegeben; die hochrangige Gästeliste stützt „Festmahl“.
- source_word: τοῖς μεγιστᾶσιν αὐτοῦ
  choice: für seine hohen Würdenträger
  rationale: μεγιστᾶνες bezeichnet hochgestellte Personen oder Magnaten im Umfeld des Herrschers. „Hohe Würdenträger“ ist verständlich und vermeidet die engere Festlegung auf erblichen Adel.
- source_word: τοῖς χιλιάρχοις
  choice: die militärischen Befehlshaber
  rationale: Gibt die leitende militärische Funktion verständlich wieder, ohne den Ausdruck zu eng als spezifisch römischen Rang festzulegen.
- source_word: τοῖς πρώτοις τῆς Γαλιλαίας
  choice: die führenden Männer Galiläas
  rationale: πρῶτοι meint die gesellschaftlich oder politisch herausragenden Personen; die männliche Referenz des historischen Gästekreises bleibt erhalten.
- source_word: Ἡρῴδης
  choice: Herodes
  rationale: Verwendet die im Deutschen etablierte Namensform.
theological_decisions: []
