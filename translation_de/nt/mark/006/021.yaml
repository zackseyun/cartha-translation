  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung bleibt gut verständlich und bewahrt zugleich den markinischen Erzählanschluss. „Hohe Würdenträger“ vermeidet eine unnötige historische Verengung von μεγιστᾶνες auf erblichen Adel.
