source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: de
  text: Und er ging von dort weg und kam in seinen Heimatort, und seine Jünger folgten ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder unter Beibehaltung des historischen Präsens: „Und er ging von dort weg und kommt in seinen Heimatort, und seine Jünger folgen ihm.“ Das Griechische verwendet hier Präsensformen, um die Erzählung lebendig zu gestalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: ging … weg
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Verlassen des bisherigen Ortes. „ging … weg“ bewahrt die Bewegungsvorstellung und klingt im Deutschen natürlich.
- source_word: ἐκεῖθεν
  choice: von dort
  rationale: Das Ortsadverb bezeichnet den Ausgangspunkt der Bewegung; „von dort“ ist knapp und präzise.
- source_word: ἔρχεται
  choice: kam
  rationale: Das historische Präsens wird für einen flüssigen deutschen Erzählstil im Präteritum wiedergegeben. „kam“ bewahrt die durch ἔρχομαι ausgedrückte Bewegung zum Ziel hin.
- source_word: πατρίδα
  choice: Heimatstadt
  rationale: πατρίς bezeichnet hier im Kontext Jesu Heimatort, nicht ein Vaterland im politischen Sinn. „Heimatstadt“ ist verständlich und weist passend auf Nazaret.
- source_word: ἀκολουθοῦσιν
  choice: folgten
  rationale: Auch dieses historische Präsens wird im deutschen Erzählstil als Präteritum wiedergegeben. „folgten“ erhält zugleich die für das Evangelium wichtige Sprache der Nachfolge.
- source_word: μαθηταὶ
  choice: Jünger
  rationale: „Jünger“ ist im Evangelienkontext die etablierte und sachlich passende Bezeichnung für μαθηταί; sie umfasst sowohl Lernen als auch persönliche Nachfolge.
theological_decisions:
- issue: Wiedergabe der historischen Präsensformen ἔρχεται und ἀκολουθοῦσιν
  choice: 'Präteritum: „kam“ und „folgten“'
  alternative: 'Historisches Präsens: „kommt“ und „folgen“'
  rationale: Dies ist eine stilistische, nicht eine lehrmäßige Entscheidung. Das Präteritum entspricht natürlichem modernem deutschen Erzählstil; eine Fußnote macht die lebhaftere griechische Form transparent.
- issue: Bedeutungsumfang von πατρίς
  choice: „Heimatstadt“
  alternative: „Heimat“, „Heimatort“ oder „Vaterland“
  rationale: Der Zusammenhang zielt auf Jesu Heimatort Nazaret. „Heimatstadt“ gibt diesen konkreten lokalen Bezug wieder, ohne einen politischen oder nationalen Sinn einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die koordinierende Struktur des Griechischen bleibt weitgehend erhalten; vor dem letzten Satzglied steht zur besseren deutschen Lesbarkeit ein Semikolon.
