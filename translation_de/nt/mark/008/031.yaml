id: MRK.8.31
reference: Mark 8:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: de
  text: Und er begann sie zu lehren, dass der Menschensohn vieles erleiden und von den Ältesten, den führenden Priestern und den Schriftgelehrten verworfen und getötet werden und nach drei Tagen[a] auferstehen müsse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nach drei Tagen“. Manche Übersetzungen geben die Zeitangabe sinngemäß mit „am dritten Tag“ wieder; der griechische Text bei Markus lautet jedoch „nach drei Tagen“.'
    reason: Bewahrt die markinische Zeitangabe und macht die verbreitete alternative Wiedergabe transparent, ohne den Haupttext an Parallelstellen anzugleichen.
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: begann sie zu lehren
  rationale: Die Verbindung von ἄρχομαι mit dem Infinitiv bezeichnet den Beginn einer Handlung. Die Formulierung ist im Deutschen natürlich und bewahrt den erzählerischen Übergang.
- source_word: δεῖ
  choice: müsse
  rationale: Der abhängige dass-Satz verlangt hier natürlich den Konjunktiv der indirekten Rede. „Müsse“ bewahrt die starke, aber nicht näher erklärte Notwendigkeit des griechischen δεῖ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte Wiedergabe bewahrt den Titel und seine biblischen Bezüge, ohne ihn auszudeuten.
- source_word: πολλὰ παθεῖν
  choice: vieles erleiden
  rationale: Das substantivisch gebrauchte Neutrum Plural πολλά wird mit „vieles“ eng und zugleich idiomatisch wiedergegeben; „erleiden“ trägt im Deutschen die erforderliche Schwere.
- source_word: ἀποδοκιμασθῆναι
  choice: verworfen werden
  rationale: „Verworfen“ bringt die bewusste Ablehnung durch die genannten Autoritäten zum Ausdruck und entspricht dem würdevollen biblischen Register.
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: von den Ältesten
  rationale: Gemeint ist die anerkannte jüdische Führungsgruppe, nicht lediglich ältere Männer. „Älteste“ ist die historisch etablierte Bezeichnung.
- source_word: τῶν ἀρχιερέων
  choice: den führenden Priestern
  rationale: Der Plural bezeichnet die leitenden Angehörigen der hohepriesterlichen Kreise und nicht mehrere gleichzeitig amtierende Hohepriester. „Führende Priester“ ist für heutige Leser verständlich und historisch sachgerecht.
- source_word: τῶν γραμματέων
  choice: den Schriftgelehrten
  rationale: „Schriftgelehrte“ ist die etablierte deutsche Bezeichnung und wahrt die historische sowie religiöse Funktion der Gruppe.
- source_word: ἀποκτανθῆναι
  choice: getötet werden
  rationale: Die direkte passive Wiedergabe entspricht dem griechischen Infinitiv, ohne zusätzlich eine juristische Hinrichtung ausdrücklich einzutragen.
- source_word: μετὰ τρεῖς ἡμέρας
  choice: nach drei Tagen
  rationale: μετά mit dem Akkusativ bedeutet hier seinem gewöhnlichen Sinn nach „nach“. Diese Wiedergabe bewahrt Markus’ Formulierung und harmonisiert sie nicht mit Parallelstellen, die „am dritten Tag“ sagen.
- source_word: ἀναστῆναι
  choice: auferstehen
  rationale: Der intransitive Infinitiv bezeichnet das Aufstehen aus dem Tod. „Auferstehen“ ist im Deutschen präzise und bewahrt die aktive Form des Griechischen.
theological_decisions:
- issue: Die mit δεῖ ausgedrückte Notwendigkeit des Leidenswegs
  choice: müsse
  alternative: es sei notwendig
  rationale: „Müsse“ erhält das theologische Gewicht der Notwendigkeit, ohne deren göttlichen oder heilsgeschichtlichen Mechanismus im Vers näher zu bestimmen.
- issue: Zeitangabe μετὰ τρεῖς ἡμέρας
  choice: nach drei Tagen
  alternative: am dritten Tag
  rationale: Die Übersetzung folgt Markus’ eigener griechischer Formulierung. „Am dritten Tag“ wäre eine Angleichung an parallele Passionsankündigungen und würde die vorhandene Spannung stillschweigend beseitigen.
- issue: Aktive Form der Auferstehungsaussage
  choice: auferstehen
  alternative: auferweckt werden
  rationale: ἀναστῆναι ist hier intransitiv. Die aktive deutsche Form wahrt die grammatische Gestalt, ohne damit eine weitergehende Aussage über das göttliche Handeln auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau hält die Reihe der vier Infinitive zusammen und lässt das abschließende „müsse“ auf Leiden, Verwerfung, Tötung und Auferstehung gleichermaßen bezogen sein. „Führende Priester“ vermeidet das im modernen Deutsch leicht missverständliche pluralische „Hohepriester“.
