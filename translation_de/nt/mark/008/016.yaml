base_translation:
  language: en
  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: de
  text: Und sie redeten miteinander darüber, dass sie kein Brot hatten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: „keine Brotlaibe“.'
    reason: ἄρτους steht im Plural und kann im unmittelbaren Kontext einzelner Laibe konkret wiedergegeben werden.
lexical_decisions:
- source_word: διελογίζοντο
  choice: sie besprachen
  rationale: Das Imperfekt bezeichnet ein andauerndes Gespräch beziehungsweise Erwägen. „Sie besprachen“ ist im modernen Deutschen natürlich und gibt den wechselseitigen Vorgang wieder.
- source_word: πρὸς ἀλλήλους
  choice: miteinander
  rationale: Die Wendung bezeichnet die gegenseitige Interaktion und wird idiomatisch mit „miteinander“ wiedergegeben.
- source_word: ὅτι
  choice: dass
  rationale: ὅτι leitet hier am ehesten den Inhalt des Gesprächs ein. Die mögliche kausale Lesart bleibt als Übersetzungsalternative in einer Fußnote erhalten.
- source_word: ἄρτους
  choice: Brot
  rationale: Obwohl der griechische Plural einzelne Brote beziehungsweise Laibe bezeichnen kann, ist „Brot“ im Deutschen hier die natürliche Sammelbezeichnung. Wegen der im Kontext gezählten Brote wird die wörtlichere Alternative in einer Fußnote genannt.
- source_word: οὐκ ἔχουσιν
  choice: sie kein Brot hatten
  rationale: Das griechische Präsens steht innerhalb der vom Imperfekt abhängigen Rede. Das deutsche Präteritum fügt sich natürlich in den Erzählrahmen ein, ohne den Sinn zu verändern.
theological_decisions:
- issue: Funktion von ὅτι
  choice: 'Inhaltssatz: „dass sie kein Brot hatten“'
  alternative: 'Kausalsatz: „weil sie kein Brot hatten“'
  rationale: Der Inhaltssatz passt gut zum Verb des Besprechens; grammatisch ist jedoch auch eine kausale Deutung möglich und sollte nicht verschwiegen werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit schlichter, würdiger Erzählweise. Die Formulierung folgt optimaler Äquivalenz und hält die syntaktische sowie lexikalische Mehrdeutigkeit in der Fußnote offen.
