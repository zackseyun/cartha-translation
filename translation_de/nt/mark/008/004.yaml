id: MRK.8.4
reference: Mark 8:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: de
  text: 'Da antworteten ihm seine Jünger: „Woher soll jemand hier in dieser menschenleeren Gegend Brot nehmen können, um diese Leute satt zu machen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: antworteten
  rationale: Das übliche deutsche Erzählverb gibt die Reaktion der Jünger direkt und natürlich wieder.
- source_word: ὅτι
  choice: Doppelpunkt und Anführungszeichen
  rationale: ὅτι leitet hier direkte Rede ein; im modernen Deutschen wird diese Funktion idiomatisch durch Zeichensetzung ausgedrückt.
- source_word: Πόθεν
  choice: Woher
  rationale: Bewahrt die wörtliche Frage nach der Herkunft beziehungsweise Quelle der Versorgung, ohne sie vorschnell als reine Wie-Frage wiederzugeben.
- source_word: τούτους
  choice: diese Leute
  rationale: Macht den Bezug auf die anwesende Menschenmenge verständlich, ohne die Gruppe auf Männer einzugrenzen.
- source_word: δυνήσεταί τις
  choice: soll jemand ... nehmen können
  rationale: Gibt die erwartete beziehungsweise prospektive Möglichkeit in einer natürlichen deutschen Frage wieder; zusammen mit »woher« wird die Beschaffung des Brotes idiomatisch ausgedrückt.
- source_word: ὧδε
  choice: hier
  rationale: Direkte und natürliche Wiedergabe des lokalen Adverbs.
- source_word: χορτάσαι
  choice: satt zu machen
  rationale: Bezeichnet hier das ausreichende Speisen bis zur Sättigung und ist im Deutschen konkreter und natürlicher als »zufriedenzustellen«.
- source_word: ἄρτων
  choice: Brot
  rationale: Bewahrt die konkrete Nahrungsbezeichnung, ohne durch »Brote« einzelne Laibe stärker hervorzuheben, als der Kontext verlangt.
- source_word: ἐπ’ ἐρημίας
  choice: in dieser menschenleeren Gegend
  rationale: Gibt den unbewohnten, abgelegenen Schauplatz verständlich wieder. Das im Deutschen nötige »dieser« bezieht die Ortsangabe natürlich auf das gegenwärtige »hier«.
theological_decisions:
- issue: Frage nach Quelle oder Möglichkeit der Versorgung
  choice: Die Formulierung beginnt mit »Woher« und bewahrt damit den Schwerpunkt auf der Quelle des Brotes.
  alternative: „Wie kann jemand diese Leute hier in der Einöde mit Brot satt machen?“
  rationale: Πόθεν bedeutet primär »woher«. Die natürlichere deutsche Konstruktion mit »Brot nehmen können« macht den Vers verständlich, ohne die Frage auf ein bloßes »Wie« zu reduzieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. »Menschenleere Gegend« vermeidet das missverständliche Bild einer Sandwüste und bezeichnet einen abgelegenen, unbewohnten Ort. Die Satzstellung ist gegenüber dem Griechischen idiomatisch angepasst, während »Woher«, »hier«, »Brot« und das Sattmachen semantisch erhalten bleiben.
