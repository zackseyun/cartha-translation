id: MRK.8.38
reference: Mark 8:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: de
  text: Denn wer sich meiner und meiner Worte schämt in dieser ehebrecherischen und sündigen Generation[a], dessen wird sich auch der Menschensohn schämen, wenn er in der Herrlichkeit seines Vaters mit den heiligen Engeln kommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „untreuen und sündigen Generation“. „Ehebrecherisch“ bleibt im Haupttext stehen, weil das Griechische die konkrete prophetische Metapher des Ehebruchs für die Untreue gegenüber Gott verwendet.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: sich meiner … schämt / dessen wird sich … schämen
  rationale: „Sich einer Person oder Sache schämen“ gibt den griechischen Ausdruck unmittelbar und idiomatisch wieder. Die wiederholte Formulierung bewahrt die Gegenseitigkeit zwischen der gegenwärtigen menschlichen Reaktion und der künftigen Reaktion des Menschensohnes.
- source_word: λόγους
  choice: Worte
  rationale: Der Plural entspricht dem griechischen λόγους und bewahrt den persönlichen, sprachlichen Bezug; „Botschaft“ wäre stärker deutend.
- source_word: γενεᾷ
  choice: Generation
  rationale: „Generation“ ist hier die naheliegende Entsprechung und bezeichnet die gegenwärtige menschliche Gemeinschaft in ihrer moralischen Prägung.
- source_word: μοιχαλίδι
  choice: ehebrecherisch
  rationale: Die konkrete prophetische Metapher des Ehebruchs für Untreue bleibt erhalten; „untreu“ wäre verständlicher, würde aber das Bild auflösen.
- source_word: ἁμαρτωλῷ
  choice: sündig
  rationale: „Sündig“ ist die direkte adjektivische Entsprechung und verbindet sich natürlich mit „ehebrecherisch“.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: der Menschensohn
  rationale: Die etablierte Wiedergabe erhält den christologischen Titel und seine biblischen Anklänge, ohne ihn durch „ich“ oder „der Messias“ auszudeuten.
- source_word: δόξῃ
  choice: Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt das Gewicht göttlicher Ehre, Majestät und strahlender Gegenwart und entspricht dem üblichen biblischen Sprachgebrauch.
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: mit den heiligen Engeln
  rationale: Diese natürliche deutsche Formulierung entspricht der attributiven griechischen Konstruktion. Ein Possessivpronomen wie „seinen“ wird nicht ergänzt.
- source_word: ὃς γὰρ ἐὰν
  choice: Denn wer
  rationale: „Denn“ gibt den begründenden Anschluss γάρ wieder; „wer“ erfasst die allgemeine Bedingung knapp und idiomatisch.
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: in dieser … Generation
  rationale: Die Formulierung gibt den gesellschaftlich-moralischen Rahmen wieder, in dem dieses Sich-Schämen geschieht.
- source_word: αὐτόν
  choice: dessen
  rationale: Die Genitivkonstruktion „dessen wird sich … schämen“ ist im Deutschen idiomatisch und bewahrt den generischen Singular des griechischen Pronomens.
theological_decisions:
- issue: Metaphorische Bedeutung von μοιχαλίδι
  choice: „ehebrecherisch“ im Haupttext als prophetische Metapher beibehalten
  alternative: „untreu“
  rationale: Das Griechische verwendet das konkrete Bild des Ehebruchs, das in prophetischer Sprache geistliche und moralische Untreue bezeichnet. Die Beibehaltung erhält die intertextuelle und theologische Tiefe.
- issue: Bezug des Titels „Menschensohn“
  choice: Den Titel „der Menschensohn“ beibehalten
  alternative: „ich“ oder „der Messias“
  rationale: Der griechische Text verwendet einen eigenständigen christologischen Titel mit endzeitlicher Bedeutung. Eine Ersetzung würde seine Anspielungen einebnen und die Spannung des Wortlauts auflösen.
- issue: Generischer Singular αὐτόν
  choice: Mit dem singularischen „dessen“ wiedergeben
  alternative: Pluralische oder geschlechtsneutrale Umformulierung
  rationale: Die Form wahrt die singularische allgemeine Aussage des Ausgangstextes und ist zugleich natürliches Deutsch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweimalige Wendung „sich schämen“ bewahrt die markante Gegenseitigkeit des griechischen Satzes. Der etwas gehobene Genitiv „dessen wird sich … schämen“ ist idiomatisch, prägnant und erhält den Singular.
