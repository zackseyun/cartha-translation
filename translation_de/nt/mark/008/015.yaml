source:
  edition: SBLGNT
  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: de
  text: 'Und er warnte sie immer wieder eindringlich: »Gebt acht! Hütet euch vor dem Sauerteig der Pharisäer und dem Sauerteig des Herodes.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sauerteig“ bezeichnet hier bildlich einen Einfluss, der sich ausbreitet und alles durchdringt. Welche konkrete Haltung oder Lehre gemeint ist, sagt dieser Vers nicht ausdrücklich; vgl. Matthäus 16,6.12 und Lukas 12,1.
    reason: Metapher und Querverweis
lexical_decisions:
- source_word: διεστέλλετο
  choice: warnte sie eindringlich
  rationale: Das Imperfekt bezeichnet hier eine nachdrückliche, möglicherweise wiederholte Warnung. Die deutsche Formulierung gibt sowohl den warnenden Kontext als auch den Nachdruck natürlich wieder, ohne eine bloß einmalige förmliche Anordnung zu unterstellen.
- source_word: λέγων
  choice: durch einen Doppelpunkt wiedergegeben
  rationale: Das Partizip führt den Inhalt der Warnung ein. Im modernen Deutschen ist ein Doppelpunkt natürlicher als das ausdrückliche „indem er sagte“.
- source_word: Ὁρᾶτε, βλέπετε
  choice: Seht euch vor! Hütet euch
  rationale: Die beiden nahezu synonymen Imperative werden als rhetorische Verdoppelung bewahrt. Zwei verwandte deutsche Warnformeln geben die Eindringlichkeit wieder, ohne sie auf bloßes Sehen zu reduzieren.
- source_word: ἀπὸ
  choice: vor
  rationale: Bei deutschen Verben des Warnens ist „sich hüten/vorsehen vor“ idiomatisch. Zugleich bleibt der Gedanke des Abstandhaltens erhalten.
- source_word: ζύμης
  choice: Sauerteig
  rationale: „Sauerteig“ ist im Deutschen verständlich und bewahrt das konkrete Bild eines durchdringenden Einflusses, ohne dessen genaue Bedeutung im Haupttext festzulegen.
- source_word: Φαρισαίων
  choice: der Pharisäer
  rationale: Übliche deutsche Bezeichnung der Gruppe; der Genitiv bleibt in der parallelen Konstruktion erhalten.
- source_word: Ἡρῴδου
  choice: des Herodes
  rationale: Der griechische Text nennt Herodes selbst und lässt die genaue Zuordnung des Sauerteigbildes offen. „des Herodes“ wahrt zudem die Parallelität zu „der Pharisäer“.
theological_decisions:
- issue: Bedeutung des Bildes vom Sauerteig
  choice: Das Bild „Sauerteig“ bleibt im Haupttext unerklärt.
  alternative: Lehre, Heuchelei oder verderblicher Einfluss
  rationale: Der unmittelbare Vers bestimmt die genaue Bedeutung nicht. Verwandte synoptische Stellen weisen auf einen negativen, durchdringenden Einfluss, doch eine ausdrückliche Auflösung im Haupttext würde die Offenheit von Markus 8,15 einschränken.
- issue: Bezug von „Sauerteig des Herodes“
  choice: Die direkte Genitivform „des Herodes“ wird beibehalten.
  alternative: Sauerteig der Herodianer, des Hauses Herodes oder herodianischer Einfluss
  rationale: Die Quelle nennt Herodes direkt. Eine Erweiterung auf seine Anhänger, seinen Hof oder seine Haltung wäre interpretierend und wird daher nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Warnung klingt eindringlich, aber nicht altertümlich. Die rhetorische Verdoppelung der griechischen Imperative bleibt erhalten; das Sauerteigbild wird nicht im Haupttext auf eine bestimmte Deutung festgelegt.
