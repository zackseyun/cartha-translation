source:
  edition: SBLGNT
  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: de
  text: 'Und als ich die sieben Brote für die Viertausend brach: Wie viele große Körbe voll Brotstücke habt ihr aufgehoben?[a] Sie antworteten ihm: »Sieben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort σπυρίς bezeichnet einen großen Korb, anders als das in Markus 8,19 verwendete Wort für einen kleineren Korb.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: Und als
  rationale: Leitet natürlich den zweiten Teil des Vergleichs mit der vorherigen Speisung ein; der verbindende und zeitliche Sinn bleibt erhalten.
- source_word: τοὺς ἑπτὰ
  choice: die sieben
  rationale: Bewahrt die Ellipse des Griechischen; aus dem Kontext sind die sieben Brote eindeutig erschließbar.
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: für die viertausend
  rationale: Gibt die Beziehung zu den viertausend gespeisten Menschen knapp und idiomatisch wieder.
- source_word: πόσων σπυρίδων
  choice: wie viele große Körbe
  rationale: σπυρίς bezeichnet einen großen Korb und unterscheidet sich vom kleineren Korbtyp κόφινος in Markus 8,19.
- source_word: πληρώματα κλασμάτων
  choice: große Körbe voll Brotstücke
  rationale: Gibt die gefüllten Körbe natürlich wieder; »Brotstücke« macht den im Kontext gemeinten Bezug klar, ohne die Vorstellung zerbrochener beziehungsweise abgebrochener Stücke zu verlieren.
- source_word: ἤρατε
  choice: habt ihr aufgehoben
  rationale: Bezeichnet hier das Einsammeln der übrig gebliebenen Stücke und entspricht natürlichem deutschem Sprachgebrauch.
- source_word: καὶ λέγουσιν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Das historische Präsens wird im Deutschen idiomatisch als Vergangenheit wiedergegeben; »antworteten« entspricht der Gesprächssituation.
- source_word: Ἑπτά
  choice: Sieben
  rationale: Direkte, knappe Zahlenantwort auf Jesu Frage.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die elliptische Formulierung »die sieben« bleibt wie im Griechischen erhalten; »Brote« wird nicht in den Haupttext ergänzt. Der Unterschied zwischen den beiden griechischen Korbbezeichnungen wird durch »große Körbe« und die Fußnote sichtbar gemacht.
