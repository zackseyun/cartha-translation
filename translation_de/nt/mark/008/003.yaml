  text: καὶ ἐὰν ἀπολύσω αὐτοὺς νήστεις εἰς οἶκον αὐτῶν, ἐκλυθήσονται ἐν τῇ ὁδῷ· ⸂καί τινες⸃ αὐτῶν ⸀ἀπὸ μακρόθεν ⸀ἥκασιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: de
  text: Und wenn ich sie hungrig nach Hause schicke, werden sie unterwegs zusammenbrechen[a], und einige von ihnen sind von weit her gekommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden unterwegs ermatten“. Das griechische Verb bezeichnet, dass jemand schwach oder erschöpft wird, möglicherweise bis zum Zusammenbruch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: ich sie … nach Hause schicke
  rationale: Im Zusammenhang bezeichnet das Verb das Fortschicken beziehungsweise Entlassen der Menschenmenge; „nach Hause schicken“ ist im Deutschen natürlich und gibt zusammen mit εἰς οἶκον αὐτῶν das Ziel wieder.
- source_word: νήστεις
  choice: hungrig
  rationale: Das Wort kann wörtlich „fastend“ bedeuten, beschreibt hier aber Menschen, die nichts gegessen haben. „Hungrig“ vermittelt den situationsbezogenen Sinn, ohne ein religiöses Fasten anzunehmen.
- source_word: εἰς οἶκον αὐτῶν
  choice: nach Hause
  rationale: 'Die Wendung ist distributiv zu verstehen: Die Einzelnen kehren jeweils in ihr Zuhause zurück. Das idiomatische „nach Hause“ drückt dies im Deutschen knapp aus.'
- source_word: ἐκλυθήσονται
  choice: werden … zusammenbrechen
  rationale: Das Verb bezeichnet ein Erschlaffen oder Entkräftetwerden, das bis zum Zusammenbruch reichen kann. „Zusammenbrechen“ gibt den Ernst der befürchteten körperlichen Schwäche wieder; die weniger starke mögliche Wiedergabe wird in der Fußnote genannt.
- source_word: ἐν τῇ ὁδῷ
  choice: unterwegs
  rationale: „Unterwegs“ ist die natürliche deutsche Wiedergabe für den Verlauf ihres Heimwegs.
- source_word: καί τινες αὐτῶν
  choice: und einige von ihnen
  rationale: Die Formulierung bewahrt sowohl die koordinierende Verbindung durch καί als auch die ausdrückliche Bezeichnung einer Teilgruppe.
- source_word: ἀπὸ μακρόθεν
  choice: von weit her
  rationale: Die idiomatische Wendung bezeichnet die große Entfernung, aus der ein Teil der Menschen gekommen ist.
- source_word: ἥκασιν
  choice: sind … gekommen
  rationale: Das deutsche Perfekt entspricht hier dem griechischen Perfekt und stellt die Menschen als solche dar, die nach einer weiten Anreise nun da sind.
theological_decisions: []
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem, ungekünsteltem Satzbau. Die griechische Abfolge „hungrig nach Hause schicken“ und die koordinierende Verbindung „und“ bleiben erkennbar; die Bedeutungsbreite von ἐκλυθήσονται wird durch die Fußnote offengehalten.
