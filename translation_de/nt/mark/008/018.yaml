base_translation:
  language: en
  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: de
  text: Habt ihr Augen und seht nicht? Habt ihr Ohren und hört nicht? Und erinnert ihr euch nicht?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: Ihr habt Augen
  rationale: Die wörtliche deutsche Partizipialform „Augen habend“ wäre unnatürlich. Ein selbstständiger Satz bewahrt das konkrete Bild und trägt im rhetorischen Zusammenhang die mögliche konzessive Nuance mit.
- source_word: βλέπετε
  choice: seht nicht
  rationale: „Sehen“ gibt den gewöhnlichen Sinn direkt wieder und lässt die im Kontext mitschwingende geistliche Wahrnehmung offen.
- source_word: ὦτα ἔχοντες
  choice: Ihr habt Ohren
  rationale: Parallel zur ersten Wendung als natürlicher deutscher Hauptsatz formuliert; das konkrete körperliche Bild bleibt erhalten.
- source_word: ἀκούετε
  choice: hört nicht
  rationale: „Hören“ entspricht dem Grundsinn und bewahrt zugleich die kontextuelle Möglichkeit, dass es um Verstehen oder Beachten geht.
- source_word: μνημονεύετε
  choice: erinnert ihr euch nicht
  rationale: Die reflexive Form ist im modernen Deutschen die natürliche Wiedergabe des Verbs in dieser rhetorischen Frage.
- source_word: καὶ
  choice: Und
  rationale: Beim letzten Fragesatz ausdrücklich wiedergegeben, um die steigernde Folge der Fragen zu erhalten; zwischen den parallelen ersten Sätzen wird die Verbindung im Deutschen durch die unmittelbare Reihung ausgedrückt.
- source_word: οὐ / οὐκ
  choice: nicht
  rationale: Die Negation wird in allen drei rhetorischen Fragen direkt beibehalten.
theological_decisions:
- issue: Konkreter oder übertragener Sinn von Sehen und Hören
  choice: Die konkreten Verben „sehen“ und „hören“ bleiben im Haupttext stehen.
  alternative: „wahrnehmen“ und „verstehen“ verwenden, um die übertragene Bedeutung ausdrücklich zu machen.
  rationale: Der Kontext lässt geistliche Unempfänglichkeit anklingen, doch der griechische Text verwendet die gewöhnlichen Sinnesverben. Die direkte Wiedergabe bewahrt sowohl das prophetisch anmutende Bild als auch seine Mehrdeutigkeit.
- issue: Verhältnis der Partizipien zu den Fragen
  choice: 'Die Partizipialgruppen werden als vorangestellte Feststellungen wiedergegeben: „Ihr habt Augen … Ihr habt Ohren …“'
  alternative: 'Konzessiv übersetzen: „Obwohl ihr Augen habt … Obwohl ihr Ohren habt …“'
  rationale: Eine konzessive Lesart ist möglich, wird durch das bloße Partizip aber nicht ausdrücklich markiert. Die gewählte deutsche Reihung vermittelt den rhetorischen Gegensatz, ohne ihn grammatisch stärker festzulegen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die drei kurzen Fragen bewahren den scharfen, kumulativen Ton des griechischen Textes; „sehen“ und „hören“ bleiben bewusst konkret und zugleich kontextuell offen.
