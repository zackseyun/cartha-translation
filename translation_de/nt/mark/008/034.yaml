  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: de
  text: 'Dann rief er die Menge zusammen mit seinen Jüngern zu sich und sagte zu ihnen: »Wenn jemand mir nachkommen will, soll er sich selbst verleugnen, sein Kreuz auf sich nehmen[a] und mir folgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »sein Kreuz aufnehmen«. Das Bild des Kreuzes bleibt bewusst erhalten und wird nicht lediglich als das Tragen einer Last umschrieben.'
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Dann rief er ... zu sich
  rationale: Das Aoristpartizip bezeichnet eine der Hauptaussage vorausgehende Handlung. »Dann rief er ... zu sich« gibt die Abfolge natürlich wieder und bewahrt die auf Jesus gerichtete Bewegung des Verbs.
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: die Menge zusammen mit seinen Jüngern
  rationale: »Die Menge« ist eine natürliche moderne Wiedergabe von ὄχλος; »zusammen mit« macht deutlich, dass sowohl die Menge als auch die Jünger herbeigerufen und angesprochen werden.
- source_word: Εἴ τις θέλει ὀπίσω μου ἐλθεῖν
  choice: Wenn jemand mir nachkommen will
  rationale: Die Formulierung erhält die allgemeine, offene Bedingung und gibt das Bild des Hinter-Jesus-Hergehens mit dem im Deutschen geläufigen Jüngerschaftsausdruck »nachkommen« wieder, ohne das spätere ἀκολουθείτω vorwegzunehmen.
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: soll er sich selbst verleugnen
  rationale: Der Imperativ der dritten Person wird im modernen Deutschen klar mit »soll« ausgedrückt. »Sich selbst verleugnen« bewahrt die starke Forderung der Selbstabsage und schwächt sie nicht zu bloßem Verzicht ab.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: sein Kreuz auf sich nehmen
  rationale: Diese geläufige deutsche Wendung bewahrt das konkrete Kreuzesbild und den persönlichen Bezug des Possessivpronomens. »Auf sich nehmen« entspricht hier idiomatisch dem Aufnehmen des eigenen Kreuzes.
- source_word: ἀκολουθείτω μοι
  choice: mir folgen
  rationale: Die knappe Wiedergabe bewahrt den Imperativ und bezeichnet im Kontext die fortdauernde Nachfolge, ohne den deutschen Satz unnötig zu beschweren.
theological_decisions:
- issue: Kraft der Bedingungen und Aufforderungen zur Nachfolge
  choice: Eine allgemeine Einladung an jeden, der Jesus nachkommen will, verbunden mit verbindlichen Aufforderungen durch »soll er«.
  alternative: Die Aufforderungen wiederholt mit »muss« wiedergeben.
  rationale: Auf den Bedingungssatz folgen griechische Imperative der dritten Person. »Soll er« erhält deren Aufforderungscharakter, ohne die offene Formulierung »wenn jemand ... will« in eine bloße Zwangsaussage umzudeuten.
- issue: Bedeutung von σταυρός
  choice: Das Bild wird wörtlich als »Kreuz« beibehalten.
  alternative: Als »Last«, allgemeines Leiden oder ausschließlich als Martyrium paraphrasieren.
  rationale: Das Bild ist historisch im römischen Hinrichtungsinstrument verankert und zugleich metaphorisch gewichtig. Eine erklärende Paraphrase würde seinen Sinn unzulässig verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede ist flüssig formuliert; traditionelle Schlüsselbegriffe wie »sich selbst verleugnen« und »Kreuz« bleiben erhalten. Das generische »jemand ... er« folgt der Struktur des griechischen Textes und bezeichnet jeden Menschen.
