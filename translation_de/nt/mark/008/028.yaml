  text: οἱ δὲ ⸂εἶπαν αὐτῷ λέγοντες⸃ ⸀ὅτι Ἰωάννην τὸν βαπτιστήν, καὶ ἄλλοι Ἠλίαν, ἄλλοι δὲ ⸂ὅτι εἷς⸃ τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/028.yaml
  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: de
  text: 'Sie sagten zu ihm: „Johannes der Täufer; andere: Elija; wieder andere: einer der Propheten.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie sagten zu ihm, indem sie sagten: Johannes den Täufer; andere: Elija; wieder andere: einen der Propheten.“ Im Griechischen bleiben in der Aufzählung das wiederholte „sie sagen“ und die jeweils gemeinte Aussage „du bist“ unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Sie
  rationale: Der substantivierte Artikel mit δέ greift die Jünger aus dem vorherigen Zusammenhang als Subjekt wieder auf. Im natürlichen Deutschen genügt „Sie“; die schwache weiterführende Kraft von δέ muss nicht eigens ausgedrückt werden.
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: antworteten ihm
  rationale: Die Verbindung aus finitem λέγω und dem Partizip λέγοντες ist eine griechische Redeeinleitungsformel. Eine wörtliche Verdopplung wie „sagten ihm und sprachen“ wirkt im heutigen Deutsch schwerfällig. Da die Äußerung auf Jesu Frage antwortet, gibt „antworteten ihm“ die Funktion natürlich wieder.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Johannes der Täufer
  rationale: Dies ist die im Deutschen gebräuchliche und sachlich klare Bezeichnung der historischen Person; „Täufer“ gibt zugleich seine Tätigkeit wieder.
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: andere ... wieder andere
  rationale: Die Formulierung bildet die Verteilung auf mehrere Gruppen idiomatisch ab. „Wieder andere“ markiert die letzte, von den vorigen unterschiedene Gruppe, ohne δέ unnötig stark als Gegensatz zu deuten.
- source_word: Ἠλίαν
  choice: Elija
  rationale: „Elija“ ist die in modernen deutschen Bibelübersetzungen verbreitete Namensform.
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: einer der Propheten
  rationale: Die knappe, verblose Identifikation bewahrt die Ellipse des griechischen Textes. Das sinngemäß vorausgesetzte „du seist“ beziehungsweise „du bist“ bleibt unausgesprochen.
theological_decisions:
- issue: Wiedergabe der verbreiteten Identifikationen Jesu
  choice: Die verschiedenen Meinungen werden als knappe Reihe wiedergegeben; das jeweils vorausgesetzte „du seist“ wird nicht ergänzt.
  alternative: „Sie antworteten ihm, die Leute hielten ihn für Johannes den Täufer, für Elija oder für einen der Propheten.“
  rationale: Die knappe Reihung bewahrt Form und Spannung des Ausgangstextes besser und lässt die Aussagen als berichtete öffentliche Einschätzungen stehen, ohne sie auszudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die griechische Redeeinleitungsformel wird idiomatisch gestrafft, während die elliptische Aufzählung erhalten bleibt.
