id: MRK.8.35
reference: Mark 8:35
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: de
  text: Denn wer sein Leben[a] retten will, wird es verlieren; wer aber sein Leben um meinetwillen und um des Evangeliums willen verlieren wird, wird es retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Seele; entsprechend im ganzen Vers. Das griechische Wort kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: Leben
  rationale: Im Zusammenhang mit Nachfolge, Selbstverleugnung sowie Retten und Verlieren bezeichnet ψυχή hier am natürlichsten das eigene Leben beziehungsweise die eigene Person. „Leben“ bewahrt das Paradox, ohne den Ausdruck auf einen immateriellen Seelenteil zu verengen.
- source_word: σῶσαι / σώσει
  choice: retten / wird retten
  rationale: „Retten“ wahrt die bewusste Wiederholung und den starken Gegensatz zu ἀπόλλυμι; es lässt sowohl die gegenwärtige als auch die endzeitliche Tragweite der Aussage offen.
- source_word: ἀπολέσει
  choice: wird verlieren / verliert
  rationale: Bei ψυχή ist „verlieren“ im Deutschen idiomatisch und erhält die paradoxe Zuspitzung. Die unterschiedliche Satzstellung verlangt im ersten Glied Futur und im Relativsatz des zweiten Glieds Präsens, ohne den Sinn zu verändern.
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: um meinetwillen und um des Evangeliums willen
  rationale: Die Formulierung gibt den Grund beziehungsweise Beweggrund präzise wieder und bezieht ihn ausdrücklich sowohl auf Jesus als auch auf das Evangelium.
- source_word: εὐαγγέλιον
  choice: Evangelium
  rationale: „Evangelium“ ist im modernen Standarddeutsch geläufig, würdevoll und bewahrt den markinischen Leitbegriff.
- source_word: ὃς ... ὃς
  choice: wer ... wer
  rationale: „Wer“ gibt die allgemeine, sprichwortartige Aussage im Deutschen knapp und natürlich wieder.
- source_word: θέλῃ
  choice: will
  rationale: „Will“ drückt die beabsichtigte Handlung klar und ohne unnötig gehobenen Stil aus.
theological_decisions:
- issue: Bedeutungsumfang von ψυχή
  choice: Im Haupttext „Leben“
  alternative: „Seele“
  rationale: Der unmittelbare Zusammenhang legt das irdische Leben beziehungsweise die ganze Person nahe. Zugleich kann ψυχή einen weiteren anthropologischen Klang haben; deshalb wird „Seele“ als mögliche Wiedergabe in einer Fußnote bewahrt.
- issue: Zeitliche und theologische Tragweite von „retten“ und „verlieren“
  choice: Die paradoxen Verben ohne erklärenden Zusatz wiedergeben
  alternative: Die Aussage ausdrücklich auf irdische Bewahrung oder endzeitliches Heil festlegen
  rationale: Der griechische Text lässt die Spannung zwischen gegenwärtigem Lebensverlust und endgültiger Rettung bestehen. Die Übersetzung soll diese Mehrschichtigkeit nicht vorzeitig auflösen.
- issue: Allgemeiner Personenbezug
  choice: Generisches deutsches „wer“ ohne Geschlechtsmarkierung
  alternative: Explizit männliche Formulierung
  rationale: Das griechische ὃς hat hier allgemeinen, repräsentativen Sinn. Das deutsche „wer“ bildet diesen natürlich und inhaltlich genau ab, ohne den Geltungsbereich einzuschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer sprichwortartiger Parallelstruktur. „Um meinetwillen und um des Evangeliums willen“ ist bewusst leicht gehoben, aber geläufig und quellenah.
