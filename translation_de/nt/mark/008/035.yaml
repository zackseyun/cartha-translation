    issue: Das zweite Vorkommen von ἀπόλλυμι ist als Präsens „verliert“ statt als Zukunft „verlieren wird“ wiedergegeben.
    rationale: Der SBLGNT-Text hat ἀπολέσει, ebenso wie im ersten Satzglied, und stellt es parallel zu σώσει. Die deutsche Zukunftsform bewahrt diese grammatische und rhetorische Parallelität ohne Bedeutungszusatz.
