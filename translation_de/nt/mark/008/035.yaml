  source_fidelity: Die Zukunftsformen ἀπολέσει und σώσει sind im griechischen Satz beide ausdrücklich markiert. Der Entwurf gibt σώσει mit „wird es retten“ wieder, setzt ἀπολέσει im zweiten Glied jedoch als Präsens „verliert“ um. Das ist als allgemeine Aussage zwar möglich, schwächt aber die sorgfältig parallele futurische Form des Ausgangstextes ab.
  naturalness: Die Formulierung ist insgesamt natürliches, würdiges modernes Standarddeutsch. „Um meinetwillen und um des Evangeliums willen“ ist leicht gehoben, aber geläufig und dem Register angemessen. Auch die futurische Relativsatzstellung „verlieren wird“ ist korrektes und verständliches Standarddeutsch.
  terminology: „Leben“, „retten“, „verlieren“ und „Evangelium“ geben die zentralen Begriffe treffend und ohne einseitige theologische Festlegung wieder. Die Fußnote bewahrt mit „Seele“ sowie „Selbst“ den weiteren möglichen Bedeutungsbereich von ψυχή. Der Anker steht bei dem ersten Vorkommen und bezeichnet ausdrücklich den ganzen Vers.
  issues:
