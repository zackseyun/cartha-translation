  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἐμβὰς⸃ ἀπῆλθεν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/013.yaml
  text: And leaving them[a], he got back into the boat and went to the other side.
translation:
  language: de
  text: Und er verließ sie, stieg wieder ins Boot und fuhr ans andere Ufer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er verließ sie, stieg ins Boot und fuhr wieder ans andere Ufer.“ Das griechische Wort für „wieder“ kann sich auf das Einsteigen oder auf die Fahrt zum anderen Ufer beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: er ließ sie stehen
  rationale: Das Aoristpartizip von ἀφίημι bezeichnet hier, dass Jesus die zuvor genannten Pharisäer zurückließ. „Er ließ sie stehen“ gibt die abrupte Beendigung der Begegnung natürlich und anschaulich wieder.
- source_word: πάλιν
  choice: wieder
  rationale: πάλιν kann „wieder“, „noch einmal“ oder in entsprechendem Zusammenhang „zurück“ bedeuten. „Wieder“ bewahrt hier die Wiederholungsbedeutung, ohne festzulegen, ob das Adverb speziell das Einsteigen oder allgemeiner die erneute Fahrt betrifft.
- source_word: ἐμβὰς
  choice: stieg … in das Boot
  rationale: Das Partizip von ἐμβαίνω bedeutet „einsteigen“. Das im Griechischen nicht ausdrücklich genannte Boot wird aus dem Erzählzusammenhang ergänzt und ist im Deutschen für eine natürliche Formulierung erforderlich.
- source_word: ἀπῆλθεν
  choice: fuhr
  rationale: ἀπέρχομαι bedeutet grundsätzlich „weggehen“ oder „sich entfernen“. Da Jesus mit dem Boot zum anderen Ufer gelangt, gibt „fuhr“ die situationsgemäße Fortbewegung im Deutschen präzise und knapp wieder.
- source_word: εἰς τὸ πέραν
  choice: ans andere Ufer
  rationale: Die Wendung bezeichnet in diesem Zusammenhang die gegenüberliegende Seite des Sees. „Ans andere Ufer“ ist idiomatisches modernes Deutsch und erhält den geografischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Erzählweise. Die beiden griechischen Partizipien werden natürlich in eine deutsche Verbfolge überführt. Die mögliche Zuordnung von πάλιν wird durch eine Fußnote offengehalten.
