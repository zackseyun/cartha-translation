source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: de
  text: '»Als ich die fünf Brote für die Fünftausend[a] brach, wie viele Körbe voller Brotstücke habt ihr aufgehoben?« Sie antworteten ihm: »Zwölf.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, je nach Kontext: »für die fünftausend Männer«. Das Griechische verwendet hier eine maskuline Form; in dieser Bezeichnung der Menge ist eine ausdrückliche Wiedergabe mit »Männer« jedoch nicht zwingend.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε
  choice: Als
  rationale: Leitet den Rückblick auf ein einmaliges vergangenes Ereignis ein und ist dafür im Deutschen idiomatisch.
- source_word: τοὺς πέντε ἄρτους
  choice: die fünf Brote
  rationale: ἄρτος bezeichnet hier zählbare Brote, nicht Brot als Stoffbezeichnung.
- source_word: ἔκλασα
  choice: brach
  rationale: Gibt den Aorist von κλάω konkret und knapp wieder; der Bezug auf das Brechen der Brote bleibt erhalten.
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: für die Fünftausend
  rationale: Gibt die Ausrichtung auf die gespeiste Gruppe natürlich wieder, ohne durch den Zusatz „Männer“ stärker zu präzisieren als dieser Vers.
- source_word: κοφίνους
  choice: Körbe
  rationale: Die allgemein verständliche Bezeichnung genügt; eine genauere Bestimmung als kleinere Handkörbe ist im Haupttext nicht erforderlich.
- source_word: κλασμάτων πλήρεις
  choice: voll Brotstücke
  rationale: κλάσματα sind die beim Brechen entstandenen beziehungsweise übrig gebliebenen Stücke; „Brotstücke“ macht den Sachbezug im Deutschen klar.
- source_word: ἤρατε
  choice: habt ihr aufgehoben
  rationale: αἴρω bezeichnet hier das Aufheben beziehungsweise Einsammeln der übrig gebliebenen Stücke; „aufgehoben“ ist natürlich und wahrt die Bildlichkeit.
- source_word: λέγουσιν αὐτῷ
  choice: Sie antworteten ihm
  rationale: Das historische Präsens wird im deutschen Erzählstil als Vergangenheit wiedergegeben; im Frage-Antwort-Zusammenhang ist „antworteten“ natürlicher als das formale „sagten“.
- source_word: Δώδεκα
  choice: Zwölf
  rationale: Die knappe Zahlenantwort wird ohne erklärenden Zusatz bewahrt.
theological_decisions:
- issue: Bedeutungsumfang von πεντακισχιλίους
  choice: die Fünftausend
  alternative: die fünftausend Männer
  rationale: Die maskuline Form kann Männer bezeichnen, fungiert hier jedoch als geläufige Benennung der gespeisten Menge. Der Haupttext vermeidet deshalb eine nicht zwingend erforderliche Präzisierung; die mögliche engere Wiedergabe wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Die direkte Rede bleibt knapp. „Fünftausend“ wird substantiviert großgeschrieben; „Brotstücke“ vermeidet das im heutigen Deutsch gehoben oder technisch wirkende „Brocken/Fragmente“.
