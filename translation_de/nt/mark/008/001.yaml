revisions:
- from: In jenen Tagen war wieder eine große Menschenmenge da, und die Leute hatten nichts zu essen. Da rief Jesus seine Jünger zu sich und sagt zu ihnen:[a]
  to: In jenen Tagen, als wieder eine große Menschenmenge versammelt war und die Menschen nichts zu essen hatten, ruft Jesus seine Jünger herbei und sagt zu ihnen:[a]
  rationale: Die Satzgestaltung gibt den genitivus absolutus als natürlichen deutschen Hintergrundsatz wieder. Das historische Präsens wird mit „ruft ... und sagt“ flüssig umgesetzt. „Herbei“ erfasst das Herbeirufen der Jünger, ohne die im Audit-Trail nicht ausgeführte Wendung „zu sich“ hinzuzufügen. Die Fußnote bleibt am historischen Präsens verankert und ist an die tatsächliche deutsche Formulierung angepasst.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:40:59Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Zeitrahmen, Wiederholung, große Menge, Nahrungsmangel und die Anrede an die Jünger im Wesentlichen zutreffend wieder. Das zu sich in „rief ... zu sich“ ist zwar als Nuance von προσκαλέομαι vertretbar, wird jedoch im englischen Audit-Trail bewusst nicht ausgeführt; „herbei“ gibt das Herbeirufen ohne zusätzliche reflexive Explikation wieder.
  naturalness: „Da rief ... und sagt“ bildet die unterschiedliche griechische Verbform zwar formal ab, wirkt im modernen Standarddeutsch jedoch unnötig brüchig. Mit „Da ruft ... und sagt“ ist das historische Präsens idiomatisch und lebendig. „Da war“ ist möglich, aber „versammelt war“ ist für eine Menschenmenge präziser und natürlich.
  terminology: „Menschenmenge“, „Jünger“ und „nichts zu essen“ sind sachgerecht. Die explizite Nennung Jesu ist im Kontext eindeutig und dient einem klaren deutschen Satzanschluss.
  issues:
  - severity: medium
    issue: Unnatürlicher Tempuswechsel „rief ... und sagt“
    rationale: Der aoristische Partizipialausdruck und das historische Präsens müssen im Deutschen nicht durch einen abrupten Wechsel von Präteritum zu Präsens innerhalb derselben Prädikatsgruppe nachgebildet werden. Ein durchgängiges historisches Präsens wahrt die Wirkung von λέγει und ist idiomatischer.
  - severity: low
    issue: „zu sich“ geht über den Wortlaut des englischen Audit-Trails hinaus
    rationale: προσκαλέομαι kann ein Herbeirufen zu sich bezeichnen, doch der dokumentierte englische Text hat diese Nuance nicht expliziert. „seine Jünger herbei“ ist quellentreu und vermeidet eine vermeidbare Zusatzexplizierung.
  revised_text: In jenen Tagen, als wieder eine große Menschenmenge versammelt war und die Menschen nichts zu essen hatten, ruft Jesus seine Jünger herbei und sagt zu ihnen:[a]
  revised_footnotes:
