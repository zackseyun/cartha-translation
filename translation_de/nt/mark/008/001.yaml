base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: de
  text: In jenen Tagen, als wieder eine große Menschenmenge versammelt war und die Menschen nichts zu essen hatten, ruft Jesus seine Jünger herbei und sagt zu ihnen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht „sagt zu ihnen“. Markus verwendet häufig das erzählende Präsens; im Deutschen könnte auch „sagte zu ihnen“ stehen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: In jenen Tagen
  rationale: Die geläufige deutsche Zeitangabe gibt den erzählerischen Rahmen direkt und würdevoll wieder.
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: war wieder eine große Menschenmenge da
  rationale: Der Genitivus absolutus wird als natürlicher deutscher Hintergrundsatz wiedergegeben; πάλιν bleibt als „wieder“ erhalten.
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: und die Leute hatten nichts zu essen
  rationale: Der Plural bezieht sich sinngemäß auf die Menschenmenge. „Die Leute“ macht diesen Bezug im Deutschen eindeutig, ohne zusätzliche Information einzuführen.
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: Da rief Jesus seine Jünger zu sich
  rationale: Das mediale προσκαλεσάμενος bezeichnet das Herbeirufen zu sich. Der im unmittelbaren Zusammenhang eindeutige Sprecher wird im Deutschen als Jesus benannt, um einen unklaren Pronomenanschluss zu vermeiden.
- source_word: λέγει αὐτοῖς
  choice: sagt zu ihnen
  rationale: Das Präsens bewahrt Markus’ anschauliches historisches Präsens statt es zur Vergangenheit zu glätten.
theological_decisions:
- issue: Historisches Präsens bei Markus
  choice: „sagt zu ihnen“ im Präsens
  alternative: „sagte zu ihnen“ im Präteritum
  rationale: Das griechische λέγει steht im Präsens. Die Beibehaltung wahrt Markus’ lebendigen Erzählstil, ohne eine theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der Wechsel vom Präteritum zum historischen Präsens bildet die griechische Erzählweise bewusst ab.
