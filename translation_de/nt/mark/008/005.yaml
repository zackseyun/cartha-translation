  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: de
  text: 'Und er fragte sie: »Wie viele Brote habt ihr?« Sie sagten: »Sieben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt den schlichten, für Markus typischen Erzählanschluss, ohne eine zusätzliche zeitliche Nuance einzutragen.
- source_word: ἠρώτα
  choice: er fragte
  rationale: Das Imperfekt kann einen fortdauernden oder wiederholten Vorgang bezeichnen; im deutschen Erzählstil gibt »fragte« die Handlung hier natürlich und ausreichend wieder.
- source_word: αὐτούς
  choice: sie
  rationale: Das Akkusativpronomen im Plural bezieht sich im Zusammenhang auf die Jünger.
- source_word: Πόσους
  choice: Wie viele
  rationale: Natürliche deutsche Wiedergabe der Frage nach einer zählbaren Menge.
- source_word: ἔχετε
  choice: habt ihr
  rationale: Entspricht dem Präsens Aktiv, zweite Person Plural, und ist in einer direkten Frage idiomatisches modernes Deutsch.
- source_word: ἄρτους
  choice: Brote
  rationale: ἄρτος kann Brot oder einen Brotlaib bezeichnen. Da hier einzelne Einheiten gezählt werden, ist der Plural »Brote« sachgerecht und natürlich.
- source_word: οἱ δὲ εἶπαν
  choice: Sie sagten
  rationale: Die Konstruktion bezeichnet die antwortende Gruppe. »Sie sagten« bleibt nahe am einfachen Verb εἶπαν; der Übergang trägt die leichte Kontrast- beziehungsweise Fortsetzungsfunktion von δέ ohne zusätzliches Bindewort.
- source_word: Ἑπτά
  choice: Sieben
  rationale: Schlichte Wiedergabe der Kardinalzahl als direkte Antwort.
