  text: ⸂τί γὰρ⸃ ⸀δοῖ ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/037.yaml
  text: For what can a man give in exchange for his life?[a]
translation:
  language: de
  text: Denn was könnte ein Mensch als Gegenleistung für sein Leben[a] geben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Seele“; das griechische Wort kann je nach Zusammenhang „Leben“, „Selbst“ oder „Seele“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Denn was
  rationale: τί eröffnet die Frage, während γάρ sie begründend mit der vorherigen Aussage verbindet. „Denn was“ gibt beides im Deutschen natürlich wieder.
- source_word: δοῖ
  choice: könnte … geben
  rationale: Der Aorist Konjunktiv von δίδωμι steht in einer rhetorischen Frage. „Könnte … geben“ drückt die hier gemeinte Möglichkeit idiomatisch aus, ohne eine tatsächliche Gegenleistung anzunehmen.
- source_word: ἄνθρωπος
  choice: ein Mensch
  rationale: ἄνθρωπος bezeichnet hier einen einzelnen Menschen mit allgemeingültiger, repräsentativer Bedeutung. „Ein Mensch“ entspricht dem griechischen Ausdruck und ist im Deutschen natürlich und inklusiv.
- source_word: ἀντάλλαγμα
  choice: im Tausch
  rationale: Das Substantiv bezeichnet eine Gegenleistung oder etwas, das als Austausch gegeben wird. „Im Tausch … geben“ bewahrt das Bild des Austauschs in einer verständlichen deutschen Formulierung.
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: für sein Leben
  rationale: ψυχή kann Leben, Selbst oder Seele bezeichnen. Im Zusammenhang von Markus 8,35–37 ist „Leben“ die klarste Haupttextwiedergabe, ohne die umfassendere Bedeutung des ganzen Selbst auszuschließen; „Seele“ wird als Alternative in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von ψυχή in einem Heilszusammenhang
  choice: Leben
  alternative: 'Seele; auch: sein Selbst'
  rationale: Der Kontext verbindet den möglichen Verlust des irdischen Lebens mit dem Verlust des Menschen in einem tieferen, endgültigen Sinn. „Leben“ hält den Anschluss an die vorherigen Verse aufrecht; die Fußnote bewahrt die semantische und theologische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und ihre begründende Verbindung zum vorherigen Vers bleiben erhalten; die Mehrdeutigkeit von ψυχή wird nicht im Haupttext aufgelöst, sondern durch die Fußnote sichtbar gemacht.
