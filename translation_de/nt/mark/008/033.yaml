reference: Mark 8:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: de
  text: 'Doch Jesus wandte sich um, sah seine Jünger an, wies Petrus scharf zurecht und sagte: „Geh hinter mich, Satan![a] Denn du hast nicht im Sinn, was Gottes ist, sondern was der Menschen ist.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Satan“ bedeutet „Widersacher“.
    reason: Die Fußnote nennt die Grundbedeutung der Bezeichnung, ohne die direkte Anrede im Haupttext abzuschwächen oder abschließend zu erklären.
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: wandte sich um
  rationale: Das intransitiv gebrauchte Aoristpartizip bezeichnet Jesu körperliche Wendung; die deutsche Erzählvergangenheit gibt den Handlungsablauf natürlich wieder.
- source_word: ἰδὼν
  choice: sah seine Jünger an
  rationale: „Ansehen“ bringt hier den gezielten Blick auf die Jünger natürlicher zum Ausdruck als das bloße „sehen“.
- source_word: μαθητὰς
  choice: Jünger
  rationale: „Jünger“ ist die etablierte und sachlich passende Bezeichnung für die Schüler und Anhänger Jesu.
- source_word: ἐπετίμησεν
  choice: wies … scharf zurecht
  rationale: Die Wendung vermittelt die nachdrückliche verbale Rüge des griechischen Verbs in verständlichem Gegenwartsdeutsch.
- source_word: καὶ λέγει
  choice: und sagte
  rationale: Das historische Präsens wird entsprechend natürlicher deutscher Erzählweise im Präteritum wiedergegeben.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Geh hinter mich
  rationale: Die Formulierung wahrt das räumliche Bild und den scharfen Imperativ, ohne ihn vorschnell auf ein allgemeines „Geh weg“ zu reduzieren.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Der Vokativ wird als im Neuen Testament geläufige Namens- und Titelbezeichnung transliteriert.
- source_word: φρονεῖς
  choice: hast … im Sinn
  rationale: Die Formulierung erfasst Denken, Ausrichtung und Anliegen und geht damit über rein verstandesmäßiges Nachdenken hinaus.
- source_word: τὰ τοῦ θεοῦ
  choice: was Gottes ist
  rationale: Die substantivierte Genitivkonstruktion bleibt bewusst weit und legt sie nicht auf „Willen“, „Pläne“ oder „Interessen“ fest.
- source_word: τὰ τῶν ἀνθρώπων
  choice: was der Menschen ist
  rationale: Die parallele Form wahrt den Gegensatz zum Bereich Gottes; „Menschen“ gibt ἀνθρώπων hier generisch und geschlechtsübergreifend wieder.
theological_decisions:
- issue: Bezug der Anrede „Satan“
  choice: Jesus weist Petrus zurecht und redet ihn mit „Satan“ an.
  alternative: Jesus redet einen hinter Petrus stehenden Satan an; oder „Satan“ bedeutet hier ausschließlich unpersönlich „Widersacher“.
  rationale: Petrus ist ausdrücklich das Objekt der Zurechtweisung. Die Übersetzung bewahrt die Härte der direkten Anrede, ohne festzulegen, in welchem metaphysischen Sinn Petrus mit satanischem Widerstand verbunden ist.
- issue: Bedeutung von τὰ τοῦ θεοῦ und τὰ τῶν ἀνθρώπων
  choice: was Gottes ist … was der Menschen ist
  alternative: Gottes Anliegen … menschliche Anliegen; oder was Gott will … was Menschen wollen
  rationale: Die gewählte Form erhält die Weite und Spannung der griechischen Genitivkonstruktionen, statt sie auf Willen oder Interessen einzuengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge ist flüssig, während die parallele und bewusst offene Formulierung „was Gottes ist … was der Menschen ist“ die theologische Spannung des Ausgangstextes wahrt.
