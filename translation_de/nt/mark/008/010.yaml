  text: καὶ ⸀εὐθὺς ἐμβὰς εἰς τὸ πλοῖον μετὰ τῶν μαθητῶν αὐτοῦ ἦλθεν εἰς τὰ μέρη Δαλμανουθά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/010.yaml
  text: And immediately[a], getting into the boat with his disciples, he went to the region of Dalmanutha.
translation:
  language: de
  text: Sogleich stieg er mit seinen Jüngern ins Boot und kam in die Gegend[a] von Dalmanuta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Griechischen eine Mehrzahl: „die Gegenden“ oder „die Gebiete von Dalmanuta“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: sogleich
  rationale: Bewahrt die für Markus charakteristische zeitliche Dringlichkeit und klingt zugleich natürlich und würdevoll.
- source_word: ἐμβὰς
  choice: stieg … ins Boot
  rationale: Das Aoristpartizip bezeichnet die dem Hauptverb vorausgehende Handlung; im Deutschen lässt sich die Abfolge natürlich durch ein koordiniertes Verb wiedergeben.
- source_word: πλοῖον
  choice: Boot
  rationale: Im erzählerischen Umfeld des Sees von Galiläa bezeichnet „Boot“ das Fahrzeug angemessener als „Schiff“.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: mit seinen Jüngern
  rationale: Gibt die von μετά mit Genitiv bezeichnete Begleitung knapp und genau wieder.
- source_word: ἦλθεν
  choice: fuhr
  rationale: Das allgemeine Bewegungsverb ἔρχομαι wird hier im Zusammenhang mit dem Besteigen eines Bootes idiomatisch als Fortbewegung auf dem Wasser wiedergegeben.
- source_word: τὰ μέρη
  choice: die Gegend
  rationale: Der griechische Plural ist eine idiomatische Gebietsbezeichnung; der deutsche Singular „die Gegend“ gibt den geografischen Sinn natürlich wieder.
- source_word: Δαλμανουθά
  choice: Dalmanuta
  rationale: Der Ortsname wird in einer im Deutschen üblichen, dem Griechischen nahen Form transliteriert.
theological_decisions: []
