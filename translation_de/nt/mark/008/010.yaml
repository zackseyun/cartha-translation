  register: Modernes, gut verständliches Standarddeutsch mit knapper, erzählerischer Bewegung. Die griechische Partizipialkonstruktion wird zugunsten eines natürlichen deutschen Satzbaus koordiniert wiedergegeben; die geografische Mehrzahl wird in der Fußnote sichtbar gehalten.
