source:
  edition: SBLGNT
  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: de
  text: 'Und als er es bemerkte, sagte er zu ihnen: „Warum redet ihr darüber, dass ihr kein Brot habt? Begreift ihr noch nicht und versteht ihr nicht? Ist euer Herz verhärtet?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: als er es bemerkte
  rationale: Das Aoristpartizip bezeichnet hier Jesu Wahrnehmung des vorangehenden Gesprächs. Das im Griechischen unausgesprochene Objekt wird im Deutschen durch „es“ natürlich aus dem Kontext aufgenommen.
- source_word: διαλογίζεσθε
  choice: besprecht ihr
  rationale: Das Verb beschreibt hier das gemeinsame Erörtern beziehungsweise Überlegen der Jünger; „besprechen“ passt zum unmittelbaren Gespräch über den Brotmangel.
- source_word: ἄρτους
  choice: Brot
  rationale: Obwohl der griechische Ausdruck im Plural steht, ist der deutsche Sammelbegriff „Brot“ in diesem Zusammenhang idiomatisch und gibt den Sinn ohne Bedeutungsverlust wieder.
- source_word: νοεῖτε
  choice: begreift
  rationale: „Begreifen“ bezeichnet das geistige Erfassen und hält zusammen mit dem folgenden „verstehen“ die rhetorische Doppelung der beiden griechischen Verben aufrecht.
- source_word: συνίετε
  choice: versteht
  rationale: „Verstehen“ ist die klare, natürliche Wiedergabe und bleibt vom vorangehenden „begreifen“ hinreichend unterschieden.
- source_word: πεπωρωμένην
  choice: verhärtet
  rationale: Das Perfektpartizip beschreibt einen fortbestehenden Zustand der Unempfänglichkeit. „Verhärtet“ bewahrt die biblische Metapher.
- source_word: καρδίαν
  choice: Herz
  rationale: „Herz“ erhält die Metapher für das innere Wahrnehmungs-, Denk- und Reaktionsvermögen des Menschen.
theological_decisions:
- issue: Wiedergabe der abschließenden Frage nach dem Zustand der Jünger
  choice: Ist euer Herz verhärtet?
  alternative: Habt ihr euer Herz verhärtet?
  rationale: Die Konstruktion ἔχετε mit Akkusativ und Partizip bezeichnet den bestehenden Zustand ihres Herzens, ohne ausdrücklich zu sagen, dass die Jünger selbst dessen Urheber sind. Die Zustandsfrage ist im Deutschen natürlich und vermeidet diese zusätzliche Kausalbehauptung; der Singular „Herz“ bewahrt zugleich die griechische kollektive Ausdrucksweise.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Abfolge „begreift … und versteht“ bewahrt die rhetorische Doppelung, ohne im Deutschen gekünstelt zu wirken. Präsens λέγει wird im erzählenden deutschen Kontext idiomatisch als Präteritum „sagte“ wiedergegeben.
