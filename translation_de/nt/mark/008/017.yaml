review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe trifft den Sinn des Verses insgesamt gut: γνούς bezeichnet Jesu Wahrnehmung, Brot ist als Sammelbegriff angemessen, und die Schlussfrage gibt den bestehenden Zustand des „Herzens“ wieder, ohne eine Urheberschaft der Jünger zu behaupten. Bei οὔπω ist jedoch „noch nicht“ die unmittelbare Entsprechung; „noch immer nicht“ verstärkt den Ausdruck leicht.'
  naturalness: „Warum besprecht ihr, dass ihr kein Brot habt?“ ist im modernen Standarddeutsch keine natürliche Ergänzung zu „besprechen“. Idiomatisch ist „Warum redet ihr darüber, dass …“ oder „Warum macht ihr euch Gedanken darüber, dass …“. Die erste Option wahrt den Charakter einer untereinander geführten Erörterung.
  terminology: „Herz“ und „verhärtet“ bewahren die biblische Metapher treffend. Der Singular „euer Herz“ ist im Deutschen bei einer an mehrere gerichteten Aussage möglich und spiegelt die griechische Einzahl, ohne unnatürlich zu wirken. „Begreifen“ und „verstehen“ können die rhetorische Doppelung von νοεῖτε und συνίετε angemessen abbilden.
  issues:
  - severity: medium
    issue: Unidiomatische Konstruktion „besprecht ihr, dass“
    rationale: Das deutsche Verb „besprechen“ wird hier gewöhnlich mit „über“ bzw. „darüber“ konstruiert. Die vorliegende Form wirkt wie eine wörtliche Übertragung und beeinträchtigt die Lesbarkeit.
  - severity: low
    issue: „noch immer nicht“ für οὔπω
    rationale: οὔπω bedeutet direkt „noch nicht“. „Noch immer nicht“ ist kontextuell möglich, fügt aber eine stärkere Dauerakzentuierung hinzu als der griechische Wortlaut ausdrücklich verlangt.
