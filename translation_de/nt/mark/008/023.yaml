id: MRK.8.23
reference: Mark 8:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: de
  text: 'Und er fasste den Blinden an der Hand und führte ihn aus dem Dorf hinaus. Dann spuckte er ihm auf die Augen[a], legte ihm die Hände auf und fragte ihn: »Siehst du etwas?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »spuckte er ihm in die Augen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ
  choice: er fasste den Blinden an der Hand
  rationale: Die Formulierung gibt das Ergreifen an der Hand konkret und zugleich in natürlichem Deutsch wieder; das substantivierte τυφλός wird idiomatisch als »der Blinde« übersetzt.
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: führte ihn aus dem Dorf hinaus
  rationale: Obwohl ἐκφέρω auch »hinausbringen« bedeuten kann, legt das Fassen an der Hand hier ein Führen nahe. »Aus dem Dorf hinaus« bewahrt die Bewegungsrichtung und gibt κώμη als kleinere Siedlung wieder.
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: Dann spuckte er ihm auf die Augen
  rationale: Der Aoristpartizip wird als nächster Schritt der Handlung wiedergegeben. »Auf die Augen« ist im Deutschen natürlich, während das wörtlichere und auffälligere »in die Augen« als mögliche Alternative in der Fußnote erhalten bleibt.
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: legte ihm die Hände auf
  rationale: Die Wendung bewahrt die konkrete Berührung, ohne eine über den Zusammenhang hinausgehende rituelle Bedeutung einzutragen.
- source_word: ἐπηρώτα αὐτόν
  choice: fragte ihn
  rationale: Das Imperfekt kann einen Verlauf andeuten, doch im deutschen Erzählstil gibt »fragte« den unmittelbaren Sprechakt klar und natürlich wieder.
- source_word: Εἴ τι βλέπεις;
  choice: Siehst du etwas?
  rationale: Die direkte Frage gibt das indefinite τι knapp und idiomatisch wieder, ohne bereits eine bestimmte Antwort oder einen Grad des Sehens vorauszusetzen.
theological_decisions:
- issue: Körperliche Konkretheit der Heilungshandlungen
  choice: Das Spucken auf die Augen und das Auflegen der Hände werden ausdrücklich beibehalten.
  alternative: Die körperlichen Einzelheiten durch eine glättende Umschreibung abzuschwächen.
  rationale: Der griechische Text schildert eine greifbare, ungewöhnliche Abfolge von Handlungen. Diese darf aus Rücksicht auf modernes Empfinden nicht bereinigt werden.
- issue: Mögliche rituelle Konnotation des Handauflegens
  choice: Die Handlung wird schlicht als »legte ihm die Hände auf« wiedergegeben.
  alternative: Sie ausdrücklich als sakramentalen oder kirchlich-rituellen Akt zu deuten.
  rationale: Im Zusammenhang bezeichnet die Formulierung Jesu körperliche Berührung bei der Heilung; weitergehende spätere Bedeutungen verlangt der Text nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Das konkrete und für heutige Leser möglicherweise befremdliche Heilungsgeschehen bleibt ungeschönt erhalten.
