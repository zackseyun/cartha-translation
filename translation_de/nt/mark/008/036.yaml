id: MRK.8.36
reference: Mark 8:36
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: de
  text: Denn was nützt es einem Menschen, die ganze Welt zu gewinnen und dabei sein Leben einzubüßen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »seine Seele«; das griechische Wort ψυχή kann je nach Zusammenhang »Leben«, »Seele« oder »Selbst« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: Denn was
  rationale: τί leitet die rhetorische Frage ein; γάρ verbindet sie begründend mit der vorausgehenden Lehre. „Denn was“ gibt beides in natürlichem Deutsch wieder.
- source_word: ὠφελεῖ
  choice: nützt es
  rationale: ὠφελέω bedeutet „nützen“ oder „Vorteil bringen“. Zusammen mit „gewinnen“ und „einbüßen“ bleibt die wirtschaftliche Bildsprache des Satzes erkennbar.
- source_word: ἄνθρωπον
  choice: einem Menschen
  rationale: ἄνθρωπος bezeichnet hier allgemein einen Menschen. Die deutsche Form gibt den generischen Sinn natürlich wieder, ohne ihn auf Männer zu beschränken.
- source_word: κερδῆσαι
  choice: zu gewinnen
  rationale: κερδαίνω bedeutet „gewinnen“ oder „Gewinn erzielen“ und bildet den passenden Gegenpol zu ζημιωθῆναι.
- source_word: τὸν κόσμον ὅλον
  choice: die ganze Welt
  rationale: κόσμος bezeichnet hier die Welt in umfassendem Sinn; ὅλον hebt ihre Gesamtheit hervor.
- source_word: ζημιωθῆναι
  choice: dabei … einzubüßen
  rationale: Das passive ζημιόω kann „Verlust erleiden“ oder „einbüßen“ bedeuten. „Dabei“ verdeutlicht in idiomatischem Deutsch den zugespitzten Gegensatz zwischen äußerem Gewinn und persönlichem Verlust, ohne eine zusätzliche Ursache festzulegen.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sein Leben
  rationale: ψυχή kann „Leben“, „Seele“ oder „Selbst“ bezeichnen. Im unmittelbaren Zusammenhang von Markus 8,35–37 steht das Retten und Verlieren des Lebens im Vordergrund; die mögliche Wiedergabe „Seele“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Bedeutung von ψυχή im Zusammenhang der Nachfolge
  choice: Leben
  alternative: 'Seele; auch: sich selbst'
  rationale: „Leben“ wahrt den Zusammenhang mit Markus 8,35, ohne eine engere anthropologische Aussage in den Text hineinzutragen. Da ψυχή zugleich „Seele“ bezeichnen kann und der Ausspruch über das bloß irdische Leben hinausweist, wird diese echte Mehrdeutigkeit ausdrücklich angemerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Zuspitzung und die Bildsprache von Gewinn und Verlust bleiben erhalten. Das generische ἄνθρωπον wird inklusiv und idiomatisch mit „einem Menschen“ wiedergegeben; dafür ist keine eigene Fußnote nötig.
