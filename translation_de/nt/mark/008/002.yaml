  text: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: de
  text: „Ich habe Mitleid mit der Menschenmenge, denn sie ist nun schon drei Tage bei mir und hat nichts zu essen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: Ich habe Mitleid
  rationale: Das Verb bezeichnet tiefes, innerlich empfundenes Erbarmen. „Ich habe Mitleid“ ist im heutigen Deutsch natürlich, würdevoll und bewahrt den präsentischen Sinn.
- source_word: ἐπὶ τὸν ὄχλον
  choice: mit den Menschen
  rationale: ἐπί mit Akkusativ bezeichnet hier das Objekt des Mitleids. „Mit den Menschen“ ist idiomatischer als „mit der Menschenmenge“ und gibt ὄχλος in diesem Kontext verständlich wieder.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι führt die Begründung für Jesu Mitleid ein. „Denn“ verbindet die Aussage im Deutschen flüssig und eindeutig kausal.
- source_word: ἤδη ἡμέραι τρεῖς
  choice: nun schon drei Tage
  rationale: „Nun schon“ bringt ἤδη und die inzwischen erreichte Dauer natürlich zum Ausdruck; „drei Tage“ bezeichnet die Zeitspanne.
- source_word: προσμένουσίν μοι
  choice: sind … bei mir geblieben
  rationale: προσμένω mit Dativ bezeichnet anhaltendes Verweilen bei jemandem. Das Perfekt „sind … geblieben“ gibt den bis zur Gegenwart reichenden Verlauf im Deutschen angemessen wieder.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: haben nichts zu essen
  rationale: Diese idiomatische deutsche Wendung gibt den Mangel an Nahrung präzise wieder; der griechische Subjunktiv nach τί verlangt hier keine eigenständige modale Übersetzung.
