source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: de
  text: Da kamen die Pharisäer heraus und begannen, mit ihm zu streiten; sie forderten von ihm ein Zeichen vom Himmel[a], wobei sie ihn auf die Probe stellten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Zeichen aus dem Himmel“. Gemeint ist wahrscheinlich ein Zeichen himmlischen, also göttlichen Ursprungs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: kamen ... heraus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Heraustreten in die Szene. „Kamen heraus“ bewahrt die Bewegungsrichtung, ohne einen nicht genannten Ausgangsort festzulegen.
- source_word: ἤρξαντο συζητεῖν αὐτῷ
  choice: begannen, mit ihm zu streiten
  rationale: ἤρξαντο gibt den Beginn an. συζητέω kann diskutieren, debattieren oder streiten bedeuten; der feindselige Kontext und πειράζοντες sprechen hier für „streiten“. Der Dativ αὐτῷ wird natürlich mit „mit ihm“ wiedergegeben.
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: Sie verlangten von ihm
  rationale: Das Partizip beschreibt eine gleichzeitige Handlung. In diesem konfrontativen Zusammenhang gibt „verlangten“ die nachdrückliche Forderung idiomatischer wieder als das im Deutschen missverständliche „suchten von ihm“; παρά mit Genitiv bezeichnet die Quelle.
- source_word: σημεῖον
  choice: ein Zeichen
  rationale: „Zeichen“ bewahrt den Gedanken einer Tat mit Beweis- oder Offenbarungscharakter und verengt ihn nicht auf ein bloßes Wunder.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: vom Himmel
  rationale: Die formal nahe Wendung wahrt sowohl die räumliche Bildsprache als auch den im Kontext wahrscheinlichen Sinn göttlicher Herkunft oder Beglaubigung.
- source_word: πειράζοντες αὐτόν
  choice: um ihn auf die Probe zu stellen
  rationale: Das Partizip benennt hier den Zweck beziehungsweise Beweggrund ihrer Forderung. „Auf die Probe stellen“ gibt den feindseligen Test wieder, ohne eine Verführung zur Sünde zu unterstellen.
theological_decisions:
- issue: Bedeutung des verlangten Zeichens „vom Himmel“
  choice: Die wörtliche Wendung „ein Zeichen vom Himmel“ bleibt im Haupttext stehen und lässt eine göttliche Herkunft oder Beglaubigung anklingen.
  alternative: Ein Zeichen aus dem sichtbaren Himmel beziehungsweise vom Himmel herab.
  rationale: Im jüdischen und markinischen Zusammenhang ist göttliche Herkunft wahrscheinlich, doch die räumliche Bildsprache des griechischen Ausdrucks soll nicht durch eine ausdeutende Übersetzung beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufteilung in zwei Sätze erleichtert das Verständnis, ohne die Abfolge oder den Zusammenhang der griechischen Partizipien zu verändern. „Pharisäer“ bleibt als historisch-religiöse Gruppenbezeichnung erhalten.
