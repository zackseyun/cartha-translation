  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des griechischen Textes insgesamt zutreffend wieder: Die Pharisäer treten auf, beginnen die Auseinandersetzung, fordern ein Zeichen vom Himmel und testen Jesus. Die Umformung von ζητοῦντες („suchend/indem sie forderten“) zu einem selbständigen Satz mit „Sie verlangten“ ist vertretbar, schwächt aber die enge syntaktische Verknüpfung mit dem Streit etwas. Entscheidend ist, dass „um ihn auf die Probe zu stellen“ πειράζοντες als bloßen Zweck der Zeichenforderung festlegt; das griechische Partizip kann sich auf ihr gesamtes Auftreten bzw. Fordern beziehen und sollte weniger eingeengt werden.'
