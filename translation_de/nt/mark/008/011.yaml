  terminology: „Pharisäer“, „Zeichen“ und „Himmel“ sind angemessen. Die Fußnote erhält die lexikalische Alternative und die wahrscheinliche Bedeutung göttlicher Herkunft, ohne diese in den Haupttext hineinzulesen. „aus dem Himmel“ ist als Alternative möglich, doch „vom Himmel“ bleibt die natürliche Hauptformulierung.
