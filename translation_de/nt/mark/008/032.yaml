id: MRK.8.32
reference: Mark 8:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: de
  text: Und er sprach ganz offen[a] darüber. Da nahm Petrus ihn beiseite und begann, ihn zurechtzuweisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »deutlich« oder »freimütig«. Das griechische Wort bezeichnet offenes, unverhülltes Reden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: ganz offen
  rationale: Das adverbial gebrauchte Substantiv bezeichnet freimütiges, offenes und unverhülltes Reden. „Ganz offen“ ist im modernen Deutsch natürlich und betont, dass Jesus nichts verschleierte; mögliche Nuancen wie „deutlich“ oder „freimütig“ werden in der Fußnote bewahrt.
- source_word: τὸν λόγον
  choice: darüber
  rationale: Der Ausdruck verweist auf die unmittelbar vorausgehende Leidensankündigung. Das deutsche Pronomen nimmt diesen Inhalt natürlich auf. Das wörtliche „das Wort“ wäre hier missverständlich, „diese Sache“ unnötig unpersönlich.
- source_word: ἐλάλει
  choice: sprach
  rationale: Das Imperfekt beschreibt Jesu fortlaufendes Reden im Erzählhintergrund. Im natürlichen deutschen Erzählstil kann das Präteritum diesen Verlauf ausdrücken, ohne künstlich „war am Sprechen“ zu formulieren.
- source_word: προσλαβόμενος
  choice: nahm … beiseite
  rationale: Das Partizip bezeichnet hier, dass Petrus Jesus zu sich beziehungsweise abseits nahm. „Beiseite nehmen“ gibt die im Kontext naheliegende private Absonderung idiomatisch wieder.
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: begann, ihn zurechtzuweisen
  rationale: „Begann“ wahrt die inchoative Konstruktion. „Zurechtweisen“ gibt den scharfen Tadel von ἐπιτιμάω verständlich und würdig wieder; es bleibt zugleich derselbe Wortbereich, der im Folgevers für Jesu Reaktion auf Petrus verwendet wird.
theological_decisions:
- issue: Bedeutung von παρρησίᾳ bei Jesu Leidensankündigung
  choice: '„ganz offen“: Jesus redete unverhüllt und freimütig darüber'
  alternative: „deutlich“ oder „freimütig“
  rationale: Die Wiedergabe hebt die unverdeckte Art des Redens hervor, ohne festzulegen, ob vor allem öffentliche Zugänglichkeit, sprachliche Klarheit oder Kühnheit gemeint ist. Die Fußnote erhält diese echte Bedeutungsbreite.
- issue: Stärke von ἐπιτιμάω in Petrus’ Reaktion
  choice: „zurechtweisen“
  alternative: „tadeln“ oder „scharf zureden“
  rationale: Petrus tritt Jesus mit korrigierendem Tadel entgegen. „Zurechtweisen“ bewahrt die Anstößigkeit dieser Rollenverkehrung, ohne durch ein noch stärkeres deutsches Wort zusätzliche Motive oder eine bestimmte Lehrauslegung einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wortstellung „Da nahm Petrus …“ stellt den unmittelbaren narrativen Anschluss her. Die idiomatische Aufnahme von τὸν λόγον durch „darüber“ vermeidet das im Deutschen missverständliche „das Wort“, ohne den Bezug zur vorherigen Leidensankündigung aufzulösen.
