  source_fidelity: Die Übersetzung gibt den Sinn des griechischen Textes zuverlässig wieder. „sprach ganz offen darüber“ vermittelt παρρησίᾳ als unverschleierte, offene Rede und nimmt τὸν λόγον sinnvoll auf die vorausgehende Leidensankündigung zurück. „nahm Petrus ihn beiseite“ entspricht der kontextuell naheliegenden Bedeutung von προσλαβόμενος. Die inchoative Wendung ἤρξατο ἐπιτιμᾶν ist mit „begann, ihn zurechtzuweisen“ gewahrt.
  naturalness: Modernes Standarddeutsch, flüssig und dem erzählenden Register angemessen. Die Formulierung „ganz offen darüber“ ist idiomatisch; „Da“ stellt den narrativen Anschluss natürlich her.
  terminology: „Zurechtweisen“ gibt ἐπιτιμᾶν angemessen als korrigierenden, deutlichen Tadel wieder, ohne den Ton durch eine übermäßig harte Paraphrase zu verschärfen. Die Fußnote zu „ganz offen“ bewahrt die relevanten lexikalischen Alternativen „deutlich“ und „freimütig“.
