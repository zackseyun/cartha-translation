id: MRK.8.27
reference: Mark 8:27
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: de
  text: 'Jesus zog mit seinen Jüngern hinaus in die Dörfer bei Cäsarea Philippi.[a] Unterwegs fragte er seine Jünger: »Wer bin ich, sagen die Leute?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in die Dörfer im Gebiet von Cäsarea Philippi«.'
    reason: Die Genitivverbindung kann die Dörfer im Umland beziehungsweise Verwaltungsgebiet der Stadt bezeichnen; »bei« gibt dies im Haupttext knapp und natürlich wieder.
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: zog … hinaus
  rationale: Die Wendung gibt die gerichtete Bewegung von ἐξέρχομαι natürlich wieder, ohne das altertümlich wirkende »ging hinaus« unnötig zu betonen.
- source_word: κώμας
  choice: Dörfer
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine kleinere ländliche Siedlung, nicht eine größere Stadt.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Cäsarea Philippi
  rationale: Die im Deutschen übliche Form des antiken Ortsnamens wird beibehalten.
- source_word: ἐν τῇ ὁδῷ
  choice: Unterwegs
  rationale: »Unterwegs« ist eine knappe, natürliche Wiedergabe und erhält das markinische Motiv des Weges.
- source_word: ἐπηρώτα
  choice: fragte
  rationale: Das deutsche Präteritum ist hier die natürliche Erzählform. Der griechische Imperfekt zeigt die im Verlauf der Reise stattfindende Handlung; Zusätze wie »immer wieder« würden eine nicht zwingend gemeinte Wiederholung eintragen.
- source_word: λέγων αὐτοῖς
  choice: direkte Rede nach Doppelpunkt
  rationale: Die griechische Redeformel wird im Deutschen idiomatisch durch den Doppelpunkt vor der direkten Frage ausgedrückt; eine wörtliche Doppelung wie »fragte … und sagte zu ihnen« wäre schwerfällig.
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: Wer, sagen die Leute, bin ich?
  rationale: Die Formulierung bewahrt sowohl die Identitätsfrage τίνα … εἶναι als auch das Verb λέγουσιν. »Leute« gibt das hier allgemein gebrauchte ἄνθρωποι geschlechtsübergreifend und natürlich wieder.
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: seine Jünger
  rationale: Das ausdrückliche Possessivpronomen αὐτοῦ wird an beiden Stellen wiedergegeben; »Jünger« ist die etablierte sachgerechte Entsprechung für μαθηταί.
theological_decisions:
- issue: Generischer Gebrauch von ἄνθρωποι in Jesu Frage
  choice: Leute
  alternative: Menschen; Männer
  rationale: Gemeint ist die Öffentlichkeit allgemein, nicht ausschließlich männliche Personen. »Leute« ist im heutigen Deutsch natürlich und wahrt diesen generischen Sinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit flüssiger Erzählweise. Die eingeschobene Redeeinleitung »sagen die Leute« hält sich eng an den griechischen Wortlaut, ohne die Frage unnatürlich zu formulieren.
