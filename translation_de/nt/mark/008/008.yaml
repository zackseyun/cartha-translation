  text: ⸂καὶ ἔφαγον⸃ καὶ ἐχορτάσθησαν, καὶ ἦραν περισσεύματα κλασμάτων ἑπτὰ σπυρίδας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/008.yaml
  text: And they ate and were satisfied[a], and they picked up seven baskets of leftover pieces.
translation:
  language: de
  text: Und sie aßen und wurden satt. Dann sammelten sie sieben Körbe voll übrig gebliebener Stücke ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort σπυρίδες bezeichnet wahrscheinlich größere Körbe. Bei der Speisung der Fünftausend verwendet Markus ein anderes Wort für „Körbe“ (κόφινοι; 6,43).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: sie aßen
  rationale: Der Aorist von ἐσθίω bezeichnet hier schlicht den erzählten Vorgang; „sie aßen“ ist die natürliche und genaue Wiedergabe.
- source_word: ἐχορτάσθησαν
  choice: wurden satt
  rationale: χορτάζω bezeichnet in diesem Zusammenhang, dass alle bis zur Sättigung aßen. „Wurden satt“ ist idiomatisches modernes Deutsch und bewahrt den Gedanken ausreichender Versorgung.
- source_word: ἦραν
  choice: sammelten … ein
  rationale: αἴρω bedeutet grundsätzlich „aufheben/aufnehmen“; beim Einsammeln der verbliebenen Stücke gibt „sammelten … ein“ die Handlung natürlich wieder.
- source_word: περισσεύματα
  choice: übrig gebliebener
  rationale: Das Substantiv bezeichnet den Überschuss beziehungsweise das, was nach dem Essen verblieb. Die attributive Form ist im Deutschen flüssig und sachlich.
- source_word: κλασμάτων
  choice: Stücke
  rationale: κλάσματα sind abgebrochene Stücke, im Kontext wohl Brot- oder Speisereste. „Stücke“ ist klar, ohne den Bezug unnötig zu verengen.
- source_word: ἑπτὰ σπυρίδας
  choice: sieben große Körbe voll
  rationale: σπυρίς bezeichnet einen Korb, wahrscheinlich einen größeren Trage- oder Vorratskorb, und unterscheidet sich von κόφινος in Markus 6,43. „Voll“ bildet die Konstruktion ab, bei der die sieben Körbe als Maß der eingesammelten Reste stehen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzteilung vermeidet eine schwerfällige Reihung; der Fußnotenmarker steht unmittelbar nach der Aussage über die Körbe.
