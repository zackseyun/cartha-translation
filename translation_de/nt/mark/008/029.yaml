source:
  edition: SBLGNT
  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: de
  text: 'Und er fragte sie weiter: »Ihr aber, für wen haltet ihr mich?« Petrus antwortete ihm: »Du bist der Messias.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Christus«; wörtlich: »der Gesalbte«.'
    reason: Die Fußnote bewahrt die traditionelle Wiedergabe des griechischen Titels χριστός und macht zugleich seine Grundbedeutung sichtbar.
lexical_decisions:
- source_word: ἐπηρώτα
  choice: fragte … weiter
  rationale: Der Imperfekt stellt das Fragen im fortlaufenden Gespräch dar. „Fragte … weiter“ gibt diesen Zusammenhang in natürlichem deutschem Erzählstil wieder, ohne eine wiederholte Frage zu behaupten.
- source_word: Ὑμεῖς δὲ
  choice: Ihr aber
  rationale: Das ausdrücklich gesetzte Pronomen ist betont, und δέ markiert den Gegensatz zur zuvor genannten Meinung anderer Menschen. „Ihr aber“ bewahrt beides knapp und deutlich.
- source_word: τίνα με λέγετε εἶναι
  choice: für wen haltet ihr mich
  rationale: Diese idiomatische deutsche Wendung gibt die griechische Akkusativ-mit-Infinitiv-Konstruktion natürlich wieder. Sie bezeichnet hier nicht bloß eine private Meinung, sondern das von den Jüngern ausgesprochene Urteil über Jesu Identität.
- source_word: ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ
  choice: Petrus antwortete ihm
  rationale: Das Partizip ἀποκριθείς und das markinische historische Präsens λέγει werden im Deutschen zu einer natürlichen Erzählform zusammengezogen. „Antwortete ihm“ bewahrt sowohl die Antwortfunktion als auch den Adressaten.
- source_word: Σὺ εἶ
  choice: Du bist
  rationale: Das ausdrückliche σύ verleiht dem Bekenntnis Nachdruck. Die vorangestellte deutsche Form „Du bist“ trägt diesen Nachdruck ohne künstlichen Zusatz.
- source_word: ὁ χριστός
  choice: der Messias
  rationale: χριστός ist hier ein Titel und bedeutet „der Gesalbte“. „Der Messias“ bewahrt den jüdischen Erwartungshorizont und ist im modernen Deutschen als Titel verständlich.
theological_decisions:
- issue: Wiedergabe von Χριστός als Titel
  choice: der Messias
  alternative: der Christus
  rationale: Petrus gebraucht χριστός hier als Titel für den erwarteten Gesalbten, nicht als Eigennamen. „Messias“ macht diese Titelfunktion im Deutschen deutlicher; die traditionsreiche Wiedergabe „Christus“ bleibt in der Fußnote erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. „Ihr aber“ erhält den Kontrast und die Betonung des griechischen Pronomens. „Für wen haltet ihr mich?“ ist idiomatischer als eine formnahe Konstruktion wie „Wer, sagt ihr, bin ich?“ und bewahrt dennoch den Sinn der direkten Identitätsfrage.
