  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: de
  text: 'Er blickte auf[a] und sagte: »Ich sehe Menschen, denn ich sehe sie wie umhergehende Bäume.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Er begann wieder zu sehen.'
    reason: ἀναβλέπω kann sowohl »aufblicken« als auch »wieder sehen / das Sehvermögen erlangen« bedeuten; der unmittelbare Zusammenhang lässt beide Nuancen mitschwingen.
lexical_decisions:
- source_word: ἀναβλέψας
  choice: Er blickte auf
  rationale: Das Partizip von ἀναβλέπω bezeichnet hier zunächst das Aufblicken nach Jesu Berührung. Da das Verb auch »wieder sehen« bedeuten kann, wird diese mögliche Nuance in einer Fußnote offengehalten.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι wird kausal verstanden und leitet die Erklärung für die erste Aussage des Mannes ein. »Denn« gibt diesen Zusammenhang im Deutschen natürlich wieder, ohne die ungewöhnliche Wahrnehmung zu glätten.
- source_word: ὡς δένδρα ... περιπατοῦντας
  choice: wie Bäume umhergehen
  rationale: 'Das maskuline Partizip περιπατοῦντας bezieht sich grammatisch auf τοὺς ἀνθρώπους, nicht auf das sächliche δένδρα: Es sind die Menschen, die umhergehen und dabei wie Bäume erscheinen.'
