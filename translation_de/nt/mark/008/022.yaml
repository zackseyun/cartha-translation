  text: Καὶ ⸀ἔρχονται εἰς Βηθσαϊδάν. καὶ φέρουσιν αὐτῷ τυφλὸν καὶ παρακαλοῦσιν αὐτὸν ἵνα αὐτοῦ ἅψηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: de
  text: Und sie kamen nach Betsaida. Da brachten sie einen Blinden zu Jesus und baten ihn eindringlich, ihn zu berühren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: sie kamen
  rationale: Das historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: εἰς Βηθσαϊδάν
  choice: nach Betsaida
  rationale: Bei Ortsnamen ist „nach“ die idiomatische deutsche Entsprechung für die Bewegungsrichtung.
- source_word: φέρουσιν αὐτῷ
  choice: brachten sie … zu Jesus
  rationale: Das historische Präsens wird als Präteritum wiedergegeben. Der im Kontext eindeutige pronominale Bezug wird mit „Jesus“ natürlich und unmissverständlich ausgedrückt.
- source_word: τυφλὸν
  choice: einen Blinden
  rationale: Das substantivierte maskuline Adjektiv bezeichnet hier einen blinden Mann; „einen Blinden“ ist knapp und idiomatisch.
- source_word: παρακαλοῦσιν
  choice: baten ihn eindringlich
  rationale: παρακαλέω bezeichnet hier eine dringliche Bitte; die Formulierung bewahrt die Intensität, ohne das im Deutschen stärker wirkende „anflehen“ vorauszusetzen.
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: ihn zu berühren
  rationale: Der ἵνα-Satz gibt den Inhalt der Bitte an und wird idiomatisch mit einer Infinitivgruppe übersetzt; ἅπτομαι mit Genitiv bedeutet „berühren“.
- source_word: καὶ
  choice: Und … Da
  rationale: Das erste καί bleibt zur Wahrung von Markus’ parataktischem Erzählstil als „Und“ erhalten; das zweite wird mit „Da“ wiedergegeben, um die anschließende Handlung in natürlichem Deutsch anzuknüpfen.
