source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: de
  text: Und er wies die Menschenmenge an, sich auf dem Boden niederzulassen.[a] Dann nahm er die sieben Brote, dankte, brach sie und gab sie immer wieder seinen Jüngern, damit sie sie der Menschenmenge vorsetzten.[b] Und sie setzten sie der Menschenmenge vor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich zum Essen zu lagern“. Das griechische Verb bezeichnet genauer das Lagern bei einer Mahlzeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „damit sie sie austeilten“. Wörtlich bedeutet das griechische Verb „vorsetzen“ oder „vor jemanden hinstellen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: wies … an
  rationale: Das Verb bezeichnet eine verbindliche Anweisung. „Wies … an“ ist in modernem Deutsch natürlich und bewahrt den autoritativen Sinn, ohne unnötig hart zu klingen. Das historische Präsens wird dem üblichen deutschen Erzählstil entsprechend als Präteritum wiedergegeben.
- source_word: ἀναπεσεῖν
  choice: sich niederzulassen
  rationale: Das griechische Verb bezeichnet hier das Sich-Niederlegen beziehungsweise Lagern zum Essen. „Sich niederzulassen“ ist verständliches modernes Deutsch; die genauere Mahlzeitnuance wird in einer Fußnote ausgewiesen.
- source_word: ἐπὶ τῆς γῆς
  choice: auf dem Boden
  rationale: γῆ bezeichnet in diesem Zusammenhang die Bodenfläche, auf der sich die Menschen niederlassen.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: die sieben Brote
  rationale: ἄρτοι sind hier einzelne Brote beziehungsweise Brotlaibe. „Die sieben Brote“ ist im Deutschen idiomatisch und eindeutig.
- source_word: εὐχαριστήσας
  choice: dankte
  rationale: Die knappe Wiedergabe entspricht dem griechischen Partizip und fügt kein ausdrücklich genanntes Objekt des Dankes hinzu.
- source_word: ἔκλασεν
  choice: brach sie
  rationale: Das im Griechischen aus dem Zusammenhang erschließbare Objekt wird im Deutschen durch „sie“ aufgenommen.
- source_word: ἐδίδου
  choice: gab sie immer wieder
  rationale: Das Imperfekt lässt eine fortdauernde oder wiederholte Weitergabe erkennen. „Immer wieder“ macht diesen Aspekt in natürlichem Deutsch sichtbar.
- source_word: ἵνα παρατιθῶσιν
  choice: damit sie sie den Menschen vorsetzten
  rationale: παρατίθημι bedeutet wörtlich, Speise vor jemanden hinzustellen beziehungsweise vorzusetzen. Die Formulierung bewahrt das konkrete Bild und bezeichnet zugleich verständlich das Austeilen.
- source_word: παρέθηκαν
  choice: sie setzten sie der Menschenmenge vor
  rationale: Die Wiedergabe hält die lexikalische Verbindung zum vorhergehenden παρατιθῶσιν fest und folgt dem abgeschlossenen Erzählvorgang des Aorists.
- source_word: ὄχλος
  choice: Menschenmenge
  rationale: „Menschenmenge“ ist eine natürliche, präzise Wiedergabe und unterscheidet die versammelte Menge von einem unspezifischen „Volk“.
theological_decisions:
- issue: Erzählfolge und mögliche eucharistische Anklänge
  choice: εὐχαριστήσας wird schlicht mit „dankte“ wiedergegeben.
  alternative: „sprach das Dankgebet“ oder eine ausdrücklich sakramentale Formulierung
  rationale: Die Formulierung gehört zunächst zur Sprache einer Mahlzeit und kann spätere christliche Praxis anklingen lassen, lehrt hier aber nicht ausdrücklich eine Sakramentstheologie. Die Übersetzung bewahrt den Wortlaut ohne dogmatische Erweiterung.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Wiederholung von „vorsetzen“ spiegelt bewusst die Wiederholung desselben griechischen Verbstamms. Die Häufung der Pronomen in „damit sie sie“ ist grammatisch eindeutig: Die Jünger sollen die Brote vorsetzen.'
