  source_fidelity: Die Übersetzung gibt die Handlungsfolge, die sieben Brote, das Danken, das Brechen sowie den iterativen Sinn von ἐδίδου („gab … immer wieder“) zuverlässig wieder. Das Mahlzeit-Lagern bei ἀναπεσεῖν und das konkrete Vorsetzen bei παρατίθημι sind angemessen berücksichtigt.
  naturalness: Modernes, gut verständliches Standarddeutsch. Die Wiederholung von „vorsetzen“ ist hier vertretbar, weil sie die Wiederholung des griechischen Verbs abbildet. Die Abfolge „Menschenmenge – Menschen – Menschenmenge“ ist jedoch ohne sachlichen Grund uneinheitlich und sollte vereinheitlicht werden.
  terminology: „wies … an“, „auf dem Boden“, „Brote“, „dankte“ und „vorsetzen“ sind treffend. Für denselben griechischen Ausdruck ὄχλος sollte durchgehend „Menschenmenge“ stehen. Die Fußnote zu ἀναπεσεῖν sollte nicht „Niederlegen“ sagen, da dies im Deutschen missverständlich transitiv wirken kann; „Lagern“ beschreibt den Kontext präziser.
