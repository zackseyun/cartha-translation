source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μηδενὶ λέγωσιν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: de
  text: Und er wies sie nachdrücklich an, niemandem etwas über ihn zu sagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Er wies sie streng an, niemandem von ihm zu erzählen.“ Auch möglich: „Er wies sie zurecht.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: schärfte … ein
  rationale: ἐπιτιμάω kann „zurechtweisen“ bedeuten, bezeichnet hier aber eine nachdrückliche Anweisung. „schärfte ihnen ein“ gibt den strengen Ton im natürlichen Deutschen wieder, ohne einen vorangehenden Tadel vorauszusetzen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Der Dativ Plural verweist im unmittelbaren Zusammenhang auf die Jünger.
- source_word: ἵνα
  choice: (Infinitivkonstruktion) … zu sagen
  rationale: Nach einem Verb des nachdrücklichen Anweisens gibt die deutsche Infinitivkonstruktion den Inhalt der ἵνα-Klausel natürlich wieder.
- source_word: μηδενὶ
  choice: niemandem
  rationale: 'Der Dativ Singular von μηδείς bezeichnet den Empfänger der untersagten Mitteilung: „niemandem“.'
- source_word: λέγωσιν
  choice: etwas … zu sagen
  rationale: λέγωσιν meint hier, jemandem über Jesus etwas mitzuteilen. Das ergänzte „etwas“ ist im Deutschen idiomatisch und macht keinen zusätzlichen Inhalt fest.
- source_word: περὶ αὐτοῦ
  choice: über ihn
  rationale: περί mit Genitiv bedeutet hier „über“ beziehungsweise „von“ einer Person.
theological_decisions:
- issue: Stärke von Jesu Verbot im Zusammenhang der Geheimhaltung seiner Identität
  choice: Als nachdrückliche Anweisung wiedergegeben, niemandem etwas über ihn zu sagen
  alternative: „Er wies sie zurecht“ oder „er befahl ihnen streng“
  rationale: Der Wortlaut zeigt ein ernstes Verbot, erklärt jedoch nicht dessen theologischen Grund. Die Übersetzung bewahrt diese Spannung, ohne eine Theorie über das sogenannte Messiasgeheimnis einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „jemandem etwas über ihn sagen“ ist klar und alltagssprachlich verständlich; „schärfte … ein“ bewahrt zugleich die nachdrückliche Kraft des griechischen Verbs.
