  text: καὶ εἶχον ἰχθύδια ὀλίγα· καὶ εὐλογήσας ⸀αὐτὰ εἶπεν ⸂καὶ ταῦτα παρατιθέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: de
  text: Und sie hatten einige kleine Fische. Nachdem er sie gesegnet hatte, sagte er, man solle auch diese vorsetzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: einige kleine Fische
  rationale: Das Diminutiv ἰχθύδια bezeichnet kleine Fische; ὀλίγα gibt ihre geringe Anzahl an. „Einige kleine Fische“ ist natürliches modernes Deutsch und bewahrt beide Nuancen.
- source_word: εὐλογήσας αὐτά
  choice: Nachdem er sie gesegnet hatte
  rationale: Der Aoristpartizip bezeichnet hier eine der folgenden Anweisung vorausgehende Handlung. „Segnen“ entspricht εὐλογέω enger als „danken“, und das Pronomen bezieht sich auf die Fische.
- source_word: εἶπεν
  choice: sagte er
  rationale: Die schlichte Wiedergabe mit „sagen“ bleibt eng bei λέγω und trägt den anweisenden Sinn nicht unnötig in das Verb selbst ein.
- source_word: καὶ ταῦτα
  choice: auch diese
  rationale: „Auch“ bewahrt die additive Kraft von καί, während „diese“ den demonstrativen Nachdruck von ταῦτα wiedergibt.
- source_word: παρατιθέναι
  choice: man solle … austeilen
  rationale: Im Zusammenhang einer Mahlzeit bedeutet παρατίθημι, Speise vorzusetzen beziehungsweise auszuteilen. Die Konstruktion mit „man solle“ gibt den anweisenden Infinitiv wieder, ohne im Deutschen ein im Griechischen nur mitgedachtes Objekt wie „ihnen“ ausdrücklich zu ergänzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist gegenüber der griechischen Parataxe leicht geglättet; „austeilen“ knüpft natürlich an die Speisung der Menge an. Die unbestimmte Subjektangabe „man“ wahrt, dass die ausführenden Personen im Vers nicht ausdrücklich genannt werden.
