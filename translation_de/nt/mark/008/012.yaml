id: MRK.8.12
reference: Mark 8:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: de
  text: 'Da seufzt er tief in seinem Geist und sagt: »Warum sucht diese Generation nach einem Zeichen? Amen, ich sage euch: Dieser Generation wird kein Zeichen gegeben werden.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »wenn dieser Generation ein Zeichen gegeben werden wird« – eine griechische Schwurformel, die hier bedeutet, dass ihr kein Zeichen gegeben werden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστενάξας
  choice: seufzt er tief
  rationale: Das verstärkte Verb bezeichnet ein tiefes Seufzen oder Stöhnen. »Seufzt tief« gibt die emotionale Intensität natürlich wieder, ohne sie zu überzeichnen.
- source_word: τῷ πνεύματι αὐτοῦ
  choice: in seinem Geist
  rationale: Die Formulierung bewahrt die anthropologische Sprache des Griechischen und beschränkt die Aussage nicht auf bloßes innerliches Empfinden.
- source_word: λέγει
  choice: sagt
  rationale: Das historische Präsens wird beibehalten und bewahrt den lebendigen Erzählstil des Markusevangeliums.
- source_word: Τί
  choice: Warum
  rationale: In Verbindung mit dem Verb fragt τί idiomatisch nach dem Grund; »Warum« ist im Deutschen klar und natürlich.
- source_word: γενεὰ
  choice: Generation
  rationale: »Generation« erhält sowohl den gemeinschaftlichen als auch den zeitlichen Sinn des griechischen Ausdrucks.
- source_word: ζητεῖ
  choice: sucht … nach
  rationale: Diese Wiedergabe entspricht der Grundbedeutung des Verbs und vermeidet die stärkere, vom Kontext zwar mögliche, aber nicht ausdrückliche Bedeutung »fordert«.
- source_word: σημεῖον
  choice: Zeichen
  rationale: »Zeichen« bewahrt die Bedeutung eines bestätigenden Wunders, ohne eine erklärende Deutung in den Haupttext einzufügen.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, ich sage euch
  rationale: Die charakteristische feierliche Formel Jesu wird transparent und zugleich in natürlichem Deutsch wiedergegeben; »Amen« bewahrt dabei die markante Ausgangsform.
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: Dieser Generation wird kein Zeichen gegeben werden
  rationale: Die mit εἰ eingeleitete, verkürzte Schwurformel drückt eine nachdrückliche Verneinung aus. Die ausdrückliche Negation vermittelt im Deutschen ihren gemeinten Sinn.
theological_decisions:
- issue: Wiedergabe des schwurartigen εἰ-Satzes nach ἀμὴν λέγω ὑμῖν
  choice: 'Als nachdrückliche Verneinung: »Dieser Generation wird kein Zeichen gegeben werden.«'
  alternative: 'Wörtlich: »wenn dieser Generation ein Zeichen gegeben werden wird«'
  rationale: Die griechische Form bewahrt formal einen unvollständigen Schwursatz, dessen Aussageabsicht jedoch eindeutig negativ ist. Der Haupttext gibt diese Funktion verständlich wieder; die Fußnote erhält die formale Besonderheit und damit die Spannung des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das historische Präsens und die feierliche Amen-Formel wurden bewahrt; die ungewöhnliche griechische Schwurform wird im Haupttext sinngemäß und in der Fußnote formal transparent wiedergegeben.
