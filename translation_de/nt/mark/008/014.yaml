  text: Καὶ ἐπελάθοντο λαβεῖν ἄρτους, καὶ εἰ μὴ ἕνα ἄρτον οὐκ εἶχον μεθ’ ἑαυτῶν ἐν τῷ πλοίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/014.yaml
  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: de
  text: Und sie hatten vergessen, Brot[a] mitzunehmen, und sie hatten im Boot nur ein einziges Brot bei sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Brote“. Der Plural ἄρτους kann einzelne Brote bezeichnen, meint hier aber wahrscheinlich Brot beziehungsweise Vorrat im Allgemeinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: hatten vergessen
  rationale: Der Aorist bezeichnet das vorausliegende Vergessen, das ihren gegenwärtigen Mangel erklärt; das deutsche Plusquamperfekt bildet diesen Erzählzusammenhang natürlich ab.
- source_word: λαβεῖν
  choice: mitzunehmen
  rationale: Der Infinitiv ergänzt „vergessen“ und bezeichnet hier, Brot als Vorrat mit ins Boot zu nehmen. „Mitzunehmen“ ist im Deutschen natürlicher und kontextuell genauer als das bloße „zu nehmen“.
- source_word: ἄρτους
  choice: Brot
  rationale: Der Plural kann einzelne Brote bezeichnen, meint hier aber wahrscheinlich Brot beziehungsweise Vorrat im Allgemeinen. Das kollektive deutsche „Brot“ gibt diesen Sinn natürlich wieder; die wörtlichere Mehrzahl wird in der Fußnote genannt.
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: außer einem einzigen Brot
  rationale: εἰ μή wird hier ausnehmend gebraucht, nicht konditional. „Einem einzigen“ bewahrt die ausdrückliche Zahl ἕνα und macht deutlich, dass nur ein Brot vorhanden war.
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: hatten sie … nichts bei sich
  rationale: Die deutsche Wendung gibt die verneinte Besitzangabe samt reflexivem Ausdruck idiomatisch wieder. „Nichts“ nimmt das aus dem Kontext erschlossene Brot auf, ohne eine unnatürliche Wiederholung einzufügen.
- source_word: ἐν τῷ πλοίῳ
  choice: im Boot
  rationale: Dies ist die direkte und natürliche Wiedergabe des Aufenthaltsortes.
theological_decisions: []
