  text: καὶ ἔλεγεν αὐτοῖς· ⸀Οὔπω συνίετε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/021.yaml
  text: And he was saying to them[a], “Do you not yet understand?”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Versteht ihr noch immer nicht?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Bewahrt die schlichte erzählerische Verknüpfung, ohne eine stärkere zeitliche Folge einzutragen.
- source_word: ἔλεγεν
  choice: sagte
  rationale: Das Imperfekt bezeichnet die Äußerung im fortlaufenden Erzählgeschehen. Im natürlichen modernen Deutsch gibt „sagte“ dies hier besser wieder als das schwerfällige „war dabei zu sagen“.
- source_word: αὐτοῖς
  choice: zu ihnen
  rationale: Übersetzt das Dativpronomen unmittelbar und ergänzt nicht ausdrücklich „seinen Jüngern“, obwohl der Kontext sie als Bezug erkennen lässt.
- source_word: Οὔπω
  choice: noch immer nicht
  rationale: Gibt in der vorwurfsvollen Frage idiomatisch wieder, dass das erwartete Verständnis bis zu diesem Zeitpunkt weiterhin fehlt; „noch nicht“ ist ebenfalls möglich.
- source_word: συνίετε
  choice: versteht ihr
  rationale: Das Präsens in der zweiten Person Plural bezeichnet geistiges Erfassen; „verstehen“ ist dafür die klare und natürliche deutsche Entsprechung.
theological_decisions:
- issue: Ob ein Objekt wie „das“ oder „dies“ ergänzt werden soll
  choice: 'Das Objekt bleibt unausgesprochen: „Versteht ihr noch immer nicht?“'
  alternative: „Versteht ihr das noch immer nicht?“
  rationale: Auch der griechische Text nennt kein Objekt. Die offene Form bewahrt die Reichweite und Spannung der Frage, ohne ihren Bezug eigenmächtig einzuengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einfache Satzverknüpfung und das unausgesprochene Objekt bleiben erhalten; das griechische Imperfekt wird zugunsten einer natürlichen deutschen Erzählweise nicht umständlich nachgebildet.
