id: MRK.8.26
reference: Mark 8:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτὸν ⸀εἰς οἶκον αὐτοῦ λέγων· Μηδὲ εἰς τὴν κώμην ⸀εἰσέλθῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/026.yaml
  text: And he sent him to his home[a], saying, “Do not even enter the village.”
translation:
  language: de
  text: 'Und er schickte ihn nach Hause[a] und sagte: »Geh nicht einmal in das Dorf hinein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften fügen hinzu: »Und erzähle es niemandem im Dorf.«'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Das Verb bezeichnet hier, dass Jesus den Mann fort- beziehungsweise nach Hause schickt. »Schickte« ist im modernen Deutschen natürlich, ohne einen besonderen Auftrag anzudeuten.
- source_word: εἰς οἶκον αὐτοῦ
  choice: nach Hause
  rationale: Die Wendung bezeichnet das eigene Zuhause als Ziel. »Nach Hause« ist dafür die idiomatische deutsche Entsprechung und natürlicher als das wörtlichere »in sein Haus«.
- source_word: λέγων
  choice: und sagte
  rationale: Das präsentische Partizip leitet die begleitende Rede ein. Im Deutschen gibt eine koordinierte finite Form den Erzählfluss natürlicher wieder als »sagend«.
- source_word: Μηδὲ
  choice: nicht einmal
  rationale: Die Verbindung trägt hier verstärkende negative Kraft. »Nicht einmal« bewahrt den Nachdruck, dass der Mann das Dorf keinesfalls betreten soll.
- source_word: κώμην
  choice: das Dorf
  rationale: κώμη bezeichnet gewöhnlich ein Dorf oder eine kleinere Siedlung; »Dorf« ist die direkte und kontextgerechte Wiedergabe.
- source_word: εἰσέλθῃς
  choice: geh … hinein
  rationale: Der Aorist Konjunktiv steht nach μηδέ in einem Verbot. »Geh … hinein« ist eine klare, natürliche deutsche Aufforderungsform und bewahrt zusammen mit »in das Dorf« die Richtungsangabe.
theological_decisions:
- issue: Umfang von Jesu Verbot hinsichtlich des Dorfes
  choice: Das Gebot wird ausschließlich als Verbot wiedergegeben, das Dorf zu betreten.
  alternative: Einige Handschriften erweitern das Wort um das Verbot, jemandem im Dorf davon zu erzählen.
  rationale: Der SBLGNT-Haupttext enthält nur das Verbot, in das Dorf hineinzugehen. Die längere Lesart wird daher nicht in den Haupttext aufgenommen, sondern als Textvariante in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählstil. Die direkte Rede wird idiomatisch formuliert; die emphatische Negation bleibt durch »nicht einmal« erhalten.
