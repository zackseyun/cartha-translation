lexical_decisions:
- source_word: ἦσαν
  choice: Es waren
  rationale: Die existenzielle Verwendung von εἰμί führt hier idiomatisch die Zahl der Anwesenden ein.
- source_word: δὲ
  choice: Dann
  rationale: Das schwache Bindewort markiert hier einen Fortgang in der Erzählung; „Dann“ gibt diesen natürlichen Übergang wieder, ohne einen starken Gegensatz auszudrücken.
- source_word: ὡς
  choice: etwa
  rationale: ὡς vor einer Zahl bezeichnet eine ungefähre Angabe.
- source_word: τετρακισχίλιοι
  choice: viertausend Menschen
  rationale: Die Zahl bezeichnet im Kontext die anwesende Menge; „Menschen“ macht den deutschen Satz natürlich und bleibt sachlich.
- source_word: ἀπέλυσεν
  choice: schickte … weg
  rationale: ἀπολύω bedeutet in diesem Zusammenhang, die Menge zu entlassen beziehungsweise fortzuschicken.
- source_word: αὐτούς
  choice: sie
  rationale: Das Pronomen verweist auf die zuvor genannte Menschenmenge.
