base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: de
  text: Dann legte er ihm noch einmal die Hände auf die Augen[a]. Da sah er klar, wurde wiederhergestellt und sah alles deutlich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften haben statt der folgenden Verbfolge eine abweichende Lesart, die etwa so wiedergegeben werden kann: »Und er bewirkte, dass er sehen konnte; und er wurde wiederhergestellt und sah alles deutlich.«'
    reason: textual_variant
  - marker: b
    text: 'Oder: »und sah fortan alles deutlich«. Das letzte Verb steht im Imperfekt und bezeichnet das nun fortdauernde klare Sehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: Dann … noch einmal
  rationale: εἶτα bezeichnet die zeitliche Folge, πάλιν die Wiederholung. Die getrennte Wiedergabe klingt im Deutschen natürlich und bewahrt beide Bedeutungsanteile.
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: legte er ihm … die Hände auf die Augen
  rationale: Die deutsche Konstruktion mit Dativpronomen gibt das griechische Possessivverhältnis idiomatisch wieder und erhält die konkrete Handlung mit beiden Händen.
- source_word: διέβλεψεν
  choice: sah der Mann klar
  rationale: διαβλέπω bezeichnet hier das klare Sehen beziehungsweise die Erlangung klarer Sicht. Das ausdrücklich genannte Subjekt verhindert im Deutschen die mögliche Fehlbeziehung auf Jesus.
- source_word: ἀπεκατέστη
  choice: war wiederhergestellt
  rationale: ἀποκαθίστημι bezeichnet die Wiederherstellung in einen richtigen oder früheren Zustand. Die Formulierung bleibt bewusst allgemein und setzt nicht erläuternd „geheilt“ ein.
- source_word: ἐνέβλεπεν
  choice: konnte … sehen
  rationale: Das Imperfekt beschreibt den nun bestehenden beziehungsweise fortdauernden Zustand des Sehens. „Konnte sehen“ ist im Deutschen natürlicher als eine progressive Umschreibung, ohne den resultativen Verlauf zu tilgen.
- source_word: τηλαυγῶς
  choice: deutlich
  rationale: Das seltene Adverb bezeichnet klare, deutliche Sicht und kann möglicherweise auch Fernsicht anklingen lassen. „Deutlich“ bewahrt die Klarheit, ohne die unsichere Distanznuance in den Haupttext einzutragen.
- source_word: ἅπαντα
  choice: alles
  rationale: Der substantivierte neutrale Plural wird idiomatisch und umfassend mit „alles“ wiedergegeben.
theological_decisions:
- issue: Erzählweise der zweistufigen Heilung
  choice: Die Abfolge von erneutem Handauflegen, klarem Sehen, Wiederherstellung und anhaltender Sehfähigkeit bleibt erkennbar.
  alternative: Die drei Verben zu einer einzigen Aussage vollständiger Heilung zusammenziehen.
  rationale: Die griechische Verbfolge, zuletzt mit einem Imperfekt, schildert einen fortschreitenden Vorgang und einen daraus hervorgehenden Zustand. Eine Glättung würde die auffällige Zweistufigkeit der Erzählung abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Wechsel zu „der Mann“ klärt den Subjektbezug. Die Wortstellung vermeidet unnötige Wörtlichkeit, bewahrt aber die gestufte Verbfolge des griechischen Textes.
