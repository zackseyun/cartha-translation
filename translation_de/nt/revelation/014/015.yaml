  source_fidelity: Die Übersetzung gibt die Satzstruktur, die doppelte Begründung mit ὅτι und die Erntemetaphorik insgesamt zuverlässig wieder. Das präsentische Partizip καθημένῳ bezeichnet jedoch denjenigen, der auf der Wolke sitzt; »saß« verschiebt dies unnötig in die Vergangenheit. »Reif geworden ist« ist im Kontext eine vertretbare, nicht überinterpretierende Wiedergabe von ἐξηράνθη und stimmt mit der englischen Audit-Fassung »is ripe« überein.
  naturalness: Der Text ist modernes, würdiges und gut verständliches Standarddeutsch. »Setze deine Sichel an« ist als idiomatische Wiedergabe von Πέμψον τὸ δρέπανόν σου natürlich; die direkte Rede bleibt eindringlich.
  terminology: »Heiligtum« ist für ναός passend. »Ernte der Erde« wahrt die Bildsprache, ohne die Identität dessen auf der Wolke aus dem Vers heraus zu bestimmen. Keine Fußnote ist erforderlich.
