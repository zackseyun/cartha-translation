id: REV.14.15
reference: Revelation 14:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: de
  text: 'Und ein anderer Engel kam aus dem Heiligtum und rief dem, der auf der Wolke sitzt, mit lauter Stimme zu: »Setze deine Sichel an und ernte! Denn die Stunde zum Ernten ist gekommen, weil die Ernte der Erde reif geworden ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: Heiligtum
  rationale: Bezeichnet in der Offenbarung das innere Heiligtum bzw. den himmlischen Tempelbereich; »Heiligtum« ist genauer als das weiter gefasste »Tempel«.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Setze deine Sichel an
  rationale: Das wörtliche »Sende deine Sichel« klingt im Deutschen unnatürlich. Die idiomatische Wendung bewahrt den Sinn, die Sichel zur Ernte einzusetzen.
- source_word: θέρισον
  choice: ernte
  rationale: Gibt den Imperativ direkt und natürlich wieder.
- source_word: ἐξηράνθη
  choice: reif geworden ist
  rationale: Das Verb bedeutet wörtlich »ist ausgetrocknet/verdorrt«; bei Getreide bezeichnet dies bildhaft die erreichte Erntereife. Die Übersetzung bewahrt den agrarischen Sinn, ohne eine Überreife zu behaupten.
- source_word: ὁ θερισμὸς τῆς γῆς
  choice: die Ernte der Erde
  rationale: Bewahrt die Genitivkonstruktion und die endzeitliche Bildsprache des Ausgangstextes.
theological_decisions:
- issue: Bedeutung der Erntereife
  choice: reif geworden ist
  alternative: verdorrt ist / überreif ist
  rationale: Der Kontext beschreibt die Bereitschaft zur Ernte. »Überreif« fügt eine nicht zwingend ausgedrückte Steigerung hinzu; »verdorrt« könnte im Deutschen fälschlich Verderben statt Erntereife nahelegen.
- issue: Identität dessen, der auf der Wolke sitzt
  choice: keine interpretierende Benennung
  alternative: Menschensohn / Christus
  rationale: Der Vers selbst sagt nur »dem, der auf der Wolke saß«. Die Übersetzung wahrt diese Formulierung und löst die Identität nicht innerhalb dieses Verses ausdrücklich auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar und eindringlich; die wiederholte Begründungsstruktur mit »Denn … weil …« bildet die beiden ὅτι-Sätze ab, ohne unnötige Schwerfälligkeit.
