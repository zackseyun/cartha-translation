id: REV.14.4
reference: Revelation 14:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: de
  text: Das sind die, die sich nicht mit Frauen befleckt haben[a], denn sie sind Jungfrauen. Sie folgen dem Lamm, wohin es auch geht. Sie sind aus der Menschheit erkauft worden, als Erstlingsgabe für Gott und das Lamm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Möglicherweise steht dieses Bild für geistliche Reinheit oder dafür, dass sie sich nicht durch Götzendienst befleckt haben, statt ausschließlich sexuelle Enthaltsamkeit zu bezeichnen.
    reason: alternative_reading
  - marker: b
    text: 'Auch: „aus den Reihen der Menschen“. Das griechische Wort bezeichnet Menschen allgemein, nicht nur Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: sich nicht … befleckt haben
  rationale: Das passive Verb bezeichnet Befleckung oder Verunreinigung mit moralischen oder kultischen Anklängen. Die reflexive deutsche Form gibt den Zusammenhang natürlich wieder, ohne die Bildsprache abzuschwächen.
- source_word: μετὰ γυναικῶν
  choice: mit Frauen
  rationale: μετά mit Genitiv bedeutet hier „mit“; γυναικῶν kann Frauen oder Ehefrauen bezeichnen, doch der Kontext legt keine Beschränkung auf den Ehestand fest.
- source_word: παρθένοι
  choice: Jungfrauen
  rationale: Die konkrete Bezeichnung bewahrt die auffällige Formulierung des griechischen Textes, einschließlich ihrer Anwendung auf die beschriebene männliche Gruppe, statt sie deutend mit „keusch“ wiederzugeben.
- source_word: ἀκολουθοῦντες
  choice: sie folgen
  rationale: Das Präsenspartizip beschreibt ihr fortdauerndes, kennzeichnendes Handeln; das deutsche Präsens gibt dies idiomatisch wieder.
- source_word: ἀρνίῳ
  choice: dem Lamm
  rationale: Das Lamm ist in der Offenbarung eine christologische Titel- und Bildbezeichnung; die traditionelle Wiedergabe erhält die apokalyptische und opferbezogene Bildwelt.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: wohin es auch geht
  rationale: ὅπου ἄν mit Konjunktiv drückt Unbestimmtheit aus. „Wohin … auch“ bildet die offene Bedeutung natürlich ab; das grammatische Neutrum „es“ entspricht dem deutschen Wort „Lamm“.
- source_word: ἠγοράσθησαν
  choice: wurden … erkauft
  rationale: ἀγοράζω bezeichnet Kaufen. „Erkauft“ bewahrt die Kaufmetapher und ihre erlösungsbezogenen Anklänge, ohne sie ausdrücklich mit „erlöst“ auszudeuten.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: aus den Menschen
  rationale: ἄνθρωποι meint Menschen allgemein und nicht ausschließlich Männer. Die Formulierung ist geschlechtsübergreifend und bildet die Absonderung aus der Menschheit knapp ab.
- source_word: ἀπαρχὴ
  choice: Erstlingsgabe
  rationale: ἀπαρχή bezeichnet den ersten, Gott dargebrachten Anteil. „Erstlingsgabe“ bewahrt sowohl den kultischen Charakter als auch die Erntebildsprache.
theological_decisions:
- issue: Ob die Aussage über die Nichtbefleckung mit Frauen und das Jungfrausein wörtlich oder metaphorisch wiederzugeben ist
  choice: 'Die konkrete Aussage bleibt im Haupttext erhalten: „sich nicht mit Frauen befleckt haben, denn sie sind Jungfrauen“.'
  alternative: Die Worte können als Bild für geistliche Reinheit oder Freiheit von götzendienerischer Befleckung verstanden werden.
  rationale: Der griechische Wortlaut ist konkret, während die Offenbarung häufig symbolisch spricht. Die Übersetzung bewahrt diese Spannung und verlagert die mögliche symbolische Deutung in eine Fußnote.
- issue: Sinn der Erstlingsgabe
  choice: Die Gruppe wird als „Erstlingsgabe für Gott und das Lamm“ bezeichnet.
  alternative: Man könnte stärker deutend „erste Opfergabe“ oder „erster Anteil der Erlösten“ formulieren.
  rationale: Die nicht ausgedeutete kultische und agrarische Metapher lässt offen, in welchem genauen Verhältnis diese Gruppe zu weiteren Menschen steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener apokalyptischer Bildsprache. Die ungewöhnliche Bezeichnung „Jungfrauen“ wird trotz ihrer Härte nicht geglättet; „Erstlingsgabe“ hält den kultischen und agrarischen Hintergrund präsent.
