  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. Die Satzfolge lässt sich jedoch etwas flüssiger und näher an der bildhaften Schau formulieren, indem die Gestalt unmittelbar als „einer wie ein Menschensohn“ beschrieben wird, statt die griechische Vergleichskonstruktion durch „der ... glich“ stärker zu abstrahieren.
  terminology: „Weiße Wolke“, „goldener Kranz“ und „scharfe Sichel“ sind treffend. „Kranz“ bewahrt sinnvoll den Unterschied von στέφανος gegenüber διάδημα. Die Fußnote soll diese Bedeutung als gewöhnliche Nuance und nicht als ausnahmslose Abgrenzung formulieren.
