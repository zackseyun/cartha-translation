id: REV.14.14
reference: Revelation 14:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: de
  text: 'Und ich sah, und siehe: eine weiße Wolke. Auf der Wolke saß einer wie ein Menschensohn[a]. Auf seinem Kopf hatte er einen goldenen Kranz[b] und in seiner Hand eine scharfe Sichel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einer wie der Menschensohn“. Die Formulierung erinnert an Daniel 7,13 und wird häufig als messianischer Titel verstanden; im Griechischen steht hier jedoch kein Artikel: wörtlich „wie ein Menschensohn“.'
    reason: alternative_reading
  - marker: b
    text: Das griechische Wort bezeichnet einen Kranz, oft den Ehrenkranz eines Siegers, im Unterschied zu einem königlichen Diadem; je nach Zusammenhang kann es auch mit „Krone“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: siehe
  rationale: Bewahrt den lebhaften Hinweischarakter der visionären Erzählung. Die leicht gehobene Form passt zur apokalyptischen Szene und lenkt unmittelbar die Aufmerksamkeit auf das Folgende.
- source_word: νεφέλη λευκή
  choice: eine weiße Wolke
  rationale: Gibt Substantiv und Adjektiv direkt und natürlich wieder, ohne die symbolisch bedeutsame Farbangabe deutend zu „hell“ zu erweitern.
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: Auf der Wolke saß einer
  rationale: Natürliches modernes Deutsch, das die sitzende Gestalt und ihre Position auf der Wolke klar wiedergibt. „Einer“ ergänzt das im Griechischen nur durch das Partizip bezeichnete Wesen.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: der einem Menschensohn glich
  rationale: Bewahrt die Vergleichsform sowie die artikellose griechische Wendung und lässt zugleich den deutlichen Anklang an Daniel 7,13 bestehen.
- source_word: στέφανον χρυσοῦν
  choice: einen goldenen Kranz
  rationale: στέφανος bezeichnet typischerweise einen Ehren- oder Siegeskranz und unterscheidet sich von einem königlichen Diadem. „Kranz“ wahrt diese Unterscheidung, während die Fußnote die mögliche Wiedergabe „Krone“ erläutert.
- source_word: δρέπανον ὀξύ
  choice: eine scharfe Sichel
  rationale: Die geläufige und genaue deutsche Bezeichnung passt zum unmittelbar folgenden Erntebild.
theological_decisions:
- issue: Ob υἱὸν ἀνθρώπου ausdrücklich als christologischer Titel wiederzugeben ist
  choice: „einem Menschensohn“ im Haupttext
  alternative: „dem Menschensohn“
  rationale: Der artikellose griechische Wortlaut wird nicht stillschweigend zu einem feststehenden Titel verstärkt. Der Bezug auf Daniel 7,13 und die verbreitete messianisch-christologische Deutung bleiben in der Fußnote sichtbar.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, für eine apokalyptische Vision angemessenem Ton. Die eröffnende Formel „Und ich sah, und siehe“ erhält bewusst den eindringlichen Erzählrhythmus des Griechischen; die anschließende Satzteilung vermeidet unnötige Schwerfälligkeit.
