id: REV.14.1
reference: Revelation 14:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: de
  text: 'Dann sah ich: Siehe, das Lamm stand auf dem Berg Zion, und bei ihm waren 144.000, die seinen Namen und den Namen seines Vaters auf ihrer Stirn geschrieben trugen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen nur: „den Namen seines Vaters auf ihrer Stirn geschrieben“.'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Dann sah ich
  rationale: Καί führt die Folge der Vision weiter; „Dann“ gibt den erzählerischen Übergang natürlich wieder, während „sah ich“ εἶδον direkt entspricht.
- source_word: ἰδοὺ
  choice: und siehe
  rationale: Bewahrt den eindringlichen, aufmerksamkeitslenkenden Ton der apokalyptischen Vision in würdigem, verständlichem Deutsch.
- source_word: τὸ ἀρνίον
  choice: das Lamm
  rationale: Die etablierte Wiedergabe des christologischen Titels in der Offenbarung; eine Verkleinerungsform wie „Lämmchen“ wäre sachlich und stilistisch irreführend.
- source_word: ἑστὸς
  choice: stand
  rationale: Das Perfektpartizip bezeichnet den bestehenden Zustand des Lammes; das deutsche Präteritum „stand“ gibt diesen im Visionsbericht knapp und idiomatisch wieder.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: auf dem Berg Zion
  rationale: Natürliche deutsche Ortsangabe, die den Eigennamen Zion bewahrt.
- source_word: μετ’ αὐτοῦ
  choice: Bei ihm waren
  rationale: Macht das im Griechischen implizite Prädikat für die folgende Zahlengruppe im Deutschen ausdrücklich und liest sich natürlicher als eine wörtliche Partizipialfügung.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: '144.000'
  rationale: Bewahrt die genaue Zahl und verwendet die im modernen Deutschen übliche Ziffernschreibung mit Tausenderpunkt.
- source_word: ἔχουσαι
  choice: die … geschrieben trugen
  rationale: Die feminine Form stimmt nach dem Sinn mit χιλιάδες überein. „Trugen“ gibt ἔχω im Zusammenhang einer sichtbaren Aufschrift natürlich wieder, ohne die dauerhafte, bereits vollzogene Beschriftung des Perfektpartizips zu verlieren.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: seinen Namen und den Namen seines Vaters
  rationale: Bewahrt die zwei koordinierten Namen und vermeidet, sie als einen einzigen Namen oder als Apposition auszulegen.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: auf ihrer Stirn geschrieben
  rationale: Gibt die bereits bestehende Aufschrift und ihren Ort direkt wieder. Der distributive Singular „auf ihrer Stirn“ ist im Deutschen bei einer Gruppe idiomatisch.
theological_decisions:
- issue: Identität des Lammes
  choice: Der Titel wird schlicht als „das Lamm“ wiedergegeben.
  alternative: „das Opferlamm“
  rationale: Der Kontext bezeichnet Christus, doch eine Ergänzung wie „Opfer-“ würde eine theologische Deutung ausdrücklich machen, die in diesem Vers nicht lexikalisch ausformuliert ist.
- issue: Verhältnis der beiden Namen
  choice: „seinen Namen und den Namen seines Vaters“
  alternative: „seinen Namen, nämlich den Namen seines Vaters“
  rationale: Das Griechische koordiniert zwei Objekte. Die Übersetzung wahrt sowohl ihre Unterscheidung als auch ihre enge Verbindung, ohne sie gleichzusetzen.
- issue: Textvariante bei der Aufschrift
  choice: Im Haupttext stehen nach dem SBLGNT sowohl der Name des Lammes als auch der Name seines Vaters.
  alternative: Nur „den Namen seines Vaters“
  rationale: Eine beachtliche Variante lässt τὸ ὄνομα αὐτοῦ καὶ aus. Da dies den Inhalt der Aufschrift verändert, wird die Variante in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem apokalyptischem Aufmerksamkeitssignal „siehe“. Kurze Hauptsätze erhöhen die Klarheit. Der Fußnotenmarker [a] steht unmittelbar nach dem Satz, auf den sich die Textvariante bezieht.
