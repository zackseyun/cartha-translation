  naturalness: 'Die Wortstellung „den Namen … auf ihrer Stirn geschrieben trugen“ ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig schwerfällig. „auf ihrer Stirn die Namen geschrieben trugen“ stellt die feste und natürliche Verbindung „etwas auf der Stirn geschrieben tragen“ klarer her. Die Umstellung von „und siehe:“ zu „: Siehe,“ ist ebenfalls idiomatischer, ohne den nachdrücklichen Charakter von ἰδού abzuschwächen.'
  terminology: „das Lamm“, „Berg Zion“, „Vater“ und „Stirn“ sind angemessen und terminologisch konsistent. Die Fußnote dokumentiert die relevante Variante, ohne die Hauptlesart zu verwischen.
