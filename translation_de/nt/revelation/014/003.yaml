id: REV.14.3
reference: Revelation 14:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: de
  text: Und sie singen gleichsam ein neues Lied vor dem Thron und vor den vier lebendigen Wesen und den Ältesten.[a] Niemand konnte das Lied lernen außer den hundertvierundvierzigtausend, die von der Erde erkauft worden sind.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie ein neues Lied“ oder „als ein neues Lied“. Das griechische Wort kann einen Vergleich oder einen visionären Eindruck ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die von der Erde erlöst worden sind“. Das griechische Verb bedeutet wörtlich „kaufen“ oder „erkaufen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: sie singen
  rationale: Das Präsens wird als anschauliches visionäres Präsens beibehalten; im Deutschen ist das einfache Präsens natürlich.
- source_word: ὡς ᾠδὴν καινὴν
  choice: etwas, das wie ein neues Lied klingt
  rationale: ὡς kennzeichnet hier wahrscheinlich die visionäre Wahrnehmung oder Ähnlichkeit. Die Formulierung bewahrt diese Nuance, ohne zu bestreiten, dass es tatsächlich ein neues Lied ist.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ ist knapp und idiomatisch und bezeichnet die Gegenwart des Thrones und der himmlischen Wesen.
- source_word: τῶν τεσσάρων ζῴων
  choice: den vier lebendigen Wesen
  rationale: ζῷα bezeichnet hier die himmlischen Wesen am Thron; „lebendige Wesen“ vermeidet die irreführenden Ausdrücke „Tiere“ oder „Bestien“.
- source_word: τῶν πρεσβυτέρων
  choice: den Ältesten
  rationale: „Älteste“ ist die natürliche Gruppenbezeichnung für die πρεσβύτεροι im himmlischen Thronsaal der Offenbarung.
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: Niemand konnte ... lernen
  rationale: Die deutsche Formulierung gibt das Imperfekt der Fähigkeit und den Grundsinn von μανθάνω natürlich wieder.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: die hundertvierundvierzigtausend
  rationale: Die ausgeschriebene Zahl bewahrt den feierlichen literarischen Stil und den bestimmten Artikel.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: die von der Erde erkauft worden waren
  rationale: „Erkauft“ bewahrt die Kaufmetaphorik von ἀγοράζω und ist im Deutschen würdiger und idiomatischer als „gekauft“, ohne sie im Haupttext durch den stärker deutenden Begriff „erlöst“ zu ersetzen.
theological_decisions:
- issue: Bedeutung von ὡς in der visionären Beschreibung
  choice: „etwas, das wie ein neues Lied klingt“ als Wahrnehmungs- bzw. Vergleichssprache
  alternative: „als ein neues Lied“ oder „wie ein neues Lied“
  rationale: Die Formulierung kennzeichnet die visionäre Wahrnehmung, entscheidet aber nicht, dass das Lied nur scheinbar neu gewesen sei.
- issue: Wiedergabe von ἠγορασμένοι
  choice: „erkauft“
  alternative: „erlöst“
  rationale: Der Haupttext erhält die ausdrückliche Markt- und Kaufmetapher des griechischen Verbs; die theologisch vertraute Deutung „erlöst“ wird als mögliche Wiedergabe in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Text, wird aber für natürliche deutsche Lesbarkeit leicht gegliedert. Die visionäre Unschärfe von ὡς und die Kaufmetaphorik von ἀγοράζω bleiben erhalten.
