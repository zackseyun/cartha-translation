revisions:
- from: 'Und ich hörte eine Stimme aus dem Himmel sagen: »Schreibe: Glückselig sind die Toten, die von jetzt an im Herrn sterben.« »Ja«, spricht der Geist, »sie sollen von ihren Mühen ausruhen[a]; denn ihre Taten gehen mit ihnen[b].«'
  to: 'Und ich hörte eine Stimme aus dem Himmel sagen: »Schreibe: Selig sind die Toten, die von jetzt an im Herrn sterben.« »Ja«, spricht der Geist, »damit sie sich von ihren Mühen ausruhen; denn ihre Taten folgen ihnen.«'
  rationale: Die Revision modernisiert die Seligpreisungsformel, ersetzt die zu stark volitive und weniger idiomatische Formulierung »sie sollen ... ausruhen« durch eine zweck-/folgeoffene Wiedergabe und verwendet für ἀκολουθεῖ μετ’ αὐτῶν die im Deutschen natürliche Wendung »folgen ihnen«. Die Fußnoten bleiben an den einschlägigen Textstellen verankert und erläutern die jeweiligen Übersetzungsfragen, ohne den Sinn dogmatisch festzulegen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:18:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des griechischen Textes zutreffend wieder: Stimme aus dem Himmel, Schreibbefehl, die im Herrn Sterbenden, den Zeitpunkt »von jetzt an«, die Bestätigung durch den Geist sowie Ruhe und nachfolgende Taten. Die Wiedergabe von ἵνα ἀναπαήσονται als »sie sollen ... ausruhen« legt jedoch einen auffordernden bzw. normativen Sinn nahe, den die ungewöhnliche ἵνα-Konstruktion mit Futurindikativ nicht zwingend hat. Eine Zweck-/Folgeformulierung wahrt die Ambiguität besser.'
  naturalness: »Glückselig« wirkt im heutigen Standarddeutsch unnötig altertümlich; »Selig« ist sowohl in biblischem Register als auch im modernen Gebrauch die geläufige Seligpreisungsformel. »Von ihren Mühen ausruhen« ist ohne Reflexivpronomen weniger idiomatisch. »Ihre Taten gehen mit ihnen« ist verständlich, aber »ihre Taten folgen ihnen« ist die natürliche deutsche Entsprechung und transportiert die Aussage ohne eine mechanische Nachbildung von μετά.
  terminology: »im Herrn«, »der Geist«, »Mühen« und »Taten« sind tragfähige und theologisch nicht einengende Wiedergaben. »Selig« bewahrt den etablierten biblischen Registerwert von μακάριοι besser als »Glückselig«.
  issues:
  - severity: medium
    issue: »sie sollen von ihren Mühen ausruhen«
    rationale: Die Formulierung klingt im Deutschen volitiv oder normativ und lässt zudem das in der Standardsprache erwartete Reflexivpronomen vermissen. Der griechische Futurindikativ in der ἵνα-Konstruktion wird besser durch eine Zweck-/Folgeformulierung wiedergegeben.
  - severity: low
    issue: »Glückselig«
    rationale: Das Wort ist verständlich, aber im modernen Standarddeutsch deutlich altertümlicher als die in biblischen Seligpreisungen übliche Form »selig«.
  - severity: low
    issue: »ihre Taten gehen mit ihnen«
    rationale: Die Formulierung bildet μετά zwar sichtbar ab, ist aber weniger idiomatisch als »ihre Taten folgen ihnen«. Das deutsche Verb »folgen« kann hier die Begleitung ausreichend ausdrücken.
  - severity: low
    issue: Fußnote a enthält »ausruhen werden«
    rationale: Diese Wortstellung ist im Deutschen unnötig schwerfällig. Die Anmerkung sollte die syntaktische Ambiguität erläutern, statt eine unnatürliche Alternativformulierung anzubieten.
  revised_text: 'Und ich hörte eine Stimme aus dem Himmel sagen: »Schreibe: Selig sind die Toten, die von jetzt an im Herrn sterben.« »Ja«, spricht der Geist, »damit sie sich von ihren Mühen ausruhen; denn ihre Taten folgen ihnen.«'
  revised_footnotes:
