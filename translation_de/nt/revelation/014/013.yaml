id: REV.14.13
reference: Revelation 14:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: de
  text: 'Und ich hörte eine Stimme aus dem Himmel sagen: »Schreibe: Selig sind die Toten, die von jetzt an im Herrn sterben.« »Ja«, spricht der Geist, »damit sie sich von ihren Mühen ausruhen; denn ihre Taten folgen ihnen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: eine Stimme aus dem Himmel sagen
  rationale: Gibt φωνή, ἐκ und das Partizip λεγούσης eng und zugleich idiomatisch wieder.
- source_word: Γράψον
  choice: Schreibe
  rationale: Der Aoristimperativ wird als knapper, unmittelbarer Befehl wiedergegeben; ein im Griechischen nicht vorhandenes Objekt wird nicht ergänzt.
- source_word: Μακάριοι
  choice: Glückselig
  rationale: Bewahrt die feierliche Sprache einer Seligpreisung und bezeichnet mehr als ein bloß subjektives Glücksgefühl.
- source_word: οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: die im Herrn sterben
  rationale: Die prägnante Formulierung lässt die theologische Weite von ἐν κυρίῳ bestehen, ohne sie paraphrasierend einzuengen.
- source_word: ἀπ’ ἄρτι
  choice: von jetzt an
  rationale: Natürliche moderne Wiedergabe des zeitlichen Ausgangspunkts.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: »Ja«, spricht der Geist
  rationale: ναί bleibt als ausdrückliche Bestätigung erhalten; das historische Präsens »spricht« passt zum feierlichen Register.
- source_word: ἵνα ἀναπαήσονται
  choice: sie sollen … ausruhen
  rationale: Die ungewöhnliche Verbindung von ἵνα mit Futur wird ziel- bzw. folgebezogen wiedergegeben, ohne die Aussage auf eine rein zeitliche Vorhersage zu reduzieren.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: von ihren Mühen
  rationale: κόπος bezeichnet beschwerliche, ermüdende Arbeit oder Mühsal; »Mühen« hält diese Bedeutungsbreite offen.
- source_word: τὰ γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν
  choice: denn ihre Taten gehen mit ihnen
  rationale: »Taten« ist im heutigen Deutsch natürlich; »gehen mit ihnen« bildet μετά ausdrücklich ab und vermeidet die schwerfällige Wendung »folgen mit ihnen«.
theological_decisions:
- issue: Bedeutung von ἐν κυρίῳ
  choice: im Herrn
  alternative: dem Herrn treu / dem Herrn zugehörig
  rationale: Die relativ formale Wiedergabe wahrt mögliche Aspekte von Verbundenheit, Zugehörigkeit und Treue, ohne einen davon zum alleinigen Sinn zu erklären.
- issue: Aussagekraft von ἵνα ἀναπαήσονται
  choice: sie sollen von ihren Mühen ausruhen
  alternative: damit sie von ihren Mühen ausruhen werden / sodass sie von ihren Mühen ausruhen
  rationale: Die Formulierung erhält den Zweck- bzw. Ergebnischarakter der ἵνα-Konstruktion und lässt ihre genaue Nuance offen.
- issue: Verhältnis der Taten zu den seliggepriesenen Toten
  choice: ihre Taten gehen mit ihnen
  alternative: ihre Werke folgen ihnen
  rationale: Die Übersetzung sagt weder, die Taten verdienten das Heil, noch, sie seien bedeutungslos; sie bewahrt die Aussage des Textes ohne dogmatische Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Glückselig« markiert bewusst die Sprache einer Seligpreisung; ansonsten werden geläufige Wörter und eine klare Satzführung verwendet. Sämtliche Fußnotenmarker stehen im Haupttext.
