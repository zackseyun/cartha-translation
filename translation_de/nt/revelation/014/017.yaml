id: REV.14.17
reference: Revelation 14:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: de
  text: Und ein anderer Engel kam aus dem Tempel im Himmel[a]. Auch er hatte eine scharfe Sichel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtum im Himmel“. Das griechische Wort ναός kann genauer den inneren Tempelbereich beziehungsweise das Heiligtum bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: ein anderer Engel
  rationale: ἄλλος bezeichnet hier einen weiteren Engel in der Folge der visionären Gestalten; die Formulierung ist im Deutschen natürlich und genau.
- source_word: ἐξῆλθεν
  choice: kam aus … heraus / kam aus
  rationale: Der Aorist von ἐξέρχομαι bezeichnet das Hervortreten aus einem Innenraum. Im Satz genügt das idiomatische „kam aus dem Tempel“.
- source_word: ναοῦ
  choice: Tempel
  rationale: ναός kann insbesondere das innere Heiligtum bezeichnen. „Tempel“ bleibt als verständliche Standardwiedergabe im Haupttext; „Heiligtum“ wird als echte lexikalische Alternative in der Fußnote genannt.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: im Himmel
  rationale: Die attributive Wendung bestimmt den Tempel als im Himmel befindlich. Die knappe deutsche Form ist eindeutig und natürlich.
- source_word: ἔχων καὶ αὐτὸς
  choice: Auch er hatte
  rationale: Die finite deutsche Wiedergabe vermittelt klar, dass auch dieser Engel wie die zuvor genannte Gestalt eine Sichel besitzt, und bewahrt die Betonung von καὶ αὐτός.
- source_word: δρέπανον ὀξύ
  choice: eine scharfe Sichel
  rationale: δρέπανον bezeichnet ein Erntegerät, eine Sichel; ὀξύ hebt dessen Schärfe hervor. Die Wendung bewahrt das anschauliche Erntebild.
theological_decisions:
- issue: Deutung des himmlischen Tempelbildes
  choice: ναός wird ohne interpretierende Erweiterung als „Tempel“ wiedergegeben.
  alternative: „Heiligtum“ zur stärkeren Betonung des inneren Tempelbereichs oder eine symbolisch ausdeutende Umschreibung.
  rationale: Der Text nennt einen Tempel im Himmel, ohne das Bild architektonisch, liturgisch oder symbolisch näher zu erklären. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Zwei kurze Sätze vermeiden eine schwerfällige Partizipialkonstruktion und bewahren zugleich die Hervorhebung „Auch er“. Der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Wendung.
