id: REV.14.2
reference: Revelation 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: de
  text: Und ich hörte einen Klang[a] aus dem Himmel, wie den Klang vieler Wasser[b] und wie den Klang eines gewaltigen Donners. Und der Klang, den ich hörte, war wie der von Harfenspielern, die auf ihren Harfen[c] spielten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder jeweils »Stimme«; das griechische Wort φωνή kann je nach Zusammenhang sowohl eine Stimme als auch einen Klang oder Laut bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: »Viele Wasser« ist ein biblisches Bild für ein mächtiges, überwältigendes Tosen; vergleiche Hesekiel 43,2.
    reason: cross_reference
  - marker: c
    text: Die griechische κιθάρα war ein antikes Saiteninstrument, das eher einer Leier als einer heutigen Harfe glich; traditionell wird es mit »Harfe« wiedergegeben.
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: Klang
  rationale: Das dreimalige φωνή bezeichnet hier ein Hörphänomen, das mit Wasser, Donner und Instrumentalmusik verglichen wird. »Klang« wahrt die Wiederholung und passt im Deutschen zu allen drei Vergleichen, ohne vorschnell eine sprechende Person vorauszusetzen.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel
  rationale: In der Offenbarung bezeichnet οὐρανός in diesem Zusammenhang den himmlischen Bereich; »aus dem Himmel« gibt zudem die Ausgangsrichtung von ἐκ prägnant wieder.
- source_word: ὡς
  choice: wie
  rationale: ὡς leitet die bildhaften Vergleiche des Verses ein; »wie« ist die klare und natürliche deutsche Entsprechung.
- source_word: ὑδάτων πολλῶν
  choice: vieler Wasser
  rationale: Die bewusst bibelsprachliche Formulierung bewahrt das Bild einer Vielzahl beziehungsweise Fülle von Wassern und seine alttestamentliche Resonanz, statt es deutend zu »Wassermassen« oder »tosendem Meer« umzuformen.
- source_word: βροντῆς μεγάλης
  choice: eines gewaltigen Donners
  rationale: μέγας bezeichnet hier Stärke und überwältigende Intensität. »Gewaltig« klingt bei Donner im Deutschen natürlicher als das wörtlichere »groß«.
- source_word: κιθαρῳδῶν
  choice: Harfenspielern
  rationale: Das Substantiv bezeichnet Musiker, die mit einer κιθάρα verbunden sind; das folgende Partizip hebt ausdrücklich ihr Instrumentalspiel hervor. »Harfenspieler« ist verständlich und entspricht der etablierten Wiedergabe in der Offenbarung.
- source_word: κιθαριζόντων
  choice: spielten
  rationale: Das Partizip bezeichnet das Spielen des Instruments. Die finite Form im Relativsatz ergibt natürliches modernes Deutsch.
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: auf ihren Harfen
  rationale: »Auf einem Instrument spielen« ist idiomatisches Deutsch. »Harfe« folgt der vertrauten biblischen Benennung, während eine Fußnote die historische Instrumentenart erläutert.
theological_decisions:
- issue: Art des himmlischen Hörphänomens
  choice: φωνή durchgehend als »Klang« wiedergeben
  alternative: φωνή durchgehend als »Stimme« oder wechselnd als »Stimme«, »Rauschen« und »Klang« wiedergeben
  rationale: Die Vergleiche mit Wasser, Donner und Instrumentalspiel betonen zunächst den akustischen Eindruck. »Klang« vermeidet die unbelegte Festlegung auf einen persönlichen Sprecher und erhält zugleich die dreifache Wiederholung des griechischen Wortes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter biblischer Bildsprache. Die Wiederholung von »Klang« spiegelt die Struktur des griechischen Textes; »viele Wasser« bleibt als markantes Schriftbild erhalten und wird in der Fußnote erläutert.
