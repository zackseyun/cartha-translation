id: REV.14.18
reference: Revelation 14:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: de
  text: 'Und ein anderer Engel kam vom Altar her; er hatte Macht über das Feuer. Er rief dem, der die scharfe Sichel hatte, mit lauter Stimme zu: »Setze deine scharfe Sichel ein[a] und ernte die Trauben vom Weinstock der Erde[b], denn seine Beeren sind reif.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schick deine scharfe Sichel aus.« Das griechische Verb bedeutet wörtlich »senden« oder »schicken«; im Bild der Ernte kann es sinngemäß als »einsetzen« verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Der »Weinstock der Erde« ist ein apokalyptisches Bild. Wen er bezeichnet, wird hier nicht ausdrücklich gesagt; der Zusammenhang handelt jedoch vom Gericht.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: ein anderer Engel
  rationale: In der visionären Erzählung der Offenbarung bezeichnet ἄγγελος einen Engel; ἄλλος wahrt die Abfolge weiterer Engelgestalten.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: vom Altar her
  rationale: Die Formulierung gibt die Herkunft vom himmlischen Altar natürlich wieder, ohne ein Hervorkommen aus dem Inneren des Altars nahezulegen.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: er hatte Macht über das Feuer
  rationale: Die attributive Partizipialfügung beschreibt diesen Engel. »Macht über« gibt ἐξουσία ἐπί als Befugnis beziehungsweise Verfügungsgewalt wieder.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: Er rief … mit lauter Stimme zu
  rationale: Dies bewahrt das ausdrückliche Substantiv φωνή und klingt zugleich in modernem Deutsch natürlich und würdig.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: dem, der die scharfe Sichel hatte
  rationale: Die substantivierte Partizipialfügung bezeichnet den Angeredeten; δρέπανον und ὀξύ werden als »scharfe Sichel« wiedergegeben.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Schick deine scharfe Sichel aus
  rationale: »Schick … aus« hält sich eng an das Grundbild von πέμπω und bewahrt die auffällige Wiederholung von »scharfe Sichel«; eine idiomatischere Ernteformulierung steht in der Fußnote.
- source_word: τρύγησον
  choice: ernte
  rationale: τρυγάω bezeichnet hier das Einbringen der Weinlese. »Ernte« ist im Deutschen beim ausdrücklich genannten Traubenobjekt klar und natürlich.
- source_word: τοὺς βότρυας
  choice: die Traubenbüschel
  rationale: βότρυς bezeichnet ein Büschel beziehungsweise eine Traube als Fruchtstand. »Traubenbüschel« vermeidet die mögliche Verwechslung von »Trauben« mit einzelnen Beeren.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: vom Weinstock der Erde
  rationale: Die doppelte Genitivfügung und das apokalyptische Bild bleiben erhalten; »vom« ergibt sich im Deutschen natürlich aus dem Verb »ernten«.
- source_word: ἤκμασαν
  choice: sind reif
  rationale: ἀκμάζω bezeichnet hier das Erreichen der Reife. »Sind reif« ist natürlich und fügt keine unnötige Steigerung wie »vollreif« hinzu.
- source_word: αἱ σταφυλαὶ αὐτῆς
  choice: seine Trauben
  rationale: σταφυλαί sind die Trauben beziehungsweise Weinbeeren des grammatisch maskulinen deutschen Wortes »Weinstock«; daher ist »seine« idiomatisch.
theological_decisions:
- issue: Deutung des apokalyptischen Bildes τῆς ἀμπέλου τῆς γῆς
  choice: »der Weinstock der Erde« bleibt als Bild im Haupttext stehen.
  alternative: Das Bild ausdrücklich als die gottlosen Menschen der Erde oder allgemein als die Menschheit auslegen.
  rationale: Der Zusammenhang weist auf Gericht hin, doch der Vers selbst benennt den Bezug des Weinstocks nicht ausdrücklich. Die Übersetzung bewahrt daher die Bildsprache und ihre Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede ist klar markiert. Die bildhafte und wiederholende Sprache des griechischen Textes bleibt erhalten, ohne das Gerichtsmotiv im Haupttext weiter auszudeuten.
