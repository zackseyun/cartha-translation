id: REV.14.7
reference: Revelation 14:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: de
  text: 'und sagte mit lauter Stimme: »Fürchtet Gott[a] und gebt ihm die Ehre! Denn die Stunde seines Gerichts ist gekommen. Betet den an, der Himmel und Erde, Meer und Wasserquellen geschaffen hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Habt Ehrfurcht vor Gott.« Das griechische Verb kann sowohl ehrfürchtige Scheu als auch Furcht angesichts des Gerichts ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: und sagte mit lauter Stimme
  rationale: Das Partizip wird als fortführender deutscher Hauptsatz wiedergegeben und bleibt so mit dem vorausgehenden Zusammenhang verbunden. »Mit lauter Stimme« bewahrt die konkrete Ausdrucksweise des Griechischen.
- source_word: Φοβήθητε τὸν θεόν
  choice: Fürchtet Gott
  rationale: »Fürchten« bewahrt im Zusammenhang von Anbetung und Gericht sowohl Ehrfurcht als auch das Moment des Erschreckens, ohne die Aussage auf bloße Angst oder bloßen Respekt zu verengen.
- source_word: δότε αὐτῷ δόξαν
  choice: gebt ihm die Ehre
  rationale: Die feste deutsche Wendung gibt den Sinn von δόξα natürlich wieder; der bestimmte Artikel entspricht hier idiomatischem Deutsch.
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: Denn die Stunde seines Gerichts ist gekommen
  rationale: »Denn« gibt die begründende Funktion von ὅτι wieder. »Stunde« erhält die apokalyptische Zuspitzung von ὥρα, während »seines Gerichts« die knappe Genitivkonstruktion wahrt.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: Betet den an, der … geschaffen hat
  rationale: προσκυνέω bezeichnet hier religiöse Anbetung. Der substantivierte Aoristpartizip wird als natürlicher deutscher Relativsatz wiedergegeben.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: Himmel und Erde, Meer und Wasserquellen
  rationale: Die Schöpfungsaufzählung bleibt erhalten. »Wasserquellen« ist eine natürliche knappe Wiedergabe des griechischen Plurals πηγὰς ὑδάτων.
theological_decisions:
- issue: Bedeutungsumfang des Gebots Φοβήθητε τὸν θεόν
  choice: Fürchtet Gott
  alternative: Habt Ehrfurcht vor Gott
  rationale: Der Gerichts- und Anbetungskontext verbindet ehrfürchtige Verehrung mit wirklicher Furcht. »Fürchtet« lässt diese Spannung bestehen, während »Habt Ehrfurcht« die Gerichtsdimension abschwächen könnte.
- issue: Genitiv in τῆς κρίσεως αὐτοῦ
  choice: seines Gerichts
  alternative: des Gerichts, das er hält
  rationale: Die knappe Formulierung lässt offen, ob vor allem Gottes richterliches Handeln, sein Urteil oder das ihm zugehörige Gericht im Blick steht, und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Bildsprache. Die Imperative sind unmittelbar und kräftig; die Spannung zwischen Ehrfurcht und Gerichtsfurcht wird nicht geglättet.
