  source_fidelity: Der Text gibt die drei griechischen Handlungen und ihre Abfolge sachgerecht wieder. „schwang seine Sichel über die Erde“ entspricht der im englischen POB-Audit festgelegten idiomatischen Auslegung von ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν. „erntete die Trauben vom Weinstock der Erde“ legt die bei einer Weinlese implizierten Trauben verständlich aus, ohne die Bildaussage zu verändern. Die große Kelter und der Zorn Gottes sind vollständig erhalten.
  naturalness: Modernes, flüssiges und würdiges Standarddeutsch. Die Wiederaufnahme mit „sie“ bezieht sich im Deutschen natürlich auf die geernteten Trauben; „Kelter des Zornes Gottes“ ist knapp, verständlich und dem apokalyptischen Register angemessen.
  terminology: „Sichel“, „Weinstock“, „Trauben“, „Kelter“ und „Zorn Gottes“ sind passende, etablierte Begriffe. Die bildhafte Genitivverbindung wird bewahrt und nicht konfessionell deutend entfaltet.
