id: REV.14.19
reference: Revelation 14:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: de
  text: Und der Engel schwang seine Sichel über die Erde, erntete die Trauben vom Weinstock der Erde und warf sie in die große Kelter des Zornes Gottes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: schwang seine Sichel über die Erde
  rationale: Im Erntebild bezeichnet βάλλω mit der Sichel deren ausholenden Einsatz; die Wiedergabe vermeidet das im Deutschen missverständliche Bild, die Sichel werde weggeworfen oder in den Boden gestoßen.
- source_word: ἐτρύγησεν
  choice: erntete die Trauben
  rationale: Das Verb bezeichnet hier die Weinlese. Die Ergänzung „die Trauben“ macht im Deutschen den natürlichen Gegenstand der Ernte deutlich, ohne das Bild inhaltlich zu erweitern.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: vom Weinstock der Erde
  rationale: ἄμπελος kann Weinstock oder Weinstockbestand bezeichnen. Im Zusammenhang mit ἐτρύγησεν sind die geernteten Trauben gemeint; „Weinstock der Erde“ bewahrt zugleich die Bildsprache und die Wiederholung von „Erde“.
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: die große Kelter
  rationale: Die ungewöhnliche griechische Nachstellung des Adjektivs bezieht sich auf ληνός. „Kelter“ ist die knappe, traditionsnahe und verständliche Bezeichnung für die Weinpresse.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: des Zornes Gottes
  rationale: 'θυμός bezeichnet hier Gottes heftigen Zorn. Der Genitiv bleibt bewusst bildhaft: Die Kelter steht für das Vollstrecken dieses Zorns.'
theological_decisions:
- issue: Bildhafte Darstellung des göttlichen Gerichts
  choice: Kelter des Zornes Gottes
  alternative: Kelter, in der Gott seinen Zorn vollstreckt
  rationale: Die genitivische Metapher des griechischen Textes wird nicht erklärend aufgelöst; dadurch bleiben ihre Wucht und theologische Spannung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Abfolge der drei Handlungen bleibt eng am griechischen Satzbau; zugleich wird die Weinlese idiomatisch verständlich ausgedrückt.
