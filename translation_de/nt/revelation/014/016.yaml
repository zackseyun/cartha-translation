reference: Revelation 14:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: de
  text: Und der, der auf der Wolke sitzt, warf seine Sichel auf die Erde[a], und die Erde wurde abgeerntet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ließ seine Sichel über die Erde fahren“. Das griechische Verb bedeutet gewöhnlich „werfen“ oder „schleudern“; im Erntebild bezeichnet es das Einsetzen der Sichel zur Ernte.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „und die Erde wurde geerntet“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: ließ … fahren
  rationale: βάλλω bedeutet grundsätzlich „werfen, schleudern“; zusammen mit „Sichel“ bezeichnet es hier bildhaft das In-Gang-Setzen der Sichel zur Ernte. „ließ seine Sichel … fahren“ bewahrt die kraftvolle Bewegung und klingt im Deutschen natürlicher als ein wörtliches „warf seine Sichel“.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: der, der auf der Wolke saß
  rationale: Die substantivierte Partizipialkonstruktion wird beschreibend wiedergegeben. So wird die Gestalt nicht über den Wortlaut dieses Verses hinaus ausdrücklich identifiziert.
- source_word: νεφέλης
  choice: Wolke
  rationale: Der Artikel und der Rückbezug auf die zuvor genannte Wolke sprechen für die bestimmte Form „der Wolke“.
- source_word: δρέπανον
  choice: Sichel
  rationale: „Sichel“ ist die geläufige deutsche Bezeichnung des Erntegeräts und erhält das Ernte- und Gerichtsbild.
- source_word: ἐπὶ τὴν γῆν
  choice: über die Erde
  rationale: ἐπί mit Akkusativ bezeichnet hier die auf die Erde gerichtete Bewegung der Sichel. Im Deutschen gibt „über die Erde fahren“ den Erntevorgang anschaulich wieder; die wörtlichere Richtungsangabe bleibt in der Fußnote sichtbar.
- source_word: ἐθερίσθη
  choice: wurde abgeerntet
  rationale: Der Aorist Passiv von θερίζω bezeichnet das Geerntetwerden. „Abgeerntet“ ist idiomatisch und lässt die Erde selbst als Gegenstand der umfassenden Ernte erscheinen.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: Im kosmisch-apokalyptischen Zusammenhang ist „Erde“ näherliegend als das örtlich begrenzte „Land“. Die Wiederholung wird beibehalten.
theological_decisions:
- issue: Identität des auf der Wolke Sitzenden
  choice: Die Gestalt wird im Haupttext lediglich beschreibend als „der, der auf der Wolke saß“ bezeichnet.
  alternative: Aus dem vorausgehenden Zusammenhang könnte sie ausdrücklich als der Menschensohn beziehungsweise Messias identifiziert werden; vereinzelt wird auch an einen engelhaften Beauftragten gedacht.
  rationale: Der griechische Wortlaut dieses Verses nennt keinen Titel, sondern beschreibt nur die auf der Wolke sitzende Gestalt. Die Übersetzung vermeidet daher eine über den Vers hinausgehende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Erde“ und das Passiv des griechischen Textes bleiben erhalten. Die Formulierung wahrt das konkrete Erntebild, ohne die Gestalt auf der Wolke im Haupttext ausdrücklich zu deuten.
