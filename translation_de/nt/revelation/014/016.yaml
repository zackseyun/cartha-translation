  source_fidelity: Der Entwurf gibt die Wiederholung von γῆ, die passive Form ἐθερίσθη und die nicht näher bestimmte Gestalt auf der Wolke grundsätzlich angemessen wieder. „saß“ schwächt jedoch das präsentische καθήμενος ab. „ließ seine Sichel über die Erde fahren“ ist eine plausible Auslegung des Erntebildes, entfernt sich aber stärker als nötig von ἔβαλεν ... ἐπὶ τὴν γῆν („warf ... auf die Erde“).
  naturalness: „ließ seine Sichel über die Erde fahren“ ist verständlich, wirkt in modernem Standarddeutsch jedoch leicht gehoben bzw. idiomatisch veraltet. Die wörtlichere Formulierung ist im bildhaften, apokalyptischen Register klar und vertretbar.
  terminology: „Wolke“, „Sichel“, „Erde“ und „abgeerntet“ sind passend. „Abgeerntet“ bewahrt sinnvoll, dass die Erde selbst metaphorisch als Gegenstand des Erntens erscheint. Die Identität des Sitzenden wird zu Recht nicht im Haupttext festgelegt.
