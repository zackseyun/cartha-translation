id: REV.14.10
reference: Revelation 14:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: de
  text: Auch er wird vom Wein des Grimmes Gottes trinken, der unverdünnt im Becher seines Zorns bereitet ist[a], und er wird mit Feuer und Schwefel gequält werden vor den heiligen Engeln und vor dem Lamm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlicher verbindet das Griechische die Gedanken „gemischt/bereitet“ und „ungemischt/unverdünnt“. Gemeint ist Wein in ungemilderter Stärke.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: Auch der
  rationale: Die vorangestellte Formulierung bewahrt sowohl die hinzufügende Kraft von καί als auch die Hervorhebung der zuvor beschriebenen Person durch αὐτός.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: wird vom Wein … trinken
  rationale: Das Futur wird direkt wiedergegeben; „vom Wein trinken“ ist im Deutschen idiomatisch und lässt das mit ἐκ bezeichnete Trinken aus einer Quelle erkennen.
- source_word: θυμοῦ
  choice: Grimm
  rationale: „Grimm“ bezeichnet hier den heftigen göttlichen Zorn und ermöglicht zugleich, θυμός von ὀργή im selben Satz sprachlich zu unterscheiden.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: der unverdünnt … bereitet ist
  rationale: Die Wiedergabe erfasst sowohl die Zubereitung des Weins als auch ἄκρατος, also seine unverdünnte, ungemilderte Stärke, ohne im deutschen Haupttext die scheinbar widersprüchliche Wendung „ungemischt gemischt“ zu verwenden.
- source_word: ἐν τῷ ποτηρίῳ
  choice: im Becher
  rationale: ἐν wird seinem gewöhnlichen lokalen Sinn entsprechend mit „im“ wiedergegeben; der Wein ist im Becher bereitet.
- source_word: τῆς ὀργῆς αὐτοῦ
  choice: seines Zorns
  rationale: „Zorn“ ist eine natürliche, gewichtige Wiedergabe von ὀργή und hält die Genitivbeziehung zu Gott fest.
- source_word: βασανισθήσεται
  choice: wird … gequält werden
  rationale: Das Futur Passiv bezeichnet schweres, auferlegtes Leiden; „gequält werden“ ist klar und entspricht dem gerichtlichen Zusammenhang.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: mit Feuer und Schwefel
  rationale: „Schwefel“ ist die heutige Bezeichnung für θεῖον; „mit“ gibt das Mittel beziehungsweise den Bereich der Qual in natürlichem Deutsch wieder.
- source_word: ἐνώπιον ἀγγέλων ἁγίων … καὶ ἐνώπιον τοῦ ἀρνίου
  choice: vor den heiligen Engeln und vor dem Lamm
  rationale: Die Wiederholung von ἐνώπιον wird beibehalten und die Szene als Geschehen in ihrer Gegenwart beziehungsweise vor ihren Augen dargestellt.
theological_decisions:
- issue: Unterscheidung von θυμός und ὀργή
  choice: θυμός mit „Grimm“ und ὀργή mit „Zorn“ wiedergeben
  alternative: Beide Begriffe mit „Zorn“ wiedergeben oder θυμός als „Zorn“ und ὀργή als „Empörung“ übersetzen
  rationale: Der griechische Text stellt zwei verwandte Ausdrücke dicht nebeneinander. Die unterschiedliche Wiedergabe bewahrt diese rhetorische und begriffliche Spannung, ohne daraus eine starre dogmatische Unterscheidung abzuleiten.
- issue: Spannung in κεκερασμένου ἀκράτου
  choice: Im Haupttext „unverdünnt … bereitet“, mit wörtlicher Erläuterung in der Fußnote
  alternative: „ungemischt gemischt“ oder „unverdünnt gemischt“
  rationale: Die griechische Formulierung verbindet das Bereiten beziehungsweise Mischen des Weins mit seiner Unverdünntheit und betont so die ungemilderte Stärke des Gerichts. Die Übersetzung erhält beide Aspekte, ohne die schwer verständliche Oberflächenform zu erzwingen.
- issue: Öffentlicher Schauplatz der Qual
  choice: „vor den heiligen Engeln und vor dem Lamm“ ohne weitere Deutung
  alternative: „unter der Aufsicht“ oder „im Auftrag“ der Engel und des Lammes
  rationale: ἐνώπιον bezeichnet Gegenwart beziehungsweise Sichtbarkeit, legt aber nicht ausdrücklich eine bestimmte Rolle der Engel oder des Lammes fest. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erkennbarer apokalyptischer Bildsprache. „Grimm“ ist bewusst etwas gehoben, aber weiterhin verständlich; es bewahrt die Unterscheidung der beiden griechischen Zorneswörter. Die Satzstruktur folgt dem griechischen Gedankengang, bleibt jedoch flüssig lesbar.
