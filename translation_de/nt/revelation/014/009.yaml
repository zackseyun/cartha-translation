  to: 'Und ein weiterer Engel, der dritte, folgte ihnen und sprach mit lauter Stimme: »Wenn jemand das Tier und sein Bild anbetet[a] und ein Malzeichen auf seiner Stirn oder auf seiner Hand empfängt[b],'
  rationale: Die Revision schärft die Wiedergabe von χάραγμα zu »Malzeichen« und gibt λαμβάνει mit »empfängt« ohne zusätzliche Aussage über den Grad der Freiwilligkeit wieder. Die Apposition und die Einleitung der Rede werden idiomatischer gestaltet, ohne die griechische Reihenfolge oder den öffentlichen Nachdruck der Verkündigung einzubüßen. Die Fußnoten bleiben an den einschlägigen Wörtern verankert und erläutern die griechische Form präziser.
