id: REV.14.9
reference: Revelation 14:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: de
  text: 'Und ein weiterer Engel, der dritte, folgte ihnen und sprach mit lauter Stimme: »Wenn jemand das Tier und sein Bild anbetet[a] und ein Malzeichen auf seiner Stirn oder auf seiner Hand empfängt[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sich vor dem Tier und seinem Bild niederwirft«. Das griechische Verb kann das Niederwerfen bezeichnen; hier meint es verehrende Hingabe.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische maskuline Singularpronomen bezieht sich allgemein auf »jemand« und ist generisch zu verstehen.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: ein weiterer Engel, ein dritter
  rationale: Bewahrt sowohl ἄλλος als auch τρίτος und damit die fortlaufende Reihenfolge der Engelsverkündigungen.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: folgte ihnen
  rationale: Gibt die einfache erzählerische Abfolge des Aorists natürlich und quellennah wieder.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: rief mit lauter Stimme
  rationale: Das idiomatische deutsche »rief« bringt den öffentlichen, nachdrücklichen Charakter des lauten Sprechens zum Ausdruck.
- source_word: Εἴ τις
  choice: Wenn jemand
  rationale: Gibt die unbestimmte Bedingung allgemein und natürlich wieder.
- source_word: προσκυνεῖ
  choice: anbetet
  rationale: Im Kontext der Offenbarung bezeichnet das Verb gegenüber dem Tier kultische Verehrung und loyale Hingabe, nicht lediglich eine Körperhaltung.
- source_word: τὸ θηρίον
  choice: das Tier
  rationale: Etablierte deutsche Wiedergabe für die apokalyptische Gestalt.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: sein Bild
  rationale: Im Deutschen verweist das Possessivpronomen grammatisch auf das sächliche Substantiv »Tier«, ohne ein biologisches Geschlecht festzulegen.
- source_word: λαμβάνει χάραγμα
  choice: ein Zeichen annimmt
  rationale: »Annimmt« lässt den Aspekt des Empfangens beziehungsweise Akzeptierens erkennen; »Zeichen« ist im Kontext die natürliche Wiedergabe des kennzeichnenden χάραγμα.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: auf seiner Stirn oder auf seiner Hand
  rationale: Bewahrt die örtliche Angabe sowie den singularischen Rückbezug auf τις.
theological_decisions:
- issue: Religiöse Bedeutung von προσκυνέω gegenüber dem Tier
  choice: anbetet
  alternative: sich vor dem Tier und seinem Bild niederwirft
  rationale: Der Zusammenhang handelt von götzendienerischer Verehrung und Zugehörigkeit. »Anbetet« wahrt diese theologische Tragweite, während die Fußnote die körperliche Grundbedeutung sichtbar hält.
- issue: Singularischer Rückbezug von αὐτοῦ auf τις
  choice: auf seiner Stirn oder auf seiner Hand
  alternative: auf der Stirn oder auf der Hand
  rationale: Die Formulierung erhält den zweimaligen singularischen Possessivbezug des griechischen Textes. Im Deutschen ist »jemand … seiner« generisch verständlich, kann jedoch stilistisch auffallen; dies wird in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die appositionelle Reihung »ein weiterer Engel, ein dritter« bildet die auffällige griechische Wortfolge ab. »Rief mit lauter Stimme« ist natürlicher als das formalere »sagte mit lauter Stimme«. Der Vers endet bewusst mit einem Komma, da der Bedingungssatz in Vers 10 fortgesetzt wird.
