  source_fidelity: Der Entwurf gibt die Abfolge des dritten Engels, die universale Bedingung, die Anbetung des Tieres und seines Bildes sowie den Empfang des Zeichens zutreffend wieder. »Zeichen« ist für χάραγμα jedoch zu allgemein; der Kontext verlangt ein kennzeichnendes Mal. »Annimmt« legt zudem stärker ein willentliches Akzeptieren nahe als λαμβάνει.
  naturalness: »Ein weiterer Engel, ein dritter« ist verständlich, aber als Apposition weniger idiomatisch als »ein weiterer Engel, der dritte«. »Sprach mit lauter Stimme« bewahrt die Verbindung zu λέγων und bleibt in diesem feierlich-apokalyptischen Register natürlich.
  terminology: »Malzeichen« ist im deutschen Offenbarungswortschatz eine klare, zugleich quellennahe Wiedergabe von χάραγμα. Es bezeichnet ein identifizierendes Zeichen und vermeidet die mögliche Unschärfe von »Zeichen«. »Anbetet«, »Tier« und »Bild« sind angemessen. Die Fußnote zum generischen Singular sollte ausdrücklich den griechischen Befund benennen, statt eine nur scheinbare wörtliche Abweichung zu markieren.
