id: REV.14.11
reference: Revelation 14:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: de
  text: 'Und der Rauch ihrer Qual steigt auf für immer und ewig[a], und sie haben Tag und Nacht keine Ruhe: die das Tier und sein Bild anbeten, und wenn jemand das Malzeichen seines Namens annimmt[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in die Zeitalter der Zeitalter“.'
    reason: lexical_alternative
  - marker: b
    text: Das Griechische endet unvermittelt mit „und wenn jemand das Malzeichen seines Namens annimmt“. Gemeint ist wahrscheinlich eine weitere Beschreibung der Menschen unter dem Gericht; manche Übersetzungen glätten den Satz zu „und wer … annimmt“.
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: Rauch
  rationale: Die direkte, natürliche Entsprechung bewahrt das konkrete apokalyptische Bild.
- source_word: βασανισμοῦ
  choice: Qual
  rationale: „Qual“ bezeichnet schmerzhaftes Leiden im Gerichtskontext, ohne eine bestimmte Methode wie „Folter“ vorauszusetzen.
- source_word: εἰς αἰῶνας αἰώνων
  choice: für immer und ewig
  rationale: Die im Deutschen geläufige Wendung gibt die starke, fortdauernde Zeitformel der Offenbarung idiomatisch wieder; die wörtlichere Form steht in der Fußnote.
- source_word: ἀναβαίνει
  choice: steigt auf
  rationale: Bewahrt das Präsens und die anschauliche Bewegung des Rauchs.
- source_word: ἀνάπαυσιν
  choice: Ruhe
  rationale: Direkte Entsprechung, die hier das Ausbleiben jeder Unterbrechung oder Erholung ausdrückt.
- source_word: ἡμέρας καὶ νυκτός
  choice: Tag und Nacht
  rationale: Geläufige deutsche Zeitangabe für ununterbrochene Dauer.
- source_word: προσκυνοῦντες
  choice: anbeten
  rationale: Im Kontext der Offenbarung bezeichnet das Verb kultische Verehrung und religiöse Loyalität.
- source_word: θηρίον
  choice: Tier
  rationale: Etablierte und genaue deutsche Wiedergabe der apokalyptischen Gestalt in der Offenbarung.
- source_word: εἰκόνα
  choice: Bild
  rationale: Breite, kontextgerechte Entsprechung, die nicht vorschnell auf „Statue“ eingeengt wird.
- source_word: εἴ τις λαμβάνει
  choice: wenn jemand … annimmt
  rationale: Folgt dem Wechsel des Griechischen von einem pluralischen Partizip zu einer unbestimmten singularischen Bedingungsform und bewahrt damit die auffällige Syntax.
- source_word: χάραγμα
  choice: Kennzeichen
  rationale: Gibt ein eingeprägtes oder angebrachtes Identifikationszeichen wieder und passt zum wiederkehrenden Sprachgebrauch der Offenbarung.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: seines Namens
  rationale: Bewahrt die Genitivverbindung des griechischen Ausdrucks, ohne sie interpretierend zu „mit seinem Namen“ umzudeuten.
theological_decisions:
- issue: Dauer des Gerichts in εἰς αἰῶνας αἰώνων
  choice: „für immer und ewig“ als stärkste idiomatische Dauerformel
  alternative: „in die Zeitalter der Zeitalter“
  rationale: Die Formel bezeichnet in der Offenbarung eine uneingeschränkte fortdauernde Dauer. Die Übersetzung gibt ihre gewöhnliche Kraft wieder, während die Fußnote die formale Struktur sichtbar hält, ohne eine weitergehende Lehrsystematik einzutragen.
- issue: Bezug und Syntax des letzten Satzglieds
  choice: Der abrupte Wechsel wird mit „und wenn jemand …“ bewahrt.
  alternative: Glättung zu „und alle, die … annehmen“ oder „und wer … annimmt“
  rationale: Das Griechische wechselt von der pluralischen Beschreibung „die … anbeten“ zur singularischen unbestimmten Bedingungsform. Die Übersetzung lässt diese Spannung stehen; eine Fußnote erklärt die syntaktische Härte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit engem Anschluss an die Bildsprache und Syntax des griechischen Textes. Der Gedankenstrich macht die nachgestellte Beschreibung lesbar, ohne den abrupten Wechsel im letzten Satzglied zu beseitigen. Sämtliche Fußnotenmarker stehen im Haupttext.
