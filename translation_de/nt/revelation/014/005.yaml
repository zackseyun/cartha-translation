  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: de
  text: Und in ihrem Mund wurde keine Lüge gefunden; sie sind untadelig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne Makel“ oder „ohne Fehl“; der griechische Ausdruck kann sowohl an die Reinheit eines Opfers als auch an moralische Untadeligkeit denken lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: in ihrem Mund
  rationale: Die kollektive Singularform στόματι wird bewahrt. Die deutsche Wendung ist verständlich und bezeichnet den Inhalt ihrer Rede; „auf ihren Lippen“ wäre flüssiger, aber stärker deutend.
- source_word: οὐχ εὑρέθη
  choice: wurde keine … gefunden
  rationale: Die Aorist-Passivform wird als deutsches Passiv wiedergegeben und erhält den Akzent darauf, dass bei ihnen keine Unwahrheit festgestellt wurde.
- source_word: ψεῦδος
  choice: Lüge
  rationale: „Lüge“ ist die unmittelbarste und natürlichste Entsprechung; „Falschheit“ wäre breiter, „Täuschung“ würde Absicht oder Charakter stärker hervorheben.
- source_word: ἄμωμοί
  choice: untadelig
  rationale: „Untadelig“ gibt den ethischen Sinn in natürlichem, würdigem Deutsch wieder, ohne ausdrücklich absolute Sündlosigkeit zu behaupten. Die mögliche kultisch-opferbezogene Bildsprache wird in der Fußnote erhalten.
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion bleibt erhalten und kennzeichnet den Satz als Fortsetzung der vorherigen Beschreibung.
theological_decisions:
- issue: ἄμωμοί so wiedergeben, dass Heiligkeits- und Reinheitssprache erhalten bleibt, ohne Sündlosigkeit zu überzeichnen
  choice: untadelig
  alternative: ohne Makel; ohne Fehl
  rationale: Der Ausdruck kann sowohl moralische Integrität als auch die Makellosigkeit eines Opfers bezeichnen. „Untadelig“ wahrt den ethischen Sinn; die kultische Nuance wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die ungewöhnliche kollektive Form „in ihrem Mund“ folgt bewusst eng dem griechischen Singular; die Interpunktion bewahrt den engen Zusammenhang beider Aussagen.
