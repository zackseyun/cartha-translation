  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: de
  text: 'Und ein anderer, ein zweiter Engel, folgte und sagte: »Gefallen, gefallen ist Babylon, die Große, die alle Völker vom Wein der Leidenschaft ihrer sexuellen Unmoral[a] hat trinken lassen[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild der „sexuellen Unmoral“ steht wahrscheinlich für Babylons verderblichen, götzendienerischen und treulosen Einfluss; der Text legt es jedoch nicht auf nur eine dieser Bedeutungen fest. Für „Leidenschaft“ kann das griechische θυμός je nach Zusammenhang auch „Zorn“, „Wut“ oder heftige „Glut“ bedeuten.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'Auch möglich: „Sie hat alle Völker mit dem Wein … berauscht.“ Wörtlich heißt es: „Sie hat alle Völker … trinken lassen.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: ein anderer, ein zweiter Engel
  rationale: Beide griechischen Bestimmungen werden bewahrt; die appositionelle Form ist im Deutschen verständlich und gibt die ausdrückliche Zählung wieder.
- source_word: ἠκολούθησεν λέγων
  choice: folgte und sagte
  rationale: Das Partizip λέγων wird idiomatisch als beigeordnete Verbform wiedergegeben; „folgte“ wahrt die Abfolge innerhalb der Vision.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Gefallen, gefallen ist
  rationale: Die Wiederholung und der feierlich-prophetische Ton des Aorists bleiben erhalten; die deutsche Perfektform bezeichnet den verkündeten, eingetretenen Sturz natürlich.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylon, die Große
  rationale: Die nachgestellte Bezeichnung und die feminine Personifikation der Stadt werden sichtbar bewahrt.
- source_word: ἐκ τοῦ οἴνου
  choice: vom Wein
  rationale: „Vom“ gibt ἐκ als Trinken aus einer Quelle beziehungsweise von einem angebotenen Wein knapp und idiomatisch wieder.
- source_word: τοῦ θυμοῦ
  choice: der Glut
  rationale: θυμός kann Zorn, Wut oder heftige Leidenschaft bezeichnen. „Glut“ bewahrt im Zusammenhang mit πορνεία besonders die Vorstellung intensiver Leidenschaft, ohne die möglichen zerstörerischen und gerichtlichen Untertöne ganz auszuschließen.
- source_word: τῆς πορνείας αὐτῆς
  choice: ihrer sexuellen Unmoral
  rationale: Die Formulierung ist modern und verständlich, bleibt aber breit genug für die wörtliche wie auch die symbolische Bedeutung von πορνεία.
- source_word: πεπότικεν
  choice: hat … trinken lassen
  rationale: Die kausative Bedeutung von ποτίζω und die resultative Wirkung des Perfekts werden bewahrt.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Im Kontext der Offenbarung bezeichnet ἔθνη umfassend die Völker und nicht lediglich Nichtjuden im Gegensatz zu Juden.
theological_decisions:
- issue: Bildhafte Bedeutung von Babylons πορνεία
  choice: sexuelle Unmoral
  alternative: Götzendienst; Untreue; Hurerei
  rationale: Der Haupttext bewahrt das sexuelle Bild, ohne es auf religiöse, politische oder bundestheologische Untreue festzulegen.
- issue: Bedeutung von θυμός in der Verbindung mit πορνεία
  choice: Glut
  alternative: Zorn; Wut; Leidenschaft
  rationale: Die Wahl erhält die Spannung zwischen leidenschaftlicher Ausschweifung und zerstörerischer Wut; die mögliche Lesart „Zorn“ wird in der Fußnote ausdrücklich genannt.
- issue: Personifikation Babylons
  choice: Babylon, die Große; Sie
  alternative: das große Babylon; es
  rationale: Das feminine Relativpronomen ἣ und die Darstellung Babylons als Frau beziehungsweise Stadt werden im Deutschen ausdrücklich sichtbar gemacht.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit feierlichem Verkündigungston. Die Wiederholung „Gefallen, gefallen“ bleibt wegen ihrer rhetorischen und alttestamentlich-prophetischen Prägung erhalten. „Sexuelle Unmoral“ vermeidet sowohl das veraltete „Unzucht“ als auch das zu enge „Prostitution“.
