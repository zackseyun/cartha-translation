id: REV.14.6
reference: Revelation 14:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: de
  text: Und ich sah einen anderen Engel, der mitten am Himmel flog und ein ewiges Evangelium hatte, um es denen zu verkünden, die auf der Erde wohnen[b], und jeder Nation, jedem Stamm, jeder Sprache und jedem Volk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Wörtlich „die auf der Erde Sitzenden“; in der Offenbarung bezeichnet diese Wendung idiomatisch die Bewohner der Erde.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: einen anderen Engel
  rationale: „Ein anderer Engel“ gibt die gewöhnliche Bedeutung von ἄλλος wieder und bewahrt die erzählerische Abfolge; im apokalyptischen Zusammenhang bezeichnet ἄγγελος ein himmlisches Wesen.
- source_word: πετόμενον ἐν μεσουρανήματι
  choice: mitten am Himmel fliegen
  rationale: Das Präsenspartizip beschreibt den Engel im Flug. „Mitten am Himmel“ ist im Deutschen natürlich, bewahrt aber zugleich den besonderen apokalyptischen Bildausdruck μεσουράνημα.
- source_word: ἔχοντα εὐαγγέλιον αἰώνιον
  choice: Er hatte ein ewiges Evangelium
  rationale: ἔχοντα bezeichnet den Besitz bzw. das Mitführen der Botschaft. Der unbestimmte Ausdruck wird als „ein ewiges Evangelium“ wiedergegeben; „Evangelium“ erhält den biblisch-theologischen Klang von εὐαγγέλιον, ohne zusätzliche Lehraussagen einzutragen.
- source_word: εὐαγγελίσαι
  choice: um es … zu verkünden
  rationale: Der Infinitiv bezeichnet hier den Zweck. Das Pronomen „es“ stellt im Deutschen den Bezug auf das Evangelium klar und vermeidet eine unbeholfene Wiederholung.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: denen, die auf der Erde wohnen
  rationale: καθημένους bedeutet wörtlich „die Sitzenden“, bezeichnet in dieser wiederkehrenden Wendung der Offenbarung aber idiomatisch die Bewohner der Erde. „Wohnen“ gibt diesen Sinn verständlich wieder, ohne daraus eine bloß neutrale Sammelbezeichnung zu machen.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: jeder Nation, jedem Stamm, jeder Sprache und jedem Volk
  rationale: Die viergliedrige Reihe wird vollständig und rhythmisch erhalten. Die Dativformen hängen wie die vorherige Empfängerangabe von „verkünden“ ab.
theological_decisions:
- issue: Traditionelle oder allgemeinsprachliche Wiedergabe von εὐαγγέλιον αἰώνιον
  choice: ein ewiges Evangelium
  alternative: eine ewige gute Nachricht
  rationale: „Evangelium“ bewahrt die kanonische und theologische Resonanz des griechischen Wortes, ohne dessen Inhalt in diesem Vers näher festzulegen. Der fehlende Artikel wird nicht stillschweigend durch eine bestimmte Form ergänzt.
- issue: Deutung der Wendung τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: denen, die auf der Erde wohnen
  alternative: denen, die auf der Erde sitzen
  rationale: Die gewählte Form gibt den in der Offenbarung wiederkehrenden idiomatischen Ausdruck verständlich wieder. Die Alternative wäre formal näher an der Körperhaltung, könnte im Deutschen jedoch irreführend wirken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste griechische Satz wird zur besseren Lesbarkeit in zwei deutsche Sätze gegliedert; die Partizipialbezüge und die Empfängerreihe bleiben sachlich erhalten. Die Aufzählung folgt der kumulativen Viererformel des Ausgangstextes.
