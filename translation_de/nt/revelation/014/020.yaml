reference: Revelation 14:20
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: de
  text: Und die Kelter wurde außerhalb der Stadt getreten, und Blut kam aus der Kelter bis an die Zäume der Pferde, über eine Strecke von tausendsechshundert Stadien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Stadion war ein antikes Längenmaß. Tausendsechshundert Stadien entsprechen ungefähr 296 Kilometern.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπατήθη
  choice: wurde … getreten
  rationale: Das Passiv von πατέω bezeichnet hier das Treten der Kelter. Die Formulierung wahrt das konkrete Bild und klingt im Deutschen verständlich.
- source_word: ληνός / ληνοῦ
  choice: Kelter
  rationale: „Kelter“ ist die etablierte deutsche Bezeichnung für eine Vorrichtung zum Auspressen von Trauben und bewahrt das Bild von Ernte und Gericht.
- source_word: ἔξωθεν τῆς πόλεως
  choice: außerhalb der Stadt
  rationale: Die Wendung gibt die räumliche Aussage direkt und idiomatisch wieder.
- source_word: ἐξῆλθεν αἷμα
  choice: Blut kam aus der Kelter
  rationale: ἐξέρχομαι bedeutet wörtlich „herauskommen“. Die Übersetzung bleibt näher am griechischen Wortlaut als das kontextuell mögliche „Blut floss“.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: bis an die Zügel der Pferde
  rationale: ἄχρι bezeichnet die erreichte Ausdehnung oder Höhe. „Bis an die Zügel“ erhält das eindringliche Bild, ohne es erklärend aufzulösen.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: über eine Strecke von tausendsechshundert Stadien
  rationale: Das ungewöhnliche ἀπό bezeichnet hier die räumliche Erstreckung. Die ausdrückliche Ergänzung „über eine Strecke“ ergibt natürliches Deutsch, während die antike Maßeinheit im Text erhalten bleibt.
theological_decisions:
- issue: Ob die drastische apokalyptische Darstellung erklärend abgeschwächt werden soll
  choice: Die konkreten Bilder von Blut, Pferdezügeln und der weiten Strecke bleiben unverändert erhalten.
  alternative: Die Aussage als Sinnbild eines überwältigenden Gerichts paraphrasieren.
  rationale: Der griechische Text formuliert bewusst anschaulich und drastisch. Eine erklärende Paraphrase würde die symbolische Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Kelter“ ist ein geläufiger biblisch-literarischer Sachbegriff; die Satzstruktur bleibt eng am griechischen Text, ohne unnatürlich zu wirken.
