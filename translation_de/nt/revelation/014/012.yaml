id: REV.14.12
reference: Revelation 14:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: de
  text: Hier ist die standhafte Ausdauer der Heiligen, die die Gebote Gottes und den Glauben Jesu[a] halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Glauben an Jesus“; alternativ: „die Treue Jesu“. Die griechische Wendung ist mehrdeutig.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: Hier zeigt sich
  rationale: Das deiktische ὧδε verweist auf die eben geschilderte Lage. „Hier zeigt sich“ gibt die rhetorische Funktion im heutigen Deutsch natürlich wieder, ohne eine zusätzliche Ursache zu behaupten.
- source_word: ὑπομονὴ
  choice: standhafte Ausdauer
  rationale: Ὑπομονή bezeichnet beharrliches Ausharren unter Bedrängnis. „Standhafte Ausdauer“ ist verständlich und bewahrt sowohl Dauer als auch Festigkeit.
- source_word: ἁγίων
  choice: Heiligen
  rationale: „Die Heiligen“ ist die geläufige neutestamentliche Bezeichnung für Gottes geheiligtes Volk und im Deutschen idiomatisch.
- source_word: τηροῦντες
  choice: halten
  rationale: Im Zusammenhang mit Geboten bedeutet τηρέω, sie treu zu beachten und zu befolgen. „Halten“ ist die etablierte und natürliche deutsche Wiedergabe.
- source_word: ἐντολὰς
  choice: Gebote
  rationale: „Gebote“ gibt die verbindlichen Weisungen Gottes prägnant wieder und bewahrt den biblischen Sprachklang.
- source_word: πίστιν
  choice: Glauben
  rationale: „Glauben“ wahrt die lexikalische Offenheit von πίστις; die mögliche Bedeutung „Treue“ wird in der Fußnote genannt.
- source_word: Ἰησοῦ
  choice: Jesu
  rationale: Der Genitiv wird formal als „Jesu“ wiedergegeben. Dadurch bleibt offen, ob Glaube an Jesus oder Jesu eigener Glaube beziehungsweise seine Treue gemeint ist.
theological_decisions:
- issue: Bedeutung von τὴν πίστιν Ἰησοῦ
  choice: den Glauben Jesu
  alternative: den Glauben an Jesus; die Treue Jesu
  rationale: Die Genitivverbindung ist tatsächlich mehrdeutig. Die nahe Wiedergabe „Glauben Jesu“ löst weder den objektiven Genitiv („Glaube an Jesus“) noch den subjektiven Genitiv („Jesu Glaube/Treue“) stillschweigend auf; die verständlicheren Deutungen stehen in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht die nachgestellte partizipiale Gruppe als nähere Bestimmung der Heiligen verständlich; die theologisch bedeutsame Mehrdeutigkeit der Genitivverbindung bleibt erhalten.
