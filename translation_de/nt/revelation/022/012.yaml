id: REV.22.12
reference: Revelation 22:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: de
  text: Siehe, ich komme bald[a], und mein Lohn ist bei mir, um jedem entsprechend seinem Werk zu vergelten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ich komme schnell«. Das griechische Wort ταχύ kann sowohl zeitliche Nähe („bald“) als auch Schnelligkeit oder Plötzlichkeit („schnell“) betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen prophetisch-apokalyptischen Aufmerksamkeitsruf. „Seht“ oder „Schau“ wären möglich, träfen den würdevollen Ton hier aber weniger genau.
- source_word: ἔρχομαι
  choice: ich komme
  rationale: Das griechische Präsens bezeichnet im Zusammenhang das unmittelbar erwartete Kommen; das deutsche Präsens ist dafür natürlich und formnah.
- source_word: ταχύ
  choice: bald
  rationale: Gibt in diesem endzeitlichen Zusammenhang die zeitliche Nähe natürlich wieder. Da das Adverb auch Schnelligkeit oder Plötzlichkeit betonen kann, wird „schnell“ in einer Fußnote genannt.
- source_word: ὁ μισθός μου
  choice: mein Lohn
  rationale: „Lohn“ kann wie μισθός Bezahlung, Belohnung oder angemessene Vergeltung bezeichnen und lässt die genaue Art der Zuwendung offen.
- source_word: μετ’ ἐμοῦ
  choice: ist bei mir
  rationale: Ergänzt die im griechischen Nominalsatz vorausgesetzte Kopula und gibt die Wendung klar und knapp wieder.
- source_word: ἀποδοῦναι
  choice: um … zu vergelten
  rationale: Der Infinitiv bezeichnet Zweck oder Folge und trägt den Gedanken des entsprechenden Zurückgebens beziehungsweise Vergeltens.
- source_word: ἑκάστῳ
  choice: jedem
  rationale: Bewahrt den distributiven Singular und hebt die persönliche Verantwortlichkeit hervor.
- source_word: ὡς
  choice: so … wie
  rationale: Gibt den Vergleich beziehungsweise Maßstab der Vergeltung wieder und ermöglicht zugleich, den folgenden Nominalsatz ausdrücklich zu erhalten.
- source_word: τὸ ἔργον ἐστὶν αὐτοῦ
  choice: wie sein Werk ist
  rationale: Bewahrt sowohl das ausdrückliche Substantiv „Werk“ als auch das Verb „ist“, statt die Aussage glättend in „was er getan hat“ umzuwandeln.
theological_decisions:
- issue: Generischer maskuliner Singular in ἑκάστῳ … αὐτοῦ
  choice: jedem … sein Werk
  alternative: jedem Menschen … dessen Werk / allen … ihre Werke
  rationale: Die Form des griechischen distributiven maskulinen Singulars bleibt im Deutschen erkennbar, ohne den Bezug auf Männer zu beschränken.
- issue: Art der Vergeltung nach dem Werk
  choice: mein Lohn … jedem so zu vergelten, wie sein Werk ist
  alternative: meine Belohnung … jedem nach seinen Taten zu geben
  rationale: Die Formulierung wahrt die Aussage individueller Vergeltung nach dem Werk, ohne daraus eine weitergehende Lehrentscheidung über die Grundlage des endgültigen Heils abzuleiten. Zugleich bleibt offen, ob „Lohn“ im Einzelfall Belohnung oder richterliche Vergeltung bedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem prophetischem „Siehe“. Die Satzgestalt bleibt nahe am Griechischen, ohne unverständlich zu werden; insbesondere wird die ungewöhnliche, aber aussagekräftige Wendung „wie sein Werk ist“ nicht zu „was er getan hat“ geglättet.
