review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die griechischen Satzglieder und die eschatologische Ankündigung insgesamt zuverlässig wieder. „Siehe“, „ich komme bald“, „mein Lohn ist bei mir“ und der individuelle Maßstab des Werkes entsprechen dem Ausgangstext. Die Verbindung „jedem so zu vergelten, wie sein Werk ist“ bildet ὡς ... ἐστὶν zwar sehr eng ab, ist im Deutschen jedoch nicht idiomatisch genug und lässt die Rektion von „vergelten“ unvollständig erscheinen.
  naturalness: „Siehe“ ist im würdig-prophetischen Register der Offenbarung weiterhin verständlich. Die Revision mit „jedem entsprechend seinem Werk zu vergelten“ ist modernes, klares Standarddeutsch und wahrt den Sinn der griechischen Vergleichsformulierung, ohne eine künstliche Satzstruktur nachzubilden.
  terminology: „Lohn“ ist für μισθός angemessen und lässt den Kontext von Belohnung bzw. Vergeltung offen. „Vergeben“ wäre hier unzutreffend; „vergelten“ gibt ἀποδοῦναι in diesem Gerichtszusammenhang passend wieder. Der generische Singular „jedem ... seinem Werk“ ist im Deutschen sachgerecht und nicht auf Männer beschränkt.
  issues:
  - severity: medium
    issue: Unidiomatische und syntaktisch unvollständige Verbindung „jedem so zu vergelten, wie sein Werk ist“
    rationale: „Vergelten“ wird hier natürlich mit einer Angabe des Maßstabs verbunden, etwa „jemandem entsprechend/nach seinem Werk vergelten“. Die Formulierung „so ... wie sein Werk ist“ ist zwar nachvollziehbar, klingt aber im modernen Standarddeutsch holprig und kann den Satzbau verdunkeln.
