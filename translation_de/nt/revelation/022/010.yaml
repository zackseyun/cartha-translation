  source_fidelity: 'Die Übersetzung gibt den griechischen Satz vollständig und präzise wieder: Das erzählerische Präsens („er sagt zu mir“), das Verbot „Versiegle … nicht“, die konkrete Mehrzahl „die Worte“, die Genitivverbindung „der Prophetie dieses Buches“ sowie die Begründung mit der nahen Zeit sind sachgerecht abgebildet. Die Daniel-Anspielung wird nicht in den Haupttext eingetragen, sondern angemessen in der Anmerkung erläutert.'
  naturalness: „Und er sagt zu mir“ ist als bewusst beibehaltenes erzählerisches Präsens im biblisch-literarischen Register verständlich. „Versiegle die Worte der Prophetie dieses Buches nicht“ ist idiomatisches, würdiges modernes Standarddeutsch und bewahrt die Bildsprache.
  terminology: „Prophetie“, „versiegeln“, „Buch“ und „Zeit“ sind treffende und registergerechte Entsprechungen. „Die Zeit ist nahe“ lässt die Bedeutung von καιρός offen, ohne die eschatologische Aussage abzuschwächen oder dogmatisch zu deuten.
