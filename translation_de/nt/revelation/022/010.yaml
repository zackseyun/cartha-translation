id: REV.22.10
reference: Revelation 22:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: de
  text: 'Und er sagt zu mir: »Versiegle die Worte der Prophetie dieses Buches nicht[a][b], denn die Zeit ist nahe[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verschließe die Worte … nicht« beziehungsweise »Halte die Worte … nicht geheim«. Gemeint ist, dass die Offenbarung nicht unzugänglich gemacht oder zurückgehalten werden soll.'
    reason: lexical_alternative
  - marker: b
    text: 'Vergleiche Daniel 12,4: Dort soll die Prophetie versiegelt werden; hier lautet der Auftrag umgekehrt.'
    reason: cross_reference
  - marker: c
    text: 'Oder: »denn die festgesetzte Zeit ist nahe«. Das griechische Wort kann eine entscheidende oder bestimmte Zeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: er sagt zu mir
  rationale: Der griechische Erzählgegenwart λέγει wird als Präsens wiedergegeben und bewahrt so die Lebendigkeit des Ausdrucks.
- source_word: Μὴ σφραγίσῃς
  choice: Versiegle … nicht
  rationale: σφραγίζω bezeichnet hier im prophetischen Zusammenhang das Verschließen und damit das Zurückhalten einer Offenbarung. Die konkrete Bildsprache bleibt erhalten.
- source_word: τοὺς λόγους
  choice: die Worte
  rationale: Die konkrete Pluralform λόγους wird direkt wiedergegeben, statt sie deutend zu »Botschaft« zusammenzufassen.
- source_word: τῆς προφητείας
  choice: der Prophetie
  rationale: »Prophetie« gibt προφητεία präzise wieder und bezeichnet hier den prophetischen Inhalt des Buches, nicht nur eine einzelne Vorhersage.
- source_word: τοῦ βιβλίου τούτου
  choice: dieses Buches
  rationale: βιβλίον kann Buch oder Schriftrolle bedeuten; »Buch« ist im heutigen Deutsch natürlich und wahrt die Genitivverbindung des griechischen Textes.
- source_word: ὁ καιρὸς
  choice: die Zeit
  rationale: καιρός kann eine entscheidende oder festgesetzte Zeit meinen. »Die Zeit« bleibt knapp und bewahrt diese kontextuelle Offenheit.
- source_word: ἐγγύς ἐστιν
  choice: ist nahe
  rationale: Die Formulierung gibt die Aussage der zeitlichen Nähe klar wieder, ohne sie abzuschwächen oder in einen Zeitplan umzudeuten.
theological_decisions:
- issue: Näheaussage im apokalyptischen Zusammenhang
  choice: denn die Zeit ist nahe
  alternative: denn die festgesetzte Zeit ist nahe
  rationale: Die Übersetzung lässt die behauptete Nähe in ihrer theologischen Spannung stehen. Sie legt weder einen detaillierten endzeitlichen Zeitplan fest noch schwächt sie die Aussage ab.
- issue: Gegensatz zum Versiegelungsauftrag in Daniel 12,4
  choice: Versiegle … nicht
  alternative: Halte … nicht geheim
  rationale: Die wörtliche Bildsprache macht den bewussten Gegensatz zu Daniel erkennbar, ohne die Bedeutung im Haupttext erklärend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Prophetie« erhält den sachlichen und literarischen Bezug des griechischen Ausdrucks; »Versiegle« bewahrt die für den Daniel-Bezug wichtige Bildsprache. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Wendungen.
