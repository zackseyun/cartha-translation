id: REV.22.15
reference: Revelation 22:15
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: de
  text: Draußen sind die Hunde[b], die Zauberer, diejenigen, die sexuell unmoralisch handeln, die Mörder, die Götzendiener und jeder, der die Lüge[a] liebt und tut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Falschheit«.'
    reason: lexical_alternative
  - marker: b
    text: »Hunde« ist hier wahrscheinlich bildlich als abwertende Bezeichnung für Ausgeschlossene und moralisch Unreine gebraucht; manche deuten den Ausdruck enger.
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: Draußen sind
  rationale: Die vorangestellte Ortsangabe betont den Ausschluss aus der zuvor beschriebenen Stadt; das im Griechischen vorausgesetzte Verb wird im Deutschen natürlich ergänzt.
- source_word: κύνες
  choice: die Hunde
  rationale: Die konkrete, wahrscheinlich metaphorische Bildsprache bleibt erhalten, ohne eine umstrittene spezifische Deutung in den Haupttext einzutragen.
- source_word: φάρμακοι
  choice: die Zauberer
  rationale: Im Kontext der Offenbarung bezeichnet das Wort Menschen, die Zauberei beziehungsweise magische Praktiken ausüben.
- source_word: πόρνοι
  choice: die sexuell Unmoralischen
  rationale: Die Formulierung gibt die breite Bedeutung unerlaubten sexuellen Verhaltens wieder, ohne sie auf eine einzelne Erscheinungsform zu verengen.
- source_word: φονεῖς
  choice: die Mörder
  rationale: Direkte und idiomatische Wiedergabe der Täterbezeichnung.
- source_word: εἰδωλολάτραι
  choice: die Götzendiener
  rationale: Knappe, geläufige Wiedergabe für Menschen, die Götzen verehren; sie bewahrt den Stil der Aufzählung.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: jeder, der die Lüge liebt und tut
  rationale: πᾶς mit den Partizipien wird natürlich als Relativsatz wiedergegeben. „Liebt und tut“ wahrt die auffällige Verbindung von innerer Zuneigung und tätiger Ausübung; ψεῦδος kann sowohl die Lüge als auch Falschheit bezeichnen.
theological_decisions:
- issue: Ob κύνες im Haupttext als bestimmte Personengruppe auszulegen ist
  choice: Das konkrete Bild „die Hunde“ bleibt stehen.
  alternative: die Unreinen; die Schamlosen; eine spezifische sexuell unmoralische Gruppe
  rationale: Der griechische Text nennt Hunde und lässt die genaue Reichweite des Bildes offen. Eine auslegende Ersetzung würde die apokalyptische Bildsprache verengen.
- issue: Ob ψεῦδος eng als „die Lüge“ oder umfassender als „Falschheit“ wiederzugeben ist
  choice: Im Haupttext steht „die Lüge“, mit „Falschheit“ als Fußnotenalternative.
  alternative: Falschheit
  rationale: Der artikellose griechische Singular erlaubt sowohl die konkrete beziehungsweise kollektiv verstandene „Lüge“ als auch den abstrakten Sinn „Falschheit“. Die Fußnote bewahrt diese echte Bedeutungsbreite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Bindewörter bewahren den eindringlichen Aufzählungsstil des Griechischen. „Sexuell Unmoralische“ ist verständlich und hinreichend weit; „die Lüge liebt und tut“ erhält bewusst die ungewohnte, aber prägnante Formulierung des Ausgangstextes.
