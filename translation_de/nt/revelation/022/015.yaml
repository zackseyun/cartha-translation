  terminology: „Hunde“, „Zauberer“, „Mörder“ und „Götzendiener“ sind angemessen. Die Fußnote zu „Hunde“ belässt die konkrete Metapher im Haupttext und vermeidet eine umstrittene Spezifizierung. „Die Lüge“ ist für ψεῦδος möglich; die Alternative „Falschheit“ sollte als Bedeutungsalternative erhalten bleiben.
