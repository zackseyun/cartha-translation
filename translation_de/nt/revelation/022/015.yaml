  source_fidelity: Die Reihenfolge und alle Personengruppen entsprechen dem griechischen Text. Die vorangestellte Ortsangabe gibt ἔξω treffend als Ausschluss wieder. Für πᾶς φιλῶν καὶ ποιῶν ψεῦδος ist „jeder, der die Lüge liebt und tut“ sehr nah am Wortlaut und bewahrt die absichtlich auffällige Verbindung von Zuneigung und Handlung.
