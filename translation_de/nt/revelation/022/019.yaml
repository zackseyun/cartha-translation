id: REV.22.19
reference: Revelation 22:19
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: de
  text: Und wenn jemand etwas von den Worten des Buches dieser Prophetie wegnimmt, wird Gott ihm seinen Anteil am Baum des Lebens[a] und an der heiligen Stadt wegnehmen, die in diesem Buch verzeichnet sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Handschriften lesen hier „Buch des Lebens“ statt „Baum des Lebens“.
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: wegnimmt / wegnehmen
  rationale: 'Die gleiche deutsche Verbwahl bewahrt die beabsichtigte Entsprechung: Wer etwas wegnimmt, dem wird Gott etwas wegnehmen.'
- source_word: λόγων
  choice: Worten
  rationale: Bezeichnet hier den Wortlaut beziehungsweise den sprachlichen Inhalt der Prophetie und passt zur Warnung vor einer Veränderung des Textes.
- source_word: βιβλίου
  choice: Buch
  rationale: „Buch“ ist im heutigen Deutsch verständlich und entspricht der etablierten Bezeichnung dieses prophetischen Werkes; „Schriftrolle“ wäre historisch möglich, hier aber unnötig konkretisierend.
- source_word: προφητείας
  choice: Prophetie
  rationale: Bewahrt die Gattungsbezeichnung und den feierlichen Charakter der Warnung, ohne sie zu „prophetische Botschaft“ zu erweitern.
- source_word: μέρος
  choice: Anteil
  rationale: Gibt den Gedanken der zugewiesenen Teilhabe natürlicher und genauer wieder als das allgemeinere „Teil“.
- source_word: ξύλου τῆς ζωῆς
  choice: Baum des Lebens
  rationale: Entspricht dem Kontext in Offenbarung 22,2.14 und der Bildsprache des Buches.
- source_word: πόλεως τῆς ἁγίας
  choice: heiligen Stadt
  rationale: Direkte und im Deutschen geläufige Wiedergabe der apokalyptischen Bezeichnung.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: von denen in diesem Buch geschrieben steht
  rationale: Die Formulierung bezieht den pluralischen Ausdruck transparent auf den Baum des Lebens und die heilige Stadt und bewahrt den resultativen Sinn des Perfektpartizips.
theological_decisions:
- issue: Textvariante „Baum des Lebens“ gegenüber „Buch des Lebens“
  choice: Baum des Lebens
  alternative: Buch des Lebens
  rationale: Der vorgegebene SBLGNT-Text liest ξύλου τῆς ζωῆς („Baum des Lebens“); diese Lesart ist in kritischen Ausgaben gut belegt und passt zum unmittelbaren Kontext. Die bekannte abweichende Lesart wird in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Im Buch dieser Prophetie“ folgt der griechischen Zuordnung enger und natürlicher als „vom Buch dieser Prophetie“. Der Zusatz „etwas“ macht im Deutschen deutlich, dass aus den Worten etwas entfernt wird, ohne den Sinn zu erweitern.
