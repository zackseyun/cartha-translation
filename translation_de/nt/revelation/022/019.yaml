revisions:
- from: Und wenn jemand von den Worten im Buch dieser Prophetie etwas wegnimmt, wird Gott ihm seinen Anteil am Baum des Lebens[a] und an der heiligen Stadt wegnehmen, von denen in diesem Buch geschrieben steht.
  to: Und wenn jemand etwas von den Worten des Buches dieser Prophetie wegnimmt, wird Gott ihm seinen Anteil am Baum des Lebens[a] und an der heiligen Stadt wegnehmen, die in diesem Buch verzeichnet sind.
  rationale: Die Überarbeitung korrigiert die deutsche Syntax und stellt die genitivische Beziehung von „Worten“ und „Buch“ enger dar. Die pluralische Relativkonstruktion bewahrt den Bezug auf sowohl den Baum des Lebens als auch die heilige Stadt. Die Textvariante bleibt unverändert und korrekt am Ausdruck „Baum des Lebens“ verankert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:08Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Konditionalsatzstruktur, die verbale Entsprechung von ἀφέλῃ/ἀφελεῖ, „Anteil“, „Baum des Lebens“ und „heilige Stadt“ sachgerecht wieder. Die SBLGNT-Lesart „Baum des Lebens“ ist korrekt im Haupttext beibehalten; die abweichende Lesart ist angemessen als Textvariante vermerkt.
  naturalness: 'Die Formulierung „von denen in diesem Buch geschrieben steht“ ist im heutigen Standarddeutsch syntaktisch und idiomatisch missglückt: „geschrieben steht“ benötigt hier eine andere Konstruktion. Außerdem ist „von den Worten im Buch“ weniger präzise als die genitivische Zuordnung des griechischen Textes.'
  terminology: „Prophetie“, „Anteil“, „Baum des Lebens“ und „heilige Stadt“ sind treffend, würdig und im modernen Standarddeutsch geläufig. „Verzeichnet sind“ gibt τῶν γεγραμμένων idiomatisch wieder, ohne den Bezug auf Baum und Stadt inhaltlich zu verändern.
  issues:
  - severity: medium
    issue: Unidiomatische und syntaktisch fehlerhafte Wiedergabe von τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
    rationale: „von denen in diesem Buch geschrieben steht“ bildet weder die pluralische Bezugsstruktur noch das griechische Perfektpartizip natürlich ab. „die in diesem Buch verzeichnet sind“ bezieht sich eindeutig auf beide genannten Größen und ist idiomatisches Deutsch.
  - severity: low
    issue: „von den Worten im Buch dieser Prophetie“ ist gegenüber dem griechischen Genitiv weniger genau.
    rationale: λόγων τοῦ βιβλίου bezeichnet die Worte des Buches, nicht lediglich Worte, die sich darin befinden. „von den Worten des Buches dieser Prophetie“ wahrt die Zuordnung klarer.
  revised_text: Und wenn jemand etwas von den Worten des Buches dieser Prophetie wegnimmt, wird Gott ihm seinen Anteil am Baum des Lebens[a] und an der heiligen Stadt wegnehmen, die in diesem Buch verzeichnet sind.
  revised_footnotes:
  - marker: a
    text: Einige Handschriften lesen hier „Buch des Lebens“ statt „Baum des Lebens“.
    reason: textual_variant
  revision_rationale: Die Überarbeitung korrigiert die deutsche Syntax und stellt die genitivische Beziehung von „Worten“ und „Buch“ enger dar. Die pluralische Relativkonstruktion bewahrt den Bezug auf sowohl den Baum des Lebens als auch die heilige Stadt. Die Textvariante bleibt unverändert und korrekt am Ausdruck „Baum des Lebens“ verankert.
