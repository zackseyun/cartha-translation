id: REV.22.6
reference: Revelation 22:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Diese Worte sind zuverlässig und wahr. Und der Herr, der Gott der Geister der Propheten, hat seinen Engel gesandt, um seinen Sklaven zu zeigen, was bald geschehen muss.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was schnell geschehen muss«. Die griechische Wendung kann entweder zeitliche Nähe (»bald«) oder die Schnelligkeit des Geschehens (»schnell«) betonen.'
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: zuverlässig und wahr
  rationale: Die Verbindung beschreibt die Worte als verlässlich und wahrheitsgemäß; „zuverlässig“ ist bei „Worten“ im modernen Deutschen natürlicher als „treu“.
- source_word: ὁ κύριος
  choice: der Herr
  rationale: Bewahrt den göttlichen Titel und seine biblische Prägung.
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: der Gott der Geister der Propheten
  rationale: Die Genitivstruktur bleibt erhalten, ohne zu entscheiden, ob die Geister den Propheten gehören, prophetisch wirken oder von Gott inspiriert sind.
- source_word: ἄγγελον
  choice: Engel
  rationale: Der apokalyptische Kontext spricht für ein himmlisches Wesen und nicht lediglich für einen menschlichen Boten.
- source_word: δούλοις
  choice: Sklaven
  rationale: Gibt das Besitz- und Abhängigkeitsverhältnis von δοῦλος deutlicher wieder als „Diener“, auch wenn die Formulierung im Deutschen bewusst anstößig wirken kann.
- source_word: δεῖξαι
  choice: zu zeigen
  rationale: Direkte und im visionären Zusammenhang natürliche Wiedergabe.
- source_word: ἃ δεῖ γενέσθαι
  choice: was geschehen muss
  rationale: Bewahrt sowohl die Notwendigkeit in δεῖ als auch den Ereignischarakter von γενέσθαι in natürlichem Deutsch.
- source_word: ἐν τάχει
  choice: bald
  rationale: Im Kontext liegt zeitliche Nähe nahe; die ebenfalls mögliche Bedeutung „schnell“ wird in der Fußnote bewahrt.
- source_word: Καὶ εἶπέν μοι
  choice: Und er sagte zu mir
  rationale: Gibt den einfachen griechischen Anschluss wieder, ohne καί als stärkeren zeitlichen Übergang auszudeuten.
theological_decisions:
- issue: Bedeutung von ἐν τάχει im endzeitlichen Zusammenhang
  choice: bald
  alternative: schnell
  rationale: Die Wendung kann zeitliche Nähe oder die rasche Durchführung des Geschehens bezeichnen. Der Haupttext folgt der im Kontext naheliegenden zeitlichen Lesart, während die andere Möglichkeit in der Fußnote erhalten bleibt.
- issue: Wiedergabe von δοῦλοι als Bezeichnung der Menschen Gottes
  choice: Sklaven
  alternative: Diener
  rationale: „Sklaven“ bewahrt deutlicher die Zugehörigkeit und uneingeschränkte Unterordnung, die δοῦλος ausdrückt; „Diener“ ist geläufiger, schwächt diesen Aspekt jedoch ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Syntax. Die ungewöhnliche Formulierung „Gott der Geister der Propheten“ bleibt bewusst transparent; „Sklaven“ gibt δοῦλοι semantisch deutlich wieder.
