source:
  edition: SBLGNT
  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: de
  text: 'Derjenige, der dies bezeugt, sagt: „Ja, ich komme bald[a].“ Amen. Komm, Herr Jesus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schnell“. Das griechische Adverb kann entweder die zeitliche Nähe oder die Schnelligkeit des Kommens beziehungsweise Handelns betonen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: sagt
  rationale: Das Präsens wird als natürliche Einleitung direkter Rede im Deutschen wiedergegeben.
- source_word: ὁ μαρτυρῶν
  choice: der, der … bezeugt
  rationale: Die substantivierte Präsenspartizipialform bezeichnet Jesus als denjenigen, der für den Inhalt der Offenbarung Zeugnis ablegt; „bezeugt“ bewahrt den Zeugnischarakter von μαρτυρέω.
- source_word: ταῦτα
  choice: dies
  rationale: Das deutsche Singularpronomen „dies“ kann zusammenfassend auf die zuvor mitgeteilten Inhalte verweisen und klingt hier natürlicher als „diese Dinge“.
- source_word: Ναί
  choice: Ja
  rationale: Die schlichte Bekräftigung des griechischen Ausdrucks bleibt ohne zusätzliche feierliche Deutung erhalten.
- source_word: ἔρχομαι
  choice: ich komme
  rationale: Das griechische Präsens hat hier zukunftsbezogene Bedeutung; das deutsche Präsens gibt dies idiomatisch und unmittelbar wieder.
- source_word: ταχύ
  choice: bald
  rationale: Im Zusammenhang der Verheißung bezeichnet „bald“ am ehesten zeitliche Nähe; die mögliche Bedeutung „schnell“ wird in einer Fußnote bewahrt.
- source_word: Ἀμήν
  choice: Amen
  rationale: Der geläufige liturgische Ausdruck bewahrt die zustimmende und gebetshafte Antwort.
- source_word: ἔρχου
  choice: Komm
  rationale: Der Imperativ wird knapp und unmittelbar wiedergegeben und bewahrt die Dringlichkeit des Gebets.
- source_word: κύριε
  choice: Herr
  rationale: „Herr“ ist die etablierte, ehrerbietige Wiedergabe des an Jesus gerichteten Titels κύριος.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird nach üblicher deutscher Konvention wiedergegeben.
theological_decisions:
- issue: Bedeutung von ταχύ in der Verheißung der Wiederkunft Christi
  choice: bald
  alternative: schnell / unverzüglich
  rationale: ταχύ kann sowohl zeitliche Nähe als auch die Schnelligkeit des Kommens oder Handelns betonen. Im abschließenden Austausch passt „bald“ am besten in den deutschen Haupttext; die eschatologisch bedeutsame Mehrdeutigkeit bleibt durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Abfolge von Verheißung, Zustimmung und Gebet bleibt erhalten; das Ausrufezeichen unterstreicht die natürliche Dringlichkeit des abschließenden Gebets.
