id: REV.22.2
reference: Revelation 22:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: de
  text: Mitten auf ihrer Straße und diesseits und jenseits des Flusses steht der Baum des Lebens, der zwölf Früchte trägt und jeden Monat seine Frucht gibt.[a] Und die Blätter des Baumes dienen zur Heilung der Völker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwölf Früchte“. Gemeint sein können zwölf Arten von Früchten oder ein vollständiger, fortlaufender Zyklus der Fruchtbarkeit. Das Bild erinnert an den Baum des Lebens in 1. Mose 2,9 und an Hesekiel 47,12.'
    reason: Lexikalische Alternative und Querverweis; die Mehrdeutigkeit von „zwölf Früchte“ wird bewahrt und der bildliche Hintergrund benannt.
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: mitten auf ihrer Straße
  rationale: Die Wendung gibt den Ort natürlich wieder; πλατεῖα bezeichnet hier im Bild der Stadt am ehesten eine breite Straße, während αὐτῆς durch „ihrer“ bewahrt bleibt.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: diesseits und jenseits
  rationale: Die räumliche Verteilung auf beiden Seiten wird knapp und nah am griechischen Ausdruck wiedergegeben, ohne die ungewöhnliche Bildgeografie aufzulösen.
- source_word: ξύλον ζωῆς
  choice: der Baum des Lebens
  rationale: ξύλον kann Holz oder Baum bedeuten; der Bezug auf Genesis 2 und das wiederkehrende Bild in der Offenbarung sprechen eindeutig für „Baum“. Die bestimmte Form kennzeichnet den bekannten Baum des Lebens.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: brachte zwölf Früchte hervor
  rationale: ποιεῖν mit καρπούς bezeichnet das Hervorbringen von Frucht. „Zwölf Früchte“ bleibt lexikalisch eng am Griechischen und ergänzt nicht ausdrücklich „Arten“ oder „Ernten“.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: gab jeden Monat seine Frucht
  rationale: Die Formulierung bewahrt sowohl die monatliche Wiederkehr als auch das im Singular stehende τὸν καρπὸν αὐτοῦ.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: dienen zur Heilung der Völker
  rationale: „Zur Heilung“ wahrt die Ziel- oder Zweckangabe von εἰς; „Völker“ gibt ἔθνη im weltweiten eschatologischen Zusammenhang angemessen wieder.
theological_decisions:
- issue: Die räumliche Beziehung des singularischen Baumes zur Straße und zu beiden Seiten des Flusses
  choice: Das singularische Bild „der Baum des Lebens“ wird beibehalten und mit Straße sowie beiden Flussseiten verbunden, ohne die Geografie weiter zu erklären.
  alternative: „Bäume des Lebens“ oder eine Umstellung, die den Baum eindeutig nur einer Ortsangabe zuordnet.
  rationale: Der griechische Text ist in seiner visionären Ortsbeschreibung stark verdichtet. Der Singular wahrt den überlieferten Wortlaut und den Bezug zum Baum des Lebens in Genesis, während die räumliche Spannung bestehen bleibt.
- issue: Bedeutung der zwölf Früchte
  choice: „zwölf Früchte“
  alternative: „zwölf Arten von Früchten“ oder „zwölf Ernten“
  rationale: Der Wortlaut nennt zwölf Früchte, ohne ausdrücklich Arten oder Ernten zu sagen. Die monatliche Fruchtgabe vermittelt die fortdauernde Fülle, ohne die Mehrdeutigkeit festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche apokalyptische Raumvorstellung wird nicht geglättet. Kurze Hauptsätze vermeiden syntaktische Überlastung und bleiben für heutige Leser verständlich.
