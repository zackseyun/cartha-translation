  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: de
  text: Die Gnade des Herrn Jesus sei mit allen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen: »Die Gnade des Herrn Jesus sei mit allen Heiligen«, andere: »mit euch allen«.'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: Gnade
  rationale: Bewahrt in der abschließenden Segensformel den üblichen neutestamentlichen Sinn von Gottes unverdienter, rettender Zuwendung.
- source_word: κυρίου
  choice: Herrn
  rationale: Gibt κύριος als etablierten christologischen Titel natürlich und würdevoll wieder.
- source_word: Ἰησοῦ
  choice: Jesus
  rationale: Der Personenname wird gemäß deutscher Konvention in seiner etablierten Form wiedergegeben.
- source_word: μετά
  choice: sei mit
  rationale: Der griechische Satz ist ohne ausdrückliches Verb formuliert; für eine natürliche deutsche Segensformel wird das im Kontext vorausgesetzte »sei« ergänzt.
- source_word: πάντων
  choice: allen
  rationale: Das substantivisch gebrauchte Wort ist im SBLGNT weder durch »euch« noch durch »Heiligen« näher bestimmt; »allen« erhält diese Offenheit.
theological_decisions:
- issue: Ob die Empfänger des Schlusssegens näher bestimmt werden sollen
  choice: Die offene Formulierung »mit allen«
  alternative: »mit euch allen« oder »mit allen Heiligen«
  rationale: Der zugrunde gelegte griechische Text endet mit dem unbestimmten πάντων. Die Übersetzung fügt daher keine Empfängergruppe hinzu; abweichende Lesarten werden in der Fußnote dokumentiert.
translation_notes:
  register: Moderne, allgemein verständliche und zugleich würdevolle deutsche Segensformel. Das ergänzte »sei« macht den verblosen griechischen Ausdruck idiomatisch; »mit allen« bewahrt dessen genuine Offenheit.
