  source_fidelity: Der Entwurf gibt die hervorgehobene Selbstidentifikation des Johannes sowie den Kontrast zwischen den Präsenspartizipien („hört und sieht“) und den anschließenden Aoristen („hörte und sah“) angemessen wieder. „Vor den Füßen des Engels“ entspricht ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου. Die deutsche Stellung des Zweckinfinitivs („um ihn anzubeten“) ist idiomatisch und erhält die Funktion von προσκυνῆσαι.
  naturalness: Modernes, würdiges Standarddeutsch. „Und ich, Johannes, bin es, der dies hört und sieht“ ist leicht formal, aber natürlich genug und für den feierlichen apokalyptischen Kontext passend. Die Satzfolge im zweiten Satz liest sich klar.
  terminology: „Engel“ ist kontextgerecht. „Anbeten“ wahrt die in der Offenbarung naheliegende starke Bedeutung von προσκυνέω, ohne die narrative Spannung vorweg aufzulösen. Die Fußnote bietet die sachlich notwendigen lexikalischen Alternativen; ihr Anker steht korrekt bei „anzubeten“.
