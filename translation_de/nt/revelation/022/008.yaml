id: REV.22.8
reference: Revelation 22:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: de
  text: Und ich, Johannes, bin es, der dies hört und sieht. Und als ich hörte und sah, fiel ich vor den Füßen des Engels nieder, der mir dies zeigte, um ihn anzubeten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sich vor ihm niederzuwerfen“ oder „ihm zu huldigen“. Das griechische Verb kann eine ehrerbietige Niederwerfung bezeichnen; hier steht „anbeten“, weil es in der Offenbarung regelmäßig diese starke Bedeutung hat und im folgenden Vers ein Tadel ausgesprochen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: Und ich
  rationale: Bewahrt sowohl die Verknüpfung durch καί als auch die Betonung des ausdrücklich genannten Ichs.
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: bin es, der dies hört und sieht
  rationale: Die substantivierten Präsenspartizipien werden als natürliche deutsche Relativkonstruktion im Präsens wiedergegeben; so bleibt ihr imperfektiver Charakter erhalten.
- source_word: ταῦτα
  choice: dies
  rationale: Das deutsche Sammelpronomen gibt den pluralischen Rückverweis auf die geschilderten Offenbarungsinhalte idiomatisch wieder und wird bei beiden Vorkommen einheitlich verwendet.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: als ich hörte und sah
  rationale: Die temporale Konjunktion und die beiden Aoristformen werden ohne unnötige Vorzeitigkeitsdeutung schlicht wiedergegeben.
- source_word: ἔπεσα
  choice: fiel ich ... nieder
  rationale: Gibt die körperliche Bewegung des Fallens in idiomatischem Deutsch wieder.
- source_word: προσκυνῆσαι
  choice: um ihn anzubeten
  rationale: Der Infinitiv bezeichnet hier den Zweck des Niederfallens. „Anbeten“ bewahrt angesichts des folgenden Tadels die starke religiöse Bedeutung, während die Fußnote die mögliche Bedeutung als ehrerbietiges Niederwerfen offenhält.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: vor den Füßen
  rationale: Bewahrt sowohl die räumliche Präposition als auch die ausdrückliche Erwähnung der Füße.
- source_word: τοῦ ἀγγέλου
  choice: des Engels
  rationale: Im Kontext der Offenbarung bezeichnet ἄγγελος eindeutig ein himmlisches Wesen; „Engel“ ist daher die sachgerechte und etablierte Wiedergabe.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: der mir dies zeigte
  rationale: Die Relativkonstruktion gibt die begleitende Rolle des Engels natürlich wieder, ohne mit einem Plusquamperfekt eine zusätzliche zeitliche Abstufung einzutragen.
theological_decisions:
- issue: Bedeutung von προσκυνέω gegenüber dem Engel
  choice: „anbeten“ im Haupttext
  alternative: „sich vor ihm niederwerfen“ oder „ihm huldigen“
  rationale: προσκυνέω kann körperliches Niederwerfen oder Huldigung bezeichnen, trägt in der Offenbarung jedoch regelmäßig den Sinn religiöser Anbetung. Der folgende Tadel zeigt, dass die Handlung gegenüber dem Engel verfehlt ist. Die stärkere Wiedergabe bewahrt diese theologische Spannung, ohne zu behaupten, der Engel dürfe Anbetung empfangen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Konstruktion „bin es, der“ erhält die hervorgehobene Selbstnennung des Johannes, ohne die griechische Partizipialfügung unnatürlich nachzuahmen. Der zweimalige Rückverweis mit „dies“ bleibt knapp und idiomatisch.
