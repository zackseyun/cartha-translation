source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: de
  text: Wer Unrecht tut, soll weiterhin Unrecht tun; und wer schmutzig ist, soll weiterhin beschmutzt werden[a]; und wer gerecht ist, soll weiterhin Gerechtigkeit üben[b]; und wer heilig ist, soll weiterhin geheiligt werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „soll weiterhin schmutzig bleiben“. Das griechische Verb steht formal im Passiv und kann wörtlich mit „beschmutzt werden“ wiedergegeben werden; sinngemäß ist auch eine Zustandsaussage möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „soll weiterhin Recht tun“. Das griechische Wort kann sowohl „Gerechtigkeit“ als auch „Recht“ bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „soll weiterhin heilig gemacht werden“. „Geheiligt werden“ gibt das griechische Passiv knapp wieder.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: Wer Unrecht tut, soll weiterhin Unrecht tun
  rationale: Das substantivierte Partizip wird als allgemeiner Relativsatz wiedergegeben. „Soll … tun“ bewahrt den Imperativ, während „weiterhin“ die fortdauernde Bedeutung von ἔτι ausdrückt, ohne den Aorist zu überdeuten.
- source_word: ὁ ῥυπαρός
  choice: wer schmutzig ist
  rationale: ῥυπαρός bezeichnet hier substantiviert einen Menschen und kann sowohl Schmutz als auch moralische Befleckung ausdrücken. Der Relativsatz klingt im modernen Deutsch natürlich und hält die Person im Blick.
- source_word: ῥυπαρευθήτω
  choice: soll … beschmutzt werden
  rationale: Die passive Form wird ausdrücklich bewahrt. „Beschmutzt werden“ erhält die Härte und die unausgesprochene Urheberschaft des griechischen Passivs; eine idiomatischere Zustandsaussage steht in der Fußnote.
- source_word: ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι
  choice: wer gerecht ist, soll weiterhin Gerechtigkeit üben
  rationale: „Gerecht“ und „Gerechtigkeit“ erhalten die Wortverwandtschaft von δίκαιος und δικαιοσύνη. „Gerechtigkeit üben“ gibt ποιεῖν mit einem abstrakten ethischen Objekt natürlich als tätiges Verhalten wieder.
- source_word: ὁ ἅγιος ἁγιασθήτω ἔτι
  choice: wer heilig ist, soll weiterhin geheiligt werden
  rationale: „Heilig“ und „geheiligt“ spiegeln die gemeinsame Wortwurzel. Das Passiv bleibt erhalten und lässt offen, wer die Heiligung bewirkt.
theological_decisions:
- issue: Imperative im Zusammenhang der endgültigen moralischen Scheidung
  choice: Alle vier Verben werden als Aufforderungen mit „soll“ wiedergegeben.
  alternative: Eine Vorhersage mit „wird“ oder eine Umschreibung mit „mag“
  rationale: Die griechischen Formen sind Imperative der dritten Person. Die Übersetzung bewahrt diese grammatische und rhetorische Härte, ohne die Worte als Billigung des Unrechts zu erklären oder ihre Funktion bloß auf eine Vorhersage zu reduzieren.
- issue: Passiv bei ῥυπαρευθήτω und ἁγιασθήτω
  choice: „soll … beschmutzt werden“ und „soll … geheiligt werden“
  alternative: „soll schmutzig bleiben“ und „soll heilig bleiben“
  rationale: Beide griechischen Verben stehen im Passiv. Die deutsche Fassung lässt deshalb die Urheberschaft unausgesprochen und bewahrt die theologische Spannung des Wortlauts.
- issue: Bedeutung von δικαιοσύνη
  choice: Gerechtigkeit
  alternative: Recht
  rationale: „Gerechtigkeit“ ist hier die naheliegende ethische Entsprechung und hält die Wortverbindung mit „gerecht“ sichtbar. „Recht tun“ wäre möglich, würde die lexikalische Breite aber anders gewichten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vier parallelen Satzglieder werden durch Semikola gegliedert. Die wiederholte Konstruktion „wer … ist/tut, soll weiterhin …“ erhält den feierlichen Rhythmus und macht die substantivierten griechischen Formen für heutige Leser verständlich. Die auffälligen Passive werden nicht geglättet.
