source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: de
  text: 'Und siehe: Ich komme bald[a]. Selig ist, wer die Worte der Prophetie dieses Buches[b] bewahrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „schnell“. Das griechische Wort kann zeitliche Nähe („bald“) oder die Schnelligkeit der Ankunft betonen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dieser Schriftrolle“.'
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden, deiktischen Charakter und klingt im modernen Deutschen würdig, ohne unnötig altertümlich zu wirken.
- source_word: ἔρχομαι
  choice: ich komme
  rationale: Das deutsche Präsens kann wie das griechische Präsens hier eine bevorstehende Ankunft ausdrücken, ohne eine zusätzliche Bedeutungsnuance einzutragen.
- source_word: ταχύ
  choice: bald
  rationale: Im Kontext bezeichnet das Adverb am ehesten zeitliche Nähe. Die ebenfalls mögliche Nuance einer schnellen oder plötzlichen Ankunft wird in der Fußnote erhalten.
- source_word: μακάριος
  choice: glücklich
  rationale: Gibt die Seligpreisungsformel in natürlichem, heutigem Deutsch wieder und bezeichnet den von Gott begünstigten Zustand, nicht bloß ein flüchtiges Gefühl.
- source_word: ὁ τηρῶν
  choice: wer ... bewahrt
  rationale: Gibt das substantivierte Partizip allgemein wieder. „Bewahrt“ erhält das Bedeutungsspektrum von hüten, festhalten und befolgen besser als das enger deutende „gehorcht“.
- source_word: τοὺς λόγους
  choice: die Worte
  rationale: Bewahrt den konkreten Plural des Ausgangstextes; „Botschaft“ würde ihn zusammenfassend verallgemeinern.
- source_word: τῆς προφητείας
  choice: der Prophetie
  rationale: Bewahrt die genitivische Verbindung und die Bezeichnung des Buchinhalts als prophetische Offenbarung. „Prophetie“ ist im modernen religiösen Sprachgebrauch präziser als das häufig auf eine einzelne Vorhersage verengte „Weissagung“.
- source_word: τοῦ βιβλίου τούτου
  choice: dieses Buches
  rationale: Ist die natürliche deutsche Selbstbezeichnung für die Offenbarung; die historisch mögliche Bedeutung „Schriftrolle“ bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Identität des Sprechers bei „Ich komme bald“
  choice: Der Sprecher wird nur in der ersten Person wiedergegeben und nicht im Vers ausdrücklich benannt.
  alternative: Den Sprecher durch den Zusatz „Jesus“ ausdrücklich identifizieren.
  rationale: Der griechische Text enthält hier keinen Eigennamen. Die Übersetzung überlässt die Identifikation dem literarischen Zusammenhang und fügt keine Auslegung in den Wortlaut ein.
- issue: Bedeutungsumfang von τηρέω
  choice: „bewahrt“ lässt Festhalten, Beachten und gehorsames Befolgen mitschwingen.
  alternative: „gehorcht“ legt den Ausdruck ausschließlich auf Befolgung fest.
  rationale: Die offenere Wiedergabe erhält die theologische Spannung zwischen dem Hüten der prophetischen Worte und dem Handeln nach ihnen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, leicht erhöhtem Ton. „Sieh“ erhält den feierlichen Aufmerksamkeitsruf, ohne das altertümlichere „siehe“ zu verwenden. Die Satzstruktur bleibt knapp und proclamatorisch.
