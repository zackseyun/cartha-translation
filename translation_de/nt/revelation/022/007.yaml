- from: 'Und sieh: Ich komme bald[a]. Glücklich ist, wer die Worte der Prophetie dieses Buches[b] bewahrt.'
  to: 'Und siehe: Ich komme bald[a]. Selig ist, wer die Worte der Prophetie dieses Buches[b] bewahrt.'
  rationale: Die Revision verbessert die idiomatische und registergerechte Wiedergabe des Aufmerksamkeitsrufs und verwendet mit „selig“ den im Deutschen angemessenen Begriff für die beatitudenhafte Aussage. Die Anmerkung zu ταχύ wird auf die sprachlich tragfähige Ambiguität beschränkt. Sprecheridentität und der offene Bedeutungsumfang von τηρέω bleiben unverändert und ohne interpretierende Ergänzung erhalten.
