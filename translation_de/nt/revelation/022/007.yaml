  source_fidelity: 'Der Satzbau und die wesentlichen Bedeutungen sind zutreffend wiedergegeben: ἔρχομαι bleibt als futurisches Präsens „ich komme“, ταχύ als „bald“, und τηρῶν als offene, nicht auf bloßes Gehorchen eingeengte Formulierung. „Glücklich“ kann μακάριος grundsätzlich wiedergeben, verliert in dieser formelhaften Seligpreisung jedoch die religiös-eschatologische Prägung zu stark.'
  naturalness: „Und sieh:“ ist als direkter Zuruf möglich, wirkt hier als einleitender Ausruf jedoch weniger idiomatisch und kann unnötig umgangssprachlich klingen. „Und siehe:“ ist in einer prophetisch-apokalyptischen Proklamation klar und angemessen erhöht. „Selig ist, wer …“ ist zugleich idiomatisch und im deutschen Bibelregister etabliert.
  terminology: „Prophetie“, „Worte“ und „bewahrt“ sind treffend. „Selig“ ist für μακάριος in diesem Kontext der geeignetere etablierte Schlüsselbegriff, ohne eine konfessionelle Deutung hinzuzufügen. Die Fußnote zu ταχύ sollte keine eigenständige Bedeutung „plötzlich“ als unmittelbare lexikalische Alternative darstellen; gesichert ist vor allem die Spannung zwischen zeitlicher Nähe und Schnelligkeit.
  issues:
  - severity: medium
    issue: „Glücklich“ für μακάριος
    rationale: Die Wiedergabe ist lexikalisch möglich, klingt im Deutschen aber vorrangig nach subjektivem Wohlbefinden. In der formelhaften Seligpreisung bewahrt „selig“ den zugesprochenen, religiös-eschatologischen Charakter besser.
  - severity: low
    issue: „Und sieh:“ für καὶ ἰδού
    rationale: Als Diskursmarker einer feierlichen Ankündigung ist „Und siehe:“ im modernen schriftlichen Standarddeutsch natürlicher und registergerecht.
  - severity: low
    issue: Fußnote zu ταχύ nennt „plötzlich“ als Alternative
    rationale: „Plötzlich“ ist eher eine mögliche kontextuelle Folgerung als eine gleichrangige direkte Übersetzung. Die Fußnote sollte die belegte Ambiguität zwischen „bald“ und „schnell“ benennen.
