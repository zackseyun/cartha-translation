id: REV.22.16
reference: Revelation 22:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: de
  text: Ich, Jesus, habe meinen Engel gesandt, um euch dies alles für die Gemeinden[a] zu bezeugen. Ich bin die Wurzel und der Nachkomme Davids[b], der helle Morgenstern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in den Gemeinden« beziehungsweise »die Gemeinden betreffend«. Die griechische Wendung ἐπὶ ταῖς ἐκκλησίαις lässt mehrere Bedeutungsnuancen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »der Spross Davids« beziehungsweise »einer aus Davids Geschlecht«. Das griechische γένος bezeichnet Herkunft, Geschlecht oder Nachkommenschaft.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Ich, Jesus,
  rationale: Das ausdrücklich gesetzte Pronomen betont die Selbstidentifikation; die Apposition ist im Deutschen natürlich und bildet kein zusätzliches »bin« ein.
- source_word: ἔπεμψα
  choice: habe … gesandt
  rationale: Das Perfekt gibt die vollzogene Sendung mit ihrer fortdauernden Bedeutung im gegenwärtigen Offenbarungsgeschehen idiomatisch wieder.
- source_word: τὸν ἄγγελόν μου
  choice: meinen Engel
  rationale: Im apokalyptischen Zusammenhang der Offenbarung bezeichnet ἄγγελος hier am ehesten ein himmlisches Wesen; »Engel« bewahrt dies.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: um euch dies … zu bezeugen
  rationale: Der Infinitiv bezeichnet den Zweck der Sendung. »Bezeugen« wahrt den Zeugnischarakter von μαρτυρέω; »dies« fasst den Offenbarungsinhalt im Deutschen natürlich zusammen.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: für die Gemeinden
  rationale: Die flexible Präpositionalfügung wird als Bestimmung beziehungsweise Bezugsbereich des Zeugnisses verstanden, ohne die möglichen Nuancen »in den Gemeinden« oder »die Gemeinden betreffend« auszuschließen.
- source_word: ἡ ῥίζα
  choice: die Wurzel
  rationale: Die konkrete Metapher und der messianische Anklang bleiben unverändert erhalten.
- source_word: τὸ γένος Δαυίδ
  choice: der Nachkomme Davids
  rationale: γένος kann Herkunft, Geschlecht oder Nachkommenschaft bezeichnen; in der Einzelaussage über Jesus ist »Nachkomme« klar und gegenwärtig.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: der helle Morgenstern
  rationale: Die gehäuften griechischen Attribute werden in eine natürliche deutsche Titelform überführt, wobei Helligkeit und Morgenbezug erhalten bleiben.
theological_decisions:
- issue: Messianisch-davidische Selbstidentifikation
  choice: die Wurzel und der Nachkomme Davids
  alternative: der Ursprung und der Spross Davids
  rationale: Die Formulierung bewahrt die Spannung, dass Jesus zugleich als Wurzel und als Nachkomme Davids bezeichnet wird, statt sie erklärend aufzulösen.
- issue: Christologischer Titel »Morgenstern«
  choice: der helle Morgenstern
  alternative: der glänzende Stern, der Morgenstern
  rationale: Die unmittelbare Selbstbezeichnung Jesu bleibt bildhaft und ohne zusätzliche dogmatische Ausdeutung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Selbstvorstellung und die bildhaften Titel bleiben erhalten; Satzbau und Wortwahl sind zugleich für heutige Leser gut verständlich.
