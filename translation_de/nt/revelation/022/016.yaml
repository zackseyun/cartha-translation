  verdict: revise
  source_fidelity: Der Haupttext gibt die emphatische Selbstidentifikation, die vollzogene Sendung, den Zweck des Zeugnisses, die offene Nuance von ἐπὶ ταῖς ἐκκλησίαις sowie die davidischen und astralen Titel insgesamt zutreffend wieder. »Dies« ist als zusammenfassender Bezug möglich, aber »dies alles« macht den pluralischen Bezug von ταῦτα deutlicher, ohne unidiomatisch zu werden.
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch. »Um euch dies alles für die Gemeinden zu bezeugen« ist flüssig und bewahrt die direkte Verbindung von »euch«, »dies alles« und »für die Gemeinden«.
  terminology: »Engel«, »Wurzel«, »Nachkomme Davids« und »helle Morgenstern« sind angemessen. Die Fußnote zu γένος sollte jedoch »Davids Geschlecht« nicht als nackte prädikative Alternative anbieten, da dies im Deutschen hier keine natürliche Bezeichnung einer Person ist. Eine Umschreibung mit »aus Davids Geschlecht« gibt die mögliche Herkunftsnuance verständlich wieder.
