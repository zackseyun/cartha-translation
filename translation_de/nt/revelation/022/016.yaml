revisions:
- from: Ich, Jesus, habe meinen Engel gesandt, um euch dies für die Gemeinden[a] zu bezeugen. Ich bin die Wurzel und der Nachkomme Davids[b], der helle Morgenstern.
  to: Ich, Jesus, habe meinen Engel gesandt, um euch dies alles für die Gemeinden[a] zu bezeugen. Ich bin die Wurzel und der Nachkomme Davids[b], der helle Morgenstern.
  rationale: Die Revision macht den pluralischen Umfang von ταῦτα im Haupttext sichtbar und ersetzt eine im Deutschen missverständliche, unnatürliche Fußnotenalternative durch eine idiomatische Umschreibung. Die Bedeutung, die offenbleibende Nuance der Präpositionalfügung und die christologische Spannung des Ausgangstextes bleiben unverändert.
