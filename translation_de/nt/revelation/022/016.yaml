    issue: Pluralischer Bezug von ταῦτα
    rationale: Das deutsche »dies« kann kollektiv gebraucht werden, verdeckt jedoch die im Griechischen ausdrückliche Pluralform. »Dies alles« erhält den Gesamtbezug und ist idiomatisch.
  - severity: medium
    issue: Unnatürliche Fußnotenalternative »Davids Geschlecht«
    rationale: Während γένος Herkunft bzw. Geschlecht bezeichnen kann, ist »Ich bin ... Davids Geschlecht« im Deutschen semantisch und syntaktisch keine brauchbare Personenprädikation. Die Alternative sollte als »einer aus Davids Geschlecht« formuliert werden.
