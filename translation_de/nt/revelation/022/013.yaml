id: REV.22.13
reference: Revelation 22:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: de
  text: Ich bin das Alpha und das Omega, der Erste und der Letzte, der Anfang und das Ende.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Ursprung und das Ziel“.'
    reason: 'Lexikalische Alternative: ἀρχή und τέλος können neben „Anfang“ und „Ende“ auch Herkunft beziehungsweise Ziel oder Vollendung bezeichnen.'
lexical_decisions:
- source_word: ἐγὼ
  choice: Ich
  rationale: Das ausdrücklich gesetzte Pronomen verleiht der feierlichen Selbstaussage Nachdruck; im Deutschen wird dies natürlich durch „Ich bin“ wiedergegeben, ohne das stärker markierte „Ich selbst“ einzufügen.
- source_word: τὸ Ἄλφα
  choice: das Alpha
  rationale: Der Name des ersten griechischen Buchstabens bleibt als fester symbolischer Titel der Offenbarung erhalten; eine Wiedergabe als „das A“ würde den etablierten Titel abschwächen.
- source_word: τὸ Ὦ
  choice: das Omega
  rationale: Der Name des letzten griechischen Buchstabens wird als etablierter symbolischer Titel bewahrt und bildet das natürliche Gegenstück zu „das Alpha“.
- source_word: ὁ πρῶτος
  choice: der Erste
  rationale: Die substantivierte Form wird direkt und titulär wiedergegeben; die Großschreibung entspricht dem deutschen Gebrauch bei substantivierten Adjektiven.
- source_word: ὁ ἔσχατος
  choice: der Letzte
  rationale: „Der Letzte“ ist die direkte und idiomatische Entsprechung und wahrt den Parallelismus zu „der Erste“.
- source_word: ἡ ἀρχὴ
  choice: der Anfang
  rationale: „Der Anfang“ bewahrt die knappe, umfassende Formulierung und den Parallelismus mit „das Ende“; die mögliche Nuance „Ursprung“ wird in der Fußnote berücksichtigt.
- source_word: τὸ τέλος
  choice: das Ende
  rationale: „Das Ende“ ist das natürliche Gegenstück zu „der Anfang“ und erhält die ausgewogene Titelfolge; die mögliche Bedeutung „Ziel“ wird in der Fußnote genannt.
theological_decisions:
- issue: Die drei parallelen Selbstbezeichnungen ausdrücken, ohne ihre metaphysische oder christologische Tragweite erläuternd festzulegen
  choice: Ich bin das Alpha und das Omega, der Erste und der Letzte, der Anfang und das Ende.
  alternative: Ich bin das Alpha und das Omega, der Erste und der Letzte, der Ursprung und das Ziel.
  rationale: Die Übersetzung bewahrt die dreifache Parallelstruktur und lässt den umfassenden Anspruch der Aussage für sich stehen. „Ursprung“ und „Ziel“ sind mögliche Sinnnuancen von ἀρχή und τέλος, würden im Haupttext jedoch die traditionelle und literarisch naheliegende Paarung stärker auslegen.
translation_notes:
  register: Feierlich und würdevoll, zugleich in modernem Standarddeutsch klar verständlich. Die drei symmetrischen Titelpaare und die etablierten Bezeichnungen „Alpha“ und „Omega“ bleiben erhalten.
