  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: de
  text: Und sie werden sein Angesicht sehen,[a][b] und sein Name wird auf ihren Stirnen stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie werden sein Gesicht sehen“; auch: „sie werden sein Angesicht schauen“.'
    reason: lexical_alternative
  - marker: b
    text: Die Singularpronomen „sein“ können sich auf Gott beziehen oder im unmittelbaren Zusammenhang die gemeinsame göttliche Herrschaft Gottes und des Lammes widerspiegeln.
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: sie werden sehen
  rationale: Das Futur von ὁράω bezeichnet hier schlicht das künftige Sehen. „Sehen“ ist natürliches modernes Deutsch; „schauen“ ist als gehobenere Alternative möglich.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: sein Angesicht
  rationale: πρόσωπον bedeutet hier konkret „Gesicht/Angesicht“. „Angesicht“ bewahrt in der würdevollen Bildsprache der Offenbarung die persönliche und unmittelbare Aussage, ohne den Sinn zu „Gegenwart“ zu verallgemeinern.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: sein Name
  rationale: Die direkte Wiedergabe wahrt die mögliche Bedeutung von Identität, Zugehörigkeit und Charakter, ohne diese im Haupttext auszudeuten.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: auf ihrer Stirn
  rationale: ἐπί mit Genitiv bezeichnet hier die Lage. Im Deutschen ist der distributive Singular „auf ihrer Stirn“ bei einem pluralischen Besitzer idiomatisch und meint die Stirn jedes Einzelnen.
- source_word: καὶ … καὶ
  choice: Und … und
  rationale: Beide Vorkommen werden als einfache Verknüpfung wiedergegeben und erhalten so die additive Struktur des Griechischen.
- source_word: αὐτοῦ
  choice: sein
  rationale: Das Pronomen wird nicht durch „Gottes“ oder „des Lammes“ ersetzt; dadurch bleibt sein Bezug ebenso offen wie im griechischen Kontext.
theological_decisions:
- issue: Bezug von αὐτοῦ („sein“) bei „Angesicht“ und „Name“
  choice: Das singularische Pronomen „sein“ wird beibehalten.
  alternative: Ausdrückliche Festlegung auf Gott oder auf das Lamm.
  rationale: Im unmittelbaren Kontext stehen Gott und das Lamm eng zusammen (Offb 22,3). Eine ausdrückliche Benennung würde die im Griechischen bestehende Spannung auflösen; die Übersetzung lässt den Bezug daher kontextuell offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Angesicht“ ist bewusst leicht gehoben und entspricht der feierlichen Bildsprache, bleibt aber allgemein verständlich. Die Fußnotenmarker stehen unmittelbar nach der betroffenen Wortgruppe.
