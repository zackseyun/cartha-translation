id: REV.22.17
reference: Revelation 22:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: de
  text: 'Und der Geist und die Braut sagen: »Komm!« Und wer hört, soll sagen: »Komm!«[a] Und wer Durst hat, soll kommen; wer will, soll das Wasser des Lebens kostenlos[b] nehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ersten beiden Rufe »Komm!« können als Bitte um das Kommen des Herrn verstanden werden. Die folgenden Aufforderungen laden die Durstigen und die Willigen ein, zu kommen und das Wasser des Lebens zu nehmen.
    reason: alternative_reading
  - marker: b
    text: 'Oder: »ohne Bezahlung«; auch: »als Geschenk«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet im Zusammenhang der Offenbarung am ehesten den Heiligen Geist; die Großschreibung gibt diesen Bezug im Deutschen wieder.
- source_word: ἡ νύμφη
  choice: die Braut
  rationale: Die Bildsprache bleibt erhalten, ohne sie im Haupttext als Gemeinde, Gottesvolk oder neues Jerusalem auszudeuten.
- source_word: λέγουσιν
  choice: sagen
  rationale: Das Präsens wird als gegenwärtiger, lebendiger Ruf mit dem natürlichen deutschen Präsens wiedergegeben.
- source_word: Ἔρχου
  choice: Komm!
  rationale: Der Imperativ in der zweiten Person Singular wird direkt wiedergegeben; sein nicht ausdrücklich genanntes Gegenüber bleibt offen.
- source_word: ὁ ἀκούων
  choice: wer es hört
  rationale: Die generische Partizipialform wird idiomatisch und inklusiv wiedergegeben. Das Pronomen »es« verweist auf den gehörten Ruf beziehungsweise die Botschaft, ohne einen neuen theologischen Bezug festzulegen.
- source_word: εἰπάτω
  choice: soll sagen
  rationale: Der Imperativ der dritten Person lässt sich im modernen Deutschen natürlich mit »soll« ausdrücken.
- source_word: ὁ διψῶν
  choice: wer Durst hat
  rationale: Die anschauliche Metapher des Durstes bleibt in einer geläufigen deutschen Form erhalten.
- source_word: ἐρχέσθω
  choice: soll kommen
  rationale: Der Imperativ setzt die Einladung in der dritten Person fort und wahrt die Wiederholung von »kommen«.
- source_word: ὁ θέλων
  choice: wer will
  rationale: Die knappe Form bewahrt das nicht ausdrücklich genannte Objekt des Wollens und vermeidet den Zusatz »es«.
- source_word: λαβέτω
  choice: soll … nehmen
  rationale: »Nehmen« bildet λαμβάνω unmittelbar ab und passt zum Bild des angebotenen Wassers; »empfangen« wäre ebenfalls möglich, aber stärker deutend.
- source_word: ὕδωρ ζωῆς
  choice: das Wasser des Lebens
  rationale: Die Genitivverbindung wird formal bewahrt und nicht zu »lebendigem Wasser« umgeformt.
- source_word: δωρεάν
  choice: umsonst
  rationale: Das Wort bezeichnet den unentgeltlichen Empfang. »Umsonst« ist knapp und würdig, kann im heutigen Deutschen jedoch auch »vergeblich« bedeuten; deshalb nennt die Fußnote eindeutige Alternativen.
theological_decisions:
- issue: Adressat der beiden Rufe »Komm!«
  choice: Der Haupttext nennt keinen Adressaten und lässt beide Rufe offen.
  alternative: Die ersten beiden Rufe ausdrücklich als Bitte an Jesus wiedergeben; erst anschließend die dürstenden Menschen einladen.
  rationale: Im Griechischen steht zweimal derselbe Imperativ der zweiten Person Singular ohne genanntes Objekt; danach folgen Imperative der dritten Person für den Dürstenden und den Wollenden. Die Übersetzung bewahrt diesen Wechsel und die mögliche Mehrschichtigkeit.
- issue: Symbolischer Bezug der »Braut«
  choice: Das Bild »die Braut« bleibt unaufgelöst stehen.
  alternative: Die Braut als Gemeinde, Gottesvolk oder neues Jerusalem benennen.
  rationale: Die Offenbarung verbindet diese Vorstellungen bildhaft miteinander. Eine erklärende Ersetzung im Haupttext würde eine Auslegung festschreiben, die der Vers selbst nicht ausdrücklich formuliert.
- issue: Art der kostenlosen Gabe
  choice: δωρεάν wird als unentgeltlicher Empfang ausgedrückt.
  alternative: »als Geschenk« oder »ohne Bezahlung«
  rationale: Alle Fassungen betonen, dass das Wasser des Lebens nicht erkauft wird. Der Haupttext bleibt lexikalisch knapp; die Fußnote beseitigt die mögliche moderne Nebenbedeutung von »umsonst«.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem Rhythmus. Die wiederholten kurzen Rufe und die parallelen Einladungen des griechischen Textes bleiben erkennbar. »Wer« dient als natürliche geschlechtsübergreifende Form; konfessionell festgelegte Deutungen werden vermieden.
