id: REV.22.5
reference: Revelation 22:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: de
  text: Und Nacht wird es nicht mehr geben. Sie werden weder das Licht einer Lampe noch das Licht der Sonne brauchen, denn Gott, der Herr, wird auf sie leuchten. Und sie werden für immer und ewig herrschen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Zeitalter der Zeitalter“; eine nachdrückliche Wendung für unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: Nacht wird es nicht mehr geben
  rationale: Gibt die Beendigung beziehungsweise das völlige Ausbleiben der Nacht natürlich, klar und in einem der Vision angemessenen feierlichen Ton wieder.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: sie werden … nicht brauchen
  rationale: Das griechische Präsens steht innerhalb einer Zukunftsschilderung zwischen ausdrücklichen Futurformen. Das deutsche Futur stellt den zeitlichen Zusammenhang klar dar, ohne den Sinn zu verändern.
- source_word: φωτὸς λύχνου
  choice: das Licht einer Lampe
  rationale: Die Genitivverbindung wird transparent und genauer als mit dem im Deutschen weniger natürlichen Kompositum „Lampenlicht“ wiedergegeben.
- source_word: φῶς ἡλίου
  choice: das Licht der Sonne
  rationale: Die formnahe Wendung ist natürliches modernes Deutsch und bildet eine klare Parallele zu „das Licht einer Lampe“.
- source_word: κύριος ὁ θεός
  choice: Gott, der Herr
  rationale: Diese im Deutschen natürliche Gottesbezeichnung bewahrt beide griechischen Titel und ihren bestimmten Charakter.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: wird über ihnen leuchten
  rationale: Bewahrt das Lichtmotiv und die durch ἐπί ausgedrückte Ausrichtung auf die Menschen, ohne eine zusätzliche Lichtquelle oder Wirkung einzutragen.
- source_word: βασιλεύσουσιν
  choice: sie werden … herrschen
  rationale: „Herrschen“ gibt das königliche Regieren des Verbs wieder, ohne die Subjekte ausdrücklich „Könige“ zu nennen.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: für immer und ewig
  rationale: Die geläufige deutsche Ewigkeitsformel gibt die emphatische, unbegrenzte Dauer idiomatisch wieder; die wörtlichere Gestalt wird in der Fußnote genannt.
theological_decisions:
- issue: Zeitbezug von οὐκ ἔχουσιν χρείαν
  choice: 'Futurisch: „Sie werden … nicht brauchen“'
  alternative: 'Präsentisch: „Sie brauchen … nicht“'
  rationale: Obwohl die Verbform Präsens ist, beschreibt der Kontext den künftigen Vollendungszustand und verwendet unmittelbar Futurformen. Das deutsche Futur erhält diesen Zusammenhang.
- issue: Bezeichnung κύριος ὁ θεός
  choice: „Gott, der Herr“
  alternative: „der Herr, Gott“ oder „der Herr, der Gott“
  rationale: „Gott, der Herr“ ist idiomatisches, würdevolles Deutsch und gibt sowohl κύριος als auch θεός wieder, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Art der Herrschaft in βασιλεύσουσιν
  choice: „herrschen“
  alternative: „als Könige regieren“
  rationale: Die knappere Wiedergabe wahrt die Aussage königlicher Herrschaft, ohne über das griechische Verb hinaus eine ausdrückliche Amtsbezeichnung einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem, aber nicht altertümlichem Klang. Die Satzglieder bleiben eng an der griechischen Abfolge; die wiederholten Verbindungen mit „und“ werden teilweise durch Satzgrenzen gegliedert, um im Deutschen klar und natürlich zu klingen.
