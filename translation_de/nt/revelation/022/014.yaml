id: REV.22.14
reference: Revelation 22:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: de
  text: Selig sind die, die ihre Gewänder waschen[a][b], damit sie das Recht auf den Baum des Lebens haben und durch die Tore[c] in die Stadt eintreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Handschriften lesen statt „die ihre Gewänder waschen“: „die seine Gebote tun“ beziehungsweise „die seine Gebote halten“.'
    reason: textual_variant
  - marker: b
    text: Das Bild vom Waschen der Gewänder erinnert an Offenbarung 7,14; dort werden die Gewänder im Blut des Lammes gewaschen und weiß gemacht.
    reason: cross_reference
  - marker: c
    text: 'Der griechische Dativ kann auch ortsbezogen verstanden werden, etwa: „bei den Toren“. Im Zusammenhang bezeichnet er wahrscheinlich den Weg des Eintritts: „durch die Tore“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Selig
  rationale: Die geläufige Wiedergabe in Seligpreisungen bewahrt den heilsgeschichtlichen und eschatologischen Gehalt besser als das stärker subjektive „glücklich“.
- source_word: πλύνοντες
  choice: die … waschen
  rationale: Das Präsenspartizip kennzeichnet diese Menschen durch das Waschen ihrer Gewänder; der deutsche Relativsatz gibt dies natürlich und konkret wieder.
- source_word: στολὰς
  choice: Gewänder
  rationale: „Gewänder“ passt zu der visionären Kleidungssymbolik der Offenbarung und ist im modernen Deutschen natürlicher und weiter gefasst als „Roben“.
- source_word: ἵνα
  choice: damit
  rationale: „Damit“ gibt die Zweck- beziehungsweise Folgebeziehung der beiden anschließenden Aussagen klar wieder.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: sie das Recht … haben
  rationale: Die griechische Konstruktion bezeichnet hier eine rechtmäßige Zugangsmöglichkeit, nicht Herrschaftsmacht; die deutsche Umformung ist idiomatisch.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: auf den Baum des Lebens
  rationale: In Verbindung mit ἐξουσία bezeichnet ἐπί das Recht in Bezug auf den Baum; „Recht auf“ bewahrt dies, ohne eine Herrschaft über den Baum anzudeuten.
- source_word: τοῖς πυλῶσιν
  choice: durch die Tore
  rationale: Der präpositionslose Dativ lässt sich hier am natürlichsten instrumental beziehungsweise als Weg des Eintritts verstehen.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: in die Stadt hineingehen können
  rationale: Die Form steht zusammen mit ἔσται unter ἵνα. „Hineingehen können“ gibt den ermöglichten Eintritt natürlich wieder und vermeidet eine unnötig verwaltungssprachliche Formulierung.
theological_decisions:
- issue: Textvariante im ersten Satzteil
  choice: Der SBLGNT-Lesart „die ihre Gewänder waschen“ folgen.
  alternative: „die seine Gebote tun“ beziehungsweise „die seine Gebote halten“
  rationale: Der vorgegebene griechische Ausgangstext liest πλύνοντες τὰς στολὰς αὐτῶν. Die bedeutende abweichende Überlieferung wird wegen ihrer Wirkungsgeschichte und theologischen Tragweite in einer Fußnote dokumentiert.
- issue: Verhältnis zwischen dem Waschen der Gewänder und dem Zugang zum Leben
  choice: Die im Vers ausgesagte Verbindung stehen lassen, ohne ihren theologischen Mechanismus näher zu bestimmen.
  alternative: Das Waschen ausdrücklich als verdienstliches menschliches Werk deuten oder bereits im Haupttext mit dem Blut des Lammes erklären.
  rationale: Der Vers selbst nennt das Waschen der Gewänder und das Recht auf den Baum des Lebens, erläutert aber an dieser Stelle nicht, wie das Waschen geschieht. Die Verbindung zu Offenbarung 7,14 wird deshalb nur in der Fußnote aufgezeigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Selig“ bewahrt den Ton einer biblischen Seligpreisung; „Gewänder“ hält die Bildsprache verständlich. Der Satzbau bleibt nahe an der griechischen Zweckkonstruktion, ohne im Deutschen steif zu wirken.
