- from: Selig sind, die ihre Gewänder waschen[a][b], damit sie das Recht auf den Baum des Lebens haben und durch die Tore[c] in die Stadt hineingehen können.
  to: Selig sind die, die ihre Gewänder waschen[a][b], damit sie das Recht auf den Baum des Lebens haben und durch die Tore[c] in die Stadt eintreten.
  rationale: Die Revision glättet den deutschen Satzbau und entfernt mit „können“ eine nicht ausdrücklich im griechischen Verb enthaltene Modalnuance. Sie bewahrt die Zweck-/Folgebeziehung von ἵνα, die Zugangsnuance von ἐξουσία sowie die bildhafte und eschatologische Sprache des Verses. Textvariante und Querverweis bleiben vollständig erhalten.
