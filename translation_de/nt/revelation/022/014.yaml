review_pass:
  verdict: revise
  source_fidelity: 'Der Hauptsinn folgt dem SBLGNT zuverlässig: Diejenigen, die ihre Gewänder waschen, erhalten Zugang zum Baum des Lebens und Eintritt in die Stadt. Die Lesart der bedeutenden Textvariante ist korrekt in der Fußnote ausgewiesen. Die Formulierung „hineingehen können“ fügt jedoch gegenüber εἰσέλθωσιν unnötig die Nuance bloßer Fähigkeit hinzu; „eintreten“ gibt den Eintritt selbst präziser wieder.'
  naturalness: „Selig sind, die“ ist als traditionelle Bibelsprache verständlich, doch „Selig sind die, die“ ist im modernen Standarddeutsch syntaktisch klarer und ebenso würdevoll. „In die Stadt eintreten“ ist idiomatischer und gehobener als „in die Stadt hineingehen können“.
  terminology: „Selig“, „Gewänder“, „Recht auf den Baum des Lebens“ und „Tore“ sind treffend und registergerecht. Die Variante „seine Gebote tun/halten“ wird neutral und ohne theologische Auslegung wiedergegeben. Die Anmerkung zu den Toren sollte die mögliche ortsbezogene Nuance als Alternative kennzeichnen, ohne die im Haupttext gut begründete Wiedergabe „durch die Tore“ zu relativieren.
  issues:
  - severity: low
    issue: Subjektanschluss und Kommasetzung in „Selig sind, die …“
    rationale: Die traditionelle Form ist möglich, wirkt im angestrebten modernen Standarddeutsch aber weniger klar. „Selig sind die, die …“ bildet die substantivierte Partizipialgruppe transparent ab.
  - severity: medium
    issue: „… hineingehen können“ für εἰσέλθωσιν
    rationale: Das Modalverb kann die Aussage auf Fähigkeit oder Erlaubnis verengen. Der griechische ἵνα-Satz nennt den vorgesehenen Eintritt; „eintreten“ bewahrt dies ohne zusätzliche Modalnuance.
  - severity: low
    issue: Fußnote c ist unnötig umständlich formuliert
    rationale: Die Dativform erlaubt eine ortsbezogene Auffassung, während der Kontext die Wiedergabe als Weg des Eintritts stützt. Eine kürzere Anmerkung stellt diese Möglichkeit klarer dar.
