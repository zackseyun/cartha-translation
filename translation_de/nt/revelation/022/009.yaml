  naturalness: „Mitsklave“ ist als bewusst markierte, aber verständliche Wiedergabe vertretbar. Die Genitivellipse „Ich bin dein Mitsklave und der deiner Brüder“ wirkt dagegen syntaktisch spröde; „wie du und deine Brüder“ ist modernes Standarddeutsch und drückt den gemeinsamen Unterordnungsstatus klar aus.
  terminology: „Mitsklave“ bewahrt die soziale Aussage von σύνδουλος besser als „Mitdiener“. „Bete Gott an!“ trifft προσκύνησον im vorliegenden Kontext genau. „Sich an die Worte dieses Buches halten“ gibt τηρεῖν idiomatisch als treues Befolgen/Bewahren wieder.
