revisions:
- from: 'Und er sagt zu mir: »Tu das nicht![a] Ich bin dein Mitsklave[b] und der deiner Brüder, der Propheten, und derer, die an den Worten dieses Buches festhalten. Bete Gott an!«[c]'
  to: 'Und er sagt zu mir: »Tu das nicht![a] Ich bin ein Mitsklave wie du und deine Brüder, die Propheten, und wie die, die sich an die Worte dieses Buches halten. Bete Gott an!«[c]'
  rationale: Die Übersetzung wird ausschließlich zur Verbesserung der deutschen Satzfügung überarbeitet. Die Apposition „deine Brüder, die Propheten“ bleibt erhalten und legt nicht über den griechischen Wortlaut hinaus fest, ob weitere Gruppen gemeint sein könnten. Die vorhandene Fußnote b ist inhaltlich zutreffend, hat aber im Entwurf keinen Anker; da sie die gewählte Wiedergabe von σύνδουλος erläutert, sollte sie an „Mitsklave“ stehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:07Z'
