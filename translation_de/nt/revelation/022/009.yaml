id: REV.22.9
reference: Revelation 22:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: de
  text: 'Und er sagt zu mir: »Tu das nicht![a] Ich bin ein Mitsklave wie du und deine Brüder, die Propheten, und wie die, die sich an die Worte dieses Buches halten. Bete Gott an!«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Sieh zu: nicht!« Das griechische Verbot ist verkürzt; gemeint ist, dass Johannes den Engel nicht anbeten soll.'
    reason: lexical_alternative
  - marker: c
    text: 'Vergleiche Offenbarung 19,10, wo der Engel dieselbe Zurechtweisung ausspricht: »Bete Gott an!«'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Tu das nicht!
  rationale: Die im Griechischen verkürzte, eindringliche Warnung bezieht sich im Zusammenhang auf den Versuch des Johannes, den Engel anzubeten. Die deutsche Fassung ergänzt die gemeinte Handlung idiomatisch, ohne den Sinn zu erweitern.
- source_word: σύνδουλός
  choice: Mitsklave
  rationale: Das Wort bezeichnet jemanden, der mit anderen denselben Sklavenstand unter einem Herrn teilt. »Mitsklave« bewahrt hier die entscheidende Aussage, dass der Engel ebenso wie Johannes Gott untergeordnet und daher kein Gegenstand der Anbetung ist.
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: deiner Brüder, der Propheten
  rationale: Die zweite Genitivgruppe erläutert wahrscheinlich appositionell, wer mit den »Brüdern« gemeint ist. Die Wiedergabe lässt diese enge Zuordnung erkennen, ohne sie durch einen Relativsatz stärker festzulegen.
- source_word: τηρούντων
  choice: an … festhalten
  rationale: τηρέω umfasst hier treues Bewahren und Befolgen. »An den Worten … festhalten« verbindet beide Aspekte natürlicher als das im heutigen Deutsch missverständliche »die Worte halten«.
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: die Worte dieses Buches
  rationale: Die direkte Wiedergabe erhält den Bezug auf den Wortlaut beziehungsweise Inhalt der prophetischen Schrift und die wiederkehrende Ausdrucksweise der Offenbarung.
- source_word: τῷ θεῷ προσκύνησον
  choice: Bete Gott an!
  rationale: προσκυνέω bezeichnet hier angesichts der versuchten Verehrung des Engels eindeutig anbetende Huldigung. Der knappe Imperativ erhält den Nachdruck des Originals.
theological_decisions:
- issue: Wiedergabe der Sklavensprache in σύνδουλος
  choice: Mitsklave
  alternative: Mitknecht; Mitdiener
  rationale: Der Engel weist die Anbetung zurück, indem er seinen gemeinsamen Status mit Johannes unter Gottes Herrschaft betont. »Mitsklave« erhält diese theologisch wichtige Unterordnung; »Mitknecht« wäre altertümlich und »Mitdiener« würde den Status abschwächen.
- issue: Ergänzung der ausgelassenen Handlung in Ὅρα μή
  choice: Tu das nicht!
  alternative: Sieh zu, dass nicht …; Nicht doch!
  rationale: Das griechische Verbot ist elliptisch. Der unmittelbare Zusammenhang macht klar, dass Johannes den Engel nicht anbeten soll. Die Ergänzung schafft im Deutschen Klarheit, ohne eine zusätzliche theologische Festlegung einzuführen.
- issue: Verhältnis von »Brüdern« und »Propheten«
  choice: 'Appositionell: »deiner Brüder, der Propheten«'
  alternative: 'Als getrennte Gruppen oder als Relativsatz: »deiner Brüder, die Propheten sind«'
  rationale: Die Wortstellung legt nahe, dass »die Propheten« die Brüder näher bestimmt. Die appositionelle Form bewahrt zugleich die knappe griechische Struktur und vermeidet eine unnötig ausschließende Ausdeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der ungewöhnliche, aber verständliche Ausdruck »Mitsklave« wurde bewusst beibehalten, um die soziale und theologische Schärfe von σύνδουλος nicht durch das altertümliche »Mitknecht« oder das mildere »Mitdiener« abzuschwächen. Die Genitivkette ist eng am griechischen Satzbau gehalten, bleibt jedoch im Deutschen lesbar.
