id: REV.22.1
reference: Revelation 22:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: de
  text: Und er zeigte mir einen Strom von Wasser des Lebens, strahlend wie Kristall, der vom Thron Gottes und des Lammes hervorströmte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: er zeigte mir
  rationale: Die schlichte Wiedergabe bewahrt die visionäre Szene und gibt den Dativ als indirektes Objekt wieder.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: einen Strom mit dem Wasser des Lebens
  rationale: „Strom“ entspricht ποταμός in diesem Bild gut. Das deutsche „mit“ gibt die nähere Bestimmung durch den Genitiv idiomatisch wieder, ohne „Wasser des Lebens“ als lebensspendendes oder lebendiges Wasser auszudeuten.
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: strahlend wie Kristall
  rationale: λαμπρός bezeichnet vor allem Helligkeit oder Glanz; „strahlend“ vermeidet die nur aus dem Vergleich erschlossene Bedeutung „klar“. ὡς wird natürlich vergleichend mit „wie“ wiedergegeben.
- source_word: ἐκπορευόμενον
  choice: der … ausging
  rationale: Das Partizip beschreibt den Ursprung beziehungsweise das Hervorkommen des Stroms. „Ausging“ ist würdig und idiomatisch; „floss“ wäre anschaulicher, würde aber die lexikalische Bedeutung stärker an das Substantiv „Strom“ anpassen.
- source_word: ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: vom Thron Gottes und des Lammes
  rationale: Die Einzahl „Thron“ und die beiden koordinierten Genitive werden unmittelbar bewahrt. „Vom“ gibt den Ausgangspunkt natürlich wieder.
theological_decisions:
- issue: Gemeinsamer Thron Gottes und des Lammes
  choice: vom Thron Gottes und des Lammes
  alternative: von den Thronen Gottes und des Lammes
  rationale: Der griechische Text hat „Thron“ im Singular mit zwei koordinierten Genitiven. Die Übersetzung erhält diese theologisch bedeutsame Spannung, ohne sie durch eine Erklärung zu erweitern oder durch einen Plural aufzulösen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit gut verständlichem Satzbau. „Das Lamm“ bleibt als etablierter christologischer Titel erhalten. Keine Fußnote ist nötig, da die sinnvollen Alternativen den Aussagegehalt hier nicht wesentlich verändern.
