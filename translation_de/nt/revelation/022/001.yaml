revisions:
- from: Und er zeigte mir einen Strom mit dem Wasser des Lebens, strahlend wie Kristall, der vom Thron Gottes und des Lammes ausging.
  to: Und er zeigte mir einen Strom von Wasser des Lebens, strahlend wie Kristall, der vom Thron Gottes und des Lammes hervorströmte.
  rationale: Die Revision stellt die genitivische Verbindung „Wasser des Lebens“ präziser dar und gibt das Hervorkommen des Stroms als gegenwärtige Bewegung im visionären Bild wieder. Der gemeinsame Thron Gottes und des Lammes bleibt unverändert im Singular. Fußnoten sind für diesen Vers nicht erforderlich.
