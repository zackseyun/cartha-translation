review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: ein einzelner Strom, dessen Ursprung der eine Thron Gottes und des Lammes ist. „Mit dem Wasser des Lebens“ schwächt jedoch die genitivische Bestimmung ab und legt zudem ein im Griechischen nicht markiertes bestimmtes „dem“ nahe. „Ausging“ kann zwar Ursprung ausdrücken, bildet die für einen Strom anschauliche fortdauernde Bewegung von ἐκπορευόμενον weniger genau ab.'
  naturalness: Der Satz ist gut verständlich und im gehobenen modernen Standarddeutsch natürlich. „Strom von Wasser des Lebens“ und „hervorströmte“ sind ebenfalls idiomatisch und bilden die Bildsprache präziser ab.
  terminology: „Thron Gottes und des Lammes“ bewahrt korrekt den Singular des griechischen θρόνου und die koordinierten Genitive. „Das Lamm“ ist als etablierter Titel angemessen. „Strahlend wie Kristall“ gibt λαμπρὸν ὡς κρύσταλλον ohne unzulässige Einengung auf Transparenz wieder.
  issues:
  - severity: medium
    issue: „mit dem Wasser des Lebens“ statt einer genitivnahen Bestimmung
    rationale: Das griechische ποταμὸν ὕδατος ζωῆς bezeichnet einen Strom, der als „Wasser des Lebens“ qualifiziert ist. Die Konstruktion „mit dem Wasser“ kann dagegen einen Strom nahelegen, der dieses bereits bestimmte Wasser lediglich bei sich führt. „von Wasser des Lebens“ erhält die Beziehung genauer und bleibt modernes Deutsch.
  - severity: low
    issue: „der ... ausging“ für ἐκπορευόμενον
    rationale: Bei einem Strom ist „hervorströmte“ die natürlichere und bildlich präzisere Wiedergabe des Partizips. Es bewahrt sowohl die Bewegung als auch den Ursprung am Thron.
  revised_text: Und er zeigte mir einen Strom von Wasser des Lebens, strahlend wie Kristall, der vom Thron Gottes und des Lammes hervorströmte.
  revised_footnotes: []
  revision_rationale: Die Revision stellt die genitivische Verbindung „Wasser des Lebens“ präziser dar und gibt das Hervorkommen des Stroms als gegenwärtige Bewegung im visionären Bild wieder. Der gemeinsame Thron Gottes und des Lammes bleibt unverändert im Singular. Fußnoten sind für diesen Vers nicht erforderlich.
