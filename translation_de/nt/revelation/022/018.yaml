id: REV.22.18
reference: Revelation 22:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: de
  text: 'Ich bezeuge jedem, der die Worte der Prophetie dieses Buches[a] hört: Wenn jemand ihnen etwas hinzufügt, wird Gott ihm die Plagen hinzufügen, die in diesem Buch geschrieben stehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieser Buchrolle«; das griechische Wort kann die antike Schriftrolle bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Ich bezeuge
  rationale: Bewahrt den feierlichen Zeugnischarakter von μαρτυρέω; die Warnung ergibt sich aus dem folgenden Inhalt, ohne in das Verb hineingelesen zu werden.
- source_word: παντὶ τῷ ἀκούοντι
  choice: jedem, der ... hört
  rationale: Natürliche deutsche Wiedergabe der substantivierten Präsenspartizipialkonstruktion.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: die Worte der Prophetie
  rationale: Gibt λόγοι konkret als sprachlichen Inhalt und προφητεία als prophetische Offenbarungsrede wieder, ohne sie auf Vorhersage zu verengen.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: dieses Buches / in diesem Buch
  rationale: „Buch“ ist im heutigen Deutsch natürlich und bezeichnet den literarischen Text; die mögliche historische Wiedergabe „Buchrolle“ wird in einer Fußnote genannt.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: Wenn jemand ihnen etwas hinzufügt
  rationale: ἐπιτίθημι mit ἐπί bezeichnet hier das Hinzufügen. „Etwas“ ist im Deutschen zur idiomatischen und eindeutigen Formulierung sinnvoll.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: wird Gott ihm ... hinzufügen
  rationale: Die Wiederholung von „hinzufügen“ bewahrt das absichtliche Wortspiel und die vergeltende Entsprechung des griechischen Textes.
- source_word: τὰς πληγὰς
  choice: die Plagen
  rationale: „Plagen“ entspricht dem in der Offenbarung üblichen Gerichtssinn von πληγαί und bewahrt die innerbuchlichen Bezüge.
- source_word: τὰς γεγραμμένας
  choice: die ... geschrieben stehen
  rationale: 'Die Formulierung gibt den resultativen Sinn des Perfektpartizips wieder: Die Plagen sind niedergeschrieben und stehen weiterhin im Text.'
theological_decisions:
- issue: Zeugnisformel oder ausdrückliche Warnformel
  choice: Ich bezeuge
  alternative: Ich warne
  rationale: Das griechische Verb gehört zur Zeugnissprache. Der warnende Charakter ist eindeutig, soll aber aus dem Bedingungs- und Gerichtssatz hervorgehen und nicht das Verb interpretierend ersetzen.
- issue: Vergeltende Entsprechung zwischen menschlichem und göttlichem Handeln
  choice: „hinzufügt“ in beiden Satzteilen
  alternative: „hinzufügt“ / „auferlegen“
  rationale: 'Die identische Wiedergabe erhält die rhetorische und theologische Spannung: Wer dem Text hinzufügt, dem fügt Gott die darin verzeichneten Plagen hinzu.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt eng am griechischen Satzbau, ist jedoch idiomatisch. „Prophetie“ bewahrt die literarisch-theologische Kategorie; „geschrieben stehen“ klingt im Deutschen natürlich und bildet den fortdauernden Zustand des Geschriebenen ab.
