id: REV.22.3
reference: Revelation 22:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: de
  text: Und nichts Verfluchtes wird es mehr geben.[a] Der Thron Gottes und des Lammes wird in ihr sein, und seine Sklaven[b] werden ihm dienen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Keinen Fluch wird es mehr geben“; auch: „nichts dem Fluch Geweihtes“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Diener“. Im Griechischen stehen ein Thron für Gott und das Lamm sowie die singularischen Bezüge in „seine“ und „ihm“. Dadurch bleiben die Unterscheidung zwischen Gott und dem Lamm und ihre gemeinsame Herrschaft nebeneinander bestehen.'
    reason: lexical_and_theological_clarification
  - marker: c
    text: 'Oder: „werden ihm heiligen Dienst erweisen“ beziehungsweise „werden ihn anbeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: nichts Verfluchtes
  rationale: Die substantivierte Form gibt den umfassenden Sinn des griechischen Neutrums natürlich wieder und lässt κατάθεμα konkret als etwas unter dem Fluch Stehendes verstehen. Die mögliche abstrakte Wiedergabe „kein Fluch“ wird in einer Fußnote bewahrt.
- source_word: οὐκ ἔσται ἔτι
  choice: wird es nicht mehr geben
  rationale: Diese idiomatische deutsche Existenzkonstruktion bewahrt Futur und ἔτι („nicht mehr“).
- source_word: ὁ θρόνος
  choice: der Thron
  rationale: Die übliche Wiedergabe erhält bewusst den grammatisch und theologisch bedeutsamen Singular.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: Gottes und des Lammes
  rationale: Beide Genitive werden ausdrücklich beibehalten; „Lamm“ bewahrt das für die Offenbarung charakteristische Opfer- und Messiasbild.
- source_word: ἐν αὐτῇ
  choice: in ihr
  rationale: Das feminine Pronomen verweist auf die Stadt beziehungsweise das neue Jerusalem. Das deutsche Femininum bewahrt den Rückbezug ohne erklärende Ergänzung.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: seine Sklaven
  rationale: „Sklaven“ gibt die rechtliche und personale Zugehörigkeit von δοῦλοι deutlicher wieder als das allgemeinere „Diener“; eine weniger harte deutsche Alternative wird in der Fußnote genannt. Das singularische Possessivpronomen bleibt erhalten.
- source_word: λατρεύσουσιν αὐτῷ
  choice: werden ihm dienen
  rationale: Im Thron- und Heiligtumskontext bezeichnet λατρεύω einen auf Gott gerichteten kultischen Dienst. „Ihm dienen“ ist natürliches, würdevolles Deutsch und bewahrt den singularischen Bezug; die ausdrücklicher kultische Alternative steht in der Fußnote.
theological_decisions:
- issue: Ein singularischer Thron mit den Genitiven „Gottes und des Lammes“ sowie singularischen Pronomen
  choice: 'Die Singularformen bleiben erhalten: „der Thron … seine Sklaven werden ihm dienen“'
  alternative: Pluralische Pronomen („ihre … ihnen“) oder eine auflösende Umschreibung
  rationale: Der griechische Text verbindet die Unterscheidung zwischen Gott und dem Lamm mit einem einzigen Thron und singularischen Pronomen. Die Übersetzung bewahrt diese Spannung, ohne sie dogmatisch zu erklären oder grammatisch einzuebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem feierlichen Stil der Vision. „Sklaven“ ist bewusst quellennah und markiert uneingeschränkte Zugehörigkeit; „dienen“ klingt im Deutschen natürlicher als eine schwerfällige kultische Umschreibung, deren Sinn durch die Fußnote abgesichert wird.
