  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: de
  text: 'der fünfte: Sardonyx; der sechste: Karneol[a]; der siebte: Chrysolith; der achte: Beryll; der neunte: Topas; der zehnte: Chrysopras; der elfte: Hyazinth[b]; der zwölfte: Amethyst.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung antiker Edelsteine ist teilweise unsicher; σάρδιον wird auch mit »Sarder« wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist der Edelstein Hyazinth, nicht die gleichnamige Blume.
    reason: lexical_clarification
lexical_decisions:
- source_word: σαρδόνυξ
  choice: Sardonyx
  rationale: Der etablierte deutsche Edelsteinname gibt den griechischen Begriff knapp wieder und hält ihn von σάρδιον unterschieden.
- source_word: σάρδιον
  choice: Karneol
  rationale: Karneol ist die heute geläufige deutsche Bezeichnung für den wahrscheinlich gemeinten rötlichen Schmuckstein; die genaue Bestimmung antiker Edelsteinnamen bleibt jedoch unsicher.
- source_word: χρυσόλιθος
  choice: Chrysolith
  rationale: Der traditionelle deutsche Edelsteinname bewahrt die Form des griechischen Ausdrucks, dessen antike mineralogische Zuordnung nicht völlig sicher ist.
- source_word: βήρυλλος
  choice: Beryll
  rationale: Beryll ist die direkte und geläufige deutsche Entsprechung.
- source_word: τοπάζιον
  choice: Topas
  rationale: Topas ist die übliche deutsche Entsprechung, ohne eine übermäßig genaue moderne mineralogische Identifizierung zu behaupten.
- source_word: χρυσόπρασος
  choice: Chrysopras
  rationale: Chrysopras ist der etablierte deutsche Edelsteinname; eine etymologische Wiedergabe wäre unverständlich.
- source_word: ὑάκινθος
  choice: Hyazinth
  rationale: Hyazinth ist die traditionelle deutsche Bezeichnung des hier gemeinten Schmucksteins; eine Fußnote verhindert die Verwechslung mit der Blume.
- source_word: ἀμέθυστος
  choice: Amethyst
  rationale: Amethyst ist die direkte und allgemein verständliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Die wiederholte Aufzählungsstruktur des Griechischen bleibt erhalten. Das ergänzte »aus« macht im Deutschen natürlich deutlich, dass die im Zusammenhang genannten Grundsteine aus den jeweiligen Edelsteinen bestehen. Die Sprache ist modern, würdevoll und gut verständlich.
