source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: de
  text: Und die Völker werden in ihrem Licht[a] gehen, und die Könige der Erde werden ihre Herrlichkeit[b] in sie hineinbringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihr Licht“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihren Glanz“ oder „ihre Ehre“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: werden … gehen
  rationale: Die konkrete Bewegungsvorstellung bleibt erhalten; das heute altertümlich wirkende „wandeln“ wird vermieden.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Die Wendung bezeichnet hier die Völker der Welt und bewahrt den Bezug zur prophetischen Bildwelt des Alten Testaments besser als „die Heiden“.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: bei ihrem Licht
  rationale: διά mit dem Genitiv bezeichnet hier am ehesten das Mittel, durch das die Völker gehen. „Bei ihrem Licht“ ist dafür eine natürliche deutsche Wendung; „durch ihr Licht“ bleibt als engere formale Alternative in der Fußnote erhalten.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: die Könige der Erde
  rationale: Dies entspricht der wiederkehrenden apokalyptischen Bezeichnung für die irdischen Herrscher in der Offenbarung.
- source_word: φέρουσιν
  choice: werden … hineinbringen
  rationale: Das griechische Präsens kann in der Vision lebhaft wirken; im Anschluss an das Futur περιπατήσουσιν gibt das deutsche Futur den auf die kommende Stadt bezogenen Sinn klar und flüssig wieder. „Hineinbringen“ bewahrt zugleich die Richtung von εἰς.
- source_word: τὴν δόξαν αὐτῶν
  choice: ihre Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt die breite Bedeutung von δόξα sowie den biblisch-prophetischen Nachklang; je nach Akzent sind auch Glanz oder Ehre gemeint.
- source_word: εἰς αὐτήν
  choice: in sie hinein
  rationale: Das Pronomen bezieht sich auf die Stadt. Da „Stadt“ auch im Deutschen feminin ist, ist „sie“ zugleich grammatisch natürlich und erhält die mögliche Personifikation, ohne sie zu verstärken.
theological_decisions:
- issue: Bezug und mögliche Personifikation des femininen Pronomens für das neue Jerusalem
  choice: „ihrem“ und „in sie hinein“ mit Bezug auf die Stadt
  alternative: Eine ausdrückliche Wiederholung wie „in die Stadt hinein“
  rationale: Die femininen Formen sind im Deutschen wegen des grammatischen Geschlechts von „Stadt“ natürlich. Sie lassen zugleich die Braut- und Stadtbildsprache des Zusammenhangs anklingen, ohne festzulegen, wie stark die Personifikation an dieser Stelle zu gewichten ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gehen“ wahrt das konkrete Bild und vermeidet das heute altertümliche „wandeln“. Die feminine Bezugnahme ist im Deutschen durch „die Stadt“ grammatisch selbstverständlich, sodass dafür keine erklärende Fußnote nötig ist.
