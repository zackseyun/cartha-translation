  source_fidelity: 'Die zentralen Begriffe sind zutreffend wiedergegeben: „Völker“, „Könige der Erde“, „Herrlichkeit“ und die Bewegungsrichtung „in sie hinein“ entsprechen dem griechischen Text. Die Wiedergabe des futurischen Sinns in beiden Teilsätzen ist sachgerecht. „Bei ihrem Licht“ bezeichnet im heutigen Deutsch jedoch eher eine Begleitumstand- oder Ortsnähe und gibt die durch διά τοῦ φωτός ausgedrückte Licht-Sphäre bzw. das Licht als ermöglichendes Mittel weniger genau wieder.'
  naturalness: „In ihrem Licht gehen“ ist im modernen Standarddeutsch idiomatischer und für die Bildsprache klarer als „bei ihrem Licht gehen“. Es bewahrt die konkrete Bewegungsmetapher, ohne auf das heute stärker bibelsprachlich markierte „wandeln“ auszuweichen.
  terminology: „Herrlichkeit“ ist als Wiedergabe von δόξα angemessen und bewahrt den prophetisch-biblischen Resonanzraum; „Glanz“ und „Ehre“ sind sinnvolle Alternativen. Die femininen Pronomen können sich im Deutschen natürlich auf die Stadt beziehen und müssen nicht eigens erläutert werden.
