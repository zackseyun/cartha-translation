id: REV.21.8
reference: Revelation 21:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: de
  text: Doch die Feigen, die Ungläubigen[a], die mit Gräueln Befleckten, die Mörder, die Menschen, die sexuelle Unmoral praktizieren, die Zauberer, die Götzendiener und alle Lügner – ihr Anteil wird in dem See sein, der mit Feuer und Schwefel brennt; das ist der zweite Tod.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Treulosen“ oder „die Untreuen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: die Feigen
  rationale: δειλός bezeichnet hier nicht gewöhnliche Angst, sondern moralisch verwerfliche Feigheit; „die Feigen“ bewahrt diesen starken Sinn.
- source_word: ἀπίστοις
  choice: die Ungläubigen
  rationale: ἄπιστος bezeichnet in dieser Gerichtsliste am naheliegendsten Menschen, die nicht glauben; die ebenfalls mögliche Bedeutung „Treulosen“ wird in einer Fußnote bewahrt.
- source_word: ἐβδελυγμένοις
  choice: die Abscheulichen
  rationale: Das Perfektpartizip beschreibt Menschen, die durch Abscheuliches beziehungsweise Befleckendes gekennzeichnet sind. „Die Abscheulichen“ erhält die personenbezogene Form und die starke Wertung des Ausdrucks.
- source_word: φονεῦσι
  choice: die Mörder
  rationale: φονεύς bedeutet gewöhnlich „Mörder“; das allgemeinere „Totschläger“ oder „Menschen, die töten“ wäre zu weit.
- source_word: πόρνοις
  choice: die sexuell Unmoralischen
  rationale: πόρνος bezeichnet Menschen, die sexuelle Unmoral praktizieren. Die substantivierte Form ist im Deutschen verständlich und bleibt so knapp wie die griechische Aufzählung.
- source_word: φαρμάκοις
  choice: die Zauberer
  rationale: φαρμακός bezeichnet im Kontext der Offenbarung Ausübende von Magie beziehungsweise okkulten Praktiken, nicht Apotheker oder bloß Giftmischer.
- source_word: εἰδωλολάτραις
  choice: die Götzendiener
  rationale: Der Ausdruck bezeichnet unmittelbar Menschen, die Götzen verehren; „Götzendiener“ ist präzise und im biblischen Register geläufig.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: alle Lügner
  rationale: Das substantivierte ψευδής kann einen lügnerischen oder falschen Menschen bezeichnen. „Alle Lügner“ ist in dieser Lasterliste die natürlichste Wiedergabe.
- source_word: τὸ μέρος αὐτῶν
  choice: ihr Anteil ist
  rationale: μέρος bezeichnet hier den ihnen zufallenden Anteil beziehungsweise ihr Geschick. Das Präsens „ist“ gibt die verblos formulierte griechische Aussage zurück, ohne unnötig eine Zukunftsform einzuführen.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: in dem See, der mit Feuer und Schwefel brennt
  rationale: Die attributive Partizipialkonstruktion wird als natürlicher deutscher Relativsatz wiedergegeben; θεῖον ist konkret „Schwefel“.
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: Das ist der zweite Tod
  rationale: Das griechische Relativpronomen ist sächlich und kann sich auf das gesamte vorausgehende Bild beziehungsweise Geschehen beziehen. Ein neuer deutscher Satz gibt die identifizierende Erklärung klar wieder.
theological_decisions:
- issue: Bedeutung von ἄπιστος in der Gerichtsliste
  choice: Ungläubigen
  alternative: Treulosen / Untreuen
  rationale: Im Zusammenhang derer, die vom neuen Jerusalem ausgeschlossen sind, ist „Ungläubigen“ naheliegend. Da ἄπιστος jedoch auch mangelnde Treue bezeichnen kann, wird diese theologisch bedeutsame Mehrdeutigkeit in der Fußnote offengehalten.
- issue: Bezug von ὅ in der Schlussaussage
  choice: Das ist der zweite Tod
  alternative: der der zweite Tod ist
  rationale: Das sächliche ὅ stimmt nicht grammatisch mit dem femininen λίμνη überein und weist daher eher auf den gesamten beschriebenen Sachverhalt als nur auf „den See“. „Das ist“ wahrt diesen weiteren Bezug.
- issue: Charakter der aufgezählten Personenbezeichnungen
  choice: knappe substantivierte Kategorien
  alternative: Umschreibungen wie „Menschen, die … tun“
  rationale: Der griechische Text nennt Personengruppen in einer zugespitzten Gerichtsliste. Die Übersetzung bewahrt diese Form, ohne durch erklärende Umschreibungen Aussagen über einzelne Handlungen oder unveränderliche Identität hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholten Artikel und die Aufzählungsstruktur spiegeln den feierlich-nachdrucksvollen griechischen Stil; der Gedankenstrich macht den Übergang von der Liste zum Urteil lesbar. „Schwefel“ ist die direkte, heute verständliche Wiedergabe und benötigt im Deutschen keine archaische Alternative.
