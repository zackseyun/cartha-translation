  naturalness: „Die sexuell Unmoralischen“ ist im heutigen Standarddeutsch eine wenig idiomatische Substantivierung. Auch „ihr Anteil ist in dem See“ wirkt ohne das im Deutschen erwartbare Zukunfts- bzw. Zuordnungssignal unnötig holprig. Die Revision bewahrt die knappe Listenform, formuliert diese Stellen aber natürlich.
  terminology: „Feigen“, „Ungläubigen“, „Mörder“, „Zauberer“, „Götzendiener“, „Lügner“ und „Schwefel“ sind sachgerecht. Die Fußnote zu ἀπίστοις wahrt die mögliche Bedeutung „treulos/untreu“, ohne sie im Haupttext zu bevorzugen.
