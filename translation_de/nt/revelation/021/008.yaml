    rationale: „ihr Anteil ist in dem See“ ist formal möglich, klingt jedoch im Deutschen unvollständig. „ihr Anteil wird in dem See sein“ macht die zugewiesene eschatologische Bestimmung explizit, ohne den Sinn zu verändern.
