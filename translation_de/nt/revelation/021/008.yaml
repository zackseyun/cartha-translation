- from: Doch die Feigen, die Ungläubigen[a], die Abscheulichen, die Mörder, die sexuell Unmoralischen, die Zauberer, die Götzendiener und alle Lügner – ihr Anteil ist in dem See, der mit Feuer und Schwefel brennt. Das ist der zweite Tod.
  to: Doch die Feigen, die Ungläubigen[a], die mit Gräueln Befleckten, die Mörder, die Menschen, die sexuelle Unmoral praktizieren, die Zauberer, die Götzendiener und alle Lügner – ihr Anteil wird in dem See sein, der mit Feuer und Schwefel brennt; das ist der zweite Tod.
