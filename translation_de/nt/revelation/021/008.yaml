  - severity: medium
    issue: Nuance von ἐβδελυγμένοις abgeschwächt
    rationale: „die Abscheulichen“ ist semantisch möglich, lässt aber die perfektische Vorstellung von durch Gräuel Befleckten bzw. dadurch Gekennzeichneten kaum erkennen. „die mit Gräueln Befleckten“ ist quellenäher und im würdigen Register noch verständlich.
