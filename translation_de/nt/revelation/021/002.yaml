id: REV.21.2
reference: Revelation 21:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: de
  text: Und ich sah die heilige Stadt, das neue Jerusalem, aus dem Himmel von Gott herabkommen, vorbereitet wie eine Braut, die für ihren Mann geschmückt ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: die heilige Stadt
  rationale: Die konkrete Stadtmetaphorik und die theologische Bedeutung von ἁγίαν werden in natürlichem biblischem Deutsch bewahrt.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: das neue Jerusalem
  rationale: Jerusalem bleibt als Name erhalten; καινήν wird beschreibend mit „neue“ wiedergegeben. Der Artikel „das“ entspricht dem deutschen Genus von „Jerusalem“ in dieser appositionellen Verbindung.
- source_word: εἶδον
  choice: ich sah
  rationale: Die schlichte Aoristform wird ohne unnötige Erweiterung direkt wiedergegeben.
- source_word: καταβαίνουσαν
  choice: herabkommen
  rationale: „Herabkommen“ ist gegenwärtiges, natürliches Deutsch und bewahrt die gerichtete Bewegung von oben nach unten.
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: von Gott aus dem Himmel
  rationale: „Aus dem Himmel“ gibt den Ausgangspunkt der Bewegung mit ἐκ wieder; „von Gott“ bezeichnet gemäß ἀπό den Ursprung. Die deutsche Wortfolge bleibt bewusst eng am griechischen Sinn, ohne „aus der Gegenwart Gottes“ hinzuzufügen.
- source_word: ἡτοιμασμένην
  choice: vorbereitet
  rationale: 'Das Perfektpartizip bezeichnet einen hergestellten, fortbestehenden Zustand: Die Stadt ist vorbereitet.'
- source_word: ὡς νύμφην
  choice: wie eine Braut
  rationale: ὡς leitet hier einen Vergleich ein. „Wie“ macht den bildhaften Vergleich im modernen Deutsch klar, ohne die Stadt ausdrücklich mit der Braut gleichzusetzen.
- source_word: κεκοσμημένην
  choice: die … geschmückt ist
  rationale: Die Relativsatzkonstruktion ist im Deutschen flüssiger als zwei aufeinanderfolgende Partizipien und bewahrt zugleich den vollendeten Zustand des griechischen Perfektpartizips.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: für ihren Mann
  rationale: Im Zusammenhang mit einer Braut bezeichnet ἀνήρ natürlicherweise ihren Mann beziehungsweise Ehemann. „Bräutigam“ wäre eine kontextuelle Spezifizierung, verwendet aber nicht das im Griechischen stehende Wort.
theological_decisions:
- issue: Ob „neues Jerusalem“ als feststehender Titel hervorgehoben werden soll
  choice: „das neue Jerusalem“ mit kleingeschriebenem Adjektiv
  alternative: „das Neue Jerusalem“
  rationale: Im Deutschen werden adjektivische Bestandteile geographischer Namen teils großgeschrieben; hier lässt sich καινήν jedoch weiterhin natürlich als beschreibendes Adjektiv verstehen. Die Kleinschreibung vermeidet es, den Ausdruck stärker als formalen Titel festzulegen, als der griechische Wortlaut verlangt.
- issue: Ob die Brautmetaphorik ausdrücklich auf die Gemeinde oder die Frau des Lammes bezogen werden soll
  choice: Der Vergleich bleibt ohne erklärende Identifizierung stehen
  alternative: „vorbereitet als die Gemeinde, die Braut des Lammes“
  rationale: Der Vers formuliert einen Vergleich mit einer geschmückten Braut. Eine ausdrückliche ekklesiologische Deutung würde über den Wortlaut hinausgehen und die im Bild verbleibende Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah an der visionären Bewegung des griechischen Textes, ist aber ohne altertümliche Formulierungen verständlich. Es sind keine Fußnoten nötig, da die relevanten Nuancen im Haupttext angemessen bewahrt werden.
