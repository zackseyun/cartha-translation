id: REV.21.5
reference: Revelation 21:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: de
  text: 'Und der, der auf dem Thron sitzt, sagte: „Siehe, ich mache alles[a] neu.“ Und er sagte: „Schreib, denn diese Worte sind zuverlässig[b] und wahr.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Ich mache alle Dinge neu.“ Das Griechische bezeichnet umfassend „alles“ beziehungsweise „alle Dinge“ und legt nicht fest, ob Ersetzung oder Erneuerung gemeint ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „treu“. In Verbindung mit „Worte“ drückt πιστοί aus, dass auf sie Verlass ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: der, der auf dem Thron sitzt
  rationale: Die substantivierte Präsenspartizipialkonstruktion wird beschreibend und ohne zusätzliche Identifizierung des Sprechers wiedergegeben; das Thronbild und die gegenwärtige Sitzhaltung bleiben erhalten.
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Das feierliche Aufmerksamkeitssignal der apokalyptischen Rede bleibt in einer gehobenen, aber geläufigen biblischen Ausdrucksweise erhalten.
- source_word: καινὰ ποιῶ πάντα
  choice: ich mache alles neu
  rationale: Die deutsche Wortstellung gibt ποιῶ als gegenwärtiges Handeln und πάντα umfassend wieder. „Machen“ vermeidet die nicht ausdrücklich vorhandene Bedeutungsverengung auf „erschaffen“; „neu“ lässt offen, ob Ersetzung oder Erneuerung gemeint ist.
- source_word: λέγει
  choice: er sagt
  rationale: Der Wechsel des griechischen Textes vom Aorist εἶπεν zum Präsens λέγει wird trotz der auffälligen deutschen Tempusfolge bewahrt.
- source_word: Γράψον
  choice: Schreib
  rationale: Der direkte Imperativ wird knapp und natürlich wiedergegeben, ohne ein im Griechischen nicht genanntes Objekt hinzuzufügen.
- source_word: ὅτι
  choice: denn
  rationale: ὅτι begründet hier den Schreibbefehl. „Denn“ stellt diesen Zusammenhang idiomatisch dar und passt zum feierlichen Rederegister.
- source_word: οὗτοι οἱ λόγοι
  choice: diese Worte
  rationale: „Worte“ bezeichnet die soeben mitgeteilten Aussprüche beziehungsweise die Offenbarungsbotschaft, ohne den Ausdruck unnötig einzuengen.
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: zuverlässig und wahr
  rationale: „Zuverlässig“ bezeichnet bei Worten idiomatisch deren Vertrauenswürdigkeit; „wahr“ gibt ἀληθινοί direkt wieder und erhält die zweigliedrige Bekräftigung.
theological_decisions:
- issue: Umfang und Art der endzeitlichen Neuschöpfung beziehungsweise Erneuerung in καινὰ ποιῶ πάντα
  choice: ich mache alles neu
  alternative: ich mache alle Dinge neu
  rationale: Die Formulierung bewahrt den umfassenden Geltungsbereich und legt nicht fest, ob das Bestehende ersetzt oder verwandelt wird. Das Präsens stellt das Handeln als gegenwärtig beziehungsweise wirksam dar, ohne seine zeitliche Reichweite dogmatisch zu bestimmen.
- issue: Identität des göttlichen Sprechers
  choice: der, der auf dem Thron sitzt
  alternative: der auf dem Thron Thronende
  rationale: Der Sprecher wird ausschließlich durch das Thronbild des Verses bezeichnet; eine weitergehende trinitarische oder christologische Identifizierung wird nicht in den Text eingetragen.
- issue: Verlässlichkeit der Offenbarungsworte
  choice: zuverlässig und wahr
  alternative: treu und wahr
  rationale: Die Übersetzung bekräftigt sowohl die Verlässlichkeit als auch die Wahrheit der Worte, ohne πιστοί auf eine besondere konfessionelle Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Ton. „Siehe“ bewahrt den feierlichen Aufmerksamkeitsruf. Der auffällige Wechsel von „sagte“ zu „sagt“ folgt bewusst dem Tempuswechsel im griechischen Text.
