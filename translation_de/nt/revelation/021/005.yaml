  terminology: „Thron“, „alles neu“, „Worte“, „zuverlässig“ und „wahr“ sind sachgerecht und modern verständlich. „Zuverlässig“ ist bei „Worte“ eine natürliche Wiedergabe von πιστοί; die Alternative „treu“ bleibt als Fußnote verfügbar, ohne eine zusätzliche theologische Nuance einzutragen.
