id: REV.21.13
reference: Revelation 21:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: de
  text: An der Ostseite drei Tore und an der Nordseite drei Tore und an der Südseite drei Tore und an der Westseite drei Tore.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: an der Ostseite
  rationale: Die Präpositionalverbindung bezeichnet hier im schematischen Stadtplan die Seite, an der sich die Tore befinden. „An der Ostseite“ ist im Deutschen räumlich eindeutig und vermeidet den Eindruck einer Bewegung oder Herkunft, den das wörtlichere „von Osten“ erwecken könnte.
- source_word: πυλῶνες
  choice: Tore
  rationale: πυλών kann ein Tor, einen Torweg oder eine größere Toranlage bezeichnen. Im Zusammenhang mit der Mauer des neuen Jerusalem ist „Tore“ die klare, natürliche und nicht unnötig spezifizierende Wiedergabe.
- source_word: τρεῖς
  choice: drei
  rationale: Die Grundzahl wird bei jeder Himmelsrichtung wiederholt, um die gemessene Symmetrie des griechischen Textes zu bewahren.
- source_word: ἀπὸ βορρᾶ
  choice: an der Nordseite
  rationale: Die Formulierung bezeichnet die nördliche Seite der Stadt und wird parallel zu den übrigen Richtungsangaben wiedergegeben.
- source_word: ἀπὸ νότου
  choice: an der Südseite
  rationale: Die Formulierung bezeichnet die südliche Seite der Stadt und wahrt die parallele Satzstruktur.
- source_word: ἀπὸ δυσμῶν
  choice: an der Westseite
  rationale: δυσμαί bezeichnet über den Sonnenuntergang die westliche Richtung. „An der Westseite“ gibt die räumliche Bedeutung idiomatisch wieder.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: asyndetische Reihung, abschließendes „und“
  rationale: Im natürlichen modernen Deutsch wirkt ein „und“ vor jedem Glied schwerfällig. Die gleichmäßige Wiederholung von „drei Tore“ und „an der ...seite“ bewahrt dennoch den aufzählenden, symmetrischen Charakter; vor dem letzten Glied steht das übliche abschließende „und“.
theological_decisions:
- issue: Räumliche Beschreibung der Tore des neuen Jerusalem
  choice: Sachliche Aufzählung von jeweils drei Toren an jeder der vier Seiten
  alternative: Ausdrückliche Deutung als Symbol für die Lagerordnung Israels oder für Hesekiels Tempelstadt
  rationale: Der Vers selbst beschreibt zunächst die Anordnung der Tore nach den Himmelsrichtungen. Mögliche kanonische Bezüge und symbolische Bedeutungen werden nicht in die Übersetzung eingetragen, bleiben durch die nüchterne Formulierung aber offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe elliptische Satzform des griechischen Textes wird beibehalten. „Ostseite“, „Nordseite“, „Südseite“ und „Westseite“ sind räumlich klarer als das im Deutschen potenziell mehrdeutige „von Osten“ usw.; eine Fußnote ist dafür nicht erforderlich.
