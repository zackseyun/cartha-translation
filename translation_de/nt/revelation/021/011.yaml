id: REV.21.11
reference: Revelation 21:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: de
  text: Sie hatte die Herrlichkeit Gottes. Ihr Lichtglanz[a] glich einem überaus kostbaren Stein, einem Jaspis, der kristallhell schimmerte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihr Licht“ oder „ihr Leuchten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der wie Kristall funkelte“; auch möglich: „der kristallklar war“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: Sie hatte
  rationale: Das feminine Partizip bezieht sich auf die Stadt im vorhergehenden Vers. Ein selbstständiger deutscher Satz stellt diesen Bezug natürlich her, ohne den Besitz- beziehungsweise Trägergedanken abzuschwächen.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: die Herrlichkeit Gottes
  rationale: „Herrlichkeit“ ist die etablierte, theologisch gewichtige Wiedergabe von δόξα und umfasst hier sowohl Gottes majestätische Gegenwart als auch ihren sichtbaren Glanz.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: ihr Lichtglanz
  rationale: φωστήρ kann einen Lichtträger, ein Licht oder dessen leuchtende Erscheinung bezeichnen. „Lichtglanz“ passt zur Beschreibung der sichtbaren Ausstrahlung der Stadt und bewahrt die Verbindung zum Licht.
- source_word: ὅμοιος λίθῳ τιμιωτάτῳ
  choice: glich einem überaus kostbaren Stein
  rationale: „Glich“ gibt den Vergleich idiomatisch wieder; „überaus kostbar“ bewahrt die superlativische beziehungsweise elativische Kraft von τιμιωτάτῳ.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: einem Jaspis
  rationale: Die Apposition erläutert den zuvor genannten kostbaren Stein. „Jaspis“ ist im Deutschen bereits eine Steinbezeichnung, sodass ein wiederholtes „Stein“ unnötig schwerfällig wäre.
- source_word: κρυσταλλίζοντι
  choice: der kristallhell schimmerte
  rationale: Das Partizip bezeichnet eine kristallartige leuchtende oder klare Beschaffenheit. Die Formulierung wahrt diese Bildoffenheit besser als eine ausschließlich auf Transparenz festgelegte Wiedergabe.
theological_decisions:
- issue: δόξα τοῦ θεοῦ in der apokalyptischen Stadtbeschreibung
  choice: die Herrlichkeit Gottes
  alternative: der Glanz Gottes
  rationale: Die Wendung bezeichnet mehr als einen optischen Effekt; sie trägt die Vorstellung der offenbaren majestätischen Gegenwart Gottes. „Herrlichkeit“ bewahrt dieses theologische Gewicht.
- issue: Bedeutungsumfang von φωστήρ
  choice: Lichtglanz
  alternative: Licht; Leuchten; Lichtträger
  rationale: Der Kontext erlaubt sowohl die Vorstellung des Lichtes als auch seiner strahlenden Erscheinung. „Lichtglanz“ passt zur Edelsteinmetaphorik, ohne die Quelle des Leuchtens eigenmächtig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden griechischen Vergleichsglieder werden flüssig verbunden; die Bildsprache bleibt anschaulich, und die mögliche Bedeutungsbreite von φωστήρ und κρυσταλλίζοντι wird in den Fußnoten offengehalten.
