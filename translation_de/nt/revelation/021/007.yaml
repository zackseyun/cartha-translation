id: REV.21.7
reference: Revelation 21:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: de
  text: Wer überwindet, wird dies alles erben[a], und ich werde sein Gott sein, und er wird mein Sohn sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wer siegt, wird dies erben.“ Das griechische Verb νικάω bezeichnet in der Offenbarung wiederholt das treue Überwinden oder Siegen.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort lautet „Sohn“. Die maskuline Einzahl ist hier wahrscheinlich stellvertretend gemeint; die Übersetzung bewahrt jedoch die Sohnes- und Erbschaftssprache des Ausgangstextes.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Wer überwindet
  rationale: Das substantivierte Präsenspartizip bezeichnet den Menschen, der durch treues Überwinden gekennzeichnet ist. „Wer überwindet“ ist verständlich und bewahrt zugleich den wiederkehrenden Sprachgebrauch der Offenbarung.
- source_word: κληρονομήσει
  choice: wird … erben
  rationale: Die direkte Wiedergabe bewahrt sowohl den Zukunftsbezug als auch die familiären und bundestheologischen Anklänge, die zum anschließenden Vater-Sohn-Verhältnis passen.
- source_word: ταῦτα
  choice: dies alles
  rationale: Der griechische Plural verweist zusammenfassend auf die zuvor geschilderten Verheißungen. „Dies alles“ gibt diesen Rückverweis in natürlichem Deutsch wieder; das explizite „alles“ ist kontextuell, nicht lexikalisch im Demonstrativ enthalten.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: ich werde sein Gott sein
  rationale: Diese idiomatische deutsche Form bewahrt die relationale Kraft der Dativkonstruktion und den Anklang an die biblische Bundesformel.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: er wird mein Sohn sein
  rationale: Die Formulierung gibt die persönliche Sohnesbeziehung natürlich wieder und erhält das Erbschafts- und Kindschaftsmotiv des Ausgangstextes.
- source_word: υἱός
  choice: Sohn
  rationale: „Sohn“ entspricht dem ausdrücklich maskulinen υἱός und bewahrt die familiäre Bildsprache. Die wahrscheinlich repräsentative Geltung wird in einer Fußnote erläutert, statt das Bild im Haupttext zu verallgemeinern.
theological_decisions:
- issue: Maskuline Sohnesbezeichnung in einer allgemein geltenden Verheißung
  choice: „Sohn“ im Haupttext beibehalten
  alternative: „Kind“
  rationale: Der Ausgangstext verwendet ausdrücklich υἱός. Obwohl die Verheißung wahrscheinlich Frauen und Männer einschließt, soll die mit Erbe und Kindschaft verbundene Sohnesmetaphorik nicht eingeebnet werden.
- issue: Anklang an die Bundesformel
  choice: „ich werde sein Gott sein, und er wird mein Sohn sein“
  alternative: „ich werde ihm Gott sein, und er wird mir Sohn sein“
  rationale: Die gewählte Form ist natürliches modernes Deutsch und bewahrt die relationale sowie theologische Spannung des griechischen Satzes, ohne zusätzliche Lehraussagen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Parallelismus, während „dies alles“ den pluralischen Rückverweis idiomatisch zusammenfasst.
