id: REV.21.10
reference: Revelation 21:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: de
  text: Und er trug mich im Geist[a] auf einen großen und hohen Berg und zeigte mir die heilige Stadt Jerusalem, die aus dem Himmel von Gott herabkommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann einen visionären Zustand bezeichnen; in der Offenbarung leitet sie wiederholt prophetische Visionen ein.
    reason: Die Formulierung lässt sowohl den visionären Zustand als auch das Wirken des Geistes anklingen.
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: trug mich
  rationale: Das Verb bezeichnet hier das Forttragen beziehungsweise Versetzen an einen anderen Ort. „Trug mich“ bewahrt die Bewegung und passt zum visionären Zusammenhang.
- source_word: ἐν πνεύματι
  choice: im Geist
  rationale: Die knappe Wendung entspricht dem griechischen Ausdruck und lässt offen, ob besonders das Wirken des Heiligen Geistes oder der visionäre Zustand des Johannes hervorgehoben wird.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: auf einen großen und hohen Berg
  rationale: ἐπί mit Akkusativ bezeichnet hier die Bewegung auf den Berg. Beide Adjektive werden beibehalten, da sie unterschiedliche Eigenschaften benennen.
- source_word: ἔδειξέν μοι
  choice: zeigte mir
  rationale: Dies ist eine direkte und natürliche Wiedergabe, ohne dem Verb eine zusätzliche Deutung aufzuerlegen.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: die heilige Stadt Jerusalem
  rationale: Die deutsche Wortfolge gibt die Bezeichnung der Stadt klar und idiomatisch wieder; „heilig“ bewahrt den biblisch-theologischen Sinn von ἁγίαν.
- source_word: καταβαίνουσαν
  choice: die ... herabkam
  rationale: Der Relativsatz gibt das auf die Stadt bezogene Partizip in natürlichem Deutsch wieder und bewahrt die dargestellte Abwärtsbewegung.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: aus dem Himmel
  rationale: „Aus“ bewahrt die von ἐκ bezeichnete Herkunft aus dem Himmel.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: von Gott
  rationale: Die knappe Formulierung gibt Gott als Ursprung an, ohne den Ausdruck durch Zusätze wie „aus der Gegenwart Gottes“ zu erweitern.
theological_decisions:
- issue: Bezug und Bedeutung von ἐν πνεύματι
  choice: „im Geist“ mit erläuternder Fußnote
  alternative: „durch den Geist“ oder „in einem visionären Zustand“
  rationale: '„Im Geist“ bewahrt die Formulierung und ihre Spannung: In der Offenbarung kennzeichnet sie prophetisches Schauen und kann zugleich auf das Wirken des Heiligen Geistes hinweisen. Eine eindeutig instrumentale oder rein psychologische Wiedergabe würde die Mehrdeutigkeit vorschnell auflösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem fortlaufenden Charakter der Vision, bleibt aber für heutige Leser verständlich. Die beiden Eigenschaften des Berges sowie die doppelte Herkunftsangabe der Stadt werden nicht verkürzt.
