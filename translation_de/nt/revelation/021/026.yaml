id: REV.21.26
reference: Revelation 21:26
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: de
  text: Und sie werden die Herrlichkeit und die Ehre der Völker in sie hineinbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Die Konjunktion verbindet den Satz unmittelbar mit der vorausgehenden Vision.
- source_word: οἴσουσιν
  choice: sie werden … hineinbringen
  rationale: Die Zukunftsform von φέρω bezeichnet hier das Bringen von außen in die Stadt. Die deutsche Verbklammer mit „hineinbringen“ gibt die durch εἰς ausgedrückte Richtung natürlich wieder.
- source_word: τὴν δόξαν
  choice: die Herrlichkeit
  rationale: „Herrlichkeit“ bewahrt sowohl die ehrenvolle als auch die glanzvolle, biblisch geprägte Bedeutung von δόξα.
- source_word: τὴν τιμὴν
  choice: die Ehre
  rationale: „Ehre“ entspricht der Grundbedeutung von τιμή und wahrt neben „Herrlichkeit“ die offene Bildsprache, ohne sie auf Reichtum oder Tribut einzuengen.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: ἔθνη bezeichnet hier die Völker allgemein; „Nationen“ wäre möglich, klingt in diesem visionären Zusammenhang jedoch politischer und weniger natürlich.
- source_word: εἰς αὐτήν
  choice: in sie hinein
  rationale: Das Pronomen bezieht sich auf die Stadt, die auch im Deutschen feminin ist. Daher bewahrt „sie“ zugleich den grammatischen Bezug und die mögliche Personifikation der Stadt.
theological_decisions:
- issue: Bezug und Personifikation von αὐτήν
  choice: „in sie hinein“, bezogen auf die heilige Stadt
  alternative: „in die Stadt hinein“
  rationale: Das feminine Pronomen lässt sich im Deutschen ohne Unnatürlichkeit bewahren, da „Stadt“ ebenfalls feminin ist. Eine ausdrückliche Wiederholung von „Stadt“ würde den griechischen Wortlaut unnötig verdeutlichen.
- issue: Bedeutung von „Herrlichkeit und Ehre der Völker“
  choice: Die breite Formulierung bleibt erhalten.
  alternative: Reichtum, kultureller Glanz oder Tribut der Völker
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob materielle Güter, kulturelle Kostbarkeiten, Ruhm oder erwiesene Ehre gemeint sind. Die Übersetzung vermeidet daher eine eschatologische oder konfessionelle Festlegung.
- issue: Unausgesprochenes Subjekt von οἴσουσιν
  choice: „sie werden“ ohne ausdrückliche Benennung des Subjekts
  alternative: „man wird“ oder „die Könige werden“
  rationale: Die dritte Person Plural steht im Griechischen ohne ausdrücklich genanntes Subjekt. „Sie werden“ bewahrt den möglichen Rückbezug aus dem Kontext, während „man“ die Referenz unpersönlich machen und „die Könige“ sie ausdrücklich festlegen würde.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt knapp und nahe am Griechischen. Eine Fußnote zur femininen Stadtpersonifikation ist im Deutschen nicht erforderlich, weil „Stadt“ grammatisch feminin ist und „sie“ diese Nuance unmittelbar bewahrt.
