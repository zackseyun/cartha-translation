id: REV.21.23
reference: Revelation 21:23
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: de
  text: Und die Stadt braucht weder die Sonne noch den Mond, damit sie auf sie scheinen; denn die Herrlichkeit Gottes hat sie erleuchtet, und ihre Lampe ist das Lamm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλις
  choice: Stadt
  rationale: Die übliche und im Zusammenhang des neuen Jerusalem eindeutige Bedeutung.
- source_word: οὐ χρείαν ἔχει
  choice: braucht weder … noch
  rationale: Gibt die Bedeutung der griechischen Wendung natürlich wieder; mit den beiden folgenden Substantiven ist die deutsche Paarformel „weder … noch“ klar und idiomatisch.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: weder die Sonne noch den Mond
  rationale: Bewahrt die paarige Gegenüberstellung der beiden Himmelskörper in natürlichem modernem Deutsch.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: damit sie über ihr scheinen
  rationale: „scheinen“ wahrt die konkrete Tätigkeit der Himmelskörper und vermeidet eine unnötige Wiederholung von „erleuchten“; „über ihr“ gibt den Dativ räumlich wieder, ohne ihn als bloßes Lichtspenden festzulegen.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Die etablierte, theologisch gewichtige Entsprechung im johanneischen und apokalyptischen Zusammenhang.
- source_word: ἐφώτισεν
  choice: hat sie erleuchtet
  rationale: Gibt den konkreten Vorgang der Erhellung wieder und bildet einen klaren sprachlichen Kontrast zu „scheinen“.
- source_word: λύχνος
  choice: Leuchte
  rationale: Bezeichnet einen Lichtträger und bewahrt das Bild genauer als „Licht“; „Leuchte“ wirkt im Deutschen würdig und weniger alltagssprachlich als „Lampe“.
- source_word: ἀρνίον
  choice: das Lamm
  rationale: In der Offenbarung ist dies die feststehende christologische Bezeichnung; die Großschreibung kennzeichnet den titelartigen Gebrauch.
theological_decisions:
- issue: Bildhafte Beziehung in „ihre Leuchte ist das Lamm“
  choice: Die Metapher wird mit „Leuchte“ unmittelbar beibehalten.
  alternative: „Das Lamm ist ihr Licht“ oder „ihre Leuchte ist das Lamm“ mit erklärender Erweiterung.
  rationale: Der griechische Text verwendet ausdrücklich λύχνος, nicht das allgemeine Wort für Licht. So bleibt die Unterscheidung zwischen Gottes Herrlichkeit, die erleuchtet, und dem Lamm als Leuchte der Stadt erhalten.
- issue: Bild der göttlichen Erleuchtung
  choice: Die Aussage wird ohne zusätzliche endzeitliche Erklärung übersetzt.
  alternative: Eine Erweiterung, wonach Gott alle geschaffenen Lichtquellen ersetzt.
  rationale: Der Vers sagt lediglich, dass die Stadt Sonne und Mond nicht braucht, weil Gottes Herrlichkeit sie erleuchtet und das Lamm ihre Leuchte ist. Weitergehende dogmatische Folgerungen werden nicht in den Text eingetragen.
translation_notes:
  register: Modernes, klares und zugleich würdiges Standarddeutsch. Die Satzstruktur folgt der Gedankenführung des griechischen Textes, ohne im Deutschen unnötig schwerfällig zu wirken. „Leuchte“ wahrt das konkrete Bild und vermeidet die begriffliche Einebnung zu „Licht“.
