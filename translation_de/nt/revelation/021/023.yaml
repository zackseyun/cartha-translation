revisions:
- from: Und die Stadt braucht weder die Sonne noch den Mond, damit sie über ihr scheinen[a]; denn die Herrlichkeit Gottes hat sie erleuchtet, und ihre Leuchte ist das Lamm.
  to: Und die Stadt braucht weder die Sonne noch den Mond, damit sie auf sie scheinen; denn die Herrlichkeit Gottes hat sie erleuchtet, und ihre Lampe ist das Lamm.
  rationale: Die Revision korrigiert die räumlich missverständliche Wiedergabe des Dativs bei φαίνω und ersetzt die fehlerhafte Fußnotenformulierung durch idiomatische deutsche Alternativen. „Lampe“ gibt λύχνος präzise wieder und bewahrt die Metapher des griechischen Textes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem griechischen Satzbau und den Schlüsselbegriffen insgesamt gut: πόλις ist „Stadt“, οὐ χρείαν ἔχει wird idiomatisch mit „braucht weder … noch“ wiedergegeben, δόξα mit „Herrlichkeit“ und ἐφώτισεν mit „hat … erleuchtet“. Die Formulierung „über ihr scheinen“ ist jedoch keine angemessene Wiedergabe des Dativs αὐτῇ: Sie bezeichnet im Deutschen primär eine Position oberhalb der Stadt, nicht das Scheinen auf bzw. für die Stadt. λύχνος bezeichnet konkret eine Lampe; „Lampe“ ist daher präziser als „Leuchte“.'
  naturalness: Mit „auf sie scheinen“ ist der Bezug zur Stadt klar und modernes Standarddeutsch. „Ihre Lampe ist das Lamm“ bewahrt die bildhafte Aussage und klingt zugleich natürlich. Die bisherige Fußnote ist sprachlich missverständlich, weil „für/auf ihr scheinen“ im Deutschen keine passende Alternativformulierung ist.
  terminology: „Herrlichkeit Gottes“ und „das Lamm“ sind angemessene etablierte Wiedergaben. „Lampe“ gibt λύχνος konkreter wieder als „Leuchte“, ohne die Metapher zu einer allgemeinen Aussage über „Licht“ zu glätten.
  issues:
  - severity: medium
    issue: „über ihr scheinen“ für ἵνα φαίνωσιν αὐτῇ
    rationale: „Über ihr“ beschreibt räumlich ein Scheinen oberhalb der Stadt. Der griechische Dativ bezeichnet hier den Bezug der Lichtwirkung zur Stadt; „auf sie scheinen“ oder „ihr leuchten“ trifft dies.
  - severity: medium
    issue: Fußnote mit „für/auf ihr scheinen“
    rationale: Die Formulierung ist im Deutschen grammatisch bzw. idiomatisch nicht tragfähig und stützt die problematische Hauptübersetzung nicht. Die Alternativen müssen als „ihr leuchten“ bzw. „auf sie scheinen“ formuliert werden.
  - severity: low
    issue: „Leuchte“ für λύχνος
    rationale: „Leuchte“ ist möglich, aber weniger konkret. λύχνος ist eine Lampe, nicht Licht im Allgemeinen; „Lampe“ wahrt das Bild in modernem Deutsch genauer.
  revised_text: Und die Stadt braucht weder die Sonne noch den Mond, damit sie auf sie scheinen; denn die Herrlichkeit Gottes hat sie erleuchtet, und ihre Lampe ist das Lamm.
  revised_footnotes:
  - marker: a
    text: 'Oder: „damit sie ihr leuchten“. Wörtlich: „damit sie ihr scheinen“; auch „auf sie scheinen“ ist möglich.'
    reason: lexical_alternative
  revision_rationale: Die Revision korrigiert die räumlich missverständliche Wiedergabe des Dativs bei φαίνω und ersetzt die fehlerhafte Fußnotenformulierung durch idiomatische deutsche Alternativen. „Lampe“ gibt λύχνος präzise wieder und bewahrt die Metapher des griechischen Textes.
