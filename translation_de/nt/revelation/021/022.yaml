- from: Einen Tempel[a] sah ich in ihr nicht; denn der Herr, Gott, der Allmächtige, ist ihr Tempel, und das Lamm.
  to: Ich sah keinen Tempel[a] in ihr; denn der Herr, der Gott, der Allmächtige, und das Lamm sind ihr Tempel.
  rationale: Die Revision glättet nur deutsches Satzgefüge und Negation. Das Lamm wird durch die plurale Prädikation eindeutig in die Tempelaussage einbezogen. Damit wird die wahrscheinlich beabsichtigte koordinierte Aussage des griechischen Textes verständlich wiedergegeben, ohne die Singularform ἐστιν als Aussage über eine ausschließliche oder abgestufte Rolle auszudeuten. Die bestehende lexikalische Fußnote bleibt unverändert.
