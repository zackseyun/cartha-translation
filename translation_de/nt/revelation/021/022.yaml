source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: de
  text: Ich sah keinen Tempel[a] in ihr; denn der Herr, der Gott, der Allmächtige, und das Lamm sind ihr Tempel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtum“. Das griechische Wort bezeichnet besonders das innere Tempelheiligtum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: Tempel
  rationale: „Tempel“ ist im Deutschen die klarste und geläufigste Wiedergabe und bewahrt den Gegensatz zwischen einem sichtbaren Tempelgebäude und Gott sowie dem Lamm als Tempel der Stadt. Das spezifischere „Heiligtum“ wird in einer Fußnote genannt.
- source_word: οὐκ εἶδον
  choice: sah ich … nicht
  rationale: Die vorangestellte Akkusativgruppe „Einen Tempel“ bildet die griechische Hervorhebung natürlich im Deutschen ab; das Präteritum gibt den erzählenden Aorist knapp wieder.
- source_word: ἐν αὐτῇ
  choice: in ihr
  rationale: Das Pronomen bezieht sich auf die Stadt. Da „Stadt“ im Deutschen feminin ist, ist „in ihr“ zugleich grammatisch natürlich und quellennah.
- source_word: ὁ κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: der Herr, Gott, der Allmächtige
  rationale: Die appositionelle Folge der göttlichen Bezeichnungen bleibt erkennbar. „Der Allmächtige“ ist die etablierte, präzise Wiedergabe von παντοκράτωρ.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: ist ihr Tempel
  rationale: Die singularische Aussage des griechischen Textes wird unmittelbar bewahrt; „ihr“ verweist natürlich auf die grammatisch feminine Stadt.
- source_word: καὶ τὸ ἀρνίον
  choice: und das Lamm
  rationale: Die knappe, nachgestellte Koordination des Griechischen bleibt erhalten, ohne sie durch „ebenso“, „auch“ oder eine umgestellte Pluralkonstruktion stärker auszudeuten.
theological_decisions:
- issue: Bezug des Prädikats in „ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον“
  choice: 'Die singularische Formulierung wird beibehalten: „ist ihr Tempel, und das Lamm“.'
  alternative: „Der Herr, Gott, der Allmächtige, und das Lamm sind ihr Tempel.“
  rationale: Die gewählte Fassung folgt der griechischen Wortstellung und dem Singular ἐστιν, lässt aber durch das nachgestellte „und das Lamm“ dessen volle Einbeziehung in die Aussage bestehen. So bleibt die christologische Spannung des Textes erhalten, ohne sie syntaktisch zu glätten oder dogmatisch weiter auszuformulieren.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Anfangsstellung von „Einen Tempel“ hebt dessen völliges Fehlen hervor. Das Semikolon gliedert Wahrnehmung und Begründung; die ungewöhnlich knappe Schlusskoordination bewahrt bewusst die Form und Spannung des Ausgangstextes.
