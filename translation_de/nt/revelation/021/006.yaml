id: REV.21.6
reference: Revelation 21:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Diese Dinge sind Wirklichkeit geworden.[a] Ich bin das Alpha und das Omega, der Anfang und das Ende. Wer Durst hat, dem werde ich umsonst[b] aus der Quelle des Wassers des Lebens zu trinken geben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Sie sind geschehen«; traditionell auch: »Es ist geschehen.« Das griechische Verb steht im Plural.'
    reason: alternative_reading
  - marker: b
    text: 'Oder: »ohne Gegenleistung« beziehungsweise »als Geschenk«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Diese Dinge sind Wirklichkeit geworden
  rationale: Die griechische Perfektform steht im Plural und bezeichnet eingetretene beziehungsweise verwirklichte angekündigte Realitäten. Die Ergänzung „diese Dinge“ macht den im Griechischen vorausgesetzten Plural im Deutschen verständlich, ohne ihn zur traditionellen Singularform einzuebnen.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: das Alpha und das Omega
  rationale: Die griechischen Buchstabennamen bleiben als etablierter symbolischer Hoheitstitel der Offenbarung erhalten; die folgende Apposition erläutert ihre Bedeutung.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: der Anfang und das Ende
  rationale: Die geläufige Wiedergabe bewahrt sowohl die zeitliche als auch die zielbezogene Bedeutungsweite des Wortpaares.
- source_word: τῷ διψῶντι
  choice: Wer Durst hat, dem
  rationale: Die substantivierte Partizipialform wird in natürlichem modernem Deutsch als persönliche, allgemein gültige Zusage wiedergegeben.
- source_word: δώσω
  choice: werde ich … zu trinken geben
  rationale: „Geben“ bleibt erhalten; „zu trinken“ verdeutlicht im Deutschen die durch Quelle und Wasser eindeutig vorausgesetzte Ellipse.
- source_word: ἐκ τῆς πηγῆς
  choice: aus der Quelle
  rationale: „Quelle“ gibt πηγή natürlich wieder und bewahrt das Bild lebendig hervorströmenden Wassers.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: des Wassers des Lebens
  rationale: Die Genitivverbindung und das traditionelle biblische Bild bleiben erhalten, statt zu „lebensspendendem Wasser“ ausgedeutet zu werden.
- source_word: δωρεάν
  choice: umsonst
  rationale: Das Adverb bezeichnet eine Gabe ohne Bezahlung oder Gegenleistung. „Umsonst“ ist knapp, verständlich und in diesem Zusammenhang eindeutig.
theological_decisions:
- issue: Pluralische Wiedergabe der göttlichen Erklärung Γέγοναν
  choice: Diese Dinge sind Wirklichkeit geworden
  alternative: Es ist geschehen / Es ist vollbracht
  rationale: Die pluralische Form wird sichtbar bewahrt und auf die angekündigten Realitäten der neuen Schöpfung bezogen, ohne die Aussage auf eine einzelne Handlung zu verengen. Die Fußnote dokumentiert die traditionellere idiomatische Möglichkeit.
- issue: Bewahrung der Alpha-und-Omega-Bildsprache als göttlicher Titel
  choice: das Alpha und das Omega
  alternative: das A und das Z
  rationale: Die griechischen Buchstabennamen erhalten die charakteristische Bildsprache und die innerbiblischen Bezüge der Offenbarung, ohne zusätzliche dogmatische Festlegungen einzutragen.
- issue: Unentgeltlichkeit des Lebenswassers
  choice: umsonst
  alternative: kostenlos / als Geschenk
  rationale: Die Zusage wird als Gabe ohne Preis oder Gegenleistung wiedergegeben; die alternative Formulierung „als Geschenk“ wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; etablierte biblische Wendungen wie „Alpha und Omega“ und „Wasser des Lebens“ bleiben erhalten. Die ungewöhnliche pluralische Form von Γέγοναν wird im Haupttext verständlich entfaltet und in der Fußnote formal erläutert.
