id: REV.21.1
reference: Revelation 21:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: de
  text: Und ich sah einen neuen Himmel und eine neue Erde[a]; denn der erste Himmel und die erste Erde waren vergangen, und das Meer ist nicht mehr[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der frühere Himmel und die frühere Erde“. Wörtlich steht im Griechischen „der erste Himmel und die erste Erde“; gemeint sein kann die bisherige Ordnung im Gegensatz zur neuen.'
    reason: lexical_alternative
  - marker: b
    text: Das Meer kann hier wörtlich gemeint sein. In der Offenbarung kann es zugleich mit Chaos, Gefahr oder Trennung verbunden sein.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Der Aorist Indikativ von ὁράω wird als schlichtes Erzählpräteritum wiedergegeben; „ich sah“ ist im Deutschen klar und idiomatisch.
- source_word: οὐρανὸν ... γῆν
  choice: Himmel ... Erde
  rationale: Im kosmischen Zusammenhang bezeichnet das Wortpaar die geschaffene Welt und nicht nur den sichtbaren Himmel und das Land.
- source_word: καινὸν ... καινήν
  choice: neu ... neu
  rationale: „Neu“ bewahrt die Aussage von καινός, ohne festzulegen, ob vollständiger Ersatz oder Erneuerung gemeint ist.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: der erste Himmel und die erste Erde
  rationale: „Erste“ gibt πρῶτος unmittelbar wieder und bewahrt den Gegensatz zwischen der bisherigen und der neuen Ordnung.
- source_word: ἀπῆλθαν
  choice: waren vergangen
  rationale: Das Plusquamperfekt verdeutlicht, dass Himmel und Erde aus der Perspektive der geschauten neuen Welt bereits vergangen waren; „vergangen“ gibt ihr Verschwinden natürlich wieder.
- source_word: ἡ θάλασσα
  choice: das Meer
  rationale: Die konkrete Bezeichnung bleibt erhalten, ohne mögliche symbolische Bedeutungen in den Haupttext einzutragen.
- source_word: οὐκ ἔστιν ἔτι
  choice: war nicht mehr
  rationale: Die idiomatische deutsche Formulierung gibt die Negation mit ἔτι wieder. Das Präteritum fügt sich natürlich in den Bericht der Vision ein, auch wenn das Griechische formal Präsens hat.
theological_decisions:
- issue: Art des neuen Himmels und der neuen Erde
  choice: „Neu“ ohne Festlegung auf Ersatz oder Umgestaltung
  alternative: vollständiger Ersatz oder Erneuerung der bestehenden Schöpfung
  rationale: καινός bezeichnet Neuheit, doch der Vers entscheidet nicht ausdrücklich zwischen diesen Deutungen.
- issue: Bedeutung des nicht mehr vorhandenen Meeres
  choice: Das konkrete Bild bleibt im Haupttext unaufgelöst
  alternative: wörtliches Fehlen des Meeres oder symbolische Beseitigung von Chaos, Gefahr beziehungsweise Trennung
  rationale: Die Offenbarung verwendet symbolisch aufgeladene Bilder; der Vers selbst erklärt dieses Bild jedoch nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit vertrauter biblischer Bildsprache. Die Satzstruktur bleibt nahe am griechischen Text, ohne im Deutschen steif zu wirken. Alle Anmerkungszeichen sind im Haupttext gesetzt.
