id: REV.21.21
reference: Revelation 21:21
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: de
  text: Und die zwölf Tore waren zwölf Perlen; jedes einzelne Tor bestand aus einer einzigen Perle. Und die breite Straße der Stadt war aus reinem Gold, wie durchsichtiges Glas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνες
  choice: Tore
  rationale: Im architektonischen Zusammenhang des neuen Jerusalem bezeichnet πυλών Tore beziehungsweise Toranlagen; „Tore“ ist hier die natürliche und traditionsunabhängige deutsche Wiedergabe.
- source_word: μαργαρῖται / μαργαρίτου
  choice: Perlen / Perle
  rationale: μαργαρίτης bezeichnet eindeutig eine Perle. Der Wechsel vom Plural zum Singular wird bewahrt.
- source_word: ἀνὰ εἷς ἕκαστος
  choice: jedes einzelne
  rationale: Die distributive und nachdrückliche Formulierung wird idiomatisch wiedergegeben und hebt hervor, dass dies für jedes Tor einzeln gilt.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: bestand aus einer einzigen Perle
  rationale: ἐξ bezeichnet hier Stoff beziehungsweise Ursprung. „Bestand aus“ bleibt näher am griechischen Ausdruck als das ergänzende „war gemacht aus“, während „einzigen“ die Betonung von ἑνός wiedergibt.
- source_word: πλατεῖα
  choice: breite Straße
  rationale: Das substantivierte πλατεῖα bezeichnet eine breite Straße oder öffentliche Verkehrsfläche. „Breite Straße“ erhält die im Wort angelegte Bedeutung und vermeidet die stärkere Festlegung auf einen Platz.
- source_word: χρυσίον καθαρὸν
  choice: reinem Gold
  rationale: Die feste deutsche Verbindung „reines Gold“ gibt Material und Reinheit natürlich wieder; mit „aus“ steht der Dativ.
- source_word: ὡς ὕαλος διαυγής
  choice: wie durchsichtiges Glas
  rationale: διαυγής bezeichnet klare Durchsichtigkeit. „Durchsichtiges Glas“ bewahrt das auffällige visionäre Bild unmittelbar.
theological_decisions:
- issue: Gestalt der mit πλατεῖα bezeichneten öffentlichen Fläche
  choice: breite Straße der Stadt
  alternative: Straße der Stadt; Platz der Stadt
  rationale: Die Entscheidung ist vor allem lexikalisch. „Breite Straße“ erhält die Grundbedeutung, ohne die visionäre Stadtanlage über das Griechische hinaus genauer festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die betonte Zuordnung jedes Tores zu genau einer Perle bleiben erhalten. Keine Fußnote ist nötig, da „breite Straße“ die lexikalische Weite von πλατεῖα im Haupttext angemessen abbildet.
