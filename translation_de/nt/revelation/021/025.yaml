  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: de
  text: Und ihre Tore werden tagsüber niemals geschlossen, denn dort wird es keine Nacht geben.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Griechische verwendet eine nachdrückliche Verneinung: „Ihre Tore werden bei Tag keinesfalls geschlossen werden.“'
    reason: lexical_alternative
  - marker: b
    text: Die fehlende Nacht wird als Begründung für die niemals geschlossenen Tore genannt.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Und
  rationale: Der einfache Anschluss führt die Beschreibung der Stadt aus dem vorhergehenden Vers fort.
- source_word: οἱ πυλῶνες αὐτῆς
  choice: ihre Tore
  rationale: πυλῶνες bezeichnet im Zusammenhang einer Stadt deren Tore beziehungsweise Toranlagen. Das feminine Pronomen wird im Deutschen natürlich mit „ihre“ auf die grammatisch feminine „Stadt“ bezogen, ohne dadurch eine zusätzliche Personifizierung einzuführen.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: werden niemals geschlossen werden
  rationale: Die Verbindung οὐ μή mit dem Aorist Konjunktiv drückt eine nachdrückliche Verneinung mit Zukunftsbezug aus. „niemals“ gibt diese Verstärkung klar und idiomatisch wieder.
- source_word: ἡμέρας
  choice: tagsüber
  rationale: Der Genitiv wird temporal-adverbial gebraucht. „tagsüber“ ist modernes, natürliches Deutsch und wahrt den Gegensatz zur folgenden Nacht.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: denn dort wird es keine Nacht geben
  rationale: „denn“ bildet die begründende Funktion von γάρ ab; die Existenzkonstruktion „wird es ... geben“ entspricht dem Sinn von ἔσται.
theological_decisions:
- issue: Grad der Personifizierung des neuen Jerusalem
  choice: „ihre Tore“ als regulärer grammatischer Rückbezug auf die feminine „Stadt“
  alternative: Eine ausdrücklich personifizierende Umschreibung, etwa „die Tore der Braut“
  rationale: Das griechische αὐτῆς stimmt grammatisch mit der femininen Stadtbezeichnung überein. Auch im Deutschen ist „ihre“ der natürliche Rückbezug, ohne dass in diesem Satz die Brautmetaphorik zusätzlich hervorgehoben werden muss.
- issue: Begründungszusammenhang zwischen offenen Toren und fehlender Nacht
  choice: γάρ ausdrücklich mit „denn“ wiedergeben
  alternative: Die Sätze nur mit einem Gedankenstrich oder „und“ verbinden
  rationale: Der Ausgangstext kennzeichnet das Fehlen der Nacht ausdrücklich als Begründung. Diese Beziehung soll weder abgeschwächt noch theologisch weiter ausgedeutet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „tagsüber“ vermeidet das heute leicht missverständliche „bei Tag“; das Futur und „niemals“ bewahren die starke zukünftige Verneinung des griechischen Textes.
